- pgno: 496
  md: '# Highlights


    Many games have a need to execute tasks at regular intervals.

    Threads are a possible solution, but they can be a poor choice due

    to their nondeterministic nature, the complexities of their

    interactions, and the high overhead of context switching. On the

    other hand, a scheduler can be implemented to run in a single

    thread and execute tasks at a specific point in the frame. Its tasks

    will execute in a single context under full control of the application.


    This gem presents a basic lightweight object-oriented scheduler

    that implements limited cooperative multitasking between tasks in

    a single thread. Possible applications of this scheduler include AI,

    audio, and environmental effects. The complete code for the

    scheduler described here is available on the accompanying CD.'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 25.1 Overview


    The scheduler implemented here is designed to execute a list of tasks one at a
    time at a particular point in a frame or time step. Each task has a timer maintained
    by the scheduler, and all tasks whose timers have expired are queued to be executed
    in that frame. Tasks are executed serially by the scheduler in the scheduler''s
    thread, and each task runs to completion. Thus, tasks are never interrupted by
    the scheduler or by other tasks, and there is no need for synchronization among
    tasks.


    Order of execution within a frame is arbitrary in this implementation, but the
    order can be controlled by implementing a priority system. Other additional features,
    such as load balancing, are not implemented here, but are described later.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 25.2 Task Functionality


    The task as seen by the scheduler is very simple. There is an initialization function,
    a cleanup function, and a function to execute the task. To provide the interface
    for this functionality, tasks are derived from the base class Task, which has
    the virtual functions Start(), Stop(), and Execute().


    The Start() function is called immediately after the task is added to the scheduler''s
    task list. Its purpose is to allow the task to initialize itself before it begins
    any execution. It is safe (as far as the scheduler is concerned) to remove the
    task from the scheduler''s task list in the Start() function.


    The Stop() function is called immediately after the task is removed from the task
    list. Its purpose is to allow the task to clean itself up. Once the Stop() function
    is called, the scheduler no longer references the task, so it is safe (as far
    as the scheduler is concerned) to destroy the task anytime during or after the
    call to the Stop() function. It is also safe to re-add the task to the scheduler''s
    task list from inside the Stop() function.


    The Execute() function is called periodically by the scheduler according to the
    task''s period. The timer is maintained by the scheduler. When a task is finished
    executing, it returns one of the following values that the scheduler uses to manage
    the task:


    +   - ACTIVE. If this result is reported, the task is requeued for execution again
    according to its period. This is the normal result.

    +   - AGAIN. If this result is reported, the task is requeued to run again in
    the next frame, regardless of its period. This result is intended to indicate
    that the task could not finish successfully and should be executed again as soon
    as possible. It could also be used to force the task to be executed every frame,
    but'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'it is better to set the period appropriately instead.


    +   ■ INACTIVE. If this result is reported, the task is removed from the scheduler''s
    task list. The scheduler removes all references to the task and then calls the
    task''s `Stop()` function.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# 25.3 Scheduler Functionality


    The scheduler class maintains a list of tasks and schedules them for execution
    according to their periods. There can be more than one instance of the scheduler
    class, though for the sake of simplicity, instances cannot be copied or assigned
    in this implementation, and tasks do not keep track of which scheduler is executing
    them. In order to determine when tasks are to be executed, the scheduler maintains
    a timer for each class. Each frame, the timers are updated, and all tasks whose
    timers have expired are executed in an arbitrary order. The scheduler also provides
    the ability to suspend and resume executions of tasks and to change the period
    of a task.


    Tasks are added to a scheduler''s execution list by the `Add()` function. The
    `Add()` function also specifies how often the task is executed. If the task being
    added is already in the scheduler''s task list, an error is returned. Tasks may
    be added at any time, including while tasks are being executed. The task''s timer
    is initialized when the task is added. As described above, a task''s `Start()`
    function is called after it is added.


    Tasks are removed from the scheduler''s execution list by the `Remove()` function.
    Tasks can be removed at any time. If the task being removed is not in the scheduler''s
    task list, an error is returned. Tasks are not executed once they are removed,
    even if they are removed during a frame in which they are scheduled to be executed.
    As described above, a task''s `Stop()` function is called after it is removed.


    When the `ExecuteTasks()` function is called, all tasks that are ready to run
    are executed serially in an arbitrary order. The `deltaTime` parameter to the
    `ExecuteTasks()` function indicates the amount of time that has passed since the
    last time the function was called. This value is used to update the tasks'' timers
    in order to determine when tasks become ready to be executed. The'
  merge: -1
  img_proc: true
- pgno: 501
  md: 'ExecuteTasks() function is intended to be called once per frame, but it is
    possible to call as often as desired. As long as the deltaTime variable is accurate
    or at least reasonable, the tasks will execute with the intended period. The exceptions
    are tasks with a period of PERIOD_EVERY_FRAME and tasks that return the value
    AGAIN. These tasks are executed whenever ExecuteTasks() is called.


    Tasks are suspended and resumed using the Suspend() and Resume() functions. Suspended
    tasks are not executed and their timers are not updated. If the task being suspended
    or resumed is not in the scheduler''s task list, an error is returned. This differs
    from Add() and Remove() in that the task remains in the scheduler''s task list,
    the task''s Start() and Stop() functions are not called, and the task''s time
    is frozen until Resume() is called.


    The period of a task can be changed by the SetPeriod() function. If the task is
    not in the scheduler''s task list, PERIOD_INVALID is returned. When a task''s
    period is changed, its timer is reset. A period of PERIOD_EVERY_FRAME causes the
    task to execute every frame. Calling SetPeriod() with an invalid period (less
    than 0), does not change the period and returns the value PERIOD_INVALID.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# 25.4 Implementation


    The data structure used by the scheduler is very straightforward. A pointer to
    each task along with a timer and some state information is stored in a vector.
    An STL container is chosen in order to simplify the implementation. A fixed-size
    array would alleviate memory allocation issues, but then additional logic would
    be necessary in order to prevent overflow.


    Other container types might be considered depending on how the scheduler is used.
    The tasks are not sorted because it is assumed that sorting the tasks would be
    more time-consuming than simply scanning all entries to find tasks to execute.
    If there are a very large number of tasks and only a few are executed each frame,
    then it might pay to sort the tasks.


    Task execution is performed in three phases. First, the timer for each task is
    decremented according to the amount of time that has passed. Then, for each task,
    if the timer is less than or equal to zero, the task is executed (unless it is
    suspended or marked for removal), and the timer is reset to its period. Finally,
    all tasks marked for removal are removed. The purpose of the three phases is to
    avoid problems that might arise when one task modifies another task, or adds or
    removes tasks from the scheduler.'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# ## 25.5 Additional Functionality


    Some additional features are not implemented here for the sake of simplicity.
    In this implementation, tasks are run during each frame in an arbitrary order.
    It might be advantageous to give tasks a priority so that they can be executed
    in a certain order with respect to the other tasks that are executed in the same
    frame. In order to accomplish this, the priorities of the tasks are stored in
    the task list and the tasks can be sorted by priority or stored in a data structure
    that supports a priority scheme.


    In some situations, the amount of time available for executing tasks might be
    limited or budgeted. In this case, the `ExecuteTask()` function could have an
    additional parameter specifying the budgeted time, and the scheduler would execute
    tasks until the budget is used up. The task''s `Execute()` function could have
    an additional parameter specifying the time remaining, allowing the task itself
    to limit the amount of time it uses. Budgeting time could also work in conjunction
    with task priorities, reducing the latency of higher priority tasks. However,
    it must be noted that this simple scheduling algorithm can become inadequate in
    some situations.'
  merge: -1
