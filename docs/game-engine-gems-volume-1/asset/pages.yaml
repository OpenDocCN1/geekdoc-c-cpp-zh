- pgno: 403
  md: 'distance R. This allows the consideration of only those occlusions that are
    nearby, i.e., in the neighborhood sphere of radius R. The particular value of
    R can be set by the application developer. When we increase this value, shadows
    due to ambient occlusions get larger and softer.


    To define the fuzzy measure that increases from zero to one in [0,R], we can use
    a simple polynomial


    $$\mu\left(D\right)=\left(\frac{D}{R}\right)^\alpha.$$


    Using this fuzzy measure, the reflected radiance of the shaded point can be expressed
    in the following way:


    $$L^e(s)=a(s)\left[\frac{R}{\pi}\int_\Omega\mu(D(\mathbf{N},\boldsymbol{\omega}))d\boldsymbol{\omega}+\frac{1}{4}\int_\Omega(1-\mu(D))L^e(\mathbf{N},\boldsymbol{\omega})d\boldsymbol{\omega}\right]
    = a(s)[L^eO(s)+I(s)].$$


    The first term of this expression is the ambient occlusion of the shaded point:


    $$O(\mathbf{s})=\frac{1}{\pi}\int_\Omega\mu\left(D(\boldsymbol{\omega})\right)(\mathbf{N}_s\cdot\boldsymbol{\omega})d\boldsymbol{\omega}.$$


    The second term is the irradiance due to nearby indirect lighting:


    $$I(s)=\frac{1}{\pi}\int_\Omega\left[1-\mu(D(\boldsymbol{\omega}))\right]L^e(\mathbf{N},\boldsymbol{\omega})d\boldsymbol{\omega}.$$


    This integral is traced back to the ambient occlusion. Replacing occluder radiance
    \(L''(\boldsymbol{\omega})\) by the average of surface radiance values in the
    neighborhood of the shaded point \(\tilde{L}^e(\mathbf{s})\), we can express the
    irradiance as


    $$I(s)\approx\frac{1}{\pi}\int_\Omega\left[1-\mu(D(\boldsymbol{\omega}))\right]\tilde{L}^e(\mathbf{s})(\mathbf{N}\cdot\boldsymbol{\omega})d\boldsymbol{\omega}=\tilde{L}^e(\mathbf{s})(1-O(s)).$$'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# 18.3 Screen-Space Representation of the Scene


    In global illumination computations, we need to know the geometry of other parts
    of the scene and the radiance values of points visible from the currently shaded
    point. However, GPUs are built according to the concept of local illumination
    and prefer shading each point independently of other parts of the scene. The only
    additional information that can be used is stored in textures.


    Screen-space techniques assume that the height field defined by the current content
    of the depth buffer is an appropriate representation of the screen geometry, and
    the color buffer stores the radiance values of the represented points. Of course,
    the content of these buffers represents only the surfaces visible from the camera,
    but for local methods like ambient occlusion, this restriction is usually acceptable.
    In screen space, viewing rays are parallel to the z-axis, which greatly simplifies
    calculations. However, the transformation to this space is not angle and distance
    preserving (it is not even affine); thus, this space is not appropriate for angle
    and distance computation.


    If we need to compute angles and distances, we should rather work in camera space,
    which means that we store camera-space z values and also the camera-space normal
    vectors of the visible points in textures. The transformation from world space
    to camera space is angle and distance preserving since it is basically a translation
    and a rotation; thus, these spaces are equivalent when distances and angles are
    computed. The disadvantage of camera space is that in the case of a perspective
    camera, the viewing rays are not parallel, but rather intersect each other at
    the origin of the coordinate system.


    Thus, to solve the distortion problem of screen space and also keep the advantages
    of parallel rays, we work in camera space but use a quasi-orthogonal approximation.
    When large scale information is obtained, we follow the structure of camera space.'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'However, when smaller neighborhoods are explored, which happens during the
    evaluation of the ambient occlusion integral, we assume that in each small neighborhood,
    the viewing rays are parallel with the z-axis. This is an approximation, but is
    a reasonable compromise between accuracy and simplicity.


    Indirect illumination computation requires those points that are visible from
    the shaded point, which can usually be obtained with ray tracing. Unfortunately,
    ray tracing is quite expensive computationally even for height fields, so we replace
    it by a simple test. As the shaded point belongs to the set of points that are
    visible from the camera, we require that the occluder point also be visible from
    the camera. Two points are visible from each other if the ray originating at one
    of the points has no intersection with any surfaces before it arrives in the other
    point. The requirement of being in the visible part of the height field, on the
    other hand, means that the ray intersects the surface zero, two, four, etc., times.
    If the neighborhood is small, and at most one intersection is possible, then the
    two criteria are similar.'
  merge: -1
  img_proc: true
