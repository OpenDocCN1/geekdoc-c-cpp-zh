  md: '# 7.4 Algorithm Overview


    Okay, here''s the view from orbit:


    +   1. Initialize the cluster set.

    +   2. Find the cluster with the largest error and divide it into two clusters.

    +   3. Reassign all samples to the closest cluster.

    +   4. Repeat from Step 2 until all cluster errors are zero or the target of N
    palette entries is reached.


    The mental model I work with is that a palette is a bunch of points in space,
    and each original sample gets mapped to one of those points in space. These are
    little clouds, or clusters, of samples surrounding each representative value in
    the palette. Here''s a simplified way of writing this in C++:


    ```

