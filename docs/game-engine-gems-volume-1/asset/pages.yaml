- pgno: 286
  md: '# 11.6 Memory Pool Eviction


    When the memory pool is oversubscribed in our streaming system, we often need
    to select a candidate for eviction. Our memory pool logic implements this by assigning
    each resource in the streaming system an "eviction metric". The calculation of
    this eviction metric is determined solely by application-specific logic. Once
    per frame, we evict the items in the memory pool with eviction metrics higher
    than the lowest eviction metrics of resources that are not in the memory pool.
    Because the GPU serializes all movement in the memory pool, eviction is simply
    a case of marking the evicted items'' chunks as being free and therefore ready
    for reuse.


    When calculating a sensible eviction metric, it is important to consider the possibility
    of cache thrashing. For an excellent summary of cache replacement algorithms suitable
    for a streaming memory pool see [3].'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 11.7 Platform-Specific Considerations


    # PlayStation 3


    The PlayStation 3 memory architecture is split into main (CPU) and local (GPU)
    memory. The CPU has slow access to local memory, so it is important to place the
    staging buffer in main memory even if the memory pool is placed in local memory.


    The PlayStation 3 has a very straightforward API for carrying out GPU memory copies.
    An important consideration is that some small care needs to be taken to ensure
    that a GPU memory copy of a resource is fully complete before that resource is
    used for rendering.


    # Xbox 360


    The Xbox 360 has a unified memory architecture within which the GPU can be used
    to copy memory using its `memexport` API. However, when using `memexport`, the
    size of the memory pool that can be created and used is limited to 64 MB. Using
    the GPU to copy memory on the Xbox 360 has the advantage of having a significantly
    higher data throughput than when using the CPU. The GPU copies do bypass the CPU
    caches, however, so care needs to be taken to ensure that coherency is maintained
    with any memory that the CPU directly accesses. For example, the staging buffer
    should either be in some form of non-cacheable memory, or when writing to the
    staging buffer, we should explicitly flush the cache lines down to memory.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 11.8 Future Work


    # Multithreading Considerations


    On our target platforms, an efficient method to balance the load of render call
    submission across multiple processing cores is to generate one or more command
    buffers per core that are combined and submitted to the GPU from a single main
    rendering thread. When doing this and using a GPU-managed memory pool, we need
    to take care that each core maintains a consistent view of the contents of the
    memory pool. This should be straightforward if the memory pool is updated on the
    main rendering thread at a time when no multithreaded submission is taking place,
    such as at the start or end of a frame.


    # Non-GPU Extensions


    The pattern used in this gem might be extended to other processors that have the
    ability to move data in memory, but which operate concurrently with the CPU. The
    PlayStation 3 SPU is an example use case. This group of high performance processors
    can copy memory using a DMA and can be driven using an ordered queue of jobs.
    Many PlayStation 3 graphics engines use resources that are read only by the SPU
    to create input data for the GPU. The SPU could also be used to manage any memory
    pool containing these resources so that streaming and defragmentation logic is
    simplified.


    # Better Defragmentation


    Although the defragmentation system outlined here is effective for our purpose,
    in the future, it would be worth researching the efficiency of other defragmentation
    algorithms. A more efficient algorithm would have the advantage of reducing GPU
    memory bandwidth and removing potential stalls when loading data into the'
  merge: -1
  img_proc: true
