  md: 'This quadrature is an approximation, and its error decreases if new sample
    points are added. However, computing the formula with many sample points reduces
    rendering speed. Thus, we consider two techniques, including weighted uniform
    sampling and interleaved sampling, that reduce the computation error without performance
    degradation.


    *Weighted uniform sampling* [7] exploits the fact that if there is no occlusion
    in the neighborhood sphere, then ambient occlusion factor should be equal to one.
    If it is not, then the difference is due to the approximation error. So we compute
    not only the ambient occlusion from the samples but also the estimate of this
    factor assuming no occlusion at all. Ignoring occlusions, this factor is


    \(1 \approx \frac{R^2}{n} \sum_{i=1}^n h(x,y_i, z_i^{min}, \min(z_i^{sci}, z_i^{place}))\)


    Dividing the formula for ambient occlusion by this approximation, we can compensate
    for the quadrature error; thus, a better estimate of ambient occlusion is


    \(O(s) \approx \frac{\sum_{i=1}^n h(x,y_i, z_i^{min}, \min(z_i^{sci}, z_i^{place}))}{\sum_{i=1}^n
    h(x,y_i, z_i^{min}, \min(z_i^{sci}, z_i^{place}))}\)


    *Interleaved sampling* [3] takes advantage of the estimates in neighboring pixels.
    The method discussed so far has some error in each pixel, depending on the particular
    samples used. If we took different random numbers in neighboring pixels, dot noise
    would be present. Using the same random numbers in every pixel would make the
    error correlated and replace dot noise by stripes. Unfortunately, both stripes
    and pixel noise are quite disturbing. Interleaved sampling uses different sets
    of samples in the pixels of a 4x4 pixel pattern. The errors in the pixels of a
    4x4 pixel pattern are uncorrelated, which can be successfully reduced by a lowpass
    filter of the same size. When implementing the low-pass filter, we also check
    whether the depth difference between the current and neighboring pixels exceeds
    a given limit. If it does, we do not'
