- pgno: 126
  md: 'War. Ladders are mobile, meaning they could be packed up and moved to other
    sections of wall. Ladders also have a strict requirement allowing only humans.
    While horses could charge up ramps to fight on top of walls, ladders were strictly
    horse-free zones. Path regions also presented us with the opportunity to solve
    the issue of positioning actors directly in front of a ladder prior to climbing.
    We solved this by making the tile in front of the ladder''s base a one tile large
    path region. This ensured an actor would walk to the tile in front of the ladder
    before climbing. Ladders, therefore, qualified as not only a unique area, but
    also created the opportunity for a separate path region that we used to handle
    actor positioning for ladder climbing.


    # Terrain Analysis


    Once we have our design established, we use it in the next portion of the preprocess
    phase, terrain analysis. Knowledge of a game world is incredibly useful to AI
    programmers, and terrain analysis is vital to gaining it. It is a collection of
    algorithms that execute before a game begins and are refined at run time in order
    to first analyze, then organize, game world data. Programmers then use it creatively
    to imply that actors have a human-like understanding of their world.


    Path regions are created by iterating through each tile, categorizing, and then
    clumping contiguous tile types together. These clumps are then labeled by their
    path types and defined as a path region. It is then necessary to provide an indicator
    of a region''s location in the world. To accomplish this, we position a beacon
    point at the center of mass of the path region. Remember that regions aren''t
    necessarily nice and neat rows of tiles. A connected forest of trees could spiral
    out like a spider web full of sparse, but connected trees. Thus, the true center
    of mass for the region could be a point inside another region. In that case the
    beacon point is positioned by finding the closest point inside our region to that
    center.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'These regions, or clumps of contiguous tiles, are easy for us to visualize
    and understand, but there is a problem: if a path region is too large, using algorithms
    like A* will have difficulty producing good high-level paths. Consider a path
    region comprising an ocean that surrounds an island. When we want to move a ship
    from one side of the world to the other around the island, we have to communicate
    to the engine that just because it''s the same ocean doesn''t mean it''s a simple
    path. If the ocean was one region, there would be nothing to navigate. The low-level
    pathfinder would think its start and end destination was the same region, so it
    must be a simple path. Not so. We would want there to be regions that took our
    ship around the island, regardless of it being the same ocean. The key to doing
    this is to divide up the regions using a world grid, which effectively normalizes
    the size of all regions.


    Using our path region clumps, some of which are gigantic and some of which are
    small, we lay a grid over the world. Large and small regions alike get subdivided
    by this grid, making many of the regions split at least once. Choosing the size
    of the grid takes some experimentation, most likely, after the entire high-level
    pathfinding system is complete. For the sake of starting somewhere, let''s use
    a map that is 1000 × 1000 tiles, and a grid resolution that is 10 × 10 Given a
    flat map of just grass, we would have many grass regions that contained 100 tiles
    each. That isn''t an aggressive size, and it''s likely a million tile map wouldn''t
    have larger regions, but it''s a starting point. Be certain to play with the resolution
    numbers, adjusting them up and down depending on map size, complexity, or performance.
    Also, it''s important to store the world grid position (black lined squares in
    Figure 4.2) within the path region as we''ll find multiple uses for it later,
    such as during the fuzzy pathing phase or when recomputing path areas due to world
    changes.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_128_0.png)


    Figure 4.2: Path regions with a world grid overlay and IDs for each path region.
    Notice how the world grid boxes contain multiple regions inside them, and that
    regions like the ocean are divided up by the world grid into many separate regions.


    Why don''t we just make the resolution such that we have huge regions? If the
    number is too large, as we saw from the ocean and island example, we''ll miss
    some navigation improvements and performance gains. The key to this system is
    the one-two punch of first high-level (fuzzy) paths followed by detailed level
    paths. Since detailed paths are more computationally expensive in large search
    spaces, giant regions wouldn''t save us as much CPU time during the detailed pathfinding
    phase. Conversely, if the grid forces tiny regions, then performance gains are
    reduced be cause the search space again grows. There is always a sweet spot—don''t
    discount the importance of finding it.


    The grid, as illustrated in Figure 4.2, shows how we can predict, within some
    small error amount, the distance between regions. No region spans half the map.
    We know the largest size, and we can make cost estimates in pathfinding based
    on these assumptions. If one region was gigantic and the others were small, it
    would be difficult to know if one was traversing a small portion of the gigantic'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'region or traversing the longest possible distance across it. Keeping path
    regions sliced into a controlled grid size keeps the unknown traversal cost so
    low that we can predict the approximate path planning performance impact.


    # Adjacent Regions


    In order to use all the path regions (as shown in Figure 4.2) to navigate the
    map, we first need to tie them together in a graph. This is done by iterating
    through every tile, finding the tile''s region, and finding the regions left,
    right, up, and down from the tile. If the region on any of the sides does not
    match the tile''s region, we create an adjacency structure for both regions. That''s
    fairly straightforward for left, right, up, and down, but we also need to handle
    diagonal connections.


    Diagonals require a special adjacency rule because movement through them actually
    traverses neighboring tiles. Notice in Figure 4.3 that to move from region 2 to
    region 1, most actors would have some portion of them travel through 3 and 4 on
    the way. If region 3 or 4 is invalid for the actor, this diagonal must be off
    limits. Since we don''t know what actors are going to use the connection, we need
    to store them somewhere and check them during high-level pathing.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_130_0.png)


    Figure 4.3: Example of diagonal connections between regions.


    We don''t necessarily always want to store diagonal connections. We only want
    to store them if the only connection between two adjacent regions is through a
    diagonal move. Since regions could be oddly shaped with multiple connection points
    to adjacent regions, there may be more than one diagonal connection point from
    region 2 to region 1. We need to store each instance of the diagonal connections
    so that pathfinding can check the boundary regions to see if the move is legal.


    Do not keep any diagonal connections between two regions if a non-diagonal connection
    is available. Diagonal connections are only a last-case connection situation since
    they factor in surrounding regions during the pathing of actors. Again, even if
    diagonal connections have been found between regions 2 and 1, then a non-diagonal
    connection between regions 2 and 1 is found, the diagonal connection information
    must be thrown out.


    Each region should contain some structure per adjacency such as that shown in
    Listing 4.2.


    # Listing 4.2: Regions should contain a list of adjacent regions'
