  md: '# Chapter 20: A Deferred Decal Rendering Technique


    Listing 20.1: This code determines the decal-space coordinates for the fragment
    being rendered and transforms them into texture coordinates for the decal. The
    RT_Depth texture contains depth values for the viewport, the worldToDecal constant
    is the inverse of the decal''s 4x4 matrix transform from decal space to world
    space, and the recipDecalSize constant is 1/s, where s is the size of the decal
    in the scene.

    Listing 20.2: This vertex shader scales a unit cube to the actual size of the
    decal and translates it to the decal''s world-space position.

    Listing 20.3: The absolute value of the decal-space z-coordinate of the fragment
    position is scaled to the size of the decal and used as a fade-out parameter for
    the decal color. As before, the recipDecalSize constant is 1/s, where s is the
    size of the decal in the scene.

    Listing 20.4: This code demonstrates how the normal of the underlying surface
    can be used to adjust texture coordinates in such a way that a decal wraps around
    curves and corners. The RT_Normal texture contains normal vectors for the viewport
    encoded in the RGB channels.'
