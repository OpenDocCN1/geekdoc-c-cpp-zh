  md: '\(\beta = 0.4608T - 0.04586\)

    \(C_1 = \beta(2\bar{\lambda}^\alpha)\)

    \(T_A = e^{-C_1 M}\)


    The value of \(\alpha\) may be set to 1.140 for rural environments. For better
    accuracy, it''s really 1.0274 for wavelengths less than 500 nm, and 1.2060 otherwise.


    We have computed the amount of light transmitted by Rayleigh and aerosol effects
    for each wavelength, which will give us our direct sunlight. For ambient sunlight,
    we also need to compute the scattered light. Scattered sunlight is a little trickier.
    First, we need to compute an aerosol scattering transmission term \(T_{As}\),
    an aerosol absorption transmission term \(T_{Aa}\), the log of an aerosol asymmetry
    factor \(A\), a constant \(F_S\) and a constant \(C_2\):


    \(\Omega = 0.945e^{-0.095 \log(\lambda/4)^2}\)

    \(T_{As} = e^{-\Omega C_1 M}\)

    \(T_{Aa} = e^{(\Omega - 1.0) C_1 M}\)

    \(C_2 = T_{Aa} \cos Z\)

    \(A = \log 0.35\)

    \(A_{FS} = 1.459A + 0.1595A^2 + 0.4129A^3\)

    \(B_{FS} = 0.0783A - 0.3824A^2 - 0.5874A^3\)

    \(F_S = 1 - \frac{1}{2}e^{-A_{FS} \cos Z - B_{FS} \cos^2 Z}\)


    The scattered light term ray \(D_{ray}\) for Rayleigh scattering is then given
    by


    \(D_{ray} = \frac{C_2 \left(1 - T_R^{0.95}\right)}{2}\)'
