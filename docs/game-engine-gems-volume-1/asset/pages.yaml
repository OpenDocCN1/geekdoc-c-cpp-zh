- pgno: 401
  md: '# 18.2 A General Ambient Illumination Model


    Let us assume that the surfaces are diffuse. According to the rendering equation,
    the reflected radiance L^r at a shaded point s can be obtained as an integral
    of directions ω running over the unit hemisphere Ω above the surface:


    L^r(\mathbf{s}) = \int_{\Omega} L^{in}(\mathbf{s}, \boldsymbol{\omega}) \frac{a(\mathbf{s})}{\pi}
    (\mathbf{N}_s \cdot \boldsymbol{\omega}) d\boldsymbol{\omega} .


    where a is the albedo of the diffuse surface, N_s is the unit normal at the shaded
    point, and L^{in}(\mathbf{s}, \boldsymbol{\omega}) is the incident radiance of
    the shaded point from direction \boldsymbol{\omega}.


    If an occluder point o is visible from s in the direction \boldsymbol{\omega}
    (see Figure 18.1) and the space is not filled with participating media, then the
    incident radiance is equal to exiting radiance L^r(o). If no surface is seen,
    then shaded point s is said to be open in this direction, and the incident radiance
    is ambient intensity L^a. However, this does not meet our intuition and everyday
    experience that the effect of distant surfaces is replaced by their average. This
    experience is due to the fact that the actual space is not empty but is filled
    with a participating medium. If its extinction coefficient is \sigma and its albedo
    is 1, then the radiance along a ray of direction \boldsymbol{\omega} changes according
    to the volumetric rendering equation


    L^{in}(\mathbf{s}, \boldsymbol{\omega}) = e^{-\sigma D} L^r(\mathbf{o}) + (1 -
    e^{-\sigma D}) L^a ,'
  merge: -1
  img_proc: true
- pgno: 402
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_402_0.png)


    Figure 18.1: The shaded point s is the center of the neighborhood sphere. The
    radius of the sphere is R. Those directions ω where there is no intersection closer
    than R are called open. Point o is an intersection closer than R.


    where D is the distance between the shaded and the occluder points. Note that
    in this equation factor μ(D)=1-e^(-σD) and its complement 1-μ(D)=e^(-σD) express
    the effects of the ambient lighting and of the occluder on the shaded point, respectively.
    The effect of the occluder diminishes with the distance. The function μ is a fuzzy
    measure that defines how strongly direction ω belongs to the set of open directions
    based on distance D of the occlusion at this direction.


    The exponential function derived from the physical analogy of participating media
    has a significant drawback [2]. As it is nonzero for arbitrarily large distances,
    very distant surfaces need to be considered that otherwise have a negligible effect.
    Thus, for practical fuzzy measures we use functions that are nonnegative, monotonically
    increasing from zero, and reach one at the finite'
