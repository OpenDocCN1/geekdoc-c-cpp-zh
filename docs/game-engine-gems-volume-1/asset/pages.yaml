- pgno: 505
  md: '# Overview


    With today''s high-powered graphics and audio hardware, developing a game is becoming
    more akin to producing a blockbuster movie. Real-time ragdoll physics are the
    new stunt men, and particle systems are the new pyrotechnics. With so many sexy
    components required to bring a game engine together, it''s not surprising that
    little treatment is given to the management of game state.


    When the user clicks the mouse button or presses the left analog stick of a gamepad,
    the state of the game is what determines whether the user intended to fire his
    avatar''s weapon or select the "Quit" option from the menu. The game state determines
    whether the graphics hardware should render the game screen or the inventory menu.
    Whether NPCs should execute their next animation frame or just wait around for
    the next game loop iteration is due in large part to the game''s state.


    Game state management can be made streamlined and elegant using an implementation
    of the observer design pattern. [1] The observer pattern provides a way for instances
    of classes (subjects) to be "observed" by other objects (observers) in the application.
    Each observer subscribes to the subject, and when the subject''s data is changed,
    it sends notification to all registered observers, providing each subscriber a
    reference to the subject. The observers can then query any public data or call
    any public methods of the subject to determine what has changed and how it affects
    the observer.


    Combining the observer pattern with a game state manager would allow the game
    state manager to notify all interested software components of what the game state
    is in real time. So if the user hits the "Pause" option, the game state can be
    set to paused. The state manager would then notify the avatar manager that the
    game is paused, and it can stop processing controller input until further'
