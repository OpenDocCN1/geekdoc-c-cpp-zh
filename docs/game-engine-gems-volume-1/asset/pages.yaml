    \(I_{33} = \rho \int_{-h/2}^{h/2} \int_{-b}^{b} \int_{-a\sqrt{1-y^2/b^2}}^{a\sqrt{1-y^2/b^2}}
    (x^2+y^2) dx dy dz = \frac{\pi}{4} \rho a b h (a^2+b^2).\)

    ```'
