  md: '# ## 18.1 Introduction


    A physically correct approach to rendering would be the solution of the rendering
    equation, but it is too expensive computationally when dynamic scenes are processed
    in real time. Thus in practice, we prefer approximations that can be efficiently
    evaluated. A usual simplification is the local illumination model, which computes
    only the direct contribution of the light sources and adds a constant ambient
    term for the missing indirect illumination. However, constant ambient lighting
    ignores the geometry of the scene, which results in plain and unrealistic images.
    We need better compromises between the rendering equation and the classical ambient
    model.


    Local approaches examine only a neighborhood of the shaded point during illumination
    calculation. The obscurances method [10, 2], which is also called the ambient
    occlusion [1, 6] computes just how "open" the scene is in the neighborhood of
    a point, and scales the ambient light accordingly. To compute occlusions in real
    time, the method called screen-space ambient occlusion [5] examines the height
    field defined by the current content of the depth buffer instead of the real scene''s
    geometry. Thus, when a point is shaded, the required geometric information about
    the rest of the scene is fetched from a depth texture. The classical ambient occlusion
    approach assumes that no illumination comes from nearby occluders. However, using
    the albedo or the color of these points, local indirect lighting can also be approximated
    [10, 8].


    In this article, we present a simplified illumination model that is derived from
    the rendering equation. The model consists of two parts, the ambient occlusion
    part describing the influence of the distant part of the scene, and the indirect
    illumination part, which is responsible for local interactions. Both parts are
    directional integrals, which would need many discrete samples for an accurate
    estimation. In order for the efficient evaluation, we transform these integrals.
    The ambient occlusion integral is first transformed to a'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'volumetric integral, which is first evaluated along the depth coordinate analytically,
    then the remaining integral over the disk perpendicular to the viewing direction
    is obtained numerically. The indirect lighting integral is expressed from the
    stable ambient occlusion estimate. Thus, our method is more general than [10]
    since it also takes into account the one-bounce of the direct lighting, and it
    is more robust than [8] since it does not include infinite variation form factors
    in the approximation.


    The proposed method falls into the category of screen-space techniques since we
    assume that the depth buffer is the sampled representation of the scene geometry
    and the color buffer stores the radiance values of the represented surfaces. However,
    we work in camera space rather than in screen space to obtain correct distance
    and angle values.


    The input of our rendering method includes the textures of camera-space depth
    values, normal vectors of the visible points, and the color buffer storing the
    radiances due to direct lighting. From these input textures, a deferred shading
    algorithm computes the radiances of the visible points, taking into account ambient
    occlusion and local indirect illumination.'
  merge: -1
