- pgno: 307
  md: '# # Overview


    There are many situations in which an entire mesh is too much data to process—whether
    it''s a CPU, SPU, or GPU, there are performance limitations to consider. In general,
    artists can do this work by hand, but human variability being what it is, a good
    algorithm is faster and more reliable, and it improves artist productivity. A
    key trait of a solid tools pipeline is its ability to free the artists from such
    burdens anyway. There is a situation in almost any 3D game in which one mesh really
    would work better as many smaller chunks that can be uniquely identified by the
    CPU and processed independently from others.


    Specifically, what kind of limitations do real-world games run up against?


    +   - Rendering limitations, such as 8-bit or 16-bit indices limiting the number
    of vertices that can be put into a mesh.


    +   - Skinning limitations, such as the number of matrices a particular graphics
    chip is able to express with shader constants, or perhaps older fixed function
    pipelines that have a hard limit for the number of matrix indices per render call.


    +   - Vertex unit bottlenecks, where a mesh has a few visible triangles but the
    majority are being transformed and rejected by the clipping or backfacing unit.
    The bandwidth for transferring vertex data to the GPU is significant on certain
    architectures, and the vertex shader is potentially a bottleneck as well.


    +   - Virtually any other operation that has a per-triangle component could potentially
    be improved by partitioning a mesh, especially if there are trivial rejections
    that could be performed on those partitioned mesh fragments as a whole.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 13.1 Desirable Algorithm Properties


    Now that we have some understanding of when splitting meshes into reasonable-sized
    chunks if helpful, is any partitioning mechanism good? If not, what are the ideal
    properties of a battle-hardened mesh partitioner? The following is an unorganized
    list of properties that I have determined through experimentation. Other properties
    may exist for certain kinds of games. Certain differences in hardware may shift
    the importance of some properties. Use your best judgement. Once you have a set
    of properties, you can define an objective fitness metric for how well the algorithm
    is performing. A fitness metric is crucial during the experimentation phase of
    algorithm design because otherwise, determining whether changes are beneficial,
    detrimental, or irrelevant is very time consuming and subjective.


    # Partitions Should Have Relatively Same-Sized Bounding Columes


    Rationale: This improves culling performance since regularly sized partitions
    have a more predictable overhead per partition. It also means a rasterized set
    of triangles is likely to have a more consistent pixel throughput per draw call,
    allowing you to balance per-partition work versus per-triangle work by adjusting
    the maximum bounding volume.


    # Partitions Should Have Relatively the Same Number of Triangles and Vertices


    Rationale: This improves predictability of bandwidth and transfer times to dedicated
    processing units like the SPU by simplifying buffer management. It also smoothes
    out performance spikes that may otherwise occur. It''s good for leveling out DMA
    transfer performance and improving the culled-to-rendered vertex ratio, which
    reduces total bandwidth to the GPU.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# The Number of Partitions Should Be Minimized Overall


    Rationale: Management costs per partition are often high, so reducing the number
    of partitions can only improve CPU performance. However, if this property is overemphasized,
    you end up with a single partition containing all the geometry—no partitioning
    at all.


    # The Number of Triangles Per Vertex in Each Partition Should Be Maximized


    Rationale: A triangle requires three vertices. If you insert an adjacent triangle
    (sharing an edge) in the same partition, the new triangle only adds one vertex.
    However, the same adjacent triangle placed in a different partition creates three
    vertices. Obviously, you want to ensure as much sharing of vertex data as possible.
    Some duplication of vertex data is unavoidable because partitions naturally separate
    adjacent triangles along their borders. Another way to describe this is minimizing
    the number of borders between partitions, but that is more complicated to measure.


    # The Partitioner Should Guarantee a Solution With the Previously Described Properties
    in Predictably Bounded Time


    Rationale: As a practical matter, it is unacceptable for a partitioning to take
    more than a few seconds because it hurts artists'' ability to iterate. This demands
    a few data structures, some diligence about avoiding any possibility of infinite
    loops, and some thought to worst case scenarios that can "never happen".'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 13.2 Lessons Learned


    My experience with building mesh partitioners over several years led me down many
    dead ends. Here are the biggest mistakes that I made, in no particular order,
    and what made them poor choices.


    +   Mesh data is not to be trusted from any source. The likelihood of any assumption
    regarding triangular mesh conditioning will be proven erroneous asymptotically
    approaches certainty near important milestones. You can never have enough asserts
    in your code to help diagnose these issues. In the end, my partitioner generated
    a completely different topological representation of the triangle data to be used
    solely for partitioning.


    +   Adding a triangle to an existing partition may add between zero and three
    new vertices. Partitions hold references to triangles, which imply vertices. Do
    not try to build partitions out of vertices, and construct the triangle set from
    them. You end up with duplicated triangles, heavily disproportionate partitions,
    and all manner of other issues. Since the important measurement of a partition
    is how many vertices are inside it (and whether a new triangle adds any new vertices),
    you must compute final vertex sharing before entering the partitioner.


    +   Do not build a partitioner that ever subdivides and merges the same partition
    in alternation. Do one or the other, or do them in sequence, but do not alternate
    between them. There are unforeseeable infinite loops, no matter how you craft
    the logic to prevent it from happening.


    +   Merging partitions seems like a good idea, at first. Initializing one partition
    per triangle and merging nearest neighbors was one method I discarded quickly.
    It is essentially Kruskal''s minimum spanning tree algorithm [1]. However, Kruskal''s
    approach cannot deal with user-defined limits for partitions,'
  merge: -1
  img_proc: true
