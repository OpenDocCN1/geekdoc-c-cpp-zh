    the UV parameterization that specifies how these texture maps should be applied.
    Instead we need an automatic way of generating texture coordinates.


    One of the most useful approaches (demonstrated in real time by Nvidia in their
    Cascades demo [3]) is known as *triplanar texturing*. This is performed in the
    fragment shader and uses blend weights derived from the surface normal to interpolate
    between three textures projected along the x, y, and z axes. That is, the first
    texture is sampled using the (y z) components of the fragment''s world-space position
    and modulated by the x component of the normal, the second texture is sampled
    using the (x,z) components of the fragment''s world-space position and modulated
    by the y component of the normal, and so forth. A fragment''s world-space position
    can be determined by interpolating it from the vertices, and the components of
    a normal vector can be made to sum to one by squaring them. The snippet of Cg
