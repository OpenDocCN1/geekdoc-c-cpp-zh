  md: '# # 10.4 A Camera-Centric Design


    As we''ve discussed, a camera is the coarsest form of batching container used
    to gather work for rendering. So far, we''ve described a system that allows us
    to fill in single command buffers in a device-independent manner and submit them
    to the render device at a later time. Now, we need to describe the proper manner
    of creating container classes to aid with this process of batching `RenderCommand`
    objects as well as a larger engine design to scale easily with multiple threads.


    # ## Balancing Rendering Across Multiple Threads: Everything''s a Camera


    With the ability to render across multiple threads, the next step is properly
    utilizing this feature and applying it to your threading system. This means you
    need to figure out how to create job packets that represent rendering work to
    be done by filling in the `RenderCommand` structures. At the most direct level,
    it makes sense to simply create one job packet for each draw call that would occur
    in your scene, thus creating one `RenderCommand` object per job. There are some
    issues with this, the foremost being that modern engines typically group many
    draws together into a single command buffer so that it minimizes API submission
    overhead and also takes advantage of things like redundant render state filtering.
    Creating the draw commands independently of each other robs us of the ability
    to take advantage of this optimization as the commands are being created.


    As such, it makes sense that we still need to create draw commands in such a way
    to take advantage of state filtering by batching them sequentially. The difficult
    part about this process is determining how to properly batch up your `RenderCommand`
    objects to take advantage of this. Typically, most engine designs embrace command
    buffer generation for objects being rendered'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'into the primary view, but not for subsequent things like rendering shadow
    maps. This results in an unbalanced throughput with your rendering pipeline, being
    that submission of some draw commands in one section are significantly faster
    than others.


    As an alternate view on the rendering process, a given frame of rendering in a
    game can be described as a grouping of cameras that all contribute their view
    data to the final scene. GPU-based shadow mapping is a great example of this concept
    in action, as it defines the same camera and render-target system that your primary
    view does, dealing with the same culling, redundant state overhead, and LOD. Reflective
    render targets, offscreen particle buffers, and tiled antialiasing systems all
    exhibit the same characteristics as well and can be described using the same concepts.


    This effectively solves a problem for us. Because our scene can be described in
    terms of cameras, we can use that idea to batch our `RenderCommand` generation,
    since objects that render to the same target typically share some sort of similar
    state data (for instance, shadow mapping requires all objects to use a different
    set of shaders).


    Dividing our recording work by camera also provides us with a simple heuristic
    for scaling back workflow based upon hardware features. For instance, if we know
    the hardware is not fast enough to handle real-time reflections, cube-map cameras
    can be avoided and not processed. Another example is tiled antialiasing, a process
    in which subregions of the primary camera are used to generate larger images for
    portions of the screen, which are then downsampled and combined to generate the
    final image. By viewing each subregion as another camera render target, changes
    between antialiasing levels simply result in addition or removal of cameras from
    the system.


    Figure 10.2 shows how a given rendering pipeline can change by breaking up command
    buffer generation by grouping them across cameras. Notice that the amount of work
    done across multiple'
