  md: '# 18.5 Indirect Lighting of the Near Geometry


    The second part of the reflected radiance depends on the average radiance values
    of nearby surface points. As we calculate the ambient occlusion with random points
    in the neighborhood of the shaded point, the color of the frame buffer at these
    random points can be used to obtain the average reflected radiance. By inspecting
    the camera-space normal, we can also check whether the surface is oriented toward
    the shaded point, and ignore it in the average otherwise.'
