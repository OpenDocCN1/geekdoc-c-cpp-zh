- pgno: 115
  md: '# Overview


    Today''s gamers demand spectacular pathfinding. If it isn''t amazing, don''t ship
    it. Otherwise, prepare for an assault of angry gamers mobbing the developer''s
    studios, torches ablaze and pitchforks in hand. Simply put, pathfinding is one
    of the most important pieces of technology to get right in a game, especially
    in the real-time strategy genre. Besides the pressure of perfection, pathfinding
    programmers need a thick skin. These brave souls should assume that gamers don''t
    compliment path-finding, they roast it. Gamers latch on to almost any game or
    AI imperfection and blame it on the pathfinding system. In truth, they used to
    be right. The old generation of pathfinding engines resulted in actors looking
    like knuckleheads as they found less than optimal paths and often failed to find
    a valid path altogether when one existed.


    Apart from the impact pathfinding has on gameplay, it also has an enormous effect
    on performance. Game lag should never be the result of pathfinding, but sadly,
    it happens all too often. What gamers don''t realize is that behind the scenes,
    poor pathfinding results in a restricted game world. These restrictions keep gamers
    from experiencing a game designer''s true vision, which is never a good thing.
    Certainly not all genres need fast pathfinding, but for those with large worlds
    or many actors, pathfinding must be accurate and optimized. Like many of the cleverly
    designed usability features of modern software, pathfinding that goes unnoticed
    by the user is a success.


    There are many options for optimizing pathfinding. We can optimize our code, time-slice
    pathfinding calculations, reuse paths, group paths, and even avoid pathing all
    together when we can get away with it. One optimization however, really stands
    out, and that is to reduce the search space a pathfinder works with. High-level
    pathfinding is a great technique to achieve this reduced search space, and is
    the focus of this gem. Besides dramatically improving performance, high-level
    pathfinding offers us the opportunity to'
  merge: -1
  img_proc: true
- pgno: 116
  md: perfect pathfinding. Once pathfinding performance is no longer an issue, we
    can force our pathfinding engines to never give up, and always find a path when
    a valid one exists.
  merge: -1
  img_proc: true
- pgno: 117
  md: '# ## 4.1 Terms


    Before we dive into how high-level pathfinding works, let''s review some terms.


    +   **Actor.** Any significant object within a game''s world that serves a purpose
    beyond ambience.


    +   **RTS.** Short for "real-time strategy", a genre of strategy games that focuses
    on unit production, resource management, and for some, combat. Its typically high
    actor count and large world area strain traditional pathing algorithms, which
    are designed for smaller datasets.


    +   **Tile.** A square area of a world (such as 1 × 1 meters) that holds properties
    for that given world space. In a typical RTS game, tiles are laid out in a grid
    pattern and can be located with integer coordinates.


    +   **Path.** A sequence of points through which an actor can legally move to
    get from one location to another.


    +   **Detailed path.** Exact tiles an actor will navigate to get to their destination.
    This path avoids all obstacles.


    +   **Path rule.** A game rule that dictates a movement restriction for a given
    actor type, such as whales not being allowed on land. These rules determine what
    tile types are "legal" for an actor''s movement.


    +   **Path region.** A collection of contiguous tiles that share the same path
    rules.


    +   **Beacon point.** The path region''s point closest to the region''s center
    of mass.


    +   **Fuzzy pathing.** Fuzzy pathing is another way of saying high-'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'level pathing. It indicates that a non-detailed path is being created that
    is legal, but without many of the movement details that make paths look good and
    avoid all obstacles. Another way to think of a fuzzy path is that it indicates
    there is a guaranteed way to the destination via this route, but it may have some
    unknown and navigable obstacles along the way.


    +   - Terrain analysis. A term for computing knowledge of a game world [3]. It''s
    data we compute about a world and organize in a way so that, from within a game,
    the pathfinder can approximate a human-like awareness of the environment. Examples
    include computing ocean tiles and shapes, recognition of a bay, a river, marshlands,
    forests, beaches, etc.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 4.2 Start Your Engines


    For the best understanding of this article, knowledge of pathfinding isn''t essential,
    but is strongly recommended. What is contained within this article is a skeleton
    view of what''s required in a high-level pathfinding system. While reading, it''s
    critical to remember that even with brilliant designers and genius programmers,
    there will be frequent revisions to the path rules to handle special cases until
    pathfinding is perfect and feature freeze occurs.


    Truly, the best way to build a high-level pathfinding system is to make it as
    generic as possible with known and isolated customization points. This is a perfect
    time to either buy, or dust off those design pattern books. Be ready to utilize
    patterns such as factories, strategies, prototypes, and policies. Isolate the
    customization points, because those will be frequently modified, and we don''t
    want tons of special case code floating around the engine.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 4.3 Why High-Level Pathfinding?


    Imagine we have a world that contains over a million tiles. In this world, there
    is a battle raging in the North at the walls of an enemy city as seen in Figure
    4.1. Our heroic army is trying to take the walled in city by force, but needs
    reinforcements. Let''s help our army by moving a siege ram, a man-at-arms, and
    naval galley north to the battle.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_120_0.png)


    Figure 4.1: A world map, with tile markings.


    A million or more tiles is a great distance to navigate, especially with obstacles
    such as forests and towering enemy walls. Odds are that during a battle, CPUs
    are busy with animations, projectiles, physics, AI, and graphics. The effort of
    calculating detailed paths for an army across a huge map will adversely affect
    game performance; however, if our world was only a few thousand tiles, we could
    achieve this without any noticeable impact on the frame rate.


    To accomplish this we need to reduce the search space to'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'navigate our maps. High-level pathfinding achieves this through a several-phase
    process. First, our preprocess phase must identify each tile in the world as being
    of one, and only one, path type. With those types defined, we need to analyze
    the world and build up a knowledge base of terrain information before the game
    begins, which we accomplish by performing terrain analysis [3]. The second phase
    involves using the data stored in our world knowledge base to find a fuzzy, non-detailed
    path between two points using an algorithm such as A*. Our final phase involves
    the actor refining the fuzzy path to plan the exact route to their destination.


    Sound like more than a few days of work? It should. Implementing high-level pathfinding
    can consume a significant amount of development time, but is well worth the effort.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 4.4 Preprocess Phase


    The preprocessing phase has two main parts—design and terrain analysis. In the
    design portion of this phase, we focus on identifying unique path tile types.
    This step is done without any coding, and it relies on full knowledge of actors
    and their movement rules. Designers should be prepared to define every actor rule
    such as prohibiting submarines from approaching shore lines, or declaring that
    only ninjas can climb walls. A rule only needs to be added only if it has a significant
    affect on an actor. For example, if movement on grass and movement on sand are
    the same for all actors in terms of pathfinding, then there is no need to define
    them as different region types. If, however, sand is illegal for a unicycle, then
    it needs to be its own path type.


    The last part of this phase is terrain analysis, and this is where the creation
    of path regions occur. For an in-depth explanation of terrain analysis and it''s
    many uses, it''s strongly recommended that "Terrain Analysis in an RTS—The Hidden
    Giant" [3] is read before beginning any actual coding.


    # Design Time


    Prior to coding, it''s crucial to categorize each tile into a unique pathfinding
    type. For example, a water tile is rarely just a water tile. A given water tile
    may be best classified as being part of a river, bay, deep ocean, or coral reef.
    To identify these regions, we determine if all actors have the same restriction
    for traversing or avoiding the tile. If any actor is designed with a constraint
    that modifies their passage across the tile, we make a new path type. Perhaps
    it''s a difference in terrain type, or maybe there''s a special rule for large
    actors. When this occurs, we may turn the special case rule into a unique type.


    Let''s see a few examples. In our effort to reinforce the army to the North, each
    of our soldiers has very different pathfinding'
  merge: -1
  img_proc: true
