- pgno: 314
  md: '# 13.3 When Greedy Is Good


    Since there are so many choices that can be made while writing a mesh partitioner,
    it''s surprising how simple a good one can be. Although the following is a greedy
    algorithm, the results are initially good, and a simple refinement step afterwards
    can improve the partition efficiency by two to three percent. This section describes
    what I found to work well.


    # Core Algorithm Overview


    +   1. Select the least connected [1] unassigned triangle and initialize a new
    partition with it. If no triangle is unassigned, partitioning is complete.


    +   2. Collect all the unassigned triangles that are related [2] to the partition
    into a candidate list. If no related triangles exist, perform an exhaustive search
    to find all minimally connected triangles in the unassigned mesh, and consider
    them all to be candidates.


    +   3. Iterate over the candidate list of triangles, temporarily adding each one
    to the partition, and compute the fitness metric of the partition using an objective
    metric function. Immediately reject any candidate triangle that causes a hard
    threshold limit to be exceeded, e.g., vertex count limit, final packet size [3],
    maximum bounding sphere.


    +   4. If at least one candidate triangle was not rejected, select the triangle
    that yielded the best fitness score for the partition and add it to the partition.
    Repeat from Step 2.


    +   5. Otherwise, there are no triangles that can be added to the partition without
    exceeding some threshold (bytes, number of triangles, bounding sphere, etc.).
    Consider this partition full and start a new one. Repeat from Step 1.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Refinement


    After all triangles have been assigned to partitions, the last partition is, on
    average, half the size of the others. Even if this is acceptable, you might want
    to perform a refinement on the partitions. You can typically run the refinement
    multiple times to level out some of the partitions and reduce the total size of
    the solution. To refine, follow these steps for each partition:


    +   1. Determine if any triangle can be moved from partition A to partition B,
    where A loses some vertices and B gains none. This is a clear win for memory and
    performance, but may distort bounding volumes or cause the triangle counts across
    partitions to become unbalanced. This is demonstrated in step 14 of the graphical
    walkthrough at the end of this gem.


    +   2. Determine if any triangle can move from partition A to partition B, where
    B has fewer triangles, even if the number of vertices remains the same in both
    partitions. This balances the triangle count between partitions, but can be done
    to improve the bounding volume or triangle count balance.


    +   3. As a last resort, determine if any one vertex can be moved from partition
    A to partition B, possibly moving several triangles to B in the process, so that
    A has fewer vertices and triangles, and B has more. This is particularly useful
    when filling out the final partition, because the final partition is on average
    half the size of the others.


    [1]Least connected, in this context, means the unassigned triangle that has fewest
    shared vertices with other unassigned triangles. This is a dynamic property of
    a triangle during partitioning, and cannot be precomputed.


    [2]Related, as defined for partitioning, is the statement that vertex data within
    a partition could be shared with adjacent unassigned triangles. This property
    forms the basis of candidate triangles for'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'inclusion in a growing partition.


    [3]In most modern graphics engines, a single batch of geometry sent to the GPU
    is called a packet. The size of this packet is often hard-limited at a specific
    number of bytes dictated by hardware or engine software design constraints.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 13.4 Future Work


    There are many interesting applications that a partitioner can be used for, once
    you have it. What kinds of rapid backface culling could you do on a large mesh
    if you partitioned it into triangles that all have relatively the same face normal
    with minor deviations? The speedup from bulk triangle rejection could be dramatic,
    without having to even transmit the triangles to the GPU.


    Similarly, there is value in extending the partitioner to pay attention to the
    size of packets generated so that they fit inside a fixed memory size. This fixed
    size might make data management simpler and faster because less bookkeeping is
    necessary, particularly for an architecture like the PlayStation 3 where SPU memory
    is tight and double-buffering DMA is mandatory for best performance. Dynamically
    managing memory is slower and more complicated than using fixed buffers, so leaving
    room in your implementation to extend the fitness function of a partition in arbitrary
    ways is valuable.


    It is relatively straightforward to convert a partitioner into a hill-climbing
    partitioner by remembering the order that faces were selected for inclusion in
    partitions, perturbing that order slightly, and re-evaluating the results. By
    recording the best sequence, you can use that as the basis for perturbations.
    It is unlikely to perform significantly better than the core algorithm, but as
    slight as the improvements may be, if squeezing out the absolute best performance
    and smallest memory footprint is your objective, it may be worth doing.'
  merge: -1
  img_proc: true
