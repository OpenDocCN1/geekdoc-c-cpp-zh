  md: '```

    <accessor source="#mesh1-geometry-position-ar

    count="8" stride="3">

    <param name="X" type="float"/>

    <param name="Y" type="float"/>

    <param name="Z" type="float"/>

    </accessor>

    </technique_common>

    </source>

    ```


    # The <accessor> Element


    The <accessor> element, shown in Figure 2.5, is where the flexibility is built
    in. It enables us to organize the arrays in a format that is closer to either
    the tool or the target format, allowing the build process to convert from one
    point to another. This provides better decoupling from the exporter''s point of
    view since the exporter can export the data as is and then use the <accessor>
    element to explain how the data should be accessed. The count attribute tells
    how many elements can be accessed through the <accessor> element and what offset
    and stride is to be used, typically creating n-tuples of data. Then it describes
    one parameter for each element of the n-tuple, giving it a name and type. An example
    is shown in Listing 2.1.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_62_0.png)


    Figure 2.5: Definition of the `<accessor>` element.


    If a `<param>` element is not given a name, that means the corresponding value
    is to be ignored. So a source array with 3-tuple values could actually be defining
    only a 2-tuple with one padding value. As you can see, it is possible within the
    same language to represent a position array in many different ways. The astute
    reader will notice that the array element is optional in a `<source>` element,
    the reason being that an `<accessor>` element can reference an array stored in
    another `<source>` element, making it possible to reuse the same array of data
    in a different way through several `<accessor>` elements.


    # Geometry and the `<mesh>` Element


    Geometry is most often represented by a `<mesh>` element, although the `<convex_mesh>`
    element and the `<spline>` element are used for rigid body physics and 2D animation
    curves, respectively. The COLLADA 1.5 specification adds `<brep>` to the list
    of geometry types. A `<mesh>` element contains a collection of `<lines>`, `<linestrips>`,
    `<polygons>`, `<polylist>`, `<triangles>`, `<trifans>`, and `<tristrips>` elements.
    Most'
  merge: -1
  img_proc: true
