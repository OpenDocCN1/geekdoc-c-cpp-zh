- pgno: 65
  md: 'format and the choices made for the COLLADA standard, it is worth mentioning
    a few additional high level concepts.


    The most important and difficult design concept to keep in mind when designing
    an intermediate asset format is to try to avoid as much as possible a particular
    implementation or run-time. In other words, the data should be self-described
    so it can be transformed and used with any existing or future run-time. This is
    a really difficult design goal, and it''s what occupied most of the design meetings
    in the COLLADA working group, as the first draft of a feature is always close
    to how it will be used by the run-time or how it is created in the modeler. Making
    sure that the data is not described relative to one single usage model is very
    important, as this ensures the design is not made obsolete as technology is rapidly
    evolving or is limiting creativity by imposing a model that does not fit with
    yet-to-be-invented usage models. This one design point is the main difference
    between COLLADA and most other formats. This difference is obvious when comparing
    with Autodesk proprietary FBX interchange technology which is defined entirely
    through an API and specific usage model:


    > "The FBX file format is not documented. Applications use FBX SDK to import scene
    data from an FBX file or to export scene data to an FBX file."

    > — FBX SDK Programmer''s Guide, page 6 [28].


    Another important principle of design is the categorization of elements into <library_xx>
    element types that help with the organization of the data as well as enable document
    contents to be separated by type. Important is the distinction between the data
    definition and its utilization through instancing. This enables an element to
    be used many times without having to repeat its definition, which would cause
    the size of the intermediate and final assets to bloat tremendously. COLLADA enables
    some of the values of an element to be modified when instanced through the use
    of <param> elements, so it is possible to share most of the element definition
    and save a lot of space while still enabling'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'source data changes to affect all instances, which comes in handy during production.


    Last but not least, COLLADA takes advantage of URI technology [29], which enables
    elements to reference data within other documents for flexible organization, and
    it takes advantage of many different storage technologies as well. For instance,
    an external reference URI can be an HTTP request that is interpreted by a web
    server as a database query, or it can be a simple reference to a file on the local
    storage device. One main issue that comes with utilizing formats that do not have
    a good external reference mechanism is that the intermediate assets all need to
    be grouped in one single document. Such a document can grow to an unmanageable
    size during the course of the project. Moreover, this means that all the data
    has to be imported and then exported by all of the tools used in the asset pipeline,
    which is a major limiting issue.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 2.5 OpenCOLLADA


    Given the open nature of COLLADA and its description using standard XML technology,
    there exist many commercial and open source options that can be used to interface
    with COLLADA documents. Some programming languages such as C# and Python provide
    libraries that can directly interface with XML data, providing the programmer
    with a Document Object Model (DOM) [30], a memory representation of the XML hierarchy
    that can be programmatically accessed. The libraries supplied with C++, the most
    used language in game engine development, do not provide this capability directly.
    There are several generic libraries that exist for loading and saving XML content,
    and there are a few commercial tools that can generate a specific access API created
    automatically within an XML schema, enabling the creation of an API specific to
    a particular document. A COLLADA DOM is available for C++ programmers, and it
    automatically generates a core API from the schema in addition to providing an
    API to help manage the objects once in memory. A DOM provides more than a loading
    and saving interface; it allows for the XML elements to exist in memory so they
    can be edited directly without having to create a separate representation [31].


    More recently during SIGGRAPH 2009, NetAllied Systems announced the availability
    of OpenCOLLADA [32], which is the first open source implementation to take advantage
    of SAX parsing and direct write technology, providing support for both versions
    1.4 and 1.5. The project page is located on the web at http://www.opencollada.org/.
    The 3DS Max and Maya plug-ins built on this technology, as well as the source
    code for the framework, are available on that web page, and they are included
    on the CD accompanying this book for convenience. The reader is encouraged to
    check the web page for the latest updates.


    SAX (Simple API for XML) is an alternative model to the DOM for parsing XML documents
    [33]. The main issue prevalent among'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'most available libraries is that they load all of the XML data and create an
    in-memory representation of the data before a third copy of the data is made to
    create the object representation used by the program loading the assets. This
    problem is very common across all file-loading SDKs regardless of the format itself,
    and this issue is making it quite difficult to handle the very large assets that
    are becoming more and more common.


    The same memory management issue exists when exporting content if a library is
    used to create a complete in-memory representation of the data to be exported
    before the data is written out. Workstation memory is commonly maxed out when
    a large model is loaded in a DCC tool, and as the export is invoked, the computer
    hangs as all memory contents are swapped out to make room for yet another copy
    of the same data. The same principle can be used when exporting content by writing
    out the data directory and avoiding the creation of another copy of the content.


    The DAE2Ogre sample code shown in Listing 2.2 (and included on the accompanying
    CD) demonstrates how to take advantage of this technology. The idea is to associate
    a writer to the reader C++ object, where the reader is the COLLADA SAX parser,
    and the writer (in this case) is the Ogre engine-specific format. Since all data
    is not available in memory at once, it is not possible to follow references and
    expect to find the data in place. So instead, the SAX parser uses a UniqueId type
    for referencing. Since the data is passed to the writer in the order that it appears
    in the COLLADA file, it might not be possible to resolve a reference immediately
