  md: '# 14.3 Derivation of Moments of Inertia


    In this section, we derive the centers of mass and the moments of inertia for
    a variety of common solid shapes. The inertia tensors are always expressed in
    a coordinate system in which the origin lies at the center of mass and the coordinate
    axes are parallel to the shape''s principal axes of inertia.


    Evaluating integrals of the type presented in this section by hand can be a very
    tedious exercise. We recommend using a symbolic computation package such as Mathematica
    to perform these calculations, should the reader feel so inclined.


    # Box


    There are two common ways to describe the dimensions of a box, as shown in Figure
    14.1. One way is to place the origin at one corner and identify the full extents
    of the box in all three directions by its length $l$, its width $w$, and its height
    $h$. The second way is to place the origin at the center of the box and identify
    the perpendicular distances $a$, $b$, and $c$ from the center to the faces in
    all three directions. We provide formulas for both cases.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Figure 14.1: A box.


    In the case that the box is described by the dimensions $l$, $w$, and $h$, the
    total mass is $m = \rho lwh$, and the center of mass is located at $(l/2,w/2,h/2)$
    The moments of inertia are then given by the integrals


    ```

    \(I_{11} = \rho \int_{-h/2}^{h/2} \int_{-w/2}^{w/2} \int_{-l/2}^{l/2} (y^2 + z^2)
    \, dx \, dy \, dz = \frac{1}{12} \rho lwh (w^2 + h^2),\)

    \(I_{22} = \rho \int_{-h/2}^{h/2} \int_{-w/2}^{w/2} \int_{-l/2}^{l/2} (x^2 + z^2)
    \, dx \, dy \, dz = \frac{1}{12} \rho lwh (l^2 + h^2),\)

    \(I_{33} = \rho \int_{-h/2}^{h/2} \int_{-w/2}^{w/2} \int_{-l/2}^{l/2} (x^2 + y^2)
    \, dx \, dy \, dz = \frac{1}{12} \rho lwh (l^2 + w^2).\)

    ```


    Substituting the mass $m$, this gives us the inertia tensor


    ```

    \(\mathbf{I}_{\text{box}} = \begin{bmatrix} \frac{1}{12}m(w^2+h^2) & 0 & 0 \\
    0 & \frac{1}{12}m(l^2+h^2) & 0 \\ 0 & 0 & \frac{1}{12}m(l^2+w^2) \end{bmatrix}.\)

    ```


    In the case that the box is described by the dimensions $a$, $b$, and $c$, the
    total mass is $m = 8\rho abc$, and the center of mass coincides with the origin.
    The moments of inertia are then given by the integrals


    ```

    \(I_{11} = \rho \int_{-c}^{c} \int_{-b}^{b} \int_{-a}^{a} (y^2 + z^2) \, dx \,
    dy \, dz = \frac{8}{3} \rho abc (b^2 + c^2),\)

    \(I_{22} = \rho \int_{-c}^{c} \int_{-b}^{b} \int_{-a}^{a} (x^2 + z^2) \, dx \,
