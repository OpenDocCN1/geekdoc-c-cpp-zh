  md: '# 20.4 Fade Out And Wrap-Around


    We have a basic vertex shader and fragment shader in place, but our projection
    is infinite along the decal''s z-axis, producing the smearing shown in Figure
    20.2. There are two methods we can use to fix this problem. The simpler method
    is to use the distance from the fragment''s position to the decal plane as a fade-out
    parameter. This distance is already available in `decalPos.z`, and we just have
    to scale it to the size of the decal as demonstrated in Listing 20.3.


    # Listing 20.3: The absolute value of the decal-space z-coordinate of the fragment
    position is scaled to the size of the decal and used as a fade-out parameter for
    the decal color. As before, the `recipDecalSize` constant is 1/s, where s is the
    size of the decal in the scene.


    ```

    // compute the distance of the fragment to the deca

    float distance = abs(decalPos.z);


    // scale the distance into the [0,1] range

    // according to the size of the decal

    float scaledDistance = max(distance * recipDecalSiz


    // somehow use that scaled distance to fade out

    // here: simple linear fade out

    float fadeOut = 1.0 - scaledDistance;


    vec4 diffuseColor = texture2D(diffuseDecalTexture,


    gl_FragColor = vec4(diffuseColor.rgb, diffuseColor.

    ```


    This method is useful when a decal is supposed to be flat without wrapping around
    geometry. The exact formula used to fade out a'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'decal can be varied to produce the best look for different decals, and it is
    advisable to make this configurable within the engine.


    A more interesting method for handling the smearing problem is to make a decal
    wrap around corners and follow the curvature of complex surfaces. This is especially
    useful for blood stains and other liquids that splatter because it is much more
    convincing if such a decal covers an entire surface independently of its curvature.


    This is quite easy to achieve. All we need is the surface normal at the position
    of each fragment in the decal. If we rotate that normal into decal space, its
    (x y) components give us the gradient of the surface relative to the decal plane.
    We can use this gradient and the fragment''s distance to the decal plane to modify
    the texture coordinates. In areas with no relative slope, the texture lookup remains
    unchanged, but in areas with a large slope (for example, at corners), the texture
    coordinates move outward according to the distance to the decal plane. This technique
    is illustrated in Listing 20.4, and the result is shown in Figure 20.4.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_440_0.png)


    Figure 20.4: The decals wrap around corners based on the surface normals, and
    they fade out based on the distance from the decal plane.


    Listing 20.4: This code demonstrates how the normal of the underlying surface
    can be used to adjust texture coordinates in such a way that a decal wraps around
    curves and corners. The RT_Normal texture contains normal vectors for the viewport
    encoded in the RGB channels.'
