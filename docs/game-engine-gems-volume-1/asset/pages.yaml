- pgno: 442
  md: '# 20.5 Surface Clipping


    The technique we have described works by applying decals in viewport space and
    does not differentiate among surfaces onto which it is projected. By using the
    projection and wrap-around method, it is possible to attach decals to any kind
    of surface, even to animated characters. However, a decal is never clipped, meaning
    that a decal attached to a box also projects onto the ground on which the box
    is resting. If the box moves and carries the decal along with it, then the projection
    on the ground moves as well.


    There are two possible solutions to this problem. One solution is to restrict
    decal rendering to pixels covered by static geometry only. In this case, we need
    to render all static geometry first, then apply decals, and only afterward, render
    dynamic objects.


    The second solution requires that an additional channel in the G-buffer be used
    to hold a "decal ID" for every distinct object that is rendered. In the rendering
    pass that fills the G-buffer, we write each object''s decal ID along with the
    diffuse color, normal, etc., so that we have a per-pixel mask identifying to which
    object each pixel belongs. When a decal is applied to an object, we look up the
    object''s ID and associate it with the decal. When the decal is rendered, we pass
    this ID along as an additional uniform constant and compare it to the ID read
    from the G-buffer. If the two match, then we know that the pixel belongs to the
    object to which the decal is attached, and we render normally. Otherwise, we discard
    the fragment because it would be drawn outside the set of pixels covered by the
    object.


    If no distinction needs to be made among static geometries, then they can all
    share the same ID, such as zero. All dynamic objects should have different IDs,
    but those IDs don''t need to be unique. All we need to do is make it very improbable
    that two dynamic objects near each other have the same ID. It then suffices to
    use'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'an 8-bit channel and simply give the dynamic objects random IDs from the range
    [1,255].


    This kind of object ID management could also be done using the stencil buffer.
    However, testing stencil values prevents us from using instancing to render the
    decals due to the fact that we cannot pass the stencil compare value as a uniform
    constant to the shader and change the stencil test on a per-fragment basis.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# 20.6 Limitations


    There are a few limitations one should be aware of. This technique does not magically
    create volumetric decals. It only improves a 2D projection so that it looks more
    realistic in many situations. The wrap-around feature uses the normal of the underlying
    surface to change the texture coordinates inside a decal. The results shown in
    Figure 20.4 look much better than in Figure 20.2, but there is still a clearly
    visible cut at the edge of the vertical column. To prevent such artifacts, one
    would need to use truly volumetric decals. Figure 20.5 shows a decal applied to
    a more complex object. In the left image, the object uses face normals, and in
    the right image, it uses smooth normals. In both images, no normal mapping is
    considered. Obviously, the normal of the underlying surface has a big effect on
    the appearance of the decal. Consequently, surfaces with strong normal mapping
    tend to distort the decal, sometimes causing visual artifacts. For some kinds
    of decals, this is less of an issue, though, because a blood stain usually still
    looks like a blood stain no matter how distorted it becomes when applied to a
    surface.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_444_0.png)


    Figure 20.5: (Left) Wrap-around based on face normals. (Right) Wrap-around based
    on smoothly interpolated vertex normals.


    A word about performance: It is easy to cull decals by testing bounding volumes,
    and the GPU can render decals in large batches through instancing. However, you
    should be careful not to'
  merge: -1
  img_proc: true
- pgno: 445
  md: have many decals layered on top of each other because doing so can easily consume
    all available fragment-rendering power. You can try to prevent such situations
    by removing decals after a certain amount of time or by restricting the number
    of decals on screen at once. The latter approach allows us to keep many decals
    in the world as long as they are not visible at the same time. Most games simply
    clean up the scene by removing decals after a fixed amount of time, but lose a
    lot of immersive quality in the process. The game Max Payne places a limit on
    the number of decals created in a single area, which has the great effect that
    if the player comes back to a room where he was previously, all the blood stains
    and bullet holes are still there.
  merge: -1
  img_proc: true
- pgno: 446
  md: '# 20.7 Additional Features


    Since we are already rendering the decals into the G-buffer before any lighting
