- pgno: 375
  md: '# 16.3 Integrating the Skybox with Your Scene


    One challenge a physically-based skybox presents is that it becomes difficult
    to blend your distant scenery with the skybox, since the sky''s colors may vary
    about the horizon. The usual trick of fogging distant terrain to blend into the
    sky may produce a visible seam, since the sky is not a constant color.


    Preetham et al. describe an involved means for implementing physically-based atmospheric
    perspective effects on terrain that will match the skybox perfectly, but from
    a real-time performance standpoint this is impractical for dynamic scenes with
    complex geometry.


    One solution is to blend the skybox itself to a fixed fog color at and below the
    horizon. If this fog color is chosen wisely, the sky/terrain boundary will be
    seamless, but you will lose some of the more dramatic effects at dawn and dusk
    with this approach.


    Another solution is to sample the skybox color at the horizon directly in front
    of the camera every frame, and set your terrain''s fog color to match it. The
    result won''t be perfectly seamless, but this is a good compromise for reasonable
    fields of view.'
