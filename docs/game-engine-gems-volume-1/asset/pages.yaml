- pgno: 486
  md: '# # Overview


    This gems presents a design for a flexible, observable repository for game configuration
    data. The key-value dictionary (KVD) is a data structure inspired by the key-value
    observing [1] technology used in Mac OS X Cocoa frameworks. When used sensibly,
    the KVD can simplify your code.


    The KVD is designed to be flexible, easy to use, and have few external dependencies.
    It is not designed to be blisteringly fast, or to be used for frequently modified
    data. The KVD is well suited for storing game state information that is read often,
    but modified rarely. The KVD code on the accompanying CD is written in C++ and
    uses the standard template library (STL) for internal storage containers. The
    KVD is lightweight (about 350 lines of C++) and simple to integrate into an existing
    game engine.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# 24.1 Design


    Apple''s OS X relies heavily on Objective-C and the Cocoa frameworks. One of the
    fundamental mechanisms of Cocoa that binds the frameworks together is called "key-value
    observing" (KVO). Apple describes KVO as follows:


    > Key-value observing provides a mechanism that allows objects to be notified
    of changes to specific properties of other objects. [1]


    KVO is a mechanism that, once you get used to it, becomes almost invaluable. Code
    does not have to repeatedly poll a value to detect whether it has changed; rather,
    the code registers its interest in learning when the value changes and is notified
    when the value does change. The code is notified of the new value by way of a
    callback. Since Apple''s KVO mechanism requires Objective-C and Cocoa, but we
    write games primarily in C++, I have created the KVD, a simple C++ data repository
    that mimics simple KVO behavior.


    The KVD can take data of any type, with each piece of data having multiple observers.
    Observers are notified of changes immediately upon the value changing. The KVD
    also checks so that a value has actually changed before sending notifications,
    so setting a variable to the same value it currently holds will not trigger any
    notifications.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# 24.2 Using the KVD


    As mentioned in the introduction, the KVD is designed to be used with general
    game state data that is read often, but changed relatively infrequently. Traditionally,
    game state data is repeatedly polled by lots of different systems. For example,
    the current screen resolution is a piece of data that changes very infrequently,
    but which is polled by a number of different systems. If you use the KVD to store
    the screen resolution, you don''t need to poll for its value each frame, but you
    are instead told when the value changes and what the new value is.


    Using an intermediary data store like the KVD can help decouple your classes and
    reduce header file dependencies. As in the previous example, if you were to store
    the current screen resolution inside the rendering system, every piece of code
    which is required to read or set this value needs to include the header file for
    the rendering system, and that could itself pull in other headers as illustrated
    in Figure 24.1, increasing compile times.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_488_0.png)


    Figure 24.1: A polling model for accessing information often creates additional
    header dependencies.


    Pulling the screen resolution out of the rendering system and into an intermediary
    would stop your game code from having to include'
  merge: -1
  img_proc: true
- pgno: 489
  md: 'the rendering system header (and all the headers the rendering header includes),
    but would add a dependency on the intermediary. As long as this intermediary header
    has fewer dependencies, you have simplified the header file dependency chain as
    shown in Figure 24.2, and this will speed up compile times.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_489_0.png)


    Figure 24.2: The header dependency graph is simplified by moving information into
    an intermediary header.'
  merge: -1
  img_proc: true
- pgno: 490
  md: "# 24.3 Code Details\n\nThe key-value dictionary has a relatively small API\
    \ and only has external dependencies on the STL. To use the KVD, you first need\
    \ to create a KVD object by declaring it as follows:\n\n```\nKeyValueDictionary\
    \ myKVD;\n```\n\nOnce created, the KVD is ready to accept values and notifications.\
    \ Setting a value in the KVD is as simple as this:\n\n```\nmyKVD.Set<int>(std::string(\"\
    myInteger\"), 1);\nmyKVD.Set<MyStruct>(std::string(\"myStruct\"), myStru\n```\n\
    \nNotifications happen through a function callback mechanism. The callback functions\
    \ take the following form:\n\n```\nvoid NotificationFunc(void *newValue, void\
    \ *userDat\n{\n  // react to new value\n}\n```\n\nTo add a notification to the\
    \ KVD, you need to tell the KVD which function to call when the value changes\
    \ (the first parameter), and which value you want to watch (the second parameter).\
    \ The third parameter is optional and will be passed to the callback function\
    \ as the userData parameter. This can be set to null or set to a pointer to your\
    \ own user data associated with the callback notification.\n\n```\nmyKVD.AddNotification(NotificationFunc,\
    \ std::string\n```\n\nThe callback function is passed two values: the first is\
    \ a pointer to the new value, and the second is a pointer to the user data that\
    \ was set when the notification was added. Since the callback isn't told the type\
    \ of the data, you have to cast the newValue pointer to"
  merge: -1
  img_proc: true
- pgno: 491
  md: 'the appropriate type. You have to make sure that the type used is consistent
    for a given key. Mixing types can cause difficult-to-find bugs or crashes.


    Once you have set a notification, whenever the value is changed using the Set()
    method, your notification is called. You can add however many notifications you
    want to each key value—they will all be called whenever the value changes. Notifications
    can be removed using the RemoveNotification() method:


    ```

    myKVD.RemoveNotification(NotificationFunc, std::str

    ```


    You can get the value for a key manually, if you so wish, with the following call:


    ```

    int myValue;

    myKVD.Get<int>(std::string("myInteger"), &myValue);

    ```


    Internally, the primary storage container for the KVD is an STL map. Each map
    element is indexed by the key string hash, and contains the value encoded as a
    std::string, a lock, and a std::list of notification callbacks. Each notification
    callback contains a pointer to the callback function, and the user data value,
    as illustrated in Figure 24.3.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_491_0.png)'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# **Figure 24.3:** The data stored in a KVD.


    STL was chosen due to its good performance characteristics, common availability,
    and robust nature. If your implementation of KVD requires different container
    characteristics, you are free to change the source to suit your needs.


    Each entry in the KVD map has a lock flag. Whenever a key value changes, the lock
    is set before the notification phase begins and cleared after notifications have
    completed. This lock is checked before a key value is modified, to make sure that
    recursive change notifications don''t happen. Recursive change notifications are
    a bad thing because they can blow the stack and crash your program. Consider the
    case where a key is altered within the call graph of its notification function.
    Each change in value would trigger a notification, which would change the value,
    triggering the notification, etc. The locking mechanism stops this from happening.
    Since locks are present for each individual entry in the KVD, however, you are
    allowed to alter a different KVD entry from inside a callback.'
  merge: -1
  img_proc: true
- pgno: 493
  md: '# 24.4 Caveats


    The code presented in this article is not perfect and is meant as a starting point
    for you to modify as you see fit. There are a number of issues that I have not
    tackled on purpose, since requirements will differ among uses:


    +   - Thread safety. The code is not thread-safe. If you require thread safety,
    you will need to add whatever your mechanism of choice is to the code. If your
    game code is quite traditional and keeps all the KVD logic on one thread, you
    can ignore this issue.


    +   - Performance. Although the KVD is reasonably fast, you may have specific
    performance requirements affecting the details of which containers and mechanisms
    are used. For general use cases though, the code should perform adequately as
    is.


    +   - Memory allocation. The internal storage for the KVD is handled via the STL
    default allocator. This could cause fragmentation issues in your code. If you
    need to keep a firm handle on memory usage, you will need to either write your
    own container code or override the default allocator for the STL containers that
    are used.'
  merge: -1
  img_proc: true
