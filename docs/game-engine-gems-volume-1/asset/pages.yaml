- pgno: 95
  md: 'close to it.


    Within our engine, we implemented LOD directly on the volume, rather than on the
    generated triangle surfaces. That is, we build a mip pyramid where each level
    has half the width, height, and depth of the level below it. (This is conceptually
    similar to texture mipmaps used on graphics cards.) We keep the same number of
    regions such that each region also has half the dimensions of its predecessor
    in the pyramid.


    We then run the surface extraction on the appropriate mip level based on the distance
    of the region from the camera. As the camera moves around regions can have their
    surface regenerated at a different resolution, with the previous surface either
    being discarded or cached for possible later use. The threading system that handles
    this automatic regeneration in the background is discussed in Section 3.4.3.


    To actually generate the mip pyramid it is necessary to be able to derive the
    value of a voxel from the eight voxels in the preceding mip level. If we are storing
    density components for our voxels then these can simply be averaged. If we are
    storing a material ID then it does not make sense to average these (the combination
    of two different materials should be one of those two, rather than a third material).
    In our system we take the minimum, although the most frequently occurring value
    (the statistical mode) could also be chosen.


    One drawback of our LOD mechanism is that there tend to be rather large cracks
    between adjacent regions using different LOD levels. This is a classic problem
    in terrain rendering and has been the focus of significant research for the 2D
    height map scenario, but it is vastly more difficult in three dimensions. Lengyel
    [6] has solved this problem using a more sophisticated set of equivalence classes
    that consider both the higher and lower resolution data when generating triangles.


    In addition to the discrete LOD system outlined above, we also'
  merge: -1
  img_proc: true
