    + \nu \left( \frac{\partial^2 w}{\partial x^2} + \frac{\partial^2 w}{\partial
    y^2} + \frac{\partial^2 w}{\partial z^2} \right).

    ```


    These equations were used in Foster [2] and for implementation in this paper.
    The quantities appearing in the equations are summarized as follows:


    +   - \( u \), \( v \), and \( w \) are the velocities of the fluid on a face
    or a voxel in the \( x \)-, \( y \)-, and \( z \)-axis directions, respectively.

    +   - \( P \) is the internal pressure of the fluid (formally, \( P \) is the
    pressure divided by the density of the fluid [4]).

    +   - \( \nu \) is the kinematic viscosity.

    +   - \( \mathbf{g} \) is the acceleration of gravity.


    Solving Equation (12.3) by the finite difference method gives the new velocity
    on each face of the fluid domain, like the velocities in green shown in Figure
    12.1. These solutions can be found in [2] and in the source code provided with
    this gem. Note that the components of the velocity for faces perpendicular to
    the three axes (\( x \), \( y \), and \( z \)) are computed separately. Equation
    (12.2) is used to compute the null divergence of the fluid velocity. This process
    leads to fluid velocity correction and, finally, the pressure update.


    To ensure the stability of the solver, the time step \( \Delta t \) and velocities
    need to satisfy the condition


    ```

    (12.4) \max \left\{ u \frac{\Delta t}{\Delta x}, v \frac{\Delta t}{\Delta y},
    w \frac{\Delta t}{\Delta z} \right\} < 1.

    ```'
