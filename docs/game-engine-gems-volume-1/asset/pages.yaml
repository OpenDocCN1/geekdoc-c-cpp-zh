    The dimensions of a capsule are described by the height $h$ of a central cylinder,
    the two semi-axis lengths $a$ and $b$ of the cylinder''s base, and a third semi-axis
    length $c$ representing the extent of each hemispherical end cap in the direction
    perpendicular to the cylinder''s base, as shown in Figure 14.7.


