- pgno: 248
  md: '# Chapter 10: Camera-Centric Engine Design for Multithreaded Rendering


    Colt McAnlis


    Blizzard Entertainment'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Overview


    Modern graphics APIs grant the ability to render in parallel by allowing the creation
    of drawing commands on separate threads. As such, an advanced engine design must
    have the ability to scale practically in order to take advantage of increased
    core count for rendering. In order to accomplish this, an engine must solve the
    problem of how to properly break up rendering tasks to be computed in parallel,
    but in order to do that, it must first consider what the rendering subsystem is
    actually doing.


    Modern graphics engines require multiple renderings of the same scene to aid in
    the overall appearance of the final image. For instance, separate renders of a
    scene are required to compute shadow mapping, run-time reflections, screen tiling
    (for antialiasing on some game consoles), imposter generation, and offscreen particles.
    As such, it makes logical sense that the ''camera'' is the coarsest form of scene
    organization directly tied to the visibility of an environment, given that in
    order to visualize any of the concepts above, you must first define a view position,
    view direction, and eventually a render target in which to store the results.
    As most views of the scene can be rendered independently of each other, we submit
    that grouping rendering workload by camera view offers the best rendering workload
    organization to take advantage of multi-core rendering.


    In this gem, we present an engine design that scales to multi-core systems by
    using the concept of a camera to separate parallel rendering jobs. To accomplish
    this, we present two concepts. The first is an API-independent method of creating
    recordable command buffers, a process that enables us to use parallel rendering
    on any device. The second is an observation of how to distribute the creation
    of command buffers to separate threads based upon the camera with which it will
    be used. Using these two simple, yet powerful concepts can enable your engine
    to take advantage of multiple cores for rendering with the least amount of'
  merge: -1
  img_proc: true
- pgno: 250
  md: pain possible.
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 10.1 Uses of Multi-Core in Video Games


    With the boom of multi-core system availability, there''s a mad dash to fill extra
    cores with proper amounts of work to enhance the look of our products. The downside,
    though, is that for developers on platforms where the hardware configuration can
    change between two users (or even the same user), decisions must be made about
    how to accurately scale out visual features and workloads on lower-end processors.


    Typically, we run in parallel things such as particles, animations, physics, etc.,
    which can have level-of-detail (LOD) built into them for low-end machines. This
    concept, however, doesn''t directly translate to the act of submitting commands
    to the graphics API, a process which can easily incur a great deal of performance
    overhead. APIs such as DirectX 9 and DirectX 10 suffer greatly from this, as it''s
    not uncommon for frequent calls of basic API functions to become a performance
    burden. This typically causes the rendering phase to delay the processing of other
    systems in the architecture, which if highly dependent on refresh rate, could
    cause problems. The cause of this issue is the fact that we are required to submit
    commands to the device on the thread that owns the device, which for most games,
    is the same thread on which the simulation logic is run. For an in-depth examination
    of this process, please refer to [2], which provides many significant and properly
    documented examples.


    Figure 10.1 displays an example frame setup for a given game engine. In this example,
    the rendering device is owned by the primary thread, and as such, rendering a
    scene blocks the frequency of simulation updates. As described, the only two systems
    that use the thread pool are particles and animations, namely because of their
    ability to be updated without memory contention, and the concept of scaling back
    accuracy or LOD for these systems is trivial. The end of our frame goes through
    the process of rendering shadow maps, reflections, the main view, and'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'finally post-processing. Because of the fact that we must submit commands to
    the device are on the thread that owns it, most of the rendering commands are
    interwoven with logic-based operations such as scene traversals, update logic,
    and the like. This type of rendering architecture can make it difficult to maintain
    your engine and port it to other platforms.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_252_0.png)


    **Figure 10.1:** A standard game usage of parallel processing. Notice that only
    the update information tends to be multithreaded.


    To be fair, modern engines are not architected as poorly as shown in Figure 10.1,
    and on average make much better use of thread pool availability. Some excellent
    alternative threading architectures for various genres of video games, most of
    which operate by offloading the render device ownership to a separate thread,
    are listed in [2]. This follows the observation that the simulation code is not
    required to update at the same frequency as the graphics rendering, and offloading
    the rendering to a different thread allows the simulation to continue on to process
    the next frame after submitting a draw request.


    Although this architecture is more common now, it is still far from ideal. Even
    with the device submission being offloaded to a different thread, it would be
    beneficial to have the ability to modify the drawing part of a frame such that
    it could make better use of thread pool availability, thus balancing out your
    thread utilization more evenly.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# # 10.2 Multithreaded Command Buffers


    Modern rendering APIs operate internally with a data structure known as a command
    buffer containing rendering information needed to process draw commands at the
    device level. Typically, these command buffers are filled on your behalf by the
    exposed rendering API and inserted into a command queue that is executed at a
    later time. Because of this, the thread on which the rendering APIs are called
    incurs the overhead of filling the command buffer, often absorbing CPU cycles
    in a way that has historically been a common problem for modern games.


    At the time of the writing of this gem, a few APIs allow the ability to create
    dynamic command buffers or command lists on a thread separate from the one that
    owns the device, a process that allows us to distribute the overhead of filling
    the command buffers across the entire system. This represents an important step
    forward for rendering engines, as we now possess the ability to more finely control
    the workload of our rendering engine across our threading systems. The negative
    side, however, is that older APIs do not have the same abilities, causing issues
    for engines that aim to be compatible with multiple hardware levels.


