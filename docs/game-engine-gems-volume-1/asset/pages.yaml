  md: '# 17.4 Grid Optimization


    The fragment shader presented in Listing 17.3 produces very precise results, but
    it can be unnecessarily expensive for large parts of the scene. When it is known
    that a region of the screen contains pixels that are all moving at similar speeds
    relative to the camera, a simpler shader that does not consider depth can be used
    in order to increase overall performance. The use of the full implementation can
    be limited to those areas of the screen in which slow-moving foreground objects
    are expected to appear.


    In Figure 17.4, we have divided the screen into a 16×12 grid of rectangular cells.
    Before rendering the post-processing shader, we determine whether any foreground
    objects might be slow moving relative to the background and mark cells covered
    by those objects as requiring the full-blown shader. This would typically be done
    when objects are being rendered into the velocity buffer near the beginning of
    the frame. In the post-processing phase, we apply the simpler, faster shader to
    cells that have not been marked.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_395_0.png)


    Figure 17.4: (See also Color Plates.) In this image, the viewport is partitioned
    into a grid of 16×12 cells. The depth and gradient information is only used in
    the highlighted cells surrounding the character since that is where foreground
    objects are likely to be'
