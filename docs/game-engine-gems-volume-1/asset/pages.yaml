  md: '# 17.3 Rendering the Post-Processing Effect


    At the end of a frame, the motion blur effect is generated for the final image
    by rendering a post-processing shader over the entire screen. This shader uses
    the information in the velocity-depth-gradient buffer to select a set of sample
    locations from which the color buffer is read. All of the color samples that satisfy
    the minimum depth requirement are averaged together to produce the final color
    for each pixel. Since the sample locations are derived from the magnitude and
    direction of the velocity that a pixel possesses, the result is an image containing
    convincing motion blur.


    The fragment shader shown in Listing 17.3 performs the motion blur operation.
    It starts by sampling the color buffer at the pixel location being rendered, which
    we call the "center pixel", and initializing the number of valid samples to one.
    The number of valid samples is stored in the w component of the color, and the
    sample at the center pixel is always valid. This particular implementation takes
    eight additional equally weighted samples from the color buffer at equally spaced
    intervals in the direction parallel to the velocity. There is some freedom in
    choosing the number of samples and their weights, and some implementations may
    even decide to take a variable number of color samples based on the magnitude
    of the velocity.


    Listing 17.3: This GLSL fragment shader applies the motion blur effect in the
    post-processing pass. The nine color samples are accumulated in the x, y, and
    z components of the color vector, and the number of valid samples is stored in
    the w component of the color vector. The value of minDepth is calculated using
    Equation (17.9), and only samples having a depth at least this far from the camera
    plane are used to generate the final blurred pixel.


    ```

    #extension GL_ARB_texture_rectangle : require

    ```'
