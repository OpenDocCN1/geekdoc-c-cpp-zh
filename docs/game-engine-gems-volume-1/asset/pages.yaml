- pgno: 451
  md: '# # Overview


    Many simulation games are constructed around a core model in which everything
    in the game world is represented by an object. Each object is a data container,
    maintaining self-consistent state for an in-game entity. Objects can be defined
    using a type hierarchy or a composition pattern, and they can be organized spatially
    (as in a scene graph) or in flat collections.


    One challenge common to all of these implementation schemes is how to represent
    consistent object state in a multithreaded environment. For example, a game engine
    could update the simulation state on one thread, render the game on a second thread,
    and perform animation and physics work on additional threads. Data synchronization,
    consistency, and conflict resolution quickly become problems.


    This gem discusses four approaches to solving these problems:


    +   - Explicit locking

    +   - Message-based updates

    +   - Multiple thread contexts

    +   - Buffered state changes


    Each approach varies in its complexity, flexibility, and performance. To that
    end, there is no one perfect solution for all game engines, but the information
    provided in this article should facilitate choosing the most appropriate architecture
    to match a known set of requirements.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# 21.1 Explicit Locking


    The most common approach to multithreaded data contention is to add explicit locking
    using operating system synchronization primitives, such as critical sections and
    mutex locks. Locks are generally used to protect concurrent access to shared,
    centralized data resources, such as message queues or device state, and for these
    types of use cases, they are a good way to ensure data consistency across multiple
    threads. Synchronization primitives are generally well-supported, the interlocked
    scopes are explicit, and the initial implementation cost tends to be low.


    While locks are often easy to implement, they should be used with care. First,
    locks introduce blocking behavior into a multithreaded application, and the potential
    for blocking (or worse, deadlock) increases with the number of locks in the system.
    Second, many synchronization primitives consume operating system resources (such
    as kernel handles under Windows). Third, there is no point at which an object''s
    state (or multiple objects'' states) can be considered consistent. Last, it is
    generally difficult to verify the correctness of large lock-based systems without
    using advanced analysis tools and frequent code audits.


    In the specific case of object models, each object could potentially require one
    or more locks in order to support multithreaded access. Depending on the size
    of the game''s simulation, this could result in a large amount of overhead, potentially
    compromising game performance. Given that, the fine-grained, explicit locking
    approach seldom scales to large, complex simulation games.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# 21.2 Message-Based Updates


    A message queue can be used to serialize updates from multiple "writing" threads.
    Each message in the queue describes an object-related state change. The queue
    is protected by a single lock that each writer must acquire in order to write
    a message. A single "reading" thread periodically processes the queue''s contents
    by acquiring the lock, playing back the individual messages, and applying the
    state updates to their associated game objects.


    In this model, all object modifications ultimately occur from the single processing
    thread, so protecting individual objects becomes unnecessary. Reading object data
    from multiple threads is still problematic, however, because there are no data
    consistency guarantees for threads other than the one performing the message processing.


    There are three measurable forms of overhead associated with this approach. The
    first involves the memory overhead of the message queue itself. Second, state
    changes are delayed for as long as their associated message is in the queue waiting
    to be processed. And third, all writing threads must block while waiting to acquire
    the queue''s lock, which could be held by other writers or by the processing thread.
    The processing thread does not necessarily need to block if it fails to acquire
    the lock immediately, but waiting until its next attempt will further delay the
    enqueued updates, and there is still no guarantee it will be able to acquire the
    lock without blocking.


    Given these considerations, a message-based approach is most appropriate for engines
    that distribute work from a single primary thread to multiple worker threads.
    It provides a nice mechanism for serializing the results of those jobs and then
    applying them in the context of the primary update thread. Synchronization is
    limited to a single lock protecting the message queue, which reduces complexity
    and aids debugging.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# 21.3 Multiple Thread Contexts


    Another solution explicitly identifies the object data fields that need to be
    accessed concurrently. These fields are duplicated and partitioned into per-thread
    context structures. Each thread effectively gets its own "private" version of
    the fields that it can access without using locking primitives, enabling asynchronous
    reading and writing. The fields'' contexts are periodically synchronized to update
    all threads'' views of the data.


    Methods that access these fields select the appropriate context structure using
    the current thread ID. If a method modifies the field''s value, it must also make
    a record of the change, such as updating the field''s assigned bit in the object''s
    per-thread "modified fields mask". This allows individual changes to be tracked,
    which drive the synchronization process.


    At the end of each frame, all modifications are merged: the changes made by one
    thread are copied to the other thread''s context, and vice-versa. This process
    can be optimized by using a per-thread "change list" to track unresolved objects
    (in conjunction with the "modified fields mask" mentioned above).


    In the event that both threads have modified the same field independently, the
    merge is ambiguous. In these cases, one thread is considered authoritative, and
    the opposing thread''s modified value is overwritten. In a properly organized
    system, however, this should rarely, if ever, happen. Most fields will only be
    modified by one thread while being read by many.


    The merge operation is performed by an explicit synchronization step at the end
    of a rendering frame (at the vertical blank, for example) when both threads enter
    a common barrier. This effectively ties the non-rendering threads to the rendering
    thread''s update rate, but ideally the other threads are performing time-sliced
    work that is compatible with this timing model. Alternatively,'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'synchronization could be based on a non-rendering thread''s update rate (such
    as simulation updates), but then the rendering thread could not be locked to a
    specific visual refresh schedule.


    This architecture can be extended to support additional per-thread context structures
    containing thread-local fields that are not synchronized. This allows thread-specific
    code to store object-specific data using the existing object system. For example,
    the rendering system could store scene culling information on each object that
    would only be accessible through that thread''s context.


    The memory cost associated with this approach scales with the number of duplicated
    contexts. The minimum number of contexts is two, so this architecture could potentially
    halve the number of objects that can fit in memory at one time, assuming all object
    fields needed to be synchronized. There are also runtime costs associated with
    selecting the active thread, tracking modified fields, and merging contexts.


    This approach has the advantage that all thread synchronization is centralized
    within the object system. Code that works with objects can remain ignorant of
    the underlying synchronization system and will never block outside the explicit
    synchronization barrier, which is predictable. It also guarantees a consistent
    view across all object data from each thread''s perspective, as long as all data
    access respects the per-thread context partitioning scheme.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# 21.4 Buffered State Changes


    The final approach presented here is fairly strict and complex, but it also has
    a lot to offer in terms of features and architectural cleanliness. The implementation
    centers on a dedicated command queue that buffers multiple frames of state changes
    from one thread to another. This effectively splits the engine into two halves:
    a dedicated simulation thread, which produces the state changes, and a rendering
    thread, which presents the simulation state to the player.


    Another way to think about this separation is in networking terms: the simulation
    thread acts like a network server, the command queue fulfills the role of the
    network transport layer, and the rendering thread is similar to a network client
    application that presents the buffered state changes.


    The command queue is designed to hold multiple frames of simulation state. The
    simplest possible implementation uses two frames in a traditional double-buffering
    scheme: while one frame is being written by the simulation thread, the other frame
    is presented by the rendering thread.


    Frame swaps are controlled by a single lock. The simulation thread holds the lock
    while it writes its state into a new frame, forcing the rendering thread to continue
    rendering its current frame until the new frame is made available by the simulation.
    Rendering is therefore never stalled by the simulation, but it is forced to represent
    the same simulation state over multiple rendering frames when it is running at
    a faster update rate than the simulation.


    Because it is quite common for the renderer to run at a faster rate, a better
    command queue implementation uses three or more frames of simulation state. This
    layout allows the renderer to consider multiple frames of simulation state, interpolating
    between them based on timing information embedded within the frames.'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'Each additional frame of data in the queue adds latency and memory overhead,
    however, so the ideal layout for many engines uses three frames.


    In order to facilitate interpolation, each frame includes a timestamp indicating
    when the data was written by the simulation. Also, each entity within a frame,
    such as an object, is assigned a unique handle. When an entity is serialized,
    both its current handle and its handle from the previous frame are written. This
    allows the renderer''s interpolation logic to match an entry in one frame to its
    corresponding entry in the previous frame. Handles are generally represented as
    indexes or offsets into the frame''s buffer.


    In addition to buffered, interpolable state, the command queue can also handle
    discrete events. Frame events are triggered by the simulation and have some associated
    visual effect, such as starting or stopping a particle system. When one of these
    events is written by the simulation, it becomes associated with the simulation''s
    current frame. Buffered events won''t be executed by the renderer until it is
    also ready to evaluate that frame''s serialized state as well. This rule maintains
    visual consistency between object state changes and events.


    There are three clear advantages to using a frame-based dependency queue. First,
    it results in a clean separation between the simulation and rendering systems.
    Second, communication between simulation and rendering is one-way, removing any
    potential for ambiguity concerning the state of the world. Lastly, timing and
    thread synchronization are explicit, allowing the threads to run at different
    update rates.


    This type of architecture does carry some heavy costs, however, particularly in
    terms of memory usage. The size of each frame in the queue can be significant,
    and, depending on the game data and serialization requirements, frame sizes might
    vary from one to the next, making it difficult to anticipate the peak memory size
    required by the queue. There are run-time processing costs associated with serializing,
    unpacking, and interpolating buffered'
  merge: -1
  img_proc: true
- pgno: 458
  md: state, and there is the cost of delaying state changes while they're buffered
    in the queue. Lastly, in terms of overall engine design, separating systems into
    rendering and simulation "halves" can be a challenge.
  merge: -1
  img_proc: true
- pgno: 459
  md: '# 21.5 Selecting the Best Approach


    Four different approaches to synchronizing object state in a multithreaded game
    engine have been presented. All of them have been used successfully in many shipping
    titles, but selecting the most appropriate architecture for a specific engine
    requires careful evaluation of that game''s requirements. In addition, it is entirely
    possible to implement hybrid schemes, perhaps on a per-system basis, but care
    must be taken to avoid introducing additional data consistency problems as a result.


    It''s important to emphasize the weight that engine and gameplay requirements
    should have in this decision. For example, if the game embeds a scripting language,
    the implementation details of the scripting system may dictate additional requirements
    with regard to how script interacts with the game''s object system. The scripting
    environment could even host the entire object system itself, further influencing
    how the object system is connected to the rest of the game engine. Alternatively,
    the gameplay may not tolerate input delays, in which case some of the buffering-based
    approaches discussed above may introduce unacceptable latency.


    It''s also important to consider external libraries when designing this aspect
    of the game engine''s architecture. Many middleware packages have specific requirements
    with regard to data access patterns. For example, DirectX on the PC requires that
    multithreading support be explicitly enabled, and it comes with a measurable performance
    penalty, so engines that target the PC platform generally restrict rendering operations
    to the main application thread.


    With hardware and software trends clearly embracing parallel execution environments,
    dealing with concurrent data access problems is becoming an increasingly common
    problem. Game engines must be designed with both runtime and developer efficiency
    in mind, and the concurrency challenges put even more'
  merge: -1
  img_proc: true
- pgno: 460
  md: emphasis on establishing solid architectural foundations. Hopefully, the material
    presented in this gem has contributed some useful techniques to that aspect of
    game engine development.
  merge: -1
