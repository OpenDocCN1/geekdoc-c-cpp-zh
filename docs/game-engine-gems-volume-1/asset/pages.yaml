- pgno: 100
  md: '# 3.5 Rendering


    For the purpose of rendering, a bounding volume hierarchy is built with our region''s
    geometry as the leaves. The bounding box of each piece of leaf geometry is at
    most the size of a region, but is usually smaller and it takes relatively little
    effort to trim the bounding box to the size of the actual mesh. Each internal
    node of the hierarchy is built from the eight nodes below it.


    Because of the highly dynamic nature of our environments we do not perform any
    kind of precomputed visibility calculations. Visibility culling is currently handled
    simply by intersecting the view frustum with the bounding volume hierarchy, and
    rendering each piece of geometry whose bounding box is at least partly inside.
    This is a fast and efficient method for culling large amounts of geometry, but
    it is not an optimal solution for scenes with a high depth complexity. For these
    we are investigating the use of image-space methods such as Coherent Hierarchal
    Culling [4], but we do not yet know how well these will perform.


    Lighting and shadowing algorithms are also fully dynamic, as the ability to modify
    the volume at any time makes the use of precomputed illumination very difficult.
    Normals for lighting are usually provided with the vertices (as discussed Section
    3.4.1), but in some cases it is possible to generate them on the fly. So far,
    we have applied only local illumination models, but some of the current research
    on real time global illumination may also be applicable. One of the many variants
    of the popular shadow mapping algorithm can be used to generate the real-time
    and dynamic shadows.


    # 3.5.1 The Material System


    When a surface is rendered, it is almost always desirable to provide additional
    surface detail to the object though the use of texture mapping. One of the key
    problems with generating'
