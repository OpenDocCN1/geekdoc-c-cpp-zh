- pgno: 185
  md: '# 7.1 Palettes? Whatever for?


    Back in the old days of fixed-function graphics cards and limited VRAM, palettized
    textures were one of the earliest forms of compression, at the cost of color accuracy.
    However, as VRAM increased on video cards, and graphics chipsets began moving
    toward programmable shaders, palettized images gave way to S3TC/DXTC (and better)
    compression that generally give the same memory savings with better performance
    and color depth.


    So, why use palettes? Perhaps you''ve heard of its highbrow cousin, vector quantization?
    It may seem like a crazy thing to need in this day and age, but quantization codebooks
    (palettes) are useful in many contexts, not just with images. Some examples: S3TC/DXTC
    is not a good choice for all images, particularly cartoonlike graphics with large
    regions of solid color divided by sharp edges. Finely detailed pixel art ends
    up as a blocky mess. Also, some GPUs support individually indexed vertex attributes
    such as normals, colors, and so on, but are limited to either 8-bit or 16-bit
    indices. This is effectively a palette of values. Similarly, with shaders on modern
    systems, textures could be used to replace certain vertex attributes to simplify
    the number of vertex formats involved in setting up a flexible engine, and compression
    of those textures could be effective with a smaller 1D lookup table texture having
    a limited set of values. Normal maps might also be good candidates for palettizing,
    depending on the complexity of the surface. S3TC/DXTC block artifacts can show
    up in lighting on some surfaces where palettized versions would at worst show
    banding, but not blocking artifacts.


    Finally, there are the occasional obscure but amazing palette tricks that old
    game dogs know. One such trick put palettized vertex colors to excellent use.
    The general idea was to vertex-light the world in N different phases of day and
    night, then compute a 3N-dimensional palette where each "color" in the source
    image was effectively a stack of N RGB triplets. Every vertex in the world was'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'given one vertex color palette index that was the stacked color in the final
    palette. So, without changing any vertex data, simply by interpolating the colors
    inside the palette from one set of RGB to the next, vertices appear to go through
    a smooth change in time of day.


    For reference, Figure 7.1 shows how the WBP compares to Photoshop, with error
    diffusion disabled so we can clearly see the quality of the color choices.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_186_0.png)


    **Figure 7.1:** (See also Color Plates.) (a) Flowers source image using 100,162
    colors. (b) Photoshop, 256 colors. (c) Photoshop, 16 colors. (d) WBP, 256 colors.
    (e) WBP, 16 colors. (© Dundanim/Dreamstime.com)'
  merge: -1
