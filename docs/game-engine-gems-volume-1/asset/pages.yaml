    end cap. Due to symmetry, it is clear that the center of mass lies at the center
    of the cylindrical portion of the capsule.


    We can calculate the inertia tensor capsule \(\mathbf{I}_{capsule}\) by combining
    the inertia tensors of the cylinder and dome in the proper manner. With respect
    to an origin located at the capsule''s center of mass, the centers of mass for
