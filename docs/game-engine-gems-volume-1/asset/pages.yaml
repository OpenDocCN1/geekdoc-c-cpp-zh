- pgno: 242
  md: '# 9.4 Synchronizing the GPU and CPU


    Synchronizing the GPU and CPU is more difficult to handle in a multithreaded environment
    since multiple processing units might potentially want to access the same data.
    To avoid any inconsistencies and race conditions, there is a need to employ synchronization
    primitives such as mutexes or atomics. Usually, the GPU can report its progress
    in a specific memory area. For instance, when a particular command has been finished
    on the GPU, it can write a specified value, or "report", to a CPU-accessible location
    to indicate completion. Depending on the architecture, the CPU can either poll
    for the report value or receive a system callback of some kind. Table 9.1 presents
    some possible configurations.


    # Table 9.1: Synchronizing the GPU and the CPU.


    | CPU | CPU | Report | Comments |

    |---|---|---|---|

    | ... | WaitReport(22) | 0 | GPU waits for report to be set |

    | SetReport(22) | WaitReport(22) | 22 | GPU is now unlocked |

    | ... | ... | 22 | |

    | WaitReport(33) | | | CPU wait for report to be set |

    | WaitReport(33) | SetReport(33) | 33 | GPU set the report & |'
  merge: -1
  img_proc: true
- pgno: 243
  md: '| | | | unlock CPU |

    |---|---|---|---|

    | ... | ... | 33 | |

    | SetReport(12) | SetReport(15) | ? | Race condition |

    | WaitReport(33) | WaitReport(22) | ? | Deadlock |


    As with any multithreaded environment, special care is needed to avoid potential
    race conditions or deadlocks since both the CPU and the GPU can generate and consume
    data with unpredictable timing patterns.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# # 9.5 Using Additional Processing Resources


    In many games, the processing load is not fully balanced among the available processing
    units. In these cases, it can be worthwhile to move some operations that are ordinarily
    performed on the main CPU to other units that may have idle time each frame. For
    instance, less intensive graphics applications can employ GPGPU (general purpose
    GPU) code to offload physics or AI simulations from the CPU using technologies
    such as CUDA. On the other hand, games willing to push the boundaries of real-time
    3D graphics might want to use spare CPU cores to perform some graphical operations.
    If it so happens that those cores provide an interesting ISA (instruction set
    architecture) with SIMD instructions such as the SPUs on the Cell processor, then
    it becomes possible to offload the GPU for several kinds of operations such as
    the following:


    +   - Geometric processing, including procedural algorithms for creating terrain,
    trees, decals, or subdivision surfaces.

    +   - Physics and particle system updates.

    +   - View frustum object culling or occlusion culling.

    +   - Software rendering, in particular for occlusion queries and post-processing
    effects.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 9.6 Reducing the Pressure on the Memory Bandwidth


    The performance of both the CPU and GPU is improving at a very fast pace, but
    memory speed is not following the same curve, and consequently, memory bandwidth
    becomes more and more of a significant bottleneck. Therefore, it is important
    to consider any technique that would help minimize the requirements on the memory
    systems, even if it means using more CPU or GPU cycles. Some techniques that can
    be used include packing the shader input and output attributes or using the tessellation
    units of the GPU when available. On the CPU side, special geometry culling can
    avoid sending up to 70% of primitives that end up being discarded by the GPU (backfacing,
    off-screen, zero-size, and degenerate primitives). Another technique is to generate
    a coarse depth buffer in software to perform occlusion queries instead of relying
    on the GPU [1], as the latter can involve reading back from video memory, which
    is often a slow path.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 9.7 Performing Graphical Operations in Parallel


    So far, we have discussed some techniques that help to improve overall performance,
    but we can go a step further and allow different processing units to work in parallel
    to create the final image for a frame. Modern games use multiple render targets
    within a single frame, and some of them are not accessed simultaneously by the
    GPU. For instance, it is often possible to access a back buffer with another processing
    unit such as an SPU to perform some post-processing effects while the GPU starts
    rendering the next frame. This gives up to a full frame to render the effects,
    while keeping the same frame rate, but at the expense of an additional frame of
    latency (see Figure 9.6).


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_246_0.png)


    Figure 9.6: While the helper thread computes the post-effects, the GPU starts
    rendering the next frame.'
  merge: -1
  img_proc: true
