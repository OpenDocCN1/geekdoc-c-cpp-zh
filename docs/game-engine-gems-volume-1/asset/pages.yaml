- pgno: 56
  md: '# 2.4 COLLADA, A Standard Intermediate Language


    During SIGGRAPH 2004 [20], COLLADA was introduced as the first open Digital Asset
    Exchange (or .dae) specification targeting game developers. This initial specification
    was provided to the public after a year of work. Exactly a year earlier, during
    SIGGRAPH 2003, Sony Computer Entertainment was able to create a working group
    composed of key companies in the field to attempt the creation of a common intermediate
    language that would provide everything needed to represent the assets for advanced
    platforms such as the PlayStation 3. Companies such as Alias, Discreet, and Softimage
    that were competitors agreed to leave their weapons home and help with the design
    and prototyping. Game developers working at Digital Eclipse, Electronic Arts,
    Ubisoft, and Vicarious Visions liked the idea and offered to help.


    Several iterations of the specification were completed, and thanks to the first
    developers that took the challenge to help resolve many of the issues in real
    use cases, the specification finally got to a stable state. In July 2005, the
    version 1.4 specification [21] was published as an open standard by the Khronos
    Group [22], the same group managing the OpenGL, OpenGL ES, OpenCL, and other well-known
    graphics standard specifications. The version 1.4 specification had minor fixes
    made, providing the 1.4.1 specification which, at the time of this publication,
    is the most popular implementation available.


    During SIGGRAPH 2008, the version 1.5 version of the COLLADA specification was
    introduced [23], adding features from the CAD and GIS worlds such as inverse kinematics
    (IK), boundary representations (b-rep), geographic location, and mathematical
    representation of constraints using the MathML descriptive language. The version
    1.4.x and 1.5.x specifications are not fully backwards compatible, which is not
    an issue since intermediate'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'assets are to be re-exported from the source assets anyway. As of today, the
    version 1.4.x format is the format supported by most applications, while version
    1.5 support is limited to a few applications, mostly in the CAD space. Version
    1.4.x and 1.5.x are to exist and be maintained in parallel. The new features introduced
    in version 1.5 will most likely never find their way into the version 1.4.x specification,
    though, so more and more tools are likely to provide both implementations. Loading
    version 1.4 or 1.5 should be transparent from the user''s perspective anyway,
    since the document contains information about which version it is encoded with.


    Since COLLADA is an open standard, many companies have been providing implementations.
    COLLADA was designed from the start to be a lossless intermediate language that
    applications can export and import. It is important for COLLADA to be a language,
    and in order to be useful, a language needs to be both spoken and understood.
    Also, to be able to validate and test an implementation, it is necessary to test
    an application with valid documents to load and then export in order to compare
    with the original data set to see if any data was lost during the process. This
    is the foundation of the official Khronos COLLADA conformance test that is available
    to Khronos Adopter members and provides a validation and certification process
    in order to provide the end-user with the assurance of a good quality implementation.
    The applications that have passed the test are authorized to display the conformance
    badge logo. Setting up an effective independent conformance test is no easy task,
    so before it is available and enforced there is some level of incompatibility
    due to the different possible human interpretation of the specification, but nothing
    that cannot be fixed by the end-user.


    Since COLLADA provides for both import and export functionality, and since it
    is available for many tools, it has also been popular as an interchange format.
    The goal of an interchange format is to enable source assets to be transferred
    from one DCC tool to another DCC tool, which is definitely not the purpose of
    the asset'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'pipeline. It turns out that COLLADA is quite good as an interchange format,
    and has been providing for free, faster, and more accurate conversion of data
    between tools than some of the existing solutions.


    The COLLADA 1.4.x feature list includes geometry, animation, skinning, morphing,
    materials, shaders, cameras, (rigid body) physics, and a transformation hierarchy.
    It is built upon the XML (Extensible Markup Language) standard for encoding documents
    electronically, so all COLLADA documents can be managed by any of the commercial
    or open-source XML tools. COLLADA is defined using the XML-Schema language [24]
    so that the COLLADA schema can be used by tools to validate the document or automatically
    create APIs in various languages as well as editing and presentation tools.


    COLLADA is extensible in a very structured way. It is mandatory for an intermediate
    format to be extensible because the asset pipeline will need to encode data specific
    to the game engine or the game itself. The problem with extensions is how to design
    them so that the tools that do not recognize the extension can still import the
    intermediate assets and be able, when possible, to carry an extension forward.
    COLLADA provides several places in the schema where objects can be extended using
    the `<technique>` and `<extra>` elements associated with other elements in the
    specification. Since these elements are not permitted to be placed everywhere
    in the document, a COLLADA parser can be designed to recognize those extensions
    and either ignore the content, or better, keep the content in a string to pass
    the information through. Of course, if the tool recognizes the extension, it should
    use it! There are two ways to extend an object: either it is additional information
    augmenting the definition of an existing element, or it is an alternative definition
    of the common definition of the element. It is up to the developer to decide how
    to extend. In the case that the extension is made by substitution, it is a requirement
    to keep a common definition available that can be used by other tools as a place
    holder. For example, an engine using specific geometry'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'definitions, such as metaballs [25], can use the `<extra>` element to store
    the metaball information and keep a standard mesh geometry to store a generic
    mesh.


    Let''s have a look of some design principles that are applied to provide the flexibility
    necessary to represent data in a common language while still enabling it to be
    as close as possible to the specific DCC representation as well as enabling internal
    transformations to move it closer to the engine-specific representation. The remainder
    of this section is an overview of the COLLADA design principles. For more technically
    detailed information, the reader can refer to the COLLADA 1.4 and 1.5 specifications
    available on the Khronos website [22] and on the CD accompanying this book. These
    specifications and the COLLADA reference book [26] provide more details on the
    choices made when designing the standard.


    # The `<source>` Element


    The `<source>` elements contain the raw data that is used by the assets. Like
    every other element, it has an `id` attribute that has to be unique in a valid
    document. A source contains a one-dimensional array of data of a specific type
    (ID, name, boolean, floating-point, or integer). Each element can have a name,
    which has to be a valid XML string of characters, but the name information is
    only used to store information relevant for humans and never used to reference
    an object in a document. Floats and integers can be expressed with any number
    of digits, providing for any level of accuracy needed. Despite popular belief,
    there is absolutely no loss of accuracy representing floating point numbers using
    decimal digits, provided that enough digits are used—9 for single precision and
    17 for double precision [27]. The arrays themselves contain a `count` attribute
    that provides for easier memory allocation.


    The `<technique_common>` element provides information about how the source should
    be accessed by the other elements defined'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'by the specification. The <technique> element is where the extensions can be
    found; an element can carry extensions from several tools at the same time since
    each tool provides a profile name for its technique.


    Figure 2.4 shows that only one array can be in a <source> element by using a selector,
    and it shows that the name attribute is optional (by using dotted lines) and the
    id attribute is mandatory. All this information is stored in the XML schema available
    on the Khronos website, which can be automatically converted into a drawing or
    used to validate a document. Listing 2.1 shows what a source looks like in a document
    and that it is quite easy to parse.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_60_0.png)


    Figure 2.4: Definition of the <source> element.


    # Listing 2.1: A example <source> element and <accessor> element.


    ```

    <source id="meshl-geometry-position">

    <float_array id="meshl-geometry-position-array"

    2518.1875 4074.512965 0. 2518.1875 0.

    ...

    </float_array>

    <technique_common>

