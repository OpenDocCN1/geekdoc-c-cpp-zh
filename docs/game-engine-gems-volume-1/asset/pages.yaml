  md: '# 3.4 Surface Extraction


    We have already introduced the principles of the Marching Cubes algorithm (and
    we suggest the reader consult [7] for a more detailed explanation). In this section
    we examine some of the practicalities of implementing the algorithm with respect
    to our specific application. These include:


    +   - Allowing the data to be modified in real time, and intelligently regenerating
    the surface for the modified part without running the algorithm over the entire
    volume again.

    +   - Outputting the resulting surface mesh in a format that is suitable for GPU
    rendering or for further processing.


    To aid with the above, we break our volume down into adjacent and non-overlapping
    cubic regions. This means that every cell is in only one region, but voxels on
    the face, edge, or corner of a region is also belong to neighboring regions. Each
    of these regions is assigned separate vertex and index buffers to hold the mesh
    data corresponding to the surface that is contained in that region. Additionally,
    each region keeps a dirty flag that indicates whether the triangle data in the
    buffers matches the current volume data for that region.


    Although this may sound similar to the breaking down into blocks discussed earlier,
    it is important to realize that the two concepts of regions and blocks serve entirely
    different purposes. Blocks are a data representation used to provide efficient
    storage and fast access to the voxels, where as regions are used to restrict the
    execution of the Marching Cubes algorithm to the parts of the volume that have
    changed, and also for the purpose of visibility culling.


    After the volume is set to its initial value, the Marching Cubes algorithm is
    executed to update the mesh data for each region, and the dirty flag is cleared.
    Further attempts to write to the volume'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'result in the regions containing the affected voxels being marked as dirty.
    A trivial check is performed to ensure that voxels are not being set to their
    current value. Also, remember that most voxels only belong to a single region,
    but those on the face, edge, or corner of a region are shared by neighboring regions
    as well. Hence, modifying a single voxel can cause multiple dirty flags to be
    set.


    Any dirty region will need to have its mesh regenerated, but this should not happen
    immediately because it is an expensive operation, and it is likely that other
    nearby voxels (probably in the same region) are also about to be updated as a
    result of the user''s current action. Regeneration should instead be delayed until
    all volume modifications for the current frame are complete.


    As with the block size, there are a number of factors to take into account when
    choosing an appropriate region size:


    +   Smaller regions mean more regions, resulting in a higher batch count. For
    each region that contains a surface, we generate at least one batch (possibly
    more than one batch if we split materials as described in Section 3.5.2). Batch
    count is one of the limiting factors in the performance of modern GPUs.


    +   Smaller regions offer the opportunity for finer-grained occlusion culling
    (see Section 3.5).


    +   Smaller regions will typically enclose a modified part of the volume more
    tightly, meaning fewer cells have to be processed by the Marching Cubes algorithm.


    +   Large regions take longer to regenerate.


    +   Large regions may contain more than 65,536 vertices, which will then require
    32-bit indices. This has some memory overhead, and may not be supported on older
    hardware.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   Matching the region size to the block size makes it easier to implement
    the Marching Cubes algorithm in a cache-friendly manner.


    As a guideline, we break our volume down into 8x8x8=512 regions.


    In addition to generating the vertex positions, we also require vertex normals
    to perform shading calculations. There are several known approaches [17] to computing
    these normals from the mesh data but these can suffer from mismatches on the region
    boundaries. An alternative is to misgenerates the normals directly from the volume
    data by computing the gradient vector.


    An approximation of the gradient vector can be found using the central difference
    operator [12]. For a voxel at integer position(x,y,z), the central difference
    gradient can be found by examining the density value of neighboring voxels as
    follows:


    ```

    \nabla f(x,y,z) = \frac{1}{2} \begin{bmatrix} f(x+1,y,z)-f(x-1,y,z) \\ f(x,y+1,z)-f(x,y-1,z)
    \\ f(x,y,z+1)-f(x,y,z-1) \end{bmatrix}

    ```


    If a smother gradient is required then the Sobel operator [12] may be used instead,
    but in general the central difference operator will be sufficient for our purpose.
    The gradient at an arbitrary point in the volume can be found by interpolating
    the gradients from the corners of the corresponding cell. When finding the gradient
    at a given vertex position, a one-dimensional interpolation is sufficient because
    a generated vertex will always lie on a cell edge.


    # 3.4.1 Output of the Algorithm


    For each region, the algorithm generates a single vertex and index buffer pair.
    In the case that the region does not contain a surface, the buffers will be empty
    and need not be uploaded to the GPU. As mentioned, the indices may be either 16
    or 32 bits depending on'
