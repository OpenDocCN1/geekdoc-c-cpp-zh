- pgno: 478
  md: '# 23.2 Design Features


    # Tree Structure


    The object hierarchy itself is a tree structure. There is one root node, owned
    by the manager class. Each object has one and only one parent. Each object has
    zero or more siblings, and each object can have one child link. Once you have
    your tree structure, there are two relationships that are required to be maintained
    when parsing the tree:


    +   Parents are always updated before their children.


    +   Siblings are always updated in the same order, first to last.


    Given these two relationships, there are two ways to traverse the tree and update
    your objects: depth first and breadth first. Which one you choose depends on your
    requirements, but due to memory access patterns and performance I favor the breadth-first
    traversal. Figures 23.2 and 23.3 show a simple graph and the update orders for
    both systems. As you can see, the two rules above are maintained for both traversal
    systems—previous siblings are processed before next siblings, and parents are
    processed before children. A real-world example of a CEH might look like that
    shown in Figure 23.4.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_478_0.png)


    Figure 23.2: Simple graph.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_479_0.png)


    # Figure 23.3: Update orders.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_479_1.png)


    # Figure 23.4: Example CEH Graph.


    # Time Deltas


    You may have noticed that the `Update()` method in the base takes a floating-point
    `dt` parameter. This is used to tell your object how much time has elapsed since
    the last call to `Update()`. Making your code flexible regarding update frequencies
    and decoupling objects from V-sync events can have great benefits, as long as
    you are willing to do the extra work to make your object internals robust for
    varying `dt` values.


    Adding awareness of time also gives your CEH the potential to deal with varying
    timing requirements for its objects. For instance, it is simple to build basic
    timer functionality into the manager class, allowing you to specify how often
    various objects require updating. If you have an object that only needs to be
    updated approximately once each second, then that object can tell the manager
    that its desired update interval is only every second. The manager class can then
    handle the update call for you.'
  merge: -1
  img_proc: true
- pgno: 480
  md: "# Dynamic Structure\n\nSince the update hierarchy is built at run time, it\
    \ can be treated as a dynamic data structure. Update order is not hardwired into\
    \ your code, but can be modified and altered as required. If network code does\
    \ not need to be updated due to there being no network connection, you simple\
    \ omit it from the update graph. This can be much cleaner than placing the following\
    \ if statements all over your code.\n\n```\nif (networkActive)\n{\n    ...blah...\n\
    }\n```\n\nIt also allows you to define your update graph via a data file, allowing\
    \ runtime behavior to change without recompiling your code.\n\n# Introspection\n\
    \nBy building an introspection system into your CEH base class you allow for much\
    \ more flexible code construction. I'm sure we've all been in the position of\
    \ needing to get a handle on a certain class instance and being forced to navigate\
    \ a lot of run-time linkage to get at the object. The alternative is to make the\
    \ desired object global, rarely a good thing. As an example, in Figure 23.2, for\
    \ object E to get a pointer for object G, it could be required that E goes through\
    \ code like this:\n\n```\nptrG = GetD() ->GetA() ->GetB() ->GetF() ->GetG();\n\
    ```\n\nThis is rather clunky, and if the linkage of intermediate classes changes,\
    \ say objects A and B are swapped, all of the code that manually navigates the\
    \ linkages needs to be updated.\n\nUsing a CEH with introspection, the call could\
    \ look like this:"
  merge: -1
  img_proc: true
- pgno: 481
  md: '```

    ptrG = GetFirst<G>();

    ```


    This code does not need to be altered if the hierarchy changes since the CEH manager
    does all the work of locating the first instance of class G and returning a pointer
    to it. This is how using CEHs can make your code more resilient to code restructuring.
    The introspection system can also provide APIs that deal with vectors of objects
    and filtering of objects based on relative location (above, below, etc.). Object
    linkage is no longer explicit in code, but dynamic at run time.


    # Visualization


    Visualizing the execution of your code can be a great help in debugging and bringing
    new members of your team up to speed with your code. Using a CEH can help make
    this visualization consistent and useful. Since the calling graph and actual call
    order are controlled by your manager class, you can get the manager to output
    data about your execution behavior for you. A handy format that I use is to output
    the execution graph in DOT file format [1], and then run this file through GraphViz
    to get a snapshot of how the code is linked and executed.


    # Deferred Operations


    There are certain operations that are very dangerous to perform while you are
    mid-way through the graph traversal. Any operation that modifies the graph (delete,
    move, create) during the update phase can have disastrous effects since you are
    altering the same tree you are traversing. To shield against this, dangerous operations
    can be queued until the end of the update phase. These deferred housekeeping tasks
    can catch you out if you are expecting the modifications to happen immediately,
    but the added layer of bug protection it gives you is worth the trouble.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 23.3 Benefits & Pitfalls


    Moving your execution control over to a data driven, dynamic system like code
    execution hierarchies has both benefits and pitfalls. The benefits include:


    +   - Code is constructed with a consistent pattern (Init, Update, Destroy, etc.).

    +   - Update order is easier to modify since the order is dynamic rather than
    hardcoded.

    +   - Introspection can make finding object instances easier than manually navigating
    class linkages.

    +   - Introspection allows the layout of objects to change without the need to
    maintain manual linkage code.

    +   - It is simple to visualize the execution order and hierarchy of your code.
    This aids debugging and teaching of programmers new to the team.


    There are, of course, a few pitfalls and caveats that come with the use of code
    execution hierarchies. These include:


    +   - It is difficult to see what is happening by just looking at the code. Since
    the update order is dynamic and built at run time, manual inspection of the source
    code doesn''t help much.

    +   - Some code simply doesn''t fit. Even though CEHs provide a simple and flexible
    structure, there are still pieces of functionality that don''t fit into the framework.
    You still have to deal with these systems manually and take care of object linkage
    by hand.

    +   - You need to be careful with your granularity. Putting game systems and substantial
    game objects into the CEH can be'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'very useful. Placing every particle in a particle system is overkill, and you
    will waste lots of CPU cycles and memory to unnecessary CEH overhead. You need
    to use your judgement.


    +   - Modifying the execution tree while you are traversing it can cause lots
    of catastrophic but difficult-to-find bugs. You need to be very careful when altering
    the tree or defer all modification operations until after the update phase has
    completed.


    Code execution hierarchies are a huge topic for discussion. I have worked with
    code that uses explicit execution order, linear lists or queues of update functions,
    and deeply embedded tree hierarchies, and they all have their good and bad points.
    My hope is that this gem has introduced a new way of thinking about code execution
    to those who have not used dynamic systems before and has possibly provided some
    food for thought for those currently using dynamic execution systems. Game code
    inevitably becomes complex, and new ways of looking at how we construct code are
    always useful. Using consistent and flexible methods like those I have described
    can help ease the pain and provide much needed abstractions.'
  merge: -1
  img_proc: true
