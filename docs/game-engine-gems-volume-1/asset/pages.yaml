  md: "# 26.4 Creating Observers\n\nAny class in your game engine library can be made\
    \ into an observer, and thus can be made to observe game state. To turn an existing\
    \ class into an observer, you must first declare that it implements the `INotifiable`\
    \ interface, and then you must provide the implementation for the `ProcessNotification()`\
    \ method defined in the `INotifiable` interface, as exemplified by Listing 26.6.\
    \ In its minimalist form, `SomeGameComponent` is an observer. It defines no useful\
    \ functionality, stores no data, and does nothing with any notifications it receives,\
    \ but it has all the moving parts needed to be classified as an observer.\n\n\
    # Listing 26.6: A sample observer implementation.\n\n```\nclass SomeGameComponent\
    \ : INotifiable\n{\n    // Define class data members here\n\n    public void ProcessNotification(IObservable\
    \ subj\n    {\n        // Query the subject for any meaningful chang\n    }\n\
    }\n```\n\nIn Listing 26.6, the argument received by the `ProcessNotification()`\
    \ method is of type `IObservable`. This means that any instance of any class that\
    \ implements the `IObservable` interface can be passed into this method. However,\
    \ it also means that only the methods defined in the `IObservable` interface can\
    \ legally be called without explicitly casting the argument to a known type. In\
    \ other words, we cannot query `GameState` properties or call methods of the `GameState`\
    \ class"
