- pgno: 462
  md: '# 22.1 Tasks Versus Threads in Games


    Parallel programming in games has typically relied upon the use of threads to
    provide concurrent execution of work. Threads are independent processing streams
    that are given execution time based upon a scheduling algorithm in the host operating
    system. This system works well as long as there are enough hardware resources
    (CPU cores) to run the available threads. However, modern games run on a variety
    of platforms, with very different core topologies. Predetermining a specific number
    of threads for a fixed amount of work is no longer a viable strategy.


    A popular alternative strategy is to define a thread pool, with a number of threads
    scaled to fit the available hardware resources. Parallel work is divided into
    tasks and assigned to the threads for execution. These tasks differ from threads
    in that they should never block while waiting on other computation. When the task
    is started, it is run to completion and cannot be swapped out for the purpose
    of running another task. So the challenge of coordinating the activity of multiple
    threads is changed into the effort of determining how to divide work into tasks
    and under what conditions those tasks should be run. The second half of this gem
    demonstrates methods for breaking down typical parallel game patterns of work
    into tasks.


    Figure 22.1(a) shows an example of how some sample work can be divided into tasks.
    The total work has an initial period of uninterrupted work A, but then needs to
    wait on the occurrence of some event E before proceeding with additional work
    B. This dependency on the event E effectively splits this section of work into
    two tasks, A and B. Later, work C is a section that could be split into pieces
    and run concurrently (a data decomposition). If it is split into pieces, work
    D must wait for all of those pieces to complete before it can proceed. This means
    that the rest of the work can be split into some number of tasks C1,C2,...,Cn
    and the remaining task D. The final task breakdown is shown in Figure'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# 22.1(b).


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_463_0.png)


    Figure 22.1: (a) Work to be divided into tasks. (b) The work expressed as dependent
    tasks.


    Taken alone, this transformation from threads to tasks can seem underwhelming.
    The real power of this approach becomes evident when a game architecture is able
    to leverage large amounts of parallel work at once. In that case, the tasks can
    be packed into the threads in the pool with very few gaps of inactivity. Mapping
    all the tasks to the thread pool in an efficient fashion is the responsibility
    of a task scheduler, the other focus of this gem.'
  merge: -1
