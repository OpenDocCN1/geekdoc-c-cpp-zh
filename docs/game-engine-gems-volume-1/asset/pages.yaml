- pgno: 141
  md: '# 4.7 Why Go Through All This Trouble?


    One of the big advantages of our high-level path is in the constraints we can
    apply in low-level pathfinding. The A* algorithm is well known to suffer horribly
    from flooding problems. It often searches in the wrong direction and into concave
    spaces, and it ultimately checks many tiles that are unnecessary. Using our high-level
    path information, we can constrain our low-level pathfinder to only consider tiles
    inside our beacon-point (or their adjacent) regions. This keeps the low-level
    pathfinder from flooding outwards and backwards into areas that we know, at a
    high level, it doesn''t need to check. This saves a huge percentage of A* loop
    iterations over the lifetime of the path.


    The key to this optimization is its one-two punch of first using a high-level,
    fuzzy path to determine the correct, but ugly, route to an actor''s destination.
    This first punch delivers incredible performance, something crucial for today''s
    path-finding. Follow this up with our second punch, a series of low-level, detailed
    paths between beacon points. Suddenly, our ugly beacon-point paths look beautiful
    and intelligent. Separately, these path techniques have major strengths and weaknesses;
    however combined, strengths cancel each others weaknesses, and our pathfinding
    becomes unstoppable.'
  merge: -1
  img_proc: true
