- pgno: 464
  md: '# 22.2 The Task Scheduler


    There are only a few features that must be implemented in a task scheduler. At
    a minimum, it must be possible to dispatch and wait on tasks. Dispatched tasks
    are assigned to a thread in the thread pool, the size of which can be specified
    at initialization time. Although this can be done simply with a single shared
    task queue, most task scheduler implementations have a more complicated internal
    architecture for performance reasons.


    The key performance improvement is the use of per-thread task queues. This eliminates
    the synchronization chokepoint when one shared task queue is used. If a task spawns
    additional tasks, the new tasks are added to the current thread''s queue. This
    introduces the possibility of queue size imbalance, which is typically resolved
    by the use of work stealing. Work stealing allows a thread that has emptied its
    own task queue to take work from another thread''s queue. Advanced task schedulers
    may use heuristics to determine which thread to steal from and which task to steal,
    and this may help cache performance. Together, these improvements eliminate significant
    synchronization overhead in the task scheduler.


    Even though the minimal feature set is so simple, it can be daunting to create
    a task scheduler from scratch because of the difficulty of writing correct multithreaded
    code. Thankfully, there are existing examples to use or study: Nulstein [1] is
    a small and simple free source task scheduler for Windows, and Intel Threading
    Building Blocks [2] is a highly optimized scheduler with both a proprietary and
    an open source license available for Windows, OS X, and Linux. The open source
    version has also been ported to the Xbox 360. Intel Threading Building Blocks
    is used for the code samples in this gem, but any task scheduler will work as
    long as it has the minimum feature set: dispatching and waiting on tasks in a
    scalable thread pool.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# # 22.3 Decomposing Game Patterns into Tasks


    A task scheduler can efficiently execute tasks, but parallel games don''t typically
    use tasks directly. Instead, there are a number of patterns that have emerged
    in game architectures for handling parallel work. Conveniently, it''s not difficult
    to transform these patterns into task-based patterns. These transformations are
    described for those creating a task scheduler as well as for those working with
    an existing task scheduler. The patterns can be implemented in either case, but
    it is often more efficient to extend the task scheduler to support the patterns
    that your game actually uses.


    The examples below describe each pattern and show an excerpt of the complete source
    code that accompanies this gem on the CD. You will need to examine the complete
    source code to see the whole pattern in action.


    # ## Callbacks and Futures


    Games frequently have a need to run some work in parallel to the main work. This
    parallel work is sometimes structured as a function that sets a flag when complete.
    This flag can be checked later to determine when the parallel work has finished.
    This is an example of a callback system, and it maps directly into a task-based
    pattern by using the dispatch method of the task scheduler:


    ```

    TaskManager::JobResult result;

    bool flag = false;

    taskManager->dispatch(&result, (TaskManager::JobFun

    &flag);

    ```


    The obvious improvement that can be made to this system is to allow the dispatching
    thread to wait on the completion of the function pointer. This is called the future
    pattern and is supported'
  merge: -1
  img_proc: true
