- pgno: 133
  md: '# 4.5 Fuzzy Pathing Phase


    We have an actor, a starting point, and a destination point, and now it''s time
    to path! First, we need to determine the path region of our actor and that of
    the destination. From there, we hand this data over to a high-level (or fuzzy)
    pathfinding engine that computes a list of connected beacon points indicating
    the regions an actor must traverse to get to his destination. Luckily, this is
    not difficult if you''re familiar with A*.


    Fuzzy pathfinding engines work just like low-level pathfinding engines. In the
    case of A*, the algorithm finds the lowest cost route from a starting point to
    an ending point by examining adjacent regions, computing the costs for traversal,
    and flooding outward until a path is found. There are a few important differences,
    but overall, much of the A* engine design can use the same storage mechanisms
    [1], design [2], and optimizations [4] used in low-level A* engines. The big difference
    is that a path region''s "neighbors" are not at the guaranteed left, right, up,
    down, and diagonal positions of a path region. Instead, they are all of a path
    region''s adjacent neighbors. Think of regions as being nodes in a graph since
    a given region could contain ten regions on its right, and only one on its left.


    Listing 4.3 demonstrates an A* engine update, and we see the adjacency iteration
    loop used in the A* machine [1]. We get the path region from the current A* node,
    iterate over its adjacent regions, and if RegionIsOpen() method returns true,
    then we know our actor can legally move from the current region into the adjacent
    region. If the move is indeed legal, then the CheckNeighbor() method computes
    the costs of moving from one region to the other and places that node on the appropriate
    A* list.


    # Listing 4.3: Primary adjacency update loop for fuzzy pathing A* engine.'
  merge: -1
  img_proc: true
