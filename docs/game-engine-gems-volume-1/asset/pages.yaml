- pgno: 553
  md: '# 28.4 Why RPC is Useful for Game Engines


    Since the RPC technology enables you to connect running processes on different
    systems like PC and game consoles (e.g., Xbox 360 or PlayStation 3), the possibility
    of distributed processing leads to many useful cases that let your engine and
    development tools interact at runtime. The following are some useful cases of
    interacting applications:


    +   - An advanced log tool, as shown in Figure 28.5(a). This tool could be able
    to output the text messages (events, warnings, errors) for the sending game and
    additionally support an integrated console to send back commands from the tool
    to the game. Enabling the tool to cheat or to switch modes in the running game
    from outside, this is a useful application of RPC especially on game consoles
    that don''t support keyboards. This is also useful in the case of a long distance
    between the system running the log tool and the system running the game connected
    via TCP/IP and the local intranet or the internet.


    +   - External editing tools connected to separate runtime applications—applications
    that make use of connected runtime processes to be able to send instructions and
    receive real-time feedback. This is useful for light source placement or cutscene
    editing in the running game from outside with a connected tool. It is also useful
    for editors that need to run system-dependent processes and calculations on other
    machines to be able to detect specific restrictions and issues.


    +   - An editor connected to several platforms at the same time (see Figure 28.5(b)).
    It can be useful to be able to get rendered screen views from different machines
    at the same time. That enables you to display the screens of multiple instances
    of a running game sent from connected PCs and multimedia consoles on your PC and
    detect machine-dependent differences in quality and performance.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '+   - Advanced precalculations on multiple machines. You can use the computer
    systems connected to your intranet for distributed computations in expensive precomputation
    steps, for example, to calculate the static lighting and ambient occlusion in
    high-detailed game worlds, etc.


    (a) Log tool connected to an instance of the running game.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_554_0.png)


    (b) Editor connected to two instances of the running game on two different platforms.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_554_1.png)


    Figure 28.5: (a) A log tool connected to a running game. (b) An editor application
    connected to two instances of a game.'
  merge: -1
  img_proc: true
