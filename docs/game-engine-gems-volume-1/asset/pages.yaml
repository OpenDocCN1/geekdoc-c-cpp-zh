- pgno: 383
  md: 'samples for a particular pixel. In particular, if a fast-moving object passes
    behind a slow-moving or stationary object with respect to the camera, then the
    motion blur applied to pixels belonging to the background object should not sample
    pixels belonging to the foreground object. To prevent this from occurring, we
    must be able to determine when pixels belong to the same object and when they
    don''t, while the post-processing shader is collecting color samples. This can
    be accomplished by storing additional information about the depth and the slope
    of surfaces in the velocity buffer.


    In the two remaining available channels of the velocity buffer, we store the depth
    z of each pixel in camera space, and we store the magnitude of the two-dimensional
    gradient of the depth. These values give us the ability to calculate the minimum
    depth z_min that a sample location must have in order to be considered part of
    the same surface as the pixel being blurred. The formula is


    ```

    (17.1) z_min = z - r|∇z|,

    ```


    where r is the distance from the sample location to the pixel being blurred. Color
    samples lying closer to the camera than this minimum depth are discarded. Figure
    17.3 demonstrates how this technique eliminates artifacts that appear if the depth
    and gradient are not considered.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_383_0.png)


    Figure 17.3: (See also Color Plates.) In these two images, the camera is rotating
    around the character, causing the ground to move across the screen while the character
