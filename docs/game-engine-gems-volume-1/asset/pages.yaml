- pgno: 220
  md: '# 8.2 Stereo Techniques


    Today, there are three different popular techniques of viewing graphics in stereo
    on the market: anaglyph stereo (a.k.a. red/green stereo) [2], temporal multiplexing,
    and polarization. We give a brief overview of these techniques and mention some
    pros and cons as well as examine the coding and decoding process for each of them.
    An important concept discussed is ghosting [14], which should be avoided as much
    as possible. Ghosting means that one eye sees some of the content meant for the
    other eye.


    # Anaglyph Stereo


    Anaglyph stereo is the simplest and cheapest way of delivering stereoscopic game
    content to the players. Here, the left and right views are separated using wavelength
    separation. The left view is simply encoded in the red channel and the right view
    is encoded with complementary colors such as the green channel or both blue and
    green (cyan). The player needs to wear the well-known red/green glasses in order
    to separate the two images so that each eye sees only the image meant for it.
    Hence, the color of the lenses in the glasses corresponds to the color channels
    that encode the picture, and this is the reason for its name. The source is encoded
    into one image, which means that this method can be used for a lot of different
    media, even in printed form.


    The benefit of using this technique for games is that it does not require any
    special display system, just a pair of cheap red/green glasses in order to be
    able to view the effect. You''ve probably gotten a pair of cardboard glasses with
    acrylic lenses for free when you bought you favorite comic magazine that had a
    special 3D centerfold issue.


    One pitfall using this technique is that the player must calibrate the screen
    so that the color matches the filtered glasses. Otherwise, the player sees a lot
    of ghosting with a bad quality stereo effect.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'There is also a noticeable loss of color, as a lot of the color information
    is being filtered out.


    A more sophisticated version, sometimes called the super anaglyph technique, uses
    spectral multiplexing, more often referred to as Interference Light Technology
    (INFITEC) [9]. Spectral multiplexing works by dividing the visual spectra into
    six narrow bands, two bands for each of the primary colors red, green, and blue.
    These bands are then separated by filters and divided so that one band of each
    color reaches each eye. That is, half of the red spectra reaches the left eye,
    and the other half reaches the right eye, and so on. This system requires that
    two such filters of different type performing this spectral multiplexing are mounted
    onto two projectors for the display, as well as a pair of lightweight glasses
    that the player wears with one type for each eye. Hence, the viewer clearly sees,
    if he shuts one of his eyes, that the color information reaching the eye is slightly
    different compared to looking at the display using only the other eye. Nonetheless,
    the color differences are less than that seen when using the red/green glasses.
    Finally, the brain merges these two images into one without a problem, and the
    picture looks as expected.


    # Temporal Multiplexing


    This technique encodes the stereo pair by interleaving them time-wise. Hence,
    one frame is being shown for the left eye while the right eye is being occluded
    by an active shutter. Similarly, the next frame is visible to the right eye while
    the left eye is being occluded. If this procedure is performed fast enough, the
    player perceives the interleaved images as one continuous stream of images and
    gets the stereopsis right. This technology cuts the effective frame rate in half,
    as it is necessary to render twice as many images to get the same update rate.
    The occluding is performed by a pair of active shutter glasses, usually a pair
    of LCD screens that is synchronized to the display. While the display system shows
    a new frame, it sends a signal to the glasses to make the shuttering. It is clear
    that this technique requires glasses that cost a lot more than the simple'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'red/green glasses. Furthermore, it cannot be used for printed media since,
    clearly, the display system has to have two sources for the output.


    # Polarized Light


    Image separation can also be achieved by encoding each image using polarization.
    The two images are superimposed onto the screen by the display system through
    a pair of orthogonal polarizing filters. The viewer also wears a pair of glasses
    with corresponding filters, which are relatively cheap compared to the active
    shutter glasses. The polarization directions in the glasses correspond to those
    on the source. Thus, no extra hardware is needed in the glasses, but once again
    it is necessary to have two sources of light, and this technique cannot be used
    for printed media. The viewer must not tilt his head when using this technique,
    as it results in severe ghosting. Alternatively, circular polarization can be
    used in an attempt to avoid this problem. In all cases, polarized filters dim
    the brightness of the source because the original content is filtered.


    # Summary


    All three techniques previously mentioned (with the exception of the INFITEC variation
    of anaglyph stereo) have become mainstream for playing stereo games. A pair of
    anaglyph glasses has a very low price and does not require the player to invest
    in any additional hardware to enjoy stereo games, but it produces the worst color
    representation of the three mentioned techniques. However, the frame rate does
    not have to be increased as for temporal multiplexing. Temporal multiplexing requires
    that the player acquires the actual glasses and also has a source that can preferably
    emit 120 Hz, since the actual frame rate is cut in half with this technique. The
    current trend is that more of this type of display and TV are coming out. The
    polarized light technique is realized either as an actively polarized display
    or by having two'
  merge: -1
  img_proc: true
- pgno: 223
  md: projectors for the really luxurious players. Regardless, the glasses are passive
    and thus generally cheaper.
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 8.3 Design Considerations for 3D Scenes


    What really differs when creating content for a stereoscopic game engine compared
    to a monoscopic one? There are some approximations that can look very bad or very
    flat when ported to a stereoscopic display. We discuss some of them in this section.
    It is also important to avoid some situations that can be unpleasant for the player
    [10].


    Culling can be a problem in the sense that we have two frusta to clip against.
    Clipping against the monoscopic frustum would yield erroneous results, as this
    is smaller than the combination of the left and right frusta. This problem can
    be handled in at least two ways, either clip against the joint frusta from left
    and right at once or clip separately against both frusta.


    Stereoscopic rendering in its naive form, by rendering the scene twice from two
    different perspectives, occurs at around twice the cost. Some effects do not need
    to be calculated twice, for example, those that are view point independent. Some
    of the shortcuts that are normally made in monoscopic rendering do not work in
    stereoscopic rendering. If these visual effects are not gameplay critical, like
    glows around objects, they can be turned off or replaced by similar object-based
    effects.


    The off-screen buffers only need to be duplicated if they have some view-dependent
    effect. This applies to shadow mapping and to those variants where the shadow
    map is based on the setup of the view frustum. Many of the often used screen-space
    post processing effects do not look good in stereo. One thing to be careful with
    is high dynamic range (HDR) rendering. The contrast between left and right view
    is very important, and if we apply tone mapping separately to left and right eye,
    we can introduce a shift in contrast that induces strain to the player.


    Billboarding is another commonly used effect that does not port'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'well to stereoscopic displays. Billboards, which are 2D objects that always
    face the viewer, look under certain conditions like two planar objects and not
    like a volumetric object as they were intended. The same applies to impostors—they
    must be made eye-dependent to not look completely flat on a stereoscopic display.
    This also incurs a performance penalty since twice as many impostors must be rendered.


    Backgrounds must, on a stereoscopic display, be placed at the proper depth so
    that they appear to be as far away as backgrounds usually are. This is especially
    important with skyboxes and skydomes, as they otherwise appear to be placed too
    close to the player as if the sky is part of the ceiling. This also relates to
    the depth range in your scene. If techniques are used that require different depth
    ranges, these also destroy the stereoscopic sensation. Different depth ranges
    imply different depth in stereo, and objects end up in unexpected places in the
    virtual room, causing them to look deformed.


    The same effect can be seen with overlays such as graphical user interfaces (GUIs),
    which are normally rendered in screen space without depth information. However,
    in stereo this gives contradicting depth cues because the menu can be drawn over
    an object that lies in view space, but the occluding cue implies that we should
    see the object. The GUI should lie behind the object, but as consequence of the
    screen-space rendering, lies at the wrong depth. One solution to this problem
    is to always put the GUI closest to the player. Depending on how the virtual room
    is set up, this solution might shove the GUI into the player''s face so it must
    be done with great caution.


    Other effects that traditionally take place in screen space, such as text labels,
    must also be placed in the game world at the proper depth. This now means that
    they can also be covered by objects in front of them, which might change how the
    actual game plays. In combination with GUI and text labels, we often also have
    some kind of representation of input devices. The standard mouse cursor'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'rendered by the operating system can often cause anomalies in different ways.
    If we are rendering the content to a side-by-side buffer, which is a common technique
    to render 3D content, we only see the cursor in one eye since both eyes share
    the same buffer. Seeing an object with only one eye that should be seen by both
    eyes is really annoying and should always be avoided!


    Thus, we have the same problems as with the GUI when the pointer is rendered in
    screen space. It is therefore advisable to create a software cursor that is placed
    as an object with depth in the world.


    It is really tiring for the eyes, and the viewer even loses the 3D effect for
    a short while, if the focus from one scene to another changes dramatically. If
    an object appears very close to the viewer in one scene, then it can be dragged
    back a bit before the scene changes, or rather, the focus needs to be pulled back
    to the place of focus for the next scene. This is something that traditional games
    usually never bother with, but will probably be a great challenge for stereo game
    developers. A similar problem occurs for stereo films with subtitles, as they
    will definitely make the viewer tired since the focus needs to be changed repeatedly.
    The viewer will probably end up concentrating on the film without even bothering
    to read the subtitles.


    Situations with contradicting depth cues in relation to occlusion can also arise
    when objects move off the screen in view space. Now, the depth cue tells the player
    that the object is in front of the screen, but when it comes close to the right
    or left edge of the screen it disappears behind it. To make this so-called edge
    conflict a bit less apparent, we can move the object slowly off screen or introduce
    virtual borders on the screen. These would be two guard bands lying in depth closest
    to the viewer to prevent the contradicting depth cues. This solution is known
    as floating windows and was used as early as the 1950s [15]. It has so far not
    been used for computer games, but was recently used for the Pixar film Up.'
  merge: -1
