- pgno: 39
  md: '# Highlights


    The Game Asset Pipeline (a.k.a. the Content Pipeline, and hereafter, simply the
    Asset Pipeline) is an intricate mechanism that interfaces the artists to the game
    engine. Game teams have seen their artist/programmer ratio skyrocketing in order
    to cope with the quantities of high-quality assets on tight schedules. Making
    sure the assets are delivered in the right form at the right place is an important
    part of managing the creation process so that artists and designers can create,
    preview, add, and tweak content as easily and swiftly as possible.


    This gem is composed of the following sections:


    +   - Asset pipeline overview: What is the role and composition of an asset pipeline?


    +   - Asset pipeline design: What are the main goals and hurdles involved in designing
    an asset pipeline?


    +   - Push or pull pipeline model: Approaching the problem from a different perspective
    to achieve a better design.


    +   - COLLADA, a standard intermediate language for digital assets: Taking advantage
    of a standard and its broad availability to build an asset pipeline.


    +   - OpenCOLLADA, a new open source framework based on SAX parsing and direct
    write technology.


    +   - User content: Retargeting the asset pipeline to foster user content creation.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.1 Asset Pipeline Overview


    The asset pipeline is the path that all the game assets follow from their creation
    tool to their final in-game version. There are a lot of asset types needed in
    a game: models, materials, textures, animations, audio, and video to name a few.
    The asset pipeline takes care of obtaining the data from the tools used for their
    creation, and then optimizes, splits or merges, converts, and outputs the final
    data that can used by the game engine. A typical asset pipeline is described in
    Figure 2.1 and explained in the following paragraphs.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_40_0.png)


    Figure 2.1: Asset Pipeline Components.


    # Source Assets


    Source assets are created by artists and designers. The tools used to create source
    assets are usually referenced as Digital Content Creation (DCC) tools. In general,
    source assets are created through a set of specialized tools: one for modeling,
    one for texture creation, one for gaming data, and one for level layout. Source
    assets should contain all the information necessary to build the game content.
    In other words, it should be possible to delete all the'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'assets except for the source assets and still be able to rebuild the game content.
    Source assets are often kept in the tool-specific format, and they should be stored
    using a version control system such as Subversion [1] or Perforce [2]. Since source
    assets are rather large and often in binary format, be sure to use a version control
    system that can handle large binary files.


    # Final Assets


    Final assets are optimized and packaged for each target platform. Often enough,
    the developer has no choice in what the final format has to be since the target
    platform, third party engine, or the publisher may impose a given format. There
    is no need for superfluous information in the final assets, so all the data is
    pruned to its required minimum. Just like source code, assets have to be compiled
    and optimized for each target. For instance, textures should to be stored in the
    format and size that the hardware can use immediately, as texture compression
    algorithms and parameters need to be optimized for the target texture hardware
    and display capabilities. Geometry data is also compiled for each target. Most
    platforms will only accept triangles, but the number of triangles per batch, the
    sorting order of the vertices, the need for triangle strips, and the amount of
    data per vertex will have a big impact on the performance of the game engine.
    Limitations on the shader rendering capabilities of the hardware may also have
    an impact on the geometry since it may be necessary to create several geometries
    to enable the engine to use these in separate passes to create the desired effect.


    Final assets also have to be optimized for game loading speed. Conversion of the
    data into hardware binary representation is one of the possible optimizations
    since this will save CPU time while loading, but it is not necessarily the main
    bottleneck to optimize since I/O (bandwidth or seeking) may actually be more problematic
    than CPU performance (parsing, decoding) nowadays. For really simple games, it
    may be enough to compact the data as much as possible and load it once at launch
    or at each change of level. But'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'for more evolved games, the expectation is that the data will be continuously
    streamed while the player is progressing in the game to provide a better immersive
    experience. Having a good real-time data streaming capability built into the engine
    is one of the fundamental core technologies that will also help with providing
    a similar experience for the player on various platforms, as limitations in device
    memory size can be hidden by a local cache mechanism. Also, if the content is
    to be stored on a hardware format that has specific limitations (for example,
    a CD or DVD may have long seek times), it may be important to sort the data in
    the order in which it will be encountered in the game.


    # Build Process


    The build process is the process that transforms all the source data and creates
    the optimized packaged data for each target platform. The build process should
    be automatic, as done with the game source code. The build should be optimized
    to only process the data that has changed from the previous build. Building the
    optimized data for an entire game can take hours, if not the entire day. It is
    especially painful at the end of a project when there is a lot of tweaking that
    needs to occur in a short amount of time and the build time is the longest as
    the data repository is fully populated. Early in the process, little attention
    may be given to the optimization of the build process and the organization of
    the data, but the overall quality and success of the game will depend on the final
    editing that occurs when most of the assets have been created. In other words,
    a poorly designed build process is likely to directly impact the quality of the
    end product.


    One of the major issues with optimizing the asset build process is the lack of
    information about dependencies. Since source assets are often stored in a tool-specific
    opaque format, it is not often possible to easily parse the data and recursively
    collect the dependency information. The need for dependency information and the
    direct extraction from the source has been in place for many years in source code
    development, but unfortunately, such a'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'process has not yet matured for assets and will require the game engine developers
    to actively develop their own.


    There are a few good sources of information about asset build systems, such as
    the book The Game Asset Pipeline [3] and the Microsoft XNA content pipeline [4].
    We mention the latter in spite of the fact that XNA is designed to only target
    Microsoft platforms (PC and Xbox 360) and has several design limitations, such
    as relying on file extensions to separate the data types and imposing the build
    information to be embedded in the source code rather than as descriptive data
    [5].


    # Manifest


    One very common issue with game development is that it quickly becomes impossible
    to know what assets are needed, what assets depend on others, and what assets
    are no longer necessary. Often data is piled up into a shared directory during
    development, and the game works fine since all the data referenced by the scripts
    or other assets are available. The problem is that there is no easy way to know
    which assets are really necessary, so packaging a demo in the middle of a project
    often results in several gigabytes of compressed data, making it hard to distribute.
    Manually maintaining a manifest is easier said than done, as it requires imposing
    a strong policy on artists and designers to make sure they add all the assets
    referenced into the manifest and remove the ones not in use. In practice, there
    is no hope for maintaining a manifest manually, so it is very necessary to create
    an automatic system that extracts the manifest from the game''s top-level description
    (i.e., level design files). Having access to external references stored inside
    the assets, such as scripts, textures, models, animation, or other references
    becomes an obvious need in order to be able to automatically create the manifest,
    so one must be wary of using opaque formats in the asset pipeline. The good news
    is that this information can be used to create a dependency graph enabling the
    build process to work only on the files that are necessary for a given level.
    The dependency graph'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'also provides an understanding of what assets need to be rebuilt when they
    depend on assets that have been changed.


    # Fast Path


    The fast path is the ability for assets to be loaded into the game engine without
    going through the full build process. This shortcut is very important to provide
    for better artist efficiency. When using the fast path, the artist invokes a minimal
    export mechanism that enables a faster iteration. Note that an artist is often
    working on a particular subset of the assets, and only the data for those assets
    will follow the fast path; the other elements of the scene can still be loaded
    from the final build path. This means the engine needs to allow for both full
    build and fast path assets to be active simultaneously during production. The
    fast path loader can later be pruned from the engine unless the developer wants
    to keep this capability as a feature to modders (see Section 2.6). The fast path
    is an optimization of the overall production process, which may be very important
    to the success of delivering the game within time and budget constraints.


    # Intermediate Assets


    Intermediate assets represent the data in between the source and the final form.
    Intermediate assets are created using an exporter from the DCC tool and also represent
    the data that has been processed along the build process just before final transformation
    into the final asset packaging. The intermediate asset format should be very easy
    to read, parse, and extend. Intermediate assets should contain all the information
    that may be necessary down the pipeline, and be lossless wherever possible [1].
    There is no need to prune and over-optimize early; it is much more efficient and
    automatic to discard data further down in the pipeline rather than having to re-export
    all the source assets each time additional information is required. Plain text,
    or structured XML files [6] are recommended formats for most intermediate assets;
    this provides'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'for human readability and occasional hand editing in addition to taking advantage
    of numerous libraries capable of handling standard XML format. Especially useful
    is the built-in capability from languages such as C#, Python, Java, and others
    to be able to directly load an XML document and provide easy programmatic access
    and search functions to the embedded document object model (DOM).


    Ideally, one single flexible intermediate format should be used to store the data
    during the entire transformation process so that the same format and I/O code
    can be used throughout the content pipeline and provide the flexibility to change
    the build process steps and their execution order. This means the format needs
    to store the data in a representation as close as possible to the representation
    in the DCC tool—in order to simplify the export process and ensure the least data
    loss as possible—as well as convert the data to a format as close as possible
    to the final encoding required by the target platforms. This involves a bit of
    additional complexity when designing the intermediate format, but ultimately,
    it is a big win to avoid overloading the export process with early transformations
    at the cost of export time and data loss. As shown in Figure 2.2, asset processing
    modules can apply transformations directly to intermediate assets, such as triangulation,
    texture processing, and level-of-detail calculation.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_46_0.png)


    Figure 2.2: Intermediate assets along the build process.


    # The Pipeline


    A combination of processing modules compose the build pipeline. Intermediate assets
    can be probed at any point in the pipeline since they are available in the same
    format throughout. Although not fundamentally necessary, it is possible to create
    a specific tool with a user interface that enables the creation of a build process
    by simply connecting asset processing modules to each other [7]. This design also
    enables the build process to be more generic in order to handle data from a variety
    of sources and tools, as well as being configurable to support existing and future
    target platforms, by combining or configuring a set of asset processing modules
    differently.


    There would be no need to use different formatting for source and intermediate
    assets if one single format could serve both purposes and is recognized by the
    DCC tools. This does not mean the data will stay untransformed through the build
    process; it means the same formatting can be used to store the data at all stages
    of the transformation. For instance, there exist hundreds of image file'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'types/formats [8], but unfortunately, none seems able to offer all the properties
    to be both source and intermediate format. Ideally, we would have a format that
    can store uncompressed and/or lossless compression pixels for the source format.
    Some images need to be stored in higher resolutions than the usual 8 bits per
    component, so the format should allow for 16 bits, or even 24 bits per component.
    More and more often, high dynamic range (HDR) storage is necessary, for which
    an open format has been made available: OpenEXR [9]. On the other end, the intermediate
    format should be able to represent the data as close as possible to the target
