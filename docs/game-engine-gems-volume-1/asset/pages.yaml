- pgno: 528
  md: 'result can be adjusted by doing a single accumulated multiplication instead
    (when necessary). This optimization step reduces each iteration to a few arithmetic
    and shift operations plus an indexed look-up into an array of angle values.


    $$C = C_0 C_1 \cdots C_{n-1} = \prod_{0}^{n-1} \frac{1}{\sqrt{1 + 2^{-2i}}}$$


    The value of C is approximately 0.60725 as the number of iterations approaches
    infinity, though the actual value is based on a finite number of iterations.


    In each iteration, the point is rotated by successively smaller amounts. A third
    iterated value \(a_i\) holds the difference between the accumulated rotation angle
    and the desired rotation angle, and is used to determine if the next iteration
    should rotate the point clockwise or counterclockwise. \(a_0\) is initialized
    to the input angle, and \(a_i\) approaches zero. The direction of rotation is
    determined by the sign of the difference and is represented here by the value
    \(d_i\):


    \(a_0 = \theta\)

    \(a_{i+1} = a_i - d_i \tan^{-1} 2^{-i}\)

    \(d_i = \begin{cases} -1, & \text{if } a_i < 0; \\ +1, & \text{if } a_i \ge 0.
    \end{cases}\)


    As mentioned earlier, the point is rotated by successively smaller amounts. The
    iteration continues until the amount of rotation is too small to be represented
    by the chosen fixed-point format. Using fewer iterations is possible, but produces
    less accurate results. The number of iterations is 25 when using an 8.24-bit fixed-point
    format and measuring angles in radians.


    This basic algorithm is called the "rotation" mode and can be used to rotate an
    arbitrary 2D vector. It can also compute the sine and'
