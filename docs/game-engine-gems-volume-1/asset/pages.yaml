- pgno: 301
  md: '# Blower Heuristic


    In the fluid simulation, any change in the blower velocity direction means all
    quantities (velocities and pressure) need to be recalculated in the fluid domain
    at each time step. We simplify the full solver to be able to simulate a dynamic
    blower.


    By observing fluid simulation and changes in velocity, we notice that the velocity
    is linear with the norm of the blower velocity. This means that if we double the
    velocity for the blower, the resultant velocities on the other voxels are also
    doubled. We also notice that when the blower changes direction, each velocity
    of a voxel changes direction. To be able to simulate the same effect, we use precomputed
    velocities by aiming the blower in the directions of the positive and negative
    coordinate axes. In this article, we use blower directions only in two dimensions
    along the x- and y-axes, but the method can be generalized to three dimensions.
    We have to precompute the velocity field for the blower in directions(1,0,0),
    (-1,0,0), (0,1,0), (0, -1,0). Let \(\theta\) be the angle between the new blower
    direction and the vector (1,0,0). For \(\theta\) between \(\theta_1\) and \(\theta_2\),
    we proceed as follows:


    +   We identify \(\theta_1\) and \(\theta_2\) according to \(\theta\). For example,
    \(\theta_1 = 0\) and \(\theta_2 = 90\) if \(\theta\) is between 0 and 90 degrees.


    +   We compute the interpolation weight \(f = (\theta - \theta_1)/(\theta_2 -
    \theta_1)\).


    +   \(\mathbf{V}_{p1}\) is the precomputed face velocities for \(\theta_1\).


    +   \(\mathbf{V}_{p2}\) is the precomputed face velocities for \(\theta_2\).


    +   Each face velocity \(\mathbf{V}\) is computed by \(\mathbf{V} = (1 - f)\mathbf{V}_{p1}
    + f\mathbf{V}_{p2}\).


    This heuristic is an approximation of the velocities yielded by the full solver
    version. Figure 12.3 shows a comparison of velocities'
  merge: -1
