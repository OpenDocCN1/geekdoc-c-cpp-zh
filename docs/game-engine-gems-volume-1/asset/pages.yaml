  md: '# 18.4 Volumetric Ambient Occlusion


    In order to find an efficient method for the evaluation of the ambient occlusion
    integral, we express it as a three-dimensional (i.e., volumetric) integral. First,
    the fuzzy measure is written as the integral of its derivative:


    \(\mu(D) = \int_0^D \frac{d\mu(r)}{dr} dr .\)


    Substituting this integral into the ambient occlusion formula, we get


    \(O(\mathbf{s}) = \frac{1}{\pi} \int_{\Omega} \int_0^D \frac{d\mu(r)}{dr} (\mathbf{N}_s
    \cdot \boldsymbol{\omega}) dr d\boldsymbol{\omega} .\)


    Realizing that \(r^2 dr d\omega = dV\) is a differential volume, the ambient occlusion
    can also be expressed as a volumetric integral


    \(O(\mathbf{s}) = \frac{1}{\pi} \int_S \frac{d\mu(r)}{dr} \frac{1}{r^2} (\mathbf{N}_s
    \cdot \boldsymbol{\omega}) dV ,\)


    where S contains those points of the solid hemisphere that are visible from the
    shaded point, and therefore also visible from the camera.


    In our case, the occluder surface is a height field defined by the content of
    the depth buffer. Thus a point (x,y,z) belongs to the visible region if its z-coordinate
    is less than the value z* stored in the depth buffer for the same (x,y) coordinates.


    We compute the volumetric integral with differential elements having dz height
    and dA = dxdy base area at the point (x,y) of the disk C of radius R and perpendicular
    to z-axis (see Figure 18.2) as'
