    With these values and the position of each vertex in your skybox, you have everything
    you need for your physically-based skybox vertex program to compute xyY values
    for each sky vertex. The last step is to map this result to RGB values. To do
    this, first convert the xyY value to XYZ:


    ```

    X = x \frac{Y}{y}

    Z = (1 - x - y) \frac{Y}{y}.

    ```


    If the zenith color you''re using is already tone mapped, then further tone mapping
    is optional. The same tone mapping technique described in "Physically-Based Outdoor
    Scene Lighting" may be applied at this point, however, and will result in effects
    such as a'
