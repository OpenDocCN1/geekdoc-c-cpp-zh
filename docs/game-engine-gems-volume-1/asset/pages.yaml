    (14.5) \( m = \rho \int_V dv \).


    The center of mass C for an object is found by integrating the product of the
    differential mass and its position and dividing the result by the total mass as
    follows:


    (14.6) \( \mathbf{C} = \frac{\rho \int_V \mathbf{r} \, dv}{\rho \int_V dv} \).'
