    当本书编写时，Digi-Key 列出了 I/O 引脚数少至 `ATTINY11`（$0.54）和多达 54 个引脚的 `ATMEGA169`（$8.60），后者是
    Butterfly 开发板上使用的微控制器。这些引脚大部分被组织成端口，即一组可通过特定端口的访问和控制寄存器进行配置和使用的引脚集合。许多引脚具有不止一种功能：它们可用于输入或输出数字逻辑数据、检测外部中断、作为时钟输入或用于模数转换等。本节我们将重点讨论数字
    I/O。


    Butterfly 上的 `ATMEGA169`拥有六个 8 位和一个 4 位的通用 I/O 端口,如图 13 [ATmega169 框图](http://example.com/datasheet.pdf)所示(摘自《ATmega169
    数据手册》第 3 页图 2)。看起来相当复杂吧？但这只是一个高度简化后的电路框图,而实际芯片要复杂得多。当你看到这些芯片的光学显微照片时，它们就像一座古老城市的航拍图——街道呈网格状排列并被城墙环绕着。"如果把电子比作骑着微小驴子的古代居民进出城市"城门"(也就是我们所说的
    I / O 接口)的比喻可能不太恰当 ,但我还是要接着说……每个与这三个相关的存储位置就像是把关不严让什么人过去 (看来我真是停不下来)。


    对于每一个或者几个相关联的在内存里的地址空间里存放的这些控制信息其实都是起到同样的作用；它们是三个可以作为界面操作或者说管理入口的东西:

    1. **Data Direction Register** - *DDRx*:读写属性；

    2. **Data register – port x** `<span class="math-inline">\*\*/code>是可读可写类型的变量名称</s>`PORTA`,DDRA,PINA
    这四个不同的例子只是为了表达清楚而已并不是真的要完全一一对应关系如此繁琐过程当中也会有很多变化因素干扰最终结果所以我们先简单理解一下就好不要钻牛角尖后面会有更多实例帮助大家消化吸收知识点现在回到正题继续往下学习如何使用这块强大的单片机实现我们的项目需求目标如下所述…“(待续)


