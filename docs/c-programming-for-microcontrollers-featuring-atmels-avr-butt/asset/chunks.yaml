    \          \n热敏测温单元    \nADC 精确到程控采样范围贯通 0~5V     \n压电蜂鸣音频输出           \n扩展排针引脚便于对接外围\
    \        \n片上 RS -232 电平转换专用于电脑互动通信     \n无需特殊硬件的 BootLoader 以支持 PC 直写固库存放！ \n\
    出厂自带演示程序带源码且附带安全别扣你可以骄傲的把这款 Geek 神器固定衬衫上去炫耀一番……\n厨房洗菜盆也都全了简直是逆天大礼包！！！←此处为吐槽比喻彩蛋\
    \ 。\n``` \n\n除此之外盒子正面的说明书步骤足以帮助你立即享受所有预制实例的功能 ;在这之前高效把玩她件事儿---然后轻轻松松过渡至高级环节不易惨遭意外喔.'否则哭天喊娘只能滚回\
    \ DialogKey 下单重购','一想到每天有多少小白不忍之心弄得又是融化又被水淹还要咖啡淋洒还是非常触目惊心的【没错今早我也是这么过来的 T_T’】.\n\
    \n\n\n最后省钱提示代替零售整机搭售的现象----根据第一份零部件清单自己在各大元器件网站自行采购相应的配件可以减轻经济压力的同时又锻炼手工能力随时逛逛我的个人网址(smileymicros.com)说不定会有大乐子哦莫过于倒闭打折清仓什么的哈哈)。\n\
    \n若出门买了 E-book 版的话可以直接去下列位置抓取这两款 IDE 构建自身研发基石 :\n\n· Winavr 诊断版本采用 20040404.md\
    \ 仍以此为准(\nhttp://sourceforge.net/projects/winavr\n)。\n· Atmel 官网上找到 Avrstuido\
