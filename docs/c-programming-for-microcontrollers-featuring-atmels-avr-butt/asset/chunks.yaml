    fires, and char skin. If you burn yourself more than once, join the club. Some
    of us are just harder to train. Saying don’t set up your soldering station near
    anything flammable, seems silly, but remember, my nickname is Smokey Joe and there
    are reasons for that.Second warning: the solder has a rosin core and produces
    a nice trail of smoke that contains God-knows-what kind of chemicals and heavy
