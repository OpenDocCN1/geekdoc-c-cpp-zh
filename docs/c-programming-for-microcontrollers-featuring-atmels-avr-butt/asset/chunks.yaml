    |---|---|\n听说有人抱怨无法直接阅读这种格式别担心马上输入真实例子体验连贯脉络延续以往惯例逐个记录八大状况演变经过成功诱导视角错乱生成滑动假象完美的成果源于严谨构思只需将源端口值求反驱动外接负载瞬间呈现出酷炫动效虽略显简陋却是入门必备良药希望大家满意这次旅程祝你好运早日毕业!!!"
  raw: '// Do something }On the first pass, the compile r evaluates the ‘for’ statement,
    notes that ‘i’ is equal to 1 which is less than 128, so it runs the block of ‘Do
    something’ code. After running the block the ‘for’ expression is reevaluated with
    ‘i’ now equal to the previous ‘i’ multiplied by 2 ‘i = i*2’ which is 2 and 2 <=
    128 is true, so the block is run again. Next loop, i = 4, and so on till i = 256,
    and ‘256 <=128’ is no longer true, so the program stops running the loop and goes
    to the next statement following the closing bracket.Quick now, how ma ny times
    does this loop run? The series of ‘i’ values evaluated against the ‘<= 128’ is
    ‘1,2,4,8,16,32,64,128,256’ and since it takes the 256 as the cue to quit, the
    loop runs 8 times.The while(‘expression’) statement tests the ‘expression’ to
    see if it is true and allows the block to run if it is, then it retests the expression,
    looping thru the block each time it finds the expression true. The program skips
    the block and proceeds to the next statement when the expression is false. The
    while(1) will run the loop forever because ‘1’ is the definition of true (false
    is defined as 0).FunctionsA function encapsulates a computation. Think of them
    as building material for C programming. A house might be built of studs, nails,
    and panels. The architect is assured that all 2x4 studs are the same, as are each
    of the nails and each of the panels, so there is no need to worry about how to
    make a 2x4 or a nail or a panel, you just stick them where needed and don’t worry
    how they were made. In the Blinky program, the main() function twice uses the
    _delay_loop_2() function. The writer of the main() function doesn’t need to know
    how the


    _delay_loop_2(30000) function does its job, he only needs knows what it does and
    what parameters to use, in this case 30000, will cause a delay of about 1/8 second.The
    _delay_loop_2() function is declared in the header delay.h and the makefile is
    set up so that the compiler knows were to look for it.Encapsulation of code in
    functions is a key idea in C programming and helps make chunks of code more convenient
    to use. And just as important, it provides a way to make tested code reusable
    without having to rewrite it. The idea of function encapsulation is so important
    in software engineering that the C++ Chapter 3: A Brief Introduction to C– What
    Makes Blinky Blink?


    language was developed primarily to formalize these and related concepts and force
    their use.The Main() Thing


    All C programs must have a ‘main’ function that contains the code that is first
    run when the program begins.


    int main (void) {


    // Do something }


    Blinky has:


    int main (void) {


    // set PORTD for output DDRD= 0xFF;


    while(1)


    { for(int i = 1; i <= 128; i = i*2) {


    PORTD = ~i;


    _delay_loop_2(30000); }


    for(int i = 128; i > 1; i -= i/2) {


    PORTD = ~i;


    _delay_loop_2(30000); }


    }


    }


    In this function we leave C for a moment and look at things that are specific
    to the AVR microcontroller. The line:


    DDRD = 0xFF;Sets the microcontroller Data Direction Register D to equal 255\.
    This tells the microcontroller that Port D pins, which are hooked up to our LEDs,
    are to be used to output voltage states (which we use to turn the LEDs on and
    off). We use the hexadecimal version, 0xFF, of 255 here because it is easier to
    understand what’s happening. You disagree? Well, by the time you finish this text,
    you’ll be using hexadecimal numbers like a pro and understand they do make working
    with microcontrollers easier, but for now, just humor me.The program tests the
    while(1) and finding it true, proceeds to the ‘for’ statement, which is also true
    and passes to the line:


    PORTD = ~i;


    Which causes the microcontroller to set the Port D pins to light up the LEDs with
    the value of ~i. The ‘~’ inverts the value of i , we’ll learn more about this
    later.Say what? Okay, ‘i’ starts off equal to 1, which in binary is 00000001 (like
    hexadecimal, you’ll grow to love binary). This provides +3v on the rightmost LED,
    lighting it up and leaves the other LEDs unlit at 0v.The first ‘for’ loop runs
    eight times, each time moving the lit LED to the left, then it exits. In the next
    ‘for’ loop the -= operator subtracts i/2 from i and sets i equal to the results
    causing the LED to move to the right. When it is finished the loop runs again…
    for how long? Right… forever. Or at least until either the universe ends or you
    unplug the Butterfly.NOTE: the Butterfly LCD dances like crazy with each LED pass,
    because some of the Port D pins are also tied to the LCD. It’s a bug in our design,
    but in the world of marketing it would be called a free bonus feature available
    exclusively to you for an unheard of low price if you act immediately. Will it
    harm the LCD? Probably not, but I don’t know for sure, so don’t leave Blinky running
    overnight.


    That’s enough for a quickie introduction. We skimmed over a lot that you’ll see
    in detail later. You now know just enough to be dangerous and I hope the learning
    process hasn’t caused your forehead to do too much damage too your keyboard.Chapter
    4: C Types, Operators, and ExpressionsData Types and Sizes


    Seen on a shirt at a Robothon event:


    There are exactly 10 types of people in the world.


    Those who understand binary numbers and those who don’t.


    If this doesn’t make sense to you now, it will in a minute.Bits


    The first computers were people with quill pens who spent their lives calculating
    tables of things like cannonball trajectories to help soldiers more accurately
    slaughter their enemies. Later mechanical computers, with brass gears and cams,
    were developed to make the slaughter cheaper, quicker, and easier. Then one day
    a genius figured that you could do all this computing even easier if you used
    switches. Switches can be off or on, and the fundamental datum is the ‘bit’ with
    exactly two ‘binary’, states. We variously refer to these states as ‘0 and 1’
    or ‘on and off’ or ‘true and false’. It’s the latter that allows us to use bits
    to automate Boolean logic and thus the modern binary logic computer entered the
    world and now slaughter is so cheap, quick and easy to compute that anybody can
    do it. Maybe this is skimming the topic a bit (har!) but a full explanation would
    begin with the first sentence of Genesis and only hit its stride about the time
    Albert Turing offed himself as his unjust reward for saving the free world, and
    while fascinating, it won’t get us blinking LEDs any quicker, soLet’s move on.Each
    of our LEDs is connected to a microcontroller pin that can have two voltage states:
    ground or +3v, which can be manipulated as a data bit.Bytes


    The AVR and many other microcontrollers physically handle data in 8-bit units
    called bytes, a data type that can have 256 states, 0 thru 255. This is shown
    in the following sequence of states, (leaving out 9 thru 247, see Appendix 5 to
    see them all, and be sure to take a magnifying glass):


    00000000 = 0 1111000 = 248 00000001 = 1 1111001 = 249 00000010 = 2 1111010 = 250
    00000011 = 3 (9 thru 247) 1111011 = 251 00000100 = 4 1111100 = 252 00000101 =
    5 1111101 = 253 00000110 = 6 1111110 = 254 00000111 = 7 1111111 = 255 00001000
    = 8Look at our Cylon eye and notice that we have 8 LEDs with one lit at a time
    scrolling back and forth. What you are seeing is 8 of the 256 possible states
    being presented in a sequence that fools us into thinking we are seeing a back
    and forth scrolling motion. If the presentation sequence were random, we’d just
    see the light blinking on and off chaotically. Using binary numbers where the
    lit LED is represented by 1 shown next to the hexadecimal and decimal equivalent,
    what we are seeing is:00000001 = 0x01 = 1


    00000010 = 0x02 = 2


    00000100 = 0x04 = 4


    00001000 = 0x08 = 8


    00010000 = 0x10 = 16


    00100000 = 0x20 = 32


    01000000 = 0x40 = 64


    10000000 = 0x80 = 128


    01000000 = 0x40 = 64


    00100000 = 0x20 = 32


    00010000 = 0x10 = 16


    00001000 = 0x08 = 8


    00000100 = 0x04 = 4


    00000010 = 0x02 = 2


    00000001 = 0x01 = 1'
