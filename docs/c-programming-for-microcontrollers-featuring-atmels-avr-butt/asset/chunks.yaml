  raw: 'statement2If the expression has a non-zero result (it is true), then we do
    statement 1, if the expression has a 0 result (it is false) we do statement 2\.
    We can make a list of related decisions using else if:if ( expression1 ) statement1
    else if ( expression2 ) statement2 else if ( expression3 ) statement3 else statement4In
    this case each expression will be evaluated sequentially looking for the first
    nonzero (true) expression and if they all equal 0 (false) we do statement 4\.
    You can omit the final else statement if you want to do nothing if all the expressions
    are 0 (false). We will use an example of this construction later when we write
    an example program for using the joystick interrupts:if(input == KEY_PLUS)PORTD=
    ~0x01;


    else if(input == KEY_NEXT)PORTD = ~0x02; else if(input == KEY_PREV)PORTD = ~0x04;
    else if(input == KEY_MINUS)PORTD = ~0x08;


    else if(input == KEY_ENTER)PORTD = ~0x10;Which may be read as: if the input is
    equal to KEY_PLUS then set port D equal to the inverse of a byte equal to 1 (a
    byte of 1 is binary 00000001, the inverse is 11111110 and since we output a 0
    to a pin to light and LED, this statement lights the LED). If the first line is
    true then the rest of the statements are skipped. If the first line isn’t true,
    then each line is evaluated sequentially until a true expression is found or it
    drops out the bottom and does nothing.SwitchThe ‘if else’ construction limits
    us to expressions that are either true or false. If we want to make decisions
    using expressions that can have any numeric result we use the switch statement
    that selects an expression with results equal to a specified constant.switch (
    expression ) {


    case constant expression1 : statements case constant expression2 : statements
    case constant expression31 : statements default: statements }We can redo the if
    else if block used in the joystick interrupt example using a switch statement
    as follows: switch(input){ case KEY_PLUS :PORTD = ~0x01;


    break:


    case KEY_NEXT :


    PORTD = ~0x02;


    break;


    case KEY_PREV :


    PORTD = ~0x04;


    break;


    case KEY_MINUS :


    PORTD = ~0x08;


    break;


    case KEY_ENTER :


    PORTD = ~0x10;


    break;


    default:


    }So if the ‘input’ == KEY_NEXT, then PORTD = ~0x01\. The ‘break’ statement causes
    an immediate exit from the switch block. If you want to continue evaluating cases
    against the input, leave out the break and the subsequent statements will be looked
    at.You can let cases fall through, which can be handy in circumstances such as
    evaluating character input where you don’t care if the character is a capital
    or lower case letter, or perhaps you want the same response for a range of integers:switch(
    input){ case ‘a’ :


    case ‘A’ :DoaA(); break;


    case ‘b’ : case ‘B’ :DobB(); break; case‘0’ : case ‘1’ : case ‘2’ :


    case ‘3’ :


    Gofer0123();


    break; case ‘4’ :case ‘5’ :


    case ‘6’ : case ‘7’ :


    Gofer4567();


    break; default:DoDefault(); break;


    }This can be compacted as:


    switch( input){ case ‘a’ : case ‘A’ :


    DoaA();


    break;


    case ‘b’ : case ‘B’ :


    DobB();


    break; case ‘0’ : case ‘1’ : case ‘2’ : case ‘3’ :Gofer0123(); break; case ‘4’
    : case ‘5’ : case ‘6’ : case ‘7’ :


    Gofer4567();


    break;


    default:


    DoDefault();


    break;


    }Switch statements are error prone and a frequent source of head boinking bugs
    (one where you boink your head for being dumb enough to leave out a break statement).
    The break after default: isn’t even necessary, but is recommended (by K&R) as
    a good practice to help you remember to use it when you add a statement to the
    end of the list.Loops – While, For and Do-while


    We’ve been using while for a while (har!).


    while( expression ) { // Do stuff while expression is true }


    While will repeat the associated statement or block as long as the expression
    is true.


    The code fragment:xint i;


    while( i <= 128) {PORTD = i;


    _delay_loop_2(30000); i = i*2;}


    This does exactly the same thing as the for loop in our first example program:


    for(int i = 1; i <= 128; i = i*2){


    PORTD = i;


    _delay_loop_2(30000);}


    The for loop is constructed as follows:


    for( expresson1 ; expression2 ; expresson3 ){


    // Do stuff


    }Usually expression1 and expression3 are assignments or function calls and expression2
    is a test of some sort. The expressions can be any expression including the empty
    expression which is nothing followed by a semicolon:


    You can usually accomplish the same goal using either while or for statements.
    Generally it is clearer to use for loops with a simple initialization and incrementing
    such as:for( ;; ){


    // Do stuff forever


    }This is an alternative way to do the while(1) eternal loop.


    for(int i = 1; i <= 128; i = i*2) {


    // Do stuff while I less than or equal 128 }


    But its really a matter of personal preference though most C dudes will want to
    smack you around a little if you don’t do it their way.


    While and for loops test for the termination condition before running the block,
    ‘do while’ runs the block first insuring that the block will be run at least once:


    do {// Do stuff at least once }


    while(expression );Break and ContinueA break statement throws you out of the loop
    immediately and without regard for the terminating expression . It only throws
    you out of the innermost loop in nested loops.A continue statement causes the
    loop to skip the following statements in the block and start the loop over again.
    You won’t see this often, but it can come in handy for amazingly complex decision
    loops. Gurus use it a lot for job security.Goto and LabelsThere are those who
    would burn you at the stake for using ‘goto’. I’m not one of those, but I won’t
    throw water on you when some other C dude sets you on fire for this heresy. The
    goto statement is probably the laziest, most unnecessary, confusing, and potentially
    harmful thing you can stick in your code. It allows you to jump all over the place
    without regard to logic or common sense, creating the infamous ‘spaghetti code’.
    But I have used it on occasion to escape a deeply nested loop as a quick fix for
    a bug when I didn’t have time to rewrite the code like it should have been written
    in the first place. But I have never shown anyone such code; I have my pride you
    know. Anyway, the goto statement causes a jump to a label as follows:while(expression){


    for(expression;expression;expression){ do{


