    in the room.I’ve also included solder wic k on the JAMECO list. This is braided
    copper wire and does what its name implies, it wicks solder. Just stick it to
    the bad glob you want to remove, heat it up and watch the power of capillary action
    and note that your are holding the copper between your thumb and forefinger about
    one inch from the tip of the soldering iron which quickly teaches you that copper
    is a poor insulator. Yeouch… is a common soldering term.![](image_rsrc3NS.jpg)
