    ASSR = (1<<AS2);


    Clear the Timer/Counter 2, TCNT2, count register.


    TCNT2 = 0;Select the divide by 128 prescale factor in the Timer Counter Control
    Register, TCCR2A. The watch crystal pulses 32768 times in one second and 128*256
    = 32768, so with a 128 prescaler, the timer counts to 256 and overflows once per
    second.TCCR2A |= (1<<CS22) | (1<<CS20);


