    \ while fixing obvious table alignment issues.\n\n---\n\n## Appendix 2：焊接教程（Soldering\
    \ Tutorial）\n\n我有一台相当不错的焊台，是从一家破产的公司继承来的。他们最后一个月没付工资，于是让我搬了很多设备——这是他们的慷慨之举，或许也省了清理费用。但为了让本文在最低成本下传递最多的教学价值,我去找了一把最便宜的烙铁试其是否可用于学生学习。\n\
    \n图40中的这把烙铁来自JAMECO官网售价不到三美分功能完全正常。\n\n*第一项警告*这类工具会发热易燃伤皮肤如果你烧伤不止一次那你也算俱乐部一员有些学员就是难训练别把焊站放在可燃物旁边看似多余但我外号“烟熏乔伊”——全靠不良习惯混出来的名声不虚构\
