  raw: 'We will use three FREE software packages, the WinAVR compiler from sourceforge.net,
    the AVRStudio 4 from ATMEL, and Br@y++’s Terminal. WinAVR – Oh, Whenever…WinAVR
    is a set of tools for C programming the AVR microcontroller family. A bunch of
    folks have volunteered their time to write this software and give it away as part
    of the free software movement (www.sourceforge.net ). These folks generously giving
    there time to help others is almost enough to change my cynical opinion of humanity.
    You can spend thousands on C compilers for microcontrollers and before WinAVR
    you had to spend several hundred even for a crappy compiler. This software is
    FREE, but SourceForge has expenses so send them some money at www.sourceforge.net/donate
    .At http://sourceforge.net/projects/winavr/ you see the summary:“WinAVR (pronounced
    "whenever") is a suite of executable, open source software development tools for
    the ATMEL AVR series of RISC microprocessors hosted on the Windows platform. Includes
    the GNU GCC compiler for C and C++.”Go to: http://winavr.sourceforge.net/index.html
    and check out their homepage.But don’t get too distracted with all that yet, just
    use the tools as shown here, and once you reach the end of this book, then you’ll
    have the skills to fully exploit those web sites.Programmers NotepadWe’ll be writing
    our software using the most excellent Programmers Notepad, another FREE program
    available at sourceforge.net and included in the WinAVR distribution package.
    Imagine what Microsoft would charge for this FREE software. Be a good guy or gal
    and send them some money at http://www.pnotepad.org .Chapter 2: Quick Start Guide


    AVRStudio – FREE and darn well worth it.AVR Studio is provided free by the good
    folks at ATMEL Corporation, who seem to understand that the more help they give
    developers, the more they will sell their microcontrollers. Actually, this too
    could cost hundreds and still be darn well worth it, but unless you just really
    like Norway, don’t send them any money, they’ll get theirs on the backend when
    you start buying thousands of AVRs for your next great invention.The AVR Studio
    will be used for two things: first, to download your software to the AVR Butterfly,
    and second, to simulate the ATMEGA169 running your software.


    Br@y++ Terminal:The original Quick Start Guide chapter used HyperTerminal, which
    is hard to setup, clunky, and hated by so many folks on the AVRFreaks.net forum
    that I contacted Br@y++ and he gave me permission to use and distribute his highly
    recommended and easy to use and understand terminal package. You can get it at


    http://bray.velenje.cx/avr/terminal or http://www.smileymicros.com . It is shown
    in Figure 7: Bray''s Terminal. The examples in the text still show the HyperTerminal,
    but it shouldn’t be a problem substituting Bray’s. If you want to use HyperTerminal,
    the introduction to it is in Appendix 1.Hardware Constructing Your Development
    Platform


    ![](image_rsrc37N.jpg)Solder the female headers to the ADC, PORTB, and PORTD lands.
    Note that the square pads are pin1 and that PORTB and PORTD seem to have 10 pins,
    but they don’t, pins 9 and 10 are ground and power respectively (see Figure 2).The
    RS-232 Connection:


    Communication with the PC requires three lines: TXD, RXD, and GND. The TXD is
    the transmit line (data from the PC to the Butterfly), RXD is the receive line
    (data from the microcontroller to the PC) and GND is the common ground. Notice
    that there is a bit of relativity in this equation, the microcontroller’s RXD
    wire is the PC’s TXD wire and vice versa. I can’t count the number of times I’ve
    done stupid things like connecting the microcontroller’s RXD pin to the DB-9 RXD
    pin, because I didn’t think ‘RXD – receive relative to what?’illustrations in
    Figure 3.


