  raw: 'Communications and click on HyperTerminal, then take a deep breath, because
    HyperTerminal was not really designed with your use in mind, so it can be confusing
    (but it IS free).


    • Where it asks for a new connection name, call it Thunderfly or something equally
    memorable, and select the least dorky icon you can find in the list. I favor the
    atom next to the phone, because it makes no sense whatever.![](image_rsrc3NV.jpg)
    Appendix 7: HyperTerminal


    • The ‘New Connections Properties’ window opens and select the COM Port you are
    connected to:


    ![](image_rsrc3NW.jpg)• If you don’t know what Com Port you are connected to:


    • Your computer’s manual will tell which COM Port you are using. But since you’ve
    lost your manual…


    • Click the start button


    • Click the settings button


    • Click the control panel button


    • (If you are using XP, hunt around, it’s all there somewhere)


    • In the control panel, click the System button


    • Depending on your OS, hunt for the Hardware panel, and then click the Device
    Manager button (Why does Microsoft have to do this differently on every OS?)


    • In the Device Manager, expand the Ports(COM & LPT)


    • If fortune smiles, you’ll only have one COM Port and it will be COM1.


    • If you have multiple COM Ports that aren’t being used, then go find that darn
    manual! Or look at you connections on the back of your PC and hope one of them
    is labeled, or just plug it in an guess which COM Port it is connected to. If
    you guess wrong, just try the next one COM1, COM2, COM3… until it works, and next
    time you buy a PC, put the manual somewhere that you can find it.•


    • Set the COM Port communications parameters:


    • Bits per second to 19200, data bits to 8, parity to None, stop bits to 1, and
    flow control to None![](image_rsrc3NX.jpg)• Click OK and the Properties Window
    appears, click the Settings tab.![](image_rsrc3NY.jpg) Appendix 7: HyperTerminal


    • And the ASCII Setup button, and fill out that Window as below: ![](image_rsrc3NZ.jpg)•
    By now you are almost surely as sick of HyperTerminal as I am, but if you’ve done
    everything right (and if you are like me, you haven’t) you’re ready to program
    “Your Name” in the Butterfly.


    • On the Butterfly click the joystick down until you see NAME.


    • Click the joystick right to “ENTER NAME”


    • Click the joystickdown to “DOWNLOAD NAME”


    • Center the joystick and press it. (By the way, do you know where the term ‘joystick’
    comes from?) The message “WAITNG FOR INPUT ON RS232” appears on the LCD.


    • Return to the PC and HyperTerminal. Type ‘Hello world’ and hit enter.292


    ![](image_rsrc3P0.jpg)• You’ll now see your message scrolling across the Butterfly
    LCD. If not, notice that you have three areas that you can mess up:


    • Soldering and connecting the RS232• Selecting the correct COM Port


    • Setting up HyperTerminal properly


    So if its not working by this point go back and meticulously retry everything
    you can think of, including passing a dead chicken over the setup while chanting
    voodoo hymns. It took me a while to get all this running and I supposedly know
    what I’m doing, so don’t feel bad if this is a little harder than you might hope.
    (You get what you pay for)'
