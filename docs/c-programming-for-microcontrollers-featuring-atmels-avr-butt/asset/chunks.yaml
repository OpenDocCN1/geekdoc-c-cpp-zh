  trans: "\n\n如果发生`XXX_input`，则进入田纳西州（Tennessee_state）。从“Butterfly”菜单中我们看到可以这样做：如果我正在\
    \ LCD 上显示“AVR Butterfly”，并且摇杆向左点击，那么我进入 Revision 状态；否则如果摇杆向下点击，那么我进入 Time 状态。如果我正在\
    \ LCD 上显示“Time”，并且摇杆向左点击，那么我进入 Clock 状态；否则如果摇杆向下点击，那么我进入 Music 状态。（以此类推。）\n\n\
    当我正在 LCD 上显示\"Options\"，**且**用户按下左方向键时系统切换至 Display 界面若触发下压动作则由当前位置直接导向 AVR 蝴蝶标志对应状态的入口点——当然还需明确每处具体情境所对应的后续转移目标根据所有可能输入组合来定位这些流转规则产生大量数据因此我们决定利用学习过的结构体知识进行管理模式按顺序定义两类基础模版随后为每种特定数据集实例化绑定所属`state`,`input`,及\
    \ `nextstate`\n\n混杂注释：（如前文所述原蝶形软件基于某编译器编写并移植到 Winav 平台过程中留有大量的批注标记此处鉴于讨论无关性已由维护者\
    \ Martin 本人移除其原有备注内容仅保留核心框架）在头文件 Menu.h 内查找可找到相关的数据结构用于我们的菜单项和下一步映射涉及三个关键变量声明块：\n\
    \n```\ntypedef struct PROGMEM {\n    unsigned char statetext; /* FLASH 存储器中的文本指针\
    \ */\n} MENU_STATE;\n\ntypedef struct PROGRAM {\n    unsigned char statechar ,\
    \ input ;&STATENEXT\n}MENUNEXSTATE;\n```\n\n为了响应给定条件我们需要补充相关函数逻辑以适配现有所提供的前置查询机制首先处理第一个自定义类型它支持最多\
    \ 256 种独立原子态各与终结回调函数相关联每个节点承接一个字符型返回值调用方即可依据如下方式构建枚举列表:\n\n```\nconst STAT meta\
    \ menu[]MEM = ST_AVREVMT ATEXT NULLSTMEREVTIME CLOCKTHCLOCLLotsmore stuff0 NULL\
    \ \n```\n\n我们将这套配置称作 menmeta 维基体系便于关联语义层面的相对跳随即使逐级细化不包括次级子例程举例来说针对文字字段〔超链接源文档()未解析〕处于空值状态下模块也会强制退回调整队列用以应对潜在的歧义超出预期范畴而产生的额外开销对于同规模\
    \ NextState 阵列我们也面临类似挑战诸如分支收敛冗余等待归纳总结等临时问题应在后期使用结构化数组实施统一调度管理使得各类事务策略得以顺利整合全局流程据此推演形成通用解构方案原型如下代码段展示雏形\n\
    \n```  \ntypedf struct 首字：\n{\n    无符号字符类型 CPtr 指向内存文字指针；\n    (*FuncPtr)(Char);\n\
    }\n后定义:\n289 信号输入值产生输出描述问题路径画面序列等功能化...\n   \n接下来是例子的具体初始引用代码段部分......\n``` \n\
    \n为了构建清晰的状态机和与用户交互的数据流逻辑实现上述最终无限循环程序运行流程可见主函数内部通过判断设定跳转子步骤完整过程如图所示：(由于内容较长且原文格式混乱请保证核心保留去除注释修改标记)实际工程的源文件演示更复杂但是此处精炼抽象符合预期设计目标即可理解整体组件关系。\n\
    \n"
- fmt: "\n我知道，相信我，我理解。这很困难，但你现在应该能够通读 Butterfly 状态机代码并完全理解其工作原理了。如果你还做不到……嗯，也许你应该回到指针部分慢慢阅读直到你重新准备好再回来这里。别气馁，C语言需要一段时间才能适应；而编写Butterfly软件的那些人有着漫长、寒冷且黑暗的冬天可以钻研——除了习惯C编程之外没什么事可做（哦对了还有驯鹿…）。\n\
    \n## 第11章 The Butterfly LCD\n\n我曾读过一本书（我想是David Brin的《实践效应》），书中描述了原始人发现了一块带有LCD显示屏的数字手表的故事：他们对制造者能训练所有小黑虫跑动并以如此奇特的方式排列感到惊叹不已——这就是关于底层液晶技术我所愿意透露的全部细节了。——相反地我们将集中精力使用C语言来指挥这些小【黑虫】为我们表演杂技。\n\
    \n如果您非要知道其中奥秘的话：Atmel的应用笔记`AVR065: LCD Driver for the STK502 and AVR Butterfly`可从官网获取以便深入了解繁琐细节；同时`Atmega169\
    \ data book》中有个不错的章节‘LCD Controller’包治失眠症!\n\n为了继续维持我们无知的状态首先将基于 `http://www.siwawi.arubi.uni-kl.de/avr_projects/#bf_app\
    \ `上提供的测试程序开始工作 ——注意主文件main.c开头自信满满地写着:\n```\n// mt - used for debugging only\
    \ - may not work\n```\n\n不过经过一些修改和适当调整使其成为一个演示模块后它运行良好 。  我们会直接调用这些函数而不试图去彻底搞懂它们\
    \ ;换言之通过复用已有现存代碼来提高生产效率并且遵守面向对象原则 --不让我们自己去弄坏原本完美无缺的好软体.\n\n### 在\"LCD_functions)\"\
    模塊中可供使用的功能:\n\n•\t```void LDC_putc(uint8_t digit , chat character); ``` \n>  \
    \ 向指定数字位写入字符  \n\n•\t``` void lcd puts{chat*pStr ， char scrollmode} ； ```\n>\t\
    \  将字符串显示至l ed                【此处疑为笔误应为L】【S?原文未改保真】\n>*pstr是指指向普通内存串地址;\n>`scrollmodé目前暂无效`;\n\
    \n •\t  ```voi Dputs_f contstatFlashPntCharmod)； ``             ///原版保留可能符号错乱需谨慎}>\n\
    \t   输出存于FLASH内常量文本\\\n*PFIash前缀标注为该ROM区域入口点;\n\n          滚动参数仍留用；(略)\n\n   \
    \ ____清屏例程 ：___><code vlid cLeAr Voi ) ;\n       \n        -->清除即灭 \n\n此外还包括冒号控制:<pre>&nbp;Char\
    \ Show):获值0禁止否则开启            < /pr E >\n\n以及对比设置接口 :&character INPUT取范围整数决定亮度等级\
    \ ~最终传递PC -> butterfly通信实验项目目标适配完善信使调试计画 :\n\n---前后分解---\n现在改造我们的messenger程式使得可以向butter\
    \ y发传送到画面上的字串 &&增加诸如设定亮暗切换双井消显频闪闪烁效果特异functions ...除非盲目急迫写码反而先在自然人视角厘定列出待测各项细项清单从微观定义出发验证每个过程：\n\
    \      *检测各方法如左下摘要 *\n>>>为此设计新版本硬件侧回应逻辑已存在命令分析器再利用现有机括匹配触发电平 =>达成所需响应路径综述如下\n\n\
    \n\n虽然艰难学习曲线陡峭但仍祝愿读者一路顺风~\n\n以下内容涉及较多特殊术语与内部引用建议依据上下文灵活处理格式标记\n"
  raw: 'I know, believe me I know. This is hard stuff, but you should be able to walk
    through the Butterfly state machine code now and fully understand how it works.
    If you don’t… well, maybe you want to back up to the pointers section and read
    slowly till you are back here again. Don’t feel bad, C takes a while to get used
    to and the guys who wrote the Butterfly software have very long, cold, and dark
    winters to hunker down with little else to do other than get used to C programming,
    well, there are the Reindeer…Chapter 11 The Butterfly LCDI read a book (I think
    it was David Brin’s ‘Practice Effect’) where some primitive people found a digital
    watch with an LCD display. They were amazed that whoever made the thing was able
    to train all the little black bugs to run around and align themselves in such
    peculiar patterns. And that’s the extent of the detail I’ll give on the underlyingtechnology
    of LCDs. We’ll concentrate instead on using C to train the little black bugs to
    do our tricks. If you must know the magic, then Atmel has an application note:
    AVR065: LCD Driver for the STK502 and AVR Butterfly available from their website
    that will get you deep into the gory details. And the Atmega169 data book has
    a nice chapter ‘LCD Controller’ that is a sure cure for insomnia.To keep our ignorance
    even more intact we will begin by using software based on the LCD-Test software
    available on http://www.siwawi.arubi.uni


    kl.de/avr_projects/#bf_app noting that the main.c file begins with the confidence
    building:// mt - used for debugging only - may not workHowever, with a few changes
    and some shoehorning it all into a demonstrator module, it works just fine. We
    use these functions without attempting to understand them. Another way to say
    this is that we will enhance our productivity by reusing existing code and conform
    to object oriented principles by not allowing ourselves to mess with perfectly
    good software.Functions at our disposal in LCD_functions module:• void LCD_putc(uint8_t
    digit, char character);o Writes a character to the LCD digit


    • void LCD_puts(char *pStr, char scrollmode); o Writes a string to the LCD o *pStr
    is a pointer to the string o scrollmode is not used


    • void LCD_puts_f(const char *pFlashStr, char scrollmode);o Writes to the LCD
    a string stored in flasho *pFlashStr is a pointer to the flash string


    o scrollmode is not used


    • void LCD_Clear(void);o Clears the LCD


    • void LCD_Colon(char show); o If show = 0 disables Colon, otherwise enables Colon


    • char SetContrast(char input);o Uses the value of input from 0 to 15 to set the
    contrastPC to LCD test programLets modify our messenger program so that we can
    send strings to the Butterfly to display on the LCD. We will also add commands
    to set the contrast, show/hide the colon, clear the display, set the flash rate,
    and send strings with flashing characters.Instead of running off willy-nilly and
    writing software, lets start with a short specification of what we want to test
    from the PC users perspective.


    We will test each function by sending the following command strings to the Butterfly:•
    PUTCdigitcharacter to test LCD_putc(uint8_t digit, char character);o Send PUTCdigitcharacter
    where character is a char to be displayed and digit is the LCD segment to display
    the input on. For example PUTC6A will cause the character A to be displayed on
    the 6th LCD digit.o Verify function by seeing the correct char in the correct
    position• PUTF to test LCD_puts_f(const char *pFlashStr, char scrollmode); o Verify
    function by seeing the correct string on the LCD


    • PUTSstring to test LCD_puts(char *pStr, char scrollmode);o Send PUTSstring where
    string is a string to be displayed. For example PUTSHello World! will cause the
    LCD to display ‘Hello World!’. o Verify function by seeing the correct string
    on the LCD


    • CLEAR to test LCD_Clear(void);


    Chapter 11 The Butterfly LCD


    o Send CLEAR while displaying text on the LCD o Verify function by seeing the
    LCD clear


    • COLON to test LCD_Colon(char show);o Send COLON,on/off where on/off is either
    ON or OFFo Verify function by seeing colons on LCD turn on or off


    • SETC## to test char SetContrast(char input);o Send SETC## where ## is from 0
    to 15 and sets the contrast.We will use this to design the functions needed on
    the Butterfly. We already have a command processor designed, so we will reuse
    that to call the functions on receipt of the correct command.• PUTCdigitcharacter
    o Call LCD_putc(digit, character);


    o Send “Called LCD_putc” to PC where # are the values sent in decimal• PUTF


    o Set a pointer, *pFlashStr, to a string in flash o Call LCD_puts_f(*pFlashStr,
    scrollmode); o Send “Called LCD_puts_f” to the PC.• PUTSstring


    o Load the string and point pStr to it. o Call LCD_puts(*pStr, scrollmode);


    o Send “Called LCD_puts with ‘string’” to the PC where string is the string sent.•
    CLEAR


    o Call LCD_Clear();


    o Send “Called “LCD_Clear()” to the PC


    • COLON#o If # == 1 call LCD_Colon(1);o Else if # == 0 call LCD_Colon(0); o Send
    “Called LCD_Colon” to the PC where # is the one sent.


    • SETC ##


    o Convert ## characters to a numerical value ‘input’ o Call SetContrast(input);


    Chapter 11 The Butterfly LCD


    o Send “Called SetContrast to the PC where # is the decimal number sent.


    NOTE: In LCD_driver.c must comment out #include “main.h”


    Now that we have our specification we can run off willy-nilly and write the software.


    We write the Demonstrator.h file:// Demonstrator.h LCD demo version void initializer(void);


    void parseInput(char *);And the Demonstrator.c file:


    // Demonstrator.c LCD demo version#include "PC_Comm.h"


    #include "Demonstrator.h" #include "LCD_test.h" #include "LCD_driver.h" #include
    "LCD_functions.h"// identify yourself specifically


    const char TALKING_TO[] PROGMEM = "\r\rYou are talking to the \0"; const char
    WHO_DEMO[] PROGMEM = "''LCD'' demo.\r\r\0";// bad command


    const char BAD_COMMAND1[] PROGMEM = "\rYou sent: ''\0"; const char BAD_COMMAND2[]
    PROGMEM = "'' - I don''t understand.\r\0";const char LCD_START_msg[] PROGMEM =
    "LCD demo\0";void initializer()


    {


    // Calibrate the oscillator: OSCCAL_calibration();// Initialize the USART USARTinit();


    // initialize the LCD LCD_Init();


    // Display instructions on PC


    Chapter 11 The Butterfly LCD


    sendFString(TALKING_TO); sendFString(WHO_DEMO);


    LCD_puts_f(LCD_START_msg, 1);}


    void parseInput(char s[])


    {// parse first character


    switch (s[0])


    { case ''d'': if( (s[1] == ''e'') && (s[2] == ''m'') && (s[3] == ''o'') && (s[4]
    == ''?'') )


    sendFString(TALKING_TO);


    sendFString(WHO_DEMO);


    break; case ''C'': if( (s[1] == ''L'') && (s[2] == ''E'') && (s[3] == ''A'') &&
    (s[4] == ''R'')) OnCLEAR();


    else if ((s[1] == ''O'')&&(s[2] == ''L'')&&(s[3] == ''O'')&&(s[4] == ''N'')) OnCOLON(s);


    break; case ''P'' : if( (s[1] == ''U'') &&


    (s[2] == ''T'') && (s[3] == ''C'')) OnPUTC(s);


    else if( (s[1] == ''U'') && (s[2] == ''T'') && (s[3] == ''F'')) OnPUTF(s);


    else if( (s[1] == ''U'') && (s[2] == ''T'') && (s[3] == ''S'')) OnPUTS(s);


    break; case ''S'' : if((s[1]== C'')&&(s[2


    ==''R'')&&(s[3]==''O'')&&(s[4]==''L'')&&(s[5] == ''L'')) OnSCROLL(s); else if(
    (s[1] == ''E'') && (s[2] == ''T'') && (s[3] == ''C'') ) OnSETC(s);


    break;


    default:


    sendFString(BAD_COMMAND1);


    sendChar(s[0]);


    sendFString(BAD_COMMAND2);


    break;s[0] = ''\0''; }


    }


    We write, the Messenges.h, LCD_test.h and LCD_test.c files:


    // Messages.h


    Chapter 11 The Butterfly LCD// LCD test messages


    const char PUTF_msg[] PROGMEM = "Called LCD_puts_f \0"; const char PUTS_msg[]
    PROGMEM = "Called LCD_puts with \0"; const char PUTC_msg[] PROGMEM = "Called LCD_putc\r\0";
    const char CLEAR_msg[] PROGMEM = "LCD_Clear()\r\0"; const char COLON_msg[] PROGMEM
    = "Called LCD_Colon\r\0"; constchar SETC_msg[] PROGMEM = "Called SetContrast\r\0";
    const char SCROLL_msg[] PROGMEM = "Called OnScroll\r\0";


    // LCD_test.hvoid OnPUTF(char *PUTFstr); void OnPUTS(char *pStr); void OnPUTC(char
    *PUTCstr); void OnCLEAR(void); void


    OnCOLON(char *pOnoff); void OnSETC(char *SETCstr); void OnSCROLL(char *SCROLL);//
    LCD_test.c'
