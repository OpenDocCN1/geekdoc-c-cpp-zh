    Fur EliseChapter 9– Digital Meets Analog – ADC and DACChapter 9– Digital Meets
    Analog – ADC and DACBut First - A Debugging TaleIn the ADC project that follows,
    I liberally ‘borrowed’ code from the Butterfly, adding my own inimitable style
    to allow a user from the PC to ask for a measure of light, temperature, and voltage.
    All was well except for a tiny problem with the voltage measurement. Tiny as in
    the first time I tried to measure voltage on the Butterfly I destroyed it. Well
    destroyed is a bit harsh. It looks just like it always did, but it doesn’t work.
    Fortunately I know myself so I had ordered six Butterflys because, as I said elsewhere,
    my nickname is Smoky Joe since my favorite learning method is producing copious
    quantities of smoke in my hardware projects. The Butterfly didn’t smoke though.
    It just died. Belly up, legs in the air, ready for a pin thru the thorax to be
    box mounted in the Dead Butterfly Museum. But Lepidopteron death is not what this
    is about. I eventually found that I had done something unbelievably stupid and
    since you wouldn’t believe it, I won’t relate that tale. Lets just say this event
    led me to becoming a bit paranoid about the voltage measurement part of the Butterfly
    hardware and I went forward on tiptoes and slightly hyperventilating as I proceeded
    with the ADC code.My next version was able to read the light just fine, and the
    temperature just fine, and the voltage just one time.'
