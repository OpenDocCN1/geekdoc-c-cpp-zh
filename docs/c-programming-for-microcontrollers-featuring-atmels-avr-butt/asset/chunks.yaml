    \ ,8/9,A,B,C,D,E,F\n```\n\n因为我们有十根手指来计算而得名于十进制计数（如果把拇指也算作一根手指）。想象一个拥有16根手指的外星人或许有帮助——更形象地说：四只手、每手三指加一拇指。\
