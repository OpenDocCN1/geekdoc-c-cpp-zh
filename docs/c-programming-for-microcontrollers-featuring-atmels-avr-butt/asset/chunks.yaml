    is: PUSH


    I’m tired and going to bed. Tomorrow we’ll look at timers. I may get so excited
    that I won’t be able to sleeeeeppp ummm errr zzzzzz….


    Timers/CountersGood morning! In Blinky.c we set the timing of the blinks using
    the _delay_loop_2(delaycount). The delay function uses a 16-bit count that takes
    4 cycles/loop. This loop runs in the CPU, which can do nothing else while it is
    running. You set the period of the delay by sending a parameter for the number
    of ‘4 cycles’ you want to waste. Knowing the time per cycle allows you to set
    the time of the delay. Cycle wasting delays are a simple way to control some types
    of periodic events, but the simplicity comes at the cost of totally occupying
    the CPU while wasting the specified time. That’s a good idea if you don’t need
    to do anything else while the delay is running, but it makes a lousy way to mark
    time if you have anything else going on. Timers are peripheral devices that run
    independent of the CPU and only bother the CPU when set up to do so. The bothering
    can take the form of setting a flag that the CPU can poll, or throwing an interrupt
    to break into normal operations.The reason we usually see Timer/Counter hooked
    together is that the Timer/Counter peripheral keeps time by counting pulses. The
    pulses can come from a synchronous periodic source providing an accurate time
    count, or the pulses can come from an asynchronous non-periodic source providing
    an accurate count of the input pulses. In the first case we could be counting
    pulses from the 32.768 kHz watch crystal and keep accurate time. In the second
    case we could be counting pulses from a light beam interrupter circuit and keep
    an accurate count of the number of people entering a door and breaking the light
    beam.The ATmega169 has three Timer/Counters, two 8 bit and one 16 bit. A timer
    overflows when it counts up to its maximum value (255 for the 8 bit and 65535
    for the 16 bit devices) and resets to 0\. We can get the Timer to overflow at
    lower values by putting a value in the OCR, Output Compare Register, for the specified
    timer and that timer will compare the value with the count and when they match
    it will set a flag or throw an interrupt. It can also be set to overflow to 0
    on a match.The timers can be configured for input capture events, where a change
    on a pin will cause the timer to save the count when the event occurred. This
    input capture count can be used to measure the width of external pulse. If the
    external pulses are periodic, we have a frequency counter.The Timer/Counter runs
    independent of program execution and there are three ways for the program to monitor
    and react to Timer/Counter events.1\. Poll the overflow flags.


    2\. Break program execution with an interrupt.'
