    \ 32.768kHz 的手表\n// 晶振。\nvoid RTC_init(void)\n{\n    // 等待外部晶振稳定\n    for(int\
    \ i = 0; i <10; i++)\n        _delay_loop_2(30000);\n \n    cli();           \
