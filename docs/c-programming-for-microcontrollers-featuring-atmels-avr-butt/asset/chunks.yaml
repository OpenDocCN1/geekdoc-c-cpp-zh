- fmt: "\n当本书编写时，Digi-Key列出了引脚数少至6个I/O的`ATTINY11`（$0.54）和多达54个引脚的`ATMEGA169`（$8.60），后者是Butterfly开发板上使用的微控制器。这些引脚大部分被组织成端口，即一组可通过特定端口的访问和控制寄存器进行配置和使用的引脚集合。许多引脚具有不止一种功能：它们可用于输入或输出数字逻辑数据、检测外部中断、作为时钟输入或用于模数转换等。本节我们将重点讨论数字I/O。\n\
