    \ `SIGNAL(SIG_OVERFLOW2)`函数。这样我们就可以用它来跟踪秒数。\n\n## 将计算机时间转换为人类可读的时间\n\n我们可以统计秒数来进行计时；但仅仅得到一个数字（与40241类似的值）对我们而言意义不大。（假设计数从午夜开始），那么这个数值表示当前时间为上午11点10分零41秒\
    \ 。然而这种转换并不困难——假如您的手表初始设定为2005年5月11日下午3时20分33秒 ，而现在读取的计数值对应的是两年、78天、6小时14分钟又7秒钟之后的一个时刻。因此我们需要进行一些计算才能将这个读数转换成我们能理解的形式\
    \ 。接下来我们将简要探讨一种方法 ：如何把以字节为单位的数据转变成我们能够识别的ASCII文本字符串 。\n\n### BCD ——二进制编码十进制  \n\
