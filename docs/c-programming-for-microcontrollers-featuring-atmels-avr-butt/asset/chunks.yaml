  raw: 'return i; }In st rlen, we accept a pointer to a string (we’ll talk about pointers
    later). The string is an array of characters with a terminal character ‘\0’ (we’ll
    talk about arrays later). The while statement evaluates each character, incrementing
    the index, i, until the terminal character is found. The return value is the number
    of characters, not including the terminal character.In C the single and double
    quotes have specific meaning: when you see ‘x’ the compiler sees the ASCII number
    for the single character x; when you see “x” the compiler sees a string with the
    character x followed by the string termination character ‘\0’. Whenever you see
    two characters a backslash and a following character like ‘\0’, the C compiler
    sees this as a single nonprintable character called an ‘escape sequence’.In the
    serial communications project we will use several escape sequences, for example
    ‘\r’ is a non-printable character that tells the Teletype machine to return the
    print head to the left of the platen and roll the paper one line. What? You aren’t
    using a Teletype machine? Maybe not, but you are using a direct ancestor of one,
    and C was written on one, so thou shouldest get thyself used to anachronisms.We
    define non-printable characters using escape sequences and I guess this is just
    about as good a place as any to show them all:Table 8: Escape Sequences \a alert
    (bell)


    \b backspace


    \f formfeed


    \n newline


    \r carriage return \t horizontal tab \v vertical tab


    \\ backslash


    \? question mark \’ single quote


    \” double quote


    \000 octal number


    \xhh hexadecimal number \0 nullBefore you look at the next function, take out
    you paper and pencil computer and come up with an algorithm for converting an
    ASCII character string of numerals into an integer, for example convert the string
    of char data types: “1234” to the int 1234\. Give this some thought and see what
    you come up with. I’m serious now, do it or the rest of the ink in the book will
    fade away and you’ll have an expensive drawing pad. Need a hint? Look at Table
    9: ASCII Table (in appendixes) and note that the characters for 1, 2, 3, and 4
    are sequential integer numerals, 0x31, 0x32, 0x33, and 0x34.//NOTE: stolen from
    K&R p. 43 atoi function int atoi(char s[])


    {int i, n;


    n = 0;


    for(i = 0; s[i] >= ''0'' && s[i] <= ''9''; ++i) n = 10 * n + (s[i] - ''0''); return
    n; }The atoi, ASCII to integer, function converts a string of ASCII characters
    representing the integers 0 thru 9 into an integer number equivalent to the string.
    If you didn’t figure this one out yourself then use your paper and pencil computer
    to run the function with char s[] equaling ‘1,2,3,4,\0’ to see how it works. Note
    the condition in the ‘for’ statement will cause the loop to bail if one of the
    characters is not equal to or between ‘0’ and ‘9’. This gets us out of the loop,
    but not out of trouble. In a robust function, we would have some kind of error
    reporting mechanism so that code calling atoi could know that it sent a bad string
    and so the calling function could build in some way to recover. We’ll get into
    all that later and be careful not to make mistakes now. (Famous last words)


    The conversion algorithm relies on the convenient fact that the ASCII characters
    for integers are represented by a sequence of numbers. ‘0’ is 0x30 in ASCII, ‘1’
    is 0x31, and so on. So if s[i] = ‘1’, the character, we get (s[i] – ‘0’) = 1,
    the integer. That is, we subtract the character ‘0’ which has a value of 0x30
    from the character ‘1’ which has a value of 0x31, leaving us with the number 1\.
    Voila: ASCII to integer.We start with n = 0, so the first time thru the 10*n =
    0 and the character is converted to the 1’s position in the integer. For each
    subsequent pass, the n has a value so it gets multiplied by 10 providing the 10’s,
    100’s, and so forth.You were asked to think about this algorithm before looking
    at the atoi function. Don’t be concerned if yours wasn’t as simple and elegant
    as this one. Mine wasn’t. It takes a while to start thinking like a computer.
    Then your brain turns to silicon and people avoid you.Now think about the problem
    of reversing the characters in an array. How would you do this? Try it on the
    pencil and paper computer, then look at the reverse function.//NOTE: stolen from
    K&R p. 62 reverse function // reverse: reverse a string s in place void reverse(char
    s[])


    {int c, i, j;for (i = 0, j = strLen(s)-1; i < j; i++, j--){ c = s[i];


    s[i] = s[j];


    s[j] = c;


    }


    }This is pretty straightforward. Put the first char from the array in a box, then
    put the last character in the array in the position of the first character, then
    take the stored character and put it in the last position in the array. Mover
    your index in one position on both ends and repeat.


    Now try to develop an algorithm for converting an integer to an ASCII string.
    Mine worked, but wasn’t even close in the quality of the actual function in K&R.
    Oh, well.//NOTE: stolen from K&R p. 64 itoa function void itoa(int n, char s[])


    {int i, sign;if ((sign = n) < 0) // record sign


    n = -n; // make n positive


    i = 0;


    do { // generate digits in reverse order s[i++] = n % 10 + ''0''; // get next
    digit


    } while ((n /= 10) > 0); // delete it if (sign < 0)


    s[i++] = ''-'';


    s[i] = ''\0''; // add null terminator for string


    reverse(s);


    }In my attempt at this, I never thought to do it backwards then reverse the string.
    First store the integer in the ‘sign’ variable and we get the sign of the integer
    by using the ‘if’ statement to see if the integer is less than 0, if so, we multiple
    it by– 1 to make it positive. Then we use do while, because we want to have at
    least one digit. Now get out your paper and pencil computer and run the number
