  raw: '// Do stuff with the variable ‘data’ }Note that the argument now not only
    has the type ‘char’ but a specific variable ‘myData’. It doesn’t matter what you
    name the argument in the calling function, as long as the type matches, so:sendChar(myByte);This
    is just fine, since the sendchar function will use the data in ‘myByte’ as the
    data in ‘myData’ in the function definition. An important consideration is that
    the data in ‘myByte’ is copied to sendchar(myByte), but the variable ‘myByte’
    is not sent. Think about this. In the calling function, ‘myByte’ is an alias for
    the address of some data, in this case a char. The called function takes that
    char and puts in memory at another address aliased, in this case, with the name
    ‘myData’. ‘myByte’ and ‘myData’ have the same value but are not stored in the
    same place. The function only sees a copy of ‘myByte’ not the actual ‘myByte’
    itself. If the function chages the ‘myData’ variable, that change is not reflected
    in the calling functions ‘myByte’ variable. This is a source of a surprising number
    of bugs among novice C programmers. To clarify let’s make a function adder that
    adds two numbers.void adder(unsigned char a1, unsigned char a2, unsigned char
    r) {


    r = a1 + a2;


    if(r == 2) getrewarded(); else getboinked();


    }


    Let’s call it in main()


    int main() {


    unsigned char add1 = 1; unsigned char add2 = 1;


    unsigned char results = 0;adder(add1,add2,results); if(results == 2) getrewardd();
    else getboinked();}If you think 1 + 1 = 2 prepare to get boinked. You’ll getrewarded()
    in adder() and getboinked() in main().In the adder function, r = 2, but this doesn’t
    change the ‘results’ in the parameter list in the function call to adder in the
    main() function.Returns


    Ouch! Boinking hurts, so Let’s make adder work right, we change the return type
    from void to char and declare r as an unsigned char:


    char adder(unsigned char ad1, unsigned char a1) {


    unsigned char r;


    r = a1 + a2;


    if(r == 2) getrewarded(); else getboinked();


    return r; }


    And in main we set ‘results’ equal to adder so it gets set to the data returned
    by adder:


    int main() {


    unsigned char add1 = 1; unsigned char add2 = 1;


    unsigned char results = 0;


    results = adder(add1,add2);if(results == 2) getrewarded(); else getboinked();


    }Now we get two rewards. If we want to skip the reward we could write adder:


    char adder(unsigned char ad1, unsigned char a1){


    return a1 + a2;


    }And we have a concise and totally useless function. If we want to add 1 and 1,
    we just add them.


    Variables External, Static, and RegisterAnother way to do the adder() thing would
    be to use and external variable (global). These are variables defined outside
    any function, usually in a header or before main() and are available for any function
    to use. We could have written:void adder(unsigned char, unsigned char); unsigned
    char results = 0;


    int main() {


    unsigned char add1 = 1; unsigned char add2 = 1;


    adder(add1,add2);if(results == 2) getrewarded(); else getboinked();


    }void adder(unsigned char ad1, unsigned char a1){


    results = a1 + a2;


    }Which would work fine. Unless of course an interrupt triggered right after we
    set results in adder() and changed it to 3\. Then when the interrupt finishes
    and we look at results in main() we get boinked again. This is a good reason to
    avoid external variables. You never know where they’ve been or what kind of nasty
    stuff they might track in. Also they permanently occupy memory, while defining
    ‘results’ in adder would only use memory when adder is called, and release the
    memory when finished.


    ScopeVariable names have scope, meaning the locations where they are recognized,
    that determine how they can be used.Variable names declared in a function are
    recognized only in that particular function. For example, you can have multiple
    functions with the int i declared local to that function and they won’t interfere
    with each other. Likewise, a variable declared within a block remains local to
    that block.External variables have scope from the point they are declared to the
    end of the text file. If you compile a file, you can call functions in it from
    other files, but you cannot use an external variable declared in another file.There
    is a difference in the definition and the declaration of external variables. If
    you use the extern keyword as in:


    extern int tramp;


    you have declared that tramp will be an int, but you have not defined it. To use
    tramp you must define it in each file that will use it. Something like:


    int tramp = NULL;


    This must appear in a source file that uses it. For example:


    In file1: extern double gadabout; extern char harlot;In file2: double gadabout
    = 0; char harlot = ‘?’;In this case changes to gadabout and harlot in file1 will
    also appear in file2 and visa versa. Maybe I’m being harsh calling them tramp,
    gadabout, and harlot, but externs are even more prone to being who-knows-where
    and doing who-knowswhat than regular external variables so they are bug prone.An
    example bug comes when you create an extern:


    extern int upcount;in file1 and declare it in files 1 and 2 and put your code
    aside for a few months, then get busy on file3 and decide that you need an external
    variable to do some up counting, so you declare it int upcount = 0; forgetting
    that it has already been declared as an extern in file1 which you have stuck in
    a library and no longer look at. Then you start getting weird bugs where the seemingly
    impossible event occurs that your upcount is getting changed unpredictably. This
    kind of error is so common that it was one of the reasons C++ was invented. Use
    externs if absolutely necessary (sometimes nothing else will do) but use them
    with extreme caution.Headers


    Header files are a convenient place to stick all the stuff that you put before
    the main() function. They are files with a suffix of .h and are declared as:


    #include <LEDblinker.h> #include “PCcomm.h”If the declaration uses <filename>
    the compiler looks in an implementation defined location, usually an ‘include’
    directory. If it uses “filename” the compiler looks in the same directory that
    the source program was located. The choice will depend on how you’ve decided to
    organize your development file system.Blocks InitializationIf you don’t explicitly
    set a variable equal to some value, external and static variables are guaranteed
    to be initialized to zero; automatic and register variables are guaranteed to
    be initialized to random garbage. It’s good practice to always initialize a variable.


    External and static variables must be initialized with a constant expression,
    but you can use other variables in the initialization of automatic and register
    variables:int dosomething(int x, int y, int z) {


    int a = 0;


    int b = x + y + z – 12;


    // do stuff


    }RecursionRecursion happens when a function calls itself. I’ve never called myself.
    I’m afraid that I might answer the phone and then have to deal with the philosophical
    or psychiatric implications. However, C has no problems with functions calling
    themselves, other than the psychiatric problems it tends to cause programmers
    when confronted with a recursive function and the task of figuringout what’s going
    on. C Gurus love recursive functions.void recursivefunc(double data) {


    double mess; // Do some stuff


    recursivefunc(mess);'
