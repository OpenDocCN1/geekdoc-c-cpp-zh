  trans: "\n\n当我请求读取电压时，硬件对超级终端的响应为：“读数为 1.1 伏特。”然后立即停止响应，不再与 PC 通信。我的反应包括大量咒骂以及对又浪费了\
    \ 19.99 美元的抱怨，但这次“蝴蝶”板并没有被烧毁——它重启后运行正常，只是在我再次发送`volt`命令时才崩溃。\n\n我最初的猜测（当时认为很合理）是这和室内的光照强度有关。听起来很疯狂？实际上，“光传感器会影响‘蝴蝶’板的电压基准”，因此在测量电压之前必须先测量环境光线来校准这个基准值。于是我遮住光传感器尝试——结果仍然崩溃；接着我又用强光照射它——同样无济于事。\n\
    \n于是我想：如果它对由光照产生的电压如此敏感的话，那么也许 USART 通讯信号中携带的杂散干扰电平正在到处传播并搞乱系统。“USART 使用的供电比主控芯片更高，”而官方原理图中包含一个专用反相电路用于产生负压——“这货看起来就像是辐射杂乱噪声的最佳嫌疑犯……而这些随机波动可能与\
