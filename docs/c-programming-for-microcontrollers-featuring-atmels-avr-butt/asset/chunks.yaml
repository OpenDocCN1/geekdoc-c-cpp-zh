  trans: "\n\n# 第 7 章：微控制器中断与定时器\n\n中断和定时器对微控制器应用至关重要，但它们与 C 编程语言无关。我找不到一种好方法在逐步讨论`C`的同时自然融入这些主题，因此我们将暂时放下`C`来研究硬件。中断和定时器将有助于使后续项目更具实用性。\n\
    \n## 什么是轮询？\n\n我们通常在微控制器软件中使用两种方法来检查事件是否发生：**轮询**（通常是在 `main()`函数中通过无限循环持续检测状态）和\
    \ **中断**方式应对特定情况变化响应需求实现精准及时处理反馈信号源条件触发机制保证系统稳定高效运行并避免资源浪费问题产生于不合适逻辑设计导致意外错误难以调试修复成本高昂等现象出现需要注意正确处理流程顺序防止数据损坏丢失例如当读取多字节变量时如果中途被打断可能会读到前后不一致的数值从而引发奇怪\
    \ bug 这种问题随机发生极难复现特别是关键系统中可能造成死机崩溃但没有明显原因必须加以防范正确做法是修改相关全局变量前先禁用该变量的对应功能完成操作后再恢复原状遵循准确步骤即可保障车辆行驶安全性希望不会被起诉等因为本章内容涉及\
    \ ATMega169 系列芯片官方文档表格清单见 ATmega48/88/168 手册页码详情可根据实际按需查阅索引查找具体寄存器配置说明.\n\n###\
    \ 端口引脚映射\n以下寄存器用于配置 PCI（引脚电平变化）的中断设置：\n\n- PCMSK1 控制哪些位触发；置 1 启用相应管脚监测、保持默认值为\
    \ 0 则不受影响  \n```\nPCMSK1 |= ((l<<PB4)|(l<<PB6)|((uint8_t) l << PINE)); //开启 PB47\
    \ 及其关联终端侦测模式其他选中输出维持不变注意此表达式中使用 OR 布尔运算理解需要纸笔练习非常重要基础概念为了简化代码可用#define 预处理指令定义\
    \ PINBMASK 宏其效果是将整个表达式替换为相同常量值展开成编译器所见形态便于维护阅读清晰明了……\n```\n\nEIMSK/EIFR 寄存器的详细描述请参见相关资料节选示例代码如下所示：\n\
    ``` \nEIFR = (byte)(|)；  清除标志禁止写入未声明保留字段以符合规范要求   \nIEMSI^= err-bit ;   这里初始选择矢量表交叉引用文献二十二期利用伪探针同位于\
    \ C 库 signal.h include 封包部分延后解析即刻着手建立协程框架.\n```\n\n"
