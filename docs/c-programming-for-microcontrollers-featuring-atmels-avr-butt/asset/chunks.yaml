    int howdy[6];


    Sets aside an array of twelve contiguous bytes sized memory locations, since each
    int requires two bytes of memory.


    We‘ve seen before how to assign data:howdy[0] = ‘h’;


    howdy[1] = ‘o’; howdy[2] = ‘w’; howdy[3] = ‘d’;


    howdy[4] = ‘y’; howdy[5] = ‘\0’;or we can do this when we define the array:


    char howdy[] = {‘h’,’o’,’w’,’d’,’y’,’\0’};


    Here’s a puzzle for you:


    char *confuseus; char c;confuseus = &howdy[0]; confuseus += 4; c = *confuseus;No
    tricks, what does c equal? Right, ‘y’ the 4th element of the howdy array. If it
    wasn’t clear, try it with comments:


    char *confuseus; // create a char pointer


    char c; // create a char variable;


    confuseus = &howdy[0]; //set confuseus to point to the howdy array; confuseus
    += 4; // set it to point to howdy[4]


    c = *confuseus; //set the contents of c to the contents of howdy[4]


    Clear?


    Okay, what about:


    char c1, c2;


    c1 = *(confuseus + 1); c2 = *confuseus + 1;


    c1 now equals ‘o’ and c2 equals ‘i’.


    Groan.For c1 we added 1 to the address of confuseus before we dereferenced it
    with the indirection operator. For c2 we dereferenced it, making it equal to ‘h’
    then we added 1 to ‘h’ NOT the address, making it equal the char numerically following
    ‘h’, which is ‘i’.Double groan.


    We can express the array position using pointers:int i = 4; char c1,c2; char*
    confuseusmore;c1 = howdy[i]; // c1 = ‘y’ using array notation c2 = *(howdy + 4);
    // c2 = ‘y’ using pointer notation confuseusmore = &howdy[i]; // confuseusmore
    points to ‘y’ confuseusmore = howdy + i - 1; //confuseusmore points to ‘d’


