  trans: "\n\n# 设置定时器/计数器 2 输出中断\n\n要启用定时器输出中断，请设置`Timer/Counter 2`的中断屏蔽寄存器中的`TOIE2`位：\n\
    \n```\nsbi(TIMSK2, TOIE2);\n```\n\n最后，使能全局中断：\n\n```\nsei();\n```\n\n现在，如代码部分所示，每秒钟将调用一次\
    \ `SIGNAL(SIG_OVERFLOW2)`函数。这样我们就可以用它来跟踪秒数。\n\n## 将计算机时间转换为人类可读的时间\n\n我们可以统计秒数来进行计时；但仅仅得到一个数字（与\
    \ 40241 类似的值）对我们而言意义不大。（假设计数从午夜开始），那么这个数值表示当前时间为上午 11 点 10 分零 41 秒 。然而这种转换并不困难——假如您的手表初始设定为\
    \ 2005 年 5 月 11 日下午 3 时 20 分 33 秒 ，而现在读取的计数值对应的是两年、78 天、6 小时 14 分钟又 7 秒钟之后的一个时刻。因此我们需要进行一些计算才能将这个读数转换成我们能理解的形式\
    \ 。接下来我们将简要探讨一种方法 ：如何把以字节为单位的数据转变成我们能够识别的 ASCII 文本字符串 。\n\n### BCD ——二进制编码十进制\
    \  \n\nBCD 是一种编程技巧 ，可以简化对二进制数的存储与转换过程：（比如将一个累计晶振脉冲次数的计数值转变为适合显示于液晶屏上的形式 ）。一个 8\
    \ 比特字节可以被分为两个四位半字--每个都可以表示 0 至 15 之间的值 ----这也是前面提到为什么常常采用十六进制记法的原因之一 ；利用这样的思路\
    \ ,同一个单字节内可以用不同位置存放两位单独有效的整数 (各自占用 4 个二等价的空间 ). \n\n若某单一无符号字符(即常见的基本储存单元)所内含的具体整型信息不超过去九十八以内\
    \ （相对应最大值实际上仍由 00 到 99 管理起来才会如此定义下来 ）那么我们可用下列算法 : \n先设起始变量 =某个两位数例如 54 (`char\
    \ initialbyte = 54;`)  \n然后声明代表高位值的另一个临时保存：(`char high=0 ;`)  \n紧接着循环求取原始数据含有的十倍数次数:\
    \    \n```c\nwhile (initialbyte >=  携带此项判断条件符合条件的不断重复 ){//只要>=就逐减并累积高四位的真正具体延伸加\
    \ 1 操作再次执行限制继续检验 }     \nhigh++;      \ninitialbyte -=  规约该部参与过程中的差额量回到已达稳定均可接受的基准状态为止最终求解出剩下的最小范围内级别就能顺利获得所要实现的理想效果}]\
    \       \n经过此段处理以后原先初版已有内容变更为仅保留原各项所需的独占分组格式同理位居内存高地方面完成暂存取用备存即可收到期望转折所在也即是说目前结果展示实际获得了正确的是象\t\
    \   thus having first byte hold lower bound while second temporary gets resulting\
    \ output representation 指代\"完整的组态组合总计放置在一个目标选定的专门存储区内                    存量本体现已分别扮演起相互配合的专业角色映射抵达最后的自动化还原步骤应具备的全部初始化关键词绝对可以是哪位人事观察到深层专属于转化技术下衍生的绿叶唯有勇敢实践获取利器得天独厚鼓励探险家轻松掌握系统集成的艺术……}\"\
