    ![](image_rsrc3HH.jpg) successive approximation ADC Figure


    ![](image_rsrc3HJ.jpg) ![](image_rsrc3HK.jpg) ![](image_rsrc3HM.jpg) ![](image_rsrc3HN.jpg)
