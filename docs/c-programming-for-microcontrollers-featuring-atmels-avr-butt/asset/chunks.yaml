  trans: "\n迷惑他人正是 C 语言专家钟爱指针的原因，他们会不遗余力地利用指针来混淆代码。这也是许多人将 C 称为中级而非高级编程语言的原因。在高级语言中，程序员只需处理数据，编译器负责所有地址相关的决策；而在汇编这样的低级语言中，程序员需要为数据分配地址。在\
    \ C 中我们不必亲自操作地址，但若愿意也可以这么做——尽管危险重重有些任务却只能通过指针完成；此外与常规做法相比指针还能让我们更高效且巧妙地实现许多功能。\n\
    \n使用指针的理由有很多：举个简单例子考虑编写一个对内存连续位置序列中的数据进行操作的函数——假设有一个字符串“Say you have a string:”共\
    \ 22 个字符跟随着空字符'\\0'全部连续分布在起始内存位置（我们将这个地址命名为`MemStart`）之后：我们知道'S'位于`MemStart`,`MemStart\
    \ + 1`存储'a',以此类推直到存放'\\0'的 `MemStart + 23`.如果想让函数处理此序列我们可以将所有 23 字节作为参数传给该函数意味着它们都将在调用前被压入栈再由函数弹出—但在微控制器里必须节省堆栈空间所以得换个方法–只把变量\
    \ ` MemStar t ’当作参数使得从那里开始查找顺序递增遍历内存直至‘\\o’事先约定好这种序列始终以终止(如末尾带对应形式)现在原本需用消耗二十三个八位实参转变为仅推送两字长整数从而显著减轻负担.\n\
    \n听起来很简单一旦掌握窍门确实如此可悲的是很多新手的玩法好比幼儿摆弄 AK-47 —套用枪支辩护的陈词滥调：“子弹不会杀人只会人杀程序”。引用 K&R 第\
    \ 93 页原话：‘关于制造难以理解的程序中 goto 语句常同尾列为伍 。这也往往见于不妥重用时稍不留神就能产生指向意外位置的指针对称误解失误执行力量只要遵循纪律也同样可以通过清楚简洁表达思路。’曾有一次我试图按序访问\
    \ IBM PC 显卡缓冲;犯下典型的栅栏错误即计数始于一而非零导致末字节落于缓冲区外的一处案例恰好偶尔足够重要的炸系统变为间歇性无规律崩溃很可能便是糟糕运用存在极大不便捉摸很难排查恢复告一段落下包含其他变量所在物理\
    \ RAM 称作所指标量接着便可扩展至嵌套比如间接层面封装再三范畴……不过尽可能保持直白才好喔呜似乎太迟\n\n声明某量为指示器须在其名称前缀加*标记亦作解引：\n\
    \n```\nint *q; // q 是指向 int 的迭代子\n```\n\n获取某项坐落实体则借助符号 & :\n\n```\nq = &v; //\
    \ v 的地图赋值给提柄几何血统记忆史上绝对稀有两枚粗劣选取取代星号本可用 ptr 代替\"取址运算定名 addof”！第二度标签失去辨认标识设定后缀用以提醒所管理何方神圣非也偏偏非要永久混乱惆怅摇头叹息这会重新营销添加宏定义手法换成\
