  trans: "\n\n# 快速入门指南\n\n我们将使用三个免费软件包：来自 sourceforge.net 的 WinAVR 编译器、ATMEL 公司的 AVRStudio4，以及\
    \ Br@y++ 的终端。\n\n## WinAVR——哦，随时可用……\n\nWinAVR 是一套用于对 AVR 微控制器系列进行 C 语言编程的工具。一群志愿者自愿花费时间编写了这款软件，并将其作为自由软件运动（www.sourceforge.net）的一部分免费提供。这些好心人慷慨解囊帮助他人，几乎改变了我对人性的愤世嫉俗看法。你可以花数千美元购买微控制器的\
    \ C 编译器；而在`WinAVR`出现之前，即使是一个蹩脚的编译器也得花上几百美元。这个软件是免费的！但 SourceForge 有运营开支 ，所以请访问\
    \ www.sourceforge.net/donate 给他们捐点钱吧。\n\n在 http://sourceforge.net/projects/winavr/你会看到如下摘要：\n\
    \n> “WinAVR (读音‘ whenever ’)是一套可执行的 、开源开发工具集 ，适用于基于 Windows 平台的 ATMEL RISC 系列产品包含\
    \ GNU CC 编译器等” 。\n\n前往<http ：//winaver,souceforgenet/indexheml >看看他们的主页.\n\n但目前不要被这些东西分散太多注意力-先在这里用着就行\
    \ 。等学完这本书后再充分利用网站资源 。\n###  程序员记事本：\n我们将利用超棒的 `ProgrammersNotepad （proggersnotepad\
    \ ）`来编写我们的程序 –这是另一个由 Source Forge 提供的 FREE 程软 +也包含在 Av WIN 分布包里可以找到它 ..试想一下 Microsf\
    \ 会为这种 free software 收取多少费用 ；做个好小伙子 /姑娘 ,给它们发些 money 到 hp:/pnotepadorhg 那个地址去吧..\n\
    \n**章节 :快开指导***\n\n----\n现在说说其他组件 :\n\n##### **A VR Studio–Free dar 绝对值得拥有.**\n\
    \nAv studio 是由 good folk atmel Corp freebee ;他们似乎明白提供给开发者更多帮得越多賣出的 micyontroller\
    \ 也就越多了~ Actually 这玩意儿实际价格也要数百块却仍然物抵其价……但是除非你真的喜欢挪威风;表寄任何 Monney 过去:当您下次购买成千上万颗挑剔下一个大发明时就会赚回来的!\n\
    \nTh Avstudio 有两个用处 :第一是将你的 S/W 下载至 butterfly 板上其次是运行代码模拟 AT MEGA169(虚拟运转)。\n\n\
    \ --- \n#### Bra+y Ter minal:\n\n原版 quick start 章用的是 HyperTerminal 但那玩意配置繁琐反应迟钝广受论坛用户吐槽.;-联系\
    \ Bray++;他同意我分发他的推荐款易用的 terminal pkgx user 可以在下面获取:\n- htttp://brayvelenjecx /av\
    \ n/\n-Alternate link smilymicrocs com.\n图 7 展示了 Brad's Terminals 的应用文本示例仍显示 Hyper\
    \ 但有支字提及无伤改换即可 );如果确实需要 Hyterm 也可参阅附录 1 .\n\n---\n\n ###搭建您的硬件开发平台 \n\n![RSRC37N](img/image_Rsrc_37_Njpg)\n\
    \n将排母焊接到 ADC PORTB portD 触点区域 --注意到方形焊盘引脚如果你发现有 PORtb D 两处都看似 10pin 但实际上不是(:9\
    \ 脚=GND,10 脚=Vcc?见图 2 示意)...\n\n #### RS232 连接 :\n与 PC 建立通信需要三线 Tx Rx Gnd :: Tx\
    \ = PC 发送数据-> Butterfly,RxD = MCU 接收+PC bus,Ground 共用参考电位关于位相对性说明例如 MCURX 引腳等同\
    \ PCTX 反之亦然无数次犯蠢直接把单片机 Rx 口接 DB 洞-RXD 因为没考虑收发关系啊???\n\n如图 3 中的插画所示示。\n  \n ![图片序列]...\
    \  \n\n--注记 --焊接座子背面的接头引脚映射:::   \n* Pin5 GND      \n* Pin3 TXDT       \n*(cup)\
    \ minus sign \n \n---\n按照 INSERT 示意图小心交叉走线{Rx/TXd} !!不可反转接线否则危险!!\n\n ###构建电源\
    \ ;\n蝴蝶板配的是 CR2450 纽扣电池长亮 LCD 长期 high-power 消耗会导致放电迅速建议拆除内置电池组采用 Jamco 零件列表见 appendix7\
    \ .结下图为外部供电连线颜色编码法定义(VCC 红色引导 ,黑色地上 )正确做法参见 figure48 注意^^所有插图 Port8‑头线的焊接应已预先装好..按规格书要求该端口\
    \ BD 需采用十针杜邦导 Line power 接入;\n\n! 外置电池连接 )FigurE #ExtBatCon\"\n\n"
