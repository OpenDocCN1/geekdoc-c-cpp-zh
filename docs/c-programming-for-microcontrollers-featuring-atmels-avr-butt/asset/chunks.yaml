  trans: "\n\n```c  \n// `mt: int __flash *pSong; //指向闪存中不同歌曲的指针 const int *pSong;`\
    \ // `mt` 指向一个 RAM 位置（指针数组 Songs）\nstatic char Volume = 80;\nstatic char Duration\
    \ = 0;\nstatic char Tone = 0;\nstatic char Tempo;\n\n将 `tunes.h`保存到“Play it again\
    \ Sam”目录。\n\n复制 WinAVR Butterfly 代码移植版本 bf_gcc 目录下的`sounds.h`文件，将其放入“Play it again\
    \ Sam”目录。无需修改——我们直接全盘拿来使用。\n\n按如下方式更改新消息头文件（``messages.h ``）的内容：\n\n```c\n// identify\
    \ yourself specifically\n\nconst char TALKING_TO[] PROGMEM=\"\\rYou are talking\
    \ ...\";\n```\n\n等等——不必困惑，因为下方原文明确给出了应放置在该需修改的头注释中的实际数据？实际上上述理解有误：后续行已清晰定义所有常量，因此请直接继续编写精确的常量定义即可。由于此前无意间重复了两次导语说明？\n\
    \n让我们仔细根据\"*Change...file* \"之后的文本生成唯一正确的单次译文：\n\n---\n\n**所需修正块:**\n\n```\nconst\
    \ char TALKING_TO []PROGMEN =\" \\ r You ar e talkin g t othe   \";\n```\n\n更好的方法是逐字完整地呈现结构合理的集合体、保留原有注释内容并相应地在标识符等处添加反引号……\n\
    \n考虑到复杂性情况,现在允许我严格遵循每条规则为您提供最终格式化输出:\n\n---\n\n##   调整指导总结(下面为实际结果):\n\n-    \
    \   把 tunes\\.h 存入 Play-it-again-Sam 文件夹 \n -      从提供的源代码树中原样拷贝 sounds\\,h  \
    \ \n   _     完全覆写 messages 。 h 的内容 :\n\n以下是替换部分以及重构后的演示 C/头文件和用法示例 ,随后是原附件内 ADC\
    \ 章节节选:\n\n--- \n\n###    从现在开始的实际格式文本 :\n ---\n\n引用 : `/path.to/messages`\n\n\
    彻底删除老内容包括:\n'/*identify yourself specificaly */ ;'\n\n采用以下新版实现最小化错误一致应用,\n\n最后输出严格遵守\
    \ Markdown 语法包括一开始要求的变量／函数包裹形式\n\n\n\n"
- fmt: "\n当我请求读取电压时，硬件对超极终端的响应为：“读数为1.1伏特。”然后立即停止响应，不再与PC通信。我的反应包括大量咒骂以及对又浪费了19.99美元的抱怨，但这次“蝴蝶”板并没有被烧毁——它重启后运行正常，只是在我再次发送`volt`命令时才崩溃。\n\
    \n我最初的猜测（当时认为很合理）是这和室内的光照强度有关。听起来很疯狂？实际上，“光传感器会影响‘蝴蝶’板的电压基准”，因此在测量电压之前必须先测量环境光线来校准这个基准值。于是我遮住光传感器尝试——结果仍然崩溃；接着我又用强光照射它——同样无济于事。\n\
    \n于是我想：如果它对由光照产生的电压如此敏感的话，那么也许USART通讯信号中携带的杂散干扰电平正在到处传播并搞乱系统。“USART使用的供电比主控芯片更高，”而官方原理图中包含一个专用反相电路用于产生负压——“这货看起来就像是辐射杂乱噪声的最佳嫌疑犯……而这些随机波动可能与Vin引脚的某个残留电位发生叠加作用进而引发故障。”\n\
    \n因此修改代码让每次收到字符都向PC端回传感叹号表示心跳：\n```\n![image](image_rsrc3FP.jpg)\n```\n\n在发完指令得到尾号为黑色梅花图样而非原本该有的符号前三个是因为看错了……\n\
    反应过来大概串口波特率已经变了导致接收出错？\n重新查阅相关章节手册对比接线图表试验若干改动后又过了几小时仍没任何进展。\n最后绝望之下把各处逐个切开做隔离二分查找\
    \ —— `//注释主干逐段推进找定位`\n\n我们本来早应该这么干了！\n获得了问题的函数版本如下：\n\n```c\nvoid getVolt(){\n\
    \    char voltintpart[]= {'0','\\0'};\n    char voltfractpart[]= {'0','\\0'};\
    \ \n    int part = 0; \n  \tfractPart=int result %50  \n      i to a(前十即位转换 )...\n\
    }\n```\n\n地区摘掉哪一段都可以正常工作直到最后一层怀疑来到库函数的以上两个字符串变量的声明太小会让字后面紧跟着存储单元覆盖其后的内容！？\n\n\
    解决方法增加数组长度即得美观执行效果最终修正可以是：\n\n```c\nchar invterArray []={'数系多预留'\\... };\n短颂万物\
    \ C不自动确保安全行事指南再三推荐勿踩坑头行稳致远加升级别的抽象保障速度依然胜出编译器中低下级先差定性在场黑客自有道通用语言那些额外checked围着现场只要开启debug时代经典编写可移植嵌入式必定这点酬劳值得The\
    \ End相信多年汗水以后你或赞同这项Tradeoff American Express耐心打磨头部过坎就能更近于快乐庆幸小如砌瓦本已清凉果效何妨书记享受躺椅慢慢获胜心态、测试基础整核拾下一主题\
    \ ///Analog-to-Digital Conversion */\n"
  raw: 'When I requested: volt the hardware responded to HyperTerminal with: The reading
    is 1.1 volts.And promptly died. No further responses to the PC. My response involved
    lots of obscenities and complaints about flushing another $19.99, but the Butterfly
    wasn’t destroyed this time, it rebooted just fine and only crashed when I asked
    for ‘volt’. My first assumption, reasonable I thought, was that it’s the light
    level in the room. Sound crazy? Well, it seems that the light sensor affects the
    Butterfly voltage reference and we have to measure the ambient room light to calibrate
    the voltage reference before we measure volts. So I covered the light sensor and
    the Butterfly still crashed. Then I went the other direction and put a bright
    light on it to no avail. So I thought that if its all that sensitive to light
    derived voltages maybe the USART traffic voltage is propagating about unpredictably
    and screwing things up. The USART uses a higher voltage than the Butterfly and
    they Chapter 9– Digital Meets Analog – ADC and DAC have included a voltage inverter
    circuit that looked like a prime candidate to radiate messy voltages that might
    combine with a voltage on the Voltage In pin and might, theoretically, cause a
    problem. So I changed PC_Comm so that it sent the PC a ‘!’ every time it received
    a character. In HyperTerminal I got:![](image_rsrc3FP.jpg)So after requesting
    ‘volt’ the Butterfly was no longer exclaiming with a ‘!’ but decided it wanted
    to play cards with a black club, or perhaps more reasonably, I thought, the ‘!’
    was being scrambled on reception by the PC because the Baud rate had changed (I’ve
    seen that happen before). So I reread the data sheet on the USART and diddled
    with the Butterfly schematics and tried a few coding changes. Hours passed and
    still no fix. I messed with the USART initialization function, the ADC initialization
    function, the ADC read function, the oscillator calibration function and generally
    had myself a merry old goose chase for about half a day. Nothing fixed the problem,
    but at least the Butterfly didn’t explode nor make the least bit of smoke, the
    code was consistently responding with a black club rather than the ‘!’ but at
    least it was running.Finally, in total desperation, I tried what I should have
    tried in the first place. I bracketed code by commenting out sections (putting
    // in front of a line) to see where exactly the problem occurred. Eventually I
    got to the getVolt function and started commenting out sections. This is a time
    consuming process, each time you comment something out, you have to recompile,
    load, and test the code. It takes a while. So here is the getVolt code:void getVolt(){


    char voltintpart[]= {''''0'',''\0''};


    char voltfractpart[]= {''0'',''\0''}; int


    intpart = 0; int fractpart = 0;


    int ADCresult = 0;ADCresult = ADC_read();


    intpart = ADCresult/50;


    Chapter 9– Digital Meets Analog – ADC and DACfractpart = ADCresult%50; itoa(intpart,
    voltintpart, 10); itoa(fractpart, voltfractpart, 10);// Send the voltage to the
    PC sendString("The reading is ");


    sendChar(voltintpart [0]); sendChar(''.''); sendChar(voltfractpart [0]);sendString("
    volts.\r");


    }I commented out each logical part and still nothing worked. Finally, because
    there was nothing logical to try, I commented out the itoa functions. And the
    Butterfly no longer messed up. Also, it started returning ‘!’ rather than the
    black club for each character I sent it. Of course, it didn’t return the correct
    voltage, because I wasn’t converting it to ASCII, but it was running fine otherwise
    and correctly returned the light and temperature. The itoa function is in the
    standard library, so I assumed that it must have a problem. I changed it to the
    itoa function (and the other support functions) that we wrote at the end of Chapter
    6. Guess what? They also fail! I went for a long walk.Later, after more staring
    at the function I noticed:


    char voltintpart[]= {''''0'',''\0''}; char voltfractpart[]= {''0'',''\0''};These
    can’t be the problem, can they? They work just fine in the original Butterfly
    code. But many years ago I learned the hard way that if you assign memory to an
    array and then foolishly write beyond that memory, say to voltintpart[2], the
    third element of the array which only has two elements you will in fact write
    to the byte in memory that follows the array bytes which may not cause a problem
    if nothing else is using that byte, or it might just change it from the ASCII
    code for an explanation point to the Microsoft extended ASCII code for a black
    club. So I enlarged them to:char voltintpart[]= {''0'',''0'',0'',''\0''}; char
    voltfractpart[]= {''''0'',0'',''0'',''\0''};And the code works just fine. Why,
    you may ask, didn’t the designers of the standard library require the itoa function
    to check the size of the array before using it? Good question. My guess is that
    the standard library functions were written to be as fast and small as possible.
    They also likely assumed nobody would be stupid enough to send it an array that
    was too small, and if they are that dumb, they deserve what they get. C is fast,
    small, and mean. C++ was designed to take out some of the meanness by forcing
    features that protect the programmer from himself, but this was done at the expense
    of size, speed, and simplicity. Other higher-level languages provide even more
    protection and are even larger, slower, and more complex. You almost certainly
    won’t be using C to write programs for windows based programs on a PC where you’ve
    got plenty of hardware speed and memory and high level development tools, but
    for microcontrollers with their limited speed and memory, C probably has the best
    set of tradeoffs. I acknowledge that the arguments for the choice of a programming
    language borders on the religious, so I say that if you choose not to use C, you
    will be eternally damned.Debugging can be a maddeningly frustrating process, especially
    if you are on a deadline. I spent half a day finding this problem. I didn’t make
    my array large enough. HALF A DAY! Am I stupid? No, I’m not. This kind of debugging
    is part and parcel of working with microcontrollers. If you have the wrong attitude,
    you will drive yourself nuts trying to find these bugs. What is the right attitude?
    It is to understand that you have to be really smart, work very hard, and know
    a lot about C programming and microcontrollers to make a mistake this dumb. You
    have to keep telling yourself over and over: “This is better than putting shingles
    on roofs in the summer.” I understand that alcohol also helps as does having an
    obsessivecompulsive disorder. Speaking of which, Let’s move on to the next project.Analog
    to Digital Conversion'
