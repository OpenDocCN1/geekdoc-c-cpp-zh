  raw: 'else if XXX_input happens, then I enter Tennessee_stateFrom the Butterfly
    menu we see that we can do this like:If I am sh owing “AVR Butterfly” on the LCD
    and if the joystick is clicked left, then I enter the Revision state else if the
    joystick is clicked down, then I enter the Time state If I am showing the “Time”
    on the LCD and if the joystick is clicked left, then I enter the Clock stateelse
    if the joystick is clicked down, then I enter the Music state // and so on


    If I am showing “Options” on the LCD andif the joystick is clicked left, then
    I enter the Display state else if the joystick is clicked down, then I enter the
    AVR Butterfly state For each state, we must know the next state that we must enter
    for each possible input state. That’s going to be a lot of data so lets use what
    we’ve learned about structures to keep track of it. First we define two generic
    structures that we will later instantiate for each specific state, input, and
    next state data set.[ASIDE: As mentioned before, the Butterfly software was written
    using an IAR compiler and ported to the Win AVR complier. There are a lot of notes
    in the code that begin // mt. This is a note added by Martin Thomas who did the
    porting. Kudo’s to Martin, but I’ve removed his notes from the discussion as they
    are not relevant to what we are trying to learn here.]In Menu.h we find the definitions
    of data structures for our menu state and menu next state that contains the three
    relevant variables:typedef struct PROGMEM {


    unsigned char state; // the current state


    PGM_P pText; // pointer to some text in FLASH memory


    char (*pFunc)(char input); // pointer to a function }


    MENU_STATE;typedef struct PROGMEM{


    unsigned char state; // the current state


    unsigned char input; / the input stimulus


    unsigned char nextstate; // the resulting next state }


    MENU_NEXTSTATE;The MENU_STATE structure provides the data we need to find the
    function that should be run while in the specified state. The MENU_NEXTSTATE structure
    provides the data we need to find the next state given the present state and an
    input state.Let’s deal with the MENU_STATE structure first. We see that we can
    have 256 states, and can associate a text name and a function pointer with each.
    The function pointer is defined as taking a character input value and returning
    a character to the caller. We define an array of instances of this structure in
    Menu.h as follows:const MENU_STATE menu_state[] PROGMEM = {


    // STATE STATE TEXT STATE_FUNC {ST_AVRBF, MT_AVRBF, NULL},{ST_AVRBF_REV, NULL,
    Revision}, {ST_TIME, MT_TIME, NULL}, {ST_TIME_CLOCK, MT_TIME_CLOCK, NULL},


    // Lots more stuff


    {0, NULL, NULL}, };


    We can use this as:menu_state[1].state is defined as ST_AVRBF_REV menu_state[1].pText
    is defined as NULL


    menu_state[1].pFunc is defined as RevisionYou will note in the table that each
    state has either a state text or a state function defined, but not both, that
    complication will be explained later.For the MENU_NEXTSTATE structure we also
    have 256 possible states, and 256 possible inputs for each state, and 256 possible
    next states for all those, that’s 65536 possible state transitions for each state,
    fortunately we won’t need that many. We define an array of instances of this structure
    in Menu.h as follows:const MENU_NEXTSTATE menu_nextstate[] PROGMEM = { //STATE
    INPUT NEXT STATE {ST_AVRBF, KEY_PLUS, ST_OPTIONS}, {ST_AVRBF, KEY_NEXT, ST_AVRBF_REV},
    {ST_AVRBF, KEY_MINUS, ST_TIME},// Lots more states


    {0, 0, 0} };


    We can use this as:menu_nextstate[1].state menu_nextstate[1].input menu_nextstate[1].nextstate
    is defined as ST_AVRBF_REV is defined as is defined as ST_AVRBFKEY_NEXTWe can
    search this array of structures to find out what we need to do if we are in the
    ST_AVRBF state and the input is KEY_NEXT, we find that particular structure and
    see that the next state is ST_AVRBF_REV. Now all we have to do is find out what
    we need to do if our next state is ST_AVRBF_REV, which we can do by searching
    the menu_state array to find the ST_AVRBF_REV entry. We see that there is a function
    defined for this state, and equate the function pointer to it. Then we can call
    that function.Clear so far?The main() function slorps into an infinite loop, part
    of which, depending on the state, is used to search the menu_state array. The
    following code snippit compares the present state with the next state [if (nextstate
    != state)] and, being very reasonable, does nothing if they are the same. If the
    states differ, main() sets the global state variable to the nextstate variable
    and then accesses the menu_state structure array to change the current state to
    the next state.:if (nextstate != state)


    {


    state = nextstate;


    for (i=0;pgm_read_byte(&menu_state[i].state); i++)


    {


    if (pgm_read_byte(&menu_state[i].state) == state)


    {statetext =(PGM_P)pgm_read_word(&menu_state[i].pText); pStateFunc = (PGM_VOID_P)pgm_read_word(&menu_state[i].pFunc);
    break; }}


    }Since we took ST_AVRBF_REV to be the next state, so searching the array causes
    the snippet to make the function pointer, pStateFunc, point to the Revision function.Whoa,
    there I was clicking right along and suddenly, I lost it; maybe its time to review
    what I’ve said so far?• We have two data structures, one for storing the text
    and function associated with a state and one for finding the next state given
    the current state and the input.


    • We have two structure arrays, one for each of the structures, which define all
    the states and transitions.


    • We have code for searching each of these arrays. One finds the function associated
    with a given state and the other finds the next state to use given the current
    state and the inputs.Now how should we use this? We could sit in an infinite loop
    checking the inputs and then looking at the current state and seeing if a transition
    to a new state is called for. Hey, sounds like a plan. We could write our main()
    function as follows, hopefully commented to crystal clarity:unsigned char state;
    // holds the current state, according to “menu.h”


    int main(void)


    {// Define our local copies of the state variables unsigned char nextstate;


    PGM_P statetext; char


    (*pStateFunc)(char); char


    input;// Define a loop counter uint8_t i; // char i;// Initial state variables
    state = nextstate = ST_AVRBF; statetext = MT_AVRBF;


    pStateFunc = NULL;for (;;) // Main loop {


    // read the joystick buttons input = getkey();


    if (pStateFunc) // If a state function is pointed to {// When a state function
    is pointed to, we must call it // and get the results as the nextstate variable
    nextstate = pStateFunc(input);}


    else if (input != KEY_NULL) // If not, and input not NULL {// We call the StateMachine
    function to examine the // MENU_NEXTSTATE array to find the nextstate nextstate
    = StateMachine(state, input);


    }// Now we know what the next state is


    if (nextstate != state) // Do only if the state has changed {state = nextstate;
    // The state changed, so reset it for (i=0; pgm_read_byte(&menu_state[i].state);
    i++) {// Read the MENU_STATE array until we find the entry // matching the current
    state// If we find the entry


    if (pgm_read_byte(&menu_state[i].state) == state) {// We load the state variables
    from that entry statetext =(PGM_P)pgm_read_word(&menu_state[i].pText); pStateFunc=(PGM_VOID_P)pgm_read_word(&menu_state[i].pFunc);//
    And we exit the loop


    break;


    }


    // If we found an entry for the pStateFunc, we now loopback


    // to the top were we run it. }


    }


    } //End Main loop


    return 0; }Of course, the actual Butterfly main() function does a lot of other
    stuff, but this should help you understand the menu state machine part.'
