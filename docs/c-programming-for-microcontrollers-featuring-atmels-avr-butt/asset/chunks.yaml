  raw: 'to confuse is why C gurus love pointers and will go to incredible lengths
    to obfuscate their code with them.Pointers are the reason that many refer to C
    as a mid-level rather than a high level programming language. In high level languages
    the programmer only deals with data and the compiler makes all the decisions about
    the addresses. In low-level languages, like assemblers, the programmer assigns
    the addresses to the data. In C, we are not required to play with addresses, but
    are allowed to if we want to. And, dangerous as they are, some things can only
    be done using pointers. Pointers also allow us to do many things more efficiently
    and cleverly than would otherwise be the case.There are many reasons to use pointers,
    as a simple example consider writing a function that will do something with data
    from a sequence of contiguous locations in memory. Say you have a string: “Say
    you have a string:” 22 characters followed by a null character ‘\0’ all contiguous
    following the first memory location, an address that we will give the alias of
    MemStart. We know that ‘S’ is located at MemStart and MemStart + 1 stores ‘a’,
    and so on to MemStart + 23 which stores ‘\0’. If we want our function to handle
    this sequence, we could send all 23 bytes as parameters to the function, meaning
    that they would all be pushed on the stack before the function call and pulled
    off by the function. But we know that we need to go light on the stack in microcontrollers,
    so we would like to us a different method. Easy, just send the variable MemStart
    as the parameter and have the function start looking there and increment sequentially
    through memory until it sees ‘\0’ which we will agree always ends this kind of
    sequence (like for example, a string which is defined to end with ‘\0’). Now instead
    of using 23 parameters and pushing 23 bytes on the stack we only have to use one
    parameter and push only two bytes (addresses are ints, which as you may remember
    are two bytes long).Sounds simple, and it is once you get the hang of it, but
    unfortunately many novice programmers use pointers in much the same way a toddler
    would use an AK-47\. To paraphrase the oftstated defense of guns, ‘pointers don’t
    kill programs, programmers kill programs.’To quote K&R, p 93: “Pointers have been
    lumped with the goto statement as a marvelous way to create impossible-to-understand
    programs. This is certainly true when they are used carelessly, and it is easy
    to create pointers that point somewhere unexpected. With discipline, however,
    pointers can also be used to achieve clarity and simplicity.”I once used a pointer
    to sequentially access the video buffer of an IBM PC. I made a simple ‘fence-post’
    error, that is, I started a count with 1 instead of 0, and wrote the last data
    byte to an address that was one byte outside of the video buffer. That byte was
    only occasionally important enough to crash the system. When your computer crashes
    intermittently with no apparent rhyme or reason, you may well be suffering from
    a bad pointer use. It can be a damn hard bug to find.To recap: variables (RAM
    stored data) that contain the address of other variables are called pointers.
    You can have pointers to data, pointers to pointers, pointers to pointers to pointers
    to... but let’s try to keep it as simple and clear as possible (whoops… too late).We
    declare a variable to be a pointer by preceding its name with an *, called the
    indirection or dereferencing operator:


    int *q; // q is a pointer to an int


    We get the address of a variable using &, called the address operator:


    q = &v; // put the address of v in the pointer qNever in that annals of mnemonics
    have two worse choices been made for symbols. Instead of *, the letters ‘ptr’
    could have been chosen for pointer, and for &, the letters ‘addof’. There is no
    indicator in the second use of the variable name ‘q’ that it is a pointer, but
    the compiler could have been written to require that some suffix follow the pointer
    everywhere, thus helping us know what we are dealing with. But NOOOO…. * and &
    were chosen, and confusion reigns eternal. We could fix this problem by adding
    a couple of defines to alias the * and & as ptr and addof, and we could require
    that we always name pointers in such a way that we always know it is a pointer,
    but since our goal is to learn C as Ritchie and ANSI intended and not my version
    of C,we’ll do it the hard way. What? you don’t think it will be hard to remember
    what the * and & do? Wait till you run into things like:char (*(*x())[])()which
    is on p. 126 of K&R and translates to: ‘x is a function returning a pointer to
    an array of pointers to functions returning char.’ Yes, they are serious, and
    I have encountered much worse. Be very afraid.Let’s look at some examples:


    int x = 10, y = 20, z[30];


    int * iptrFred; // iptrFred is a pointer to an intiptrFred = &x; //iptrFred now
    contains the address of the variable x y = *iptrFred; // y is now equal 10;


    *iptrFred = 0; // x is now equal 0


    iptrFred = &z[0]; //iptrFred now points to the first element in array zPay careful
    attention to the presence or absence of the indirection operator as it dereferences
    and wonder why on earth they chose both ‘indirection’ and ‘dereference’ as the
    names of the operator, when one weird word would have been plenty?More examples:*iptrFred
    = *iptrFred + 10; // adds 10 to the content of z[0] *iptrFred += 10; // same as
    above


    y = *ptrFred + 20; // sets y equal to the content of z[0] + 20 ++*iptrFred; //
    increments the content of z[0]


    (*iptrFred)++; // after using the content of z[0] increment it to z[1] *iptrFred++;
    // iptrFred now points to z[1]The last two may have caused you to go ‘say what?’
    It has to do with operator precedence. Now is a good time to thank the stars that
    this is a self-teaching book and I can’t test you on this stuff.Function ArgumentsArguments
    are passed to functions by value, and as we saw in an earlier discussion of functions,
    there is no way for a function to affect the value the variable passed to it in
    the function that did the passing. Okay, Let’s show an example:void func1(){


    char olay = ‘m’; func2(olay); …}


    void func2(char olay) {…


    olay++; …}After olay is incremented in func2 it is equal ‘n’, but this change
    has no effect on olay in func1\. The name ‘olay’ in both functions is pure coincidence.
    We could have func2:void func2(char yalo) {…


    yalo++; …}


    and accomplished the same task.


    But Let’s define:


    void func2(char *)


    Then use it


    void func1()


    {


    char olay = ‘m’;


    …


    func2(&olay); // give func2 the address of the variable olay …


    }


    void func2(char *yalo) *yalo++; // the variable at address *yalo is incremented
    …


    }


    This time func2 increments olay in func1 and olay becomes ‘n’ in both.


    Arrays


    Arrays are groups of consecutive objects. We could write a code fragment for responding
    to a ‘?’ by sending each character of ‘Hello World!’ as follows:if (val==''?'')
    {


    sendchar(''H''); sendchar(''e''); sendchar(''l''); sendchar(''l''); sendchar(''o'');
    sendchar('' ''); sendchar(''w'');


    sendchar(''o'');


    sendchar(''r''); sendchar(''l'');


    sendchar(''d'');


    sendchar(''!''); sendchar(''\r'');


    }Looks like a group of consecutive objects to me. Formally, we would define and
    initialize an array for this in C as:


    char greet[] = "Hello, world!\r*";


    And write a function that scans the array sending chars until it finds the ‘*’


    void SayHowdy() {


    char greet[] = "Hello, world!\r*";


    for(int i =0 ; greet[i] != ''*''; i++) sendchar(greet[i]); }


    }Pointers and arrays have a strong relation in C. Any array-subscripting operation
    can also be done with pointers. Pointers are said to be faster than arrays, but
    they are much harder to understand for novice programmers (and those of us with
    rapidly diminishing brain cells). Since speed is an issue in microcontrollers,
    and pointers are faster we need to learn how pointers and arrays relate and apply
    it in code segments that must be made to run faster. Let’s look at some examples.char
    howdy[6];'
