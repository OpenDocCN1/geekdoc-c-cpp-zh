  raw: '// Do more stuff }You’ll find recursion used quite appropriately in some standard
    library functions and in many data sorting applications. But recursion can be
    very problematic in microcontrollers where we are usually limited in RAM memory.
    Each time you call a function some data is put on the stack using RAM that isn’t
    released until the function returns. Each function you call within a function
    puts more data on the stack locking up more RAM. Recursive functions look like
    a good way quickly and unpredictably fill the stack leading to the often-fatal
    condition known as blowing your stack. Your stack usually starts at the end of
    RAM and builds downward. Your variables usually start at the beginning of RAM
    and build upward. So putting too much on the stack may push it down far enough
    overwrite variables. That may kill your code immediately or only occasionally,
    like at the worse possible moment. Maybe I’m just not smart enough, but I’ve never
    written a recursive function for a microcontroller and I don’t plan on it. For
    the same reason, I also try not to nest function calls too deep.Preprocessor


    The preprocessor runs before the compiler as a separate first step.#include


    We have already discussed a little about #include but now would be a good time
    to mention how to use them to prevent name conflicts. We saw in the discussion
    on ‘extern’ that it is possible to forget that you have declared a variable name
    as an extern in one file then define a variable using a name in another file causing
    potential fun results, that is if you consider it fun to stay up all night to
    find a stupid bug. One way to lessen the likelihood of such is to keep a single
    header file for all the C source files in a program. For instance, if we decide
    to build a Killer Cylon Robot, we might want to write different C sources files
    for the various components we need:CylonEyes.c CylonLegs.c


    CylonArms.c


    CylonBlaster.c


    CylonEnemyDiscriminator.c


    and so forth…We could create a header file CylonKillerRobot.h, include it in each
    of the project files and use it for all of our variable and function declarations.
    By putting all the definitions in this file we lessen the likelihood of creating
    a name conflict that causes the code in CylonEnemyDiscriminator.c to substititute
    ‘theProgrammer’ for ‘theEnemy’ leading to the programmer learning that bugs yield
    extreme boinking.#define


    The #define directive tells the preprocessor to substitute a specified arbitrary
    sequence of characters anywhere it sees a specific token:#define token arb1 arb2
    arb3


    Which causes the complier to substitute ‘arb1 arb2 arb2’ everywhere it sees ‘token’.


    One possible source of problems occurs when you reuse a token. You might write:


    #define Up 0


    And come back a month later, when your header file has 500 lines and forget that
    you have already defined Up and add:


    #define Up 1The preprocessor uses the last #define and you won’t get any warnings,
    other than this one. But you probably will get some mysterious bugs that you’ll
    blame on the hardware until much later you finally see what you’ve done and apply
    a welldeserved boink to your own head.Macro Substitution


    We can use #define to make a simple token that replaces a complex, or frequently
    used expression. For example we may want to determine the larger of two variables:#define
    larger( x, y) ( (x)>(y) ? (x) : (y) )


    Which we would use as:int a= 9; int b = 7;


    int c = 0;c = larger( a, b);


    The preprocessor replaces the last statement with:


    c = ( (a)>(b) ? (a) : (b) );


    Which is what the compiler sees.The expression larger( a, b) looks like a function
    but isn’t. A macro is substituted in the code anywhere that it is used, while
    a function is located in only one place and is called each time it is used. The
    big difference from a microcontroller perspective is that nothing is pushed on
    the stack when a macro is used, unlike functions, which use extra RAM. Also macros
    create in-line code that can be faster than function calls (no processor overhead).
    And finally, macros don’t require formally declared data types:double da = 12;
    double db = 14; double dc = 7; double dd = 0;dd = larger( (db-da), dc);


    If larger() was a function, the parameters require a data type such as int or
    double, but couldn’t use both (okay, there is casting, but that’s another topic).


    Conditional InclusionOften microcontrollers come in families that differ only
    in a few features, pinouts, memory size, and register locations. You can write
    C code for the entire family if you substitute alias for the things that differ.
    Let’s say that SuprMic16 uses pins 12 and 13 for USART transmit and receive, while
    SuprMic8 uses pins 6 and 14, and SuprMic4 uses pins 1 and 2\. We put the following
    in our SuprMic.h file:#if SuprMicX == 16


    # define TXD 12


    # define RXD 13


    #elif SuprMicX == 8 #


    define TXD 6


    # define RXD 14


    #elif SuprMicX = 4


    # define TXD 1


    # define RXD 2


    #else


    # error “No definition for SuprMicX TXD and RXD pins."


    #endifIf we are using the SuprMic8 in our Killer Cylon Robot project we should
    put the following in our CylonKillerRobot.h file:


    The ifndef means ‘if not defined’ so that the preprocessor will use the #define
    SuprMicX = 8 and #include <SuprMic.h> lines only the first time it sees the #ifndef
    SuprMicX line. This prevents the preprocessor from attaching the contents of SuprMic.h
    in each file that uses CylonKillerRobot.h#ifndef SuprMicX


    # define SuprMicX = 8 # include <SuprMic.h>#endifAs a matter of standard practice,
    always begin a header file with an #ifndef statement and a #define so that the
    preprocessor will only use that header’s data once in a project. If you put the
    header data in more than once you may get a lot of compiler errors about multiple
    declarations.Projects Is anybody out there? Communicating with a PCMost microcontrollers
    are buried deep in some device where they run in merry isolation from the rest
    of the world. Their programs are burned into them and never change. But there
    are many instances when we might want to communicate with a microcontroller. The
    Butterfly uses a joystick and an LCD, which is fine for its built-in applications.
    For anything more complex, like changing the microcontroller software, nothing
    beats using the PC’s RS232 serial communications port to communicate with the
    microcontroller through its Universal Synchronous Asynchronous Receiver Transmitter,
    USART, peripheral. The microcontroller and the PC must agree on the transmission
    speed in data bits per second, Baud rate, the number of bits per data unit, Data
    Bits, the parity of the data, Parity, the number of stop bits, Stop Bits, and
    Flow Control. (Refer to Constructing Your Development System section of Chapter
    2 for the required settings) All this information is somewhat arcane and is legacy
    from even before Teletype machines. Fortunately the USART takes care of most of
    this stuff for you, so you don’t need to understand it. If you are really interested,
    get Jan Axelson’s Serial Port Complete (www.lvr.com ).What we need is a method
    to send commands and data from the PC and receive responses from the Butterfly.
    In this section we will develop a generic command interpreter skeleton that we
    will reuse in later programs. In this project we will use this skeleton to build
    a demonstration that let’s the PC send a command name and a number to the Butterfly.
    The Butterfly will respond with text.We will put this software in four files:
    PC_Comm.h


    PC_Comm.c


    Demonstrator.h


    Demonstrator.CThe PC_Comm files have many things in them that are well beyond
    our C training at this point, so just copy them and don’t think too hard about
    it yet. We will revisit each function later as we increase our knowledge. You
    should have no trouble understanding anything in the Demonstrator files. If you
    do, review. In future projects we will only need to make changes to Demonstrator.h
    and Demonstrator.c.Demonstrator


