  raw: '3\. Let the timer automatically change the level of output pins.The clock
    of the Timer/Counters uses a prescaler connected to a multiplexer The prescaler
    is used to divide the input clock and the multiplexer selects which of the divided
    signals is used as the input clock. The clock source for the prescaler can be
    an external clock such as the 32.768 kHz crystal or it can use the system clock.Calibrating
    the Butterfly oscillator:We first used the OSCCAL_calibration() function in the
    PC_Comm project, claiming that we would explain it later. Well, it’s later and,
    wow, it’s time to understand how it works.


    If you try to tell time with the uncalibrated oscillator built into the ATmega169,
    you can expect to gain or lose a couple of hours a day. These oscillators produce
    very precise pulse trains, but due to manufacturing variables, the pulse timing
    varies from chip to chip and do not correlate to ‘real’ time. Real time is determined
    by the National Bureau of Standards and references an atomic clock. To calibrate
    the builtin oscillator to real time requires an external crystal that has been
    precisely trimmed to pulse in time with the NBS clock. The Butterfly uses an external
    32.768 kHz watch crystal to calibrate the oscillator to run at 8 MHz. Watch crystals
    are accurate, cheap, and make keeping human time easy (‘easy’ being another relative
    term).We can get an accurate count of a time period by counting pulses from the
    watch crystal. For instance if we count 32768 pulses we know that one second has
    passed. We use a shorter known good period to calibrate the internal oscillator
    by setting the oscillator to generate x pulses in the known good time period.
    Remember that the oscillator is running at about 8 MHz, so we are going to get
    a lot more counts from it than we will get from the watch crystal. If we count
    32768 pulses from the watch crystal and 8 million pulses from the oscillator in
    the same period, we know the 8 MHz is accurate. That is, we get 8 million counts
    from the oscillator in the same period we get 32768 counts (one second) from the
    crystal meaning the oscillator is running at exactly 8 million pulses per second.
    But we will actually use a much shorter period and have smaller counts. If the
    oscillator count is too small for the period we change the value in a register
    to speed it up, and if it is too large we change the register to slow it down.
    We do this in a loop to keep bracketing the speed until it gets as accurate as
    we can make it. Sounds easy, but as you’ll quickly see, it is a real pain just
    to get the registers all set up properly.In this section we will learn how the
    Butterfly oscillator is calibrated. This is presented in two sections, the first
    shows the OSCCAL_calibration function, and the second gives a detailed explanation.OSCCAL_calibration()
    function– the code:/*******************************************************************
    *


    * Function name : OSCCAL_calibration


    *


    * Returns : None


    ** Parameters : None


    ** Purpose : Calibrate the internal OSCCAL byte, using the external


    * 32,768 kHz crystal as reference*


    *******************************************************************/ void OSCCAL_calibration(void)


    {unsigned char calibrate = FALSE;


    int temp;


    unsigned char tempL;


    CLKPR = (1<<CLKPCE); // set Clock Prescaler Change Enable // set prescaler = 8,
    Inter RC 8Mhz / 8 = 1Mhz


    CLKPR = (1<<CLKPS1) | (1<<CLKPS0);TIMSK2 = 0; //disable OCIE2A and TOIE2


    ASSR = (1<<AS2); //select asynchronous operation of timer2 (32,768kHz)OCR2A =
    200;


    TIMSK0 = 0;


    TCCR1B = (1<<CS10); TCCR2A = (1<<CS20); // set timer2 compare value


    // delete any interrupt sources // start timer1 with no prescaling // start timer2
    with no prescaling//wait for TCN2UB and TCR2UB to clear while((ASSR & 0x01) |
    (ASSR & 0x04));


    Delay(1000); // wait for external crystal to stabilise


    while(!calibrate) {


    cli(); // mt __disable_interrupt(); // disable global interruptTIFR1 = 0xFF; TIFR2
    = 0xFF; // delete TIFR1 flags // delete TIFR2 flagsTCNT1H = 0; // clear timer1
    counter TCNT1L = 0;


    TCNT2 = 0; // clear timer2 counter// wait for timer2 compareflag while ( !(TIFR2
    && (1<<OCF2A)) );


    TCCR1B = 0; // stop timer1sei(); // __enable_interrupt(); // enable global interrupt
    if ( (TIFR1 && (1<<TOV1)) ) {temp = 0xFFFF; // if timer1 overflows, set the temp
    to 0xFFFF}


    else


    { // read out the timer1 counter value tempL = TCNT1L;


    temp = TCNT1H; temp


    = (temp << 8); temp


    += tempL;


    }


    if (temp > 6250)


    {


    OSCCAL--; //RC oscillator runs to fast, decrease OSCCAL


    }


    else if (temp < 6120)


    {


    OSCCAL++;//RC oscillator runs to slow, increase OSCCAL


    }


    else


    calibrate = TRUE; // the interRC is correctTCCR1B = (1<<CS10); // start timer1
    }


    }


    OSCCAL_calibration() function– detailed explanationThe ‘System Clock and Clock
    Options’ section of the ATmega169 data book tells more than you’ll ever want to
    know about the ATmega169''s clock. Let’s focus on only what we need for our system.The
    Clock Prescale Register, CLKPR, is discussed beginning on page 30 of the data
    book. Bit 7 of CLKPR is the prescaler enable bit, CLKPCE (an alias for bit 7),
    so the statement:CLKPR = (1<<CLKPCE);enables the Clock Prescaler Change. The Clock
    Prescaler Select Bits CLKPS0, CLKPS1, CLKPS2, and CLKPS3 are alias for the lower
    4 bits of CLKPR and are used to select a clock division factor. Since registers
    are preset to 0, we OR CLKPS1 and CLKPS0 as 1 and get 0011 which provides a clock
    division factor of 8, this divides the 8 MHz oscillator by 8 giving a 1 MHz clock:CLKPR
    = (1<<CLKPS1) | (1<<CLKPS0);The Timer/Counter2 Interrupt Mask Register, TIMSK2,
    is set to 0 to disable the OCIE2A, output compare, and TOIE2, overflow enable,
    interrupts (p 141 data book if you want the gory details).TIMSK2 = 0;We must set
    the Asynchronous Timer/Counter2, AS2, bit 3 of the Asynchronous State Register,
    ASSR, to allow an external clock connected to the Timer Oscillator, TOSC1, pin
    24 of the microcontroller to be used to for asynchronous operation of timer2 (32,768kHz):ASSR
    = (1<<AS2);


    The Output Compare Register A, OCR2A, contains a value, 200, that will be continuously
    compared with the Timer Count 2, TCNT2, register


    OCR2A = 200;


    The Timer/Counter0 Interrupt Mask Register, TIMSK0, is set to 0 to delete any
    interrupt sources (p 93 data book).


    TIMSK0 = 0;The Timer/Counter1 Control Register B, TCCR1B and the Timer/Counter2
    Control Register A, TCCR2A, are set to start timer1 and timer2 with no prescaling:


    After setting all these registers we wait for the TCNT2 and the TCRU2B registers
    to be set from temporary memory, by waiting for the Timer/Counter2 Update Busy,
    TCN2UB, and the Timer/Counter2 Update Register Busy,TCCR2A, bits of the ASSR register
    to be cleared (p 139 data book).TCCR1B = (1<<CS10); TCCR2A = (1<<CS20); while((ASSR
    & 0x01) | (ASSR & 0x04));


    Wait a while for the crystal to stabilize:


    Delay(1000);


    ALL THIS AND WE HAVEN’T EVEN STARTED CALIBRATING YET!


    Getting registers set properly to do much of anything in a microcontroller can
    be a long and frustrating exercise, and another good reason to steal code where
    possible.We start calibrating by running a loop in which you make adjustments
    to the internal oscillator and comparing the results to the external clock, looping
    until you get it right.Set a flag:


    unsigned char calibrate = FALSE;


    to terminate the loop when true:


    while(!calibrate)


    On each pass you do the following: Disable global interrupts:


    cli();


    Clear the timer interrupt flags: TIFR1 = 0xFF; TIFR2 = 0xFF;


    Clear the timer counts:TCNT1H = 0; TCNT1L = 0; TCNT2 = 0;Wait for the timer to
    reach the count


    while ( !(TIFR2 && (1<<OCF2A)) );


    Stop the timer:


    TCCR1B = 0;


    Enable global interrupts


    sei();


    Has Timer/Counter1 overflowed? If so set our temp variable to 0xFFFF.if ( (TIFR1
    && (1<<TOV1)) )


    {


    temp = 0xFFFF;//if timer1 overflows, set the temp to 0xFFFF }Otherwise read the
    timer1 counter value into the temp variable


    else{


    tempL = TCNT1L;


    temp = TCNT1H; temp


    = (temp << 8); temp


    += tempL;'
