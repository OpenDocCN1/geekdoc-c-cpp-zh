    ![](image_rsrc3NN.jpg) ![](image_rsrc3NP.jpg)Your skills as a C programmer should
    be to the point where you can read and understand all the software for this project
    without further comment. So I’ll just give you the listing and let you have at
    it.// Demonstrator.h Function Generator / Digital Oscilloscope versionvoid initializer(void);


    void parseInput(char *);


    void showMessage(char);int parse_ctc(char *);


    void set_ctc(int);void startWave(int); void


    startSine(void); void


    startSquare(void); void


    startSawtooth(void); void


    startTriangle(void);void DigitalOscilloscopeTimerInit(void);


    void MilliSec_init(unsigned char count);


    void set_OCR0A(unsigned char count);


    void ADC_init(void);


    int ADC_read(void);


    // Demonstrator.c Function Generator / Digital Oscilloscope version#include "PC_Comm.h"
    #include "Messages.h" #include "WaveTables.h"unsigned char count = 0; unsigned
    char tenth = 0;


    //unsigned long signal = 0; // used for testvoid initializer() {


    // Calibrate the oscillator: OSCCAL_calibration();


    // Initialize the USART USARTinit();


    // set PORTD for output DDRD = 0xFF;


    // Display instructions on PC sendFString(TALKING_TO); sendFString(WHO_DEMO);


    sendFString(ENTER); sendFString(TEXT_CTC);sendFString(ENTER); sendFString(TEXT_SINE);
    sendFString(TO_START); sendFString(TEXT_SINE);


    sendFString(WAVE);sendFString(ENTER); sendFString(TEXT_SQUARE); sendFString(TO_START);
    sendFString(TEXT_SQUARE);


    sendFString(WAVE);sendFString(ENTER); sendFString(TEXT_SAWTOOTH); sendFString(TO_START);
    sendFString(TEXT_SAWTOOTH);


    sendFString(WAVE);sendFString(ENTER); sendFString(TEXT_TRIANGLE); sendFString(TO_START);
    sendFString(TEXT_TRIANGLE);


    sendFString(WAVE);MilliSec_init(250); // default to 1000 Hz


    DigitalOscilloscopeTimerInit();


    ADC_init();startSine(); }


    void parseInput(char s[]) {// parse first character switch (s[0])


    { case


    ''s'':


    if( (s[1] == ''i'') && (s[2] == ''n'')&& (s[3] == ''e''))


    startSine();


    else if((s[1]==''q'')&&(s[2]==''u'')&&(s[3]==''a'')&&(s[4]==''r'')&&(s[5]==''e''))
    startSquare();


    else if((s[1]==''a'')&&(s[2]==''w''&&(s[3]==''t'')&&(s[4]==''o'')&&(s[5]==''o'')
    &&(s[6]==''t'')&&(s[7]==''h''))


    startSawtooth();


    break; case''t'':


    if((s[1]==''r'')&&(s[2]==''i'')&&(s[3]==''a'')&&(s[4]==''n'')&&(s[5]==''g'')&&(s[6]=
    =''l'')&&(s[7]==''e''))


    startTriangle();


    break;


    case ''c'':


    if( (s[1] == ''t'') && (s[2] == ''c''))


    parse_ctc(s); break; case ''d'': if( (s[1] == ''e'') && (s[2] == ''m'') && (s[3]
    == ''o'') && (s[4] == ''?'') ) sendFString(TALKING_TO);


    sendFString(WHO_DEMO);


    break;


    default:


    sendFString(BAD_COMMAND1); sendChar(s[0]);


    sendFString(BAD_COMMAND2);break; }


    s[0] = ''\0'';}


    int parse_ctc(char s[]) {char ctc[11];


    unsigned char i = 3, j = 0;


    while( (s[i] != ''\0'') && (j <= 11) ) {


    if( (s[i] >= ''0'') && (s[i] <= ''9'') ){


    ctc[j++] = s[i++];


    }


    else


    {


    sendFString(ERROR_NONINT); sendChar(s[i]);


    sendChar(''\r'');


    ctc[j] = ''\0'';return 0; }


    }if(j>4)// must be < 256 {


    sendFString(ERROR_NUMTOLARGE); return 0;


    }


    else


    {


    set_ctc(atoi(ctc));


    }return 1;


    }


    void set_ctc(int count) {char ctc[11];sendString("Setting the Compare Timer Count
    to: "); itoa(count,ctc,10); sendString(ctc);


    sendChar(''\r'');MilliSec_init(count);}


    void startWave(int wave) {sendFString(TEXT_SETTING);


    sendFString(TEXT_WAVE_TBL[wave]); // Send the song title to the PC sendChar(''\r'');pWave=(int*)pgm_read_word(&Waves[wave]);
    // looks too complicated..


    }


    void startSine()


    {startWave(0); }


    void startSquare() {startWave(1); }


    void startSawtooth() {startWave(2); }


    void startTriangle() {startWave(3); }/* The USART init set the system oscillator
    to 2 mHz. We set the Timer0 prescaler to clk/8 which gives a 250 kHz input to
    the timer/counter. A compare of 250 throws an interrupt every millisecond.


    */


    void MilliSec_init(unsigned char count)


    {// Initialize Timer0.


    // Enable timer0 compare interrupt TIMSK0 = (1<<OCIE0A);


    // Sets the compare value set_OCR0A(count);


    // Set Clear on Timer Compare (CTC) mode,


    TCCR0A = (1<<WGM01)|(0<<WGM00)|(1<<CS02)|(0<<CS01)|(0<<CS00);


    }// Initialize for 1 millisecond interrupt void DigitalOscilloscopeTimerInit()
    { // Initialize Timer2.// Enable timer2 compare interrupt TIMSK2 = (1<<OCIE2A);


    // Sets the compare value OCR2A = 1;


    // Set Clear on Timer Compare (CTC) mode,


    TCCR2A = (1<<WGM21)|(0<<WGM20)|(1<<CS22)|(0<<CS21)| (0<<CS20);


    }void set_OCR0A(unsigned char count) {


    // Sets the compare value OCR0A = count;


    }// Interrupt occurs once per millisecond


    SIGNAL(SIG_OUTPUT_COMPARE0)


