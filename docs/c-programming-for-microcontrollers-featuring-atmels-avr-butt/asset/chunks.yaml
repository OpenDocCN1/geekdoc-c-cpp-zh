    \ char (*(*x())[])() —— KNR 抄录 126 翻出精准诠释 x 返回一阵列每单元皆为 pointer 到 monotype awe\
    \ 确认极其严重而且还屡次碰见恶化情形彷佛将要失控……\n\n现在抱持敬畏观测以下实例说明:\n\n```\nint x=10,y=20,z[30];\n\
