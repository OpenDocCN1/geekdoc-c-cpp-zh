    5You sent: ''5'' - I don''t understand.Let me add a postscript to this by saying
    again that this memory use is not about C, it is about the AVR microcontroller
    and how to conserve limited RAM by using Flash ROM. It is important to keep C
    and the microcontroller specific ‘fixes’ separate in your head, because what we
    just learned works great on the AVR using the WinAVR compiler, but won’t work
    using other compilers for the AVR, and is completely useless for other microcontrollers.Does
    anybody know what time it is? A Real Time Clock.Let’s combine our knowl edge of
    interrupts with what we learned in the messenger project to make a simple real
    time clock. This was derived from the more capable clock in the Butterfly software.A
    one second interruptWe saw how to use the 32.768kHz watch crystal to calibrate
    the cpu clock oscillator in the chapter on timers and interrupts. While that calibration
    makes the oscillator accurate enough for communicating with the PC via the USART,
    it isn’t accurate enough to keep real time like a watch. We will use Timer/counter2
    with the watch crystal as an input so that when the count reaches 32768, we will
    know that onesecond has passed and can throw an interrupt allowing us to do something
    at exact one second intervals. Notice that 32768 is 0x8000 in hexadecimal and
    1000000000000000 in binary, this is no accident since the crystals were designed
    to allow digital systems to keep real time (well, ‘real’ to humans anyway). The
    low speed (kilohertz verus mega or giga hertz) and precision timing allowed watches
