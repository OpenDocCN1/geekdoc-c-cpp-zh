  raw: 'Pulse Width Modulation– LED Brightness ControlWhen we continuously turn a
    port pin on and off at equal intervals, we get a pulse train like the system clock.
    The pulse frequency is the number of pulses we generate in one second, usually
    referred to as Hz pronounced ‘hurts’ named after the Hertz rental car company.
    Okay, I lied; it is actually named for… hey, you can Google this as easily as
    I can.For an equal interval pulse train the pin is high half the time and low
    half the time. This is called a 50% duty cycle (Figure 17). We can vary the duty
    cycle from 0%, always off, to 100%, always on, or anything in between.We have
    set up our LEDs so that the Port D pins source +3v to turn them on. When the pin
    is set to low, 0 volts, no current flows so the LEDs are off. The current flows
    the pin is set to low, 0 volts, no current flows so the LEDs are off. The current
    flows ohm resistors providing 9 mA of current and a power of .027 watts. That’s
    not much power for light bulbs, but enough for LEDs. In the precision blinking
    project we were only giving the LED power half the time. The on/off time doubles
    for each LED, but they are all on for only half the time, so they are using only
    .027/2 = 0.0135watts. By cutting the on time in half, we get a 25% duty cycle
    and 0.0135/2 = 0.00675 watts, less power and less light output. Hey, I think I
    see a way to control the LED brightness. If we keep the frequency of pulses constant,
    but lower or raise the on time it is on, we can control the power to the LED and
    the light output from it.50% Duty Cycle


    ![](image_rsrc3BJ.jpg) 7 % Duty Cycle


    ![](image_rsrc3BK.jpg) ![](image_rsrc3BM.jpg) ![](image_rsrc3BN.jpg) ![](image_rsrc3BP.jpg)
    25% Duty Cycle


    ![](image_rsrc3BR.jpg) ![](image_rsrc3BS.jpg) ![](image_rsrc3BT.jpg) ![](image_rsrc3BU.jpg)
    Figure 17: Pulse Width Modulation Duty Cycle


    ![](image_rsrc3BV.jpg)We have already seen that the human eye perceives fast blinking
    LEDs as being constantly on. Our eyes also see rapidly pulsed light as having
    brightness somewhere between the peak and the average. This means that a high
    intensity pulse with a low duty cycle pulse looks brighter than it would powered
    by a direct current providing the same power as the average of the pulsed signal.
    Our perceptual peculiarity gives us a way to provide a brighter seeming light
    with less power if we use PWM. So not only can we control the brightness, we can
    do a trick to fool the eye into thinkingit’s seeing something brighter even though
    we are using less power. This is good news for our power use, but bad news in
    trying to extrapolate duty cycle to perceived brightness. Cutting the duty cycle
    in half does not translate into a halving of the perceived brightness.Let’s write
    a program to allow us to play with the frequency and the duty cycle then we can
    play with the parameters and see how we think they affect brightness.Is it hard
    to write the PWM code? Nope, all we have to do is change the waveform generation
    bits in the TCC0RA register from WGM01 = 1 and WGM00 = 0 to WGM01 = 0 and WGM00
    = 1.Create a new directory, PWM, and copy the .c and .h files and the makefile
    from the Precision Blinking directory. In the Demonstrator files milliSecInit
    routine change:


    // Set Clear on Timer Compare (CTC) mode, CLK/8 prescalerTCCR0A = (1<<WGM01)|(0<<WGM00)|(1<<CS01);


    to:


    // Set PWM Phase Correct mode, CLK/8 prescaler


    TCCR0A = (0<<WGM01)|(1<<WGM00)|(1<<CS01);and in the SIGNAL(SIG_OUTPUT_COMPARE0)
    change:PORTD = milliseconds++; to:


    if(PORTD &= 1) cbi(PORTD, 0); else sbi(PORTD, 0);Chapter 7: Microcontroller Interrupts
    and Timers Fire up HyperTerminal and try some ctc values noticing how LED 0 changes
    brightness.That was sooooo. easy. If you feel cheated because it was soooo easy,
    then read the section on Timer/counter0 in the data book As usual these programs
    are soooo easy once you know how to do them, but a major bear and a half trying
    to decipher the data book to get the few tidbits you really need.Pulse Width Modulation
    - Motor Speed ControlLet’s modify the LED PWM software a little and use it to
    control the speed of a motor. But first, Let’s design and build the hardware.
    We’ll use parts from the JAMECO parts list: a 9v motor, a 9v battery, a 9v battery
    connector, a 4N28 optoisolator, a TIP115 power transistor, a 330 Ohm resistor,
    and a 2.2K Ohm resistor. I’ve included the optoisolator for the simple reason
    that it helps lessen the possibility that we’ll destroy the Butterfly when messing
    with this circuit. I actually managed to burn up both the optoisolator and the
    power transistor when fooling with this design so, at least for me, this is not
    overkill. Since this is not an electronics text, we won’t learn anything about
    how the circuit works. Just follow the illustrations and you shouldn’t have any
    problems.![](image_rsrc3BW.jpg) Figure 18: Motor Speed Control Schematic and Parts
