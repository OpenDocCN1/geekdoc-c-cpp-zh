  raw: 'The reading is 0.4 volts.DAC and ADC - Function Generator / Digital OscilloscopeIn
    this project we will use a Digital to Analog Converter, DAC, made with a R-2R
    resistor ladder circuit that will output voltages from 0 to +3v in 255 steps.
    We will use voltage values stored in lookup tables to generate ‘functions’ which
    in this case are repeating wave forms: sine, square, triangle, and sawtooth. Since
    this is an educational enterprise we will reuse the software with the millisecond
    interrupt making our ‘wave’ frequencies pretty slow.We will also develop a Digital
    Oscilloscope, using the Butterfly’s ADC and reusing the ADC project software to
    read the data from our Function Generator. Since Digital Oscilloscopes normally
    cost tens of thousands of dollars, you can expect some compromises. This thing
    is very very very … very slow. (And the ‘screen’ is rotated 90 degrees.) If you
    set the ‘ctc’ to 250 you can see the wave output on HyperTerminal. If you set
    ‘ctc’ to 1, you can see the signal on a real oscilloscope.We will output the look-up
    table data on port D and attach the pins as shown in Figure 27\. An R-2R resistor
    ladder looks a little magical, and the circuit analysis, though simple in concept,
    turns out to be fairly complex, but it makes a reasonably accurate DAC for very
    little cost. Usually you’ll see two resistor values in this type circuit, in our
    case we would use a single 4.4k Ohm resistor in place of the two 2.2k resistors,
    but since we got 100 2.2k resistors from our JAMECO list, Let’s just use two of
    each for the 4.4k resistors. The 2.2k and 4.4k are not magical numbers; you can
    use any value for R as long as the other is 2R and not be so low as to drain the
    battery or so high as to block the current.Using the 2.2k resistors from the JAMECO
    list construct your DAC using the schematic in Figure 27, which is illustrated
    by the close-up photo in Figure 28, a medium distant photo in Figure 29, and the
    full setup in Figure 30 complete with a sine wave on an oscilloscope.If you don’t
    have an oscilloscope, just connect the output of the DAC to the Butterfly ADC
    on J407, just like with the potentiometer as shown in Figure 29\. Now you can
    read the output using HyperTerminal and have a really slow crappy sideways oscilloscope
    as shown in Figure 34.![](image_rsrc3MG.jpg) ![](image_rsrc3MH.jpg) Figure 31:
    Breadboard of R-2R DAC


    ![](image_rsrc3MJ.jpg) Figure 32: Breadboard R-2R DAC wiring


    ![](image_rsrc3MK.jpg) Figure 33: R-2R DAC with Oscilloscope


    ![](image_rsrc3MM.jpg) Figure 34: Function Generator / Digital Oscilloscope on
    HyperTerminal


    ![](image_rsrc3MN.jpg) ![](image_rsrc3MP.jpg) ![](image_rsrc3MR.jpg) ![](image_rsrc3MS.jpg)
