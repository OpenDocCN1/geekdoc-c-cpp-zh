    ![](image_rsrc3J6.jpg) ![](image_rsrc3J7.jpg)211


    Figure 27 shows a simplified diagram of a successive approximation. This method
    uses an analog comparator and a digital to analog converter. An analog comparator,
    in this case, is a device that has two analog inputs one for the external voltage
    and the other for the voltage from the DAC (Digital to Analog Converter that can
    accept a digital number and output a voltage proportional to that number– we’ll
    examine these later). If the voltage on the DAC is lower than the external voltage,
    the analog comparator outputs a 0, if it is higher it outputs a 1\. The ATmega169
    DAC is 10-bits, meaning that it can output 1024 steps from 0 and its maximum voltage.Let’s
    look at the case where the maximum voltage that the DAC can produce is 3.0


    volts. We have 10-bits to play with so we can keep approximating in 0.00293


    (3.0/1024) volt steps. Let’s set the input voltage to 1.234 volts. We use a binary
    search technique that starts in the middle and bisects each successive voltage.
    We start by bisecting the 3 volts by sending the number 512 to the DAC, which
    then outputs 1.5


    volts; the comparator will output a 1, meaning that the DAC voltage is too high.
    So we bisect the 1.5 volts by sending the DAC 256 to reset it to 0.75 volt and
    get a 0


    meaning that the DAC voltage is now lower than the input voltage. Next we bisect
    the 1.5-0.75 volts by sending 384 to the DAC output 1.215 volts and get a 0, too
    low. We keep successively approximating until we find that the voltage is between1.233
    and 1.236 volts. This is the best we can do with 0.003 volt steps.Analog to Digital
    Conversion with the ATMEGA169The ATmega169 has a 10-bit successive approximation
    Analog to Digital Converter connected to an 8-channel analog multiplexer allowing
    connection to one of eight voltage inputs on PortF. During conversion the voltage
    is held constant by a sample and hold circuit. Look in the data book on page 195,
    figure 82 for a block diagram of the ADC circuit.The minimum value is GND and
    the maximum is determined by the voltage on the AREF pin (minus 1-bit in the least
    significant bit). We can use an external voltage reference attached to this pin,
    or we can tell the AVR to connect it to either AVCC or to an internal 1.1 volt
    reference. This setup allows us to improve noise immunity by connecting a decoupling
    capacitor to the AREF to help


    stabilize the internal voltage reference. The Butterfly uses a 100 nF capacitor
    for this purpose.There are 8 analog input channels ADC0 – ADC7 on the Port F pins
    PF0 – PF7\. These pins are connected to an analog multiplexer that can connect
    any of the pins to the analog comparator. The channel is selected by setting the
    MUX0 – MUX4 bits in the ADMUX register.The ADC is enabled/disabled by setting/clearing
    the ADEN bit in the ADCSRA (ADC Control and Status Register A). Since the ADC
    consumes power it is recommended that you turn it off when not in use.The ADC
    readings are put in the ADC Data Registers ADCH and ADCL. In normal operation
    you read the ADCL first, then the ADCH to ensure that both registers contain the
    value of a single conversion.An ADC interrupt can be set to trigger when a conversion
    is complete.


    Starting a Conversion


    There are several ways to start a conversion.Write a 1 to the ADC Start Conversion
    bit ADSC to start a conversion. This bit stays high while the conversion is in
    progress and is cleared by the hardware when the conversion completes.You can
    enable auto triggering by setting the ADC Auto Trigger bit, ADATE. The trigger
    source is determined by setting the ADTS2:0 ADC Auto Trigger Source bits in the
    ADCSRB register. The triggers can be:• Free Running mode


    • Analog Comparator


    • External Interrupt Request 0


    • Timer/Counter0 Compare Match


    • Timer/Counter0 Overflow


    • Timer Counter Compare Match B


    • Timer/Counter1 Overflow'
