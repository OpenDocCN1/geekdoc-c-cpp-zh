    # 使用压电元件发声


    压电元件是蝴蝶开发板背面那个黑色的大方块。它包含一片通电时会变形的材料（即压电效应）。这种变形可以在音频频率下发生，从而使该元件在空气中产生声波。我们的压电元件连接到`PortB`的引脚
    5，这个引脚同时也是`OC1A`引脚，可以配置为定时器 1 波形生成器的输出端口。


    我们将配置定时器 1 的波形生成器，使其使用 PWM（脉宽调制）来产生音调。


    ## 初始化用于 PWM 模式的定时器 1


    采用**相位与频率正确的脉宽调制模式**初始化定时器 1：


    ```

    TCCR1A = (COM 位设置); // 将 OCIA 设为高电平 - [注意：原文存在语法错误；此处按典型设置重构]

    ```


