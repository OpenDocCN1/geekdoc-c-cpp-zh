    Follow the NOTICE HOW THE RXD AND TXD LINES CROSS OVER – PAY CAREFUL ATTENTION
    AS IT IS EASY TO GET THESE REVERSED.Constructing the power supply:


    The Butterfly comes with a CR2450 coin battery that will power the LCD for a long
    time, but will be used up quickly by the RS-232 connection and our experiments.
    Remove the coin battery and construct a battery pack with parts from the JAMECO
    parts list (Appendix 7) using the following pictures. Be sure and get the power,
    red wire, and ground, black wire, correct: as shown in Figure 4 and Figure 5.NOTE:
    ALL THE ILLUSTRATIONS SHOW PORTD WITH AN 8-PIN HEADER AND THE POWER WIRES SOLDERED
    IN PLACE. THE PARTS KIT SPECIFIES 10-PIN CONNECTORS FOR BOTH PORTS B AND D. USE
