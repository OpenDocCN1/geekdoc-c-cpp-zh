  trans: "\n\n# 定时器/计数器 1 的捕获事件转换时序\n\n逐次逼近过程在 50kHz 至 200kHz 之间进行时钟同步，以获得最大分辨率。你可以使用更高的采样率频率，但会得到更低的分辨率。采样率由输入时钟和`ADCSRA`寄存器的`ADPS`位中设置的预分频值决定。首次转换需要\
    \ 25 个时钟周期来初始化硬件；正常转换为 13 个时钟周期，而自动触发转换为 13.5 个。\n\n## 切换通道\n\n切换通道和电压参考基准涉及一些复杂性，因此建议始终等待一次转换完成后再进行更改。如果这不太方便，请阅读数据手册自行解决。\n\
    \n## 数字噪声抑制\n\nCPU 及 I/O 外设会产生大量电噪声影响 ADC（模数转换器）的精度。我们可以将系统置于休眠状态以屏蔽干扰从而获得安静环境下的读数详情可参阅数据手册关于模拟输入信号调理的内容对模拟信号进行处理\
    \  \n\n-  滤波器应滤除高于奈奎斯特频率的成分低通滤波尤为有效  \n   \n采样时间取决于所需的电荷量这与取样保持电路有关因此源输出阻抗应尽量低于\
