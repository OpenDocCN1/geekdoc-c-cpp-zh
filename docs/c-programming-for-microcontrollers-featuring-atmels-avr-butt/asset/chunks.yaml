  raw: 'A few days after making the power supply I left it on all night, so I added
    an LED (Figure 4) to the switch so that I’d know that it was on. You can solder
    the long leg of an LED to the rightmost pin on the switch, where the +3v goes
    to the Butterfly, and then solder a 330 resistor to the short leg and the resistor
    to the rivet at the base of the battery on the right. The LED is lit when the
    switch is to +3V.Test your Connection using Brays Terminal:Hook your RS-232 cable
    to the Butterfly as in Figure 6\. The r un Bray’s Terminal, (well, Br@y++’s to
    be exact – available at http://bray.velenje.cx/avr/terminal and http://www.smileymicros.com)
    and configure it as in Figure 7 with the radio buttons set to select your COM
    port, 19200 Baud rate, 8 Data bits, parity of none, 1 Stop bits, and no handshaking.
    Click the connect button. Turn on your Butterfly power supply, then with the joystick
    button centered press it and watch the stream of ?????? question marks that should
    be coming from the Butterfly. This is the Bootloader telling you that it is alive
    and ready to be boot loaded, or perhaps it is If you don’t get the string of question
    marks, then try the other COM ports (in Figure![](image_rsrc39J.jpg)7 only COM1
    and COM3 are shown for my machine, yours may be different. Press disconnectthen
    connect and try again. If it still doesn’t work, carefully check that the RS232
    cable is connected. Try again. Still no? Recheck that you’ve got the DB-9 soldered
    correctly to your Butterfly. Try again. Still no? Is it turned on? If you move
    the joystick upward do you get the LCD scrolling message? Yes? Turn it off and
    on and press the center again. Still no? If its not working by this point go back
    and meticulously retry everything you can think of, including passing a dead chicken
    over the setup while chanting voodoo hymns. It took me a while to get all this
    running and I supposedly know what I’m doing, so don’t feel bad if this is a little
    harder than you might hope. (You get what you pay for).In a moment you will scoop
    out the Butterfly’s brai ns, toss them aside, and stick in some brains that Igor
    got from a garage sale, so let’s do one final test on the Butterfly as it came
    out of the package. If all goes well, you will eventually be able to reload the
    Butterfly’s original brains, but all seldom goes will, as Igor will readily attest.With
    the Butterfly hooked up to the RS-232 port and the Br@y++ Terminal running, turn
    the Butterfly on and click the joystick up to get the LCD scrolling. Move the
    joystick straight down three times till you see ‘Name’ then move the joystick
    to the right twice till you see ‘Enter name’ then move the joystick straight down
    once and you will see ‘Download name’ then push down the joystick center for a
    moment until you see ‘Waiting for input’. Now write a name in the bottom text
    panel of the Br@y++ Terminal (Figure 8) and hit enter (or push it gently if you
    prefer). The name you entered should be scrolling across the LCD as shown in Figure
    6.Us e this gray![](image_rsrc39K.jpg) ![](image_rsrc39M.jpg) ![](image_rsrc39N.jpg)
    ![](image_rsrc39P.jpg) ![](image_rsrc39R.jpg) ![](image_rsrc39S.jpg) ![](image_rsrc39T.jpg)
    ![](image_rsrc39U.jpg)w indow to send![](image_rsrc39V.jpg)c haracters to the![](image_rsrc39W.jpg)B
    utterfly, not the![](image_rsrc39X.jpg) ![](image_rsrc39Y.jpg) ![](image_rsrc39Z.jpg)
    ![](image_rsrc3A0.jpg) ![](image_rsrc3A1.jpg) ![](image_rsrc3A2.jpg) ![](image_rsrc3A3.jpg)
    ![](image_rsrc3A4.jpg)w hite one above.![](image_rsrc3A5.jpg) ![](image_rsrc3A6.jpg)
    ![](image_rsrc3A7.jpg) ![](image_rsrc3A8.jpg) ![](image_rsrc3A9.jpg) ![](image_rsrc3AA.jpg)
    ![](image_rsrc3AB.jpg) ![](image_rsrc3AC.jpg) ![](image_rsrc3AD.jpg)  Figure 8:
    Enter name to send to the Butterfly ![](image_rsrc3AE.jpg)  ![](image_rsrc3AF.jpg)
    ![](image_rsrc3AG.jpg) ![](image_rsrc3AH.jpg) Figure 9: Blinky wiring diagram
    and photo of wired board ![](image_rsrc3AJ.jpg) ![](image_rsrc3AK.jpg) ![](image_rsrc3AM.jpg)
    ![](image_rsrc3AN.jpg) ![](image_rsrc3AP.jpg) ![](image_rsrc3AR.jpg) Let’s Blink
    Some LED’s:


    ![](image_rsrc3AS.jpg) ![](image_rsrc3AT.jpg) ![](image_rsrc3AU.jpg)All the parts
    are listed in the JAMECO parts list Appendix 1\. Put the LEDs in the breadboard
    with the short leg on the resistor side. Use the 330-Ohm resistors to jumper to
    the ground strip. You’ll need to make a bunch of jumper wires, cut 9 pieces about
    4 inches long strip each end about 3/8 inch, and connect them to the breadboard
    as shown in Figure 9, with the right most LED connected to pin 1 of PORTD (Figure
    2) and subsequent pins connected sequentially. The pins are numbered with the
    odd pins on the bottom of the PORTD land and the even pins on the top. Cut a 6”
    wire and use it to connect the ground strip to the ground pin of PORTB as shown.Now
    connect your RS-232 cable between the computer and the RS-232 connector you soldered
    to the Butterfly. Your hardware should look like Figure 10.


    Figure 10: Hardware setup for Blinky.  Blinking LEDs – Your First C ProgramYou
    might wonder why blinking an LED is the first project, when traditional C programming
    texts start with the classic “Hello, world” program. It certainly seems that since
    the Butterfly has an LCD that can show the words it would be easy. But the reality
    is that controlling the LCD is much more complex than blinking an LED, so we’ll
    save the LCD for later when we’ve gotten a better handle on things.• Make a directory
    called Blinky for this project.


    • Copy ‘…/WinAVR/Samples/makefile’ (notice that it has no extension) to the Blinky
    directory.Write it in Programmers Notepad


    •


    ![](image_rsrc3AV.jpg) Find Programmers Notepad that was installed as part of
    WinAVR (you should have an icon for it on your desktop) and open it. You will
    need to add a tool, which will let you use the AVR Studio simulator.


    • Open the Tools menu and click on Options.


    • In the Options window select Tools:


    ![](image_rsrc3AW.jpg)• Then select Add:


    • Change the check box to look like:![](image_rsrc3AX.jpg)• Click OK.


    • Click File, then New, then C/C++, and name it Blinky.c.


    • Save in Blinky directory and CAREFULLY TYPE exactly as shown:// Blinky.c


    #include <avr/io.h>#include <avr/delay.h> int main (void)


    {


    // set PORTD for output


    DDRD = 0xFF;


    while(1) {


    for(int i = 1; i <= 128; i = i*2){


    PORTD = i;


    _delay_loop_2(30000); }


    for(int i = 128; i > 1; i -= i/2) {


    PORTD = i;_delay_loop_2(30000); }


    }


    return 1;}• Open File and again save ‘Blinky.c’ to your Blinky directory


    • NOTE: YOU MUST ADD THE EXTENSION ‘.c’ TO THE NAME


    • Open the file ‘makefile’ in your Blinky directory.


    • Change these lines:MCU = atmega128 # Target file name (without extension). TARGET
    = main# Output format. (can be srec, ihex, binary) FORMAT = ihex


    • To:


    MCU = atmega169


    # Output format. (can be srec, ihex, binary) FORMAT = ihex


    # Target file name (without extension). TARGET = Blinky• Close and save changes
    to makefile to the Blinky directory.


    • Open Tools and click [WinAVR] Make All to make your Blinky.hex file


    • Open Tools and click [WinAVR] Make Extcoff to make your Blinky_coff file.Download
    to the Butterfly with AVRStudio


    •


    ![](image_rsrc3AY.jpg) Find AVR Studio (you should have an icon for it on your
    desktop)and open it.


    • In the File menu Open ‘…\Blinky\Blinky.cof


    • Select the AVR Simulator and the ATMEGA169 as:![](image_rsrc3AZ.jpg)• Select
    Finish


    • DO NOT try to run the simulation; the delay loop will take forever to run.We’ll
    use the simulator later.


    • Turn the Butterfly off.


    • Press and hold down the joystick button.


    • Back to the AVR Studio, open the Tools menu and WHILE HOLDINGDOWN THE JOYSTICK
    BUTTON click the AVR Prog menu item. Then wait until you see:


    ![](image_rsrc3B0.jpg)• Release the joystick button. Your finger hurts doesn’t
    it? Enter Blinky.hex in the ‘Hex file’ box. Press the program button and the program
    should magically flow from your PC into the AVR Butterfly Flash memory.


    • AVR Prog will say: Erasing Programming Verifying OK.'
