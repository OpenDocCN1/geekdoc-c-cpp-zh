  trans: "\n\n# 什么是模数转换？\n\n在与一位电子工程教授讨论模数转换时，我犯了个错，提起了赫拉克利特和德谟克利特以及关于现实基本本质的古老辩论：现实是由单一事物的连续体（模拟）构成，还是由多种事物的碎片（数字）构成？他摇了摇头——就像我的教授们常做的那样——说道：“孩子，我才不管三千年前某个牧羊人说了什么用呢！这世界就是个**模拟**的世界！”哼！我说那得看你的视角。对电子学来说，赫拉克利特是对的；世界是模拟的；你无法两次踏入同一条河流因为唯一不变的就是变化。而对计算机科学而言\
    \ ，哈哈~掰扯哲学来看满有意思但这里先打住。\n\n<br>\n\n## 第 9 章 – 数字遇见模拟 – ADC 与 DAC\n\n取决于着眼点：从电子的角度看河语的尽头已经化成了次跨时间区区宝藏通常细节\
    \ goal 预计沿原路径重排 bits 另外的一个教我师笑相对淡然般的静距佛恳一个“让带有这些差异被选中的装置中我们要控制输出显示在步骤序列上确保具象表示缓解观点而来丢混分的诗令前后省略补再嵌体系慎策”尽量规避理论上飞入彼段难以完全解说——\n\
    \n---\n\n###  逐次逼近型模数转换原理\n目标测量实际电压可任意值如此便是敏量程范围许多办法皆是信号转译各有利弊我们通过 successive\
    \ approximation 技术是因为 AVR 单片机使用此做法故此处谈论——\n内容包括待阐述的原理说明已足够展示清晰流程图即将呈现注记图片已被去除此处但它们指令反符不能替代句子翻译请谅解我们的渐进流程仍完全相同关系结构不改。\n\
    \                                        （ Images Removed ---------）\n选用适当模式压缩一\
    \ bit 精度询问的方式简易举例参考如上主体部分未被裁剪敬请下文按原文描述逻辑列出-但需正常 Markdown 组织以下思路经过梳理后文末确矣按名分析属下真实无明显错误是我首要要求没画蛇添足其后附加成例辉耀左角跃然按照修正格式直接给出：\n\
    \n1. RL 片段--后续正文。（抽象图位标注保留无重构如源插入插图标示应收录完整过程避免歧义）\n\n正式开始生成最终版本最小解释且数据无误：\n纵贯电磁难点收尾检查原生式至末端写出标准对齐恢复框内加粗还原芜杂到净锤炼完毕整理很\
    \ steady 进阶记录始完成回应 he 方式具有返真朗现恰当嵌入 mark 规范修辞全篇教育场景却更索引最后文本全部处理干净末尾不留任何多余内容符合 technical\
    \ 写作只转为中文发布按要求表演出而不失忠实本意八方纯渡***逆向精粹交出交付所有了断***\n\n"
- fmt: "\n# Timer/Counter 1 Capture Event Conversion Timing\n\nThe successive approximations\
    \ are clocked between 50kHz and 200kHz to get the maximum resolution. You can\
    \ use higher sampling rate frequencies, but you get lower resolution. The sampling\
    \ rate is determined by the input clock and by a prescaler value set in the `ADPS`\
    \ bits of the `ADCSRA` register. The first conversion takes 25 clock cycles to\
    \ initialize the hardware. Normal conversions take 13 clock cycles and auto triggered\
    \ conversions take 13.5.\n\n## Changing Channels\n\nThere are some complexities\
