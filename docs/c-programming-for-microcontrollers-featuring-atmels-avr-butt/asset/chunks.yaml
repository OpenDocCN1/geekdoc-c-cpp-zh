    unsigned char i;


    for (i=0;i<num_bytes;i++) {


    pBuffer[i]=eeprom_read_byte_169(&EE_START_ADR); // Load parameters EE_START_ADR++;


    }


    }The purpose of this function is to read data from the EEPROM. The parameter list
    includes a pointer to a string, ‘char *pBuffer’, the number of bytes to read,
    ‘char num_bytes, and the starting address for the EEPROM, ‘EE_START_ADR’The caller
    sets up a string buffer with enough space for the requested number of bytes and
    calls LoadEEPROM with a pointer to the string, along with the requested length
    and the starting address of the EEPROM. The LoadEEPROM function runs a loop and
    for each pass the function eeprom_read_byte_169 is called with the address of
    the starting address of the EEPROM as a parameter, this function gets the byte
    and returns it so it can be put in the pBuffer array.This function is used in
    vcard.c as follows:


    // Load name from EEPROM


    LoadEEPROM(Name, indexps, EEPROM_START + 1);


    using these declarations:from vcard.h


    #define STRLENGHT 25 #define EEPROM_START 0x100at head of vcard.c:


    uint8_t indexps = 0; char Name[STRLENGHT];This is a perfectly good function, but
    it requires that the user never ask for more bytes than the size of the pBuffer
    array. What if we set indexps = 50? The LoadEEPROM will fill the Name[STRLENGHT]
    array and the 25 bytes of RAM that follow the array. Since the second 25 bytes
    wasn’t allocated to this function we have no way of knowing what’s supposed to
    be stored there, but we overwrite it anyway and almost certainly cause havoc.It
    would be good programming practice to add a line that checked the array size and
    the number of bytes before calling the LoadEEPROM function, and if there’s a problem
    generate an error.if(NAMESIZE >= indexps){


    // Load name from EEPROM


    LoadEEPROM(Name, indexps, EEPROM_START + 1);}


    else


    ErrorMessage(“LoadEEPROM error: number of bytes requested > array size”);But we
    are smart and we’d never make such a d umb error, so why bother adding the extra
    code that only slows things down and increases the code size and is a pain to
    type? The obvious answer is that the mistakes we make will often be painfully
    dumb.FIFOs and LIFOs: Stacks and Queues (Circular Buffers)Stacks'
