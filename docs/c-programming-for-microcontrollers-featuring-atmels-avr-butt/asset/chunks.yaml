  trans: "\n\n制作好电源几天后，我让它整晚都开着，于是我在开关上加了一个 LED（图 4），这样就能知道它是否处于开启状态。你可以将 LED 的长脚焊在开关最右边的引脚上（也就是`+3v`连接到“蝴蝶板”的地方），然后将一个`330Ω`电阻焊接到短脚上，再将这个电阻焊接到电池底座的正极铆钉处。\n\
    \n当此连接与打开的+3V 端接通时，LED 就会亮起。\n\n使用 Bray's Terminal 测试你的连接：\n\n按照图 6 所示方式将 RS-232\
    \ 电缆连接到 Butterfly 板上。然后运行 Bray'sTerminal 软件（其实是 Bray++版本——可从以下网址获取：http://brye\
    \ velenj cx/avr /terminl 和 http //www smileymicro com），并参照图 7 进行配置、选择 COM 端口。选项设置单选按钮如下：选择您的端口；波特率=19200；数据位\
    \ 8 位 – 无校验比特 1 停止位 –不握手点击 Connect 按钮同时按住摇杆中央下推观察屏幕上显示的???问号？？？这是 Bootloader 正在发送信号表示已就绪准备加载程序也可能不是如果字符串显示失败请尝试其他端口(图中仅显示\
    \ com13)您可能不同按下 Disconnect 再重新连按仍然不行则仔细检查 RScable 焊接是否正确再次尝试仍出问题?检查 DB–9 接头是否正确焊接再试一次设备打开了吗?向上推动\
    \ Joystik LCD 滚动显示了信息吗是 ?关闭电源按中键 Center 回溯排查整个过程逐一重做所有步骤甚至包括念咒祈祷……花了我不少时间才让一切正常运行所以别觉得自己水平差这比想象中难多了——“一分钱一分货”。\n\
    \n暂且清空大脑抛开杂念从二手集市淘来的 Igor 零件开始最终测试原装包装之后成功刷新此后偶尔也能顺利载入但并非总能轻易复现\n\nButterfly 接串口\
    \ Br@y ++终端激活开機 clickUp 向下滚三次直到看到‘Name’向右两次见到'Enter name'后再向下直至等待输入在图底部文本面板 Figeight\
    \ 写下名字回车轻点推出名字即会在 LCD figrue 六的灰色窗口区域回显而不会出现在上方白窗口中![image_rsrc39J.jpg][因无意义字符分割导致多图像截断]...\
    \ FigureEight 显示屏进入  \nSend 按键传输内容至到显示器内部完成 ButtonFly 采集阶段...\n\n让我们闪烁一些 LED：\n\
    所有物料清单见 JAMECO 附录一  将 LEDs 放入面包版短线腿对向電阻侧采用欧姆跳线与地线相连准备好多条杜邦线剪成九段每英寸长度剥两端四分之三寸波段接线如图\
    \ figrightmost 最右边一端接入 Pin-PORTD!随后各奇数序号接连低行偶数顶部拼接另外添加額外路徑 via PORTUSB\n附帶之前連接好的\
    \ RSC combo 用于電腦硬體如圖 10 顯示 voicelabs    \n\n闪烁 Led 你的首个 C 语言编程實戰看似为何先闪灯而非簡單 HelloWorld\
    \ 必要实际因素在于控制更复杂应对日後高階技巧熟練  \n\n执行步骤如下:\n*   创建名为 blinky 的项目目录。\n*   复制 ´../WinAVR/samples/makefile´文件放到合适位置。\n\
    完整写入程序员笔记本引导附加指南根据列出的指令调整参数设定 MCU 为 atmega169 输出 Format 为 ihex 目标名称改为 Blinky 不要默认\
    \ main 等依次通过工具菜单 Make hex coff files 关闭 butterfly 航保持 joybutton 启动 AVRProg…稍候\
    \ release 痛苦的插入所选檔案 Programing OK verify complete\n\n"
- fmt: "\n• 当你想要下载不同的HEX文件时，别忘了更改`HEX文件名`。在你浪费时间去纳闷为什么新程序运行得像上次下载的那个一样之后，别说我没警告过你。我经常犯这个错误。\n\
    \n• 如果弹出的窗口不是上述内容而是：![](image_rsrc3B1.jpg)，请退回几步再试一次。你可能让“布雷终端”处于运行状态从而导致端口被锁定；也可能并非如此。\n\
    \n## Blinky Goes Live\n- 关闭电源然后再打开，LCD将变为空白。\n- 点击摇杆向上（可能要点几次），然后显示：![](image_rsrc3B2.jpg)\n\
    - LED应该会像机器人赛隆的眼睛那样发出来回弹跳的光线效果。（如果你不知道什么是赛隆人，可以试试谷歌搜索《星际大争霸》，虽然我不推荐这部系列剧——但里面的坏蛋眼睛确实很酷。）\
    \  \n  图11来自《星际大争霸》漫画封面的红色赛隆人 ![](image_rsrc3B3.jpg)\n\n编译Blinky.c时你可能已经猜到后台有很多事情在发生——你的猜测没错。编译器做了很多工作；幸好我们不需要知道它具体是怎么完成的、只需了解如何引导它以完成我们需要的工作即可：对我们的场景而言就是将\
    \ `Blinky.c`转换为可以烧录到Atmega169开发板上的 `Blinky.hex`\n\n揭开WinAVR的引擎盖你会看到一堆由开放软件运动的参与者们多年创建出来的极为复杂的工具集\
    \ 。有空的时候可以去看看www.sourceforge.net 。\n\n当你在使用中有疑问时会去查问 ——这是必然的！--->建议访问 “进论坛前先搜一下已有的帖子\
    \ ;毕竟很可能有人早就提过这个问题并且得到了很好的回答”“帮助社区的成员往往讨厌不做好功课就提问的新手”。\n\n# Simulation with AVRStudio\n\
    \n现在你已经历了搭建硬件的折腾乃至把手都烫出泡……可猜怎么着？其实根本没必要那么费劲就能测试 →要学习后续章节的基础微控制器C编程只要改一点点就可以借助仿真完全不必搭实体硬件直接跑起例程并在模拟环境中熟悉\
    \ ；之所以选了麻烦（准确说是‘真实设备’）路线只是因为终极目标是控制真正发光二极管而不是屏幕里的小方框～理论环境固然好完整套件什么都能虚拟(直观有趣)但这哪比得上用真的杀器机器人在街区吓敌人大惊失色好玩呢\
    \ ?说笑的 ~实际上常常更适合先在仿线程效率较好:显然能避免主脑误把自己当成敌人识别~\n\n注意 ***外部循环计数导致其推迟指令慢如冰河//闪得十豪秒耽误整体速度飞快与否验证*/于是移除：\n\
    \n - ~~拿掉模体而注释其中是~~\n\n从项目清单删节调用启动宏!\n\\\\存在于函数内部分的双反斜杠替换前缀):\n> // _delay\\_loop\
    \ \\x28参数\\x29\\；\n接着重新命令目标名改为 Sim$至目录路径保存执行多次操作并加载coff到studio以 I/O模式逐步自动单步调试检验:\n\
    \n*白字说明工程度对照示意←-\n最后作者感叹还有指导性意义运转成功**真心提示付费商业IDE成本高得多所有个性磨练值得回顾.**\n\n---\n###\
    \ Chapter　0快速开始特色 #延续阅读前求牢牢理解下……\n\n本书专为绝对零基础学员设讲示例.\n\n>\n温馨提醒应当跳过详细查明学位多彩附录为重点解析包含特定\"\
    头引用例子扩展到derive细分解释快无视\">\n\n示范排式已顺利补齐符合排版要求.\n"
  raw: '• WHEN YOU WANT TO DOWNLOAD A DIFFERENT HEX FILE, DON’T FORGET TO CHANGE THE
    HEX FILE NAME. DON’T SAY I DIDN’T WARN YOU AFTER YOU WASTE TIME SCRATCHING YOUR
    HEAD OVER WHY YOUR NEW PROGRAM SEEMS TO RUN EXACTLY LIKE THE LAST ONE YOU DOWNLOADED.
    I make this mistake a lot.


    • If instead of the above window you get:![](image_rsrc3B1.jpg)• Go back a few
    steps and try again. You probably left Bray’s Terminal running so it has locked
    the port. Then maybe not.


    Blinky Goes Live• Turn the power supply off and then back on, the LCD will be
    blank, click the joystick up (maybe a couple of times) and:![](image_rsrc3B2.jpg)•
    Your LEDs should be making like a Cylon with the light bouncing back and forth.
    If you don’t know what a Cylon is, try Googling Battlestar Galactica, not that
    I’m recommending the series, but the bad guys had great eyes:![](image_rsrc3B3.jpg)
    Figure 11: From the cover of the Battlestar Galactica comic Red Cylon .When you
    compiled Blinky.c you may have suspected that a lot of stuff was going on in the
    background, and you would have been right. The compiler does a lot of things,
    and fortunately for us, we don’t really need to know how it does what it does.
    We only need to know how to coax it to do what we need it to do, which in our
    case is convert Blinky.c into Blinky.hex that we can download to the Butterfly.
    If you raise the hood on WinAVR you would see a massively complex set of software
    that has been created over the years by folks involved in the open software movement.
    When you get a little extra time check out www.sourceforge.net .When you have
    questions about WinAVR, and you will, check out the forums on www.AVRFreaks.net
    , especially the gcc forum, since WinAVR uses gcc to compile the C software. Try
    searching the forums before asking questions since someone has probably already
    asked your question and received good responses. Forum helpers tend to get annoyed
    with newbies who don’t do sufficient background research before asking questions.Simulation
    with AVRStudioNow that you’ve gone to the trouble to construct the hardware, and
    h ave the burned fingers to prove it… guess what? You didn’t need to do any of
    that to test Blinky or get an introduction to C programming for microcontrollers.
    With a minor modification you can run Blinky in the AVR Studio simulator and learn
    the introductory C programming ideas in the next chapter without any of the hardware.
    I decided to do things the hard way, ummm… hardware way because our goal is to
    control ‘real’ things like LEDs, not virtual things like little boxes on your
    PC screen. Theoretically, we could have a whole slew of virtual things to control,
    from LEDs to motors to full blown Cylon robots reeking havoc on your screen, which
    actually sounds kind of fun, but not nearly so much fun as having a real Cylon
    robot stomping around your neighborhood scaring the noodles out of your enemies.
    Fun aside, it is often more practical to simulate software before running it in
    the real world. You wouldn’t want your Cylon to mistake you, the imperious leader,
    for an enemy, would you?The simulator runs your program in a virtual environment
    that is MUCH slower than the real microcontroller. Most of your code will run
    plenty fast to simulate, but some things, such as the delay functions take too
    long to simulate. In Blinky we call _delay_loop_2(30000); We don’t know yet how
    this function works, but we can guess that we are telling it to do something 30000
    times. If we simulate tart Guide the delay, the simulated LEDs will move at geologic
    speeds, making glaciers seem fast, so we remove the delay before simulation.•
    Open Blinky.c in Programmers Notepad and save it to a new directory,SimBlinky,
    as SimBlinky.c.


    • Put comment lines in front of both of the _delay_loop_2() function calls in


    main():


    • // _delay_loop_2(30000);


    • Open the makefile in the Blinky directory


    • Change the target: TARGET = SimBlinky• Save the makefile to the


    SimBlinky directory


    • Run the Make All, then Make Extcoff.


    • In the AVRStudio open the SimBlinky.coff file.


    • In the AVRStudio Workspace window click the I/O ATmega169, then the


    PORTD, you should see: (the following image shows PORTB instead of


    PORTD, -- live with it)![](image_rsrc3B4.jpg)• In the toolbar click the AutoStep
    button:


    Chapter 2: Quick Start Guide![](image_rsrc3B5.jpg)• The simulator will run showing
    the LED scan as a scan of the PORTD andPIND items in the Workspace window:(this
    shows PORTB but you’ll actually see PORTD)


    ![](image_rsrc3B6.jpg)• See, I told you it wasn’t as much fun as watching real
    LEDs blink.


    • Spend some time with the AVR Studio simulator and associated help files; you’ll
    find the effort well worth it in the long run.GOOD GRIEF!That was a ‘Quick Start’????
    Well, maybe things would go quicker if you wanted to pay a fortune for a software
    and hardware development system, but for FREE software, and unbelievably cheap
    hardware, you’ve got to expect to do a little more of the work yourself. Besides,
    you couldn’t pay for all the debugging education I bet you got just trying to
    follow what I was telling you. If you think the ‘Quick Start’ section was confusing,
    you should try reading all the stuff it’s based on.Chapter 3: A Brief Introduction
    to C – What Makes Blinky Blink?This section takes a very brief look at Blinky.c
    to help begin understanding what each line means. Later, these items will be covered
    in greater detail in context of programs written specifically to aid in learning
    the C programming language as it is used for common microcontroller applications.Comments


    You can add comments (text the compiler ignores) to you code two ways. For a single
    line of comments use double back slashes as in // Blinky.cFor multiline comments,
    begin them with /* and end them with */ as in:/*


    Blinky.c is a really great first program for microcontrollers it causes eight
    LEDs to scan back and forth like a Cylon’s eyes */Include Files


    #include <avr/io.h> #include <avr/delay.h>The ‘#include’ is a preprocessor directive
    that instructs the compiler to find the file in the <> brackets and tack it on
    at the head of the file you are about to compile. The io.h provides data for the
    port we use, and the delay.h provides the definitions for the delay function we
    call.Expressions, Statements, and Blocks


    Expressions are combinations of variables, operators, and function calls that
    produce a single value. For example:PORTD = 0xFF – counter++This is an expression
    that sets the voltage on pins on Port D to +3v or 0v based on the value of the
    variable ‘counter’ subtracted from 0xFF (a hex number we’ll learn about these
    and ports later). Afterwards the counter is incremented.Statements control the
    program flow and consist of keywords, expressions, and other statements. A semicolon
    ends a statement. For example:


    TempInCelsius = 5 * (TempInFahrenheit-32)/9;


    This is a statement that could prove useful if the Butterfly’s temperature readings
    are derived in Fahrenheit, but the user wants to report them in Celsius.


    Blocks are compound statements grouped by open and close braces: { }. For example:


    for(int i = 1; i <= 128; i = i*2){


    PORTD = ~i;


    _delay_loop_2(30000);}


    This groups the two inner statements to be run depending on the condition of the
    ‘for’ statement.


    OperatorsOperators are symbols that tell the compiler to do things such as set
    one variable equal to another, the ‘=’ operator, as in ‘DDRB = 0xFF'' or the ‘++’
    operator for adding 1, as in ‘counter++’.Flow Control


    Flow control statements dictate the order in which a series of actions are preformed.
    For example: ‘for’ causes the program to repeat a block. In Blinky we have: for(int
    i = 1; i <= 128; i = i*2)


    {'
