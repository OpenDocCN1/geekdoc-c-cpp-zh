  trans: "\n汇编语言程序员在调用子程序和运行算法时经常使用栈。栈就像自助餐厅里那些堆叠的托盘，我们从顶部取用托盘，洗碗工则将它们放回顶部。顶部的托盘通常是湿的，而底部的则从未被使用过。对我们来说重要的是永远不要试图使用最底部下面的那个“不存在的”托盘——这个类比在此失效了,就会导致\"\
    炸栈\"，正如之前讨论 C 语言如何通过调用来函数使​用时案到的那种情况。\n\n有时你会看到 'fifo' 来指代这类**后进先出（LIFO）结构**没问题吗实际上跟\
