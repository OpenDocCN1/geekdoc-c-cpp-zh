  raw: '};Using the Piezo-element to make soundThe piezo-element is the large black
    square on the back of the Butterfly. It contains a sheet of material that deforms
    when electricity is applied to it (the piezo electric effect). This deformation
    can be made at audio frequencies allowing the element to produce sound waves in
    the air. Our piezo-element is connected to PortB pin 5, which is also the OC1A
    pin that can be configured as an output for the Timer1 waveform generator. We
    will configure the Timer1 waveform generator so that it will use PWM to generate
    tones.Initializing the Timer1 for PWM to the piezo-element.


    We initialize Timer1 to generate a PWM waveform as follows:


    We set Timer/Counter Control Register A, TCCR1A, so that the OC1A pin (PortB pin
    5) will be set when up counting and cleared when down counting.


    TCCR1A = (1<<COM1A1);


    We set the TCCR1B for phase and frequency correct PWM with a top value in ICR1.


    TCCR1B = (1<<WGM13);


    We set the TCCR1B to start Timer 1 with no prescaling


    sbi(TCCR1B, CS10);


    We set the Output Compare Register 1 High to 0 and Low to the value in the Volume
    variable. A lower value of Volume will produce a higher volume.


    OCRA1H = 0;


    OCRA1L = Volume;


    Generating the tone using PWM from Timer1When Play_Tune is called periodically
    by Timer0, we set the Timer1 TCCR1B, the Timer/Counter1 High and Low registers,
    TCNT1H TCNT1L , and the Input Capture Register 1, ICR1H, which in this case is
    used to set the counter top value.In Play_Tune:


    If the song calls for a pause we stop Timer1, otherwise we start itif((pgm_read_word(pSong
    + Tone) == p) | (pgm_read_word(pSong + Tone) == P)) cbi(TCCR1B, CS10); // stop
    Timer1, prescaler(1)


    else sbi(TCCR1B, CS10); // start Timer1, prescaler(1)We then load the tone value
    from the song array.


    temp_hi = pgm_read_word(pSong + Tone); // read out the PWM-valueThe Tone is an
    integer, so we get it into a temporary variable and shift it right by 8 bits and
    load that value into the high byte of the counter top. Except that we actually
    only shift it right by 7 bits to adjust it (cut it in half) to compensate for
    the use of a 2MHz system clock in this applications (for the USART) when a 1 MHz
    clock was used in the original Butterfly code.temp_hi >>= 7;


    We clear the Timer1 count.


    TCNT1H = 0; TCNT1L = 0;


    We load the counter top value high byte.


    ICR1H = temp_hi;


    Finally we load the counter top value low byte and adjust it for the 2 MHz clock.


    ICR1L = pgm_read_word(pSong + Tone); ICR1L <<= 1;


    Using the Timer0 interrupt to play a tune


    As mentioned above the Timer0 interrupt calls the Play_Tune function every 10
    ms. We set up the Timer0 much as we’ve seen before:


    // Enable timer0 compare interrupt TIMSK0 = (1<<OCIE0A);


    // Sets the compare value OCR0A = 38;


    // Set Clear on Timer Compare (CTC) mode, CLK/256 prescaler TCCR0A = (1<<WGM01)|(0<<WGM00)|(4<<CS00);


