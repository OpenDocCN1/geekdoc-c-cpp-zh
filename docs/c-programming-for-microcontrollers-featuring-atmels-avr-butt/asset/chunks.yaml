    **章节引言**\n\n编程与微控制器是两个宏大如大陆的课题——若将二者结合，就如同从阿拉斯加徒步到火地岛般容易迷失方向。除非土著没啃食你化脓的水泡（那场景足以让人想蹲地生闷气），否则你很可能彻底迷路——要知道我在这条路上摸爬滚打太久，以至于隐喻土壤里都刻上了专属车辙；我能指出每块硌脚的尖石、抽脸的树枝、挡路的灌木丛和突袭的捕食者。（此刻）您脑海里浮现的是个衣衫褴褛蹒跚穿行于丛林的流浪汉形象吧？现在请把本书视为一次神秘又危险的旅程中的路线指南+说明书+急救包组合套装。强烈推荐获取《程序设计语言》第二版（Kernighan\
    \ & Ritchie 著，后文简称 K&R）作为权威参考。\n\n![]()\n\n站在肯·汤普森身旁的原 Unix 发明者在贝尔实验室用 PDP 设计操作系统时选择遵循组织结构差异在于其机器独立性给出大量基于文本处理的例子而此处专用于\
    \ AVR 微控制器的则不同这正是为何在黑暗年代软件开发只能依赖特定汇编语言的字符基助记符替代数值代码举例来说与其写: load value memory\
    \ location 不如写此类语句后期实验验证信我绝对生产效能大步提升但设备绑定方式使精通技能一旦更换芯片族便作废通用编译环境能抽象计算机底层概念提供可读逻辑方案轻松跨平台迁移理解更快维护更易复杂度随新硬件任务增长逐渐被称为复杂指令集多数情况下某些令人抓狂的设备拥有繁复指令难以判明高效实现途径直到天才设计师发现核心精简处理器仅靠少数操作就能高速低耗并易于开发由此诞生精简指令但其代价是需额外步骤复合运算对比劣势如今价格瓶颈完全无关痛痒因编译器已代劳生成虽承认两者军备竞赛更像宗教圣战而非技术讨论最终救赎之法见仁见智兄弟支持架构保留正是助推\
    \ IAR 优化的关键因素不再赘述理由多年经验接触 Intel Motorola Zilog Microchip 等产品若非客户给够预算小心狂热粉令昂贵开发工具蜂拥而至免费版本大多受限精巧快速廉价的电路确实能用真正无懈可击的开源系统嘛反正从未现世大不了再不用罢了毕竟不喜欢改装器件就当花千元买了片像样的评估主板本章收工。\n"
- fmt: "\n所需组件总价不到40美元（参见附录1：项目套件）。你花10倍的价格都买不到比这更好的开发系统，即使付出100倍的价钱也未必能获得同等品质。好吧，或许我是个狂热分子。\n\
    \n## 目标\n\n我希望通过本书帮助你学习特定微控制器上的C语言编程，并为你提供足够的基础知识，让你能够独立地在遍布世界的众多微控制器和C编程系统中游刃有余地探索。（“plethora”这个词是不是很酷？快说十遍试试！）\n\
    \n无论是C语言还是微控制器的学习，“动手实践”都是最佳途径。我尽力提供既有用又能促进学习的项目——但必须承认早期有些项目确实比较无聊设立它们主要是为了帮你掌握`C`的语法和方法。\n\
    \n### 建议预备知识：\n\n-  你应该会使用Windows应用程序。\n-  你需要具备基础的电子学知识；如果暂时不够也没关系当遇到像给LED接导线需要串联电阻这样基础原理不了解时可以边操作找相关教程补充即可。“我想表达的是其实要真心愿意跟着进度研究些资料懂一些基本概念比如为什么点亮一颗发光二极管必须要加装限流元件……”。）\n\
    *   关于这本教材应该涵盖什么内容收到过许多宝贵意见也是坚定的认为在接触 C for MCU领域之前必须有汇编程序设计理论基础、计算机体系结构深化以及数字逻辑电路甚至更深层次积淀才行虽然礼貌性表示异议坚持反对这些声音但也理解无论怎么准备都有可能碰到不常见的情况而止步不前正是基于此该部分描述就是先跟他们说不必等到全部掌握了再开始做些有趣的事情吧；“你会不断发现自己想要了解但我未涉及的知识点所以请保留好自己的无知的虚线框住那些不懂却好奇的地方将来再去补课。”这里大量使用了非直接相关的技术在PC上利用串口与单片机进行通讯之类的还有那个奇怪的晶体管电机驱动模块真是令人困惑…如果真的被吸引住了不妨GOOGLE搜索专题教程看看吧。)\n\
    \n---\n\n**第14页注:**  \n当你读完正文和实践后将会收获满满:  \n○中级程度了解 `printf scanf变量类型及编译机制注解等全面认知上手就会写的风格就来了包括指针宏定义枚举预处理内联函数…)\
    \ также方便后续章节展开...但实际上本节最终希望达到的水平如下:\n\n> • **能够在运用AVR时熟练掌握WinAVR工具链 **(即GCC编译器).+\
    \   \ndatasheet的复杂性会让新手望而生畏但这没关系我这本册子的另一项任务正是在浩瀚的技术手册中教你如何找出对实际操作最有意义的部分进而实现功能化的自主操控!\"\
    \n\n好啦废话不多说了第二章见!\n\n***\n\n# Chapter2引导快速行动计划指南 ————改造你的蝴蝶板迎接高清液晶显示了吗?\n\n本章节的核心目的就是在最小化配置条件下带你飞越整个启动流程并且顺势入门如何使用免费跨平台环境编写下载c程序啦..\n\
    \n***\n话说这块名为ButterFly DEMObaba小东西简直就是超值的代名词哎(目前来说没发现然后价格差不多的情况下还能集成这么多外设狗血...)我看估计本帖迟早他们要大幅亏钱甩卖给Digikey这样的分销渠道呢?作为弥补他们会开心地说这是给自家芯片培养忠实用户群积极性嘛呵呵.\n\
    \n说到内置特性绝对值得一提 :  \n\n```\n•    128字节段码LCD显示器???噢不对～具体是分段拟数字化屏幕—具体的专业说明事项尚存疑明查真理的人可参照原书引用.\n\
    •     4兆位DataFlash存储器 (相当于512KB)\n实时时钟晶振32.768KHz      \n四向摇杆 +中央确认按钮       \n\
    光照传感器          \n热敏测温单元    \nADC精确到程控采样范围贯通0~5V     \n压电蜂鸣音频输出           \n扩展排针引脚便于对接外围\
    \        \n片上RS -232电平转换专用于电脑互动通信     \n无需特殊硬件的BootLoader以支持PC直写固库存放！ \n出厂自带演示程序带源码且附带安全别扣你可以骄傲的把这款Geek神器固定衬衫上去炫耀一番……\n\
    厨房洗菜盆也都全了简直是逆天大礼包！！！←此处为吐槽比喻彩蛋 。\n``` \n\n除此之外盒子正面的说明书步骤足以帮助你立即享受所有预制实例的功能 ;在这之前高效把玩她件事儿---然后轻轻松松过渡至高级环节不易惨遭意外喔.'否则哭天喊娘只能滚回DialogKey下单重购','一想到每天有多少小白不忍之心弄得又是融化又被水淹还要咖啡淋洒还是非常触目惊心的【没错今早我也是这么过来的\
    \ T_T’】.\n\n\n\n最后省钱提示代替零售整机搭售的现象----根据第一份零部件清单自己在各大元器件网站自行采购相应的配件可以减轻经济压力的同时又锻炼手工能力随时逛逛我的个人网址(smileymicros.com)说不定会有大乐子哦莫过于倒闭打折清仓什么的哈哈)。\n\
    \n若出门买了E-book版的话可以直接去下列位置抓取这两款IDE构建自身研发基石 :\n\n· Winavr诊断版本采用20040404.md仍以此为准(\n\
    http://sourceforge.net/projects/winavr\n)。\n· Atmel官网上找到Avrstuido v411配合最新更正的后来可能出现偏差就用我看到的数据处理形式替代就可以了以后期smiley官网资源更新对照指引配置文件匹配书本为好除非另有其他通知....\n\
    \n另安装过程当中保持靠默认路径就可以免得起冲突兼容好比练功自信修炼成功后再升级日新月异免得影响本次阅读质量祝我们也祝你早日获真经！\n\n"
  raw: 'needed components can be had for less than $40.00 (See Appendix 1 Project
    Kits). You can’t get a better development system for 10 times this price and you
    can pay 100 times this and not get as good.Okay, maybe I am a zealot. GoalsWhat
    I hope to accomplish is to help you learn some C programming on a specific microcontroller
    and provide you with enough foundation knowledge that you can go off on your own
    somewhat prepared to tackle the plethora (don’t you just love that word, say it
    10 times real quick) of microcontrollers and C programming systems that infest
    the planet.Both C programming and microcontrollers are best learned while doing
    projects. I’ve tried to provide projects that are both useful and enhance the
    learning process, but I’ve got to admit that many of the early projects are pretty
    lame and are put in mainly to help you learn C syntax and methods.Suggested Prerequisites:


    • You should be able to use Windows applications.


    • You should have an elementary knowledge of electronics, or at least bewilling
    to study some tutorials as you go along so that you’ll know things like why you
    need to use a resistor when you light up an LED.• I’ve received lots of suggestions
    about what needs to be in this book. Some folks are adamant that one must first
    learn assembly language and microcrocontroller architecture and basic electronics
    and digital logic and bla bla bla before even attempting C on microcontrollers.
    I politely disagree and say that you should just jump right in learn whats fun
    for you. You’ll run across lots of stuff that you will want to learn about, but
    I won’t cover in the book so you should be able to bracket your ignorance (and
    mine) making a note when you hit something you don’t know but would like to. Then
    you can learn it later. I’m using lots of things that aren’t directly relevant
    to C programming (like communicating with a microcontroller from a PC using a
    serial port or like what the heck is that transistor motor driver thingee…). If
    you get really curious, then GOOGLE for a tutorial on the topic.14 Chapter 1:
    Introduction


    By the time you complete the text and projects you will:• Have an intermediate
    understanding of the C programming language.


    • Have a elementary understanding microcontroller architecture.


    • Be able to use the WinAVR and AVR Studio tools to build programs.


    • Be able to use C to develop microcontroller functions such as: o Port Inputs
    and OutputsoRead a joystick o Use


    timers o Program a Real


    Time Clock o


    Communicate with PCo Conduct analog to digital


    and digital to analog


    conversionso Measure


    temperature, light, and


    voltageo Control motors o Make


    musico Control the LCD


    o Flash LEDs like crazyOn the CD you will find the ATMEL ATMEGA169 data book.
    At 364 pages, it is the comprehensive source of information for the microcontroller
    used on the AVR Butterfly board. Open it on your PC with Adobe Acrobat and look
    around a bit: intimidating isn’t it? But don’t worry; one of the purposes of this
    text is to give you enough knowledge so that you can winnow the wheat from the
    chaff in the data book and pull out what you need for your C based control applications.I
    know how easy it is to get bogged down in all the detail and lose momentum on
    this journey, so we’ll begin with the ‘Quick Start’ chapter by learning only enough
    to make something interesting happen: kind of a jet plane ride over the territory.
    Then we will proceed at a comfortable pace from the simple to the complex using
    as interesting examples as I can come up with. I’m partial to LEDs so you are
    going to see a lot of flashing lights before we are through, and hopefully thelights
    won’t be from you passing out from boredom and boinking your head on the keyboard.Chapter
    2: Quick Start GuideThe purpose of this quick start guide is to help you modify
    the Butterfly hardware so you can use it as a development board and to show you
    how to use the FREE software for writing and compiling C code and downloading
    it from your PC to the Butterfly.The AVR Butterfly is an evaluation kit for the
    ATMEGA169 microcontroller that was custom designed with an AVR core and peripherals
    to make it both a generalpurpose microcontroller and an LCD controller. This little
    board is by far (at this writing) the lowest cost system for learning and developing
    that I’ve ever seen. I don’t know how much these things cost them to make, but
    Digi-Key (www.digikey.com) sells them for $19.99 (Spring 2005), which has to be
    a real loss leader for ATMEL (www.ATMEL.com). But their loss is our gain, and
    I’m sure they are happy to prime-thepump a little, knowing that we’ll get hooked
    on the AVR and buy lots of their product.It is simply amazing what the Butterfly
    has built in:• 100 segment LCD display


    • 4 Mbit (that’s 512,000 bytes!) dataflash memory


    • Real Time Clock 32.768 kHz oscillator


    • 4-way joystick, with center push button


    • Light sensor


    • Temperature sensor


    • ADC voltage reading, 0-5V


    • Piezo speaker for sound generation


    • Header connector pads for access to peripherals


    • RS-232 level converter for PC communications


    • Bootloader for PC based programming without special hardware


    • Pre-programmed demos with source code


    • Built-in safety pin for hanging from you shirt (GEEK POWER!)


    • Kitchen sink.I mean this thing has everything (except a kitchen sink… sorry).
    If anyone can find a development platform with anywhere near this much for this
    price, I want to hear about it. And, no, I don’t own stock in ATMEL, or work for
    them, I just couldn’t find anything that comes close to this system for my goal
    of teaching C programming for AVR microcontrollers (or any microcontrollers for
    that matter). If I seem to be raving a bit, get used to it, I do that a lot.There
    are sufficient instructions on the AVR Butterfly box to show you how to use all
    the built-in functions. Play with it now before you risk destroying it in the
    next step. Don’t say I didn’t warn you. If you break it, you’ll have to order
    a new one from Digi-Key (www.digikey.com). I shudder to think how many of these
    things will get burned up, blown up, stepped on, and drenched in coffee. And that’s
    just me this morning.Note: in order to save you money, rather than selling you
    the Butterfly and the experiments kits, you will find a parts list (Appendix 1)
    so that you can buy this stuff directly from the vendors. But check my website:
    www.smileymicros.com , no telling what you’ll find. (Hopefully, not a ‘going out
    of business’ sale.)If you purchased the e-book, you can download the WinAVR software
    from http://sourceforge.net/projects/winavr (this book uses version 20040404)
    and the AVRStudio software from the http://www.atmel.com web site. On the ATMEL
    website search for the AVRStudio version 4.11 (later versions may not correlate
    to this book). If, for some reason, these sites are not available (I can’t guarantee
    what they’ll do to their sites) look on the http://www.smileymicros.com website
    for updated information on how to get the software. If you purchased a hard copy
    of the book, you will find the software on the accompanying CD.Don’ t get bogged
    down in all the installation choices given, just accept suggested defaults so
    your installation will match this book. And, as an aside, by the time you install
    all this software, the WinAVR and the AVRStudio will have new and improved versionsavailable
    on their web sites. DON’T USE THEM! This text is based on the versions on the
    CD or on the SmileyMicros.com web site and using the new and improved software
    may only confuse things. Of course, by the time you finish this text, you will
    be encouraged to get the latest and greatest, by then you’ll know all you need
    to use it wisely.Software'
