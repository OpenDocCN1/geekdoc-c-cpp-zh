- fmt: "\n# Microcontroller Ports and Number Systems\n\n在微控制器应用中，我们经常需要处理字节大小的端口状态，例如`Port\
    \ D`。端口是船舶进出之地；而在微控制器中，它是可以读取或设置外部电压（0V 或 3V）的地方。\n\n我们对端口使用二进制和十六进制数，因为将端口数据视为十进制数既繁琐又不直观：快说，“66”在我们的\
    \ LED 上会显示什么？再试试“01000010”？由于 `01000010 = 66` ，你明白我的意思了吧？我猜你也领会到了本节开头的玩笑。\n\n\
