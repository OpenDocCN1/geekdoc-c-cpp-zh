    8: C Pointers and ArraysAddresses of variables


    During the stone age of computers, when C was written, programming was done by
    positioning switches and looking at lights.


    ![](image_rsrc3FM.jpg) Figure 26: The PDP-11 could be programmed by switches,
    though Dennis Ritchie used a Teletype machine to write the C programming language.One
    set of switches represented data another represented the address of a memory location
    that you wanted to stick the data. Addresses are sequential and represent contiguous
    memory locations.


    I once hand built an 8051 microprocessor ‘system’ with SRAM memory attached to
    huge lantern battery (SRAM forgets if the power goes off) and switches attached
    to the data and address ports. I would set a data byte then set an address (two
    bytes) and push a button to write the data to the SRAM. When it was all loaded,
    I pressed another button to start the 8051\. I bet you can guess what I had the
    program do. That’s right: blink LEDs. Later I wrote a program that allowed the
    8051 to communicate with an original IBM PC and download large programs from the
    PC, and once loaded – run them. I carefully wrote my primitive bootloader on paper
    in assembly language, then translated it from assembly to machine code, then hand
    entered it. The bootloader was only 81 bytes long. I bragged about this incessantly
    and saw many a set of eyes glaze over. Anyone who knew anything about what I was
    doing suggested, after rolling his eyes to clear the glaze, that I get an EPROM
    programmer and write my code on a PC, like a normal person. They just didn’t get
    it -- I wanted to design the cheapest possible system and factored in my time
    as equal to zero dollars. Some of us prefer to do things the hard way if something
    is to be learned and I learned beyond any doubt just how hard it is to correctly
    enter 81 lousy bytes on a hand made computer. Fortunately for me I’m too darn
    stubborn to admit defeat and made the thing work until I accidentally disconnected
    the battery and had to reenter all the data. 81 bytes may not seem like much until
    you try to enter them and their addresses in binary on DIP switches. After all
    the cursing died down I retired my machine, bought an EPROM programmer, and joined
    the real world.That experience more than any other, burned into my mind the relation
    of data and addresses, a seemingly trivial relation until you get to C where this
    topic causes more confusion and bugs than any other.Data is stored in memory locations
    – real tangible things made of silicon. These locations have addresses– information
    about the whereabouts of memory locations. Memory is a place. Addresses tell us
    how to find the place. Sometimes confusion occurs when we realize that addresses
    are just numbers and can become data that can be stored in memorylocations having…
    addresses. The data at one memory location can be the address of another memory
    location whose data may or may not be an address. Data is just a number, in our
    case an 8-bit byte. When the data is the address of another location of data it
    is called a pointer. This might seem simple, but pointers can become so confusing
    and error prone that many higher programming languages won’t let the programmer
    touch them. This ability'
