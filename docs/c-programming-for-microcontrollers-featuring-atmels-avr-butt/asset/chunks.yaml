    _MMIO_BYTE((0x05) + 0x20) is (*(volatile uint8_t *)((0x05) + 0x20))


    yields:


    ((*(volatile uint8_t *)(((uint16_t) &((*(volatile uint8_t *)((0x05) + 0x20))))
    )) |= (1 << (5)))


    What we wrote was:


    sbi(PORTB, 5); // set OC1A high


    What the compiler sees is:


    ((*(volatile uint8_t *)(((uint16_t) &((*(volatile uint8_t *)((0x05) + 0x20))))
    )) |= (1 << (5)))


    Aren’t you glad you aren’t a compiler?


