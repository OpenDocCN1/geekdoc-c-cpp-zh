  raw: '} u;Bit-fieldsANSI C defines bit-fields as a member of a structure or union
    that is defined to beANSI C defines bit-fields as a member of a structure or union
    that is defined to be bit nibble, or any number of bits you might want to define.
    These fields can be very useful, but unfortunately, in many microcontrollers,
    these bit-fields slow things down (the compiler promotes bit to larger data types)
    so for efficiency sake, bits are best dealt with using bit masking, which compiles
    to faster and smaller assembly code. Bit masking simply uses a constant to define
    the position of a bit in a byte and allows you to read or write only that bit
    using the bitwise operators. We will look at the C-way, since we are learning
    C, then the mask-way since we want to be as efficient as possible.Bit-Fields the
    C-wayIn our examples above we have often declared an object as an unsigned char
    when that object could only have two values: TRUE or FALSE. Using bit-fields we
    can declare eight similar variables in a single unsigned char (note– not true
    for WinAVR, which promotes them to eight bytes).We could define:


    unsigned char calibrate = FALSE;


    to control a loop:


    while(!calibrate) { // do something while calibrate == FALSE};which runs as long
    as calibrate equals FALSE. We could have used: struct { unsigned int calibrate


    : 1; unsigned int this : 1;


    unsigned int that : 1; unsigned


    int the : 1; unsigned int other :


    1; unsigned int tobe: 1; unsigned


    int or!tobe : 1;unsigned int hello : 1;


    } flags;


    Setting aside 8 flags in the space formerly used by calibrate. Now we control
    the loop:


    while(!flags.calibrate)That is, we could have done this in an ideal world. In
    the real world, our compiler would allow us to use the above syntax, but would
    assign 8 bytes to do the job. K&R notes: “Almost everything about fields is implementation
    dependent.”Bit-fields the masking-way


    This is mostly a review of stuff presented with the bitwise operator section,
    but reviews are good. Let’s look at a bit-masking example from OSCCAL.C:


    We define an alias name for the Timer/Counter 2 Interrupt Flag Register:


    #define TIFR2 _SFR_IO8(0x17)


    Noting that the _SFR_IO8(0x17) is itself an alias defined elsewhere, but eventually
    is aliased to a specific register address on our ATMEGA169.


    We next define two ‘bitfields’ in the TIFR2 register;


    #define OCF2A 1 #define TOV2 0


    Next we write a function that causes our code to wait for the timer2 compare flag,
    OCF2A, which is bit one of the Timer/Counter2 Interrupt Flag Register:


    while ( !(TIFR2 && (1<<OCF2A)) );// wait for timer2 compareflag


    So this usage will do the same as a bit-field, but with greater efficiency.Let’s
    look at another example where we assign Port B to a ‘bit -field structure’ without
    using bit-fields or structures. First we get the address of the Port B registers
    from io169.h which also has defines for each bit./* Port B */


    #define PINB _SFR_IO8(0x03) #define DDRB _SFR_IO8(0x04) #define PORTB _SFR_IO8(0x05)
    #define PB7 7


    #define PB6 6


    #define PB5 5


    #define PB4 4


    #define PB3 3


    #define PB2 2


    #define PB1 1


    #define PB0 0In the Butterfly software main.c file, the initialization function
    has:


    PORTB = (15<<PB0); // Enable pullup onAnd we ask, what’s with the 15? Well, 15
    in hex is 0xE which in binary is 1110, so since PB0 == 0, what we are doing is
    setting PORTB equal to 00001110 << 0, remembering that ‘<<’ is the left-shift
    operator we know that we actually aren’t doing anything, or rather we are left
    shifting 15 zero times, which is doing nothing ifI’ve ever seen nothing, which
    I haven’t but… back to our story, we are setting PORTB pins 1, 2, and 3 to 1 thus
    enabling the pull-ups on port B pins 2, 3, and 4\. And that ends this discussion.


    This alternative bit-field technique is a compromise between the K&R way of doing
    things in C and the machine efficient way of doing things in C for microcontrollers.Projects
    Finite State MachineI initially thought about naming this section “Finite State
    Machines, Lions, Tigers, and Bears… Oh My!” because the topic seems a bit scary.
    And I must admit that there are graduate level Computer Science courses taught
    on this subject, so it can get very scary indeed. But, fortunately for us, the
    fundamental concepts that we will use are fairly easy to grasp,and we don’t need
    to go to great depths to get what we need.The basic ideas behind finite state
    machines are used to tame systems that seem impossibly complex. A computer is
    a finite state machine. At any given moment the computer state is defined bya
    bunch of transistor states, off or on, 0’s and 1’s. The computer inputs a set
    of 0’s and 1’s, from some external source, checks its current state and changes
    both the current state and the output state based on the current state and the
    input state.Actually you and I can be seen as state machines. Right now my state
    is ‘typing’. If my ears input the sound of a screeching tiger my state will change
    to ‘running like hell.’ And, if my ‘running like hell’ state isn’t >= the tigers
    ‘running like hell’ state, my future state may sequence through ‘being lunch’,
    being digested’, and ‘being tiger poop.’When you think about it, the Butterfly,
    as simple as it is, does a lot of stuff. How does the software keep track of what
    it is doing? How does it know to keep doing it? How does it know when to do something
    different? And how does it know what to do next?Say the Butterfly is outputting
    a value on PORTD and you diddle the joystick, how does it respond to being diddled?
    You may recall this switch statement from Chapter 5.switch(input){


    case KEY_PLUS : PORTD = ~0x01; break:case KEY_NEXT :PORTD = ~0x02; break; case
    KEY_PREV :


    PORTD = ~0x04; break; case KEY_MINUS :


    PORTD = ~0x08;


    break;


    case KEY_ENTER :


    PORTD = ~0x10;


    break;


    default:


    }This is a state machine. The current state is the value of PORTD. The input is
    the joystick position. The case statement for the specific joystick input sets
    the next state in PORTD. If this switch statement is enclosed in a for(;;){}block,
    the Butterfly’s states and transitions are all known, so the possibilities are
    finite and you have yourself a finite state machine. What could be simpler? (Usually
    said right before things get complex.)But, of course, the Butterfly out of the
    box does a lot of stuff. And it has a lot of state machines controlling its behavior.
    One is the menu state machine, which is really the core state machine as far as
    a user is concerned. Here is an illustration of the Butterfly menu structure:![](image_rsrc3NR.jpg)
    Figure 39 Butterfly MenuAt one moment the Butterfly may be scrolling the LCD with
    your name. Then you click the joystick down and it shows you the time. It needs
    to keep some sort of data set that contains what it is doing now and how to react
    to inputs and what to do next based on what is doing now.We can think about input
    stimulated state transitions like this:If I am doing A_state and if A_input


    happens, then I enter Q7_state else if B_input happens, then I enter YM_stateelse
    if C_input happens, then I enter X15_state // and so on


    else if XXX_input happens, then I enter Mental_stateIf I am doing B_state and
    if A_input happens, then I enterB_state else if B_input happens, then I enter
    A_state else if C_input happens, then I enter Y_state


    // and so on


    and XXX_input happens, then I enter Pros_state// and so onIf I am doing XXX_state
    and if A_input happens, then I enter Alpha_state else if B_input happens, then
    I enter Beta_stateelse if C_input happens, then I enter Gamma_state // and so
    on'
