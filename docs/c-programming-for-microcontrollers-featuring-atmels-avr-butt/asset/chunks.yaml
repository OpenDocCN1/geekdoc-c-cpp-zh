  raw: 'Assembly language programmers frequently use the stack when calling subroutines
    and running algorithms.Stacks are like those piles of trays in cafeterias, we
    take trays off the top and the dishwasher piles them back on the top. The top
    trays are usually wet and the bottom trays never get used. It is important to
    us that the we never try to use the tray below the bottom tray because it doesn’t
    exist, the analogy breaks down and we have a blown stack, as shown earlier when
    we discussed how C uses a stack when calling functions. Sometimes you’ll see ‘fifo’
    to refer to these kinds of stacks, fifo stands for ‘first in first out’. In control
    applications it is sometimes convenient to have fifos, private stacks, to manipulate
    data.#define STACKSIZE 100 unsigned char myStack[STACKSIZE]; // create a data
    stack char stackCount = 0;


    unsigned char myValue = 0; // create a byte variable


    // Do some controlling


    // push a byte on the stack if (stackCount++ < STACKSIZE) // don’t blow your stack*myStack++
    = myValue;


    else


    error(“You almost blew your stack! - overflow”);// Do some more controlling//
    pull a byte off the stack if(stackCount-- > 0) //don’t blow itvin the other directon
    myValue = *--myStack;


    else


    error(“You almost blew your stack! - underflow” );Queues (Circular Buffers)


    If stacks are like lunchroom trays, then queues are like the line of students
    waiting to get a tray. The last one in line is the last one to get a tray. A circular
    buffer is more like a game of hot potato where the students form a circle and
    pass a hot pototo from one to the next and it keeps circulating indefinitely around.
    The hot potato in our analogy is actually the pointer to the next address in the
    queue. For real students it would probably be a joint or a bottle of cheap alcohol.#define
    QUEUESIZE 100unsigned char myQueue[QUEUESIZE]; // create a queue unsigned char
    *nextInQueue; //define a pointer to an unsigned char char queueCount = 0;unsigned
    char myValue = 0; // create a byte variable


    NextInQue = myQueue; // set pointer


    // Do some controlling


    // Put a byte in the queue


    if(queueCount++ < QUEUESIZE)*nextInQueue++ = myValue;//load myValue and incr pointer
    else{ // circle the buffer


    nextInQueue = myQueue; // reset pointer


    queueCount = 0; // reset counter


    *nextInQueue++ = myValue; //load myValue and incr pointer }// Do some more controlling
    // Get the oldest byte from the queue if(queueCount < QUEUESIZE)


    myValue = *NextInQue + 1;


    else // we’ve reached the end so circle around myValue = myQueue[0];


    Function PointersFunctions are not variables, but we can define pointers to them
    anyway. The question is: ‘why would we want to?’ The answer is that sometimes
    it is convenient to keep a list of functions that we can choose based on the functions
    position in the list. (Uhhh…….)We can declare a pointer to a function as follows:


    char (*pStateFunc)(char);


    which says that pStateFunc is a pointer to a function that takes a char as a parameter
    and returns a character when finished.


    If we have another function declared:


    char anotherFunction(char);


    We can set the pointer as follows:


    pStateFunc = anotherFunction;


    Now: char returnChar, sendChar;


    sendChar = ‘!’;


    returnChar = anotherFunction(sendChar); returnChar = pStateFunc(sendChar);


    both calls work exactly the same.This may seem about as useful as a bicycle for
    fish, but you’ll see a good example in our discussion of state machines (oooh,
    oooh, I can hardly wait), in the meantime, try to hold this in your head until
    we get there.Complex Pointer and Array AlgorithmsC is an ideal language for solving
    complex data processing and scientific computing problems. Many a computer scientist
    has made a living being clever and publishing the results. Which is good for us,
    because almost any complex problem we will come across has already been solved
    for us. Whether its sorting a database or doing a really fast Fast Fourier Transform,
    the algorithm will be published somewhere convenient. Try googling ‘C FFT’ to
    see what I mean. Even if you have lots of time and enjoy solving puzzles, you
    aren’t likely to develop a better solution than you can borrow. It’s your call.I
    hereby declare further pointer discussion to be ‘advanced’ and beyond the needs
    of our study. Take a look at the last half of K&R’s chapter on Pointers and Arrays
    and you’ll thank me.


    ProjectsMessenger Arrays in RAM and ROMMicrocontrollers have limited memory, especially
    RAM, Random Access Memory. ROM, Read Only Memory, is much cheaper to make, so
    there is usually a lot more ROM than RAM. The AVR microcontrollers have a type
    of memory that is somewhat intermediate between RAM and ROM called Flash ROM.
    It functions like ROM, but can be rewritten using special hardware and software
    functions.RAM is like money and beauty, you can never have too much of it, but
    in microcontrollers you can often have too little: alas, microcontrollers are
    ugly and poor. C programs require RAM. You can write assembly programs that can
    be burned into ROM, and run on microcontrollers that have no RAM, but C requires
    RAM to keep a stack for parameters and return addresses and to store arrays, among
    other things. [The AVR is a special case in that it has 32 general purpose registers
    that can be used as RAM for very tiny and carefully written C programs, so it
    is possible to write C programs for AVR devices with no ‘RAM’, but that’s another
    story.]When we define an array of constants we should be able leave it in ROM,
    since the elements are constants and we won’t need to change them. But our C compiler
    puts arrays in the data section of RAM. If we have lots of constant data in arrays,
    say strings, or conversion factor tables, or timing and tone data for songs, we
    are going to needlessly lose a lot of RAM.The following is an example of how to
    store a string and an array in flash ROM, and keep it there:


    const char ERROR_YOUFOOBARED[] PROGMEM = "You fouled up beyond repair.\r\0";The
    PROGMEM modifier is not C and is specific to the WinAVR compiler. The AVR has
    special Load Program Memory, LPM, instructions to get data from the flash ROM,
    but this is not C and needs to be wrapped with some code to make its use C-like,
    which is what the PROGMEM does. The details get more complex than we want right
    now so just thank the guys who figured this out for you by sending them some money
    at: http://www.sourceforge.net/donate.We send this string to the PC by defining
    a sendFString function:// Send a string located in Flash ROM void sendFString(const
    char *pFlashStr) {uint8_t i;// The ''for'' logic terminates if the byte is ''\0''
    or if i = 60\. // ''\0'' is ''null'' and terminates C strings


    // The 60 prevents too much overrun if we get a bad pointer // and it limits the
    string size


    for (i = 0; pgm_read_byte(&pFlashStr[i]) && i < 60; i++){


    sendChar(pgm_read_byte(&pFlashStr[i])); } }


    The function takes a constant character pointer as an argument. We can send a
    string as follows:


    sendFString(&ERROR_YOUFOOBARED[0]);


    which explicitly shows that we are sending the address of the first element in
    the array. Or we could use the simpler:


    sendFString(ERROR_YOUFOOBARED);which is exactly the same thing since the ERROR_YOUFOOBARED
    is a constant character pointer to the sonamed array. (Aren’t you glad I didn’t
    say ‘eponymous array’?).Using an array of pointers to arrays.The first time I
    saw an array of pointers to arrays I thought somebody was either putting me on
    or trying to obfuscate the code for job security. But I’ve learned that, complex
    as it sounds, it’s actually a useful programming technique. Let’s define a set
    of arrays:const char ERROR_YOUFOOBARED[] PROGMEM = "You fouled up beyond repair.\r\0";


    const char ERROR_SNAFUED[] PROGMEM = "Situation normal, all fouled up.\r\0";'
