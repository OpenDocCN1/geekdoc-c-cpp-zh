- fmt: "\n# Chapter 7: Microcontroller Interrupts and Timers\n\nInterrupts and timers\
    \ are critical to microcontroller applications, but they have nothing to do with\
    \ the C programming language. I can’t think of a good way to progressively discuss\
    \ `C` and smoothly mix in these topics so we will stop with the `C` for a while\
    \ and look at our hardware. Interrupts and timers will be helpful in making later\
    \ projects more useful.\n\n`C` knows nothing about interrupts or timers. These\
    \ things are machine dependent and specific. While the general concepts will apply\
    \ to other microcontroller families, the specifics are for the AVR family and\
    \ specifically for the ATmega169.\n\n## Interrupts\n\nWe usually use one of two\
    \ methods in microcontroller software to check if an event has occurred: polling\
    \ (通常是一个无限循环在 main() 中检查事件是否发生) 和 interrupt。例如，它可能会检查引脚6电压是+3还是0（逻辑真或假），如果是+3做一件事，如果是0做另一件事。\n\
    \n从硬件角度看，当某个感兴趣的管脚状态发生变化时（比如從 +3v下降到 0v），中断函数就会被调用。这类似于日常生活中的电话铃声打断你的活动：如果你必须轮询才能接到电话该多痛苦——所以通过中断机制可以让处理器立即响应重要事件而无需持续检测。\n\
    \nMicrocontrollers respond much like you would when reading a book interrupted\
    \ by phone call—you scratch mark next line read before closing it finish fire\
    \ garage desecrations go right back where left off from earlier point perspective\
    \ causes store sufficient data later get what was doing see which happened run\
    \ restore state using previously stored great provide avenue some particularly\
    \ pernicious bugs example code integer memory since made bytes gets first then\
    \ stopped that changes value returning control part reads second half preinterupt\
    \ post-interupped crazy making debugging problem happen anytime maybe only rarely\
