  raw: 'What is Analog to Digital Conversion?During a discussion with one of my EE
    professors about Analog to Digital Conversion, I made the mistake of bringing
    up Heraclitus and Democritus and the ancient debate about the fundamental nature
    of reality: is reality made of a continuum of a single thing (analog) or of bits
    of multiple things (digital). He shook his head, as my profs often did, and said,
    “Son, I don’t give a damn what some sheep header said 3,000 years ago, this IS
    an analog world!” Humpf! I say it Chapter 9 – Digital Meets Analog – ADC and DACdepends
    on your perspective. To electronics, Heraclitus was right and the world is analog
    and you can’t step in the same river twice since the only constant is change.
    To computers, Democritus was right, the world isdigital (well, he said atomic,
    but it’s the same thing philosophically speaking) and you can theoretically step
    in the same river twice if you arrange the atoms (bits) of the river the same
    way.Another professor of mine, also shaking his head, said, “Son, a difference
    that makes no difference is no difference!” So Let’s drop this right here and
    say that the world we want to control is analog and the world we will use to control
    it is digital, and somewhere up there in philosopher heaven Heraclitus and Democritus
    can give each other a big hug.Analog to Digital Conversion by Successive ApproximationWe
    want to measure voltage, and in the real world, voltages can be any value whatever,
    they represent a continuum of electromotive force. There are many ways to convert
    an analog signal to a digital value each having strengths and weaknesses, we will
    examine successive approximation since that is what the AVR uses.Analog Input


