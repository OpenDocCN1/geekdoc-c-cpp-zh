  \nBCD 是一种编程技巧 ，可以简化对二进制数的存储与转换过程：（比如将一个累计晶振脉冲次数的计数值转变为适合显示于液晶屏上的形式 ）。一个 8 比特字节可以被分为两个四位半字--每个都可以表示\
  \ 0 至 15 之间的值 ----这也是前面提到为什么常常采用十六进制记法的原因之一 ；利用这样的思路 ,同一个单字节内可以用不同位置存放两位单独有效的整数\
