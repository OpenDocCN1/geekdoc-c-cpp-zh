  \ 结构基础\n\n结构体是一组变量的集合，这些变量可能属于不同类型，但它们都共同归属于同一个名称之下。它们类似于其他编程语言中的记录类型，构成一个便于处理的数据单元。这种便利性在大型程序中非常有用，因为它允许我们将相关变量分组在一起作为“一族”而非个体来处理。\n\
  \n例如：\n\n```\nstruct Pardue {\n    string Joe = \"Joe\";\n    string Clay = \"Clay\"\
  ;\n    string Beth = \"Beth\";\n}\n```\n\n将 `Joe`、`Clay` and `Beth`  全部归入 Pardue\
  \ 家庭这个结构中；根据使用方式的不同我们可以在软件中通过类似这样来引用表示我:`Joey．帕杜/Joe·V2 →\"Jose'->\"\"的确实际习惯了!!然后另一个常见情形他们反过来像是别名那样加以对待得到完整的充实体!\"\
