  \n无论是 C 语言还是微控制器的学习，“动手实践”都是最佳途径。我尽力提供既有用又能促进学习的项目——但必须承认早期有些项目确实比较无聊设立它们主要是为了帮你掌握`C`的语法和方法。\n\
