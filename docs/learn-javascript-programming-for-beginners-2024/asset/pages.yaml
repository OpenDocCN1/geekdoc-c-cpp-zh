  md: "# The Prototype Pattern\n\nJavaScript is a prototype-based language, and every\
    \ object in JavaScript has a hidden [[Prototype]] property that's used for inheritance.\n\
    \nHere is an example of the prototype pattern:\n\n```\nfunction Person(firstName,\
    \ lastName) {\n  this.firstName = firstName;\n  this.lastName = lastName;\n}\n\
    \nPerson.prototype.getFullName = function() {\n  return this.firstName + '' +\
    \ this.lastName;\n}\n```\n\n```\nvar person1 = new Person('John', 'Doe');\nconsole.log(person1.getFullName());\
