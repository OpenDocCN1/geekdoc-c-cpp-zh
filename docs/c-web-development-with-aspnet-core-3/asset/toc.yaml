  - 探索高级 ASP.NET Core 3 特性
- - '##'
  - 依赖注入 (DI)：
- - '###'
  - 依赖注入的好处：
- - '###'
  - 1. 可测试性：依赖注入通过允许你轻松用模拟对象（mock objects）或存根（stubs）替换依赖，简化单元测试。这更容易隔离并测试单个组件，从而提高了应用程序的可测试性。
- - '###'
  - 2. 模块化：依赖注入通过将复杂的系统分解为更小、更易控制的元素，促进模块化设计。这使得代码库随着时间的推移更容易理解、维护和演进。
- - '###'
  - 3. 可重用：依赖注入通过使组件独立于特定的实现，促进了组件的重用。这允许你在应用程序的不同部分甚至在完全不同的应用程序中重用组件。
