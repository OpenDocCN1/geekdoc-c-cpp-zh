- md: "\n# Chapter 6\n\n# Building Web APIs with ASP.NET Core 3\n\nIn today's interconnected\
    \ world, building Web APIs (Application Programming Interfaces) has become essential\
    \ for enabling communication and data exchange between different applications.\
    \ ASP.NET Core 3 provides a powerful framework for developing robust and scalable\
    \ Web APIs that expose data and functionality to client applications. In this\
    \ guide, we'll introduce you to the concept of Web APIs and demonstrate how to\
    \ build them using ASP.NET Core 3.\n\n## Introduction to Web APIs:\n\nA Web API\
    \ is a set of endpoints (URLs) that expose data and functionality over the internet,\
    \ allowing client applications to interact with a server and perform various operations.\
    \ Web APIs enable seamless integration between different systems, platforms, and\
    \ devices, facilitating the exchange of data in a standardized and efficient manner.\
    \ Common use cases for Web APIs include retrieving data, updating records, performing\
    \ calculations, and more.\n\n## Getting Started with ASP.NET Core 3 Web APIs:\n\
    \nTo build Web APIs with ASP.NET Core 3, you can start by creating a new ASP.NET\
    \ Core Web API project using Visual Studio or the .NET CLI. Let's create a simple\
    \ Web API project using the .NET CLI:\n\n```bash\n# Generate a fresh ASP.NET Core\
    \ Web API project.\ndotnet new webapi -n MyWebApi\n```\n\nThis command creates\
    \ a new ASP.NET Core Web API project named \"MyWebApi.\"\n\n## Creating a Controller:\n\
    \nIn ASP.NET Core Web API, controllers are responsible for handling incoming HTTP\
    \ requests and generating responses. You can create a controller to define the\
    \ endpoints and actions for your Web API.\n\n```csharp\n// Illustration of a basic\
    \ Web API controller\n\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace MyWebApi.Controllers\n\
    {\n    [ApiController]\n``````csharp\n[Route(\"api/{controller}\")]\n\npublic\
    \ class ValuesController : ControllerBase\n{\n    [HttpGet]\n    public IActionResult\
    \ Get()\n    {\n        return Ok(new string[] { \"value1\", \"value2\" });\n\
    \    }\n}\n\n```\n\nIn the above example, we've created a `ValuesController` with\
    \ a single action method `Get`, which responds to HTTP GET requests by returning\
    \ an array of string values. The `[Route]` attribute specifies the endpoint URL\
    \ pattern for the controller, and the `[HttpGet]` attribute specifies that the\
    \ `Get` method handles HTTP GET requests.\n\n## Testing the Web API:\n\nYou can\
    \ test the Web API using tools like Postman or by sending HTTP requests from a\
    \ client application. To test the `Get` action of the `ValuesController`, you\
    \ can use a web browser or a tool like Postman to send an HTTP GET request to\
    \ the following URL:\n\n```\nhttp://localhost:5000/api/values\n```\n\nIf everything\
    \ is set up correctly, you should receive a response containing the array of string\
    \ values \"value1\" and \"value2\".\n\n## Handling HTTP Verbs:\n\nASP.Net Core\
    \ Web API supports various HTTP verbs (GET, POST, PUT, DELETE, etc.) for performing\
    \ different operations on resources. You can create action methods in your controllers\
    \ to handle different HTTP verbs and perform corresponding operations.\n\n```csharp\n\
    # Example of handling different HTTP verbs in a Web API controller\n\npublic class\
    \ ProductsController : ControllerBase\n{\n    [HttpGet]\n    public IActionResult\
    \ GetAllProducts()\n    {\n        // Retrieve all products from the database\n\
    \        return Ok(products);\n    }\n\n    [HttpGet(\"{id}\")]\n    public IActionResult\
    \ GetProductById(int id)\n    {\n        // Retrieve a product by its ID from\
    \ the database\n        return Ok(product);\n    }\n\n    [HttpPost]\n    public\
    \ IActionResult CreateProduct([FromBody] Product product)\n    {\n        // Modify\
    \ a product that already exists in the database\n        return CreatedAtAction(nameof(GetProductById),\
    \ new { id = product.Id }, product);\n    }\n\n    [HttpPut(\"{id}\")]\n    public\
    \ IActionResult UpdateProduct(int id, [FromBody] Product product)\n    {\n   \
    \     // Update an existing product in the database\n        return NoContent();\n\
    \    }\n\n    [HttpDelete(\"{id}\")]\n    public IActionResult DeleteProduct(int\
    \ id)\n    {\n        // Delete a product from the database\n        return NoContent();\n\
    \    }\n}\n```\n\nIn the above example, we've created action methods to handle\
    \ different HTTP verbs for managing products. The `[HttpGet]` attribute is used\
    \ for handling HTTP GET requests, `[HttpPost]` for HTTP POST requests, `[HttpPut]`\
    \ for HTTP PUT requests, and `[HttpDelete]` for HTTP DELETE requests.\n\n## Data\
    \ Transfer Objects (DTOs):\n\nWhen working with Web APIs, it's a good practice\
    \ to use Data Transfer Objects (DTOs) to encapsulate data transferred between\
    \ the client and server. DTOs help to decouple the internal representation of\
    \ data from its external representation, improving maintainability and flexibility.\n\
    \n```csharp\n// Example of a data transfer object (DTO)\n\npublic class ProductDto\n\
    {\n    // This represents an integer identifier { get; set; }\n\n    // This declares\
    \ a string identifier { get; set; }\n\n    // This denotes a public decimal value\
    \ { get; set; }\n}\n```\n\nBuilding Web APIs with ASP.NET Core 3 allows you to\
    \ expose data and functionality for consumption by client applications. By creating\
    \ controllers to define endpoints and actions, handling different HTTP verbs,\
    \ and using DTOs for data transfer, you can develop powerful and scalable APIs\
    \ that meet the needs of modern web applications. Whether you're building a single-page\
    \ application (SPA) or providing data services for mobile apps, ASP.NET Core offers\
    \ a flexible and efficient solution.\n"
  mdcn: "\n\n# 第 6 章\n\n# 使用 ASP.NET Core 3 构建 Web API\n\n在当今互联互的世界中，构建 Web API（应用程序编程接口）已成为不同应用程序之间通信和数据交换的关键。ASP.NET\
    \ Core 3 提供了一个功能强大的框架，用于开发健壮且可扩展的 Web API，从而向客户端应用程序暴露数据和功能。在本指南中，我们将向您介绍 Web\
    \ API 的概念，并演示如何使用 ASP.NET Core 3 构建它们。\n\n## Web API 简介：\n\nWeb API 是一组在互联网上暴露数据和功能的端点（URL），允许客户端应用程序与服务器进行交互并执行各种操作。Web\
    \ API 实现了不同系统、平台和设备之间的无缝集成，以标准化且高效的方式促进了数据交换。Web API 的常见用例包括检索数据、更新记录、执行计算等。\n\
    \n## 入门 ASP.NET Core 3 Web API：\n\n要使用 ASP.NET Core 3 构建 Web API，你可以从使用 Visual\
    \ Studio 或 .NET CLI 创建一个新的 ASP.NET Core Web API 项目开始。让我们使用 .NET CLI 创建一个简单的 Web\
    \ API 项目：\n\n```bash\n# 生成一个全新的 ASP.NET Core Web API 项目。\ndotnet new webapi -n\
    \ MyWebApi\n```\n\n此命令创建了一个名为 \"MyWebApi\" 的新 ASP.NET Core Web API 项目。\n\n## 创建控制器：\n\
    \n在 ASP.NET Core Web API 中，控制器负责处理传入的 HTTP 请求并生成响应。你可以创建一个控制器为你的 Web API 定义端点和操作。\n\
    \n```csharp\n// 基础 Web API 控制器的插图\n\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace\
    \ MyWebApi.Controllers\n{\n    [ApiController]\n``````csharp\n[Route(\"api/{controller}\"\
    )]\n\npublic class ValuesController : ControllerBase\n{\n    [HttpGet]\n    public\
    \ IActionResult Get()\n    {\n        return Ok(new string[] { \"value1\", \"\
    value2\" });\n    }\n}\n\n```\n\n在上面的示例中，我们创建了一个 `ValuesController`，它包含一个单一的操作方法\
    \ `Get`，该方法通过返回字符串值数组来响应 HTTP GET 请求。`[Route]` 属性指定了控制器的端点 URL 模式，而 `[HttpGet]`\
    \ 属性指定了 `Get` 方法处理 HTTP GET 请求。\n\n## 测试 Web API：\n\n你可以使用 Postman 等工具，或者通过从客户端应用程序发送\
    \ HTTP 请求来测试 Web API。要测试 `ValuesController` 的 `Get` 操作，你可以使用网络浏览器或 Postman 等工具向以下\
    \ URL 发送 HTTP GET 请求：\n\n```\nhttp://localhost:5000/api/values\n```\n\n如果一切配置正确，你应该会收到一个包含字符串值数组\
    \ \"value1\" 和 \"value2\" 的响应。\n\n## 处理 HTTP 动词：\n\nASP.Net Core Web API 支持各种\
    \ HTTP 动词（GET, POST, PUT, DELETE 等），用于对资源执行不同的操作。你可以在控制器中创建操作方法来处理不同的 HTTP 动词并执行相应的操作。\n\
    \n```csharp\n# Web API 控制器中处理不同 HTTP动词的示例\n\npublic class ProductsController :\
    \ ControllerBase\n{\n    [HttpGet]\n    public IActionResult GetAllProducts()\n\
    \    {\n        // 从数据库检索所有产品\n        return Ok(products);\n    }\n\n    [HttpGet(\"\
    {id}\")]\n    public IActionResult GetProductById(int id)\n    {\n        // 根据\
    \ ID 从数据库检索特定产品\n        return Ok(product);\n    }\n\n    [HttpPost]\n    public\
    \ IActionResult CreateProduct([FromBody] Product product)\n    {\n        // 修改数据库中已存在的产品\n\
    \        return CreatedAtAction(nameof(GetProductById), new { id = product.Id\
    \ }, product);\n    }\n\n    [HttpPut(\"{id}\")]\n    public IActionResult UpdateProduct(int\
    \ id, [FromBody] Product product)\n    {\n        // 更新数据库中的现有产品\n        return\
    \ NoContent();\n    }\n\n    [HttpDelete(\"{id}\")]\n    public IActionResult\
    \ DeleteProduct(int id)\n    {\n        // 从数据库中删除产品\n        return NoContent();\n\
    \    }\n}\n```\n\n在上面的示例中，我们创建了处理不同 HTTP 动词的操作方法来管理产品。`[HttpGet]` 属性用于 HTTP GET\
    \ 请求，`[HttpPost]` 用于 HTTP POST 请求，`[HttpPut]` 用于 HTTP PUT 请求，`[HttpDelete]` 用于\
    \ HTTP DELETE 请求。\n\n## 数据传输对象 (DTO)：\n\n在处理 Web API 时，使用数据传输对象（DTO）来封装在客户端和服务器之间传输的数据是一个良好的做法。DTO\
    \ 有助于将数据的内部表示与外部表示解耦，从而提高可维护性和活性。\n\n```csharp\n// 数据传输对象 (DTO) 示例\n\npublic class\
    \ ProductDto\n{\n    // 表示一个整数标识符 { get; set; }\n\n    // 声明一个字符串标识符 { get; set;\
    \ }\n\n    // 表示一个公共十浮点数值 { get; set; }\n}\n```\n\n使用 ASP.NET Core 3 构建 Web API\
    \ 允许你为客户端应用程序暴露数据和功能。通过创建控制器定义端点和操作、处理不同的 HTTP 动词并使用 DTO 进行数据传输，你可以开发出强大且可扩展的\
    \ API，满足现代 Web 应用程序的需求。无论你是构建单页应用程序（SPA）还是为移动应用提供数据服务，ASP.NET Core 都提供了一个灵活且高效的解决方案。\n\
    \n"
