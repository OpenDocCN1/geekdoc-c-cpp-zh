- md: "\nFunctions in C# can have zero or more parameters, which are placeholders\
    \ for values passed to the function when it is called. Additionally, functions\
    \ can have a return type, specifying the type of value returned by the function.\n\
    \n```csharp\n// Example of a function with parameters and return type in C#\n\
    public int Multiply(int x, int y)\n{\n    return x * y;\n}\n```\n\nIn the above\
    \ example, the `Multiply` function takes two integer parameters `x` and `y` and\
    \ returns their product.\n\n## Void Functions:\n\nFunctions with a return type\
    \ of `void` do not return any value. They are used to perform a task or operation\
    \ without returning a result.\n\n```csharp\n// Example of a void function in C#\n\
    public void PrintMessage(string message)\n{\n    Console.WriteLine(\"Message:\
    \ \" + message);\n}\n```\n\nIn the above example, the `PrintMessage` function\
    \ takes a string parameter `message` and prints it to the console without returning\
    \ any value.\n\n## Benefits of Functions:\n\n- 1. Code Reusability: Functions\
    \ enable the encapsulation of logic that can be utilized repeatedly within your\
    \ application, diminishing code redundancy and enhancing maintainability.\n\n\
    - 2. Modularity: Breaking down complex logic into smaller, modular functions makes\
    \ it easier to understand and manage code, facilitating collaboration and teamwork.\n\
    \n- 3. Abstraction: Functions provide a level of abstraction, allowing developers\
    \ to focus on high-level functionality without worrying about the implementation\
    \ details.\n\n- 4. Testing: Functions can be unit tested independently, ensuring\
    \ that each piece of functionality behaves as expected, leading to more robust\
    \ and reliable code.\n\nFunctions are essential building blocks in C# and ASP.NET\
    \ Core 3 web development, enabling developers to create reusable, modular, and\
    \ efficient code. By defining functions with well-defined parameters and return\
    \ types, you can encapsulate logic, promote code reusability, and improve code\
    \ maintainability. Whether you're performing simple arithmetic operations or implementing\
    \ complex business logic, functions empower you to write clean, concise, and scalable\
    \ code that meets the needs of your web applications.\n\n## Putting it All Together:\
    \ Building Your First C# Programs\n\nNow that we've covered the fundamental building\
    \ blocks of C# and ASP.NET Core 3 web development, it's time to put everything\
    \ into practice by building your first C# programs. In this guide, we'll walk\
    \ through the process of creating two simple programs: a console application and\
    \ a basic ASP.NET Core web application.\n\n## Building a Console Application:\n\
    \nLet's start by creating a simple console application that calculates the sum\
    \ of two numbers entered by the user.\n\n## 1. Generate a fresh ASP.NET Core web\
    \ application project.\n\nOpen Visual Studio and select File > New > Project.\
    \ Choose the Console App (.NET Core) template under the C# category. Name your\
    \ project and click Create.\n\n## 2. Define the Main Function:\n\nIn the `Program.cs`\
    \ file, define the `Main` function, which serves as the entry point for the application.\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        Console.WriteLine(\"Enter two numbers:\");\n        int\
    \ num1 = Convert.ToInt32(Console.ReadLine());\n        int num2 = Convert.ToInt32(Console.ReadLine());\n\
    \        int sum = num1 + num2;\n\n        Console.WriteLine(\"Sum: \" + sum);\n\
    \    }\n}\n```\n\n## 3. Run the Console Application:\n\nPress `F5` or select **Debug\
    \ > Start Debugging** to run the console application. Enter two numbers when prompted,\
    \ and the program will calculate and display their sum.\n\n## Building an ASP.NET\
    \ Core Web Application:\n\nNext, let's create a basic ASP.NET Core web application\
    \ that displays a welcome message.\n\n## 1. Create a New ASP.NET Core Web Application\
    \ Project:\n\nOpen Visual Studio and select File > New > Project. Choose the ASP.NET\
    \ Core Web Application template under the C# category. Name your project and click\
    \ Create.\n\n## 2. Define a Controller with a View:\n\nAdd a new controller class\
    \ to the `Controllers` folder and define an action method to handle requests.\n\
    \n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\npublic class HomeController :\
    \ Controller\n{\n    public IActionResult Index()\n    {\n        ViewData[\"\
    Message\"] = \"Welcome to my first ASP.NET Core web application!\";\n        return\
    \ View();\n    }\n}\n```\n\n## 3. Create a View:\n\nIn the `Views` folder, add\
    \ a new view file named `Index.cshtml` and display the welcome message.\n\n```html\n\
    @model dynamic\n\n<h1>Welcome</h1>\n\n<p>@ViewData[\"Message\"]</p>\n```\n\n##\
    \ 4. Configure Routing:\n\nOpen the `Startup.cs` file and configure routing to\
    \ map requests to the appropriate controller and action method.\n\n```csharp\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\nusing\
    \ Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.Hosting;\n\
    \npublic class Startup\n{\n    public void ConfigureServices(IServiceCollection\
    \ services)\n    {\n        services.AddControllersWithViews();\n    }\n\n   \
    \ public void Configure(IApplicationBuilder app, IWebHostEnvironment env)\n  \
    \  {\n        if (env.IsDevelopment())\n        {\n            app.UseDeveloperExceptionPage();\n\
    \        }\n        app.UseRouting();\n        app.UseEndpoints(endpoints =>\n\
    \        {\n            endpoints.MapControllerRoute(\n                name: \"\
    default\",\n                pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n        });\n    }\n}\n```\n\n## 5. Run the ASP.NET Core Web Application:\n\
    \nPress `F5` or select **Debug > Start Debugging** to run the console application.\
    \ The browser should open open and display the welcome message. Congratulations!\
    \ You've successfully created a simple yet functional ASP.NET Core web application.\n\
    \n[content]\n\n# Chapter 3\n\n## Introduction to ASP.NET Core 3: Building Web\
    \ Applications with C#\n\nASP.NET Core 3 is a powerful and versatile framework\
    \ for building modern web applications using the C# language. It provides developers\
    \ with a robust platform that is cross-platform, open-source, and de-highly performant.\
    \ In this guide, we'll explore what ASP.NET Core 3 is and delve into the framework\
    \ behind the magic.\n\n**What is ASP.NET Core 3?**\n\nASP.NET Core 3 is the latest\
    \ iteration of the ASP.NET Core framework, designed to address the evolving needs\
    \ of web development. It is a cross-platform, high-performance, and open-source\
    \ framework for building applications using C#. ASP.NET Core 3 offers a wide range\
    \ of features and benefits, including:\n\n- 1. Cross-Platform Compatibility: ASP.NET\
    \ Core 3 runs on Windows, macOS, and Linux, enabling developers to build and deploy\
    \ web applications across different operating systems with ease.\n\n- 2. Performance:\
    \ ASP.NET Core 3 is optimized for performance, with improvements in speed and\
    \ scalability compared to previous versions. It leverages modern web development\
    \ techniques and technologies to deliver high-performance web applications.\n\n\
    - 3. Modularity and Flexibility: ASP.NET Core 3 is designed with modularity in\
    \ mind, allowing developers to choose and use only the components and features\
    \ they need for their applications. This results in leaner and more efficient\
    \ web applications.\n\n- 4. Open-Source: ASP.NET Core 3 is open-source, meaning\
    \ that the source code is freely available for developers to view, modify, and\
    \ contribute to. This fosters a vibrant community of developers and promotes collaboration\
    \ and innovation within the ASPNET ecosystem.\n\n- 5. Integration with Visual\
    \ Studio: ASP.NET Core 3 integrates seamlessly with Visual Studio, Microsoft's\
    \ integrated development environment (IDE), providing developers with a rich set\
    \ of tools and features for building, debugging, and deploying web applications.\n\
    \n- 6. Support for Modern Web Development Practices: ASP.NET Core 3 embraces modern\
    \ web development practices and standards, such as HTTP/2, WebSockets, and responsive\
    \ design, enabling developers to create cutting-edge web applications that meet\
    \ the demands of today's users.\n\n**Understanding the Framework Behind the Magic:**\n\
    \nAt its core, ASP.NET Core 3 is built on a modular and extensible architecture,\
    \ consisting of various components and layers that work together to handle incoming\
    \ HTTP requests, process business logic, and generate responses. Let's explore\
    \ some key components of the ASP.NET Core 3 framework:\n"
  mdcn: "\nC# 中的函数可以有零或多个参数，这些参数是调用函数时传递给函数的值的占位符。此外，函数可以有一个返回类型，用于指定函数返回的值的类型。\n\n\
    ```csharp\n// C# 中带有参数和返回类型的函数示例\npublic int Multiply(int x, int y)\n{\n    return\
    \ x * y;\n}\n```\n\n在上面的示例中，`Multiply` 函数接收两个整数参数 `x` 和 `y` 并返回它们的乘积。\n\n## 空函数（Void\
    \ Functions）：\n\n返回类型为 `void` 的函数不返回任何值。它们用于执行某项任务或操作，而不返回结果。\n\n```csharp\n//\
    \ C# 中空函数的示例\npublic void PrintMessage(string message)\n{\n    Console.WriteLine(\"\
    Message: \" + message);\n}\n```\n\n在上面的示例中，`PrintMessage` 函数接收一个字符串参数 `message`\
    \ 并将其打印到控制台，而不返回任何值。\n\n## 函数的优势：\n\n- 1. 代码复用：函数允许封装可以在应用程序中重复使用的逻辑，减少了代码冗余并增强了可维护性。\n\
    \n- 2. 模块化：将复杂逻辑拆分为较小的、模块化的函数使得代码更容易理解和管理，促进了协作和团队工作。\n\n- 3. 抽象：函数提供了一层抽象，允许开发者关注高级功能，而不必担心实现细节。\n\
    \n- 4. 测试：函数可以独立进行单元测试，确保每项功能的行为都符合预期，从而编写更健壮、更可靠的代码。\n\n函数是 C# 和 ASP.NET Core\
    \ 3 Web 开发中基本的构建块，使开发者能够创建可复用、模块化且高效的代码。通过定义具有良好参数和返回类型的函数，你可以封装逻辑、促进代码复用并提高代码的可维护性。无论是在执行简单的算术运算还是实现复杂的业务逻辑，函数都能让你编写出整洁、简洁且可扩展的代码，满足\
    \ Web 应用程序的需求。\n\n## 整合一切：构建你的第一个 C# 程序\n\n现在我们已经涵盖了 C# 和 ASP.NET Core 3 Web 开发的基础构建块，是时候通过构建你的第一个\
    \ C# 程序来将一切付诸实践了。在本指南中，我们将介绍创建两个简单程序的过程：一个控制台应用程序和一个基础 ASP.NET Core Web 应用程序。\n\
    \n## 构建控制台应用程序：\n\n让我们从创建一个简单的控制台应用程序开始，计算用户输入的两个数字之和。\n\n## 1. 生成 ASP.NET Core\
    \ 应用程序项目：\n\n打开 Visual Studio 并选择 File > Project。在 C# 类别下选择 Console App (.NET\
    \ Core) 模板。命名项目并点击 Create。\n\n## 2. 定义 Main 函数：\n\n在 `Program.cs` 文件中定义 `Main`\
    \ 函数，作为程序的入口。\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        Console.WriteLine(\"Enter two numbers:\"\
    );\n        int num1 = Convert.ToInt32(Console.ReadLine());\n        int num2\
    \ = Convert.ToInt32(Console.ReadLine());\n        int sum = num1 + num2;\n\n \
    \       Console.WriteLine(\"Sum: \" + sum);\n    }\n}\n```\n\n## 3. 运行控制台应用程序：\n\
    \n按下 `F5` 或选择 **Debug > Start Debugging**。按照提示输入两个数字，程序将计算它们的和。\n\n## 构建 ASP.NET\
    \ Core Web 应用程序：\n\n接下来，让我们创建一个显示欢迎消息的基础 ASP.NET Core Web 应用程序。\n\n## 1. 创建 ASP.NET\
    \ Core Web 应用程序项目：\n\n打开 Visual Studio 并选择 File > Project。在 C# 类别下选择 ASP.NET Core\
    \ Web Application。命名项目并点击 Create。\n\n## 2. 定义带有视图的控制器：\n\n在 `Controllers` 文件夹中添加一个新的控制器类，并定义一个处理请求的方法。\n\
    \n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\npublic class HomeController :\
    \ Controller\n{\n    public IActionResult Index()\n    {\n        ViewData[\"\
    Message\"] = \"Welcome to my first ASP.NET Core web application!\";\n        return\
    \ View();\n    }\n}\n```\n\n## 3. 创建视图：\n\n在 `Views` 文件夹中添加名为 `Index.cshtml` 的新视图并显示欢迎消息。\n\
    \n```html\n@model dynamic\n\n<h1>Welcome</h1>\n\n<p>@ViewData[\"Message\"]</p>\n\
    ```\n\n## 4. 配置路由：\n\n打开 `Startup.cs` 文件并配置路由，将请求映射到相应的控制器和方法。\n\n```csharp\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\nusing\
    \ Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.Hosting;\n\
    \npublic class Startup\n{\n    public void ConfigureServices(IServiceCollection\
    \ services)\n    {\n        services.AddControllersWithViews();\n    }\n\n   \
    \ public void Configure(IApplicationBuilder app, IWebHostEnvironment env)\n  \
    \  {\n        if (env.IsDevelopment())\n        {\n            app.UseDeveloperExceptionPage();\n\
    \        }\n        app.UseRouting();\n        app.UseEndpoints(endpoints =>\n\
    \        {\n            endpoints.MapControllerRoute(\n                name: \"\
    default\",\n                pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n        });\n    }\n}\n```\n\n## 5. 运行 ASP.NET Core Web 应用程序：\n\n按下 `F5` 或选择\
    \ **Debug > Start Debugging** 运行应用程序。浏览器应该打开并显示欢迎消息。恭喜！你成功创建了一个简单而实用的 ASP.NET\
    \ Core Web应用程序。\n\n# 第 3 章\n\n## ASP.NET Core 3 简介：使用 C# 构建 Web 应用程序\n\nASP.NET\
    \ Core 3 是一个用于使用 C# 语言构建现代 Web 应用程序的强大且多功能的框架。它为开发者提供了一个跨平台、开源且高性能的健壮平台。在本指南中，我们将探索\
    \ ASP.NET Core 3 是什么，并深入研究其背后的框架。\n\n**什么是 ASP.NET Core 3？**\n\nASP.NET Core 3\
    \ 是 ASP.NET Core 框架的最新迭代，旨在解决不断发展的 Web 开发需求。它是一个使用 C# 构建程序的跨平台、高性能且开源的框架。ASP.NET\
    \ Core 3 提供了广泛的功能和优势，包括：\n\n- 1. 跨平台兼容性：ASP.NET Core 3 运行在 Windows、macOS 和 Linux\
    \ 上，让开发者能够轻松地跨操作系统构建和部署 Web 应用程序。\n\n- 2. 性能：与之前的版本相比，ASP.NET Core 3 在速度和扩展方面进行了优化。它利用现代\
    \ Web 开发技术和工具提供高性能的 Web 应用程序。\n\n- 3. 模块化和活性：ASP.NET Core 3 的设计考虑了模块化，允许开发者仅选择和使用应用程序所需的组件和功能。这使得\
    \ Web 应用程序更加轻量和高效。\n\n- 4. 开源：ASP.NET Core 3 是开源的，这意味着源代码供开发者自由查看、修改和贡献。这培养了活跃的开发者社区并促进了\
    \ ASPNET 生态系统内的协作与创新。\n\n- 5. 与 Visual Studio 集成：ASP.NET Core 3 与微软的集成开发环境（IDE）Visual\
    \ Studio 无缝集成，为开发者提供了构建、调试和部署 Web 应用程序的丰富工具和功能。\n\n- 6. 支持现代 Web 开发实践：ASP.NET\
    \ Core 3 采用了 HTTP/2、WebSockets 和响应式设计等现代 Web 开发实践和标准，使开发者能够创建满足今天用户需求的尖端 Web 应用程序。\n\
    \n**理解背后的框架：**\n\nASP.NET Core 3 的核心构建模块化且可扩展的架构之上，由各种组件和层组成，共同工作处理传入的 HTTP 请求、处理业务逻辑并生成响应。让我们探索\
    \ ASP.NET Core 3 框架的一些关键组件：\n\n"
