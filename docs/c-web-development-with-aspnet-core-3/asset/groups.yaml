    \ 代码。\n\n```html\n<!-- Example of HTML markup in a Razor Page -->\n\n@page\n@model\
    \ MyWebApp.Pages.IndexModel\n\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Razor\
