    # # Chapter 3


    # ## Introduction to ASP.NET Core 3: Building Web Applications with C#


    ASP.NET Core 3 is a powerful and versatile framework for building modern web applications
    using the C# programming language. It provides developers with a robust platform
    that is cross-platform, open-source, and highly performant. In this guide, we''ll
    explore what ASP.NET Core 3 is and delve into the framework behind the magic.


    **What is ASP.NET Core 3?**


    ASP.NET Core 3 is the latest iteration of the ASP.NET Core framework, designed
    to address the evolving needs of web development in the modern era. It is a cross-platform,
    high-performance, and open-source framework for building web applications and
    services using C#. ASP.NET Core 3 offers a wide range of features and benefits,
    including:


    **1. Cross-Platform Compatibility:** ASP.NET Core 3 runs on Windows, macOS, and
    Linux, enabling developers to build and deploy web applications across different
    operating systems with ease.


    **2. Performance:** ASP.NET Core 3 is optimized for performance, with improvements
    in speed and scalability compared to previous versions. It leverages modern web
    development techniques and technologies to deliver high-performance web applications.'
  - '[PAGE 60]


    3. Modularity and Flexibility:** ASP.NET Core 3 is designed with modularity in
    mind, allowing developers to choose and use only the components and features they
    need for their applications. This results in leaner and more efficient web applications.


    4. Open-Source: ASP.NET Core 3 is open-source, meaning that the source code is
    freely available for developers to view, modify, and contribute to. This fosters
    a vibrant community of developers and promotes collaboration and innovation within
    the ASP.NET ecosystem.


    5. Integration with Visual Studio: ASP.NET Core 3 integrates seamlessly with Visual
    Studio, Microsoft''s integrated development environment (IDE), providing developers
    with a rich set of tools and features for building, debugging, and deploying web
    applications.


    6. Support for Modern Web Development Practices: ASP.NET Core 3 embraces modern
    web development practices and standards, such as HTTP/2, WebSockets, and responsive
    design, enabling developers to create cutting-edge web applications that meet
    the demands of today''s users.


    # **Understanding the Framework Behind the Magic:**


    At its core, ASP.NET Core 3 is built on a modular and extensible architecture,
    consisting of various components and layers that work together to handle incoming
    HTTP requests, process business logic, and generate responses. Let''s explore
    some key components of the ASP.NET Core 3 framework:'
- md: "\n1. Middleware: Middleware components in ASP.NET Core 3 are responsible for\
    \ processing HTTP requests and responses as they flow through the application\
    \ pipeline. Middleware components can perform tasks such as routing, authentication,\
    \ logging, and error handling.\n\n2. Routing: The routing system in ASP.NET Core\
    \ 3 is responsible for mapping incoming HTTP requests to the appropriate controller\
    \ and action method based on predefined routes. Routes are defined using route\
    \ templates, which specify the pattern of the URL and the parameters to extract\
    \ from it.\n\n```csharp\n// Example of route definition in ASP.NET Core 3\nendpoints.MapControllerRoute(\n\
    \    name: \"default\",\n    pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n```\n\n3. Controllers and Actions: Controllers are C# classes that handle\
    \ incoming HTTP requests and generate responses. Each controller contains one\
    \ or more action methods, which represent individual endpoints within the application.\
    \ Action methods perform specific tasks, such as retrieving data, processing forms,\
    \ or rendering views.\n\n```csharp\n// Example of a controller and action method\
    \ in ASP.NET Core 3\n\npublic class HomeController : Controller\n{\n    public\
    \ IActionResult Index()\n    {\n        return View();\n    }\n}\n```\n\n4. Views:\
    \ Views in ASP.NET Core 3 are responsible for rendering HTML content to be sent\
    \ back to the client. Views are typically written using the Razor syntax, which\
    \ allows developers to embed C# code within HTML markup to create dynamic and\
    \ interactive web pages.\n\n```html\n<!-- Example of a Razor view file in ASP.NET\
    \ Core 3 -->\n\n@page\n\n@model IndexModel\n\n@{\n    ViewData[\"Title\"] = \"\
    Home\";\n}\n\n<h1>@ViewData[\"Title\"]</h1>\n\n<p>Welcome to my ASP.NET Core 3\
    \ web application</p>\n```\n\n5. Model Binding: Model binding in ASP.NET Core\
    \ 3 is the process of mapping data from incoming HTTP requests to parameters of\
    \ controller action methods. Model binding automatically extracts data from query\
    \ strings, form fields, route values, and request bodies, and binds them to corresponding\
    \ parameters of action methods.\n\n```csharp\n// Example of model binding in ASP.NET\
    \ Core 3\npublic IActionResult UpdateProduct(Product product)\n{\n    // Update\
    \ the product in the database\n    return RedirectToAction(\"Index\");\n}\n```\n\
    \nASP.NET Core 3 is a versatile and powerful framework for building modern web\
    \ applications using the C# programming language. With its cross-platform compatibility,\
    \ performance optimizations, modularity, and support for modern web development\
    \ practices, ASP.NET Core 3 provides developers with a comprehensive platform\
    \ for creating high-performance and scalable web applications. By understanding\
    \ the framework behind the magic, developers can leverage the full potential of\
    \ ASP.NET Core 3 to build robust and feature-rich web applications that meet the\
    \ demands of today's users.\n\n# Exploring the Project Structure: Organizing Your\
    \ Web Development Projects\n\nIn the realm of C# web development with ASP.NET\
    \ Core 3, understanding the project structure is crucial for effectively organizing\
    \ and managing your codebase. A well-organized project structure enhances code.\n\
    \nThe ASP.NET Core web application project contains all the components necessary\
    \ for building and running a web application, including controllers, views, models,\
    \ and configuration files.\n\n```plaintext\nMyWebApp\n| Controllers      <-- Controller\
    \ classes\n| Views            <-- Razor view files\n| Models           <-- Data\
    \ model classes\n| wwwroot          <-- Static files (CSS, JavaScript, images)\n\
    | appsettings.json <-- Application settings\n| Startup.cs       <-- Application\
    \ startup configuration\nL-- Program.cs      <-- Application entry point\n```\n\
    \n1. Controllers: The `Controllers` folder contains controller classes responsible\
    \ for handling incoming HTTP requests and generating responses. Each controller\
    \ typically consists of action methods that represent individual endpoints within\
    \ the application.\n\n2. Views: The `Views` folder contains Razor view files responsible\
    \ for rendering HTML content to be sent back to the client. Views often include\
    \ HTML markup combined with C# code using the Razor syntax to create dynamic and\
    \ interactive web pages.\n\n3. Models: The `Models` folder contains data model\
    \ classes representing entities in the application. Models define the structure\
    \ and behavior of data entities, including properties, methods, and relationships.\n\
    \n4. wwwroot: The `wwwroot` folder contains static files such as CSS, JavaScript,\
    \ images, and other assets that are served directly to clients. These files are\
    \ accessible via their relative paths in the browser.\n\n5. appsettings.json:\
    \ The `appsettings.json` file contains application settings and configurations,\
    \ such as database connection strings, API keys, and logging settings. It provides\
    \ a centralized location for managing application settings.\n\n6. Startup.cs:\
    \ The `Startup.cs` file is the entry point for configuring services and middleware\
    \ in the ASP.NET Core application. It defines the application's request processing\
    \ pipeline and sets up various services as routing, logging, and dependency injection.\n\
    \n7. Program.cs: The `Program.cs` file serves as the application's entry point,\
    \ containing the `Main` method that bootstraps the ASP.NET Core application and\
    \ configures the web host.\n\n# Customizing the Project Structure:\n\nWhile the\
    \ default project structure provided by ASP.NET Core 3 is suitable for many web\
    \ applications, developers have the flexibility to customize and extend the project\
    \ structure based on their specific requirements and preferences.\n\n- **Areas**:\
    \ ASP.NET Core allows developers to organize related functionality into areas,\
    \ each with its own controllers, views, and models. Areas provide a hierarchical\
    \ structure for organizing large applications.\n- **Additional Folders**: Developers\
    \ can create additional folders within the project to further organize code. Common\
    \ examples include folders for services, utilities.\n- **Separation of Concerns**:\
    \ Following the principle of separation of concerns, developers can organize code\
    \ into separate projects or modules based on functional boundaries, such as presentation,\
    \ business logic, and data access.\n\nIt provides a structured approach to organizing\
    \ code and separating concerns, resulting in applications that are easier to understand,\
    \ maintain, and extend. In this guide, we'll delve into the Model-View-Controller\
    \ pattern and how it is implemented in ASP.NET Core 3.\n\n# What is the Model-View-Controller\
    \ Pattern?\n\nThe Model-View-Controller (MVC) pattern is a software architecture\
    \ design that partitions an application into three interconnected elements:\n\n\
    1. Model: Denotes the data and operational logic of the application. It encapsulates\
    \ the application's state and behavior, including data validation, manipulation,\
    \ and persistence.\n\n2. View: Represents the presentation layer of the application.\
    \ It is responsible for rendering the user interface and displaying data to the\
    \ user. Views are typically HTML templates combined with embedded code to dynamically\
    \ generate content.\n\n3. Controller: Acts as an intermediary between the Model\
    \ and the View. It receives input from the user via the View, processes requests,\
    \ interacts with the Model to perform business logic, and selects the appropriate\
    \ View to render the response.\n\n# Implementing ASP.NET Core MVC:\n\nIn ASP.NET\
    \ Core 3, the MVC pattern is implemented through a set of conventions and components\
    \ that facilitate the development of web applications. Let's explore each component\
    \ of ASP.NET Core MVC:\n"
  mdcn: "\n\n1. 中间件（Middleware）：ASP.NET Core 3 中的中间件组件负责在 HTTP 请求和响应流过应用程序管道时对其进行处理。中间件组件可以执行路由、身份验证、日志记录和错误处理等任务。\n\
    \n2. 路由（Routing）：ASP.NET Core 3 中的路由系统负责根据预定义的路由将传入的 HTTP 请求映射到相应的控制器和操作方法。路由使用路由模板定义，这些模板指定了\
    \ URL 的模式以及从中提取的参数。\n\n```csharp\n// ASP.NET Core 3 中的路由定义示例\nendpoints.MapControllerRoute(\n\
    \    name: \"default\",\n    pattern: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n```\n\n3. 控制器与操作（Controllers and Actions）：控制器是用于处理传入的 HTTP 请求并生成响应的 C# 类。每个控制器包含一个或多个操作方法，这些方法代表应用程序中的单个端点。操作方法执行特定任务，例如检索数据、处理表单或渲染视图。\n\
    \n```csharp\n// ASP.NET Core 3 中的控制器和操作方法示例\n\npublic class HomeController : Controller\n\
    {\n    public IActionResult Index()\n    {\n        return View();\n    }\n}\n\
    ```\n\n4. 视图（Views）：ASP.NET Core 3 中的视图负责渲染发送回客户端的 HTML 内容。视图通常使用 Razor 语法编写，它允许开发者在\
    \ HTML 标记中嵌入 C# 代码，以创建动态且具交互性的网页。\n\n```html\n<!-- ASP.NET Core 3 中的 Razor 视图文件示例\
    \ -->\n\n@page\n\n@model IndexModel\n\n@{\n    ViewData[\"Title\"] = \"Home\"\
    ;\n}\n\n<h1>@ViewData[\"Title\"]</h1>\n\n<p>欢迎来到我的 ASP.NET Core 3  应用程序</p>\n\
    ```\n\n5. 模型绑定（Model Binding）：ASP.NET Core 3 中的模型绑定是将来自传入的 HTTP 请求中的数据映射到控制器操作方法参数的过程。模型绑定自动从查询字符串、表单字段、路由值和请求体中提取数据，并将其绑定到操作方法的相应参数。\n\
    \n```csharp\n// ASP.NET Core 3 中的模型绑定示例\npublic IActionResult UpdateProduct(Product\
    \ product)\n{\n    // 更新数据库中的产品\n    return RedirectToAction(\"Index\");\n}\n\
    ```\n\nASP.NET Core 3 是一个使用 C# 语言构建现代 Web 应用程序的多功能且强大的框架。凭借其跨平台兼容性、性能优化、模块化以及对现代\
    \ Web 开发实践的支持，ASP.NET Core 3 为开发者提供了一个全面的平台，用于创建高性能和可扩展的 Web 应用程序。通过理解魔法背后的框架，开发者可以充分利用\
    \ ASP.NET Core 3 的潜力，构建满足当今用户需求的健壮且功能丰富的 Web 应用程序。\n\n# 探索项目结构：组织你的 Web 开发项目\n\
    \n在 ASP.NET Core 3 的 C# Web 开发领域，理解项目结构对于有效组织和管理代码库至关重要。良好的项目结构可以提高代码的质量。\n\n\
    ASP.NET Core Web 应用程序项目包含了构建和运行 Web 所需的所有组件，包括控制器、视图、模型和配置文件。\n\n```plaintext\n\
    MyWebApp\n| Controllers      <-- 控制器类\n| Views            <-- Razor 视图文件\n| Models\
    \           <-- 数据模型类\n| wwwroot          <-- 静态文件 (CSS, JavaScript, images)\n\
    | appsettings.json <-- 应用程序设置\n| Startup.cs       <-- 应用程序启动配置\nL-- Program.cs\
    \      <-- 应用程序入口点\n```\n\n1. 控制器（Controllers）：`Controllers` 文件夹包含负责处理传入 HTTP\
    \ 请求并生成响应的控制器类。每个控制器通常由操作方法组成，这些方法代表应用程序中的单个端点。\n\n2. 视图（Views）：`Views` 文件夹包含负责渲染发送回客户端的\
    \ HTML 内容的 Razor 视图文件。视图通常包含结合了 Razor 语法的 C# 代码，以创建动态交互网页。\n\n3. 模型（Models）：`Models`\
    \ 文件夹包含表示应用程序实体的数据模型类。模型定义了数据实体的结构和行为，包括属性、方法和关系。\n\n4. wwwroot：`wwwroot` 文件夹包含直接提供给客户端的静态文件，如\
    \ CSS、JavaScript、图像和其他资源。这些文件可以通过浏览器中的相对路径访问。\n\n5. appsettings.json：`appsettings.json`\
    \ 文件包含应用程序设置和配置，例如数据库连接字符串、API 密钥和日志设置。它为管理应用程序设置提供了集中位置。\n\n6. Startup.cs：`Startup.cs`\
    \ 文件是 ASP.NET Core 应用程序中配置服务和中间件的入口点。它定义了应用程序的请求处理管道，并设置了路由、日志记录和依赖注入等服务。\n\n\
    7. Program.cs：`Program.cs` 文件作为应用程序的入口点，包含引导 ASP.NET Core 启动并配置 Web 主机的 `Main`\
    \ 方法。\n\n# 自定义项目结构：\n\n虽然 ASP.NET Core 3 提供的默认项目结构适用于许多 Web 应用程序，但开发者可以根据特定需求和偏好自定义并扩展项目结构。\n\
    \n- **区域（Areas）**：ASP.NET Core 允许开发者将相关功能组织到区域，每个区域都有自己的控制器、视图和模型。区域为组织大型应用程序提供了分级结构。\n\
    - **额外文件夹（Additional Folders）**：开发者可以在项目中创建额外的文件夹以进一步组织代码。常见示例包括服务、工具文件夹。\n- **关注点分离（Separation\
    \ of Concerns）**：遵循关注点分离原则，可以根据功能边界（如表示层、业务逻辑和数据访问）将代码组织到单独的项目或模块中。\n\n它提供了一种结构化的代码组织代码的方法，使应用程序更容易理解、维护和扩展。在本指南中，我们将深入探讨模型-视图-控制器（MVC）模式及其在\
    \ ASP.NET Core 3 中的实现方式。\n\n# 什么是模型-视图-控制器模式？\n\n模型-视图-控制器（MVC）模式是一种软件架构设计，它将应用程序分为三个相互关联的元素：\n\
    \n1. 模型（Model）：表示应用程序的数据和操作逻辑。它封装了应用程序的状态和行为，包括数据验证、操作和持久化。\n\n2. 视图（View）：代表应用程序的表示层。它负责渲染用户界面并向用户显示数据。视图通常是结合了嵌入代码的\
    \ HTML 模板。\n\n3. 控制器（Controller）：作为模型和视图之间的中间件。它通过视图接收用户输入，处理请求，与模型交互以执行业务逻辑，并选择合适的视图来渲染响应。\n\
    \n"
