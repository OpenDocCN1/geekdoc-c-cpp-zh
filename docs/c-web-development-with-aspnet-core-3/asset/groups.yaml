    \ 的双精度浮点数变量。\n- `isEmployed` 是一个存储布尔值的布尔变量。\n\n变量允许你在 ASP.NET Core 应用程序中动态地管理和操作数据。\n\
    \n## 数据类型：\n\n数据类型规定了变量能够存储的数据种类。C# 支持多种数据类型，包括原始类型、结构化类型和用户定义类型。\n\n## 原始类型：\n\
    \n原始类型是内建于 C# 语言中的基础数据类型。它们包括整数、浮点数、字符和布尔值。\n\n```csharp\n// C# 中原始数据类型的示例\nint\
    \ age = 25; // 整数\ndouble salary = 2500.50; // 双精度浮点数\nchar grade = 'A'; // 字符\n\
    bool isEmployed = true; // 布尔\n```\n\n## 结构化类型：\n\n结构化类型由多个原始类型或其他结构化类型组成。示例包括数组、枚举和结构体（struct）。\n\
    \n```csharp\n// C# 中结构化数据类型的示例\nint[] numbers = { 1, 2, 3, 4, 5 }; // 数组\nenum\
    \ Days { Monday, Tuesday, Wednesday, Thursday, Friday }; // 枚举\nstruct Point {\
    \ int x; int y; }; // 结构体\n```\n\n## 用户定义类型：\n\n用户定义类型是程序员创建的类型。它们包括类和接口，这是面向对象编程的基础。\n\
    \n```csharp\n// C# 中用户定义数据类型的示例\npublic class Person\n{\n    public string Name\
    \ { get; set; }\n    public int Age { get; set; }\n}\n\ninterface IEmployee\n\
    {\n    void CalculateSalary();\n}\n```\n\n## 运算符：\n\n运算符是用于对变量和值执行操作的符号或关键字。C#\
    \ 支持广泛的运算符，包括算术、比较、逻辑、赋值和位运算符。\n\n## 算术运算符：\n\n算术运算符用于执行加、减、乘、除和取模等数学操作。\n\n```csharp\n\
    // C# 中算术运算符的示例\nint a = 10;\nint b = 5;\nint sum = a + b; // 加\nint difference\
    \ = a - b; // 减\nint product = a * b; // 乘\nint quotient = a / b; // 除\nint remainder\
    \ = a % b; // 取模\n```\n\n## 比较运算符：\n\n比较运算符用于比较两个值并确定它们的关系，返回一个布尔值（true 或 false）。\n\
    \n```csharp\n// C# 中比较运算符的示例\nint x = 10;\nint y = 5;\nbool isEqual = x == y;\
    \ // 等于\nboolNotEqual = x != y; // 不等于\nbool isGreater = x > y; // 大于\nbool isLess\
    \ = x < y; // 小于\nbool isGreaterOrEqual = x >= y; // 大于等于\nbool isLessOrEqual\
    \ = x <= y; // 小于\n```\n\n## 逻辑运算符：\n\n逻辑运算符用于组合多个条件，并评估给定的表达式为真为假。\n\n```csharp\n\
    // C# 中逻辑运算符的示例\nbool isAdult = age >= 18 && isEmployed; // 与\nbool hasDiscount\
    \ = age < 12 || age >= 65; // 或\nbool isValid = !isValid; // 非\n```\n\n## 赋值运算符：赋值运算符用于为变量赋值。\n\
    \n```csharp\n// C# 中赋值运算符的示例\nint a = 10;\nint b = 5;\na += b; // 等于：a = a + b;\n\
    b -= a; // 等于：b = b - a;\n```\n\n理解变量、数据类型和运算符是精通 C# 和 ASP.NET Core 3 Web 开发的基础。通过掌握这些构建块，你获得了在你的应用程序中操作数据、创建逻辑表达式和执行操作的能力。有了这个坚实的基础，你完全能够应对更高级的概念并自信地构建复杂的解决方案。\n\
    \n## 掌握控制流：做出决策\n\n控制流结构是 C# 和 ASP.NET Core 3 Web 开发中的基本元素，允许开发者控制代码的执行流。通过掌握控制流，你获得了做出决策、对集合进行迭代以及根据特定条件执行代码的能力。\n\
    \n## 条件语句：\n\n```csharp\n// C# 中条件语句的示例\nint age = 25;\n\nif (age < 18)\n{\n \
    \   Console.WriteLine(\"你未成年。\");\n}\nelse if (age >= 18 && age < 65)\n{\n   \
    \ Console.WriteLine(\"你是成年人。\");\n}\nelse\n{\n    Console.WriteLine(\"你是老年人。\"\
    );\n}\n```\n\n在上述示例中，`if` 语句检查 `age` 变量是否小于 18。如果为真，它打印“你未成年。”。`else if` 语句检查年龄是否在\
    \ 18 到 65 之间。`else` 则打印“你是老年人。”\n\n## 循环：\n\n循环允许你重复执行代码块，直到满足特定条件。C# 支持多种类型的循环，包括\
    \ `for`、`while` 和 `do-while`。\n\n```csharp\n// C# 中循环的示例\nfor (int i = 0; i <\
    \ 5; i++)\n{\n    Console.WriteLine(\"Iteration: \" + i);\n}\n\nint j = 0;\nwhile\
    \ (j < 5)\n{\n    Console.WriteLine(\"Iteration: \" + j);\n    j++;\n}\n\nint\
    \ k = 0;\ndo\n{\n    Console.WriteLine(\"Iteration: \" + k);\n    k++;\n} while\
    \ (k < 5);\n```\n\n## 控制流关键字：\n\nC# 提供了诸如 `break`、`continue` 和 `return` 等控制流关键字来操作执行流。\n\
    \n```csharp\n// C# 中控制流关键字的示例\nfor (int i = 0; i < 10; i++)\n{\n    if (i == 5)\n\
    \    {\n        break; // 退出循环\n    }\n    if (i % 2 == 0)\n    {\n        continue;\
    \ // 跳过当前迭代\n    }\n    Console.WriteLine(\"Number: \" + i);\n}\n\nbool IsPositive(int\
    \ num)\n{\n    if (num >= 0)\n    {\n        return true; // 如果数字为正则返回真\n    }\n\
    \    return false; // 否则返回假\n}\n```\n\n在上述示例中，`break` 关键字在 `i` 达到 5 时退出循环。`continue`\
    \ 关键字跳过偶数。在 `IsPositive` 方法中，`return` 关键字根据特定条件返回布尔值。\n\n"
