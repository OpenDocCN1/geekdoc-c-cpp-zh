    # # Chapter 4


    # ## Working with Razor Pages: Simplifying Web Development


    Razor Pages is a feature of ASP.NET Core that simplifies the development of web
    applications by providing a more streamlined approach to building dynamic pages.
    With Razor Pages, developers can create web pages that contain both HTML markup
    and C# code in a single file, making it easier to manage and maintain complex
    web applications. In this guide, we''ll explore the basics of Razor Pages and
    demonstrate how to leverage this powerful model for building dynamic web pages
    in ASP.NET Core 3.


    # ### Introduction to Razor Pages:


    Razor Pages is a lightweight web framework introduced in ASP.NET Core that is
    built on top of the MVC (Model-View-Controller) architecture. While MVC separates
    an application into three main components (Models, Views, and Controllers), Razor
    Pages combines the View and Controller into a single page, resulting in a more
    cohesive and intuitive development experience.


    # ### The Anatomy of a Razor Page:


    A Razor Page consists of two main components: the HTML markup and the associated
    C# code. Let''s break down the structure of a Razor Page:'
  - '[PAGE 82]


    1. HTML Markup: The HTML markup defines the structure and layout of the web page,
    including elements such as headings, paragraphs, forms, and buttons. Razor Pages
    use the .cshtml extension to indicate that they contain both HTML markup and C#
    code.


    ```

    ```

    <!-- Example of HTML markup in a Razor Page --


    @page

    @model MyWebApp.Pages.IndexModel


    <!DOCTYPE html>

    <html>

    <head>

    <title>My Razor Page</title>

    </head>

    <body>

    <h1>Welcome</h1>

    ```

