    - 探索 Web 开发版图：深入不同技术\n- C# & ASP.NET Core 3 的力量：你构建精彩网站的工具\n- 设置你的开发环境：准备好编程！\n\
    \n# 第二章\n\n- 理解构建模块：变量、数据类型和运算符\n- 掌握控制流：让你的代码实现分支和循环\n- 函数：生成复用代码块以提高效率\n- 整合一切：构建你的第一个\
    \ C# 程序\n\n# 第三章\n\n- ASP.NET Core 3 简介：使用 C# 构建 Web 应用程序\n- 探索项目结构：组织你的 Web 开发项目\n\
    - 理解 ASP.NET Core MVC：模型-视图-控制器模式详解\n- 创建第一个 ASP.NET Core Web 应用程序：将理论付实践\n\n\
    # 第四章\n\n# Razor Pages：简化 Web 开发\n\n使用 Razor Pages 创建交互表单：处理用户输入\n\n使用 Razor Pages\
    \ 显示数据：构建用户友好界面\n\n构建布局和局部：复用代码以实现一致的设计\n\n# 第五章\n\n理解 ASP.NET Core 3 中的表单：获取用户数据\n\
    \n处理表单数据：验证和清理用户输入\n\n使用模型工作：在 C# 类中表示你的数据\n\n持久化用户数据：引入 Entity Framework\n\n\
    # 第六章\n\n使用 ASP.NET Core 3 构建 Web API\n\n使用 ASP.NET Core 3 创建 RESTful Web API：遵循最佳实践\n\
    \n在应用程序中调用 Web API：集成外部数据和服务\n\n# 第七章\n\nWeb 应用程序的安全最佳实践\n\n实现用户认证与授权：控制对安全数据的访问\n\
    \n处理错误和异常：构建健壮且韧性的应用程序\n\n# 第八章\n\n将你的 Web 应用程序部署到全球\n\n理解托管选项：为你的需求选择正确的平台\n\n\
    # 将 ASP.NET Core 3 部署到不同的环境\n\n# 第九章\n\n测试你的 Web 应用程序：确保质量和可靠性\n\n集成测试和 UI 测试：构建全面的测试策略\n\
    \n# 第\n\n探索高级 ASP.NET Core 3 功能\n\n中间件：拦截请求和响应以实现高级功能\n\n后台处理：在后台运行长时间任务\n\n#\
    \ 附录\n\n常见 C# 和 ASP.NET Core 概念（快速参考）\n\nB: 常见 Web 开发错误排错技巧\n\n# 引言\n\n释放你体内的\
    \ Web 开发动力：精通 C# & ASP.NET Core 3，构建令人兴奋的动态网站！\n\n网络是一个活生生的实体，不断进化并对创新解决方案提出需求。你准备好站在这一演化的前沿，打造捕捉用户并突破可能边界的交互式网络体验了吗？\n\
    \n《使用 ASP.NET Core 3 进行 C# Web 开发》是你通往 Web 开发大师的发射平台。这本书不仅仅是一本技术手册——它是你互动式的编程之旅，旨在将你从一个好奇的学习者转变为一个自信的\
    \ Web 开发者。无论你是初学者，还是想要提升技能的资深程序员，这本书都为你提供了业界所需的工具和技术，帮助你构建当今企业追求的强大、高性能 Web 应用程序。\n\
    \n为什么选择 C# & ASP.NET Core 3？这是你的优势：\n\n- **轻松学习**：忘记复杂的术语和枯燥的讲座。我们将 C# 基础知识和 ASP.NET\
    \ Core 概念拆解为易于接受、易于理解的课程，配有清晰的解释和引人注目的视觉效果。\n- **实战掌握**：这不是一本被动阅读的书——而是一本让你积极编写代码的书。你从第一天就开始编写代码，构建吸引人的项目，以巩固你的理解并点燃你对\
    \ Web 开发的热情。\n- **在做中学习**：我们相信实践的力量。你不仅是在学习理论——还将通过解决现实世界的编程挑战，掌握数据处理、用户交互和 Web\
    \ API 集成等核心概念。\n- **现代应用程序的现代开发**：ASP.NET Core 3 是驱动当今一些创新 Web 应用程序的尖端框架。这本书确保你掌握了构建性能、可扩展且安全的网络体验的最新工具和最佳实践。\n\
    \n但益处远不止代码：\n\n- **解决问题能力**：编程可以了你的批判性思维和解决问题的能力，这在任何职业中都是宝贵的资产。\n- **逻辑推理**：将问题分解为更小的、可解决的步骤——这种技能适用于生活的各个方面。\n\
    - **沟通大师**：清晰简洁的沟通对于编写代码和记录文档至关重要。\n- **兴奋的职业机会**：C# 和 ASP.NET Core 3 是不断增长的 Web\
    \ 开发行业中需求量极大的技能，开启了职业前景。\n\n书中等待着你的是：\n\n- 掌握 C# 基础知识，包括变量、数据类型、控制流和函数。\n- 发挥\
    \ ASP.NET Core 3 的力量，利用其丰富的工具和功能进行现代 Web 开发。\n- 构建具有用户友好界面、交互元素和数据集成的动态 Web 应用程序。\n\
    - 探索高级主题（可选章节），如 Web API、安全最佳实践和部署策略。\n- 通过构建吸引人的项目释放你的创造力，展示你新学到的技能。\n\n不要只是浏览网络——构建它！通过《使用\
    \ ASP.NET Core 3 进行 C# Web 开发》，你将拥有技能和信心，将你的 Web 开发梦想变为惊人的现实。向上滚动，点击“加入购物车”，从今天开始你的编程之旅！网络的未来等待着你。\n\
    \n"
