    在上面的示例中，我们使用 `Startup` 类中 `Configure` 方法的 `Use` 扩展方法配置了内置中间件组件，如开发者异常页、路由、身份验证和授权。这些中间件按照指定的顺序在请求处理管道中执行。\n\
    \n# 编写自定义中间件：\n\n除了内置中间件组件，ASP.NET Core 3 还允许你编写自定义中间件组件为应用程序添加自定义功能。自定义中间件是实现\
    \ `Delegate` 委托类型的简单 C# 类，该类型表示处理 HTTP 请求的函数。\n\n# 示例：在 ASP.NET Core 3 中编写自定义中间件\n\
    \n```csharp\n// CustomMiddleware.cs\npublic class CustomMiddleware\n{\n    private\
    \ readonly RequestDelegate _next;\n    public CustomMiddleware(RequestDelegate\
