    \nRazor Pages 是引入 ASP.NET Core 的轻量级 Web 框架，它构建在 MVC（模型-视图-控制器）架构之上。虽然 MVC 将应用程序拆分为三个主要组件（模型、视图和控制器），但\
    \ Razor Pages 将视图和控制器合并到单个页面中，从而带来了更贯贯直观的开发体验。\n\n### Razor Page 的结构：\n\n一个 Razor\
    \ Page 由两个主要部分组成：HTML 标记和相关的 C# 代码。让我们拆解 Razor Page 的结构：\n\n1. HTML 标记：HTML 标记定义了\
