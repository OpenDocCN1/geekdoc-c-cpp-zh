  mdcn: "\n\n# 配置提供程序：\n\nASP.NET Core 3 提供了配置提供程序，允许你从各种源加载配置设置，例如 JSON 文件、环境变量、命令行参数和\
    \ Azure Key Vault。通过使用配置提供程序，你可以轻松地管理特定环境的配置设置，并根据需要覆盖默认值。\n\n# 环境配置的最佳实践：\n\n\
    在将 ASP.NET Core 3 应用程序部署到不同的环境时，请考虑以下管理配置设置的最佳实践：\n\n- **1. 配置：** 使用 JSON 配置文件（`appsettings.json`）存储应用程序的默认配置设置。你可以在单独的\
    \ JSON 文件中定义特定环境配置，例如 `appsettings.development.json`、`appsettings.staging.json`\
    \ 和 `appsettings.production.json`。\n\n- **2. 环境变量：** 使用环境变量在运行时覆盖配置设置。环境变量提供了一种灵活的方法，可以在不修改配置文件的情况下配置应用程序设置。你可以直接在托管平台上设置环境变量，或使用\
    \ Docker 等工具将环境变量传递给容器化应用程序。\n\n- **3. 密钥管理：** 使用 Azure Key Vault 或其他密钥管理解决方案安全地存储敏感配置，例如连接字符串、API\
    \ 密钥和密码。避免在配置文件或环境变量中存储敏感信息，以降低泄露风险。\n\n- **4. 配置构建器：** 使用配置构建器根据当前环境动态构建配置设置。配置构建器允许你通过编程方式构造配置设置，结合来自多个源的值并根据需要应用特定环境的覆盖。\n\
    \n# 示例：在 ASP.NET Core 3 中配置基于环境的配置\n\n让我们来看如何在 ASP.NET Core 3 应用程序中配置基于环境的配置示例：\n\
    \n```csharp\n// Startup.cs\npublic class Startup\n{\n    public Startup(IConfiguration\
    \ configuration, IWebHostEnvironment environment)\n    {\n        Configuration\
    \ = configuration;\n        Environment = environment;\n    }\n\n    public IConfiguration\
    \ Configuration { get; }\n\n    public IWebHostEnvironment Environment { get;\
    \ }\n\n    public void ConfigureServices(IServiceCollection services)\n    {\n\
    \      // 根据环境配置服务\n      if (Environment.IsDevelopment())\n      {\n        //\
    \ 开发环境配置\n        services.AddDbContext<ApplicationDbContext>(options =>\n   \
    \       options.UseSqlServer(Configuration.GetConnectionString(\"DevelopmentConnection\"\
    )));\n      }\n      else if (Environment.IsStaging())\n      {\n        // 阶段环境配置\n\
    \        services.AddDbContext<ApplicationDbContext>(options =>\n            options.UseSqlServer(Configuration.GetConnectionString(\"\
    StagingConnection\")));\n      }\n      else if (Environment.IsProduction())\n\
    \      {\n        // Production环境配置\n        services.AddDbContext<ApplicationDbContext>(options\
    \ =>\n            options.UseSqlServer(Configuration.GetConnectionString(\"ProductionConnection\"\
    )));\n      }\n      // 其他服务配置\n    }\n\n    public void Configure(IApplicationBuilder\
    \ app, IWebHostEnvironment env)\n    {\n      if (env.IsDevelopment())\n     \
    \ {\n        app.UseDeveloperExceptionPage();\n      }\n      else\n      {\n\
    \        app.ExceptionHandler(\"/Error\");\n        app.UseHsts();\n      }\n\
    \      // 其他中间件配置\n    }\n}\n```\n\n在上面的示例中，我们使用 `IWebHostEnvironment` 接口确定当前环境（开发、阶段、生产）并相应地配置服务。我们使用\
    \ `GetConnectionString` 方法从配置设置加载特定环境的连接字符串，并根据当前环境配置应用程序的行为。\n\n将 ASP.NET Core\
    \ 3 应用程序部署到不同的环境需要配置基于环境的配置设置，以确保在开发、阶段和生产环境中的行为一致性。通过利用配置提供程序、环境变量和密钥管理解决方案，你可以有效地管理配置设置并使你的应用程序适应不同的部署场景。遵循管理基于环境配置的最佳实践（例如使用配置文件、环境变量和密钥管理解决方案），以确保你的\
    \ ASP.NET Core 3 应用程序在不同环境下的安全性、可靠性和可扩展性。通过实施有效的配置管理，你可以放心地将你的 ASP.NET Core 3\
    \ 应用程序部署到不同的环境，确保用户在各种部署情况下都能体验到一致且可靠的性能。\n\n# 第 9 章\n\n# 测试你的 Web 应用程序：确保质量和可靠性\n\
    \n测试是软件开发过程中不可缺的一部分，确保你的 Web 应用程序运行正常、性能良好并符合用户预期。ASP.NET Core 3 提供了健壮的测试框架和工具，用于编写和执行测试以验证代码的行为并确保质量和可靠性。在本指南中，我们将关注使用\
    \ C# 进行单元测试，并探索如何编写测试来验证你的 ASP.NET Core 3 Web 应用程序代码。\n\n# 使用 C# 进行单元测试：\n\n单元测试是一种软件测试技术，通过隔离测试软件应用程序的单个单元或组件来验证其行为和功能。在\
    \ ASP.NET Core 3 中，你可以使用流行的测试框架（如 MSTest、xUnit 和 NUnit）编写单元测试。这些框架提供了高效编写、组织和执行单元测试的工具和实用程序。\n\
    \n# 编写测试：\n\n为你的 ASP.NET Core 3 Web 应用程序编写单元测试时，通常关注测试单个组件，如控制器（Controllers）、服务（Services）、存储库（Repositories）和工具类。你使用依赖注入等技术将这些组件与其依赖项分离，并使用\
    \ Mock 框架来确保测试是可靠且重复的。\n\n# 示例：测试 ASP.NET Core 3 中的控制器\n\n让我们查看如何使用 xUnit 和 Moq（一个流行的\
    \ .NET Mock 框架）为 ASP.NET Core 3 Web 应用程序中的控制器编写单元测试：\n\n```csharp\n// UserController.cs\n\
    public class UserController : ControllerBase\n{\n    private readonly IUserService\
    \ _userService;\n\n    public UserController(IUserService userService)\n    {\n\
    \        _userService = userService;\n    }\n\n    [HttpGet(\"{id}\")]\n    public\
    \ IActionResult GetUser(int id)\n    {\n        var user = _userService.GetUserById(id);\n\
    \        if (user == null)\n        {\n            return NotFound();\n      \
    \  }\n        return Ok(user);\n    }\n}\n```\n\n```csharp\n// UserControllerTests.cs\n\
    public class UserControllerTests\n{\n    private readonly Mock<IUserService> _userServiceMock;\n\
    \    private readonly UserController _controller;\n\n    public UserControllerTests()\n\
    \    {\n        _userServiceMock = new Mock<IUserService>();\n        _controller\
    \ = new UserController(_userServiceMock.Object);\n    }\n\n    [Fact]\n    public\
    \ void GetUser_ReturnsUser_WhenUserExists()\n    {\n        // 准备\n        int\
    \ userId = 1;\n        var expectedUser = new User { Id = userId, Name = \"Charlie\
    \ Brown\" };\n        _userServiceMock.Setup(service => service.GetUserById(userId)).Returns(expectedUser);\n\
    \n        // 执行\n        var result = _controller.GetUser(userId) as OkObjectResult;\n\
    \n        // 断言\n        Assert.NotNull(result);\n        Assert.Equal(expectedUser,\
    \ result.Value);\n    }\n\n    [Fact]\n    public void GetUser_ReturnsNotFound_WhenUserDoesNotExist()\n\
    \    {\n        // 准备\n        int userId = 1;\n        _userServiceMock.Setup(service\
    \ => service.GetUserById(userId)).Returns((User)null);\n\n        // 执行\n    \
    \    var result = _controller.GetUser(userId) as NotFoundResult;\n\n        //\
    \ 断言\n        Assert.NotNull(result);\n    }\n}\n```\n\n"
