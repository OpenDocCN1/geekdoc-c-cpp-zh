    \ }\n  public int Age { get; set; }\n}\nPerson person1 = new Person();\nperson1.Name\
    \ = \"Alice\";\nperson1.Age = 25;\n```\n\n# ASP.NET Core Basics:\n\n# Middleware:\n\
