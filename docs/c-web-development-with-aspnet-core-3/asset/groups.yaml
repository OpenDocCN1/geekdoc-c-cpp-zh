    # Working with Models: Representing Your Data in C# Classes


    In ASP.NET Core 3, models play a crucial role in representing data and defining
    the structure of your application''s domain objects. Models encapsulate the properties
    and behavior of data entities, making it easier to work with and manipulate data
    throughout your application. In this guide, we''ll explore how to work with models
    in ASP.NET Core 3, including creating model classes and using them to represent
    data.


    # Creating Model Classes:'
- md: "\nModel classes in ASP.NET Core are simple C# classes that represent data entities\
    \ within your application. These classes typically contain properties that represent\
    \ the attributes of the entity, such as name, age, email, etc. Let's create an\
    \ example model class to represent a user profile.\n\n```csharp\n// Example of\
    \ a model class in ASP.NET Core\n\npublic class UserProfile\n{\n    // This represents\
    \ an integer identifier\n    public int Id { get; set; }\n    // This declares\
    \ a string identifier\n    public string Name { get; set; }\n    // This specifies\
    \ an integer identifier for age\n    public int Age { get; set; }\n    // This\
    \ denotes a string identifier for an email address\n    public string Email {\
    \ get; set; }\n}\n```\n\nIn the above example, we've defined a model class named\
    \ `UserProfile` with properties representing the attributes of a user profile,\
    \ including id, name, age, and email. Each property corresponds to a column in\
    \ the user profile table in the database.\n\n## Using Models to Represent Data:\n\
    \nOnce you've defined your model classes, you can use them to represent data throughout\
    \ your application. Models serve as a blueprint for creating instances of data\
    \ entities, allowing you to work with and manipulate data in a structured and\
    \ organized manner.\n\n```csharp\n// Example of using a model class in ASP.NET\
    \ Core\n\npublic class UserController : Controller\n{\n    private readonly ApplicationDbContext\
    \ _context;\n\n    public UserController(ApplicationDbContext context)\n    {\n\
    \        _context = context;\n    }\n\n    public IActionResult UserProfile(int\
    \ id)\n    {\n        UserProfile user = _context.UserProfiles.Find(id);\n   \
    \     return View(user);\n    }\n}\n```\n\nIn the above example, we've created\
    \ a `UserController` class with an action method named `UserProfile`. This method\
    \ retrieves a user profile from the database using the provided id and passes\
    \ it to a view for rendering. The `UserProfile` model class is used to represent\
    \ the data retrieved from the database.\n\n## Validating Data Using Model Annotations:\n\
    \nModel annotations provide a way to define validation rules and constraints for\
    \ model properties directly within the model class. ASP.NET Core provides built-in\
    \ validation attributes that you can apply to model properties to enforce data\
    \ integrity and ensure that the data meets certain criteria.\n\n```csharp\n//\
    \ Example of model validation using annotations in ASP.NET Core\n\npublic class\
    \ UserProfile\n{\n    public int Id { get; set; }\n\n    [Required(ErrorMessage\
    \ = \"Please enter your name.\")]\n    public string Name { get; set; }\n\n  \
    \  [Range(18, 120, ErrorMessage=\"The age should fall within the range of 18 to\
    \ 120.\")]\n    public int Age { get; set; }\n\n    [EmailAddress(ErrorMessage\
    \ = \"Please enter a valid email address.\")]\n    public string Email { get;\
    \ set; }\n}\n```\n\nIn the above example, we've added data annotations (`Required`),\
    \ (`Range`), (`EmailAddress`) to the properties of the `UserProfile` model class\
    \ to define validation rules for each property. These annotations enforce constraints\
    \ on the data and display error messages if the data does not meet the specified\
    \ criteria.\n\nWorking with models in ASP.NET Core 3 is essential for representing\
    \ data entities and defining the structure of your application's domain objects.\
    \ By creating model classes to represent data entities and using them throughout\
    \ your application, you can ensure that your data is structured, organized, and\
    \ easy to work with. Additionally, by applying model annotations to define validation\
    \ rules and constraints, you can enforce data integrity and ensure that the data\
    \ meets certain criteria. By incorporating these best practices into your application's\
    \ data modeling workflow, you can build robust and reliable web applications that\
    \ effectively manage and manipulate data.\n\n## Persisting User Data: Introduction\
    \ to Entity Framework Core\n\nIn ASP.NET Core 3, persisting user data is a fundamental\
    \ aspect of building web applications. Entity Framework Core (EF Core) is a widely\
    \ used Object-Relational Mapping (ORM) framework that streamlines database interactions\
    \ within ASP.NET Core applications. In this guide, we will introduce Entity Framework\
    \ Core and demonstrate how to use it to persist user data in ASP.NET Core 3 applications.\n\
    \n## What is Entity Framework Core?\n\nEntity Framework Core represents a nimble,\
    \ adaptable, and platform-independent iteration of the Entity Framework data access\
    \ technology. It enables developers to work with data using domain-specific objects\
    \ and provides a high-level abstraction over database interactions. EF Core supports\
    \ various database providers, including SQL Server, SQLite, MySQL, PostgreSQL,\
    \ and more.\n\n## Setting Up Entity Framework Core:\n\nTo get started with Entity\
    \ Framework Core in an ASP.NET Core 3 application, you need to install the necessary\
    \ NuGet packages and configure EF Core to work with your chosen database provider.\
    \ Let's use SQL Server as an example.\n\nOnce you've installed the required packages,\
    \ you can configure EF Core in your `Startup.cs` file within the `ConfigureServices`\
    \ method.\n\n```csharp\n// Startup.cs\nusing Microsoft.EntityFrameworkCore;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing YourAppName.Data;\n\npublic\
    \ void ConfigureServices(IServiceCollection services)\n{\n    services.AddDbContext<ApplicationDbContext>(options\
    \ =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n}\n```\n\n## Creating Model Classes:\n\nNext, you'll need to define model\
    \ classes to represent the entities in your database. These model classes will\
    \ be used by Entity Framework Core to map database tables to domain objects.\n\
    \n```csharp\n// Example of a model class representing a profile\npublic class\
    \ UserProfile\n{\n    public int Id { get; set; }\n    public string Name { get;\
    \ set; }\n    public int Age { get; set; }\n    public string Email { get; set;\
    \ }\n}\n```\n\n## Creating a DbContext:\n\n`DbContext` is the main class that\
    \ coordinates Entity Framework functionality for a given data model. It represents\
    \ a session with the database and allows you to query and save data.\n\n```csharp\n\
    // Example of a DbContext\nusing Microsoft.EntityFrameworkCore;\n\npublic class\
    \ ApplicationDbContext : DbContext\n{\n    public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
    \ options)\n        : base(options)\n    {\n    }\n\n    public DbSet<UserProfile>\
    \ UserProfiles { get; set; }\n}\n```\n\n## Performing Migrations:\n\nOnce you've\
    \ defined your model classes and `DbContext`, you can use EF Core migrations to\
    \ create or update the database schema. Run the following command in the terminal\
    \ to create an initial migration:\n\n```bash\ndotnet ef migrations add InitialCreate\n\
    ```\n\nThen, apply the migration to update the database:\n\n```bash\ndotnet ef\
    \ database update\n```\n"
  mdcn: "\nASP.NET Core 中的模型类是简单的 C# 类，用于表示应用程序中的数据实体。这些类通常包含表示实体属性的属性，例如名称、年龄、电子邮件等。让我们创建一个示例模型类来表示用户配置。\n\
    \n```csharp\n// Example of a model class in ASP.NET Core\n\npublic class UserProfile\n\
    {\n    // 这表示一个整数标识符\n    public int Id { get; set; }\n    // 这声明了一个字符串标识符\n \
    \   public string Name { get; set; }\n    // 这指定了年龄的整数标识符\n    public int Age\
    \ { get; set; }\n    // 这表示了用于电子邮件地址的字符串标识符\n    public string Email { get; set;\
    \ }\n}\n```\n\n在上面的示例中，我们定义了一个名为 `UserProfile` 的模型类，其属性表示用户配置的特质，包括 id、name、age\
    \ 和 email。每个属性都对应数据库中用户配置表中的一列。\n\n## 使用模型表示数据：\n\n一旦你定义了模型类，就可以使用它们在整个应用程序中表示数据。模型作为创建数据实体实例的蓝图，允许你以结构化和组织化的方式处理和操作数据。\n\
    \n```csharp\n// Example of using a model class in ASP.NET Core\n\npublic class\
    \ UserController : Controller\n{\n    private readonly ApplicationDbContext _context;\n\
    \n    public UserController(ApplicationDbContext context)\n    {\n        _context\
    \ = context;\n    }\n\n    public IActionResult UserProfile(int id)\n    {\n \
    \       UserProfile user = _context.UserProfiles.Find(id);\n        return View(user);\n\
    \    }\n}\n```\n\n在上面的示例中，我们创建了一个 `UserController` 类，其中有一个名为 `UserProfile` 的操作方法。该方法使用提供的\
    \ id 从数据库中检索用户配置，并将其传递给视图进行渲染。`UserProfile` 模型类用于表示从数据库检索的数据。\n\n## 使用模型注解验证数据：\n\
    \n模型注解提供了一种直接在模型类中为模型属性定义验证规则和约束的方法。ASP.NET Core 提供了内置的验证程序，你可以将它们应用于模型属性，以强制数据完整性并确保数据符合某些标准。\n\
    \n```csharp\n// Example of model validation using annotations in ASP.NET Core\n\
    \npublic class UserProfile\n{\n    public int Id { get; set; }\n\n    [Required(ErrorMessage\
    \ = \"Please enter your name.\")]\n    public string Name { get; set; }\n\n  \
    \  [Range(18, 120, ErrorMessage=\"The age should fall within the range of 18 to\
    \ 120.\")]\n    public int Age { get; set; }\n\n    [EmailAddress(ErrorMessage\
    \ = \"Please enter a valid email address.\")]\n    public string Email { get;\
    \ set; }\n}\n```\n\n在上面的示例中，我们向 `UserProfile` 模型类的属性添加了数据注解（`Required`）、（`Range`）、（`EmailAddress`），以为每个属性定义验证规则。这些注解对数据实施了约束，并在数据不符合指定标准时显示错误消息。\n\
    \n在 ASP.NET Core 3 中处理模型对于表示数据实体和定义应用程序领域对象的结构至关重要。通过创建模型类来表示数据实体并在整个应用程序中使用它们，你可以确保数据是结构化、组织化且易于处理的。此外，通过应用模型注解来定义验证规则和约束，你可以强制数据完整性并确保数据符合某些标准。通过将这些最佳实践纳入应用程序的数据建模工作流，你可以构建出健健且可靠的\
    \ Web 应用程序，有效地管理和操作数据。\n\n## 持久化用户数据：Entity Framework Core 简介\n\n在 ASP.NET Core\
    \ 3 中，持久化用户数据是构建 Web 应用的基本方面。Entity Framework Core (EF Core) 是一种广泛的对象关系映射（ORM）框架，它可以简化\
    \ ASP.NET Core 应用程序中的数据库交互。在本指南中，我们将介绍 Entity Framework Core 并演示如何使用它在 ASP.NET\
    \ Core 3 中持久化用户数据。\n\n## 什么是 Entity Framework Core？\n\nEntity Framework Core 是\
    \ Entity Framework 数据访问技术的一种灵活、适应且平台独立的迭代。它允许开发者使用领域特定对象处理数据，并为数据库交互提供了高层抽象。EF\
    \ Core 支持多种数据库提供程序，包括 SQL Server、SQLite、MySQL、PostgreSQL 等。\n\n## 设置 Entity Framework\
    \ Core：\n\n要在 ASP.NET Core 3 应用程序中开始使用 EF Core，你需要安装必要的 NuGet 包，并配置 EF Core 与你选择的数据库提供程序工作。让我们以\
    \ SQL Server 为例。\n\n一旦安装了所需的包，你可以在 `Startup.cs` 文件的 `ConfigureServices` 方法中配置\
    \ EF Core。\n\n```csharp\n// Startup.cs\nusing Microsoft.EntityFrameworkCore;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing YourAppName.Data;\n\npublic\
    \ void ConfigureServices(IServiceCollection services)\n{\n    services.AddDbContext<ApplicationDbContext>(options\
    \ =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n}\n```\n\n## 创建模型类：\n\n接下来，你需要定义模型类来表示数据库中的实体。这些模型类将被 Entity Framework Core\
    \ 用于将数据库表映射到领域对象。\n\n```csharp\n// Example of a model class representing a profile\n\
    public class UserProfile\n{\n    public int Id { get; set; }\n    public string\
    \ Name { get; set; }\n    public int Age { get; set; }\n    public string Email\
    \ { get; set; }\n}\n```\n\n## 创建 DbContext：\n\n`DbContext` 是协调特定数据模型 Entity Framework\
    \ 功能的主类。它代表与数据库的会话，并允许你查询和保存数据。\n\n```csharp\n// Example of a DbContext\nusing\
    \ Microsoft.EntityFrameworkCore;\n\npublic class ApplicationDbContext : DbContext\n\
    {\n    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)\n\
    \        : base(options)\n    {\n    }\n\n    public DbSet<UserProfile> UserProfiles\
    \ { get; set; }\n}\n```\n\n## 执行迁移：\n\n一旦你定义了模型类和 `DbContext`，就可以使用 EF Core 迁移来创建或更新数据库架构。在终端中运行以下命令创建初始迁移：\n\
