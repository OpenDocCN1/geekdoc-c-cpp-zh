    ## 构建布局和局部视图：复用代码以一致的设计\n\n在 ASP.NET Core 3 中，构建布局（Layouts）和局部视图（Partials）是创建一致且视觉良好的\
    \ Web 应用的关键。布局为页面提供了一致的结构，而局部视图允许在多个页面之间复用常用组件。在本指南中，我们将探索如何在 ASP.NET Core 3 中构建布局和局部视图，以创建一个协调且用户友的设计。\n\
    \n## 在 ASP.NET Core 中创建布局：\n\n布局是一个共享模板，定义了 Web 应用中页面的整体结构和设计。布局通常包含常用元素，如页眉、页脚、导航菜单和动态内容的占位符。在\
    \ ASP.NET Core 中，布局使用 `_Layout.cshtml` 文件中的 Razor 语法定义。\n\n```html\n<!-- 布局的示例\
    \ -->\n<!DOCTYPE html>\n<html>\n<head>\n  <title>@ViewData[\"Title\"] - 我的应用程序</title>\n\
    \  <link rel=\"stylesheet\" href=\"~/css/site.css\" />\n</head>\n<body>\n  <header>\n\
    \    <h1>我的应用程序</h1>\n    <nav>\n      <ul>\n        <li><a href=\"/\">首页</a></li>\n\
    \        <li><a href=\"/about\">关于</a></li>\n        <li><a href=\"/contact\"\
    >联系</a></li>\n      </ul>\n    </nav>\n  </header>\n  <main>\n    @RenderBody()\n\
    \  </main>\n  <footer>\n    &copy; 2024 我的应用程序\n  </footer>\n</body>\n</html>\n\
    ```\n\n在上面的示例中，我们定义了一个包含导航菜单、主内容区域和页脚的布局。`@RenderBody()` 函数用于在布局中显示特定页的内容。\n\n\
    ## 用于复用组件的局部视图：\n\n局部视图是可重用的 HTML 标记和 C# 代码分块，可以包含在多个页面中。局部视图允许代码复用并促进应用程序不同部分的设计一致性。在\
    \ ASP.NET Core 中，局部视图在单独 `.cshtml` 文件中使用 Razor 语法定义。\n\n```html\n<!-- 局部视图的示例\
    \ -->\n<!-- _RecentPosts.cshtml -->\n\n@model List<Post>\n\n<h2>最近文章</h2>\n\n\
    <ul>\n\n@foreach (var post in Model)\n{\n<li>@post.Title</li>\n}\n\n</ul>\n```\n\
    \n在上面的示例中，我们定义了一个名为 `_RecentPosts.cshtml` 的局部视图，它显示最近文章列表。该局部视图可以在需要显示的多个页面或布局中复用。\n\
    \n## 在布局或页面中包含局部视图：\n\n要在布局或页面中包含局部视图，您可以在 Razor 语法中使用 `Html.Partial` 或 `Html.PartialAsync`\
    \ 方法。这允许您将局部视图的 HTML 标记和 C# 代码包含在父视图中。\n\n```html\n<!-- 在布局中包含局部视图的示例 -->\n<!--\
    \ _Layout.cshtml -->\n\n<!DOCTYPE html>\n<html>\n<head>\n  <title>@ViewData[\"\
    Title\"] - 我的应用程序</title>\n  <link rel=\"stylesheet\" href=\"~/css/site.css\"\
    \ />\n</head>\n<body>\n  <header>\n    <h1>我的应用程序</h1>\n    <nav>\n      <ul>\n\
    \        <li><a href=\"/\">首页</a></li>\n        <li><a href=\"/about\">关于</a></li>\n\
    \        <li><a href=\"/contact\">联系</a></li>\n      </ul>\n    </nav>\n  </header>\n\
    \  <main>\n    @RenderBody()\n    @await Html.PartialAsync(\"_RecentPosts\", Model.RecentPosts)\n\
    \  </main>\n  <footer>\n    &copy; 2024 我的应用程序\n  </footer>\n</body>\n</html>\n\
    ```\n\n在上面的示例中，我们使用 `Html.PartialAsync` 方法在布局的 `main` 内容区域内包含了 `_RecentPosts.cshtml`\
    \ 局部视图。这允许我们在使用该布局的每个页面上显示最近文章。\n\n"
