    \ your application. In this guide, we'll explore how to work with models in ASP.NET\
    \ Core 3, including creating model classes and using them to represent data.\n\
    \n## Creating Model Classes:\n```"
  mdcn: "\n要处理 ASP.NET Core 中的表单提交，你需要在控制器中定义相应的动作方法（action method）。该动作方法处理表单数据并执行所需的操作，例如将数据保存到数据库或发送电子邮件。\n\
    \n```csharp\n// ASP.NET Core 处理表单提交的示例\n\n[HttpPost]\npublic IActionResult FormHandler(string\
    \ name, string email)\n{\n    // 处理表单数据并执行操作\n    // 示例：保存数据到数据库，发送电子邮件\n\n  \
    \  return RedirectToAction(\"ThankYou\");\n}\n```\n\n在上面的示例中，我们在控制器中定义了一个名为 `FormHandler`\
    \ 的 POST 动作方法。该方法接收与表单输入字段（name 和 email）对应的参数，并处理表单数据。在处理数据后，该方法使用 `RedirectToAction`\
    \ 方法将用户重定向到“感谢”页面。\n\n## ASP.NET Core 中的模型绑定（Model Binding）：\n\nASP.NET Core 支持模型绑定，它可以根据命名规范自动将表单数据绑定到模型类的属性上。这简化了处理表单提交的过程，并减少了所需的样板代码量。\n\
    \n```csharp\n// ASP.NET Core 模型绑定的示例\npublic class ContactFormModel\n{\n    public\
    \ string Name { get; set; }\n    public string Email { get; set; }\n}\n```\n\n\
    ```csharp\n[HttpPost]\npublic IActionResult FormHandler(ContactFormModel model)\n\
    {\n    // 使用模型对象访问表单数据\n    // 示例：string name = model.Name;\n\n    return RedirectToAction(\"\
    ThankYou\");\n}\n```\n\n在上面的示例中，我们定义了一个名为 `ContactFormModel` 的模型类，其属性与表单输入字段对应。`FormHandler`\
    \ 动作方法接收类型为 `ContactFormModel` 的参数，ASP.NET Core 会自动将表单数据绑定到该模型类的属性上。\n\n## ASP.NET\
    \ Core 中的表单验证（Form Validation）：\n\nASP.NET Core 提供了内置的验证机制，可以使用数据注解（data annotations）或自定义验证逻辑来验证表单数据。这确保了用户提交的数据在处理之前是有效的，并且符合某些标准。\n\
    \n```csharp\n// ASP.NET Core 表单验证插图\n\npublic class ContactUserModel\n{\n    [Required(ErrorMessage\
    \ = \"请输入您的姓名.\")]\n    public string Name { get; set; }\n\n    [Required(ErrorMessage\
    \ = \"请输入您的电子邮件地址.\")]\n    [EmailAddress(ErrorMessage = \"请输入有效的电子邮件地址.\")]\n\
    \    public string Email { get; set; }\n}\n```\n\n在上面的示例中，我们为 `ContactUserModel`\
    \ 类添加了数据注解，以为每个属性指定验证规则。这些注解对表单数据实施了约束，并在数据无效时显示错误消息。\n\n理解理解 ASP.Net Core 3 中的表单对于获取用户数据和构建交互式\
    \ Web 应用程序至关重要。通过定义 HTML 表单、处理表单提交、利用模型绑定以及实现表单验证，你可以创建无缝的用户体验，并确保用户提交的数据是准确且有效的。无论你是构建简单的联系表单还是复杂的数据输入表单，ASP.NET\
    \ Core 都提供了你所需的工具和能力来有效且安全地处理表单。\n\n## 处理表单数据：验证和清洗用户输入\n\n在 ASP.NET Core 3 中，处理表单数据不仅涉及捕用户输入，还涉及确保数据有效且经过清洗（sanitized），以防止安全漏洞。对用户输入进行适当的验证和清洗是构建安全可靠的\
    \ Web 应用程序的关键步骤。在本指南中，我们将探索如何在 ASP.Net Core 3 中处理表单数据，包括验证和清洗技术。\n\n## 处理表单提交：\n\
    \n当用户在网页上提交表单时，表单数据会被发送到服务器进行处理。在 ASP.NET Core 中，你可以通过在控制器中定义与表单提交生成的 HTTP POST\
    \ 请求相对应的动作方法来处理表单提交。\n\n```csharp\n// ASP.NET Core 处理表单提交的示例\n\n[HttpPost]\npublic\
    \ IActionResult SubmitForm(string name, string email)\n{\n    // 处理表单数据\n\n  \
    \  // 示例：保存数据到数据库，发送电子邮件\n\n    return RedirectToAction(\"ThankYou\");\n}\n```\n\
    \n在上例示例中，我们在控制器中定义了一个名为 `SubmitForm` 的 POST 动作方法。该方法接收与表单输入字段（name 和 email）对应的参数，并处理表单数据。在处理数据后，该方法将用户重定向到“感谢”页面。\n\
    \n## 表单验证：\n\n表单验证涉及验证用户提供的信息是否正确并符合特定标准。ASP.NET Core 提供了内置的验证机制，允许你使用数据注解或自定义验证逻辑为表单输入字段定义验证规则。\n\
    \n```csharp\n// ASP.NET Core 表单验证插图\n\npublic class ContactFormControl\n{\n  \
    \  [Required(ErrorMessage = \"请输入您的姓名.\")]\n    public string Name { get; set;\
    \ }\n\n    [Required(ErrorMessage = \"请输入您的电子邮件地址.\")]\n    [EmailAddress(ErrorMessage\
    \ = \"请输入有效的电子邮件地址.\")]\n    public string Email { get; set; }\n}\n```\n\n在上例示例中，我们定义了一个名为\
    \ `ContactFormControl` 的模型类，其属性与表单输入字段对应。我们还添加了数据注解（`[Required]` 和 `[EmailAddress]`）来为每个属性指定验证规则。这些注解对表单数据实施了约束，并在数据无效时显示错误消息。\n\
    \n## 清洗用户输入（Sanitizing User Input）：\n\n清洗用户输入是移除或编码潜在有害的字符或脚本的过程，以防止跨站脚本攻击（XSS）攻击等安全漏洞。ASP.NET\
    \ Core 提供了清洗用户输入的内置机制，例如 `HtmlEncoder` 类。\n\n```csharp\n// ASP.NET Core 清洗用户输入的示例\n\
    \npublic IActionResult SubmitForm(string name, string email)\n{\n    name = HtmlEncoder.Default.Encode(name);\n\
    \n    email = HtmlEncoder.Default.Encode(email);\n\n    // 处理清洗后的表单数据\n\n    //\
    \ 示例：保存数据到数据库，发送电子邮件\n\n    return RedirectToAction(\"ThankYou\");\n}\n```\n\n\
    在上面的示例中，我们使用了 `HtmlEncoder.Default.Encode` 方法在处理表单数据之前对 `name` 和 `email` 变量进行清洗。这确保了任何潜在的字符或脚本都被正确编码，降低了\
    \ XSS 攻击的风险。\n\n在 ASP.NET Core 3 中处理表单数据涉及验证和清洗用户输入，以确保 Web 应用程序的安全可靠。通过使用数据注解或自定义验证逻辑正确验证表单输入，你可以对用户提交的数据实施约束并为无效输入提供意义的错误消息。此外，通过使用\
    \ `HtmlEncoder` 类等机制清洗用户输入，你可以防止安全漏洞并防御 XSS 攻击。通过将这些最佳实践纳入表单处理工作流，你可以构建出有效处理用户输入的安全强大的\
    \ Web 应用程序。\n\n## 使用模型：用 C# 类表示你的数据\n\n在 ASP.NET Core 3 中，模型在表示数据和定义应用程序领域对象的结构方面起着至关重要的作用。模型封装了数据实体的属性和行为，使得在整个应用程序中处理和操作数据变得更容易。在本指南中，我们将探索如何在\
    \ ASP.NET Core 3 中使用模型，包括创建模型类以及使用它们来表示数据。\n\n## 创建模型类：\n"
