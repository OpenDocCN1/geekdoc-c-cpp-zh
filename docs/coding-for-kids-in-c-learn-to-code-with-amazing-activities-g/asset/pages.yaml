    # # Building Boolean Expressions


    A **Boolean expression** is any expression that has one of two values. It is either
    true or false. It is basically an expression that compares two values and returns
    true/false.


    Two comparisons can be combined using the “**and” operator, which is **&&** in
    C++. For example, the following Boolean expression is true provided a is bigger
    in value than 5 and a is smaller than 10:


    **(5 < a) && (a < 10)**


    The above operation returns true if a is between 5 and 10 (not including 5,10).'
