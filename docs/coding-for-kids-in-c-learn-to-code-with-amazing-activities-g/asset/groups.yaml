- md: "\n# LEARN TO CODE WITH AMAZING ACTIVITIES, GAMES AND PUZZLES IN C++\n\n# CODING\
    \ FOR KIDS IN C++\n\n# BOB MATHER\n\n# Coding for Kids in C++\n\n# Table of Contents\n\
    \n- Table of Contents\n- Disclaimer\n- Free Gift\n- Introduction\n- Why Learn\
