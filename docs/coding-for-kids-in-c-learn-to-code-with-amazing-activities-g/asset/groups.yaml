    \ in this window\nClick Next on the information window\n\n![](img/1c0edee3ee8f0c0e33e80da6eb597604_18_0.png)\n\
    \nGive the Project a title, for now it is **Hello World.** Select which folder\
    \ it will be saved at.\n\n![](img/1c0edee3ee8f0c0e33e80da6eb597604_19_0.png)\n\
    \nEnsure that you have **GNU GCC Compiler** selected as the compiler and click\
    \ on **Finish.**\n\nNow on the left-hand side, under Hello World, click on the\
    \ + icon next to the **Sources folder** to reveal the **main.cpp** file. Double\
    \ click on it to display the file on the editor window on the right-hand side.\n\
    \n![](img/1c0edee3ee8f0c0e33e80da6eb597604_20_0.png)\n\nThe code in the editor\
    \ looks like the example below\n\n# Code\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main()\n{\n    cout << \"Hello World\" << endl;\n    return\
    \ 0;\n}\n```\n\nI am pretty sure that the above code looks overwhelming when you\
    \ first see it. But we are going to understand what it all means by the end of\
    \ a few chapters. For now hang in there as I try to explain the main part of this\
    \ program.\nThe trick with programming is to persevere as things get easier the\
    \ more you learn.\n\nLet's first run the code.\n\n# Running the code\n\nTo run\
    \ the code, we have to compile it first.\n\nIn Code::Blocks, we use the term *build*\
    \ instead of compile. This is because a project usually consists of multiple C++\
