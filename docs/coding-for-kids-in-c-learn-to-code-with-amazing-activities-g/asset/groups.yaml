    \ by the information. All readers are encouraged to seek professional advice when\
    \ needed.\n\n# Free Gift\n\nWe do want you to succeed in coding. To ensure your\
    \ success, we are giving you a free list of projects that you can work on once\
    \ you are completed with this book.\nhttps://coding.gr8.com/\n\n![](img/1c0edee3ee8f0c0e33e80da6eb597604_5_0.png)\n\
    \n# Introduction\n\n### What is Programming\n\nProgramming is the art of writing\
    \ a computer program. A computer program is a set of instructions that a machine\
    \ can comprehend to perform a certain task. Computer programming is how humans\
    \ communicate with machines.\n\nComputers are pretty good at following the instructions\
    \ we give them.\n\nA program is just simply a list of steps that should be followed\
    \ to achieve a goal. It is just like a recipe, to prepare your favorite dish you\
    \ just need to follow the instructions on the recipe.\n\nThe only issue is that\
    \ computers do not speak English as we do, they speak their own language. This\
    \ computer language is known as machine language.\n\nThere is a part on the computer\
    \ called the interpreter, which interprets our instructions to machine language\
    \ so that the computer is able to understand the instructions we are giving it.\
    \ This interpreter is also known as a **compiler.**\n\nA compiler is the interface\
    \ between the programming language and the machine. A programming language is\
    \ a very simple language to learn and there are numerous programming languages\
    \ out there. We are only going to learn C++ in this book.\n\nAs you know, spoken\
    \ languages usually have grammar. Grammar is a way of arranging words in a language\
    \ to make sense to others who speak that language. Programming languages have\
    \ grammar as well, which we call **syntax.**\n\nIn order for the compiler to understand\
    \ you, you have to use the proper syntax or else it will cause an error. We will\
    \ at first spend a lot of time learning the syntax of our programming language.\n\
    \nIn summary, we write a program using a programming language. The programming\
    \ languages communicates with the compiler. The compiler translates the language\
    \ to machine language and then runs the program. The computer reads our instructions\
    \ and does what we have told it to do.\n\nYour first programming language is usually\
    \ the toughest to learn but after learning it, it becomes easier to learn other\
    \ languages.\n\n# Why C++\n\nYou can do a lot after learning C++. You can make\
    \ games, use the Arduino board to make cool projects or even program planes if\
    \ you are allowed to do that. The only limit you have is your imagination.\n\n\
    The main benefit of C++ is that it is very portable between operating systems\
    \ and compilers. This means the same code can be used in Windows, Linux, Opera\
    \ etc.\n\nC++ has a large community support with developer forums, online tutorials,\
    \ Facebook community groups, which is very significant for beginner programmers.\
    \ It's much easier to learn as you can ask other people in the community if you\
    \ get stuck.\n\nC++ is also very scalable and flexible in multiple environments.\
    \ This means that it can be used by beginner programmers and advanced professionals\
    \ for different purposes. It can also be used to code games, applications, software\
    \ and apps.\n\nC++ is wildly used in graphics and is now used in emerging technologies\
    \ like image processing, pattern recognition and in embedded systems like location\
    \ tracing.\n\nC++ is more efficient at using computer memory, so it saves space\
    \ on your hard drive.\n\n# Why Learn Programming\n\nProgramming at its core is\
    \ not really about problem-solving, it's about learning how to break problems\
    \ down into smaller, manageable parts. This skill is useful in many areas of life,\
    \ not just in software development.\n\nProgramming allows you to express your\
    \ creativity and build things from scratch. Whether it's a simple website, a game,\
    \ or a complex system, the power to create is at your fingertips.\n\nLearning\
    \ to program also sharpens your ability to think logically and analytically. It\
    \ teaches you how to approach problems systematically and find efficient solutions.\
    \ These skills are highly valued in the job market.\n\n# Setting Up the Workspace\n\
    \nIn order to write code, you need at least a text editor and a compiler. A text\
    \ editor is just a program that enables you to write and save code.\n\nFiles usually\
    \ have extensions to indicate the kind of file it is. When writing C++, the files\
    \ have the extension .cpp, example main.cpp.\n\nWe are going to use an application\
    \ known as Code::Blocks to write, compile and run programs. Code::Blocks is what\
    \ is known as an IDE.\n\nAn IDE has everything you need to write, compile and\
    \ run a program in one place. Below is the layout of the CodeBlocks IDE\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout << \"Hello\
    \ world!\" << endl;\n    return 0;\n}\n```\n\n# Downloading and Installing CodeBlocks\n\
    \nYou will need:\n\n1. A laptop/ Desktop\n2. Internet Connection\n3. Web browser\
    \ such as Chrome, Windows Edge or Firefox\n\nGo to this website and download the\
    \ CodeBlocks application:\nhttps://www.fosshub.com/Code-Blocks.html?dwl=codeblocks-20.03mingw-setup.exe\n\
    \nNote: please ensure that you download the file named Code Blocks 64 bit (including\
    \ compiler).\n\nThis version includes the compiler which we need. After that just\
    \ install the application and open it when done:\n\nYou can head over to the CodeBlocks\
    \ website at the following link:\nhttps://www.codeblocks.org/ to learn more about\
    \ it. It also includes user manual and links to download the IDE for other operating\
    \ systems\n\n# Hello World in C++\n\nThe first program that all programmers write\
    \ when learning a new programming language is known as Hello World.\n\nIt is just\
    \ basically writing a program that displays the words 'Hello World' to the screen.\
    \ Since we are programmers now, we say that we are printing the words 'Hello World'\
    \ to the screen.\n\nI will be giving out code examples, and you will have to type\
    \ the examples in the Code::Blocks and click on the build and run button to compile\
    \ and execute the code in order to see the results.\n\n# Creating A Project in\
    \ Code::Blocks\n\nIn order to run code in Code::Blocks we have to first create\
    \ a project. So first of all we need to open up Code::Blocks.\n\nTo create a project,\
    \ click on **File > New > Project**\n\nIn the pop-up window select **Console application**\
    \ and click on the button **Go**\n"
  mdcn: "\n\n# 通过趣味活动、游戏和谜题学习 C++ 编程\n\n# 适合少年的 C++ 编程\n\n# BOB MATHER\n\n# 少少 C++\
    \ 编程\n\n# 目录\n\n- 目录\n- 免责声明\n- 免费赠品\n- 引言\n- 为什么要学习编程\n- 设置工作区\n- C++ 中的 Hello\
    \ World\n- 变量\n- 数学运算\n- 函数\n- 条件判断语句\n- 循环\n- 数组\n- 结构体\n- 最终项目\n\n# 免责声明\n\n\
    版权所有 © 2021\n\n保留所有\n\n未经作者事先书面许可，不得以任何形式（包括打印、电子、复印、扫描、机械或录制）传输或复制本电子书的任何部分。\n\
    \n虽然作者已尽最大努力确保书中书面内容的准确性，但建议所有读者自行承担参考本文提及信息的风险。对于因这些信息而造成的任何个人或商业损失，作者不承担任何责任。鼓励所有读者在需要时寻求专业建议。\n\
    \n# 免费赠品\n\n我们真心希望你在编程上取得成功。为了确保你的成功，我们为你提供了一份免费的项目列表，你可以在完成这本书后尝试这些项目。\nhttps://coding.gr8.com/\n\
    \n![](img/1c0edee3ee8f0c0e33e80da6eb597604_5_0.png)\n\n# 引言\n\n### 什么是编程\n\n编程是编写计算机程序的艺术。计算机程序是一组机器可以理解并执行特定任务的指令。计算机编程是人类与机器交流的方式。\n\
    \n计算机非常擅执行我们给它们的指令。\n\n程序简单来说为了实现目标应该遵循的步骤列表。它就像菜谱一样，准备你喜欢的菜肴只需要遵循菜谱上的指令即可。\n\n\
    唯一的问题是计算机不像我们一样会说英语，它们有自己的语言。这种计算机语言被称为机器语言。\n\n计算机上有一个部分叫做解释器，会将我们的指令解释成机器语言，以便计算机能够理解我们给它的指令。这个解释器也被**编译器**。\n\
    \n编译器是编程语言与机器之间的接口。编程语言是一种非常容易学习的语言，世界上有许多编程语言。我们在书中将学习 C++。\n\n如你所知，口语通常有语法。语法是语言中排列单词的方式，以便让说该语言的人理解。编程语言也有语法，我们称之为**语法**。\n\
    \n为了让编译器理解你，你必须使用正确的语法，否则会导致错误。我们最初将花费大量时间学习我们编程语言的语法。\n\n总结一下，我们使用编程语言编写程序。编程语言与编译器通信。编译器将语言翻译成机器语言然后运行程序。计算机读取我们的指令并执行我们告诉它做的事。\n\
    \n你的第一种编程语言通常是最难学的，但在学习它之后，学习其他语言就会变得容易。\n\n# 为什么选择 C++\n\n学习 C++ 后你可以做很多事情。你可以制作游戏、使用\
    \ Arduino 开发板制作酷炫的项目，甚至在允许的情况下为飞机编写程序。你唯一的限制就是你的想象力。\n\nC++ 的主要优势是它在不同的操作系统和编译器之间具有非常好的移植性。这意味着相同的代码可以在\
    \ Windows、Linux、Opera 等系统中运行。\n\nC++ 拥有强大的社区支持，包括开发者论坛、在线教程、Facebook 社区小组等，这对初学者编程人员来说非常重要。它更容易学习，因为当你遇到困难时，可以向社区其他人其他人教。\n\
    \nC++ 在多种环境中也具有非常强的扩展性和活性。这意味着初学者编程人员和高级专业人士都可以为了不同的目的使用。它还可以用于编写游戏、应用程序、软件和应用。\n\
    \nC++ 在图形领域被广泛使用，现在被用于图像处理、模式识别等新兴技术以及位置追踪等嵌入式系统。\n\nC++ 使用计算机内存的效率更高，因此可以节省你的硬盘空间。\n\
    \n# 为什么要学习编程\n\n编程的核心并不是真的为了解决问题，而是关于学习如何将问题拆解成更小、更易管理的部分。这种技能在生活的许多领域都有用，而不仅仅是软件开发。\n\
    \n编程允许你表达创造力并从零开始构建东西。无论是简单的网站、游戏还是复杂的系统，创造的力量就在你的指尖。\n\n学习编程还能磨练你的逻辑思维和分析能力。它教你如何系统方法地处理问题并找到高效的解决方案。这些技能在职场动力市场中备受推崇。\n\
    \n# 设置工作区\n\n为了编写代码，你至少需要一个文本编辑器和一个编译器。文本编辑器只是一个让你编写和保存代码的程序。\n\n文件通常有扩展名来指示文件的类型。编写\
    \ C++ 时，文件扩展名为 `.cpp`，例如 `main.cpp`。\n\n我们将使用一个名为 Code::Blocks 的应用程序来编写、编译和运行程序。Code::Blocks\
    \ 是我们所说的 IDE。\n\nIDE 在一个地方提供了编写、编译和运行程序所需的所有内容。以下是 CodeBlocks IDE 的布局：\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout << \"Hello\
    \ world!\" << endl;\n    return 0;\n}\n```\n\n# 下载并安装 CodeBlocks\n\n你需要：\n\n1.\
    \ 笔记本电脑/台式机\n2. 互联网连接\n3. 网页浏览器，如 Chrome、Windows Edge 或 Firefox\n\n访问此网站下载 CodeBlocks\
    \ 应用程序：\nhttps://www.fosshub.com/Code-Blocks.html?dwl=codeblocks-20.03mingw-setup.exe\n\
    \n注意：请确保下载名为 Code Blocks 64 bit (including compiler) 的文件。\n\n此版本包含了我们需要的编译器。之后只需安装应用程序并打开：\n\
    \n你可以可以通过链接访问 CodeBlocks 网站以获取更多信息：\nhttps://www.codeblocks.org/ 它还包含了用户手册和适用于其他操作系统的下载链接。\n\
    \n# C++ 中的 Hello World\n\n所有编程人员在学习新编程语言时编写的第一个程序被称为 Hello World。\n\n它基本上就是编写一个在屏幕上显示“Hello\
    \ World”字符串的程序。由于我们现在是程序员了，我们说是在屏幕上打印“Hello World”字符串。\n\n我将提供代码示例，你需要在 Code::Blocks\
    \ 中输入这些示例，并点击构建并运行按钮来编译并执行代码以查看结果。\n\n# 在 Code::Blocks 中创建项目\n\n为了在 Code::Blocks\
    \ 中运行代码，我们必须先创建一个项目。首先，我们需要打开 Code::Blocks。要要创建项目，点击 **File > New > Project**\n\
    \n在弹出窗口中选择 **Console application** 并点击 **Go** 按钮。\n\n"
