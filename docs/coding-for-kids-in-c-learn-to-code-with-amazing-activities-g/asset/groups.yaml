    \ they do not start with a letter or an underscore.\n\nC++ is also case sensitive,\
    \ meaning that the following are three distinct variable names:\n\n- Rate\n- RATE\n\
    \n# Rate\n\n# Camel Case\n\nCamel case is a programming practice where multiple\
    \ words are written without spaces and the first letter of each word is capitalized\
    \ (except for the first word)\n\nThe word end of car would become: endOfCar\n\
    Camel case is a commonly used programming practice to name variables.\n\n# Keywords\n\
    \nKeywords are names that cannot be used as variable names as they are reserved\
    \ for programming language syntax.\n\nIf you use them as variable names the compiler\
    \ will throw errors, or you might end up changing the basic functionality of some\
    \ basic function.\n\nExamples of keywords include the basic data types, such as\
    \ int, bool and the rest, and names such as struct and class.\n\n# Comments\n\n\
