  \n我们使用 Jest mock 函数来捕捉并检查 `Client.search()` 调用。现在，让我们看看如何使用它建立下一层上下文的行为：当 API 返回结果时。\n\
  \n#### API 返回结果\n\n正如我们在预定义的测试脚手架所示，我们将与此上下文相关的测试用例写在自己的 `describe` 中：\n\n```\n\
  describe('FoodSearch', () => {\n  // ...\n\n  describe('user populates search field',\
  \ () => {\n    // ...\n\n    describe('and API returns results', () => {\n     \
  \ beforeEach(() => {\n        // ... 模拟 API 返回结果\n      });\n\n      // ... 测试用例\n\
  \    });\n\n    describe('then user types more', () => {\n      // ...\n\n    });\n\
  \  });\n});\n```\n\n\n\n```javascript\n it('should call `Client.search() with `value`',\
  \ () => {\n      const invocationArgs = Client.search.mock.calls[0];\n      expect(\n\
  \        invocationArgs[0]\n      ).toEqual(value);\n    });\n\n    describe('and\
  \ API returns results', () => {\n      const foods = [\n        {\n          description:\
  \ 'Broccolini',\n          kcal: '100',\n          protein_g: '11',\n          fat_g:\
  \ '21',\n          carbohydrate_g: '31',\n        },\n        {\n          description:\
  \ 'Broccoli rabe',\n          kcal: '200',\n          protein_g: '12',\n       \
  \   fat_g: '22',\n          carbohydrate_g: '32',\n        },\n      ];\n      beforeEach(()\
  \ => {\n        const invocationArgs = Client.search.mock.calls[0];\n        const\
  \ cb = invocationArgs[1];\n        cb(foods);\n        wrapper.update();\n     \
  \ });\n```\n\n`/food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-6.js`\n\
  \n首先，我们声明一个数组 `foods`，并将其用作 `Client.search()` 返回的模拟结果集。\n\n其次，在我们的 `beforeEach`\
  \ 中，我们获取 `Client.search()` 被调用时传入的第二个参数，在这种情况下是我们的回调函数。然后我们用我们的食物对象数组调用它。**通过手动调用传递给模拟（mock）的回调函数，我们可以模拟异步资源的预期行为。**\n\
  \n最后，我们在调用回调后调用了 `wrapper.update()`。这将导致我们的组件重新渲染。当组件被浅渲染（shallow-rendered）时，通常的重新渲染钩子（hooks）不会起作用。因此，当在我们的回调中调用\
  \ `setState()` 时，不会触发重新渲染。\n\n如果是这样的话，你可能会奇怪为什么这是我们第一次需要使用 `wrapper.update()`。实际上，Enzyme\
  \ 在我们的每次调用 `simulate()` 之后都会自动调用 `update()`。`simulate()` 会触发一个事件处理器。在那个事件处理器返回后立即，Enzyme\
  \ 就会调用 `wrapper.update()`。\n\n由于我们在事件处理器返回*一段时间后*才调用回调，因此我们需要手动调用 `wrapper.update()`\
  \ 来重新渲染组件。\n\n回调被调用后，让我们编写第一个测试用例。我们将断言状态中的 `foods` 属性与我们的食物数组匹配：\n\n```javascript\n\
  \ it('should set the state property `foods`', () => {\n        expect(\n       \
  \   wrapper.state().foods\n        ).toEqual(foods);\n      });\n```\n\n`/food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-6.js`\n\
  \n再次，我们在从 `EnzymeWrapper` 读取状态时使用了使用了 `state()` 方法。\n\n接下来，我们将断言表格有两个行：\n\n```javascript\n\
  \ it('should display two rows', () => {\n        expect(\n          wrapper.find('tbody\
  \ tr').length\n        ).toEqual(2);\n      });\n```\n\n`/food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-6.js`\n\
  \n因为这个测试用例与我们之前的测试用例“should display zero rows”使用了相同的选择器，这让我们确保之前的测试用例使用了正确的选择器。\n\
  \n最后，让我们更进一步，断言我们的两种食物实际上都打印在表格中。有很多方法可以实现这一点。由于每个 `description` 都是唯一的，我们实际上可以直接在\
  \ HTML 输出中查找每种食物的描述，如下：\n\n```javascript\n it('should render the description of\
