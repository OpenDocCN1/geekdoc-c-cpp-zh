  \ `newMessage`。我们预计 `messagesReducer()` 会处理这一点。\n\n然后，在为 `newThread` 指定 `messages`\
  \ 属性时，我们将创建此数组的委托委托给 `messagesReducer()`：\n\n```javascript\nfunction threadsReducer(state,\
  \ action) {\n  if (action.type === 'ADD_MESSAGE') {\n    const threadIndex = state.findIndex(\n\
  \      (t) => t.id === action.threadId\n    );\n    const oldThread = state[threadIndex];\n\
  \    const newThread = {\n      ...oldThread,\n      messages: messagesReducer(oldThread.messages,\
