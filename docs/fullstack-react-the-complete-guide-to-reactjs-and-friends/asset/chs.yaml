  \ store 通信，`App` 不再需要为它们提供任何 props 了。\n\n## 从 `App` 中移除 store\n\n由于我们的容器组件现在可以直接与\
  \ store 交互，我们可以从 `App` 中移除所有与 store 的通信。事实上，我们可以直接将 `App` 转换为一个无状态组件：\n\n```javascript\n\
