  \n## JSX 和虚拟 DOM\n\n### React 使用虚拟 DOM\n\nReact 的工作方式与许多早期的 JavaScript 框架不同，它不是直接与**浏览器\
  \ DOM** 交互，而是构建**虚拟表示**。在 React 中，我们*不直接操作 DOM*。相反，我们操作虚拟表示。正如我们在本章所示，这是一个非常强大的功能。\n\
  \n### 为什么不修改实际 DOM？\n\n值得问：为什么我们需要虚拟 DOM？难道我们不能直接使用“实际 DOM”吗？\n\n当我们进行经典的（例如 jQuery）风格\
  \ Web 开发时，我们通常会：\n\n1. 定位元素（使用 `document.querySelector` 或 `document.getElementById`）然后\n\
  2. 直接修改该元素（例如通过设置 `.innerHTML`）。\n\n这种开发风格存在的问题在于：\n\n- **很难跟踪更改** —— 很难跟踪 DOM 的当前和之前的状态，以便将其转换为我们需要的格式。\n\
  - **可能会很慢** —— 修改实际 DOM 是一项昂贵的操作，每次更改都修改 DOM 会显著降低性能。\n\n### 什么是虚拟 DOM？\n\n虚拟 DOM\
  \ 的创建是为了解决这些问题。但虚拟 DOM 到底是什么？\n\n虚拟 DOM 是表示实际 DOM 的 JavaScript 对象树。\n\n使用虚拟 DOM\
  \ 的有趣原因之一是它提供的 API。使用虚拟 DOM 时，我们编写代码就像在**更新时重新创建整个 DOM**一样。这种每次更新都重新创建整个 DOM 的想法导致了一种易于理解开发模型：开发者不需要跟踪所有的\
  \ DOM 状态变化，开发者只需返回他们*想要看到的* DOM。React 在后台处理转换。\n\n这种每次更新都重新创建虚拟 DOM 的想法听起来像是个坏主意：它会很慢吗？事实上，React\
  \ 的虚拟 DOM 实现包含了重要的性能优化，使其非常快。\n\n虚拟 DOM 将：\n\n- 使用**高效的差分算法**，以确定哪些变化\n- 同时更新 DOM\
  \ 的子树\n- 批量处理对 DOM 的更新\n\n所有这一切都导致了一种易于使用且优化的构建 Web 应用的方法。\n\n### 虚拟 DOM 碎片\n\n\n\
  \n\n再次，在 React 中构建 Web 应用时，我们并不是直接操作浏览器的“真实 DOM”，而是操作它的*虚拟表示*。我们的工作是为 React 提供足够的信息，以构建一个\
  \ `JavaScript object`，该对象将*代表*浏览器将要渲染的内容。\n\n但这个虚拟 DOM JavaScript 对象究竟包含什么呢？\n\n\
  **React 的虚拟 DOM 是一个由 `ReactElement` 组成的树。**\n\n理解虚拟 DOM、`ReactElement` 以及它们如何与“真实\
  \ DOM”交互，通过通过一些示例来学习要容易得多，我们将在下文中完成这些工作。\n\n### ReactElement\n\n`ReactElement` 是虚拟\
  \ DOM 中一个 DOM 元素的表示。\n\nReact 会获取这些 `ReactElement` 并为我们将其放入“真实 DOM”中。\n\n获取 `ReactElement`\
  \ 直观感受的最佳方法之一是在我们的浏览器中玩玩它。\n\n#### 对 ReactElement 进行实验\n\n我们将从使用一个简单的 HTML 模板开始，其中包含一个带有\
  \ `id` 标签的 `<div>` 元素：\n\n```html\n1 <div id='root' />\n```\n\n![Root Element](img/components----bare----bare-root-element.png)\n\
  \nRoot Element\n\n让我们看看如何使用 React 在我们的（真实）DOM 中渲染一个 `<b></b>` 标签。当然，我们**不会**直接在\
  \ DOM 中创建 `<b>` 标签（就像我们使用 jQuery 之类的库时可能会这样做那样）。\n\n相反，React 要求我们提供一个**虚拟 DOM 树**。也就是说，我们将给\
  \ React 提供一组 JavaScript 对象，**React 将这些对象转换为真实的 DOM 树**。\n\n构成树的对象将是 `ReactElement`。要创建一个\
  \ `ReactElement`，我们使用 React 提供的 `createElement` 方法。\n\n例如，要在 React 中创建一个表示 `<b>`（加粗）元素的\
  \ `ReactElement`，请在浏览器控制台中输入以下内容：\n\n```javascript\nvar boldElement = React.createElement('b');\n\
  ```\n\n![`boldElement` is a `ReactElement`](img/components----bare----bare-boldElement.png)\n\
  \n`boldElement` 是一个 `ReactElement`\n\n上面的 `boldElement` 是 `ReactElement` 的实例。现在，我们有了这个\
  \ `boldElement`，但如果不把它交给 React 在真实 DOM 树中进行渲染，它是不可见的。\n\n#### 渲染我们的 ReactElement\n\
  \n为了将此元素渲染到真实 DOM 树，我们需要使用 `ReactDOM.render()`（我们将在本章稍后的部分 详细详细地介绍）。`ReactDOM.render()`\
  \ 需要两个东西：\n\n1. 我们虚拟树的*根节点*\n2. 我们希望 React 写入*真实*浏览器 DOM 的*挂载位置*\n\n在我们在我们简单的模板中，我们想要访问\
  \ `id` 为 `root` 的 `<div>` 标签。为了获取我们真实 DOM `root` 元素的引用，我们使用以下方法之一：\n\n```javascript\n\
  // 这两种任一都有效\nvar mountElement = document.getElementById('root');\nvar mountElement\
  \ = document.querySelector('#root');\n\n// 如果我们使用 jQuery，这也可以工作\nvar mountElement\
  \ = $('#root')\n```\n\n从 DOM 中获取到 `mountElement` 后，我们可以给 React 提供一个插入其自身渲染的 DOM\
  \ 的点。\n\n```javascript\nvar boldElement = React.createElement('b');\nvar mountElement\
  \ = document.querySelector('#root');\n// 在 DOM 树中渲染 boldElement\nReactDOM.render(boldElement,\
  \ mountElement);\n```\n\n![](img/components----bare----boldElement-first-render.png)\n\
  \n尽管 DOM 中没有出现任何，但一个新的空元素已经作为 `mountElement` 的子元素插入了文档。\n\n#### 添加文本（带有子元素）\n\n\
  虽然我们现在在 DOM 中有一个 `<b>` 标签，但如果能在标签中添加一些文本就太好了。因为文本位于起始和结束的 `<b>` 标签之间，所以添加文本就是创建该元素的*子元素*的问题。\n\
  \n上面，我们使用 `React.createElement` 时只使用了一个参数（`b` 标签的 `'b'`），但 `React.createElement()`\
  \ 函数接受三个参数：\n\n1. DOM 元素类型\n2. 元素的 `props`\n3. 元素的子元素\n\n我们将在本节稍后详细介绍 `props`，因此现在我们将此参数设置为\
  \ `null`。\n\nDOM 元素的 `children` 必须是一个 `ReactNode` 对象，它是以下任何一种类型：\n\n1. `ReactElement`\n\
  2. 字符串或数字（一个 `ReactText` 对象）\n3. `ReactNodes` 数组\n\n例如，要在我们的 `boldElement` 中放置文本，我们可以作为上面\
  \ `createElement()` 函数的第三个参数传递字符串：\n\n```javascript\nvar mountElement = document.querySelector('#root');\n\
  // 第三个参数是内部文本\nvar boldElement = React.createElement('b', null, \"Text (as a string)\"\
  );\nReactDOM.render(boldElement, mountElement);\n```\n\n![](img/components----bare----boldElement-with-text.png)\n\
