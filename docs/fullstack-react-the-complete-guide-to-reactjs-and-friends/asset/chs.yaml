  \n相反，我们只需要一个通用的展示层组件。`TextFieldSubmit` 只渲染 HTML 标记，并允许其父组件指定文本字段提交时会发生什么。`ThreadDisplay`\
  \ 通过 `Thread` 可以控制此文本字段的行为。\n\n通过这种设计，我们在顶部为线程拥有了一个容器组件。展示层组件 `Thread` 将是两个子展示层组件\
  \ `MessageList` 和 `TextFieldSubmit` 的组合：\n\n![](img/7-presentational-and-container-components----thread-display-and-thread.png)\n\
  \n让我们先将当前的 `Thread` 组件重命名为 `ThreadDisplay` 以避免混淆：\n\n```javascript\n// 从 `Thread`\
