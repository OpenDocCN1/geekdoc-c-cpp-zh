  \n## updateBook Mutation\n\nWe can see here that `updateBook` takes a single argument\
  \ `input`, which is of type `updateBookInput`, and it returns an item of type `updateBookPayload`.\n\
  \nFor `updateBook`, the values that we use for `updateBookInput` will be used as\
  \ the new values for the book we specify. \n\nThat is, we’ll send an `id`, which\
  \ will be used to look up the specific `Book` we’re changing, and we’ll send new\
  \ values such as the `name`, `tagline`, or `description`.\n\nWhen it comes time\
  \ to send this mutation, the values passed in to `updateBookInput` will come from\
  \ the function `getVariables`:\n\n```\n14   getVariables() {\n15     return {\n\
  16       id: this.props.id,\n17       name: this.props.name,\n18       tagline:\
  \ this.props.tagline,\n19       description: this.props.description\n20     };\n\
  21   }\n```\n\nrelay/bookstore/client/src/mutations/UpdateBookMutation.js\n\nThis\
  \ function describes how to create the arguments for `updateBookInput` – in this\
