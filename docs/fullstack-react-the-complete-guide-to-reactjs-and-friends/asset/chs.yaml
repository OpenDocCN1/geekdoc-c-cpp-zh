  \n我们断言调用的索引为 0 的参数匹配 `value`，在这种情况下是 `brocc`。\n\n### 尝试一下\n\n由于 `Client` 已被 mock，我们可以在确保\
  \ `FoodSearch` 完全隔离的情况下运行测试套件。保存 `FoodSearch.test.js` 并从控制台运行测试套件：\n\n```\n$ npm\
