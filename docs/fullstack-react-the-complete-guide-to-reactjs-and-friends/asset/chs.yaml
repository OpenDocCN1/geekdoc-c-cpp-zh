- "# Full栈 React：ReactJS 及其周边完整指南\n\n\n\n![](img/title_page.jpg)\n\n![全栈 React](img/title_page.jpg)\n\
  \n\n\n\n本书可在 [`leanpub.com/fullstackreact`](http://leanpub.com/fullstackreact) 购买\n\
  \n\n![出版商标志](img/leanpub-logo.png)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n\
  Web 开发通常被视为一个疯狂的世界，你开发软件的方式是在层层堆叠中打补丁（hacks）。我相信 React 打破了这种模式，转而从第一性原理进行设计，这为你构建应用奠定了坚实的基础。\n\
  \n![Christopher Chedeau - Facebook 前端工程师](img/forward----vjeux.jpg)\n\nChristopher\
  \ Chedeau - Facebook 前端工程师\n\n前端应用 Bug 的主要来源是数据模型与 DOM 的同步。要确保每当数据变化时，UI 中的所有内容都能同步更新是非常的。\n\
  \nReact 的第一个创新是引入了 DOM 的纯 JavaScript 表示，并在用户层实现差异比较（diff），然后使用发送简单命令的事件：创建、更新、删除。\n\
  \n通过 React，通过在任何内容变化时从概念上重新渲染一切内容，你不仅拥有了默认安全的代码，工作量也更少，因为你只需要编写创建路径：更新将由框架为你处理。\n\
  \n长期以来，由于为了让 DOM 工作而需要支持庞大的 API Surface，浏览器在各个方面一直是不兼容的。React 不仅提供了一种解决浏览器差异的佳方法，还实现了以前前端库无法实现的用例，例如服务器端渲染，以及实现原生\
  \ iOS、Android 甚至硬件组件等渲染目标的能力。\n\n但关于 React 最重要的一点，也是你应该阅读这本书的主要原因：你不仅将用它为你的用户制作出色的应用程序，它还会让你成为一个更好的开发者。库一直在层出不穷，React\
  \ 可能也不会例外。它的特殊之处在于它教了你可以贯穿整个职业生涯的理念。\n\n**你将更擅长 JavaScript**，因为 React 并不带模板系统。相反，React\
  \ 促使你使用 JavaScript 的全部威力来构建用户界面。\n\n你将练习使用 `map` 和 `filter` 等函数式编程部分，并鼓励使用 JavaScript\
  \ 的最新特性（包括 ES6）。通过不抽象化数据管理，React 将迫使你思考如何架构应用，并鼓励你考虑不可变性（immutability）等概念。\n\n我很自豪围绕\
  \ React 构建的社区并不害怕“重新思考最佳实践”。社区在许多领域挑战现状。给你的建议是阅读这本优秀的书来学习并理解 React 的基础。学习新概念可能会感到奇怪，但“给它\
  \ 5 分钟”，并练习直到你感到自在。\n\n然后，**尝试打破规则**。构建软件没有唯一的最佳方法，React 也不例外。React 实际上拥抱这一事实，当你想要进行\
  \ React 之外的操作时，它为你提供了逃生（escape hatches）。\n\n提出疯狂的想法吧，谁知道呢，也许你将发明 React 的继任者！\n\n\
  – Christopher Chedeau [@vveux](https://twitter.com/Vjeux) Facebook 前端工程师\n\n## 如何充分利用本书\n\
  \n### 概述\n\n本书旨在成为学习 React 最实用的资源。当你读完这本书时，你（以及你的团队）将拥有构建可靠、强大应用所需的一切。\n\nReact\
  \ 核心精简而强大。在完成前几章后，你对 React 有坚实的理解，并能够构建各种交互应用。\n\n本书由两部分组成。\n\n在第一部分，我们通过渐进的示例驱动方法涵盖所有基础。你将创建第一个应用，学习如何编写组件、处理用户交互、管理复杂的表单，甚至与服务器交互。\n\
  \n我们通过探索 Create App（Facebook 用于运行 React 应用的工具）的原理、编写单元测试以及构建使用客户端路由的多页面应用来结束第一部分。\n\
  \n本书的第二部分进入了大型生产应用中常见的更高级的概念。这些概念探索了数据架构、传输和管理的策略：\n\nredux 是基于 Facebook Flux 架构的状态管理范式。redux\
  \ 为大型状态树提供了结构，并允许将应用中的用户交互与状态更改分离。\n\nGraphQL 是一种强大的、类型的 REST API 替代方案，客户端描述它需要的数据。我们涵盖了如何为自己的数据编写\
  \ GraphQL 服务器。\n\nRelay 是 GraphQL 和 React 之间的胶水。Relay 是一个数据获取库，让编写灵活、高效的应用无需大量获取代码。\n\
  \n最后，在最后一章，我们将讨论如何使用 React Native 原生跨平台移动应用。\n\n为了充分利用本书，我们给你一些指南。\n\n首先，知道你不需要从头到尾线性地阅读这本书。然而，我们根据认为认为的概念学习顺序安排了书的内容。我们鼓励你在深入第二部分概念之前，学习第一部分的所有概念。\n\
  \n其次，请记住这个包不仅仅是一本书——它是一门包含每个章节示例代码的课程。下文中，我们将告诉你：\n\n* 如何处理示例代码以及\n\n* 如果出现问题如何寻求帮助\n\
  \n### 运行示例代码\n\n\n\n\n\n本书附带了一个可运行的代码示例库。您可以从购买本书的同一处下载代码。如果您是在亚马逊（Amazon）上购买这本书的，您应该已经收到一封包含说明的电子邮件。\n\
  \n如果您在查找或下载代码示例时遇到任何问题，请发送邮件至 `react@fullstack.io` 与我们联系。\n\n我们使用 `npm` (https://www.npmjs.com/)\
  \ 程序来运行书中的每一个示例。您可以使用以下两个命令启动大多数应用：\n\n```bash\nnpm install\nnpm start\n```\n\n\
  运行 `npm start` 后，您将在屏幕上看到一些输出，它会告诉您打开哪个 URL 来查看您的应用。\n\n某些应用还需要额外的几个命令来完成设置。**如果您不确定如何运行特定的示例应用程序，请查看该项目目录下的\
  \ `README.md` 文件**。每个示例项目都包含一个 `README.md`，它将提供您运行每个应用所需的指令。\n\n### 项目设置\n\n前两个项目从简单的\
  \ React 设置开始，这允许我们快速编写 React 应用程序。\n\n从那里开始，除少数例外外，书中的每个项目都是使用 [Create React App](https://github.com/facebookincubator/create-react-app)\
  \ 构建的。\n\nCreate React App 基于 Webpack，Webpack 是一个帮助处理和打包我们的各种 JavaScript、CSS、HTML\
  \ 和图像文件的工具。我们在“在 Create React App 中使用 Webpack”章节中深入探讨 Create React App。但是，**使用 React\
  \ 并不是必须使用 Create React App**。它只是 Webpack（以及其他工具）的一个封装，使得入门变得非常简单。\n\n### 代码块与上下文\n\
  \n书中的几乎每个代码块都摘自于**可运行的代码示例**，您可以在示例代码中找到它们。例如，这里有一个摘自第一章的代码块：\n\n```javascript\n\
  class ProductList extends React.Component {\n  render() {\n    return (\n      <div\
  \ className='ui unstackable items'>\n        <Product />\n      </div>\n    );\n\
  \  }\n}\n```\n\n`voting_app/public/js/app-2.js`\n\n请注意，该代码块的头部指出了包含此代码的文件路径：`voting_app/public/js/app-2.js`。\n\
  \n如果您觉得缺少某个代码示例的上下文，请使用您喜欢的文本编辑器打开完整的代码文件。**本书编写的预期是，您会在阅读手稿的同时也查看示例代码。**\n\n例如，我们经常需要\
  \ `import` 库来让代码运行。在书的早期章节中，我们展示了这些 `import` 语句，否则无法清楚这些库来自哪里。然而，书的后期章节更加高级，它们侧重于核心概念，而不是重复书中之前涵盖过的样板代码。**如果在任何时候您不清楚上下文，请打开磁盘上的代码示例。**\n\
  \n### 代码块编号\n\n在本书中，我们有时会分步骤构建一个较大的示例。如果您看到加载的文件带有数字后缀，这通常意味着我们正在构建一个更庞大的东西。\n\n\
  例如，代码块上方的文件名是：`app-2.js`。当您看到 `-N.js` 语法时，意味着我们正在构建该文件的最终版本。您可以跳转到该文件，查看在特定特定阶段所有代码的状态。\n\
  \n### 寻求帮助\n\n虽然我们已尽力做到清晰、精确和准确，但您可能会发现在编写代码时会遇到问题。\n\n通常情况下，问题有三类：\n\n*   书中的“错误”（例如，我们对某事的描述是错误的）\n\
  *   我们代码中的“错误”\n*   您的代码中的“错误”\n\n如果您发现我们对某事的描述不准确之处，或者您觉得某个概念不清楚，请在 Discord 上询问我们！我们希望确保本书既准确又清晰。\n\
  \n如果您怀疑示例代码存在问题，请确保您的书籍代码包版本是最新的。我们定期发布代码更新。\n\n如果您使用的是最新的下载代码，并认为在我们的代码中发现了错误，我们绝对非常想听到您的反馈。\n\
  \n如果您在让自己的应用运行方面遇到困难（且不是我们的示例代码），那么这种情况对我们来说处理起来比较困难。\n\n在使用自己的自定义应用寻求帮助时，您的第一道防线应该是我们的[官方社区\
  \ Discord 聊天室](https://newline.co/discord/react)。我们（作者）偶尔会在那里，但那里有数百名其他读者，他们可能比我们更快为您提供帮助。\n\
  \n如果您仍然遇到困扰，我们仍然很想听您的反馈，这里有一些获得清晰、及时回复的小建议。\n\n给 给我们发邮件\n\n如果您通过邮件向我们寻求技术帮助，我们希望了解以下信息：\n\
  \n*   您指的是书籍的哪个修订版本？\n*   您使用的是什么种操作系统？（例如，Mac OS X 10.8，Windows 95）\n*   您在哪一章的哪个示例项目？\n\
  *   您正尝试实现什么？\n*   [您已经尝试过什么](http://mattgemmell.com/what-you-tried/)？\n*   您预期的输出是什么？\n\
  *   实际发生了什么？\n\n\n\n\nNode 包管理器（简称为 `npm`）作为 Node.js 的一部分进行安装。要检查开发环境中是否已安装 `npm`，我们可以打开终端窗口并输入：\n\
  \n```\n1 $ npm -v\n```\n\n如果没有打印出版本号且你收到了错误提示，请确保你已经下载了包含 `npm` 的 Node.js 安装程序。\n\
  \n## 安装 Git\n\n本章中的应用程序需要通过 Git 来安装一些第三方库。\n\n如果你还没有安装 Git，请参考[这些说明](https://git-scm.com/book/en/v2/Getting-Started-Installing-Git)\
  \ 为你的平台安装 Git。\n\n安装 Git 之后，我们建议你重启电脑。\n\n## 浏览器\n\n最后，我们强烈建议使用 [Google Chrome 浏览器](https://www.google.com/chrome/)\
  \ 来开发 React 应用。在本书中我们将全程使用 Chrome 开发者工具。为了跟上我们的开发和调试，建议你现在就下载。\n\n## Windows 用户的特殊说明\n\
  \n书中的所有代码都已经在 Windows 10 的 `PowerShell` 上经过了测试。\n\n### 确保已安装 IIS\n\n如果你使用的是 Windows\
  \ 机器且尚未在其上进行任何 Web 开发，你可能需要安装 `IIS`（互联网信息服务）以便在本地运行 Web 服务器。\n\n安装 IIS 请参考[此教程](http://www.howtogeek.com/112455/how-to-install-iis-8-on-windows-8/)。\n\
  \n### JavaScript ES6/ES7\n\nJavaScript 是 Web 的语言。它运行在许多不同的浏览器上，如 Google Chrome、Firefox、Safari、Microsoft\
  \ Edge 和 Internet Explorer。不同的浏览器拥有不同的 JavaScript 解释器来执行 JavaScript 代码。\n\n由于 JavaScript\
  \ 作为互联网客户端脚本语言被广泛采用，导致了一个管理其规范的标准体的形成。该规范被称为 `ECMAScript` 或 `ES`。\n\n规范的第 5 版被称为\
  \ `ES5`。你可以将 `ES5` 视为 JavaScript 编程语言的一个“版本”。`ES5` 于 2009 年定型，并在几年内被所有主流浏览器采纳。\n\
  \nJavaScript 的第 6 版被称为 `ES6`。它于 2015 年定型，截至 2017 年，主流浏览器的最新版本仍在完成对 `ES6` 的支持。`ES6`是一次重大的更新。它包含了\
  \ JavaScript 的全系列新功能，总共近二十个。用 `ES6` 编写的 JavaScript 与用 `ES5` 编写的有明显不同。\n\n`ES7` 是一个基于\
  \ `ES6` 的规模得小的更新，于 2016 年 6 月通过。`ES7` 包含两个新功能。\n\n作为 JavaScript 的未来，我们希望今天就用 `ES6/ES7`\
  \ 编写代码。但我们也希望 JavaScript 能够运行在旧版浏览器上，直到它们逐渐退出市场。我们将在本章的晚些部分看到如何在今天享受 `ES6/ES7` 好处的同时，仍然支持世界上绝大多数浏览器。\n\
  \n本书是用 JavaScript `ES7` 编写的。由于 `ES6` 批准了这些新功能中的大部分，我们通常将这些新特性称为 `ES6` 特。\n\n我们包含了一个关于我们用到的\
  \ `ES6` 语法的附录，“附录 B：ES6”。在第一次遇到 `ES6` 语法时，我们经常会参考该附录，但如果某个语法看起来看起来很陌生，值得检查附录 B 看看它是否是新的\
  \ `ES6` JavaScript 语法。\n\n### 开始\n\n### 示例代码\n\n你在每章中找到的所有代码示例都包含在随书的代码包中。在代码包中，你会找到每个应用程序的完整版本，以及我们将用来一起构建这些应用程序的模板代码。每一章都提供了关于如何自己跟随练习的详细说明。\n\
  \n虽然没有必要跟着书一起写代码，但我们强烈建议这样做。尝试各种示例和样例代码将有助于巩固和加强概念。\n\n### 预览应用程序\n\n我们将构建一个基础的\
  \ React 应用，这允许我们在深入学习后续章节之前，从高层次接触 React 最重要的概念。让我们先看一眼该应用程序的运行实现。\n\n打开随书附的示例代码文件夹。在终端中切换到\
  \ `voting_app/` 目录：\n\n```\n$ cd voting_app/\n```\n\n首先，我们需要使用 `npm` 安装所有的依赖项：\n\
  \n```\n$ npm install\n```\n\n安装好依赖后，我们可以使用 `npm start` 命令启动服务器：\n\n```\n$ npm start\n\
  ```\n\n启动过程将在控制台打印一些文本：\n\n![启动过程输出](img/1-first_app----npm-start-output.png)\n\n\
  启动过程输出\n\n此外，你的浏览器可能会自动启动并打开应用。如果没有打开，你可以通过 URL `http://localhost:3000` 查看运行中的应用程序：\n\
  \n![应用程序的完整版本](img/1-first_app----voting-app-complete.png)\n\n应用程序的完整版本\n\n这个演示应用是一个类似于\
  \ [Product Hunt](http://producthunt.com) 或 [Reddit](http://reddit.com) 的网站。这些网站有用户可以投票的链接列表。就像那些网站一样，在我们的应用中我们可以对产品点赞。所有产品都会根据票数即时排序。\n\
  \n### 准备应用程序\n\n在终端中运行 `ls` 查看项目的布局：\n\n```\n$ ls\nREADME.md\nnode_modules/\npackage.json\n\
  public/\n```\n\n`package.json` 指定了依赖。当我们运行 `npm install` 时，它们被安装到了 `node_modules/`\
  \ 文件夹。\n\n这里的布局是 `public/`。让我们看看内部：\n\n```\n$ ls\nindex.html\nsemantic.css\n```\n\
  \n`index.html` 是应用程序的核心。它为浏览器提供服务。正如我们很快就会看到的，`index.html` 是 Web 应用的通用的。接下来看 `public/`：\n\
  \n```\n$ ls public\napp-1.js\napp-2.js\napp-3.js\napp-4.js\napp-5.js\napp-6.js\n\
  app-7.js\napp-8.js\napp-9.js\napp-complete.js\napp.js\nseed.js\n```\n\n`public/js`\
  \ 是我们放置 JavaScript 的地方。我们将在 `app.js` 中编写 React 应用。`app-complete.js` 是我们构建的应用程序版本。\n\
  \n此外，我们在构建过程中包含了 `app.js` 的每一个版本。本章中的每个代码块将引用你可以找到的版本。\n\n为了开始，我们将确保 `app-complete.js`\
  \ 不再加载到 `index.html`。这样我们在 `app.js` 中就有了一个空白画布开始工作。\n\n在你的文本编辑器中打开 `public/index.html`。它应该是这样的：\n\
  \n```html\n<!DOCTYPE html>\n<<html>\n\n  <head>\n    <meta charset=\"utf-8\">\n\
  \    <title>Project One</title>\n    <link rel=\"stylesheet\" href=\"./semantic-dist/semantic.css\"\
  \ />\n    <link rel=\"stylesheet\" href=\"./style.css\" />\n    <script src=\"vendor/babel-standalone.js\"\
  ></script>\n    <script src=\"vendor/react.js\"></script>\n    <script src=\"vendor/react-dom.js\"\
  ></script>\n  </head>\n\n  <body>\n    <div class=\"main ui text container\">\n\
  \      <h1 class=\"ui dividing centered header\">Popular Products</h1>\n      <div\
  \ id=\"content\"></div>\n    </div>\n    <script src=\"./js/seed.js\"></script>\n\
  \    <script src=\"./js/app.js\"></script>\n    <!-- 为了开始，删除下方的脚本标签 -->\n    <script\n\
  \      type=\"text/babel\"\n      data-plugins=\"transform-class-properties\"\n\
  \      src=\"./js/app-complete.js\"\n    ></script>\n  </body>\n\n</html>\n```\n\
  \nvoting_app/public/index.html\n\n\n\n\n```html\n<div class=\"main ui text container\"\
  >\n  <h1 class=\"ui dividing centered header\">Popular Products</h1>\n  <div id=\"\
  content\"></div>\n</div>\n```\n\n`voting_app/public/index.html`\n\n这里的 `class` 属性仅用于样式，可以安全地忽略。去掉这些属性后，我们的核心标记变得非常简洁：\n\
  \n```html\n<div>\n  <h1>Popular Products</h1>\n  <div id=\"content\"></div>\n</div>\n\
  ```\n\n我们有一个页面标题（`h1`）和一个 `id` 为 `content` 的 `div`。这个 `div` 将是我们最终挂载 React 应用的地方。稍后我们就会看到这意味着什么。\n\
  \n接下来的几行代码告诉浏览器需要加载哪些 JavaScript 文件。为了开始构建我们自己的应用程序，让我们完全删除 `./app-complete.js`\
  \ 脚本标签（script tag）：\n\n```html\n<script src=\"./js/seed.js\"></script>\n<script\
  \ src=\"./js/app.js\"></script>\n<!-- 删除下方的 script 标签以开始构建。 -->\n<script\n  type=\"\
  text/babel\"\n  data-plugins=\"transform-class-properties\"\n  src=\"./js/app-complete.js\"\
  \n></script>\n```\n\n在我们保存更新后的 `index.html` 并重新加载浏览器后，我们会发现我们的应用消失了。\n\n### 什么是组件（component）？\n\
  \n构建 React 应用的核心在于组件。一个单独的 React 组件可以被视为应用中的一个 UI 组件。我们可以将应用的界面拆分为两类组件：\n\n![应用的组件](img/1-first_app----voting-components-highlighted.png)\n\
  \n应用的组件\n\n我们有一个由一个父组件和许多子组件组成的层级结构。我们分别把它们命名为 `ProductList` 和 `Product`：\n\n1.\
  \ `ProductList`：包含一个产品组件列表\n2. `Product`：显示特定的产品\n\nReact 组件不仅能清晰地映射到 UI 组件，而且它们是自包含的。标记语言（markup）、视图逻辑以及通常是组件特定的样式都集中在一个地方。这一特性使得\
  \ React 组件具有可复用性。\n\n此外，正如我们将在本章及整本书中看到的，React 对于组件数据流和交互的范式有严格的定义。在 React 中，当组件的输入发生变化时，框架会简单地重新渲染该组件。这为我们提供了稳健的\
  \ UI 一致性保证：\n\n给定一组特定的输入，输出（组件在页面上的样子）将始终保持一致。\n\n#### 我们的第一个组件\n\n让我们从构建 `ProductList`\
  \ 组件开始。我们将在本章剩余部分中的所有 React 代码写在 `public/js/app.js` 文件中。打开 `app.js` 并插入组件：\n\n```javascript\n\
  class ProductList extends React.Component {\n  render() {\n    return (\n      <div\
  \ className='ui unstackable items'>\n        Hello, friend! I am a basic React component.\n\
  \      </div>\n    );\n  }\n}\n```\n\n`voting_app/public/js/app-1.js`\n\nReact 组件是自自\
  \ `React.Component` 的 ES6 类。我们正在引用 `React` 变量。`index.html` 为我们加载了 React 库，因此我们在这里可以引用它：\n\
  \n```html\n<script src=\"vendor/react.js\"></script>\n```\n\n`voting_app/public/index.html`\n\
  \n我们的 `ProductList` 类有一个方法 `render()`。`render()` 是 React 组件唯一要求的方法。React 使用该方法的返回值来决定在页面上渲染什么。\n\
  \n如果你对 JavaScript 有些了解，这个返回值可能会让你感到惊讶：\n\n```javascript\n return (\n      <div className='ui\
  \ unstackable items'>\n        Hello, friend! I am a basic React component.\n  \
  \    </div>\n    );\n```\n\n`voting_app/public/js/app-1.js`\n\n返回值的语法看起来不像传统的 JavaScript。我们正在使用\
  \ JSX（JavaScript 扩展语法），这是由 Facebook 编写的一种 JavaScript 语法扩展。使用 JSX 允许我们用一种熟悉的、类 HTML\
  \ 的语法编写组件视图的标记语言。最终，这些 JSX 代码会被编译为原生 JavaScript。虽然使用 JSX 并非必须，但我们将在本书中使用它，因为它与 React\
  \ 完美结合。\n\n#### JSX\n\nReact 组件最终渲染成显示在浏览器中的 HTML。因此，组件的 `render()` 方法需要描述视图应该如何表示为\
  \ HTML。React 使用文档对象模型（DOM）的虚拟表示来构建我们的应用。React 将其称为虚拟 DOM（virtual DOM）。在暂不深入细节的情况下，React\
  \ 允许我们在 JavaScript 中描述组件的 HTML 表示形式。\n\nJSX 的创建是为了让这种 JavaScript 形式的 HTML 表示更像 HTML。为了理解\
  \ HTML 和 JSX 之间的区别，请考虑以下 JavaScript 语法：\n\n```javascript\nReact.createElement('div',\
  \ {className: 'ui items'},\n  'Hello, friend! I am a basic React component.'\n)\n\
  ```\n\n它可以在 JSX 中表示为：\n\n```jsx\n<div className='ui items'>\n  Hello, friend! I\
  \ am a basic React component.\n</div>\n```\n\n后者的例子代码可读性略有提高。在嵌套的树结构中，这种优势更加明显：\n\
  \n```javascript\nReact.createElement('div', {className: 'ui items'},\n  React.createElement('p',\
  \ null, 'Hello, friend! I am a basic React com\\\nponent.')\n)\n```\n\n在 JSX 中：\n\
  \n```jsx\n<div className='ui items'>\n  <p>Hello, friend! I am a basic React component.</p>\n\
  </div>\n```\n\n#### 开发者控制台\n\n每个主流浏览器都带有一个帮助开发者工具 JavaScript，工具箱的核心部分是控制台（console）。把控制台视为\
  \ JavaScript 与开发者通信的主要方式。如果 JavaScript 执行过程中遇到任何错误，它会在控制台中通知你。\n\n打开控制台，我们得到了一个模糊的线索：\n\
  \n```\nUncaught SyntaxError: Unexpected token <\n```\n\n![控制台错误](img/1-first_app----error-in-console.png)\n\
  \n控制台错误\n\n这个 `SyntaxError` 阻止了我们的代码运行。当 JavaScript 引擎在解析时遇到不符合语言语法的标记或标记顺序时，就会抛出这种类型的错误。这意味着代码书写错误。\n\
  \n问题在哪里？我们的浏览器解析器在遇到 JSX 时卡住了。解析器不懂 JSX。对于它来说，这个 `<` 是错误的。\n\n正如我们讨论的，JSX 是标准 JavaScript\
  \ 的扩展。让我们让浏览器的 JavaScript 解释器使用这种扩展。\n\n#### Babel\n\n我们在章节开头提到书中所有的代码将使用 ES6 JavaScript。然而，目前大多数浏览器并没有完全支持\
  \ ES6。\n\nBabel 是一个 JavaScript 转译器（transpiler）。Babel 将 ES6 代码转换为 ES5 代码。我们将此过程称为编译（transpiling）。这样我们就可以享受\
  \ ES6 的功能，同时确保代码可以在只支持 ES5 的浏览器中运行。\n\nBabel 的另一个方便的特性是它理解 JSX。Babel 将我们的 JSX 编译为浏览器可以解释和执行的\
  \ ES5。我们只需要指示浏览器使用 Babel 来编译和运行我们的 JavaScript 代码。\n\n示例代码的 `index.html` 已经在 `head`\
  \ 标签中导入了 Babel：\n\n```html\n<head>\n  <!-- ... -->\n  <script src=\"vendor/babel-standalone.js\"\
  ></script>\n  <!-- ... -->\n</head>\n```\n\n我们只需要告诉 JavaScript 运行时，我们的代码应该由 Babel\
  \ 编译。我们可以通过在 `index.html` 中导入脚本时将 `type` 属性设置为 `text/babel` 来实现这一点。\n\n\n\n\n\n\
  ```html\n<script src=\"./js/seed.js\"></script>\n<script\n  type=\"text/babel\"\n\
  \  data-plugins=\"transform-class-properties\"\n  src=\"./js/app.js\"\n></script>\n\
  ```\n\n`type=\"text/babel\"` 属性告诉 Babel 我们希望它来处理此脚本的加载。`data-plugins` 属性指定了我们在书中使用的特殊\
  \ Babel 插件。我们将在章节末尾讨论这个插件。\n\n保存 `index.html` 并重新加载页面。\n\n![](img/1-first_app----voting-app-chrome-warnings.png)\n\
  \n仍然没有任何。然而，控制台不再显示错误了。根据你使用的 `Chrome` 版本，可能会看到一些警告（以黄色显示，而不是红色）。这些警告是可以忽略的。\n\n\
  Babel 成功地将我们的 JSX 编译为 JavaScript，我们的浏览器能够无问题地运行该 JavaScript。\n\n那么发生了什么呢？我们定义了组件，**但还没有告诉\
  \ React 对它做任何操作**。我们需要告诉 React 框架，我们的组件应该插入到此页面中。\n\n### `ReactDOM.render()`\n\n\
  我们需要指示 React 在特定的 DOM 节点内渲染此 `ProductList`。\n\n在 `app.js` 中的组件下方添加以下代码：\n\n```javascript\n\
  class ProductList extends React.Component {\n  render() {\n    return (\n      <div\
  \ className='ui unstackable items'>\n        Hello, friend! I am a basic React component.\n\
  \      </div>\n    );\n  }\n}\n\nReactDOM.render(\n  <ProductList />,\n  document.getElementById('content')\n\
  );\n```\n\n`voting_app/public/js/app-1.js`\n\n`ReactDOM` 来自 `react-dom` 库，我们也将其包含在\
  \ `index.html` 中。我们向 `ReactDOM.render()` 方法传递了两个参数。第一个参数是*想要渲染的内容*。第二个参数是渲染的*位置*：\n\
  \n```javascript\nReactDOM.render([what], [where]);\n```\n\n在这里，对于“内容”，我们传递了 JSX\
  \ 格式的 React 组件 `ProductList` 的引用。对于“位置”，你可能记得 `index.html` 包含一个 `id` 为 `content`\
  \ 的 `div` 标签：\n\n```html\n<div id=\"content\"></div>\n```\n\n`voting_app/public/index.html`\n\
  \n我们将该 DOM 节点的引用作为第二个参数传递给 `ReactDOM.render()`。\n\n此时，有趣的是，我们在不同类型的 React 元素声明之间使用了不同的大小写。我们有\
  \ HTML DOM 元素如 `<div>` 和一个名为 `<ProductList />` 的 React 组件。在 React 中，原生 HTML 元素*始终*以小字母开头，而\
  \ React 组件名称*始终*以大字母开头。\n\n现在 `ReactDOM.render()` 位于 `app.js` 的末尾，保存文件并在浏览器中刷新页面：\n\
  \n![我们的组件已渲染到页面](img/1-first_app----hello-friend.png)\n\n我们的组件已渲染到页面\n\n总结一下，我们使用\
  \ ES6 类和 JSX 编写了一个 React 组件。我们指定了让 Babel 将此代码转换成 ES5。然后我们使用 `ReactDOM.render()`\
  \ 将此组件写入 DOM。\n\n虽然这是一项成就，但我们目前的 `ProductList` 组件相当无趣。我们最终希望 `ProductList` 渲染一个产品列表。\n\
  \n每个产品都将是它自己的 UI 元素，一个 HTML 片段。我们可以将这些元素中的每一个表示为它们自己的组件 `Product`。React 组件范式的核心是，React\
  \ 组件可以渲染其他 React 组件。我们将让 `ProductList` 渲染 `Product` 组件，每个想要在页面上显示的产品对应一个。这些 `Product`\
  \ 组件中的每一个将是 `ProductList` 的**子组件**，而 `ProductList` 是**父组件**。\n\n### 构建 `Product`\n\
  \n让我们构建子组件 `Product`，它将包含一个产品列表。就像 `ProductList` 组件一样，我们将声明一个继承自 `React.Component`\
  \ 的新 ES6 类。我们将定义一个单方法 `render()`：\n\n```javascript\nclass Product extends React.Component\
  \ {\n  render() {\n    return (\n      <div>\n        {/* ... todo ... */}\n   \
  \   </div>\n    );\n  }\n}\n\nReactDOM.render(\n  // ...\n);\n```\n\n对于每个产品，我们将添加一张图片、一个标题、一个描述和帖作者的头像。标记如下：\n\
  \n```javascript\nclass Product extends React.Component {\n  render() {\n    return\
  \ (\n      <div className='item'>\n        <div className='image'>\n          <img\
  \ src='images/products/image-aqua.png' />\n        </div>\n        <div className='middle\
  \ aligned content'>\n          <div className='description'>\n            <a>Fort\
  \ Knight</a>\n            <p>Authentic renaissance actors, delivered in just two\
  \ weeks.</p>\n          </div>\n          <div className='extra'>\n            <span>Submitted\
  \ by:</span>\n            <img\n              className='ui avatar image'\n    \
  \          src='images/avatars/daniel.jpg'\n            />\n          </div>\n \
  \       </div>\n      </div>\n    );\n  }\n}\n\nReactDOM.render(\n```\n\n`voting_app/public/js/app-2.js`\n\
  \n再次，我们在此处的代码中使用了一些 SemanticUI 样式。正如我们之前讨论过的，这段 JSX 代码将被转换为普通的 JavaScript。\n\n####\
  \ 使用 props\n\n我们想要修改 `Product` 组件，使其不再使用静态的、硬编码的属性。相反，我们希望它能够接受从父组件 `ProductList`\
  \ 传递的数据。以这种方式设置组件结构可以使我们的 `ProductList` 组件能够动态渲染任意数量的 `Product` 组件，每个组件都有自己独特的属性。\n\
  \n\n\n\n\nReact 中数据从父组件到子组件流动是通过 `props` 实现的。当父组件渲染子组件时，它可以传递子组件依赖的 props。\n\n让我们来看实际操作。首先，我们修改\
  \ `ProductList` 以将 props 传递给 `Product`。`seed.js` 将让我们无需手动创建大量数据。让我们从 `Seed.products`\
  \ 数组中提取第一个对象，并将其作为单个产品的数据：\n\n```\nclass ProductList extends React.Component {\n\
  \  render() {\n    const product = Seed.products[0];\n    return (\n      <div className='ui\
  \ unstackable items'>\n        <Product\n          id={product.id}\n          title={product.title}\n\
  \          description={product.description}\n          url={product.url}\n    \
  \      votes={product.votes}\n          submitterAvatarUrl={product.submitterAvatarUrl}\n\
  \          productImageUrl={product.productImageUrl}\n        />\n      </div>\n\
  \    );\n  }\n}\n```\n\n`voting_app/public/js/app-3.js`\n\n在这里，`product` 变量被设置为描述我们第一个产品的\
  \ JavaScript 对象。我们使用 `[propName]=[propValue]` 语法将产品的属性逐个传递给 `Product` 组件。在 JSX 中分配属性的语法与\
  \ HTML 和 XML 完全相同。\n\n这里有两个有趣的地方。第一个是每个属性值周围的大括号（`{}`）：\n\n```\n id={product.id}\n\
  ```\n\n`voting_app/public/js/app-3.js`\n\n在 JSX 中，大括号是一个分隔符，告诉 JSX 大括号之间是一个 JavaScript\
  \ 表达式。另一个分隔符是使用引号表示字符串，如下：\n\n```\nid='1'\n```\n\n现在 `ProductList` 组件正在将 props 传递给\
  \ `Product`。我们的 `Product` 组件还没有使用它们，所以让我们修改组件来使用这些 props。\n\n在 React 中，组件可以通过对象\
  \ `this.props` 对象访问其所有的 props。在 `Product` 内部，`this.props` 对象看起来如下：\n\n```\n{\n \
  \ \"id\": 1,\n  \"title\": \"Yellow Pail\",\n  \"description\": \"On-demand sand\
  \ castle construction expertise.\",\n  \"url\": \"#\",\n  \"votes\": 41,\n  \"submitterAvatarURL\"\
  : \"images/avatars/daniel.jpg\",\n  \"productImageUrl\": \"images/products/image-aqua.png\"\
  \n}\n```\n\n让我们把所有硬编码数据的地方都替换为 props。顺便，我们还会多添加一些标记，比如描述和点赞图标：\n\n```\nclass Product\
  \ extends React.Component {\n  render() {\n    return (\n      <div className='item'>\n\
  \        <div className='image'>\n          <img src={this.props.productImageUrl}\
  \ />\n        </div>\n        <div className='middle aligned content'>\n       \
  \   <div className='header'>\n            <a>\n              <i className='large\
  \ caret up icon' />\n            </a>\n            {this.props.votes}\n        \
  \  </div>\n          <div className='description'>\n            <a href={this.props.url}>\n\
  \              {this.props.title}\n            </a>\n            <p>\n         \
  \     {this.props.description}\n            </p>\n          </div>\n          <div\
  \ className='extra'>\n            <span>Submitted by:</span>\n            <img\n\
  \              className='ui avatar image'\n              src={this.props.submitterAvatarUrl}\n\
  \            />\n          </div>\n        </div>\n      </div>\n    );\n  }\n}\n\
  ```\n\n`voting_app/public/js/app-3.js`\n\n再次，在我们的 JSX 内部任何插值变量的地方，我们用大括号（`{}`）来分隔变量。注意，我们既像这样作为标签内部文本内容插入数据：\n\
  \n```\n <div className='header'>\n            <a>\n              <i className='large\
  \ caret up icon' />\n            </a>\n            {this.props.votes}\n        \
  \  </div>\n```\n\n`voting_app/public/js/app-3.js`\n\n也用于 HTML 元素的属性上：\n\n```\n <img\
  \ src={this.props.productImageUrl} />\n```\n\n`voting_app/public/js/app-3.js`\n\n\
  通过这种方式将 props 与 HTML 元素交织，我们创建了动态的、数据驱动的 React 组件。\n\n保存更新后的 `app.js` 文件后，再次刷新浏览器：\n\
  \n![](img/1-first_app----version-3.png)\n\n`ProductList` 组件现在显示了一个列出的单个产品，即从 `Seed`\
  \ 中提取的第一个对象。\n\n我们正进入一些有趣的阶段。我们的 `Product` 组件现在是数据驱动的。根据它收到的 props，它可以渲染我们想要的任何产品。\n\
  \n我们的代码已经准备就绪让 `ProductList` 渲染任意数量的产品。我们只需要配置组件来渲染若干个 `Product` 组件，每个组件代表我们想要在页面上展示的一个产品。\n\
  \n### 渲染多个产品\n\n为了渲染多个产品，首先让 `ProductList` 生成一个 `Product` 组件数组。每个组件都将源自 `Seed` 数组中的单个对象。我们将使用\
  \ `map 来来实现：\n\n```\nclass ProductList extends React.Component {\n  render() {\n\
  \    const product = Seed.products[0];\n    return (\n      <div className='ui unstackable\
  \ items'>\n        <Product\n          id={product.id}\n          title={product.title}\n\
  \          description={product.description}\n          url={product.url}\n    \
  \      votes={product.votes}\n          submitterAvatarUrl={product.submitterAvatarUrl}\n\
  \          productImageUrl={product.productImageUrl}\n        />\n      </div>\n\
  \    );\n  }\n}\n```\n\n`voting_app/public/js/app-4.js`\n\n传递给 `map` 的函数返回一个 `Product`\
  \ 组件。这个 `Product` 像以前一样通过来自 `Seed` 的 props 创建。值得，`productComponents` 变量最终变成 `Product`\
  \ 组件数组：\n\n```\n// 我们的 `productComponents` 数组\n[\n  <Product id={1} />,\n  <Product\
  \ id={2} />,\n  <Product id={3} />,\n  <Product id={4} />\n]\n```\n\n起初看起来一个 JavaScript\
  \ 元素数组很奇怪，但请记住 Babel 会将每个 `Product` 的 JSX 表示编译为普通的 JavaScript：\n\n```\n// `productComponents`\
  \ 在 JavaScript 中看起来像\n[\n  React.createElement(Product, { id: 1 }),\n  React.createElement(Product,\
  \ { id: 2 }),\n  React.createElement(Product, { id: 3 }),\n  React.createElement(Product,\
  \ { id: 4 })\n]\n```\n\n现在，在声明 `productComponents` 之后，我们需要修改 `render` 的返回值。之前我们渲染的是单个\
  \ `Product` 组件。现在我们可以渲染数组 `productComponents`：\n\n```\n return (\n      <div className='ui\
  \ unstackable items'>\n        {productComponents}\n      </div>\n    );\n```\n\n\
  `voting_app/public/js/app-4.js`\n\n刷新页面，我们将看到列出了 `Seed` 中的所有四个产品：\n\n![](img/1-first_app----version-4.png)\n\
  \n我们现在共有五个 React 组件在工作。我们有一个单个父组件 `ProductList`。`ProductList` 包含四个子组件 `Product`，对应\
  \ `seed.js` 中 `Seed.products` 数组中的每个产品对象。\n\n目前，我们的产品还没有根据投票数排序。让我们对其进行排序。我们将使用\
  \ `Array 的 sort 方法 来来实现。我们在构建 `productComponents` 数组之前的行之前对产品进行排序：\n\n```\nclass\
  \ ProductList extends React.Component {\n  render() {\n    const products = Seed.products.sort((a,\
  \ b) => (\n      b.votes - a.votes\n    ));\n    const productComponents = products.map((product)\
  \ => (\n      <Product\n```\n\n`voting_app/public/js/app-5.js`\n\n\n\n\n\n虽然我们在\
  \ 浏览器中运行了一个数据驱动的 React 应用，但此页面仍然缺乏交互性。尽管到目前为止，`React` 已为我们提供了一种简单且整洁的方式来组织 HTML，并使我们能够根据灵活、动态的\
  \ JavaScript 对象驱动 HTML 的生成，但我们尚未挖掘它的真正力量：创建动态界面。\n\n本书的其余部分将深入探讨这种力量。让我们从一个简单的功能开始：对给定的产品进行点赞的能力。\n\
  \n## React 投票（应用程序的首次交互）\n\n当点击每个 `Product` 组件上的点赞按钮时，我们期望它能更新该 `Product` 的 `votes`\
  \ 属性，将其增加 1。\n\n但 `Product` 组件无法修改它的 `votes`。`this.props` 是不可变的。\n\n虽然子组件可以读取它的\
  \ props，但不能修改它们。子组件并不拥有它的 props。在我们的应用程序中，父组件 `ProductList` 拥有传递给 `Product` 的 props。React\
  \ 倾向于单向数据流的概念。这意味着数据变化来自应用的“顶部”，并通过其各个组件“向下”传播。\n\n我们需要一种方法让 `Product` 组件让 `ProductList`\
  \ 知道点击了点赞图标。然后我们可以让作为产品数据所有者的 `ProductList` 更新该产品的投票计数。更新后的数据将从 `ProductList` 组件向下流到\
  \ `Product` 组件。\n\n### 传递事件\n\n我们知道父组件通过 props 向子组件传递数据。由于 props 是不可变的，因此子组件需要某种方式来向父组件通信事件。然后父组件就可以进行任何必要的数据更改。\n\
  \n我们也可以将函数作为 props 传递。我们可以让 `ProductList` 组件为每个 `Product` 组件提供一个函数，在点击点赞按钮时调用它。通过\
  \ props 传递的函数是子组件与其父组件通信事件的标准方式。\n\n让我们在实践中看看。我们将首先让点赞操作在控制台打印一条消息。稍后，我们将让点赞操作增加目标产品的\
  \ `votes` 属性。\n\n`ProductList` 中的函数 `handleProductUpVote` 将接受单个参数 `productId`。该函数会将产品的\
  \ `id` 打印到控制台：\n\n```\nclass ProductList extends React.Component {\n  handleProductUpVote(productId)\
  \ {\n    console.log(productId + ' was upvoted.');\n  }\n\n  render() {\n```\n\n\
  voting_app/public/js/app-6.js\n\n接下来，我们将此函数作为 prop 传递给每个 `Product` 组件。我们将该 prop\
  \ 命名为 `onVote`：\n\n```\n const productComponents = products.map((product) => (\n\
  \      <Product\n        key={'product-' + product.id}\n        id={product.id}\n\
  \        title={product.title}\n        description={product.description}\n    \
  \    url={product.url}\n        votes={product.votes}\n        submitterAvatarUrl={product.submitterAvatarUrl}\n\
  \        productImageUrl={product.productImageUrl}\n        onVote={this.handleProductUpVote}\n\
  \      />\n    ));\n```\n\nvoting_app/public/js/app-6.js\n\n我们现在可以在 `Product` 内部通过\
  \ `this.props.onVote` 访问此函数。\n\n在 `Product` 内部写一个调用这个新 prop 函数的函数。我们将该函数命名为 `handleUpVote()`：\n\
  \n```\n // Inside `Product`\n  handleUpVote() {\n    this.props.onVote(this.props.id);\n\
  \  }\n\n  render() {\n```\n\nvoting_app/public/js/app-6.js\n\n我们用产品的 `id` 调用 prop\
  \ 函数 `this.props.onVote`。现在，我们只需要在用户每次点击箭头图标时调用此函数。\n\n在 React 中，我们可以使用特殊属性 `onClick`\
  \ 来处理鼠标点击事件。\n\n我们将在点赞按钮的 `a` HTML 标签上设置 `onClick` 属性。我们将指令它在每次被点击时调用 `handleUpVote()`：\n\
  \n```\n {/* Inside `render` for Product` ` */}\n        <div className='middle aligned\
  \ content'>\n          <div className='header'>\n            <a onClick={this.handleUpVote}>\n\
  \              <i className='large caret up icon' />\n            </a>\n       \
  \     {this.props.votes}\n          </div\n```\n\nvoting_app/public/js/app-6.js\n\
  \n当用户点击点赞图标时，将触发一个函数调用链：\n\n1. 用户点击点赞图标。\n2. React 调用 `Product` 组件的 `handleUpVote`。\n\
  3. `handleUpVote` 调用它的 prop `onVote`。该函数位于父组件 `ProductList` 内部，并在控制台打印一条消息。\n\n\
  为了让这一切运行，我们还需要做最后一件事。在 `handleUpVote()` 函数内部，我们引用了 `this.props`：\n\n```\n handleUpVote()\
  \ {\n    this.props.onVote(this.props.id);\n  }\n```\n\nvoting_app/public/js/app-6.js\n\
  \n奇怪的地方在于：在 `render()` 中工作时，我们已经过 `this` 总是绑定到组件。但在我们的自定义组件方法 `handleUpVote()` 内部，`this`\
  \ 实际上是 `null`。\n\n### 绑定自定义组件方法\n\n\n\n\n但我们应该在哪里执行此更新呢？目前，我们的应用还没有可以存储和管理数据的地方。`Seed`\
  \ 应该被视为示例数据的种子，而不是我们应用的数据存储。\n\n我们的应用目前缺少的是**状态（state）**。\n\n### 使用状态\n\nprops 是不可变的且由组件的父组件拥有，而**状态（state）是由组件自己拥有的**。`this.state`\
  \ 对组件来说是私有的，正如我们将看到的，它可以通过 `this.setState()` 进行更新。\n\n至关重要的一点是，**当组件的 state 或 props\
  \ 更新时，该组件将重新渲染自己**。\n\n**每个 React 组件都是作为其“props”和“state”的函数渲染的。这种渲染是确定性的。** 这意味着给定一组\
  \ props 和一组 state，React 组件将始终以同一种方式进行渲染。正如我们在章节开头提到的，这种方法提供了一种强力的 UI 一致性保证。\n\n\
  由于我们正在修改产品的数据（投票数），**我们应该将这些数据视为是有有状态的**。`ProductList` 将成为该状态的所有者。它随后会将此状态作为 props\
  \ 传递给 `Product`。\n\n目前，`ProductList` 在 `render()` 方法中直接从 `Seed` 读取以获取产品。让我们这些数据移动到组件的状态中。\n\
  \n在向组件添加状态时，我们做的第一件事是定义**初始状态（initial state）**应该什么样。因为在初始化我们的组件时会调用 `constructor()`，所以它是定义初始状态的最佳位置。\n\
  \n在 React 组件中，state 是一个对象。`ProductList` 状态对象的形状如下：\n\n```\n// `ProductList` 状态对象的形状\n\
  {\n  products: <Array>,\n}\n```\n\n我们将状态初始化为一个包含空 `products` 数组的对象。在 `ProductList`\
  \ 中添加此 `constructor()`：\n\n```javascript\nclass ProductList extends React.Component\
  \ {\n  constructor(props) {\n    super(props);\n\n    this.state = {\n      products:\
  \ [],\n    };\n  }\n```\n\n`voting_app/public/js/app-7.js`\n\n就就像我们在 `Product` 中调用\
  \ `constructor()` 一样，`constructor()` 的第一行是 `super(props)` 调用。我们为 React 组件编写的任何 `constructor()`\
  \ 函数的第一行都将是这同一行。\n\n接下来，状态初始化后，让我们修改 `ProductList` 组件的 `render` 函数，使其使用状态而不是从 `Seed`\
  \ 读取。我们通过 `this.state` 读取状态：\n\n```javascript\n render() {\n    const products =\
  \ this.state.products.sort((a, b) => (\n      b.votes - a.votes\n    ));\n```\n\n\
  `voting_app/public/js/app-7.js`\n\n`ProductList` 现在由它自己的状态驱动。如果我们现在保存并刷新，我们所有的产品都将丢失。在\
  \ `ProductList` 中没有任何机制可以将产品添加到它的状态中。\n\n### 使用 `this.setState()` 设置状态\n\n正如我们在这里所做的，用“空”状态初始化组件是一个良好的习惯。我们在“组件与服务器”章节中与服务器进行异步操作时，会探讨这样做背后的原因。\n\
  \n然而，在组件初始化之后，我们希望用 `Seed` 中的数据来填充 `ProductList` 的状态。\n\nReact 指定了一组**生命周期方法（lifecycle\
  \ methods）**。在组件挂载到页面之后，React 会调用一个生命周期方法 `componentDidMount()`。我们在这个方法内部为 `ProductList`\
  \ 填充状态。\n\n知道这一点，我们可能会忍不住在 `componentDidMount()` 中像这样将状态设置为 `Seed.products`：\n\n\
  ```javascript\nclass ProductList extends React.Component {\n  // ...\n  // 这样写有效吗？\n\
  \  componentDidMount() {\n    this.state = Seed.products;\n  }\n  // ...\n}\n```\n\
  \n然而，这是无效的。我们唯一可以这种方式修改状态的时刻是在 `constructor()` 中。**对于初始状态之后的所有状态修改，React 为组件提供了\
  \ `this.setState()` 方法**。除其他作用外，该方法会触发 React 组件的重新渲染，这在状态改变后是关重要的。\n\n现在为 `ProductList`\
  \ 添加 `componentDidMount()`。我们将使用 `setState()` 来填充组件的状态：\n\n```javascript\nclass\
  \ ProductList extends React.Component {\n  constructor(props) {\n    super(props);\n\
  \n    this.state = {\n      products: [],\n    };\n  }\n\n  componentDidMount()\
  \ {\n    this.setState({ products: Seed.products });\n  }\n}\n```\n\n`voting_app/public/js/app-8.js`\n\
  \n组件将带有空状态 `this.state.products` 数组挂载。挂载后，我们用来自 `Seed` 的数据填充状态。组件将重新渲染，我们的产品将会显示。这发生的速度是用户无法察觉的。\n\
  \n如果我们现在保存并刷新，我们看到产品又回来了。\n\n### 更新状态与不可变性\n\n现在 `ProductList` 正在状态中管理产品，我们已经准备好响应用户输入对这些数据进行修改。具体来说，我们希望在用户对某个产品投票时，增加该产品的\
  \ `votes` 属性。\n\n我们刚刚讨论过，我们只能使用 `this.setState()` 进行状态修改。因此，虽然组件可以更新它的状态，但**我们应该将\
  \ `this.state` 对象视为不可变的（immutable）**。\n\n正如之前提到的，如果我们将一个数组或对象视为不可变的，我们就永远不会对其进行修改。例如（注：此处原文存在大量重复的无效文本，已根据指令跳过重复部分）\n\
  \n\n\n\n因此，当我们在 `forEach()` 内部通过增加投票计数来修改 `product` 对象时，*我们正在修改状态中的原始 product 对象*。\n\
  \n相反，我们应该创建一个*新的*产品数组。如果我们修改了其中一个产品对象，我们应该修改该对象的*克隆*，而不是原始对象。\n\n让我们来看看将状态视为不可变的\
  \ `handleProductUpVote()` 实现是长样的。我们将先看完整代码，然后对其进行拆解：\n\n```javascript\n // 在 `ProductList`\
  \ \n  handleProductUpVote(productId) {\n    const nextProducts = this.state.products.map((product)\
  \ => {\n      if (product.id === productId) {\n        return Object.assign({},\
  \ product, {\n          votes: product.votes + 1,\n        });\n      } else {\n\
  \        return product;\n      }\n    });\n    this.setState({\n      products:\
  \ nextProducts,\n    });\n  }\n```\n\n`voting_app/public/js/app-9.js`\n\n首先，我们使用\
  \ `map()` 来遍历 `products` 数组。重要的是，`map()` 返回的是一个*新*数组，而不是修改 `this.state.products`\
  \ 数组。\n\n接下来，我们检查当前的 `product` 是否匹配 `productId`。如果匹配，我们创建一个*新的*对象，将原始产品对象的属性复制过去。然后，我们*覆盖**新产品对象上的\
  \ `votes` 属性。我们将其设置为增加后的投票计数。我们使用 Object 的 `assign()` 方法来实现这一点：\n\n```javascript\n\
  \ if (product.id === productId) {\n        return Object.assign({}, product, {\n\
  \          votes: product.votes + 1,\n        });\n```\n\n`voting_app/public/js/app-9.js`\n\
  \n如果当前的 `product` 不是 `productId` 指定的那一个，我们原封不动地返回它：\n\n```javascript\n } else {\n\
  \        return product;\n      }\n```\n\n`voting_app/public/js/app-9.js`\n\n最后，我们使用\
  \ `setState()` 来更新状态。\n\n`map()` 创建了一个新数组。所以你可能会问：为什么我们不能直接修改 `product` 对象呢？像这样：\n\
  \n```javascript\nif (product.id === productId) {\n  product.votes = product.votes\
  \ + 1;\n}\n```\n\n虽然我们正在创建一个新数组，但**这里的变量 `product` 仍然引用状态中原始数组上的产品对象**。因此，如果我们对它进行更改，我们就会修改状态中的对象。所以我们使用\
  \ `Object.assign()` 将原始对象克隆到一个新对象，然后修改该新对象上的 `votes` 属性。\n\n我们的点赞状态更新已经就绪。我们还有最后一件事要做的：我们的自定义组件方法\
  \ `handleProductUpVote()` 现在引用了 `this`。我们需要添加一个 `bind()` 调用，就像我们在 `Product` 中为 `handleUpVote()`\
  \ 做的那样：\n\n```javascript\nclass ProductList extends React.Component {\n  constructor(props)\
  \ {\n    super(props);\n\n    this.state = {\n      products: [],\n    };\n\n  \
  \  this.handleProductUpVote = this.handleProductUpVote.bind(this);\n  }\n```\n\n\
  `voting_app/public/js/app-9.js`\n\n现在 `handleProductUpVote()` 中的 `this` 指向我们的组件。\n\
  \n我们的应用最终应该对用户交互做出响应。保存 `app.js`，刷新浏览器，并祈祷运气：\n\n![](img/1-first_app----version-8.png)\n\
  \n最后，投票计数器工作了！尝试多次给某个产品点赞，注意它是如何立即跳到投票数较低的产品之上的。\n\n### 使用 Babel 插件 `transform-class-properties`\
  \ 进行重构\n\n在最后这一节中，我们将探索如何使用一种实验性的 JavaScript 特性对类组件进行可能的重构。由于你很快就会看到的原因，这一特性在 React\
  \ 开发者中非常流行。由于社区仍在采用这一特性，我们在整本书中向你展示了两种类组件风格。\n\n我们能够使用 Babel 的**插件和预设（plugins and\
  \ presets）**库来访问此特性。\n\n#### Babel 插件和预设\n\n我们在项目中一直使用 Babel，以便能够编写在大多数网络浏览器中运行的现代\
  \ JavaScript。具体来说，我们的代码一直在使用 Babel 将 ES6 语法和 JSX 转换为原生 ES5 JavaScript。\n\n有几种方法可以将\
  \ Babel 集成到你的项目中。我们一直一直使用 `babel-standalone`，它允许我们快速设置 Babel 并直接在浏览器中使用。\n\n`babel-standalone`\
  \ 默认使用两个**预设**。在 Babel 中，**一个*预设*是一组用于支持特定语言特性的*插件***。Babel 默认使用的两个预设是：\n\n* [`es2015`](https://babeljs.io/docs/plugins/preset-es2015/):\
  \ 添加对 ES2015（或 ES6）JavaScript 的支持\n\n* [`react`](https://babeljs.io/docs/plugins/preset-react/):\
  \ 添加对 JSX 的支持\n\nJavaScript 是一门不断变化的语言。按照它目前的速度，新语法每年都会通过批准并被采用。\n\n由于 JavaScript\
  \ 将继续演进，像 Babel 这样的工具将一直存在。开发者想要利用最新的语言特性。但浏览器更新其 JavaScript 引擎需要时间。而大多数大众将浏览器升级到最新版本需要更的时间。Babel\
  \ 弥补了这一差距。它允许代码库随 JavaScript 一起演进，而不会遗弃旧浏览器。\n\n除了 ES7 之外，提议中的特性处于不同的阶段。特性可能会被丢弃或修改。或者某个特性可能已经发布，这意味着它将包含在下一个\
  \ JavaScript 版本中。\n\n我们可以通过预设和插件自定义 Babel 以使用这些特性。在书中，我们通常避免使用实验性特性。然而，有一个特性我们破了例：属性初始化。\n\
  \n#### 属性初始化\n\n属性初始化详见提案“[ES 类字段与静态属性](https://github.com/tc39/proposal-class-fields)”。虽然实验性特性尚未通过，但属性初始化提供了一种极大简化\
  \ React 组件的迷人语法。这种特性在 React 中工作良好，以至于 Facebook 团队[在内部已经使用它](https://old.babeljs.io/blog/2015/06/07/react-on-es6)。\n\
  \n属性初始化可以通过 Babel 插件 `transform-class-properties` 使用。记得我们在 `index.html` 中为 `app.js`\
  \ 指定了该插件：\n\n```\n<script\n  type=\"text/babel\"\n  data-plugins=\"transform-class-properties\"\
  \n  src=\"./js/app.js\"\n></script>\n```\n\n因此，我们可以在代码中使用这种特性。\n\n#### 重构 Product\n\
  \n在 `Product` 中，我们定义了自定义组件方法 `handleUpVote`。正如我们讨论的，因为 `handleUpVote` 不是 React API\
  \ 的一部分，React 不会将 `this` 绑定到我们的组件。所以我们必须在 `constructor` 中进行手动绑定：\n\n```javascript\n\
  class Product extends React.Component {\n  constructor(props) {\n    super(props);\n\
  \n    this.handleUpVote = this.handleUpVote.bind(this);\n  }\n\n  handleUpVote()\
  \ {\n    this.props.onVote(this.props.id);\n  }\n\n  render() {\n```\n\n`voting_app/public/js/app-9.js`\n\
  \n通过 `transform-class-properties` 插件，**我们可以将 `handleUpVote` 写为箭头函数。这将确保函数内部的 `this`\
  \ 绑定到组件**，正如预期的：\n\n```javascript\nclass Product extends React.Component {\n  handleUpVote\
  \ = () => (\n    this.props.onVote(this.props.id)\n  );\n\n  render() {\n```\n\n\
  `voting_app/public/js/app-complete.js`\n\n使用这种特性，我们可以丢弃 `constructor()`。不再需要手动绑定调用。\n\
  \n注意，属于标准 React API 的方法（如 `render()`）将保持作为类方法。如果我们在一个自定义组件方法中想要将 `this` 绑定到组件，我们就将其写为箭头函数。\n\
  \n#### 重构 ProductList\n\n\n\n\n我们可以对 `ProductList` 内部的 `handleProductUpVote` 相同的处理方式。此外，属性初始化（property\
  \ initializers）为我们提供了定义组件初始状态的替代方法。\n\n之前，我们在 `ProductList` 中使用 `constructor()`\
  \ 来将 `handleProductUpVote` 绑定到组件，并定义组件的初始状态：\n\n```\nclass ProductList extends React.Component\
  \ {\n  constructor(props) {\n    super(props);\n\n    this.state = {\n      products:\
  \ [],\n    };\n\n    this.handleProductUpVote = this.handleProductUpVote.bind(this);\n\
  \  }\n}\n```\n\n使用属性初始化，我们就不再需要使用 `constructor` 了。相反，我们可以这样定义初始状态：\n\n```\nclass\
  \ ProductList extends React.Component {\n  state = {\n    products: [],\n  };\n\
  ```\n\n`voting_app/public/js/app-complete.js`\n\n而且，如果我们将 `handleProductUpVote`\
  \ 定义为箭头函数，`this` 将按照预期绑定到组件上：\n\n```\nhandleProductUpVote = (productId) => {\n \
  \   const nextProducts = this.state.products.map((product) => {\n      if (product.id\
  \ === productId) {\n        return Object.assign({}, product, {\n          votes:\
  \ product.votes + 1,\n        });\n      } else {\n        return product;\n   \
  \   }\n    });\n    this.setState({\n      products: nextProducts,\n    });\n  }\n\
  ```\n\n`voting_app/public/js/app-complete.js`\n\n总之，我们可以使用属性初始化对我们的 React 组件进行两次重构：\n\
  \n1. 我们可以为自定义组件方法使用箭头函数（并避免必须绑定 `this`）\n2. 我们可以在 `constructor()` 之外定义初始状态。\n\n\
  我们在本书中向你展示了这两种方法，因为它们在现实中被广泛使用。每个项目在是否使用 `transform-class-properties` 方面将保持一致。你欢迎在自己的项目中继续使用原生\
  \ ES6。然而，`transform-class-properties` 带来的简洁性通常极具吸引力，让人难以。\n\n### 恭喜！\n\n我们刚刚写了第一个\
  \ React 应用程序。我们还有许多尚未介绍的强大功能，但它们都建立在我们刚刚涵盖的核心基础之上：\n\n1. 我们以组件的方式思考并组织我们的 React\
  \ 应用\n2. 在 `render` 方法内部使用 JSX\n3. 数据通过 `props` 从父组件流向子组件\n4. 事件通过 `functions` 从子组件流向父组件\n\
  5. 利用 React 生命周期方法\n6. 状态组件以及 `state` 与 `props` 的区别\n7. 如何在将状态视为不可变的同时对其进行操作\n\n\
  继续前进！\n\n## 组件\n\n### 一个时间日志记录应用\n\n在上一章中，我们描述了 React 如何将应用程序组织成组件，以及数据如何在父子组件之间流动的。我们还讨论了核心概念，例如我们如何管理\
  \ `state` 以及使用 `props` 在组件之间传递数据。\n\n在本章中，我们将构建一个更复杂的应用程序。我们研究了一种你可以从零开始构建 React\
  \ 应用的模式，然后应用这些步骤来构建一个用于管理计时器的界面。\n\n在这个时间跟踪应用中，用户可以添加、删除和修改各种计时器。每个计时器对应于用户想要计时的不同任务：\n\
  \n![](img/2-components----completed-app.png)\n\n这个应用的交互能力将比比上一章构建的那个多得多。这将为我们带来了一些有趣的挑战，并将加深我们对\
  \ React 核心概念的理解。\n\n### 开始\n\n与所有章节一样，在开始之前确保你已经下载了书籍示例代码并准备就绪。\n\n#### 预览应用\n\n\
  让我们从尝试该应用的完整实现开始。\n\n在你的终端中，`cd` 进入 `time_tracking_app` 目录：\n\n```\n$ cd time_tracking_app\n\
  ```\n\n使用 `npm` 安装所有依赖项：\n\n```\n$ npm install\n```\n\n然后启动服务器：\n\n```\n$ npm start\n\
  ```\n\n现在你可以在浏览器中查看该应用。打开浏览器并输入 URL `http://localhost:3000`。\n\n玩几分钟来感受一下所有功能。刷新并注意你的更改已经持久化。\n\
  \n#### 准备应用\n\n在你的终端中，运行 `ls` 查看项目布局：\n\n```\n$ ls\nREADME.md\ndata.json\nnightwatch.json\n\
  node_modules/\npackage.json\npublic/\nsemantic.json\nserver.js\ntests/\n```\n\n\
  与上一个项目相比，有一些组织上的变化。\n\n首先，注意现在这个项目中有一个 `server.js`。在上一章中，我们使用预构建的 Node 包（称为 `live-server`）来提供我们的资源。\n\
  \n这次我们有一个自定义构建的服务器，它提供我们的资源并添加了持久化层。我们将在下一章中详细介绍服务器。\n\n在投票应用中，我们从 JavaScript 变量加载了应用所有的初始数据，该变量加载在\
  \ `seed.js` 文件中。\n\n这次，我们最终将其存储在文本文件 `data.json` 中。这使得行为更接近数据库。通过使用 JSON 文件，我们可以对数据进行编辑，即使应用关闭，这些编辑也会被持久化。\n\
  \n查看 `public` 内部：\n\n```\n$ cd public\n$ ls\n```\n\n这里的结构与上一个项目相同：\n\n```\nfavicon.ico\n\
  index.html\njs/\nsemantic/\n```\n\n\n\n\n\n```\n <script\n      type=\"text/babel\"\
  \n      data-plugins=\"transform-class-properties\"\n      src=\"./js/app.js\"\n\
  \    ></script>\n```\n\n`time_tracking_app/public/index.html`\n\n在本章中，我们再次使用了 Babel\
  \ 插件 `transform-class-properties`。我们在上一个章节 的末尾讨论过这个插件。\n\n按照注释操作，删除加载 `app-complete.js`\
  \ 的 `script` 标签：\n\n```\n<script\n  type=\"text/babel\"\n  data-plugins=\"transform-class-properties\"\
  \n  src=\"./js/app.js\"\n></script>\n<!-- 删除下面的 script 标签以开始。 -->\n<script\n  type=\"\
  text/babel\"\n  data-plugins=\"transform-class-properties\"\n  src=\"./js/app-complete.js\"\
  \n></script>\n```\n\n保存 `index.html`。如果你现在重新加载页面，你会发现应用已经了。\n\n### 将应用拆分为组件\n\n\
  正如我们在上一个项目中所做的那样，我们首先将应用拆分为各个组件。同样，视觉组件通常与其各自的 React 组件密切对应。让我们检查一下应用的界面：\n\n![](img/2-components----completed-app.png)\n\
  \n在上一个项目中，我们有 `ProductList` 和 `Product` 组件。第一个包含第二个的实例。在这里，我们发现了同样的模式，这次是 `TimerList`\
  \ 和 `Timer` 组件：\n\n![](img/2-components----components-highlight-1.png)\n\n然而，存在一个细微的差别：这个计时器列表底部有一个小的“+”图标。正如我们所看到的，我们可以通过这个按钮向列表添加新的计时器。因此，实际上\
  \ `TimerList` 组件不仅仅是一个计时器列表。它还包含一个用于创建新计时器的小部件（widget）。\n\n把组件看作像函数或对象一样对待它们。[单一职责原则](https://en.wikipedia.org/wiki/Single_responsibility_principle）同样适用。理想情况下，一个组件应该只负责一项功能。因此，这里正确的做法是将\
  \ `TimerList` 缩小回它仅列出计时器的职责，并将其嵌套在一个父组件下。我们将这个父组件命名为 `TimersDashboard`。`TimersDashboard`\
  \ 将拥有 `TimerList` 和“+”/创建表单小部件作为子：\n\n![](img/2-components----components-highlight-2.png)\n\
  \n这种职责分离不仅让组件保持简单，通常还能提高它们的重用性。将来，我们现在可以在应用中任何只需要显示计时器列表的地方放置 `TimerList` 组件。该组件不再承担创建计时器的责任，而这可能只是我们只在这个仪表板视图中需要的行为。\n\
  \n“+”/创建表单小部件很有趣，因为它有两个不同的表示形式。当点击“+”按钮时，小部件会变成一个表单。当表单关闭时，小部件又变回“+”按钮。\n\n我们可以采取两种方法。第一种是让父组件\
  \ `TimersDashboard` 根据某些状态数据来决定是否渲染“+”组件或表单组件。它可以在两者之间切换。然而，这给 `TimersDashboard`\
  \ 增加了更多责任。另一种方法是让一个新的子组件拥有所有决定是否显示“+”按钮或创建计时器表单的单一职责。我们将其命名为 `ToggleableTimerForm`。作为子组件，它可以渲染\
  \ `TimerForm` 组件或“+”按钮的 HTML 标记。\n\n此时，我们已经划分了四个组件：\n\n![](img/2-components----components-highlight-3.png)\n\
  \n既然我们已经有了识别负载过重组件的敏锐眼光，另一个候选人应该引起我们的注意：\n\n> ![单个计时器：显示时间（左）对比编辑表单（右）](img/2-components----timer-view-vs-edit.png)\n\
  \n> \n\n> 单个计时器：显示时间（左）对比编辑表单（右）\n\n计时器本身具有相当多的功能。它可以转换为编辑表单、删除自己以及启动和停止自己。我们需要将其拆分吗？如果需要，如何拆分？\n\
  \n显示计时器和编辑计时器确实是两个不同的 UI 。它们应该是两个不同的 React 组件。就像 `ToggleableTimerForm` 一样，我们需要一些容器组件，根据计时器是否正在编辑来渲染计时器界面或其编辑表单。\n\
  \n我们将其称为 `EditableTimer`。`EditableTimer` 的子组件将是 `Timer` 组件或编辑表单组件。创建和编辑计时器的表单非常相似，所以让我们假设在两种语文中都可以使用\
  \ `TimerForm` 组件：\n\n![](img/2-components----components-highlight-4.png)\n\n至于计时器的其他功能，如启动和停止按钮，目前还很难确定它们是否应该是它们自己的组件。我们可以相信，在我们编写一些代码之后，答案会变得更加明确。\n\
  \n回溯组件树，我们可以看到 `TimerList` 这个名字是一个误导。它实际上是 `EditableTimerList`。其他一切看起来良好。\n\n所以，我们有了最终的组件层次结构，关于计时器组件的最终状态还有些模糊：\n\
  \n![](img/2-components----components-highlight-5.png)\n\n*   `TimersDashboard`:\
  \ 父容器\n    *   `TimerList`: 显示计时器列表\n        *   `EditableTimer`: 显示计时器或编辑表单\n \
  \           *   `Timer`: 显示计时器\n            *   `TimerForm`: 显示编辑表单\n    *   `ToggleableTimerForm`:\
  \ 显示创建计时器的表单\n\n表示为层级树：\n\n![](img/2-components----server-data-flow)\n\n然而，如果我们像上一个章节那样从静态组件开始，将使事情变得简单。我们的\
  \ React 组件将不仅仅是渲染 HTML。点击按钮不会产生任何行为，因为我们还没有建立交互。这将使能够构建应用的框架，清晰地了解组件树是如何组织的。\n\n\
  接下来，我们可以确定应用的状态应该是什么以及应该在哪个组件中。我们将首先尝试将状态硬编码到组件中，而不是从服务器加载。\n\n到那时，我们将建立从父到子的数据流。然后我们可以添加反向数据流，将事件从子传递到父级。\n\
  \n最后，我们将修改顶层组件使其与服务器通信。\n\n1.  将应用拆分为组件\n2.  构建静态版本\n3.  确定什么是状态的\n4.  确定每个状态应该存储在哪个组件中\n\
  5.  硬编码初始状态\n6.  添加反向数据流\n7.  添加服务器通信\n\n我们在上一个项目中遵循了这种模式：\n\n**1. 将应用拆分为组件**：我们查看了所需的\
  \ UI，并确定想要 `ProductList` 和 `Product` 组件。\n\n**2. 构建静态版本**：我们的组件开始没有使用 `state`。相反，我们让\
  \ `ProductList` 向 `Product` 传递静态 props。\n\n**3. 确定什么是状态的**：为了让应用程序具有交互性，我们必须能够修改每个产品的\
  \ vote 属性。每个产品必须是可变的，因此是有状态的。\n\n\n\n\n\n## 4. 确定每个状态应该存储在哪个组件中\n\n`ProductList`\
  \ 使用 React 组件类方法管理投票状态。\n\n## 5. 硬编码初始状态\n\n当我们重写 `ProductList` 以使用 `this.state`\
  \ 时，我们从 `Seed.products` 为它填充了初始数据。\n\n## 6. 添加反向数据流\n\n我们在 `ProductList` 中定义了 `handleUpVote`\
  \ 函数，并通过 props 将其向下传递，以便每个 `Product` 都能通知 `ProductList` 向上投票事件。\n\n## 7. 添加服务器通信\n\
  \n我们没有在上一个应用中添加服务器组件，但会在这个应用中添加。\n\n如果现在对这个过程中的步骤还不完全清楚，请不要担心。本章的目的是让你熟悉这一流程。\n\n\
  我们已经涵盖了步骤 (1)，并且对所有的组件都有了良好的了解，只是对 `Timer` 组件还有一些不确定之处。步骤 (2) 是构建应用程序的静态版本。与上一个项目一样，这等于定义\
  \ React 组件、它们的层级结构以及它们的 HTML 表示。我们目前完全避免状态（state）。\n\n### 步骤 2：构建应用程序的静态版本\n\n###\
  \ TimersDashboard\n\n让我们从 `TimersDashboard` 组件开始。再次，本章中所有的 React 代码都位于 `public/app.js`\
  \ 文件中。\n\n我们将开始定义一个熟悉的函数 `render()`：\n\n```\nclass TimersDashboard extends React.Component\
  \ {\n  render() {\n    return (\n      <div className='ui three column centered\
  \ grid'>\n        <div className='column'>\n          <EditableTimerList />\n  \
  \        <ToggleableTimerForm\n            isOpen={true}\n          />\n       \
  \ </div>\n      </div>\n    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-1.js`\n\
  \n该组件渲染其嵌套在 `div` 标签下的两个子组件。`TimersDashboard` 向 `ToggleableTimerForm` 传递了一个 prop：`isOpen`。子组件使用它来决定渲染“+”符号还是\
  \ `TimerForm`。当 `ToggleableTimerForm` 为“打开”状态时，表单会被显示。\n\n接下来我们将定义 `EditableTimerList`。我们将它渲染两个\
  \ `EditableTimer` 组件。其中一个将渲染计时器的显示界面，另一个将渲染计时器的编辑表单：\n\n```\nclass EditableTimerList\
  \ extends React.Component {\n  render() {\n    return (\n      <div id='timers'>\n\
  \        <EditableTimer\n          title='Learn React'\n          project='Web Domination'\n\
  \          elapsed='8986300'\n          runningSince={null}\n          editFormOpen={false}\n\
  \        />\n        <EditableTimer\n          title='Learn extreme ironing'\n \
  \         project='World Domination'\n          elapsed='3890985'\n          runningSince={null}\n\
  \          editFormOpen={true}\n        />\n      </div>\n    );\n  }\n}\n```\n\n\
  `time_tracking_app/public/js/app-1.js`\n\n我们向每个子组件传递了五个 props。两个 `EditableTimer`\
  \ 组件之间的区别在于 `editFormOpen` 设置的值。我们将使用这个布尔值来指示 `EditableTimer` 渲染哪个子组件。\n\n#### EditableTimer\n\
  \n`EditableTimer` 根据 prop `editFormOpen` 返回 `TimerForm` 或 `Timer`：\n\n```\nclass\
  \ EditableTimer extends React.Component {\n  render() {\n    if (this.props.editFormOpen)\
  \ {\n      return (\n        <TimerForm\n          title={this.props.title}\n  \
  \        project={this.props.project}\n        />\n      );\n    } else {\n    \
  \  return (\n        <Timer\n          title={this.props.title}\n          project={this.props.project}\n\
  \          elapsed={this.props.elapsed}\n          runningSince={this.props.runningSince}\n\
  \        />\n      );\n    }\n  }\n}\n```\n\n`time_tracking_app/public/js/app-1.js`\n\
  \n注意 `title` 和 `project` 是作为 props 传递给 `TimerForm` 的。这将允许组件用计时器的当前值填充这些字段。\n\n###\
  \ TimerForm\n\n我们将构建一个带有两个输入字段的 HTML 表单。第一个输入字段用于标题，第二个用于项目。它在底部有一对按钮：\n\n```\n\
  class TimerForm extends React.Component {\n  render() {\n    const submitText =\
  \ this.props.title ? 'Update' : 'Create';\n    return (\n      <div className='ui\
  \ centered card'>\n        <div className='content'>\n          <div className='ui\
  \ form'>\n            <div className='field'>\n              <label>Title</label>\n\
  \              <input type='text' defaultValue={this.props.title} />\n         \
  \   </div>\n            <div className='field'>\n              <label>Project</label>\n\
  \              <input type='text' defaultValue={this.props.project} />\n       \
  \     </div>\n            <div className='ui two bottom attached buttons'>\n   \
  \           <button className='ui basic blue button'>\n                {submitText}\n\
  \              </button>\n              <button className='ui basic red button'>\n\
  \                Cancel\n              </button>\n            </div>\n         \
  \ </div>\n        </div>\n      </div>\n    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-1.js`\n\
  \n查看 `input` 标签。我们指定了 `type` 为 `text`，然后使用了 `defaultValue`。\n\n### ToggleableTimerForm\n\
  \n接下来让我们关注 `ToggleableTimerForm`。记住，它是 `TimerForm` 的一个包装器组件。它将显示“+”符号或 `TimerForm`。现在，它从父组件接收一个单一的\
  \ prop `isOpen`，用于指导它的行为：\n\n```\nclass ToggleableTimerForm extends React.Component\
  \ {\n  render() {\n    if (this.props.isOpen) {\n      return (\n        <TimerForm\
  \ />\n      );\n    } else {\n      return (\n        <div className='ui basic content\
  \ center aligned segment'>\n          <button className='ui button icon'>\n    \
  \        <i className='plus icon' />\n          </button>\n        </div>\n    \
  \  );\n    }\n  }\n}\n```\n\n如之前提到的，`TimerForm` 没有从 `ToggleableTimerForm` 接收任何 props。因此，它的\
  \ `title` 和 `project` 字段将为空渲染。\n\n`else` 块下的返回语句是渲染“+”按钮的标记。你可以认为它应该是自己的 React 组件（例如\
  \ `PlusButton`），但目前我们将代码保留在 `ToggleableTimerForm` 中。\n\n### Timer\n\n轮到 `Timer`\
  \ 组件了。再次，不要担心所有的 `div` 和 `span` 元素以及 `className` 属性。我们提供这些是为了样式样式：\n\n```\nclass\
  \ Timer extends React.Component {\n  render() {\n    const elapsedString = helpers.renderElapsedString(this.props.elapsed);\n\
  \    return (\n      <div className='ui centered card'>\n        <div className='content'>\n\
  \          <div className='header'>\n            {this.props.title}\n          </div>\n\
  \          <div className='meta'>\n            {this.props.project}\n          </div>\n\
  \          <div className='center aligned description'>\n            <h2>\n    \
  \          {elapsedString}\n            </h2>\n          </div>\n          <div\
  \ className='extra content'>\n            <span className='right floated edit icon'>\n\
  \              <i className='edit icon' />\n            </span>\n            <span\
  \ className='right floated trash icon'>\n              <i className='trash icon'\
  \ />\n            </span>\n          </div>\n        </div>\n        <div className='ui\
  \ bottom attached blue basic button'>\n          Start\n        </div>\n      </div>\n\
  \    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-1.js`\n\n\n\n\n\n此应用中的\
  \ `elapsed` 以毫秒为单位。这是 React 将保留的数据表示形式。对于机器来说这是一个很好的表示方式，但我们希望向碳基用户展示更具可读性的格式。\n\
  \n我们使用了在 `helpers.js` 中定义的函数 `renderElapsedString()`。如果你对它的实现方式感兴趣，可以打开该文件。它渲染的字符串格式为‘HH:MM:SS’。\n\
  \n## 渲染应用\n\n在定义了所有组件后，在查看静态应用之前的最后一步是确保我们调用了 `ReactDOM.render()`。将此放在文件的底部：\n\n\
  ```\nReactDOM.render(\n  <TimersDashboard />,\n  document.getElementById('content')\n\
  );\n```\n\n`time_tracking_app/public/js/app-1.js`\n\n### 尝试一下\n\n保存 `app.js` 并启动服务器（`npm\
  \ start`）。在 `localhost:3000` 它：\n\n![](img/2-components----app-ver-1.png)\n\n调整一些\
  \ props 并刷新以查看结果。例如：\n\n- 将传递给 `ToggleableTimerForm` 的 prop 从 `true` 切换为 `false`，查看“+”按钮的渲染。\n\
  - 切换 `editFormOpen` 的参数，见证 `EditableTimer` 相应切换其渲染的子组件。\n\n让我们回顾页面上表示的所有组件：\n\n\
  `TimersDashboard` 内部有两个子组件：`EditableTimerList` 和 `ToggleableTimerForm`。\n\n`EditableTimerList`\
  \ 包含两个 `EditableTimer` 组件。其中第一个有一个 `Timer` 组件作为子组件，第二个有一个 `TimerForm`。这些底层组件——也称为“叶子组件”（leaf\
  \ components）——包含了页面大部分的 HTML。通常情况下都是如此。叶子组件之上的组件主要负责调度。\n\n`ToggleableTimerForm`\
  \ 渲染了一个 `TimerForm`。注意页面上的两个表单按钮语言不同，因为第一个正在更新，而第二个正在创建。\n\n## 步骤 3：确定哪些应该是状态化的\n\
  \n为了赋予我们的应用交互性，我们必须使其从静态存在状态演变为可变状态。第一步是确定究竟*什么*应该是可变的。让我们从收集静态应用中每个组件使用的所有数据开始。在静态应用中，数据将位于我们定义或使用\
  \ props 的地方。然后我们将确定这些数据中的哪些应该是状态化的。\n\n#### `TimersDashboard`\n\n在我们的静态应用中，它声明了两个子组件。它设置了一个\
  \ prop，即传递给 `ToggleableTimerForm` 的 `isOpen` 布尔值。\n\n#### `EditableTimerList`\n\n\
  它声明了两个子组件，每个组件都有对应给定计时器属性的 props。\n\n#### `EditableTimer`\n\n它使用了 prop `editFormOpen`。\n\
  \n#### `Timer`\n\n它使用了计时器所有的 props。\n\n#### `TimerForm`\n\n它有两个交互式输入字段，一个用于 `title`，一个用于\
  \ `project`。在编辑现有计时器时，这些字段用计时器的当前值初始化。\n\n### 状态准则\n\n我们可以应用准则来确定数据是否应该是状态化的：\n\n\
  **1. 它是通过 props 从父组件传进的吗？如果是，它可能不是状态。**\n\n我们子组件中使用的许多数据已经列在它们的父中了。这一准则有助于我们去重。\n\
  \n例如，“计时器属性”被列了多次。当我们在 `EditableTimerList` 中看到声明的属性时，可以将其视为状态。但我们在其他地方看到它时，它不是。\n\
  \n**2. 它会随时间改变吗？如果不会，它可能不是状态。**\n\n这是状态化数据的关键准则：它会变化。\n\n**3. 你能根据组件中的任何其他状态或 props\
  \ 计算出它吗？如果是，它就状态。**\n\n为了简单起见，我们希望努力用尽可能少的数据点表示状态。\n\n#### 应用准则\n\n#### `TimersDashboard`\n\
  \n- 用于 `ToggleableTimerForm` 的 `isOpen` 布尔值\n\n**状态化**。数据在这里被定义。它随时间改变。而且它无法从其他状态或\
  \ props 计算出来。\n\n#### `EditableTimerList`\n\n- 计时器属性\n\n**状态化**。数据在在此组件中定义，随时间改变，且无法从其他状态或\
  \ props 计算出来。\n\n#### `EditableTimer`\n\n- 给定计时器的 `editFormOpen`\n\n**状态化**。数据在在此组件中定义，随时间改变，且无法从其他状态或\
  \ props 计算出来。\n\n#### `Timer`\n\n- 计时器属性\n\n在此语境下，**不是状态化的**。属性是从父组件传递的。\n\n####\
  \ `TimerForm`\n\n我们可能会倾向于认为 `TimerForm` 没有管理任何状态化数据，因为 `title` 和 `project` 是从父组件传递的\
  \ props。然而，正如我们将会看到的，表单本身就是特殊的状态管理器。\n\n所以，在 `TimerForm` 之外，我们确定了状态化数据：\n\n- 计时器列表以及每个计时器的属性\n\
  - 计时器的编辑表单是否打开\n- 创建表单是否打开\n\n## 步骤 4：确定每个状态应该存放在哪个组件中\n\n虽然我们确定的状态化数据可能存在于静态应用中的某些组件中，但这并不意味着它们在状态化应用中的最佳位置。我们的下一个任务是为我们的三个离散状态碎片确定最佳存放处。\n\
  \n这有时可能具有挑战性，但再次，我们可以应用 Facebook 指南“[Thinking in React](https://react.github.io/react/thinking-in-react.html)”中的以下步骤：\n\
  \n> 对于每一份状态：\n> * 识别每个根据该状态渲染内容的组件。\n> * 找到一个共同所有者（在需要该状态的组件上方的一个组件）。\n> * 由共同所有者或层级中更高的另一个组件拥有该状态。\n\
  > * 如果你找不到一个合适的组件来拥有状态，请在层级中的某个地方创建一个新组件专门持有该状态。\n\n让我们把此方法应用于我们的应用：\n\n### 计时器列表和每个计时器的属性\n\
  \n初看之下，我们可能会倾向于认为 `TimersDashboard` 并不使用该状态。相反，第一个使用它的组件是 `EditableTimerList`。这正是我们在静态应用中定义数据的位置。由于\
  \ `ToggleableTimerForm` 似乎也没有使用该状态，我们可能推断出 `EditableTimerList` 才是共同所有者。\n\n虽然对于显示、修改和删除计时器可能是这样，但创建呢？`ToggleableTimerForm`\
  \ 不需要状态即可渲染，但它可以影响状态。它需要能够插入一个新的计时器。它会将新计时器的数据向上传递给 `TimersDashboard`。\n\n因此，`TimersDashboard`\
  \ 是真正的共同所有者。它通过传递计时器状态来渲染 `EditableTimerList`。它可以处理 `EditableTimerList` 的修改和 `ToggleableTimerForm`\
  \ 的创建，从而改变状态。新状态将向下传递到 `EditableTimerList`。\n\n### 计时器的编辑表单是否打开\n\n在我们的静态应用中，`EditableTimerList`\
  \ 指定了 `EditableTimer` 是否应该带有打开的编辑表单。但从技术上讲，这个状态可以存在于每个独立的 `EditableTimer` 中。层级中没有父组件依赖于此数据。\n\
  \n将状态存储在 `EditableTimer` 中对于我们目前的需求是足够的。但未来某些需求可能要求我们在组件层级中向更高处“提升”此状态。\n\n例如，如果我们想实施一种限制，使得一次只能打开一个编辑表单呢？那么让\
  \ `EditableTimerList` 拥有该状态就是合理的，因为它需要检查该状态以决定是否允许新的“编辑表单打开”事件成功。如果我们想允许只打开一个表单（包括创建表单），那么我们将把状态提升到\
  \ `TimersDashboard`。\n\n### 创建表单的可见性\n\n\n\n\n\n`TimersDashboard` 似乎并不关心 `ToggleableTimerForm`\
  \ 是打开还是关闭。我们可以安全推断，状态可以直接存在于 `ToggleableTimerForm` 内部。\n\n总而言之，我们将在三个不同的组件中各拥有三个状态：\n\
  \n*   **计时器数据**将由 `TimersDashboard` 拥有并管理。\n*   每个 `EditableTimer` 将管理其**计时器编辑表单**的状态。\n\
  *   `ToggleableTimerForm` 将管理其**表单可见性**的状态。\n\n### 第 5 步：硬编码初始状态\n\n我们现在已经准备好让应用具有状态功能了。在这个阶段，我们还不会与服务器进行通信。相反，我们将在组件内部定义初始状态。这意味着在顶层组件\
  \ `TimersDashboard` 中硬编码一个计时器列表。对于另外两个状态，我们将组件的表单默认设为关闭状态。\n\n在为父组件添加了初始状态后，我们将确保其\
  \ `props` 在子组件中正确建立。\n\n#### 为 `TimersDashboard` 添加状态\n\n首先修改 `TimersDashboard`，将计时器数据直接存储在组件内部：\n\
  \n```\nclass TimersDashboard extends React.Component {\n  state = {\n    timers:\
  \ [\n      {\n        title: 'Practice squat',\n        project: 'Gym Chores',\n\
  \        id: uuid.v4(),\n        elapsed: 5456099,\n        runningSince: Date.now(),\n\
  \      },\n      {\n        title: 'Bake squash',\n        project: 'Kitchen Chores',\n\
  \        id: uuid.v4(),\n        elapsed: 1273998,\n        runningSince: null,\n\
  \      },\n    ],\n  };\n\n  render() {\n    return (\n      <div className='ui\
  \ three column centered grid'>\n        <div className='column'>\n          <EditableTimerList\n\
  \            timers={this.state.timers}\n          />\n          <ToggleableTimerForm\
  \ />\n        </div>\n      </div>\n    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-2.js`\n\
  \n我们正依赖 Babel 插件 `transform-class-properties` 来为我们提供属性初始化器语法。我们将初始状态设置为一个键为 `timers`\
  \ 的对象。`timers` 指向一个包含两个硬编码计时器对象的数组。\n\n在下面的 `render` 方法中，我们将 `state.timers` 传递给\
  \ `EditableTimerList`。\n\n对于 `id` 属性，我们使用了一个名为 `uuid` 的库。我们在 `index.html` 中加载了该库。我们使用\
  \ `uuid.v4()` 为每个项目随机生成一个[通用标识符](https://en.wikipedia.org/wiki/Universally_unique_identifier)。\n\
  \n#### 在 `EditableTimerList` 中接收 props\n\n`EditableTimerList` 通过名为 `timers` 的 `prop`\
  \ 接收计时器列表。修改该组件以使用这些 `props`：\n\n```\nclass EditableTimerList extends React.Component\
  \ {\n  render() {\n    const timers = this.props.timers.map((timer) => (\n     \
  \ <EditableTimer\n        key={timer.id}\n        id={timer.id}\n        title={timer.title}\n\
  \        project={timer.project}\n        elapsed={timer.elapsed}\n        runningSince={timer.runningSince}\n\
  \      />\n    ));\n    return (\n      <div id='timers'>\n        {timers}\n  \
  \    </div>\n    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-2.js`\n\n希望这看起来很熟悉。我们正在对\
  \ `timers` 数组使用 `map` 方法来构建一个 `EditableTimer` 组件列表。这与我们在上一章在 `ProductList` 中构建 `Product`\
  \ 组件列表的方式完全相同。\n\n我们将 `id` 也向下传递给 `EditableTimer`。这有点像是未雨缪。还记得 `Product` 是如何通过调用函数并传递其\
  \ `id` 来通信给 `ProductList` 的吗？可以安全地假设我们将再次这样做。\n\n#### Props 与 state\n\n随着你对 React\
  \ 状态范式有了新的理解，让我们再次反思 `props`。\n\n请记住，**props 是状态的不可变盟友**。在 `TimersDashboard` 中作为可变状态存在的内容被作为不可变的\
  \ `props` 传递给 `EditableTimerList`。\n\n我们曾详细讨论过什么才算作状态，以及状态应该存放在哪里。幸运的是，我们不需要对 `props`\
  \ 进行同样冗长的讨论。一旦你理解了状态，就能看到 `props` 如何充当它的**单向数据管道**。状态在某些选定的父组件中管理，然后这些数据作为 `props`\
  \ 向流传递。\n\n如果状态被更新，管理该状态的组件将通过调用 `render()` 重新渲染。这反过来又会导致它的任何子组件重新渲染。以及这些子组件的子组件。如此链链下去。\n\
  \n让我们继续沿着链链向下行军。\n\n#### 为 `EditableTimer` 添加状态\n\n在应用的静态版本中，`EditableTimer` 依赖从父组件传递的\
  \ `editFormOpen` `prop`。我们决定这个状态实际上可以存在于组件本身。\n\n我们将 `editFormOpen` 的初始值设置为 `false`，这意味着表单开始时是关闭的。我们还把\
  \ `id` 属性沿链向下传递：\n\n```\nclass EditableTimer extends React.Component {\n  state\
  \ = {\n    editFormOpen: false,\n  };\n\n  render() {\n    if (this.state.editFormOpen)\
  \ {\n      return (\n        <TimerForm />\n      );\n    } else {\n      return\
  \ (\n        <Timer\n          id={this.props.id}\n          title={this.props.title}\n\
  \          project={this.props.project}\n          elapsed={this.props.elapsed}\n\
  \          runningSince={this.props.runningSince}\n        />\n      );\n    }\n\
  \  }\n}\n```\n\n`time_tracking_app/public/js/app-2.js`\n\n#### `Timer` 保持无状态\n\n\
  如果你查看 `Timer`，你会发现它不需要修改。它到为止一直完全使用 `props`。\n\n#### 为 `ToggleableTimerForm` 添加状态\n\
  \n我们知道我们需要调整 `ToggleableTimerForm`，因为我们赋予了它状态。由于这个状态是隔离在组件内部的，让我们在这里添加应用的第一个交互功能。\n\
  \n让我们从初始化状态开始。我们希望组件初始化为关闭状态：\n\n```\nclass ToggleableTimerForm extends React.Component\
  \ {\n  state = {\n    isOpen: false,\n  };\n```\n\n`time_tracking_app/public/js/app-2.js`\n\
  \n接下来，让我们定义一个将状态切换为打开的函数：\n\n```\nhandleFormOpen = () => {\n  this.setState({ isOpen:\
  \ true });\n};\n\nrender() {\n```\n\n`time_tracking_app/public/js/app-2.js`\n\n\
  正如我们在上一章末尾探索过的，我们需要将此函数写成箭头函数，以确保函数内部的 `this` 绑定到组件。React 会自动为我们绑定对应于组件 API 方法（如\
  \ `render` 和 `componentDidMount`）。\n\n在这里我们还可以添加一点交互功能：\n\n```\nrender() {\n  if\
  \ (this.state.isOpen) {\n    return (\n      <TimerForm />\n    );\n  } else {\n\
  \    return (\n      <div className='ui basic content center aligned segment'>\n\
  \        <button\n          className='ui basic button icon'\n          onClick={this.handleFormOpen}\n\
  \        >\n          <i className='plus icon' />\n        </button>\n      </div>\n\
  \    );\n  }\n}\n```\n\n`time_tracking_app/public/js/app-2.js`\n\n\n\n\n\n这些输入字段可以由用户修改。在\
  \ React 中，对组件进行的所有修改都应该由 React 处理并保持在状态（state）中。这包括修改输入字段等更改。通过让 React 管理所有修改，我们确保了用户在\
  \ DOM 上与之交互的视觉组件与背后的 React 组件的状态保持一致。\n\n理解这一点的最好方法是看看它的具体样子。\n\n为了让这些输入字段具有状态化，我们首先在组件的顶部初始化\
  \ `state`：\n\n```\nclass TimerForm extends React.Component {\n  state = {\n    title:\
  \ this.props.title || '',\n    project: this.props.project || '',\n  };\n```\n\n\
  `time_tracking_app/public/js/app-2.js`\n\n我们的状态对象有两个属性，每个属性对应 `TimerForm` 管理的一个输入字段。我们将这些属性的初始状态设置为通过\
  \ `props` 传递的值。如果 `TimerForm` 是在创建一个计时器而不是编辑现有的计时器，那么这些 `props` 将是 `undefined`。在这种情况下，我们将它们都初始化为空字符串（`''`）。\n\
  \n`defaultValue` 仅在初始渲染时设置输入字段的值。与其使用 `defaultValue`，我们可以使用 `value` 将我们的输入字段直接连接到组件的状态。我们可以这样做：\n\
  \n```\n<div className='field'>\n  <label>Title</label>\n  <input\n    type='text'\n\
  \    value={this.state.title}\n  />\n</div>\n```\n\n通过此更改，我们的输入字段将由状态驱动。每当状态属性 `title`\
  \ 或 `project` 发生变化时，我们的输入字段就会更新以反映新值。\n\n然而，这遗漏了一个关键要素：我们目前还没有方法让用户修改此状态。输入字段在开始时会与组件的状态同步。但一旦用户进行修改，输入字段就会与组件的状态不同步。\n\
  \n我们可以通过对 `input` 元素使用 React 的 `onChange` 属性来修复这个问题。就像 `button` 或 `a` 元素使用 `onClick`\
  \ 一样，我们可以将 `onChange` 设置为一个函数。每当输入字段发生变化时，React 都会调用指定的函数。\n\n让我们将两个输入字段的 `onChange`\
  \ 属性设置为我们即将定义的函数：\n\n```\n <div className='field'>\n              <label>Title</label>\n\
  \              <input\n                type='text'\n                value={this.state.title}\n\
  \                onChange={this.handleTitleChange}\n              />\n         \
  \   </div>\n            <div className='field'>\n              <label>Project</label>\n\
  \              <input\n                type='text'\n                value={this.state.project}\n\
  \                onChange={this.handleProjectChange}\n              />\n       \
  \     </div>\n```\n\n`time_tracking_app/public/js/app-2.js`\n\n`handleTitleChange`\
  \ 和 `handleProjectChange` 函数将修改它们各自在状态中的属性。它们看起来如下：\n\n```\n handleTitleChange =\
  \ (e) => {\n    this.setState({ title: e.target.value });\n  };\n\n  handleProjectChange\
  \ = (e) => {\n    this.setState({ project: e.target.value });\n  };\n```\n\n`time_tracking_app/public/js/app-2.js`\n\
  \n当 React 调用传递给 `onChange` 的函数时，它会带有一个事件对象调用该函数。我们将此参数命名为 `e`。事件对象通过 `target.value`\
  \ 包含了字段更新后的值。我们将状态更新为输入字段的新值。\n\n将状态、`value` 属性和 `onChange` 属性结合使用是我们在 React 中编写表单元素的标准方法。我们会在“表单”章节中深入探讨表单。我们会在“不受控组件与受控组件”章节中专门探讨这一主题。\n\
  \n回顾一下，这里是 `TimerForm` 生命周期的示例：\n\n1. 页面上有一个标题为“Mow the lawn”的计时器。\n2. 用户打开此计时器的编辑表单，将\
  \ `TimerForm` 挂载到页面。\n3. `TimerForm` 将状态属性 `title` 初始化为字符串 `\"Mow the lawn\"`。\n\
  4. 用户修改输入字段，将其更改为值 `\"Cut the grass\"`。\n5. 每一次按键，React 都会调用 `handleTitleChange`。`title`\
  \ 的内部状态与用户在页面上看到的保持同步。\n\n通过对 `TimerForm` 进行重构，我们已经完成了在选定组件内部建立状态化数据。我们的向下数据管道（即\
  \ `props`）已经组装完成。\n\n我们准备好了——也许有点急于——要使用反向数据流来构建交互。但在此之前，让我们保存并重新加载应用以确保一切运行正常。我们预计会看到基于\
  \ `TimersDashboard` 中硬编码数据的新示例计时器。我们还预计点击“+”按钮会切换打开表单：\n\n![](img/2-components----toggle-open-form.png)\n\
  \n### 步骤 6：添加反向数据流\n\n正如我们在上一章中看到的，子组件通过调用通过 `props` 传递给它们的函数与父组件进行通信。在 ProductHunt\
  \ 应用中，当点击点赞时，`Product` 并没有进行任何数据管理。它不是状态的所有者。相反，它调用了由 `ProductHunt` 给它的函数。\n\n我们将在两个领域需要反向数据流：\n\
  \n- `TimerForm` 需要创建或更新。\n- `Timer` 需要启动和停止。\n\n### TimerForm\n\n为了清楚了解 `TimerForm`\
  \ 需要什么，我们首先从向它添加事件处理程序开始，然后逐向上移动。\n\n- `onFormSubmit()`：当表单提交时（创建或更新）\n- `onFormClose()`：当点击“取消”按钮时（关闭表单）\n\
  \n使用 `TimerForm` 的父组件负责提供这些函数。让我们先修改 `TimerForm` 上的按钮。我们为每个按钮指定 `onClick`：\n\n```\n\
  \ <div className='ui attached buttons'>\n              <button\n               \
  \ className='ui basic blue button'\n                onClick={this.handleSubmit}\n\
  \              >\n                {submitText}\n              </button>\n      \
  \        <button\n                className='ui basic red button'\n            \
  \    onClick={this.props.onFormClose}\n              >\n                Cancel\n\
  \              </button>\n            </div>\n```\n\n### Timer\n\n启动和停止逻辑。正如我们很快看到的，这让父组件能够决定这些事件发生时的行为。让我们从\
  \ `Timer` 开始。\n\n`Timer` 需要处理删除和编辑点击，以及启动和停止事件。\n\n`Timer` 需要处理两个事件：\n\n- `onDelete()`：当计时器被删除时\n\
  - `onEdit()`：当计时器被编辑时\n\n`Timer` 将接收两个函数作为 props。让我们看看 `handleSubmit` 看起来像什么样：\n\
  \n```\n handleSubmit = () => {\n  this.props.onFormSubmit({\n    id: this.props.id,\n\
  \    title: this.state.title,\n    project: this.state.project,\n  });\n  };\n\n\
  \  render() {\n```\n\n\n\n\n我们针对 `id` 使用 `submitText` 切换，而不是 `title`。使用 `id` 属性来判断对象是否已创建是更常见的做法。\n\
  \n### ToggleableTimerForm\n\n当 `TimerForm` 的提交事件沿组件层级向上冒泡时，让我们来追踪它。首先，我们将修改 `ToggleableTimerForm`。我们需要它向\
  \ `TimerForm` 传递两个 prop 属性函数：`onFormClose()` 和 `onFormSubmit()`：\n\n```\n // Inside\
  \ ToggleableTimerForm\n  handleFormOpen = () => {\n    this.setState({ isOpen: true\
  \ });\n  };\n\n  handleFormClose = () => {\n    this.setState({ isOpen: false });\n\
  \  };\n\n  handleFormSubmit = (timer) => {\n    this.props.onFormSubmit(timer);\n\
  \    this.setState({ isOpen: false });\n  };\n\n  render() {\n    if (this.state.isOpen)\
  \ {\n      return (\n        <TimerForm\n          onFormSubmit={this.handleFormSubmit}\n\
  \          onFormClose={this.handleFormClose}\n        />\n      );\n    } else\
  \ {\n```\n\n`time_tracking_app/public/js/app-3.js`\n\n首先看 `render()` 函数，我们可以看到我们将这两个函数作为\
  \ props 传入了。函数就像任何其他 prop 一样。\n\n这里最受关注的是 `handleFormSubmit()`。记住，`ToggleableTimerForm`\
  \ 并不是计时器状态的管理器。`TimerForm` 有它发出的事件，在这种情况下是提交一个新的计时器。`ToggleableTimerForm` 只是该消息的代理。因此，当表单被提交时，它会调用自己的\
  \ prop 函数 `props.onFormSubmit()`。我们最终会在 `TimersDashboard` 中定义这个函数。\n\n`handleFormSubmit()`\
  \ 接收参数 `timer`。回想一下，在 `TimerForm` 中该参数是一个包含所需计时器属性的对象。我们在这里只需将该参数传递下去。\n\n在调用 `onFormSubmit()`\
  \ 后，`handleFormSubmit()` 调用 `setState()` 来关闭它的表单。\n\n### TimersDashboard\n\n我们到达了层级的顶端\
  \ `TimersDashboard`。由于此组件将负责计时器的数据，因此我们在这里定义处理在叶子组件中捕获的事件的逻辑。\n\n我们关注的第一个事件是表单提交。当这种情况发生时，要么是在创建一个新计时器，要么是在更新一个现有计时器。我们将使用两个独立的函数来处理这两个不同的事件：\n\
  \n*   `handleCreateFormSubmit()` 将处理创建，并将传递给 `ToggleableTimerForm` 的函数\n*   `handleEditFormSubmit()`\
  \ 将处理更新，并将传递给 `EditableTimerList` 的函数\n\n这两个函数都会沿着各自的组件层级向下传递，直到作为 prop `onFormSubmit()`\
  \ 到达 `TimerForm`。\n\n让我们从 `handleCreateFormSubmit` 开始，它将一个新的计时器插入到我们的计时器列表状态中：\n\
  \n```\n // Inside TimersDashboard\n  handleCreateFormSubmit = (timer) => {\n   \
  \ this.createTimer(timer);\n  };\n\n  createTimer = (timer) => {\n    const t =\
  \ helpers.newTimer(timer);\n    this.setState({\n      timers: this.state.timers.concat(t),\n\
  \    });\n  };\n\n  render() {\n    return (\n      <div className='ui three column\
  \ centered grid'>\n        <div className='column'>\n          <EditableTimerList\n\
  \            timers={this.state.timers}\n          />\n          <ToggleableTimerForm\n\
  \            onFormSubmit={this.handleCreateFormSubmit}\n          />\n        </div>\n\
  \      </div>\n    );\n  }\n```\n\n`time_tracking_app/public/js/app-3.js`\n\n我们使用\
  \ `helpers.newTimer()` 创建计时器对象。你可以查看 `helpers.js` 内部实现。我们传入了从 `TimerForm` 传来的对象。该对象具有\
  \ `title` 和 `project` 属性。`helpers.newTimer()` 返回一个同样包含这些 `title` 和 `project` 属性以及生成的\
  \ `id` 的对象。\n\n下一行调用 `setState()`，将新计时器追加到存储在 `timers` 下的计时器数组中。我们将整个状态对象传递给 `setState()`。\n\
  \n我们已经完成了从 `TimerForm` 表单到 `TimersDashboard` 管理状态的创建计时器流程的连接。保存 `app.js` 并刷新浏览器。切换打开创建表单并创建一些新计时器：\n\
  \n![](img/2-components----create-timer.png)\n\n### 更新计时器\n\n我们需要对更新计时器流程进行同样的处理。然而，正如你从应用程序当前状态中所看到的，我们尚未添加编辑计时器的功能。因此，我们还没有显示编辑表单的方法，而这是提交表单的前决条件。\n\
