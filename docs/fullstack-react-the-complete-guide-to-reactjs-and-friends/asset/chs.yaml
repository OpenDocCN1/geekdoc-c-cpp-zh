  \   );\n    const oldThread = state[threadIndex];\n\n    const newThread = {\n \
  \     ...oldThread,\n      messages: oldThread.messages.filter((m) => (\n      \
  \  m.id !== action.id\n      )),\n    };\n\n    return [\n      ...state.slice(0,\
  \ threadIndex),\n      newThread,\n      ...state.slice(\n        threadIndex +\
  \ 1, state.length\n      ),\n    ];\n  } else {\n    return state;\n  }\n}\n```\n\
  \n`redux/chat_intermediate/src/complete/App-8.js`\n\n通过专注于这个 reducer 并让它只处理状态中的\
  \ `threads` 属性，我们能够稍微简化我们的代码。我们的返回函数不再需要担心整个状态树，而且我们从此函数中移除了一个 action 处理器。\n\n我们在两个\
  \ action 处理器之间仍然存在逻辑重复的情况。值得注意的是，它们的返回函数是相同的。\n\n事实上，虽然我们通过让 reducer 只处理 `state.threads`\
  \ 简化了它，但这个 reducer 实际上在处理状态树的两个级别：`threads` 和 `messages`。我们可以通过让 `threadsReducer()`\
  \ 将责任委托给另一个 reducer：`messagesReducer()`，将 reducer 逻辑进一步拆分为更小的部分并共享代码。\n\n我们将在下一节探讨这一点。现在，让我们启动应用并验证我们目前的解决方案是否有效。\n\
  \n### 尝试一下\n\n保存 `App.js`。如果服务器没有运行，请启动它：\n\n```bash\n$ npm start\n```\n\n然后将浏览器指向\
