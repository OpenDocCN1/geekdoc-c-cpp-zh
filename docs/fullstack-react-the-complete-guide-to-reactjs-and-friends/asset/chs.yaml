  \            name\n            avatarUrl\n            bio\n          }\n       \
  \ }\n      }\n    }`,\n  }\n});\n```\n\n`relay/bookstore/client/src/steps/BookPage.reads.js`\n\
  \n在这个片段中，我们正在加载 `Book` 元数据以及前 100 个作者。\n\n让我们看看 `render()` 函数：\n\n\n\n\n\n```\n\
