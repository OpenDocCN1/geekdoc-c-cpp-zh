  \ `oldThread.messages` 作为第一个参数传递给 `messagesReducer()`，并将 `action` 作为第二个参数。这遵循了我们目前为止的模式：`reducer()`\
  \ 传递了 `threadsReducer()`。`reducer()` 将 `threadsReducer()` 作为其第一个参数。`threadsReducer()`\
  \ 将 `thread.messages` 作为第一个参数传递给 `messagesReducer()`。\n\n完整的 `action` 对象被沿链传递。\n\
  \n我们不需要对返回值进行任何修改。\n\n目前，这似乎只是一个微小的——可以忽略的——胜利。之前，我们内联调用 `concat` 来创建一个新的 `messages`\
  \ 数组。现在我们增加了调用另一个函数的复杂度。\n\n`redux/chat_intermediate/src/complete/App-9.js`\n\n\
  `messagesReducer()` 接收消息数组作为第一个参数 `state`。`ADD_MESSAGE` 处理器使用 `action.text` 创建新消息。像之前一样使用\
  \ `concat` 返回一个在末尾追加了新消息的消息数组。\n\n既然我们已经看到了 `threadsReducer()` 如何将 `ADD_MESSAGE`\
  \ 委托给 `messagesReducer()`，让我们看看 `DELETE_MESSAGE` 如何完成同样的事情。\n\n我们正在拆分一项很有意义的工作。此外，当我们给\
  \ `DELETE_MESSAGE` 同样的处理时，另一个好处变得明显。\n\n在修改我们的 `DELETE_MESSAGE` action 处理器之前，让我们先处理\
