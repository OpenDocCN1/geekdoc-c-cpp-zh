  \ 是使用 Relay 实现流行的 TodoMVC 应用。如果你在寻找更多变异的示例，这里是一个很好的起点。\n* [`react-router-relay`](https://github.com/relay-tools/react-router-relay)\
  \ 是我们在本章中使用的集成库，用于将 React Router 与 Relay 配合使用\n* [GraphQL 身份认证指南](https://dev-blog.apollodata.com/a-guide-to-authentication-in-graphql-e002a4039d1#.z0vnf3846)\
  \ - 在某处你可能想为你的服务器添加身份验证的页面。查看这篇文章可以获得一个很好的起点。\n* [Relay 2：更简单、快速、更可预测](https://speakerdeck.com/wincent/relay-2-simpler-faster-more-predictable)\
  \ – 如果你想看到 Relay 的发展方向，请查看 Greg Hurrell 的这些幻灯片。\n\n## React Native\n\n在本章中，我们将介绍如何构建你的第一个\
  \ React Native 应用。我们不会在这一章中深入探讨 React Native。React Native 是一个巨大的课题，值得专门写一本书。\n\n\
  我们将为 React 开发者解释 React Native。到本章结束时，你将能够获取你的 React Web 应用，并拥有将其转换为 React Native\
  \ 应用的基础。\n\n正如我们目前所看到的，React 既有趣又强大。在本章中，目标是了解我们喜爱的 React 的所有特性如何使用 React Native\
  \ 构建原生的 iOS 和 Android 应用程序。\n\n在不深入探讨 React Native 底层工作原理的技术细节的情况下，高层总结如下：\n\n当我们构建\
  \ React 组件时，我们实际上是在构建 React 组件的表示，而不是使用 `Virtual DOM` 构建实际的 DOM 元素。在浏览器中，React 获取这个虚拟\
  \ DOM，预先计算元素在 Web 浏览器中应该是什么样子，然后将其交给浏览器来处理布局。\n\nReact Native 的核心思想是，我们可以获取 React\
  \ 组件的对象表示树，与其将其映射到 浏览器的 DOM，不如将其映射到 iOS 的 [UIView](https://developer.apple.com/reference/uikit/uiview)\
  \ 或 Android 的 [android.view](https://developer.android.com/reference/android/view/View.html)。理论上，我们可以使用\
  \ Web 浏览器中 React 的相同思想来构建原生 iOS 和 Android 应用程序。这就是 React-Native 的基本思想。\n\n在本节中，我们将为原生渲染器构建\
  \ React 组件，并强调原生版 React 与 Web 版 React 之间的区别。\n\n在深入细节之前，让我们从宏观开始。至关重要的一点是，我们不再为\
  \ Web 环境构建应用，这意味着我们有不同的 UX、UI，且没有 URL 位置。尽管我们围绕为 Web 构建 UI 所建立的思维方式有所帮助，但它们不足以转化并在移动原生环境中构建出色的用户体验。\n\
  \n让我们花一点时间看一些最流行的原生应用并尝试一下它们。不要从用户的角度使用应用程序，而是尝试想象你正在构建这个应用程序，并记录下细节。例如，寻找微动画、视图是如何设置的、页面切换、缓存、数据如何在屏幕之间传递、以及当我们等待信息加载时会发生什么。\n\
  \n通常情况下，在 Web 上我们可以设计不那么刻意的 UI 也可以。但在移动端，由于我们的屏幕尺寸和数据细节更受限且更集中，我们被迫关注应用程序的体验。为原生应用构建出色的\
  \ UX 需要刻意的执行和对细节的关注。\n\n在本章中，我们的目标之一是强调两个平台之间存在的语法差异和审美差异。\n\n### 初始化 (Init)\n\n\
  由于我们在学习这一节内容时专注于直接进入代码，因此我们希望有一个已经启动的应用程序，以便我们可以实验和测试构建原生应用。\n\n为了启动一个 React-Native\
  \ 应用，我们可以使用 `react-native-cli` 工具。我们需要使用 Node 包管理器 (`npm`) 安装它。让我们全局安装 `react-native-cli`\
  \ 工具，以便我们可以在系统的任何地方访问它：\n\n```\nnpm i -g react-native-cli@2.0.1\n```\n\n> 关于如何为你的开发环境配置\
  \ React Native 的正式说明，请查看官方的[快速上手](http://facebook.github.io/react-native/releases/0.31/docs/getting-started.html)\
  \ 文档。\n\n安装了 `react-native-cli` 工具后，我们将在终端可以使用 `react-native` 命令。如果此命令返回“未识别”的错误，请检查上方针对你开发平台的快速上手文档。\n\
  \n```\n$ react-native\n```\n\n要创建一个新的 React-Native 项目，我们将运行 `react-native init`\
  \ 命令，并带有我们想要生成的应用程序名称。例如，让我们生成一个名为 `Playground` 的 React-Native 应用：\n\n```\n$ react-native\
  \ init Playground\n```\n\n> 你的命令输出可能与上面略有不同，只要你看到如何启动它的指令即可。如果你看到错误，请查看[故障排除](http://facebook.github.io/react-native/releases/0.31/docs/troubleshooting.html#content)\
  \ 文档获取更多启动应用程序的说明。\n\n现在可以使用刚刚创建的 `Playground` 应用来测试和运行我们在整个节中创建的代码。\n\n### 路由 (Routing)\n\
  \n让我们从路由开始我们的应用程序，因为它是几乎每个应用的基础。\n\n我们在 Web 上实现路由时，通常会将一个 URL 映射到特定的 UI。例如，让我们来看一个为\
  \ Web 编写的游戏，它使用 React Router V2 API 编写了多个屏幕：\n\n我们在 Web 上实现路由时，通常会将某些 URL 映射到特定的\
  \ UI。以下是使用 React Router V2 这种方式，URL 映射到活动组件的情况：\n\n\n\n\n\n```javascript\nexport\
  \ const Routes = (\n  <Router history={hashHistory}>\n    <Route path='/' component={Main}>\n\
  \      <IndexRoute component={Home} />\n      <Route\n        path='players/:playerOne?'\n\
  \        component={PromptContainer}\n      />\n      <Route\n        path='battle'\n\
  \        component={ConfirmBattleContainer}\n      />\n      <Route\n        path='results'\n\
  \        component={ResultsContainer}\n      />\n    </Route>\n  </Router>\n);\n\
  ```\n\n`src/routes.js`\n\n| URL | 激活组件 |\n| --- | --- |\n| foo.com | Main -> Home\
  \ |\n| foo.com/players | Main -> PromptContainer |\n| foo.com/players/ari | Main\
  \ -> PromptContainer |\n| foo.com/battle | Main -> ConfirmBattleContainer |\n| foo.com/results\
  \ | Main -> ResultsContainer |\n\nReact Router 完美地实现了 URL 与 UI 之间的这种映射（即：声明式）。\n\
  \n当用户在应用程序中导航到不同的 URL 时，不同的组件会变为 `active`。URL 对 React Router 来说是基础性的，以至于在开头描述中就提到了两次：\n\
  \n> React Router 保持你的 UI 与 `URL` 同步……让 `URL` 成为你的首选，而不是事后补救。\n\n这是一个清晰且易于理解的范式，也是让\
  \ React Router 如此受欢迎的原因。然而，如果我们正在为原生应用开发会呢？我们没有可以引用的 URL。在原生应用中，甚至根本没有类似的 URL 概念性映射。\n\
  \n![](img/react-native----layers.png)\n\n原生应用结构中的路由层是以栈（stack）的形式组织的，粗略来说，它基本上就是一个数组。当我们在\
  \ React Native 中在路由之间切换时，我们只是将一个路由推入（导航 `into` 一个视图）或从我们的 `route stack`（路由栈）中弹出（导航\
  \ `out of` 一个视图）。\n\n从浏览器的角度来看，这与映射离散的 URL 是一个不同的范式。我们不是映射到一个唯一的 URL，而是管理一个映射到路由栈的数组。\n\
  \n此外，我们不仅是将视图组件映射到视图，还将处理如何实现路由之间的过渡。与 Web 不同，Web `通常` 拥有独立的路由过渡，而原生应用在我们从一个屏幕导航到下一个屏幕时，通常需要了解彼此。\n\
  \n例如，一旦我们的视图渲染，我们通常会有动画，但路由本身之间并没有过渡。然而，在原生应用中，一旦视图渲染，我们仍然会有这些动画，并且需要一种方法让一个路由在导航栈中过渡到下一个。\n\
  \n原生设备上的大多数路由过渡自然地是层次化的，并且`通常`应该恰当反映反映用户在应用每个阶段的历程。\n\n在 React Native 中，我们可以通过 `scene\
  \ configurations`（场景配置）来配置这些路由过渡。稍后我们将查看如何自定义 `scene transitions`（场景过渡），但目前我们注意到不同的平台需要不同的路由过渡。\n\
  \n在 iOS 平台上，我们通常处理路由之间的三种不同过渡之一：\n\n* 从右到左\n* 左左到右\n* 从底到上\n\n通常当我们在 iOS 上从右侧推入路由时（如果我们深入进入同一个层级），当它是处于不同层级的模态屏幕（modal\
  \ screen），我们将从底部显示视图。我们通常会在同一层级中通过从左到右的过渡 `push` 一个新视图，并在离开之前的路由后通过从右到左的过渡 `pop`。\n\
  \n然而，Android 的范式稍有不同。我们仍然有深入更多内容的想法，但不是硬性的从左到右过渡，而是有一个创建 `elevation`（高度）变化的概念。\n\
  \n> ### 尝试一下\n> 无论我们为什么设备构建程序，打开我们正在工作的平台上流行的应用程序，并留意屏幕之间的路由跳转是什么样的都是一个好主意。\n\n\
  理论足够了。让我们回到实现。React Native 路由有几种选择。在编写期间，Facebook 已经表示他们正在为 React Native 开发一个新的路由器组件。现在，我们将坚持使用经过验证和测试的\
  \ `Navigator` 组件来处理应用程序中的路由。\n\n### ` <Navigator />` `\n\n就像路由的 Web 版本一样，我们那里有渲染以处理路由的\
  \ React 组件，`<Navigator />` 组件`仅仅是一个 React 组件`。这意味着我们将像使用视图中的任何其他组件一样使用它。\n\n```html\n\
  <Navigator />\n```\n\n既然知道 `<Navigator />` 组件是一个 React 组件，我们可能想知道：\n\n1. 它接收哪些 `props`？\n\
  2. 是否有必要将其封装在高阶组件（Higher Order Component）中？\n3. 我们如何使用单个组件进行导航？\n\n让我们从第 1 点开始，它接收哪些\
  \ `props`？\n\n`<Navigator />` 只需要两个 `props`，它们两个都是函数：\n\n* `configureScene()`\n\
  * `renderScene()`\n\n每当我们在应用程序中更改路由时，`configureScene()` 和 `renderScene()` 函数都会被调用。\n\
  \n`renderScene()` 函数负责决定下一个渲染哪个 UI（或组件），而 `configureScene()` 函数负责详细说明要进行哪种过渡类型（正如我们之前看到的）。\n\
  \n为了完成它们的工作，我们需要接收关于`即将发生`的特定路由更改的信息。自然地，由于这些是函数，它们将以`argument`（参数）的形式接收这些信息。\n\n\
  与其说，不如看看它是什么样子的。从模板代码开始，我们知道我们将渲染一个组件：\n\n```javascript\nexport default class App\
  \ extends Component {\n  configureScene(route) {\n    // 配置场景\n  }\n\n  renderScene(route,\
  \ navigator) {\n    // 渲染场景\n  }\n\n  render() {\n    return (\n      <Navigator\n\
  \        renderScene={this.renderScene}\n        configureScene={this.configureScene}\n\
  \      />\n    );\n  }\n}\n```\n\n`src/routes.js`\n\n漂亮。我们会注意到这回答了我们上面的第二个问题。通常当我们使用\
  \ `<Navigator />` 组件时，我们将它封装在一个高阶函数（Higher Order Function）中以便处理我们的 `renderScene()`\
  \ 和 `configureScene()` 方法。\n\n#### `renderScene()`\n\n现在来看看 `renderScene()` 方法如何实现。我们目前对\
  \ `renderScene()` 函数知道两点：\n\n1. 它的目的是在过渡到新场景时确定哪个 UI（或组件）。\n2. 它接收一个代表路由更改的对象。\n\
  \n考虑到这两点，让我们看看 `renderScene()` 可能实现的示例：\n\n```javascript\nrenderScene(route) {\n\
  \    if (route.home === true) {\n      return <HomeContainer />\n    } else if (route.notifications\
  \ === true) {\n      return <NotificationsContainer />\n    } else {\n      return\
  \ <FooterTabsContainer />\n    }\n  }\n```\n\n`src/index.js`\n\n由于 `renderScene()`\
  \ 函数的完全目的是确定下一个哪个 UI（或组件），因此 `renderScene()` 函数只是一个大的 `if` 语句并根据 `route` 对象的属性渲染不同的组件是合理的。\n\
  \n下一个自然的问题是“`route` 对象是从哪里来的，它是如何获得 `home` 和 `notifications` 属性的？”\n\n这就是 React\
  \ Native 配置变得变得有点奇怪的地方。记得上面提到的吗，我们提到*每当我们在应用程序中更改路由时，`configureScene()` 和 `renderScene()`\
  \ 都会被调用*？嗯，我们还没有回答我们*如何*在应用程序中*更改路由*。为了回答这个问题，我们需要查看 `renderScene()` 函数接收的第二个参数：`navigator`：\n\
  \n```javascript\nrenderScene(route, navigator) {\n  // 渲染场景\n}\n```\n\n\n\n\n\n\
  `navigator` 对象是一个实例对象，我们可以用它来在应用程序内部操作当前的路由。该对象本身包含了一些非常实用的方法，包括 `push()` 和 `pop()`\
  \ 方法。`push()` 和 `pop()` 方法正是我们实际上通过向路由栈中推入或从路由栈中弹出，来在应用内部处理路由更改的方式。\n\n请注意，我们在这里的\
  \ `renderScene()` 方法内部接收了 `navigator` 对象，但 `renderScene()` 方法是为了选择下一个场景，而不是为了`调用一个\
  \ invoking）路由更改。为了在渲染的场景中实际`使用`(use）`navigator` 对象，我们需要将其作为 `prop` 传递给新路由：\n\n```\n\
  \ renderScene(route, navigator) {\n    if (route.home === true) {\n      return\
  \ <HomeContainer navigator={navigator} />\n    } else if (route.notifications ===\
  \ true) {\n      return <NotificationsContainer navigator={navigator} />\n    }\
  \ else {\n      return <FooterTabsContainer navigator={navigator} />\n    }\n  }\n\
  ```\n\n`src/app/index.js`\n\n通过这次更新，`<HomeContainer />`、`<NotificationsContainer\
  \ />` 和 `<FooterTabsContainer />` 都可以访问 `navigator` 实例，并且它们都可以通过 `this.props.navigator`\
  \ 调用路由栈的 `push()` 或 `pop()`。\n\n例如，假设我们正在处理主页路由并想要导航到通知路由。我们可以在像下面的方法中向导航路由`推入`(push)操作：\n\
  \n```\n handleToNotifications() {\n    this.props.navigator.push({\n      notifications:\
  \ true,\n    });\n  }\n```\n\n`src/app/containers/home.js`\n\n一旦我们在 `<HomeContainer\
  \ />` 组件内部调用了 `handleToNotifications()` 方法，我们的 `renderScene()` 方法就会带上 `route` 参数被调用，该参数是通过\
  \ `this.props.navigator.push()` 方法推入（pushed）的 `object` 传递的。当 `renderScene()` 看到\
  \ `route` 对象包含属性为 true 的 `notifications` 时，它会返回 `<NotificationsContainer />` 作为下一个渲染的组件。\n\
  \n如果这还没有立即`生效`(click)，请先不要担心。我们会经常使用 `<Navigator />` 组件。随着我们经验的增加，随着学习的进行，它会变得更有意义。\n\
  \n### `configureScene()`\n\n现在我们已经知道如何在应用中更改路由了，我们需要能够根据发生的特定路由更改来告诉应用应该执行`哪种`(which）过渡类型（过渡类型为`从左到右`、`从右到左`、`模态`等）。根据我们上面的讨论，请回想这发生在我们之前定义的\
  \ `configureScene()` 方法内部：\n\n```\nconfigureScene(route) {\n  // 配置场景\n}\n```\n\n\
  传递给 `renderScene()` 方法的同一个路由对象也会传递给 `configureScene()` 方法。我们可以在 `configureScene()`\
  \ 方法内部使用与在 `renderScene()` 方法中使用相同的逻辑：\n\n```\n configureScene(route) {\n    if\
  \ (route.home === true) {\n      // 切换到 HomeContainer\n    } else if (route.notifications\
  \ === true) {\n      // 切换到 NotificationsContainer\n    } else {\n      // 显示 FooterTabsContainer\n\
  \    }\n  }\n```\n\n`src/app/index.js`\n\n我们不再在这里渲染组件，而是告诉 `<Navigator />` 组件我们在切换到新\
  \ UI 时想要使用的过渡类型。`<Navigator />` 对象带有 10 种不同的[场景配置](http://facebook.github.io/react-native/releases/0.31/docs/navigator.html#configurescene)，所有的都位于\
  \ `Navigator.SceneConfigs` 对象上。\n\n*   `Navigator.SceneConfigs.PushFromRight`（默认）\n\
  *   `Navigator.SceneConfigs.FloatFromRight`\n*   `Navigator.SceneConfigs.FloatFromLeft`\n\
  *   `Navigator.SceneConfigs.FloatFromBottom`\n*   `Navigator.SceneConfigs.FloatFromBottomAndroid`\n\
  *   `Navigator.SceneConfigs.FadeAndroid`\n*   `Navigator.SceneConfigs.HorizontalSwipeJump`\n\
  *   `Navigator.SceneConfigs.HorizontalSwipeJumpFromRight`\n*   `Navigator.SceneConfigs.VerticalUpSwipeJump`\n\
  *   `Navigator.SceneConfigs.VerticalDownSwipeJump`\n\n我们从 `configureScene()` 方法返回的配置将是用于特定路由更改的过渡类型。\n\
  \n例如，假设我们的用户在 iOS 上，我们希望除了通知路由外的每个路由都具有标准的`从左到右`过渡，并且我们希望通知路由从底部弹出作为`模态`(modal)过渡。我们可以通过如下更新\
  \ `configureScene()` 方法来实现这种行为：\n\n```\n configureScene(route) {\n    if (route.notifications\
  \ === true) {\n      return Navigator.SceneConfigs.FloatFromBottom;\n    }\n\n \
  \   return Navigator.SceneConfigs.FloatFromRight;\n  }\n\n  renderScene(route, navigator)\
  \ {\n    if (route.home === true) {\n      return <HomeContainer navigator={navigator}\
  \ />\n    } else if (route.notifications === true) {\n      return <NotificationsContainer\
  \ navigator={navigator} />\n    } else {\n      return <FooterTabsContainer navigator={navigator}\
  \ />\n    }\n  }\n\n  render() {\n    return (\n      <Navigator\n        renderScene={this.renderScene}\n\
  \        configureScene={this.configureScene}\n      />\n    );\n  }\n```\n\n`src/app/index.js`\n\
  \n现在，假设我们的用户在 iOS 上，我们希望除了通知路由外的每个路由都具有标准的`从左到右`过渡，并且我们希望通知路由从底部弹出作为`模态`过渡。我们可以通过如下更新\
  \ `configureScene()` 方法来实现这种行为：（同上文）\n\n现在，当我们的用户在 Android 设备上导航到通知路由时，我们将获得 `FloatFromBottomAndroid`\
  \ 过渡，而在 iOS 设备上则将获得 `FloatFromBottom` 过渡。\n\n现在，当我们的用户导航到通知视图时，我们将看到 `FloatFromBottom`\
  \ 过渡。对于任何其他路由，我们将获得默认的 `FloatFromRight` 过渡。\n\n之前我们讨论过 Android 和 iOS 有本质不同的路由过渡。为了检测应用当前运行在哪个平台，我们可以使用\
  \ react-native 导出的 `Platform` 对象。首先，我们需要从 react-native 获取 `Platform`：\n\n```\nimport\
  \ { Platform } from 'react-native';\n```\n\n`src/app/index.js`\n\n`Platform` 对象有一个名为\
  \ `OS` 的属性，它显示当前使用的平台。对于 iOS，字符串是 `'ios'`，对于 android，字符串是 `'android'`。\n\n```\n\
  \ configureScene(route) {\n    if (route.notifications === true) {\n      if (Platform.OS\
  \ === 'android') {\n        return Navigator.SceneConfigs.FloatFromAndroid;\n  \
  \    } else {\n        return Navigator.SceneConfigs.FloatFromBottom;\n      }\n\
  \    }\n\n    return Navigator.SceneConfigs.FloatFromRight;\n  }\n\n  renderScene(route,\
  \ navigator) {\n    if (route.home === true) {\n      return <HomeContainer navigator={navigator}\
  \ />\n    } else if (route.notifications === true) {\n      return <NotificationsContainer\
  \ navigator={navigator} />\n    } else {\n      return <FooterTabsContainer navigator={navigator}\
  \ />\n    }\n  }\n\n  render() {\n    return (\n      <Navigator\n        renderScene={this.renderScene}\n\
  \        configureScene={this.configureScene}\n      />\n    );\n  }\n```\n\n###\
  \ Web 组件与原生组件的区别\n\n我们在 React 和 React-Native 之间遇到的第一个区别是内置组件的差异。\n\n在 Web 上，我们可以使用原生浏览器组件，例如\
  \ `<div />`、`<a />`、`<span />` 等。然而，在原生应用程序中这些元素并不存在。由于我们依赖底层的原生 UI 层来渲染布局，我们不能使用原生的\
  \ Web 元素，而是必须使用 UI 构建器知道如何渲染的元素。幸运的是，React-Native 直接为我们导出了许多底层视图管理器可以理解的视图元素（并且它们也让我们创建自定义元素变得非常简单）。\n\
  \n\n\n\n\n在大多数情况下，这些元素在概念上并没有巨大的区别，因此我们不会深入探讨它们的差异，但我们将查看创建 React Native 应用程序最常用的几个内置组件。\n\
  \n> 以下列出的内置组件是最常用的组件。React-Native 生态系统活跃且参与度高，因此如果你的应用程序需要某个特定的组件，而它尚未被实现到 React\
  \ Native 核心中，它可能已经有人为你构建好了供你使用了。\n\n> 在实现你自己的组件之前，请检查是否已经通过 [`www.npmjs.com/search?q=react-native`](https://www.npmjs.com/search?q=react-native)\
  \ 或 [js.coach/react-native](https://js.coach/react-native) 构建过。\n\n### `<View />`\n\
  \n`<View />` 组件是使用 React Native 构建 UI 最基础的组件。`<View />` 组件直接映射到运行应用程序的当前平台的等等原生组件。它在\
  \ iOS 上映射到 `UIView`，在 Android 上映射到 `android.view`，甚至在网页端（是的）映射到 `<div />`。使用 `<View\
  \ />` 组件的方式就像我们在网页上使用 `<div />` 一样，这是很合理的。\n\n### `<Text />`\n\n`<Text />` 组件用于在\
  \ React Native 应用中显示文本。需要注意的是，我们无法渲染任何*没有*包裹在 `<Text>文本组件</Text>` 中的纯文本。视图层不知道该如何处理它，因此在向视图中添加纯文本时，我们必须显式地使用。\n\
  \n### `<Image />`\n\n当我们想要显示任何类型的图像时使用 `<Image />` 组件，包括网络图像、静态资源、临时本地图像以及本地设备的图像（如相机卷/库）。\n\
  \n### `<TextInput />`\n\n就像在网页上一样，我们可以使用名为 `<TextInput />` 的输入字段从用户那里获取输入。`<TextInput\
  \ />` 组件是我们从设备键盘获取输入的主要方式。它接受的一个特殊 `prop` 是 `onChangeText()` 属性，这是一个函数，每输入框中的文本发生变化时它就会调用该函数。\n\
  \n### `<TouchableHighlight />`, `<TouchableOpacity />`, 和 `<TouchableWithoutFeedback\
  \ />`\n\n当我们在 React Native 中想要监听任何点击事件时，我们需要使用其中一个*touchable（可触摸）*组件。这些*touchable*\
  \ 组件在我们初开始接触 React Native 时往往是一个困惑点，因为在网页上，我们只需要给任何元素添加一个 `onClick()` 属性，它就变成“可点击的”。\n\
  \n然而，在 React Native 中，不仅组件*不是* `onClick()`（而是 `onPress()`），而且 React Native 中的大多数组件并不知道如何处理\
  \ `onPress()` 属性。由于这个原因，我们需要将任何感兴趣的具有 *touchable* 属性的模块封装在这些 touchable 组件之一。\n\n\
  每个不同的 touchable 组件在被触摸时会有略有不同的效果。\n\n*   `<TouchableHighlight />` 组件会降低组件的透明度，从而允许底色（underlay\
  \ color）显示出来。\n*   `<TouchableOpacity />` 降低组件的透明度，但不显示底色。\n*   `<TouchableWithoutFeedback\
  \ />` 在组件被按下时调用该组件，但不会对组件本身提供任何用户反馈。\n\n我们希望尽可能谨慎地使用 `<TouchableWithoutFeedback\
  \ />` 组件，因为我们通常希望在*touchable* 组件被按下时给用户提供反馈。\n\n> #### 谨慎使用 `<TouchableWithoutFeedback\
  \ />`\n> 在多数情况下，我们都希望给用户提供*touchable* 组件已被点击的反馈。这是移动端 Web 浏览器感觉不*原生*的主要要原因之一。\n\n\
  ### `<ActivityIndicator />`\n\nReact Native 的默认加载指示器是 `<ActivityIndicator />` 组件。该组件在多个平台上都可以工作，因为它完全是用\
  \ JavaScript 实现的。使用完全用 JavaScript 编写的组件获得的一个额外好处是，默认样式会根据应用运行的平台进行更新，而无需任何自定义。\n\
  \n### `<WebView />`\n\n`<WebView />` 组件允许我们在 React Native 中显示某些网页内容。\n\n### `<ScrollView\
  \ />`\n\n`<ScrollView />` 组件允许我们沿着视图*滚动*。在网页中，这通常是自动处理的（并且可以在 CSS 中控制/定义）。但在原生应用中，如果我们的内容超屏幕，我们将无法看到它。在原生应用中，当这种情况发生时，用户能够滚动内容。这就是我们使用\
  \ `<ScrollView />` 组件的地方。\n\n如果我们的内容大于屏幕（这意味着我们需要滚动才能看到），我们将把 `<View />` 封装在 `<ScrollView\
  \ />` 组件中。\n\n请记住，`<ScrollView />` 组件对于较短的项目列表效果最好，因为高性能列表对于良好的移动用户体验（UX）至关重要。`<ScrollView\
  \ />` 组件会渲染*所有*元素，无论 `<ScrollView />` 的视图是否显示在屏幕上，都会被渲染。由于由于，React Native 提供了另一种更高效的方法通过\
  \ `<ListView />` 渲染更大的列表。\n\n### `<ListView />`\n\n`<ListView />` 组件是渲染长数据列表的关注性能的选项。与\
  \ `<ScrollView />` 组件不同，`<ListView />` 只渲染当前在屏幕上的元素。一个有趣的说明是，`<ListView />` 在底层使用了\
  \ `<ScrollView />`，但它增加了许多很好的性能抽象供我们利用。\n\n由于高性能列表是构建原生应用的基础，而且 ListView 与我们习惯的网页端有所不同，让我们深入探讨如何使用\
  \ `<ListView />`。\n\n假设我们正在构建一个类似 Twitter 的应用程序，并创建一个 Feed 组件，它接收推文数组并将这些推文渲染到视图中。让我们看看如何在网页上、使用\
  \ `ScrollView`以及使用 `ListView` 来实现。（我们会刻意忽略样式，因为那不是练习的重点）。\n\n我们可能会在网页上这样实现：\n\n\
  ##### Web 版本\n\n```\nimport PropTypes from 'prop-types';\nimport React from 'react';\n\
  \nFeed.propTypes = {\n  tweets: PropTypes.arrayOf(PropTypes.shape({\n    name: PropTypes.string.isRequired,\n\
  \    user_id: PropTypes.string.isRequired,\n    avatar: PropTypes.string.isRequired,\n\
  \    text: PropTypes.string.isRequired,\n    numberOfFavorites: PropTypes.number.isRequired,\n\
  \    numberOfRetweets: PropTypes.number.isRequired,\n  })).isRequired,\n};\n\nfunction\
  \ Feed ({ tweets }) {\n  return (\n    <div>\n      {tweets.map((tweet) => (\n \
  \       <div>\n          <div>\n            <img alt=\"tweet\" src={tweet.avatar}\
  \ />\n            <span>{tweet.name}</span>\n          </div>\n          <p>{tweet.text}</p>\n\
  \          <div>\n            <div>Favs: {tweet.numberOfFavorites}</div>\n     \
  \       <div>RTs: {tweet.numberOfRetweets}</div>\n          </div>\n        </div>\n\
  \      )\n      )}\n    </div>\n  );\n}\n```\n\nsrc/feed.js\n\n我们有一个名为 Feed 的无状态函数组件，它接收一个推文数组，映射到每一个推文，并为每条推文显示一些\
  \ UI。\n\n##### `<ScrollView />` 版本\n\n我们可以使用 `<ScrollView />` 组件来实现*相同*的功能，如下：\n\
  \n\n\n\n```javascript\nimport React, { PropTypes } from 'react';\nimport { View,\
  \ Text, ScrollView, Image } from 'react-native';\n\nFeed.propTypes = {\n  tweets:\
  \ PropTypes.arrayOf(PropTypes.shape({\n    name: PropTypes.string.isRequired,\n\
  \    user_id: PropTypes.string.isRequired,\n    avatar: PropTypes.string.isRequired,\n\
  \    text: PropTypes.string.isRequired,\n    numberOfFavorites: PropTypes.number.isRequired,\n\
  \    numberOfRetweets: PropTypes.number.isRequired,\n  })).isRequired,\n};\n\nfunction\
  \ Feed ({ tweets }) {\n  return (\n    <ScrollView>\n      {tweets.map((tweet) =>\
  \ (\n        <View>\n          <View>\n            <Image src={tweet.avatar} />\n\
  \            <Text>{tweet.name}</Text>\n          </View>\n          <Text>{tweet.text}</Text>\n\
  \          <View>\n            <Text>Favs: {tweet.numberOfFavorites}</Text>\n  \
  \          <Text>RTs: {tweet.numberOfRetweets}</Text>\n          </View>\n     \
  \   </View>\n      )}\n      )}\n    </ScrollView>\n  );\n}\n```\n\n`src/app/twitter-scrollview.js`\n\
  \n注意，这种实现方式与我们在网页端熟悉的写法非常相似。我们只是将特定的 Web 组件替换成了对应的 React Native 组件，但遍历每条推文进行映射（mapping）的实际逻辑是相同的。\n\
  \n现在，让我们来看看如何使用性能更优 `<ListView />` 元素来实现相同的功能：\n\n> 在这里不需要过度纠结细节，因为我们很快就会详细介绍关于使用\
  \ `<ListView />` 组件的所有知识点。我们用这个作为示例，是为了突出我们在实现相同功能时思路上的差异。\n\n```javascript\nimport\
  \ React, { PropTypes, Component } from 'react';\nimport { View, Text, ScrollView,\
  \ Image, ListView } from 'react-native';\n\nclass Feed extends Component {\n  static\
  \ props = {\n    tweets: PropTypes.arrayOf(PropTypes.shape({\n      name: PropTypes.string.isRequired,\n\
  \      user_id: PropTypes.string.isRequired,\n      avatar: PropTypes.string.isRequired,\n\
  \      text: PropTypes.string.isRequired,\n      numberOfFavorites: PropTypes.number.isRequired,\n\
  \      numberOfRetweets: PropTypes.number.isRequired,\n    })).isRequired,\n  }\n\
  \n  constructor(props) {\n    super(props);\n\n    this.ds = new ListView.DataSource({\n\
  \      rowHasChanged: (r1, r2) => r1 !== r2,\n    });\n\n    this.state = {\n  \
  \    dataSource: this.ds.cloneWithRows(this.props.tweets),\n    };\n  }\n\n  componentWillReceiveProps(nextProps)\
  \ {\n    if (nextProps.tweets !== this.props.tweets) {\n      this.setState({\n\
  \        dataSource: this.ds.cloneWithRows(nextProps.tweets),\n      });\n    }\n\
  \  }\n  renderRow = ({ tweet }) => {\n    return (\n      <View>\n        <View>\n\
  \          <Image src={tweet.avatar} />\n          <Text>{tweet.name}</Text>\n \
  \       </View>\n        <Text>{tweet.text}</Text>\n        <View>\n          <Text>Favs:\
  \ {tweet.numberOfFavorites}</Text>\n            <Text>RTs: {tweet.numberOfRetweets}</Text>\n\
  \          </View>\n      </View>\n    );\n  }\n  render() {\n    return (\n   \
  \   <ListView\n        renderRow={this.renderRow} \n        dataSource={this.state.dataSource}\n\
  \      />\n    );\n  }\n}\n```\n\n`src/app/twitter-listview.js`\n\n`<ListView />`\
  \ 的实现大不相同。让我们过一下这些差异。\n\n我们首先看到的是，我们从无状态函数组件切换到了类组件（Class component），这允许我们保留 `state`。因为我们的组件需要跟踪当前在屏幕上渲染的数据，并通过\
  \ `shouldComponentUpdate()` 周期生命钩子监听任何更新数据的请求。\n\n当使用 `<ListView />` 组件时，我们需要两样内容来正确实现一个\
  \ `<ListView />` 组件：\n\n*   `ListView.DataSource` 实例\n*   在组件中定义的 `renderRow()`\
  \ 函数\n\n`ListView.DataSource` 实例显得有点突其来，让我们先来看它。我们会发现，首先是创建一个类型为 `ListView.DataSource`\
  \ 的实例。我们向它传递一个对象，允许我们自定义它底层的工作方式。在这里，我们传递了一个 `rowHasChanged()` 方法，这是一个 `<ListView\
  \ />` 用来判断列表是否需要重新渲染的函数。\n\n```javascript\nthis.ds = new ListView.DataSource({\n\
  \  rowHasChanged: (r1, r2) => r1 !== r2\n});\n```\n\n`src/app/twitter-listview.js`\n\
  \n退后一步考虑一下，如果我们从创建一个高性能列表视图的基本方面来看，让能够轻松检测列表中的某行是否发生了变化，从而避免重新渲染未变化的行，是非常重要的。这是\
  \ `<ListView />` 为我们自动处理的第一项优化。\n\n下一步是实际上为我们的 `ListView.DataSource` 实例提供数据，以便跟踪并展示给用户。这就是\
  \ `ds.cloneWithRows()` 方法的作用之处。`ds.cloneWithRows()` 方法通过创建数据的副本来更新 `ListView.DataSource`\
  \ 实例。\n\n```javascript\nthis.state = {\n  dataSource: this.ds.cloneWithRows(this.props.tweets),\n\
  };\n```\n\n`src/app/twitter-listview.js`\n\n```javascript\ncomponentWillReceiveProps(nextProps)\
  \ {\n  if (nextProps.tweets !== this.props.tweets) {\n    this.setState({\n    \
  \  dataSource: this.ds.cloneWithRows(nextProps.tweets),\n    });\n  }\n}\n```\n\n\
  #### 不变数据\n\n> `dataSource` 所保留的数据是*不可变的*（immutable）。一旦创建，就无法进行修改。\n\n> 在上一个示例中，我们没有保留副本，是因为我们每次收到的都是全新的推文数组。然而，如果这些变化是增量的（添加/删除推文），我们需要保留数据的副本。\n\
  \n现在我们已经在 `dataSource` 实例中有了数据，我们需要实现一个 `renderRow()` 函数。这要直观得多。`renderRow()` 方法会在每一行被调用，并负责为每一行提供要渲染的\
  \ UI 组件。\n\n```javascript\nrenderRow = tweet => {\n  return (\n    <View>\n    \
  \  <View>\n        <Image source={{uri: tweet.avatar}} />\n        <Text>{tweet.name}</Text>\n\
  \      </View>\n      <View>\n        <Text>{tweet.text}</Text>\n        <Text>Favs:\
  \ {tweet.numberOfFavorites}</Text>\n        <Text>RTs: {tweet.numberOfRetweets}</Text>\n\
  \      </View>\n    </View>\n  );\n};\n```\n\n`src/app/twitter-listview.js`\n\n\
  注意，在从 `<ScrollView />` 转换为 `<ListView />` 实现时，我们将数据的 `.map()` 调用从 `render()` 函数中提取出来，移动到\
  \ `renderRow()` 函数中。我们可以对待 `renderRow()` 函数内部的 JSX 就像 `.map()` 函数中的 JSX 一样，因为它会对\
  \ `dataSource` 实例中的每一项进行调用。\n\n`<ListView />` 组件还接受其他一些 props，我们在这里不会对它们进行太详细介绍，但知道它们的存在是有用的。我们将查看\
  \ `renderSeparator()`、`renderHeader()` 和 `renderFooter()`。\n\n这些额外的 `props` 相当直观易懂，但让我们来看看每一个：\n\
  \n##### `renderSeparator()`\n\n\n\n\n\n当 `renderSeparator()` 属性作为 `prop` 传递给 `<ListView\
  \ />` 组件时，它期望是一个函数，该函数负责返回一个组件，该组件将作为 `<ListView />` 中每个项目之间的分隔符进行渲染。\n\n与其在组件样式中添加边框，不如使用\
  \ `renderSeparator()` 属性更加智能，且它不会为最后渲染的一行添加边框。\n\n```\n renderSeparator = (sectionId,\
  \ rowId) => {\n    return <View key={rowId} style={styles.separator} />;\n  };\n\
  \n  render() {\n    return (\n      <ListView\n        renderRow={this.renderRow}\n\
  \        dataSource={this.state.dataSource}\n        renderSeparator={this.renderSeparator}\n\
  \      />\n    );\n  }\n```\n\n`src/app/twitter-listview.js`\n\n### renderHeader()\n\
  \n`renderHeader()` 属性接受一个函数，该函数期望返回一个组件，作为 `<ListView />` 组件的头部。例如，假设我们想在流的顶部添加一个搜索栏来过滤内容。我们可以使用\
  \ `renderHeader()` 方法来实现这一目标。\n\n```\n renderHeader = () => <SearchBar />;\n\n \
  \ render() {\n    return (\n      <ListView\n        renderRow={this.renderRow}\n\
  \        dataSource={this.state.dataSource}\n        renderHeader={this.renderHeader}\n\
  \      />\n    );\n  }\n```\n\n`src/app/twitter-listview.js`\n\n### renderFooter()\n\
  \n`renderFooter()` 属性允许我们为 ListView 添加一个页脚。例如，我们可能想显示一个按钮，允许用户从我们的推文列表中获取更多推文。\n\
  \n```\n renderFooter = () => <ShowMoreTweets />;\n\n  render() {\n    return (\n\
  \      <ListView\n        renderRow={this.renderRow}\n        dataSource={this.state.dataSource}\n\
  \        renderFooter={this.renderFooter}\n      />\n    );\n  }\n```\n\n`src/app/twitter-listview.js`\n\
  \n### Styles\n\nReact Native 中的样式设置不像 Web 端那么直观。React Native 将级联样式表（Cascading StyleSheets，简称\
  \ CSS）的样式思想引入了原生应用世界，我们在那里对组件应用样式声明。正如我们在在本课程中通过 React 工作所看到的，我们可以在 React 组件中通过大多数元素的\
  \ `style` 属性应用 CSS 规则。React Native 的 React Native 元素也遵循这种方法。\n\n在我们深入探讨*如何*为 React\
  \ Native 组件设置样式之前，有一点非常重要：React Native 采用了样式 100% 在 JavaScript 中完成的方法。这意味着每个核心组件都接受一个\
  \ `style` 属性，该属性接受一个包含组件样式的对象（或对象数组）。由于我们在使用 JavaScript，包含 `-` 的属性必须经过稍不同的处理。我们不需要使用\
  \ `background-color` 或 `margin-left`，而是需要使用[驼峰命名](https://en.wikipedia.org/wiki/Camel_case)\
  \ 样式属性名。\n\n例如，如果我们想为组件添加背景颜色样式，可以添加：\n\n```\n < View style={{ backgroundColor:\
  \ 'green', padding: 10 }}>\n    <Text style={{ color: 'blue', fontSize: 25 }}>\n\
  \      Hello world\n    </Text>\n  </View>\n```\n\n`src/app/styledViews.js`\n\n\
  React Native 引入的一个优秀特性是 Web 版 React 所没有的，那就是可以向 `style` 属性传递数组（无需单独的库），React Native\
  \ 将将其合并为一个单一样式。\n\n```\nconst ContainerComponent = () => {\n  const getBackgroundColor\
  \ = () => {\n    return { backgroundColor: 'red' };\n  };\n\n  return (\n    <View\
  \ style={[ getBackgroundColor(), { padding: 10 } ]}>\n      <Text style={{ color:\
  \ 'blue', fontSize: 25 }}>\n        Hello world\n      </Text>\n    </View>\n  );\n\
  };\n```\n\n`src/app/styledViews.js`\n\n目前这还非常简单。但如果我们对一个组件有超过 2-3 个样式属性怎么办？React\
  \ Native 专门为这种情况导出了一个辅助工具，名为 `StyleSheet`。`StyleSheet` 导出允许我们像在 Web 端 CSS 样式表中那样创建一个抽象。\n\
  \n### StyleSheet\n\n`StyleSheet` 对象有一个 `create()` 方法，该方法接受一个包含我们样式列表的对象。然后我们可以使用\
  \ `create()` 方法返回的 `styles` 对象，而不是原始样式对象。\n\n```\nconst styles = StyleSheet.create({\n\
  \  container: {\n    padding: 10,\n  },\n  containerText: {\n    color: 'blue',\n\
  \    fontSize: 20,\n  },\n});\n\nclass ExampleComponent extends Component {\n  getBackgroundColor()\
  \ {\n    return {\n      backgroundColor: 'yellow'\n    };\n  }\n\n  render() {\n\
  \    return (\n      <View style={[ \n        this.getBackgroundColor(),\n     \
  \   styles.container \n      ]}>\n        <Text style={styles.containerText}>\n\
  \          Hello world\n        </Text>\n      </View>\n    );\n  }\n}\n```\n\n\
  `src/app/styledViews.js`\n\n使用 `StyleSheet` 方法带来了一些好处。其中之一是我们的组件更具可读性。重要的是，`StyleSheet`\
  \ 为我们提供了一些直接应用样式时无法获得的性能提升。现在我们已经了解了如何应用样式，让我们进入 Flexbox 的架构。\n\n### Flexbox\n\n\
  Flexbox 作为一种技术，允许我们沿着主轴和交叉轴对元素进行对齐、定位、拉伸、分布、居中和换行。理解 Flexbox 最重要的概念它是基于不同的轴的。我们有一个*主轴*（main\
  \ axis）和一个*交叉轴*（cross axis）。\n\n(images/react-native----axes.png)\n\n默认情况下，React\
  \ Native 的*主轴*是垂直的，而*交叉轴*是水平的。从现在开始的一切都建立在轴的概念之上。当我们说“将所有子元素沿着*主轴*对齐”时，意味着默认情况下父元素的子元素是从上到下垂直排列的。当我们说这会对齐*交叉轴*上的所有元素时，意味着默认情况下子元素是从左到右水平排列的。\n\
  \n### flex-direction\n\n我们在谈论主轴和交叉轴时，特意强调了*默认行为*。这是因为我们实际上可以更改哪一个是主轴，哪一个是交叉轴。我们可以使用\
  \ `flex-direction`（在 React Native 中为 `flexDirection`）属性来指定该属性。\n\n它可以接受两个值之一：\n\n\
  -   `column`\n\n-   `row`\n\n默认情况下，React Native 设置所有元素具有 `flexDirection: column`\
  \ 属性。这意味着该元素的主轴是垂直的，而它的交叉轴是水平的。然而，如果我们定义 `flexDirection: row` 为 *row*，轴就会交换位置。主轴变为水平的，而交叉轴变为垂直的。\n\
  \n(images/react-native----flex-direction-row.png)\n\n\n\n\n理解 `main` 轴和 `cross`\
  \ 轴的概念至关重要，因为我们的 `entire layout` 取决于这些不同的设置。\n\n让我们深入研究一些可以用于沿这些轴线对齐子元素的不同属性。\n\n\
  首先关注 `main` 轴，为了指定子元素如何沿主轴进行对齐，我们可以使用 `justifyContent` 属性。\n\n`justifyContent` 属性可以接受五种不同值之一，用于更改子元素沿主轴的对齐方式：\n\
  \n*   `flex-start`\n*   `center`\n*   `flex-end`\n*   `space-around`\n*   `space-between`\n\
  \n让我们逐一了解这些值的含义。\n\n在接下来的示例中，我们将使用以下代码来演示 flexbox 如何布局子元素。\n\n```\nimport React,\
  \ { Component } from 'react';\nimport { StyleSheet, Text, View } from 'react-native';\n\
  \nexport class FlexboxExamples extends Component {\n  render() {\n    return (\n\
  \      <View style={ styles.container }>\n        <View style={ styles.box } />\n\
  \        <View style={ styles.box } />\n        <View style={ styles.box } />\n\
  \      </View>\n    );\n  }\n}\n\nconst styles = StyleSheet.create({\n  container:\
  \ {\n    flex: 1,\n  },\n  box: {\n    height: 50,\n    width: 50,\n    backgroundColor:\
  \ '#e76e63',\n    margin: 10,\n  },\n});\n\nexport default FlexboxExamples;\n```\n\
  \n`src/app/styledViews.js`\n\n> 如果你正在创建自己的示例并替换 `index.[platform].js` 文件，请添加以下代码以确保应用在\
  \ React native 中被 `registered` 为应用：\n\n> ```\nimport { AppRegistry } from 'react-native';\
  \ // 在文件顶部\n// ...\n// 在文件末尾\nAppRegistry.registerComponent('FlexboxExamples', ()\
  \ => FlexboxExamples);\n```\n\n在这段代码中，我们对每个示例唯一更改的是 `styles` 对象中的 `container` 键。我们可以暂时忽略\
  \ `flex: 1;`（我们稍后会回到这里）。\n\n使用上述代码，我们拥有一个沿垂直主轴对齐内容的应用，添加键 `justifyContent: 'flex-start'`\
  \ 会导致应用中的每个子元素都靠近主轴的起点：\n\n![justifyContent: 'flex-start'](img/react-native----flexbox-js-flex-start.png)\n\
  \njustifyContent: ‘flex-start’\n\n```\ncontainer: {\n  flex: 1;\n  justifyContent:\
  \ 'flex-start';\n}\n```\n\n`flexDirection` 的默认值为 `column`，因此当我们没有为 flex 方向指定值时，它被设置为\
  \ `column`。由于 `justifyContent` 针对的是 `main` 轴，我们的子元素向主轴的起点对齐（即左上角），并向下移动。\n\n当我们将值设置为\
  \ `justifyContent: 'center'` 时，子元素将向主轴的中心对齐：\n\n![justifyContent: 'flex-center'](img/react-native----flexbox-jc-center.png)\n\
  \njustifyContent: ‘flex-center’\n\n```\ncontainer: {\n  flex: 1;\n  justifyContent:\
  \ 'center';\n}\n```\n\n当我们将 `justifyContent` 值设置为 `flex-end` 时，子元素将向主轴的终点对齐：\n\n\
  ![justifyContent: 'flex-end'](img/react-native----flexbox-jc-flex-end.png)\n\njustifyContent:\
  \ ‘flex-end’\n\n```\ncontainer: {\n  flex: 1;\n  justifyContent: 'flex-end';\n}\n\
  ```\n\n我们还可以将 `justifyContent` 设置为 `space-between`，这将对齐每个子元素，使得每个子项目之间沿主轴的空间是均匀的：\n\
  \n![justifyContent: 'space-between'](img/react-native----flexbox-jc-space-between.png)\n\
  \njustifyContent: ‘space-between’\n\n```\ncontainer: {\n  flex: 1;\n  justifyContent:\
  \ 'space-between';\n}\n```\n\n最后，我们可以将 `justifyContent` 值设置为 `space-around`，这会对齐每个子元素，使得主轴上每个元素\
  \ `around`（周围）都有均匀的空间：\n\n![justifyContent: 'space-around'](img/react-native----flexbox-jc-space-around.png)\n\
  \njustifyContent: ‘space-around’\n\n```\ncontainer: {\n  flex: 1;\n  justifyContent:\
  \ 'space-around';\n}\n```\n\n如果我们将容器的 `flexDirection` 值从 `column` 改为 `row`，会发生什么？\n\
  \n`main` 轴切换到 `horizontal`（水平）轴，所有的子元素仍然将沿 `main axis` 对齐，但现在是水平轴而不是 `vertical`（垂直）轴。\n\
  \n![flexDirection: 'row'](img/react-native----flexbox-fd-row.png)\n\nflexDirection:\
  \ ‘row’\n\n```\ncontainer: {\n  flex: 1;\n  flexDirection: 'row',\n  justifyContent:\
  \ 'space-around';\n}\n```\n\n注意，我们所做的只是更改了 `flexDirection` 值和 `justifyContent` 值。\n\
  \n\n\n稍微拆解一下，由于我们的 `flexDirection: row` 设置为 `row`，现在主轴是水平运行的。这意味着 `alignItems` 将沿着垂直轴（新的*交叉轴*cross\
  \ 轴）对齐子元素。由于我们移除了子元素的高度并将 `alignItems` 设置为 `stretch`，元素现在将沿垂直轴拉伸，占据父组件整个交叉轴视图的长度。对于这个示例来说，这就是整个视图。\n\
  \n到目前为止，我们一直在与单个 *flex 容器*或父元素一起工作。如果我们创建嵌套的 *flex 容器*，*相同的逻辑*也适用于嵌套容器的子元素（flex\
  \ 项目）。它们将不再相对于整个视图进行定位（如我们之前的示例中那样），而是根据嵌套的父组件来为自己定位。我们的*整个 UI 将基于嵌套的 flex 容器来构建*。\n\
  \n### 其他动态布局\n\n在 flexbox 中，不存在基于百分比的样式。虽然这*可以*让事情变得稍微复杂，但使用 flexbox 布局我们的 UI 是非常强大的，因为无论屏幕大小如何，我们的布局都会像我们想要的那样。\n\
  \n回想我们之前的示例，我们将 `flex: 1` 的值设置为 1 吗？`flex` 属性允许我们为 flex 容器指定*相对*宽度。\n\n正如我们反复看到的，Flexbox\
  \ 关注点在于将控制权交给父元素，由其处理它的子元素的布局。`flex` 属性稍有不同，它允许子元素相对于其兄弟元素来指定它们的高度或宽度。解释 flex 的最好方法是看一些示例，\n\
  \n让我们从一个这样的视图开始：\n\n![](img/react-native----flexbox-flex-default.png)\n\n这是使用以下样式实现的：\n\
  \n```\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    flexDirection:\
  \ 'row',\n    justifyContent: 'center',\n    alignItems: 'center',\n  },\n  box:\
  \ {\n    backgroundColor: '#e76e63',\n    margin: 10,\n    width: 50,\n    height:\
  \ 50,\n  },\n});\n```\n\n`/src/app/styledViews.js`\n\n如果我们想要 UI 有两个较小的框围绕着一个较大的框，如下所示：\n\
  \n![](img/react-native----flexbox-flex-1.png)\n\n我们可以使用*完全相同*的布局，但现在中间部分的宽度是周围两个部分的两倍。`flex`\
  \ 属性允许我们动态地设置这一点。\n\n```\nimport React, { Component } from 'react';\nimport { StyleSheet,\
  \ View } from 'react-native';\n\nconst styles = StyleSheet.create({\n  container:\
  \ {\n    flex: 1,\n    flexDirection: 'row',\n    justifyContent: 'center',\n  \
  \  alignItems: 'center',\n  },\n  box: {\n    backgroundColor: '#e76e63',\n    margin:\
  \ 10,\n    width: 50,\n    height: 50,\n  },\n});\n\nexport class FlexboxLayouts\
  \ extends Component {\n  render() {\n    return (\n      <View style={[ styles.container\
  \ ]}>\n        <View style={[ styles.box, { flex: 1 } ]} />\n        <View style={[\
  \ styles.box, { flex: 2 } ]} />\n        <View style={[ styles.box, { flex: 1 }\
  \ ]} />\n      </View>\n    );\n  }\n}\n\nexport default FlexboxLayouts;\n```\n\n\
  `/src/app/styledViews.js`\n\n注意，我们没有向样式中添加内容，只是将中间兄弟元素的 `flex` 属性设置为 `flex: 2`，而其他兄弟元素为\
  \ `flex: 1`。\n\n我们可以这样理解这个 flexbox 布局就像是在说：“确保中间兄弟元素在主轴上的尺寸是第一个和第三个元素的两倍。”这就是为什么\
  \ `flex` 可以取代基于百分比的布局。在基于百分比的布局中，通常是特定元素相对于其他元素的尺寸，而这正是我们上面所做的。\n\n需要注意的是，如果我们在元素上放置\
  \ `flex: 1`，该元素将尝试占据与其父元素等大的空间。在上面的大多数示例中，我们希望“布局区域”的大小等于父元素，在我们的初始示例中，它是整个视口。\n\
  \n让我们进一步深入探讨。\n\n如果我们想要这样的布局：\n\n![](img/react-native----flexbox-flex-2.png)\n\n\
  就像第一个和第三个元素在垂直和水平方向上居中，但第二个元素完全对齐在底部。\n\n用 flexbox 术语来分解此布局，基本上是第一个和第三个元素在主轴上对齐（均为\
  \ `center`），而第二个元素在垂直的交叉轴上使用 `flex-end`。为了实现这种设计，我们需要一种方法让子元素覆盖其来自父元素的特定定位。\n\n\
  好消息！我们有 `align-self`（在 React Native 中为 `alignSelf`）属性，它允许子元素直接指定自己的对齐方式。`alignSelf`\
  \ 属性在*交叉轴*上定位，并具有与 `alignItems`*相同的*选项（这很合理，因为是子元素告诉父元素应该如何设置单个元素的 `alignItems`\
  \ 属性）。\n\n\n\n\n`flex-grow`, `flex-shrink`, `flex-basis`\n\n这是 Web flexbox 中可用的三个属性，允许元素伸缩或收缩\
  \ flex 项目。React Native 有一个名为 `flex` 的类似属性，但并没有 CSS 中存在的这完全三个元素。值得注意的是，React Native\
  \ 中的 `flex` 属性工作方式与 Web 端不同。\n\nReact Native 中的 `flex` 是一个数字而不是字符串，用于使特定组件比其兄弟组件更大或更小。`flex`\
  \ 设置为 `2` 的组件占据的空间是 `flex` 设置为 `1` 的组件的两倍（取决于其主轴是垂直还是水平方向）。如果 `flex` 设置为 `0`，该组件将根据其宽度和高度进行尺寸。这引出了我们的下一个“排除”项，即\
  \ `px` 以外的任何尺寸单位。\n\n为了实现基于百分比的布局，我们必须像上一节讨论的那样使用 `flex`。\n\n尽管我们没有直接谈过它们，但 React\
  \ Native 允许我们使用在 CSS 中已经熟悉的属性，如 `position`、`zIndex`、`minWidth` 等。React Native 支持的所有可用属性的完整列表可以在\
  \ [https://facebook.github.io/react-native/docs/layout-props.html] 找到。\n\n### HTTP\
  \ 请求\n\n在构建 React Native 应用时，如果不进行 HTTP 请求并从外部 API 获取数据，我们的进展将非常有限。React Native\
  \ 包含一个抽象，可以使用 `fetch` API 来发送 HTTP 请求。[fetch](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)\
  \ API 提供了一个获取资源的接口，对于用过 `XMLHttpRequest` 或其他客户端（如 [axios](https://www.npmjs.com/package/axios)\
  \ 和 [superagent](https://github.com/visionmedia/superagent)）的人来说，这看起来非常熟悉。\n\n`fetch`\
  \ API 使用 Promise（承诺），所以在在 React Native 中中使用 `fetch` API 之前，让我们先绕路谈谈 Promises。\n\n\
  ### 什么是 promise\n\n根据 Mozilla 的定义，`Promise` 对象用于处理异步计算，它具有一些重要的保证，这些保证用回调方法（处理异步代码的旧方法）很难处理。\n\
  \n`Promise` 对象简单来说是对值的封装，该值在对象实例化时可能已知，也可能未知，并提供了一个方法在值*已知*（也称为 `resolved`）或因失败原因不可用（我们将其称为\
  \ `rejected`）之后来处理该值。\n\n使用 `Promise` 对象让我们有机会为异步操作的最终成功或失败（无论什么原因）关联功能。它还允许我们通过类似同步的代码来处理这些复杂的场景。\n\
  \n例如，考虑以下同步代码，我们在 JavaScript 控制台中打印出当前时间：\n\n```\nvar currentTime = new Date();\n\
  console.log('The current time is: ' + currentTime);\n```\n\n这非常直观并且可以正常工作，因为 `new\
  \ Date()` 对象代表浏览器所知的时间。现在考虑我们正在另一台远程机器上使用一个不同的时钟。例如，如果我们正在做一个跨年钟，如果能够使用单一的时间值将用户的浏览器与所有其他人同步，那就太棒了，这样没有人会错过掉球仪式。\n\
  \n假设我们有一个处理获取时钟当前时间的方法，称为 `getCurrentTime()`，它从远程服务器获取当前时间。我们现在用返回时间的 `setTimeout()`\
  \ 来表示它（就像向一个缓慢的 API 发起请求）：\n\n```\nfunction getCurrentTime() {\n  // 从 API 获取当前的“全局”时间\n\
  \  return setTimeout(function() {\n    return new Date();\n  }, 2000);\n}\nvar currentTime\
  \ = getCurrentTime()\nconsole.log('The current time is: ' + currentTime);\n```\n\
  \n我们的 `console.log()`日志值将返回超时处理程序的 ID，这显然不是当前时间。传统上，我们可以使用回调来更新代码，在时间可用时调用它：\n\n\
  ```\nfunction getCurrentTime(callback) {\n  // 从 API 获取当前的“全局”时间\n  return setTimeout(function()\
  \ {\n    var currentTime = new Date();\n    callback(currentTime);\n  }, 2000);\n\
  }\ngetCurrentTime(function(currentTime) {\n  console.log('The current time is: '\
  \ + currentTime);\n});\n```\n\n如果其他部分发生错误怎么办？我们如何捕获错误并定义重试或错误状态？\n\n```\nfunction\
  \ getCurrentTime(onSuccess, onFail) {\n  // 从 API 获取当前的“全局”时间\n  return setTimeout(function()\
  \ {\n    // 随机决定是否获取到日期\n    var didSucceed = Math.random() >= 0.5;\n    if (didSucceed)\
  \ {\n      var currentTime = new Date();\n      onSuccess(currentTime);\n    } else\
  \ {\n      onFail('Unknown error');\n    }\n  }, 2000);\n}\ngetCurrentTime(function(currentTime)\
  \ {\n  console.log('The current time is: ' + currentTime);\n}, function(error) {\n\
  \  console.log('There was an error fetching the time');\n});\n```\n\n现在，如果我们要根据第一个请求的值来发起请求呢？作为一个短示例，让我们再次在内部重用\
  \ `getCurrentTime()` 函数（假设它是第二个方法，但它允许我们避免添加另一个复杂的函数）：\n\n```\nfunction getCurrentTime(onSuccess,\
  \ onFail) {\n  // 从 API 获取当前的“全局”时间\n  return setTimeout(function() {\n    // 随机决定是否获取日期或否\n\
  \    var didSucceed = Math.random() >= 0.5;\n    if (didSucceed) {\n      var currentTime\
  \ = new Date();\n      onSuccess(currentTime);\n    } else {\n      onFail('Unknown\
  \ error');\n    }\n  }, 2000);\n}\ngetCurrentTime(function(currentTime) {\n  console.log('The\
  \ current time is: ' + currentTime);\n}, function(error) {\n  console.log('There\
  \ was an error fetching the time');\n});\n```\n\n以这种方式处理异步会很快变得复杂。此外，我们可能从之前的调用获取值，处理应用启动时不可用的值有很多棘手的情况。\n\
  \n#### 引入 Promises\n\n另一方面，使用 Promise 我们避免这种复杂性（尽管不是万能药）。之前的代码（可能是面条代码）可以转换为更整洁、更像同步的版本：\n\
  \n```\nfunction getCurrentTime(onSuccess, onFail) {\n  // 使用 Promise 从 API 获取当前的“全局”时间\n\
  \  return new Promise((resolve, reject) => {\n    setTimeout(function() {\n    \
  \  var didSucceed = Math.random() >= 0.5;\n      didSucceed ? resolve(new Date())\
  \ : reject('Error');\n    }, 2000);\n  })\n}\ngetCurrentTime()\n  .then(currentTime\
  \ => getCurrentTime())\n  .then(currentTime => {\n    console.log('The current time\
  \ is: ' + currentTime);\n    return true;\n  })\n  .catch(err => console.log('There\
  \ was an error:' + err))\n```\n\n之前的源码示例更清晰，清楚了发生了什么，并避免了许多棘手的错误处理/捕获。\n\n为了捕获成功时的值，我们将使用\
  \ `Promise` 实例对象上的 `then()` 函数。`then()` 函数将根据 本身的返回值进行调用。例如，在上面的示例中，`getCurrentTime()`\
  \ 函数解析 `currentTime()` 值（在成功完成后），并调用返回值（另一个 Promise）的 `then()` 函数，以此此类推。\n\n要捕获链中任何位置发生的错误，我们可以使用\
  \ `catch()` 方法。\n\n\n\n\n在上面的示例中，我们使用了 promise 链（promise chain）来创建一个按顺序调用的动作链。promise\
  \ 链听起来很复杂，但从根本上来说很简单。本质上，我们可以“同步”连续对多个异步操作的操作。每次对 `then()` 的调用都会接收到上一个 `then()`\
  \ 函数的返回值。\n\n例如，如果我们想操作 `getCurrentTime()` 调用的值，可以在链中添加一个链接，如下所示：\n\n```javascript\n\
  getCurrentTime()\n  .then(currentTime => getCurrentTime())\n  .then(currentTime\
  \ => {\n    return 'It is now: ' + currentTime;\n  })\n  // 这会记录: \"It is now: [current\
  \ time]\"\n  .then(currentTimeMessage => console.log(currentTimeMessage))\n  .catch(err\
  \ => console.log('There was an error:' + err))\n```\n\n### 单次使用保证\n\npromise 在任何给定时刻只处于三种状态之一：\n\
  \n* `pending`（待定）\n* `fulfilled`（已完成）\n* `rejected`（已拒绝）\n\n一个 `pending` 状态的 promise\
  \ 只能*且仅一次*转变为 fulfilled 状态或 rejected 状态，这可以避免一些复杂的错误场景。这意味着我们只能返回一次 promise。如果我们想重新运行一个使用\
  \ promise 的函数，我们需要创建一个 `new` 的 promise。\n\n### 创建 promise\n\n我们可以使用 `Promise` 构造函数来创建新的\
  \ promise（如上面的示例所示）。它接受一个带有两个参数的函数：\n\n* `onSuccess`（或 `resolve`）函数，在成功解析时被调用\n\
  * `onFail`（或 `reject`）函数，在失败被拒绝时被调用\n\n回想我们上面的函数，我们可以看到，如果请求成功，我们会调用 `resolve()`\
  \ 函数；如果方法返回错误条件，我们会调用 `reject()` 函数。\n\n```javascript\nvar promise = new Promise(function(resolve,\
  \ reject) {\n  // 如果方法成功则调用 resolve\n  resolve(true);\n})\npromise.then(bool =>\
  \ console.log('Bool is true'))\n```\n\n现在我们已经熟悉了 promise，让我们在 React Native 应用中使用它它吧。发送\
  \ HTTP 请求的最简单 GET 实现是 `fetch` 方法，它接受 URL 作为第一个参数，并返回一个 promise，该 promise 在解析后后包含响应对象。\n\
  \n例如，假设我们有一个 `getGithubUsers()` 函数，我们想要通过 API 调用从 github 获取一些用户。这个 `fetch` 调用可以这样实现：\n\
  \n```javascript\nconst baseUrl = 'https://api.github.com';\n\nexport const getGithubUsers\
  \ = ({ offset }) => {\n  return fetch(`${baseUrl}/users?since=${offset}`)\n    \
  \      .then(response => response.json())\n          .catch(console.warn);\n};\n\
  ```\n\n`src/app/styledViews.js`\n\n当然，`fetch` 不仅用于 GET 请求。我们可以通过传递一个包含更多详细信息的第二个参数来为请求指定更详细的内容。\n\
  \n例如，假设我们想使用 github API 在 github 上创建一个 `gist`。我们可以通过使用带有第二个参数的 `fetch` API 轻松地处理这一点。我们可以这样实现：\n\
  \n```javascript\nexport const makeGist = (\n  activity, \n  { description = '',\
  \ isPublic = true } = {}\n  ) => fetch(`${baseUrl}/gists`, {\n    method: 'POST',\n\
  \    body: JSON.stringify({\n      files: {\n        'activity.json': {\n      \
  \    content: JSON.stringify(activity),\n        },\n      },\n      description,\n\
  \      public: isPublic,\n    }),\n  })\n  .then(response => response.json());\n\
  ```\n\n`src/app/styledViews.js`\n\n`fetch` API 有许多可能性，并可以在 React Native 的实现跨平台使用。有关该\
  \ API 的更多详细信息，请查看 MDN 上的文档：[`developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch`](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch)。\n\
  \n### 使用 React Native 进行调试\n\n编写 React Native 应用带来的最棒特性之一就是调试体验。React Native 团队的一个主要目标是将我们在\
  \ Web 开发中习惯的工作流引入原生开发。\n\n当我们在模拟器上运行应用时，可以通过按下组合键打开对应平台的调试菜单：\n\n* iOS: `Cmd + D`（或\
  \ PC 上的 `CTRL + D`）\n* Android: `Cmd + M`（或 PC 上的 `CTRL + M`）\n\n如果有效，将弹出应用内开发者菜单：\n\
  \n![](img/react-native----debugger.png)\n\n从这个菜单中，我们有一系列不同的调试选项。我们将直接用的是标签为 `Debug\
  \ JS Remotely` 的菜单项。点击此菜单项将在 [Chrome](https://google.com/chrome) 中弹出一个窗口。\n\n如果我们打开的页面上打开开发者控制台，我们会发现实际上可以使用\
  \ Chrome 开发者工具来调试原生应用！\n\n![](img/react-native----devtools.png)\n\n### 接下来去哪里\n\n\
  React Native 社区活跃并且不断成长。\n\nReact Native 聚会的次数在不断增加，我们强烈建议大家查看它们。\n\n## 附录 A：`PropTypes`\n\
  \n`PropTypes` 是验证传递到组件的值的方法。要使用 `PropTypes`，请安装该包：\n\n```bash\n$ npm i --save prop-types\n\
  ```\n\n然后在需要的文件中导入库：\n\n```javascript\nimport PropTypes from 'prop-types';\n```\n\
  \n我们通过将 `PropTypes` 作为静态属性传递到组件上来定义它们。\n\n```javascript\nclass Component extends\
  \ React.Component {\n  static propTypes = {\n    name: PropTypes.string\n  }\n \
  \ // ...\n  render() {\n    return <div>{this.props.name}</div>;\n  }\n}\n```\n\
  `src/appendix/proptypes/Component.js`\n\n我们也可以在类定义之后将 `propTypes` 设置为静态属性。\n\n```javascript\n\
  class Component extends React.Component {\n  // ...\n  render() {\n    return <div>{this.props.name}</div>;\n\
  \  }\n}\nComponent.propTypes = {\n  name: PropTypes.string\n}\n```\n`src/appendix/proptypes/Component.js`\n\
  \n`propTypes` 对象的 `key` 定义了我们要验证的 prop 名称，而值则是由 `PropTypes` 对象定义的类型（我们在下文中会讨论）或通过自定义函数定义的自定义类型。\n\
  \n`PropTypes` 对象导出了许多验证器，涵盖了我们遇到的大多数情况。对于不常见的情况，React 也允许我们定义自己的 `PropType` 验证器。\n\
  \n### 验证器\n\n`PropTypes` 对象包含常见的验证器列表（但我们也可以定义自己的。稍后会介绍）。\n\n当传入无效类型的 `prop` 或未通过\
  \ prop 类型检查时，会将警告传递到 JavaScript 控制台。这些警告*仅*会在开发模式下显示，因此如果我们不小心以不当的方式将应用部署到生产环境，用户将看不到这些警告。\n\
  \n内置验证器有：\n\n* `string`\n* `number`\n* `boolean`\n* `function`\n* `object`\n* `shape`\n\
  * `oneOf`\n\n\n\n\n\n- `instanceOf` (`#chap21.xhtml_prop_type_instance_of)\n- `array`\
  \ (`#chap21.xhtml_prop_type_array)\n- `arrayOf` (`#chap21.xhtml_prop_type_array_of_type)\n\
  - `node` (`#chap21.xhtml_prop_type_node)\n- `element` (`#chap21.xhtml_prop_type_element)\n\
  - `any` (`#chap21.xhtml_prop_type_any)\n- `required` (`#chap21.xhtml_prop_type_required)\n\
  \n### string\n\n要将一个 prop 定义为字符串，我们可以使用 `PropTypes.string`。\n\n```javascript\nclass\
  \ Component extends React.Component {\n  static propTypes = {\n    name: PropTypes.string\n\
  \  }\n  // ...\n  render() {\n    return (<div>{this.props.name}</div>)\n  }\n}\n\
  ```\n\n`code/appendix/proptypes/string.js`\n\n要传递字符串作为 prop，我们可以直接将字符串本身作为属性，或者使用\
  \ `{}` 大括号来定义字符串变量。它们在功能上是等等的：\n\n```javascript\n<Component name={\"Ari\"} />\n\
  <Component name=\"Ari\" />\n```\n\n### number\n\n要指定一个 prop 应该是数字，我们可以使用 `PropTypes.number`。\n\
  \n```javascript\nclass Component extends React.Component {\n  static propTypes =\
  \ {\n    totalCount: PropTypes.number\n  }\n  // ...\n  render() {\n    return (<div>{this.props.totalCount}</div>)\n\
  \  }\n}\n```\n\n`code/appendix/proptypes/number.js`\n\n传递数字时，我们必须将其作为 JavaScript\
  \ 值或使用大括号传递变量的值：\n\n```javascript\nvar x = 20;\n\n<Component totalCount={20} />\n\
  <Component totalCount={x} />\n```\n\n### boolean\n\n要指定一个 prop 应该是布尔值（true 或 false），我们可以使用\
  \ `PropTypes.bool`。\n\n```javascript\nclass Component extends React.Component {\n\
  \  static propTypes = {\n    on: PropTypes.bool\n  }\n  // ...\n  render() {\n \
  \   return (\n      <div>\n        {this.props.on ? 'On' : 'Off'}\n      </div>\n\
  \    )\n  }\n}\n```\n\n`code/appendix/proptypes/bool.js`\n\n在 JSX 表达式中使用布尔值，我们可以将其作为\
  \ JavaScript 值传递。\n\n```javascript\nvar isOn = true;\n\n<Component on={true} />\n\
  <Component on={false} />\n<Component on={isOn} />\n```\n\n### function\n\n我们也可以传递函数作为\
  \ `prop`。要将一个 prop 定义为函数，我们可以使用 `PropTypes.func`。通常在编写一个 `Form` 组件时，我们会传递一个函数作为\
  \ prop，以便在表单提交时调用它（例如 `onSubmit()`）。在组件上将某个 prop 定义为必选函数是常见做法。\n\n```javascript\n\
  class Component extends React.Component {\n  static propTypes = {\n    onPress:\
  \ PropTypes.func\n  }\n  // ...\n  render() {\n    return (\n      <div onClick={this.props.onPress}>\n\
  \        Press me\n      </div>\n    )\n  }\n}\n```\n\n`code/appendix/proptypes/func.js`\n\
  \n我们可以通过 JavaScript 表达式语法传递函数作为 prop，如下所示：\n\n```javascript\nconst x = function(name)\
  \ {};\nconst fn = value => alert(\"Value: \" + value);\n\n<Component onComplete={x}\
  \ />\n<Component onComplete={fn} />\n```\n\n### object\n\n我们可以通过 `PropTypes.object`\
  \ 要求一个 prop 应该是 JavaScript 对象：\n\n```javascript\nclass Component extends React.Component\
  \ {\n  static propTypes = {\n    user: PropTypes.object\n  }\n  // ...\n  render()\
  \ {\n    const { user } = this.props\n    return (\n      <div>\n        <h1>{user.name}</h1>\n\
  \        <h5>{user.profile}</h5>\n      </div>\n    )\n  }\n}\n```\n\n`code/appendix/proptypes/object.js`\n\
  \n传递对象作为 prop 时，我们需要使用 JavaScript 表达式 `{}` 语法：\n\n```javascript\nconst user = {\n\
  \  name: 'Ari'\n}\n\n<Component user={user} />\n<Component user={{name: 'Anthony'}}\
  \ />\n```\n\n### object shape\n\nReact 允许我们通过 `PropTypes.shape()` 定义我们期望接收的对象的形状。`PropTypes.shape()`\
  \ 函数接收一个包含键值对列表的对象，该列表规定了对象预期拥有的键以及这些值的类型：\n\n```javascript\nclass Component extends\
  \ React.Component {\n  static propTypes = {\n    user: PropTypes.shape({\n     \
  \ name: PropTypes.string,\n      profile: PropTypes.string\n    })\n  }\n  // ...\n\
  \  render() {\n    const { user } = this.props\n    return (\n      <div>\n    \
  \    <h1>{user.name}</h1>\n        <h5>{user.profile}</h5>\n      </div>\n    )\n\
  \  }\n}\n```\n\n`code/appendix/proptypes/objectOfShape.js`\n\n### multiple types\n\
  \n有时我们无法预先知道某个 prop 会是什么类型，但我们可以接受其中一种类型。React 给了我们一种或多种类型选择。`oneOf` 告诉该 prop 可以是值中的之一。`oneOfType`\
  \ 告诉该 prop 可以是类型中的之一。`arrayOf` 告诉数组的每个成员都应该是特定类型。\n\n```javascript\nclass Component\
  \ extends React.Component {\n  static propTypes = {\n    user: PropTypes.shape({\n\
  \      name: PropTypes.string,\n      profile: PropTypes.string\n    })\n  }\n \
  \ // ...\n  render() {\n    const { user } = this.props\n    return (\n      <div>\n\
  \        <h1>{user.name}</h1>\n        <h5>{user.profile}</h5>\n      </div>\n \
  \   )\n  }\n}\n```\n\n\n\n\n\n```javascript\nconst icon = <FontAwesomeIcon name=\"\
  user\" />\n\n<Component icon={icon} />\n<Component icon={\"fa fa-cog\"} />\n```\n\
  \n### element (元素)\n\nReact 的灵活性允许我们通过使用 `PropTypes.element` 将另一个 React 元素作为 prop\
  \ 传递。\n\n我们可以构建组件，使其接口允许用户指定一个自定义组件。例如，我们可能有一个 `<List />` 组件，它的职责是输出元素列表。如果没有自定义组件，我们必须为想要渲染的每种类型的列表构建一个单独的\
  \ `<List />` React 组件（取决于元素的行为，这可能是恰当）。通过传递组件类型，我们可以复用 `<List />` 组件。\n\n例如，一个列表组件可能看起来这样：\n\
  \n```javascript\nclass Component extends React.Component {\n  static propTypes =\
  \ {\n    listComponent: PropTypes.element,\n    list: PropTypes.array\n  }\n  //\
  \ ...\n  render() {\n    const { list } = this.props\n    return (\n      <ul>\n\
  \        {list.map(this.renderListItem)}\n      </ul>\n    )\n  }\n}\n```\n\n`code/appendix/proptypes/element.js`\n\
  \n我们可以在指定或不指定自定义组件的情况下使用此此列表组件：\n\n```javascript\nconst Item = function(props) {\n\
  \  return (\n    <div>{props.children}</div>\n  )\n}\n```\n\n`code/appendix/proptypes/element.js`\n\
  \n```javascript\n<List list={[1, 2, 3]} />\n<List list={[1, 2, 3]} listComponent={Item}\
  \ />\n```\n\n### any type (任意类型)\n\nReact 还允许我们指定某个 prop 必须存在，无论其类型。我们可以通过使用 `PropTypes.any`\
  \ 验证器来实现这一点。\n\n```javascript\nclass Component extends React.Component {\n  static\
  \ propTypes = {\n    mustBePresent: PropTypes.any\n  }\n  // ...\n  render() {\n\
  \    return (\n      <div>\n        这里有: {this.props.mustBePresent}\n      </div>\n\
  \    )\n  }\n}\n```\n\n`code/appendix/proptypes/any.js`\n\n### Optional & required\
  \ props (可选与必填 props)\n\n除非另有说明，否则所有 props 都被视为可选的。为了要求向组件传递一个 prop 并进行验证，我们可以在每个\
  \ propType 验证后附加 `.isRequired`。\n\n例如，如果我们必须在 `Loading` 组件完成某个操作后调用一个函数，我们可以像这样指定它：\n\
  \n```javascript\nclass Component extends React.Component {\n  static propTypes =\
  \ {\n    // 可选 props:\n    onStart: PropTypes.func,\n    // 必填 props:\n    onComplete:\
  \ PropTypes.func.isRequired,\n    name: PropTypes.string.isRequired\n  }\n  // ...\n\
  \  startTimer = (seconds=5) => {\n    const { onStart, onComplete } = this.props\n\
  \    onStart()\n    setTimeout(() => onComplete(), seconds)\n  }\n  // ...\n  render()\
  \ {\n    const { name } = this.props\n    return (\n      <div onClick={this.startTimer}>\n\
  \        {name}\n      </div>\n    )\n  }\n}\n```\n\n`code/appendix/proptypes/optional.js`\n\
  \n### custom validator (自定义验证器)\n\nReact 允许我们为所有默认验证函数无法涵盖的其他情况指定自定义验证函数。为了编写运行自定义验证，我们将指定一个接受\
  \ 3 个参数的函数：\n\n1. 传递给组件的 `props`\n2. 正在验证的 `propName`\n3. 我们正在验证的 `componentName`\n\
  \n如果我们的验证通过，我们可以运行该函数并返回任何内容。只有当抛出 `Error` 对象时（即 `new Error()`），验证函数才会失败。\n\n例如，如果我们有一个接受经过验证的用户的加载器，我们可以对该\
  \ prop 运行自定义函数。\n\n```javascript\nclass Component extends React.Component {\n  static\
  \ propTypes = {\n    user: function(props, propName, componentName) {\n      const\
  \ user = props[propName];\n      if (!user.isValid()) {\n        return new Error('Invalid\
  \ user');\n      }\n    }\n  }\n  // ...\n  render() {\n    const { user } = this.props\n\
  \    return (\n      <div>\n        {user.name}\n      </div>\n    )\n  }\n}\n```\n\
  \n`code/appendix/proptypes/custom.js`\n\n其中 `User` 类可能如下所示：\n\n```javascript\nclass\
  \ User {\n  constructor(name) {\n    this.name = name\n  }\n  isValid() {\n    //\
  \ 必须有名称\n    return !!this.name && new Error('Name must be present')\n  }\n}\n```\n\
  \n`code/appendix/proptypes/custom.js`\n\n## 附录 B: ES6\n\n本附录是 ES6 添加到 JavaScript\
  \ 中的新语法特性和方法的非详尽列表。这些特性是最常用且最有帮助的。\n\n虽然本附录没有涵盖 ES6 类，但我们在书中学习组件时会介绍其基础知识。此外，本附录不包含对像\
  \ promises 和 generators 等某些较大的新功能的描述。如果你想了解关于这些或下文任何主题的更多信息，我们鼓励你参考 [Mozilla 开发者网络](https://developer.mozilla.org)\
  \ (MDN)。\n\n### 优先使用 `const` 和 `let`\n\n使用 `const` 和 `let` 代替 `var`。`const` 和 `let`\
  \ 是块作用域的而非函数作用域。这种作用域有助于避免意外 bug。\n\n`appendix/es6/const.js`\n\n#### 箭头函数 (Arrow\
  \ functions)\n\n有三种方法编写箭头函数。对于下面的示例，假设我们有一个对象数组：\n\n```javascript\nconst cities\
  \ = [\n  { name: 'Cairo', pop: 776470 },\n  { name: 'Lagos', pop: 802920 },\n];\n\
  ```\n\n`appendix/es6/arrow_funcs.js`\n\n如果我们编写跨行的箭头函数，必须使用大括号来界定体：\n\n```javascript\n\
  const formattedPopulations = cities.map((city) => {\n  const popMM = (city.pop /\
  \ 1000000).toFixed(2);\n  return popMM + ' million';\n});\n```\n\n注意我们需要显式指定 `return`。但如果我们写的函数体只有一行（或单个表达式），可以使用括号来界定它：\n\
  \n```javascript\nconst formattedPopulations2 = cities.map((city) => (\n  (city.pop\
  \ / 1000000).toFixed(2) + ' million'\n));\n```\n\n`appendix/es6/arrow_funcs.js`\n\
  \n值得注意的是，我们不需要 `return` 因为它是隐式的。此外，如果你的函数体很精简，你可以这样写：\n\n```javascript\nconst pops\
  \ = cities.map(city => city.pop);\nconsole.log(pops);\n// [ 776470, 802920 ]\n```\n\
  \n`appendix/es6/arrow_funcs.js`\n\n函数的简洁是我们使用它们的两个之一。将上面的单行代码与此进行比较：\n\n```javascript\n\
  const popsNoArrow = cities.map(function(city) { return city.pop });\n```\n\n`appendix/es6/arrow_funcs.js`\n\
  \n更大的益处在于箭头函数绑定 `this` 对象的方式。传统的 JavaScript 函数声明语法（`function {} {}`）会将匿名函数中的 `this`\
  \ 绑定到全局对象。为了说明这引起的混乱，请考虑以下示例：\n\n```javascript\nfunction printSong() {\n  console.log(\"\
  Oops - The Global Object\");\n}\n\nconst jukebox = {\n  songs: [\n    {\n      title:\
  \ \"Wanna Be Startin' Somethin'\",\n      artist: \"Michael Jackson\",\n    },\n\
  \    {\n      title: \"Superstar\",\n      artist: \"Madonna\",\n    },\n  ],\n\
  \  printSong: function (song) {\n    console.log(song.title + \" - \" + song.artist);\n\
  \  },\n  printSongs: function () {\n    // `this` 绑定到对象（OK）\n    this.songs.forEach(function(song)\
  \ {\n      // `this` 绑定到全局对象（坏）\n      this.printSong(song);\n    });\n  },\n}\n\
  \njukebox.printSongs();\n// > \"Oops - The Global Object\"\n// > \"Oops - The Global\
  \ Object\"\n```\n\n`appendix/es6/arrow_funcs_jukebox_1.js`\n\n\n\n\n\n`printSongs()`\
  \ 方法通过 `forEach()` 遍历 `this.songs`。在此上下文中，`this` 如预期地绑定到对象（`jukebox`）上。然而，传递给 `forEach()`\
  \ 的匿名函数会将其内部的 `this` 绑定到全局对象。因此，`this.printSong(song)` 调用的是示例顶部定义的函数，*而不是* `jukebox`\
  \ 上的方法。\n\nJavaScript 开发者传统上使用变通方法处理这种行为，但箭头函数通过`捕获闭包上下文的 `this` 值`解决了这个问题。为 `printSongs()`\
  \ 使用箭头函数可以得到预期的结果：\n\n```\n printSongs: function () {\n    this.songs.forEach((song)\
  \ => {\n      // `this` 绑定到与 `printSongs()` 相同的 `this` (`jukebox`)\n      this.printSong(song);\n\
  \    });\n  },\n}\n\njukebox.printSongs();\n// > \"Wanna Be Startin' Somethin -\
  \ Michael Jackson\"\n// > \"Superstar - Madonna\"\n```\n\n`appendix/es6/arrow_funcs_jukebox_2.js`\n\
  \n出于这个原因，在整书中我们对所有匿名函数使用箭头函数。\n\n## 模块 (Modules)\n\nES6 正式通过 `import`/`export` 语法支持模块。\n\
  \n### 命名导出 (Named exports)\n\n在任何文件中，你都可以使用 `export` 指定模块应该暴露的变量。这是一个导出两个文件的示例：\n\
  \n```\n// greetings.js\n\nexport const sayHi = () => (console.log('Hi!'));\nexport\
  \ const sayBye = () => (console.log('Bye!'));\n\nconst saySomething = () => (console.log('Something!'));\n\
  ```\n\n现在，我们可以在任何想要使用这些函数的地方使用 `import`。我们需要指定想要导入哪些函数。实现此点的常用方法是使用 ES6 的解构赋值语法来像这样列出它们：\n\
  \n```\n// app.js\n\nimport { sayHi, sayBye } from './greetings';\n\nsayHi(); //\
  \ -> Hi!\nsayBye(); // => Bye!\n```\n\n重要的是，*没有*导出的函数（`saySomething`）在模块外部是不可用的。\n\
  \n另外注意，我们在 `from` 中提供了一个`相对路径`，表明该 ES6 模块是一个本地文件，而不是 npm 包。\n\n与其在每个想要导出的变量之前插入\
  \ `export`，你可以使用这种语法在一个区域内列出所有暴露的变量：\n\n```\n// greetings.js\n\nconst sayHi = ()\
  \ => (console.log('Hi!'));\nconst sayBye = () => (console.log('Bye!'));\n\nconst\
  \ saySomething = () => (console.log('Something!'));\n\nexport { sayHi, sayBye };\n\
  ```\n\n我们还可以使用 `import * as <Namespace>` 语法，指定想要在一个给定的命名空间下导入模块的所有功能：\n\n```\n//\
  \ app.js\n\nimport * as Greetings from './greetings';\n\nGreetings.sayHi();\n  //\
  \ -> Hi!\nGreetings.sayBye();\n  // => Bye!\nGreetings.saySomething();\n  // =>\
  \ TypeError: Greetings.saySomething is not a function\n```\n\n### 默认导出 (Default\
  \ export)\n\n导出的另一种类型是默认导出。一个模块只能包含一个默认导出：\n\n```javascript\n// greetings.js\n\n\
  const sayHi = () => (console.log('Hi!'));\nconst sayBye = () => (console.log('Bye!'));\n\
  \nconst saySomething = () => (console.log('Something!'));\n\nconst Greetings = {\
  \ sayHi, sayBye };\n\nexport default Greetings;\n```\n\n这是库的常用模式。这意味着你可以轻松地整体导入库，而无需指定你想要哪些单独的函数：\n\
  \n```\n// app.js\n\nimport Greetings from './greetings';\n\nGreetings.sayHi(); //\
  \ -> Hi!\nGreetings.sayBye(); // => Bye!\n```\n\n模块混合使用命名导出和默认导出并不罕见。例如，在 `react-dom`\
  \ 中，你可以这样导入 `ReactDOM`（一个默认导出）：\n\n```javascript\nimport ReactDOM from 'react-dom';\n\
  \nReactDOM.render(\n  // ...\n);\n```\n\n或者，如果你只使用 `render()` 函数，你可以像这样导入命名的 `render()`\
  \ 函数：\n\n```javascript\nimport { render } from 'react-dom';\n\nrender(\n  // ...\n\
  );\n```\n\n为了实现这种灵活性，`react-dom` 的导出实现看起来像这样：\n\n```javascript\n// 一个伪的 react-dom.js\n\
  \nexport const render = (component, target) => {\n  // ...\n};\n\nconst ReactDOM\
  \ = {\n  render,\n  // ... 其他函数\n};\n\nexport default ReactDOM;\n```\n\n如果你想尝试一下模块语法，请查看文件夹\
  \ `code/webpack/es6-modules`。\n\n关于 ES6 模块的更多阅读，请参阅 Mozilla 的这篇文章：“[深度 ES6：模块](https://hacks.mozilla.org/2015/08/es6-in-depth-modules/)”。\n\
  \n## Object.assign()\n\n我们在整书中经常使用 `Object.assign()`。我们在想要创建现有对象的修改版本的地方使用它。\n\n\
  `Object.assign()` 接受任意数量的对象作为参数。当函数接收两个参数时，它会将第二个对象的属性*拷贝*到第一个对象上，如下所示：\n\n```\n\
  const coffee = { };\nconst noCream = { cream: false };\nconst noMilk = { milk: false\
  \ };\nObject.assign(coffee, noCream);\n// coffee 现在是 { cream: false }\nObject.assign(coffee,\
  \ noMilk);\n// coffee 现在是 { cream: false, milk: false }\n```\n\n`appendix/es6/object_assign`\n\
  \n## 模板字符串 (Template literals)\n\n在 ES5 中，你会像这样将变量值到字符串中：\n\n```javascript\nvar\
  \ greeting = 'Hello, ' + user + '! is ' + degF + ' degrees.';\n```\n\n`appendix/es6/object_assign`\n\
  \n使用 ES6 模板字符串，我们可以创建相同的字符串：\n\n```javascript\nconst greeting = `Hello, ${user}!\
  \ is ${degF} degrees.`;\n```\n\n`appendix/es6/template_literals`\n\n## 展开运算符 (...)\n\
  \n在数组中，`...` 运算符展开随后的数组。这是一个例子：\n\n```\nconst a = [ 1, 2, 3 ];\nconst b = [ 4, 5,\
  \ 6 ];\nconst c = [ ...a, ...b, 7, 8, 9 ];\n// c 是 [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]\n\
  ```\n\n`appendix/es6/spread_operator`\n\n注意 `...` 如何让我们简洁地构造新数组。\n\n`appendix/es6/spread_operator`\n\
  \n## 增强型对象字面量 (Enhanced object literals)\n\n在 ES6 中，当属性名和变量名相同时，你可以使用这种简洁的语法：\n\n\
  ```javascript\nconst implicit = {\n  getState,\n  dispatch,\n};\n```\n\n`appendix/es6/object_literals`\n\
  \n## 默认参数 (Default arguments)\n\n在 ES6 中，你可以在调用函数时参数为 `undefined` 的情况下为其指定默认值。\n\
  \n这种：\n\n```javascript\nfunction divide(a, b) {\n  // 默认除数为 `1`\n  const divisor\
  \ = typeof b === 'undefined' ? 1 : b;\n\n  return a / divisor;\n}\n```\n\n`appendix/es6/default_args`\n\
  \n可以写成：\n\n```javascript\nfunction divide(a, b = 1) {\n  return a / b;\n}\n```\n\
  \n`appendix/es6/default_args`\n\n在两种情况下，使用函数的方法如下：\n\n```\ndivide(14, 2);\n// =>\
  \ 7\ndivide(14, undefined);\n// => 14\ndivide(14);\n// => 14\n```\n\n`appendix/es6/default_args`\n\
  \n当上述示例中的参数 `b` 为 `undefined` 时，就会使用默认参数。注意 `null` 不使用默认参数：\n\n```javascript\ndivide(14,\
  \ null); // `null` 被用作除数\n// => Infinity    // 14 / null\n```\n\n`appendix/es6/default_args`\n\
  \n\n\n\n# 解构赋值\n\n## 针对数组\n\n在 ES5 中，从数组中提取并赋值多个元素的形式如下所示：\n\n```javascript\nvar\
  \ fruits = [ 'apples', 'bananas', 'oranges' ];\nvar fruit1 = fruits[0];\nvar fruit2\
  \ = fruits[1];\n```\n\n`appendix/es6/destructuring_assignments.js`\n\n在 ES6 中，我们可以使用解构语法来完成相同的任务：\n\
  \n```javascript\nconst [ veg1, veg2 ] = [ 'asparagus', 'broccoli', 'onion' ];\n\
  console.log(veg1); // -> 'asparagus'\nconsole.log(veg2); // -> 'broccoli'\n```\n\
  \n`appendix/es6/destructuring_assignments.js`\n\n左侧数组中的变量会被“匹配”并赋值给右侧数组中对应的元素。注意\
  \ `'onion'` 被忽略了，没有变量绑定到它。\n\n## 针对对象\n\n我们可以对类似的操作将对象的属性提取到变量中：\n\n```javascript\n\
  const smoothie = {\n  fats: [ 'avocado', 'peanut butter', 'greek yogurt' ],\n  liquids:\
  \ [ 'almond milk' ],\n  greens: [ 'spinach' ],\n  fruits: [ 'blueberry', 'banana'\
  \ ],\n};\n\nconst { liquids, fruits } = smoothie;\n\nconsole.log(liquids); // ->\
  \ [ 'almond milk' ]\nconsole.log(fruits); // -> [ 'blueberry', 'banana' ]\n```\n\
  \n`appendix/es6/destructuring_assignments.js`\n\n## 参数上下文匹配\n\n我们可以使用相同的原理将函数内部的参数绑定到作为参数提供的对象的属性上：\n\
  \n```javascript\nconst containsSpinach = ({ greens }) => {\n  if (greens.find(g\
  \ => g === 'spinach')) {\n    return true;\n  } else {\n    return false;\n  }\n\
  };\n\ncontainsSpinach(smoothie); // -> true\n```\n\n`appendix/es6/destructuring_assignments.js`\n\
  \n我们经常在函数式 React 组件中这样做：\n\n```javascript\nconst IngredientList = ({ ingredients,\
  \ onClick }) => (\n  <ul className='IngredientList'>\n    {\n      ingredients.map(i\
  \ => (\n        <li\n          key={i.id}\n          onClick={() => onClick(i.id)}\n\
  \          className='item'\n        >\n          {i.name}\n        </li>\n    \
  \  ))\n    }\n  </ul>\n)\n```\n\n在这里，我们使用解构将 props 提取到变量（`ingredients` 和 `onClick`），然后在组件的函数体内使用它们。\n\
  \n# 附录 C：React Hooks\n\n> 本章节由 [Yomi Eluwande](https://twitter.com/yomieluwande)\
  \ 贡献\n\n如果你一直在关注 Twitter，你可能已经知道 `Hooks` 是 React 的一个新功能，但你可能会问**我们实际上该如何使用它们？**\
  \ 在此篇文章中，我们将向你展示许多使用 hooks 的示例。\n\n要理解的关键思想之一是**Hooks 让你可以在不编写类的情况下使用状态和其他 React\
  \ 特性。**\n\n### 警告：Hooks 处于 Alpha 版本\n\n> 在深入之前之前，重要的是说明 `Hooks` API 尚未定型。\n\n> 此外，[官方文档](https://reactjs.org/docs/hooks-intro.html)\
  \ 非常优秀，我们推荐你阅读它们，特别是它们扩展了 `Hooks` 的设计初衷。\n\n### Hooks 背后的动机\n\n虽然基于组件的设计允许我们在整个应用中复用\
  \ `views`，但 React 开发者面临的最大问题之一是我们如何在组件之间**复用状态逻辑**。当我们有共享相似状态逻辑的组件时，还没有很好的复用解决方案，这有时会导致构造函数和生命周期方法中的逻辑重复。\n\
  \n传统处理这种问题的方法通常是：\n\n* 高阶组件（higher-order components）或\n* 复杂的渲染属性（render props）\n\
  \n但这两种模式都有缺点，会导致代码库变得复杂。\n\n**Hooks 旨在解决所有这些问题，它让你编写的函数组件可以访问 `state`、`context`、生命周期方法、`ref`\
  \ 等功能，而无需编写类组件。**\n\n### Hooks 如何映射到组件类\n\n如果你熟悉 React，理解 hooks 的最佳方法之一是观察我们如何通过\
  \ hooks 重现我们在“组件类”中习惯的行为。\n\n回想编写组件类时，我们通常需要：\n\n* 维护 `state`\n* 使用生命周期方法如 `componentDidMount()`\
  \ 和 `componentDidUpdate()`\n* 访问上下文（通过设置 `contextType`）\n\n通过 React Hooks，我们可以在函数组件中复制类似或相同的行为：\n\
  \n* 组件状态使用 `useState()` hook。\n* 生命周期周期方法如 `componentDidMount()` 和 `componentDidUpdate()`\
  \ 使用 `useEffect()` hook。\n* 静态 `contextType` 使用 `useContext()` hook。\n\n### 使用 Hooks\
  \ 需要 `react` \"next\" 版本\n\n你现在可以通过将 `package.json` 文件中的 `react` 和 `react-dom` 设置为\
  \ `next` 来开始使用 Hooks。\n\n```json\n// package.json\n\"react\": \"next\",\n\"react-dom\"\
  : \"next\"\n```\n\n### useState() Hook 示例\n\n状态是 React 的核心部分。它们允许我们声明存储数据并在应用中使用这些状态变量。在类组件中，状态通常定义如下：\n\
  \n```javascript\nclass Example extends React.Component {\n  constructor(props) {\n\
  \    super(props);\n    this.state = {\n      count: 0\n    };\n  }\n```\n\n在 hooks\
  \ 出现之前，状态通常在类组件中使用，但如上述，**Hooks 允许我们在函数组件中添加状态**。让我们来看下面的示例。我们将构建一个灯泡，颜色将根据 `state`\
  \ 的值发生变化。为了实现这一点，我们将使用 `useState` hook。下面是完整的（可运行）代码：\n\n```javascript\nimport React,\
  \ { useState } from \"react\";\nimport ReactDOM from \"react-dom\";\nimport \"./styles.css\"\
  ;\n\nfunction Lightb() {\n  let [light, setLight] = useState(0);\n\n  const setOff\
  \ = () => setLight(0);\n  const setOn = () => setLight(1);\n\n  let fillColor =\
  \ light === 1 ? \"#ffbb73\" : \"#000000\";\n\n  return (\n    <div className=\"\
  App\">\n      <div>\n        <Lightbulb fillColor={fillColor} />\n      </div>\n\
  \      <button onClick={setOff}>Off</button>\n      <button onClick={setOn}>On</button>\n\
  \    </div>\n  );\n}\n\nfunction Lightbulb(props) {\n  return (\n    /*\n      下面是灯泡的\
  \ SVG 标记。      根据 props 动态设置 `fill`。\n    */\n    <svg width=\"56px\" height=\"\
  90px\" viewBox=\"0 0 56 90\">\n      <defs />\n      <g\n        id=\"1\"\n    \
  \    stroke=\"none\"\n        stroke-width=\"1\"\n        fill=\"none\"\n      >\n\
  \        <g id=\"bulb_1912567\" fill=\"#000000\">\n          <path\n           \
  \ d=\"M38.985,68.873 L17.015,68.873 C15.615,68.873 14.48,68.873 14.48,68.873\"\n\
  \          />\n        </g>\n      </g>\n    </svg>\n  );\n}\n\nconst rootElement\
  \ = document.getElementById(\"root\");\nReactDOM.render(<Lightb />, rootElement);\n\
  ```\n\n\n\n\n\n## 我们的组件是一个函数\n\n在上面的代码块中，我们首先从 `react` 导入了 `useState`。`useState`\
  \ 是使用 `this.state` 原本提供的功能的新方法。\n\n接下来，注意到这个组件**是一个函数而不是类**。很有趣！\n\n## 读取和写入状态\n\
  \n在这个函数内部，我们调用了 `useState` 来创建一个状态变量：\n\n```\nlet [light, setLight] = useState(0);\n\
  ```\n\n`useState` 用于声明一个状态变量，并可以用任何 `any` 类型的值进行初始化（与类中的状态不同，类的状态必须是一个对象）。\n\n如上所示，我们对\
  \ `useState` 的返回值使用了解构赋值。\n\n*   第一个值（在本例中为 `light`）是当前状态（类似于 `this.state`），以及\n\
  *   第二个值是**一个用于更新状态（第一个值值的函数**（类似于传统的 `this.setState`）。\n\n接下来，我们创建了两个函数，每个函数都将状态设置为不同的值，0\
  \ 或 1。\n\n```\nconst setOff = () => setLight(0);\nconst setOn = () => setLight(1);\n\
  ```\n\n然后我们使用这些函数作为事件处理器传递到视图中的按钮上：\n\n```\n<button onClick={setOff}>Off</button>\n\
  <button onClick={setOn}>On</button>\n```\n\n## React 跟踪状态\n\n当按下“On”按钮时，会调用 `setOn`，它会调用\
  \ `setLight(1)`。对 `setLight(1)` 的调用**会在下一次渲染时更新 `light` 的值**。这感觉可能有点神奇，但发生的情况是 **React\
  \ 正在跟踪该变量的值**，并且它会在重新渲染此组件时传入新值。\n\n然后，我们使用当前状态（`light`）来决定灯泡应该是“开启”状态。也就是说，我们根据\
  \ `light` 的值设置 SVG 的填充颜色。如果 `light` 为 0（关闭），则 `fillColor` 被设置为 `#000000`（如果它为 1（开启），`fillColor`\
  \ 被设置为 `#ffbb73`）。\n\n## 多个状态\n\n虽然我们从上面的示例中没有这样做，但你**可以**通过多次调用 `useState` 来创建多个状态。例如：\n\
  \n```\nlet [light, setLight] = useState(0);\nlet [count, setCount] = useState(10);\n\
  let [name, setName] = useState(\"Yomi\");\n```\n\n> 注意：在使用 hooks 时有一些你需要注意的限制。最重要的一点是，你**必须在函数的顶层调用\
  \ hooks**。更多信息请参阅 [Hooks 规则](https://reactjs.org/docs/hooks-rules.html)。\n\n## useEffect()\
  \ Hook 示例\n\n`useEffect` Hook 允许你**在函数组件中执行副作用**。副作用可以是 API 调用、更新 DOM、订阅事件监听器——任何你希望发生“命令式”操作的场景。\n\
  \n通过使用 `useEffect()` Hook，React 知道你希望在它完成渲染后执行某些操作。\n\n让我们看看下面的示例。我们将使用 `useEffect()`\
  \ hook 来进行 API 调用并获取响应。\n\n```\nimport React, { useState, useEffect } from \"react\"\
  ;\nimport ReactDOM from \"react-dom\";\n\nimport \"./styles.css\";\n\nfunction App()\
  \ {\n  let [names, setNames] = useState([]);\n\n  useEffect(() => {\n    fetch(\"\
  https://uinames.com/api/?amount=25&region=nigeria\")\n      .then(response => response.json())\n\
  \      .then(data => {\n        setNames(data);\n      });\n  }, []);\n\n  return\
  \ (\n    <div className=\"App\">\n      <div>\n        {names.map((item, i) => (\n\
  \          <div key={i}>\n            {item.name} {item.surname}\n          </div>\n\
  \        ))}\n      </div>\n    </div>\n  );\n}\n\nconst rootElement = document.getElementById(\"\
  root\");\nReactDOM.render(<App />, rootElement);\n```\n\n`hooks/02-react-hooks-useeffect/src/index.js`\n\
  \n![useEffect to fetch](img/hooks----useEffect.png)\n\nuseEffect to fetch\n\n在这个代码示例中，`useState`\
  \ 和 `useEffect` 都被导入了，因为我们希望**将 API 调用的结果设置为状态**。\n\n```\nimport React, { useState,\
  \ useEffect } from \"react\";\n```\n\n### 获取数据并更新状态\n\n为了“使用一个效果”，我们需要将操作放在 `useEffect`\
  \ 函数中——也就是说，我们将副作用“动作”作为匿名函数作为第一个参数传递给 `useEffect`。\n\n在上面的示例中，我们向一个返回名称列表的端点进行\
  \ API 调用。当 `response` 返回时，我们将其转换为 JSON，然后使用 `setNames(data)` 设置状态。\n\n```\nlet [names,\
  \ setNames] = useState([]);\n\nuseEffect(() => {\n  fetch(\"https://uinames.com/api/?amount=25&region=nigeria\"\
  )\n    .then(response => response.json())\n    .then(data => {\n      setNames(data);\n\
  \    });\n}, []);\n```\n\n## 使用 Effects 时的性能考虑\n\n在使用 `useEffect` 时有一些需要注意的地方。\n\
  \n首先考虑到的是，默认情况下，我们的 `useEffect` 会每次渲染时被调用！好消息是由于不需要担心过时数据，但坏消息是我们可能不想在每次渲染时都发送 HTTP\
  \ 请求（在此例中）。\n\n你可以通过**使用 `useEffect` 的第二个参数来跳过效果**，就像我们在这种情况中做一样。`useEffect` 的第二个参数是一个我们想要“观察”的变量列表，只有当这些值之一发生变化时，我们才会重新运行效果。\n\
  \n在上面的代码示例中，注意我们传递了一个**空数组**作为第二个参数。这意味着我们告诉 React 仅在组件挂载时调用此效果。\n\n> 要了解更多关于 Effect\
  \ 性能的知识，请[查看官方文档此部分](https://reactjs.org/docs/hooks-effect.html#tip-optimizing-performance-by-skipping-effects)\n\
  \n此外，就像上面的 `useState` 函数一样，`useEffect` 允许多个实例，这意味着你可以有几个 `useEffect` 函数。\n\n## useContext()\
  \ Hook 示例\n\n### Context 的作用\n\nReact 中的 Context 是子组件访问父组件中值的方法。\n\n为了理解 context\
  \ 的必要性，在构建 React 应用时，你经常需要从顶部获取底部的值。如果没有 context，你最终会将 props 传递给不需要它们的组件。这不仅很麻烦，而且如果处理不当，还会引入无意的耦合。\n\
  \n通过无关组件的树传递 props 被亲切地称为透层传递（props drilling）。\n\nReact Context 通过允许在树中共享值，解决了了透层传递的问题。\n\
  \n### useContext() 让 Context 更容易使用\n\n使用 `useContext` Hook，使用 Context 比以往任何时候都容易。\n\
  \n`useContext()` 函数接受一个 `context 对象`，该对象最初由 `React.createContext()` 返回，然后返回当前的上下文值。让我们看看下面的示例。\n\
  \n```\nimport React, { useContext } from \"react\";\nimport ReactDOM from \"react-dom\"\
  ;\nimport \"./styles.css\";\n\nconst JediContext = React.createContext();\n\nfunction\
  \ Display() {\n  const value = useContext(JediContext);\n  return <div>{value},\
  \ 我是你的父亲。</div>;\n}\n\nfunction App() {\n  return (\n    <JediContext.Provider value=\"\
  Luke\">\n      <Display />\n    </JediContext.Provider>\n  );\n}\n\nconst rootElement\
  \ = document.getElementById(\"root\");\nReactDOM.render(<App />, rootElement);\n\
  ```\n\n`hooks/03-react-hooks-usecontext/src/index.js`\n\n在上面的代码中，上下文 `JediContext`\
  \ 是使用 `React.createContext()` 创建的。\n\n我们在 `App` 组件中使用 `JediContext.Provider` 并在那里设置\
  \ `value` 为 \"Luke\"。这意味着树中的任何请求上下文的对象现在都可以读取该值。\n\n要在 `Display()` 函数中读取此值，我们调用\
  \ `useContext`，并将 `JediContext` 作为参数传递。当 provider 的值更新时，此 Hook 将带有最新的上下文值触发重新渲染。\n\
  \n#### 在较大的应用中获取 Context 的引用\n\n\n\n\n\n在上方，我们在两个组件的作用范围内都创建了 `JediContext`，但在较大的应用程序中，`Display`\
  \ 和 `App` 会位于不同的文件中。所以，如果你[也和我们一样](https://twitter.com/fullstackio/status/1060629351819952128)，你可能会在想：“我们如何跨文件获取\
  \ `JediContext` 的引用呢？”\n\n答案是，你需要**创建一个导出 `JediContext` 的新文件**。\n\n例如，你可能有一个名为 `context.js`\
  \ 的文件，内容如下：\n\n```javascript\nconst JediContext = React.createContext();\nexport\
  \ { JediContext };\n```\n\n然后在在 `App.js`（以及 `Display.js`）中，你会这样写：\n\n```javascript\n\
  import { JediContext } from \"./context.js\";\n```\n\n（感谢 [Dave](https://twitter.com/dceddia)！）\n\
  \n## `useRef()` Hook 示例\n\nRefs 提供了一种访问在 `render()` 方法中创建的 React 元素的方法。\n\n如果你是\
  \ React refs 的新手，可以在这里阅读这篇 React refs 介绍](https://www.fullstackreact.com/articles/using-refs-in-react/)。\n\
  \n`useRef()` 函数返回一个 ref 对象。\n\n```javascript\nconst refContainer = useRef(initialValue);\n\
  ```\n\n### `useRef()` 与带有 `input` 的表单\n\n让我们来看一个使用 `useRef` hook 的示例。\n\n```javascript\n\
  import React, { useState, useRef } from \"react\";\nimport ReactDOM from \"react-dom\"\
  ;\n\nimport \"./styles.css\";\n\nfunction App() {\n  let [name, setName] = useState(\"\
  Nate\");\n\n  let nameRef = useRef();\n\n  const submitButton = () => {\n    setName(nameRef.current.value);\n\
  \  };\n\n  return (\n    <div className=\"App\">\n      <p>{name}</p>\n\n      <div>\n\
  \        <input ref={nameRef} type=\"text\" />\n        <button type=\"button\"\
  \ onClick={submitButton}>\n          Submit\n        </button>\n      </div>\n \
  \   </div>\n  );\n}\n\nconst rootElement = document.getElementById(\"root\");\n\
  ReactDOM.render(<App />, rootElement);\n```\n\n`hooks/04-react-hooks-useref/src/index.js`\n\
  \n![useRef](img/hooks----useRef1.png)\n\n### useRef\n\n在上面的示例中，我们结合使用了 `useRef()`\
  \ hook 和 `useState()`，将 `input` 标签的值渲染到 `p` 标签中。\n\nref 被实例化为 `nameRef` 变量。然后，`nameRef`\
  \ 变量可以通过被设置为 `ref` 来在输入字段中使用。本质上，这意味着输入字段的内容现在可以通过 ref 访问。\n\n代码中的提交按钮有一个名为 `submitButton`\
  \ 的 `onClick` 事件处理程序。`submitButton` 函数调用了 `setName`（通过 `useState` 创建）。\n\n正如我们之前对\
  \ `useState` hooks 所做，`setName` 将用于设置状态 `name`。为了从 `input` 标签中提取名称，我们读取值 `nameRef.current.value`。\n\
  \n关于 `useRef` 的另一个需要注意的点是，它可以用于 `ref` 属性之外。\n\n## 使用自定义 Hooks\n\nHooks 最酷的功能之一是，你可以**通过创建自定义\
  \ hook 来在多个组件之间共享逻辑**。\n\n在下面的示例中，我们将创建一个自定义的 `setCounter()` Hook，它允许我们跟踪状态并提供自定义的状态更新函数！\n\
  \n> 另请参考，[react-use 中的这个 `useCounter` hook](https://github.com/streamich/react-use/blob/master/src/useCounter.ts)\
  \ 和 [Kent 的这个 `useCounter`](https://codesandbox.io/s/github/kentcdodds/react-hooks-and-suspense-egghead-playlist/tree/master/?module=%2Fsrc%2Flessons%2F03-state-custom-hook.js&moduleview=1)\n\
  \n```javascript\nimport React, { useState } from \"react\";\nimport ReactDOM from\
  \ \"react-dom\";\nimport \"./styles.css\";\n\nfunction useCounter({ initialState\
  \ }) {\n  const [count, setCount] = useState(initialState);\n  const increment =\
  \ () => setCount(count + 1);\n  const decrement = () => setCount(count - 1);\n \
  \ return [count, { increment, decrement, setCount }];\n}\n\nfunction App() {\n \
  \ const [myCount, { increment, decrement }] = useCounter({ initialState: 0 });\n\
  \  return (\n    <div>\n      <p>{myCount}</p>\n      <button onClick={increment}>Increment</button>\n\
  \      <button onClick={decrement}>Decrement</button>\n    </div>\n  );\n}\n\nconst\
  \ rootElement = document.getElementById(\"root\");\nReactDOM.render(<App />, rootElement);\n\
  ```\n\n`hooks/05-react-hooks-custom-hooks/src/index.js`\n\n![Custom Increment Hook](img/hooks----customHook.png)\n\
  \n### 自定义 Increment Hook\n\n在上面的代码块中，我们创建一个函数 `useCounter`，它存储了我们自定义 hook 的逻辑。\n\
  \n注意 `useCounter` 可以使用其他 Hooks！我们通过 `useState` 创建一个新的状态 Hook。\n\n接下来，我们定义了两个辅助函数：`increment`\
  \ 和 `decrement`，它们调用 `setCount` 并相应调整当前的 `count`。\n\n最后，我们 `return` 交互所需的引用。\n\n\
  ## 为 Hooks 测试\n\n在下面的示例中，我们使用 `testing-library` 来测试我们的 hooks。\n\n> Q：`return` 有什么用？\n\
  > A：就像大多数东西一样，`return` 用于。\n> 在上面的示例中，我们使用 `testing-library` 来测试我们的 hooks。\n\n###\
  \ 为 useState() Hook 写测试\n\n让我们来看一个为 `useState` 写测试的示例。在上面的课程中，我们正在测试一个 `useState`\
  \ 变体。\n\n```javascript\nimport React from \"react\";\nimport { render, fireEvent,\
  \ getByTestId } from \"react-library\";\n// 导入组件\nimport LightBulb from \"../index\"\
  ;\n\ntest(\"bulb is on\", () => {\n  // 获取渲染元素的容器节点\n  const { container } = render(<LightBulb\
  \ />);\n  // LightBulb 组件中包含状态值的 p 标签\n  const lightState = getByTestId(container,\
  \ \"lightState\");\n  // 引用开启按钮\n  const onButton = getByTestId(container, \"onButton\"\
  );\n  // 引用关闭按钮\n  const offButton = getByTestId(container, \"offButton\");\n\n\
  \  //模拟点击开启按钮\n  fireEvent.click(onButton);\n  // 预期状态为 1\n  expect(lightState.textContent).toBe(\"\
  1\");\n  //模拟点击关闭按钮\n  fireEvent.click(offButton);\n  // 预期状态为 0\n  expect(lightState.textContent).toBe(\"\
  0\");\n});\n```\n\n`hooks/06-tests-for-usestate/src/__tests__testhooks.js`\n\n在上面的代码块中，我们首先从\
  \ `react-testing-library` 导入了一些工具函数以及要测试的组件。\n\n*   `render`，它可以帮助渲染我们的组件。它渲染到一个附加到\
  \ `document.body` 的容器中\n\n*   `getByTestId`，通过 `data-testid` 获取 DOM 元素\n\n*   `fireEvent`，它用于“触发”\
  \ DOM 事件。它在 `document` 上挂载事件处理程序并通过事件委托处理某些 DOM 事件，例如点击按钮。\n\n\n\n\n\n接下来，在测试断言函数中，我们为\
  \ `data-testid` 元素及其想要在测试中使用的值创建常量变量。通过对 DOM 元素的引用，我们随后可以使用 `fireEvent` 方法来模拟点击按钮。\n\
  \n测试检查了如果点击了 `onButton`，状态将设置为 1；而当点击 `offButton` 时，状态将设置为 1。\n\n### 为 `useEffect()`\
  \ Hook 编写测试\n\n在此示例中，我们将编写测试来使用 `useEffect` Hook 向购物车中添加项目。该项目的计数数量也存储在 `localStorage`\
  \ 中。下方 CodeSandbox 中的 `index.js` 文件包含了用于将项目添加到购物车的实际逻辑。\n\n我们将编写测试来确保更新购物车项目数量也会反映在\
  \ `localStorage` 中，即使页面重新刷新，购物车的项目数量仍然持久存在。\n\n```javascript\nimport React from\
  \ \"react\";\nimport { render, fireEvent, getByTestId } from \"react-testing-library\"\
  ;\n// import the App component\nimport App from \"../index\";\n\ntest(\"cart item\
  \ is updated\", () => {\n  // set the localStorage count to 0\n  window.localStorage.setItem(\"\
  cartItem\", 0);\n  // get the containing DOM node of your rendered React Element\n\
  \  const { container, rerender } = render(<App />);\n  // this references the add\
  \ button which increments the cart item count\n  const addButton = getByTestId(container,\
  \ \"addButton\");\n  // this references the reset button which resets the cart item\
  \ count\n  const resetButton = getByTestId(container, \"resetButton\");\n  // this\
  \ references the p tag that displays the cart item count\n  const countTitle = getByTestId(container,\
  \ \"countTitle\");\n\n  // this simulates clicking on the add button\n  fireEvent.click(addButton);\n\
  \  // the test expects the cart item count to be 1\n  expect(countTitle.textContent).toBe(\"\
  Cart Item - 1\");\n  // this imulates reloading the app\n  rerender(<App />);\n\
  \  // the test still expects the cart item count to be 1\n  expect(window.localStorage.getItem(\"\
  cartItem\")).toBe(\"1\");\n  // this simulates clicking on the reset button\n  fireEvent.click(resetButton);\n\
  \  // the test expects the cart item count to be 0\n  expect(countTitle.textContent).toBe(\"\
  Cart Item - 0\");\n});\n```\n\n`hooks/07-tests-for-useeffect/src/tests/testhooks.js`\n\
  \n在测试断言函数中，我们首先将 `localStorage` 中的 `cartItem` 设置为 0，这意味着购物车项目数量为 0。然后，我们通过解构赋值从\
  \ `App` 组件中获取了 `container` 和 `rerender`。`rerender` 允许我们模拟页面刷新。\n\n接下来，我们获取了显示当前购物车项目数量的按钮和\
  \ `p` 标签的引用，并将它们设置为常量变量。\n\n完成后，测试模拟点击 `addButton` 并检查当前购物车项目数量是否为 `1`，然后刷新页面，之后检查\
  \ `localStorage` 中的计数 `cartItem` 是否也被设置为 `1`。接着，它模拟点击 `resetButton` 并检查当前购物车项目数量是否被设置为\
  \ `0`。\n\n### 为 `useRef()` Hook 编写测试\n\n在此示例中，我们将测试 `useRef` Hook，并使用上面原始的 `useRef`\
  \ 示例作为测试基础。`useRef` Hook 用于从 `input` 字段获取值并将其设置为状态值。下方 CodeSandbox 中的 `index.js`\
  \ 文件包含了输入值并提交该值的逻辑。\n\n```javascript\nimport React from \"react\";\nimport { render,\
  \ fireEvent, getByTestId } from \"react-testing-library\";\n// import the App component\n\
  import App from \"../index\";\n\ntest(\"input field is updated\", () => {\n  //\
  \ get the containing DOM node of your rendered React Element\n  const { container\
  \ } = render(<App />);\n  // this references the input field button\n  const inputName\
  \ = getByTestId(container, \"nameinput\");\n  // this references the p tag that\
  \ displays the value gotten from the ref value\n  const name = getByTestId(container,\
  \ \"name\");\n  // this references the submit button which sets the state value\
  \ to the ref value\n  const submitButton = getByTestId(container, \"submitButton\"\
  );\n  // the value to be entered in the input field\n  const newName = \"Yomi\"\
  ;\n\n  // this simulates entering the value 'Yomi' into the input field\n  fireEvent.change(inputName,\
  \ { target: { value: newName } });\n  // this simulates clicking on the submit button\n\
  \  fireEvent.click(submitButton);\n  // the test expects the name display reference\
  \ to be equal to what was entered in the input field.\n  expect(name.textContent).toEqual(newName);\n\
  });\n```\n\n`hooks/08-tests-for-useref/src/tests/testhooks.js`\n\n在测试断言函数中，我们正在将输入字段、显示当前\
  \ ref 值的 `p` 标签以及提交按钮设置为常量变量。我们还将想要输入到字段中的值设置为常量变量 `newName`。这将用于在测试中进行检查。\n\n```javascript\n\
  fireEvent.change(inputName, { target: { value: newName } });\n```\n\n在测试断言函数中，我们首先将\
  \ `localStorage` 中的 `cartItem` 设置为 0，这意味着购物车项目数量为 0。然后我们通过解构赋值从 `App` 组件中获取了 `container`\
  \ 和 `rerender`。`rerender` 允许我们模拟页面刷新。\n\n接下来，我们获取了显示当前购物车项目数量的按钮和 `p` 标签的引用，并将它们设置为常量变量。\n\
  \n完成后，测试模拟点击 `addButton` 并检查当前购物车项目数量是否为 `1`，然后刷新页面，之后检查 `localStorage` 中的计数 `cartItem`\
  \ 是否也被设置为 `1`。接着，它模拟点击 `resetButton` 并检查当前购物车项目数量是否被设置为 `0`。\n\n`useRef` Hook 用于从\
  \ `input` 字段获取值并将其设置为状态值。下方 CodeSandbox 中的 `index.js` 文件包含了输入值并提交该值的逻辑。\n\n在测试断言函数中，我们正在将输入字段、显示当前\
  \ ref 值的 `p` 标签以及提交按钮设置为常量变量。我们还将想要输入到字段中的值设置为常量变量 `newName`。这将用于在测试中进行检查。\n\n`fireEvent.change(inputName,\
  \ { target: { value: newName } });`\n\n### 对 Hooks 的反应\n\n社区对 Hooks 感到兴奋。以下是一些亮点：\n\
  \n*   `useRef` 在使用 `ref` 时暴露给父组件的实例值。\n*   `useImperativeHandle` 在使用 `ref` 时暴露给父组件的实例值。\n\
  \n### 不同类型 Hooks 的引用\n\n你可以在代码中开始使用的各种类型的 Hooks。它们列如下：\n\n*   `useState`: `useState`\
  \ 允许我们编写带有状态的纯函数。\n*   `useEffect`: `useEffect` Hook 让我们能够执行副作用。副作用可以是 API 调用、更新\
  \ DOM、订阅事件监听器。\n*   `useContext`: `useContext` 允许编写带有上下文的纯函数。\n*   `useReducer`:\
  \ `useReducer` 为我们提供了一个类似于 Redux 的 reducer 引用。\n*   `useRef`: `useRef` 允许编写返回可变\
  \ `ref` 对象的纯函数。\n*   `useMemo`: `useMemo` 用于返回记忆化的值。\n*   `useCallback`: `useCallback`\
  \ Hook 用于返回记忆化的回调函数。\n\n\n\n\n\n* [`useMutationEffects`](https://reactjs.org/docs/hooks-reference.html#usemutationeffect)\
  \ - `useMutationEffect` 与 `useEffect` Hook 类似，它允许你执行 DOM 变动。\n* [`useLayoutEffect`](https://reactjs.org/docs/hooks-reference.html#uselayouteffect)\
  \ - `useLayoutEffect` 钩用于从 DOM 中读取布局并进行同步渲染。\n* 自定义 Hooks (Custom Hooks) - 自定义 Hooks\
  \ 允许你将组件逻辑编写到可重用的函数中。\n\nHooks 的未来\n\nHooks 的伟大之处在于它可以与现有代码并存运行，因此你可以逐步进行更改以采用 Hooks。你所做的是将你的\
  \ `React` 依赖升级到包含 Hooks 特性的版本。\n\n话虽如此，**Hooks 仍然是一个实验性特性**，`React` 团队已反复警告 `API`\
  \ 可能会发生变化。请自悉。\n\nHooks 的出现对类（Classes）意味着什么？根据 `React` 团队的说法，`Classes` 仍然存在，它们是\
  \ `React` 代码库的很大一部分，并且可能会存在很一段时间。\n\n> 我们没有废弃类的计划。在 Facebook，我们有数万个类组件，和你们一样，我们无打算重写它们。但如果\
  \ `React` 社区拥抱 Hooks，那么拥有两种不同的推荐组件编写方式是没有意义的 - [Dan Abramov](https://twitter.com/fullstackio/status/1057335949766455296)\n\
  \n**虽然特定的 Hooks API 目前是实验性的，但社区喜爱 Hooks 的理念，因此我不认为它会在短期内消失。**\n\nHooks 已经到来，我们非常期待在我们的应用中使用它们！\n\
