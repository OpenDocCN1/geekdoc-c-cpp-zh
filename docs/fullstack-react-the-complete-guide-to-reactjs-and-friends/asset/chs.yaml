  \n### 在 `TimersDashboard` 中定义 `onEditFormSubmit()`\n\n此流水线的最后一步是在 `TimersDashboard`\
  \ 中定义并向下传递编辑表单的提交函数。\n\n对于创建操作，我们有一个函数，可以根据指定的属性创建一个新的计时器对象，并将此新对象附加到状态中 `timers`\
  \ 数组的末尾。\n\n对于更新操作，我们需要遍历 `timers` 数组，直到找到正在更新的计时器对象。正如上一章提到的，状态对象`cannot`直接更新。我们必须使用\
  \ `setState()`。\n\n因此，我们将使用 `map()` 来遍历计时器对象数组。如果计时器的 `id` 与提交表单的 `id` 匹配，我们将返回一个包含已更新属性计时器的新对象。否则，我们将只返回原始计时器。这个新的计时器对象数组将被传递给\
  \ `setState()`：\n\n```javascript\n // Inside TimersDashboard\n  handleEditFormSubmit\
  \ = (attrs) => {\n    this.updateTimer(attrs);\n  };\n\n  createTimer = (timer)\
  \ => {\n    const t = helpers.newTimer(timer);\n    this.setState({\n      timers:\
  \ this.state.timers.concat(t),\n    });\n  };\n\n  updateTimer = (attrs) => {\n\
  \    this.setState({\n      timers: this.state.timers.map((timer) => {\n       \
  \ if (timer.id === attrs.id) {\n          return Object.assign({}, timer, {\n  \
  \          title: attrs.title,\n            project: attrs.project,\n          });\n\
  \        } else {\n          return timer;\n        }\n      }),\n    });\n  };\n\
  ```\n\n`time_tracking_app/public/js/app-4.js`\n\n我们在 `render()` 内部将其作为 prop 传递：\n\
  \n```javascript\n { /* Inside TimersDashboard.render() */}\n          <EditableTimerList\n\
  \            timers={this.state.timers}\n            onFormSubmit={this.handleEditFormSubmit}\n\
  \          />\n```\n\n`time_tracking_app/public/js/app-4.js`\n\n注意，我们可以在传递给 `setState()`\
  \ 的 JavaScript 对象*内部*对 `this.state.timers` 调用 `map()`。这是一种常用的模式。调用会被求值，然后属性 `timers`\
  \ 被设置为结果。\n\n在 `map()` 函数内部，我们检查 `timer` 是否与正在更新的那个匹配。如果不匹配，我们只返回 `timer`。否则，我们使用\
  \ `Object#assign()` 返回一个带有计时器已更新属性的新对象。\n\n记住，这里的一点是我们`将状态视为不可变的 (treat state as\
  \ immutable)`。通过创建一个 `new` timers 对象并使用 `Object#assign()` 填充它，我们没有修改状态状态中的任何对象。\n\
  \n正如我们在处理 `ToggleableTimerForm` 和 `handleCreateFormSubmit` 时所做的那样，我们将 `handleEditFormSubmit`\
  \ 作为 prop `onFormSubmit` 传递下去。`TimerForm` 调用此 prop，而 own 该函数在 `EditableTimer` 下方渲染与在\
  \ `ToggleableTimerForm` 下方渲染是完全不同的。\n\n两个表单都连接好了！保存 `app.js`，重新加载页面，并尝试创建和更新计时器。你也可以在打开的表单上点击“取消”来关闭它：\n\
