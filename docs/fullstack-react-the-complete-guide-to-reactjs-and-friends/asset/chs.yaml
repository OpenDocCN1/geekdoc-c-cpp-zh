  \ `first` 参数，我们将返回两个帖子。然后我们开始构建 SQL 查询：\n\n```\n80   const table = tables.posts;\n\
  81   let query = table\n82     .select(table.id, table.created_at)\n83     .where(table.user_id.equals(userSource.id))\n\
  84     .order(table.created_at.asc)\n85     .limit(first + 1);\n```\n\n我们获取 `first\
  \ + 1` 行，作为一种廉价的方法，用于判断用户请求的内容之外是否还有更多行。我们的查询按 `created_at ASC` 排序，这对于在连续查询时获得确定性数据非常重要。\n\
  \n接下来，我们考虑可能传递的 `after` 游标：\n\n```\n87   if (after) {\n88     // 解析游标\n89     const\
  \ [id, created_at] = after.split(':');\n90     query = query\n91       .where(table.created_at.gt(after))\n\
  92       .where(table.id.gt(id));\n```\n\n此示例中的游标是由行 ID 和行日期组成的字符串。通常在大多数系统中，游标将基于某个日期，因为在处理高大规模数据时，将\
  \ ID 保持为递增整数并不常见。\n\n我们终于可以执行数据库查询：\n\n```\n94   return database.getSql(query.toQuery()).then((allRows)\
  \ => {\n95     const rows = allRows.slice(0, first);\n96 \n97     rows.forEach((row)\
  \ => {\n98       row.__tableName = tables.posts.getName();\n99       row.__cursor\
  \ = row.id + ':' + row.created_at;\n```\n\n记住，我们实际上查询了比用户请求的多一行，这就是为什么我们必须对返回的行进行\
  \ `slice`。我们还为每行构建了游标并设置了 `__tableName` 属性，以便我们未来的 `JOIN` 查询能够工作。\n\n现在我们有了这些行，我们执行它并开始创建我们的\
  \ `pageInfo` 对象：\n\n```javascript\n102     const hasNextPage = allRows.length >\
  \ first;\n103     const hasPreviousPage = false;\n104 \n105     const pageInfo =\
  \ {\n106       hasNextPage,\n107       hasPreviousPage,\n108     };\n109     if\
  \ (rows.length > 0) {\n110       pageInfo.startCursor = rows[0].cursor;\n111   \
  \    pageInfo.endCursor = rows[rows.length - 1].cursor;\n112     }\n```\n\n\n\n\n\
  这个主题通常被称为 `authorization`（授权）。GraphQL 对授权没有继承的概念或观点，这使得它在实现“谁可以查看架构中的哪些数据”的控制时变得非常灵活。这意味着你可能需要确保不会无意中向用户暴露本应被隐藏的数据。\n\
  \n我们将为服务器添加一个很小的 `authentication`（身份验证）层，它用于验证 GraphQL 查询是否允许被处理，以及控制谁可以查看不同帖子的授权逻辑。我们将使用的技术方法绝对不是在\
  \ GraphQL 中实现这些功能的唯一方法，但可能会激发一些可能适用于你产品的灵感。\n\n对于身份验证，我们将使用 [HTTP 基础认证](https://en.wikipedia.org/wiki/Basic_access_authentication)。身份验证有许多协议，例如\
  \ OAuth、JSON web tokens 和 cookies，最终的选择取决于每个产品的特性。HTTP 基础认证添加到我们现有的 NodeJS 服务器中非常简单，这是在这种情况下选择它的主要原因。\n\
  \n首先，安装 `basic-auth-connect` 包，它提供了一个非常简单的 API 来允许某些凭据访问：\n\n```\n$ npm i basic-auth-connect@1.0.0\
  \ --save --save-exact\n```\n\n然后在我们的服务器代码中导入该模块：\n\n```\n3 import express from 'express';\n\
  4 import basicAuth from 'basic-auth-connect';\n5 \n6 const app = express();\n```\n\
  \n在我们添加 GraphQL 端点之前，添加一个新的 `app.use` 调用。请记住，Express 会按照它们添加的顺序触发每个 `app.use` 函数——如果我们将新的\
  \ `basicAuth` 函数放在 `graphqlHTTP` 函数 *之后*，那么顺序将是不正确的。\n\n```\n67 app.use(basicAuth(function(user,\
  \ pass) {\n68   return pass === 'mypassword1';\n69 }));\n70 \n71 app.use('/graphql',\
  \ graphqlHTTP({ schema: Schema, graphiql: true }));\n```\n\n现在我们将允许任何拥有正确密码的用户。重启你的服务器并尝试运行此\
  \ `curl` 命令来测试一个简单的查询：\n\n```\n$ curl -XPOST -H 'content-type:application/graphql'\
  \ http://localhost:30\\\n00/graphql -d '{ node(id:\"users:4\") { id } }'\nUnauthorized\n\
  ```\n\n由于我们没有指定用户名或密码，我们的查询失败了。尝试下一个命令来正确地传递我们的凭据：\n\n```\n$ curl -XPOST -H 'content-type:application/graphql'\
  \ --user 1:mypassword\\\n1 http://localhost:3000/graphql -d '{ node(id:\"users:4\"\
  ) { id } }'\n{\"data\":{\"node\":{\"id\":\"users:4\"}}}\n```\n\n太棒了，现在我们的身份验证工作正常。你也可以在\
  \ Chrome 和 Firefox 中尝试，它们提供了输入用户名和密码的图形用户界面。\n\n这里的核心概念是，身份验证通常与 GraphQL 架构解耦。将用户名和密码传递到\
  \ GraphQL 查询中以验证用户（当然是通过 HTTPS）是完全可能的，但惯用的 GraphQL 倾向于将这些点分离。\n\n## Authorization（授权）\n\
  \n现在来处理授权。还记得在上一章中我们提到了 `viewer` 字段的想法，它代表数据图中的登录用户节点。我们将该字段添加到架构中，并允许我们的解析代码感知\
  \ `viewer` 的权限。\n\n通过使用 `basic-auth-connect`，我们可以访问每个 Express 请求上的 `user` 属性。如何确定发出每个请求的用户的具体细节将取决于你的身份验证库，但我们只需要获取该\
  \ `request.user` 属性并转发到我们的 GraphQL 解析器：\n\n```\n77 app.use('/graphql', graphqlHTTP((req)\
  \ => {\n78   const context = 'users:' + req.user;\n79   return { schema: Schema,\
  \ graphiql: true, context: context, pretty: tr\\\n80 ue };\n81 }));\n```\n\n我们现在不再对所有请求返回相同的\
  \ `schema` 和 `graphiql` 设置，而是为每个 GraphQL 查询返回一个不同的配置对象。这个新配置将 `context` 属性设置为用户名，例如之前示例中的\
  \ `user1`。\n\n下一个问题是，如何在 GraphQL 字段内部访问该 `context`？回想本章前面的内容，每个 `resolve` 函数都会接收一些参数。我们对\
  \ `args` 参数非常熟悉，但事实证明 `context` 也被传递了。\n\n以下是我们利用这些知识添加 `viewer` 字段的方式：\n\n```\n\
  20 const RootQuery = new GraphQLObjectType({\n21   name: 'RootQuery',\n22   description:\
  \ 'The root query',\n23   fields: {\n24     viewer: {\n25       type: NodeInterface,\n\
  26       resolve(source, args, context) {\n27         return loaders.getNodeById(context);\n\
  28       }\n29     },\n```\n\n如果你重启服务器，你应该能够像这样 `cURL` 端点：\n\n```\n$ curl -XPOST\
  \ -H 'content-type:application/graphql' --user 1:mypassword\\\n1 http://localhost:3000/graphql\
  \ -d '{ viewer { id } }'\n{\n  \"data\": {\n    \"viewer\": {\n      \"id\": \"\
  users:1\"\n    }\n  }\n}\n```\n\n你可以探索使用 `... on User` 内联片段来查询。……不仅 `viewer` 字段可以访问\
  \ `context`，`resolve` 函数也有访问。我们通过在 `resolve` 函数中转发 `context` 开始：\n\n```\n112   \
  \      resolve(source, args, context) {\n113           return loaders.getIdsUser(source,\
  \ context).then(\\\n114 ({ rows, pageInfo }) => {\n```\n\nGraphQL 架构不应直接处理授权，这一责任应属于数据加载库或服务，正如我们在这里所示。在\
  \ `getIdsUser` 中，我们需要从数据库加载每个帖子的 `level`。我们需要做的只是将其添加到 `select` 参数中：\n\n```\n106\
  \   let query = table\n107     .select(table.id, table.created_at, table.level)\n\
  108     .where(table.user_id.equals(userSource.id))\n109     .order(table.created_at.asc)\n\
  110     .limit(first + 10);\n```\n\n除了运行查询获取所有帖子外，我们还将运行另一个查询来获取 `context` 的所有用户访问权限。我们将使用该权限列表来过滤结果。\n\
  \n```\n120   return Promise.all([\n121     database.getSql(query.toQuery()),\n122\
  \     getFriendshipLevels(context)\n123   ]).then(([ allRows, friendshipLevels ])\
  \ => {\n124     allRows = allRows.filter((row) => {\n125       return canAccessLevel(friendshipLevels[userSource.id],\
  \ row.level);\n126     });\n127     const rows = allRows.slice(0, first);\n```\n\
  \n我们引用了两个尚未实现的函数，`getFriendshipLevels` 和 `canAccessLevel`。在处理它们之前，请注意这可能会为我们的系统引入\
  \ bug。我们之前根据 `allRows` 的长度计算 `hasNextPage`，但现在 `allRows` 可能根据隐私设置被截断。这凸显了高度感知授权的系统的复杂性；此问题的简单缓解方法是从数据库中预读更多行，我们在上面已经做了修改（`first\
  \ + 10`）。\n\n`getFriendshipLevels` 的定义与我们的其他查询类似：\n\n```\n74 const getFriendshipLevels\
  \ = (nodeId) => {\n75   const { dbId } = tables.splitNodeId(nodeId);\n76 \n77  \
  \ const table = tables.usersFriends;\n78   let query = table\n79     .select(table.star())\n\
  80     .where(table.user_id_a.equals(dbId));\n81 \n82   return database.getSql(query.toQuery()).then((rows)\
  \ => {\n83     const levelMap = {};\n84     rows.forEach((row) => {\n85       levelMap[row.user_id_b]\
  \ = row.level;\n86     });\n87     return levelMap;\n88   });\n89 };\n```\n\n\n\n\
  \n[content]\n最后，我们将行数组转换为对象，以获得稍微高效的 API（如果你愿意的话，也可以使用单个 `reduce` 函数来实现此转换）。\n\n\
  最后一部分是 `canAccessLevel`。由于我们的隐私设置是完全线性的，我们可以将设置表示为数组并使用索引进行简单的比较：\n\n```\n91 const\
  \ canAccessLevel = (viewerLevel, contentLevel) => {\n92   const levels = ['public',\
  \ 'acquaintance', 'friend', 'top'];\n93   const viewerLevelIndex = levels.indexOf(viewerLevel);\n\
  94   const contentLevelIndex = levels.indexOf(contentLevel);\n95 \n96   return viewerLevelIndex\
  \ >= contentLevelIndex;\n97 };\n```\n\n这一切并不难，对吧？我们可以通过一些查询来测试一下。以用户 `1` 登录（用户名为\
  \ `1`，密码为 `mypassword1`）并运行此查询：\n\n```\n 1 {\n 2   node(id:\"users:2\") {\n 3  \
  \   ... on User {\n 4       posts {\n 5         edges {\n 6           node {\n 7\
  \             id\n 8             ... on Post {\n 9               body\n10      \
  \       }\n11           }\n12         }\n 13       }\n 14     }\n 15   }\n 16 }\n\
  ```\n\n作为返回，你不会看到任何帖子。这是因为我们的 `context`（用户 1）与我们访问的节点（用户 2）不是朋友，而他们的帖子级别为 `friend`。\n\
  \n现在打开一个无痕窗口，以用户 `5` 登录，运行相同的查询。你会看到一个帖子！\n\n```\n 1 {\n 2   \"data\": {\n 3   \
  \  \"node\": {\n 4       \"posts\": {\n 5         \"edges\": [\n 6           {\n\
  \ 7             \"node\": {\n 8               \"id\": \"posts:3\",\n 9         \
  \      \"body\": \"Hard at work studying for finals...\"\n10             }\n 11\
  \           }\n 12         ]\n 13       }\n 14     }\n 15   }\n 16 }\n```\n\n这是因为用户\
  \ 5 实际上是用户 2 的朋友。这是一个简单的例子，但它突出了关于 GraphQL 的几点：\n\n- GraphQL 服务器库通常允许你转发某种查询层级的\
  \ `context`。\n- 你的 GraphQL Schema 代码不应该关心授权逻辑，而是将其推给你的底层数据代码。\n\n我们已经从服务器读取了一段时间的数据，但现在我们应该尝试通过变异（mutations）来更改一些内容。\n\
  \n### 丰富的变异\n\n如果你的应用程序只能从服务器读取数据，那么它的功能是有限的——通常情况下我们必须上传一些新数据。回想上一章，在 GraphQL 中，我们将这些更新称为\
  \ `mutations`。\n\n我们将向 Schema 中添加一个创建一个新帖子的变异。该字段将具有用于帖子正文和朋友隐私层级的字符串参数，并将允许我们查询有关结果帖子对象的更多信息。\n\
  \n在本章稍早时候，我们在 `server.js` 文件中添加了一个简单的键值变异。让我们更新该定义，以使用我们创建新帖子时预期的参数和类型：\n\n```\n\
  \ 9 import { GraphQLSchema, GraphQLObjectType, GraphQLString,\n10   GraphQLNonNull,\
  \ GraphQLID, GraphQLEnumType } from 'graphql';\n```\n\n```\n44 const LevelEnum =\
  \ new GraphQLEnumType({\n45   name: 'PrivacyLevel',\n46   values: {\n47     PUBLIC:\
  \ {\n48       value: 'public'\n49     },\n50     ACQUAINTANCE: {\n51       value:\
  \ 'acquaintance'\n52     },\n53     FRIEND: {\n54       value: 'friend'\n55    \
  \ },\n56     TOP: {\n57       value: 'top'\n58     }\n59   }\n60 });\n61 \n62 const\
  \ RootMutation = new GraphQLObjectType({\n63   name: 'RootMutation',\n64   description:\
  \ 'The root mutation',\n65   fields: {\n66     createPost: {\n67       type: PostType,\n\
  68       args: {\n69         body: {\n70           type: new GraphQLNonNull(GraphQLString)\n\
  71         },\n72         level: {\n73           type: new GraphQLNonNull(LevelEnum),\n\
  74         }\n75       },\n76       resolve(source, args, context) {\n77       \
  \  return loaders.createPost(args.body, args.level, context).then(\\\n\n78 (nodeId)\
  \ => {\n79           return loaders.getNodeById(nodeId);\n80         });\n81   \
  \    }\n82     }\n83   }\n84 });\n```\n\n首先，我们实例化了一个新类型的对象 `GraphQLEnumType`。我们在上一章中只简要提到了\
  \ `Enum` GraphQL 类型，但它的工作方式与许多编程语言中的枚举（enums）类似。因为我们的 `level` 参数应该是固定选项中的之一，因此我们在\
  \ Schema 层级通过枚举强制执行这一合约。按照惯例，GraphQL 中的枚举使用全大写（`ALL_CAPS`）。\n\n创建完枚举后，我们在新的 `createPost`\
  \ 变异的 `args` 属性中使用了它。注意，除了参数之外，`createPost` 还需要允许我们查询有关结果帖子对象的更多信息。\n\n```\n116\
  \ const { connectionType: PostsConnectionType } = connectionDefinitions({\\\n117\
  \  nodeType: PostType });\n```\n163\n```\n\n### Relay 与 GraphQL\n\n我们开发的“Facebook\
  \ Lite 版” Schema 可能很小，但它应该让你对如何在 GraphQL 中组织常见操作有一个了解。它刚好兼容 Relay，这是 Facebook 用于处理\
  \ GraphQL 的前端库。\n\n除了发布 Relay，Facebook 还发布了一个库来帮助你更容易地构建兼容 Relay 的服务器。这个 `graphql-relay`\
  \ 包减少了我们经历许多模板代码，特别是对于 Relay 的一些更强大的功能。\n\n你应该阅读文档以获取所有细节，我们将把部分代码转换为使用此库。首先，我们需要通过\
  \ npm 安装它：\n\n```\n$ npm install graphql-relay@0.4.1 --save --save-exact\n```\n\n\
  GraphQL-Relay 在连接字段（connection fields）方面特别有用。虽然我们在 Schema 中只有一个真正的连接字段（`posts`），但你可以想象在更大的应用程序中为每个连接重复类型和代码将变得非常繁琐。幸运的是，我们只需要快速导入：\n\
  \n```\n15 import {\n16   connectionDefinitions\n17 } from 'graphql-relay';\n```\n\
  \n然后删除我们所有的连接类型，直接跳到 `UserType`：\n\n```\n34 const resolveId = (source) => {\n35\
  \   return tables.dbIdToNodeId(source.id, source.__tableName);\n36 };\n37 \n38 export\
  \ const UserType = new GraphQLObjectType({\n39   name: 'User',\n```\n\n\n\n\n除了连接（connections）之外，`GraphQL-Relay`\
  \ 库还提供了用于简化[节点类型结构](https://github.com/graphql/graphql-relay-js#object-identification)以及[与\
  \ Relay 兼容的变异（mutations)](https://github.com/graphql/graphql-relay-js#mutations)的功能。我们将在后续的\
  \ Relay 中详细探讨，但 Relay 对变异的工作方式实施了一些规则，这与连接所需的某些类型和参数的要求类似。\n\nRelay 所需的 GraphQL\
  \ 服务器更改并非特定于 `GraphQL-JS` 或通用的 `JavaScript`。任何使用任何语言编写的 GraphQL 服务器都可以实现与 Relay\
  \ 的兼容，希望本章能让你更熟悉任何 GraphQL Schema 的基本构建组件。\n\n### 性能：N+1 查询\n\n现在我们的 Schema 已经定型，我们可以重新考虑性能问题了。在深入之前，请记住，不同产品的性能需求可能极其巨大。工程师应该仔细考虑在增加额外复杂性的风险下编写更高效代码的付出的成本与收益。\n\
  \n让我们考虑这样一个查询：\n\n```graphql\n 1 {\n 2   node(id:\"users:4\") {\n 3     ... on User\
  \ {\n 4       friends {\n 5         edges {\n 6           node {\n 7           \
  \  id\n 8             about\n 9             name\n10           }\n 11         }\n\
  \ 12       }\n 13     }\n 14   }\n 15 }\n```\n\n在底层，我们当前的 GraphQL 解析代码将触发一次数据库查询来获取\
  \ `\"users:4\"` 的节点，一次查询来获取朋友 ID 列表，并为每个 `friends` 边触发 N 次数据库查询。这通常被称为 [N+1 查询问题](https://secure.phabricator.com/book/phabcontrib/article/n_plus_one/)，在使用任何\
  \ Web 框架或 ORM 时很容易发生。你可以想象，对于缓慢的数据库或大量的边，这将导致性能下降。我们可以通过以下原始 SQL 将其视觉化：\n\n```sql\n\
  1 SELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\" = 4) LIMIT 1\n2 SELECT\
  \ \"users_friends\".\"user_id_b\" FROM \"users_friends\" WHERE (\"users_f\\\n3 riends\"\
  .\"user_id_a\" = 4)\n4 SELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\"\
  \ = 1) LIMIT 1\n5 SELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\" = 3)\
  \ LIMIT 1\n6 SELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\" = 2) LIMIT\
  \ 1\n```\n\n在完美的世界里，我们只需要两次数据库查询：一次检索初始节点，另一个在一次查询中检索所有朋友（或在需要的任何分页限制内）——换句话说，我们对所有朋友查询进行了批量处理。类似于下面的形式：\n\
  \n```sql\n1 SELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\" = 4) LIMIT\
  \ 1\n2 SELECT \"users_friends\".\"user_id_b\" FROM \"users_friends\" WHERE (\"users_f\\\
  \n3 riends\".\"user_id_a\" = 4)\n4 SELECT \"users\".* FROM \"users\" WHERE (1 (id,\
  \ 1, 2)) LIMIT 3\n```\n\n考虑加载用户是如何工作的：它是对 `loaders.getNodeById` 的调用。目前，该函数会立即触发数据库查询，但如果我们可以“等待”一小段时间，收集需要加载的节点\
  \ ID，然后触发像上面那样的查询呢？GraphQL 和 JavaScript 为此类查询的批量处理提供了直观的技术，我们将实现它。\n\nFacebook 维护了一个名为\
  \ [DataLoader](https://github.com/facebook/dataloader) 的库来提供帮助，这是一个独立 React 或 GraphQL\
  \ 的通用 JavaScript 库。你使用该库创建加载器（loaders），加载器是自动批量获取相似数据的对象。例如，你会实例化一个 `UserLoader`\
  \ 来从数据库加载用户：\n\n```javascript\n 1 const UserLoader = new DataLoader((userIds) =>\
  \ {\n 2   const query = table\n 3     .select(table.star())\n 4     .where(table.id.in(userIds))\n\
  \ 5     .toQuery();\n 6 \n 7   return database.getSql(query.toQuery());\n 8 });\n\
  \ 9 \n10 // 在别处，加载单个用户\n11 function resolveUser(userId) {\n12   return UserLoader.load(userId);\n\
  13 }\n```\n\n注意 `UserLoader.load` 如何接受单个 `userId` 作为参数，但其内部函数的参数是 `userIds` 数组。这意味着如果我们从多个地方连续快速调用\
  \ `UserLoader.load`，我们就有权构建一个更高效的数据库查询。\n\n在我们的应用中，绝大多数代码都触及了 `loaders.getNodeById`，这使其成为自动批量处理的理想候选者。调用\
  \ `getNodeById` 的代码都不需要更改；相反，我们将在内部使用 DataLoader 对节点获取进行批量处理。\n\n首先，从 npm 安装 DataLoader：\n\
  \n```bash\n$ npm install dataloader@1.2.0 --save --save-exact\n```\n\n现在处理对 `loaders.js`\
  \ 的修改。我们将为每个表创建一个数据加载器，这是开始优化的合理方法。代码开始如下：\n\n```javascript\n 1 import * as database\
  \ from './database';\n 2 import * as tables from './tables';\n 3 \n4 import DataLoader\
  \ from 'dataloader';\n 5 \n6 const createNodeLoader = (table) => {\n 7   return\
  \ new DataLoader((ids) => {\n 8     const query = table\n 9       .select(table.star())\n\
  10       .where(table.id.in(ids))\n11       .toQuery();\n 12\n13     return database.getSql(query).then((rows)\
  \ => {\n14       rows.forEach((row) => {\n15         row.__tableName = table.getName();\n\
  16       });\n17       return rows;\n18     });\n19   });\n20 };\n```\n\n我们的 `createNodeLoader`\
  \ 是一个工厂函数，返回 `DataLoader` 的新实例。我们构建了一个类似于 `SELECT * FROM $TABLE WHERE ID IN($IDS)`\
  \ 的查询，这让我们能够通过单次查询选择多个节点。\n\n现在我们需要调用工厂函数并将其存储在常量中：\n\n```javascript\n22 const nodeLoaders\
  \ = {\n23   users: createNodeLoader(tables.users),\n24   posts: createNodeLoader(tables.posts),\n\
  25   usersFriends: createNodeLoader(tables.usersFriends),\n26 };\n```\n\n最后，我们更改\
  \ `getNodeById` 的定义以使用相应的加载器：\n\n```javascript\n28 export const getNodeById = (nodeId)\
  \ => {\n29   const { tableName, dbId } = splitNodeId(nodeId);\n30   return nodeLoaders[tableName].load(dbId);\n\
  31 };\n```\n\n如果你打开 GraphQL 并尝试此查询，你会注意到服务器中的 SQL 日志正在恰当地批量处理我们的获取：\n\n```graphql\n\
  1 {\n2   user3: node(id:\"users:3\") {\n3     id\n4   }\n5   user4: node(id:\"users:4\"\
  ) {\n6     id\n7   }\n8 }\n```\n\n```text\n$ node.js\n{ starting: true }\n{ running:\
  \ true }\nSELECT \"users\".* FROM \"users\" WHERE (\"users\".\"id\" IN ($1, $2))\n\
  [ '3', '4' ]\n```\n\n注意，我们的高层 Schema 代码对此优化并不感知，并且不需要更改。通常情况下，你应该倾向于将优化留在加载器和数据服务层，以便所有所有者受益。\n\
  \nDataLoader 是一个简单但强大的工具。虽然我们展示了它的批量处理能力，它也可以作为缓存——如果你想了解更多，请查看它的[文档](https://github.com/facebook/dataloader#getting-started)并考虑观看[其维护者的演讲](https://www.youtube.com/watch?v=OQTnXCDywA)。\n\
  \n### 总结\n\n在本章涵盖了大量内容。我们设计了 Schema，从零创建了 GraphQL 服务器，将其连接到关系型数据库，并探索了一些性能优化。无论你的生产环境语言和栈，这些概念适用于所有的\
  \ GraphQL 服务器实现。此外，当你从前端连接 GraphQL 服务器时，这将给你更多的理解和背景。\n\n我们在本章使用了 Facebook 维护的 GraphQL-JS\
  \ 库，但 GraphQL 生态系统正在爆发。这里是一些你可能感兴趣的其他热门选项和技术：\n\n- [GraphQL-ruby](https://github.com/rmosolgo/graphql-ruby)\n\
  - [Graphene](https://github.com/graphql-python/graphene)\n- [Sangria](https://github.com/sangria-graphql/sangria)\
  \ Scala\n- [Apollo Server](http://docs.apollostack.com/apollo-server/tools.html)\
  \ Node\n- [Graffiti-Mongoose](https://github.com/RisingStack/graffiti-mongoose)\
  \ Node 和 MongoDB\n\n\n\n\n\n*   类似 [Reindex](https://www.reindex.io/) 和 [Graphcool](https://graph.cool/)\
  \ 这种用于托管 GraphQL 服务器的服务\n\n现在我们已经学习了如何消费 GraphQL 和编写 GraphQL 服务器，现在是时候回顾目前为止学的内容并学习\
  \ Relay 了。\n\n## Relay Classic\n\n### 简介\n\n> 注意：本章涵盖了 [Relay Classic](https://facebook.github.io/relay/docs/en/classic/classic-api-reference-relay.html)。\n\
  \n> 下面的章节将有助于建立使用 Relay Modern 的思维模型，某些 API 已经发生了变化。截至 2018/2019 年，我们建议查看 [Apollo](https://www.apollographql.com/docs/react/)，它是\
  \ Relay 的极佳替代方案。\n\n> 如果你有兴趣通过将本章转换为 Apollo 来成为本书的贡献者，请联系我们\n\n在客户端-服务器 Web 应用中选择合适的数据架构可能是困难的。当你尝试实现数据架构时，有无数决策需要做出。例如：\n\
  \n*   我们将如何从服务器获取数据？\n*   如果获取失败了该怎么办？\n*   我们如何查询数据之间的依赖关系和关联？\n*   我们如何在整个应用中保持数据一致性？\n\
  *   我们如何防止开发者无意破坏彼此的组件？\n*   我们如何能够移动得更快，编写应用程序特定的功能，而不是花时间在服务器之间来回推送数据？\n\n幸运的是，Relay\
  \ 对这些问题都有一套理论。更好的是：它是该理论的实现，一旦设置好，用起来会非常愉快。但问这个问题是很自然的：什么是 Relay？\n\nRelay 是一个将你的\
  \ React 组件连接到 API 服务器的库。\n\n我们在书中早些时候 提到过 GraphQL，Relay、GraphQL 和 React 之间的关系可能不会立即明确。你可以将\
  \ Relay 想象成 GraphQL 和 React 之间的胶水。\n\nRelay 之优之处在于：\n\n*   组件声明了它们运行所需的数据\n*   它管理了我们*如何*以及*何时*获取数据\n\
  *   它智能地聚合了查询，因此我们不会获取超过所需的数据\n*   它为我们导航对象之间的关系以及对其进行变动（mutating）提供了清晰的模式\n\n我们在本章中将看到的\
  \ Relay 最有帮助的内容之一是，GraphQL 查询`与组件同地（co-located with the component）`。这带给我们的好处是，可以在组件本身旁边看到渲染该组件所需值的清晰规范。\n\
  \n每个组件都指定了它所需，而 Relay 在执行查询之前会检查是否存在重复。Relay 会聚合查询、处理响应，然后只向每个组件返回它所请求的数据。\n\nGraphQL\
  \ 可以独立于 Relay 使用。从理论上讲，你可以创建一个 GraphQL 服务器来获得几乎你想要的任何架构。然而，Relay 有一套规范，你的 GraphQL\
  \ 服务器必须遵循该规范才能与 Relay 兼容。我们将讨论这些约束条件。\n\n### 我们将涵盖的内容\n\n在本章中，我们将通过过一个关于`如何在客户端应用中设置和使用\
  \ Relay`的实战教程。\n\n在本章中，我们将：\n\n*   解释 Relay 的各种概念\n*   描述如何在我们的应用中设置 Relay（带路由）\n\
  *   展示如何从 Relay 获取数据并到我们的组件中\n*   展示如何使用变动（mutations）更新服务器上的数据\n*   在此过程中强调有关 Relay\
  \ 的技巧和窍门\n\n在本章结束时，你将理解 Relay 是什么，如何使用它，并为将 Relay 集成到自己的应用中下坚实的基础。\n\n### 我们正在构建什么\n\
  \n#### 客户端\n\n在本章中，我们将构建一个简单的书店。我们将有三个页面：\n\n*   书籍列表页，显示我们所有出售的书籍。\n![Books Store\
  \ Page](img/relay----relay-bookstore-final-books.png)\n书店页面\n*   作者简介页，显示作者信息和他们创作的书籍。\n\
  ![Author Page](img/relay----relay-bookstore-final-author.png)\n作者页面\n*   书籍详情页，显示单本书以及该书的作者。我们还在此页面上`编辑（edit）`书籍。\n\
  ![Book Listing Page](img/relay----relay-bookstore-final-book-edit.png)\n书籍列表页\n\n\
  这里的数据模型非常直观：一本书拥有（并属于）多位作者。这些数据通过 API 服务器提供给我们的应用。\n\n#### 服务器\n\n我们在此应用程序的示例代码中提供了一个兼容\
  \ Relay 的 GraphQL 演示服务器。在本章中，我们不会讨论服务器的实现细节。如果你对构建 GraphQL 服务器感兴趣，请查看章节“GraphQL\
  \ 服务器”。\n\n#### 尝试应用\n\n你可以在代码下载的 `relay` 文件夹中找到本章的项目：\n\n```\n$ cd relay/bookstore\n\
  ```\n\n我们包含了已完成服务器和完整的客户端。在运行它们之前，我们需要在客户端和服务器上都运行 `npm install`：\n\n```\n$ npm\
  \ install\n$ cd client\n$ npm install\n$ cd ..\n```\n\n接下来，你可以通过两个独立的标签页分别运行它们：\n\
  \n```bash\n# 标签页一\n$ npm run server\n# 标签页二\n$ npm run client\n```\n\n或者我们提供了一个方便的命令可以同时运行它们：\n\
  \n```bash\n$ npm start\n```\n\n当它们运行时，你应该能够通过 `http://localhost:3001` 访问 GraphQL\
  \ 服务器，通过 `http://localhost:3000` 访问客户端应用。\n\n\n\n\n\n```\n-- bookstore\n    |--\
  \ README.md\n    |-- client\n    |   |-- config                         //客户端配置\n\
  \    |   |   |-- babelRelayPlugin.js        //自定义的 babel 插件\n    |   |   |-- webpack.config.dev.js\
  \      // webpack 配置\n    |   |   `-- webpack.config.prod.js\n    |   |-- package.json\n\
  \    |   |-- public                         // 图片和 index.html\n    |   |   |-- images/\n\
  \    |   |   `-- index.html\n    |   |-- scripts                        // 辅助脚本\n\
  \    |   |   |-- build.js\n    |   |   |-- start.js\n    |   |   `-- test.js\n \
  \   |   `-- src\n    |       |-- components                 // 组件在这里\n    |    \
  \   |   |-- App.js\n    |       |   |-- AuthorPage.js\n    |       |   |-- BookItem.js\n\
  \    |       |   |-- BookPage.js\n    |       |   |-- BooksPage.js\n    |      \
  \ |   |-- FancyBook.js\n    |       |   `-- TopBar.js\n    |       |-- data    \
  \                   // graphql 元数据\n    |       |   |-- schema.graphql\n    |  \
  \     |   `-- schema.json\n    |       ||-- index.js\n    |       |-- mutations\
  \                  // mutations 用于更改\n    |       |   |-- UpdateBookMutation.js\n\
  \    |       |-- routes.js                  // 我们的路由\n    |       |-- steps/   \
  \                  // 中间文件\n    |       `-- styles                     // css 样式在这里\n\
  \    |-- models.js                          // 服务模型\n    |-- package.json\n    |--\
  \ schema.js                          // 服务端的 graphql schema\n    |-- server.js \
  \                         // 我们的服务器定义\n    |-- start-client.js\n    |-- start-server.js\n\
  \    `-- tools\n        `-- update-schema.js               // 生成 schema 的辅助工具\n\
  ```\n\n欢迎随意查看我们提供的示例代码，但不必担心现在理解每一个文件。我们将涵盖所有重要的部分。\n\n# Relay 是一种数据架构\n\nRelay\
  \ 是一个运行在客户端的 JavaScript 库。你将 Relay 连接到你的 React 组件上，然后 Relay 就会从你的服务器获取数据。当然，你的服务器也需要符合\
  \ Relay 的协议，我们也会讨论这一点。\n\nRelay 设计初目的是为你的 React 应用提供数据骨干。这意味着，理想情况下，我们将使用 Relay\
  \ 来处理所有的数据加载，并为应用程序维护中央、权威的状态。\n\n由于 Relay 拥有自己的存储器（store），因此它能够缓存数据并高效地解析查询。如果你有两个组件关注相同的数据，Relay\
  \ 会将这两个查询合并为一个，然后将适当的数据分发给每个组件。这具有双重好处：最大限度地减少了我们所需的服务器调用次数，同时允许单个组件在本地指定它们所需的数据。\n\
  \n由于 Relay 持有你数据的中央存储器，这意味着它与其它也维护中央存储器的数据架构（如 Redux）并不真正兼容。你无法拥有两个状态状态存储器，因此 Redux\
  \ 和 Relay 的当前版本本质上是不兼容的。\n\n# Relay GraphQL 规范\n\n我们需要澄清的一点是 Relay 和 GraphQL 之间的关系。\n\
  \n我们的 GraphQL 服务器定义了 GraphQL schema 以及如何针对该 schema 解析查询。GraphQL 本身允许你定义各种 schema。在大多数情况下，它并不规定你的\
  \ schema 结构应该是怎样的。\n\n**Relay 在 GraphQL 之上定义了一套规范**。为了使用 Relay，你的 GraphQL 服务器必须遵循一套特定的指南。\n\
  \n从高层面上来说，这些规范是：\n\n1. 一种**通过 ID 获取任何对象**（无论类型如何）的方法\n2. 一种**遍历对象之间关系**（称为“connections”）并带有分页功能的方法\n\
  3. 一个围绕使用 **mutations（变异）**更改数据的结构\n\n这三个要求允许我们构建复杂且高效的应用。在本章中，我们将这些通用指南具体化。\n\n\
  让我们直接在 GraphQL 服务器上探索这三个 Relay 规范的实现。在章节后的部分，我们将在客户端应用中实现它们。\n\n## 在 GraphQL 中探索\
  \ Relay 规范\n\n确保你已如上述运行了 GraphQL 服务器，并在浏览器的地址 `localhost:3001` 打开它。\n\n记住 GraphiQL\
  \ 会读取我们的 schema 并提供一个文档查看器来导航类型。点击 GraphiQL 中的“Docs”链接以显示我们 schema 的“根类型”（Root Types）。\n\
  \n![带有文档的 GraphiQL 界面](img/relay----relay-graphiql-docs.png)\n\n带有文档的 GraphiQL 界面\n\
  \n## 通过 ID 获取对象\n\n在我们的服务器中，有两个模型：`Author` 和 `Book`。我们要做的第一件事是根据 ID 查找特定对象。\n\n\
  假设我们想创建一个页面来显示特定作者的信息。我们可能会有一个类似于 `/authors/abc123` 的 URL，其中 `abc123` 是作者的 ID。我们希望\
  \ Relay 询问我们的服务器：“作者 `abc123` 的信息是什么？”在这种情况下，我们将使用像下面定义的 GraphQL 查询。\n\n然而，我们目前面临着一个小“鸡生蛋蛋”的问题：我们不知道任何单独记录的\
  \ ID。\n\n所以，让我们加载整个作者 `name` 列表，然后取其中一个 ID。在 GraphiQL 中输入以下查询：\n\n```graphql\nquery\
  \ {\n  authors {\n    id\n    name\n  }\n}\n```\n\n点击运行：\n\n![带有文档的 GraphiQL 界面](img/relay----relay-graphiql-docs.png)\n\
  \n带有文档的 GraphiQL 界面\n\n现在我们有了作者 ID，可以查询 `author` 获取名称：\n\n```graphql\nquery {\n\
  \  author(id: \"abc123\") {\n    id\n  }\n}\n```\n\n响应：\n\n```json\n{\n  \"data\"\
  : {\n    \"author\": {\n      \"id\": \"abc123\",\n      \"name\": \"Anthony Accomazzo\"\
  \n    }\n  }\n}\n```\n\n这通了！但它并没有那么用，因为我们没有关于该作者的其他数据。让我们尝试获取名称：\n\n```graphql\n\
  query {\n  node(id: \"123\") {\n    id\n    name\n  }\n}\n```\n\n这报错了，错误如下：\n\n\
  ```\n无法在类型 \"Node\" 上查询字段 \"name\"。你是否想对 \"Author\" 或 \"Book\" 使用 inline fragment？\n\
  ```\n\n发生了什么？因为 `Node` 是一个通用类型，我们无法查询 `name` 字段。相反，我们需要提供一个*片段*（fragment），表示如果我们查询的是\
  \ `Author`，则返回 `Author` 特有的字段。所以我们可以这样调整查询：\n\n```graphql\nquery {\n  node(id: \"\
  123\") {\n    id\n    ... on Author {\n      name\n    }\n  }\n}\n```\n\n响应：\n\n\
  ```json\n{\n  \"data\": {\n    \"node\": {\n      \"id\": \"123\",\n      \"name\"\
  : \"Anthony Accomazzo\"\n    }\n  }\n}\n```\n\n通了！我们能够通过 ID 获取作者。这里的核心思想是，我们可以通过\
  \ `node` 查询获取系统中的**任何对象**（这是 Relay 的要求）。例如，如果我们有一个 `Book` ID，我们也可以同样使用 `node` 查询查找书籍。\n\
  \n\n\n\nRelay 使用 `node` 接口，特别用于*重新获取对象*。在编写应用程序时，我们可能有有几十种不同的方法来加载各种对象。`node` 接口背后的设计理念是为\
  \ Relay 提供一种一致且方便的方式来询问服务器：“给定这个 ID，该对象的最新值是什么？”\n\n既然我们已经可以查询单个 `Node` 了，我们需要讨论一下如何遍历它们*之间*的关系。在我们的示例应用中，我们将在主页显示书籍列表，并且我们希望能够加载编写这些书籍的作者。\n\
  \n在 Relay 中，我们将通过使用 `connection`（连接）来表示 `Author` 和 `Book` 之间的关系。\n\n## 遍历连接 (Walking\
  \ Connections)\n\n一个 `Author` 可能贡献过几本 `Book`。\n\n如果你熟悉传统的关系型数据库，可能见过这种关系被建模为：\n\n\
  *   一个带有 `id` 的 `authors` 表\n*   一个带有 `id` 的 `books` 表\n*   以及一个同时持有 `author_id`\
  \ 和 `book_id` 的 `authorships` 表\n\n在这种场景下的思路是，对于每一对 `Author`/`Book`，你都会创建一个新的“连接模型”名为\
  \ `Authorship`，它代表贡献了特定 `Book` 的 `Author`。这种想法有时被称为“多对多关系”（has-and-belongs-to-many）。\n\
  \n与此类似，Relay 也定义了一个“连接模型”，用于表示两个模型之间的关系。准确地说，Relay 规定了**两个**：\n\n1.  `connection`\
  \ 模型，它指定了两个模型之间的关系并保留分页数据；以及\n2.  `edge` 模型，它封装了游标（cursor）以及特定的节点（模型）数据。\n\n这在你初第一次接触到它时可能看起来有些大材小用，但请意识到这是一个强大且灵活的模型，它为你的所有模型提供了一致的分页功能。\n\
  \n让我们尝试几个遍历这些连接的查询。\n\n下面是一个可以获取作者及其所有书籍名称的查询：\n\n```\nquery {\n  author(id: \"\
  QXV0aG9yOmZjMjkyYmQ3ZGYwNzE4NThjMmQwZjk1NQ==\") {\n    id\n    name\n    books {\n\
  \      count\n      edges {\n        node {\n          id\n          name\n    \
  \    }\n      }\n    }\n  }\n}\n```\n\n![GraphiQL Author with Books](img/relay----relay-graphiql-author-w-books.png)\n\
  \nGraphiQL 作者及书籍\n\n在 GraphiQL 界面中点击查看 `Author` 的文档。注意在 `Author` 类型上，`books` 返回的不是一个\
  \ `Book` 数组，而是：\n\n1.  接受参数，例如 `first` 或 `last`；并且\n2.  返回一个 `AuthorBooksConnection`\n\
  \n![GraphiQL Author Type](img/relay----relay-graphiql-docs-author-type.png)\n\n\
  GraphiQL 作者类型\n\nRelay 的设计初衷是处理包含大量项的关系。在有太多的 `Book` 多到无法一次性加载的情况下，我们可以使用这些参数来限制返回的结果数量。我们使用\
  \ `first` 和 `last` 参数来表示我们想要检索的项目数量。\n\n`AuthorBooksConnection` 有三个字段：\n\n*   `pageInfo`\n\
  *   `edges` 以及\n*   `count`\n\n`count` 告诉我们拥有的 `edges` 总数（在这种例中，是此人编写的书籍数量）。\n\n\
  `pageInfo` 为我们提供信息，例如是否存在上一页或下一页，以及该页的起始和结束游标。我们稍可以使用这些游标来请求下一页（或上一页）。\n\n`edges`\
  \ 包含了包含了 AuthorBooksEdge` 列表。查看 GraphiQL 界面中的 `AuthorBooksEdge` 类型。\n\n![GraphiQL\
  \ `AuthorBooksEdge` Type](img/relay----relay-graphiql-docs-author-books-edge.png)\n\
  \nGraphiQL `AuthorBooksEdge` 类型\n\n`AuthorBooksEdge` 有两个字段：\n\n*   `node` 和\n* \
  \  `cursor`\n\n`cursor` 是一个我们可以从该记录中用于分页的字符串。在这里我们可以看到 `node` 的类型是 `Book`。在那个 `node`\
  \ 内部就是我们寻找的硬性数据。\n\n虽然我们将这些连接用于处理多对多关系，但导航一对多关系的方法是相同的。通过使用这种用于遍历模型间关系的标准，可以轻松知道如何访问相关模型，无论关系的类型如何。图中的一切都是节点（nodes）和边（edges）。\n\
  \n此外，通过将分页作为标准的一部分，我们为现实世界的数据集做了考虑，在这些数据集中，我们不会同时加载关系（或表）中的每一条数据。\n\n将分页作为 Relay\
  \ 的标准，使得在 React 应用中标准化分页变得容易得多。\n\n## 使用变异更改数据 (Changing Data with Mutations)\n\n\
  变异是在 Relay/GraphQL 中更改数据的方式。要通过变异更改数据，我们需要：\n\n1.  找到我们要调用的变异\n2.  指定输入参数以及\n3.\
  \  指定在变异完成后想要返回的数据。\n\n例如，假设我们想要更改作者的简介。我们可以执行以下操作：\n\n查询：\n\n```\nmutation {\n\
  \  updateAuthor(input: {\n    id: \"QXV0aG9yOmZjMjkyYmQ3ZGYwNzE4NThjMmQwZjk1NQ==\"\
  ,\n    bio: \"all around guy\"\n  }) {\n    changedAuthor {\n      id\n      name\n\
  \    }\n  }\n}\n```\n\n\n\n\n```javascript\n /* eslint-disable react/prefer-stateless-function\
  \ */\n import React from 'react';\nimport ReactDOM from 'react-dom';\nimport Relay\
  \ from 'react-relay';\n\nimport '../semantic-dist/semantic.css';\nimport './styles/index.css';\n\
  \n// 根据你的服务器 URL 自定义此项\nconst graphQLUrl = 'http://localhost:3001/graphql';\n\n\
  // 使用 \"NetworkLayer\" 配置 Relay\nRelay.injectNetworkLayer(new Relay.DefaultNetworkLayer(graphQLUrl));\n\
  \n// 创建我们将执行的顶层查询\nclass AppQueries extends Relay.Route {\n  static routeName =\
  \ 'AppQueries';\n  static queries = {\n    viewer: () => Relay.QL`\n      query\
  \ {\n        viewer\n      }\n    `\n  };\n}\n\n// 渲染作者列表的基础组件\nclass App extends\
  \ React.Component {\n  render() {\n    return (\n      <div>\n        <h1>Authors\
  \ list</h1>\n        <ul>\n          {this.props.viewer.authors.edges.map(edge =>\
  \ (\n            <li key={edge.node.id}>{edge.node.name}</li>\n          ))}\n \
  \       </ul>\n      </div>\n    );\n  }\n}\n\n// 指定在上方查询使用的片段（fragment）的 Relay\
  \ \nconst AppContainer = Relay.createContainer(App, {\n  fragments: {\n    viewer:\
  \ () => Relay.QL`\n      fragment on Viewer {\n        authors(first: 100) {\n \
  \         edges {\n            node {\n              id\n              name\n  \
  \          }\n          }\n        }\n      }\n    `\n  }\n});\n\nReactDOM.render(\n\
  \  <Relay.Renderer\n    environment={Relay.Store}\n    Container={AppContainer}\n\
  \    queryConfig={new AppQueries()}\n  />,\n  document.getElementById('root')\n\
  );\n```\n\n`relay/bookstore/client/src/steps/index.minimal.js`\n\n在上面的示例中，我们的 `AppContainer`\
  \ 获取了一组作者并在列表中渲染了它们。请注意，这段代码是*声明式*的。也就是说，代码中没有哪部分是在说“向服务器发送一个 POST 请求并将其解释为 JSON”等。相反，我们的组件声明了它需要的数据，而\
  \ Relay 会从服务器获取数据并提供给我们的组件。\n\n### 作者页面预览\n\n让我们来看另一个示例，取自我们的书店应用。这里是 `AuthorPage`\
  \ 组件的版本：\n\n```javascript\n class AuthorPage extends React.Component {\n  render()\
  \ {\n    const {author} = this.props;\n\n    return (\n      <div>\n        <img\
  \ src={author.avatarUrl} />\n        <h1>{author.name}</h1>\n        <p>\n     \
  \     {/* 例如 '2 Books' 或 '1 Book' */}\n          {author.books.count}\n        \
  \  {author.books.count > 1 ? ' Books' : ' Book'}\n        </p>\n        <p>{author.bio}</p>\n\
  \      </div>\n    );\n  }\n}\n\nexport default Relay.createFragmentContainer(AuthorPage,\
  \ {\n  fragments: {\n    author: () => Relay.QL`\n    fragment on Author {\n   \
  \   name\n      avatarUrl\n      bio\n      books {\n        count\n      }\n  \
  \  }`\n  }\n});\n```\n\n`relay/bookstore/client/src/steps/AuthorPage.minimal.js`\n\
  \n这里有两个部分：1. `Relay.createContainer` 语句（带有 `Relay.QL` 查询）和 2. `render()` 函数。\n\n\
  从高层上说，这里发生的是我们的 `Relay.QL` 查询指定了我们要为此作者加载的数据。然后 `author` 通过 `props` 传递给组件，我们进行 `render`\
  \ 这些数据。\n\n![Minimal Author](img/relay----relay-minimal-author.png)\n\n极简作者\n\n\
  我们还没有讨论让我们的应用达到这一步所需的所有配置。我们会讨论的。现在，只需注意，一旦我们完成所有配置，将数据加载到我们的组件中就会变得极其容易（而且**如果我们改变主意，修改我们的查询也非常容易**）。\n\
  \n请注意，当我们在组件上使用 `Relay` 时，我们有两个东西：1. `createContainer` 和 2. 一个 `fragment`（片段）。\n\
  \n### 容器、查询和片段\n\n需要从 Relay 加载数据的组件被称为*容器 (containers)*。容器指定了片段（fragments），这些片段本质上是“部分查询”。片段**指定了此组件正确渲染所需的数据**。\n\
  \n我们使用 `Relay.createContainer` 创建一个 Relay 容器。我们将组件和所需的片段作为参数传递进去。\n\n你的容器指定了它们正确渲染所需的\
  \ `fragments`，但你必须**执行查询来渲染片段**。你可以将这种做法比作组件需要渲染到 DOM 中。**片段在被查询拉取之前是不会被渲染的。**\n\
  \n每个容器指定一个片段（或多个），并在之后的某个点，我们执行一个查询，该查询将使用此片段来获取数据。\n\n也就是说，在这些数据供组件之前，你必须**执行一个包含此片段的查询**。我们将在几分钟后讨论执行查询。\n\
  \n但首先，让我们聊聊 `Relay.QL` 查询。\n\n### 在编译时验证我们的 Relay 查询\n\nGraphQL 的伟大之处之一是我们可以拥有 API\
  \ 的架构（schema）。我们可以在编写客户端代码时利用这一点。\n\n我们在组件中编写查询片段时，看起来如下：\n\n```javascript\n  fragments:\
  \ {\n    author: () => Relay.QL`\n    fragment on Author {\n      name\n      avatarUrl\n\
  \      bio\n      books {\n        count\n      }\n    }`\n  }\n```\n\n`code/relay/bookstore/client/src/steps/AuthorPage.minimal.js`\n\
  \n但请注意，我们将查询放在了字符串中。这写起来很容易，但在处理这些查询的简单实现中，拼写错误可能是错误的根源，因为没有方法验证它们的格式是否正确。在拼写错误的情况下，我们在运行这些查询之前甚至根本不知道。\n\
  \n然而，好消息是，有一个插件可以在**编译时**针对我们的架构验证这些查询。\n\n为此，我们将使用 [`babel-relay-plugin`](https://www.npmjs.com/package/babel-relay-plugin)。该插件：\n\
  \n1. 读取这些 `Relay.QL` 反引号字符串\n2. 解析 GraphQL 查询\n3. 针对我们的架构对其进行验证\n4. 将我们的 `Relay.QL`\
  \ 查询转换为展开的函数调用\n\n但是，为了验证我们的架构，**我们需要让架构对客户端构建工具可用**。\n\n记住，我们的架构是由**服务器定义的**。是我们的\
  \ GraphQL 端定义了数据模型（在本例中为书籍和作者）以及相应的 GraphQL 架构。\n\n那么，我们如何让服务器的架构对客户端构建工具可用呢？**我们将从服务器导出架构为\
  \ JSON 文件并复制。**\n\n#### 构建 `schema.json`\n\n为了向客户端构建工具提供架构，我们将在**服务器中**编写一个脚本，将架构导出为\
  \ JSON 文件。\n\n然后我们将在编译客户端代码时配置 `babel-relay-plugin` 使用该 JSON 文件。\n\n\n\n\n\n```javascript\n\
  import fs from 'fs';\nimport path from 'path';\nimport { graphql } from 'graphql';\n\
  import { introspectionQuery, printSchema } from 'graphql/utilities';\nimport schema\
  \ from '../schema';\n\n// Save JSON of full schema introspection for the Babel Relay\
  \ Plugin to use\nconst generateJSONSchema = async () => {\n  var result = await\
  \ (graphql(schema, introspectionQuery));\n  if (result.errors) {\n    console.error(\n\
  \      'ERROR introspecting schema: ',\n      JSON.stringify(result.errors, null,\
  \ 2)\n    );\n  } else {\n    fs.writeFileSync(\n      path.join(__dirname, '../client/src/data/schema.json'),\n\
  \      JSON.stringify(result, null, 2)\n    );\n  }\n\n  // Save user readable type\
  \ system shorthand of schema\n  fs.writeFileSync(\n    path.join(__dirname, '../client/src/data/schema.graphql'),\n\
  \    printSchema(schema)\n  );\n};\n\ngenerateJSONSchema().then(() => {\n  console.log(\"\
  Saved to client/src/data/schema.{json,graphql}\");\n})\n```\n\n`relay/bookstore/tools/update-schema.js`\n\
  \n看看我们在这里加载的依赖。除了 `fs` 和 `path` 之外，我们还有：\n\n1. 来自 `graphql` 的 `graphql`, `introspectionQuery`,\
  \ `printSchema`\n2. 来自 `../schema` 的 `schema`。\n\n需要注意的一点是，我们没有从 `relay` 库加载任何内容。这些都是\
  \ GraphQL。`relay` 库并没有参与其中。我们的 GraphQL schema *符合* Relay 标准，但我们并不依赖于任何 Relay 特有的功能。这种导出\
  \ schema 的过程可以使用*任何* GraphQL 服务器来完成。\n\n这里正在发生的事情是，我们告诉 `graphql` 库获取我们的 `schema`\
  \ 以及 `introspectionQuery`，然后并将我们的 schema 打印到两个文件中：\n\n1. 一个机器可读的 `schema.json` 文件（用于我们的客户端）\n\
  2. 一个人类可读的 `schema.graphql` 文件\n\n下面是 `schema.graphql` 文件的一个示例：\n\n```graphql\n\
  type Author implements Node {\n  name: String\n  avatarUrl: String\n  bio: String\n\
  \  createdAt: Date\n  books(after: String, first: Int, before: String, last: Int):\
  \ AuthorBooksConnection\n  _id: ID\n\n  # The ID of an object\n  id: ID!\n}\n\n\
  # A connection to a list of items.\ntype AuthorBooksConnection {\n  # Information\
  \ to aid in pagination.\n  pageInfo: PageInfo!\n\n  # A list of edges.\n  edges:\
  \ [AuthorBooksEdge]\n  count: Float\n}\n```\n\n`relay/bookstore/client/src/data/schema.graphql`\n\
  \n如果我们在项目的根目录下（`relay`），可以通过运行以下命令生成此 schema：\n\n```bash\nnpm run generateSchema\n\
  ```\n\n如果我们我们更改了 schema（例如向模型添加字段或添加新模型），那么我们需要运行此脚本来重新生成 schema。如果我们不重新生成 schema\
  \ 而尝试在客户端应用中使用新数据，那么 `babel-relay-plugin` 将抛出编译错误，因为它使用的是旧的 schema。因此，请确保在更改模型后，务必重新生成你的\
  \ schema。\n\n### 安装 `babel-relay-plugin`\n\n为了使用 `babel-relay-plugin`，我们需要：\n\n\
  1. `npm install babel-relay-plugin`\n2.  `babel-relay-plugin` 我们的 `schema.json`\n\
  3. 配置 `babel` 使用我们的插件\n\n要执行第 #2 ，请参考 `client/config/babelRelayPlugin.js` 文件，如下：\n\
  \n```javascript\nvar getBabelRelayPlugin = require('babel-relay-plugin');\nvar schema\
  \ = require('../src/data/schema.json');\n\nmodule.exports = getBabelRelayPlugin(schema.data,\
  \ {\n  debug: true,\n  suppressWarnings: false,\n  enforceSchema: true\n});\n```\n\
  \n`relay/bookstore/client/config/babelRelayPlugin.js`\n\n我们在这里做的只是通过添加我们自己的 schema\
  \ 并设置几个选项来配置 `babel-relay-plugin`。现在我们需要将此脚本作为插件添加到我们的 `babel` 配置中。\n\n为了实现这一点，我们在*客户端*的\
  \ `package.json` 中添加了以下内容：\n\n```json\n\"babel\": {\n  \"presets\": [\n    \"react-app\"\
  \n  ],\n  \"plugins\": [\n    \"./config/babelRelayPlugin\"\n  ]\n},\n```\n\n在上方，我们在\
  \ `package.json` 的 `babel` 配置的 `plugins` 部分添加了 `\"./config/babelRelayPlugin\"`。\n\
  \n### 设置路由\n\n现在我们已经准备好了构建工具，可以开始将 Relay 集成到 React 中。因为我们正在构建多页面应用，我们需要一个路由器。`react-router`\
  \ 提供了一种方便的方法。我们将为此应用使用基于哈希的路由（hash-based routing），因此我们配置 `history` 使用 `createHistory`。\n\
  \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
  import createHashHistory from 'history';\nimport Relay, {DefaultNetworkLayer} from\
  \ 'react-relay';\nimport routes from './routes';\n\n// Configure the with a Network\"\
  \nconst graphQLUrl = 'http://localhost:3001/graphql';\n\nRelay.inject(new DefaultNetworkLayer(graphUrl));\n\
  \nconst history = createHashHistory();\n\nReactDOM.render(\n  <Router\n    history={history}\n\
  \    routes={routes}\n    render={applyRouterMiddleware(useRel)}\n    environment={Relay.Store}\n\
  \  />,\n  document.getElementById('root')\n);\n```\n\n`relay/bookstore/client/index.js`\n\
  \n第一部分 `import` 了我们的依赖。\n\n接下来我们在变量 `graphUrl` 中配置服务器的 URL。如果你的服务器位于不同的 URL，请在此配置。接下来我们为\
  \ Relay 配置一个“网络层”。在这种情况下，我们使用 `DefaultNetworkLayer`，它会发出 HTTP 请求，但你可以用它来例如模拟服务器或使用完全不同的协议。\n\
  \n我们通过以下方式将 `Router` 组件连接到 Relay：\n\n1. 使用 `applyRouterMiddleware(useRel)` – 它来自\
  \ `react-router` 以及\n2. 将 `Relay.Store` 设置到 `Router`。\n\n这样设置 Router 使 Relay 在我们的应用中*可用*，但要实际执行\
  \ Relay 查询，我们还有一步：需要在路由中配置 Relay 查询。\n\n#### 为我们的路由添加 Relay\n\n让我们来看看 `routes.js`：\n\
  \n```javascript\nimport Relay from 'react-relay';\nimport React from 'react';\n\
  import IndexRoute from 'react-router/lib/IndexRoute';\nimport Route from 'react-router/lib/Route';\n\
  \nimport App from './components/App';\nimport AuthorPage from './components/AuthorPage';\n\
  \nconst AuthorQueries = {\n  author: () => Relay.QL`\n  query { \n    author(id:\
  \ $authorId)\n  }`,\n};\n\nexport default (\n  <Route\n    path='/'\n    component={App}\n\
  \  >\n    <Route\n      path='/authors/:authorId'\n      component={AuthorPage}\n\
  \      queries={AuthorQueries}\n    />\n  </Route>\n);\n```\n\n`relay/bookstore/client/src/steps/routes.author.js`\n\
  \n对于这些初始路由，我们有一个使用 `App` 组件的**父级**路由，以及一个使用 `AuthorPage` 组件的**子级**路由。最终我们将为应用中的每个页面都准备一个子组件，但目前，让我们先按顺序查看以下内容：\n\
  \n1. 我们的父级 `App` 组件\n\n2. `AuthorQueries` 以及它们如何与 `AuthorPage` 关联\n\n\n\n\n\n###\
  \ 3. 深入研究 `AuthorPage` 组件。\n\n#### `App` 组件\n\n我们的顶层 `App` 组件为应用的其余部分建立了封装：\n\n\
  ```\n 2 import React, {Children, Component} from 'react';\n 3 import {withRouter}\
  \ from 'react-router';\n 4 \n 5 import TopBar from './TopBar';\n 6 import '../styles/App.css';\n\
  \ 7 \n 8 class App extends React.Component {\n 9   render() {\n10     return (\n\
  11       <div className=\"ui grid\">\n12         <TopBar />\n13         <div className=\"\
  ui grid container\">\n14           {Children.map(this.props.children, c => React.cloneElement(c)\\\
  \n15 )}\n16         </div>\n17       </div>\n18     );\n19   }\n20 }\n21 \n22 export\
  \ default withRouter(App);\n```\n\n`relay/bookstore/client/src/components/App.js`\n\
  \n在这里，我们渲染了 `TopBar` 以及用于任何子组件（`this.props.children`）的标记。\n\n在我们 `export` `App`\
  \ 之前，我们使用 `react-router` 中的 `withRouter` 对其进行了封装。`withRouter` [是一个辅助函数](https://github.com/ReactTraining/react-router/blob/master/docs/API.md#withroutercomponent-options)，它为我们的组件提供了\
  \ `props.router`。\n\n#### `AuthorQueries` 组件\n\n现在我们已经理解了 `App` 组件，回到 `routes.js`\
  \ 并查看 `AuthorQueries`：\n\n```\n 9 const AuthorQueries = {\n10   author: () => Relay.QL`\n\
  11   query { \n12     author(id: $authorId)\n13   }`,\n14 };\n```\n\n`relay/bookstore/client/src/steps/routes.author.js`\n\
  \n记住，在 Relay 中，为了获取组件所需的数据，我们必须执行 `queries`。使用 `react-router-relay` 时，我们指定当访问特定路由时，*在该路由上定义的查询将被执行*。\n\
  \n注意 `AuthorQueries` 包含一个查询：`author`。该查询还有一个变量 `$authorId`。这个 `$authorId` 变量从哪里来？它来自路由路径参数：\n\
  \n```\n21     <Route\n22       path='/authors/:authorId'\n23       component={AuthorPage}\n\
  24       queries={AuthorQueries}\n25     />\n```\n\n`relay/bookstore/client/src/steps/routes.author.js`\n\
  \n在此路由中，我们说我们将匹配 `/authors/` 路由，随其后的任何内容都将被解释为 `authorId`。这个 `authorId` 被作为变量传递给\
  \ Relay 查询。\n\n注意关于 `author` 查询的另一个奇怪之处：它没有指定任何要获取的数据的“叶子节点”。查询停止在 `author(id: $authorId)`\
  \ 处。这是因为查询将获取哪些特定数据的决策交给了组件。\n\n正是在我们的 `component` 中（确切地说，是在我们的 Relay Container\
  \ 中）中，我们将指定渲染该组件所需的字段。\n\n考虑到这一点，让我们把注意力转向 `AuthorPage` 组件并查看那里的 Relay 查询。\n\n####\
  \ `AuthorPage` 组件\n\n以下是指定我们渲染最小化 `AuthorPage` 所需字段的代码：\n\n```\n27 export default\
  \ Relay.createFragmentContainer(AuthorPage, {\n28   fragments: {\n29     author:\
  \ () => Relay.QL`\n30     fragment on Author {\n31       name\n32       avatarUrl\n\
  33       bio\n34       books {\n35         count\n36       }\n37     }`\n38   }\n\
  39 });\n```\n\n`relay/bookstore/client/src/steps/AuthorPage.minimal.js`\n\n在查询的“内部”，很容易看到我们正在请求作者的\
  \ `name`、`avatarUrl` 和 `bio`。我们甚至可以深入 `books` 关系，并获取这个人编写的书数量 `count`。\n\n然而，可能并不清楚这如何与上面的查询联系起来。我们需要遵循两个约束。\n\
  \n第一个是这些 `fragments` 的键名必须与查询的键名匹配。在这种情况下，由于此组件是用查询键名 `author`（在 `AuthorQueries`\
  \ 中）渲染的，因此片段键名也必须是 `author`（在 `AuthorPage` 的 `fragments` 中）。\n\n![Relay Fragment\
  \ Naming](img/relay----relay-fragment-naming-author.png)\n\nRelay 片段命名\n\n第二个约束是，*此片段将是\
  \ query 内部内部字段类型的片段*。也就是说，我们不会在这里放置 `fragment on Book`，因为包含它的查询在 `Author` 处“结束”。我们可以通过查看\
  \ GraphiQL 中的 GraphQL schema 看到这一点。\n\n![Relay Fragment on Type](img/relay----relay-fragment-naming-author-type.png)\n\
  \nRelay 类型的片段\n\n当访问匹配 `/authors/:authorId` 的路由时，`AuthorPage` 的 `author` 片段将被拉入\
  \ `AuthorQueries` 中，结果将从服务器获取并传递到我们的组件。\n\n### 尝试一下\n\n我们目前只设置了 `AuthorPage`，这已经足够尝试了。\n\
  \n要做到这一点，请确保已按照之前章节的描述启动了服务器和客户端。\n\n\n\n\n\n![Books Page](img/relay----relay-books-page-finished.png)\n\
  \n# 图籍页面\n\n我们需要做的第一件事是为 `BooksPage` 创建路由以及该路由的查询。\n\n## `BooksPage` 路由\n\n`BooksPage`\
  \ 将是我们应用的默认页面，因此我们将使用 `IndexRoute` 辅助函数来定义此路由：\n\n```\n34     <IndexRoute\n35  \
  \     component={BooksPage}\n36       queries={ViewerQueries}\n37     />\n```\n\n\
  `relay/bookstore/client/src/routes.js`\n\n让我们来看一下 `ViewerQueries`：\n\n```\n11 const\
  \ ViewerQueries = {\n12   viewer: () => Relay.QL`query { viewer }`,\n13 };\n```\n\
  \n`relay/bookstore/client/src/routes.js`\n\n在这个页面上，我们将通过 `viewer` 节点查找书籍列表。\n\n\
  `viewer` 节点并不是严格属于 Relay 的，但它是你在许多 GraphQL 应用中都能看到的一种模式。其思想是“viewer”是应用程序的当前用户。因此，在实际应用中，通常你会看到\
  \ `viewer` 字段接受一个用户身份字段作为参数，例如身份验证令牌。\n\n想象创建一个带有社交动态的应用程序。我们可以使用 `viewer` 字段来获取特定用户的动态流，而不是针对所有用户的“火水员”（firehose）动态流。\n\
  \n在这种情况下，我们将使用 `Viewer` 来加载书籍 `Book` 列表。\n\n## `BooksPage` 组件\n\n![Books Page Components](img/relay----relay-books-page-components.png)\n\
  \n# 图籍页面组件\n\n这里我们有两个 Relay 容器：\n\n1.  持有所有书籍的 `BooksPage`\n2.  渲染特定书籍的 `BookItem`\n\
  \n由于我们的 `BooksPage` 路由指定了对 `viewer` 的查询，我们将在 `viewer` 键上（在 `Viewer` 类型上）指定一个片段（fragment）。让我们来看这个查询：\n\
  \n```\n33 export default Relay.createContainer(BooksPage, {\n34   initialVariables:\
  \ {\n35     count: 100\n36   },\n37   fragments: {\n38     viewer: () => Relay.QL`\n\
  39     fragment on Viewer {\n40       books(first: $count) {\n41         count\n\
  42         edges {\n43           node {\n44             slug\n45             ${BookItem.getFragment('book')}\n\
  46           }\n47         }\n48       }\n49     }\n50     `\n51   }\n52 });\n```\n\
  \n`relay/bookstore/client/src/components/BooksPage.js`\n\n这里有几个新知识点：\n\n1.  `initialVariables`\n\
  2.  使用 `getFragment()` 组合片段\n\n### 片段变量\n\n我们可以通过使用 `initialVariables` 字段为我们的查询设置变量。在这里你可以看到，我们正在告诉\
  \ Relay 我们想要将 `$count` 设置为 `100`。在查询中你可以看到我们正在请求前 100 本书。\n\n通过使用这个 `viewer`，我们不能说“我想要所有的书籍”。原因是因为此服务器是为大型应用设计的，你通常不想加载数据库中的每一个项目。通常情况下我们会使用分页。\n\
  \n但在这种情况下，我们只需将 `count` 设置为 `100`，因为对于这个简单的应用程序来说这已经足够了。但假设我们想更改变量 `count` 怎么办？我们该怎么做呢？\n\
  \n你可以这样使用 `this.props.relay.setVariables`：\n\n```\nthis.props.relay.setVariables({count:\
  \ 2});\n```\n\n如果我们调用上面的函数，你会发现我们只加载了 2 本书，而不是整个集合。\n\n更通地说，当我们希望组件能够更改有关正在执行的查询的参数时，我们可以使用\
  \ Relay 变量。\n\n### 片段组合\n\n这一点很重要：如果你使用子 Relay 组件，你需要使用 `getFragment()` 将子组件的片段嵌入父组件的查询中。\n\
  \n记住，片段是查询的一部分，在它们成为已执行查询的组成之前，它们是不会被实现的。如果你想让像 `BookItem` 这样的子组件能够渲染每本书，你必须在 `BooksPage`\
  \ 查询中包含 `BookItem` 片段。\n\n这需要一点时间适应，而且我们还没有看 `BooksPage` 的 `render` 函数，所以让我们来看这一部分，等我们有更多上下文时再回到这个片段组合的想法。\n\
  \n## `BooksPage` `render()`\n\n这里是 `BooksPage` 的渲染代码：\n\n```\n 8 class BooksPage\
  \ extends React.Component {\n 9   render() {\n10     const books = this.props.viewer.books.edges.map(this.renderBook);\n\
  11 \n12     return (\n13       <div className=\"sixteen wide column\">\n14     \
  \    <h1>JavaScript Books</h1>\n15         <div className=\"ui grid centered\">{books}</div>\n\
  16       </div>\n17     );\n18   }\n19 \n20   renderBook(bookEdge) {\n21     return\
  \ (\n22       <Link\n23         to={`/books/${bookEdge.node.slug}`}\n24        \
  \ key={bookEdge.node.slug}\n25       >\n26         <BookItem book={bookEdge.node}\
  \ />\n27       </Link>\n28     );\n29   }\n30 }\n```\n\n`relay/bookstore/client/src/components/BooksPage.js`\n\
  \n我们的 `render` 函数渲染 `this.props.viewer.books.edges` 并调用 `renderBook`。\n\n在 `render`\
  \ 函数中，我们渲染一个 `Link`  `to={`/books/${bookEdge.node.slug}`}` `key={bookEdge.node.slug}`，其中包含一个\
  \ `BookItem` `book={bookEdge.node}`。\n\n在 `render` 函数中，我们渲染 `this.props.viewer.books.edges`\
  \ 的每一个项。\n\n在 `renderBook` 中，我们返回一个 `Link` `to={`/books/${bookEdge.node.slug}`}`\
  \ `key={bookEdge.node.slug}`，其中包含一个 `BookItem` `book={bookEdge.node}`。\n\n在 `renderBook`\
  \ 中，我们返回一个 `Link` `to={`/books/${bookEdge.node.slug}`}` `key={bookEdge.node.slug}`，其中包含一个\
  \ `BookItem` `book={bookEdge.node}`。\n\n让我们深入看看 `BookItem`。\n\n## `BookItem`\n\n\
  这里是 `BookItem` 的 Relay 查询：\n\n```\n29 default Relay.createContainer(BookItem, {\n\
  30   fragments: {\n31     book: () => Relay.QL`\n32       fragment on Book {\n33\
  \         name\n34         slug\n35         tagline\n36         description\n37\
  \         coverUrl\n38         authors {\n39           count\n40         }\n41 \
  \      }\n42     `\n43   }\n44 });\n```\n\n`relay/bookstore/client/src/components/BookItem.js`\n\
  \n我们为 `Book` 类型定义了一个片段。这个查询请求了如 `name`、`slug`、`tagline`、 `coverUrl` 等基础信息。\n\n这里是组件定义：\n\
  \n```\n 9 class BookItem extends React.Component {\n10   render() {\n11     return\
  \ (\n12       <div className=\"bookItem\">\n13         <FancyBook book={this.props.book}\
  \ />\n14 \n15         <div className=\"bookMeta\">\n16           <div className=\"\
  authors\">\n17             {this.props.book.authors.count}\n18             {this.props.book.authors.count\
  \ > 1 ? ' Authors' : ' Author'}\n19           </div>\n20           <h2>{this.props.book.name}</h2>\n\
  21           <div className=\"tagline\">{this.props.book.tagline}</div>\n22    \
  \       <div className=\"description\">{this.props.book.description}</div>\n23 \
  \        </div>\n24       </div>\n25     );\n26   }\n27 }\n```\n\n`relay/bookstore/client/src/components/BookItem.js`\n\
  \n在 `div` `bookMeta` 内部，我们展示了 `authors` 数量、书籍的 `name` `tagline` 以及 `description`。\n\
  \n我们还将 `this.props.book` 传递给纯组件 `FancyBook`，它仅为书籍提供了 3D 效果的标记。\n\n### `BookItem`\
  \ 片段\n\n`BookItem` 片段 `book` 的有趣之处在于它没有绑定到特定的查询。记住我们在 `BooksPage` 中使用的查询是从 `Viewer`\
  \ 开始的。\n\n我们在这里所做的是为了使用这个组件，它关注的是 `Book` 类型上的内容。只要我们将此 `Book` 片段组合到父级片段中 `Book`\
  \ 片段有效的地方，我们就能使用这个 `BookItem` 组件。\n\n这里的准则则是：如果你在组合 Relay 组件，请确保你也组合了它们的片段。\n\n\
  ### 片段值掩码\n\nRelay 的另一个我们尚未讨论过的重要功能是数据掩码（data masking）。\n\n其思想是组件只能看到它们显式请求的数据。如果组件没有请求特定字段，即使该数据已加载，Relay\
  \ 也会对组件隐藏该字段。\n\n例如，对比查看 `BookItem` 和 `BooksPage` 的查询。注意：\n\n*   `BookItem` 加载了书籍的\
  \ `slug` 字段并且\n*   `BooksPage` 使用 `slug` 字段作为 `Link` 的 URL\n\n为了复习，这里是 `BookItem`\
  \ 的 `Relay.QL` 查询：\n\n\n\n\n\n```javascript\nexport default Relay.createContainer(BookItem,\
  \ {\n  fragments: {\n    book: () => Relay.QL`\n    fragment on Book {\n      name\n\
  \      slug\n      tagline\n      coverUrl\n      pages\n      description\n   \
  \   authors {\n        count\n      }\n    }\n    `\n  }\n});\n```\n\n`relay/bookstore/client/src/components/BookItem.js`\n\
  \n以及 `BooksPage` 的 `Relay.QL` 查询：\n\n```javascript\nexport default Relay.createContainer(BooksPage,\
  \ {\n  initialVariables: {\n    count: 100\n  },\n  fragments: {\n    viewer: ()\
  \ => Relay.QL`\n    fragment on Viewer {\n      books(first: $count) {\n       \
  \ count\n        edges {\n          node {\n            slug\n            ${BookItem.getFragment('book')}\n\
  \          }\n        }\n      }\n    }\n    `\n  }\n});\n```\n\n`relay/bookstore/client/src/components/BooksPage.js`\n\
  \n你可能会认为，因为我们在 `BooksPage` 查询中调用了 `${BookItem.getFragment('book')}`，这意味着 `slug`\
  \ 会对 `BooksPage` 组件可用，但**事实并非如此**。\n\n片段组合**并不会**让子片段的数据对我们的父级查询可用。如果我们想在 `BooksPage`\
  \ 的 `render` 函数中使用该字段，必须**显式地**在 `BooksPage` 查询中列出 `slug` 字段。\n\n数据掩码（Data masking）是初看之下可能不方便的功能之一，但随着你的应用程序（以及团队）的增长，它会被证明非常有用，因为它可以防止由组件外部变化引起的\
  \ bug。\n\n例如，假设 `BooksPage` 依赖于 `BookItem` 的 `slug` 字段进行加载。但在后续的某个地方，有人在清理 `BookItem`\
  \ 时删除了 `slug` 字段。会发生什么？`BooksPage` 现在将会崩溃。\n\n其核心思想是：**组件之间存在这种耦合是糟糕的**。每个组件都应该定义它正确渲染所需的所有内容。数据掩码是确保每个组件都显式定义其运行所需的数据集的方法。\n\
  \n### 掩码是双向的\n\n这种掩码也适用于反方向：由于我们**确实**定义了 `BooksPage`（父级）需要 `slug` 字段，尽管我们传递了书籍（通过\
  \ `<BookItem book={bookEdge.node}/>`），但如果子组件没有显式请求，它**无法访问 `slug`**。\n\n任何 Relay\
  \ 管理的 props 都会根据查询应用掩码。因此，在编写应用程序时请留意数据掩码——如果你发现意外缺少了数据（而你知道已经在其他地方加载了它们），请检查你的查询，确保你在需要这些数据的组件中显式地请求了那些特定字段。\n\
  \n### 改进 `AuthorPage`\n\n现在我们可以渲染书籍列表了，作者页面的一个很好的改进是显示该人物编写的书籍列表。\n\n根据我们刚刚涵盖的内容，我们知道可以通过以下步骤添加此书籍列表：\n\
  \n1. 在我们的 Relay 查询中请求作者的 `books`\n2. 在此查询中包含 `BookItem` 片段\n3. 获取作者书籍列表，并为每本书渲染一个\
  \ `BookItem`\n\n让我们现在就操作吧。\n\n#### 请求作者的书籍\n\n目前 `AuthorPage` 仅包含了作者出现的书籍数量（`count`）。让我们修改\
  \ `AuthorPage` 查询以包含更多关于作者书籍的数据，以便显示完整的书籍缩略图并链接：\n\n```javascript\nexport default\
  \ Relay.createContainer(AuthorPage, {\n  fragments: {\n    author: () => Relay.QL`\n\
  \    fragment on Author {\n      _id\n      name\n      avatarUrl\n      bio\n \
  \     books(first: 100) {\n        count\n        edges {\n          node {\n  \
  \          slug\n            ${BookItem.getFragment('book')}\n          }\n    \
  \    }\n      }\n    }`\n  }\n});\n```\n\n`relay/bookstore/client/src/components/AuthorPage.js`\n\
  \n这一更改展示了 Relay 和 GraphQL 的伟大之处之一。考虑一下，如果我们使用传统的基于 REST 的 API，这种类型的更改会是什么样。我们必须必须编写代码来查找作者的\
  \ `id`，并向服务器请求该作者的书籍。我们需要添加代码来优雅地处理错误。在这里，通过 Relay，我们只需要在查询中添加一个 `books()` 部分，并填充我们想要\
  \ true 字段即可。\n\n我们必须记得做的另一件事是包含 `BookItem` 片段 `book`。再次注意，这里的“父级”查询是 `author`。你可能记得这是路由器顶部的\
  \ `Author` 类型上的。但你并不真的需要记住这一点。你只需要知道 `BookItem` 的 `book` 片段是在类型 `Book` 上的，因此你可以将其放置在任何允许使用\
  \ `Book` 类型的查询中。\n\n#### `AuthorPage` 的 `renderBook`\n\n现在我们已经有了书籍，可以像这样渲染它们：\n\n\
  ```javascript\nclass AuthorPage extends React.Component {\n  renderBook(bookEdge)\
  \ {\n    return (\n      <Link\n        to={`/books/${bookEdge.node.slug}`}\n  \
  \      key={bookEdge.node.slug}\n        className=\"five wide column book\"\n \
  \     >\n        <BookItem book={bookEdge.node} />\n      </Link>\n    );\n  }\n\
  ```\n\n`relay/bookstore/client/src/components/AuthorPage.js`\n\n并在 `render()` 函数中：\n\
  \n```javascript\nrender() {\n  const author = this.props.author;\n  const books\
  \ = this.props.author.books.edges.map(this.renderBook);\n\n  return (\n    {/* ...\
  \ truncated  */}\n\n      <div className='sixteen wide column'>\n        <h1>{ author.name}&rsquo;s\
  \ Books</h1>\n        <div className='ui grid centered'>\n          { books }\n\
  \        </div>\n      </div>\n\n    {/* ... truncated  */}\n  );\n}\n```\n\n这是我们添加书籍后作者页面的当前截图：\n\
  \n### 使用变变更（Mutations）更改数据\n\n现在我们已经学习了如何：\n\n1. 从 Relay **读取单条记录**数据\n2. 从 Relay\
  \ **读取数据列表**\n3. 从**子组件**中加载数据\n\n我们还有一个还没有涵盖的关键问题：**更改数据**。在 Relay 中，更改数据是通过*变变更（mutations）*完成的。\n\
  \n我们将添加编辑书籍元数据的功能。\n\n首先，让我们为单本书创建一个新页面。我们将从 Relay 读取初始数据，正如之前所做的那。我们将讨论如何通过变变更更改数据。\n\
  \n### 构建书籍页面\n\n只读版的单本书页面没有包含太多新点，所以让我们简要讨论一下。\n\n首先，这里有一个截图：\n\n你可以看到我们展示了基础书籍、每个作者以及书籍封面。\n\
