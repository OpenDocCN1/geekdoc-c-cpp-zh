  \ tag\n2 const htmlElement = (<div>Hello world</div>);\n3 \n4 // React component\n\
  5 const Message = props => (<div>{props.text}</div>)\n6 \n7 // Use our React component\
  \ with a `Message` tag\n8 const reactComponent = (<Message text=\"Hello world\"\
  \ />);\n```\n\n我们经常用括号 `()` 包裹 JSX。虽然在技术上并非总是必须，但它有助于我们把 JSX 与 JavaScript 区分开。\n\
  \n我们的浏览器不知道如何读取 JSX，那么 JSX 是如何实现的呢？\n\n**在用浏览器加载 JSX 之前，JSX 会通过预处理器构建工具被转换为 JavaScript。**\n\
  \n当我们编写 JSX 时，我们会将其通过一个“编译器”（有时我们说代码被“转译” `transpiled`），它将 JSX 转换为 JavaScript。为此最常用的工具是\
  \ `babel` 的插件，我们稍后会介绍它。\n\n除了能够编写类 HTML 的组件树外，JSX 还提供了另一个优势：我们可以将 JavaScript 与 JSX\
  \ 标记混合使用。这允许我们在视图中内联逻辑。\n\n在本书中我们已经多次看到 JSX 的基础示例了。本节的不同之处在于，我们将对使用 JSX 的各种方式进行更结构化的观察。我们将介绍使用\
  \ JSX 的技巧，然后讨论如何处理一些棘手的情况。\n\n让我们来看：\n\n*   属性表达式\n*   元素表达式\n*   布尔属性\n*   注释\n\
  \n### JSX 属性表达式\n\n为了在组件的属性中使用 JavaScript 表达式，我们用大括号 `{}` 而不是引号 `\"\"` 来包裹它。\n\n\
  ```\n// ...\nconst warningLevel = 'debug';\nconst component = (<Alert\n        \
  \            color={warningLevel === 'debug' ? 'gray' : 'red'}\n               \
  \     log={true} />)\n```\n\n这个示例在 `color` 属性上使用了[三元运算符](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Conditional_Operator)。变量\
  \ `warningLevel` 被设置为 `debug`，则 `color` 属性将为 `'gray'`，否则它将为 `'red'`。\n\n### JSX\
  \ 条件元素表达式\n\n另一个常见模式是使用布尔检查表达式，然后条件地渲染另一个元素。\n\n例如，如果我们正在构建一个显示给 `admin` 用户选项的菜单，我们可能会这样写：\n\
  \n```\n// ...\nconst renderAdminMenu = function() {\n  return (<MenuLink to=\"/users\"\
  >User accounts</MenuLink>)\n}\n// ...\nconst userLevel = this.props.userLevel;\n\
  return (\n  <ul>\n    <li>Menu</li>\n    {userLevel === 'admin' && renderAdminMenu()}\n\
  \  </ul>\n)\n```\n\n我们也可以使用三元运算符来渲染一个组件或另一个组件。\n\n例如，如果 true 想为已登录的用户显示一个 `<UserMenu>`\
  \ 组件，为匿名用户显示一个 `<LoginLink>`，我们可以使用这个表达式：\n\n```javascript\nconst Menu = (<ul>{loggedInUser\
  \ ? <UserMenu /> : <LoginLink />}</ul>)\n```\n等一下，我漏掉了一些东西。\n\n### JSX 布尔属性\n\n\
  在 HTML 中，某些属性的出现会将该属性设置为 true。例如，可以定义一个禁用的 `<input>` HTML 元素：\n\n```\n1 <input name='Name'\
  \ disabled />\n```\n\n在 React 中，我们需要将这些设为布尔值。也就是说，我们需要显式地作为属性传递一个 `true` 或 `false`：\n\
  \n```javascript\n// 直接在括号中设置布尔值\n<input name='Name' disabled={true} />\n\n// ...\
  \ 或者使用 JavaScript 变量\nlet formDisabled = true;\n<input name='Name' disabled={formDisabled}\
  \ />\n```\n\n如果我们需要 `enable` 以上 `input`，则将 `formDisabled` 设置为 `false`。\n\n### JSX\
  \ 注释\n\n我们可以通过大括号 `{}` 配合注释分隔符（`/* */`）在 JSX 内部定义注释：\n\n```javascript\nlet userLevel\
  \ = 'admin';\n{/*\n  如果 userLevel 为 'admin' 则显示管理员菜单\n*/}\n{userLevel === 'admin'\
  \ && <AdminMenu />}\n```\n\n### JSX 展开语法\n\n有时当有许多 props 需要传递给组件时，逐个列出每一个可能会很麻烦。幸运的是，JSX\
  \ 有一种快捷语法让这变得更简单。\n\n例如，如果我们有一个两个键的 `props` 对象：\n\n```javascript\nconst props =\
  \ {msg: \"Hello\", recipient: \"World\"}\n```\n\n我们*可以*这样逐个传递每个 prop：\n\n```javascript\n\
  <Component msg={\"Hello\"} recipient={\"World\"} />\n```\n\n但通过使用 JSX `展开语法` (spread\
  \ syntax)，我们可以改用这种写法：\n\n```javascript\n<Component {...props} />\n<!-- 基本上等同于： -->\n\
  <Component msg={\"Hello\"} recipient={\"World\"} />\n```\n\n### JSX 陷阱\n\n尽管 JSX\
  \ 模仿了 HTML，但有一些需要注意的重要区别。\n\n这里有几点需要记住：\n\n#### JSX 陷阱：`class` 和 `className`\n\n\
  当我们想要设置 HTML 元素的 CSS 类时，我们通常在标签中使用 `class` 属性：\n\n```\n1 <div class='box'></div>\n\
  ```\n\n由于 JSX 与 JavaScript 紧密结合，我们不能在标签属性中使用 JavaScript 使用的标识符。属性如 `for` 和 `class`\
  \ 会与 JavaScript 关键字 `for` 和 `class` 冲突。\n\nJSX 不使用 `class` 来标识类，而是使用 `className`：\n\
  \n```\n1 <!-- 与 <div class='box'></div> 相同 -->\n2 <div className='box'></</div>\n\
  ```\n\n#### JSX 陷阱：`for` 和 `htmlFor`\n\n由于相同的原因无法使用 `class`，我们无法在 `<label>` 元素上应用\
  \ `for`。相反，我们必须使用 `htmlFor`。\n\n```\n<!-- ... -->\n<label htmlFor='email'>Email</label>\n\
  <input name='email' type='email' />\n```\n\n#### JSX 陷阱：HTML 实体和 Emoji\n\n*实体* 是\
  \ HTML 中的保留字符，包括 `<`、`>`版权符号等。为了显示实体，我们可以直接将实体代码放在字面量中。\n\n```\n<ul>\n  <li>phone:\
  \ &phone;</li>\n  <li>star: &star;</li>\n</ul>\n```\n\n为了在动态数据中显示实体，我们需要在大括号 `{}`\
  \ 中将它们包裹。在 JS 中直接使用 unicode 符合预期。正如我们可以直接将 JS 作为 UTF-8 文本发送给浏览器一样。浏览器原生支持显示 UTF-8\
  \ 代码。\n\n或者，与其使用实体代码，我们可以使用 unicode 版本。\n\n```javascript\nreturn (\n  <ul>\n   \
  \ <li>phone: {'\\u026e'}</li>\n    <li>star: {'\\u2606'}</li>\n  </ul>\n)\n```\n\
  \nEmoji 只是 unicode 字符序列，所以我们可以以相同的方式添加 emoji：\n\n```javascript\nreturn(\n  <ul>\n\
  \    <li>dolphin: {'\\uD83D\\uDC2C'}</li>\n    <li>dolphin: {'\\uD83D\\uDC2C'}</li>\n\
  \    <li>dolphin: {'\\uD83D\\uDC2C'}</li>\n  </ul>\n)\n```\n\n\n\n\n\n如果我们想应用 HTML\
  \ 规范未涵盖的自定义属性，我们必须在属性键前加上 `data-` 前缀。\n\n```jsx\n<div className='box' data-dismissible={true}\
  \ />\n<span data-highlight={true} />\n```\n\n这一要求`仅` 适用于 HTML 原生的 DOM 组件，并不意味着自定义组件不能接受任意键作为\
  \ props。这意味着，我们可以在自定义组件上接受 `any`（任意）属性：\n\n```jsx\n<Message dismissible={true} />\n\
  <Note highlight={true} />\n```\n\n有一套标准的[Web 可访问性](https://www.w3.org/WAI/intro/aria)\
  \ [属性](https://www.w3.org/TR/wai-aria/)，使用它们是一个好主意，因为许多人如果没有这些属性，使用我们的网站将会遇到困难。我们可以在元素上使用这些属性中的任何一个，并在键前加上\
  \ `aria-` 字符串。例如，设置 `hidden` 属性：\n\n```jsx\n<div aria-hidden={true} />\n```\n\n\
  ## JSX 总结\n\nJSX 并不是魔法。需要记住的关键点是，JSX 是调用 `React.createElement` 的语法糖。\n\nJSX 将解析我们写的标签，然后创建\
  \ JavaScript 对象。JSX 是一种用于帮助构建组件树的便利语法。\n\n正如我们之前看到的，当我们在代码中使用 JSX 标签时，它会被转换为一个 `ReactElement`：\n\
  \n```javascript\nvar boldElement = <b>Text (as a string)</b>;\n// => boldElement\
  \ 现在是一个 ReactElement\n```\n\n我们可以将该 `ReactElement` 传递给 `ReactDOM.render`，并看到我们的代码在页面上被渲染。\n\
  \n但存在一个问题：`ReactElement` 是无状态且不可变的。如果我们想在应用中添加交互性（带有状态），我们需要拼图的另一部分：`ReactComponent`。\n\
  \n在下一章节中，我们将深入讨论 `ReactComponent`s。\n\n## 参考文献\n\n以下是一些可以阅读更多关于 JSX 和虚拟 DOM 信息的地方：\n\
  \n* [JSX 深度解析](https://facebook.github.io/react/docs/jsx-in-depth.html) - (Facebook)\n\
  * [JSX 中的 If-Else](https://facebook.github.io/react/docs/conditional-rendering.html)\
  \ - (Facebook)\n* [React (虚拟) DOM 术语](https://facebook.github.io/react/docs/glossary.html)\
  \ - (Facebook)\n* [什么是虚拟 DOM](http://jbi.sh/what-is-virtual-dom/) - (Jack Bishop)\n\
  \n## 使用 `props`、`state` 和 `children` 进行高级组件配置\n\n### 引言\n\n在本章中，我们将深入研究组件的配置。\n\n\
  `ReactComponent` 是一个 JavaScript 对象，它至少有一个 `render()` 函数。预期 `render()` 返回一个 `ReactElement`。\n\
  \n记住 `ReactElement` 是虚拟 DOM 中 DOM 元素的表示。\n\n`ReactComponent` 的目标是：\n\n* `render()`\
  \ 一个 `ReactElement`（它最终将变成真实的 DOM）并\n* 将功能附加到页面的这一部分\n\n“附加功能”这个说法有点模糊；它包括附加事件处理器、管理状态、与子组件交互等。在本章中，我们将涵盖：\n\
  \n* `render()` - 每个 `ReactComponent` 上都必须的唯一函数\n* `props` - 我们组件的“输入参数”\n* `context`\
  \ - 组件的“全局变量”\n* `state` - 一种持有组件本地数据的方法（会影响渲染）\n* `Stateless components` - 编写可用组件的简化方法\n\
  * `children` - 如何与子组件交互和操作\n* `statics` - 如何在我们的组件上创建“类方法”\n\n让我们开始吧！\n\n> 与本书的其他章节不同，本章旨在从百科全书式的视角，对\
  \ React 的不同功能进行深入、彻底的探讨。由于这个原因，我们没有在书的这一部分包含一个逐步跟进式的项目。\n\n> 与此相反，在本章中，我们将使用一个名为\
  \ `styleguidist` 的 React 开发工具，我们将在下方介绍。\n\n### 如何使用本章\n\n本章是使用一个名为 `styleguidist`\
  \ 的特定工具构建的。在课程包含的代码中有一个名为 `advanced-components/components-cookbook` 的部分，它附带了 `styleguidist`\
  \ 工具并与本章相对应。要使用 `styleguidist` 工具（它允许对组件本身进行内省），我们可以通过章节启动该部分。\n\n为了启动它，请进入 `advanced-components/components-cookbook/`\
  \ 代码目录。我们需要修改几个文件以使代码运行。由于我们将使用几个变量来定义配置，我们需要在代码中包含这些变量。\n\n在终端中，切换到根目录并执行以下命令。首先，我们需要使用\
  \ `npm install` 获取项目的依赖项：\n\n```bash\nnpm install\n```\n\n启动应用程序，执行 `npm start`：\n\
  \n```bash\nnpm start\n```\n\n一旦服务器运行，我们可以导航到 `localhost:6060`。我们将看到样式指南正在运行，并展示本章提供的的所有组件。\n\
  \n### 组件：创建组件 - ES6 类或函数组件\n\n正如第一章讨论的，定义 `ReactComponent` 有两种方式：\n\n1. ES6 类\n\
  2. 函数组件\n\n```javascript\nimport React from \"react\";\n\n// ES6 类样式\nclass ComponentApp\
  \ extends React.Component {\n  render() {\n    return <div />;\n  }\n}\n\nexport\
  \ default ComponentApp;\n```\n\n以及\n\n```javascript\n// 函数组件\nconst FunctionComponent\
  \ = props => {\n  return <div />;\n};\n\nexport default FunctionComponent;\n```\n\
  \n在定义类组件时，React 期望一个 `render()` 函数。当使用函数组件时，该函数本身本质上就是 `render()` 函数。\n\n#### `render()`\
  \ 返回 `ReactElement` 树\n\n`render()` 是 `ReactComponent` 上必须定义的唯一方法。\n\n在组件挂载和初始化后，将调用\
  \ `render()`。`render()` 函数的作用是为 React 提供原生 DOM 组件的虚拟表示。\n\n使用函数组件创建 `h1` 标签的示例如下：\n\
  \n```javascript\nconst FunctionComponentHeading = props => {\n  return <h1>Hello</h1>;\n\
  };\n```\n\n或者使用 ES6 类样式组件：\n\n```javascript\nclass Heading extends React.Component\
  \ {\n  render() {\n    return <h1>Hello</h1>;\n  }\n}\n```\n\n上面的代码看起来很熟悉。它描述了一个\
  \ `Heading` 组件类，带有一个 `render()` 方法，该方法返回一个简单的、单一的 `<h1>` 标签虚拟 DOM 表示。\n\n记住这个 `render()`\
  \ 方法返回一个 `ReactElement`，它并不属于“实际 DOM”，而是虚拟 DOM 的描述。\n\nReact 期望该方法返回*单个*子元素。它可以是\
  \ DOM 组件的虚拟表示，也可以返回假值 `null` 或 `false`。React 通过渲染一个空元素（`<noscript />` 标签）来处理假值。这被用于从页面上移除该标签。\n\
  \n保持 `render()` 方法无副作用可以提供重要的优化，并使我们的代码更容易理解。\n\n\n\n\n当然，虽然 `render` 是唯一要求的方法，但如果我们唯一能渲染的数据在编译时就已经确定，那么它就没那么有趣了。也就是说，我们需要一种方法来：\n\
  \n* 向我们的组件输入“参数”以及\n* 在组件内部维护状态\n\nReact 分别提供了实现这两种点的方法，分别是 `props` 和 `state`。\n\
  \n理解这些内容对于让我们的组件在更大的应用中变得动态且易用至关重要。\n\n在 React 中，`props` 是不可变的数据片段，从父组件传递给子组件。\n\
  \n组件的 `state` 是我们存储数据的地方，它是组件本地。通常，当组件的 `state` 发生变化时，组件需要重新渲染。与 `props` 不同，`state`\
  \ 是组件私有的且是可变的。\n\n我们将在下文中详细介绍 `props` 和 `state`。在此过程中，我们还会谈论 `context`，它是一种穿过整个组件树的“隐式\
  \ `props`”。\n\n让我们更详细地查看这些内容。\n\n### props 是参数\n\n`props` 是你组件的输入。如果我们把组件看作一个函数，那么就可以把\
  \ props 看作参数。\n\n让我们来看一个例子：\n\n```html\n<div>\n  <Header headerText=\"Hello world\"\
  \ />\n</div>\n```\n\n在示例代码中，我们同时创建了 `<div>` 和 `<Header>` 元素，其中 `<div>` 是一个普通的 DOM\
  \ 元素，而 `<Header>` 是我们的 `Header` 组件的实例。\n\n在这个示例中，我们通过属性 `headerText` 将数据（字符串 `\"\
  Hello world\"`）从组件传递给组件。\n\n通过属性向组件传递数据时，它将通过 `this.props` 属性供组件使用。因此在这种情况下，我们可以通过\
  \ `this.props.headerText` 属性访问我们的 `headerText`：\n\n```javascript\nimport React from\
  \ 'react';\n\nexport class Header extends React.Component {\n  render() {\n    return\
  \ (\n      <h1>{this.props.headerText}</h1>\n    );\n  }\n}\n```\n\n虽然我们可以访问 `headerText`\
  \ 属性，但不能更改它。\n\n通过使用 `props`，我们让静态组件变得动态，允许它动态渲染传递给它的任何 `headerText`。`<Header>`\
  \ 组件无法更改 `headerText`，但它可以使用 `headerText` 本身或将其传递给子组件。\n\n我们可以通过 `props` 传递任何 JavaScript\
  \ 对象。我们可以传递原始类型、简单的 JavaScript 对象、原子、函数等。我们甚至可以传递其他 React 元素元素虚拟 DOM 节点。\n\n我们可以使用\
  \ `props` 文档化组件的功能，并使用 `PropTypes` 指定每个 prop 的类型。\n\n### PropTypes\n\n`PropTypes`\
  \ 是验证通过我们的 `props` 传递进的值的方法。定义良好的接口为我们的应用运行时提供了一层安全保障。它们还为组件的消费者提供了一层文档说明。\n\n我们在\
  \ `package.json` 中包含了 `prop-types` 包。\n\n我们通过设置静态（类）属性 `propTypes` 来定义 `PropTypes`。该对象应该是\
  \ prop 属性键到 `PropTypes` 值的映射：\n\n```javascript\n1 class MapComponent extends React.Component\
  \ {\n2   static propTypes = {\n3     lat: PropTypes.number,\n4     lng: PropTypes.number,\n\
  5     zoom: PropTypes.number,\n6     place: PropTypes.object,\n7     markers: PropTypes.array\n\
  8   }\n9   // ...\n10 };\n```\n\n在上面的示例中，我们的组件将验证 `lat`、`lng` 和 `zoom` 是否均为数字，而\
  \ `place` 是否为对象`markers` 是否为数组。\n\n有许多内置的 `PropTypes`，我们可以定义自己的。\n\n我们在“附录 A：`PropTypes`”中为许多\
  \ `PropTypes` 验证器编写了代码示例。关于 `PropTypes` 的更多细节，请查看该附录。\n\n目前，我们需要知道有标量类型的验证器：\n\n\
  * `string`\n* `number`\n* `boolean`\n\n我们还可以验证复杂类型，例如：\n\n* `function`\n* `object`\n\
  * `array`\n* `arrayOf` - 期望一个特定类型的数组\n* `node`\n* `element`\n\n我们还可以验证输入对象的特定 `shape`（形状），或验证它是否是特定类的实例（instanceOf`）。\n\
  \n### 使用 getDefaultProps() 设置默认 props\n\n有时我们希望 `props` 有默认值。我们可以使用静态属性 `defaultProps`\
  \ 来实现这一点。\n\n例如，创建一个 `Counter` 组件并使用 `defaultProps` 将其设置为 1：\n\n```javascript\n\
  class Counter extends React.Component {\n  static defaultProps = {\n    initialValue:\
  \ 1\n  };\n  // ...\n};\n```\n\n现在组件可以在不设置 `initialValue` 的情况下使用。两种用法在功能上是等价的：\n\
  \n```html\n<Counter />\n<Counter initialValue={1} />\n```\n\n### Context\n\n有时我们可能会发现有一个想要“全局”暴露的\
  \ prop。在这种情况下，我们可能会发现向下传递非常麻烦。从 React 16.3.0 开始，React 增加了一个新的 API 允许我们指定变量。React\
  \ context API 比旧的实验性 `context` 版本高效得多，因为它支持静态检查和深度更新。\n\n为了告诉 React 我们想传递 context，我们需要定义它。我们可以通过首先使用\
  \ `React.createContext()` 方法定义一个 context `Provider`/`Consumer` 来实现。\n\n然后我们将通过 context\
  \ 的 `Provider` 组件将 context 传递到 react 树中，该组件专门为传递而设计。我们可以通过将 `Consumer` 组件作为 `Provider`\
  \ 元素的子从 `Provider` 访问 context。\n\n让我们看看它是如何工作的……假设我们想为用户提供选择网站主题的能力。我们将查看浅色和深色主题：\n\
  \n![](img/components----theme.png)\n\n为了定义一个 context，我们需要创建一个 react context 来为我们持有主题。我们将使用\
  \ `React.createContext()` 方法：\n\n```javascript\nimport React from 'react';\n  //\
  \ ...\nexport const ThemeContext = React.createContext(themes.dark);\n```\n\nadvanced-components/components-cookbook/src/components/theme/src/theme.js\n\
  \n`React.createContext()` 方法接受单个参数，即 context 提供的默认值。在这种情况下，我们的 `theme` 将默认为 `themes.dark`\
  \ 值。\n\n现在我们有了 `ThemeContext`，我们希望将此主题传递给子组件。创建 `ThemeContext` 后，我们可以使用 `Provider`\
  \ 组件来传递主题。\n\n例如，在我们的演示应用中，有一个使用 `Header` 组件的 `App` 组件。在我们的 `App` 组件中，我们可以指定一个主题。\n\
  \n\n\n\n\n```\nclass App extends Component {\n  state = {theme: themes.dark};\n\
  \  // ...\n  render() {\n    return (\n      <div className=\"App\">\n        <ThemeContext.Provider\
  \ value={this.state.theme}>\n          <Header />\n          <p className=\"App-intro\"\
  >\n            要开始，请编辑 <code>src/App.js</code> 并保存以重载。\n          </p>\n\n     \
  \     <button onClick={this.changeTheme}>Change theme</button>\n        </ThemeContext.Provider>\n\
  \      </div>\n    );\n  }\n}\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/App.js`\n\
  \n通过 `ThemeContext.Provider` 传递主题，允许我们从较下层组件中提取主题。请注意，我们在 `ThemeContext.Provider`\
  \ 组件中传递了 `value` 属性。没有这个 `value` 属性，子组件将无法访问 provider 的值。\n\n`ThemeContext.Provider`\
  \ 组件是一个特殊的组件，专门设计用于仅向子组件传递数据。\n\n为了消费（使用）上下文的值，我们需要使用之前导出的 `ThemeContext` 导出的另一个组件：`Consumer`\
  \ 组件。\n\n让我们来看 `<Header />` 组件。我们希望组件能够访问全局主题上下文，因此我们在这里导入了 `ThemeContext`：\n\n\
  ```\nimport {ThemeContext} from './theme';\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/Header.js`\n\
  \n现在我们可以使用 `ThemeContext` 消费者从父级 `Provider` 中提取主题：\n\n```javascript\nexport const\
  \ Header = props => (\n  <ThemeContext.Consumer>\n    {theme => (\n      <header\n\
  \        className=\"App-header\"\n        style={{backgroundColor: theme.background}}\n\
  \      >\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n     \
  \   <h1 className=\"App-title\" style={{color: theme.foreground}}>\n          Welcome\
  \ to React\n        </h1>\n      </header>\n    )}\n  </ThemeContext.Consumer>\n\
  );\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/Header.js`\n\
  \n`Consumer` 组件的用法可能与我们习惯的略有不同——在习惯用法中，子组件是一个将 `Provider` 的值作为参数传递给方法的方法。使用这种方法，我们可以访问被传递的\
  \ prop。\n\n如果我们想能够动态更新提供的值，只需像通常更改状态一样，更改 `App` 中的 `state.theme`。\n\n```javascript\n\
  class App extends Component {\n  state = {theme: themes.dark};\n  // ...\n  changeTheme\
  \ = evt => {\n    this.setState(state => ({\n      theme: state.theme === themes.dark\
  \ ? themes.light : themes.dark\n    }));\n  };\n  // ...\n}\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/App.js`\n\
  \n### 默认值\n\n我们之前传递的那个默认值呢？\n\n```javascript\nimport React from 'react';\n  // ...\n\
  export const ThemeContext = React.createContext(themes.dark);\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/theme.js`\n\
  \n当子组件没有被包裹在 `ThemeContext.Provider` 组件中时，默认会在消费者中使用。\n\n### 多个上下文\n\n我们可以像正常一样在应用程序中包裹多个上下文提供者。事实上，我们不需要做任何特殊处理。只需将我们的组件包裹在多个上下文\
  \ Provider 组件中即可。\n\n例如，假设我们有一个 `UserContext`：\n\n```javascript\nimport React from\
  \ 'react';\n  // ...\nexport const UserContext = React.createContext(null);\n```\n\
  \n`advanced-components/components-cookbook/src/components/theme/src/user.js`\n\n\
  我们可以以相同的方式访问 `User` 上下文：\n\n```javascript\nimport {UserContext} from './user';\n\
  \  // ...\nexport const Body = props => (\n  <ThemeContext.Consumer>\n    {theme\
  \ => (\n      <header\n        className=\"App-header\"\n        style={{backgroundColor:\
  \ theme.background}}\n      >\n        <UserContext.Consumer>\n          <h1>{user\
  \ => (user ? 'Welcome back' : 'Welcome')}</h1>\n        </UserContext.Consumer>\n\
  \      </header>\n    )}\n  </ThemeContext.Consumer>\n);\n```\n\n`advanced-components/components-cookbook/src/components/theme/src/Body.js`\n\
  \n`Consumer` 组件必须派生自创建的上下文。如果没有此，值将无法向下传递。由于由于原因，我们在一个文件中创建上下文并导出它。否则，该值将不起作用。\n\
  \n### state\n\n我们在组件中处理的第二种类型的数据是 `state`。为了知道何时应用状态，我们需要理解有状态组件（stateful components）的概念。当组件需要持有动态数据时，该组件就可以被认为是有状态的。\n\
  \n例如，当灯开关打开时，该灯开关持有“开启”的状态。关闭灯可以描述为将灯的状态翻转为“关闭”。\n\n在构建应用时，我们可能会有一个描述特定设置的开关，例如一个需要验证的输入，或者聊天中某个特定用户的存在值。\n\
  \n我们将持有本地数据的组件称为有状态组件。我们将讨论讨论什么时候应该使用状态。尽可能减少有状态组件，因为状态会引入复杂性并使组合变得困难。\n\n#### 使用状态：构建自定义单选按钮\n\
  \n在这个例子中，我们将使用内部状态来构建一个切换支付方法的单选按钮。完成后的表单如下：\n\n![Simple Switch](img/component-configuration----switch)\n\
  \nSimple Switch\n\n让我们看看如何使其变为有状态：\n\n```javascript\nclass Switch extends React.Component\
  \ {\n  state = {};\n\n  render() {\n    return (\n      <div>\n        <em>模板将在这里</em>\n\
  \      </div>\n    );\n  }\n}\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch1.js`\n\
  \n就是！当然，仅仅在组件上设置状态并不有趣。为了在组件上使用状态，我们将通过 `this.state` 引用它。\n\n```javascript\nconst\
  \ CREDITCARD = \"Creditcard\";\nconst BTC = \"Bitcoin\";\n\nclass Switch extends\
  \ React.Component {\n  state = {\n    payMethod: BTC\n  };\n\n  render() {\n   \
  \ return (\n      <div className=\"switch\">\n        <div className=\"choice\"\
  >Creditcard</div>\n        <div className=\"choice\">Bitcoin</div>\n        Pay\
  \ with: {this.state.payMethod}\n      </div>\n    );\n  }\n}\n\nexport default Switch;\n\
  ```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch2.js`\n\
  \n在我们的渲染函数中，可以看到用户可以选择的选择（尽管我们还无法更改支付方法），以及存储在组件 `state` 中的当前选择。这个 `Switch` 组件现在是有状态的，因为它跟踪了用户偏好的支付方法。\n\
  \n我们的支付开关还没有交互性；我们无法更改组件的状态。让我们通过添加一个在用户选择不同支付方法运行时的事件处理程序来连接我们的第一个交互功能。\n\n为了添加交互，我们需要响应点击事件。为了在任何组件上添加回调处理器，我们可以可以使用组件上的\
  \ `onClick` 属性。当定义在上面的组件被点击时，`onClick` 处理器就会触发。\n\n\n\n\n```javascript\n20   render()\
  \ {\n21     return (\n22       <div className=\"switch\">\n23         <div\n24 \
  \          className=\"choice\"\n25           onClick={this.select(CREDITCARD)}\
  \ // add this\n26         >\n27           Creditcard\n28         </div>\n29    \
  \     <div\n30           className=\"choice\"\n31           onClick={this.select(BTC)}\
  \ // ... and this\n32         >\n...\n37      }\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch3.js`\n\
  \n通过使用 `onClick` 属性，我们绑定了一个回调处理程序，每当其中一个 `<<div>` 元素被点击时，该处理器就会被调用。\n\n`onClick`\
  \ 处理器期望接收一个 `function`，它会在点击事件发生时调用该函数。让我们来看下 `select` 函数：\n\n```javascript\n11\
  \   select = choice => {\n12     return evt => {\n13       // <-- handler starts\
  \ here\n14       this.setState({\n15         payMethod: choice\n16       });\n17\
  \     };\n18   };\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch3.js`\n\
  \n注意 `select` 的两点：\n\n1. 它返回了一个函数。\n2. 它使用了 `setState`。\n\n### 返回一个新函数\n\n注意 `select`\
  \ 和 `onClick` 之间一个有趣的地方：属性 `onClick` 期望传入一个 `function`，但我们是先 `calling` 了一个函数。这是因为\
  \ `select` 函数本身会 `return` 一个函数。\n\n这是向处理程序传递参数的常用一种模式。当我们调用 `select` 时，我们对 `choice`\
  \ 参数进行了闭包（close over）。`select` 返回一个新函数，该函数将使用相应的 `choice` 调用 `setState`。\n\n当其中一个子\
  \ `<<div>` 元素被点击时，处理函数会被调用。请注意，`select` 实际上是在 `render`期间被调用的，而被 `onClick` 调用的是 `select`\
  \ 的 `return value`。\n\n### 更新状态\n\n当处理函数被调用时，组件会对其自身调用 `setState`。调用 `setState`\
  \ 会触发刷新，这意味着 `render` 函数将再次被调用，我们能够在视图中看到当前的 `state.payMethod`。\n\n### 查看选项\n\n\
  在我们的组件中，除了随附的文本外，我们还没有方法来指示选择了哪一个选项。\n\n如果选项本身有一个视觉指示来表示它被选中，那就太好了。我们通常通过应用 CSS\
  \ 的 `active` 类来实现。在我们的示例中，我们使用了 `className` 属性。\n\n为了实现这一点，我们需要添加一些逻辑，根据组件的当前状态决定添加哪些\
  \ CSS 类。\n\n但在对 CSS 添加过多的逻辑之前，让我们先重构组件，使用一个函数来渲染每个选项：\n\n```javascript\n19   renderChoice\
  \ = choice => {\n20     return (\n21       <div className=\"choice\" onClick={this.select(choice)}>\n\
  22         {choice}\n23       </div>\n24     );\n25   };\n26 \n27   render() {\n\
  28     return (\n29       <div className=\"switch\">\n30         {this.renderChoice(CREDITCARD)}\n\
  31         {this.renderChoice(BTC)}\n32         Pay with: {this.state.payMethod}\n\
  33       </div>\n34     );\n35   }\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch4.js`\n\
  \n现在，我们不再将所有的渲染代码放入 `render()` 函数中，而是将选项渲染隔离到它自己的函数中。\n\n最后，为 `<<div>` 选项组件添加 `.active`\
  \ 类。\n\n```javascript\n20   renderChoice = choice => {\n21     // 创建要应用的 cssClasses\n\
  22     const cssClasses = [\"choice\"];\n23 \n24     if (this.state.payMethod ===\
  \ choice) {\n25       cssClasses.push(\"active\"); // add .active class\n26    \
  \ }\n27 \n28     return (\n29       <div className={cssClasses.join(\" \")} onClick={this.select(choice\\\
  \n30 )}>\n31         {choice}\n32       </div>\n33     );\n34   };\n35 \n36   render()\
  \ {\n37     return (\n38       <div className=\"switch\">\n39         {this.renderChoice(CREDITCARD)}\n\
  40         {this.renderChoice(BTC)}\n41         Pay with: {this.state.payMethod}\n\
  42       </div>\n43     );\n44   }\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch5.js`\n\
  \n### Stateful 组件\n\n在组件上定义状态需要我们在对象原型中设置一个名为 `this.state` 的实例变量。为了实现这一点，我们需要在两个地方之一设置状态，要么作为类的属性，要么在构造函数中。\n\
  \n这样设置一个状态组件：\n\n1. 它允许我们定义组件的 `initial` 状态。\n2. 它要求我们在两个地方之一设置状态...\n\n\n\n\n为什么必须以这种方式设置状态？因为\
  \ `setState()` 是异步的。\n\n这里有一个示例。假设我们正在使用第一种 `decrement()` 方法，即向 `setState()` 传递一个对象。当我们第一次调用\
  \ `decrement()` 时，`value` 是 `125`。然后我们调用 `setState()`，并传递一个 `value` 为 `124` 的对象。\n\
  \n然而，状态并不会立即更新。相反，React 将我们将请求的状态更新添加到它的队列中。\n\n假设该用户的鼠标操作非常快，而她的计算机处理速度特别慢。在 React\
  \ 轮我们之前的状态更新之前，用户成功地*再次*点击了减小按钮。响应用户交互是高优先的，因此 React 会调用 `decrement()`。此时状态中的 `value`\
  \ *仍然*是 `125`。因此，我们又入了*另一个*状态更新，再次将 `value` 设置为 `124`。\n\nReact 随后会提交这两个状态更新。令我们敏锐且手快的用户感到沮丧的是，应用显示的计数不是正确的\
  \ `123`，而是 `124`。\n\n在我们简单的例子中，这个 bug 发生的概率很小。但随着 React 应用复杂性的增加，React 可能会遇到被动画等高优先级工作过载的时期。可以想象，状态更新可能会被持续相当长的时间。\n\
  \n只要状态转换依赖于当前状态，使用函数来设置状态就有助于避免此类诡异 bug 的产生概率。\n\n### 思考状态\n\n将状态散布在整个应用中会使其变得难以理解。在构建有状态的组件时，我们应该注意把**什么**内容放入状态中，以及**为什么**使用状态。\n\
  \n通常，我们希望尽量减少应用中保留组件本地状态的组件数量。\n\n如果我们的组件具有满足以下情况的 UI 状态：\n\n1. 无法从外部“获取”或\n2. 无法传递到组件中，\n\
  \n那么通常就是将状态构建到组件内部的场景。\n\n然而，任何可以通过 `props` 或其他组件传递的数据通常最好保持原样。我们*唯一*应该放入状态中的信息是那些不是计算得出的、且不需要在整个应用中*同步*的值。\n\
  \n保持状态通常有助于强制和维护一致的 UI，否则 UI 将不会更新。此外，还有一点需要记住，我们应该尽量减少放入状态中的信息量。我们能保持它越小、越序列化（即我们是否能轻松地将其转换为\
  \ `JSON`），越好。这不仅会让我们的应用运行更快，而且更容易理解。当我们的状态变得很大和或不可管理时，通常是一个危险信号。\n\n我们可以减轻和最小化复杂状态的一种方法是构建由无状态组件组成的单个有状态组件：无状态组件是不保留状态的组件。\n\
  \n### 无状态组件\n\n构建*有状态*组件的替代方法是使用*无状态*组件。无状态组件旨在成为轻量级组件，不需要在组件周围进行任何特殊处理。\n\n无状态组件是\
  \ React 构建只需要 `render()` 方法的组件的轻量级方式。\n\n让我们来看无无组件的示例：\n\n```\nconst Header = function(props)\
  \ {\n  return (<h1>{props.headerText}</h1>)\n}\n```\n\n`advanced-components/components-cookbook/src/components/Header/StatelessHeader.js`\n\
  \n注意，我们在访问 props 时没有引用 `this`，因为它们只是被传递给函数。这里的无状态组件在意义上并不是一个类，因为它不是一个 `ReactElement`。\n\
  \n在处理函数式无状态组件时，我们不会引用 `this`。它们只是函数，没有底层实例。这些组件*不能*包含状态，也不会通过普通的组件生命周期方法被调用。\n\n\
  React **确实**允许我们在无状态组件上使用 `propTypes` 和 `defaultProps`。\n\n既然有这么多限制，我们为什么想要使用无状态组件呢？有两个原因：\n\
  \n第一，正如我们上面讨论的，有状态组件通常会将复杂性散布在整个系统中。尽可能使用无状态组件有助于将状态限制在少数位置。这使得我们的程序更容易理解。\n\n其次，使用函数组件可以带来性能优势。组件的设置和拆卸的“仪式感”更少。React\
  \ 核心团队提到，未来可能会为函数组件引入更多的性能改进。\n\n一个经验是尽可能使用无状态组件。如果我们不需要任何生命周期方法并且只需要一个渲染函数，那么使用无状态组件是一个很棒的选择。\n\
  \n### 切换到无状态\n\n我们可以将上面的 `Switch` 组件转换为无状态组件吗？嗯，当前选定的支付选项确实是状态，因此它必须保留在某处。\n\n虽然我们不能完全移除状态，但至少可以隔离它。这是\
  \ React 应用中的常见模式：尝试将状态提取到几个父组件中。\n\n在我们的 `Switch` 组件中，我们将每个选项提取到 `renderChoice`\
  \ 函数中。这表明它是提取到它自己的无状态组件的良好候选。但有一个问题：`renderChoice` 是调用 `select` 的函数，这意味着它间接上是调用\
  \ `setState` 的函数。让我们看看如何处理这个问题：\n\n```\n 7 const Choice = ({ active, onClick, label\
  \ }) => {\n 8   const cssClasses = [\"choice\"];\n 9 \n10   if (active) {\n11  \
  \   // <-- check state\n12     cssClasses.push(\"active\");\n13   }\n14 \n15   return\
  \ (\n16     <div className={cssClasses.join(\" \")} onClick={onClick}>\n17     \
  \  {label} {/* allow any label */}\n18     </div>\n19   );\n20 };\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch6.js`\n\
  \n在这里我们创建了一个 `Choice` 函数，它*是一个无状态组件*。\n\n但我们有一个问题：如果我们的组件是无状态的，我们就无法从 `state` 中读取。我们该怎么办呢？通过\
  \ `props` 传递参数。\n\n在 `Choice` 中我们做了三个更改（在代码注释中标记）：\n\n1. 我们通过读取 `active` 来确定此选项是否处于激活状态\n\
  2. 当 `Choice` 被点击时，我们调用 `onClick` 上的任何函数\n3. label 由 `label` 决定\n\n所有这些更改意味着 `Choice`\
  \ 与 `Switch` 语句*解耦*了。我们现在可以在任何地方使用 `Choice`，只要通过 props 传递 `active`、`onClick` 和 `label`。\n\
  \n让我们看看这如何改变 `Switch`：\n\n```\n35   render() {\n36     return (\n37       <div className=\"\
  switch\">\n38         <Choice\n39           onClick={this.select(CREDITCARD)}\n\
  40           active={this.state.payMethod === CREDITCARD}\n41           label=\"\
  Pay with Creditcard\"\n42         />\n43         <Choice\n44           onClick={this.select(BTC)}\n\
  45           active={this.state.payMethod === BTC}\n46           label=\"Pay with\
  \ Bitcoin\"\n47         />\n48         Paying with: {this.state.payMethod}\n49 \
  \      </div>\n50     );\n51   }\n```\n\n`advanced-components/components-cookbook/src/components/Switch/steps/Switch6.js`\n\
  \n在这里我们使用我们的 `Choice` 组件并传递了三个 props（参数）`active`、`onClick` 和 `label`。这种方法的巧妙之处在于我们可以轻松地：\n\
  \n1. 通过更改 `onClick` 的输入来更改点击此选项时发生什么\n2. 通过更改 `active` prop 来更改认为特定选项为激活状态的条件\n\
  3. 将 label 更改为任意字符串\n\n通过创建无状态组件 `Choice`，我们能够使 `Choice` 可复用，而不绑定到任何特定的 `state`。\n\
  \n### 无状态鼓励复用\n\n\n\n\n无状态组件是创建可复用组件的一种极方法。因为无状态组件需要从外部传递所有的配置，只要我们提供了正确的钩子（hooks），我们通常可以在几乎任何项目中复用无状态组件。\n\
  \n现在我们已经涵盖了 `props`、`context` 和 `state`，接下来我们将介绍一些可以使用于组件的其他高级特性。\n\n我们的组件存在于层级结构中，有时我们需要与子组件进行通信（或操作它们）。在下一节中，我们将讨论如何实现这一点。\n\
  \n### 使用 `props.children` 与子组件通信\n\n虽然我们通常由自己指定 `props`，但 React 为我们提供了一些特殊的 `props`。在我们的组件中，我们可以通过\
  \ `this.props.children` 树中的子组件。\n\n例如，假设我们有一个包含 `Article` 的 `Newspaper` 组件：\n\n\
  ```\n 3 const Newspaper = props => {\n 4   return (\n 5     <Container>\n 6    \
  \   <Article headline=\"An interesting Article\">\n 7         Content Here\n 8 \
  \      </Article>\n 9     </Container>\n10   0\n11 }\n```\n\n`advanced-components/components-cookbook/src/components/Article/Newspaper.js`\n\
  \n上面的容器组件包含一个子组件，即 `Article` 组件。`Article` 组件包含多少子组件？它包含一个子组件，即文本 `Content Here`。\n\
  \n在 `Container` 组件中，假设我们想在 `Article` 组件渲染的任何内容*周围*添加标记。为了实现这一点，我们在 `Container` 组件中编写\
  \ JSX，然后放置 `this.props.children`：\n\n```\n3 class Container extends React.Component\
  \ {\n4   render() {\n5     return <div className=\"container\">{this.props.children}</div>;\n\
  6   }\n```\n\n`advanced-components/components-cookbook/src/components/Article/Container.js`\n\
  \n上面的 `Container` 组件将创建一个 `class='container'` 的 `div`，而该 React 树的子组件将在该 `div` 内部渲染。\n\
  \n通常情况下，如果有多个组件，React 将将 `this.props.children` prop 作为一个组件列表传递；而如果只有一个组件，它将传递单个元素。\n\
  \n现在我们已经知道了 `this.props.children` 是如何运作的，我们应该重写之前的 `Container` 组件，使用 `propTypes`\
  \ 来记录我们组件的 API。我们可以预见 `Container` 可能包含多个 `Article` 组件，但它也可能包含单个 `Article`。因此，让我们指定\
  \ `children` prop 可以是元素，也可以是数组。\n\n```\n1 class DocumentedContainer extends React.Component\
  \ {\n2   static propTypes = {\n3     children: PropTypes.oneOf([PropTypes.element,\
  \ PropTypes.array])\n4   };\n5   // ...\n6   render() {\n7     return <div className=\"\
  container\">{this.props.children}</div>;\n8   }\n9 }\n```\n\n`advanced-components/components-cookbook/src/components/Article/DocumentedContainer.js`\n\
  \n每当我们想在组件中使用 `children` 时，检查我们的 `children` prop 是类型可能会变得繁琐。我们可以通过以下几种不同的方式处理这个问题：\n\
  \n1. 要求每次 `children` 必须是单个子组件（例如，将子组件包装在它们自己的元素中）。\n2. 使用 React 提供的 `Children` 辅助函数。\n\
  \n要求子组件为单个元素的第一种方法是非常直接的。与其将上面的 children 定义为 `oneOfType()`，我们可以将 children 设置为单个元素。\n\
  \n```\n1 class SingleChildContainer extends React.Component {\n2   static propTypes\
  \ = {\n3     children: PropTypes.element.isRequired\n4   };\n5   // ...\n6   render()\
  \ {\n7     return <div className=\"container\">{this.props.children}</div>;\n8 \
  \  }\n9 }\n```\n\n`advanced-components/components-cookbook/src/components/Article/SingleChildContainer.js`\n\
  \n在 `SingleChildContainer` 组件内部，我们可以处理子组件*始终*能够被渲染为层级结构中的单个叶子节点。\n\n第二种方法是使用 `React.Children`\
  \ 工具辅助函数来处理子组件。有许多处理子元素的辅助方法，让我们现在来看它们。\n\n### `React.Children.map()` & `React.Children.forEach()`\n\
  \n我们对子组件最常用的常用的操作是对其列表进行映射（map）。我们经常会使用 `map` 在子组件上调用 `React.cloneElement()` 或 `React.createElement()`。\n\
  \n让我们重写之前的 `Container`，允许为每个孩子提供一个可配置的包装组件。这里的想法是该组件接收：\n\n1. 一个 prop `component`，它将包装每个子组件。\n\
  2. 一个 prop `children`，它是我们要包装的子组件列表。\n\n为了实现这一点，我们调用 `React.createElement()` 为每个子组件生成一个新的\
  \ `ReactElement`：\n\n```\n 1 class MultiChildContainer extends React.Component {\n\
  \ 2   static propTypes = {\n 3     component: PropTypes.element.isRequired,\n 4\
  \     children: PropTypes.element.isRequired\n 5   };\n 6   // ...\n 7   renderChild\
  \ = (childData, index) => {\n 8     return React.createElement(\n 9       this.props.component,\n\
  10       {}, // <~ child props\n11       childData // <~ child's children\n12  \
  \   );\n13   };\n14   // ...\n15   render() {\n16     return (\n17       <div className=\"\
  container\">\n18         {React.Children.map(this.props.children, this.renderChild)}\n\
  19       </div>\n20     );\n21   }\n22 }\n```\n\n`advanced-components/components-cookbook/src/components/Article/MultiChildContainer.js`\n\
  \n同样，`React.Children.map()` 和 `React.Children.forEach()` 区别在于前者创建一个数组并返回每个函数的结果，而后者不会。我们在渲染子组件时大部分都会使用\
  \ `.map()`。\n\n#### `React.Children.toArray()`\n\n`props.children` 返回的数据结构处理起来可能很困难。通常在处理元素时，我们想要将\
  \ `props.children` 转换为普通数组，例如当我们想要对子组件的顺序进行排序时。`React.Children.toArray()` 将 `props.children`\
  \ 数据结构转换为子数组。\n\n```\n 1 class ArrayContainer extends React.Component {\n2   static\
  \ propTypes = {\n3     component: PropTypes.element.isRequired,\n4     children:\
  \ PropTypes.element.isRequired\n5   };\n6   // ...\n7   render() {\n8     const\
  \ arr = React.Children.toArray(this.props.children);\n9 \n10    return <div className=\"\
  container\">\n11      {arr.sort((a, b) => a.id < b.id)}\n12    </div>;\n13  }\n\
  14 }\n```\n\n`advanced-components/components-cookbook/src/components/Article/ArrayContainer.js`\n\
  \n### 总结\n\n通过使用 `props` 和 `context`我们将数据传递到组件中，通过使用 `propTypes` 我们可以对要求的数据指定明确的预期。\n\
  \n通过使用 `state` 我们保留组件本地数据，并在状态更改时告诉组件重新渲染。然而，状态可能是很复杂的！减少状态组件的一种技术是使用无状态的函数式组件。\n\
  \n\n\n\n从某种意义上说，这才是实战阶段。通过表单，用户可以添加支付信息、搜索结果、编辑个人资料、上传照片或发送消息。表单将你的 Web **网站**转变为\
  \ Web **应用**。\n\n表单看起来可能非常简单。你实际上只需要一些 `input` 标签和一个包裹在 `form` 标签中的 `submit` 标签即可。然而，创建一个丰富、具有交互性且易于使用的表单通常涉及大量的编程工作：\n\
  \n* 表单输入会修改页面上和服务器上的数据。\n* 更改通常需要与页面其他地方的数据保持同步。\n* 用户可能会输入不可预测的值，其中某些值是我们可能想要修改或直接拒绝的。\n\
  * 在验证失败时，UI 需要清晰地说明预期结果和错误。\n* 字段之间可以相互依赖并具有复杂的逻辑。\n* 表单中收集的数据通常被异步发送到后端服务器，我们需要让用户知道正在发生什么。\n\
  * 我们希望能够测试表单。\n\n如果这听起来很令人生畏，不要担心！这正是 React 诞生的原因：为了处理 Facebook 需要构建的复杂表单。\n\n我们将通过构建一个注册应用来探索如何使用\
  \ React 处理这些挑战。我们将从简单开始，并在每一步添加更多功能。\n\n### 准备工作\n\n在书中附带的代码下载中，导航到 `forms` 文件夹：\n\
  \n```\n$ cd forms\n```\n\n该文件夹包含本章所有的代码示例。要在浏览器中查看它们，请运行 `npm install`（或简写 `npm\
  \ i`）来安装依赖：\n\n```\n$ npm i\n```\n\n完成后，你可以使用 `npm start` 启动应用：\n\n```\n$ npm start\n\
  ```\n\n你应该能在终端中看到以下内容：\n\n```\n$ npm start\n\nCompiled successfully!\n\nThe app\
  \ is running at:\n\n  http://localhost:3000/\n```\n\n现在访问 `http://localhost:3000`\
  \ 你就能在浏览器中看到该应用了。\n\n### 按钮\n\n本质上讲，表单是与用户的对话。字段是应用的问题，用户输入的值就是答案。\n\n让我们问问用户对 React\
  \ 的看法。\n\n我们可以给用户提供一个文本框，但我们将从更简单的开始。在这个示例中，我们将响应限制为两个可能的答案之一。我们想知道用户认为 React 是“很棒”还是“太惊了”，简单的方法是给他们两个按钮供选择。\n\
  \n以下是第一个示例的样子：\n\n![基础按钮](img/forms----01-basic-button.png)\n\n基础按钮\n\n为了让我们的应用达到这一阶段，我们创建一个带有\
  \ `render()` 方法的组件，该方法返回一个带有三个子元素的 `div`：一个包含问题的 `h1` 和两个用于答案的 `button` 元素。它看起来如下：\n\
  \n```\n17   render() {\n18     return (\n19       <div>\n20         <h1>What do\
  \ you think of React?</h1>\n21 \n22         <button\n23           name='button-1'\n\
  24           value='great'\n25           onClick={this.onGreatClick}\n26       \
  \  >\n27           Great\n28         </button>\n29 \n30         <button\n31    \
  \       name='button-2'\n32           value='amazing'\n33           onClick={this.onAmazingClick}\n\
  34         >\n35           Amazing\n36         </button>\n37       </div>\n38  \
  \   );\n39   }\n```\n\nforms/src/01-basic-button.js\n\n到目前为止，这看起来非常像使用原生 HTML 处理表单的方式。需要注意的重要部分是\
  \ `button` 元素的 `onClick` `prop`。当 `button` 被点击时，如果它设置了函数作为其 `onClick` `prop`，该函数就会调用。我们将利用这种行为来获取用户的答案。\n\
  \n为了知道用户的答案，我们为每个按钮传递了不同的函数。具体来说，我们将创建一个函数 `onGreatClick()` 并将其提供给“Great”按钮，创建一个函数\
  \ `onAmazingClick()` 并将其提供给“Amazing”按钮。\n\n这些函数的形式如下：\n\n```\n 9   onGreatClick\
  \ = (evt) => {\n10     console.log('The user clicked button-1: great', evt);\n11\
  \   };\n12 \n13   onAmazingClick = (evt) => {\n14     console.log('The user clicked\
  \ button-2: amazing', evt);\n15   };\n```\n\nforms/src/01-basic-button.js\n\n当用户点击“Amazing”按钮时，关联的\
  \ `onClick` 函数将运行（在这种情况下为 `onAmazingClick()`）。相反，如果用户点击了“Great”按钮，则会运行 `onGreatClick()`。\n\
  \n这将成为应用响应用户输入的基础。我们的应用可以根据用户的响应执行不同的操作。在这种情况下，我们在 `console` 中记录了不同的消息。\n\n### 事件与事件处理器\n\
  \n请注意，我们的 `onClick` 函数（`onAmazingClick()` 和 `onGreatClick()`）接受一个参数 `evt`。这是因为这些函数是*事件处理器*。\n\
  \n处理事件是使用 React 处理表单的核心。当我们为元素的 `onClick` `prop` 提供一个函数时，该函数就变成了事件处理器。当该事件发生时，该函数会被调用（在本例中为\
  \ `onAmazingClick()`），它将**接收到一个事件对象**（`evt`）。这个 `SyntheticEvent` 是浏览器原生事件的封装，你可以像使用原生事件\
  \ 一样使用它。此外，如果你需要原生事件，可以通过 `evt.nativeEvent` 属性访问它。\n\n事件对象包含了大量关于发生操作的信息。例如，`MouseEvent`\
  \ 可以让你看到点击时的 x 和 y 坐标、是否按了 shift 键，以及（这对示例有用）对被点击元素的引用。我们将在下一节中使用这些信息来简化代码。\n\n\
  ### 返回按钮\n\n在上节中，我们可以根据用户的操作执行不同的操作（记录不同的消息）。然而，按照我们设置的方式，我们需要为每个操作创建一个单独的函数。相反，如果为按钮提供同一个事件处理器，并利用事件本身的信息来确定响应，将会清晰得多。\n\
  \n为了实现这一点，我们将两个事件处理器 `onGreatClick()` 和 `onAmazingClick()` 替换为一个新的事件处理器 `onButtonClick()`。\n\
  \n```\n 9   onButtonClick = (evt) => {\n10     const btn = evt.target;\n11     console.log(`The\
  \ user clicked ${btn.name}: ${btn.value}`);\n12   };\n```\n\nforms/src/02-basic-button.js\n\
  \n我们的点击处理器接收一个事件对象 `evt`。`evt` 有一个属性 `target`，它是被点击按钮的引用。通过这种方式，无需为每个按钮创建函数即可访问被点击的按钮。我们可以为不同的行为记录不同的消息。\n\
  \n接下来，我们更新 `render()` 函数，让我们的 `button` 元素都使用同一个事件处理器，即我们新的 `onButtonClick()` 函数。\n\
  \n```\n14   render() {\n15     return (\n16       <div>\n17         <h1>What do\
  \ you think of React?</h1>\n18 \n19         <button\n20           name='button-1'\n\
  21           value='great'\n22           onClick={this.onButtonClick}\n23      \
  \   >\n24           Great\n25         </button>\n26 \n27         <button\n28   \
  \        name='button-2'\n29           value='amazing'\n30           onClick={this.onButtonClick}\n\
  31         >\n32           Amazing\n33         </button>\n34       </div>\n35  \
  \   );\n36   }\n```\n\n\n\n\n\n通过利用事件对象并使用共享的事件处理程序，我们可以添加 100 个新按钮，而无需对应用程序进行任何其他更改。\n\
  \n## 文本输入\n\n在在上一个示例中，我们将用户的响应限制在两种可能性中的一种。现在我们已经学会了如何在 React 中利用事件对象和处理器，我们将接受更广泛的响应范围，并过渡到一种更典型的表单用法：文本输入。\n\
  \n为了展示文本输入，我们将创建一个“报名表”应用程序。该应用的目的是允许用户记录一份想要参加活动的人员姓名列表。\n\n该应用向用户展示一个文本字段，他们可以在其中输入姓名并点击“提交”。当他们输入一个姓名时，该姓名会被添加到列表中，该列表会显示出来，并且文本框会被清空，以便他们输入新姓名。\n\
  \n它的外观看起来是这样的：\n\n![报名：添加到列表](img/forms----04-basic-input.png)\n\n报名：添加到列表\n\n###\
  \ 使用 `refs` 获取用户输入\n\n我们希望在用户提交表单时读取文本字段的内容。实现此点的一种简单方法是等待用户提交表单，在 DOM 中找到该文本字段，最后获取它的\
  \ `value`。\n\n首先，我们将从创建一个包含两个子元素的 `form` 元素开始：一个文本输入字段和一个提交按钮：\n\n```\n14   render()\
  \ {\n15     return (\n16       <div>\n17         <h1>Sign Up Sheet</h1>\n18 \n19\
  \         <form onSubmit={this.onFormSubmit}>\n20           <input\n21         \
  \    placeholder='Name'\n22             ref='name'\n23           />\n24 \n25   \
  \        <input type='submit' />\n26         </form>\n27       </div>\n28     );\n\
  29   }\n```\n\n`forms/src/03-basic-input.js`\n\n这与上一个示例非常相似，但现在我们不再使用两个 `button`\
  \ 元素，而是使用了一个包含两个子元素的 `form` (表单) 元素：一个文本字段和一个提交按钮。\n\n这里有两点需要注意。首先，我们为 `form` 元素添加了一个\
  \ `onSubmit` 事件处理程序。其次，我们为文本字段赋予了名为 `'name'` 的 `ref` 属性。\n\n通过在 `form` 元素上使用 `onSubmit`\
  \ 事件处理程序，此示例的行为与之前略有不同。一个变化是，该处理器可以通过点击“提交”按钮或在 `form` 获得焦点时按下“回车”/“返回”键来调用。这比强制用户点击“提交”按钮更符合用户习惯。\n\
  \n然而，由于我们的事件处理程序绑定到 `form` 上，传递给处理器的事件对象参数比在上一个示例中没那么用。之前，我们能够使用事件的 `target` 属性来引用\
  \ `button` 并获取其值。这一次，我们感兴趣的是文本字段的值。一种方案是使用事件的 `target` 来引用 `form`，然后从那里找到我们感兴趣的子元素\
  \ `input`，但有一种更简单的方法。\n\n在 React 中，如果想想在组件中轻松地访问 DOM 元素，可以使用 `refs`（引用）。在上面，我们为文本字段设置了\
  \ `'name'` 的 `ref` 属性。稍后当 `onSubmit` 处理器被调用时，我们有能力访问 `this.refs.name` 来获取该文本字段的引用。这是在我们的\
  \ `onFormSubmit()` 事件处理程序中的写法：\n\n```\n 9   onFormSubmit = (evt) => {\n10     evt.preventDefault();\n\
  11     console.log(this.refs.name.value);\n12   };\n```\n\n`forms/src/03-basic-input.js`\n\
  \n如你所示，通过使用 `this.refs.name`，我们获得了文本字段元素的引用，并可以访问它的 `value` 属性。该 `value` 属性包含了输入字段的文本。\n\
  \n![记录姓名](img/forms----03-basic-input.png)\n\n记录姓名\n\n仅需 `render()` 和 `onFormSubmit()`\
  \ 两个函数，我们现在应该能够在点击“提交”时，在控制台中看到文本字段的 `value`。在下一步骤中，我们将获取该 `value` 并将其显示在页面上。\n\n\
  ### 使用用户输入\n\n现在我们已经展示了可以获取用户提交的姓名，我们可以开始使用这些信息来更改应用的状态和 UI。\n\n此示例的目标是显示一个包含用户输入的所有姓名的列表。React\
  \ 让这变得简单。我们将在状态（state）中维护一个数组来存储姓名，并在 `render()` 中使用该数组来填充列表。\n\n当应用程序加载时，数组将是空的，每当用户提交新姓名时，我们将其添加到数组中。为了实现这一点，我们将对组件进行一些添加。\n\
  \n首先，我们将在状态中创建一个 `names` 数组。在 React 中，当我们使用 ES6 组件类时，可以通过定义 `state` 属性来设置我们 `state`\
  \ 对象的初始值。\n\n它的外观看起来是这样的：\n\n```\n6 module.exports = class extends React.Component\
  \ {\n7   static displayName = \"04-basic-input\";\n8   state = { names: [] };\n\
  ```\n\n`forms/src/04-basic-input.js`\n\n接下来，我们将用新姓名更新 `state`。这是我们的 `render()`：\n\
  \n```\n18   render() {\n19     return (\n20       <div>\n21         <h1>Sign Up\
  \ Sheet</h1>\n22 \n23         <form onSubmit={this.onFormSubmit}>\n24          \
  \ <input\n25             placeholder='Name'\n26             ref='name'\n27     \
  \      />\n28 \n29           <input type='submit' />\n30         </form>\n31   \
  \      <ul>\n32           {this.state.names.map((name, i) => (\n33             <li\
  \ key={i}>{name}</li>\n34           ))}\n35         </ul>\n36       </div>\n37 \
  \    );\n38   }\n```\n\n等一下，提供的文本中代码块的逻辑有些混乱并混杂了行号。我将根据上下文重构逻辑。\n\n*纠正：提供的文本中某些代码块是片段化的。我将遵循格式规则清理代码并保持核心逻辑。*\n\
  \n为了将姓名添加到我们的 `names` 数组，我们可能会想执行 `this.state.names.push(name)`。然而，React 依赖 `setState()`\
  \ 来改变状态。正确这样做的方法是：\n\n1. 创建一个复制 `names` 的新变量\n2. 将新姓名添加到该数组中\n3. 最后在 `setState()`\
  \ 中该变量\n\n我们还想清空文本字段，以便进行更多输入。由于我们已经通过 `refs` 访问了文本字段，我们可以将其 `value` 设置为空字符串。\n\n\
  这是 `onFormSubmit()` 应该的样子：\n\n```javascript\n10   onFormSubmit = (evt) => {\n11\
  \     const name = this.refs.name.value;\n12     const names = [...this.state.names,\
  \ name];\n13     this.setState({ names: names });\n14     this.refs.name.value =\
  \ '';\n15     evt.preventDefault();\n16   };\n```\n\n到此，我们的报名应用就可以正常工作。这里是应用程序流程的概述：\n\
  \n1. 用户输入姓名并点击“提交”。\n2. 调用 `onFormSubmit`。\n3. 使用 `this.refs.name` 访问文本字段的值（姓名）。\n\
  4. 将姓名添加到状态中的 `names` 列表中。\n5. 文本字段被清空，以便进行更多输入。\n6. `render` 被调用并显示更新后的姓名列表。\n\n\
  ## 非控组件与受控组件\n\n在之前的章节中，我们利用 `refs` 来访问用户的输入。当我们创建 `render()` 方法时，我们添加了一个带有 `ref`\
  \ 属性的 `input` 字段。稍后我们通过该属性获取渲染后的 `input` 引用，以便能够访问并修改其 `value`。\n\n\n\n\n我们之前介绍了在表单中使用\
  \ `refs` 的用法，因为这在概念上与人们不使用 React 处理表单的方式相似。然而，通过这种方式使用 `refs`，我们放弃了使用 React 的一个主要优势。\n\
  \n在上一个示例中，我们直接访问 DOM 以从文本字段中获取名称，并在提交名称后通过直接重置字段来直接操作 DOM。\n\n在 React 中，我们不应该担心为了匹配应用状态而修改\
  \ DOM。我们应该只专注于更改 `state`，并依赖 React 高效操作 DOM 以匹配状态的能力。这为我们提供了确定性：对于任何给定的 `state`\
  \ 取值，我们都可以预测 `render()` 将返回什么，从而知道我们的应用将长什么样。\n\n在在上一个示例中，我们的文本字段就是我们说的“非受控组件”。这是另一种表达方式，意味着\
  \ React 并不“控制”它的渲染方式——具体来说就是它的值。换句话说，React 是不干预的，允许它自由地受到用户交互的影响。这意味着仅知道应用状态不足以预测页面（特别是\
  \ `input` 字段）的状况。因为用户可能在字段中输入（或未输入）内容，所以了解 `input` 字段状况的唯一方法是通过 `refs` 访问并检查它的 `value`。\n\
  \n还有另一种方法。通过将此字段转换为“受控组件”，我们赋予了 React 对它的控制权。它的 `value` 将始终由 `render()` 和我们的应用状态指定。当我们这样做时，就可以通过检查\
  \ `state` 对象来预测我们应用的样式。\n\n通过将视图直接与应用状态绑定，我们可以用极少的工作获得某些功能。例如，想象一个长 `form`，用户必须通过填写许多\
  \ `input` 字段来回答很多问题。如果用户进行到一半时不小心刷新了页面，通常会清空所有字段。如果这些是受控组件，并且我们的应用状态被持久化到 `localStorage`\
  \ 中，我们就能准确地回到他们离开的地方。稍后我们将介绍另一个由受控组件铺平道路的重要功能：验证。\n\n### 使用 `state` 访问用户输入\n\n将非受控的\
  \ `input` 组件转换为受控组件需要三步。首先，我们需要在 `state` 中一个地方来存储它的值。其次，我们将 `state` 中的该位置作为它的 `value`\
  \ `prop` 传递。最后，我们添加一个 `onChange` 处理程序来更新它 `state` 中的值。受控组件的流程如下：\n\n1. 用户输入/更改输入。\n\
  2. 调用带有“change”事件的 `onChange` 处理程序。\n3. 使用 `event.target.value` 更新 `state` 中 `input`\
  \ 元素的 `value`。\n4. 调用 `render()`，`input` 根据 `state` 中的新值进行更新。\n\n这是在将 `input` 转换为受控组件后，我们的\
  \ `render()` 方法的样子：\n\n```\n24   render() {\n25     return (\n26       <div>\n27\
  \         <h1>Sign Up Sheet</h1>\n28 \n29         <form onSubmit={this.onFormSubmit}>\n\
  30           <input\n31             placeholder='Name'\n32             value={this.state.name}\n\
  33             onChange={this.onNameChange}\n34           />\n35 \n36          \
  \ <input type='submit' />\n37         </form>\n38 \n39         <div>\n40       \
  \    <h3>Names</h3>\n41           <ul>\n42             { this.state.names.map((name,\
  \ i) => <li key={i}>{name}</li>) \\\n43 ) }\n44           </ul>\n45         </div>\n\
  46       </div>\n47     );\n48   }\n```\n\n`forms/src/05-state-input.js`\n\n我们的\
  \ `input` 唯一的区别是，移除了 `ref` `prop`，并用 `value` 和 `onChange` `prop` 替换了它。\n\n现在 `input`\
  \ 是“受控”的，它的 `value` 将始终被设置为等于我们 `state` 的某个属性。在这种情况下，该属性是 `name`，因此 `input` 的 `value`\
  \ 是 `this.state.name`。\n\n虽然不是严格必须的，但为组件中使用的任何 `state` 属性提供合理的默认值是一个好习惯。由于我们现在使用\
  \ `state.name` 作为 `input` 的 `value`，我们希望在用户有机会提供值之前选好它将拥有的值。在我们的案例中，我们希望字段是空的，因此默认值将是一个空字符串\
  \ `''`：\n\n```\n 9   state = {\n10     name: '',\n11     names: [],\n12   };\n```\n\
  \n`forms/src/05-state-input.js`\n\n如果我们只停在那里，`input` 实际上将被禁用了。无论用户向其输入什么，它的 `value`\
  \ 都不会改变。事实上，如果让我们保持这样，React 会在控制台中向我们发出警告。\n\n为了让我们的 `input` 运行，我们需要监听它的 `onChange`\
  \ 事件并使用这些事件来更新 `state`。为了实现这一点，我们为 `onChange` 创建了一个事件处理程序。该处理程序负责更新我们的 `state`，以便\
  \ `state.name` 始终根据用户输入到字段中的内容进行更新。我们创建了 `onNameChange` 方法来实现此目的。\n\n现在的 `onNameChange`\
  \ 是这样的：\n\n```\n20   onNameChange = (evt) => {\n21     this.setState({ name: evt.target.value\
  \ });\n22   };\n```\n\n`forms/src/05-state-input.js`\n\n`onNameChange` 是一个简单的函数。正如我们在之前的节中做的那样，我们通过传递给处理程序的事件来引用字段。`state.name`\
  \ 被更新，这反过来触发 `render()` 来更新字段。\n\n现在受控组件的循环就完成了。然而，我们的应用还需要一个更改。当用户提交表单时，会调用 `onFormSubmit()`，我们需要它将\
  \ `state.name` 添加到名称列表中。在我们上次看到 `onFormSubmit()` 时它是使用 `this.refs` 的，现在我们更新为：\n\n\
  ```\n14   onFormSubmit = (evt) => {\n15     const names = [...this.state.names,\
  \ this.state.name];\n16     this.setState({ names, name: '' });\n17     evt.preventDefault();\n\
  18   };\n```\n\n`forms/src/05-state-input.js`\n\n注意，获取当前名称只需访问 `this.state.name`，因为它会被\
  \ `onNameChange()` 持续更新。我们将其添加到名称列表 `this.state.names` 并更新 `state`。我们还清理了 `this.state.name`，以便字段为空。\n\
  \n虽然我们的应用没有获得新功能，但我们为更好的功能（如验证和持久化）铺平了道路，同时也更好地利用了 React 范式。\n\n### 多字段\n\n我们的注册表单看起来不错，但如果我们想添加更多字段会发生什么？如果我们的注册表单像大多数项目一样，添加字段只是时间问题。对于表单，我们经常会想要添加输入。\n\
  \n如果我们继续目前的方法并创建更多的受控组件，每个组件都有相应的状态属性和 `onChange` 处理程序，我们的组件将变得非常冗长。在输入、状态和处理程序之间建立一对一的关系并不是理想的。\n\
  \n让我们探索如何修改应用，以一种整洁、可维护的方式允许额外的输入。为了说明这一点，让我们在注册表单中添加电子邮件地址。\n\n在上一节中，我们的 `input`\
  \ 字段在 `state` 对象的根部有一个专用属性。如果我们在这里这样做，我们将添加另一个属性 `email`。为了避免在 `state` 上为每个输入添加一个属性，我们改为添加一个\
  \ `fields` 对象来在一个处存储所有字段的值。这里是我们新的初始 `state`：\n\n```\n 9   state = {\n10     fields:\
  \ {\n11       name: '',\n12       email: ''\n13     },\n14     people: []\n15  \
  \ };\n```\n\n`forms/src/06-state-input-multi.js`\n\n\n\n这个 `fields` 对象可以存储任意数量的输入项状态。在这里，我们指定了要存储\
  \ `name` 和 `email` 字段。现在，我们将在 `state.fields.name` 和 `state.fields.email` 查找这些值，而不是在\
  \ `state.name` 和 `state.email`。\n\n![Name and Email Fields](img/forms----06-state-input-multi.png)\n\
  \n## 姓名和邮箱字段\n\n当然，这些值将需要通过事件处理程序来更新。我们*可以*为表单中的每个字段创建一个事件处理程序，但这涉及大量的复制/粘贴，并不必要地增加组件的负担。此外，这会让维护变得更加困难，因为表单的任何更改都需要在多个地方进行。\n\
  \n与其为每个输入框创建一个 `onChange` 处理程序，我们可以创建一个单一方法来接收来自**所有**输入项的事件。技巧在于以这种方式编写该方法：根据触发事件的\
  \ `input` 字段，更新 `state` 中正确的属性。为了实现这一点，该方法使用 `event` 参数来确定哪个输入项被更改，并相应地更新我们的 `state.fields`\
  \ 对象。例如，如果我们有一个 `input` 字段并给它一个 `name` 属性 `prop=\"email\"`，那么当该字段触发事件时，我们就能知道它是邮箱字段，因为\
  \ `event.target.name` 将是 `\"email\"`。\n\n为了看看这在实践中是如何运作的，这里是更新后的 `render()`：\n\n\
  ```javascript\n35   render() {\n36     return (\n37       <div>\n38         <h1>Sign\
  \ Up Sheet</h1></h1>\n39 \n40         <form onSubmit={this.onFormSubmit}>\n41  \
  \         <input\n42             placeholder=\"Name\"\n43             name=\"name\"\
  \n44             value={this.state.fields.name}\n45             onChange={this.onInputChange}\n\
  46           />\n47 \n48           <input\n49             placeholder=\"Email\"\n\
  50             name=\"email\"\n51             value={this.state.fields.email}\n\
  52             onChange={this.onInputChange}\n53           />\n54 \n55         \
  \  <input type=\"submit\" />\n56         </form>\n57 \n58         <div>\n59    \
  \       <h3>People</h3>\n60           <ul>\n61             {this.state.people.map(({name,\
  \ email}, i) => (\n62               <li key={i}>\n63                 {name} ({email})\n\
  64               </li>\n65             ))}\n66           </ul>\n67         </div>\n\
  68       </div>\n69     );\n70   }\n```\n\n上面的代码位于：`forms/src/06-state-input-multi.js`\n\
  \n有几点需要注意：首先，我们添加了第二个 `input` 来处理邮箱地址。\n\n其次（此处为第二），我们更改了 `input` 字段的 `value` 属性\
  \ `prop`，以便它们不再访问 `state` 对象根节点上的属性。相反，它们访问 `state.fields` 的属性。查看上面的代码，姓名的 `input`\
  \ 现在将其 `value` 设置为 `this.state.fields.name`。\n\n第三，两个 `input` 字段的 `onChange` 属性都设置了同一个事件处理程序\
  \ `onInputChange()`。我们将在下文中看到我们如何修改 `onNameChange()`，使其成为一个更通用的事件处理程序，可以接收来自任何字段的事件，而是“name”。\n\
  \n第四，我们的 `input` 字段现在有一个 `name` 属性 `prop`。这与最后一点有关。为了允许我们的通用事件处理程序 `onInputChange()`\
  \ 能够判断更改事件来自哪里，以及我们应该将其存储在状态的什么位置（例如，如果更改来自“email” `input`，则新值应该存储在 `state.fields.email`\
  \ 中），我们提供了该 `name` 属性，以便可以通过其 `target` 属性从事件中提取它。\n\n最后，我们修改了人员列表的渲染方式。因为不再仅仅是姓名列表，我们修改了\
  \ `li` 元素以同时显示之前的 `name` 属性以及我们计划拥有的新 `email` 数据。\n\n为了确保所有数据都进入正确的位置，我们需要确保我们的事件处理程序已经过正确修改。以下是\
  \ `onInputChange()` 事件处理程序（当任何字段的输入更改时被调用）应该的样子：\n\n```javascript\n29   onInputChange\
  \ = evt => {\n30     const fields = Object.assign({}, this.state.fields);\n31  \
  \   fields[evt.target.name] = evt.target.value;\n32     this.setState({fields});\n\
  33   };\n```\n\n上面的代码位于：`forms/src/06-state-input-multi.js`\n\n从核心上说，这与我们在上一节的 `onNameChange()`\
  \ 中所做的相似。两个关键区别在于：\n\n1. 我们正在更新 `state` 中嵌套的值（例如，更新 `state.fields.email` 而不是 `state.email`），\n\
  2. 我们正在使用 `evt.target.name` 来告知 `state.fields` 的哪个属性需要更新。\n\n为了正确更新我们的状态，我们首先获取\
  \ `state` 的本地引用。然后，为了确保所有数据都进入正确的位置，我们需要确保我们的事件处理程序已经过正确修改。这是 `onInputChange()`\
  \ 事件处理程序（当任何字段的输入更改时被调用）应该的样子：\n\n为了正确更新我们的状态，我们首先获取 `state` 的本地引用。然后，为了确保所有数据都进入正确的位置，我们需要确保我们的事件处理程序已经过正确修改。\n\
  \n为了正确更新我们的状态，我们首先获取 `state` 的本地引用。\n\n#### 验证\n\n验证是构建表单的核心所在，以至于很少有没有验证的表单。验证既可以在**单个字段**级别进行，也可以在**整个表单**层面进行。\n\
  \n当你在单个字段上进行验证时，你是在确保用户输入的数据符合你的应用程序对该数据的预期和约束。\n\n\n\n\n例如，如果我们想让用户输入电子邮件地址，我们期望他们的输入看起来像一个有效的电子邮件地址。如果输入看起来不像电子邮件地址，他们可能犯了错误，而我们很可能会在日后遇到麻烦（例如，他们将无法激活账户）。其他常见的示例包括确保邮政编码恰好有五个（或九个）数字，并强制密码长度至少达到某个最小值。\n\
  \n对整个表单进行验证略有不同。在这里，你将确保所有必填字段都已输入。这也是检查内部一致性的一个好地方。例如，你可能有一个订单表单，其中特定的产品需要选择特定的选项。\n\
  \n此外，在“如何”和“何时”进行验证方面，也存在权衡。对于某些字段，我们可能希望实时提供验证反馈。例如，我们可能希望在用户输入时显示密码强度（通过查看长度和使用的字符）。然而，如果我们想验证用户名的可用性，我们可能希望在用户完成输入后，再向服务器/数据库发送请求以查询结果。\n\
  \n我们还对如何显示验证错误有多种选择。我们可以对字段进行不同的样式处理（例如红色轮廓），在字段附近显示文本（例如“请输入有效的电子邮件。”），和/或禁用表单的提交按钮，以防止用户使用无效信息继续。\n\
  \n对于我们的应用程序，我们可以从对整个表单进行验证开始，并\n\n1.  确保我们既有姓名又有电子邮件\n2.  确保电子邮件是一个有效地址。\n\n###\
  \ 为我们的应用添加验证\n\n为了给我们的注册应用添加验证功能，我们做了一些更改。从高层次来说，这些更改是：\n\n1.  在 `state` 中添加一个位置来存储验证错误（如果存在），\n\
  2.  更改我们的 `render()` 方法，使其在每个字段旁边用红色文字显示验证错误信息（如果存在），\n3.  添加一个新的 `validate()` 方法，该方法接受我们的\
  \ `fields` 对象作为参数并返回一个 `fieldErrors` 对象，以及\n4.  `onFormSubmit()` 将调用新的 `validate()`\
  \ 方法来获取 `fieldErrors` 对象，如果存在错误，它会将错误添加到状态中（这样就可以在 `render()` 中显示），并提前返回，而不将“人员”添加到列表\
  \ `state.people` 中。\n\n首先，我们更改了初始的 `state`：\n\n```javascript\n10   state = {\n11\
  \     fields: {\n12       name: '',\n13       email: ''\n14     },\n15     fieldErrors:\
  \ {},\n16     people: []\n17   };\n```\n\n`forms/src/07-basic-validation.js`\n\n\
  这里的唯一更改是为 `fieldErrors` 属性创建了一个默认值。如果存在字段错误，我们将在这里存储每个字段的错误。\n\n接下来，是更新后的 `render()`\
  \ 方法如下：\n\n```javascript\n51   render() {\n52     return (\n53       <div>\n54 \
  \        <h1>注册表单</h1>\n55 \n56         <form onSubmit={this.onFormSubmit}>\n57\
  \           <input\n58             placeholder=\"Name\"\n59             name=\"\
  name\"\n60             value={this.state.fields.name}\n61             onChange={this.onInputChange}\n\
  62           />\n63 \n64           <span style={{color: 'red'}}>{this.state.fieldErrors.name}</span>\n\
  65           </span>\n66 \n67           <br />\n68 \n69           <input\n70   \
  \          placeholder=\"Email\"\n71             name=\"email\"\n72            \
  \ value={this.state.fields.email}\n73             onChange={this.onInputChange}\n\
  74           />\n75 \n76           <span style={{color: 'red'}}>{this.state.fieldErrors.email}</span>\n\
  77           </span>\n\n78 \n79           <br />\n80 \n81           <input type=\"\
  submit\" />\n82         </form>\n83 \n84         <div>\n85           <h3>人员</h3>\n\
  86           <ul>\n87             {this.state.people.map(({name, email}, i) => (\n\
  88               <li key={i}>\n89                 {name} ({email})\n90         \
  \      </li>\n91             ))}\n92           </ul>\n93         </div>\n94    \
  \   </div>\n95     );\n96   }\n```\n\n`forms/src/07-basic-validation.js`\n\n####不同之处是两个新的\
  \ `span` 元素，每个字段一个。每个 `span` 将会在 `state.fieldErrors` 中的相应位置查找错误消息。如果找到错误，它将以红色显示在字段旁边。接下来，我们将看到这些错误消息是如何进入\
  \ `state` 的。\n\n在用户提交表单之后，我们才会检查其输入的有效性。因此，开始验证的合适位置是在 `onFormSubmit()` 方法中。然而，我们可能希望为该方法创建一个独立的函数供其调用。我们为此创建了纯函数\
  \ `validate()` 方法：\n\n```javascript\n43   validate = person => {\n44     const errors\
  \ = {};\n45     if (!person.name) errors.name = '需要姓名';\n46     if (!person.email)\
  \ errors.email = '需要电子邮件';\n47     if (person.email && !isEmail(person.email)) errors.email\
  \ = '电子邮箱格式无效';\n48     return errors;\n49   };\n```\n\n`forms/src/07-basic-validation.js`\n\
  \n我们的 `validate()` 方法非常简单，有两个目标。首先，我们想确保姓名和电子邮件都存在。通过检查它们的真值（truthiness），我们可以知道它们已定义且不为空。其次，我们想知道电子邮件地址是否有效。这实际上是一个棘手的问题，所以我们依赖\
  \ [`validator`](http://npmjs.com/validator) 来告诉我们。\n\n之后，我们更新了 `onFormSubmit()`\
  \ 以使用该方法并对返回的对象执行操作：\n\n```javascript\n19   onFormSubmit = evt => {\n20     const\
  \ people = [...this.state.people];\n21     const person = this.state.fields;\n22\
  \     const fieldErrors = this.validate(person);\n23     this.setState({fieldErrors});\n\
  24     evt.preventDefault();\n25 \n26     if (Object.keys(fieldErrors).length) return;\n\
  27 \n28     this.setState({\n29       people: people.concat(person),\n30       fields:\
  \ {\n31         name: '',\n32         email: ''\n33       }\n34     });\n35   };\n\
  ```\n\n为了使用 `validate()` 方法，我们获取 `this.state.fields` 的当前值并将其作为参数传递。如果返回的对象包含错误，我们将更新状态。\n\
  \n### 创建字段组件\n\n此时，我们已经涵盖了在 React 中创建验证表单的基础性知识。在下一节中，我们将更进一步，展示如何在字段级进行实时验证，并创建一个\
  \ `Field` 组件，以提高具有多个验证需求字段的应用的可维护性。\n\n在上一节中，我们为我们的应用添加了验证。然而，我们的表单组件负责运行整个表单的验证，以及每个字段的单独验证规则。\n\
  \n如果*每个字段*都能负责识别其*自身输入*的验证错误，而父表单仅负责识别表单层面的问题，将会理想的。这具有几个优点：\n\n1.  以这种方式创建的电子邮件字段可以在用户输入时实时检查其格式。\n\
  \n\n\n\n\n## 2. 字段（Field）可以包含其验证错误消息，从而让父表单无需自行跟踪这些信息。\n\n为了实现这一点，我们首先将创建一个新的独立的\
  \ `Field` 组件，并用它来代替表单中的 `input` 元素。这将允许我们将普通的 `input` 与验证逻辑和错误消息结合在一起。\n\n在开始创建这个新组件之前，从输入和输出的角度从宏观上来思考它将会很有帮助。换句话说，“我们需要为这个组件提供什么信息？”以及“我们期望返回什么类型的内容？”这些输入将成为该组件的\
  \ `props`，而输出将由任何事件处理程序使用。\n\n由于我们的 `Field` 组件将包含一个子元素 `input`，我们需要提供可以传递的相同基础信息。例如，如果我们希望\
  \ `Field` 组件在渲染时其子元素 `input` 上带有一个特定的 `placeholder` `prop`，那么在表单的 `render()` 方法中创建\
  \ `Field` 组件时，我们必须作为一个 `prop` 提供它。\n\n我们还想要提供的两个 `props` 是 `name` 和 `value`。`name`\
  \ 将允许我们像之前那样在组件之间共享事件处理程序，而 `value` 则允许父表单预填充 `Field` 并保持其更新。\n\n此外，这个新的 `Field`\
  \ 组件负责它自己的验证。因此，我们需要为它提供它包含的规则。例如，如果这是一个“email” `Field`，我们将提供一个函数作为它的 `validate`\
  \ `prop`。在内部，它将运行此函数来确定其输入是否为有效地址。\n\n最后，我们将为 `onChange` 事件提供一个事件处理程序。我们提供的作为 `onChange`\
  \ `prop` 的函数将在每次 `Field` 中的输入发生变化时被调用，它将带有一个事件参数被调用，该参数应该包含我们感兴趣的三个属性：(1) `Field`\
  \ 的名称，(2) `input` 的当前 `value`，以及 (3) 当前的错误（如果存在）。快速回顾一下，为了 `Field` 组件完成工作，它需要以下内容：\n\
  \n- `placeholder`：这将直接传递给子元素 `input`。类似于标签（label），它告诉 `Field` 它期望的数据类型。\n- `name`：我们提供这个属性和为\
  \ `input` 元素提供 `name` 的原因相同：我们将在事件处理程序中使用它来决定存储数据和验证错误的地方。\n- `value`：这是我们的父表单如何用值初始化\
  \ `Field`，或者它可以使用它用新值更新 `Field`。这与 `input` 上 `value` `prop` 的使用方式类似。\n- `validate`：一个在运行时返回验证错误（如果有）的函数。\n\
  - `onChange`：当 `Field` 改变时运行的事件处理程序。该函数接受一个事件对象作为参数。\n\n之后，我们可以在新的 `Field` 组件上设置\
  \ `propTypes`：\n\n```\nstatic propTypes = {\n  placeholder: PropTypes.string,\n\
  \  name: PropTypes.string.isRequired,\n  value: PropTypes.string,\n  validate: PropTypes.func,\n\
  \  onChange: PropTypes.func.isRequired\n};\n```\n`forms/src/08-field-component-field.js`\n\
  \n接下来，我们可以考虑 `Field` 需要跟踪的 `state`。`Field` 只需要两个数据：当前的 `value` 和 `error`。正如在之前的章节中，我们的表单组件其\
  \ `render()` 方法需要这些数据一样，我们的 `Field` 组件也是需要。以下是我们将设置初始 `state` 的方式：\n\n```\nstate\
  \ = {\n  value: this.props.value,\n  error: false\n};\n```\n`forms/src/08-field-component-field.js`\n\
  \n一个关键区别是我们的 `Field` 有一个父组件，有时这个父组件想要更新 `Field` 的 `value` `prop`。为了允许这一点，我们需要创建一个新的周期方法\
  \ `getDerivedStateFromProps()` 来接收新的 `value` 并更新 `state`。它看起来如下：\n\n```\ngetDerivedStateFromProps(nextProps)\
  \ {\n  return {value: nextProps.value}\n}\n```\n`forms/src/08-field-component-field.js`\n\
  \n`Field` 的 `render()` 方法应该非常简单。它只是 `input` 和相应的持有错误消息的 `span`：\n\n```javascript\n\
  render() {\n  return (\n    <div>\n      <input\n        placeholder={this.props.placeholder}\n\
  \        value={this.state.value}\n        onChange={this.onChange}\n      />\n\
  \      <span style={{color: 'red'}}>{this.state.error}</span>\n    </div>\n  );\n\
  }\n```\n`forms/src/08-field-component-field.js`\n\n对于 `input` 元素，`placeholder` 将从父组件传入，并通过\
  \ `this.props.placeholder`get。如上所述，`input` 的 `value` 和 `span` 中的错误消息都将存储在 `state`\
  \ 中。`value` 来自于 `this.state.value`，错误消息位于 `this.state.error`。\n\n最后，我们将设置一个 `onChange`\
  \ 事件处理程序，负责接受用户输入、验证、更新状态并调用父组件的事件处理程序。处理这些的方法是 `this.onChange`：\n\n```javascript\n\
  onChange (evt) {\n  const name = this.props.name;\n  const value = evt.target.value;\n\
  \  const error = this.props.validate ? this.props.validate(value) : false;\n  this.setState({value,\
  \ error});\n  if (this.props.onChange) {\n    this.props.onChange({name, value,\
  \ error});\n  }\n}\n```\n\n\n\n\n\n```javascript\n 60   render() {\n 61     return\
  \ (\n 62       <div>\n 63         <h1>Sign Up Sheet</h1>\n 64 \n 65         <form\
  \ onSubmit={this.onFormSubmit}>\n 66           <Field\n 67             placeholder=\"\
  Name\"\n 68             name=\"name\"\n 69             value={this.state.fields.name}\n\
  \ 70             onChange={this.onInputChange}\n 71             validate={val =>\
  \ (val ? false : 'Name Required')}\n 72           />\n 73 \n 74           <br />\n\
  \ 75 \n 76           <Field\n 77             placeholder=\"Email\"\n 78        \
  \     name=\"email\"\n 79             value={this.state.fields.email}\n 80     \
  \        onChange={this.onInputChange}\n 81             validate={val => (isEmail(val)\
  \ ? false : 'Invalid Email')}\n 82           />\n 83 \n 84           <br />\n 85\
  \ \n 86           <input type=\"submit\" disabled={this.validate()} />\n 87    \
  \     </form>\n 88 \n 89         <div>\n 90           <h3>People</h3>\n 91     \
  \      <ul>\n 92             {this.state.people.map(({name, email}, i) => (\n 93\
  \               <li key={i}>\n 94                 {name} ({email})\n 95        \
  \       </li>\n 96             ))}\n 97           </ul>\n 98         </div>\n 99\
  \       </div>\n100     );\n101   }\n```\n\n### Field 组件的实现\n``forms/src/08-field-component-form.js`\n\
  \n你可以看到 `Field` 是 `input` 的一个无缝替换方案。所有的 `props` 都与它们在 `input` 上的相同，不同之处在于我们这次多增加了一个\
  \ `prop`：`validate`。\n\n在上方 `Field` 组件的 `onChange()` 方法中，我们调用了 `this.props.validate()`\
  \ 函数。我们传递给 `Field` 的 `validate` `prop` 将是该函数。它的目标是接收用户提供的输入作为参数，并返回一个与该输入有效性相对应的值。如果输入无效，`validate`\
  \ 将返回一个错误消息。否则，它返回 `false`。\n\n对于“name” `Field`，我们对 `validate` `prop` 只是检查它是否为真值（truthy）。只要框内有字符，验证就会通过，否则我们返回\
  \ `'Name Required'`（必填名称）错误消息。\n\n对于“email” `Field`，我们将使用从 `validator` 模块导入的 `isEmail()`\
  \ 函数。如果该函数返回 `true`，我们就知道它是一个看起来有效的邮箱，验证通过通过。如果不是，我们返回 `'Invalid Email'`（邮箱无效）消息。\n\
  \n注意我们原样保留了它们的 `onChange` `prop`，它仍然被设置为 `this.onInputChange`。但是，由于 `Field` 使用函数的方式与\
  \ `input` 不同，我们必须更新 `onInputChange()`。\n\n在继续之前，请注意我们在 `render()` 中做的另一个唯一更改：我们条件地禁用了提交按钮。为了做到这一点，我们将\
  \ `disabled` `prop` 的值设置为 `this.validate()` 的返回值。因为如果存在验证错误，`this.validate()` 将返回一个真值，所以如果表单无效，按钮将被禁用。稍后我们将展示\
  \ `this.validate()` 函数的样子。\n\n![禁用的提交按钮](img/forms----08-field-disabled-submit.png)\n\
  \n禁用的提交按钮\n\n正如所述，两个 `Field` 组件的 `onChange` `props` 都被设置为 `this.onInputChange`。我们必须进行一些更改以匹配\
  \ `input` 和我们的 `Field` 之间的差异。以下是更新后的版本：\n\n```javascript\n38   onInputChange = ({name,\
  \ value, error}) => {\n39     const fields = Object.assign({}, this.state.fields);\n\
  40     const fieldErrors = Object.assign({}, this.state.fieldErrors);\n41 \n42 \
  \    fields[name] = value;\n43     fieldErrors[name] = error;\n44 \n45     this.setState({fields,\
  \ fieldErrors});\n46   };\n```\n\n``forms/src/08-field-component-form.js`\n\n之前，`onInputChange()`\
  \ 的工作是用当前用户的输入值更新 `this.state.fields`。换句话说，当文本字段被编辑时，`onInputChange()` 会被调用并传入一个事件对象。该事件对象有一个\
  \ `target` 属性，引用了 `input` 元素。使用该引用，我们可以获取 `input` 的 `name` 和 `value`，并用这些值更新 `state.fields`。\n\
  \n这一次 `onInputChange()` 具有相同的责任，但调用这个函数的是我们的 `Field` 组件，而不是 `input`。在上一一节中，我们展示了\
  \ `Field` 的 `onChange()` 方法，正是在那里调用了 `this.props.onChange()`。当它被调用时，调用方式如下：`this.props.onChange({name,\
  \ value, error})`。\n\n这意味着我们不再像以前那样使用 `evt.target.name` 或 `evt.target.value`，而是直接获取\
  \ `name` 和 `value`。\n\n更新状态的逻辑保持相似，确保了 `Field` 组件现在管理它自己的内部状态，并将必要的数据传递给父组件。\n\n\
  ### 更新后的 onSubmit 处理器\n```javascript\n21   onSubmit = evt => {\n22     const people\
  \ = this.state.people;\n23     const fields = this.state.fields;\n24 \n25     evt.preventDefault();\n\
  26 \n27     if (this.validate()) return;\n28 \n29     this.setState({\n30      \
  \ people: people.concat(person),\n31       fields: {\n32         name: '',\n33 \
  \        email: ''\n34       }\n35     });\n36   };\n```\n\n``forms/src/08-field-component-form.js`\n\
  \n`onSubmit()` 的目标没有改变。它仍然负责向列表添加人员，或者在存在验证问题时阻止该行为发生。为了检查验证错误，我们调用了 `this.validate()`，如果有任何错误，我们就提前返回。\n\
  \n以下是当前版本的 `validate()` 函数的样子：\n\n```javascript\n 1   validate () {\n 2     const\
  \ person = this.state.fields;\n 3     const fieldErrors = this.state.fieldErrors;\n\
  \ 4     const errMessages = Object.keys(fieldErrors).filter((k) =>\n 5 orsfieldErrors[k])\n\
  \ 6 \n 7     if (!person.name) return true;\n 8     if (!person.email) return true;\n\
  \ 9     if (errMessages.length) return true;\n10 \n11     return false\n12   },\n\
  ```\n\n\n\n\n\n`validate()` 是一个简单的方法，可以随时调用以检查数据在表单级级上是否有效。我们既在 `onFormSubmit()`\
  \ 中使用它来防止将无效数据添加到列表中，也在 `render()` 中使用它禁用提交按钮，从而在 UI 中提供良好的反馈。\n\n就是这样。现在我们正在使用自定义的\
  \ `Field` 组件来执行实时的字段级验证，并使用表单级验证来实时切换提交按钮。\n\n## 远程数据\n\n我们的表单应用正在开发中。用户可以使用姓名和邮箱进行注册，我们在接受输入之前会对他们的信息进行验证。但现在我们要更上一层楼。我们将探索如何允许用户从分层的、异步的选项中进行选择。\n\
  \n最常见的例子是允许用户按年份、品牌和型号来选择汽车。首先用户选择年份，然后是制造商，最后是型号。在其中一个 `select` 中中选择了一个选项后，下一个选项就会变为可用。构建这样一个组件有两个非常有趣的维度。\n\
  \n首先，并不是所有的组合都是合理的。没有理由让用户选择 1965 年的特斯拉 Model T。每个选项列表（第一个之外）都依赖于之前选择的值。\n\n其次，我们不想将整个有效选项数据库发送到浏览器。相反，浏览器只知道顶层选择（例如，特定范围内的年份）。当用户做出选择时，我们将所选的值提供给服务器并请求下一层（例如适用于特定年份的制造商）。因为下一层选项来自服务器，所以这是一项异步活动。\n\
  \n我们的应用不会对用户的汽车感兴趣，但我们想知道他们正在注册什么。让我们把这个应用变成用户通过选择参加 [NodeSchool](http://nodeschool.io)\
  \ 研讨会来学习更多 JavaScript 的工具。\n\nNodeSchool 研讨会可以是“核心”的，也可以是“选修”的。我们可以认为这些是 NodeSchool\
  \ 的“部门”。因此，根据用户感兴趣的部门，我们可以允许他们选择相应的研讨会。这与上面的示例类似，用户在选择制造商之前先选择汽车年份。\n\n如果用户选择了核心部门，我们将允许他们从\
  \ `learnyounode` 和 `stream-adventure` 等核心工作讨会列表中进行选择。相反，如果他们选择了选修部门，我们将允许他们挑选 `Functional\
  \ JavaScript` 或 `Shader School` 等工作讨会。与汽车示例类似，课程列表是异步提供的，并取决于选择了哪个部门。\n\n实现这一点的简单方法是使用两个\
  \ `select` 元素，一个用于选择部门，另一个用于选择课程。然而，将在以下情况下隐藏第二个 `select`：(1) 用户已选择部门，且 (2) 我们已从服务器接收到相应的课程列表。\n\
  \n我们不会直接将此功能构建到我们的表单中。我们将创建一个自定义组件来处理这些字段的分层和异步性质。通过使用自定义组件，我们的表单几乎不需要更改。任何特定于研讨会选择的逻辑将隐藏在组件中。\n\
  \n## 构建自定义组件\n\n该组件的目的是允许用户选择 NodeSchool 课程。从现在起，我们将其称为 `CourseSelect` 组件。\n\n然而，在开始构建新的\
  \ `CourseSelect` 组件之前，我们应该考虑我们希望它如何与父表单进行通信。这将决定组件的 `props`。\n\n最显明显的 `prop` 是 `onChange()`。该组件的目的是帮助用户进行部门/课程选择，并让这些数据对表单可用。此外，我们希望确保调用\
  \ `onChange()` 时传入的参数与我们从其他字段组件预期的参数相同。这样我们就不需要为此组件创建任何特殊处理。\n\n我们还希望表单在需要时能够设置此组件的状态。这在我们想要用户提交信息后清除选择时特别有用。为此，我们将接受两个\
  \ props：一个用于 `department`，一个用于 `course`。\n\n这些就是我们需要的全部。此组件将接受三个 `props`。以下是它们在我们新的\
  \ `CourseSelect` 组件中看起来的样子：\n\n```\n13   static propTypes = {\n14     department:\
  \ PropTypes.string,\n15     course: PropTypes.string,\n16     onChange: PropTypes.func.isRequired\n\
  17   };\n```\n\n`forms/src/09-course-select.js`\n\n接下来，我们可以考虑 `CourseSelect` 需要跟踪的\
  \ `state`。两个最显眼的状态部分是 `department` 和 `course`。当用户做出选择时，这些值会改变，当父表单在提交时清空它们时，它们也会改变。\n\
  \n`CourseSelect` 还需要跟踪给定部门的可用课程。当用户选择部门时，我们将异步获取相应的课程列表。一旦我们有了该列表，希望将其存储在 `state`\
  \ 中并命名为 `courses`。\n\n最后，在处理异步获取时，告知用户数据正在后台加载是很好的。我们还将在 `state` 中通过 `_loading`\
  \ 来跟踪数据是否正在“加载”中。\n\n这是我们的初始 `state` 看起来的样子：\n\n```\n19   state = {\n20     department:\
  \ null,\n21     course: null,\n22     courses: [],\n23     _loading: false\n24 \
  \  };\n```\n\n`forms/src/09-course-select.js`\n\n如上述，此组件的父表单将更新 `department` 和 `course`\
  \ `props`。我们的 `getDerivedFromProps` 方法使用 update：\n\n```\n26   getDerivedFromProps(update)\
  \ {\n27     return {\n28       department: update.department,\n29       course:\
  \ update.course\n30     };\n31   }\n```\n\n`forms/src/09-course-select.js`\n\n现在我们对数据看起来有了了解，就可以进入如何渲染。这个组件比之前的示例复杂一点，所以我们利用组合来保持整洁。你会注意到我们的\
  \ `render()` 方法主要由两个函数组成：`renderDepartmentSelect()` 和 `renderCourseSelect()`：\n\n\
  ```\n92   render() {\n93     return (\n94       <div>\n95         {this.renderDepartmentSelect()}\n\
  96         <br />\n97         {this.renderCourseSelect()}\n98       </div>\n99 \
  \    );\n100   }\n```\n\n`forms/src/09-course-select.js`\n\n除了这两个函数之外，`render()`\
  \ 没多少。但这很好地说明了我们组件的两个“部分”：部门部分和课程部分。让我们先看看“部门部分”。从 `renderDepartmentSelect()` 开始：\n\
  \n```\n95         {this.renderDepartmentSelect()}\n```\n\n`forms/src/09-course-select.js`\n\
  \n此方法返回一个 `select` 元素，显示三个选项之一。当前显示的选项取决于 `select` 的 `value` `prop`。与 `select` 匹配的值的选项将被显示。选项有：\n\
  \n*   “哪个部门？”（值：*空字符串*）\n*   “NodeSchool: 核心”（值：`core\"`）\n*   “NodeSchool: 选修”（值：\
  \ `\"electives\"`）\n\n`select` 的值为 `this.state.department || ''`。换句话说，如果 `this.state.department`\
  \ 为假值（默认如此），则 `value` 将是*空字符串*并匹配“哪个部门？”。否则，如果 `this.state.department` 是 `\"core\"\
  ` 或 `\"electives\"`，它将显示其他选项之一。\n\n由于 `this.onSelectDepartment` 被设置为 `select` 的\
  \ `onChange` `prop`，当用户更改选项时，`onSelectDepartment()` 将带有更改事件被调用。它看起来是这样：\n\n\n\n\n\
  \n```javascript\n33   onSelectDepartment = evt => {\n34     const department = evt.target.value;\n\
  35     const course = null;\n36     this.setState({department, course});\n37   \
  \  this.props.onChange({name: 'department', value: department});\n38     this.props.onChange({name:\
  \ 'course', value: course});\n \n40     if (department) this.fetch(department);\n\
  41   };\n```\n\n`forms/src/09-course-select.js`\n\n当部门发生变化时，我们希望发生三件事。首先，我们想要更新\
  \ `state` 以匹配选定的部门选项。其次，我们希望通过 `CourseSelect` 的 `props` 中提供的 `onChange` 处理器传递更改。最后，我们需要获取该部门可用的课程。\n\
  \n当我们更新 `state` 时，我们将其更新为事件目标 `target`（即 `select`）的值。`select` 的值是所选 `option` 的值，可能是\
  \ `''`、`\"core\"` 或 `\"electives\"`。在 `state` 设置了新值后，会运行 `render()` 和 `renderDepartmentSelect()`，并显示一个新的选项。\n\
  \n注意，我们还重置了课程。每个课程只对其对应的部门有效。如果部门发生变化，它将不再是一个有效选择。因此，我们将其设回初始值 `null`。\n\n在更新 `state`\
  \ 后，我们将更改传递给组件的更改处理器 `this.props.onChange`。由于我们像之前一样使用了这些参数，此组件可以像 `Field` 一样使用，并被赋予相同的处理器函数。唯一的技巧之处在于，我们需要调用它两次，每个输入调用一次。\n\
  \n最后，如果选择了部门，我们就会获取该部门的课程列表。这里是它所调用的方法 `fetch()`：\n\n```javascript\n49   fetch =\
  \ department => {\n50     this.setState({_loading: true, courses: []});\n51    \
  \ apiClient(department).then(courses => {\n52       this.setState({_loading: false,\
  \ courses: courses});\n53     });\n54   };\n```\n\n`forms/src/09-course-select.js`\n\
  \n该方法的职责是接收一个 `department` 字符串，使用它异步获取相应的课程列表 `courses`，并更新 `state`。然而，我们还希望确保影响\
  \ `state` 以获得更好的用户体验。\n\n我们通过在调用 `apiClient` **之前** 更新 `state` 来实现这一点。我们知道我们将等待带有新课程列表的响应，在段时间时间内，我们应该向用户显示一个加载指示器。为了做到这一点，我们需要\
  \ `state` 反映我们的获取状态。在调用 `apiClient` 之前，我们将 `_loading` 的 `state` 设置为 `true`。一旦操作完成，我们将\
  \ `_loading` 设回 `false` 并更新我们的课程列表。\n\n之前，我们提到过该组件有两个“部分”，通过我们的 `render()` 方法进行了了说明：\n\
  \n```javascript\n 92   render() {\n93     return (\n94       <div>\n95         {this.renderDepartmentSelect()}\n\
  96         <br />\n97         {this.renderCourseSelect()}\n98       </div>\n99 \
  \    );\n100   }\n```\n\n`forms/src/09-course-select.js`\n\n我们已经涵盖了“部门”部分。现在让我们来看看从\
  \ `renderCourseSelect()` 开始的“课程”部分：\n\n```javascript\n97         {this.renderCourseSelect()}\n\
  ```\n\n`forms/src/09-course-select.js`\n\n你首先会注意到，`renderCourseSelect()` 会根据特定条件返回不同的根元素。\n\
  \n如果 `state._loading` 为 `true`，`renderCourseSelect()` 只返回单个 `img`：一个加载指示器。或者，如果我们没有正在加载，但尚未选择部门（因此\
  \ `state.department` 为假值），则返回一个空的 `span` —— 这实际上隐藏了组件的这半部分。\n\n然而，如果我们没有正在加载，且用户**已经**选择了一个部门，`renderCourseSelect()`\
  \ 将返回一个与 `renderDepartmentSelect()` 类似的 `select`。\n\n`renderCourseSelect()` 和 `renderDepartmentSelect()`\
  \ 最大的区别在于，`renderCourseSelect()` 动态地填充了 `select` 的 `option` 子元素。\n\n此 `select` 中的第一个选项是“哪门课程？”，它的值为空字符串。如果用户尚未选择课程，这就是他们应该看到的（就像另一个\
  \ `select` 中的“哪个部门？”一样）。第一个选项之后的选项来自存储在 `state.courses` 中的课程列表。\n\n为了一次性向 `select`\
  \ 提供所有子 `option` 元素，给 `select` 了一个单一数组作为其子。数组中的第一个项是我们的“哪门课程？”选项的元素。然后，我们使用展开运算符结合\
  \ `map()`，以便从第二个项开始，数组包含了来自 `state` 的课程选项。\n\n数组中的每一项都是一个 `option` 元素。与之前一样，每个元素都有其显示的文本（如“哪门课程？”）以及一个\
  \ `value` 属性。如果 `select` 的 `value` 与 `option` 的 `value` 匹配，则该 `option` 将被显示。默认情况下，`select`\
  \ 的 `value` 将为空字符串。\n\n#### 更改处理器\n\n当用户选择新课程时，`select` 的 `value` 会发生变化。我们需要更新 `state`\
  \ 并通知父组件。我们将更改函数 `onSelectCourse()` 给 `select` 的 `onChange` 属性。当用户选择课程时，该函数将接收一个事件对象。\n\
  \n这里是 `onSelectCourse()`：\n\n```javascript\n43   onSelectCourse = evt => {\n44 \
  \    const course = evt.target.value;\n45     this.setState({course});\n46     this.props.onChange({name:\
  \ 'course', value: course});\n47   };\n```\n\n`forms/src/09-course-select.js`\n\n\
  正如我们之前做的那样，我们从事件获取 `target` 元素的 `value`。这个 `value` 是用户所选 `option` 的值。一旦用这个 `value`\
  \ 更新 `state.course`，`select` 将显示相应的 `option`。\n\n在更新 `state` 后，我们调用父组件提供的更改处理器。与选择部门一样，我们为\
  \ `this.props.onChange()` 提供了一个符合处理器预期的 `name`/`value` 结构的对象。\n\n我们的 `CourseSelect`\
  \ 组件到此！正如我们在下一部分看到的，集成表单只需要非常少的更改。\n\n#### 添加 CourseSelect\n\n现在我们的新 `CourseSelect`\
  \ 组件已准备就绪，我们可以将其添加到表单中。只需要三个小的更改：\n\n1.  在 `render()` 中添加 `CourseSelect` 组件。\n2.\
  \  更新 `render()` 中的“人员”列表以显示新字段（部门和课程）。\n3.  由于部门和课程是必填字段，我们修改我们的 `validate()` 方法以确保它们存在。\n\
  \n\n\n\n\n```javascript\n  render() {\n    return (\n      <div>\n        <h1>注册表</h1>\n\
  \n        <form onSubmit={this.onFormSubmit}>\n          <Field\n            placeholder=\"\
  姓名\"\n            name=\"name\"\n            value={this.state.fields.name}\n  \
  \          onChange={this.onInputChange}\n            validate={val => (val ? false\
  \ : '必填写')}\n          />\n\n          <br />\n\n          <Field\n            placeholder=\"\
  邮箱\"\n            name=\"email\"\n            value={this.state.fields.email}\n\
  \            onChange={this.onInputChange}\n            validate={val => (isEmail(val)\
  \ ? false : '邮箱无效')}\n          />\n\n          <br />\n\n          <CourseSelect\n\
  \            department={this.state.fields.department}\n            course={this.state.fields.course}\n\
  \            onChange={this.onInputChange}\n          />\n          <br />\n\n \
  \         <input type=\"submit\" disabled={this.validate()} />\n        </form>\n\
  \        <div>\n          <h3>人员</h3>\n          <ul>\n            {this.state.people.map(({name,\
  \ email, department, course}, i) => (\n              <li key={i}>{[name, email,\
  \ department, course].join(' - ')}</li>\n            ))}\n          </ul>\n    \
  \    </div>\n      </div>\n    );\n  }\n```\n\n### forms/src/09-async-fetch.js\n\
  \n在添加 `CourseSelect` 组件时，我们提供了三个 `props`：\n\n1. 来自 `state` 的当前 `department`（部门）（如果存在）\n\
  2. 来自 `state` 的当前 `course`（课程）（如果存在）\n3. `onInputChange` 处理器（与 `Field` 使用的相同函数）\n\
  \n以下是代码实现：\n\n```javascript\n<CourseSelect\n  department={this.state.fields.department}\n\
  \  course={this.state.fields.course}\n  onChange={this.onInputChange}\n/>\n```\n\
  \n我们在 `render()` 中做的另一个更改是向“人员”列表添加了部门和课程字段。一旦用户提交了信息，这些信息就会出现在此列表中。为了显示部门和课程信息，我们需要从\
  \ `state` 中获取这些数据并将其显示出来：\n\n```javascript\n<h3>人员</h3>\n<ul>\n  {this.state.people.map(({name,\
  \ email, department, course}, i) => (\n    <li key={i}>{[name, email, department,\
  \ course].join(' - ')}</li>\n  ))}\n</ul>\n```\n\n这只需要从 `state.people` 数组中的每个项中提取更多属性，非常简单。\n\
  \n剩下要做的工作是将这些字段添加到我们的表单层级验证中。`CourseSelect` 控制 UI 以确保我们不会获得无效数据，因此我们不需要担心字段级别的错误。然而，部门和课程是必填字段，我们应该在允许用户提交之前确保它们是存在**。我们通过更新\
  \ `validate()` 方法来包含它们来实现这一点：\n\n```javascript\nvalidate = () => {\n  const person\
  \ = this.state.fields;\n  const fieldErrors = this.state.fieldErrors;\n  const errMessages\
  \ = Object.keys(fieldErrors).filter(k => fieldErrors[k]);\n  if (!person.name) return\
  \ true;\n  if (!person.email) return true;\n  if (!person.course) return true;\n\
  \  if (!person.department) return true;\n  if (errMessages.length) return true;\n\
  \  return false;\n};\n```\n\n### forms/src/09-async-fetch.js\n\n一旦 `validate()`\
  \ 完成更新，在我们同时选择了部门和课程（加上我们的其他验证要求）之前，提交按钮将保持禁用状态。\n\n得益于 React 和组合的力量，我们的表单能够在保持可维护性的同时承担复杂的职能。\n\
  \n#### 视图与状态的分离\n\n一旦我们从用户那里接收了信息并确定它是有效的，我们需要将这些信息转换为 JavaScript 对象。根据表单的不同，这可能涉及将输入值从字符串转换为数字或布尔值，或者如果需要通过将值汇总到数组或嵌套对象中建立层级结构，可能会更加复杂。\n\
  \n在获取 JavaScript 对象格式的信息后，我们必须决定如何使用它们。这些对象可能会以 JSON 格式发送到服务器存储在数据库中，编码在 URL 中用作搜索查询，或者可能仅用于配置\
  \ UI 的外观。\n\n这些对象中的信息几乎总是会影响 UI，在许多情况下还会影响您的应用程序的行为。如何在我们的应用中存储这些信息取决于我们。\n\n###\
  \ 异步持久化\n\n到此时，我们的应用程序已经相当好用了。您可以想象将应用程序运行在自助机上，人们可以走过去并注册。然而，这里有一个巨大的缺点：如果浏览器关闭或刷新，所有数据都会丢失。\n\
  \n在大多数 Web 应用程序中，当用户输入数据时，这些数据应该发送到服务器安全存储在数据库中。当用户返回应用程序时，可以获取这些数据，应用程序可以从上次离开的地方继续运行。\n\
  \n在这个示例中，我们将涵盖持久化的三个方面：保存、加载和错误处理。虽然我们不会将数据发送到远程服务器或存储在数据库中（我们将使用 `localStorage`\
  \ 代替），但我们将将其视为异步操作，以说明如何进行任何持久化。\n\n\n\n\n遗憾的是，我们的应用目前还没有持久化数据的方法。目前没有任何数据可以加载。不过，我们可以通过更新\
  \ `onFormSubmit()` 来修复这个问题。\n\n与之前的章节一样，我们希望用户能够填写每个字段并点击“提交”以将人员添加到列表中。当他们执行此操作时，会调用\
  \ `onFormSubmit()`。我们将进行一项更改，使其不仅执行之前的行为（验证、更新 `state.people`），还*同时*使用 `apiClient.savePeople()`\
  \ 持久化该列表：\n\n```javascript\n36   onFormSubmit = evt => {\n37     const person =\
  \ this.state.fields;\n38 \n39     evt.preventDefault();\n40 \n41     if (this.validate())\
  \ return;\n42 \n43     const people = [...this.state.people, person];\n44 \n45 \
  \    this.setState({_saveStatus: 'SAVING'});\n46     apiClient\n47       .savePeople(people)\n\
  48       .then(() => {\n49         this.setState({\n50           people: people,\n\
  51             fields: {\n52             name: '',\n53             email: '',\n\
  54             course: null,\n55             department: null\n56           },\n\
  57           _saveStatus: 'SUCCESS'\n58         });\n59       })\n60       .catch(err\
  \ => {\n61         console.error(err);\n62         this.setState({_saveStatus: 'ERROR'});\n\
  63       });\n64   };\n```\n\n在之前的章节中，如果数据通过了验证，我们只会更新 `state.people` 列表以包含它。这次我们也将把\
  \ `person` 添加到 `people` 列表中，但我们只在 `apiClient` 成功持久化时才更新我们的 `state`。\n\n操作顺序如下：\n\
  \n1. 创建一个新的数组 `people`，其中包含 `state.people` 的内容和新的 `person` 对象。\n2. 将 `state._saveStatus`\
  \ 更新为 `\"SAVING\"`。\n3. 使用 `apiClient` 开始持久化第 1 步中创建新 `people` 数组。\n4. 如果 `apiClient`\
  \ 成功，则使用新的 `people` 数组、空的 `fields` 对象和 `_saveStatus: \"SUCCESS\"` 更新 `state`。如果\
  \ `apiClient` *没有*成功，则保持一切不变，但将 `state._saveStatus` 设置为 `\"ERROR\"`。\n\n简单来说，在 `apiClient`\
  \ 请求“进行中”期间，我们将 `_saveStatus` 设置为 `\"SAVING\"`。如果请求成功，我们将 `_saveStatus` 设置为 `\"\
  SUCCESS\"` 并执行与之前相同的操作。如果失败，唯一的更新是将 `_saveStatus` 设置为 `\"ERROR\"`。这样，我们的本地状态就不会与持久化副本保持不同步。此外，由于我们没有清除字段，我们为用户提供了一个再次尝试的机会，而无需重新输入他们的信息。\n\
  \n我们的最后一项更改是修改 `render()` 方法，使 UI 能够准确反映我们在加载和保存方面的状态。如提到的，我们希望用户知道我们正处于加载或保存过程中，或者保存时是否出现了问题。我们还可以控制\
  \ UI 以防止他们执行不必要的操作，例如重复保存。\n\n以下是更新后的 `render()` 方法：\n\n```javascript\n 90   render()\
  \ {\n91     if (this.state._loading) {\n92       return <img alt=\"loading\" src=\"\
  /img/loading.gif\" />\n93     }\n94 \n95     return (\n96       <div>\n97      \
  \   <h1>Sign Up Sheet</h1>\n98 \n99         <form onSubmit={this.onFormSubmit}>\n\
  100           <Field\n101             placeholder=\"Name\"\n102             name=\"\
  name\"\n103             value={this.state.fields.name}\n104             onChange={this.onInputChange}\n\
  105             validate={val => (val ? false : 'Name Required')}\n106         \
  \  />\n107 \n108           <br />\n109 \n110           <Field\n111             placeholder=\"\
  Email\"\n112             name=\"email\"\n113             value={this.state.fields.email}\n\
  114             onChange={this.onInputChange}\n115             validate={val =>\
  \ (isEmail(val) ? false : 'Invalid Email')}\n116           />\n117 \n118       \
  \    <br />\n119 \n120           <CourseSelect\n121             department={this.state.fields.department}\n\
  122             course={this.state.fields.course}\n123             onChange={this.onInputChange}\n\
  124           />\n125 \n126           <br />\n127 \n128           {\n129       \
  \      {\n130               SAVING: <input value=\"Saving...\" type=\"submit\" disabled\
  \ />,\n131             >,\n132               SUCCESS: <input value=\"Saved!\" type=\"\
  submit\" disabled />,\n133               ERROR: (\n134                 <input\n\
  135                   value=\"Save Failed\"\n136                   type=\"submit\"\
  \n137                   disabled\n138                 />\n139               ),\n\
  140               READY: (\n141                 <input\n142                   value=\"\
  Submit\"\n143                   type=\"submit\"\n144                   disabled\n\
  145                 />\n146               )\n147             }[this.state._saveStatus]\n\
  148           }\n149         </form>\n150         <div>\n151           <h3>People</h3>\n\
  152           <ul>\n153             {this.state.people.map((person, i) => (\n154\
  \               <li key={i}>\n155                 {person.name}\n156           \
  \      {person.email}\n157                 {person.course}\n158                \
  \ {person.department}\n159               </li>\n160             ))}\n161       \
  \    </ul>\n162         </div>\n163       );\n164   }\n```\n\nforms/src/10-remote-persist.js\n\
  \n首先，我们希望在加载时向用户显示加载指示器。正如前面提到的，这将在 `render()` 中完成。如果 `_loading` 为真，我们只渲染：\n\n```javascript\n\
  1   if (this.state._loading) return <img src=\"/img/loading.gif />;\n```\n\n接下来，我们希望提交按钮能够通信当前状态。如果请求正在进行，我们希望按钮显示“Saving...”并禁用。用户将知道应用正在忙碌，由于按钮被禁用，他们将无法提交重复请求。如果请求导致错误，我们使用按钮文本来告知并指示他们可以重试。如果输入数据有效，按钮将启用。最后，如果请求成功完成，我们使用按钮文本来告知。这是我们渲染按钮的方式：\n\
  \n```javascript\n1 {{\n   SAVING: <input value=\"Saving...\" type=\"submit\" disabled\
  \ />,\n   SUCCESS: <input value=\"Saved!\" type=\"submit\" disabled />,\n   ERROR:\
  \ <input value=\"Save Failed - Retry?\" type=\"submit\" disabled={!this.validate()}/>,\n\
  \   READY: <input value=\"Submit\" type=\"submit\" disabled={!this.validate()}/>\n\
  \ }[this.state._saveStatus]}\n```\n\n这里有四个不同的按钮——对应每个可能的 `state._saveStatus`。每个按钮都是一个以状态为键的对象的值。通过访问当前保存状态的键，该表达式将评估为相应的按钮。\n\
  \n我们要做的最后一件事与 `\"SUCCESS\"` 情况有关。我们希望向用户展示添加成功，我们通过更改按钮文本来实现。然而，“Saved!”并不是一个行动号召。如果用户输入另一个人的信息并想将其添加到列表，我们的按钮仍然会显示“Saved!”。它应该显示“Submit”以更准确地反映其目的。\n\
  \n解决此问题的简单方法是，当他们再次输入信息时，将我们的 `_saveStatus` 改回 `\"READY\"`。为了实现，我们更新了 `onInputChange()`\
  \ 处理器：\n\n```javascript\n66   onInputChange = ({name, value, error}) => {\n67  \
  \   const fields = this.state.fields;\n68     const fieldErrors = this.state.fieldErrors;\n\
  69 \n70     fields[name] = value;\n71     fieldErrors[name] = error;\n72 \n73  \
  \   this.setState({fields, fieldErrors, _saveStatus: 'READY'});\n74   };\n```\n\n\
  \n\n现在，我们不再仅仅更新 `state.fields` 和 `state.fieldErrors`，还将将 `state._saveStatus` 设置为\
  \ `'READY'`。这样，当用户确认之前的提交成功并重新开始与应用交互后，按钮将恢复到“就绪”（ready）状态，并邀请用户再次提交。\n\n到此时，我们的注册应用程序是一个很好的示例，展示了你在使用\
  \ React 构建自己的表单时，可能想要涵盖的功能和问题。\n\n## Redux\n\n在本节中，我们将展示如何修改已构建的表单应用，使其能够在使用 Redux\
  \ 的更大型应用中运行。\n\n我们的表单曾经是整个应用程序，现在将变成一个组件。此外，我们将对其调整以适应 Redux 范式。从高层来说，这涉及到将状态和功能从我们的表单组件移动到\
  \ Redux 还原器（reducers）和动作（actions）。例如，我们不再在表单组件内部调用 API 函数——而是使用 Redux 异步动作来完成。同样，以前存储在表单中作为\
  \ `state` 存储的数据将变为只读的 `props`——它们现在将存储在 Redux store 中。\n\n使用 Redux 构建应用时，从开始考虑状态将呈现的“形状”非常有帮助。在我们的情况下，由于功能已经构建，我们已经有一个很清晰的想法了。在使用\
  \ Redux 时，你会希望尽可能将状态中心化——这将是 `store`，应用中的所有组件都可以访问。以下是我们的 `initialState` 应该有的样子：\n\
  \n```\n 6 const initialState = {\n 7   people: [],\n 8   isLoading: false,\n 9 \
  \  saveStatus: 'READY',\n10   person: {\n11     name: '',\n12     email: '',\n13\
  \     course: null,\n14     department: null\n15   },\n16 };\n```\n\n`forms/src/11-redux-reducer.js`\n\
  \n这里没什么意外。我们的应用关注注册人员列表、当前表单中正在输入的个人、是否正在加载，以及我们尝试保存的状态。\n\n现在我们知道了状态的形状，就可以考虑改变它的不同动作了。例如，由于我们要跟踪人员列表，可以想象一个动作，在应用启动时从服务器获取列表。此动作将影响我们状态的多个属性。当服务器请求返回列表时，我们希望用它来更新状态，并且还希望更新\
  \ `isLoading`。事实上，我们希望在开始请求时将 `isLoading` 设置为 `true`，并在请求完成后将其设置为 `false`。在 Redux\
  \ 中，重要的一点是意识到，我们通常可以将一个目标拆分为多个动作。\n\n对于我们的 Redux 应用，将五个动作类型。前两个与上述目标相关，它们是 `FETCH_PEOPLE_REQUEST`\
  \ 和 `FETCH_PEOPLE_SUCCESS`。以下是这些动作类型及其对应的动作创建器函数：\n\n```\n 1 /* eslint-disable no-use-before-define\
  \ */\n 2 export const FETCH_PEOPLE_REQUEST = 'FETCH_PEOPLE_REQUEST';\n 3 function\
  \ fetchPeopleRequest () {\n 4   return {type: FETCH_PEOPLE_REQUEST};\n 5\n\n 6\n\
  \ 7 export const FETCH_PEOPLE_SUCCESS = 'FETCH_PEOPLE_SUCCESS';\n 8 function fetchPeopleSuccess\
  \ (people) {\n 9   return {type: FETCH_PEOPLE_SUCCESS, people};\n10 }\n```\n\n`forms/src/11-redux-actions.js`\n\
  \n当我们开始请求时，不需要向还原器提供动作类型之外的任何信息。还原器仅通过类型就能知道请求已开始，并将 `isLoading` 更新为 `true`。当请求成功时，还原器将知道将其设置为\
  \ `false`，但我们需要为该更新提供人员列表。这就是为什么 `people` 位于第二个动作 `FETCH_PEOPLE_SUCCESS` 中的原因。\n\
  \n我们现在可以想象分发（dispatch）这些动作并让我们的状态得到相应的更新。为了从服务器获取人员列表，我们将分发 `FETCH_PEOPLE_REQUEST`\
  \ 动作，使用我们的 API 客户端获取列表，最后分发 `FETCH_PEOPLE_SUCCESS` 动作（带上人员列表）。在 Redux 中，我们将使用一个异步动作创建器\
  \ `fetchPeople()` 来执行这些动作：\n\n```\n27 export function fetchPeople () {\n28   return\
  \ function (dispatch) {\n29     dispatch(fetchPeopleRequest())\n30     apiClient.loadPeople().then((people)\
  \ => {\n31       dispatch(fetchPeopleSuccess(people))\n32     })\n33   }\n34 }\n\
  ```\n\n`forms/src/11-redux-actions.js`\n\n异步动作创建器不是返回动作对象，而是返回分发动作的函数。\n\n我们还想要为将列表保存到服务器创建动作。以下是它们的样子：\n\
  \n```\n11 export const SAVE_PEOPLE_REQUEST = 'SAVE_PEOPLE_REQUEST';\n12 function\
  \ savePeopleRequest () {\n13   return {type: SAVE_PEOPLE_REQUEST};\n14 }\n15\n 16\n\
  17 export const SAVE_PEOPLE_FAILURE = 'SAVE_PEOPLE_FAILURE';\n18 function savePeopleFailure\
  \ (error) {\n19   return {type: SAVE_PEOPLE_FAILURE, error};\n20 }\n21\n22 export\
  \ const SAVE_PEOPLE_SUCCESS = 'SAVE_PEOPLE_SUCCESS';\n23 function savePeopleSuccess\
  \ (people) {\n24   return {type: SAVE_PEOPLE_SUCCESS, people};\n```\n\n`forms/src/11-redux-actions.js`\n\
  \n就像获取一样，我们有 `SAVE_PEOPLE_REQUEST` 和 `SAVE_PEOPLE_SUCCESS`，但我们还有 `SAVE_PEOPLE_FAILURE`。`SAVE_PEOPLE_REQUEST`\
  \ 动作发生在我们开始请求时，像之前一样，我们不需要提供动作类型之外的任何数据。还原器将看到此类型并知道将 `saveStatus` 更新为 `'SAVING'`。一旦请求完成，我们可以根据结果触发\
  \ `SAVE_PEOPLE_SUCCESS` 或 `SAVE_PEOPLE_FAILURE`。\n\n以下是我们在异步动作创建器 `savePeople()`\
  \ 中如何一起使用它们：\n\n```\n36 export function savePeople (people) {\n37   return function\
  \ (dispatch) {\n38     dispatch(savePeopleRequest())\n39     apiClient.savePeople(people)\n\
  40       .then((resp) => { dispatch(savePeopleSuccess(people)) })\n41       .catch((err)\
  \ => { dispatch(savePeopleFailure(err)) })\n42   }\n43 }\n```\n\n`forms/src/11-redux-actions.js`\n\
  \n注意，这个动作创建器将请求的工作委托给了我们的 API 客户端。我们可以这样定义我们的 API 客户端：\n\n```\n45 const apiClient\
  \ = {\n46   loadPeople: function () {\n47     return {\n48       then: function\
  \ (cb) {\n49         setTimeout( () => {\n50           cb(JSON.parse(localStorage.people\
  \ || '[]'))\n51         }, 1000);\n52       }\n53     }\n54   },\n55\n56   savePeople:\
  \ function (people) {\n57     const success = !!(this.count++ % 2);\n58\n59    \
  \ return new Promise(function (resolve, reject) {\n60       setTimeout( () => {\n\
  61         if (!success) return reject({success});\n62\n63         localStorage.people\
  \ = JSON.stringify(people);\n64         resolve({success});\n65       }, 1000);\n\
  66     })\n67   },\n68\n69   count: 1\n70 }\n```\n\n`forms/src/11-redux-actions.js`\n\
  \n现在我们定义了所有的动作创建器，我们就拥有了还原器所需的所有内容。通过使用上面的两个异步动作创建器，还原器可以对我们的状态进行应用所需的所有更新。以下是我们的还原器的样子：\n\
  \n\n\n\n\n```javascript\nconst initialState = {\n  people: [],\n  isLoading: false,\n\
  \  saveStatus: 'READY',\n  person: {\n    name: '',\n    email: '',\n    course:\
  \ null,\n    department: null\n  },\n};\n\nexport function reducer (state = initialState,\
  \ action) {\n  switch (action.type) {\n    case FETCH_PEOPLE_REQUEST:\n      return\
  \ Object.assign({}, state, {\n        isLoading: true\n      });\n    case FETCH_PEOPLE_SUCCESS:\n\
  \      return Object.assign({}, state, {\n        people: action.people,\n     \
  \   isLoading: false\n      });\n    case SAVE_PEOPLE_REQUEST:\n      return Object.assign({},\
  \ state, {\n        saveStatus: 'SAVING'\n      });\n    case SAVE_PEOPLE_FAILURE:\n\
  \      return Object.assign({}, state, {\n        saveStatus: 'ERROR'\n      });\n\
  \    case SAVE_PEOPLE_SUCCESS:\n      return Object.assign({}, state, {\n      \
  \  people: action.people,\n        person: {\n          name: '',\n          email:\
  \ '',\n          course: null,\n          department: null\n        },\n       \
  \ saveStatus: 'SUCCESS'\n      });\n    default:\n      return state;\n  }\n}\n\
  ```\n\n`forms/src/11-redux-reducer.js`\n\n仅通过查看 `actions` 和 `reducer`，你就应该能够看到更新我们状态的所有方式。这是\
  \ Redux 的伟大之处之一。因为一切都是如此显式，状态变得非常容易推理和测试。\n\n现在我们已经确定了状态的形状以及它如何变化，我们将创建一个 `store`。然后我们想要进行一些更改，以便我们的表单能够正确地连接到它。\n\
  \n#### 表单组件 (Form Component)\n\n现在我们已经用 Redux 建立了应用数据架构的基础，现在可以调整我们的表单组件来适配它。大而言之，我们需要移除与\
  \ API 客户端的任何交互（现在由我们的异步 action 创建器处理这些），并将依赖关系从组件级的 `state` 转移到 `props`（Redux 状态将作为\
  \ `props` 传入）。\n\n我们需要做的第一件事是设置 `propTypes`，使其与我们期望从 Redux 获取的数据对齐：\n\n```javascript\n\
  static propTypes = {\n  people: PropTypes.array.isRequired,\n  isLoading: PropTypes.bool.isRequired,\n\
  \  saveStatus: PropTypes.string.isRequired,\n  fields: PropTypes.object,\n  onSubmit:\
  \ PropTypes.func.isRequired\n};\n```\n\n`forms/src/11-redux-form.js`\n\n我们需要额外一个与\
  \ Redux store 中的数据无关的 `prop`，即 `onSubmit()`。当用户提交新人员时，我们的表单组件将不再使用 API 客户端，而是调用此函数。稍后我们将展示如何将其挂载到我们的异步\
  \ action 创建器 `savePeople()` 上。\n\n接下来，我们限制了在 `state` 中保留的数据量。我们保留 `fields` 和 `fieldErrors`，但移除了\
  \ `people`、`_loading` 和 `_saveStatus` —— 这些将通过 `props` 传入。这是更新后的 `state`：\n\n```javascript\n\
  state = {\n  fields: this.props.fields || {\n    name: '',\n    email: '',\n   \
  \ course: null,\n    department: null\n  },\n  fieldErrors: {}\n};\n```\n\n`forms/src/11-redux-form.js`\n\
  \n`state.fields` 将初始化为 `props.fields`（如果没有提供则使用默认字段）。此外，如果 `props` 中传入了新的 `fields`\
  \ 对象，我们将更新我们的 `state`：\n\n```javascript\ngetDerivedStateFromProps(update) {\n  console.log('this.props.fields',\
  \ this.props.fields, update);\n\n  return {fields: update.fields};\n}\n```\n\n`forms/src/11-redux-form.js`\n\
  \n现在我们的 `props` 和 `state` 就绪了，我们可以移除任何对 `apiClient` 的使用，因为这将由我们的异步 action 创建器处理。我们使用\
  \ API 客户端的两个是在 `componentDidMount()` 和 `onFormSubmit()`。\n\n由于 `componentDidMount()`\
  \ 的唯一目的是使用 API 客户端，我们将其完全移除了。在 `onFormSubmit()` 中，我们移除了与 API 相关的块，并将其替换为对 `props.onSubmit()`\
  \ 的调用：\n\n```javascript\nonFormSubmit = evt => {\n  const person = this.state.fields;\n\
  \n  evt.preventDefault();\n\n  if (this.validate()) return;\n\n  this.props.onSubmit([...this.props.people,\
  \ person]);\n};\n```\n\n`forms/src/11-redux-form.js`\n\n处理完这一切后，我们可以对 `render()`\
  \ 进行一些细小的更新。事实上，我们对 `render()` 需要的唯一修改是将 `_loading`、`_saveStatus` 和 `people` 替换为在\
  \ `props` 中对应的项。\n\n```javascript\nrender() {\n  if (this.isLoading) {\n    return\
  \ <img alt=\"loading\" src=\"/loading.gif\" />;\n  }\n\n  const dirty = Object.keys(this.state.fields).length;\n\
  \  let status = this.props.saveStatus;\n  if (status === 'SUCCESS') status = 'READY';\n\
  \n  return (\n    <div>\n      <h1>Sign Up</h1>\n      <form onSubmit={this.onFormSubmit}>\n\
  \        <Field\n          placeholder=\"Name\"\n          name=\"name\"\n     \
  \     value={this.state.fields}\n          onChange={this.onInputChange}\n     \
  \     validate={val => (val ? false : 'Name Required')}\n        />\n        <Field\n\
  \          placeholder=\"Email\"\n          name=\"email\"\n          value={this.state.fields}\n\
  \          onChange={this.onInputChange}\n          validate={val => (isEmail(val)\
  \ ? false : 'Invalid Email')}\n        />\n        <CourseSelect\n          department={this.state.fields}\n\
  \          course={this.state.fields}\n          onChange={this.onInputChange}\n\
  \        />\n        {\n          SAVING: <input value=\"Saving...\" type=\"submit\"\
  \ />,\n          SUCCESS: <input value=\"Saved!\" type=\"submit\" />,\n        \
  \  ERROR: (\n            <input value=\"Save Failed - Retry?\" type=\"submit\" disabled={this.validate()}\n\
  \          ),\n          READY: (\n            <input value=\"Submit\" type=\"submit\"\
  \ disabled={this.validate()}\n          )\n        }[status]\n      </form>\n  \
  \    <div>\n        <h3>People</h3>\n        <ul>\n          {this.props.people.map(({name,\
  \ email, department, course}, i) => (\n            <li key={i}>{[name, email, department,\
  \ course].join(' - ')}</li>\n          ))}\n        </ul>\n      </div>\n    </div>\n\
  \  );\n}\n```\n\n`forms/src/11-redux-form.js`\n\n#### 连接 Store (Connect the Store)\n\
  \n此时我们已经有了 actions、reducer 和精简后的表单组件。剩下的工作是将它们连接起来。\n\n首先，我们将使用 Redux 的 `createStore()`\
  \ 方法从我们的 `reducer` 创建 `store`。因为我们希望能够派发异步 action，我们还将使用来自 `redux-thunk` 模块的 `thunkMiddleware`。要在\
  \ `store` 中使用中间件，我们将使用 Redux 的 `applyMiddleware()` 方法。它看起来如下：\n\n```javascript\n\
  const store = createStore(reducer, applyMiddleware(thunkMiddleware));\n```\n\n`forms/src/11-redux-app.js`\n\
  \n接下来，我们将使用 `react-redux` 中的 `connect()` 方法来优化我们的表单组件以便与 Redux 使用。我们通过为其提供两个方法来实现：`mapStateToProps`\
  \ 和 `mapDispatchToProps`。\n\n在用 Redux 时，我们希望组件订阅 `store`。然而，通过 `react-redux` 它会为我们完成这一切。我们只需要提供一个\
  \ `mapStateToProps` 函数，定义 `store` 中的数据与组件 `props` 之间的映射。在我们的应用中，它们对得非常整齐：\n\n\n\n\
  \n\n```javascript\nfunction mapStateToProps(state) {\n  return {\n    isLoading:\
  \ state.isLoading,\n    fields: state.person,\n    people: state.people,\n    saveStatus:\
  \ state.saveStatus\n  };\n}\n```\n\n`forms/src/11-redux-app.js`\n\n在我们的表单组件内部，当用户提交且验证通过时，我们会调用\
  \ `props.onSubmit()`。我们希望这一行为能够分发我们的 `savePeople()` 异步 action 创建者。为了实现这一点，我们提供了\
  \ `mapDispatchToProps()` 来定义 `props.onSubmit()` 函数与分发我们的 action 创建者之间的连接：\n\n```javascript\n\
  function mapDispatchToProps(dispatch) {\n  return {\n    onSubmit: people => {\n\
  \      dispatch(savePeople(people));\n    }\n  };\n}\n```\n\n`forms/src/11-redux-app.js`\n\
  \n创建了这两个函数后，我们使用 `react-redux` 中的 `connect()` 方法来获取一个优化的 `ReduxForm` 组件：\n\n```javascript\n\
  const ReduxForm = connect(mapStateToProps, mapDispatchToProps)(Form);\n```\n\n`forms/src/11-redux-app.js`\n\
  \n最后一步是将 `store` 和 `ReduxForm` 整合到我们的应用中。此时，我们的应用是一个非常简单的组件，只有两个方法：`componentDidMount()`\
  \ 和 `render()`。\n\n在 `componentDidMount()` 中，我们分发 `fetchPeople()` 异步 action 来从服务器加载人员列表：\n\
  \n```javascript\ncomponentDidMount() {\n  store.dispatch(fetchPeople());\n}\n```\n\
  \n`forms/src/11-redux-app.js`\n\n在 `render()` 中，我们使用了来自 `react-redux` 的非常有用的组件 `Provider`。`Provider`\
  \ 会让 store 对其所有子组件可用。我们只需将 `ReduxForm` 放在 `Provider` 的子组件中，应用程序就可以运行了：\n\n```javascript\n\
  render() {\n  return (\n    <Provider store={store}>\n      <ReduxForm />\n    </Provider>\n\
  \  );\n}\n```\n\n`forms/src/11-redux-app.js`\n\n就是这样！我们的表单现在完美地嵌入了基于 Redux 的数据架构中。\n\
  \n读完这一章后，你应该已经很好地掌握了 React 表单的基础知识。尽管如此，如果你想将部分表单处理外包给外部模块，也有几个可用方案。继续往下读以查看一些流行的选项列表。\n\
  \n### 表单模块\n\n#### formsy-react\n\n[`github.com/christianalfoni/formsy-react`](https://github.com/christianalfoni/formsy-react)\n\
  \n`formsy-react` 试图在灵活性和复用性之间取得平衡。这是一个值得的目标，因为该模块的作者承认，表单、输入和验证在不同项目中的处理方式非常不同。\n\
  \n通用的模式是使用 `Formsy.Form` 组件作为你的表单元素，并将你自己的输入组件作为子元素（使用 `Formsy.Mixin`）。`Formsy.Form`\
  \ 组件拥有如 `onValidSubmit()` 和 `onInvalid()` 等处理器，你可以使用它们来更改表单父组件的状态，而 mixin 则提供了一些验证和其他通用助手。\n\
  \n#### react-input-enhancements\n\n[`alexkuz.github.io/react-input-enhancements`](http://alexkuz.github.io/react-input-enhancements)\n\
  \n`react-input-enhancements` 是五个丰富组件的集合，你可以用它们增强表单。该模块有一个很好的演示，展示了你如何使用 `Autosize`、`Autocomplete`、`Dropdown`、`Mask`\
  \ 和 `DatePicker` 组件。作者确实提到过它们还没有准备好投入生产，更多是概念性的。尽管如此，如果你正在寻找一个现成的日期选择器或自动补全元素，它们可能会很有用。\n\
  \n#### tcomb-form\n\n[`gcanti.github.io/tcomb-form`](http://gcanti.github.io/tcomb-form)\n\
  \n`tcomb-form` 旨在配合 `tcomb` 模型 ([`github.com/gcanti/tcomb`](https://github.com/gcanti/tcomb))\
  \ 使用，这些模型围绕领域驱动设计。其思想是一旦你创建一个模型，相应的表单就可以自动生成。理论上，优点是你不需要编写大量的标记，免费获得可用性和可访问性（例如自动标签和内联验证），并且表单将与模型的更改保持同步。如果\
  \ `tcomb` 模型看起来适合你的应用，那么 `tcomb-form` 值得考虑。\n\n#### winterfell\n\n[`github.com/andrewhathaway/winterfell`](https://github.com/andrewhathaway/winterfell)\n\
  \n如果你完全用 JSON 来定义表单和字段，那么 `winterfell` 可能适合你。通过 `winterfell`，你可以在 JSON schema 中勾勒整个表单。这个\
  \ schema 是一个大对象，你可以在其中定义 CSS 类名、章节标题、标签、验证要求、字段类型和条件分支。\n\n`winterfell` 被组织成“表单面板”、“问题面板”和“问题集”。每个面板都有一个\
  \ ID，该 ID 用于向其分配集合。这种方法的一个用处是，如果你发现它... [根据逻辑一致性截断]\n\n## 在 Create React App 中使用\
  \ Webpack\n\n在我们之前的很多项目中，我们通过应用 `index.html` 文件中的 `script` 标签来加载 React：\n\n```html\n\
  <script src='vendor/react.js'></script>\n<script src='vendor/react-dom.js'></script>\n\
  ```\n\n因为一直在使用 ES6，我们也通过 `script` 标签加载了 Babel 库：\n\n```html\n<script src='vendor/babel-standalone.js'></script>\n\
  ```\n\n通过这种设置，我们可以在 `index.html` 中加载任何需要的 ES6 文件，并指定其类型为 `text/babel`：\n\n```html\n\
  <script type='text/babel' src='./client.js'></script>\n```\n\nBabel 会处理文件的加载，并将\
  \ ES6 JavaScript 编译为浏览器可用的 ES5 JavaScript。我们采用这种设置策略是因为它是最简单的。只需少量设置即可编写 ES6 React\
  \ 组件。然而，这种方法有局限性。对于我们的目的，最主要的局限性是缺乏对 JavaScript 模块的支持。\n\n#### JavaScript \n\n我们在之前的应用中见过模块。例如，时间跟踪应用有一个\
  \ Client 模块。该模块的文件定义了一些函数，如 `getTimers()`。然后它将 `window.client` 设置为一个对象，将每个函数暴露为一个属性。该对象的形式如下：\n\
  \n```javascript\n// `window.client` 被设置为这个对象\n// 每个属性都是函数\n{\n  getTimers,\n  createTimer,\n\
  \  updateTimer,\n  startTimer,\n  stopTimer,\n  deleteTimer,\n};\n```\n\n这个 Client\
  \ 模块只暴露了这些函数。这些是 Client 模块的**公共方法**。`public/js/client.js` 文件还包含了其他函数定义，如 `checkStatus()`，它验证服务器是否返回了\
  \ 2xx 响应码。虽然每个公共方法在内部都使用了 `checkStatus()`，但 `checkStatus()` 被保持为**私有**。它仅可从模块内部访问。\n\
  \n\n\n\n\n在 React 中，我们可以将每个单独的组件视为它们自己的模块。每个组件负责界面的某些离散部分。React 组件可能包含自己的状态或执行复杂的操作，但所有这些组件的接口都是相同的：它们接受输入（props）并输出它们的\
  \ DOM 呈现（`render`）。使用 React 组件的用户不需要了解任何内部细节。\n\n为了让我们的 React 组件真正实现模块化，理想情况下是让它们存在于自己的文件中。在该文件的全局作用域中，组件可以定义仅供该组件使用的样式对象或辅助函数。但我们希望组件模块只暴露组件本身。\n\
  \n在 ES6 出现之前，JavaScript 并不原生支持模块。开发者会使用各种不同的技术来实现 JavaScript 的模块化。某些解决方案仅在浏览器中运行，依赖于浏览器环境（例如\
  \ `window` 的存在）。另一些仅在 Node.js 中运行。\n\n浏览器尚未支持 ES6 模块，但 ES6 模块是未来。它的语法直直的，我们避免了 ES5\
  \ 中使用的奇特策略，并且它们在浏览器内外都可以工作。正如此，React 社区迅速采纳了 ES6 模块。\n\n然而，由于模块系统的复杂性，我们不能简单地使用\
  \ ES6 的 import/export 语法并期望它在浏览器中“直接工作”，即使使用了 Babel 也是如此。我们需要更多的工具。\n\n出于这个以及其他原因，JavaScript\
  \ 社区广泛引入了 JavaScript 打包工具（bundlers）。正如我们将看到的，JavaScript 打包工具允许我们编写在浏览器中无缝运行的模块化\
  \ ES6 JavaScript。但不仅于此，打包工具具有许多优势。打包工具为组织和分发 Web 应用提供了一种策略。它们拥有强大的工具链，用于开发中的迭代和生产环境优化的构建。\n\
  \n虽然 JavaScript 打包工具有多种选择，但 React 社区的最喜爱是 Webpack。\n\n然而，像 Webpack 这样的打包工具带来了一个重大的权衡：它们增加了\
  \ Web 应用设置的复杂性。初始配置可能很困难，你最终得到一个具有更多活动部分的应用。\n\n为了设置和配置的烦恼，社区创建了大量的模板（boilerplates）和库，开发者可以使用它们开始构建高级的\
  \ React 应用。但 React 核心团队意识到，只要没有核心团队认可的解决方案，社区可能会保持分裂状态。对于初学者和经验丰富的开发者来说，由打包器驱动的\
  \ React 设置的第一步可能会令人困惑。\n\nReact 核心团队通过产生 Create React App 项目作为回应。\n\n## Create React\
  \ App\n\n`create-react-app` (https://github.com/facebookincubator/create-react-app)\
  \ 库提供了一个可以使用来初始化新的 Webpack 驱动的 React 应用的命令：\n\n```\n$ create-react-app my-app-name\n\
  ```\n\n该库将为你配置一个“黑箱”式的 Webpack 设置。它为你提供了 Webpack 设置的益处，同时抽象了配置细节。\n\nCreate React\
  \ App 是使用标准约定开始 Webpack-React 应用的极佳方式。因此，我们将在所有后续的 Webpack-React 应用中使用它。\n\n在本章中，我们将：\n\
  \n*   查看 React 组件在被表示为 ES6 模块时是什么样子的\n*   检查由 Create React App 管理的应用设置\n*   仔细观察\
  \ Webpack 的工作原理\n*   探索 Webpack 为开发和生产使用提供的众多优势\n*   窥探 Create React App 的内部原理\n\
  *   弄如何让 Webpack-React 应用与 API 协同工作\n\n## 探索 Create React App\n\n让我们安装 Create React\
  \ App，然后使用它来初始化一个 Webpack-React 应用。我们可以从命令行使用 `-g` 标志来全局安装它。你可以在系统的任何地方运行此命令：\n\n\
  ```\n$ npm i -g create-react-app@1.4.1\n```\n\n现在，在你系统的中的任何地方，你都可以运行 `create-react-app`\
  \ 命令来初始化一个新的 Webpack 驱动的 React 应用的设置。\n\n让我们创建一个新应用。我们将在随书下载的代码包内部进行操作。从代码文件夹的根目录，进入本章的目录：\n\
  \n```\n$ cd webpack\n```\n\n该目录已经有了三个文件夹：\n\n```\n$ ls\nes6-modules/\nfood-lookup/\n\
  heart-webpack-complete/\n```\n\n下一节的完整代码可以在 `heart-webpack-complete` 中找到。\n\n运行以下命令在名为\
  \ `heart-webpack` 的文件夹中初始化一个新的 React 应用：\n\n```\n$ create-react-app heart-webpack\
  \ --scripts-version=1.0.14\n```\n\n这将为新应用创建模板并安装应用的依赖项。这可能需要一些时间。\n\n上面的 `--scripts-version`\
  \ 标志非常重要。我们要确保你的 `react-scripts` 版本与我们在书中使用的版本一致。稍后我们将看看 `react-scripts` 包是什么。\n\
  \n当 Create React App 完成后，`cd` 进入新目录：\n\n```\n$ cd heart-webpack\n```\n\n```\n$ ls\n\
  README.md\nnode_modules/\npackage.json\npublic/\nsrc/\n```\n\n在 `src/` 内部是 Create\
  \ React App 为演示目的提供的示例 React 应用。在 `public/` 内部有一个 `index.html`，我们将首先查看它。\n\n###\
  \ public/index.html\n\n用文本编辑器打开 `public/index.html`：\n\n```\n<!doctype html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <link rel=\"shortcut icon\"\
  \ href=\"%PUBLIC_URL%/favicon.ico\">\n    <title>React App</title>\n</head>\n<body>\n\
  \    <div id=\"root\"></</div>\n</body>\n</</html>\n```\n\n它与我们之前在之前的应用中使用的 `index.html`\
  \ 有显著区别：这里没有 `script` 标签。这意味着该文件没有加载任何 JavaScript 文件。我们将看到为什么。\n\n### package.json\n\
  \n查看项目的 `package.json`，我们看到一些依赖项和脚本定义：\n\n```json\n{\n  \"name\": \"heart-webpack\"\
  ,\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"devDependencies\": {\n \
  \   \"react-scripts\": \"1.1.1\",\n    \"concurrently\": \"3.4.0\"\n  },\n  \"dependencies\"\
  : {\n    \"react\": \"16.12.0\",\n    \"react-dom\": \"16.12.0\"\n  },\n  \"scripts\"\
  : {\n    \"start\": \"react-scripts start\",\n    \"build\": \"react-scripts build\"\
  ,\n    \"test\": \"react-scripts test --env=jsdom\",\n    \"eject\": \"react-scripts\
  \ eject\"\n  }\n}\n```\n\n让我们来拆解它。\n\n#### react-scripts\n\n`package.json` 指定了一个开发依赖项\
  \ `react-scripts`：\n\n```json\n \"devDependencies\": {\n    \"react-scripts\": \"\
  1.1.1\",\n    \"concurrently\": \"3.4.0\"\n}\n```\n\nCreate React App 只是一个模板生成器。该命令生成了新\
  \ React 应用的目录结构，插入了示例应用并指定了我们的 `package.json`。实际上是 `react-scripts` 包让一切运行。\n\n`react-scripts`\
  \ 指定了我们应用所有的开发依赖，如 Webpack 和 Babel。此外，它包含了以常规方式将所有依赖项胶合在一起的脚本。\n\n#### react 和 react-dom\n\
  \n在 `dependencies` 下，我们列出了 `react` 和 `react-dom`：\n\n```json\n  \"dependencies\"\
  : {\n    \"react\": \"16.12.0\",\n    \"react-dom\": \"16.12.0\"\n  }\n```\n\n在我们之前的两个项目中，我们通过通过\
  \ `index.html` 中的 script 标签加载 `react` 和 `react-dom`。正如我们所看到的，这些库并没有在这个项目的 `index.html`\
  \ 中指定。\n\n\n\n\n\n**Webpack 赋予了我们在浏览器中使用 npm 软件包的能力**。我们可以在 `package.json` 中指定我们想要使用的外部库。这非常有帮助。我们现在不仅可以轻松访问庞大的包库，还可以使用\
  \ npm 来管理应用所使用的**所有**库。稍后我们将看到这一切具体是如何运作的。\n\n### Scripts（脚本）\n\n`package.json`\
  \ 在 `scripts` 字段指定了四个命令。每个命令都会使用 `react-scripts` 执行一个命令。在本章和下一章中，我们将深入介绍这些命令中的每一个，但从高层面上来说：\n\
  \n*   `start`: 启动 Webpack 开发 HTTP 服务器。该服务器将处理来自我们 浏览器的请求。\n*   `build`: 用于生产环境，该命令会为我们所有的资源创建一个优化的静态压缩包（bundle）。\n\
  *   `test`: 如果存在应用的测试套件，则执行它。\n*   `eject`: 将 `react-scripts` 的内部实现移动到你的项目目录。这允许你放弃\
  \ `react-scripts` 配置，并按照自己的喜好调整配置。\n\n对于那些厌倦 `react-scripts` 提供的“黑盒”的人来说，最后一个命令是令人宽慰的。如果你的项目“超出”了\
  \ `react-scripts` 或者你需要某些特殊配置，你有一个逃口。\n\n### `src/`\n\n在 `src/` 内部，我们看到一些 JavaScript\
  \ 文件：\n\n```\n$ ls src\nApp.css\nApp.js\nApp.test.js\nindex.css\nindex.js\nlogo.svg\n\
  ```\n\nCreate React App 创建了一个样板 React 应用，用于演示文件是如何组织内容的。该应用包含一个单一组件 `App`，它位于 `App.js`\
  \ 内部。\n\n### `App.js`\n\n查看 `src/App.js`：\n\n```javascript\nimport React, { Component\
  \ } from 'react';\nimport logo from './logo.svg';\nimport './App.css';\n\nclass\
  \ App extends Component {\n  render() {\n    return (\n      <div className=\"App\"\
  >\n        <div className=\"App-header\">\n          <img src={logo} className=\"\
  App-logo\" alt=\"logo\" />\n          <h2>Welcome to React</h2>\n        </div>\n\
  \        <p className=\"App-intro\">\n          To get started, edit <code>src/App.js</code>\
  \ and save to reload.\n        </p>\n      </div>\n    );\n  }\n}\n\nexport default\
  \ App;\n```\n\n`webpack/heart-webpack-complete/src/App.js`\n\n这里有几个值得注意的特征。\n\n\
  #### 导入语句（import statements）\n\n我们在文件顶部导入了 `React` 和 `Component`：\n\n```javascript\n\
  import React, { Component } from 'react';\n```\n\n`webpack/heart-webpack-complete/src/App.js`\n\
  \n这是 ES6 模块导入语法。Webpack 会推断出通过 `'react'`，我们指的是我们在 `package.json` 中指定的 npm 包。\n\n\
  接下来的两个导入可能会让你感到惊讶：\n\n```javascript\nimport logo from './logo.svg';\nimport './App.css';\n\
  ```\n\n`webpack/heart-webpack-complete/src/App.js`\n\n我们对非 JavaScript 的文件也使用了 `import`！Webpack\
  \ 要求你使用这种语法指定**所有**依赖项。我们稍后会看到这是如何起作用的。因为路径是相对路径（以 `./` 开头），Webpack 知道我们指的是本地文件而不是\
  \ npm 包。\n\n#### `App` 是一个 ES6 模块\n\n`App` 组件本身非常简单，没有使用状态（state）或属性（props）。它的返回方法只是标记，我们稍后会看到它的渲染。\n\
  \n`App` 组件的特殊之处在于它是一个 ES6 模块。我们的 `App` 组件位于自己专门的 `App.js` 中。在文件的顶部，它指定了依赖项，在底部它指定了导出：\n\
  \n```javascript\nexport default App;\n```\n\n`webpack/heart-webpack-complete/src/App.js`\n\
  \n我们的 React 组件完全封装在这个模块中。任何额外的库、样式和图像都可以在顶部指定。任何开发者都可以打开此文件并快速推断出该组件拥有哪些依赖项。我们可以定义组件私有的辅助函数，外部无法访问。\n\
  \n此外，记住 `src/` 中除了 `App.css` 之外还有另一个与 `App` 相关的文件：`App.test.js`。因此，我们有三个文件对应我们的组件：组件本身（一个\
  \ ES6 模块）、一个专门的 own 和一个专门的测试文件。\n\nCreate React App 为我们的 React 应用建议了一种强大的组织范式。虽然在我们的单一组件应用中可能并不明显，但你可以想象这种模块化组件模型随着组件数量增加到数百或数千个时，将如何很好地扩展。\n\
  \n我们知道模块化组件定义在哪里。但我们缺少了一个关键部分：组件是在哪里写入 DOM 的？\n\n答案在 `src/index.js` 内部。\n\n### `index.js`\n\
  \n现在打开 `src/index.js`：\n\n```javascript\nimport React from 'react';\nimport ReactDOM\
  \ from 'react-dom';\nimport App from './App';\nimport './index.css';\n\nReactDOM.render(\n\
  \  <App />,\n  document.getElementById('root')\n);\n```\n\n`webpack/heart-webpack-complete/src/index.js`\n\
  \n逐步检查此文件，我们首先导入了 `react` 和 `react-dom`。因为我们将 `App` 指定为 `App.js` 的默认导出，所以我们可以在这里导入它。再次注意，相对路径（`./App`）向\
  \ Webpack 发出信号，说明我们指的是本地文件而不是 npm 包。\n\n\n\n\n\n在第二个应用（计时器应用）中，我们使用了一个小型 Node 服务器来提供我们的静态资源。我们在\
  \ `server.js` 中定义了一个服务器，它既提供了一组 API 端点，又服务了 `public/` 下的所有资源。我们的 API 服务器和静态资源服务器是同一个。\n\
  \n使用 Create React App 时，我们的静态资源是由在执行运行 `npm start` 时启动的 `Webpack development server`\
  \ 提供的。目前，我们还没有处理 API。\n\n正如我们所见，原始的 `index.html` 并不包含对 React 应用的任何引用。Webpack 在将\
  \ `index.html` 发送到浏览器之前，会在其中插入对 `bundle.js` 的引用。如果你在磁盘上找找看，会发现 `bundle.js` 在任何地方都不存在。**Webpack\
  \ 开发服务器会动态生成此文件并将其保留在内存中**。当我们的浏览器向 `localhost:3000/` 发起请求时，Webpack 会从内存中提供修改后的\
  \ `index.html` 和 `bundle.js`。\n\n从页面 `view-source:http://localhost:3000/` 中，你可以点击\
  \ `/static/js/bundle.js` 在浏览器中打开该文件。打开它可能需要几秒钟。这是一个非常巨大的文件。\n\n`bundle.js` 包含了我们应用运行所需的*所有*\
  \ JavaScript 代码。它不仅包含 `App.js` 的完整源码——它包含了 React 库的完整源码！\n\n你可以在此文件中搜索字符串 `./src/App.js`。Webpack\
  \ 用特殊注释对它包含的每个独立文件进行了界定。你会发现的内容非常杂乱：\n\n![](img/create-react-app----bundle-search-app-js.png)\n\
  \n如果你稍加搜寻，你可以在这一片混乱中看到 `App.js` 某些可认的碎片。这确实是我们的组件。但它看起来完全不像原来的样子了。\n\nWebpack 对所有包含的\
  \ JavaScript 执行了一些转换。值得注意的是，它使用 Babel 将我们的 ES6 代码转译为与 ES5 兼容的格式。\n\n如果你查看 `App.js`\
  \ 的注释头部，发现它有一个数字。在上面的截图中，那个数字是 `258`：\n\n```\n/* 258 */\n/*!********************!*\\\
  \n  !*** ./src/App.js ***!\n  \\********************/\n```\n\n模块本身被封装在一个看起来像这样的函数内部：\n\
  \n```\nfunction(module, exports, __webpack_require__) {\n  // 这里是杂乱的 App.js 代码\n\
  }\n```\n\n我们 Web 应用的每个模块都封装在具有具有此签名的函数内部。Webpack 为我们应用的每个模块都提供了这个函数容器，以及一个模块 ID（对于\
  \ `App.js`，数字为 `258`）。\n\n但这里的“模块”并不限于 JavaScript 模块。\n\n还记得我们在 `App.js` 中是如何导入\
  \ logo 的吗：\n\n```\nimport logo from './logo.svg';\n```\n\nwebpack/heart-webpack-complete/src/App.js\n\
  \n随后在组件的标记语言中，它被用于设置 `img` 标签的 `src` 属性：\n\n```\n <img src={logo} className=\"App-logo\"\
  \ alt=\"logo\" />\n```\n\nwebpack/heart-webpack-complete/src/App.js\n\n这里是在 `App.js`\
  \ Webpack 模块的混乱内部，`logo` 变量声明的样式：\n\n```\nvar _logo = __webpack_require__(/*! ./logo.svg\
  \ */ 259);\n```\n\n这看起来非常奇怪，主要是因为 Webpack 为了调试目的提供了内联注释。删掉该注释：\n\n```\nvar _logo\
  \ = __webpack_require__(259);\n```\n\n我们得到的不是 `import` 语句，而是纯粹的旧 ES5 代码。但是，这在做什么呢？\n\
  \n要找到答案，请在此文件中搜索 `./src/logo.svg`。（它应该直接出现在 `App.js` 下方）。SVG 也表示在 `bundle.js` 中！\n\
  \n![](img/create-react-app----bundle-search-logo-svg.png)\n\n查看该模块的头部：\n\n```\n\
  /* 259 */\n/*!**********************!*\\\n  !*** ./src/logo.svg ***!\n  \\**********************/\n\
  ```\n\n注意，它的模块 ID 是 `259`，与上面传递给 `__webpack_require__()` 的整数相同。\n\nWebpack 将*一切*都视为模块，包括像\
  \ `logo.svg` 这样的图像资源。我们可以通过从 `logo.svg` 模块的混乱中提取出一个路径来了解正在发生什么。你的路径可能不同，但它看起来像这样：\n\
  \n```\nstatic/media/logo.5d5d9eef.svg\n```\n\n如果你打开一个新的浏览器标签页并输入此地址：\n\n```\nhttp://localhost:3000/static/media/logo.5d5d9eef.svg\n\
  ```\n\n你应该能得到 React 标志：\n\n![](img/create-react-app----react-svg.png)\n\n所以 Webpack\
  \ 通过定义一个函数为 `logo.svg` 创建了一个 Webpack 模块。虽然该函数的实现细节是不透明的，但我们知道它指向 Webpack 开发服务器上的\
  \ SVG 路径。因为这种模块化范式，它能够智能地编译像这样的语句：\n\n```\nimport logo from './logo.svg';\n```\n\
  \n将其转换为这个 ES5 语句：\n\n```\nvar _logo = __webpack_require__(259);\n```\n\n`__webpack_require__()`\
  \ 是 Webpack 的特殊模块加载器。此调用引用了与 `logo.svg` 对应的 Webpack 模块。\n\n\n\n\n目前，`Create React\
  \ App` 仅为 CSS 设置了热重载（hot reloading）。这是因为 React 特有的热重载器被认为尚未稳定到可以默认配置。\n\nCSS 的热重载非常棒。在打开浏览器窗口的情况下，对\
  \ `App.css` 进行编辑，并见证应用在无需刷新的情况下进行更新。\n\n例如，你可以更改 logo 旋转的速度。在这里，我们将它从 `20s` 改为了\
  \ `1s`：\n\n```\n.App-logo {\n  animation: App-logo-spin infinite 1s linear;\n  height:\
  \ 80px;\n}\n```\n\n或者，你可以更改标题文本的颜色。在这里，我们将它从 `white` 改为了 `purple`：\n\n```\n.App-header\
  \ {\n  background-color: #222;\n  height: 150px;\n  padding: 20px;\n  color: purple;\n\
  }\n```\n\n## 自动重载\n\n尽管我们的 JavaScript 文件不支持热重载，但只要 `Webpack` 检测到变化，它仍然会自动刷新页面。\n\
  \n在浏览器窗口仍然打开的情况下，让我们对 `src/App.js` 进行细微编辑。我们将更改 `p` 标签中的文本：\n\n```\n<p className=\"\
  App-intro\">\n  I just made a change to <code>src/App.js</code>!\n</p>\n```\n\n\
  保存文件。你会注意到页面在保存后不久就会刷新，你的更改也得到了反映。\n\n由于 `Webpack` 本质上是一个 JavaScript 开发和部署的平台，因此为\
  \ `Webpack` 驱动的应用拥有不断增长的插件和工具生态系统。\n\n对于开发，热重载和自动重载是 `Create React App` 预配置的两个最具吸引力的插件。在后面关于\
  \ `eject`（“弹出”）的后续章节中，我们将指向 `Create React App` 的配置文件，该文件为开发设置了 `Webpack`，以便你能够看到其余内容。\n\
  \n对于部署，`Create React App` 为 `Webpack` 配置了多种插件，以生成生产级的优化构建。接下来我们将查看生产环境构建过程。\n\n\
  ## 创建生产环境构建\n\n到目前为止，我们一直在使用 `Webpack` 开发服务器。在我们的研究中，我们看到该服务器生成了一个修改过的 `index.html`，它加载了一个\
  \ `bundle.js`。`Webpack` 从内存中生成并提供此文件——没有任何内容写入磁盘。\n\n对于生产环境，我们希望 `Webpack` 将包写入磁盘。我们最终将获得针对\
  \ `HTML`、`CSS` 和 `JavaScript` 的生产环境优化构建。然后我们可以使用任何所需的 HTTP 服务器来提供这些资源。要向世界共享我们的应用，我们只需要将此构建版本上传到资源托管主机（例如\
  \ Amazon 的 `S3`）即可。\n\n让我们看看生产环境构建是什么样子的。\n\n如果服务器正在运行，使用 `CTRL+C` 退出它。从命令行运行我们早些在\
  \ `package.json` 中看到的 `build` 命令：\n\n```\n$ npm run build\n```\n\n当此操作完成后，你会注意到项目根目录下创建一个新文件夹：`build`。`cd`\
  \ 进入该目录并查看内部的内容：\n\n```\n$ cd build\n$ ls\nfavicon.ico\nindex.html\nstatic/\n```\n\
  \n如果你查看这个 `index.html`，你会注意到 `Webpack` 执行了一些在开发环境中未执行的额外处理。最明显的一是：没有换行符。整个文件在单行上。在\
  \ `HTML` 中换行符并不是必要的，它们只是额外的字节。在生产环境中我们不需要它们。\n\n以下是该文件在人类可读格式下的外观：\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta content=\"\
  width=device-width,initial-scale=1\" name=\"viewport\">\n    <link href=\"/favicon.ico?fd73a6eb\"\
  \ rel=\"shortcut icon\">\n    <title>React App</title>\n    <link href=\"/static/css/main.9a0fe4f1.css\"\
  \ rel=\"stylesheet\">\n  </head>\n  <body>\n    <div id=\"root\"></</div>\n    <script\
  \ src=\"/static/js/main.590bf8bb.js\" type=\"text/javascript\">\n    </script>\n\
  \  </body>\n</html>\n```\n\n这个 `index.html` 并没有引用 `bundle.js`，而是引用了 `static/` 中的一个文件，我们稍后会查看。此外，这个生产环境\
  \ `index.html` 现在有一个指向 `CSS` 包的 `link` 标签。正如我们所看到的，在开发环境中 `Webpack` 通过 `bundle.js`\
  \ 插入 `CSS`。此功能启用了热重载。在生产环境中，热重载能力是无关的。因此，`Webpack` 正常部署 `CSS`。\n\n`static/` 文件夹结构如下：\n\
  \n```\n$ ls static\ncss/\njs/\nmedia/\n```\n\n逐个检查文件夹：\n\n```\n$ ls static/css\n\
  main.9a0fe4f1.css\nmain.9a0fe4f1.css.map\n\n$ ls static/js\nmain.f7b2704e.js\nmain.f7b2704e.js.map\n\
  \n$ ls static/media\nlogo.5d5d9eef.svg\n```\n\n欢迎在你的文本编辑器中同时打开 `.css` 文件和 `.js`\
  \ 文件。由于体积较大，我们在此书中未对打印它们。\n\n如果你打开 CSS 文件，你会发现它只有两行：第一行是我们的应用*所有* `CSS`，去除了所有多余的空白字符。我们的应用中可能有数百个不同的\
  \ `CSS` 文件，但它们最终会汇聚到这一单行上。第二行是一个声明 map 文件位置的特殊注释。\n\nJavaScript 文件更加紧凑。在开发环境中，`bundle.js`\
  \ 具有某种结构。你可以拆解出各个模块的位置。生产环境构建没有这种结构。此外，我们的代码已经经过了压缩化（minified）和混淆（uglified）。如果你不熟悉压缩化或混淆，请参阅侧栏“Minification,\
  \ uglification, and source maps.”。\n\n最后，media 文件夹将包含应用的所有其他静态文件，如图像和视频。此应用只有一个图像，即\
  \ React logo SVG 文件。\n\n再次，此包是完全自包含的并已准备就绪。如果我们愿意，可以安装我们在第一个应用程序中 `http-server`\
  \ 包，并用它来提供服务：\n\n```\nhttp-server ./build -p 3000\n```\n\n如果没有 Webpack 开发服务器，你可以想象开发周期将会非常痛苦：\n\
  \n1. 修改应用\n2. 运行 `npm run build` 生成包\n3. 启动/重启 HTTP 服务器\n\n这就是为什么我们没有除了生产构建之外的其他构建方式。Webpack\
  \ 服务器为我们的开发提供服务。\n\n## 弹出 (Eject)\n\n在本章开头介绍 React App 时，我们注意到项目提供了一种“弹出”应用的机制。\n\
  \n这让人很安心。在未来，你可能会发现自己对 React-Webpack 设置有更多控制需求。弹出操作会将 `react-scripts` 中封装的所有脚本和配置复制到你的目录中。\n\
  \n执行弹出也是从 React App 中移除某些“魔法”的好方法。我们将在本节中执行弹出并快速查看。\n\n### 系好带\n\n从 `heart-webpack`\
  \ 根目录下运行 eject 命令：\n\n```\n$ npm run eject\n```\n\n输入 `y` 并按回车确认弹出。\n\n在所有文件从 `react-scripts`\
  \ 复制到你的目录后，将运行 `npm install`。这是因为正如我们看到的，`react-scripts` 的所有依赖项都倾倒到了我们的 `package.json`\
  \ 中。\n\n当 npm 安装完成后，查看我们的项目目录：\n\n```\n$ ls\nREADME.md\nbuild/\nconfig/\nnode_modules/\n\
  package.json\npublic/\nscripts/\nsrc/\n```\n\n我们有两个新文件夹：`config/` 和 `scripts/`。如果你查看\
  \ `src/` 内部，你会注意到如预期的那样，它没有变化。\n\n接下来检查 `scripts/`：\n\n```\n$ ls scripts\nbuild.js\n\
  start.js\ntest.js\n```\n\n\n当我们之前运行 `npm start` 和 `npm run build` 时，我们分别执行了 `start.js`\
  \ 和 `build.js` 脚本。在书中我们不会查看这些文件，但欢迎随时翻阅它们。虽然它们很复杂，但带有详尽的注释。只需阅读这些注释，你就能很好地了解这些脚本在做什么（以及它们为你“免费”提供了什么）。\n\
  \n最后，接下来查看 `config/` ：\n\n```\n$ ls config\nenv.js\njest/\npaths.js\npolyfills.js\n\
  webpack.config.dev.js\nwebpack.config.prod.js\n```\n\n`react-scripts` 为其提供的工具设置了合理的默认值。在\
  \ `package.json` 中，它指定了 `Babel` 的配置。在这里，它指定了 `Webpack` 和 `Jest`（我们在下一章中将使用的测试库）的配置。\n\
  \n特别值得注意的是 `Webpack` 的配置文件。同样，我们在这里不会深入研究这些文件。但这些文件有详尽的注释。阅读这些注释可以让你大致了解 Webpack\
  \ 开发和生产流水线是如何工作的，以及使用了哪些插件。将来，如果你好奇 `react-scripts` 是如何在开发或生产环境中配置 `Webpack` 的，可以参考这些文件内部的注释。\n\
  \n希望看到 `react-scripts` 的“内部构造”能减少一点它的神秘感。像我们这里这样测试 `eject` 可以让你了解，如果将来需要，放弃 `react-scripts`\
  \ 的过程是怎样的。\n\n到本章为止，我们已经复盖了 `Webpack` 的基础知识以及 `Create React App` 对其提供的接口。具体来说，我们看到了：\n\
  \n* Create React App 的接口是如何工作的\n* 使用 Webpack 驱动的 React 应用的通用布局\n* Webpack 的工作原理（以及它提供的一些功能）\n\
  * Create React App 和 Webpack 如何帮助我们生成生产优化的构建版本\n* 已弹出（ejected）的 Create React App\
  \ 项目是什么样子的\n\n然而，我们的演示 Webpack-React 应用还缺少一个核心元素。\n\n在我们的第二个项目（计时器应用）中，我们有一个与 API\
  \ 交互的 React 应用。node 服务器既提供我们的静态资源（HTML/CSS/JS），又提供一组 API 端点，我们使用这些端点来持久运行计时器的数据。\n\
  \n正如我们在本章看到的，通过 `Create React App` 使用 Webpack 时，我们启动了一个 Webpack 开发服务器。该服务器负责提供我们的静态资源。\n\
  \n如果我们想让 React 应用与 API 交互会呢？我们仍然希望 Webpack 开发服务器来提供我们的静态资源。因此，我们可以想象分别启动 API 服务器和\
  \ Webpack 服务器。那么我们的挑战就是让两者协同工作。\n\n### 使用 Create React App 配合 API 服务器\n\n在本节中，我们将研究一种在运行\
  \ API 服务器的同时运行 Webpack 开发服务器的策略。在深入研究这种策略之前，让我们来看看我们将要处理的应用。\n\n#### 完成的应用\n\n`food-lookup-complete`\
  \ 位于书籍代码下载的根目录下。从 `heart-webpack` 到达那里：\n\n```\n$ cd ../..\n$ cd food-lookup-complete\n\
  ```\n\n查看文件夹的结构：\n\n```\n$ ls\nREADME.md\nclient/\ndb/\nnode_modules/\npackage.json\n\
  server.js\nstart-client.js\nstart-server.js\n```\n\n项目根目录下是*服务器*所在的地方。这里有一个 `package.json`\
  \ 文件和一个 `server.js` 文件。`client/` 内部是 *React 应用*所在的地方。`client/` 文件夹是用 Create React\
  \ App 生成的。\n\n现在查看 `client/` 内部：\n\n如果你在 macOS 或 Linux 上，运行：\n\n```\n$ ls -a client\n\
  ```\n\nWindows 用户可以运行：\n\n```\n$ ls client\n```\n\n你会看到：\n\n```\n.babelrc\n.gitignore\n\
  node_modules/\npackage.json\npublic/\nsrc/\ntests/\n```\n\n所以，我们有两个 `package.json`\
  \ 文件。一个位于根目录，指定了服务器所需的包。另一个位于 `client/` 中，指定了 React 应用所需的包。虽然它们共存于此文件夹中，但我们拥有两个完全独立的应用。\n\
  \n#### `.babelrc`\n\n`cilent/` 内部一个值得注意的文件是 `.babelrc`。该文件的内容：\n\n```\n// client/.babelrc\n\
  {\n  \"plugins\": [\"transform-class-properties\"]\n}\n```\n\n如你可能记得，这个插件为我们提供了我们在[第一章末尾]使用的属性初始化语法。在那个项目中，我们通过在\
  \ `app.js` 的 script 标签上设置 `data-plugins` 属性来指定想要使用这个插件，如下所示：\n\n```html\n<script\n\
  \  type=\"text/babel\"\n  data-plugins=\"transform-class-properties\"\n  src=\"\
  ./js/app.js\"\n</script>\n```\n\n现在对于这个项目，Babel 是 `react-scripts` 包含并管理的。要指定我们希望\
  \ Babel 为 Create React App 项目使用的插件，我们必须首先在 `package.json` 中包含它。它已经包含了：\n\n```\n\
  \ \"dependencies\": {\n```\n\nfood-lookup-complete/client/package.json\n\n我们只需要在\
  \ `.babelrc` 中指定让 Babel 使用该插件即可。\n\n#### 运行应用\n\n为了启动应用，我们需要安装服务器和客户端的包。我们在两个目录中运行\
  \ `npm i`：\n\n```\n$ npm i\n$ cd client\n$ npm i\n$ cd ..\n```\n\n安装服务器和客户端的包后，我们可以运行应用。请确保从项目根目录（服务器所在目录）执行：\n\
  \n```\n$ npm start\n```\n\n启动时，你会看到来自服务器和客户端的控制台输出。一旦应用启动，你可以访问 `localhost:3000`\
  \ 查看应用：\n\n![](img/create-react-app-food-lookup-complete-empty.png)\n\n该应用提供了一个查询食品数据库信息的搜索字段。在搜索字段中输入值会执行实时搜索。你可以点击食品将它们添加到顶部的表格中：\n\
  \n![](img/create-react-app-food-lookup-complete-populated.png)\n\n#### 应用组件\n\n\
  该应用由三个组件组成：\n\n![](img/create-react-app-components.png)\n\n* **App**: 应用的父容器。\n\
  * **SelectedFoods**: 列出已选食品的表格。点击食品项目将其移除。\n* **FoodSearch**: 提供实时搜索字段的表格。点击表格中的食品项目将其添加到总量（SelectedFoods）。\n\
  \n在本章中，我们不会深入研究这些任何一个组件的细节。相反，我们将专注于如何让这个现有的 Webpack-React 应用与 Node 服务器协同工作。\n\n\
  #### 应用组织结构\n\n现在我们已经看到了完成的应用，让我们来看看是如何让它运行的。\n\n如果应用正在运行，请将其关闭，然后进入 `webpack` 的\
  \ `food-lookup` 目录（未完成版本）。从 `food-lookup-complete` 进入：\n\n```\ncd webpack/food-lookup\n\
  ```\n\n再次，我们需要为服务器和客户端安装 npm 包：\n\n```\n$ npm i\n$ cd client\n$ npm i\n$ cd ..\n\
  ```\n\n#### 服务器\n\n让我们只启动服务器并看看它是如何工作的。在完成版本中，我们使用 `npm start` 同时启动服务器和客户端。如果你检查此目录下的\
  \ `package.json`，你会发现尚未定义该命令。我们可以通过以下命令启动服务器：\n\n```\n$ npm run server\n```\n\n\
  该服务器提供单一 API 端点 `/api/food`。它期望一个单一参数 `q`，即我们要搜索的食品。\n\n你可以自己尝试一下。你可以使用浏览器执行搜索，或者使用\
  \ `curl`：\n\n\n\n\n```bash\n$ curl localhost:3001/api/food?q=hash+browns\n\n[\n\
  \  {\n    \"description\": \"Fast foods, potatoes, hash browns, rnd pieces or patty\"\
  ,\n    \"kcal\": 272,\n    \"protein_g\": 2.58,\n    \"carbohydrate_g\": 28.88,\n\
  \    \"sugar_g\": 0.56\n  },\n  {\n    \"description\": \"Chick-fil-a, hash browns\"\
  ,\n    \"kcal\": 301,\n    \"protein_g\": 3,\n    \"carbohydrate_g\": 30.51,\n \
  \   \"sugar_g\": 0.54\n  },\n  {\n    \"description\": \"Denny's, hash browns\"\
  ,\n    \"kcal\": 197,\n    \"protein_g\": 2.49,\n    \"carbohydrate_g\": 26.59,\n\
  \    \"sugar_g\": 1.38\n  },\n  {\n    \"description\": \"Restaurant, family style,\
  \ hash browns\",\n    \"kcal\": 197,\n    \"protein_g\": 2.49,\n    \"carbohydrate_g\"\
  : 26.59,\n    \"sugar_g\": 1.38\n  }\n]\n```\n\n现在我们已经了解了这个端点是如何工作的，让我们来看看它在客户端中调用的地方。使用\
  \ `CTRL+C` 停止服务器。\n\n### 客户端\n\n`FoodSearch` 组件对 `/api/foods` 发起调用。每当用户更改搜索字段时，它都会执行一次请求。它使用库\
  \ `Client` 来发送请求。\n\n`Client` 模块定义在 `client/src/Client.js` 中。它导出一个包含一个方法 `search()`\
  \ 的对象。只看 `search()` 函数：\n\n```javascript\nfunction search(query, cb) {\n  return\
  \ fetch(`http://localhost:3001/api/food?q=${query}`, {\n    accept: 'application/json',\n\
  \  }).then(checkStatus)\n    .then(parseJSON)\n    .then(cb);\n}\n```\n\n`webpack/food-lookup/client/src/Client.js`\n\
  \n`search()` 函数是客户端与服务器之间的唯一接触点。`search()` 调用了 `localhost:3001`，即服务器的默认位置。\n\n因此，我们需要运行两个不同的服务器才能让应用程序正常工作。我们需要运行\
  \ API 服务器（在 `localhost:3001` 上）和运行 Webpack 开发服务器（在 `localhost:3000` 上）。如果这两个服务器都在运行，它们理论上应该是可以通信的。\n\
  \n我们可以使用两个终端窗口，但有一个更好的解决方案。\n\n### Concurrently\n\n`[Concurrently](https://github.com/kimmobrunfeldt/concurrently)`\
  \ 是一个运行多个进程的工具。我们将通过实现它来看看它是如何工作的。\n\nConcurrently 已经包含在服务器的 `package.json` 中：\n\
  \n```json\n },\n  \"devDependencies\": {\n    \"concurrently\": \"3.1.0\"\n```\n\
  \n`webpack/food-lookup/package.json`\n\n我们希望 `concurrently` 执行两个命令，一个启动 API 服务器，另一个启动\
  \ Webpack 开发服务器。你可以通过像这样将引号中的命令传递给 `concurrently` 来启动多个命令：\n\n```bash\n# 使用 `concurrently`\
  \ 的示例\n$ concurrently \"command1\" \"command2\"\n```\n\n如果你编写的应用仅在 Mac 或 Unix 机器上运行，你可以尝试这样做：\n\
  \n```bash\n$ concurrently \"npm run server\" \"cd client && npm start\"\n```\n\n\
  注意，启动客户端的第二个命令切换到 `client` 目录然后运行 `npm start`。\n\n然而，`&&` 运算符不是跨平台的，在 Windows 上将无法工作。因此，我们在项目中包含了一个\
  \ `start-client.js` 脚本。该脚本将从顶层目录启动客户端。\n\n有了这个启动脚本，你可以这样从顶层目录启动客户端应用：\n\n```bash\n\
  $ babel-node start-client.js\n```\n\n我们将向 `package.json` 中添加一个 `client` 命令。这样，启动服务器和客户端的方法看起来就一样了：\n\
  \n```bash\n# 启动服务器\n$ npm run server\n# 启动客户端\n$ npm run client\n```\n\n因此，使用 `concurrently`\
  \ 的看起来将如下：\n\n```bash\n$ concurrently \"npm run server\" \"npm run client\"\n```\n\
  \n现在让我们在 `package.json` 中添加 `start` 和 `client` 命令：\n\n```json\n \"scripts\": {\n\
  \    \"start\": \"concurrently \\\"npm run server\\\" \\\"npm run client\\\"\",\n\
  \    \"server\": \"babel-node start-server.js\",\n    \"client\": \"babel-node start-client.js\"\
  \n  },\n```\n\n`food-lookup-complete/package.json`\n\n对于 `start`，我们执行两个命令，并对引号进行了转义，因为我们在\
  \ JSON 文件中。\n\n保存并关闭 `package.json`。现在我们可以通过运行 `npm start` 启动两个服务器。现在动手吧：\n\n```bash\n\
  $ npm start\n```\n\n你会看到服务器和客户端的输出打印到控制台中。`Concurrently` 同时执行了两个运行命令。\n\n当一切都已启动后，访问\
  \ `localhost:3000`。然后开始输入一些内容。\n\n\n\n代码分割（Code splitting）是另一种基于包（bundle）概念的优化手段。你可以配置\
  \ `Webpack`，使其仅提供与用户查看的页面相关的 JavaScript 和 CSS 资源。虽然你的多页面应用可能有数百个 React 组件，但你可以让\
  \ `Webpack` 仅为客户端渲染其所在页面所需的必要组件和 CSS。\n\n## 工具\n\n与优化一样，`Webpack` 工具链周边的生态系统也是非常庞大的。\n\
  \n在开发方面，我们看到了 `Webpack` 方便的热重载和自动重载功能。此外，`Create React App` 在开发流水线中配置了其他便利功能，例如对你的\
  \ JavaScript 代码进行自动 lint 。\n\n在生产环境中，我们看到了如何配置 `Webpack` 来执行优化生产环境构建的插件。\n\n###\
  \ 何时使用 Webpack/Create React App\n\n那么，于 `Webpack` 的强大功能，你可能会问：我应该对未来所有的 React 项目都使用\
  \ `Webpack/Create React App` 吗？\n\n这取决于情况。\n\n像在前几章中那样在 `script` 标签中加载 React 和 Babel\
  \ 仍然是一个完全合理的方法。对于某些项目，这种设置的简单性可能更具优势。此外，你始终可以从简单开始，将来将项目迁移到更复杂的 `Webpack` 设置。\n\n\
  更重要的是，如果你正考虑在现有应用中引入 React，这种简单的方法是你的最佳选择。你不需要为你的应用采用完全全新的构建或部署流水线。相反，你可以一个一个地引入\
  \ React 组件，只需简单确保你的应用中包含了 React 库即可。\n\n但是，对于许多开发者和许多类型的项目，`Webpack` 是一个极具吸引力的选择，其功能多到不容错过。如果你计划编写一个带有许多不同组件的大型\
  \ React 应用，`Webpack` 对 ES6 模块的支持将帮助保持代码库的合理性。对 `npm` 包的支持也非常棒。得益于 `Create React\
  \ App`，你免费获得了大量的开发和生产工具。\n\n还有一个让人倾向于 `Webpack` 的决定性额外因素：测试。在下一章中，我们将学习如何为 React\
  \ 应用编写测试。正如我们将看到的，`Webpack` 提供了一个平台，可以在控制台中在浏览器之外轻松地执行我们的测试套件。\n\n## 单元测试\n\n健壮的测试套件是高质量软件的重要组成部分。有了良好的测试套件，开发者可以更有信心地对应用程序进行重构或添加功能。测试套件是一项投入，将在系统的整个生命周期内产生回报。\n\
  \n测试用户界面是出了名的困难。但幸运的是，测试 React 组件并非如此。通过正确的工具和方法，你的 Web 应用界面可以像系统的其他任何部分一样经过测试的加固。\n\
  \n我们将从编写一个不使用任何测试库的小型测试套件开始。在熟悉了测试套件的本质后，我们将引入 `Jest` 测试框架来减少大量的样板代码，并让我们的测试更具表达力。\n\
  \n在使用 `Jest` 期间，我们将看到如何以行为驱动（BDD）的风格组织测试套件。一旦我们熟悉了基础知识，我们将查看如何专门针对 React 组件的方法。我们将引入\
  \ `Enzyme`，这是一个用于在测试环境中处理 React 组件的库。\n\n最后，在本章的最后一节，我们将处理一个位于大型应用内部的复杂 React 组件。我们使用\
  \ `mock`（模拟）的概念来隔离我们正在测试的 API 驱动组件。\n\n### 在不使用框架的情况下编写测试\n\n本章的项目位于本书代码下载提供的 `testing`\
  \ 文件夹中。\n\n我们将从 `basics` 文件夹开始：\n\n```\n$ cd testing/basics\n```\n\n该项目的结构：\n\n\
  ```\n$ ls\nModash.js\nModash.test.js\ncomplete/\npackage.json\n```\n\n我们将使用 `babel-node`\
  \ 从命令行运行我们的测试套件。`babel-node` 包含在该文件夹的 `package.json` 中。现在安装 `package.json` 中的包：\n\
  \n```\n$ npm install\n```\n\n为了编写测试，我们需要一个库来测试。让我们写一个可以测试的小实用工具库。\n\n#### 准备 Modash\n\
  \n我们将在 `Modash.js` 中编写一个小库。`Modash` 将具有一些在处理 JavaScript 字符串时可能有用的方法。我们将编写以下三个方法。每个方法返回一个字符串：\n\
  \n`truncate(string, length)`\n\n如果 `string` 长于提供的 `length`，则对其截断。如果字符串被截断，它将以 `...`\
  \ 结尾：\n\n```\nconst s = 'All code and no tests makes Jack a precarious boy.';\n\
  Modash.truncate(s, 21);\n  // => 'All code and no tests...'\nModash.truncate(s,\
  \ 100);\n  // => 'All code and no tests makes Jack a precarious boy.'\n```\n\n`capitalize(string)`\n\
  \n将 `string` 的第一个字母大写并将其余部分小写：\n\n```\nconst s = 'stability was practically ASSURED.';\n\
  Modash.capitalize(s);\n  // => 'Stability was practically assured.'\n```\n\n`camelCase(string)`\n\
  \n取一个由空格、横线或下划线分隔的单词字符串，并返回驼峰命名法的表示：\n\n```\nlet s = 'started at';\nModash.camelCase(s);\n\
  \  // => 'startedAt'\ns = 'started_at';\nModash.camelCase(s);\n  // => 'startedAt'\n\
  ```\n\n\n\n\n首先，我们设置测试：\n\n```javascript\nconst string = 'there was one catch, and\
  \ that was CATCH-22';\nconst actual = Modash.truncate(string, 19);\nconst expected\
  \ = 'there was one catch...';\n```\n\n`testing/basics/complete/Modash.test-1.js`\n\
  \n我们正在声明示例测试字符串 `string`。然后我们设置了两个变量：`actual` 和 `expected`。在测试套件中，`actual` 是我们所说的观察到的行为。在这种情况下，它是\
  \ `Modash.truncate` 实际返回的内容。`expected` 是我们预期的值。\n\n接下来，我们对测试进行断言。我们将打印一条消息，用来指示\
  \ `truncate` 是通过还是失败：\n\n```javascript\nif (actual !== expected) {\n  console.log(\n\
  \    `[FAIL] Expected \\`truncate()\\` to return '${expected}', got '${actual}'`\n\
  \  );\n} else {\n  console.log('[PASS] `truncate()`.');\n}\n```\n\n`testing/basics/complete/Modash.test-1.js`\n\
  \n### 尝试一下\n\n我们现在此阶段可以在命令行中运行测试套件。保存文件 `Modash.test.js`get `testing/basics` 文件夹下运行以下命令：\n\
  \n```bash\n./node_modules/.bin/babel-node Modash.test.js\n```\n\n执行此操作，我们看到控制台打印了\
  \ `[PASS]` 消息。如果你愿意，可以修改 `Modash.js` 中的 `truncate` 函数来观察此测试失败：\n\n![测试通过](img/testing----modash-1-success.png)\n\
  \n测试通过\n\n![测试失败时的示例](img/testing----modash-1-fail.png)\n\n测试失败时的示例\n\n### `assertEqual()`\
  \ 函数\n\n让我们为 `Modash` 中的另外两个方法编写一些测试。\n\n对于我们所有的测试，都将遵循一种相似的模式。我们将编写一些断言来检查 `actual`\
  \ 是否等于 `expected`。我们将向控制台打印一条消息，指示被测试的函数是通过还是失败。\n\n为了避免这种代码重复，我们将编写一个辅助函数 `assertEqual()`。`assertEqual()`\
  \ 将检查其两个参数之间的相等性。然后该函数将写入一条控制台消息，指示规范是通过还是失败。\n\n在 `Modash.test.js` 顶部，`Modash`\
  \ 导入语句下方，声明 `assertEqual`：\n\n```javascript\nimport Modash from './Modash';\n\n\
  function assertEqual(description, actual, expected) {\n  if (actual === expected)\
  \ {\n    console.log(`[PASS] ${description}`);\n  } else {\n    console.log(`[FAIL]\
  \ ${description}`);\n    console.log(`\\tactual: '${actual}'`);\n    console.log(`\\\
  texpected: '${expected}'`);\n  }\n}\n```\n\n`testing/basics/complete/Modash.test-2.js`\n\
  \n定义 `assertEqual` 后，让我们重写第一个测试规范。我们将在整个测试套件中重用变量 `actual`、`expected` 和 `string`，因此我们将使用\
  \ `let` 声明以便重新定义它们：\n\n```javascript\nlet actual;\nlet expected;\nlet string;\n\n\
  string = 'there was one catch, and that was CATCH-22';\nactual = Modash.truncate(string,\
  \ 19);\nexpected = 'there was one catch...';\n\nassertEqual('`truncate()`: truncates\
  \ a string', actual, expected);\n```\n\n`testing/basics/complete/Modash.test-2.js`\n\
  \n如果你现在运行 `Modash.test.js`，你会发现一切工作得如之前一样。控制台输出略有不同：\n\n![测试通过](img/testing----modash-2.png)\n\
  \n测试通过\n\n写好我们的断言函数后，让我们多写一些测试。\n\n为 `truncate` 再写一个断言。如果字符串小于提供的长度，该函数应该原样返回字符串。我们将使用相同的\
  \ `string`。在当前断言下方写下此断言：\n\n```javascript\nactual = Modash.truncate(string, string.length);\n\
  expected = string;\n\nassertEqual('`truncate()`: no-ops if <= length', actual, expected);\n\
  ```\n\n`testing/basics/complete/Modash.test-2.js`\n\n接下来，为 `capitalize` 写一个断言。我们可以继续使用相同的\
  \ `string`：\n\n```javascript\nactual = Modash.capitalize(string);\nexpected = 'There\
  \ was one catch, and that was catch-22';\n\nassertEqual('`capitalize()`: capitalizes\
  \ the string', actual, expected);\n```\n\n`testing/basics/complete/Modash.test-2.js`\n\
  \n考虑到我们使用的示例字符串，此断言测试了 `capitalize` 的两个方面：它将字符串中的第一个字母大写，并将其余部分转换为小写。\n\n最后，我们将为\
  \ `camelCase` 编写断言。我们将用两个不同的字符串测试此函数。一个由空格分隔，另一个由下划线分隔。\n\n针对空格的断言：\n\n```javascript\n\
  string = 'customer responded at';\nactual = Modash.camelCase(string);\nexpected\
  \ = 'customerRespondedAt';\n\nassertEqual('`camelCase()`: string with spaces', actual,\
  \ expected);\n```\n\n`testing/basics/complete/Modash.test-2.js`\n\n针对下划线的断言：\n\n\
  ```javascript\nstring = 'customer_responded_at';\nactual = Modash.camelCase(string);\n\
  expected = 'customerRespondedAt';\n\nassertEqual('`camelCase()`: string with underscores',\
  \ actual, expected);\n```\n\n`testing/basics/complete/Modash.test-2.js`\n\n\n\n\n\
  由于 `toBe` 仅仅使用了 `===` 操作符，它有其局限性。例如，虽然我们可以使用 `toBe` 来检查一个对象是否是完全同一个对象：\n\n```\n\
  const a = { espresso: '60ml' };\nconst b = a;\nexpect(a).toBe(b); // pass\n```\n\
  \n如果我们想检查两个不同的对象是否相同呢？\n\n```\nconst a = { espresso: '60ml' };\nexpect(a).toBe({\
  \ espresso: '60ml' }) // fail\n```\n\nJest 还有另一个断言匹配器 `toEqual`。`toEqual` 比 `toBe`\
  \ 更复杂。对于我们的用途，它允许我们断言两个对象是相同的，即使它们不是完全同一个对象：\n\n```\nconst a = { espresso: '60ml'\
  \ };\nexpect(a).toEqual({ espresso: '60ml' }) // pass\n```\n\n我们将在本章中同时使用 `toBe`\
  \ 和 `toEqual`。我们倾向于使用 `toBe` 进行布尔值和数值断言，而将 `toEqual` 用于其他所有情况。我们也可以对所有内容都使用 `toEqual`。但在某些情况下我们会使用\
  \ `toBe`，因为我们喜欢它在英语中的读感。这取决于个人喜好。重要的是你理解这两者之间的区别。\n\n在 Jest 中，像许多其他测试框架一样，我们将代码组织在\
  \ `describe` 块和 `it` 块中。为了熟悉这种组织方式，让我们写下第一个 Jasmine 测试。将 `Modash.test.js` 的内容替换为以下内容：\n\
  \n```\ndescribe('My test suite', () => {\n  it('`true` should be `true`', () =>\
  \ {\n    expect(true).toBe(true);\n  });\n\n  it('`false` should be `false`', ()\
  \ => {\n    expect(false).toBe(false);\n  });\n});\n```\n\n`testing/basics/complete/Modash.test-3.js`\n\
  \n`describe` 和 `it` 都接受一个字符串和一个函数。字符串只是一个易于人类阅读的描述，稍后我们将看到它打印在控制台上。\n\n正如我们在整个本章中将看到的，`describe`\
  \ 用于组织所有属于同一个功能或上下文的断言。`it` 块是我们的独立的断言或规范（specs）。\n\nJest 要求你始终有一个顶层 `describe`\
  \ 来封装你所有的代码。在这里，我们的顶层 `describe` 标题是“My test suite”。嵌套在这个 `describe` 内部的两个 `it`\
  \ 块是我们的规范。这种组织方式是标准的：`describe` 块不包含断言，而 `it` 块包含。\n\n### 尝试一下\n\n在 `package.json`\
  \ 中，我们已经定义了一个 `test` 脚本。所以我们可以运行以下命令来执行我们的测试套件：\n\n```\n$ npm test\n```\n\n![Both\
  \ tests passing](img/testing----jest-1.png)\n\n两个测试均通过\n\n### `Modash` 的第一个 Jest\
  \ 测试\n\n让我们用一些测试 `Modash` 的有用内容来替换这个测试套件。\n\n再次打开 `Modash.test.js` 并清空它。在顶部，导入库：\n\
  \n```\nimport Modash from './Modash';\n```\n\n`testing/basics/complete/Modash.test-4.js`\n\
  \n我们将 `describe` 块命名为 `'Modash'`：\n\n```\ndescribe('Modash', () => {\n  // assertions\
  \ will go here\n});\n```\n\n将顶层 `describe` 命名为当前正在测试的模块是种惯例。\n\n让我们编写第一个断言。我们正在断言\
  \ `truncate()` 可以正常工作的：\n\n```\ndescribe('Modash', () => {\n  it('`truncate()`:\
  \ truncates a string', () => {\n    const string = 'there was one catch, and that\
  \ was CATCH-22';\n    expect(\n      Modash.truncate(string, 19)\n    ).toEqual('there\
  \ was one catch...');\n  });\n});\n```\n\n`testing/basics/complete/Modash.test-4.js`\n\
  \n我们以不同的方式组织了断言，但逻辑和最终结果与之前相同。注意 `expect` 和 `toEqual` 如何提供了一种人类可读的格式来表达我们正在测试的内容以及我们期望它如何表现。\n\
  \n### 尝试一下\n\n保存 `Modash.test.js`。运行单个规范测试套件：\n\n```\n$ npm test\n```\n\n![Test\
  \ passing](img/testing----jest-modash-1.png)\n\n测试通过\n\n### 另一个 `truncate()` 规范\n\
  \n我们为 `truncate()` 有了第二个断言。我们断言如果字符串低于指定长度，`truncate()` 将返回相同的字符串。\n\n由于这两个断言对应于\
  \ Modash 上的同一个方法，将它们一起封装在自己的 `describe` 内部是有意义的。让我们添加下一个规范，将我们的两个规范封装在一个新的 `describe`\
  \ 内部：\n\n```\ndescribe('Modash', () => {\n  describe('`truncate()`', () => {\n \
  \   const string = 'there was one catch, and that was CATCH-22';\n\n    it('truncates\
  \ a string', () => {\n      expect(\n        Modash.truncate(string, 19)\n     \
  \ ).toEqual('there was one catch...');\n    });\n\n    it('no-ops if <= length',\
  \ () => {\n      expect(\n        Modash.truncate(string, string.length)\n     \
  \ ).toEqual(string);\n    });\n  });\n});\n```\n\n`testing/basics/complete/Modash.test-5.js`\n\
  \n使用像这样的 `describe` 块分组测试是种惯例。\n\n注意我们在 `truncate()` `describe` 块的顶部声明了被测试的变量 `string`：\n\
  \n```javascript\ndescribe('Modash', () => {\n  describe('`truncate()`', () => {\n\
  \    const string = 'there was one catch, and that was CATCH-22';\n```\n\n`testing/basics/complete/Modash.test-5.js`\n\
  \n当以这种方式在 `describe` 声明变量时，它们在每个 `it` 块中都是作用的。\n\n此外，我们稍微更改了每个规范的标题。我们能够去掉开头的 `truncate():`。因为这些规范位于标题为\
  \ `'truncate()'` 的 `describe` 块下，如果其中一个规范失败，Jest 将这样呈现失败：\n\n```\n- Modash > `truncate()`\
  \ > no-ops if less than length\n```\n\n这为我们提供了所需的所有上下文。\n\n### 其余规范\n\n我们将另外两个方法的规范封装在它们自己的\
  \ `describe` 块中，如下所示：\n\n```javascript\ndescribe('Modash', () => {\n  describe('`truncate()`',\
  \ () => {\n    // ... `truncate()` specs\n  });\n  describe('`capitalize()', ()\
  \ => {\n    // ... capitalize() specs\n  });\n  describe('`camelCase()', () => {\n\
  \    // ... camelCase() specs\n  });\n});\n```\n\n首先，是 `capitalize()` 规范：\n\n```javascript\n\
  describe('capitalize()', () => {\n    it('capitalizes first letter, lowercases rest',\
  \ () => {\n      const string = 'there was one catch, and that was CATCH-22';\n\
  \      expect(\n        Modash.capitalize(string)\n      ).toEqual(\n        'There\
  \ was one catch, and that was catch-22'\n      );\n    });\n  });\n```\n\n`testing/basics/complete/Modash.test-6.js`\n\
  \n注意 `truncate()` `describe` 块内部的 `string` 在范围内，因此我们在此规范的顶部声明了 `string`。\n\n最后，是\
  \ `camelCase()` 规范组：\n\n```javascript\ndescribe('camelCase()', () => {\n    it('camelizes\
  \ string with spaces', () => {\n      const string = 'customer responded at';\n\
  \      expect(\n        Modash.camelCase(string)\n      ).toEqual('customerResdedAt');\n\
  \    });\n\n    it('camelizes string with underscores', () => {\n      const string\
  \ = 'customer_responded_at';\n      expect(\n        Modash.camelCase(string)\n\
  \      ).toEqual('customerResdedAt');\n    });\n  });\n```\n\n`testing/basics/complete/Modash.test-6.js`\n\
  \n### 尝试一下\n\n保存 `Modash.test.js`。从命令行启动 Jest：\n\n```\n$ npm test\n```\n\n你会看到一切通过了：\n\
  \n![Tests passing](img/testing----jest-modash-2.png)\n\n测试通过\n\n\n\n有几种方法运行端到端测试。一种流行的方法是使用像\
  \ `Selenium` 这样的驱动程序在浏览器中通过程序加载应用，并自动导航应用的界面。你可能会让程序点击按钮或填写表单，并断言这些交互后页面的状态。或者，你也可以对服务器端数据存储的最终状态进行断言。\n\
  \n集成测试是大型软件系统全面测试套件的重要组成部分。然而，在本书中，我们将专注于对我们的 React 应用进行**单元测试**。\n\n在单元测试中，软件系统的模块是在**孤立**状态下进行测试的。\n\
  \n对于 React 组件，我们将进行两种断言：\n\n1.  给定一组输入（state 和 props），断言组件应该输出（渲染）的内容。\n2.  给定一个用户操作，断言组件的行为。组件可能会更新状态，或者调用由父组件传递给它的\
  \ prop 函数。\n\n## 浅渲染 (Shallow rendering)\n\n在浏览器中渲染时，我们的 React 组件会被写入 DOM。虽然我们通常在浏览器中视觉上看到\
  \ DOM，但我们可以在测试套件中加载一个“无头”（headless）DOM。我们可以使用 DOM 的 API 来写入和读取 React 组件，就像我们直接操作浏览器一样。但这里还有另一种替代方案：**浅渲染**。\n\
  \n通常，当 React 组件渲染时，它首先产生其虚拟 DOM 表示。这个虚拟 DOM 表示然后被用于对实际 DOM 进行更新。\n\n当组件进行浅渲染时，它并不会写入\
  \ DOM。相反，它维持自己的虚拟 DOM 表示。然后，你可以对这个虚拟 DOM 进行断言，就像对实际 DOM 进行 DOM 一样。\n\n此外，你的组件只渲染深一层（因此被称为“浅”）。所以，如果你的组件的渲染函数包含子元素，这些子元素将不会被实际渲染。相反，虚拟\
  \ DOM 表示将仅包含指向未渲染的子组件的引用。\n\nReact 提供了一个用于浅渲染 React 组件的库 `react-test-renderer`。这个库很有用，但层级较低且可能比较繁琐。\n\
  \n**Enzyme** 是一个封装了 `react-test-renderer` 的库，提供了许多对编写 React 组件测试非常有用的方便功能。\n\n##\
  \ Enzyme\n\nEnzyme 最初由 Airbnb 开发，并在 React 开源社区中获得了广泛采用。事实上，Facebook 在其 `react-test-renderer`\
  \ 的文档中推荐了该工具。遵循这一趋势，在整个章节中，我们将使用 Enzyme 而不是 `react-test-renderer`。\n\nEnzyme 通过\
  \ `react-test-renderer` 允许你对组件进行浅渲染。你不是使用 `ReactDOM.render()` 将组件渲染到真实的 DOM，而是使用\
  \ Enzyme 的 `shallow()` 对其进行浅渲染：\n\n```javascript\nconst wrapper = Enzyme.shallow(\n\
  \  <App />\n);\n```\n\n正如我们很快将看到的，`shallow()` 返回一个 `EnzymeWrapper` 对象。在这个对象的内部是我们在虚拟\
  \ DOM 表示形式下的浅渲染的组件。`EnzymeWrapper` 为我们提供了一系列非常有用的方法，用于遍历并对组件的虚拟 DOM 执行断言。\n\n浅渲染有两个主要优势：\n\
  \n### 它在孤立状态下测试组件\n\n这对于单元测试是更优的。当我们为父组件编写测试时，不需要担心对子组件的依赖。对子组件所做的更改可能会破坏子组件的单元测试，但不会破坏任何父组件的单元测试。\n\
  \n### 它更快\n\n另一个好处是，你的测试将运行得更快。向实际 DOM 渲染、操作它以及从中读取内容会增加开销。通过浅渲染，你完全避免了 DOM。\n\n\
  正如我们所看到的，Enzyme 有一个 API 可以为浅渲染的组件模拟 DOM 事件。这允许我们（例如）在不存在 DOM 的情况下也“点击”组件。\n\n##\
  \ 使用 Enzyme 测试基础 React 组件\n\n我们将通过为一个基础 React 组件编写测试来熟悉 Enzyme。\n\n### Setup\n\n\
  在 `testing/react-basics` 文件夹内部有一个使用 `create-react-app` 创建的应用。从 `testing/basics`\
  \ 文件夹，`cd` 进入该目录：\n\n```bash\n$ cd ../react-basics\n```\n\n并安装包：\n\n```bash\n$ npm\
  \ i\n```\n\n查看目录：\n\n```bash\n$ ls\npublic\nnode_modules/\npackage.json\nsrc/\n\
  ```\n\n以及 `src/` ：\n\n```bash\n$ ls src/\nApp.css\nApp.js\nApp.test.js\ncomplete\n\
  index.css\nindex.js\nsemantic-ui\nsetupTests.js\ntempPolyfills.js\n```\n\n这个 `create-react-app`\
  \ 应用的基本组织结构与我们在上一章看到的相同。`App.js` 定义了一个 `App` 组件。`index.js` 调用了 `ReactDOM.render()`。包含了\
  \ Semantic UI 用于样式。\n\n### `App` 组件\n\n在查看 `App` 之前，让我们先在浏览器中看看它。启动应用：\n\n```bash\n\
  $ npm start\n```\n\n该应用非常简单。有一个字段和一个按钮关联，可以向列表添加项目。列表中没有删除项目的方法：\n\n![已完成的列表应用](img/testing----react-basics-app-complete.png)\n\
  \n打开 `App.js`。正如我们在 `state` 初始化中看到的，`App` 有两个状态属性：\n\n```javascript\nclass App extends\
  \ React.Component {\n  state = {\n    items: [],\n    item: '',\n  };\n```\ntesting/react-basics/src/App.js\n\
  \n`items` 是项目列表。`item` 是与我们的受控输入绑定的状态属性，我们稍后会看到它。\n\n在 `render()` 内部，`App` 遍历 `this.state.items`\
  \ 以渲染表格中的所有项：\n\n```javascript\n <tbody>\n            {\n              this.state.items.map((item,\
  \ idx) => (\n                <tr\n                  key={idx}\n                >\n\
  \                  <td>{item}</td>\n                </tr>\n              ))\n  \
  \          }\n          </tbody>\n```\ntesting/react-basics/src/App.js\n\n受控输入是标准的。它位于\
  \ `form` 内部：\n\n```javascript\n <form\n                  className='ui form'\n \
  \                 onSubmit={this.addItem}\n                >\n                <div\
  \ className='field'>\n                  <input\n                    className='prompt'\n\
  \                    type='text'\n                    placeholder='Add item...'\n\
  \                    value={this.state.item}\n                    onChange={this.onItemChange}\n\
  \                  />\n                </div>\n              </form>\n```\ntesting/react-basics/src/App.js\n\
  \n对于 `input`，`onItemChange()` 按预期设置状态中的 `item`：\n\n```javascript\n onItemChange\
  \ = (e) => {\n    this.setState({\n      item: e.target.value,\n    });\n  };\n\
  ```\ntesting/react-basics/src/App.js\n\n对于 `form`，`onSubmit` 调用 `addItem()`。该函数将新项目添加到状态并清空\
  \ `item`：\n\n```javascript\n addItem = (e) => {\n    e.preventDefault();\n\n   \
  \ this.setState({\n      items: this.state.items.concat(\n        this.state.item\n\
  \      ),\n      item: '',\n    });\n  };\n```\ntesting/react-basics/src/App.js\n\
  \n最后是按钮：\n\n```javascript\n <button\n                  className='ui button'\n \
  \                 type='submit'\n                  disabled={submitDisabled}\n \
  \               >\n                  Add item\n                </button>\n```\n\
  testing/react-basics/src/App.js\n\n我们在按钮上设置了 `disabled` 属性。这个变量 (`submitDisabled`)\
  \ 定义在 `render` 顶部，取决于输入字段是否填充：\n\n```javascript\n render() {\n    const submitDisabled\
  \ = !this.state.item;\n    return(\n```\ntesting/react-basics/src/App.js\n\n###\
  \ `App` 的第一个测试\n\n为了编写我们的第一个测试，我们需要两个库：Jest 和 Enzyme。\n\n在上一章中，我们注意到 `create-react-app`\
  \ 在 `package.json` 中设置了几个命令。其中之一就是 `test`。\n\n`react-scripts` 已经将 Jest 指定为依赖项。为了启动\
  \ Jest，我们只需要运行 `npm test`。就像 `create-react-app` 为我们创建的其他命令一样，`test` 会运行 `react-scripts`\
  \ 中的脚本。该脚本配置并执行 Jest。\n\ncreate-react-app 在 `App.test.js` 中为我们设置了一个测试。让我们在 `testing/react-basics`\
  \ 内部执行 Jest 看看会发生什么：\n\n\n\n\n\n```bash\n$ npm test\n```\n\n`Jest` 正在运行，并对测试套件的结果输出一个格式良好的报告：\n\
  \n![示例测试运行](img/testing----sample-app-test-run.png)\n\n示例测试运行\n\n`react-scripts`\
  \ 为 Jest 提供了一些额外的配置。其中一种配置是`在监听模式下启动 Jest`。在这种模式下，Jest 在测试套件完成后不会退出。相反，它会监控整个项目的变化。当检测到更改时，它会重新运行测试套件。\n\
  \n## 设置 Enzyme\n\n为了使用 Enzyme，我们需要：\n\n1. 确保安装了所有必要的包\n2. 包含针对 Enzyme 的指令，指示使用哪种\
  \ React 适配器\n3. 包含适用于 React 16 的补丁\n\n我们将逐一深入研究这些内容。\n\n### 1. 确保安装了所有必要的包\n\n`react-scripts`\
  \ 不包含 `enzyme`。因此，我们将其包含在自己的 `package.json` 中。\n\n`enzyme` 封装了 `react-test-renderer`。因此，它也依赖该包的安装。你也会在\
  \ `package.json` 中看到该依赖项。\n\n此外，我们需要包含一个 Enzyme 使用的 `adapter`。Enzyme 为每个版本的 React\
  \ 都提供了适配器。由于我们正在使用 React 16，我们在 `package.json` 中包含了 React 16 适配器 `enzyme-adapter-react-16`。\n\
  \n### 2. 包含针对 Enzyme 的指令指示使用哪种 React 适配器\n\n在运行测试套件之前，我们需要指示 Enzyme 使用 React 16\
  \ 适配器。指令如下：\n\n```javascript\nimport Enzyme from 'enzyme';\nimport Adapter from\
  \ 'enzyme-adapter-react-16';\n\nEnzyme.configure({ adapter: new Adapter() });\n\
  ```\n\n我们可以将此片段包含在每个 spec 文件（规格文件）顶部，但如果我们为更多组件添加更多 spec 文件，就会很快变得冗余。\n\n相反，我们可以在\
  \ `src/` 目录下创建一个名为 `setupTests.js` 的文件。Create React App 配置了 Jest，使得该文件会在每次测试套件运行之前自动加载。\n\
  \n查看 `src/`，可以看到该文件已经存在了：\n\n```javascript\nimport raf from './tempPolyfills'\n\n\
  import Enzyme from 'enzyme';\nimport Adapter from 'enzyme-adapter-react-16';\n\n\
  Enzyme.configure({ adapter: new Adapter() });\n```\n\ntesting/react-basics/src/setupTests.js\n\
  \n该文件包含了指示 Enzyme 使用 React 16 适配器的片段。但导入 `tempPolyfills.js` 的那行是为了什么？\n\n### 3.\
  \ 包含适用于 React 16 的补丁\n\nReact 16 的底层架构依赖于名为 `requestAnimationFrame` 的浏览器 API。这位于现代浏览器的\
  \ JavaScript 环境中。\n\n在我们的测试环境中运行 React 时，此浏览器 API 将不存在。结果是，React 将抛出一个错误。\n\n在编写时，React\
  \ 16 刚刚发布。[目前有一个正在进行的讨论](https://github.com/facebookincubator/create-react-app/issues/3199)\
  \ 关于如何在测试环境中处理此缺失的 API。较版本的 Create React App 可能会自动处理这种情况。\n\n在此期间，我们包含了一个变通方案。查看\
  \ `tempPolyfills.js`，可以看到我们定义了一个假的 `requestAnimationFrame` API：\n\n```javascript\n\
  const raf = global.requestAnimationFrame = (cb) => {\n  setTimeout(cb, 0);\n};\n\
  \nexport default raf;\n```\n\ntesting/react-basics/src/tempPolyfills.js\n\n对于 `requestAnimationFrame`\
  \ 的这种回退或 `polyfill`（垫片）足够 React 在测试环境中按预期运行。\n\n## 编写 spec\n\n设置 Enzyme 后，我们准备好将\
  \ `App.test.js` 中的 spec 替换为更有用的内容。\n\n打开 `App.test.js` 并清空该文件。在文件顶部，我们首先导入正在测试的\
  \ React 组件：\n\n```javascript\nimport App from './App';\n```\n\ntesting/react-basics/src/complete/App.test.complete-1.js\n\
  \n接下来，我们将从 `react` 导入 `React` 并从 `enzyme` 导入 `shallow()`：\n\n```javascript\nimport\
  \ React from 'react';\nimport { shallow } from 'enzyme';\n```\n\ntesting/react-basics/src/complete/App.test.complete-1.js\n\
  \n`shallow()` 是我们从 Enzyme 中使用的唯一函数，因此我们在导入中显式指定了它。正如你可能猜到的，`shallow()` 是我们用来进行浅渲染（shallow\
  \ render）组件的函数。\n\n我们将根据被测试的模块来命名 `describe`：\n\n```javascript\ndescribe('App',\
  \ () => {\n  // 断言将放在这里\n});\n```\n\n让我们写第一个 spec。我们将断言我们的表格应该渲染一个标题为“Items”的表头：\n\
  \n```javascript\ndescribe('App', () => {\n  it('should have the `th` \"Items\"',\
  \ () => {\n    // 我们的断言将在这里\n  });\n\n  // 剩余的断言将放在这里\n});\n```\n\n为了编写此断言，我们需要：\n\
  \n* 浅渲染组件\n* 遍历虚拟 DOM，选取第一个 `th` 元素\n* 断言该元素包含值为“Items”的文本值\n\n我们首先对组件进行浅渲染：\n\n\
  ```javascript\n it('should have the `th` \"Items\"', () => {\n    const wrapper\
  \ = shallow(\n      <App />\n    );\n```\n\ntesting/react-basics/src/complete/App.test.complete-1.js\n\
  \n正如之前提到的，`shallow()` 函数返回的是 Enzyme 称为“wrapper”的对象，`ShallowWrapper`。这里没有真实的 DOM。相反，组件保留在它的虚拟\
  \ DOM 表示中。\n\nEnzyme 为我们提供的 wrapper 对象具有许多有用的方法，我们可以使用它们来编写断言。通常，这些辅助方法帮助我们在虚拟 DOM\
  \ 中遍历并选择元素。\n\n看看这在实践中是如何工作的。一个辅助方法是 `contains()`。我们将用它来断言表头的存在：\n\n```javascript\n\
  \ it('should have the `th` \"Items\"', () => {\n    const wrapper = shallow(\n \
  \     <App />\n    );\n    expect(\n      wrapper.contains(<th>Items</th>)\n   \
  \ ).toBe(true);\n  });\n```\n\ntesting/react-basics/src/complete/App.test.complete-1.js\n\
  \n`contains()` 接受一个 HTML 元素的 `ReactElement`。它返回一个布尔值，指示渲染组件是否包含。\n\n## 测试\n\n写完第一个\
  \ spec 后，让我们验证一切是否正常。保存 `App.test.js` 并从控制台运行测试：\n\n```bash\n$ npm test\n```\n\n\
  ![Enzyme 测试通过](img/testing----react-basics-1.png)\n\nEnzyme 测试通过\n\n让我们编写更多断言，在此过程中探索\
  \ Enzyme 的 API。\n\n### 针对 `App` 的更多断言\n\n接下来，让我们断言组件包含一个 `button` 元素，即显示“Add item”的按钮。我们可能认为可以这样做：\n\
  \n```javascript\nwrapper.contains(<button>Add Item</button>)\n```\n\n但是，`contains()`\
  \ 会匹配元素的*所有属性*。我们在 `render()` 内部的 `button` 看起来如下：\n\n```javascript\n <button\n \
  \                 className='ui button'\n                  type='submit'\n     \
  \             disabled={submitDisabled}\n                >\n                  Add\
  \ item\n                </button>\n```\n\ntesting/react-basics/src/App.js\n\n我们需要向\
  \ `contains()` 传递具有精确属性集的 `ReactElement`。但通常这是过度的。对于这个 spec，只需断言按钮在页面上足够了。\n\n我们可以使用\
  \ Enzyme 的 `containsMatchingElement()` 方法。这将检查组件输出中是否有任何内容**看起来像**预期元素。我们不需要逐属性匹配。\n\
  \n使用 `containsMatchingElement()`，让我们断言渲染的组件也包含一个 `button` 元素。将此 spec 写在最后一个：\n\n\
  ```javascript\n it('should have a `button` element', () => {\n    const wrapper\
  \ = shallow(\n      <App />\n    );\n    expect(\n      wrapper.containsMatchingElement(\n\
  \        <button>Add item</button>\n      )\n    ).toBe(true);\n  });\n```\n\ntesting/react-basics/src/complete/App.test.complete-2.js\n\
  \n\n\n\n\n`containsMatchingElement()` 允许我们编写一个更“宽松”的规范，使其更接近我们想要的断言：即页面上有一个按钮。它没有将我们的规范绑定到像\
  \ `className` 这样的样式属性。虽然 `onClick` 和 `disabled` 属性很重要，但我们稍后会编写涵盖这些属性的规范。\n\n让我们用\
  \ `containsMatchingElement()` 编写另一个断言。我们还将断言 `input` 字段也存在：\n\n```\n it('should\
  \ have an `input` element', () => {\n    const wrapper = shallow(\n      <App />\n\
  \    );\n    expect(\n      wrapper.containsMatchingElement(\n        <input />\n\
  \      )\n    ).toBe(true);\n  });\n```\n\n`testing/react-basics/src/complete/App.test.complete-2.js`\n\
  \n到目前为止，我们的规范断言了在初始渲染后组件输出中存在某些关键元素。正如我们很快将看到的，我们正在为其余规范奠定基础。随后的规范将断言在我们对组件进行更改后发生的情况，例如填充输入内容或点击按钮。这些基础规范断言了我们将要交互的元素从一开始就存在于页面上。\n\
  \n在初始状态下，我们应该做出另一个重要的断言：页面上的按钮是禁用状态的。只有当输入框中有文本时，按钮才应该是启用的。\n\n我们实际上可以修改之前的规范来包含这个特定属性，如下：\n\
  \n```\nexpect(\n  wrapper.containsMatchingElement(\n    <button disabled={true}>\n\
  \      Add item\n    </button>\n  )\n).toBe(true);\n```\n\n此规范将包含两个断言：(1) `button`\
  \ 存在且 (2) 它是禁用的。\n\n这是一种完全有效的方法。然而，我们倾向于将这两个断言分成两个不同的规范。当你限制给定规范中断言的范围时，测试失败会更具表现力。如果这个双重断言规范失败了，将很难看出原因。是按钮丢失了？还是按钮没有禁用？\n\
  \n我们目前为止的三个规范都断言了元素存在于组件的输出中。这个规范则不同。我们将首先“找到”组件，然后对其 `disabled` 属性进行断言。让我们来看一下，然后进行拆解：\n\
  \n```\n it('`button` should be disabled', () => {\n    const wrapper = shallow(\n\
  \      <App />\n    );\n    const button = wrapper.find('button').first();\n   \
  \ expect(\n      button.props().disabled\n    ).toBe(true);\n  });\n```\n\n`testing/react-basics/src/complete/App.test.complete-2.js`\n\
  \n`find()` 是另一个 `EnzymeWrapper` 方法。它期望的参数是一个 `Enzyme selector`。在这种情况下，选择器是一个 CSS\
  \ 选择器 `'button'`。CSS 选择器只是支持的 Enzyme 选择器类型之一。在在本章中我们只会使用 CSS 选择器，但 Enzyme 选择器也可以直接引用\
  \ React 组件。有关关于 Enzyme 选择器的更多信息，请参阅 [Enzyme 文档](http://airbnb.io/enzyme/docs/api/selector.html)。\n\
  \n`find()` 返回另一个 Enzyme `ShallowWrapper`。该对象包含所有匹配元素的列表。该对象的行为有点像数组，具有类似 `length`\
  \ 的方法。该对象有一个 `first()` 方法，我们在此使用它来返回第一个匹配元素。`first()` 返回另一个引用 `button` 元素的 `ShallowWrapper`\
  \ 对象。\n\n当你从浅渲染的组件中找到并选择各种元素时，所有这些元素都将 Enzyme `ShallowWrapper` 对象。这意味着无论你是在处理浅渲染的\
  \ React 组件还是一个 `div` 标签，都可以预期可以使用相同的 API 方法。\n\n要读取按钮上的 `disabled` 属性，我们使用 `props()`。`props()`\
  \ 返回一个对象，指定了 HTML 元素上的属性或在 React 组件上设置的 props。\n\n### 使用 `beforeEach`\n\n此时，我们的测试套件包含一些重复代码。我们在每个断言之前都对组件进行浅渲染。这非常适合进行重构。\n\
  \n我们*可以* 直接在 `describe` 块的顶部对组件进行浅渲染：\n\n```\ndescribe('the \"App\" component',\
  \ () => {\n  const wrapper = shallow(\n    <App />\n  );\n  // specs here ...\n\
  })\n```\n\n由于 JavaScript 的作用域规则，`wrapper` 将我们的每个 `it` 块内部可用。\n\n但这种方法可能会产生问题。例如，如果我们的某一个规范修改了组件怎么办？我们可能会更改组件的状态或模拟一个事件。这将`导致状态在规范之间泄露`。在下一个规范的开始时，我们组件的状态将是不可预测的。\n\
  \n相反，最好在每个规范之间重新渲染组件，以确保每个规范都在可预测的、全新的状态下工作工作。\n\n在所有流行的 JavaScript 测试框架中，我们都可以使用一个函数来辅助测试设置：`beforeEach`。`beforeEach`\
  \ 是一个代码块，它将在`在每个 `it` 块之前运行`。我们可以使用此函数在每个规范之前渲染我们的组件。\n\n在编写测试时，你通常需要执行一些设置，以使你的环境进入正确的语文中以进行断言。除了像上面那样对组件进行浅渲染外，我们还将编写需要更丰富上下文的测试。通过在\
  \ `beforeEach` 内部设置上下文，你确保了每个规范将获得一组全新的上下文。\n\n在编写测试时，我们力求保持 `it` 块尽可能简洁。我们将依赖 `beforeEach`\
  \ 来建立上下文。现在现在从每个断言中移除渲染操作。让我们使用 `beforeEach` 来渲染组件：\n\n```\ndescribe('App', () =>\
  \ {\n  let wrapper;\n\n  beforeEach(() => {\n    wrapper = shallow(\n      <App\
  \ />\n    );\n  });\n```\n\n`testing/react-basics/src/complete/App.test.complete-3.js`\n\
  \n我们必须在 `describe` 块的顶部使用 `let` 声明 `wrapper`。这是因为如果在 `beforeEach` 块中这样声明 `wrapper`：\n\
  \n```\n// ...\nbeforeEach(() => {\n  const wrapper = shallow(\n    <App />\n  );\n\
  })\n// ...\n```\n\n`wrapper` 将不在我们的规范的作用域内。通过在 `describe` 块顶部声明 `wrapper`，我们确保了它对所有的断言都是可用的。\n\
  \n现在我们可以安全地从每个断言中移除 `wrapper` 的声明：\n\n```\n it('should have the `th` \"Items\"',\
  \ () => {\n    expect(\n      wrapper.contains(<th>Items</th>)\n    ).toBe(true);\n\
  \  });\n\n  it('should have a `button` element', () => {\n    expect(\n      wrapper.containsMatchingElement(\n\
  \        <button>Add item</button>\n      )\n    ).toBe(true);\n  });\n\n  it('should\
  \ have an `input` element', () => {\n    expect(\n      wrapper.containsMatchingElement(\n\
  \        <input />\n      )\n    ).toBe(true);\n  });\n\n  it('`button` should be\
  \ disabled', () => {\n    const button = wrapper.find('button').first();\n    expect(\n\
  \      button.props().disabled\n    ).toBe(true);\n  });\n```\n\n`testing/react-basics/src/complete/App.test.complete-3.js`\n\
  \n好多了。我们的 `it` 块不再设置上下文，并且删除了冗余代码。\n\n### 尝试一下\n\n保存 `App.test.js`。运行测试套件：\n\n```\n\
  $ npm test\n```\n\n所有四个测试均通过：\n\n![所有四个测试通过](img/testing-react-basics-2.png)\n\n\
  所有四个测试通过\n\n虽然这些规范有限，但它们为我们的下一组规范奠定了基础。通过像现在这样断言初始渲染中存在某些元素，我们是在断言用户在应用加载时会在页面上看到什么。我们断言有一个表头、一个输入框和一个按钮。我们还断言按钮应该是禁用的。\n\
  \n\n\n\n在本章的剩余部分中，我们将使用`行为驱动`（behavior-driven）风格来驱动测试套件的开发。在这种风格下，我们将使用 `beforeEach`\
  \ 来设置某些上下文。我们将模拟与组件的交互，就像我们是一个在界面上导航的用户一样。然后，我们将对组件应该的行为编写断言。\n\n加载应用后，我们设想用户会执行的第一件事是填写输入。当输入填写后，他们将点击“添加项目”（Add\
  \ item）按钮。我们随后期望新项目会出现在状态中并显示页面上。\n\n我们将逐步执行这些行为，在每次用户交互后对组件编写断言。\n\n### 模拟变化\n\n\
  用户与我们的应用可以进行的首次交互是填写用于添加新项的输入字段。除了对组件进行浅渲染（shallow rendering）之外，我们还希望在下一组测试用例之前模拟这种行为。\n\
  \n虽然我们可以在 `it` 块中执行这些设置，但正如我们之前提到的，尽可能在 `beforeEach` 块中执行大部分设置会更好。这不仅有助于我们组织代码，这种做法还让多个依赖于相同设置的测试用例变得容易实现。\n\
  \n然而，对于我们其他四个现有的测试用例，不需要这个特定的设置。我们应该在当前的 `describe` 块内部声明另一个 `describe` 块。`describe`\
  \ 块是我们“分组”所有需要相同上下文的测试用例的方式：\n\n```javascript\ndescribe('App', () => {\n  // ...\
  \ 我们目前为止写的断言\n\n  describe('用户填充了输入', () => {\n    beforeEach(() => {\n      //\
  \ ... 设置上下文\n    })\n\n    // ... 断言\n  });\n});\n```\n\n我们为内部 `describe` 编写的 `beforeEach`\
  \ 将在外部上下文声明的 `beforeEach` *之后*运行。因此，当这个 `beforeEach` 运行时，`wrapper` 已经完成了浅渲染。正如预期的，这个\
  \ `beforeEach` 只会在我们内部 `describe` 块中的 `it` 块中运行。\n\n以下是用于下一组测试用例的带有 `beforeEach`\
  \ 设置的内部 `describe` 结构：\n\n```javascript\n describe('用户填充了输入', () => {\n    const\
  \ item = 'Vancouver';\n\n    beforeEach(() => {\n      const input = wrapper.find('input').first();\n\
  \      input.simulate('change', {\n        target: { value: item }\n      })\n \
  \   });\n```\n\n`testing/react-basics/src/complete/App.test.complete-4.js`\n\n我们首先在\
  \ `describe` 顶部声明 `item`。正如我们很快看到的，这将允许我们能够在测试用例中引用该变量。\n\n`beforeEach` 首先使用 `EnzymeWrapper`\
  \ 上的 `find()` 方法来获取输入。记得 `find()` 返回另一个 `EnzymeWrapper` 对象，在这种情况下，它是包含单个项目（即我们的输入）的列表。我们调用\
  \ `first()` 来获取与输入元素对应的 `EnzymeWrapper` 对象。\n\n然后我们在输入上使用 `simulate()`。`simulate()`\
  \ 是我们模拟组件用户交互的方法。该方法接受两个参数：\n\n1.  要模拟的事件（如 `'change'` 或 `'click'`）。这决定了要使用哪个事件处理程序（如\
  \ `onChange` 或 `onClick`）。\n2.  事件对象（可选）。\n\n在这里，我们为输入指定了一个 `'change'` 事件。然后我们传入了所需的事件对象。注意，这个事件对象的形式与\
  \ React 传递给 `onChange` 处理程序的事件对象完全相同。这里是 `App` 上的 `onItemChange` 方法再次出现，它期望一个这种形状的对象：\n\
  \n```javascript\n onItemChange = (e) => {\n    this.setState({\n      item: e.target.value,\n\
  \    });\n  };\n```\n\n`testing/react-basics/src/App.js`\n\n编写完这些设置后，我们现在可以编写与用户刚刚填充输入字段的上下文相关的测试用例。我们将编写两个：\n\
  \n1.  状态属性 `item` 已更新以匹配输入字段\n2.  按钮不再被禁用（disabled）\n\n以下是 `describe` 的完整结构：\n\n\
  ```javascript\n describe('用户填充了输入', () => {\n    const item = 'Vancouver';\n\n \
  \   beforeEach(() => {\n      const input = wrapper.find('input').first();\n   \
  \   input.simulate('change', {\n        target: { value: item }\n      })\n    });\n\
  \n    it('应该更新状态属性 `item`', () => {\n      expect(\n        wrapper.state().item\n\
  \      ).toEqual(item);\n    });\n\n    it('应该启用 `button`', () => {\n      const\
  \ button = wrapper.find('button').first();\n      expect(\n        button.props().disabled\n\
  \      ).toBe(false);\n    });\n  });\n```\n\n`testing/react-basics/src/complete/App.test.complete-4.js`\n\
  \n在第一个测试用例中，我们使用 `wrapper.state()` 来获取状态对象。注意它是一个函数而不是属性。记得 `wrapper` 是一个 `EnzymeWrapper`，所以我们没有直接与组件交互。我们使用\
  \ `state()` 方法从组件中检索 `state` 属性。\n\n在第二个测试用例中，我们再次使用 `props()` 读取按钮上的 `disabled`\
  \ 属性。\n\n继续我们的行为驱动方法，我们现在设想组件处于以下状态：\n\n![组件的想象状态](img/testing----react-basics-3.png)\n\
  \n组件的想象状态\n\n用户已经填充了输入。从这里开始用户可以采取两种操作，我们可以编写测试用例：\n\n1.  用户清除输入字段\n2.  用户点击“添加项目”按钮\n\
  \n### 清空输入字段\n\n当用户清除输入字段时，我们期望按钮再次变为禁用。通过在当前的 `describe` 块内部嵌套一个新的 `describe` 来构建现有上下文：\n\
  \n```javascript\ndescribe('App', () => {\n  // ... 初始状态\n\n  describe('用户填充了输入',\
  \ () => {\n    // ... 填充断言\n\n    describe('然后清除了输入', () => {\n      // ... 断言按钮已禁用\n\
  \    });\n  });\n});\n```\n\n我们将使用 `beforeEach` 再次模拟变化，这次将 `value` 设置为空字符串。我们将编写一个断言：按钮再次被禁用。\n\
  \n记得在“用户填充了输入”下方组合这个 `describe` 块。我们的“用户清除了输入” `describe` 块完整如下：\n\n```javascript\n\
  \ it('应该启用 `button`', () => {\n      const button = wrapper.find('button').first();\n\
  \      expect(\n        button.props().disabled\n      ).toBe(false);\n    });\n\
  \n    describe('然后清除了输入', () => {\n      beforeEach(() => {\n        const input\
  \ = wrapper.find('input').first();\n        input.simulate('change', {\n       \
  \   target: { value: '' }\n        })\n      });\n\n      it('应该禁用 `button`', ()\
  \ => {\n        const button = wrapper.find('button').first();\n        expect(\n\
  \          button.props().disabled\n        ).toBe(true);\n      });\n    });\n\
  \  });\n});\n```\n\n`testing/react-basics/src/complete/App.test.complete-5.js`\n\
  \n注意我们是如何在现有上下文的基础上深入应用的工作流的。我们已经进入了三层。应用已经渲染，用户填充了输入字段，然后用户清除了输入字段。\n\n现在是验证我们所有测试均通过的时机。\n\
  \n### 尝试一下\n\n保存 `App.test.js`。运行测试套件：\n\n```bash\n$ npm test\n```\n\n我们看到全部通过了：\n\
  \n![](img/testing----react-basics-4.png)\n\n接下来，我们将模拟用户提交表单。这将导致应用的一些变化，我们将为这些变化编写断言。\n\
  \n### 模拟表单提交\n\n在用户提交表单后，我们期望应用看起来如下：\n\n![](img/testing----react-basics-5.png)\n\
  \n我们将断言：\n\n1.  新项目在状态中 (`items`)\n2.  新项目在渲染的表格内\n3.  输入字段是空的\n4.  “添加项目”按钮被禁用\n\
  \n为了到达这个上下文，我们将基于用户填充输入之前的上下文进行构建。因此，我们将新的 `describe` 写在“用户填充了输入”内部，作为“然后清除了输入”的并级节点。\n\
  \n\n\n```javascript\ndescribe('App', () => {\n  // ... initial state assertions\n\
  \n  describe('the user populates the input', () => {\n    // ... populated field\
  \ assertions\n\n    describe('and then clears the input', () => {\n      // ...\
  \ assert the button is disabled again\n\n    });\n\n    describe('and then submits\
  \ the form', () => {\n      // ... upcoming assertions\n    });\n  });\n});\n```\n\
  \n我们的 `beforeEach` 将模拟表单提交。记住，`addItem` 期望一个拥有 `preventDefault()` 方法的对象：\n\n```javascript\n\
  \ addItem = (e) => {\n    e.preventDefault();\n\n    this.setState({\n      items:\
  \ this.state.items.concat(\n        this.state.item\n      ),\n      item: '',\n\
  \    });\n  };\n```\n\n`testing/react-basics/src/App.js`\n\n我们将模拟一个 `submit` 类型的事件，并传入一个符合\
  \ `addItem` 预期形状的对象。我们可以直接将 `preventDefault` 设置为一个空函数：\n\n```javascript\n describe('and\
  \ then submits the form', () => {\n      beforeEach(() => {\n        const form\
  \ = wrapper.find('form').first();\n        form.simulate('submit', {\n         \
  \ preventDefault: () => {},\n        });\n      });\n```\n\n`testing/react-basics/src/complete/App.test.complete-6.js`\n\
  \n在完成设置后，我们首先断言新项目在状态中：\n\n```javascript\n it('should add the item to state', ()\
  \ => {\n        expect(\n          wrapper.state().items\n        ).toContain(item);\n\
  \      });\n```\n\n`testing/react-basics/src/complete/App.test.complete-6.js`\n\n\
  Jest 带有了一些用于处理数组的特殊匹配器（matchers）。我们使用匹配器 `toContain()` 来断言数组 `items` 包含了 `item`。\n\
  \n接下来，让我们断言项目在表格内部。有几种方法可以实现，这里是其中一种：\n\n```javascript\n it('should render the item\
  \ in the table', () => {\n        expect(\n          wrapper.containsMatchingElement(\n\
  \            <td>{item}</td>\n          )\n        ).toBe(true);\n      });\n```\n\
  \n`testing/react-basics/src/complete/App.test.complete-6.js`\n\n接下来，我们将断言输入字段已被清除。我们可以选择检查状态属性\
  \ `item`，也可以检查虚拟 DOM 中的实际输入字段。我们将选择后者，因为它更全面：\n\n```javascript\n it('should clear\
  \ the input field', () => {\n        const input = wrapper.find('input').first();\n\
  \        expect(\n          input.props().value\n        ).toEqual('');\n      });\n\
  ```\n\n`testing/react-basics/src/complete/App.test.complete-6.js`\n\n最后，我们将断言按钮再次被禁用了：\n\
  \n```javascript\n it('should disable `button`, () => {\n        const button = wrapper.find('button').first();\n\
  \        expect(\n          button.props().disabled\n        ).toBe(true);\n   \
  \   });\n```\n\n`testing/react-basics/src/complete/App.test.complete-6.js`\n\n完整的“and\
  \ then submits the form” `describe` 块：\n\n```javascript\n it('should disable `button`,\
  \ () => {\n        const button = wrapper.find('button').first();\n        expect(\n\
  \          button.props().disabled\n        ).toBe(true);\n      });\n    });\n\n\
  \    describe('and then submits the form', () => {\n      beforeEach(() => {\n \
  \       const form = wrapper.find('form').first();\n        form.simulate('submit',\
  \ {\n          preventDefault: () => {},\n        });\n      });\n\n      it('should\
  \ add the item to state', () => {\n        expect(\n          wrapper.state().items\n\
  \        ).toContain(item);\n      });\n\n      it('should render the item in the\
  \ table', () => {\n        expect(\n          wrapper.containsMatchingElement(\n\
  \            <td>{item}</td>\n          )\n        ).toBe(true);\n      });\n\n\
  \      it('should clear the input field', () => {\n        const input = wrapper.find('input').first();\n\
  \        expect(\n          input.props().value\n        ).toEqual('');\n      });\n\
  \n      it('should disable `button`, () => {\n        const button = wrapper.find('button').first();\n\
  \        expect(\n          button.props().disabled\n        ).toBe(true);\n   \
  \   });\n    });\n  });\n});\n```\n\n`testing/react-basics/src/complete/App.test.complete-6.js`\n\
  \n看起来我们还有另一种可能的重构方法。在整个测试套中，我们有很多这样的声明：\n\n```javascript\nconst input = wrapper.find('input').first();\n\
  const button = wrapper.find('button').first();\n```\n\n你可能会想，是否可以将这些变量声明在测试套的作用域顶部，与\
  \ `wrapper` 并列。然后我们可以在最顶层的 `beforeEach` 中设置它们，如下所示：\n\n```javascript\n// 有效重构？\n\
  describe('App', () => {\n  let wrapper;\n  let input;\n  let button;\n\n  beforeEach(()\
  \ => {\n    wrapper = shallow(\n      <App />\n    );\n    const input = wrapper.find('input').first();\n\
  \    const button = wrapper.find('button').first();\n  });\n  // ...\n});\n```\n\
  \n\n\n如果你启动了该应用，请将其关闭。进入 `client/` 目录。在本章中，我们将完全在该目录中工作：\n\n```\n$ cd client\n```\n\
  \n对于此应用，我们没有将测试文件与 `src` 下的组件放在一起，而是将它们放在了一个专门的文件夹 `tests` 中。在 `tests` 文件夹内部，你会发现我们应用中的其他组件已经存在了测试：\n\
  \n```\n$ ls tests/\n  App.test.js\n  SelectedFoods.test.js\n  complete/\n```\n\n\
  在我们完成对 `FoodSearch` 的测试编写后，你可以随时查阅其他测试。所有其他测试都复用了我们测试 `FoodSearch` 时使用的相同概念。\n\n\
  在为组件编写测试之前，让我们先了解 `FoodSearch` 的工作原理。如果你愿意，可以打开 `FoodSearch` 组件并跟随学习（`src/FoodSearch.js`）。\n\
  \n## `FoodSearch`\n\n`FoodSearch` 组件有一个搜索框。当用户输入时，搜索框下方会更新一个匹配的食品表格：\n\n![FoodSearch\
  \ 组件](img/testing----food-search-component.png)\n\n### `FoodSearch` 组件\n\n当搜索框发生变化时，`FoodSearch`\
  \ 组件会向应用的 API 服务器发送请求。如果用户输入了字符串 `truffle`，向服务器发送的请求如下：\n\n```\nGET localhost:3001/api/food?q=truffle\n\
  ```\n\nAPI 服务器随后返回一个匹配食品项数组：\n\n```\n[\n  {\n    \"description\": \"Pate  truffle\
  \ flavor\",\n    \"kcal\": 327,\n    \"fat_g\": 27.12,\n    \"protein_g\": 11.2,\n\
  \    \"carbohydrate_g\": 6.3\n  },\n  {\n    \"description\": \"Candies, truffles,\
  \ prepared-from-recipe\",\n    \"kcal\": 510,\n    \"fat_g\": 32.14,\n    \"protein_g\"\
  : 6.21,\n    \"carbohydrate_g\": 44.88\n  },\n  {\n    \"description\": \"Candies,\
  \ m  m mars 3 musketeers truffle crisp\",\n    \"kcal\": 538,\n    \"fat_g\": 25.86,\n\
  \    \"protein_g\": 6.41,\n    \"carbohydrate_g\": 63.15\n  }\n]\n```\n\n`FoodSearch`\
  \ 用这些项目填充其表格。\n\n`FoodSearch` 有三个状态（state）：\n\n#### `foods`\n\n这是一个包含服务器返回的所有食品的数组。默认为空数组。\n\
  \n#### `showRemoveIcon`\n\n当用户开始在搜索框中输入时，该字段旁边会出现一个 X：\n\n![删除图标](img/testing----food-search-x.png)\n\
  \n### 删除图标\n\n这个 X 提供了一种清除搜索框的快速方法。当字段为空时，`showRemoveIcon` 应该为 `false`。当字段有内容时，`showRemoveIcon`\
  \ 应该为 `true`。\n\n#### `searchValue`\n\n`searchValue` 是绑定到受控输入框——搜索框的状态。\n\n## 探索\
  \ `FoodSearch`\n\n在掌握了 `FoodSearch` 的行为以及它保留的状态后，让我们来探索实际代码。我们在这里包含代码片段，但你可以随时通过打开\
  \ `src/FoodSearch.js` 来跟随学习。\n\n组件的顶部是导入语句：\n\n```\nimport React from 'react';\n\
  import Client from './Client';\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\
  \n我们还有一个常量，用于定义在页面上显示的搜索结果的最大数量。我们在组件内部使用它：\n\n```\nconst MATCHING_ITEM_LIMIT =\
  \ 25;\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\n然后我们定义该组件。\n\n针对我们的三个状态进行\
  \ `state` 初始化如下：\n\n```\nclass FoodSearch extends React.Component {\n  state = {\n\
  \    foods: [],\n    showRemoveIcon: false,\n    searchValue: '',\n  };\n```\n\n\
  food-lookup-complete/client/src/FoodSearch.js\n\n让我们逐步查看组件渲染方法中的交互元素，以及每个元素的处理函数。\n\
  \n### `input` 搜索框\n\n位于 `FoodSearch` 顶部的输入字段驱动了搜索功能。当用户修改输入字段时，表格主体会随着搜索结果进行更新。\n\
  \n输入元素：\n\n```\n <input\n                      className='prompt'\n            \
  \          type='text'\n                      placeholder='Search foods...'\n  \
  \                    value={this.state.searchValue}\n                      onChange={this.onSearchChange}\n\
  \                    />\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\n\
  `className` 是为了 SemanticUI 的样式化设置。`value` 将此受控输入绑定到 `this.state.searchValue`。\n\n\
  `onSearchChange()` 接收一个事件对象。让我们逐步查看代码。这是函数的半部分：\n\n```\n onSearchChange = (e) =>\
  \ {\n    const value = e.target.value;\n\n    this.setState({\n      searchValue:\
  \ value,\n    });\n\n    if (value === '') {\n      this.setState({\n        foods:\
  \ [],\n        showRemoveIcon: false,\n      });\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\
  \n我们从事件对象中获取 `value`。然后我们按照受控输入的模式在状态中设置 `searchValue`。如果 `value` 为空，我们将 `foods`\
  \ 设置为空数组（清除搜索结果），并将 `showRemoveIcon` 设置为 `false`（隐藏“X”）。如果 `value` 不为空，我们需要：\n\n\
  *   确保 `showRemoveIcon` 设置为 `true`\n*   使用最新的搜索值调用服务器以获取匹配的食品列表\n\n这是部分代码：\n\n```\n\
  \ } else {\n      this.setState({\n        showRemoveIcon: true,\n      });\n\n\
  \      Client.search(value, (foods) => {\n        this.setState({\n          foods:\
  \ foods.slice(0, MATCHING_ITEM_LIMIT),\n```}\n\nfood-lookup-complete/client/src/FoodSearch.js\n\
  \n`Client` 底层使用 Fetch API，即我们在第 3 章中使用的网络请求。`Client.search()` 向服务器发送网络请求，然后带有匹配食品数组的回调函数。\n\
  \n然后我们将状态中的 `foods` 设置为返回的食品，并截断此列表使其处于 `MATCHING_ITEM_LIMIT`（即 `25`）的范围内。\n\n完整的\
  \ `onSearchChange()` 如下：\n\n```\n onSearchChange = (e) => {\n    const value = e.target.value;\n\
  \n    this.setState({\n      searchValue: value,\n    });\n\n    if (value === '')\
  \ {\n      this.setState({\n        foods: [],\n        showRemoveIcon: false,\n\
  \      });\n    } else {\n      this.setState({\n        showRemoveIcon: true,\n\
  \      });\n\n      Client.search(value, (foods) => {\n        this.setState({\n\
  \          foods: foods.slice(0, MATCHING_ITEM_LIMIT),\n        });\n      });\n\
  \    }\n  };\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\n### 删除图标\n\
  \n正如我们看到的，删除图标是当字段有内容时出现在搜索框旁边的小 X。点击这个 X 应该清除搜索框。\n\n我们内联处理是否显示删除图标的逻辑。图标元素具有 `onClick`\
  \ 属性：\n\n```\n this.state.showRemoveIcon ? (\n                      <i\n       \
  \                 className='remove icon'\n                        onClick={this.onRemoveIconClick}\n\
  \                      />\n                    ) : ''\n                  }\n```\n\
  \nfood-lookup-complete/client/src/FoodSearch.js\n\n`onRemoveIconClick()` 的代码：\n\n\
  ```\n onRemoveIconClick = () => {\n    this.setState({\n      foods: [],\n     \
  \ showRemoveIcon: false,\n      searchValue: '',\n    });\n  };\n```\n\nfood-lookup-complete/client/src/FoodSearch.js\n\
  \n我们重置所有内容，包括 `foods`。\n\n### `props.onFoodClick`\n\n最后的交互部分是在每个食品项上。当用户点击食品项时，我们将其添加到界面上的已选食品列表中：\n\
  \n\n\n\n\n```\n <<tbody>\n          {\n            this.state.foods.map((food, idx)\
  \ => (\n              <tr\n                key={idx}\n                onClick={()\
  \ => this.props.onFoodClick(food)}\n              >\n                <td>{food.description}</td>\n\
  \                <td className='right aligned'>\n                  {food.kcal}\n\
  \                </td>\n                <td className='right aligned'>\n       \
  \           {food.protein_g}\n                </td>\n                <td className='right\
  \ aligned'>\n                  {food.fat_g}\n                </td>\n           \
  \     <td className='right aligned'>\n                  {food.carbohydrate_g}\n\
  \                </td>\n              </tr>\n            ))\n          }\n     \
  \     </</tbody>\n```\n\n`food-lookup-complete/client/src/FoodSearch.js`\n\n###\
  \ `FoodSearch` 概览\n\n在底层，当用户点击食物项时，我们调用了 `this.props.onFoodClick()`。`FoodSearch`\
  \ 的父组件（`App`）定义了这个属性函数。它期望接收完整的食物对象。\n\n正如我们将要看到的，为了给 `FoodSearch` 编写单元测试，我们不需要知道属性函数\
  \ `onFoodClick()` 实际上*执行了什么*。我们只关心它*想要*什么（一个完整的食物对象）。\n\n浅渲染（Shallow rendering）有助于我们实现这种理想的隔离。虽然这个应用较小，但对于拥有大型代码库的大型团队来说这种隔离的好处是巨大的。\n\
  \n### 编写 `FoodSearch.test.js`\n\n我们准备好为 `FoodSearch` 组件编写单元测试了。\n\n`client/src/tests/FoodSearch.test.js`\
  \ 文件包含了测试套件的骨架。顶部是 `import` 语句：\n\n```\nimport { shallow } from 'enzyme';\nimport\
  \ React from 'react';\nimport FoodSearch from '../FoodSearch';\n```\n\n`food-lookup-complete/client/src/tests/FoodSearch.test.js`\n\
  \n接下来是测试套件的骨架。不要被它吓到，我们将一个一个填充这些 `describe` 和 `beforeEach` 块：\n\n```\ndescribe('FoodSearch',\
  \ () => {\n  // ... 初始状态规范\n\n  describe('user populates search field', () => {\n\
  \    beforeEach(() => {\n      // ... 模拟用户在输入框输入 \"brocc\"\n    });\n\n    // ...\
  \ 规范\n\n    describe('and API returns results', () => {\n      beforeEach(() =>\
  \ {\n        // ... 模拟 API 返回结果\n      });\n\n      // ... 规范\n\n      describe('then\
  \ user clicks food item', () => {\n        beforeEach(() => {\n          // ...\
  \ 模拟用户点击食物项\n        });\n\n        // ... 规范\n      });\n\n      describe('then\
  \ user types more', () => {\n        beforeEach(() => {\n          // ... 模拟用户输入\
  \ \"x\"\n        });\n\n        describe('and API returns no results', () => {\n\
  \          beforeEach(() => {\n            // ... 模拟 API 未返回结果\n          });\n\n\
  \          // ... 规范\n        });\n      });\n    });\n  });\n});\n```\n\n`food-lookup-complete/client/src/tests/FoodSearch.test.js`\n\
  \n上一节节，我们将通过使用 `beforeEach` 执行设置来建立不同的上下文。我们的每个上下文将包含在 `describe` 内部。\n\n#### 在初始状态下\n\
  \n我们的第一系列规范将涉及处于初始状态的组件。我们的 `beforeEach` 将简单地浅渲染组件。然后，我们将对此初始状态编写断言：\n\n```\ndescribe('FoodSearch',\
  \ () => {\n  let wrapper;\n\n  beforeEach(() => {\n    wrapper = shallow(\n    \
  \  <FoodSearch />\n    );\n  });\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-1.js`\n\
  \n与我们在上一节的第一轮组件测试一样，我们在上作用域声明了 `wrapper`。在 `beforeEach` 中，我们使用 Enzyme 的 `shallow()`\
  \ 对组件进行浅渲染。\n\n让我们写两个断言：\n\n1. 删除图标不在 DOM 中\n2. 表格中没有任何条目\n\n对于我们的第一个测试，有多种方法可以编写。这里是其中一种：\n\
  \n```\n it('should not display the remove icon', () => {\n    expect(\n      wrapper.find('.remove.icon').length\n\
  \    ).toBe(0);\n  });\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-1.js`\n\
  \n我们向 wrapper 的 `find()` 方法传递了一个选择器。如果你还记得，删除图标具有以下 `className` 属性：\n\n```\n <i\n\
  \                        className='remove icon'\n                        onClick={this.onRemoveIconClick}\n\
  \                      />\n```\n\n`food-lookup-complete/client/src/FoodSearch.js`\n\
  \n所以，我们在这里根据它的类选择它。`find()` 返回一个 `ShallowWrapper` 对象。该对象类似于数组，包含了所有匹配指定选择器的项的列表。就像数组一样，它有\
  \ `length` 属性，我们断言它应该是 `0`。\n\n我们也可以使用包含方法之一，如下所示：\n\n```\nit('should not display\
  \ the remove icon', () => {\n  expect(\n    wrapper.containsAnyMatchingElements(\n\
  \      <i className='remove icon' />\n    )\n  ).toBe(false);\n});\n```\n\n在本章的剩余部分，我们将主要通过\
  \ `find()` 来驱动测试，因为我们喜欢使用 `find()`。\n\n接下来，我们将断言 `tbody` 没有输出任何 `tr` 元素。对于这个规范，我们可以直接断言：\n\
  \n```\n it('should display zero rows', () => {\n    expect(wrapper.find('tbody tr').length).toEqual(0);\n\
  \  });\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-1.js`\n\
  \n如果我们现在运行此测试，我们的两个规范都会通过。然而，这并不能带给我们足够的保证确保我们的规范是正确组合的。稍后当我们断言元素存在时将解决这个问题。\n\n\
  #### 用户在搜索框中输入了值\n\n在我们的行为驱动方法的指导下，我们的下一步是模拟用户交互。然后，我们将根据这个로新层级的上下文编写断言。\n\n在 `FoodSearch`\
  \ 组件加载后，用户可以进行的唯一交互只有一种：在搜索框中输入一个值。当这种情况发生时，有两种可能：\n\n1. 搜索匹配到数据库中的食物，API 返回这些食物的列表\n\
  2. 搜索没有匹配到数据库中的食物，API 返回空数组\n\n这个分支发生在 `onSearchChange()` 的底部，当我们调用 `Client.search()`\
  \ 时：\n\n```\n Client.search(value, (foods) => {\n        this.setState({\n     \
  \     foods: foods.slice(0, MATCHING_ITEM_LIMIT),\n        });\n      });\n```\n\
  \n`food-lookup-complete/client/src/FoodSearch.js`\n\n对于我们的应用，每次按下按键都会查询 API。因此，情况\
  \ 2（无结果）几乎总是发生在情况 1 之后。\n\n\n\n\n\n# 第一组规范关注搜索字段\n\n在编写完这些规范后，我们将看到如何为返回结果的 API\
  \ 建立上下文。\n\n我们首先在 `beforeEach` 内部模拟用户交互。我们将在 `describe` 顶部声明 `value`，以便在随后的测试中引用它：\n\
  \n```\n describe('user populates search field', () => {\n    const value = 'brocc';\n\
  \n    beforeEach(() => {\n      const input = wrapper.find('input').first();\n \
  \     input.simulate('change', {\n        target: { value: value },\n      });\n\
  \    });\n```\n\nfood-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-2.js\n\
  \n接下来，我们断言状态中的 `searchValue` 已更新并以匹配此新值：\n\n```\n it('should update state property\
  \ `searchValue``, () => {\n      expect(\n        wrapper.state().searchValue\n\
  \      ).toEqual(value);\n    });\n```\n\nfood-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-2.js\n\
  \n接下来，我们断言 DOM 上是否存在删除图标：\n\n```\n it('should display the remove icon', () => {\n\
  \      expect(\n        wrapper.find('.remove.icon').length\n      ).toBe(1);\n\
  \    });\n```\n\nfood-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-2.js\n\
  \n我们使用了与之前断言删除图标不存在 DOM 时相同的选择器。这很重要，因为它确保了我们之前的断言是有效的，而不是仅仅使用了错误的选择器。\n\n我们对“用户填充搜索字段”的断言已经就绪。在继续之前，让我们保存并确保测试套件通过。\n\
  \n### 尝试一下\n\n保存 `FoodSearch.test.js`。在控制台中执行：\n\n```\n# inside client/\n$ npm test\n\
  ```\n\n所有测试都应该通过：\n\n![Tests pass](img/testing----food-lookup-console-1.png)\n\n\
  测试通过\n\n从这里开始，下一层上下文将是返回结果的 API。\n\n如果我们正在编写集成测试，将采取两种方法之一。如果我们想要进行完整的端到端测试，我们将让\
  \ `Client.search()` 对 API 发起实际调用。否则，我们可以使用 Node 库来“伪造”HTTP 请求。有很多库可以拦截 JavaScript\
  \ 尝试发起 HTTP 请求。你可以为这些库提供一个伪响应对象并传递给调用者。\n\n然而，由于我们正在编写单元测试，我们想要消除对 API 和 `Client.search()`\
  \ 实现细节的任何依赖。我们专门测试 `FoodSearch` 组件，它是应用程序中的一个单一单元。我们只关心 `FoodSearch` 如何使用 `Client.search()`，而不关心更深层次的内容。\n\
  \n因此，我们想在表面拦截对 `Client.search()` 的调用。我们不希望 `Client` 完全参与。相反，我们想断言调用 `Client.search()`\
  \ 时使用了正确的参数（搜索字段的值）。然后我们想用自己的结果集调用传递给 `Client.search()` 的回调。\n\n我们想要做的是 mock `Client`\
  \ 库。\n\n### 使用 Jest 进行 Mock\n\n在编写单元测试时，我们经常发现正在测试的模块依赖于应用程序中的其他模块。处理这种情况有多种策略，但它们大多都围绕着**测试双体（test\
  \ double）**的概念展开。测试双体是一个“替代”真实对象的伪对象。\n\n例如，我们可以为测试编写一个 `Client` 库的伪造版本。最简单的版本看起来像这样：\n\
  \n```\nconst Client = {\n  search: () => {},\n};\n```\n\n为了测试，我们可以将这个伪造的 `Client`\
  \ 而不是真实的注入到 `FoodSearch` 中。`FoodSearch` 可以在任何需要的地方调用 `Client.search()`，它将调用一个空函数而不是执行\
  \ HTTP 请求。\n\n我们可以更进一步，注入一个始终返回特定结果的伪造 `Client`。这将证明更有用，因为我们能够根据 `Client` 的行为断言\
  \ `FoodSearch` 状态如何更新：\n\n```\nconst Client = {\n  search: (_, cb) => {\n    const\
  \ result = [\n      {\n        description: 'Hummus',\n        kcal: '166',\n  \
  \      protein_g: '8',\n        fat_g: '10',\n        carbohydrate_g: '14',\n  \
  \    },\n    ];\n    cb(result);\n  },\n};\n```\n\n这个测试双体实现了一个 `search()` 方法，它会立即调用作为第二个参数传递的回调。它使用一个包含单个食品对象的硬编码数组调用回调。\n\
  \n但测试双体的实现细节并不重要。重要的是这个测试双体正在模拟每次都返回相同的单条目结果集。通过将这个伪造客户端插入应用程序中，我们可以轻松地对 `FoodSearch`\
  \ 如何处理此“响应”编写断言：表格中现在有一个条目，该条目的描述是“Hummus”等等。\n\n如果我们的测试双体允许我们动态指定使用什么 `result`\
  \ 将会更好。这样我们就不需要定义完全不同的双体来测试当 API 不返回任何结果时发生的情况。此外，上述简单的测试双体并不关心。\n\n### Mock `Client`\n\
  \n让我们使用 `jest.mock()` 来 mock `Client`。通过 mock 函数的特殊属性，我们随后能够编写断言 `search()` 是否使用正确的参数调用。\n\
  \n在 `FoodSearch.test.js` 顶部，`FoodSearch` 导入语句下方，导入 `Client`，因为我们稍将在测试套件中引用它。此外，我们告诉\
  \ Jest 我们想 mock 它：\n\n```\nimport FoodSearch from '../FoodSearch';\nimport Client\
  \ from '../Client';\n\njest.mock('../Client');\n\ndescribe('FoodSearch', () => {\n\
  ```\n\nfood-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-3.js\n\
  \n\n现在，让我们考虑会发生什么。在我们的 `beforeEach` 块中，当我们模拟更改时：\n\n```\n beforeEach(() => {\n \
  \     const input = wrapper.find('input').first();\n      input.simulate('change',\
  \ {\n        target: { value: value },\n      });\n    });\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-3.js`\n\
  \n这将触发 `onSearchChange()` 底部的 `Client.search()` 调用：\n\n```\n Client.search(value,\
  \ (foods) => {\n        this.setState({\n          foods: foods.slice(0, MATCHING_ITEM_LIMIT),\n\
  \        });\n      });\n```\n\n`food-lookup-complete/client/src/FoodSearch.js`\n\
  \n只不过，它并没有在真实的 `Client` 上调用该方法，而是正在 Jest 注入的 mock（模拟）对象上调用。`Client.search()` 是一个\
  \ mock 函数，除了记录自己被调用之外，**什么都没做**。\n\n让我们在“should display the remove icon”下方定义一个新的测试用例（spec）。在编写断言之前，让我们先向控制台打印一些内容，看看发生了什么：\n\
  \n```\n it('should display the remove icon', () => {\n      expect(\n        wrapper.find('.remove.icon').length\n\
  \      ).toBe(1);\n    });\n\n    it('...todo...', () => {\n      const firstInvocation\
  \ = Client.search.mock.calls[0];\n      console.log('First invocation:');\n    \
  \  console.log(firstInvocation);\n      console.log('All invocations: ');\n    \
  \  console.log(Client.search.mock.calls);\n    });\n\n    describe('and API returns\
  \ results', () => {\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-3.js`\n\
  \n我们读取了 mock 函数上的 `mock.calls` 属性。calls 数组中的每个条对应于 mock 函数 `Client.search()` 的一次调用。\n\
  \n如果你保存了 `FoodSearch.test.js` 并运行测试套件，你将能够在控制台中看到日志语句：\n\n![测试运行中的日志语句](img/testing----food-lookup-console-2.png)\n\
  \n测试运行中的日志语句\n\n提取出第一个：\n\n```\nFirst invocation:\n[ 'brocc', [Function] ]\n```\n\
  \nmock 捕获了发生在 `beforeEach` 块中的调用。调用的第一个参数是我们的预期的，`'brocc'`。第二个参数是我们的回调函数。重要的是，**该回调函数尚未被调用**。`search()`\
  \ 捕获了该函数，但没有对其进行任何操作。\n\n如果你用 `console.log()` 语句包围 `Client.search()` 的调用，如下所示：\n\
  \n```\n// “包围” `Client.search()` 的示例\nconsole.log('Before `search()`');\nClient.search(value,\
  \ (foods) => {\n  console.log('Inside the callback');\n  this.setState({\n    foods:\
  \ foods.slice(0, MATCHING_ITEM_LIMIT),\n  });\n});\nconsole.log('After `search()`');\n\
  ```\n\n在运行测试套件时，你会在控制台中看到此输出：\n\n```\nBefore `search()`\nAfter `search()`\n```\n\
  \nmock 函数 `search()` 被调用了，但它所做的只是捕获参数。打印“Inside the callback”的行尚未被调用。\n\n因此，“First\
  \ invocation”的控制台输出是合逻辑的。然而，查看“All invocations”的控制台输出：\n\n```\nAll invocations:\n\
  [ [ 'brocc', [Function] ],\n[ 'brocc', [Function] ],\n[ 'brocc', [Function] ] ]\n\
  ```\n\n重新格式化该数组：\n\n```\n[\n  [ 'brocc', [Function] ],\n  [ 'brocc', [Function]\
  \ ],\n  [ 'brocc', [Function] ]\n]\n```\n\n我们总共看到了*三次*调用。这是为什么呢？\n\n我们有三个 `it` 块，它们对应于我们模拟更改的\
  \ `beforeEach`。记住，`beforeEach` 在每个相关的 `it` 之前运行一次。因此，**我们模拟搜索的 `beforeEach` 被执行了三次**。这意味着\
  \ mock 函数 `Client.search()` 也被调用了三次。\n\n虽然这看起来合理，但并不是我们想要的。状态**在测试用例之间泄漏了**。我们希望每个\
  \ `it` 都能接收到一个全新的 `Client` mock 版本。\n\nJest mock 函数有一个方法可以做到这一点，即 `mockClear()`。我们将在每个测试用例执行后，使用\
  \ `beforeEach` 的对立方法 `afterEach` 来调用此方法。这将确保 mock 在每个测试用例运行之前处于纯洁状态。我们将在顶层 `describe`\
  \ 内部、在浅渲染组件的 `beforeEach` 下方执行此：\n\n```\ndescribe('FoodSearch', () => {\n  let wrapper;\n\
  \n  beforeEach(() => {\n    wrapper = shallow(\n      <FoodSearch />\n    );\n \
  \ });\n\n  afterEach(() => {\n    Client.search.mockClear();\n  });\n\n  it('should\
  \ not display the remove icon', () => {\n```\n\n`food-lookup-complete/client/src/tests/complete/FoodSearch.test.complete-4.js`\n\
  \n现在，如果我们再次运行测试套件：\n\n```\nFirst invocation:\n[ 'brocc', [Function] ]\nAll invocations:\n\
  [ [ 'brocc', [Function] ] ]\n```\n\n我们成功地在测试运行之间重置了 mock。只记录了一次调用，即在上一个 `it` 执行之前的那个调用。\n\
  \n既然 mock 按照预期工作，让我们把我们的虚拟测试用例转换为真实的。我们将断言传递 `Client.search()` 的第一个参数是用户输入搜索框的值：\n\
