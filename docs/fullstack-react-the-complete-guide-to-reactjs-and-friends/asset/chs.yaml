  \n与我们之前某些应用的顶层组件相比，对比非常明显，不是吗？\n\n由于我们采用了新的容器组件与展示组件范式，并配合 Redux 状态管理器，这个应用的顶层组件仅负责指定页面上要包含哪些容器组件。读取和写入状态的所有责任已经下推到了每一个容器组件中。\n\
  \n因为我们没有直接从叶子组件（leaf components）派发 action，所以我们将所有关于 Redux store 的知识隔离在了容器组件中。我们可以自由地在应用的其他上下文中复用展示组件。此外，如果我们想将状态管理范式从\
  \ Redux 切换到其他工具，只需要修改容器组件即可。\n\n我们的容器组件看起来都非常相似。它们订阅 store，然后将状态和 actions 映射到展示组件的\
  \ props 上。在下一节中，我们将探索减少编写容器组件时某些繁琐工作的方法。\n\n但现在，让我们稍停一下，验证一切是否仍然如以前正常工作。\n\n###\
  \ 尝试一下\n\n保存 `App.js`。虽然我们对 React 组件进行了一些较大的架构更改，但在 `http://localhost:3000` 查看应用时，一切运行一如往初。\n\
  \n## 使用 `react-redux` 生成容器\n\n查看我们的两个容器组件（`ThreadTabs` 和 `ThreadDisplay`），它们具有相似的行为：\n\
  \n* 它们在 `componentDidMount` 中订阅 store。\n* 它们可能有一些逻辑，将状态中的数据处理成适合作为展示组件 props 的格式（例如\
  \ `ThreadTabs` 中的 `tabs`）。\n* 它们将展示组件上的 actions（如点击事件）映射到派发到 store 的函数。\n\n由于容器组件依赖展示组件来渲染标记，因此它们只包含了\
  \ store 和展示组件之间的“胶水”代码。\n\n一个流行的库 `react-redux` 在我们编写使用 Redux store 的 React 应用时为我们提供了一些便利。主要的便利之处是它的\
  \ `connect()` 函数。\n\n`react-redux` 中的 `connect()` 函数用于生成容器组件。对于每个展示组件，我们可以编写函数来指定状态如何映射到\
  \ props，以及事件如何映射到 dispatches。\n\n让我们看看这在实际运行中是种样的。\n\n### `Provider` 组件\n\n在可以使用\
  \ `connect()` 生成容器组件之前，我们需要对应用进行一些微小的改动。\n\n目前，我们的容器直接引用 `store` 变量。这之所以有效，是因为我们在与组件相同的文件中声明了这个变量。\n\
  \n为了让 `connect()` 能够生成容器组件，它需要一种标准的机制让容器组件访问 Redux store。该函数不能依赖 `store` 变量在同一个文件中被声明并可用。\n\
  \n为了解决这个问题，`react-redux` 库提供了一个特殊的 `Provider` 组件。你可以将顶层组件包裹在 `Provider` 中。`Provider`\
  \ 将通过 React 的 context 特性让所有组件访问到 store。\n\n当我们使用 `connect()` 生成容器组件时，这些容器组件将假设可以通过\
  \ context 获取 `store`。\n\n## 用 `Provider` 包裹 `App`\n\n在 `package.json` 内部，我们已经包含了\
  \ `react-redux` 库：\n\n```json\n\"react-redux\": \"5.0.4\",\n```\n\n要使用 `Provider`\
  \ 组件，我们首先在 `App.js` 顶部引入它：\n\n```javascript\nimport { Provider } from 'react-redux';\n\
  ```\n\n`redux/chat_intermediate/src/complete/App-15.js`\n\n为了允许我们的容器组件通过上下文访问 store，我们需要将\
  \ `App` 包裹在 `Provider` 中。在 `App.js` 的底部，我们将定义一个新的组件 `WrappedApp`。`WrappedApp` 返回被\
  \ `Provider` 包裹的 `App` 组件：\n\n```javascript\nconst WrappedApp = () => (\n  <Provider\
  \ store={store}>\n    <App />\n  </Provider>\n);\n\nexport default WrappedApp;\n\
  ```\n\n`redux/chat_intermediate/src/complete/App-15.js`\n\n`Provider` 期望接收 store。现在\
  \ store 在组件的任何地方可用。\n\n### 使用 `connect()` 生成 `ThreadTabs`\n\n`ThreadTabs` 组件将展示组件\
  \ `Tabs` 与我们的 Redux store 连接。它的做法是：\n\n* 在 `componentDidMount` 中订阅 store\n* 根据 store\
