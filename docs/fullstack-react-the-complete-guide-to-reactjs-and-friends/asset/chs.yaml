  `relay/bookstore/client/src/steps/BookPage.reads.js`\n\n#### 书籍页编辑\n\n现在让我们为书籍的数据添加一些基础编辑功能。我们希望能够点击标题或描述等任何字段并进行原地编辑。为了简单起见，让我们使用现有的内联编辑组件\
  \ [React Edit Inline Kit](https://github.com/kaivi/riek)。\n\nReact Edit Inline Kit（简称为\
  \ RIEK）有一个简单的 API。我们指定：\n\n1. 原始值\n2. 该值的属性名\n3. 当此值发生变化时执行的回调函数\n\n为了隔离我们正在操作的内容，让我们在不改变\
  \ Relay 中数据的情况下将 RIEK 集成到我们的应用中。第一步只是让内联表单工作，一旦获得更改，我们再处理如何这些更改。\n\n这是我们在 `BookPage`\
  \ 上带有 `RIEK` 的新 `render()` 函数：\n\n```\n43   render() {\n44     const { book } =\
  \ this.props;\n45     const authors = book.authors.edges.map(this.renderAuthor);\n\
  46     return (\n47       <div className='bookPage sixteen wide column'>\n48   \
  \      <div className='spacer row' />\n49 \n50         <div className='ui grid row'>\n\
  51           <div className='six wide column'>\n52             <FancyBook book={book}\
  \ />\n53           </div>\n54 \n55           <div className='ten wide column'>\n\
