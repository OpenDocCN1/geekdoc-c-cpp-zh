  \ `messagesReducer()`\n\n我们使用了 reducer 组合（reducer composition）的概念来拆分状态的管理。我们的顶层\
  \ `reducer()` 函数将两个顶层状态属性的管理委托给它们各自的 reducer。\n\n我们可以将这个概念推得更远。我们注意到 `threadsReducer()`\
  \ 负责管理线程和消息两个的状态。此外，我们看到了在两个 action 处理器之间共享代码的机会。\n\n我们可以让 `threadsReducer()` 将每个线程的\
  \ `messages` 属性的管理委托给另一个 reducer，`messagesReducer()`。完整来说，reducer 树将像这样所示：\n\n![](img/6-intermediate-redux----threads-messages-reducer-comp.png)\n\
  \n让我们先修改 `threadsReducer()`，预留这个新的 messages reducer 函数。我们希望 threads reducer 函数对消息的了解尽可能少。`threadsReducer()`\
  \ 将依赖 `messagesReducer()`，根据接收到的 action 决定给定线程的消息应该如何更新。\n\n#### 修改 `ADD_MESSAGE`\
