  \n虽然从表面上看行为没有变化，但我们知道底层的代码要洁得多。\n\n### 使用来自 redux 的 combineReducers()\n\n我们实现的这种组合不同\
  \ reducer 以管理状态树不同部分的模式是 Redux 中非常常见的。事实上，`redux` 库包含一个名为 `combineReducers()` 的函数，它可以生成一个与我们手动编写的类似的顶层\
  \ `reducer()` 函数。\n\n你可以向 `combineReducers()` 传递一个对象，指定它应该将状态对象的每个属性委托给哪个函数。为了查看它是如何工作的，让我们现在使用它。\n\
  \n首先，从 `redux` 库导入该函数：\n\n```javascript\nimport { createStore, combineReducers }\
