  \n`ThreadTabs` 现在正在发出我们的新操作（action）。让我们测试一切吧。\n\n### 尝试一下\n\n保存 `App.js`。在浏览器中打开\
  \ `http://localhost:3000`。此时，添加和删除消息的功能可以工作，我们可以在标签页之间切换。如果我们在其中一个线程中添加消息，它只会被添加到该线程：\n\
  \n![](img/6-intermediate-redux----app-v8.png)\n\n这看起来越来越像一个真实的聊天应用程序了！我们引入了线程（threads）的概念，现在支持一个可以在与多个用户的对话之间切换的界面。\n\
  \n然而，在这个过程中，我们显著地复杂了 reducer（还原器）函数。虽然将所有状态都在一个地方进行管理是件好事，但我们的每个 action 处理器都包含了大量的逻辑。此外，我们的\
  \ `ADD_MESSAGE` 和 `DELETE_MESSAGE` 处理器重复了许多相同的代码。\n\n同样，两个不同部分状态的管理——添加/删除消息和在线程之间切换——都在同一个地方进行管理，这很奇怪。随着应用程序复杂性的增加，使用单个\
  \ reducer 函数来管理整个状态的想法可能会让人感到力不从心，甚至有些可疑。\n\n事实上，Redux 应用程序有一套拆分状态管理逻辑的策略：**reducer\
  \ 组合（reducer composition）**。\n\n### 拆分 reducer 函数\n\n通过 reducer 组合，我们可以将应用程序的状态管理逻辑拆分为更小的函数。我们仍然会向\
  \ `createStore()` 传递一个 reducer 函数。但这个顶层函数将调用一个或多个其他函数。每个 reducer 函数将管理状态树的不同部分。\n\
  \n添加和删除消息与在线程之间切换是不同的功能。让我们先将这两者分开。\n\n#### 一个新的 `reducer()`\n\n我们仍然将顶层函数命名为 `reducer()`。但现在，我们有两个其他的\
  \ reducer 函数，每个负责管理状态顶层属性的一个部分。我们将根据子 reducer 管理的属性名称为这些每个子 reducer 命名：\n\n![](img/6-intermediate-redux----reducer-comp-1-diagram.png)\n\
  \n为了实现这一点，让我们先看看新的顶层 `reducer()` 函数应该什么样子的。然后我们就可以创建子 reducer 函数。\n\n为了避免混淆，让我们当前的\
  \ reducer 函数从 `reducer()` 重命名为为 threadsReducer()`：\n\n```javascript\nfunction threadsReducer(state,\
  \ action) {\n```\n\n`redux/chat_intermediate/src/complete/App-8.js`\n\n我们还需要调整这个函数，但我们稍后会回来。\n\
  \n现在，在 `threadsReducer()` 之上，我们将插入我们的*新*函数 `reducer()`：\n\n```javascript\nfunction\
  \ reducer(state, action) {\n  return {\n    activeThreadId: activeThreadIdReducer(state.activeThreadId,\
  \ action),\n    threads: threadsReducer(state.threads, action),\n  };\n}\n```\n\n\
  `redux/chat_intermediate/src/complete/App-8.js`\n\n这个函数很短，但包含的内容很多。\n\n我们正在返回一个带有\
  \ `activeThreadId` 和 `threads` 键的全新对象。重要的是，我们正在**将更新 `activeThreadId` 和 `threads`\
  \ 的责任委托给它们各自的 reducer**。\n\n再次查看这一行：\n\n```javascript\n activeThreadId: activeThreadIdReducer(state.activeThreadId,\
  \ action),\n```\n\n`redux/chat_intermediate/src/complete/App-8.js`\n\n对于下一个状态的 `activeThreadId`\
  \ 属性，我们将责任委托给尚未定义的函数 `activeThreadIdReducer()`。注意第一个参数不是整个状态——它只是该 reducer 负责的状态部分。我们将\
  \ action 作为第二个参数传入。\n\n对 `threads` 采用采用相同的策略：\n\n```javascript\n threads: threadsReducer(state.threads,\
  \ action),\n```\n\n`redux/chat_intermediate/src/complete/App-8.js`\n\n我们将状态的 `threads`\
  \ 属性的责任委托给 `threadsReducer()`。我们传递给这个 reducer 的状态（第一个参数）是 `threadsReducer()` 负责更新的状态部分。\n\
  \n这就是子 reducer 如何与顶层 reducer 协同工作。顶层 reducer 拆分状态树的每个部分，并将管理工作委托给它们。\n\n为了更好地理解，让我们在\
  \ `reducer()` 下编写 `activeThreadIdReducer()`：\n\n```javascript\nfunction activeThreadIdReducer(state,\
  \ action) {\n  if (action.type === 'OPEN_THREAD') {\n    return action.id;\n  }\
  \ else {\n    return state;\n  }\n}\n```\n\n`redux/chat_intermediate/src/complete/App-8.js`\n\
  \n这个 reducer 只处理一种类型的 action。以前，我们的逻辑必须考虑*整个*状态树。现在，它只需要关心这个属性。注意 `OPEN_THREAD`\
  \ 的逻辑是如何简化的。以前，我们需要考虑整个状态。现在，`activeThreadIdReducer()` 只需要返回要打开的线程的 id。\n\n####\
  \ 更新 `threadsReducer()`\n\n`threadsReducer()` 现在接收的是部分状态。它的 `state` 参数是线程数组。\n\n\
  结果是我们可以像处理 `activeThreadId()` 那样简化我们的返回。我们不再需要创建一个新状态，复制所有旧值，然后覆盖 `threads`。相反，我们可以直接返回线程数组。\n\
  \n此外，我们将之前所有引用 `state.threads` 的地方改为引用 `state`，因为现在它是线程数组。\n\n让我们先对 `ADD_MESSAGE`\
  \ 进行这些修改。\n\n我们引用 `state` 而不是 `state.threads`：\n\n```javascript\n const threadIndex\
