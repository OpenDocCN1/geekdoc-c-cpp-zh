  \n### 添加计时功能\n\n创建、更新和删除 (CRUD) 能力现在已经就绪。下一个挑战是：让这些计时器具有功能性。\n\n我们有多种不同的方法来实现计时系统。最简单的方法是让一个函数每秒更新一次计时器的\
  \ `elapsed` 属性。但这种方法限制很大。当应用程序关闭时会发生什么？计时器应该继续“运行”。\n\n\n\n\n\n这就是为什么我们包含了 `runningSince`\
  \ 属性。计时器初始化时，`elapsed` 等于 `0`。当用户点击“Start（开始）”时，我们不会增加 `elapsed`。相反，我们只是将 `runningSince`\
  \ 设置为开始时间。\n\n然后我们可以使用开始时间与当前时间的差来为用户渲染时间。当用户点击“Stop（停止）”时，开始时间与当前时间的差会被加到 `elapsed`\
  \ 中。`runningSince` 被设置为 `null`。\n\n因此，在任何给定时间，我们都可以通过 `Date.now() - runningSince`\
  \ 并将其加上总累计时间（`elapsed`）来得出计时器已运行多久。我们将在 `Timer` 组件内部进行计算。\n\n为了让应用程序真正感觉像一个正在运行的计时器，我们希望\
  \ React 能够执行此操作并重新渲染计时器。但 `elapsed` 和 `runningSince` *在计时器运行期间不会改变*。因此，我们到为止看到的触发\
  \ `render()` 调用的唯一机制是不够的。\n\n相反，我们可以使用 React 的 `forceUpdate()` 方法。这会强制 React 组件重新渲染。我们可以在间隔器中调用它，以产生实时计时器的平滑外观。\n\
  \n### 在 `Timer` 中添加 `forceUpdate()` 间隔器\n\n`helpers.renderElapsedString()` 接受一个可选的第二个参数\
  \ `runningSince`。它会将 `Date.now() - runningSince` 的差值加到 `elapsed` 中，并使用函数 `millisecondsToHuman()`\
  \ 返回格式化 `HH:MM:SS` 的字符串。\n\n我们将建立一个间隔，在组件挂载后运行 `forceUpdate()`：\n\n```\nclass Timer\
  \ extends React.Component {\n  componentDidMount() {\n    this.forceUpdateInterval\
  \ = setInterval(() => this.forceUpdate(), 50);\n  }\n\n  componentWillUnmount()\
  \ {\n    clearInterval(this.forceUpdateInterval);\n  }\n\n  handleTrashClick = ()\
  \ => {\n    this.props.onTrashClick(this.props.id);\n  };\n\n  render() {\n    const\
  \ elapsedString = helpers.renderElapsedString(\n      this.props.elapsed, this.props.runningSince\n\
  \    );\n    return (\n```\n\n`time_tracking_app/public/js/app-6.js`\n\n在 `componentDidMount()`\
  \ 中，我们使用 JavaScript 函数 `setInterval()`。它将每 50 毫秒调用一次 `forceUpdate()` 函数，导致组件重新渲染。我们将\
  \ `setInterval()` 的返回值设置为 `this.forceUpdateInterval`。\n\n在 `componentWillUnmount()`\
  \ 中，我们使用 `clearInterval()` 停止间隔 `this.forceUpdateInterval`。`componentWillUnmount()`\
  \ 在组件从应用程序中移除之前被调用。这会在计时器被删除时发生。我们希望确保在计时器从页面移除后不再调用 `forceUpdate()`，否则 React 将抛出错误。\n\
  \n### 尝试一下\n\n保存 `app.js` 并重新加载。第一个计时器应该正在运行。\n\n我们已经开始开辟应用程序真正的实用功能了！我们只需要连接开始/停止按钮，我们的无服务器应用程序就能功能完整了。\n\
  \n### 添加开始和停止功能\n\n每个计时器底部的按钮在计时器暂停时应显示“Start（开始）”，在计时器运行时显示“Stop（停止）”。它在点击时还应该传播事件，取决于计时器是在停止还是启动。\n\
  \n我们可以将所有这些功能构建到 `Timer` 中。我们可以让 `Timer` 根据其是否正在运行来决定渲染哪一个 HTML 片段。但这将给 `Timer`\
  \ 增加更多的责任和复杂性。相反，让按钮成为它自己的 React 组件。\n\n### 为 `Timer` 添加计时器动作事件\n\n让我们修改 `Timer`，预留一个名为\
  \ `TimerActionButton` 的新组件。这个按钮只需要知道计时器是否正在运行。它还需要能够传播两个事件：`onStartClick()` 和 `onStopClick()`。这些事件最终需要向上传递到\
  \ `TimersDashboard`，那里可以修改计时器上的 `runningSince`。\n\n首先是事件处理程序：\n\n```\n // 在  \n\
  \  componentWillUnmount() {\n    clearInterval(this.forceUpdateInterval);\n  }\n\
  \n  handleStartClick = () => {\n    this.props.onStartClick(this.props.id);\n  };\n\
  \n  handleStopClick = () => {\n    this.props.onStopClick(this.props.id);\n  };\n\
  \  // ...\n```\n\n`time_tracking_app/public/js/app-7.js`\n\n然后，在 `render()` 中，我们在最外层\
  \ `div` 的底部声明 `TimerActionButton`：\n\n```\n {/* 在 Timer.render() 的底部 */}\n     \
  \   <TimerActionButton\n          timerIsRunning={!!this.props.runningSince}\n \
  \         onStartClick={this.handleStartClick}\n          onStopClick={this.handleStopClick}\n\
  \        />\n      </div>\n    );\n```\n\n`time_tracking_app/public/js/app-7.js`\n\
  \n我们使用了在其他点击处理程序中相同的技巧：HTML 元素上的 `onClick` 指定了组件中的处理函数，该函数调用一个 prop 函数并传递计时器的 id。\n\
  \n### 创建 `TimerActionButton`\n\n现在创建 `TimerActionButton` 组件：\n\n```\nclass TimerActionButton\
  \ extends React.Component {\n  render() {\n    if (this.props.timerIsRunning) {\n\
  \      return (\n        <div\n          className='ui bottom attached red basic\
  \ button'\n          onClick={this.props.onStopClick}\n        >\n          Stop\n\
  \        </div>\n      );\n    } else {\n      return (\n        <div\n        \
  \  className='ui bottom attached green basic button'\n          onClick={this.props.onStartClick}\n\
  \        >\n          Start\n        </div>\n      );\n    }\n  }\n}\n```\n\n`time_tracking_app/public/js/app-7.js`\n\
  \n根据 `this.props.timerRunning` 渲染一个 HTML 片段或另一个。\n\n你懂这里的做法。现在我们将这些事件向上传递到 `TimersDashboard`，在那里管理状态：\n\
  \n### 通过 `EditableTimer` 和 `EditableTimerList` 运行事件\n\n首先是 `EditableTimer`：\n\n\
  ```\n // 在 EditableTimer\n    } else {\n      return (\n        <Timer\n       \
  \   id={this.props.id}\n          title={this.props.title}\n          project={this.props.project}\n\
  \          elapsed={this.props.elapsed}\n          runningSince={this.props.runningSince}\n\
  \          onEditClick={this.handleEditClick}\n          onTrashClick={this.props.onTrashClick}\n\
  \          onStartClick={this.props.onStartClick}\n          onStopClick={this.props.onStopClick}\n\
  \        />\n      );\n    }\n```\n\n`time_tracking_app/public/js/app-7.js`\n\n\
  然后是 `EditableTimerList`：\n\n```\n // 在 EditableTimerList\n    const timers = this.props.timers.map((timer)\
  \ => (\n      <EditableTimer\n        key={timer.id}\n        id={timer.id}\n  \
  \      title={timer.title}\n        project={timer.project}\n        elapsed={timer.elapsed}\n\
  \        runningSince={timer.runningSince}\n        onFormSubmit={this.props.onFormSubmit}\n\
  \        onTrashClick={this.props.onTrashClick}\n        onStartClick={this.props.onStartClick}\n\
  \        onStopClick={this.props.onStopClick}\n      />\n    ));\n```\n\n`time_tracking_app/public/js/app-7.js`\n\
  \n最后，我们在 `TimersDashboard` 中定义这些函数。它们应该使用 `map` 遍历状态计时器数组，在找到匹配的计时器时适当设置 `runningSince`。\n\
  \n首先我们定义处理函数：\n\n```\n // 在 TimersDashboard\n  handleTrashClick = (timerId) => {\n\
  \    this.deleteTimer(timerId);\n  };\n\n  handleStartClick = (timerId) => {\n \
  \   this.startTimer(timerId);\n  };\n\n  handleStopClick = (timerId) => {\n    this.stopTimer(timerId);\n\
  \  };\n```\n\n然后是 `startTimer()` 和 `stopTimer()`：\n\n\n\n\n\n```javascript\n deleteTimer\
  \ = (timerId) => {\n    this.setState({\n      timers: this.state.timers.filter(t\
  \ => t.id !== timerId),\n    });\n  };\n\n  startTimer = (timerId) => {\n    const\
  \ now = Date.now();\n\n    this.setState({\n      timers: this.state.timers.map((timer)\
  \ => {\n        if (timer.id === timerId) {\n          return Object.assign({},\
  \ timer, {\n            runningSince: now,\n          });\n        } else {\n  \
  \        return timer;\n        }\n      }),\n    });\n  };\n\n  stopTimer = (timerId)\
  \ => {\n    const now = Date.now();\n\n    this.setState({\n      timers: this.state.timers.map((timer)\
  \ => {\n        if (timer.id === timerId) {\n          const lastElapsed = now -\
  \ timer.runningSince;\n          return Object.assign({}, timer, {\n           \
  \ elapsed: timer.elapsed + lastElapsed,\n            runningSince: null,\n     \
  \     });\n        } else {\n          return timer;\n        }\n      }),\n   \
  \ });\n  };\n```\n\n`time_tracking_app/public/js/app-7.js`\n\n最后，我们将它们作为 props 传递下去：\n\
  \n```javascript\n {/* Inside TimerDashboard.render() */}\n          <EditableTimerList\n\
  \            timers={this.state.timers}\n            onFormSubmit={this.handleEditFormSubmit}\n\
  \            onTrashClick={this.handleTrashClick}\n            onStartClick={this.handleStartClick}\n\
  \            onStopClick={this.handleStopClick}\n          />\n```\n\n`time_tracking_app/public/js/app-7.js`\n\
  \n当 `startTimer` 在其 `map` 调用中遇到相关的计时器时，它会将 `runningSince` 属性设置为当前时间。\n\n`stopTimer`\
  \ 计算 `lastElapsed`，即计时器自启动以来运行的时间。它将此时长累加到 `elapsed` 中，并将 `runningSince` 设置为 `null`，从而“停止”计时器。\n\
  \n### 尝试一下\n\n保存 `app.js`，刷新页面，然后见证奇迹！你现在可以创建、更新和删除计时器，并实际使用它们来计时：\n\n![](img/2-components----start-stop-timer.png)\n\
  \n这是一个极大的进展。但是，由于没有连接服务器，我们的应用是瞬时的。如果我们刷新页面，就会丢失所有的计时器数据。我们的应用没有任何任何持久化机制。\n\n服务器可以为我们提供持久化。我们将让服务器将所有计时器数据的更改写入文件。我们不再在\
  \ `TimersDashboard` 组件内部硬编码状态，而是在应用加载时查询服务器，并根据服务器提供的数据构建其计时器状态。然后，我们将让 React 应用通知服务器任何状态变化，例如计时器启动时。\n\
  \n与服务器通信是你使用 React 开发和分发真实世界 Web 应用所需的最后一个大型主要构建模块。\n\n### 方法论回顾\n\n在构建时间日志应用的过程中，我们学习并应用了一种构建\
  \ React 应用的方法论。再次，这些步骤是：\n\n1. **将应用拆分为组件**\n   我们通过检查应用运行的 UI 映射了应用的组件结构。然后，我们应用单一职责原则将组件拆分，使每个组件都具有最小可行的功能。\n\
  \n2. **构建应用的静态版本**\n   我们的底层（用户可见）组件根据从父组件传递的静态 props 渲染 HTML。\n\n3. **确定哪些应该是状态化的**\n\
  \   我们使用了一系列问题来推断哪些数据应该是状态化的。这些数据在我们的静态应用中以 props 的形式表示。\n\n4. **确定每个状态应该存在哪个组件中**\n\
  \   我们使用了另一系列问题来确定哪个组件应该拥有每个状态。`TimersDashboard` 拥有计时器状态数据，而 `ToggleableTimerForm`\
  \ 和 `EditableTimer` 都持有有关是否渲染 `TimerForm` 的状态。\n\n5. **硬编码初始状态**\n   然后我们用硬编码的值初始化状态所有者的\
  \ `state` 属性。\n\n6. **添加反向数据流**\n   我们通过给按钮装饰 `onClick` 处理程序来添加交互性。这些处理程序调用了从层级结构向下作为\
  \ props 传递的函数，这些拥有被操作的相关状态的组件。\n\n最后一步是 **7. 添加服务器通信**。我们将在下一章解决这个问题。\n\n## 组件与服务器\n\
  \n### 介绍\n\n在上一章中，我们使用了一种方法论来构建一个 React 应用。计时器的状态管理发生在顶层组件 `TimersDashboard` 中。与所有的\
  \ React 应用一样，数据从顶向下通过组件树流到叶子组件。叶子组件通过调用 prop 函数向状态管理器通信事件。\n\n目前，`TimersDashboard`\
  \ 有一个硬编码的初始状态。对状态的任何更改都只会在浏览器窗口打开期间有效。这是因为所有状态更改都发生在 React 内部内存中。我们需要我们的 React 应用与服务器通信。服务器将负责持久化数据。在这个应用中，数据持久化发生在文件\
  \ `data.json` 内部。\n\n`EditableTimer` 和 `ToggleableTimerForm` 也有硬编码的初始状态。但由于这些状态仅仅是表单是否打开，我们不需要将这些状态更改通信给服务器。我们接受表单在每次应用启动时都从关闭状态开始。\n\
  \n####准备准备\n\n为了帮助你熟悉此项目的 API 以及通用的 API 工作方法，我们设置了一个短小的章节，在其中向 API 发起请求。\n\n**curl**\n\
  \n我们将使用一个名为 `curl` 的工具从命令行发送更多请求。\n\nOS X 用户应该已经安装了 `curl`。\n\nWindows 用户可以在这里下载安装：[`curl.haxx.se/download.html`](https://curl.haxx.se/download.html)。\n\
  \n### `server.js`\n\n项目根目录下包含一个名为 `server.js` 的文件。这是一个专门为我们的计时应用设计的 Node.js 服务器。\n\
  \n`server.js` 使用 `data.json` 文件作为其“存储”。服务器将读写此文件以持久化数据。你可以查看该文件查看我们提供的初始状态。\n\n\
  `server.js` 在请求所有项目时将返回 `data.json` 的内容。当收到通知时，服务器将在 `data.json` 中反映任何更新、删除或启动。这就是数据在浏览器加载的方式。\n\
  \n在我们开始使用服务器之前，让我们简要概述它的 `API`。再次，如果这个大纲让你有些困惑请担心，在我们编写代码时将会变得清晰。\n\n### 服务器 API\n\
  \n我们在本章的最终目标是**在服务器上复制状态更改**。我们不会将所有的状态管理移动到服务器。相反，服务器将维护其状态（在 `data.json` 中），React\
  \ 将维护其状态（在此情况下，在 `TimersDashboard` 的 `this.state` 中）。稍后我们将说明为什么在两个地方保留状态是理想的。\n\n\
  ![`TimersDashboard` 与服务器通信](img/3-components-and-servers----server-data-flow.png)\n\
  \n`TimersDashboard` 与服务器通信\n\n如果我们对 React（客户端）状态执行了任何我们想要持久化的操作，那么我们需要通知服务器该状态更改。这将保持两个状态的同步。我们将这些视为我们的“写入”操作。我们要发送到服务器的写入操作有：\n\
  \n*   创建计时器\n*   更新计时器\n*   删除计时器\n*   启动计时器\n*   停止计时器\n\n我们将仅有一个读取操作：从服务器请求所有计时器。\n\
  \n#### `text/html` 端点\n\n**GET `/`**\n\n在此整个过程中，`server.js` 实际上负责提供应用。当你的浏览器请求 `localhost:3000/`\
  \ 时，服务器返回 `index.html` 文件。`index.html` 加载了我们所有的 JavaScript/React 代码。\n\n#### JSON\
  \ 端点\n\n\n\n\n\n`data.json` 是一个 JSON 文档。正如上一章中提到的，JSON 是一种存储人类可读数据对象的格式。我们可以将 JavaScript\
  \ 对象序列化为 JSON。这使得 JavaScript 对象能够存储在文本文件中并通过网络传输。\n\n`data.json` 包含一个对象数组。虽然不是 JavaScript，但此数组中的数据可以很容易加载到\
  \ JavaScript 中。\n\n在 `server.js` 中，我们看到了这样的代码：\n\n```javascript\nfs.readFile(DATA_FILE,\
  \ function(err, data) {\n  const timers = JSON.parse(data);\n  // ...\n});\n```\n\
  \n`data` 是一个字符串，即 JSON。`JSON.parse()` 将此字符串转换为真正的 JavaScript 对象数组。\n\n### GET `/api/timers`\n\
  \n返回所有计时器的列表。\n\n### POST `/api/timers`\n\n接收包含 `title`、`project` 和 `id` 属性的 JSON\
  \ 请求体。将在存储器中插入一个新的计时器对象。\n\n### POST `/api/timers/start`\n\n接收包含 `id` 和 `start`（时间戳）属性的\
  \ JSON 请求体。在存储器中查找并找到匹配 `id` 的计时器。将其 `runningSince` 设置为 `start`。\n\n### POST `/api/timers/stop`\n\
  \n接收包含 `id` 和 `stop`（时间戳）属性的 JSON 请求体。在存储器中查找并找到匹配 `id` 的计时器。根据计时器的运行时间（`stop -\
  \ runningSince`）更新 `elapsed`。将 `runningSince` 设置为 `null`。\n\n### PUT `/api/timers`\n\
  \n接收包含 `id` 和 `title` 以及/或 `project` 属性的 JSON 请求体。在存储器中查找并找到匹配 `id` 的计时器。将 `title`\
  \ 和/或 `project` 更新为新属性。\n\n### DELETE `/api/timers`\n\n接收包含 `id` 属性的 JSON 请求体。在存储器中查找并删除匹配\
  \ `id` 的计时器。\n\n### 使用 API\n\n如果你的服务器没有启动，请确保已启动：\n\n```bash\nnpm start\n```\n\n\
  你可以在浏览器中访问 `/api/timers` 端点并查看 JSON 响应（`localhost:3000/api/timers`）。当你在浏览器中访问新 URL\
  \ 时，浏览器会发送 GET 请求。因此，我们的浏览器调用 `GET /api/timers`，服务器返回所有计时器：\n\n![](img/3-components-and-servers----get-timers-json.png)\n\
  \n注意，服务器删除了 `data.json` 中所有的多余空格（包括换行符），以使负载尽可能小。这些内容只存在于 `data.json` 中是为了具有人类可读性。\n\
  \n我们可以使用像 [JSONView](https://chrome.google.com/webstore/detail/jsonview/chklaanhfefbnpoihckbnefhakgolnmc)\
  \ 这样的 Chrome 扩展将原始 JSON “人性化”。JSONView 获取这些原始 JSON 块并添加回空格以提高可读性：\n\n![安装 JSONView\
  \ 后访问端点](img/3-components-and-servers----get-timers-json-w-plugin.png)\n\n安装 JSONView\
  \ 后访问端点\n\n我们只能方便地使用浏览器发送 GET 请求。对于写入数据——例如启动和停止计时器——我们必须发送 POST、PUT 或 DELETE 请求。我们将使用\
  \ `curl` 来尝试写入数据。\n\n在命令行中运行以下命令：\n\n```bash\n$ curl -X GET localhost:3000/api/timers\n\
  ```\n\n`-X` 标志指定要使用的 HTTP 方法。它应该返回一个类似下面的响应：\n\n```json\n[{\"title\":\"Mow the lawn\"\
  ,\"project\":\"House Chores\",\"elapsed\":5456099,\"id\":\"0a4a79cb-b06d-4cb1-883d-549a1e3b66d7\"\
  },{\"title\":\"Clear paper jam\",\"project\":\"Office Chores\",\"elapsed\":1273998,\"\
  id\":\"a73c1d19-f32d-4aff-b470-cea4e792406a\"},{\"title\":\"Ponder origins of universe\"\
  ,\"project\":\"Life Chores\",\"id\":\"2c43306e-5b44-4ff8-8753-33c35adbd06f\",\"\
  elapsed\":11750,\"runningSince\":\"1456225941911\"}]\n```\n\n你可以通过向 `/api/timers/start`\
  \ 端点发送 PUT 请求来启动其中一个计时器。我们需要发送其中一个计时器的 `id` 和一个开始时间戳：\n\n```bash\n$ curl -X POST\
  \ \\\n-H 'Content-Type: application/json' \\\n-d '{\"start\":1456468632194,\"id\"\
  :\"a73c1d19-f32d-4aff-b470-cea4e792406a\"}' \\ \\\nlocalhost:3000/api/timers/start\n\
  ```\n\n`-H` 标志为我们的 HTTP 请求设置了头 `Content-Type`。我们正在告知服务器请求体是 JSON。\n\n`-d` 标志设置我们的请求体。单引号\
  \ `''` 内部是 JSON 数据。\n\n当你按下回车时，`curl` 将快速返回且没有任何输出。服务器不会返回任何内容。\n\n\n\n在调用时，`success`\
  \ 函数将接收一个参数 `serverTimers`。这是由服务器返回的计时器数组。随后我们调用了 `setState()`，这将触发一次新的渲染。新的渲染会在我们的应用中填充\
  \ `EditableTimer` 子组件及其所有子组件。应用已完全加载，对于终端用户来说，速度快到几乎察觉不到。\n\n我们在 `componentDidMount`\
  \ 中还做了另一件很有意思的事。我们使用 `setInterval()` 来确保每 5 秒调用一次 `loadTimersFromServer()`。虽然我们会尽力同步客户端和服务器之间的状态变化，但这种从服务器对状态进行的强制刷新可以确保如果服务器状态发生变化，我们的客户端将始终保持正确。\n\
  \n服务器被认为是状态的主持有者。我们的客户端仅仅是一个副本。这在多实例场景下变得异常强大。如果你运行了你应用的两个实例——在两个不同的标签页中或两台不同的电脑上——其中一个的更改将在五秒内推送到另一个。\n\
  \n### 尝试一下\n\n让我们现在来玩玩这个吧。保存 `app.js` 并重新加载应用。你应该能看到一个由 `data.json` 驱动的全新计时器列表。你所采取的任何操作都会在五秒内被清除。每五秒，状态就会从服务器恢复。例如，尝试删除一个计时器，见证它如何坚韧地完无损地弹回来。因为我们没有告诉服务器这些操作，所以它的状态保持不变。\n\
  \n相反，你可以尝试修改 `data.json`。注意看对 `data.json` 的任何修改都将在五秒内内到到你的应用中。真酷。\n\n我们正在从服务器加载初始状态。我们设置了一个间隔函数，以确保在多实例场景下，客户端应用的状态不会偏离服务器。\n\
  \n我们需要通知服务器我们其余的状态变化：创建、更新（包括开始和停止）以及删除。但首先，让我们打开 `client` 背后的逻辑，看看它是如何工作的。\n\n\
  ### `client`\n\n如果你打开 `client.js`，库中定义的第一个方法是 `getTimers()`：\n\n```\nfunction getTimers(success)\
  \ {\n    return fetch('/api/timers', {\n      headers: {\n        Accept: 'application/json',\n\
  \      },\n    }).then(checkStatus)\n      .then(parseJSON)\n      .then(success);\n\
  }\n```\n\ntime_tracking_app/public/js/client.js\n\n我们正在使用新的 `Fetch API` 来执行所有的 HTTP\
  \ 请求。如果你曾经用过 `XMLHttpRequest` 或 jQuery 的 `ajax()`，那么 Fetch 的界面看起来应该非常熟悉。\n\n####\
  \ Fetch\n\n在 Fetch 出现之前，JavaScript 开发者进行 Web 请求时有两种选择：使用所有浏览器都原生支持的 `XMLHttpRequest`，或者导入一个对其进行封装的库（如\
  \ jQuery 的 `ajax()`）。Fetch 提供了比 `XMLHttpRequest` 更好的接口。虽然 Fetch 仍在标准化过程中，但它已经受到了一些主流浏览的支持。在撰写本文时，Fetch\
  \ 已在 Firefox 39 及以上版本以及 Chrome 42 及以上版本中默认开启。\n\n在 Fetch 被浏览器更广泛采用之前，包含该库以防万一是一个好主意。我们已经在\
  \ `index.html` 内部这样做：\n\n```html\n<!-- index.html 中的 head 标签内部 -->\n<script src=\"\
  vendor/fetch.js\"></script>\n```\n\n正如我们在 `client.getTimers()` 中看到的，`fetch()` 接受两个参数：\n\
  \n*   我们想要获取的资源路径\n*   请求参数对象\n\n默认情况下，Fetch 发起 `GET` 请求，因此我们告诉 Fetch 向 `/api/timers`\
  \ 发送 `GET` 请求。我们还传递了一个参数：`headers`，即我们请求中的 HTTP 请求头。我们告诉服务器我们只接受 JSON 响应。\n\n在 `fetch()`\
  \ 调用的末尾，我们有一链 `.then()` 语句：\n\n```\n }).then(checkStatus)\n      .then(parseJSON)\n\
  \      .then(success);\n```\n\ntime_tracking_app/public/js/client.js\n\n为了理解它是如何工作的，让我们先回顾传递给每个\
  \ `.then()` 语句的函数：\n\n*   `checkStatus()`：该函数定义在 `client.js` 内部。它检查服务器是否返回了错误。如果服务器返回了错误，`checkStatus()`\
  \ 将错误记录到控制台。\n*   `parseJSON()`：该函数也定义在 `client.js` 内部。它接收 `fetch()` 发出的响应对象并返回一个\
  \ JavaScript 对象。\n*   `success()`：这是我们作为参数传递给 `getTimers()` 的函数。如果服务器成功返回了响应，`getTimers()`\
  \ 将调用此函数。\n\n Fetch 返回一个 `promise`。虽然我们不会详细介绍 promise，但正如你所见，promise 允许你链式调用 `.then()`\
  \ 。我们向每个 `.then()` 语句传递一个函数。我们在这里本质上是在说：“从 `/api/timers` 获取计时器*然后*检查服务器返回的状态码。*然后*，从响应中提取\
  \ JavaScript 对象。*然后*，将该对象传递给 `success` 函数。”\n\n在管道的每个阶段，上一个语句的结果都将作为参数传递给下一个语句：\n\
  \n1.  当调用 `checkStatus()` 时，传递给它的是 `fetch()` 返回的 Fetch 响应对象。\n2.  `checkStatus()`\
  \ 在验证响应后，返回相同的响应对象。\n3.  `parseJSON()` 被调用，并传递了 `checkStatus()` 返回的响应对象。\n4.  `parseJSON()`\
  \ 返回 JavaScript 对象。\n5.  `success()` 被调用并接收了该对象。\n\n\n\n\n我们可以使用 `client` 上的 `startTimer()`\
  \ 和 `stopTimer()` 方法来调用服务器上相应的端点。我们只需要传递一个对象，其中包含计时器的 `id` 以及它开始/停止的时间：\n\n```javascript\n\
  \ // Inside TimersDashboard\n  // ...\n  startTimer = (timerId) => {\n    const\
  \ now = Date.now();\n\n    this.setState({\n      timers: this.state.timers.map((timer)\
  \ => {\n        if (timer.id === timerId) {\n          return Object.assign({},\
  \ timer, {\n            runningSince: now,\n          });\n        } else {\n  \
  \        return timer;\n        }\n      }),\n    });\n\n    client.startTimer(\n\
  \      { id: timerId, start: now }\n    );\n  };\n\n  stopTimer = (timerId) => {\n\
  \    const now = Date.now();\n\n    this.setState({\n      timers: this.state.timers.map((timer)\
  \ => {\n        if (timer.id === timerId) {\n          const lastElapsed = now -\
  \ timer.runningSince;\n          return Object.assign({}, timer, {\n           \
  \ elapsed: timer.elapsed + lastElapsed,\n            runningSince: null,\n     \
  \     });\n        } else {\n          return timer;\n        }\n      }),\n   \
  \ });\n\n    client.stopTimer(\n      { id: timerId, stop: now }\n    );\n  };\n\
  \n  render() {\n```\n\n`time_tracking_app/public/js/app-9.js`\n\n你可能会问：为什么我们仍然在\
  \ React 中手动进行状态更改？难道我们不能直接通知服务器所执行的操作，然后根据服务器（真理之源）来更新状态吗？事实上，以下实现是有效的：\n\n```javascript\n\
  startTimer: function (timerId) {\n  const now = Date.now();\n\n  client.startTimer(\n\
  \    { id: timerId, start: now }\n  ).then(loadTimersFromServer);\n},\n```\n\n我们可以为\
  \ `startTimer()` 链一个 `.then()`，因为该函数返回了我们原始的 promise 对象。`startTimer()` 管道的最后一个阶段将是调用\
  \ `loadTimersFromServer()` 函数。因此，在服务器处理完我们的启动计时器请求后，我们将立即发送后续请求获取最新的计时器列表。此响应将包含现在正在运行的计时器。React\
  \ 的状态更新和运行中的计时器将反映在 UI 中。\n\n再次，这是可行的。然而，用户体验可能会不尽如人意。现在，点击启动/停止按钮会提供*瞬时*的反馈，因为状态在本地变化并且\
  \ React 会立即重新渲染。如果我们等待服务器的回复，在操作（鼠标点击）和响应（计时器开始运行）之间可能会有明显的延迟。你可以在本地亲自尝试，但如果请求必须通过互联网发送，这种延迟将最为明显。\n\
  \n我们在这里做的被称为**乐观更新（optimistic updating）**。我们在等待服务器回复之前，先在本地更新客户端。这重复了我们的状态更新工作，因为我们在客户端和服务器上都执行了更新。但使我们的应用程序尽可能地具有响应性。\n\
