  \n在 JavaScript 和数据库层面有方法可以提高此效率，但目前让我们专注于通过实现 `getPostIdsForUser` 让我们的代码运行起来。\n\n\
  这个 loader 将根据分页参数决定获取哪些数据以及为返回的行分配哪些游标。在支持所有可能的情况下，根据参数对数据进行切片和分页的算法相当复杂，你可以在 [Relay\
