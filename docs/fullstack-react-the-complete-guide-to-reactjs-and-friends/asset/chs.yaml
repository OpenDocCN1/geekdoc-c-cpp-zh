  \n### 扩展阅读\n\n在本章中，我们：\n\n1. 从零开始揭示了 JavaScript 测试框架的奥秘。\n2. 介绍了 Jest（一个 JavaScript\
  \ 测试框架），为我们提供了 `expect` 和 `beforeEach` 等方便的功能。\n3. 学习了如何以行为驱动组织代码。\n4. 介绍了 Enzyme（用于处理\
  \ React 组件的库）。\n5. 使用 mock 的概念为请求 API 的 React 组件编写断言。\n\n掌握了这些知识，你可以在各种不同的语文中隔离\
  \ React 组件并为它们有效地编写单元测试。随着应用程序中组件数量和复杂性的增加，这些单元测试将带给你安全感。\n\n章节外的资源对你编写单元测试非常有帮助：\n\
  \n**[Jest API 参考](https://facebook.github.io/jest/docs/api.html)**\n\n这些文档将帮助你发现丰富的匹配器，它们既可以节省你的时间，又能提高测试套件的表达能力。我们在本章中使用了一些方便的匹配器，如\
  \ `toEqual` 和 `toContain`。\n\n*   你可以使用 `toBeCloseTo()` 断言一个数字接近另一个数字。\n*   你可以使用\
  \ `toMatch()` 匹配字符串。\n*   你可以控制时间，允许处理 `setTimeout` 或 `setInterval`。\n\ncreate-react-app\
  \ 为你配置了 Jest。然而，如果你在 create-react-app 之外使用 Jest，你会发现 Jest 配置参考非常有用。\n\n**[Jasmine\
  \ 文档](https://jasmine.github.io/2.5/introduction.html)**\n\n\n\n\nJest 使用 Jasmine\
  \ 的断言，因此 Jasmine 的文档同样适用。你可以将其作为另一个参考点来理解匹配器（matchers）。\n\n此外，你还可以使用一些 Jest API\
  \ 参考文档中未提到的额外功能。例如：\n\n*   你可以使用 `jasmine.arrayContaining()` 断言数组是否包含特定的成员子集。\n\
  *   你可以使用 `jasmine.objectContaining()` 断言对象是否包含特定的键/值对子集。\n\n[Enzyme `ShallowWrapper`\
  \ API 文档](http://airbnb.io/enzyme/docs/api/shallow.html)\n\n我们探索了遍历虚拟 DOM（通过 `find()`）以及对虚拟\
  \ DOM 内容进行断言（如通过 `contains()`）的一些方法。`ShallowWrapper` 还有许多你可能觉得非常有用的方法。示例包括：\n\n\
  *   正如我们在本章看到的，`ShallowWrapper` 是类数组的。`find()` 调用可能会匹配组件输出中的多个元素。你可以对这个匹配元素列表执行镜像\
  \ `Array` 方法的操作，例如 `map()`。\n*   你可以通过 `instance()` 获取实际的 React 组件本身。你可以用它来对组件上的特定方法进行单元测试。\n\
  *   你可以通过 `setState()` 设置底层组件的状态。在可能的情况下，我们倾向于使用 `simulate()` 或直接调用组件的方法来触发状态更改。但在不实际的情况下，`setState()`\
  \ 就很有用。\n\n之前，我们看到 `find()` 接受一个 Enzyme 选择器。文档中包含一个关于什么构成有效 Enzyme 选择器的参考页面，你会发现它很有帮助。\n\
  \n## 端到端测试\n\n我们为书中的代码编写端到端测试。我们使用 [Nightwatch.js](http://nightwatchjs.org/) 工具来驱动这些测试。\n\
  \n## 路由\n\n### URL 中包含了什么？\n\nURL 是对网络资源的引用。一个典型的 URL 看起来如下：\n\n![](img/routing----url-parts.png)\n\
  \n虽然协议和主机名的组合引导我们进入某个网站，但引用该网站上特定资源的是 `pathname`。另一种思考方式是：pathname 引用了我们应用程序中的特定\
  \ `location`（位置）。\n\n例如，考虑某个音乐网站的 URL：\n\n```\nhttps://example.com.com/artists/87589/albums/1758221\n\
  ```\n\n该位置指的是艺术家的特定专辑。URL 包含了所需的艺术家和专辑的标识符：\n\n```\nexample.com/artists/:artistId/albums/:albumId\n\
  ```\n\n我们可以将 URL 视为**外部状态存储器**，在这种情况下是用户正在查看的专辑。通过将应用状态片段存储在浏览器位置层级，我们可以允许用户书签该链接、刷新页面并与他人分享。\n\
  \n在 JavaScript 极少的传统 Web 应用中，该页面的请求流可能如下：\n\n1.  浏览器向服务器请求该页面。\n2.  服务器使用 URL 中的标识符从数据库中检索有关艺术家和专辑的数据。\n\
  3.  服务器用这些数据填充模板。\n4.  服务器返回此填充后的 HTML 文档以及其他资源（如 CSS 和图片）。\n5.  浏览器渲染这些资源。\n\n\
  在使用像 React 这样丰富的 JavaScript 框架时，我们希望 React 生成页面。因此，使用 React 演化的请求流可能如下：\n\n1.  浏览器向服务器请求该页面。\n\
  2.  服务器不在乎 pathname。相反，它只返回一个标准的 `index.html`，其中包含了 React 应用和任何静态资源。\n3.  React\
  \ 应用挂载。\n4.  React 应用从 URL 中提取标识符，并使用这些标识符进行 API 调用来获取艺术家和专辑的数据。它可能会向同一个服务器发出此调用。\n\
  5.  React 应用使用从 API 调用接收的数据渲染页面。\n\n书中的其他项目也镜像了第二种请求流。一个例子是“组件与服务器”中的计时器应用。同一个 `server.js`\
  \ 同时提供了静态资源（React 应用）和一个用于为该 React 应用提供数据的 API。\n\nReact 的这种初始请求流比第一种略微低下。不是从浏览器到服务器的单次往返，而是会有两次或多次：一次用于获取\
  \ React 应用，然后是 React 应用为了渲染页面所需的所有数据而必须进行的任意次数的 API 调用。\n\n然而，收益出现在初始页面加载之后。我们使用\
  \ React 构建的计时器应用的用户体验比没有它时要好得多。如果没有 JavaScript，用户每当想要停止、开始或编辑计时器时，他们的浏览器都必须从服务器获取一个全新的页面。这导致了明显的延迟和页面加载之间不愉快的“闪烁”感。\n\
  \n**单页应用**（SPA）是加载一次然后使用 JavaScript 动态更新页面上元素的 Web 应用。我们到目前为止构建的每个 React 应用都是某种类型的\
  \ SPA。\n\n所以，我们已经看到了如何使用 React 让页面上的界面元素变得流畅且动态。但书中的其他应用只有一个位置。例如，产品投票应用只有一个视图：待投票的产品列表。如果如果我们想添加一个不同的页面，例如位于\
  \ `/products/:productId` 路径的产品视图页面会怎样？该页面将使用一组完全不同的组件。\n\n回到我们的音乐网站示例，假设用户正在查看由\
  \ React 驱动的专辑视图页面。然后他们点击应用顶部的“账户”按钮来查看账户信息。支持此操作的流可能如下：\n\n1.  用户点击“账户”按钮，该按钮指向\
  \ `/account`。\n2.  浏览器请求 `/account`。\n3.  服务器再次不在乎 pathname。它再次返回包含 React 应用和静态资源的\
  \ `index.html`。\n4.  React 应用挂载。它检查 URL 并发现用户正在查看 `/accounts` 页面。\n5.  顶层 React\
  \ 组件（例如 `App`）可能会根据 URL 切换渲染的组件。之前它渲染的是 `AlbumView`。但现在它渲染 `AccountView`。\n6.  React\
  \ 应用通过向服务器请求（例如 `/api/account`）渲染并填充自身。\n\n这种方法是行的，我们可以在 Web 各处看到它的例子。但对于许多类型的应用程序，有一种更高效的方法。\n\
  \n当用户点击“账户”按钮时，我们可以阻止浏览器从 `/account` 获取新页面。相反，我们可以指示 React 应用将 `AlbumView` 组件切换为\
  \ `AccountView` 组件。完整来看，该流如下：\n\n1.  用户访问 `https://example.com.com/artists/87589/albums/1758221`。\n\
  2.  服务器交付包含 React 应用和资源的 `index.html`。\n3.  React 应用挂载并通过向服务器发起 API 调用填充自身。\n4.\
  \  用户点击“账户”按钮。\n5.  React 应用捕获此点击事件。React 更新 URL 为 `https://example.com/account`\
  \ 并重新渲染。\n6.  当 React 应用重新渲染时，它检查 URL。它看到用户正在查看 `/account`，并切换入 `AccountView` 组件。\n\
  7.  React 应用发起 API 调用来填充 `AccountView` 组件。\n\n\n\n\nReact 有许多路由库，但社区最青睐的是 `React\
  \ Router`。React Router 为我们构建丰富的应用提供了极佳的基础，这些应用可以在不同的视图和 URL 之间包含数百甚至数千个 React 组件。\n\
  \n## React Router 的核心组件\n\n为了*修改*应用的位置，我们使用链接（links）和重定向（redirects）。在 React Router\
  \ 中，链接和重定向由两个 React 组件管理：`Link` 和 `Redirect`。\n\n为了*决定在给定位置渲染什么*，我们也使用了两个 React\
  \ Router 组件：`Route` 和 `Switch`。\n\n为了更好地理解 React Router，我们将从构建 React Router 核心组件的基础版本开始。在此过程中，我们将感受到组件驱动范式下的路由是什么样子的。\n\
  \n然后，我们将把编写的组件替换为 `react-router` 库提供的组件。我们将探索该库的更多组件和功能。\n\n在章节的后半部分，我们将在稍大的应用中查看\
  \ React Router 的工作。我们将构建的应用将具有多个带有动态 URL 的页面。该应用将与受 API 令牌保护的服务器通信。我们将探索在 React\
  \ Router 应用内部处理日志记录和注出的策略。\n\n## 构建 `react-router` 的组件\n\n### 完成的应用\n\n本章节的所有示例代码都在代码下载包的\
  \ `routing` 文件夹中。我们将从 `basics` 应用开始：\n\n```\n$ cd routing/basics\n```\n\n查看此目录，我们看到该应用是由\
  \ `create-react-app` 驱动的：\n\n```\n$ ls\nREADME.md\nnightwatch.json\npackage.json\n\
  public/\nsrc/\ntests/\n```\n\n我们的 React 应用位于 `src/` 目录：\n\n```\n$ ls src\nApp.css\n\
  App.js\nSelectableApp.js\ncomplete/\nindex-complete.js\nindex.css\nindex.js\nlogo.svg\n\
  ```\n\n`complete/` 包含了 `App.js` 的完成版本。该文件夹还包含了我们在本节构建的 `App.js` 的每一个迭代版本。\n\n安装\
  \ npm 包：\n\n```\n$ npm i\n```\n\n目前，`index.js` 正在加载 `index-complete.js`。`index-complete.js`\
  \ 使用 `SelectableApp` 让我们能够在应用的不同迭代版本之间切换。`SelectableApp` 仅用于演示目的。\n\n如果启动应用，我们将看到完成版本：\n\
  \n```\n$ npm start\n```\n\n该应用包含三个链接。点击链接会在应用下方显示有关所选水域的简短介绍：\n\n![完成的应用](img/routing----basics-complete.png)\n\
  \n#### 完成的应用\n\n注意，点击链接会*改变应用的位置*。点击链接 `/atlantic` 会将 URL 更新为 `/atlantic`。重要的是，当我们点击链接时，浏览器*不会发出请求*。关于大西洋的简短介绍出现，浏览器的\
  \ URL 立即更新为 `/atlantic`。\n\n点击链接 `/black-sea` 将会显示一个倒计时。当倒计时结束时，应用会将浏览器重定向到 `/`。\n\
  \n此应用中的路由是由 `react-router` 库驱动的。我们将通过构建自己的 React Router 组件来手动构建一个版本的应用。\n\n在本节中，我们将在\
  \ `App.js` 文件中工作。\n\n### 构建 `Route`\n\n我们将从构建 React Router 的 `Route` 组件开始。稍后我们将看到它的作用。\n\
  \n让我们打开 `src/App.js` 文件。内部是 `App` 的骨架版本。在 `React` 的导入语句下方，我们定义了一个带有两个 `<a>` 标签链接的简单\
  \ `App` 组件：\n\n```javascript\nclass App extends React.Component {\n  render() {\n\
  \    return (\n      <div\n        className='ui text container'\n      >\n    \
  \    <h2 className='ui dividing header'>\n          哪一个水域？\n        </h2>\n\n  \
  \      <ul>\n          <li>\n            <a href='/atlantic'>\n              <code>/atlantic</code>\n\
  \            </a>\n          </li>\n          <li>\n            <a href='/pacific'>\n\
  \              <code>/pacific</code>\n            </a>\n          </li>\n      \
  \  </ul>\n\n        <hr />\n\n        {/* 我们将在这里插入 Route 组件 */}\n      </div>\n\
  \    );\n  }\n}\n```\n\n`routing/basics/src/App.js`\n\n我们有两个常规的 HTML 锚点标签（anchor\
  \ tags），分别指向 `/atlantic` 和 `/pacific` 路径。\n\n在 `App` 下方有两个无状态函数组件：\n\n```javascript\n\
  const Atlantic = () => (\n  <div>\n    <h3>Atlantic Ocean</h3>\n    <p>\n      大西洋覆盖了地球表面约\
  \ 1/5。\n    </p>\n  </div>\n);\n\nconst Pacific = () => (\n  <div>\n    <h3>Pacific\
  \ Ocean</h3>\n    <p>\n      葡萄牙探险家斐尔南·麦哲伦在 1521 年将该海洋命名为“mar pacifico”，意思是平静的海。\n\
  \    </p>\n  </div>\n);\n```\n\n`routing/basics/src/App.js`\n\n这些组件渲染了关于这两个海洋的一些事实。最终，我们希望在\
  \ `App` 内部渲染这些组件。我们希望当浏览器位置为 `/atlantic` 时 `App` 渲染 `Atlantic`，当位置为 `/pacific` 时渲染\
  \ `Pacific`。\n\n记得 `index.js` 目前正委托给 `index-complete.js` 将应用的完成版本加载到 DOM 中。在查看目前的应用之前，我们需要确保\
  \ `index.js` 挂载的是我们在这里 `./App.js` 中编写的 `App` 组件。\n\n打开 `index.js`。首先，注释掉导入 `index-complete`\
  \ 的那行：\n\n```javascript\n// [STEP 1] 注释掉这一行：\n// import \"./index-complete\";\n\
  ```\n\n与其他 `create-react-app` 应用一样，将 React 应用挂载到 DOM 的操作发生在这里 `index.js` 中。让我们取消注释挂载\
  \ `App` 的那行：\n\n```javascript\n// [STEP 2] 取消注释这一行：\nReactDOM.render(<App />, document.getElementById(\"\
  root\"));\n```\n\n从项目文件夹的根目录，可以使用 `start` 命令启动应用：\n\n```\n$ npm start\n```\n\n我们在页面上渲染了两个链接。我们可以点击它们并注意到浏览器发起了页面请求。URL\
  \ 栏更新了，但应用内部没有发生变化：\n\n![](img/routing----basics-initial.png)\n\n我们没有看到渲染 `Atlantic`\
  \ 或 `Pacific`，这是因为我们还没有在 `App` 中包含它们。尽管如此，有趣的是，**目前我们的应用并不关心路径**。无论浏览器请求什么路径，服务器都会返回相同的\
  \ `index.html` 和相同的 JavaScript 程序包。\n\n这是一个理想的基础。我们希望浏览器在每个位置以相同的方式加载 React，并根据每个位置委托\
  \ React 处理。\n\n让我们应用根据位置（`/atlantic` 或 `/pacific`）渲染相应的组件 `Atlantic` 或 `Pacific`。为了实现这一点，我们将编写并使用\
  \ `Route` 组件。\n\n在 React Router 中，`Route` 是一个**根据应用的位置决定是否渲染指定组件的组件**。我们需要为 `Route`\
  \ 提供两个参数作为 `props`：\n\n*   用于与位置*匹配*的 `path`\n*   当位置匹配 `path` 时渲染的 `component`\n\
  \n在编写该组件之前，让我们看看如何使用它。在我们的 `App` 组件的 `render()` 函数中，我们将这样使用 `Route`：\n\n```javascript\n\
  <ul>\n          <li>\n            <a href='/atlantic'>\n              <code>/atlantic</code>\n\
  \            </a>\n          </li>\n          <li>\n            <a href='/pacific'>\n\
  \              <code>/pacific</code>\n            </a>\n          </li>\n      \
  \  </ul>\n\n        <hr />\n\n        <Route path='/atlantic' component={Atlantic}\
  \ />\n        <Route path='/pacific' component={Pacific} />\n```\n\n`routing/basics/src/complete/App-1.js`\n\
  \n**`Route` 与 React Router 中的其他一切一样，都是组件**。提供的 `path` 属性将与浏览器位置进行匹配。如果匹配，`Route`\
  \ 将返回该组件。如果不匹配，`Route` 将返回 `null`，不渲染任何内容。\n\n在文件顶部 `App` 之上，让我们作为无状态函数编写 `Route`\
  \ 组件。我们将查看代码，然后对其进行拆解：\n\n\n\n\n\n```javascript\nimport React from 'react';\n\n\
  const Route = ({ path, component }) => {\n  const pathname = window.location.pathname;\n\
  \  if (pathname.match(path)) {\n    return (\n      React.createElement(component)\n\
  \    );\n  } else {\n    return null;\n  }\n};\n\nclass App extends React.Component\
  \ {\n```\n\n`routing/basics/src/complete/App-1.js`\n\n我们使用 ES6 解构赋值语法从参数中提取出两个 props：`path`\
  \ 和 `component`：\n\n```\nconst Route = ({ path, component }) => {\n```\n\n`routing/basics/src/complete/App-1.js`\n\
  \n接下来，我们实例化 `pathname` 变量：\n\n```\n const pathname = window.location.pathname;\n\
  ```\n\n`routing/basics/src/complete/App-1.js`\n\n在浏览器环境中，`window.location` 是一个特殊的对象，包含了浏览器当前位置的属性。我们从该对象中获取\
  \ `pathname`，它是 URL 的路径。\n\n最后，如果传递给 `Route` 的 `path` 匹配 `pathname`，我们返回该组件。否则，我们返回\
  \ `null`：\n\n```\n if (pathname.match(path)) {\n    return (\n      React.createElement(component)\n\
  \    );\n  } else {\n    return null;\n  }\n```\n\n`routing/basics/src/complete/App-1.js`\n\
  \n虽然 React Router 自带的 `Route` 更复杂，但这是该组件的核心。组件通过将 `path` 与应用的位置进行匹配，来决定是否应该渲染指定的组件。\n\
  \n让我们来看看这个阶段的应用。\n\n### 尝试一下\n\n保存 `App.js`。如果 Webpack 开发服务器尚未运行，请确保它已启动：\n\n```\n\
  $ npm start\n```\n\n转到浏览器并访问应用。注意到，当我们访问每个位置时，我们现在正在渲染相应的组件：\n\n![`/pacific` 现在渲染\
  \ `Pacific`](img/routing----basics-app-1.png)\n\n`/pacific` 现在渲染 `Pacific`\n\n我们的应用正在响应某些外部状态，即浏览器的位置。每个\
  \ `Route` 都根据应用的位置决定是否应该显示其组件。注意，当浏览器访问 `/` 时，没有组件被匹配。两个 `Route` 组件占据的空间都留为空。\n\n\
  当我们点击链接时，我们看到浏览器正在进行全页面加载：\n\n![点击 `/atlantic` 触发了全页面加载](img/routing----basics-app-1-full-page-load.png)\n\
  \n点击 `/atlantic` 触发了全页面加载\n\n默认情况下，每当我们点击链接时，我们的浏览器都会向 Webpack 开发服务器发送新的请求。服务器返回\
  \ `index.html`，我们的浏览器需要重新执行挂载 React 应用的工作。\n\n正如引言中所强调的，这种循环是没有必要的。在 `/pacific`\
  \ 和 `/atlantic` 之间切换，不需要涉及服务器。我们的客户端应用已经加载了所有组件并准备就绪。我们只需要在点击 `/atlantic` 链接时，将\
  \ `Pacific` 组件替换为 `Atlantic` 组件即可。\n\n我们希望点击链接能够**在不发送网络请求的情况下更改浏览器的位置**。更新位置后，我们可以重新渲染\
  \ React 应用，并依靠 `Route` 来合理地决定渲染哪些组件。\n\n为了实现这一点，我们将构建另一个类似 React Router 自带组件的自定义版本。\n\
  \n#### 构建 `Link`\n\n在 Web 界面中，我们使用 HTML `<a>` 标签创建链接。在这里我们需要一种特殊的 `<a>` 标签。当用户点击此标签时，我们希望浏览器跳过其通过网络请求获取下一页的默认例程。相反，我们只想手动更新浏览器的位置。\n\
  \n大多数浏览器都提供了一个管理当前会话历史的 API：`window.history`。我们鼓励在浏览器的 JavaScript 控制台中尝试它。它拥有如 `history.back()`\
  \ 和 `history.forward()` 等方法，允许你在历史堆栈中导航。我们直接感兴趣的是，它有一个 `history.pushState()` 方法，允许你将浏览器导航到指定的位置。\n\
  \n`history` API 在 HTML5 中接收了一些更新。为了最大化跨浏览器兼容性，`react-router` 使用一个名为 `History.js`\
  \ 的库与此 API 交互。这个 `history` 包已经包含在项目的 `package.json` 中：\n\n```\n \"history\": \"\
  4.3.0\",\n```\n\n`routing/basics/package.json`\n\n让我们更新 `App.js` 文件，并从 `history`\
  \ 库导入 `createBrowserHistory` 函数。我们将使用这个函数创建一个名为 `history` 的对象，并用它与浏览器的历史 API 交互：\n\
  \n```javascript\nimport React from 'react';\n\nimport createHistory from 'history/createBrowserHistory';\n\
  \nconst history = createHistory();\n\nconst Route = ({ path, component }) => {\n\
  ```\n\n`routing/basics/src/complete/App-2.js`\n\n让我们组合一个 `Link` 组件，它产生一个带有特殊 `onClick`\
  \ 绑定的 `<a>` 标签。当用户点击 `Link` 组件时，我们将阻止浏览器发送请求。相反，我们将使用历史 API 更新浏览器的位置。\n\n就像我们处理\
  \ `Route` 组件一样，让我们在实现它之前看看将如何使用这个组件。在 `App` 组件的 `render()` 函数内部，让我们替换……（注：原文此处存在大量重复乱码，此处已按核心逻辑翻译）。\n\
  \n\n\n\n\n![点击链接 `/pacific` 后，URL 栏显示 `/pacific` 但我们仍然看到 `Atlantic`](img/routing----basics-pac-atlantic-mismatch.png)\n\
  \n点击链接 `/pacific` 后，URL 栏显示 `/pacific` 但我们仍然看到 `Atlantic`。\n\n当 `Link` 正在更新浏览器的位置时，我们的\
  \ React 应用并没有感知到这一变化。我们需要在每次位置变化时触发 React 应用进行重新渲染。\n\n`history` 对象提供了一个 `listen()`\
  \ 函数，我们可以在这里使用它。我们可以向 `listen()` 传递一个函数，它会在每次历史堆栈被修改时调用该函数。我们可以在 `componentDidMount()`\
  \ 内部设置 `listen()` 处理器，通过一个调用 `forceUpdate()` 的函数来订阅 `history`：\n\n```javascript\n\
  class App extends React.Component {\n  componentDidMount() {\n    history.listen(()\
  \ => this.forceUpdate());\n  }\n\n  render() {\n```\n\nrouting/basics/src/complete/App-2.js\n\
  \n当浏览器的位置改变时，这个监听函数会被调用，从而重新渲染 `App`。随后我们的 `Route` 组件将重新渲染，并与最新的 URL 进行匹配。\n\n###\
  \ 尝试一下\n\n让我们保存更新后的 `App.js` 浏览器中访问该应用。注意，我们在 `/pacific` 和 `/atlantic` 两个路由之间导航时，浏览器并没有执行任何全页面加载！\n\
  \n即使我们的应用规模很小，我们也能享受到显著的性能提升。避免全页面加载可以节省数百毫秒，并防止应用在页面切换期间出现“闪烁”。鉴于这现在是更优的用户体验，很容易想象随着应用规模和复杂性的增加，这些收益将如何扩大。\n\
  \n通过 `Link` 和 `Route` 组件，我们正在理解如何使用组件驱动的路由范式来处理浏览器的位置更新，并让我们的应用对这种状态变化做出响应。\n\n\
  我们还有两个组件需要介绍：`Redirect` 和 `Switch`。它们将赋予我们对应用路由的更多控制权。\n\n在构建这些组件之前，我们将先构建 React\
  \ Router 的 `Router` 组件的基础版本。`react-router` 提供了一个 `Router` 组件，它是每个 `react-router`\
  \ 应用中的顶层组件。正如我们将看到的，它负责在每次位置变化时触发重新渲染。它还为 React Router 的所有其他组件提供了 API，这些 API 可用于读取和修改浏览器的位置。\n\
  \n### 构建 `Router`\n\n我们的基础版本 `Router` 应该做两件事：\n\n1. 为其子组件提供 `location` 和 `history`\
  \ 的**上下文（context）**\n2. 在每次历史发生变化时重新渲染应用\n\n关于第一个需求，目前我们的 `Route` 和 `Link` 组件直接使用了两个外部\
  \ API。`Route` 使用 `window.location` 读取位置，而 `Link` 使用 `history` 修改位置。`Redirect` 也需要访问相同的\
  \ API。`react-router` 提供的 `Router` 通过上下文让子组件可以使用这些 API。这是一种更清晰的模式，意味着你可以轻松地在测试中注入你自己的\
  \ `location` 或 `history` 对象。\n\n关于第二个需求，目前 `App` 在 `componentDidMount()` 中订阅了 `history`。我们将此责任上移到\
  \ `Router`，它将成为应用的顶层组件。\n\n在构建 `Router` 之前，让我们先在 `App` 内部使用它。因为我们不再需要在 `App` 中使用\
  \ `componentDidMount()`，可以将该组件转换为无状态函数。\n\n在 `App` 顶部，我们将组件转换为函数，移除 `componentDidMount()`，并添加\
  \ `<Router>` 的起始标签：\n\n```javascript\nconst App = () => (\n  <Router>\n    <div\n\
  \      className='ui text container'\n    >\n```\n\nrouting/basics/src/complete/App-3.js\n\
  \n并在底部同时关闭它们：\n\n```javascript\n <Route path='/atlantic' component={Atlantic} />\n\
  \      <Route path='/pacific' component={Pacific} />\n    </div\n  </Router>\n);\n\
  ```\n\nrouting/basics/src/complete/App-3.js\n\n我们会在 `App` 之上声明 `Router`。在讲解该组件之前，先看看它的完整样子：\n\
  \n```javascript\nclass Router extends React.Component {\n\n  static childContextTypes\
  \ = {\n    history: PropTypes.object,\n    location: PropTypes.object,\n  };\n\n\
  \  constructor(props) {\n    super(props);\n\n    this.history = createHistory();\n\
  \    this.history.listen(() => this.forceUpdate());\n  }\n\n  getChildContext()\
  \ {\n    return {\n      history: this.history,\n      location: window.location,\n\
  \    };\n  }\n\n  render() {\n    return this.props.children;\n  }\n}\n```\n\nrouting/basics/src/complete/App-3.js\n\
  \n#### 订阅 `history`\n\n在我们新 `Router` 组件的构造函数中，我们初始化了 `this.history`。然后我们订阅变化，这和我们在\
  \ `App` 组件中做的是一样的：\n\n```javascript\n constructor(props) {\n    super(props);\n\n\
  \    this.history = createHistory();\n    this.history.listen(() => this.forceUpdate());\n\
  \  }\n```\n\nrouting/basics/src/complete/App-3.js\n\n#### 暴露上下文\n\n正如我们之前提到的，我们希望\
  \ `Router` 向其子组件暴露上下文。我们可以使用 React 的上下文功能。让我们添加想要传递的两个属性：`history` 和 `location`。为了暴露上下文，必须指定每个上下文的类型。\n\
  \n首先，在文件顶部导入 `prop-types` 包：\n\n```javascript\nimport PropTypes from 'prop-types';\n\
  ```\n\nrouting/basics/src/complete/App-3.js\n\n然后定义 `childContextTypes`：\n\n```javascript\n\
  class Router extends React.Component {\n\n  static childContextTypes = {\n    history:\
  \ PropTypes.object,\n    location: PropTypes.object,\n  };\n```\n\nrouting/basics/src/complete/App-3.js\n\
  \n然后，在 `getChildContext()` 中，我们返回上下文对象：\n\n```javascript\n getChildContext() {\n\
  \    return {\n      history: this.history,\n      location: window.location,\n\
  \    };\n  }\n```\n\nrouting/basics/src/complete/App-3.js\n\n最后，在 `render()` 函数中渲染由新\
  \ `Router` 包裹的子：\n\n```javascript\n render() {\n    return this.props.children;\n\
  \  }\n```\n\nrouting/basics/src/complete/App-3.js\n\n由于我们在 `Router` 内部初始化 `history`，可以移除文件顶部的声明：\n\
  \n```javascript\nimport React from 'react';\n\nimport createHistory from 'history/createHistory';\n\
  \nconst history = createHistory();\n```\n\nrouting/basics/src/complete/App-3.js\n\
  \n由于我们现在有一个通过上下文传递 `history` 和 `location` 的 `Router` 组件，可以更新 `Route` 和 `Link` 组件以使用来自上下文的变量。\n\
  \n让我们先处理 `Route` 组件。传递给无状态函数的第二个参数是上下文对象。我们不再使用 `window.location` 上的 location，而是从组件参数的\
  \ `context` 对象中获取 `location`：\n\n```javascript\nconst Route = ({ path, component\
  \ }, { location }) => {\n  const pathname = location.pathname;\n  if (pathname.match(path))\
  \ {\n    return (\n      React.createElement(component)\n    );\n  } else {\n  \
  \  return null;\n  }\n};\n\nRoute.contextTypes = {\n  location: PropTypes.object,\n\
  };\n```\n\nrouting/basics/src/complete/App-3.js\n\n在 `Route` 下方，我们设置了属性 `contextTypes`。记住，为了接收上下文，组件必须白名单它应该接收的上下文部分。\n\
  \n让我们以同样的方式更新 `Link` 组件。`Link` 可以上下文对象中的 `history` 属性：\n\n```javascript\nconst Link\
  \ = ({ to, children }, { history }) => (\n  <a\n    onClick={(e) => {\n      e.preventDefault();\n\
  \      history.push(to);\n    }}\n    href={to}\n  >\n    {children}\n  </a>\n);\n\
  \nLink.contextTypes = {\n  history: PropTypes.object,\n};\n```\n\nrouting/basics/src/complete/App-3.js\n\
  \n\n\n\n\n我们的应用现在被封装在一个 `Router` 组件中。虽然它缺乏 `react-router` 提供的实际 `Router` 所具有的许多功能，但它让我们了解了\
  \ `Router` 组件是如何工作的：它向子组件提供了了位置管理 API，并在位置变化时强制应用重新渲染。\n\n让我们保存更新后的 `App.js` 并在浏览器中访问该应用。我们看到一切的运行情况与之前完全相同。\n\
  \n随着我们的 `Router` 已就绪，我们现在可以自己实现一个 `Redirect` 组件，它从上下文（context）中使用 `history` 来操作浏览器的位置。\n\
  \n### 构建 `Redirect`\n\n`Redirect` 组件是 `Link` 的近亲。`Link` 生成一个用户可以点击以修改位置的链接，而 `Redirect`\
  \ 则在每次被渲染时都会立即修改位置。\n\n像 `Link` 一样，我们期望这个组件接收一个 `to` 属性。而且像 `Link` 一样，我们将从上下文中获取\
  \ `history`，并使用该对象来修改浏览器的位置。\n\n然而，我们执行这一操作的*位置*是不同的。在 `Router` 之上，让我们编写 `Redirect`\
  \ 组件看看它是如何工作的：\n\n```\nclass Redirect extends React.Component {\n\n  static contextTypes\
  \ = {\n    history: PropTypes.object,\n  }\n\n  componentDidMount() {\n    const\
  \ history = this.context.history;\n    const to = this.props.to;\n    history.push(to);\n\
  \  }\n\n  render() {\n    return null;\n  }\n}\n\nclass Router extends React.Component\
  \ {\n```\n\n`routing/basics/src/complete/App-4.js`\n\n我们将 `history.push()` 放在了 `componentDidMount()`\
  \ *内部*！一旦该组件挂载到页面上，它就会调用 `history` API 来修改应用的位置。\n\n如果你熟悉其他 Web 开发框架的路由范式，这个 `Redirect`\
  \ 组件可能会显得特别奇怪。大多数开发者习惯了使用类似命令式的路由表来处理重定向。\n\n相反，`react-router` 提供了一个由可组合组件组成的*声明式*范式。在这里，`Redirect`\
  \ 仅仅被为一个 React 组件。想要重定向？只需渲染一个 `Redirect` 组件即可。\n\n在应用的完成版本中，我们看到了第三个路由 `black-sea`。当访问此位置时，应用会在重定向到\
  \ `/` 之前显示一个倒计时器。让我们现在来构建它。\n\n首先，我们将为即将定义的组件 `BlackSea` 添加一个新的 `Link` 和 `Route`：\n\
  \n```\n <ul>\n        <li>\n          <Link to='/atlantic'>\n            <code>/atlantic</code>\n\
  \          </Link>\n        </li>\n        <li>\n          <Link to='/pacific'>\n\
  \            <code>/pacific</code>\n          </Link>\n        </li>\n        <li>\n\
  \          <Link to='/black-sea'>\n            <code>/black-sea</code>\n       \
  \   </Link>\n        </li>\n      </ul>\n\n      <hr />\n\n      <Route path='/atlantic'\
  \ component={Atlantic} />\n      <Route path='/pacific' component={Pacific} />\n\
  \      <Route path='/black-sea' component={BlackSea} />\n    </div>\n  </Router>\n\
  ```\n\n（注）\n\n`routing/basics/src/complete/App-4.js`\n\n让我们继续在 `App.js` 的底部定义 `BlackSea`。\n\
  \n首先，让我们实现计数逻辑。我们将 `state.counter` 初始化为 `3`。然后，在 `componentDidMount()` 中，我们将使用 JavaScript\
  \ 内置的 `setInterval()` 执行倒计时：\n\n```\nclass BlackSea extends React.Component {\n\
  \  state = {\n    counter: 3,\n  };\n\n  componentDidMount() {\n    this.interval\
  \ = setInterval(() => (\n      this.setState(prevState => {\n        return {\n\
  \          counter: prevState.counter - 1,\n        };\n      )), 1000);\n```\n\n\
  `routing/basics/src/complete/App-4.js`\n\n`setInterval()` 函数将每秒让 `state.counter`\
  \ 减少 1。\n\n我们必须记住在组件卸载时清除定时器。这是我们在第二章计时器应用中使用的策略：\n\n```\ncomponentWillUnmount()\
  \ {\n    clearInterval(this.interval);\n  }\n```\n\n`routing/basics/src/complete/App-4.js`\n\
  \n最后，让我们关注重定向逻辑。我们将在 `render()` 函数内部处理重定向逻辑。当 `render()` 函数被调用时，我们想要检查计数器是否小于 `1`。如果是，我们就想要执行重定向。我们通过在渲染输出中包含\
  \ `Redirect` 组件来实现：\n\n```\nrender() {\n    return (\n      <div>\n        <h3>Black\
  \ Sea</h3>\n        <p>Nothing to sea [sic]...</p>\n        <p>Redirecting in {this.state.counter}...</p>\n\
  \        {\n          this.state.counter < 1 ? (\n            <Redirect to='/' />\n\
  \          ) : null\n        }\n      </div>\n    );\n}\n```\n\n`routing/basics/src/complete/App-4.js`\n\
  \n在 `BlackSea` 挂载三秒后，我们的定时函数会将 `state.counter` 递减到 `0`。`setState()` 函数会触发 `BlackSea`\
  \ 组件的重新渲染。它的输出将包含重定向。\n\n这种重定向机制初看起来可能很奇怪。但正如我们所看到的，这种方式是强大的。React Router 团队对这种接口的活性感到自豪。我们在构建并使用\
  \ `Redirect`，让我们尝试一下。保存 `App.js`。在浏览器中访问 `/black-sea`，我们将看到它在执行重定向之前的渲染：\n\n![Black\
  \ Sea countdown](img/routing-basics-black-sea.png)\n\nBlack Sea 倒计时\n\n此时，我们已经理解了\
  \ React Router 的三个组件是如何读取和更新浏览器位置的。我们也看到了它们是如何与顶层 `Router` 组件工作的。\n\n让我们放弃手写的 React\
  \ Router 组件，转而使用库提供的路由组件。之后，我们将探索 `Route` 组件所提供的更多功能。此外，我们将看到 `Switch` 如何提供最后一个功能。\n\
  \n### 使用 `react-router`\n\n我们将从 `react-router` 导入想要使用的组件，并删除我们到为止编写的组件。\n\n`react-router`\
  \ 库包含了几个不同的包，如 `react-router-dom` 和 `react-router-native`。每个包对应一个支持的环境。由于我们正在构建\
  \ Web 应用，我们将使用 `react-router-dom` 包。\n\n`react-router-dom` 已包含在项目的 `package.json`\
  \ 中。\n\n在我们的 `App.js` 顶部，移除对 `createHistory` 的导入语句。React Router 将处理历史管理：\n\n```\n\
  import React from 'react';\nimport createHistory from 'history/createHistory';\n\
  ```\n\n我们将添加一个包含我们想要使用的每个组件的导入语句。然后，我们将删除所有自定义的 `react-router` 组件。我们的其他组件（如 `App`）可以保持不变：\n\
  \n```javascript\nimport React from 'react';\n\nimport {\n  BrowserRouter as Router,\n\
  \  Route,\n  Link,\n  Redirect,\n} from 'react-router-dom'\n\nconst App = () =>\
  \ (\n```\n\n`routing/basics/src/complete/App-5.js`\n\n`react-router-dom` 以 `BrowserRouter`\
  \ 的命名导出路由器，以便与其他环境（如 `NativeRouter`）包含的路由器区分开。通过 `as` 关键字使用 `Router` 别名是常见的做法。\n\
  \n保存 `App.js`。在此更改之后，我们将看到一切与切换到使用 React Router 之前的情况相同。\n\n### 更多 `Route`\n\n现在我们正在使用\
  \ `react-router` 库，我们导入的 `Route` 组件具有许多额外功能。\n\n到为止，我们一直使用 `component` 属性来指示 `Route`\
  \ 在 `path` 匹配时渲染哪个组件。`Route` 也接受 `render` 属性。我们可以使用此属性来内联定义渲染函数。\n\n\n\n\n\n为了查看此示例，让我们在\
  \ `App` 中再添加另一个 `Route` 声明。我们将它插入到其他现有 `Route` 组件的上方。这次，我们将使用 `render`：\n\n```jsx\n\
  \ <Route path='/atlantic/ocean' render={() => (\n        <div>\n          <h3>Atlantic\
  \ Ocean — Again!</h3>\n          <p>\n            也被称为“池塘”（The Pond）。\n        \
  \  </p>\n        </div>\n      )} />\n      <Route path='/atlantic' component={Atlantic}\
  \ />\n      <Route path='/pacific' component={Pacific} />\n      <Route path='/black-sea'\
  \ component={BlackSea} />\n```\n\n`routing/basics/src/complete/App-5.js`\n\n保存 `App.js`。如果我们在\
  \ `/atlantic` 访问应用，正如预期的，我们只会看到 `Atlantic` 组件：\n\n![`/atlantic` 只显示 `Atlantic`](img/routing----basics-atlantic.png)\n\
  \n`/atlantic` 只显示 `Atlantic`\n\n如果我们访问 `/atlantic/ocean` 会发生什么？由于我们没有指向该路径的 `Link`，所以手动在地址栏中输入它。我们注意到*两个*——`Atlantic`\
  \ 组件和我们新的匿名渲染函数——都堆叠在一起：\n\n![`/atlantic/ocean` 同时出现了两个 Atlantic 组件`](img/routing----basics-two-atlantics.png)\n\
  \n`/atlantic/ocean` 同时出现了两个 Atlantic 组件\n\n为什么我们能看到两个组件？这是因为 `Route` 匹配 `path` 与位置（location）的方式。回想一下\
  \ `Route` 组件是如何执行匹配的：\n\n```javascript\n if (pathname.match(path)) {\n```\n\n`routing/basics/src/complete/App-1.js`\n\
  \n考虑一下它的行为：\n\n```javascript\nconst routePath = '/atlantic';\n\nlet browserPath\
  \ = '/atl';\nbrowserPath.match(routePath); // -> 不匹配\n\nbrowserPath = '/atlantic';\n\
  browserPath.match(routePath); // -> 匹配\n\nbrowserPath = '/atlantic/ocean'\nbrowserPath.match(routePath);\
  \ // -> 匹配\n```\n\n因此，两个 Atlantic 组件的 `Route` 声明都匹配了位置 `/atlantic/ocean`。所以它们都被渲染了。\n\
  \n我们在此之前还没有观察到 `Route` 的这种行为。但考虑到 `Route` 的工作原理，这种行为是合理的。**任意数量的组件都可以匹配给定的位置，并且它们都会被渲染**。`Route`\
  \ 没有强制任何形式的排他性。\n\n有时，这种行为是不理想的。我们稍后会看到管理这种情况的策略。\n\n考虑到这种行为，如果我们想添加一个在用户访问根路径（`/`）时渲染的组件会该怎么办？如果能有一些文字指示用户点击其中一个链接就太好了。\n\
  \n我们现在知道，这样的解决方案是有问题的：\n\n```jsx\n {/* 这种解决方案是有问题的 */}\n      <Route path='/' render={()\
  \ => (\n        <h3>\n          欢迎！请在上方选择一个水域。\n        </h3>\n      )} />\n```\n\
  \n`routing/basics/src/complete/App-5.js`\n\n由于 `/` 会匹配像 `/atlantic` 和 `/pacific`\
  \ 这样的路径，该组件会在的每个页面上渲染：\n\n![`/` 的 `Route` 匹配所有位置](img/routing----basics-erroneous-welcome-component.png)\n\
  \n`/` 的 `Route` 匹配所有位置\n\n这种行为并不是我们想要的。通过向 `Route` 组件添加 `exact` 属性，我们可以指定路径必须**完全**匹配位置。现在添加针对\
  \ `/` 的 `Route`：\n\n```jsx\n <Route path='/atlantic/ocean' render={() => (\n   \
  \     <div>\n          <h3>Atlantic Ocean — Again!</h3>\n          <p>\n       \
  \     也被称为“池塘”（The Pond）。\n          </p>\n        </div>\n      )} />\n      <Route\
  \ path='/atlantic' component={Atlantic} />\n      <Route path='/pacific' component={Pacific}\
  \ />\n      <Route path='/black-sea' component={BlackSea} />\n\n      <Route exact\
  \ path='/' render={() => (\n        <h3>\n          欢迎！请在上方选择一个水域。\n        </h3>\n\
  \      )} />\n```\n\n`routing/basics/src/complete/App-6.js`\n\n我们在这里使用了一些 JSX 语法糖。虽然我们可以像这样显式地设置属性：\n\
  \n```jsx\n<Route exact={true} path='/' render={() => (\n  // ...\n)}\n```\n\n在 JSX\
  \ 中，如果列出了属性但没有分配值，它会将默认值设为 `true`。\n\n### 尝试一下\n\n保存 `App.js`。在浏览器中访问 `/`，我们看到了我们的欢迎组件。重要的是，欢迎组件不会出现在任何其他路径上：\n\
  \n![我们在 `/` 处欢迎用户](img/routing----basics-welcome.png)\n\n我们在 `/` 处欢迎用户\n\n我们现在为用户访问\
  \ `/` 的情况有了一个适当处理器。\n\n`Route` 组件是一种强大而简单的方法，用于声明我们希望在哪些路由上显示哪些组件。然而，`Route` 单身具有一些局限性：\n\
  \n1. 正如我们之前在路由 `/atlantic/ocean` 中看到的，我们通常希望只有一个 `Route` 匹配给定的路径。\n2. 此外，我们还没有处理用户访问我们的应用未指定匹配的路径的情况的策略。\n\
  \n为了解决这些问题，我们可以将 `Route` 组件封装在 **`Switch`** 组件中。\n\n#### 使用 `Switch`\n\n当 `Route`\
  \ 组件封装在 `Switch` 组件中时，只有匹配的第一个 `Route` 会显示。这意味着我们可以使用 `Switch` 来克服我们目前看到的两个限制：\n\
  \n1. 当用户访问 `/atlantic/ocean` 时，第一个 `Route` 将匹配，后续的 `Route` 将被忽略。\n2. 我们可以在 `Switch`\
  \ 的底部包含一个通配符 `Route`。如果没有任何其他 `Route` 组件匹配，它将被渲染。\n\n让我们在实践中看看这一点。为了使用 `Switch`\
  \ 组件，让我们从 `react-router` 导入 `Switch`：\n\n```javascript\nimport React from 'react';\n\
  \nimport {\n  BrowserRouter as Router,\n  Route,\n  Link,\n  Redirect,\n  Switch,\n\
  } from 'react-router'\n\nconst App = () => (\n```\n\n`routing/basics/src/complete/App-7.js`\n\
  \n我们将所有的 `Route` 组件封装在一个 `Switch` 组件中。在第一个 `Route` 上方添加 `Switch` 标签：\n\n```jsx\n\
  \ <hr />\n      <Switch>\n        <Route path='/atlantic/ocean' render={() => (\n\
  ```\n\n`routing/basics/src/complete/App-7.js`\n\n接下来，我们在现有的 `Route` 组件下方添加“通配符”\
  \ `Route`。由于我们没有指定 `path` 属性，此 `Route` 将匹配所有路径：\n\n```jsx\n        <Route render={({\
  \ location }) => (\n          <div className='ui inverted red segment'>\n      \
  \      <h3>\n              Error! No matches for <code>{location.pathname}</code>\n\
  \            </h3>\n          </div>\n        )} />\n      </Switch>\n    </div>\n\
  \  </Router>\n);\n```\n\n`routing/basics/src/complete/App-7.js`\n\n`Route` 将 `location`\
  \ 传递给渲染函数。`Route` 总是会将此传递给它的目标。我们将在本章后半部分进一步探讨。\n\n### 尝试一下\n\n保存 `App.js`。访问 `/atlantic/ocean`，注意匹配\
  \ Atlantic 的组件消失了。接下来，手动输入一个应用不存在的路径。我们的通配符 `Route` 组件将渲染：\n\n![没有匹配 `/arctic`](img/routing----basics-arctic.png)\n\
  \n没有匹配 /arctic\n\n到为止，我们已经熟悉 React Router 的基础组件。我们将应用封装在 `Router` 中，它为树中的任何 React\
  \ Router 组件提供位置和历史 API，并确保每次位置更改时我们的 React 应用都会重新渲染。`Route` 和 `Switch` 都帮助我们控制在给定位置显示哪些\
  \ React 组件。而 `Link` 和 `Redirect` 让我们能够在不加载整个页面的情况下修改应用的位置。\n\n在本章的后半部分，我们将这些基础知识应用于更复杂的应用程序中。\n\
  \n### 使用 React Router 进行动态路由\n\n在本节中，我们将基于上一节建立的基础继续构建。我们将看到 React Router 的基础组件在一个稍大的应用中是如何协作工作的，并探索在其独特的组件驱动路由范式中进行编程的几种策略。\n\
  \n\n\n\n本节中的应用包含多个页面。应用的主页有一个垂直菜单，用户可以在五个不同的音乐专辑之间进行选择。选择专辑会立即在主面板中显示专辑信息。所有专辑信息均从\
  \ [Spotify API](https://developer.spotify.com/web-api/) 获取。\n\n我们的 `React` 应用通信的服务器受需要登录的令牌（token）保护。虽然这不是一个真实的身份验证流程，但这种设置将让我们熟悉如何在需要用户登录的应用程序中使用\
  \ `React Router`。\n\n## 完成后的应用\n\n本节的代码位于 `routing/music` 。从书籍代码的根目录导航到该目录：\n\n\
  ```\n$ cd routing/music\n```\n\n让我们来看这个项目的结构：\n\n```\n$ ls\nSpotifyClient.js\nclient/\n\
  nightwatch.json\npackage.json\nserver.js\nserver.test.js\nstart-client.js\nstart-server.js\n\
  tests/\n```\n\n项目根目录下是一个 Node API 服务器（`server.js`）。在 `client` 内部是一个由 `create-react-app`\
  \ 驱动的 `React` 应用：\n\n```\n$ ls client\npackage.json\npublic/\nsemantic/\nsemantic.json\n\
  src/\n```\n\n该项目的结构与“在 create-react-app 中使用 Webpack”章节末尾的食物查找应用完全相同。在开发时，我们启动了两个服务器：`server.js`\
  \ 和 Webpack 开发服务器。Webpack 开发服务器将为我们的 `React` 应用服务。我们的 `React` 应用通过 `server.js` 接口获取特定专辑的数据。`server.js`\
  \ 反而与 Spotify API 通信以获取专辑数据：\n\n![通信图](img/routing----music-routing-diagram.png)\n\
  \n通信图\n\n让我们安装依赖并查看运行中的应用。有两个 `package.json` 文件，一个用于 `server.js`，另一个用于 `React` 应用。我们将对两者都运行\
  \ `npm i`：\n\n```\n$ npm i\n$ cd client\n$ npm i\n$ cd ..\n```\n\n我们可以在顶层目录中使用 `npm\
  \ start` 启动应用。这使用了 `Concurrently` 同时启动两个服务器：\n\n```\n$ npm start\n```\n\n在 `http://localhost:3000`\
  \ 找到应用。\n\n应用将提示你一个登录按钮。点击登录进行“登录”。我们没有被要求用户名或密码。\n\n登录后，我们可以在垂直侧边菜单看到专辑列表：\n\n\
  ![](img/routing----music-complete-please-select.png)\n\n点击这些专辑之一将使其显示在垂直侧边菜单的右侧。此外，应用的\
  \ URL 也更新了：\n\n![](img/routing----daydream-nation.png)\n\nURL 遵循方案 `/albums/:albumId`，其中\
  \ `:albumId` 是 URL 的`动态部分`。\n\n点击右上角的“注销”按钮，我们将重定向到 `/login` 登录页面。如果我们尝试通过在 URL\
  \ 栏中输入该地址手动返回 `/albums`，将被阻止访问该页面。相反，会被重定向回 `/login`。\n\n在深入研究 `React` 应用之前，让我们来看看服务器的\
  \ API。\n\n### 服务器 API\n\n### POST `/api/login`\n\n服务器提供了一个获取 API 令牌的接口 `/api/login`。端点\
  \ `/api/albums` 需要此令牌。\n\n与真实的登录接口不同，`/api/login` 不需要用户名或密码。当请求此端点时，`server.js`\
  \ 将始终返回一个硬编码的 API 令牌。该硬编码令牌是 `server` 内部的一个变量：\n\n```\n// 我们服务器验证的虚假 API 令牌\nexport\
  \ const API_TOKEN = 'D6W69PRgCoDKgHZGJmRUNA';\n```\n\nrouting/music/server.js\n\n\
  要亲自测试此端点，在服务器运行时，可以使用 `curl` 向该端点发送 POST 请求：\n\n```\n$ curl -X POST http://localhost:3001/api/login\n\
  {\n  \"success\": true,\n  \"token\": \"D6W69PRgCoDKgHZGJmRUNA\"\n}\n```\n\n`React`\
  \ 应用将此 API 令牌存储在 `localStorage` 中。`React` 将此令牌包含在后续所有 API 请求中。点击应用中的“注销”按钮将从 `React`\
  \ 和 `localStorage` 中移除令牌。用户必须再次“登录”才能访问应用。\n\n我们使用在 `client/src/Client.js` 中定义的\
  \ `Client` 库与 API 和 `localStorage` 交互。我们稍后会讨论这个库。\n\n### GET `/api/albums`\n\n`/api/albums`\
  \ 端点返回 Spotify API 为给定专辑列表提供的数据。我们为端点提供一个查询参数 `ids`，将其设置为所需的专辑 ID 列表：\n\n```\n/api/albums?ids=<id1>,<id2>\n\
  ```\n\n注意 ID 是用逗号分隔的。\n\n该端点还期望 API 令牌作为查询参数 `token` 被包含。同时包含 `ids` 和 `token` 查询参数的形式所示：\n\
  \n```\n/api/albums?ids=<id1>,<id2>&token=<token>\n```\n\n这是一个使用 `curl` 查询 `/api/albums`\
  \ 端点的示例：\n\n```\n$ curl -X GET \\\n\"http://localhost:3001/api/albums\"\\\n\"?ids=1DWWb4Q39mp1T3NgyscowF,2ANVost0y2y52ema1E9xAZ\"\
  \\\n\"&token=D6W69PRgCoDKgHZGJmRUNA\"\n```\n\n## 应用的起点\n\n完成的组件以及到达这些组件的步骤位于 `client/src/components-complete`\
  \ 下。我们将在 `client/src/components` 中编写本章剩余的代码。\n\n浏览现有代码，我们的第一站是 `index.js`。查看它的 `import`\
  \ 语句：\n\n```\nimport React from \"react\";\nimport ReactDOM from \"react-dom\";\n\
  \nimport { BrowserRouter as Router } from \"react-router-dom\";\n\nimport App from\
  \ './components/App';\n\nimport \"./styles/index.css\";\nimport \"./semantic-dist/semantic.css\"\
  ;\n\n// [STEP 1] 注释掉这一行:\nimport './index-complete';\n```\n\nrouting/music/client/src/index.js\n\
  \n注意我们在这里导入了 `Router`。\n\n和上一个项目一样，`index.js` 包含了 `index-complete` 允许我们遍历 `App`。让我们注释掉它：\n\
  \n```\n// [STEP 1] 注释掉这一行:\nimport './index-complete';\n```\n\n然后，在 `index.js` 底部取消注释\
  \ `ReactDOM.render()`。注意我们将 `<App>` 封装在 `Router` 中：\n\n```\n// [STEP 2] 取消注释这些行:\n\
  ReactDOM.render(\n  <Router>\n    <App />\n  </Router>,\n  document.getElementById(\"\
  root\")\n);\n```\n\n在 `index.js` 中将 `App` 封装在 `Router` 中是 `React Router` 应用的常见模式。\n\
  \n保存 `index.js`。随着开发服务器的运行，我们将看到一个简化版的界面：\n\n![初始 App](img/routing----music-initial.png)\n\
  \n初始 App\n\n我们的起点完全没有使用 `React Router`。应用在一个页面列出了所有专辑。有一个“注销”按钮，点击它可以更改 URL 但似乎没有任何作用。“关闭”按钮无效。\n\
  \n接下来，来看看 `App.js`：\n\n```\nimport React from 'react';\n\nimport TopBar from './TopBar';\n\
  import AlbumsContainer from './AlbumsContainer';\n\nimport '../styles/App.css';\n\
  \nconst App = () => (\n  <div className='ui grid'>\n    <TopBar />\n    <div className='spacer\
  \ row' />\n    <div className='row'>\n      <AlbumsContainer />\n    </div>\n  </div>\n\
  );\n\nexport default App;\n```\n\nrouting/music/client/src/components/App.js\n\n\
  `App` 渲染了我们的 `TopBar` 和 `AlbumsContainer`。\n\n我们现在不看 `TopBar`。\n\n`AlbumsContainer`\
  \ 是与我们的 API 交互获取专辑数据的组件。然后为每个专辑渲染 `Album` 组件。\n\n在 `AlbumsContainer` 顶部，我们定义了导入语句。我们还有一个硬编码的\
  \ `ALBUM_IDS` 列表，`AlbumsContainer` 使用它从 API 获取所需的专辑：\n\n```\nimport React, { Component\
  \ } from 'react';\n\nimport Album from './Album';\nimport { client } from '../Client';\n\
  \nconst ALBUM_IDS = [\n  '23O4F21GDWiGd33tFN3ZgI',\n  '3AQgdwMNCiN7awXch5fAaG',\n\
  \  '1kmyirVya5fRxdjsPFDM05',\n  '6ymZBbRSmzAvoSGmwAFox',\n  '4Mw9Gcu1LTJaipXdwrq1Q',\n\
  ];\n```\n\nrouting/music/client/src/components/AlbumsContainer.js\n\n`AlbumsContainer`\
  \ 是一个状态组件，有两个状态属性：\n\n*   `fetched`: `AlbumsContainer` 是否已成功从 API 获取了专辑数据\n\n* \
  \  `albums`: 所有专辑对象的数组\n\n\n\n\n通过遍历该组件，我们将从它的初始状态开始：\n\n```javascript\nclass AlbumsContainer\
  \ extends Component {\n  state = {\n    fetched: false,\n    albums: [],\n  };\n\
  ```\n\n`routing/music/client/src/components/AlbumsContainer.js`\n\n我们使用 `fetched`\
  \ 布尔值来跟踪专辑是否已从服务器获取。。\n\n当我们的 `AlbumsContainer` 组件挂载后，我们调用了 `this.getAlbums()` 函数。这会填充状态中的\
  \ `albums`：\n\n```javascript\n componentDidMount() {\n    this.getAlbums();\n  }\n\
  ```\n\n`routing/music/client/src/components/AlbumsContainer.js`\n\n在我们的 `getAlbums()`\
  \ 函数中，我们使用 `Client` 库（位于 `src/Client.js` 内部）向 API 发起请求，以获取 `ALBUM_IDS` 指定专辑的数据。我们使用了库中的\
  \ `getAlbums()` 方法，它期望一个专辑 ID 数组作为参数。\n\n当我们获取回数据时，我们更新状态，将 `fetched` 设置为 `true`\
  \ 并将 `albums` 设置为结果：\n\n```javascript\n getAlbums = () => {\n    client.setToken('D6W69PRgCoDKgHZGJmRUNA');\n\
  \    client.getAlbums(ALBUM_IDS)\n      .then((albums) => (\n        this.setState({\n\
  \          fetched: true,\n          albums: albums,\n        })\n       ));\n \
  \ };\n```\n\n`routing/music/client/src/components/AlbumsContainer.js`\n\n注意，在调用\
  \ `client.getAlbums()` 之前，我们调用了 `client.setToken()`。如前所述，我们的 API 期望在 `/api/albums`\
  \ 请求包含一个 token。由于应用程序尚未实现登录和注销功能，我们在发送请求之前手动设置 token 来“作弊”。这与 `server.js` 预期的 相同：\n\
  \n```javascript\nexport const API_TOKEN = 'D6W69PRgCoDKgHZGJmRUNA';\n```\n\n`routing/music/server.js`\n\
  \n最后，`AlbumsContainer` 的 `render` 方法根据 `this.state.fetched` 进行切换。如果数据尚未获取，我们渲染加载图标。否则，我们渲染\
  \ `this.state.albums` 中的所有专辑：\n\n```javascript\n render() {\n    if (!this.state.fetched)\
  \ {\n      return (\n        <div className='ui active centered inline loader' />\n\
  \      );\n    } else {\n      return (\n        <div className='ui two column divided\
  \ grid'>\n          <div\n            className='ui six wide column'\n         \
  \   style={{ maxWidth: 250 }}\n          >\n            {/* VerticalMenu 将放在这里 */}\n\
  \          </div>\n          <div className='ui ten wide column'>\n            {\n\
  \              this.state.albums.map((a) => (\n                <div\n          \
  \        className='row'\n                  key={a.id}\n                >\n    \
  \              <Album album={a} />\n                </div>\n              ))\n \
  \           }\n          </div>\n        </div>\n      );\n    }\n  }\n```\n\n`routing/music/client/src/components/AlbumsContainer.js`\n\
  \n我们的第一个更新是添加在应用程序完成版本中看到的垂直菜单。这个垂直菜单应该允许我们选择想要查看的专辑。当选择垂直菜单中的某个张专辑时，应该显示该专辑并将应用程序的位置更新为\
  \ `/albums/:albumId`。\n\n### 使用 URL 参数\n\n目前，我们的 `App` 组件同时渲染了 `TopBar` 和 `AlbumsContainer`：\n\
  \n```javascript\nconst App = () => (\n  <div className='ui grid'>\n    <TopBar />\n\
  \    <div className='spacer row' />\n    <div className='row'>\n      <AlbumsContainer\
  \ />\n    </div>\n  </div>\n);\n```\n\n`routing/music/client/src/components/App.js`\n\
  \n正如我们所见，我们最终会有登录和注销页面。我们可以将 `TopBar` 保留在 `App` 中，因为我们希望 `TopBar` 出现在每个页面上。由于我们希望专辑列表页出现在路由上，我们应该将\
  \ `AlbumsContainer` 嵌套在 `Route` 内部。我们将让它只在 `/albums` 渲染。这将为我们很快添加 `/login` 和 `/logout`\
  \ 做好准备。\n\n首先，在 `App.js` 内部，让我们导入 `Route` 组件：\n\n```javascript\nimport React from\
  \ 'react';\n\nimport { Route } from 'react-router-dom';\n```\n\n`routing/music/client/src/components-complete/App-1.js`\n\
  \n然后，我们将在路径 `/albums` 上使用 `Route`：\n\n```javascript\nconst App = () => (\n  <div\
  \ className='ui grid'>\n    <TopBar />\n    <div className='spacer row' />\n   \
  \ <div className='row'>\n      <Route path='/albums' component={AlbumsContainer}\
  \ />\n    </div>\n  </div>\n);\n```\n\n`routing/music/client/src/components-complete/App-1.js`\n\
  \n现在，只有当我们通过 `/albums` 访问应用程序时，`AlbumsContainer` 才会渲染。\n\n我们将让 `AlbumsContainer`\
  \ 渲染一个子组件 `VerticalMenu`。我们将让父组件（`AlbumsContainer`）向子组件（`VerticalMenu`）传递 `albums`\
  \ 列表。让我们先组合 `VerticalMenu`，然后更新 `AlbumsContainer` 来使用它。\n\n打开文件 `src/components/VerticalMenu.js`。我们将编写\
  \ `VerticalMenu` 的骨架。`VerticalMenu` 包含了：\n\n```javascript\nimport React from 'react';\n\
  \nimport '../styles.css';\n\nconst VerticalMenu = ({ albums }) => (\n  <div className='ui\
  \ vertical menu'>\n    <div className='header item'>\n      Albums\n    </div>\n\
  \    {/* 渲染菜单 */}\n  </div>\n);\n\nexport default VerticalMenu;\n```\n\n`routing/music/client/src/components/VerticalMenu.js`\n\
  \n正如我们看到的，`VerticalMenu` 期望 `albums` 属性。我们要遍历 `albums` 属性，渲染每一个 `Link`。首先，我们从 `react-router`\
  \ 导入 `Link`：\n\n```javascript\nimport React from 'react';\n\nimport { Link } from\
  \ 'react-router-dom';\n\nimport '../styles.css';\n```\n\n`routing/music/client/src/components-complete/VerticalMenu-1.js`\n\
  \n我们将使用 `map` 来组合 `Link` 组件。每个 `Link` 的 `to` 属性将是 `/albums/:albumId`：\n\n```javascript\n\
  const VerticalMenu = ({ albums }) => (\n  <div className='ui vertical menu'>\n \
  \   <div className='header item'>\n      Albums\n    </div>\n    {\n      albums.map((album)\
  \ => (\n        <Link\n          to={`albums/${album.id}`}\n          className='item'\n\
  \          key={album.id}\n        >\n          {album.name}\n        </Link>\n\
  \      ))\n    }\n  </div>\n);\n```\n\n`routing/music/client/src/components-complete/VerticalMenu-1.js`\n\
  \n我们将 `className` 设置为 `item` 以进行样式处理。我们正在使用 SemanticUI 的垂直菜单。\n\n每当用户点击菜单项，就会更新应用程序的位置。让我们更新\
  \ `AlbumsContainer` 以使用 `VerticalMenu` 并根据位置渲染单个专辑。\n\n打开 `src/components/AlbumsContainer.js`。在导入列表中添加\
  \ `VerticalMenu`：\n\n```javascript\nimport Album from './Album';\nimport VerticalMenu\
  \ from './VerticalMenu';\nimport { client } from '../Client';\n```\n\n`routing/music/client/src/components/VerticalMenu`\n\
  \n然后，在 `render` 方法内部，我们将 `VerticalMenu` 嵌套在一个列中：\n\n```javascript\n render() {\n\
  \    if (!this.state.fetched) {\n      return (\n        <div className='ui active\
  \ centered inline loader' />\n      );\n    } else {\n      return (\n        <div\
  \ className='ui two column divided grid'>\n          <div\n            className='ui\
  \ six wide column'\n            style={{ maxWidth: 250 }}\n          >\n       \
  \     <VerticalMenu\n              albums={this.state.albums}\n            />\n\
  \          </div>\n          <div className='ui ten wide column'>\n```\n\n`routing/music/client/src/components-complete/AlbumsContainer-1.js`\n\
  \n在 `AlbumsContainer` 的输出中，在 `VerticalMenu` 相邻的列中，我们现在想要渲染单个专辑而不是所有专辑列表。我们知道 `VerticalMenu`\
  \ 将根据 `/albums/:albumId` 方案修改位置。我们可以使用 `Route` 组件来匹配此模式并从 URL 中提取参数 `:apiId`。\n\n\
  在仍然 `AlbumsContainer.js` 中，首先将 `Route` 添加到组件的导入中：\n\n```javascript\nimport React,\
  \ { Component } from 'react';\n\nimport { Route } from 'react-router-dom';\n```\n\
  \n`routing/music/client/src/components-complete/AlbumsContainer-1.js`\n\n然后，在 `VerticalMenu`\
  \ 下方的 `div` 标签中，我们将替换渲染所有专辑的 `map` 调用。相反，我们将定义一个带有 `render` 属性的 `Route` 组件。我们将先完整查看它然后进行拆解：\n\
  \n\n\n\n\n```javascript\n <div className='ui ten wide column'>\n            <Route\n\
  \              path='/albums/:albumId'\n              render={({ match }) => {\n\
  \                const album = this.state.albums.find(\n                  (a) =>\
  \ a.id === match.params.albumId\n                );\n                return (\n\
  \                  <Album\n                    album={album}\n                 \
  \ />\n                );\n              }}\n            />\n          </div>\n```\n\
  \n`routing/music/client/src/components-complete/AlbumsContainer-1.js`\n\n### `path`\n\
  \n我们正在匹配的字符串是 `/albums/:albumId`。冒号 是我们告诉 React Router URL 的这部分是**动态参数**的方式。重要的是，**任何值**都会匹配这个动态参数。\n\
  \n### `render`\n\n我们在这个 `Route` 上设置了一个 `render` 属性，为一个函数。`Route` 会调用该渲染函数并传入几个参数，如\
  \ `match`。稍后我们会详细探讨 `match`。在这里，我们对 `match` 上的 `params` 属性感兴趣。\n\n`Route` 从 URL\
  \ 中提取所有的动态参数，并将它们通过 `match.params` 对象传递给目标组件。在我们的情况下，`params` 将包含属性 `albumId`，它将对应于当前\
  \ URL (`/albums/:albumId`) 中 `:albumId` 部分的值。\n\n我们使用 `find` 来获取与 `params.albumId`\
  \ 匹配的专辑，渲染单个 `Album`。\n\n用户现在可以通过 `VerticalMenu` 中的链接修改应用的位置。而 `AlbumsContainer`\
  \ 使用 `Route` 读取位置并提取所需的 `albumId`，从而渲染出所需的专辑。\n\n### 尝试一下\n\n保存 `AlbumsContainer.js`。如果应用还没有运行，请务必在顶层目录中使用\
  \ `npm start` 命令启动它：\n\n```bash\n$ npm start\n```\n\n目前，当我们在浏览器中访问 `http://localhost:3000`\
  \ 时，只有 `TopBar` 是可见的：\n\n![Nothing matches at `/`](img/routing----music-blank-root.png)\n\
  \n`/` 没有任何匹配项\n\n记得在 `App` 中，我们把 `AlbumsContainer` 包裹了一个匹配模式 `/albums` 的 `Route`\
  \ 中。由于它不匹配 `/`，因此 `App` 的正文保持为空。\n\n让我们通过在浏览器 URL 栏输入 `/albums` 手动访问该路径，我们将看到渲染\
  \ `VerticalMenu`：\n\n![`VerticalMenu` appears](img/routing----music-albums-nothing-selected.png)\n\
  \n`VerticalMenu` 出现了\n\n`VerticalMenu` 相邻的列没有渲染内容，因为该列正在等待匹配 `/albums/:albumId`\
  \ 的 URL。点击其中一个专辑会更改应用的位置：\n\n![Selecting an album](img/routing----music-selecting-pauls-boutique.png)\n\
  \n选择一个专辑\n\n我们正在取得进展！虽然“关闭”和“退出”按钮仍然不起作用，但我们可以在专辑之间切换。应用的位置会在不刷新页面的情况下更新。\n\n接下来我们来接通“关闭”按钮。\n\
  \n#### 将路径名作为属性传递\n\n在 `Album.js` 内部，我们在专辑的页头中渲染了一个“关闭”按钮：\n\n```javascript\n <div\
  \ className='six wide column'>\n          <p>\n            {\n              `By\
  \ ${album.artist.name}\n              - ${album.year}\n              - ${album.tracks.length}\
  \ songs`\n            }\n          </p>\n          <div\n            className='ui\
  \ left floated large button'\n          >\n            Close\n          </div>\n\
  ```\n\n`routing/music/client/src/components-complete/Album-1.js`\n\n为了“关闭”专辑，我们需要将应用的位置从\
  \ `/albums/:albumId` 改为 `/albums`。根据我们目前对路由的了解，我们可以创建一个链接来为我们处理这种行为，如下：\n\n```javascript\n\
  // 有效的\"close\"按钮\n<Link\n  to='/albums'\n  className='ui left floated large button'\n\
  >\n  Close\n</Link>\n```\n\n这是完全有效的。然而，我们在向应用中添加路由时，必须考虑的一个因素是灵活性。\n\n例如，如果我们想修改应用，让专辑页面存在于\
  \ `/` 而不是 `/albums` 呢？我们必须更改应用中所有对 `/albums` 的引用。\n\n更具说服力的是，如果我们想在应用中的不同位置显示专辑呢？例如，我们可能会在\
  \ `/artists/:artistId` 添加艺术家页面。用户随后可以钻取到单个专辑，打开 URL `/artists/:artistId/albums/:albumId`。在这种情况下，我们希望“关闭”按钮链接到\
  \ `/artists/:artistId` 而不是 `/albums`。\n\n保持某些灵活性的简单方法是将路径名作为属性通过应用传递。让我们来看看实际操作。\n\
  \n记得在 `App.js` 内部，我们指定 `AlbumsContainer` 的路径为 `/albums`：\n\n```javascript\n <Route\
  \ path='/albums' component={AlbumsContainer} />\n```\n\n`routing/music/client/src/components-complete/App-1.js`\n\
  \n我们刚刚看到 `Route` 调用了作为 `render` 属性传递的函数，并带有参数 `match`。`Route` 也会通过 `component` 属性渲染的组件设置此属性。无论\
  \ `Route` 如何渲染它的组件，它始终会设置三个属性：\n\n* `match`\n* `location`\n* `history`\n\n根据 [React\
  \ Router 文档](https://reacttraining.com/react-router/)，`match` 对象包含以下属性：\n\n* `params`\
  \ (object) 从 URL 中解析的、对应于动态段的键值对\n* `isExact` (boolean) 如果整个 URL 匹配（没有末尾字符），则为 true\n\
  * `url` (string) URL 的匹配部分。此用于构建嵌套链接\n* `path` (string) 用于匹配的路径模式\n\n我们感兴趣的是 `path`。在\
  \ `AlbumsContainer` 中，`this.props.match.path` 将是 `/albums`。之前，`path` 属性是 `/albums/:albumId`。\n\
  \n首先，让我们声明一个新变量 `matchPath`：\n\n```javascript\nrender() {\n    if (!this.state.fetched)\
  \ {\n      return (\n        <div className='ui active loader' />\n      );\n  \
  \  } else {\n      const matchPath = this.props.match.path\n```\n\n`routing/music/client/src/components-complete/AlbumsContainer.js`\n\
  \n然后，我们可以更改 `Route` 的 `path` 属性以使用这个变量：\n\n```javascript\n <div className='ui ten\
  \ wide column'>\n            <Route\n              path={`${matchPath}/:albumId`}\n\
  \              render={({ match }) => {\n                const album = this.state.albums.find(\n\
  \                  (a) => a.id === match.params.albumId\n                );\n  \
  \              return (\n                  <Album\n                    album={album}\n\
  \                    albumsPathname={matchPath}\n                  />\n        \
  \        );\n              }}\n            />\n```\n\n通过这种方法，`AlbumsContainer` 不对其位置做任何假设。例如，我们可以更新\
  \ `App` 使 `AlbumsContainer` 匹配 `/` 而不是 `/albums`，而 `AlbumsContainer` 不需要任何更改。\n\n\
  我们希望 `Album` 中的“关闭”按钮链接到同一个路径。“关闭”专辑意味着将位置回到 `/albums`。让我们将属性向下传递 `Album`：\n\n那么，在\
  \ `Album.js` 中，我们从 props 对象中提取 `albumsPathname`：\n\n```javascript\nconst Album =\
  \ ({ album, albumsPathname }) => (\n```\n\n`routing/music/client/src/components-complete/Album.js`\n\
  \n现在，我们可以将 `div` 元素更改为 `Link` 组件。我们将 `to` 属性设置为 `albumsPathname`：\n\n```javascript\n\
  \ <div className='six wide column'>\n          <p>\n            {\n            \
  \  `By ${album.artist.name}\n              - ${album.year}\n              - ${album.tracks.length}\
  \ songs`\n            }\n          </p>\n          <Link\n            to={albumsPathname}\n\
  \            className='ui left floated large button'\n          >\n           \
  \ Close\n          </Link>\n</div>\n```\n\n让我们将相同的方法应用于 `VerticalMenu`。切换回 `AlbumsContainer.js`。我们将\
  \ `albumsPathname` 属性传递给 `VerticalMenu`。\n\n\n\n\n\n```jsx\n <div\n            className='ui\
  \ six wide column'\n            style={{ maxWidth: 250 }}\n          >\n       \
  \     <VerticalMenu\n              albums={this.state.albums}\n              albumsPathname={matchPath}\n\
  \            />\n          </div>\n```\n\n`routing/music/client/src/components-complete/AlbumsContainer-2.js`\n\
  \n现在我们可以使用这个 prop 来为 `Link` 构建 `to` 属性：\n\n```jsx\nconst VerticalMenu = ({ albums,\
  \ albumsPathname }) => (\n  <div className='ui secondary vertical menu'>\n    <div\
  \ className='header item'>\n      Albums\n    </div>\n    {\n      albums.map((album)\
  \ => (\n        <Link\n          to={`${albumsPathname}/${album.id}`}\n        \
  \  className='item'\n          key={album.id}\n        >\n          {album.name}\n\
  \        </Link>\n      ))\n    }\n  </div>\n);\n```\n\n`routing/music/client/src/components-complete/VerticalMenu-2.js`\n\
  \n通过隔离指定路径名称的地方，我们使应用程序在未来的路由更改中更具灵活性。通过这次更新，我们应用程序中指定路径 `/albums` 的唯一地方是在 `App`\
  \ 组件中。\n\n### 尝试一下\n\n保存 `Album.js`。在应用运行期间，访问 `/albums`。点击某个专辑会打开它。点击“Close”将通过位置改回\
  \ `/albums` 来关闭它。\n\n既然“Close”按钮可以工作，在继续实现登录和注销之前，我们可以进行一项界面上的改进。\n\n当专辑打开时，如果侧边栏能指示哪个专辑处于激活状态，那就太好了：\n\
  \n![VerticalMenu 通过浅色高亮显示激活的专辑](img/routing----music-vert-menu-indicates-active.png)\n\
  \n`VerticalMenu` 通过浅色高亮显示哪个专辑处于激活。\n\n我们将在下一步解决这个问题。\n\n### 使用 `NavLink` 实现动态菜单项\n\
  \n目前，我们垂直菜单中的所有菜单项都有类 `item`。在 SemanticUI 的垂直菜单中，我们可以将激活项的类设置为 `active item`，使其以高亮形式显示。\n\
  \n我们如何知道一个专辑是否是“激活”的呢？这个状态维护在 URL 中。如果专辑的 `id` 与 URL 中的 `:albumId` 匹配，我们就知道该专辑是激活状态的。\n\
  \n鉴于此，我们可以设计出以下解决方案：\n\n```jsx\nalbums.map((album) => {\n  const to = `${albumsPathname}/${album.id}`;\n\
  \  const active = window.location.pathname === to;\n  return (<Link\n    to={to}\n\
  \    className={active ? 'active item' : 'item'}\n    key={album.id}\n  >\n    {album.name}\n\
  \  </Link>\n  )\n})\n```\n\n我们通过浏览器的 `window.location` API 获取 URL 的 pathname。如果浏览器的位置与链接匹配，我们就将其类设置为\
  \ `active item`。\n\n为激活链接设置样式是一个常见需求。虽然上面的解决方案有效可行，但 `react-router` 提供了一个内置的策略来处理这种情况的状况。\n\
  \n我们可以使用另一个链接组件 `NavLink`。`NavLink` 是 `Link` 的一个特殊版本，专门为此目的而设计。当 `NavLink` 组件的目标位置匹配当前\
  \ URL 时，它将为渲染的元素添加样式属性。\n\n我们可以这样使用 `NavLink`：\n\n```jsx\n <NavLink\n          to={`${albumsPathname}/${album.id}`}\n\
  \          activeClassName='active'\n          className='item'\n          key={album.id}\n\
  \        >\n```\n\n`routing/music/client/src/components-complete/VerticalMenu-3.js`\n\
  \n当 `NavLink` 的 `to` 属性匹配当前位置时，应用到元素上的类将是 `className` 和 `activeClassName` 的组合。在这里，这将如愿渲染类\
  \ `active item`。\n\n在这种情况下，我们不需要设置 `activeClassName` 属性。`activeClassName` 的默认值为字符串\
  \ `'active'`。因此，我们可以省略它。\n\n在文件顶部导入 `NavLink`：\n\n```jsx\nimport { NavLink } from\
  \ 'react-router-dom';\n```\n\n`routing/music/client/src/components-complete/VerticalMenu.js`\n\
  \n然后将 `Link` 替换为 `NavLink`：\n\n```jsx\nconst VerticalMenu = ({ albums, albumsPathname\
  \ }) => (\n  <div className='ui secondary vertical menu'>\n    <div className='header\
  \ item'>\n      Albums\n    </div>\n    {\n      albums.map((album) => (\n     \
  \   <NavLink\n          to={`${albumsPathname}/${album.id}`}\n          className='item'\n\
  \          key={album.id}\n        >\n          {album.name}\n        </NavLink>\n\
  \      ))\n    }\n  </div>\n);\n```\n\n`routing/music/client/src/components-complete/VerticalMenu.js`\n\
  \n`NavLink` 让链接样式设置变得简单。当你需要此功能时使用 `NavLink`，当不需要时坚持使用 `Link`。\n\n### 尝试一下\n\n保存\
  \ `VerticalMenu.js`。在我们的浏览器中，垂直菜单现在将用灰色背景反映激活的专辑：\n\n![菜单高亮激活专辑](img/routing----music-murmur-active.png)\n\
  \n菜单高亮激活专辑。\n\n在继续登录和注销之前，让我们处理最后一件事。`AlbumsContainer` 匹配 `/albums`。如果用户访问 `/`，如果他们被重定向到\
  \ `/albums` 就太好了。\n\n### 为根路径添加重定向\n\n在 `App.js` 内部，我们首先导入 `Redirect`：\n\n```jsx\n\
  import { Route, Redirect } from 'react-router-dom';\n```\n\n`routing/music/client/src/components-complete/App.js`\n\
  \n然后我们将 `Redirect` 组件添加到输出中：\n\n```jsx\n <div className='row'>\n      <Route path='/albums'\
  \ component={AlbumsContainer} />\n\n      <Route exact='/' render={() => (\n   \
  \     <Redirect\n          to='/albums'\n        />\n      )} />\n    </div>\n```\n\
  \n`...//App.js`\n\n记得 `exact` 属性在这里是必要的。否则，`/` 将匹配每一个路由。\n\n### 尝试一下\n\n保存 `App.js`。在你的浏览器中，访问\
  \ `/` 将重定向到 `/albums` 并渲染垂直菜单。\n\n我们已经看到了一些 React Router 在一个稍微复杂的界面中工作的情况：\n\n*\
  \   我们根据动态 URL 匹配了组件\n*   我们使用了一些 `match` 参数来设置标记\n*   我们使用 `NavLink` 来渲染带样式的元素\n\
  \n让我们更进一步。在下一节中，我们将为应用程序实现伪身份验证系统。我们将探索防止用户在未登录的情况下访问某些位置的策略。\n\n### 支持路由\n\n正如我们之前探索\
  \ `/api/albums` 端点时看到的，该端点需要令牌才能访问。目前，我们通过在 `getAlbums()` 中的每次请求之前手动设置令牌来作弊：\n\n\
  ```jsx\n getAlbums = () => {\n    client.setToken('D6W69PRgCoDKgGJmRUNA');\n   \
  \ client.getAlbums(ALBUM_IDS)\n}\n```\n\n`routing/music/client/src/components-complete/AlbumsContainer-2.js`\n\
  \n为了模拟真实的身份验证流程，我们想要从客户端移除令牌字符串。相反，应该让应用程序向 API 的 `/api/login` 端点发送请求。正如我们看到的，为了简单我们的\
  \ API 不需要用户名或密码。但模拟真实的登录端点，它将返回一个我们可以存储并在后续请求使用的令牌。\n\n#### Client 库\n\n与应用程序打包在一起的是\
  \ `client/src/Client.js` 中的客户端库。`Client` 库包含了与服务器 API 交互所需的方法。\n\n`Client` 库有一个方法\
  \ `login()`，它将执行对 `/api/login` 的请求并存储令牌。此 `login()` 函数执行请求，检查状态是否为预期的 `201`，解析 `json`\
  \ 响应值，并使用 `setToken()` 函数存储令牌：\n\n```jsx\n login() {\n    return fetch('/api/login',\
  \ {\n      method: 'post',\n      headers: {\n        accept: 'application/json',\n\
  \      },\n    }).then(this.checkStatus)\n      .then(this.parseJson)\n      .then((json)\
  \ => this.setToken(json.token));\n  }\n```\n\n`routing/music/client/src/Client.js`\n\
  \n`setToken()` 将令牌存储在 `localStorage` 中。\n\n\n\n\n\n```javascript\n setToken(token)\
  \ {\n    this.token = token;\n\n    if (this.useLocalStorage) {\n      localStorage.setItem(LOCAL_STORAGE_KEY,\
  \ token);\n    }\n  }\n```\n\n`routing/music/client/src/Client.js`\n\n当应用加载时，`Client`\
  \ 首先尝试从 `localStorage` 加载 token。token 会永久存储在 `localStorage` 中，且没有过期时间。因此，用户只有在执行退出操作时才会从我们的应用中注销。\n\
  \n要退出登录，我们可以使用 `Client` 库实现的 `logout()` 函数：\n\n```javascript\n logout() {\n    this.removeToken();\n\
  \  }\n```\n\n`routing/music/client/src/Client.js`\n\n`removeToken()` 会将空 token 并将其从\
  \ `localStorage` 中移除：\n\n```javascript\n removeToken() {\n    this.token = null;\n\
  \n    if (this.useLocalStorage) {\n      localStorage.removeItem(LOCAL_STORAGE_KEY);\n\
  \    }\n  }\n```\n\n`routing/music/client/src/Client.js`\n\n在了解了我们将在 `Client` 中使用的函数后，让我们从添加一个新的登录组件开始。\n\
  \n### 实现登录\n\n正如我们在完成版应用中看到的，`Login` 组件显示单个的“Login”（登录）按钮。点击此按钮将触发登录过程。我们希望在登录进行期间显示加载指示器：\n\
  \n![在 `Login` 中点击“Login”按钮](img/routing----music-login-component.png)\n\n在 `Login`\
  \ 中点击“Login”按钮\n\n打开 `Login.js`。该文件包含了该组件的骨架。我们将使用状态属性 `loginInProgress` 来指示登录是否正在进行。我们将使用状态中的另一个属性\
  \ `shouldRedirect` 来指示登录过程是否已完成以及组件是否应该重定向到 `/albums`。现在让我们声明初始状态和 `performLogin()`\
  \ 函数：\n\n```javascript\nclass Login extends Component {\n  state = {\n    loginInProgress:\
  \ false,\n    shouldRedirect: false,\n  };\n\n  performLogin = () => {\n    this.setState({\
  \ loginInProgress: true });\n    client.login().then(() => (\n      this.setState({\
  \ shouldRedirect: true })\n    ));\n  };\n```\n\n`routing/music/client/src/components-complete/Login-1.js`\n\
  \n我们将状态属性 `loginInProgress` 和 `shouldRedirect` 初始设置为 `false`。\n\n在 `performLogin()`\
  \ 中，我们首先将 `loginInProgress` 切换为 `true`。当 `client.login()` 完成时，我们将状态属性 `shouldRedirect`\
  \ 切换为 `true`。我们不需要将 `loginInProgress` 切回 `false`，因为组件将立即进行重定向。\n\n在 `render()` 中，我们首先检查组件是否应该重定向。如果是，我们渲染一个\
  \ `Redirect` 组件。否则，我们可以使用 `loginInProgress` 来决定显示“Login”按钮还是加载指示器：\n\n```javascript\n\
  \ render() {\n    if (this.state.shouldRedirect) {\n      return (\n        <Redirect\
  \ to='/albums' />\n      );\n    } else {\n      return (\n        <div className='ui\
  \ one column centered grid'>\n          <div className='ten wide column'>\n    \
  \        <div\n              className='ui raised very padded text container segment'\n\
  \              style={{ textAlign: 'center' }}\n            >\n              <h2\
  \ className='ui green header'>\n                Fullstack Music\n              </h2>\n\
  \              {\n                this.state.loginInProgress ? (\n             \
  \     <div className='ui active centered inline loader' />\n                ) :\
  \ (\n                  <div\n                    className='ui large green submit\
  \ button'\n                    onClick={this.performLogin}\n                  >\n\
  \                    Login\n                  </div>\n                )\n      \
  \        }\n            </div>\n          </div>\n        </div>\n      );\n   \
  \ }\n  }\n  }\n```\n\n`routing/music/client/src/components-complete/Login-1.js`\n\
  \n保存 `Login.js`。为了测试 `Login`，我们需要添加我们的 `Logout` 组件。\n\n注销不需要 API 请求。我们只需要调用 `client.logout()`，它会立即移除本地存储的\
  \ token。我们可以在 `constructor()` 中执行此调用。然后我们将重定向到登录路径，即 `/login`。\n\n首先，在 `Logout.js`\
  \ 内部，从 `react-router` 导入 `Redirect`：\n\n```javascript\nimport React, { Component\
  \ } from 'react';\n\nimport { Redirect } from 'react-router-dom';\n```\n\n`routing/music/client/src/components-complete/Logout.js`\n\
  \n然后我们将填充 `Logout` 组件：\n\n```javascript\nclass Logout extends Component {\n\n  constructor(props)\
  \ {\n    super(props);\n\n    client.logout();\n  }\n\n  render() {\n    return\
  \ (\n      <Redirect\n        to='/login'\n      />\n    );\n  }\n}\n```\n\n`routing/music/client/src/components-complete/Logout.js`\n\
  \n保存 `Logout.js`。将 `Login` 和 `Logout` 组合后，我们只需要将它们添加到 `App` 中。\n\n首先，我们导入这些组件：\n\
  \n```javascript\n// `App.js` 顶部\nimport TopBar from './TopBar';\nimport AlbumsContainer\
  \ from './AlbumsContainer';\nimport Login from './Login';\nimport Logout from './Logout';\n\
  ```\n\n然后我们为它们中的每一个添加 `Route` 组件：\n\n```javascript\n <div className='row'>\n   \
  \   <Route path='/albums' component={AlbumsContainer} />\n\n      <Route path='/login'\
  \ component={Login} />\n      <Route path='/login' component={Logout} />\n\n   \
  \   <Route path='/' render={() => (\n        <Redirect to='/albums' />\n      )}\
  \ />\n    </div>\n```\n\n\n\n\n如果用户访问了另一个页面，例如 `/albums/1DWWb` 会发生什么？在这种情况下，我们也应该将用户重定向到\
  \ `/login`。而且当登录完成后，最好的体验是将用户重定向回他们来源的地方（`/albums/1DWWb`）。\n\n我们将逐一解决这些问题。\n\n###\
  \ PrivateRoute，高阶组件（higher-order component）\n\n如果用户访问 `/albums` 下的页面且未登录，我们希望将他们重定向到登录页面。\n\
  \n使用客户端库的 `isLoggedIn()`，我们可以在 `AlbumsContainer` 中实现如下代码：\n\n```\n// 在 AlbumsContainer\n\
  render() {\n  // 这样的代码可以正常工作\n  if (!client.isLoggedIn()) {\n    return (\n    \
  \  <Redirect to='/login' />\n    );\n  }\n}\n```\n\n这对于我们目前的需求来说运行良好。但随着应用程序的增长，我们可能需要将许多页面及其包含的组件包裹上这种重定向。\n\
  \n这正是 React Router 的组合性（composability）大显身手的地方。因为 React Router 中的所有内容都是组件，我们可以编写高阶组件，用自定义功能包裹\
  \ React Router 的元素。\n\n高阶组件是一个包裹了另一个组件的 React 组件。这种模式是扩展或更改现有组件功能的的一种强大机制。\n\n正如我们在编写\
  \ `Route` 时所看到的，该组件就是高阶组件的一个示例。\n\n在这种情况下，我们可以编写一个新组件 `PrivateRoute`。`PrivateRoute`\
  \ 将就像是我们自定义口味的 `Route` 组件。正如我们将看到的，我们将使用它来扩展并聚焦于 `Route` 的功能。我们可以在应用程序中任何想要断言用户已登录的地方，将其与\
  \ `Route` 互换。在底层，它将同时使用 `Route` 和 `Redirect` 来操作。\n\n打开 `App.js`。让我们导入并使用 `PrivateRoute`\
  \ 看看使用它后会是什么什么样。然后我们来构建该组件。\n\n在 `App.js` 顶部导入它：\n\n```\nimport TopBar from './TopBar';\n\
  import PrivateRoute from './PrivateRoute';\nimport AlbumsContainer from './AlbumsContainer';\n\
  import Login from './Login';\nimport Logout from './Logout';\n```\nrouting/music/client/src/components-complete/App-5.js\n\
  \n我们希望 `PrivateRoute` 具有与 `Route` 相同的接口。`/albums` 将是唯一需要用户登录的路由。对于 `/albums`，我们将\
  \ `Route` 替换为 `PrivateRoute`：\n\n```\n <Switch>\n        <PrivateRoute path='/albums'\
  \ component={AlbumsContainer} />\n        <Route path='/login' component={Login}\
  \ />\n        <Route path='/logout' component={Logout} />\n```\nrouting/music/client/src/components-complete/App-5.js\n\
  \n打开 `PrivateRoute.js`。该组件的脚架已经存在。\n\n再次，高阶组件是返回包裹了新功能的组件的函数。为了理解这一点，让我们考虑一下如果 `PrivateRoute`\
  \ 只返回 `Route`，那么它会是什么样。这种实现与直接使用 `Route` 相同：\n\n```\nconst PrivateRoute = (props)\
  \ => (\n  <Route {...props} />\n);\n```\nrouting/music/client/src/components-complete/PrivateRoute-1.js\n\
  \n在例例中，`PrivateRoute` 返回一个 `Route` 组件，并将其所有的 props 传递给 `Route`。虽然没用，但这个版本的 `PrivateRoute`\
  \ 是高阶组件最简单的实现。\n\n由于 `PrivateRoute` 所做的只是渲染一个 `Route` 组件，如果你保存 `PrivateRoute.js`\
  \ 并重新加载应用，一切都将像以前一样运行。\n\n我们最终想要做的是让我们的组件要么渲染传递给 `PrivateRoute` 的组件（prop `component`），要么在用户未登录时重定向。类似于：\n\
  \n```\nconst PrivateRoute = (props) => (\n  <Route {...props} render={(props) =>\
  \ (\n    client.isLoggedIn() ? (\n      // 渲染组件\n      todo\n    ) : (\n      //\
  \ 渲染重定向\n      todo\n    )\n  )} />\n);\n```\nrouting/music/client/src/components-complete/PrivateRoute-2.js\n\
  \n我们像以前一样将所有的 props 传递给 `Route`。但这次我们指定了一个 `render` 函数。记住，你既可以在 `Route` 上设置 `component`\
  \ 属性，也可以向 `render` 传递一个函数。\n\n在这个 render 函数内部，我们将切换 `client.isLoggedIn()`。这个布尔值将告诉我们应该渲染传递给\
  \ `PrivateRoute` 的组件，还是执行重定向。\n\n这里是实现此点的方法之一。首先，我们可以使用解构语法来获取我们的参数：\n\n```\nconst\
  \ PrivateRoute = ({ component, ...rest }) => (\n```\nrouting/music/client/src/components-complete/PrivateRoute-3.js\n\
  \n我们获取 `component` 属性，然后使用扩展语法获取 `...rest`，它是设置在 `PrivateRoute` 上的所有剩余属性。\n\n接下来，我们将所有的\
  \ props (`rest`) 传递给 `Route`：\n\n```\nconst PrivateRoute = ({ component, ...rest\
  \ }) => (\n  <Route {...rest} render={(props) => (\n```\nrouting/music/client/src/components-complete/PrivateRoute-3.js\n\
  \n如果用户已登录，我们想要渲染该组件：\n\n```\n <Route {...rest} render={(props) => (\n    client.isLoggedIn()\
  \ ? (\n      React.createElement(component, props)\n    ) : (\n```\nrouting/music/client/src/components-complete/PrivateRoute-3.js\n\
  \n否则，我们想要执行重定向：\n\n```\n ) : (\n      <Redirect to={{\n        pathname: '/login',\n\
  \      }} />\n    )\n```\nrouting/music/client/src/components-complete/PrivateRoute-3.js\n\
  \n我们的 `PrivateRoute` 组件完整写法如下：\n\n```\nconst PrivateRoute = ({ component, ...rest\
  \ }) => (\n  <Route {...rest} render={(props) => (\n    client.isLoggedIn() ? (\n\
  \      React.createElement(component, props)\n    ) : (\n      <Redirect to={{\n\
  \        pathname: '/login',\n      }} />\n    )\n  )} />\n);\n```\nrouting/music/client/src/components-complete/PrivateRoute-3.js\n\
  \n保存 `PrivateRoute.js`。由于我们已经在 `App` 中使用了该组件来匹配 `/albums`，准备准备中测试它。\n\n#### 测试一下\n\
  \n在应用打开的情况下，执行以下步骤以验证情况：\n\n1. 点击右上角的“Logout”按钮\n2. 我们被重定向到了 `/login`\n3. 现在，访问\
  \ `/albums` 时应用应该重定向到 `/login`\n4. 当我们登录后，将被重定向到 `/albums`\n\n我们几乎已经完成了所有连接工作。还有一个我们之前提到过的很好的部分。\n\
  \n### 重定向状态（Redirect state）\n\n如果用户访问了由于他们未登录而无法访问的页面，我们将他们重定向到 `/login`。当他们登录时，我们应该把他们送到他们来的页面。为了实现这一点，`Login`\
  \ 需要一种方式知道用户来自哪里。\n\nReact Router 的 `Redirect` 允许我们在执行重定向时设置某些状态。该状态将在位置可用。我们可以让\
  \ `PrivateRoute` 中的 `Redirect` 根据用户的位置设置此状态。我们将看到如何让 `Login` 读取此状态以确定将用户发送到哪里。\n\
  \n打开 `PrivateRoute.js`。在 `Redirect` 中传递此 `state` 如下：\n\n```\n <Redirect to={{\n\
  \        pathname: '/login',\n        state: { from: props.location },\n      }}\
  \ />\n```\nrouting/music/client/src/components-complete/PrivateRoute.js\n\n我们可以将状态设置为任何我们。我们将\
  \ `from` 属性设置为重定向之前的应用位置。因此，如果用户尝试访问 `/albums/1DWWb4Q39mp1T3NgyscowF`，`state.from`将被设置为值。\n\
  \n现在，让我们在 `Login.js` 中使用此状态来决定用户登录后重定向到哪里。\n\n`state` 将通过 `Route` 提供的 `location`\
  \ 属性提供给我们。让我们在 `Login` 组件上创建一个新的类函数，命名为 `redirectPath()` 来读取此状态：\n\n```\n redirectPath\
  \ = () => {\n    const locationState = this.props.location.state;\n    const pathname\
  \ = (\n      locationState && locationState.from && locationState.from.pathname\n\
  \    );\n    return pathname || '/albums';\n  };\n\n  render() {\n```\n\n\n\n\n\
  `routing/music/client/src/components-complete/Login.js`\n\n此函数读取位置的 `state` 变量。如果它发现\
  \ `from` 属性，它将返回该字符串。否则，它将默认为 `/albums`。\n\n现在我们可以在 `Redirect` 中使用它了：\n\n```javascript\n\
  \ if (this.state.shouldRedirect) {\n      return (\n        <Redirect to={this.redirectPath()}\
  \ />\n```\n\n`routing/music/client/src/components-complete/Login.js`\n\n### 尝试一下\n\
  \n既然我们已经在重定向中包含了状态，那么未登录的用户在登录后将被引导到他们之前尝试访问的那个页面。\n\n要测试这一点，我们在浏览器中执行以下操作：\n\n\
  1. 访问其中一个专辑。\n2. 复制完整 URL（例如 `http://localhost:3000/albums/23O4F21GDWiGd33tFN3ZgI`）。\n\
  3. 点击“退出”（Logout）。\n4. 粘贴完整 URL 并按回车（我们也可以按后退键）。\n5. 我们的浏览器尝试访问一个受 `PrivateRoute`\
  \ 保护的页面。我们被重定向到了 `/login`。\n6. 点击“登录”（Login）按钮。\n7. 登录完成后，我们没有重定向到 `/albums`，而是被重定向到了我们之前尝试访问的位置。\n\
  \n### 总结\n\n在本章中，我们看到了如何使用 React Router 的组件为我们的 Web 应用提供快速的、基于 JavaScript 的导航。我们可以防止用户浏览器在站点之间导航时进行全页加载。我们可以构建可以共享的用户友好型\
  \ URL。而且对应用程序增加的复杂度微乎其微。\n\nReact Router 的声明式、组件驱动的范式在路由领域是独一无二的。虽然这通常意味着我们必须重新思考路由解决方案，但回报是我们可以使用熟悉的\
  \ React 组件。这限制了 React Router API 的暴露面，并尽可能地减少了任何“魔法”。\n\n### 进阶阅读\n\n[React Router\
  \ 文档](https://reacttraining.com/react-router/) 包含了针对各种 React Router 概念的多个示例。在编写时，示例包含了查询参数和歧义路由匹配等常见模式。所有这些示例都是建立在本章建立的基础之上的。\n\
  \n# 第二部分\n\n## Flux 和 Redux 简介\n\n### 为什么用 Flux？\n\n在目前为止的项目中，我们都在 React 组件内部管理状态。顶层\
  \ React 组件管理我们的主要状态。在这种类型的数据架构中，数据向下流到子组件。要对状态更改，子组件通过调用属性函数（prop-functions）将事件向上传播给父组件。任何状态变更都发生在顶层，然后再次向下流动。\n\
  \n使用 React 组件管理应用状态对于各种应用程序都很好。然而，随着应用规模和复杂性的增加，在 React 组件内部管理状态（或 ``组件状态范式`）可能会变得繁琐。\n\
  \n一个常见的痛点是**用户交互与状态变化之间的紧耦合**。对于复杂的 Web 应用，通常单个用户交互可以影响状态的许多不同离散部分。\n\n例如，考虑一个管理电子邮件的应用程序。点击封邮件必须：\n\
  \n1. 将“收件箱视图”（邮件列表）替换为“邮件视图”（用户点击的邮件）\n2. 在本地将邮件标记为已读\n3. 在本地减少总未读计数器\n4. 更改浏览器的\
  \ URL\n5. 发送网络请求在服务器上将邮件标记为已读\n\n顶层组件中处理用户点击邮件的函数必须描述发生的所有状态变化。这使得一个函数承载了大量的复杂性和责任。穿过所有管理应用状态树中许多离散部分的逻辑，会使更新变得难以管理且容易出错。\n\
  \nFacebook 在其应用中遇到了这类以及其他架构问题。这促使他们发明了 Flux。\n\n### Flux 是一种设计模式\n\nFlux 是一种设计模式。Flux\
  \ 在 Facebook 的前身是另一种设计模式，[模型-视图-控制器](https://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller)\
  \ (MVC)。MVC 是适用于桌面和 Web 应用流行的设计模式。\n\n在 MVC 中，用户与视图（View）的交互会触发控制器（Controller）中的逻辑。控制器指示模型（Model）如何更新自己。模型更新后，视图重新渲染。\n\
  \n虽然 React 并不像传统的 MVC 实现那样拥有三个独立的“执行者”，但它面临着用户交互与状态变化之间相同的耦合问题。\n\n### Flux 概述\n\
  \nFlux 设计模式由四部分组成，组织成单向数据流水线：\n\n![Flux 图](img/5-intro-to-flux----flux-diagram.png)\n\
  \nFlux 图\n\n视图（view）分发（dispatches）描述发生了什么的动作（actions）。存储器（store）接收这些动作并确定应该发生哪些状态变化。状态更新后，新状态被推送到视图。\n\
  \n回到我们的邮件示例，在 Flux 中，我们不再有一个单一函数来处理邮件点击并描述所有状态变化。相反，React 通过一个动作（`action`）通知 store\
  \ 用户点击了某封邮件。正如我们我们在接下来的几章中看到的，我们可以组织 store，使得状态的每个离散部分都有自己处理更新的独立逻辑。\n\n除了解耦交互处理和状态变化外，Flux\
  \ 还还提供了以下优势：\n\n**拆分状态管理逻辑**\n\n随着状态树的部分变得相互依赖，应用的大部分状态通常会汇总到顶层组件。Flux 减轻了顶层组件的状态管理负担，并允许你将状态拆分为隔离的、更小的且可测试的部分。\n\
  \n**React 组件变得更简单**\n\n某些组件管理的状态是可以的，例如鼠标悬停激活按钮。但通过外部管理所有其他状态，React 组件变成了简单的渲染函数。这使得它们更小、更易理解且更具组合性。\n\
  \n**状态树与 DOM 树之间的不匹配**\n\n通常，我们希望存储状态的方式与我们显示的方式不同。例如，我们可能希望应用存储邮件的时间戳（`createdAt`），但在视图中我们希望显示人类友好的表示，如“23\
  \ 分钟前”。与其让组件持有这些*派生数据的*计算逻辑，我们将看到 Flux 如何向 React 组件提供状态之前执行这些计算。\n\n在此之前，我们将在应用程序中实现\
  \ Flux 设计模式。\n\n### Flux 实现\n\nFlux 是一种设计模式，而不是特定的库或实现。Facebook [开源了他们使用的库](https://github.com/facebook/flux)。该库提供了分发器（dispatcher）和存储器（store）的接口。\n\
  \n但 Facebook 的实现并不是唯一选择。自从 Facebook 向社区分享 Flux 以来，社区通过编写[大量的不同的 Flux 实现](https://github.com/voronianski/flux-comparison)\
  \ 作为回应。开发者有很多吸引人的选择。\n\n虽然可选的选择让人目不应接，但有一个社区宠儿脱颖而出：[Redux](https://github.com/reactjs/redux)。\n\
  \n### Redux\n\nRedux 在 React 社区获得了广泛的关注和尊重。该库甚至赢得了[Flux 创建者的背书](https://twitter.com/jingc/status/616608251463909376)。\n\
  \nRedux 最好的特性是它的简单性。去掉注释和健全性检查后，Redux 只有大约 100 行代码。\n\n正由于这种简单性，在本章中，我们将自己实现 Redux\
  \ 核心库。\n\n\n\n\n在接下来的章节中，我们将在此基础上构建一个与 Facebook 相似的、功能丰富的消息应用程序。我们将看到使用 `Redux`\
  \ 作为应用程序的核心框架如何使我们的应用能够处理日益增加的功能复杂度。\n\n## Redux 的核心思想\n\n在本章中，我们将熟悉 Redux 的每一个核心思想。这些思想是：\n\
  \n* 你的应用程序的所有数据都存储在一个名为 `state` 的单一数据结构中，并存储在 `store` 中\n* 你的应用程序从这个 `store` 中读取\
  \ `state`\n* `state` 永远不会在 `store` 外部被直接修改\n* 视图（`views`）发出描述发生了什么的 `actions`\n\
  * 通过一个名为 `reducer` 的函数，将旧状态（`old state`）和 action 结合，创建一个新状态（`new state`）\n\n这些核心思想目前可能有些晦懂，但在本章中，你将逐渐理解其中的每一个项。\n\
  \n## 构建计数器\n\n我们将通过构建一个简单的计数器来探索 Redux 的核心思想。目前，我们只关注 `Redux` 和状态管理。稍后我们将看到 `Redux`\
  \ 如何连接到 React 视图。\n\n### 准备\n\n在随书下载的代码包中，导航到 `redux/counter`：\n\n```\n$ cd redux/counter\n\
  ```\n\n计数器的所有代码将放在 `app.js` 中。\n\n由于我们开始关注的是 `Redux` 和状态管理，我们将在终端中运行代码而不是浏览器。\n\n\
  两个项目的 `package.json` 都包含 `babel-cli` 软件包。正如我们在下方的**尝试一下**部分中所指出的，我们将使用来自 `babel-cli`\
  \ 自带的 `babel-node` 命令来运行代码示例：\n\n```\n# 使用 `babel-node` 在终端运行代码的示例\n$ ./node_modules/.bin/babel-node\
  \ app.js\n```\n\n现在在 `redux/counter` 内部运行 `npm install` 安装 `babel-cli`：\n\n```bash\n\
  $ npm install\n```\n\n### 概述\n\n我们的状态将是一个数字。该数字初始为 `0`。我们的 action 将是增加（`increment`）或减少（`decrement`）状态。从我们的\
  \ Redux 图中，视图会将这些 action 分发（dispatch）到 store：\n\n![视图发出“增加”动作](img/5-intro-to-flux----increment-dispatch.png)\n\
  \n视图发出“增加”动作\n\n当 store 接收到来自视图的 action 时，store 使用 `reducer function` 处理该 action。store\
  \ 为 reducer 函数提供当前状态和 action。reducer 函数返回新状态：\n\n```javascript\n// 在 store 内部，接收来自视图的\
  \ `action`\nstate = reducer(state, action);\n```\n\n例如，考虑一个当前状态为 `5` 的 store。store\
  \ 接收到一个增加动作。store 使用它的 reducer 推导出下一个状态：\n\n![示例 store 内部](img/5-intro-to-flux----reducer-inside-store-ex.png)\n\
  \n示例 store 内部\n\n我们将通过构建 reducer 开始构建我们的 Redux 计数器。然后我们将逐步深入，查看 Redux store 看起来什么样。我们的\
  \ store 将是状态的维护者，接受 action 并使用 reducer 来确定状态的下一个版本。\n\n### 计数器的动作\n\n我们知道计数器的 reducer\
  \ 函数将接受两个参数：`state` 和 `action`。我们知道计数器的 `state` 将是一个整数。但 action 在 Redux 中是如何表示的呢？\n\
  \nRedux 中的 action 是对象。action 总是有一个 `type` 属性。\n\n我们的增加动作看起来像这样：\n\n```javascript\n\
  {\n  type: 'INCREMENT',\n}\n```\n\n减少动作则像这样：\n\n```javascript\n{\n  type: 'DECREMENT',\n\
  }\n```\n\n我们可以设想这个计数器应用的简单界面可能是这样的：\n\n![示例计数器界面](img/5-intro-to-flux----counter-1.png)\n\
  \n示例计数器界面\n\n当用户点击“+”图标时，视图会将增加动作分发到 store。当用户点击“-图标时，视图会将减少动作分发到 store。\n\n###\
  \ 增加计数器\n\n让我们开始编写 reducer 函数。我们将从处理增加动作开始。\n\n计数器的 reducer 函数接受两个参数 `state` 和 `action`，并返回状态的下一个版本。当\
  \ reducer 接收到 `INCREMENT` action 时，它应该返回 `state + 1`。\n\n在 `app.js` 中，添加我们计数器的 reducer\
  \ 代码：\n\n```javascript\nfunction reducer(state, action) {\n  if (action.type ===\
  \ 'INCREMENT') {\n    return state + 1;\n  } else {\n    return state;\n  }\n}\n\
  ```\n\n`redux/counter/complete/initial-reducer.js`\n\n如果 `action.type` 是 `INCREMENT`，我们返回增加后的状态。否则，我们的\
  \ reducer 返回未经修改的状态。\n\n### 尝试一下\n\n在 `app.js` 底部，让我们添加一些代码来测试我们的 reducer。\n\n我们将调用\
  \ reducer，传入整数作为 state，并观察 reducer 如何增加数字。如果我们传入一个未知的 action 类型，我们的 reducer 将返回未加修改的状态：\n\
  \n```javascript\nconst incrementAction = { type: 'INCREMENT' };\n\nconsole.log(reducer(0,\
  \ incrementAction)); // -> 1\nconsole.log(reducer(1, incrementAction)); // -> 2\n\
  console.log(reducer(5, incrementAction)); // -> 5\n```\n\n`redux/counter/complete/initial-reducer.js`\n\
  \n保存 `app.js` 并使用 `node_modules/.bin/babel-node` 运行：\n\n```bash\n$ ./node_modules/.bin/babel-node\
  \ app.js\n```\n\n输出应该是：\n```\n1\n2\n5\n```\n\n### 减少计数器\n\n再次，减少动作 `type` 为 `DECREMENT`：\n\
  \n```javascript\n{\n  type: 'DECREMENT',\n}\n```\n\n为了支持减少动作，我们在 reducer 中添加了另一个分支：\n\
  \n```javascript\nfunction reducer(state, action) {\n  if (action.type === 'INCREMENT')\
  \ {\n    return state + 1;\n  } else if (action.type === 'DECREMENT') {\n    return\
  \ state - 1;\n  } else {\n    return state;\n  }\n}\n```\n\n`redux/counter/complete/initial-reducer-dec.js`\n\
  \n### 尝试一下\n\n在 `app.js` 底部，在我们分发增加动作的代码下方，添加一些代码来分发减少动作：\n\n```javascript\nconst\
  \ decrementAction = { type: 'DECREMENT' };\n\nconsole.log(reducer(10, decrementAction));\
  \ // -> 9\nconsole.log(reducer(9, decrementAction)); // -> 8\nconsole.log(reducer(5,\
  \ decrementAction)); // -> 4\n```\n\n`redux/counter/complete/initial-reducer-w-dec.js`\n\
  \n使用 `node_modules/.bin/babel-node` 运行 `app.js`：\n\n```bash\n$ ./node_modules/.bin/babel-node\
  \ app.js\n```\n\n输出应该是：\n```\n9\n8\n4\n```\n\n### 支持 action 的额外参数\n\n在上一个例子中，我们的\
  \ action 仅包含一个 `type`，告诉 reducer 增加或减少状态。但我们应用中的行为往往无法用单个值来描述。在这种情况下，我们需要额外的参数来描述变化。\n\
  \n例如，如果我们希望应用允许用户指定要增加或减少的*数量*怎么办？\n\n![带有数量字段的计数器界面](img/5-intro-to-flux----counter-2.png)\n\
  \n带有数量字段的计数器界面\n\n我们将让 action 携带额外的属性 `amount`。那么一个 `INCREMENT` 动作看起来像这样：\n\n```javascript\n\
  {\n  type: 'INCREMENT',\n  amount: 7,\n}\n```\n\n我们修改 reducer 以根据 `action.amount`\
  \ 进行增加减少，期望所有 action 现在都携带此属性：\n\n```javascript\nfunction reducer(state, action)\
  \ {\n  if (action.type === 'INCREMENT') {\n    return state + action.amount;\n \
  \ } else if (action.type === 'DECREMENT') {\n    return state - action.amount;\n\
  \  } else {\n    return state;\n  }\n}\n```\n\n`redux/counter/complete/reducer-w-amount.js`\n\
  \n### 尝试一下\n\n清理我们之前在 `app.js` 中用于测试 `reducer()` 的代码。\n\n这一次，我们将通过传入现在携带 `amount`\
  \ 属性的修改后的 action 来测试 reducer：\n\n\n\n\n\n```\nconst incrementAction = {\n  type:\
  \ 'INCREMENT',\n  amount: 5,\n};\n\nconsole.log(reducer(0, incrementAction)); //\
  \ -> 5\nconsole.log(reducer(1, incrementAction)); // -> 6\n\nconst decrementAction\
  \ = {\n  type: 'DECREMENT',\n  amount: 11,\n};\n\nconsole.log(reducer(100, decrementAction));\
  \ // -> 89\n```\n\n`redux/counter/complete/reducer-w-amount.js`\n\n使用 `./node_modules/.bin/babel-node`\
  \  `app.js`：\n\n```\n$ ./node_modules/.bin/babel-node app.js\n```\n\n并注意输出：\n\n\
  ```\n5\n6\n89\n```\n\n### 构建 store（存储）\n\n到目前为止，我们一直在调用 `reducer` 并手动提供状态的最后一个版本以及一个\
  \ action。\n\n在 Redux 中，store 负责维护状态以及接收来自视图的 action。只有 store 能够访问 reducer：\n\n![Inside\
  \ the store](img/5-intro-to-flux----general-peek-inside-store.png)\n\n#### store\
  \ 内部\n\nRedux 库提供了一个创建 store 的函数 `createStore()`。该函数返回一个 store 对象，该对象保留了一个内部变量 `state`。此外，它还提供了几个与\
  \ store 交互的方法。\n\n我们将编写自己版本的 `createStore()`，以便完全理解 Redux store 的工作原理。在本章结束时，我们编写的\
  \ `createStore()` 代码行为将几乎与 Redux 库提供的版本一致。\n\n目前，我们的 store 将提供两个方法：\n\n- `dispatch`：我们将用于发送\
  \ store action 的方法\n- `getState`：我们将用于读取 `state` 当前值的方法\n\n在 `app.js` 内部，清除之前用于测试\
  \ `reducer()` 的代码。在 `reducer()` 的定义下方，让我们定义 `createStore()`。`createStore()` 将接受一个参数，即该\
  \ store 所所需的 reducer。\n\n让我们来看完整的 `createStore()` 函数。我们将在代码下方对其逐一拆解：\n\n```javascript\n\
  function createStore(reducer) {\n  let state = 0;\n\n  const getState = () => (state);\n\
  \n  const dispatch = (action) => {\n    state = reducer(state, action);\n  };\n\n\
  \  return {\n    getState,\n    dispatch,\n  };\n}\n```\n\n`redux/counter/complete/reducer-w-store-v1.js`\n\
  \n#### `reducer` 参数\n\n`createStore()` 接受一个参数 `reducer`。这就是我们指示 store 应该使用哪种 reducer\
  \ 函数的方式。\n\n#### `state`\n\n我们在 `createStore()` 顶部将 `state` 初始化为 `0`。注意，我们闭包了 `state`\
  \ 变量。这使得 `state` 变成私有的，并且在 `createStore()` 外部无法访问。\n\n#### `getState`\n\n为了从 `createStore()`\
  \ 外部访问状态，我们有一个 `getState` 方法，它返回 `state`。\n\n#### `dispatch`\n\n`dispatch` 方法是我们向\
  \ store 发送 action 的。我们将这样调用它：\n\n```javascript\nstore.dispatch({ type: 'INCREMENT',\
  \ amount: 7 });\n```\n\n`dispatch` 调用传入作为参数的 `reducer` 函数，并传入当前状态和 action。`dispatch`\
  \ 将 `state` 设置为 reducer 的返回值。\n\n注意 `dispatch` 不返回状态。在 Redux 中派发 action 是“触发后即忘”的。当我们调用\
  \ `dispatch` 时，我们是在向 store 发送通知，而不预期该 action 何时或将如何被处理。\n\n向 store 派发 action 与读取状态的最新版本是解耦的。在本章结束时将\
  \ store 连接到视图时，我们将看到它是如何运作的。\n\n#### 返回对象\n\n在 `createStore()` 的底部，我们返回一个新对象。该对象具有\
  \ `getState` 和 `dispatch` 方法。\n\n### 尝试一下\n\n我们将在 `app.js` 中 `createStore()` 下方编写测试\
  \ store 的代码。我们将使用 `createStore()` 创建 store 对象。然后，我们不再通过带状态和 action 调用 `reducer()`，而是向\
  \ store 派发 action。由于我们的 store 保留了内部变量 `state`，我们的 `state` 在多次 dispatch 之间是持久化的。\n\
  \n我们可以使用 `getState()` 在两次 dispatch 之间读取 `state`：\n\n```javascript\nconst store =\
  \ createStore(reducer);\n\nconst incrementAction = {\n  type: 'INCREMENT',\n  amount:\
  \ 3,\n};\n\nstore.dispatch(incrementAction);\nconsole.log(store.getState()); //\
  \ -> 3\nstore.dispatch(incrementAction);\nconsole.log(store.getState()); // -> 6\n\
  \nconst decrementAction = {\n  type: 'DECREMENT',\n  amount: 4,\n};\n\nstore.dispatch(decrementAction);\n\
  console.log(store.getState()); // -> 2\n```\n\n`redux/counter/complete/reducer-w-store-v1.js`\n\
  \n使用 `./node_modules/.bin/babel-node` `app.js`：\n\n```\n$ ./node_modules/.bin/babel-node\
  \ app.js\n```\n\n并注意输出：\n\n```\n3\n6\n2\n```\n\n### Redux 核心\n\n目前，我们的 `createStore()`\
  \ 函数与 Redux 库附带的 `createStore()` 函数非常相似。在本章结束时，我们将对 `createStore()` 进行一些微小的调整和添加，使其更接近\
  \ Redux 库的版本。\n\n现在我们已经看到了 Redux store 的运行情况，让我们回顾一下 Redux 的核心思想：\n\n- **你应用程序中的所有数据存储在一个称为\
  \ state 的单一数据结构中，该结构保存在 store 中。** 我们看到 store 有一个用于状态的单一私有变量 `state`。\n- **你的应用从这个\
  \ store 读取状态。** 我们使用 `getState()` 访问 store 的状态。\n- **状态在 store 外部永远不会被直接修改。** 因为\
  \ `state` 是私有变量，它无法在 store 外部被修改。\n- **视图抛出描述发生了什么的 action。** 我们使用 `dispatch()`\
  \ 将这些 action 发送到 store。\n- **新状态通过一个名为 reducer 的函数将旧状态和 action 组合创建。** 在 `dispatch()`\
  \ 内部，我们的 store 使用 `reducer()` 获取新状态，并传入了当前状态和 action。\n\nRedux 还有一个我们尚未涵盖的核心思想：\n\
  \n- **Reducer 函数必须是纯函数。**\n\n我们将在下一个应用中探索这一思想。\n\n#### 下一节预告\n\n在下一个应用以及接下来的两个章节中，我们将涵盖：\n\
  \n- 如何细致地处理状态中复杂的数据结构\n- 如何在状态更改时接收通知，而无需通过轮询 store 来使用 `getState()`（订阅*）\n- 如何将大型\
  \ reducer 拆分为更易于管理的、更小的 reducer（并将其重新组合）\n- 如何在支持 Redux 的应用程序中组织我们的 React 组件\n\n\
  \n\n\n\n![我们在本章中构建的聊天应用的迭代版本](img/5-intro-to-flux----chat-screen-1.png)\n\n# 我们在本章中构建的聊天应用的迭代版本\n\
  \n在接下来的几个章节中，我们将增强此应用的功能集（以及复杂性）。目前，我们可以使用输入框添加消息，并通过点击消息来删除消息。\n\n既然想到了这里，让我们修改\
  \ `index.js`，让它包含 `./App` 而不是 `./complete/App-5`：\n\n```\nimport React from \"react\"\
  ;\nimport ReactDOM from \"react-dom\";\nimport App from \"./App\";\n```\n\n打开 `src/App.js`。你会发现我们为计数器应用构建的同一个\
  \ `createStore()` 已经存在了。\n\n和计数器应用一样，我们将从构建聊天应用的 reducer 开始。一旦构建了 reducer，我们将看到如何将\
  \ Redux store 连接到 React 视图上。\n\n不过，在构建 reducer 之前，我们应该检查聊天应用将如何表示它的状态和动作。\n\n##\
  \ State\n\n在计数器应用中，状态是一个单一的数字。在我们的聊天应用中，状态将是一个对象。\n\n这个状态对象只有一个属性 `messages`。`messages`\
  \ 将是一个字符串数组，其中每个字符串代表应用程序中的单条消息。例如：\n\n```\n// 一个示例 `state` 值\n{\n  messages: [\n\
  \    'here is message one',\n    'here is message two',\n  ],\n}\n```\n\n## Actions\n\
  \n我们的应用将处理两个动作：`ADD_MESSAGE` 和 `DELETE_MESSAGE`。\n\n`ADD_MESSAGE` 动作对象将始终包含属性 `message`，即要添加到状态中的消息。`ADD_MESSAGE`\
  \ 动作对象的形状如下：\n\n```\n{\n  type: 'ADD_MESSAGE',\n  message: 'Whatever message is\
  \ being added here',\n}\n```\n\n`DELETE_MESSAGE` 动作对象将从状态中删除指定的消息。\n\n如果我们的每条消息都是对象，我们可以在创建时为每条消息分配一个\
  \ `id` 属性。这样 `DELETE_MESSAGE` 就可以通过 `id` 属性指定要删除的消息。\n\n然而，为了简单起见，我们目前的消息是字符串。为了指定要从状态中移除的消息，我们可以使用消息在数组中的索引。\n\
  \n考虑到这一点，`DELETE_MESSAGE` 动作对象的形状如下：\n\n```\n{\n  type: 'DELETE_MESSAGE',\n  index:\
  \ 2, // <- 此处为要被移除的消息的索引\n}\n```\n\n## 构建 `reducer()`\n\n### 初始化 `state`\n\n现在，我们在\
  \ `createStore()` 顶部将 `state` 初始化为 `0`：\n\n```\n1 function createStore(reducer)\
  \ {\n2   let state = 0;\n3   // ...\n4 }\n```\n\n虽然这对我们的计数器应用运行良好，但我们希望消息应用的初始状态看起来像这样：\n\
  \n```\n{                 // 一个对象\n  messages: [],   // 没有消息\n}\n```\n\n我们需要修改 `createStore()`，使其能够适用于这种以及任何对状态的表示。\n\
  \n我们将让 `createStore()` 接受第二个参数 `initialState`。该函数将 `state` 初始化为此值。\n\n在 `App.js`\
  \ 中，现在编辑 `createStore()`：\n\n```\nfunction createStore(reducer, initialState) {\n\
  \  let state = initialState;\n  // ...\n```\n\n`redux/chat_simple/src/complete/App-1.js`\n\
  \n我们将在稍后初始化 store 时传入 `initialState`。\n\n### 处理 `ADD_MESSAGE` 动作\n\n在 `App.js` 的\
  \ `createStore()` 下方编写 `reducer()`：\n\n```\nfunction reducer(state, action) {\n\
  \  if (action.type === 'ADD_MESSAGE') {\n    return {\n      messages: state.messages.concat(action.message),\n\
  \    };\n  } else {\n    return state;\n  }\n}\n```\n\n`redux/chat_simple/src/complete/App-1.js`\n\
  \n当我们的 reducer 接收到 `ADD_MESSAGE` 动作时，我们想要将新消息添加到状态中 `messages` 数组的末尾。否则，我们返回未修改的\
  \ state。\n\n我们可能会尝试使用 Array 的 `push` 将新消息添加到 `messages`：\n\n```\n// 很有诱惑，但有缺陷\n\
  if (action.type === 'ADD_MESSAGE') {\n  state.messages.push(action.messages);\n\
  \  return state;\n}\n```\n\n这将产生想要的结果：`state.messages` 将包含新消息。\n\n然而，这违反了 Redux\
  \ reducer 的一个原则，也是我们上面列表中 Redux 的最后一个核心思想：**reducers 必须是纯函数**。\n\n[纯函数](https://en.wikipedia.org/wiki/Pure_function)\
  \ 是指一种：\n\n*   在给定相同参数的情况下，始终返回相同的值。\n*   不以任何方式改变其周围的“世界”。**这包括修改函数外部的变量**或更改数据库中的条目。\n\
  \n由于 `state` 是 `reducer()` 外部的变量并作为参数传递的，`reducer()` 并不“拥有”这个变量。修改 `state`（如我们上面使用\
  \ `push` 那样）会使 `reducer()` 变得不纯。\n\n在编写 Redux reducer 时，在 `state` 必须修改的情况下，我们的纯\
  \ reducer 函数将始终返回一个新的数组或对象。这遵循了将状态视为**不可变（immutable）**的实践。reducer 应该将状态视为只读。\n\n\
  \n\n\n\n最简洁的解决方案似乎是使用 `Array` 的 [`splice`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/splice)。`splice`\
  \ 的第一个参数是想要删除的元素的起始索引。第二个参数是待删除的元素个数：\n\n```javascript\n// 很有吸引力，但有缺陷\ncase 'DELETE_MESSAGE':\n\
  \  state.messages.splice(action.index, 1);\n  return state;\n```\n\n然而，像 `push`\
  \ 一样，`splice` 会修改原始数组。会导致 `reducer()` 变得不纯。同样，我们不能修改 `state` —— 必须将其视为只读。\n\n相反，我们可以像在\
  \ `ADD_MESSAGE` 中做的那样创建一个新对象。这个新对象将包含一个新的 `messages` 数组，其中包含 `state.messages` 中的所有元素，被删除的那个除外。\n\
  \n为了在 JavaScript 中实现这一点，我们可以创建一个包含以下内容的新数组：\n\n* 从 `0` 到 `action.index` 的所有元素\n\
  * 从 `action.index + 1` 到数组末尾的所有元素\n\n我们使用 `Array` 的 `slice` 来获取数组中所需的“块”：\n\n```javascript\n\
  function reducer(state, action) {\n  if (action.type === 'ADD_MESSAGE') {\n    return\
  \ {\n      messages: state.messages.concat(action.message),\n    };\n  } else if\
  \ (action.type === 'DELETE_MESSAGE') {\n    return {\n      messages: [\n      \
  \  ...state.messages.slice(0, action.index),\n        ...state.messages.slice(\n\
  \          action.index + 1, state.messages.length\n        ),\n      ],\n    };\n\
  \  } else {\n    return state;\n  }\n}\n```\n\n`redux/chat_simple/src/complete/App-2.js`\n\
  \n重要的是，`slice` 不修改原始数组。相反，它返回一个包含你指定范围内元素的新数组。我们创建一个组合了两个范围的新数组：直到 `action.index`\
  \ 且不包含该索引，以及 `action.index` 之后的每一个元素。\n\n### 尝试一下\n\n在 `App.js` 的最底部，我们将在测试过 `ADD_MESSAGE`\
  \ 操作的代码基础上继续添加。在文件的最后一个 `console.log()` 语句之后编写以下内容：\n\n```javascript\nconst deleteMessageAction\
  \ = {\n  type: 'DELETE_MESSAGE',\n  index: 0,\n};\n\nstore.dispatch(deleteMessageAction);\n\
  const stateV3 = store.getState();\n\nconsole.log('State v3:');\nconsole.log(stateV3);\n\
  ```\n\n`redux/chat_simple/src/complete/App-2.js`\n\n在第二个版本的状态中，我们向状态添加了两条消息。然后我们派了一个\
  \ `DELETE_MESSAGE` 操作，指定了索引为 `0` 的消息。\n\n使用 `babel-node` 运行文件：\n\n```bash\n./node_modules/.bin/babel-node\
  \ src/App.js\n```\n\n如预期所示，在第三个状态中，第一条消息被删除了：\n\n```text\nState v1:\n{ messages:\
  \ [ 'How does it look, Neil?' ] }\nState v2:\n{ messages: [ 'How does it look, Neil?',\
  \ 'Looking good.' ] }\nState v3:\n{ messages: [ 'Looking good.' ] }\n```\n\n###\
  \ 订阅 store\n\n到目前为止，我们的 store 为视图提供了派发操作和读取当前状态版本的方法。\n\n然而，在将 store 连接到 React 之前，还缺少一个重要的功能。虽然视图可以通过\
  \ `getState()` 随时读取状态，但视图需要知道状态何时变化。不断使用 `getState()` 轮询 store 是低效的。\n\n在我们之前的应用中，当我们想要修改状态时，我们会调用\
  \ `setState()`。重要的是，`setState()` 会触发组件的 `render()` 调用。\n\n现在，状态是在 React 外部和 store\
  \ 内部被修改的。我们的视图并不知道它何时变化。如果我们想让视图与 store 中最新的状态保持同步，那么每当状态变化时，我们的视图都应该接收通知。\n\n我们的\
  \ store 将使用观察者模式，允许视图在状态变化时立即更新。视图将注册一个它们希望在状态变化时调用的回调函数。store 将保存所有这些回调函数的列表。当状态变化时，store\
  \ 将调用每个函数，“通知”监听者变化已发生。\n\n说明这种模式的最好方法就是实现它。\n\n在 `createStore()` 内部，我们将：\n\n1.\
  \ 定义一个名为 `listeners` 的数组\n2. 添加一个 `subscribe()` 方法，向 `listeners` 添加新的监听器\n3. 当状态变化时调用每个监听器函数\n\
  \n#### 1. 定义一个名为 `listeners` 的数组\n\n我们在 `createStore()` 顶部声明 `listeners`：\n\n```javascript\n\
  function createStore(reducer, initialState) {\n  let state = initialState;\n  const\
  \ listeners = [];\n  // ...\n```\n\n`redux/chat_simple/src/complete/App-3.js`\n\n\
  #### 2. 添加一个 `subscribe()` 方法，向 `listeners` 添加新的监听器\n\n接下来，在 `listeners` 声明下方，我们添加\
  \ `subscribe()`：\n\n```javascript\nconst subscribe = (listener) => (\n    listeners.push(listener)\n\
  \  );\n```\n\n`redux/chat_simple/src/complete/App-3.js`\n\n`subscribe()` 的参数 `listener`\
  \ 是一个视图希望在状态变化时调用的函数。store 将保存所有这些回调函数的列表。当状态变化时，store 将调用每个函数，“通知”监听者变化。为了让 `subscribe()`\
  \ 可访问，我们需要将 `subscribe` 暴露在 `createStore()` 返回的对象中：\n\n```javascript\n // ...\n\
  \  return {\n    subscribe,\n    getState,\n    dispatch,\n  };\n```\n\n`redux/chat_simple/src/complete/App-3.js`\n\
  \n#### 3. 当状态变化时调用每个监听器函数\n\n每当状态变化时，我们需要调用在 `listeners` 中的所有函数。因此，我们将逻辑添加到 `dispatch()`\
  \ 中：\n\n```javascript\n // ...\n  const dispatch = (action) => {\n    state = reducer(state,\
  \ action);\n    listeners.forEach(l => l());\n  };\n```\n\n`redux/chat_simple/src/complete/App-3.js`\n\
  \n这是我们完整的 `createStore()` 函数：\n\n```javascript\nfunction createStore(reducer, initialState)\
  \ {\n  let state = initialState;\n  const listeners = [];\n\n  const subscribe =\
  \ (listener) => (\n    listeners.push(listener)\n  );\n\n  const getState = () =>\
  \ state;\n\n  const dispatch = (action) => {\n    state = reducer(state, action);\n\
  \    listeners.forEach(l => l());\n  };\n\n  return {\n    subscribe,\n    getState,\n\
  \    dispatch,\n  };\n}\n```\n\n\n\n\n\n```\nCurrent state:\n{ messages: [ 'How\
  \ do you read?' ] }\nCurrent state:\n{ messages: [ 'How do you read?', 'I read you\
  \ loud and clear, Houston.'\\\n ] }\nCurrent state:\n{ messages: [ 'I read you loud\
  \ and clear, Houston.' ] }\n```\n\n随着我们 `store` 功能的完成，我们已经准备好将 Redux store 连接到一些\
  \ React 视图，并查看一个完整的、运行中的 Redux 流水线。\n\n## 将 Redux 到到 React\n\n回顾之前的 Flux 图，我们现在可以探索\
  \ Redux 和 React 如何协同工作以实现这一设计模式的细节：\n\n![](img/5-intro-to-flux----flux-diagram.png)\n\
  \n### 使用 `store.getState()`\n\nReact 不再管理状态了。由 Redux 来管理。因此，顶层 React 组件将使用 `store.getState()`\
  \ 而不是 `this.state` 来驱动它们的 `render()` 函数。Redux 提供的状态将从那里向下传递。\n\n例如，如果我们想渲染状态的 `messages`，我们将从\
  \ Redux store 中获取它们：\n\n```\n// An example top-level component\nclass App extends\
  \ React.Component {\n  // ...\n  render() {\n    const messages = store.getState().messages;\n\
  \    // ...\n  }\n};\n```\n\n### 使用 `store.subscribe()`\n\n当 React 管理状态时，我们调用 `setState()`\
  \ 来修改 `this.state`。`setState()` 会在状态修改后触发重新渲染。\n\n当 Redux 管理状态时，我们在顶层 React 组件内部使用\
  \ `subscribe()` 来设置一个监听函数，该函数启动重新渲染。\n\n我们可以在 `componentDidMount` 内部订阅组件。传递给 `subscribe()`\
  \ 的监听函数将调用 `this.forceUpdate()`，从而触发组件（`this`）重新渲染。\n\n例如，订阅一个 React 组件看起来如下：\n\n\
  ```\n// An example top-level component\nclass App extends React.Component {\n  //\
  \ ...\n  componentDidMount() {\n    store.subscribe(() => this.forceUpdate());\n\
  \  }\n  // ...\n};\n```\n\n### 使用 `store.dispatch()`\n\n低级组件将响应应该修改状态的事件分发动作（actions）。例如，每当点击删除按钮时，React\
  \ 组件可能会向 store 分发一个 action：\n\n```\n// An example leaf component\nclass Message\
  \ extends React.Component {\n  handleDeleteClick = () => {\n    store.dispatch({\n\
  \      type: 'DELETE_MESSAGE',\n      index: this.props.index,\n    });\n  };\n\
  \  // ...\n};\n```\n\n此 `dispatch()` 调用将修改状态。`dispatch()` 然后将调用我们通过 `subscribe()`\
  \ 注册的监听器。这强制 `App` 组件重新渲染。当 `render()` 被调用时，`App` 组件将再次通过 `getState()` 从 store 中读取数据。`App`\
  \ 然后将最新版本的状态传递给它的子组件。\n\n这个循环每当 React 分发一个 action 时就会重复一次。\n\n## 应用程序的组件\n\n聊天应用有三个\
  \ React 组件：\n\n![](img/5-intro-to-flux----chat-components.png)\n\n* `App`: 顶层容器\n\
  * `MessageView`: 消息列表\n* `MessageInput`: 添加新消息的输入框\n\n正如我们看到的，输入框允许添加消息。点击消息会删除它。\n\
  \n`MessageView` 将渲染状态的 `messages`。每当用户点击单条消息时，它还会分发 `DELETE_MESSAGE` 动作。\n\n`MessageInput`\
  \ 不使用状态进行渲染。然而，每当用户提交新消息时，它都会分发 `ADD_MESSAGE` 动作。\n\n### 准备 `App.js`\n\n对于此项目，store\
  \ 逻辑和 React 组件都位于 `src/App.js` 中。我们能够在每个组件中直接引用 `store`。\n\n在更复杂的应用程序中，store 可能会位于与\
  \ React 组件不同的文件中。在稍后的章节中，我们将探索让 React 组件与 Redux store 对象通信的其他方式。\n\n清理 `src/App.js`\
  \ 结尾 `store` 声明下方的所有测试代码：\n\n```\nconst store = createStore(reducer, initialState);\n\
  ```\n\nredux/chat_simple/src/complete/App-4.js\n\n### `App` 组件\n\n`App` 是我们应用中的顶层\
  \ React 组件。`App` 将是从 store 中读取数据的组件。我们需要它订阅我们的 Redux store。\n\n### 订阅变化\n\n正如我们上面讨论的，我们将在\
  \ `componentDidMount` 内部进行 `subscribe()`。我们给 `subscribe()` 的回调函数将调用 `this.forceUpdate()`。这会导致\
  \ `App` 组件在每次状态变化时都重新渲染：\n\n```\nclass App extends React.Component {\n  componentDidMount()\
  \ {\n    store.subscribe(() => this.forceUpdate());\n  }\n```\n\nredux/chat_simple/src/complete/App-5.js\n\
  \n### 渲染视图\n\n在 `render` 中，我们首先使用 `getState()` 从 store 中读取 `messages`。然后我们渲染两个子组件，`MessageView`\
  \ 和 `MessageInput`。只有 `MessageView` 需要消息列表：\n\n```\n render() {\n    const messages\
  \ = store.getState().messages;\n\n    return (\n      <div className='ui segment'>\n\
  \        <MessageView messages={messages} />\n        <MessageInput />\n      </div>\n\
  \    );\n  }\n```\n\nredux/chat_simple/src/complete/App-5.js\n\n我们拥有了流水线，从 `store`\
  \ 到 `MessageView`。当 React 管理状态时，`MessageView` 能够删除消息。现在，`App` 组件可以向 store 分发动作。`MessageInput`\
  \ 能够添加消息。当 React 管理状态时，我们在 store 中保留表单状态。但通常将表单数据保留在组件状态中。我们可以在 store 中保留这种状态。`App`\
  \ 组件完整代码如下：\n\n```\nclass App extends React.Component {\n  componentDidMount() {\n\
  \    store.subscribe(() => this.forceUpdate());\n  }\n\n  render() {\n    const\
  \ messages = store.getState().messages;\n\n    return (\n      <div className='ui\
  \ segment'>\n        <MessageView messages={messages} />\n        <MessageInput\
  \ />\n      </div>\n    );\n  }\n}\n```\n\nredux/chat_simple/src/complete/App-5.js\n\
  \n### `MessageInput` 组件\n\n`MessageInput` 将有一个输入字段和一个提交按钮。当用户点击提交按钮时，组件应该分发 `ADD_MESSAGE`\
  \ action。\n\n作为一个受控组件，我们希望在状态中跟踪输入的值。我们可以将此状态保留在 Redux store 中。但通常表单数据保留在组件状态中。\n\
  \n让我们从定义初始状态以及 `onChange` 处理函数开始：\n\n```\nclass MessageInput extends React.Component\
  \ {\n  state = {\n    value: '',\n  };\n\n  onChange = (e) => {\n    this.setState({\n\
  \      value: e.target.value,\n    })\n  };\n```\n\nredux/chat_simple/src/complete/App-5.js\n\
  \n接下来，我们将定义 `handleSubmit()`，即调用 `dispatch()` 的函数：\n\n```\n handleSubmit = () =>\
  \ {\n    store.dispatch({\n      type: 'ADD_MESSAGE',\n      message: this.state.value,\n\
  \    });\n    this.setState({\n      value: '',\n    });\n  };\n```\n\nredux/chat_simple/src/complete/App-5.js\n\
  \n`render` 将包含一个包装在 `div` 中的 `input` 和 `button`。`button` 的 `onClick` 属性将设置为 `this.handleSubmit`：\n\
  \n```\n render() {\n    return (\n      <div className='ui input'>\n        <input\n\
  \          onChange={this.onChange}\n          value={this.state.value}\n      \
  \    type='text'\n        />\n        <button\n          onClick={this.handleSubmit}\n\
  \          className='ui primary button'\n          type='submit'\n        >\n \
  \         Submit\n        </button>\n       </div>\n    );\n  }\n```\n\n### `MessageView`\
  \ 组件\n\n`MessageView` 组件的 `messages` 属性是一个字符串数组。`MessageView` 将将这些消息渲染为列表。此外，每当用户点击消息时，我们都希望分发一个\
  \ `DELETE_MESSAGE` action。\n\n\n\n\n让我们先定义组件及其它的函数 `handleClick()`。`handleClick()`\
  \ 将是调用 `dispatch()` 的函数。`handleClick()` 接收一个参数 `index`，并将其用于它分发的动作（action）对象中：\n\
  \n```javascript\nclass MessageView extends React.Component {\n  handleClick = (index)\
  \ => {\n    store.dispatch({\n      type: 'DELETE_MESSAGE',\n      index: index,\n\
  \    });\n  };\n```\n\n`redux/chat_simple/src/complete/App-5.js`\n\n`render` 函数将使用\
  \ `map` 来创建要渲染的消息列表。我们希望将每个单独的 `message` 包裹在一个 `div` 之中：\n\n```javascript\n render()\
  \ {\n    const messages = this.props.messages.map((message, index) => (\n      <div\n\
  \        className='comment'\n        key={index}\n        onClick={() => this.handleClick(index)}\n\
  \      >\n        {message}\n      </>\n    ));\n```\n\n`redux/chat_simple/src/complete/App-5.js`\n\
  \n我们在这个 `div` 上设置了 `onClick` 属性。我们希望它调用一个函数，该函数再次调用 `handleClick()` 并传入目标消息的索引。\n\
  \n最后，我们返回包裹在 `div` 内部的 `messages`：\n\n```javascript\n return (\n      <div className='ui\
  \ comments'>\n        {messages}\n      </div>\n    );\n```\n\n`redux/chat_simple/src/complete/App-5.js`\n\
  \n最后，我们在文件底部导出 `App`：\n\n```javascript\nexport default App;\n```\n\n`redux/chat_simple/src/complete/App-5.js`\n\
  \n我们已经在 `index.js` 中包含了 `App`，并使用 `ReactDOM.render()` 将其挂载到 DOM 上。因此，我们准备好尝试一切了。\n\
  \n### 尝试一下\n\n保存 `App.js`。在终端中，从项目文件夹根目录启动服务器：\n\n```bash\n$ npm start\n```\n\n\
  添加几条消息，然后点击它们查看它们如何立即消失。\n\n### 下一步\n\nRedux 是管理应用中状态的强大方式。通过使用几个简单的概念，你可以获得一种易于理解的数据架构，并且能够良好地扩展到大型应用。\n\
  \n诚然，在我们应用目前的状态下，很难看到 Redux 相比于在 React 中管理状态有什么优势。事实上，正如本章引言所述，对于各种应用程序，使用 React\
  \ 进行状态管理是一个更优的选择。\n\n然而，正如我们在扩展消息应用的复杂性时将会看到的，随着应用的交互性和状态管理变得更加复杂，Redux 将具有其优势。这是因为：\n\
  \n1. 所有的数据都在一个中心化的数据结构中\n2. 数据变化也是中心化的\n3. 视图发出的动作（actions）与发生的状态变异（state mutations）是解的\n\
  4. 单向数据流使得追踪变化如何流过系统变得简单\n\n在掌握了 Redux 的核心思想后，我们准备好显著增加消息应用的功能。在此过程中，我们将探索解决各种现实世界挑战的方案。\n\
  \n随着消息应用的演进，我们将涵盖：\n\n* 如何使用 Redux 库\n* 如何使用 React-Redux 库\n* 如何处理更复杂的状态\n* 如何拆分我们的\
  \ reducers（并重新组合它们）\n* 如何重新组织我们的 React 组件\n\nReact 和 Redux 配合得完美，我们将亲眼看到它们如何很好地扩展以处理我们不断增加的需求。\n\
  \n## 中级 Redux\n\n在上一章中，我们学习了一个特定的 Flux 实现——Redux。通过从零开始构建自己的 Redux store 并将其与 React\
  \ 组件集成，我们感受了数据是如何在由 Redux 驱动的 React 应用中流动的。\n\n在本章中，我们将基于这些概念，为我们的聊天应用程序添加额外功能。我们的聊天应用将开始看起来像一个真实世界的消息界面。\n\
  \n在此过程中，我们将探索处理更复杂状态管理的策略。我们还将直接使用 `redux` 库中的几个函数。\n\n### 准备工作\n\n在随书下载的代码中，导航到\
  \ `redux/chat_intermediate`：\n\n```bash\n$ cd redux/chat_intermediate\n```\n\n此应用的设置与上一章中的聊天应用完全相同，由\
  \ create-react-app 驱动。\n\n```bash\n$ ls\nREADME.md\nnightwatch.json\npackage.json\n\
  public\nsemantic\nsemantic.json\nsrc\ntests\nyarn.lock\n```\n\n查看 `src/`：\n\n```bash\n\
  $ ls src/\nApp.js\ncomplete\nindex.css\nindex.js\n```\n\n同样，`App.js` 是我们将工作的地方。它包含了我们在上一章中留下的应用状态。同样，`complete/`\
  \ 包含了我们在接下来的两个章节中构建的 `App.js` 的每次迭代版本。`index.js` 目前包含了 `App.js` 的最终版本并将其挂载到 DOM\
  \ 上。\n\n像往常一样，运行 `npm install` 安装项目的所有依赖项：\n\n```bash\n$ npm install\n```\n\n然后执行\
  \ `npm start` 启动服务器：\n\n```bash\n$ npm start\n```\n\n在浏览器中访问 `http://localhost:3000`\
  \ 查看完成后的应用。\n\n在聊天应用的这次迭代中，我们的应用有了线程（会话线程）。每条消息都属于与另一个用户的特定线程。我们可以使用顶部的标签在线程之间切换。\n\
  \n与上一次迭代一样，注意我们仍然可以通过底文本字段添加消息。\n\n为了开始，让我们在 `index.js` 中切换：\n\n```javascript\n\
  import React from \"react\";\nimport ReactDOM from \"react-dom\";\nimport App from\
  \ \"./App\";\n```\n\n### 使用 `redux` 中的 `createStore()`\n\n在上一章中，我们实现了 `createStore()`。该函数创建了三个方法：`getState()`、`dispatch()`\
  \ 和 `subscribe()`。\n\n正如我们在上一章中提到的，我们的 `createStore()` 函数与 `redux` 库自带的非常相似。让我们移除我们的实现并使用来自\
  \ `redux` 的版本。\n\n在 `package.json` 中，我们已经包含了 `redux` 库：\n\n```json\n\"redux\": \"\
  3.6.0\",\n```\n\n我们可以导入 `createStore()` 函数：\n\n```javascript\nimport { createStore\
  \ } from 'redux';\n```\n\n`redux/chat_intermediate/src/complete/App-1.js`\n\n现在我们可以从\
  \ `App.js` 中移除 `createStore()` 定义。\n\n### 尝试一下\n\n为了验证一切正常，请确保服务器正在运行：\n\n```bash\n\
  $ npm start\n```\n\n然后在 `http://localhost:3000` 检查应用。\n\n应用的行为与我们在上一章中留下的状态相同。我们可以添加新消息并点击它们。\n\
  \n我们的 `createStore()` 与 `redux` 库自带的存在一些细微差别。我们的应用尚未触及这些。我们会在出现时再讨论。\n\n### 在状态中使用对象表示消息\n\
  \n到目前，我们的状态是简单的。状态是一个对象，拥有 `messages` 属性。每条消息都是字符串：\n\n```javascript\n// 目前为止的状态示例\n\
  {\n  messages: [\n    'Roger is undocked',\n    'Looking good.',\n  ],\n}\n```\n\
  \n为了让我们的应用更接近真实的聊天应用，每条消息需要携带更多数据。例如，我们可能希望每条消息指定发送时间或发送者。为了支持这一点，我们可以使用对象来表示每条消息而不是字符串。\n\
  \n现在，我们将为每条消息添加两个属性：`timestamp` 和 `id`：\n\n```javascript\n// 新对象的示例\n{\n  messages:\
  \ [\n    // 示例消息\n    // 消息现在是对象了\n    {\n      text: 'Roger is undocked',\n   \
  \   timestamp: '1461974250213',\n      id: '9da98285-4178',\n    },\n    // ...\n\
  \  ]\n}\n```\n\n为了支持对象消息，我们需要调整我们的 reducer 以及 React 组件。\n\n#### 更新 `ADD_MESSAGE`\n\
  \n我们在上一章中编写的 reducer 函数处理两个动作：`ADD_MESSAGE` 和 `DELETE_MESSAGE`。让我们从更新 `ADD_MESSAGE`\
  \ 动作处理器开始。\n\n正如你记得的，`ADD_MESSAGE` 动作包含一个 `message` 属性：\n\n```javascript\n{\n  type:\
  \ 'ADD_MESSAGE',\n  message: 'Looking good.',\n}\n```\n\n\n\n\n`reducer()` 接收此 action\
  \ 并返回一个带有 `messages` 属性的新对象。`messages` 被设置为一个新的数组，该数组包含了之前的 `state.messages` 并在末尾添加了新消息：\n\
  \n```javascript\nfunction reducer(state, action) {\n  if (action.type === 'ADD_MESSAGE')\
  \ {\n    return {\n      messages: state.messages.concat(action.message),\n    };\n\
  ```\n\n`redux/chat_intermediate/src/complete/App-1.js`\n\n让我们微调一下 `ADD_MESSAGE`\
