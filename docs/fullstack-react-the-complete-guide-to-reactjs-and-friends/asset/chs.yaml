  \n`DELETE_MESSAGE` 操作目前带有 `id` 属性，该属性指示应该删除哪条消息。虽然我们的应用程序目前允许从活动线程中删除消息，但我们将编写 reducer，让它在所有线程中搜索匹配的消息。\n\
  \n从状态中移除消息时，我们面临着与 `ADD_MESSAGE` 类似的挑战。消息位于线程的 `messages` 数组中。但我们无法修改状态中的线程对象。\n\
  \n我们可以使用类似的策略：\n\n1. 获取持有我们想要删除的消息的线程。\n2. 创建一个新的线程对象，它包含原始线程对象的所有属性，加上一个更新后的 `messages`\
  \ 属性，该属性*不包含*我们正在删除的消息。\n3. 返回一个 `state`，其 `threads` 属性包含我们*新*的线程对象以替换*原始*的对象。\n\
  \n现在让我们修改 reducer 的 `DELETE_MESSAGE` 处理程序。\n\n首先，我们识别持有我们正在删除的消息的线程：\n\n```\n }\
  \ else if (action.type === 'DELETE_MESSAGE') {\n    const threadIndex = state.threads.findIndex(\n\
  \      (t) => t.messages.find((m) => (\n       m.id === action.id\n      ))\n  \
  \  );\n    const oldThread = state.threads[threadIndex];\n```\n\n`redux/chat_intermediate/src/complete/App-6.js`\n\
  \n在 `findIndex` 回调内部，我们对该线程的 `messages` 属性执行 `find`。如果 `find` 找到了与操作 `id` 匹配的消息，它将返回该消息。这满足了\
  \ `findIndex` 测试函数，意味着返回了线程的索引。\n\n接下来，我们创建一个新的线程对象。我们使用扩展语法将 `oldThread` 的所有属性复制到这个新对象中。我们像以前一样使用\
  \ `filter()` 函数来覆盖 `messages` 属性，以生成一个不包含已删除消息的新数组：\n\n```\n const newThread = {\n\
  \      ...oldThread,\n      messages: oldThread.messages.filter((m) => (\n     \
  \  m.id !== action.id\n      )),\n    };\n```\n\n`redux/chat_intermediate/src/complete/App-6.js`\n\
  \n`DELETE_MESSAGE` 的 `return` 语句与 `ADD_MESSAGE` 相同。我们正在执行相同的操作：我们最终想要将 `state.threads`\
  \ 中的原始线程对象“交换”为我们的新对象。因此，我们需要：\n\n1. 创建一个新对象并从 `state` 复制所有属性。\n2. 使用新的线程数组覆盖 `threads`\
  \ 属性，用我们的新线程对象替换原始对象。\n\n再次，代码与 `ADD_MESSAGE` 相同：\n\n```\n return {\n      ...state,\n\
  \      threads: [\n        ...state.threads.slice(0, threadIndex),\n        newThread,\n\
  \        ...state.threads.slice(\n          threadIndex + 1, state.threads.length\n\
  \        ),\n      ],\n    };\n```\n\n`redux/chat_intermediate/src/complete/App-6.js`\n\
  \n完整的 `DELETE_MESSAGE` 操作处理程序如下：\n\n```\n } else if (action.type === 'DELETE_MESSAGE')\
  \ {\n    const threadIndex = state.threads.findIndex(\n      (t) => t.messages.find((m)\
  \ => (\n        m.id === action.id\n      ))\n    );\n    const oldThread = state.threads[threadIndex];\n\
  \n    const newThread = {\n      ...oldThread,\n      messages: oldThread.messages.filter((m)\
  \ => (\n        m.id !== action.id\n      )),\n    };\n\n    return {\n      ...state,\n\
  \      threads: [\n        ...state.threads.slice(0, threadIndex),\n        newThread,\n\
