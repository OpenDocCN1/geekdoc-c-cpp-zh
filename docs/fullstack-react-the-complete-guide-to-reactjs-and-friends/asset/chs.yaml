  \n### 结论\n\n一旦我们打好了基础，与手动管理传统的 REST API 相比，使用 Relay 是一种极佳的开发者体验。\n\nRelay 和 GraphQL\
  \ 为我们的数据提供了强有力的类型结构，同时在更改组件数据需求时提供了无与伦比的灵活性。\n\nRelay 2 触手可及，它承诺将带来更好的性能和更好的开发者体验（特别是在变异方面）。尽管如此，Relay\
  \ 1 已经足够强大，可以用于现在编写应用。\n\n### 接下来去哪里\n\n如果你想了解更多关于 Relay 的知识，这里有一些资源：\n\n* [学习 Relay](https://www.learnrelay.org/)\
