  ```\n// `connect()` 的签名\n//（注意：这里是不完整的，稍后我们会看到完整签名）\nconnect(\n  mapStateToProps(state),\n\
  \  mapDispatchToProps(dispatch),\n)(PresentationalComponent)\n```\n\n让我们使用 `connect()`\
  \ 来创建 `ThreadTabs`：\n\n```\nconst ThreadTabs = connect(\n  mapStateToTabsProps,\n\
  \  mapDispatchToTabsProps\n)(Tabs);\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\
  \n从表面上看可能不像，但 `ThreadTabs` 是一个 React 容器组件，与我们之前的组件并没有太大。\n\n### 使用 `connect()` 生成\
  \ `ThreadDisplay`\n\n我们将用 `connect()` 生成的下一个组件是 `ThreadDisplay`。\n\n容器组件在 `Thread`\
  \ 上指定了三个 prop：\n\n*   `thread`\n*   `onMessageClick`\n*   `onMessageSubmit`\n\n\
  #### 状态到属性（State to props）\n\n我们将此映射函数命名为 `mapStateToThreadProps()`。它映射一个属性：\n\n\
  *   `thread`：映射到状态中的活跃线程\n\n#### Dispatch 到属性（Dispatch to props）\n\n我们将此映射函数命名为\
  \ `mapDispatchToThreadProps()`。它映射两个属性：\n\n*   `onMessageClick`：映射到一个分发 `DELETE_MESSAGE`\
  \ 的函数\n*   `onMessageSubmit`：映射到一个分发 `ADD_MESSAGE` 的函数\n\n#### `mapStateToThreadProps()`\n\
  \n我们将在 `App.js` 中的 `ThreadDisplay` 上方编写状态到属性的胶水函数。\n\n`mapStateToThreadProps()`\
  \ 接受参数 `state`。我们返回一个对象，将 `thread` 属性映射到状态中的活跃线程：\n\n```\nconst mapStateToThreadProps\
  \ = (state) => (\n  {\n    thread: state.threads.find(\n      t => t.id === state.activeThreadId\n\
  \    ),\n  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\n这遵循\
  \ `ThreadDisplay` 之前设置 `Thread` 的 `thread` 属性的相同逻辑。\n\n#### `mapDispatchToThreadProps()`\n\
  \n在 `mapStateToThreadProps()` 下方，我们将编写 dispatch 到属性的胶水函数。\n\n我们将编写的第一个 dispatch\
  \ 属性是针对 `onMessageClick` 的。该函数接收一个 `id` 并分发 `DELETE_MESSAGE` action。再次，该逻辑与 `ThreadDisplay`\
  \ 的逻辑一致：\n\n```\nconst mapDispatchToThreadProps = (dispatch) => (\n  {\n    onMessageClick:\
  \ (id) => (\n      dispatch({\n        type: 'DELETE_MESSAGE',\n        id: id,\n\
  \      })\n    ),\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\n接下来，我们需要为\
  \ `onMessageSubmit` 定义 dispatch 函数。\n\n正如我们讨论的，我们需要正在展示的线程的 `id` 来分发我们的 `ADD_MESSAGE`\
  \ action。但我们在 dispatch 到属性的内部无法无法该属性。\n\n`connect()` 允许你传入*第三个*函数，它称之为 `mergeProps`。因此，完整来说，传递给\
  \ `connect()` 的三个函数为：\n\n```\n// `connect()` 的完整函数签名\nconnect(\n  mapStateToProps(state,\
  \ [ownProps]),\n  mapDispatchToProps(dispatch, [ownProps]),\n  mergeProps(stateProps,\
  \ dispatchProps, [ownProps])\n)\n```\n\n`mergeProps` 被带有两个参数：`stateProps` 和 `dispatchProps`。这些是\
  \ `mapStateToProps` 和 `mapDispatchToProps` 返回的对象。\n\n因此我们可以向 `connect()` 传递第三个函数\
  \ `mergeThreadProps()`。该函数将带两个参数调用：\n\n*   我们在 `mapStateToThreadProps()` 中返回的对象\n\
  *   我们在 `mapDispatchToThreadProps()` 中返回的对象\n\n`connect()` 将使用 `mergeThreadProps()`\
  \ 返回的对象作为确定 `Thread` 属性的最终对象。\n\n按照顺序，`connect()` 将执行以下操作：\n\n1.  用 `state` 调用 `mapStateToThreadProps()`\n\
  2.  用 `dispatch` 调用 `mapDispatchToThreadProps()`\n3.  用前两个映射函数的结果（`stateProps` 和\
  \ `dispatchProps`）调用 `mergeThreadProps()`\n4.  用 `mergeThreadProps()` 返回的对象设置 `Thread`\
  \ 的属性\n\n\n\n\n\n在 `mergeThreadProps()` 内部，我们需要访问两个项来创建我们的 `ADD_MESSAGE` dispatch\
  \ 函数：\n\n* 线程的 `id`\n* `dispatch` 函数本身\n\n我们将通过 `stateProps` 获取线程的 `id`，因为该对象在 `thread`\
  \ 属性下拥有完整的线程对象。\n\n为了获取 `dispatch`，我们可以在可以在 `mapDispatchToThreadProps()` 中将其传递下去。因此，我们的\
  \ `mapDispatchToThreadProps()` 函数将定义两个属性：\n\n* `onMessageClick`\n* `dispatch`\n\n\
  dispatch-to-props 函数完整代码如下：\n\n```\nconst mapDispatchToThreadProps = (dispatch)\
  \ => (\n  {\n    onMessageClick: (id) => (\n      dispatch({\n        type: 'DELETE_MESSAGE',\n\
  \        id: id,\n      })\n    ),\n    dispatch: dispatch,\n  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\
  \n现在我们将定义最终的映射函数。同样，这个“合并”函数将接收我们的 state-to-props 映射函数和 dispatch-to-props 映射函数的结果。它返回的对象将由\
  \ `connect()` 用于绑定 `Thread` 的属性。\n\n我们将此函数声明在 `mapDispatchToThreadProps()` 之下方。我们的合并函数接收两个参数：\n\
  \n```\nconst mergeThreadProps = (stateProps, dispatchProps) => (\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\
  \n我们想要创建一个包含以下内容的新对象：\n\n* `stateProps` 中的所有属性\n* `dispatchProps` 中的所有属性\n* 一个额外的属性\
  \ `onMessageSubmit`\n\n让我们看看它是什么样的：\n\n```\nconst mergeThreadProps = (stateProps,\
  \ dispatchProps) => (\n  {\n    ...stateProps,\n    ...dispatchProps,\n    onMessageSubmit:\
  \ (text) => (\n      dispatchProps.dispatch({\n        type: 'ADD_MESSAGE',\n  \
  \      text: text,\n        threadId: stateProps.thread.id,\n      })\n    ),\n\
  \  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\n我们使用扩展运算符（`...`）将\
  \ `stateProps` 和 `dispatchProps` 拷贝到我们的新对象中。`onMessageSubmit` 发送了 `ThreadDisplay`\
  \ 之前发送的相同的 `ADD_MESSAGE` action。注意，我们是从 `dispatchProps` 中获取 `dispatch` 函数的：\n\n\
  ```\n dispatchProps.dispatch({\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\
  \n然后，我们从 `stateProps` 中获取线程的 `id`：\n\n```\n threadId: stateProps.thread.id,\n```\n\
  \n`redux/chat_intermediate/src/complete/App-16.js`\n\n准备好两个映射函数和一个合并函数后，我们现在可以使用\
  \ `connect()` 生成 `ThreadDisplay`。我们将在 `mergeThreadProps()` 之下声明 `ThreadDisplay`：\n\
  \n```\nconst ThreadDisplay = connect(\n  mapStateToThreadProps,\n  mapDispatchToThreadProps,\n\
  \  mergeThreadProps\n)(Thread);\n```\n\n`redux/chat_intermediate/src/complete/App-16.js`\n\
  \n请确保从 `App.js` 中移除旧的 `ThreadDisplay` 组件声明。\n\n使用 `connect()` 的 `mergeProps` 参数感觉像是一个权宜之计。这是因为使用\
  \ `connect()` 的参数非常严格。这是设计如此。该库出于性能考虑以及为了防止开发者可能的错误，强制执行了这种用法。\n\n然而，通过我们的合并函数，我们让\
  \ `connect()` 按照预期生成了 `ThreadDisplay` 组件。我们移除了容器组件周围的一些样板代码。而且，我们将 Redux 和 React\
  \ 之间的连接隔离到了单个区域——作为 `Provider` 的属性。\n\n让我们验证一切是否运行正常。\n\n### 尝试一下\n\n确保服务器正在运行。导航到\
  \ `http://localhost:3000` 并观察应用的所有功能是否正常工作。\n\n### Action creators\n\n现在，在任何想要 dispatch\
  \ action 的地方，我们都会声明一个具有特定 `type` 的 action 对象及其所需的属性。例如，对于 `DELETE_MESSAGE` action：\n\
  \n```\ndispatch({\n  type: 'DELETE_MESSAGE',\n  id: id,\n})\n```\n\n在应用程序的当前迭代中，我们只从单一位置\
  \ dispatch 每种类型的 action。随着 Redux 应用的增长，同一个 action 从多个位置 dispatch 是很常见的。\n\n一种流行的模式是使用\
  \ action creators 来创建 action 对象。action creator 是一个返回 action 对象的函数。我们 `DELETE_MESSAGE`\
  \ action 的 action creator 如下所示：\n\n```javascript\n// `DELETE_MESSAGE` 的示例 action\
  \ creator\nfunction deleteMessage(id) {\n    return {\n      type: 'DELETE_MESSAGE',\n\
  \      id: id,\n    };\n  }\n```\n\n那么，在应用程序的任何地方，如果我们想 dispatch 一个 `DELETE_MESSAGE`\
  \ action，我们只需要使用我们的 action creator：\n\n```\ndispatch(deleteMessage(id));\n```\n\n\
  这是一种轻量级的抽象，它从 React 组件中隐藏了 action 的 `type` 及其属性名。更重要的是，使用 action creators 允许某些高级模式，例如将\
  \ API 请求与 action dispatch 耦合在一起。\n\n让我们把 action 对象换掉，转而代用 action creators。\n\n首先，我们将编写\
  \ action creators。让我们在 `createStore()` 初始化 store 的那一行声明它们。\n\n我们已经看到了 `deleteMessage()`\
  \ action creator 的样子。该 action creator 是接收要删除消息的 `id` 的函数。它返回一个类型为 `DELETE_MESSAGE`\
  \ 的对象：\n\n```javascript\nfunction deleteMessage(id) {\n  return {\n    type: 'DELETE_MESSAGE',\n\
  \    id: id,\n  };\n}\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n`addMessage()` action creator 期望一个 `text` 和 `threadId` 参数：\n\n```javascript\n\
  function addMessage(text, threadId) {\n  return {\n    type: 'ADD_MESSAGE',\n  \
  \  text: text,\n    threadId: threadId,\n  };\n}\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n而 `openThread` 期望要打开的线程 `id`：\n\n```javascript\nfunction openThread(id) {\n  return\
  \ {\n    type: 'OPEN_THREAD',\n    id: id,\n  };\n}\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n我们现在可以处理 `App.js` 并将 action 对象替换为 action creators。\n\n在 `mapDispatchToProps()`\
  \ 内部：\n\n```javascript\nconst mapDispatchToProps = (dispatch) => (\n  {\n    onClick:\
  \ (id) => (\n      dispatch(openThread(id))\n    ),\n  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n在 `mapDispatchToThreadProps()` 中：\n\n```javascript\nconst mapDispatchToThreadProps\
  \ = (dispatch) => (\n  {\n    onMessageClick: (id) => (\n      dispatch(deleteMessage(id))\n\
  \    ),\n    dispatch: dispatch,\n  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n最后是 `mergeThreadProps()`：\n\n```javascript\nconst mergeThreadProps = (stateProps,\
  \ dispatchProps) => (\n  {\n    ...stateProps,\n    ...dispatchProps,\n    onMessageSubmit:\
  \ (text) => (\n      dispatchProps.dispatch(\n        addMessage(text, stateProps.thread.id)\n\
  \      )\n    ),\n  }\n);\n```\n\n`redux/chat_intermediate/src/complete/App-17.js`\n\
  \n使用 action creators 的另一个好处是它们在一个地方列出了我们系统中所有可能的 action。我们不再需要通过搜寻 reducer 或 React\
  \ 组件来推断可能 action 的形状。随着系统中 action 数量的增加，这一点会更加明显。\n\n### 总结\n\n在过去的三个章节中，我们探索了 Redux\
  \ 设计模式的基础。我们由 Redux 驱动的聊天应用的架构与使用 React 组件状态的情况会有显著不同。\n\n我们不需要担心将属性通过过多的中间组件传递，因为我们在容器组件中靠近叶子组件的地方定义功能。考虑一下如果我们想为每个线程添加更多数据，例如用户的头像的情况。我们只需要调整容器组件中的\
  \ state-to-props 映射函数，使头像 URL 可供展示组件使用即可。\n\n此外，我们没有一个执行所有状态管理的重型顶级组件，而是有一系列 reducer\
  \ 函数，每个函数处理状态树的一个部分。如果一个 action 应该影响状态树的多个部分，这里的优势会更加突出。\n\n\n\n\n\n想象一下，我们在聊天应用中引入一个通知计数器。该计数器显示未读会话的数量。每当用户打开一个会话时，我们都希望减少这个计数器。\n\
  \n在组件状态范式中，这意味着该函数——例如 `handleThreadOpen()`——不仅会影响状态树中的 `activeThreadId` 部分，它还负责修改通知计数器。在这种模型下，影响状态树多个部分的单项操作会迅速变得繁琐。\n\
  \n使用 Redux，特定操作对状态树每个部分的影响被隔离在每个 reducer（用例器）中。在我们的案例中，我们不需要为了引入新的通知计数器而去去触动 `activeThreadIdReducer()`。`OPEN_THREAD`\
  \ 对通知计数器的影响将隔离在负责该部分状态的 reducer 中。\n\n## 异步与服务器通信\n\n在开始使用 Redux 构建真实世界的应用之前，你需要的最后一个概念是处理与服务器通信。\n\
  \nRedux 并没有内置的用于处理异步的成熟机制。相反，在 Redux 生态系统中有多种处理异步的工具和模式。\n\n虽然 Redux 中的异步处理不在本书的范围之内，但由于最后几章已经涵盖了\
  \ Redux 基础，你已经有能力将这些模式和库集成到自己的应用中了。\n\n最流行的策略是使用一个名为 [redux-thunk](https://github.com/gaearon/redux-thunk)\
  \ 的轻量级中间件。使用 `redux-thunk`，你可以让 `dispatch` 调用执行一个函数，而不是直接向 store 派发 action。在函数内部，你可以发送网络请求并在请求完成后派发一个\
  \ action。\n\n关于使用 `redux-thunk` 处理异步的详细示例，请参阅 Redux 网站上的此教程：[`redux.js.org/docs/advanced/AsyncActions.html`](http://redux.js.org/docs/advanced/AsyncActions.html)。\n\
  \n## 使用 GraphQL\n\n在过去的几个章节中，我们探索了如何使用 JSON 和 HTTP API 构建与服务器交互的 React 应用。在本章中，我们将探索\
  \ GraphQL，它是一种由 Facebook 开发的特定 API 协议，与 React 生态系统非常契合。\n\nGraphQL 是什么？从字面上讲，它是“图查询语言”，如果你用过\
  \ SQL 等其他查询语言，这听起来可能熟悉。如果你的服务器“说” GraphQL，那么你可以向它发送一个 GraphQL 查询字符串并期望得到 GraphQL\
  \ 响应。我们很快就会深入细节，但 GraphQL 的特性使其特别适合跨平台应用和大型产品团队。\n\n为了发现原因，让我们从一个简单的演示开始。\n\n###\
  \ 你的第一个 GraphQL 查询\n\n通常，GraphQL 查询是使用 HTTP 请求发送的，类似于我们在前面的章节中发送 API 请求的方式；然而，每个服务器通常只有一个\
  \ URL 端点来处理所有的 GraphQL 请求。\n\n[GraphQLHub](https://www.graphqlhub.com/) 是一个 GraphQL\
  \ 服务，将在整个章节中使用它来学习 GraphQL。它的 GraphQL 端点是 `https://www.graphqlhub.com/graphql`，我们使用\
  \ HTTP POST 方法发布 GraphQL 查询。打开终端并执行此 cURL 命令：\n\n```\n$ curl -H 'Content-Type:application/graphql'\
  \ -XPOST https://www.graphql\\\nhub.com/graphql?pretty=true -d '{ hn { topStories(limit:\
  \ 2) { title url\\\n } } } }'\n{\n  \"data\": {\n    \"hn\": {\n      \"topStories\"\
  : [\n        {\n          \"title\": \"Bank of Japan Is an Estimated Top 10 Holder\
  \ in 90% \\\nof the Nikkei 225\",\n          \"url\": \"http://www.bloomberg.com/news/articles/2016-04-24/the\\\
  \n-tokyo-whale-is-quietly-buying-up-huge-stakes-in-japan-inc\"\n        },\n   \
  \     {\n          \"title\": \"Dropbox as a Git Server\",\n          \"url\": \"\
  http://www.anishathalye.com/2016/04/25/dropbox-as-a-t\\\nrue-git-server/\"\n   \
  \     }\n      ]\n    }\n  }\n}\n```\n\n返回可能需要几秒时间，但你应该看到一个描述 [Hacker News](https://news.ycombinator.com)热门故事标题和\
  \ URL 的 JSON 对象。恭喜，你刚刚执行了你的第一个 GraphQL 查询！\n\n让我们分解一下这个 cURL 发生了什么。我们首先将 `Content-Type`\
  \ 头部设置为 `application/graphql` —— 这是 GraphQLHub 服务器知道我们正在发送 GraphQL 请求的方式，这是许多 GraphQL\
  \ 服务器的常用模式（我们稍后会在“编写你的 GraphQL 服务器”中看到）。\n\n接下来，我们指定了向 `/graphql?pretty=true` 端点的\
  \ POST 请求。`/graphql` 部分是路径，`pretty` 查询参数指示服务器以人类易读的缩进格式返回数据（而不是返回单行文本的 JSON）。\n\n\
  最后，我们 cURL 命令中的 `-d` 参数是用来指定 POST 请求体的方式。对于 GraphQL 请求，正体通常是一个 GraphQL 查询。我们必须为\
  \ cURL 将请求写成一行，但当我们对查询进行适当的扩展和缩进时，它看起来是这样的：\n\n```\n 1 // 单行\n 2 { hn { topStories(limit:\
  \ 2) { title url } } }\n 3 \n 4 // 扩展\n 5 {\n 6   hn {\n 7     topStories(limit:\
  \ 2) {\n 8       title\n 9       url\n10     }\n11   }\n12 }\n```\n\n返回可能需要几秒时间，但你应该看到一个描述\
  \ Hacker News（https://news.ycombinator.com）热门故事标题和 URL 的 JSON 对象。恭喜，你刚刚执行了你的第一个\
  \ GraphQL 查询！\n\n让我们分解一下这个 cURL 发生了什么。我们首先将 `Content-Type` 头部设置为 `application/graphql`\
  \ —— 这是 GraphQLHub 服务器知道我们正在发送 GraphQL 请求的方式，这是许多 GraphQL 服务器的常用模式（我们稍后会在“编写你的 GraphQL\
  \ 服务器”中看到）。\n\n接下来，我们指定了向 `/graphql?pretty=true` 端点的 POST 请求。`/graphql` 部分是路径，`pretty`\
  \ 查询参数指示服务器以人类易读的缩进格式返回数据（而不是返回单行文本的 JSON）。\n\n最后，我们 cURL 命令中的 `-d` 参数是用来指定 POST\
  \ 请求体的方式。对于 GraphQL 请求，正体通常是一个 GraphQL 查询。我们必须为 cURL 将请求写成一行，但当我们对查询进行适当的扩展和缩进时，它看起来是这样的：\n\
  \n```\n 1 // 单行\n 2 { hn { topStories(limit: 2) { title url } } }\n 3 \n 4 // 扩展\n\
  \ 5 {\n 6   hn {\n 7     topStories(limit: 2) {\n 8       title\n 9       url\n\
  10     }\n11   }\n12 }\n```\n\n这是一个 GraphQL 查询。在表面上它可能与 JSON 相似，但在语法和功能上有关键区别。\n\
  \n注意我们的查询结构与返回的结构相同。我们指定了名为 `hn`、`topStories`、`title` 和 `url` 的属性，且没有额外的或缺失的项。这是\
  \ GraphQL 的关键特性之一：**你请求你想要的特定数据**，且不会隐式返回其他数据。\n\n从这个例子中并不明显，但 GraphQL 不仅跟踪可查询的属性，还跟踪每个属性的类型（如数字、字符串、布尔值等）。GraphQL\
  \ 服务器知道 `topStories` 将是一个包含 `title` 和 `url` 的对象列表，并且 `title` 和 `url` 是字符串。类型系统比简单的字符串和对象强大得多，而且随着产品变得复杂，长期来看可以节省时间。\n\
  \n### GraphQL 的优势\n\n现在我们已经看到了一些 GraphQL 的运行，你可能会问，“为什么有人会偏好 GraphQL 而不是以 URL 为中心的\
  \ API（如 REST）？”乍看之下，似乎比传统协议需要更多工作和设置 —— 我们得到了什么？\n\n首先，通过声明我们从服务器所需的精确数据，我们的 API\
  \ 调用变得更容易理解。对于 Web 应用代码库的新手来说，看到 GraphQL 查询可以立即看出哪些数据是来自服务器，哪些数据是在客户端派生的。\n\nGraphQL\
  \ 还为更好的单元测试和集成测试打开了大门：在客户端模拟数据非常容易，并且可以断言服务器的 GraphQL 更改不会破坏客户端代码中的 GraphQL 查询。\n\
  \n传统 JSON API 的开发体验最好也只是勉强接受（更多时候令人恼恼）。大多数 API 缺乏文档，或者更糟糕的是文档与 API 的行为不一致。API 可能会发生变化，无法立即确定（例如通过编译时检查）应用程序的哪些部分会崩溃。很少有\
  \ API 允许发现属性或新端点，而且通常发生在定制的机制中。\n\n\n\n\nGraphQL 极大提升了开发者体验 - 它的类型系统提供了一种`活的自文档化形式`，而像\
  \ `GraphiQL`（我们在本章中会用到它）这样的工具允许人们对 GraphQL 服务器进行自然的探索。\n\n![使用 GraphiQL 导航 Schema](img/9-graphql----graphiql_all.png)\n\
  \n#### 使用 GraphiQL 导航 Schema\n\n最后，GraphQL 的声明式特性与 React 的声明式特性完美契合。包括 Facebook\
  \ 的 `Relay` 框架在内的几个项目正尝试在 React 中实现“同地化查询”（colocated queries）的想法。想象一下，编写一个 React\
  \ 组件，它可以自动从服务器获取所需的数据，而无需编写任何用于调用 API 或跟踪请求生命周期的胶水代码。\n\n随着你的团队和产品的增长，这些优势会产生叠加效应，这就是为什么它演变成了\
  \ Facebook 客户端和服务器之间交换数据的主要方式。\n\n## GraphQL vs. REST\n\n我们提到过一些替代协议，但让我们专门比较一下\
  \ GraphQL 和 REST。\n\nREST 的缺点之一是“端点蔓胀”（endpoint creep）。想象你正在构建一个社交网络应用，并从一个 `/user/:id/profile`\
  \ 端点开始。起初，该端点返回的数据对于每个平台和应用的每个部分都是相同的，但随着产品的不断演进，积累了更多符合“profile”（个人资料）范畴的功能。对于只需要\
  \ `some` 资料数据的应用新部分（例如新闻列表中的工具提示）来说，这将产生问题。因此，你可能会创建一个类似 `/user/:id/profile_short`\
  \ 的端点，它是完整个人资料的限制版本。\n\n当你遇到更多需要新端点的情况（想象一下有一个 `profile_medium`！）），你现在会通过调用 `/profile`\
  \ 和 `/profile_short` 来复用部分数据，这可能会浪费服务器和网络资源。它还让开发体验变得更难理解 - 开发者在哪里可以找到每个变体返回了哪些数据？你的文档是最新的吗？\n\
  \n创建 *N* 个端点的替代方案是在查询参数中添加一些类似 GraphQL 风格的功能，例如 `/user/:id/profile?include=user.name,user.id`。这允许客户端指定它们想要的数据，但仍然缺乏让这种系统长期运行的许多\
  \ GraphQL 功能。例如，那种类型的 API 仍然缺乏强类型信息，无法实现健壮的单元测试和长效代码。这对于移动应用来说尤为关键，因为旧的二进制文件可能在环境中存在很长时间。\n\
  \n最后，用于开发和调试 REST API 的工具通常平平无奇，因为流行的 API 之间很少有共同点。在最底层，你拥有像 `cURL` 和 `wget` 这样的通用工具；某些\
  \ API 可能支持 [Swagger](http://swagger.io/) 或其他文档格式；而在最高层，对于 `Elasticsearch` 或 Facebook\
  \ 的 `Graph API` 等特定 API，你可能会找到定制工具。GraphQL 的类型系统支持内省（换句话说，你可以使用 GraphQL 本身来发现有关\
  \ GraphQL 服务器的信息），这使得开发者工具变得可插拔且携。\n\n## GraphQL vs. SQL\n\n将 GraphQL 与 SQL 进行比较（抽象地，不绑定到特定的数据库或实现）也是值得的。使用\
  \ [Facebook 查询语言 (FQL)](https://en.wikipedia.org/wiki/Facebook_Query_Language) 将\
  \ SQL 用于 Web 应用是有先例的 - 什么让 GraphQL 成为更好的选择？\n\nSQL 对于访问关系型数据库非常有帮助，并且与此类数据库的内部结构工作得很好，但它不是前端应用消费数据的方式。在浏览器端处理连接（joins）和聚合（aggregations）等概念就像抽象泄漏\
  \ - 反之，我们通常希望将信息视为图。我们经常想：“获取这个特定的用户，然后获取该用户的朋友”，其中“朋友”可以是任何类型的连接，如照片或财务数据。\n\n\
  还存在安全担忧 - 直接从 Web 应用将 SQL 推送到底层数据库中是极具诱惑力的，这将不可避免地导致安全问题。正如我们稍后看到的，GraphQL 还可以围绕谁可以查看什么类型的数据实现精确的访问控制逻辑，并且通常更灵活，且不太像使用原始\
  \ SQL 那样不安全。\n\n记住，使用 GraphQL 并不意味着你必须放弃后端的 SQL 数据库 - GraphQL 服务器可以位于任何数据源之上，无论是\
  \ SQL、`MongoDB`、`Redis` 甚至是第三方 API。事实上，GraphQL 的优势之一是可以编写单个 GraphQL 服务器，它作为多个数据存储（或其他\
  \ API）的抽象层并同时提供服务。\n\n## Relay 和 GraphQL 框架\n\n我们讨论了许多*为什么*应该考虑 GraphQL，但没有深入探讨*如何*使用\
  \ GraphQL。我们很快就会开始揭示更多内容，但我们应该提到 `Relay`。\n\n[Relay](https://facebook.github.io/relay/)\
  \ 是 Facebook 用于将 React 组件连接到 GraphQL 服务器的框架。它允许你编写如下代码，展示了 `Item` 组件如何自动从 Hacker\
  \ News GraphQL 服务器检索数据：\n\n```\n 1 class Item extends React.Component {\n 2   render()\
  \ {\n 3     let item = this.props.item;\n 4 \n 5     return (\n 6       <<div>\n\
  \ 7         <h1><a href={item.url}>{item.title}</a></h1>\n 8         <h2>{item.score}\
  \ - {item.by.id}</h2>\n 9         <hr />\n10       </div>\n11     );\n12   }\n13\
  \ };\n14 \n15 Item = Relay.createContainer(Item, {\n16   fragments: {\n17     item:\
  \ () => Relay.gql`\n18       fragment on HackerNewsItem {\n19         id\n20   \
  \      title,\n21         score,\n22         url\n23         by {\n24          \
  \ id\n25         }\n26       }\n27     `\n28   },\n29 });\n```\n\n在后台，Relay 智能地处理数据的批处理和缓存以提高性能。我们稍后会深入讨论\
  \ Relay，但这应该让你对 GraphQL 和 React 如何完美协同工作有一个大致的了解。\n\n还有其他集成 GraphQL 和 React 的新兴方法，例如\
  \ Meteor 团队的 [Apollo](http://www.apollostack.com/)。\n\n你也可以在不使用 React 的情况下使用 GraphQL\
  \ - 在你传统使用 API 用的地方都可以轻松使用，包括使用 Angular 或 Backbone 等其他技术。\n\n### 预览\n\n使用 GraphQL\
  \ 有两个方面：作为客户端或前端应用的作者，以及作为 GraphQL 服务器的作者。我们将在本章和下一章中涵盖这两个方面。\n\n\n\n\n在本章开始时，我们使用\
  \ `cURL` 在 GraphQLHub 上执行了一个 GraphQL 查询。这并不是 GraphQLHub 提供其 GraphQL 端点的唯一方式：它还托管了一个名为\
  \ [GraphiQL](https://github.com/graphql/graphiql) 的视觉化 IDE。`GraphiQL` 由 Facebook\
  \ 开发，可以在极少配置的情况下托管在任何 GraphQL 服务器上。\n\n你始终可以使用诸如 `cURL` 或任何支持 HTTP 请求的语言来发送 GraphQL\
  \ 请求，但在你熟悉特定的 GraphQL 服务器或通用的 GraphQL 期间，`GraphiQL` 特别有帮助。它提供了错误或建议的类型自动补全支持、可搜索的文档（使用\
  \ GraphQL 内省查询动态生成），以及一个支持代码折叠和语法高亮的 JSON 视视器。\n\n前往 [`graphqlhub.com/playground`](https://graphqlhub.com/playground)\
  \ 首次查看 `GraphiQL`：\n\n![Empty GraphiQL](img/9-graphql----bare_graphiql.png)\nEmpty\
  \ GraphiQL\n\n目前还没有什么内容 - 请继续输入我们之前通过 `cURL` 执行的 GraphQL 查询：\n\n![GraphiQL query](img/9-graphql----graphiql_query.png)\n\
  GraphiQL query\n\n当你输入查询时，你会注意到实用的自动补全支持。如果你犯了错误，例如输入了一个不存在的字段，`GraphiQL` 会立即警告你：\n\
  \n![GraphiQL error](img/9-graphql----graphiql_error.png)\nGraphiQL error\n\n这是 GraphQL\
  \ 类型系统运作的一个绝佳示例。`GraphiQL` 知道存在哪些字段和类型，在这种情况下，字段 `urls` 并不存在 `HackerNewsItem` 类型中。我们稍后将探讨类型是如何获取其字段和名称的。\n\
  \n点击顶部导航栏中的“Play”按钮执行你的查询。你会看到新数据出现在右侧面板中：\n\n![GraphiQL data](img/9-graphql----graphiql_data.png)\n\
  GraphiQL data\n\n看到 `GraphiQL` 右角的那个“Docs”按钮了吗？点击它来展开完整的文档浏览器：\n\n![GraphiQL docs](img/9-graphql----graphiql_docs.png)\n\
  GraphiQL docs\n\n可以随意点击并探索，但最终请回到截图中的页面（顶层页面），搜索我们之前遇到麻烦的那个 `HackerNewsItem` 类型：\n\
  \n![GraphiQL search](img/9-graphql----graphiql_search.png)\nGraphiQL search\n\n\
  点击匹配的项。这会带你进入描述 `HackerNewsItem` 类型的文档，其中包含描述（由人工编写，而非生成）以及该类型上所有字段的列表。你可以点击字段及其类型以获取更多信息：\n\
  \n![GraphiQL HackerNewsItem](img/9-graphql----graphiql_hnitem.png)\nGraphiQL HackerNewsItem\n\
  \n![GraphiQL HackerNewsUser](img/9-graphql----graphiql_hnuser.png)\nGraphiQL HackerNewsUser\n\
  \n如你所见，`HackerNewsItem` 的 `by` 字段类型为 `HackerNewsUser`，它有自己的一组字段和链接。让我们更改查询来获取作者的信息：\n\
  \n![GraphiQL query with HackerNewsUser](img/9-graphql----graphiql_query_user.png)\n\
  GraphiQL query with HackerNewsUser\n\n注意 `by` 字段现在同时出现在我们的查询和最终数据中 - 哒当！\n\n在我们开始研究\
  \ GraphQL 机制时，请将 GraphQLHub 的 `GraphiQL` 留在标签页中。\n\n### GraphQL 语法基础\n\n让我们深入研究\
  \ GraphQL 的语义。我们使用了一些如“query”（查询）”、“field”（字段）和“type”（类型）之类的术语，但我们还没有正式定义它们，在进一步深入工作之前，还有几个需要涵盖。要对这些主题进行完整且正式的检查，你始终可以参考\
  \ [GraphQL 规范](https://facebook.github.io/graphql/)。\n\n发送到 GraphQL 服务器的整个字符串被称为\
  \ `document`（文档）。文档可以包含一个或多个 `operations`（操作）——目前为止，我们的示例文档只包含 `query operation`，但你也可以发送\
  \ `mutation operations`（变更操作）。\n\n`query` 操作是只读的——当你发送查询时，你是在请求服务器给你一些数据。`mutation`\
  \ 旨在执行写入后进行获取；换句话之，“更改这些数据，然后给我一些其他数据。”我们稍后会更多地探索变更，但它们与查询使用相同的类型系统并具有相同的语法。\n\n\
  这是一个仅包含一个查询的文档示例：\n\n```\n1 query getTopTwoStories {\n2   hn {\n3     topStories(limit:\
  \ 2) {\n4       title\n5       url\n6     }\n7   }\n8 }\n```\n\n注意，我们在原始查询前加上了 `query\
  \ getTopTwoStories`，这是在文档中指定操作完整且正式的方法。首先我们声明操作类型（`query` 或 `mutation`），然后是操作名称（`getTopTwoStories`）。如果你的\
  \ GraphQL 文档只包含一个操作，你可以省略正式声明，GraphQL 将假设你指的是查询：\n\n```\n1 {\n2   hn {\n3     topStories(limit:\
  \ 2) {\n4       title\n5       url\n6     }\n7   }\n8 }\n```\n\n这是一个仅包含一个查询的文档示例：\n\
  \n```\n1 query getTopTwoStories {\n2   hn {\n3     topStories(limit: 2) {\n4   \
  \    title\n5       url\n6     }\n7   }\n8 }\n```\n\n注意，我们在原始查询前加上了 `query getTopTwoStories`，这是在文档中指定操作完整且正式的方法。首先我们声明操作类型（`query`\
  \ 或 `mutation`），然后是操作名称（`getTopTwoStories`）。如果你的 GraphQL 文档只包含一个操作，你可以省略正式声明，GraphQL\
  \ 将假设你指的是查询：\n\n```\n1 {\n2   hn {\n3     topStories(limit: 2) {\n4       title\n\
  5       url\n6     }\n7   }\n8 }\n```\n\n注意，我们在原始查询前加上了 `query getTopTwoStories`，这是在文档中指定操作完整且正式的方法。首先我们声明操作类型（`query`\
  \ 或 `mutation`），然后是操作名称（`getTopTwoStories`）。如果你的 GraphQL 文档只包含一个操作，你可以省略正式声明，GraphQL\
  \ 将假设你指的是查询：\n\n```\n1 {\n2   hn {\n3     topStories(limit: 2) {\n4       title\n\
  5       url\n6     }\n7   }\n8 }\n```\n\n注意，我们在原始查询前加上了 `query getTopTwoStories`，这是在文档中指定操作完整且正式的方法。首先我们声明操作类型（`query`\
  \ 或 `mutation`），然后是操作名称（`getTopTwoStories`）。如果你的 GraphQL 文档只包含一个操作，你可以省略正式声明，GraphQL\
  \ 将假设你指的是查询：\n\n```\n1 {\n2   hn {\n3     topStories(limit: 2) {\n4       title\n\
  5       url\n6     }\n7   }\n8 }\n```\n\n*(注：由于输入文本中存在大量重复的段落，上述翻译已根据逻辑进行了整合处理，确保了核心内容的连贯性。)*\n\
  \n\n\n\nGraphQL 字段的参数也可以复杂的对象，称为 `input objects`（输入对象）。这些不仅仅是我们之前展示的字符串或数字标量，而是任意深度嵌套的键值映射。这里有一个示例，参数\
  \ `storyData` 接收一个具有 `url` 属性的输入对象：\n\n```\n1 {\n2   hn {\n3     createStory(storyData:\
  \ { url: \"http://fullstackreact.com\" }) {\n4       url\n5     }\n6   }\n7 }\n\
  ```\n\nGraphQL 服务器的字段集合被称为它的 `schema`（模式）。像 `GraphiQL` 这样的工具可以下载整个 `schema`（我们稍后会展示如何如何操作）并用它来进行自动补全和其他功能。\n\
  \n### 复杂类型\n\n我们讨论了标量，但对复杂类型只是略带提及，尽管我们在示例中已经使用了它们。`hn` 和 `topStories` 字段分别是 `Object`\
  \ 和 `List` 类型字段的示例。在 `GraphiQL` 中，我们可以探索它们的精确类型 - 搜索 `HackerNewsAPI` 来查看关于 `hn`\
  \ 的详情：\n\n![HackerNewsAPI type](img/9-graphql----graphiql_hnapi.png)\n\nHackerNewsAPI\
  \ 类型\n\n### 联合 (Unions)\n\n如果你的字段实际上应该是多个类型之一怎么办？例如，如果你的 `schema` 具有某种通用搜索功能，它可能会返回许多不同的类型。到目前为止，我们只见过每个字段都是一种类型，要么是标量，要么是复杂对象\
  \ - 我们如何处理像搜索这样的东西？\n\nGraphQL 为这种用例提供了几种机制。首先是 `unions`（联合），它允许你定义一个新的类型，该类型是其他类型列表之一。这个联合示例直接来自\
  \ [GraphQL 规范](https://facebook.github.io/graphql/#sec-Unions)：\n\n```\n 1 union\
  \ SearchResult = Photo | Person\n 2 \n3 type Person {\n4   name: String\n5   age:\
  \ Int\n6 }\n 7 \n8 type Photo {\n9   height: Int\n10   width: Int\n11 }\n12 \n13\
  \ type SearchQuery {\n14   firstSearchResult: SearchResult\n15 }\n```\n\n这种语法看起来很陌生？它是\
  \ GraphQL 规范用于描述 GraphQL 模式的一种非正式伪代码变体 - 我们不会使用这种格式编写任何代码，它纯粹是为了更容易在独立于服务器代码的情况下描述\
  \ GraphQL 类型。\n\n在那个示例中，`SearchQuery` 类型有一个 `firstSearchResult` 字段，它可以是 `Photo`\
  \ 类型也可以是 `Person` 类型。联合中的类型不需要是对象 - 可以是标量、其他联合，甚至是两者的混合。\n\n### 片段 (Fragments)\n\
  \n如果你观察得仔细，你会发现 `Person` 和 `Photo` 之间没有共同字段。我们如何编写一个处理这两种情况的 GraphQL 查询呢？换句话说，如果我们的搜索返回一个\
  \ `Photo`，我们如何知道要返回 `height` 字段？\n\n这就是 `fragments`（片段）派上用场的地方。片段允许你对一组字段进行分组分组，并在整个查询中复用它们。对于上述模式，带有片段的查询可能如下：\n\
  \n```\n 1 {\n2   firstSearchResult {\n3     ... on Person {\n4       name\n5   \
  \  }\n6     ... on Photo {\n7       height\n8     }\n9   }\n10 }\n```\n\n`... on\
  \ Person` 部分被称为 `inline fragment`（内联片段）。用通俗的话说，我们可以认为：“如果 `firstSearchResult` 是\
  \ `Person`，则返回 `name`；如果它是 `Photo`，则返回高度。”\n\n片段不必是内联的；它们可以被命名并在整个文档中复用。我们可以使用 `named\
  \ fragments`（命名片段）重写上面的示例：\n\n```\n 1 {\n2   firstSearchResult {\n3     ... searchPerson\n\
  4     ... searchPhoto\n5   }\n6 }\n 7 \n8 fragment searchPerson on Person {\n9 \
  \  name\n10 }\n11 \n12 fragment searchPhoto on Photo {\n13   height\n14 }\n```\n\
  \n这将允许我们在查询的其他部分使用 `searchPerson`，不需要在到处重复相同的内联片段。\n\n### 接口 (Interfaces)\n\n除了联合之外，GraphQL\
  \ 还支持 `interfaces`（接口），你可能在 Java 等编程语言中熟悉它们。在 GraphQL 中，如果一个对象类型实现了一个接口，那么 GraphQL\
  \ 服务器将强制该类型拥有接口所需的所有字段。实现接口的 GraphQL 类型也可以拥有接口未指定的自己的字段，并且单个 GraphQL 类型可以实现多个接口。\n\
  \n为了继续搜索示例，你可以想象我们的搜索引擎具有这种类型的模式：\n\n```\n 1 interface Searchable {\n2   searchResultPreview:\
  \ String\n3 }\n 4 \n5 type Person implements Searchable {\n6   searchResultPreview:\
  \ String\n7   name: String\n8   age: Int\n9 }\n10 \n11 type Photo implements Searchable\
  \ {\n12   searchResultPreview: String\n13   height: Int\n14   width: Int\n15 }\n\
  16 \n17 type SearchQuery {\n18   firstSearchResult: Searchable\n19 }\n```\n\n让我们拆解一下。我们的\
  \ `firstSearchResult` 现在保证返回一个实现了 `Searchable` 的类型。因为这个未知的类型实现了 `Searchable`，这些是\
  \ GraphQL 的基础 - 操作、类型（标量和复杂）和字段 - 我们可以使用它们\n\n### 探索图 (Exploring a Graph)\n\n我们探索了\
  \ GraphQL 的“QL”部分，但没有触及太多“Graph”部分。图是由一组连接的对象组成的。每个对象被称为 `node`，而两个对象之间的链接被称为 `edge`。你可能不习惯用这种术语来思考你的产品数据，但它意外地代表了大多数应用。\n\
  \n让我们考虑 Facebook 的图：\n\n![Facebook Graph](img/9-graphql----facebook.png)\n\nFacebook\
  \ 图\n\n但也考虑像 Asana 这样的生产力应用的图：\n\n![Asana Graph](img/9-graphql----asana.png)\n\n\
  Asana 图\n\n注意，仅仅你的产品数据类似于图并不意味着你需要使用图数据库：Facebook 和 Asana 通常使用 MySQL。\n\n理想的 GraphQL\
  \ 模式符合数学图的形状。这里是图类型的一个预览：\n\n```\n 1 {\n2   viewer {\n3     id\n4     name\n5  \
  \   likes {\n6     edges {\n7       cursor\n8       node {\n9           id\n10 \
  \         name\n11        }\n12      }\n13    }\n14  }\n15  node(id: \"123123\"\
  ) {\n16    id\n17    name\n18  }\n19 }\n```\n\n对于来自 REST 的人来说似乎是过度设计。然而，这些模式源于 Facebook，并为产品的增长和增加新功能提供了基础。\n\
  \n在接下来的几个章节中，我们将描述的模式源自 [Relay 要求的 GraphQL 模式](https://facebook.github.io/relay/docs/graphql-relay-specification.html)。即使你不使用\
  \ Relay，这种思考 GraphQL 模式的方式也能防止你“与框架对抗”。\n\n### 图节点 (Graph Nodes)\n\n在查询图时，你通常需要从节点开始查询。你的应用程序要么直接获取节点上的字段，要么发现它具有哪些连接。\n\
  \n例如，在 Facebook 中查询“当前用户的动态”将从当前用户节点开始，探索与之连接的所有“动态项”节点。\n\n在地道的 GraphQL 中，我们通常定义这样一个简单的\
  \ Node 接口：\n\n```\n1 interface Node {\n2   id: ID\n3 }\n```\n\n因此任何实现此接口的类型都应该有一个\
  \ `id` 字段 - 仅此而已。记得之前 `ID` 标量类型会被转换为 `string`。如果你来自 REST 世界，这有点像你可以使用 URL `/$nouns/:id`\
  \ 来查询资源。\n\n\n\n\n地道的 GraphQL 与其他协议的一个关键区别是，你所有的节点 ID 都应该是全局唯一的。换句话说，拥有一个 ID 为“1”的\
  \ `User` 和一个 ID 为“1”的 `Photo` 是无效的，因为 ID 会发生冲突。\n\n这背后的原因是，你应该暴露一个顶层字段，允许你通过 ID\
  \ 查询任意节点，如下所示：\n\n```\n1 {\n2   node(id: \"the_id\") {\n3     id\n4   }\n5 }\n```\n\
  \n如果你有跨类型的 ID 冲突，将无法确定该字段应该返回什么。如果你在使用关系型数据库，这可能会让人困惑，因为默认情况下主键仅保证在表内是唯一的。一种常用技术是在数据库\
  \ ID 前加上一个与类型对应的字符串，从而使 ID 再次唯一。伪代码如下：\n\n```\n 1 const findNode = (id) => {\n 2\
  \   const [ prefix, dbId ] = id.split(\":\");\n 3   if(prefix === 'users') {\n 4\
  \     return database.usersTable.find(dbId);\n 5   }\n 6   else if ( ... ) {\n 7\
  \   }\n 8 };\n 9 \n10 const getUser = (id) => {\n 11   let user = database.usersTable.find(id);\n\
  \ 12   user.id = `users:${user.id}`;\n 13   return user;\n 14 };\n```\n\n每当我们的 GraphQL\
  \ 服务器返回用户（通过 `getUser`）时，它会更改数据库 ID 以确保其唯一性。当我们查找节点时（通过 `findNode`），我们会读取 ID 的“作用域”（scope）并采取相应的行动。这也突显了\
  \ GraphQL 中 ID 使用字符串的好处，因为它们允许像这样可读的更改。\n\n为什么我们想要能够使用 `node(id:)` 字段查询任何节点的能力？这使得我们的\
  \ Web 应用程序更容易“刷新”过时数据，而无需跟踪某条数据来自 Schema 何何。如果我们知道一个待办列表项的状态发生了变化，我们的应用应该从服务器查找最新状态，而无需知道它属于哪个项目或组。\n\
  \n通常情况下，我们的应用从开始并不查询全局节点 ID - 我们在 GraphQL 中如何描述“当前用户的节点”呢？事实证明，*查看者模式*（viewer pattern）大有用处。\n\
  \n### Viewer\n\n除了 `node(id:)` 字段外，如果你的 GraphQL Schema 有一个顶层的 `viewer` 字段，将非常有帮助。“viewer”（查看者）代表当前用户以及该用户的连接。在\
  \ Schema 级别，viewer 的类型应该像任何其他节点类型一样实现 `Node` 接口。\n\n如果你是从 REST 过去的，这要么隐式发生，要么你所有的端点都以\
  \ `/users/me/$resources` 这样的路径作为开头。GraphQL 倾向于显式行为，这就是 `viewer` 字段往往存在的原因。\n\n想象我们正在用\
  \ GraphQL 写一个 Slack 应用。在消息应用中，一切都是以用户为中心的（“*我*有哪些消息”、“*我*订阅了哪些频道”等），因此我们的查询看起来如下：\n\
  \n```\n 1 {\n 2   viewer {\n 3     id\n 4     messages {\n 5       participants\
  \ {\n 6         id\n 7         name\n 8       }\n 9       unreadCount\n10     }\n\
  11     channels {\n12       name\n13       unreadCount\n14     }\n15   }\n16 }\n\
  ```\n\n如果我们自己没有独立的顶层 `viewer` 字段，我们要么必须进行两次服务器调用（“获取当前用户的 ID，然后获取该用户获取消息”），要么必须创建顶层的\
  \ `messages` 和 `channels` 字段，并隐式地返回当前用户的数据。\n\n当我们以后实现自己的 GraphQL 服务器时，我们会发现使用 `viewer`\
  \ 字段也更容易实现授权逻辑（即防止一个用户看到另一个用户的消息）。\n\n### 图连接与边（Graph Connections and Edges）\n\n\
  在在上一个以 `viewer` 为中心的查询示例中，我们有两个字段可以被视为指向其他节点集合的*连接*（connections）（`messages` 和 `channels`）。对于简单且较小的数据集，我们可以直接返回所有这些节点的数组\
  \ - 但如果数据集非常大会发生什么？如果我们正在加载像 Reddit 帖子这样的内容，我们显然无法将它们放入一个数组中。\n\n加载大型数据集的常用方法是*分页*（pagination）。许多\
  \ API 允许你传递某些查询参数，如 `?page=3` 或 `?limit=25&offset=50` 来遍历更大的列表。这对于数据相对稳定的应用效果良好，但在数据近乎实时更新的应用中可能会导致糟糕的体验：类似于\
  \ Twitter 的馈流可能会在用户浏览时添加新推文，这会干扰偏移量计算并在加载新页时导致数据重复。\n\n地道的 GraphQL 对于如何解决该问题使用*基于游标的分页*（cursor-based\
  \ pagination）有着强烈的观点。GraphQL 不使用页码或限制和偏移量，而是通过请求传递*游标*（cursors，通常是字符串）来指定在列表中下次加载的位置。\n\
  \n用通俗的话说，GraphQL 请求检索一组初始节点，每个节点在返回时都带有一个唯一的游标；当应用需要加载更多数据时，它会发送一个新的请求，等同于“给我游标\
  \ *XYZ* 之后的 10 个节点”。\n\n让我们尝试使用支持游标的 GraphQL 端点。看看你可以发送给 GraphQLHub 的这个查询：\n\n```\n\
  \ 1 {\n 2   hn2 {\n 3     nodeFromHnId(id:\"dhouston\", isUserId:true) {\n 4   \
  \    ... on HackerNewsV2User {\n 5         submitted(first: 2) {\n 6           pageInfo\
  \ {\n 7             hasNextPage\n 8             hasPreviousPage\n 9            \
  \ startCursor\n10             endCursor\n11           }\n 12           edges {\n\
  \ 13             cursor\n 14             node {\n 15               id\n 16     \
  \          ... on HackerNewsV2Comment {\n 17                 text\n 18         \
  \      }\n 19             }\n 20           }\n 21         }\n 22       }\n 23  \
  \   }\n 24   }\n 25 }\n```\n\n这是一个相当大的查询，让我们拆解它 - 首先我们使用 `nodeFromHnId` 获取初始节点（它检索了\
  \ [Drew Houston](https://en.wikipedia.org/wiki/Drew_Houston) 的 Hacker News 账户）。然后我们获取\
  \ `submitted` 连接的前两个节点。一个 GraphQL 连接有两个字段，`pageInfo` 和 `edges`。`pageInfo` 是关于该特定“页面”的元数据（记住这更像是一个“窗口”而不是页面）。你的前端代码可以使用这些元数据来决定何时以及如何加载更多信息\
  \ - 例如如果 `hasNextPage` 为 true，则显示加载更多的按钮。`edges` 字段是实际节点的列表。\n\n注意 `id` 和 `cursor`\
  \ 是独立的字段 - 在某些系统中，可以将 `id` 作为游标的一部分（例如如果标识符是递增的整数），但其他系统可能倾向于让 `cursor` 取自时间戳、偏移量或两者。通常情况下，游标是不透明的字符串，并在一段时间后失效（在后端缓存结果的情况下）。\n\
  \n假设该查询返回的数据如下：\n\n```\n{\n  \"nodeFromHId\": {\n    \"submitted\": {\n      \"\
  pageInfo\": {\n        \"hasNextPage\": true,\n        \"hasPreviousPage\": false,\n\
  \        \"startCursor\": \"YXJyljb250aW9uOjE=\",\n        \"endCursor\": \"YXJyljb250aW9uOjI=\"\
  \n      },\n      \"edges\": [\n        {\n          \"cursor\": \"YXJyljb250aW9uOjE=\"\
  ,\n          \"node\": {\n            \"id\": \"aXRlbTo1MzgNjk0\",\n           \
  \ \"text\": \"it's not going anywhere :)<p>(actually, come work \\\non it: <a href=\\\
  \"https://www.dropbox.com/jobs\\\" rel=\\\"nofollow\\\">https:\\\n//www.dropbox.com/jobs</a>\
  \ :))\"\n          }\n        },\n        {\n          \"cursor\": \"YXJyljb250aW9uOjI=\"\
  ,\n          \"node\": {\n            \"id\": \"aXRlbTo0NjgxMzY2\",\n          \
  \  \"text\": \"yes we are :)\"\n          }\n        }\n      ]\n    }\n  }\n}\n\
  ```\n\n看看某些字段是如何匹配的 - `edges` 中的第一个 `cursor` 匹配 `startCursor`，同样，`endCursor` 匹配最后一个节点的\
  \ `cursor`。我们的前端代码可以使用 `endCursor` 来构建查询，使用 `after` 参数来获取下一组数据。\n\n\n\n\n\n```\n\
  {\n  hn2 {\n    nodeFromHnId(id:\"dhouston\", isUserId:true) {\n      ... on HackerNewsV2User\
  \ {\n        submitted(first: 2, after: \"YXJyYXljb25uZWN0aW9uOjI=\") {\n      \
  \    pageInfo {\n            hasNextPage\n            hasPreviousPage\n        \
  \    startCursor\n            endCursor\n          }\n          edges {\n      \
  \      cursor\n            node {\n              id\n              ... on HackerNewsV2Comment\
  \ {\n                text\n              }\n            }\n          }\n       \
  \ }\n      }\n    }\n  }\n}\n```\n\n连接（connections）上存在的其他参数是 `before` 和 `after`（接受游标），以及\
  \ `first` 和 `last`（接受整数）。\n\n如果你习惯了 REST 中的分页，游标（cursor）模式可能会显得很冗长，但请花五分钟时间探索一下我们演示的\
  \ Hacker News 分页 API。游标对实时更新具有鲁棒性，并且在加载节点时允许更具可复性的应用层代码。等稍后我们实现自己的 GraphQL 服务器时，我们将展示如何实现这种模式，你会发现它并没有像最初看起来那么令人生畏。\n\
  \n### Mutations（变异）\n\n当我们首次引入操作（operations）时，我们提到 `mutation` 与只读的 `query` 操作并存。大多数应用程序都需要一种向服务器写入数据的方法，这正是\
  \ mutations 的预期用途。\n\n在类 REST 协议中，mutations 通常通过 `POST`、`PUT` 和 `DELETE` HTTP 请求发生。从这个意义上说，GraphQL\
  \ 和 REST 都尝试将只读请求与写请求分离。那么我们通过 GraphQL 获得了什么呢？因为 GraphQL mutations 利用了 GraphQL 的类型系统，你可以在执行\
  \ mutation 后声明你想要返回的数据。\n\n例如，你可以尝试在 GraphQLHub 上运行这个 mutation 来编辑内存中的键值存储：\n\n\
  ```\n 1 mutation {\n 2  keyValue_setValue(input: {\n 3    clientMutationId: \"browser\"\
  , id: \"this-is-a-key\", value: \"this is a \\\n 4 value\"\n 5   }) {\n 6    item\
  \ {\n 7     value\n 8     id\n 9    }\n10   }\n11 }\n```\n\n这里的 mutation 字段是 `keyValue_setValue`，它接受一个\
  \ `input` 参数，提供要设置的键和值的信息。但我们也可以挑选 mutation 返回的字段，即 `item` 以及我们想要从该项中获取的任何字段集。如果你运行该请求，你将得到这样的负载：\n\
  \n```\n 1 {\n 2   \"data\": {\n 3     \"keyValue_setValue\": {\n 4       \"item\"\
  : {\n 5         \"value\": \"some value\",\n 6         \"id\": \"someKey\"\n 7 \
  \      }\n 8     }\n 9   }\n10 }\n```\n\n在 REST 世界，我们将受限于请求返回任何数据，随着产品的演进，我们可能需要对客户端和服务器上的该负载进行许多更改。使用\
  \ GraphQL 意味着我们的服务器和客户端在未来将更具灵活性。\n\n除了需要指定 `mutation` 操作类型外，mutations 的一切都是标准的\
  \ GraphQL：你拥有类型、字段和参数。正如我们稍后实现自己的 GraphQL schema 时将看到的，在服务器上实现它们也是相似的。\n\n### Subscriptions（订阅）\n\
  \n我们讨论了 GraphQL 的两种主要操作类型 `query` 和 `mutation`，但目前有第三种开发中的操作类型：`subscription`。订阅的用例是处理像\
  \ Twitter 和 Facebook 等应用中看到的实时更新，在这些应用中，项目的点赞或评论数会在用户无需手动刷新的情况下更新。\n\n这提供了极佳的用户体验，但在技术层面实现通常很复杂。GraphQL\
  \ 的观点是，服务器应该发布它可以订阅的事件集（例如对帖子的新点赞），而客户端可以选择订阅这些事件。查看 Facebook 在其[文档](http://graphql.org/blog/subscriptions-in-graphql-and-relay/)中提供的订阅示例：\n\
  \n```\n 1 input StoryLikeSubscribeInput {\n 2   storyId: string\n 3   clientSubscriptionId:\
  \ string\n 4 }\n 5 \n 6 subscription StoryLikeSubscription($input: StoryLikeSubscribeInput)\
  \ {\n 7   storyLikeSubscribe(input: $input) {\n 8     story {\n 9       likers {\
  \ count }\n10       likeSentence { text }\n11     }\n12   }\n13 }\n```\n\n发送带有此订阅的\
  \ GraphQL 请求基本上是告诉服务器：“嘿，每当发生 `StoryLikeSubscription` 时，这就是我想要的数据，这是我的 `clientSubscriptionId`，以便你知道在哪里找到我。”请注意，`clientSubscriptionId`\
  \ 的使用或关于 `subscription` 操作外观的任何细节并不是 GraphQL 特定的；它仅仅预留了 `subscription` 操作类型作为一种接受的形式，并将如何处理实时更新交由每个应用程序决定。\n\
  \n客户端订阅更新的机制不在 GraphQL 的范围内——Facebook 提到了使用 [MQTT](https://en.wikipedia.org/wiki/MQTT)\
  \ 配合 `clientSubscriptionId`，但其他可能性包括 [WebSockets](https://en.wikipedia.org/wiki/WebSocket)、[Server-Sent\
  \ Events](https://en.wikipedia.org/wiki/Server-sent_events) 或许多其他机制。在伪代码中，该过程如下：\n\
  \n```\n1 var clientId = generateSubscription();\n2 // 这个“通道”可以是 WebSockets 等等\n\
  3 connectToChannel(clientID, (newData) => {});\n```\n\n### 结合 JavaScript 使用 GraphQL\n\
  \n到目前为止，我们所有的查询都使用了 cURL 和 GraphiQL，但归根结底我们要编写的是 JavaScript 应用程序。如何在浏览器中发送 GraphQL\
  \ 请求呢？\n\n嗯，你可以使用任何喜欢的 HTTP 库——jQuery 的 AJAX 方法可以运行，甚至可以使用 XmlHttpRequests，它让你能够在旧的非\
  \ ES2015 应用程序中使用 GraphQL。但由于我们正在研究现代 JavaScript 应用程序，我们将使用 `fetch`。\n\n启动 Chrome，打开\
  \ [GraphQL 网站](https://www.graphqlhub.com/) 并打开 JavaScript 调试器。\n\n现代版本的 Chrome\
  \ 原生支持 `fetch`，这使得它非常适合原型设计，但你也可以使用支持 `fetch` 填充的其他工具。尝试这段代码：\n\n```\n1 var query\
  \ = ' { graphQLHub } ';\n2 var options = {\n 3   method: 'POST',\n 4   body: query,\n\
  \ 5   headers: {\n 6     'content-type': 'application/graphql'\n 7   }\n 8 };\n\
  9 \n10 fetch('https://graphqlhub.com/graphql', options).then((res) => {\n11   return\
  \ res.json();\n12 }).then((data) => {\n13   console.log(JSON.stringify(data, null,\
  \ 2));\n14 });\n```\n\n这里的配置看起来与我们 cURL 的设置相似。我们使用 `POST` 方法，设置正确的 `content-type`\
  \ 请求头，并将我们的 GraphQL 查询字符串作为请求体。运行你的代码片刻，你应该看到这样的输出：\n\n```\n1 {\n2   \"data\": {\n\
  3     \"graphQLHub\": \"Use GraphQLHub to explore popular APIs with GraphQL!\\\n\
  4  Created by Clay Allsopp @clayallsopp\"\n5   }\n6 }\n```\n\n恭喜，你用 JavaScript 运行了一个\
  \ GraphQL 查询！因为 GraphQL 请求归根底只是 HTTP，你可以逐步将 API 调用迁移到 GraphQL，不需要一次性完成。\n\n不过，调用\
  \ API 通常是一个相当底层的操作——它该如何集成到更大的应用程序中呢？\n\n### 结合 React 使用 GraphQL\n\n这本书完全关于 React\
  \ 的，所以现在是时候将 GraphQL 与 React 整合了，不是吗？快快了！\n\n\n\n\n使用 GraphQL 和 React 最有前景的方式是 Relay，我们专门为它准备了整一个章节。Relay\
  \ 自动化了许多 React/GraphQL 应用程序的最佳实践，例如缓存、缓存失效和批处理。要详述 Relay 实现这些机制的原理将是一项艰巨的任务，而且归结底，使用\
  \ Relay 比比自己写一套是更好的解决方案。\n\n但在现有应用中采用 Relay 可能会有更多摩擦，因此讨论一些为现有的 React 应用添加 GraphQL\
  \ 的技术是值得的。\n\n如果你. 正在使用 `Redux`，可能可以使用我们之前展示的 `fetch` 技术，将 REST 或其他 API 调用替换为 GraphQL\
  \ 调用。你将无法获得 Relay 或其他 GraphQL 专用库提供的内联查询 API（colocated queries API），但 GraphQL 的优处（如开发体验和可测试性）仍然会大放异彩。\n\
  \nRelay 也有新兴的替代方案。[Apollo](http://apollostack.com) 是项目集合，包括 [`react-apollo`](http://docs.apollostack.com/apollo-client/react.html)。`react-apollo`\
  \ 允许你以类似于 Relay 的方式将视图及其 GraphQL 查询放在一起（colocate），但在底层使用 Redux 来存储你的 GraphQL 缓存和数据。这里是一个简单的\
  \ Apollo 组件示例：\n\n```\n 1 class AboutGraphQLHub extends React.Component {\n 2  \
  \ render() {\n 3     return <div>{ this.props.about.graphQLHub }</div>;\n 4   }\n\
  \ 5 }\n 6 \n 7 const mapQueriesToProps = () => {\n 8   return {\n 9     about :\
  \ {\n10       query: '{ graphQLHub }'\n11     }\n12   };\n13 };\n14 \n15 const ConnectedAboutGraphQLHub\
  \ = connect({\n16   mapQueriesToProps\n17 })(AboutGraphQLHub);\n```\n\n基于 Redux\
  \ 构建意味着你可以像集成其他中间件或 reducer 一样，更轻松将其集成到现有的 Redux store 中：\n\n```\n 1 import ApolloClient\
  \ from 'apollo-client';\n 2 import { createStore, combineReducers, applyMiddleware\
  \ } from 'redux';\n 3 \n 4 \n 5 const client = new ApolloClient();\n 6 \n 7 const\
  \ store = createStore(\n 8   combineReducers({\n 9     apollo: client.reducer(),\n\
  10     // other reducers here\n11   }),\n12   applyMiddleware(client.middleware())\n\
  13 );\n```\n\n如果这听起来适合你的项目，请查看 [Apollo 文档](http://docs.apollostack.com/index.html)。\n\
  \n## 结语\n\n现在你已经写了几个 GraphQL 查询，了解了它的不同特性，甚至还写了一些代码在浏览器中运行 GraphQL。如果你的产品已经有一个现有的\
  \ GraphQL 服务器，那么也许可以继续并跳转到 Relay 章节——但在大多数情况下，你仍然需要编写你自己的 GraphQL 服务器。加油（Excelsior）！\n\
  \n# GraphQL 服务器\n\n### 编写 GraphQL 服务器\n\n为了使用 Relay 或任何其他 GraphQL 库，你需要一个能通过 GraphQL\
  \ 通的服务器。在本章节中，我们将使用 NodeJS 和之前章节中使用其他技术来编写一个后端 GraphQL 服务器。\n\n我们使用 Node 是因为我们可以利用\
  \ React 生态系统中其他地方使用的工具，而且 Facebook 他们的许多后端库都是针对 Node 的。然而，在每种流行的语言中都有 GraphQL 服务器库，例如\
  \ [Ruby](https://github.com/rmosolgo/graphql-ruby)、[Python](https://github.com/graphql-python/graphene)\
  \ 和 [Scala](https://github.com/sangria-graphql/sangria)。如果你的现有后端使用了 JavaScript 以外语言的框架（如\
  \ Rails），那么研究你当前语言中的 GraphQL 实现可能是有意义的。\n\n我们在本节中涵盖的内容（例如如何设计 schema 以及与现有的 SQL\
  \ 数据库协作）适用于所有的 GraphQL 库和语言。我们鼓励你跟随本节，并将学到的知识应用到你自己的项目中，无论使用什么语言。\n\n让我们开始吧！\n\n\
  ### Windows 用户的特殊设置\n\nWindows 用户需要一些额外的设置来安装本章节的包。具体来说，我们使用的 `sqlite3` 包在某些 Windows\
  \ 版本上可能较难安装。\n\n#### 1. 安装 `windows-build-tools`\n\n`windows-build-tools` 允许你编译原生\
  \ Node 模块，这对 `sqlite3` 包是必要的。\n\n在设置 Node 和 npm 后，全局安装 `windows-build-tools`：\n\n\
  ```\n1 npm install --global --production windows-build-tools\n```\n\n#### 2. 将 `python`\
  \ 添加到你的 PATH\n\n安装 `windows-build-tools` 后，你需要确保 `python` 在你的 PATH 中。这意味着在终端中输入\
  \ `python` 并按回车应该调用 Python。\n\n`windows-build_tools` 将 Python 安装在这里：\n\n```\n1 C:\\\
  <Your User>\\.windows-build-tools\\python27\n```\n\nPython 附带了一个将自己添加到 PATH 的脚本。在\
  \ PowerShell 中运行该脚本：\n\n```\n1 > $env:UserProfile\\.windows-build-tools\\python27\\\
  scripts\\win_add2path.py\n```\n\n运行此后，你必须重启电脑。有时只需重启 PowerShell 即可。无论如何，你都可以在终端中调用\
  \ `python` 来验证 Python 是否安装正确。这样做应该启动一个 Python 控制台：\n\n```\n1 > python\n```\n\n####\
  \ 计划方案\n\n从高层来说，我们将完成以下工作：\n\n从高层来说，我们将执行：\n* 创建一个 [Express](http://expressjs.com)\
  \ HTTP 服务器\n* 添加一个接受 GraphQL 请求的端点\n* 构建我们的 schema\n* 编写配置 GraphQL 的代码\n\n我们的 schema\
  \ 将由一个 SQLite 数据库支持。\n\n#### Express 服务器\n\n让我们开始设置 Web 服务器。创建一个名为 `graphql-server`\
  \ 的目录并运行一些初始命令：\n\n```\n$ mkdir graphql-server\n$ cd graphql-server\n$ npm init\n\
  ```\n\n让我们看看发生了什么：我们创建了 `graphql-server` 文件夹并进入其中。我们运行了 `npm init`，这创建一个 `package.json`。然后我们安装了一些依赖，Babel\
  \ 和 Express。Babel 的名字在之前的章节中很熟悉——在这种情况下，我们安装了 `babel-register` 来转译 NodeJS 文件，以及\
  \ `babel-preset-2015` 来指示 Babel 如何转译文件。\n\n```\n$ npm install babel-register@6.13\
  \ babel-preset-2015@6.13\n```\n\n最后的命令创建了一个 `.babelrc` 文件。\n\n创建一个名为 `index.js`\
  \ 的新文件，打开它并添加这些行：\n\n```\n1 require('babel-register');\n2 \n3 require('./server');\n\
  ```\n\n这里内容不多，但很重要。通过引入 `babel-register`，后续对 `require` 的调用（在使用 ES015 时使用 `import`）都将通过\
  \ Babel 转译器。Babel 将根据 `.babelrc` 中的设置转译文件，我们将其配置为使用 `2015` 设置。\n\n对于我们的下一个技巧，创建一个名为\
  \ `server.js` 的新文件。打开它并添加一行代码来调试我们的代码正在运行：\n\n```\n1 console.log({ starting: true\
  \ });\n```\n\n如果你运行 `node index.js`，你应该看到发生的情况：\n\n```\n$ node index.js\n{ starting:\
  \ true }\n```\n\n完美的开始！现在让我们添加 HTTP。\n\nExpress 是一个非常强大且可扩展的 HTTP 框架，所以我们不会深入探讨；如果你好奇了解更多，请查看他们的[文档](http://expressjs.com)。\n\
  \n再次打开 `server.js` 并添加配置 Express 的代码：\n\n```\n 1 console.log({ starting: true });\n\
  \ 2 \n 3 import express from 'express';\n 4 \n 5 const app = express();\n 6 \n 7\
  \ app.use('/graphql', (req, res) => {\n 8   res.send({ data: true });\n 9 });\n\
  10 \n11 app.listen(3000, () => {\n 12   console.log({ running: true });\n 13 });\n\
  ```\n\n\n\n前几行非常直观——我们导入了 `express` 包并创建了一个新实例（你可以将其认为是在创建一个新服务器）。在文件的末尾，我们告诉服务器在\
  \ `3000` 端口开始监听流量，并在发生后显示一些输出。\n\n但在启动服务器之前，我们需要告诉它如何处理不同类型的请求。我们今天将使用 `app.use`\
  \ 来实现这一目标。它的第一个参数是要待处理的路径，第二个参数是处理程序函数。`req` 和 `res` 分别是“request”（请求）和“response”（响应）的缩写。默认情况下，通过\
  \ `app.use` 注册的路径将响应所有的 HTTP 方法，因此到目前为止 `GET /graphql` 和 `POST /graphql` 的功能是相同的。\n\
  \n让我们试一下并测试它。再次使用 `node index.js` 运行你的服务器，并在单独的终端发送一个 cURL：\n\n```\n$ node index.js\n\
  { starting: true }\n{ running: true }\n```\n\n```\n$ curl -XPOST http://localhost:3000/graphql\n\
  {\"data\":true}\n$ curl -XGET http://localhost:3000/graphql\n{\"date\":true}\n```\n\
  \n我们有了一个可以工作的 HTTP 服务器！现在是时候所谓的“做一些 GraphQL 了”了。\n\n### 添加第一个 GraphQL 类型\n\n我们需要安装一些\
  \ GraphQL 库；如果服务器正在运行，请停止它，并运行以下命令：\n\n```\n$ npm install graphql@0.6.0 express-graphql@0.5.3\
  \ --save --save-exact\n```\n\n它们的名称中都包含“GraphQL”，所以听起来很有前景。这两个库都由 Facebook 维护，并同样作为其他语言中\
  \ GraphQL 库的参考实现。\n\n[`graphql` 库](https://github.com/graphql/graphql-js) 暴露了允许我们构建\
  \ schema 的 API，然后暴露了一个 API 用于针对该 schema 解析原始 GraphQL 文档字符串。它可以被用于任何 JavaScript 应用程序，无论是像示例这样的\
  \ Express Web 服务器，还是其他服务器如 Koa，甚至是在浏览器本身。\n\n相比之下，[`express-graphql` 包](https://github.com/graphql/express-graphql)\
  \ 旨在仅配合 Express 使用。它确保 HTTP 请求和响应针对 GraphQL 被正确格式化（例如处理 `content-type` 请求头），并最终允许我们通过极少的额外工作支持\
  \ GraphiQL。\n\n让我们开始吧——打开 `server.js` 并在创建 `app` 实例后添加这些行：\n\n```\n 5 const app\
  \ = express();\n 6 \n 7 import graphqlHTTP from 'express-graphql';\n 8 import {\
  \ GraphQLSchema, GraphQLObjectType, GraphQLString } from 'graphq\\\n9 l';\n10 \n\
  11 const RootQuery = new GraphQLObjectType({\n12   name: 'RootQuery',\n13   description:\
  \ 'The root query',\n14   fields: {\n15     viewer: {\n16       type: GraphQLString,\n\
  17       resolve() {\n18         return 'viewer!';\n19       }\n20     }\n21   }\n\
  22 });\n23 \n24 const Schema = new GraphQLSchema({\n25   query: RootQuery\n26 });\n\
  27 \n28 app.use('/graphql', graphqlHTTP({ schema: Schema }));\n```\n\n注意，我们更改了之前给\
  \ `app.use` 的参数（这替换了之前的 `app.use`）。\n\n这里有很多有趣的事情，但让我们先跳到精彩部分。启动你的服务器（`node index.js`）并运行此\
  \ cURL 命令：\n\n```\n$ curl -XPOST -H 'content-type:application/graphql' http://localhost:30\\\
  \n00/graphql -d '{ viewer }'\n{\"data\":{\"viewer\":\"viewer!\"}}\n```\n\n如果你看到上面的输出，说明你的服务器配置正确，并正在相应的解析\
  \ GraphQL 请求。现在让我们了解一下它是如何运行的。\n\n首先，我们从 GraphQL 库导入了一些依赖项：\n\n```\n7 import graphqlHTTP\
  \ from 'express-graphql';\n8 import { GraphQLSchema, GraphQLObjectType, GraphQLString\
  \ } from 'graphq\\\n9 l';\n```\n\n`graphql` 库导出了许多对象，随着我们编写更多代码，你会熟悉它们。我们使用的前两个是\
  \ `GraphQLObjectType` 和 `GraphQLString`：\n\n```\n10 const RootQuery = new GraphQLObjectType({\n\
  11   name: 'RootQuery',\n12   description: 'The root query',\n13   fields: {\n14\
  \     viewer: {\n15       type: GraphQLString,\n16       resolve() {\n17       \
  \  return 'viewer!';\n18       }\n19     }\n20   }\n21 });\n```\n\n当你创建一个 `GraphQLObjectType`\
  \ 的新实例时，它就好比定义一个新类。我们必须给它一个 `name`，以及一个可选的（但对文档非常有帮助）的 `description` 设置。\n\n`name`\
  \ 字段设置了 GraphQL schema 中的类型名称。例如，如果我们想在该类型上定义一个片段（fragment），我们将在查询中写下 `... on RootQuery`。如果我们将\
  \ `name` 更改为 `AwesomeRootQuery` 之类的内容，我们需要将片段改为 `... on AwesomeRootQuery`，即使 JavaScript\
  \ 变量仍然是 `RootQuery`。\n\n这定义了类型，现在我们需要给它一些字段。`fields` 对象中的每个键都定义了一个新的相应字段，每个字段对象都有一些必需的属性。\n\
  \n我们需要给它：\n\n* `type` - GraphQL 标量类型，如 `GraphQLString`。\n\n* `resolve` 函数来返回字段的**值**——目前我们硬编码\
  \ `'viewer!'`。\n\n接下来创建一个 `GraphQLSchema` 实例：\n\n```\n23 const Schema = new GraphQLSchema({\n\
  24   query: RootQuery\n25 });\n```\n\n这让你很清楚这是 schema 的顶层对象。\n\nSchemas 有两个属性：`query`\
  \ 和 `mutation`，对应于我们之前讨论的两种操作。目前我们把 `query` 设置为 `RootQuery`。\n\n最后我们将将其挂载到 Express：\n\
  \n```\n27 app.use('/graphql', graphqlHTTP({ schema: Schema }));\n```\n\n我们不需要手动编写处理函数，`graphqlHTTP`\
  \ 函数将使用 `Schema` 生成一个。内部，它将从请求获取我们的 GraphQL 查询并交给主库的解析函数。\n\n### 添加 GraphiQL\n\n\
  之前我们使用了 GraphQLHub 托管的 GraphiQL。如果我告诉你只需一个更改即可在我们的小服务器中添加 GraphiQL 呢？\n\n尝试给 `graphqlHTTP`\
  \ 添加 `graphiql: true` 选项：\n\n```\n27 app.use('/graphql', graphqlHTTP({ schema: Schema,\
  \ graphiql: true }));\n```\n\n重启服务器，打开 Chrome 并访问 `http://localhost:3000/graphql`。你应该看到像这样的界面：\n\
  \n![Empty GraphiQL](img/10-graphql-server----server_empty.png)\n\nEmpty GraphiQL\n\
  \n如果你打开“Docs”侧边栏，你会看到我们为 Schema 输入的所有信息——`RootQuery`、描述以及它的 `viewer` 字段。\n\n![Server\
  \ Docs](img/10-graphql-server----server_docs.png)\n\nServer Docs\n\n你还将获得我们字段的自动补全：\n\
  \n![Server Autocomplete](img/10-graphql-server----server_auto.png)\n\nServer Autocomplete\n\
  \n通过使用 `graphql-express` 我们免费获得了所有这些。\n\n你会注意到类型提示建议了一些诸如 `__schema` 这样有趣的字段，尽管我们没有定义它。这是我们在整个章节中一直提到的：GraphQL\
  \ 的自省功能（introspection）。\n\n### 自省\n\n让我们进一步深入研究。\n\n在我们的服务器的 GraphiQL 实例中运行以下 GraphQL\
  \ 查询：\n\n```\n 1 {\n 2   __schema {\n 3     queryType {\n 4       name\n 5     \
  \  fields {\n 6         name\n 7         type {\n 8           name\n 9         }\n\
  10       }\n 11     }\n 12   }\n 13 }\n```\n\n\n\n\n`__schema` 是一个“元”字段，自动存在于每个\
  \ GraphQL 根查询操作上。它拥有一棵完整的类型及其字段树，你可以在 [GraphQL 内省规范](https://facebook.github.io/graphql/#sec-Schema-Introspection)\
  \ 中查看到关于它们的内容。GraphiQL 的补全功能也会提供实用的信息，并让你探索 `__schema` 以及另一个内省字段 `__type` 的可能。\n\
  \n运行该查询后，你将得到如下所示的数据：\n\n```\n 1 {\n 2   \"data\": {\n 3     \"__schema\": {\n 4\
  \       \"queryType\": {\n 5         \"name\": \"RootQuery\",\n 6         \"fields\"\
  : [\n 7           {\n 8             \"name\": \"viewer\",\n 9             \"type\"\
  : {\n10               \"name\": \"String\"\n11             }\n12           }\n 13\
  \         ]\n 14       }\n 15     }\n 16   }\n 17 }\n```\n\n这本质上是我们服务器 schema 的\
  \ JSON 描述。这就是 GraphiQL 在 IDE 启动时通过发布内省查询来填充文档和自动补全的方式。由于每个 GraphQL 服务器都要求支持内省，因此工具通常可以在所有\
  \ GraphQL 服务器之间通用（再次强调，无论它们是用哪种语言或库实现的）。\n\n在本章中我们不会对内省做任何其他操作，但了解它的存在及其工作原理是有好处的\n\
  \n## Mutation（变更）\n\n到目前为止我们设置了 schema 的根 `query`，但我们提到过也可以设置根 `mutation`。记得之前提到的\
  \ mutation 是 GraphQL 中执行“写”操作的正确位置——当你想添加、更新或删除数据时，都应该通过 mutation 操作完成。正如我们将看到的，mutation\
  \ 与 query 的区别非常小，仅仅在于隐式约定：写操作**不应该**在 query 中发生。\n\n为了演示 mutation，我们将创建一个简单的 API\
  \ 来获取和设置内存中的 `node` 对象，类似于我们之前描述的惯用 `Node` 模式。现在，我们不再返回实现了 `Node` 接口的对象，而是为我们的节点返回一个\
  \ `string`。\n\n让我们先从 GraphQL 库中导入一些新依赖项开始：\n\n```\n 8 import { GraphQLSchema, GraphQLObjectType,\
  \ GraphQLString,\n9   GraphQLNonNull, GraphQLID } from 'graphql';\n```\n\n`GraphQLID`\
  \ 是 `ID` 标量类型的 JavaScript 对应，而 `GraphQLNonNull` 是我们尚未完全涵盖的内容。事实证明 GraphQL 的类型系统不仅跟踪字段的类型和接口，还跟踪它们是否可以为空。这对于字段参数特别有用，我们稍后会讲到这一点。\n\
  \n接下来，我们需要为 mutation 创建一个类型。花点时间考虑一下代码会是什么样子，考虑到它应该与我们的 `RootQuery` 类型非常相似。我们需要哪些类型的调用和属性？\n\
  \n在你思考完之后，将它与实际实现进行对比：\n\n```\n35 let inMemoryStore = {};\n36 const RootMutation\
  \ = new GraphQLObjectType({\n37   name: 'RootMutation',\n38   description: 'The\
  \ root mutation',\n39   fields: {\n40     setNode: {\n41       type: GraphQLString,\n\
  42       args: {\n43         id: {\n44           type: new GraphQLNonNull(GraphQLID)\n\
  45         },\n46         value: {\n47           type: new GraphQLNonNull(GraphQLString),\n\
  48         }\n49       },\n50       resolve(source, args) {\n51         inMemoryStore[args.key]\
  \ = args.value;\n52         return inMemoryStore[args.key];\n53       }\n54    \
  \ }\n55   }\n56 });\n```\n\n在最顶端，我们为节点初始化了一个“存储”。它只存在于内存中，因此每当你重启服务器时，数据都会清除——但你可以开始想象这是一个像\
  \ Redis 或 Memcached 这样的键值服务。创建 `GraphQLObjectType` 实例并设置 `name`、`description` 和\
  \ `fields` 看起来应该都很熟悉。\n\n这里的一个新奇点是使用 `args` 属性处理字段参数。类似于我们使用 `fields` 属性设置字段名称，`args`\
  \ 对象的键是该字段允许的参数名称。\n\n我们指定每个参数的类型，并封装为 `GraphQLNonNull` 实例。对于参数来说，这意味着查询**必须**为每个参数指定一个非空值。我们的\
  \ `resolve` 函数考虑到了这一点——`resolve` 接收几个参数，其中第二个参数是一个包含字段参数的对象（我们稍后会讨论 `source`）。\n\
  \n当我们在 `inMemoryStore` 中设置值时，就是我们 mutation 的“写”操作。我们还在 `resolve` 函数中返回一个值，以配合 `setNode`\
  \ 字段的 `type`。在这种情况下它恰好是一个 `string`，但你可以想象它可以是一个复杂类型，如 `User` 或为 mutation 定制的特殊类型。\n\
  \n现在我们有了 mutation 类型，将其添加到 schema 中：\n\n```\n58 const Schema = new GraphQLSchema({\n\
  59   query: RootQuery,\n60   mutation: RootMutation,\n61 });\n```\n\n最后进行最后的清理工作，为我们的查询添加一个\
  \ `node` 字段：\n\n```\n14   fields: {\n15     viewer: {\n16       type: GraphQLString,\n\
  17       resolve() {\n18         return 'viewer!';\n19       }\n20     },\n21  \
  \   node: {\n22       type: GraphQLString,\n23       args: {\n24         id: {\n\
  25           type: new GraphQLNonNull(GraphQLID)\n26         }\n27       },\n28\
  \       resolve(source, args) {\n29         return inMemoryStore[args.key];\n30\
  \       }\n31     }\n32   }\n33\n```\n\n重启服务器并在 GraphiQL 中运行此查询：\n\n```\n1 mutation\
  \ {\n2   setNode(id: \"id\", value: \"a value!\")\n3 }\n```\n\n注意我们必须显式指定 `mutation`\
  \ 类型，否则会被假设为 `query`。运行 mutation 应该返回：\n\n```\n1 {\n2   \"data\": {\n3     \"node\"\
  : \"a value!\"\n4   }\n5 }\n```\n\n你可以通过运行查询来确认 mutation 改变了内存数据结构，但大多数应用的数据存储在数据存储中。Relay\
  \ 定义 mutation 有稍微不同的模式，我们稍后会介绍\n\n## 丰富的 Schema 与 SQL\n\n正如我们之前提到的，我们将使用 SQLite\
  \ 构建一个 Facebook 克隆。它将展示如何与数据库通信、如何处理授权和权限，以及一些性能技巧。\n\n在深入代码之前，我们的数据库看起来像这样：\n\n\
  *   `users` 表，包含 `id`、`name` 和 `about` 字段。\n*   `users_friends` 表，包含 `user_id_a`、`user_id_b`\
  \ 和 `level` 字段。\n*   `posts` 表，包含 `body`、`user_id`、`level` 和 `created_at` 字段。\n\n\
  `level` 字段将代表关系和帖子的分级隐私设置。我们将使用的级别有 `top`、`friend`、`acquaintance` 和 `public`。如果一个帖子的级别为\
  \ `acquaintance`，那么只有该级别或更高的朋友可以看到。`public` 帖子任何人可见，即使用户不是朋友。\n\n要在 NodeJS 中实现这些，我们将使用\
  \ `node-sql` 和 `sqlite3` 包。在 NodeJS 中处理数据库有许多选择，在生产环境中使用任何关键库之前，你应该进行自己的研究，但这些已经足够了\n\
  \n## 设置数据库\n\n该安装一些新库了！运行以下命令将它们添加到项目中：\n\n```\n$ npm install sqlite@0.0.4 sqlite3@3.1.3\
  \ --save --save-exact\n$ mkdir src\n```\n\n我们最终需要三个文件。在 macOS 或 Linux 上，你可以运行：\n\
  \n```\n$ touch src/tables.js src/database.js src/seedData.js\n```\n\nWindows 用户可以随需要创建。\n\
  \n\n现在我们来创建一个数据库。SQLite 数据库存在于文件中，因此不需要启动单独的进程或安装更多依赖。为了代码的可读性，我们将开始将代码拆分为多个文件，这些就是我们之前用\
  \ `touch` 创建的系列文件。\n\n首先，我们定义表——你可以查阅 `node-sql` 的文档获取具体细节，但它非常易于读。打开 `tables.js`\
  \ 并添加这些定义：\n\n```javascript\n 1 import sql from 'sql';\n 2\n 3 sql.setDialect('sqlite');\n\
  \ 4\n 5 export const users = sql.define({\n 6   name: 'users',\n 7   columns: [{\n\
  \ 8     name: 'id',\n 9     dataType: 'INTEGER',\n10     primaryKey: true\n11  \
  \ }, {\n 12     name: 'name',\n 13     dataType: 'text'\n14   }, {\n 15     name:\
  \ 'about',\n 16     dataType: 'text'\n17   }]\n18 });\n19\n 20 export const usersFriends\
  \ = sql.define({\n 21   name: 'users_friends',\n 22   columns: [{\n 23     name:\
  \ 'user_id_a',\n 24     dataType: 'int',\n 25   }, {\n 26     name: 'user_id_b',\n\
  \ 27     dataType: 'int',\n 28   }, {\n 29     name: 'level',\n 30     dataType:\
  \ 'text',\n 31   }]\n 32 });\n33\n 34 export const posts = sql.define({\n 35   name:\
  \ 'posts',\n 36   columns: [{\n 37     name: 'id',\n 38     dataType: 'INTEGER',\n\
  \ 39     primaryKey: true\n40   }, {\n 41     name: 'user_id',\n 42     dataType:\
  \ 'int'\n 43   }, {\n 44     name: 'body',\n 45     dataType: 'text'\n 46   }, {\n\
  \ 47     name: 'level',\n 48     dataType: 'text'\n 49   }, {\n 50     name: 'created_at',\n\
  \ 51     dataType: 'datetime'\n 52   ]\n 53 });\n```\n\n`node-sql` 允许我们使用 JavaScript\
  \ 对象构建和操作 SQL 查询，类似于 GraphQL JavaScript 库允许我们处理 GraphQL 的方式。在这个特定的文件中并没有什么“发生”，但我们很快就会使用它导出的对象。\n\
  \n现在，我们需要创建数据库并加载其中一些数据。在本课程的材料中，在 `graphql-server/src` 目录下有一个 `data.json` 文件。请将其复制到我们正在处理的项目的\
  \ `src` 目录中。你也可以编写自己的数据，但我们将运行的示例将假设你使用的是包含的数据的文件。\n\n要将数据从 `data.json` 拷贝到数据库，我们需要编写一些代码。首先打开\
  \ `src/database.js` 并定义一些简单的导出：\n\n```javascript\n 1 import sqlite3 from 'sqlite3';\n\
  \ 2\n 3 import * as tables from './tables';\n 4\n 5 export const db = new sqlite3.Database('./db.sqlite');\n\
  \ 6\n 7 export const getSql = (query) => {\n 8   return new Promise((resolve, reject)\
  \ => {\n 9     console.log(query.text);\n10     console.log(query.values);\n11 \
  \    db.all(query.text, query.values, (err, rows) => {\n12       if (err) {\n13\
  \         reject(err);\n14       } else {\n15         resolve(rows);\n16       }\n\
  17     });\n```\n\n首先，我们定义了数据库文件并将其导出，以便其他代码可以使用它。我们还导出了 `getSql` 函数，它将以异步 promise\
  \ 的运行我们的查询。GraphQL JS 库使用 promise 来处理异步解析，我们很快就会利用这一点。\n\n然后打开我们之前创建的 `src/seedData.js`\
  \ 文件，开始添加此 `createDatabase` 函数：\n\n```javascript\n 1 import * as data from './data';\n\
  \ 2 import * as tables from './tables';\n 3 import * as database from './database';\n\
  \ 4\n 5 const sequencePromises = function (promises) {\n 6   return promises.reduce((promise,\
  \ promiseFunction) => {\n 7     return promise.then(() => {\n 8       return promiseFunction();\n\
  \ 9     });\n10   }, Promise.resolve());\n 11 };\n12\n 13 const createDatabase =\
  \ () => {\n 14   let promises = [tables.users, tables.usersFriends, tables.posts].map(\\\
  \n15 (table) => {\n 16     return () => database.getSql(table.create().toQuery());\n\
  17   });\n19\n 20   return sequencePromises(promises);\n20 };\n```\n\n记得 `tables.js`\
  \ 的导出是由 `node-sql` 创建的对象。当我们想要使用 `node-sql` 创建数据库查询时，我们使用 `.toQuery()` 函数，然后将其传递给刚刚在\
  \ `database.js` 中写的 `getSql` 函数。用通俗的话说，我们新的 `createDatabase` 函数运行创建每个表的查询。我们对 promise\
  \ 进行顺序排序，以确保在继续 promise 链中的任何后续步骤之前创建所有表。\n\n设置好表后，我们需要从 `data.json` 添加我们的数据。接下来编写这个新的\
  \ `insertData` 函数：\n\n```javascript\n21 const insertData = () => {\n22   let { users,\
  \ posts, usersFriends } = data;\n23\n24   let queries = [\n 25     tables.users.insert(users).toQuery(),\n\
  \ 26     tables.posts.insert(posts).toQuery(),\n 27     tables.usersFriends.insert(usersFriends).toQuery(),\n\
  \ 28   ];\n29\n30   let promises = queries.map((query) => {\n 31     return () =>\
  \ database.getSql(query);\n32   });\n33   return sequencePromises(promises);\n34\
  \ };\n```\n\n与 `createDatabase` 类似，我们使用 `toQuery` 创建查询，然后使用 `getSql` 执行它们。最后我们在文件末尾通过调用两个函数将一切整合在一起：\n\
  \n```javascript\n36 createDatabase().then(() => {\n37   return insertData();\n38\
  \ }).then(() => {\n39   console.log({ done: true });\n40 });\n```\n\n为了运行这段代码，你可以调用：\n\
  \n```bash\n$ node -e 'require(\"babel-register\"); require(\"./src/seedData\");'\n\
  ```\n\n现在你的项目根目录下有一个 `db.sqlite` 文件。你可以使用许多图形化工具（如 DBeaver）查看你的数据库，也可以通过此命令验证它是否有数据：\n\
  \n```bash\n$ sqlite3 db.sqlite \"select count(*) from users\"\n```\n\n现在是将 schema\
  \ 连接到新创建的数据库的时候。\n\n### Schema 设计\n\n在之前的示例中，schema 中的 `resolve` 函数只需返回内存中的值，但现在它们需要从数据库返回数据。我们还需要为\
  \ `users` 和 `posts` 创建对应的类型，并将相应的字段添加到根查询中。\n\n在深入代码之前，我们应该花时间考虑我们的最终查询看起来像什么样。通常，良好的做法是从\
  \ `viewer` 开始，因为我们的大部分数据将流经它。\n\n根据这些信息，我们期望 `viewer` 能够启用如下查询：\n\n```graphql\n\
  1 {\n2   viewer {\n3     friends {\n4       # Users 的字段\n5     }\n6\n7     posts\
  \ {\n8       # Posts 的字段\n9     }\n10\n11     newsfeed {\n12       # Posts 的字段\n\
  13     }\n14   }\n15 }\n```\n\n在这种情况下，`viewer` 将是当前用户。用户有 `friends`，因此我们需要一个对应的列表，以及该用户创建的\
  \ `posts` 连接。`viewer` 还有一个 `newsfeed`，它是指向其他用户发布帖子的连接。我们希望所有这些连接都符合 GraphQL 规范并包含适当的分页，以防动态列表或朋友列表过长而无法一次性计算或发送。\n\
  \n记住，根据 GraphQL 规范，我们希望所有的对象都是图中的节点。最终，`newsfeed` 中返回的所有数据都需要感知权限，并考虑到特定帖子作者与 `viewer`\
  \ 之间的好友等级（level）。\n\n我们应该添加支持使用顶层 `node(id:)` 字段获取任意节点的查询如下：\n\n```graphql\n1 {\n\
  2   node(id: \"123\") {\n3     ... on User {\n4       friends {\n5         # friends\n\
  6       }\n7     }\n8\n9     ... on Post {\n10       author {\n11         posts\
  \ {\n12           # 连接字段\n13         }\n14       }\n15       \n16       body\n17\
  \     }\n18   }\n19 }\n```\n正如我们在早时候一个章节中提到的，这个字段对于帮助前端代码在不知道其在层级结构中位置的情况下重新获取任何节点的状态非常有价值。\n\
  \n\n\n\n这可能让你感到惊讶，但 GraphQL 的惯是从同一个顶层 `node` 字段获取许多不同类型的对象。SQL 数据库通常为每个类型准备一个不同的表，而\
  \ REST API 为每个类型使用不同的端点，但地道的 GraphQL 只要你有标识符，就可以以相同的方式获取所有对象。这意味着 ID 必须是全局唯一的，否则\
  \ GraphQL 服务器将无法区分 `id: 1` 的 `User` 和 `id: 1` 的 `Post`。\n\n### 对象和标量类型\n\n为了让这些查询成为可能，我们将创建一个新文件\
  \ `src/types.js` 来用于存放这些类型。\n\n我们需要定义的第一个类型是 `Node` 接口（interface）。记住，一个类型要成为一个有效的\
  \ `Node`，它必须有一个全局唯一的 `id` 字段。为了在 JavaScript 中实现这一点，我们首先导入一些 API 并创建 `GraphQLInterfaceType`\
  \ 的实例：\n\n```\n1 import {\n2   GraphQLInterfaceType,\n3   GraphQLObjectType,\n4\
  \   GraphQLID,\n5   GraphQLString,\n6   GraphQLNonNull,\n7   GraphQLList,\n8 } from\
  \ 'graphql';\n9 \n10 import * as tables from './tables';\n11 \n12 export const NodeInterface\
  \ = new GraphQLInterfaceType({\n13   name: 'Node',\n14   fields: {\n15     id: {\n\
  16       type: new GraphQLNonNull(GraphQLID)\n17     }\n```\n\n除了使用新类之外，其他一切看起来与我们创建\
  \ `GraphQLObjectType` 实例的方式很相似。注意，`id` 字段没有 `resolve` 函数。接口中的字段不应该有 `resolve` 的默认实现，即使你提供了一个，它也会被忽略。相反，每个实现\
  \ `Node` 的对象类型都应该定义它们自己的 `resolve`（我们稍后会讲到这一点）。\n\n除了定义 `fields` 之外，`GraphQLInterfaceType`\
  \ 实例还必须定义一个 `resolveType` 函数。记住，我们的顶层 `node(id:)` 字段只保证会返回某种 `Node`，但并没有对具体的类型做出的任何保证。为了让\
  \ GraphQL 进行进一步的解析（例如使用部分片段，即 `... on User`），我们需要告知 GraphQL 引擎某个特定对象的具体类型。\n\n我们可以这样实现它：\n\
  \n```\n11 export const NodeInterface = new GraphQLInterfaceType({\n12   name: 'Node',\n\
  13   fields: {\n14     id: {\n15       type: new GraphQLNonNull(GraphQLID)\n16 \
  \    }\n17   },\n18   resolveType: (source) => {\n19     if (source.__tableName\
  \ === tables.users.getName()) {\n20       return UserType;\n21     }\n22     return\
  \ PostType;\n23   }\n24 });\n```\n\n`resolveType` 函数接收原始数据作为第一个参数（在这种情况下，`source`\
  \ 将直接从数据库返回的数据），并预期返回实现接口的 `GraphQLObjectType` 实例。我们使用了 `source` 的 `__tableName`\
  \ 属性，它并不是数据库中的实际列 - 我们稍后会看到它是如何注入的。\n\n我们返回了一些尚未定义的对象，`UserType` 和 `PostType`。在\
  \ `resolveType` 下方添加它们的定义：\n\n```\n26 const resolveId = (source) => {\n27   return\
  \ tables.dbIdToNodeId(source.id, source.__tableName);\n28 };\n29 \n30 export const\
  \ UserType = new GraphQLObjectType({\n31   name: 'User',\n32   interfaces: [ NodeInterface\
  \ ],\n33   fields: {\n34     id: {\n35       type: new GraphQLNonNull(GraphQLID),\n\
  36       resolve: resolveId\n37     },\n38     name: {\n39       type: new GraphQLNonNull(GraphQLString)\n\
  40     },\n41     about: {\n42       type: new GraphQLNonNull(GraphQLString)\n43\
  \     }\n44   }\n45 });\n46 \n47 export const PostType = new GraphQLObjectType({\n\
  48   name: 'Post',\n49   interfaces: [ NodeInterface ],\n50   fields: {\n51    \
  \ id: {\n52       type: new GraphQLNonNull(GraphQLID),\n53       resolve: resolveId\n\
  54     },\n55     createdAt: {\n56       type: new GraphQLNonNull(GraphQLString),\n\
  57     },\n58     body: {\n59       type: new GraphQLNonNull(GraphQLString)\n60\
  \     }\n61   }\n```\n\n大部分代码看起来与我们到今为止处理的内容相似。我们定义了 `GraphQLObjectType` 的新实例，将\
  \ `NodeInterface` 添加到它们的 `interfaces` 属性中，并实现了它们的 `fields`。某些 `fields` 被封装在 `GraphQLNonNull`\
  \ 中，这强制要求它们必须存在。如果你没有为字段提供 `resolve` 的实现，它将对底层 `source` 数据进行简单的属性查找 - 例如，`name`\
  \ 字段将调用 `source.name`。\n\n我们确实在这两个类型中都为 `id` 提供了 `resolve` 的实现，它们都使用相同的 `resolveId`\
  \ 函数。尽管我们的 `NodeInterface` 代码无法提供默认的 `resolve`，但我们仍然可以通过引用同一个变量来共享代码。打开 `tables.js`\
  \ 并在底部添加这些新函数：\n\n```\n55 export const dbIdToNodeId = (dbId, tableName) => {\n56\
  \   return `${tableName}:${dbId}`;\n57 };\n58 \n59 const splitNodeId = (nodeId)\
  \ => {\n60   const [tableName, dbId] = nodeId.split(':');\n61   return { tableName,\
  \ dbId };\n62 };\n```\n\n我们几乎准备好运行查询了！进入 `server.js`，导入我们刚刚编写的一些类型，并让 `RootQuery`\
  \ 拥有 `node` 字段：\n\n```\n11 import {\n12   NodeInterface,\n13   UserType,\n14   PostType\n\
  15 } from './src/types';\n16 \n17 import * as loaders from './src/loaders';\n18\
  \ \n19 const RootQuery = new GraphQLObjectType({\n20   name: 'Query',\n21   description:\
  \ 'The root query',\n22   fields: {\n23     node: {\n24       type: NodeInterface,\n\
  25       args: {\n26         id: {\n27           type: new GraphQLNonNull(GraphQLID)\n\
  28         }\n29       },\n30       resolve(source, args) {\n31         return loaders.getNodeById(args.id);\n\
  32       }\n33     }\n34   }\n35 });\n```\n\n我们还导入了一个新文件 `src/loaders.js`，我们需要对其进行编辑。它的目的是暴露从数据源加载数据的\
  \ API - 我们不想让服务器或顶层架构充斥直接访问数据库的代码。\n\n创建 `src/loaders.js` 文件并添加此小函数：\n\n```\n1 import\
  \ * as database from './database';\n2 import * as tables from './tables';\n3 \n\
  4 export const getNodeById = (nodeId) => {\n5   const { tableName, dbId } = tables.splitNodeId(nodeId);\n\
  6 \n7   const table = tables[tableName];\n8   const query = table\n9     .select(table.star())\n\
  10     .where(table.id.equals(dbId))\n11     .limit(1)\n12     .toQuery();\n13 \n\
  14   return database.getSql(query).then((rows) => {\n15     if (rows[0]) {\n16 \
  \      rows[0].__tableName = tableName;\n17     }\n18     return rows[0];\n19  \
  \ });\n20 };\n```\n\n这看起来应该与我们在 `seedData` 中编写的代码相似 - 我们使用 `node-sql` API 根据 `nodeId`\
  \ 构建 SQL 查询。记住，这个 `nodeId` 是全局唯一的节点 ID，而不是行 ID，因此我们使用 `tables.splitNodeId` 提取数据库特定的信息。\n\
  \n我们执行的一个技巧是附加 `__tableName` 属性。这有助于我们早的 `resolveType` 函数，以及任何其他可能需要将对象关联回其底层表的地方。添加它是是安全的，因为我们没有在\
  \ GraphQL Schema 中显式地暴露 `__tableName` 属性，所以恶意消费者无法访问它。\n\n\n\n\n\n在这些代码中发生的一个非常微妙但重要的点是，`loaders.getNodeById`\
  \ 返回一个 `Promise`（这就是为什么我们能通过 `.then` 挂载 `__tableName`），并且该 promise 最终会在 `resolve`\
  \ 中返回。`Promises` 是 GraphQL 处理异步字段解析的方式，这通常发生在数据库查询和任何第三方 API 调用中。如果你使用的 API 原生不支持\
  \ promise，可以参考 [Promise API](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise#Creating_a_Promise)\
  \ 将基于回调（callback）的 API 转换为 promise。最后一步，我们需要告诉 `GraphQLSchema` 我们的模式架构（schema）中所有可能的类型。如果你使用了接口（interfaces），就必须这样做，这样\
  \ GraphQL 才能计算出实现任何接口的类型列表。\n\n```javascript\n60 const Schema = new GraphQLSchema({\n\
  61   types: [UserType, PostType],\n62   query: RootQuery,\n63   mutation: RootMutation,\n\
  64 });\n```\n\n这就足够了！重启你的服务器，打开 GraphiQL（仍然可以通过 `http://localhost:3000/graphql`\
  \ 访问），尝试这个查询：\n\n```graphql\n1 {\n2   node(id:\"users:4\") {\n3     id\n4     ...\
  \ on User {\n5       name\n6     }\n7   }\n8 }\n```\n\n你应该能看到返回这些数据：\n\n```json\n\
  1 {\n2   \"data\": {\n3     \"node\": {\n4       \"id\": \"users:4\",\n5       \"\
  name\": \"Roger\"\n6     }\n7   }\n8 }\n```\n\n你可以尝试其他的节点 ID，例如 `\"posts:4\"` 和\
  \ `... on Post`。在继续之前，请思考一下底层发生了什么：我们请求请求一个特定的节点 ID，这会触发一个数据库调用，然后每个字段都会根据数据库 `source`\
  \ 数据进行 `resolve` 解析。\n\n在此时，我们本针对当前的服务器编写一个非常简单的前端应用，但我们还有更多的模式内容需要填充。让我们来处理其中一些\
  \ `friends` 列表和 `posts` 关联。\n\n### 列表 (Lists)\n\n我们之前提到过 `friends` 字段应该返回一个 `User`\
  \ 类型的列表。让我们朝着这个目标迈出一小步，目前返回一个简单的 ID 列表。\n\n首先，编辑我们的 `UserType`。打开 `types.js` 并添加一个新的\
  \ `friends` 字段：\n\n```javascript\n43     about: {\n44       type: new GraphQLNonNull(GraphQLString)\n\
  45     },\n46     friends: {\n47       type: new GraphQLList(GraphQLID),\n48   \
  \    resolve(source) {\n49         return loaders.getFriendIdsForUser(source).then((rows)\
  \ => {\n50           return rows.map((row) => {\n51             return tables.dbIdToNodeId(row.user_id_b,\
  \ row.__tableName);\n52           });\n53         })\n54       }\n55     }\n```\n\
  \n我们将 `friends` 字段设置为返回一个 ID 的 `GraphQLList`。`GraphQLList` 的工作方式与我们之前看到的 `GraphQLNonNull`\
  \ 类似，在构造函数中封装一个内部类型。在 `resolve` 内部，我们调用了一个新的 loader（待编写），然后将其结果转换为我们预期的全局唯一 ID。\n\
  \n在文件顶部添加一个 `import` 以准备我们的新 loader：\n\n```javascript\n10 import * as tables from\
  \ './tables';\n11 import * as loaders from './loaders';\n```\n\n编辑 `loaders.js`\
  \ 添加那个新的 `getFriendIdsForUser` 函数：\n\n```javascript\n21 export const getFriendIdsForUser\
  \ = (userSource) => {\n22   const table = tables.usersFriends;\n23   const query\
  \ = table\n24     .select(table.user_id_b)\n25     .where(table.user_id_a.equals(userSource.id))\n\
  26     .toQuery();\n27 \n28   return database.getSql(query).then((rows) => {\n29\
  \     rows.forEach((row) => {\n30       row.__tableName = tables.users.getName();\n\
  31     });\n32     return rows;\n33   });\n34 };\n```\n\n这就是我们需要编写的所有新代码了——启动 GraphiQL\
  \ 并运行这个查询：\n\n```graphql\n1 {\n2   node(id:\"users:4\") {\n3     id\n4     ... on\
  \ User {\n5       name\n6       friends\n7     }\n8   }\n9 }\n```\n\n确认你的结果等于此：\n\
  \n```json\n 1 {\n 2   \"data\": {\n 3     \"node\": {\n 4       \"id\": \"users:4\"\
  ,\n 5       \"name\": \"Roger\",\n 6       \"friends\": [\n 7         \"users:1\"\
  ,\n 8         \"users:3\",\n 9         \"users:2\"\n10       ]\n11     }\n12\n```\n\
  \n### 性能：预查优化 (Look-Ahead Optimizations)\n\n这很棒，但底层存在一些我们应该探索的猫腻操作。当我们解析原始的 `node`\
  \ 字段时，它执行了一次数据库查询（`loaders.getNodeById`）。在该节点解析之后，我们又执行了*另一个*数据库查询（`loaders.getFriendIdsForUser`）。如果你将这种模式扩展到更大的应用程序，可以想象会产生大量的数据库查询——最坏的情况下每个字段一个。事实证明，GraphQL\
  \ 库提供了一种通过一次 SQL 查询来处理这些查询的方法。打开 `server.js` 看看 `node` 字段的 `resolve` 函数：\n\n```javascript\n\
  23     node: {\n24       type: NodeInterface,\n25       args: {\n26         id:\
  \ GraphQLNonNull(GraphQLString)\n27         }\n28       },\n29       resolve(source,\
  \ args, info) {\n30         let includeFriends = false;\n31         \n32       \
  \  const selectionFragments = info.fieldAST[0].selectionSet;\n33         const userSelections\
  \ = selectionFragments.filter((selection) => {\n34           return selection.kind\
  \ === 'InlineFragment' && selection.name === 'User';\n35         });\n36 \n37  \
  \       userSelections.forEach((selection) => {\n38           selection.selectionSet.forEach((innerSelection)\
  \ => {\n39             if (innerSelection.name === 'friends') {\n40            \
  \   includeFriends = true;\n41             }\n42           });\n43         });\n\
  44 \n45         if (includeFriends) {\n46           return loaders.getUserWithFriendsIds(args.id);\n\
  47         } else {\n48           return loaders.getNodeById(args.id);\n49     \
  \    }\n50       }\n51     }\n```\n\n在遍遍历 AST（抽象语法树）时发生了很多操作，我们不会详细介绍大部分细节。如果你在代码中执行了预查优化，可以\
  \ `console.log` 树的每一层并确定你可以访问的信息。本质上，我们在查找 `node` 字段集上的 `User` 片段，并判断它是否访问了 `friends`\
  \ 字段。如果是，我们就运行一个新的 loader；否则，回退到原始 loader。\n\n现在来看看新的 `loaders.getUserWithFriendsIds`\
  \ 函数：\n\n\n\n\n\n这开始变得有些复杂了，并且非常针对我们选择的这个产品和框架——这在处理性能优化时是一种常见的模式。现在我们的 SQL 查询会同时获取所有朋友和用户配置，从而消除了一次数据库往返。然后，我们将这些朋友加载到\
  \ `__friends` 属性中（我们选择继续使用 `__` 前缀来表示“私有”属性），并可以在 `types.js` 访问它：\n\n```javascript\n\
  46     friends: {\n47       type: new GraphQLList(GraphQLID),\n48       resolve(source)\
  \ {\n49         if (source.__friends) {\n50           return source.__friends.map((row)\
  \ => {\n51             return tables.dbIdToNodeId(row.user_id_b, row.__tableName);\n\
  52           });\n53         }\n54 \n55         return loaders.getFriendIdsForUser(source).then((rows)\
  \ => {\n56           return rows.map((row) => {\n57             return tables.dbIdToNodeId(row.user_id_b,\
  \ row.__tableName);\n58           });\n59         })\n60       }\n61     }\n```\n\
  \n其他应用程序可能会以不同的方式执行前瞻优化——而不是将多个全局 SQL 查询合并为一个，它们可能会在后台预热缓存。重要的启示是，`resolve` 接受许多参数，这允许你跳过通常的递归解析流。\n\
  \n## 列表继续\n\n我们的 `friends` 字段返回了一个完整的 ID 列表（顺便提一下，从性能角度考虑），但我们真正想要的是一个指向完整 `User`\
  \ 类型的列表。对于大型列表，我们可能更想使用地道的 GraphQL 连接（我们很快就会实现），但我们将允许 `friends` 字段在每次查询时返回所有条目。\n\
  \n我们将首先删除之前为性能优化添加的逻辑。由于我们的应用程序即将发生一些变化，我们可以在功能稳定后重新审视性能问题。\n\n```javascript\n30\
  \       resolve(source, args, context, info) {\n31         return loaders.getNodeById(args.id);\n\
  32       }\n```\n\n接下来，我们需要更改 `friends` 字段返回的 `type` 为 `User` 列表。\n\n由于我们已经有一个通过\
