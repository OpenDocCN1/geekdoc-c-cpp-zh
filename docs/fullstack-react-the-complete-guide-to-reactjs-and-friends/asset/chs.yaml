  \ User {\n4       friends {\n5         id\n6         about\n7         name\n8  \
  \     }\n9     }\n10 }\n```\n\n它应该返回这些数据：\n\n```json\n1 {\n2   \"data\": {\n3  \
  \   \"node\": {\n4       \"friends\": [\n5         {\n6           \"id\": \"users:1\"\
  ,\n7           \"about\": \"Sports!\",\n8           \"name\": \"Harry\"\n9     \
  \    },\n10         {\n11           \"id\": \"users:3\",\n12           \"about\"\
  : \"Love books\",\n13           \"name\": \"Hannah\"\n14         },\n15        \
  \ {\n16           \"id\": \"users:2\",\n17           \"about\": \"I'm the best\"\
  ,\n18           \"name\": \"David\"\n19         }\n20       ]\n21     }\n22   }\n\
  23 }\n```\n\n你甚至可以更进一步查询 `friends` 的 `friends`！\n\n### Connections\n\n现在我们要实现地道的连接字段。与其返回一个简单的列表，我们将返回一个更复杂（但强大）的结构。虽然需要额外的工作，但连接字段对于那些可能是很大或无边界的列表是最合适的。在一个查询中返回一个巨大的列表可能是昂贵或浪费的，因此\
  \ GraphQL Schema 倾向于将这些字段分成更小的分页块。\n\n与其使用字面量数字，回想上一章，地道的 GraphQL 使用称为 `cursors`（游标）的不透明字符串。游标对数据的实时变化更有韧性，而这些变化在简单的基于页的系统中会导致重复。连接的\
  \ `pageInfo` 字段提供了帮助创建新请求的元数据，而 `edges` 字段将持有每个项目的实际数据。\n\n与之前使用列表作为 `friends` 的查询不同，我们希望\
  \ `posts` 像如下所示：\n\n```graphql\n1 {\n2   node(id:\"users:1\") {\n3     ... on User\
  \ {\n4       posts(first: 1) {\n5         pageInfo {\n6           hasNextPage\n\
  7           hasPreviousPage\n8           startCursor\n9           endCursor\n10\
  \         }\n11         edges {\n12           cursor\n13           node {\n14  \
  \           id\n15             body\n16           }\n17         }\n18       }\n\
  19     }\n20   }\n21 }\n```\n\n`posts` 字段现在不再仅仅返回 `PostType` 列表，而是返回一个 `PostsConnection`\
  \ 类型。\n\n在 `types.js` 中定义 `PageInfo`、`PostEdge` 和 `PostsConnection` 类型，同时从 `graphql`\
  \ 库导入更多类型：\n\n```javascript\n1 import {\n2   GraphQLInterfaceType,\n3   GraphQLObjectType,\n\
  4   GraphQLID,\n5   GraphQLString,\n6   GraphQLNonNull,\n7   GraphQLList,\n8   GraphQLBoolean,\n\
  9   GraphQLInt,\n10 } from 'graphql';\n```\n\n```javascript\n34 const PageInfoType\
  \ = new GraphQLObjectType({\n35   name: 'PageInfo',\n36   fields: {\n37     hasNextPage:\
  \ {\n38       type: new GraphQLNonNull(GraphQLBoolean)\n39     },\n40     hasPreviousPage:\
  \ {\n41       type: new GraphQLNonNull(GraphQLBoolean)\n42     },\n43     startCursor:\
  \ {\n44       type: GraphQLString,\n45     },\n46     endCursor: {\n47       type:\
  \ GraphQLString,\n48     }\n49   }\n50 });\n51\n52 const PostEdgeType = new GraphQLObjectType({\n\
  53   name: 'PostEdge',\n54   fields: () => {\n55     return {\n56       cursor:\
  \ {\n57         type: new GraphQLNonNull(GraphQLString)\n58       },\n59       node:\
  \ {\n60         type: new GraphQLNonNull(PostType)\n61       }\n62     }\n63   }\n\
  64 });\n65\n66 const PostsConnectionType = new GraphQLObjectType({\n67   name: 'PostsConnection',\n\
  68   fields: {\n69     pageInfo: {\n70       type: new GraphQLNonNull(PageInfoType)\n\
  71     },\n72     edges: {\n73       type: new GraphQLList(PostEdgeType)\n74   \
  \  }\n75   }\n76 });\n```\n\n这些目前大部分只是类型定义，没有内在的 `resolve` 函数。不同的应用程序在解析连接方面会有不同的方法和模式，因此不要将这里的某些实现细节视为你工作的金准则。\n\
  \n现在我们需要将我们的 `UserType` 连接到我们创建的新类型上，并实际创建 `posts` 字段。\n\n\n\n\n```javascript\n\
