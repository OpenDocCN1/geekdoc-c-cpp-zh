  \n我们不会为这个 `describe` 编写任何特定的规格。我们的下一个 `describe`，“当 API 未返回结果”将模拟 `Client.search()`\
  \ 返回一个空数组：\n\n```\ndescribe('and API returns no results', () => {\n  beforeEach(()\
  \ => {\n    // ... 模拟搜索未返回结果\n  });\n});\n```\n\n棘手的地方在于：当我们到达这个 `beforeEach` 块时，*我们已经模拟了用户更改了两次输入*。结果是\
  \ `Client.search()` 被调用了两次。\n\n另一种查看方式是：如果我们在这个 `beforeEach` 中为 `Client.search.mock.calls`\
  \ 插入一条日志语句：\n\n```\ndescribe('and API returns no results', () => {\n  beforeEach(()\
  \ => {\n    // 如果我们在这里记录 mock 调用会发生什么？\n    console.log(Client.search.mock.calls);\n\
  \  });\n});\n```\n\n我们会在控制台中看到它被调用了两次：\n\n```\n[\n  [ 'brocc', [Function] ],\n \
