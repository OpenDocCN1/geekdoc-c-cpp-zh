  \ 属于状态树中此 reducer 不处理的部分。因此，每当接收到该 action 时，函数都将到达最后一个 `else` 子句，并直接返回未修改的 `state`。\n\
  \n这是我们更新后的 `threadsReducer()` 函数完整代码：\n\n```javascript\nfunction threadsReducer(state,\
  \ action) {\n  if (action.type === 'ADD_MESSAGE') {\n    const newMessage = {\n\
