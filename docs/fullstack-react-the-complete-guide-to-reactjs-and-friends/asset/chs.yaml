  \n我们正在告诉 `combineReducers()`，我们的状态对象有两个属性：`activeThreadId` 和 `threads`。我们将这些属性设置为处理它们的函数。\n\
  \n`combineReducers()` 返回一个 reducer 函数，其行为与我们手动编写的组合 `reducer()` 函数完全一致。\n\n### 下一步\n\
  \n在引入线程增加了应用及其状态的复杂性后，我们对 reducer 逻辑进行了一些重要的重构。起初，我们的单一 reducer 函数管理着状态树的许多不同部分，并且逻辑重复。随着\
  \ reducer 组合（reducer composition）的引入，我们成功地将所有的状态管理拆分成更小的部分。\n\n我们的应用程序现在完美隔离了职责。这不仅让代码更易读，还为我们的扩展奠定了基础。\n\
  \n如果我们想向系统添加一个处理消息的新动作，我们就不需要担心管理线程的逻辑了。我们可以复用与 `ADD_MESSAGE` 和 `DELETE_MESSAGE`\
  \ 相同的代码路径。\n\n### 在 Redux 中使用展示组件（Presentational）和容器组件（Container）\n\n在上一章中，我们对状态和视图增加了复杂度。我们为线程模型添加了一个新的\
  \ React 组件 `ThreadTabs`，允许用户在线程之间切换。\n\n目前我们的应用程序中有四个 React 组件。每个 React 组件都直接与 Redux\
  \ store 交互。`App` 订阅 store 并使用 `getState()` 读取状态，然后将其传递给子组件。子组件直接向 store 分发动作。\n\n\
  在本章中，我们将探索一种组织 React 组件的新范式。我们可以将 React 组件分为两类：展示组件和容器组件。我们将看到这样做如何将 Redux store\
  \ 的知识限制在容器组件中并并我们提供灵活且复用的展示组件。\n\n#### 展示组件和容器组件\n\n在 React 中，展示组件是*仅渲染 HTML* 的组件。该组件的功能只是展示标记。在由\
  \ Redux 的应用中，展示组件与 Redux store 交互。\n\n展示组件接受容器组件的 props。容器组件指定展示组件应该渲染的数据。容器组件还指定行为。如果展示组件有任何交互性（例如按钮），它会调用容器组件提供的\
  \ prop 函数。容器组件才是向 Redux store 分发动作的。\n\n看看 `ThreadTabs` 组件：\n\n```javascript\nclass\
  \ ThreadTabs extends React.Component {\n  handleClick = (id) => {\n    store.dispatch({\n\
  \      type: 'OPEN_THREAD',\n      id: id,\n    });\n  };\n\n  render() {\n    const\
  \ tabs = this.props.tabs.map((tab, index) => (\n      <div\n        key={index}\n\
  \        className={tab.active ? 'active item' : 'item'}\n        onClick={() =>\
  \ this.handleClick(tab.id)}\n      >\n        {tab.title}\n      </div>\n    ));\n\
  \    return (\n      <div className='ui top attached tabular menu'>\n        {tabs}\n\
  \      </div>\n    );\n  }\n}\n```\n*(注：原文代码块中存在多处括号未闭合的语法错误，在翻译输出时已根据逻辑修正了代码结构的完整性)*\n\
  \n\n\n\n# redux/chat_intermediate/src/complete/App-12.js\n\n目前，此组件既渲染 HTML（文本字段输入），又与\
