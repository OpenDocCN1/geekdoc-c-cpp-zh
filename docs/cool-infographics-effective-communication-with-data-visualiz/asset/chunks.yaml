    Randy is a designer of data visualizations and infographics for both online and
    internal use for clients. He is also a frequent speaker at conferences, professional
    organizations, MBA classes, corporate meetings, and government agencies. He was
    honored to be selected as the 2012 Central Intelligence Agency speaker series
    presenter. With a degree in mechanical engineering rather than graphic design
    and 15 years of prior experience working for consumer product companies, Randy
    focuses on telling visual stories with data.


