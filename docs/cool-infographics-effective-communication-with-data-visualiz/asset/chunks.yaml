- fmt: '

    The lowest level of copyright is given to original creative works automatically.
    In 1989, Congress amended the U.S. copyright law (specifically to conform with
    the `Berne Convention Implementation Act`) making the use of copyright notices
    optional. Most infographic designers use this level of protection because they
    believe this automatic protection completely covers them; however, in practice,
    this level of protection is the hardest to enforce in court and any awarded damages
    are often lower.


    The second level of protection is claimed when the official copyright symbol `(©)`
    is displayed on the infographic, along with the year and name of the copyright
    owner. Designers can add the copyright notice to their original design work without
    any cost or official paperwork. By adding this explicit notice of copyright, publishers
    have clearly communicated their claim of copyright ownership and make any argument
    of “innocent infringement” a difficult defense. I recommend this level of protection
    to all of my clients as the best way to cover an infographic design with copyright
    protection.


    The highest level of copyright protection is an officially registered copyright.
    To achieve this level, the publisher must submit the final published creative
    work to the United States Copyright Office and pay a registration fee, which establishes
    a copy of the work on file and an official date of registration. This level is
    the easiest to defend in court and can pay the highest damages. However, this
    level of protection is generally overkill for infographic designs that are going
    to be widely shared on the Internet.


    ### Creative Commons


    In 2001, Creative Commons `(CC)` was founded as a licensing alternative to traditional
    copyright licenses. Designed to provide for more open sharing of creative works
    while still controlling some key rights for the publisher, Creative Commons is
    often seen as the ideal license for infographics.


    Even though Creative Commons is an open sharing license, many mistakenly think
    it means giving up all of their rights and publishing their work into the public
    domain. This is absolutely not true. Creative Commons is a type of copyright license
    that allows the owner to encourage sharing of their creative work, while still
    retaining control of how it is used.


    ![c02uf001.tif](image_fi/582305c02/c02uf001.png)


    A Creative Commons license is free for anyone to use and has a number of options
    that can be adapted to the needs of each specific design. The license owners have
    to make a few choices about what they are willing to allow others to do with their
    work; this will define the correct license to use.


    The most common license used for infographics is identified by four two-letter
    codes as `CC-BY-NC-ND`. Designers should display the official license image shown
    in [Figure 2-22](#c02.xhtml_figure2-22) in the infographic image itself. That
    way, the license remains accessible to readers no matter where the infographic
    is posted.


    ![c02f022.tif](image_fi/582305c02/c02f022.png)


    [FIGURE 2-22:](#c02.xhtml_figureanchor2-22) Creative Commons license `CC-BY-NC-ND`


    [`creativecommons.org/choose/`](http://creativecommons.org/choose/)


    [Table 2-1](#c02.xhtml_table2-1) shows the four aspects as they relate to an infographic
    design.


    | **Code** | **Aspect** | **Description** |

    | :--- | :--- | :--- |

    | CC | Creative Commons | Identifies that the creative work is covered by a Creative
    Commons license. |

    | BY | Attribution | Any use of the infographic must include a link or credit
    back to the original author. The license owner can define the title, name, and
    URL address of the original source that must be included whenever anyone reposts
    the infographic design. |

    | NC | Noncommercial | This enables anyone to copy, redistribute, transmit, and
    repost the infographic only for noncommercial purposes. Others may not sell or
    profit from your infographic without getting specific permission from the owner.
    |

    | ND | No Derivative Works | Everyone may use or redistribute your infographic
    only as long as the design remains unchanged. They may not modify or alter the
    infographic design without getting specific permission from the owner. |


    [TABLE 2-1:](#c02.xhtml_tableanchor2-1) Four aspects of a Creative Commons license


    The easiest way to generate a CC license is for the content owner to go to the
    Choose a License page at [`creativecommons.org/choose/`](http://creativecommons.org/choose/),
    shown in [Figure 2-23](#c02.xhtml_figure2-23), make attribute selections, and
    then use the license image that the site generates. If you need a larger version
    of the license image to include in the infographic design, there are higher resolution
    versions available on the [`creativecommons.org/about/downloads`](http://creativecommons.org/about/downloads)
    page. If the publisher uses the HTML-embedded code generated on this page to display
    the license on its web page, it also contains some additional metadata for web
    browsers.


    ![c02f023.tif](image_fi/582305c02/c02f023.png)


    [FIGURE 2-23:](#c02.xhtml_figureanchor2-23) Choosing a Creative Commons license


    [`creativecommons.org/choose/`](http://creativecommons.org/choose/)


    ### Trademarks and the Fair Use Doctrine


    Trademark protection is often confused with copyright protection, but they are
    two different things. Copyrights protect complete creative works, and trademarks
    protect distinctive words or symbols associated with specific companies, products,
    or services. The test for trademark infringement is called “likelihood of consumer
    confusion.”


    If you are designing an infographic for your own company, of course you have the
    rights (and probably the responsibility) to include your company’s trademarked
    logo in the design. This clearly identifies the company as the publisher of the
    design and is necessary for the infographic to have any positive effect.


    But what about including trademarked logos from other companies?


    There is an exception to the trademark law called the Fair Use Doctrine that allows
    for limited use and publishing of a trademark in certain cases without permission
    of the owner. For infographics, your design needs to pass two tests:


    1. Use of the logo cannot make it appear that the infographic is designed or published
    by the company.

    2. Use of logo cannot imply that the company funds, authorizes, approves, supports,
    or endorses the infographic.


    However, you can use another company’s trademarked logo to identify or compare
    that company. *The Conversation Prism 4.0* from Brian Solis and JESS3 in [Figure
    2-24](#c02.xhtml_figure2-24) is a popular infographic design that prominently
    displays hundreds of trademarked logos from other companies. In this instance,
    the logos are used to identify the major companies in the different types of social
    media businesses.


    ![c02f024.tif](image_fi/582305c02/c02f024.png)


    [FIGURE 2-24:](#c02.xhtml_figureanchor2-24) Fair use of trademarked company logos


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-24`](#c02.xhtml_figureanchor2-24)


    Source: Brian Solis and JESS3


    ### Images and Illustrations


    Beyond company logos, most infographic designs incorporate many images and illustrations.
    They might be photographs, illustrations, or vector art designs. Infographic designers
    need to have the appropriate rights to include any image that isn’t an original
    design of their own.

