- fmt: '

    Data visualizations are the visual representations of numerical values. Charts
    and graphs are data visualizations and create a picture from a given set of data.
    [Figure 1-3](#c01.xhtml_figure1-3) shows the price chart of the S&P 500, the Nasdaq,
    and the Dow Jones Industrial Average since 1950. The reader can easily see the
    overall upward trend and the comparison between the three data sets. Including
    the volume chart beneath the price chart, this data visualization creates a picture
    using at least 80,000 data points.


    ![c01f003.tif](image_fi/582305c01/c01f003.png)


    [**FIGURE 1-3:**](#c01.xhtml_figureanchor1-3) Stock price chart


    It takes us only seconds to understand the long-term trend, to see the close relationship
    between the three indices, and to see the significant spikes and falls in the
    stock market. This visualization easily fits on one piece of paper, a computer
    screen without scrolling, or a presentation slide. Seeing the entire data set
    on one page, we can understand the data quickly and with little effort.


    This is an efficient way to communicate data. Data visualizations can be very
    space efficient by visualizing a large set of numbers in a small space. By designing
    a visualization that displays all of the data within the readers’ field of view,
    this enables us to see the entire data set with minimal eye movement without scrolling
    or flipping between pages.


    If we looked at a spreadsheet with 80,000 values instead, how long would it take
    us to get a general understanding of the market?


    In 2001, Dr. Edward R. Tufte, one of the pioneers of modern data visualization
    and professor emeritus of political science, statistics, and computer science
    from Yale University, clearly explained this phenomenon when he stated, “Of all
    methods for analyzing and communicating statistical information, well-designed
    data graphics are usually the simplest and at the same time the most powerful.”^([1])


    This screen shot ([Figure 1-4](#c01.xhtml_figure1-4)) from the StockTouch app
    on an iPad is another example of a good data visualization design. The top 100
    largest U.S. stocks are shown from nine different market sectors. In this view,
    the companies from each market segment are organized in a spiral pattern from
    largest (in the center) to smallest. Each stock is color coded based on its stock
    price performance over the prior 12 months, but the time period is adjustable
    with the slider on the right. The shades of green show stock prices that have
    increased, and shades of red show prices that have decreased.


    ![c01f004.tif](image_fi/582305c01/c01f004.png)


    [**FIGURE 1-4:**](#c01.xhtml_figureanchor1-4) Heatmap visualization of stock price
    changes


    [`coolinfographics.com/Figure-1-4`](http://coolinfographics.com/Figure-1-4)


    Source: StockTouch iOS app, Visible Market, Inc.


    Whether it’s a new definition or an additional definition of the term *infographics*,
    its use now implies much more than just a data visualization. Up until recently,
    a common definition for infographics was simply “a visual representation of data”;
    however, that definition is outdated and is more indicative of data visualizations.
    Originally derived from the phrase *information graphics*, infographics was a
    term used in the production of graphics for newspapers and magazines.


    Today, the use of the word infographics has evolved to include a new definition
    that means a larger graphic design that combines data visualizations, illustrations,
    text, and images together into a format that tells a complete story. In this use
    of the word, data visualizations by themselves are no longer considered to be
    complete infographics but are a powerful tool that designers often use to help
    tell their story visually in an infographic.


    This new definition of infographics is used consistently throughout this book.
    and data visualizations are meant as a separate design element used within the
    design of infographics. The art of data visualization is a huge topic about which
    many books have been written and is taught in many university classes. For the
    purposes of this book, they are not synonymous.


    As shown in [Figure 1-5](#c01.xhtml_figure1-5), charts were the primary design
    element used to create the infographic, *Could You Be a Failure?* The designer,
    Jess Bachman ([`byjess.net`](http://byjess.net)), combined data visualizations
    (line charts), along with text, illustrations, and a photo of a Sharpie marker
    into this complete infographic design. The overall design is considered to be
    one infographic that uses many data visualizations in its design.


    ![c01f005.tif](image_fi/582305c01/c01f005.png)


    [**FIGURE 1-5:**](#c01.xhtml_figureanchor1-5) Infographic design made from 10
    data visualizations


    [`coolinfographics.com/Figure-1-5`](http://coolinfographics.com/Figure-1-5)


    *Source:* Could you be a Failure? *from Jess.net and Smarter.org*


    However, the best infographics tell complete stories. Infographics have become
    more like articles or speeches than charts. Their purpose can be categorized into
    the same three objectives as public speaking: to inform, entertain, or persuade
    the audience. They have introductions to get readers’ attention, so the readers
    know why they should take the time to read the infographic. They end with conclusions
    and calls to action, so the readers have some indication of what they should do
    with the information they have just learned.


    This is how many would end up bad infographics. Many simply put a bunch of data
    visualizations on the page without a cohesive story. The process of good infographic
    design is about storytelling and not about making your data pretty.


    The term infographics is also becoming mainstream. Thirty years ago, the word
    was only used by art directors and print publications, but the Internet has changed
    that. [Figure 1-6](#c01.xhtml_figure1-6) (based on data from Google Insights for
    Search) shows that the last 3 years (2010–2012) has seen extraordinary growth
    in people searching for the term *infographic*. The Internet is turning infographics
    into a household word.


    ![c01f006.tif](image_fi/582305c01/c01f006.png)


    [**FIGURE 1-6:**](#c01.xhtml_figureanchor1-6) Growth of search for the term infographic


    ## Information Overload


    We are all confronted with an immense amount of data and information every day—news,
    advertisements, e-mail, conversations, text messages, tweets, books, billboards,
    signs, and of course the Internet. The challenge we face is to filter out the
    junk, focus on the relevant information, and remember the important stuff.


    It’s a push-pull problem. We are actively seeking information, and at the same
    time, companies and advertisers are pushing their information at us.


    ## The Rise of the Informavore


    The first part of this problem is that people are constantly looking to find new
    information. In a real sense, we are our own enemy. We are confronted by most
    of the information because we look for it. The simplified reason for this is that
    we want to be better informed so we can make better decisions.


    In 1983, George A. Miller^([2]), one of the founders of the field of cognitive
    psychology, coined the term informavore to describe the behavior of humans to
    gather and consume information ([Figure 1-7](#c01.xhtml_figure1-7)). It was later
    popularized by philosopher Daniel Dennett^([3]) and by cognitive scientist Steven
    Pinker^([4]). Miller states, “Just as the body survives by ingesting negative
    entropy, so the mind survives by ingesting information. In a very general sense,
    *all higher organisms are informavores*.”


    ![c01f007.tif](image_fi/582305c01/c01f007.png)


    [**FIGURE 1-7:**](#c01.xhtml_figureanchor1-7) The evolution of the informavore

