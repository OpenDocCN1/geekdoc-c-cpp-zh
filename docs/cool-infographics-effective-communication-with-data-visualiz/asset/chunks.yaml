    \n6.  *Death & Taxes 2014*, Timeplots:\n\n    [`http://www.timeplots.com/collections/catalog/products/death-and-taxes-poster-2014`](http://www.timeplots.com/collections/catalog/products/death-and-taxes-poster-2014)\n\
    \n7.  *The Visual History of Halloween*, FrightCatalog.com:\n\n    [`http://www.frightcatalog.com/halloween-history/`](http://www.frightcatalog.com/halloween-history/)\n\
    \n8.  *Pairing Wine & Food*, Wine Folly:\n\n    [`http://winefolly.com/review/5-tips-to-perfect-food-and-wine-pairing/`](http://winefolly.com/review/5-tips-to-perfect-food-and-wine-pairing/)\n\
