- fmt: '

    The `title` tag is an HTML code element that should be on every web page. The
    `title` element is included in the `<head>` portion of the page, and the text
    displays in the browser window title bar or tab.


    ```

    <head>

    <title>Expert SEO Strategies Infographic</title>

    </head>

    ```


    This is one of the first things that identifies the page content to the search
    engines and is especially important because the `title` tag is often used as the
    link text displayed on the search results pages. Consider using natural language
    with spaces and including the word “infographic” as the last word of the `title`
    tag. This helps identify the content as an infographic to both the audience and
    the search engines, and the last word is considered to be the least important
    but still relevant.


    The `title` tag is also used by social media sharing buttons as the proposed default
    text for posts or tweets if no other suggested text is available. For example,
    unless you create some specific suggested text for Twitter, when someone uses
    the Twitter button on the page to share the infographic, it will propose the text
    from the `Title Tag` as the content of the tweet.


    ## Page Title


    The page title is the visible title displayed in the `<body>` section of the page
    as text. If you use the HTML code for the `H1` header, the search engines knows
    this is some of the most important text on the page, and any included text displays
    on the page in a large bold font. Words in the page title are often given more
    importance or value than the rest of the text on the page.


    ```

    <body

    <h1>SEO Strategies Used By The Experts</h1>

    </body>

    ```


    The actual text of the page title is often the same as the `title` tag, but it
    doesn’t have to be. From a content perspective, authors usually want the page
    title to be as short as possible so that the text doesn’t wrap on the page. Too
    many words here make the overall page look complicated and messy, and you can
    omit the word “infographic” in the page title to help shorten the text. The readers
    viewing the page can already see that the content is an infographic.


    ## Description Text


    The easiest thing to add to your landing page is a short paragraph of description
    text about the infographic. It could be text from the infographic or text that
    is written specifically for the landing page. This provides additional text for
    the search engines to index, but keep it short! The highlight of the page is the
    infographic; so don’t scare off your visitors with too much text. When readers
    see too much text on the page (or within the infographic), they often tune out
    and leave the page without reading it because the content appears to be too dense.


    Consider including a couple text links to other relevant pages within the same
    site in the description text. This provides two benefits. First, as the page value
    of the infographic landing page increases with views and links over time, these
    text links to other pages within the company site become more valuable. Second,
    people that post the infographic on their own blog or social media account often
    copy the entire description text as extra content to include in their post. Remember,
    they need text for the search engines to index on their own pages, too, and this
    can create additional valuable text links to the pages on your site.


    However, keep any included text links relevant to the infographic topic. Some
    infographic landing pages have text links to unrelated pages, so they could build
    on the success of the infographic. Although it can be effective, readers see this
    as spammy.


    ## Infographic Image Filename


    The search engines even look at the name of the infographic image file to try
    to find words that describe the content. If the image filename is just numbers
    identifying the image, such as `IMG1234567.jpg`, the search engines just ignore
    it, but you don’t want to miss any opportunities to link your keywords to the
    infographic. The easiest thing to do here is to use the main words from the `title
    tag` as the filename. So following your fictional infographic, this could be the
    filename of the infographic image you load onto the landing page:


    `SEO-Strategies-Experts-Infographic.JPG`


    Just like the preceding landing page URL, the filename should use hyphens as word
    separators. Avoid using underscore characters between words, because Google considers
    those to be word joiners.


    ## Alt Text Description


    An important HTML element for infographics is the `alt` attribute of images that
    enables the browser to display text describing an image when displaying images
    on-screen has been turned off in the browser. Due to modern Internet access speeds,
    the practice of viewing web pages without displaying images is rare, but the HTML
    element remains and is used heavily for search engine indexing.


    The `alt` text description should be written as a brief description in natural
    language. The content here should ideally be a single sentence to describe the
    infographic and can also be used by many screen readers for people with visual
    impairments. Accessibility software will speak the text of the alt description
    out loud for people that have trouble seeing the images, which makes a natural
    language description that much more important.


    The `alt` text description is included in the HTML code that identifies the actual
    image file displayed on the page.


    ```

    <img src=" SEO-Strategies-Experts-Infographic.jpg" alt="Top SEO strategies used
    by expert marketing consultants to improve the PageRank of web pages">

    ```


    The one thing you don’t want to do is to stuff the `alt` text description with
    a long string of keywords. Not only is this practice spammy, but also the search
    engines can recognize this and will reduce any value the alt text description
    would have provided to the page. This is also incredibly rude and irritating to
    the visitors that use a screen reader.


    ## Social Media Sharing Buttons


    An infographic landing page should absolutely include sharing buttons for the
    major social media networks. Companies should make sharing their infographic as
    easy and painless as possible, and including the sharing buttons on the landing
    page is the most popular way to share the infographic.


    One way to add buttons to the landing page is to use separate, individual, dedicated
    buttons from each of the social networks. A web developer can copy and paste the
    HTML code provided by each social network site onto the page. This method keeps
    the relationship simple and direct between the landing page and the social network
    but requires more work by the web developer.


    The more popular way is to use one of the sharing button aggregator services.
    These services enable developers to add only one block of HTML code to the landing
    page which displays a number of buttons for the various networks. The major advantage
    of this method is the convenience of one central service for both the code and
    the tracking analytics. The downside may be that the aggregator also has access
    to your analytics, if that is a concern.


    The major sharing button aggregator services are:


    *   `AddThis`: [`www.addthis.com`](http://www.addthis.com)

    *   `ShareThis`: [`www.sharethis.com`](http://www.sharethis.com)

    *   `AddToAny`: [`www.addtoany.com`](http://www.addtoany.com)


    In practice, sharing buttons should always be displayed “above the fold” on the
    landing page—meaning, they should be visible at the top of the page without any
    scrolling. Many readers will only view the top portion of the infographic and
    make the choice to share it in their social networks. Only a small portion of
    the readers make it all the way to the bottom of the page, so it’s less effective
    to place the sharing buttons there.


    In some cases, especially for very tall infographics, sharing buttons can also
    be repeated at the bottom of the page as an added convenience for the reader.


    #### Embed Code

