- fmt: '

    However, online infographics are a different type of public company information.
    The objective is to share the infographic with as many people on as many different
    sites as possible. Hopefully, the infographic is sharing some type of new, surprising,
    insightful data about the company’s industry, market, research data, or products.
    The company should be proud of this message and want everyone to share it.


    To overcome this hurdle, companies need to proactively give employees permission
    to share the infographic…in writing. Usually an internal e-mail is all it takes.
    Normally, this message mentions something about the topic of the infographic,
    how excited the company is to share this information with the public, and, of
    course, the link to the infographic landing page. Politely request that employees
    become involved to help kickoff the launch of the infographic and use the sharing
    buttons on the landing page to share the infographic with their own social networks.
    Some employees won’t participate, but many will.


    The one thing you should never do is demand or require employees to share any
    of your content. This quickly becomes a lose-lose scenario. A company can quickly
    create a lot of animosity from employees and put the company at risk of a lot
    of bad publicity. Seriously, if people don’t already want to share the infographic
    on their own, and you feel like you need to compel people to share the infographic,
    you’re doing it wrong.


    ## Promotion, Publicity, and Outreach


    The third part of the release strategy is Outreach. This is the activity of marketing
    the infographic to other authors and sites outside of the company. The hope is
    that they will appreciate your infographic and post a link. This can be a murky
    practice that gets into some questionable, spammy practices, but you should remain
    strong and stay focused on the best practices to build organic links to your infographic.


    Again, the search engine companies are constantly trying to improve their algorithms
    to filter out spam and artificial links so their users get good search results.
    You want your outreach activity to focus on contacting actual authors and bloggers
    that may have an interest in the infographic. If someone posts your infographic
    because they like it, and they think their audience will like it, you don’t need
    to worry about future algorithm updates.


    Remember that links from sites with high scores are the most valuable. There are
    a number of tools that can help you determine the rank of a particular web page.
    A simple one to use is `PRChecker.info` ([`www.prchecker.info`](http://www.prchecker.info))
    that enables you to enter the URL of any web page to determine its current Google
    PageRank.


    ### Topic-Specific Blogs


    Unless it’s someone’s personal blog, most blogs have some focus on a topic they
    specialize in. The Cool Infographics blog obviously focuses on infographics, but
    you can consistently find blogs related to any niche topic you want. If your infographic
    design is about chocolate cupcakes, you can find hundreds of cupcake-themed blogs
    to consider for your outreach plan.


    Research online to find the blogs related to your infographic topic. You can easily
    use `Google Blog Search` ([`www.google.com/blogsearch`](http://www.google.com/blogsearch))
    to search for blogs related to keywords from your infographic. Click the Search
    Tools button at the top of the results page and you can choose between Posts to
    find specific authors that have posted articles related to your topic or homepages
    to find entire sites.


    An effective method is to look at the list of sites that already link to your
    existing website content. You have to dig into your company’s web analytics or
    use one of the site explorer tools listed next. These sites are aware of your
    company and liked some of your prior content enough to post it on their site.
    They are likely to be receptive to any additional quality content from your company.


    After you make a list of potential sites, a little extra digging can help narrow
    it down by determining which blogs are most valuable to include in your outreach
    plan. No one has time to contact 500 blogs, so focusing your effort is important.


    The following list covers five different aspects of blogs that you should research
    and use to help evaluate the value of any links to your infographic:


    - **Active?**—Blogs are created easily and abandoned just as easily. Check the
    dates on the most recent posts to make sure they still actively post content.
    If the last post was a year ago, cross it off your list. Don’t waste your time
    on abandoned blogs.

    - **Rank?**—The easiest statistic to check is the Google PageRank of each blog
    you find. There are a number of different tools online that can reveal SEO data
    about websites, some free and some paid. Try using the `PageRank Status` extension
    for the Google Chrome browser ([`pagerank.chromefans.org`](http://pagerank.chromefans.org))
    to display the PageRank of any page you visit. There are other SEO tools that
    score websites using their own metrics that are also useful to help determine
    how valuable a link to your infographic could potentially be. `OpenSiteExplorer`
    from SEOmoz ([`www.opensiteexplorer.org`](http://www.opensiteexplorer.org)) scores
    sites with a measure called Domain Authority, and the `MajesticSEO Site Explorer`
    ([`www.majesticseo.com`](http://www.majesticseo.com)) evaluates sites based on
    measurements called Trust Flow and Citation Flow.

    - **Traffic?**—It’s harder to determine how much traffic a site receives, but
    it’s certainly helpful information to determine the potential reach of a posted
    link to your infographic. Because site traffic is not public information, a few
    sites have tools that can estimate site traffic, such as `Quantcast` ([`www.quantcast.com`](http://www.quantcast.com))
    and `Compete` ([`www.compete.com`](http://www.compete.com)). The numbers are an
    estimate, but a ballpark number is probably good enough to evaluate an outreach
    target site.

    - **Followers?**—It’s harder to determine how much traffic a site receives, but
    it’s certainly helpful information to determine the potential reach of a posted
    link to your infographic. Because site traffic is not public information, a few
    sites have tools that can estimate site traffic, such as `Quantcast` ([`www.quantcast.com`](http://www.quantcast.com))
    and `Compete` ([`www.compete.com`](http://www.compete.com)). The numbers are an
    estimate, but a ballpark number is probably good enough to evaluate an outreach
    target site.

    - **Infographics?**—Browse or search the site to see if they have posted infographics
    from outside web pages before. Some sites post only their own content, so it’s
    good to know if a blog is open to publishing good infographics from outside sources.


    After you narrow down your list of blogs to include in your outreach plan to something
    more manageable, the next challenge is determining how to reach them. Of course,
    you can always use the Contact page of the blog (if there is one) to reach the
    blog author, but a cold contact like that can get lost among all the other contact
    messages.


    A more effective way to persuade an author or site to share your infographic is
    to establish some form of direct communication. Email is best, but many people
    hide their email addresses to reduce the amount of spam they receive. Find and
    connect with them through their social media accounts. For example, you could
    follow them on Twitter. If they follow you back, that would enable you to send
    them a private Direct Message (DM) to make contact. If they accept a connection
    from you on LinkedIn, you can send them a message or view their email address
    on their portfolio page.

