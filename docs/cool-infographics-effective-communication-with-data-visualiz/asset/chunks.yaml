    嵌入代码（Embed code）是一段以文本形式显示在网页上的 HTML 代码。这段代码与落地页上使用的 HTML 图片显示代码类似，但这段代码旨在让其他博客作者通过复制和粘贴，作为在他们自己的网站上显示信息图的一种方便方式。该代码包含在页面的
    `<body>` 部分。


    在落地页上提供嵌入代码对发布者来说具有巨大的优势。代码可以被编写为显示正确的信息图图像，并使用信息图落地页的正确 `URL` 提供返回页的链接。此外，使用嵌入代码可以使博主发布信息图的过程变得极其方便。


    向你的信息图落地页添加分块嵌入代码包含两个部分：首先是编写你想让博主复制的 HTML 代码，其次是在你自己的页面上添加 `<textarea>` 代码，以便该代码以文本形式显示在你的页面上，而不是实际显示信息图。这非常重要，因为当人们查看你的信息图落地页时，你希望他们的浏览器显示代码，而不是尝试解析它并再次显示一次信息图图像。


    你虚构信息图的嵌入代码可能如下所示：


    ```html

    <<body>

    Please share this infographic on your site by copying and pasting the code below

    <p>

    <textarea style="width:540px;height:100px">

    <a href= "http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml">

    <img src=" SEO-Strategies-Experts-Infographic-small-500px.jpg" alt="Top SEO strategies
    used by expert marketing consultant to improve the PageRank of websites">

    </a>

    <p> SEO Strategies Used By The Experts - An infographic by the team at <a href="http://coolinfographics.com"
    >Cool Infographics</a>

    </textarea>

    </</body>

    ```


    在你的信息图落地页上，这将以小文本框的形式显示嵌入代码文本，如图图 3-13


    **图 3-13：** `<textarea>` 元素将在小文本框中显示 HTML 代码。


    以下是理解此示例嵌入代码中所包含内容的六个关键方面：


    1. 代码上方有一个简单的请求，要求博主使用嵌入代码。

    2.  HTML 代码在框内都是可见的。过多的代码文本会超出框的底部，导致部分代码无法被看到。框将显示滚动条，但这可能会让你感觉像你是在刻意隐藏某些 HTML
    代码。

    3. 当显示在博主的网站上时，信息图有一个可点击的链接，可以回到发布者定义的 `URL` 处的原始信息图落地页。这让你能够选择链接的去向。

    4. 使用了较小的、宽为 500 像素的 `JPG` 图像文件作为博主网站上显示的图像的源。这更有可能适应博客格式的较小空间（参见 第 2 章，“在线营销信息图”），并且加载速度比使用尺寸参数显示更大的图像更快。

    5. 由发布者编写了 `alt` 文本描述，以最大化其 SEO 价值。

    6. 信息图下方还可以额外显示一行文本作为说明，并带有指向公司网站首页的文本链接。


    在良好的网页开发人员的帮助下，嵌入代码中可以完成更多事情，包括你应该避免的一些垃圾邮件 SEO 实践，例如添加长关键词字符串或链接到不相关的页面。在嵌入代码中填充关键词和文本链接显然是不自然的，搜索引擎足够智能，可以忽略那种类型的内容。发布者应该通过让页面上的所有文本都可见，对他们提供给博主的代码保持透明，这样博主就能看到他们将向自己的网站添加什么什么代码。


    代码也应该像上面的示例嵌入代码一样简短而简单。即使所有代码都是出于好意编写的，长而复杂的代码块也有可能在其中隐藏了垃圾代码。大多数博主不是精通 `HTML`
    的网页开发人员，可能不理解所有嵌入代码的含义。长代码块有很大概率吓跑博主，因为在他们的网站上放置他们不理解的未知 `HTML` 代码具有潜在风险。


    嵌入代码也只是对博主的一种建议。他们可以将代码原封地粘贴到他们的网站中，也可以以他们认为合适的任何方式修改代码。如果他们想更改 `alt` 描述，可以自由这样做。作为发布者，你提供代码是为了提供便利。


    在实践中，只有一少数博主实际上利用嵌入代码在他们的博客上显示信息图。通常，他们会下载 `JPG` 图像文件本身，或者通过直接链接到托管服务器来显示图像。这留下了选择自己的链接、编写自己的
    `alt` 文本描述或选择完全不包含这些内容的灵活性。


    然而，在信息图落地页上提供嵌入代码绝对值得努力，因为它可以最大化来自那些博主的链接的价值。


    ### 自我推广


    发布策略的第二部分是自我推广。许多公司已经拥有与客户、供应商和媒体的现有沟通渠道。在信息图公开发带有专用落地页后，公司应该通过自己的渠道尽可能地广播该 `URL`。你永远不知道哪个粉丝网络会触及正确的受众。


    这就是你应该自吹自海的地方。这是营销，你正在向受众推销信息图作为价值内容。


