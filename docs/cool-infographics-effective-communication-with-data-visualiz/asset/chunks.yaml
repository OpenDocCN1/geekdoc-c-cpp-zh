  trans: '

    这张信息图是专为在线查看体验设计的。长条格式通过让观众花费大量精力滚动页面来查看整个设计，强化了所代表的巨大距离感。另一个版本（中间部分）是为了便于作为定制海报打印时具有更好的宽高比而创建的，但即使是这个版本，也必须大幅缩小尺寸才能在标准纸张上打印。


    在这种情况下，这种效果非常好，因为主要的体验是在线上的。然而，设计师在进行任何信息图设计时，都需要仔细考虑他们的发布策略。如果主要在在线查看，长条格式是最佳的。如果你打算将信息图作为讲义材料打印或在演示文中使用，请考虑将整体设计限制在单页纸范围内，或者将其设计成可以轻松打印在不同页面上的章节。


    ## 在线信息图的类型


    公司内部任何营销部门面临的最大挑战之一，就是直接向产品或服务的终端用户传递信息。许多公司产品卖给中间公司（如零售商或服务提供商），没有很多机会向其产品或服务的终端用户发送信息。此外，消费者通常不会仔细阅读购买的产品时附带的包装或说明书。


    然而，公司对于其产品或服务有很多非常棒的故事可以讲述。


    *   它们解决了哪些消费者问题？

    *   它们提供了哪些独特优势或价值主张？

    *   它们与其他产品有何不同？

    *   产品中设计了哪些对消费者的好处？

    *   为什么会有特定的设计选择？

    *   它们是如何处理环境或可持续性问题的？


    他们如何让消费者听取关于为什么他们的产品比竞争对手更好，或如何有效使用产品的故事？信息图已成为直接触达消费者的极佳格式。在线发布的酷、有趣且吸引人的信息图可以直接触达目标终端用户并抓住消费者的注意力。


    图 2-6 是 Extra Space Storage 的一个绝佳案例。`Solar Savings: A Solar Innovation Story`
    信息图是一个旨在与客户和股东共享额外信息的设计。该信息图为驱动业务的决策背后的数据提供了一些透明度，并帮助 Extra Space Storage 成为自储领域的市场领导者。


    ![c02f006.tif](img/c02f006.png)


    **图 2-6：** 使用信息图向消费者和股东介绍公司


    [`coolinfographics.com`](http://coolinfographics.com)`/Figure-2-6`


    来源：`Solar Savings: A Solar Innovation Story`，Extra Space Storage Inc.


    ### 信息告知型信息图


    信息告知型信息图是你在网上最常见的设计类型。其底层理论是，在线观众更愿意阅读和分享有价值的信息，而不是广告。如果公司能够在不进行露骨推销的情况下向读者提供有价值的信息，那么这些信息图就有更大的机会与亲友分享，并可能在网上产生病毒式传播。


    在在线发布了多年信息图后，我完全相信了这一理论。如果设计项目的目标是最大化查看次数、访问人数和指向托管网站的反链数量，信息告知型信息图比所有其他类型的设计都更成功。


    考虑图 2-7 中 S.B. Lattin Design 的这个例子：`The Common Cook’s How-Many Guide to Kitchen
    Conversions.`（普通厨师厨房换算指南）。该设计非常精美，主题是以视觉形式展示的常见厨房测量换算的纯信息性总结。在该设计的任何地方，它都没有告诉你公司是做什么的，也没有向读者推销其服务。你知道它来自
    S.B. Lattin Design，因为它在设计底部的页脚清晰地显示了其标志。


    ![c02f007.tif](img/c02f007.png)


    **图 2-7：** 信息告知型信息图设计


    [`coolinfographics.com/`](http://coolinfographics.com)`Figure-2-7`


    来源：`The Common Cook’s How-Many Guide to Kitchen Conversions`，S.B. Lattin Design


    所呈现的信息是常识，任何想要汇总它的人都可以获取（人们可以从大多数食谱中推算出换算率），但设计师花时间收集数据，并以具有视觉吸引力的方式呈现，以触达受众。该设计在网上持续被大量分享，作为印刷海报产生销售，并使
    S.B. Lattin Design 进入了其目标客户的脑海中。


    最佳的设计关注与公司业务或品牌直接相关的主题，这创建了搜索引擎正在寻找的相关性。图 2-8 中的信息图是由在线备份公司 CrashPlan 发布的`The
    Lifespan of Storage Media`（存储介质的寿命）。当然，公司想要向新客户销售其备份服务，但该信息图并不是一个销售推销。基于其广泛的研究，该信息图利用数据可视化向读者展示了为什么在线云端备份比将他们的数据、音乐、视频或照片存储在自己的设备上更好。


    ![c02f008.tif](img/c02f008.png)


    **图 2-8：** 关于存储的信息告知型信息图，而非广告或销售推销


    [`coolinfographics.com/`](http://coolinfographics.com)`Figure-2-8`


    来源：`The Lifespan of Storage Media`，CrashPlan


    整体信息是所有存储设备随着时间的推移都会面临故障，但在线解决方案提供了具有可扩展、冗余和异地优势的备份。注意，该信息是独立且客观的。`任何`在线解决方案都可以提供这些基本利益，但通过发布该信息图，CrashPlan
    在读者心中确立了其作为信誉市场领导者的地位。


    与品牌的联系可能是显而易见的，也可能是微妙的，但告知的目标是将呈现的信息价值与品牌价值联系起来。这为品牌建立了良好的认知。


    ### 说服型信息图


    说服型信息图的方法略有不同。这些信息图设计引导读者采取明确的行动号召，并试图说服观众在看到图后采取某些事情。


    说服型设计中的可视化和信息都旨在引导读者得出预设结论，然后提供他们应该采取的特定行动。这种类型的设计会让读者产生怀疑并抵触情绪。他们知道信息图背后的公司或设计师正在推销特定的议程。

    '
- fmt: '

    ## 5. I''ve learned it from an infographic, so it must be true.


    Readers might not question the authenticity or validity of information being shared
    with them, and data visualizations can be especially compelling to audiences.
    Even if the audience doesn’t understand the detailed data, the mere presence of
    data visualizations implies a scientific, quantitative credibility that appears
    to be objective. They imply that the information is a fact, not an opinion, even
    though that may not be reality.


    As mentioned in Chapter 1, all data visualizations have some bias. The designer
    chooses what data to include in a visualization design. If the goal of the infographic
    is to persuade, of course the designer wants to present the information in a compelling
    way.


    Millions of different reasons motivate people to choose their actions every day,
    and good storytelling is an effective way to convince people that they should
    join a particular effort. The actions that these designs try to convince the audience
    to take could be anything. Often these try to convince you to do good things to
    help yourself, your local community, or the world at large.


    *   Start exercising.

    *   Vote for a candidate, party, or referendum. own*   Travel to a new destination.

    *   Visit a website.

    *   Improve the environment.

    *   Donate to a charitable organization.

    *   Join a community.

    *   Contact an elected official.

    *   Sign a petition.

    *   Buy a product.

    *   Give time to a worthy cause.

    *   Participate in an event.


    [Figure 2-9](#c02.xhtml_figure2-9) shows the `Most Polluted Cities in United States
    2012` infographic based on data gathered and published by the American Lung Association.
    The organization gathers air quality data from thousands of air sensors across
    the country and is an organization dedicated to improving health. The data is
    published in a 200-page report for anyone that wants to dig into the detailed
    information, but a series of infographics effectively shares the key findings
    with the general population.


    ![c02f009.tif](image_fi/582305c02/c02f009.png)


    [**FIGURE 2-9:**](#c02.xhtml_figureanchor2-9) Persuasive infographic leading the
    reader to the suggested actions at the bottom


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-9`](#c02.xhtml_figureanchor2-9)


    Source: `Most Polluted Cities in United States 2012`, American Lung Association


    There’s nothing subtle about this design, and that’s the point. It’s obviously
    from the American Lung Association, a well-recognized organization, and the title
    “Most Polluted Cities... “ immediately tells the readers that this infographic
    is about to tell them how bad the situation is.


    After the readers have looked through the information, the design assumes they
    are now convinced to act and offers three clear potential actions at the bottom
    of the design:


    *   Read the full report.

    *   Check local air quality score.

    *   Send a message to a congressional representative.


    Another persuasive infographic is `Cancer` from MesotheliomaHelp.net, shown in
    [Figure 2-10](#c02.xhtml_figure2-10). This design includes data visualizations
    using several statistics gathered about the types of cancer, different locations
    across the country, and the mortality rate of cancer victims. At the end of the
    design is one clear call to action: Click to Donate, which takes the reader to
    a specific page on its website that lists many different cancer charities that
    the reader should contribute to. This design does a great job of laying out the
    scope of the problem and presenting a specific action that the reader can take
    to help the fight against cancer.


    ![c02f010.tif](image_fi/582305c02/c02f010.png)


    [**FIGURE 2-10:**](#c02.xhtml_figureanchor2-10) Persuasive infographic design
    with one clear call to action: Donate


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-10`](#c02.xhtml_figureanchor2-10)


    Source: `Cancer: Incidences of Cancer in the United States of America`, MesotheliomaHelp.net


    Now break down a persuasive design. The `Can Soap Make You Sick?` infographic
    from GOJO Industries in [Figure 2-11](#c02.xhtml_figure2-11) is a great example
    and demonstrates a structure similar to `Monroe’s Motivated Sequence`, a classic
    technique for organizing persuasive speeches. As you read through the infographic
    from top to bottom, the story told to the audience is a series of carefully structured
    facts with a powerful effect.


    ![c02f011.tif](image_fi/582305c02/c02f011.png)


    [**FIGURE 2-11:**](#c02.xhtml_figureanchor2-11) Persuasive structure that leads
    the reader through the sequence of information


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-11`](#c02.xhtml_figureanchor2-11)


    Source: `Can Soap Make You Sick?`, GOJO Industries


    1.  **The key message.** “1 in 4 bulk soap dispensers are contaminated with bacteria.”
    This grabs the audience’s attention, and even if they don’t read the rest of the
    infographic, they can understand the main point of the design.

    2.  **What’s the problem?** This section builds credibility of the Key Message
    by explaining how easy it is to get bacteria into a soap dispenser.

    3.  **What’s the danger?** This section tells the readers specifically the risks
    they can face makes meaningful personally.

    4.  **What’s the solution?** Now that the audience understands the underlying
    problem, it can understand the solution presented.

    5.  **What can I do?** The design finishes with two clear calls to action that
    the reader should take. Forward this information to a facility manager (which
    implies the reader is concerned about the issue), or sign an online petition to
    help raise awareness.


    Notice that this is not an advertisement. The call to action is not to purchase
    a product, but to help inform others of the potential risk. By raising awareness
    of this, GOJO raises its authority, and a persuaded facility manager is likely
    to contact GOJO to help replace its soap dispensers.


    ### Visual Explanations


    Many infographic designs do not try to visualize a bunch of statistics, numbers,
    or data sets. Instead, they try to explain an idea, a process, relationships,
    or a complex concept to the audience. These visual explanation designs use illustrations,
    diagrams, and icons (and occasionally data visualizations) to explain their topic
    to the audience.


    *How Our Laws Are Made* ([Figure 2-12](#c02.xhtml_figure2-12)) is an award-winning
    design by Mike Wirth and Dr. Suzanne Cooper Guasco, PhD. The infographic is a
    visualization of the step-by-step process that takes a bill to a law at the federal
    level in the United States. Notice that there are no charts or data visualizations.
    It’s an infographic design that uses illustrations and text to explain a process
    to the audience.


    ![c02f012.tif](image_fi/582305c02/c02f012.png)


    [**FIGURE 2-12:**](#c02.xhtml_figureanchor2-9) Visual explanation of the process
    to pass a new law in the United States


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-12`](#c02.xhtml_figureanchor2-9)


    Source: *How Our Laws Are Made*, Mike Wirth and Dr. Suzanne Cooper Guasco, PhD.


    Visual explanations are an effective way for companies to demonstrate their authority
    and competence in an industry. These infographics often become a design that readers
    keep or print out for future reference, which from a marketing sense is terrific
    because it provides ongoing exposure to the company. Of course, for the exposure
    to the brand to be meaningful, the topic has to be relevant to the company’s business.

