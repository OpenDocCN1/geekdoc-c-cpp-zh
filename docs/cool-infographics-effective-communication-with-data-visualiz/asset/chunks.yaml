    Probably the most common way (and at the same time the worst way) to find images
    to include in an infographic design is to perform an image search in Google or
    Bing. Just because it has been published on the Internet does not make it public
    domain! Actually, it’s just the opposite. As mentioned in the earlier section,
    copyright law automatically covers all original creative works, even if it doesn’t
    have a copyright notice or include the copyright symbol.


    Using images found through an Internet search, you are likely putting yourself
    and your client at risk of copyright infringement. An infographic designer needs
    to be certain the images included in a design are available through a public license.
    If you’re designing an infographic for business reasons, you could unintentionally
    be putting your company at legal and financial risk.


    Royalty-free stock image sites (like `iStockPhoto.com` or `Shutterstock.com`)
    are the best solution to ensuring that you have the required permissions to include
    an image in your infographic design. When you purchase a design asset (photo,
    illustration, vector art, video, and so on) you are actually purchasing a license
    to use that artwork. Royalty-free means that you can include that artwork in your
    commercial design without paying an on-going royalty to the designer. When designing
    infographic projects for clients, you should make sure that all of the images
    you include as part of the final infographic are either your own original designs
    or licensed royalty-free images.


    In additional to icons and illustrations, hundreds of data visualization design
    elements have begun to become available on the royalty-free stock image sites.
    [Figure 2-25](#c02.xhtml_figure2-25) is a collection of vector art objects called
    `Infographic Elements` and is available for purchase from `iStockPhoto.com`. This
    collection is meant to help an infographic designer with predesigned visual elements
    that make the design process faster. Designers must still modify the visualizations
    to match the data included in their infographic design.


    ![c02f025.tif](image_fi/582305c02/c02f025.png)


    **[FIGURE 2-25:]](#c02.xhtml_figureanchor2-25) *Infographic Elements* by Artvea


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-25`](#c02.xhtml_figureanchor2-25)


    An infographic designer doesn’t need to create all these visual elements from
    scratch. In general, infographic designs are not meant to be pieces of art; they
    are visual storytelling with data and information. If designers spend most of
    their time designing custom illustrations, the project is going to take much longer
    and cost much more than necessary.


    ### AIGA, the Professional Association for Design


    The legal issues are complicated, and all of them aren’t covered here. You should
    consider an additional source of information meant to help designers understand
    and navigate the legal landscape.


    AIGA, the professional association for design, ([www.aiga.org](http://www.aiga.org))
    is an excellent resource for graphic designers about a wide variety of issues.
    It publishes a number of articles, case studies, videos, and webinars and a complete
    guide to `Design Business and Ethics` that covers copyright and trademark issues
    in more detail. The complete guide is available online at [`www.aiga.org/design-business-and-ethics/`](http://www.aiga.org/design-business-and-ethics/).


    > AIGA website


    ### Should You Copyright Your Infographic?


    Online infographics defy the traditional thinking behind protecting creative work
    online. With the exception of the infographic posters, publishers are generally
    not attempting to sell online infographics. Actually, it’s quite the opposite.
    Most infographic publishers are actively trying to get their infographics shared,
    posted, linked, e-mailed, and even printed as frequently as possible but without
    any payment or licensing. It’s viewed as a huge success for a company to have
    its infographic reposted on a major site that drives thousands of views.


    In the case of online infographics, the purpose of a copyright needs to be thought
    about differently. Even though they may not be trying to sell their infographics,
    designers and companies should still copyright their infographic designs. A copyright
    prohibits others from modifying the design, claiming it as their own, or selling
    the infographic without the creators’ consent. These are still important aspects
    of publishing creative work.


    For example, even though all the examples included in this book have been published
    publicly online, available for anyone to view, they are all covered by copyrights.
    Because this book is a product for sale, it is considered a commercial use of
    those designs. To republish them in this book, I needed to get official permission
    from each publisher or designer for a copyright license to include their infographic
    designs.


    So, should infographics be copyrighted? Yes. They are automatically covered by
    a copyright, but adding the official copyright notice to an infographic removes
    any ambiguity or misconceptions. Publishers should be clear and obvious about
    what rights they are granting to others related to their infographic designs.


    ## Final Thoughts


    Online infographics are a powerful content tool for companies to share information,
    build awareness, and drive traffic to their websites. They have exploded in popularity
    in the last few years, and their use will continue to grow going forward.


    Infographic designers need to understand the objectives of an infographic project
    so they can make informed decisions about the format, orientation, and content
    that should be included in each design. Good infographic designers can bring together
    storytelling, data visualization, graphic design, online strategy, and legal understanding
    together to make a successful infographic.


    ## References


    1. Alan H. Monroe, *Principles and Types of Speech*, (Chicago: Scott, Foresman,
    1935).


    ## Links


    Many of the images in this chapter can be viewed by using the following links
    or going to [`www.wiley.com/go/coolinfographics`](http://www.wiley.com/go/coolinfographics).


    1. *Mobile Youth: Teens & Cell Phones*, PrepaidPhones.com: [`http://infonewt.com/portfolio/client-work/18409928`](http://infonewt.com/portfolio/client-work/18409928)

    2. *What guests want*, Hotels.com: [`http://press.hotels.com/en-ca/more-infographics/hotels-com-amenities-survey/`](http://press.hotels.com/en-ca/more-infographics/hotels-com-amenities-survey/)

    3. *The History of Swimwear*, BackyardOcean.com: [`http://www.backyardocean.com/History-Of-Swimwear-Bikini-Thong-Infographic-s/758.htm`](http://www.backyardocean.com/History-Of-Swimwear-Bikini-Thong-Infographic-s/758.htm)

    4. *Cool Infographics Gallery* on Pinterest: [`http://pinterest.com/rtkrum/cool-infographics/`](http://pinterest.com/rtkrum/cool-infographics/)

    5. *Our Amazing Planet: Top to Bottom*, LiveScience.com: [`http://www.livescience.com/27551-our-amazing-planet-top-to-bottom-mountaintop-to-ocean-trench-infographic.xhtml`](http://www.livescience.com/27551-our-amazing-planet-top-to-bottom-mountaintop-to-ocean-trench-infographic.xhtml)

    6. *Solar Savings: A Solar Innovation Story*, Extra Space Storage Inc.: [`http://www.extraspace.com/infographics/solarpower/`](http://www.extraspace.com/infographics/solarpower/)

    7. *The Common Cook’s How-Many Guide to Kitchen Conversions*, S.B.Lattin Design:
    [`http://sblattindesign.wordpress.com/2012/01/03/measure-up/`](http://sblattindesign.wordpress.com/2012/01/03/measure-up/)

    8. *The Lifespan of Storage Media*, CrashPlan: [`http://www.crashplan.com/medialespan/`](http://www.crashplan.com/medialespan/)

    9. *Most Polluted Cities in United States 2012*, American Lung Association (stateoftheair.org):
    [`http://infonewt.com/portfolio/client-work/18409910`](http://infonewt.com/portfolio/client-work/18409910)

