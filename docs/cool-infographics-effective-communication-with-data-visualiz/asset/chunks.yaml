  trans: '


    在给博客作者写信息时，请务必个性化。我每周会为 Cool Infographics 博客收到大约 400 份投稿，如果信息明显是模板或格式化信件，我就会忽略它。我曾看到同一天内有完全相同的信息提交了
    10 次，且仅更改了链接。人类是模式识别机器（第 1 章，““信息图的科学”），很容易识别出那些复制并粘贴到邮件中的脚本化信息。这些信息会直接进进垃圾桶。


    良好的信息应该直接写给博客作者，并包含相关信息。为什么他们的博客读者会对这幅信息图感兴趣？他们之前在类似主题上发布过哪些文章？他们之前发布过哪些关于你公司的内容？你曾在自己的社交网络中帮助他们分享过博主的哪些之前的文章？


    确保你直接包含了指向信息图落地页的 URL 链接。不要尝试将信息图的 JPG 图片文件作为附件发送给他们。你不希望他们在自己的网站上托管信息图图像，因为那样他们就不需要链接到你的页面了。只需发送
    URL 链接，让他们使用落地页上的嵌入代码或分享按钮即可。如果他们想在自己的网站上发布，他们也可以从落地页获取 JPG。在邮件中包含信息图的简短文字描述通常很有帮助，这样他们就可以将其粘贴到博客文章作为额外文本，即使这与落地页上的文字描述相同。


    当你将信息图发布到世界上后，它就有了自己的生命。最终，你无法控制它会发生什么。你无疑会看到关于它的正面和负面评论，从 SEO 的角度来看，这都是好事。如果人们发布链接并讨论你的信息图，你的网页排名就会受益。


    ## 新闻媒体网站


    新闻类网站始终在寻找要发布的优质内容，但它们也经常受到成百上千个故事创意、社论、新闻稿和信息图的轰炸。如果你在一家中大型公司工作，你可能已经有一个内部公关部门，或者与外部公关公司签了合同，他们现有的媒体联系人列表。你知道这些媒体联系人已经在发布与你行业相关的文章，所以要利用他们。这是在大型公司工作的一个巨大优势。


    此外，许多热门且高排名的媒体网站经常发布来自外部提交的信息图，但挑战在于如何让你的信息图进入他们的视野。有些网站在网站上有提交的系统，但另一些则隐藏了这一过程，以免每天收到成数千计的投稿。


    许多新闻网站专注于特定的主题领域，如政治、环境、健康问题或技术。在你的推广计划中纳入哪些新闻网站取决于你具体的信息图主题；然而，许多新闻网站涵盖了广泛的主题，可以适用于许多不同的信息图主题。


    *   **GOOD Magazine**— [`www.good.is`](http://www.good.is)


    Good Magazine 喜欢信息图。它已将数据可视化和信息图成为其在线和纸质文化不可或缺的一部分。在它的网站上创建一个免费账户，并上传自己的信息图作为社区可以学习的内容。


    *   **Mashable**— [`www.mashable.com`](http://www.mashable.com)


    Mashable 是一个受欢迎的在线新闻网站，通常关注技术、商业和创新内容。它有一个面向公众的专门故事投稿的页面，并包含了其在 Facebook 和 Twitter
    上编辑团队的链接。


    *   **Smashing Magazine**— [`www.smashingmagazine.com`](http://www.smashingmagazine.com)


    Smashing Magazine 发布的内容通常与技术、在线生活、网页开发、图形和设计相关。联系页面有一个表单可以提交建议，由其编辑团队审核。


    *   **The Next Web**— [`www.thenextweb.com`](http://www.thenextweb.com)


    The Next Web 涵盖与互联网技术、业务和文化最新新闻相关的内容。在它的联系页面上，列出了推销故事（你的信息图）的技巧，并在页面底部有一个联系表单。


    你还可以向许多新闻稿发布服务提交关于你信息图的新闻稿。这些服务可以让你的信息图以及文本和链接在网上供新闻服务和网站使用，并供搜索引擎爬虫访问。你的公司可能已经在这些服务之一开了账户，但如果没有，他们为单个新闻稿提供负担得起的选项。


    *   **PRWeb**— [`www.prweb.com`](http://www.prweb.com)


    PRWeb 提供了多种付费选项来上传新闻稿，新闻稿会被提交到主要新闻网站和搜索引擎。


    *   **PRLog**— [`www.prlog.org`](http://www.prlog.org)


    PRLog 提供免费和付费两种选项来提交用于发布的新闻稿。


    *   **PR Newswire**— [`www.prnewswire.com`](http://www.prnewswire.com)


    PR Newswire 提供了几个不同价格的方案来发布和跟踪你的新闻稿。针对小型企业和非营利组织有单独的方案。


    另一种策略是接触特定的作者而不是新闻媒体，因为他们可能会在多个网站上发布内容。作为长期策略更有可能成功。找到发布你公司行业文章的作者并开始与他们互动。在他们发布的内容上发表评论，发布他们文章的链接，在你公司的社交媒体账户中分享链接，并在他们使用的社交网络上关注他们。与你行业相关的作者建立长期关系，当你有高质量内容要分享时，他们会更愿意接受。他们甚至可能会回关你，并在无需提示的情况下从你的推广中获取你的信息图。


    ## 信息图分享网站


    当我 2007 年创立 Cool Infographics 博客 ([coolinfographics.com`](http://coolinfographics.com))
    时，它是互联网上专注于信息设计、数据可视化或信息图的少数网站之一。我可以用手指数出在线发布类似内容的网站数量。作为一名粉丝，我只需要访问少数几个网站就能跟上信息图设计的动态。


    然而，到 2013 年，现在有了大量的博客、Tumblr 页面、Flickr 照片组、Pinterest 画板、Facebook 粉丝页以及专门为了发布信息图而存在的网站。在过去的几年里，大量人们已经变成了优秀信息图设计的粉丝，无论主题如何。有一群观众喜欢看到作为他们日常信息消费一部分的信息图。


    这些精选展廊和评论网站是推广计划中最容易接触的一组网站。他们正在积极寻找信息图作为给读者的内容，其中许多网站允许你通过创建用户账户并向网站上传信息图来自发布。这些网站可以为你的信息图落地页带来大量的浏览和链接。


    '
- fmt: '

    For example, I’m selective about which infographics I post on the Cool Infographics
    blog. I mentioned earlier that I get approximately 400 submissions every week
    to the Cool Infographics blog, but I post only a handful on the blog every week.
    With that many submissions through the site contact page, it’s a serious challenge
    to keep up. A good infographic submission might be unread in my inbox for months
    before I find it, and then it might be much longer before I get around to writing
    a blog post about it.


    An additional advantage of these sites is that you may reach an audience you had
    never considered before. Readers of infographic sites may not have any reason
    to visit sites related to your company’s product or service, but when they see
    your infographic, it may attract their attention and build awareness.


    Here’s a short list of infographics sites for your reference. This list is constantly
    changing as smaller sites collapse and new sites are launched every day, so I
    attempted to include the more long-lasting sites. I do maintain an ongoing list
    of current infographics sites on the Cool Infographics blog. You can check for
    the most current list at [`coolinfographics.com/links/`](http://coolinfographics.com/links/).


    ## Infographic Self-publishing Sites


    These sites enable people to create a free account and upload their own design
    work. When people view the infographic you uploaded on these sites, they also
    have easy sharing buttons and embed code automatically generated so viewers can
    share them easily. This might not be as powerful as using the embed code from
    your own infographic landing page, but it’s convenient and easy to use.


    *   `Flickr`— [`www.flickr.com`](http://www.flickr.com)


    Use your own account (free or paid) to upload the infographic image into your
    own photostream. After the infographic is in your account on Flickr, you can add
    it to groups focused on sharing infographics by joining them. If your infographic
    topic is relevant to other photo groups, you can also join them and add the infographic
    as well.


    *   `Visual.ly`— [`visual.ly`](http://visual.ly)


    Visually has built a tremendous showcase of infographics. After you create a free
    account, you can upload your infographic to be included in the gallery. The site
    enables you to include a short text description and links to the source site and
    designer. When you view infographics on Visually, there are tools for easy sharing
    and it also allows viewers to like or comment on the infographics. Popular infographic
    designs are featured on Visually’s homepage.


    *   `Visualizing.org`— [`www.visualizing.org`](http://www.visualizing.org)


    Visualizing.org is a free community site to share data visualizations and infographics
    designs. Upload your own infographics; they are made available to anyone for viewing
    and commenting. They also maintain a large library of public data sets and host
    visualization design challenges.


    *   `Graphs.net`— [`www.graphs.net`](http://www.graphs.net)


    Graphs.net is a free gallery site that enables you to upload your own infographics.
    The site also provides space to include a text description and a link to the original
    source URL.


    *   `Love Infographics`— [`www.loveinfographics.com`](http://www.loveinfographics.com)


    Love Infographics is a free gallery that enables people to create an account and
    upload their own infographics. The infographics can include a text description
    and links to the original and enables other designers to add comments.


    *   `VisualizeUs`— [`vi.sualize.us`](http://vi.sualize.us)


    VisualizeUs is an image-sharing site that includes a large collection of infographics
    intended as inspiration for designers. Create an account and install its browser
    widget to upload your infographics to the site.


    ## Free Infographic Submission Sites


    Free infographic submission sites can be run by anyone, and new sites appear (and
    disappear) every day. Just like researching the topic related blogs, you should
    also research the web analytics of any infographics gallery sites to help determine
    which sites can be most valuable in your outreach plan.


    These sites have free reign to control the content they post and are under no
    obligation to post any infographic you submit. Just like the blogs, try to connect
    with the author to break through the clutter. On free sites, there’s no barrier
    of entry. So, every infographic gets submitted to these sites, often multiple
    times, which is annoying. That’s a lot of noise that your infographic design has
    to break through to get noticed.


    *   `Cool Infographics`— [`coolinfographics.com`](http://coolinfographics.com)


    On Cool Infographics, I strive to post the best examples of infographic designs
    I can find. I post only a handful of infographics each week out of the hundreds
    of submissions and infographics I find on my own. This careful selection has built
    the site into one of the strongest links you can get from an infographics gallery
    site. Submit your link and message through the Contact page.


    *   `Visual Loop`— [`www.visualoop.tumblr.com`](http://www.visualoop.tumblr.com)


    Tiago Veloso has built Visual Loop into one of the largest and most popular infographics
    galleries. You can find infographics, portfolios, interviews, Pinterest boards,
    and much more. This site makes the commitment that every infographic submitted
    will be posted to its Tumblr page, which then has the chance to be posted on its
    other channels. Submit your infographic through the Contact link on the page.


    *   `Chart Porn`— [`www.chartporn.org`](http://www.chartporn.org)


    Chart Porn is a great collection of the most visually appealing data visualizations,
    maps, charts, and infographics designs. The site is curated by Dustin Smith, and
    you can submit your infographic to the e-mail address on the About page.


    *   `News I Like`— [`www.newsilike.in`](http://www.newsilike.in)


    Bharat Praj posts infographics along with his own reviews of the designs on a
    frequent basis. Use the Submit page to send the URL link to your infographic landing
    page.


    *   `Submit Infographics`— [`www.submitinfographics.com`](http://www.submitinfographics.com)


    Submit Infographics posts selected infographics along with descriptive text, links,
    and a review by a designer. It requires a minimum of 100 words in your description
    to be considered.


    *   `NerdGraph`— [`www.nerdgraph.com`](http://www.nerdgraph.com)


    NerdGraph posts multiple infographics each day and enables anyone to submit infographics
    for review through its Submit page. Although it doesn’t post them all, it includes
    a text description, keywords, a link back to the original, and a promise to send
    an e-mail notification when the infographic is posted.


    ## Paid Infographic Submission Sites


    A number of infographic gallery sites charge for submissions to be considered.
    Usually it’s a small fee to cover the author’s time to review the infographic
    and compose a blog post. The pay wall also helps reduce the amount of submissions
    the site receives to only those publishers serious enough to pay the fee. Some
    sites even offer a range of services with different prices, from free up to expensive
    premium listings.


    Unlike the totally free sites, there’s an implied agreement that your infographic
    will definitely get posted if you pay the fee and probably not if you don’t pay.
    If you pay the money, you should expect to get coverage and links. Fees listed
    next were current as of 2013 and will change over time.

