  raw: 'In 2000, technology writer Rachel Chalmers^([5]) wrote, “We’re all informavores
    now, hunting down and consuming data as our ancestors once sought woolly mammoths
    and witchetty grubs.” She wrote that description as part of her article on how
    researchers at Xerox’s Palo Alto Research Center in California were investigating
    how people find information on the Internet by using anthropology to compare them
    to the foraging habits of early humans. Here’s the condensed version: The results
    were that the two behaviors were similar.


    This behavior of hunting for information is not new. Humans have been driven to
    gather new information since before recorded history. It’s a major reason that
    humans have not only survived, but also have developed the advanced civilization
    that exists today. How to grow better crops, how to build better weapons, and
    how to survive the winter, successfully hunting for more food, killing invading
    enemies, and so on. Our species thrives because we are constantly learning and
    improving.


    There is also an immense amount of pressure to make better decisions. Why do people
    still make poor choices when this massive library of human knowledge is available?
    For example, people are pressured to research products before making purchase
    decisions because price comparisons, promotional offers, star ratings, customer
    reviews, expert recommendations, feature comparisons, and third-party testing
    results are easily available.


    Part of this behavior is that people want to be perceived by others as having
    made good, well-informed decisions. It might take days to decide which is the
    best, new microwave to buy because we respond to this pressure by doing more research.
    We need more data, so we go looking for it.


    ## The Rise of Big Data


    We live in the Information Age. People have more information at their fingertips
    than at any time in history, and this problem is going to get worse (or better,
    depending on your point of view). It’s like putting a starving man in a Las Vegas
    buffet restaurant. We see this growth in data all around us; however, it’s hard
    to quantify how much information we see every day.


    On average, we are exposed to the information equivalent of 174 newspapers every
    day (assuming an 85-page newspaper). This research by Dr. Martin Hilbert^([6])
    at the University of Southern California looked at the state of information capacity
    in 2007, and the results represented an incredible growth when compared to the
    information equivalent of only 40 newspapers per day in 1986 ([Figure 1-8](#c01.xhtml_figure1-8)).


    ![c01f008.tif](image_fi/582305c01/c01f008.png)


    [**FIGURE 1-8:**](#c01.xhtml_figureanchor1-8) We are exposed to the information
    equivalent of 174 newspapers of information every day


    Another way we can estimate the sheer magnitude of information is by measuring
    the amount of data that moves across the Internet. First, here’s a quick reminder
    of how data is measured. In [Figure 1-9](#c01.xhtml_figure1-9), the tiny yellow
    square in the bottom-left corner represents 1 gigabyte of data (a single pixel
    on the computer screen). The larger, blue square represents 1 terabyte of data,
    and the big, purple square represents 1 petabyte. Each square is 1,024 times larger
    than the previous square.


    ![c01f009.tif](image_fi/582305c01/c01f009.png)


    [**FIGURE 1-9:**](#c01.xhtml_figureanchor1-9) The size of a petabyte


    Estimates from 2008 are that Google was processing 24 petabytes of data each day^([7])
    and that the entire written works of mankind, from the beginning of recorded history,
    in all languages would be a total of 50 petabytes.^([8])


    With the size of a petabyte in perspective, the Cisco Visual Networking Index^([9])
    makes more sense. [Figure 1-10](#c01.xhtml_figure1-10) shows you the historical
    Internet traffic that has been measured and leads up to the future projection
    of more than 120,000 petabytes per month by 2017.


    ![c01f010.tif](image_fi/582305c01/c01f010.png)


    [**FIGURE 1-10:**](#c01.xhtml_figureanchor1-10) Global Internet traffic growth


    The amount of data available in the modern world can be measured in many ways,
    but they all indicate that it will continue to increase.


    ## Why Infographics Work


    So, how can we cope?


    There are a number of reasons why visual information is a more effective form
    of communication for humans. The main reason is that vision is the strongest form
    of input that we use to perceive the world around us. In his book *Brain Rules*,
    developmental molecular biologist John Medina states, “Vision is by far our most
    dominant sense, taking up half of our brain’s resources.”^([10])


    Studies estimate that between 50–80 percent of the human brain is dedicated to
    forms of visual processing,^([11][12]) such as vision, visual memory, colors,
    shapes, movement, patterns, spatial awareness, and image recollection.


    ### Pattern Recognition


    Humans are pattern recognition machines. Yes, this comes from the evolution of
    a survival instinct. To survive, humans needed to see a situation and react appropriately
    in mere seconds. We can see the scene from the photo in [Figure 1-11](#c01.xhtml_figure1-11),
    recognize the lion hiding in the grass, understand the mortal danger we may be
    in, and start running away in a fraction of second.


    ![c01f011.tif](image_fi/582305c01/c01f011.png)


    [**FIGURE 1-11:**](#c01.xhtml_figureanchor1-11) Lion hiding in the grass


    Visualizing data taps into this pattern recognition ability and significantly
    accelerates the understanding of the data.^([13]) You can look at a chart of data
    presented and understand it quickly by seeing the patterns and trends. This is
    a much faster way to comprehend information compared to reading numbers, comprehending
    the math, and then imagining in your mind how the numbers relate to each other.


    The human ability to see patterns and trends quickly is the major reason why data
    visualizations are so powerful as components of infographic design.


    ### The Language of Context


    Data visualization is the language of context, which is all about showing multiple
    values in comparison to each other to provide context for the reader. If we see
    a number in text by itself, we don’t know how to understand it.


    [Figure 1-12](#c01.xhtml_figure1-12) shows a numeric value in text by itself.
    In isolation, the brain doesn’t know how to comprehend this value. Is it big or
    small, good or bad, increasing or decreasing? You don’t know. If no context is
    provided, your brain tries to provide context from your own experiences. You may
    think: *“There are a lot of digits, so it looks like it might be a big number.
    I know there are about 500 kids in my son’s school, so this number sounds very
    big in comparison!”*


    ![c01f012.tif](image_fi/582305c01/c01f012.png)


    [**FIGURE 1-12:**](#c01.xhtml_figureanchor1-12) A text number by itself has no
    context. ^([14] [15])


    This is the baggage that an audience brings with them. If the designer doesn’t
    provide context to help understand the value, the audience will make up their
    own. Chances are good that it won’t be how the designer intended the audience
    to interpret that data. To communicate clearly, the context needs to be provided
    to them.


    We can’t effectively visualize a number all by itself. The bar chart in [Figure
    1-13](#c01.xhtml_figure1-13) has only one bar and it doesn’t provide context to
    the readers either.


    ![c01f013.tif](image_fi/582305c01/c01f013.png)


    [**FIGURE 1-13:**](#c01.xhtml_figureanchor1-13) A bar chart with only one bar
    doesn’t provide context.


    Adding a second value for comparison puts the original value into context for
    the reader. It provides a frame of reference to give the reader a way to understand
    the magnitude of the original number. [Figure 1-14](#c01.xhtml_figure1-14), includes
    the population of the United States for comparison, using circles to visualize
    both values.


    ![c01f014.tif](image_fi/582305c01/c01f014.png)


    [**FIGURE 1-14:**](#c01.xhtml_figureanchor1-14) Providing a second value for comparison
    creates context. ^([14] [15])'
