    A zooming interface is usually created by starting with a large image file of
    a static design and then adding the interface controls as part of the web page.
    Custom web page code such as `HTML5` and `JavaScript` can create the user interface,
    but online services such as `Zoom.it` (`zoom.it/`](http://zoom.it/)) from Microsoft
    enable anyone to create an interactive, zoomable image interface using the link
    to an available image online.


    [Figure 1-28](#c01.xhtml_figure1-28) shows the huge infographic design, `Ownership
    of Beer Brands and Varieties 2010` by Associate Professor Phillip H. Howard from
    Michigan State University and his wife Ginger Ogilvie. The design is a large visualization
    of the many varieties of beers owned by the various parent companies. Viewed as
    a whole on the screen or page, most of the text is unreadable.


    ![c01f028.tif](image_fi/582305c01/c01f028.png)


    [FIGURE 1-28:](#c01.xhtml_figureanchor1-28) Large poster-sized infographic designs
    are perfect for zooming interfaces


    [`coolinfographics.com/Figure-1-28`](http://coolinfographics.com/Figure-1-28)


    *Source:* *Ownership of Beer Brands and Varieties 2010*, Phillip H. Howard and
    Ginger Ogilvie*


    However, by using the `Zoom.it` tool, they were able to create the zooming interface
    you see in [Figure 1-29](#c01.xhtml_figure1-29). The reader can navigate the design
    using the mouse or the controls in the lower right-corner. The design with the
    zooming interface can be seen in all browsers and even embedded into other websites
    to share.


    ![c01f029.tif](image_fi/582305c01/c01f029.png)


    [FIGURE 1-29:](#c01.xhtml_figureanchor1-29) Beer Ownership infographic as seen
    in the Zoom.it interface tool


    [`coolinfographics.com/Figure-1-29`](http://coolinfographics.com/Figure-1-29)


    *Source:* *Ownership of Beer Brands and Varieties 2010*, Phillip H. Howard and
    Ginger Ogilvie*


    A major advantage to using a zooming interface is that it enables readers to see
    the entire design on the screen without any scrolling before delving deep into
    details. By starting with the big picture, the readers gain a better understanding
    and context of how the details fit into the overall story.


    ### Clickable Infographics


    Clickable infographics also add a user interface layer to static infographic designs
    by making specific regions of the design clickable with `HTML` links. This interface
    is often created as an `HTML Image Map`, which is interpreted by the web browser
    to identify specific regions of the static image by their pixel locations as clickable
    to a URL address. Designers use the advantage of clickable designs to remove secondary
    information and additional details from the primary infographic design.


    The designer can use clickable infographics as a method to keep the original infographic
    clean and simple to read. Readers who want more information can dig deeper by
    clicking the links, but the main infographic remains simple and easy to understand.


    It’s a little difficult to show how this works on a printed page, as shown in
    [Figure 1-30](#c01.xhtml_figure1-30). In this design from 2011, the list of the
    `Top 26 Most Promising Wine Apps` from VinTank is shown within a visualization
    that groups them by category. Each of the `iOS` app icons takes the reader to
    the appropriate page in the `iTunes App Store` when clicked. This kept the design
    clean and simple by removing the need to spell out all the URL addresses in the
    text.


    ![c01f030.tif](image_fi/582305c01/c01f030.png)


    [FIGURE 1-30:](#c01.xhtml_figureanchor1-30) Each icon in this infographic is a
    separate `HTML` link


    [`coolinfographics.com/Figure-1-30`](http://coolinfographics.com/Figure-1-30)


    *Source: VinTank App Spectrum*


    A variation of this type of design style is a pop-up infographic style. Instead
    of the reader clicking different areas of the infographic to access additional
    information, the secondary information appears as the reader hovers their mouse
    pointer over different regions of the design.


    *A Raw Chocolate History* is an infographic timeline. The main design in [Figure
    1-31](#c01.xhtml_figure1-31) is a simple, circular timeline with illustrations,
    but when the reader hovers over any of the illustrations, secondary information
    specific to that time period appears ([Figure 1-32](#c01.xhtml_figure1-32)) providing
    additional information to the reader without cluttering the original design.


    ![c01f031.tif](image_fi/582305c01/c01f031.png)


    [FIGURE 1-31:](#c01.xhtml_figureanchor1-31) Using pop-up information can keep
    the original design clean


    [`coolinfographics.com/Figure-1-31`](http://coolinfographics.com/Figure-1-31)


    *Source:* *The Raw Chocolate History*, *The Chocolution.com*


    ![c01f032.tif](image_fi/582305c01/c01f032.png)


    [FIGURE 1-32:](#c01.xhtml_figureanchor1-32) Additional information pop-up


