    most resumes are still text-only. Initially, infographic resumes were embraced
    by candidates looking for graphic designer, web designer, social media, and web
    development roles. After the first couple of years, the trend quickly spread into
    other fields, and many infographic resumes have been used for more traditional
    roles such as CEOs, vice presidents, managers, accountants, actors, and IT professionals.


    ### Job Application Systems


    The biggest hurdle facing the use of infographic resumes are the automated job
    application systems (also called application tracking systems) used by many companies.
    These online systems prompt the job applicant to input or upload their resume
    file into a database, usually as text-only or Microsoft Word format. The application
    system then parses the text into key words that are automatically organized into
    predefined categories. The key words are loaded into a central database so that
    hiring managers and human resources departments can easily query the database
    to match open positions with job candidates.


    Any visual design and even traditional text formatting from the resume becomes
    irrelevant because the hiring company never sees the original document, just the
    collected text. This means that even if job applicants have an infographic resume,
    its usefulness will be effective only when their resume is sent through e-mail,
    displayed as part of the candidate’s online profile (personal website, LinkedIn,
    Facebook profile, and so on) and when physically shown to a potential employer
    in face-to-face interviews.


    There are only two formats that I have seen to be effective when using an infographic
    resume as part of a job search: a separate, standalone infographic resume design
    and a combined design that integrates the data visualizations into the full-text
    resume.


    ### Standalone Infographic Resume


    So far, the most common format for an infographic resume is a separate infographic
