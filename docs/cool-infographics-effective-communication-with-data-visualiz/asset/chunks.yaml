    # Acknowledgements


    I must first thank Carol Long from John Wiley & Sons whose first question, “Have
    you considered writing a book?” led ultimately to the one you are holding. I might
    have put it off indefinitely if not for Carol’s confidence in me.


    At John Wiley & Sons I especially thank Adaobi Obi Tulton, my project editor,
    for her patience with this first-time author and her enthusiasm for the project.
    Thanks also to Nancy Gage ([`www.coroflot.com/n-gage`](http://www.coroflot.com/n-gage)),
    Ashley Zurcher, San Dee Phillips, Christine Mugnolo, Katie Wisor, and the many
    other people involved in bringing this book together.


    Heartfelt appreciation to my good friend Penny Sansbury for acting as my personal
    editor. Penny not only brought her technical writing background to the table,
    but she’s the kind of friend from whom I am guaranteed to get honest feedback.


    Thanks to designer Ray Vella for adapting one of his infographics for use as the
    cover design.


    Special thanks to all the companies and designers of the data visualizations and
    infographic designs included in this book. Your generosity helps us all learn
    to be better designers.


    I owe a debt of gratitude to the thousands of visitors and subscribers to the
    Cool Infographics blog and to all the readers that have contributed comments and
    submitted infographics, and everyone that contacted me over the years to share
    their support.


    I offer both thanks and encouragement for the thousands of infographic designers
    throughout the world. Your work has taught me, inspired me, and convinces me we
    will be doing this work for a long time to come.


    I must also thank my parents, Sue and Bill, for always encouraging me to explore
    my interests and teaching me not to be afraid of going my own way.


    Finally, I offer the most credit to my wife Mary Kaye, my biggest and most steadfast
    supporter. I can never thank her enough for encouraging me to follow my passion
    when I started the blog, started my own company, and eventually started writing
    this book. I can count on her to continually remind me—without subtlety—to get
    back to writing.


    # 1 Introduction


    I have always loved data.


    The data could be huge spreadsheets of numbers, quantitative research data, business
    processes, demographics, financial results, map locations, or web statistics.
    It didn’t matter—I loved it all.


    After hours of working with a data set in a spreadsheet or database, I could see
    patterns and make interesting discoveries from the numbers. However, nobody else
    wanted to review the spreadsheet in that detail. They didn’t want to see the data;
    they just wanted to understand the conclusions. That’s when I embraced data visualization
    and infographics design.


    If I could put a large number of data points onto one page, I could make it easier
    for the audience to understand how they all compared. People could look at one
    data point and understand how it fit into the context of the whole data set. Much
    later, I learned about studies and research that support the power of data visualization,
    but at the time I saw for myself that for most audiences, seeing is believing.
    If I could visualize the data, audiences could understand the information.


    Working in marketing and product development departments for several consumer
    product companies, I was mining these visualizations as inspiration to create
    visual designs with my own data. I needed to walk the audience through a sequence
    of information so that it would understand how I was reaching my conclusions;
    I needed to tell a story with the data. I also determined that it needed to be
    visually distinctive for it to be memorable.


    Internal graphic design departments never had enough time available to help with
    presentations. They were busy with product packaging, websites, and advertisement
    designs. My degree in mechanical engineering—not graphic design—meant I had to
    learn information design on my own. I came to infographics from the data side
    and learned design along the way.


    Over time, my designs got better and visualizing the data conveyed a strong sense
    of understanding and credibility. I practiced and learned what resonated with
    audiences. I might not have started out with the intent to become an infographics
    designer, but that is where I ended up.


    In 2007, I started the Cool Infographics blog ([`coolinfographics.com`](http://coolinfographics.com))
    as an experiment. I was already collecting good infographic designs I liked and
    hanging them on the walls of my office, so those became the first infographics
    I posted about on the blog. Privately, I didn’t think the blog would last more
    than year because I was afraid I would run out of material. Fortunately, the awareness
    and popularity of infographics exploded online, and now there are more good infographics
    than I will ever be able to post.


    ## What’s in This Book


    This is a book for everyone, but different people use infographics for different
    purposes. The chapters have been written so they can each be read independently,
    and even though I think you should read every word, you don’t need to read this
    book cover to cover to understand the content.


    ![image](image_fi/g1.jpg) Chapter 1: “The Science of Infographics” defines the
    difference between data visualizations and infographics, the escalating information
    overload, the research behind the power of infographics, and why visual storytelling
    with data will continue to grow.


    ![image](image_fi/o.jpg) Chapter 2: “Online Infographics” explains why so many
    infographics online are designed to be tall and explores the many different objectives
    of infographics online. Infographics are intentionally structured for different
    purposes like persuasion, education, advertisements, and more. How copyrights
    and trademarks apply to infographics is also explained.


    ![image](image_fi/r.jpg) Chapter 3: “Infographics and SEO” delves into why publishing
    infographics is so valuable to online marketing campaigns, and how you can get
    the most value from launching infographics online. Relevance and online lifespan
    are key components to successfully launching an infographic. A complete strategy
    for releasing infographics online is described in detail.


    ![image](image_fi/v.jpg) Chapter 4: “Infographic Resumes” takes a close look at
    the growing phenomenon of visualizing data in personal resumes. These resumes
    have benefits and risks that every job seeker should understand. Also, various
    publishing strategies for successful infographic resumes are explained, and a
    number of design tools are introduced.

