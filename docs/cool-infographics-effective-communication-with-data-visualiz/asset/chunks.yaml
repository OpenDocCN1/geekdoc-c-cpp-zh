    This infographic was specifically designed for the online viewing experience.
    The tall format reinforces the huge scale of distance represented by making the
    audience spend a lot of effort scrolling the page to view the entire design. A
    second version (middle) was created as a better aspect ratio for printing as a
    custom poster, but even this version must be significantly reduced in size to
    print on a standard page size.


    In this case, this works very well because the primary experience is online. However,
    designers need to carefully consider their publication strategy for any infographic
    design. If it’s primarily going to be viewed online, tall formats are optimal.
    If you intend to print the infographic as a handout or use the infographic in
    presentations, consider limiting the overall design to fit within the size of
    a single piece of paper, or designing it in sections that can be easily printed
    on separate pages.


    ## Types of Online Infographics


    One of the biggest challenges for any marketing function within a company is to
    communicate directly to the end user of its product or service. Many companies
    sell to an intermediary company, like a retailer or service provider, and don’t
    have many opportunities to send their message to the end users of their product
    or service. In addition, consumers generally don’t thoroughly read the packaging
    or the manual that comes with the products they buy.


    However, companies have some great stories to tell about their products or services.


    *   What consumer problems do they solve?

    *   What unique advantages or value propositions do they offer?

    *   How do they differ from other products?

    *   What benefits to the consumer have been designed into the product?

    *   Why were specific design choices made?

    *   How have they addressed environmental or sustainable concerns?


    How do they get the consumers to listen to stories about why their products are
    better than the competition or how to use the products effectively? Infographics
    have become a fantastic format to reach consumers directly. Cool, fun, and engaging
    infographics published online can reach the target end users directly and grab
    the consumer’s attention.


    [Figure 2-6](#c02.xhtml_figure2-6) is a great example of this from Extra Space
    Storage. The `Solar Savings: A Solar Innovation Story` infographic is a design
    meant to share additional information with both customers and shareholders. The
    infographic provides some transparency into the data behind the decisions that
    are driving the business, and helps establish Extra Space Storage as a market
    leader in self storage.


    ![c02f006.tif](image_fi/582305c02/c02f006.png)


    [**FIGURE 2-6:**](#c02.xhtml_figureanchor2-6) Using an infographic to inform consumers
    and shareholders about the company


    [`coolinfographics.com`](http://coolinfographics.com)[`/Figure-2-6`](#c02.xhtml_figureanchor2-6)


    Source: `Solar Savings: A Solar Innovation Story`, Extra Space Storage Inc.


    ### Informative Infographics


    Informative infographics are the dominant type of design you see online. The underlying
    theory is that online audiences are more willing to read and share valuable information
    instead of advertisements. If companies can provide valuable information to readers
    without a blatant sales pitch, those infographics have a significantly higher
    chance to be shared with friends and family and potentially go viral online.


    After publishing infographics online for a number of years, I am completely convinced
    of this theory. If the goal of the design project is to maximize the number of
    views, visitors, and backlinks to the hosting site, informative infographics are
    more successful than all other types of designs.


    Consider this example from S.B. Lattin Design in [Figure 2-7](#c02.xhtml_figure2-7),
    `The Common Cook’s How-Many Guide to Kitchen Conversions.` The design is beautiful,
    and the topic is a purely informative summary of common kitchen measurement conversions
    shown in a visual form. Nowhere in this design does it tell you what the company
    does or pitch its services to the reader. You know it comes from S.B. Lattin Design
    because it clearly shows its logo in the footer at the bottom of the design.


    ![c02f007.tif](image_fi/582305c02/c02f007.png)


    [**FIGURE 2-7:**](#c02.xhtml_figureanchor2-7) Informative infographic design


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-7`](#c02.xhtml_figureanchor2-7)


    Source: `The Common Cook’s How-Many Guide to Kitchen Conversions`, S.B. Lattin
    Design


    The information presented is common knowledge, available publicly to anyone that
    wants to compile it (people can figure out the conversion rates from most cookbooks),
    but the designer took the time to gather the data and present it in a visually
    compelling way to reach its audience. The design continues to be shared heavily
    online, generates sales as a printed poster, and puts S.B. Lattin Design into
    the mindshare of its target customers.


    The best designs focus on a topic directly related to the company business or
    brand, and this creates the relevance that search engines are looking for. The
    infographic in [Figure 2-8](#c02.xhtml_figure2-8) is `The Lifespan of Storage
    Media` published by CrashPlan, an online backup company. Of course the company
    wants to sell its backup services to new customers, but the infographic isn’t
    a sales pitch. Based on its extensive research, the infographic uses data visualizations
    to show the readers why an online, cloud-based backup is better than storing their
    data, music, videos, or photos onto their own devices.


    ![c02f008.tif](image_fi/582305c02/c02f008.png)


    [**FIGURE 2-8:**](#c02.xhtml_figureanchor2-8) Informative infographic about data
    storage, not an advertisement or a sales pitch


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-8`](#c02.xhtml_figureanchor2-8)


    Source: `The Lifespan of Storage Media`, CrashPlan


    The overall message is that all storage devices are at risk of failure over time,
    but an online storage solution offers a backup that has the additional benefits
    of being expandable, redundant, and offsite. Notice that the message is meant
    to be independent and objective. `Any` online-based storage solution could provide
    those same basic benefits, but by publishing the informative infographic, CrashPlan
    establishes itself as a credible market leader in the minds of the readers.


    The link to the company brand could be blatantly obvious or subtle, but the objective
    of informative infographics is to tie the value of the information presented to
    the value of the brand. This creates a positive perception of the brand.


    ### Persuasive Infographics


    Persuasive infographics take a slightly different approach. These infographic
    designs lead the readers to a clear call to action and they attempt to convince
    the audience to do something after seeing the infographic.


    The visualizations and information in persuasive designs are all intended to lead
    the reader to a predetermined conclusion and then provide a specific action that
    the reader should take. This type of design can make readers skeptical and resistant
    to the message. They know the company or designer behind the infographic is pushing
    a specific agenda, but that doesn’t mean these designs mislead the audience.


    It’s worth stating the obvious: `Readers should be skeptical of any infographic
    information.` Everyone should check the sources and make sure they understand
    the context of the information being presented, but they often don’t.


    There is a portion of the population (probably a large portion) that is not good
    at critical thinking. Over the years, information presented in an official-looking
    form is often perceived to be credible and has been often mocked:


    1.  read it in the newspaper, so it must be true.

    2.  heard it on the radio, so it must be true.

    3.  saw it on television, so it must be true.

    4.  found it on the Internet, so it must be true.

