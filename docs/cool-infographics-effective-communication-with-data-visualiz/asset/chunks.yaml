    Design matters. But design is not about decoration or about ornamentation. Design
    is about making communication as easy and clear for the viewer as possible.


    —GARR REYNOLDS, PRESENTATION ZEN


    # 6 Designing Infographics


    If you have any interest in designing data visualizations and infographics, this
    chapter is for you. You might be ready to design one on your own, or you might
    work with a designer to put an infographic together. Either way, these design
    tips can help you create a cool infographic and avoid many of the common mistakes
    designers make.


    Infographics are harder to design than you might think. There are thousands of
    “bad” infographic designs on the Internet because the designer ignored one, or
    many, of these rules. In a pattern similar to the millions of videos uploaded
    to YouTube, most of the infographics online are actually poor designs and get
    little traffic. The good designs rise to the top and are the designs that most
    often go viral in social networks.


    This chapter doesn’t point out and show any specific examples of bad designs that
    didn’t follow these rules. Because I may have broken some of these rules in the
    past, I’m not here to criticize others, but to offer help to anyone that wants
    to get better at designing infographics. You can find thousands of examples of
    infographics online that break these rules on your own.


    Following is a collection of top tips and tactics for designers that want to create
    better infographic designs. These will be tips focused on improving the content
    and structure of an infographic, and not software how-to tips. These best practices
    will apply no matter what software is used to put the infographic design together.
    It doesn’t matter if you use Adobe Illustrator, Microsoft PowerPoint, or an online
    tool like Infogr.am. Specific software applications are covered in [Chapter 7](#c07.xhtml_c7),
    “Design Resources.”


    ## Be Accurate


    Accuracy is the most important aspect of an infographic design, and everything
    else is secondary. The data visualizations in your infographic must match the
    numbers.


    The power of infographics works both ways and can hurt you if you get it wrong.
    The ability to communicate your information to your audience with a clear visualization
    can demonstrate your expertise in your subject area, build your credibility, and
    help your audience remember your message. Getting the data visualizations wrong
    can kill your credibility just as quickly and demonstrate your lack of expertise
    in your subject area. Your audience will assume that because you got one data
    visualization wrong, the rest of your message is also of questionable accuracy.
    One bad chart draws so much attention from the audience that it won’t matter that
    the rest of the information is correct. The perception of bad information will
    have been set in the minds of the audience.


    [Figure 6-1](#c06.xhtml_figure6-1) shows the most common mistake made in infographic
    designs: incorrect pie charts. The values in a pie chart MUST add up to 100 percent,
    but apparently many designers do not understand this basic fact. Pie charts should
    be used to show only how separate pieces are portions of a total amount. Percentages
    are portions of 100 percent.


    ![c06f001.tif](image_fi/582305c06/c06f001.png)


    [FIGURE 6-1:](#c06.xhtml_figureanchor6-1) WRONG! Pie charts MUST add up to 100
    percent.


    The issue most often seen is that designers misuse pie charts and apply them to
    incompatible data. Even if the designer uses a charting program to create the
    pie chart, such as `Excel`, this can easily happen when the data is not clearly
    understood by the designer. This is the result of a concept called `Maslow’s Hammer`^([1]),
    commonly phrased as, “When all you have is a hammer, everything looks like a nail.’


    Designers overuse pie charts because they are so easy to create and mistakenly
    apply them to data sets that are not proportions of a whole.


    Many research survey questions enable the respondents to choose multiple answers.
    The results from this type of question yield frequency values for each available
    answer independently. For example, a hypothetical survey question might look like
    this:


    Which types of fruit do you eat? [Check all that apply.]


    * Apples

    * Oranges

    * Grapes


    In this case, the resulting data would be better visualized in a bar chart because
    each fruit is a portion of a total amount.


    ![c06f002.tif](image_fi/582305c06/c06f002.png)


    [FIGURE 6-2:](#c06.xhtml_figureanchor6-2) WRONG! Pie charts MUST add up to 100
    percent.


    ### Visualizing Area


    It’s key for data visualization designers to understand that we visually compare
    the sizes of objects based on their area. Numerical values are one-dimensional,
    but objects on a page or a screen are two-dimensional. This is where designers
    need to remember the math learned from high-school class. Some shapes are easy
    to size correctly because their area is directly proportional to one dimension.
    Now walk through a couple different ways to visualize the following simple budget
    data.


    | Department | Budget |

    | :--- | :--- |

    | Marketing | $1,000,000 |

    | Sales | $3,000,000 |


    [Figure 6-3](#c06.xhtml_figure6-3) demonstrates the math behind the easiest visualization,
    a bar chart. In a standard bar chart, the width of each rectangle remains constant,
    and only the height changes. If you change only the height, then the area changes
    in direct proportion.


    ![c06f003.tif](image_fi/582305c06/c06f003.png)


    [FIGURE 6-3:](#c06.xhtml_figureanchor6-3) Dimensions of a bar chart to calculate
    area of the rectangles


    ```

    The area of a rectangle:

    Width × Height = Area


    The area of the Marketing bar:

    2.0 in × 2.0 in = 4.0 in²


    The area of the Sales bar:

    2.0 in × 6.0 in = 12.0 in²

    ```

