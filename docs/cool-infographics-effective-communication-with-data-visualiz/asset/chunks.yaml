    ### The Link Bait Challenge


    Link bait is a phrase used to describe any content that has been specifically
    crafted to attract a significant number of views and links from other websites.
    Usually, the content used for link bait is something chosen to have broad appeal
    to the widest possible audience. That way, the company that publishes the content
    has the best chance to get as many links and views as possible.


    For many, link bait has earned a bad reputation and can be perceived to be a shady
    form of online marketing. Even the term link bait sounds like it’s related to
    spam, but it really isn’t. Every infographic online could be considered link bait,
    because they are all trying to attract more traffic with visually engaging content.
    You’ll see link bait online in different formats, things like shocking gossip,
    surprising news, amazing photos, funny videos, Top 10 articles, and of course,
    infographics. The best topics for link bait are controversial subjects or topics
    with strong emotional appeal. Link bait is neither good nor bad; it depends on
    how it is used. All of the cool infographics shown in this book are good link
    bait designs. In contrast, an infographic that leads readers to a malicious site
    that loads malware onto their computers would definitely be considered to be bad
    link bait.


    The problem comes from content that isn’t relevant to the site that publishes
    it. When the topic of the infographic is not related to the site that publishes
    it, the search engines have a hard time determining if a link should be considered
    as an endorsement of the company.


    As an example of infographic link bait, the *James Bond: 50 Years of Movies* design
    in [Figure 3-5](#c03.xhtml_figure3-5) is a well-designed infographic. It contains
    lots of great information for fans of James Bond movies, a beautiful color palette,
    engaging icons, and the data is easy to understand. The infographic was popular
    online with tens of thousands of views, thousands of shares in social media, and
    hundreds of outside pages posting the infographic with links back to the H&R Block
    web page. By all accounts, the infographic “went viral” and you can see in [Figure
    3-6](#c03.xhtml_figure3-6) that a Google image search found 284 sites that had
    reposted the infographic.


    ![c03f005.tif](image_fi/582305c03/c03f005.png)


    [**FIGURE 3-5:**](#c03.xhtml_figureanchor3-5) An example of a cool infographic
    used as link bait


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-5`](#c03.xhtml_figureanchor3-5)


    *Source:* James Bond: 50 Years of Movies*, H&R Block*


    ![c03f006.tif](image_fi/582305c03/c03f006.png)


    [**FIGURE 3-6:**](#c03.xhtml_figureanchor3-6) Google image search finds 284 sites
    that reposted the infographic image.


    This is a good use of link bait to drive traffic to the site (there’s no malicious
    intent). The challenge for search engines is that the topic of James Bond movies
    has nothing to do with H&R Block’s business of preparing tax returns. Algorithmically,
    all those views and links back to the infographic landing page on H&R Block’s
    site have the potential to increase the site’s overall score in each of the search
    engines. In turn, the higher score causes H&R Block’s site to appear higher in
    search results.


    However, this is not what the search engines want to happen. This could be perceived
    as a method of gaming the system that uses infographic link bait as a strategy
    to raise the score of the H&R Block website. Is it a good infographic? Absolutely.
    Should links to the infographic page raise the credibility of H&R Block for tax
    preparation services? Probably not. The act of people linking to the infographic
    because they like James Bond movies should not be interpreted as an endorsement
    of H&R Block’s services.


    ### It’s All About Relevance


    At this point, the search engines don’t have a good way to solve this challenge.
    Today, link bait infographics are effective as an SEO tactic and can successfully
    raise a website’s overall score.'
