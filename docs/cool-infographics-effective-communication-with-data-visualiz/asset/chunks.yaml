    1. comScore Releases March 2013 U.S. Search Engine Rankings, `http://www.comscore.com/Insights/Press_Releases/2013/4/comScore_Releases_March_2013_U.S._Search_Engine_Rankings`

    2. Matt Cutts and Eric Enge Talk About What Makes a Quality Site, July 2012, `http://www.stonetuple.com/matt-cutts-and-eric-talk-about-what-makes-a-quality-site/`

    3. bitly.com, How long will people pay attention? September 2011, `http://blog.bitly.com/post/9887686919/you-just-shared-a-link-how-long-will-people-pay`


