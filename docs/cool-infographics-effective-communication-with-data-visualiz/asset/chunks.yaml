    然而，在线信息图是另一种类型的公共公司信息。其目标是尽可能在尽可能不同的网站上将信息图分享给尽可能多的人。希望这些信息图能分享一些关于公司行业、市场、研究数据或产品的某种新颖、令人惊讶且具有洞察力的数据。公司应该为这一信息感到自豪，并希望每个人都分享它。


    为了克服这一障碍，公司需要主动允许员工分享信息图……且必须是**书面形式**。通常，一封内部电子邮件就足够了。通常情况下，这条信息会提到有关信息图的主题、公司有多么想与公众分享这些信息，当然，还会有指向信息图落地页的链接。礼貌地请求员工参与，帮助启动信息图的发布，并使用落地页上的分享按钮将信息图分享到自己的社交网络中。有些员工不会参与，但会有许多人参与的。


    你绝对不应该做的事情就是要求或强制员工分享你的任何内容。这会迅速变成一个双输的局面。公司可能会迅速在员工中产生许多敌对情绪，并使公司面临大量负面声誉的风险。说真的，如果人们并不想自己分享信息图，而你觉得你需要强迫人们分享信息图，那么你的方法错了。


    ## 推广、宣传与外联


    发布策略的第三部分是**外联**（Outreach）。这是向公司之外的其他作者和网站营销信息图的活动。其希望是他们会欣赏你的信息图并发布链接。这可能是一个模糊的行业，涉及一些令人存疑的垃圾邮件式操作，但你应该坚持立场，专注于通过最佳实践来为你的信息图建立有机链接。


    再次，搜索引擎公司不断尝试改进其算法以过滤掉垃圾信息和虚假链接，以便其用户获得良好的搜索结果。你的外联活动应该关注可能对信息图感兴趣的真实作者和博主。如果有人因为喜欢而发布了你的信息图，并且认为他们的观众也会喜欢，你就不需要担心未来的算法更新。


    记住，来自高分网站的链接最有价值。有很多工具可以帮助你确定特定网页的排名。一个简单易用的工具是 `PRChecker.info` ([`www.prchecker.info`](http://www.prchecker.info))，它允许你输入任何网页的
    URL 来确定其当前的 Google PageRank。


    ### 特定主题的博客


    除非是某人的个人博客，否则大多数博客都对他们擅长的话题有某些关注。Cool Infographics 博客显然专注于信息图，但你可以持续地找到与你想要的任何利基主题相关的博客。如果你的信息图设计是关于巧克力纸蛋糕的，你可以找到数百个以纸蛋糕为主题的博客，将其纳入你的外联计划。


    在线搜索寻找与你信息图主题相关的博客。你可以轻松地使用 `Google Blog Search` ([`www.google.com/blogsearch`](http://www.google.com/blogsearch))
    搜索与你信息图关键词相关的博客。点击结果页顶部的“搜索工具”按钮，你可以在“帖子”（Posts）以寻找发布过与你主题相关文章的特定作者或“首页”以寻找整个网站之间选择。


    一种有效的方法是查看已经链接到你现有网站内容的网站列表。你必须深入研究公司的网络分析数据，或使用接下来列出的网站探索工具之一。这些网站了解你的公司，并且足够喜欢你之前的某些内容，以将其发布在自己的网站上。它们很可能接受来自你公司的任何额外优质内容。


    在你列出潜在网站列表后，稍微额外的挖掘可以通过确定哪些博客对你的外联计划最有价值来帮助缩小范围。没有人有时间联系 500 个博客，所以集中你的精力是很重要的。


    以下列表涵盖了博客的五个不同方面，你应该研究并使用它们来帮助评估指向你信息图的任何链接的价值：


    - **活跃？**——博客很容易创建，也同样容易被遗弃。检查最近帖的日期，确保它们仍在积极发布内容。如果最后一次发布是一年前，就把它从你的列表中删掉。不要在遗弃的博客上浪费时间。

    - **排名？**——最容易检查的统计数据是你找到的每个博客的 Google PageRank。网上有很多不同的工具可以揭示网站的 SEO 数据，有些免费，有些付费。尝试使用
    Google Chrome 浏览器的 `PageRank Status` 扩展 ([`pagerank.chromefans.org`](http://pagerank.chromefans.org))
    来显示你访问的任何页的 PageRank。还有其他 SEO 工具使用它们自己的指标对网站进行评分，这些工具也有助于判断指向你信息图的链接可能有多有价值。来自
    SEOmoz 的 `OpenSiteExplorer` ([`www.opensiteexplorer.org`](http://www.opensiteexplorer.org))
    使用一种名为“域名权重”（Domain Authority）的衡量对网站评分，而 `MajesticSEO Site Explorer` ([`www.majesticseo.com`](http://www.majesticseo.com))
    根据名为“信任流”（Trust Flow）和“引用流”（Citation Flow）的测量来评估网站。

    - **流量？**——确定一个网站接收多少流量很难，但对于确定发布的指向信息图的链接的潜在范围非常有帮助。因为网站流量不是公开信息，少数网站拥有可以估计网站流量的工具，例如
    `Quantcast` ([`www.quantcast.com`](http://www.quantcast.com)) 和 `Compete` ([`www.compete.com`](http://www.compete.com))。这些数字是估计值，但大致数字可能足够评估外联目标网站了。

    - **粉丝？**——确定一个网站接收多少流量比较困难，但对于确定发布的指向信息图的链接的潜在范围非常有帮助。因为网站流量不是公开信息，少数网站拥有可以估计网站流量的工具，例如
    `Quantcast` ([`www.quantcast.com`](http://www.quantcast.com)) 和 `Compete` ([`www.compete.com`](http://www.compete.com))。这些数字是估计值，但大致数字可能足够评估外联目标网站了。

    - **信息图？**——浏览或搜索网站查看他们以前是否发布过外部网页的信息图。有些网站只发布自己的内容，所以了解博客是否开放接受外部来源的好信息图是好的。


