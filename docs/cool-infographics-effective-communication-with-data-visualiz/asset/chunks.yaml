  trans: '


    看到有许多公司将新的信息图发布在网上，然后只是等人们来发现它，这令人感到失望。许多公司会花费大量的时间资源来研究数据并设计良好的信息图，但随后选择不在营销或推广这些信息图上投入任何精力。信息图是内容形式，需要与文章、视频、广告甚至产品同等的营销支持。


    在公司发布信息图之前，它应该仔细考虑一个全面的`Infographic Release Strategy`（信息图发布策略）来推广该信息图。当你准备好了一个良好的信息图设计并发布时，你希望确保从该信息图中获得的收益最大化。


    以下是信息图发布过程中的三个关键步骤：


    1. 落地页

    2. 自我推广

    3. 拓展与外联


    公司不需要执行所有这些步骤，但投入到推广中的努力可以显著提高信息图发布的成功率。这些活动大部分只是公司层面的精力投入，并不需要大量的额外费用。


    ## 落地页


    需要解决的第一个问题是：“你应该在哪里发布信息图？”信息图可以通过百种不同的方式发布在网上，但其中许多方法并不有效。你应该将信息图托管在自己的网站上、你的`Flickr`
    页面、作为 `Facebook` 中的照片、作为另一个网站的客座文章、发布在信息图库网站上，还是在博客文章中？答案取决于公司对该信息图项目的目标。通常，公司希望吸引链接和访问者进入其网站。在这种情况下，公司应该在自己的网站内创建一个专门的信息图落地页。这样，它就位于公司控制的站点上，且不依赖于任何外部公司或服务。此外，在自己的专用页面上发布和托管信息图可以获得链接和页面访问的所有收益，同时保持对页面内容完全的控制权。


    落地页应该有一个短而简单的 URL，它可以作为指向信息图链接的清晰目标。通过将所有流量和链接指向一个专门的落地页，它在搜索引擎排名中获得高分的机会最大，而不是将链接分散在多个位置。此外，许多人会通过输入网页地址来寻找信息图，因此简短的
    URL 可能非常重要。长而复杂的 URL 可能会令游客。


    但也有例外。如果目标是为公司的`Facebook Fan Page`建立受众，开发信息图并作为新的图像内容发布在`Facebook` 上是完全可以的。链接将把新用户带到公司的
    `Facebook` 页面并吸引新粉丝。


    ### 图像问题


    当涉及到信息图时，问题在于：`Figure 3-12` 显示了你的信息图在搜索引擎爬虫看来是什么样的。它只是页面上的一个图像资产，没有任何内容，因为在网站上爬取内容的网页爬虫无法判断图像或信息图中包含了什么。它们无法确定你的主题、关键词、数据源、核心传达或任何相关信息。由于没有文本可供收集和解析，爬虫没有东西可以发送回搜索引擎索引。


    ![c03f012.tif](img/c03f012.png)


    **图 3-12：**搜索引擎在网页上看到的只是空白的图像资产。


    搜索引擎已经开始实验使用人脸识别、光学字符识别（`OCR`）和类似的图像搜索软件为图像添加上下文，但这些工具并不有效。这取决于信息图发布者通过在页面上添加文本（包括可见和隐藏的文本）来告诉搜索引擎关于信息图的所有信息。在线托管原始全尺寸信息图的专用
    HTML 网页被称为信息图落地页。你需要在页面上添加文本描述内容，并使用你希望与信息图关联的关键词。文本决定了信息图的上下文和相关性，它也是搜索引擎真正了解在向用户显示搜索结果时何时显示指向信息图链接的唯一方法。


    信息图落地页上应该包含许多重要的页面元素。为了这个目的，请想象正在发布一个名为`SEO Strategies Used by the Experts`的虚构信息图。这个信息图在今天的互联网上并不以信息图的形式存在，但未来可能存在。为了这个例子，还请假设这是一个设计良好的信息图，它讲述了一个视觉上具有吸引力的故事，人们会想要分享。这可能是一个很大的假设，但如果你从一个糟糕的设计开始，那么支持信息图发布的大部分努力将不会产生太大影响。


    ### 关键词


    任何 SEO 策略的基石都是关注一组简短的关键词。关键词可以定义为人们在搜索有关特定主题的信息时，在搜索查询中输入的常用单词。根据行业、产品、服务以及每家公司提供的信息的不同，不同的公司网站存在不同的关键词——甚至每个公司网站的不同页面也有不同的关键词。


    公司希望确保其网站页面被搜索引擎认为具有高度的可信度，并且与其业务相关的词汇具有相关性。作为一个非常简单的例子，Nike 希望在 `shoes` 和 `footwear`
    等关键词上具有相关性，而福特希望在 `cars` 和 `trucks` 等关键词上具有相关性。


    理解人们在搜索时实际使用的关键词是非常重要的。如果一家汽车经销商使用“pre-owned car”（二手车）一词创建内容，他们的内容可能不会出现在搜索更常用词汇“used
    car”（旧车）的人的结果中。有时，搜索引擎会理解这两个术语是相关的，但很多时候并不会。应该提前进行研究以确定寻找类似内容的最流行的术语。


    在发布信息图时，创建一个简短、特定的你希望信息图关联的目标关键词列表非常有帮助，然后在落地页上一致地使用这些关键词。对于你的虚构信息图，关键词列表可能如下：


    1. `SEO`

    2. `Search`

    3. `Experts`

    4. `Strategies`

    5. `Marketing`


    这个虚构的信息图示例是简单的单一关键词，但你也可以推广多词关键词组。


    ### 落地页 URL


    搜索引擎会将你网站上信息图落地页 URL 中使用的单词视为寻找相关关键词的潜在位置。因此，最好的 URL 使用自然且便于搜索引擎解析的单词，并用连字符（破折号）分隔单词以清晰地将其分开，因为
    URL 地址中不允许出现空格。


    Google 公承认它将连字符视为单词分隔符，而将下划线视为单词连接符。除非你故意想要组合单词，否则不要使用下划线。如果你使用下划线来分隔如 `SEO_Experts`
    的单词，搜索引擎索引会将这些单词组合为一个单词 `SEOExperts`。因此，你的落地页 URL 看起来应该这样：


    [`http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml`](http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml)


    保持 URL 越短越好，因为有些读者通过输入地址找到你的信息图。


    ### 标题标签


