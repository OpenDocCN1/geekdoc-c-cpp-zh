    \nRelevance is a search engine’s holy grail. People want results that are closely\
    \ connected to their queries.\n\n—MARC OSTROFSKY, *GET RICH CLICK!*\n\n# 3\n\n\
    \ Infographics and SEO\n\nNormally, the objective of an online infographic design\
    \ project is to increase traffic and links to the company website. The company\
    \ that publishes an infographic wants to build the awareness and equity of its\
    \ brand (or product) and increase its position in search engine results related\
    \ to its business.\n\nThis is the realm of Search Engine Optimization (SEO) strategies,\
    \ and in the last few years infographics have become a powerful content tool for\
    \ companies to employ that encourages site links and increases their overall site\
    \ relevance. When a company publishes an engaging, well-designed infographic on\
    \ its site, many people post it on their own sites with links back to the company\
    \ and share it within social media with their own networks of friends and followers.\n\
    \nSearch engines calculate a score for a web page’s credibility and authority\
    \ as one way to quantify its relevance to specific keywords. They use complex,\
    \ proprietary algorithms that use many different signals. Some of these classify\
    \ for relevance, others for quality of content, and others for overall importance\
    \ on the Internet. One of the most famous is the Google PageRank classifier, which\
    \ considers both the number and quality of links pointing at a page to determine\
    \ its standing. All of these combine together to determine the search engine rank\
    \ score of a web page for a specific search.\n\nThe higher a specific company’s\
    \ website page scores for a particular search, the higher the search engine rank\
    \ score of that page.\n\n## The Search Engine Challenge\n\nSearch engines are\
    \ in business, too, and they need to provide a valuable service to their customers\
    \ to keep them coming back. If you perform a search and the results aren’t close\
    \ to what you are looking for, that reflects poorly on the search engines’ brand.\n\
    \nProducing the search results that you rely on (and take for granted) is an incredibly\
    \ tough technical problem. Each search engine company (Google, Microsoft Bing,\
    \ and so on) has its own spiders crawling all these pages on the web to parse\
    \ both the text and the links from every page. They create their own massive index\
    \ of the Internet and then query the index to provide the search users with a\
    \ clean list of relevant results.\n"
