    To demonstrate, [Figure 4-20](#c04.xhtml_figure4-20) and [Figure 4-21](#c04.xhtml_figure4-21)
    show Kevin Burton’s infographic resume as it was originally designed and desaturated
    to show what it would be like when printed in only black and white. All the company
    logos had already been converted to black and white in the original version, so
    those translate perfectly. The parts of the design that do have the blue colors
    convert to grayscale nicely and remain easy to read and understand when the color
    is removed.


    ![c04f020.tif](image_fi/582305c04/c04f020.png)


    [**FIGURE 4-20:**](#c04.xhtml_figureanchor4-20) Original infographic resume—Kevin
    Burton


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-20`](#c04.xhtml_figureanchor4-20)


    ![c04f021.tif](image_fi/582305c04/c04f021.png)


    [**FIGURE 4-21:**](#c04.xhtml_figureanchor4-21) Black-and-white-only version—Kevin
    Burton


    By using a lot of grayscale elements in the original design, this infographic
    resume works nicely when printed without the color. Kevin doesn’t need to worry
    about how his resume will appear when printed on a variety of different printers.
    It will always come out well.


    Jack Hagley took this idea one step further with his simplified, black-and-white
    resume design. He designed his infographic resume ([Figure 4-22](#c04.xhtml_figure4-22))
    with five objectives in mind:


    ![c04f022.tif](image_fi/582305c04/c04f022.png)


    [**FIGURE 4-22:**](#c04.xhtml_figureanchor4-22) Infographic resume—Jack Hagley


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-22`](#c04.xhtml_figureanchor4-22)


    *   To be completely black and white, so that it always looked the same when printed

    *   To minimize the file size to make it easy to e-mail and download

    *   To use as little ink as possible when printed out by clients

    *   To be visually distinctive

    *   To contain a large amount of information


    An infographic resume needs to be easily printed by a recruiter or hiring manager.
    Although many infographic designs look great online with dark background colors,
    that style makes an infographic resume hard to print. Even if they have a color
    printer available, many recruiters will avoid printing out a resume with a black
    background for fear of how much printer ink or toner it would use.


    ### Infographic Resumes on the iPad (or Tablet)


    Another fantastic use of an infographic resume is Dave Rodgerson’s infographic
    resume designed to be shown and shared on an iPad ([Figure 4-23](#c04.xhtml_figure4-23)).
    The proportions of the iPad’s screen (7.75″ × 5.82″) are smaller than a standard
    letter-size page of paper, so the design had to be simplified even further to
    make sure the text was legible on the small screen. Think of this as a mini-resume
    or an Infographic Elevator Pitch.


    ![c04f023.tif](image_fi/582305c04/c04f023.png)


    [**FIGURE 4-23:**](#c04.xhtml_figureanchor4-23) Infographic elevator pitch—Dave
    Rodgerson


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-23`](#c04.xhtml_figureanchor4-23)


    In this design, most of the text has been removed. Icons and logos tell most of
    the story about Dave—his employers, his major clients, his education, and his
    professional associations. The network map of his connections on LinkedIn show
    Dave’s connections within the color-coded industries without needing to show the
    names of all his connections. The word cloud is created from his social media
    account on mirror.me (`mirror.me`](http://mirror.me)) and shows what topics Dave
    is most often interested in and posting about online. Visually, the potential
    employer or client can learn a lot about Dave in just a few seconds.


    The design is best formatted as a PDF file to be cross-platform and cross-device
    compatible. That means it can be viewed on the iPad using the Apple iBooks app,
    or even from within an e-mail message if it has been sent to someone. No requirement
    to install an extra app from a third-party is necessary. Using the built-in functions
    of the iPad, the two-finger pinch gesture can zoom in and zoom out of the design
    while showing it to someone.


    The secondary benefit of the PDF format is that all the HTML links included in
    the PDF file are functional. Each of the company logos and icons are tappable
    (or clickable) links. Dave didn’t need to include the text of his e-mail address
    because anyone can tap the e-mail icon and it automatically opens up a new message
    in the default e-mail application properly addressed to him. The LinkedIn icon,
    if tapped, opens up his LinkedIn profile in the default web browser.


    While Dave is showing his resume to someone in person, he can also e-mail it instantly
    to them by tapping the Share icon in the app.


    ### Infographic Design Tools


    So, you want to try designing your own? You don’t have to be a graphic designer.
    The job candidate should always start with one of the design templates, and then
    customize the design using the available options to make their resume visually
    unique.


    #### re.vu


    ![c04uf001.tif](image_fi/582305c04/c04uf001.png)


    re.vu enables users to upload example files or portfolio images of their work
    to be included in the resume design. Figure 4-24](#c04.xhtml_figure4-24) shows
    re.vu CEO, Stephen Years’ infographic resume from the website.


    ![c04f024.tif](image_fi/582305c04/c04f024.png)


    [**FIGURE 4-24:**](#c04.xhtml_figureanchor4-24) re.vu designed infographic resume—CEO
    Stephen Years


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-24`](#c04.xhtml_figureanchor4-24)


    Recognizing that many recruiters and hiring managers will still want to see your
    text resume, re.vu also enables you to upload your traditional resume to make
    it available for download from your custom infographic resume page.


    #### Kinzaa.com


    ![c04uf002.tif](image_fi/582305c04/c04uf002.png)


    Kinzaa.com adds sections where the candidate can input data to include their desired
    company personality, work environment, preferred neighborhoods, and expected benefits
    to help match the candidate with the right company. Blogger Erica Swallow’s resume
    ([Figure 4-25](#c04.xhtml_figure4-25)) is used on the site to demonstrate an example
    resume.


    ![c04f025.tif](image_fi/582305c04/c04f025.png)

