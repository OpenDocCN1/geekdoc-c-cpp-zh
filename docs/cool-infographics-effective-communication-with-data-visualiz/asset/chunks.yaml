    # 图 4-25: (#c04.xhtml_figureanchor4-25) Kinzaa.com 信息图化简历——Erica Swallow


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图-4-25`](#c04.xhtml_figureanchor4-25)


    ### Vizualize.me


    ![c04uf003.tif](img/c04uf003.png)


    连接 LinkedIn 账户后，`visualize.me` 将根据其能从个人资料中提取的信息创建一份初始简历。一旦创建了初始图化简历，用户就可以编辑个人资料信息，从多个主题中进行选择，并编辑设计选项，如颜色、背景、字体、布局等。联合创始人
    Kenneth Lee 的简历如图 4-26 所示所示。


    ![c04f026.tif](img/c04f026.png)


    # 图 4-26: (#c04.xhtml_figureanchor4-26) Vizualize.me 信息图化简历——Kenneth Lee


    最终的信息图简历设计可以使用用户定义的自定义 URL 查看。该 URL 或 `visualize.me` 按钮可以在社交网络中分享。最终简历还可以下载为 PDF
    文件以便打印和电子邮件。`visualize.me` 的一个独特功能是统计页面，它可以显示访问简历页面的访问流量数字。


    ### ResumUP.com


    ![c04uf004.tif](img/c04uf004.png)


    `ResumUP` 有一个适用于所有用户的设计模板，你可以在图 4-27 中看到它。使用 LinkedIn 账户登录，`ResumUP` 将导入数据以创建初始简历。用户可以控制编辑显示的信息，并添加关于他们正在寻找的职位类型和公司的信息。最终简历可以通过自定义
    URL 在线查看，或下载为 PDF 文件。


    ![c04f027.tif](img/c04f027.png)


    # 图 4-27: (#c04.xhtml_figureanchor4-27) ResumUP.com 信息图化简历——Bob Smith 示例


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图-4-27`](#c04.xhtml_figureanchor4-27)


    ### Cvgram.me


    任何人都可以使用 LinkedIn 或 Facebook 登录 `cvgram.me`。根据登录使用的哪种类型的账户，`cvgram` 将根据用户个人资料中的可用信息创建信息图化简历。如图
    4-28 所示，一旦创建了初始简历，用户就可以编辑他们的信息以及许多设计选项（主题、颜色、字体等）。为每个用户都会创建一个自定义 URL，以便其与他人公开分享简历。由于该服务用于在线分享，因此没有下载信息图化简历的选项。


    ![c04f028.tif](img/c04f028.png)


    # 图 4-28: (#c04.xhtml_figureanchor4-28) cvgram.me 信息图化简历生成器


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图-4-28`](#c04.xhtml_figureanchor4-28)


    ### Shine


    ![c04uf006.tif](img/c04uf006.png)


    iTunes 商店最近发布了一款新的 iPad 应用，它将引导用户完成生成信息图化简历的过程。由 Boluga 开发的 `Shine` 应用（图 29）免费下载，并包含一个完整的简历模板。可以通过内购获得更多的设计模板和功能。一旦创建了简历，用户就可以从
    iPad 直接发送电子邮件、共享并打印副本，`Shine` 创建的 PDF 文件是完全可文本搜索的。


    ![c04f029.tif](img/c04f029.png)


    # 图 4-29: (#c04.xhtml_figureanchor4-29) Shine 是一个可以创建个人信息图化简历的 iPad 应用


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图-4-29`](#c04.xhtml_figureanchor4-29)


    此外，你可以使用第 7 章“设计资源”中列出的任何信息图设计资源来创建用于信息图简历的各种类型可视化。通过这些工具创建的可视化可以作为整体设计的一个组件插入到你的信息图简历中。你可以从
    `InMaps`（[`inmaps.linkedinlabs.com`](http://inmaps.linkedinlabs.com)）查看我自己的网络图（图
    30）。`InMaps` 是一个在线工具，值得在本章中提到，因为它展示了用户与特定行业内人士的连接，而无需显示这些人士的真实姓名。这种网络图的视觉化展示了候选人与行业内人士的联系程度和参与度。


    ![c04f030.tif](img/c04f030.png)


    # 图 4-30: (#c04.xhtml_figureanchor4-30) LinkedIn 网络图


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图-4-30`](#c04.xhtml_figureanchor4-30)


    这些网络图旨在向读者展示候选人与行业内人士的连接情况，无需显示这些人士的真实姓名。这是一种可视化元素，展示了候选人与专业人士的联系程度。


