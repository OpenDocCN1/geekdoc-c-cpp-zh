    [FIGURE 6-11:](#c06.xhtml_figureanchor6-11) PowerPoint automatically creates a
    chart legend by default.


    You should do a lot more to improve this chart design before including it in an
    infographic design, but this example will only focus on eliminating the chart
    legend. [Figure 6-12](#c06.xhtml_figure6-12) deletes the chart legend, and in
    its place you can see added icons and descriptions directly on the chart. This
    makes the color-coding much faster to understand because the reader can identify
    each data set with minimal eye motions. All the relevant information is within
    the reader’s field of view, and the icons are also faster to understand than reading
    the text labels. As an additional benefit, the elimination of the chart legend
    also opens up more space on the page, so the chart can be increased in size or
    make room for additional information.


    ![c06f012.tif](image_fi/582305c06/c06f012.png)


    [FIGURE 6-12:](#c06.xhtml_figureanchor6-12) PowerPoint chart with icons embedded
    into the chart to eliminate the chart legend


    These types of design changes require some extra effort on the part of the chart
    designer. Adding separate text blocks or data labels is fairly easy within PowerPoint,
    but the icons are a little more difficult. Icons like these are not available
    natively from within PowerPoint, so designers must create or purchase their own.
    Then they can be placed manually to appear on top of the chart object in PowerPoint
    or whatever design program is used to put the infographic together. You can use
    stock vector art in infographics designs, and these particular icons were part
    of a set purchased from iStockPhoto^([3]).


    ## Be Data Transparent


    To be data transparent, the infographic needs to address the sources of the data
    included in the design in an open and honest manner. A large portion of the audience
    is initially going to be skeptical, so the design needs to get past the data integrity
    issue quickly. After you get the audience past the data believability issue, it
    can focus and engage mentally with the overall message the infographic is communicating.


    Readers are initially looking to answer a handful of questions:


    *   Where does the data come from?

    *   How old is the data?

    *   Why should I believe the data?

    *   Is the infographic credible?


    Credibility plays a huge part in the success of an infographic, both online and
    internal to companies. Readers won’t share the infographic in social networks
    if they think the information is questionable.


    Ignore data transparency at your own risk, and understand that designs that disregard
    data transparency are seen as not believable. Following are a few common mistakes
    made by infographic designers.


    ### No Data Sources List


    Surprisingly, a large number of infographics don’t include any mention of where
    the data originated from. With no data sources to judge the credibility of an
    infographic, the readers quickly move from skeptics to unbelievers. As far as
    the audience can tell, the designer may have made up the numbers.


    A frequent consequence of not listing any data sources in an infographic design
    is that all the comments, posts, and conversations about the infographic tend
    to focus on the unknown source of data. Accusations of false numbers, deception,
    and misleading information are quite common when this happens. This completely
    distracts the audience from the actual content of the infographic, and the infographic
    fails to inform readers or inspire conversation about its key message.


    Obviously, this is not the outcome wanted by a company that has spent a lot of
    time and resources to create and publish the infographic.


    ### Vague Data Sources


    Almost as bad as not listing any data sources is listing vague sources of data
    that make it almost impossible for readers to find the cited numbers. Vague data
    sources are usually just the name of the host site that published the data, with
    no additional information about a specific report or article.


    For example, an infographic about baby names in the United States might list a
    vague data source as only `Data.gov`. If readers want to see the original data,
    they would have to perform their own search within the referenced website in an
    attempt to find any data related to baby names. In addition, many sites do not
    have effective search functions. If the readers find any related information,
    they couldn’t tell which specific data was used to support the infographic.


    Sometimes, this method of listing vague data sources is used intentionally to
    leverage the existing credibility of the data source organizations without actually
    revealing the original data specifically.


    An infographic design about household pets might cite `The Humane Society` as
    the source of the data used. Readers would have no recourse to find the original
    data. Was the data gathered from a printed flyer, a news article, a magazine,
    mentioned at a live event, or is it available on the website? The skeptical audience
    has no way of validating that the data actually came from `The Humane Society`,
    but many readers might believe the infographic simply because they believe `The
    Humane Society` is a credible organization.


    ### Questionable Data Sources


    The truth is that many, if not most, readers won’t take the time or make the effort
    to check your data sources. The fact that the infographic has any sources listed
    at all is often good enough for many, many readers. The vast majority of readers
    are not going to follow the links and validate that the infographic designer interpreted
    the original data correctly. Similar to news articles, the readers are relying
    on their belief that the designer, author, or publishing company made sure the
    information was credible. The company publishing an infographic may also have
    an established credibility with the audience. If readers trust a specific company,
    they will probably trust an infographic published by that company.


    However, there are some specific data sources that can automatically trigger a
    reader’s skepticism. For many, `Wikipedia` and other blogs fall into this category
    even though the quality of content on `Wikipedia` has improved dramatically over
    the last few years. Honestly, there’s nothing wrong with discovering data on `Wikipedia`,
    but your infographic will be much more credible if you use the reference links
    to track down the original source of the data to list as the citation in the infographic.


    Any sites that aren’t intended to be taken seriously are also regarded as questionable
    sources of data. Sites that focus on humorous content or personal blogs are not
    generally perceived as credible data sources.


    ### Best Practices


    An infographic design that is upfront about its data sources is instantly perceived
    to be more credible. There are a few best practices that are common to good infographics.


    *   Track down and cite the original source of the data, not the news article
    that quoted the data.

    *   List the data source references either inline with the data or in the footer
    at the bottom of the infographic.

    *   List the URL to the specific report or data set, not just the host site.

    *   Include the relevant date or year the data was published to establish relevancy.


    In addition, one of the best practices is for an infographic author to make the
    source data available to readers online for download as a spreadsheet. This is
    often accomplished with `Google Docs spreadsheets`^([4]) that are accessible to
    the public. The infographic would include the URL directly to the data spreadsheet,
    which lists the data and shows any relevant sources or calculations made as part
    of the design. Readers can access the data directly and even use the data on their
    own.


    ## The Fine Print

