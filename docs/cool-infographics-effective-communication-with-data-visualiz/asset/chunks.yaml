    ## Improving Internal Communications


    Charts and graphs from Office products (mainly `Excel` and `PowerPoint`) have
    become the standard way to share corporate data, but they are used so often that
    they are no longer unique and memorable to the audience.


    An employee might sit through multiple `PowerPoint` presentations in the same
    day that all use the same template. In fact, a given company might provide the
    same custom branded `PowerPoint` template to all its employees to use. In a sense,
    the company is dictating that all its presentations look the same, which has the
    counterproductive effect of making them harder to remember.


    A research report can have more than 100 charts of the gathered data, all of them
    using the same design style and the same colors. How is an employee expected to
    remember any of the specific details when all the charts look the same?


    The problem continues to get worse each day as the amount of information a company
    possesses continues to grow and accumulate. Effectively sharing that information
    internally and making it useful to employees is becoming both more important and
    more difficult at the same time.


    Companies can leverage the power of infographics and data visualization design
    as a more effective form of internal communication. However, it does take a bit
    of extra work to design a unique visualization or an infographic for each set
    of data. Sometimes it involves an infographic designer, but most of the time employees
    that have no training in design create these charts and graphs on their own. With
    reduced workforces and budget cuts, employees are usually expected to design their
    own presentations and reports.


    The formats for publishing infographics within a company are also different. The
    tall format (`Chapter 2`, “Online Infographics”) you see most often with infographics
    published online doesn’t work well within the internal communication channels
    of a company. Usually, internal infographics are printed posters, presentation
    slides, printed handouts, PDF files, e-mail, or intranet sites.


    ## The Fear of Confidential Information

