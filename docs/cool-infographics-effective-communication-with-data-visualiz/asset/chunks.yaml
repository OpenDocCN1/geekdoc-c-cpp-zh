    缩放界面通常通过从一个静态设计的大型图像文件开始，然后将界面控件作为网页的一部分添加。使用 `HTML5` 和 `JavaScript` 等自定义网页代码可以创建用户界面，但像微软的
    `Zoom.it`（[zoom.it/](http://zoom.it/))）这样的在线服务可以让任何人通过在线可用图像链接创建一个交互式的、可缩放的图像界面。


    图 1-28 展示了巨大的信息图设计，由密歇根州立大学的 Phillip H. Howard 副教授及其妻子 Ginger Ogilvie 创作的《2010
    年啤酒品牌与品种所有权》（Ownership of Beer Brands and Varieties）。该设计是各母公司拥有的多种啤酒的大型可视化。在屏幕或页面上整体查看时，大部分文本是无法阅读的。


    ![c01f028.tif](img/c01f028.png)


    图 1-28： 大型海报尺寸的信息图设计非常适合缩放界面


    [`coolinfographics.com/Figure-1-28`](http://coolinfographics.com/Figure-1-28)


    *来源：*《2010 年啤酒品牌与品种所有权*，Phillip H. Howard 和 Ginger Ogilvie*


    然而，通过使用 `Zoom.it` 工具，他们创建了你在图 1-29 中看到的缩放界面。读者可以使用鼠标或右下角的控件导航设计。带有缩放界面的设计可以在所有浏览器中查看，甚至嵌入到其他网站进行共享。


    ![c01f029.tif](img/c01f029.png)


    图 1-29： Zoom.it 界面工具中的啤酒所有权信息图


    [`coolinfographics.com/Figure-1-29`](http://coolinfographics.com/Figure-1-29)


    *来源：*《2010 年啤酒品牌与品种所有权*，Phillip H.Howard 和 Ginger Ogilvie*


    使用缩放界面的主要优势是，它让读者在深入细节之前，无需任何滚动即可在屏幕上看到整个设计。从大局开始，读者可以更好地理解细节是如何融入整体故事的并获取背景。


    ### 可点击信息图


    点击式信息图通过通过 `HTML` 链接使设计的特定区域可点击，从而为静态信息图设计添加了用户界面层。这种界面通常被创建为 `HTML` 图像映射（Image
    Map），由网络浏览器解释，通过像素位置识别静态图像的特定区域并将其作为可点击的 URL 地址。设计师利用可点击设计的优势，从主信息图设计中移除次要信息和额外细节。


    设计师可以使用点击式信息图作为一种方法，保持原始信息图整洁且易读。想要更多信息的读者可以通过点击链接深入探索，但主信息图仍然保持简单易懂。


    在打印页面上展示这种工作原理稍微有点困难，如图 1-30 所示。在这个 2011 年的设计中，VinTank 的《最有前景的 26 款葡萄酒应用》列表显示在一个按类别分组的可视化图表中。每个
    `iOS` 应用图标在点击时都会将读者带到 `iTunes App Store` 中的相应页面。这通过消除在文中列出所有 URL 地址的需求，保持了设计的整洁简单。


    ![c01f030.tif](img/c01f030.png)


    图 1-30： 此信息图中的每个图标都是独立的 `HTML` 链接


    [`coolinfographics.com/Figure-1-30`](http://coolinfographics.com/Figure-1-30)


    *来源：VinTank App Spectrum*


    这种设计风格的变体是弹出式信息图风格。读者不是通过点击信息图的不同区域来访问额外信息，而是当读者将鼠标指针悬停在设计的不同区域时，次要信息就会出现。


    《生巧克力历史》（A Raw Chocolate History）是一张信息图时间线。图 1-31 中的主要设计是一个带有插图的简单圆形时间线，但当读者悬停在任何插图上时，特定于该时期的次要信息就会出现（图
    1-32），在不使原始设计拥挤的情况下为读者提供额外信息。


    ![c01f031.tif](img/c01f031.png)


    图 1-31： 使用弹出信息可以保持原始设计的整洁


    [`coolinfographics.com/Figure-1-31`](http://coolinfographics.com/Figure-1-31)


    *来源：*《生巧克力历史》，The Chocolution.com*


    ![c01f032.tif](img/c01f032.png)


    图 1-32： 弹出信息


    这种设计风格的另一种变体是弹出式信息图风格。读者不是通过点击信息图的不同区域来访问额外信息，而是当读者将鼠标指针悬停在设计的不同区域时，次要信息就会出现。《*生巧克力历史》是一张信息图时间线。图
    1-31 中的主要设计是一个带有插图的简单圆形时间线，但当读者悬停在任何插图上时，特定于该时期的次要信息就会出现（图 1-32），在不使原始设计拥挤的情况下为读者提供额外信息。（注：原文中存在大量重复段落已按要求去重）


