    ## What Makes an Infographic Cool?


    I’ve been asked by a lot of different people, “What makes an infographic cool?”
    Over the years, I’ve selected hundreds of designs to post on the Cool Infographics
    site, out of the thousands of infographics published online. Is there some magic
    formula for what makes an infographic cool? How does one infographic design get
    chosen as “cool” when others don’t?


    Like anything judged to be “cool,” the criteria are a moving target and the topic
    of much debate. Opinions about what makes an infographic cool are quite varied.
    In 2013, I invited a number of experts in data visualization and infographics
    design to weigh in on this question with guest posts on `CoolInfographics.com`.
    Here’s what a few of them said:


    > What makes infographics cool is that they can be extremely effective at explaining
    every conceivable topic in any industry for any reason.


    —Karl Gude, spearheads the first information graphics program at Michigan State
    University’s School of Journalism and is the former Director of Information Graphics
    at Newsweek magazine and The Associated Press


    > “Cool” infographics effectively build links, drive social shares, and create
    buzz in a unique way.


    —Matt Siltala, President of Avalaunch Media


    > To create a powerful infographic, save the big graphics and clever images. Dig
    into the information and find the story that means something to us all.


    —Dean Meyers, Visual Problem-Solver


    > An infographic is “cool” when it presents an important and complex story and
    does so with integrity and good looks.


    —Nathaniel Pearlman, Founder of Graphicacy and Timeplots


    You can find the complete guest posts and much more at: `coolinfographics.com/blog/tag/cool`


    My own short answer is, “I know it when I see it.” My long answer is that a cool
    design will be a combination of the following aspects:


    * Engaging topic

    * New, surprising information

    * Visually appealing and distinctive

    * Simple, focused message

    * Quick and easy to read

    * Easy to share

    * Clear, easy to understand data visualizations

    * Credible data sources


    This book shares more than 100 examples of cool infographics from designers all
    over the world that got many of these aspects right. These designs were chosen
    to be representative of the thousands of cool infographics available online.


    ## Viewing the Infographics


    Most of the infographic designs I’ve included in the book are actually better
    when viewed online. Many of them had to be reduced in size to fit on these pages,
    because it’s important for you to see the scale of the entire infographic designs
    instead of just pieces. I have created a close-up portion of many of the designs
    to demonstrate a particular point or to make some of the text readable.


    For all the example designs that are available online, I have included a link
    to the original source so that you can see the full-size original version online,
    the way the designer intended. However, many of the URLs are long and difficult
    to type into your browser.


    The other challenge I faced is that over time links break. Sites go down or move
    to new domain names, but when the URLs are printed in the book, they are permanent.
    I wanted to ensure that many years from now you could still view the full-size
    versions online. So I have created a shortcut URL for each of the online examples
    that I control. If any of the websites move the infographics to a new link address,
    I will change the destination of this shortcut URL to redirect to the new address.


    For each of the figures available online, there are four ways you can get to the
    original infographics:


    * The complete original URLs for online infographics are listed at the end of
    each chapter.

    * I have created a simple shortcut URL for each online infographic using the `coolinfographics.com`
    domain that will take you to the original page online.

    * All the links are listed by chapter on a page at `www.wiley.com/go/coolinfographics`.
    From that page, you can simply click the links instead of typing them in.

    * All the clickable links are also listed by chapter on a page at `coolinfographics.com/figures`.


    ## Join the Conversation


    The ideas and strategies behind data visualizations and infographics are continuing
    to evolve and change every day. Cool infographics from three years ago might not
    be considered “cool” today. As new tools and technologies become available to
    designers, you can expect to see new innovations in infographics design and distribution.


    I encourage you to follow along and add your voice.


    1. Cool Infographics blog: `CoolInfographics.com`

    2. Twitter: `@rtkrum`

    3. Facebook: `facebook.com/rtkrum`

    4. Google+: `gplus.to/rtkrum`

    5. LinkedIn: `linkedin.com/in/rtkrum`

    6. InfoNewt: `InfoNewt.com`


    # 1 The Science of Infographics


    ## Why do people love infographics?


    Humans have been drawing pictures to communicate with each other for thousands
    of years—from pictograms on cave walls to Egyptian hieroglyphics to ideograms
    on modern signs (`Figure 1-1`). People love using pictures to communicate and
    tell stories because it’s hardwired into the human brain.


    ![c01f001.tif](image_fi/582305c01/c01f001.png)


    **FIGURE 1-1:** Altamira bison cave painting, ancient Egyptian hieroglyphics,
    and modern signs.


    Infographics and data visualizations are all around us. We are surrounded by visual
    representations of information—charts, maps, icons, progress bars, signs, posters,
    diagrams, and online visuals (`Figure 1-2`). These are all examples of visual
    communication, but these are not all infographics.


    ![c01f002.tif](image_fi/582305c01/c01f002.png)


    **FIGURE 1-2:** Collage of infographics and data visualizations


    The word `infographic` is used by people to mean many different things. In many
    cases infographics and `data visualizations` are considered synonymous, but in
    the world of an infographic designer they mean different things.

