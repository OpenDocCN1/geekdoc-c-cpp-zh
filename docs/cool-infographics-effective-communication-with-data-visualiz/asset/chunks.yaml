  raw: 'Based on this principle, LinkedIn, the site dedicated to professional connections,
    has begun displaying company logos on everyone’s profile pages if it has one available
    from an official Company Page, as you can see from the author’s profile ([Figure
    4-12](#c04.xhtml_figure4-12)). When people add a company position to their personal
    work history in their LinkedIn account, if they choose a company that LinkedIn
    already recognizes, the official company logo displays on the individual’s profile
    page.


    ![c04f012.tif](image_fi/582305c04/c04f012.png)


    [**FIGURE 4-12:**](#c04.xhtml_figureanchor4-12) Company logos shown on LinkedIn
    profiles


    There are many posts and articles online about understanding the legal issues
    surrounding the use of trademarked company logos. Many people do not understand
    trademark law and especially the Fair Use doctrine. In a reference to a company,
    especially in a list of multiple companies, the Fair Use doctrine enables the
    use of a company’s trademark when referring to that company. More information
    about the Fair Use Doctrine is covered in [Chapter 2](#c02.xhtml), “Online Infographics,”
    but it’s worth repeating that trademark law is different across countries, so
    it’s worth understanding local laws.


    Sascha Kuntze used many company and brand logos in his infographic resume ([Figure
    4-13](#c04.xhtml_figure4-13)). In this design, the logos are used to represent
    past clients and also his social media presence. The reader is likely to recognize
    some of the mainstream logos included in this design, and the value of Sascha’s
    work is elevated based on his association with these respected companies.


    ![c04f013.tif](image_fi/582305c04/c04f013.png)


    [**FIGURE 4-13:**](#c04.xhtml_figureanchor4-13) Infographic resume using logos—Sascha
    Kuntze


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-13`](#c04.xhtml_figureanchor4-13)


    David P. Ingram’s use of logos in his resume ([Figure 4-14](#c04.xhtml_figure4-14))
    is also effective. The logos draw the eye and attention instantly and creates
    the first impression the resume leaves on the reader. For example, Sony is generally
    regarded as a company with a tremendously positive reputation, especially related
    to its training of high-quality employees. The first impression on a hiring manager
    reading his resume might be that David comes from a reputable company, so David’s
    resume is probably worth the extra time to read thoroughly.


    ![c04f014.tif](image_fi/582305c04/c04f014.png)


    [**FIGURE 4-14:**](#c04.xhtml_figureanchor4-14) Company logos on infographic resume—David
    Ingram


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-14`](#c04.xhtml_figureanchor4-14)


    As a hiring manager sorts through a pile of a hundred resumes, getting through
    that initial filter determining which resumes are worth serious consideration
    is a huge advantage for any job candidate.


    ### Software Application Logos


    Infographic resumes initially grew in popularity with a younger generation of
    graphic designers and social media managers. These roles require an expertise
    in multiple software applications and web services key to the job, and using the
    application icons is similar to using company logos. Many of the primary applications
    are instantly recognizable by their icons.


    Unlike company logos though, the software icons generally serve as a visual acknowledgment
    of the requirements for the job. The icons instantly show the hiring manager that
    the candidate has the software skills required for the open position, but doesn’t
    position him above any other candidates that also possess the required skills
    unless more information is added.


    Tina Chen’s resume ([Figure 4-15](#c04.xhtml_figure4-15)) displays the four different
    software application icons that she primarily uses for her design work to demonstrate
    proficiency in each of them. Her other information, like years of experience,
    foreign language fluency, and the overall design itself are what set Tina apart
    from other candidates.


    ![c04f015.tif](image_fi/582305c04/c04f015.png)


    [**FIGURE 4-15:**](#c04.xhtml_figureanchor4-15) Resume with Software Icons—Tina
    Chen


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-15`](#c04.xhtml_figureanchor4-15)


    Additional visuals, such as the relative experience designs mentioned earlier
    can be used in combination with the software icons to add information. In [Figure
    4-16](#c04.xhtml_figure4-16), Aníbal Maíz Cáceres’ infographic resume shows the
    software icons integrated into a relative experience bar chart that shows his
    varying proficiency level in each application. Aníbal also makes the resume available
    online in multiple languages (English, Spanish, and French), and the use of icons
    reduces the amount of text that needs to be translated for each version.


    ![c04f016.tif](image_fi/582305c04/c04f016.png)


    [**FIGURE 4-16:**](#c04.xhtml_figureanchor4-16) Infographic resume with software
    icons combined with a relative experience visualization—Aníbal Maíz Cáceres


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-16`](#c04.xhtml_figureanchor4-16)


    ## Using an Infographic Resume


    Because infographic resumes are still relatively uncommon in the job marketplace,
