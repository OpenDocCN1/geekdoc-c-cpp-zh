    ![c01f024.tif](image_fi/582305c01/c01f024.png)


    [**FIGURE 1-24:**](#c01.xhtml_figureanchor1-24) *Voice is King*, Static infographic
    example


    [`coolinfographics.com/Figure-1-24`](http://coolinfographics.com/Figure-1-24)


    *Source:* Voice is King*, Nuance Communications, 2012*


    Static infographics are also the easiest format to share online. No special applications
    or browser add-on extensions are required. Static images have a long history as
    part of web design and are easy to post and control in web design packages. After
