- fmt: '

    The online revolution has created a new, additional definition of the word infographics
    for the Internet age. Mostly used for the marketing purposes of companies, online
    designs have become a new definition of what is an infographic. These new infographics
    are a complete story or article designed into a single image by combining text,
    images, illustrations, and data visualizations. Published as standalone images,
    they provide a visually engaging story in a self-contained package, usually an
    image file. The tools to share photos and images online were already strong, and
    these new infographics have taken full advantage of those tools to make sharing
    easy and popular.


    In the last two years, the Internet has matured to a point at which people are
    now using it every day as their primary source of news and information. Photos,
    illustrations, and charts have always improved the readership of stories in print
    publications by adding a visual element, and that phenomenon is even stronger
    online. At the same time, online tools such as `Tumblr`, `Flickr`, `Blogger`,
    and `WordPress` have helped personal publishing become mainstream. People using
    these online publishing tools to create their own sites and blogs have quickly
    learned the same lesson: Visuals help drive traffic and engagement, and infographics
    are often more effective than images alone.


    ## Vertical Versus Horizontal Layouts


    The tall infographic format shown in [Figure 2-1](#c02.xhtml_figure2-1) is a perfect
    example of this new type of online infographic. The `Mobile Youth: Teens & Cell
    Phones` design was published online by `PrepaidPhones.com` and is laid out in
    a sequential order that leads the reader through the information from top to bottom
    in five sections. This creates a tall design, and most infographics online follow
    this same format.


    ![c02f001.tif](image_fi/582305c02/c02f001.png)


    [**FIGURE 2-1:**](#c02.xhtml_figureanchor2-1) An example of a tall format infographic


    [`coolinfographics.com/`](http://coolinfographics.com/Figure-2-1)[`Figure-2-1`](#c02.xhtml_figure2-1)


    Source: *Teens & Cell Phones*, `PrepaidPhones.com`


    This design format is referred to in a number of different ways, such as a tall,
    long, or tower infographic design. From a design and web interface perspective,
    the aspect ratio of the tall format has some distinct advantages. The technology
    built into a computer mouse makes it easier for the computer user to scroll up
    and down with a simple flick of the finger, but more difficult to scroll side
    to side.


    More important, most site layouts are designed to allow easy vertical scrolling,
    but not horizontal. Websites generally fit the width of a browser window without
    the need for scrolling sideways and have content that runs down past the bottom
    of the window. Users already expect downward scrolling to reveal the rest of the
    site content. Images that are too tall to display on the screen disappear off
    the bottom of the browser window, and users know they can scroll down to see the
    rest of the image.


    As a general rule of thumb, the original full-size version of an infographic is
    published online at an image size that is 800 pixels wide and as long as necessary
    to tell the story. This size allows an infographic to display on the company website
    at full resolution and fits within the window width of most web browsers and screen
    resolutions.


    However, when the infographic is shared and reposted on other sites, the image
    size is normally reduced to a smaller thumbnail image to fit the width of the
    content space of a blog or website layout. Most of the layout templates available
    on blog design platforms (such as `WordPress`) have a content space that is only
    600 pixels wide to allow for additional site content in a sidebar. A vertical,
    tall format design is usually still somewhat readable when reduced to fit the
    smaller content width, but a horizontal format would be reduced so dramatically
    that it would become a tiny, unreadable thumbnail.


    For example, [Figure 2-2](#c02.xhtml_figure2-2) shows an infographic design from
    `Hotels.com` called `What Guests Want.` The original infographic design was published
    as an 800 × 4,000 pixel JPG image file. People who repost the infographic on their
    own blog would probably shrink that image file down to 500 × 2,500 pixels. A reduction
    in width of 37.5 percent, but a reduction in overall size (area of the design)
    of 61 percent.


    ![c02f002.tif](image_fi/582305c02/c02f002.png)


    [**FIGURE 2-2:**](#c02.xhtml_figureanchor2-2) Vertical infographic size comparison


    [`coolinfographics.com/`](http://coolinfographics.com/Figure-2-2)[`Figure-2-2`](#c02.xhtml_figure2-2)


    Source: *What Guests Want*, `Hotels.com`


    By contrast, if we consider this fun design, in `The History of Swimwear` infographic
    from `BackyardOcean.com` in [Figure 2-3](#c02.xhtml_figure2-3), the story is different.
    The original infographic design is a wide 4,000 × 800 pixel horizontal format
    design, and the viewers are required to scroll side to side to see all the content.
    Side scrolling is not ideal, but the implementation on the `BackyardOcean.com`
    site is easy for the audience to scroll through the design. However, to fit within
    a standard blog format, the 4,000 pixel width would have to be reduced to 500
    pixels wide. A reduction in width of 87.5 percent, but the overall size reduction
    is 98.4 percent—too small for viewers to read.


    ![c02f003.tif](image_fi/582305c02/c02f003.png)


    [**FIGURE 2-3:**](#c02.xhtml_figureanchor2-3) Horizontal infographic size comparison


    [coolinfographics.com/Figure-2-3](http://coolinfographics.com/Figure-2-3)


    Source: *History of Swimwear,* `BackyardOcean.com`


    Image-sharing sites such as `Pinterest` use a vertical, scrolling interface to
    browse images with variable lengths. This allows for tall format designs to display
    in their entirety. Although it wasn’t intended for this purpose, it resulted in
    an ideal display for a gallery of tall format infographics. In [Figure 2-4](#c02.xhtml_figure2-4),
    you can see how all the infographic image sizes are condensed to fit the fixed
    width columns. The tall format designs are much easier for the reader to view,
    but horizontal format infographics are reduced to a very small size.


    ![c02f004.tif](image_fi/582305c02/c02f004.png)


    [**FIGURE 2-4:**](#c02.xhtml_figureanchor2-4) Pinterest display format


    [`coolinfographics.com`](http://coolinfographics.com)[`/Figure-2-4`](#c02.xhtml_figureanchor2-4)


    Although tall format designs are ideally suited for online distribution, they
    are only effective if online is the only place you are going to publish. The tall
    format designs are particularly difficult to use in presentation slides or printed
    out. For both presentation slides and printing, the limiting dimension changes
    to height, not width.


    Tall format designs that are printed out on standard letter-size or A4 paper or
    pasted into presentation slides are scaled down to make their height fit the size
    of the page. This creates images that are usually too small to read or understand.


    The `Our Amazing Planet: Top to Bottom` infographic ([Figure 2-5](#c02.xhtml_figure2-5))
    is a cool infographic by designer Karl Tate that illustrates the scale of altitude
    and depth from 35,000 feet above Earth, down to 35,000 feet below sea level. The
    design places all the height and depth examples correctly on a visual scale. The
    original design (far left) created an incredibly tall format infographic, sized
    at 800 × 15,000 pixels, but when shrunk down to fit on a printed page, it becomes
    too small to read.


    ![c02f005.tif](image_fi/582305c02/c02f005.png)


    [**FIGURE 2-5:**](#c02.xhtml_figureanchor2-5) Tall format is great for viewing
    online, but can be a poor choice for printing.


    [`coolinfographics.com`](http://coolinfographics.com)[`/Figure-2-5`](#c02.xhtml_figureanchor2-5)


    Source: *Our Amazing Planet*, Karl Tate, `LiveScience.com`

    '
