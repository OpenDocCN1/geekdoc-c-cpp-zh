    基于这一原则，专注于职业人脉的网站 LinkedIn 开始在每个人的个人资料页上显示公司 Logo（如果该公司有官方页面并提供了相关标识），正如在作者的资料中所示（图
    4-12）。当人们在 LinkedIn 账户的个人工作经历中添加公司职位时，如果选择了一个 LinkedIn 已经识别的公司，官方公司 Logo 就会显示在个人的资料页上。


    ![c04f012.tif](img/c04f012.png)


    图 4-12： LinkedIn 个人资料上显示的公司 Logo


    网上有很多关于理解使用商标公司 Logo 相关的法律问题的帖子和文章。许多人并不理解商标法，特别是“公平使用”（Fair Use）原则。在引用某家公司时，特别是在多个公司的列表里，公平使用原则允许在提到该公司时使用其商标。关于公平使用原则的更多信息请参见第
    2 章“在线信息图”，但值得重复的是，商标法在不同国家有所不同，因此值得了解当地法律。


    Sascha Kuntze 在他的信息图简历中使用了许多公司和品牌 Logo（图 4-13）。在这个设计中，Logo 被用来代表过去的客户，也代表了他的社交媒体影响力。读者可能会认出该设计中包含的一些主流
    Logo，而由于 Sascha 与这些受推崇公司的关联，他的工作价值也随之提升。


    ![c04f013.tif](img/c04f013.png)


    图 4-13： 使用 Logo 的图简历——Sascha Kuntze


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-13`


    David P. Ingram 在他的简历中使用 Logo（图 4-14）也是有效的。这些 Logo 立即吸引了视觉焦点和注意力，并为简历给读者留下了第一印象。例如，索尼通常被认为是一家声誉极好的公司，特别是在其培养高素质员工方面。招聘经理在阅读他的简历时，第一印象可能是
    David 来自一家声良好的公司，因此 David 的简历可能值得花额外时间仔细阅读。


    除非增加更多信息，否则 Logo 不会让他置于其他同样具备所需技能的候选人之上。


    ![c04f014.tif](img/c04f014.png)


    图 4-14： 信息图简历上的公司 Logo—David Ingram


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-14`


    当招聘经理筛选一百份简历时，能够通过最初的筛选来确定哪些简历值得认真考虑，这对于任何职位应聘者来说都是一个巨大的优势。


    ### 软件应用图标


    信息图简历最初在年轻一代的平面设计师和社交媒体经理中流行起来。这些职位需要对工作中关键的多个软件应用程序网络网络具有专业知识，使用应用程序图标与使用公司 Logo
    类似。许多主要应用程序通过其图标就能被识别。


    然而，与公司 Logo 不同，软件图标通常作为对职位要求的视觉认可。这些图标立即向招聘经理展示了候选人具备空缺职位所需的软件技能，但除非增加更多信息，否则它不会将其置于其他同样具备所需技能的候选人之上。


    Tina Chen 的简历（图 4-15


    图 4-15： 带有软件图标的简历—Tina Chen


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-15`


    额外的视觉元素，如前面提到的相对经验设计，可以与软件图标结合使用增加信息。在图 4-16 中，Aníbal Maíz Cáceres 的信息图简历将软件图标集成到一个相对经验条形图中，显示了他在每个应用程序中不同的熟练程度。Aníbal
    还提供了多种语言（英语、西班牙语和法语）的在线简历，图标的使用减少了每个版本需要翻译的文本量。


    ![c04f016.tif](img/c04f016.png)


    图 4-16： 软件图标结合相对经验可视化的信息图简历—Aníbal Maíz


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-16`


    ## 使用信息图简历


    由于信息图简历在就业市场上仍然相对少见，下一个挑战是候选人如何在大多数仍为纯文本的市场中有效地使用它们。最初，信息图简历被寻求平面设计师、网页设计师、社交媒体和网络开发职位的候选人所接纳。

