- fmt: '

    Adobe Photoshop ([Figure 7-8](#c07.xhtml_figure7-8)) is the dominant application
    for photo and image editing software. This is another application included as
    part of the Adobe Creative Suite. It has everything you need to clean up images
    for infographic designs, and way, way more. Similar to Illustrator, the high price
    point and overall complexity are major hurdles for many designers. ([`www.adobe.com`](http://www.adobe.com))


    ![c07f008.png](image_fi/582305c07/c07f008.png)


    [**FIGURE 7-8:**](#c07.xhtml_figureanchor7-8) Photoshop screenshot


    ### Pixelmator


    ![c07uf007.png](image_fi/582305c07/c07uf007.png)


    Pixelmator ([Figure 7-9](#c07.xhtml_figure7-9)) is a much less expensive image-editing
    application on the Mac platform and is a popular tool of choice. This is a powerful,
    full-featured image editing application that is more than capable of handling
    the images used for infographic designs. ([`www.pixelmator.com`](http://www.pixelmator.com))


    ![c07f009.png](image_fi/582305c07/c07f009.png)


    [**FIGURE 7-9:**](#c07.xhtml_figureanchor7-9) Pixelmator screenshot


    ### GIMP


    ![c07uf008.png](image_fi/582305c07/c07uf008.png)


    GIMP ([Figure 7-10](#c07.xhtml_figure7-10)) is a free image manipulation application
    used for photo retouching, image composition, and image authoring. GIMP has all
    the core image editing functions, but its main advantage is its cross-platform
    support for Windows, Mac, GNU-Linux, Sun OpenSolaris, and FreeBSD. This is a great
    tool for those with a small budget. ([`www.gimp.org`](http://www.gimp.org))


    ![c07f010.png](image_fi/582305c07/c07f010.png)


    [**FIGURE 7-10:**](#c07.xhtml_figureanchor7-10) GIMP screenshot


    ### Acorn


    ![c07uf009.png](image_fi/582305c07/c07uf009.png)


    Acorn ([Figure 7-11](#c07.xhtml_figure7-11)) by Flying Meat is an award-winning,
    low-cost image editing application, but this one is also Mac-only. Acorn is easy
    to use with some great design tools and filters. ([`www.flyingmeat.com/acorn`](http://www.flyingmeat.com/acorn))


    ![c07f011.png](image_fi/582305c07/c07f011.png)


    [**FIGURE 7-11:**](#c07.xhtml_figureanchor7-11) Acorn screenshot


    ## Online Data Visualization Tools


    There are hundreds of websites can help create the different visualizations that
    designers include in their designs. It all depends on what type of information
    you have to work with and what story you want to tell. Do you need a map, a word
    cloud, a flowchart, or a simple bar chart? The incredible diversity of data visualizations
    is amazing to behold, and new visualization methods and styles are developed every
    day. Following are just a handful of the tools that have been helpful.


    ### Periodic Table of Visualization


    One tool that helps many designers determine which type of data visualization
    is appropriate for their data is the Periodic Table of Visualization (shown in
    [Figure 7-12](#c07.xhtml_figure7-12)) from `Visual-Literacy.org`. Sometimes designers
    need some inspiration to break out of the standard bar charts, pie charts, and
    line charts. In the table, the visualization methods are grouped by the different
    types of data being visualized (Strategy, Data, Metaphor). When you hover your
    mouse pointer over any of the methods on the chart, it displays an example of
    that visualization for your reference. The examples are a few years old, so they
    may appear dated, but you’ll still understand the visualization style that could
    be used to model your data. (``visual-literacy.org/periodic_table/periodic_table.xhtml`)


    ![c07f012.png](image_fi/582305c07/c07f012.png)


    [**FIGURE 7-12:**](#c07.xhtml_figureanchor7-12) Periodic Table of Visualization


    ### Wordle.net


    Wordle is a popular, free tool online for creating word clouds of any text you
    have available. Word clouds size the font of each word based on its frequency
    in your text, so the largest words are the ones that appear most often. [Figure
    7-13](#c07.xhtml_figure7-13) shows a word cloud pasted directly from its website
    without any editing. After a word cloud has been created, you can edit the colors,
    layout, and fonts to your liking.


    ![c07f013.png](image_fi/582305c07/c07f013.png)


    [**FIGURE 7-13:**](#c07.xhtml_figureanchor7-13) Facebook Privacy Policy on Wordle


    Word clouds are usually used in situations in which your data is more qualitative
    than quantitative. The reader can get a general impression based on the word frequency,
    but no hard values are shown. There are also some advanced features to combine
    words in order to determine the frequency of phrases instead of just individual
    words. This is often used to separate positive and negative sentiment phrases,
    and the difference between phrases such as “love” and “don’t love.” Without the
    phrases, only the raw frequency of “love” would be counted, regardless of its
    context. (``www.wordle.net`](http://www.wordle.net))


    ### Chartle.net


    Chartle is easy to use and free. In addition to the normal pie charts, line charts,
    and bar charts, Chartle has a number of other useful visualizations that are often
    used in infographics. Specifically, the maps, Venn diagrams, and gauges ([Figure
    7-14](#c07.xhtml_figure7-14)) are different and popular. (``www.chartle.net`](http://www.chartle.net))


    ![c07f014.png](image_fi/582305c07/c07f014.png)


    [**FIGURE 7-14:**](#c07.xhtml_figureanchor7-14) Chartle.net


    ### ChartsBin


    ChartsBin is an online, web-based visualization tool mainly used for visualizing
    data on a world map ([Figure 7-15](#c07.xhtml_figure7-15)). You can enter your
    own data or browse the data sets in the gallery. The final visualizations can
    be downloaded as `PNG` image files to be placed into an infographic design. (``www.chartsbin.com`](http://www.chartsbin.com))


    ![c07f015.png](image_fi/582305c07/c07f015.png)


    [**FIGURE 7-15:**](#c07.xhtml_figureanchor7-15) ChartsBin screen shot


    ### DIY Chart


    DIY Chart ([Figure 7-16](#c07.xhtml_figure7-16)) has a number of chart templates
    that you can use as the data visualizations in an infographic design. You can
    create a handful of charts for free, and the $4.95/month fee for the Premium account
    gets you many more chart styles and removes the DIY Chart logo from your designs.
    You can save your chart images in `BMP`, `PNG`, `Emf`, or `JPG` formats to your
    local disk for use in infographic designs or even just as a chart in a blog post.
    (``www.diychart.com`](http://www.diychart.com))


    ![c07f016.png](image_fi/582305c07/c07f016.png)


    [**FIGURE 7-16:**](#c07.xhtml_figureanchor7-16) DIY Chart


    ### Gephi


    Gephi ([Figure 7-17](#c07.xhtml_figure7-17)) is described as the Photoshop for
    data, and it’s powerful for large, imported data sets of more than 50,000 nodes.
    After the visualization has been created, it can be exported to be included in
    an infographic design. (``www.gephi.org`](http://www.gephi.org))


    ![c07f017.png](image_fi/582305c07/c07f017.png)


    [**FIGURE 7-17:**](#c07.xhtml_figureanchor7-17) Gephi screen shot


    ### Gliffy


    Gliffy ([Figure 7-18](#c07.xhtml_figure7-18)) is more for diagrams than traditional
    charts, such as flowcharts, Venn diagrams, network diagrams, and org charts. Diagrams
    can be saved as `JPG`, `PNG`, or `SVG` format, which can then be included in an
    infographic design. (``www.gliffy.com`](http://www.gliffy.com))


    ![c07f018.png](image_fi/582305c07/c07f018.png)


    [**FIGURE 7-18:**](#c07.xhtml_figureanchor7-18) Gliffy diagramming application


    ### iCharts


    iCharts is a neat online tool for creating good charts. You can upload your data
    set and choose a chart type. A number of different chart types are available and
    you can customize all the chart attributes or use one of the chart design templates
    ([Figure 7-19](#c07.xhtml_figure7-19)). When you finish, you can download your
    chart as a `PNG` image file for use in an infographic design. (``www.icharts.net`](http://www.icharts.net))

