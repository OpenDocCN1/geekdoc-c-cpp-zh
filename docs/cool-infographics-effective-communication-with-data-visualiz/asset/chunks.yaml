  raw: 'When writing a message to a blog author, make it personal. I receive approximately
    400 submissions every week to the Cool Infographics blog, and if the message is
    obviously a template or a form letter, I ignore it. I’ve seen the exact same message
    submitted 10 times on the same day with only the link changed. Humans are pattern
    recognition machines ([Chapter 1](#c01.xhtml), “The Science of Infographics”)
    and it’s easy to spot the scripted messages that have been copied and pasted into
    the e-mail. These go straight into the trash.


    A good message should be written directly to the blog author and should contain
    relevant information. Why would their blog audience be interested in the infographic?
    What prior posts have they published on similar topics? What content have they
    posted from your company before? What prior posts from the bloggers have you helped
    share in your own social networks?


    Make sure you include the URL link directly to the infographic landing page. Don’t
    try to send them the infographic JPG image file as an attachment. You don’t want
    them to host the infographic image on their site because then they don’t need
    to link to your page. Just send the URL link, and let them use the embed code
    or sharing buttons from the landing page. They can also get the JPG from the landing
    page if that’s how they would like to post it on their own site. It’s often helpful
    to include a short text description of the infographic in the e-mail so that they
    can paste that into their blog post as additional text, even if it’s the same
    text description from the landing page.


    After you release your infographic into the wild, it takes on a life of its own.
    Ultimately, you don’t have control over what happens to it. You will undoubtedly
    see both positive and negative comments about it, and from an SEO perspective,
    it’s all good. If people post links and talk about your infographic, your web
    page rank can benefit.


    #### News Media Sites


    News related sites are always looking for good content to publish, but they are
    also constantly bombarded with hundreds or thousands of story ideas, editorials,
    press releases, and infographics. If you work for a medium- or large-size company,
    you may already have an internal PR department or contract with an external PR
    firm that has an existing list of media contacts. You know these media contacts
    already post articles relevant to your industry, so take advantage of them. That’s
    a huge benefit of working for a larger company.


    In addition, many popular, high-ranking media sites often post infographics submitted
    from the outside, but the challenge is getting your infographic onto their radar.
    Some have a system for submissions on the website, but some obscure that process
    so that they don’t get thousands of submissions every day.


    Many news sites are focused on a specific topic area, like politics, the environment,
    health issues, or technology. The selection of news sites to include in your outreach
    plan depends on your specific infographic topic; however, many news sites cover
    a wide variety of topics that could be applicable to many different infographic
    topics.


    *   **GOOD Magazine**— [`www.good.is`](http://www.good.is)


    Good Magazine loves infographics. It has made data visualization and infographics
    an integral part of its culture both online and in print. Create a free account
    on its website and upload your own infographic as content that the community can
    learn from.


    *   **Mashable**— [`www.mashable.com`](http://www.mashable.com)


    Mashable is a popular online news site that generally focuses on technology, business,
    and innovation content. It has a dedicated page for story submissions open to
    the public and includes links to its editorial staff on Facebook and Twitter.


    *   **Smashing Magazine**— [`www.smashingmagazine.com`](http://www.smashingmagazine.com)


    Smashing Magazine posts content generally related to technology, online lifestyle,
    web development, graphics, and design. The Contact page has a form to submit suggestions
    that are reviewed by its editorial staff.


    *   **The Next Web**— [`www.thenextweb.com`](http://www.thenextweb.com)


    The Next Web covers content related to the latest news about Internet technology,
