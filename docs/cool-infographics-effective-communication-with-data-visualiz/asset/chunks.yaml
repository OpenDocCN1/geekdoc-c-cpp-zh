- fmt: '

    Embed code is a section of HTML code that displays on the web page as text. The
    code is similar to the HTML image display code used on the landing page, but this
    code is intended for other blog authors to copy and paste as an easy way to display
    the infographic on their own sites. This code is included in the `<body>` section
    the page.


    The advantage of making the embed code available on the landing page is huge for
    the publisher. The code can be written to display the correct infographic image
    and provide a link back using the correct `URL` for the infographic landing page.
    In addition, using the embed code can make the process of posting an infographic
    incredibly convenient for bloggers.


    There are two parts to adding a block of embed code to your infographic landing
    page. First is writing the HTML code you want bloggers to copy, and second is
    adding the `<textarea>` code to your own page so the code appears on your page
    as text instead of actually displaying the infographic. This is important because
    when people view your infographic landing page, you want their browser to display
    the code instead of trying to interpret it and display the infographic image a
    second time.


    The embed code for your fictitious infographic might look like this:


    ```html

    <body>

    Please share this infographic on your site by copying and pasting the code below

    <p>

    <textarea style="width:540px;height:100px">

    <a href= "http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml">

    <img src=" SEO-Strategies-Experts-Infographic-small-500px.jpg" alt="Top SEO strategies
    used by expert marketing consultant to improve the PageRank of websites">

    </a>

    <p> SEO Strategies Used By The Experts - An infographic by the team at <a href="http://coolinfographics.com"
    >Cool Infographics</a>

    </textarea>

    </body>

    ```


    On your infographic landing page this will display the embed code text in a small
    text box as shown in [Figure 3-13](#c03.xhtml_figure3-13). This is an easy way
    to make the image display code available to anyone to copy and paste into their
    own site or blog. Instead of uploading the image file onto their own server, this
    code will display the infographic image from your server when someone views their
    page. It’s a nice way to help bloggers save space on their servers because they
    don’t need to host the image file.


    ![c03f013.tif](image_fi/582305c03/c03f013.png)


    [**FIGURE 3-13:**](#c03.xhtml_figureanchor3-13) The `<textarea>` element will
    display the HTML code in a small text box.


    Following are six key aspects to understand about what is included in this example
    embed code:


    1. A simple request above the code asking bloggers to use the embed code.

    2. All of the HTML code is visible in the box. Too much code text would run past
    the bottom of the box, which would hide a portion of the code from view. The box
    will display a scroll bar, but it can feel like you are hiding some of the HTML
    code on purpose.

    3. When displayed on the blogger’s site, the infographic has a clickable link
    back to the original infographic landing page at the `URL` defined by the publisher.
    This lets you choose where you want the link to go.

    4. A smaller, 500 pixel-wide `JPG` image file of the infographic is used as the
    source for the image that is displayed on the blogger’s site. This is more likely
    to fit into the smaller space of blog formats (see [Chapter 2](#c02.xhtml), “Online
    Marketing Infographics”), and will load faster than using the size parameters
    to display a larger image.

    5. An `alt` text description is written by the publisher to maximize its SEO value.

    6. An additional line of text can be displayed under the infographic as a caption
    with a text link to the front page of the company website.


    With the help of a good web developer, much more could be done within the embed
    code, including some spammy SEO practices you should avoid like adding a long
    string of keywords or linking to unrelated pages. Filling the embed code with
    keywords and text links is obviously unnatural, and the search engines are smart
    enough to ignore that type of content. Publishers should be transparent about
    the code they offer to bloggers by making all the text visible on the page so
    that bloggers can see what code they would be adding to their own sites.


    The code should also be short and simple like the example embed code above. Even
    if all the code is written with good intentions, a long, complicated block of
    code has a greater chance of including spammy code hidden within it. Most bloggers
    are not web developers proficient with `HTML` and may not understand what all
    the embed code means. A long block of code has a high probability of scaring off
    bloggers because putting unknown `HTML` code they don’t understand on their site
    is potentially risky.


    The embed code is also just a suggestion to bloggers to use. They can paste the
    code as-is into their sites, or modify the code any way they see fit. If they
    want to change the `alt` description, they are free to do so. As the publisher,
    you are providing the code as a convenience.


    In practice, only a small portion of bloggers actually take advantage of using
    the embed code to display an infographic on their blog. Usually, they download
    the `JPG` image file itself or display the image by linking directly to the hosting
    server. That leaves the flexibility to choose their own link, write their own
    `alt` text description, or choose not to include them at all.


    However, it is definitely worth the effort to make the embed code available on
    the infographic landing page because it can maximize the value of the links from
    those bloggers.


    ### Self-promotion


    The second part of the release strategy is self-promotion. Many companies already
    have existing communication channels with customers, suppliers, and the media.
    After an infographic has been published publicly with a dedicated landing page,
    a company should broadcast that `URL` as widely as possible through their own
    channels. You never know whose network of followers will reach the right audience.


    This is where you should blow your own horn. This is marketing, and you are pitching
    the infographic to your audience as valuable content. If they like the infographic,
    they will share it with their own networks…and if those followers like it, they
    will share it with their own networks…and if those followers like it…and so on.
    That’s one way a worthy design can “go viral.”


    The opportunity is that promoting your infographic through the existing communication
    channels is essentially free. It just takes some effort by the employees, and
    companies can control how much time they ask employees to spend on promotional
    activities. This is also an opportunity for a company to take advantage of the
    different forms of presence they have established on the Internet.


    #### Company Communication Channels


    How can visitors find the infographic on the company website? If you establish
    a dedicated infographic landing page as previously mentioned, it’s now a custom
    page within the website that’s accessible only to people that know the `URL` or
    click a link from another site. What about people who visit your website on their
    own? How can they get to the infographic or even know it exists?


    Depending on the company policies surrounding control of website development,
    the ability to make changes to the website varies dramatically. A large, global
    corporation may need months of review and even legal approval to add a single
    link to the website homepage. A small, nimble startup might be willing to add
    a link to the homepage within minutes.


    [Table 3-1](#c03.xhtml_table3-1) shows the most effective places companies can
    add links to an infographic they have published.


    | **Website Area** | **Description** |

