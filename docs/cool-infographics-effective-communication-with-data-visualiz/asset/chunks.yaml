    \nRelevance is a search engine’s holy grail. People want results that are closely\
    \ connected to their queries.\n\n—MARC OSTROFSKY, *GET RICH CLICK!*\n\n# 3\n\n\
    Infographics and SEO\n\nNormally, the objective of an online infographic design\
    \ project is to increase traffic and links to the company website. The company\
    \ that publishes an infographic wants to build the awareness and equity of its\
    \ brand (or product) and increase its position in search engine results related\
    \ to its business.\n\nThis is the realm of Search Engine Optimization (SEO) strategies,\
    \ and in the last few years infographics have become a powerful content tool for\
    \ companies to employ that encourages site links and increases their overall site\
    \ relevance. When a company publishes an engaging, well-designed infographic on\
    \ its site, many people post it on their own sites with links back to the company\
    \ and share it within social media with their own networks of friends and followers.\n\
    \nSearch engines calculate a score for a web page’s credibility and authority\
    \ as one way to quantify its relevance to specific keywords. They use complex,\
    \ proprietary algorithms that use many different signals. Some of these classify\
    \ for relevance, others for quality of content, and others for overall importance\
    \ on the Internet. One of the most famous is the Google PageRank classifier, which\
    \ considers both the number and quality of links pointing at a page to determine\
    \ its standing. All of these combine together to determine the search engine rank\
    \ score of a web page for a specific search.\n\nThe higher a specific company’s\
    \ website page scores for a particular search, the higher the link to that page\
    \ appears in the search results for users searching with those keywords. The goal\
    \ is to have the company website appear as high in the list of results as possible.\
    \ The best results appear on the first page of search results for the keywords\
    \ related to the business, and the best result a company can achieve is the coveted\
    \ top position of the #1 ranked search result.\n\nGoogle’s PageRank is a logarithmic\
    \ scale (not linear) from 0–10\\. To help people understand the concept, Elliance\
    \ designed the infographic shown in [Figure 3-1](#c03.xhtml_figure3-1) in 2008,\
    \ and it’s still used by people everywhere to help explain PageRank. The “climbing\
    \ a mountain” visual metaphor is effective, but it’s important to understand that\
    \ every page on a website has its own PageRank. So, the homepage of a company\
    \ site may have a PageRank of 5, but an internal page may only have a PageRank\
    \ of 2.\n\n![c03f001.tif](image_fi/582305c03/c03f001.png)\n\n[**FIGURE 3-1:**](#c03.xhtml_figureanchor3-1)\
    \ Google PageRank scores pages on a logarithmic scale from 1-10.\n\n[`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-1`](#c03.xhtml_figureanchor3-1)\n\
    \n*Source:* Google PageRank Explained*, Elliance*\n\nIn general terms, the more\
    \ links to a specific company web page from outside websites, the higher that\
    \ page’s rank becomes. Links from web pages that have high PageRanks of their\
    \ own are more valuable links. However, it’s a moving target. All the search engines\
    \ frequently change their algorithms to improve their services, and the most recent\
    \ links and visitors to a site are what matter most. A website could be on the\
    \ front page of search results today, but tomorrow appear on page four because\
    \ an algorithm was updated.\n\nThis chapter won’t make you an SEO expert, but\
    \ it covers the basics of effectively using infographics as a part of an SEO strategy.\n\
    \n## The Search Engine Challenge\n\nSearch engines are in business, too, and they\
    \ need to provide a valuable service to their customers to keep them coming back\
    \ to use their search service. If you perform a search, and the results aren’t\
    \ close to what you are looking for, that reflects poorly on the search engines’\
    \ brand. They want to provide the right results to their users because that’s\
    \ their business, and it’s what convinces people to return to use their search\
    \ engine again in the future.\n\nProducing the search results that you rely on\
    \ (and take for granted) is an incredibly tough technical problem, as shown in\
    \ the infographic in [Figure 3-2](#c03.xhtml_figure3-2), from Stone Temple Consulting.\
    \ According to Matt Cutts, head of the Webspam team at Google, the size of the\
    \ Internet was measured at more than 100 trillion web pages. Each search engine\
    \ company (Google, Microsoft Bing, and so on) has its own spiders crawling all\
    \ these pages on the web to parse both the text and the links from every page.\
    \ They create their own massive index of the Internet and then query the index\
    \ to provide the search users with a clean list of relevant results.\n\n![c03f002.tif](image_fi/582305c03/c03f002.png)\n\
    \n[**FIGURE 3-2:**](#c03.xhtml_figureanchor3-2) 100 trillion web pages on the\
    \ Internet as of 2013\n\n[`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-2`](#c03.xhtml_figureanchor3-2)\n\
    \nSource: *What’s so hard about search?* by Eric Enge, Stone Temple Consulting\n\
    \nAccording to comScore, in August 2011, there were 61,000 Internet searches performed\
    \ every second¹—which makes it impressive that the search engines can query their\
    \ own index of the Internet and return valuable results in less than a second\
    \ every time."
