    ![c05f010.tif](image_fi/582305c05/c05f010.png)


    [FIGURE 5-10:](#c05.xhtml_figureanchor5-10) Default clustered bar chart from PowerPoint


    However, there are many ways to visualize the same data set.


    In [Figure 5-11](#c05.xhtml_figure5-11), the same research data is redesigned
    into a different data visualization that’s much easier to understand. This one
    is not one of the chart styles built into PowerPoint but can be easily created
    manually by using the square shape tool. This example uses 10 × 10 grids of 100
    squares to visualize percentages, with the values color-coded to match the brand
    colors.


    ![c05f011.tif](image_fi/582305c05/c05f011.png)


    [FIGURE 5-11:](#c05.xhtml_figureanchor5-11) 10 × 10 grid redesign of quantitative
    research data


    Because the entire decimal number system is Base-10, it’s easy for readers to
    understand instantly. Using rows that are 10 objects across is intuitive for readers,
    and anything different is difficult to follow. Some ineffective data visualizations
    in infographics have used rows of 12, 17, 20, and even 24 objects across, and
    it is difficult for readers to understand the values being shown. For any rows
    of icons or shapes, try to always stick with 10.


    In research data, it is also common to note differences that are calculated to
    be statistically significant between the scores of the different brands. This
    is visualized by using matching colored dots beneath each grid to represent the
    other brands that are significantly lower. Brand A’s trustworthiness is significantly
    higher than both Brand B and Brand C, so both blue and green dots are shown under
    that grid.


    By lining them up, the viewer can quickly see that generally the overall trend
    is that Brand A scored better than Brand B and Brand C. It’s visually easy to
    compare values within a brand’s results and between the brands. All 21 data points
    are clearly visualized on one page. It’s the same data, just easier to understand.


    ### Qualitative Research Data


    Qualitative research works very differently with a small number of responses or
    participants, and the data is often verbal or written opinions. This research
    data is usually gathered from focus groups, interviews, in-home research, or consumer
    journals. This data is important for companies to understand consumers and behaviors
    but should not be confused with large, statistical surveys. Any data that is not
    considered to be statistically significant with a low margin of error should be
    considered to be qualitative data.


    An infographic designer needs to be careful that visualizing qualitative data
    doesn’t mistakenly imply that the results are quantitative. Even a simple pie
    chart, as shown in [Figure 5-12](#c05.xhtml_figure5-12), can be the wrong visual
    method to use. In this example, only six people were interviewed, and four of
    them claimed they would buy the product from the research. Even though four out
    of six is mathematically 66 percent, it doesn’t statistically imply that 66 percent
    of all consumers would be interested in buying the product. Six people certainly
    aren’t a large enough sample size to reach that type of conclusion.


    ![c05f012.tif](image_fi/582305c05/c05f012.png)


    [FIGURE 5-12:](#c05.xhtml_figureanchor5-12) WRONG! Don’t visualize qualitative
    data as if it’s statistically valid.


    However, many readers in the audience will not be experts with math and statistics.
    When they see this pie chart, they will jump to the conclusion that research shows
    that 66 percent of all consumers would be interested in buying the product. The
    pie chart style hides the low number of respondents and visualizes a general percentage,
    which is misleading to the audience.


    A better way to visualize this data would be to use character icons to represent
    the actual number of consumers interviewed. [Figure 5-13](#c05.xhtml_figure5-13)
    shows a line of six people icons with four of them colored green to literally
    show that four out of six people responded that they would buy the product. The
    audience can relate the icons to individual people from the survey, which reinforces
    the small sample size.


    ![c05f013.tif](image_fi/582305c05/c05f013.png)


    [FIGURE 5-13:](#c05.xhtml_figureanchor5-13) Visualize the qualitative data literally.


    Another type of data from qualitative research is verbatim comments from people.
    Things people say in a focus group or write on a survey form can be single words
    or paragraphs of text. Word clouds are used to show the frequency particular words
    are used. The font size of each word or phrase is based on the frequency of mentions
    in the complete text from the research.


    To demonstrate, I gathered the text from 15,000 customer review comments about
    related products from Amazon.com, and used `Wordle.net` (`www.wordle.net`](http://www.wordle.net))
    to create two word clouds. [Figure 5-14](#c05.xhtml_figure5-14) includes the words
    from positive review comments shown in a green word cloud, and [Figure 5-15](#c05.xhtml_figure5-15)
    includes the negative comments shown in a red word cloud.


    ![c05f014.tif](image_fi/582305c05/c05f014.png)


    [FIGURE 5-14:](#c05.xhtml_figureanchor5-14) Word cloud of positive customer reviews
    on Amazon.com


    ![c05f015.tif](image_fi/582305c05/c05f015.png)


    [FIGURE 5-15:](#c05.xhtml_figureanchor5-15) Word cloud of negative customer reviews
    on Amazon.com


    The nice thing about word clouds is that they are visually indicative of general
    sentiment, especially when seen in relation to the rest of the words. The reader
    can get a good understanding of common themes, but no numbers are shown to indicate
    frequency. Even with thousands of customer reviews as the data set, this is still
    considered to be qualitative data because there is little information about the
    people involved. It’s not a controlled survey of a specific type of consumer.
    Instead, it’s a random assortment of customers that happened to be motivated to
    post a review.


    ### Better Presentations Using Infographics


    Most people are comfortable using data visualizations and infographics at work
    in presentations. This is where they most often see charts, tables, and diagrams
    used to communicate with employees in the company. However, a presentation with
    a bunch of slides that all look the same because the presentation designer just
    accepted the design template defaults isn’t going to impress anyone. In fact,
    the presenter can lose credibility, and the information is unlikely to be remembered.


    Presentation software can be a powerful design tool but not if the user just accepts
    the design template defaults. Templates are supposed to be a good place to start
    but not the final slide designs. If you want your presentation to stand out and
    be memorable, you need to design and customize your own visualizations to be relevant
    and engaging for your audience.


    [Figure 5-16](#c05.xhtml_figure5-16) is the default chart created by one of the
    standard templates in PowerPoint. How many charts have you seen that look exactly
    like this one with only the values and the text changed? In templates, the default
    colors match the overall presentation theme but don’t have any connection to the
    data.


    ![c05f016.tif](image_fi/582305c05/c05f016.png)


    [FIGURE 5-16:](#c05.xhtml_figureanchor5-16) Original chart created with a PowerPoint
    template


    You don’t want your audience to remember that you used PowerPoint; you want them
    to remember your specific information. For the Picture Superiority Effect to be
    effective, the visual elements have to be related to the information.

