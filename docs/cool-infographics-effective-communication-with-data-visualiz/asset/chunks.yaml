    `title` 标签是一个 HTML 代码元素，每个网页都应该包含它。`title` 元素包含在页面的 `<head>` 部分，文本显示在浏览器窗口的标题栏或标签页上。


    ```

    <head>

    <title>Expert SEO Strategies Infographic</title>

    </head>

    ```


    这是向搜索引擎识别页面内容的最要要素之一，而且尤为重要，因为 `title` 标签通常用作搜索结果页面上显示的链接文本。考虑使用带有空格的自然语言，并将“infographic”（信息图）一词作为
    `title` 标签的最后一个单词。这有助于观众和搜索引擎识别出该内容为一张信息图，而最后一个单词被认为重要性最低，但仍具有相关性。


    `title` 标签还会被社交媒体分享按钮使用，在没有其他建议文本的情况下，将其作为帖子或推文的提议默认文本。例如，除非你为 Twitter 创建了特定的建议文本，否则当有人使用页面上的
    Twitter 按钮分享信息图时，它将提议 `Title Tag` 中的文本作为推文内容。


    ## 页面标题 (Page Title)


    页面标题是以文本形式显示在页面 `<body>` 部分的可见标题。如果你使用 `H1` 标题的 HTML 代码，搜索引擎就会知道这是页面上最重要的文本之一，任何包含的文本都会以大号粗字体显示在页面上。页面标题中的单词通常比页面上的其他文本具有更高的重要性或价值。


    ```

    <body

    <h1>SEO Strategies Used By The Experts</h1>

    </body>

    ```


    页面标题的实际文本通常与 `title` 标签相同，但不必如此。从内容的角度来看，作者通常希望页面标题越短越好，这样文本就不会在页面上换行。单词过多会让整个页面看起来复杂且杂乱，你可以在页面标题中省略“infographic”一词来帮助缩短文本。查看页面的读者已经可以看到内容是一张信息图。


    ## 描述文本 (Description Text)


    在落地页上最容易添加的内容是段关于该信息图的简短描述文本。它可以是信息图中的文本，也可以是专门为落地页编写的文本。这为搜索引擎索引提供了额外的文本，但要保持简洁！页面的重点是信息图；所以不要用过多的文本吓跑访问者。当读者在页面上（或信息图内）看到太多文本时，他们通常会忽略并离开页面而不阅读，因为内容看起来太密集了。


    考虑在描述文本中包含几个指向同一网站内其他相关页面的文本链接。这提供了两个好处。首先，随着信息图落地页的浏览量链接随时间推移而增加，这些指向公司网站其他页面的文本链接将变得更有价值。其次，在自己的博客或社交媒体账户上发布信息图的人通常会复制整个描述文本作为额外内容包含在他们的贴文中。记住，他们也需要文本供搜索引擎在自己的页面上索引，这可以为指向你网站的页面创建额外的价值文本链接。


    然而，请保持包含的文本链接与信息图主题相关。有些信息图落地页有指向不相关页面的文本链接，这可以利用信息图的成功进行推广。虽然这可能有效，但读者会将其视为垃圾信息。


    ## 信息图文件名 (Infographic Image Filename)


    搜索引擎甚至会查看信息图文件的名称，以尝试寻找描述内容的关键词。如果图像文件名只是识别图像的数字，例如 `IMG1234567.jpg`，搜索引擎就会忽略它，但你不希望错过任何将关键词链接到信息图的机会。这里最简单的方法是使用
    `title tag` 中的主词作为文件名。因此，根据你虚构的信息图，这可能是你加载到落地页上的信息图文件名：


    `SEO-Strategies-Experts-Infographic.JPG`


    与之前的落地页 URL 一样，文件名应使用连字符（hyphens）作为单词分隔符。避免在单词之间使用划线，因为 Google 将其视为单词连接符。


    ## Alt 文本描述 (Alt Text Description)


    信息图中一个重要的 HTML 元素是图像的 `alt` 属性，它允许浏览器在浏览器中关闭图像显示时显示描述图像的文本。由于现代互联网访问速度的提高，在不显示图像的情况下查看网页的做法已很罕见，但该
    HTML 元素仍然存在，并被大量用于搜索引擎索引。


    `alt` 文本描述应该用自然语言写成简短描述。这里的内容理想情况下是一句话来描述信息图，并且还可以被许多为视障人士提供的屏幕阅读器使用。无障碍软件会为视力困难的人大声读出
    alt 描述描述的文本，这使得自然语言描述变得更加重要。


    `alt` 文本描述包含在标识页面上显示的实际图像文件的 HTML 代码中。


    ```

    <img src=" SEO-Strategies-Experts-Infographic.jpg" alt="Top SEO strategies used
    by expert marketing consultants to improve the PageRank of web pages">

    ```


    你唯一不想做的事就是向 `alt` 文本描述中堆砌一长串关键词。这种做法不仅是垃圾信息，而且搜索引擎也能识别出来，并减少 alt 文本描述可能为页面提供的任何价值。对于使用屏幕阅读器的访问者来说，这也非常不礼貌且令人反。


    ## 社交媒体分享按钮 (Social Media Sharing Buttons)


    信息图落地页绝对应该包含主要社交媒体网络的分享按钮。公司应该让分享信息图变得尽可能简单无痛，在落地页上包含分享按钮是分享信息图最流行的方法。


    向落地页添加按钮的一种方法是使用来自每个社交网络的独立、专用的按钮。Web 开发人员可以将每个社交网络网站提供的 HTML 代码复制并粘贴到页面上。这种方法保持了落地页与社交网络之间简单直接的关系，但需要
    Web 开发人员花费更多工作。


    更流行的方法是使用一种分享按钮聚合服务之一。这些服务允许开发者仅向落地页添加一个 HTML 代码块，即可显示用于各种网络的多个按钮。这种方法的主要优势是对于代码和跟踪分析都使用一个中央服务的便利性。缺点可能是聚合器也可以访问你的分析数据，如果你对此有所顾。


    主要的分享按钮聚合服务有：


    *   `AddThis`: [`www.addthis.com`](http://www.addthis.com)

    *   `ShareThis`: [`www.sharethis.com`](http://www.sharethis.com)

    *   `AddToAny`: [`www.addtoany.com`](http://www.addtoany.com)


    在实践中，分享按钮始终应该显示在落地页的“折叠以上”（above the fold）——也就是说，它们应该在页面顶部，无需滚动即可可见。许多读者只会查看信息图的上部分，并决定在他们的社交网络中分享它。只有一部分读者会一直看到底部，因此在那里放置分享按钮的效果较差。


    在某些情况下，特别是很长的信息图，分享按钮也可以在页面底部重复，为读者提供额外的便利。


    #### 嵌入代码 (Embed Code)


