    -   **流量与链接**——如果你在这些网站上托管你的信息图，而不是在你自己网站的信息图落地页上，那么所有指向你信息图设计的流量和反向链接都将使设计网站受益而不是你的网站。即使使用嵌入代码在你自己的网站上显示最终的信息图设计，也会将部分流量和
    PageRank 重定向到设计网站。

    -   **非机密性**——你可能考虑使用在线设计网站创建内部使用的公司数据信息图，但你可能会在无意中让公司机密数据公开。即使该网站没有公开发你的设计，你也可能将私有数据暴露给设计公司的成员。这些网站中没有一个声称你的数据经过任何形式的加密或保护，这可能违反你的公司政策。


    这些网站是开始使用数据可视化和信息图来视觉化传递信息的绝佳方式。如果你使用这些工具设计自己的信息图，你至少应该了解由于缺乏对设计的完全控制权而牺牲了什么。


    ## Easel.ly


    Easel.ly 允许你从大量的模板、形状和对象库中选择来创建并分享信息图设计。Easel.ly 没有任何高级图表工具，因此需要设计者手动调整形状的大小以匹配数据值。图
    7-22 中显示的圆每个都需要由用户调整大小以匹配数据。（[``www.easel.ly`](http://www.easel.ly))）


    ![c07f022.png](img/c07f022.png)


    **图 7-22：** Easel.ly 设计界面


    ## infogr.am


    Infogr.am 是一个根据你自己的数据创建和分享信息图以及单个图表的在线工具。如图 7-23 所示，它将设计过程简化并封装为四个步骤：


    ![c07f023.png](img/c07f023.png)


    **图 7-23：** Infogr.am 模板选择器


    1. 选择一个模板。

    2. 添加你自己的数据。

    3. 定制设计。

    4. 发布并分享。


    这些图表是交互式的，这增加了一些动画，并根据观众的决定更改显示。该工具还允许将最终设计嵌入到你的网站上或在主要的社交媒体网络上分享。（[``infogr.am`](http://infogr.am))）


    ## Piktochart


    Piktochart 是一款在线信息图的所见即所得（WYSIWYG）编辑器。该工具允许你在线创建带有交互式图表的信息图，并声称它们已针对 SEO 和社交媒体共享进行了优化。用户可以免费创建账户并访问少量模板（图
    7-24）。PRO 用户每月支付 9.99 美元，可以访问额外的约 100 个模板。它还声称其图像库中有超过 1,000 个图标和图形，供潜在设计师将其整合到自己的设计中。（[``www.piktochart.com`](http://www.piktochart.com))）


    ![c07f024.png](img/c07f024.png)


    **图 7-24：** Piktochart 界面


    ## Venngage


    Venngage 是一个在线信息图创建网站，其开发人员与开发第 4 章 中提到的“信息图简历”的 Vizualize.me 信息图简历网站相同。上传你的数据，然后根据模板定制设计以匹配你的品牌或风格（图
    7-25）。提供免费账户和每月 19 美元的 Pro 账户。（[``venngage.com`](http://venngage.com))）


    ![c07f025.png](img/c07f025)## Visual.ly


    Visual.ly 主要是一个信息图画廊网站，但它最近推出了“Visually Create!”部分，用户可以在那里根据图 7-26 中的预设模板创建信息图，并连接
    Facebook 或 Twitter 等社交媒体。（[``create.visual.ly`](http://create.visual.ly))）


    ![c07f026.png](img/c07f026.png)


    **图 7-26：**](#c07.xhtml_figureanchor7-26) Visually Create!


