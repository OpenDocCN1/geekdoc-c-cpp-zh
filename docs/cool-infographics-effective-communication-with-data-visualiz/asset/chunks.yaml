    ### Infographic Posters


    Along with the explosion of online infographics, a subindustry has begun to emerge
    dedicated to designing and selling large, wall-hanging infographic posters to
    the public. These niche designers have created some amazing designs and are creating
    businesses selling these posters online.


    Instead of designing these posters to client specifications, this business model
    allows the designers to choose their own topics, select the data they want to
    include, and design the complete infographic poster based on their own design
    tastes and sense of style. These face the same risks as any consumer product.
    The topics and data research are completely done by the designers, and they are
    taking a chance that their choices will be popular enough to generate sales.


    #### Infojocks


    Infojocks.com is a site dedicated to sports-related infographic poster designs
    from infographic designer Jeremy Yingling. Self-described as the art of sports
    statistics, Infojocks has infographic poster designs covering the NFL, NHL, NBA,
    college teams, and other specific team histories. `[Figure 2-18](#c02.xhtml_figure2-18)`
    is the infographic poster titled, `Hockey: History of the Stanley Cup.`


    ![c02f018.tif](image_fi/582305c02/c02f018.png)


    [**FIGURE 2-18:**](##c02.xhtml_figureanchor2-18) `Hockey: History of the Stanley
    Cup` poster, Infojocks.com


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-18`](#c02.xhtml_figureanchor2-18)


    #### HistoryShots.com


    HistoryShots.com was created by Larry Gormley and Bill Younker, and they sell
    designs that combine information and art. Their designs are usually focused on
    the historical timeline or evolution of a particular topic, and the posters are
    printed on museum-grade papers. Meticulously researched, they offer amazing designs
    based on their interests in pop culture, sports finance, and politics. `[Figure
    2-19](#c02.xhtml_figure2-19)` shows the incredibly detailed poster, `Genealogy
    of Pop/Rock Music` by designer Reebee Garofalo.


    ![c02f019.tif](image_fi/582305c02/c02f019.png)


    [**FIGURE 2-19:**](##c02.xhtml_figureanchor2-19) `The Genealogy of Pop/Rock Music`
    poster, Reebee Garofalo, HistoryShots.com


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-19`](#c02.xhtml_figureanchor2-19)


    #### Timeplots


    Timeplots.com is an information graphics firm founded by Nathaniel Pearlman. Located
    in Washington, DC, Timeplots has released a number of highly detailed infographic
    posters covering the historical timelines of various political topics. It has
    some fantastic designs covering the history of the Presidency, the Supreme Court,
    the Senate, the House of Representatives, both major political parties, and more.
    Figure 2–20, `A Visual History of the American Presidency` is the poster that
    visualizes details about election results and the state of the country during
    each term.


    #### Pop Chart Lab


    PopChartLab.com is an infographic poster design firm located in Brooklyn, New
    York, founded by Patrick Mulligan and Ben Gibson. They have created some amazingly
    detailed posters covering the evolution of Apple products (`[Figure 2-21](#c02.xhtml_figure2-21))`
    or incredibly complex network diagrams showing the relationships between the varieties
    of beer, the full array of culinary tools, a taxonomy of hip-hop, and many more
    mappings of cultural topics.


    ![c02f021.tif](image_fi/582305c02/c02f021.png)


    [**FIGURE 2-21:**](##c02.xhtml_figureanchor2-21) `The Insanely Great History of
    Apple` poster, PopChartLab.com


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-21`](#c02.xhtml_figureanchor2-21)


    ![c02f020.tif](image_fi/582305c02/c02f020.png)


    [**FIGURE 2-20:**](##c02.xhtml_figureanchor2-20) `A Visual History of the American
    Presidency` poster, Timeplots.com


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-20`](#c02.xhtml_figure2-20)


    ## Intellectual Property Issues


    Intellectual property law is a murky quagmire of legal opinion, interpretation,
    and confusion. Still, there are some fundamental issues that infographic designers
    must consider. The following observations are drawn specifically from the author’s
    experience with U.S. laws.


    Infographic designers have the responsibility to produce work that conforms to
    legal requirements and doesn’t put their company or their clients at risk. Clients
    expect designers to be the experts in these areas, and infographic designers should
    have a good understanding of these four areas:


    *   Copyright

    *   Creative Commons

    *   Trademarks and Fair Use Doctrine

    *   Using images and illustrations


    ### Copyright


    Copyright law exists to allow the creators of designs (the copyright holder) the
    ability to control how other people are allowed to use, copy, or distribute their
    creative works. Sharing creative work without first getting explicit permission
    in the form of a license is called copyright infringement and is generally regarded
    as illegal. This law is what enables creative professionals to charge for their
    work and also protects their work from being copied by competitors. It applies
    to any type of creative product, such as photographs, art, books, music, graphic
    designs, videos, and of course infographics.


    Designers make a living selling their creative work, and any time someone else
    uses their creative work without first getting a license, the designer loses potential
    income. When creative professionals find their work being used without their permission,
    the ugly process of cease-and-desist letters and lawsuits begins.


    In the United States there are essentially three basic levels of copyright protection.

