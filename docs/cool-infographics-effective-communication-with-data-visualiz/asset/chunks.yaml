- fmt: '

    The principles behind good infographic design have recently made their way into
    the resumes of individuals. Job candidates are looking for new ways to make their
    resumes stand out from the crowd, quickly communicate their top attributes, and
    be more memorable to the prospective employer who may review hundreds of resumes
    for an open position. Infographics are a fantastic way to tell your story to a
    potential hiring manager—and they’re cool too!


    This rising trend of infographic resumes is a hotly debated topic. Recruiters,
    candidates, resume writers, hiring managers, and human resources managers can
    have widely opposing, strong opinions. Some believe that adding any graphics to
    a resume is unprofessional and may lead to a candidate not being considered for
    a position. Many others are huge supporters of graphic resumes because they break
    the monotony of all-text resumes and stand out from the pile of resumes reviewed.


    As discussed in [Chapter 1](#c01.xhtml), “The Science of Infographics,” the research
    behind visual communication of information shows that visualizations can often
    be more effective than text alone. Although traditional illustrations and images
    are mainly appropriate for graphic designer-type roles, the advent of infographic
    design brings credible data visualizations to candidates seeking any type of role.
    Whether it’s a complete infographic design or just including small data visualizations
    in a text resume, visualizing a candidate’s key information on a resume is quickly
    becoming popular.


    Michael Anderson’s infographic resume shown in [Figure 4-1](#c04.xhtml_figure4-1)
    was one of the first infographics resume designs to be published online and go
    viral in social media. This caused me to originally take notice of the concept
    of infographic resumes. Posted online in 2008, the design was colorful, eye-catching,
    and broke the traditional resume mold. A link to Michael’s resume was posted on
    the Cool Infographics blog in 2010, but it was also featured on hundreds of sites
    and blogs including some mainstream sites such as Mashable, Business Insider,
    Fast Company, and FlowingData.


    ![c04f001.tif](image_fi/582305c04/c04f001.png)


    [FIGURE 4-1:](#c04.xhtml_figureanchor4-1) Infographic resume—Michael Anderson


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-1`](#c04.xhtml_figureanchor4-1)


    The infographic resume visualizes his work history as an area chart timeline,
    with work experience above the date line and his educational accomplishments below.
    His resume states that “Area represents relative energy expenditure over time,”
    which is a subjective value that Michael created to design the chart. The overlapping
    nature of the design is appealing because it also shows concurrent activities
    clearly. The Daily Intake and Output is a fun, lighthearted chart of the amount
    of each activity plotted over his waking hours from 8 a.m.–2 a.m.


    The Primary Skill Sets visualization is a doughnut chart with two dimensions.
    The angles of the pie slices represent his personal time spent developing each
    skill and the height of each slice shows the amount of time each skill has been
    used in a professional capacity. For example, it shows that Michael has spent
    a lot of personal time in photography, but that skill has not been utilized much
    in his professional career. Again, the values are estimated by Michael, so they
    are subjective and just meant to be indicative of his skills. Also, notice that
    no values are shown on any of the visualizations. Actual values had to be created
    to design the charts, but they aren’t shown because they aren’t needed. This removes
    unnecessary information and keeps the design simple.


    This design stands on its own as a preview to his full text resume. Because this
    design doesn’t replace his traditional resume, it gave Michael the opportunity
    to cut out most of the lengthy text descriptions and let the visualizations stand
    by themselves. It’s a great tool to attract the attention of both prospective
    employers and freelance clients, and anyone interested has the contact information
    required to learn more about Michael.


    The definition of an infographic resume is:


    > A visual account of an individual’s history and abilities that uses data visualization
    design to communicate key portions of a job candidate’s skills, history, education,
    or other relevant information.


    The key distinction that makes infographic resumes unique is that the graphic
    elements visualize important information and help tell a better story about the
    job candidate. It’s not just about adding graphic elements but communicating data
    or information more effectively.


    Graphic designers have been designing creative, colorful, artistic resumes with
    illustrations, fonts, images, and photographs for decades; however, the idea of
    using data visualizations to create a new style of resume has taken hold only
    in the last few years. A handful of designs began appearing online in 2008, as
    the awareness and popularity of online infographics was beginning to build momentum.
    The trend has continued to grow at an accelerated pace, and by January 2013, thousands
    of infographic resumes incorporating data visualization could be found online.


    In Figures [4-2](#c04.xhtml_figure4-2) and [4-3](#c04.xhtml_figure4-3), Faz Besharatian’s
    infographic resume appears next to his traditional text resume. His work history
    has been visualized in a timeline that highlights the length of time Faz spent
    in each role and the skills that were required.


    In this instance, there is more complete information contained in the text resume.
    The infographic resume serves three purposes: to attract attention, to highlight
    the roles and companies in his history, and to demonstrate his graphic design
    ability. If interested parties want to learn any of the details, such as accomplishments,
    responsibilities, or specific achievements within each role, they can learn more
    from the full-text resume. Faz makes both versions available for anyone to download
    from his website.


    It’s still the early days for infographic resumes, but they will probably become
    mainstream in the next few years. In the future, an all-text resume will be seen
    as boring and dated, reflecting poorly on the job seeker. Recruiters and hiring
    managers will appreciate the speed and ease of reading from infographic designs
    and will begin to experience frustration with the extra time and effort required
    to search for key information hidden within an all-text resume.


    The quality of these infographic designs covers the full spectrum. There are some
    fantastic, inspiring designs online, but there are also some cringe-worthy designs
    as well. As designers continue to experiment with different design styles, they
    are beginning to learn what works in the field of resumes. Most people design
    their own infographic resume. The market for professionally designed infographic
    resumes is a new type of service now offered by many designers and design firms.


    ![c04f002.tif](image_fi/582305c04/c04f002.png)


    [FIGURE 4-2:](#c04.xhtml_figureanchor4-2) Text resume—Faz Besharatian


    ![c04f003.tif](image_fi/582305c04/c04f003.png)


    [FIGURE 4-3:](#c04.xhtml_figureanchor4-3) Infographic resume—Faz Besharatian


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-3`](#c04.xhtml_figureanchor4-3)


    ## Key Benefits


    The three key benefits of infographic designs discussed in [Chapter 1](#c01.xhtml_c1)
    are what also make infographic resumes game changers to the job market.


    First, visual designs stand out from the pile of text-only resumes and attract
    attention. Hiring managers and human resources departments are skimming hundreds,
    if not thousands, of resumes for open positions. An infographic resume breaks
    the pattern and draws the reader’s attention. The first step to landing a new
    job is to get the hiring manager interested enough to learn more and an infographic
    resume can get a candidate that extra attention.

