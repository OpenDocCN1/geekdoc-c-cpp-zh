    Both the clickable and pop-up design style share one major drawback. The additional
    functionality of the clickable regions and pop-up information is only functional
    when viewed on the original landing page that includes all the extra HTML code.
    Whenever a reader shares the infographic image on another site, only the static
    image file of theoriginal infographic is shared.


    Another variation of this style is that many programs that have the capability
    to create the HTML Image Map files can also export the file into PDF format and
    maintain the clickable functionality. That means a designer can save the clickable
    infographic into a clickable PDF file. The resulting PDF file is then easy to
    send through e-mail or make available for download.


    The clickable PDF file is not only fully functional when viewed on the reader’s
    computer, but also when viewed on portable devices such as tablets and smartphones;
    all the clickable regions in the PDF file still function correctly and bring up
    the target URL addresses in the default web browser on the device.


    *My Visual Mapping Blogroll* designed by Claude Aschenbrenner ([`SerialMapper.com`](http://SerialMapper.com))
    in 2008 is an infographic design in the style of a subway map. It’s a PDF file
    available to view or download from the SerialMapper site ([`serialmapper.com/archive/2008/09/25/mise-en-seine-de-blogs.xhtml`](http://serialmapper.com/archive/2008/09/25/mise-en-seine-de-blogs.xhtml))
    and each blog listed at a node is a clickable link that takes the reader to the
    URL address of each blog ([Figure 1-33](#c01.xhtml_figure1-33)).


    ![c01f033.tif](image_fi/582305c01/c01f033.png)


    [**FIGURE 1-33:**](#c01.xhtml_figureanchor1-33) *The Visual Mapping Blogroll*


    [`coolinfographics.com/Figure-1-33`](http://coolinfographics.com/Figure-1-33)


    *Source:* My Visual Mapping Blogroll*, by Claude Aschenbrenner*


    ### Animated Infographics


    Animated infographics create some motion or change to the design as the reader
    watches. It might be the bars in a bar chart growing, a color change, or an animated
    character. These are differentiated from the video infographics (next) because
    these are not video files. These are animated with HTML code or an image file
    format to create the animation but can exist as an object on the web page.


    In the *Cheetah* infographic ([Figure 1-34](#c01.xhtml_figure1-34)) by Jacob O’Neal,
    the cheetah is animated as running in the infographic, along with some other smaller
    animations in the charts. You’ll have to follow the URL link to see the animation
    online. This is accomplished by using the animated GIF file format that displays
    a sequence of static images in a repeating loop. The result is a constantly moving
    animation that makes this design clearly stand out and get noticed.


    ![c01f034.tif](image_fi/582305c01/c01f034.png)


    [**FIGURE 1-34:**](#c01.xhtml_figureanchor1-34) Animated GIF image file used to
    create an animated infographic


    [`coolinfographics.com/Figure-1-34`](http://coolinfographics.com/Figure-1-34)


    *Source:* Cheetah*, Jacob O’Neal jacoboneal.com/cheetah)*'
