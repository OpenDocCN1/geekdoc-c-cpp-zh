    head of the Webspam team at Google, specifically mentioned this challenge with
    infographics during an interview with SEO expert Eric Enge²:


    This comment has a number of companies, SEO consultants, and infographic designers
    worried that Google may start discounting all infographic links across the board.
    Even beyond infographics, it’s a challenge for all types of link bait content
    (text articles, photos, videos, interactive pages, and so on) but infographics
    in particular have been used heavily for this type of SEO tactic.


    Now, a year after Matt Cutts’ comment, you haven’t seen this type of change yet,
    but Google makes major updates to its algorithms multiple times each year. They
    might figure out a method to differentiate unrelated link bait content and lower
    the impact of those links to the PageRank calculation.


    To protect against any form of link bait discounting in the future, companies
    and designers should focus on publishing relevant infographics. This can protect
    links to your site that are relevant to your business and should always be considered
    to be a valid endorsement of your site by the search engine algorithms.


    [Figure 3-7](#c03.xhtml_figure3-7), *Streamlining your digital life with the new
    iPad*, an infographic from NextWorth, is an example of relevance. Published shortly
    before the release of the iPad 3 in 2012, this design focused on many of the older
    electronic gadgets that the iPad’s functionality had replaced. NextWorth is in
    the business of buying back older consumer electronics gadgets from people and
    recycling them. The infographic design is fun, engaging, and relevant to the NextWorth
    business. A link to the infographic inherently should imply an endorsement of
    recycling old gadgets and supporting its business.


