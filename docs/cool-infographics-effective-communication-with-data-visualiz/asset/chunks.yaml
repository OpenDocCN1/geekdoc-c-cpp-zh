    **封面图片**

    Randy Krum


    我首先必须感谢 Wiley & Sons 的 Carol Long，她的问题“你考虑过写书吗？”最终促成了你手里的这本书。如果没有 Carol 对我的信心，我可能会无限期地推迟这件事。我特别感谢我的项目编辑
    Adaobi Tulton，感谢她的耐心以及对项目的热情。感谢 Nancy Gage ([coroflot.com/n-gage](http://www.coroflot.com/n-gage))、Ashley
    Zurcher、San Dee Phillips、Christine Mugnolo、Katie Wisor 以及汇编这本书的许多其他人。


    衷心感谢好朋友 Penny Sansbury 担任我的个人编辑。Penny 不仅带来了她的写作背景，还确保我能获得诚实的反馈。感谢设计师 Ray Vella，他调整了书中包含的数据可视化和信息图设计。


    我向全世界的信息图设计师表示感谢和鼓励。我对 Cool Infographics 博客的数千访问者和订阅者，以及多年来留言并提交信息图的所有读者者感激不尽。你们的工作教会了我，启发了我，并让我相信我们将从事这项工作很长时间。


    我还要感谢我的父母 Sue 和 Bill，他们总是鼓励我探索自己的兴趣，并教我不要害怕走自己的路。


    最后，我要感谢我的妻子 Mary Kaye，她是我最坚定的支持者。对于她鼓励我创立博客、创立自己的公司并最终开始写这本书，我怎么感谢都不为。我可以依靠她不断地含蓄地提醒我回归写作。


    # 1 引言


    我一直很喜欢数据。


    数据可以是巨大的数字表格、定量研究数据、业务流程、人口统计、财务结果、地图位置或网络统计数据。这并不重要——我热爱这一切。


    在电子表格或数据库中处理了几个小时的数据集后，我能够从数字中发现模式并获得有趣的发现。然而，没有其他人想那么详细地查看电子表格。他们不想看数据，只想理解结论。那时，我拥抱了数据可视化和信息图设计。


    如果我能将大量的数据点放在一个页面上，就能让观众更容易地理解它们之间的比较。人们可以看一个数据点，并理解它是如何融入整个数据集的。很久以后，我了解了支持数据可视化力量的理论和研究，但在当时我亲眼看到，对于大多数观众来说，眼见为实。如果我能将数据可视化，观众就能理解这些信息。


    在几家消费者产品公司的营销和产品开发部门工作时，我从这些可视化中挖掘灵感，用自己的数据创建视觉设计。我需要引导观众通过一系列信息，让他们理解我是如何得出结论的；我需要用数据讲述故事。我还确定，它必须在视觉上与不同才能被人记住。


    内部平面设计部门没有足够的时间来帮助演示文稿。他们忙于产品包装、网站和广告设计。我的机械工程学位——而非平面设计——意味着我必须自己学习信息设计。我是从数据端进入信息图领域的，并在过程中学习了设计。


    随着时间的推移，我的设计变得越来越好，数据可视化传达了强大的理解感和信力。我实践并学习了什么能引起观众的共鸣。我可能并没有打算成为一名信息图设计师，但那是我的最终归宿。


    2007 年，我启动了 Cool Infographics 博客 ([coolinfographics.com](http://coolinfographics.com))
    作为一个实验。我已经在收集我喜欢的优质信息图设计并挂在办公室的墙上，所以那些成了我在博客上发布的首批信息图。私下里，我不认为博客能持续超过一年，因为我担心材料会用光。幸运的是，信息图的认知度和普及在网上呈爆炸式增长，现在优质信息图比我所能发布的还要多。


