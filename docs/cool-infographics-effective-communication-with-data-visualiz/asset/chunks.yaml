  raw: 'It’s disappointing to see how many companies publish their new infographics
    online, and then just wait for people to come and find it. Many companies will
    spend a lot of time and resources to research data and design a good infographic
    but then choose not to spend any effort on marketing or promoting the infographic.
    Infographics are content pieces that need as much marketing support as articles,
    videos, advertisements, and even products.


    Before a company publishes an infographic, it should carefully consider a comprehensive
    Infographic Release Strategy to promote the infographic. When you have a good
    infographic design ready to publish, you want to make sure that you maximize the
    benefit you get in return from the infographic.


    Following are three key steps in an infographic release process:


    1.  Landing page


    2.  Self-promotion


    3.  Outreach


    A company doesn’t need to follow through with all these steps, but effort put
    into promotion can significantly improve the success of publishing an infographic.
    Most of this activity is just a commitment of effort on behalf of the company
    and doesn’t cost a lot of extra money.


    ### Landing Pages


    The first question that needs to be addressed is, “Where should you publish the
    infographic?” Infographics can be published online in a hundred different ways,
    but many of them are not effective. Should you host the infographic on your own
    site, your Flickr page, as a photo in Facebook, in a guest post on another site,
    on an infographic gallery site, or in a blog post?


    The answer depends on the company’s goal for the infographic project. Normally,
    a company wants to attract links and visitors to its website. In that case, a
    company should create a dedicated infographic landing page within its own website.
    That way it’s on a site that the company controls and is not dependent on any
    outside companies or services. Also, publishing and hosting the infographic on
    its own dedicated page gets all the benefit from the links and page views, as
    well as retaining complete control over the content on the page.


    The landing page should have a short, simple URL, which can be used as the clear
    destination for links to the infographic. By pointing all the traffic and links
    to one dedicated landing page, it can have the best chance to achieve a high score
    within the search engine rankings as opposed to spreading the links across multiple
    locations. Also, a number of people will be typing in the web page address to
    find the infographic, so a short and simple URL can be important. A long, complicated
    URL may discourage visitors.


    There are exceptions, though. If the goal is to build an audience for the company’s
    Facebook Fan Page, developing an infographic and publishing it as new image content
    on Facebook would be perfectly acceptable. Links would bring new people to the
    company Facebook page and attract new followers.


    #### The Image Problem


    When it comes to infographics, here’s the problem. [Figure 3-12](#c03.xhtml_figure3-12)
    shows how your infographic appears to the search engine spiders. It’s just an
    image asset on the page with no content because the web spiders crawling sites
    for content can’t tell what’s included in an image or an infographic. They can’t
    determine your topic, your keywords, your data sources, your key message, or any
    relevant information. Without text to gather and parse, the spider has nothing
    to send back to the search engine index.


    ![c03f012.tif](image_fi/582305c03/c03f012.png)


    [**FIGURE 3-12:**](#c03.xhtml_figureanchor3-12) Search engines just see a blank
    image asset on the web page.


    The search engines have begun to experiment with software for face recognition,
    optical character recognition (OCR) and similar image searches to add context
    to an image, but these tools are not very effective. It’s up to the infographic
    publisher to tell the search engines all about the infographic by adding text
    to the page, both visible and hidden. The dedicated HTML web page where the original,
    full-size infographic is hosted online is called the infographic landing page.
    You need to add text to the page describing the content and using the keywords
    that you want to be related to the infographic. The text is what determines the
    context and relevance of the infographic, and it’s also the only way a search
    engine can truly know when to display a link to the infographic when it shows
    search results to its users.


    There are a number of important page elements that should be included on an infographic
    landing page. For this purpose, imagine publishing a fictional infographic called
    *SEO Strategies Used by the Experts*. This doesn’t exist as an infographic on
    the Internet today, but it may in the future. For purposes of this example, also
    make the assumption this is a well-designed infographic that tells a visually
    engaging story that people will want to share. That might be a big assumption,
    but if you start with a bad design, most of this effort to support the release
    of the infographic won’t have much impact.


    #### Keywords


    The cornerstone of any SEO strategy is focusing on a short list of keywords. Keywords
    can be defined as the most common words entered into search queries when people
    search for information about a specific topic. Different keywords exist for various
    company sites based on the differences in industry, products, services, and information
    that each company offers—even different keywords for the different pages on each
    company’s website.


    Companies want to make sure that their site pages are considered by the search
    engines to be highly credible and relevant to the words related to their business.
    As a very simple example, Nike wants to be relevant for keywords like *shoes*
    and *footwear*, and Ford wants to be relevant for keywords like *cars* and *trucks*.


    It’s important to understand the keywords that people are actually using when
    searching. If a car dealership creates content using the words “pre-owned car,”
    their content may not appear in the results for someone searching with the more
    common words “used car.” Sometimes, search engines will understand that the two
    terms are related, but often they don’t. Research should be done ahead of time
    to determine the most popular terms already being used to find similar content.


    When publishing an infographic, it is helpful to create a short, specific list
    of target keywords that you would like the infographic be associated with and
    then use those keywords consistently on the landing page. For your fictional infographic,
    the list of keywords might look like this:


    1.  SEO


    2.  Search


    3.  Experts


    4.  Strategies


    5.  Marketing


    This fictional infographic example is fairly simple with single keywords, but
    you can also promote multiple-word keyword phrases.


    #### Landing Page URL


    Search engines will take into account the words used in the URL of the infographic
    landing page on your website as a potential place to find relevant keywords. So,
    the best URLs use natural words that are easy for the search engines to parse
    and separate the words with hyphens (dashes) to clearly break them apart because
    spaces are not allowed in a URL address.


    Google has publicly acknowledged that it considers hyphens to be word separators
    and underscore characters as word joiners. Don’t use an underscore character unless
    you are purposely trying to combine words together. If you use the underscore
    character to separate words such as SEO_Experts, the search engines combine the
    words together in the index as the one-word SEOExperts. So, your landing page
    URL should look something like this:


    [`http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml`](http://coolinfographics.com/SEO-Strategies-Experts-Infographic.xhtml)


    It’s also helpful to keep the URL as short as possible because some readers get
    to your infographic by typing in the address.


