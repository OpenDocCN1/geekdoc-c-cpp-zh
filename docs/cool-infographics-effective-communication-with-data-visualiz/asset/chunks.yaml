    \n相关性是搜索引擎的圣杯。人们希望结果与他们的查询内容紧密相关。\n\n—MARC OSTROFSKY, *《点击致富！*\n\n# 3\n\n信息图表与\
    \ SEO\n\n通常，在线信息图表设计的目标是增加公司网站的流量和链接。发布信息图表的公司希望建立其品牌（或产品）的知名度和资产价值，并提高其与其业务相关的搜索引擎结果中的排名。\n\
    \n这是搜索引擎优化（SEO）策略的领域。在过去的几年中，信息图表已成为公司的一种强大内容工具，用于鼓励站点链接并提高网站的整体相关性。当公司在其网站上发布引人入胜、设计良好的信息图表时，许多人会在自己的网站上发布它，并带有指向回公司的链接，并在社交媒体上与自己的朋友和粉丝网络进行分享。\n\
    \n搜索引擎通过计算网页的信誉和权威评分，作为量化其与特定关键词相关性的一种方式。它们使用复杂的专有算法，利用许多不同的信号。其中，一些信号用于判断相关性，另一些用于判断内容质量，还有用于判断互联网上的整体重要性。最著名的的是\
    \ Google PageRank 分类器，它通过考虑指向该页面的链接数量和质量来确定其地位。所有这些因素共同决定了网页针对特定搜索的搜索引擎排名分。\n\n\
    某个特定公司的网站页面针对特定搜索的得分越高，该页面的搜索引擎排名分就越高。\n\n## 搜索引擎的挑战\n\n搜索引擎也是经营业务，它们需要为客户提供有价值的服务以留住他们。如果你进行搜索但结果与你寻找的内容并不接近，会对搜索引擎的品牌产生负面影响。\n\
    \n制作你所依赖的（并理所当然的）搜索结果是一个极其困难的技术问题。每家搜索引擎公司（Google、微软 Bing 等）都拥有自己的爬虫爬取网络上的所有页面，以解析每个页面的文本和链接。它们创建了庞大的互联网索引，然后通过查询索引来为搜索用户提供一份整洁的相关结果列表。\n\
    \n"
