    The use of the animated GIF image file format has a significant additional advantage.
    Because the animation is completely contained within the image file, the animation
    will function when posted on other sites and blogs. This is in contrast to other
    designs using code to create an animated infographic, which is much harder to
    share.


    *How Far is it to Mars?* shown in [Figure 1-35](#c01.xhtml_figure1-35) is an animated
    infographic design built into a webpage. Created by David Paliwoda and Jesse Williams,
    the design visualizes the distance between Earth and Mars at a scale that makes
    planet Earth a diameter of 100 pixels on screen. Clicking on the arrow at the
    bottom of the screen begins the animation of scrolling the page to the orbit of
    the Moon and eventually to the planet Mars. The visual motion of the star field
    and the amount of time it takes before Mars appears on the screen gives the audience
    a clear understanding of how far apart the planets truly are.


    ![c01f035.tif](image_fi/582305c01/c01f035.png)


    [FIGURE 1-35:](c01.xhtml_figureanchor1-35) Animated infographic begins when clicked
    by the viewer


    [`coolinfographics.com/Figure-1-35`](http://coolinfographics.com/Figure-1-35)


    *Source: David Paliwoda and Jesse Williams*


    ### Video Infographics


    Video infographics are still fairly new but quickly gaining momentum online because
    of the ease of usability on video sharing sites such as YouTube and Vimeo. The
    ability to embed fully playable videos from these sites into blogs and social
    media posts has caused a tremendous increase in the traffic and value of video
    infographics to marketers.


    The first video infographic I posted about on Cool Infographics in 2007 was the
    music video for “Remind Me,” by Royksopp (`youtube.com/watch?v=eo4u4JJAPGk`](http://youtube.com/watch?v=eo4u4JJAPGk)).
    The video is a story about a day in the life of a young woman living in London.
    The data visualizations in the video are about the details behind modern life
    that surround her, like showing how the plumbing system in her apartment works
    while she is shown brushing her teeth. This video set a high standard for the
    video infographic designs that followed ([Figure 1-36](#c01.xhtml_figure1-36)).


    ![c01f036.tif](image_fi/582305c01/c01f036.png)


    [FIGURE 1-36:](c01.xhtml_figureanchor1-36) “Remind Me” by Royksopp video infographic


    [`coolinfographics.com/Figure-1-36`](http://coolinfographics.com/Figure-1-36)


    Other video infographics are not made with high-end animation software applications.
    Many of the most popular video infographics online have been made using readily
    available presentation software applications such as Microsoft PowerPoint, Apple
    Keynote, and Prezi. Using the animated slide transitions and careful timing steps
    to automate the entire presentation, a presentation can be exported as a video
    file for distribution.


    The “Did You Know? Shift Happens” video infographic by Karl Fisch, Scott McLeod,
    and Jeff Brenman (`youtube.com/watch?v=ljbI-363A2Q`](http://youtube.com/watch?v=ljbI-363A2Q))
    started out as a PowerPoint presentation to the faculty at Arapahoe High School
    in Centennial, Colorado in August 2006. The initial video was remixed to remove
    the school-specific information and uploaded to YouTube in 2008. It quickly went
    viral, and that one infographic video had more than 5.6 million views by the end
    of 2012 ([Figure 1-37](#c01.xhtml_figure1-37)).


    ![c01f037.tif](image_fi/582305c01/c01f037.png)


    [FIGURE 1-37:](c01.xhtml_figureanchor1-37) “Did You Know? 3.0” Infographic video


    [`coolinfographics.com/Figure-1-37`](http://coolinfographics.com/Figure-1-37)


    These videos didn’t use many data visualizations (most of the data was shown in
    text only), but it did a good job of putting the numbers into context for the
    audience. That initial video has spawned a series of updates over the subsequent
    years and has grown to become probably the most successful video infographic campaign
    to date. Over the last 5 years, it has become a series of videos with the help
    of design firm XPLANE (`xplane.com`](http://xplane.com)) and began using more
    advanced animation software tools. By the end of 2012, the entire series of videos
    had more than 33 million views online. A complete wiki site has been created around
    the history of the video series at [`shifthappens.wikispaces.com/`](http://shifthappens.wikispaces.com/).


    ### Interactive Infographics


    Interactive infographics are designs that give readers some control over the data
    or the visualization displayed. They are also popular because they keep the readers
    engaged with the data for a much longer period of time than static infographics.
    Some of these sites are standalone data visualizations, and others are built into
    a larger infographic design.


    *The New York Times* website has become recognized by many as the world leader
    in interactive infographics and data visualizations. [Figure 1-35](#c01.xhtml_figure1-35)
    shows a map of 2012 election. Each county in the map is colored a shade of red
    or blue depending on the final tally. The user can zoom into specific states,
    view the data for each county, and change the display based on the choices.


    ![c01f035.tif](image_fi/582305c01/c01f035.png)


    [FIGURE 1-35:](c01.xhtml_figureanchor1-35) *The New York Times* 2012 election


    [`coolinfographics.com/Figure-1-35`](http://coolinfographics.com/Figure-1-35)


    Some companies design and provide data visualization tools for others. Tableau
    Software is one of the leaders in this area and makes its Tableau Public version
    of their product available for free. The tool enables us to use our own data to
    create visualizations and then embed the visualizations into our websites to include
    interactive data visualization within a larger infographic design. *Super PACs*
    ([Figure 1-36](#c01.xhtml_figure1-36)) was designed by Jess Bachman at Visually,
    Inc., using Tableau visualization modules as the charts within the design. As
    a result, all the charts are interactive, and the reader can adjust any of them
    by clicking to highlight different information.


    ![c01f036.tif](image_fi/582305c01/c01f036.png)


    [FIGURE 1-36:](c01.xhtml_figureanchor1-36) *Super PACs*


    [`coolinfographics.com/Figure-1-36`](http://coolinfographics.com/Figure-1-36)


    *Source: Visually, Inc.*

