    The main purpose of a prior art search is to help make sure that your design doesn’t
    repeat what has already been done. You don’t want to replicate the same topic
    or use the same data visualizations in your design that were already used in another
    infographic. Your infographics should be unique, so you should also look to avoid
    any similar illustrations or color palettes used in prior designs.


    The infographics you gather in a prior art search can also help identify potential
    data sources for your infographic. You may follow the source links and find more
    data to help build your own design.


    From a promotional aspect, many mainstream media sites and publications will not
    post an infographic if the topic is exactly the same as a similar infographic
    they have already published in the past. Use the prior art search to help avoid
    duplicating an infographic topic that has already been done.


    When you publish your infographic online, your prior art search can also help
    you build a list of sites to include in your outreach communication. Search for
    sites and authors that shared the previous infographics from your prior art search.
    Because your topic is similar (but not the same), these same people may also be
    interested in sharing your infographic with their audiences.


    ## Focus on the Key Message


    One of the first things I ask clients to do at the beginning of an infographic
    design project is to define the `key message` they want to communicate to the
    audience. The key message is the primary information you want the readers to understand
    and remember after reading your infographic. The challenge for designers that
    want to make their infographics easy to understand is to include the data and
    information needed to communicate and support the `key message`, but eliminate
    everything else.


    Ideally, an infographic needs one clear message, and all the data visualizations
    and illustrations support that central message. Just because there is more data
    available doesn’t mean you need to include it in the design. Many companies mistakenly
    believe that if they put several different data points into one infographic, it
    increases their credibility because it demonstrates how much data they have.


    You wouldn’t believe how many infographic designs struggle with this concept.
    If a design contains too much information, or doesn’t have a clear story, it becomes
    confusing to the reader. When this happens, the readers usually give up and don’t
    spend the time to figure out the message. By including too much information, you
    can actually communicate nothing to the readers.


    ### The 5-second Rule


    Why is the key message so important? It’s a reader attention span problem similar
    to consumer product packaging on a crowded store shelf, articles in a newspaper,
    or a pile of job candidate resumes. Most readers are going to read an infographic
    for only a few seconds. They’re skimming, and this is how the majority of readers
    will interact with your infographic. An infographic designer needs to approach
    the design process with this fact in mind.


    A rule of thumb is that the design needs to clearly communicate the key message
    to the readers in less than five seconds. This is the `5-second rule`, and comes
    from my own web analytics of millions of page views on the `CoolInfographics.com`
    site over the last five years. Most of the page view duration times are 5–10 seconds,
    and a good infographic design needs to successfully communicate its key message
    to the readers within that time. That way the infographic can communicate its
    main point to all the readers, even when they are skimming and they don’t take
    the time to read the entire infographic.


    `Where’s Google making its money?` (as shown in [Figure 6-6](#c06.xhtml_figure6-6))
    is a great example of a design that succeeds within the 5-second window. Designed
    by `NowSourcing` for `WordStream`, this infographic was popular and heavily shared
    in social networks. Within 5 seconds, the reader understands that Google makes
    most of its money from advertising, and what a few of the top keyword categories
    are. Even if that’s all readers understand before they move on to the next infographic,
    the design was successful in communicating its key message.


    ![c06f006.tif](image_fi/582305c06/c06f006.png)


    [**FIGURE 6-6:**](#](#c06.xhtml_figureanchor6-6) Where’s Google making its money?


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-6-6)[`Figure-6-6`](#c06.xhtml_figure6-6)


    *Source: How Does Google Make Its Money: The 20 Most Expensive Keywords in Google
    AdWords, Wordstream*


    Listing all 20 top keyword categories in the pie chart design is interesting data
    and helps build `WordStream`’s credibility for analyzing keywords. However, understanding
    the fine details that conference calls are the #11 keyword category is not necessary
    for the audience to understand the key message that Google makes its money from
    advertising. There’s plenty of other data and information available about Google,
    but in this infographic it’s all ignored, so the design can focus on passing its
    key message to readers quickly.


    Readers appreciate infographics that get to the point quickly.


    ### Tell One Story Really Well


    Another way to approach this idea is to focus all the information in the infographic
    to tell one story really well. Don’t try to tell a bunch of small stories. One
    of the secrets to any type of clear communication is to keep the information focused
    and eliminate any data that isn’t directly related. Infographic designs that visualize
    data just because it’s available become cluttered, and the readers don’t know
    what data to focus on.


    [Figure 6-7](#c06.xhtml_figure6-7) is one of my designs called `The Caffeine Poster`.
    The infographic focuses on visualizing the caffeine content of a bunch of different
    popular drinks so that readers can understand how much caffeine they would ingest
    if they choose a particular beverage. The design completely focuses on caffeine
    content, even though there is much more data available. Extra information about
    the parent companies, different sizes of the drinks, annual sales figures, geographic
    locations, and data about other ingredients were all eliminated to keep the design
    completely focused on caffeine content.


    ![c06f007.tif](image_fi/582305c06/c06f007.png)


    [**FIGURE 6-7:**](#c06.xhtml_figureanchor6-7) Focus on telling one story really
    well.


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-6-7)[`Figure-6-7`](#c06.xhtml_figure6-7)


    *Source: The Caffeine Poster, InfoNewt*


    ## Visualize When Possible


    In an infographic design, the more data you visualize, the better. You can use
    data visualizations, charts, graphs, icons, illustrations, and diagrams as design
    tools to help to make complex information easier to understand for the readers.


    Visualizing the data helps with:


    *   Grabbing the attention of readers

    *   Reducing the amount of time it takes readers to understand the data

    *   Providing context to the data by showing a comparison

    *   Making the key message more memorable with the Picture Superiority Effect

    *   Making the information more accessible to readers who speak other languages


    The whole point of designing an infographic is to make complex information easier
    to understand and interesting to the audience. To accomplish that, the infographic
    designer needs to visualize the data.


    In contrast, infographic designs with a lot of text and numbers might appear at
    first glance to be complicated and intimidating to readers. If the infographic
    seems like it would take a long time to read through, most readers won’t even
    try. They will move on to something else and leave the infographic behind without
    reading it.


    ### Big Fonts Are NOT Data Visualizations

