- fmt: '

    Now the readers have a way to comprehend the original number by comparing it to
    something they might be familiar with. They might think: “The number of global
    Internet users is more than seven times larger than the total population of the
    United States. That’s a lot of Internet users!”


    By providing the second number as a comparison, the designer can control the context
    that the audience uses to understand the data. Visualizing the two numbers taps
    into the pattern recognition of the brain, and even if the audience doesn’t already
    know the population of the United States, they can see the comparison between
    the two values. Context is a powerful tool for the designer.


    However, with great power comes great responsibility. `All data visualization
    is biased.` This upsets a lot of people that want data visualizations to be objective
    and “true to the data.” By putting numbers into context for readers, the designer
    is shaping the perception of the values. This introduces bias into the data visualization.


    The choices a designer makes bring bias to the design. Just by choosing which
    numbers to include in the visualization for comparison creates some bias in the
    design. What numbers are left out? How far back in time should data be used to
    show a trend? How recently was the data collected? All of these choices introduce
    small and large elements of bias to the design.


    [Figure 1-15](#c01.xhtml_figure1-15) changes the reference value used to create
    context to be the estimated total population of Earth.^([15]) Now the original
    value appears smaller in comparison because only approximately one-third of the
    world population has access to the Internet. This changes the reader’s perception
    and understanding of the original value.


    ![c01f015.tif](image_fi/582305c01/c01f015.png)


    [**FIGURE 1-15:**](#c01.xhtml_figureanchor1-15) Providing a different second value
    for context


    Notice the data visualization style is changed between the two examples. In the
    first visualization, not everyone in the United States has access to the Internet,
    so they display as two separate circles. In the second visualization, all Internet
    users are part of the total population of the planet, so the reader can visualize
    them as a portion of the total in a pie chart.


    Designers need to balance two conflicting demands—the need to communicate a message
    and the need to minimize bias in the design. Designers struggle with this challenge
    every day.


    ### The Picture Superiority Effect


    Probably the strongest way that visual systems can benefit us is in memory retention.
    People remember pictures better than words, especially over longer periods of
    time. This phenomenon is called the `Picture Superiority Effect`.


    Even without understanding the science behind the concept, advertisers have known
    this intuitively for many years. Even in simple applications such as the `Yellow
    Pages`, listings that include pictures are more successful. People are more likely
    to remember the company advertised if there was an image included in the listing.


    This is also the primary reason why companies design logos for themselves, as
    seen in [Figure 1-16](#c01.xhtml_figure1-16). People are more likely to remember
    the company logo, an illustration representing the company, than the actual name
    of the company. When it comes to purchase decisions, consumers are more likely
    to buy products from familiar companies. When buyers are in a store looking at
    products on the shelf, they are more likely to choose the products from companies
    they recognize, and logos are more likely to be remembered. Companies know this,
    and are very careful to design their product packaging to clearly show the company
    or brand logo.


    ![c01f016.tif](image_fi/582305c01/c01f016.png)


    [**FIGURE 1-16:**](#c01.xhtml_figureanchor1-16) Consumers are more likely to remember
    a company’s logo than the text of the company name


    Based on research into the Picture Superiority Effect ([Figure 1-17](#c01.xhtml_figure1-17)),
    when we read text alone, we are likely to remember only 10 percent of the information
    3 days later. If that information is presented to us as text combined with a relevant
    image, we are likely to remember 65 percent of the information 3 days later!^([10])


    ![c01f017.tif](image_fi/582305c01/c01f017.png)


    [**FIGURE 1-17:**](#c01.xhtml_figureanchor1-17) Picture Superiority Effect


    Combining relevant images with your text dramatically increases how much your
    audience remembers by 650 percent!


    However, it’s not just any image. It needs to be an image relevant to the content,
    which reinforces the message from your data. This works in advertisements, presentation
    slides, posters, brochures, websites, billboards, and, of course, infographics.
    A simple text message combined with a relevant image can make a lasting, memorable
    impression on your audience ([Figure 1-18](#c01.xhtml_figure1-18)).


    ![c01f018.tif](image_fi/582305c01/c01f018.png)


    [**FIGURE 1-18:**](#c01.xhtml_figureanchor1-18) Getting information from the Internet


    [`coolinfographics.com/Figure-1-18`](http://coolinfographics.com/Figure-1-18)


    *Source: The Information Hydrant*, Will Lion, 2008*


    In 1917, artist and illustrator James Montgomery Flagg designed the still-famous
    “I Want YOU for U.S. Army” poster ([Figure 1-19](#c01.xhtml_figure1-19)) that
    combines a simple text message with a dramatic image.^([16]) This poster is still
    recognizable and remembered 100 years later because of the Picture Superiority
    Effect. Without the image, no one would remember these.


    ![c01f019.tif](image_fi/582305c01/c01f019.png)


    [**FIGURE 1-19:**](#c01.xhtml_figureanchor1-19) “I Want YOU” poster from World
    I


    In infographic design, the Picture Superiority Effect is extended to include charts,
    graphs, and data visualizations. Infographic designers use data visualizations
    and illustrations as the visual component to trigger the Picture Superiority Effect,
    which can have incredible success getting the audience to remember the information.
    The secret is that the visualization needs to stand out. Just because you include
    a chart doesn’t make a design interesting. The visualization must be unique and
    impactful. Just as seeing a presentation full of similar charts can put an audience
    to sleep, if an infographic designer uses the same chart style over and again,
    the audience won’t remember the difference. Designers can spend a lot of time
    working on the design of one data visualization to find a new style or visualization
    method. This long amount of time focused on one chart design can contribute to
    why many people mistakenly think that infographic design is just making charts
    pretty.


    In 2010, Sam Loman designed the infographic *Underskin*, shown in [Figure 1-20](#c01.xhtml_figure1-20).
    The design maps eight different systems within the body (Digestive, Respiratory,
    Arterial, and more) and highlights the major connection points using the visualization
    style of a subway map. The design was unique and stood out because it wasn’t a
    text list or a bunch of callouts on an image of an actual human body. Even though
    the subway map design style was well known, it had never been applied to this
    medical topic before, and the design stood out dramatically compared to other
    medical sources. Even though it was intended for a medical audience, the design
    went viral with the general public online on many nonmedical sites such as Gizmodo,
    Behance, Vizworld, Information Aesthetics, Neatorama, Flickr, and Cool Infographics.


    ![c01f020.tif](image_fi/582305c01/c01f020.png)


    [**FIGURE 1-20:**](#c01.xhtml_figureanchor1-20) *Underskin* by Sam Loman


    [`coolinfographics.com/Figure-1-20`](http://coolinfographics.com/Figure-1-20)


    *Source:* Underskin *by Sam Loman*

