    Randy 是一位面向在线和内部使用的数据可视化与信息图设计师。他也是会议、专业组织、MBA 课程以及政府机构的频繁演讲者。凭借机械工程学位（而非平面设计学位），他在消费者产品公司工作了
    15 年，曾被选为 2012 年中央情报局演讲员，专注于用数据讲述视觉故事。


    # 致谢


    **执行编辑**

    Carol Long


    **高级项目编辑**

    Adaobi Tulton


    **技术编辑**

    Nancy Gage


    **制作编辑**

    Christine Mugnolo


    **拷贝编辑**

    San Dee


