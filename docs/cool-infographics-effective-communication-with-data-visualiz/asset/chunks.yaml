    link to the website homepage. A small, nimble startup might be willing to add
    a link to the homepage within minutes.


    [Table 3-1](#c03.xhtml_table3-1) shows the most effective places companies can
    add links to an infographic they have published.


    | **Website Area** | **Description** |'
