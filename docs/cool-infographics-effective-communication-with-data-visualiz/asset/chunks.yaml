    However, keep any included text links relevant to the infographic topic. Some
    infographic landing pages have text links to unrelated pages, so they could build
    on the success of the infographic. Although it can be effective, readers see this
    as spammy.


    #### Infographic Image Filename


    The search engines even look at the name of the infographic image file to try
    to find words that describe the content. If the image filename is just numbers
    identifying the image, such as IMG1234567.jpg, the search engines just ignore
    it, but you don’t want to miss any opportunities to link your keywords to the
    infographic. The easiest thing to do here is to use the main words from the title
    tag as the filename. So following your fictional infographic, this could be the
    filename of the infographic image you load onto the landing page:


    SEO-Strategies-Experts-Infographic.JPG


    Just like the preceding landing page URL, the filename should use hyphens as word
    separators. Avoid using underscore characters between words, because Google considers
    those to be word joiners.


    #### Alt Text Description


    An important HTML element for infographics is the alt attribute of images that
    enables the browser to display text describing an image when displaying images
    on-screen has been turned off in the browser. Due to modern Internet access speeds,
    the practice of viewing web pages without displaying images is rare, but the HTML
    element remains and is used heavily for search engine indexing.


    The alt text description should be written as a brief description in natural language.
    The content here should ideally be a single sentence to describe the infographic
    and can also be used by many screen readers for people with visual impairments.
    Accessibility software will speak the text of the alt description out loud for
    people that have trouble seeing the images, which makes a natural language description
    that much more important.


    The alt text description is included in the HTML code that identifies the actual
    image file displayed on the page.


    ```

    <img src=" SEO-Strategies-Experts-Infographic.jpg" alt="Top SEO strategies used
    by expert marketing consultants to improve the PageRank of web pages">

    ```


    The one thing you don’t want to do is to stuff the alt text description with a
    long string of keywords. Not only is this practice spammy, but also the search
    engines can recognize this and will reduce any value the alt text description
    would have provided to the page. This is also incredibly rude and irritating to
    the visitors that use a screen reader.


    #### Social Media Sharing Buttons


    An infographic landing page should absolutely include sharing buttons for the
    major social media networks. Companies should make sharing their infographic as
    easy and painless as possible, and including the sharing buttons on the landing
    page is the most popular way to share the infographic.


    One way to add buttons to the landing page is to use separate, individual, dedicated
    buttons from each of the social networks. A web developer can copy and paste the
    HTML code provided by each social network site onto the page. This method keeps
    the relationship simple and direct between the landing page and the social network
    but requires more work by the web developer.


    The more popular way is to use one of the sharing button aggregator services.
    These services enable developers to add only one block of HTML code to the landing
    page which displays a number of buttons for the various networks. The major advantage
    of this method is the convenience of one central service for both the code and
    the tracking analytics. The downside may be that the aggregator also has access
    to your analytics, if that is a concern.


    The major sharing button aggregator services are:


    *   AddThis: [`www.addthis.com`](http://www.addthis.com)


    *   ShareThis: [`www.sharethis.com`](http://www.sharethis.com)


    *   AddToAny: [`www.addtoany.com`](http://www.addtoany.com)


    In practice, sharing buttons should always be displayed “above the fold” on the
    landing page—meaning, they should be visible at the top of the page without any
    scrolling. Many readers will only view the top portion of the infographic and
    make the choice to share it in their social networks. Only a small portion of
    the readers make it all the way to the bottom of the page, so it’s less effective
    to place the sharing buttons there.


    In some cases, especially for very tall infographics, sharing buttons can also
    be repeated at the bottom of the page as an added convenience for the reader.


