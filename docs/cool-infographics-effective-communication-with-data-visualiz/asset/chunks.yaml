    Using big fonts in an infographic to make the numbers stand out is not data visualization.
    This is a big pet peeve of mine, and it’s done by designers in thousands of infographic
    designs and PowerPoint presentations. Displaying the number in a large font doesn’t
    make it any easier for the audience to understand.


    As mentioned in [Chapter 1](#c01.xhtml_c1), “The Science of Infographics,” data
    visualization is the language of context. One of the best ways to clearly communicate
    a new statistic with the audience is to show it in comparison to some information
    that it already understands. If the new information is shown as text alone, there’s
    no context or frame of reference to help the reader to gain an understanding from
    the value.


    [Figure 6-8](#c06.xhtml_figure6-8) shows an example of a statistic shown as text-only
    that might be included in an infographic. The common format is to show the data
    value in a large bold font and the associated description in a smaller font. The
    large font is intended to make the number stand out on the page and visually imply
    that the value is important.


    ![c06f008.tif](image_fi/582305c06/c06f008.png)


    [FIGURE 6-8:](#c06.xhtml_figureanchor6-8) Big fonts are NOT data visualizations.


    Reading is a slower process than pattern recognition, and this text doesn’t give
    the reader any clues about whether the value should be interpreted as a large
    or small amount. The audience is left to understand this value based on its personal
    experiences and perspective. The readers will mentally make their own evaluation
    of this value based on some information they already know. In this way, the designer
    loses control of how the audience interprets the data because it has no idea what
    frame of reference each individual reader will use as a comparison.


    ### Visuals Are Perceived as More Important


    Another aspect of visualizing data is that the audience perceives any data shown
    as text alone as less important or irrelevant. In many infographic designs, there
    is a mix of visualized data and data shown as text alone. [Figure 6-9](#c06.xhtml_figure6-9)
    demonstrates the previous text-only data point shown next to a second data point
    that was visualized. With an icon, color, and a doughnut chart to visualize the
    percentage as a portion of the complete 100 percent, that statistic becomes easier
    to understand.


    ![c06f009.tif](image_fi/582305c06/c06f009.png)


    [FIGURE 6-9:](#c06.xhtml_figureanchor6-9) Visualized data is perceived as more
    important.


    The visualized data in an infographic pulls the reader’s attention away from any
    other information shown only as text. This makes the text-only data points appear
    to be inferior or secondary information to the visualized data. When reading infographics,
    the text-only data is often skipped and ignored by the reader because it wasn’t
    important enough to visualize.


    It also goes back to the attention span issue as readers skim through infographics.
    They often focus only on the visuals and ignore the text because it’s faster.
    Remember the 5-second rule. Most audiences skim the infographic and don’t want
    to take the time to read all the text. They try to understand the message from
    the visuals alone and only a small portion of the audience will read the additional
    text.


    If your data is important enough to be included in the infographic design, it’s
    probably important enough to visualize.


    ### Minimize Text


    Nobody wants to read a text article that has been converted into a JPG image file
    and called an infographic. (Yes, I’ve seen this done). Readers look at your infographic
    with the expectation that with the use of visual design, the information will
    be simpler to understand and faster to read than a traditional text article or
    blog post.


    Of course, chances are that you won’t remove all the text from the design, but
    you should minimize it as much as possible. This is one of the biggest challenges
    when working with clients because they have so much information that they would
    like to communicate to readers. The temptation is that knowing you can get the
    audience’s attention with a good infographic topic, companies want to throw all
    their related information into the design hoping that the readers will take the
    time to read everything.


    The disconnect is that the infographic should focus on communicating the key message
    and not try to be the ultimate guide to everything about your company or products.
    In general, people want to learn about the interesting topic and don’t want to
    learn everything about the company that published the infographic.


    Assuming you have an interesting topic to begin with, the reality is that the
    less text you include in your design, the more people you can reach. At first
    glance, the audience judges if an infographic is worthy of the time it needs to
    invest to read it. If it appears to be a lot of text, it is generally regarded
    as too complex and “not worthy.” Too much text implies that the design doesn’t
    do a good job making the topic simple and easy to understand.


    [Figure 6-10](#c06.xhtml_figure6-10) is a fun infographic design exercise in eliminating
    as much text as possible. Designer Marc Morera minimized each of the `Star Wars`
    movies down to visual diagrams of the character interactions throughout each movie.
    The fun for readers is to follow the different color-coded paths in the infographic
    and try to remember each related scene of the movie.


    ![c06f010.tif](image_fi/582305c06/c06f010.png)


    [FIGURE 6-10:](#c06.xhtml_figureanchor6-10) `Star Wars Episode IV` infographic
    with minimal text.


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-6-10)[`Figure-6-10`](#c06.xhtml_figure6-10)


    *Source: Marc Morera Agusti*


    Some text is required to introduce the overall design and identify the characters,
    but there is little text throughout the design. In this case, less text actually
    encourages readers to engage with the design and interact longer as they take
    the time to follow the separate character paths.


    ### Eliminate Chart Legends


    Chart legends are evil. I find myself repeating this often to clients and designers.


    Charts and graphs are a crucial data visualization element used in most infographics,
    and designers don’t need to create all of them from scratch. They should use charting
    software such as `Apple Keynote` or `Microsoft PowerPoint` to create the charts
    and graphs included in the infographics designs whenever possible, but they also
    need to make them as easy to understand as possible.


    In general, chart legends make readers work twice as hard to understand a particular
    chart because they have to look back and forth between the chart and the color
    key multiple times to understand the different sets of data represented in the
    chart. That’s a lot of eye movement. As a part of cleaning up the chart designs,
    the designer should try to minimize the eye movements of the readers to make the
    charts easier to understand.


    That means the responsibility is on the designer to improve the charts that the
    software applications create by default. This includes colors and spacing, but
    the primary change should be to eliminate the chart legends whenever possible.
    The readers still need some type of guide to the color-coding system in the chart,
    but if that guide is built right into the chart itself, there will no longer be
    a need for a separate chart legend.


    [Figure 6-11](#c06.xhtml_figure6-11) shows the default bar chart created by `PowerPoint`.
    The data shown is the `U.S. Census Population` data from the `2012 Statistical
    Abstract`([2]) broken into common age groupings. By default, most charting software
    automatically includes the chart legend shown as a guide to the color-coding system.
    This is a simple example, but even here the reader will probably look back and
    forth a few times to understand what each bar in the chart represents.


    ![c06f011.tif](image_fi/582305c06/c06f011.png)

    '
