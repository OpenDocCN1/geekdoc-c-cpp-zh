    to make any of their confidential information too easy to share outside of the
    company, even accidentally. For example, if a company’s entire new product development
    roadmap for the next five years is clearly outlined in a one-page visual summary
    handed out during a presentation, it could be highly damaging if that one document
    were accidentally shared with a competing company.


    In response to this fear, access to many documents of valuable, internal company
    information is often restricted. Many employees that would benefit from knowing
    this information in their day-to-day jobs are not allowed access due to paranoia
    within the company against that information being leaked outside.


    Overcoming these two opposed objectives can be achieved by approaching them separately.


    First, a company should make its internal data as easy to understand by its employees
    as possible. For a company to thrive: employee mistakes, misunderstandings, and
    misjudgments need to be minimized by any means possible, and clear communication
    can often eliminate the confusion that leads to these types of errors. Using good
    data visualization design methods can effectively disseminate information to its
    employees across an organization and increase the company’s chance of survival.


    Second, companies should definitely use corporate policies to help control the
    need for confidentiality. Document shredding policies, file encryption, e-mail
    tracking, password protection, and even physical building access control can help
    safeguard a company’s valuable data. These policies should define the behavior
    of the employees but allow access to information to those who would benefit from
    it.


    Ideally, access to valuable information internally should be easily accessible,
    but sharing that information outside of the company should be difficult. This
    helps prevent any accidental sharing of information and makes any purposeful sharing
    of confidential company information much more difficult.


    As a case study, the work computer I use for client design projects has user accounts
    with requirements for strong passwords and has XTS-AES 128-bit whole-disk encryption
    on the hard drive. I then create a separate 256-bit AES encrypted disk image for
    each separate project so that my files are also completely encrypted when they
    are backed up to an external disk or online storage. For clients that request
    it, I also use encrypted e-mail to protect messages containing any data or information
    exchanged while in transit between the client and myself.


    Don’t let fear of data exposure hold back your employees from doing the best work
    they can. Your company has valuable information, and you must leverage that information
    to the company’s advantage in every way possible.


    ## Ideas for Visualizing Internal Data


    One of the best parts of my job is that when I work with a client, I get a sneak
    peek at their internal data. I get to see some of the research and statistics
    that drive the decisions these companies make. I’ve seen hundreds of different
    data sets, and I enjoy helping companies find insights from their data and clearly
    communicate them.


    This section will share a number of different types of data and visualizations
    that I have seen in use internally by companies. Your company may have similar
    data, or the data available to you may be completely different. These ideas are
    intended to help inspire you to visualize the data you have and make having the
    data more useful to the company.


    Most of these examples are fairly simple and don’t need powerful graphics software.
    By spending a little extra time, you can create most of these using standard office
    productivity suite applications. More specialized software would make these easier,
    but it’s not required.


    ### Budgets


    The most common data available within companies are the numbers from budgets.
    This data might include the entire corporation or just an individual department.
    Even a small company can quickly lose grasp of where the money goes, and visualizing
    the budget information at some regular frequency can be extremely valuable. Some
    companies want to visualize the approved budget for the upcoming year, or alternatively
    they might visualize the actual spending from the prior year to better understand
    expenses.


    [Figure 5-1](#c05.xhtml_figure5-1) shows an example of a budget poster. This design
    uses the publicly available budget numbers from the city of Bedford, Texas from
    the 2009-2010 financial year. This design uses proportionally sized circles to
    visually compare the dollar amounts, similar to the *Death & Taxes Poster* in
    Figure 3-9; however, this design is split into two halves to include additional
    data. The left half visualizes all the sources of income and the right half visualizes
    all the different expenses.


    ![c05f001.tif](image_fi/582305c05/c05f001.png)


    [**FIGURE 5-1:**](#c05.xhtml_figureanchor5-1) 2009-2010 Budget poster, City of
    Bedford, Texas


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-5-1)[`Figure-5-1`](#c05.xhtml_figure5-1)


    Visualizing with circles is an easy way to show multiple levels of hierarchical
    data, so departments can be broken down into additional levels of detail. The
    viewer can easily understand how one expense category compares to others or as
    a portion of the budget as a whole. [Figure 5-2](#c05.xhtml_figure5-2) shows a
    close-up of only the police department total split up into its smaller categories
    of expenses. In this design, the connecting arrows and circle outlines are color-coded
    to show how each expense category has changed from the prior year. Reduced budgets
    are shown in red, categories that didn’t change are shown in yellow, and increased
    budgets are shown in green.


    ![c05f002.tif](image_fi/582305c05/c05f002.png)


    [**FIGURE 5-2:**](#c05.xhtml_figureanchor5-2) 2009-2010 Bedford, Texas police
    department expenses


    Another popular way to visualize budgets is with the treemap visualization method.
    David McCandless used a treemap design to visualize the 2010 budget of the BBC
    in, *The BBC-o-Gram* shown in [Figure 5-3](#c05.xhtml_figure5-3). In a treemap,
    proportionally sized rectangles are used for each department and fit together,
    and the entire area covered by the diagram represents the total of all budget
    expenses.


    ![c05f003.tif](image_fi/582305c05/c05f003.png)


    [**FIGURE 5-3:**](#c05.xhtml_figureanchor5-3) *The BBC-o-Gram*, treemap budget
    visualization


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-5-3)[`Figure-5-3`](#c05.xhtml_figure5-3)


    *Source: David McCandless, Information is Beautiful*'
