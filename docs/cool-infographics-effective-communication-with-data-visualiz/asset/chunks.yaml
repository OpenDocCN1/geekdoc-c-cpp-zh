    When you, as a search engine user, consider the benefits of a good search engine,
    you can easily evaluate four aspects of the results to judge the success of the
    search:


    - **Speed**—How fast did I get my results?

    - **Quantity**—How many results did I get?

    - **Relevance**—How relevant were the results I got?

    - **Coverage**—Were all of the important pages included in the results? Any major
    pages missing?


    When searching for the term `infographics` on Google today, 14,300,000 results
    are found in 0.15 seconds. Wow!


    However, the most important of the four aspects is relevance. It’s not how many
    results or how fast they appeared. If all 14 million of those results aren’t what
    you are looking for, you would be extremely unsatisfied. In fact, you would probably
    be happier to get fewer, excellent results even if it took a little extra time.


    In 2013, the Microsoft Bing search engine started an ad campaign comparing the
    relevance of its search results directly head-to-head with Google ([Figure 3-3](#c03.xhtml_figure3-3)).
    The folks at Microsoft know what’s important to users, and its marketing campaign
    competes with the market leader, Google, directly on the aspect that users care
    about most: relevance.


    ![c03f003.tif](image_fi/582305c03/c03f003.png)


    [**FIGURE 3-3:**](#c03.xhtml_figureanchor3-3) The Microsoft Bing search engine
    is competing directly against Google on the basis of relevance.


    [`www.bingiton.com`](http://www.bingiton.com)


    Source: Bing It On advertisement from Microsoft


    ### The Objective of SEO


    From a marketer’s perspective, the objective of using an infographic as SEO content
    online is to improve where its company web pages appear in search results for
    related keywords, and ultimately increase the number of visitors to the site.
    Infographics have become a popular tool for this because they are so easy to read
    and easy to share, which creates more links and views for the company that published
    the infographic.


    When an infographic becomes extremely popular online, it’s referred to as “going
    viral.” How popular? There’s no numeric threshold value of views that content
    has to reach to be considered “going viral.” The process of going viral online
    means that an ever-increasing number of people are viewing and sharing the content,
    usually increasing with each generation. An example of this is shown in [Figure
    3-4](#c03.xhtml_figure3-4). If 10 people share the original infographic, and each
    of those shares is shared again by two followers, and each of those shares is
    shared again by two followers of the second generation, and so on, the growth
    could be exponential, but it’s still measured in comparison to a web page’s normal
    traffic.


    ![c03f004.tif](image_fi/582305c03/c03f004.png)


    [**FIGURE 3-4:**](#c03.xhtml_figureanchor3-4) The viral phenomenon where each
    generation of social-sharing causes at least two additional posts


    In practice, when an infographic goes viral, it means that the page views and
    shares on social media outpace your normal content by a significant margin. It’s
    all relative. So if a post on your company blog normally gets 500 views per day,
    but suddenly one post gets 5,000 views because you posted a cool infographic,
    it probably “went viral.” You have to consider its success in comparison to other
    content you have published because there is no easy way to observe or measure
    the sharing phenomenon.


    A more ambitious goal is to achieve publication on one (or many) of the major
    online news sites. Links from sites with high `PageRank` scores can be much more
    valuable than links from small, personal blogs. So, the goal is not only to get
    a high number of views, but also to get links from high value sites. The high
    value sites that are the most valuable depend on your industry. Which news sites
    post articles about your company, your industry, and your competitors?


    ### The Link Bait Challenge


    Link bait is a phrase used to describe any content that has been specifically
    crafted to attract a significant number of views and links from other websites.
    Usually, the content used for link bait is something chosen to have broad appeal
    to the widest possible audience. That way, the company that publishes the content
    has the best chance to get as many links and views as possible.


    For many, link bait has earned a bad reputation and can be perceived to be a shady
    form of online marketing. Even the term link bait sounds like it’s related to
    spam, but it really isn’t. Every infographic online could be considered link bait,
    because they are all trying to attract more traffic with visually engaging content.
    You’ll see link bait online in different formats, things like shocking gossip,
    surprising news, amazing photos, funny videos, Top 10 articles, and of course,
    infographics. The best topics for link bait are controversial subjects or topics
    with strong emotional appeal. Link bait is neither good nor bad; it depends on
    how it is used. All of the cool infographics shown in this book are good link
    bait designs. In contrast, an infographic that leads readers to a malicious site
    that loads malware onto their computers would definitely be considered to be bad
    link bait.


    The problem comes from content that isn’t relevant to the site that publishes
    it. When the topic of the infographic is not related to the site that publishes
    it, the search engines have a hard time determining if a link should be considered
    as an endorsement of the company.


    As an example of infographic link bait, the `James Bond` `50 Years of Movies`,
    `H&R Block` `Figure-3-5` (#c03.xhtml_figure3-5) is an example of a cool infographic.


    ![c03f005.tif](image_fi/582305c03/c03f005.png)


    [**FIGURE 3-5:**](#c03.xhtml_figureanchor3-5) An example of a cool infographic
    used as link bait


    [`www.bingiton.com`](http://www.bingiton.com)


    Source: `Bing It On` advertisement from `Microsoft`


    ![c03f006.tif](image_fi/582305c03/c03f006.png)


    [**FIGURE 3-6:**](#c03.xhtml_figureanchor3-6) Google search finds 284 sites that
    reposted the image


    ### It’s All About Relevance


    At this point, the search engines don’t have a good way to solve this challenge.
    Today, link bait infographics are effective as an SEO tactic and can successfully
    raise a website’s overall score.

