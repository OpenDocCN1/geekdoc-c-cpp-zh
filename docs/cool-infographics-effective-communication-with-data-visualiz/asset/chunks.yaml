    ## Infographic Resume Design Tools


    So, you want to try your hand at designing your own infographic resume?


    You don’t have to be a graphic designer (but it couldn’t hurt). So far, most of
    the infographic resume designs are created manually using common graphic design
    software, such as Adobe Illustrator or Photoshop. Microsoft Office is also widely
    used to create both the individual data visualizations and the overall design.


    However, with the increase in popularity of infographics, and infographic resumes
    in particular, a number of online services have begun to appear that offer to
    generate an infographic resume for the user automatically. These are not general
    infographic design sites. They are sites dedicated specifically to creating infographic
    resumes.


    They all import an individual’s profile information from LinkedIn.com and then
    enable you to edit or add custom information manually. To begin, you can choose
    between a handful of templates, make adjustments to the design style, choose which
    sections to include, and rearrange the sections as needed. Some of them enable
    the user to upload their text resume as the source data and additional images.


    Because these sites are so new, they can definitely help a candidate stand out
    visually, but they start with predesigned templates. If the user just accepts
    the design defaults without making any changes, their resume may end up looking
    exactly like other resume designs the hiring manager has seen. The risk these
    sites will face in the future is that they could become perceived as only premade
    resume templates when infographic resumes become more popular and recognized.


    The job candidate should always start with one of the design templates, and then
    customize the design using the available options to make their own resume visually
    unique and distinctive.


