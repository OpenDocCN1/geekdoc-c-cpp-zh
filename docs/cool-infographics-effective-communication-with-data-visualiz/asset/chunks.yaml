- fmt: '

    Loman effectively applied an existing design style to a new set of information
    to create a visualization that was new and different. The resulting design is
    definitely unique and memorable.


    ## The Art of Storytelling


    Good infographic design is about storytelling by combining data visualization
    design and graphic design. Many of the good infographics follow a simple three-part
    story format: introduction, key message, and conclusion, as shown in [Figure 1-21](#c01.xhtml_figure1-21).


    ![c01f021.tif](image_fi/582305c01/c01f021.png)


    [FIGURE 1-21:](#c01.xhtml_figureanchor1-21) The three-part story format


    ### Introduction/Foundation


    The introduction needs to introduce the reader to the topic of the infographic.
    What is the infographic about and why should the reader care? This is usually
    some combination of the title and a brief paragraph of text. This is the designer’s
    chance to tell the target audience that this infographic is intended for them
    and contains something they will find interesting.


    This section also needs to lay the foundation for the information—anything the
    readers need to understand clearly before they are ready to grasp the main event.
    Introductions may include a couple data visualizations that help lay the groundwork.
    Maybe it’s a visualization of an entire industry before getting into the details,
    which helps prepare the reader to be ready to learn something new.


    ### Ah-Ha! The Main Event


    For an infographic to be remarkable to the audience, it needs to contain some
    new, previously unknown piece of information. This is the main event and usually
    the dominant visual portion of the infographic.


    This section is the infographic’s entire reason for existence. The information
    contained here is why someone went to the trouble of designing the infographic.
    Usually, a large illustration or data visualization is used in this section to
    trigger the Picture Superiority Effect with the readers. If the audience only
    remembers one thing from the infographic, the designer wants it to be this main
    point of information.


    ### Conclusion/Call-to-action


    Infographic designs need to have some closure at the bottom where the designer
    wraps up the message for the reader—just like ending a good speech.


    If appropriate, this is where a call-to-action should be included if there is
    some type of follow-up the designer would like the readers to take after learning
    this amazing piece of information. Should they visit a website, sign a petition,
    buy a product, start eating healthier, write a letter to their congressman, or
    call their mother?


    The design should not leave it to chance that they will act appropriately, but
    should tell the readers explicitly what to do with the nugget of wisdom just bestowed
    upon them.


    [Figure 1-22](#c01.xhtml_figure1-22) is an infographic from RothIRA.com that targets
    a young audience with information about saving for retirement. There is a brief
    introduction that introduces the character Tom. Some basic assumptions are outlined
    as foundation information, such as saving $1.00 per day up until age 70.


    ![c01f022.tif](image_fi/582305c01/c01f022.png)


    [FIGURE 1-22:](#c01.xhtml_figureanchor1-22) The Tower of Beer infographic exemplifies
    the three-part story format [`coolinfographics.com/Figure-1-22`](http://coolinfographics.com/Figure-1-22)


    *Source: The High Life, Tower of Beer*, RothIRA.com, 2012*


    The main event is the visualization of the tower of stacked beer cases that Tom
    would be able to afford if he starts saving at age 25. This stack of beer is shown
    in comparison to two smaller objects: the Statue of Liberty and, the world’s tallest
    building, the Burj Khalifa Tower. By choosing two recognizable objects that are
    smaller than the Tower of Beer, the design highlights how impressively tall this
    stack would be.


    The explicit call-to-action is the deceptively simple statement: “Learn more at
    RothIRA.com.” The subtle call-to-action is for the reader to start saving for
    retirement right now.


    ## Media Formats of Infographics


    Six different media formats of infographics are available to designers, as shown
    in [Figure 1-23](#c01.xhtml_figure1-23). Even though the majority of the infographics
    we see online are static images, many designers have begun to utilize storytelling
    and data visualization in different ways. The choice between these hinges on the
    overall objectives of the design.


    ![c01f023.tif](image_fi/582305c01/c01f023.png)


    [FIGURE 1-23:](#c01.xhtml_figureanchor1-23) The six forms of infographics in order
    of increasing complexity


    ### Static Infographics


    *Static infographics* are the simplest and most common form of infographics design.
    The final design is saved as an image file for easy distribution online and to
    print on paper. Most software applications have the capability to save the final
    design as a static image file (JPG, PNG, GIF, and such) for easy viewing in a
    browser or as a PDF file.


    [Figure 1-24](#c01.xhtml_figure1-24) is a good example of a static infographic
    design. *Voice is King* from Nuance Communications uses data visualizations and
    illustrations to tell a compelling message. The design fits easily into website
    and blog posts, and the static image can be easily shared as a PDF file by e-mail.


    ![c01f024.tif](image_fi/582305c01/c01f024.png)


    [FIGURE 1-24:](#c01.xhtml_figureanchor1-24) *Voice is King*, Static infographic
    [`coolinfographics.com/Figure-1-24`](http://coolinfographics.com/Figure-1-24)


    *Source: Voice is King*, Nuance Communications


    Static infographics are also the easiest format to share. No special applications
    or browser-on extensions are required. Static infographics have a long history.
    After a static image is published, it becomes available to share.


    The major social media sites (Twitter, Facebook, Google+, Tumblr, LinkedIn) have
    the capability to share static images ([Figure 1-25](#c01.xhtml_figure1-25)).


    ![c01f025.tif](image_fi/582305c01/c01f025.png)


    [FIGURE 1-25:](#c01.xhtml_figureanchor1-25) Facebook upload photo interface


    A smaller, thumbnail image of the infographic becomes embedded in the status update
    and appears to all of the followers, as seen in [Figure 1-26](#c01.xhtml_figure1-26).


    ![c01f026.tif](image_fi/582305c01/c01f026.png)


    [FIGURE 1-26:](#c01.xhtml_figureanchor1-26) Infographic image shown in News Feed


    ### Zooming Infographics


    Zooming infographics add an interactive layer to large, static infographics online
    and enable the readers to easily zoom in closer to read the details. These are
    normally used for large designs and posters because the small space available
    in a computer’s browser window makes the text too small to read. A large design
    is reduced in size so that the entire design can be viewed all at once on the
    screen, and the zooming controls are made available to allow the reader to view
    the small details clearly.


    [Figure 1-27](#c01.xhtml_figure1-27) shows a zooming interface being used to view
    *The Genealogy of Pop/Rock Music* infographic poster.


    ![c01f027.tif](image_fi/582305c01/c01f027.png)


    [FIGURE 1-27:](#c01.xhtml_figureanchor1-27) Zooming interface example [`coolinfographics.com/Figure-1-27`](http://coolinfographics.com/Figure-1-27)


    *Source: Genealogy of Pop & Rock Music*, Reebee Garofalo, HistoryShots*

