- fmt: "\nEven a handful of simple design changes can make each chart specific to\
    \ its own data and easier for the audience to understand. In [Figure 5-17](#c05.xhtml_figure5-17),\
    \ the same chart has been redesigned mostly using the design options available\
    \ in PowerPoint. The major changes can be accomplished by following these steps:\n\
    \n![c05f017.tif](image_fi/582305c05/c05f017.png)\n\n[FIGURE 5-17:](c05.xhtml_figureanchor5-17)\
    \ Chart redesigned in PowerPoint\n\n1. Color the bars to match the branding of\
    \ the data.\n2. Display the data in the bars.\n3. Simplify the axis labels as\
    \ much as possible, down to just the month abbreviations by adding the year to\
    \ the title.\n4. Color the text of the month abbreviations along the x-axis to\
    \ a lighter gray to help the colors of the chart become the focus.\n5. Remove\
    \ the axis lines, tick marks, and gridlines. For a chart this simple, they’re\
    \ unnecessary and add unwanted visual noise.\n6. Add the specific company logo\
    \ images found on those company websites on top of the bars. This establishes\
    \ the meaning behind the color-coding and eliminates the need for a chart legend.\n\
    \nThese changes obviously won’t apply to every chart because your data will be\
    \ different, but the idea is to make every data visualization relevant and meaningful\
    \ to the audience. In this case, I purposely stayed with the bar chart visualization\
    \ instead of trying different data visualization methods to demonstrate how some\
    \ simple changes can make your charts much more meaningful to your audience. This\
    \ is what it takes to make your data easier to understand and remember.\n\n###\
    \ The One-Page Infographic Handout\n\nOne of the best uses of infographics within\
    \ a company is for the handouts passed out during presentations. A printed, one-page\
    \ infographic handout can be much more effective when used as an executive summary\
    \ of a presentation. Instead of giving everyone in the audience a thick packet\
    \ with every slide from your presentation, give them just a one-page summary.\n\
    \nThe same design principles from online infographics apply, so only the most\
    \ important information should be visualized on the handout. With all the key\
    \ information on one page, none of the information gets lost. The members of the\
    \ audience can lay the handout on their desk or hang it up on the wall of their\
    \ office, and all the key information is viewable. This keeps the message and\
    \ information fresh in their minds because they see it often.\n\nIf you distribute\
    \ a large packet of printed pages from a presentation, the information will probably\
    \ get lost when employees return to their desks. If they leave the printed stack\
    \ on their desk, they only see the top page, and the rest of the information is\
    \ buried in the stack unless they make the effort to look through the pages. More\
    \ likely they don’t have room on their desk, so the stack of slides is either\
    \ filed away in a drawer or thrown away–out of sight, out of mind.\n\nThe one-page\
    \ handouts can be printed on standard letter-size, but many handouts are printed\
    \ on the larger legal-size (8.5″ × 14″) or tabloid-size paper (11″ × 17″) available\
    \ for many business-grade printers and photocopiers.\n\n[Figure 5-18](#c05.xhtml_figure18)\
    \ is the 2011 Wisconsin Calendar designed by Joni Graves as part of the University\
    \ of Wisconsin’s Transportation Information Center RODS (Resources, Outreach,\
    \ and Data Support) using statewide data. Printed on a single 11″ × 17″ page,\
    \ the Wisconsin Bureau of Transportation BOTS uses the design as a handout for\
    \ several staff meetings across the state, and it is also used at quarterly Traffic\
    \ Safety (TSC) meetings.\n\n![c05f018.tif](image_fi/582305c05/c05f018.png)\n\n\
    [FIGURE 5-18:](c05.xhtml_figureanchor5-18) A one-page infographic handout allows\
    \ the audience to easily see all of the data from your presentation\n\n[`Coolinfographics.com/Figure-518`](http://Coolinfographics.com/Figure-518)\
    \ [Figure-518](c05.xhtml_figure18) 2011 Wisconsin Calendar, Joni Graves The handout\
    \ displays an immense amount of data on one page. By visualizing the data in the\
    \ color-coded calendar format, it presents the data in a way that is much easier\
    \ for the audience to understand than just the numbers. By providing it on a one-page\
    \ handout, the design allows audiences to see patterns and easily compare the\
    \ frequency data between different causes.\n\n### Prezi Presentations\n\n![p.tif](image_fi/582305c05/p.jpg)\n\
    \nIf you take the idea of the one-page handout to the next level, you can convert\
    \ a one-page infographic into your entire presentation. Using a zooming user interface\
    \ (ZUI, pronounced “zoo-ee”), a presentation tool like [`prezi.com`](http://prezi.com))\
    \ enables you to display the entire infographic as the presentation instead of\
    \ breaking the information apart into separate, individual slides.\n\nPrezi is\
    \ a presentation application alternative to the more common PowerPoint or Keynote\
    \ presentations. Instead of a sequence of individual, separate slides, Prezi uses\
    \ one large canvas where the user can add images, charts, text, and even videos.\
    \ The software enables the presenter to define a sequential path of zooming, rotating,\
    \ and moving across the canvas to focus on different parts and create the flow\
    \ of a presentation. When the presentation is displayed or projected, the software\
    \ animates the movement across the canvas between each step defined in the path.\n\
    \nFor example, [Figure 5-19](#c05.xhtml_figure19) is a large infographic from\
    \ McGraw-Hill Higher Education that was used in its sales training conferences.\
    \ The complete design can be printed as a one-page handout and distributed to\
    \ the audience, or printed as a poster to be displayed. Prezi can then be used\
    \ as the presentation application to move the focus of the projected display to\
    \ each area of discussion during the presentation ([Figure 5-20](#c05.xhtml_figure-20)).\n\
    \n![c05f019.tif](image_fi/582305c05/c05f019.png)\n\n[FIGURE 5-19:](c05.xhtml_figureanchor5-19)\
    \ Large one-page infographic handout\n\n[`Coolinfographics.com/Figure-519`](http://Coolinfographics.com/Figure-519)\
    \ [Figure-519](c05.xhtml_figure19) Source: McGraw-Hill CONNECT\n\n![c05f020.tif](image_fi/582305c05/c05f020.png)\n\
    \n[FIGURE 5-20:](c05.xhtml_figureanchor5-20) Prezi frame to zoom in to one section\
    \ of the infographic during a presentation\n\nThe audience can easily follow along\
    \ throughout the entire presentation using the handout as a reference. Everyone\
    \ in the audience has all the data on the one-page handout as a convenient takeaway\
    \ document, so they have access to the information after the presentation.\n\n\
    The online version of Prezi is available for anyone to use for free, but there\
    \ are additional paid licenses that provide more features, additional storage\
    \ space online, and a separate desktop application. The desktop application enables\
    \ you to keep your presentation in a local file instead of online, if that’s a\
    \ security concern. Also, using a file with the desktop application avoids any\
    \ potential issues with Internet connectivity while you deliver your presentation\
    \ because the entire presentation is saved locally on your computer.\n\n## Final\
    \ Thoughts\n\nIt doesn’t matter what business your company is in, you can benefit\
    \ from visualizing your information. The business could be a local bakery, an\
    \ online retailer, a government office, a venture capital firm, a private school,\
    \ or a movie production company. Every company has valuable information that needs\
    \ to be clearly communicated to employees, investors, and customers. Infographics\
    \ and data visualization design practices can make your company information engaging\
    \ and memorable.\n\n## **Links**\n\n1. Bedford, TX Budget Poster, Randy Krum,\
    \ InfoNewt:\n\n    [`http://infonewt.com/portfolio/client-work/8781697`](http://infonewt.com/portfolio/client-work/8781697)\n\
    \n2. *BBC-o-Gram*, David McCandless, Information is Beautiful\n"
