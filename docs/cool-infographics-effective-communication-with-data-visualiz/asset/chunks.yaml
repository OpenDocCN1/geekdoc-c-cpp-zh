  raw: 'The problem becomes more difficult when visualizing data by changing the sizes
    of nonstandard shapes: circles, icons, logos, and so on. This is where many designers
    mistakenly create data visualizations that don’t actually match the data because
    they don’t take the time to do the math required.


    This issue is magnified when working with shapes in software because the design
    applications enable you to directly change only the width and height of an object,
    not the area. There’s no input field where the designer can enter the area of
    an object because the software treats every object like a rectangle. So, designers
    need to do the mathematical calculations separately before sizing objects in the
    design software, but many make the mistake of simply changing both the width and
    height to match the data.


    Now look at visualizing the same sample budget data with the size of circles.


    π × radius² = Area of a circle


    In [Figure 6-4](#c06.xhtml_figure6-4), you can see what happens when a designer
    mistakenly sizes circles by changing the diameter to match the data. If she incorrectly
    changes the diameter of the Sales circle in the software to be three times the
    diameter of the Marketing circle, the area of the Sales circle actually becomes
    8.95 times larger.


    ![c06f004.tif](image_fi/582305c06/c06f004.png)


    [**FIGURE 6-4:**](#c06.xhtml_figureanchor6-4) WRONG! Don’t size circles by changing
    the diameter to match the data values.


    The area of the Marketing circle:


    π × 0.5 in × 0.5 in = 0.79 in²


    The area of the incorrect Sales circle:


    π × 1.5 in × 1.5 in = 7.07 in²


    This visualization doesn’t match the data at all and becomes a false visual. The
    reason for this is that you are changing the size of two dimensions to represent
    one-dimensional data. Unlike rectangles, you can’t keep the width constant and
    change only the height of a circle. It wouldn’t be a circle anymore. This is also
    true for squares, icons, and logos where a designer wants to keep the aspect ratio
    constant so that the image looks correct in the design. You don’t want to stretch
    or skew a company’s logo by changing only one dimension.


    To do this correctly, you have to start by calculating the area of the first circle,
    called the Master circle. Then, calculate the relative area of any additional
    circles in comparison to the Master circle by using the difference in values.
    In this case, the Sales budget is three times larger than the Marketing budget
    value, so the area of the Sales circle needs to be three times larger than the
    Marketing circle. It doesn’t matter how many additional circles you create, but
    their areas all need to be calculated in comparison to the same Master circle.


    Finally, use the area of each circle you just calculated to determine the diameter
    of the additional circles. The diameter is the numerical value you can use to
    enter that dimension in the design software. It doesn’t matter which circle you
    choose to be the Master circle, but all the circles need to be sized proportional
    to the Master circle. If you started with the Sales circle as the Master circle,
    the area of the Marketing circle would be 1/3 the area of the Sales circle.


    You can use a simple spreadsheet to show all the calculations. After you set up
    the spreadsheet, the only values you need to enter are the original data values
    you want to visualize and the diameter of the Master circle. The rest of the values
    are calculated automatically, and the designer can use all the calculated diameters
    to correctly size her design in the software application.


    [Table 6-1](#c06.xhtml_table6-1) shows the circle calculations for the sample
    budget data and uses the Marketing circle as the Master circle. If the budget
    data had more departments, they could be easily added as additional rows that
    all calculate in comparison to the Marketing department.


    ![Tabular582305c06-0002](image_fi/table6-1.png)


    **[TABLE 6-1:](#c06.xhtml_tableanchor6-1)** Circle Calculations Spreadsheet


    For reference, the equation to calculate the radius of a circle from the known
    area follows:


    Radius = √(Area/ π)


    Diameter is then simply double the radius. [Figure 6-5](#c06.xhtml_figure6-5)
    shows the correct sizing of the circles based on the calculations from the spreadsheet,
    and the Sales circle is now correctly sized as three times the area of the Marketing
    circle.


    ![c06f005.tif](image_fi/582305c06/c06f005.png)


    [**FIGURE 6-5:**](#c06.xhtml_figureanchor6-5) CORRECT circle sizing based on area


    ## Pick a Good Topic


    This might sound obvious, but many companies struggle with finding a good topic
    for an infographic design. A good infographic needs to be interesting because
    readers don’t want to waste their time on boring, irrelevant topics. With information
    overload and thousands of infographics online, people have to choose which ones
    are worth reading.


    Ideally, a good infographic topic focuses on some new piece of previously unknown
    information related to a subject the target audience is interested in. It would
    be even better if the information were something surprising to, and unexpected
    by, the audience. Topics that are counterintuitive or break expectations become
    sharable because people are surprised and want to share this new information they
    just learned with their friends.


    There are two common topic areas that are worth a little more discussion: trending
    and controversial topics.


    ### Trending Topics


    There are some trending topics that are so popular that almost any infographic
    related to them generates a fairly decent amount of traffic and attention. However,
    the hot trending topics change over time. For example, currently any infographics
    released about social media, Star Wars, superheroes, or the iPhone seem to automatically
    draw in more traffic because these are the current, popular topics with the online,
    tech-savvy crowd.


    Many companies release infographics based on a hot trending topic, which may or
    may not relate to their business, brand, or product. These can be successful with
    exploiting the trend and capitalizing on the attention they generate. This approach
    can be effective but can also be short-lived—just like the trends. Hot topics
    today are obsolete and out-of-date tomorrow.


    ### Controversial Topics


    Another popular approach is to focus on a controversial topic. If a company can
    connect with the audience on an emotional level about a topic it feels passionately
    about, the audience will be more likely to comment and share the infographic.
    The hope here is that “all links are good links.” It doesn’t matter if people
    post because they love the topic or they hate the topic. Their posts are creating
    backlinks that the search engines index, and their social network audiences also
    see the infographic—reaching a wider audience.


    Controversial topics are a much riskier proposition because the audience may perceive
    that the company publishing the infographic is taking one side of the controversy.
    If it disagrees with the stance that it believes the infographic promotes, it
    can turn into an opposition to the company.


    ## Search for Prior Art


    As more and more infographics are published online, the more likely it is that
    a design related to your chosen topic already exists in the wild. Infographics
    published on the Internet never go away. They’re all still out there somewhere,
    even if the original landing page on the company site is removed. Copies of them
    still exist on blogs, social networking sites, infographic gallery sites, and
    the Internet Archive ([`www.archive.org`](http://www.archive.org)).


    Going forward, the number of online infographics will continue to grow, so understanding
    the current state of existing prior art will continue to become more important
    as well. Use search engines and infographic gallery sites to gather any existing
    infographics related to your topic of choice.'
