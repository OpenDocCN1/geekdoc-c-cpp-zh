    ![c07f019.png](img/c07f019.png)


    图 7-19: iCharts 屏幕截图


    ### Many Eyes


    Many Eyes 项目（图 7-20）是由 IBM Research 团队和 IBM Cognos 软件组创建的一项持续实验。该网站允许你创建一些高级数据可视化图形，例如树
    map、气泡图、词云、世界地图和网络图。成员可以将他们的可视化结果发布到网上，并允许社区的其他成员发表评论和查看原始数据。([`www-958.ibm.com/software/analytics/manyeyes/`](http://www-958.ibm.com/software/analytics/manyeyes/))


    ![c07f020.png](img/c07f020.png)


    图 7-20: Many Eyes 可视化列表


    ### The Noun Project


    Noun Project（图 7-21）是一个绝佳的资源，可以寻找与你在信息图设计中需要可视化的概念相关的图标。大多数图标可以在知识共享（Creative
    Commons）许可下免费使用，只要你在包含它们的任何设计中为设计师注明即可。设计师们不断添加新图标，以帮助建立更广泛的视觉语言。


    ![c07f021.png](img/c07f021.png)


    图 7-21: The Noun Project


    The Noun Project 基于捐赠和设计师贡献的设计构建。如果你可以，请考虑为该项目做出贡献。([`www.thenounproject.com)`](http://www.thenounproject.com))


    # 在线查找数据


    信息图设计师面临的巨大挑战之一，是找到他们作为信息图故事一部分进行可视化的数据。如果你没有使用自己的公司数据或研究结果，你可能会在网上搜索用于设计你数据可视化的数据。


    搜索引擎（Google 和 Bing）确实可以提供帮助，但如果你必须翻阅数百万条搜索结果，要为你的信息图找到完美的数据是非常困难的。当然，你正在寻找的数据类型可以帮助缩小搜索范围。


    以下是托管了数千个数据集的数据存储网站。这些网站的意图是向公众提供这些数据集，但请确保你理解它们的服务条款。


    ### Data.gov


    Data.gov 是美国政府的官方数据网站，是一个关于透明度和白宫“开放政府倡议”的项目。在写本文时，该网站总共有 392,435 个原始数据数据集、工具和地理数据集([`www.data.gov`](http://www.data.gov))）。


    ### DataMarket


    DataMarket 是一个数据存储网站，允许用户查看来自世界各地的数据集的可视化结果。免费访问允许用户查看和共享数据，而 Pro 账户（每月 59 美元）则允许访问高级工具以发布数据，并访问额外数据集，如市场研究和金融市场数据。([`www.datamarket.com`](http://www.datamarket.com))


    ### FactBrowser


    FactBrowser 自称为一个研究发现引擎。它是一个专门用于索引新闻文章以及公司和组织新闻稿中引用的统计数据的搜索引擎。你可以按类别、公司、来源、消费者类型和世界区域进行浏览。([`www.factbrowser.com`](http://www.factbrowser.com))


    ### Google Public Data


    Google 维护着一个非常棒公共目录，包含来自许多世界政府和全球组织的数百个数据集和指标。用户可以浏览数据集并查看网站上的交互式数据可视化。([`www.google.com/publicdata/directory`](http://www.google.com/publicdata/directory))。


    ### Internet World Stats


    Internet World Stats 拥有一些关于全球互联网使用情况、人口统计甚至一些市场研究的优秀数据。该网站经常在信息图中被引用，作为互联网规模和程度的指标([`internetworldstats.com`](http://internetworldstats.com))。


    ### Many Eyes


    除了提到的可以在 Many Eyes 上创建的可视化结果外，Many Eyes 还托管了一个巨大的公共数据集库。在写本文时，可用数据集有 367,835 个，社区成员一直在添加新集合。社区还能够对特定数据集发表评论，以分享想法或问题([`www-958.ibm.com/software/analytics/manyeyes/`](http://www-958.ibm.com/software/analytics/manyeyes/))。


    ### Quantcast


    Quantcast 测量、估计和预测网络大多数网站的流量。对于任何比较网站或流量的设计，Quantcast 都是一个很棒的资源。记住，这些通常是估计值而非实际数据，但出于比较目的，它的数字通常在合理范围内([`www.quantcast.com`](http://www.quantcast.com))。


    ### Wikipedia


    当然，许多人使用维基百科作为信息图的数据源。在各种条目中列有许多非常好的 HTML 表格和单独统计数据。始终尝试通过维基百科寻找原始来源（如果有的话）。([`www.wikipedia.org`](http://www.wikipedia.org))


    ### Wolfram Alpha


    Wolfram Alpha 可能拥有与你的主题相关的统计数据或数据。它可能是关于某个地点或特定国家的数据([`www.wolframalpha.com`](http://www.wolframalpha.com))。


    # 在线信息图设计网站


    最近启动了一些专门用于设计信息图的新网站。这些网站允许你输入（或上传）自己的数据来创建图表，并允许用户从一系列预设计的信息图模板中进行选择。使用这些网站的一些潜在优势使其具有吸引力：


    - **速度**：通过使用模板和在线图表工具，你可以在一小时内创建一个完备的信息图。

    - **托管**：这些网站在网上托管最终的信息图，因此用户不需要创建单独的信息图落地页。

    - **SEO 优化**：对于没有知识或技能优化信息图落地页元数据的用户来说，这些网站可以使信息图设计中的文本被搜索引擎爬虫获取以找到你的信息图。

    - **设计风格**：这些模板让非设计师用户能够突破他们通常创建的像 PowerPoint 那样的图表。设计风格非常新颖，可以制作非常漂亮的信息图。大多数还包含
    MS Office 套件中不提供的可视化样式。


    当然，使用这些设计网站也有一些潜在缺点：


    - **模板**：就像 PowerPoint 中的演示模板一样，这些模板肯定会被多人使用，并可能看起来像素材设计。

    - **图表**：模板用简单的、预设计的图表吸引用户，即使该图表并不是可视化你必须处理的数据正确方式。

    - **依赖性**：这些是全新的公司，网站在 12 个月后可能不再可用。如果你在这里托管你的信息图，你就依赖该网站保持运行，以保持你的信息图在互联网上在线。


    '
- fmt: '


    - **Traffic and links**—If you host your infographic on these sites, and not on
    an infographic landing page on your own site, all the traffic and backlinks to
    your infographic design benefit the design site and not yours. Even using the
    embed-code to display the final infographic design on your own site is redirecting
    some of the traffic and PageRank to the design site.

    - **Nonconfidentiality**—You may consider using an online design site to create
    an infographic of company data for internal use, but you may be inadvertently
    making your confidential company data public. Even if the site doesn’t publish
    your design publicly, you may be exposing your private data to the members of
    the design company. None of these sites claim that your data is encrypted or protected
    in any way, which may be in violation of your corporate policies.


    These sites are a great way to start using data visualizations and infographics
    to communicate your message visually. If you design your own infographic using
    these tools, you should at least understand what you are sacrificing by not having
    complete control over your design.


    ## Easel.ly


    Easel.ly enables you to choose from a large library of templates, shapes, and
    objects to create and share an infographic design. Easel.ly doesn’t have any advanced
    charting tools, so it’s up to the designer to manually adjust the sizes of shapes
    to match the data values. The circles shown in [Figure 7-22](#c07.xhtml_figure7-22)
    would each need to be resized by the user to match the data. ([`www.easel.ly`](http://www.easel.ly))


    ![c07f022.png](image_fi/582305c07/c07f022.png)


    [**FIGURE 7-22:**](#c07.xhtml_figureanchor7-22) Easel.ly design interface


    ## infogr.am


    Infogr.am is an online tool for creating and sharing infographics and individual
    charts based on your own data. Shown in [Figure 7-23](#c07.xhtml_figure7-23),
    it has simplified and prepackaged the design process to four steps:


    ![c07f023.png](image_fi/582305c07/c07f023.png)


    [**FIGURE 7-23:**](#c07.xhtml_figureanchor7-23) Infogr.am template chooser


    1. Choose a template.

    2. Add your own data.

    3. Customize the design.

    4. Publish and share.


    The charts are interactive, which adds some animation and changes the display
    based on decisions from the viewer. The tool also enables you to embed the final
    designs on your site or share on the major social media networks. ([`infogr.am`](http://infogr.am))


    ## Piktochart


    Piktochart is a WYSIWYG editor for infographics online. The tool enables you to
    create infographics online with interactive charts, and claims they are optimized
    for SEO and social media sharing. Users may create an account for free and have
    access to a handful of templates ([Figure 7-24](#c07.xhtml_figure7-24)). PRO users
    pay $9.99 per month and get access to approximately 100 more templates. It also
    claims to have more than 1,000 icons and graphics in its library of images for
    would-be designers to incorporate into their designs. ([`www.piktochart.com`](http://www.piktochart.com))


    ![c07f024.png](image_fi/582305c07/c07f024.png)


    [**FIGURE 7-24:**](#c07.xhtml_figureanchor7-24) Piktochart interface


    ## Venngage


    Venngage is an online infographic creation site from the same people that developed
    the Vizualize.me infographic resume site mentioned in [Chapter 4](#c04.xhtml_c4),
    “Infographic Resumes.” Upload your data into one of the predesigned templates
    and then customize the final design to the colors that match your brand or style
    ([Figure 7-25](#c07.xhtml_figure7-25)). There are both free and Pro accounts ($19/month)
    available. ([`venngage.com`](http://venngage.com))


    ![c07f025.png](image_fi/582305c07/c07f025.png)


    [**FIGURE 7-25:**](#c07.xhtml_figureanchor7-25) Venngage design templates


    ## Visual.ly


    Visual.ly is primarily a gallery site for infographics, but it has recently launched
    the Visually Create! section of the website where users can create custom infographics
    based on a selection of predesigned templates ([Figure 7-26](#c07.xhtml_figure7-26)).
    These are primarily social media-related designs that need access to connect with
    Facebook or Twitter to pull in the data used to create infographics [`(create.visual.ly)`](http://create.visual.ly).


    ![c07f026.png](image_fi/582305c07/c07f026.png)


    [**FIGURE 7-26:**](#c07.xhtml_figureanchor7-26) Visually Create!


    ## Reading List


    In addition to online resources, here are some of the other great books written
    about data visualization and infographics from my own reading shelf. Mostly focused
    on improving the data visualizations used in infographics, I highly recommend
    these books to anyone looking to learn more about using data to tell stories.


    ![c07uf010.png](image_fi/582305c07/c07uf010.png)


    *Visualize This: The FlowingData Guide to Design, Visualizations, and Statistics*,
    Nathan Yau, (Wiley, 2011)


    ![c07uf011.png](image_fi/582305c07/c07uf011.png)


    *The Power of Infographics*, Mark Smiklas, (Que, 2012)


    ![c07uf012.png](image_fi/582305c07/c07uf012.png)


    *The Functional Art*, Alberto Cairo, (New Riders, 2013)


    ![c07uf013.png](image_fi/582305c07/c07uf013.png)


    *Beautiful Visualization*, Edited by Julie Steele and Noah Iliinsky, (O’Reilly,
    2010)


    ![c07uf014.png](image_fi/582305c07/c07uf014.png)


    *The Visual Miscellaneum*, David McCandless, (HarperCollins, 2009)


    ![c07uf015.png](image_fi/582305c07/c07uf015.png)


    *Beautiful Evidence*, Edward Tufte, (Graphics Press, 2006)


    ![c07uf016.png](image_fi/582305c07/c07uf016.png)


    *Visual Complexity: Mapping Patterns of Information*, Manuel Lima, (Princeton
    Architectural Press, 2011)


    ![c07uf017.png](image_fi/582305c07/c07uf017.png)


    *Infographics: The Power of Visual Storytelling*, Jason Lankow, Josh Ritchie,
    and Ross Crooks, (Wiley, 2012)


