    and graphs are data visualizations and create a picture from a given set of data.
    [Figure 1-3](#c01.xhtml_figure1-3) shows the price chart of the S&P 500, the Nasdaq,
    and the Dow Jones Industrial Average since 1950\. The reader can easily see the
    overall upward trend and the comparison between the three data sets. Including
    the volume chart beneath the price chart, this data visualization creates a picture
    using at least 80,000 data points.


    ![c01f003.tif](image_fi/582305c01/c01f003.png)


    [**FIGURE 1-3:**](#c01.xhtml_figureanchor1-3) Stock price chart


    It takes us only seconds to understand the long-term trend, to see the close relationship
    between the three indices, and to see the significant spikes and falls in the
    stock market. This visualization easily fits on one piece of paper, a computer
    screen without scrolling, or a presentation slide. Seeing the entire data set
    on one page, we can understand the data quickly and with little effort.


    This is an efficient way to communicate data. Data visualizations can be very
    space efficient by visualizing a large set of numbers in a small space. By designing
    a visualization that displays all of the data within the readers’ field of view,
    this enables us to see the entire data set with minimal eye movement without scrolling
    or flipping between pages.


    If we looked at a spreadsheet with 80,000 values instead, how long would it take
    us to get a general understanding of the market?


    In 2001, Dr. Edward R. Tufte, one of the pioneers of modern data visualization
    and professor emeritus of political science, statistics, and computer science
    from Yale University, clearly explained this phenomenon when he stated, “Of all
    methods for analyzing and communicating statistical information, well-designed
    data graphics are usually the simplest and at the same time the most powerful.”^([1])


    This screen shot ([Figure 1-4](#c01.xhtml_figure1-4)) from the StockTouch app
    on an iPad is another example of a good data visualization design. The top 100
