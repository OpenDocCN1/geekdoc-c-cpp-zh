    为了演示，图 4-20 和图 4-21 展示了 Kevin Burton 的信息图简历，其为原始设计，并经过了去饱和处理，以展示在仅用黑白打印时的效果。所有的公司
    Logo 在原始版本中已经转换为黑白色，因此这些部分可以完美转换。设计中带有蓝色的部分很好地转换为灰度模式，并且在移除颜色后仍然保持易读和易懂。


    ![c04f020.tif](img/c04f020.png)


    **图 4-20：** 原始信息图简历——Kevin Burton


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-20`


    ![c04f021.tif](img/c04f021.png)


    **图 4-21：** 仅黑白版本——Kevin Burton


    通过在原始设计中使用大量的灰度元素，这份信息图简历在不带颜色打印时效果很好。Kevin 不需要担心他的简历在各种不同打印机上打印时的显示效果。它一直会很不错。


    Jack Hagley 通过其简化的黑白简历设计将这一想法更进了一步。他在设计信息图简历（图 4-22）时考虑了五个目标：


    ![c04f022.tif](img/c04f022.png)


    **图 4-22：** 信息图简历——Jack Hagley


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-22`


    *   完全采用黑白，以便在打印时看起来总是一样的

    *   将文件大小降至最低，方便电子邮件发送和下载

    *   在客户打印时尽可能少使用墨水

    *   在视觉上具有独特性

    *   包含大量信息


    信息图简历需要让招聘人员或招聘经理轻松打印。虽然许多信息图设计在网络上配合深色背景看起来非常漂亮，但那种风格让信息图简历难以打印。即使他们有彩色打印机，许多招聘人员也会避免打印黑色背景的简历，因为担心会消耗大量的打印机墨水或碳粉。


    ### iPad（或平板电脑）上的信息图简历


    信息图简历的另一个绝用法是 Dave Rodgerson 的信息图简历，它设计用于在 iPad 上展示和共享（图 4-23）。iPad 屏幕的比例（7.75″
    × 5.82″）比标准信尺寸纸张小，因此设计必须进一步简化，以确保文字在小屏幕上清晰可见。将其视为一份微简历或“信息图电梯演讲”（Infographic Elevator
    Pitch）。


    ![c04f023.tif](img/c04f023.png)


    **图 4-23：** 信息图电梯演讲——Dave Rodgerson


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-23`


    在这个设计中，大部分文本已被移除。图标和 Logo 讲述了关于 Dave 大故事——他的雇主、主要客户、教育背景和专业协会。他在 LinkedIn 上的人脉网络图展示了
    Dave 在不同颜色编码行业的关系，而无需显示所有人脉的名字。词云是由他在 mirror.me 上的社交媒体账户（[`mirror.me`](http://mirror.me））创建的，展示了
    Dave 在网上最感兴趣和经常发布的题。从视觉上看，潜在雇主或客户可以在几秒钟内充分了解 Dave。


    该设计最好格式化为 PDF 文件，以实现跨平台和跨设备兼容。这意味着可以使用 iPad 上的 Apple iBooks 应用查看，甚至可以在发送给某人的电子邮件中直接查看。无需安装第三方的额外应用程序。使用
    iPad 的内置功能，在向他人展示设计时，可以使用双指捏合手势对设计进行缩放。


    PDF 格式的次要优点是 PDF 文件中包含的所有 HTML 链接都是可用的。每个公司 Logo 和图标都是可以触（或点击）的链接。Dave 不需要包含他的电子邮件地址文本，因为任何人都可以点击电子邮件图标，它会自动在默认电子邮件应用程序中打开一封新邮件，并正确地写给给他。如果点击
    LinkedIn 图标，会在默认网络浏览器中打开他的 LinkedIn 个人资料。


    当 Dave 面对向他人展示简历时，他还可以点击应用中的共享图标将其立即发送给他们。


    ### 信息图设计工具


    所以，你想尝试设计自己的简历吗？你不需要成为设计师。求职者应该始终从设计模板开始，然后使用可用选项对设计进行自定义，使其在视觉上具有独特性。


    #### re.vu


    ![c04uf001.tif](img/c04uf001.png)


    re.vu 允许用户上传示例文件或作品集图像以包含在简历设计中。图 4-24](#c04.xhtml_figure4-24) 显示了 re.vu  CEO
    Stephen Years 的网站信息图简历。


    ![c04f024.tif](img/c04f024.png)


    **图 4-24：** re.vu 设计的信息图简历——CEO Stephen Years


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-24`


    考虑到许多招聘人员和招聘经理仍然想看到文本简历，re.vu 还允许你上传传统简历，以便从你的自定义信息图简历页面下载。


    #### Kinzaa.com


    ![c04uf002.tif](img/c04uf002.png)


    Kinzaa.com 增加了板块，候选人可以在其中输入数据，包括他们理想的公司性格、工作环境、理想社区和预期福利，以帮助候选人与合适的公司匹配。博主 Erica
    Swallow 的简历（图 4-25）在该网站上作为示例简历使用。


    '
- fmt: '

    # FIGURE 4-25: (#c04.xhtml_figureanchor4-25) Kinzaa.com infographic resume—Erica
    Swallow


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-25`](#c04.xhtml_figureanchor4-25)


    ### Vizualize.me


    ![c04uf003.tif](image_fi/582305c04/c04uf003.png)


    Connect with a LinkedIn account and `visualize.me` will create an initial resume
    based on the information it can pull from the profile. Once the initial infographic
    resume has been created, the user can edit the profile information, choose from
    a selection of themes, and edit the design options such as colors, backgrounds,
    fonts, layouts, and more. Cofounder Kenneth Lee’s resume is shown as an example
    in [Figure 4-26](#c04.xhtml_figure4-26).


    ![c04f026.tif](image_fi/582305c04/c04f026.png)


    # FIGURE 4-26: (#c04.xhtml_figureanchor4-26) Vizualize.me infographic resume—Kenneth
    Lee


    The final infographic resume design is viewable using the custom URL defined by
    the user. The URL or `visualize.me` buttons can be shared in social networks.
    The final resume can also be downloaded as a PDF file for printing and e-mail.
    One unique feature of `visualize.me` is the stats page that will show traffic
    numbers of visitors to the resume page.


    ### ResumUP.com


    ![c04uf004.tif](image_fi/582305c04/c04uf004.png)


    `ResumUP` has one design template that is applied to all users, which you can
    see in [Figure 4-27](#c04.xhtml_figure4-27). Login with a LinkedIn account and
    `ResumUP` will import the data to create the initial resume. The user has control
    to edit the information displayed and add information about the type of position
    and company they are looking for. The final resume is viewable online with a custom
    URL or can be downloaded as a PDF file.


    ![c04f027.tif](image_fi/582305c04/c04f027.png)


    # FIGURE 4-27: (#c04.xhtml_figureanchor4-27) ResumUP.com infographic resume—Bob
    Smith sample


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-27`](#c04.xhtml_figureanchor4-27)


    ### Cvgram.me


    Anyone can login to `cvgram.me` with either a LinkedIn or a Facebook account.
    Depending on which type of account is used to login, `cvgram` will create an infographic
    resume based on the available information in the user’s profile. As shown in [Figure
    4-28](#c04.xhtml_figure4-28), once the initial resume has been created the user
    can edit their information and many of the design options (themes, colors, fonts,
    and more). A custom URL is created for each user to share his or her resume publicly
    with others. The service is for online sharing, so no options for downloading
    the infographic resume are available.


    ![c04f028.tif](image_fi/582305c04/c04f028.png)


    # FIGURE 4-28: (#c04.xhtml_figureanchor4-28) cvgram.me infographic resume builder


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-28`](#c04.xhtml_figureanchor4-28)


    ### Shine


    ![c04uf006.tif](image_fi/582305c04/c04uf006.png)


    A new iPad app was recently launched in the iTunes store that will walk the user
    through the process of generating a personal infographic resume. Developed by
    Boluga, the `Shine` app ([Figure 29](#c04.xhtml_figure4-29)) is free to download
    and includes one complete resume template. Additional design templates and features
    are available through in-app purchases. Once a resume is created, the user can
    e-mail, share, and print copies directly from the iPad and the PDF files that
    `Shine` creates are fully text-searchable.


    ![c04f029.tif](image_fi/582305c04/c04f029.png)


    # FIGURE 4-29: (#c04.xhtml_figureanchor4-29) Shine is an iPad app that can be
    used to create a personal infographic resume


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-29`](#c04.xhtml_figureanchor4-29)


    In addition, you can use any of the infographic design resources listed in [Chapter
    7](#c07.xhtml), “Design Resources,” to create the different types of visualizations
    used in infographic resumes. The visuals created by these tools can be inserted
    into your infographic resume as one component of the overall design. You can see
    my own network map ([Figure 30](#c04.xhtml_figure4-30)) from `InMaps` (`inmaps.linkedinlabs.com`](http://inmaps.linkedinlabs.com)).
    `InMaps` is one online design tool worth specific mention in this chapter because
    it’s a data visualization that is aimed at being used as a visualization of you
    as an individual, which is perfect for use on an infographic resume. With user
    permission, the tool accesses the user’s profile on LinkedIn and creates a network
    map of all the connections with that user and any interconnections between people
    in the user’s network. It also creates color clusters of people related to the
    same company or industry, and creates a custom URL link that can be shared with
    others to view the resulting network map online. The image generated can also
    be easily inserted into an infographic resume.


    ![c04f030.tif](image_fi/582305c04/c04f030.png)


    # FIGURE 4-30: (#c04.xhtml_figureanchor4-30) LinkedIn network map


    [`Coolinfographics.com/`](http://Coolinfographics.com)`Figure-4-30`](#c04.xhtml_figureanchor4-30)


    These network maps of connections are intended to show the reader how connected
    the candidate is with other professionals within a particular industry without
    showing the actual names of those connections. It is definitely a more qualitative
    design element that is indicative of how involved and engaged the candidate is
    with creating and maintaining connections online.


    ## All About You


    Resumes are all about telling your story. Infographic resumes allow you to leverage
    the benefits of visual communication to tell your story in a more effective way.
    Making a resume stand out in a positive way, attracting the attention of a potential
    employer, making the personal information easier to understand, and making a candidate
    more memorable to the recruiter or hiring manager are all reasons why infographic
    resumes will continue to develop and become more popular.


    I’ve accumulated hundreds of real infographic resumes in a Pinterest Board at
    [`pinterest.com/rtkrum/infographic-visual-resumes/`](http://pinterest.com/rtkrum/infographic-visual-resumes/).
    If you create one for yourself, send me a link. I’d love to add it to the collection!


    ## References


    1. “Keeping an Eye on Recruiter Behavior,” The Ladders, 2012, [`http://cdn.theladders.net/static/images/basicSite/pdfs/TheLadders-EyeTracking-StudyC2.pdf`](http://cdn.theladders.net/static/images/basicSite/pdfs/TheLadders-EyeTracking-StudyC2.pdf)


    ## Links


    1. Michael Anderson’s infographic resume: [`http://theportfolio.ofmichaelanderson.com/resume.pdf`](http://theportfolio.ofmichaelanderson.com/resume.pdf)

    2. Faz Besharatian’s infographic resume: [`http://visualresume.fazfolio.com`](http://visualresume.fazfolio.com)

    3. Randall Knapp’s infographic resume: [`http://randallknapp.com`](http://randallknapp.com)

    4. Mike Wirth’s infographic resume: [`http://www.mikirthart.com/?projects=infographic-resume`](http://www.mikirthart.com/?projects=infographic-resume)

    5. Duncan McKean’s infographic resume: [`http://duncanmckean.com/projects/infographic-cv/`](http://duncanmckean.com/projects/infographic-cv/)

