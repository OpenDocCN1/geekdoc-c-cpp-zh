    ### Interactive Infographics


    Interactive infographics are designs that give readers some control over the data
    or the visualization displayed. They are also popular because they keep the readers
    engaged with the data for a much longer period of time than static infographics.
    Some of these sites are standalone data visualizations, and others are built into
    a larger infographic design.


    *The New York Times* website has become recognized by many as the world leader
    in interactive infographics and data visualizations. [Figure 1-38](#c01.xhtml_figure1-38)
    shows a map of results from the 2012 U.S. Presidential election. Each county in
    the country is colored a shade of red or blue depending on the final tally of
    votes. I would call this an interactive data visualization, but because of the
    historical use of the word infographics within the newspaper design industry,
    many people refer to this as an interactive infographic.


    ![c01f038.tif](image_fi/582305c01/c01f038.png)


    [**FIGURE 1-38:**](#c01.xhtml_figureanchor1-38) *The New York Times* 2012 Election
    interactive infographics


    [`coolinfographics.com/Figure-1-38`](http://coolinfographics.com/Figure-1-38)


    In this case, the data was being updated in real-time as the election results
    were officially released. Users could see the map evolve as additional results
    were reported. The user had the ability to zoom in to specific states, view the
    numeric data from each country or change the display based on the choices along
    the left-hand side.


    Some companies design and provide interactive data visualization tools for others
    to use. Tableau Software is one of the leaders in this area and makes its Tableau
    Public version of their product available to users for free. The tool enables
    us to use our own data to create interactive visualizations and then embed the
    visualizations into our websites ([Figure 1-39](#c01.xhtml_figure1-39)).


    ![c01f039.tif](image_fi/582305c01/c01f039.png)


    [**FIGURE 1-39:**](#c01.xhtml_figureanchor1-39) Tableau Public


    [`coolinfographics.com/Figure-1-39`](http://coolinfographics.com/Figure-1-39)


    *Source:* Tale of 100 Entrepreneurs*, Tableau Software.*


    A few complete infographics have been designed using Tableau as a design tool
    to include interactive data visualizations within a larger infographic design.
    *Inside Super PACs* ([Figure 1-40](#c01.xhtml_figure1-40)) was designed by Jess
    Bachman at Visually, Inc., using Tableau visualization modules as the charts within
    the design. As a result, all the charts are interactive, and the reader can adjust
    any of them by clicking to highlight different information.


    ![c01f040.tif](image_fi/582305c01/c01f040.png)


    [**FIGURE 1-40:**](#c01.xhtml_figureanchor1-40) Separate interactive charts were
    put together to create the complete infographic


    [`coolinfographics.com/Figure-1-40`](http://coolinfographics.com/Figure-1-40)


    *Source:* Inside Super PACs*, Visually, Inc.*


    ## Final Thoughts


    Infographics have exploded in popularity in just a few years. Their formats will
    undoubtedly evolve into new types of media, but the use of data visualization
    and design to tell stories with data will only continue to grow. We will never
    have less data available than we do today. The amount of data we have to filter
    through and understand will continue to grow, and infographic designs are one
    of the best tools we have to share and communicate the things we can learn from
    that information.


