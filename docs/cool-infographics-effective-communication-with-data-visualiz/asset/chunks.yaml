- fmt: '

    | Navigation | Most sites have a consistent form of navigation throughout the
    site. A navigation bar across the top or navigation links down the sidebar are
    common. Where you add the link to the infographic depends of the topic of the
    design. |

    | Front page link | A small thumbnail image on the front page is the best way
    to draw viewers in to see the full-size infographic, but even a text link on the
    front page can drive a lot of your website’s organic traffic to view the infographic.
    |

    | Product page link | If the infographic topic is specifically related to one
    of the company’s products or services, a thumbnail or text link to the infographic
    on the product page can also help reach the target audience. |

    | Blog | The company blog is an ideal place to promote the infographic. Use the
    smaller 500-pixel version of the image in the blog post and link to the dedicated
    landing page, so that readers can find the full-size version. |

    | Press Releases | If press releases are a part of the website, write a press
    release about the key message of the infographic that includes the image and a
    link to the landing page to reach an entirely different audience than the blog.
    |

    | Media Library | Upload a copy of the infographic file to the media library on
    your website to allow media contacts access to download the design and include
    it in any articles. |


    ### Table 3-1](#c03.xhtml_tableanchor3-1) Effective link locations


    Often companies also have some more traditional, legacy forms of communication.
    You might include the infographic in regularly scheduled emails or printed newsletters
    physically mailed to customers. Use these communication channels as an additional
    way to share the infographic with a broader audience and include the link to the
    infographic landing page.


    #### Company Social Accounts


    These days, it’s highly likely that your company maintains its own social network
    accounts on Facebook, Twitter, Google+, Flickr, Pinterest, and so on. Companies
    should absolutely post links to their own infographic on every social media account
    they have and should post it multiple times. If you post only once, most of your
    audience will miss it. Your social media followers aren’t watching all the time,
    and if they aren’t paying attention, your post will scroll off the bottom of the
    page before they have a chance to see it as other new content is posted into their
    news feeds. When you log in to `Facebook`, you probably don’t scroll back to where
    you left off yesterday and read everything. You probably read only the top few
    pages and then move on to other things. Anything further down in your feed is
    never seen.


    There’s some good data supporting this behavior. `Bitly.com` is a popular link-shortening
    service. Because it is so popular across many services, it has some amazing quantitative
    data about social media links. As you might imagine, when new content is posted
    online, there is an initial surge of activity by readers clicking the links to
    view the new content, but then the traffic decreases over a long period of time.
    Nothing truly dies on the Internet, so the content may continue to get a small
    number of views even years later.


    In 2011, `bitly.com` published an analysis of what it calls the mean half-life
    of the links posted to various social networks using its service. By its definition,
    the half-life of a link posted to social media is the amount of time at which
    this link will receive one-half of the total number of clicks it will ever receive.


    What `bitly.com` found was quite surprising. You can see the chart it created
    from the data in [Figure 3-14](#c03.xhtml_figure3-14), and the initial surge of
    clicks is obvious. From the `bitly.com` blog post:³


    ![c03f014.tif](image_fi/582305c03/c03f014.png)


    ### FIGURE 3-14](#c03.xhtml_figureanchor3-14) A posted link will get half of the
    clicks it will ever get in the first 3 hours.


    *Source:* *Half-life of social media links*, [`bitly.com`](http://www.bitly.com)*


    On average, this means that after about `3` hours, your link has dropped low in
    the news feeds of your followers and they aren’t seeing your post anymore. Not
    surprisingly, if they don’t see the link, they don’t click the link. This is data
    from `2011`, and since then more people have joined social networks, and more
    content is posted every day. If this analysis were repeated today, the half-life
    would probably be even shorter because of the increasing velocity of tweets and
    posts as they scroll down the page faster and faster every day.


    You can also see on the chart that videos on `YouTube` had a much longer half-life
    of `7.4` hours, but that information is not applicable to the majority of infographics
    posted online. Most infographics are not videos and don’t get posted to `YouTube`.
    However, this strategy wouldn’t be much different for infographic videos, based
    on the much longer scale of an online lifespan that covers months or years.


    So how can you use this information to your benefit? There are two parts to a
    company’s social media strategy based on this data:


    First, a company should post links to an infographic multiple times over a period
    of time. How long? Post once a day for a week and no more than twice in one day.
    Posts should be at least `5` hours apart to catch a different portion of your
    audience that pays attention to its social networks at different times of the
    day. Some people check `Facebook` on lunch breaks and other people don’t check
    until they get home in the evening. Spread the posts out to different parts of
    the day.


    Second, there is a high likelihood that a small portion of your audience will
    see a few of your posts linking to the same infographic. You don’t want these
    people seeing you repeat that exact same text from earlier. Each post should be
    written differently. Highlight a different piece of information from the infographic
    and include both an image (if the social network allows images) and the link to
    the landing page. Some social networks can automatically find and display the
    image when you add the `URL` link.


    Each post should be treated like a headline. You want to catch the attention of
    your audience and entice them to want to read more. If your company has them,
    involve the copywriting and `PR` staff to help write the text of the different
    posts. They are experts at writing these ready-for-press releases and advertisements.


    #### Kickoff Sharing


    The last thing you should leverage from within a company is the existing pool
    of employees. Share the infographic internally and invite all your employees to
    share it publicly within their own social networks. This has the potential to
    kickoff the sharing counters on the infographic landing page and may reach some
    networks of people that don’t follow any of the company’s communication channels.


    The social networks rely on the momentum of frequently shared content to promote
    the most popular posts. A popular post is shown to more users, which, in turn,
    can make it even more popular. Asking your employees to help kick-start this cycle
    of sharing can trigger the promotion of posts linked to your infographic. Many
    people also look specifically for the current trending posts or most popular topics.


    The challenge is that many companies have a big hurdle to overcome here with their
    employees. Most employees don’t work for the `marketing` or `PR` departments and
    they may fear that posting anything related to their company could impact their
    continued employment. That is, they don’t want to get fired. They may want to
    keep their work life separate from their personal life. It may be fear that they
    could be misunderstood as speaking on behalf of the company. The company may have
    specifically asked them not to post any information about the company to protect
    confidential information.

