    | 导航 | 大多数网站在整个站点范围内都有一致的导航形式。顶部的导航栏或侧边栏的导航链接非常常见。在何处添加信息图的链接取决于设计的主题。 |

    | 首页链接 | 在首页上放置一个较小的缩略图是吸引观众查看完整尺寸信息图的最佳方式，但即使是首页上的文本链接，也能引导你网站的大量自然流量来查看信息图。
    |

    | 产品页面链接 | 如果信息图的主题与公司的某项产品或服务专门相关，在产品页面上放置信息图的缩略图或文本链接也有助于触达目标受众。 |

    | 博客 | 公司博客是推广信息图的理想场所。在博客文章中使用较小的 500 像素版本图像，并链接到专门的落地页，这样读者就能找到完整版本。 |

    | 新闻稿 | 如果新闻稿是网站的一部分，可以针对信息图的核心信息撰写一篇新闻稿，其中包含图片和指向落地页的链接，以触达与博客完全不同的受众群体。 |

    | 媒体库 | 将信息图文件的副本上传到网站的媒体库中，允许媒体联系人下载该设计并将其引用任何文章中。 |


    ### 表 3-1](#c03.xhtml_tableanchor3-1) 有效的链接位置


    公司通常还有一些更传统的、旧有的通信形式。你可以将信息图包含在定期发送的电子邮件或邮寄给客户的打印简书中。利用这些通信渠道作为与更广泛受众分享信息图的额外方式，并包含信息图落地页的链接。


    #### 公司社交账号


    如今，你的公司极有可能在 Facebook、Twitter、Google+、Flickr、Pinterest 等平台上维护自己的社交网络账号。公司绝对应该在拥有的每一个社交媒体账号上发布自己的信息图链接，并且应该发布多次。如果你只发布一次，大多数受众都会错过它。你的社交媒体粉丝并不是一直都在看的，如果他们没有注意，随着其他新内容发布到他们的新闻流中，你的帖子会在他们有机会看到它之前就滚动到页面底部。当你登录
    `Facebook` 时，你可能不会回到昨天离开的地方并阅读所有内容。你可能只读了顶部的几页然后就去忙其他事情了。流中更靠下的内容永远不会被看到。


    有一些良好的数据支持这种行为。`Bitly.com` 是一个流行的链接缩短服务。因为它在许多服务中非常流行，它拥有关于社交媒体链接的一些惊人定量数据。正如你所想象的，当新内容在网上发布时，读者点击链接查看新内容的活动最初会有一个激增，但流量在很长一段时间内会减少。互联网上没有东西是真正消失的，因此内容在几年后可能继续获得少量浏览。


    2011 年，`bitly.com` 发布了关于其服务发布在各种社交网络上的链接的平均半衰期的分析。根据它的定义，发布在社交媒体上的链接的半衰期是指该链接接收到其总点击数二分之一的时间。


    `bitly.com` 的发现非常令人惊讶。你可以从它根据图 3-14 数据创建的图表中看到，点击的激增是显而易见的。来自 `bitly.com` 博客文章：³


    ![c03f014.tif](img/c03f014.png)


    ### 图 3-14](#c03.xhtml_figureanchor3-14) 发布的链接将在前 3 小时内获得其总点击量的一半。


    *来源：* *社交媒体链接的半衰期*，[`bitly.com`](http://www.bitly.com)*


    平均而言，这意味着大约 `3` 小时后，你的链接在粉丝的新流中排名就会下降，他们不再看到你的帖子了。意不意外的是，如果他们没看到链接，就不会点击链接。这是
    `2011` 年的数据，从那以后有更多的人加入了社交网络，每天发布的内容也更多。如果今天重复这项分析，半衰期可能会更短，因为推文和帖子的速度日益增加，它们每天在页面上滚动越来越快。


    你也可以从图表中看到，`YouTube` 上的视频半衰期长得多，为 `7.4` 小时，但该信息不适用于大多数在线发布的信息图。大多数信息图不是视频，也不会发布到
    `YouTube` 上。然而，基于涵盖数月或数年的更长的在线寿命，这种策略对于信息图视频来说不会太大区别。


    那么，你如何利用这些信息来造自己呢？根据这些数据，公司的社交媒体策略分部分：


    第一，公司应该在一段时间内多次发布信息图链接。发布多长时间？每天发布一次，且每天不超过两次。发布之间的间隔至少应为 `5` 小时，以捕捉在一天不同时间关注社交网络的不同受众群体。有些人会在午休时间检查
    `Facebook`，而另一些人直到晚上回到家才检查。将帖子分散在一天的不同时段。


    其次，极有可能你的受众中有一小部分人会看到几次指向同一信息图的帖子。


