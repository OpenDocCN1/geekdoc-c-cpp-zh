- fmt: '

    Along with the explosion of infographics online in the last couple of years, the
    number of new data visualization and infographic software applications and websites
    online has also grown dramatically. There is a huge variety of software, both
    free and paid, available to users—and the challenge is making a choice from all
    the options.


    Many people are surprised to learn that the vast majority of the data visualizations
    created to be included in the infographics are designed manually. People seem
    to think that we load the data into a magic computer program, and *POOF!* it spits
    out an amazing infographic. Not true.


    ## Desktop Software Tools


    Most of the infographics that exist are put together with desktop application
    software. You can use these applications to visualize the data, edit the image
    of a logo, adjust a photo, or put the whole infographic design together. Desktop
    applications are the main tool of designers, but there are many more applications
    beyond those mentioned here.


    ### Vector Graphics


    All infographics designers need a core vector graphics software program they can
    depend on. No matter where you create the data visualizations or illustrations,
    the final product is usually put together in a vector graphics program.


    For designers, the main advantage of a vector graphics program is that all the
    text, photos, illustrations, and data visualizations are treated as separate objects
    that can be easily moved, resized, overlapped, and rotated. This makes putting
    together the layout of the final infographic design much easier.


    Any shapes or objects created in a vector graphics program are in a vector format
    (not a static bitmap or raster image), so they can be resized without losing any
    resolution or clarity. Vector images are actually mathematical equations that
    define how to display the shape on screen so the software can recreate the identical
    shape at any size with crisp, smooth edges.


    Most vector graphic programs can also import static images (such as photographs)
    that are treated as moveable objects, but they have a fixed resolution. It’s simple
    for a designer to move a static image and integrate it into the overall design,
    but resizing static images can be a problem. If a designer resizes a static image
    larger than its original resolution, it begins to look pixelated or blurry. This
    is why a designer will create objects as vectors whenever possible.


    The circles shown in [Figure 7-1](#c07.xhtml_figure7-1) are a quick example of
    the difference between vector and static objects. If the original small circle
    shape was a vector object, you can see how it would retain the crisp, clean edges
    when enlarged. The software redraws a new edge for a circle with a larger diameter.
    Conversely, if the original circle is only a static image of a circle with a fixed
    resolution, the pixelated edges are magnified when the circle is enlarged.


    ![c07f001.png](image_fi/582305c07/c07f001.png)


    [**FIGURE 7-1:**](#c07.xhtml_figureanchor7-1) Differences when enlarging vector
    and static images


    #### Adobe Illustrator


    ![c07uf001.png](image_fi/582305c07/c07uf001.png)


    Adobe Illustrator ([Figure 7-2](#c07.xhtml_figure7-2)) is the premium vector graphics
    program on the market—and also the most expensive. As part of the Adobe Creative
    Suite, this is the package that most graphic designers rely on for any vector
    graphics work. It’s big, it’s complicated, and for any nongraphic designers that
    want to try to design their own infographics, the sheer complexity of learning
    Adobe Illustrator is intimidating. (`www.adobe.com`](http://www.adobe.com))


    ![c07f002.png](image_fi/582305c07/c07f002.png)


    [**FIGURE 7-2:**](#c07.xhtml_figureanchor7-2) Adobe Illustrator screen shot


    #### Adobe InDesign


    ![c07uf002.png](image_fi/582305c07/c07uf002.png)


    Another application from the Adobe Creative Suite, InDesign is the modern-day
    desktop publishing program ([Figure 7-3](#c07.xhtml_figure7-3)). Meant for long-format
    print layouts, such as magazines and books, InDesign is also a great tool to put
    together many different pieces into a complete infographic. If your design has
    a lot of text, InDesign is especially useful for its text wrapping around images.
    (`www.adobe.com`](http://www.adobe.com))


    ![c07f003.png](image_fi/582305c07/c07f003.png)


    [**FIGURE 7-3:**](#c07.xhtml_figureanchor7-3) Adobe InDesign screenshot


    #### ![c07uf003.png](image_fi/582305c07/c07uf003.gif)OmniGraffle


    OmniGraffle ([Figure 7-4](#c07.xhtml_figure7-4)) from the Omni Group is my personal
    application of choice when it comes to putting the final infographic designs together.
    I find it to be a much more lightweight and easier-to-use application than Adobe
    Illustrator, with most of the graphic functions required. Because it is primarily
    a diagramming tool, connecting objects together for flowcharts or network diagrams
    is easy. Although this program is Mac-only, there’s also an OmniGraffle for iPad
    app that can also display and edit files created with the desktop application
    ([Figure 7-5](#c07.xhtml_figure7-5)). (`www.omnigroup.com/products/omnigraffle/`](http://www.omnigroup.com/products/omnigraffle/))


    ![c07f004.png](image_fi/582305c07/c07f004.png)


    [**FIGURE 7-4:**](#c07.xhtml_figureanchor7-4) OmniGraffle screenshot


    ![c07f005.png](image_fi/582305c07/c07f005.png)


    [**FIGURE 7-5:**](#c07.xhtml_figureanchor7-5) OmniGraffle for iPad


    #### ![c07uf004.png](image_fi/582305c07/c07uf004.png)Inkscape


    Inkscape ([Figure 7-6](#c07.xhtml_figure7-6)) is an open-source vector graphics
    editor that adds the use of Scalable Vector Graphics (SVG), an open XML-based
    W3C standard, as the native format. This is a powerful vector graphics program
    available for multiple platforms (Windows, Mac and Linux). The biggest advantage
    is that it’s a free program for download. (`www.inkscape.org`](http://www.inkscape.org))


    ![c07f006.png](image_fi/582305c07/c07f006.png)


    [**FIGURE 7-6:**](#c07.xhtml_figureanchor7-6) Inkscape screenshot


    #### Microsoft PowerPoint ![c07uf005.png](image_fi/582305c07/c07uf005.png)


    What? Microsoft PowerPoint? Yep. Although, it’s obviously mainly used and marketed
    as a presentation application, at its heart PowerPoint ([Figure 7-7](#c07.xhtml_figure7-7))
    is a simple vector graphics program. The application allows users to create floating
    text blocks, insert vector object shapes and import images to arrange in an infographic
    design. The process should be familiar to people that design presentation slides
    since they are already comfortable moving objects around the page.


    ![c07f007.png](image_fi/582305c07/c07f007.png)


    [**FIGURE 7-7:**](#c07.xhtml_figureanchor7-7) Microsoft PowerPoint screenshot


    PowerPoint also has the advantage that Microsoft Office is probably on your computer,
    so it’s a tool you or your company already owns. Designers can create custom paper
    sizes to layout a tall format infographic design instead of the standard presentation
    slides. If you use the built-in charts as part of the design, you can easily update
    the infographic with new data at a later date. (`www.powerpoint.com`](http://www.powerpoint.com))


    ### Image Editing


    Although some designers create entire infographic designs in an image editor application,
    these are primarily used to clean up images that are later imported into the vector
    graphics application. Image editors are a fantastic tool for changing colors,
    cropping images, and removing unwanted portions of images.


    To make the background of a company logo transparent so that it blends into your
    infographic design, an image editor is the perfect tool. There are hundreds of
    image editing programs you can use, but these are the main ones used as part of
    an infographic design.


    #### Adobe Photoshop


    ![c07uf006.png](image_fi/582305c07/c07uf006.png)

