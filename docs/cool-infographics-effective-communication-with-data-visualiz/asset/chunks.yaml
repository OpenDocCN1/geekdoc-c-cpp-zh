    Although a completely different design style, Duncan McKean’s infographic resume
    (`[Figure 4-6](#c04.xhtml_figure4-6)]`) takes a similar approach by making the
    entire infographic resume design into a timeline visualization.


    ![c04f006.tif](image_fi/582305c04/c04f006.png)


    [`FIGURE 4-6:`](#c04.xhtml_figureanchor4-6) Infographic timeline resume—Duncan
    McKean


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-6`](#c04.xhtml_figureanchor4-6)


    A job candidate’s work and education history over time is one of the most important
    pieces of information to a recruiter or hiring manager. An infographic timeline
    can visually demonstrate a candidate’s history in an engaging way that’s faster
    and easier to understand.


    ### Relative Experience Designs


    Levels of experience in different job skills are normally qualitative and subjective.
    The candidate may consider himself to be highly skilled at project management,
    but not have any firm numeric data to back up that claim. That’s where relative
    experience comparisons come into play.


    Hana Tesar’s infographic resume (`[Figure 4-7](#c04.xhtml_figure4-7)]`) is based
    on showing her skills in relation to each other. There are no numbers shown as
    value labels on the bar charts, but visually she is telling the reader how her
    skill levels compare. The implication is that the highest bars are not only her
    strongest attributes, but also implies that they are areas in which she is exceptionally
    skilled when compared to other candidates within the job market. She has some
    experience in all the skills shown, but the highest bars are the ones she wants
    to highlight most to a potential employer or client.


    ![c04f007.tif](image_fi/582305c04/c04f007.png)


    [`FIGURE 4-7:`](#c04.xhtml_figureanchor4-6) Relative experience resume—Hana Tesar


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-7`](#c04.xhtml_figureanchor4-6)


    This is where visually comparing multiple attributes with a data visualization
    becomes effective. In `[Figure 4-8](#c04.xhtml_figure4-8)]`, Navdeep Raj uses
    a different skills comparison in his resume design. The different job skills are
    shown with bars of varying size. This communicates to the reader that the candidate’s
    skills are strongest in User Experience and Information Architecture compared
    to the other skills that he thought were also appropriate to include. The candidate
    does have some skill in 3-D animation, but it’s weaker than the other skills.


    ![c04f008.tif](image_fi/582305c04/c04f008.png)


    [`FIGURE 4-8:`](#c04.xhtml_figureanchor4-6) Skills visualization resume—Navdeep
    Raj


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-8`](#c04.xhtml_figureanchor4-6)


    Visualizing the skills in relation to each other allows the candidates to communicate
    their subjective strengths in key areas without needing to assign specific numeric
    values to each skill.


    Bar charts are the most common visualization to show skills, but there are many
    other design styles that could also be used. Circle sizes, sliders, bubble charts,
    Sankey diagrams rose diagrams and more can also be effective visualizations to
    display proficiency among multiple skills.


    ### Geographic Designs


    Where a candidate has lived and worked can also be relevant information on a resume.
    Maps are a common design element to show not only employment locations, but also
    to visualize length of stay, the sequence of the locations, or the many different
    countries visited in the course of a career.


    A map visualization dominates the space on Ana Foureaux Frazao’s 2-page infographic
    resume (`[Figure 4-9](#c04.xhtml_figure4-9)]`). Her prior roles in International
    Public Relations are clearly shown to the reader and strongly reinforce her international
    experience. The locations of her positions are color-coded by the type of work
    she did and the map design is simplified by removing all the country borders.


    ![c04f009.tif](image_fi/582305c04/c04f009.png)


    [`FIGURE 4-9:`](#c04.xhtml_figureanchor4-6) Geographic infographic resume—Ana
    Foureaux Frazao


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-9`](#c04.xhtml_figureanchor4-6)


    Maps have a unique challenge when used as data visualizations in a resume. The
    design needs to illustrate enough spatial information to make the identified locations
    easily recognizable to the audience, but too much detail (such as terrain, borders,
    cities, and roads) may also create unwanted visual noise. The focus of the design
    should be the key information the candidate wants to communicate, not a pretty
    map.


    The design should also limit the amount of geographic information displayed to
    only the required area. If a candidate has worked in three different cities in
    the state of California, a map of the entire United States is not needed. If a
    candidate has worked in five cities across Canada, the entire world map would
    take up valuable space. The real estate on the resume page is too valuable to
    waste. The infographic should show only as much map space as needed to include
    all the highlighted locations in a recognizable space.


    Chris Robertson’s resume (`[Figure 4-10](#c04.xhtml_figure4-10)]`) shows only
    as much map space as needed to include all the highlighted locations in a recognizable
    space. This design shows only as much map space as needed to include all the highlighted
    locations in a recognizable space.


    ![c04f010.tif](image_fi/582305c04/c04f010.png)


    [`FIGURE 4-10:`](#c04.xhtml_figureanchor4-6) Infographic resume with map data—Chris
    Robertson


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-10`](#c04.xhtml_figureanchor4-6)


    ### Company Logos and Icons


    One of the easiest and most effective ways to add visual design elements to a
    resume is by including company logos. Companies have spent a lot of effort, time,
    and money to build their brand equity and recognition. Prior employment with a
    recognized company is a positive attribute in employment history and reflects
    well on the candidate. When people include the name of a prior company on their
    resume, one of the primary desired benefits is that respect for a recognized company
    will transfer some of that will to the job candidate.


    In traditional text resumes, people use many different text adaptations to emphasize
    the different companies they have worked in the past. Bold, italics, different
    font type, or larger font size are all used to make the names of companies stand
    out from a page full of text.


    After reading the study from The Ladders (mentioned earlier) that concluded most
    recruiters look at each resume for only six seconds, Adrian Saker created this
    logo-only resume, using logos from both the companies he worked for, the client
    projects he was involved with, and additional logos for skills, education, and
    interests (`[Figure 4-11](#c04.xhtml_figure4-11)]`).


    ![c04f011.tif](image_fi/582305c04/c04f011.png)


    [`FIGURE 4-11:`](#c04.xhtml_figureanchor4-6) Logo resume—Adrian Saker


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-11`](#c04.xhtml_figureanchor4-6)


    The addition of graphic logos from the different companies included in prior work
    experience can draw the reader’s attention. If the companies are known and recognized
    by the reader, the logos can quickly make a candidate’s work history easy to understand.
    If those companies have a positive reputation, the job candidate may instantly
    leave a positive impression on the hiring managers, even before they read a single
    word of the resume.

