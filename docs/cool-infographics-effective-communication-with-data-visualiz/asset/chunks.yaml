    In this example, the rectangles are only showing select highlights from the budget,
    and the expenses are color-coded by category. This also allows space for a visual
    hierarchy that allows some of the major expenses within certain departments to
    be shown as smaller rectangles within the larger rectangles of their parent departments.


    ## Sales and Profit Data


    Companies often have some internal confusion differentiating between sales dollars
    and profit dollars. Often, the products and services with the highest sales revenue
    are not what earn the most profit for the company. This type of analysis can be
    organized by product, product line, customers, brand, geographic location, sales
    manager, and so on.


    [Figure 5-4](#c05.xhtml_figure5-4) shows a simple visualization using opposing
    bar charts of annual sales and annual profit for a list of 10 products. Because
    the profit rate percentages are different across the available products, you can
    see that in this case the best-selling product is not the most profitable product
    for the company. This type of chart with bars going in opposite directions isn’t
    available as a standard chart type in Excel and would have to be created manually
    using rectangle shapes.


    ![c05f004.tif](image_fi/582305c05/c05f004.png)


    [**FIGURE 5-4:**](#c05.xhtml_figureanchor5-4) Sales and profit visualization


    Visualizing the scale of business with key customers can help everyone within
    a company understand how much of the company’s sales come through different sales
    channels. Data visualizations like [Figure 5-5](#c05.xhtml_figure5-5) can be used
    in an annual report, a board meeting presentation, or printed out as a poster
    and hung in the hallway of the company office. Using the customer logos to make
    the information visual makes the information understandable at a glance.


    ![c05f005.tif](image_fi/582305c05/c05f005.png)


    [**FIGURE 5-5:**](#c05.xhtml_figureanchor5-5) Sales by retail channel visualization


    Many companies like to share information internally in this manner without showing
    the actual values. This can inform all the employees that walk by the poster with
    a consistent message, but also obscure the specific detailed financial information
    from any visitors that happen to be visiting the office (vendors or customers).


    ## Business Processes


    Clearly defined business processes are becoming essential within companies. As
    companies grow and hire more employees, they use formal business processes to
    help train and standardize their workflows across departments and locations. It
    could be the process to close the financial books at the end of each month, the
    process to inspect incoming products for quality, the process to hire a new employee,
    the process to handle each customer service call, or the process to make a change
    to the company’s website. The company needs to ensure that the functions are performed
    the same way every time, no matter which employees are involved in the work.


    Processes are generally shown as flowcharts. This is a formal, structured way
    to visualize a process with different symbols to represent different functions
    within the chart. For example, rectangles represent process steps, rectangles
    with tear-off bottoms represent documents, and diamonds represent decision points.


    Although they may be highly detailed and technically correct, one company could
    have hundreds of business processes to document. Just like a report that includes
    100 similar bar charts, these flowcharts begin to all look the same to employees
    and are not memorable. Illustration and infographic design can help make these
    processes unique, engaging, and memorable to employees.


    For example, [Figure 5-7](#c05.xhtml_figure5-7) shows an infographic timeline
    of the process to design a website designed by John Furness, the owner of Simple
    Square. The events are arranged along a straight timeline, but a number of additional
    elements of information have been added. The events are shown as circles sized
    to represent the estimated amount of involvement; the color coding shows the progression
    through the phases; individual milestones are shown connected to each phase; and
    the label font sizes are adjusted to show the level of importance (similar to
    a word cloud). This type of infographic design can be applied to many internal
    business processes.


    ![c05f006.tif](image_fi/582305c05/c05f006.png)


    **FIGURE 5-6:**Drawing a standard flowchart


    ![c05f007.tif](image_fi/582305c05/c05f007.png)


    [**FIGURE 5-7:**](#c05.xhtml_figureanchor5-7) *A Website Designed*, John Furness,
    Simple Square


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-5-7)[`Figure-5-7`](#c05.xhtml_figure5-7)


    *How Affiliate Marketing Works* in [Figure 5-8](#c05.xhtml_figure5-8) demonstrates
    a different way to visualize processes. The design visualizes a 10-step process
    as a path, and each event along the process is shown as a character performing
    an activity. The advantage of using characters in the design of a company process
    is that the employee audience can visualize themselves performing these functions
    and can more closely relate to the process.


    ![c05f008.tif](image_fi/582305c05/c05f008.png)


    [**FIGURE 5-8:**](#c05.xhtml_figureanchor5-8) Process visualized as a path with
    characters


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-5-8)[`Figure-5-8`](#c05.xhtml_figure5-8)


    *Source: How Affiliate Marketing Works*


    ## Strategies


    Similar to processes, strategies usually involve a number of connected events
    or activities, but they may not be organized in a chronological sequence. Visual
    strategies are good for showing the flow of information among connected activities
    so that employees or customers can easily understand.


    [Figure 5-9](#c05.xhtml_figure5-9) is an example of a social media content strategy
    from Chris Heiler, President and Founder of Landscape Leadership. This diagram
    shows how different forms of online content uploaded to various sites integrates
    into the company blog, and that the primary interaction with customers and fans
    will take place on company Facebook page. Of course, there would be a lot more
    detail about each activity in the plan, but a central diagram keeps everyone informed
    about the overall vision.


    ![c05f009.tif](image_fi/582305c05/c05f009.png)


    [**FIGURE 5-9:**](#c05.xhtml_figureanchor5-9) Example Social Media Strategic Plan


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-5-9)[`Figure-5-9`](#c05.xhtml_figure5-9)


    *Source: Landscape Leadership*


    ### Quantitative Research Data


    Companies often have a lot of research data. This might include market research,
    customer research, product performance data, consumer profiles, customer segmentation
    studies, conjoint research and many, many more. The complete reports from this
    research can easily be hundreds of pages long with detailed data tables and hundreds
    of charts.


    This quantitative data is fairly easy to load into the three standard charts (bar
    chart, line chart, and pie chart) but is not always easy to understand when forced
    into only these types of charts. Many times, it’s worth the time and effort to
    experiment with different methods to visualize the same data set to find a visualization
    that is easier for readers to understand.


    For demonstration purposes, I made up some quantitative research data to visualize.
    Seven aspects of three competing brands create 21 different statistical values
    from the responses. [Figure 5-10](#c05.xhtml_figure5-10) shows the default clustered
    bar chart from PowerPoint. In this case, this familiar format is not easy for
    the audience to read or understand quickly. Readers probably understand bar charts
    fairly well (they see them often enough), and after spending some time figuring
    out the color coding, they might start to make some observations by comparing
    the bars.

