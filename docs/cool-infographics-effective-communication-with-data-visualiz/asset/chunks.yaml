    Second, data visualization can make the understanding of a candidate’s unique
    information faster for the reader. Recent research has concluded that a recruiter
    or hiring manager looks at an individual resume for only an average of six seconds^([1]).
    By visualizing a candidate’s key information using data visualization design techniques,
    the reader can learn more about the candidate in that same short timeframe. Six
    seconds reading an infographic resume is more effective than six seconds reading
    a text resume. This means that hiring managers may understand more about job candidates
    that have infographic resumes.


    Third, because of the Picture Superiority Effect, anyone reading an infographic
    resume is much more likely to remember the visualized information three days later.
    The visualized data triggers the reader’s visual memory and the recruiter or hiring
    manager is more likely to remember that candidate after reviewing many resumes.
    This significantly improves the chances of a candidate to advance to the next
    step in the hiring process.


    ## What’s the Risk?


    The risk of using a poorly designed infographic resume is that they can quickly
    and effectively demonstrate that a job candidate would not be a good hire for
    the company.


    A poor design could:

    * Be visually unappealing

    * Visualize data incorrectly

    * Fail to visualize the relevant information

    * Confuse the reader with too many visualizations

    * Highlight the wrong attributes for the desired position

    * Use an inappropriate design tone (such as, a fun, lighthearted design style
    when applying for a serious role)

    * Not print correctly if not designed to fit standard paper sizes


    A poor design can stand out from the pile of job candidate resumes and create
    a negative impression with the recruiter just as fast and effectively as a good
    design can create a positive impression.


    Many of the best practices behind designing a good text resume apply to designing
    an infographic resume as well. Being concise and focused is critical. Candidates
    need to identify clearly their key strengths related to the type of position they
    would like to attain. An infographic resume should focus on communicating those
    key strengths quickly and clearly to the recruiter. If the design visualizes everything
    possible from a candidate’s history, the key strengths are likely to get lost
    in the visual noise, and the recruiter could become frustrated trying to read
    the resume.


    Just like every other resume, if the reader becomes confused, annoyed, or frustrated,
    the candidate’s resume can quickly end up in the trash.


    ## Designing an Infographic Resume


    Remember that infographics tell stories. Infographic resume designs should be
    used to tell the story about job candidates. The story can include their background,
    history, education, skills, experience, achievements, accomplishments, roles,
    successes, aspirations, goals, and more.


    The key to an effective infographic resume is to use data visualization design
    to highlight only the most important aspects for a specific individual. The visualizations
    draw the readers’ attention to the key information, and with the Picture Superiority
    Effect, that is the information from the resume most likely to be remembered.
    So, a younger, less experienced candidate might highlight education and software
    skill proficiencies, but an older, mature candidate could highlight major accomplishments
    and employment over many years with respected employers.


    The design challenge is to tell a simple story that is quick and easy to understand.
    The mistake many people make when designing an infographic resume is to attempt
    to visualize everything they can. Too many data visualizations can create excess
    visual noise and confuse the readers. The hiring managers may not understand the
    key attributes of the job candidate within those short few seconds they have to
    review the resume. As a general rule, the best designs include three or fewer
    data visualizations in the design. As an additional benefit, focusing on on the
    key attributes demonstrates to the hiring manager the candidate’s ability for
    clear and concise communication—a desirable skill for any position.


    The first step in the design process is to identify which aspects of an individual’s
    history are the most beneficial while also considering what is most relevant and
    important to the prospective employer. After the key aspects have been identified,
    the designer can begin to focus on which types of visualization design are appropriate
    to include.


    Most infographic resume designs focus on a combination of these three key types
    of information:

    1. Timeline of education and work experience

    2. Relative experience and proficiencies among key job skills

    3. Geographic locations


    ### Timeline Designs


    Designers have the same variety of design options for visualizing an individual’s
    history as seen in other infographic designs.


    Randall Knapp included a timeline of his programming experience as part of an
    overall infographic design ([Figure 4-4](#c04.xhtml_figure4-4)). He used an area
    chart with overlapping colors to highlight the different types of activities over
    a 7-year period. Even though the timeline is the main focal point, it’s part of
    a larger design that includes additional information and a separate visualization
    of skill proficiencies.


    ![c04f004.tif](image_fi/582305c04/c04f004.png)


    [FIGURE 4-4:](#c04.xhtml_figureanchor4-4) Timeline focused infographic resume—Randall
    Knapp


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-4`](#c04.xhtml_figureanchor4-4)


    The overlapping areas on the timeline also do a great job showing concurrent activities.
    We lead parallel lives, not sequential ones. Many people have roles that overlap
    each other, as well as with educational and other activities. A visual timeline
    is the best way to show that type of information that gets lost in a text-only
    resume. Going to school at night or working two jobs shows significant dedication
    and motivation in an individual’s history. With a text-only resume, the reader
    must take time to put together the timing of different activities to understand
    overlap or gaps in a candidate’s history. With a visual design, overlapping activities
    and gaps between roles are understood within seconds.


    Timelines usually highlight an individual’s history related to one or more of
    the following activities:

    * Time spent at learning institutions or earning degrees

    * Time spent working for different companies

    * Time spent holding different roles or positions

    * Time spent as a member or volunteer for organizations

    * Time spent using different software applications

    * Time spent in different locations

    * Major events or milestones in a person’s career


    Area charts are the most common data visualization design for timelines, but designs
    using line charts, number lines, and overlapping shapes are also common.


    Although many designs incorporate timelines as one element of an overall layout,
    designer Mike Wirth effectively used a large timeline visualization as his entire
    infographic resume design ([Figure 4-5](#c04.xhtml_figure4-5)).


    ![c04f005.tif](image_fi/582305c04/c04f005.png)


    [FIGURE 4-5:](#c04.xhtml_figureanchor4-5) Infographic timeline resume—Design by
    Mike Wirth


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-5`](#c04.xhtml_figureanchor4-5)


    In Mike’s resume, the years along the x-axis become the backbone of the entire
    design. It’s a central design element around which all the other information is
    placed on the page. The locations he has lived are shown as gray-colored columns
    in the background, and instead of overlapping colored sections, he uses a stacked
    area design to show the overall increase in total experience over time.

