- fmt: 'A handful of final things should be included at the end of every infographic
    design. Remember, after you release the infographic onto the wild Internet, it
    takes on a life of its own. It could be reposted by anyone and resized to fit
    into other site layouts (usually a reduction in size to fit onto a smaller web
    page).


    Some designs are initially published in combination with other text content on
    the original landing page or part of a longer blog post. All that extra text is
    typically ignored when the infographic is reposted and shared on other sites.
    The infographic image is usually shared by itself, so all the relevant data needs
    to be included in the infographic image file. This ensures that the important,
    relevant information is always available to the audience.


    ## Company Logo


    Where does the infographic come from? This may seem like a no-brainer, but some
    infographics published online don’t mention Digital Life with the iPad from NextWorth
    (shown previouslyin Figure 3-7) and has all the relevant information the company
    that published the infographic. Whoops—so much for creating links or building
    brand equity.


    A brand or company logo at the bottom of the design works nicely as an indication
    that, “This infographic was brought to you by the good people at Company X.” The
    URL to the company web page is also helpful and helps drive some additional traffic
    from interested readers.


    ## Copyright License


    As covered in [Chapter 2](#c02.xhtml_c2), “Online Infographics,” every infographic
    design is automatically protected by a standard copyright license in the United
    States. However, it’s better to explicitly state either a copyright or a Creative
    Commons license on the infographic. That way your choices covering how you want
    the infographic to be treated by others is in the infographic when it gets shared
    on any other sites on the Internet.


    This can be helpful if legal concerns arise. If people abuse your infographic
    design, posting a modified version or claiming it as their own design, you have
    a stronger legal position if the licensing restrictions were explicitly expressed
    on the original design.


    Don’t forget that a copyright statement also clearly identifies the copyright
    holder (a person or a company). If people want to contact the copyright holder
    to request additional permissions (such as including the infographic design in
    a book!) they need the ability to easily determine who owns the copyright.


    ## Original Landing Page URL


    As much as you would like them to, many people are not good about including a
    clickable HTML link back to your original infographic landing page when they repost
    the infographic on other sites.


    You can always make contact and ask them to add the link to their post under the
    terms of your copyright license, but that assumes you’re going to spend the time
    and effort to track down and verify every site that reposts the infographic. Even
    then, many sites will ignore your requests to add the link.


    It’s much easier to include the URL of the original infographic landing page in
    the infographic image. That way it’s built in to the infographic when it gets
    shared on other sites. If readers want to find the full-size original version,
    they have the URL they can type into their browser.


    ## Designer Credit


    Whenever possible, you should credit the infographic designer that designed the
    infographic. It might be you, a designer from within the company, a freelance
    designer, or an outside design firm.


    Readers appreciate infographic designs that come from an actual person as opposed
    to just a faceless company. They are more likely to comment, provide feedback,
    or share an infographic when they believe they are supporting (or criticizing)
    a specific individual. This sharing behavior is more frequent when they are sharing
    the visual story created by an individual as opposed to sharing a potential advertisement
    from a company. Infographics that list only the publishing company are often perceived
    as promotional material for the company, which can discourage people from sharing
    with their network of friends.


    Separately, if the designer or design firm has built up their own brand equity,
    citing the designer on the infographic can also convey some of that expertise
    and credibility onto the infographic. An infographic may be perceived as more
    credible and become popular online based on the reputation of the designer. Followers
    of a particular designer are likely to find the design and share it on their own.


    Of course, the credit listing also helps designers build their own credibility
    and helps to build the infographics design industry as a whole. Other companies
    that appreciate the design may follow the citation and contact the designer directly
    to discuss creating future designs. The reward for good work can be more work.


    ## Putting It Together


    You can see all these elements put together in the footer of an infographic design
    in [Figure 6-13](#c06.xhtml_figure6-13). This is a close-up of the bottom section
    from *Streamlining* Your included in the infographic JPG image file. In this way,
    all the important information travels with the infographic as it is shared on
    other websites across the Internet.


    ![c06f013.tif](image_fi/582305c06/c06f013.png)


    [**FIGURE 6-13:**](#c06.xhtml_figureanchor6-13) Information in the footer stays
    with the infographic when shared on other websites.


    [`Coolinfographics.com/`](http://Coolinfographics.com/Figure-6-13)[`Figure-6-13`](#c06.xhtml_figure6-13)


    *Source: Streamlining Your Digital Life with the iPad, NextWorth*


    ## Final Thoughts


    It doesn’t matter if you are designing infographics yourself or working with a
    designer. Using these tips as guidelines can make a huge difference with how effective
    the final design will communicate to the audience, build the company brand equity,
    and is shared in social media.


    Your next infographic design can avoid the most common design mistakes, and this
    will immediately make your design better than most of the other infographics published
    online.


    ## References


    1. Abraham H. Maslow, *The Psychology of Science*, (Richmond, CA: Maurice Bassett,
    1966), p. 15. [`http://books.google.com/books?id=3_40f8PW6QC&lpg=PP1&pg=PP1#v=onepage&q=false`](http://books.google.com/books?id=3_40f8PW6QC&lpg=PP1&pg=PP1#v=onepage&q=false)

    2. 2012 Statistical Abstract, U.S. Census, [`http://www.census.gov/compendia/statab/population.xhtml`](http://www.census.gov/compendia/statab/population.xhtml)

    3. Family icons set, iStockPhoto, [`http://www.istockphoto.com/stock-illustration-11683088-standard.php?st=4a39808`](http://www.istockphoto.com/stock-illustration-11683088-standard.php?st=4a39808)

    4. Google Docs spreadsheets, [`http://google.com/drive/apps.xhtml#product=sheets`](http://google.com/drive/apps.xhtml#product=sheets)


    ## Links


    1. *Where’s Google making its money?*, WordStream and NowSourcing: [`http://www.wordstream.com/articles/most-expensive-keywords.`](http://www.wordstream.com/articles/most-expensive-keywords.)

    2. *The Caffeine Poster*, InfoNewt: [`http://www.coolinfographics.com/caffeine-poster/`](http://www.coolinfographics.com/caffeine-poster/)

    3. *Star Wars* Infographics, Marc Morera: [`http://www.murera.com/starwars/`](http://www.murera.com/starwars/)

    4. *Streamlining Your Digital Life* with the iPad, NextWorth: [`http://www.nextworth.com/ipad3_infographic`](http://www.nextworth.com/ipad3_infographic)


    The art challenges the technology, and the technology inspires the art.


    —JOHN LASSETER


    # 7


    Design Resources


    The question I get asked more than any other is, “What software do you use to
    design infographics?” Usually, the answer is, “It depends,” because different
    projects need different data visualization applications based on the data the
    designer has to work with.'
