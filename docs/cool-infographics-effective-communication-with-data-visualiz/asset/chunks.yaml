    Mino Parisi 在图 4-17 中显示的简历就是这种设计的绝佳案例。他的信息图简历包含了了他的工作和教育经历时间线，以及一系列圆环图，显示了在不同类型的设计工作中中使用不同软件应用程序（通过颜色区分）的相对经验量。这种独立的设计虽然是
    Mino 许多关键属性的快照，但主要以图形为主，文字极少。他的全文本简历（意大利语）可单独提供，并包含了其经历的完整细节（图 4-18）。


    ![c04f017.tif](img/c04f017.png)


    图 4-17： 独立信息图简历——Mino Parisi


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-17`


    ![c04f018.tif](img/c04f018.png)


    图 4-18： 独立文本简历——Mino Parisi


    以这种方式使用信息图简历，本质上是将信息图设计作为广告，以吸引注意力或建立对候选人的认知。信息图设计会吸引雇主或客户的注意，他们随后可以查看传统的简历来获取完整细节。


    在这种格式下，信息图简历是传统简历的补充，它并不是替代品。


    作为这种格式的变体，信息图简历设计可以作为单独页面插入 `Microsoft Word` 文档或 `PDF` 文件，该文件还包含全文本简历页。这允许申请者在电子邮件或在线提交时仅提交一个文件。当潜在雇主查看或打印简历时，他们可以同时获得信息图简历和全文本简历，它们是独立的页面。上述
    Mino 的简历可以作为一个单个 `PDF` 文件在线提供下载，其中包含了信息图简历和文本简历的两个独立页面。


    ### 组合式信息图简历设计


    另一种有效的信息图简历格式是让设计师将单个数据可视化图直接嵌入到文本简历中。这种设计格式的优势是候选人只需要一个文档，就包含了视觉设计和全文本。在设计中，视觉元素与全文本细节相邻，因此读者在寻找关于候选人的详细信息时不需要频繁移动视线。


    Vanessa Wilson 的信息图简历（图 4-19）完美地展示了这一点。每个角色的全文本描述与页面左侧的视觉时间线相连。教育、工作经历和志愿者工作之间的重叠一目了见，每个部分的完整文本描述读者也能轻松获取。


    ![c04f019.tif](img/c04f019.png)


    图 4-19： 组合式信息图简历——Vanessa Wilson


    [`Coolinfographics.com/`](http://Coolinfographics.com)`图 4-19`


    这种组合设计格式可以通过将数据可视化图作为图像插入标准的 `Microsoft Word` 文档，并让简历文本环绕这些可视化图来实现。一种更高级的方法是使用如
    `Adobe InDesign` 等桌面出版应用将可视化图与文本整合。


    将此想法更进一步，如果数据可视化图是在 `Excel` 中设计的图表，则可以将图表链接到数据源，这样对数据进行的任何更新都会自动同步到简历设计中。


    使用这种设计风格，确保所有信息仍然存在于文本中至关重要。我们不想用图形取代信息。当提交到职位申请系统时，自动文本解析会忽略图像，但仍然可以访问全文本。如果需要纯文本文件格式，从
    `Microsoft Word` 将文档导出为 `.txt` 文件可以自动删除所有图像。


    这种格式的主要挑战是保持简历简短。如果目标是保持一页或两页的简历，候选人需要减少包含的文本量，以便为可视化图留出空间。


    ### 在线发布信息图简历


    在线发布信息图简历的策略与在线发布营销信息图图类似。候选人应该建立简历的主落地页位置，并在每次分享信息图简历时链接到该落地页。对于信息图简历而言，落地页通常托管在候选人的个人网站上，但简历落地页也可以托管在
    `Flickr.com`、`Behance.com`、`Visual.ly` 或 `Pinterest.com` 等图像网站上。


    无论信息图简历托管在网上，让查看和分享文件变得简单容易都是重要的。任何潜在的雇主或客户都应该可以下载不同文件格式的版本。至少应提供 `PDF` 版本下载，但同时也推荐
    `Microsoft Word` 版本。


    在社交媒体上轻松分享信息图简历的能力对于让你的简历出现在合适的人面前也同样有效。落地页上一定要包含主流社交媒体服务的分享按钮。许多并非潜在雇主的人可能会喜欢这种设计并希望在他们的网络中分享（就像这本书里一样）。对于任何信息图简历设计来说，这都是极佳的结果，因为它让更多人看到了简历，增加了被潜在雇主关注的机会。最近，LinkedIn
    增加了一种在个人资料中分享信息图简历的简单方法。用户现在可以添加图像和链接作为页面顶部摘要的一部分。通过添加简历落地页的 URL，`LinkedIn` 可以点击时显示信息图简历的缩略图并链接到落地页。

