    当你作为搜索引擎用户，考虑一个良好的搜索引擎的益处时，你可以很容易从结果的四个方面进行评估，以判断搜索是否成功：


    - **速度**——我获取结果的速度有多快？

    - **数量**——我得到了多少结果？

    - **相关性**——我得到的结果与我的需求有多相关？

    - **覆盖率**——结果中是否包含了所有重要页面？是否有遗漏任何主要页面？


    今天，在 Google 上搜索 `infographics`（信息图）一词，在 0.15 秒内找到了 14,300,000 条结果。哇！


    然而，在这四个方面中，最重要的是相关性。这并不取决于结果的数量，也不取决于它们出现的快慢。如果这 1400 万个结果没有一个是你想找的，你会感到非常不满意。事实上，即使多花一点时间，获得更少但更优质的结果，你可能也会感到更快乐。


    2013 年，微软 Bing 搜索引擎启动了一项广告活动，将其搜索结果的相关性直接与 Google 进行正面对决（参见图 3-3）。微软的人知道什么对用户来说很重要，它的营销活动在用户最关心的方面——相关性上，与市场领导者
    Google 直接进行竞争。


    ![c03f003.tif](img/c03f003.png)


    **图 3-3：** 微软 Bing 搜索引擎正在相关性上与 Google 直接竞争。


    [`www.bingiton.com`](http://www.bingiton.com)


    来源：微软的 Bing It On 广告


    ### SEO 的目标


    从营销人员的角度来看，将信息图作为在线 SEO 内容的目标是提高公司网页在相关关键词搜索结果中的排名，并最终增加网站的访问人数。信息图已成为一种流行的工具，因为它们非常易读且易分享，这为发布信息图的公司创造了更多的链接和浏览。


    当一张信息图在网上变得极其流行时，被称为“病毒式传播”。有多流行？内容要达到“病毒式传播”，并没有一个特定的数字浏览量阈值。在线病毒式传播的过程意味着越来越多的人在观看和分享这些内容，通常随着每一代人的传递而增加。这种示例参见图
    3-4。如果有 10 个人分享了原始信息图，每份分享又被两个追随者分享，而这些每份分享又被第二代的两个追随者分享，以此类推，增长可能是指数级的，但仍然是与网页的正常流量进行衡量的。


    ![c03f004.tif](img/c03f004.png)


    **图 3-4：** 病毒式现象，每一代社交分享都会导致至少两个额外的帖子


    在实践中，当一张信息图发生病毒式传播时，意味着社交媒体上的页面浏览和分享次数远超你的正常内容。这完全是相对的。所以，如果你公司博客上的某篇文章通常每天有 500
    次浏览，但突然因为你发布了一张很酷的信息图，某篇文章突然获得了 5,000 次浏览，那么它可能就“病毒式传播”了。你必须与你已发布的其他内容相比来考虑它的成功，因为没有简单的方法来观察或衡量这种分享现象。


    一个更有野心的目标是在一个（或多个）主要的在线新闻网站上发表。来自具有高 `PageRank` 分数的网站链接比来自小型个人博客的链接价值价值得多。因此，目标不仅是获得高浏览量，还要获得高价值网站的链接。最有价值的网站取决于你的行业。哪些新闻网站会发布关于你的公司、你的行业以及竞争对手的文章？


    ### 链接诱饵（Link Bait）挑战


    链接诱饵（Link bait）是一个术语，用于描述任何专门设计以吸引其他网站大量浏览和链接的内容。通常，用于链接诱饵的内容是选择具有广泛吸引力以覆盖尽可能广泛受众的内容。这样，发布内容的公司就有最大的机会获得尽可能链接和浏览。


    对许多人来说，链接诱饵已经赢得了坏名，并被认为是一种阴暗的在线营销形式。即使是“链接诱饵”这个词听起来也与垃圾信息有关，但实际上并非如此。在线上的每一个信息图都可以被视为链接诱饵，因为它们都在试图通过具有视觉吸引力的内容来吸引更多流量。你会在网上看到不同格式的链接诱饵，如震惊的八卦、意外的新闻、惊人的照片、有趣的视频、Top
    10 文章，当然还有信息图。链接诱饵的最佳主题是具有争议的话题或具有强烈情感诉求的话题。链接诱饵无好坏之，它取决于如何使用它。书中展示的所有酷信息图都是很好的链接诱饵设计。相比之下，如果一个引导读者进入恶意网站并在其计算机上加载恶意软件的信息图，无疑会被认为是糟糕的链接诱饵。


    问题源于与发布它的网站内容不相关的内容。当信息图的主题与发布它的网站不相关时，搜索引擎很难判断一个链接应该被视为对该公司的背书。


    作为信息图链接诱饵的示例，`James Bond` `50 Years of Movies`、`H&R Block` `图 3-5`（#c03.xhtml_figure3-5）是一个酷信息图的示例。


    ![c03f005.tif](img/c03f005.png)


    **图 3-5：** 作为链接诱饵的酷信息图示例


    [`www.bingiton.com`](http://www.bingiton.com)


    来源：微软 `Bing It On` 广告


    ![c03f006.tif](img/c03f006.png)


    **图 3-6：** Google 搜索发现了 284 个重新发布该图片的网站


    ### 关键在于相关性


    目前，搜索引擎还没有好方法来解决这个挑战。今天，链接诱饵信息图作为一种 SEO 策略是有效的，并且可以成功提高网站的整体评分。


    '
- fmt: '

    This is a problem that Google is actively trying to solve. In 2012, Matt Cutts,
    head of the Webspam team at Google, specifically mentioned this challenge with
    infographics during an interview with SEO expert Eric Enge²:


    This comment has a number of companies, SEO consultants, and infographic designers
    worried that Google may start discounting all infographic links across the board.
    Even beyond infographics, it’s a challenge for all types of link bait content
    (text articles, photos, videos, interactive pages, and so on) but infographics
    in particular have been used heavily for this type of SEO tactic.


    Now, a year after Matt Cutts’ comment, you haven’t seen this type of change yet,
    but Google makes major updates to its algorithms multiple times each year. They
    might figure out a method to differentiate unrelated link bait content and lower
    the impact of those links to the `PageRank` calculation.


    To protect against any form of link bait discounting in the future, companies
    and designers should focus on publishing relevant infographics. This can protect
    links to your site that are relevant to your business and should always be considered
    to be a valid endorsement of your site by the search engine algorithms.


    [Figure 3-7](#c03.xhtml_figure3-7), *Streamlining your digital life with the new
    iPad*, an infographic from NextWorth, is an example of relevance. Published shortly
    before the release of the iPad 3 in 2012, this design focused on many of the older
    electronic gadgets that the iPad’s functionality had replaced. NextWorth is in
    the business of buying back older consumer electronics gadgets from people and
    recycling them. The infographic design is fun, engaging, and relevant to the NextWorth
    business. A link to the infographic inherently should imply an endorsement of
    recycling old gadgets and supporting its business.


    ![c03f007.tif](image_fi/582305c03/c03f007.png)


    [**FIGURE 3-7:**](](#c03.xhtml_figureanchor3-7) The topic of replacing electronic
    gadgets is directly relevant to NextWorth’s business.


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-7`](#c03.xhtml_figureanchor3-7)


    *Source:* Streamlining your digital life with the new iPad*, NextWorth*


    To remain relevant and in the good graces of the search engine companies, you
    should avoid any actions or practices that could be considered “spammy.” Search
    engines continually work to improve their algorithms, and something that helped
    a web page score yesterday could actually hurt the score today as the algorithms
    are improved and the programmers devise ways to detect any questionable promotional
    efforts. Some algorithm updates have even punished websites that were seen as
    practicing unscrupulous methods of increasing their page value, by actively lowering
    their page scores.


    ## Online Lifespan


    Online lifespan is the amount of time that an infographic remains relevant to
    audiences. Topic and data selection here are crucial. When choosing the topic
    of an infographic, many companies fail to understand the importance of online
    lifespan.


    From a designer’s perspective, it generally takes the same amount of time and
    effort to fill an infographic design with current, trending information as it
    does to include information that can have long-term value to the readers. In a
    financial sense, it costs about the same to design an infographic that will only
    be popular for one week as it does to design an infographic that will be useful
    to readers for a year or more. The infographic design will be roughly the same
    size, with a similar amount of illustrations, text, and data visualizations.


    You need to consider the goal of the infographic project when choosing the topic
    and the range of data included. If the objective of the infographic project is
    to drive traffic and build links to the company website, you don’t want an infographic
    that will be outdated or forgotten a week after you publish it. If the objective
    is to increase brand awareness in a short amount of time, a hot, trending topic
    could be more successful.


    From an SEO perspective, the most recent views and links are often more heavily
    weighted. So even if you publish an infographic that goes viral, if it happened
    three years ago, it probably isn’t providing much of a positive effect on your
    search engine score ranking today.


    On May 1, 2011, the big news story of the day was the U.S. operation that killed
    Osama Bin Laden. There were a handful of infographic designs developed quickly
    that were published within 24 hours of the news breaking. [Figure 3-8](#c03.xhtml_figure3-8)
    shows one of these designs from Column Five Media that does a great job of clearly
    telling the story of events leading up to the operation and visually showing readers
    what was known about the operation in Bin Laden’s compound. A lot of effort went
    into creating the design in a short period of time, and the end result is a well-designed
    infographic. However, the topic was so tied to the hot trending news of the day
    that when the news cycle moved on to other stories, interest in the infographic
    went away as well. The online lifespan of this infographic was only about one
    week. After that, views and links diminished rapidly.


    ![c03f008.tif](image_fi/582305c03/c03f008.png)


    [**FIGURE 3-8:**](](#c03.xhtml_figureanchor3-8) Breaking news as an infographic
    topic: online lifespan = one week


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-8`](#c03.xhtml_figureanchor3-8)


    *Source:* Bringing Down Bin Laden*, Column Five Media*


    The *Death & Taxes 2014* poster in [Figure 3-9](#c03.xhtml_figure3-9) is a popular
    design that visualizes the President’s proposed budget and is redesigned and republished
    each year. It’s a huge undertaking for the designers, and the final design becomes
    obsolete a year later when a new budget cycle begins. Its online lifespan lasts
    for one year.


    ![c03f009.tif](image_fi/582305c03/c03f009.png)


    [**FIGURE 3-9:**](](#c03.xhtml_figureanchor3-9) Online lifespan lasts as long
    as the data is current: budget data = one year


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-9`](#c03.xhtml_figureanchor3-9)


    *Source:* Death & Taxes 2014*, Timeplots*


    Many designs can have significantly longer lifespans. *The History of Halloween*
    in [Figure 3-10](#c03.xhtml_figure3-10) from FrightCatalog.com is an unusual case.
    The infographic is a timeline of events that have led up to the modern day Halloween
    holiday, so even though its online lifespan will be many years, it’s mostly only
    relevant during the month of October. This actually works nicely for the publisher,
    an online retailer of Halloween, because it adds visitors and traffic to its busiest
    month…every year.


    ![c03f010.tif](image_fi/582305c03/c03f010.png)


    [**FIGURE 3-10:**](](#c03.xhtml_figureanchor3-10) Online lifespan = one month,
    every year


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-10`](#c03.xhtml_figureanchor3-10)


    *Source:* The Visual History of Halloween*, FrightCatalog.com*


    The online lifespan of the *Pairing of Wine & Food* infographic in [Figure 3-11](#c03.xhtml_figure3-11)
    also spans many years. Twenty years from now, the information will still be the
    same, and the design will still be relevant to readers. It’s not like suddenly
    dessert wine will go well with vegetables!


    ![c03f011.tif](image_fi/582305c03/c03f011.png)


    [**FIGURE 3-11:**](](#c03.xhtml_figureanchor3-11) For general information topics,
    online lifespan = many years


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-3-11`](#c03.xhtml_figureanchor3-11)


    *Source:* Pairing Wine & Food*, Wine Folly*


    Online lifespan can make a huge difference to the ongoing SEO value of any infographic
    and should be an integral part of the topic selection process.


    ## Infographic Release Strategy

