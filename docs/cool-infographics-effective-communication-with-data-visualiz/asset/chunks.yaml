    ### Many Eyes


    The Many Eyes project ([Figure 7-20](#c07.xhtml_figure7-20)) is an ongoing experiment
    created by the teams at IBM Research and the IBM Cognos software group. The site
    enables you to create some more advanced data visualizations such as tree maps,
    bubble charts, word clouds, world maps, and network diagrams. Members can publish
    their visualizations online, and allow other members of the community to leave
    comments and view the raw data. ([`www-958.ibm.com/software/analytics/manyeyes/`](http://www-958.ibm.com/software/analytics/manyeyes/))


    ![c07f020.png](image_fi/582305c07/c07f020.png)


    [FIGURE 7-20:](#c07.xhtml_figureanchor7-20) Many Eyes visualization listing


    ### The Noun Project


    The Noun Project ([Figure 7-21](#c07.xhtml_figure7-21)) is a fantastic resource
    to find icons related to the concepts you need to visualize in your infographic
    design. Most of the icons are free for use under a Creative Commons license as
    long as you give attribution to the designer in whatever design you include them
    in. Designers are always adding new icons to help build a broader visual language.


    ![c07f021.png](image_fi/582305c07/c07f021.png)


    [FIGURE 7-21:](#c07.xhtml_figureanchor7-21) The Noun Project


    The Noun Project is built on donations and designs contributed by designers. If
    you can, consider contributing to the project. ([`www.thenounproject.com)`](http://www.thenounproject.com))


    # Finding Data Online


    One of the big challenges for infographics designers is finding the data they
    need to visualize as part of their infographic story. If you aren’t using your
    own company data or research results, you will probably search online to find
    the data used to design your data visualizations.


    Search engines (Google and Bing) can certainly help, but finding the perfect data
    for your infographic is tough if you have to look through millions of search results.
    Of course, the type of data you’re looking for can help narrow down your search
    efforts.


    Following are a number of data repository sites that host thousands of data sets.
    The intent of these sites is to make these data sets available to the public,
    but make sure you understand their terms of service.


    ### Data.gov


    The official data website of the U.S. Government, Data.gov is a project about
    transparency and the Open Government Initiative of the White House. As of this
    writing, the site currently boasts a total of 392,435 combined raw data sets,
    tools, and geo-data sets ([`www.data.gov`](http://www.data.gov)).


    ### DataMarket


    DataMarket is a data repository site that enables users to view data visualizations
    of sets from around the world. Free access enables users to view and share the
    data, and Pro accounts ($59/month) enable access to premium tools to publish data
    and access to additional data sets, such as market research and financial market
    data. ([`www.datamarket.com`](http://www.datamarket.com))


    ### FactBrowser


    FactBrowser is self-described as a research discovery engine. It’s a search engine
    dedicated to indexing the statistics quoted in news articles and press releases
    from companies and organizations. You can browse by category, company, source,
    consumer type, and regions of the world. ([`www.factbrowser.com`](http://www.factbrowser.com))


    ### Google Public Data


    Google maintains a fantastic public directory with hundreds of data sets and metrics
    from many world governments and global organizations. Users can browse through
    the data sets and view the interactive data visualizations on the site. ([`www.google.com/publicdata/directory`](http://www.google.com/publicdata/directory))


    ### Internet World Stats


    Internet World Stats has some great data based on Internet usage worldwide, population
    stats, and even some market research data. The site is often referenced in infographics
    as an indicator of the size and scale of the Internet. ([`internetworldstats.com`](http://internetworldstats.com))


    ### Many Eyes


    In addition to the data visualizations you can create on Many Eyes mentioned earlier,
    Many Eyes also hosts a huge repository of public data sets. There were 367,835
    available data sets as of this writing, and members of the community add new sets
    all the time. The community also has the ability to comment on specific data sets
    to share thoughts or questions. ([`www-958.ibm.com/software/analytics/manyeyes/`](http://www-958.ibm.com/software/analytics/manyeyes/))


    ### Quantcast


    Quantcast measures, estimates, and forecasts site traffic for most sites on the
    web. For any designs that compare websites or site traffic, Quantcast is a great
    resource. Keep in mind that these are usually estimates and not actual data, but
    for comparison purposes, its numbers are usually in the ballpark. ([`www.quantcast.com`](http://www.quantcast.com))


    ### Wikipedia


    Of course many, many people use Wikipedia as a data source for infographics. There
    are lots of great HTML tables and individual statistics listed in the various
    entries. Always try to find the original source by Wikipedia (if available). ([`www.wikipedia.org`](http://www.wikipedia.org))


    ### Wolfram Alpha


    Wolfram Alpha probably has some statistics or data related to your topic. It might
    be stats about the location or about a particular country. ([`www.wolframalpha.com`](http://www.wolframalpha.com))


    # Online Infographics Design Sites


    A handful of new websites dedicated to designing infographics have launched recently.
    These sites enable you to input (or upload) your own data to create the charts
    and enable the user to choose from a collection of predesigned infographic templates.
    These sites are mainly intended for the nondigner audience that wants to create
    its infographics without learning the software applications previously mentioned.


    A handful of potential advantages for using these sites make them attractive:


    - **Speed**: By using the templates and the online charting tools, you can create
    a complete infographic in less than an hour.

    - **Hosting**: These sites host the final infographics online, so the user doesn’t
    need to create a separate infographic landing page.

    - **SEO optimization**: For users that don’t have the knowledge or skills to optimize
    the metadata on the infographic landing page, these sites can make the text in
    any infographic design available to the search engine crawlers to find your infographic.

    - **Design style**: These templates enable the nondigner users to break out of
    the PowerPoint-looking charts they would normally create. The design styles are
    fresh and new, which makes for a great looking infographic. Most of them also
    include data visualization styles not available in the MS Office suite.


    Of course, there are a few potential disadvantages to using these design sites
    as well:


    - **Templates**: Just like the presentation templates in PowerPoint, these templates
    will definitely be used by multiple people and may begin to look like stock designs.

    - **Chart**: Templates draw the user in with easy, predesigned charts, even if
    that chart isn’t the right way to visualize the data you have to work with.

    - **Dependency**: These are brand new companies and the websites may not be available
    12 months from now. If this is where you host your infographic, you’re dependent
    on the site to remain functional to keep your infographic live on the Internet.

