    \ Kelly，“扫描此书”，*New York Times,* 2006 年 5 月 14 日：[`http://www.nytimes.com/2006/05/14/magazine/14publishing.xhtml?pagewanted=all&_r=0](http://www.nytimes.com/2006/05/14/magazine/14publishing.xhtml?pagewanted=all&_r=0)。\n\
    \n8. Jeffrey Dean 和 Sanjay Ghemawat，“MapReduce：大型集群上的简化数据处理”，*Communications of\
    \ the ACM* 51, no. 1, (2008 年 1 月), 107–113. [`http://static.usenix.org/event/osdi04/tech/full_papers/dean/dean.pdf](http://static.usenix.org/event/osdi04/tech/full_papers/dean/dean.pdf)。\n\
    \n9. Cisco 视觉网络指数，2013：[`http://www.cisco.com/en/US/netsol/ns827/networking_solutions_sub_solution.xhtml](http://www.cisco.com/en/US/netsol/ns827/networking_solutions_sub_solution.xhtml)。\n\
