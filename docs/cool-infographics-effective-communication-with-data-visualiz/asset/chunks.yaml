  trans: "\n\n即使是简单的设计更改，也能让每个图表针对其特定数据并让观众更容易理解。在图 5-17 中，同一张图表主要使用 PowerPoint 提供的选项进行了重新设计。通过以下步骤可以完成主要更改：\n\
    \n![c05f017.tif](img/c05f017.png)\n\n图 5-17： 在 PowerPoint 中重新设计的图表\n\n1. 为柱状图上色以匹配数据的品牌形象。\n\
    2. 在柱状图内显示数据。\n3. 尽可能简化轴标签，通过在标题中添加年份，将其简化为月份缩写。\n4. 将 x 轴上月份缩写的文字颜色改为浅灰色，以帮助图表的颜色成为视觉焦点。\n\
    5. 移除轴线、刻度线和网线。对于这种简单的图表，这些元素是不必要的，会增加不必要的视觉噪音。\n6. 在柱状图顶部添加相应公司网站上的特定公司 Logo\
    \ 图片。这确立了颜色编码背后的含义，并消除了对图例的需求。\n\n这些更改显然并不适用于图表，因为你的数据是不同的，但其理念是让每个数据可视化对观众来说都是相关且有意义的。在这种情况下，我故意保留了柱状图可视化，而不是尝试不同的数据可视化方法，以此证明简单的变化如何让你的图表对观众更有意义。这就是让你的数据更容易被理解和记忆所采取做法。\n\
    \n### 单页信息图单页\n\n信息图在公司内部最好的用途之一是作为演示期间发放的手页。当使用打印的单页信息图单页作为演示的执行摘要时，其效果会好得多。与其给观众的每一个人发一个包含演示文稿所有幻灯片的厚纸包，不如给他们一份单页总结。\n\
    \n在线信息图的相同设计原则同样适用，因此单页上只应可视化最重要的信息。由于一页纸上包含了所有关键信息，没有任何信息会丢失。观众可以将单页放在办公桌上或挂在办公室的墙上，所有关键信息都可见。这能让信息和内容在他们脑海中保持新鲜，因为他们经常看到。\n\
    \n如果你分发一大堆演示的打印页，当员工回到办公桌时，信息很可能会丢失。如果他们把打印堆留在办公桌上，他们只能看到第一页，除非他们花精力翻阅页面，否则其余信息会被埋在堆叠中。更有可能是他们的桌上没有空间了，所以这叠幻灯片要么被归档在抽屉里，要么被扔掉——眼不见心。。单页可以使用标准的信纸尺寸打印，但许多单页使用的是许多业务级打印机和复印机支持更大的法律尺寸（8.5″\
    \ × 14″）或海报尺寸（11″ × 17″）纸张打印。\n\n图 5-18 是由 Joni Graves 设计的 2011 年威斯康星州日历，作为威斯康星大学交通信息中心\
    \ RODS（资源、外展和数据支持）的一部分，使用了全州数据。该日历打印在单页 11″ × 17″ 的纸上，威斯康星州交通局 BOTS 将该设计作为州内多次员工会议的手页，同时也用于每季度交通安全（TSC）会议。\n\
    \n![c05f018.tif](img/c05f018.png)\n\n图 5-18： 单页信息图单页让观众轻松看到你演示中的所有数据\n\n[`Coolinfographics.com/Figure-518`](http://Coolinfographics.com/Figure-518)\
    \ 图 518 2011 年威斯康星州日历，Joni Graves。手页在一页上展示了海量数据。通过在颜色编码的日历格式中可视化数据，它呈现数据的方式比纯数字让观众更容易理解。通过提供单页手页，设计允许观众看到模式并轻松地比较不同原因之间的频率数据。\n\
    \n### Prezi 演示文\n\n![p.tif](img/p.jpg)\n\n如果你将单页手页的想法推向下一个高度，可以将单页信息图转换为你的整个演示文稿。使用缩放用户界面（ZUI，发音为“zoo-ee”），[`prezi.com`](http://prezi.com)\
    \ 等演示工具使你能够将整个信息图作为演示展示，而不是将信息分成多个独立的幻灯片。\n\nPrezi 是一种比常见的 PowerPoint 或 Keynote\
    \ 演示的替代应用程序。Prezi 不使用一系列独立的个体幻灯片，而是使用一个大画布，用户可以在其中添加图像、图表、文本甚至视频。该软件允许演示者在画布上定义一条顺序贯的缩放、旋转和移动路径，以关注不同部分并创建演示的流。当演示文稿进行显示或投影时，软件会在路径中定义的每个步骤之间在画布上执行移动动画。\n\
    \n例如，图 5-19 是来自 McGraw-Hill 的一张大型信息图。该完整设计可以打印成单页手页分发给观众，也可以作为海报展示。Prezi 则可以作为演示程序，在演示期间将焦点移动到各个区域（图\
    \ 5-20）。\n\n![c05f019.tif](img/c05f019.png)\n\n图 5-19： 大尺寸信息图单页\n\n[`Coolinfographics.com/Figure-519`](http://Coolinfographics.com/Figure-519)\
    \ 图 519 来源：McGraw-Hill Higher Education\n\n![c05f020.tif](img/c05f020.png)\n\n\
    图 5-20： Prezi 缩放到信息图某一部分的框架\n\n观众可以使用手页作为参考轻松跟踪整个演示。观众中的每个人都有这份单页手页作为方便的后续文档，因此演示结束后他们可以获取信息。\n\
    \nPrezi 的在线版本供任何人免费使用，但额外的付费许可提供更多功能、更多的在线存储空间以及独立的桌面应用程序。桌面应用程序允许你将演示文稿保存在本地文件中而不是在线，如果存在安全考虑的话。此外，使用桌面应用程序可以避免在演示期间出现任何潜在的网络连接问题，因为整个演示文稿都存在你的电脑上。\n\
    \n## 总结\n\n无论你的公司经营什么业务，你都可以从信息可视化中受益。该业务可以是当地面包包店、在线零售商、政府部门、风险投资公司、私立学校或电影制作公司。每家公司都有需要向员工、投资者和客户清晰传递的信息。信息图和数据可视化实践可以让你的公司信息更吸引人更容易记忆。\n\
    \n## **链接**\n\n1. Bedford, TX 预算海报，Randy Krum, InfoNewt:\n\n    [`http://infonewt.com/portfolio/client-work/8781697`](http://infonewt.com/portfolio/client-work/8781697)\n\
    \n2. *BBC-o-Gram*, David McCandless, Information is Beautiful\n\n"
