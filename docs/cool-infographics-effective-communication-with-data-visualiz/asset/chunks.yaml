    使用动画 GIF 图像格式具有显著的额外优势。因为动画完全包含在图像文件中，所以当它发布在其他网站和博客时，动画可以正常运行。这与使用代码创建动态信息图的设计形成对比，后者要难分享得多。


    图 1-35 所示的《距离火星有多远？》是一个内置在网页中的动态信息图设计。该设计由 David Paliwoda 和 Jesse Williams 创建，它将地球与火星之间的距离视觉化，其比例使得地球在屏幕上的直径为
    100 像素。点击屏幕底部的箭头将开始页面滚动到月球轨道并最终到达火星的动画。星群的视觉运动以及火星出现在屏幕上所需的时间，让观众清晰地理解了行星之间真实的距离有多远。


    ![c01f035.tif](img/c01f035.png)


    FIGURE 1-35： 观众点击后动态信息图开始运行


    [`coolinfographics.com/Figure-1-35`](http://coolinfographics.com/Figure-1-35)


    *来源：David Paliwoda 和 Jesse Williams*


    ### 视频信息图


    视频信息图仍然相当新颖，但因为在 YouTube 和 Vimeo 等视频共享网站上易于使用，在在线上迅速发展。能够将这些网站的完整可播放视频嵌入到博客和社交媒体帖子中，使得视频信息图对营销人员的流量和价值大幅增加。


    我在 2007 年在 Cool Infographics 上发布的第一个关于视频信息图是 Royksopp 的歌曲“Remind Me”音乐视频（[`youtube.com/watch?v=eo4u4JJAPGk`](http://youtube.com/watch?v=eo4u4JJAPGk)）。这段视频讲述了一个住在伦敦的年轻女性的一天生活。视频中的数据可视化是关于围绕着她的现代生活的细节，例如在她刷牙时，展示了她公寓的管道系统是如何运作的。这段视频为随后的视频信息图设计树立了高标准（图
    1-36）。


    ![c01f036.tif](img/c01f036.png)


    FIGURE 1-36： Royksopp 的“Remind Me”视频信息图


    [`coolinfographics.com/Figure-1-36`](http://coolinfographics.com/Figure-1-36)


    其他视频信息图并不是用高端动画软件制作的。在线上许多流行的视频信息图都是使用现成的演示软件（如 Microsoft PowerPoint、Apple Keynote
    和 Prezi）制作的。通过使用动画幻片切换和仔细的时间控制步骤来自动化整个演示，演示文可以导出为视频文件进行传播。


    由 Karl Fisch、Scott McLeod 和 Jeff Brenman 制作的“你知道吗？Shift Happens”视频信息图（[`youtube.com/watch?v=ljbI-363A2Q`](http://youtube.com/watch?v=ljbI-363A2Q)）最初是
    2006 年 8 月在科罗拉多州森特尼尔市 Arapahoe 高中向教职员工进行的 PowerPoint 演示。初始视频经过重新混辑删除了学校特定的信息，并于
    2008 年上传到 YouTube。它迅速走红，到 2012 年底，那段信息图视频的观看量已超过 560 万次（图 1-37）。


    ![c01f037.tif](img/c01f037.png)


    FIGURE 1-37： “你知道吗？3.0”信息图视频


    [`coolinfographics.com/Figure-1-37`](http://coolinfographics.com/Figure-1-37)


    这些视频没有使用很多数据可视化（大部分数据仅以文本形式显示），但它很好地为观众提供了数字背景信息。最初的那段视频在随后的几年中产生了一系列更新，并已可能成为迄为止最成功的视频信息图活动。在过去的
    5 年里，在设计公司 XPLANE（[`xplane.com`](http://xplane.com)）的帮助下，它变成了一个视频，并开始使用更先进的动画软件工具。到
    2012 年底，整个视频系列的观看量超过了 3300 万次。[`shifthappens.wikispaces.com/`](http://shifthappens.wikispaces.com/)
    创建了一个围绕视频系列历史的完整 wiki 网站。


    ### 交互式信息图


    交互式信息图是让读者对显示的数据或可视化具有一定控制权的设计。它们之所以受欢迎，是因为它们比静态信息图更能吸引读者。一些网站是独立的数据可视化，另一些则构建在更大的信息图设计中。


    《纽约时报》网站已被许多认为是交互式信息图和数据可视化的世界领导者。图 1-35 显示了一张 2012 年选举地图。地图上的每个县根据最终结果显示为深浅不一的红色或蓝色。用户可以进入特定的州，查看数据并根据选择更改显示。


    ![c01f035.tif](img/c01f035.png)


    FIGURE 1-35： 《纽约时报》2012 年选举


    [`coolinfographics.com/Figure-1-35`](http://coolinfographics.com/Figure-1-35)


    有些公司为他人设计并提供数据可视化工具。Tableau 是该领域的领导者之一，并免费提供 Tableau Public 版本。该工具允许我们使用自己的数据创建可视化，并将可视化嵌入我们的网站中，以便在更大的信息图设计中包含交互式数据可视化。*Super
    PACs*（图 1-36）由 Visually 公司的 Jess Bach 设计，使用了 Tableau 可视化模块作为设计中的图表。结果是所有图表都是交互式的，读者可以通过点击调整任何图表以突出显示不同的信息。


    ![c01f036.tif](img/c01f036.png)


    FIGURE 1-36： *Super PACs*


    [`coolinfographics.com/Figure-1-36`](http://coolinfographics.com/Figure-1-36)


