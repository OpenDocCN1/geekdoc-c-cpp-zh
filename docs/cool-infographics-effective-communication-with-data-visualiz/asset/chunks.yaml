    Mino Parisi’s resume shown in [Figure 4-17](#c04.xhtml_figure4-17) is a great
    example of this. His infographic resume includes a timeline of his work and education
    history and a series of doughnut charts that show the relative amount of experience
    using different software applications (color-coded) in different types of design
    work. This standalone design is a snapshot look at many of Mino’s key attributes
    but is mostly graphics with minimal text. His full text resume (in Italian) is
    available separately and includes the full details of his history ([Figure 4-18](#c04.xhtml_figure4-18)).


    ![c04f017.tif](image_fi/582305c04/c04f017.png)


    [FIGURE 4-17:](#c04.xhtml_figureanchor4-17) Standalone infographic resume—Mino
    Parisi


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-17`](#c04.xhtml_figureanchor4-17)


    ![c04f018.tif](image_fi/582305c04/c04f018.png)


    [FIGURE 4-18:](#c04.xhtml_figureanchor4-18) Separate text resume—Mino Parisi


    Using an infographic resume in this manner essentially uses the infographic design
    as an advertisement to get attention or build awareness of the candidate. The
    infographic design would attract the attention of the employer or client, who
    can then look to the traditional resume for full details.


    In this format, the infographic resume is a supplement to the traditional resume.
    It’s not a replacement.


    As a variation to this format, the infographic resume design can be inserted as
    a separate page in a `Microsoft Word` document or `PDF` file that also includes
    the full-text resume pages. This allows the applicant to submit only one file
    in e-mail or online. When the potential employers view or print the resume, they
    have both the infographic resume and the full-text resume available as separate
    pages. Mino’s resume above is available online as a single `PDF` file for download
    that includes both the infographic and text resumes as separate pages.


    ### Combined Infographic Resume Design


    An effective alternative infographic resume format is for the designer to embed
    individual data visualizations directly into the text resume. The advantage of
    this design format is that the candidate has only one document that includes both
    the visual design and the full text. The visuals are adjacent to the full-text
    details in the design, so there’s little eye movement for a reader to find the
    detailed information about the candidate.


    Vanessa Wilson’s infographic resume ([Figure 4-19](#c04.xhtml_figure4-19)) demonstrates
    this beautifully. The full-text descriptions of each role are connected to the
    visual timeline running down the left side of the page. The overlap between education,
    work experience, and volunteer work is easily seen, and the complete text description
    of each is also readily accessible to the reader.


    ![c04f019.tif](image_fi/582305c04/c04f019.png)


    [FIGURE 4-19:](#c04.xhtml_figureanchor4-19) Combined infographic resume—Vanessa
    Wilson


    [`Coolinfographics.com/`](http://Coolinfographics.com)[`Figure-4-19`](#c04.xhtml_figureanchor4-19)


    This combined design format can be accomplished by inserting the data visualizations
    as images into a standard `Microsoft Word` document and wrapping the resume text
    around the visualizations. A more advanced method would be to use a desktop publishing
    application such as `Adobe InDesign` to integrate the visualizations with the
    text.


    Taking this idea one step further, if the data visualizations are charts designed
    in `Excel`, the charts can be linked to the data source so that any updates to
    the data automatically propagate into the resume design.


    With this design style, it’s important that all the information still exists in
    the text. We don’t want to replace information with the graphics. When submitted
    to job application systems, the automated text-parsing ignores the images but
    still has access to the full text. If a text-only file format is required, exporting
    the document to a `.txt` file from `Microsoft Word` can remove all the images
    automatically.


    The primary challenge of this format is keeping the resume short. If the goal
    is to maintain a one-page or two-page resume, the candidate needs to reduce the
    amount of text included to make room for the visualizations.


    ### Publishing Infographic Resumes Online


    The strategy for releasing an infographic resume online is similar to releasing
    an online marketing infographic. Candidates should establish the main landing
    page location for the resume and then link to that landing page whenever they
    share the infographic resume. In the case of the infographic resume, the landing
    page would normally be hosted on the candidate’s personal website, but the resume
    landing page could also be hosted on an image site such as `Flickr.com`, `Behance.com`,
    `Visual.ly`, or `Pinterest.com`.


    Wherever the infographic resume is hosted online, it is important to make viewing
    and sharing the file simple and easy. Different file format versions should be
    readily available to download for any potential employer or client. At least a
    `PDF` version should be available for download, but a `Microsoft Word` version
    is also recommended.


    The ability to share the infographic resume in social media easily can also be
    effective to get your resume in front of the right people. Sharing buttons from
    the major social media services should definitely be included on the landing page.
    Many people that are not potential employers may appreciate the design and want
    to share within their networks (like in this book). This would be a fantastic
    outcome for any infographic resume design because it gets more people looking
    at the resume and more chances that it will catch the attention of a potential
    employer or client. Recently, LinkedIn added an easy way to share an infographic
    resume on an individual’s profile. Users can now add images and links as a part
    of background summary that displays at the top of the profile page. By adding
    the URL of the resume landing page, `LinkedIn` can display a thumbnail of the
    infographic resume that links to the landing page when clicked.


    ### Designing Infographic Resumes for Print


    One area definitely worth mentioning is that hiring managers, recruiters, and
    HR managers are likely to print out your infographic resume on an office printer.
    It may be printed, photocopied, and faxed without your knowledge, so you need
    to design one with that in mind.


    First, assume it will be printed on standard-size paper. The tall format infographic
    style is not a good design choice for infographic resumes. In the United States,
    that means `8.5″ × 11″` letter-size paper. In other parts of the world, it may
    mean `297 × 210 mm` A4-size paper. Because the position may be in another country,
    the applicant should understand the standard local paper sizes in the locations
    where you may be applying for a job.


    Second, the designer won’t have any idea what kind of printer might be used to
    print out the resume. Laser or inkjet? Color or black and white? High or low resolution?
    A good designer will test printing the design on the lowest features to make sure
    it’s still legible. At home, the applicant can force his printer to print out
    the design at a lower quality level and only in black and white. Even though this
    may not be the primary design, it will still work when its use is out of our control.

