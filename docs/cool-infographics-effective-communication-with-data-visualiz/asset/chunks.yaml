    \nCompetition for your audience’s attention is fierce. The fact that infographics\
    \ are unique allows organizations an opportunity to make the content they are\
    \ publishing stand out and get noticed.\n\n—MARK SMICIKLAS, *THE POWER OF INFOGRAPHICS*\n\
    \n# 2\n\nOnline Infographics\n\nInfographics published and shared online are the\
    \ driving force behind the explosion in the public awareness of infographics.\
    \ The term *infographics* was mostly confined to newspaper designers and was a\
    \ behind-the-scenes term used in the print production process of art departments.\
    \ As mentioned in Chapter 1, these more recent online infographics are quickly\
    \ turning even the term infographic into a household word.\n\nOf course, infographics\
    \ aren’t actually new. There are many historical examples of infographics and\
    \ data visualization designs from the last 200 years. Traditionally, infographics\
    \ have been defined as anything that qualified as “information graphics,” or any\
    \ visual representation of data or information. Charts, graphs, data visualizations,\
    \ maps, diagrams, and tables were all considered infographics."
