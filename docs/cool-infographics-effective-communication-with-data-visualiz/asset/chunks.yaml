    [Figure 2-13](#c02.xhtml_figure2-13) is a visual explanation of `How Affiliate
    Marketing Works` from Sugarrae.com. There is no numerical data in the design.
    The design visualizes the process by using three color-coded characters on a path
    to show the sequence of events that occur. This could have been a simple 10-item
    text bullet list in a blog post, but turning the process into an infographic design,
    made it incredibly popular. The infographic went viral online and further established
    Rae Hoffman as one of the top authorities in the country on Affiliate Marketing.


    ![c02f013.tif](image_fi/582305c02/c02f013.png)


    [FIGURE 2-13:](#c02.xhtml_figureanchor2-13) A 10-step process designed as a visual
    explanation infographic


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-13`](#c02.xhtml_figureanchor2-13)


    Source: `How Affiliate Marketing Works`, Rae Hoffman, Sugarrae.com


    ### Infographic Advertisements


    Infographic advertisements are a specific form of persuasive infographics, in
    that they obviously attempt to motivate the audience to take action. In this case,
    the call to action is usually intended to convince readers to purchase specific
    products or services.


    In general terms, readers are less likely to share an infographic advertisement
    than a purely informative one. This is true for any form of content, not just
    infographics. People are less likely to share obvious advertisements with friends
    because it can feel like a sales pitch instead of forwarding something valuable.


    However, data visualizations and infographics are a fantastic way for companies
    to show customers their product benefits. The goals of these designs are different.


    The goal of an infographic advertisement is to educate the potential customers
    about the product instead of building links and traffic to the web page. They
    can be used to effectively share the often-complex information about a product.


    *   Comparing competitive products

    *   Assembly or usage directions

    *   Product benefits

    *   Product specifications

    *   Consulting or service processes


    [Figure 2-14](#c02.xhtml_figure2-14) is `How to Pair Wine with the Bright, Bold
    Flavors of Southeast Asia`, an infographic advertisement from the P.F. Chang’s
    restaurant chain. This is an advertisement for its new promotional menu items.
    The design visually ties unique cooking ingredients with the new dishes and presents
    wine pairing suggestions. The call to action is for the reader to go to a P.F.
    Chang’s restaurant location and try the new menu items.


    ![c02f014.tif](image_fi/582305c02/c02f014.png)


    [FIGURE 2-14:](#c02.xhtml_figureanchor2-14) P.F. Chang’s new menu items infographic
    advertisement


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-14`](#c02.xhtml_figureanchor2-14)


    Source: `How to Pair Wine with the Bright, Bold Flavors of Southeast Asia`, P.F.
    Chang’s China Bistro, Inc.


    The company is obviously trying to sell their food, and that’s perfectly acceptable.
    My impression is that the design is meant to appeal specifically to repeat restaurant
    guests by giving them a reason to come back to try something new.


    This infographic advertisement is one content piece of a larger marketing campaign
    that includes a dedicated web page, print advertisements, an interactive PDF available
    for download, online videos, and the infographic.


    Every product and service has a complex story to tell customers why the company
    made specific design decisions that shaped a product idea into an actual product
    on the store shelf. People work hard on these projects at companies and become
    passionate about them. They are often disappointed when the customers they expected
    to buy these products or services aren’t as excited and passionate as they were.


    The main difference is that the company’s employees get to see all the stories
    behind the product. Consumers see only what’s on the product packaging or in the
    advertisements, and they often don’t take the time to completely read either of
    them. A company’s opportunity to catch a consumer’s interest long enough to tell
    their stories is rare.


    The use of infographics to tell the product’s message can be a convincing form
    of advertisement. There are many specific reasons a company’s products have been
    designed to its unique specifications, including:


    *   Unmet consumer needs

    *   Differentiation from competitors

    *   Unique benefits

    *   Lower price points

    *   Color selection

    *   Design style or fashion trends

    *   Ergonomic design

    *   Ease of use

    *   Environmental impact


    `The Picture Superiority Effect` (refer to Chapter 1) can be used to make visual
    information 650 percent more likely to be remembered by the audience, and this
    is a major reason that companies have logos. A potential customer is more likely
    to remember a visual logo than the name of the company alone, and that memory
    carries over into purchasing behavior in stores. Customers tend to buy products
    from brands they recognize.


    Infographics provide an opportunity for companies to tell the unique stories about
    their products and services in a compelling way that makes the complex stories
    easy for consumers to understand, share, and remember. By making the stories about
    their products visual, companies can increase the amount of information potential
    customers will remember when they stand in a store making a purchase decision.


    `Making an Organic Choice` from SoNice in Canada ([Figure 2-15](#c02.xhtml_figure2-15))
    is an infographic advertisement that compares its organic processes making soy
    milk products to conventional food-processing methods. The company is passionate
    about organic foods, and an infographic design gives it the chance to show the
    data side by side with data about conventional.


    ![c02f015.tif](image_fi/582305c02/c02f015.png)


    [FIGURE 2-15:](#c02.xhtml_figureanchor2-15) Side-by-side comparison as an infographic


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-14`](#c02.xhtml_figureanchor2-14)


    Source: `Making an Organic Choice`, SoNice, Earth’s Own Company Inc.


    ### PR Infographics


    Similar to advertisements, companies also use infographic designs for public relations
    (PR) with press releases. The objectives of PR are different than advertisements.
    Instead of directly trying to sell a product, a PR strategy may use an infographic
    to build awareness of products and brands, to provide information to shareholders,
    or to increase the value of the brand. Infographics used for PR can be published
    as a supplement to a text-only press release, or the entire press release can
    be contained in the infographic design.


    Many companies consider coverage by the news media as a more affordable and credible
    form of advertising than traditional advertising. Many people are more likely
    to pay attention and believe information from a news report than an advertisement,
    even though the information may be coming from the same source: the company’s
    PR department.


    When Honda announced the 2013 Accord, the design was a major design change to
    the car, inside and out. As a part of its PR content strategy, it released the
    infographic design, `Accord: 30 Years of American Craftsmanship` ([Figure 2-16](#c02.xhtml_figure2-16)).
    Honda’s primary target audience were members of the press. This one design was
    used as content in a handful of different ways:


    ![c02f016.tif](image_fi/582305c02/c02f016.png)


    [FIGURE 2-16:](#c02.xhtml_figureanchor2-16) Infographics can be used as part of
    a Public Relations campaign


    [`coolinfographics.com/`](http://coolinfographics.com)[`Figure-2-14`](#c02.xhtml_figureanchor2-14)


    Source: `Accord: 30 Years of American Craftsmanship`, Honda North America


    *   The infographic was printed and displayed on 7-foot banners at press events
    all across the country.

