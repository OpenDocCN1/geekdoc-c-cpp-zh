    when printed.


    Second, the designer won’t have any idea what kind of printer might be used to
    print out the resume. Laser or inkjet? Color or black and white? High or low resolution?
    A good designer will test printing the design on the lowest features to make sure
    it’s still legible and understandable. At home, the applicant can force his printer
    to print out the design at a lower quality level and only in black and white.
    Even though this may not be the primary design, it will still work when its use
    is out of our control.'
