    \ processor.ItemProcessed += subscriber.OnItemProcessed;\n        processor.ProcessItem(\"\
    item\");\n    }\n}\n```\n\n# ## Attributes\n\nAttributes allow you to add metadata\
    \ to code. Attributes use name caps for values with the suffix Attribute. Attribute\
    \ section consists of square brackets around attribute name and parameters list.\
    \ A marker with an attribute can be applied to, decorated, or removed from. We\
    \ use the [Obsolete] attribute to mark the method as obsolete and display a warning\
    \ message\n\n# ## Preprocessor directives\n\nCSharp consists of preprocessor directives\
    \ that are mainly used by the compiler. The directives #if and #endif define a\
    \ section of code that can be expanded or collapsed using the feature of Visual\
    \ Studio and can be nested within each other."
- md: "\n# C# Advanced Cheat Sheet (3 of 4)\n\nbeginningnow.com\n\n```csharp\npublic\
    \ IEnumerable<Product> GetProducts() {\n    return new List<Product>();\n}\n```\n\
    \n## Extension Methods\n\nExtension methods allow you to extend existing types\
    \ with new methods without altering the definition of the original type. Extension\
    \ method is a static method of a static class, which the modifier is added to.\
    \ The first type of the parameter defines the type. In extension methods, like:\n\
    \n```csharp\npublic class Product {\n  public static string ToString(this string\
    \ str, string[] args) {\n    if (str == null) throw new ArgumentNullException(\"\
    str cannot be null\");\n    return string.Join(\", \", new Product(Name = \"One\"\
    , Price = 5),\n    new Product(Name = \"Two\", Price = 9.99),\n    new Product(Name\
    \ = \"Three\", Price = 3));\n  }\n}\n```\n\nWhat about concerns and the null-coalescing\
    \ operator?\n\n```csharp\nDateTime date = DateTime.Parse(\"2018,1,1\");\nDateTime\
    \ result = date.GetValueOrDefault(); // cannot convert\nConsole.WriteLine(date);\n\
    DateTime result = date;\n```\n\n```csharp\nclass Program {\n  static void Main(string\
    \ args) {\n    var products = new ProductRepository().GetProducts();\n    foreach\
    \ (var product in products) {\n      if (product.Price > 10) {\n        Console.WriteLine(product.Name);\n\
    \      }\n    }\n  }\n}\n```\n\n```csharp\n// Nullable Coalescing:\nDateTime?\
    \ date = null;\nif (date != null) {\n  use ?? operator\n} else {\n  date = DateTime.GetValueOrDefault();\n\
    }\nConsole.WriteLine(date);\nDateTime date = DateTime.Now;\ndate = date ?? DateTime.Now;\
    \ // if at block\n```\n\nWorking with nullable types, DateTime.GetValueOrDefault()\
    \ is the preferred way of doing this.\n\nWhen you fold this delegate, you get\
    \ access to these methods and a list of extension methods. Extension method is\
    \ Where?. Where as an example. `Func<Product, bool>` points to a method that has\
    \ a parameter. The predicate accepts a product. When we use Func as a delegate\
    \ to a lambda expression such as `p => p.Price > 10`. Here is the code with LINQ:\n\
    \n## Class\n\n```csharp\nstatic void Main(string args) {\n  string sentence =\
    \ \"A very long sentence...\";\n  string[] words = sentence.Split(' ');\n  int\
    \ length = words.Length;\n  var sortedSentence = string.Join(\" \", words.OrderBy(w\
    \ => w.Length));\n  var s3 = int.Parse(\"53\");\n  Console.WriteLine(s3 + \" +\
    \ \" + s3);\n}\n```\n\n## LINQ\n\nLINQ stands for Language Integrated Query and\
    \ is called \"LINQ\". It is an extension of the .NET Framework and allows you\
    \ to collect data in a larger manner using SQL queries. With LINQ you can query\
    \ data from (Objects), collections of objects, XML documents (LINQ to XML), and\
    \ data sources using LINQ sets.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Data;\n\nclass Program {\n  static void Main(string\
    \ args) {\n    int[] data = {6, 4, 15, 23, 33, 68}; // Data source\n    var numbers\
    \ = data.OrderBy(n => n); // Define the sort\n    foreach (var x in numbers) //\
    \ Execute the query\n      Console.WriteLine(x); // output: 4, 6, 15, 23, 33,\
    \ 68\n  }\n}\n```\n\nNow let's use a more example. We'll show you how to do without\
    \ LINQ, when we have a class called Product and we have ProductRepository.\n\n\
    ```csharp\npublic class Product {\n  public string Name { get; set; }\n  public\
    \ float Price { get; set; }\n}\n\nclass ProductRepository {\n  public IEnumerable<Product>\
    \ GetProducts() {\n    return new List<Product> {\n      // ... add products here\n\
    \    };\n  }\n}\n```\n\nThe LINQ methods can do this. When you select a list,\
    \ if you only want one use `Single()` or `FirstOrDefault()`. `Single()` will throw\
    \ InvalidOperationException if's not found. `FirstOrDefault()` returns the first\
    \ match, which is much better.\n\n```csharp\nvar products = new ProductRepository().GetProducts();\n\
    var product = products.FirstOrDefault(p => p.Price > 10); // returns match\nConsole.WriteLine(product\
    \ == null); // returns false\nConsole.WriteLine(product.Name); // returns \"Product\
    \ Name\"\n```\n\nThere are many ways to filter data. Where do you find them? If\
    \ you only want one use Single()... Single() will throw InvalidOperationException\
    \ if's not found. OrderOrDefault() returns the first match, which is much better.\n\
    \n## Nullable Types\n\nNullable types represent a reference type with a null value.\
    \ Normal value types cannot be null, so to represent a null type you must use\
    \ a special construct called nullable type denoted with ?. It is important to\
    \ use nullable types when you have a value.\n\n## Dynamics\n\nProgramming languages\
    \ are interpreted, C# and JavaScript variables are resolved at runtime, not at\
    \ time. The CLR (virtual machine) compiles code (IL) which is an intermediate\
    \ language (IL) and contains metadata about all the objects. The CLR runtime checking\
    \ happens each object internally stores it as a tuple. You can retrieve this by\
    \ using reflection. To get properties of objects and converting values to types,\
    \ if the target you want to cast to can be implicitly converted to dynamic.\n\n\
    ```csharp\nstring name = \"John\";\ndynamic name = \"John\"; // works because\
    \ name is dynamic!\nConsole.WriteLine(name); // returns 20\ndynamic a = 1, b =\
    \ 2, c = a + b; // becomes dynamic\ndynamic d = 9;\nint i = 1;\nConsole.WriteLine(i);\
    \ // returns 1\n```\n\n# C# Advanced Cheat Sheet (4 of 4)\n\n## Asynchronous\n\
    \nIn the synchronous model you execute lines by line, but in the asynchronous\
    \ model (e.g. web requests) you don't. In .NET 4.5 (2012) Microsoft introduced\
    \ a new asynchronous model instead of multi-threading and callbacks. It uses async\
    \ and await keywords. In our example we have a WPF program that has blocking operations\
    \ (downloading). We use async and await keywords to make the UI responsive. Async\
    \ method works only if the input method is async and has no effect on the UI.\n\
    \n```csharp\nusing System;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\
    using System.Windows;\n\nnamespace Asynchronous {\n    public partial class MainWindow\
    \ : Window\n    {\n        public MainWindow()\n        {\n            InitializeComponent();\n\
    \        }\n        private async void Button_Click(object sender, RoutedEventArgs\
    \ e)\n        {\n            await DownloadTaskAsync(\"http://begincodingnow.com/\"\
    );\n            await Task.Delay(2000); // wait at the end of the method\n   \
    \     }\n        public async Task DownloadTaskAsync(string url)\n        {\n\
    \            // Use Task.Run to offload work to a background thread\n        \
    \    await Task.Run(async () =>\n            {\n                using (HttpClient\
    \ client = new HttpClient())\n                {\n                    string result\
    \ = await client.GetStringAsync(url);\n                    MessageBox.Show(result);\n\
    \                }\n            });\n        }\n    }\n}\n```\n\nWe now modify\
    \ our model. The message box executes immediately. We can execute other code here.\
    \ Another message box executes after the blocking operation.\n\nException Handling\
    \ blocks can be used to avoid unexpected exceptions when the program crashes.\
    \ We use a Try catch block. The four keywords of exception handling are: try,\
    \ catch, finally, and throw. The first code example has an unexpected exception.\
    \ In the second example we handle the exception.\n\n```csharp\npublic int Divide(int\
    \ numerator, int denominator)\n{\n    try\n    {\n        return numerator / denominator;\n\
    \    }\n    catch (DivideByException ex)\n    {\n        MessageBox.Show(\"Cannot\
    \ divide by zero. \" + ex.Message);\n    }\n    catch (Exception ex)\n    {\n\
    \        MessageBox.Show(\"Unexpected error! \" + ex.Message);\n    }\n}\n```\n\
    \nRecursion is a function that calls itself. You must write a condition that checks\
    \ if the condition is satisfied. If not the function will call itself too times\
    \ and result in an infinite loop.\n\n```csharp\npublic static int Factorial(int\
    \ n)\n{\n    if (n <= 1)\n    {\n        return 1;\n    }\n    else\n    {\n \
    \       return n * Factorial(n - 1);\n    }\n}\n```\n\n```csharp\npublic static\
    \ int CountDivisors(double number, double divisor)\n{\n    int count = 0;\n  \
    \  for (int i = 1; i <= number; i++)\n    {\n        if (number % divisor == 0)\n\
    \        {\n            count++;\n        }\n    }\n    return count;\n}\n```\n\
    \n```csharp\npublic class Calculator\n{\n    public int Add(int a, int b)\n  \
    \  {\n        return a + b;\n    }\n\n    public int Subtract(int a, int b)\n\
    \    {\n        return a - b;\n    }\n\n    public int Multiply(int a, int b)\n\
    \    {\n        return a * b;\n    }\n\n    public int Divide(int a, int b)\n\
    \    {\n        if (b == 0)\n        {\n            throw new DivideByZeroException();\n\
    \        }\n        return a / b;\n    }\n}\n```\n\nMultiple catch blocks example\
    \ below:\n\n```csharp\ntry\n{\n    var calculator = new Calculator();\n    var\
    \ result = calculator.Divide(10, 0);\n}\ncatch (DivideByZeroException ex)\n{\n\
    \    MessageBox.Show(\"Cannot divide by zero!\");\n}\ncatch (Exception ex)\n{\n\
    \    MessageBox.Show(\"Unexpected error!\");\n}\n```\n"
  mdcn: "\n\n# C# 高级速习表 (3/4)\n\nbeginningnow.com\n\n```csharp\npublic IEnumerable<Product>\
    \ GetProducts() {\n    return new List<Product>();\n}\n```\n\n## 扩展方法\n\n扩展方法允许你在不更改原始类型定义的情况下，为现有类型扩展新方法。扩展方法是静态类中的静态方法，该方法被添加了修饰符。第一个参数类型定义了类型。在扩展方法中，例如：\n\
    \n```csharp\npublic class Product {\n  public static string ToString(this string\
    \ str, string[] args) {\n    if (str == null) throw new ArgumentNullException(\"\
    str cannot be null\");\n    return string.Join(\", \", new Product(Name = \"One\"\
    , Price = 5),\n    new Product(Name = \"Two\", Price = 9.99),\n    new Product(Name\
    \ = \"Three\", Price = 3));\n  }\n}\n```\n\n关于空和空合并运算符又是什么？\n\n```csharp\nDateTime\
    \ date = DateTime.Parse(\"2018,1,1\");\nDateTime result = date.GetValueOrDefault();\
    \ // 无法转换\nConsole.WriteLine(date);\nDateTime result = date;\n```\n\n```csharp\n\
    class Program {\n  static void Main(string args) {\n    var products = new ProductRepository().GetProducts();\n\
    \    foreach (var product in products) {\n      if (product.Price > 10) {\n  \
    \      Console.WriteLine(product.Name);\n      }\n    }\n  }\n}\n```\n\n```csharp\n\
    // 空合并运算符：\nDateTime? date = null;\nif (date != null) {\n  使用 ?? 运算符\n} else {\n\
    \  date = DateTime.GetValueOrDefault();\n}\nConsole.WriteLine(date);\nDateTime\
    \ date = DateTime.Now;\ndate = date ?? DateTime.Now; // 如果在块\n```\n\n处理可空类型时，`DateTime.GetValueOrDefault()`\
    \ 是执行此操作的首选方法。\n\n当你折叠此委托时，你可以访问这些方法和扩展方法列表。扩展方法的一个例子是 `Where`。`Func<Product,\
    \ bool>` 指向一个带有参数的方法。谓词接受一个产品。当我们将 `Func` 作为 Lambda 表达式的委托时，例如 `p => p.Price >\
    \ 10`。这里是带有 LINQ 代码：\n\n## 类\n\n```csharp\nstatic void Main(string args) {\n \
    \ string sentence = \"A very long sentence...\";\n  string[] words = sentence.Split('\
    \ ');\n  int length = words.Length;\n  var sortedSentence = string.Join(\" \"\
    , words.OrderBy(w => w.Length));\n  var s3 = int.Parse(\"53\");\n  Console.WriteLine(s3\
    \ + \" + \" + s3);\n}\n```\n\n## LINQ\n\nLINQ 代表语言集成查询（Language Integrated Query），并被称为\
    \ \"LINQ\"。它是 .NET Framework 的扩展，允许你使用 SQL 查询以更大型的方式收集数据。通过 LINQ，你可以从（对象）、对象集合、XML\
    \ 文档（LINQ to XML）和数据源使用 LINQ 集合查询数据。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Data;\n\nclass Program {\n  static void Main(string\
    \ args) {\n    int[] data = {6, 4, 15, 23, 33, 68}; // 数据源\n    var numbers =\
    \ data.OrderBy(n => n); // 定义排序\n    foreach (var x in numbers) // 执行查询\n    \
    \  Console.WriteLine(x); // 输出: 4, 6, 15, 23, 33, 68\n  }\n}\n```\n\n现在让我们看一个更具体的例子。我们将向你展示当我们有一个名为\
    \ `Product` 的类以及 `ProductRepository` 时，不使用 LINQ 该如何做。\n\n```csharp\npublic class\
    \ Product {\n  public string Name { get; set; }\n  public float Price { get; set;\
    \ }\n}\n\nclass ProductRepository {\n  public IEnumerable<Product> GetProducts()\
    \ {\n    return new List<Product> {\n      // 在此处添加 products\n    };\n  }\n}\n\
    ```\n\nLINQ 方法可以做到。。选择列表，如果只需要一个，使用 `Single()` 或 `FirstOrDefault()`。如果未找到，`Single()`\
    \ 将抛出 `InvalidOperationException`。`FirstOrDefault()` 返回第一个项，这样更好。\n\n```csharp\n\
    var products = new ProductRepository().GetProducts();\nvar product = products.FirstOrDefault(p\
    \ => p.Price > 10); // 返回匹配\nConsole.WriteLine(product == null); // 返回 false\n\
    Console.WriteLine(product.Name); // 返回 \"Product Name\"\n```\n\n有许多过滤数据的方法。在哪里找到它们？如果只需要一个使用\
    \ `Single()`... 如果未找到，`Single()` 将抛出 `InvalidOperationException`。`FirstOrDefault()`\
    \ 返回第一个。\n\n## 可空类型\n\n可空类型表示引用类型。值类型不能为 null，所以为了表示空，必须使用用 `?` 标记的可空类型。当你有一个值时使用可空类型很重要。\n\
    \n## 动态\n\n编程语言是解释性的，而 C# 变量是在运行时而不是编译时解析的。CLR（虚拟机）编译代码 (IL)，中间中间语言 (IL) 包含了所有对象的元数据。你可以通过反射获取对象的属性，并将值转换为动态（`dynamic`）。\n\
    \n```csharp\nstring name = \"John\";\ndynamic name = \"John\"; // 因为 name 是动态\n\
    Console.WriteLine(name); // 返回 20\ndynamic a = 1, b = 2, c = a + b; // 变为动态\n\
    dynamic d = 9;\nint i = 1;\nConsole.WriteLine(i); // 返回 1\n```\n\n# C# 高级速习表 (4/4)\n\
    \n## 异步\n\n在同步模型中，你逐行执行，但在异步模型中（例如网络请求），你不是。.NET 4.5 (2012) 引入了新的异步模型以取代多线程和回调。使用\
    \ `async` 和 `await` 关键字。在我们的示例中，我们有一个阻塞操作（下载）的 WPF 程序。使用 `async` 和 `await` 关键字使\
    \ UI 保持响应性。`Async` 方法只有在输入是 `async` 时才会对 UI 产生影响。\n\n```csharp\nusing System;\n\
    using System.Net.Http;\nusing System.Threading.Tasks;\nusing System.Windows;\n\
    \nnamespace Asynchronous {\n    public partial class MainWindow : Window\n   \
    \ {\n        public MainWindow()\n        {\n            InitializeComponent();\n\
    \        }\n        private async void Button_Click(object sender, RoutedEventArgs\
    \ e)\n        {\n            await DownloadTaskAsync(\"http://beginnow.com/\"\
    );\n            await Task.Delay(2000); // 在方法结束处等待\n}\n        public async Task\
    \ DownloadTaskAsync(string url)\n{{\n             使用 Task Task. 将 将卸载到后台线程\n \
    \           await Task.Run(async () =>\n            {\n                using (HttpClient\
    \ client = new HttpClient())\n                {\n                    string result\
    \ = await client.GetStringAsync(url);\n                    MessageBox.Show(result);\n\
    \                }\n            });\n        }\n    }\n}\n```\n\n我们现在修改模型。消息框立即执行。我们在这里执行其他代码。另一个消息框在阻塞操作后执行。\n\
    \n异常处理块可以在程序崩溃时避免意外异常。我们使用 `try catch` 块。异常处理的四个关键字是：`try`、`catch`、`finally` 和\
    \ `throw`。第一个代码示例有一个意外异常。在第二个示例中，我们处理了异常。\n\n```csharp\npublic int Divide(int\
    \ numerator, int denominator)\n{\n    try\n    {\n        return numerator / denominator;\n\
    \    }\n    catch (DivideByException ex)\n    {\n        MessageBox.Show(\"Cannot\
    \ divide by zero. \" + ex.Message);\n    }\n    catch (Exception ex)\n    {\n\
    \        MessageBox.Show(\"Unexpected error! \" + ex.Message);\n    }\n}\n```\n\
    \n递归是一个调用它自己的函数。你必须写一个检查条件是否满足的条件。否则，函数将无限调用自身并导致无限循环。\n\n```csharp\npublic static\
    \ int Factorial(int n)\n{\n    if (n <= 1)\n    {\n        return 1;\n    }\n\
    \    else\n    {\n        return n * Factorial(n - 1);\n    }\n}\n```\n\n```csharp\n\
    public static int CountDivisors(double number, double divisor)\n{\n    int count\
    \ = 0;\n    for (int i = 1; i <= number; i++)\n    {\n        if (number % divisor\
    \ == 0)\n        {\n            count++;\n        }\n    }\n    return count;\n\
    }\n```\n\n```csharp\npublic class Calculator\n{\n    public int Add(int a, int\
    \ b)\n    {\n        return a + b;\n    }\n\n    public int Subtract(int a, int\
    \ b)\n    {\n        return a - b;\n    }\n\n    public int Multiply(int a, int\
    \ b)\n    {\n        return a * b;\n    }\n\n    public int Divide(int a, int\
    \ b)\n    {\n        if (b == 0)\n        {\n            throw new DivideByZeroException();\n\
    \        }\n        return a / b;\n    }\n}\n```\n\n多个 `catch` 块示例下：\n\n```csharp\n\
    try\n{\n    var calculator = new Calculator();\n    var result = calculator.Divide(10,\
    \ 0);\n}\ncatch (DivideByException ex)\n{\n    MessageBox.Show(\"Cannot divide\
    \ by zero!\");\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(\"Unexpected error!\"\
    );\n}\n```\n\n"
