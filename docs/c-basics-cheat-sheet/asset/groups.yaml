    \ Path.\n\n# NuGet Package Manager\n\nNuGet is for .NET. The NuGet client manager\
    \ provides access to a central repository of packages to consume them. NuGet packages\
    \ are installed into your Visual Studio project using the NuGet Package Manager\
    \ or the Package Console. One interesting feature is the NuGet Package Manager\
    \ which allows you to package your own code, but here are some of the\n\n# Your\
    \ Own Library\n\nTo create a class library using Visual Studio 2017, create a\
    \ new Project -> Class Library C# - Net Standard (.NET Standard) and give it a\
    \ name and location OK. To use it, go to Build -> Build Solution to create the\
    \ DLL. The DLL name will be what you will need to give your project a reference\
    \ to it by giving it the name and location OK. Select Solution Explorer -> Right-click\
    \ References -> Add Reference -> Browse to find the DLL. For reference you can\
    \ now add a using statement at the top of your program. You should now have access\
    \ to your library code:\n\n# Loop\n\n| Syntax | Example |\n| :--- | :--- |\n|\
    \ while (condition) | `while (condition) { ... }` |\n| for (condition) | `for\
    \ (condition) { ... }` |\n| foreach (item in collection) | `foreach (item in collection)\
    \ { ... }`\n\n```\nint i = 0;\nwhile (i < 4) {\n   Console.WriteLine(i);\n   i++;\n\
    }\nfor (int i = 0; i < 4; i++) {\n   Console.WriteLine(i);\n}\nforeach (var item\
    \ in numbers) {\n   Console.WriteLine(item);\n}\n```\n\n# Directory\n\n| Syntax\
    \ | Example |\n| :--- | :--- |\n| do { ... } | `do { ... } while (condition);`\
    \ |\n| while (condition) | `while (condition) { ... }`\n\n```\nint i = 0;\ndo\
    \ {\n   Console.WriteLine(i);\n   i++;\n} while (i < 4);\n```\n\nUse do loop when\
    \ you need to execute the code at least once and then check if the condition is\
    \ still true. The for-while loop checks the condition before executing the code,\
    \ so you won't need to create an instance of it if the condition is not met.\n\
    \nUse for loop when you know how many times you want to run the code. Use foreach\
    \ loop when you want to iterate over a collection. These are available in ANSI,\
    \ Unicode, Binary, BigEndian, UTF8, UTF-7, UTF-32 and by default, but Windows\
    \ and OS on .NET Core applications.\n\n| Syntax | Example |\n| :--- | :--- |\n\
    | for (initialization; condition; iteration) | `for (int i = 0; i < 4; i++)` |\n\
    | foreach (item in collection) | `foreach (var item in collection)`\n\n```\nint\
    \ i = 0;\nfor (int i = 0; i < 4; i++) {\n   Console.WriteLine(i);\n}\nforeach\
    \ (var item in numbers) {\n   Console.WriteLine(item);\n}\n```\n\n```\nclass Program\
    \ {\n    static void void Main(string[] args) {\n        Directory.CreateDirectory(@\"\
    D:\\folder\");\n        File.WriteAllText(@\"D:\\myfile.txt\", \"Hello world!\"\
    );\n    }\n}\n```"
- md: "\n# C# Cheat Sheet (1)\n\n## Abstract Classes\n\n### Object-Oriented Programming\
    \ (OOP)\nObject-Oriented Programming (OOP) is a programming paradigm that employs\
    \ objects to encapsulate code. Objects of types are called classes; a class is\
    \ just a template for an object. When we say a class is instantiated, it means\
    \ an object has been created. Each object contains data and code. In C#, an object\
    \ is an instance of a class.\n\nAn abstract class cannot be instantiated. Instead,\
    \ only subclasses can be instantiated. Abstract classes define abstract methods,\
    \ which like virtual members, except they don't provide a default implementation.\
    \ Implementation must be provided by subclasses, unless that subclass is also\
    \ abstract.\n\n## Sealed Classes\n\nA sealed class cannot be used as the base\
    \ class for any other class. You use the `sealed` keyword to protect your class\
    \ from being inherited. Static classes are implicitly sealed.\n\n## DRY\n\nDRY\
    \ stands for Don't Repeat Yourself. In OOP, encapsulation is used to avoid one\
    \ or two related distinct notions, systems to the combination thereof: (1) a language\
    \ mechanism for restricting direct access to some of an object's components; (2)\
    \ a language mechanism (or other functions) for operating on data. In OOP, the\
    \ open/closed principle states that software entities (classes, functions, etc.)\
    \ are open for extension, closed for modification.\n\n## Instance Constructors\n\
    \nFor classes, the compiler automatically generates a parameterless constructor\
    \ if you do not define any constructors. The parameterless constructor is not\
    \ automatically generated, so you may need to write it.\n\nWhen an object is destroyed,\
    \ its memory is freed. Memory is freed up by the garbage collector. Finalizers\
    \ are called with the `new` keyword.\n\n## Simple Class Declaration\n\n```csharp\n\
    class Customer\n{\n    public protected int Id;\n    public abstract string Name;\
    \ // Interfaces inherited from object\n}\n```\n\nA class is a data structure that\
    \ contains data and executes code. Each member of a class can contain coordination\
    \ or the number of possible variables is local. A local variable declared inside\
    \ a function is hidden. On the Internet, the Service is a program that provides\
    \ functionality to clients. Note: When you have a class, such as our Customer,\
    \ and you have a list of objects of any type, you should always include a list\
    \ to map each item.\n\n```csharp\npublic class Customer\n{\n    public int Id;\n\
    \    public string Name; // in real world these are properties\n    public Customer(int\
    \ id, string name) // (same as class name)\n    {\n        this.Id = id;\n   \
    \     this.Name = name;\n    }\n    public int GetCustomerId() => this.Id;\n}\n\
    ```\n\n## Static\n\nStatic methods are meant to be consumed without instantiating\
    \ them. Static classes can be used to group members that are available to the\
    \ program. A static method can access static members as well as the class itself.\
    \ A static class cannot be instantiated. An instance class cannot inherit from\
    \ a static class. Non-static classes can have static members which can only access\
    \ static members. Static members are shared by all instances of the class, and\
    \ all the instances have the same memory location when they access the static\
    \ method. Static methods can access static members but not instance members. Static\
    \ members also have the option to be accessed from outside the class using the\
    \ dot operator, but only if the class member does not use a static prefix.\n\n\
    ## Methods\n\n```csharp\nclass Program\n{\n    public void ShowDetails()\n   \
    \ {\n        Console.WriteLine(\"Customer ID: \" + Id);\n        Console.WriteLine(\"\
    Name: \" + Name);\n    }\n}\n```\n\nA method is a block of code that is a member\
    \ of a class. You can execute the code from within the method's name. This provides\
    \ access to the class members.\n\n```csharp\nclass NotFound\n{\n    public void\
    \ doSomething() {}\n}\n```\n\nA sequence of statements enclosed by curly braces.\
    \ It may contain local variables (for local computations), flow-of-control statements,\
    \ and other methods known as local functions.\n\n## Fields\n\nA field belongs\
    \ to a class. It can be of any type, either initialized or pre-defined value.\
    \ An initializer part of a field follows the declaration and consists of an equal\
    \ sign followed by an expression that evaluates to a value. This is evaluated\
    \ at compile time. If not uninitialized, the compiler sets the value of a field\
    \ to a default value, by the type of the field.\n\n```text\n[access modifier]\n\
    [static|virtual|new| sealed]\nreturn type\nmethod name (parameter ) { body }\n\
    ```\n\nC# allows for optional parameters which either include or omit the `new`\
    \ keyword. To specify a parameter...\n\nHere is the Console output of the above\
    \ program. Note that the first order Id below is zero because the default is zero:\n\
    Customer ID: 0\nName: \n\n## Properties\n\n| Access | Description |\n| :--- |\
    \ :--- |\n| public | Accessible from anywhere. |\n| private | Accessible only\
    \ within the class. |\n| internal | Accessible within the same assembly. |\n|\
    \ protected | Accessible within the class and derived classes. |\n| protected\
    \ internal | Accessible within assembly or derived classes. |\n| virtual | Can\
    \ be overridden in subclasses. |\n| override | Used to implement a virtual or\
    \ abstract method. |\n| new | Hides the base implementation. |\n| abstract | Must\
    \ be implemented by subclasses. |\n\nC# allows for optional parameters which either\
    \ include or omit the `new` keyword. To specify a parameter...\n\nHere is the\
    \ Console output of the above program. Note that the first order Id below is zero\
    \ because the default is zero:\nCustomer ID: 0\nName: \n\n## Object Initialization\n\
    \n```csharp\nCustomer c = new Customer {\n    Id = 1,\n    Name = \"John\"\n};\n\
    ```\n\n- public: Accessible anywhere.\n- private: Accessible only within the class.\n\
    - internal: Accessible within the same assembly.\n- protected: Accessible within\
    \ the class and derived classes.\n- protected internal: Accessible within assembly\
    \ or derived classes.\n- virtual: Can be overridden in subclasses.\n- override:\
    \ Used to implement a virtual or abstract method.\n- new: Hides the base implementation.\n\
    - abstract: Must be implemented by subclasses.\n\n## Indexers\n\n```csharp\nclass\
    \ Words\n{\n    private string[] words;\n    public string this[int index] {\n\
    \        get { return words[index]; }\n        set { words[index] = value; }\n\
    \    }\n}\n```\n\nThe index argument can be out of range (any type). You can use\
    \ indexers null-indirectionly by using question mark before the string.\n\n```csharp\n\
    string[] words = null;\nConsole.WriteLine(words[0]); // NullReferenceException\n\
    ```\nTo write an indexer, define a property that calls this, using argument name.\n"
  mdcn: "\n\n# C# 抄表 (1)\n\n## 抽象类\n\n### 面向对象编程 (OOP)\n面向对象编程（OOP）是一种使用对象来封装代码的编程范式。类型的对象被称为类；类只是对象的模板。当我们说一个类被实例化时，意味着创建了一个对象。每个对象都包含数据和代码。在\
    \ C# 中，对象是类的实例。\n\n抽象类不能被实例化。相反，只有子类可以被实例化。抽象类定义抽象方法，这些方法与虚成员相似，但它们不提供默认实现。实现必须由子类提供，除非该子类也是抽象类。\n\
    \n## 密封类\n\n密封类不能作为任何其他类的基类。你使用 `sealed` 关键字来保护类不被继承。静态类是隐式密封的。\n\n## DRY\n\n\
    DRY 代表“不要重复”（Don't Repeat Yourself）。在 OOP 中，封装被用于避免一个或两个相关的不同概念、系统到组合中：(1) 一种限制直接访问对象某些组件的语言机制；(2)\
    \ 一种操作数据的语言机制（或其他函数）。在 OOP 中，开闭原则规定软件实体（类、函数等）对扩展开放，对修改关闭。\n\n## 实例构造函数\n\n对于类，如果你没有定义任何构造函数，编译器会自动生成一个无参数的构造函数。无参数构造函数不是自动生成的，因此你可能需要编写它。\n\
    \n当对象被销毁时，它的内存会被释放。内存由垃圾回收器释放。终结器通过 `new` 关键字调用。\n\n## 类声明\n\n```csharp\nclass\
    \ Customer\n{\n    public protected int Id;\n    public abstract string Name;\
    \ // 继承自 object 的接口\n}\n```\n\n类是一个包含数据并执行代码的数据结构。类的每个成员可以包含协调，或者可能变量的数量是局部的。在函数内部声明的局部变量是被隐藏的。在互联网上，服务是一个为客户端提供功能的程序。注意：当你有一个类（例如我们的\
    \ Customer），并且你有一个任何任意类型的对象列表时，你应该始终包含一个列表来映射每个项目。\n\n```csharp\npublic class\
    \ Customer\n{\n    public int Id;\n    public string Name; // 在现实世界中这些是属性\n  \
    \  public Customer(int id, string name) // （与类名相同）\n    {\n        this.Id = id;\n\
    \        this.Name = name;\n    }\n    public int GetCustomerId() => this.Id;\n\
    }\n```\n\n## 静态\n\n静态方法旨在可以在不实例化它们的情况下使用。静态类可以用于组织程序可用的成员。静态方法可以访问静态成员，也可以访问类本身。静态类不能实例化。实例类不能继承自静态类。非静态类可以有静态成员，静态成员只能访问静态成员。静态成员由类的所有实例共享，且所有实例在访问静态方法时具有相同的内存位置。静态方法可以访问静态成员，但不能访问实例成员。静态成员还可以使用点运算符从类外部访问的选项，但前提是该类成员没有使用静态前缀。\n\
    \n## 方法\n\n```csharp\nclass Program\n{\n    public void ShowDetails()\n    {\n\
    \        Console.WriteLine(\"Customer ID: \" + Id);\n        Console.WriteLine(\"\
    Name: \" + Name);\n    }\n}\n```\n\n方法是类成员的一个代码块。你可以从方法名称内部执行代码。这提供了对类成员的访问权限。\n\
    \n```csharp\nclass NotFound\n{\n    public void doSomething() {}\n}\n```\n\n由大括号封装的一系列语句。它可能包含局部变量（用于局部计算）、控制流语句以及被称为局部函数的其他方法。\n\
    \n## 字段\n\n字段属于一个类。它可以是任何类型。字段的初始化部分紧跟声明，由等号和一个求值的表达式组成。该值在编译时求值。如果没有初始化，则将其设置为默认值。\n\
    \n```text\n[访问修饰符]\n[static|virtual|new]\n返回类型\n方法名 (参数 ) { 体 }\n```\n\nC# 允许可选参数包含或省略\
    \ `new` 关键字。指定参数...\n\n程序的输出第一个 Id 为 0，因为默认是 0：\nCustomer ID: 0\nName: \n\n##\
    \ 属性\n\n| 访问权限 | 描述 |\n| :--- | :--- |\n| public | 各处可访问 |\n| private | 仅类内部可见\
    \ |\n| internal | 在同一程序集可见 |\n| protected | 在类及其派生类可见 |\n| protected internal\
    \ | 在程序集或派生类可见 |\n| virtual | 可被子类重写 |\n| override | 实现虚方法或抽象方法 |\n| new | 隐藏基类实现\
    \ |\n| abstract | 必须由子类实现 |\n\n## 对象初始化\n\n```csharp\nCustomer c = new Customer\
    \ {\n    Id = 1,\n    Name = \"John\"\n};\n```\n\n## 索引器\n\n```csharp\nclass Words\n\
    {\n    private string[] words;\n    public string this[int index] {\n        get\
    \ { return words[index]; }\n        set { words[index] = value; }\n    }\n}\n\
    ```\n\n索引参数可以是范围外的（任何类型）。你可以通过在字符串前使用问号来空引用地使用索引器。\n\n```csharp\nstring[] words\
    \ = null;\nConsole.WriteLine(words[0]); // NullReferenceException\n```\n编写索引器时，定义一个调用\
    \ `this` 的属性，使用参数名称。\n\n"
