    set (words[index]) = value;\n}\n\n```\n\nThe get and set accessors. The setter\
    \ method can throw an exception if value was outside a valid range of values.\n\
    \n```\nstatic void main() {\nstring s = \"Hello\"; // zero-based\nConsole.WriteLine(s);\n\
    Console.WriteLine(s);\ns = null; // Writing nothing, or\nConsole.WriteLine(s);\
    \ // NullReferenceException\n}\n```\n\n# ## Object Initialization\n\nC# Object\
    \ Initialization Syntax allows you to initialize an instance of object or collector.\
    \ It allows you to assign values to fields at the time of creation without using\
    \ a constructor.\n\n```\nclass Person\n{\npublic int Id { get; set; }\npublic\
    \ string FirstName { get; set; }\npublic string LastName { get; set; }\npublic\
    \ DateTime Birthday { get; set; }\n}\n```\n\n```\nPerson p = new Person { Id =\
    \ 1, FirstName = \"John\", LastName = \"Doe\" };\n\n```\n\nIf the class has a\
    \ constructor that initializes a field, the last name must be used.\n\n```\nPerson\
    \ p = new Person(\"John\") { LastName = \"Doe\" };\n\n```\n\nA property is declared\
    \ like a field but with a get/set block. Properties look like fields from the\
    \ outside but can contain contain logic. Between a public field and a public property,\
    \ no memory is used. Note that ~= means means from class.\n\n```\nstatic void\
    \ main() {\nItem it = new Item();\nConsole.WriteLine(it.Price);\nit.Price = 45.99m;\n\
    it.Price += it.Price; // += *it.Price;\nit.Price = 100.0m;\nConsole.WriteLine(it.Price);\n\
    }\n```\n\n# ## Properties\n\n```\nclass Item\n{\npublic decimal Price { get; set;\
    \ }\npublic decimal Amount { get; set; }\n}\n```\n\nHere is a property with its\
    \ backing field, that is implemented with auto property with { get; set; }.\n\n\
    ```\nclass Account\n{\nprivate decimal _amount;\npublic decimal Amount {\nget\
    \ { return _amount; }\nset { _amount = value; } // the keyword value\n}\npublic\
    \ void Deposit(decimal amount) { _amount += amount; }\n}\n```\n\nIndexes provide\
    \ a way to access elements in a class that encapsulates a list or collection.\
    \ indexer is like an array but can be accessed via an index argument rather than\
    \ a property. An indexer can have multiple indexes that allows you to access elements\
    \ by different index types.\n\n# ## Indexers\n\n```\nclass Words\n{\nprivate string[]\
    \ words;\npublic string this[int index] {\nget { return words[index]; }\nset {\
    \ words[index] = value; }\n}\n\n```\n\nThe index argument can be out of range\
    \ (any type), You can use indexers null-indirectionly by using a question mark\
    \ before the string index.\n\n```\nstring[] words = null;\nConsole.WriteLine(words[0]);\
    \ // NullReferenceException\nTo write an indexer, define a property that calls\
    \ this, using the argument name.\n```\n\nInheritance is a type of relationship\
    \ (\"A-B\") between classes where one class to inherit members from the other.\
    \ A “house” is an “of” relationship. Inheritance allows for polymorphism in C#.\
    \ In the example below Animal is at the top with an arrow pointing to Animal.\
    \ Another example of inheritance is a Saving Bank Account inherits from Bank Account.\n\
    \n# ## Inheritance\n\n```\nclass Base\n{\npublic void Method() { Console.WriteLine(\"\
    Base class\"); }\n}\nclass Sub : Base\n{\npublic override void Method() { Console.WriteLine(\"\
    Sub class\"); }\n}\n```\n\n# ## Constructor\n\nWhen you instantiate a class, base\
    \ constructors are executed first, as seen in lines 2 and 3 of the output. Base\
    \ constructors are not inherited.\n\n```\nclass Base\n{\npublic Base() { Console.WriteLine(\"\
    Base constructor\"); }\n}\nclass Sub : Base\n{\npublic Sub() : base() { Console.WriteLine(\"\
    Sub constructor\"); }\n}\n```\n\n```\nclass Program\n{\n  static void main() {\n\
    \    Sub s = new Sub();\n    s.Amount = 1; // inherited from base\n    Console.WriteLine(s.Amount);\
    \ // Sub 1\n  }\n}\nclass Base\n{\n  public int Amount { get; set; }\n}\nclass\
    \ Sub : Base\n{\n  public string Sub { get; set; }\n}\n```\n\n![](img/1f8cd73ee3d2c31b907cf27a170f2e34_5_0.png)"
- md: "\n# COP Cheat Sheet (3 of 4)\n\n## Composition vs Inheritance\n\n### Composition\
    \ (aka Containment)\n\nDesigning classes needs to be careful. With inheritance,\
    \ using inheritance can result in hierarchies that make refactoring difficult\
    \ due to tight coupling. There is a fish and a whale both inherit from Animal,\
    \ but they are quite different. One is a fish and the other is a mammal. If we\
    \ use inheritance, we would have to create a Fish and a Whale class.\n\nComposition\
    \ is a type of relationship ('a-has') between two classes that allows one to contain\
    \ another. Inheritance is another type of relationship. Methods in both allow\
    \ code re-use. However, in composition, the object calls methods of the contained\
    \ object instead of implementing them itself, which sends a message to the contained\
    \ object.\n\nWe can also create a WalkAndSwim class. It is not fine to use \"\
    a-is\" because it does not make sense in the context of a fish that can walk,\
    \ but we are certain that all our animals will walk now and in the future. If\
    \ you have, that is, you might need a sub-class of Animal called WalkAnimal, and\
    \ re-develop your code.\n\nGenerally, instances use a field in the class to hold\
    \ an instance of another class and composition depends on what you need it. Two\
    \ things to remember are:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \nclass Car {\n    private readonly Engine engine;\n    public Car(Engine engine)\
    \ // constructor {\n        engine = engine;\n    }\n    public void Drive() {\n\
    \        float speed = 0.0f;\n        engine.Start(\"starting speed of km/h\"\
    );\n        speed = 50.0f;\n    }\n    engine.EngineStart(\"starting car\");\n\
    \    engine.Stop(\"car off\");\n}\n\nclass Truck {\n    private readonly Engine\
    \ engine;\n    public Truck(Engine engine) // constructor {\n        engine =\
    \ engine;\n    }\n    public void DriveTruck() {\n        engine.Drive();\n  \
    \  }\n}\nclass Vehicle // the car and truck have \"An engine\"\n{\n    public\
    \ void updateStatus(string status) {\n        Console.WriteLine(\"status: \" +\
    \ status);\n    }\n}\nclass Program {\n    public static void main(string[] args)\
    \ {\n        var car = new Car(new Engine());\n        var sedan = new Sedan();\n\
    \        var pickup = new Truck(new Engine());\n        pickup.DriveTruck();\n\
    \    }\n}\n```\n\n## Interfaces\n\nAn interface is like a class, but it is a specification\
    \ rather than an implementation for members. It's a \"contract\". Interface members\
    \ are abstract. A class can implement multiple interfaces, but it can inherit\
    \ from only one class. A class and struct can inherit from itself inheriting from\
    \ interfaces.\n\nIn System.Type.Value, the interfaces will be implemented by the\
    \ classes and structs that implement the interface. By convention, interface names\
    \ start with the letter \"I\".\n\n## Method Overriding & Polymorphism\n\nMethod\
    \ overriding allows the implementation of an inherited method to change from the\
    \ method in the base class. The virtual keyword is used in the method of the base\
    \ class and in the derived class to override it. What is polymorphism? Polymorphism\
    \ allows us to use examples with different classes as the base class.\n\n```csharp\n\
    class BaseClass {\n    public int Property { get; set; }\n    public virtual void\
    \ writeMessage() {}\n}\n\nclass Child : BaseClass {\n    public int Composition\
    \ = 3;\n    public override void writeMessage() {\n        Console.WriteLine(\"\
    Green \" + Composition);\n    }\n}\n\nclass Display {\n    public void writeAllMessages(List<BaseClass>\
    \ baseclasses) {\n        foreach (var item in baseclasses) {\n            item.writeMessage();\n\
    \        }\n    }\n}\n```\n\nWhen we call writeAllMessages() above we have polymorphic\
    \ behavior. Here we have a list of different objects, but the implementation for\
    \ each color. Red override the green base class. The notice is the list of the\
    \ base class BaseClass.\n\n```csharp\ninterface IInterface {\n    string GetName();\n\
    }\n\nclass Person : IInterface {\n    public string Name;\n    public int Age;\n\
    \    public string GetName() { return Name; }\n    public string GetAge() { return\
    \ Age.ToString(); }\n}\n\nclass Student : Person {\n    public string School;\n\
    \    public override string GetName() { return Name + \". Student\"; }\n}\n\n\
    class Program {\n    public static void main(string[] args) {\n        var p =\
    \ new Person { Name = \"John Doe\", Age = 35 };\n        var s = new Student {\
    \ Name = \"Jane\", Age = 24, School = \"University\" };\n        // the objects\
    \ are automatically\n        // converted to interface\n        Console.WriteLine((IInterface)p.GetName());\n\
    \        Console.WriteLine((IInterface)s.GetName());\n        Console.WriteLine(p.GetType());\n\
    \    }\n}\n```\nOutput:\nJohn Doe\nJane. Student\n\n```csharp\npublic static void\
    \ main(string[] args) {\n    var baseclasses = new List<BaseClass>();\n    baseclasses.Add(new\
    \ Child() { Composition = 3 });\n    baseclasses.Add(new Child() { Composition\
    \ = 3 });\n    var display = new Display();\n    display.writeAllMessages(baseclasses);\n\
    }\n```\nOutput:\nGreen 3\nGreen 3\n\nWait, the previous output was:\nJohn Doe\
    \ Age: 35\nJane Smith Age: 24\n\n# COP Cheat Sheet (4 of 4)\n\n### Interfaces\
    \ & Extensibility\n\nWe create a constructor and dependency, which means the FileProcessor\
    \ depends on ConsoleLogger. It doesn't care.\n\n```csharp\nclass FileProcessor\
    \ {\n    private readonly ILogger _logger;\n    public FileProcessor(ILogger logger)\
    \ // constructor {\n        _logger = logger;\n    }\n    public void Process(string\
    \ message) // method {\n        _logger.Log(message);\n    }\n    public void\
    \ Save(string message) // method {\n        _logger.Log(message);\n    }\n}\n\
    ```\n\n### Interfaces & Unit Testing\n\nUsing interfaces with unit testing. This\
    \ example builds on the interfaces by passing the dependency to the JournalPost\
    \ class. To make unit testing easier, we'll use an interface for it.\n\n```csharp\n\
    public voidTestMethod() {\n    var mock = new Mock<IDJournalEntryChecker>();\n\
    \    var post = new JournalPost(mock.Object);\n    var entry = new JournalEntry\
    \ { Amount = -120.5m };\n    mock.Setup(x => x.Check(entry)).Returns(true);\n\
    \    post.Post(entry);\n    mock.Verify(x => x.Check(It.IsAny<JournalEntry>()),\
    \ Times.Once);\n}\n```\n\nSince we want to test JournalPost(), we will rename\
    \ it to JournalTests. Add a Reference to our project. In the unit test project,\
    \ check the box of the project. If we don't want to pass the original one to the\
    \ JournalPost, we need a mock that will be fake because we are testing out JournalPost,\
    \ not the checker.\n\n- need to add a Reference to our project\n- ExpectedException(typeof(InvalidOperationException))\n\
    - using naming convention: method_exception\n\n```csharp\nclass JournalPost {\n\
    \    private decimal _Balance;\n    private DateTime _PostDate;\n    private readonly\
    \ IDJournalEntryChecker _checker;\n    public JournalPost(IDJournalEntryChecker\
    \ checker) {\n        _checker = checker;\n    }\n    public void Post(JournalEntry\
    \ entry) {\n        if (!_checker.Check(entry)) {\n            throw new InvalidException(\"\
    Already posted!\");\n        }\n        _Balance += entry.Amount;\n        _PostDate\
    \ = DateTime.Now.AddDays(1);\n    }\n}\n```\n\n### ConsoleLogger\n\n```csharp\n\
    class ConsoleLogger : ILogger {\n    public void Log(string message) {\n     \
    \   Console.WriteLine(message);\n    }\n}\n```\n\n### JournalEntry\n\n```csharp\n\
    class JournalEntry {\n    public decimal Amount { get; set; }\n    public DateTime\
    \ PostDate { get; set; }\n}\n```\n\nOutput:\nPosted:\nDate: 2020-02-07\nAmount:\
    \ -120.50\nCredit amount: 120.50\nBalance: -110.50\n\n### JournalPost\n\n(Already\
