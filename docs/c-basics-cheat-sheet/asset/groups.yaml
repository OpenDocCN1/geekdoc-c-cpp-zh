    \    public Program(ILogger logger) {\n        _logger = logger;\n    }\n    public\
    \ static void Main(string[] args) {\n        try {\n            var processor\
    \ = new FileProcessor(new ConsoleLogger());\n            processor.Process(\"\
    done program\");\n        } catch (Exception ex) {\n            _logger.Log(\"\
    Error: \" + ex.Message);\n        }\n    }\n}\n```\n\n```csharp\npublic static\
    \ void Main(string[] args) {\n    // we send our to console\n    var processor\
    \ = new FileProcessor(new ConsoleLogger());\n    processor.Process(\"done program\"\
    );\n}\n```\nOutput:\nStarting at 2020-02-07 10:05:43\nIn middle of doing stuff...\n\
    \nError! \ndone program.\n\nWe can extend it. We can create more loggers than\
    \ ConsoleLogger, such as DatabaseLogger, FileLogger, EmailLogger and so on, and\
    \ all we need to change the Main.\n"
  mdcn: "\n\n# COP 备忘清单 (3 至 4)\n\n## 组合 vs 继承\n\n### 组合（又称包含）\n\n设计类时需要小心。在使用继承时，使用继承可能会导致由于紧耦合而难以重构的层级结构。鱼和鲸都继承自\
    \ `Animal`，但它们非常不同。一种是鱼，另一种是哺乳动物。如果我们使用继承，就必须创建一个 `Fish` 类和一个 `Whale` 类。\n\n组合是两个类之间的一种“拥有”（a-has）关系，它允许一个类包含另一个类。继承是另一种类型的关系。两者的方法都允许代码重用。然而，在组合中，对象调用被包含对象的方法而不是自己实现它们，这向被包含的对象发送了消息。\n\
    \n我们还可以创建一个 `WalkAndSwim` 类。使用“是”（a-is）在这里是不妥的，因为在会走路的鱼的语境下这并说得通，但我们确定所有的动物现在和将来都会走路。如果你有，也就是说你可能需要一个名为\
    \ `WalkAnimal` 的 `Animal` 子类，并重新开发你的代码。\n\n通常，实例使用类中的字段来持有另一个类的实例，而组合取决于你的需求。需要记住两点：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\n\nclass Car {\n\
    \    private readonly Engine engine;\n    public Car(Engine engine) // 构造函数 {\n\
    \        engine = engine;\n    }\n    public void Drive() {\n        float speed\
    \ = 0.0f;\n        engine.Start(\"starting speed of km/h\");\n        speed =\
    \ 50.0f;\n    }\n    engine.EngineStart(\"starting car\");\n    engine.Stop(\"\
    car off\");\n}\n\nclass Truck {\n    private readonly Engine engine;\n    public\
    \ Truck(Engine engine) // 构造函数 {\n        engine = engine;\n    }\n    public\
    \ void DriveTruck() {\n        engine.Drive();\n    }\n}\nclass Vehicle // 车和卡车都有“一个引擎”\n\
    {\n    public void updateStatus(string status) {\n        Console.WriteLine(\"\
    status: \" + status);\n    }\n}\nclass Program {\n    public static void main(string[]\
    \ args) {\n        var car = new Car(new Engine());\n        var sedan = new Sedan();\n\
    \        var pickup = new Truck(new Engine());\n        pickup.DriveTruck();\n\
    \    }\n}\n```\n\n## 接口\n\n接口类似于类，但它是成员的规范而非实现。它是一个“合约”。接口成员是抽象的。一个类可以实现多个接口，但只能继承一个类。类和结构体可以继承自自己实现了接口的对象。\n\
    \n在 System.Type.Value 中，接口将由实现接口的类和结构体实现。按照约定，接口名称以字母 \"I\" 开头。\n\n## 方法重写与多态\n\
    \n方法重写允许继承方法的实现改变于基类中的方法。`virtual` 关键字用于基类的方法以及派生类中以重写它。什么是多态？多态允许我们使用具有不同类的示例作为基类。\n\
    \n```csharp\nclass BaseClass {\n    public int Property { get; set; }\n    public\
    \ virtual void writeMessage() {}\n}\n\nclass Child : BaseClass {\n    public int\
    \ Composition = 3;\n    public override void writeMessage() {\n        Console.WriteLine(\"\
    Green \" + Composition);\n    }\n}\n\nclass Display {\n    public void writeAllMessages(List<BaseClass>\
    \ baseclasses) {\n        foreach (var item in baseclasses) {\n            item.writeMessage();\n\
    \        }\n    }\n}\n```\n\n当我们调用上面的 `writeAllMessages()` 时，我们拥有多态行为。在这里我们有一个不同对象的列表，但每个颜色都有对应的实现。红色重写了绿色的基类。注意的是基类\
    \ `BaseClass` 的列表。\n\n```csharp\ninterface IInterface {\n    string GetName();\n\
    }\n\nclass Person : IInterface {\n    public string Name;\n    public int Age;\n\
    \    public string GetName() { return Name; }\n    public string GetAge() { return\
    \ Age.ToString(); }\n}\n\nclass Student : Person {\n    public string School;\n\
    \    public override string GetName() { return Name + \". Student\"; }\n}\n\n\
    class Program {\n    public static void main(string[] args) {\n        var p =\
    \ new Person { Name = \"John Doe\", Age = 35 };\n        var s = new Student {\
    \ Name = \"Jane\", Age = 24, School = \"University\" };\n        // 对象会被自动\n \
    \       // 转换为接口\n        Console.WriteLine((IInterface)p.GetName());\n      \
    \  Console.WriteLine((IInterface)s.GetName());\n        Console.WriteLine(p.GetType());\n\
    \    }\n}\n```\n输出：\nJohn Doe\nJane. Student\n\n```csharp\npublic static void\
    \ main(string[] args) {\n    var baseclasses = new List<BaseClass>();\n    baseclasses.Add(new\
    \ Child() { Composition = 3 });\n    baseclasses.Add(new Child() { Composition\
    \ = 3 });\n    var display = new Display();\n    display.writeAllMessages(baseclasses);\n\
    }\n```\n输出：\nGreen 3\nGreen 3\n\n等待，之前的输出是：\nJohn Doe Age: 35\nJane Smith Age:\
    \ 24\n\n# COP 备忘清单 (4 至 4)\n\n### 接口与可扩展性\n\n我们创建了一个构造函数和依赖，这意味着 `FileProcessor`\
    \ 依赖于 `ConsoleLogger`。它并不关心。\n\n```csharp\nclass FileProcessor {\n    private\
    \ readonly ILogger _logger;\n    public FileProcessor(ILogger logger) {\n    \
    \    _logger = logger;\n    }\n    public void Process(string message) {\n   \
    \     _logger.Log(message);\n    }\n    public void Save(string message) {\n \
    \       _logger.Log(\"Saving: \" + message);\n    }\n}\n```\n\n### 接口与单元测试\n\n\
    为了单元测试 `JournalPost`，我们需要一个 `IEntryChecker` 接口。\n\n```csharp\npublic interface\
    \ IEntryChecker {\n    bool Check(JournalEntry entry);\n}\n```\n\n现在我们可以使用 Moq\
    \ 来测试 `JournalPost`。\n\n```csharp\n[TestClass]\npublic class JournalPostTests\
    \ {\n    [TestMethod]\n    public void Test_AlreadyPosted_ThrowsException() {\n\
    \        var mock = new Mock<IEntryChecker>();\n        var post = new JournalPost(mock.Object);\n\
    \        var entry = new JournalEntry { Amount = -120.5m };\n        mock.Setup(x\
    \ => x.Check(It.IsAny<JournalEntry>())).Returns(true);\n        Assert.ThrowsException<InvalidOperationException>(()\
    \ => {\n            post.Post(entry);\n        });\n    }\n\n    [TestMethod]\n\
    \    public void Test_NewEntry_UpdatesBalance() {\n        var mock = new Mock<IEntryChecker>();\n\
    \        var post = new JournalPost(mock.Object);\n        var entry = new JournalEntry\
    \ { Amount = 120.5m };\n        mock.Setup(x => x.Check(It.IsAny<JournalEntry>())).Returns(false);\n\
    \        post.Post(entry);\n        mock.Verify(x => x.Check(entry), Times.Once);\n\
    \    }\n}\n```\n\n"
