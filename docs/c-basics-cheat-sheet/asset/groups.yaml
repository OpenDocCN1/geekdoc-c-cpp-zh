- md: "\n# C Basics Sheet (1 of 4)\n\n## Introduction to C\nThe C language was developed\
    \ by Microsoft for the .NET framework. C is a completely rewritten language based\
    \ on C and C++. It is a general-purpose, object-oriented, type-platform neutral\
    \ language that works with the .NET Framework.\n\n## Visual Studio (VS)\nVisual\
    \ Studio 2019 is a free download from Microsoft. To create a project, go to File\
    \ > New Project. From the vert select the C# Console App template in the left.\
    \ At the right, select the Console window to configure the name and location of\
    \ the project. Click OK and VS will create your project.\n\n## Hello World (the\
    \ world)\nUsing C#, you will start your program with a simple line of code like\
    \ this:\n\n```csharp\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        Console.WriteLine(\"Hello world!\");\n        // This code is\
    \ commented out by //\n        /* a multi-line comment\n           is implemented\
    \ by */\n    }\n}\n```\n\nC# will run without the debug mode. The reason you do\
    \ not want to start the Starting Debugging (F5) is because the console window\
    \ will close once when the program finishes at the end. There are several methods\
    \ and properties to control this. You can change the color and title of the title\
    \ bar. To do this, use the project properties. You can also change your solution\
    \ name and project location.\n\n## A Few Tricks in VS\n\n```csharp\nCode Description\n\
    public class Constructor\n{\n    public int MyProperty { get; set; }\n}\n```\n\
    \nReSharper is a plugin for Visual Studio that adds many code navigation and editing\
    \ features. It finds coding errors, runtime errors, and refactoring opportunities\
    \ and highlights them to you, suggesting corrections for them.\n\n## Common Language\
    \ Runtime (CLR)\nA core component of the .NET framework, the CLR sits on top of\
    \ the operating system and manages your execution. When you .NET tools, compiler,\
    \ debugger, and ASP are are all used by the CLR. For a .NET language, the compiler\
    \ translates other code into intermediate language and produces an output file\
    \ called an assembly (exe or DLL) which native machine code can translate into\
    \ an intermediate language (Common Intermediate Language or IL). The CLR translates\
    \ this IL into native machine code when it is run. The CLR ensures safety, security\
    \ in memory and manages the application's execution through just-in-time (JIT)\
    \ compilation of each method. When the CLR is compiled, it manages it, performing\
    \ tasks such as releasing objects, memory checking around and handling exceptions.\n\
    \n## Variable Declaration and Assignment\nIn C#, you must declare a variable before\
    \ you can use it. To declare a variable, specify the type of variable followed\
    \ by its name. You can also initialize it with the data you want it to hold followed\
    \ by a variable name. A value is assigned to a variable using the assignment operator\
    \ (=). The variable is then defined and initialized.\n\n## Data Types\nC# has\
    \ a built-in type system. This means that every variable you create is of a specific\
    \ type.\n\n| Primitive | Bytes | Range | Sys Type |\n| :--- | :--- | :--- | :---\
    \ |\n| bool | 1 | True or False | Boolean |\n| char | 2 | 0 to 65535 | Char |\n\
    | byte | 1 | 0 to 255 | Byte |\n| short | 2 | -32,768 to 32,767 | Int16 |\n| int\
    \ | 4 | -2,147,483,648 to 2,147,483,647 | Int32 |\n| long | 8 | -9,223,372,036,854,775,808\
    \ to 9,223,372,036,854,775,807 | Int64 |\n| float | 4 | ±1.5e-45 to ±3.4e+38 |\
    \ Float |\n| double | 8 | ±5.0e-324 to ±1.7e+308 | Double |\n| decimal | 16 |\
    \ ±1.0e-28 to ±7.9e+28 | Decimal |\n\nThe value literal is the defining property\
    \ of a type of data. For example, if you want an integer, you must use the int\
    \ type. If you want a decimal, you must use the double type.\n\n- Signed (short,\
    \ int, long)\n- Unsigned (byte, ushort, uint, ulong)\n- Real (float, double)\n\
    - Decimal\n- String\n\nA string is a built-in type that represents a sequence\
    \ of characters. A string literal is enclosed in double quotes. The character\
    \ prefixed with the # is called an interpolated string, which can contain variables\
    \ inside curly braces. This allows you to embed variables directly into the string\
    \ literal.\n\nThe Console.WriteLine() method is used to print text to the console.\
    \ For example:\n\n```csharp\nstring name = \"John\";\nConsole.WriteLine(\"Hello\
    \ {name}!\");\n```\n\nAnother example:\n```csharp\nstring city = \"New York\"\
    ;\nConsole.WriteLine(\"I live in {city}!\");\n```\n\n## Char\nThe char type (System.Char)\
    \ represents a Unicode character and occupies two bytes. A char literal is enclosed\
    \ in single quotes.\n\n```csharp\nchar myChar = 'A';\nConsole.WriteLine(myChar);\n\
    foreach (char c in myChar.ToString()) { Console.Write(c); }\n```\n\n# CSharp Basics\
    \ Cheat Sheet 2 (of 4)\n\n## Escape Sequences\nEscape sequences work with strings\
    \ and characters, for verbatim strings, which are created by the @ symbol.\n\n\
    The @ (verbatim literal) lets you specify any character by its four-digit hex\
    \ code.\n\n| Character | Value | Overloaded |\n| --- | --- | --- |\n| ' | 0x0027\
    \ | |\n| \\\" | 0x0022 | |\n| \\\\ | 0x005c | |\n| \\a | 0x0007 | |\n| \\b | 0x0008\
    \ | |\n| \\t | 0x0009 | |\n| \\f | 0x000c | |\n| \\n | 0x000a | |\n| \\r | 0x000d\
    \ | |\n| \\t | 0x0009 | |\n| \\? | 0x003f | |\n\nVerbatim literal is a string\
    \ literal prefixed with @ and does not support escapes.\n\n```csharp\nstring path\
    \ = @\"C:\\temp\\\";\nConsole.WriteLine(path);\n```\n\n## Constants\nA constant\
    \ is much like a local variable, its value cannot be changed.\n\nVerbatim literal\
    \ is a string literal prefixed with @ and does not support escapes.\n\n```csharp\n\
    string path = @\"C:\\temp\\\";\nConsole.WriteLine(path);\n```\n\n## Constants\n\
    A constant is much like a local variable, its value cannot be changed.\n\n...\
    \ (Wait based on OCR text)\n\n```csharp\nstring city = \"New York\";\nConsole.WriteLine(\"\
    I live in {city}!\");\n```\n"
  mdcn: "\n\n# C 基础知识表 (1/4)\n\n## C 简介\nC 语言由微软为 .NET 框架开发。C 是一种基于 C 和 C++ 完全重写的语言。它是一种通用的、面向对象的、平台无关的语言，适用于\
    \ .NET 框架工作。\n\n## Visual Studio (VS)\nVisual Studio 2019 是微软提供的免费下载软件。要创建项目，转到“文件\
    \ > 新项目”。在左侧选择 C# 控制台应用模板。在右侧选择“控制台”窗口以配置项目的名称和位置。点击“确定”，VS 将为你创建你的项目。\n\n## Hello\
    \ World（世界）\n使用 C#，你将用如下简单的一行代码启动程序：\n\n```csharp\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        Console.WriteLine(\"Hello world!\"\
    );\n        // 这行代码被 // 注释\n        /* 多行注释\n           由 /* 实现 */\n    }\n}\n\
    ```\n\nC# 将在非调试模式下运行。你之所以不想启动开始调试 (F5)，是因为控制窗口在程序结束时会自动关闭一次。有几种方法和属性可以控制这一点。你可以更改标题栏的颜色和标题。要实现这一点，可以使用项目属性。你还可以更改解决方案名称和项目位置。\n\
    \n## VS 中的一些小技巧\n\n```csharp\nCode Description\npublic class Constructor\n{\n\
    \    public int MyProperty { get; set; }\n}\n```\n\nReSharper 是 Visual Studio\
    \ 的插件，添加了许多代码导航和编辑功能。它能发现编码错误、运行时错误和重构机会，并向你高亮它们，提供修复建议。\n\n## 公用语言运行时 (CLR)\n\
    作为 .NET 框架的核心组件，CLR 运行在操作系统之上并管理你的执行。当你使用 .NET 工具、编译器、调试器和 ASP 时，它们都由 CLR 使用。对于\
    \ .NET 语言，编译器将其他代码转换为中间语言，并生成一个名为程序集（exe 或 DLL）的输出文件，原生机器代码可以将该程序集转换为中间语言（通用中间语言或\
    \ IL）。当程序运行时，CLR 将这些 IL 翻译成原生机器代码。CLR 确保安全性、内存安全，并通过对每个方法的即时编译 (JIT) 来管理应用程序的执行。当\
    \ CLR 编译时，它会进行管理，执行如释放对象、内存检查和处理异常等任务。\n\n## 变量声明与赋值\n在 C# 中，你必须在使用变量之前对其进行声明。要声明变量，指定变量类型后跟其名称。你还可以使用想要让包含的数据来初始化它，并在后跟变量名。使用赋值运算符\
    \ (=) 将值赋予变量。然后变量即被定义并初始化。\n\n## 数据类型\nC# 拥有内置的类型系统。这意味着你创建的每个变量都是特定类型。\n\n| 原生类型\
    \ | 字节 | 范围 | 系统类型 |\n| :--- | :--- | :--- | :--- |\n| bool | 1 | 真或否 | Boolean\
    \ |\n| char | 2 | 0 到 65535 | Char |\n| byte | 1 | 0 到 255 | Byte |\n| short |\
    \ 2 | -32,768 到 32,767 | Int16 |\n| int | 4 | -2,147,483,648 到 2,147,483,647 |\
    \ Int32 |\n| long | 8 | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
    \ | Int64 |\n| float | 4 | ±1.5e-45 到 ±3.4e+38 | Float |\n| double | 8 | ±5.0e-324\
    \ 到 ±1.7e+308 | Double |\n| decimal | 16 | ±1.0e-28 到 ±7.9e+28 | Decimal |\n\n\
    值字面量是数据类型的定义属性。例如，如果你需要一个整数，必须使用 int 类型。如果你需要一个小数，必须使用 double 类型。\n\n- 有符号型 (short,\
    \ int, long)\n- 无符号型 (byte, ushort, uint, ulong)\n- 实数型 (float, double)\n- 小数型\n\
    - 字符串\n\n字符串 是一种表示字符序列的内置类型。字符串字面量包含在双引号中。前缀为 # 的字符称为插值字符串，它可以在大括号内包含变量。这允许你将变量直接嵌入字符串字面量中。\n\
    \nConsole.WriteLine() 方法用于向控制台打印文本。例如：\n\n```csharp\nstring name = \"John\";\n\
    Console.WriteLine(\"Hello {name}!\");\n```\n\n另一个示例：\n```csharp\nstring city =\
    \ \"New York\";\nConsole.WriteLine(\"I live in {city}!\");\n```\n\n## 字符\nchar\
    \ 类型 (System.Char) 表示一个 Unicode 字符，并占用两个字节。char 字面量包含在单引号中。\n\n```csharp\nchar\
    \ myChar = 'A';\nConsole.WriteLine(myChar);\nforeach (char c in myChar.ToString())\
    \ { Console.Write(c); }\n```\n\n# CSharp 基础速查表 (2/4)\n\n## 转义序列\n转义序列适用于字符串和字符，以及由\
    \ @ 符号创建的逐字面字符串。\n\n@（逐字字面量）允许你通过四位十六进制代码指定任何字符。\n\n| 字符 | 值 | 重载 |\n| --- | ---\
    \ | --- |\n| ' | 0x0027 | |\n| \\\" | 0x0022 | |\n| \\\\ | 0x005c | |\n| \\a |\
    \ 0x0007 | |\n| \\b | 0x0008 | |\n| \\t | 0x0009 | |\n| \\f | 0x000c | |\n| \\\
    n | 0x000a | |\n| \\r | 0x000d | |\n| \\t | 0x0009 | |\n| \\? | 0x003f | |\n\n\
    逐字字面量以前缀 @ @，不支持转义字符。\n\n"
