  - "[PAGE 5]\n\n# # C# Cheat Sheet (2 of 4)\n\n| Access | Description |\n| --- |\
    \ --- |\n| Public | Fully accessible. This is the implicit accessibility for members\
    \ of an enum or interface. |\n| private | Accessible only within the class. |\n\
    | internal | Accessible only within the same assembly. |\n| protected | Not used\
    \ normally. Accessible only from the class and its derived classes. |\n\nprivate\
    \ is the default accessibility for members of a class. This type has no way to\
    \ hide implementation details that it contains.\n\nvirtual methods can be overridden\
    \ in subclasses.\n\nnew methods can hide base methods.\n\nabstract methods must\
