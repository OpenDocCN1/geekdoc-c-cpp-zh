  md: "# # C# Advanced Cheat Sheet (4 of 4)\n\nAsynchronous...\n\n# Asynchronous\n\
    \nIn the synchronous model you execute lines by line, but in the asynchronous\
    \ model (e.g. web requests) you don't. In .NET 4.5 (2012) Microsoft introduced\
    \ a new asynchronous model, instead of multi-threading and callbacks. It uses\
    \ async and await keywords. In our example we have a WPF program that has 2 blocking\
    \ operations (downloading and writing). We use async and await keywords to make\
    \ the UI responsive. Async method works only if the input method is async and\
    \ has no effect on the\n\n```\nusing System;\nusing System.Threading.Tasks;\n\
    using System.Windows;\nnamespace Asynchronous\n```\n\n```\npublic partial class\
    \ MainWindow : Window\n{\n    public MainWindow()\n    {\n        InitializeComponent();\n\
    \    }\n    private async void Button_Click(object sender, RoutedEventArgs e)\n\
    \    {\n        await DownloadTaskAsync(\"http://begincodingnow.com/\");\n   \
    \     await Task.Delay(2000); // wait at the end of the method\n    }\n    public\
    \ async Task DownloadTaskAsync(string url)\n    {\n        // Use Task.Run to\
    \ offload work to a background thread\n        await Task.Run(async () =>\n  \
    \      {\n            using (HttpClient client = new HttpClient())\n         \
    \   {\n                string result = await client.GetStringAsync(url);\n   \
    \             MessageBox.Show(result);\n            }\n        });\n    }\n}\n\
    ```\n\nWe now modify our model. The message box executes immediately. We can execute\
    \ other code here. Another message box executes after the blocking operation.\n\
    \nException Handling blocks can be used to avoid unexpected exceptions when the\
    \ program crashes. We use a Try catch block. The four keywords of exception handling\
    \ are: try, catch, finally, and throw. The first code example has an unexpected\
    \ exception. In the second example we handle the exception.\n\n```\npublic int\
    \ Divide(int numerator, int denominator)\n{\n    try\n    {\n        return numerator\
    \ / denominator;\n    }\n    catch (DivideByException ex)\n    {\n        MessageBox.Show(\"\
    Cannot divide by zero. \" + ex.Message);\n    }\n    catch (Exception ex)\n  \
    \  {\n        MessageBox.Show(\"Unexpected error! \" + ex.Message);\n    }\n \
    \   finally\n    {\n        Console.WriteLine(\"Attempted to divide by zero\"\
    );\n    }\n}\n```\n\n```\npublic async Task Main(string[] args)\n{\n    try\n\
    \    {\n        var client = new HttpClient();\n        string result = await\
    \ client.GetStringAsync(\"http://begincodingnow.com/\");\n        Console.WriteLine(result);\n\
    \    }\n    catch (DivideByZeroException ex)\n    {\n        Console.WriteLine(\"\
    Cannot divide by zero. \" + ex.Message);\n    }\n    catch (Exception ex)\n  \
    \  {\n        Console.WriteLine(\"Unexpected error! \" + ex.Message);\n    }\n\
    \    finally\n    {\n        Console.WriteLine(\"Attempted to divide by zero\"\
    );\n    }\n}\n```\n\nRecursion is a function that calls itself. You must write\
    \ a condition that checks if the condition is satisfied. If not the function will\
    \ call itself too many times and result in an infinite loop.\n\n```\npublic static\
    \ int Factorial(int n)\n{\n    if (n <= 1)\n    {\n        return 1;\n    }\n\
    \    else\n    {\n        return n * Factorial(n - 1);\n    }\n}\n```\n\nTo implement\
    \ multiple catch blocks set a break point (F9) and run in debug mode. Press F11\
    \ to step through the code. To bring up more details, click the wrench icon. Look\
    \ at Message, Source (or click the marker icon), StackTrace (sequence of method\
    \ calls in the reverse order - where the exception happened) and others.\n\n```\n\
    public static int CountDivisors(double number, double divisor)\n{\n    int count\
    \ = 0;\n    for (int i = 1; i <= number; i++)\n    {\n        if (number % divisor\
    \ == 0)\n        {\n            count++;\n        }\n    }\n    return count;\n\
    }\n```\n\n```\npublic class Calculator\n{\n    public int Add(int a, int b)\n\
    \    {\n        return a + b;\n    }\n\n    public int Subtract(int a, int b)\n\
    \    {\n        return a - b;\n    }\n\n    public int Multiply(int a, int b)\n\
    \    {\n        return a * b;\n    }\n\n    public int Divide(int a, int b)\n\
    \    {\n        if (b == 0)\n        {\n            throw new DivideByZeroException();\n\
    \        }\n        return a / b;\n    }\n}\n```\n\nMultiple catch blocks example\
    \ below:\n\n```\ntry\n{\n    var calculator = new Calculator();\n    var result\
    \ = calculator.Divide(10, 0);\n}\ncatch (DivideByZeroException ex)\n{\n    MessageBox.Show(\"\
    Cannot divide by zero!\");\n}\ncatch (Exception ex)\n{\n    MessageBox.Show(\"\
    Unexpected error!\");\n}\n```"
