  md: "# # C# Cheat Sheet (2 of 4)\n\n| Access | Description |\n| --- | --- |\n| Public\
    \ | Fully accessible. This is the implicit accessibility for members of an enum\
    \ or interface. |\n| private | Accessible only within the class. |\n| internal\
    \ | Accessible only within the same assembly. |\n| protected | Not used normally.\
    \ Accessible only from the class and its derived classes. |\n\nprivate is the\
    \ default accessibility for members of a class. This type has no way to hide implementation\
    \ details that it contains.\n\nvirtual methods can be overridden in subclasses.\n\
    \nnew methods can hide base methods.\n\nabstract methods must be implemented by\
    \ subclasses.\n\n```\n{\nget (return words[index]); // // zero-based\nset (words[index])\
    \ = value;\n}\n\n```\n\nThe get and set accessors. The setter method can throw\
    \ an exception if value was outside a valid range of values.\n\n```\nstatic void\
    \ main() {\nstring s = \"Hello\"; // zero-based\nConsole.WriteLine(s);\nConsole.WriteLine(s);\n\
    s = null; // Writing nothing, or\nConsole.WriteLine(s); // NullReferenceException\n\
    }\n```\n\n# ## Object Initialization\n\nC# Object Initialization Syntax allows\
    \ you to initialize an instance of object or collector. It allows you to assign\
    \ values to fields at the time of creation without using a constructor.\n\n```\n\
    class Person\n{\npublic int Id { get; set; }\npublic string FirstName { get; set;\
    \ }\npublic string LastName { get; set; }\npublic DateTime Birthday { get; set;\
    \ }\n}\n```\n\n```\nPerson p = new Person { Id = 1, FirstName = \"John\", LastName\
    \ = \"Doe\" };\n\n```\n\nIf the class has a constructor that initializes a field,\
    \ the last name must be used.\n\n```\nPerson p = new Person(\"John\") { LastName\
    \ = \"Doe\" };\n\n```\n\nA property is declared like a field but with a get/set\
    \ block. Properties look like fields from the outside but can contain contain\
    \ logic. Between a public field and a public property, no memory is used. Note\
    \ that ~= means means from class.\n\n```\nstatic void main() {\nItem it = new\
    \ Item();\nConsole.WriteLine(it.Price);\nit.Price = 45.99m;\nit.Price += it.Price;\
    \ // += *it.Price;\nit.Price = 100.0m;\nConsole.WriteLine(it.Price);\n}\n```\n\
    \n# ## Properties\n\n```\nclass Item\n{\npublic decimal Price { get; set; }\n\
    public decimal Amount { get; set; }\n}\n```\n\nHere is a property with its backing\
    \ field, that is implemented with auto property with { get; set; }.\n\n```\nclass\
    \ Account\n{\nprivate decimal _amount;\npublic decimal Amount {\nget { return\
    \ _amount; }\nset { _amount = value; } // the keyword value\n}\npublic void Deposit(decimal\
    \ amount) { _amount += amount; }\n}\n```\n\nIndexes provide a way to access elements\
    \ in a class that encapsulates a list or collection. indexer is like an array\
    \ but can be accessed via an index argument rather than a property. An indexer\
    \ can have multiple indexes that allows you to access elements by different index\
    \ types.\n\n# ## Indexers\n\n```\nclass Words\n{\nprivate string[] words;\npublic\
    \ string this[int index] {\nget { return words[index]; }\nset { words[index] =\
    \ value; }\n}\n\n```\n\nThe index argument can be out of range (any type), You\
    \ can use indexers null-indirectionly by using a question mark before the string\
    \ index.\n\n```\nstring[] words = null;\nConsole.WriteLine(words[0]); // NullReferenceException\n\
    To write an indexer, define a property that calls this, using the argument name.\n\
    ```\n\nInheritance is a type of relationship (\"A-B\") between classes where one\
    \ class to inherit members from the other. A “house” is an “of” relationship.\
    \ Inheritance allows for polymorphism in C#. In the example below Animal is at\
    \ the top with an arrow pointing to Animal. Another example of inheritance is\
    \ a Saving Bank Account inherits from Bank Account.\n\n# ## Inheritance\n\n```\n\
    class Base\n{\npublic void Method() { Console.WriteLine(\"Base class\"); }\n}\n\
    class Sub : Base\n{\npublic override void Method() { Console.WriteLine(\"Sub class\"\
    ); }\n}\n```\n\n# ## Constructor\n\nWhen you instantiate a class, base constructors\
    \ are executed first, as seen in lines 2 and 3 of the output. Base constructors\
    \ are not inherited.\n\n```\nclass Base\n{\npublic Base() { Console.WriteLine(\"\
    Base constructor\"); }\n}\nclass Sub : Base\n{\npublic Sub() : base() { Console.WriteLine(\"\
    Sub constructor\"); }\n}\n```\n\n```\nclass Program\n{\n  static void main() {\n\
    \    Sub s = new Sub();\n    s.Amount = 1; // inherited from base\n    Console.WriteLine(s.Amount);\
    \ // Sub 1\n  }\n}\nclass Base\n{\n  public int Amount { get; set; }\n}\nclass\
    \ Sub : Base\n{\n  public string Sub { get; set; }\n}\n```\n\n![](img/1f8cd73ee3d2c31b907cf27a170f2e34_5_0.png)"
