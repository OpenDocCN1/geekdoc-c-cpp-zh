  md: "# # C# Cheat Sheet (1)\n\n# # Abstract Classes\n\n## Object-Oriented Programming\
    \ (OOP)\n-oriented programming (OOP) is a programming paradigm that employs objects\
    \ to encapsulate code. Objects of types are called classes; a class is just a\
    \ template for an object. When we say a class is instantiated, it means an object\
    \ has been created. Each object contains data and code. In C#, an object is an\
    \ instance of a class.\n\nA abstract class cannot be instantiated. Instead, only\
    \ subclasses can be instantiated. Abstract classes define abstract methods, which\
    \ like virtual members, except they don't provide a default implementation. Implementation\
    \ must be provided by subclasses, unless that subclass is also abstract.\n\n#\
    \ ## Sealed Classes\n\nA sealed class cannot be used as the base class for any\
    \ other class. You use the sealed keyword to protect your class from being inherited.\
    \ Static classes are implicitly sealed.\n\n# ## DRY\n\nDRY stands for Don't Repeat\
    \ Yourself. In OOP, encapsulation is used to avoid one or two related distinct\
    \ notions, systems to the combination thereof: (1) a language mechanism for restricting\
    \ direct access to some of an object's components; (2) a language mechanism (or\
    \ other functions) for operating on data. In OOP, the open/closed principle states\
    \ that software entities (classes, functions, etc.) are open for extension, closed\
    \ for modification.\n\n# ## Instance Constructors\n\nFor classes, the compiler\
    \ automatically generates a parameterless constructor if you do not define any\
    \ constructors. The parameterless constructor is not automatically generated,\
    \ so you may need to write it.\n\nWhen an object is destroyed, its memory is freed.\
    \ Memory is freed up by the garbage collector. Finalizers are called with the\
    \ new keyword.\n\n# ## Simple Class Declaration\n\n```\ncsharp\nclass Customer\n\
    {\n    public [protected] int Id\n    [abstract] string Name : IInterfaces inherited\
    \ from object\n}\n```\n\nA class is a data structure that contains data and execute\
    \ code. Each member of a class can contain coordination or the number of possible\
    \ variables is local. A local variable declared inside a function is hidden. On\
    \ the Internet, the Service is a program that provides functionality to clients.\
    \ Note: When you have a class, such as our Customer, and you have a list of objects\
    \ of any type, you should always include a list to map each item.\n\n```\ncsharp\n\
    public class Customer\n{\n    public int Id;\n    public string Name; // in real\
    \ world these are properties\n    public Customer(int id, string name) // (same\
    \ as class name)\n    {\n        this.Id = id;\n        this.Name = name;\n  \
    \  }\n    public int GetCustomerId() => this.Id;\n}\n```\n\n# ## Static\n\nStatic\
    \ methods are meant to be consumed without instantiating them. Static classes\
    \ can be used to group members that are available to the program. A static method\
    \ can access static members as well as the class itself. A static class cannot\
    \ be instantiated. An instance class cannot inherit from a static class. Non-static\
    \ classes can have static members which can only access static members. Static\
    \ members are shared by all instances of the class, and all the instances have\
    \ the same memory location when they access the static method. Static methods\
    \ can access static members but not instance members. Static members also have\
    \ the option to be accessed from outside the class using the dot operator, but\
    \ only if the class member does not use a static prefix.\n\n# ## Methods\n\n```\n\
    csharp\nclass Program\n{\n    public void ShowDetails()\n    {\n        Console.WriteLine(\"\
    Customer ID: \" + Id);\n        Console.WriteLine(\"Name: \" + Name);\n    }\n\
    }\n```\n\nA method is a block of code that is a member of a class. You can execute\
    \ the code from within the method's name. This provides access to the class members.\n\
    \n```\ncsharp\nclass NotFound\n{\n    public void doSomething()\n}\n```\n\nA sequence\
    \ of statements enclosed by curly braces. It may contain local variables (for\
    \ local computations), flow-of-control statements, and other methods known as\
    \ local functions.\n\n# ## Fields\n\nA field belongs to a class. It can be of\
    \ any type, either initialized or pre-defined value. An initializer part of a\
    \ field follows the declaration and consists of an equal sign followed by an expression\
    \ that evaluates to a value. This is evaluated at compile time. If not uninitialized,\
    \ the compiler sets the value of a field to a default value, by the type of the\
    \ field.\n\n```\n[access modifier]\n[static|virtual|new| sealed]\nreturn type\n\
    method name (parameter ) { body }\n```\n\nC# allows for optional parameters which\
    \ either include or omit the new keyword. To specify a parameter\n\nHere is the\
    \ Console output of the above program. Note that the first order Id below is zero\
    \ because the default is zero:\nCustomer ID: 3 Name: Bob\nNumber of orders: 2\n\
    Order ID: 0\nOrder ID: 7\n\nGenerally, you would use fields with properties to\
    \ provide encapsulation."
