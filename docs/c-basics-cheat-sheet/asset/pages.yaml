  md: "# # C# Advanced Cheat Sheet (2 of 4)\n\nbeginning.com\n\n# ## Function and\
    \ Action... continued...\n\n```\npublic class Myclass\n{\n    public int My {\
    \ get; set; }\n    // public delegate void MyMethodHandler(Myclass subclass)\n\
    \    public delegate void MyEventHandler(Myclass sender)\n    public void MethodHandler(Myclass\
    \ subclass)\n    {\n        var myclass = new Myclass(\"In Process method\");\n\
    \        myclass.My = 1;\n        Invoke(myclass); // the methods we want to execute\
    \ here\n        // we are going to define the consumer that\n    }\n```\n\nBelow\
    \ is a list of partial I program showing the changes.\nvar myprocessor = new MyclassProcessor();\
    \ // generics\nAction myAction = myprocessor.mymethods.Add;\n\n# ## Anonymous\
    \ Types\n\nAn anonymous type is a simple class created on the fly to store a set\
    \ of values. To create an anonymous type, you use the new keyword followed by\
    \ an object initializer. The names and types of the properties are inferred by\
    \ the compiler. \n\n```\nvar person = new { Name = \"Bob\", Age = 32 };\nvar person2\
    \ = new { Name = person.Name, Age = person.Age, Number = 123 };\n```\n\nHere is\
    \ another example.\n\n```\nclass Program\n{\n    static void Main(string[] args)\n\
    \    {\n        var person = new { Name = \"John\", Age = 30 };\n        var major\
    \ = \"Computers\";\n        Console.WriteLine(person.Name + \": \" + person.Age);\n\
    \        var person2 = new { Name = person.Name, Age = person.Age, Major = major\
    \ };\n        Console.WriteLine(person2.Name + \": \" + person2.Age + \", \" +\
    \ person2.Major);\n        // John, 30, Computers\n    }\nn}\n```\n\n# ## Lambda\n\
    \nA lambda expression is an unnamed method written in place of a delegate instance.\
    \ A lambda expression is an anonymous method that has no modifier, no return type\
    \ and no return statement. We can well re-factor a lambda expression into a method.\
    \ The example is ->\n\n```\nclass Program\n{\n    delegate int My(int parameter);\
    \ // custom delegate\n    int MyMethod = (x) => x * 2; // lambda expression\n\
    }\n```\n\n# ## static\n\n```\nstatic void Main(string args)\n{\n    MyEventHandler\
    \ EventHandler = (sender, number) => {\n        number += number;\n    };\n  \
    \  EventHandler.AddEventHandler(EventHandler);\n}\n```\n\nHere is another example.\n\
    \n```\nstatic void Add(int number)\n{\n    List<int> squares = new List<int>();\n\
    \    squares.Add(number * number);\n    squares.Add(number * number);\n    squares.Add(number\
    \ * number);\n    squares.Add(number * number);\n    squares.Add(number * number);\n\
    }\n```\n\n# ## int Square(int number)\n\n```\n{\n    return number * number;\n\
    }\n```\n\nHere is another example. Here we have a list of products. We have a\
    \ list of objects. You can filter the list with a series of products.\n\nFindAll()\
    \ takes a predicate. A predicate is a method that returns true or false.\n\n```\n\
    class Product\n{\n    public string Title { get; set; }\n    public int Price\
    \ { get; set; }\n}\n```\n\n# ## class ProductRepository\n\n```\npublic List<Product>\
    \ GetProducts()\n{\n    return new List<Product>\n    {\n        new Product {\
    \ Title = \"Laptop\", Price = 1000 },\n        new Product { Title = \"Phone\"\
    , Price = 500 },\n        new Product { Title = \"Tablet\", Price = 300 }\n  \
    \  };\n}\n```\n\n# ## class Program\n\n```\nstatic void Main(string[] args)\n\
    {\n    var products = new ProductRepository().GetProducts();\n    foreach (var\
    \ product in products.FindAll(p => p.Price > 400))\n    {\n        Console.WriteLine(product.Title);\n\
    \    }\n}\n```\n\n# ## foreach (in products)\n\nYou can use a lambda when argument\
    \ requires a delegate.\n\n# ## Events\n\n+   1. define a delegate (signature)\
    \ or EventHandler\n2. define an event on that delegate [ItemProcessed in class]\n\
    3. raise the event\n\n```\nclass Program\n{\n    public delegate void ItemEventHandler(object\
    \ sender, EventArgs args);\n    public event ItemEventHandler ItemProcessed;\n\
    \n    public void ProcessItem(string item)\n    {\n        // ... logic\n    \
    \    ItemProcessed?.Invoke(this, EventArgs.Empty);\n    }\n}\n```\n\nHere is an\
    \ example program that uses events.\n\n```\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        var processor = new ItemProcessor(); //\
    \ subscriber\n        // ... subscribe\n        processor.ItemProcessed += (sender,\
    \ args) => {\n            Console.WriteLine(\"Item processed\");\n        };\n\
    \        processor.ProcessItem(\"item\");\n    }\n}\n```\n\n# ## class EventHandler\n\
    \n```\npublic class EventHandler\n{\n    public MyEventHandler MyEventHandler\
    \ { get; set; }\n\n    // public delegate void MyEventHandler(object sender, EventArgs\
    \ args);\n    // public event MyEventHandler MyEventHandler;\n\n    public void\
    \ Subscribe(MyEventHandler handler)\n    {\n        if (MyEventHandler == null)\n\
    \            MyEventHandler = handler;\n    }\n```\n\n# ## class ItemProcessor\n\
    \n```\npublic class ItemProcessor\n{\n    public event MyEventHandler ItemProcessed\
    \ { get; set; }\n\n    // public delegate void MyEventHandler(object sender, EventArgs\
    \ args);\n    // public event MyEventHandler ItemProcessed;\n\n    public void\
    \ ProcessItem(string item)\n    {\n        // ... logic\n        ItemProcessed?.Invoke(this,\
    \ EventArgs.Empty);\n    }\n}\n```\n\n# ## class Subscriber\n\n```\npublic class\
    \ Subscriber\n{\n    public void OnItemProcessed(object sender, EventArgs args)\n\
    \    {\n        Console.WriteLine(\"Item processed: \" + args.Message);\n    }\n\
    } \n```\n\nHere is the main program.\n\n```\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        var processor = new ItemProcessor();\n \
    \       var subscriber = new Subscriber();\n        // ... subscribe\n       \
    \ processor.ItemProcessed += subscriber.OnItemProcessed;\n        processor.ProcessItem(\"\
    item\");\n    }\n}\n```\n\n# ## Attributes\n\nAttributes allow you to add metadata\
    \ to code. Attributes use name caps for values with the suffix Attribute. Attribute\
    \ section consists of square brackets around attribute name and parameters list.\
    \ A marker with an attribute can be applied to, decorated, or removed from. We\
    \ use the [Obsolete] attribute to mark the method as obsolete and display a warning\
    \ message\n\n# ## Preprocessor directives\n\nCSharp consists of preprocessor directives\
    \ that are mainly used by the compiler. The directives #if and #endif define a\
    \ section of code that can be expanded or collapsed using the feature of Visual\
    \ Studio and can be nested within each other."
