  md: "# C Basics Sheet (3 of 4)\n\n# Formatting\n\n# Struct\n\nNumbers fall into\
    \ two categories: integer and floating point.\n\nYou can define a custom type\
    \ with the struct keyword. A struct is a value type. Fields can have an initializer\
    \ and inherit without a constructor. The first member must have an initializer.\n\
    \n# DateTime\n\nDateTime is a struct and is therefore a value type.\n\n```\nvar\
    \ now = new DateTime(2000\n```\n\n| Format | Pattern | Value | Description |\n\
    | --- | --- | --- | --- |\n| C c | (0;C21) | $2781.29 | Currency |\n| D s | (0;D57)\
    \ | 1.798E+003 | Must be an integer or floating point |\n| F | (F2;F29) | 2781.29\
    \ | Floating point |\n| G | (0;G28) | 2781.29 | Inerts zeros |\n| N | (0;N4) |\
    \ - | Rounds to nearest percent |\n| R | (0,R85) | 2.89315 | Retains all decimal\
    \ points |\n| X | (X,94) | - | Converts to hex |\n\n```\nstruct Customer {\n \
    \   public string FirstName;\n    public string LastName;\n    public Customer(string\
    \ firstName, string lastName) {\n        FirstName = firstName;\n        LastName\
    \ = lastName;\n    }\n    public string GetFullName() {\n        return FirstName\
    \ + \" \" + LastName;\n    }\n}\nCustomer c1 = new Customer(\"John\", \"Doe\"\
    );\nConsole.WriteLine(c1.GetFullName()); // John Doe\n```\n\n# TimeSpan\n\n+ \
    \  - Creating a TimeSpan represents an interval of time.\n\n```\nvar now = new\
    \ DateTime(2020, 1, 1, 12, 0, 0);\nvar span = new TimeSpan(2, 45, 0); // 2 hours\
    \ and 45 minutes\nvar span2 = new TimeSpan(30); // 30 seconds\nvar future = now.Add(span);\n\
    Console.WriteLine(\"Future: \" + future);\nConsole.WriteLine(\"Future date/time:\
    \ \" + future.ToString(\"yyyy-mm-dd hh:mm:ss\"));\nvar past = now.Subtract(span2);\n\
    Console.WriteLine(\"Past: \" + past);\nConsole.WriteLine(\"Past date/time: \"\
    \ + past.ToString(\"yyyy-mm-dd hh:mm:ss\"));\n```\n\n+   - Adding or subtracting\
    \ a TimeSpan from a DateTime returns a DateTime.\n\n# Enumerated Type\n\nIt can\
    \ be defined directly as a namespace, class, or struct.\n\n```\nenum Day { Sunday,\
    \ Monday, Tuesday, Wednesday, Thursday, Friday, Saturday }\nDay d = Day.Tuesday;\n\
    Console.WriteLine(d); // Tuesday\nConsole.WriteLine((int)d); // 2\nd = (Day)4;\n\
    Console.WriteLine(d); // Thursday\n```\n\n+   - Enumerations are lists of named\
    \ constants.\n\nFor example you could have a list of the days of the week: Monday,\
    \ Tuesday and so on, and without any values. You can use typeof(Day) and typeof.\n\
    \n# Conversions\n\nC# can convert between instances of compatible types. A conversion\
    \ always creates a new value instead of modifying the original. Conversions can\
    \ be implicit or explicit; explicit conversion requires a cast. A useful case\
    \ is when you are converting a value from a User class to another class.\n\n```\n\
    int x = 10;\nlong y = x; // implicit conversion from 32-bit to 64-bit\ndouble\
    \ z = x; // implicit conversion from 32-bit to 64-bit float\nfloat f = (float)z;\
    \ // explicit conversion from 64-bit to 32-bit\nint i = (int)z; // explicit conversion\
    \ from 64-bit to 32-bit\n```\n\nConversions from integral types are implicit,\
    \ unless the conversion must be explicit. Conversions from a floating-point to\
    \ an integer type require an explicit cast; no rounding is performed during conversion.\n\
    \n```\nstring s = \"123\";nint i = int.Parse(s); // conversion from string to\
    \ integer\nint.TryParse(s, out int result); // conversion from string to integer\n\
    Console.WriteLine(result); // 123\n```\n\n+   - Here are some examples of implicit\
    \ and explicit conversion.\n\n```\nvar a = 10;\nvar b = a; // implicit conversion\\\
    var c = (double)a; // explicit conversion\n```\n\nEnumerations can be used as\
    \ lists of lists. For example you could have\n\nIn .NET, every object is a base\
    \ and the existence of the Object class. The available members of an object are\
    \ equals:\n\n```\nfloat f = -128.7;\nobject obj = f; // boxing\nSystem.Int32 d\
    \ = 120; // boxing\nConsole.WriteLine(obj.GetType() + \" is \" + obj); //\n```"
