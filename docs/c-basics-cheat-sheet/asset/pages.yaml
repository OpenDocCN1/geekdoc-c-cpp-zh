  md: "# COOP Cheat Sheet (4 of 4)\n\n# Interfaces & Extensibility\n\nWe create a\
    \ constructor and a dependency. This called\ndependency, which means in the constructor\
    \ we are\nspecifying the dependencies of our. The FileProcessor is\ndependently\
    \ on the ConsoleLogger. It doesn't care\n\n```\npublic class FileProcessor {\n\
    \    public void Log(string message) // method\n        _logger.Log(message);\
    \ // method\n    public FileProcessor(ILogger logger) // constructor\n       \
    \ _logger = logger; // constructor\n    public void Process(string message) //\
    \ method\n        _logger.Log(message); // method\n        Console.WriteLine(message);\
    \ // method\n    public void Save(string message) // method\n        _logger.Log(message);\
    \ // method\n        Console.WriteLine(message); // method\n}\n```\n\n# Interfaces\
    \ & UnitTesting\n\nUsing interfaces with unit testing. This example builds on\n\
    unity in which we'll use the Mock Test Runner. When you\nnew a new entry and passing\
    \ the dependency to the entry post()\nmethod of the JournalPost class. Posting\
    \ the entry services of\nthe interface. To make unit testing easier, we'll use\n\
    a interface for it.\n\n```\npublic void TestTestMethod() {\n    var mock = new\
    \ Mock<IDrEqualEntryChecker>();\n    var post = new JournalPost(mock.Object);\n\
    \    var entry = new JournalEntry { Amount = -120.5m };\n    mock.Setup(x => x.Check(entry)).Returns(true);\n\
    \    post.Post(entry);\n    mock.Verify(x => x.Check(It.IsAny<JournalEntry>()),\
    \ Times.Once);\n}\n```\n\nSince we want to test the JournalPost(), we will rename\
    \ it to\nJournalPosts. Rename testing the method of calling the\nJournalPostTests.\
    \ Add a Reference to our project. In the unit\nproject check the check box of\
    \ the project. If we want to create a fake entry\ncheck checker, we don't want\
    \ to pass the original one to the\nJournalPost, we need a mock that will be fake\
    \ because\nwe are testing out the JournalPost, not the checker.\n\n+   - need\
    \ to add a Reference to our project\n- ExpectedException(typeof(InvalidOperationException))\n\
    - using naming convention: method_condition_exception\n\n```\npublic class JournalPost\
    \ {\n    private IDrEqualEntryChecker _checker;\n    public JournalPost(IDrEqualEntryChecker\
    \ checker) {\n        _checker = checker;\n    }\n    public void Post(JournalEntry\
    \ entry) {\n        if (!_checker.Check(entry)) {\n            throw new InvalidOperationException(\"\
    Already posted!\");\n        }\n        _Balance += entry.Amount;\n        _PostDate\
    \ = DateTime.Now.AddDays(1);\n    }\n}\n```\n\n# ConsoleLogger\n\n```\npublic\
    \ class ConsoleLogger : ILogger {\n    public void Log(string message) {\n   \
    \     Console.WriteLine(message);\n    }\n}\n```\n\n# JournalEntry\n\n```\npublic\
    \ class JournalEntry {\n    public decimal Amount { get; set; }\n    public DateTime\
    \ PostDate { get; set; }\n}\n```\n\nOutput:\n\nPosted:\nDate: 2020-02-07\nAmount:\
    \ -120.50\nCredit amount: 120.50\nBalance: -110.50\n\n# JournalPost\n\n```\npublic\
    \ class JournalPost {\n    private decimal _Balance;\n    private DateTime _PostDate;\n\
    \    private IDrEqualEntryChecker _checker;\n    public JournalPost(IDrEqualEntryChecker\
    \ checker) {\n        _checker = checker;\n    }\n    public void Post(JournalEntry\
    \ entry) {\n        if (!_checker.Check(entry)) {\n            throw new InvalidOperationException(\"\
    Already posted!\");\n        }\n        _Balance += entry.Amount;\n        _PostDate\
    \ = DateTime.Now.AddDays(1);\n    }\n}\n```\n\n> // or we might use the keyword\
    \ in the result to\n_logger.Log(\"Starting at \" + DateTime.Now);\n_logger.Log(\"\
    In middle of doing stuff...\");\n\n\n```\npublic class Program {\n    private\
    \ readonly ILogger _logger;\n    public Program(ILogger logger) {\n        _logger\
    \ = logger;\n    }\n    public static void Main(string[] args) {\n        try\
    \ {\n            var processor = new FileProcessor(new ConsoleLogger());\n   \
    \         processor.Process(\"done program\");\n        } catch (Exception ex)\
    \ {\n            _logger.Log(\"Error: \" + ex.Message);\n        }\n    }\n}\n\
    ```\n\n# Class\n\n```\npublic static void Main(string[] args) {\n    // we send\
    \ our to console\n    var processor = new FileProcessor(new ConsoleLogger());\n\
    \    processor.Process(\"done program\");\n}\n```\n\nOutput:\nStarting at 2020-02-07\
    \ 10:05:43\nIn middle of doing stuff...\n\nError! \ndone program.\n\nWe can extend\
    \ it. We can create more loggers than\nConsoleLogger, such as DatabaseLogger,\
    \ FileLogger,\nEmailLogger and so on, and all we need to change the Main."
