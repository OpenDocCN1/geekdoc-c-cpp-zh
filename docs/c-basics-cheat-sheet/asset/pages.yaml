    \ => w.Length));\nvar s3 = int.Parse(\"53\");\nConsole.WriteLine(s3 + \" + \"\
    \ + s3);\n```\n\n# ## LINQ\n\nLINQ stands for Language Integrated Query and is\
    \ called \"LINQ\"\nis an extension of the .NET Framework and allows you to collect\n\
    data in a larger manner using SQL queries. With\nLINQ you can query data from\
    \ (Objects), collections of\nobases, XML documents (LINQ to XML), and OAD data\
    \ sources using LINQ sets.\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Data;\nclass Program {\n  static void Main(string\
    \ args) {\n    int[] data = {6, 4, 15, 68, 23, 33}; // Data source\n    var numbers\
    \ = data.OrderBy(n => n); // Define & sort the query\n    foreach (var x in numbers)\
    \ // Execute the query\n      Console.WriteLine(x); // output: 4, 6, 15, 23, 33,\
    \ 68\n  }\n}\n```\n\nNow let's use a more example. We'll show you how to do\n\
    without LINQ, when we have a class of objects called\nProduct and we have a ProductRepository.\n\
    \n```\npublic class Product {\n  public string Name { get; set; }\n  public float\
    \ Price { get; set; }\n}\nclass ProductRepository {\n  public IEnumerable<Product>\
    \ GetProducts() {\n    return new List<Product> {\n      // ... add products here\
    \ ...\n    });\n  }\n}\n```\n\nThe LINQ methods can do this. When we select in\n\
    a list of strings, it returns list. If you only want one product\nis Single()\
    \ or SingleOrDefault(). Single() will throw an\nInvalidOperationException if it's\
    \ not found. The OrderOrDefault()\nreturns the first match, which is much better.\n\
    \n```\nvar products = new ProductRepository().GetProducts();\nvar product = products.FirstOrDefault(p\
    \ => p.Price > 10); // returns first match\nConsole.WriteLine(product == null);\
    \ // returns false\nConsole.WriteLine(product.Name); // returns \"Product Name\"\
    \n```\n\nThere are many ways to filter data. Where do you find them?\nnSee the\
    \ LINQ comments below. If you only want one product\nis Single() or SingleOrDefault().\
    \ Single() will throw an\nInvalidOperationException if it's not found. The OrderOrDefault()\n\
    returns the first match, which is much better.\n\n# ## Nullable Types\n\nNullable\
    \ references represent a reference type with a null\nvalue. Normal value types\
    \ cannot be null, so to represent\na null type you must use a special construct\
    \ called a nullable\ntype which is denoted with a value type followed by a?\n\
    It is important to use nullable types when you have a\n\n# ## Dynamics\n\nProgramming\
