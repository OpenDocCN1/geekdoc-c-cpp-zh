  md: '# CSharp Basics Cheat Sheet 2 (of 4)


    Escape Sequences

    Escape sequences work with strings and characters, for verbatim strings, which
    are created by the @ symbol.


    The @ (verbatim literal) lets you specify any character by its four-digit hex
    code.


    | Character | Value | Overloaded |

    | --- | --- | --- |

    | \ | 0x0027 | |

    | \" | 0x0022 | |

    | \\ | 0x005c | |

    | \a | 0x0007 | |

    | \b | 0x0008 | |

    | \t | 0x0009 | |

    | \f | 0x000c | |

    | \n | 0x000a | |

    | \r | 0x000d | |

    | \t | 0x0009 | |

    | \? | 0x003f |


    Verbatim literal is a string literal prefixed with @ and does not support escapes.


    ```

    string path = @"C:\temp\";

    Console.WriteLine(path);

    ```


    Constants

    A constant is much like a local variable, but once it is initialized, its value
    cannot be changed. The keyword const is part of the modifier but not the declaration
    and must be placed immediately before the declaration. A constant is a static
    field whose value cannot be changed at runtime. The compiler and linker will substitute
    its value wherever used (rather like a macro in C++).


    ```

    const int number = 5;

    ```


    Expressions

    An expression evaluates to a value. Simple expressions (such as 45) and variables
    (such as x) can be evaluated and combined with operators.


    Operators

    Operators are used on values and can be classified as unary, binary, or ternary,
    depending on the number of operands they work on. The first group contains unary
    operators which work on one operand (the modulus operator (%) is used to get the
    remainder). The second group contains assignment operators. Most importantly,
    the assignment operators allow you to assign values to variables. The comparison
    operators compare two values and return true or false.


    The logical operators are used to evaluate bool expressions. The logical operator
    (&&) is used to evaluate if both left and right side are true, and it will return
    a boolean result. A factor is used to group expressions together.


    if left or right side is true. The logical operator (||) is used to evaluate if
    either left or right side is true, and it returns a boolean result. A factor is
    group expressions. The ternary operator (?:) is used to evaluate a conditional
    expression.


    Note: & and || are conditional versions of && and ||. The x && y and x || y expressions
    are short-circuiting: if the left operand is false or true, the right-hand operand
    is evaluated conditionally depending on the value of the left-hand operand. The
    ?? operator is not short-circuiting.


    The Using Directive

    To access from another namespace, you need to specify its library, the fully name
    must be qualified by including the namespace with a using directive. A using directive
    allows you to include all directives before the code in the file.


    StringBuilder

    System.Text.StringBuilder

    There are three Constructors:

    StringBuilder sb = new StringBuilder();

    StringBuilder sb = new StringBuilder("string");

    StringBuilder sb = new StringBuilder(string.Length);

    StringBuilder sb = new StringBuilder(string, string.Capacity);


    The StringBuilder is mutable, meaning once you create an object you can change
    its content. If you have a lot of string manipulations to perform, you need to
    use StringBuilder instead of string. StringBuilder provides many methods for manipulating
    strings such as Append(string), Insert(int, string), Remove(int, int), and Clear().
    StringBuilder needs System.Text.


    you can combine these strings together because of the this method


    ```

    var sb = new StringBuilder();

    sb.Append("Hello!");

    sb.Replace("Hello", "World");

    sb.Insert(0, "new string ");

    sb.Remove(0, 5);

    Console.WriteLine(sb.ToString());

    ```


    Arrays

    An array is a collection of elements of the same type. Any array uses square brackets
    the element type. Arrays also index the index, starting at zero, not.


    ```

    int[] myArray = {1, 2, 3}; // array with 3 rows and 1 column

    int[][] multiArray = {{1, 2, 3}, {4, 5, 6}}; // array with 2 rows and 3 columns

    char[][] charArray = {"a", "b", "c"}; // array with 3 rows and 1 column

    string[] strArray = {"one", "two", "three", "four"}; // array with 4 rows and
    1 column

    Console.WriteLine(myArray[0][0]); // prints 1

    myArray[0][0] = 10;

    ```


    An array element is an array of objects, regardless of the type of element. For
    reference types, the square brackets are used for the reference type. For value
    types, the square brackets are used for the value type.


    Jagged & Regular Arrays

    Jagged arrays are sets of arrays. Each array is separated by a jagged bracket.
    Jagged arrays are arrays of arrays of different lengths. We use square brackets
    for jagged arrays.


    ```

    // // a jagged array with 3 rows

    int[][] jaggedArray = {{1, 2, 3}, {4, 5}, {6, 7, 8, 9}};

    jaggedArray[0][0] = 10; // prints 10

    jaggedArray[1][1] = 20; // prints 20

    jaggedArray[2][3] = 30; // prints 30

    ```


    ```

    // foreach string in b

    string[] b = {"a", "b", "c"};

    foreach (string s in b)

    {

    Console.Write(s);

    }

    ```


    ```

    // foreach string in g

    string[] g = {"one", "two", "three"};

    foreach (string s in g)

    {

    Console.Write(s);

    }

    ```'
