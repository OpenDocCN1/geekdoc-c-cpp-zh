  md: "# C# Advanced Cheat Sheet (1/4)\n\n```\n// mix fields with a property just\
    \ for demonstration\npublic int x;\npublic string Name = \";\npublic Status Status\
    \ { get; set; }\n```\n\n# Generics\n\nC# has two mechanisms for writing code that\
    \ is reusable across different types: inheritance and generics. Whereas inheritance\
    \ expresses reusability with a base class, generics expresses reusability with\
    \ a template that contains \"placeholders\".\n\nOur code has three methods in\
    \ the class above. They are Add(),,(), and AppendString().\n\n```\nusing System.Collections.Generic;\n\
    public class List<T> {\n```\n\n```\n  public int Id { get; set; }\n  public string\
    \ Name { get; set; }\n```\n\n```\n// Using object initialization syntax\nvar customer\
    \ = new Customer { Name = \"Alice\", Status = Status.Active };\n```\n\n```\npublic\
    \ static void Main(string[] args) {\n```\n\n```\n  List<Customer> customers =\
    \ new List<Customer>();\n  customers.Add(new Customer { Name = \"Alice\", Status\
    \ = Status.Active });\n  customers.Add(new Customer { Name = \"Bob\", Status =\
    \ Status.Inactive });\n  foreach (var customer in customers) {\n    Console.WriteLine(customer.Name\
    \ + \" : \" + customer.Status);\n  }\n}\n```\n\n# Delegates\n\nA delegate is a\
    \ type that \"holds\" other methods. A delegate is a reference to a function or\
    \ list of methods that match a specific signature. When you execute a delegate\
    \ it will execute the user-defined reference type. You can create your own delegate\
    \ type, or use the generics: Func<T> and Action<T>. Here we'll create one.\n\n\
    ```\npublic delegate void MyDelegate(string message);\n```\n\n```\nstatic void\
    \ MyMethod(string message) {\n  Console.WriteLine(message);\n}\n```\n\n```\nMyDelegate\
    \ del = MyMethod;\ndel.Invoke(\"Hello!\");\n```\n\n# Lists\n\nLists were created\
    \ before in the basic section of this sheet, but the examples were only lists\
    \ of integers. Now we have a list of objects based on our own class structure.\n\
    \n# Class Customer\n\n```\npublic class Customer {\n  public int Id { get; set;\
    \ }\n  public string Name { get; set; }\n  public Status Status { get; set; }\n\
    }\n```\n\n# Class Repository\n\n```\npublic class Repository {\n  private List<Customer>\
    \ _customers = new List<Customer>();\n  public void AddCustomer(Customer customer)\
    \ {\n    _customers.Add(customer);\n  }\n  public List<Customer> GetCustomers()\
    \ {\n    return _customers;\n  }\n  public int GetCount() {\n    return _customers.Count;\n\
    \  }\n}\n```\n\n```\npublic static void Main(string[] args) {\n  Repository repo\
    \ = new Repository();\n  repo.AddCustomer(new Customer { Id = 1, Name = \"Alice\"\
    , Status = Status.Active });\n  repo.AddCustomer(new Customer { Id = 2, Name =\
    \ \"Bob\", Status = Status.Inactive });\n  Console.WriteLine(\"Total customers:\
    \ \" + repo.GetCount());\n}\n```\n\nHere is another example of a list of objects,\
    \ without Repository.\n\n# Class Program\n\n```\npublic class Program {\n  public\
    \ static void Main(string[] args) {\n    List<Customer> customers = new List<Customer>();\n\
    \    customers.Add(new Customer { Id = 1, Name = \"Alice\", Status = Status.Active\
    \ });\n    customers.Add(new Customer { Id = 2, Name = \"Bob\", Status = Status.Inactive\
    \ });\n    foreach (var customer in customers) {\n      Console.WriteLine(customer.Name\
    \ + \" : \" + customer.Status);\n    }\n    Console.WriteLine(\"Total customers:\
    \ \" + customers.Count);\n  }\n}\n```\n\nHere is a realistic example of a delegate.\
    \ Here we create a multicast delegate. The one we use is in the main method. We\
    \ have an object that needs to \"process\" with several methods in it, and we\
    \ also want to be able to add or remove methods from the list of them.\n\n# Class\
    \ Processor\n\n```\npublic class Processor {\n  public event Action<string> MessageReceived;\n\
    \  public void Process(string message) {\n    MessageReceived?.Invoke(message);\n\
    \  }\n}\n```\n\n```\npublic static void Main(string[] args) {\n  Processor processor\
    \ = new Processor();\n  processor.MessageReceived += Method1;\n  processor.MessageReceived\
    \ += Method2;\n  processor.Process(\"First message!\");\n  processor.MessageReceived\
    \ -= Method1;\n  processor.Process(\"Second message!\");\n}\n\nstatic void Method1(string\
    \ message) {\n  Console.WriteLine(\"Method 1: \" + message);\n}\nstatic void Method2(string\
    \ message) {\n  Console.WriteLine(\"Method 2: \" + message);\n}\n```\n\n# Func\
    \ and Action\n\nIn .NET we have delegates that are Action and Func. They are non-generic.\
    \ Forming them allows us to use Action and introduce a new processor which will\
    \ call MyDelegateProcessor() and remove our custom delegate in there adding Action.\
    \ Also in the main() program we want to change the line and the first line of\
    \ code."
