    # 4.4 Stoppable bandit processes


    Condition D is admittedly a strong condition. Indeed, one might say that restricts
    attention to the most interesting case of a SFAS because the choice of control
    u in $\Omega_t(x_t)$ becomes irrelevant. However, it is interesting that Condition
    D is sufficient for Theorem 4.3 and something stronger is not required. Furthermore,
    we can describe at least one interesting model for which Condition D is guaranteed
    to hold.


    The term controllable bandit process was coined by Glazebrook (1979) to describe
    the process obtained by adding to the control of a bandit process a stop control,
    which allows the process to behave as a standard bandit process with a parameter
    $\mu(x)$ depending on the state x. Strictly speaking this is a superprocess rather
    than a process. If control 2 is selected, the state of the stoppable bandit process,
    and the state of any SFAS to which it belongs, does not change, so we can, as
    usual with a standard bandit process, ignore the possibility of switching from
    the use of control 2. Thus to use control 2 has the same effect as terminating
    the decision process with a final reward of $\gamma^{-1}\mu(x)$, and this is why
    it is called the stop control.


    A SFAS made up of stoppable bandit processes might be a suitable model for an
    industrial research project in which there are several possible approaches, each
    represented by one of the bandit processes. Using the stop control corresponds
    to searching and exploiting the knowhow gained by one of the approaches.


    A stoppable bandit process be said to have an improving stopping option if $\mu(x(t))$
