  md: "The problem of developing optimal policies for job scheduling or a family of\
    \ alternative bandit processes with switching penalties is a famously intractable\
    \ one which several important contributions have been made. For example, Glazbrook\
    \ (1990b), Agrawal, Hedge and Tenekesis (1988), Oyen and Tenekesis (1994), Banks\
    \ and Sundaram), Le Ny and Feron (2006) use linear programming relaxation for\
    \ the restless bandits with discounted rewards and with additional costs penalizing\
    \ switching between projects. Similarly, Guha and Munagal (2009) examine a multi-armed\
    \ bandit problem in which pulling an arm in state x incurs an operating cost c(x),\
    \ and a switch from pulling an arm in state x to state y costs l(x, y). They consider\
    \ the finite-horizon utilization problem, in which the aim is to maximize the\
    \ reward obtained at the T pull, subject to constraints on the total operating\
    \ and switching costs incurred during the previous pulls. It is a problem that\
    \ addresses problems in robot navigation, sensor networks and labour economics.\
    \ Using Lagrangian relaxation, they construct a polynomial-time computable policy\
    \ that achieves a reward of at least $\frac{1}{4}$-ε times achieved by an optimal\
    \ policy.\n\nThe paper of Jun (2004) provides a good survey of research on bandit\
    \ problems with switching costs.\n\n# 9.6 Military applications\n\nMilitary logistics\
    \ has a fruitful field for the application of index policies. Problem domains\
    \ already mentioned in the text which provide models and analyses of relevance\
    \ to military applications include the optimal exploration of Model 6 in Chapter\
    \ 1, the discrete search models of Chapter 3, and the work on sensor management\
    \ mentioned in Chapter 6 in relation to restless bandits. In this we shall briefly\
    \ describe two further problems.\n\nFirst, Glazbrook and Washburn (2004), in their\
    \ review of so-called-Shoot-Look-Shoot models, argue that the advent of modern\
    \ long-range, accurate, but very expensive weapons has lent importance to analyses\
    \ of shooting at targets which make good use of the information gathered on status\
    \ in the process. They describe and discuss the importance of multi-armed bandit\
    \ models in this context. They cite the work of Mann and Cress (1997), who considering\
    \ a problem in which target j has probability $p_j$ of being killed by a single\
    \ shot. If the target is killed, fact is confirmed with probability $q_j$. Otherwise\
    \ there is no feedback regarding the outcome of the shots. The goal is to kill\
    \ as many targets as possible with a fixed number of shots. This latter condition\
    \ technically places the models outside of the infinite-horizon class with which\
    \ we have primarily concerned. However, the status of one-step-ahead or myopic\
    \ rules in this domain renders the horizon irrelevant. A proof is given that the\
    \ myopic policy of shooting at the target which offers the largest immediate gain\
    \ is optimal. The authors the relevance of such models to the operation of weapon\
    \ systems such as fibre-optic guided missiles. A manifest disadvantage of a myopic\
    \ policy is its likely need to switch targets frequently."
