  md: '# 9.3 Economics


    Economists have been attracted to the multi-armed bandit problem, especially as
    it allows them to model the trade-off of exploration and exploitation (two commonly
    used terms in the economics field); see for example March (1991), or Levinthal
    and Posen (2011). We note in passing that this terminology to describe the tension
    between a long-term and a short-term perspective was coined by Gittens and Jates
    (1974b).


    Bergemann and Välmäki (2008) have written a survey paper on bandit problems which
    is given in its coverage of applications in economics. They give an economic interpretation
    of the prevailing charges proof of the index them (see Section 2.5) by imagining
    that arms are owned by agents who rent out in a competitive market of operators,
    using a descending price auction. Agents manage their rental income (the prevailing
    changes they obtain) when the operators obtain best use of arms by operating to
    maximize the payoff.


    One particularly line of research is concerned with so-called mechanism design.
    Suppose that each of n arms has an owner, and the state of each arm is known only
    to its owner. Any reward that is obtained from an arm is kept by its owner. At
    each step, each owner makes a claim about his arm''s Gittens index. If these claims
    were truthful then the Gins policy would maximize reward. However, the owners
    are self-interested and might find advantageous to lie. The aim of a social planner
    is to implement some scheme that incentivizes owners to truthfully report the
    state of their arms. For, if the private information about each arm corresponds
    to the length of a job, then owners of jobs might be required to make payments
    on the processing which are coined they declare. The order in which jobs are processed
    can also be made to depend on the declarations. Cavallo, Parkes and Singh (2006)
    have explored this type of problem and described an incentive-compatible mechanism
    for eliciting state information. They use Gittens indices, and distribute computation
    of the optimal policy among agents.


    Along similar lines, Cavallo (2008) discusses a problem in which, during each
    week of t=0,1,..., a mobile clinic is to be allocated one of n neighbourhoods
    within a city. Neighborhood leaders make claims about the value they place on
    being allocated the clinic. The state of neighbourhood i might encapsulate information
    about the value which the neighbourhood leader places on being allocated the clinic.
    When the clinic changes—perhaps a significant number of needs are not met, or
    the local population now knows more about the clinic. If a neighbourhood is not
    allocated the clinic then its state may also change—perhaps because more people
    are now waiting to be treated. The government would like to allocate the clinic
    so that it does the most good. This poses a problem that is similar to that of
    restless bandits \u201 except that the state of each bandit is private information
    of that bandit, who must be incentivized to reveal it.'
