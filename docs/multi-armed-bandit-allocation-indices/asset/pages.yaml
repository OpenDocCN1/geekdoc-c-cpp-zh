    \ process, the range of possible index values is from 0 to 1, and it is convenient\
    \ to calibrate in terms of a standard target process for which the probability\
    \ $\\phi$ of reaching the target at each trial is known. For target processes\
    \ our discussion will focus largely on the undiscounteded case (i.e. $a=1$ or\
    \ $\\gamma=0$). The recurrence corresponding to (7.10) is\n\n```\n$M(\\phi, \\\
    pi, T) = \\min\\left[\\phi^{-1}, 1+\\int_{-\\infty}^T M(\\phi, \\pi, T)f(x|\\\
    pi)d\\mu_1(x)\\right] \\quad (7.11)$\n```\n\nwhere $M(\\phi, \\pi, T)$ is the\
    \ expected number of values to be sampled under an optimal policy to reach the\
    \ target $T$, given two target processes, one in state $\\pi$ and the other target\
    \ process with success probability $\\phi$.\n\nThe direct approach involves maximizing\
    \ with respect to a stopping set defined on an infinite state space. A complete\
