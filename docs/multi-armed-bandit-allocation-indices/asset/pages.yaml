    # 4.9.2 Klimov’s model


    Klimov’s model (1974) is a tax model that is concerned with the optimal dynamic
    scheduling of a single server in a multi-class M/G/1 queue with general Bonnoldi
    feedback of jobs and linear holding costs. It is a model for the scheduling that
    arrives in a time-sharing system. A single server is to be allocated to serve
    jobs, which fall into J classes (or buffers). Newly arriving jobs in class i are
    identical. When a job in class completes service it is probabilistically fed back
    as a class j with probability $p_{ij}$, or it leaves the system with probability
    $p_{io}$, where $p_{io} = 1 - \sum_{j=1}^J p_{ij}$. Jobs in class i arrive according
    to a Poisson process rate $\lambda_i$. They have independent service times, with
    mean $1/mu_i$. When a class i is in the system it incurs holding cost at a rate
    $c_i$. Stability is ensured by the condition $\lambda_is_i < 1$, where $s_i$ denotes
    the total amount of service required by an entering class i before it leaves the
    system. The aim is to find a non-preemptive scheduling strategy that minimizes
    the linear holding cost function. For more information about the problem, its
    history and solution see the nice encyclopaedia article by Niño-Mora (201a).


    The Klimov model fits the set of job-linked arrivals, as is a special case in,
    when a class i job completes having been served for time $\sigma$, the random
    batch of new arrivals is set consisting of a single class j (unless the job j
    leaves the system), a Poisson-distributed number of arrivals in each class k,
    having mean $\lambda_k\sigma$.


    By the arguments we have made in the previous section, the Klimov model has a
    solution in a priority policy determined by Gittins indices. We may consider a
    discounted version of the problem and seek to minimize the expected sum of holding
    costs over the infinite horizon. As described in the previous section, this is
    equivalent to a problem in which we seek to maximize an expected sum of rewards,
    where a reward $\gamma^{-1}c_i$ accrues whenever a class i job completes service,
    and a reward of $-\gamma^{-1}c_i$ (actually a cost) accrues whenever a class i
    job arrives or is created by feedback. An equivalent problem is one in which reward
    of $r_i = \gamma^{-1} \sum_j p_{ij}(c_i - c_j)$ accrues whenever a class i job
    completes service and no costs or rewards accrue because of job arrivals.'
