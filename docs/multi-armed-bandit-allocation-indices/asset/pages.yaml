    in the system n. While the Whittle index policy for the N-class problem is not
    optimal, all the evidence we have is that it performs very strongly, even when
    there is just a single server.


    Glazbrook, Lumley and Ansell (2003) extend this analysis to the more complex case
    in service times follows a general distribution and policies are non-preemptive.
    For that case the simplest form for the Whittle index for average costs is


    ```

    W(n) = \frac{E[c(n+X) - c(n-1+X)]}{E(S)}

