    # 4.3 The index theorem for superprocesses


    Mirroring our definition of an index policy for a FABP in Section 2.5, we show
    that a policy is an index policy with respect to μ₁, μ₂, ..., μn if at any decision
    time the superprocess S_k is selected for continuation, with control u, is such
    that μ_k(x, u) = max_{j∈Ω(x)} μ_j(x_j, u). Assuming Condition D, we can provide
    an index theorem.


    **Theorem 4.3 Index theorem for a SFAS** policy for a simple family of alternative
    superprocesses S₁, ..., Sn, which all satisfy Condition D, is optimal if it is
    an index policy with respect to v(S₁, ..., ..., v(S_n)).


    As in Section 2.8, we shall make use of the fact that a simple family of alternative
    semi-Markov superprocesses is equivalent to a discrete-time Markov decision process
    with stochastic discounting. The decision times are 0, 1, 2, ... When a superprocess
    is continued it makes an unsuccessful transition with a probability of 1 − α²,
    where T is the time until the next decision time in the equivalent semi-Markov
    process. In the special case that the superprocesses die, we shall say that S
    makes an unsuccessful transition. The objective in our problem is to maximize
    the expected (undiscounted) reward earned from a SFAS before the first constituent
    superprocess. We generalize the proof in Section 2.8 as follows.


    *Proof.* We start with a proof for a family of n = 2 superprocesses, S1 and S2.
    Suppose that they are initially in state x1(0) and x2(0). Given that Condition
    D holds, gi(xi) be the optimal continuation for Si when it is selected and is
    in state xi. We consider a class of policies, ₖ, in which the policy must follow
    at decision times k, k+1, ... That is, we compute for each superprocess i its
    fair stake, μᵢ(xi), and then continue from time k the superprocess i having the
    greatest fair stake, applying the control gi(xi). Extending the terminology introduced
    in Section 2.5 to apply to superprocesses, the fair stake, μᵢ(xi), is the maximum
    amount we would be willing to sacrifice if Si continue it, until either it dies
    or we choose to stop collecting its rewards.'
