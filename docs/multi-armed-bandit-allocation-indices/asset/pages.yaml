    # 2.10 Calculation of Gittins indices


    Many authors have described algorithms for computing Gittins indices for a bandit
    process with a finite state space. Beale (1979) proposed an algorithm based on
    policy improvement. The algorithm of Varaiya, Walrand, and Buyukkok (1985) considers
    indices in increasing order of their magnitudes. This is essentially the same
    as the algorithm that we have described in Section 2.9. In essence, it is also
    identical to the adaptive greedy algorithm that we present in Section 5.3.


    The algorithm proposed by Sonin (2008) has the same spirit, in however, he finds
    indices in increasing order of their magnitudes. He directly considers the stopping
    problem posed by $v(B,x)=v(B,x)$, and grows a continuation set of states of smaller
    Gittins indices are identified and added to this set. Sonin includes in his algorithm
    the idea of a state-dependent discount factor (cf. the work of Nash described
    in Section 3.5.1).


    Chen and Kateakis (1986) obtain the Gittins indices from a sequence of linear
    programs. Kallenberg (1986) shows that improved efficiency can be obtained using
    parametric linear programming. The parameter concerned is essentially the parameter
    $\lambda$ of a standard bandit process that is being used for calibration, in
    Whittle''s language, the size of a retirement option (see Section 4.3). All the
    above algorithms compute the Gittins indices for a bandit process having N states
    in time $O(N^3)$. Niño-Mora (2007) has found an algorithm with the smallest leading
    cost, with running time of $\frac{1}{2}N^3+O(N^2)$. He also approaches the calculation
    through parametric linear programming, and uses special structure of the parametric
    simplex tableaux to reduce the computational effort of pivot steps.'
