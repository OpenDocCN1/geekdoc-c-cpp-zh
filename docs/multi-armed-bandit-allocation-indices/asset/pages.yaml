  md: "# 7\n\n# Multi-population random sampling (theory)\n\n# 7.1 Introduction\n\n\
    An arm of the multi-armed bandit problem described as Problem 5 in Chapter 1 generates\
    \ a sequence $X_1, X_2, \\dots$ of independent and identically distributed random\
    \ variables taking the values 0 and 1 with probabilities $\theta$ and $1-\theta$.\
    \ The reward associated with the value $X$ is $a^{t-1}X$ if this is the outcome\
    \ on the $th$ pull, counting pulls on every arm. This is one of the problems discussed\
    \ in the present chapter, which is characterized by bandit processes defined by\
    \ sequences of independent identically distributed random variables $X_1, X_2,\
    \ \\dots$. When in the multi-armed bandit, these random variables themselves constitute\
    \ a sequence of rewards, the resulting bandit process will be termed a reward\
    \ process. Any function of the $X_t$ may also be taken to define a sequence of\
    \ rewards, and a bandit process. All bandit processes defined in this way will\
    \ be termed sampling processes. The bandit sampling processes defined by the function\
    \ which takes the value 1 for the first $X_i$ to be sampled with a value $\\ge\
    \ T$, and 0 for all other $X_i$, will particular be investigated. In the following\
    \ section it will be shown that a family of alternative bandit processes (in this\
    \ chapter we shall be concerned with only simple families) of this type serves\
    \ as a model for the situation where a number of populations are sampled sequentially\
    \ with the aim of identifying as rapidly as possible an individual that achieves\
    \ a target level $T$ on some scale of interest. This type of bandit process will\
    \ thus be termed a target process."
