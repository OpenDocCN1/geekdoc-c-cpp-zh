    origin. The results of these calculations are also described for each case except
    the Bernoulli/exponential target process, for which some results are given by
    Jones (1975). Two approximations which prove useful are given in Section 8.7.


    Tables are given at the back of the book. They seem likely to be accurate within
    1 or 2 in the last digit tabulated. Jones also gives results for the normal target
    process, both with known variance (1970) and with unknown variance (1975).


