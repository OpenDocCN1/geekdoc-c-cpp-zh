    One can also see that the above as the total expected discounted reward in a trivial
    bandit problem in which $r_i = 1$ for all $i$.


    To find another constraint let us pick some subset of states $S, S \subset E$,
    and consider a new bandit problem in which one is trying to minimize an expected
    discounted sum of costs over the infinite horizon. Continuing a bandit in state
    $i \neq S$ costs nothing. But if one chooses a bandit with state $i \in S$ then
    an immediate strictly positive cost, $A_i^S$, must be paid, which we set equal
    to the expected discounted number of steps that would be required to return this
    bandit''s state within $S$. Let $T_i^S$ be a random variable with the distribution
    of this number of steps.


    ```

    $A_i^S = E(1 + a + \dots + a^{T_i^S-1}). (5.3)

    ```


    We now have a problem in which $r_i$ has been replaced with $-A_i^S$ for $i \in
    S$ and by 0 otherwise. We wish to minimize $\sum_{i \in S} A_i^S$. This is a nearly
    trivial bandit problem. One can easily prove that a policy is optimal for this
    bandit problem if it always gives preference to bandits whose states are not in
    $S$. We have to show that such a policy has a value function that satisfies the
    relevant dynamic programming equation. This is easy to check, with the fact that
    the value function for such a policy is


    ```

    $V^S(k) = \frac{1}{1-a} \prod_{i;k \neq S} E(a^{T_i^k}).

    ```


    A key fact is that the states of all bandits are in $S$ it does not matter which
    bandit we continue. The dynamic programming equation is solved by $V^S(k) = 1/(1-a)$
    such that the states of all bandits are in $S$.

    Let us define $b(S) = V^S(k)$. By the solution we have identified to our nearly
    trivial multi-armed bandit problem we have established the validity of constraints
    of the form


    ```

    $\sum_{i \in S} A_i^S x_i^k \ge b(S), \quad S \subseteq E. (5.4)

    ```


    It is consistent with all the above definitions to take $A_i^E = 1 (1 \le i \le
    N)$, and $b(E) = 1/(1-a)$. Then (5.2) becomes (5.6) and we have proved the following
    lemma.


    **Lemma 5.1** There exist $A_i^S (i \in S \subseteq E)$, having the interpretation
    (5.3), that for any scheduling policy $\pi$,


    ```

    $\sum_{i \in S} A_i^S x_i^\pi \ge b(S), \quad for all S \subseteq E. (5.5)

    ```


    ```

    $\sum_{i \in E} A_i^E x_i^\pi = b(E), (5.6)

    ```


    and such that equality holds in (5.5) if $\pi$ is a policy that gives priority
    to bandits whose states are not in $S$ over any bandits whose states are in $S$.'
