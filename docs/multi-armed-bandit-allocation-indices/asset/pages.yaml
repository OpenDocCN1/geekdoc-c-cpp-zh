  md: '# MULTI-ARMED BANDIT ALLOCATION INDICES


    The point of this observation is that our indices do not simply tell us alternative
    to choose at a given stage in a particular problem with $n$ alternatives. Rather,
    specify the optimal policy for a problem with any set of alternatives of a given
    type. This means that if we know such an index exists for a given class of problems,
    with as yet no explicit expression for it, then it is sufficient, in order to
    find an explicit expression, to consider problems within the class for which $n=2$,
    and even this restricted class of problems need not be solved in full generality,
    as our next example shows.


    Problem 4 Industrial research

    The manager of a team of industrial scientists has $n$ research projects which
    may be carried out in any order. Switches from project to project carry negligible
    loss of time, whether these one project has been successfully completed or not.
    The value to the manager''s employer of completing project $i$ at time $t$ is
    $V_ie^{-\gamma t}$ ($\gamma > 0$). The time we would need to spend on project
    $i$ in order to complete it is a random variable $\sigma_i$, which has distribution
    $F_i(t)$ and density $f_i(t)$. What policy should the manager follow in order
    to maximize the expected value generated by the $n$ projects?


    Following standard usage, a switch from one project to another project is called
    a preemption. We say that we have the preemptive case if preemption is allowed
    at any time, even if project that is currently receiving effort has not yet been
    completed. We say that we have the non-preemptive case if a project, once started,
    must continue to receive effort until it has been completed. In the non-preemptive
    case, the optimal schedule can be found with an interchange argument, as in Problem
    1. Suppose that projects 1 and 2 are the first two projects processed. The expected
    value obtained from these projects when 1 is processed before 2 is at least as
    great as when their order of processing is reversed if


    > $E[V_1e^{-\gamma\sigma_1} + V_2e^{-\gamma(\sigma_1+\sigma_2)}] \geq E[V_2e^{-\gamma\sigma_2}
    + V_1e^{-\gamma(\sigma_1+\sigma_2)}].$


    which is equivalent to


    $\frac{V_1Ee^{-\gamma\sigma_1}}{E(1-e^{-\gamma\sigma_1})} \geq \frac{V_2Ee^{-\gamma\sigma_2}}{E(1-e^{-\gamma\sigma_2})}$


    We may conclude that the expected total value from the $n$ projects is maximized
    by processing them in decreasing order of indices defined as


    $\mu_i = \frac{V_iEe^{-\gamma\sigma_i}}{E(1-e^{-\gamma\sigma_i})}$


    We can make a connection with Problem 1. Suppose that under a given order of processing,
    project $i$ completes at time $t_i$. Then the expected total value obtained from
    the projects can be written as


    ```

    $E \sum_i V_ie^{-\gamma t_i} = \sum_i (V_i - \gamma E \sum_i V_{it_i} + o(\gamma)).$

    ```'
