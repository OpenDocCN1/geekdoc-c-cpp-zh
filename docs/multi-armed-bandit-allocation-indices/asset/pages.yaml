  md: '# INTRODUCTION AND EXPLORATION


    **Problem Search** (see also Section 3.5.4 and exercise 3.6)

    A stationary object is hidden in one of $n$ boxes. The probability that a search
    of box i finds the object if it is in box i is $q_i$. The probability that the
    object is in box i is $p_i$, and by Bayes'' theorem successive boxes are searched.
    The cost of a single search of box i is $c_i$. How should the boxes be sequenced
    for search so as to minimize the expected cost of finding the object?


    For Problem 1 an optimal schedule is one which processes the jobs in decreasing
    order of $c_i/s_i$, as may be shown by the following simple interchange argument.
    If jobs 1 and 2 are processed as the first and second, respectively, then the
    total cost due to these two jobs is $c_1s_1 + c_2(s_1 + s_2)$. If processing of
    jobs 1 and 2 is inter, this quantity becomes $c_2s_2 + c_1(s_2 + s_1)$. The holding
    cost due to the other is unchanged. The first order has the smallest cost if and
    only if $c_1/s_1 \geq c_2/s_2$. It follows that the relationship $c_i/s_i \geq
    c_j/s_j$ must hold for any $i$ and $j$ such that $i$ immediately precedes $j$
    in an optimal processing order of the jobs. This implies that the total cost is
    maximized by processing the $n$ jobs in decreasing order of indices which are
    defined as $\mu_i = c_i/s_i$.


    For Problem 2, an optimal policy is one, when $x_i$ is the amount of gold remaining
    in mine $i$ on a particular day, allocates the machine to a mine $j$ such that


    ```

    \frac{p_iq_j}{1-p_i} = \max \frac{p_jq_i}{1-p_j}$$

    ```


    For Problem 3, if box $j$ is searched next under an optimal policy, then


    ```

    \frac{p_iq_j}{c_j} = \max \frac{p_jq_i}{c_i}$

    ```


    For Problems 2 and 3, a policy is specified by a sequence of numbers corresponding
    to the order of the mines to which the machine is allocated until it breaks down,
    or the order in which the boxes are searched until the object is found. The policies
    just quoted may be shown to be optimal in the class C of all policies specified
    by sequences in which each $i=(1, 2, \dots, n)$ occurs an infinite number of times,
    by arguments involving interchanging of adjacent mines in a sequence. Since any
    policy may be matched by a policy in C for an arbitrarily large initial portion
    of the specifying sequence, it follows that the above policies are optimal in
    the class of all policies.


    The optimal policies for Problems 1, 2 and 3 may be described as follows. At each
    stage a job, mine or box is to be selected is a real-valued function defined on
    the set of available alternatives, and the one selected is such as to maximize
    this function. These functions, then, are dynamic allocation indices for the three
    problems.


    We have described these indices as functions on the sets of available alternatives.
    More precisely, the index for Problem 2, for example, is a function of the three
    variables, $x_i, q_i$ and $p_i$, which constitute the information available for
    mine $i$ when the amount of gold which it contains is $x_i$.'
