    # 4.2 Bandit superprocesses


    The index theorem for a SFABP has been established in Section 2.6.6. We also made
    the important observation in Section that an optimal policy can also be characterized
    as a modified index policy. Our aim in this section is to generalize these results
    to a family of alternative decision processes, in which we now describe.


    Recall that a SFABP is formed from a set $\{B_1, \dots, B_n\}$ of bandit processes
    with the same discount factor, by requiring that at each time the freeze 0 is
    applied to all one of the constituent bandit processes. It generates a single
    reward stream depending on the policy. The new starting point is a set of decision
    processes $\{D_1, \dots, D_n\}$ all with the same factor $a$. From each $D_i$
    we now have a second decision process $S_i$, by adding to the control set $\Omega_i(x_i)$
    at state $x_i$, the freeze 0 which, in the case of a bandit process, leaves the
    state unchanged and generates zero rewards for as long as it is. A similar comparison
    of the constituents $\{S_1, \dots, S_n\}$ may be achieved by again requiring that
    at each time the freeze control is applied to all but one of the constituents.
