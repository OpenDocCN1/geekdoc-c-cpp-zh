    It is reasonable to expect that, the subsidy W increases in (6.6), the set of
    states $E_0$ (in which $u=0$ is optimal) should increase monotonically. This need
    not happen in general. However, if it does we say the bandit is *indexable*. Whittle
    defines as an index value of the subsidy $W$ such that $u=0$ is optimal. We call
    this Whittle index, denoting by $W()$, where $W(x)=\inf\{W: x \in E_0(W)\}$. It
    can be used to define a heuristic policy (the Whittle index policy) in which,
    at each instant, one engages $m$ bandits with the greatest indices, is, those
    that are the last to leave the set $E_1$ as the subsidy for the passive action
    increases. The Whittle index extends the Gittins optimal policy for classical
    bandits: Whittle indices can be computed for each bandit; they are the same as
    the Gittins index in the case that $u=0$ is a freezing action, so that $P(j|i,0)=\delta_{ij}$.


    The discussion bears two questions: (i) under what assumptions is a restless bandit
    indexable; (ii) how good is the Whittle index policy? Might it be optimal, or
    nearly optimal as $n$ becomes large?


    Interestingly, there are special classes of restless bandit for which one can
    prove indexability. Direct of the bandit in type 6.2 are indexable, as is shown
    by Liu and Zhao (2010). The dual-speed bandits in Example 6.3 are indexable, as
    can be shown by conservation laws (Glazrook, Nimo-Mora and Ansell (2002), or in
    a continuous-time system) by a simple direct method (Weber 2007); this method
    can also be used to show that a restless bandit is indexable if the passive action
    rate $d_{ij}^u$ depends only on $j$ (the destination state).


    The approach of Glazrook et al. use conservation laws to prove that the following
    is sufficient for indexability. Fix a deterministic Markov policy $\pi$ and look
    at the expected total discounted time spent taking the action $u=1$ if one takes
    $u=1$ at the first step and then follows it with $\pi$. Compare that to the expected
    total discounted time spent taking $u=0$ at the first step and then follows it
    with $\pi$. Then the bandit is indexable, for all starting states and stationary
    policies $\pi$, the former quantity is greater. The dual-speed bandit satisfies
    this condition. They make use of conservation laws to find an expression for the
    reward suboptimality of a general policy. This is used to study the closeness
    to optimality of an index policy for dual-speed restless bandits. The strong performance
    of the index policy is confirmed by a computational study.


    Nimo-Mora (2001) also reaches the achievable region to address the question of
    indexability. He finds sufficient conditions on model parameters under which a
    single restless bandit is indexable. He describes adaptive greedy algorithm for
    computing the indices, within a framework of so-called partial conservation laws.
    Indexability is verified by running the algorithm.


    The above work provides some insight, but the question of indexability is subtle,
    and a complete understanding is yet to be achieved.'
