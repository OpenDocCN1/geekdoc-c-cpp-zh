  md: '# MULTI-POPULATION RANDOM SAMPLING (THEORY) 211


    case when the functions $\mu$ and $\sigma$ are constants, Karatzas shows that
    the Gittins index becomes


    ```

    $v(x) = \int_{0}^{\infty} h\left(x + \frac{z}{\beta}\right)e^{-z^2}dz$

    ```


    where $\beta = (|\mu^2 + 2\gamma\sigma^2)^{1/2} - |\mu|\sigma^-$.


    As one expect, $v(x)$ is increasing in each of $x$, $\mu$ and $\sigma$. Karatzas
    also establishes the framework from trivial trial that realizations of a SFABP
    up of diffusion bandit processes of this type may be described in a suitable probability
    space when an index policy is followed. By mimicking Whittle''s proof of the index
    theorem, he shows that the index policy is optimal.


    Eplett (1986) generalizes the Karatzas assumptions by allowing $x(t)$ to be an
    arbitrary continuous-time Markov process, and considers discrete-time approximations,
    establishing conditions under which both the indices and the optimal payoff functions
    for the convergence converge to the original setup. As point, this analysis is
    of particular importance as there must be some limit to the possibility of reallocating
    resources at very short notice, and it is sometimes easier to calculate indices
    for discrete-time approximations. Filligier and Hongler (2007) generalize Karatzas''s
    results to bandit processes driven by a class of superdiffusive noise sources.


