  md: "# MULTI-ARMED BANDIT ALLOCATION INDICES\n\nLet $\theta$ be the exponential\
    \ parameter, so that the probability of observing a new value in any time interval\
    \ $(t, t+\\delta t)$ is $\\delta t + o(\\delta)$. Let $\theta$ have the improper\
    \ density $\rho(\theta|0,0) \\propto \\alpha^{-1}$. Suppose that after a time\
    \ $t$, $n$ values have been sampled at times $t_1, t_2, \\dots, t_1 + t_2 + \\\
    dots + t_n$. The probability density for this outcome is\n\n```\n\\prod_{i=1}^n(\\\
    theta e^{-\theta_i}) \\exp[-\theta(t - \\sum t_i)] = \\theta^n e^{-\theta t}\n\
    ```\n\n$exp[-\theta(t-\\sum t_i)]$ being the probability that the $(n+1)$th sampling\
    \ time is greater than $t-\\sum t_i$. It follows from the generalized Bayes' theorem\
    \ that the posterior density for $\theta$ may be\n\n```\n\\rho(\\theta|t,n) \\\
    propto \\alpha^{-\theta} e^{-\theta t} \\propto t^n \\theta^{n-1} e^{-\theta}\
    \ / \\Gamma(n),\n```\n\nwhich is a gamma density with parameters $n$ and $t$.\
    \ Thus the probability density for the future time up to the observed value is\n\
    \n```\nf(u|t,n) = [\\Gamma(n)]^{-1} t^{-n} \\int_0^u \\theta e^{-\theta n} \\\
    theta^{n-1} e^{-\theta} d\\theta = \\frac{nt^n}{(t+n)^{n+1}}.\n```\n\n**Theorem\
    \ 7.26** For a reward process with unrestricted switching, an exponential distribution\
