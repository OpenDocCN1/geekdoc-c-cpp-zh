  md: '# MULTI-POPULATION RANDOM SAMPLING (THEORY)


    # 7.5 Random sampling times


    A sampling process for the times $U_1, U_2, \dots$ needed to sample a value are
    independent identically distributed random variables is an example of a semi-Markov
    bandit process. Thus (Theorem 2.1) optimal policies for sampling sequentially
    from a family of such processes are again index policies. Semi-Markov processes
    are are of interest as models for whole areas of research in a pharmaceutical
    or agricultural laboratory. A family of two semi-Markov reward processes, as example,
    serves as a model for the herbicide and fungicide programmes. Each sampled value
    is, in accountants'' language, the expected net value of a particular herbicide
    or fungicide at the time of its discovery. The aim of the model would be to indicate
    the relative priorities of the two research programs.


    No index values for semi-Markov reward processes have as yet been calculated,
    though this would be feasible, particularly when the problem is reduced by exploiting
    invariance properties. The provided distributions of the $Us$ and of the $Xi$
    are independent, and the prior distributions for their parameters are also independent,
    the theorems of Section 7.4 continue to hold, with the obvious modification that
    the state must now specify a posterior distribution for the parameters of the
    $U$-distribution. We also have an analogue of Theorem 7.9, referring to the $U$-distribution
    instead of the $X$-distribution. To state this the notation is extended by letting
    $\rho_n$ be the posterior density for the parameter $(\mathbb{R}^+)$ of the distribution,
    and including the discount parameter $\gamma$ in the notation. Since the prior
    densities $\rho_0$ and $\pi_n$ are by assumption independent, it follows that
    $\rho_n$ and $\pi_n$ are also independent.


    **Theorem 7.25** If a $\sigma (>0)$ for the family of distributions for the sampling
    time of a semi-Markov reward process is a scale parameter, the sample mean $\bar{U}$
    is a sufficient statistic, and $\rho_0(\sigma) \propto \sigma^{-d}$ for some $d>0$,
    then $\rho_n$ may be identified by its parameters $\bar{u}$ and $n$, and for $b>0$,


    ```

    $R(b^{-1}\lambda, \tilde{b}, n, \pi_n, b^{-1}\gamma) = R(\tilde{\lambda}, \tilde{u},
    n, \pi_n, \gamma)$

    ```


    and


    ```

    $v(\tilde{u}, n, \pi_n, \gamma) = \gamma v(\tilde{\gamma}, n, \pi_n, 1)$.

    ```


    *Proof.* The two parts of the theorem are direct consequences of changing the
    time unit, for the first part by the factor $b$, and for the second part by the
    factor $\gamma$.


    A further modification is to allow a switch from process to occur at any time,
    rather than restricting switches to the times when a new value is obtained. This
    works out nearly when the $U$-distribution is exponential, which means that the
    times when new values are formed a Poisson process in process time.'
