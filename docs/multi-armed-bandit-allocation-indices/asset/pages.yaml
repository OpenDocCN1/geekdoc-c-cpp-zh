    In Section 5.2 we begin with a very simple example of scheduling in a two-class
    $M/M/1$ queue. We see that the vector of the mean queue lengths is constrained
    to lie in a one-dimensional simplex (a line segment), extreme points (endpoints
    of the segment) are obtained by giving priority to one class over the other. It
    must follow that any system-wide objective which is linear in the mean queue lengths
    means optimized by one of these priorities. This is a simple notion, but it becomes
    powerful when applied to many interesting control problems. The method has utility
    for problems with discounted returns if (i) the system-wide return can be expressed
    as some weighted sum of the expected discounted effort that are applied to different
    job classes, or projects; and (ii) we can develop linear constraints for these
    measures of effort. We see in Section 5.3 that the problems posed by simple family
    of bandit processes (SFABPs) or multi-armed bandit problems can be cast in this
    method. We develop a linear solution which provides an upper bound on the expected
    return and fact that this bound can be shown to attain leads us to one more proof
    of the index theorem. The ideas are worked out in Section 5.4, to prove that systems
    generalizing conservation laws (GCLs) have optimal policies that are index policies.
    The ideas are applied to branching bandits in Section 5.5, and to job selection
    and scheduling problems in Section 5.6. The method does not lead to the earliest
    proof of the index theorem for a SFABP or for branching bandits, but it can be
    useful in calculating, for example, the suboptimality of a priority policy based
    on Gittins indices in a parallel server environment in which it is not optimal.
    We make such calculations in Section 5.7.


    # # 5.2 A simple example


    We shall first illustrate the general approach of the chapter by considering the
    simple case of the optimality of the $\mu$-rule for a two-class $M/M/1$ queuing
    system, scheduled to minimize a linear holding cost. To the authors'' knowledge,
    this problem was first analysed in this manner by Coffman and Mitrani (1980).
    Customers of two types arrive at a single server according to independent Poisson
    streams, with $\lambda_i$, the arrival rate for class $i, i=1, 2$. The service
    times of class $i$ are exponentially distributed with mean $\mu_i^{-1}$. Service
    times are independent of each other and of the streams. The overall rate at which
    work arrives at the system, namely $\lambda_1 + \lambda_2$, is assumed less than
    1, and this guarantees the existence of stable scheduling policies for the system.
    Policies for the system must be past-preemptively and non-idling, while priorities
    between customers are opposed to choose such a policy $\pi$ to minimize the long-term
    holding cost, name


    ```

    $C^{opt} = \min_{\pi} \{c_1 E_{\pi}(N_1) + c_2 E_{\pi}(N_2)\},$

    ```'
