    # 2.12 History of the index theorem


    It is now 40 years since Gins and Jones first proved the index theorem for a SFABP.
    The idea that an optimal policy for a sequential decision problem may sometimes
    take the form of an index policy was not new at the time; it had been known for
    some simple scheduling problems since the 1950s. For example, for Problem 1, it
    was Smith (1956) who observed that, to minimize the weighted flow time of $n$
    jobs with known processing times on a single machine, one should process them
    in decreasing order of index computed as weighted by processing time (an index
    priority policy known as ‘Smith’s rule’).


    An elementary version of the multi-armed bandit problem (Problem 5) was solved
    by Bellman (1956), for the special case in which there are just two rewards and
    the success probability of one is known, and by Brady, Johnson and Karlin (1956)
    in the case of undiscounted rewards and a finite horizon. Authors defined and
    discussed ideas characterizing optimal policies (but without actually calling
    them indices). They prophesaged the idea, above, in which an arm with unknown
    $p_i$ can be calibrated against an arm with known $p_k$ that one is indifferent
    (in a two-armed bandit problem) as regards initially pulling $i$ or $k$.


    The 1970s saw rapid advances in researchers’ awareness of how index policies can
    be optimal for more complicated problems. Klimov (1974), Sevcik (1974), Harrison
    (1975), Tcha and Pliska (1977) and Meijson and Weiss (1977) were all obtaining
    results about the optimality of index policies for scheduling in various forms
    of multi-class queues, and finding indices similar to the Gittins index. They
    were wholly unaware of the index theorem. This index theorem was first presented
    by Gittins and Jones at a conference in 1972 (whose proceedings were published
    in 1977). It became more widely known after the publication of Gittins’ 1979 paper.


    Perhaps it is because the theorem is so remarkable and unexpected that many researchers
    have sought to re-prove it for itself. It is impossible to list all who have studied
    this index theorem and contributed profound insights. At the first time of this
    book we cited by Beale (1979), Whittle (1980), Karatzas (1984), Varaiya, Walrand
    and Buyukkok (1985), Mandelbaum (1986, 1988), Chen and Katehakis (1986), Kallenberg
    (1986), Elett (1986), R. P. Kertz (1986), Titsiklis (1986), Katehakis and Veinot
    (1987) (restart-in-state method), and Lai and Ying (1988)


    The proof of Varaiya et al. is distinctive for showing that results which can
    be placed in the context of monotone sequences of sigma-fields, also known as
    filtrations, for each bandit process, rather than the Markov or semi-Markov setting
    to which'
