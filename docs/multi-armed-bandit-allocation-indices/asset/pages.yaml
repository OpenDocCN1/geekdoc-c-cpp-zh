    k\}$. Action $u \in [0, 1]$ be applied to the asset while in state $x \in E$,
    the transition to the next state is exponentially distributed with rate $\lambda(x)
    + \mu(1-u)$, where $\lambda(x)$ is the rate at which the asset moves from $x$
