    Expression (2.5) provides an economic interpretation for $\lambda$ as the greatest
    reward that one would be willing to pay (per period) for ownership of the rewards
    arising from the bandit while it is continued for one or more periods.


    This value of $\lambda$, which we shall denote as $v(B_i, x_i)$, is the obvious
    candidate for the index for $B_i$ when it is in state $x_i$. Essentially, we have
    calibrated $B_i$ by finding a bandit process $S(\lambda)$ such that in a two-bandit
    SFABDP comprised from $B_i$ and $S(\lambda)$, we are indifferent as to which of
    the bandits should receive the continuation control. From (2.5) we have


    ```

    $E \sum_{t=0}^{\tau-1} a^t r_i(x_i(t)) \quad x_i(0) = x_i\\nv(B_i, x_i) = \sup_{\tau
    > 0} E \sum_{t=0}^{\tau-1} a^t x_i(0) = x_i \quad (2.6)

    ```


    where $\tau$ is a past-measurable stopping time.

    Observe that $v(B_i, x_i)$ is defined as the maximum possible value of a quotient.
    The numerator is the ''expected total discounted reward over $\tau$ steps'', and
    the denominator is the ''expected total discounted time over $\tau$ steps'', where
    $\tau$ is at least 1 step. It is useful to define some notation for the numerator
    and denominator. Let these be


    ```

    $R_{\tau}(B_i) = E \sum_{t=0}^{\tau-1} a^t r_i(x_i(t))\\nW_{\tau}(B_i) = E \sum_{t=0}^{\tau-1}
    a^t = (1-a)^{-1}E(1-a^{\tau})$.

    ```


    Let us define also


    ```

    $v_{\tau}(B_i) = \frac{R_{\tau}(B_i)}{W_{\tau}(B_i)} \quad (2.7)

    ```


    so we rewrite (2.6) as


    ```

    $v(B_i) = \sup_{\tau > 0} v_{\tau}(B_i)$.

    ```


    All the quantities naturally depend on the initial state $x_i(0)$ of the bandit
    process $B_i$. When necessary $(B_i)$ be replaced with $(B_i, x_i)$ to indicate
    the values when $x_i(0) = x_i$.


    It is very important to appreciate that $v(B_i, \cdot)$ is a function that can
    be determined knowing only $a, r_i$ and $P_i$. That is, it can be computed without
    knowing anything about $x_j, r_j$ and $P_j$ for other bandit processes. We will
    see in Sections 2.9 and 2.10 that if $B_i$ moves on a finite state space of size
    $k_i$ then its $k_i$ Gittins indices (one for each state) can be computed in time
    $O(k_i^3)$.'
