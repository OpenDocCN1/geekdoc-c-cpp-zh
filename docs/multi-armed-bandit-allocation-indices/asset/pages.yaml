    We should mention that there are formulations of the multi-armed bandit problem
    which differ from that described in Problem 5. Suppose that, under some policy,
    the arm that pulls on pull $t$ is denoted $i_t$, and $r_{it}$ denotes the reward.
    In a version of the multi-armed bandit problem defined by Robbins (1952), the
    regret after $T$ pulls


    ```

    $$\rho = T \max[p_1, \dots, p_n] - \sum_{t=1}^{T} r_{it},$

    ```


    and seeks a strategy such that the average regret $\rho/T$ tends to 0 as $T$ tends
    to infinity, for all values of the unknown parameters $p_1, \dots, p_n$. This
    is possible with sensible strategy that pulls each arm infinitely often, although
    some policies are better than others in terms of minimizing a secondary criterion,
    such as the worst-case expected regret, $\sup_{p_1,\dots,p_n} E(\rho)$. Lai and
    Robbins (1985) show that, asymptotically, the regret must grow logarithmically
    in the number of pulls, whatever the values of the unknown success probabilities.
    Anantharam, Varaiya and Walrandand (1987a,b) find similar results when one samples
    $m$ processes at a time.


    Other researchers have addressed similar issues. For example, Mannor and Tsitsiklis
    (2003) show that it suffices to pull arms $O(n/\epsilon^2) \log(1/\delta)$ times
    to be within $\epsilon$ of the expected reward of the best arm with probability
    $1-\delta$


