    # 3.2 Jobs


    A bandit process which yields a positive reward at a random time, and no other
    rewards, positive or negative, is termed a job. A simple family of such bandit
    processes defines a version of the well-known problem of scheduling a number of
    jobs on a single machine, as we have already met in Problems 1 and Chapter 4.
    Many papers on scheduling problems have been written over the past 50 years. For
    a review of the field the reader is referred to particular books by Conway, Maxwell
    and Miller (1967), Baker (1974), Coffman (1976), and the conference proceedings
    edited by Dempster, Lenstra and Rinnoy Kan (1982). French (1982) gives a convenient
    introduction. An excellent reference for problems in machine scheduling is the
    book of Pinedo (2008).


    In addition to their importance in scheduling theory, SFABPs of job type retain
    sufficient generality to provide further insight into why the index theorem holds,
    as well as providing counter-examples to any conjecture that substantial relaxation
    of its constraints might be possible. The remaining sections of this chapter are
    devoted to carrying out this programme, and also showing that a little ingenuity
    stretches the range of problems for which the conditions of the theorem may be
    shown to.


    A natural extension of the notion of a job is to allow costs and rewards to occur
    before completion of the job. This leads to the definition of a job as a quite
    general bandit process, except for the existence of a state (or set of states)
    C representing completion. Selection of an uncompleted job at each decision time
    until all the jobs have been completed by supposing that a job in state C behaves
    like a standard bandit process with parameter −M, where M is large, as this means
    it can only be optimal to select a completed job for continuation if every job
    has been completed. Jobs of this kind will be termed generalized jobs to distinguish
    these from the less elaborate jobs of the opening paragraph of this section.


    Restrictions of the form ‘Job A must be completed before job B may be started’
    are precedence constraints. They are present in many real-life scheduling problems.
    Resource allocation to jobs, including generalized jobs, under precedence constraints
    is one of the themes of Chapter 4.


