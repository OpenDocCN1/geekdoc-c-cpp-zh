    average reward than $r(S, \pi)$. Thus the difference $v(S, \pi) - r(S, \pi)$ is
    caused by uncertainty about $\theta$, and may be expected to be large when this
    uncertainty is large.


    Theorem 23 tells us that $v(S, \pi)$ increases with $a_i$, and so therefore $v(S,
    \pi) - r(S, \pi)$, since $r(S, \pi)$ is independent of $a$. This is because, the
    larger discount factor $r(S, \pi)$, and consequently the more future rewards are
    in comparison with the immediate expected reward $r(S, \pi)$, the more important
    sampling becomes. The difference $v(S, \pi) - r(S, \pi)$ is one measure of the
    importance of sampling to obtain information, rather than simply to obtain the
    reward $r(S, \pi)$.


