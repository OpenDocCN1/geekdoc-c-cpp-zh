  md: '# Restless bandits and Lagrangian relaxation


    # 6.1 Introduction


    In the various emerges of processing the index theorem for simple families of
    alternative bandit processes (SFABPs) which have been presented in the book to
    date, the fact that bandits not in receipt of processing are frozen in their current
    state plays as a fundamental role. We have, though, seen in the last two chapters
    that it is possible to demonstrate the optimality of Gittins index in problem
    areas including multi-class queues, where systems can evolve in interesting and
    important ways through agencies (like an arrivals process) beyond the processing
    action. Nonetheless, many problem domains naturally lead to the question of whether
    we can incorporate restlessness (the evolution of unprocessed system components)
    as a central feature. It was Whittle (1988) who suggested extending the notion
    of a SFABP by allowing bandits not in receipt of processing to evolve, but according
    to a different law from which applies when they are active. In the context of
    a setup in which m of such restless bandits could be active at any time, we developed
    an index heuristic by means of a Lagrangian relaxation of the problem. Lagrangian
    relaxation is a well-known technique by which to address optimization problems
    with constraints. It works by moving hard constraints into the objective so as
    exact a penalty on the objective if they are not satisfied (see Bert and Tsitsiklis
    (1997) and Bertsekas (1999) for further discussion of this technique and uses
    of it).


    The index which emerges from this analysis, widely known as the Whittle index,
    reduces to that of Gittins in the SFABP case. The utility of the model in many
    practical contexts, and the elegance and power of Whittle''s proposal means that
    it has enjoyed great popularity.'
