    A policy for a decision process is any rule, including randomized rules, for each
    decision time t specifies the control to be applied at time t as a function of
    t, the state at time t, the set of previous decision times, and the states of
    the process and the controls applied at those times. Thus the control applied
    at time t may depend on the entire previous history of the process, though not
    on what happens after t, a situation which we describe by saying it is measurable.
    A policy which maximizes the expected total reward over the set of all policies
    for every initial state will be termed an optimal policy. Deterministic policies
    are those which involve no randomization. Stationary policies are those which
    involve no explicit time dependence. Markov policies are those for which the control
    chosen at time t depends only on t and the state at time t.


    A policy which results in control 1 applied up to a time τ, and control 0 applied
    thereafter, will be termed a stopping rule, and τ the corresponding stopping time.
    In particular, a policy which divides the state into a continuation set, on which
    control 1 is applied, and a stopping set where control 0 is applied, is a deterministic
    stationary Markov rule.


    We note that τ may take the value infinity with positive probability. Stopping
    rules have been extensively studied, for in the context of bandit processes (e.g.
    Chow, Robbins and Siegmund, 1971); these may be regarded as being defined by bandit
    processes in which the freeze controls nonzero reward, that is r. We now come
    to the central concept of a family of alternative bandit processes (FABP). A decision
    process is formed by bringing together a set of n bandit processes with the same
    discount factor. Time zero is a decision time for every bandit process, and at
    zero time, control 1 is applied to one of them, bandit process B₁ say, and control
    0 is applied to all the other processes until the next decision time for B₁ is
    reached. Again, this is a decision time for every bandit process and one of them
    is continued, B₂ say (which may be B₁ again), while the others are frozen by applying
    control 0 until the next decision time for B₂. Again, this is a decision time
    for every process and just one of them is continued.


    A realization of a FABP is constructed by proceeding in this way from one decision
    time to the next. The state space for the FABP is the product of the state spaces
    for the individual bandit processes. The control set at decision time is given
    by the set of bandit processes which may be continued, application of control
    i to the FABP corresponding to selection of bandit process i for continuation.
    There may be precedence constraints (Section 4.6) or arrivals (Section 4.8) which
    mean that this set does not include all n bandit'
