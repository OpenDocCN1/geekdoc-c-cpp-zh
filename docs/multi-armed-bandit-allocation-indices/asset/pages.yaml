  md: '# MULTI-POPULATION RANDOM SAMPLING (THEORY) 175


    **Theorem 7.1** The statistics $u_1, u_2, \dots, u_m$ are sufficient for random
    samples of size $n$ iff, for all $x$ and for suitably chosen functions $d$ and
    $h$,


    ```

    $$\prod_{i=1}^n f(x_i|\theta) = d(u_1(x_n), u_2(x_n), \dots, u_m(x_n), \theta)h(x_n)$$

    ```


    where $d$ is a Borel-measurable function defined in $\mathbb{R}^{m+r}$, $h$ is
    $\mathcal{F}^n$-measurable, and $\mathbf{x}_n = (x_1, x_2, \dots, x_n)$.


    The two simplifying assumptions are as follows.


    **Assumption 1** The family of distributions $\mathfrak{D}$ is an *exponential*
    family. This means (e.g. see Ferguson, 1967) that the density $f(x|\theta)$ may
    be written in the form


    ```

    $f(x|\theta) = c(\theta) \exp\left[\sum_{j=1}^\infty q_j(\theta)t_j(x)\right]h(x)$$

    ```


    **Assumption 2** The *prior density* $\pi_0(\theta)$ may be written in the form


    ```

    $$\pi_0(\theta) = k_0 [c(\theta)]^a \exp\left[\sum_{j=1}^m q_j(\theta)b_j\right]$$

    ```


    Most of the standard distributions belong to exponential families, so Assumption
    1 is not a serious restriction. It means, as Theorem 7.1 shows, the statistics


    ```

    $$\sum_{i=1}^n t_j(x_i) \quad (j = 1, 2, \dots, m)$$

    ```


    form a sufficient set. From equation (7.1) it therefore follows that the posterior
    $\pi_n(\theta|\mathbf{x}_n)$ depends on the observation vector $\mathbf{x}_n$
    only as a function of the sufficient statistics. This property gives the clue
    to the term *sufficient*, the point being that, for the purpose of calculating
    $\pi_n$, all the information derived from the observations is given by the sufficient
    statistics.


    Assumption 2 means that $\pi_n(\theta|\mathbf{x}_n)$ may be written as


    ```

    $$\pi_n(\theta|\mathbf{x}_n) = k_n(\mathbf{x}_n) [c(\theta)]^{a+n} \exp\left{\{\sum_{j=1}^m
    q_j(\theta)b_j + \sum_{j=1}^n t_j(x_i)\right\} \quad (7.2)$$

    ```


    where $k_n(\mathbf{x}_n)$ is chosen so that $\int \pi_n(\theta|\mathbf{x}_n)d\mu_2(\theta)
    = 1$. For any $n$ and $\mathbf{x}_n$, $\pi_n$ is the probability density for a
    distribution defined by the parameters


    ```

    $$a+m \text{ and } b_j + \sum_{i=1}^n t_j(x_i) \quad (j = 1, 2, \dots, m)$$

    ```'
