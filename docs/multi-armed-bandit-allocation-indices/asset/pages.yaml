    Note that the n nonincreasing sequences of prevailing charges are independent
    of policy; it is their interleaving that depends on policy. If we adopt a policy
    of always continuing the bandit with the greatest prevailing charge then we interleave
    the n sequences of nonincreasing charges into a single nonincreasing sequence
    of charges, and so this maximizes the discounted sum of prevailing charges paid.
    Since profit is no more than zero, this is an upper bound on the expected total
    discounted sum of rewards that can be obtained from the bandits under any policy.
    However, this upper bound is attained by the proposed policy, and it must be optimal.
    The fair charge that is defined in (2.5) is the Gittins index.


