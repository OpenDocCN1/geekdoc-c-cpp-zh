  md: '# 9


    # Further exploitation


    # 9.1 Introduction


    The first edition of this book presented the Gittins index solution to the exponentially
    discounted multi-armed bandit problem and its application to a wide class of sequential
    resource allocation and stochastic scheduling problems. Our aims in this second
    edition have been to give a refreshed account of the same material and to say
    what more has been done since 1989.


    There has been a remarkable flowering of new insights, generalizations and applications
    since publication of the first edition. We have used these freely to update the
    presentation, while still preserving most of the original material. New to this
    edition is the material on the achievable region approach to stochastic optimization
    problems, the construction of performance bounds for suboptimal policies, Whittle''s
    restless bandits, and the use of Lagrangian relaxation in construction and evaluation
    of index policies. The book now includes numerous proofs of the index theorem
    and discusses the special insights that they provide. Many contemporary applications
    are surveyed, and over 100 new references have been included.


    In this final chapter, we briefly mention some other interesting work of an applied
    nature. The application in Section 9.2 is to a problem of website design. In Section
    9.3 we describe how some restless bandit models have been formulated in equations.
    The use of the Gittins index to discuss the value of information is considered
    in Section 9.4 We say a bit more about work on job-scheduling problems in Section
    9.5. Some military applications are described in Section 9.6.'
