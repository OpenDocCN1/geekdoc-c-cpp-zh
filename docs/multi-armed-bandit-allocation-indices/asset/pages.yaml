  md: '# Foreword


    John Gittins'' first edition of this book marked the end of an era, the era in
    which a succession of investigators struggled for an understanding and ‘solution’
    of the multi-armed bandit problem. My foreword to that edition celebrated the
    gaining of this understanding, and so it seems fitting that this should be retained.


    The opening of a new era was like the stirring of an ant-heap, with the sudden
    emergence of an avid multitude and a rush of scurrying activity. The first phase
    was one of exploitation, in which each worker tried to apply his special expertise
    in this context. This yielded, among other things, a remarkable array of proofs
    of optimality of the Gittins index policy. The most elegant and insightful was
    certainly Richard Weber’s ‘prevailing charge’ (see section 2.5), expressible in
    a single paragraph of verbal reasoning. I must confess, however, to a lingering
    attachment to the dynamic programming proof (see section 4.3) which provided also
    the value function of the Gittins policy and a treatment immediately generalizable
    to the case of superprocesses.


    The phase of real interest was the subsequent one, of exploration. To what range
    of models can the Gittins technique be extended? Here the latent in the terms
    ‘bandit’ and ‘arm’ (with their gambling machine origins) to become quite strained.
    I myself spoke of a population of ‘projects’, only one of which could be engaged
    at any given time. One wishes to operate all — it is to this phase that the high-value
    projects, but can determine which these are by only trying them — the process
    is one of allocation and learning. Any project does not itself change, but its
    ‘informational state’ does — one’s knowledge of it as expressed by a Bayesian
    updating.


    However, situations occur when the projects do also like a physical state, which
    may change by stochastic rules, or for which the population of projects changes
    by immigration or emigration. These are cases one would wish to cover. It is then
    more natural to think of the projects as ‘activities’, having their own dynamic
    structure, and whose performance one would wish to optimize by the appropriate
    allocation of given resources over activities. This is the classical economic
    analysis in a dynamic setting. However, we are now effectively adding to this
    the feature that the current physical states of the activities are incompletely
    known, and must be inferred from observation. ‘Observation time'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'is then an additional resource to be allocated. Section 6.8 gives the clearest
    indication of such an ambition.


    Extension to such cases requires new tools, and Chapters 5 and 6 consider two
    study: study of the achievable region and Lagrangian relaxation of the optimization.
    These central chapters present very clearly the current state of theory in cases
    of examples of practical interest for which an optimal policy – of index character
    is determined. It must be confessed, however, that the general problems of indexability
    and optimality remain beached on the research frontier, although one senses a
    rising tide which will lift them.


    Explicitness is also a feature of Chapters 7 and 8, which go into hard detail
    on the determination of indices under different statistical assumptions.


    This scholarly and modern work gives a satisfyingly complete, rigorous and illuminating
    account of the current state of the subject. It also conveys a historical perspective,
    from the work of Klimov and von Olivier (which appeared in print before appreciation
    of John Gittins’ advance had become general) to the present day. All three authors
    of the text have made key and recent contributions to the subject, and are in
    the best position to lay its immediate course.


    Peter Whittle'
