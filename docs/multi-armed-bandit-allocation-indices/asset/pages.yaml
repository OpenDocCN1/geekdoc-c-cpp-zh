    # 5.3 Proof of the index theorem by greedy algorithm


    In this section we sketch the key ideas of the achievable region approach by using
    to give it one more proof of the index theorem for the general multi-armed bandit
    problem (or simple family of alternative bandit processes).


    Suppose that $n$ bandits are identical and have the same finite state space $E
    = [1, \dots, N]$. As noted in Section 3.2 this without loss of generality, but
    provides a useful simplification because bandits are distinguished only by their
    state. Previously, we have used $x$ to denote a state, but as stated above it
    is convenient in this chapter to reserve $x_1,\dots,x_n$ for linear programming,
    or system performance variables. In this chapter we need only a notation for the
    initial state of a multi-armed bandit, and denote this by $\mathbf{k} = (k_1,\dots,k_n)$.
    $I_i(t)$ is an indicator variable for the event that a bandit in state $i$ is
    continued at time $t$. For a given policy $\pi$, let $x_i^\pi$ denote the total
    discounted number of times that a bandit in state $i$ is continued under policy
    $\pi$. That is,


    ```

    $x_i^\pi = E_{\pi}\left[\sum_{t=0}^{\infty} a_i(t)|k\right]. \quad (5.1)

    ```


    Since the state $\mathbf{k}$ is regarded as fixed, we do not explicitly the dependence
    $x_i^\pi$ on $k$. Assuming whenever a bandit is in state $i$ is continued with
    reward $r_i$, the multi-armed bandit problem is equivalent to the problem of maximizing
    $\sum_ix_i^\pi$, by choice of $(x_1^\pi,\dots,x_n^\pi)$ optimally within the space
    of performance vectors that are ''achievable'' by admissible policies.


    The crux of the approach is to characterize the achievable region of performance
    vectors as a polyhedral space that is defined by a set of linear constraints.
    These constraints, called *conservation laws*, can be obtained by thinking about
    some objective functions that are obviously optimized by priority policies. Let
    us start with one constraint that is trivial. Since one bandit is being continued
    at time, we must have one conservation law:


    ```

    $\sum_{i\in E}x_i^\pi = 1+a+a^2+\dots=\frac{1}{1-a}. \quad (5.2)

    ```'
