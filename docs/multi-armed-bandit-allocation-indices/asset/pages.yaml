    # **Theorem 4.14** In the Klimov model with $J$ job classes, the mean holding
    cost is minimized by the index policy defined by the $\gamma = 0$ indices, ignoring
    arrivals.


    *Proof.* Note that the length of the first busy period is independent of scheduling.
    Assume that arrivals are job linked, so that, once the first busy period ends,
    no more jobs arrive. Thus the problem is equivalent to one of maximizing the expected
    discount during the first busy period (where a reward $r_i$ is obtained when class
    $i$ completes service). We have already noted above that there is a solution in
    terms of a Gitts index policy.


    Suppose that class $i$ is the class of $i$-th highest priority, $i = 1, 2, \dots,
    J$. Then the Gitts index of a class $i$ job $j$ is computed by starting with just
    one job in class $j$, serving that job, and any subsequently arriving or feedback
    jobs in classes $1, \dots, j-1$, until there is no longer any in the system of
    higher priority than $j$.


    If $\gamma > 0$ it matters that class $i$ jobs are always given priority over
    those in class $i+1$. However, in the $\gamma \to 0$ limit it does not matter
    the jobs in classes $1, \dots, j-1$ are scheduled because the index is just the
    quotient of the expected reward collected and over the period elapsed, required
    to reach the situation in which there remain no jobs in any class of higher priority
    than $j$. Since the order of service does not matter in the $\gamma \to 0$ limit,
    we may suppose that the initial job and any feedback jobs are served first, until
    there is no more feedback. Suppose this takes time $T$, and during that time the
    rewards collected to $C$. Once $T$ is reached, there will be numbers of jobs in
    classes $1, 2, \dots, j-1$ (the ones that were arriving) The number in class $i$
    will have $\lambda_i T$. It follows by the busy period created from serving each
    of these jobs that the expected time it will reach such a point is proportional
    to $T$, saying $\alpha T$, This means that the index for $j$ in the $\gamma \to
    0$ limit has the value


    ```

    $v(j) = \left( \frac{E(C+\alpha T)}{E(T+\beta T)} \right) / (1+\beta).$

    ```


    This is an increasing function of $EC/ET$, which is the value of the index in
    a problem with no arrivals. Thus, we may conclude that the priority order of the
    classes is the same as that with no arrivals.'
