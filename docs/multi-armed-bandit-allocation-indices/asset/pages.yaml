  md: '# Preface to the first edition


    A prospector looking for gold in the Australian outback has to decide where to
    look, and if he prospects for any length of time must repeatedly take further
    decisions in the light of his success to date. This decision problem is how to
    allocate his time, in a sequential manner, so as to maximize his likely reward.
    A similar problem faces a student about to graduate from university who is looking
    for employment, or the manager of a commercial laboratory with several research
    projects competing for the attention of the scientists at his or her disposal.


    It is to problems like these that the indices described in this book may be applied.
    The problems are characterized by alternative independent ways in which time or
    effort may be consumed, for each of which the outcome is uncertain and may be
    determined only in the course of applying the effort. The choice at each stage
    is therefore determined partly on the basis of maximizing the immediate rate of
    return, and partly by the need to reduce uncertainty, and thereby provide a basis
    for better choices later on. It is the tension between these two requirements
    that makes the decision problem interesting and difficult.


    The classic problem of this type is the multi-armed bandit problem, with several
    Bernoulli processes with unknown success probabilities are available, each success
    yielding the same reward. There are already two good books on this subject: by
    Presman and Sonin (1982), by Berry and Frstedt go well beyond the simple version
    of the problem just stated: most notably to include, respectively, an exponentially
    distributed rather than constant interval between trials, and a study of the consequences
    of discounting rewards in different ways.


    The aims of this book are to expound the theory of dynamic allocation indices,
    and to explore the class of problems for which they define optimal policies. These
    include sampling problems, like the multi-armed bandit problem, and stochastic
    scheduling problems, such as the research manager''s problem. Tables of index
    value are given for a number of sampling problems, including the classical Bayesian
    multi-armed bandit problem. For the most part, and except otherwise indicated,
    the book is an account of original work, though much of it has appeared before
    in the publications bearing the author''s name which are listed in the references.


    It is a pleasure to acknowledge the stimulus and encouragement which this work
    has received over the years by conversations, and in some cases'
  merge: -1
