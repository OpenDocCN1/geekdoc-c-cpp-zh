  md: '# 9.4 Value of information


    Researchers have used the multi-armed bandit problem and Gittins indices to discuss
    issues of imperfect information and how to assess the worth of information. We
    briefly mention some examples of the questions addressed.


    Berry and Kertz (1991) have studied the value of perfect information for Bernoulli
    bandits, comparing the optimal rewards obtained by players with perfect and imperfect
    information. Gittens and Wang (1992) have investigated the importance of acquiring
    additional information. They define the learning component of the index as the
    difference between the index and the expected reward. They show that for two arms
    with the same expected reward, the learning component is larger for the arm for
    which the reward is more uncertain.


    Bhulai and Koole (2000) look at two extreme situations, which occur when a bandit
    has been played N times: the situation where the decision maker stops learning
    and the situation where the decision maker acquires full information about that
    bandit. They show that the reward between these lower and upper bounds goes to
    zero as N grows large.


    Peko (2003) discusses a problem in which the goal is to maximize the long-run
    average reward per pull with which previously acquired information is forgotten
    when a switch between arms is made. He investigates some peculiarities of optimal
    policies.


    Jones and Koo (2008) discuss bandit problems in which the sequence of discount
    factors is not known in advance. They compare the reward of observers who have
    information about the discount sequence from the start with those who do not.


    # 9.5 More on job-scheduling problems


    As we have seen, the field of job scheduling is rich in problems for which bandit
    processes or restless bandits can provide helpful models.


    Fay and Glazbrook (1989) discuss a job-scheduling problem in which there are unsuccessful
    job completions, but jobs are alternatives, so that only one from a set of alternative
    jobs must be completed successfully. Glazbrook (1991) looks at scheduling jobs
    on machines that are subject to breakdown, and demonstrates that, under mild restrictions,
    a non-preemptive policy is optimal in the class of preemptive ones.


    Ishida and Wan (1997) discuss a problem of single-server scheduling of jobs that
    expire at predetermined dates. An index-based scheduling policy is shown to maximize
    the expected total reward. In a similar vein, Richter and Shanthikumar (1998)
    give conditions on the optimality of an index policy for multi-armed bandits when
    bandits are deteriorating and arms expire independently (geometrically). They
    also give a simple proof of the optimality of the Gittins index policy for the
    classic multi-armed bandit problem using ideas similar to Weiss (1988).'
