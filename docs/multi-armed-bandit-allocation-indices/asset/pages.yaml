  md: '# 9.2 Website morphing


    Commercial website design is big business. Websites need to be easy and attractive
    to use. The problem of choosing the best format has led to an application of the
    Bernoulli reward process multi-armed bandit.


    Defining our 1–success–failure variable to correspond to a website visit which
    ends with, or without, a purchase, we can identify the arms of our multi-armed
    bandit with the different available formats. If we suppose that the format presented
    to each visitor depends on the success records of the various formats, and the
    objective is to maximize the expected total discounted number of successful visits,
    the correspondence with a multi-armed bandit is almost exact.


    In fact the proponents of real-time website morphing propose a more sophisticated
    approach which takes account of different cognitive types among the visitors to
    the website. A person''s cognitive type describes the way that person most readily
    assimilates and evaluates information. This is measured in several dimensions,
    as in a preference for either lists of upfront information, or for big picture
    predetermined schemes, or in the degree to which an individual is likely to be
    influenced by the opinions of other consumers.


    This suggests a model in which each cognitive type forms a separate visitor stream
    and a separate multi-armed bandit. The difficulty is that we do not know a visitor''s
    cognitive type when they first access the website.


    Hauser, Liberali and Braun (2009) deal with this by having a Bayesian prior distribution
    over cognitive types. This is transformed into a posterior distribution by the
    evidence provided by the first few clicks after visitor accesses the website.


    The next steps in the procedure are heuristic,

    With one cognitive type we would simply assign to each successive visitor the
    format with the highest Gittens index value. With several cognitive types, each
    format has a separate index value for each cognitive type. The expected Gittens
    index is evaluated using the posterior distribution over cognitive types. The
    website then, in real time, morphs (i.e. changes) to the format with the highest
    expected Gittens index.


    With one cognitive type, the resulting purchase, or failure to purchase, is used
    via Bayes'' theorem to update the distribution of the success probability for
    the format chosen. With several cognitive types, each format has a separate distribution
    of success probabilities for each cognitive type. Each of these distributions
    is updated via Bayes'' theorem after each visitor, the extent of the adjustment
    is determined by weights given the posterior distribution over cognitive types
    for the visitor.


    An application in a similar vein is described by Babioff, Sharma and Slavkins
    (2009), who formulate a multi-armed bandit model of pay-per-click auctions for
    internet advertising. In each round the auctioneer selects an advertiser and shows
    her advertisement, which is then either clicked or not.'
