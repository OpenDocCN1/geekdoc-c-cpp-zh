    We conclude this by giving a brief presentation of the means by which Whittle
    (1980) has also proved Theorem 4.3. The proof is elegant and provides valuable
    insight.


    Whittle''s proof of Theorem 4.3. The key idea is to give a formula for the value
    function. Suppose we add to $S_1, \dots, S_n$ a standard bandit $S(\lambda)$.
    Assuming that Theorem 4.3 is true, then we know that the decision proceeds by
    continuing one or the other of the $S_i$ until all have indices less than $\lambda$.
    From this point onwards $S(\lambda)$ is continued. For this, Whittle calls the
    standard process a *retirement option*, if it is ever optimal to choose this option
    must remain optimal to the total reward thereafter will be $m = \lambda/(1-a)$.
    Suppose for $S_i$ first falls below $\lambda$ when it has process time $\tau_i$.
    Then our candidate for the value function can be


    ```

    $$\Phi(x, m) = E(R + a^{\tau_1+\dots+\tau_n}m|x)$

    ```


    where $x = (x_1, \dots, x_n)$ is the vector of initial states of $S_1, \dots,
    S_n$, and $R$ represents the discounted sum of rewards obtained from $S_1,\dots,S_n$
    under the index policy up to time $\tau = \tau_1 + \dots + \tau_n$. If $\Phi(x,m)$
    is differentiable,


    ```

    $$\frac{\partial}{\partial m}\Phi(x, m) = E(a^{\tau_1+\dots+\tau_n}m|x) = \prod_{i=1}^n
    E(a^{\tau_i}) = \prod_{i=1}^n \frac{\partial}{\partial m}\Phi_i(x_i, m)$

    ```


    Where $\Phi(x,m)$ is the value function for the SFAS stopping of just $S_i$ and
    $S_1((1-a)m)$. Assume, without loss of generality, that rewards accruing from
    $S_1,\dots,S_n$ are non-negative and bounded above by $(1-a)M$. Then by integration,
    and $\Phi(x,M) = (1-a)M$, have


    ```

    $$\Phi(x, 0) = (1-a)M - \int_0^M \prod \frac{\partial}{\partial m}\Phi_i(x_i,
    m)dm. (4.2)$

    ```


    The argument is true; however, taking (4.2) to define $\Phi(x,0)$ we have a candidate
    value function for the SFAS stopping of just $S_1,\dots,S_n$. It is well defined
    because each $\Phi_i(x_i,m)$ is a convex function of $m$ (being the maximum over
    stopping times of linear function of $m$, as in (2.4) and so differentiable for
    almost all values of $m$). If $\Phi(x,m)$ satisfies the dynamic programming equation,
    then by Theorem 2.10 (ii) it is indeed the value function, and the index policy
    is optimal.'
