    # 4.9.3 Minimum EWFT for the M/G/1 queue


    The same ideas may be employed in using other models. For example, we may use
    Klimov''s model to treat a problem of minimizing the expected weighted flow time
    (EWFT) in the M/G/1 multi-class queue. Most readers know that M/G/1 is standard
    queuing theory notation (Kendall 1951) and refer to randM (i.e. Poisson) arrivals,
    General independent service times, and 1 server. Suppose there are J job classes
    and class i arrives as a Poisson process of rate $\lambda_i$, and class i have
    independent service times all with the distribution $F_i$, each of them $c_i$
    per unit time until its arrival time and its completion.


    Let us ignore for the moment the assumption we have made in the Klimov model that
    the number of job classes is finite (from which it follows that the $v(i,j)$ define
    the same priority policy for all $\gamma$ (sufficient small). In our M/G/1 model
    we shall not permit preemption at instant, but only at certain times, or of ages.
    Each age at which preemption is allowed can be considered as a new class. So a
    class i can be thought of as passing through classes (i, 0), (i, 1), (i, 2), $\dots$,
    as it reaches successive ages of preemption is prohibited, until finally completes.
    Jobs arrive to class (i, 0) as a Poisson process of rate $\lambda_i$. This defines
    a job-linked arrivals process. If we have a finite $k$ such that each job is guaranteed
    to complete before reaching class (i, k), then there are finitely many classes.
    Thus the problem of minimizing EWFT in the multi-class M/G/1 is an example of
    the Klimov problem and the same conclusions can be reached. This gives us the
    following theorem.


    > **Theorem 4.15** The EWFT in a busy period of an M/G/1 queue with J job classes
    is minimized by the index policy defined by the $\gamma = 0$ indices for the individual
    jobs, ignoring arrivals.


