    # 2.3 Simple families of alternative bandit processes


    A bandit process is a special type of semi-Markov decision process. We might at
    this point spend several pages setting out greater detail than in the previous
    section some general definitions for Markov decision processes and semi-Markov
    decision processes. However, many readers will already be familiar with these
    ideas. Others will find them easy to understand within the context of the specific
    problems that will be addressing. So let us proceed immediately to the description
    of a bandit process. For simplicity, we shall temporarily restrict attention to
    a bandit process that moves on a countable state, say E.


    Controls are applied to a bandit process at a succession of decision times, the
    intervals between them are random variables. The first decision time is at zero.
    Transitions between states occur instantaneously at these times, and at no other
    times, as do accruals of rewards. This will prove to regard the control applied
    at a decision time as being continuously in force up to, but not including, the
    next decision time.


    When the process is in state x at decision time t, a control must be chosen from
    a set of two controls, {0, 1}. The control 0 freezes the bandit, in the sense
    that when it is applied no reward accrues and the state of the process does not
    change. Application of control 0 also initiates a time interval in which every
    point is a decision time. In contrast, control 1 is termed the continuation control.
    If at a given time the bandit is in state x and the control is applied, the process
    yields an immediate reward $dr(x)=e^{-\gamma}r(x)$, for the present we use that
    $r(x)$ is bounded. The quantities $(0<\alpha<1)$ and $\gamma (>0)$ are termed
    the discount factor and discount parameter respectively. We denote by $P(y|x)$
    the probability that the state of the process immediately after time $t$ is y,
    given that at time $t$ the process is in state x. We denote by $F(s|x,y)$ the
    probability that the time elapses until the next decision time is no more than
    s, given that at time $t$ the process is in state x and control $u=1$ is applied,
    leading to a transition to state y. Just as a Markov decision process is a (semi-Markov)
    decision process with the property that the duration between decision times has
    a constant value, a Markov bandit process is a bandit process with the property
    that the duration between decision times is constant, without loss of generality,
    we may assume to be 1.'
