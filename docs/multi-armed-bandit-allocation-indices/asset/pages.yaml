    # 8.4 Bernoulli processes


    A Bernoulli reward process is one arm of the classical multi-armed bandit problem,
    given as Problem 5 in Chapter 1. This problem was first considered by Bellman
    (1956). $X_i$ takes values 0 or 1 with probabilities $(1-\theta)$ and $\theta$.
    The parameter $\theta$ has an prior density $\pi_0 \propto \alpha\theta^{-1}(1-\theta)^{-1}$.
    In $n$ observations of them, and if $s=n-\alpha$ of $0$s, the posterior density
    $\pi_n \propto \alpha\theta^{-1}(1-\theta)^{\beta-1}$, which is a beta distribution
    with parameters $\alpha$ and $\beta$, mean $an^{-1}$ and variance $ab\n^{-2}(n+1)^{-1}$.


