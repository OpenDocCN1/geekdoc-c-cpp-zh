  md: '# PROJECT 1


    # Art Toy


    **Coding the Art Toy** introduces you to MicroWorlds EX primitives, which are
    built-in commands including setting background and **turtle** (object) colors;
    putting the turtle pen up and down; setting the pen size; moving the turtle forward
    and backward; and turning the turtle left and right. It also introduces the **home**
