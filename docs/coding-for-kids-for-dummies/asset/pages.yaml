  md: '![](img/74c7791905a327f23e0e4b132d43c15a_43_0.png)


    # # Write New Procedures in the Procedures Pane and Add Associated Buttons


    A *procedure* is a new command you create from primitives and other procedures.
    Procedures are used as shortcuts to describe a long list of steps. For example,
    if you want the turtle to draw a square that is 30 steps on a side (with the pen
    already down), you could type the following into the Command Center; press Enter/Return
    after each line:


    ```

    fd 30 rt 90

    fd 30 rt 90

    fd 30 rt 90

    fd 30 rt 90

    ```'
