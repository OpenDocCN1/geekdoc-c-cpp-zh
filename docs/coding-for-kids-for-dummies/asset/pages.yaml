  md: '# Project 10: Viral Outbreak


    # Cloning


    Although the concept is slightly different in each programming language, cloning
    is a common coding process. For example, in Game Salad, you create instances (copies)
    of a prototype, and each instance has the same appearance and information as the
    prototype. In Java, the concept of inheritance is somewhat similar. Objects inherit
    traits from the parent, but may be altered to behave in a slightly different way
    if needed.


    This ability to make object-specific alterations also exists in MicroWorlds EX.
    For example, say that you have an airplane turtle that runs a project-wide procedure
    fly. If you clone that turtle several times, all the clones possess the procedure
    fly. If you want one airplane turtle to run a different fly procedure — maybe
    a kamikaze-style of flight — you can write a new fly procedure and place it in
    the backpack of that turtle. A local procedure of the same name will override
    the project-wide procedure.


    With cloning and related processes with a programming language allows you to reuse
    work you''ve invested in a project, especially when you need to create identical
    objects or procedures that vary slightly.


