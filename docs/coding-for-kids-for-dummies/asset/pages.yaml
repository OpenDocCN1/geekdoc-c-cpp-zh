  md: '# 166 Week 3: Variables: Counting and Conditionals


    Each time you click the button, the make_10_babies procedure is executed. The
    girls and boys counters allow you to see the frequency distribution of gender
    in the baby population.


    A frequency distribution describes how many of each possible outcome appears in
    a small sample or large population. Sometimes the Happy Birthday simulation produces
    5 girls and 5 boys; other times, it makes 8 girls and 2 boys; and rarely, it produces
    0 girls and 10 boys.


