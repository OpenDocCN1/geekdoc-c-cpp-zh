  md: '# Project 1: Art Toy 25


    Try out a few of these primitives at the Command Center:


    +   - setbg: This command sets the background color. In the Command Center, type
    setbg "red" and then press Enter (Windows) or Return (Mac). This command sets
    the background-color to red, as shown in Figure 1-3.


    Now try setbg 15. The background is still red! That''s because MicroWorlds uses
    names and numbers to represent colors. The color name red is the same as the color
    number 15.


    Try a few color names such as yellow, green, and violet. Try a few more color
    numbers using any number from 0 to 139. You can type a new line of code each time,
    or replace the color you typed previously and then press Enter/Return.


    Computer programming languages have their own syntax, which are the rules for
    how the language is communicated. The syntax includes grammar (where the words
    go, and in what order) as well as punctuation (where parentheses, brackets, commas,
    and quotes must be placed). In MicroWorlds EX, opening quotation marks are often
    used with names, but closing quotation marks are never used. Quotation marks are
    not used with numbers, except in special cases.


    ![](img/74c7791905a327f23e0e4b132d43c15a_36_0.png)


    Most computer programming languages have a compiler, a separate program that checks
    your code for syntax errors before you try executing your code. Compilers give
    you error messages to help you fix, or debug, your code. MicroWorlds EX has something
    similar, a built-in interpreter, that checks for errors as you code. Error messages
    appear in the Command Center — read to see what changes you need to make your
    code.


    +   - setbg random: This command sets a random color for the background. In the
    Command Center, type setbg random 140 and then press Enter (Windows) or Return
    (Mac). This command sets the background color to a color number randomly from
    0 to 139. Execute the command a few times to see many new colors appear.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 26 Week 1: Basic Drawing, Motion, and Text Handling


    Random number generation is often used in computer code. Randomness allows you
    to make actions in your computer code behave like actions in the real world: dogs
    run in crazy-zag motions, dice rolls result in different combinations, and some
    people get during flu season while others don''t. In MicroWorlds EX, random whole
    numbers are made from 0 up to less than the number you provide. For example, the
    code random 6 results in one of these numbers: 0, 1, 2, 3, 4, or 5. The code random
    140 results in one of these numbers: 0, 1, 2, 3 . . all the way up to 139. Each
    number in the group is likely to appear as any other number in the group.


    ![](img/74c7791905a327f23e0e4b132d43c15a_37_0.png)


    +   - home: This command moves the turtle to the home position, which is the exact
    center of the workspace. To try out this command, drag the turtle to any location
    in the workspace. In the Command Center, type home and then press Enter (Windows)
    or Return (Mac). The turtle moves to the home position and points toward the top
    of the workspace.


