  md: '# Write a Geteaten Procedure and Add It to the Squid


    If the shark touches the squid, it''s calamari time! A geteaten procedure is executed
    when the squid and shark are touching. Follow these steps to write the procedure
    and add it to the squid:


    +   1. On the Procedures pane, write a geteaten procedure as follows:


    ```

    ```

    geteaten

    if touchedurtle = "shark [squid, ht chomp

    stopall]

    ```

    ```


    Because this procedure will be placed in the squid backpack, the touchedurtle
    command evaluates whether the squid is touching the shark. If they do, the consequence
    of the IF-THEN statement is executed: [squid, ht chomp stopall]. The squid is
    instructed to hide (because he has been eaten!), and the chomp recorded sound
    plays. The game then halts via the stopall primitive.


    +   2. Next, you need to tell the squid turtle to use the geteaten procedure.
    Right-click (Windows) or Ctrl-click (Mac) the squid turtle and select Open Backpack
    from the pop-up menu.


    +   3. On the backpack Rules tab, type geteaten in the OnTouching field, as shown
    in Figure 12-17.


    If the squid is touching the shark, the geteaten procedure is executed.'
  merge: -1
