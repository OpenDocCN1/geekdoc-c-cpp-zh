  md: '# Sketcher Etcher


    Etch A Sketch is a toy that first appeared in 1960 and is still around today.
    In this project, you code your own Sketcher Etcher. The Sketcher Etcher toy has
    a red frame and a light gray drawing area. Controls at the bottom of the toy allow
    a player to draw horizontally (left or right) and vertically (up and down) using
    straight lines. The player can only draw in the gray area — if the drawing pen,
    or stylus, reaches the red frame, it encounters a boundary. After drawing for
    a while, the player can erase the screen, returning to a clean gray slate, ready
    to draw again.


    ![](img/74c7791905a327f23e0e4b132d43c15a_82_0.png)'
  merge: -1
