  md: '# Write an End Game Procedure


    An endgame procedure ends the game action when the frog has failed to cross the
    roadways in three attempts. In the Procedures pane, type the following endgame
    procedure:


    ```

    to endgame

    everyone [clickoff]

    anounce [GAME OVER]

    splashpage

    end

    ```


    The endgame procedure is executed when the livesremain variable equals zero. The
    value of this variable is checked in the hit procedure, which you created in the
    earlier section, “Writing the hit procedure."


    endgame stops the motion of all characters (everyone [clickoff]) and then announces
    that the game is over (announce [GAME OVER]). Finally, it returns the player to
    the splash page (splashpage).


