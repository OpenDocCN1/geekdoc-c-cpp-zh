  md: '# PROJECT 11


    # UFO Pilot


    UFO Pilot is a side-scrolling game set in an asteroid field surrounding a distant
    planet. You''ll use real space photos from the web to create your graphics. Then
    you''ll write the code to let a player take on the role of a little alien piloting
    his UFO!


    But now that you''re becoming a master coder, you''re not going to make this an
    easy game. You''ll write commands to simulate gravity gravity so that the UFO
    constantly falls towards the planet. And you''ll build in single-key keyboard
    control so that the player can make his alien thrusters to counteract gravity.
    New coding concepts, including keyboard input, scoring, and mirrored motion apply
    here and in future programming!


