  md: '# Week 3: Variables: Counting and Conditionals


    Leaving variable indicators visible during code development, even if they will
    later be hidden, is good coding technique. During testing and debugging, the visible
    indicators make it easy for programmers to look ''behind the scenes'' and see
    how the code is functioning. It may be helpful to know the value of the secret
    number when troubleshooting final code. After all code is debugged, the indicators
    can be hidden.


    # Make a Slider to Set the Maximum Value of the Secret Number


    A player needs to know the highest possible value of the secret number. For example,
    if you say "Guess a number from 1 to 100," then 100 is the high value. Setting
    the high value of the secret number to a low number makes the game easier because
    there are fewer possible numbers to guess. Setting the high value to a high number
    makes the game more challenging.


    Create a slider to allow the player to set the high value for each game.


    +   1. From the toolbar, click the Create a Slider button.


    Or, choose Objects: New Slider from the menu bar.

    2. Move into the workspace and click.


    A Slider dialog box appears.

    3. In the Slider dialog box, fill in the following information (as shown in Figure
    8-5):

    * Name: Type Max_Number, which represents the maximum high value that the secret
    number — secnum — can ever have.

    * Minimum: Type 0 for the minimum value.

    * Maximum: Type 1000 for the maximum value.'
