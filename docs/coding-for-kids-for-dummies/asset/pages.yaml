  md: '# # Line Up the Horses at the Starting Gate


    At the start of a race, the horses need to be lined up vertically so that the
    race is fair. The horses must all have the same x-coordinates.


    Objects aligned vertically all have the same x-coordinate, like a vertical line
    on a graph.


