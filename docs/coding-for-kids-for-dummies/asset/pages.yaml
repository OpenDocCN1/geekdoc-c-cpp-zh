  md: '# Horse Race


    It''s a day at the races! And you can construct your own horse derby, complete
    with animated horses, trotting sounds, and a photo finish.


    Horse Race is a simulation featuring a racetrack you paint, as well as animated
    horses available in the MicroWorlds EX collection. You''ll add commands for setting
    the horses at the starting line and then moving the horses along the track at
    random speeds. As with any horse race, the horses run at the same time — in coding
    terms, this means that the commands controlling their racing motion execute in
    parallel. Every race is unique, so you never know which horse will win! You''ll
    also add object-specific color under commands to each horse object, and announce
    (via an alert box) which horse reaches the finish line first. Finally, you''ll
    use the Create Melody feature to make a simple trotting sound that plays throughout
    the race.


    ![](img/74c7791905a327f23e0e4b132d43c15a_102_0.png)'
