    # Parallel versus serial execution


    Some aspects of coding in Micro EX can be considered object-oriented each object
    does its thing according to rules established within the object. Those things
    can happen in parallel, meaning that multiple objects can be executing their own
    commands at the same time. It''s like a rock band in which five instruments are
    playing different parts of the music simultaneously. Parallel execution of commands
    is contrasted with serial execution, in which commands execute one at a time,
    including commands associated with different objects.


    Here''s an example that helps you visualize the difference between parallel and
    serial execution. Create two turtles and issue the command forever [everyone fd
    1 wait 1] in the Command Center. Note that the turtles take moving, one after
    the other; this is serial execution. Now, start over and create two turtles with
    each possessing the command fd 1 wait 1 set to forever in its OnClick field. Issue
    the command everyone [onclick] in the Command Center. Note that the turtles move
    simultaneously; this is parallel execution.


    The horses in Horse Race are coded to execute their movements in parallel with
    one another, which is what real horses would do at the track. Additionally, the
    trotting sounds execute in parallel with the racing horses to create the impression
    that the horses are stomping their hooves into the dirt as they run.


    ![](img/74c7791905a327f23e0e4b132d43c15a_117_0.png)'
  merge: -1
