  md: "# Week 4: Multiturtles, Keyboard Control, Shooters\n\nThe go procedure instructs\
    \ everyone — the squid turtle, the ink turtle, and the shark turtle — to set its\
    \ x-coordinate to a random number up to 740, which is the width of the workspace.\
    \ This has the effect of placing the turtles in random positions horizontally\
    \ across the screen, with the objective to separate the squid from the shark at\
    \ the start of the game. (See Project 10 for an explanation regarding how this\
