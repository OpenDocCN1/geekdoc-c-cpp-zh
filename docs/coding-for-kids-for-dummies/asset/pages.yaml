  md: '# 42 Week 1: Basic Drawing, Motion, and Text Handling


    # Polygon angles and turtle turns


    Turtle turn angles in polygons are called exterior angles. Polygons also have
    interior angles, the angles inside the polygon. See the following figure. Adding
    up all the exterior angle turns of a polygon always equals 360 degrees; this is
    because the turtle makes one complete circle as it draws any polygon. That''s
    why the repeat number times the turn angle always equals 360. However, adding
    up all the interior angles of a polygon results in different numbers for different
    polygons. A triangle has an interior angle sum of 180 degrees; a square has 360
    degrees; a pentagon has 540 degrees. The more interior angles, the greater the
    interior sum. Can you figure out a pattern?


    ![](img/74c7791905a327f23e0e4b132d43c15a_53_0.png)


    Procedures you create in a project exist only within that project — they can only
    be used in other projects if you copy and paste them into the new project.


    # Save, Test, and Debug


    Choose File: Save Project from the menu bar to save your game. Your finished game
    should look similar to Figure 1-15.'
