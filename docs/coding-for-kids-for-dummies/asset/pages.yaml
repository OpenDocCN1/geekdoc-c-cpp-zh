    # Create a Project Variable for Lives


    Your game needs a way to show how many lives are left. Traffic Dodge begins with
    three lives, and each time the player''s frog is hit by a traffic turtle, it loses
    a life. When the player has lost all three lives, the game is over.


    In projects with a single page, you can just create a text box variable for lives.
    But the value of a text box variable exists on the page where it''s located. This
    means that you can''t carry over the value of a lives variable from a Level 1
    page to a Level 2 page.


    A project variable is a variable that exists everywhere in your game and whose
    value carries over from one page to another. To create a project variable that
    will be used to keep track of frog lives, enter the following command in the Command
    Center:


    ```

    createprojectvar "livesremain"

    ```


    This command creates a new project variable with the name livesremain. The new
    project variable is visible on the Project pane, as shown in Figure 15-7.


