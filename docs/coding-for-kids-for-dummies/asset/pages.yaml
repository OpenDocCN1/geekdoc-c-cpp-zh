  md: '# Write a Shoot Procedure


    A shoot procedure allows the squid to suddenly reveal a secret weapon — a puff
    of ink! When shoot executes, the ink cloud changes from hidden to showing, and
    moves at a target in the direction the squid is headed.


    Continue working on the project Procedures pane and write a shoot procedure as
    follows:


    ```

    to shoot

    tto [ink]

    setx squid''s "xcor"

    sety squid''s "ycor"

    seth squid''s "heading"

    st

    glide 200 0.4

    ht

    tto [squid]

    end

    ```


    When a player is driving the squid around the ocean using the swimshoot procedure,
    the shark approaches. The player presses the spacebar to shoot at the squid. This
    action executes the shoot procedure, which works as follows:


    +   - The ink becomes the active object using tto [ink], meaning "talk to the
    ink turtle."


    +   - The ink turtle sets its x-coordinate (xcor), its y-coordinate (ycor), and
    its heading (heading) to match the squid''s coordinates and heading.


    +   - Then the ink becomes visible (st). This makes it appear that the squid has
    been secretly carrying the ink as it swims around.


    +   - The ink then moves away from the squid in the direction the squid is heading
    using the glide command. This looks like the ink is being fired. After the ink
    moves 200 pixels at a speed'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Week 4: Multiturtles, Keyboard Control, Shooters


    of 0.4, it hides (ht). The shoot procedure doesn''t address whether the ink hits
    the shark — that will occur in a different procedure.


    glide is an alternative motion command for forward, and it is useful whenever
    you want to create smoother movement. use the glide command, indicate both a distance
    and a speed, as in glide 200 0.4, which means move 200 pixels at a speed of 0.4.
    Tinker with the distance and create to create the motion you desire.


    ![](img/74c7791905a327f23e0e4b132d43c15a_283_0.png)


    +   Finally, the shoot procedure transfers control back to the squid using tto
    [squid] so that the player can return to driving the squid. Note that while the
    ink approaches the shark, the squid cannot move... he''s exhausted from firing
    off his ink!


    ![](img/74c7791905a327f23e0e4b132d43c15a_283_1.png)


    # Nesting procedures


    The shoot procedure is nested inside the swimshoot procedure. Nesting means that
    a procedure is called from inside another procedure. In reality, all of the instructions
    of the shoot procedure could have been included in swimshoot, but it would have
    been really messy to write the code that way.


    Here''s an analogy from the kitchen to better understand why we need nesting:
    When making a cake, you need flour, eggs, sugar, milk, and frosting, all put together
    in a certain way. Frosting is made from its own set of ingredients in a process
    that follows the main cake recipe. It''s too complicated to explain how to make
    frosting in the middle of explaining how to make the cake — so the "frosting"
    ingredient is simply nested in the cake recipe, with details about making the
    frosting following later.'
  merge: -1
