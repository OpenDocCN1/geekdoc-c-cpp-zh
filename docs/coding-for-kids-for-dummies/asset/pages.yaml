    # Create Buttons to Execute Primitives


    The Command Center is a good place to test out commands as you develop a program.
    But users of your program don''t want to type in commands! Users want a simple
    way to operate your program.


    You operate your television, phone, and computer through a graphical user interface
    (also called a GUI), which has buttons, menus, and other tools for communicating
    with each device. MicroWorlds EX provides ways for you to build your own GUI to
    make it easy for people to use your computer program.


    Instead of asking a user to type in a command such as setbg red to change the
    workspace of the Art Toy to the color red, you can make a button to do the work
    instead. To create a button, provide two pieces of information: a label for the
    user, and an instruction for the computer.'
