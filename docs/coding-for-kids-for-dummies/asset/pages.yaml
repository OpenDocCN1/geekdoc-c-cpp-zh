  md: '# 162 Week 3: Variables: Counting and Conditionals


    # Write a Reproduce Procedure and Make an Associated Button


    My students always ask me, “What does reproduce mean?” In our computer simulation,
    it means to make a new baby. (In biology, it means that, too, but I won’t explain
    those details. There may be a stork involved.)


    You probably know from simple genetics that if a baby has certain genes, it’s
    a girl. If it has different genes, it’s a boy. Notice that I used the words *if*
    and *then* when writing those sentences. You will use the same structure to create
    IF-THEN commands in your program code. These commands let you show the gender
    of the newly made baby. Gender means boy or girl.


    Write a procedure to make a baby and show its gender as follows:


    +   1. In the Procedures pane, type the `reproduce` procedure as shown:


    ```

    to reproduce

    setter random 2

    if gender = 0 [setsh "pink setgirls girls + 1]

    if gender = 1 [setsh "blue setboys boys + 1]

    end

    ```


    This procedure sets the value of `gender` randomly to 0 or 1. The number 0 means
    that a girl is born, and the number 1 means that a boy is born. Each number has
    an equal probability of appearing, so there is a 50% chance of creating a girl
    and a 50% chance of creating a boy.


    The procedure then uses two IF-THEN conditional statements. Each statement affects
    the shape worn by the turtle and a counter variable:


    +   The first IF-THEN says that if the `gender` variable value is 0, then set
    the turtle shape to pink (the girl baby shape) and add 1 to the current value
    of the `girls` variable.


    ![](img/74c7791905a327f23e0e4b132d43c15a_173_0.png)'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Project 7: Happy Birthday


    The second IF-THEN says that if the gender variable value is 1, then set the turtle
    shape to blue (the boy baby shape) and add 1 to the current value of the boys
    variable.


    Here, the girls variable and the boys variable serve as counters by keeping track
    of the total number of girls and the total number of boys.


    IF-THEN conditionals are logic statements that are common in coding. The general
    form is IF CONDITION THEN consequence. However, different computer languages format
    IF-THEN conditionals in different ways. In Micro the format is IF condition [consequence].
    The commands in the consequence are executed when the condition is true; otherwise,
    the consequence is ignored. See Project 8 for additional information on IF-THEN
    conditionals.


    +   2. Create a button to run the procedure. From the toolbar, click the Create
    a button. Then click anywhere in the workspace.


    +   3. In the Button dialog box, fill in the following information (as shown in
    Figure 7-7):


    +   * Label: Type Reprodu in the Label field to name the button.


    +   * Instruction: Type reproduce in the Instruction field.


    +   * Do It: Select the Once button.


    +   * Visible: Select this check box.


    | Name: | button2 |

    | --- | --- |

    | Label: | Reprodu |

    | Instruction: | reproduce |

    | Do It: | Once Visible |

    | | Forever |


    Figure 7-7'
  merge: -1
