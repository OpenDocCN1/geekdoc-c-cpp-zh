  md: '# Week 4: Multiturtles, Keyboard Control, Shooters


    1. On the project Procedures tab, type this procedure:


    ```

    to roam

    glide 50 0.5 rt random 360

    end

    ```


    The roam procedure instructs the turtles to move and turn so that they appear
    to be wandering around like real turtles. The command glide 50 0.5 tells each
    turtle to walk 50 pixels at a speed of 0.5, and the command rt random 360 tells
    each turtle to turn right by a random angle from 0 to 359 degrees.


    Adjust the glide distance and speed as well as the turn angle to create the motion
    you prefer.


