  md: '# Happy Birthday


    Real-world events like counting how many babies are born means collecting lots
    of data. Sometimes, this can take too long. Creating a simulation helps you to
    understand an event in less time. A simulation is a pretend version of the real
    event. In this project, you will create a maternity simulation — a model of a
    hospital room where babies are born and celebrate their "zero birthdays."


    Instead of taking nine months for a baby to arrive, this simulation makes a pretend
    newborn boy or girl by clicking a button. Then, using the repeat command, you
    can make hundreds of babies (or more) to represent all the births in a state (or
    country). Using the simulation, you can quickly look at the distribution of births,
    meaning how many boys and girls are born in a large population of babies. Say
    "Happy Birthday!"


    ![](img/74c7791905a327f23e0e4b132d43c15a_162_0.png)'
  merge: -1
