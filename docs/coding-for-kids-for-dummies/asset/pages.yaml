  md: '# Project 2: Mini Golf 61


    # Code the Ball to Bump Off the Obstacle


    Part of what makes a miniature golf game fun is the challenge of getting past
    the obstacles between the tee and hole. In this game, there is one obstacle, a
    mountain. The player may want to hit around the obstacle, or hit the obstacle
    so that the ball bounces or reflects off the obstacle.


    In MicroWorlds EX, you can code an object to react to other objects that it touches.
    This is done in the OnTouching field of the Rules tab of the backpack. Any commands
    or procedures in the OnTouching field of a turtle are executed when the turtle
    bumps into another turtle.


    The golf ball turtle bounce off the obstacle turtle as follows:


    +   1. In the golfball backpack, switch to the Rules tab.


    +   2. At the OnTouching field, type rt 90 glide 20 0.05, as shown in Figure 2-11.


    ![](img/74c7791905a327f23e0e4b132d43c15a_72_0.png)


    Figure 2-11'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 62 Week 1: Basic Drawing, Motion, and Text Handling


    Here''s how the commands work. The rt 90 command turns the golf ball turtle to
    the right 90 degrees. Then glide 20 0.05 moves the ball away from the obstacle
    by a short distance at a slow speed. The motion should look as though the golf
    ball is bouncing off the obstacle (the mountain).


    +   3. Test your commands by deliberately driving, pushing, or tapping the golf
    ball into the obstacle and looking at the result. Revise your commands as needed
    to create the bounce motion you want. After you are satisfied with the motion,
    close the backpack by clicking its X button.


    Collisions — two turtles bumping into each other are common in computer program
    execution, especially video games! Some collisions result in a bounce, others
    increase a score, and others reduce the number of lives. Throughout the projects
    in this book, there will be lots of opportunities to code collision outcomes.


    ![](img/74c7791905a327f23e0e4b132d43c15a_73_0.png)


