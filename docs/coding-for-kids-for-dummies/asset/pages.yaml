  md: '# 344 Week 5: Advanced Coding


    # # Write a Jump Procedure and Add It to the Frog


    A jump procedure lets the player jump, or control, a game character by using the
    keyboard.


    Other programming software, including Game Salad, uses built-in keyboard control
    commands. However, MicroWorlds EX enables you to learn and control the underlying
    details of keyboard control, a skill that will prove useful in more complex coding
    endeavors.


    # # Writing the jump procedure


    On the project Procedures tab, write a jump procedure as follows:


    For a Windows game:


    ```

    to jump

    let [key readchar]

    if (ascii :key) = 37 [seth 270 fd 40]

    if (ascii :key) = 38 [seth 0 fd 40]

    if (ascii :key) = 39 [seth 90 fd 40]

    if (ascii :key) = 40 [seth 180 fd 40]

    end

    ```


    For a Mac game:


    ```

    to jump

    let [key readchar]

    if (ascii :key) = 28 [seth 270 fd 40]

    if (ascii :key) = 30 [seth 0 fd 40]

    if (ascii :key) = 29 [seth 90 fd 40]

    if (ascii :key) = 31 [seth 180 fd 40]

    end

    ```


    The jump procedure reads the arrow key pressed on the keyboard by the player.
    It then points and moves the frog in the associated direction. Every arrow key
    is assigned a different compass direction so that the turtle points in the chosen
    direction and moves a'
