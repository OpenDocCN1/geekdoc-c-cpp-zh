    # Mini Golf


    One of the many cool things you can do when learning to code is making a game
    or toy. This project guides you in creating your own miniature golf game that
    you can share with friends.


    In the role of game-maker, you are in control of graphics tools as you paint a
    golf hole, and then create ball and obstacle objects. You put your button-making
    skills to use as you code motion and direction commands. Next, you code how the
    ball reacts to the environment — falling in a water trap or the hole, as well
    as reflecting off an obstacle.


    Several new primitive commands are used in this golf course, plus a couple of
    easy-to-write procedures. When complete, consider adding new features to make
    your game even more challenging and fun to play!


