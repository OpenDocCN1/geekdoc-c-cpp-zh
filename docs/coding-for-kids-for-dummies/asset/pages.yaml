  md: '# Project 4: Horse Race


    # Making melodies


    The Melody dialog box (refer to Figure 4-14) features seven instruments: a piano,
    an electronic keyboard, a xylophone, an electric guitar, a cello, a flute, and
    a marimba. Clicking the icon of an instrument selects that instrument to play
    a score, or series of notes and rests you create. Here''s how to create your melody:


    +   **Add notes:** Create your series of notes by clicking each note in order
    to the large keyboard.


    +   **Specify the duration of a note:** Select the note and then click the icon
    for whole note, half note, dotted quarter note, quarter note, or eighth note.


    +   **Add rests:** You can add rests of different durations by clicking a rest
    symbol (located below the large keyboard). Like editing a document, you can click
    anywhere in your score and add new notes or rests at the insertion point; delete
    notes and rests; or select a series of notes and change your instrument.


    +   **Adjust volume and tempo:** The Volume slider and Tempo slider control the
    volume and tempo during playback.


    +   **Control playback:** The Play and Stop buttons allow you to play back or
    halt playback while editing.


    +   **Change name of score:** The default name of your score is melody1, but you
    can enter a different name in the Name text box. Just be sure there are no spaces
    in the name.


    Finally, selecting the Show check box shows the name of your audio creation with
    its icon when displayed in the workspace, and selecting the Visible check box
    makes the icon visible in the workspace.


