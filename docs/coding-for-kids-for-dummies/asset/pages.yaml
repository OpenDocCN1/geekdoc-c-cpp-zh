    # Write a Fall Procedure


    Your scene will use a fall procedure to make the snowflakes fall with a gentle,
    irregular pattern to the ground.


    In the Procedures pane, write a fall procedure as follows:


    ```

    fall

    seth 180

    rt random 45

    glide 100 0.2

    lt random 45

    glide 100 0.2

    end

    ```


    The fall procedure is executed forever from each snowflake turtle''s OnClick field
    when the turtle is clicked. (This will be completed in "Make a Let it Snow Button.")


    The fall procedure sets the snowflake turtle heading (seth) to south (180), and
    then turns the heading slightly to the right (rt) by a random quantity (random
    45). The turtle then glides 100 pixels at a slow pace of 0.2 (glide 100 0.2).
    Finally, the turtle performs a slight left turn (lt) by a random quantity (random
    45), followed by the same glide command it executed previously (glide 100 0.2).'
  merge: -1
