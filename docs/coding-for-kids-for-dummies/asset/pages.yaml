  md: '6. Type xcor < -260 (or whatever value you found in Step 3) in the When field,
    and type bk 5 in the What field, as shown in Figure 3-9. Click OK.


    ![](img/74c7791905a327f23e0e4b132d43c15a_92_0.png)


    Figure 3-9


    These two commands — xcor < -260 and bk5 — mean that if the user clicks the L
    button and the x-coordinate of the stylus is less than -260, the stylus moves
    backward 5 pixels. Because the L button command — seth 270 fd 5 (see the preceding
    section) — moves the stylus forward 5 pixels, which has the effect of not moving
    the stylus at all — and it does not move left into the red frame.


    7. Click OK to close the dialog box.


    8. Repeat Steps 1–4 for the right boundary between the gray drawing area and the
    red frame. Be sure to check the Xcor value at this boundary.


    9. In the User-Defined Event dialog box, type xcor > 260 (or whatever xcor value
    you have) in the When field, and bk 5 in the What field. Click OK.


    The Rules tab of the stylus backpack now looks something like Figure 3-10.


    > TIP If you need to edit a When This... Do That command, click the command to
    select it. Then right-click (Windows) or Ctrl-click (Mac) and select Edit from
    the pop-up menu. Then make your changes in the dialog box.'
  merge: -1
