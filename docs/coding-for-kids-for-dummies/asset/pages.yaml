  md: '# Write a Keyboard-Controlled Fly Procedure


    This is your first project that includes a keyboard-controlled interface. It uses
    a single key on the keyboard — the up arrow key — to execute the fly procedure
    by the UFO. The fly procedure lets a player fire the thrusters on the UFO to oppose
    the pull of gravity from the moon.


    On the project Procedures tab (located in the lower-right corner of the window),
    write a fly procedure as follows:


    For a Windows game:


    ```

    to fly

    let [key readchar]

    if (ascii :key) = 38 [seth 0 fd 20 wait 1]

    end

    ```


    For a Mac game:


    ```

    to fly

    let [key readchar]

    if (ascii :key) = 30 [seth 0 fd 20 wait 1]

    end

    ```


    Simply put, the fly procedure reads the character of the key pressed by a player.
    If the key is the up arrow (ASCII 38 in Windows, or ASCII 30 on a Mac), the commands
    inside the square brackets are executed. Here, the example UFO has its heading
    set to north (seth 0) and then it moves in direction 20 pixels (fd 20) with a
    wait of 1. You may need to tinker with the code to create the upward thrust you
    want.


    Note that when the UFO turtle is clicked on, its OnClick commands constantly point
    and move south. This fly procedure will be put into the Go! button, which you
    create later in this project.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Week 4: Multiturtles, Keyboard Control, Shooters


    See Project 12 for a more detailed explanation of how a keyboard-controlled procedure
    works.


    If you plan to distribute your game on both Windows and Mac platforms, you can
    put both sets of ASCII keyboard commands into the fly procedure so that the game
    operates everywhere. Just type the if line of code for Windows, followed by the
    if line of code for the Mac on the next line.


    # Write a Scoring Procedure for Navigating Asteroids


    As the player successfully navigates the UFO past each column of asteroids, a
    point is scored. Write a checkpass procedure to check for this successful passage.


    On the Project Procedures pane, write the checkpass procedure as follows:


    ```

    to checkpass

    if xcor = 0 [setscore score + 1]

    end

    ```


    Think about what is happening in checkpass. Because the UFO moves horizontally,
    its x-coordinate is always 0. So if a moving asteroid column has an xcor of 0
    and hasn''t collided with the UFO, the score increases by 1 (setscore score +
    1). Because checkpass is based on the motion of the asteroids relative to the
    UFO, it will be placed in the asteroid turtles.


    # Code the Motion of the Asteroids and Include the Scoring Procedure


    The asteroids will move from east to west across the screen, barraging the little
    UFO and leaving only a small gap for the alien pilot to fly through. There are
    three columns of asteroids. Each column of asteroids has a top turtle and a bottom
    turtle; that''s'
