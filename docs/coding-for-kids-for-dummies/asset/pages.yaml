  md: '# PROJECT 5


    # Winter Wonderland


    Depending on what part of the world you live in, may see a Winter Wonderland every
    year — or not at all! Regardless of whether such a scene exists outside your window,
    you can bring it to life on your computer screen.


    Winter Wonderland is an animated scene featuring blinking tree lights, gently
    falling snowflakes, imported music, and a sky that cycles between night and day.
    You''ll create your own shapes for the blinking light bulbs and use a pick command
    to change the bulbs. You''ll also make your own animated shapes for the snowflakes
    and write a procedure that makes them appear to fall. One thing you won''t need
    to do — shovel the driveway!


