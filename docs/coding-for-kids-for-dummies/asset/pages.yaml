  md: '# 180 Week 3: Variables: Counting and Conditionals


    2. Type the following procedure:


    ```

    to compchoosesecret

    setsecnum 1 + random Max_Number

    set "blank"

    checkguess

    end

    ```


    Here''s how the procedure works:


    +   a. The setsecnum 1 + random Max_Number command sets the value of the secnum
    (secret number) variable to 1 + random Max_Number. This means that secnum ranges
    from values of 1 to 1000.


    The random command generates positive integers from 0 through one less than the
    index number. For example, random 6 can generate the numbers 0, 1, 2, 3, 4, or
    5. However, many times, you will want your random numbers to start at 1, not 0.
    So by adding 1 to the random command: 1 + random 6. This command can generate
    the numbers 1, 2, 3, 4, 5, or 6.


    ![](img/74c7791905a327f23e0e4b132d43c15a_191_0.png)


    The command 1 + random 6 and the command random 6 + 1 are not equivalent. The
    command 6 + 1 is equivalent to random 7 and can generate the numbers 0, 1, 2,
    3, 4, 5, or 6.


    +   b. The procedure then sets the shape of the turtle to blank so that the computer
    display shows no message.


    +   c. The final command is checkguess, a procedure you will write in the next
    section.


    +   3. Create a Computer ... choose! button to execute the compchoosesecret procedure.
    From the toolbar, click the Create a Button button.


