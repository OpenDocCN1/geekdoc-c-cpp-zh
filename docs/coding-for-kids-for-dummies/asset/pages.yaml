  md: '# Viral Outbreak


    No one likes to be sick, not even a turtle! Viral Outbreak is a simple simulation
    that models catching a cold in a population of turtles. You begin by coding a
    single turtle to move and react to the background and other turtles — and then
    clone that turtle, creating as many turtles as you want.


    When a turtle gets sick, it infects other turtles that it bumps into. But if a
    sick turtle wanders into a hospital, it becomes well again. You can change how
    fast the turtles roam around and the size of the hospital, as well as add other
    new features to make your model even more realistic!


    ![](img/74c7791905a327f23e0e4b132d43c15a_224_0.png)'
  merge: -1
