  md: '# Squid Ink


    When you’re a simple, nonviolent squid, it can be hard to defend your ocean home.
    But armed with ink sacs, you can swim around safely, releasing a disorienting,
    black cloud whenever a nasty shark gets too close!


    In Squid Ink, you build a shooter-style game. The squid''s motion is keyboard
    controlled, and the shark glides constantly in a direction towards the squid.
    Additionally, the squid carries hidden cargo — his ink cloud — that matches the
    squid''s x and y coordinates until it is shot at the shark. The touchedturtle
    commands in IF-THEN conditionals check whether the ink touches the shark, as well
    as whether the shark touches the squid. Recorded audio plays if either touching
    condition is met.


