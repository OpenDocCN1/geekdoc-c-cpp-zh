  md: '# Make Traffic Move


    Traffic moves through the lanes and gets in the way of the frog crossing safely.
    Turtle objects in a single lane should all move at the same rate of speed, but
    different lanes can move at different speeds. Make traffic move as follows:


    +   1. Open the backpack of one of the traffic turtles. On the backpack Rules
    tab, enter a speed value in the OnClick field and select the Forever radio button.


    For example, set the speed value in the OnClick field to fd 10 wait 1.


    +   2. In the workspace, click the turtle to click it on and see it. Click the
    turtle again to click it off and stop its motion.


    Try increasing or decreasing the value of fd or wait to see how it affects the
    speed of the turtle. Each has a different effect: fd controls the distance covered
    during each command execution, and wait controls the pause time during each execution.


    The more objects are moving in your game, the slower they move — just like real
    traffic!


