- img_proc: true
  md: '# 214 Week 4: Multiturtles, Keyboard Control, Shooters


    # Brainstorm


    We often hear of something going viral. Although the original meaning involved
    the rapid spread of a virus, these days “going viral” applies to anything that
    spreads through a network of people, places, or technology. Consider some of these
    ideas as your subject matter when building Viral Outbreak:


    +   - Sharing of a YouTube video or Facebook post, with colliding turtles sharing
    a post, and the popularity of the post increasing as more turtles receive and
    share it


    +   - Retweeting of a Twitter post, with an infected turtle tweeting, and every
    turtle it bumps into receiving the tweet; those recipients then retweet when they
    bump into other turtles, and so on


    +   - Spreading popularity of a fashion accessory: an infected turtle wears an
    accessory, and any turtle bumps into copies its style by wearing the same accessory,
    and so on


    +   - Transmission of a computer virus through email, with each turtle possessing
    the infected email passing it along to any other turtle with which it collides


    # Start a New Project


    A new project for your animation as follows:


    +   1. Start MicroWorlds EX.

    2. From the yellow MicroWorlds EX startup screen, select Free Mode.

    A new project opens.

    3. From the menu bar, choose File > New Project > Full Screen 640 x 480.


    ![](img/74c7791905a327f23e0e4b132d43c15a_225_0.png)'
