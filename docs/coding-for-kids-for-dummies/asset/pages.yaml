  md: '# # Rock, Paper, Scissors


    Few recess games are as familiar or fast as Rock, Paper, Scissors. Using only
    your hands, you and an opponent randomly choose an object and reveal your choice
    at the same time. Based on the choices, one competitor wins, and one loses: Rock
    beats scissors, paper beats rock, and scissors beat paper. If both competitors
    choose the same object, the game is a draw (tie).


    In this project, you build your own Rock, Paper, Scissors game with player versus
    computer. The game uses compound conditionals to determine the winner of each
    round. A compound conditional has an if-then plus conjunctions (and, or, not)
    in the code. This code format is used when more than one condition must be met
    in order for a consequence to happen. “If it is Monday and it is 8 a.m., then
    I ride the bus to school.” If the player chooses rock and the opponent chooses
    scissors, rock beats scissors (player wins).


    ![](img/74c7791905a327f23e0e4b132d43c15a_298_0.png)'
  merge: -1
  pgno: 298
- img_proc: true
