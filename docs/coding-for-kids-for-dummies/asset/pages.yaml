  md: '# Write an Initialize Procedure and Make an Associated Button


    Like any simulation, the maternity ward needs a starting point. A procedure is
    needed to start, or initialize, the model. The procedure represents starting a
    new shift at a hospital or starting a new day when the number of babies born is
    zero.


    Follow these steps to write an initialize procedure and create a button to execute
    it:


    +   1. Click the project Procedures tab (located in the lower-right corner of
    the window).


    +   2. Type the initialize procedure as shown:


    ```

    to initialize

    setgirls 0

    setboys 0

    end

    ```


    This procedure sets the value of the girls and boys variables to zero. Remember,
    each of these variables counts how many girls and how many boys are made with
    the model. Now that you have written the initialize procedure, MicroWorlds recognizes
    it as a new command that you can use!


    +   3. Next, you need to create a button to run the procedure. From the toolbar,
    click the Create a Button button. Then click any-where in the workspace.


    +   4. In the Button dialog box, fill in the following information (as shown in
    Figure 7-6):


    +   * Label: Type Initialize in the Label field to name the button.


    +   * Instruction: Type initialize in the Instruction field.'
  merge: -1
