  md: '# Week 1: Basic Drawing, Motion, and Text Handling


    Figure 2-6 shows that the Xcor equals -190 and the Ycor equals -10. This means
    the golf ball is positioned at the coordinates (-190, -10). Note that your Xcor
    and Ycor values may be different depending on what makes sense in your game. You
    will need these coordinates later in the "Write a Watrap Procedure" section and
    the "Write a Win Procedure" section. Leave the backpack open.


    Coordinates are the mathematical way of naming a position on a graph. René Descartes
    credited it with the method. Coordinates in two dimensions, like your MicroWorlds
    EX workspace, are listed as a pair (x, y). The first number is the x-coordinate
    (position right to left) and the second number is the y-coordinate (position top
    to bottom).


    ![](img/74c7791905a327f23e0e4b132d43c15a_67_0.png)


    # Create Controls for Aiming and Hitting the Golf Ball


    Aiming the golf ball means pointing it in the direction you want to travel. Hitting
    the golf ball can be done in one of three ways:


    +   - Driving (hitting a long distance)


    +   - Putting (hitting a short distance)


    +   - Tapping (hitting a tiny distance)


    As the game designer and coder, you want to provide easy-to-use controls for both
    aiming and hitting the ball. Create buttons for pointing the ball North, East,
    South, or West. Then create buttons to Drive, Putt, and Tap the ball.


    Pointing a turtle in a direction requires turning it. Right turn (rt) and left
    turn (lt) are relative commands because they turn the turtle relative to where
    it currently points. Setting heading, or seth, is an absolute turn command because
    it causes the turtle to point to the selected heading regardless of where it was
    pointing before the turn. To use the seth command, you must indicate the degree
    angle around a circle where the turtle should point; for example, seth 90 points
    east. See Figure 2-8.


    ![](img/74c7791905a327f23e0e4b132d43c15a_67_1.png)'
