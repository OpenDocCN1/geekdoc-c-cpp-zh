  md: '# 304 Week 5: Advanced Coding


    One branch of mathematics where compound conditionals of all sorts appear is logic.
    From formal logic that forms the basis of argumentation and proofs (you''ll do
    these in geometry!) to puzzle logic — including classics such as Wolf, Sheep,
    and Cabbage (see www.plastelina.net) — you''ll find conditionals.


    ![](img/74c7791905a327f23e0e4b132d43c15a_315_0.png)


    ![](img/74c7791905a327f23e0e4b132d43c15a_315_1.png)


    # Exploring conditional statement formats


    The format of a conditional statement is very different depending on the programming
    language used:


    +   - Plain words: If a first condition is satisfied or a second condition is
    satisfied, then give the consequence.

    - MWEX: If or condition1 condition2 [consequence]

    - Python: If condition1 or condition2: consequence


    Here is an example you can probably relate to:


    +   - Plain words: If I''m tired or I''m hungry, then I can''t concentrate

    - MWEX: If or (I''m tired) (I''m hungry) [I can''t concentrate]

    - Python: If I''m tired or I''m hungry: I can''t concentrate


    # Save, Test, Debug, and Enhance


    Chose File: Save Project from the menu bar to save your game. Test your game by
    playing it several times. Test out each button and make sure that each combination
    says the correct result. This will help you work out the bugs.'
