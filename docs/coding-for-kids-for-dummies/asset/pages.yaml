- img_proc: true
  md: "# Project 8: Number Guessing Computer\n\nConditionals, or IF-THEN statements,\
    \ are logic statements that appear in math, computer programming, and philosophy.\
    \ The first part of the IF-THEN statement is called the condition, or the IF.\
    \ The second part is the consequence, and the THEN. The condition can be either\
    \ TRUE or FALSE: When the condition is TRUE, the consequence is executed, and\
    \ when the condition is FALSE, the program code skips to the next line. An example\
    \ you may find occurs in your house: IF it's later than 10pm, THEN your parents\
    \ announce it's bedtime.\n\nFor this project, the checkguess procedure is first\
    \ called from the choosesecret procedure, which you added in the preceding step.\
    \ checkguess is then executed recursively (the procedure commands itself to run\
    \ again) until the player guesses the correct number.\n\n# Recursion\n\nRecursion\
    \ is an important idea in both math and computer science. You may have heard of\
    \ the word recur, which means to happen over and over:\n\n+   - In everyday life,\
    \ recursion can be thought of as a pair of mirrors that face each other and reflect\
    \ an image over and over again. In mathematics, there is a field called fractal\
    \ geometry in which an object is self-similar — it looks the same whether you\
    \ look at it far away or zoomed in.\n computer science, recursion is important\
    \ because it allows a procedure to call itself from a line of code inside the\
    \ procedure. By using recursion in a procedure, you can make the procedure execute\
    \ over and over until a condition is met — at which point the procedure is exited.\
    \ In a number guessing game, a recursive procedure allows the player to guess\
    \ again and again until the player reaches the target number."
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Week 3: Variables: Counting and Conditionals


    On the Procedures tab, type the following checkguess procedure:


    ```

    to checkguess

    question [What''s your guess?]

    if answer = secnum [setsh "correct tune stopall"]

    if answer > secnum [setsh "toohigh checkguess"]

    if answer < secnum [setsh "toolow checkguess"]

    end

    ```


    Here''s what happens when the checkguess procedure is executed:


    +   1. question asks for input from the player.


    The question What''s your guess? is displayed onscreen, as shown in Figure 8-13.


    The question command is a primitive, which means it''s part of the MicroWorlds
    EX vocabulary and can be used to show a dialog box with a specific question.


    ![](img/74c7791905a327f23e0e4b132d43c15a_195_0.png)


    Figure 8-13'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Project 8: Number Guessing Computer 185


    2. The player then types numerical input into the response field and clicks OK.


    3. MicroWorlds EX names the player''s input, `answer`, and the dialog box closes.


    4. The player''s answer is then compared to the secret number. This comparison
    has three possibilities:


    +   * The player''s answer equals the secret number. If the player''s answer equals
    the secret number (`answer = secnum`), the player has guessed correctly! The consequence
    is that the display turtle is set to the `correct` shape, a `tune` is played (you
    will create this later), and the `stopall` command halts procedures from running.


    +   * The player''s answer is greater than the secret number. If the player''s
    answer is greater than the secret number (`answer > secnum`), the player has guessed
    too high. The consequence is that the display turtle is set to the `tohigh` shape,
    and the `checkguess` procedure is executed so that the player can guess again.


    +   * The player''s answer is less than the secret number. If the player''s answer
    is less than the secret number (`answer < secnum`), the player has guessed too
    low. The consequence is that the display turtle is set to the `toolow` shape,
    and the `checkguess` procedure is executed so that the player can guess again.


    > When comparing two numbers, a and b, there are three possibilities regarding
    relationship: a=b, a>b, or a<b. In mathematics, this property of numbers is called
    the `law of trichotomy`. (And in computer science, this property leads to a great
    number-guessing game!)


    ![](img/74c7791905a327f23e0e4b132d43c15a_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: "# Week 3: Variables: Counting and Conditionals\n\n# Formatting conditionals\n\
    \nAll programming languages use conditionals, or IF-THEN statements. However,\
    \ each language formats the IF-THEN statement its own way. In English, here's\
    \ an example of an IF-THEN statement: IF it is later than 10pm, THEN you announce\
    \ it is bedtime.\n\nMicroWorlds EX uses the IF but replaces the THEN with square\
    \ brackets:\n\n```\nif time > 10 [announce [bedtime]]\n```\n\nJavaScript, a language\
    \ used for web pages, replaces the THEN with curly braces:\n\n```\nif (time >\
    \ 10) {\n  greeting=\"bedtime\";n}\n```\n\nThe concept of working with IF-THEN\
    \ statements is similar from one language to another — just be sure to check the\
    \ exact syntax when coding in a new language.\n\n# Make a Tune Play When the Player\
    \ Answers Correctly\n\nEach time player makes a correct guess, a short tune plays.\
    \ Follow these steps to create your own tune using the Create a Melody feature\
    \ of MicroWorlds EX. (Note: Additional details on creating a melody are provided\
    \ in Project 4.)\n\n+   1. From the toolbar, click the Create a Melody button;\
    \ then click in the workspace.\n\nThe Melody dialog box opens.\n\n+   2. Click\
    \ a button for an instrument."
  merge: -1
