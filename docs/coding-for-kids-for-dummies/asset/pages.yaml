    In MicroWorlds EX, the order of the procedures entered in the Procedures pane
    does not matter. This is true for both the project Procedures pane and turtlepack
    Procedures. However, the order in which procedures are sequenced for execution
    *does* matter. As an analogy, think about a pile of clothes — order doesn''t matter
    until you need to get dressed, then it matters a great deal. Shirts on your body
    before jackets, socks then shoes, and pants belts — otherwise, your outfit receives
    a big error message!


    # Save, Test, and Debug


    Choose File:Save Project from the menu bar to save your game. Test each button
    to make sure it functions as you intended. Check for error messages in the Command
    Center to determine where any bugs may exist in your code. When you''re finished,
    play several times and share with friends!


