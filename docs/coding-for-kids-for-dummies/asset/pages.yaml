  md: '# Add Horizontal and Vertical Drawing Controls


    Just like a real Etch Sketch, your Sketcher Etcher needs a way to control drawing
    horizontal lines and vertical lines. Follow these steps to create four buttons
    — left, right, down, and up — to control the drawing stylus.


    +   1. On the toolbar, click the Create a Button button. Then click anywhere in
    the workspace.


    The Button dialog appears.


    +   2. In the dialog box, type L (for left) in the Label field and set 270 fd
    5 in the Instruction field. Leave the Once radio button and Visible check box
    selected.


    The dialog box should look like Figure 3-5.


    ![](img/74c7791905a327f23e0e4b132d43c15a_88_0.png)


    Figure 3-5


    The seth 270 points the drawing stylus to the left (or west), and the fd 5 command
    moves the stylus forward 5 pixels. Because the stylus pen is down, it leaves a
    short mark on the Sketcher Etcher screen.


    +   3. Click OK.


    The L button is added to the workspace.


    +   4. Drag the L button to reposition it to the left dial control of your Sketcher
    Etcher.'
