  md: '# Week 2: Motion, Animating Shapes, and Reacting to Input


    The random 10 command generates a number from 0 to 9 each time it''s executed.
    Each time the horse takes a step, it moves forward a different distance. This
    creates variation in the speed of the horse, causing the horse to run race differently.
    Randomness creates unique conditions for each race, so any horse can win! The
    wait 1 command inserts a 0.01 second pause between each movement of the horse,
    and slows the pace of the running to appear more realistic.


    ![](img/74c7791905a327f23e0e4b132d43c15a_111_0.png)


    Random number generation is important in coding and is used in all sorts of programs
    and games. See Project 1 for details on using the random command.


    Leave the backpack of the Lane 1 horse open — you''ll get back to it in the "Set
    Up Horses to Recognize the Finish Line" section, later in this project.


    # Make Copies of the Horse


    Three more horse turtles are needed to occupy the race track. Create them as follows:


    +   Right-click (Windows) or Ctrl-click (Mac) the horse turtle in Lane 1 and select
    Copy from the pop-up menu.


    +   Right-click (Windows) or Ctrl-click (Mac) anywhere on the background and select
    Paste from the pop-up menu.


    A copy of the horse turtle appears.


    +   Paste two more times.


    There are now four horses total.


    +   Drag each horse turtle to a position at the start of a lane.'
