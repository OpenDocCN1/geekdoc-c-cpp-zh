  md: '# # PROJECT

    8


    # # Number Guessing Computer


    The Number Guessing Computer may look like a clunky chunk of technology from years
    gone by, but it serves a useful function — it plays a good game of “Guess My Number!”
    Using a slider, the player tells the Number Guessing Computer a maximum value.
    The computer then randomly generates the secret number, a variable that changes
    from one game to the next. A player is asked to input a guess at the secret number,
    and IF-THEN conditions-als are used to compare the guess to the secret number.
    A procedure based on the law of trichotomy tells the player whether the guess
    is too low, too high, or correct. If the guess is too low or too high, the procedure
    uses recursion to execute again, checking the player’s next guess until a correct
    guess is reached.


    ![](img/74c7791905a327f23e0e4b132d43c15a_179_0.png)'
  merge: -1
  pgno: 179
