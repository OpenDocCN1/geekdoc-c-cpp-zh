    # Adding the hit procedure to the frog


    Tell the frog turtle to use the hit procedure. On the backpack Rules tab, type
    hit in the OnTouching field. Whenever the frog collides with a traffic turtle
    during the game, the hit procedure is executed.


    A collision takes place where there is coordinate convergence between two turtles.
    This means that some part of a shape on one turtle touches some part of a shape
    on another turtle. When coordinate convergence occurs, it means the objects have
    collided.


    Collisions are detected different ways in different programming languages. In
    MicroWorlds EX, collision detection is precise — actual touching of shapes takes
    place. GameMaker has precise collision detection and non-precise collision detection
    (see Figure 15-13), in which only the bounding boxes of the shapes touch. In GameMaker,
    precise collision detection requires a lot more processing power than non-precise,
    and if you have a lot of objects moving around, this can really slow down the
    game. However, precise collision detection creates a more realistic gameplay experience
    for players because it accurately depicts real-world physics.


    ![](img/74c7791905a327f23e0e4b132d43c15a_357_0.png)'
  merge: -1
