    # Coming Up with Your Ideas, Your Projects


    As you get started with the projects in this book, keep in mind that you can customize
    every project with your own personal creativity. Many video games have the same
    underlying structure, as do many toys. The coding of the gameplay is often the
    same for multiple games. Think about how many different a shooter game can take,
    all with the same code: a squid shooting ink at an approaching shark; a pig dropping
    water balloons on cows; a pea shooter aiming at targets in a carnival game; or
    a bomber dropping bombs on enemy battleships. If you remove the graphics and sound
    effects, you simply have an object shooting at another object, with target objects
    moving and some sort of lives and scoring system. Many simulations also involve
    the scattering or'
