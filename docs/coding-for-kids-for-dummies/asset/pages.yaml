    \ then clicks on all three turtles. You will write instructions in the OnClick\
    \ fields of each turtle so that they know what commands to perform when clicked\
    \ on.\n\nThe procedure then talks to (tto) the squid and shark, instructing them\
    \ to show turtle (st).\n\nThe command ink, ht tells the ink turtle to hide because\
    \ the squid hasn't shot the ink cloud at the shark — yet!\n\nAs an additional\
    \ challenge, add a line of code to the go procedure to disperse the objects vertically\
    \ as well. This helps further separate the squid and shark. Using only horizontal\
    \ separation, there will be occasions when the shark and squid end up touching\
    \ each other at the start of the game. Using both horizontal and vertical random\
    \ positioning helps reduce the chance of an initial collision.\n\n# Create a Go\
    \ button\n\nAfter you have written the go procedure, MicroWorlds EX recognizes\
