    # Write a Make 10 Babies Procedure and Make an Associated Button


    After you have written both the initialize procedure and the reproduce procedure,
    you can put them together in new ways. For example, you can combine these two
    procedures with a repeat command to write a procedure to make ten babies.


    Follow these steps to write the make_10_babies procedure and make a button to
    execute it:


    +   1. In the Procedures pane, type the make_10_babies procedure as shown:


    ```

    make_10_babies

    initialize

    repeat 10 [reproduce]

    end

    ```'
