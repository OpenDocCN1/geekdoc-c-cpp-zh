    # Exploring help resources


    The number of MWEX primitives vocabulary covered in this book is tiny compared
    with the entire library of vocabulary available. The Help menu, which you can
    access from the MWEX menu bar, contains an option for viewing the language vocabulary,
    sorted alphabetically. Each MWEX command is explained and accompanied by an example.
    I am constantly using this resource to learn new primitives and how to use them
    in my code. I hope you find it as valuable a resource as I do The Help menu also
    provides assistance in fundamentals, programming, and more techniques — all are
    excellent resources.


    Another great help resource for learning how to use primitives is available as
    you code: With your cursor, hover over any MicroWorlds EX primitive Procedures
    pane, a tooltip appears with information telling you how to format the primitive.


    Additionally, the startup screen of MicroWorlds EX offers access to tutorials
    and samples you may find helpful. Every example you can view and play with a learning
    opportunity. I also encourage you to modify the code of each example, and extend
