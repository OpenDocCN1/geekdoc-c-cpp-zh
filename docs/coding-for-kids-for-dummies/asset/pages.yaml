    # Set Up Horses to Recognize the Finish Line


    There are two different types of color detection in MicroWorlds EX:


    +   - Universal color detection is set on the background color so that every turtle
    object reacts to the color in the same way.


    +   - Local color detection lets you set a different reaction of each turtle to
    a color.


    You will use local color detection to determine which horse crosses the red finish
    line first. Set up local color detection for each horse turtle as follows:


    +   1. Return to the backpack Rules tab of the horse turtle in Lane 1.


    The backpack should still be open from earlier.


    +   2. From the OnColor drop-down list, select the red color swatch to match the
    red finish line


    +   3. In the OnColor field, add the command announce [Lane 1 Wins!!!] stopall
    and set it to Once, as shown in Figure 4-12.


    When the horse in Lane 1 touches the red finish line, its OnColor command for
    red is executed. This command announces that the horse in Lane 1 is the winner.
    stopall command halts further program execution.'
