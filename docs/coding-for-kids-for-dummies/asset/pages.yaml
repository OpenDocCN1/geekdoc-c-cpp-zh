- img_proc: true
  md: '# Exploring the turtle backpack


    In MicroWorlds EX, each turtle object carries a backpack. The backpack holds important
    information, organized into six tabs (sort of like pockets):


    +   - **State tab**: Like a wallet, the State tab includes the turtle Name, where
    it is located (its Xcor and Ycor), the direction it is pointed (Heading). Size,
    Shape, Animation mode (SetShape or SetRotate), Pen state (Up, Down, or Erase),
    and Visibility. Variable values known only to a specific turtle are stored in
    the I Have section of its State tab.

    - **Procedures tab**: Holds Procedures that only its turtle owner knows. This
    differs from the Procedures tab, which holds procedures known by all turtles in
    the project. If a project procedure and backpack procedure have the same name,
    the turtle uses its backpack procedure.

    - **Shapes tab**: Holds shapes that the turtle wears, similar to a closet of clothes.
    This differs from the Shapes tab, which holds shapes wearable by all turtles in
    the project. If a project shape and backpack shape have the same name or same
    number, the turtle wears its backpack shape.

    - **Notes tab**: Holds turtle-specific notes you want to keep.

    - **Audio tab**: Holds music and sounds unique to the individual turtle.

    - **Rules tab**: One of the most frequently used tabs in the turtle backpack.
    The Rules tab tells the turtle what to do when clicked on (OnClick), how to behave
    when walking over colors (OnColor) or bumping into other turtles (OnTouching),
    what to do at specific times (OnTick), what to do when hearing a message (OnMessage),
    and how to react to User Defined Events (WhenThis Do That).'
  merge: -1
