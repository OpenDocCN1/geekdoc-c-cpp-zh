  md: "# Project 14: Where's Wallace Walrus?\n\nCoding languages typically feature\
    \ primitives for executing loops. MicroWorlds EX uses repeat in a similar way\
    \ that many languages use a for command. Other languages employ a do command,\
    \ which is also used for looping and usually provides a way to exit the loop when\
    \ a certain condition is met (do until). MicroWorlds EX features a related command,\
    \ called dotimes. Choose Help: Vocabulary for additional information on using\
    \ this command in your code.\n\n# Create a Populate button\n\nNext, follow these\
    \ steps to create a Populate button to execute the populate procedure:\n\n+  \
    \ - From the toolbar, click the Create a Button button. Then click anywhere on\
    \ the workspace.\n- In the Button dialog box (see Figure 14-8), fill in the following\
    \ information:\n  - Label: Type Populate in the Label field to name the button.\n\
    \  - Instruction: Type populate in the Instruction field.\n  - Do It: Select the\
    \ Once radio button.\n  - Visible: Select this box.\n\n![](img/74c7791905a327f23e0e4b132d43c15a_326_0.png)\n\
    \n| Name | button1 |\n| --- | --- |\n| Label | Populate |\n| Instruction | populate\
    \ |\n| Do It | ( ) Once\n( ) Forever\n[x] Visible\n\nFigure 14-8\n\nClick OK to\
    \ close the Button dialog box.\n\nThe Populate button is added to the workspace."
