    # Write a Get Ready Procedure and Make a Button


    When testing the Populate button, did you notice that the population of walruses
    just keeps growing, and growing, and growing? That''s because you haven''t created
    a way to remove walruses and return the workspace to containing only Wallace.
    A getready procedure and button will solve that problem.


    # Write a getready procedure


    On the project Procedures pane, type the following getready procedure:


    ```

    to getready

    everyone [ifelse = "walrus [home] [remove who]]

    end

    ```


    The getready procedure has a single line of code that speaks to everyone — all
    turtles in the workspace, including Wallace walrus and his distractors. who is
    the currently active turtle at the moment, determines which turtle is receiving
    the command at the moment, although everyone will eventually get a turn at being
    who. who executes the ifelse command within one of sets of square brackets, and
    then a different turtle becomes who, and so on.


    Here''s how the ifelse command works. Speaking to the turtle population in the
    workspace, it says:


    ```

    If who = Wallace the walrus, then move to the home position

    else, remove the currently selected turtle (who)

    ```'
  merge: -1
  pgno: 327
- img_proc: true
  md: "# Project 14: Where's Wallace Walrus?\n\nThe getready procedure eventually\
    \ removes all turtles from the workspace except Wallace the walrus.\n\nAn IF (or\
    \ IF-THEN) conditional differs from an IF-ELSE (or IF-THEN-ELSE) conditional.\
    \ In an IF conditional, if the condition is true, then the consequence in square\
    \ brackets is executed; if the condition is false, then the consequence is ignored,\
    \ and the next line of code is executed. In an IF-ELSE conditional, if the condition\
    \ is true, then the consequence in the first set of square brackets is executed;\
    \ if the condition is false, then the consequence in the second set of square\
    \ brackets is executed.\n\n# Create a Get Ready button\n\nNext you need to create\
    \ a Get Ready button to execute the getready procedure. Follow these steps:\n\n\
    +   1. From the toolbar, click the Create a Button button. Then click anywhere\
    \ on the workspace.\n2. In the Button dialog box, fill in the following information\
    \ (see Figure 14-9):\n    * Label: Type Get Ready in the Label field to name the\
    \ button.\n    * Instruction: Type getready in the Instruction field.\n    * Do\
    \ It: Select Once.\n    * Visible: Leave the Visible check box selected.\n\n![](img/74c7791905a327f23e0e4b132d43c15a_328_0.png)\n\
    \nFigure 14-9"
