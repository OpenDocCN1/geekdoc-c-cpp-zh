    # Add a Turtle


    All programming languages have ways to create objects. Objects are usually the
    physical things that move around the computer screen — cars, birds, paintballs,
    and so on. Programming languages have different name for objects. In another programming
    language you may have heard of, GameSalad, an object is called an *actor*. In
    MicroWorlds EX, an object is called a *turtle*.


    In certain programming languages, such as object-oriented programming languages
    (OOPs), objects can be physical things but also be informational things — abstract
    entities that possess data and behave in certain ways in a program.


    ![](img/74c7791905a327f23e0e4b132d43c15a_34_1.png)


    In your Art Toy, your turtle will do the drawing! He is an object that can move
    around the workspace in many ways. Also, the turtle carries a *pen* that is capable
    of drawing in a variety of colors and pen sizes.


