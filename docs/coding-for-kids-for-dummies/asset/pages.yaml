  md: '# PROJECT 6


    # Sports Vote


    Voting is a tool for determining relative popularity and can be used for everything
    from family members deciding on a restaurant to electing a president! It''s easy
    to code a simple voting booth that presents candidates and invites voters to pick
    their favorite, and then shows the results.


    In Sports Vote, you code a voting booth that asks voters to choose their favorite
    of three sports, but you can customize the voting booth to feature any theme and
    any candidates. Each vote registers a sound to indicate the vote has been cast.
    But, instead of showing the number of votes received, the icon for each candidate
    changes in size according to its relative popularity — the largest candidate wins!


    ![](img/74c7791905a327f23e0e4b132d43c15a_145_0.png)'
  merge: -1
