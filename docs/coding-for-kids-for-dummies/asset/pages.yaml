    # Creating keyboard control


    Many games involve moving or driving a character around its environment, and keyboard
    control is necessary to facilitate movement. Keyboard control is one of the most
    important — and fun! — coding you''ll perform. You can assign any keys to move
    an object, many times using the up, down, left, and right arrows because they
    are logically analogous to the desired motion.


    Sometimes, you''ll want to move an object in one direction, as the alien does
    in the UFO Pilot project: Only the up-arrow key is used to make the ship fly.
    Other times, you''ll want an object to move in two directions — for example,'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'creating paddle control in a game such as Pong. Most often, you''ll want an
    object to move in the four directions of a compass as when swimming the squid
    around the ocean.


    Here''s how a keyboard-control procedure works: When the player presses a key
    on the keyboard, the variable key stores that character. Every keyboard character
    has its own number code, called an ASCII value, and the values are different on
    Windows keyboards and Mac keyboards.


    For example, on a PC (Windows), the left arrow is an ASCII value of 37. The keyboard-control
    procedure says if the ASCII value of a key is 37 - if (ascii :key) = 37 - then
    point the object west and move it forward some distance. In the swim procedure,
    that motion command is fd 10. Every arrow is assigned a different compass direction
    so that the turtle points in the chosen direction and moves a small distance.


    You can assign a key to perform any commands you want. swimshoot assigns the four
    arrow keys to swim the squid left, up, right, and down and it also assigns the
    spacebar to execute the shoot command.


    Because ASCII values differ between PC and Mac keyboards, you should consider
    using both sets of commands in keyboard-control procedures so that users running
    Windows and also running Mac OS can use your program. That way, everyone can play
    your game!


    | Arrow Key | Windows | Mac |

    |---|---|---|n| Left arrow | 37 | 28 |

    | Up arrow | 38 | 30 |

    | Right arrow | 39 | 29 |

    | Down arrow | 40 | 31 |'
  merge: -1
  pgno: 281
