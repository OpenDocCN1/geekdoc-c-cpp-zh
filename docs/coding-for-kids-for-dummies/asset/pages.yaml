    Commands used in the OnTouching field for coordinate convergence, meaning two
    objects are in the same place at the same time. Coordinate convergence means two
    objects have crashed, like a frog and a car; or one object has eaten another object,
    like a shark eats a squid! Coordinate convergence also occurs between the squid
    and its ink, but you don''t want there to be a consequence of the squid-ink convergence.
