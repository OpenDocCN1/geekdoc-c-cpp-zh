  md: '+   • Clicking the U button causes the stylus to draw as it moves.

    • Clicking the D button causes the stylus to draw as it moves down.


    # Set Up Horizontal Boundary

    Conditions for the Stylus


    The Sketcher Etcher stylus must be prevented from drawing in the red frame when
    moving horizontally — left and right. You will write a This Do That rule (a rule
    that is always running) so it can continuously check whatever its rule says to
    check. Here, it checks whatever the turtle runs into the frame. Follow these steps
    to set up horizontal boundary conditions:


    +   1. First, you need to find the x-coordinates of the left boundary between
    the gray drawing area and the red frame. To do so, drag the stylus turtle to where
    these two areas intersect on the left side of the workspace.


    +   2. Open the stylus backpack by right-clicking (Windows) or Ctrl-clicking (Mac)
    the stylus turtle and choosing Open Backpack.


    +   3. On the State tab, find the Xcor value.


    In Figure 3-7, the Xcor value is -260, but your value may be slightly different.


    > The left side of the x-axis has negative values, and the right side of the x-axis
    has positive values.


    +   4. Switch to the Rules tab of the stylus backpack.


    +   5. On the Rules tab, find the When This . . Do That section, and then in the
    blank space below that, right-click (Windows) or Ctrl-click (Mac), and select
    Add from the pop-up menu, as shown in Figure 3-8.


    The User-Defined Event dialog box opens.'
  merge: -1
  pgno: 90
