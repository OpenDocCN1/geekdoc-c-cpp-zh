  md: '# Project 13: Rock, Paper, Scissors


    When using parentheses in writing MicroWorlds EX code, you can leave them off
    of single words such as "rock". Parentheses are needed only to eliminate confusion
    with double words such as contractions, for example, (player''s "shape").


    As you write longer and more complicated procedures, it''s a good idea to include
    comment lines in your code. Comment lines are notes about what each procedure
    or program section does. Comments help you remember the purpose of your code and
    are especially helpful to others who may read your code, or collaborators who
    may be coding with you on a team project. They are also ideal for keeping your
    program visually and structurally organized, and may be written to serve as a
    plan before creating any actual code. A semicolon symbol;) starts a comment. Lines
    are not executed. In Figure 13-16, the words in red are comments. Note that longer
    comments can wrap to additional lines, but you should not use a line break to
    split them as this will generate an error.


    Following each comment is a compound conditional to compare the objects and say
    an outcome. Here is an example:


    +   - Plain words: If the player''s shape is a rock, and the computer''s shape
    is paper, then say PAPER COVERS ROCK.


    +   - MWEX code: if and (player''s "shape") = "rock" (computer''s "shape") = "paper"
    [say PAPER COVERS ROCK ]


    In the command "and" conditional, both conditions must be true for the consequence
    to be executed.


    The checkwin procedure compares all possible combinations of player and computer
    choices and gives a consequence for each pair. checkwin uses the say command to
    inform the player of the outcome of each match. The say command uses your computer''s
    artificial voice to say the words in the square brackets.'
  merge: -1
