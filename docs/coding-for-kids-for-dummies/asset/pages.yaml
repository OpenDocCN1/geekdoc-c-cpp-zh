  md: '# Picking — selecting with replacement


    The pick command operates similarly to the random command. While random selects
    a random number from a range, pick is used to pick an item from a list, or a single
    character out of a word. There is equal probability of picking any item from a
    list: In a list of three items, each item has a 1/3 probability of being selected.
    Also, each item can be picked at any time — after an item is picked, it can be
    picked again — it is not removed from the list. This is called selecting with
    replacement.


    # Write a Checkwin Procedure


    A checkwin procedure determines who wins the two-way match by comparing the player
    shape with the computer shape.


    The checkwin procedure checks for all possible outcomes of a rock, paper, scissors
    game. What are those?


    +   - The player and the computer choose the same object — this is a draw.

    - The player chooses rock, and the computer picks paper or scissors.

    - The player chooses paper, and the computer picks rock or scissors.

    - The player chooses scissors, and the computer picks rock or paper.


    On the Procedures pane, type the checkwin procedure (Figure 13-16):


