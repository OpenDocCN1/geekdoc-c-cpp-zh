  md: '# Make an Infect Procedure and Add It to the Turtle


    The infect procedure is used to cause a sick turtle to infect any other turtle
    it bumps into. Note that there should be only one turtle in the workspace to complete
    this step.


    If you created multiple turtles when testing the Clone button in the earlier section
    "Make a Clone Button and Instruction," remove those turtles so that only one remains
    in the workspace. To remove a turtle, right-click (Windows) or Ctrl-click (Mac)
    the turtle and select Remove from the pop-up menu.


    Follow these steps to write an infect procedure and add it to the turtle. :


    +   1. On the Project Procedures pane, type this procedure:


    ```

    to infect

    if color = 15 [ask touchedturtle [setc 15]]


    ```


    Here''s how the infect procedure works. If a turtle is sick, its color is 15,
    or red. The infect procedure asks the touched turtle — the turtle with whom a
    sick turtle collides — to now become sick by turning red (setc 15).


    +   2. To cause the infect procedure to execute during a collision, you must add
    infect to the OnTouching field of the backpack. Right-click (Windows) or Ctrl-click
    (Mac) the turtle and select Open Backpack.


    +   3. On the backpack Rules tab, type infect in the OnTouching field, as shown
    in Figure 10-5.


    Leave the backpack open because you''ll be using it again in the next step list.


