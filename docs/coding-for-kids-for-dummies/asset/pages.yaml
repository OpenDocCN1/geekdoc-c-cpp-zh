  md: '# Week 1: Basic Drawing, Motion, and Text Handling


    You may want to resize the button to reduce its size so that it fits on the background
    dial. To do so, Ctrl-click (Win) or Command-click (Mac) on the button. Sizing
    dots appear on the corners of the button — drag one of those dots to resize your
    button, and then release.


    5. Repeat Steps 1–3 three more times to create the Right, Down, and Up buttons.
    Use these commands for each button:


    +   * Label: R Instruction: seth 90 fd 5

    * Label: D Instruction: seth 180 fd 5

    * Label: U Instruction: seth 0 fd 5


    The unit of circular measurement is the degree. There are 360 degrees in a circle.
    In MicroWorlds EX, the top of the circle is 0 degrees (this is north on a compass).
    East is 90 degrees; the bottom of the circle is 180 degrees (this is south on
    a compass). West is 270 degrees.


    6. Reposition the new buttons so the arrangement looks similar to Figure 3-6.


    These buttons represent your Sketcher Etcher control dials.


    ![](img/74c7791905a327f23e0e4b132d43c15a_89_0.png)


