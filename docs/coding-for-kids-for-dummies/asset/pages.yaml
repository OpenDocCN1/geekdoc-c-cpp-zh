  md: '# 38 Week 1: Basic Drawing, Motion, and Text Handling


    # Drawing spiro shapes


    You can make spiro shapes in many different ways. The general rule is to draw
    a polygon and then turn a little, and then repeat that process until the turtle
    returns to its starting point. Similar to the way a turtle draws a single polygon,
    the turtle must make an overall path of a complete circle when drawing a spiro
    shape. Like a Dancing with the Stars competitor, the turtle may perform many small
    spins along the way, but the overall path around the room is one complete circle.
    This can be done in different ways. For example, the spiro octagon can be made
    using any of these commands:


    ```

    repeat 6 [octagon rt 60]

    ```


    or


    ```

    repeat 12 [octagon rt 30]

    ```


    or


    ```

    repeat 20 [octagon rt 18]

    ```


    or


    ```

    repeat 30 [octagon rt 12]

    ```


    Here the spiro octagon is a group of small spins. But it''s the repeat number
    and the turn angle that result in one complete circle in the creation of the entire
    spiro octagon. As with drawing the polygon itself, the repeat number times the
    turn angle equals 360; for example, 6 x 60 = 360 and 12 x 30 = 360.


    +   3. Follow Steps 1–3 in the earlier section “Create Buttons to Execute Primitives”
    to create a button with the label Spiro Square and the instruction spirosquare.'
