  md: '# Launching a parallel process in a procedure


    The launch command is useful when you want to execute a command, and then immediately
    execute the next command without waiting for the first command to finish executing.
    In Squid Ink, the laugh recorded sound is about 3 seconds in duration (refer to
    Figure 12-14) and is executed by the squid. If the game waits until laugh finishes
    playing prior to executing the squid''s next step, the program will not respond
    to keyboard input — and thus the squid cannot move in the water. Meanwhile, the
    shark who be swimming along according to his own own commands, continues swimming
    and will likely catch up to (and eat) the squid. The launch command ensures that
    the game action proceeds at the same time that laugh plays.


    In computer programming, there are occasions when you want code commands to execute
    sequentially (or serially), meaning one step ends before the next step begins.
    There are other occasions when you want code to execute simultaneously (or in
    parallel), meaning at the same time. In MicroWorlds EX, a launched command in
    an object executes simultaneously with the command that follows. In essence, you
    are causing two things to happen at once. In practice, you could launch several
    commands in a procedure and have three, four, five, or more commands happen at
    once!


    Parallel code execution is useful not only within a procedure but also among multiple
    objects. For example, one object runs its instructions at the same time another
    object is running its own instructions. This is how the shark keeps swimming the
    squid simultaneously with the squid swimming or the ink cloud moving to the shark.
    See Project 4 (Horse Race) for additional information on executing code in parallel.'
  merge: -1
  pgno: 290
- img_proc: true
