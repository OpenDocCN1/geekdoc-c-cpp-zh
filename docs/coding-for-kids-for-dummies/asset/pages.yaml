  md: '# Week 5: Advanced Coding


    ```

    remove "t1"

    everyone [setx random 640 sety random 480]

    end

    ```


    The populate procedure works as follows:


    +   - A newturtle is added to the searchpage and named t1. It then makes t1 visible
    with the command st (show turtle). t1 is wearing a special shape — it just appears
    as the default turtle shape.

    - repeat executes Number times the commands inside the square brackets. The value
    of Number is set by the slider and represents the number of distractor turtles
    who hang out with Wallace. On each repetition, the t1 turtle is cloned so that
    a new numbered turtle is added (t2, t3, t4, and so on). As each new turtle is
    added, a shape is picked randomly from the distractor shapes: earmuffs, scarf,
    hat, or goggles and applied to the turtle. Note: Don''t forget that Wallace walrus
    turtle is still sitting nicely in the workspace — he is the only turtle with a
    special name.


    +   - Following completion of the repeat, the t1 turtle is removed using the command
    remove "t1". The t1 turtle serves only as a seed for cloning the distractor turtles.

    - Finally, the command everyone [setx random 640 sety 480] gives everyone in the
    workspace a random coordinate position. Wallace and each of the distracters set
    their x-coordinate to random 640, the width of the workspace. Wallace and all
    distractors also set their y-coordinate to random 480, the height of the workspace.


    ![](img/74c7791905a327f23e0e4b132d43c15a_325_0.png)


    Many games and simulations require objects to be scattered into random positions.
    Examples include distributing cows in a field, people in a mall, or battleships
    in the ocean. You will likely find your writing code to generate a random x-coordinate
    and a random y-coordinate for each object so that the entire group appears scattered.
    See Project 10 for details on randomly scattering objects.'
