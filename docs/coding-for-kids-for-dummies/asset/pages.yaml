  md: '# Where’s Wallace Walrus?


    Where’s Wallace Walrus? is a classic search-and-find game. Wallace is an ordinary
    walrus lounging on the ice among a larger population of walrus friends. Some are
    wearing earmuffs; others are wearing scarves, hats, or goggles. But Wallace is
    the only walrus on the floe not sporting accessories — and it''s the player''s
    job to find him! The game features a common coding command called a do loop to
    create the population of walruses. Random shape assignment and positioning make
    every game unique. Your players will find themselves, “Where’s Wallace Walrus?”


    ![](img/74c7791905a327f23e0e4b132d43c15a_316_0.png)'
