  md: '# Write an Initialize Procedure and Make a Button


    Although you have only one turtle in the workspace at this point, you will eventually
    have a large population of turtles. You need to create an initialize procedure
    that causes the turtle population to start out healthy by turning all of the turtles
    green. This procedure also distributes the turtles into random positions in the
    workspace.


    Follow these steps to write the initialize procedure and create an Initialize
    button to activate the procedure:


    +   1. Click the project Procedures tab (located in the lower-right corner of
    the window) to open the project Procedures pane.


    +   2. Type the following reset procedure:


    ```

    to initialize

    everyone [setc 57 setx random 640 sety random 480]


    ```


    The everyone command causes all turtles in the workspace to execute the commands
    inside the square brackets, which are described in the following list:


    +   - setc 57 causes the turtle color to green, the color being used to symbolize
    a healthy turtle.

    - setx random 640 causes a turtle to randomly select an x-coordinate across the
    width of the screen.

    - sety 480 causes a turtle to randomly select a y-coordinate across the height
    of the screen.


    +   3. Next, you need to create an Initialize button to execute the reset procedure.
    From the toolbar, click the Create a Button button. Then click the workspace anywhere.'
