  md: '# Project 9: Monster Mashup 191


    # Brainstorm


    Around Halloween, kids love coding Monster Mashup. But at other times of the year,
    they produce a wide variety of other mix-and-match toys. What are some options
    you can dream up?


    +   * Potato people parts, similar to Mr. Potato Head

    * Sports smashup featuring jumbled-up sports attire

    * Fashionista diva dress-up doll

    * School lunch smorgasbord (entrée, side, beverage, dessert)

    * Celebrity family (mixed-up moms, dads, and kids)


    Programs written for entertainment purposes take many forms, including games and
    toys. Games typically feature a goal the player strives to attain and some criteria
    for winning, toys usually have no specific goal and are intended more for exploratory
    play.


    ![](img/74c7791905a327f23e0e4b132d43c15a_202_0.png)


    # Start a New Project


    Begin creating your Monster Mashup toy by starting a new project as follows:


    +   1. Start MicroWorlds EX.

    2. From the yellow MicroWorlds EX startup screen, select Free Mode.

    nA new project opens.

    3. From the menu bar, choose File>New Project Size>MicroWorlds Small.


    ![](img/74c7791905a327f23e0e4b132d43c15a_202_1.png)


    Feel free to create your project by using any size. Projects featuring many monster-part
    choices may require a larger work-space, so consider using a larger project size.
    Smaller spaces


