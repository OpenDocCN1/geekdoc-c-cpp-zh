  md: '# 16 Week 1: Basic Drawing, Motion, and Text Handling


    +   * Project title and page number: The project title appears at the top of the
    MWEX interface and also in the lower-left corner. This second location, called
    the status bar, also shows the page number of the current page within the project.
    If the page is named, its name appears instead of the default, for example, page1.


    +   * Workspace: This is where you create the physical appearance of your project.
    Here, you can add a background and then create turtles, buttons, and other elements
    of your project. At the start of a new project, you can change the size of the
    project by choosing Files: New Project Size, and then selecting one of these options:
    MicroWorlds Small, MicroWorlds Standard, Web Player, Full Screen 640 x 480, or
    you can create a project size of your own dimensions by typing [width height]
    in the Command Center (discussed next). Note that a project size can be changed
    only at the start of a project.


    +   * Command Center: This region is used for several different purposes:


    +   * You can try out a command or snippet of code and instantly see the results.


    +   * You can issue a command that doesn''t need to be reused (so there''s no
    purpose in typing it permanently into a procedure). For example, if you''ve created
    50 fish and you want all of them to swim in the same direction, you can command
    everyone to head in a specific direction and be done with it.


    +   * You can see any error messages. If MicroWorlds EX encounters a problem with
    your code, it will tell you in the Command Center. There are other uses for the
