  md: '# PROJECT 9


    # Monster Mashup


    Mix-and-match toys take a variety of forms, from Mr. Potato Head to paper dolls.
    Now, you can create a virtual mix-and-match toy in the form of a monster called
    Monster Mashup.


    Monster Mashup invites you to paint a collection of crazy monster parts — hair,
    faces, bodies, and feet — and then code an interface that allows a player to mix
    and match parts to create a new monster. You''ll program drop-down lists and buttons
    to assign parts based on player choices, and build a Mashup button that randomly
    mashes parts together!


