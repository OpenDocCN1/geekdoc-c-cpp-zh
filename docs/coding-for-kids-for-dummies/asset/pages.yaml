  md: '# Project 1: Art Toy


    Test each button in your toy to make sure it functions as you intend. If it doesn’t,
    look for error messages in the Command Center — they provide clues about how to
    correct your code. If you find a bug, meaning a problem with your code, look at
    each line of code carefully and check for misspelled primitives and missing quotes.
    Also check that new procedures you have written begin with to and end with end.


    If a button is executing Forever, you can always stop execution clicking the Stop
    All button on the MicroWorlds EX toolbar.


    Once finished, play with the Art Toy and ask friends to play with it, too!


    ![](img/74c7791905a327f23e0e4b132d43c15a_54_0.png)


    # Enhance your game


    Consider enhancing your project with new features:


    +   - New buttons: Add new buttons for favorite colors, both for the back-ground
    and for the turtle.


    +   - New angles: Create new turn angles for the turtle. You can even use one
    degree turn angle if you want to provide Art Toy users fine control over their
    drawings!


    +   - New pen sizes: Make buttons to create larger pen sizes to provide the turtle
    thicker lines when drawing.


    +   - Pen erase: Add a button with a pen erase (pe) command. In pen erase mode,
    a turtle will erase a previously drawn line that it walks over.


    +   - Teleport: Add a teleport command (setx random 640 set random 480) to instantly
    send the turtle to a random coordinate in the workspace. If the pen is down and
    you set teleport to forever, the turtle will create some crazy kinetic art!'
