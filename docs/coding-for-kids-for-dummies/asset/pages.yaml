  md: '# Getting Started with Coding


    Until the last few decades, education focused on skills called the three Rs —
    reading, writing, and arithmetic. (I know what you''re thinking ... adults who
    believe all these words begin with the letter R need to return to kindergarten!)
    If you mastered the three Rs, you were considered an educated person. But now,
    technology has changed everything. In your personal life, in school, and in your
    parents'' jobs, technology is in constant use. And communicating with technology
    requires a new skill called coding, or computer programming.


    In this chapter, I explain what coding is and describe the types of projects you
    can create. Then, I introduce you to MicroWorlds EX, which is the software that
    you will use to create the projects in this book, as well as connect you with
    additional resources for extending your learning.


    ![](img/74c7791905a327f23e0e4b132d43c15a_18_0.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Understanding What Coding Is


    Coding means writing instructions that a piece of technology — usually a computer
    — understands so that the technology will perform a task. A computer programming
    language provides the vocabulary (words) and syntax (rules and punctuation) for
    communicating with a computer.


    The instructions that you write and that the computer reads are a program. A computer
    program comprises code and communicates instructions about what is supposed to
    show on a computer screen and when it is supposed to happen. As you learn a computer
    programming language, you will be able to read and understand programs already
    written. Most importantly, you will be able to code — that is, design and write
    your own original programs.


    Learning to understand and create code in a computer programming language allows
    you to communicate with technology. Just like there are tons of human languages,
    there are tons of computer programming languages. If you''re wondering which programming
    language you should learn, the answer is . . . any of them! After you learn one
    programming language, there will be many similarities between that language and
    any other programming language you may need. Still, there are some programming
    languages that are much easier to start with and much more fun if you''re a kid.
    And you are a kid, right?


    # Learning to Code with MicroWorlds EX


    In general, to get started coding, you need only a computer, the programming language
    software, and an up-to-date version of a consumer-grade operating system (Windows
    or Mac OS). Some languages, such as Scratch, operate in a web browser, so you
    must also have a browser such as Firefox to work with those options.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Project 0: Getting Started with Coding


    The programming language software that you will use with this book is MicroWorlds
    EX (MWEX), which is my favorite computer programming language of all time.


    # Examining why MWEX is a good language to start with


    MWEX is a perfect first language for many reasons:


    +   * It uses natural language for commands — instructions the computer follows.
    Vocabulary such as IF, FORWARD, SETSHAPE, and STOP are written in standard English,
    and you know what they mean. Abbreviations such as FD (for FORWARD) and RT (for
    right turn) make sense. And MWEX isn''t picky about capitalization; for example,
    FD and fd are equivalent.


    +   * It does not govern over punctuation. Most of the punctuation makes good
    sense — some commas, quotation marks, parentheses, and square brackets. For example,
    if you want to command a UFO to fly, you type ufo, fly in your program. In more
    advanced programming languages, you need to master periods (.) and curly braces
    { }, but MWEX keeps punctuation fairly simple.


    +   * It has drag-and-drop palettes and also writing for new code. Some programming
    languages have only drag-and-drops. Although this makes program creation easy,
    it limits your ability to create entirely new code. On the other hand, programming
    languages that you expect to create all the code yourself are a bit scary — too
    much empty canvas and not enough paint-by-number. MWEX has a nice, balanced, interface:
    plenty of palettes and panes to access tools easily and develop program components
    quickly, and plenty of empty canvas to be inventive.


    +   * It has built-in paint tools and a Shape Editor for painting original backgrounds
    and characters. Also, there''s a big collection of pre-made backgrounds and characters
    (including shapes that can be used for animation) in the MWEX library. You can
    import graphics from the web and from graphics editing programs.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '+   - It can import music and sound effects, as well as record audio. Best
    of all, there is a built-in music editor that allows you to create simple music
    in a variety of instruments. There''s even a say command that invokes synthesized
    speech.


    +   - It has built-in error-checking and helpful troubleshooting assistance. Many
    programming languages have error-checking tools to catch errors or bugs in your
    code. MWEX has an interpreter that checks your code as it runs or executes: If
    there''s an error, MWEX displays a message indicating the problem and where it
    occurred. Then, you can revise your code.


    ![](img/74c7791905a327f23e0e4b132d43c15a_21_0.png)


    # MicroWorlds EX programming paradigm


    For the tech ninjas who want to know the programming paradigm of MicroWorlds EX,
    it is a hybrid: MWEX blends sequential programming with event-driven programming
    with a few other paradigms (including object-oriented programming):


    +   - Sequential programming means following step by step through a series of
    instructions.


    +   - Event-driven programming means that what happens in a program is determined
    by events such as user inputs (mouse or button clicks) received through the graphical
    user interface, or messages from within the program.


    Additionally, there are elements of object-oriented programming in MWEX: digital
    objects, called turtles, that possess attributes (data) and have methods of interacting
    (procedures).'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Taking a look at what projects you can make


    By working in MicroWorlds EX, you''ll sample important yet easy-to-understand
    programming paradigms that allow you to make cool projects now — and set the stage
    for more advanced coding in the future.


    What kinds of things can you make? Everything! Up until now, you''ve probably
    been a user or consumer of technology. You play games, run a simulation or model
    for a science class, word-process a story, conduct web research, communicate with
    friends via social media, and order goods online. But by learning to code, you
    are now a maker of software, a producer in the world of technology!


    In this book, you will make four different types of projects:


    +   - Toys are things you play with that have no specific goal or scoring: for
    example, a spirograph drawing toy or Mad Libs.


    +   - Games have a goal (and sometimes scoring) such as a search-and-find game
    that challenges you to find an object, and Frogger, where the goal is to get the
    frog across the road and to the pond without being struck by a number of objects.
    Games present challenges that can be won or lost.


    +   - Animated scenes are little movies such as a winter scene with blinking holiday
    lights.


    +   - Simulations (sims) are programs that are meant to model the real world —
    for example, a viral epidemic, or births of babies in a hospital.


    Ultimately, the coding skills you learn in this book are just the beginning. I
    hope you create all sorts of exciting projects that are wilder and wacker than
    anything contained in these pages. I hope you level up and tackle learning new
    programming languages as you increase your skill level in the coming years.'
  merge: -1
