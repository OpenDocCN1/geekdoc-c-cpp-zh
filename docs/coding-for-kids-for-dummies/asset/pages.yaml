  md: '# Project 15: Traffic Dodge 349


    When the player moves the frog turtle into the Level 1 target zone during the
    game, the color that the frog matches its backpack OnColor. When this occurs,
    the OnColor command is activated. Here, the succeed procedure is executed, advancing
    the player to Level 2.


    +   4. Close the Level 1 frog''s backpack on webpage1 by clicking its X button.


    # Lay Out and Code the Level 2 Game Page


    Adding additional levels to Traffic Dodge is a snap! In this example you will
    add a Level 2, but note that you can add as many new levels as you want. The key
    tasks in adding a new level are duplicating the existing game page, creating a
    new succeed procedure, and adding the new procedure to the frog''s backpack.


    # Create the level 2 game page


    Follow these steps to create webpage2:


    +   1. Move to webpage1. Then from the menu bar, choose Pages-Duplicate Page.


    The duplicate page appears in the workspace and is named page1.


    +   2. Rename the page. From the menu bar, choose Pages-Name Page and type webpage2
    in the dialog box.


    This is your Level 2 page.


    +   3. Edit traffic on Level 2. You may want to add additional obstacles, edit
    shapes, and edit speeds in order to add variety to this new level.


    +   4. Add a page transition that the player will see when moving from Level 1
    to Level 2. (See the earlier section "Move Between Pages and Add a Page Transition.")'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Write the succeed2 procedure


    When a player successfully completes Level 2, the game is won! Write a succeed2
    procedure on the project Procedures pane as follows:


    ```

    to succeed2

    everyone [clickoff]

    anounce [YOU WIN!]

    splashpage

    end

    ```


    When it''s executed, the succeed2 procedure halts traffic by clicking everyone
    off. It then announces that the player has won the game (announce [YOU WIN!])
    and returns the player to the splashpage.


    # Add the succeed2 procedure to the frog


    Follow these steps to add the succeed2 procedure to the frog on Level 2:


    +   1. Open the backpack of the frog turtle open on gamepage, and switch to the
    backpack Rules tab.


    +   2. The OnColor drop-down list is already set to the target zone in your game.
    (In this example, the sky color is cyan blue.)


    +   3. Type succeed2 in the OnColor field and set it to Once.


    When the player moves the frog turtle into the Level 2 target zone during the
    game, the color that the frog touches matches its backpack OnColor. When this
    occurs, the OnColor command is activated. Here, the succeed2 procedure is executed,
    informing the player that the game is won.


    +   4. Close the Level 1 frog''s backpack on gamepage1 by clicking its X button.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Project 15: Traffic Dodge 351


    # # Save, Test, and Debug


    Choose File > Save Project from the menu bar to save your game.


    The completed Traffic Dodge game with all procedures is shown in Figure 15-15.
    The figure shows Level 2 (gamepage2) in the workspace. Also note that the createprojectvar
    command in the Command Center is now deleted.


    ![](img/74c7791905a327f23e0e4b132d43c15a_362_0.png)


    Figure 15-15


    Test your game by playing it repeatedly. After you have worked out all the bugs,
    you can challenge friends to determine the Traffic Dodge champion!'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 352 Week 5: Advanced Coding


    # Enhance your game


    Consider enhancing your game with new features:


    +   - Levels: Add new pages (or duplicate the game page) with challenges.


    +   - Characters: Add animated characters to traffic. Create additional shapes
    for the frog to orient his body in the direction he is jumping, and set each shape
    in the jump procedure.


    +   - Music and sound effects: VG Music (www.vgmusic.com) offers a huge collection
    of video game sound effects and music you can add to your game. All the classics
    are available, including Frogger!


    +   - Prevent cheats: Some players figure out that by jumping backwards, you can
    reach the goal and avoid the traffic. You can prevent cheats by eliminating the
    ability to jump backwards — just remove the down-arrow control. Or, you can add
    a color band at the bottom of the screen through which the frog can''t move —
    a lava pit, or an abyss — and that announces his doom. Get creative!


    +   - Win Page: Add a win page that appears when a player wins the game. The succeed2
    procedure moves the player to the winpage as opposed to the splashpage.'
  merge: -1
