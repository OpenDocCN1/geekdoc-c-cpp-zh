  md: '# About the Author


    With childhood activities that included tinkering with her Apple II+ computer
    and conducting science fair research, Camille McCue, Ph.D. developed an early
    love of STEM (science, technology, engineering, and mathematics). She earned her
    math degree at the University of Texas at Austin and worked in IBM PC marketing
    for two years prior to becoming a physics teacher to rural youth BUD (big ugly
    dish) satellite. For the next 12 years, Camille produced and anchored live television
    programming for NASA and PBS, connecting kids with experts on topics as varied
    as orbiting astronauts and Antarctic penguin researchers.


    Since 2005, she has taught video game programming, math enrichment, tech mashup,
    and future cities engineering at the Alexander Dawson School in Las Vegas, Nevada.
    Additionally, she teaches at the University of Nevada, Las Vegas (UNLV), as well
    speaks frequently at professional conferences.


    She has served on the editorial board of the Teaching in the Middle School journal
    (published by the National Council of Teachers of Mathematics) and written lessons
    for the NCTM Illuminations website. In 2012, she was selected by the Gaming2Learn
    initiative to pilot-teach Survival Master, engineering gaming software developed
    through a multimillion-dollar National Science Foundation grant.


    She earned her advanced degrees in curriculum and instruction with her doctoral
    research at UNLV focused on tween coding. Camille currently serves as Director
    of Dawson College Bound, a program mentoring citywide youth towards academic success
    in high school and university. And her fantastic husband Michael are the proud
    parents of two incredible sons, Ian and Carson. Coding For Kids For Dummies is
    Camille''s sixth technology book for Wiley.


    # Dedication


    To Carson.'
