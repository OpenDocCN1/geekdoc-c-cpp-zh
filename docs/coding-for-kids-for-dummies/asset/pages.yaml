  md: '# Week 1: Basic Drawing, Motion, and Text Handling


    # Write a Watertrap Procedure


    The watertrap procedure is executed when a turtle touches the water. Note that
    the only turtle moving in the workspace is the golf ball turtle. Follow these
    steps to write this procedure:


    +   1. Click the project Procedures tab (located in the lower-right corner of
    the window).

    2. Type the watertrap procedure as shown:


    ```

    to watertrap

    announce [Water trap!]

    wait 3

    setpos [-190 -10]

    st

    end

    ```


    Here''s how this procedure works:


    +   * This procedure starts with the `to` primitive in order to define the new
    command watertrap.

    * In the next line, it uses the `ht` (hide turtle) primitive to make it appear
    that the golf ball has plunged into the water.

    * The procedure then uses the `announce` primitive to issue an on-screen announcement
    to the player. Type the announcement you want to make between the two square brackets:
    [Water trap!]. Figure 2-16 shows an example of this announcement.

    * After the player dismisses the announcement, the procedure pauses briefly using
    the `wait` primitive. `wait` is followed by a number that is in tenths of a second
    — the longer the wait. The purpose of the wait is to set the pacing of the game.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '![](img/74c7791905a327f23e0e4b132d43c15a_78_0.png)


    +   * Next, the procedure sets the position of the golf ball back to the starting
    tee-off position using setpos [-190 -10] (or whatever coordinates you chose for
    your game). Note that because the golf ball is hidden, the player does not see
    it move back to the tee.


    +   * Finally, the procedure uses the st (show turtle) primitive to make the ball
    visible again.


    +   * As with all procedure definitions, end is the final primitive.


    3. Drag the ball into the water and check that the watertrap procedure works as
    expected. If not, look at the Command Center for clues about possible errors.


    Be sure to look carefully at the example code deciding whether to use square brackets
    or parentheses in MicroWorlds EX. Other languages, such as Java, make extensive
    use of curly brackets and parentheses. Each type of punctuation is understood
    differently by each computer language, very much like commands themselves. Incorrect
    usage of punctuation will cause program code to fail in execution.


