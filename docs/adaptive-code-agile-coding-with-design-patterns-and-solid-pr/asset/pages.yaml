- pgno: 119
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_119_0.png)


    # FIGURE 3-13 Fusion has a user interface for finding the log file for your application.


    Not all dependencies require assembly references. One alternative is to deploy
    the service code as a hosted service. This requires inter-process or inter-network
    communication, but it minimizes the assembly references required between client
    and server, as the next section examines.


    # Services


    In comparison to assemblies, the coupling of a client to a hosted service can
    be much looser, which is beneficial but also comes at a cost. Depending on your
    application’s requirements, you could have the client know a lot or a little about
    the location of the service. Also, you can vary how the service is implemented
    so that it has very few requirements. With each of these options, there are different
    tradeoffs to be considered.


    # Known endpoint


    When the location of the service is known to clients at compile time, you can
    create a service proxy on the client side. This proxy can be created in at least
    two ways: by using Visual Studio to add a service reference to a project, and
    by creating the service proxy yourself via the ChannelFactory class in the .NET
    Framework.


    Adding a service reference in Visual Studio is very easy; just select Add Service
    Reference on the shortcut menu for the project. All the Add Service Reference
    dialog box needs is the location of the Web Services Definition Language (WSDL)
    file, which provides a metadata description of the service, its data types, and
    available behavior. Visual Studio then generates a set of proxy classes for this
    service, saving a lot of time. It can even generate asynchronous versions of the
    service methods to mitigate against blocking. However, the tradeoff of using this
    method is the loss of control over the code that is generated. The code that Visual
    Studio generates is unlikely to match up to your in-house coding standards, which
    might be a problem depending on how strict those standards are. Another issue
    is that the generated service proxy does not lend itself to unit testing: it does
    not generate any interfaces, just implementing classes.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'An alternative to adding a service reference is to create a service proxy yourself
    in code. This method is best used when the client has access to the interface
    of the service and can reuse it directly by reference. Listing 3-14 shows an example
    of creating a service proxy by using the ChannelFactory class.


    # LISTING 3-14 The ChannelFactory class allows you to create a service proxy.


    ```

    var binding = new BasicHttpBinding();

    var address = new EndpointAddress("http://localhost/MyService");

    var channelFactory = new ChannelFactory<IService>(binding, address);

    var service = channelFactory.CreateChannel();

    service.MyOperation();

    service.Close();

    channelFactory.Close();

    ```


    The ChannelFactory class is generic, and its constructor requires the interface
    for the service proxy that you want it to create. Because this code also requires
    a Binding and an EndpointAddress, you must furnish the ChannelFactory with the
    full address/binding/contract (ABC). In this example, the IService interface is
    the same interface that the service implements. What you receive from ChannelFactory.CreateChannel
    is a proxy that, for each call made, will call the equivalent method on the server-side
    implementation. Because the same interface is used, client-side classes can require
    this interface as a constructor parameter to be resolved by dependency injection,
    and the client classes instantly become testable. In addition, they don''t have
    to know that they are calling a remote service.


    # Service Discovery


    Sometimes you might know the binding type of a service or its contract, but not
    the address where it is hosted. In this case, you can use Service Discovery, which
    was introduced to Windows Communication Foundation (WCF) in the .NET Framework
    4.


    Service Discovery comes in two flavors: managed and ad hoc. In managed mode, a
    centralized service called a discovery proxy is well known to clients, which directly
    send it queries for finding other services. This is the less interesting mode,
    because it introduces a single point of failure (SPOF): if the discovery proxy
    is not available, clients cannot access any other services because they are not
    discoverable.


    Ad hoc mode obviates the need for a discovery proxy by using multicast network
    messages. The default implementation of this uses the User Datagram Protocol (UDP),
    with each discoverable service listening on a specified IP address¹ for queries.
    Clients effectively ask the network whether there is a service that matches its
    query criteria—a contract or binding type, for example. In this scenario, if one
    of the services is unavailable, only that service cannot be discovered, whereas
    the rest will respond to requests. Listing 3-15 shows how to host a discoverable
    service programmatically, and Listing 3-16 shows how to add discoverability to
    a service via configuration.


    ¹ The IP address used is 239.255.255.250 (IPv4) or [FF02::C] (IPv6). The port
    used is 3702. This is set by the WS-Discovery standard, so it is not configurable.'
  merge: -1
  img_proc: true
