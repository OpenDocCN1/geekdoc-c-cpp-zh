- pgno: 328
  md: "The IEvent interface is extremely simple, containing just a string Name property.\
    \ By using these two interfaces, a decorator can be created, as in Listing 10-13,\
    \ that publishes a specific event when an entity is deleted.\n\n# LISTING 10-13\
    \ This decorator publishes an event when an entity is deleted.\n\n```\npublic\
    \ class DeleteEventPublishing<TEntity> : IDelete<TEntity>\n{\n    private readonly\
    \ IDelete<TEntity> decorated;\n    private readonly IEventPublisher eventPublisher;\n\
    \n    public DeleteEventPublishing(IDelete<TEntity> decorated, IEventPublisher\
    \ eventPublisher)\n    {\n        this.decorated = decorated;\n        this.eventPublisher\
    \ = eventPublisher;\n    }\n\n    public void Delete(TEntity entity)\n    {\n\
    \        decorated.Delete(entity);\n        var entityDeleted = new EntityDeletedEvent<TEntity>(entity);\n\
    \        eventPublisher.Publish(entityDeleted);\n    }\n    // ...\n    public\
    \ class EntityDeletedEvent<TEntity> : IEvent<TEntity>\n    {\n        public EntityDeletedEvent(TEntity\
    \ entity) : base(\"EntityDeleted\")\n        {\n            DeletedEntity = entity;\n\
    \        }\n\n        public TEntity DeletedEntity\n        {\n            get;\n\
    \            private set;\n        }\n    }\n}\n```\n\nFrom here, you have two\
    \ choices: implementing the equivalent ISave decorator for publishing events on\
    \ the same class or implementing the ISave decorator in a new class. Listing 10-14\
    \ shows the former option, which involves renaming the existing class and adding\
