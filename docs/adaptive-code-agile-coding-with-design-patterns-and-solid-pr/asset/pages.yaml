- pgno: 27
  md: "# PART I\n\n# Agile development frameworks\n\n+   CHAPTER 1\tIntroduction to\
    \ Scrum ........................................ 3\n+   CHAPTER 2\tIntroduction\
    \ to Kanban ................................. 45\n\n> **Note** If you are already\
    \ familiar with Scrum, Kanban, or other Agile software development frameworks,\
    \ feel free to skim this part of the book or skip it altogether. The aim of these\
    \ chapters is to provide a foundation that explains why adaptive code is so imperative\
    \ in Agile environments.\n\nSoftware products are built collaboratively, not in\
    \ isolation. They are the result of many people operating in different roles to\
    \ achieve a common aim. The governing processes that guide the delivery of software\
    \ products have a great influence on the products’ quality, timeliness, and economic\
    \ success. If the wrong process is used, the product is hampered before it has\
    \ even begun. When a complementary process is used, the product is able to flourish\
    \ and has a strong chance of thriving.\n\nThis part of the book introduces two\
    \ software development *frameworks*—Scrum and Kanban. Note that neither Scrum\
    \ nor Kanban is a process. Neither are to be slavishly adhered to. The term “framework”\
    \ is preferable to “process” because it implies guidelines and boundaries but\
    \ not rigid, sequential steps."
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Agile frameworks put the inevitability of change at the forefront and tackle
    it head on. Not only do they embrace change, they demand it. Your development
    framework might be Agile—that is, it might encourage innovation and iterative
    improvement—but your code might not. The chapters in this part of the book ground
    the rest of the content of the book, add context, and answer the following question:


    > *Given that Agile frameworks are now prevalent, how can you ensure that the
    code you write enables and complements your development framework?*


    Although this book is about code quality and not necessarily about software development
    processes, a solid understanding of Scrum and Kanban is imperative, because it
    illuminates the collaborative nature of writing code.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Introduction to Scrum


    After completing this chapter, you will be able to


    +   - Assign roles to the major stakeholders in a project.

    +   - Identify the documents and other artifacts that Scrum requires and generates.

    +   - Measure the progress of a Scrum project on its development journey.

    +   - Diagnose problems with Scrum projects and propose remedies.

    +   - Host Scrum meetings in an effective manner for maximum benefit.

    +   - Justify the use of Scrum over other methodologies, both Agile and rigid.


    Scrum is a project management methodology. To be more precise, it is an Agile
    project management methodology. Scrum is based on the idea of adding value to
    a software product in an iterative manner. The software development process is
    repeated—iterated—multiple times until the software product is considered complete
    or the process is otherwise stopped. These iterations are called sprints, and
    they culminate in software that is potentially releasable. All work is prioritized
    on the product backlog and, at the start of each sprint, the development team
    commits to the work that they will complete during the new iteration by placing
    it on the sprint backlog. The unit of work within Scrum is the story. The product
    backlog is a prioritized queue of pending stories, and each sprint is defined
    by the stories that will be developed during an iteration.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Figure 1-1 shows an overview of the Scrum process.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_30_0.png)


    Product backlog

    The product backlog contains features and stories to be implemented.


    Sprint backlog

    Stories that have been committed to the sprint are moved to the sprint backlog.
    Each story is implemented in priority order.


    Sprint

    Each sprint lasts between one and four weeks. With each day of the sprint, the
    team works toward completing the committed stories.


    Release

    After each sprint, newly implemented features are released in a new version of
    the product.


    FIGURE 1-1 Scrum works like a production line for small features of a software
    product.


    # Scrum is Agile


    Agile is a family of lightweight software development methods that embrace the
    changing requirements of customers even as the project is in progress. Agile is
    a reaction to the failings of more rigidly structured practices. The Agile Manifesto
    exemplifies the contrast. It can be found on the web at www.agilemanifesto.org.


    The Agile Manifesto was signed by 17 software developers. The Agile method has
    grown in influence in the intervening years to the extent that experience in an
    Agile environment is now a common prerequisite for software development roles.
    Scrum is one of the most common implementations of an Agile process.


    Scrum involves a mixture of documentation artifacts, roles played by people inside
    and outside the development team, and ceremonies—meetings that are attended by
    appropriate parties. A single chapter is not enough to explore the entirety of
    what Scrum offers as a project management discipline. However, this chapter offers
    enough detail to provide both a springboard to further learning and an orientation
    for the day-to-day practices of Scrum.


    The rest of this chapter covers the most important aspects of Scrum in more depth.
    Scrum’s positive attributes are considered, along with an honest appraisal of
    its shortcomings. This chapter and Chapter 2, "Introduction to Kanban," form the
    first part of the book and set the scene for the rest of the content. Writing
    code in such a way that it remains adaptive to change is a high priority when
    working within an Agile software development process. There is little point in
    having a process in which you claim to be able to handle change gracefully when
    the reality is that change is incredibly difficult to implement down at a code
    level.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Cynefin


    To further answer the question, “Why Agile?” the Cynefin framework comes to our
    aid.


    Cynefin (pronounced ki-neh-vin) is a sense-making framework. Figure 1-2 shows
    the different types of management modes that types of work might fit into.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_31_0.png)


    FIGURE 1-2 The Cynefin sense-making framework looks a little like a decision matrix,
    but don’t be fooled.


    Although this looks like a typical two-dimensional decision matrix or categorization
    matrix, it is different in an important way. With a 2 × 2 categorization matrix,
    the framework precedes the data. That is, new data coming in can be categorized
    if you have measurements for the two variables that are isolated by the framework.
    With Cynefin, the data precedes the framework, and therefore a more heuristic
    discovery is required to determine how best to proceed.


    The vertical split differentiates the options by their relationship to cause and
    effect. The right side of the framework represents ordered problems that exhibit
    predictable cause and effect, whereas the left side represents unordered problems.


    The “obvious” quadrant is where traditional management goes: a command-and-control
    model of best practices. When work fits this quadrant, you proceed to sense and
    categorize. This quadrant will be revisited later, because all is not quite as
    it seems.


    Proceeding counterclockwise, the next quadrant is “complicated.” Here, there are
    no well-defined “best practices,” only a choice of good practices. You proceed
    to sense and analyze before responding. This is where the bulk of expert-domain
    work fits, such as software development.'
  merge: -1
  img_proc: true
- pgno: 32
  md: "> Next, you cross over to the unordered realm of “complex” problems. Here,\
    \ there are not even “good practices” to be found, just **emergent practices**.\
    \ There is no understood causality; therefore, you proceed to *probe* and then\
    \ *sense*. If probing reveals positive outcomes, you amplify this behavior. If\
    \ probing reveals negative outcomes, you dampen that behavior.\n> \n> The final\
    \ quadrant is the realm of “chaotic” problems. Here, novel practice is your main\
    \ tool, and you proceed to *act* and then sense. Rarely should you knowingly venture\
    \ into chaos, and only for cutting-edge innovation. Try to stabilize back toward\
    \ the “complex.” Never should you unknowingly fall into chaos. This is represented\
    \ by the “cliff of complacency” which, highlights the peril of being too comfortable\
    \ in a “simple” problem domain. Limit the amount of work that fits into the “simple”\
    \ domain, because it can easily descend into chaos.\n> \n> Start your decision-making\
    \ by acknowledging that you are in the center of the model: the disordered world.\n\
    > \n> Much of this book ushers software development into the complicated quadrant,\
    \ rather than viewing delivery as a simple problem with process-like steps that\
    \ can be followed to guarantee success. This is the problem of software delivery\
    \ via a waterfall approach: it oversimplifies the complicated and mocks our efforts\
    \ by watching us over the cliff of complacency into chaos.\n> \n> Lean, or Agile,\
    \ approaches to software acknowledge that the problem of software delivery is\
    \ at least complicated and can even be complex.\n\n# Scrum versus waterfall\n\n\
    In my experience, the Agile approach works better than the waterfall method of\
    \ software development, and I evangelize only in favor of Agile processes. The\
    \ problem with the waterfall method is its rigidity. Figure 1-3 provides a representation\
    \ of the process involved in a waterfall project.\n\nNote that the output from\
    \ one stage becomes the input to the next. Also note that each phase is completed\
    \ before moving to the next phase. This assumes that no errors, issues, problems,\
    \ or misunderstandings are discovered after a phase has completed. The arrows\
    \ point only one way!\n\nThe waterfall process also assumes that no changes will\
    \ be required after a phase has completed, something that is contrary to empirical\
    \ and statistical evidence. Change is a natural part of life, not just of software\
    \ engineering. Waterfall approaches assert that change is expensive, undesirable,\
    \ and—most damningly—*avoidable*. Waterfall approaches presume that change can\
    \ be circumvented by spending more time on requirements and design, so that changes\
    \ do *not occur* during subsequent phases. This is preposterous, because change\
    \ will *always happen*.\n\nAgile processes respond to this fact by adopting a\
    \ different approach that welcomes change and allows everyone to adapt to the\
    \ changes that *will occur*. Although Agile—and therefore Scrum—allows for change\
    \ at a process level, *coding for change* is one of the hardest, yet most important,\
    \ tenets of modern software development."
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_33_0.png)


    # FIGURE 1-3 The waterfall development process.


    This book shows you how to produce code that is adaptive enough to survive inevitable
    changes in requirements.


    Waterfall methodologies are also document-centric, generating a lot of documentation
    that does not directly improve the software product. Agile, on the other hand,
    considers working software to be the most important document of a software product.
    The behavior of software is, after all, dictated by its source code—not by the
    documents that accompany that code. Furthermore, because documentation is a separate
    entity from the source code, it can easily fall out of sync with software.


    > Note This is not to say that documentation is unimportant or that Agile processes
    never produce documentation. It is a matter of emphasis—Agile emphasizes working
    software, whereas waterfall methods emphasize documentation.


    Scrum prescribes some metrics that provide feedback on the progress of a project
    and its overall health, but this is not documentation about the product. Agile,
    in general, favors just enough documentation to avoid being irresponsible, but
    it does not mandate such documentation. Some code can certainly benefit from supporting
    documentation, providing that it is not written once and never read again. For
    this reason, living documents that are easy to use, such as wikis, are common
    tools in Scrum teams.


    The aim of Scrum as a process is not only to iteratively refine the software product,
    but also to iteratively refine the development process. This reminds teams to
    adopt process changes to ensure that the process is working for them, given their
    unique situations and context.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Different forms of Scrum


    Whenever a development team claims that they follow the Scrum methodology, they
    usually mean that they follow some **variant** of Scrum. Pure Scrum does not include
    a lot of common practices that have been taken from other Agile methods, such
    as Extreme Programming (XP). There are three different subcategories of Scrum
    that progressively veer further away from the “purist” implementation.


    # Scrum and...


    Common practices like writing unit tests first and pair-programming are not part
    of Scrum. However, they are useful and worthy additions to the process for many
    teams, and so they are considered complementary practices. When certain practices
    are added from other Agile methods such as XP or Kanban, the process becomes “Scrum
    and...” — that is: Scrum plus extra best practices that enhance, rather than detract
    from, the default Scrum process.


    # Scrum but...


    Some development teams claim to be practicing Scrum, but they omit key aspects.
    For example, consider a team whose work is ordered on a backlog that is carried
    into iterative sprints, and that has retrospectives and daily stand-up meetings,
    but that doesn’t estimate in story points and instead favors real-time estimates.
    This sort of diluted version of Scrum is termed “Scrum but....” Although the team
    is aligned with Scrum in a lot of areas, they are misaligned in one or two key
    areas.


    # Scrum not...


    If a development team moves far enough away from the Scrum method, they end up
    doing “Scrum not....” This causes problems, particularly when team members expect
    an Agile methodology and the actual process in place is so different that it barely
    resembles Scrum at all. I find that the daily stand-up meeting is the easiest
    part of Scrum to adopt, but relative estimation and a positive attitude to change
    are much more difficult. When enough parts of the Scrum process are neglected,
    the process is no longer Scrum.


    # Roles and responsibilities


    Scrum is just a process, and—I cannot stress this enough—it is only as effective
    as the people who follow the process. These people have roles and responsibilities
    that guide their actions.


    # Product owner


    The role of the product owner (sometimes called the *PO*) is vital. The product
    owner provides the link between the client or customer and the rest of the development
    team. A product owner’s responsibilities include:


    +   - Deciding which features are built.

    +   - Setting the priority of the features in terms of business value.

    +   - Accepting or rejecting “completed” work.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'As a key stakeholder in the success of the project, the PO must be available
    to the team and be able to communicate the vision clearly. The long-term goal
    of the project should be clear to the development team, with changes in focus
    propagated throughout the team in a timely manner. In short-term sprint planning,
    the product owner sets out what will be developed and in what order. Product owners
    determine the features that will be needed along the road to making a release
    of the software, and they set the priorities for the product backlog.


    Although the product owner’s role is key, he or she does not have unlimited influence
    over the process. The product owner cannot influence how much the team commits
    to for a sprint, because this is determined by the team itself based on its velocity.
    Product owners also do not dictate how work is done—the development team has control
    over the details of how it implements a certain story at a technical level. When
    a sprint is underway, the product owner cannot change the sprint goals, alter
    acceptance criteria, or add or remove stories. After the goals are decided and
    the stories are committed to the sprint during sprint planning, the sprint in
    progress becomes immutable. Any changes must wait until the next sprint—unless
    the change is to cancel the sprint or project in its entirety and start again.
    This allows the development team to retain total focus on achieving the sprint
    goal without moving the goalposts.


    Throughout the sprint, as stories progress and are completed, the product owner
    will be asked to verify how a feature works or comment on a task that is in progress.
    It is important that product owners be able to devote some time during the sprint
    to liaise with the development team, in case the unexpected occurs and confusion
    arises. In this way, by the end of the sprint, the product owner is not presented
    with “completed” stories that deviate from their initial vision. Product owners
    do, however, get to decide whether a story meets the acceptance criteria supplied
    and whether it is considered complete and can be demonstrated at the end of the
    sprint.


    # Scrum master


    The Scrum master (SM) shields the team from any external distractions during the
    sprint and tackles any of the impediments that the team flags during the daily
    Scrum meeting. This keeps the team fully functional and productive for the duration
    of the sprint, allowing it to focus wholly on the sprint goals.


    Just as the product owner owns the product—what is to be done—the Scrum master
    owns the process—the framework surrounding how it is to be done. Thus it is the
    Scrum master’s responsibility to ensure that the process is being followed by
    the team. Although the Scrum master can make some suggestions for improving the
    process (such as switching from a four-week sprint duration to a two-week duration),
    the Scrum master’s authority is limited. Scrum masters cannot, for instance, specify
    how the team should implement a story, beyond ensuring that it follows the Scrum
    process.


    > Tip Scrum masters are servant leaders. This means that they do not embody an
    accumulation of power at the top of a pyramid of roles. Instead, they seek to
    devolve power into each team member. This empowerment of their team leads to better
    engagement and a stronger sense of purpose and place within the project.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'As owners of the process, Scrum masters also own the daily Scrum meeting. The
    Scrum master ensures the team’s attendance and takes notes throughout in case
    any actionable items are uncovered. The team is not *reporting* to the Scrum master
    during the Scrum meeting; they are informing *everyone* present of their progress
    and impediments.


    # Development team


    Ideally, an Agile team consists of *generalizing specialists*. That is, each member
    of the team should be multidisciplinary—capable of operating effectively on several
    different technologies, but with an aptitude, preference, or specialization in
    a certain area. For example, a team could consist of four developers, each of
    whom is capable of working very competently on ASP.NET MVC, Windows Workflow,
    and Windows Communication Foundation (WCF). However, two of the developers specialize
    in Windows Forms, and the remaining pair prefer to work with Windows Presentation
    Foundation (WPF) and Microsoft SQL Server.


    Having a cross-functional team prevents siloes where one person—the “web person,”
    the “database person,” or the “WPF person”—has sole knowledge of how that part
    of the application works. Siloes are bad for everyone involved, and there should
    be heavy emphasis placed on breaking down siloes wherever possible. Siloes are
    bad for the company because it makes them depend too heavily on a single resource
    to provide value in a certain area. This can become a bottleneck to the throughput
    of the team. And the individuals themselves suffer because they become entrenched
    in roles that “only they can do.” In Scrum, the code is owned by the whole team.


    Software testers are responsible for maintaining the quality of the software while
    it is being developed. Before a story is started, the testers might discuss automated
    test plans for verifying that the implementation of a story meets all of the acceptance
    criteria. They might work with the developers to implement those test plans, or
    they might write such tests themselves. After a story is implemented, the developer
    can submit it for testing, and the test analyst will verify that it is working
    as required.


    # Pigs and chickens


    Each role of the Scrum process can be categorized as a pig or a chicken. These
    characterizations relate to the following story: A chicken approaches his friend,
    the pig, and says, “Hello pig, I’ve had an idea. I think we should open a restaurant!”
    At first, the pig is enthusiastic and enquires, “What should we call it?” The
    chicken replies, “We could call it Ham ’n’ Eggs.” The pig ponders this briefly
    before exclaiming in outrage, “No way! I’d be *committed*, but you’d only *contribute*!”


    This fun allegory highlights the level of involvement that certain members need
    to have in a project. Pigs are entirely committed to a project and will be accountable
    for its outcome, whereas chickens merely contribute and are involved in a more
    peripheral manner. The product owner, the Scrum master, and the development team
    are all pigs inasmuch as they are committed to the delivery of the product. Most
    often, customers are contributing chickens. Similarly, executive management will
    contribute to the project, so they are also considered chickens rather than pigs.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Artifacts


    Throughout the lifetime of any software project, many documents, graphs, diagrams,
    charts, and metrics are created, reviewed, analyzed, and dissected. In this respect,
    a Scrum project is no different from any other. However, Scrum documents are distinct
    from documents of other types of project management in their type and purpose.
    A key difference between all Agile processes and more rigid processes is the relative
    importance of documentation. Structured Systems Analysis and Design Methodology
    (SSADM), for example, places a heavy emphasis on writing lots of documentation.
    This is referred to pejoratively as Big Design Up Front (BDUF): the errant belief
    that all fear, uncertainty, and doubt can be eliminated from a project if sufficient
    attention is paid to documentation. Agile processes aim to reduce the amount of
    documentation produced to only that which is absolutely necessary for the project
    to succeed. Instead, Agile favors the idea that the code—which is the most authoritative
    documentation—can be deployed, run, and used at any time. It also prefers that
    all stakeholders communicate with each other directly rather than write documents
    that might never be read by their most important audience. Documentation is still
    important to an Agile project, but its importance does not supersede that of working
    software or communication.


    # The Scrum board


    Central to the daily workings of a Scrum project is the Scrum board. There should
    be a generous amount of wall space reserved for the Scrum board—if the board is
    too small, the temptation is to omit important details. Wall space might well
    be at a premium in your office, but there are tricks that you can use. Perhaps
    that large, neglected whiteboard could be repurposed as a Scrum board. With the
    aid of magnets, metal filing cabinets can double as the Scrum board. If your office
    is rented or you otherwise cannot deface the walls, “magic” whiteboards—which
    are simply wipe-clean sheets of static paper—are ideal. Try to identify a suitable
    place that could perform this function in your office. Whatever you choose, however
    you designate it, if it doesn’t feel right after a couple of iterations, feel
    free to change it. Physical Scrum boards are an absolute must. There is nothing
    that can replace the visceral experience of standing in front of a Scrum board.
    Though digital Scrum tools have their uses, I believe that they are complementary,
    rather than primary, to the Scrum process. If you can evaluate a digital Scrum
    board, note the number of times that something appears more difficult to accomplish
    than if the board were physical. In my experience, digital Scrum boards are a
    pain, not a pleasure. Figure 1-4 shows an example of a typical Scrum board.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_38_0.png)


    **FIGURE 1-4** A Scrum board is a snapshot of the state of the work currently
    in development.


    A Scrum board is a hive of information. It holds a lot of details, and discerning
    what is happening might be daunting. The rest of this section explains each aspect
    in detail.


    # Cards


    The primary items on the Scrum board are the cards. The cards represent different
    elements of progress for a software product—from a physical release of the software
    down to the smallest distinct task. Each of these card types is typically represented
    by a different color, for clarity. Due to space constraints, the Scrum board usually
    shows only the stories, tasks, defects, and technical debt associated with the
    current sprint.


    > **Tip** Colors alone might not be sufficient for the requirements of everyone
    on the team. For example, consider coupling colors with distinct shapes for team
    members who can’t distinguish colors.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Hierarchy of composition


    Figure 1-5 shows how the cards on a Scrum board are related. Note that it is implied
    that a product is composed of many tasks. Even the most complex software can be
    distilled into a finite list of discrete tasks that must be performed, each paving
    the way to completion.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_39_0.png)


    FIGURE 1-5 The cards on the Scrum board represent different parts of an aggregated
    product.


    # Product


    At the top of the Scrum food chain is the software product that is being built.
    Examples of products are bountiful: integrated development environments, web applications,
    accounting software, social media apps, and many more. This is the software that
    you are developing and the product you intend to deliver.


    Teams usually work toward only one product at a time, but sometimes teams are
    responsible for delivering multiple products.


    # Release


    For every product that you develop, there will be multiple releases. A release
    is a version of the software that end users can purchase or use as a service.
    Sometimes a release is made only to address defects, but a release could also
    be intended to provide value-add features to key clients or to make a beta version
    of the software available as a sneak preview.


    Web applications are often implicitly versioned with only a single deployment
    that supersedes all prior releases. In fact, the Google Chrome web browser is
    an interesting example. Although it is a desktop application, it is deployed as
    a stream of micro-releases that are seamlessly deployed to desktops without the
    usual fanfare that accompanies rival browsers. Internet Explorer 8, 9, and 10
    each had their own advertisements on television, but Chrome does not follow this
    pattern—Google simply advertises the browser itself, irrespective of version.
    Iterative releases like this are becoming more common. Scrum can direct this release
    pattern by focusing on the potential to deliver working software after every sprint.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Minimum viable product


    The first release can be aligned to a minimum viable product (MVP)—the basic set
    of features that are deemed sufficient to fulfill the fundamental requirements.
    For accounting software, for example, this feature set could be limited to the
    ability to create new clients, add transactions (both deposits and withdrawals)
    to their accounts, and present a total. The idea here is to bootstrap the project
    so that it becomes self-funding as soon as possible. Although this is unlikely
    to occur as a result of the MVP, the hope is that the MVP will at least bring
    in some revenue to offset the ongoing costs of development. Not only this, but
    that first deployment, even if it targets a restricted client base, is likely
    to provide vital feedback that can influence the direction of the software. This
    is the nature of Scrum—and Agile in general—constantly evolving the software product
    with the knowledge that all software is subject to change.


    Regardless of the intent of the release or how it is deployed (or even how often),
    ideally a single product will survive several releases.


    # Feature


    Each release is made up of one or more features that were previously not present
    in the software. The most significant difference between version 1.0 and version
    2.0 of any piece of software is the addition of new features that the team believes
    will generate sufficient interest to persuade new users to make a purchase and
    existing users to upgrade.


    The term minimum marketable feature (MMF) is useful to delineate features and
    compose a release. The following is a list of example features that are generic
    enough to be applied to many different projects, yet specific enough to be real-world
    features:


    +   - Exporting application data to a portable XML-based format

    +   - Rendering webpage requests quickly

    +   - Archiving historical data for future reference

    +   - Copying and pasting text

    +   - Sharing files across a network with colleagues


    Features are marketable if they have some value for the customer. When distilled
    down to the smallest amount of functionality possible while still retaining its
    value, the feature is also minimal.


    # Epics/features vs. MMFs vs. themes


    You might be more used to the term epic rather than feature when talking about
    Scrum, but I have taken the liberty of switching this out for my preferred term.
    Epics and features are often considered "large stories": that is, stories that
    are much larger than MMFs and that cannot be delivered in a single sprint.


    Features are also similar to Scrum themes in that they serve to group stories
    that fulfill a common goal.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Features can be broadly grouped into three categories for each release: required,
    preferred, and desired. These are mutually exclusive options that reflect the
    overall priority assigned to each feature. The development team is instructed
    to work on all **required** features before tackling the **preferred** features,
    with the **desired** features being addressed only if time allows. As you might
    have guessed, these categories—and, indeed, the features themselves—are always
    changeable. They can be canceled, reprioritized, altered, and superseded at any
    time. The team is expected to switch focus gracefully (with the proviso that deadlines
    and funding might also change in kind). Everything in Scrum is a moveable feast,
    and this book is aimed to help you deal with that reality.


    # User story


    The user story is probably the Scrum artifact that most people are familiar with,
    but ironically, it is not prescribed by Scrum. User stories are an artifact of
    Extreme Programming, but they have been co-opted by Scrum because they are so
    commonly used. User stories are specified by using the following template:


    > “As a [user role], I want to [verb-centric behavior], so that [user value added].”


    The square brackets denote parameterization that distinguishes one user story
    from another. A concrete example should illuminate further:


    > “As an unauthenticated but registered user, I want to reset my password, so
    that I can log on to the system if I forget my password.”


    There are many things to note about this user story. First of all, *there is not
    nearly enough detail to actually implement the behavior required.* Note that the
    user story is written from the perspective of a user. Although this would seem
    to be obvious, this point is missed by many and, too often, stories are wrongly
    written from the perspective of developers. This is why the first part of the
    template—*As a [user role]—*is so important. Similarly, the *[user value added]*
    portion is just as important because, without this, it is easy to lose sight of
    the underlying reason that the user story exists. This is what ties the user story
    to its parent feature; the example just given could belong to a feature such as
    *“Forgotten user credentials are recoverable.”* And the story would probably be
    grouped with the story in which the user has forgotten his or her logon name and
    the story in which the user has forgotten both logon name and password.


    Given that this user story is not sufficient to begin development, what is its
    value? A user story represents a conversation that is yet to occur between the
    development team and the customer. When it comes time to implement the story,
    the developers assigned to it will start by taking the story to the customer and
    talking through the customer’s requirements. This analysis phase will produce
    several acceptance criteria that determine whether a user story can be deemed
    complete.


    After the requirements have been gathered, the developers convene and lay out
    some design ideas to meet these requirements. This phase might include user interface
    mockups that use Balsamiq, Microsoft Visio, or some other tool. Some technical
    design concepts will detail how the existing code base must be altered to meet
    these new requirements, often using Unified Modeling Language (UML) diagrams.


    After the design is ratified, the team can start to break the user story down
    into tasks and then work toward implementing the story by performing these tasks.
    When they reach a point where they'
