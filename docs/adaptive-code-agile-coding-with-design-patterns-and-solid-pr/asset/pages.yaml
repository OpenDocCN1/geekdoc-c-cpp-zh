- pgno: 208
  md: '# Further testing


    Unit testing is not the only kind of testing that provides value. If only unit
    tests were used, only the lowest-level details of the code would be verified.
    By now, it should be clear that software exists at different levels of granularity,
    and unit tests deal only with the most granular elements.


    There are two ubiquitous diagrams that explain the differences between tests at
    various levels. The testing pyramid reminds you of the relative number of tests
    that you should aim to maintain. The testing quadrant diagram explains that tests
    can be useful to different stakeholders and for different reasons.


    # The testing pyramid


    Figure 5-9 shows the testing pyramid. It is likely that you have seen this before.
    It is a useful reference when discussing the relative quantity of tests that are
    used to verify a system.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_208_0.png)


    FIGURE 5-9 The testing pyramid shows the relative quantity of different types
    of tests.


    Above the top level of the pyramid is a cloud of uncertainty, which represents
    the manual testing that exercises the system. This can take the form of written
    checklists that require a real user interacting with the system to verify correctness.
    There should be few of these, because they are not repeatable without manual intervention,
    which is costly and time-consuming.


    Below the manual tests are the acceptance tests. These tests could be implemented
    in an automated user interface suite such as Selenium. They are intended to replicate
    the interactions of a user and assert against the expectations. There should only
    be a few of these tests, because they are large and difficult to maintain. If
    these tests are to be relevant, the entire system must be deployed into a test
    environment that closely represents a live environment.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The middle tier of the pyramid contains component-level integration tests.
    These could take the form of API tests in which a service is treated as a black
    box. For a variety of data inputs, the tests assert that the correct responses
    are returned. There are likely to be more of these kinds of tests than automated
    UI tests, but not so many that they become neglected and brittle.


    The bottom tier of the pyramid is the largest and represents the unit tests.


    There are no absolute numbers that can be applied to these layers. The pyramid
    simply maintains that one layer should be relatively smaller or larger than another.
    An order of magnitude might be a good guideline to follow, because it allows the
    actual number to remain relative. If there are hundreds of unit tests for a system,
    there should be only tens of component-level tests and only a handful of automated
    user interface tests. The numbers can scale up or down from there, with the smallest
    systems not requiring high-level tests at all.


    # Testing pyramid anti-patterns


    Sketching the testing pyramid for a system can be a useful diagnostic tool for
    problems with the code''s adaptability. If mapping the relative quantity of tests
    at each level forms a shape other than a pyramid, there are too many or too few
    of a category of tests.


    # The hourglass


    Figure 5-10 shows what happens when a test pyramid is too top-heavy: it becomes
    an hourglass.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_209_0.png)


    FIGURE 5-10 When it has too many integration and acceptance tests, code is difficult
    to change.


    When there are too many high-level tests, developers are burdened with the maintenance
    effort of ensuring that these tests run to completion. They also must write new
    tests, often at a rate at which the cost outweighs the benefit. Recall that testing
    gives you confidence that something is working.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'After you reach your confidence threshold, the marginal extra confidence generated
    by continuing to add tests is not worth the effort. It is better to stop and focus
    on the quality and maintainability of the existing tests.


    # The snowcone


    Figure 5-11 shows what happens when the test pyramid becomes fully inverted: the
    cloud of uncertainty at the top has grown to gargantuan proportions, and there
    are almost no unit tests in sight.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_210_0.png)


    FIGURE 5-11 When the relative quantities of tests are inverted, the pyramid becomes
    a snowcone.


    When the majority of testing effort is manual, this indicates that you have an
    untestable codebase. Work should begin promptly to refactor the code so that it
    is inherently testable. To factor in such work, use a combination of the golden
    master technique (see Chapter 6, "Refactoring") and Kanban''s class of service
    (see Chapter 2, "Introduction to Kanban").


    Manual tests are not as reliable as automated tests because of the fallibility
    of the person executing the test script. Such repetitive, monotonous work quickly
    becomes demotivating. Work to automate what you can so that the manual tests can
    be cheaply repeated whenever necessary.


    # The testing quadrant


    The testing covered in the testing pyramid exists at different granularities,
    from coarse-grained user interface tests to fine-grained unit tests. The test
    quadrant provides a complementary view of tests: they are applicable to different
    stakeholders and for different reasons.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'To readers who are already somewhat familiar with the testing quadrant—after
    all, it is quite an old idea—the version presented in Figure 5-12 might look different.
    Software consultant Gojko Adzic admirably refreshed the testing quadrant to make
    it more relevant to the current state of the art. This figure is reproduced with
    the permission of Gojko Adzic.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_211_0.png)


    FIGURE 5-12 The testing quadrant helps categorize the audience and purpose of
    different test categories.


    As with all quadrant-based models, there are two axes to consider. On the vertical
    axis, the intended audience of the tests is addressed: technologists or business.
    On the horizontal axis, the test purpose is addressed: expectation verification
    (quantitative) versus analytical (qualitative) outcomes.


    # Business/Quantitative


    Businesses tend to have service level agreements (SLAs) with their customers and
    clients. These are formalized, quantifiable standards with which the business
    must comply or be liable for providing the client some form of compensation. Availability
    is a common SLA criterion, whereby the business promises to keep a service available
    with 99.9% uptime. Because this is measurable and has a direct effect on the business,
    tests for these sorts of standards live in this quadrant.


    # Business/Qualitative


    Subjective concerns such as usability are found in this quadrant. The emphasis
    here is less on the technologies involved and more on the business impact of the
    software. A/B and multivariate testing, which allow for multiple versions of components
    to be evaluated through experimentation, are an emerging trend across the wider
    software spectrum. Rather than focus-group testing whether your users prefer cornflower
    blue or ocean blue, the two blues can be A/B tested and the statistical significance
    of conversion uplift can be measured.


    # Technology/Quantitative


    Unit tests reside in this quadrant, as do integration tests. These tests support
    the development team in quantifying how closely the system meets its requirements.
    Statistics such as unit test pass percentage, code coverage, and cyclomatic complexity
    indicate the overall health of a system.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Technology/Qualitative


    Here you focus on architectural capabilities for which you might not have quantifiable
    requirements. Load testing focuses on the resource usage that a system exhibits
    under various amounts of load. For a service, this is likely to include throughput
    statistics and response time curves as more users concurrently access the system.
    Assessing the security of a system is also a qualitative activity; this is assessed
    through penetration testing. The attack vectors of a system are difficult to quantify,
    so a more analytical approach is needed.


    The testing quadrant shows that there are different categories of each kind of
    test. Although this book primarily focuses on the low-level details of unit test
    implementation and design, the adaptability of your code also relies on having
    the right amount of the right type of tests.


    # Testing for prevention and cure


    All of the testing discussed so far has dealt with testing for prevention. That
    is, effort is expended up front to ensure that new functionality works as expected
    and that no existing functionality has been regressed.


    This is standard practice. But it is not without cost. Every test written takes
    time and effort. Confidence is the currency of tests. The equation to bear in
    mind is this:


    effort < confidence


    If your efforts do not generate the requisite test confidence, they are too costly
    and you should focus your effort elsewhere. Of course, all projects have a target
    confidence that calibrates their tolerance for failure. The software embedded
    in a pacemaker requires far more confidence than that which powers a commercial
    software-as-a-service solution. Following the correlation of effort and confidence,
    the effort that can be expended to ensure the correct working of a pacemaker is
    thus much higher.


    But, if you are not writing such mission-critical software, what are your options
    for reducing the effort and increasing the confidence?


    Figure 5-13 shows how software typically makes its way from development through
    to a live environment.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_212_0.png)


    FIGURE 5-13 Software can be deployed to many environments for testing before reaching
    a live environment.


    With each phase of the process, your confidence in the functional correctness
    and robustness of the software increases. By exercising the code at different
    scopes and in different environments, you generate feedback that the code is working
    or is broken. After the code is released and verified in a'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'live environment, your confidence is at its highest. What if you could find
    a shortcut from development to live? Your confidence would increase dramatically,
    yet the effort required would be minimal.


    > “But,” you say, “without those incremental increases in confidence, we would
    fail in live so much more!”


    Good.


    There should never be a fear of failure in software development. If your culture
    is to fear failure, you cannot innovate. Instead, embrace the fact that you will
    fail, that you will roll back some releases. Failure is a better teacher than
    success. What you must do is shift your focus from Mean Time Before Failure (MTBF)
    toward Mean Time To Recovery (MTTR).


    MTBF is a great measurement for systems in which you require a high level of confidence.
    It shows that the system is robust and has been very rigorously exercised. But
    as you now know, that level of confidence is expensive and is anathema to innovation.


    MTTR, however, not only allows for failure, it prepares for it. Consider the possibility
    that you have a system with an MTBF of 100 days and an MTTR of 1 day. Thus, in
    aggregate, every three years, the system is unavailable for a day.


    Compare this with a system that has an MTBF of 10 days and an MTTR of 1 hour.
    This system fails 10 times as often as the last! However, when it fails, it is
    operable again in only one hour: twenty-four times faster than the other system.


    System 1 has an uptime of 99.99%.


    System 2 has an uptime of over 99.995%.


    You are enabled to fail fast by focusing on MTTR. This lets you loosen your grip
    on MTBF and innovate faster.


    # How do you decrease MTTR?


    When a service fails in a live environment, you must do something with it to put
    it back in a workable state. But first, you need to know that it isn’t working.
    Through a mixture of logging and alerting, you can monitor the health of your
    systems.


    Logging is passive. If logging was the only option available, there would be a
    lot of time wasted polling the logs to see if something was going wrong. This
    is infeasible for most systems, because they could generate so much logging data
    that trying to discern a failure would become nearly impossible.


    Alerting is active. When logging is in place, you can set acceptable boundaries
    that a variety of metrics should stay inside. If a metric breaches one of the
    boundaries, alerting can generate an event that informs you to start looking at
    specific parts of the logs and to take action.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Examples of metrics are service throughput, response time, and machine resource
    usage such as percentage of RAM, CPU, and disk that have been used. Other metrics
    might be domain-specific: a fall in conversion rate or overall completed transactions,
    for example.


    With monitoring and alerting, you can increase your confidence that you will spot
    an issue in your live environment, and this is the first step toward recovery.


    # Conclusion


    This chapter has covered a variety of unit testing patterns and practices that
    will allow you to change your codebase without fear of breaking existing functionality.


    Each unit test you write should represent an expectation of the code. Although
    as code they are technical artifacts, unit tests enforce real-world behavior in
    objects, just as those objects encapsulate real-world concepts.


    When you diligently follow a test-first approach, you write no new production
    code without first constructing a failing unit test. Then you write the simplest
    production code possible to transition the unit test from a red failure state
    to a green success state. Taken to its logical conclusion, the production code
    becomes a natural side effect of fulfilling the expectations of its unit tests.


    When you unit test code, you give yourself a firm foundation to subsequently alter
    the production code to make it clearly more adaptive to future requirements. The
    refactoring of code is an incremental process of improving the code’s design.
    The next chapter dives deeper into refactoring.'
