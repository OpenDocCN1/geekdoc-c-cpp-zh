    \ connascence between and within modules is a qualitative measure of its adaptability.\
    \ Figure 13-1 shows the nine levels of connascence presented in order, from worse\
    \ at the top to better at the bottom.\n\n+   Worse\n+   Identity\n+   Value\n\
    +   Timing\n+   Execution order\n+   Position\n+   Algorithm\n+   Meaning\n+ \
    \  Type\n+   Name\n+   Better\n\nFIGURE 13-1 The nine levels of connascence in\
