- pgno: 221
  md: "Without the switch statement, there is no reason for this class to be aware\
    \ of its \"type\" anymore, so the constructor has been removed, too. The class\
    \ is abstract due to the abstract calculation method, but this means that you\
    \ can no longer instantiate it and, consequently, you can no longer test it.\n\
    \n# Indiana Jones and the aggressive refactor\n\nAt the start of the Indiana Jones\
    \ movie, Raiders of the Lost Ark, the hero is deep in a Peruvian cave attempting\
    \ to recover a small idol. He is aware that there are booby-traps set that will\
    \ be triggered by the weighted switch on which the idol sits. He fills a cloth\
    \ bag with sand and tries to use this as a proxy for the idol. His theory is that\
    \ if he substitutes the sandbag for the idol quickly enough, he will prevent the\
    \ switch from being tripped and the booby-trap will not fire.\n\nUnfortunately\
    \ for Indy, his plan fails and he is chased from the cave by a giant boulder.\
    \ As initiating incidents go, it's one of the most memorable. But there is a technique\
    \ in there that can be applied to redesigning: parallel implementations.\n\nThe\
    \ golden idol is represented by the existing class or method, and the bag of sand\
    \ is analogous to the new design. Implementing the new design in parallel allows\
    \ the client code to be updated right at the last minute, effectively swapping\
    \ out the golden idol for the bag of sand. The old design can then be removed,\
    \ safely and entirely.\n\nThe refactor of the Account classes is an example of\
    \ an aggressive refactor that requires intermediate objectives via parallel implementations.\
    \ Note that the compelling advantage of parallel implementation is that, throughout\
    \ the whole process, progress can be saved at any time for later resumption. Refactoring\
    \ should not prevent you from committing to source control at regular intervals.\
    \ Aim to commit every 10 to 15 minutes.\n\nAn object instance is needed for the\
    \ unit tests to work, so the next step is to link the three account types as subclasses\
    \ of this base. A useful naming convention—similar to prefixing interface names\
    \ with a capital I—is to suffix abstract classes with Base. This is a quick clue\
    \ that the class cannot be instantiated and has associated subclasses.\n\nWhen\
    \ the three subclasses are created, you can remove the Balance property from the\
    \ GoldAccount and PlatinumAccount because they will inherit the Balance and AddTransaction\
    \ members from this base. Listing 6-5 shows all three classes after this step.\n\
    \n# LISTING 6-5 Complete the refactor by inheriting from the base class.\n\n```\n\
    public class SilverAccount : AccountBase\n{\n    public override int CalculateRewardPoints(decimal\
    \ amount)\n    {\n        return Math.Max((int)decimal.Floor(amount / SilverTransactionCostPerPoint),\
    \ 0);\n    }\n\n    private const int SilverTransactionCostPerPoint = 10;\n}\n\
    ```"
  merge: -1
  img_proc: true
