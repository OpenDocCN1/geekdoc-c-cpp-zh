- pgno: 399
  md: "can you tell what dependencies this class needs? With the service locator,\
    \ you have to examine the code, searching for capricious calls that retrieve a\
    \ required service. Constructor injection allowed you to view dependencies—all\
    \ of them—with a glance at the constructor, or at a distance, via IntelliSense.\n\
    \nThe problem is not necessarily one of unit testing. The service locator allows\
    \ you to set an IServiceLocator implementation before use, which means that it\
    \ can be mocked and the classes can be unit tested. At least it does not prevent\
    \ that. It just seems absurd to register classes and map them to their interfaces—a\
    \ significant undertaking—only to pollute controllers, services, and other classes\
    \ with infrastructural code such as this. It is doubly absurd when there is no\
    \ problem to be solved—constructor injection did not need to be circumvented in\
    \ this way.\n\nAn adapter for the service locator is provided for Unity. Listing\
    \ 12-23 shows how this is registered after the mappings have been set up.\n\n\
    # LISTING 12-23 The service locator will delegate directly to the UnityContainer\
    \ instance to resolve instances.\n\n```\nprivate void OnApplicationStartup(object\
    \ sender, StartupEventArgs e)\n{\n    CreateMappings();\n\n    container = new\
    \ UnityContainer();\n    container.RegisterType<ApplicationSettings>();\n    container.RegisterType<ObjectMapper,\
    \ MapperAutoMapper>();\n    container.RegisterType<ITaskService, TaskServiceAdo>();\n\
    \    container.RegisterType<TaskListController>();\n    container.RegisterType<TaskListView>();\n\
    \n    ServiceLocator.SetLocatorProvider(() => new UnityServiceLocator(container));\n\
    \n    MainWindow = container.Resolve<TaskListView>();\n    MainWindow.Show();\n\
    \n    ((TaskListController)MainWindow.DataContext).OnLoad();\n}\n```\n\nThis looks\
    \ remarkably similar to the prior versions except for setting the locator provider.\
    \ The call to Resolve, though, does not truly \"resolve\" the object graph; there\
    \ are no longer any dependencies to inject into the TaskListView. They are all\
    \ fetched individually as and when needed within the methods of the class.\n\n\
    The Service Locator anti-pattern is a good example of literal irony applied to\
    \ a programming context, in that what is claimed is contrary to the reality. It\
    \ is claimed that classes do not have dependencies, due to their default constructor,\
    \ but that is simply not the case: they do have dependencies, otherwise you wouldn't\
    \ be trying to fetch them from a service locator!\n\nUnfortunately, the service\
    \ locator is sometimes an unavoidable anti-pattern. In some application types—particularly\
    \ Windows Workflow Foundation—the infrastructure does not lend itself to constructor\
    \ injection. In these cases, the only alternative is to use a service locator.\
    \ This is better than not injecting dependencies at all. For all my vitriol against\
    \ the anti-pattern, it is better than instantiating new classes directly. After\
    \ all, it still enables those all-important extension points provided by interfaces\
    \ that allow decorators, adapters, and similar benefits."
