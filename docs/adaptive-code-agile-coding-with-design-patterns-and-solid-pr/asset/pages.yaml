- pgno: 400
  md: "# Injecting the container\n\nClosely related to the service locator is the\
    \ concept of injecting the container directly into a class. This, similarly, hands\
    \ the class the keys to the safe, in that it is then free to retrieve anything\
    \ that it wants from the container. Imagine such a class that, scattered throughout\
    \ its many methods, retrieves a dozen services. Now compare it with a class that\
    \ has a constructor that requires those dozen services and enforces their presence\
    \ with up-front preconditions that throw exceptions if null references are passed\
    \ in. Both classes are clearly doing too much—as indicated by the dependencies\
    \ they require—and should be refactored into smaller classes or their dependencies\
    \ meaningfully grouped. However, only the latter makes it explicitly obvious at\
    \ a glance that this smell exists.\n\nAdded to this, the class that requires the\
    \ container as a constructor parameter must also reference the container's assembly.\
    \ This will proliferate infrastructural code throughout the entire codebase, because\
    \ each class accepts the container in order to access the services it truly needs.\n\
    \n# Illegitimate Injection\n\nIllegitimate Injection looks much like normal, correctly\
    \ implemented, dependency injection. There is a constructor that accepts dependencies,\
    \ and these are provided either by Poor Man's DI or an Inversion of Control container.\n\
    \nHowever, the pattern is polluted—indeed, fatally poisoned—by the presence of\
    \ a second, default constructor. As Listing 12-24 shows, this second constructor\
    \ proceeds to construct some implementations for the dependencies directly, circumventing\
    \ DI.\n\nLISTING 12-24 Having a constructor that directly references implementations\
    \ negates some of the benefits of dependency injection.\n\n```\npublic class TaskListController\
    \ : INotifyPropertyChanged\n{\n    public event PropertyChangedEventHandler PropertyChanged\
    \ = delegate {};\n\n    private readonly ITaskService taskService;\n    private\
    \ readonly IObjectMapper mapper;\n    private ObservableCollection<TaskViewModel>\
    \ allTasks;\n\n    public TaskListController(ITaskService taskService, IObjectMapper\
    \ mapper)\n    {\n        this.taskService = taskService;\n        this.mapper\
    \ = mapper;\n    }\n\n    public TaskListController()\n    {\n        this.taskService\
    \ = new TaskServiceAdo(new ApplicationSettings());\n        this.mapper = new\
    \ MapperAutoMapper();\n    }\n```"
  merge: -1
