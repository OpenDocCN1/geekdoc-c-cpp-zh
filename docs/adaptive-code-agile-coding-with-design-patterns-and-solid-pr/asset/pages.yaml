  md: "```\npublic ReadCaching(IRead<TEntity> decorated)\n{\n    this.decorated =\
    \ decorated;\n}\npublic TEntity ReadOne(Guid identity)\n{\n    var foundEntity\
    \ = cachedEntities [identity];\n    if(foundEntity == null)\n    {\n        foundEntity\
    \ = decorated.ReadOne(identity);\n        if(foundEntity != null)\n          \
    \  cachedEntities [identity] = foundEntity;\n    }\n    return foundEntity;\n\
    }\npublic IEnumerable<TEntity> ReadAll()\n{\n    if (allCachedEntities == null)\n\
    \    {\n        allCachedEntities = decorated.ReadAll();\n    }\n    return allCachedEntities;\n\
    }\n}\n```\n\nBefore you implement the final decorator, the remaining interface\
    \ contains only two methods, as Listing 10-9 shows.\n\n# LISTING 10-9 The remaining\
    \ methods can probably be unified.\n\n```\npublic interface ICreateUpdate<TEntity>\n\
    {\n    void Create(TEntity entity);\n    void Update(TEntity entity);\n}\n```\n\
    \nThe Create and Update methods have identical signatures. Not only that, they\
    \ serve very similar purposes: the former saves a new entity, and the latter saves\
    \ an existing entity. You could unify these methods into one Save method, which\
    \ acknowledges that the distinction between creating and updating is an implementation\
    \ detail that clients don’t need to know about. After all, a client is likely\
    \ to want to both save and update an entity, so requiring two interfaces that\
    \ are so similar seems needless when there is a viable alternative. Clients of\
    \ the interface want to save an entity. The refactored interface looks like the\
    \ one in Listing 10-10."
