    \ the whole purpose of the pattern, which is to avoid exposing this logic to its\
    \ various clients. Listing 4-16 is a typical example of this problem.\n\n# LISTING\
    \ 4-16 Logic based on the IsNull property makes this an anti-pattern.\n\n```\n\
    static void Main(string[] args)\n{\n    var user = userRepository.GetByID(Guid.NewGuid());\n\
