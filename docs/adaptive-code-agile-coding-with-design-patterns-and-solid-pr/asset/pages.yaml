- pgno: 405
  md: "> Note The same ViewModel that was used for WPF is used here, too. This is\
    \ okay because the INotifyPropertyChanged interface is not strictly WPF-centric\
    \ (it is located in the System.ComponentModel namespace). However, MVC does not\
    \ care about that interface and will not respond to any events that are fired\
    \ on the ViewModel. Furthermore, MVC allows you to decorate ViewModels with validation\
    \ hints and other such attributes that are part of the MVC assemblies, so it is\
    \ best to create MVC-specific ViewModels.\n\nBy default, MVC controllers are required\
    \ to have public default constructors so that the framework can construct instances\
    \ of them before calling an action method. But when you are using dependency injection,\
    \ you need to have constructors that accept the interfaces of your required services.\
    \ Luckily, MVC uses the Factory pattern for creating the controller and provides\
    \ an extension point for you to provide your own implementation, as Listing 12-27\
    \ shows.\n\n# LISTING 12-27 MVC provides many extension points. Providing a custom\
    \ controller factory facilitates DI.\n\n```\npublic class UnityControllerFactory\
    \ : DefaultControllerFactory\n{\n    private readonly IUnityContainer container;\n\
    \n    public UnityControllerFactory(IUnityContainer container)\n    {\n      \
    \  this.container = container;\n    }\n\n    protected override IController GetControllerInstance(RequestContext\
    \ requestContext, Type controllerType)\n    {\n        if (controllerType != null)\n\
    \        {\n            var controller = container.Resolve(controllerType) as\
    \ IController;\n            if (controller == null)\n            {\n         \
    \       controller = base.GetControllerInstance(requestContext, controllerType);\n\
    \            }\n            if (controller != null)\n            {\n         \
    \       return controller;\n            }\n        }\n        requestContext.HttpContext.Response.StatusCode\
    \ = 404;\n        return null;\n    }\n}\n```\n\nWhen you constructed the UnityControllerFactory\
    \ in the Application_Start method, you passed in the container as a parameter.\
    \ Here, as emphasized in bold, you can tell that the GetControllerInstance override\
    \ uses the container's Resolve method to create an instance of the requested controller\
    \ by type. This is where the controller—the resolution root—is resolved, along\
    \ with the rest of the object graph that might be required."
  merge: -1
  img_proc: true
- pgno: 406
  md: "It is necessary to bear in mind the different lifetimes involved in this example.\
    \ The IoC container is created, and mappings are registered, at application startup.\
    \ The controllers, however, are resolved per request. As the request comes in,\
    \ the controller is resolved, and as the request ends, the controller falls out\
    \ of scope and is no longer used.\n\n# Windows Forms\n\nIn a Windows Forms application,\
    \ bootstrapping dependency injection is more like that of a WPF application than\
    \ an ASP.NET MVC application. The resolution root of both is the view, with the\
    \ presenter or controller being passed in as a constructor parameter and the object\
    \ graph proceeding from there.\n\nListing 12-28 shows the composition root of\
    \ the Windows Forms front end for the Task List application. It is located in\
    \ the Program class—in the Main method—which is the entry point of the application.\
    \ As usual, it is important to try to keep the registration code as close to the\
    \ entry point as possible.\n\nLISTING 12-28 The Program class's Main method is\
    \ the entry point to the application and makes a good composition root.\n\n```\n\
    static class Program\n{\n    public static UnityContainer Container;\n\n    [STAThread]\n\
    \    static void Main()\n    {\n        AutoMapper.Mapper.CreateMap<TaskDto, TaskViewModel>();\n\
    \n        Application.EnableVisualStyles();\n        Application.SetCompatibleTextRenderingDefault(false);\n\
    \n        Container = new UnityContainer();\n        Container.RegisterType<ISettings,\
    \ ApplicationSettings>();\n        Container.RegisterType<IObjectMapper, MapperAutoMapper>();\n\
    \        Container.RegisterType<ITaskService, TaskServiceAdo>();\n        Container.RegisterType<TaskListControllers>();\n\
    \        Container.RegisterType<TaskListView>();\n\n        var mainForm = Container.Resolve<TaskListView>();\n\
    \        Application.Run(mainForm);\n    }\n}\n```\n\nNote that, in this case,\
    \ you are able to reuse not only the service implementations, but also the TaskListViewController\
    \ because it doesn't (yet) depend on anything wholly specific to WPF. Of course,\
    \ in the future, it probably will, so it might be necessary to create a controller\
    \ or presenter specifically to support the Windows Forms application."
