- pgno: 129
  md: "Each package has an XML file that details the metadata that is shown in the\
    \ installation window. Listing 3-22 shows some of the syntax of this file.\n\n\
    ```\n```xml\n<package xmlns=\"http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd\"\
    >\n    <metadata>\n        <id>MyTestPackage</id>\n        <version>1.0.0</version>\n\
    \        <authors>Gary McLean Hall</authors>\n        <requireLicenseAcceptance>false</requireLicenseAcceptance>\n\
    \        <description>My package description.</description>\n        <dependencies>\n\
    \            <dependency id=\"RiaClient\" version=\"1.0.1\" />\n        </dependencies>\n\
    \    </metadata>\n</package>\n```\n```\n\nNuGet is such a productivity and organizational\
    \ bonus that it is painful to return to manually managing third-party dependencies,\
    \ if a package does not exist for a particular library. In fact, NuGet is not\
    \ only for third-party dependencies. When a solution becomes large enough, it\
    \ is advisable to split the solution into multiple parts, sliced by layer. The\
    \ assemblies for each layer can then be packaged by using NuGet and consumed by\
    \ layers above. This keeps solutions small and easy to work with.\n\n# Chocolatey\n\
    \nThe best way to describe Chocolatey is that it is a package management tool,\
    \ just like NuGet, but its packages are applications and tools, not assemblies.\
    \ Developers with some Linux knowledge will find that Chocolatey is like apt-get,\
