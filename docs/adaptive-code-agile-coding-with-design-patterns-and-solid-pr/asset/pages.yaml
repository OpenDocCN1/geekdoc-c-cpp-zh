- pgno: 43
  md: '# The vertical slice


    When I was growing up, every Christmas my father would make trifle. This is a
    traditional English dessert that is made from various layers. At the bottom there
    is sliced fruit; then there are layers of sponge cake, jelly, and custard; and
    on top is whipped cream. My brother used to dig his spoon all the way through
    the layers, whereas I would eat each layer in turn.


    Well-designed software is layered just like a trifle. The bottom layer is dedicated
    to data access, with layers in between for object-relational mappers, domain models,
    services, and controllers—with the user interface on top. Much like eating trifle,
    there are two ways to slice any part of a layered application: vertically and
    horizontally.


    By slicing horizontally, you take each layer and implement what is required of
    those layers as a whole. But with this approach, there is no guarantee that each
    slice will align with the others. The user interface might allow the user to interact
    with certain features that layers below have not yet implemented. The net effect
    is that the client cannot use the application until a significant proportion of
    each layer has been completed. This delays the important feedback loop that Agile
    methods give you and increases the likelihood that you will build more than is
    needed—or simply the wrong thing.


    Slicing vertically is what you should aim for. Each user story should incorporate
    functionality at each layer and should be tethered at the top to the user interface.
    This way, you can demonstrate the functionality to the user and receive feedback
    quickly. This also avoids writing user stories that are developer-centric, such
    as, “I want to be able to query the database for customers who have not paid this
    month.” This sounds too much like a task; the story could be about generating
    a report on the outstanding unpaid accounts.


    **Defect**  A defect card is created whenever acceptance criteria are not met
    on a previously complete user story. This highlights the need for automated acceptance
    testing: each batch of tests written for a story forms a suite of regression tests
    to ensure that no future work is able to introduce a breaking change.


    Defect cards, like technical debt, do not have story points assigned to them,
    thus removing the incentive to create defects and technical debt—something that
    developers want to avoid even if full eradication of defects and technical debt
    is unattainable.


    All software has defects. That is just a fact of software development, and no
    amount of planning or diligence will ever account for the fallibility of humans.
    Defects can be broadly categorized as A, B, or C: apocalyptic defects, behavioral
    errors, and cosmetic issues.


    Apocalyptic defects result in an outright crash of the application or otherwise
    prevent the continuation of the user’s work. An uncaught exception is the classic
    example because the program must terminate and be restarted or—in a web scenario—the
    webpage must be reloaded. These defects should be assigned the highest priority
    and should be fixed before a release of the software.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Card sharp


    A lot of options are available for customizing and personalizing the cards on
    the Scrum board.


    # Color scheme


    Any color scheme will suffice for the cards, but there are a few that, in my experience,
    make the most sense. Index cards are ideal for features and user stories, whereas
    sticky notes make excellent task, defect, and technical debt cards because they
    can be stuck to a relevant story. Here are my recommendations:


    +   - Features: green index cards

    +   - User stories: white index cards

    +   - Tasks: yellow sticky notes

    +   - Defects: red/pink sticky notes

    +   - Technical debt: purple/blue sticky notes


    Note that user stories and tasks, being the most common kinds of cards you will
    create, use the most commonly available index cards and sticky notes. The last
    thing you need is to run out of index cards, so try to use the most commonly available
    colors.


    # Who creates cards?


    The simple answer to the question, “Who can create the cards?” is: anyone. This
    does, of course, come with some conditions. Though anyone can create a card, its
    validity, priority, criticality, and other such states are not something that
    should be decided by one person alone. All feature and story cards should be verified
    by the product owner, but task, defect, and technical debt cards are entirely
    the domain of the development team.


    # Avatars


    Much like the avatars found online in forums, on blogs, and on Twitter, these
    are miniature representations of the various members of the team. Feel free to
    allow your team members to express themselves through their avatars, because it
    certainly adds a sense of fun to the Scrum process. Of course, steer them away
    from anything likely to cause offense, but there should be a sense of distinct
    identity for each person’s avatar.


    Over the course of an iteration, these avatars will be moved around a lot and
    will be handled on a daily basis. Because you have index-card stories and sticky-note
    tasks already on the board, these avatars should be no bigger than 2-inch squares.
    Laminating them will also help to protect them from becoming dog-eared or torn,
    and reusable adhesive or a little piece of tape should hold them in place.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Behavioral errors might not be as serious but can infuriate users. These types
    of errors could be even more damaging than simply crashing the application. Imagine
    erroneous currency conversion logic that rounds pennies wrong. Whether the algorithm
    favors the customer or the business, someone is going to lose money. Of course,
    not all logic errors are quite this serious, but it is easy to understand why
    they should be given a high priority.


    Cosmetic issues are typically problems with the user interface—badly aligned images,
    a window that doesn’t expand to full screen gracefully, or an image on the web
    that never loads. These issues do not affect the use of the software, just its
    appearance. Although these issues are often given a lower priority, it is still
    important to remember that appearances count toward the user’s expectations of
    the software. If the user interface is badly designed with buttons that don’t
    work and images that don’t load, users are less inclined to trust the internal
    workings of that software. Conversely, a shiny user interface with plenty of bells
    and whistles might convince users that your software is just as well designed
    internally. A common trick for projects that have developed a poor reputation
    is to redesign the user interface—perhaps even rebranding the entire product—to
    improve perceptions and reset expectations.


    # Swimlanes


    Scrum boards have vertical lines drawn on them to demarcate the swimlanes. Each
    swimlane can contain multiple user story cards to denote the progress of that
    story throughout its development life cycle. From left to right, the basic swimlanes
    are Backlog, In Progress, QA, and Done.


    A story in the backlog has been “committed to” for the sprint and should—unless
    canceled—be taken from the board and work on it should begin. This column can
    be ordered by priority so that the top item is always the next one that should
    be implemented.


    After the story is taken from the backlog and a conversation has taken place with
    the product owner about the scope and requirements, the card is returned—with
    newly derived tasks—to the In Progress swimlane. At this point, the avatars of
    all team members involved in the story should also be attached. The story now
    counts toward any swimlane limits that might be associated with the in-progress
    phase. For example, you might require that only three user stories be in progress
    at a time, thus coercing the team to complete already-started stories in preference
    to those that have not yet been started. Remember: there is no incentive for partially
    completed work.


    After analysis, design, and implementation have been carried out for a story,
    it is considered “developer complete” and can be moved to the Quality Assurance
    (QA) swimlane. Ideally, the QA environment should mirror the production environment
    as closely as possible, to avoid any environmental errors that can occur from
    even minor differences in deployment. The test analysts will assess this story
    in conjunction with the acceptance criteria. In essence, they try to break the
    story and prove that the code does not behave in the manner in which it ought.
    Typically, they attempt to provide unusual and erroneous input to certain operations,
    ensuring that validation works correctly. They might even look for security loopholes
    to ensure that malicious end users cannot gain access above their specified privilege
    level. When the QA is fully complete, the user story is moved across to the Done
    swimlane. Any story points associated with the story are then claimed, and the
    sprint burndown chart (which shows the progress of the sprint) can be amended.
    These artifacts are covered in more detail later.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'The Scrum board can be further split by using horizontal swimlanes. These swimlanes
    can be used to group the stories by feature, so that everyone can see at a glance
    where effort is being concentrated, and thus where bottlenecks need to be alleviated.


    One special swimlane at the top of the board is the Fast-Track lane, into which
    any very high–priority tasks can be placed. Team members can be instructed to
    "swarm" on a fast-track item so that it is completed as quickly as possible, often
    to the detriment of any other outstanding work. Swarming ensures that the team
    stops what they are doing to collaborate on a problem or task that has overriding
    priority. It is a useful tool and should be used sparingly, when such a priority
    occurs. Apocalyptic defects found in production are the most common fast-track
    items.


    # Technical debt


    The term technical debt deserves further explanation. Throughout the course of
    implementing a user story, it is likely that certain compromises will need to
    be made between the "ideal code" and code that is good enough to meet the deadline.
    This is not to say that poor design should be tolerated or encouraged in order
    to hit a deadline, but that there is value in doing something simpler now, with
    a view to improving it later.


    # Good and bad technical debt


    Debt is likely to accrue gradually over the lifetime of a project. It is termed
    debt because that is a great metaphor for how it should be viewed. There is nothing
    wrong with certain types of financial debt. If, for example, you have the option
    of spreading the payments for a car over 12 months with low-interest repayments,
    you are in debt. But this could be a good decision if you need the car for commuting
    and cannot afford the payment in full. The car will allow you to generate the
    revenue necessary to pay the repayments, because you can now get to work on time.


    Of course, some debt is bad. If you take out a credit card and pay for something
    extravagant without first calculating how you will repay the debt, you can end
    up in a cycle of balance transfers, trying to keep interest payments at a minimum.
    This will, in hindsight, look like a bad financial decision based around bad debt.
    The key is to look carefully at the options and decide whether the debt is worth
    taking on or whether you should just pay up front.


    The tradeoff is the same in software. You could implement a suboptimal solution
    now and meet a deadline or spend the extra time now to improve the design, perhaps
    missing the deadline. There is no right answer that fits all situations, just
    guidelines for detecting good and bad technical debt.


    # The technical debt quadrant


    Martin Fowler, a prominent Agile evangelist, defined a technical debt quadrant
    for categorizing the concessions and compromises that might be needed to mark
    a story as done. The two axes that divide a plane into quadrants, x and y, correspond
    to the questions, "Are we accruing this technical debt for the correct reasons?"
    and "Are we aware of alternatives to avoid this technical debt?", respectively.


    If you answer "Yes" to the former question, you are adding prudent technical debt:
    you can point to valid reasons for adding it, and your conscience is clear. If
    you answer "No," this debt is reckless and you would be better advised to deal
    with this debt now, rather than allow it to accumulate.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'For the latter question, an affirmative answer means that you have considered
    the alternatives and decided to take on the debt. A negative answer indicates
    that you cannot think of other alternatives.


    The results of these questions generate four possible scenarios, as shown in Figure
    1-6:


    +   - **Reckless, deliberate**  This type of debt is the most poisonous. It is
    equivalent to saying something like, “We don’t have time for design,” which indicates
    a very unhealthy working environment. A decision such as this should alert everyone
    that the team is not adaptive and is marching steadily toward inevitable failure.


    +   - **Reckless, inadvertent**  This type of debt is most likely created by a
    lack of experience. It is the result of not knowing best practices in modern software
    engineering. It is likely that the code is a mess, much like in the previous case,
    but the developer did not know any better and therefore could not find any other
    options. Education is the answer here: as long as developers are willing to learn,
    they can stop introducing this kind of technical debt.


    +   - **Prudent, inadvertent**  This occurs when you follow best practices but
    it turns out that there was a better way of doing something, and “now you know
    how you should have done it.” This is similar to the previous case, but all of
    the developers were in agreement at the time that there was no better way of solving
    the problem.


    +   - **Prudent, deliberate**  This is the most acceptable type of debt. All of
    the choices have been considered, and you know exactly what you are doing—and
    why—by allowing this debt to remain. It is most commonly associated with a late
    decision to “ship now and deal with the consequences.”


    ![](img/f852e0a12c174e64d91a8e1a05146eab_47_0.png)


    **FIGURE 1-6**  The technical debt quadrant, as explained by Martin Fowler, helps
    developers visualize the four different categories of debt.


    **Repaying debt**  Technical debt is not directly associated with any story points,
    yet the debt must be repaid despite the lack of direct incentive. It is best to
    try to attach a technical debt card to a story and refactor the code so that the
    new design is implemented along with associated new behavior. The next time that
    a story is taken from the board, check whether any of the code that will be edited
    has a technical debt attached, and try to tackle the two together.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Digital Scrum boards


    A digital Scrum board, unless constantly projected on a wall, hides some of the
    most important information about a project. By being open with this information
    and displaying it for the whole company to see, you invite questions about process
    that otherwise would not be asked. Being transparent with process is a huge benefit,
    especially when you are implementing Scrum for the first time in a company. It
    encourages buy-in from important stakeholders that you would do well to involve
    in the process.


    It is a cliché, but people really do fear change. Fear is just a natural reaction
    to the unknown. By educating people on what you are doing and what certain charts
    mean (and why their wall is now covered in dozens of index cards), you foster
    a spirit of collaboration and communication that really is priceless. Being required
    to explain these things to non-technical people can also be helpful to you, because
    in doing so you might come to understand the process better yourself.


    As with all tools, the best ones are high-touch and low-resistance. They will
    be used very often, and there will be no barriers to their use. When a tool becomes
    even mildly inconvenient to use, it will gradually be more and more neglected.
    What was initially used often and diligently kept up to date will no longer be
    tended, and it will rapidly fall behind reality.


    # The definition of done


    Every project needs a definition of done (DoD). This is the standard that every
    user story must adhere to in order to be considered done. How many times have
    you heard these lines from a developer?


    > "It''s done, I just have to test it...."


    > "It''s done, but I found a defect that I need to fix...."


    > "It''s done, but I''m not 100-percent happy with the design, so I''m going to
    change the interface...."


    I have used these myself in the past. If the story truly was done, there would
    be no caveats, conditions, or clauses required. These examples are what developers
    say when they need to buy themselves a little more time due to a bad estimate
    or an unforeseen problem. Everyone must agree on a definition of "done" and stick
    to it. If a user story doesn''t meet the criteria, it can''t possibly be done.
    Story points are never claimed until the story meets the definition of done.


    What goes into a definition of done? That is entirely up to you, your team, and
    how stringent you want your quality assurance process to be. However, the following
    demonstrates a standard DoD as a starting point.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'In order to claim that a user story is done, you must:


    +   - Unit-test all code to cover its success and failure paths, with all tests
    passing.

    +   - Ensure that all code is submitted to the Continuous Integration builds and
    compiles—without errors—with all tests passing.

    +   - Verify behavior against the acceptance criteria with the product owner.

    +   - Have a developer who did not work on the story peer-review code.

    +   - Document just enough to communicate intent.

    +   - Reject reckless technical debt.


    Feel free to remove, amend, or append any rules, but be strict with this definition.
    If a story does not meet all criteria, it either needs more work—it is not done—or
    the prohibitive criteria from the definition of done should be dropped. For example,
    if you feel that code reviews are arcane or pedantic, feel free to omit that rule
    from your DoD.


    # Charts and metrics


    There are several charts that can be used to monitor the progress of a Scrum project.
    Scrum charts can indicate the health and historical progress of a Scrum project,
    in addition to predicting probable future achievement. All of these charts should
    be displayed prominently by the Scrum board in a size sufficient to be read from
    a few feet away. This shows the team that these metrics are not being used behind
    their back, that they are not a way of measuring their progress for the consumption
    of management. Instead, be very up front about how progress is measured, and make
    it clear that these charts are not being made for performance reasons, but to
    diagnose problems with the project as a whole.


    On a related note, try to avoid measuring anything on a personal level—such as
    story points achieved per developer. This conveys a poor message to the team:
    that they can sacrifice team progress for personal progress. Developers will readily
    attach themselves to such measurements and try to save face by monopolizing larger
    stories, trying to achieve points all by themselves. Be careful what you incentivize.


    > **Caution** Be wary of what you measure—there is an “observer effect.” For instance,
    for some metrics, the act of measuring is not possible without first altering
    that which is measured. Take, for example, measuring tire pressure on a car. It
    is very difficult to measure the pressure without first letting a little air out
    of the tire, thus altering the pressure. This same principle applies to human
    nature, too. When the team knows that they are going to be measured by some criteria,
    they will do whatever they can to improve their statistics to look good. This
    is not to say that you are managing a group of Machiavellian troublemakers, but
    when the team realizes that story points will be used to measure their progress,
    they might be inclined to assign higher points for the same effort. Use triangulation
    (which is covered in the “Sprint retrospective” section later in this chapter)
    to reconcile estimated effort with actual effort.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Story points


    Story points are intended to incentivize the team to add business value with every
    sprint. Story points are assigned to user stories by the whole development team
    during the sprint planning meeting (see the “Sprint planning” section later in
    this chapter). A story point is a measure of relative effort required to implement
    the behavior that the user story represents. This is the inclusive effort required
    to fulfill the entire software lifecycle—requirements analysis, technical design,
    and code implementation with unit testing, plus quality assurance against acceptance
    criteria and deployment to a staging environment. Although every story should
    already be small enough to fit comfortably inside a sprint, stories might still
    vary significantly in size.


    At one end of the scale is a “one-point story,” which requires minimal effort
    to implement. An interesting and important fact about story points is that they
    are meaningless outside of the team that assigned them. A one-point story for
    one team might be a three-point story for another team. What occurs over multiple
    sprints is a consensus on the approximate effort required for a story.


    One thing that a story point definitely does not represent is effort measured
    in absolute terms—days, hours, or any other temporal measurement. Story points
    do, very roughly, correspond to a historical range of times, as shown in Figure
    1-7. In this chart, the vertical bars represent the minimum, maximum, and average
    actual time taken for stories of a corresponding size.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_50_0.png)


    FIGURE 1-7 Min/max/average chart showing correlation between estimated effort
    and actual effort.


    The main takeaway from this chart is that larger stories have correspondingly
    larger ranges—the larger a story is assumed to be, the harder it is to accurately
    predict how long it will take to complete.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Velocity


    Over multiple sprints, it is possible to calculate a running average of the achieved
    story points. Let’s say that a team has completed three sprints, meeting the definition
    of done on stories totaling 8, 12, and 11 story points. This is a running total
    of 31 and a running average of 10 points. This is the team’s velocity, and it
    can be used in two ways.


    First, a team’s velocity can form a ceiling for how many points a team should
    commit to for the next sprint. If the team is averaging 10 points per sprint,
    committing to more than that amount for a single iteration would be more than
    just optimistic—it would be setting them up for a morale-sapping failure. It is
    better to set an achievable goal and meet or exceed it than to set an unrealistic
    goal and fall short. If the team took these 10 points and actually implemented
    11, it would feed into a new velocity of 11: (12 + 11 + 11) / 3. This is the Scrum
    feedback loop in action.


    A second use for the velocity is to analyze problems with delivery. If the velocity
    of a team drops by a significant percentage for one sprint, this probably indicates
    that something bad happened during that sprint that needs to be rectified. Perhaps
    the stories were too large and their true scale was underestimated, thus keeping
    them in progress for a long time and requiring them to survive for more than one
    sprint. Alternatively, a simpler explanation could be possible—that too many key
    staff members were on vacation (or ill) all at the same time and progress naturally
    slowed. On the other hand, perhaps too much time was spent refactoring existing,
    working code, with not enough emphasis on introducing new features to the system.
    Whatever the reason, a 25-percent drop in velocity is not always disastrous, but
    it could be indicative of further problems to come that you should address as
    soon as possible. Week-after-week reductions in velocity—protracted deceleration—is
    a definite problem and probably points to code that is not adaptive to change;
    something that this book will help you address.


    # Sprint burndown chart


    At the start of each sprint, a two-dimensional Cartesian graph is created and
    placed by the Scrum board. The total number of story points is charted along the
    y-axis, and the number of working days is plotted along the x-axis. A straight
    diagonal line (also known as the line of best fit) is then drawn to show the ideal
    progression of the sprint, as shown in Figure 1-8.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_51_0.png)


    FIGURE 1-8 A sprint burndown chart at the beginning of a sprint. The straight
    line shows the "line of best fit" to the sprint goal (23 story points, in this
    example).'
  merge: -1
  img_proc: true
