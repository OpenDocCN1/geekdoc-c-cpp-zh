- pgno: 205
  md: 'This is how the test setup should read. There is far more clarity in what you
    can expect from the system under test. Look back again at the original Arrange
    section of this test and see how it compares. The details of mock setup—implementation
    details—cloud the intent of the code. Look at the placement of the parameterized
    values: 200m and "Trading Account". They are lost within the noise of mock initialization.
    With the use of the Builder pattern, the tests now have far more clarity of intent.


    Tip Another advantage of the Builder pattern is that it leads to more declarative
    tests. No test should ever have a cyclomatic complexity greater than 1, meaning
    that tests should be completely linear with no branching. An if statement or a
    for, foreach, or while loop will cause the cyclomatic complexity of a test to
    exceed 1. The Builder pattern helps with this by converting imperative construction
    and initialization to declarative.


    # Writing tests first


    What has been presented so far in this chapter are the merits of unit testing
    with a test-driven development (TDD) approach. But is this, strictly speaking,
    test-driven development? Software development is fraught with overloaded terms
    whose meaning is subjective or shifts over time. Consider the word "service,"
    for example. That means a multitude of different things in different situations.
    This book alone uses the term in a number of different contexts. And context is
    the key. Without context, there is no basis for discussion, no environment in
    which debate can exist.


    TDD might not necessarily be a subjective term, but its meaning has shifted. The
    modern standards and practices that are upheld as "software engineering" have
    trickled through the industry, and their meaning has been distorted or mistaken.


    # What is TDD?


    Test-driven development has a purist and a pragmatist interpretation. Even those
    terms are loaded: a purist never yields from his or her myopic, idealistic vision
    of how things ought to be; the pragmatist is a maverick who cuts corners and dilutes
    the code in the name of delivery. Of course, both of these descriptions are hyperbolic
    caricatures.


    The "purist" idea of TDD is that it is a design tool—that developers should approach
    the keyboard without forethought of the production code they might implement.
    Instead, they are the proverbial blank slates, prepared to discover their design
    as they progress. This progress is guided by writing failing unit tests.


    The "pragmatic" idea of TDD is that developers write the unit tests first. The
    distinction is subtle. With purist TDD, there are more constraints to the process.
    The goal of both TDD styles is the same: generate production code that has been
    verified as meeting requirements with unit tests. However, pragmatic TDD has fewer
    rules governing how to achieve this goal. With pragmatic TDD, the only rule is
    this: write tests first.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Therefore, pragmatic TDD should be renamed test-first development. I will use
    the TFD acronym only for the purposes of brevity. Ideally, purist TDD should be
    renamed test-driven design. By correcting the nomenclature, we can have a more
    meaningful discussion about the relative pros and cons. Behaviors might also change:
    if your hiring manager is testing for test-driven design but the real work to
    be done suits test-first development, a realignment of terminology could help
    you find candidates better suited to the work.


    # Test-driven design


    TDD is a design exercise. It is most applicable when the design of production
    code is unknown and can emerge organically through the red, green, refactor process
    of writing unit tests.


    Keith Braithwaite of Zuhlke, an engineering services company, terms this sort
    of testing “TDD as if you meant it.” Using the following rules can help to teach
    test-driven design to developers who have only done test-first development.


    +   1. Write exactly one new test. It should be the smallest test which seems
    to point in the direction of a solution.

    +   2. Run the test to make sure it fails.

    +   3. Make the test from (1) pass by writing the least amount of implementation
    code you can IN THE TEST METHOD.

    +   4. Refactor to remove duplication or otherwise as required to improve the
    design. Be strict about the refactorings. Only introduce new abstractions (methods,
    classes, etc) when they will help to improve the design of the code. Specifically:

    +      a. ONLY Extract a new method if there is sufficient code duplication in
    the test methods. When extracting a method, initially extract it to the test class
    (don’t create a new class yet).

    +      b. ONLY create a new class when a clear grouping of methods emerges and
    when the test class starts to feel crowded or too large.

    +   3. Repeat the process by writing another test (go back to step 1).


    This is quite a restrictive set of rules, but they are not arbitrary. These rules
    of test-driven design are intended to generate just enough design to pass the
    unit tests, and no more. This naturally prevents over-engineering. Over-engineering
    occurs when code is made pointlessly adaptive—that is, it can be extended in ways
    that it will never need. This is speculative generality, which is discussed in
    further detail in Chapter 8, “The open/closed principle.”


    TDD necessarily requires a greenfield approach to the solution. This is why it
    is so applicable to code katas and domain-driven development (DDD). In both scenarios,
    there is no code already available for you to hang your new functionality from.
    There is a problem space that is ill-defined and'
