- pgno: 294
  md: "The temptation is to strengthen the preconditions so that you can guarantee\
    \ that the destination parameter is provided. This creates a conflict that calling\
    \ code is unable to solve. If a class calls the `CalculateShippingCost` method\
    \ of the `ShippingStrategy` base class, it is free to pass in `null` for the destination\
    \ parameter without experiencing a side effect. But if it is calling the `CalculateShippingCost`\
    \ method of the `WorldWideShippingStrategy` class, it must not pass in `null`\
    \ for the destination parameter. Doing so would violate a precondition and cause\
    \ an exception to be thrown. As demonstrated in earlier chapters, client code\
    \ should not make assumptions about what type it is acting on. Doing so leads\
    \ to strong coupling between classes and an inability to adapt to changing requirements.\n\
    \nTo demonstrate the problem, examine the unit test shown in Listing 9-8.\n\n\
    **LISTING 9-8** When the precondition is strengthened, clients cannot reliably\
    \ use a `WorldWideShippingStrategy` where a `ShippingStrategy` is required.\n\n\
    ```\n```csharp\n[Test]\npublic void ShippingRegionMustBeProvided()\n{\n    strategy.Invoking(s\
    \ => s.CalculateShippingCost(1f, ValidDimensions, null))\n        .ShouldThrow<ArgumentNullException>(\"\
    Destination must be provided\")\n        .And.ParamName.Should().Be(\"destination\"\
    );\n}\n```\n```\n\nIf the strategy used by this test is of type `WorldWideShippingStrategy`,\
    \ the test will pass: no destination is provided but one is required, thus an\
    \ exception meeting the specification is thrown. If a `ShippingStrategy` is used\
    \ instead, this test will fail because no precondition exists to prevent the null\
    \ value for the destination and no exception will be thrown.\n\nListing 9-9 shows\
    \ a refactored set of unit tests that do not attempt to test the same preconditions\
    \ on both strategy types. A test asserting that the shipping region must be provided\
    \ is only valid for the `WorldWideShippingStrategy`. However, regardless of shipping\
    \ strategy implementation, the precondition that the shipping weight must be positive\
    \ is always valid, so this is included in a base class of tests that will be run\
    \ for each shipping strategy class.\n\n**LISTING 9-9** The refactored unit tests\
    \ separately target the two shipping strategy classes.\n\n```\n```csharp\n[TestFixture]\n\
    public class WorldwideShippingStrategyTests : ShippingStrategyTestsBase\n{\n \
    \   [Test]\n    public void ShippingRegionMustBeProvided()\n    {\n        strategy.Invoking(s\
    \ => s.CalculateShippingCost(1f, ValidSize, null))\n            .ShouldThrow<ArgumentNullException>(\"\
    Destination must be provided\")\n            .And.ParamName.Should().Be(\"destination\"\
    );\n    }\n}\n```\n```"
