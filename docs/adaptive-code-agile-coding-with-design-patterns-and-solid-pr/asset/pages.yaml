- pgno: 148
  md: "Whenever a client calls the interface methods on this class, the same methods\
    \ that are already in place will be used. An example of where this can be useful\
    \ is when you are implementing the Model-View-Presenter (MVP) pattern in Windows\
    \ Forms and adding an IView interface that requires a Close method to be implemented\
    \ on a Form. Listing 4-8 shows this in practice.\n\n# LISTING 4-8 Sometimes the\
    \ presence of a clashing method can be neatly capitalized on.\n\n```\npublic interface\
    \ IView\n{\n    void Close();\n}\n// ...\npublic partial class Form1 : Form, IView\n\
    {\n    public Form1()\n    {\n        InitializeComponent();\n    }\n}\n```\n\n\
    However, if the class needs to provide different method bodies for the interface\
    \ implementation, the class should implement the interface explicitly, avoiding\
    \ the method signature clash. Listing 4-9 shows a class with clashing methods\
    \ that provides different implementations of those methods.\n\n# LISTING 4-9 Explicitly\
    \ implementing an interface to avoid clashing method signatures.\n\n```\npublic\
    \ class ClassAvoidingMethodSignatureClash : IInterfaceOne\n{\n    public void\
    \ MethodOne()\n    {\n        // original implementation\n    }\n\n    void IInterfaceOne.MethodOne()\n\
    \    {\n        // new implementation\n    }\n}\n```\n\nIn a similar situation,\
    \ if a class needs to implement two different interfaces that are unrelated but\
    \ that both contain a method with the same signature, you can implement them both\
    \ implicitly and share the same method implementation. Or, as shown in Listing\
    \ 4-10, you can implement them both explicitly—for clarity—to demarcate which\
    \ implementation belongs to which interface."
