- pgno: 292
  md: "```\n```csharp\n{\n    if (value <= decimal.Zero)\n        throw new ArgumentOutOfRangeException(\"\
    value\",\n            \"Flat rate must be positive and nonzero\");\n\n    flatRate\
    \ = value;\n}\n}\n```\n```\n\nNow clients might be able to change the value of\
    \ the FlatRate property but, because of the if statement and exception, the invariant\
    \ cannot be broken. Furthermore, not even private methods in the ShippingStrategy\
    \ class will be able to set an invalid value—something that is possible when you\
    \ are using a private field, because there is no way to enforce a valid value\
    \ at runtime.\n\n> **Encapsulation vs. contracts**\n> \n> The contracts implemented\
    \ in this example make sense, but they are necessitated by a poor choice of types\
    \ for each value. The precondition contract for ensuring that the package weight\
    \ argument is nonzero and positive is intrinsically linked with the type of the\
    \ variable: weight should never be zero or negative. This makes weight a candidate\
    \ for encapsulation into its own type. If, as likely, another class or method\
    \ requires a weight, you would need to carry this precondition across to the new\
    \ code. This is inefficient, hard to maintain, and error-prone. It makes more\
    \ sense to create a new type and define the precondition with it so that all uses\
    \ of the Weight type must have a nonzero and positive value. It is, in fact, an\
    \ invariant of the type rather than a precondition of the CalculateShippingCost\
    \ method.\n> \n> Similarly, the flat rate is modeled poorly by the decimal type.\
    \ Instead, this should be promoted to its own value type, and the invariant requiring\
    \ it to also be nonzero and positive should be applied to this type.\n\n# Liskov\
    \ contract rules\n\nAll this method contract coverage is merely preamble to a\
    \ discussion of some of the tenets of the Liskov substitution principle. The LSP\
    \ sets rules by which types must inherit contracts. A reminder of the definition\
    \ of the LSP is shown here:\n\n> *If S is a subtype of T, then objects of type\
    \ T may be replaced with objects of type S, without breaking the program.*\n\n\
    Where contracts are concerned, this leads to the guidelines that were stated earlier:\n\
    \n+   - Preconditions cannot be strengthened in a subtype.\n+   - Postconditions\
    \ cannot be weakened in a subtype.\n+   - Invariants of the supertype must be\
    \ preserved in a subtype."
  merge: -1
  img_proc: true
- pgno: 293
  md: "If you follow all these rules when creating subclasses of existing classes,\
    \ substitutability will be retained when you are dealing with contracts.\n\nWhenever\
    \ a subclass is created, it brings with it all the methods, properties, and fields\
    \ that make up the parent class. This also includes the contracts inside the methods\
    \ and property setters. Preconditions, postconditions, and data invariants are\
    \ all expected to be maintained in the same way that they were in the parent class.\
    \ Subclasses are, where applicable, allowed to override method implementations,\
    \ which includes the possibility for changing the contracts. Liskov substitution\
    \ stipulates that some changes are not allowed, because they could break existing\
    \ clients that must be able to use the new subclass as if it were an instance\
    \ of the superclass.\n\n# Preconditions cannot be strengthened\n\nWhenever a subclass\
    \ overrides an existing method that contains preconditions, it must never strengthen\
    \ the existing preconditions. Doing so would potentially break any client code\
    \ that already assumes that the subclass defines the strongest possible precondition\
    \ contracts for any method.\n\nListing 9-7 shows the addition of a new WorldWideShippingStrategy.\
    \ Due to the large number of similarities in how the classes behave, this new\
    \ class is implemented as a subclass of the ShippingStrategy class. The CalculateShippingCost\
    \ method is overridden to provide a new value that represents the destination\
    \ of the package being sent via the RegionInfo parameter. Although the ShippingStrategy\
    \ class did not make any guarantees that the destination of the package would\
    \ be provided, WorldWideShippingStrategy now requires this parameter to be provided,\
    \ otherwise it cannot correctly calculate how much it would cost to send the package\
    \ to that location.\n\nLISTING 9-7 This subclass adds a new guard clause, thus\
    \ strengthening the preconditions.\n\n```\npublic class WorldWideShippingStrategy\
    \ : ShippingStrategy\n{\n    public override decimal CalculateShippingCost(\n\
    \        float packageWeightInKilograms,\n        SizeFloat> packageDimensionsInInches,\n\
    \        RegionInfo destination)\n    {\n        if (packageWeightInKilograms\
    \ <= 0f)\n            throw new ArgumentOutOfRangeException(\"packageWeightInKilograms\"\
    , \"Package weight must be positive and non-zero\");\n\n        if (packageDimensionsInInches.X\
    \ <= 0f || packageDimensionsInInches.Y <= 0f)\n            throw new ArgumentOutOfRangeException(\"\
    packageDimensionsInInches\", \"Package dimensions must be positive and non-zero\"\
    );\n\n        if (destination == null)\n            throw new ArgumentNullException(\"\
    destination\", \"Destination must be provided\");\n\n        return decimal.One;\n\
    \    }\n}\n```"
