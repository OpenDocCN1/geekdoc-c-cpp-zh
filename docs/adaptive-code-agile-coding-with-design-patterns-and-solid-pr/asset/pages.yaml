- pgno: 290
  md: "# Postconditions\n\n*Postconditions* check whether an object is being left\
    \ in a valid state as a method is exited. Whenever state is mutated in a method,\
    \ it is possible for the state to be invalid due to logic errors.\n\nPostconditions\
    \ can be implemented in the same manner as preconditions, through guard clauses.\
    \ However, rather than placing the clauses at the start of the method, postcondition\
    \ guard clauses should be placed at the end of the method after all edits to state\
    \ have been made, as Listing 9-4 shows.\n\nLISTING 9-4 The guard clause at the\
    \ end of the method is a postcondition that ensures that the return value is in\
    \ range.\n\n```\npublic virtual decimal CalculateShippingCost(float packageWeightInKilograms,\
    \ Size<float> packageDimensionsInInches, RegionInfo destination)\n{\n    if (packageWeightInKilograms\
    \ <= 0f)\n        throw new ArgumentOutOfRangeException(\"packageWeightInKilograms\"\
    , \"Package weight must be positive and non-zero\");\n\n    if (packageDimensionsInInches.X\
    \ <= 0f || packageDimensionsInInches.Y <= 0f)\n        throw new ArgumentOutOfRangeException(\"\
    packageDimensionsInInches\", \"Package dimensions must be positive and nonzero\"\
    );\n\n    var shippingCost = decimal.One;\n\n    // shipping cost calculation\n\
    \n    if(shippingCost <= decimal.Zero)\n        throw new ArgumentOutOfRangeException(\"\
    return\", \"The return value is out of range\");\n\n    return shippingCost;\n\
    }\n```\n\nBy testing state against a predetermined valid range—and throwing an\
    \ exception if the value falls outside of that range—you can enforce a postcondition\
    \ on the method. The postcondition here relates not to the state of the object\
    \ but to the return value. Much like method argument values are tested against\
    \ preconditions for validity, so are method return values tested against postconditions\
    \ for validity. If, at the end of the method, the return value is zero or a negative\
    \ value, the postcondition will detect this and halt execution at the end of the\
    \ method. This way, clients of this method will never inadvertently receive an\
    \ invalid value, and they can continue to assume that it will always be valid.\
    \ Note that the interface of the method does not communicate that the return value\
    \ will always be nonzero and positive—that is a feature of the interface's contract\
    \ with clients."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Data invariants\n\nA third type of contract is the data invariant. A data\
    \ invariant is a predicate that remains true for the lifetime of an object; it\
    \ is true after construction and must remain true until the object is out of scope.\
    \ Data invariants relate to the expected internal state of the object. An example\
    \ of a data invariant for the ShippingStrategy call is that the flat rate provided\
    \ is positive and nonzero. If, as shown in Listing 9-5, the flat rate is set on\
    \ construction, a simple guard clause in the constructor will prevent an invalid\
    \ value from being set.\n\nLISTING 9-5 Adding a precondition to a constructor\
    \ can help protect a data invariant.\n\n```\npublic class ShippingStrategy\n{\n\
    \    public ShippingStrategy(decimal flatRate)\n    {\n        if (flatRate <=\
    \ decimal.Zero)\n            throw new ArgumentOutOfRangeException(\"flatRate\"\
    , \"Flat rate must be positive and non-zero\");\n\n        this.flatRate = flatRate;\n\
    \    }\n\n    protected decimal flatRate;\n}\n```\n\nBecause the flatRate value\
    \ is a protected field, the only opportunity that clients have for setting the\
    \ value is through the constructor. If flatRate is set to a valid value at this\
    \ point, it should be valid for the rest of the lifetime of the object because\
    \ clients have no way of changing this value.\n\nHowever, if the flatRate variable\
    \ is instead a publicly settable property, the guard clause would have to be moved\
    \ to the setter block to protect the data invariant. Listing 9-6 shows the flat\
    \ rate refactored as a public property, with an accompanying guard clause.\n\n\
    LISTING 9-6 When a data invariant is a public property, the guard clause moves\
    \ to the setter.\n\n```\npublic class ShippingStrategy\n{\n    public ShippingStrategy(decimal\
    \ flatRate)\n    {\n        FlatRate = flatRate;\n    }\n\n    private decimal\
    \ flatRate;\n    public decimal FlatRate\n    {\n        get\n        {\n    \
    \        return flatRate;\n        }\n        set\n```"
