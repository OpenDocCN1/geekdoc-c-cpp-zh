- pgno: 393
  md: "```\ncommand.CommandText = \"[dbo].[get_all_tasks]\";\n\nusing (var reader\
    \ =\ncommand.ExecuteReader(CommandBehavior.CloseConnection))\n{\n    while (reader.Read())\n\
    \    {\n        allTasks.Add(\n            new TaskDto\n            {\n      \
    \          ID = reader.GetInt32(IDIndex),\n                Description = reader.GetString(DescriptionIndex),\n\
    \                Priority = reader.GetString(PriorityIndex),\n               \
    \ DueDate = reader.GetDateTime(DueDateIndex),\n                Completed = reader.GetBoolean(CompletedIndex)\n\
    \            });\n    }\n}\n\nreturn allTasks;\n}\n```\n\nNote that the return\
    \ value from the CreateConnection method is being disposed of by the using block.\
    \ This is viable in this instance, because the product from the factory implements\
    \ IDisposable. Through interface inheritance, it is possible to enforce multiple\
    \ interfaces on implementers.\n\nHowever, the question must be asked whether every\
    \ implementation will need every interface. Sometimes they do, but given the wide\
    \ variety of implementations that an interface can have—long after it was originally\
    \ written—it is a big assumption to make. When it comes to IDisposable, I’m not\
    \ sure it always applies.\n\n# The Responsible Owner pattern\n\nInstead of artificially\
    \ forcing the IDisposable interface onto every implementation, you can use it\
    \ only on those that truly need it. This does cause a problem, though. If the\
    \ product of the factory—your interface—does not implement IDisposable, you can\
    \ no longer use a using block to neatly dispose of the product after it falls\
    \ out of scope. In this case, you must use the Responsible Owner pattern.\n\n\
    Listing 12-17 shows that the using block can be replaced with a try/finally block,\
    \ and that you can check at run time to find out whether the product implements\
    \ the IDisposable interface.\n\nLISTING 12-17 The Responsible Owner pattern ensures\
    \ that resources are disposed of appropriately.\n\n```\npublic IEnumerable<TaskDto>\
    \ GetAllTasks()\n{\n    var allTasks = new List<TaskDto>();\n```"
