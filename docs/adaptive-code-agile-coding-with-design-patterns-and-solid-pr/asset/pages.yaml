- pgno: 156
  md: "```\n// ...\nstatic void Main(string[] args)\n{\n    var user = userRepository.GetByID(Guid.NewGuid());\n\
    \    // Without the Null Object pattern, this line would throw an exception\n\
    \    user.IncrementSessionTicket();\n\n    Console.WriteLine(\"The user's name\
    \ is {0}\", user.Name);\n\n    Console.ReadKey();\n}\n```\n\n# The Adapter pattern\n\
    \nThe Adapter pattern allows you to provide an object instance to a client that\
    \ has a dependency on an interface that your instance does not implement. An Adapter\
    \ class is created that fulfills the expected interface of the client but that\
    \ implements the methods of the interface by delegating to different methods of\
    \ another object. It is typically used when the target class cannot be altered\
    \ to fit the desired interface. This could be because it is sealed or because\
    \ it belongs to an assembly for which you do not have the source. You can implement\
    \ the Adapter pattern in two ways: by using the Class Adapter pattern or by using\
    \ the Object Adapter pattern.\n\n# The Class Adapter pattern\n\nFigure 4-5 shows\
    \ the collaborating classes and interfaces used in the Class Adapter pattern.\n\
    \n![](img/f852e0a12c174e64d91a8e1a05146eab_156_0.png)\n\nFIGURE 4-5 The UML class\
    \ diagram for the Class Adapter pattern."
  merge: -1
  img_proc: true
- pgno: 157
  md: "The Class Adapter pattern makes use of inheritance for the adapter—a subclass\
    \ of the target class needs to be adapted to fit the expected interface of clients.\
    \ Listing 4-18 shows how this works in practice.\n\n# LISTING 4-18 The Class Adapter\
    \ pattern uses implementation inheritance.\n\n```\npublic class Adaptee\n{\n \
    \   public void MethodB()\n    {\n    }\n}\n// . . .\npublic class Adapter : Adaptee\n\
    {\n    public void MethodA()\n    {\n        MethodB();\n    }\n}\n// . . .\n\
    class Program\n{\n    static Adapter dependency = new Adapter();\n    static void\
    \ Main(string[] args)\n    {\n        dependency.MethodA();\n    }\n}\n```\n\n\
    This is the less common of the two types of Adapter pattern, mostly because developers\
    \ are told to favor composition over inheritance. This is because inheritance,\
    \ which is whitebox reuse, makes the subclass dependent on the implementation\
    \ of a class, rather than merely on its interface. Composition, which is blackbox\
    \ reuse, limits the dependency to the interface, so that the implementation can\
    \ vary without adversely affecting clients.\n\n> Tip The terms whitebox reuse\
    \ and blackbox reuse refer to an ability to see into the implementation or have\
    \ the implementation hidden from inspection, respectively."
  merge: -1
  img_proc: true
- pgno: 158
  md: "# The Object Adapter pattern\n\nThe Object Adapter pattern uses composition\
    \ to delegate from the methods of the interface to those of a contained, encapsulated\
    \ object. Figure 4-6 shows the collaborating classes and interfaces used in the\
    \ Object Adapter pattern.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_158_0.png)\n\
    \nFIGURE 4-6 The UML class diagram for the Object Adapter pattern.\n\nListing\
    \ 4-19 shows how this works in practice.\n\n# LISTING 4-19 The adaptor accepts\
    \ the target class as a constructor parameter and delegates to it.\n\n```\npublic\
    \ interface IExpectedInterface\n{\n    void MethodA();\n}\n// . . .\npublic class\
    \ Adapter : IExpectedInterface\n{\n    public Adapter(TargetClass target)\n  \
    \  {\n        this.target = target;\n    }\n\n    public void MethodA()\n    {\n\
    \        target.MethodB();\n    }\n\n    private TargetClass target;\n}\n//\n\
    public class TargetClass\n{\n    public void MethodB()\n    {\n    }\n}\n```"
  merge: -1
