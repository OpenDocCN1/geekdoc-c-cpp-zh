- pgno: 230
  md: 'each property, perhaps in startling proximity. Never be afraid to roll your
    sleeves up and set about *improving* something. Even if you revert your changes,
    you will learn something, guaranteed. Better still, use your skills as an adaptive
    code ninja to aggressively refactor it into a better shape.


    Aggressive refactoring is what normal refactoring should be but rarely is. Refactoring
    should be continuous and diligent. It should also occur at different scopes. The
    refactorers discussed so far in this chapter are somewhat tactical. This is fine,
    but it will result in code that is clean at the lowest levels but that lacks a
    discernible structure. Capturing magic numbers in constant variables is a noble
    undertaking, but it will not result in code that can absorb the functionality
    of endless new requirements.


    For this, a new phase is needed in the development process: *redesign.*


    # Red, green, refactor...redesign


    Refactoring implies the fourth conceptual stage, *redesign*, but developers often
    stop short of refactoring so much. There are also nuanced differences in the rules
    for refactoring versus redesigning.


    When you are refactoring, the unit tests protect against a misstep by specifying
    the expected behavior of the code. If the refactor goes wrong and you inadvertently
    change the behavior of the code in addition to its design, the unit test fails.
    Recovery is simple: revert the changes and try again.


    When you are redesigning, the unit tests will no longer apply as valid tests of
    the design. Changing the name of a production class or method, either manually
    or by automated tools, is a refactor, not a redesign. Replacing that class with
    an entirely new class, whose methods accept different parameters and return different
    outputs, is a redesign. The difference is that the unit tests must change in order
    to be effective.


    The steps for redesigning, and therefore aggressive refactoring, are twofold.
    First, the tests must change first to reflect the new design. Second, the production
    code to satisfy the new design must be created in parallel.


    Changing the tests first ensures that you are still doing test-first development
    (not to be confused with test-driven design; see Chapter 5). Implementing the
    new production code in parallel ensures that you do not break the existing code
    for any length of time. Try to avoid committing code that is broken to source
    control. If the code was broken at any time during the redesign, it could not
    be committed to source control. This would put you in the awkward situation of
    needing to redesign code all in one sitting without any pauses or breaks. This
    is not enforceable, because the work of a developer is fraught with constant interruptions
    and context switches.'
