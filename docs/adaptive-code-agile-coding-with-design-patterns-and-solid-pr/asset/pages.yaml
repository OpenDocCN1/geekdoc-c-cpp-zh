- pgno: 160
  md: "```\npublic interface IStrategy\n{\n    void Execute();\n}\n// ...\npublic\
    \ class ConcreteStrategyA : IStrategy\n{\n    public void Execute()\n    {\n \
    \       Console.WriteLine(\"ConcreteStrategyA.Execute()\");\n    }\n}\n// ...\n\
    public class ConcreteStrategyB : IStrategy\n{\n    public void Execute()\n   \
    \ {\n        Console.WriteLine(\"ConcreteStrategyB.Execute()\");\n    }\n}\n//\
    \ ...\npublic class Context\n{\n    public Context()\n    {\n        currentStrategy\
    \ = strategyA;\n    }\n\n    public void DoSomething()\n    {\n        currentStrategy.Execute();\n\
    \n        // swap strategy with each call\n        currentStrategy = (currentStrategy\
    \ == strategyA) ? strategyB : strategyA;\n    }\n\n    private readonly IStrategy\
    \ strategyA = new ConcreteStrategyA();\n    private readonly IStrategy strategyB\
    \ = new ConcreteStrategyB();\n\n    private IStrategy currentStrategy;\n}\n```\n\
    \nWith every call that is made to Context.DoSomething(), the method first delegates\
    \ to the current strategy and then swaps between strategy A and strategy B. The\
    \ next call delegates to the newly selected strategy before again swapping back\
    \ to the original strategy.\n\nThe way the strategies are selected is an implementation\
    \ detail—it does not alter the net effect of the pattern: that the behavior of\
    \ the class is hidden behind an interface whose implementations are used to perform\
    \ the real work."
  merge: -1
  img_proc: true
- pgno: 161
  md: "# Further versatility\n\nThe utility of interfaces is not limited to design\
    \ patterns. There are some other, more-specialized uses of interfaces that are\
    \ worth investigation. Though these features are not generally applicable, there\
    \ are situations in which they are the right tool for the job.\n\nJust as with\
    \ design patterns, their overuse can be detrimental to the readability and maintainability\
    \ of code. It is a difficult balancing act to find the correct number of collaborating\
    \ patterns and techniques to solve a problem concisely, so exercise caution when\
    \ using interfaces in the following ways.\n\n# Duck-typing\n\nC# is a statically\
    \ typed language, whereas duck-typing is more commonly found in dynamically typed\
    \ languages. Duck-typing uses the “duck test”:\n\n> When I see a bird that walks\
    \ like a duck and swims like a duck and quacks like a duck, I call that bird a\
    \ duck.\n> \n> —James Whitcomb Riley\n\nApplied to types in a programming language,\
    \ the duck test suggests that, as long as an object exhibits the behavior of a\
    \ certain interface, it should be treated as that interface. Unfortunately, this\
    \ is not true by default in C#. Observe the example in Listing 4-21.\n\nLISTING\
    \ 4-21 Although the object Swan fulfills all of the methods of an IDuck, it is,\
    \ in fact, not an IDuck.\n\n```\npublic interface IDuck\n{\n    void Walk();\n\
    \    void Swim();\n    void Quack();\n}\n// . . .\npublic class Swan\n{\n    public\
    \ void Walk()\n    {\n        Console.WriteLine(\"The swan is walking.\");\n \
    \   }\n    public void Swim()\n    {\n```"
