- pgno: 236
  md: "This set of inputs and outputs is not exhaustive, nor could it be. The more\
    \ tests you can capture, the more confidence you can have when refactoring, so\
    \ a single input and output pair is unlikely to be sufficient. But there are diminishing\
    \ returns when capturing many esoteric inputs.\n\n# Instrumenting legacy code\n\
    \nLegacy code is often not as helpful as it is in this example; there might not\
    \ even be any console output to capture. Even the minimal foundations required\
    \ to support characterization tests might, in practice, necessitate some edits\
    \ to the existing code without tests in place. This is a common reality because\
    \ most legacy code was never intended to be tested. Therefore, you might need\
    \ to add some console logging at certain points in the class or method to be refactored.\
    \ Typically, this logging is added around branching and looping expressions in\
    \ addition to parts of the code that generate side effects like writing to a database\
    \ or raising an event.\n\nIt is not wholly disingenuous to claim that these changes\
    \ are not changes. They are not amendments; but appendments. There will still\
    \ be a risk of breaking functionality when appending changes; it is just less\
    \ likely that they will be detrimental to the existing code than altering an existing\
    \ line.\n\n# A golden master\n\nWith a set of characterization tests run, you\
    \ can now turn your attention to creating a golden master test. This test will\
    \ take the outputs of the characterization tests and use them as expectations\
    \ to assert against. These will be implemented as unit tests and can be run as\
    \ usual. Remember, though, that these tests are not, strictly speaking, unit tests,\
    \ because they depend on externalities such as the filesystem. Therefore, they\
    \ are neither isolated enough nor fast enough to be considered unit tests. Listing\
    \ 6-19 shows the golden master test.\n\nLISTING 6-19 The golden master test.\n\
    \n```\npublic class GoldenMaster\n{\n    private static string CharacterizationTestOutput\
    \ =\n        Path.Combine(\"../../../..\", \"CharacterizationTests/bin/Debug/\"\
    );\n\n    [Fact]\n    public void OutputStillMatchesCharacterization()\n    {\n\
    \        var inputsAndExpectations = new Dictionary<string, string>()\n      \
    \  {\n            { \"empty-file.txt\", \"expectation-empty-file.txt\" },\n  \
    \          { \"one-field.txt\", \"expectation-one-field.txt\" },\n           \
    \ { \"malformed-currency-pair.txt\", \"expectation-malformed-currency-pair.txt\"\
    \ },\n            { \"trade-volume-invalid.txt\", \"expectation-trade-volume-invalid.txt\"\
    \ },\n```"
