- pgno: 306
  md: 'To link the interface to the contract class implementation, you unfortunately
    need a two-way reference via attributes. This is unfortunate because it adds noise
    to the interface, which it would be nice to avoid. Nevertheless, by marking the
    interface with the ContractClass attribute and the contract class with the ContractClassFor
    attribute, you can write your preconditions, postconditions, and data invariant
    protection code once and have it apply to all subsequent implementations of the
    interface. Both the ContractClass and ContractClassFor attributes accept a Type
    argument. The ContractClass is applied to the interface and has the contract class
    type passed in, whereas the ContractClassFor is applied to the contract class
    and has the interface type passed in.


    This concludes the introduction to code contracts and the foray into the Liskov
    substitution principle''s rules relating to contracts. One final important point
    needs to be emphasized. Whether they are implemented manually or by using code
    contracts, if a precondition, postcondition, or invariant fails, clients should
    not catch the exception. Catching an exception is an action that indicates that
    the client can recover from this situation, which is seldom likely or perhaps
    even possible when a contract is broken. The ideal is that all contract violations
    will happen during functional testing and that the offending code will be fixed
    before shipping. Therefore, it is very important to unit test contracts. If a
    contract violation is not fixed before shipping and an end user is unfortunate
    enough to trigger an exception, it is most likely the best course of action to
    force the application to close. It is advisable to allow the application to fail
    because it is now in a potentially invalid state. For a web application, this
    will mean that the global error page is displayed. For a desktop application,
    the user can be shown a friendly message and be given a chance to report the problem.
    In all cases, a log should be made of the exception, with full stack trace and
    as much context as possible.


    The next section covers the rest of the LSP''s rules—those that apply to covariance
    and contravariance.


    # Covariance and contravariance


    The remaining rules of the Liskov substitution principle all relate to covariance
    and contravariance. Generally, variance is a term applied to the expected behavior
    of subtypes in a class hierarchy containing complex types.


    # Definitions


    As previously demonstrated, it is important to cover the basics of this topic
    before diving in to the specifics of the LSP''s requirements for variance.


    The prefixes co- and contra- are mathematical terms that mean with and against,
    respectively. Variance, in the context of types, measures the behavior of subtypes
    and their relationship. Therefore, covariance is a relationship where subtypes
    go with each other, and contravariance is a relationship where subtypes go against
    each other.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Covariance


    Figure 9-4 shows a very small class hierarchy of just two types: the generically
    named Supertype and Subtype, which are named after their respective roles in the
    inheritance structure. Supertype defines some fields and methods that are inherited
    by Subtype. Subtype enhances the Supertype by defining its own fields and methods.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_307_0.png)


    FIGURE 9-4 Supertype and Subtype have a parent/child relationship in this class
    hierarchy.


    Polymorphism is the ability of a subtype to be treated as if it were an instance
    of the supertype. Thanks to this feature of object-oriented programming, which
    C# supports, any method that accepts an instance of Supertype will also be able
    to accept an instance of Subtype without any casting required by either the client
    or service code, and without any type-sniffing by the service. To the service,
    it has been handed an instance of Supertype, and this is the only fact it is concerned
    with. It doesn''t care what specific subtype has been handed to it.


    Variance enters the discussion when you introduce another type that might use
    Supertype and/or Subtype through a generic parameter.


    Figure 9-5 is a visual explanation of the concept of covariance. First, let''s
    define a new interface called ICovariant. This interface is a generic of type
    T and contains a single method that returns this type, T. Because the out keyword
    is used before the generic type argument T, this interface is well named because
    it exhibits covariant behavior.'
  merge: -1
  img_proc: true
- pgno: 308
  md: "The second half of the class diagram details a new inheritance hierarchy that\
    \ has been created thanks to the covariance of the ICovariant interface. By plugging\
    \ in the values for the Supertype and Subtype classes that were defined previously,\
    \ ICovariant<Supertype> becomes a supertype for the ICovariant<Subtype> interface.\n\
    \n![](img/f852e0a12c174e64d91a8e1a05146eab_308_0.png)\n\nFIGURE 9-5 Due to covariance\
    \ of the generic parameter, the base-class/subclass relationship is preserved.\n\
    \nPolymorphism applies here, just as it did previously, and this is where it gets\
    \ interesting. Thanks to covariance, whenever a method requires an instance of\
    \ ICovariant<Supertype>, you can provide it instead with an instance of ICovariant<Subtype>.\
    \ This will work seamlessly thanks to the simultaneous interoperating of both\
    \ covariance and polymorphism.\n\nSo far, this is of limited general use. To firm\
    \ up this explanation, I'll move away from class diagrams and instructive type\
    \ names to a more real-world scenario. Listing 9-20 shows a class hierarchy between\
    \ a general Entity base class and a specific User subclass. All Entity types inherit\
    \ a GUID unique identifier and a string name, and each User has an EmailAddress\
    \ and a DateOfBirth.\n\n# LISTING 9-20 In this small domain, a User is a specialization\
    \ of the Entity type.\n\n```\npublic class Entity\n{\n    public Guid ID { get;\
    \ private set; }\n    public string Name { get; private set; }\n}\n// ...\npublic\
    \ class User : Entity\n{\n    public string EmailAddress { get; private set; }\n\
    \    public DateTime DateOfBirth { get; private set; }\n}\n```"
  merge: -1
