- pgno: 347
  md: '# Conclusion


    This chapter has been dedicated to the art of good interface design. Too often,
    interfaces are large facades behind which huge subsystems are hidden. At a certain
    critical mass, interfaces lose the adaptability that makes them so fundamental
    to developing SOLID code.


    There are plenty of reasons why interfaces should be segregated—to aid decoration,
    to hide functionality from clients, as self-documentation for other developers,
    or as a side effect of architectural design. Whatever the reason, it is a technique
    that should be kept at the forefront of your mind whenever you are creating an
    interface. As with most programming tools, it is easier to start out on the right
    path than to go back and heavily refactor.'
