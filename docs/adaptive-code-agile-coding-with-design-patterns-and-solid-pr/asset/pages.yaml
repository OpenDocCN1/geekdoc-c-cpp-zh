    \ has been put into a state where you can concentrate on developing. And when\
    \ it comes time to upgrade RiakClient to the next version, you can also use NuGet\
    \ to automatically update all of the packages that depend on it in the entire\
    \ solution.\n\n# Producing packages\n\nNuGet also allows you to create packages.\
    \ You might want to create packages for publication on the official NuGet package\
    \ gallery so that other developers can use them, or you might want to host your\
    \ own package feed for first-party dependencies. Figure 3-16 shows the NuGet Package\
    \ Manager, which can be used to create your own packages. In this package, I have\
    \ configured RiakClient to be a dependency, so it will also depend on Newtonsoft.Json\
