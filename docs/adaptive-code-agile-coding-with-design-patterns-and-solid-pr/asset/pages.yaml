- pgno: 21
  md: '# Chapter 13: Coupling, cohesion, and connascence [NEW]


    All design patterns aid in keeping coupling low and cohesion high. This chapter
    defines both coupling and cohesion and introduces the measurement of coupling
    strength via connascence.


    # Appendix


    The appendix is a very brief introduction to Git source control that should, at
    the very least, allow you to download the code from GitHub and compile it in Visual
    Studio 2017. It is not intended as a thorough guide to Git—there are some excellent
    sources already out there, such as the official Git tutorial.


    *http://git-scm.com/docs/gittutorial*


    A quick web search will find other sources.


    # Conventions and features in this book


    Throughout this book, there are a number of repeated conventions. These are mainly
    standard to Microsoft Press publications, but it won’t hurt to explain them up
    front.


    # Code listings


    Code listings are included where appropriate, and a callout is made to them where
    relevant, as shown in Listing I-1.


    LISTING I-1 This is a code listing. There are plenty of these in the book.


    ```

    public void MyService : IService

    {


    }

    ```


    Whenever your attention should be drawn to a certain part of the code—for instance,
    when changes have been made to a previous example—the code will be highlighted
    in bold.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Readeraids and sidebars


    Readeraids are used for small asides, such as notes or warnings, whereas sidebars
    are reserved for larger digressions. Here are some examples:


    Note This is a reader-aid. Elements such as these contain small information nuggets
    that are related to the main content but have some kind of added importance.


    # This is a sidebar


    Although this one is necessarily short, sidebars are usually reserved for longer
    discussions on topics that are somewhat tangential to the main topic.


    # Images


    Sometimes, an explanation—no matter how florid—is not enough. In these cases,
    an image is provided. All diagrams were created in Microsoft Visio with no theming,
    to create a high-contrast and to focus solely on exposition. Screenshots were
    taken with a high-contrast theme applied.


    # System requirements


    You will need the following to use the code samples referred to in this book:


    +   - Visual Studio 2015 or later, any edition

    +   - Microsoft SQL Server 2008 Express Edition or later (2008 or R2 release),
    with SQL Server Management Studio 2008 Express or later

    +   - An Internet connection for downloading code samples


    Depending on your Windows configuration, you might require Local Administrator
    rights to install or configure Visual Studio and SQL Server products.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Downloads: Code samples


    As far as possible, I ensured that the code listings were part of a larger example
    that could be run either as a standalone application or a unit test. I wrote many
    of the simpler unit tests by using MSTest so that no external test runner was
    needed, but I wrote the more complex unit tests by using NUnit. I used Visual
    Studio 2017 Professional to write all of the code. Although I wrote some of it
    by using the Community version, it has all been compiled and tested on the full
    version. As far as possible, I didn’t use features that were unavailable to the
    Community versions of Visual Studio 2017, but for some topics, this was not possible.
    Readers wanting to run this code will need to install a paid-for version.


    The code itself is available from GitHub, at the following address:


    https://github.com/AdaptiveCode/AdaptiveCode


    The Appendix contains explanations for using Git and how the code in the Adaptive
    Code repository is organized.


    To make a comment where I am likely to see it, see the GitHub repository. You
    can also follow me on Twitter:


    @garymcleanhall


    # Acknowledgments


    The byline for this book is not really accurate. I couldn’t have written any of
    this without the following people, all of whom have helped me in different ways.


    Victoria, my wife, for enabling me to write once again.


    Amelia, the best daughter in the world.


    Alexander, my son, for his squawks of encouragement.


    My family, for their unerring support.


    Kathy Krause at Online Training Solutions, Inc., for her excellent work making
    this book readable.


    Devon Musgrave, for all of his hard work in making the first edition a success.'
