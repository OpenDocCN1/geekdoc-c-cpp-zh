- pgno: 217
  md: "The most important changes to the class are summarized thus:\n\n+   - A new\
    \ property tracks the number of reward points that the customer has linked to\
    \ this account.\n+   - Each account has a type code that indicates the tier of\
    \ the account: Silver, Gold, or Platinum.\n+   - Whenever a transaction is added\
    \ to the account, the customer earns reward points.\n+   - The number of reward\
    \ points earned is dependent on multiple factors, which complicate the calculation\
    \ method:\n+     - **The account type** — More points are earned at higher tiers.\n\
    +     - **The amount of the transaction** — The more customers spend, the more\
    \ points they earn.\n+     - **The current balance of the account** — The Gold\
    \ and Platinum tiers give customers more points for keeping their balances high.\n\
    \nAssuming that this class has been written alongside its unit tests, those tests\
    \ will help greatly by ensuring that changes do not affect the specified behavior.\
    \ This is an important point—refactoring changes the arrangement of the code,\
    \ not the outcome. If you tried to refactor without unit tests, how would you\
    \ know if you inadvertently broke the expected behavior? You would not fail fast\
    \ but much later at run time during testing or, worse, after deployment.\n\n#\
    \ Replacing “magic numbers” with constants\n\nThe first refactor is a simple but\
    \ nonetheless important improvement to the readability of the code. There are\
    \ a lot of “magic numbers” littering the CalculateRewardPoints method. Six distinct\
    \ numbers are used without any context as to what they mean or why they are required.\
    \ To the person who wrote the code, their significance might be obvious because\
    \ that person has prior knowledge of what it all means. In reality, that will\
    \ probably only be true for a week, perhaps two, before the person’s memory starts\
    \ to fade and they lose track of what that 5, or that 2, means. Listing 6-2 shows\
    \ the changes made to the class as a result of this refactor.\n\n```\npublic class\
    \ Account\n{\n    public int CalculateRewardPoints(decimal amount)\n    {\n  \
    \      int points;\n        switch(type)\n        {\n            case AccountType.Silver:\n\
    \                points = (int)decimal.Floor(amount / SilverTransactionCostPerPoint);\n\
    \                break;\n            case AccountType.Gold:\n                points\
    \ = (int)decimal.Floor((Balance / GoldBalanceCostPerPoint) + (amount / GoldTransactionCostPerPoint));\n\
    \                break;\n```"
