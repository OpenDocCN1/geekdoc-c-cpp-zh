  md: "# The Builder pattern\n\nThe Builder pattern is a creational Gang of Four (GoF)\
    \ design pattern. This means that it is useful for encapsulating and abstracting\
    \ the creation of objects. It is distinct from the more common Factory pattern\
    \ in that a Builder pattern contains methods of customizing the creation of an\
    \ object. Figure 5-8 shows a UML diagram for a general Builder design pattern.\n\
    \n![](img/f852e0a12c174e64d91a8e1a05146eab_202_0.png)\n\nFIGURE 5-8 The Builder\
    \ pattern decouples complex construction of a product from its use.\n\nWhenever\
    \ an object can be configured in multiple ways across multiple dimensions, the\
    \ Builder pattern can simplify your creation code and clarify the intent.\n\n\
    # Clarifying unit test intent\n\nLet's revisit a test from earlier in the chapter\
    \ and improve its clarity of intent by applying the Builder pattern. The Moq mock\
    \ from the \"Testing with mocks\" section is repeated here as Listing 5-28.\n\n\
    LISTING 5-28 The Moq mock (shown earlier in Listing 5-17).\n\n```\n[TestMethod]\n\
