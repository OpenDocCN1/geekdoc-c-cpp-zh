- pgno: 165
  md: "| | Description |\n|---|---|\n| ❌ 1 | `foreach` requires that the return type\
    \ `void` of `TheInterface.Duck.GetEnumerator()` must have a suitable public `MoveNext`\
    \ method and public `Current` property |\n\nThus, the `Duck.GetEnumerator()` method\
    \ must return a type that exposes a MoveNext property. Listing 4-25 shows the\
    \ Duck implementation:\n\n# LISTING 4-25 Any class can be enumerable, providing\
    \ it fulfills an implicit interface\n\n```\npublic class Duck\n{\n    public DuckEnumerator\
    \ GetEnumerator()\n    {\n        return new DuckEnumerator();\n    }\n}\n```\n\
    \nThe implementation of the DuckEnumerator and its implicit interface is shown\
    \ in Listing 4-26.\n\n# LISTING 4-26 Completing the implied interface of the DuckEnumerator\
    \ class.\n\n```\npublic class DuckEnumerator\n{\n    int i = 0;\n\n    public\
    \ bool MoveNext()\n    {\n        return i++ < 10;\n    }\n\n    public int Current\n\
    \    {\n        get\n        {\n            return i;\n        }\n    }\n}\n```\n\
    \nAt this point, you have successfully implemented the implicit interface that\
    \ the `foreach` requires—duck-typing in action!"
