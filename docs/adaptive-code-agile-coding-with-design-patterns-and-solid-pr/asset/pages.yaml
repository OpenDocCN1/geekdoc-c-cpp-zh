  md: "```\npublic static void SetLocatorProvider(ServiceLocatorProvider newProvider)\n\
    {\n    currentProvider = newProvider;\n}\n```\n\nThe comment hints at the problem.\
    \ The concept of an ambient container implies a leak of knowledge that a container\
    \ exists. Although there is a laudable decoupling of the specific implementation\
    \ of the service locator behind an interface, the problem is the acknowledgement—inside\
    \ any class other than the composition root—of the service locator or container.\
    \ Listing 12-22 shows how the TaskListController would look if it was rewritten\
    \ to use the ServiceLocator.\n\n# LISTING 12-22 A service locator allows classes\
    \ to retrieve anything at all, whether appropriate or not.\n\n```\npublic class\
    \ TaskListController : INotifyPropertyChanged\n{\n    public void OnLoad()\n \
    \   {\n        var taskService = ServiceLocator.Current.GetInstance<ITaskService>();\n\
    \        var taskDtos = taskService.GetAllTasks();\n        var mapper = ServiceLocator.Current.GetInstance<IObjectMapper>();\n\
    \        AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumberable<TaskViewModel>>((taskDtos));\n\
    \    }\n\n    public ObservableCollection<TaskViewModel> AllTasks\n    {\n   \
    \     get\n        {\n            return allTasks;\n        }\n        set\n \
    \       {\n            allTasks = value;\n            PropertyChanged(this, new\
    \ PropertyChangedEventArgs(\"AllTasks\"));\n        }\n    }\n\n    public event\
    \ PropertyChangedEventHandler PropertyChanged = delegate {};\n\n    private ObservableCollection<TaskViewModel>\
    \ allTasks;\n}\n```\n\nNow there is no constructor, nor is there constructor injection.\
    \ Instead, when required, the class makes a call to the static ServiceLocator\
    \ class and returns the service requested. Recall that static classes like this\
    \ are skyhooks—a code smell.\n\nWorse still, the class is able to retrieve anything\
    \ and everything from the service locator. You are no longer following the \"\
    Hollywood Principle\" of dependency injection: Don't call us, we'll call you.\
    \ Instead, you are directly asking for the things you need, rather than having\
    \ them handed to you. How"
