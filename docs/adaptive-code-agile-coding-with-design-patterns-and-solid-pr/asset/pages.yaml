- pgno: 238
  md: '# Conclusion


    Refactoring and unit testing are interdependent practices that are vital to the
    creation and maintenance of adaptive code. Code is in a constant state of flux
    and should never truly be considered absolute. Aside from adding new features
    as requirements shift, code should be aggressively refactored so that it has a
    better chance of standing the test of time. With aggressive refactoring—redesigning—the
    code will exhibit good design at its lowest levels, but new knowledge about the
    problem space will never be incorporated into the code. Consider the number of
    times that you “finish” a project and wish—weeks, months, or years later—that
    you could revise it because you finally “understand the requirements” or have
    learned a new technique that would have simplified the solution. Through consistent
    and diligent refactoring and redesigning, code is able to remain adaptive long
    into the future. Do not be tempted by the siren song of a system rewrite!


    With this chapter complete, the Agile foundation part of this book is closed.
    Next, you will look at SOLID code and how it will help to further increase the
    adaptability of your code.'
