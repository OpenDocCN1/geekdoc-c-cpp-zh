  md: "Here the `Stopwatch` class from the `System.Diagnostics` assembly is used to\
    \ time each method from start to finish. Note that the `Something` method in the\
    \ class starts the stopwatch on entry and then stops it on exit.\n\nOf course,\
    \ this can be factored out into a profiling decorator. The interface as a whole\
    \ is decorated and, before delegating to the decorated instance, you start the\
    \ stopwatch. When the delegated method returns, you stop the stopwatch before\
    \ returning to the calling client. The stopwatch decorator code is shown in Listing\
    \ 7-27.\n\n# **LISTING 7-27** The profiling decorator code.\n\n```\npublic class\
    \ ProfilingComponent : IComponent\n{\n    public ProfilingComponent(IComponent\
    \ decoratedComponent)\n    {\n        this.decoratedComponent = decoratedComponent;\n\
    \        stopwatch = new Stopwatch();\n    }\n\n    public void Something()\n\
    \    {\n        stopwatch.Start();\n        decoratedComponent.Something();\n\
    \        stopwatch.Stop();\n        Console.WriteLine(\"The method took {0} seconds\
    \ to complete\",\n            stopwatch.ElapsedMilliseconds / 1000);\n    }\n\n\
    \    private readonly IComponent decoratedComponent;\n    private readonly Stopwatch\
    \ stopwatch;\n}\n```\n\nThere is one further change that you could make to the\
    \ `ProfilingComponent` class: make it transparently log the profiling. First,\
    \ you need to factor out the stopwatch code behind an interface so that you can\
    \ provide multiple implementations, including decorators. This is a common first\
    \ step when refactoring toward a better separation of responsibilities. Listing\
    \ 7-28 shows this intermediate step.\n\n# **LISTING 7-28** Before you can implement\
    \ a decorator, you must replace concrete implementations with interfaces.\n\n\
    ```\npublic class ProfilingComponent : IComponent\n{\n    public ProfilingComponent(IComponent\
    \ decoratedComponent, IStopwatch stopwatch)\n    {\n        this.decoratedComponent\
    \ = decoratedComponent;\n        this.stopwatch = stopwatch;\n    }\n}\n```"
