- pgno: 91
  md: '# Conclusion


    This chapter covered some basics and details of the Kanban approach to Agile software
    delivery. There are parallels with other Agile methodologies, like Scrum, but
    also some key differences. There are no distinct iterations in Kanban, just a
    continuous flow of items coming in and being delivered. Ceremonies, then, happen
    as and when they are required, rather than at rigidly calendared times.


    Scrum’s approach to managing change is to timebox the sprint and lock the inputs
    so that new work arriving after the start of the sprint must wait until the next
    iteration before being prioritized and scheduled. Kanban allows the addition of
    new work at any time but only provides service level agreements (SLAs) on how
    long it will likely take to complete new work. Kanban limits work in progress
    to ensure that the completion of work is prioritized over starting something anew.


    In my experience, Scrum is Agile for new teams, while Kanban is Agile for mature
    teams. On a spectrum of experience with Agile methodologies, a team that scores
    lower would be better suited to the rigid ceremony and discipline of Scrum, whereas
    a team that scores higher would be better suited to the more laissez-faire Kanban.
    By way of analogy, Scrum can be thought of as the regular rhythmic beat of a regimental
    marching band. Kanban would therefore be jazz.


    Another deciding factor for choosing between Scrum and Kanban as your Agile methodology
    is the kind of work to which they are to be applied. If the work is part of a
    project with a finite amount of time and financial resources in place, Scrum is
    a natural fit because each sprint can be costed individually. If the work is continual
    without a definite end date (often termed business as usual or BAU), Kanban will
    work well.'
  merge: -1
  img_proc: true
