    \ an instance of the MessagePrintingService and call the PrintMessage method,\
    \ as shown in Listing 3-3.\n\n# LISTING 3-3 Introducing a dependency by calling\
    \ an instance method.\n\n```\nusing System;\nusing MessagePrinter;\n\nnamespace\
    \ SimpleDependency\n{\n    class Program\n    {\n        static void Main()\n\
    \        {\n            var service = new MessagePrintingService();\n        \
    \    service.PrintMessage();\n            Console.ReadKey();\n        }\n    }\n\
    }\n```"
