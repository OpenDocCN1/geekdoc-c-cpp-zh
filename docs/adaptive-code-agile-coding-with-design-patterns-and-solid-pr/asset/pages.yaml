- pgno: 215
  md: '# Refactoring


    After completing this chapter, you will be able to


    +   - Understand the importance of unit testing and its role in enabling refactoring.

    +   - Refactor production code to improve its overall design.

    +   - Safely improve the design of old codebases which do not have accompanying
    unit tests.


    Refactoring is the process of incrementally improving the design of existing code.
    It is analogous to writing various drafts of code, much like I have written various
    drafts of this book. By acknowledging that we developers rarely get things right
    the first time, refactoring frees us to do the simplest thing first, and gradually,
    through incremental improvements, arrive at a better solution later.


    The freedom to refactor with impunity is made possible by unit testing. Together,
    unit testing and refactoring form a mutually beneficial relationship, whereby
    unit testing enables refactoring and refactoring improves the design of code.


    # Introduction to refactoring


    Your code will be more robust if you follow a test-driven development (TDD) process
    that writes a failing unit test before moving on to implement the expected behavior.
    However, this code might not be as organized or understandable as it could be.
    There are many times during the course of writing code when you should stop writing
    unit tests and code, and instead focus on refactoring.


    Refactoring is the process of improving the design of existing code—after it has
    already been written. Each refactor differs in size and scope. A refactor could
    be a small tweak to a variable name to aid clarity, or it could be a more sweeping
    architectural change such as splitting user interface logic from domain logic
    when the two have become inappropriately intimate.


    # Changing existing code


    In this chapter, you are going to make incremental changes to a class that will,
    at every step, improve the code in some meaningful way. The Account class you
    worked with in Chapter 5, "Testing," is the target for refactoring, but it has
    gained a new method since its previous use: CalculateRewardPoints. Like many companies,
    your clients want to reward customer loyalty through the accumulation of reward
    points. These points are earned by the customer, depending on a variety of criteria.'
  merge: -1
  img_proc: true
