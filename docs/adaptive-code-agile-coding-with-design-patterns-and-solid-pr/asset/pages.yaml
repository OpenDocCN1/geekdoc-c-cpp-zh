    \ provides the ambient container for this application. If your\n/// framework\
    \ defines such an ambient container, use ServiceLocator.Current\n/// to get it.\n\
    /// </summary>\npublic static class ServiceLocator\n{\n    private static ServiceLocatorProvider\
    \ currentProvider;\n\n    public static IServiceLocator Current\n    {\n     \
    \   get { return currentProvider(); }\n    }\n}\n```"
