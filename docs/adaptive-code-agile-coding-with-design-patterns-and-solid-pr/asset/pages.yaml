- pgno: 249
  md: 'gained very little by way of adaptability. You can change the implementation
    of the LogMessage method so that it, for example, writes to a file instead of
    to the console, but that involves a change to the TradeProcessor class, which
    is precisely what you wanted to avoid.


    This refactor has been an important stepping stone on the path to truly separating
    the responsibilities of this class. It has been a refactor for clarity, not for
    adaptability. The next task is to split each responsibility into different classes
    and place them behind interfaces. What you need is true abstraction to achieve
    useful adaptability.


    # Refactoring for abstraction


    Building on the new TradeProcessor implementation, the next refactor introduces
    several abstractions that will allow you to handle almost any change request for
    this class. Although this running example might seem very small, perhaps even
    insignificant, it is a workable contrivance for the purposes of this tutorial.
    Also, it is very common for a small application such as this to grow into something
    much larger. When a few people start to use it, the feature requests begin to
    increase.


    Often, the terms prototype and proof of concept are applied to such allegedly
    small applications, and the conversion from prototype to production application
    is relatively seamless. This is why the ability to refactor toward abstraction
    is such a touchstone of adaptive development. Without it, the myriad requests
    devolve into a "big ball of mud"—a class, or a group of classes in an assembly,
    with little delineation of responsibility and no discernible abstractions. The
    result is an application that has no unit tests and that is difficult to maintain
    and enhance, and yet that could be a critical piece of the line of business.


    The first step in refactoring the TradeProcessor for abstraction is to design
    the interface or interfaces that it will use to perform the three high-level tasks
    of reading, processing, and storing the trade data. Figure 7-1 shows the first
    set of abstractions.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_249_0.png)


    FIGURE 7-1 The TradeProcessor will now depend on three new interfaces.'
