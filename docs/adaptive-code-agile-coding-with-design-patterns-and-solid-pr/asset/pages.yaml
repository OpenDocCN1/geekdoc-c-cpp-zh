  md: "```\n```csharp\n{\n    var allTasks = new List<TaskDto>();\n\n    connection.Open();\n\
    \n    try\n    {\n        using (var transaction = connection.BeginTransaction())\n\
    \        {\n            var command = connection.CreateCommand();\n          \
    \  command.Transaction = transaction;\n            command.CommandType = CommandType.StoredProcedure;\n\
    \            command.CommandText = \"[dbo].[get_all_tasks]\";\n\n            using\
    \ (var reader = command.ExecuteReader(CommandBehavior.CloseConnection))\n    \
    \        {\n                while (reader.Read())\n                {\n       \
    \             allTasks.Add(\n                        new TaskDto\n           \
    \             {\n                            ID = reader.GetInt32(IDIndex),\n\
    \                            Description = reader.GetString(DescriptionIndex),\n\
    \                            Priority = reader.GetString(PriorityIndex),\n   \
    \                         DueDate = reader.GetDateTime(DueDateIndex),\n      \
    \                      Completed = reader.GetBoolean(CompletedIndex)\n       \
    \                 });\n                }\n            }\n        }\n    }\n  \
    \  finally\n    {\n        connection.Close();\n    }\n\n    return allTasks;\n\
    }\n\npublic void Dispose()\n{\n    connection.Dispose();\n}\n}\n```\n```\n\nInstead\
    \ of disposing of the connection in the method, the connection is disposed of\
    \ only when the service is disposed of. This raises the important question of\
    \ when the task service should be disposed of. Should all of the task’s clients,\
    \ which will receive ITaskService as a constructor parameter, also implement IDisposable?\
    \ Who will dispose of these objects? Eventually, you would need to call Dispose()\
    \ on something."
