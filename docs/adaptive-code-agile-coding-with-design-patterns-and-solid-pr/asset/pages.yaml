  md: "# Mixins\n\nAn extension of duck-typing is the concept of the *mixin*. A mixin\
    \ is a class that contains the implementations from multiple other classes, without\
    \ using implementation inheritance. As you have already learned, multiple implementation\
    \ inheritance is not supported by C#, so you must look at other solutions for\
    \ implementing mixins.\n\nOne trivial but limited way of implementing mixins is\
    \ to use extension methods. This allows you to add methods to a type that has\
    \ already been defined, which can be very useful. An alternative is to use a third-party\
    \ library such as Re-motion Re-mix, which operates much like Impromptu Interface\
    \ in that it generates a new type at run time that contains all of the interfaces\
    \ you specify and acts as a multifaceted adapter.\n\n# Using extension methods\n\
    \nSince the .NET Framework 3.5, extension methods have allowed the addition of\
    \ new functionality to already existing types. Without needing to access the source\
    \ of a type, nor requiring the type to be a partial definition, you can extend\
    \ a type. Listing 4-27 shows the interface that will be enhanced in this section,\
    \ along with a pair of trivial extension methods.\n\n**LISTING 4-27** Extension\
    \ methods can enhance an existing interface.\n\n```\npublic interface ITargetInterface\n\
    {\n    void DoSomething();\n}\n// . . .\npublic static class MixinExtensions\n\
    {\n    public static void FirstExtensionMethod(this ITargetInterface target)\n\
    \    {\n        Console.WriteLine(\"The first extension method was called.\");\n\
    \    }\n\n    public static void SecondExtensionMethod(this ITargetInterface target)\n\
    \    {\n        Console.WriteLine(\"The second extension method was called.\"\
    );\n    }\n}\n```\n\nNow, whenever a client has access to an ITargetInterface\
    \ instance, and it also references the MixinExtensions class, these two extension\
    \ methods will be available. Any number of extension methods can be created, spread\
    \ across multiple static classes. Listing 4-28 shows another pair of extension\
    \ methods; this time they take extra parameters."
  merge: -1
  img_proc: true
- pgno: 167
  md: "# LISTING 4-28 Extension methods can take parameters.\n\n```\npublic static\
    \ class MoreMixinExtensions\n{\n    public static void FurtherExtensionMethodA(this\
    \ ITargetInterface target, int extraParameter)\n    {\n        Console.WriteLine(\"\
    Further extension method A was called with argument {0}\", extraParameter);\n\
    \    }\n\n    public static void FurtherExtensionMethodB(this ITargetInterface\
    \ target, string stringParameter)\n    {\n        Console.WriteLine(\"Further\
    \ extension method B was called with argument {0}\", stringParameter);\n    }\n\
    }\n```\n\nThese extension methods can be called just like any other by any client,\
    \ as in Listing 4-29.\n\n# LISTING 4-29 Clients have access to extension methods\
    \ as if they were declared directly on the target interface.\n\n```\npublic class\
    \ MixinClient\n{\n    public MixinClient(ITargetInterface target)\n    {\n   \
    \     this.target = target;\n    }\n\n    public void Run()\n    {\n        target.DoSomething();\n\
    \        target.FirstExtensionMethod();\n        target.SecondExtensionMethod();\n\
    \        target.FurtherExtensionMethodA(30);\n        target.FurtherExtensionMethodB(\"\
    Hello!\");\n    }\n\n    private readonly ITargetInterface target;\n}\n```\n\n\
    There are a few notable limitations to this approach to mixins. The first is the\
    \ testability of the client. As Chapter 5, \"Testing,\" will show, static classes\
    \ do not lend themselves to be easily mocked. This makes all clients of these\
    \ extension methods more difficult to properly unit test.\n\nWorse still, also\
    \ due to extension methods being static classes, they cannot hold any extra per-instance\
    \ state related to the object. Sure, there are workarounds, such as storing a\
    \ static dictionary that maps instances to some extra values, but this is not\
    \ ideal."
