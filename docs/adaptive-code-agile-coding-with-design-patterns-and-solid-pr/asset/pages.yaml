  md: '# A simple example


    Let''s look at how a dependency behaves in a practical situation. This example
    is a very simple console application that prints a message to the screen. It''s
    the universal "Hello World!" example. This example is necessarily trivial to distill
    the problems with dependencies down to their essence.


    You can follow the steps here manually or retrieve the solution from GitHub. See
    the appendix, "Adaptive tools," for basic instructions on using Git and the accompanying
    sample code.


    +   1. Open Microsoft Visual Studio and create a new console application, as shown
    in Figure 3-2. I have called mine SimpleDependency, but the name is not important.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_97_0.png)


    +   2. Add a second project to the solution, this time a class library. I have
    called mine MessagePrinter.


    +   3. Right-click the console application''s References node and select Add Reference.


    +   4. In the Add Reference dialog box, navigate to Projects and select the class
    library project.'
