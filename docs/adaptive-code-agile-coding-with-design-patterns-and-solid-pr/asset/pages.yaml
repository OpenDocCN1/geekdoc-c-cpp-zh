- pgno: 312
  md: "The unit test in Listing 9-24 explores the affect that contravariance has on\
    \ the EntityEqualityComparer.\n\n# LISTING 9-24 Contravariance inverts class hierarchies,\
    \ allowing a more general comparer to be used wherever a more specific comparer\
    \ is requested.\n\n```\n[Test]\npublic void UserCanBeComparedWithEntityComparer()\n\
    {\n    SubtypeCovariance.IEqualityComparer<User> entityComparer = new EntityEqualityComparer();\n\
    \    var user1 = new User();\n    var user2 = new User();\n    entityComparer.Equals(user1,\
    \ user2)\n        .Should().BeFalse();\n}\n```\n\nWithout contravariance—the innocent-looking\
    \ in keyword applied to generic type parameters—the following error would be shown\
    \ at compile time.\n\n```\nerror CS0266: Cannot implicitly convert type 'SubtypeCovariance.EntityEqualityComparer'\
    \ to 'SubtypeCovariance.IEqualityComparer<SubtypeCovariance.Users>'. An explicit\
    \ conversion exists (are you missing a cast?)\n```\n\nThere would be no type conversion\
    \ from EntityEqualityComparer to IEqualityComparer<User>, which is intuitive because\
    \ Entity is the supertype and User is the subtype. However, because the IEqualityComparer\
    \ supports contravariance, the existing inheritance hierarchy is inverted and\
    \ you can assign what was originally a less specific type to a more specific type\
    \ via the IEqualityComparer interface.\n\n# Invariance\n\nBeyond covariant or\
    \ contravariant behavior, types are said to be invariant. This is not to be confused\
    \ with the term data invariant used earlier in this chapter as it relates to code\
    \ contracts. Instead, invariant in this context is used to mean \"not variant.\"\
    \ If a type is not variant at all, no arrangement of types will yield a class\
    \ hierarchy. Listing 9-25 uses the IDictionary generic type to demonstrate this\
    \ fact.\n\n# LISTING 9-25 Some generic types are neither covariant or contravariant.\
    \ This makes them invariant.\n\n```\n[TestFixture]\npublic class DictionaryTests\n\
    {\n    [Test]\n    public void DictionaryIsInvariant()\n    {\n        // Attempt\
    \ covariance..\n        IDictionary<Supertype, Supertype> supertypeDictionary\
    \ = new Dictionary<Subtype, Subtype>();\n```"
