- pgno: 379
  md: "```\nprivate const int IDIndex = 0;\nprivate const int DescriptionIndex = 1;\n\
    private const int PriorityIndex = 2;\nprivate const int DueDateIndex = 3;\nprivate\
    \ const int CompletedIndex = 4;\n}\n```\n\nThe ISettings interface abstracts away\
    \ from this class the details of retrieving the connection string. An implementation\
    \ that is an adapter for the Microsoft .NET Framework's Configuration Manager\
    \ class is provided. It is not hard to imagine that the settings could end up\
    \ being stored elsewhere at some point, which justifies the use of an interface.\
    \ Another problem is that the ConfigurationManager class is static and therefore\
    \ hard to mock. Using it directly would not only limit your options for retrieving\
    \ application settings such as connection strings, it would also make the TaskServiceAdo\
    \ class less testable.\n\n# Constructing the object graph\n\nOften in this book,\
    \ it has been an accepted fact that interfaces are injected into constructors.\
    \ Eventually, of course, interfaces prove to be insufficient, and you must commit\
    \ to an implementation. There are two main options for accomplishing this: Poor\
    \ Man's Dependency Injection and using an Inversion of Control container. To exemplify\
    \ how dependency injection works, this section will first look at Poor Man's DI.\n\
    \n# Poor Man's Dependency Injection\n\nThis pattern is so named because it does\
    \ not require any external dependencies in order to function. It involves constructing\
    \ the necessary object graph for the controller ahead of time. Listing 12-4 shows\
    \ how to construct the refactored TaskListController and provide it to the TaskListView,\
    \ which is the application's main window.\n\nLISTING 12-4 Poor Man's DI is verbose\
    \ but flexible.\n\n```\npublic partial class App : Application\n{\n    private\
    \ void OnApplicationStartup(object sender, StartupEventArgs e)\n    {\n      \
    \  CreateMappings();\n\n        var settings = new ApplicationSettings();\n  \
    \      var taskService = new TaskServiceAdo(settings);\n        var objectMapper\
    \ = new MapperAutoMapper();\n        controller = new TaskListController(taskService,\
    \ objectMapper);\n        MainWindow = new TaskListView(controller);\n       \
    \ MainWindow.Show();\n\n        controller.OnLoad();\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 380
  md: "```\n```csharp\nprivate void CreateMappings()\n{\n    AutoMapper.Mapper.CreateMap<TaskDto,\
    \ TaskViewModel>();\n}\n\nprivate TaskListController controller;\n```\n```\n\n\
    This code is the entry point to your application. The OnApplicationStartup method\
    \ is an event handler that is called by internal WPF code to inform you that you\
    \ can initialize things. In different types of applications, the entry point varies\
    \ in style but is always a good place to put your dependency injection code.\n\
    \nThe process of bootstrapping the application is very simple. The target is to\
    \ construct a TaskListView, because that is the view class that acts as the resolution\
    \ root of the application. Resolution roots are covered later in this chapter.\
    \ To construct that class, you need a TaskListController instance. But that class\
    \ requires both an ITaskService and an IObjectMapper, so you instantiate classes\
    \ for both—this is where you are committing to the implementations. The TaskServiceAdo,\
    \ in turn, requires an ISettings implementation, so you commit to the ApplicationSettings,\
    \ which is an adapter for the ConfigurationManager .NET Framework class. Figure\
    \ 12-3 clarifies this with a class diagram.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_380_0.png)\n\
    \n**FIGURE 12-3** The interfaces, their implementations, and their dependencies,\
    \ all of which make up the Task List application."
  merge: -1
  img_proc: true
- pgno: 381
  md: "Each class requires one or more dependencies as sockets that are implemented\
    \ by other classes that might also require dependencies. It is common for an implementation\
    \ to be an adapter, such as the MapperAutoMapper and the ApplicationSettings classes.\
    \ These classes fulfil the interface required of the dependency but delegate the\
    \ actual work to another class. Even if the class is not an adapter, it is likely\
    \ to have some dependencies of its own to which it delegates some of the work,\
    \ like the TaskServiceAdo, which uses ADO.NET for the real retrieval of data.\
    \ Other implementations of the ITaskService could get the task list from anywhere—a\
    \ TaskServiceNHibernate class would be an alternative implementation that delegated\
    \ much of the work to NHibernate. A TaskServiceOutlook class could depend on the\
    \ Microsoft Outlook Add-In framework and read the tasks directly from the built-in\
    \ task list of Outlook. It is imperative to note that, because the interface does\
    \ not tie itself to any of these technologies, anything could be the source of\
    \ tasks, assuming that it can fulfil the interface.\n\nPoor Man’s DI is verbose.\
    \ When this application is extended to support adding new tasks, editing tasks,\
    \ or perhaps notifying of an imminent due date, it is clear that these few lines\
    \ of construction code will grow significantly, to the point where they are no\
    \ longer easily understood. However, Poor Man’s DI is flexible. Whatever complex\
    \ object graph you want to construct, the way to construct it is obvious because\
    \ there is only one way: manually creating instances of everything and passing\
    \ them to classes that aggregate their functionality, repeating until you reach\
    \ the resolution root. You can implement any number of decorators for the interfaces\
    \ that each class depends on; Poor Man’s DI allows you to meticulously construct\
    \ the resulting graph.\n\n# Method injection\n\nThe constructor isn’t the only\
    \ option for providing dependencies to classes. Methods and properties can also\
    \ be used, and they both have different use cases when compared to constructors.\n\
    \nListing 12-5 shows part of the TaskListController that has been rewritten to\
    \ furnish the ITaskService with its ISettings dependency as a parameter on the\
    \ GetAllTasks method. This requires the interface for the method to be altered.\n\
    \n# LISTING 12-5 The task service now accepts the settings as a method parameter\
    \ instead of a constructor parameter.\n\n```\npublic class TaskListController\
    \ : INotifyPropertyChanged\n{\n    public TaskListController(ITaskService taskService,\
    \ IObjectMapper mapper, ISettings settings)\n    {\n        this.taskService =\
    \ taskService;\n        this.mapper = mapper;\n        this.settings = settings;\n\
    \    }\n\n    public void OnLoad()\n    {\n        var taskDtos = taskService.GetAllTasks(settings);\n\
    \        AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumerable<TaskViewModel>>(taskDtos));\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 382
  md: "This is useful when the method being called is the only one that requires the\
    \ dependency. Constructor dependencies indicate that sufficient behavior in the\
    \ class requires delegation to the dependency, but if only a small percentage\
    \ of methods truly use the dependency, it might make more sense to pass it in\
    \ to those methods specifically. The downside of method injection is that it requires\
    \ the clients who call the method to acquire an instance of the dependency. They\
    \ can do so either through a constructor parameter or through a method parameter\
    \ that causes clients to pass the parameter down the call stack until it is used\
    \ by the target class.\n\n# Property injection\n\nSimilar to method injection,\
    \ property injection can be used to inject dependencies. Listing 12-6 refactors\
    \ the prior example to show how the ITaskService could have its ISettings dependencies\
    \ set by a property. Bear in mind that, again, the interface needs to be changed\
    \ to support the property, not just the implementation.\n\nLISTING 12-6 Dependency\
    \ injection can also be accomplished via property injection.\n\n```\npublic class\
    \ TaskListController : INotifyPropertyChanged\n{\n    public TaskListController(ITaskService\
    \ taskService, IObjectMapper mapper, ISettings settings)\n    {\n        this.taskService\
    \ = taskService;\n        this.mapper = mapper;\n        this.settings = settings;\n\
    \    }\n\n    public void OnLoad()\n    {\n        taskService.Settings = settings;\n\
    \        var taskDtos = taskService.GetAllTasks();\n        AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumerable<TaskViewModel>>(taskDtos));\n\
    \    }\n}\n```\n\nThe benefit to this approach is that the instance property can\
    \ be changed at run time. Although a constructor dependency is injected and that\
    \ instance is used for the lifetime of the class, a property value can be replaced\
    \ midway through the class's lifetime. However, if a valid instance of the ISettings\
    \ interface was not provided to the ITaskService before calling GetAllTasks(),\
    \ this code would fail. Introducing an unenforced requirement like this is a serious\
    \ code smell.\n\n# Inversion of Control\n\nThroughout this book, the examples\
    \ have focused on developing classes that delegate to abstractions. These abstractions\
    \ are then implemented by other classes, which delegate some work to more abstractions.\
    \ Eventually, a class is so small and directed that it need not delegate any further,\
    \ and the chain of dependency is ended. In order to construct the dependent classes,\
    \ first their dependencies are constructed and then injected in as dependencies.\
    \ You have learned how this dependency injection can be implemented by manually\
    \ constructing classes and passing instances into the constructors. Though this"
  merge: -1
  img_proc: true
- pgno: 383
  md: "elevates you from a situation in which dependent implementations cannot be\
    \ swapped or decorated to one in which they can, the object graph is still constructed\
    \ statically: which part goes where is known at compile time. Inversion of Control\
    \ (IoC) allows you to defer this construction to run time.\n\nIoC is most well\
    \ known in the context of IoC containers. These systems allow you to link the\
    \ interfaces of your application to their implementations and retrieve an instance\
    \ of a class by resolving all its dependencies.\n\nThe code in Listing 12-7 shows\
    \ the application entry point rewritten to use the Unity IoC container. The first\
    \ step is to instantiate a new UnityContainer instance. Note that when you are\
    \ bootstrapping the IoC container like this, there is no alternative but to directly\
    \ reference the required concrete implementations of infrastructural components.\n\
    \n# LISTING 12-7 With an IoC container, instead of using manual construction,\
    \ you must map interfaces to their implementing types.\n\n```\npublic partial\
    \ class App : Application\n{\n    private IUnityContainer container;\n\n    private\
    \ void OnApplicationStartup(object sender, StartupEventArgs e)\n    {\n      \
    \  CreateMappings();\n\n        container = new UnityContainer();\n        container.RegisterType<ISettings,\
    \ ApplicationSettings>();\n        container.RegisterType<IObjectMapper, MapperAutoMapper>();\n\
    \        container.RegisterType<ITaskService, TaskServiceAdo>();\n        container.RegisterType<TaskListController>();\n\
    \        container.RegisterType<TaskListView>();\n\n        MainWindow = container.Resolve<TaskListView>();\n\
    \        MainWindow.Show();\n\n        ((TaskListController)MainWindow.DataContext).OnLoad();\n\
    \    }\n\n    private void CreateMappings()\n    {\n        AutoMapper.Mapper.CreateMap<TaskDto,\
    \ TaskViewModel>();\n    }\n}\n```\n\nAfter the Unity container is created, you\
    \ need to make it aware of each interface that will need to be resolved at some\
    \ point during the application's lifetime and map a concrete implementation to\
    \ each interface. Whenever Unity encounters an interface, it will know which implementation\
    \ it needs to resolve. If you fail to indicate which class to use for an interface,\
    \ Unity will loudly remind you that it cannot instantiate interfaces."
  merge: -1
  img_proc: true
- pgno: 384
  md: "After all registration is complete, you need to get an instance of your resolution\
    \ root: the TaskListView. The Resolve method of the container will examine the\
    \ constructor of this class and try to instantiate any dependencies by examining\
    \ their constructors and trying to instantiate their dependencies, and so on down\
    \ the chain. Eventually, when there are no more classes to instantiate, the Resolve\
    \ method is able to call the constructors that it found by passing in the instances\
    \ it has created so far. This is exactly the same process that you follow when\
    \ using Poor Man’s DI, but with that approach you examine the constructors manually\
    \ and instantiate the classes directly.\n\n# The Register, Resolve, Release pattern\n\
    \nAll Inversion of Control containers reduce to a simple interface with only three\
    \ methods, as shown in Listing 12-8. Unity is no exception to this and follows\
    \ a similar pattern.\n\n# LISTING 12-8 Although each implementation will embellish\
    \ it, this is the general interface for all IoC containers.\n\n```\npublic interface\
    \ IContainer : IDisposable\n{\n    void Register<TInterface, TImplementation>()\n\
    \        where TImplementation : TInterface;\n\n    TImplementation Resolve<TInterface>();\n\
    \n    void Release();\n}\n```\n\nThe purpose of each of the three methods is explained\
    \ in the following list:\n\n+   - **Register** This method is called first, at\
    \ application initialization. It will be called many times to register many different\
    \ interfaces to their implementations. The where clause enforces the constraint\
    \ that the TImplementation type must implement the TInterface type. Other permutations\
    \ of this method allow you to register an already-constructed instance of a class\
    \ and a type without a specific interface. (Such a type will be registered against\
    \ all the interfaces it implements.)\n\n+   - **Resolve** This method is called\
    \ during the running of the application. It is common for a particular family\
    \ of classes to be resolved as the top-level object of the graph. For example,\
    \ this would be the controllers in an ASP.NET Model-View-Controller (MVC) application,\
    \ the viewmodels in a ViewModel-first WPF application, and the views in a Windows\
    \ Forms Model-View-Presenter (MVP) application. The call to this method should\
    \ be an infrastructural concern. That is, you should not call Resolve inside your\
    \ application’s classes for controllers, views, presenters, services, domain,\
    \ business logic, or data access.\n\n+   - **Release** At some point, the classes\
    \ will no longer be needed and their resources can be released. This might happen\
    \ at the end of the application, but it also could happen at a more opportune\
    \ moment during the application’s lifetime. In a web scenario, for example, it\
    \ is common for resources to live only per-request. Thus, Release could be called\
    \ at the end of each request. This sort of object lifetime concern is discussed\
    \ in more detail later."
  merge: -1
  img_proc: true
- pgno: 385
  md: "# Dispose\n\nMost IoC containers will implement the IDisposable interface,\
    \ so it has been included in this reference interface, too. The Dispose method\
    \ will be called once when the application is shut down. It is distinct from Release\
    \ in that the Dispose call will clear out the internal dictionaries of the container\
    \ so that it has no registrations and is unable to resolve anything.\n\nThe first\
    \ IoC example (shown earlier in Listing 12-7) can be rewritten so that all interaction\
    \ with the container is encapsulated in a class. This moves the view registration\
    \ code away from the code-behind in the WPF application. This is shown in Listing\
    \ 12-9.\n\n**LISTING 12-9** The startup event handler delegates much of its work\
    \ to a configuration class.\n\n```\npublic partial class App : Application\n{\n\
    \    private IoCConfiguration ioc;\n\n    private void OnApplicationStartup(object\
    \ sender, StartupEventArgs e)\n    {\n        CreateMappings();\n\n        ioc\
    \ = new IoCConfiguration();\n        ioc.Register();\n\n        MainWindow = ioc.Resolve();\n\
    \        MainWindow.Show();\n\n        ((TaskListController)MainWindow.DataContext).OnLoad();\n\
    \    }\n\n    private void OnApplicationExit(object sender, ExitEventArgs e)\n\
    \    {\n        ioc.Release();\n    }\n\n    private void CreateMappings()\n \
    \   {\n        AutoMapper.Mapper.CreateMap<TaskDto, TaskViewModel>();\n    }\n\
    }\n```"
