- pgno: 171
  md: "# Fluent interfaces\n\nAn interface is said to be fluent if it returns itself\
    \ from one or more of its methods. This allows clients to chain calls together,\
    \ as shown in Listing 4-34.\n\n**LISTING 4-34** Fluent interfaces allow method\
    \ chaining.\n\n```\npublic class FluentClient\n{\n    public FluentClient(IFluentInterface\
    \ fluent)\n    {\n        this.fluent = fluent;\n    }\n\n    public void Run()\n\
    \    {\n        // without using fluency\n        fluent.DoSomething();\n    \
    \    fluent.DoSomethingElse();\n        fluent.DoSomethingElse();\n        fluent.DoSomething();\n\
    \        fluent.ThisMethodIsNotFluent();\n\n        // using fluency\n       \
    \ fluent.DoSomething()\n            .DoSomethingElse()\n            .DoSomethingElse()\n\
    \            .DoSomething()\n            .ThisMethodIsNotFluent();\n    }\n\n\
    \    private readonly IFluentInterface fluent;\n}\n```\n\nThis improves readability\
    \ because it avoids repeated references to the instance of the interface. It is\
    \ an increasingly popular way to implement configuration or finite state machines,\
    \ as described in Chapter 10, “Interface segregation.”\n\nFluent interfaces are\
    \ easy to implement, too. All the class has to do is return this from the method.\
    \ Because the class is already an implementation of the interface, by returning\
    \ this, the class returns only the interface portion of itself, thus hiding the\
    \ rest of the implementation. Listing 4-35 shows the definition of the IFluentInterface\
    \ and the implementation used in this example."
  merge: -1
  img_proc: true
- pgno: 172
  md: "# LISTING 4-35 Implementing a simple fluent interface is easy.\n\n```\npublic\
    \ interface IFluentInterface\n{\n    IFluentInterface DoSomething();\n\n    IFluentInterface\
    \ DoSomethingElse();\n\n    void ThisMethodIsNotFluent();\n}\n// . . .\npublic\
    \ class FluentImplementation : IFluentInterface\n{\n    public IFluentInterface\
    \ DoSomething()\n    {\n        return this;\n    }\n\n    public IFluentInterface\
    \ DoSomethingElse()\n    {\n        return this;\n    }\n\n    public void ThisMethodIsNotFluent()\n\
    \    {\n    }\n}\n```\n\nNote that one of the methods of the interface is not\
    \ fluent—it returns void. If a method returns anything but an interface, it is\
    \ not fluent. Any chaining of methods that a client does will be halted by a call\
    \ to a method that is not fluent.\n\n# Conclusion\n\nIn this chapter, you have\
    \ learned what interfaces are and why they are such a key facet of writing adaptive\
    \ code. They are catalysts for polymorphism, which allows you to encapsulate variation\
    \ in families of classes. They are the root around which design patterns grow.\
    \ And yet they actually do nothing.\n\nRemember, interfaces are useless without\
    \ accompanying implementations. But without interfaces, implementations—and their\
    \ associated dependencies—would infiltrate and pollute your code, making it hard\
    \ to maintain and extend. A well-placed interface acts as a firewall between the\
    \ dirty implementation details of service code and a clean, well-organized client.\n\
    \nInterfaces also have other, more-specialized features, such as duck-typing and\
    \ mixins. These are seldom used, but when applied in the right context, they can\
    \ simplify otherwise convoluted code and add an extra dimension of adaptability.\n\
    \nThe groundwork laid in this chapter will be of great importance as you experience\
    \ the ubiquity of the interface throughout the rest of the book."
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Testing


    **After completing this chapter, you will be able to**


    +   - Define different kinds of application testing and choose between techniques.

    +   - Write code in a test-first fashion, focusing on implementing only that which
    the tests demand.

    +   - Understand the different types of testing that can improve aspects of a
    software product.

    +   - Diagnose problems created by testing anti-patterns, which reduce code adaptiveness.


    Software quality is not limited to the quality of the code and how adaptive it
    is to change. It is also a measure of how accurately the software fulfills its
    requirements. Testing is the umbrella of practices that can be used to ensure
    this kind of software quality.


    Unit testing is the discipline of writing code that tests other code. Unit tests
    are source code, thus they can be compiled and executed. As each unit test runs,
    it reports the test''s success or failure with a simple true or false, often a
    green or a red visual indicator. If all of the unit tests pass, the production
    code that they test is considered to be working, meeting its requirements. If
    even a single unit test fails—out of possibly thousands—the production code overall
    is deemed not to be meeting its requirements.


    When you unit test as early as possible in the process—that is, before you write
    any production code—you create a safety net to catch any subsequent errors when
    you change code. If a unit test transitions from a passing state to a failing
    state, you know that the last change you made is responsible for breaking the
    code. The process of writing unit tests and then improving code toward better
    design creates a positive feedback loop whereby the code quality increases while
    you simultaneously make progress with implementing new features.


    # Unit testing


    To some degree, unit testing should be considered a mandatory part of every programmer''s
    daily discipline. An idealized situation is when production code—the code that
    forms the basis of the software product—is entirely the result of the tests that
    were written to verify the application''s behavior. Later in this chapter, you
    will learn how this can be achieved through test-driven development, but bear
    in mind that the aim is to balance the pragmatic with the purist. It is better
    to ship something and accept some'
