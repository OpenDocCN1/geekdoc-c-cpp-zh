    \ : IPredicate\n{\n    public TodayIsAnEvenDayOfTheMonthPredicate(DateTester dateTester)\n\
    \    {\n        this.dateTester = dateTester;\n    }\n\n    public bool Test()\n\
    \    {\n        return dateTester.TodayIsAnEvenDayOfTheMonth;\n    }\n\n    private\
    \ readonly DateTester dateTester;\n}\n```\n```\n\nThe TodayIsAnEvenDayOfTheMonthPredicate\
    \ class converts the original dependent class, DateTester, to that of an IPredicate.\
    \ This is an example of the Adapter pattern that was discussed earlier, in the\
    \ “Refactoring for abstraction” section, and in Chapter 4, “Interfaces and design\
    \ patterns.”\n\n> **Note** The .NET Framework, as of version 2.0, contains a Predicate<T>\
