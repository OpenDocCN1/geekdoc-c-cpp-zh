- pgno: 240
  md: 'However, take note that these patterns and practices, just like all others,
    are merely tools for you to use. Deciding when and where to apply any pattern
    or practice is part of the art of software development. Overuse leads to code
    that is adaptive, but on too fine-grained a level to be appreciated or useful.
    Overuse also affects another key facet of code quality: readability. It is far
    more common for software to be developed in teams than as an individual pursuit.
    Thus, judiciously selecting when and where to apply each pattern, practice, or
    SOLID principle is imperative to ensure that the code remains comprehensible in
    the future.'
