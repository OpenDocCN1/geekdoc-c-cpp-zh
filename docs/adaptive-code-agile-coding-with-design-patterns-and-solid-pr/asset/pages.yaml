- pgno: 317
  md: '# Interface segregation


    **After completing this chapter, you will be able to**


    +   - Understand the importance of interface segregation.

    +   - Write interfaces with the client code''s requirements as a primary concern.

    +   - Create smaller interfaces with more directed purposes.

    +   - Identify scenarios where interface segregation can be used.

    +   - Split interfaces by their implementations'' dependencies.


    The interface, as earlier chapters have established, is a key tool in the modern
    object-oriented programmer''s toolkit. Interfaces represent the boundaries between
    the behavior that client code requires and how that behavior is implemented. The
    interface segregation principle states that interfaces should be *small*.


    All members of an interface must be implemented: properties, events, and methods.
    Unless every client of an interface requires every member, it does not make sense
    to require every implementation to fulfill a large contract. Bearing in mind the
    single responsibility principle and how developers can make liberal use of the
    Decorator pattern, for every member present in an interface, there needs to be
    a valid analogy for the decoration being implemented.


    At their simplest, interfaces contain single methods that serve a single purpose.
    At this level of granularity, they are akin to delegates, but with the added benefits
    enabled by interfaces.


    # A segregation example


    This chapter works through a complete example that progresses from a single monolithic
    interface to multiple smaller interfaces. Along the way, a variety of decorators
    will be created to demonstrate the benefits of smaller interfaces when writing
    SOLID code.


    # A simple CRUD interface


    The interface itself is quite simple, with only five methods. It is used to allow
    clients to interact with persistent storage for an entity through the traditional
    CRUD operations. CRUD stands for *create, read, update, and delete*. These are
    the common operations that clients need to perform to maintain'
  merge: -1
  img_proc: true
- pgno: 318
  md: "persistent storage for an entity. Figure 10-1 shows a UML class diagram explaining\
    \ the operations available to the ICreateReadUpdateDelete interface.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_318_0.png)\n\
    \n**FIGURE 10-1** The initial interface before segregation.\n\nThe read operations\
    \ are split into two methods, one for retrieving a single record from storage\
    \ and another for reading all records. In code, this interface is as shown in\
    \ Listing 10-1.\n\n```\n**LISTING 10-1** A simple interface for CRUD operations\
    \ on an entity.\n\n```csharp\npublic interface ICreateReadUpdateDelete<TEntity>\n\
