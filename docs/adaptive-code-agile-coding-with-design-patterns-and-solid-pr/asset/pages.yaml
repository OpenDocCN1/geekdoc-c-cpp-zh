- pgno: 368
  md: "Instead of retrieving state and then using it as output, you could ask each\
    \ sensor to write to the console itself. But, instead of writing to the console\
    \ directly, it would be a better abstraction to have the sensors write to something\
    \ more extensible and reusable. In this case, you could ask the sensors to write\
    \ their measurement to a Stream. This would allow you to supply a console output\
    \ stream, but you would also be able to supply an HttpResponse.OutputStream, a\
    \ MemoryStream, or a FileStream. However, under these circumstances, you do not\
    \ want the bytes of the sensor’s state to be written; you want a string representation.\
    \ In this case, a TextWriter is a better choice.\n\nIn effect, you are replacing\
    \ a query that requests state and writes it to an output stream with a command\
    \ that writes directly to the output stream. Listing 11-14 shows the IMeasurable\
    \ interface.\n\n# LISTING 11-14 Sensors that can be measured must write their\
    \ state to a TextWriter.\n\n```\npublic interface IMeasurable\n{\n    void WriteMeasurement(TextWriter\
    \ writer);\n}\n```\n\nThe WriteMeasurement method returns void, so it is no longer\
    \ a query, but a command. This can be implemented by all of the sensors, as shown\
    \ in Listing 11-15.\n\n# LISTING 11-15 The command handler for measurement requires\
    \ that a sensor implement IMeasurable.\n\n```\nprivate static void Measure(IEnumerable<string>\
    \ parameters)\n{\n    var measurableSensor = CurrentSensor as IMeasurable;\n \
    \   if (measurableSensor == null)\n    {\n        Console.WriteLine(\"Current\
    \ sensor is not measurable!\");\n        return;\n    }\n\n    measurableSensor.WriteMeasurement(Console.Out);\n\
    }\n```\n\nAs usual, you must cast the current sensor to determine whether it is\
    \ capable of writing its own measurement. If it is, you can pass in the Console.Out\
    \ property to the WriteMeasurement method, because this is a TextWriter. The question\
    \ of whether every sensor should implement IMeasurable is beyond the scope of\
    \ this discussion; it is the kind of choice that depends on the context of the\
    \ specific scenario. Here, the assumption is that some sensors might not be measurable,\
    \ so each implementation can opt in to the IMeasurable interface."
  merge: -1
  img_proc: true
- pgno: 369
  md: '# Further abstraction


    There is still scope for further abstraction here. The dependency of the command
    switchboard on concrete types has been limited, but not removed. For practice,
    you can clone this code sample from the accompanying GitHub repository (www.github.com/AdaptiveCode/AdaptiveCode)
    and try the following exercises:


    +   - Remove all of the dependencies between the command-line client and the concrete
    sensor types.

    +   - Implement the Command pattern (GoF) to represent the switchboard commands
    as ICommand implementations, so that a new command can be represented by implementing
    a new ICommand, without changing the Program class.

    +   - Add more sensors: create the HeatDetection sensor, which cannot move, or
    a ColorSampler.

    +   - Add more capabilities, such as sensor activation and deactivation or sound
    detection.

    +   - Each of the sensors are Input/Output (IO) devices, which means that interaction
    with each of them will result in blocking calls. Convert each of the methods and
    interfaces to asynchronous by using async/await and Task.

    +   - Try using mixins, as described in Chapter 4, to create reusable data implementations
    for each of the sensors. This would avoid the repetition of each sensor storing
    the state associated with each interface. Tip: Because state is involved, extension
    methods will not suffice, and something like Re-motion Re-mix will be required.


    # Conclusion


    Dependency inversion results in code that is less coupled and modules that are
    more cohesive. It instructs programmers to provide abstractions that both high-level
    modules and low-level modules can mutually depend on.


    However, finding the correct abstraction for a given scenario is a skill that
    takes practice. It is not as simple as using an "extract interface" tool, because
    interfaces themselves are not abstractions.


    By applying the dependency inversion principle and designing robust and reusable
    abstractions, you can make your code more maintainable and extensible. When you
    do so, your code is easier to comprehend and does not have needless indirection
    through interfaces that are used only once.'
