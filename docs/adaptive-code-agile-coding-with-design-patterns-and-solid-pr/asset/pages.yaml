- pgno: 302
  md: "When they are configured correctly, the contract preconditions can be rewritten\
    \ to use an alternative version of the `Contract.Requires` method. Listing 9-16\
    \ shows this version.\n\n**LISTING 9-16** This version of the `Requires` method\
    \ accepts the type of the exception to be thrown.\n\n```\npublic class ShippingStrategy\n\
    {\n    public decimal CalculateShippingCost(float packageWeightInKilograms, Size<float>\n\
    \        packageDimensionsInInches, RegionInfo destination)\n    {\n        Contract.Requires<ArgumentOutOfRangeException>(packageWeightInKilograms\
    \ > 0f,\n            \"Package weight must be positive and non-zero\");\n    \
    \    Contract.Requires<ArgumentOutOfRangeException>(packageDimensionsInInches.X\
    \ > 0f &&\n            packageDimensionsInInches.Y > 0f, \"Package dimensions\
    \ must be positive and non-zero\");\n\n        return decimal.MinusOne;\n    }\n\
    }\n```\n\nThis generic version of the `Requires` method accepts the type of exception\
    \ that you would like the contract to throw when the predicate fails. This, along\
    \ with the exception message included in a subsequent method parameter, will cause\
    \ the existing unit tests to pass.\n\n# Postconditions\n\nCode contracts also\
    \ provide a shortcut to defining postconditions. The `Contract` static class contains\
    \ an `Ensures` method that is the postcondition complement to the precondition’s\
    \ `Requires` method. This method also accepts a Boolean predicate that must be\
    \ true to progress through to the return statement. It is worth noting that the\
    \ return statement must be the only line that follows a call to `Contract.Ensures`.\
    \ This makes intuitive sense because, otherwise, it would be possible to further\
    \ modify state in a way that might break the postcondition.\n\nListing 9-17 reiterates\
    \ the `ShippingCostMustBePositive` unit test and includes a rewritten `CalculateShippingCost`\
    \ implementation that uses the `Contract.Ensures` method as a postcondition.\n\
    \n**LISTING 9-17** The `Ensures` method creates a postcondition that should be\
    \ true on exiting the method.\n\n```\n[Test]\npublic void ShippingCostMustBePositive()\n\
    {\n    strategy.CalculateShippingCost(1, ValidSize, null)\n        .Should().BeGreaterThan(decimal.MinusOne);\n\
    }\n// ...\npublic class ShippingStrategy\n{\n    public decimal CalculateShippingCost(float\
    \ packageWeightInKilograms, Size<float>\n```"
  merge: -1
  img_proc: true
- pgno: 303
  md: "```\n```csharp\npackageDimensionsInInches, RegionInfo destination)\n{\n   \
    \ Contract.Ensures(Contract.Result<decimal>() > 0m);\n\n    Contract.Requires<ArgumentOutOfRangeException>(packageWeightInKilograms\
    \ > 0f,\n        \"Package weight must be positive and non-zero\");\n    Contract.Requires<ArgumentOutOfRangeException>(packageDimensionsInInches.X\
    \ > 0f &&\n        packageDimensionsInInches.Y > 0f, \"Package dimensions must\
    \ be positive and nonzero\");\n\n    return decimal.MinValue;\n}\n```\n\n```\n\
    \nThe predicate in this example is a bit different from the ones in prior examples\
    \ and demonstrates a common use of the postcondition: testing that a return value\
    \ is within valid bounds. Checking that the shipping cost is positive requires\
    \ knowledge of the return value. The return value is often, but not always, a\
    \ local variable that is declared and defined within the method. You could assert\
    \ that the value you are returning is greater than zero, but this is not foolproof.\
    \ To access the value that is returned from the method, you can use the `Contract.Result`\
    \ method to retrieve it. This generic method accepts the return type of the method\
    \ and returns whichever result is eventually returned by the method. This is how\
    \ you can ensure that no subsequent lines can replace a valid value with an invalid\
    \ value without the postcondition failing and an exception being thrown.\n\n#\
    \ Data invariants\n\nIt is common for each method in a class to contain its own\
    \ preconditions and postconditions, but data invariants relate to the whole class.\
    \ Code contracts allow you to create a private method on the class that contains\
    \ declarative definitions of the class's invariants. As Listing 9-18 shows, each\
    \ invariant is defined by an assertion involving a private field of the class.\n\
    \n**LISTING 9-18** Data invariants can be protected by a method dedicated to the\
    \ purpose.\n\n```\n```csharp\npublic class ShippingStrategy\n{\n    public ShippingStrategy(decimal\
    \ flatRate)\n    {\n        this.flatRate = flatRate;\n    }\n\n    [ContractInvariantMethod]\n\
    \    private void ClassInvariant()\n    {\n        Contract.Invariant(this.flatRate\
    \ > 0m, \"Flat rate must be positive and non-zero\");\n    }\n\n    protected\
    \ decimal flatRate;\n}\n```\n```"
