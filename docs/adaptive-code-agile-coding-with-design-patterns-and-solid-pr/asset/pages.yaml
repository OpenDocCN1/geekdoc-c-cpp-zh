- pgno: 344
  md: "```\n```csharp\n// . . .\npublic interface IPersistenceCommands\n{\n    void\
    \ Save(Item item);\n\n    void Delete(Item item);\n}\n```\n```\n\nAs shown in\
    \ Listing 10-34, the queries class is the same implementation as before, except\
    \ for the commands—and the dependency on NHibernate—being completely excised.\n\
    \n**LISTING 10-34** The query implementation depends only on MongoDB.\n\n```\n\
    ```csharp\npublic class PersistenceQueries : IPersistenceQueries\n{\n    private\
    \ readonly MongoDatabase mongo;\n\n    public Persistence(MongoDatabase mongo)\n\
