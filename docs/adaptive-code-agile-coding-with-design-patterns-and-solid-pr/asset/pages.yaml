  md: "Listing 6-1 shows the new Account class.\n\n# LISTING 6-1. The new class tracks\
    \ reward points in addition to the account's balance.\n\n```\npublic class Account\n\
    {\n    public Account(AccountType type)\n    {\n        this.type = type;\n  \
    \  }\n\n    public decimal Balance\n    {\n        get;\n        private set;\n\
    \    }\n\n    public int RewardPoints\n    {\n        get;\n        private set;\n\
    \    }\n\n    public void AddTransaction(decimal amount)\n    {\n        RewardPoints\
    \ += CalculateRewardPoints(amount);\n        Balance += amount;\n    }\n\n   \
    \ public int CalculateRewardPoints(decimal amount)\n    {\n        int points;\n\
    \        switch(type)\n        {\n            case AccountType.Silver:\n     \
    \           points = (int)decimal.Floor(amount / 10);\n                break;\n\
    \            case AccountType.Gold:\n                points = (int)decimal.Floor((Balance\
    \ / 10000 ^ 5) + (amount / 5));\n                break;\n            case AccountType.Platinum:\n\
    \                points = (int)decimal.Ceiling((Balance / 10000 * 10) + (amount\
    \ / 2));\n                break;\n            default:\n                points\
    \ = 0;\n                break;\n        }\n        return Math.Max(points, 0);\n\
    \    }\n\n    private readonly AccountType type;\n}\n```"
