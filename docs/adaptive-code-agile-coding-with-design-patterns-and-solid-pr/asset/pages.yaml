- pgno: 152
  md: "Checking for null values indicates that you are placing too much unnecessary\
    \ burden on all of the clients of IRepository. The more clients that use this\
    \ method, the greater the probability of forgetting a null reference check. Instead,\
    \ you should change the source of the problem to perform the check for you, as\
    \ shown in Listing 4-13.\n\n# LISTING 4-13 The service code should implement the\
    \ Null Object pattern.\n\n```\npublic class UserRepository : IUserRepository\n\
    {\n    public UserRepository()\n    {\n        users = new List<User>\n      \
    \  {\n            new User(Guid.NewGuid()),\n            new User(Guid.NewGuid()),\n\
    \            new User(Guid.NewGuid()),\n            new User(Guid.NewGuid())\n\
    \        };\n    }\n\n    public IUser GetByID(Guid userID)\n    {\n        IUser\
    \ userFound = users.SingleOrDefault(user => user.ID == userID);\n        if(userFound\
    \ == null)\n        {\n            userFound = new NullUser();\n        }\n  \
    \      return userFound;\n    }\n\n    private ICollection<User> users;\n}\n```\n\
    \nFirst, this code attempts to retrieve the User from the in-memory collection,\
    \ which is no change from the previous usage shown in Listing 4-12. Now, though,\
    \ you check whether the User instance returned is actually a null reference. If\
    \ it is, you return a special subclass of the IUser type: the NullUser. This subclass\
    \ overrides the IncrementSessionTicket method to do precisely nothing, as shown\
    \ in Listing 4-14. In fact, a proper NullUser implementation overrides all methods\
    \ to do as close to nothing as possible.\n\n# LISTING 4-14 The NullUser method\
    \ implementations all do nothing.\n\n```\npublic class NullUser : IUser\n{\n \
    \   public void IncrementSessionTicket()\n    {\n        // do nothing\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: "Additionally, whenever a method or property of the `NullUser` object is expected\
    \ to return a reference to another object, it should return a special Null Object\
    \ implementation of *those* types, too. In other words, all Null Object implementations\
    \ should return recursive Null Object implementations. This removes the need for\
    \ any null reference checking in clients.\n\nThis also has the added benefit of\
    \ reducing the number of unit tests that you need to write. Previously, when each\
    \ client had to implement the check, there would also be concomitant unit tests\
    \ to confirm that the check was in place. Instead, the repository implementation\
    \ is unit tested to ensure that it returns the `NullUser` implementation.\n\n\
    > ### Cascading nulls\n> \n> C# 6 introduced a *cascading nulls operator*, also\
    \ called the *null-conditional operator* and the *safe navigation operator*. This\
    \ allows the following code snippet to be simplified from this:\n> \n> ```csharp\n\
    > if(person != null && person.Details != null && person.Detail.Age > 30)\n> {\n\
    >     // . . .\n> }\n> ```\n> \n> To this:\n> \n> ```csharp\n> if(person?.Details?.Age\
    \ > 30)\n> {\n>     // . . .\n> }\n> ```\n\nThe `?.` operator thus becomes a way\
    \ of safely dereferencing any object and, at worst, being handed a default(T)\
    \ of the property type. This has proven to be a useful addition to the language,\
    \ but I am reluctant to use this as an alternative to a proper Null Object implementation,\
    \ for a couple of reasons.\n\nFirst, there are too many instances in which a default\
    \ value of a type is simply not going to suffice. The previous example of using\
    \ a sensible user name to avoid throwing a NullReferenceException illustrates\
    \ that the alternative is not a default value but something more meaningful to\
    \ the application.\n\nSecond, the null coalescing requires all clients of the\
    \ code to be programmed with the possibility of null in mind. Part of the reason\
    \ to use the Null Object pattern is to obviate null checking and give you the\
    \ freedom to dereference with impunity. If you reject the Null Object pattern\
    \ in favor of the Cascading Nulls syntax, you open yourself up to forgetting to\
    \ dereference again.\n\nGiven a proper Null Object implementation, this example\
    \ could be written succinctly as shown here.\n\n```\n```csharp\nif(person.Details.Age\
    \ > 30)\n{\n    // . . .\n}\n```\n```\n\nThis, surely, offers the most benefit:\
    \ client code that is less obfuscated but that is safe from the perils of a NullReferenceException."
  merge: -1
  img_proc: true
- pgno: 154
  md: "# The IsNull property anti-pattern\n\nSometimes the Null Object pattern involves\
    \ adding a Boolean IsNull property to the interface. All real implementations\
    \ of this interface return the value false for this property. The Null Object\
    \ implementation of the interface returns true. Listing 4-15 shows how this might\
    \ work, given the previous example.\n\n**LISTING 4-15** The IsNull property is\
    \ true only for Null Object implementations.\n\n```\npublic interface IUser\n\
    {\n    void IncrementSessionTicket();\n\n    bool IsNull\n    {\n        get;\n\
    \    }\n}\n// . . .\npublic class User : IUser\n{\n    // . . .\n    public bool\
    \ IsNull\n    {\n        get\n        {\n            return false;\n        }\n\
    \    }\n\n    private DateTime sessionExpiry;\n}\n// . . .\npublic class NullUser\
    \ : IUser\n{\n    public void IncrementSessionTicket()\n    {\n        // do nothing\n\
    \    }\n\n    public bool IsNull\n    {\n        get\n        {\n            return\
    \ true;\n        }\n    }\n}\n```\n\nThe problem with this property is that it\
    \ causes logic to spill out of the objects whose purpose is to encapsulate behavior.\
    \ For example, if statements will start to creep into client code to differentiate"
  merge: -1
