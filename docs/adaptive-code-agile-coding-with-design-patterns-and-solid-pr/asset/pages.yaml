- pgno: 61
  md: '# Sprint retrospective


    When the sprint demo is complete, it is time to take stock of the iteration and
    gauge opinions about its overall success. For some team members, the sprint might
    have been a resounding success, whereas for others, it might have been an absolute
    disaster. The sprint retrospective can help you to distill the elements that went
    well into actions that bear repeating and to isolate problems so that they can
    be dealt with. The output from the sprint retrospective should not be written
    once and forever forgotten. It should be referred to at the end of the next sprint
    to ensure that requisite changes were made and that mistakes were not repeated.


    The following questions should be asked of the team during the retrospective:


    +   - What went well?

    +   - What went badly?

    +   - What do we need to start doing?

    +   - What do we need to stop doing?

    +   - What do we need to continue doing?

    +   - Did we experience any surprises during the sprint?


    Starting with the positive, ask each team member to elaborate on what they felt
    went well about the sprint. Perhaps they were very happy with the progress that
    was made, or with the quality of the work that was produced.


    Next, ask them to explain what went badly in the sprint. Perhaps some tasks were
    more difficult and involved than first anticipated, thus causing an otherwise
    simple story to be delayed. Whatever the problem, it is certain that some kind
    of resolution can be found. There is nothing wrong with candidness, as long as
    it is accompanied by objectivity. No one should be accusatory against other team
    members, and all criticism should be given constructively and received gracefully.
    The goal is an improvement of the process and the product, not blame.


    It could be that there are certain things that the team does not currently do
    that should be introduced to the process. Perhaps there are not yet any formal
    unit tests to accompany the code, and the team believes that this should be introduced
    at this stage. As with all suggestions, the Scrum master should be actively taking
    notes to take action later.


    Equally, there could be things that the team is doing that they feel should be
    stopped. Prime examples are to stop unplanned digressions in meetings and to stop
    moving stories into the In Progress lane when there is plenty of work already
    there. This latter problem is quite common and can be solved by putting capacity
    limits on certain swimlanes. By enforcing that no more than three stories can
    be in progress at a time, team members are encouraged to help finish work that
    has already begun rather than start something afresh.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Some things that went well will yield actions that bear repeating. If the sprint
    demo went well and it was decided that this was due to good preparation beforehand,
    make a note to continue to do this. It is quite surprising how quickly good habits
    can be forgotten and bad habits can take their place.


    Finally, the team should recall any surprises—good or bad—that were revealed during
    the sprint. Any bad surprise should result in an action item to avoid such an
    occurrence in the future, whereas a good surprise could result in behavior that
    bears repeating.


    At least one action item from the retrospective should be prioritized for the
    next sprint. The outcomes of this meeting should not be forgotten; they should
    be acted on.


    # Story point triangulation


    Some of the stories during the sprint might have required more or less effort
    than was estimated by the team during the sprint planning meeting. Taking 5 or
    10 minutes at the end of the sprint retrospective to triangulate the estimated
    stories with the actual effort expended can be rewarding.


    After a couple of sprints, there will be statistics available for how long each
    story actually took in comparison to its story point estimate. For example, you
    might have a table similar to Table 1-1.


    TABLE 1-1 Statistics for the average, minimum, and maximum actual effort compared
    to user story estimates on a hypothetical project.


    | Story points | Average actual effort (hours) | Minimum actual effort (hours)
    | Maximum actual effort (hours) |

    |---|---|---|---|

    | 1 | 5.5 | 1 | 19 |

    | 2 | 9.5 | 2 | 23 |

    | 3 | 17 | 7.5 | 40 |

    | 5 | 36 | 20 | 76 |

    | 8 | 56 | 40 | 86 |

    | 13 | 88 | 68 | 154 |


    If a one-point story for a sprint actually took 60 hours to complete, it was probably
    closer to an eight-point story. As long as there are no mitigating circumstances—such
    as a lack of developer resources because of absence—the estimate can be safely
    deemed to have been erroneous. If you claim the eight story points instead, your
    velocity will not suffer as a result, and the amount of stories that the team
    can commit to does not decrease.


    Focus on the stories that are significantly out of range. If a one-point story
    fits into the range for a two-point or three-point story, it is unlikely to make
    a significant difference to take more points.


    # Scrum calendar


    For clarity, a calendar showing the typical Scrum meetings over the course of
    a sprint is shown in Table 1-2.


    Observe that almost a whole day is dedicated to the end of a sprint and the beginning
    of a new sprint. This is called Sprint Handover Day and, to maintain concentration
    levels, it is sometimes split'
  merge: -1
