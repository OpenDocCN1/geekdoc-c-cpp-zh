- pgno: 352
  md: 'There are two problems caused by this anti-pattern. The first issue is that
    of programmer discipline. You need the interfaces in each of the packages—Services,
    Domain, and NHibernate—to be marked as public. However, you also need the concrete
    classes—the implementations—to be marked as public to make them available for
    construction at some point (just not inside the client classes). This means that
    there is nothing to stop an undisciplined or unaware developer from making a direct
    reference to the implementation. There is a temptation to cut corners and just
    call new on the class to get an instance of it.


    Second, what happens if you create a new implementation of the SecurityService
    that, instead of depending on a domain model that is persisted by using NHibernate,
    uses a third-party service bus, such as NServiceBus, to send a command message
    to a handler? Adding it into the Services assembly creates yet another dependency,
    leading to a bloated, fragile codebase that will be very difficult to adapt to
    new requirements.


    It is a general rule that implementations should be split from their interfaces
    by placing them in separate assemblies. For this, you can use the Stairway pattern.


    # The Stairway pattern


    The Stairway pattern is the correct way to organize your classes and interfaces.
    By putting interfaces and their implementations in different assemblies, you can
    vary the two independently, and clients only need to make a single reference—to
    the interface assembly.


    You might be thinking, “But how many assemblies am I going to need to keep track
    of? If I split every interface and class into its own assembly, I would have a
    solution with 200 projects!” Fear not, because applying the Stairway pattern should
    only increase the number of projects by a few while giving you the benefit of
    a well-organized and easy-to-understand solution. It is possible that the number
    of overall projects will decrease when you apply the Stairway pattern, if the
    projects were particularly badly arranged before.


    The running example of the AccountController, refactored to use the Stairway pattern,
    is shown in Figure 11-3. Each implementation—that is, each class—only references
    the assembly that contains the interface on which it is dependent. It does not
    reference the implementation assembly, not even implicitly. Each implementation
    class also references its interface’s assembly. This really is the best of all
    worlds: interfaces without any dependencies, client code without any implicit
    dependencies, and implementations that continue the pattern by depending only
    on other interface assemblies.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_353_0.png)


    # FIGURE 11-3 The Stairway pattern is aptly named.


    I now want to focus on one of those benefits in greater detail: interfaces should
    not have any external dependencies. As far as possible, this should always be
    adhered to. Interfaces should not have methods or properties that expose any data
    objects or classes defined in third-party references. Although they can, and certainly
    will, need to depend on classes and data types from other projects in the solution
    and common .NET Framework libraries, a reference to infrastructural entities should
    be avoided. Third-party libraries are commonly used for infrastructure purposes.
    Even the interfaces from libraries such as Log4Net, NHibernate, and MongoDB are
    infrastructural dependencies that will tie your interfaces to a specific implementation.
    This is because those libraries are packaged by using the Entourage anti-pattern,
    rather than the Stairway pattern. They each provide a single assembly that contains
    both the interface you want to depend on and the implementation that you do not
    want to depend on.'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'To get around this problem, you can refer instead to your own interfaces for
    logging, domain persistence, and document storage. You can write a simple interface
    that hides the third-party dependency behind a first-party dependency. Then, if
    you ever need to replace the third-party dependency, you can do so by writing
    a new adapter to your interface for the new library.


    On a pragmatic level, this might not be entirely feasible. In instances where
    converting a third-party dependency to a first-party dependency presents an inordinate
    amount of work, the team must acknowledge that they will have to retain the dependency
    and it will become omnipresent. If the library is outgrown, it will be more difficult
    and time-consuming to replace. This sort of concession is commonly made for frameworks,
    which are much larger than simple libraries.


    # An example of abstraction design


    The modern world—with all of its conveniences, time-savers, cost-cutters, and
    labor-reducers—is built on abstractions.


    Multiple layers of detail are removed from view, not to be worried about until
    absolutely necessary—typically, when a problem arises. Even something as simple
    as a retractable pen reduces a sophisticated mechanism of spring tension and precision
    cam motion to a mere click of a button. In the normal course of using a retractable
    pen, you do not need to worry about how this mechanism works. What you see is
    the abstraction of that complexity: a push button and its current state. Either
    the ballpoint is retracted or the ballpoint is revealed. That is, you do not need
    to know about the inner workings unless you take apart your pen and cannot put
    it back together again!


    Similarly, all of computing is built on abstraction. Computers are a multiplicity
    of abstractions, all working in harmony to present you with some consistent interfaces
    like the application windows on your monitor screen and the keyboard, mouse, or
    touchscreen for interactive input. A network is a simple abstraction in that we
    talk of ports, IP addresses, and DNS resolution; but that is just the surface.
    That is what you see and interact with given your requirements and level of expertise.
    A more modal user might think only in website URLs and email addresses. A network
    technician must consider more detailed implementation concerns like gateways,
    routing tables, subnet masks, and transport protocols.


    It’s all a complex fractal that is best reasoned about with a certain useful level
    of abstraction.


    Software development is the same. When you write code, you feed binary instructions
    to a CPU so that it does your bidding. But that low level of abstraction does
    not provide you with the requisite tools to achieve your lofty goals. Instead,
    layers and layers of abstraction have been added to spare you from the minutiae.
    In C#, you don’t even worry about memory management. Perhaps not as much as you
    should, but certainly not as much as your C++ colleagues must. Even in C++, there
    are libraries that abstract the management of memory references so that developers
    need worry less about the details and more about productivity.


    Hopefully, you get the idea that abstraction is useful. This section presents
    an example that demonstrates a poor abstraction and the steps taken to improve
    it.'
