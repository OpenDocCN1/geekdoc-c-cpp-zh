  md: "# Explicit implementation\n\nInterfaces can also be implemented *explicitly*.\
    \ Explicit interface implementation differs from implicit interface implementation,\
    \ which is what was shown in the previous examples. Listing 4-3 shows the same\
    \ example class from before, but this time it implements its interface explicitly.\n\
    \n**LISTING 4-3** Implementing an interface explicitly.\n\n```\npublic class ExplicitInterfaceImplementation\
    \ : ISimpleInterface\n{\n    public ExplicitInterfaceImplementation()\n    {\n\
    \        this.encapsulatedInteger = 4;\n    }\n\n    void ISimpleInterface.ThisMethodRequiresImplementation()\n\
    \    {\n        encapsulatedEvent(this, EventArgs.Empty);\n    }\n\n    string\
    \ ISimpleInterface.ThisStringPropertyNeedsImplementingToo\n    {\n        get;\n\
    \        set;\n    }\n\n    int ISimpleInterface.ThisIntegerPropertyOnlyNeedsAGetter\n\
    \    {\n        get\n        {\n            return encapsulatedInteger;\n    \
    \    }\n    }\n\n    event EventHandler<EventArgs> ISimpleInterface.InterfacesCanContainEventsToo\n\
    \    {\n        add { encapsulatedEvent += value; }\n        remove { encapsulatedEvent\
    \ -= value; }\n    }\n\n    private int encapsulatedInteger;\n    private event\
    \ EventHandler<EventArgs> encapsulatedEvent;\n}\n```\n\nTo use an explicitly implemented\
    \ interface, clients must have a reference to an instance of the interface—a reference\
    \ to an implementation of the interface will not suffice. Listing 4-4 explores\
    \ this in further detail."
