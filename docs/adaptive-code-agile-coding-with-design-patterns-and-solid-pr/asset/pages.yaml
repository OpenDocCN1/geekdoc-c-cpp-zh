- pgno: 322
  md: "The DeleteConfirmation<TEntity> class decorates only the Delete method, as\
    \ its name suggests. The other methods are implemented with pass-through delegation\
    \ to the wrapped interface. Pass-through means that there is no decoration for\
    \ that method: the call is merely passed through the decorator to the underlying\
    \ implementation, almost as if it had been called directly. Despite these pass-through\
    \ methods apparently doing nothing special, to maintain unit test coverage and\
    \ ensure that they are delegating properly, test methods should still be written\
    \ to verify that their behavior is correct. This is laborious when compared to\
    \ the alternative: interface segregation.\n\nBy separating the Delete method from\
    \ the rest of the ICreateReadUpdateDelete<TEntity> interface, you have two interfaces.\
    \ This is the interface segregation principle in practice. The code for this is\
    \ shown in Listing 10-4.\n\n# LISTING 10-4 The ICreateReadUpdateDelete interface\
    \ is split in two.\n\n```\npublic interface ICreateReadUpdate<TEntity>\n{\n  \
    \  void Create(TEntity entity);\n\n    TEntity ReadOne(Guid identity);\n\n   \
    \ IEnumerable<TEntity> ReadAll();\n\n    void Update(TEntity entity);\n}\n// ...\n\
    public interface IDelete<TEntity>\n{\n    void Delete(TEntity entity);\n}\n```\n\
    \nThis allows the confirmation decorator to be replaced with an implementation\
    \ only for the IDelete<TEntity> interface, as shown in Listing 10-5.\n\n# LISTING\
    \ 10-5 The confirmation decorator is applied only to the interface to which it\
    \ pertains.\n\n```\npublic class DeleteConfirmation<TEntity> : IDelete<TEntity>\n\
    {\n    private readonly IDelete<TEntity> decoratedDelete;\n\n    public DeleteConfirmation(IDelete<TEntity>\
    \ decoratedDelete)\n    {\n        this.decoratedDelete = decoratedDelete;\n \
    \   }\n\n    public void Delete(TEntity entity)\n    {\n        Console.WriteLine(\"\
    Are you sure you want to delete the entity? [Y/N]\");\n        var keyInfo = Console.ReadKey();\n\
    \        if (keyInfo.Key == ConsoleKey.Y)\n```"
