- pgno: 277
  md: '+   2. The source code is *modified* so that the unit test passes. The bug
    fix exception to the OCP becomes necessary at this juncture because, without it,
    you would not be able to modify any existing code. Editing the system under test
    allows you to transition the failing test from red to green—from failure to success.
    When you ensure that no other tests are failing as a side effect, the bug is fixed.


    # Client awareness


    A more permissive exception to the “closed for modification” rule is that any
    change to existing code is allowed as long as it does not also require a change
    to any client of that code. This places an emphasis on how coupled the software
    modules are, at all levels of granularity: between classes and classes, assemblies
    and assemblies, and subsystems and subsystems.


    If a change in one class forces a change in another, the two are said to be *tightly*
    coupled. Conversely, if a class can change in isolation without forcing other
    classes to change, the participating classes are *loosely* coupled. At all times
    and at all levels, loose coupling is preferable. Maintaining loose coupling limits
    the impact that the OCP has if you allow modifications to existing code that do
    not force further changes to clients.


    # Extension points


    Now that the “closed for modification” rule of the OCP is clarified, the “open
    for extension” rule can be considered. Classes that honor the OCP should be open
    to extension by containing defined extension points where future functionality
    can hook into the existing code and provide new behaviors.


    Some options for different kinds of extension points are detailed in this section,
    with their pros and cons explored. These examples continue the TradeProcessor
    example of the previous chapters, this time from the point of view of the client
    interacting with the class.


    # Code without extension points


    First, what does code look like when it has no extension points? Figure 8-1 shows
    what happens when a class that has no extension points needs new functionality.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_277_0.png)


    **FIGURE 8-1** When there are no extension points, clients are forced to change.'
