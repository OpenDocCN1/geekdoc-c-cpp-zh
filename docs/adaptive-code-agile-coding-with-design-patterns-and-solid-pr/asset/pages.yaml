  md: "```\n```csharp\n{\n    var restClient = new HttpClient();\n    var postRequest\
    \ = await restClient.PostAsync(uri,\n        new StringContent(\"Data to send\
    \ to the server\"));\n\n    var responseContent = await postRequest.Content.ReadAsStringAsync();\n\
    \    Console.WriteLine(responseContent);\n}\n```\n```\n\nJust to emphasize the\
    \ point that multiple clients can be written with equally low dependency requirements,\
    \ Listing 3-20 shows a Windows PowerShell 3 script for accessing the GET and POST\
    \ methods of the service.\n\n**LISTING 3-20** Accessing the REST service from\
    \ Windows PowerShell 3 is extremely trivial.\n\n```\n```powershell\n$request =\
    \ [System.Net.WebRequest]::Create(\"http://localhost:7617/api/values\")\n$request.Method\
    \ = \"GET\"\n$request.ContentLength = 0\n\n$response = $request.GetResponse()\n\
    $reader = New-Object System.IO.StreamReader($response.GetResponseStream())\n$responseContent\
    \ = $reader.ReadToEnd()\nWrite-Host $responseContent\n```\n```\n\nThis code uses\
    \ the WebRequest object from the .NET Framework to call the RESTful service. This\
    \ class is the superclass of the HttpRequest class. The Create method is a factory\
    \ method that returns an HttpRequest instance because an http:// URI was provided.\n\
    \n# Dependency management with NuGet\n\nDependency management can be greatly simplified\
    \ with the use of dependency management tools. Such tools are responsible for\
    \ following dependency chains to ensure that all dependent artifacts are available.\
    \ They also manage the versioning of dependencies: you can specify that you want\
    \ to depend only on specific versions of dependencies, and the dependency management\
    \ tools do the rest.\n\nNuGet is a package management utility for the .NET Framework.\
    \ NuGet refers to a dependency as a *package*, but the tool is not limited to\
    \ assemblies. NuGet packages can also include configuration, scripts, and images—almost\
    \ anything you need. One of the most compelling reasons to use a package manager\
    \ such as NuGet is that it has knowledge of a package’s dependencies and will\
    \ bring the entire dependency chain with it when a project references a package.\n\
    \nAs of Visual Studio 2013, NuGet is fully integrated as the default package management\
    \ utility."
