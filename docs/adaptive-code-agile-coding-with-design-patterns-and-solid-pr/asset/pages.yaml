- pgno: 332
  md: "```\npublic void CreateEntity(TEntity entity)\n{\n    saver.Save(entity);\n\
    }\n\npublic TEntity GetSingleEntity(Guid identity)\n{\n    return reader.ReadOne(identity);\n\
    }\n\npublic void UpdateEntity(TEntity entity)\n{\n    saver.Save(entity);\n}\n\
    \npublic void DeleteEntity(TEntity entity)\n{\n    deleter.Delete(entity);\n}\n\
    ```\n\nThere is little difference between this version of the controller and the\
    \ prior one, but the impact on the amount of code that you might have to write\
    \ could be significant. This controller can be instantiated to operate on any\
    \ entity, and the service interfaces that are required are all forced to agree\
    \ on the same operation. No longer can you supply different types for each one—such\
    \ as ISave<Customer>, IRead<Order>, IDelete<LineItem>.\n\nEither version of the\
    \ controller can be created in much the same way. Listing 10-17 shows how you\
    \ must instantiate each class that implements the required interfaces before passing\
    \ them in to the controller's constructor.\n\n# LISTING 10-17 Creating the OrderController\
    \ with separate instances of the dependencies.\n\n```\nstatic OrderController\
    \ CreateSeparateServices()\n{\n    var reader = new Reader<Order>();\n    var\
    \ saver = new Saver<Order>();\n    var deleter = new Deleter<Order>();\n\n   \
    \ return new OrderController(reader, saver, deleter);\n}\n```"
