  md: "The net benefit of creating an adapter class such as Log4NetLoggerAdapter is\
    \ that you can convert a third-party reference into a first-party reference. Notice\
    \ that both AdoNetTradeStorage and SimpleTradeValidator both depend on the first-party\
    \ ILogger interface. But, at run time, both will actually use Log4Net. The only\
    \ references needed for Log4Net are in the entry point of the application (see\
    \ Chapter 12, “Dependency injection,” for more information) and the newly created\
    \ Service.Log4Net assembly. Any code that has a dependency on Log4Net, such as\
    \ custom appenders, should live in the Service.Log4Net assembly. For now, only\
    \ the adapter resides in this new assembly.\n\n> Tip It is not always necessary\
    \ to convert third-party dependencies into first-party dependencies in this way.\
    \ For cross-cutting concerns like logging, depending on the circumstances, it\
    \ might be preferable to depend directly and ubiquitously on the third-party library\
    \ throughout the codebase.\n\nThe refactored validator class is shown in Listing\
    \ 7-12. It now has no reference whatsoever to the console. Because of the flexibility\
    \ of Log4Net, you can actually log to almost anywhere now. Total adaptability\
