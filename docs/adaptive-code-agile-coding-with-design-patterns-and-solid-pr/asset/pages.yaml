- pgno: 386
  md: "The entry point is now simpler than it was before, and the IoC registration\
    \ has been moved to a dedicated class. Listing 12-10 shows this class for the\
    \ Task List application. When the application exits, it calls the Release method,\
    \ which you can hook into by registering a handler to the appropriate Application\
    \ event.\n\n# LISTING 12-10 The configuration class has methods for all three\
    \ phases of the Register, Resolve, Release pattern.\n\n```\npublic class IocConfiguration\n\
    {\n    private readonly IUnityContainer container;\n    public IocConfiguration()\n\
    \    {\n        container = new UnityContainer();\n    }\n    public void Register()\n\
    \    {\n        container.RegisterType<ISettings, ApplicationSettings>();\n  \
    \      container.RegisterType<IObjectMapper, MapperAutoMapper>();\n        container.RegisterType<ITaskService,\
    \ TaskServiceAdo>();\n        container.RegisterType<TaskListController>();\n\
    \        container.RegisterType<TaskListView>();\n    }\n    public Window Resolve()\n\
    \    {\n        return container.Resolve<TaskListView>();\n    }\n    public void\
    \ Release()\n    {\n        container.Dispose();\n    }\n}\n```\n\nThe Register\
    \ method contains exactly the same code as before. As this method grows, however,\
    \ it can be refactored into multiple methods and generally kept neater than it\
    \ otherwise might be if it was contained in the application entry point.\n\nThe\
    \ Resolve method returns a generic Window, which is a common resolution root for\
    \ a WPF application. Specifically, the TaskListView is returned because it is\
    \ the main window for your application. In other application types, such as ASP.NET\
    \ MVC, there are often multiple resolution roots—one for each controller. The\
    \ organization of the composition root for MVC and other applications is discussed\
    \ later in this chapter.\n\n# Imperative vs. declarative registration\n\nThe registration\
    \ code to this point has been written imperatively, with procedural calls to methods\
    \ on a container object. This gives you some advantages: it is easy to read, it\
    \ is relatively succinct, and it provides a minimum of compile-time checking,\
    \ such as"
  merge: -1
  img_proc: true
- pgno: 387
  md: "protection against typographical errors. One disadvantage is that you are tying\
    \ yourself to an implementation at compile time. If you want to swap out one of\
    \ your implementations for an alternative, this requires a recompilation of the\
    \ code.\n\nIf, instead, you use declarative registration via XML, you can skip\
    \ the recompile by moving the decision to configuration. Listing 12-11 shows Unity’s\
    \ support for XML registration.\n\n# **LISTING 12-11** A section in the application\
    \ configuration file can describe how interfaces should map to implementations.\n\
    \n```\n```xml\n<configuration>\n  <configSections>\n    <section name=\"unity\"\
    \n             type=\"Microsoft.Practices.Unity.Configuration.UnityConfigurationSection,\n\
    Microsoft.Practices.Unity.Configuration\" />\n  </configSections>\n  <appSettings>\n\
    \    <add key=\"TaskDatabaseConnectionString\" value=\"Data Source=(local);Initial\n\
    Catalog=TaskDatabase;Integrated Security=True;Application Name=Task List Editor\"\
    \ />\n  </appSettings>\n  <unity xmlns=\"http://schemas.microsoft.com/practices/2010/unity\"\
    >\n    <typeAliases>\n      <typeAlias alias=\"ISettings\" type=\"ServiceInterfaces.ISettings,\
    \ ServiceInterfaces\" />\n      <typeAlias alias=\"ApplicationSettings\" type=\"\
    UI.ApplicationSettings, UI\" />\n      <typeAlias alias=\"IObjectMapper\" type=\"\
    ServiceInterfaces.IObjectMapper,\nServiceInterfaces\" />\n      <typeAlias alias=\"\
    MapperAutoMapper\" type=\"UI.MapperAutoMapper, UI\" />\n      <typeAlias alias=\"\
    ITaskService\" type=\"ServiceInterfaces.ITaskService,\nServiceInterfaces\" />\n\
    \      <typeAlias alias=\"TaskServiceAdo\" type=\"ServiceImplementations.TaskServiceAdo,\n\
    ServiceImplementations\" />\n      <typeAlias alias=\"TaskListController\" type=\"\
    Controllers.TaskListController,\nControllers\" />\n      <typeAlias alias=\"TaskListView\"\
    \ type=\"UI.TaskListView, UI\" />\n    </typeAliases>\n    <container>\n     \
    \ <register type=\"ISettings\" mapTo=\"ApplicationSettings\" />\n      <register\
    \ type=\"IObjectMapper\" mapTo=\"MapperAutoMapper\" />\n      <register type=\"\
    ITaskService\" mapTo=\"TaskServiceAdo\" />\n    </container>\n  </unity>\n  <startup>\n\
    \    <supportedRuntime version=\"v4.0\" sku=\".NETFramework,Version=v4.5\" />\n\
    \  </startup>\n</configuration>\n```\n```\n\nThis XML is the content of the application\
    \ configuration file for the WPF Task List. Adding a configuration section for\
    \ Unity enables the typeAlias and container elements. The former is used to alias\
    \ shorter names for longer types, which need to be specified by their assembly-qualified\
    \ names so that Unity can find them at run time. After the types have been aliased,\
    \ the latter section performs the same job as the Register method: mapping an\
    \ interface to an implementation."
