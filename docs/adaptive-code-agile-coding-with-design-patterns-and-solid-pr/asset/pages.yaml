- pgno: 207
  md: 'perhaps constantly changing. Without becoming a domain expert in the field,
    you need a design tool that will guide you through the process of capturing labyrinthine
    requirements in working, verified code. TDD, as defined here, fits the bill perfectly.


    > **Tip**  A *code kata* is a practice or training exercise for learning a new
    language, technique, or skill. The term *kata* originally referred to an individual
    training exercise for martial arts such as karate. Some code katas can be found
    at *http://www.codekatas.org*.


    # Test-first development


    TFD overlaps TDD in some key areas. Tests are obviously written first. The red,
    green, refactor process is adhered to. But TFD is not a design exercise. The design
    has already been formed or is forming elsewhere: in the developer’s head.


    Class, responsibility, and collaboration (CRC) sessions can be used to generate
    a design for a component. After the existence of classes and methods—and the interactions
    between them—have been determined, there isn’t a lot left but to fill in the blanks.
    By the time you come to write the unit tests and make the pass with production
    code, you are already familiar with your design.


    Even without an explicit design session such as CRC, it is possible to think of
    a design without proving it is necessary with unit tests. In fact, it is possible
    to consider many different designs and to implicitly trade them off against each
    other before deciding to implement them. This could take the form of a pair-programming
    session, when a lot of discussion takes place about the relative merits of naming
    conventions, method implementation, and other issues.


    The grey area where TDD and TFD diverge is whether, when the tests are written,
    the developer focuses strictly on implementing just enough to make the test pass.
    For example, if a class or method is created as part of the process of turning
    a red test green, this is contrary to the rules of TDD. Classes and methods are
    design constructs that should only occur as a grouping mechanism for related functionality.
    This is part of the refactor phase of unit testing.


    To this point, no color is added to this discussion to differentiate either TDD
    or TFD as being objectively better or worse. The trade-off appears to be this:
    Fewer developers have enough experience with TDD, or design in general, to consistently
    find success with this method. But TFD has the tendency to generate overwrought
    designs that are littered with mechanical decision-making. TDD is misunderstood;
    TFD is understood. TDD produces just enough design; TFD produces whatever design
    is in the developer’s head.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_207_0.png)'
