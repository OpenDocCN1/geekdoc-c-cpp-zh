- pgno: 423
  md: '# Static vs. dynamic connascence


    The first five levels of connascence are distinguished as *static connascence*,
    and the remaining four levels are termed *dynamic connascence*. This distinction
    indicates that connascence of name, type, meaning, algorithm, and position can
    be identified by reading the code, whereas connascence of execution order, timing,
    value, and identity indicate strong runtime coupling of code. All static connascences
    are weaker than dynamic connascences, because they are easier to identify and
    easier to remove or improve.


    # Conclusion


    No matter what frameworks for delivery are put in place—whether Agile or waterfall—any
    problem that is to be solved with software involves the writing and maintenance
    of source code. Even after the decision of programming paradigm (object-oriented,
    functional, procedural, or declarative, for instance) is removed, and a specific
    language and ecosystem have been chosen, there are myriad different ways of implementing
    features.


    By following a test-first approach and writing the simplest code that could possibly
    suffice for each failing test, you avoid introducing unnecessary complexity. Your
    solution should never be more complicated than the problem it solves. Only as
    an extra step—with the safety net of green, passing tests—should you improve the
    design of your solution through refactoring.


    A good design is always one that exhibits low coupling between methods, classes,
    and modules, and in which the methods, classes, and modules are highly cohesive.'
  merge: -1
  img_proc: true
