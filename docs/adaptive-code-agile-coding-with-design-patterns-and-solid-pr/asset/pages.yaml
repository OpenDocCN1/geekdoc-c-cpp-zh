- pgno: 126
  md: '# Consuming packages


    NuGet adds some new commands to the shortcut menu in the Solution Explorer window
    of Visual Studio. From there, you can open the NuGet package management window
    and add a reference to a dependency.


    For this example, I''m going to add a dependency to RiakClient, the .NET Framework
    client driver for the Riak NoSql key/value store. Figure 3-14 shows the NuGet
    package management window.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_126_0.png)


    FIGURE 3-14 NuGet packages have a lot of useful metadata associated with them.


    Whenever a package is selected in the list, the information pane on the right
    shows some metadata about the package. This includes its unique name in the gallery,
    the author or authors of the package, the version of the package, the date it
    was last published, a description of the package, and any dependencies that it
    has. The dependencies are very interesting, because they show what else is going
    to be installed as a result of referencing this package, in addition to the required
    or supported versions of the dependencies. RiakClient, for example, requires at
    least version 9.0.1 of Newtonsoft.Json, the popular .NET Framework JSON/class
    serializer, and at least version 2.0.0.668 of protobuf-net. Both of these packages
    could have dependencies of their own.


    When you choose to install this package, NuGet will first try to download all
    the files and place them in a packages/ folder under the solution''s root folder.
    This allows you to put this entire directory into source control, exactly as you
    did earlier with a dependencies/ folder. NuGet then references the downloaded
    assemblies in the project where you want to use this library. Figure 3-15 shows
    the references for the project after RiakClient is added.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "![](img/f852e0a12c174e64d91a8e1a05146eab_127_0.png)\n\n# FIGURE 3-15 The target\
    \ package and all of its dependencies are referenced by the project.\n\nIn addition\
    \ to making the references, NuGet also creates a packages.config file that contains\
    \ information about which packages—and which versions—are referenced by the project.\
    \ This is useful when it comes to upgrading or uninstalling packages, which is\
    \ also something that NuGet is able to do.\n\nRiak also needs some default configuration\
    \ before it is ready to be used. So not only has NuGet downloaded and referenced\
    \ a lot of assemblies, it has also edited your app.config to include some sensible\
    \ default values for required settings that Riak needs. Listing 3-21 shows the\
    \ current state of the app.config after RiakClient is installed.\n\n# LISTING\
    \ 3-21 NuGet has added a new configSection to the app.config specifically for\
    \ RiakClient.\n\n```\n<configuration>\n  <configSections>\n    <section name=\"\
    riakConfig\" type=\"RiakClient.Config.RiakClusterConfiguration, RiakClient\" />\n\
    \  </configSections>\n  <startup>\n    <supportedRuntime version=\"v4.0\" sku=\"\
    .NETFramework,Version=v4.6.2\" />\n  </startup>\n```"
