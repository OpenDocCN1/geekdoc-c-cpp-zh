- pgno: 239
  md: '# PART III


    # SOLID code


    CHAPTER 7 The single responsibility principle ................. 215


    CHAPTER 8 The open/closed principle ................. 249


    CHAPTER 9 The Liskov substitution principle ................. 259


    CHAPTER 10 Interface segregation ................. 291


    CHAPTER 11 Dependency inversion ................. 323


    SOLID is the acronym for a set of practices that, when implemented together, make
    code adaptive to change. The SOLID practices were introduced by Bob Martin almost
    15 years ago. Even so, these practices are not as widely known as they could be—and
    perhaps should be.


    In this part, a chapter is devoted to each of the SOLID principles:


    +   - S The single responsibility principle

    +   - O The open/closed principle

    +   - L The Liskov substitution principle

    +   - I The interface segregation principle

    +   - D The dependency inversion principle


    Even taken in isolation, each of these principles is a worthy practice that any
    software developer would do well to learn. When used in collaboration, these patterns
    give code a completely different structure—one that lends itself to change.'
