- pgno: 321
  md: "The decorators for logging and transaction management are cross-cutting concerns.\
    \ Irrespective of the method on the interface and, in many cases, irrespective\
    \ of the interface itself, logging and transaction management could be applied.\
    \ Thus, to avoid repetitive implementations for multiple interfaces, you can decorate\
    \ all implementations by using aspect-oriented programming.\n\nSome other decorators\
    \ apply only to a subset of the methods of a single interface, not to all of them.\
    \ For example, you might want to prompt the user before you permanently delete\
    \ an entity from persistent storage—a common requirement. Remember that you do\
    \ not want to edit an existing class, which would violate the open/closed principle.\
    \ Instead, you could create a new implementation of an existing interface that\
    \ clients are already using to perform the delete action, such as the Delete method\
    \ of the ICreateReadUpdateDelete<TEntity> interface. A confirmation prompt implementation\
    \ would look like Listing 10-3.\n\n# LISTING 10-3 If a decorator targets part\
    \ of an interface, segregation is an option.\n\n```\npublic class DeleteConfirmation<TEntity>\
    \ : ICreateReadUpdateDelete<TEntity>\n{\n    private readonly ICreateReadUpdateDelete<TEntity>\
    \ decoratedCrud;\n    public DeleteConfirmation(ICreateReadUpdateDelete<TEntity>\
    \ decoratedCrud)\n    {\n        this.decoratedCrud = decoratedCrud;\n    }\n\n\
    \    public void Create(TEntity entity)\n    {\n        decoratedCrud.Create(entity);\n\
    \    }\n\n    public TEntity ReadOne(Guid identity)\n    {\n        return decoratedCrud.ReadOne(identity);\n\
    \    }\n\n    public IEnumerable<TEntity> ReadAll()\n    {\n        return decoratedCrud.ReadAll();\n\
    \    }\n\n    public void Update(TEntity entity)\n    {\n        decoratedCrud.Update(entity);\n\
    \    }\n\n    public void Delete(TEntity entity)\n    {\n        Console.WriteLine(\"\
    Are you sure you want to delete the entity? [y/N]\");\n        var keyInfo = Console.ReadKey();\n\
    \        if (keyInfo.Key == ConsoleKey.Y)\n        {\n            decoratedCrud.Delete(entity);\n\
    \        }\n    }\n}\n```"
