- pgno: 241
  md: '# The single responsibility principle


    **After completing this chapter, you will be able to**


    +   - Understand the importance of the single responsibility principle.

    +   - Identify classes that have too many responsibilities.

    +   - Write modules, classes, and methods that have a single responsibility.

    +   - Refactor monolithic classes into smaller classes with single responsibilities.

    +   - Use design patterns to separate responsibilities.


    The single responsibility principle (SRP) instructs developers to write code that
    has one and only one reason to change. If a class has more than one reason to
    change, it has more than one responsibility. Classes with more than a single responsibility
    should be broken down into smaller classes, each of which should have only one
    responsibility and reason to change.


    This chapter explains that process and shows you how to create classes that have
    only a single responsibility but are still useful. Through a process of delegation
    and abstraction, a class that contains too many reasons to change should delegate
    one or more responsibilities to other classes.


    It is difficult to overstate the importance of delegating to abstractions. It
    is the lynchpin of adaptive code and, without it, developers would struggle to
    adapt to changing requirements in the way that Scrum, Kanban, and other Agile
    frameworks demand.


    # Problem statement


    To better explain the problem with having classes that hold too many responsibilities,
    this section explores an example. Listing 7-1 shows the TradeProcessor introduced
    in Chapter 6, “Refactoring.” Recall that this class reads records from a file
    and updates a database, and some characterization tests were added around it to
    capture its current behavior. This created a Golden Master test, which can be
    used as a safety harness to protect somewhat against inadvertent behavioral changes
    when refactoring.


    Despite its small size, this sort of code is common and often needs to cope with
    new features and changes to requirements.'
