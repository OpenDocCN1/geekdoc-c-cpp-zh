- pgno: 278
  md: 'The TradeProcessorClient depends directly on the TradeProcessor class. A new
    requirement is handed to you, resulting in necessary changes to the TradeProcessor
    class. Without modifying the original class, you create a new version (TradeProcessorVersion2)
    that contains the new functionality as specified in your new requirement. Because
    the client directly depends on the TradeProcessor class, and because of the lack
    of extension points in the TradeProcessor class, you need to place the new functionality
    inside a new class. The side effect of this change is that the TradeProcessorClient
    must be edited so that it depends on the new version of the class. It seems like
    it would just be easier to allow you to edit the existing TradeProcessor, doesn’t
    it?


    If you allow changes to existing code where they have no client impact, you might
    not have to create an entirely new version of the TradeProcessor. If the ProcessTrades
    method signature were to change, this would not simply be an implementation change
    for the class, it would also be an interface change. All interface changes force
    client changes because clients are tightly coupled to the interfaces of their
    dependencies.


    # Virtual methods


    An alternative implementation for the TradeProcessor class contains an extension
    point: the ProcessTrades method is virtual. Figure 8-2 shows how the three classes
    are now arranged.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_278_0.png)


    FIGURE 8-2 The client depends on the TradeProcessor class, which can be extended
    via inheritance.


    Any class that marks one of its members as virtual is open to extension. This
    type of extension is via implementation inheritance. When your requirement for
    a new feature in the TradeProcessor class arrives, you can subclass the existing
    TradeProcessor and—without modifying its source code—alter the ProcessTrades method.


    The TradeProcessorClient does not need to change in this case, because you can
    use polymorphism to supply the client with the new version of the TradeProcessor
    and have it call the subclass’s implementation of the ProcessTrades method.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'You are somewhat limited in the scope of your reimplementation, however. You
    have access to the base class—so you can call TradeProcessor.ProcessTrades()—but
    you cannot alter individual lines of the original method. You either call the
    original method in its entirety, perhaps implementing the new feature before or
    after the call, or you reimplement it completely. There is no middle ground with
    a virtual method. Remember, subclasses can access only members from their base
    class that are marked as protected. If the TradeProcessor was created with many
    private members, you would not have access to them, and altering the original
    class is, of course, prohibited by the OCP.


    # Abstract methods


    A more flexible extension point that uses implementation inheritance is an abstract
    method. In this case, the TradeProcessor is an abstract class that defines a public
    ProcessTrades method, which delegates the work of the processing algorithm to
    three protected abstract methods. The client has no knowledge of these protected
    methods and, because they are abstract, no implementation is provided. Figure
    8-3 shows the relationships between the classes involved.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_279_0.png)


    **FIGURE 8-3** Abstract methods provide extension points for future subclasses.


    Two versions of the trade processor are provided. Both inherit the ProcessTrades
    method directly from the abstract base class, and both provide their own implementations
    for the abstract methods. The client depends on the abstract base class, so either
    concrete subclass—or a new subclass for new requirements—could be provided, and
    the OCP would be preserved.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'This is an example of the Template Method pattern, in which an algorithm is
    modeled but its general steps are customizable because of delegation to abstract
    methods. In effect, the base class delegates the individual steps of the process
    to subclasses.


    These methods need not be abstract; they could be virtual. The difference here
    is mainly the granularity of what has been made extensible. Rather than replacing
    the ProcessTrades method in its entirety, you can now replace select parts of
    the process by overriding the constituent methods.


    # Interface inheritance


    The final type of extension point discussed in this chapter is the alternative
    to implementation inheritance: interface inheritance. Here, the client''s dependency
    on a class is replaced with the now-familiar delegation to an interface. Figure
    8-4 shows the client''s dependency on the interface and the two implementations
    of the interface.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_280_0.png)


    FIGURE 8-4 The client depends on an interface rather than a class.


    Interface inheritance is preferable to implementation inheritance. With implementation
    inheritance, all subclasses—present and future—are clients. This prevents modification
    because, with implementation inheritance, subclasses depend on the implementation,
    too. All implementation changes are thus potentially client-aware changes. This
    echoes the advice to prefer composition over inheritance and to keep inheritance
    hierarchies shallow, with few layers of subclassing. If a change is made to add
    a member at the top of the inheritance graph, that change affects all members
    of the hierarchy.


    Interfaces are also better extension points because they can be decorated with
    rich object graphs of functionality that touch upon many different contexts. They
    are more flexible than classes. I don''t mean that the virtual and abstract methods
    that form the extension points of class inheritance are not useful, but that they
    do not provide quite the same level of adaptability as do interfaces.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# “Design for inheritance or prohibit it”\n\nIn his book *Effective Java* (Addison-Wesley,\
    \ 2008), Joshua Bloch has this to say about inheritance:\n\n> Design and document\
    \ for inheritance or else prohibit it.\n\nIf you choose to use implementation\
    \ inheritance as an extension point, you must design and document the class properly\
    \ so as to protect and inform future programmers who extend the class. Inheritance\
    \ of classes can be tricky—even subclasses can break existing code in unpredictable\
    \ ways.\n\nIt is very important to note that any class that is not marked with\
    \ the `sealed` keyword claims to support inheritance. A class does not need to\
    \ be abstract or to contain virtual methods in order to be subclassed. The new\
    \ keyword can be used to hide inherited members, but this blocks polymorphism,\
    \ possibly defying expectations.\n\nProhibiting inheritance by sealing a class\
    \ communicates a clear message to other programmers who might use the class: inheritance\
    \ is not just unsupported in this class, it is prevented. This removes the temptation\
    \ to try to extend the class, so programmers will redirect their efforts to finding\
    \ an alternative.\n\n# Protected variation\n\nYou are now armed with several tools\
    \ with which to implement the OCP. You know under which circumstances you can\
    \ edit existing classes, and you know that you need to implement extension points\
    \ in your code in order to support future changes in requirements. You also know\
    \ that you can use interfaces as extension points to make your code truly adaptable.\n\
    \nThe missing ingredient is the knowledge of *when* and *where* to apply this\
    \ principle. Taken to its logical extreme, should you add extension points everywhere,\
    \ all the time? Would this make your code infinitely flexible, or is there a law\
    \ of diminishing returns that applies?\n\nThis is where another principle related\
    \ to the OCP is of vital importance: *protected variation*. Alistair Cockburn\
    \ coined the term:\n\n> Identify points of predicted variation and create a stable\
    \ interface around them.\n> \n> —Alistair Cockburn, *Pattern Languages of Program\
    \ Design*, vol. 2 (Addison-Wesley, 1996)\n\nSomewhat confusingly, the definition\
    \ references *predicted variation*, yet the principle itself is called *protected\
    \ variation*. However, “predicted variation” is, to my mind, a more accurate term.\
    \ The two major facets of this definition bear a closer examination."
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Predicted variation


    The requirements of an individual class should be linked directly to a business
    client’s requirement. If this link is ignored, there is a risk that the class
    will not serve any purpose that the business client requested. Over the course
    of a sprint, user stories are taken from the sprint backlog, and developers and
    the product owner converse. At this point, questions should be asked as to the
    potential for future, related requirements. This forms the predicted variation
    that can be translated into extension points.


    # A stable interface


    Even if you delegate only to interfaces, clients are still dependent on those
    interfaces. If the interface changes, the client must also change. A key advantage
    of depending on interfaces is that they are much less likely to change than implementations.
    If you place the interface in a separate assembly from its implementation, clients
    can change without affecting change on the interface’s implementations, and implementations
    can change without affecting clients.


    Clearly, it is very important that all interfaces chosen to represent an extension
    point should be stable. The likelihood and frequency of interface changes should
    be low, otherwise you will need to amend all clients to use the new version.


    # Just enough adaptability


    There is a “Goldilocks Zone” where code contains just the right amount of extension
    points—in the right places—to enable change in areas where it is needed without
    increasing complexity or over-engineering the solution. For any individual problem,
    there can be too little, too much, or just enough adaptability.


    Programmers who are beginning their careers tend to write code that is quite procedural,
    even in object-oriented languages such as C#. They tend to use classes as storage
    mechanisms for methods, regardless of whether those methods truly belong together.
    There is no discernible architecture to the code, and there are few extension
    points (and those that exist might be misplaced). Any changes to requirements
    necessitate direct changes to the existing class or classes. This is how the original
    TradeProcessor was organized in Chapter 7, “The single responsibility principle.”
    It was a “god object” that had perfect knowledge of everything to do with the
    program.


    However, sometimes, this is the correct solution. If you assess the predicted
    variation for a small tool such as the TradeProcessor and conclude that it is
    very unlikely to change in any way, the original version of the code will suffice.
    Or perhaps the version that was refactored for clarity would be sufficient. The
    extra time spent refactoring for abstraction is wasted effort if you never make
    use of the extension points provided. Not only that, but it is more difficult
    to reason about the code and what it does, spread over different files and assemblies,
    with implementations hidden behind interfaces.


    At the opposite end of the spectrum is the programmer who has started abstracting
    code behind interfaces. This programmer has discovered a new hammer, and now everything
    looks like a nail. The code produced by this programmer is a mass of extension
    points, most of which will never be used. A significant effort is required to
    piece together the code, which constantly delegates responsibilities to interfaces,
    and a significant effort is required to write this code in the first place.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'If these two archetypal programmers—and their code—were combined, the result
    might be a harmonious middle ground where there are sufficient extension points,
    but where code can be adapted only in areas where requirements are unclear, changeable,
    or difficult to implement. This comes with experience, however, and it is difficult
    to arrive at this Zen-like state of predicted variation without first being a
    naive beginner and then transitioning to a know-it-all super-abstractionist!


    # Predicted variation versus speculative generality


    Software development is an emerging engineering practice that is still finding
    its feet as a science. Because of this, what is a hard-and-fast rule as opposed
    to a suggestion, guideline, or best practice is open to interpretation.


    Two such guidelines are predicted variation and speculative generality.


    The predicted variation guideline states that you should be explicit in what you
    allow and disallow to be extended. The speculative generality guideline states
    that you should beware of trying to preempt how a class might apply to a general
    problem, lest you create a leaky abstraction.


    Both guidelines appear to be at odds with each other, but could it be that they
    are the two sides of the same coin?


    Consider the number of times that you use the sealed keyword on a class, or have
    a class depend directly on another class, rather than an interface. Now compare
    this to the number of times that you either create an interface dependency or
    mark a class as abstract or a method as abstract or virtual.


    When a class is sealed, you cannot subclass it in the future, and this prevents
    the class from being used as an extension point. Abstract classes are designed
    to be extended and cannot be instantiated without first being subclassed. This
    is also true for abstract methods. Virtual methods provide a meaningful default
    implementation but can be specialized in some way in the future.


    These are all design choices. Some of them are implicit and unintended: you just
    didn’t mark the class as sealed; therefore, you can circumvent certain methods
    in the future. Others are explicit. Ideally, all design choices should be made
    with an explicit intent.


    # Do you need so many interfaces?


    Interfaces are, by now, a ubiquitous construct in object-oriented programming.
    There are few cases where interfaces are not relied on to provide extension points.
    And interfaces are the ultimate extension point: you provide clients with a way
    of passing a message to some other object and allow infinite possibilities for
    filling in the blanks of how the message is handled.


    There are some cases where the value of this is obvious. Typically, this is at
    the edges of the application where a decoupling of client and service is required.
    A common and concrete example of this is data access, such as when client code
    wants to access some data that is persisted and keyed by identifier. Such a class
    is furnished with an interface that represents a way of accessing this data. Later,
    the interface is implemented for some specific data storage mechanism: a relational
    database, a document store, a key-value cache, file storage on disk, an in-memory
    dictionary, a mocked-out test double, a service call.... The list goes on.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'However, there are cases where interfaces and the myriad possibilities for
    implementation are unwarranted. Take, for example, the mapping of code from one
    layer to another. Suppose your code contains a data access layer that retrieves
    data transfer objects (DTOs) that are implementation-specific. Your domain layer
    wants to receive some of the data that these DTOs hold in a format that it recognizes.
    This necessitates the mapping code, but will there be multiple implementations
    of this code, or just one canonical version for which you explicitly disallow
    the possibility of extension?


    The expected return values from a repository are domain model objects; thus it
    is up to the specific implementation of the data access layer to convert its own
    implementation-specific DTOs to domain model types. Therefore, mapping layers
    conceptually reside with their data access implementations, not in some half-space
    between data access layer and domain model.


    If a specific implementation of a data access layer depends on a specific type
    of DTO and is of use to a specific domain model, there is no benefit in providing
    extensible or substitutable mapping code, yet there is a cost: decreased readability.


    This is an example of avoiding speculative generality by predicting a lack of
    variation. The two guidelines are not inimical: they are complementary. If the
    generality you seek is speculative, you have predicted no specific variation.
    And, if the generality you seek is not speculative, you must have predicted a
    specific variation.


    # Conclusion


    The open/closed principle is a guideline for the overall design of classes and
    interfaces and how developers can build code that allows change over time. With
    each passing sprint, new requirements are inevitable and should be embraced. Acknowledging
    that change is a good thing is only part of the answer, however. If the code you
    have produced up until this point is not built to enable change, change will be
    difficult, time consuming, error prone, and costly.


    By ensuring that your code is open to extension but closed to modification, you
    effectively disallow future changes to existing classes and assemblies, which
    forces programmers to create new classes that can plug into the extension points.
    There are two main types of extension points available: implementation inheritance
    and interface inheritance. Virtual and abstract methods allow you to create subclasses
    that customize methods in a base class. If classes delegate to interfaces, this
    provides you with more flexibility in your extension points by virtue of a variety
    of patterns.


    Knowing that you can integrate extension points into code is not sufficient, however.
    You also need to know when this is applicable. The concept of protected variation
    suggests that you identify parts of the requirements that are likely to change
    or that are particularly troublesome to implement, and factor these out behind
    extension points. Code can be quite rigidly defined, with little scope for extension
    or elaboration, or it can be very fluid, with myriad extension points ready to
    handle new requirements. Either of these options can be correct, depending on
    the specific scenario and context.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# The Liskov substitution principle


    After completing this chapter, you will be able to


    +   - Understand the importance of the Liskov substitution principle.

    +   - Avoid breaking the rules of the Liskov substitution principle.

    +   - Further solidify your single responsibility principle and open/closed principle
    habits.

    +   - Create derived classes that honor the contracts of their base classes.

    +   - Use code contracts to implement preconditions, postconditions, and data
    invariants.

    +   - Write correct exception-throwing code.

    +   - Understand covariance, contravariance, and invariance and where each applies.


    # Introduction to the Liskov substitution principle


    The Liskov substitution principle (LSP) is a collection of guidelines for creating
    inheritance hierarchies in which a client can reliably use any class or subclass
    without compromising the expected behavior.


    If the rules of the LSP are not followed, an extension to a class hierarchy—that
    is, a new subclass—might necessitate changes to any client of the base class or
    interface. Whenever the LSP is followed, clients can remain unaware of changes
    to the class hierarchy. Whenever there are no changes to the interface, there
    should be no reason to change any existing code. The LSP, therefore, helps to
    enforce both the open/closed principle and the single responsibility principle.


    # Formal definition


    The definition of the LSP by prominent computer scientist Barbara Liskov is a
    bit dry, so it requires further explanation. Here is the official definition:


    > If S is a subtype of T, then objects of type T may be replaced with objects
    of type S, without breaking the program.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'There are three code ingredients relating to the LSP:


    +   - **Base type** The type (T) that clients have reference to. Clients call
    various methods, any of which can be overridden—or partially specialized—by the
    subtype.

    +   - **Subtype** Any one of a possible family of classes (S) that inherit from
    the base type (T). Clients should not know which specific subtype they are calling,
    nor should they need to. The client should behave the same regardless of the subtype
    instance that it is given.

    +   - **Context** The way in which the client interacts with the subtype. If the
    client doesn’t interact with a subtype, the LSP can neither be honored nor contravened.


    # LSP rules


    There are several “rules” that must be followed for LSP compliance. These rules
    can be split into two categories: contract rules (relating to the expectations
    of classes) and variance rules (relating to the types that can be substituted
    in code).


    # Contract rules


    These rules relate to the contract of the supertype and the restrictions placed
    on the contracts that can be added to the subtype.


    +   - Preconditions cannot be strengthened in a subtype.

    +   - Postconditions cannot be weakened in a subtype.

    +   - Invariants of the supertype—conditions that must remain true—must be preserved
    in a subtype.


    To understand the contract rules, you should first understand the concept of contracts
    and then explore what you can do to ensure that you follow these rules when creating
    subtypes. The “Contracts” section later in this chapter covers both in depth.


    # Variance rules


    These rules relate to the variance of arguments and return types.


    +   - There must be contravariance of the method arguments in the subtype.

    +   - There must be covariance of the return types in the subtype.

    +   - No new exceptions can be thrown by the subtype unless they are part of the
    existing exception hierarchy.


    The concept of type variance in the languages of the Common Language Runtime (CLR)
    of the Microsoft .NET Framework is limited to generic types and delegates. However,
    variance in these scenarios is well worth exploring and will equip you with the
    requisite knowledge to write code that is LSP compliant for variance. This will
    be explored in depth in the “Covariance and contravariance” section later in this
    chapter.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Contracts


    It is often said that developers should *program to interfaces*, and a related
    idiom is to *program to a contract*. However, beyond the apparent method signatures,
    interfaces convey a very loose notion of a contract. A method signature reveals
    little about the actual requirements and guarantees of the method’s implementation,
    as Figure 9-1 shows. In a strongly typed language like C#, there is at least a
    notion of passing the correct type for an argument, but this is largely where
    the interface ends and the concept of the contract must begin.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_287_0.png)


    **FIGURE 9-1** Method signatures reveal little about the expectations of the implementation.


    Methods have an optional return type, a name, and an optional list of formal parameters.
    Each parameter consists of a type specifier and a name. When calling the method
    shown in Figure 9-1, you know—from only looking at the signature—that you must
    pass in three parameters, one of type `float`, one of type `Size<float>`, and
    another of type `RegionInfo`. You also know that you can save the return value,
    of type `decimal`, in a variable or otherwise operate on this value after the
    call has been made.


    > **Note** It is not advisable to use the `decimal` type to represent currency
    values, as is done in Figure 9-1. Instead, a money value type should be used.
    Although effort has been taken to ensure that the examples in this book are, as
    much as possible, relevant to a real-world context and are not just contrivances,
    some concessions have been made in the interest of brevity.


    As a method writer, you can control the names given to parameters and methods.
    Take extra care to ensure that the method name truly represents the method’s purpose
    and that the parameter names are as descriptive as possible. The `CalculateShippingCost`
    function’s name uses a verb-noun form. Here the verb—the action performed by the
    method—is `Calculate`, and the noun—the object of the verb—is `ShippingCost`.
    This noun is, in a sense, the name of the return value. Descriptive names have
    also been chosen for the parameters: `packageDimensionsInInches` and `packageWeightInKilograms`
    are self-explanatory parameter names, especially in the context of the method.
    They form a starting point for documenting the method.


    > **Tip** For further information on good variable and method naming and other
    best practices, Steve McConnell’s *Code Complete2* (Microsoft Press, 2004) is
    essential reading.'
  merge: -1
