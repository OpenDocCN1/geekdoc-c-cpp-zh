    | Monday 15th | 09:30-09:45 | Daily Scrum | Development team |

    | Tuesday 16th | 10:00-11:20

    11:30-12:00

    13:00-15:30 | Sprint demonstration

    Sprint retrospective

    Sprint planning | Anyone

    Development team

    Development team; product owner |


    Another interesting point is the timing of the daily Scrum. If it is too early
    in the day, attendance can be a problem because people could be delayed by traffic
    or otherwise waylaid. If it is too late, dragging people from their desks when
    they are already involved in a task is also difficult.


    These meetings can be added to Microsoft Outlook or some other calendar program,
    with the relevant people attached as attendees.


    # Agile in the real world


    Agile processes are not a miracle solution, destined to turn every failing project
    to profitability and success. The aim of any software development process is to
    create repeatable success when delivering software, but that software still needs
    to be written. No amount of documentation can remove the fact that a software
    product is the result of working source code.


    This book teaches developers how to create software solutions that are adaptive.
    This means that they are resilient to the sort of change to which all software
    is subjected. It is irrational to assume that the first attempt at a solution
    will meet all of the needs of the customer, so change is inevitable. Agile processes—and
    Scrum is no exception—aim to embrace this change and seek to ensure that customers
    are allowed to make alterations to the behavior of the software as it is developed.
    Otherwise, they would be forced to accept a substandard solution that misses the
    mark.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Code that is not *adaptive* is *maladaptive*. If code is maladaptive, it does
    not readily lend itself to change. The estimates that the team assigned to various
    tasks could be significantly different from reality because the code takes much
    longer to change than it should. Changing the code might also result in the introduction
    of defects that will eventually take further time, effort, and resources to be
    fixed.


    The rest of this section address some of the issues that Agile frameworks alone
    cannot solve when you are striving for adaptive code.


    # Rigidity


    Code can display a few different signs of rigidity, each of which needs to be
    addressed so that changes don’t become increasingly difficult, limiting the number
    of features that can be delivered.


    # Lack of abstractions


    An abstraction hides the details of something, showing instead a much simpler
    representation. Abstractions are all around us. The steering wheel in your car
    abstracts the mechanical implementation that eventually turns the wheels in either
    direction. In fact, there are two common types of steering: rack-and-pinion steering
    and recirculating-ball steering. In either implementation, the end result is that
    both of the wheels turn to match how much you have turned the steering wheel,
    in relative terms. Also, the left and right wheels do not turn the same amount.
    Because the inside wheel traces a circle of smaller radius than the outside wheel,
    it must turn more tightly than the outside wheel.


    Of course, you do not need to know any of this to drive a car. Sure, the knowledge
    might help you diagnose problems or explain how the system works, but as an everyday
    driver, all this is extraneous information that is not vital to you. The abstraction
    hides as many details as it can and gives you just enough to get by.


    In software, abstractions are key. The user interface does not need to know what
    storage medium is being used to house the user’s input. In fact, if it does know
    this, there is a lack of abstraction, and the user interface becomes hopelessly
    obsessed with details that it should not be concerned with.


    Code with sufficient abstractions will be better organized, easier to understand
    and communicate to others, and easier to maintain, and it will contain fewer errors.


    # Too many abstractions


    Abstractions are good. But there can be too many abstractions. This is because
    abstractions are not free. Every abstraction comes with a cost—in lower readability
    and reasonability. Code should be written to be readable by humans first and foremost.
    Compilers are the tools that convert your code to executable instructions, but
    they care little for readability.


    > > *Do not write code so that it can be parsed by a compiler. Write code so that
    it can be understood by a human.* Too many abstractions will make your code less
    readable by others. Overcomplicating a solution is as much a problem for adaptability
    as a lack of patterns and best practices.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Mixed responsibilities


    Often, code gradually grows organically from something small, perhaps even trivial,
    to something much bigger and more important. Incremental changes are made, one
    on top of the other, until some critical point is reached when a single change
    can have many related and unpredictable consequences.


    This sort of code contains methods, classes, and possibly even whole modules that
    have no single discernible purpose. Instead, each fulfills several different responsibilities
    that cannot be easily separated. In this code, a change that should only take
    a few hours to complete can easily end up taking a day or more of wrestling with
    the side-effects that one change has on another, ostensibly unrelated, area of
    the code.


    To avoid this, ensure that code at every level—methods, classes, and modules—focuses
    on one well-defined responsibility.


    # Untestability


    Unit testing has been an established practice for many years now. It is a reliable
    method of ensuring code correctness that should feel entirely natural to many
    developers. However, it takes constant discipline and diligence to ensure that
    code remains testable over the long term.


    If code is untestable, it is untested. If code is untested, it will contain defects.
    You must simply assume that untested code contains defects. That is the level
    of suspicion with which you should treat such code.


    The following concepts, and testability in general, are discussed in further detail
    in Chapter 5, "Testing."


    # Skyhooks vs. cranes


    Daniel C. Dennett wrote in his 1995 book, Darwin''s Dangerous Idea [emphasis mine]:


    > "A skyhook is ... an exception to the principle that all design, and apparent
    design, is ultimately the result of mindless, motiveless mechanisticity. A crane,
    in contrast, is a subprocess or special feature of a design process that can be
    demonstrated to permit the local speeding up of the basic, slow process of natural
    selection, and that can be demonstrated to be itself the predictable (or retrospectively
    explicable) product of the basic process."


    Daniel C. Dennett, Darwin''s Dangerous Idea: Evolution and the Meaning of Life,
    1995 [Simon & Schuster]


    Sidestepping the religiosity of the content, put simply, a skyhook is a way to
    explain something without reference to a prior antecedent. Conversely, cranes
    have explicable antecedents—perhaps until arriving at some primary axiom.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'This is a useful analogy in programming, too. Skyhooks are indicative of a
    deeper problem. All skyhooks should be replaced with appropriate cranes.


    The presence of a skyhook in code is difficult to replace with a fake implementation,
    thereby reducing testability. Examples of skyhooks are:


    +   - Static methods

    +   - Static classes (including singletons)

    +   - Object construction that uses new

    +   - Extension methods


    Each of these make testing more difficult! by hindering your ability to inject
    mocks into your code; they are skyhooks and thus they are undesirable. Each is
    used ex nihilo—from nothing.


    Luckily, each of these can be replaced with a suitable crane, such as the following,
    that will facilitate some kind of external injection (that is, it can be used
    ex materia—from something):


    +   - Interfaces

    +   - Dependency injection

    +   - Inversion of control

    +   - Factories


    In subsequent chapters of this book, each of these "cranes" of programming is
    explained in more detail.


    # Metrics


    Source code has been subject to many different metrics through the years, each
    of which attempts to reduce the complexity of code down to numbers that indicate
    the health—or otherwise—of the project as a whole.


    This might seem rather reductive, but metrics have evolved somewhat since middle-management
    obsessed over source lines of code (SLOC). Although SLOC correlates well to the
    effort required—it takes longer to write more lines of code than it does to write
    fewer—it does not necessarily correlate to the level of functionality of a system.
    Nor, indeed, is it a reliable measure of a developer''s productivity.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Cum hoc ergo propter hoc


    The Latin phrase *cum hoc ergo propter hoc* translates to “With this, therefore
    because of this.” This is an example of a logical fallacy: a mistake in reasoning.
    It is the misapprehension that, because an event statistically occurs in conjunction
    with some other event, one of those events occurs because of the other. It is
    often quoted as, “Correlation does not imply causation.”


    It is important to remember that, with all of these metrics, there is merely a
    statistical correlation between a desirable value for the metric and the nebulous
    goal of “good code.”


    # Unit test coverage


    *Unit test coverage* is a measurement of the percentage of the code that is covered
    by unit tests. This ranges from 0 percent, indicating that none of the code is
    covered by any tests, to 100 percent, where every line of code is covered by at
    least one unit test. Typically, coverage of 80 percent is considered a minimum
    acceptable level.


    In addition to the unit tests, unit test coverage tools should be run by the continuous
    integration server, which will compile the code every time it is committed to
    source control. This will allow you to gain fast feedback on any movements in
    code coverage.


    Test coverage is somewhat misleading, because it is a quantitative measure of
    the unit tests, as opposed to a qualitative measure. It is easy to increase code
    coverage with *any* tests, as opposed to the *right* tests.


    If test coverage is below 80 percent—or whatever your chosen benchmark is—then
    it can be incrementally increased over time toward your overall coverage goal.
    With each increase, the continuous integration build should be configured to fail
    if the coverage percentage slips backward. This means that no new production code
    can be added without accompanying unit tests, otherwise the coverage percentage
    would be diluted and would decline.


    # Cyclomatic complexity


    *Cyclomatic complexity* is a measure of the number of paths that exist in the
    code. With each additional branch in the code—if statements, loops, or *switch*
    statements—the cyclomatic complexity increases. As Figure 1-13 shows, a simple
    *if* statement and inner loop can be modeled as a graph. As the figure shows,
    the total number of paths through the statement and loop is equal to the cyclomatic
    complexity of the code.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'The edge labeled 1 is the case when the if statement has a false condition,
    thus its body is not executed. Edge 2 is when the if statement''s body is executed,
    but the contained loop is not. Edge 3 is the case when both the if statement and
    loop are executed.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_68_0.png)


    FIGURE 1-13 Each extra path through the code adds further complexity.


    As cyclomatic complexity increases, the testing effort required to gain unit test
    code coverage on each branch also increases. Therefore, it is best to keep branching,
    and thus cyclomatic complexity, low to avoid extra test code.


    To calculate cyclomatic complexity, take the number of edges in the graph, subtract
    the number of nodes in the graph, and add twice the number of connected components.
    A connected component is a set of nodes that can be traversed by following the
    edges. Usually there is only one connected component in a single codebase.


    Cyclomatic Complexity = # Edges - # Nodes + 2


    Refer to Figure 1-13 as an example: there are nine nodes with 10 edges and one
    connected component. Thus, the code represented by this graph has a cyclomatic
    complexity measurement of 10 - 9 + 2 × 1 = 3.


    There is also a statistical correlation between high complexity and defect count.
    That is, code with more branching tends to have more defects.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Conclusion


    This chapter has served as an introduction to the Scrum process. If you have never
    worked on a Scrum project, I hope that your interest has now been piqued sufficiently
    to do so. On the other hand, if you do work on a Scrum project, perhaps there
    were some new ideas in this chapter that you want to use.


    Though there is admittedly a lot of ground still not covered in this chapter with
    respect to Scrum, the rest of the book is dedicated more to the developer’s point
    of view of an Agile project. However, there are plenty of resources available
    for learning more about Scrum and discovering whether it is a good fit for your
    company and your projects.


    Scrum projects, like any software projects, are vulnerable to failure. Spotting
    when something is going wrong is a significant part of the battle, but spotting
    why it is happening can be even harder. The internal machinations of the code
    might be designed in a way that makes change very difficult—no matter what process
    is in place for managing this change. The rest of this book will provide advice
    and guidelines for ensuring that code is adaptive from the bottom up, making change
    easier and allowing you to focus solely on adding business value with every sprint.'
