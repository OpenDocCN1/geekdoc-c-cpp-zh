- pgno: 331
  md: "```\npublic void CreateOrder(Order order)\n{\n    saver.Save(order);\n}\n\n\
    public Order GetSingleOrder(Guid identity)\n{\n    return reader.ReadOne(identity);\n\
    }\n\npublic void UpdateOrder(Order order)\n{\n    saver.Save(order);\n}\n\npublic\
    \ void DeleteOrder(Order order)\n{\n    deleter.Delete(order);\n}\n}\n```\n\n\
    This controller works specifically with order entities. This means that each of\
    \ the interfaces supplied contains the Order class as the generic parameter. If\
    \ you were to alter any of those declarations to use a different type, the operations\
    \ provided by that interface would then require that type. For example, if you\
    \ decided to change the delete interface parameter to IDelete<Customer>, the DeleteOrder\
    \ method of the OrderController would complain that you were trying to delete\
    \ an Order with a method that only accepts Customers. This is simply strong typing\
    \ and generics in action.\n\nEach method of this controller class requires a different\
    \ interface to perform its function. For clarity, each method maps one-to-one\
    \ with the operations on the respective interfaces. It is likely that this will\
    \ not always be the case, of course.\n\nAs its name suggests, the OrderController\
    \ deals only with Order classes. You can make use of the fact that the service\
    \ interfaces are each generic by implementing a controller that is similarly generic.\
    \ This is shown in Listing 10-16.\n\n# LISTING 10-16 An entity-generic version\
    \ of the controller class requires an entity-generic version of each CRUD interface.\n\
    \n```\npublic class GenericController<TEntity>\n{\n    private readonly IRead<TEntity>\
    \ reader;\n    private readonly ISave<TEntity> saver;\n    private readonly IDelete<TEntity>\
    \ deleter;\n\n    public GenericController(IRead<TEntity> entityReader, ISave<TEntity>\
    \ entitySaver, IDelete<TEntity> entityDeleter)\n    {\n        reader = entityReader;\n\
    \        saver = entitySaver;\n        deleter = entityDeleter;\n    }\n}\n```"
