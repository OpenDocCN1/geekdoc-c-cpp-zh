- pgno: 304
  md: 'The Contract.Invariant method follows the same pattern as the Requires and
    Ensures methods in that it accepts a Boolean predicate that must be true to satisfy
    the contract. In this example, there is also a second string parameter provided
    that describes the fault if this contract fails, leaving the invariant unprotected.
    The client can make as many calls to the Invariant method as necessary, so it
    is best to break the invariants down to their most granular, rather than logically
    AND them all together with the && operator. This gives you the maximum benefit
    of knowing exactly which data invariant has been broken.


    If this were a normal private method, you would be obliged to call the method
    at the start and end of every method, to ensure that the invariants were correctly
    protected. Luckily, you can have code contracts do this on your behalf by marking
    the method with the ContractInvariantMethodAttribute. Remember that attributes
    do not require the Attribute suffix, so this has been shortened in the example
    to ContractInvariantMethod. This informs code contracts that the method must be
    called when entering and leaving a method, to confirm that the class’s data invariants
    are not being violated. The prerequisites for marking a method as a ContractInvariantMethod
    are that it must return void and accept no arguments. However, it can be public
    or private, and you can choose any name to describe the method. Classes can have
    more than one ContractInvariantMethod, so logically grouping them is also possible.
    The body of the method must only make calls to the Contract.Invariant method.


    # Interface contracts


    The final feature of code contracts to be covered here is that of interface contracts.
    So far, you have embedded all calls to Contract.Requires, Contract.Ensures, and
    Contract.Invariant in the class implementation itself. As has been mentioned,
    the static nature of the Contract class makes this code ubiquitous and difficult
    to remove or change in favor of an alternative library in the future. This is
    somewhat contrary to the adaptive codebase that is the ideal, but some infrastructural
    concessions are justifiable for pragmatic reasons.


    A more immediate concern is the reduced readability that occurs when code contracts
    are liberally applied to classes. In fact, this is not a fault of code contracts
    but a result of diligently applying contracts in general. Preconditions, postconditions,
    and data invariants are implemented near the target code, but this tends to adversely
    affect the noise-to-signal ratio.


    An interface contract, such as that shown in Listing 9-19 for the ongoing ShippingStrategy
    example, can alleviate this problem in addition to providing another helpful feature.


    For interface contracts, you need an interface to work with. In this example,
    the CalculateShippingCost method has been extracted into its own IShippingStrategy
    interface. It is this interface, rather than a single implementation, that is
    going to have the contract applied to it. This is an important departure from
    the previous examples because it means that all implementations of this interface
    will acquire the applied contract. This is how you can enhance a simple interface
    that provides few instructions for implementation and use, to give it more powerful
    requirements and assurances.'
