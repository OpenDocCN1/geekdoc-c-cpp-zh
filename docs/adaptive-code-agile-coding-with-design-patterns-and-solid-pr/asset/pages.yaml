- pgno: 389
  md: "For example, the TaskService from Listing 12-3 earlier in this chapter had\
    \ a remaining code smell of manually creating a SqlConnection instance. This was\
    \ left there because the lifetime of that connection could not be matched to that\
    \ of the TaskService, which is created on application startup and exists for the\
    \ duration of the application. If the SqlConnection was injected into the TaskService,\
    \ as shown in Listing 12-13, it would live for the lifetime of the application.\
    \ This does not mean, however, that the connection would be open for the duration,\
    \ because opening the connection is a separate operation from its construction.\n\
    \n# LISTING 12-13 Some resources have a lifetime that must be carefully managed.\n\
    \n```\nprivate void OnApplicationStartup(object sender, StartupEventArgs e)\n\
    {\n    CreateMappings();\n\n    container = new UnityContainer();\n    container.RegisterType<ISettings,\
    \ ApplicationSettings>();\n    container.RegisterType<IObjectMapper, MapperAutoMapper>();\n\
