- pgno: 408
  md: "Listing 12-30 shows how the continuing example could use convention over configuration\
    \ for registering.\n\n# LISTING 12-30 The registration phase can be greatly simplified\
    \ by using conventions.\n\n```\nprivate void OnApplicationStartup(object sender,\
    \ StartupEventArgs e)\n{\n    CreateMappings();\n\n    container = new UnityContainer();\n\
    \    container.RegisterTypes(\n        AllClasses.FromAssembliesInBasePath(),\n\
    \        WithMappings.FromMatchingInterface,\n        WithName.Default\n    );\n\
    \n    MainWindow = container.Resolve<TaskListView>();\n    MainWindow.Show();\n\
    \n    ((TaskListController)MainWindow.DataContext).OnLoad();\n}\n```\n\nThe registrations\
    \ have been replaced by a call to RegisterTypes, which is the method used to provide\
    \ the container with instructions on how to find classes and map them to interfaces.\
    \ The instructions provided in this example tell the container to:\n\n+   - Register\
    \ all classes from the assemblies in the bin folder (which is the base path).\n\
    +   - Map those classes to the interface that matches the name of the class. The\
    \ convention here is that the Service implementation class would be registered\
    \ against the IService interface.\n+   - Use the default to name the mapping when\
    \ registering each mapping. This default is null, meaning that the mapping is\
    \ unnamed.\n\nThe container will iterate through each public class in each assembly\
    \ that is in the bin folder, find its implemented interfaces, and map it to the\
    \ one that matches the class's name (prefixed with an I, for Interface), without\
    \ providing a name for the mapping. It is not hard to imagine that the resulting\
    \ registration will be quite greedy, potentially registering more classes to interfaces\
    \ than you usually would if you were registering manually. However, a more important\
    \ concern is whether it correctly registers the classes you want to the correct\
    \ interfaces. This is the new problem introduced by conventions.\n\nThe registration\
    \ is undeniably simpler than its previous incarnation, but only insofar as it\
    \ is shorter: fewer lines of code. With registration by configuration, it was\
    \ easy to comprehend which implementation was being used for each interface—and\
    \ that they were definitely registered correctly.\n\nThe first parameter to RegisterTypes\
    \ is a collection of the types to register. The AllClasses static class provides\
    \ some helper methods for retrieving such a collection by using various common\
    \ strategies. The second parameter requires a function that accepts a Type passed\
    \ in from the collection in the first parameter—the implementation type—and returns\
    \ a collection of Type instances to"
  merge: -1
  img_proc: true
- pgno: 409
  md: "which it will be mapped—the interface types. The WithMappings static helper\
    \ provides some methods that match this signature and use various strategies for\
    \ finding appropriate interfaces to map to each type. The third parameter is another\
    \ function, this time requiring that you return a name for the mapping for each\
    \ type. The WithName static helper class provides two alternatives: Default, which\
    \ always returns null (thus the mapping is unnamed), and TypeName, whereby the\
    \ type's name is used for the mapping name. This allows you to call Resolve<IServices>(\"\
    MyServiceImplementation\") to retrieve the mapped type by its name.\n\nOf course,\
    \ with the parameters of this method being so general, you can provide whatever\
    \ methods match the signature so that you can tailor the convention to your needs.\
    \ As Listing 12-31 shows, the crux of registering by convention is in the conventions\
    \ that are used to find types, map them, and name them.\n\n# LISTING 12-31 Conventions\
    \ can be tailored to your specifications.\n\n```\npublic partial class App : Application\n\
    {\n    private void OnApplicationStartup(object sender, StartupEventArgs e)\n\
    \    {\n        CreateMappings();\n\n        container = new UnityContainer();\n\
    \        container.RegisterTypes(\n            AllClasses.FromAssembliesInBasePath().Where(type\
    \ =>\n            type.Assembly.FullName.StartsWith(MatchingAssemblyPrefix)),\n\
    \            UserDefinedInterfaces,\n            WithName.Default\n        );\n\
    \n        MainWindow = container.Resolve<ITaskListView>();\n        MainWindow.Show();\n\
    \n        ((TaskListController)MainWindow.DataContext).OnLoad();\n    }\n\n  \
    \  private IEnumerable<Type> UserDefinedInterfaces(Type implementingType)\n  \
    \  {\n        return WithMappings.FromAllInterfaces(implementingType)\n      \
    \      .Where(iface => iface.Assembly.FullName.StartsWith(MatchingAssemblyPrefix));\n\
    \    }\n}\n```\n\nYou start by retrieving all of the types from the assemblies\
    \ in the bin folder again. But this time, you limit the acceptable assemblies\
    \ by returning only those whose full name starts with a specific prefix string.\
    \ It is common practice to use a \"dot notation\" for naming assemblies so that\
    \ they match the top-level namespace that they contain. So Microsoft.Practices.Unity\
    \ is the name of the DLL in which that namespace resides. If that assembly exists\
    \ in your bin folder—and it is certain to if you"
  merge: -1
  img_proc: true
- pgno: 410
  md: 'are using Unity—you might want to omit it from the scan for types to map. A
    simple way to do this is to retrieve only those types that match the prefix of
    your own application. Instead of Microsoft, you would use something like MyBusiness
    or OurProject.


    The second parameter has been replaced with a reference to your own local method,
    which matches the required signature. Given a Type, which is the implementation
    type, you need to return a collection of other types that represent the interfaces
    to map to. Rather than write anything particularly complex, you specialize WithMappings.FromAllInterfaces,
    which returns all of the interfaces that the type implements. This list could
    feasibly include interfaces that you really do not want to map to—INotifyPropertyChanged
    or IDataErrorInfo, for example. So again, you only return the interfaces that
    reside in assemblies that match your assembly prefix. This ensures that you map
    only your own types to your own interfaces.


    # Pros and cons


    Much like Poor Man''s Dependency Injection and vanilla registration with an Inversion
    of Control container, using conventions involves a tradeoff. You have less code
    to write, but that code is more algorithmic than the declarative alternatives.


    Conventions are initially harder to set up. If you are writing truly SOLID code,
    not everything will lend itself to a perfect one-to-one mapping of class to interface.
    In fact, if an interface only has one implementation, that is itself a code smell—and
    mocks for unit tests do not count toward that total. Whether they are adapters,
    decorators, or different strategies, it should be common to have more than one
    implementation per interface, making registration by convention that much more
    difficult. As it becomes more commonplace to have florid object graphs injected
    into classes, it becomes harder to devise a general rule by which classes and
    interfaces can be mapped to each other. Under such circumstances, the conventions
    cover only a small portion of the required registration code, rather than being
    the general case.


    Mark Seemann, author of the excellent Dependency Injection in .NET (Manning Publications,
    2011), has explored the three options available for DI and has arrived at the
    conclusion summarized by Figure 12-5. In brief, the tradeoffs are between two
    criteria: value and complexity. Value is a utilitarian measure of the worth of
    the option, ranging from pointless to valuable. Complexity measures the relative
    difficulty of the option, ranging from simple to sophisticated. As shown in the
    figure, all three options exist at different points of the curve. Poor Man''s
    DI is simple and valuable, whereas convention over configuration is sophisticated
    and valuable. The main difference between them, then, is that using conventions
    is more complex than manually constructing the classes and forming an object graph
    from those classes.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_411_0.png)


    FIGURE 12-5 The tradeoffs between the three options for dependency injection mapped
    on two axes.


    Interestingly, Seemann considers manual registration to sit somewhere between
    simple and sophisticated on the complexity scale but claims that it is pointless
    on the utilitarian scale. Why is this? The main reason is because registering
    types manually with a container is weakly typed. If you try to construct a class
    and pass in an instance for one of its parameters that does not match the type
    required, the compiler will complain when you try to build. However, no such compile-time
    error is generated by an IoC container. Instead, you defer the error to run time,
    which causes you to enter an inefficient loop of write > compile > run > test.
    Not only that, but you have spent time and energy learning how to register mappings
    with the container, for little gain and some extra pain.


    The choice seems simple: either Poor Man''s DI or conventions. If the project
    is simple and a limited amount of mappings will be required, Poor Man''s DI is
    as simple as can be: just construct the objects manually. If the project is likely
    to be more complex, requiring many interfaces and classes to be mapped together,
    target the majority of the registrations with conventions, with the rest of the
    more specialized mappings being manually registered.


    I also highly recommend Mark Seemann''s blog, where he explores many topics and
    is always methodical in his approach¹.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Conclusion


    Dependency injection is the glue that holds together every other facet of this
    book. Without DI, it would not be possible to focus so keenly on factoring dependencies
    out of classes and hiding their implementation behind general interfaces. Such
    extension points are key to the development of adaptive code and key to the steady
    progress of an application as it gains in size and complexity.


    There are different options for the implementation of DI, each of which has its
    own place. Whether you use Poor Man''s DI or conventions (with some minimal manual
    mapping), having DI at all is more important than how it is accomplished.


    Some common uses of DI are actually abuses that fit better into the category of
    code smell or anti-pattern. Service Locator and Illegitimate Injection are two
    abuses that negate some of the positive effects of properly implemented DI.


    Each application type has a composition root and a resolution root, the identification
    of which help you understand how the classes should be organized to facilitate
    DI. The composition root is always very close to the entry point of the application,
    assuming that registration is an initialization concern. The resolution root is
    the only type of object that should be resolved. In some applications, there is
    only one instance of the resolution root, whereas in others, a family of different
    subclasses will be resolved.


    For all its far-reaching effects, dependency injection is actually a deceptively
    simple pattern that is nonetheless powerful and misunderstood.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Coupling, cohesion, and connascence


    After completing this chapter, you will be able to


    +   - Define coupling and cohesion.

    +   - Identify problematic strong coupling and low cohesion.

    +   - Measure coupling levels through connascence.


    The underpinning goal throughout this book has been to improve the adaptability
    of your code. When code is actively developed and maintained, it is rarely static
    for long. A single release of a software product or service is a snapshot of code
    in time, but each new feature added might introduce new complexity. This complexity
    must be reduced to produce a simple solution, or carefully managed.


    The foundations of adaptability, as shown in much of the content covered so far,
    are the benefits of low coupling and high cohesion throughout a codebase. This
    chapter walks through the definitions of coupling and cohesion and explains how
    to measure coupling through connascence.


    # Coupling and cohesion


    There are two qualities that correlate with good code: high cohesion and low coupling.
    Because there is only a correlation and not a causation, it is not certain that
    instilling your code with these two qualities will create success. More likely,
    the inverse correlation has a stronger causal link: low cohesion and high coupling
    causes software products to fail.


    # Coupling


    *Coupling* is the strength of the interdependence between software elements. The
    term "software elements" has been chosen deliberately to cover a multitude of
    software artifacts—methods, classes, assemblies, components, and even subsystems.


    Coupling is measured as low or high, which indicates whether the coupling is weak
    or strong, respectively. When elements are weakly coupled, they can vary independently.'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'Coupling determines the effect that changes to software elements have on one
    another. When coupling between software elements is low—that is, when the strength
    of their interdependence is weak—a change in one element does not necessitate
    a change in another element. Low coupling is a situation that programmers strive
    for. Conversely, high coupling—a strong interdependence of software elements—can
    cause a change in one part of a system to require a change in another part of
    the system, with potentially cascading effects. Therefore, high coupling should
    be avoided.


    # Cohesion


    *Cohesion* is the strength of the contextual relationship between software elements.
    As with coupling, cohesion applies to subsystems, components, assemblies, classes,
    and methods.


    Cohesion measures the contextual relationship between variables in a method, methods
    in a class, classes in a module, modules in a solution, solutions in a system,
    and subsystems in a system. This fractal relationship is important because a lack
    of cohesion at any scope is problematic.


    Cohesion is measured as low or high, which corresponds to weak or strong contextual
    relationships between elements. If two classes reside in a module but are unrelated
    to each other, they are described as having low or weak cohesion. Conversely,
    when two classes that reside in a module have a valid relationship, they are described
    as having high or strong cohesion. The former is problematic, the latter is good.


    What constitutes a “valid” contextual relationship? Continuing with the scope
    of classes in modules, a valid relationship between classes occurs when:


    +   - They both belong to the same layer of application architecture.

    +   - They both belong to the same bounded context of the application.


    Consider, for example, a class that reads user data from a database and another
    class that caches this data. These two classes exhibit high cohesion due to the
    shared context of user data.


    # Same layer of application architecture


    The application architecture might define three layers: user interface, domain
    model, and data persistence, to use a common three-tiered example. A rule can
    be applied here:


    > > Classes that relate to the same layer can live together in the same module,
    whereas classes that relate to different layers must be separated by at least
    a module boundary.'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'This rule''s use of language is important. When classes relate to the same
    layer, they only "can" live together. That is: they might not necessarily live
    in the same module; you might want to separate a large layer into multiple modules.
    However, those classes that do not relate to the same layer "must" be separated
    by "at least" a module boundary; that is, they cannot reside in the same module,
    but they can reside in separate modules, solutions, subsystems, or systems.


    # Same bounded context of the application


    Bounded contexts are officially a construct of domain-driven design (DDD), a software
    development approach for tackling complexity through an evolving domain model.
    However, as a concept, the terminology transcends those confines and is generally
    applicable. Again, a rule can be stated:


    > Classes that relate to the same bounded context can live together in the same
    module, whereas classes that relate to different bounded contexts must be separated
    by at least a module boundary.


    The specific use of language applies to this rule as much as to the rule introduced
    in the previous section.


    It is a common code smell to lump code that relates to different modules and different
    bounded contexts together into the same module. This causes problems in the long
    term because this monolithic module increases the difficulty of maintenance and
    future enhancement. Left unchecked, such a module will be very difficult to extend,
    which increases the time it takes to add new features.


    # Connascence


    Connascence is the complexity of dependencies in an object-oriented software system.
    It is a metric that helps to determine the quality of code.


    Even when your dependencies are explicitly defined with project or service references,
    that is not enough to determine whether the dependency is good or bad. There are
    different kinds of semantic dependencies, each of which indicates whether the
    dependency is good or bad on a sliding scale.'
  merge: -1
  img_proc: true
- pgno: 416
