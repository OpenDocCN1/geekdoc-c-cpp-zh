    \        {\n            serviceHost.Description.Behaviors.Add(new ServiceDiscoveryBehavior());\n\
    \            serviceHost.AddServiceEndpoint(typeof(ICalculator), new BasicHttpBinding(),\n\
    \                new Uri(\"http://localhost:8090/CalculatorService\"));\n    \
