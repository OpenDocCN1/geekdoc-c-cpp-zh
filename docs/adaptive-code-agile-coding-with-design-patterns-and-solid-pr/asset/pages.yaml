    \    }\n\n    private readonly IAccountRepository repository;\n}\n```\n\nThe unit\
    \ test has guided you into doing the right thing in this implementation. You had\
    \ to use the repository to retrieve the account, and you had to call the AddTransaction\
    \ method on that account to mutate the read-only Balance property. If anyone subsequently\
    \ breaks this method so that it no longer matches the expectations set out in\
    \ the unit test, you will know about it very quickly.\n\n# Mocking frameworks\n\
    \nIt requires little power of the imagination to realize that creating mocks can\
    \ quickly become laborious. Imagine all of the permutations of unit tests that\
    \ you might write, and all of the different interfaces that your SUTs might need.\
    \ This is a lot of extra code just to support your unit tests.\n\nThere is another\
    \ way to mock the IAccountRepository, but it requires the use of an external mocking\
    \ framework. One positive aspect of writing fakes is that you can write them in\
    \ isolation without requiring any third-party dependencies. However, mocking frameworks\
    \ are commonplace nowadays, and there are many to choose from. The following example\
    \ uses one of the most popular: Moq. This is variously pronounced *Moh-kyoo* and\
    \ *Mok*.\n\nBy using NuGet, you can quickly add your reference to Moq by searching\
    \ for its package on the online feed. The magic behind Moq is that it can create\
    \ dynamic proxies of any interface that you ask it to mock. You will edit your\
    \ existing test to use a Moq mock instead of your manual fake, as shown in Listing\
    \ 5-17."
