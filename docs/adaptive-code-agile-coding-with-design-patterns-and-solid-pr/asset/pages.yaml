    \n        var interfacePropertyValue =\n            interfaceReference.ThisIntegerPropertyOnlyNeedsAGetter;\n\
    \        interfaceReference.ThisMethodRequiresImplementation();\n        interfaceReference.ThisStringPropertyNeedsImplementingToo\
    \ = \"Hello\";\n        interfaceReference.InterfacesCanContainEventsToo += EventHandler;\n\
    \    }\n\n    void EventHandler(object sender, EventArgs e)\n    {\n    }\n}\n\
    ```\n\nExplicit implementation is useful when you want to avoid a signature clash,\
    \ when the class already possesses a method signature that must be implemented\
    \ by an interface.\n\nEvery method that can be defined in the .NET Framework has\
    \ a specific method signature. This signature helps to distinguish methods as\
    \ unique and to differentiate methods that have been overridden. A method’s signature\
    \ consists of its name and its parameter list. Note that a method’s access level,\
    \ return value, abstract, or sealed status all affect the method signature. Listing\
    \ 4-5 shows a variety of method signatures, some of which clash. Method signatures\
    \ clash if they are equal in all aforementioned criteria. No class, interface,\
    \ or struct can contain methods with clashing signatures.\n\n# **LISTING 4-5**\
    \ Some of these methods have the same signature.\n\n```\npublic class ClashingMethodSignatures\n\
    {\n    public void MethodA()\n    {\n    }\n\n    // This would cause a clash\
    \ with the method above:\n    //public void MethodA()\n    //{\n    //}\n}\n```"
