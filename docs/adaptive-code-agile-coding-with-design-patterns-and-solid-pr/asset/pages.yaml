- pgno: 330
  md: "A single class can be the implementation for multiple decorators—but only when\
    \ the context of the decorator is shared, as in this example. The ModificationEventPublishing\
    \ decorator is implementing the same functionality—event publication—for both\
    \ interfaces that it implements. It would be unwise, however, to combine decorators\
    \ for event publishing with those for auditing, for example. This is due to the\
    \ dependencies involved. One decorator depends on the IEventPublisher interface,\
    \ whereas the other depends on the AuditInfo class. It would be better instead\
    \ to separate those implementations into their own assemblies with their own dependency\
    \ chains.\n\n# Client construction\n\nThe design of interfaces—segregated or otherwise—affects\
    \ the classes that implement the interfaces and the clients that use the interfaces.\
    \ If clients are to use interfaces, the interfaces must in some way be supplied\
    \ to the clients. This chapter will continue, for the most part, to manually construct\
    \ the implementations and provide them to clients via constructor parameters.\
    \ For an alternative option, see Chapter 12, \"Dependency injection.\"\n\nThe\
    \ way you supply the implementations to clients is partly dictated by the number\
    \ of implementations of the segregated interfaces. If each interface is given\
    \ its own implementation, each of those implementations needs to be constructed\
    \ and supplied to the client. Alternatively, if all the interfaces are implemented\
    \ in a single class, a single instance is sufficient for all of the related dependencies\
    \ on the client.\n\n# Multiple implementations, multiple instances\n\nContinuing\
    \ the CRUD example, assume that the IRead, ISave, and IDelete interfaces have\
    \ all been implemented by different, distinct classes. A client needing to use\
    \ these interfaces will, because of segregation, require three interfaces, whereas\
    \ it previously only required one. Such a client is shown in Listing 10-15.\n\n\
    LISTING 10-15 The order-specific controller requires each facet of CRUD as a separate\
    \ dependency.\n\n```\npublic class OrderController\n{\n    private readonly IRead<Order>\
    \ reader;\n    private readonly ISave<Order> saver;\n    private readonly IDelete<Order>\
    \ deleter;\n\n    public OrderController(IRead<Order> orderReader, ISave<Order>\
    \ orderSaver, IDelete<Order> orderDeleter)\n    {\n        reader = orderReader;\n\
    \        saver = orderSaver;\n        deleter = orderDeleter;\n    }\n}\n```"
