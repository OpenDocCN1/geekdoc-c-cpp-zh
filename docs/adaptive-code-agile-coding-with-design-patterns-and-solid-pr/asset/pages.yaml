- pgno: 297
  md: "Listing 9-12 returns to the previous data invariant example from earlier in\
    \ the chapter. However, in this instance, the ShippingStrategy accepts the flat\
    \ rate value as a constructor parameter and maintains this value as a read-only\
    \ data invariant. The new WorldwideShippingStrategy is introduced, and the means\
    \ to change the flat rate value is made public through a property.\n\n# LISTING\
    \ 9-12 The subclass breaks the data invariant of the superclass, violating the\
    \ LSP.\n\n```\n[Test]\npublic void ShippingFlatRateCanBeChanged()\n{\n    strategy.FlatRate\
    \ = decimal.MinusOne;\n\n    strategy.FlatRate.Should().Be(decimal.MinusOne);\n\
    }\n// . .\npublic class WorldwideShippingStrategy : ShippingStrategy\n{\n    public\
    \ WorldwideShippingStrategy(decimal flatRate)\n        : base(flatRate)\n    {\n\
    \    }\n\n    private decimal flatRate;\n    public decimal FlatRate\n    {\n\
    \        get\n        {\n            return flatRate;\n        }\n        set\n\
    \        {\n            flatRate = value;\n        }\n    }\n}\n```\n\nAlthough\
    \ the subclass reuses the base class's constructor and guard clause, it does not\
    \ maintain the data invariant and therefore breaks the Liskov substitution principle.\
    \ The unit test proves that clients can set the value to a negative number, which\
    \ should be disallowed by the class if it is to correctly protect its data invariants.\n\
    \nListing 9-13 shows that when the base class is reworked to disallow direct write\
    \ access to the flat rate field, the invariant is properly honored by the subclass.\
    \ This is a very common pattern whereby fields are private but there are protected\
    \ or public properties that contain guard clauses to centralize the protection\
    \ of invariants."
