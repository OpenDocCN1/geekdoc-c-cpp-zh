- pgno: 421
  md: '# Timing


    Connascence of timing indicates the presence of a temporal dependency between
    code. This is likely due to concurrency issues introduced by threading code.


    # Value


    When a special value is depended on by two pieces of code, those two pieces of
    code have connascence of value.


    # Identity


    If two pieces of code depend on the presence of a specific instance of an entity,
    they are said to have connascence of identity.


    # Measuring connascence


    Connascence is related to two other measures of code adaptability discussed previously:
    coupling and cohesion. Connascence is primarily an aspect of coupling of two components
    and, as such, the strength of connascence correlates to the strength of coupling.


    # Locality


    Connascence should be assessed in conjunction with the locality of the components.
    If the client and service code are both classes that reside in the same project,
    maintaining weak connascence is less important. When the components are separated
    by service boundaries, it is much more important to lower the connascence between
    them. Take, for example, a call to a WCF service operation. In this case, the
    position of the operation’s arguments is significant irrespective of type: changing
    the order of the parameters would require remote clients to update.


    # Unofficial connascence


    Assessing the connascence of your code is absolutely a worthwhile activity. However,
    such a one-dimensional view of your code’s dependencies is reductive. There are
    far more heuristics for evaluating the quality of code dependencies than connascence
    implies.


    For example, there could be a level between name and type: interface.'
  merge: -1
  img_proc: true
- pgno: 422
  md: "# Interface\n\nConnascence of interface requires knowledge of the name and\
    \ shape of messages that can be passed to an object. In most languages, these\
    \ messages take the form of method calls. If you want to call a method on an object,\
    \ you must know the name of the method and any arguments that must be passed to\
    \ the method. However, you do not need to know the underlying type of the object.\
    \ The dependency is only on the interface of the type. In some languages, this\
    \ interface can even be implied—but in C#, interfaces can be explicit.\n\nListing\
    \ 13-7 shows a client that does not have a dependency on the AdoNetDataRecord\
    \ type. Instead, it depends only on the IDataRecord interface, which can be implemented\
    \ by any number of types.\n\nLISTING 13-7 Connascence of interface, although unofficial,\
    \ is preferable to connascence of type.\n\n```\n//IDataRecord.cs\npublic interface\
    \ IDataRecord\n{\n    void Delete();\n    void Save();\n}\n\n//AdoNetDataRecord.cs\n\
    public class AdoNetDataRecord : IDataRecord\n{\n    public void Delete()\n   \
    \ {\n        // Delete record...\n    }\n\n    public void Save()\n    {\n   \
    \     // Save record...\n    }\n}\n\n//Client.cs\npublic class Client\n{\n   \
    \ public void DoSomethingWithRecord(IDataRecord record)\n    {\n        record.Save();\n\
    \    }\n}\n```"
