- pgno: 234
  md: "This code is more procedural than object-oriented. It is a long recipe for\
    \ transforming data that is in one format—a stream—into another format—a relational\
    \ database. It might have started life as a prototype or a spike, or just a very\
    \ quick-and-dirty solution. But, as is common, it is now to be repurposed into\
    \ a more robust and full-featured solution. If you were to encounter code like\
    \ this, the temptation might be to hack away at it until it is in better shape:\
    \ more object-oriented, with extension points, and more testable. That would be\
    \ a good idea, but the execution would be perilous: without the safety net of\
    \ tests to indicate mistakes, the refactor would be prone to the most insidious\
    \ type of failure: silent failure. The prerequisite step to refactoring code without\
    \ tests is to capture its current behavior as best you can.\n\n# Characterization\
    \ tests\n\nThe first objective is to gather the outcomes of the code given a variety\
    \ of inputs. By defining and supplying a range of inputs, you can ascertain the\
    \ domain of outputs. This could be a manual process involving running the application\
    \ many times and recording the outputs for any provided inputs. But, of course,\
    \ this doesn’t scale well and will take a long time to execute. Instead, it is\
    \ better to automate the process in the form of characterization tests.\n\nDespite\
    \ the name, you will not implement the characterization tests as unit tests. This\
    \ is because you will not run the characterization tests all the time. The output\
    \ of a characterization test is the set of current behaviors given certain inputs.\
    \ These will then become your expectations when you create a golden master test.\
    \ Your expectations will change infrequently and only when you are ready to add\
    \ functionality to the code or change its current behavior. Implementing characterization\
    \ tests as unit tests would cause you either to erroneously regenerate the expectations\
    \ every time you run all tests, or comment out the characterization test for most\
    \ of the development, only uncommenting it when an expectation has failed. This\
    \ is prone to error. Instead, the characterization tests will be implemented as\
    \ a running console application. Listing 6-18 shows the first characterization\
    \ test.\n\n```\nclass Program\n{\n    static void Main(string[] args)\n    {\n\
    \        var inputs = new List<string>()\n        {\n            \"empty-file.txt\"\
    \n        };\n\n        var originalConsoleOut = Console.Out;\n\n        foreach\
    \ (var input in inputs)\n        {\n            var tradeStream = Assembly.GetExecutingAssembly()\n\
    \                .GetManifestResourceStream(typeof(Program), input);\n\n     \
    \       using (var streamWriter = new StreamWriter(\n                File.OpenWrite($\"\
    expectation-{input}\")))\n```"
