- pgno: 428
  md: 'If you don’t like working with the command line, there are several good GUIs
    available for Git. They are available from *http://git-scm.com/downloads/guis*.


    # Cloning a repository


    The first step is to clone a repository. All Git commands are provided as parameters
    to the git command-line application. The clone command requires the address of
    a repository to clone. The following command clones the repository for this book
    into a local repository. Remember that Git is distributed source control, so many
    repositories can exist. You will have full read access to the remote repository
    but will only be able to write to your own local clone.


    ```

    `git clone --recursive https://github.com/AdaptiveCode/AdaptiveCode.git`

    ```


    This command creates a new directory called AdaptiveCode under the current working
    directory. By default, the master branch is selected. Each of the samples in this
    book are, however, located on different branches, so you need to be able to switch
    branches.


    # Switching to a different branch


    After cloning a new repository, change the directory to your local clone by using
    the change directory command.


    ```

    `cd AdaptiveCode`

    ```


    The currently selected branch is the default, which for this repository is master.
    As a personal preference, I have prefixed every directory with a chapter—X. This
    indicates the chapter number to which the directory relates. The rest of the directory
    name is a more free-form description of its content. The github repository’s readme
    file provides a reference of code listings as they correspond to directory names.
    Move into the directory for one of the chapter’s samples.


    ```

    `cd ch12-problem-statement`

    ```


    If you list the contents of the current directory, as shown in the following code
    snippet, there is now a new directory called DependencyInjectionMvc, which, in
    turn, contains a Microsoft Visual Studio solution file and some more directories
    for its constituent projects.'
