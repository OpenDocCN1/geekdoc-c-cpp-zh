- pgno: 231
  md: "# Making legacy code adaptive\n\n> Legacy code is code without tests.\n> \n\
    > — Michael Feathers, *Working Effectively with Legacy Code*\n\nAll examples of\
    \ refactoring up to this point have assumed that the code that is the target of\
    \ your refactors has sufficient tests to protect against a refactoring mistake.\
    \ What if there are no unit tests?\n\nIn his great book, *Working Effectively\
    \ with Legacy Code* (Prentice Hall, 2014), Michael Feathers asserts that legacy\
    \ code is not simply code from a bygone era written in Cobol or some such arcane\
    \ language. No, the differentiating factor that distinguishes legacy code is that\
    \ it does not have any unit tests that verify its behavior.\n\nSuch code makes\
    \ refactoring more difficult, because there is no guarantee against an inevitable\
    \ mistake that could alter the behavior and the structure of the code. Furthermore,\
    \ the omission of tests also correlates with poor code design, so legacy code\
    \ is both perilous to refactor and in desperate need of refactoring! This lack\
    \ of design is what makes it so difficult to retrofit unit tests so that the code\
    \ can be safely refactored.\n\n# The golden master technique\n\nMichael Feathers\
    \ solves this problem with two types of tests: characterization tests and a golden\
    \ master.\n\nCharacterization tests are intended to capture the current behavior\
    \ of the system. The goal is not to be exhaustive, mapping the range of all possible\
    \ inputs to the domain of all possible outputs. Instead, the goal is to capture\
    \ the general ebb and flow of the code’s runtime execution.\n\nWhen the characterization\
    \ tests have been created, the system’s current behavior is stored, perhaps as\
    \ log messages in a file. This file is now your expectation for the system, and\
    \ the output of the characterization tests is disabled. These expectations can\
    \ form the basis of test assertions. The golden master will run the system and\
    \ capture a current view of the characterization tests. From here, changes can\
    \ be made to the system, and the output of the characterization tests compared\
    \ against the golden master. Any deviation from the expected paths will result\
    \ in a test failure. With a green, passing test, you have given yourself some\
    \ confidence that your refactoring efforts have not altered the behavior of the\
    \ legacy code.\n\nOnly when the expected behavior of the system has changed do\
    \ you regenerate the golden master by re-running the characterization tests. During\
    \ the normal course of regression testing, the generation of the golden master\
    \ is disabled, but the assertion of current behavior versus expected behavior\
    \ remains enabled.\n\nOf course, this technique lacks the precision of true unit\
    \ tests, but the idea is that each refactor is more of a redesign. This will generate\
    \ a parallel design that is implemented by using a test-first process. As the\
    \ suite of unit tests grows, so does your confidence that the application is still\
    \ functional."
