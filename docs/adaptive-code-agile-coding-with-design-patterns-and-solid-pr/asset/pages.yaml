- pgno: 274
  md: '# Conclusion


    The single responsibility principle has a hugely positive impact on the adaptability
    of code. Compared to equivalent code that does not adhere to the principle, SRP-compliant
    code leads to a greater number of classes that are smaller and more directed in
    scope. Where there would otherwise have been a single class or suite of classes
    with interdependencies and a confusion of responsibility, the SRP introduces order
    and clarity.


    The SRP is primarily achieved through abstracting code behind interfaces and delegating
    responsibility for unrelated functionality to whichever implementation happens
    to be behind the interface at run time. Some design patterns are excellent at
    supporting efforts to strictly regiment the SRP—in particular, the Adapter pattern
    and the Decorator pattern. For them enables much of your code to maintain first-party
    references to interfaces under your direct control, although in reality using
    a third-party library. The latter can be applied whenever some of a class’s functionality
    needs to be removed but it is too tightly coupled with the intent of the class
    to stand alone.


    What this chapter did not cover is how all of these classes are orchestrated at
    run time. Passing interfaces into constructors was taken for granted in this chapter,
    but Chapter 12 describes a variety of ways in which this can be accomplished.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# The open/closed principle


    **After completing this chapter, you will be able to**


    +   - Understand different interpretations of the open/closed principle.

    +   - Treat SOLID code as append-only.

    +   - Compare and contrast different class extension-point mechanisms.

    +   - Use protected variation as a guideline for extension points.


    The oxymoronic nature of the open/closed principle causes some confusion. Its
    pithy name suggests code that is permissive but at the same time restrictive.
    The fact that there are several variations of the definition serves only to cloud
    matters further.


    Picking one definition over another and using it alone would be remiss. Rather,
    this chapter compares each definition and its consequences to try to distill the
    principle down to its essence. The goal is a very useful guideline that will enable
    you to create code that is more adaptive to future changes.


    # Introduction to the open/closed principle


    There are two definitions of the open/closed principle that must be examined,
    the original coining from the 1980s and a more contemporary definition. The latter
    seeks to elaborate on the former by giving it more context and clarifying the
    principle''s scope.


    # The Meyer definition


    Bertrand Mayer, in his 1988 book, *Object-Oriented Software Construction* (Prentice
    Hall), defined the open/closed principle (OCP) as follows:


    > *Software entities should be open for extension, but closed for modification.*


    The Meyer definition is the most commonly cited definition of the principle, but
    there is a second: the Martin definition.'
