    # Abstracting sealed code


    In this example, the code is redesigned so that both the sensor classes and the
    command-line client of the sensors are changed to use the new abstraction. However,
    it is not always possible to change the target classes. Sometimes these classes
    are sealed, or they are in a third-party assembly.


    In those cases, the abstraction is still possible, but it requires intermediate
    implementations of the new interfaces: adapters. (See "The Adapter pattern" in
    Chapter 4, "Interfaces and design patterns.")'
