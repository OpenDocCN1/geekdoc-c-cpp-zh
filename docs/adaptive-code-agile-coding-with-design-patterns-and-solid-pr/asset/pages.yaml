- pgno: 144
  md: '# Multiple inheritance


    Some languages support the concept of inheriting from multiple base classes. C++,
    in particular, allows this construct. However, .NET Framework languages do not
    permit it, and the compiler will generate a warning if a class attempts to inherit
    from two or more classes, as Figure 4-1 shows.


    > 2 Class ''TheInterface.AttemptedMultipleInheritance'' cannot have multiple base
    classes: ''TheInterface.BaseClassOne'' and ''BaseClassTwo''


    FIGURE 4-1 Multiple inheritance is prevented by the compiler.


    # Diamond inheritance problem


    One reason that multiple inheritance is disallowed is because of the diamond inheritance
    problem. This problem occurs when two or more classes are inherited by the same
    class. If each of those base classes contains identical methods, which one should
    be used? Figure 4-2 shows a Unified Modeling Language (UML) diagram of the problem.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_144_0.png)


    FIGURE 4-2 A UML diagram showing the diamond inheritance problem.


    In this case, which version of RootMethod() should class AttemptedMultipleInheritance
    inherit—the one that BaseClassOne inherited from RootClass, or the one that BaseClassTwo
    inherited from RootClass? Because of this ambiguity, the .NET Framework does not
    allow multiple inheritance of classes.'
  merge: -1
  img_proc: true
