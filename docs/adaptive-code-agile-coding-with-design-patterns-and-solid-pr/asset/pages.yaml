- pgno: 350
  md: '# The Entourage anti-pattern


    The *Entourage anti-pattern* gets its name from the fact that even though you
    think you are asking for just one simple thing, it brings along all of its friends.
    This is much like music or film stars who are followed by hangers-on and moochers:
    their entourage. It is a name that I have created to best describe undesirable
    dependency management.


    The Entourage anti-pattern is a common mistake that is made when developers explain
    programming to an interface. Rather than providing a full solution, the demonstration
    commonly stops short of saying, unequivocally, that interfaces and their implementations
    *should not be in the same assembly*.


    The Unified Modeling Language (UML) diagram in Figure 11-1 shows how the AccountController
    example is organized at the package level. The AccountController depends on the
    ISecurityService interface, which is implemented by the SecurityService class.
    The diagram also shows the packages—in the .NET Framework, these are assemblies
    or Microsoft Visual Studio projects—that contain each entity. This is an example
    of the Entourage anti-pattern: the implementation of an interface in the same
    assembly as the interface itself. The SecurityService should not be in the same
    assembly as the ISecurityService interface that it implements.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_350_0.png)


    **FIGURE 11-1** The `AccountController` assembly depends on the `Services` assembly.


    You have already learned in Chapter 3, “Dependencies and layering,” that the SecurityService
    class has some dependencies of its own, and how the chain of dependencies results
    in implicit dependencies from client to client. The package diagram in Figure
    11-2 displays the full extent of the Entourage problem.'
