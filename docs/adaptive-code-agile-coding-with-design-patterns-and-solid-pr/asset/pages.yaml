- pgno: 299
  md: "Tightening the visibility of the field and instead providing access only through\
    \ the property setter protects the invariant with a guard clause. Doing this in\
    \ the base class is preferable because it means that all future subclasses are\
    \ absolved of this responsibility and simply cannot directly write to the field\
    \ at all.\n\nA new unit test can be created that asserts this new behavior, as\
    \ shown in Listing 9-14.\n\n# LISTING 9-14 With the invariant maintained, this\
    \ unit test passes.\n\n```\n[Test]\npublic void ShippingFlatRateCannotBeSetToNegativeNumber()\n\
    {\n    strategy.Invoking(s => s.FlatRate = decimal.MinusOne)\n        .ShouldThrow<ArgumentOutOfRangeException>(\"\
    Flat rate must be positive and non-zero\")\n        .And.ParamName.Should().Be(\"\
    value\");\n}\n```\n\nIf a client tries to set the FlatRate property to a negative\
    \ value, or even to zero, the guard clause prevents the assignment and an ArgumentOutOfRangeException\
    \ is thrown.\n\n# Code contracts\n\nThroughout the previous section, the guard\
    \ clauses that formed the basis of the contracts were all written in long form,\
    \ using if statements and throwing exceptions. It is worth exploring an alternative\
    \ to these manual guard clauses: code contracts.\n\nPreviously a separate library,\
    \ code contracts were integrated into the .NET Framework 4 main libraries. In\
    \ addition to being easier to read, write, and comprehend than manual guard clauses,\
    \ code contracts bring with them the possibility of using static verification\
    \ and automatic generation of reference documentation.\n\nWith static contract\
    \ verification, code contracts can check for contract violations without executing\
    \ the application. This helps expose implicit contracts such as null dereferences\
    \ and problems with array bounds, in addition to the explicitly coded contracts\
    \ shown throughout this section.\n\nGenerating reference documentation relating\
    \ to the contract of a method or class is important because client code has no\
    \ other way of knowing the expectations. When more detail is included in the XML\
    \ comments that form the documentation to methods and classes, clients can view\
    \ the expectations via IntelliSense. This makes working with classes that use\
    \ contracts a bit easier."
  merge: -1
  img_proc: true
- pgno: 300
  md: "# Preconditions\n\nPreconditions can be written succinctly by using code contracts.\
    \ You will need to include the System.Diagnostics.Contracts namespace, which is\
    \ part of the mscorlib.dll and so should not need an additional assembly reference.\
    \ The static Contract class provides most of the functionality that is required\
    \ to implement contracts.\n\n> Note If you make the decision to use code contracts,\
    \ the static Contract class will permeate throughout much of your code base. This\
    \ is less of a problem than it is with most static references because code contracts\
    \ are ubiquitous infrastructure that, it is assumed, will not be removed or replaced.\
    \ Thus, it is a significant undertaking to undo the decision to use code contracts,\
    \ and it is best to use them from the outset of a project, or not at all.\n\n\
    Listing 9-15 shows the declarative nature of a code contract precondition.\n\n\
    # LISTING 9-15 The System.Diagnostics.Contracts namespace can provide guard clauses\
    \ to methods.\n\n```\nusing System.Diagnostics.Contracts;\n\npublic class ShippingStrategy\n\
    {\n    public decimal CalculateShippingCost(float packageWeightInKilograms, SizeF\
    \ packageDimensionsInInches, RegionInfo destination)\n    {\n        Contract.Requires(packageWeightInKilograms\
    \ > 0f);\n        Contract.Requires(packageDimensionsInInches.X > 0f && packageDimensionsInInches.Y\
    \ > 0f);\n\n        return decimal.MinusOne;\n    }\n}\n```\n\nThe Contract.Requires\
    \ method accepts a Boolean predicate value. This represents the state that the\
    \ method requires to proceed. Note that this is the inverse logic of the predicate\
    \ used in an if statement in manual guard clauses. In that case, the clauses were\
    \ checking for state that was invalid before throwing an exception. With code\
    \ contracts, the predicate is closer to an assertion: that the Boolean value must\
    \ return true, otherwise the contract fails. This example requires that the packageWeightInKilograms\
    \ parameter is nonzero and positive and that the packageDimensionsInInches parameter\
    \ is nonzero and positive for both its X and Y properties.\n\nThis version of\
    \ the Contract.Requires method throws an exception when the contract predicate\
    \ is not met, but the type of exception is a ContractException, which does not\
    \ match the expected exception in the existing unit tests. Therefore, they fail:\n\
    \n```\nExpected System.ArgumentOutOfRangeException because Package dimension must\
    \ be positive and non-zero, but found System.Diagnostics.Contracts.__ContractsRuntime=ContractException\
    \ with message \"Precondition failed: packageDimensionsInInches.X > 0f && packageDimensionsInInches.Y\
    \ > 0f\"\n```"
  merge: -1
