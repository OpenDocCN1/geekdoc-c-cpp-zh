- pgno: 305
  md: "**LISTING 9-19** A dedicated class can define preconditions, postconditions,\
    \ and invariants for every implementation of an interface.\n\n```\n```csharp\n\
    [ContractClass(typeof(ShippingStrategyContract))]\ninterface IShippingStrategy\n\
    {\n    decimal CalculateShippingCost(\n        float packageWeightInKilograms,\n\
    \        Size<float> packageDimensionsInInches,\n        RegionInfo destination);\n\
    \n    float FlatRate { get; }\n}\n//...\n[ContractClassFor(typeof(IShippingStrategy))]\n\
    public abstract class ShippingStrategyContract : IShippingStrategy\n{\n    public\
    \ decimal CalculateShippingCost(float packageWeightInKilograms, Size<float>\n\
    \        packageDimensionsInInches, RegionInfo destination)\n    {\n        Contract.Requires<ArgumentOutOfRangeException>(packageWeightInKilograms\
    \ > 0f,\n        \"Package weight must be positive and non-zero\");\n        Contract.Requires<ArgumentOutOfRangeException>(packageDimensionsInInches.X\
    \ > 0f &&\n        packageDimensionsInInches.Y > 0f, \"Package dimensions must\
    \ be positive and non-zero\");\n\n        Contract.Ensures(Contract.Result<decimal>()\
    \ > 0m);\n\n        return decimal.One;\n    }\n\n    public float FlatRate {\
    \ get; private set; }\n\n    [ContractInvariantMethod]\n    private void ClassInvariant()\n\
    \    {\n        Contract.Invariant(FlatRate > 0m, \"Flat rate must be positive\
    \ and non-zero\");\n    }\n}\n```\n```\n\nWhen writing an interface contract,\
    \ you also need a class that is going to implement the methods of the interface\
    \ but only fill them with uses of the Contract.Requires and Contract.Ensures methods.\
    \ The abstract ShippingStrategyContract provides this functionality and looks\
    \ like the prior examples, but what the prior examples lacked was the real functionality\
    \ of the method. Even in production code, this is the limit of the code contained\
    \ in a contract class. There is also a Contract-InvariantMethod to house any calls\
    \ to Contract.Invariant, just as if this class were the real implementation."
