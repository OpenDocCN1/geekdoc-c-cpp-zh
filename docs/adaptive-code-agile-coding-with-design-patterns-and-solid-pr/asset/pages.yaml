- pgno: 159
  md: "```\n// . . .\nclass Program\n{\n    static IExpectedInterface dependency =\
    \ new Adapter(new TargetClass());\n    static void Main(string[] args)\n    {\n\
    \        dependency.MethodA();\n    }\n}\n```\n\nThis is the more common form\
    \ of the Adapter pattern. The main method uses an IExpectedInterface but, rather\
    \ than provide a \"real\" implementation of this interface, an adapter to a different\
    \ class—TargetClass—is applied. This adapter fulfills the requirements of an IExpectedInterface—a\
    \ MethodA method—but it delegates this call to TargetClass, rather than doing\
    \ anything directly itself.\n\n# The Strategy pattern\n\nThe Strategy pattern\
    \ allows you to change the desired behavior of a class based on one or more supplied\
    \ \"strategies.\" Figure 4-7 shows the UML class diagram for the Strategy pattern.\n\
    \n![](img/f852e0a12c174e64d91a8e1a05146eab_159_0.png)\n\nFIGURE 4-7 The UML class\
    \ diagram of the Strategy pattern.\n\nThe Strategy pattern is used whenever a\
    \ class needs to exhibit variant behavior depending on the state of an object.\
    \ If this behavior can change at run time depending on the current state of the\
    \ class, the Strategy pattern is a perfect fit for encapsulating this variant\
    \ behavior. Listing 4-20 shows how to create the Strategy pattern and use it in\
    \ a class."
