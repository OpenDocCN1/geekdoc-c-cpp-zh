- pgno: 333
  md: "By creating classes for each individual segregated interface, the segregation\
    \ has, in effect, permeated the implementations. The key point to note is that\
    \ the three parameters to the OrderController class—reader, saver, and deleter—are\
    \ not just distinct instances, they are also distinct types.\n\n# Single implementation,\
    \ single instance\n\nA second approach to implementing segregated interfaces is\
    \ to implement all of them in one single class. This might at first appear somewhat\
    \ counterintuitive (after all, what is the point of segregating interfaces just\
    \ to unify them all again in the implementation?), but there are advantages to\
    \ this approach. Listing 10-18 shows all three interfaces in a single class.\n\
    \nLISTING 10-18 All interfaces can be implemented in a single class.\n\n```\n\
    public class CreateReadUpdateDelete<TEntity> :\n    IRead<TEntity>, ISave<TEntity>,\
    \ IDelete<TEntity>\n{\n    public TEntity ReadOne(Guid identity)\n    {\n    \
    \    return default(TEntity);\n    }\n\n    public IEnumerable<TEntity> ReadAll()\n\
    \    {\n        return new List<TEntity>();\n    }\n\n    public void Save(TEntity\
    \ entity)\n    {\n    }\n\n    public void Delete(TEntity entity)\n    {\n   \
    \ }\n}\n```\n\nRemember, clients are not aware of the existence of this class.\
    \ At compile time, they are only aware of the individual interfaces, which it\
    \ requires one by one. To the client, each interface will still only have the\
    \ members declared on that interface, although the underlying implementation has\
    \ other operations available. This is how interfaces are used for encapsulation\
    \ and information hiding—they are analogous to a small window onto the implementing\
    \ class, masking out what it does not allow the client to see."
  merge: -1
  img_proc: true
- pgno: 334
  md: "Even with this change, the controller from the multiple implementation example\
    \ is sufficient: it correctly asks for each interface as a separate constructor\
    \ parameter. What needs to change is how you construct the controller and supply\
    \ it with those parameters. This is shown in Listing 10-19.\n\n# LISTING 10-19\
    \ Although it might look unusual, this is an expected side effect of interface\
    \ segregation.\n\n```\npublic OrderController CreateSingleService()\n{\n    var\
    \ crud = new CreateReadUpdateDelete<Order>();\n    return new OrderController(crud,\
    \ crud, crud);\n}\n```\n\nFirst, you only need a single instance of the CreateReadUpdateDelete\
    \ class. It implements all three interfaces, so it suffices for all three constructor\
    \ parameters.\n\nAs unusual as that might look—passing in the same instance three\
    \ times—it makes sense because each parameter requires a different facet of the\
    \ class. This is a common side effect of the interface segregation principle.\n\
    \nOf the two variations explored, this single implementation for a suite of related—but\
    \ segregated—interfaces is not as versatile as having multiple implementations.\
    \ It is most commonly used for the leaf implementation of the interfaces—that\
    \ is, the implementation that is neither decorator nor adapter. It is the one\
    \ that does the actual work. The reason for this is that the context is the same\
    \ across all implementations. Whether you are using NHibernate, ADO.NET, Entity\
    \ Framework, or some other persistence framework, the leaf implementation is the\
    \ one that directly uses these libraries. In each case—reading, saving, or deleting—that\
    \ same library will be used to do the main work.\n\nSome decorators and adapters\
    \ also apply to the full suite of segregated interfaces, but it is more common\
    \ for these to be implemented individually only on the appropriate interface.\n\
    \n# The Interface Soup anti-pattern\n\nA common mistake is to take the segregated\
    \ interfaces and reunify them in an aggregate interface for some reason, as Listing\
    \ 10-20 demonstrates. This is usually done to avoid the odd-looking multiple injection\
    \ shown earlier.\n\n# LISTING 10-20 Interface segregation is wrongly circumvented\
    \ when all interfaces are thrown together to form a soup.\n\n```\ninterface IInterfaceSoupAntiPattern<TEntity>\
    \ : IRead<TEntity>, ISave<TEntity>, IDelete<TEntity>\n{\n}\n```"
  merge: -1
  img_proc: true
- pgno: 335
  md: "This creates an “interface soup” that is made from constituent interfaces but\
    \ undermines the benefits of interface segregation. Implementers will again be\
    \ required to provide implementations of all operations, so there is no scope\
    \ for targeted decoration.\n\n# Splitting interfaces\n\nThe ability—or requirement—to\
    \ decorate interfaces is only one reason that you might want to split a large\
    \ interface into smaller constituents. However, I view this as a good enough reason\
    \ for the practice.\n\nTwo more utilitarian reasons for interface segregation\
    \ are based on client need and architectural design.\n\n# Client need\n\nDifferent\
    \ developers work on different parts of code. Therefore, it is likely that two\
    \ or more developers will converge at some point, with one using the interface\
    \ of another. Having detailed, step-by-step instructions for an interface is not\
    \ only unlikely, but also impractical. Writing any code—especially code that is\
    \ sufficiently unit tested—takes time. Writing extensive documentation is tedious\
    \ and time consuming. Instead, it is better to program as defensively as is possible,\
    \ to prevent other developers—or even yourself in the future—from inadvertently\
    \ doing something they shouldn’t with your interface.\n\nIt helps to remember\
    \ that clients need only what they need. Monolithic interfaces tend to hand too\
    \ much control to clients. Interfaces with many members allow clients to do more\
    \ than they perhaps should, clouding the intent and misdirecting the focus.\n\n\
    # Functionality\n\nListing 10-21 shows an interface that allows clients to interact\
    \ with a user’s settings—specifically, the user interface theme that the clients\
    \ have set for the application. This example is surprising—it is an interface\
    \ with a single property that, in this scenario, is still exposing too much to\
    \ its client. How can you possibly segregate this further?\n\n> LISTING 10-21\
    \ The user settings interface allows access to the application’s current theme.\n\
    \n```\npublic interface IUserSettings\n{\n    string Theme\n    {\n        get;\n\
    \        set;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: "First, see the implementation in Listing 10-22, which uses the ConfigurationManager\
    \ class to read and write to the AppSettings section of the configuration files.\n\
    \n# LISTING 10-22 An implementation that loads settings from the configuration\
    \ file.\n\n```\npublic class UserSettingsConfig : IUserSettings\n{\n    private\
    \ const string ThemeSetting = \"Theme\";\n\n    private readonly Configuration\
    \ config;\n\n    public UserSettingsConfig()\n    {\n        config = ConfigurationManager.OpenExeConfiguration(ConfigurationUserLevel.None);\n\
    \    }\n    public string Theme\n    {\n        get\n        {\n            return\
    \ config.AppSettings.Settings[ThemeSetting].Value;\n        }\n        set\n \
    \       {\n            config.AppSettings.Settings[ThemeSetting].Value = value;\n\
    \            config.Save();\n            ConfigurationManager.RefreshSection(\"\
    appSettings\");\n        }\n    }\n}\n```\n\nSo far, so what? Well, there are\
    \ two clients to this interface. One is focused only on reading the data, and\
    \ the other is focused on writing the data. Herein lies the problem, as shown\
    \ in Listing 10-23.\n\n# LISTING 10-23 The clients of the interface use the property\
    \ for different purposes.\n\n```\npublic class ReadingController\n{\n    private\
    \ readonly IUserSettings settings;\n\n    public ReadingController(IUserSettings\
    \ settings)\n    {\n        this.settings = settings;\n    }\n\n    public string\
    \ GetTheme()\n    {\n        return settings.Theme;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "```\n```csharp\n// . . .\npublic class WritingController\n{\n    private readonly\
    \ IUserSettings settings;\n\n    public WritingController(IUserSettings settings)\n\
    \    {\n        this.settings = settings;\n    }\n\n    public void SetTheme(string\
    \ theme)\n    {\n        settings.Theme = theme;\n    }\n}\n```\n```\n\nAs is\
    \ to be expected, the ReadingController only uses the getter of the Theme property,\
    \ whereas the WritingController only uses the setter of the Theme property. However,\
    \ due to a lack of segregation, there is nothing to stop the writer from retrieving\
    \ the theme, nor—which is more problematic—the reader from modifying the theme.\n\
    \nTo be truly defensive and eliminate the possibility of interface misuse, you\
    \ can segregate the read and write portions of the interface, as shown in Listing\
    \ 10-24.\n\n**LISTING 10-24**  The interface is split into two parts: one for\
    \ reading the theme, and one for writing it.\n\n```\n```csharp\npublic interface\
    \ IUserSettingsReader\n{\n    string Theme\n    {\n        get;\n    }\n}\n//\
    \ . . .\npublic interface IUserSettingsWriter\n{\n    string Theme\n    {\n  \
    \      set;\n    }\n}\n```\n```\n\nAlthough this might look a little odd, it is\
    \ valid C#. It is perhaps not unusual that an interface can dictate that implementers\
    \ only supply a getter for a property, but it is slightly more unusual that it\
    \ requires only a setter."
  merge: -1
  img_proc: true
- pgno: 338
  md: "Each controller is now able to depend only on the interface that it truly requires.\
    \ As Listing 10-25 shows, the ReadingController is paired with the IUserSettingsReader,\
    \ and the WritingController is paired with the IUserSettingsWriter.\n\n# LISTING\
    \ 10-25 Each of the two controllers now depends only on the interface that it\
    \ requires.\n\n```\npublic class ReadingController\n{\n    private readonly IUserSettingsReader\
    \ settings;\n\n    public ReadingController(IUserSettingsReader settings)\n  \
    \  {\n        this.settings = settings;\n    }\n\n    public string GetTheme()\n\
    \    {\n        return settings.Theme;\n    }\n}\n// ...\npublic class WritingController\n\
    {\n    private readonly IUserSettingsWriter settings;\n\n    public WritingController(IUserSettingsWriter\
    \ settings)\n    {\n        this.settings = settings;\n    }\n\n    public void\
    \ SetTheme(string theme)\n    {\n        settings.Theme = theme;\n    }\n}\n```\n\
    \nVia interface segregation, you have prevented the reader from being able to\
    \ write the user settings, and you have prevented the writer from being able to\
    \ read the user settings. Developers are thus not able to accidentally dilute\
    \ the purpose of the controller by mistakenly performing an operation that they\
    \ should not.\n\nThe implementing class, which uses the ConfigurationManager,\
    \ changes only very subtly, as shown in Listing 10-26.\n\n# LISTING 10-26 The\
    \ UsersSettingsConfig class now implements both interfaces, but clients are unaware.\n\
    \n```\npublic class UserSettingsConfig : IUserSettingsReader, IUserSettingsWriter\n\
    {\n    private const string ThemeSetting = \"Theme\";\n\n    private readonly\
    \ Configuration config;\n```"
  merge: -1
  img_proc: true
- pgno: 339
  md: "```\n```csharp\npublic UserSettingsConfig()\n{\n    config = ConfigurationManager.OpenExeConfiguration(ConfigurationUserLevel.None);\n\
    }\n\npublic string Theme\n{\n    get\n    {\n        return config.AppSettings.Settings[ThemeSetting].Value;\n\
    \    }\n    set\n    {\n        config.AppSettings.Settings[ThemeSetting].Value\
    \ = value;\n        config.Save();\n        ConfigurationManager.RefreshSection(\"\
    appSettings\");\n    }\n}\n```\n```\n\nOther than in the fact that it inherits\
    \ from both reader and writer interfaces, this class is identical to the previous\
    \ version. Remember that this same implementation can easily be passed to both\
    \ the ReadingController and the WritingController, yet the window provided by\
    \ the interface means that the set and get operations, respectively, will not\
    \ be available.\n\nThe requirement that some clients should be able to read without\
    \ writing is particularly likely. The other scenario, where writers are not allowed\
    \ to read, is less likely. In this case, instead of total segregation, you can\
    \ segregate and inherit the interfaces, as shown in Listing 10-27.\n\n# **LISTING\
    \ 10-27** Now using methods, the writer inherits from the reader.\n\n```\n```csharp\n\
    public interface IUserSettingsReader\n{\n    string GetTheme();\n}\n// . . .\n\
    public interface IUserSettingsWriter : IUserSettingsReader\n{\n    void SetTheme(string\
    \ theme);\n}\n```\n```\n\nTo do this, the Theme property had to be converted to\
    \ GetTheme and SetTheme methods. This is because the language doesn’t cleanly\
    \ support property inheritance. The Theme property is present on both interfaces.\
    \ Although classes can cleanly implement the get and set parts of an interface\
    \ from two different interfaces, this is not the case with interface inheritance.\
    \ When property names clash through interface inheritance, the compiler warns\
    \ that the base class property is hidden by the subclass property. This would\
    \ not achieve the result that you want, and the compiler’s suggestion that you\
    \ replace the base class property with the new keyword is not a solution, either—the\
    \ getter would still not be inherited."
  merge: -1
  img_proc: true
- pgno: 340
  md: "Instead, you can change from properties to methods with the same semantic function.\
    \ The GetTheme method is the same as Theme.get, and the SetTheme method is the\
    \ same as Theme.set. Now inheritance works as expected—implementers and clients\
    \ of the reader interface will only have access to the GetTheme method, and implementers\
    \ and clients of the writer interface will have access to both the GetTheme and\
    \ SetTheme methods. Additionally, any implementation of the IUser-SettingsWriter\
    \ interface is also an implementation of the IUserSettingsReader interface.\n\n\
    Listing 10-28 shows a change to the writing controller: it first checks whether\
    \ the theme has been changed before it tries to set a new theme. This is now acceptable\
    \ because the user settings writer service is also the user settings reader service.\
    \ In this case, the two interfaces do not need to be supplied separately to be\
    \ used.\n\n**LISTING 10-28** The writing controller has access to both the getter\
    \ and setter through one interface.\n\n```\npublic class WritingController\n{\n\
    \    private readonly IUserSettingsWriter settings;\n\n    public WritingController(IUserSettingsWriter\
    \ settings)\n    {\n        this.settings = settings;\n    }\n\n    public void\
    \ SetTheme(string theme)\n    {\n        if (settings.GetTheme() != theme)\n \
    \       {\n            settings.SetTheme(theme);\n        }\n    }\n}\n```\n\n\
    # Authorization\n\nAnother example of segregation by client need is when a set\
    \ of operations is only available when the application is in a specific state.\
    \ For example, the operations that a user can perform are typically different\
    \ depending on whether that user is logged in or not.\n\nThe IUnauthorized interface\
    \ shown in Listing 10-29 contains operations that can be done by an anonymous,\
    \ unauthenticated user.\n\n**LISTING 10-29** This interface contains only operations\
    \ that anonymous users can perform.\n\n```\npublic interface IUnauthorized\n{\n\
    \    IAuthorized Login(string username, string password);\n\n    void RequestPasswordReminder(string\
    \ emailAddress);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 341
  md: "Note that the Login method returns an interface. It is returned only when the\
    \ credentials are correct, and it allows clients to perform authorized actions,\
    \ as shown in Listing 10-30.\n\n```\npublic interface IAuthorized\n{\n    void\
    \ ChangePassword(string oldPassword, string newPassword);\n\n    void AddToBasket(Guid\
    \ itemID);\n\n    void Checkout();\n\n    void Logout();\n}\n```\n\nThe operations\
    \ on this interface are available only to a user who has entered his or her credentials\
    \ and is logged in as authenticated.\n\nSegregating interfaces by client need\
    \ prevents programmers from doing something they should not. In this case, it\
    \ prevents them from executing a privileged action with an anonymous user. Of\
    \ course, there are ways around this, but it is hoped that developers will realize\
    \ that they are making a very fundamental change to the application to do something\
    \ that they should not.\n\n# Architectural need\n\nAnother driver of the interface\
    \ segregation principle is architectural design. High-level decisions can have\
    \ a large impact on the low-level organization of the code.\n\nIn this example,\
    \ the decision has been made to have an asymmetric architecture. Like the read/write\
    \ split shown earlier, the IPersistence interface shown in Listing 10-31 contains\
    \ a combination of queries and commands.\n\n```\npublic interface IPersistence\n\
    {\n    IEnumerable<TEntity> GetAll();\n\n    Item GetByID(Guid identity);\n\n\
    \    IEnumerable<TEntity> FindByCriteria(string criteria);\n\n    void Save(Entity\
    \ entity);\n\n    void Delete(Entity entity);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "The asymmetric architecture that this interface is part of is specifically\
    \ CQRS: Command/Query Responsibility Segregation. The recurrence of the word *segregation*\
    \ is no accident here, because this architectural pattern is about to cause you\
    \ to perform some interface segregation.\n\nA first implementation of the `IPersistence`\
    \ interface is shown in Listing 10-32.\n\n# **LISTING 10-32** When commands and\
    \ queries are handled asymmetrically, the implementation is muddled.\n\n```\n\
    public class Persistence : IPersistence\n{\n    private readonly ISession session;\n\
    \    private readonly MongoDatabase mongo;\n\n    public Persistence(ISession\
    \ session, MongoDatabase mongo)\n    {\n        this.session = session;\n    \
    \    this.mongo = mongo;\n    }\n\n    public IEnumerable<Entity> GetAll()\n \
    \   {\n        return mongo.GetCollection<Entity>(\"entities\").FindAll();\n \
    \   }\n\n    public Entity GetByID(Guid identity)\n    {\n        return mongo.GetCollection<Entity>(\"\
    entities\").FindOneById(identity.ToBson());\n    }\n\n    public IEnumerable<Entity>\
    \ FindByCriteria(string criteria)\n    {\n        var query = BsonSerializer.Deserialize<QueryDocument>(criteria);\n\
    \        return mongo.GetCollection<Entity>(\"entities\").Find(query);\n    }\n\
    \n    public void Save(Entity entity)\n    {\n        using(var transaction =\
    \ session.BeginTransaction())\n        {\n            session.Save(entity);\n\n\
    \            transaction.Commit();\n        }\n    }\n\n    public void Delete(Entity\
    \ entity)\n    {\n        using(var transaction = session.BeginTransaction())\n\
    \        {\n            session.Delete(entity);\n\n            transaction.Commit();\n\
    \        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "There are two very different dependencies here: NHibernate is used for commands,\
    \ and MongoDB is used for queries. The former is an Object/Relational Mapper used\
    \ here for storing a domain model. The latter is a document storage library used\
    \ for fast querying. This class has two disparate dependencies and therefore two\
    \ reasons to change. With such different dependencies, it is likely that their\
    \ respective decorators will also be different. Rather than being split into very\
    \ small operations, as the entire CRUD interface was earlier in this chapter,\
    \ this interface will only be split into two parts: commands and queries. Figure\
    \ 10-3 shows a UML class diagram of how this will be orchestrated.\n\nWith the\
    \ commands and queries split between two interfaces, the implementations can depend\
    \ on different packages. The commands implementation will depend only on NHibernate,\
    \ and the queries implementation will depend only on MongoDB.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_343_0.png)\n\
    \n**FIGURE 10-3** Splitting interfaces by architectural need allows implementations\
    \ to have very different dependencies.\n\nIdeally, these two implementations will\
    \ not only be different classes, but those classes will reside in different packages—assemblies—too.\
    \ If not, the problem is only partially alleviated because it will be impossible\
    \ to reuse one implementation without depending on the other, plus the chain of\
    \ dependencies—the NHibernate or Mongo libraries—that comes with it.\n\nListing\
    \ 10-33 shows the interfaces after they have been split. The two can now be implemented\
    \ separately.\n\n**LISTING 10-33** The interface has been split into query and\
    \ command methods.\n\n```\npublic interface IPersistenceQueries\n{\n    IEnumerable<Item>\
    \ GetAll();\n\n    Item GetByID(Guid identity);\n\n    IEnumerable<Item> FindByCriteria(string\
    \ criteria);\n}\n```"
