- pgno: 164
  md: "What the ActLike method is doing is creating a new type at run time by using\
    \ Reflection Emit. This is a powerful part of the .NET Framework Reflection API\
    \ that allows the creation of new types at run time. This new type fulfills the\
    \ IDuck interface, but it also contains the Swan instance as an encapsulated field.\
    \ Whenever one of the IDuck interface methods is called, the new type delegates\
    \ to the Swan instance. It is, in effect, a run-time version of the Adapter pattern.\
    \ Impromptu Interface is an automatic way of creating an Object Adapter.\n\n#\
    \ CLR duck-typing support\n\nInterestingly, the CLR already supports duck-typing.\
    \ Unfortunately, this is only for one uncommon case: implementing something that\
    \ is enumerable. A type that is the target of the foreach loop must conform to\
    \ a certain interface, but that interface is not formalized and can be implemented\
    \ ad hoc on the target class. In the example in Listing 4-24, the Duck class is\
    \ the target of a foreach loop.\n\n**LISTING 4-24** The CLR implicitly supports\
    \ duck-typing for enumerable types.\n\n```\nclass Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        var duck = new Duck();\n\n        foreach\
    \ (var duckling in duck)\n        {\n            Console.WriteLine(\"Quack {0}\"\
    , duckling);\n        }\n\n        Console.ReadKey();\n    }\n}\n```\n\nThe Duck\
    \ does not implement any interface, but the GetEnumerator() method is required\
    \ by the foreach loop, as the compiler instructs, as shown in Figure 4-8.\n\n\
    |  | Description |\n|---|---|\n| ⊗ 1 | foreach statement cannot operate on variables\
    \ of type 'TheInterface.Duck' because 'TheInterface.Duck' does not contain a public\
    \ definition for 'GetEnumerator' |\n\n**FIGURE 4-8** Without requiring a specific\
    \ interface, the compiler complains that a public method is missing from the class.\n\
    \nWhen you implement this method with a void return type, you receive a new error\
    \ stating that this type does not support some other required methods and properties,\
    \ as shown in Figure 4-9."
