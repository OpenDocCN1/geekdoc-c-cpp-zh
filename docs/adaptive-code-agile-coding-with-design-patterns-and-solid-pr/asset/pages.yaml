    \ is instructed to run during installation. This could feasibly be used to do\
    \ almost anything—thanks to the flexibility of Windows PowerShell.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_128_0.png)\n\
    \n**FIGURE 3-16**  The NuGet Package Manager makes it very easy to construct your\
    \ own packages."
