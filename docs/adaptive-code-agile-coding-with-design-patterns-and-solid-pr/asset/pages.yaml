- pgno: 111
  md: "# LISTING 3-6 An example of how instantiating objects prevents code from being\
    \ adaptive.\n\n```\npublic class AccountController\n{\n    private readonly SecurityService\
    \ securityService;\n\n    public AccountController()\n    {\n        this.securityService\
    \ = new SecurityService();\n    }\n\n    [HttpPost]\n    public void ChangePassword(Guid\
    \ userID, string newPassword)\n    {\n        User userRepository = new UserRepository();\n\
    \        var user = userRepository.GetByID(userID);\n        this.securityService.ChangeUsersPassword(user,\
    \ newPassword);\n    }\n}\n```\n\nThe AccountController class is part of a hypothetical\
    \ ASP.NET MVC application. Do not worry too much about the specifics; concentrate\
    \ on the inappropriate object construction, highlighted in bold. The controller's\
    \ responsibility is to allow the user to perform account queries and commands\
    \ through MVC controller actions. There is only one command shown: ChangePassword.\n\
    \nThere are several problems with this code, and they are caused directly by the\
    \ two occurrences of new:\n\n+   - The AccountController is forever dependent\
    \ on the SecurityService and UserRepository implementations.\n+   - Whatever dependencies\
    \ the SecurityService and UserRepository have are now implicit dependencies of\
    \ the AccountController.\n+   - The AccountController is now extremely difficult\
    \ to unit test—the two classes are impossible to mock with conventional methods.\n\
    +   - The SecurityService.ChangeUsersPassword method requires clients to load\
    \ User objects.\n\nThese problems are addressed in greater detail in the following\
    \ sections.\n\n# Inability to enhance the implementations\n\nIf you want to change\
    \ your implementation of the SecurityService, your two options are to change the\
    \ AccountController directly to refer to this new implementation or add the new\
    \ functionality to the existing SecurityService. Throughout this book, you will\
    \ learn why neither option is preferred. For now, consider that the aim is to\
    \ never edit either the AccountController or the SecurityService class after they\
    \ have been created."
  merge: -1
  img_proc: true
- pgno: 112
  md: "# Chain of dependency\n\nThe SecurityService is also likely to have some dependencies\
    \ of its own. By having a default constructor, it is making the bold claim that\
    \ it does not have any dependencies. However, what if the code shown in Listing\
    \ 3-7 is the implementation of the SecurityService constructor?\n\nLISTING 3-7\
    \ The SecurityService has the same problem as the AccountController.\n\n```\n\
    public SecurityService()\n{\n    this.Session = SessionFactory.GetSession();\n\
    }\n```\n\nThis service actually depends on NHibernate, the Object/Relational Mapper,\
    \ which is being used to retrieve a session. The session is NHibernate's analogy\
    \ for a connection to persistent, relational storage, such as Microsoft SQL Server,\
    \ Oracle, or MySQL. As explained earlier in this chapter, this means that the\
    \ AccountController also depends—implicitly—on NHibernate.\n\nFurthermore, what\
    \ if the signature of the SecurityService constructor changes? That is, what if\
    \ it suddenly requires clients to provide the connection string to the database\
    \ that the Session needs? Any client using the SecurityService, including the\
    \ AccountController, would have to be updated to provide the connection string.\
    \ Again, this is a change that you should not have to make.\n\n# Lack of testability\n\
    \nTestability is a very important concern, and it requires code to be designed\
    \ in a certain fashion. If it is not, testing is extremely difficult. Unfortunately,\
    \ neither the AccountController nor the SecurityService is easily tested. This\
    \ is because you cannot replace their dependencies with fake versions that do\
    \ not perform any action. For example, when testing the SecurityService, you do\
    \ not want it to make any connections to the database. That would be needless\
    \ and slow, and would introduce another large failure point in the test: what\
    \ if the database is unavailable? There are ways to test these classes by replacing\
    \ their dependencies at run time with fakes. Tools such as Microsoft Moles and\
    \ Typemock can hook into constructors and ensure that the objects that they return\
    \ are fakes. But that is an example of treating the symptoms and not the cause.\n\
    \n# More inappropriate intimacy\n\nThe AccountController.ChangePassword method\
    \ creates a UserRepository class to retrieve a User instance. It only needs to\
    \ do this because that is what the SecurityService.ChangeUsersPassword method\
    \ demands of it. Without a User instance, the method cannot be called. This is\
    \ indicative of a badly designed method interface. Instead of requiring all clients\
    \ to retrieve a User, the SecurityService should, in this case, retrieve the User\
    \ itself. The two methods would then look like Listing 3-8."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# LISTING 3-8 An improvement is made to all clients of SecurityService.\n\n\
    ```\n[HttpPost]\npublic void ChangePassword(Guid userID, string newPassword)\n\
    {\n    this.securityService.ChangeUsersPassword(userID, newPassword);\n}\n//...\n\
    public class SecurityService\n{\n    public void ChangeUsersPassword(Guid userID,\
    \ string newPassword)\n    {\n        var userRepository = new UserRepository();\n\
    \        var user = userRepository.GetByID(userID);\n        user.ChangePassword(newPassword);\n\
    \    }\n}\n```\n\nThis is definitely an improvement for the AccountController,\
    \ but the ChangeUsersPassword method is still directly instantiating the UserRepository.\n\
    \n# Alternatives to object construction\n\nWhat would improve the AccountController\
    \ and SecurityService—or any other example of inappropriate object construction?\
    \ How can they be made demonstrably correct so that none of the aforementioned\
    \ problems apply? There are a few options, all complementary, that you can choose\
    \ from.\n\n# Coding to an interface\n\nThe first and most important change that\
    \ you should make is to hide the implementation of SecurityService behind an interface.\
    \ This allows the AccountController to depend only on the interface, and not on\
    \ the implementation, of SecurityService. The first refactor is to extract an\
    \ interface out of SecurityService, as shown in Listing 3-9.\n\n# LISTING 3-9\
    \ Extracting an interface from SecurityService.\n\n```\npublic interface ISecurityService\n\
    {\n    void ChangeUsersPassword(Guid userID, string newPassword);\n}\n//...\n\
    public class SecurityService : ISecurityService\n{\n    public ChangeUsersPassword(Guid\
    \ userID, string newPassword)\n    {\n        //...\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: "The next step is to update the client so that it no longer depends on the SecurityService\
    \ class, but rather on the ISecurityService interface. Listing 3-10 shows this\
    \ refactor applied to the AccountController.\n\n# LISTING 3-10 The AccountController\
    \ now uses the ISecurityService interface.\n\n```\npublic class AccountController\n\
    {\n    private readonly ISecurityService securityService;\n\n    public AccountController()\n\
    \    {\n        this.securityService = new SecurityService();\n    }\n\n    [HttpPost]\n\
    \    public void ChangePassword(Guid userID, string newPassword)\n    {\n    \
    \    securityService.ChangeUsersPassword(user, newPassword);\n    }\n}\n```\n\n\
    This example is not yet complete—you are still dependent on the SecurityService\
    \ implementation because of its constructor. The concrete class is still being\
    \ instantiated in the constructor of AccountController. To separate the two classes\
    \ completely, you need to make a further refactor: introduce dependency injection\
    \ (DI).\n\n# Using dependency injection\n\nThis is a large topic that cannot be\
    \ covered in a small amount of space. In fact, Chapter 12, \"Dependency injection,\"\
    \ is devoted to the subject, and there are entire books dedicated to it. Luckily,\
    \ DI is not particularly complex or difficult, so the basics can be covered here\
    \ from the point of view of classes that make use of DI. Listing 3-11 shows another\
    \ refactor that has been applied to the constructor of the AccountController class.\
    \ The constructor is the only change here, highlighted in bold. It is a very minor\
    \ change as far as this class is concerned, but it makes a huge difference to\
    \ your ability to manage dependencies. Rather than constructing the SecurityService\
    \ class itself, the AccountController now requires some other class to provide\
    \ it with an ISecurityService implementation. Not only that, a precondition has\
    \ been introduced to the constructor that prevents its clients from passing in\
    \ a null value for the securityService parameter. This ensures that, when you\
    \ use the securityService field in the ChangePassword method, you are guaranteed\
    \ to have a valid instance and do not have to check for null anywhere else."
  merge: -1
  img_proc: true
- pgno: 115
  md: "# LISTING 3-11 Using dependency injection allows you to remove the dependency\
    \ on the SecurityService class.\n\n```\npublic class AccountController\n{\n  \
    \  private readonly ISecurityService securityService;\n\n    public AccountController(ISecurityService\
    \ securityService)\n    {\n        if(securityService == null) throw new ArgumentNullException(\"\
    securityService\");\n        this.securityService = securityService;\n    }\n\n\
    \    [HttpPost]\n    public void ChangePassword(Guid userID, string newPassword)\n\
    \    {\n        this.securityService.ChangeUsersPassword(user, newPassword);\n\
    \    }\n}\n```\n\nThe SecurityService also needs to follow suit and apply dependency\
    \ injection. Listing 3-12 shows how it looks after refactoring.\n\n# LISTING 3-12\
    \ Dependency injection is a ubiquitous pattern that can be applied liberally almost\
    \ everywhere.\n\n```\npublic class SecurityService : ISecurityService\n{\n   \
    \ private readonly IUserRepository userRepository;\n\n    public SecurityService(IUserRepository\
    \ userRepository)\n    {\n        if(userRepository == null) throw new ArgumentNullException(\"\
    userRepository\");\n        this.userRepository = userRepository;\n    }\n\n \
    \   public ChangeUsersPassword()\n    {\n        var user = userRepository.GetByID(userID);\n\
    \        user.ChangePassword(newPassword);\n    }\n}\n```\n\nJust as the AccountController\
    \ enforces its dependency on a valid ISecurityService instance, so too does the\
    \ SecurityService enforce its dependency on a valid IUserRepository—by throwing\
    \ an exception if it is given a null reference on construction. Similarly, the\
    \ UserRepository class dependency has been entirely removed, in favor of an IUserRepository\
    \ interface."
  merge: -1
  img_proc: true
- pgno: 116
  md: "# Resolving dependencies\n\nKnowing how to arrange your projects and the dependencies\
    \ that they have will not help when it comes to debugging a dependency between\
    \ assemblies. Sometimes assemblies are not available at run time and it becomes\
    \ necessary to find out why.\n\n# Assemblies\n\nThe Common Language Runtime (CLR),\
    \ which is the virtual machine that the .NET Framework uses to execute code instructions,\
    \ is a software product like any other and has been programmed to behave in a\
    \ predictable and logical way when hosting applications. A good grounding in the\
    \ theory and practice of how assemblies are resolved and how errors in resolution\
    \ can be fixed is very useful. A little knowledge can go a long way when you need\
    \ to track down a problem with finding assemblies.\n\n**Resolution process** \
    \ The assembly resolution process is an important facet of the CLR. This covers\
    \ the gap between adding a reference to an assembly or project and having the\
    \ application running with this assembly loaded. There are several steps involved,\
    \ and little more is needed than an overview so that, when something goes wrong\
    \ during the process, you can reason about the probable causes of the problem.\n\
    \nFigure 3-12 shows the assembly resolution process as a flow chart. This flow\
    \ chart is at a high level and does not include every detail, but there is enough\
    \ to show the headline items in the process. The process is as follows:\n\n+ \
    \  - The CLR uses a just-in-time (JIT) model to resolve assemblies. As was already\
    \ proven earlier in the chapter, the references contained in an application are\
    \ not resolved as you start up the application, but rather when you first make\
    \ use of a feature of that assembly—literally just in time.\n+   \n+   - Each\
    \ assembly has an identity that is a composite of its name, version, culture,\
    \ and public key token. Features such as binding redirects can change this identity,\
    \ so determining it is not quite as simple as it might seem.\n+   \n+   - When\
    \ the assembly’s identity has been established, the CLR is able to determine whether\
    \ it has already attempted to resolve this dependency previously during the current\
    \ execution of the application.\n+   \n+   - Asking this question causes the CLR\
    \ to branch depending on the answer. If you have attempted to resolve this assembly,\
    \ that process has either already succeeded or failed. If it succeeded, the CLR\
    \ can use the assembly that has already been loaded, and it exits early. If not,\
    \ the CLR knows that it need not continue attempting to resolve this assembly\
    \ because it will fail.\n+   \n+   - Alternatively, if this is the first attempt\
    \ to resolve the assembly, the CLR first checks the global assembly cache (GAC).\
    \ The GAC is a machine-wide assembly repository that allows multiple versions\
    \ of the same assembly to be executed in the same application. If the assembly\
    \ is found in the GAC, the resolution process is successful and the discovered\
    \ assembly is loaded. So you now know that, because the GAC is searched first,\
    \ the presence of an applicable assembly in the GAC will take precedence over\
    \ an assembly on the file system."
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   - If the assembly could not be found in the GAC, the CLR starts probing
    a variety of directories in search of it. The directories searched depend on the
    app.config settings. If there is a code-base element in the app.config, that location
    is checked—and if the assembly is not found—no other locations are subsequently
    checked. However, the default is for the application’s root directory to be searched,
    which is typically the /bin folder that relates to the entry point or web application.
    If the assembly cannot be found there, the resolution process fails and an exception
    is thrown by the CLR. Typically, this results in the termination of the application.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_117_0.png)


    **FIGURE 3-12** A brief overview of the assembly resolution process.


    **The Fusion log**  This is a very useful tool for debugging failed attempts by
    the CLR to bind to an assembly at run time. Rather than trying to step through
    the application in the Visual Studio debugger, it is better to turn Fusion on
    and read the log file that results.


    To enable Fusion you must edit the Windows registry, as shown in the following
    code.


    ```

    HKLM\Software\Microsoft\Fusion\ForceLog 1

    HKLM\Software\Microsoft\Fusion\LogPath C:\FusionLogs

    ```'
  merge: -1
  img_proc: true
