- pgno: 122
  md: "To become discoverable, all a service needs to do is add the ServiceDiscovery\
    \ behavior and host a DiscoveryEndpoint. In this example, the UdpDiscoveryEndpoint\
    \ is used for receiving multicast network messages from clients.\n\n> Note Service\
    \ Discovery in WCF complies with the WS-Discovery standard. This makes it interoperable\
    \ with different platforms and languages, not just the .NET Framework.\n\nClients\
    \ make use of the DiscoveryClient class to find a discoverable service, which\
    \ also needs a DiscoveryEndpoint. The Find method is then called with a configured\
    \ FindCriteria instance, which describes the attributes of the service to be found.\
    \ Find returns a FindResponse instance that contains an Endpoints property—a collection\
    \ of EndpointDiscoveryMetadata instances, one per matching service. Listing 3-17\
    \ shows these steps to find a discoverable service.\n\n# LISTING 3-17 Service\
    \ Discovery is a good way to decouple code.\n\n```\nclass Program\n{\n    private\
    \ const int a = 11894;\n    private const int b = 27834;\n\n    static void Main(string[]\
    \ args)\n    {\n        var foundEndpoints = FindEndpointsByContract<ICalculator>();\n\
    \n        if (!foundEndpoints.Any())\n        {\n            Console.WriteLine(\"\
    No endpoints were found.\");\n        }\n        else\n        {\n           \
    \ var binding = new BasicHttpBinding();\n            var channelFactory = new\
    \ ChannelFactory<ICalculator>(binding);\n            foreach (var endpointAddress\
    \ in foundEndpoints)\n            {\n                var service = channelFactory.CreateChannel(endpointAddress);\n\
    \                var additionResult = service.Add(a, b);\n                Console.WriteLine(\"\
    Service Found: {0}\", endpointAddress.Uri);\n                Console.WriteLine(\"\
    {0} + {1} = {2}\", a, b, additionResult);\n            }\n        }\n\n      \
    \  Console.ReadKey();\n    }\n\n    private static IEnumerable<EndpointAddress>\
    \ FindEndpointsByContract\n        <TServiceContract>()\n    {\n        var discoveryClient\
    \ = new DiscoveryClient(new UdpDiscoveryEndpoint());\n        var findResponse\
    \ = discoveryClient.Find(new FindCriteria(typeof(TServiceContract)));\n      \
    \  return findResponse.Endpoints.Select(metadata => metadata.Address);\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "Bear in mind that with UDP (User Datagram Protocol), as opposed to TCP, there\
    \ is no guarantee of message delivery. It is possible for datagrams to be lost\
    \ in transmission, so either the request might not reach a viable service or the\
    \ response might not make it back to the client. In either scenario, it would\
    \ appear to the client that there wasn’t a service available to handle the request.\n\
    \n> Tip When hosting a discoverable service in Internet Information Services (IIS)\
    \ or Windows Process Activation Service (WAS), ensure that you use the Microsoft\
    \ AppFabric AutoStart functionality. Discoverability depends on the availability\
    \ of the service, meaning that it must be running in order to receive queries\
    \ from clients. AppFabric AutoStart allows the service to run when the application\
    \ is started in IIS. Without AutoStart, the service is not started until the first\
    \ request is made.\n\n# RESTful services\n\nThe most compelling reason to create\
    \ RESTful services (REST: REpresentational State Transfer) is the very low dependency\
    \ burden expected of clients. All that is needed is an HTTP client, which is commonly\
    \ provided by the frameworks and libraries of languages. This makes RESTful services\
    \ ideal for developing services that need to have wide-ranging, cross-platform\
    \ support. For example, both Facebook and Twitter have REST APIs for various queries\
    \ and commands. This ensures that clients can be developed for a large number\
    \ of platforms: Windows Phone 10, iPhone, Android, iPad, Windows 10, Linux, and\
    \ much more. Having a single implementation that can service all of these clients\
    \ would be more difficult without the very low dependency requirements that REST\
    \ allows.\n\nThe ASP.NET Web API is used for creating REST services that use the\
    \ .NET Framework. Similar to the ASP.NET MVC framework, it allows developers to\
    \ create methods that map directly to web requests. The Web API provides a base\
    \ controller class called ApiController. You inherit from this controller and\
    \ add methods named like the HTTP verbs: GET, POST, PUT, DELETE, HEAD, OPTIONS,\
    \ and PATCH. Whenever an HTTP request arrives using one of these verbs, the corresponding\
    \ method is called. Listing 3-18 shows an example of a service that implements\
    \ all of these verbs.\n\n# LISTING 3-18 Almost all of the HTTP verbs are supported\
    \ by the ASP.NET Web API.\n\n```\npublic class ValuesController : ApiController\n\
    {\n    public IEnumerable<string> Get()\n    {\n        return new string[] {\
    \ \"value1\", \"value2\" };\n    }\n\n    public string Get(int id)\n    {\n \
    \       return \"value\";\n    }\n\n    public void Post([FromBody]string value)\n\
    \    {\n    }\n\n```"
  merge: -1
  img_proc: true
- pgno: 124
  md: "```\npublic void Put(int id, [FromBody]string value)\n{\n}\n\npublic void Head()\n\
    {\n}\n\npublic void Options()\n{\n}\n\npublic void Patch()\n{\n}\n\npublic void\
    \ Delete(int id)\n{\n}\n}\n```\n\nListing 3-19 shows the client code for accessing\
    \ the GET and POST methods of this service, using the HttpClient class. Although\
    \ this is by no means the only way to access REST services in the .NET Framework,\
    \ it relies on only the framework itself.\n\n# LISTING 3-19 Clients can use the\
    \ HttpClient class to access RESTful services.\n\n```\nclass Program\n{\n    static\
