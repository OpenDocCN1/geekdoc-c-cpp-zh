    # Continuous integration


    Whenever a developer''s code is pushed to a central repository, it is common for
    that code to be compiled on the server. This continuous integration of developers''
    changes provides invaluable feedback about the state of the code base. If the
    source fails to compile, it has failed to meet the first prerequisite to the pull
    request being accepted: without a working build, the request will be summarily
    denied.


    However, compiling the code is often insufficient to confirm that the developer
    has not broken anything as they were fixing a defect or implementing a new feature.
    Thus, after compiling the code, the CI server runs all unit tests, and then checks
    that enough of the code is covered by unit tests. After that, it might even attempt
    to generate deployment packages from the output of the build.


    All of these steps are carried out serially, with the success of each step being
    a requirement for continuing with the build process. There is no value in running
    unit tests if the code won''t compile; similarly, it makes no sense to check unit
    test coverage if the unit tests failed, or to generate deployment packages if
    the unit test coverage was insufficient. A CI server set up to build each pushed
    branch in this way relieves developers of a great burden. Instead of taking the
    significant additional time that such checks add to their'
  merge: -1
  img_proc: true
