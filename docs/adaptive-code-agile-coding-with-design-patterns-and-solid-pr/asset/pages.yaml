- pgno: 190
  md: "# **LISTING 5-17** Mocking frameworks such as Moq allow you to create mocks\
    \ very easily.\n\n```\n```csharp\n[TestMethod]\npublic void AddingTransactionToAccountDelegatesToAccountInstance()\n\
    {\n    // Arrange\n    var account = new Account();\n    var mockRepository =\
    \ new Mock<IAccountRepository>();\n    mockRepository.Setup(r => r.GetByName(\"\
    Trading Account\")).Returns(account);\n    var sut = new AccountService(mockRepository.Object);\n\
    \n    // Act\n    sut.AddTransactionToAccount(\"Trading Account\", 200m);\n\n\
    \    // Assert\n    Assert.AreEqual(200m, account.Balance);\n}\n```\n```\n\nThe\
    \ changes to the test are highlighted in bold. Rather than instantiating your\
    \ own fake repository, you now create a new Mock<IAccountRepository> object. This\
    \ object is very powerful and allows you to set all sorts of expectations and\
    \ behavior on your mocked interfaces. This class does not implement your interface,\
    \ so, unlike your fake, it is not directly a viable instance of the IAccountRepository.\
    \ This is because the Common Language Runtime (CLR) does not allow classes to\
    \ inherit from generic parameters. Instead, there is a composition relationship\
    \ between the mock and the proxy instance that it creates. The object property\
    \ allows you to access the underlying mocked interface, which is passed in to\
    \ the AccountService in this example.\n\nBefore you provide your mock to the SUT,\
    \ you need to specify how it should behave. By default, Moq defines loose mocks,\
    \ which means that all of their return values are default. The default for any\
    \ reference type is null, and this applies to the Account class. The alternative\
    \ to the loose mock is the *strict* mock, which will throw an exception whenever\
    \ it is faced with a method call or property access that you have not already\
    \ specified. Neither of these options is what you need, so you have to set up\
    \ some expected behavior manually.\n\nThe Setup method of a Mock instance is very\
    \ clever. It accepts a lambda expression that provides an instance of the underlying\
    \ mocked type as a context parameter. By calling a method on the type, you specify\
    \ that you want something to happen when the method is called, with the exact\
    \ arguments provided. What you choose to specify depends on your test situation.\
    \ Moq lets you set the following expectations on a method call:\n\n+   - Call\
    \ some other lambda expression.\n+   - Return a specified value.\n+   - Throw\
    \ a specified type of exception.\n+   - Verify that this method was called."
  merge: -1
