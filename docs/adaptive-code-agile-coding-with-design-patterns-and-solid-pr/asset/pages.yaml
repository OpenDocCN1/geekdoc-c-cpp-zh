- pgno: 373
  md: '# Dependency injection


    **After completing this chapter, you will be able to**


    +   - Understand the importance of dependency injection.

    +   - Use dependency injection as the glue that holds SOLID code together.

    +   - Choose between Poor Man’s Dependency Injection, an Inversion of Control
    container, or convention over configuration.

    +   - Avoid dependency injection anti-patterns.

    +   - Organize your solutions around composition roots and resolution roots.

    +   - Know how the Factory pattern collaborates with dependency injection to manage
    object lifetimes correctly.


    Dependency injection (DI) is a very simple concept with a simple implementation.
    However, this simplicity belies the importance of the pattern. DI is the glue
    without which the techniques of the previous SOLID chapters—and much of the Agile
    foundation chapters—would not be possible.


    When something is so simple, yet so important, there is a tendency to overcomplicate.
    DI is no exception, but there are a number of pitfalls that you should be aware
    of. These include anti-patterns and general bad practices that subvert the intent
    of this pattern.


    Implemented correctly, dependency injection is invisible to the majority of a
    project’s code. It is limited to a very small amount of the code, often in a single
    assembly. The trick is to plan for dependency injection from the outset, because
    integrating it into an established project is difficult and time consuming.


    # Humble beginnings


    The following example highlights the underlying problem that dependency injection
    solves. Imagine that you are developing a task management application that allows
    the user to manage a to-do list. In this hypothetical scenario, you are still
    in the early stages of development, using Windows Presentation Foundation (WPF)
    for the user interface. So far, you have a main window for the application that
    does little other than show the current state of your to-do list, which is read
    from persistent storage.'
  merge: -1
  img_proc: true
- pgno: 374
  md: "Figure 12-1 shows this window.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_374_0.png)\n\
    \nFIGURE 12-1 The task list has some state beyond the task description: priority,\
    \ due date, and the task’s completion state.\n\nBecause this is a WPF application,\
    \ you are using the Model-View-ViewModel (MVVM) pattern to ensure a separation\
    \ of concerns between the layers. The application strives to use best practices—although\
    \ dependency injection is still to come. One of the view models is the backing\
    \ controller for the main window. TaskListController delegates to a TaskService\
    \ to retrieve all of the tasks. An example of how this is currently accomplished\
    \ without dependency injection is shown in Listing 12-1.\n\n# LISTING 12-1 This\
    \ controller does not use dependency injection.\n\n```\npublic class TaskListController\n\
    {\n    public event PropertyChangedEventHandler PropertyChanged = delegate ();\n\
    \n    private readonly ITaskService taskService;\n    private readonly IObjectMapper\
    \ mapper;\n    private ObservableCollection<TaskViewModel> allTasks;\n\n    public\
    \ TaskListController()\n    {\n        this.taskService = new TaskServiceAdo();\n\
    \        this.mapper = new MapperAutoMapper();\n\n        var taskDtos = taskService.GetAllTasks();\n\
    \        AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumerable<TaskViewModel>>((taskDtos));\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 375
  md: "```\npublic ObservableCollection<TaskViewModel> AllTasks\n{\n    get\n    {\n\
    \        return allTasks;\n    }\n    set\n    {\n        allTasks = value;\n\
    \        PropertyChanged(this, new PropertyChangedEventArgs(\"AllTasks\"));\n\
    \    }\n}\n```\n\nThe problems with this approach include:\n\n+   - Difficulty\
    \ in unit testing the controller due to a dependency on an implementation.\n+\
    \   - Lack of clarity as to what this view model requires—depends on—unless its\
    \ source is checked.\n+   - Implied dependency from this class to the dependencies\
    \ of the service.\n+   - Lack of flexibility in providing alternative service\
    \ implementations.\n\nThe rest of this section investigates these problems in\
    \ greater depth by comparing the original class with a refactored version that\
    \ uses dependency injection, as shown in Listing 12-2. (The changes have been\
    \ highlighted in bold.)\n\n# LISTING 12-2 After refactoring, this controller uses\
    \ dependency injection.\n\n```\npublic class TaskListController : INotifyPropertyChanged\n\
    {\n    public event PropertyChangedEventHandler PropertyChanged = delegate {};\n\
    \n    private readonly ITaskService taskService;\n    private readonly IObjectMapper\
    \ mapper;\n    private ObservableCollection<TaskViewModel> allTasks;\n\n    public\
    \ TaskListController(ITaskService taskService, IObjectMapper mapper)\n    {\n\
    \        this.taskService = taskService;\n        this.mapper = mapper;\n    }\n\
    \n    public void OnLoad()\n    {\n        var taskDtos = taskService.GetAllTasks();\n\
    \        AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumerable<TaskViewModel>>(taskDtos));\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 376
  md: "```\npublic ObservableCollection<TaskViewModel> AllTasks\n{\n    get\n    {\n\
    \        return allTasks;\n    }\n    set\n    {\n        allTasks = value;\n\
    \        PropertyChanged(this, new PropertyChangedEventArgs(\"AllTasks\"));\n\
    \    }\n}\n```\n\nTo unit test the first class in isolation, the TaskService would\
    \ need to be mocked. However, it is unlikely that the TaskService can be mocked\
    \ by conventional means. It is not likely to be a proxiable class, nor should\
    \ you be forced to make it so. The second class accepts an ITaskService, which\
    \ is an interface, rather than a class. This is more testable because interfaces\
    \ are always proxiable.\n\n> Note A class is said to be proxiable if an alternative\
    \ implementation—known as a proxy—can be provided to the client. In C#, classes\
    \ are only proxiable if they declare all their methods as virtual. Interfaces,\
    \ on the other hand, are always proxiable.\n\nIf a class arbitrarily constructs\
    \ classes inside its methods, you cannot know externally what it requires in order\
    \ to function correctly. The first example, without DI, is a black box of dependencies.\
    \ You can only discover what it needs by opening the class file and reading it.\
    \ The class declares none of its dependencies as part of its interface or method\
    \ signatures. The second example, with DI, clearly states that it needs an implementation\
    \ of the task service in order to function. This is discoverable from client code\
    \ by using IntelliSense, which is a feature of Microsoft Visual Studio.\n\nWhen\
    \ a dependency exists between class A and class B, if class B has a dependency\
    \ on class C, it follows that class A is implicitly dependent on class C. This\
    \ is how the Entourage anti-pattern manifests and leads to an interconnected web\
    \ of dependencies that are very difficult to rectify. If you ensure that your\
    \ interfaces generalize—that is, that they correctly abstract their behavior—a\
    \ class that depends on an interface does not depend on anything further. This\
    \ holds true even though implementations of the interface might depend on something\
    \ heavy and external, such as a database. This is the Stairway pattern correctly\
    \ applied.\n\nWhen objects are instantiated directly, you also lose a possible\
    \ extension point that an interface would otherwise provide. You cannot inherit\
    \ from the TaskService and enhance its methods—even if they are declared virtual—because\
    \ you would have to amend the controller to directly construct a new instance\
    \ of this subclass. Interfaces lend themselves to all sorts of interesting patterns\
    \ that can be used to provide alternative implementations or enhance the existing\
    \ implementation. Additionally, as you have learned, this can be done after the\
    \ initial version of the class has been written, before new requirements have\
    \ been discovered. This is the key to code adaptability."
