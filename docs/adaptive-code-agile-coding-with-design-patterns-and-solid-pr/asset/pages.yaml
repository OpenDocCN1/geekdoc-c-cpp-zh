  md: 'The Modules window now shows that the MessagePrinter.dll assembly has been
    loaded, because there is no way to construct an instance of the MessagePrintingService
    without pulling the contents of the assembly into memory.


    You can prove this if you delete the MessagePrinter.dll from the bin directory
    and run the application again. An exception is thrown this time.


    ```

    Unhandled Exception: System.IO.FileNotFoundException: Could not load file or assembly
    ''MessagePrinter, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null'' or one
    of its dependencies. The system cannot find the file specified.

    ```


    # Framework dependencies


    The dependency shown in the previous section is called a first-party dependency.
    Both the console application and the class library on which it depends belong
    to the same Visual Studio solution. This means that the dependency should always
    be accessible, because the dependency project can always be rebuilt from the source
    code if necessary. It also means that you can modify the source code of first-party
    dependencies.


    Both projects have other dependencies in the form of .NET Framework assemblies.
    These are not part of the project but are expected to be available. Each .NET
    Framework assembly is built for a specific version of the framework: 1, 1.1, 2,
    3.5, 4, 4.5, and so on. Some .NET Framework assemblies are new to a particular
    version and cannot be referenced by projects that are using an earlier version
    of the .NET Framework. Other assemblies change from version to version of the
    .NET Framework.


    The SimpleDependency project has several references to the .NET Framework, as
    shown earlier in Figure 3-3. Many of these dependencies are defaults that are
    added to all console application projects. The example application doesn’t use
    them, so they can be safely removed. In fact, for both projects, everything except
    System and System.Core are superfluous, so they can be removed from the references
    list. The application will still run correctly.


    By removing unnecessary framework dependencies, you make it easier to visualize
    the dependencies required by each project.


    # Framework assemblies always load


    It is worth noting that, unlike other dependencies, references to .NET Framework
    assemblies will always cause those assemblies to load. Even if you are not really
    using an assembly, it will still load at application startup. Fortunately, if
    multiple projects in the solution all reference the same assembly, only one instance
    of this assembly is loaded into memory (per AppDomain), and it is shared among
    all dependents.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "The default references for a project vary depending on the project type. Each\
    \ project type has a project template that lists the references required. This\
    \ is how a Windows Forms application references the System.Windows.Forms assembly,\
    \ whereas a Windows Presentation Foundation application references WindowsBase,\
    \ PresentationCore, and PresentationFramework.\n\nListing 3-4 shows the references\
    \ for a console application. All Visual Studio project templates are located under\
    \ the Visual Studio installation directory root /Common7/IDE/ProjectTemplates/\
    \ and are grouped by language.\n\n# LISTING 3-4 Part of a Visual Studio project\
    \ template for conditionally referencing different assemblies.\n\n```\n<ItemGroup>\n\
    \  <Reference Include=\"System\"/>\n  $if $(targetframeworkversion$ >= 3.5)\n\
    \    <Reference Include=\"System.Core\"/>\n    <Reference Include=\"System.Xml.Linq\"\
    />\n    <Reference Include=\"System.Data.DataSetExtensions\"/>\n  $endif\n  $if\
    \ $(targetframeworkversion$ >= 4.0)\n    <Reference Include=\"Microsoft.CSharp\"\
    />\n  $endif\n  <Reference Include=\"System.Data\"/>\n  <Reference Include=\"\
    System.Xml\"/>\n</ItemGroup>\n```\n\nThere is some logic in these files that can\
    \ alter how the template generates a real project instance. Specifically, the\
    \ references differ depending on the version of the .NET Framework that is being\
    \ used for the resulting project. Here, the Microsoft.CSharp assembly is referenced\
    \ only if the project is targeting .NET Framework 4 or higher. This makes sense,\
    \ because it is normally required only if you use the dynamic keyword that was\
    \ introduced in the .NET Framework 4.\n\n# Third-party dependencies\n\nThe final\
    \ type of dependency is that of assemblies developed by third-party developers.\
    \ Typically, if something is not provided by the .NET Framework, you can implement\
    \ a solution yourself by creating first-party dependencies. This could be a laborious\
    \ task depending on the size of the solution required. Instead, you can elect\
    \ to use third-party solutions. As an example, you are unlikely to want to implement\
    \ your own Object/Relational Mapper (ORM), because such a large piece of infrastructural\
    \ code could take months to be functional and years to be complete. Instead, you\
    \ could look first to Entity Framework, which is part of the .NET Framework. If\
    \ that did not meet your needs, you could look instead at NHibernate, which is\
    \ a mature ORM library that has been extensively tested."
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The main reason to use a third-party dependency is to exchange the effort required
    for implementing some features or infrastructure for the effort of integrating
    something that is already written and suitable for the job. Do not forget that
    this integration effort could still be significant, depending on the structure
    of both your first-party code and the interface of the third-party code. When
    your aim is to deliver increments of business value on an iterative basis—as in
    Agile—using third-party libraries allows you to maintain this focus.


    The simplest way to organize dependencies that are external to your project and
    the .NET Framework is to create a solution folder called Dependencies under the
    Visual Studio solution of a project and to add the .dll files to that folder.
    When you want to add references to these assemblies to the projects of the solution,
    you can do so by browsing to the files in the Reference Manager dialog box (shown
    in Figure 3-5).


    ![](img/f852e0a12c174e64d91a8e1a05146eab_103_0.png)


    FIGURE 3-5 Third-party references can be stored in a Dependencies folder in the
    Visual Studio solution.


    The other advantage of this approach is that all of the external dependencies
    are stored in source control. This allows other developers to receive the dependencies
    just by retrieving the latest version of the source from a central repository.
    This is a much simpler approach than requiring all of the developers to install
    or download the files themselves.


    A better way to organize third-party dependencies is demonstrated later in this
    chapter, in the "Dependency management with NuGet" section. In brief, the NuGet
    dependency management tool manages a project''s third-party dependencies for you,
    including downloading a package containing all relevant artifacts, referencing
    assemblies, and upgrading library versions.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Modeling dependencies in a directed graph


    A graph is a mathematical construct that consists of two distinct elements: nodes
    and edges. An edge can only exist between two nodes and serves to connect them
    in some way. Any node can be connected to any number of the other nodes in a graph.
    A graph can be one of several types, depending on variations in the graph’s properties.
    For example, the graph in Figure 3-6 shows edges that are directionless: the edge
    between nodes A and C is neither from A to C nor from C to A—the presence of the
    edge is all that matters. This is called an undirected graph.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_104_0.png)


    **FIGURE 3-6** A graph consists of nodes that are connected by edges.


    If, as in Figure 3-7, the edges have arrowheads at one end, you can determine
    the direction of the edges. There is an edge from A to C, but not an edge from
    C to A. This is called a *directed graph*, or a *digraph*.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_105_0.png)


    **FIGURE 3-7** The edges of this graph are specifically directed, so there is
    no edge (B,A), yet the edge (A,B) exists.


    There are many areas of software engineering in which graphs are excellent models,
    but graphs are particularly applicable to modeling code dependencies. As you have
    already learned, dependencies consist of two entities with a direction applied
    from the dependent code to the dependency. You can think of the entities as nodes
    and draw a directed edge from dependent to dependency. When you extend this to
    the rest of the entities, you form a *dependency digraph*.


    This structure can be applied at several different granularities, as Figure 3-8
    shows. The nodes in the graph could represent the classes in a project, different
    assemblies, or groups of assemblies that form a subsystem. In all cases, the arrows
    between the nodes represent the dependencies between components. The source of
    the arrow is the dependent component and the target of the arrow is the dependency.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "![](img/f852e0a12c174e64d91a8e1a05146eab_106_0.png)\n\nDevices are clients\
    \ to the internet, which provides many services.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_106_1.png)\n\
    \nPackages (assemblies and namespaces) are clients and services.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_106_2.png)\n\
    \nService classes are used by client classes.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_106_3.png)\n\
    \nSome services are hidden behind interfaces.\n\n```\n```csharp\npublic void Client()\n\
    {\n    int x = 6;\n    Console.WriteLine(\"{0} = {1}\", x, Service(x));\n}\n```\n\
    ```\n\nEven down at the method level, a method that calls another method is the\
    \ client of a service.\n\n# **FIGURE 3-8** Dependencies at all levels can be modeled\
    \ as graphs.\n\nFor each node at a coarse-grained granularity, there is a set\
    \ of nodes at a more fine-grained granularity. Inside subsystems are assemblies;\
    \ inside assemblies are classes; inside classes are methods. This exemplifies\
    \ how a dependency on a single method can pull in a whole subsystem of chained\
    \ dependencies.\n\nHowever, with all of these examples, you do not know what *sort*\
    \ of dependency you are dealing with (inheritance, aggregation, composition, or\
    \ association), just that there is a dependency. This is still useful, because\
    \ managing dependencies only requires knowledge of the binary relationship between\
    \ two entities: *is there a dependency or not?*"
