    \ two reasons: First, no context needs to be provided, because the original conditional\
    \ test accepted no arguments. However, I could have used a Func<bool> delegate\
    \ to model a context-free predicate, which brings me to the second reason: *delegates\
    \ are not as versatile as interfaces*. By modeling an IPredicate, I will be able\
