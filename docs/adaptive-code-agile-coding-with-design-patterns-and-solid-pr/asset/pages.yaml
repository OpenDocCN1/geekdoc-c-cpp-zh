- pgno: 310
  md: "Listing 9-22 shows an example of this.\n\n# LISTING 9-22 Make base classes\
    \ generic to take advantage of covariance and allow subclasses to override the\
    \ return type.\n\n```\npublic interface IEntityRepository<TEntity>\n    where\
    \ TEntity : Entity\n{\n    TEntity GetByID(Guid id);\n}\n// ...\npublic class\
    \ UserRepository : IEntityRepository<User>\n{\n    public User GetByID(Guid id)\n\
    \    {\n        return new User();\n    }\n}\n```\n\nRather than maintaining EntityRepository\
    \ as a concrete class that can be instantiated, this code has converted it into\
    \ an interface that removes the default implementation of GetByID. This is not\
    \ entirely necessary, but the benefits of clients depending on interfaces rather\
    \ than implementations have been demonstrated consistently, so it is a sensible\
    \ reinforcement of that policy.\n\nNote also that there is a where clause applied\
    \ to the generic type parameter of the EntityRepository class. This clause prevents\
    \ subclasses from supplying a type that is not part of the Entity class hierarchy,\
    \ which would have made this new version more permissive than the original implementation.\n\
    \nThis version prevents the need for UserRepository clients to mess around with\
    \ downcasting because they are guaranteed to receive a User object, rather than\
    \ an Entity object, and yet the inheritance of EntityRepository and UserRepository\
    \ is preserved.\n\n# Contravariance\n\nContravariance is a similar concept to\
    \ covariance. Whereas covariance relates to the treatment of types that are used\
    \ as return values, contravariance relates to the treatment of types that are\
    \ used as method parameters.\n\nUsing the same Supertype and Subtype class hierarchy\
    \ as previously discussed, Figure 9-6 explores the relationship between types\
    \ that are marked as contravariant via generic type parameters."
  merge: -1
  img_proc: true
- pgno: 311
  md: "![](img/f852e0a12c174e64d91a8e1a05146eab_311_0.png)\n\n**FIGURE 9-6** Due to\
    \ contravariance of the generic parameter, the base-class/subclass relationship\
    \ is inverted.\n\nThe `IContravariant` interface defines a method that accepts\
    \ a single parameter of the type dictated by the generic parameter. Here, the\
    \ generic parameter is marked with the `in` keyword, meaning that it is contravariant.\n\
    \nThe subsequent class hierarchy can be inferred, indicating that the inheritance\
    \ hierarchy has been inverted: `IContravariant<Subtype>` becomes the superclass,\
    \ and `IContravariant<Supertype>` becomes the subclass. This seems strange and\
    \ counterintuitive, but it will soon become apparent why contravariance exhibits\
    \ this behavior—and why it is useful.\n\nIn Listing 9-23, the .NET Framework `IEqualityComparer`\
    \ interface is provided for reference and an application-specific implementation\
    \ is created. The `EntityEqualityComparer` accepts the previous `Entity` class\
    \ as a parameter to the `Equals` method. The details of the comparison are not\
    \ relevant, but a simple identity comparison is used.\n\n# **LISTING 9-23** The\
    \ `IEqualityComparer` interface allows the definition of function objects like\
    \ `EntityEqualityComparer`.\n\n```\n```csharp\npublic interface IEqualityComparer<in\
    \ TEntity>\n    where TEntity : Entity\n{\n    bool Equals(TEntity left, TEntity\
    \ right);\n}\n// ...\npublic class EntityEqualityComparer : IEqualityComparer<Entity>\n\
    {\n    public bool Equals(Entity left, Entity right)\n    {\n        return left.ID\
    \ == right.ID;\n    }\n}\n```\n```"
