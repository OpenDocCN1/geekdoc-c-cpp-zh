- pgno: 223
  md: "```\n{\n    AccountBase account = null;\n    switch(type)\n    {\n        case\
    \ AccountType.Silver:\n            account = new SilverAccount();\n          \
    \  break;\n        case AccountType.Gold:\n            account = new GoldAccount();\n\
    \            break;\n        case AccountType.Platinum:\n            account =\
    \ new PlatinumAccount();\n            break;\n    }\n    return account;\n}\n\
    ```\n\nThere are two key features of the factory method that alleviate the burden\
    \ on clients. First, it is static, meaning that clients call it on the type, rather\
    \ than on an instance of that type. Second, the return type is the base class,\
    \ allowing you to hide the subclass accounts from clients. In fact, you can hide\
    \ them to the degree that they are internal and therefore invisible outside of\
    \ this assembly. This disallows clients from directly constructing the subclasses,\
    \ eliminating the new operator as a potential code smell (see Chapter 3, \"Dependencies\
    \ and layering\"). Listing 6-7 compares how a client would interact with the account\
    \ before and after the refactor.\n\nAlthough a switch statement still remains,\
    \ it is far simpler in this instance and facilitates the prior refactor where\
    \ it was replaced with polymorphism.\n\n# LISTING 6-7 How the Account creates\
    \ a new account before and after the refactor.\n\n```\npublic void CreateAccount(AccountType\
    \ accountType)\n{\n    var newAccount = new Account(accountType);\n    accountRepository.NewAccount(newAccount);\n\
    }\n// . . .\npublic void CreateAccount(AccountType accountType)\n{\n    var newAccount\
    \ = AccountBase.CreateAccount(accountType);\n    accountRepository.NewAccount(newAccount);\n\
    }\n```\n\nThis code is an example of how a client—in this case, the Account—would\
    \ construct a new account before and after the refactor. The difference is negligible,\
    \ but note that the new operator has been removed and replaced with the static\
    \ call to the factory method. This is a common way to replace something very rigid\
    \ with something much more adaptive. Factory methods open up many more possibilities\
    \ because of what they can return, compared to methods that always return the\
    \ same type."
  merge: -1
  img_proc: true
- pgno: 224
  md: "Observant readers will note that the choice of a static factory method is suboptimal—it\
    \ is a skyhook rather than a crane and thus affects the stability and adaptability\
    \ of the code. A better implementation would place the CreateAccount method on\
    \ a suitable interface, as explored in the next section.\n\n# Replacing a constructor\
    \ with a factory class\n\nThere is an alternative to the factory method: the factory\
    \ class. In fact, you do not need to couple clients to the implementation of a\
    \ standalone factory; you can just give them the interface, as in Listing 6-8.\n\
    \n**LISTING 6-8** The account factory hides the implementation details of creating\
    \ an account instance.\n\n```\npublic interface IAccountFactory\n{\n    AccountBase\
    \ CreateAccount(AccountType accountType);\n}\n```\n\nThe interface of the method\
    \ is actually identical to that of the factory method, except for the fact that\
    \ it is an instance method. The implementation could be identical to the previous\
    \ method body, meaning that it has perfect knowledge of all of the different types\
    \ of accounts. The Account, and other clients, would then require this interface\
    \ as a constructor parameter, as shown in Listing 6-9.\n\n**LISTING 6-9** The\
    \ service now receives a factory as a constructor parameter and uses it to create\
    \ the account.\n\n```\npublic class Account\n{\n    public Account(IAccountFactory\
    \ accountFactory, IAccountRepository\n    accountRepository)\n    {\n        this.accountFactory\
    \ = accountFactory;\n        this.accountRepository = accountRepository;\n   \
    \ }\n\n    public void CreateAccount(AccountType accountType)\n    {\n       \
    \ var newAccount = accountFactory.CreateAccount(accountType);\n        accountRepository.NewAccount(newAccount);\n\
    \    }\n\n    private readonly IAccountRepository accountRepository;\n    private\
    \ readonly IAccountFactory accountFactory;\n}\n```\n\nThis service is starting\
    \ to look as it should: an orchestration of more fine-grained interfaces designed\
    \ to achieve a larger goal for the user interface layer. It is, for reasons of\
    \ brevity and clarity, missing some guard clauses on the constructor, to prevent\
    \ null dependencies, and some try/catch blocks on the CreateAccount method, to\
    \ marshal domain exceptions to service exceptions."
  merge: -1
  img_proc: true
- pgno: 225
  md: "# A new account type\n\nAt this point, can you be confident enough that a request\
    \ for a new account type results in minimal changes to existing code? Yes and\
    \ no. In one case, you can trivially add an account, but in another, you will\
    \ find that your current model makes some wrong assumptions that form *technical\
    \ debt.*\n\n# A new reward account\n\nImagine that your client wants to add another\
    \ kind of account—a Bronze account—that earns half of the reward points that the\
    \ Silver account does. There are only two changes that need to be made to support\
    \ this in the domain layer. First, you need to create a new subclass of the AccountBase\
    \ class, as in Listing 6-10.\n\nLISTING 6-10 The Bronze account is added as a\
    \ new account type.\n\n```\ninternal class BronzeAccount : AccountBase\n{\n  \
    \  public override int CalculateRewardPoints(decimal amount)\n    {\n        return\
    \ Math.Max((int)decimal.Floor(amount / BronzeTransactionCostPerPoint), 0);\n \
    \   }\n    private const int BronzeTransactionCostPerPoint = 20;\n}\n```\n\nThis\
    \ is a simple change that involves new unit tests to provide your expectations,\
    \ and a new class that provides the algorithm for calculating reward points for\
    \ this class.\n\nWhether you have a factory class or a factory method, you need\
    \ to change it to support your new account type, along with the enumeration that\
    \ defines possible account types to be created. Listing 6-11 shows how a factory\
    \ class would change to support the new Bronze account.\n\nLISTING 6-11 The switch\
    \ statement has a new case added to it that handles creating Bronze accounts.\n\
    \n```\npublic AccountBase CreateAccount(AccountType accountType)\n{\n    AccountBase\
    \ account = null;\n    switch (accountType)\n    {\n        case AccountType.Bronze:\n\
    \            account = new BronzeAccount();\n            break;\n        case\
    \ AccountType.Silver:\n            account = new SilverAccount();\n          \
    \  break;\n        case AccountType.Gold:\n            account = new GoldAccount();\n\
    \            break;\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 226
  md: "```\ncase AccountType.Platinum:\n    account = new PlatinumAccount();\n   \
    \ break;\n}\nreturn account;\n}\n```\n\nBefore moving on to the next new account\
    \ for the client, is there any way you can refactor this method so that you do\
    \ not have to amend it for every account? You cannot use the refactor detailed\
    \ earlier in the “Replacing a conditional expression with polymorphism” section,\
    \ because this is a result of such a refactor. Instead, is there a way to construct\
    \ an AccountBase from an accountType name without directly referencing each value\
    \ and subclass? Listing 6-12 provides the answer.\n\nLISTING 6-12 If the accounts\
    \ follow a certain naming convention, this factory will suffice for all account\
    \ subclasses.\n\n```\npublic AccountBase CreateAccount(string accountType)\n{\n\
    \    var objectHandle = Activator.CreateInstance(null, string.Format(\"{0}Account\"\
    , accountType));\n    return (AccountBase)objectHandle.Unwrap();\n}\n```\n\nNote\
    \ that the enumeration has been dropped in favor of a more flexible string value.\
    \ This could be a problem, because any string value could be provided, rather\
    \ than only those that match valid account types. Of course, this is the point\
    \ of the exercise.\n\nThis sort of refactor is a little risky because it is in\
    \ danger of creating a leaky abstraction of the factory—it might not work in all\
    \ required scenarios. Several things have to be true before this sort of code\
    \ is viable:\n\n+   - Each account type must follow a naming convention of [Type]Account,\
    \ where the [Type] prefix is the value of the enumeration.\n+   - Each account\
    \ type must be contained in the same assembly as this factory method.\n+   - Each\
    \ account type must have a public default constructor—the types cannot be parameterized\
    \ with any values.\n\nDue to these constraints, this usually means that you have\
    \ refactored too much, and it causes problems later when one of these constraints\
    \ needs to be circumvented. Proceed with caution.\n\n# Code smell: Refused bequest\n\
    \nSometime after the launch of the new reward card scheme, the client’s marketing\
    \ department asks how many people are assigned to each account type. Your answer\
    \ leads them to conclude that they have a 100-percent uptake in the reward card\
    \ scheme: that every single customer has either a Bronze, Silver, Gold, or Platinum\
    \ reward card. But this is not so. There was no provision made for creating an"
  merge: -1
  img_proc: true
- pgno: 227
  md: "account that was *not* part of the reward card scheme, thus everyone was given\
    \ a Bronze account by default. As a result of this conversation, another new account\
    \ type is required: the Standard account.\n\nThis account serves a different purpose—it\
    \ does not earn any reward points. There are two ways of modeling this. First,\
    \ you can create a new AccountBase subclass, shown in Listing 6-13, which does\
    \ nothing in its `CalculateRewardPoints` override but return zero, effectively\
    \ accumulating no points.\n\n**LISTING 6-13** A simple account without any reward\
    \ point calculation.\n\n```\ninternal class StandardAccount : AccountBase\n{\n\
    \    public override int CalculateRewardPoints(decimal amount)\n    {\n      \
    \  return 0;\n    }\n}\n```\n\nThe alternative solution is to acknowledge that\
    \ not all accounts have reward points and, in fact, there are two different types\
    \ in the domain model. In such a circumstance, rather than provide a “default\
    \ implementation” for the `CalculateRewardPoints` method, the subclass effectively\
    \ refuses what the superclass has bequeathed to it—hence the code smell “refused\
    \ bequest.” In the prior example, the StandardAccount has refused to implement\
    \ the interface rather than to ignore it, whereas the next refactor will refuse\
    \ the interface altogether.\n\n# Replacing inheritance with delegation\n\nIn practice,\
    \ this means that you need to split the AccountBase class into two parts. Some\
    \ of the interface will remain on the account, with some of it moving to a new\
    \ class hierarchy to represent reward cards. In this way, the inheritance of accounts\
    \ is replaced with delegation to reward cards.\n\nThe first change is to introduce\
    \ a new IRewardCard interface to define the properties and behavior of each reward\
    \ card, as shown in Listing 6-14.\n\n**LISTING 6-14** The reward points and their\
    \ calculation have moved away from the Account class.\n\n```\npublic interface\
    \ IRewardCard\n{\n    int RewardPoints\n    {\n        get;\n    }\n\n    void\
    \ CalculateRewardPoints(decimal transactionAmount, decimal accountBalance);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "Previously, these two members were part of the AccountBase class, but they\
    \ have been moved out because they are wholly dependent on the presence of reward\
    \ cards. Note that the interface of CalculateRewardPoints has changed in two ways.\
    \ First, there is no longer a return value on this method, because it is expected\
    \ to mutate the RewardPoints property directly. Second, you must pass in the account\
    \ balance as a parameter to this method because it is no longer available. This\
    \ is an important side effect of splitting the two objects up in this manner:\
    \ any context not directly encapsulated by the reward card object will need to\
    \ be handed to it. This might cause the interface of this method to change in\
    \ the future.\n\nListing 6-15 shows the implementations of this interface for\
    \ the Bronze and Platinum cards after the refactor.\n\n# LISTING 6-15 Examples\
    \ of the reward card implementations.\n\n```\ninternal class BronzeRewardCard\
    \ : IRewardCard\n{\n    public int RewardPoints\n    {\n        get;\n       \
    \ private set;\n    }\n\n    public void CalculateRewardPoints(decimal transactionAmount,\
    \ decimal accountBalance)\n    {\n        RewardPoints += Math.Max((int)decimal.Floor(transactionAmount\
    \ /\n            BronzeTransactionCostPerPoint), 0);\n    }\n    private const\
    \ int BronzeTransactionCostPerPoint = 20;\n    // ...\n    internal class PlatinumRewardCard\
    \ : IRewardCard\n    {\n        public int RewardPoints\n        {\n         \
    \   get;\n            private set;\n        }\n\n        public void CalculateRewardPoints(decimal\
    \ transactionAmount, decimal accountBalance)\n        {\n            RewardPoints\
    \ += Math.Max((int)decimal.Ceiling(\n                (accountBalance / PlatinumBalanceCostPerPoint)\
    \ +\n                (transactionAmount / PlatinumTransactionCostPerPoint)), 0);\n\
    \        }\n\n        private const int PlatinumTransactionCostPerPoint = 2;\n\
    \        private const int PlatinumBalanceCostPerPoint = 1000;\n    }\n```\n\n\
    These classes are very similar to their previous incarnation, with an extra local\
    \ RewardPoints property."
