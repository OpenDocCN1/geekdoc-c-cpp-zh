- pgno: 345
  md: "```\n{\n    this.session = session;\n}\n\npublic void Save(Item item)\n{\n\
    \    using(var transaction = session.BeginTransaction())\n    {\n        session.Save(item);\n\
    \n        transaction.Commit();\n    }\n}\n\npublic void Delete(Item item)\n{\n\
    \    using(var transaction = session.BeginTransaction())\n    {\n        session.Delete(item);\n\
    \n        transaction.Commit();\n    }\n}\n```\n\n# Single-method interfaces\n\
    \nInterface segregation taken to its logical conclusion results in very small\
    \ interfaces. The smaller the interface, the more versatile it becomes. Such interfaces\
    \ have analogies in the framework: Action, Func, and Predicate. However, delegates\
    \ are not as versatile as interfaces. Though delegates certainly have their uses,\
    \ the fact that interfaces can be decorated, adapted, and composed in many ways\
    \ sets them apart. Because interfaces must be implemented, there can also be extra\
    \ context provided through other interfaces implemented on the same class, or\
    \ via constructor parameters.\n\nThe simplest interface available has a single\
    \ method. The simplest method available accepts no parameters and returns no value,\
    \ as shown in Listing 10-36.\n\nLISTING 10-36 ITask is the simplest interface\
    \ possible.\n\n```\npublic interface ITask\n{\n    void Do();\n}\n```\n\nThis\
    \ interface is extremely decoratable. Because it returns no value, it can even\
    \ have an asynchronous fire-and-forget decorator. It can be used whenever a client\
    \ needs to send a message but does not have any context to provide it, nor does\
    \ it require any response to be returned."
  merge: -1
  img_proc: true
- pgno: 346
  md: "A step up from this is the action interface, which is analogous to the Action\
    \ delegate in the framework. It takes a generic parameter that dictates the type\
    \ of its context. The IAction interface is shown in Listing 10-37\n\n# LISTING\
    \ 10-37 The IAction interface adds a context parameter.\n\n```\npublic interface\
    \ IAction<TContext>\n{\n    void Do(TContext context);\n}\n```\n\nThis is only\
    \ slightly more complex than the task. If you introduce a return value, instead\
    \ of a parameter, you create a function, as shown in Listing 10-38.\n\n# LISTING\
    \ 10-38 IFunction interfaces have return values.\n\n```\npublic interface IFunction<TReturn>\n\
    {\n    TReturn Do();\n}\n```\n\nA further specialization of this interface is\
    \ to require that the function return a Boolean value. This creates a predicate,\
    \ as shown in Listing 10-39.\n\n# LISTING 10-39 IPredicate is a function that\
    \ returns a Boolean value.\n\n```\npublic interface IPredicate\n{\n    bool Test();\n\
    }\n```\n\nThe predicate can be used to encapsulate a branching test, such as an\
    \ if statement or the clause of a loop.\n\nAlthough these interfaces look unassuming,\
    \ a lot can be achieved by decorating, adapting, and composing several different\
    \ instances of these interfaces."
  merge: -1
