- pgno: 404
  md: "```\nContainer.RegisterType<ITaskService, TaskServiceAdo>();\nContainer.RegisterType<TaskViewModel>();\n\
    Container.RegisterType<TaskController>();\n\nControllerBuilder.Current.SetControllerFactory(new\
    \ UnityControllerFactory(Container));\n}\n```\n\nSome of this code is boilerplate\
    \ that is created by default when a new MVC application is created. This includes\
    \ all of the MVC-specific initialization code, such as that for registering areas,\
    \ filtering, routes, and bundles. This is all performed at the first opportunity—in\
    \ the Application_Start method. This method is called when the first request is\
    \ made after the application has been started in Internet Information Services\
    \ (IIS). It is located in the code-behind file of the Global.asax and contains\
    \ the application-specific subclass of the HttpApplication class.\n\nOther than\
    \ for the MVC-specific TaskController class, the rest of the service interfaces\
    \ and implementations have been reused. The previous TaskController was centered\
    \ around WPF, so it could not be reused outside of that context. Instead, the\
    \ new TaskController does much the same job—retrieving tasks and converting them\
    \ to a more view-friendly format via the IObjectMapper—but inherits from an MVC\
    \ base class for controllers. This cements it as a resolution root for the application,\
    \ because it inherits from the System.Web.Mvc.Controller class. Listing 12-26\
    \ shows this new controller.\n\n# LISTING 12-26 This TaskController is a resolution\
    \ root and has a constructor requiring dependencies.\n\n```\npublic class TaskController\
    \ : Controller\n{\n    private readonly ITaskService taskService;\n    private\
    \ readonly IObjectMapper mapper;\n\n    public TaskController(ITaskService taskService,\
    \ IObjectMapper mapper)\n    {\n        this.taskService = taskService;\n    \
    \    this.mapper = mapper;\n    }\n\n    public ActionResult List()\n    {\n \
    \       var taskDtos = taskService.GetAllTasks();\n        var taskViewModels\
    \ = mapper.Map<IEnumerable<TaskViewModel>>(taskDtos);\n        return View(taskViewModels);\n\
    \    }\n}\n```\n\nList is the action method that is called by the same view that\
    \ renders all tasks. Just as in the WPF application, the controller first delegates\
    \ to the ITaskService to retrieve the tasks, and then delegates to the IObjectMapper\
    \ to convert the returned data transfer objects into viewmodels for use by the\
    \ view."
