- pgno: 309
  md: "This is directly analogous to the Supertype/Subtype example, but with a more\
    \ directed purpose. This small domain is going to have the Repository pattern\
    \ applied to it. The Repository pattern provides you with an interface for retrieving\
    \ objects as if they were in memory but that could be loaded from a very different\
    \ storage medium. Listing 9-21 shows an EntityRepository class and its UserRepository\
    \ subclass.\n\n# **LISTING 9-21** Without involving generics, all inheritance\
    \ in C# is invariant.\n\n```\npublic class EntityRepository\n{\n    public virtual\
    \ Entity GetByID(Guid id)\n    {\n        return new Entity();\n    }\n}\n// .\
    \ . .\npublic class UserRepository : EntityRepository\n{\n    public override\
    \ User GetByID(Guid id)\n    {\n        return new User();\n    }\n}\n```\n\n\
    This example is not the same as that previously described because of one key difference:\
    \ in the absence of generic types, C# is not covariant for method return types.\
    \ In fact, a compilation error is generated due to an attempt to change the return\
    \ type of the GetByID method in the subclass to match the User class.\n\n```\n\
    error CS0508: 'SubtypeCovariance.UserRepository.GetByID(System.Guid)': return\
    \ type must be\n'SubtypeCovariance.Entity' to match overridden member\n'SubtypeCovariance.EntityRepository.GetByID(System.Guid)'\n\
    ```\n\nPerhaps experience tells you that this will not work, but the reason is\
    \ a lack of covariance in this scenario. If C# supported covariance for general\
    \ classes, you would be able to enforce the change of return type in the UserRepository.\
    \ Because it does not, you have only two options. You can amend the UserRepository.GetByID\
    \ method’s return type to be Entity and use polymorphism to allow you to return\
    \ a User in its place. This is dissatisfying because clients of the UserRepository\
    \ would have to downcast the return type from an Entity type to a User type, or\
    \ they would have to sniff for the User type and execute specific code if the\
    \ expected type was returned.\n\nInstead, you could redefine EntityRepository\
    \ as a generic class that requires the Entity type it intends to operate on via\
    \ a generic type argument. This generic parameter can be marked out, thus covariant,\
    \ and the UserRepository subclass can specialize its parent base class for the\
    \ User type."
