- pgno: 392
  md: "It is important to note that if a class is handed a dependency via its constructor,\
    \ it should not manually dispose of the dependency itself. The class cannot guarantee\
    \ that it has been given the one and only instance of the dependency; it might\
    \ share it with others and therefore cannot dispose of it without potentially\
    \ having a negative impact on other classes.\n\nThe answer to the question of\
    \ how to manage the lifetime of objects when using dependency injection is much\
    \ closer to how the service was originally implemented.\n\n# The connection factory\n\
    \nThe Factory pattern is a way of replacing manual object instantiation with delegation\
    \ to a class whose purpose is to create objects.\n\nA connection factory could\
    \ look something like the interface shown in Listing 12-15. This interface has\
    \ been made slightly more general by returning the IDbConnection interface, rather\
    \ than committing all of its clients to the SqlConnection class.\n\nLISTING 12-15\
    \ The connection factory interface is very simple.\n\n```\npublic interface IConnectionFactory\n\
    {\n    IDbConnection CreateConnection();\n}\n```\n\nThis interface will be injected\
    \ into the task service so that you have a way of retrieving a connection without\
    \ manually constructing it, keeping the service testable through mocking. Listing\
    \ 12-16 shows the refactored service.\n\nLISTING 12-16 Dependency injection can\
    \ work in tandem with the Factory pattern.\n\n```\npublic class TaskServiceAdo\
    \ : ITaskService\n{\n    private readonly IConnectionFactory connectionFactory;\n\
    \n    public TaskServiceAdo(IConnectionFactory connectionFactory)\n    {\n   \
    \     this.connectionFactory = connectionFactory;\n    }\n\n    public IEnumerable<TaskDto>\
    \ GetAllTasks()\n    {\n        var allTasks = new List<TaskDto>();\n\n      \
    \  using(var connection = connectionFactory.CreateConnection())\n        {\n \
    \           connection.Open();\n\n            using (var transaction = connection.BeginTransaction())\n\
    \            {\n                var command = connection.CreateCommand();\n  \
    \              command.Transaction = transaction;\n                command.CommandType\
    \ = CommandType.StoredProcedure;\n```"
