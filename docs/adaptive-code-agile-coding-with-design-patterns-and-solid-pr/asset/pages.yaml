- pgno: 107
  md: '# Cyclic dependencies


    Another part of graph theory is that directed graphs can form cycles: the ability
    to traverse from one node back to itself by following the edges. The graphs shown
    so far are said to be acyclic digraphs—containing no cycles. Figure 3-9 shows
    an example of a cyclic digraph. If you start at node D, you can follow the edge
    to E, then B, and finally, end up back at D again. This is a cyclic dependency,
    sometimes referred to as a circular dependency.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_107_0.png)


    FIGURE 3-9 This digraph contains cycles.


    Imagine that these nodes represent assemblies. D has an implicit dependency on
    anything that its explicit and implicit dependencies also depend on. D depends
    on E explicitly but B and D implicitly. Therefore, D depends on itself.


    For assemblies, this is not possible. If you try to set this up in Visual Studio,
    when you come to assigning the reference from E to B, Visual Studio will not allow
    this to happen, as Figure 3-10 shows.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_107_1.png)


    FIGURE 3-10 It is not possible to create a cyclic dependency in Visual Studio.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "So, although modeling dependencies as graphs might seem academic, it has clear\
    \ benefits when you are organizing your dependencies. Cyclic dependencies between\
    \ assemblies are not a diversion from a purist ideal but are completely disallowed,\
    \ and their avoidance is mandatory and enforced.\n\n# Loops\n\nLoops are specializations\
    \ of the cycles in digraphs. If a node is connected with an edge to itself, that\
    \ edge becomes a loop. Figure 3-11 shows an example of a graph with a loop.\n\n\
    ![](img/f852e0a12c174e64d91a8e1a05146eab_108_0.png)\n\nFIGURE 3-11 In this digraph,\
    \ node B links to itself with a loop.\n\nIn practice, assemblies always explicitly\
    \ self-depend, and such an observation is not particularly noteworthy. However,\
    \ at the method level, a loop is evidence of recursion, as shown in Listing 3-5.\n\
    \n# LISTING 3-5 A self-loop in a digraph that represents methods results in recursion.\n\
    \n```\nnamespace Graphs\n{\n    public class RecursionLoop\n    {\n        public\
    \ void A()\n        {\n            int x = 6;\n            Console.WriteLine(\"\
    0! = {1}\", x, B(x));\n        }\n\n        public int B(int number)\n       \
    \ {\n            if(number == 0)\n            {\n                return 1;\n \
    \           }\n            else\n            {\n                return number\
    \ * B(number - 1);\n            }\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "The class in Listing 3-4 shows the functional equivalent of the dependency\
    \ graph in Figure 3-11. Method A calls method B; therefore, you say that method\
    \ A is dependent on method B. However, more interesting is method B’s dependency\
    \ on itself—B is an example of a recursive function; that is, a function that\
    \ calls itself.\n\n# Managing dependencies\n\nYou have learned so far that dependencies\
    \ are necessary but also must be carefully managed lest they present you with\
    \ problems later in development. These problems can be quite difficult to back\
    \ out of after they have manifested themselves. Therefore, it is best to manage\
    \ your dependencies correctly from the outset and to stay vigilant so that no\
    \ problems creep in. Poorly managed dependencies can quickly escalate from a small\
    \ compromise to become an overall architectural problem.\n\nThe rest of this chapter\
    \ is focused on the more practical aspects of continually managing dependencies.\
    \ This includes avoiding anti-patterns and, more importantly, understanding why\
    \ these common patterns are anti-patterns. Conversely, some patterns are benevolent\
    \ and should be embraced; these are offered as direct alternatives to the noted\
    \ anti-patterns.\n\n> **Patterns and anti-patterns**\n> \n> As an engineering\
    \ discipline, object-oriented software development is a relatively new endeavor.\
    \ Over the last few decades, some repeatable collaborations between classes and\
    \ interfaces have been identified and codified as *patterns*.\n> \n> There are\
    \ many software development patterns, each providing a generic solution that can\
    \ be repurposed to a specific problem domain. Some patterns can be used in conjunction\
    \ with each other to produce elegant solutions to complex problems. Of course,\
    \ not all patterns are applicable all the time, and it takes experience and practice\
    \ to recognize when and where certain patterns might apply.\n> \n> Some patterns\
    \ are not so benevolent. In fact, they are quite the opposite. They are considered\
    \ *anti-patterns*. These patterns harm the adaptability of your code and should\
    \ be avoided. Some anti-patterns began as patterns before slowly falling out of\
    \ favor due to perceived negative side effects.\n\n# Implementations versus interfaces\n\
    \nDevelopers who are new to the concept of programming to interfaces often have\
    \ difficulty letting go of what is behind the interface.\n\nAt compile time, any\
    \ client of an interface should have no idea which implementation of the interface\
    \ it is using. Such knowledge can lead to incorrect assumptions that couple the\
    \ client to a specific implementation of the interface."
  merge: -1
  img_proc: true
