  md: "# LISTING 7-30 The primary IStopwatch implementation uses the Stopwatch class.\n\
    \n```\npublic class StopwatchAdapter : IStopwatch\n{\n    public StopwatchAdapter(Stopwatch\
    \ stopwatch)\n    {\n        this.stopwatch = stopwatch;\n    }\n\n    public\
    \ void Start()\n    {\n        stopwatch.Start();\n    }\n\n    public long Stop()\n\
    \    {\n        stopwatch.Stop();\n        var elapsedMilliseconds = stopwatch.ElapsedMilliseconds;\n\
    \        stopwatch.Reset();\n        return elapsedMilliseconds;\n    }\n\n  \
    \  private readonly Stopwatch stopwatch;\n}\n```\n\nNote that you could have chosen\
    \ to implement IStopwatch as a subclass of the System.Diagnostics.Stopwatch class\
    \ and used the existing Start and Stop methods. However, the Start method acts\
    \ to resume functionality when a stopwatch is stopped, but what you need to do\
    \ is call Reset after you call Stop, and retrieve the ElapsedMilliseconds property\
    \ value in between. This is another example of the Adapter pattern.\n\n# Decorating\
    \ properties and events\n\nSo far, you have learned how to decorate the methods\
    \ of an interface, but what about properties and events? Both of these syntactic\
    \ elements can also be decorated, as long as you do not use auto-properties or\
    \ auto-events; you need to explicitly define both in order to decorate them properly.\n\
    \nListing 7-31 shows the manual creation of a property, but rather than having\
    \ a backing field, for both the getter and the setter this code delegates to the\
    \ decorated instance of the interface.\n\n# LISTING 7-31 Properties can also use\
    \ the Decorator pattern, just like methods.\n\n```\npublic class ComponentDecorator\
    \ : IComponent\n{\n    public ComponentDecorator(IComponent decoratedComponent)\n\
    \    {\n        this.decoratedComponent = decoratedComponent;\n    }\n}\n```"
