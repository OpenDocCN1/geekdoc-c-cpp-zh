- pgno: 53
  md: '# Feature burnup


    ![](img/f852e0a12c174e64d91a8e1a05146eab_53_0.png)


    FIGURE 1-10 The feature burnup chart covering an adjusted calendar year for a
    healthy project making consistent progress.


    On the other hand, the burnup chart shown in Figure 1-11 shows that a definite
    issue has occurred during development. The team started very strongly, delivering
    lots of features extremely quickly, but they have since stalled and only delivered
    two completed features over the past eight months.


    # Features completed


    ![](img/f852e0a12c174e64d91a8e1a05146eab_53_1.png)


    FIGURE 1-11 The feature burnup chart covering an adjusted calendar year for a
    project that has stalled.


    The problem here is quite clear: the code was not adaptive to change. The initial
    dash from the starting line could indicate a lack of unit testing and neglect
    for layering or other best practices. By omitting these details, the team managed
    to complete features early. However, as the code base became bloated and disorganized,
    progress began to slow down significantly and the amount of features delivered
    ground to a halt. A progression like this is likely to be accompanied by an increase'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'in the amount of defects and bad—reckless—technical debt. If the project continues
    to follow this path, it would probably be better to start over—the refactoring
    effort required to get it back on track would outweigh the benefits. If the problem
    was caught early enough, the team and project could recover. It is better to start
    with Agile development practices in place from the outset, rather than trying
    to crowbar them in to an unhealthy project.


    # Backlogs


    A backlog is a list of pending items that are yet to be addressed. These items
    are waiting for their time to be taken from the backlog and acted on until they
    are complete. Each item in the list has an assigned priority and an estimated
    required effort, and the list is ordered first by priority and then by effort.


    Two backlogs are maintained in Scrum, each with its own distinct purpose: the
    product backlog and the sprint backlog.


    # Product backlog


    At any point during a product’s life, the product backlog contains features that
    are waiting to be implemented. These features have not been committed to a sprint,
    so the development team is not actively working on the items on this backlog.
    The development team—or its key representatives—spends time scoping the effort
    required on these features in the release planning meeting (covered later in this
    chapter). This helps to prioritize the items on the product backlog so that they
    remain in priority order.


    The priority of each item is primarily dictated by the value that implementing
    the feature would represent to the business. This business value must be determined
    by the owner of the product backlog: the product owner. This person represents
    the business to the development team and can speak authoritatively for it. The
    product owner’s knowledge of the business and its working practices is vital for
    assigning the correct business value to any particular feature. If two items on
    the product backlog have the same relative business value, their priority is decided
    based on the relative effort required. Given two features of high business value,
    if one is estimated to require a small effort and another a large effort, it makes
    business sense to implement the smaller feature first. This is because smaller
    features pose less of a risk; the probable range of time required to implement
    a small feature will not vary as much as that of a larger feature. Also, the return
    on investment (ROI) is larger for a feature that requires less effort than for
    one of equal value that requires more.


    When the business wants to release a new version of the product, the product backlog
    can be consulted to determine which features are most valuable to the release.
    This can occur in one of two ways. Either the business sets an absolute deadline
    for the release and commits to the amount of work likely to be accomplished in
    that timeframe, given the effort estimates attached, or the business selects the
    features that are required for the release and the likely release date is determined
    from the estimates.


    Aside from features, the product backlog can also contain defects that must be
    fixed but that have not yet found their way into a sprint. Just like features,
    defects will have some assigned business value.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The estimate of effort required for a defect is difficult to ascertain, because
    there is less known about the cause of defects and time might be required to find
    an estimate.


    The product backlog should reflect the open nature of Agile reporting. It should
    be visible to everyone so that anyone can contribute ideas, offer suggestions,
    or indicate possible surprises along the way. It is also important that this list
    remain authoritative, containing the true state of the product backlog at any
    time. Poor decisions are often made due to poor information, and an out-of-date
    product backlog could be disastrous if key release-planning decisions are ill-informed.


    # Sprint backlog


    The sprint backlog contains all of the user stories that are to be completed in
    the coming sprint. At the start of the sprint, the team selects enough work to
    fill a sprint based on their current velocity and the relative size of the user
    stories that are yet to be developed. The priority of the stories is assigned
    by the product owner. After the stories are committed to the sprint, the team
    can start to break down each story into tasks that have real-world time estimates
    in hours. Each individual then elects to implement enough tasks to fill his or
    her time during the sprint.


    The sprint backlog and all of the time estimates are owned by the team. No one
    outside of the development team can add items to the sprint backlog, nor can they
    reliably estimate the relative effort or absolute hours required to complete work.
    The team alone is responsible for the sprint backlog, but they must take work
    from the product backlog in priority order.


    # The sprint


    The iterations of a Scrum project are called sprints. Sprints should last between
    one and four weeks. Two-week sprints are most popular. A shorter sprint might
    leave too little time to accomplish the sprint goals, and a longer sprint might
    cause the team to lose focus.


    Sprints are generally referred to by their index number, starting with sprint
    zero. Sprint zero is intended to prepare the development environment for the whole
    team, and to carry out some preliminary planning meetings before the first actual
    sprint begins. There will probably not be any points associated with sprint zero,
    but a lot can be achieved in those first weeks to make the transition to Scrum
    easier during subsequent sprints.


    The temptation is to align sprints to the working week by starting them on a Monday
    and ending them on a Friday. The trouble with this is that the sprint retrospective
    (which will be covered shortly) involves quite a lot of time in meetings, and
    there is nothing more energy-sapping than sitting in meetings on a Friday afternoon.
    Some people also tend to leave early on Fridays, and concentration levels are
    likely to dip before the weekend. Similarly, no one looks forward to starting
    their week with meetings, so it is best to avoid this and start your sprints around
    midweek: Tuesday, Wednesday, or Thursday.


    The following is an explanation of all of the meetings that form part of each
    sprint, in order, unless otherwise stated.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Release planning


    At some point before the sprint begins, the release of the software must be planned.
    This involves the customer, the product owner, and a representative of the development
    team deciding on a release date and prioritizing and sizing the features that
    are to be included.


    # Feature estimation


    Features can involve a lot of effort, even on the smaller end of the scale. Thus,
    any attempts to predict the amount of effort required will be off by a wide margin.
    For this reason, feature effort can be stated in common T-shirt sizes:


    +   - Extra-large (XL)

    +   - Large (L)

    +   - Medium (M)

    +   - Small (S)

    +   - Extra-small (XS)


    > **Tip** Estimating in “T-shirt sizes” such as this prevents mathematical equivalence
    of stories. Two 2-point stories should equal a single 4-point story. But two Small
    stories might or might not equate to a single Medium story—their relative size
    is neither clear nor precise. If you do want to maintain an equivalence, your
    features should be measured in points.


    # Feature priority


    It might be difficult to predict how many features can fit into a release, which
    is why feature priority is so important. For a specific release, all features
    can be given one of three priorities:


    +   - Required (R)

    +   - Preferred (P)

    +   - Desired (D)


    Required features are the most important parts of a release. Preferred features
    are the features that should be tackled if any time is available before the deadline
    looms. Desired features have the lowest priority. These features are not essential—but
    the customer would certainly like to have them implemented.


    In addition, business stakeholders should number the features so that the development
    team can be sure to implement each feature in priority order.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Sprint planning


    The expected outcome of sprint planning is to estimate user stories. As with all
    parts of the Scrum process, there are variations of the story estimation process.
    This section discusses planning poker, which is one of the more common ways to
    generate discussion, and affinity estimation, a quicker way to estimate the relative
    size of stories. Affinity estimation is better when there are a large number of
    stories to estimate. For an individual sprint, it is possible to use planning
    poker if there are only a few stories to estimate, or to use affinity estimation
    if there is a larger number of stories or if time is short.


    # Planning poker


    The planning poker session involves the whole development team—business analysts,
    developers, and test analysts—including the Scrum master and the product owner.
    For every user story that is currently on the product backlog, a small scope explanation
    is given, and then everyone is asked to vote on its size in story points.


    In order to avoid a lot of small-scale differences, it is best to limit the voting
    options. For example, a common choice is a modified Fibonacci scale: 1, 2, 3,
    5, 8, 13, 20, 40, and 100. Regardless of the scale chosen, the choices should
    be limited overall and the gaps between the options should increase in size as
    the number of points goes up. At the lower end of the scale, zero can be added
    to represent “no work required,” for a story that might have been obviated by
    other work. At the upper end of the scale, team members can vote that a story
    is too big to implement within a sprint and must be vertically split further before
    being taken off the board to develop.


    A few decks of playing cards double well as voting cards, but you can also fashion
    voting cards from spare index cards or even just scribble numbers on pieces of
    scrap paper. When it comes time to vote, everyone should show their cards at the
    same time, to avoid being influenced by the choices of others. It is unlikely
    that consensus will be achieved all the time, and there could be some large divergences
    between individual estimates. This is perfectly normal—there are sure to be a
    couple of outliers who deviate from the modal vote. Each of these voters should
    be asked to justify his or her choice in light of the general consensus. For example,
    if someone votes a 1 when the modal vote was 8, that person would be asked—politely,
    of course—to explain why they think the story requires that much less effort.
    Similarly, voters who vote above the mode should be asked to explain their reasons,
    too. All that is occurring here is that a discussion is generated about how much
    effort the team believes is required to carry a story to its conclusion.


    After the justifications have been aired, a revote might be necessary because
    other people could have been persuaded that their vote was actually too big or
    too small and that the outlier was in fact correct. Eventually, consensus should
    be achieved, with all parties agreeing on a suitable number of story points. Each
    story should be estimated until the number of points assigned reaches the team’s
    current velocity, which is the maximum amount of work that the team should commit
    to in each sprint.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Avoiding Parkinson''s Law


    Parkinson''s Law states:


    > "Work expands so as to fill the time available for its completion."

    > —Cyril Northcote Parkinson


    When you untether the estimates of stories from real-world time, there is less
    likelihood of succumbing to Parkinson''s Law. The focus should remain on completing
    the story—that is, on meeting the definition of done—as quickly as possible.


    # Affinity estimation


    Affinity estimation is provided as a counterpoint to planning poker, which can
    take a significant amount of time to generate estimates if there are a lot of
    stories. Rather than entering into a discussion for each story, the team picks
    two stories from the top of the product backlog and then decides which is the
    smaller of the two. The smaller is placed on the left side of a table and the
    larger on the right.


    The team then takes a single story from the product backlog and places it where
    they believe it should go on the spectrum between the existing smaller and larger
    stories. It could feasibly be placed to the left of the smaller story, indicating
    that it is smaller still; to the right of the larger, indicating that it is larger
    still; on top of the small or large story, indicating that it is roughly the same;
    or anywhere in between the two stories. This process then continues for each story
    on the product backlog, until there is no more room in the sprint for extra work.


    With the stories grouped together by relative size, the team can start at the
    leftmost group and proceed toward the rightmost group, allocating points to the
    stories according to the modified Fibonacci sequence. If there are many stories
    to estimate, or if time is scarce, this is a good way of achieving a ballpark
    estimate of relative size.


    # Daily Scrum


    Although there are several meetings that will last a couple of hours, the Scrum
    process itself is only really visible day to day at the daily Scrum, or "stand-up
    meeting."


    The team should gather around the Scrum board in a horseshoe shape and each person,
    in turn, should address the whole team. The daily Scrum should not last longer
    than 15 minutes. To focus the meeting, everyone should answer these three questions:


    +   - What did you do yesterday?

    +   - What will you do today?

    +   - What impediments do you face?'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The key issues that the daily stand-up meeting addresses are yesterday’s actual
    progress and today’s estimated progress. In discussing what you did yesterday,
    refer to the Scrum board and feel free to move cards across from one column to
    another or move your avatar from one card to another, thus keeping the Scrum board
    current. Outline what you worked on and how the day went. If you do not have anything
    to do at this point, notify the Scrum master and request a new work item. Impediments
    include anything that might prevent you from completing your goal for the day.
    Because you will refer back to what you claim you will be doing today in tomorrow’s
    daily Scrum, it is important to enumerate anything that might prevent you from
    achieving what you plan to do. The impediment could be directly work related,
    as in, “I will not be able to continue if the network keeps going down like it
    did yesterday,” or it might be a personal matter, as in “I have an appointment
    with the dentist at 14:00, so I’m unlikely to complete everything.” Regardless,
    the Scrum master should be taking notes so that she knows how everyone is progressing
    with their stories.


    # Niko-niko calendar


    A “niko-niko calendar”—also sometimes referred to as a “mood board” (in Japanese,
    “niko-niko” has a meaning close to “smiley”)—provides a good barometer of how
    the team feels about their progress during the sprint. A table is drawn by the
    Scrum board, with the days of the sprint across the top and the names of the team
    members down the side, as shown in Figure 1-12.


    |  | Mon | Tue | Wed | Thu | Fri | Mon | Tue | Wed | Thu | Fri |

    |---|---|---|---|---|---|---|---|---|---|---|

    | John | 😀 | 😀 | 😀 | 😀 | 😀 |  |  |  |  |  |

    | Bob | 😐 | 😐 | 😀 | 😐 | 😡 |  |  |  |  |  |

    | Alice | 😀 | 😐 | 😀 | 😀 | 😐 |  |  |  |  |  |

    | Mark | 😡 | 😡 | 😡 | 😡 | 😡 |  |  |  |  |  |


    **FIGURE 1-12** A niko-niko calendar quickly shows who is having a good sprint
    and who is not.


    At the Scrum meeting, each person is asked to place one of three stickers on the
    board—green, yellow, or red—in their square for the previous day. Each sticker
    corresponds to an overall summary of how the previous day went: good, okay, or
    bad, respectively. This will quickly show when team members are having consecutive
    frustrating days and require help, which they might not otherwise seek.


    This is just another metric to improve the feedback loop. If all of your team
    members are consistently feeling bad about their work, perhaps morale needs to
    be boosted. Or if one of the team is consistently unhappy but the rest of the
    team is happy, this could indicate that someone is being left behind or doesn’t
    feel like he/she fits in. Worst of all, if the whole team feels happy when sprints
    are running late, the code is in a mess, and clients are knocking down the door
    for their money back—the team has stopped caring!'
  merge: -1
  img_proc: true
- pgno: 60
  md: "After everyone has spoken, the meeting is over. One thing to be vigilant against\
    \ is tangential conversations. It is extremely tempting to try to talk through\
    \ problems during the Scrum. If someone mentions an impediment of some weird and\
    \ wonderful behavior in the code base, all of the developers will likely want\
    \ to hypothesize about the possible causes. Be aware of who needs to be present\
    \ for such conversations—do the test analysts really need to listen to a discussion\
    \ on why Microsoft Visual Studio is using the coders’ entire available RAM? No,\
    \ most likely not. Make a note of the problem and ask the appropriate people to\
    \ take the discussion offline (after the meeting).\n\n# Sprint demo\n\nA sprint\
    \ demo is a key event to put in the sprint calendar. It is a showcase of all of\
    \ the completed stories—those that have met the definition of done during the\
    \ sprint—in action in a real environment. The entire development team should be\
    \ present, and you could also invite other stakeholders to the meeting, such as\
    \ management or sales team representatives. Anyone who might have an interest\
    \ in the project’s progress should be invited to attend. This further fosters\
    \ an openness that all projects should have.\n\nCollect all of the completed user\
    \ stories from the Scrum board and, for each one, explain its scope and what it\
    \ was intended to achieve as part of the project as a whole. Refer to the feature\
    \ to which the story belongs, and the change in application behavior that has\
    \ occurred as a result of its implementation. Proceed to demonstrate this behavior\
    \ by using a real deployment of the system. Invite questions from the audience,\
    \ but do be careful about off-topic issues or getting sidetracked by irrelevance.\
    \ Keep the conversation focused, and offer to talk to people individually after\
    \ the demo has completed. Any suggestions for improvements should feed back into\
    \ the product backlog so that they are correctly prioritized and scheduled. It\
    \ sometimes feels that improvements suggested in the demo are suddenly the most\
    \ important things to be done, but this is rarely a reflection of reality.\n\n\
    The demo should not be feared—it certainly incentivizes progress. No one wants\
    \ to cancel a demo because nothing has been completed, but resist the temptation\
    \ to circumvent the definition of done just to demonstrate something. By being\
    \ honest about progress, you will not have to hide any problems. Instead, point\
    \ to the charts and metrics to explain probable causes for the reduced output.\n\
    \nSpecifying a time before the demo when code will be locked is also a good idea,\
    \ to prevent those tempting last-minute changes to try to claim more points. Dedicate\
    \ a realistic amount of time before the demo to set up the environment and ensure\
    \ that everyone is ready, and guard against throwing reckless technical debt into\
    \ the code for a short-term boost.\n\n> Discipline is the ability to consistently\
    \ choose perpetual benefit over fleeting temptation.\n> \n> Mike Alexander, Fitness\
    \ Expert"
  merge: -1
