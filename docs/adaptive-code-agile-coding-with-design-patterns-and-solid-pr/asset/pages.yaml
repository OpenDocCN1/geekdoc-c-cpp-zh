  md: "By making this test pass, you can then go back and reproduce the original exception\
    \ from the defect report and, this time, determine the ultimate cause of the problem.\n\
    \n# Test setup\n\nLet’s take stock of the tests you have written so far. Each\
    \ has progressively become more complex, with more code required to set up your\
    \ expectations. It would be nice if you could factor this out somewhere in order\
    \ to clean up the tests and shorten them a little. MSTest, like other unit testing\
    \ frameworks, allows special initialization and shutdown methods that are called\
    \ at the start and end of every test, respectively. The initialization method\
    \ can be given any name, but it must be tagged with the TestInitialize attribute.\n\
    \nThe code to put into this method is the code common to nearly all of the unit\
    \ tests: instantiating the mock objects. You can store mock objects as private\
    \ fields in the class so that they are still available to each test. You can also\
    \ do the same with the SUT, because that only requires the mock repository as\
    \ a constructor parameter and its construction doesn’t depend on anything specific\
    \ to each unit test. Listing 5-26 shows the changes required to the test class\
    \ to support the setup method.\n\nLISTING 5-26 The mock objects and the SUT can\
    \ be constructed in a setup method.\n\n```\n[TestClass]\npublic class AccountServiceTests\n\
    {\n    [TestInitialize]\n    public void Setup()\n    {\n        mockAccount =\
    \ new Mock<Account>();\n        mockRepository = new Mock<IAccountRepository>();\n\
    \        sut = new AccountService(mockRepository.Object);\n    }\n\n    private\
    \ Mock<Account> mockAccount;\n    private Mock<IAccountRepository> mockRepository;\n\
    \    private AccountService sut;\n}\n```\n\nWith these objects constructed as\
    \ part of a test initialization method, which is called individually for each\
    \ test method, you can simplify some of the unit test code by removing this object\
    \ construction. Listing 5-27 shows the changes made to the most recent unit test,\
    \ AccountExceptionsAreWrappedInThrowServiceException."
