- pgno: 326
  md: "# LISTING 10-10 ISave implementations will either create or update an entity,\
    \ as appropriate.\n\n```\npublic interface ISave<TEntity>\n{\n    void Save(TEntity\
    \ entity);\n}\n```\n\nAfter this refactor, you can add a new decorator that is\
    \ specific to this interface—audit tracking. Every time a user saves an entity,\
    \ you want to add some metadata to persistent storage. Specifically, you want\
    \ to know which user enacted the save and at what time. Listing 10-11 shows the\
    \ SaveAuditing decorator.\n\n# LISTING 10-11 Two ISave interfaces are used by\
    \ the audit decorator.\n\n```\npublic class SaveAuditing<TEntity> : ISave<TEntity>\n\
    {\n    private readonly ISave<TEntity> decorated;\n    private readonly ISave<AuditInfo>\
    \ auditSave;\n    public SaveAuditing(ISave<TEntity> decorated, ISave<AuditInfo>\
    \ auditSave)\n    {\n        this.decorated = decorated;\n        this.auditSave\
    \ = auditSave;\n    }\n\n    public void Save(TEntity entity)\n    {\n       \
    \ decorated.Save(entity);\n        var auditInfo = new AuditInfo\n        {\n\
    \            UserName = Thread.CurrentPrincipal.Identity.Name,\n            TimeStamp\
    \ = DateTime.Now\n        };\n        auditSave.Save(auditInfo);\n    }\n}\n```\n\
    \nThe SaveAuditing decorator implements the ISave interface, but it also needs\
    \ to be constructed with two further ISave implementations. The first must match\
    \ the TEntity generic type parameter of the decorator and is used to do the real\
    \ work of saving (or, of course, to provide further decoration on the way to doing\
    \ the real work of saving). The second is an ISave implementation that is specifically\
    \ for saving AuditInfo types. This class is not shown, but it can be inferred\
    \ to contain string UserName and DateTime TimeStamp properties. When clients call\
    \ the Save method, a new AuditInfo instance is created and its properties are\
    \ set. The real implementation responsible for saving this instance will then\
    \ persist this new record to storage.\n\nAgain, it is worth reiterating that client\
    \ code has no idea that this is happening; it is entirely unaware that auditing\
    \ is occurring and does not need to change because of the decoration. Similarly,"
