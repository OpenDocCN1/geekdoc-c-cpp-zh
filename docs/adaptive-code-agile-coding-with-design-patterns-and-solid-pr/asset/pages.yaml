  md: "# The Composite pattern\n\nThe Composite pattern is a specialization of the\
    \ Decorator pattern and is one of the more-common uses of that pattern. A UML\
    \ diagram describing the Composite pattern’s collaborators is shown in Figure\
    \ 7-5.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_258_0.png)\n\nFIGURE 7-5 The\
    \ Composite pattern closely resembles the Decorator pattern.\n\nThe Composite\
    \ pattern’s purpose is to allow you to treat many instances of an interface as\
    \ if they were just one instance. Therefore, clients can accept just one instance\
    \ of an interface, but they can be implicitly provided with many instances, without\
    \ requiring the client to change. Listing 7-14 shows a composite decorator in\
    \ practice.\n\n# LISTING 7-14 The composite implementation of an interface.\n\n\
    ```\npublic interface IComponent\n{\n    void Something();\n}\n// . . .\npublic\
    \ class Leaf : IComponent\n{\n    public void Something()\n    {\n    }\n}\n//\
    \ . . .\npublic class CompositeComponent : IComponent\n{\n    public CompositeComponent()\n\
    \    {\n        children = new List<IComponent>();\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 259
  md: "```\n```csharp\npublic void AddComponent(IComponent component)\n{\n    children.Add(component);\n\
    }\n\npublic void RemoveComponent(IComponent component)\n{\n    children.Remove(component);\n\
    }\n\npublic void Something()\n{\n    foreach(var child in children)\n    {\n \
    \       child.Something();\n    }\n}\n\nprivate ICollection<IComponent> children;\n\
    }\n// . . .\nclass Program\n{\n    static void Main(string[] args)\n    {\n  \
    \      var composite = new CompositeComponent();\n        composite.AddComponent(new\
    \ Leaf());\n        composite.AddComponent(new Leaf());\n        composite.AddComponent(new\
    \ Leaf());\n\n        IComponent = composite;\n        component.Something();\n\
    \    }\n\n    static IComponent component;\n}\n```\n```\n\nIn the CompositeComponent\
    \ class, there are methods for adding and removing other instances of the IComponent.\
    \ These methods do not form part of the interface and are for clients of the Composite\
    \ Component class, directly. Whichever factory method or class is tasked with\
    \ creating instances of the CompositeComponent class will also have to create\
    \ the decorated instances and pass them in to the Add method; otherwise, the clients\
    \ of the IComponent would have to change in order to cope with compositions.\n\
    \nWhenever the Something method is called by the IComponent clients, the list\
    \ of composed instances is enumerated, and their respective Something is called.\
    \ This is how you reroute the call to a single instance of IComponent—of type\
    \ CompositeComponent—to many other types.\n\nEach instance that you supply to\
    \ the CompositeComponent class must implement the IComponent interface—and this\
