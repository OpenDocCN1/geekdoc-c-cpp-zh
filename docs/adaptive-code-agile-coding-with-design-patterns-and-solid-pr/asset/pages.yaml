- pgno: 191
  md: '# Mocks and test over-specification


    Testing with mocks is a common but potentially onerous practice. Tests that rely
    on mocks can easily become over-specified. An over-specified test is fragile,
    but you can avoid this fragility by changing what you assert. The problem arises
    when the test includes intimate knowledge of how the system under test (SUT) works.
    In other words, a test is over-specified when it has knowledge of the SUT''s implementation
    rather than its expected behavior.


    A unit test that uses mocks might need to know how the SUT is implemented. However,
    you should always remember that a unit test is a specification of expected behavior,
    so you should avoid introducing tests against implementation details. This might
    include calls to other interfaces on which the SUT might depend. If you assert
    that a method on an interface must be called, the test has become wedded not to
    a certain behavior but to a specific implementation.


    Over-specified tests are undesirable because they prevent refactoring of the production
    code that they test. A suite of passing unit tests accompanying a method or class
    is a signal that the implementation of the method or class can be altered with
    impunity: the only way that the tests will fail is if the expected behavior of
    the code is broken. Over-specified tests do not provide such a guarantee, because
    they will fail if the implementation of the method or class has changed—even if
    the expected behavior remains intact.


    There are two options for avoiding test over-specification when testing with mocks.
    The first is to test behavior only. State-based tests are the best example of
    testing expected behavior. If a method accepts data as input and returns altered
    data as output, the method can be treated as a black box for testing purposes.
    If the method accepts inputs A, B, and C and returns outputs X, Y, and Z, it is
    irrelevant to the test how it arrived at such answers. The method can then be
    refactored without breaking the unit tests.


    The second option is less attractive but is sometimes the only option. You can
    treat the unit test and the implementation that it tests as one atomic unit: if
    one changes, so must the other. This is akin to accepting that the unit test is
    over-specified and planning to throw away the unit test along with the production
    implementation when refactoring. This isn''t quite as wasteful as it might seem.
    As you''ll see in Part III, "SOLID code," SOLID code yields smaller, more directed
    classes that are never altered anyway.


    For this test, you want the second option: return a specified value. The fluent
    interface of the Mock.Setup method call allows you to chain the call to the Returns
    method. This improves readability and reduces what is already becoming a rather
    large Arrange phase of the test. The Returns method is given the Account instance
    that you have already created, and with this you have completed setting your expectations
    of this mock. In brief, you have given the mock the following instruction:


    > When the GetByName method is called for this IAccountRepository instance, and
    the account name provided is "Trading Account", return this instance of the Account
    class.'
