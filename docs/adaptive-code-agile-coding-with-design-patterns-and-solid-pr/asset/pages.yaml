- pgno: 176
  md: "The test has passed a value into the AddTransaction method. This represents\
    \ the monetary amount of the transaction that you are adding to the account. It\
    \ is a decimal value, meaning that it has very high precision, but there is no\
    \ currency value associated with this amount. For simplicity, the assumption is\
    \ that all accounts and transactions are in US dollars.\n\nWith the Arrange and\
    \ Act phases complete, you can move on to the final part of the test.\n\n# Asserting\
    \ the expectations\n\nBoth of the phases up to this point have really been a preamble\
    \ to the crux of this and every unit test: the assertion. This is the part that\
    \ will give you the green indicator of success or the red indicator of failure\
    \ of the test as a whole. The test method name is again the reference point for\
    \ the assertion that you are making—that the account balance has changed. In this\
    \ case, the assertion is going to be a comparison of an *actual* value and an\
    \ *expected* value. This is a common kind of assertion in state-based tests, which\
    \ are tests whose assertions depend on the state of the SUT. This particular assertion\
    \ requires the actual and expected values to be equal.\n\nThe Balance property\
    \ of the Account class will be queried for the actual value, and you will provide\
    \ the expected value as a constant. This means that you must have prior knowledge\
    \ of the expected value, which is a key factor to consider when writing tests.\
    \ Rather than deriving the expected value in code, you should know what the expected\
    \ value is ahead of time. In this scenario, it is easy. Given a new account, whose\
    \ opening balance is zero, if you add $200.00 to that account, what should the\
    \ expected balance be?\n\n$0.00 + $200.00 = $200.00\n\nThus, you can write your\
    \ Assert phase and complete your AAA test, as shown in Listing 5-3.\n\n```\n```csharp\n\
    [TestClass]\npublic class AccountTest\n{\n    [TestMethod]\n    public void AddingTransactionChangesBalance()\n\
    \    {\n        // Arrange\n        var account = new Account();\n\n        //\
    \ Act\n        account.AddTransaction(200m);\n\n        // Assert\n        Assert.AreEqual(200m,\
    \ account.Balance);\n    }\n}\n```\n```"
