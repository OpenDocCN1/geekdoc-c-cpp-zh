- pgno: 168
  md: "Notice also that the extension methods are all targeting the same interface,\
    \ and that all instances to be enhanced must implement this interface. True mixins,\
    \ on the other hand, implement multiple different interfaces and act as aggregate\
    \ adapters.\n\n# Using Re-motion Re-mix\n\nAn alternative way of implementing\
    \ mixins is by using a third-party library such as Re-motion Re-mix. Re-mix allows\
    \ you to specify, via run-time configuration, which classes to combine when creating\
    \ a new instance of a certain target class. As with Impromptu Interface, it generates\
    \ a new type on the fly that fulfills all of the interfaces present on the mixins\
    \ requested, with each instance of this type delegating to an instance of the\
    \ mixin whenever an interface method is called. The interfaces, and some sample\
    \ implementations, are shown in Listing 4-30.\n\nLISTING 4-30 The disparate interfaces\
    \ to be combined as a mixin.\n\n```\npublic interface ITargetInterface\n{\n  \
    \  void DoSomething();\n}\n// ...\npublic class TargetImplementation : ITargetInterface\n\
    {\n    public void DoSomething()\n    {\n        Console.WriteLine(\"ITargetInterface.DoSomething()\"\
    );\n    }\n}\n// ...\npublic interface IMixinInterfaceA\n{\n    void MethodA();\n\
    }\n// ...\npublic class MixinImplementationA : IMixinInterfaceA\n{\n    public\
    \ void MethodA()\n    {\n        Console.WriteLine(\"IMixinInterfaceA.MethodA()\"\
    );\n    }\n}\n// ...\npublic interface IMixinInterfaceB\n{\n    void MethodB(int\
    \ parameter);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "```\n// . . .\npublic class MixinImplementationB : IMixinInterfaceB\n{\n  \
    \  public void MethodB(int parameter)\n    {\n        Console.WriteLine(\"IMixinInterfaceB.MethodB(0)\"\
    , parameter);\n    }\n}\n// . . .\npublic interface IMixinInterfaceC\n{\n    void\
    \ MethodC(string parameter);\n}\n// . . .\npublic class MixinImplementationC :\
    \ IMixinInterfaceC\n{\n    public void MethodC(string parameter)\n    {\n    \
    \    Console.WriteLine(\"IMixinInterfaceC.MethodC(\\\"0\\\")\", parameter);\n\
    \    }\n}\n```\n\nNote that there is no single class that implements all of these\
    \ interfaces. Instead, the next step is to configure Re-mix so that, when it is\
    \ asked for an instance of TargetImplementation, it will return a mixin containing\
    \ all of the interfaces and classes combined. Listing 4-31 shows such a configuration.\n\
    \n# LISTING 4-31 Instructing Re-mix how to construct TargetImplementation instances.\n\
    \n```\nvar config = MixinConfiguration.BuildFromActive()\n    .ForClass<TargetImplementation>()\n\
    \    .AddMixin<MixinImplementationA>()\n    .AddMixin<MixinImplementationB>()\n\
    \    .AddMixin<MixinImplementationC>()\n    .BuildConfiguration();\n\nMixinConfiguration.SetActiveConfiguration(config);\n\
    ```\n\nUnfortunately, you cannot simply call new on the TargetImplementation and\
    \ expect a mixin. Instead, you have to ask Re-mix to create a TargetImplementation\
    \ instance so that it can build a new type to your specification and instantiate\
    \ it. Listing 4-32 shows how it can do that—and luckily, it is simple.\n\n# LISTING\
    \ 4-32 Re-mix is in charge of creating mixins."
