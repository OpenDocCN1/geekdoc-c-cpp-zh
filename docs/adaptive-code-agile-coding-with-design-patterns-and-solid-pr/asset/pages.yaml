- pgno: 42
  md: 'are satisfied that the story is working as required, they can hand it over
    to be acceptance tested. This final phase, also known as *quality assurance* (QA),
    double-checks the working software against the acceptance criteria and either
    approves or rejects it. When it is approved, the user story is complete.


    Let’s recap for a minute. With a user story for guidance, developers gathered
    requirements in an analysis phase, generated a design, implemented a working solution,
    and then tested this against the acceptance criteria. This sounds a lot like waterfall
    development methodologies! Indeed, that’s the whole point of user stories—to perform
    the entire software development life cycle, in miniature, for each story. This
    helps to prevent any wasted effort because it is not until the user story is ready
    to be taken from the Scrum board and implemented that the developers can be sure
    it is still relevant to the software product.


    User stories are the main focus of work in Scrum; they hold the incentive that
    Scrum provides for team members: story points. The team assigns each user story
    its own story point score during sprint planning and, after the user story is
    complete, the story points are considered to be earned and are claimed from the
    sprint total. Story points are explained in further detail later in this chapter.


    **Task**  There is a unit of work smaller than a user story—the task. Stories
    can be broken down into more manageable tasks, which can then be split between
    the developers assigned to the story. I prefer to wait until the story is taken
    off the board before I split it into tasks, but I have also seen this done as
    part of sprint planning.


    Although user stories must incorporate a full vertical slice of functionality,
    tasks can be split at the layer level to take advantage of developer specializations
    within the team. For example, if a new field is required on an existing form,
    there will probably need to be changes to the user interface, business logic,
    and data access layers. You could divide this into three tasks that target these
    three layers and assign each to the relevant specialist: the WPF developer, the
    core C# expert, and the database guru, respectively. Of course, if you are lucky
    enough to have a team of generalizing specialists, anyone should really be able
    to volunteer for any task. This allows everyone to work on various parts of the
    code, which improves their understanding in addition to boosting their job satisfaction.


    It is important to note that the user stories are the bearers of story points
    and that these do not transfer down to their constituent tasks. A five-point story
    that is broken into three distinct tasks is not composed of two one-point tasks
    and a three-point task. This is because there is neither incentive nor credit
    for partially completed work. Unless the story—as a whole—is proven complete by
    the QA process before the end of the sprint, the points that it contains are not
    claimed, even in part. The story remains in progress until the next sprint, when
    ideally it will be completed early in the iteration. If a story takes too long
    to complete and remains in progress for a long time—more than a full sprint’s
    length—it was probably too big in the first place and should have been sliced
    into smaller, more manageable stories.


    **Technical debt**  Technical debt is a very interesting concept, but it is easily
    misunderstood. Technical debt is a metaphor for the design and architectural compromises
    that have been made during a story’s journey across the Scrum board. Technical
    debt has its own section later in this chapter.'
