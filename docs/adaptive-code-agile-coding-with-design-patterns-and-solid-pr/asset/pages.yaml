    \ id)\n{\n    Contract.Requires<EntityNotFoundException>(id != Guid.Empty);\n\n\
    \    return new Entity();\n}\n//. . .\npublic User GetByID(Guid id)\n{\n    Contract.Requires<UserNotFoundException>(id\
    \ != Guid.Empty);\n\n    return new User();\n}\n```\n\nBoth classes use code contracts\
