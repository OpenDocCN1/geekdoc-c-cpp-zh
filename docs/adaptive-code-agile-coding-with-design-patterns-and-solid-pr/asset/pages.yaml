- pgno: 149
  md: "# **LISTING 4-10** When implementing two interfaces with a common method signature,\
    \ only explicit implementation is sufficient.\n\n```\npublic class ClassImplementingClashingInterfaces\
    \ : IInterfaceOne, IAnotherInterfaceOne\n{\n    void IInterfaceOne.MethodOne()\n\
    \    {\n    }\n\n    void IAnotherInterfaceOne.MethodOne()\n    {\n    }\n}\n\
    ```\n\n# Polymorphism\n\nThe ability to use an object of one type and have it\
    \ implicitly act as if it were of a different type is called *polymorphism*. Client\
    \ code can interact with an object as if it is one type when it is actually another.\
    \ This programmatic sleight of hand is one of the most important tenets of object-oriented\
    \ programming and underpins some of the most elegant and powerful solutions to\
    \ programming problems.\n\nFigure 4-3 shows an interface representing the behavior\
    \ of vehicles, and some possible implementing classes for cars, motorcycles, and\
    \ speedboats. Note that each of these three vehicle types is quite distinct, but\
    \ they all exhibit the same behavior due to their unifying interface.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_149_0.png)\n\
    \n# **FIGURE 4-3** Interface pass on their behavior to implementing classes, enabling\
    \ polymorphism."
