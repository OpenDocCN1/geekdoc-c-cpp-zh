  img_proc: true
- pgno: 407
  md: "The view in this application is very simple, in that the code-behind accepts\
    \ the controller as a constructor parameter and initializes the data binding,\
    \ as shown in Listing 12-29. When you are using the Model-View-Presenter pattern,\
    \ the view implements an interface to which the presenter can manually delegate\
    \ calls for setting data.\n\n# LISTING 12-29 This view uses data binding to set\
    \ the retrieved task list to a data grid control.\n\n```\npublic partial class\
    \ TaskListView : Form\n{\n    public TaskListView(TaskListController controller)\n\
    \    {\n        InitializeComponent();\n\n        controller.OnLoad();\n     \
    \   this.taskListControllerBindingSource.DataSource = controller;\n    }\n}\n\
    ```\n\nWithout a framework to resolve your view for you, you must do it yourself\
    \ before passing the form in to the Application.Run method, which starts the Windows\
    \ Forms application. This is only applicable if there is only one main view for\
    \ the application, which is often the case in desktop applications. Dialog boxes\
    \ and other child windows would be created via service calls from the controllers\
    \ or presenters that are implemented by the view.\n\n# Convention over configuration\n\
    \nRegistering by configuration involves painstakingly mapping interfaces to implementations.\
    \ Aside from being time consuming, it is also verbose. Instead, you can use conventions\
    \ to cut down on the amount of code written.\n\nConventions are instructions to\
    \ the container that tell it how to automatically map interfaces to implementations.\
    \ These instructions form the inputs to the container, in place of the registrations.\
    \ Ideally, the container takes this input and processes it, with the output being\
    \ exactly the same registrations that you would otherwise have done manually.\n\
    \n> Note The \"over\" here can be read as \"instead of.\" Thus, this topic is\
    \ about convention instead of configuration."
