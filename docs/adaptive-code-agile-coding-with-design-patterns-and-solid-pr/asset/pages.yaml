- pgno: 86
  md: 'By graphing this table of data as a stacked area chart with the number of work
    items on the y-axis and the day number on the x-axis, you can create the simple
    cumulative flow diagram shown in Figure 2-8.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_86_0.png)


    FIGURE 2-8 A simple cumulative flow diagram for a simple three-phase process.


    Note how the work that is apportioned between To Do, Doing, and Done changes as
    the days progress. As work items move from To Do to Doing, the mid-gray band increases
    in size, and as work items move from Doing to Done, the dark-gray band increases
    in size.


    # Lead time, cycle time, and work in progress


    Taking measurements of parts of a cumulative flow diagram along the x-axis and
    y-axis provides values for the various metrics used in analyzing the health of
    a Kanban board. Figure 2-9 shows these measurements on the example cumulative
    flow diagram.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_86_1.png)


    FIGURE 2-9 How to quickly read the key metrics of process health from a cumulative
    flow diagram.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The measurements for each metric are taken as follows:


    +   - **Lead time** Measuring the x-axis distance between the To Do and Done areas
    gives the lead time of work items.

    +   - **Cycle time** Measuring the x-axis distance between the Doing and Done
    areas gives the cycle time of work items.

    +   - **Work in progress** Measuring the y-axis distance between the Doing and
    Done areas gives the total number of work items that are currently in progress.


    # Healthy flow


    Returning to the example from earlier in this chapter, Figure 2-10 shows the cumulative
    flow diagram for a general software delivery process.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_87_0.png)


    **FIGURE 2-10** A reference example of a cumulative flow diagram exhibiting healthy
    flow.


    Let’s recap: The Deliver state represents work items that have been completed.
    The Wait state represents work that is yet to be started. Work in progress, then,
    is represented by the aggregation of each of the other states: Analyze, Implement,
    and Verify.


    The lead time, cycle time, and work in progress can still be found on this graph
    by considering all three of those states to be work that is currently underway.


    # Unhealthy flows


    Healthy flows are great, but very few software projects exhibit such smooth running
    from start to finish. More commonly, one or more unhealthy flows are encountered
    and, ideally, corrected before causing terminal damage to delivery.


    This section shows some of the most common problems with delivery that are easy
    to spot when visualized on a cumulative flow diagram.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Too much work in progress


    The first and most common problem is shown in Figure 2-11: too much work in progress.
    By only day 3, the board is saturated with eight work items, and by day 5, all
    of the work items are in progress.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_88_0.png)


    FIGURE 2-11 Too much work in progress is a serious problem in a Kanban process,
    and the cumulative flow diagram will make this obvious.


    This happens because of a lack of WIP limits applied to the phases of delivery.
    At various times there are four work items in Analyze, four work items in Implement,
    and four work items in Verify. As a result, over the course of 10 days, only one
    work item is completed sufficiently to reach the Deliver state.


    # Scope creep


    Figure 2-12 shows the result of scope creep on a cumulative flow diagram. Kanban
    is a pull system, which means that work items are only moved into a new phase
    of delivery when there is capacity, but often the backlog for waiting work items
    has no limit on capacity. It is this apparently infinite capacity that allows
    for scope creep.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_88_1.png)


    FIGURE 2-12 A huge spike in Waiting work indicates that the scope of the project
    is in flux.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Up to and including day 6, this cumulative flow diagram looks like an example
    of a healthy flow. However, on day 7, a surge of new tickets is placed on the
    Kanban board in the Wait state.


    Kanban focuses heavily on the reduction of waste. Placing items in the Kanban
    board''s backlog encourages waste because it increases lead times and has a demoralizing
    effect on software delivery teams.


    # Long phase of delivery


    It is important to match the overall pace of your software delivery process to
    the slowest phase of delivery. This is most commonly the Implement phase, when
    coding occurs.


    Figure 2-13 shows the effect of having a long phase of delivery. Note the healthy
    flow until work items reach the bottleneck.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_89_0.png)


    FIGURE 2-13 Implementation is often the longest part of software delivery.


    The remedy to this problem is to apply smaller WIP limits to the bottleneck so
    that upstream work cannot be pulled into an already overburdened phase of delivery.


    # Delivery plateau


    The delivery plateau is not necessarily a failure of process. In fact, it is more
    commonly a result of code that is no longer adaptive to the changes required of
    it. It is the classic problem of accruing technical debt for a short-term gain
    in delivery efficiency, traded off against striving for code quality, maintainability,
    and extensibility in the long term. Ideally, this should be identified early enough
    to allow aggressive refactoring to solve the problem while concurrently delivering
    features. If this issue is left to stagnate for too long, the code will likely
    require wholesale rewrites.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Figure 2-14 shows how this problem manifests itself on a cumulative flow diagram.


    # Plateau


    ![](img/f852e0a12c174e64d91a8e1a05146eab_90_0.png)


    FIGURE 2-14 If delivery plateaus, a lack of coding best practices is often to
    blame.


    # Regulated deployment phase


    Kanban is best suited to a continuous delivery process whereby each change committed
    to source control systems could potentially be released as working software. Even
    compromising mildly, Kanban requires that there be no artificial restrictions
    on the deployment or release of software products.


    Figure 2-15 shows a generally healthy flow of work items with one caveat: the
    Deliver phase jumps twice in the ten days of work, first on day 5 and second on
    day 10. Assuming a working week of Monday to Friday, it seems apt to conclude
    that this team is only allowed to release their code on Fridays.


    # Regulated deployment


    ![](img/f852e0a12c174e64d91a8e1a05146eab_90_1.png)


    FIGURE 2-15 Artificially waiting for a deployment event slows progress and increases
    risk.


    Such a restriction is common in Scrum but is antithetical to the continuous flow
    of work items favored by Kanban.'
  merge: -1
