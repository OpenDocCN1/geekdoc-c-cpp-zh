- pgno: 174
  md: 'prudent technical debt than it is to be late for the sake of gilding a working
    solution. That said, every project is unique in its tolerance for timeliness versus
    completeness.


    There are some recognized unit testing patterns and guidelines that will result
    in repeatable success. These patterns and guidelines are no longer new but expected,
    tried, and tested. The arrangement and naming of unit tests and, most of all,
    how to ensure the testability of the code are all primary concerns. If these concerns
    are neglected, unit tests will no longer be synchronized with the code that they
    test, test failures will be tolerated, and the safety net will wither and break.


    # Arrange, Act, Assert


    Every unit test is composed of three distinct parts:


    +   - The arrangement of the preconditions of the test

    +   - The performance of the act that is being tested

    +   - The assertion that the expected behavior occurred


    These three parts form the Arrange, Act, Assert (AAA) pattern. Every test that
    you write should follow this pattern so that other people can read your unit tests.


    > Note Some readers might be more familiar with this pattern expressed as Given,
    When, Then. This is directly analogous to Arrange, Act, Assert, but it goes like
    this: given some preconditions, when the target of the test is executed, then
    some expected behavior should have occurred.


    # Arranging the preconditions


    Before you can execute the action that you need to test, you must set up the scenario
    that you are testing. For some tests, this will be as simple as constructing the
    system under test (SUT). The SUT is the class that you are testing. Without a
    valid instance of the class, you will not be able to test any of its methods.


    > Tip Static methods do not require an instance to be tested. In cases where your
    SUT is a static method, you can test directly through the class. Be advised, though:
    static methods are often a poor design choice. Static methods should have minimal
    dependencies, because they are very difficult to mock, as you will see later in
    this chapter.


    Listing 5-1 shows a minimal Arrange section of a test for an Account class that
    represents a customer''s balance and transactions. For this example, I use MSTest¹.


    ¹ MSTest is a convenient choice for unit tests—hence its use for the examples
    in this chapter—but it is not a great choice. NUnit and XUnit are better alternative
    testing frameworks that rely on external dependencies.'
