  md: 'This test is now ready to compile and run. By running the test, you can verify
    whether or not the system under test behaves as expected.


    # Running the tests


    When the test is complete, you need to run it by using a unit test runner. Unit
    tests are contained in test projects whose output is assemblies, not executables.
    This means that the test projects cannot be run by themselves but must instead
    be provided as input to a unit test runner. Microsoft Visual Studio supports MSTest
    unit tests with its integrated test runner, whereas some other kinds of unit tests
    require plugins to provide integrated support in Visual Studio.


    In Visual Studio, you can run MSTest unit tests by selecting one of the options
    from the Test > Run menu. For now, you can select the All Tests option, which
    is aliased to the keyboard shortcut Ctrl+R, A. The output of running the AddingTransactionChangesBalance
    unit test is shown in Figure 5-1.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_177_0.png)


    FIGURE 5-1 Running the unit test in the Visual Studio integrated MSTest unit test
    runner.


    The test runner shows a master-details view of the unit tests that you have chosen
    to run. The list of tests is enumerated in the left pane, with more details about
    the selected test shown in the right pane. You can tell that the test took only
    a few milliseconds to execute, which is not much at all. This is precisely one
    of the advantages of writing unit tests—it does not take long to run thousands
    of unit tests, compared to the effort required to test them manually.


    However, notice that the test assertion has failed because the expected value
    of 200 did not match the actual value provided. The account.Balance property was
    used for the actual value of the assertion, and it returned 0.


    This is because the AddTransaction method is not yet implemented. Listing 5-4
    shows the minimal Account class implementation that was required up to this point.'
