  md: "# Lazy decorators\n\nThe lazy decorator allows clients to be provided with\
    \ a reference to an interface that will not be instantiated until its first use.\
    \ Typically, and erroneously, clients are made aware of the presence of a lazy\
    \ instance because a Lazy<T> is passed to them, as in Listing 7-21.\n\nLISTING\
    \ 7-21 This client has been given a Lazy<T>.\n\n```\npublic class ComponentClient\n\
    {\n    public ComponentClient(Lazy<IComponent> component)\n    {\n        this.component\
    \ = component;\n    }\n\n    public void Run()\n    {\n        component.Value.Something();\n\
    \    }\n\n    private readonly Lazy<IComponent> component;\n}\n```\n\nThis client\
    \ has no option but to accept that all instances of IComponent that it is provided\
    \ with will be lazy. However, if you return to a more standard use of the interface,\
    \ you can create a lazy decorator that prevents the client from knowing that it\
    \ is dealing with a Lazy<T>, and allows some ComponentClient objects to accept\
    \ IComponent instances that are not lazy. Listing 7-22 shows this decorator.\n\
    \nLISTING 7-22 LazyComponent implements a lazily instantiated IComponent, but\
    \ ComponentClient is unaware of this.\n\n```\npublic class LazyComponent : IComponent\n\
    {\n    public LazyComponent(Lazy<IComponent> lazyComponent)\n    {\n        this.lazyComponent\
    \ = lazyComponent;\n    }\n\n    public void Something()\n    {\n        lazyComponent.Value.Something();\n\
    \    }\n\n    private readonly Lazy<IComponent> lazyComponent;\n}\n// ...\npublic\
    \ class ComponentClient\n{\n```"
