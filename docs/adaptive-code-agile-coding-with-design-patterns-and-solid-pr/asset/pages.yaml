  md: "```\nif (packageDimensionsInInches.X <= 0f || packageDimensionsInInches.Y <=\
    \ 0f)\n    throw new ArgumentOutOfRangeException(\"packageDimensionsInInches\"\
    , \"Package dimensions must be positive and non-zero\");\n\nvar shippingCost =\
    \ decimal.One;\n\nif(destination == RegionInfo.CurrentRegion)\n{\n    shippingCost\
    \ = decimal.Zero;\n}\n\nreturn shippingCost;\n```\n\nThe unit test asserts that,\
    \ when the current region is used for the destination—that is, the shipping is\
    \ domestic—the WorldwideShippingStrategy does not charge for shipping at all.\
    \ This is reflected in the accompanying implementation. This assertion is, again,\
    \ in conflict with an existing unit test for the base class that asserts the original\
    \ postcondition: that the result is always positive and nonzero, as shown in Listing\
    \ 9-11.\n\n# LISTING 9-11 This unit test shows the original unit test, which fails\
    \ when the strategy is a WorldwideShippingStrategy.\n\n```\n[Test]\npublic void\
    \ ShippingCostMustBePositiveAndNonZero()\n{\n    strategy.CalculateShippingCost(1f,\
    \ ValidDimensions, RegionInfo.CurrentRegion)\n        .Should().BeGreaterThan(0m);\n\
    }\n```\n\nA client could easily be broken by this change in behavior due to its\
    \ assumption of the value of the shipping cost. For example, the client assumes\
    \ that the shipping cost is always positive and nonzero, as indicated by the postcondition\
    \ contract of the ShippingStrategy. This client then uses the shipping cost as\
    \ the denominator in a subsequent calculation. When a switch is made to use the\
    \ new WorldwideShippingStrategy, the client unexpectedly starts throwing DivideByZeroException\
    \ errors for all domestic orders.\n\nHad the LSP been honored and the postcondition\
    \ never weakened, this defect would never have been introduced.\n\n# Invariants\
    \ must be maintained\n\nWhenever a new subclass is created, it must continue to\
    \ honor all the data invariants that were part of the base class. The violation\
    \ of this principle is easy to introduce because subclasses have a lot of freedom\
    \ to introduce new ways of changing previously private data."
