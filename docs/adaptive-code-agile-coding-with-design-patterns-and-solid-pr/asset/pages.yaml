- pgno: 401
  md: "```\npublic void OnLoad()\n{\n    var taskDtos = taskService.GetAllTasks();\n\
    \    AllTasks = new ObservableCollection<TaskViewModel>(mapper.Map<IEnumerable<TaskViewModel>>\
    \ (taskDtos));\n}\n\npublic ObservableCollection<TaskViewModel> AllTasks\n{\n\
    \    get\n    {\n        return allTasks;\n    }\n    set\n    {\n        allTasks\
    \ = value;\n        PropertyChanged(this, new PropertyChangedEventArgs(\"AllTasks\"\
    ));\n    }\n}\n```\n\nThis means that this class must reference whichever assemblies\
    \ the implementations are in and, concomitantly, all subsequent dependencies.\
    \ This is the Entourage anti-pattern all over again. Although the first constructor,\
    \ which accepts only interfaces, sets the scene for the Stairway pattern and well-mannered\
    \ DI, the second, default constructor undermines this.\n\nWhat happens when this\
    \ \"default\" implementation is not what you want anymore? This class will be\
    \ edited to construct the preferred class instead. What about when one default\
    \ constructor is not enough and, in some scenarios, you want implementation A\
    \ whereas in others, you want implementation B? That's enough to make a person\
    \ nauseous.\n\nSometimes this anti-pattern is used to support unit testing, with\
    \ the defaults being mock implementations that do not have dependencies and that\
    \ might reside local to this class. Well, there are much better ways to support\
    \ unit testing. A common example of this sort of practice is converting private\
    \ methods to internal and using the InternalsVisibleToAttribute to allow test\
    \ assemblies to access these methods—rather than testing classes solely through\
    \ their public interface. True, this might appear to be an arbitrarily fine line—after\
    \ all, DI is much vaunted for its enabling of unit testing. But that is precisely\
    \ the point: you have already enabled unit testing through the use of interfaces\
    \ and their injection via the constructor. Mocks can, and should, also be provided\
    \ through that constructor.\n\nIt is worth noting that the classification of Illegitimate\
    \ Injection as an anti-pattern does not hinge on the visibility of the constructor.\
    \ Whether the constructor is public, protected, private, or internal, the outcome\
    \ is the same: you are referencing implementations where you should not be."
  merge: -1
  img_proc: true
- pgno: 402
  md: "# The composition root\n\nOnly one location in an application should have any\
    \ knowledge of dependency injection: the composition root. This is where classes\
    \ are constructed when you are using Poor Man’s DI, or where interfaces and class\
    \ mappings are registered when you are using an Inversion of Control container.\n\
    \nThe ideal is for the composition root to be as close to the entry point of the\
    \ application as possible. This allows you to bootstrap DI as soon as possible,\
    \ gives you a recognized location to find the DI configuration, and helps you\
    \ avoid leaking dependencies on the container throughout the application. It also\
    \ means that for each application type there is a different composition root.\n\
    \n> **The resolution root**\n> \n> Closely related to the composition root is\
    \ the resolution root. This is the object type that forms the root of the object\
    \ graph to be resolved. As in the prior WPF example, it could be that the resolution\
    \ root is even a single *instance*, but it is more commonly a family of types\
    \ unified by a common base.\n> \n> In some cases, you will manually resolve the\
    \ resolution root yourself, but some application types that facilitate dependency\
    \ injection—like MVC—require you to register the mappings while the application\
    \ resolves the roots itself.\n\n# ASP.NET MVC\n\nMVC projects lend themselves\
    \ very well to dependency injection via an IoC container. They have clearly defined\
    \ resolution roots and composition roots, and they are extensible enough to support\
    \ any library that you might need to integrate into the framework for IoC.\n\n\
    The resolution root of an MVC application is the *controller*. All requests from\
    \ the browser are made to routes that map directly to methods—called *actions*—on\
    \ a controller. As the request comes in, the MVC framework maps the URL to a controller\
    \ name, finds the type to which this name corresponds, instantiates it, and then\
    \ invokes the action on the instance. Figure 12-4 depicts this interaction in\
    \ a UML sequence diagram.\n\nWhen you are using IoC for dependency injection,\
    \ the instantiation of the controller is, more accurately, the *resolution* of\
    \ the controller. This means that you can easily follow the Register, Resolve,\
    \ Release pattern, keeping the Resolve call down to the ideal minimum, which is\
    \ in one place."
  merge: -1
