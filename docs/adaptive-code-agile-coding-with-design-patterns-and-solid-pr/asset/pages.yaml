- pgno: 63
  md: 'between two consecutive days: an afternoon and the following morning. The sprint
    demo and retrospective would then be held Tuesday afternoon, and the planning
    meeting for the next sprint would be moved to Wednesday morning.


    # TABLE 1-2 A possible calendar for organizing the Scrum meetings of a sprint
    for a hypothetical project.


    | Date (April 2013) | Time | Type of meeting | Attendees |

    |---|---|---|---|

    | Tuesday 2nd | 13:00-15:30 | Sprint planning | Development team; product owner
