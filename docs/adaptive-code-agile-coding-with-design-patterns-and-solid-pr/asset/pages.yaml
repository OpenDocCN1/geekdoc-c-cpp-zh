  md: "# **LISTING 7-13** A template example of the Decorator pattern.\n\n```\npublic\
    \ interface IComponent\n{\n    void Something();\n}\n// . . .\npublic class ConcreteComponent\
    \ : IComponent\n{\n    public void Something()\n    {\n    }\n}\n// . . .\npublic\
    \ class DecoratorComponent : IComponent\n{\n    private readonly IComponent decoratedComponent;\n\
    \n    public DecoratorComponent(IComponent decoratedComponent)\n    {\n      \
    \  this.decoratedComponent = decoratedComponent;\n    }\n\n    public void Something()\n\
    \    {\n        SomethingElse();\n        decoratedComponent.Something();\n  \
    \  }\n\n    private void SomethingElse()\n    {\n    }\n}\n// . . .\nclass Program\n\
    {\n    static IComponent component;\n\n    static void Main(string[] args)\n \
    \   {\n        component = new DecoratorComponent(new ConcreteComponent());\n\
    \        component.Something();\n    }\n}\n```\n\nBecause a client accepts the\
    \ interface shown in the listing as a method parameter, you can provide either\
    \ the original, undecorated type to that client or you can provide the decorated\
    \ version. Note that the client will be oblivious: it will not have to change\
    \ depending on which version it is being provided."
