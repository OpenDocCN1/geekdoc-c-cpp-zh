    \ must be positive and non-zero\")\n            .And.ParamName.Should().Be(\"\
    packageWeightInKilograms\");\n    }\n}\n```\n```\n\n# Postconditions cannot be\
    \ weakened\n\nWhen applying postconditions to subclasses, the opposite rule applies.\
    \ Instead of not being able to strengthen postconditions, you cannot weaken them.\
    \ As for all the Liskov substitution rules relating to contracts, the reason that\
    \ you cannot weaken postconditions is because existing clients might break when\
    \ presented with the new subclass. Theoretically, if you comply with the LSP,\
    \ any subclass you create should be usable by all existing clients without causing\
    \ them to fail in unexpected ways.\n\nOne such example of causing an unexpected\
    \ failure in an existing client is explored in Listing 9-10. The unit test and\
    \ implementation relate to the WorldwideShippingStrategy, the Shipping-Strategy\
    \ subclass for international packages.\n\n**LISTING 9-10**  The new implementation\
    \ requires a weakening of the postcondition.\n\n```\n```csharp\n[Test]\npublic\
    \ void ShippingDomesticallyIsFree()\n{\n    strategy.CalculateShippingCost(1f,\
    \ ValidDimensions, RegionInfo.CurrentRegion)\n        .Should().Be(decimal.Zero);\n\
    }\n// . . .\npublic override decimal CalculateShippingCost(float packageWeightInKilograms,\
    \ Size<float> packageDimensionsInInches, RegionInfo destination)\n{\n    if (destination\
    \ == null)\n        throw new ArgumentNullException(\"destination\", \"Destination\
    \ must be provided\");\n\n    if (packageWeightInKilograms <= 0f)\n        throw\
    \ new ArgumentOutOfRangeException(\"packageWeightInKilograms\", \"Package weight\
    \ must be positive and non-zero\");\n}\n```\n```"
