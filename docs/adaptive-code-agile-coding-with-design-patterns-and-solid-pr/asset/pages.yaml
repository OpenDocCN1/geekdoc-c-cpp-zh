- pgno: 327
  md: "the leaf implementation of the ISave<TEntity> interface—that is, the non-decorator\
    \ version that is responsible for the actual work of saving—is also unaware of\
    \ the decorator and does not need to change to accommodate any specific decoration.\n\
    \nYou now have three different interfaces where before you had one, and each has\
    \ a decorator that provides some different, meaningful, real-world function. Figure\
    \ 10-2 shows a UML class diagram of the new interfaces and their decorators after\
    \ segregation.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_327_0.png)\n\nFIGURE\
    \ 10-2 Interface segregation allows you to target methods for decoration without\
    \ redundancy.\n\n# Multiple interface decoration\n\nEach decorator so far has\
    \ maintained a one-to-one relationship with the interface that it enhances. This\
    \ is true because each decorator implements the interface that it is decorating.\
    \ But you can use the Adapter pattern (introduced in Chapter 4, \"Interfaces and\
    \ design patterns\"), in conjunction with the Decorator pattern to produce multiple\
    \ decorators while minimizing the code you must write.\n\nThe next decorator you\
    \ will create is intended to publish an event whenever a record is saved or deleted.\
    \ This notification will allow disparate subscribers to act upon any change to\
    \ persistent storage. Note that there is no analogous event for reading any records,\
    \ so the IRead interface will not be targeted in this instance.\n\nFor this, you\
    \ first need a mechanism for publishing and subscribing to events. Continuing\
    \ the theme of interface segregation, this is split into the two interfaces shown\
    \ in Listing 10-12.\n\nLISTING 10-12 Two interfaces for publishing and subscribing\
    \ to events.\n\n```\npublic interface IEventPublisher\n{\n    void Publish<TEvent>(TEvent\
    \ @event)\n    where TEvent : IEvent;\n}\n// . . .\npublic interface IEventSubscriber\n\
    {\n    void Subscribe<TEvent>(TEvent @event)\n    where TEvent : IEvent;\n}\n\
    ```"
