- pgno: 394
  md: "```\n```csharp\nvar connection = connectionFactory.CreateConnection();\ntry\n\
    {\n    connection.Open();\n\n    using (var transaction = connection.BeginTransaction())\n\
    \    {\n        var command = connection.CreateCommand();\n        command.Transaction\
    \ = transaction;\n        command.CommandType = CommandType.StoredProcedure;\n\
    \        command.CommandText = \"[dbo].[Get_all_tasks]\";\n\n        using (var\
    \ reader = command.ExecuteReader(CommandBehavior.CloseConnection))\n        {\n\
    \            while (reader.Read())\n            {\n                allTasks.Add(\n\
    \                    new TaskDto\n                    {\n                    \
    \    ID = reader.GetInt32(IDIndex),\n                        Description = reader.GetString(DescriptionIndex),\n\
    \                        Priority = reader.GetString(PriorityIndex),\n       \
    \                 DueDate = reader.GetDateTime(DueDateIndex),\n              \
    \          Completed = reader.GetBoolean(CompletedIndex)\n                   \
    \ }\n                );\n            }\n        }\n    }\n}\nfinally\n{\n    if\
    \ (connection is IDisposable)\n    {\n        var disposableConnection = connection\
    \ as IDisposable;\n        disposableConnection.Dispose();\n    }\n}\n\nreturn\
    \ allTasks;\n```\n```\n\nOnly if the connection is of type IDisposable do you\
    \ then attempt to call the Dispose method on it. This will work regardless of\
    \ whether the product returned by the factory implements IDisposable or not, but\
    \ if it does, it will clean up its resources by disposing of it.\n\nThe Responsible\
    \ Owner pattern deterministically disposes of objects if they implement IDisposable.\
    \ The pattern effectively ignores the objects if they do not implement IDisposable.\
    \ However, SOLID code often results in multiple decorators that wrap each other\
    \ to add extra functionality. In this case, only if the top-layer object implements\
    \ IDisposable will the Responsible Owner pattern function correctly. When the\
    \ outer decorator does not implement IDisposable, but subsequent layers do, the\
    \ Responsible Owner pattern will not correctly dispose of these instances. Instead,\
    \ you can use the Factory Isolation pattern."
  merge: -1
  img_proc: true
- pgno: 395
  md: "**The Factory Isolation pattern**  This pattern is able to deterministically\
    \ dispose of the complex object graphs that often form as a result of SOLID code.\
    \ It is named after the glove box isolators that are commonly found in laboratories.\
    \ These are glass or metal boxes with integrated gloves to allow safe, protected\
    \ access to the contents. In a similar fashion, the Factory Isolation pattern\
    \ allows safe, protected access to an instance of an object that will be correctly\
    \ disposed of after use.\n\nThe Factory Isolation pattern is only required when\
    \ the target interface does not implement `IDisposable`. Extending the `IDisposable`\
    \ interface burdens all implementations with the requirement that they implement\
    \ a `Dispose` method, even in circumstances where this is unnecessary. Instead,\
    \ `IDisposable` should be treated as an implementation detail and assigned only\
    \ to classes, on an individual basis. This leads to the application of the Responsible\
    \ Owner pattern and the Factory Isolation pattern.\n\nThe examples so far have\
    \ all targeted the lifetime of the `IDbConnection` interface. Unfortunately, this\
    \ interface extends the `IDisposable` interface. If, instead, the assumption is\
    \ made that the target interface does not extend `IDisposable`, the client-side\
    \ view of the Factory Isolation pattern would look like the code in Listing 12-18.\n\
    \n# **LISTING 12-18** An example of a client using the Factory Isolation pattern.\n\
    \n```\npublic IEnumerable<TaskDto> GetAllTasks()\n{\n    var allTasks = new List<TaskDto>();\n\
    \    connectionFactory.WithConnection(connection =>\n    {\n        connection.Open();\n\
    \        using (var transaction = connection.BeginTransaction())\n        {\n\
    \            var command = connection.CreateCommand();\n            command.Transaction\
    \ = transaction;\n            command.CommandType = CommandType.StoredProcedure;\n\
    \            command.CommandText = \"[dbo].[get_all_tasks]\";\n            using\
    \ (var reader = command.ExecuteReader(CommandBehavior.CloseConnection))\n    \
    \        {\n                while (reader.Read())\n                {\n       \
    \             allTasks.Add(\n                        new TaskDto\n           \
    \             {\n                            ID = reader.GetInt32(IDIndex),\n\
    \                            Description = reader.GetString(DescriptionIndex),\n\
    \                            Priority = reader.GetString(PriorityIndex),\n   \
    \                         DueDate = reader.GetDateTime(DueDateIndex),\n      \
    \                      Completed = reader.GetBoolean(CompletedIndex)\n       \
    \                 }\n                    );\n                }\n            }\n\
    \        }\n    });\n\n    return allTasks;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 396
  md: "The Factory Isolation pattern replaces the common Create method, which returns\
    \ an instance of a factory product, instead providing a With method, which accepts\
    \ a lambda method that has the factory product as a parameter.\n\nThe advantage\
    \ here is that the lifetime of the factory product is explicitly linked to the\
    \ lambda method’s scope. This succinctly communicates to the client that it is\
    \ not in control of the product’s lifetime. The factory implementation itself\
    \ is very simple, as shown in Listing 12-19.\n\n**LISTING 12-19** Creating an\
    \ isolating factory is simple.\n\n```\npublic class IsolationConnectionFactory\
    \ : IConnectionIsolationFactory\n{\n    public void With(Action<IDbConnection>\
    \ do)\n    {\n        using(var connection = CreateConnection())\n        {\n\
    \            do(connection);\n        }\n    }\n}\n```\n\nThe With method can\
    \ construct a florid object graph of decorators, adapters, and composites—just\
    \ as SOLID suggests—and manage their lifetimes without the calling client concerning\
    \ itself with anything but using the final product.\n\n# Beyond simple injection\n\
    \nThis section covers some more advanced topics of dependency injection.\n\nDependency\
    \ injection can be implemented in many different ways, by using a variety of different\
    \ frameworks. Some patterns out there are benevolent, supporting and enhancing\
    \ DI while reinforcing what it aims to accomplish. Other patterns do the opposite:\
    \ they detract from the underlying purpose of DI, actively undermining it and\
    \ detracting from the whole point.\n\nTwo such patterns are particularly insidious.\
    \ The Service Locator anti-pattern is, unfortunately, all too common. It is used\
    \ in many frameworks and libraries—sometimes, it is the only way to create a hook\
    \ to use dependency injection. Worse than the Service Locator is an anti-pattern\
    \ with an unfortunate moniker that I shall eschew in favor of something a bit\
    \ more sanitized: *Illegitimate injection*. This is a middle ground where dependency\
    \ injection is used “sometimes,” allowing the construction of services, controllers,\
    \ and similar entities without properly providing their dependencies.\n\nWhen\
    \ using DI, each type of application requires a different kind of setup. With\
    \ each, you need to identify the composition root to correctly integrate your\
    \ registration code. The location of the composition root in a WPF application\
    \ differs from that of a Windows Forms application. Both will differ from that\
    \ of an ASP.NET MVC application."
  merge: -1
  img_proc: true
- pgno: 397
  md: "In advanced scenarios, the manual composition of classes through Poor Man's\
    \ DI and the individual registration of classes through an Inversion of Control\
    \ container might be too laborious and too verbose. You can eliminate a lot of\
    \ boilerplate code by deferring registration to one or more conventions. You can\
    \ also provide some manual registration to handle the edge cases when conventions\
    \ do not suffice.\n\n# The Service Locator anti-pattern\n\nService locators look\
    \ very similar to Inversion of Control containers, which is precisely why they\
    \ are not always thought of as detrimental to the code. Listing 12-20 shows an\
    \ example of the service locator provided by the Patterns and Practices team at\
    \ Microsoft.\n\nLISTING 12-20 The IServiceLocator interface appears to be just\
    \ another IoC container.\n\n```\npublic interface IServiceLocator : IServiceProvider\n\
    {\n    object GetInstance(Type serviceType);\n\n    object GetInstance(Type serviceType,\
    \ string key);\n\n    IEnumerable<object> GetAllInstances(Type serviceType);\n\
    \n    TService GetInstance<TService>();\n\n    TService GetInstance<TService>(string\
    \ key);\n\n    IEnumerable<TService> GetAllInstances<TService>();\n}\n```\n\n\
    Note that methods such as TService GetInstance<TService>() could have been taken\
    \ directly from the IUnityContainer interface—just by swapping the name for Resolve.\
    \ The problem arises from how a service locator is used, thanks to the static\
    \ ServiceLocator class, as shown in Listing 12-21.\n\nLISTING 12-21 This static\
