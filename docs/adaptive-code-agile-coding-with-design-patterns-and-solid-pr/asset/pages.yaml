- pgno: 178
  md: "# LISTING 5-4 The system under test does not need to be completely implemented\
    \ before the unit test.\n\n```\npublic class Account\n{\n    public void AddTransaction(decimal\
    \ amount)\n    {\n    }\n\n    public decimal Balance\n    {\n        get;\n \
    \       private set;\n    }\n}\n```\n\nAs you can tell, this class does nothing\
    \ with the provided transaction amount in the AddTransaction method, and the Balance\
    \ is just a default auto-property, though with a private setter. To make this\
    \ test pass, you have to implement the Account class so that it meets your current\
    \ expectations.\n\n# Test-driven development\n\nTo implement a unit test, you\
    \ do not need a complete implementation of the system under test. In test-driven\
    \ development (TDD), it is preferential not to have a working system under test\
    \ before you write the unit tests. When you use a TDD approach to writing software,\
    \ you write the unit tests and the production code in tandem, with a failing test\
    \ written for every expected behavior exhibited by every method of every class\
    \ in the production code. The failing test fails only because the production code\
    \ does not exist yet. The test states—via assertions—that the production code\
    \ should act in some way, but because it does not yet, the test fails. After the\
    \ production code is implemented in the simplest way possible to satisfy the test's\
    \ requirements, the test will succeed.\n\n# Red, green, refactor!\n\nWhat has\
    \ been produced so far with the AddingTransactionChangesBalance() test is the\
    \ first part of a three-phase process called red, green, refactor.\n\n+   1. Write\
    \ a failing test that targets the expected behavior of the SUT.\n+   2. Implement\
    \ just enough of the SUT so that the new test passes without breaking existing\
    \ successful tests.\n+   3. If any refactoring can be done on the SUT to improve\
    \ its design or overall quality, now is the time to do so.\n\nThe first phase\
    \ generates a failing test, which test runners indicate with a red icon. The second\
    \ phase makes that failing test succeed, turning the icon green. The third phase\
    \ allows you to incrementally improve the production code piece by piece without\
    \ fear of breaking its functionality. Refactoring is covered in more detail in\
    \ Chapter 6, \"Refactoring.\""
