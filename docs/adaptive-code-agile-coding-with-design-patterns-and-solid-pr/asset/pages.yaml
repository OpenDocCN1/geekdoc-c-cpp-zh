- pgno: 150
  md: 'In this example, vehicles are assumed to have an engine that can be started
    and stopped, some provision for steering, and the ability to accelerate. Polymorphism
    allows client code to hold a reference to an IVehicle interface and treat all
    concrete types as if they were the same. The details of how a car steers or accelerates
    compared to a motorcycle, or how a speedboat engine is started and stopped compared
    to a train, is irrelevant to the client. And this is a very good thing. In reality,
    we are all clients to this interface whenever we use a vehicle. Sure, a real interface
    for a vehicle is more nuanced than what is shown here, but the principle is the
    same. Do you need to know how the engine of your car works in order to start and
    stop the engine? No, not at all. Those are all implementation details that can
    have no bearing on your knowledge of driving. That is good interface design.


    The design patterns and interface features that make up the rest of this chapter
    all facilitate the creation of adaptive code. Polymorphism enables each pattern
    to be useful for any class that fulfills an expected interface, whether it has
    already been written or is yet to be conceived.


    # Adaptive design patterns


    Design patterns were popularized by the Gang of Four¹ book, *Design Patterns*
    (Addison-Wesley Professional, 1994). Despite the fact that this book is more than
    20 years old (which is at least four ice ages in software development terms),
    it is still relevant today. Some of the patterns have crossed over to be reclassified
    as anti-patterns, but others are used frequently and enhance the adaptability
    of code.


    Good design patterns are reusable collaborations between interfaces and classes
    that can be applied repeatedly in many different scenarios, across projects, platforms,
    languages, and frameworks. As with most notable best practices, design patterns
    are another theoretical tool that it is better to know than not know. They can
    be overused, and they are not always applicable, sometimes overcomplicating an
    otherwise simple solution with an explosion of classes, interfaces, indirection,
    and abstraction.


    In my experience, design patterns tend to be either underused or overused. In
    some projects, there are not enough design patterns and the code suffers from
    a lack of discernable structure. Other projects apply design patterns too liberally,
    adding indirection and abstraction where the benefit is negligible. The balance
    is in finding the right places to apply the right patterns.


    The specific design patterns contained in this chapter—and, by extension, in this
    book—have been selected for their ability to help create adaptive code.


    # The Null Object pattern


    The Null Object pattern is one of the most common design patterns—and it is one
    of the easiest to comprehend and implement. Its purpose is to allow you to avoid
    throwing a NullReference-Exception and writing a plethora of null object-checking
    code. The UML class diagram in Figure 4-4 shows how the Null Object pattern is
    applied.


    > ¹ So called because of its four authors: Erich Gamma, Richard Helm, Ralph Johnson,
    and John Vlissides.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "![](img/f852e0a12c174e64d91a8e1a05146eab_151_0.png)\n\n**FIGURE 4-4** The Null\
    \ Object pattern demonstrated as a UML class diagram.\n\nListing 4-11 shows some\
    \ typical code that can throw a `NullReferenceException`.\n\n**LISTING 4-11**\
    \ If you don’t check return values for null, there's a chance of throwing a NullReferenceException.\n\
    \n```\n```csharp\nclass Program\n{\n    static IUserRepository userRepository\
    \ = new UserRepository();\n\n    static void Main(string[] args)\n    {\n    \
    \    var user = userRepository.GetByID(Guid.NewGuid());\n        // Without the\
    \ Null Object pattern, this line could throw an exception\n        user.IncrementSessionTicket();\n\
    \    }\n}\n```\n```\n\nEvery client that calls IUserRepository.Get(Guid uniqueID)\
    \ is in danger of throwing a null reference. In practice, this means that every\
    \ client must check that the return value is not null, to avoid attempting to\
    \ dereference null, causing a NullReferenceException to be thrown. This would\
    \ make the client shown previously look more like the code in Listing 4-12.\n\n\
    **LISTING 4-12** Is checking against null really the responsibility of *all* clients?\n\
    \n```\n```csharp\nclass Program\n{\n    static IUserRepository userRepository\
    \ = new UserRepository();\n\n    static void Main(string[] args)\n    {\n    \
    \    var user = userRepository.GetByID(Guid.NewGuid());\n        if(user != null)\n\
    \        {\n            user.IncrementSessionTicket();\n        }\n    }\n}\n\
    ```\n```"
