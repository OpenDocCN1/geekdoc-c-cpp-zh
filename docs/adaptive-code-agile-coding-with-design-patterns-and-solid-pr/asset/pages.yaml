- pgno: 314
  md: "# No new exceptions are allowed\n\nThis rule is more intuitive than the other\
    \ LSP rules that relate to the type system of a language. First, you should consider\
    \ this: what is the purpose of exceptions?\n\nExceptions aim to separate the reporting\
    \ of an error from the handling of an error. It is common for the reporter and\
    \ the handler to be very different classes with different purposes and context.\
    \ The exception object represents the error that occurred through its type and\
    \ the data that it carries with it. Any code can construct and throw an exception,\
    \ just as any code can catch and respond to an exception. However, it is recommended\
    \ that an exception only be caught if something meaningful can be done at that\
    \ point in the code. This could be as simple as rolling back a database transaction\
    \ or as complex as showing users a user interface for them to view the error details\
    \ and to report the error.\n\nIt is also often inadvisable to catch an exception\
    \ and silently do nothing, or catch the general Exception base type. These two\
    \ scenarios together are discouraged even more strongly. With the latter scenario,\
    \ you end up attempting to catch and respond to everything, including exceptions\
    \ that you realistically have no meaningful way of recovering from, like OutOfMemoryException,\
    \ StackOverflowException, or ThreadAbortException. You could improve this situation\
    \ by ensuring that you always inherit your exceptions from ApplicationException,\
    \ because many unrecoverable exceptions inherit from SystemException. However,\
    \ this is not a common practice and relies on third-party libraries to also follow\
    \ this practice.\n\nListing 9-27 shows two exceptions that have a sibling relationship\
    \ in the class hierarchy. It is important to note that this precludes the ability\
    \ to create a single catch block that specifically targets one of the exception\
    \ types and to intercept both types of exception.\n\nLISTING 9-27 Both exceptions\
    \ are of type Exception, but neither inherits from the other.\n\n```\npublic class\
    \ EntityNotFoundException : Exception\n{\n    public EntityNotFoundException()\n\
    \        : base()\n    {\n    }\n\n    public EntityNotFoundException(string message)\n\
    \        : base(message)\n    {\n    }\n}\n//...\npublic class UserNotFoundException\
    \ : Exception\n{\n    public UserNotFoundException()\n        : base()\n    {\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
