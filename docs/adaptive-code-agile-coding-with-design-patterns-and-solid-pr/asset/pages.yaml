    ```


    The first line of the DictionaryIsInvariant test method attempts to assign a dictionary
    whose key and value parameters are of type Subtype to a dictionary whose key and
    value parameters are of type Supertype. This will not work because the IDictionary
    type is not covariant, which would preserve the class hierarchy of Subtype and
    Supertype.


    The second line is also invalid, because it attempts the inverse: to assign a
    dictionary of Supertype to a dictionary of Subtype. This fails because the IDictionary
    type is not contravariant, which would invert the class hierarchy of Subtype and
    Supertype.


    The fact that the IDictionary type is neither covariant nor contravariant leads
    to the conclusion that it must be invariant. Indeed, Listing 9-26 shows how the
    IDictionary type is declared, and you can tell that there is no reference to the
    out or in keywords that would specify covariance and contravariance, respectively.


    LISTING 9-26 None of the generic parameters of the IDictionary interface are marked
    with in or out.


    ```

    public interface IDictionary<TKey, TValue> : ICollection<KeyValuePair<TKey, TValue>>,

    IEnumerable<KeyValuePair<TKey, TValue>>, IEnumerable

    ```


    As previously proven for the general case—that is, without generic types—C# is
    invariant for both method parameter types and return types. Only when generics
    are involved is variance customizable on a per-type basis.


    # Liskov type system rules


    Now that you have a grounding in variance, this section can circle back and relate
    all of this to the Liskov substitution principle. The LSP defines the following
    rules, two of which relate directly to variance:


    +   - There must be contravariance of the method arguments in the subtype.

    +   - There must be covariance of the return types in the subtype.

    +   - No new exceptions are allowed.


    Without contravariance of method arguments and covariance of return types, you
    cannot write code that is LSP-compliant.


    The third rule stands alone as not relating to variance and bears its own discussion.'
