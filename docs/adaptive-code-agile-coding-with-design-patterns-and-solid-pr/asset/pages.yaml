- pgno: 186
  md: '# Test doubles


    Sometimes you need to provide your system under test with a dependency. This dependency
    can be another class or an externality such as the filesystem, a database, or
    a web service. Often, passing in these dependencies to your system under test
    can make your tests brittle and prone to intermittent failure. It also prevents
    the tests from being true unit tests, because they require external dependencies
    to pass. Test doubles are fake implementations that achieve the goal of fulfilling
    a dependency and might also aid your ability to assert against various class interactions.
    There are five different subcategories of test double:


    +   - **Dummies** This is the simplest of all test doubles. Dummies are intended
    to fulfil parameter lists and have no special behavior. Often, real implementations
    are used as dummies and might be primitive types, which are nevertheless required
    to turn a unit test green.

    +   - **Spies** A spy records the calls that have been made to its methods, along
    with the parameters that were supplied to each call. The record of these calls
    can then be used in assertions to ensure that certain calls were made.

    +   - **Stubs** A stub is a dependency that is required by the system under test
    and that will return a pre-supplied answer whenever queried. Stubs are most useful
    at the seams of an application, where external dependencies are required. Instead
    of depending on a database, you can depend on a stub that can return dummy data.

    +   - **Fakes** A fake is very similar to a stub, but the intent is subtly different.
    Fakes are not supplied with any preconceived responses to queries, but are instead
    closer to real implementations with some necessary concession to avoid an external
    dependency. Personally, I make a distinction between a manually implemented mock
    and a mock that is supplied by a mocking framework: manual mocks are called fakes.

    +   - **Mocks** Whereas stubs and fakes provide test doubles for dependencies
    that are indirect queries, mocks are test doubles for dependencies that have indirect
    commands. Mocks are useful to determine whether a command was executed on a dependency
    of the system under test.


    # Manual test fakery


    Continuing the example from above, the first requirement before you can write
    your assertion is an Account instance to assert against. The IAccountRepository
    interface will be used by the AccountService to retrieve the Account that it will
    interact with, so you cannot just give the AccountService such an instance. Instead,
    you need to give the AccountService an IAccountRepository—but you do not have
    any implementations available. Because you depend on interfaces, instead of classes,
    you can write a fake implementation of an interface that will be sufficient only
    for the test. Listing 5-13 shows such a class, which lives in the unit testing
    assembly.'
