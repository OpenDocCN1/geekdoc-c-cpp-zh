    # Layering


    To this point, this chapter has looked primarily at managing dependencies at the
    assembly level. This is a natural first step to organizing your application, because
    all classes and interfaces are contained in assemblies, and how they reference
    each other is a common concern. When correctly organized, your assemblies will
    contain classes and interfaces that only pertain to a single group of related
    functionality. Taken in aggregate, however, how can you ensure that groups of
    assemblies are also correctly organized?


    Groups of two or more interrelated assemblies form *components* of the software
    system that is being developed. It is equally important—if not more so—that these
    components interact in a similarly well-defined and structured fashion. As Figure
    3-17 shows, components are not physical artifacts of deployment, like assembly
    dynamic-link libraries (DLLs), but are logical groupings of assemblies that share
    a similar theme.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/f852e0a12c174e64d91a8e1a05146eab_131_0.png)


    FIGURE 3-17 By grouping related assemblies together, you can define logical components.


    There are three assemblies included in the diagram: Views, Controllers, and ViewModels.
    Each assembly contains two classes that serve different purposes and might require
    different dependencies. Although classes and assemblies are constructs provided
    by the .NET Framework, the User Interface package that groups everything is logical.
    The three assemblies might be located in the solution in a folder called User-Interface,
    but there is nothing preventing you or others from polluting this layer with other
    projects that do not belong. Nothing, that is, except diligence and vigilance.


    In dependency management, components are no different from other programming constructs
    at lower levels. As with methods, classes, and assemblies, you can consider layers
    to be another node in the dependency graph shown earlier in this chapter. Thus,
    the same rules apply: keeping the digraph acyclic and ensuring a single responsibility.


    Layering is an architectural pattern that encourages you to think of software
    components as horizontal layers of functionality that build on each other to form
    a whole application. Components are layered, one on top of another, and the dependency
    direction must always point downward. That is, the bottom layer of the application
    has no dependencies, and each layer upward depends on the layer immediately below
    it. At the top of the stack is the user interface. If the application is a service,
    the top layer will be the API that clients will use to interact with the system.


    # Common layering patterns


    There are several common layering patterns from which to choose for any project.
    Each one presented here should be used as a guide to be tailored to the specific
    requirements and restrictions of your situation. The differentiating factor between
    the layering patterns is simply the number of layers used. This section starts
    with a simple architecture made up of only two layers, then inserts a third layer
    in between, and finally, extrapolates to an arbitrary number of layers.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The number of layers required correlates to the complexity of the solution;
    the complexity of the solution correlates to the complexity of the problem. Therefore,
    the more complex the problem, the more inclined you might be to invest in a multilayered
    architecture. Complexity, in this instance, is measured by many factors: the time
    constraints placed on the project, its required longevity, how frequently the
    requirements might change, and the importance that the development team places
    on patterns and practices, to name only a few.


    Because this book is about adapting to changes in requirements, I advocate doing
    the *simplest thing possible first*, and refactoring toward something more complex
    *only when required*. This has positive effects on projects. First, it allows
    you to deliver something as soon as possible. Feedback should be sought early
    and frequently in software development. Trying to deliver the perfect solution
    is pointless if the customer’s idea of perfection differs from the development
    team’s idea of perfection. Developing a multilayer solution takes longer than
    a simple two-layer solution, delaying that all-important feedback loop.


    # Layers vs. tiers


    The difference between layers and tiers is the difference between the logical
    organization and physical deployment of code. Logically, you could separate an
    application into three or four *layers*, but physically deploy it into one *tier*.
    The number of tiers is somewhat related to the number of machines that the application
    is deployed to. If you deploy to a single machine, you are deploying an application
    in one tier. If you deploy the application to two machines, split by at least
    two layers, you are deploying to two tiers.


    With every tier that you deploy to, you accept that you are crossing a network
    boundary, and with that comes a temporal cost: it is expensive to cross a processing
    boundary within the same machine, but it is much more expensive to cross a network
    boundary. Crossing a network boundary also introduces an inevitable failure point:
    networks are unreliable and *will* fail. However, deploying in tiers has a distinct
    advantage because it allows you to scale your applications. If you deploy a web
    application that consists of a user interface layer, a logic layer, and a data
    access layer onto a single machine—that is a single tier—that machine now has
    a lot of work to do, and the number of users you can support will necessarily
    be lower. Were you to split the application’s deployment into two tiers—putting
    the database on one tier and the user interface and logic layers on another—you
    could actually scale the user interface layer both *horizontally* and *vertically*.


    To scale vertically, you increase the power of the computer by adding memory or
    processing units. This allows the single machine to achieve more by itself. However,
    you can also scale horizontally by adding completely new machines that perform
    exactly the same task. There would be multiple machines to host the web user interface
    code and a load balancer that would direct clients to the least busy machine at
    any point in time. Of course, this is not a panacea to supporting more concurrent
    users on a web application. This requires more care with data caching and user
    authentication, because each request made by a user could be handled by a different
    machine.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Two layers


    A two-layered solution is the simplest step forward from having no discernable
    layering. It is useful only in a narrow set of circumstances, but it is extremely
    quick to implement. The only two layers included are the user interface layer
    and the data access layer. Remember that this does not limit you to just two assemblies,
    but two logical groups of assemblies: one focusing directly on the user interface,
    the other on data access.


    Figure 3-18 shows the two layers as packages in a UML diagram, each layer containing
    assemblies relating to those layers. The only dependency shown is directed from
    the user interface layer down to the data access layer. This is the only way that
    the dependencies can ever be directed in any layered architecture.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_133_0.png)


    FIGURE 3-18 A two-layered application consists of the UI components and the data
    access components.


    # User interface


    The user interface layer is responsible for:


    +   - Providing a way for the user to interact with the application (for example,
    desktop windows and controls, a webpage, or a console application''s command line
    or menu).

    +   - Presenting data and information to the user.

    +   - Receiving requests from the user in the form of queries or commands.

    +   - Validating input that the user has entered.


    The user interface layer can vary in its implementation. It could be a Windows
    Presentation Foundation (WPF) client packed with fancy graphics and animation,
    a set of webpages that the user navigates through, or a simple console application
    that uses command-line switches or a simple menu for the user to select a command
    or query to execute.


    > Note In some cases, the user interface could be replaced with a set of services
    that surface functionality to clients elsewhere. There isn''t really a user interface,
    but the two-layer architecture is still apparent, with the UI layer being replaced
    by an API layer.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The user interface layer sits on top of the data access layer and can make
    use of it. However, as discussed previously in relation to assembly references,
    the user interface layer should not make direct reference to any of the data access
    layer’s implementation assemblies. There should be a strict separation between
    the interface and implementation assemblies of the two layers. This makes the
    layering diagram look a little more like Figure 3-19.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_134_0.png)


    **FIGURE 3-19** The two layers are separated into implementation assemblies and
    interface assemblies.


    Each layer is the combination of an abstraction of the functionality that a higher
    layer depends on, along with an implementation of this abstraction. If a layer
    above starts referencing part of the implementation of a layer, that layer is
    called a *leaky abstraction*. The dependencies of that layer’s implementation
    will begin to leak into later layers further up the stack, resulting in avoidable
    dependencies.


    **Data access**  The responsibilities of the data access layer are:


    +   - Servicing queries for data.

    +   - Serializing and deserializing object models to and from a relational model.


    The implementation of the data access layer can be just as varied as that of the
    user interface layer. This layer typically includes some kind of persistent data
    store that could include a relational database such as Microsoft SQL Server, Oracle,
    MySQL, or PostgreSQL or a document database such as MongoDB, RavenDB, or Riak.
    In addition to the data storage mechanism, there is likely to be one or more supporting
    assemblies for executing queries or insert/update/delete commands by calling stored
    procedures, or for mapping data to a relational database via Entity Framework
    or NHibernate.


    Data access layers should be hidden behind interfaces that do not depend on any
    of these technology choices. As with all interfaces, there should be no reference
    to a third-party dependency, thus keeping clients separated from the choice of
    implementation.


    A well-designed data access layer is reusable across multiple applications. If
    two different user interfaces require the same data but present it in different
    forms, the same data access layer can be shared between them. Imagine an application
    that runs across multiple platforms: Windows 10 and Windows Phone 10. Both have
    different user interface requirements, but each could use the same data access
    layer.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'As with any architecture, using only two layers has some tradeoffs that must
    be considered carefully before adoption. The two-layer architecture is a good
    choice when:


    +   - There is little or no logic to the application beyond some trivial validation.
    This can easily be encapsulated in either the data access layer or the user interface
    layer.

    +   - The application performs mainly CRUD operations on data. Creating, reading,
    updating, and deleting data becomes more difficult with every additional layer
    placed between the user interface and the data itself.

    +   - Time is short. If only a prototype or a bootstrap needs to be developed,
    limiting the number of layers can save a lot of time, and the feasibility of a
    proof of concept can be ascertained.


    However, the two-layer architecture has some obvious drawbacks and is a bad choice
    when:


    +   - There is significant logic in the application, or logic is subject to change.
    Any logic placed in the user interface layer or data access layer is technically
    a pollution of that layer and decreases its flexibility and maintainability.

    +   - The application is certain to outgrow two layers within one or two sprints.
    Any concessions made to obtain quick feedback are not worth the investment if
    that architecture will only last a matter of weeks.


    The two-layer architecture is still very much a viable alternative. Too many developers
    are enchanted by the latest architectural trend and overlook simpler designs.
    This causes an otherwise trivial application to receive feedback too late and
    makes it fragile and hard to maintain. Often, the simplest thing possible is the
    right thing to do.


    # Three layers


    The three-layer architecture adds an extra layer between the user interface and
    the data access layer. This is the logic layer. The addition of the logic layer
    allows the application to encapsulate more complex processing. The logic layer,
    like the data access layer, can be reused across multiple applications, so it
    need not be implemented multiple times. Figure 3-20 shows the typical three-layer
    architecture.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_135_0.png)


    FIGURE 3-20 The third layer contains processing or business logic for the application.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Again, like the data access layer, the logic layer provides interface and implementation
    assemblies to clients, to avoid a leaky abstraction.


    > **Note** Although the three-layer architecture is very common for web applications,
    it is typically deployed in only two tiers. One node handles the database, and
    another node handles almost everything else: the user interface, the logic, and
    even part of the data access.


    **Business logic**  The business logic layer’s responsibilities are:


    +   - Handle commands from the user interface layer.

    +   - Model the business domain to capture business processes, rules, and workflow.


    The logic layer might be a command processor that receives commands from the user
    via the user interface layer and, by collaborating with the data access layer,
    solves a specific problem or executes a particular task. It could also be a fully
    developed domain model that aims to map a business’s processes into software.
    For the latter, it is common for the data access layer to include an Object/Relational
    Mapping (ORM) component so that the logic layer can be implemented directly into
    classes, possibly using domain-driven design (DDD). In a domain model, there should
    be no dependencies, either further down the stack or via some implementation-specific
    technology. For example, the domain model’s assemblies should have no dependencies
    on an ORM library. Instead, a separate mapping assembly should be created that
    is implementation-specific and instructs the ORM how to map to the domain model.
    This allows the domain model’s core classes to be reused without depending on
    the ORM, and the ORM could be replaced without affecting the domain model or its
    clients. Figure 3-21 shows a possible implementation of a logic layer that uses
    a domain model.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_136_0.png)


    **FIGURE 3-21** The assemblies of a domain model collaborate to form a logic layer.


    The addition of a logic layer is necessary when there is complex logic in the
    application, such as business rules that aim to reflect the real-world workflows
    of people’s jobs. Even if the logic is not particularly complex but changes often,
    this is a good argument for introducing a separate layer for encapsulating this
    behavior. It simplifies the user interface and data access layers, allowing them
    to concentrate fully on their own purpose.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Cross-cutting concerns\n\nSometimes a component’s responsibilities are not\
    \ easily limited to a single layer. Functions such as auditing, security, and\
    \ caching can permeate through the entire application, because they are applicable\
    \ at every layer. Tracing the code’s actions at each method call and return, for\
    \ example, is a useful debugging tool when the application has been deployed and\
    \ if the Visual Studio debugger cannot be attached to step through the code. You\
    \ can manually produce an output of the values of parameters as they are passed\
    \ around, and the return values of various methods, as shown in Listing 3-24.\n\
    \n**LISTING 3-24** Manually applying cross-cutting concerns quickly swamps the\
    \ real intent of the code.\n\n```\npublic void OpenNewAccount(Guid ownerID, string\
    \ accountName, decimal openingBalance)\n{\n    log.WriteInfo(\"Creating new account\
    \ for owner {0} with name '{1}' and an opening balance of {2}\", ownerID, accountName,\
    \ openingBalance);\n\n    using(var transaction = session.BeginTransaction())\n\
    \    {\n        var user = userRepository.GetByID(ownerID);\n        user.CreateAccount(accountName);\n\
    \        var account = user.FindAccount(accountName);\n        account.SetBalance(openingBalance);\n\
    \n        transaction.Commit();\n    }\n}\n```\n\nThis is laborious and error-prone,\
    \ and it instantly pollutes every method with irrelevant boilerplate code, increasing\
    \ the noise-to-signal ratio. Instead, you can factor out such cross-cutting concerns\
    \ into encapsulated functionality and apply them to the code in a much less invasive\
    \ fashion. The most common way of adding functionality non-invasively is through\
    \ aspect-oriented programming.\n\nAspect-oriented programming (AOP) is the application\
    \ of cross-cutting concerns—or aspects—to multiple layers in the code. The .NET\
    \ Framework has several AOP libraries to choose from (search NuGet for AOP), but\
    \ the examples given here are for PostSharp, which has a free Express version,\
    \ though with reduced functionality. Listing 3-25 shows tracing code factored\
    \ out into a PostSharp aspect and applied as an attribute to some methods.\n\n\
    **LISTING 3-25** Aspects are a great way to implement cross-cutting concerns.\n\
    \n```\n[Logged]\n[Transactional]\npublic void OpenNewAccount(Guid ownerID, string\
    \ accountName, decimal openingBalance)\n{\n    var user = userRepository.GetByID(ownerID);\n\
    \    user.CreateAccount(accountName);\n    var account = user.FindAccount(accountName);\n\
    \    account.SetBalance(openingBalance);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "The two attributes decorating the OpenNewAccount method provide the same functionality\
    \ as shown in Listing 3-24, but the intent of the method is clearer. The Logged\
    \ attribute writes information about the method call to a log, including parameter\
    \ values. The Transactional attribute wraps the method in a database transaction\
    \ and commits the transaction on success or rolls back the transaction on failure.\
    \ The key here is that both of these attributes are generic enough to be applied\
    \ to any method, not specifically this one, so they can be reused many times.\n\
    \n# Asymmetric layering\n\nAll of the users’ requests to an application occur\
    \ through the provided user interface. However, the path that the requests follow\
    \ after that is not necessarily always the same. The layering could be asymmetrical,\
    \ depending on the type of request being made. This is motivated by the need to\
    \ be pragmatic and to consider whether the layering in place is overkill or even\
    \ insufficient for some requests.\n\nA pattern of asymmetric layering that has\
    \ rapidly gained popularity in the last few years is Command/Query Responsibility\
    \ Segregation (CQRS). Before discussing CQRS, which is an architectural pattern,\
    \ a grounding in its method-level influencer, command/query separation, is required.\n\
    \n# Command/query separation\n\nBertrand Meyer, in his book Object-Oriented Software\
    \ Construction (Prentice Hall, 1997), used the phrase command/query separation\
    \ (CQS) to explain that all object methods should be one of only two things: a\
    \ command or a query.\n\nCommands are imperative calls to action, requiring the\
    \ code to do something. These methods are allowed to change the state of a system\
    \ but should not also return a value. Listing 3-26 shows an example of a CQS-compliant\
    \ command method, followed by one that is noncompliant.\n\nLISTING 3-26 CQS-compliant\
    \ and non-CQS-compliant command methods.\n\n```\n// Compliant command\nPublic\
    \ void SaveUser(string name)\n{\n    session.Save(new User(name));\n}\n// Non-compliant\
    \ command\npublic User SaveUser(string name)\n{\n    var user = new User(name);\n\
    \    session.Save(user);\n    return user;\n}\n```\n\nQueries are requests for\
    \ data, requiring the code to get something. These methods return data to calling\
    \ clients but should not also change the state of a system. Listing 3-27 shows\
    \ an example of a CQS-compliant query method, followed by one that is noncompliant."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# LISTING 3-27 CQS-compliant and non-CQS-compliant query methods.\n\n```\n\
    // Compliant query\nPublic IEnumerable<User> FindUserByID(Guid userID)\n{\n  \
    \  return session.Get<User>(userID);\n}\n// Non-compliant query\npublic IEnumerable<User>\
    \ FindUserByID(Guid userID)\n{\n    var user = session.Get<User>(userID);\n  \
    \  user.LastAccessed = DateTime.Now;\n    return user;\n}\n```\n\nCommands and\
    \ queries are thus differentiated by the presence of a return value. If a method\
    \ returns a value (and is CQS-compliant) you can safely assume that it does not\
    \ change any state of the object. The advantage here is that you can reorder query\
    \ calls knowing that they have no other effect on the object. A method having\
    \ no return value (and that is CQS-compliant) indicates that you can assume that\
    \ it does change the state of the object. For these calls, you would have to be\
    \ more careful in your call order.\n\n# Command/Query Responsibility Segregation\n\
    \nThe Command/Query Responsibility Segregation pattern is attributed to Greg Young.\
    \ The pattern is the application of CQS at an architectural level and is an example\
    \ of asymmetric layering. Commands and queries follow much the same rules as with\
    \ CQS, but CQRS goes one step further: it acknowledges that commands and queries\
    \ might need to follow different paths through the layering in order to be best\
    \ handled.\n\nAn example of where minimal CQRS can be applied is when you are\
    \ developing a three-layer architecture with a domain model. In this instance,\
    \ the domain model is only ever used by the commanding side of the application,\
    \ with a much simpler two-layer architecture used for the querying side. Figure\
    \ 3-22 exemplifies this design.\n\n![](img/f852e0a12c174e64d91a8e1a05146eab_139_0.png)\n\
    \nFIGURE 3-22 Domain models should only be used for handling commands."
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Querying data often needs to be fast and is allowed to provide few guarantees
    of transactional consistency: phantom reads or nonrepeatable reads can be an acceptable
    tradeoff for increased responsiveness. Command processing, though, is often required
    to have transactional consistency, hence the differing layers in place to handle
    commands and queries. Sometimes, the data access layers can also differ between
    commands and queries. A fully ACID-compliant (ACID stands for atomic, consistent,
    isolated, durable) database might be needed for commands, whereas simple document
    storage might suffice for queries. The document storage would be updated asynchronously
    by events published from the command layer, giving eventual consistency to the
    query reads.


    # Conclusion


    This chapter has shown how the organization of dependencies presents a significant
    challenge when creating software applications. The long-term health, adaptability,
    and possibly the viability of a project relies on sound management of dependencies.
    A mess of spaghetti-like interdependencies will occur if developers create classes
    that reference each other without careful consideration, which can seriously affect
    a team''s ability to deliver business value in a consistent, predictable fashion.


    Dependencies must be managed at all levels, from individual classes and methods
    interacting with each other, through assembly references, to the high-level architecture
    of components. Developers must be constantly vigilant that spurious dependencies
    do not leak outside of their method, class, assembly, or layer.


    In some ways, this chapter underpins a lot of the content of the rest of this
    book. The content provides a solid foundation for maintainable, adaptive code
    that is reinforced with each chapter. If your assemblies are a spaghetti of references,
    and your layers do not hide their infrastructural dependencies, your code will
    become harder to test, amend, and understand, no matter what other patterns or
    practices you attempt to follow.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Interfaces and design patterns


    After completing this chapter, you will be able to


    +   - Define interfaces and identify the ways in which they differ from classes.

    +   - Apply design patterns, such as the Adapter and Strategy patterns, by using
    interfaces.

    +   - Understand an interface''s versatility through duck-typing, mixins, and
    fluent interfaces.

    +   - Identify the limitations of interfaces and implement workarounds.

    +   - Spot common anti-patterns and abuses of interfaces.


    The interface is a powerful construct in Microsoft .NET Framework development.
    Although the interface keyword is very simple, what it represents is a very powerful
    paradigm. When used correctly, interfaces provide your code with the extension
    points that make it adaptive. However, some uses of interfaces are not so good,
    yet they remain in common use.


    This chapter provides a reminder of the differences between classes and interfaces
    and describes how best to use the two together, both to protect client code from
    implementation changes and to facilitate polymorphism.


    It also covers the versatility of interfaces and how they are a ubiquitous tool
    in modern software solutions. This chapter demonstrates some powerful design patterns
    that, when applied correctly (in conjunction with other patterns in this book)
    yield code that is very flexible and able to adapt to the changing requirements
    that Agile projects embrace.


    However, interfaces alone are no panacea. A judicious sprinkling of interfaces
    can certainly help a project, but the interfaces must be applied in the correct
    manner. This chapter also explores some of the common abuses of interfaces.


    # What is an interface?


    An interface defines the behavior that a class has, but not how this behavior
    is implemented. An interface stands as a separate construct from a class, but
    it requires a class to provide the working code to fulfill the interface.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "An interface is defined by its syntax—that is, the language-construct side\
    \ of the interface: the interface keyword and everything that this implies and\
    \ entails. But interfaces are also defined by their features: the concepts that\
    \ they represent and enable.\n\n# Syntax\n\nInterfaces are defined by using the\
    \ interface keyword. They can contain properties, methods, and events, just as\
    \ classes can. However, no element of an interface can be given an access modifier:\
    \ the implementing class must implement an interface as public. Listing 4-1 shows\
    \ the declaration of an interface, along with a possible implementation.\n\nLISTING\
    \ 4-1 Declaring and implementing an interface.\n\n```\npublic interface ISimpleInterface\n\
    {\n    void ThisMethodRequiresImplementation();\n\n    string ThisStringPropertyNeedsImplementingToo\n\
    \    {\n        get;\n        set;\n    }\n\n    int ThisIntegerPropertyOnlyNeedsAGetter\n\
    \    {\n        get;\n    }\n\n    event EventHandler<EventArgs> InterfacesCanContainEventsToo;\n\
    }\n// ...\npublic class SimpleInterfaceImplementation : ISimpleInterface\n{\n\
    \    public void ThisMethodRequiresImplementation()\n    {\n    }\n\n    public\
