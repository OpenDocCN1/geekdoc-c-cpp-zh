    \ },\n{ \"correct-format.txt\", \"expectation-correct-format.txt\" }\n};\n\nvar\
    \ originalConsoleOut = Console.Out;\n\nforeach (var pair in inputsAndExpectations)\n\
    {\n    var input = typeof(CharacterizationTest).Assembly\n        .GetManifestResourceStream(typeof(CharacterizationTest),\
    \ pair.Key);\n    var expectation = File.ReadAllText(\n        Path.Combine(CharacterizationTestOutput,\
    \ pair.Value));\n\n    string actual = null;\n    using (var memoryStream = new\
    \ MemoryStream())\n    using (var streamWriter = new StreamWriter(memoryStream))\n\
    \    {\n        Console.SetOut(streamWriter);\n\n        var tradeProcessor =\
    \ new TradeProcessor();\n        tradeProcessor.ProcessTrades(input);\n\n    \
    \    streamWriter.Flush();\n\n        memoryStream.Seek(0, SeekOrigin.Begin);\n\
    \        actual = new StreamReader(memoryStream).ReadToEnd();\n    }\n\n    Assert.Equal(expectation,\
    \ actual);\n}\n\nConsole.SetOut(originalConsoleOut);\n}\n```\n\nThe test itself\
    \ will run the TradeProcessor with each configured input file and capture the\
    \ output string in memory. It will then compare that actual result with the expected\
    \ result that was generated by the characterization test. This is repeated for\
    \ each input and output pair, as long as there are no breaking changes to the\
    \ code.\n\nNote how fragile this method of testing is: a change to a logging line\
    \ will break the test but will not break the real behavior of the TradeProcessor.\
    \ This is a false negative result. Conversely, you could change any part of the\
    \ database interaction and the golden master test will still pass, despite the\
    \ TradeProcessor no longer functioning as it should. This is a false positive\
    \ result. Therefore, golden master tests are not replacements for real unit tests:\
    \ they do not give you the same level of confidence that you have avoided introducing\
    \ a regression bug through refactoring.\n\nIn the next chapter, you will refactor\
    \ this code to follow the first of five SOLID principles: single responsibility."
