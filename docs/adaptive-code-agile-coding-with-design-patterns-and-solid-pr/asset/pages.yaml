  md: 'When you run your test again it will pass, just as before, as proven by Figure
    5-6.


    ![](img/f852e0a12c174e64d91a8e1a05146eab_192_0.png)


    FIGURE 5-6 After being mocked with stubs, the test passes again.


    Before you rejoice, you need to acknowledge that you have cheated. You have edited
    a unit test and not transitioned it from red to green. The test was already successful
    and, perhaps despite the change, it is still successful. In order to fail this
    test and then verify that it only passes as a result of a correctly implemented
    SUT, you should remove the code inside the AddTransactionToAccount method. When
    you do so, the test will fail, reinstating the code causes the test to succeed.
    This is an important part of the unit test editing process that avoids false positives—that
    is, it prevents you from writing a test that succeeds despite not being implemented
    correctly.


    # Testing all control flows


    Your first attempt at completing a working AccountService by using a TDD approach
    has been successful. There are potential problems that will require further tests
    to ensure that this method is much more robust. So far, you have tested only the
    Happy Path: the execution path through the code that yields no errors and causes
    no problems. There are a few gaps that need to be addressed:


    +   - What if the account repository is a null reference?

    +   - What if the repository cannot find the account?

    +   - What if the account method throws an exception?


    With each extra test that you write, you either uncover a defect that exists in
    your implementation (if the test fails) or you add extra confidence that your
    implementation is robust (if the test succeeds).


    Under what circumstances might the account repository be a null reference? This
    will occur only if the AccountService is constructed with a null passed in as
    its constructor parameter. Because a valid account repository is a required dependency
    for the account service, you could say that this is a precondition of the constructor.
    Thus, we can write the test in Listing 5-18.


    This test is slightly different from the previous ones; the assertion is not in
    the usual place. MSTest requires you to apply the ExpectedExceptionAttribute to
    the test method with a parameter describing the type of exception that you require.'
