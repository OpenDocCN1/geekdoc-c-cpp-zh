- pgno: 175
  md: "This chapter will continue to build on this example for the Act and Assert\
    \ parts of the test, too. The test method’s name, `AddingTransactionChangesBalance()`,\
    \ succinctly describes the intent of the test—to ensure that whenever a transaction\
    \ is added to the account, the balance of the account is changed to include this\
    \ new transaction.\n\n```\n```csharp\n[TestClass]\npublic class AccountTest\n\
    {\n    [TestMethod]\n    public void AddingTransactionChangesBalance()\n    {\n\
    \        // Arrange\n        var account = new Account();\n    }\n}\n```\n```\n\
    \nThe Arrange step taken here is simple enough. The only precondition to this\
    \ test is a new instance of the Account class. You create this directly in your\
    \ test by calling the new operator. From here, you can move on to the next step\
    \ in the AAA pattern.\n\n# Performing the testable act\n\nNow that you have the\
    \ system under test ready to be acted on, you can execute the method that you\
    \ are testing. Each test’s Act phase should consist of just one interaction with\
    \ the system under test—one method call or property getter or setter, for instance.\
    \ This ensures that the tests are simple to both read and write and have clearly\
    \ delineated execution paths.\n\nListing 5-2 shows the addition of the Act part\
    \ of the test. In keeping with the test method’s name, the test calls the `account.AddTransaction()`\
    \ method.\n\n```\n```csharp\n[TestClass]\npublic class AccountTest\n{\n    [TestMethod]\n\
    \    public void AddingTransactionChangesBalance()\n    {\n        // Arrange\n\
    \        var account = new Account();\n\n        // Act\n        account.AddTransaction(200m);\n\
    \    }\n}\n```\n```"
