- pgno: 388
  md: "Some changes need to be made to the application entry point for Unity to read\
    \ this XML configuration. Listing 12-12 shows that these changes are minimal.\n\
    \n# **LISTING 12-12** Now the registration phase involves passing the configuration\
    \ section to the container.\n\n```\npublic partial class App : Application\n{\n\
    \    private UnityContainer container;\n\n    private void OnApplicationStartup(object\
    \ sender, StartupEventArgs e)\n    {\n        CreateMappings();\n\n        var\
    \ section = (UnityConfigurationSection)ConfigurationManager.GetSection(\"unity\"\
    );\n        container = new UnityContainer().LoadConfiguration(section);\n\n \
    \       MainWindow = container.Resolve<TaskListView>();\n        MainWindow.Show();\n\
    \n        ((TaskListController)MainWindow.DataContext).OnLoad();\n    }\n\n  \
    \  private void CreateMappings()\n    {\n        AutoMapper.Mapper.CreateMap<TaskDto,\
    \ TaskViewModel>();\n    }\n}\n```\n\nJust two lines are required. First, you\
    \ load the unity section from the configuration file by using the ConfigurationManager\
    \ class. This is cast to the UnityConfigurationSection type so that it can be\
    \ passed to the LoadConfiguration method of a newly instantiated UnityContainer.\
    \ After this, the container can be used, as before, to resolve the main window\
    \ of the application.\n\nAlthough declarative registration brings the benefit\
    \ of configuration-time type mapping, it has significant drawbacks that make it\
    \ impractical in many situations. The biggest problem is its verbosity. This small\
    \ example is already a lot more typing than before, but this example is small.\
    \ In some cases, the registration code could be a few times larger than this,\
    \ or more. As XML, it would be even larger still. If a typographical error was\
    \ made in any of the alias or registration sections, it would not be caught until\
    \ run time, whereas such errors are caught by the compiler in procedural code.\n\
    \nThe most compelling reason that declarative registration is suboptimal is that\
    \ most IoC containers allow for a lot of variation in registration. This can include\
    \ lambda factories, whereby a lambda method is provided to the registration method,\
    \ to be called whenever the interface is resolved. Such procedural code is not\
    \ possible in declarative XML.\n\n# **Object lifetime**\n\nIt is important to\
    \ acknowledge that not every object in the application has an equal lifetime.\
    \ That is, some objects might need to live longer than others. Of course, in the\
    \ managed languages of .NET, there is no deterministic way to destroy an object,\
    \ but you can ask it to relinquish its resources by calling the Dispose() method,\
    \ if it implements the IDisposable interface."
