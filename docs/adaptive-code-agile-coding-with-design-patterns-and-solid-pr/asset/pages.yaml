  md: "# Name your test methods carefully\n\n> \"There are two hard things in computer\
    \ science: cache invalidation, naming things, and off-by-one errors.\"\n> \n>\
    \ Unknown\n\nA colleague of mine is a great advocate of intentional bad variable\
    \ names. If the purpose of a class, method, or variable is unclear, he names it\
    \ Fred. It’s important to note that he never commits his code until all rogue\
    \ Freds have been removed, but some Freds can live an hour until they are renamed.\
    \ The point is, naming is quite a bit more difficult than it seems.\n\nAs you\
    \ will learn later in this chapter, in the \"The testing quadrant\" section, unit\
    \ tests are for the development team, not the business. Therefore, the names of\
    \ unit tests need not be readable by business analysts or product owners, unlike\
    \ wider-scoped acceptance tests. However, Status_code_500_should_throw_invalid_operation_exception\
    \ is not a good name—on multiple levels.\n\nFirst, the test leaks too much implementation\
    \ knowledge, which does not aid the reader. Instead, the intent of the test should\
    \ be the focus of the name. Communicate the intent of the test, not the implementation.\n\
    \n```\nAccount_service_failure_is_propagated_to_client\n```\n\nIt doesn’t rely\
    \ on the implementation of the test, and it grounds itself in the context of the\
    \ code in question.\n\n# The Builder pattern for tests\n\nThere are two types\
    \ of verboseness in the writing of code: that which complicates and that which\
    \ clarifies. The former is apparent when a method deals directly with details\
    \ at too low of a level. The latter is a result of descriptive variable and method\
    \ naming, using the tools at your disposal to clearly state intent.\n\nUnit tests\
    \ are code statements much like any others. Therefore, they are subject to at\
    \ least the same rules as production code. Tests can become unwieldy for many\
    \ reasons—most commonly because the code to be tested is not particularly testable.\
    \ In this scenario, the tests circle around the problem, trying to contrive ways\
    \ and means of creating tests. But even very testable code can have tests that\
    \ lack clarity and concision."
