  md: '# About the author


    ![](img/f852e0a12c174e64d91a8e1a05146eab_447_0.png)


    GARY MCLEAN HALL lives in Manchester, England, with his wife, daughter, son, and
    dog.


    Gary is an experienced software developer and architect, specializing in patterns
    and practices. He has worked with numerous Agile teams that have maintained a
    strong focus on creating code that is adaptive to change. He has worked for companies
    such as Eidos, Xerox, Nephila Capital Ltd., and The LateRooms Group. In each role,
    he excelled at balancing the delivery of a software product and the quality of
    its source code.


    Gary is the founder of Igirisu Ltd, a software consultancy, and co-founder and
    CTO of Dynamic Path Ltd.'
