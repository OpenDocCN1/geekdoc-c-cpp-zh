- pgno: 170
  md: "One of the limitations of Re-mix is that you do not—and cannot—know the exact\
    \ type of the instance returned by ObjectFactory.Create. All you know is that\
    \ it is an instance of a subclass TargetImplementation. This is sort of bad news\
    \ for clients, because the only interface you can guarantee that TargetImplementation\
    \ fulfills at compile time is ITargetInterface. Clients of the mixin, therefore,\
    \ must type-sniff by using is and as to cast the mixin to the desired interface.\
    \ Listing 4-33 highlights this problem.\n\n# LISTING 4-33 Type-sniffing is bad\
    \ practice but necessary for using mixins.\n\n```\npublic class MixinClient\n\
    {\n    public MixinClient(ITargetInterface target)\n    {\n        this.target\
    \ = target;\n    }\n\n    public void Run()\n    {\n        target.DoSomething();\n\
    \n        var targetAsMixinA = target as IMixinInterfaceA;\n        if(targetAsMixinA\
    \ != null)\n        {\n            targetAsMixinA.MethodA();\n        }\n\n  \
    \      var targetAsMixinB = target as IMixinInterfaceB;\n        if(targetAsMixinB\
    \ != null)\n        {\n            targetAsMixinB.MethodB(30);\n        }\n\n\
    \        var targetAsMixinC = target as IMixinInterfaceC;\n        if(targetAsMixinC\
    \ != null)\n        {\n            targetAsMixinC.MethodC(\"Hello!\");\n     \
    \   }\n    }\n\n    private readonly ITargetInterface target;\n}\n```\n\nApplying\
    \ mixins to a solution works best when type-sniffing is already present or necessary.\
    \ This is true with some libraries and frameworks. For example, Prism (the Windows\
    \ Presentation Foundation/Model-View-Viewmodel library) makes use of type-sniffing,\
    \ and the functionality required of client classes can be segregated into different\
    \ implementations and recombined via mixins."
