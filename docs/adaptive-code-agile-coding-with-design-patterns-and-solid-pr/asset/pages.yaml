- pgno: 425
  md: '# APPENDIX


    # Adaptive tools


    This appendix gives you an introduction to source control with Git, which is required
    to use the code samples for this book. If you have used Git before, you’re already
    aware of its deserved reputation as the foremost source control software. If you
    have not encountered Git before, this appendix will bring you up to a level at
    which you can interact with local and remote repositories of code. These skills
    will translate to working with any codebase that is stored in Git; the content
    herein is not limited to the code samples for this book. Many popular open-source
    projects use Git, and it is being adopted by companies to manage their proprietary
    code, too.


    In all contexts, the concept of continuous integration (CI) is an important part
    of keeping code synchronized between various contributors, so a section of this
    appendix briefly discusses the concept of CI and introduces a common workflow
    for its implementation.


    # Source control with Git


    Source control evolved slowly for a long time before being revolutionized with
    the advent of distributed source control systems such as Mercurial and Git. I
    would argue that any source control is better than no source control, but my preference
    is certainly for Git.


    The purpose of source control in general is to track changes in code over time,
    making it easy to travel forward and backward in time through the code. It also
    provides a ready-made backup of the source.


    With Git, every developer has their own repository that contains the full source
    code (see Figure A-1). To make edits to the source, developers should create local
    branches to which they can commit successive changes. Each branch should have
    a clearly delineated purpose—to fix a defect, implement a new feature, or make
    some experimental changes. Whatever their purpose, these changes remain local
    to the developer’s repository until the developer elects to push the branch elsewhere.'
  merge: -1
  img_proc: true
