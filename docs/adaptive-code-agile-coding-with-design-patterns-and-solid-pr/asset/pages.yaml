- pgno: 95
  md: '# Dependencies and layering


    # After completing this chapter, you will be able to


    +   - Manage complex dependencies from method level to system level.

    +   - Identify areas where dependency complexity is greatest and use tools to
    reduce complexity.

    +   - Decompose your code into smaller, more adaptive pieces of functionality
    that promote reuse.

    +   - Apply layering patterns where they are most useful.

    +   - Understand how dependencies are resolved and debug dependency problems.

    +   - Hide implementations behind simple interfaces.


    All software has dependencies. Each dependency is either a first-party dependency
    within the same code base, a third-party dependency on an external assembly, or
    a dependency on the Microsoft .NET Framework. Except for trivial solutions, all
    solutions make use of all three types of dependency.


    A dependency abstracts functionality away from calling code. You don’t need to
    worry too much about what a dependency is doing, much less how it is doing it,
    but you should ensure that all dependencies are correctly managed. When a dependency
    chain is poorly managed, developers force dependencies that need not exist. This
    tangles the code into knots with complex assembly references. You might have heard
    the adage that "the most correct code is that which is not written." Similarly,
    the best-managed dependency is that which does not exist.


    To keep your code adaptive to change, you must manage your dependencies. This
    applies at all levels of the software—from architectural dependencies between
    subsystems to implementation dependencies between individual methods. A poorly
    architected application can slow down the delivery of working software, even halt
    it entirely in the worst case.


    Not enough emphasis can be placed on how important it is to take a purist approach
    to dependency management. If you compromise on such an important issue, you might
    notice a temporary increase in velocity, but the long-term effects are potentially
    fatal to the project. It is an all-too familiar story: The short-lived productivity
    boost disappears as the amount of code and number of modules increases. The code
    becomes rigid and fragile, and progress slows to a crawl. In terms of Scrum artifacts
    and metrics, the sprint burndown chart flatlines because no story points are claimed.
    With Kanban, the cumulative flow diagram diverges and work is stuck in the Implementation
    column. For as long as the problem is unaddressed, the feature burnup chart follows
    suit because no features are completed. Even the bug count increases. When the
    dependency structure is incomprehensible, a'
