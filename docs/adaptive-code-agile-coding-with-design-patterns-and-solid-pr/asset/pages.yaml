  md: "```\nusing (var reader = command.ExecuteReader(CommandBehavior.CloseConnection))\n\
    {\n    while (reader.Read())\n    {\n        allTasks.Add(\n            new TaskDto\n\
    \            {\n                ID = reader.GetInt32(IDIndex),\n             \
    \   Description = reader.GetString(DescriptionIndex),\n                Priority\
    \ = reader.GetString(PriorityIndex),\n                DueDate = reader.GetDateTime(DueDateIndex),\n\
    \                Completed = reader.GetBoolean(CompletedIndex)\n            });\n\
    \    }\n}\n\nreturn allTasks;\n}\n```\n\nThe first change is made to the entry\
    \ point, where an injection factory is used for constructing the service. This\
    \ is a lambda expression that has access to the container for resolving parameters\
    \ and returns a new instance of the service. The call to the ISettings service's\
    \ GetSettings method has been moved to this injection factory to retrieve the\
    \ connection string. This is passed to the SqlConnection constructor which, in\
    \ turn, is passed to the service.\n\nIn the GetAllTasks() method, the presence\
    \ of the using(connection) is problematic. This ensures that SqlConnection.Dispose()\
    \ is called at the end of the using scope. After this call, the connection can\
    \ no longer be used, yet you could feasibly call this method again.\n\nInstead,\
    \ what if the TaskServiceAdo implemented IDisposable and delegated its Dispose\
    \ method to that of the connection? This is explored in Listing 12-14.\n\n# LISTING\
    \ 12-14 The service implements IDisposable so that it can dispose of the connection.\n\
    \n```\npublic class TaskServiceAdo : ITaskService, IDisposable\n{\n    public\
    \ TaskServiceAdo(IDbConnection connection)\n    {\n        this.connection = connection;\n\
    \    }\n\n    public IEnumerable<TaskDto> GetAllTasks()\n```"
