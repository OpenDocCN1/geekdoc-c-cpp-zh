- pgno: 316
  md: "```\n```csharp\n{\n    var repo = new TRepository();\n    Action getByID =\
    \ () => repo.GetByID(Guid.Empty);\n\n    getByID.ShouldThrow<EntityNotFoundException>();\n\
    }\n```\n```\n\nThis unit test fails because the UserRepository does not, as required,\
    \ throw an EntityNotFoundException. If the UserNotFoundException was a subclass\
    \ of the type EntityNotFoundException, this test would pass and a single catch\
    \ block could guarantee catching both kinds of exception.\n\nThis becomes a problem\
    \ of client maintenance. If the client is using an interface as a dependency and\
    \ calling methods on that interface, it should not know anything about the classes\
    \ behind that interface. If new exceptions that are not part of an expected exception\
    \ class hierarchy are introduced, clients must start referencing these exceptions\
    \ directly. And—even worse—clients must be updated whenever a new exception type\
    \ is introduced.\n\nInstead, it is important that interfaces have a unifying base\
    \ class exception that conveys the necessary information about an error from the\
    \ exception reporter to the exception handler.\n\n# Conclusion\n\nOn the surface,\
    \ the Liskov substitution principle is one of the more complex facets of the SOLID\
    \ principles. It requires a foundational knowledge of both contracts and variance\
    \ to build rules that guide you toward more adaptive code.\n\nBy default, interfaces\
    \ do not convey rules for preconditions or postconditions to clients. Creating\
    \ guard clauses that halt the application at run time further narrows the allowed\
    \ range of valid values for parameters. The LSP provides guidelines specifying\
    \ that each subclass in a class hierarchy must not strengthen preconditions or\
    \ weaken postconditions.\n\nSimilarly, the LSP suggests rules for variance in\
    \ subtypes. There should be contravariance of method arguments in subtypes and\
    \ covariance of return values in subtypes. Additionally, any new exception that\
    \ is introduced, perhaps with the creation of a new interface implementation,\
    \ should inherit from an existing base exception. To do otherwise would be to\
    \ cause an existing client to miss the catch—to fumble the exception and cause\
    \ an application crash.\n\nIf the LSP is violated with respect to these rules,\
    \ it becomes harder for clients to treat all types in a class hierarchy the same.\
    \ Ideally, clients would be able to hold a reference to a base type or interface\
    \ and not alter its own behavior depending on the concrete subclass that it is\
    \ using at run time. Such mixed concerns create dependencies between sections\
    \ of the code that are better kept separate. Any violation of the LSP should be\
    \ considered technical debt, and as demonstrated in prior chapters, this debt\
    \ should be paid off sooner rather than later."
