- pgno: 229
  md: "As shown in Listing 6-16, the Account class is no longer abstract and therefore\
    \ no longer requires the Base suffix. For construction, it accepts an IRewardCard\
    \ instance and delegates to this when adding a transaction. Overall, this account\
    \ looks more like it used to before the initial requirement for capturing reward\
    \ points.\n\n# LISTING 6-16 Each account contains a reward card.\n\n```\npublic\
    \ class Account\n{\n    public Account(IRewardCard rewardCard)\n    {\n      \
    \  this.rewardCard = rewardCard;\n    }\n\n    public decimal Balance\n    {\n\
    \        get;\n        private set;\n    }\n\n    public void AddTransaction(decimal\
    \ amount)\n    {\n        rewardCard.CalculateRewardPoints(amount, Balance);\n\
    \        Balance += amount;\n    }\n\n    private readonly IRewardCard rewardCard;\n\
    }\n```\n\nTo model a Standard account—an account without a reward card—you can\
    \ either pass in null for the reward card constructor dependency (and protect\
    \ against a NullReferenceException by testing for null before delegating) or you\
    \ can model a NullRewardCard. The latter would be an implementation of the Null\
    \ Object pattern that would not accumulate any reward points when CalculateRewardPoints\
    \ was called.\n\n# Aggressive refactoring\n\nCode is never done. Code can be working,\
    \ good enough, sufficient, valuable, and producing revenue. But it is rarely,\
    \ if ever, complete. Often, code is found in a certain state, but it is only a\
    \ snapshot of a transitioning form. Code is always on a journey from where it\
    \ is now to some unknown place in the future. When code is considered finished,\
    \ there is the temptation to label it pejoratively. It becomes \"stupid,\" \"\
    unreadable\"—a figure of ridicule. Worse still, you might start to consider its\
    \ authors as stupid or bad coders, or even malevolent forces, spitefully making\
    \ your life a waking nightmare.\n\nIf you instead consider code as perpetually\
    \ unfinished, you are better able to break the inertia to change. No code is ever\
    \ sacred. Code can be underdeveloped and in need of some engineering discipline,\
    \ or overwrought and in need of simplification. Different parts of the code might\
    \ exhibit"
