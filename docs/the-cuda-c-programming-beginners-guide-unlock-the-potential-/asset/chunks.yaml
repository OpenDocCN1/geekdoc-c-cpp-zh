- fmt: "\n```\nnvprof --analysis-metrics ./my_cuda_program\n```\n\n# Optimizing Using\
    \ Profiling Results\n\nOnce you have identified performance bottlenecks, you can\
    \ use a variety of optimization techniques:\n\n- **Kernel Optimization**: Prioritize\
    \ optimizing the most time-consuming kernels. Loop unrolling, eliminating divergent\
    \ branches, and leveraging shared memory are among the techniques used.\n- **Memory\
    \ Access Patterns**: Coordinate memory accesses and optimize data transfers between\
    \ the host and device.\n- **Occupancy Optimization**: Change the grid and block\
    \ size to optimize SM occupancy while minimizing idle cycles.\n- To disguise delay,\
    \ use asynchronous memory transfers and overlapping processing with data transfers.\n\
    \n## An Example of Optimization\n\nAssume `nvprof` shows that `my_kernel` is the\
    \ primary bottleneck owing to memory access inefficiencies. You may optimize it\
    \ by utilizing shared memory.\n\n### Before optimization:\n\n```cpp__global__\
    \ void my_kernel(float *data, int n) {\n    int tid = blockIdx.x * blockDim.x\
    \ + threadIdx.x;\n    if (tid < n) {\n        data[tid] = data[tid] * 2.0f;\n\
    \    }\n}\n```\n\n### After optimization:\n\n```cpp__global__ void my_kernel(float\
    \ *data, int n) {\n    __shared__ float sharedData[256];\n    int tid = blockIdx.x\
    \ * blockDim.x + threadIdx.x;\n    int local_tid = threadIdx.x;\n    if (tid <\
    \ n) {\n        sharedData[local_tid] = data[tid];\n        __syncthreads();\n\
    \        sharedData[local_tid] *= 2.0f;\n        __syncthreads();\n        data[tid]\
    \ = sharedData[local_tid];\n    }\n}\n```\n\nUsing shared memory reduces global\
