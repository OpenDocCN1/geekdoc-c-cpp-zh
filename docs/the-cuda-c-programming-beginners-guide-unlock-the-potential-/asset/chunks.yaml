  raw: 'Installing the CUDA Toolkit and customizing your IDE are necessary steps in
    preparing your environment for CUDA C++ development. Once your environment is
    set up, you may begin building CUDA applications. In the next chapter, we will
    look at the principles of CUDA architecture and its role in allowing parallel
    computing.


    ![](image_rsrc2HZ.jpg)


    Chapter 2


    ![](image_rsrc2HY.jpg)


    Understanding the Basics


    To fully utilize the power of CUDA C++, it is critical to grasp the underlying
    architecture that enables it all. This chapter looks into the principles of the
    CUDA architecture, concentrating on the components that allow for the outstanding
    parallel processing capabilities.


    ### CUDA Architecture


    Overview of the CUDA Architecture


    The architecture of CUDA is at the heart of its power, as it was built to efficiently
    handle massively parallel calculations. The CUDA architecture is based on a scalable
    array of multithreaded Streaming Multiprocessors (SM). When you develop and run
    a CUDA program, you are effectively asking the GPU to do a large number of little
    jobs (threads) in parallel.


    The CUDA programming model simplifies parallel programming by abstracting hardware
    specifics, enabling you to concentrate on parallelizing your code. This abstraction
    is done by using kernels, which are GPU-based functions. These kernels are launched
    by the host (CPU) and run on the device (GPU).


    Here is a high-level overview of the CUDA architecture:


    Host (CPU): The central processor responsible for managing and scheduling kernel
    execution on the GPU.


    Device (GPU): The graphics processor that executes the kernels.


    Global Memory: Large yet sluggish memory available to all threads.


    Shared Memory: Faster and smaller memory shared by threads in the same block.


    Registers: Fast memory allocated to each thread.


    Streaming Multiprocessors (SMs)


    Streaming Multiprocessors (SMs) are the GPU''s fundamental computing units. Each
    SM comprises a number of CUDA cores, which are the actual execution units that
    operate the threads.


    An SM is equipped with the resources listed below:


    CUDA Cores: These are the fundamental execution units capable of carrying out
    arithmetic and logic operations. Each SM contains many CUDA cores.


    Warp Scheduler: Each SM has a warp scheduler that controls the execution of warps.
    A warp is a collection of 32 threads that all execute the same instruction.


    Instruction Cache: Stores the instructions that the SM will execute.


    Registration: Each SM has a collection of registers, the fastest form of memory
    available to threads.


    Shared Memory: Memory shared by all threads in a block, enabling efficient communication
    and data sharing.


    When a kernel is launched, thread blocks are distributed across available SMs.
    Depending on available resources, each SM can execute many blocks at the same
    time.


    Thread blocks and grids


    CUDA divides threads into grids and blocks, allowing for flexible and scalable
    parallelism.


    Thread Blocks: A thread block is a collection of threads that may work together
    via shared memory and coordinate their execution. Within the grid, each block
    is assigned a unique ID. Blocks are separated into warps and executed.


    Grids: A grid is a group of thread blocks that all use the same kernel. Each grid
    has a unique identifier. Grids can be one, two, or three-dimensional, giving you
    more freedom in how you arrange parallel calculations.


    Here''s how the hierarchy works:


    1\. Kernel Launch: When you launch a kernel, you define how many blocks there
    are in the grid and how many threads each block has. For example, ''kernel<<<numBlocks,
    numThreads>>>(args)'' starts the kernel with ''numBlocks'' blocks, each with ''numThreads''
    threads.


    2\. Block Execution: The blocks are distributed to the SMs for execution. Each
    block is performed individually, enabling scalable parallelism. Threads inside
    a block can interact and synchronize via shared memory and barrier synchronization.


    3\. Thread execution: Warps are formed by grouping threads within each block.
    Each warp performs the same command at the same time, which is required for optimal
    GPU efficiency.


    Let''s look at a real example to see this in action:


    __global__ void add(int a, int b, int c, int n) {


    int index = threadIdx.x + blockIdx.x  blockDim.x;


    if (index < n) { c[index] = a[index] + b[index];


    }


    }


    int main() {


    int n = 1024;


    int size = n * sizeof(int).


    // Memory allocation on the host


    int *h_a = (int *)malloc(size);


    int *h_b = (int *)malloc(size);


    int *h_c = (int *)malloc(size);


    //To initialize input arrays, use the


    for loop (int i = 0; i < n; i++){


    h_a[i] = i;


    h_b[i] = i * 2;


    }


    //To allocate memory on the device:


    int *d_a, *d_b, *d_c;


    cudaMalloc(&d_a, size);


    cudaMalloc(&d_b, size);


    cudaMalloc(&d_c, size);


    //To copy data from the host to the device, use


    cudaMemcpy(d_a, h_a, size, cudaMemcpyHostToDevice);


    cudaMemcpy(d_b, h_b, size, cudaMemcpyHostToDevice);


    // Launch the kernel with n threads.


    int blockSize = 256;


    int numBlocks = (n + blockSize - 1) / blockSize;


    add<<<numBlocks, blockSize>>>(d_a, d_b, d_c, n);


    //Copy the output back to the host using


    cudaMemcpy(h_c, d_c, size, cudaMemcpyDeviceToHost);


    // Validate the results


    for (int i = 0; i < n; i++){


    if (h_c[i] != h_a[i] + h_b[i]) {


    printf("Error at index%d\n", i);


    return -1;


    }


    }


    // Free device memory.


    CudaFree(d_a);


    CudaFree(d_b);


    CudaFree(d_c).


    // Free the host memory.


    free(h_a);


    free(h_b);


    free(h_c).


    printf("All items are correct!\n");


    return 0;


    }


    In this example, we create a basic kernel that adds two vectors. The kernel is
    launched with a grid of thread blocks, each containing a specific number of threads.
    The ''blockSize'' parameter defines the number of threads per block, while ''numBlocks''
    specifies the total number of blocks in the grid.


    threadIdx.x: The thread index in the block.


    blockIdx.x: Block index in the grid.


    blockDim.x: The quantity of threads per block.


    Using these built-in variables, each thread may identify its own unique index
    inside the grid, allowing it to process a specific vector.


    Understanding the fundamentals of CUDA architecture is required to write efficient
    CUDA applications. The Streaming Multiprocessors control the hierarchical structuring
    of threads into blocks and grids, allowing GPUs to achieve the tremendous parallelism
    that gives them their strength. With this foundation, you are ready to investigate
    more complex principles and optimizations in CUDA programming. In the following
    page, we''ll go deeper into memory management and how to properly use the various
    forms of memory in CUDA.


    ### CUDA Memory Model


    Understanding CUDA''s memory mechanism is critical for fully realizing its potential.
    CUDA has numerous forms of memory, each with unique properties, scope, and performance
    consequences. Writing high-performance CUDA programs requires efficient use of
    many types of memory.


    Global, Shared, Local, and Constant Memory


    Global memory:


    Global memory is the biggest memory space on the GPU, and it may be accessed by
    any thread in the grid. It is, however, slower than other forms of memory due
    to its high latency. Global memory is often used to store data that must be accessed
    by different threads.


    Scope: Accessible to all threads.


    Lifetime: Persisted across kernel starts.


    Performance: Slow, but can be improved with coalesced access patterns.


    Shared memory:


    Shared memory is fast on-chip memory that is shared by threads inside the same
    block. It enables efficient data interchange and synchronization across threads
    in a block. Because of its low latency, it is much quicker than global memory.


    Scope: Accessible to all threads within a block.


    Lifetime: Valid for the length of the block''s execution.


    Performance: Extremely fast, comparable to a cache. Efficient utilization of shared
    memory can lead to considerable speed improvements.


