    CUDA Libraries and Tools


    CUDA libraries and tools provide critical functionality that simplifies and accelerates
    the creation of high-performance GPU applications. This chapter presents major
    CUDA libraries and shows how to use them in your applications through practical
    examples.


    ### Introduction to CUDA Libraries


    CUDA libraries provide pre-optimized routines for common computational tasks,
    allowing developers to use GPU acceleration without writing low-level CUDA code.


    cuBLAS: Basic Linear Algebra Subprograms


    cuBLAS is NVIDIA''s GPU-accelerated library for fundamental linear algebra functions.
    It offers highly optimized implementations of standard BLAS (Basic Linear Algebra
    Subprogram) routines.


    Key Features:


    Vector and matrix operations (e.g., dot products, matrix-matrix multiplication)


    Support for single and double precision


    Batch operations for processing several tiny matrices at once


    An Example Use Case:


    Matrix multiplication is widely used in scientific computing and machine learning.
    This procedure can be effectively performed on the GPU with cuBLAS.


    Fast Fourier Transform (cuFFT)


    cuFFT is a GPU-accelerated package that computes fast Fourier transforms (FFT).
    It accepts both complex and real data types and can perform one-dimensional, two-dimensional,
    and three-dimensional transformations.


    Key features:


    Features include high performance for large-scale FFT computations, support for
    multi-GPU systems, and seamless interaction with CUDA applications.


    An Example Use Case:


    FFTs are commonly employed in signal processing, image analysis, and solving partial
    differential equations. Utilizing cuFFT, you may speed these computations utilizing
    the GPU.


    cuDNN: Deep Neural Network Library


    cuDNN is a GPU-accelerated deep learning package. It offers improved versions
    of typical neural network operations including convolution, pooling, normalization,
    and activation functions.


    Key features:


    Supports forward and backward propagation


    Optimized for training and inference


    Compatible with major deep learning frameworks, such as (TensorFlow and PyTorch)


    Example Use Case: cuDNN is vital for constructing high-performance deep learning
    applications and efficiently training massive neural networks.


    Thrust: Parallel Algorithms Library


    Thrust is a parallel algorithms library similar to the C++ Standard Template Library
    (STL). It defines high-level abstractions for popular parallel patterns like sorting,
    reduction, and scanning.


    Key features:


    High-level interface for GPU programming


    Compatible with CUDA.


    Templates and iterators help create flexible and reusable code.


    Example Use Case:


    Thrust simplifies parallel programming by offering a succinct and expressive vocabulary,
    facilitating the implementation of complicated algorithms on the GPU.


    ### Applying CUDA Libraries


    Integrating CUDA libraries into your applications entails connecting the necessary
    libraries and using their functionalities in your CUDA code. Each library will
    be described in detail, including examples and use cases.


    Integrating Libraries into Your Projects


    To utilize CUDA libraries, include the required headers and link them during compilation.
    Here''s a general procedure:


    1\. Include Headers: Add the necessary headers to your source files.


    #include <cublas_v2.h>


    #include <cufft.h>


    #include <cudnn.h>


    #include <thrust/host_vector.h>


    #include <thrust/device_vector.h>


    2\. To link libraries: use the ''nvcc'' compiler.


    nvcc -o my_program my_program.cu -lcublas -lcufft -lcudnn -lthrust


    Examples and Use Cases for Every Library


    cuBLAS Example for Matrix Multiplication**


    #include <cublas_v2.h>


    #include <iostream>


    int main() {


    int N = 1024;


    float *h_A, *h_B, *h_C;


    float *d_A, *d_B, *d_C;


    // Allocate host memory


    h_A = (float *)malloc(N * N * sizeof(float));


    h_B = (float *)malloc(N * N * sizeof(float));


    h_C = (float *)malloc(N * N * sizeof(float));


    // Initialize host matrices


    for (int i = 0; i < N * N; i++) {


    h_A[i] = static_cast<float>(rand()) / RAND_MAX;


    h_B[i] = static_cast<float>(rand()) / RAND_MAX;


    }


    // Allocate device memory


    cudaMalloc((void **)&d_A, N * N * sizeof(float));


    cudaMalloc((void **)&d_B, N * N * sizeof(float));


    cudaMalloc((void **)&d_C, N * N * sizeof(float));


    // Copy host matrices to device


    cudaMemcpy(d_A, h_A, N * N * sizeof(float), cudaMemcpyHostToDevice);


    cudaMemcpy(d_B, h_B, N * N * sizeof(float), cudaMemcpyHostToDevice);


    // Create cuBLAS handle


    cublasHandle_t handle;


    cublasCreate(&handle);


    // Perform matrix multiplication: C = A * B


    float alpha = 1.0f;


    float beta = 0.0f;


    cublasSgemm(handle, CUBLAS_OP_N, CUBLAS_OP_N, N, N, N, &alpha, d_A, N, d_B, N,
    &beta, d_C, N);


    // Copy result back to host


    cudaMemcpy(h_C, d_C, N * N * sizeof(float), cudaMemcpyDeviceToHost);


    // Clean up


    cudaFree(d_A);


    cudaFree(d_B);


    cudaFree(d_C);


    free(h_A);


    free(h_B);


    free(h_C);


    cublasDestroy(handle);


    std::cout << "Matrix multiplication completed successfully." << std::endl;


    return 0;


    }


    cuFFT Example: Fast Fourier Transform


    #include <cufft.h>


    #include <iostream>


    int main() {


    int N = 1024;


    cufftComplex *h_data, *d_data;


    // Allocate host memory


    h_data = (cufftComplex *)malloc(N * sizeof(cufftComplex));


    // Initialize host data


    for (int i = 0; i < N; i++) {


    h_data[i].x = static_cast<float>(rand()) / RAND_MAX;


    h_data[i].y = 0.0f;


    }


    // Allocate device memory


    cudaMalloc((void **)&d_data, N * sizeof(cufftComplex));


    // Copy host data to device


    cudaMemcpy(d_data, h_data, N * sizeof(cufftComplex), cudaMemcpyHostToDevice);


    // Create cuFFT plan


    cufftHandle plan;


    cufftPlan1d(&plan, N, CUFFT_C2C, 1);


    // Execute FFT


    cufftExecC2C(plan, d_data, d_data, CUFFT_FORWARD);


    // Copy result back to host


    cudaMemcpy(h_data, d_data, N * sizeof(cufftComplex), cudaMemcpyDeviceToHost);


    // Clean up


    cudaFree(d_data);


    free(h_data);


    cufftDestroy(plan);


    std::cout << "FFT computation completed successfully." << std::endl;


    return 0;


    }


