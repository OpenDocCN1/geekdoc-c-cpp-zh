- fmt: 'Warp divergence is a typical performance problem in CUDA programming. It happens
    when threads in the same warp choose distinct execution pathways, leading some
    to stay dormant while others execute.


    ## Causes and Impacts of Warp Divergence


    A warp is a collection of 32 threads that execute instructions in lockstep. If
    threads within a warp diverge as a result of a conditional branch (for example,
    an `if` statement), the warp must serialize the execution of each diverging path.
    This serialization lowers the efficiency of parallel processing.


    ## An Example of Warp Divergence


    ```cpp

    __global__ void compute(int *data, int n) {


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n) {


    if (tid % 2 == 0) {


    data[tid] *= 2;


    } else {


    data[tid] += 1;


    }


    }


    }

    ```


    In this case, the `if` statement generates divergence inside the warp since threads
    follow various execution pathways depending on `tid`.


    ## Strategies for Minimizing Divergence


    - **Avoid Divergent Branches**: Limit your use of divergent branches within warps.
    When feasible, design your code to prevent conditional expressions that create
    divergence.

    - **Use Predication**: CUDA may turn conditional branches into predicated instructions,
    in which each thread assesses the condition and performs instructions depending
    on the predicate. This prevents divergence, although it may result in more instructions
    being executed.

    - **Reorganize Data**: Reorganize data so that threads within a warp take the
    same execution route. For example, process all even-indexed elements in one kernel
    and all odd-indexed ones in the other.


    ### Example:


    ```cpp

    __global__ void computeEven(int *data, int n) {


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n && tid % 2 == 0) {


    data[tid] *= 2;


    }


    }


    __global__ void computeOdd(int *data, int n) {


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n && tid % 2 != 0) {


    data[tid] += 1;


    }


    }

    ```


    ## Using Shared Memory


    Shared memory is a fast, on-chip memory that enables threads inside a block to
    efficiently share data. The appropriate usage of shared memory may considerably
    increase the speed of CUDA applications.


    ### Declaring and Accessing Shared Memory


    The `__shared__` keyword is used in kernels to define shared memory. Each thread
    in the block can access shared memory, resulting in low-latency data access.


    ### Example:


    ```cpp

    __global__ void sharedMemoryExample(int *data, int n) {


    __shared__ int sharedData[256];


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n) {


    // Load data into shared memory


    sharedData[threadIdx.x] = data[tid];


    __syncthreads(); // Ensure all threads have loaded their data


    // Perform computation using shared memory


    data[tid] = sharedData[threadIdx.x] * 2;


    }


    }

    ```


    ### Optimizing Memory Access Patterns


    To get the full benefits of shared memory, ensure that memory access patterns
    are efficient. Shared memory can help minimize the number of global memory accesses.


    - **Load Data Efficiently**: Load data into shared memory in a coordinated way
    for efficient global memory access.

    - **Reuse Data**: Use shared memory to store data that will be reused repeatedly
    by threads within the block.


    ### Avoiding Bank Conflicts


    Shared memory is separated into banks, and many threads accessing the same bank
    at the same time might result in bank conflicts, which reduce performance.


    **Avoiding bank conflicts:**

    - **Padding**: Use padding in shared memory arrays to guarantee that threads access
    distinct banks.


    ### Example:


    ```cpp

    __global__ void avoidBankConflicts(int *data, int n) {


    __shared__ int sharedData[256 + 1]; // Add padding


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n) {


    sharedData[threadIdx.x] = data[tid];


    __syncthreads();


    data[tid] = sharedData[threadIdx.x] * 2;


    }


    }

    ```


    - **Access Patterns**: Ensure that threads access shared memory in ways that prevent
    conflicts. For example, use separate threads to access the same items consecutively.


    ## Improving Memory Access


    Efficient memory access is critical in high-performance CUDA applications. This
    includes optimizing global memory access, guaranteeing memory alignment, and making
    optimum use of registers and caches.


    ### Coordinated Memory Access


    When many threads visit the same memory address, this is referred to as coalesced
    memory access. This enables the memory controller to consolidate several memory
    accesses into a single transaction, resulting in better bandwidth efficiency.


    ### An Example of Coalesced Access


    ```cpp

    __global__ void coalescedAccess(int *data, int n) {


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    if (tid < n) {


    data[tid] *= 2;


    }


    }

    ```


    ### Memory Alignment and Padding


    Aligned memory accesses are quicker because they need fewer memory transfers.
    Ensure that memory allocations are aligned to the normal cache line size of 256
    bytes each.


    ### Example:


    ```cpp

    cudaMalloc((void **)&d_data, size);


    cudaMemset(d_data, 0, size);

    ```


    Adding padding to data structures can also aid memory alignment.


    ### Example:


    ```cpp

    struct PaddedStruct {


    int data;


    int padding[15]; // Add padding to align to 256 bytes


    };

    ```


    ### Effective use of registers and caches


    Registers are the quickest kind of memory accessible on the GPU. Use registers
    for variables that are often accessed. However, be wary of register pressure,
    as high register consumption might reduce the number of active threads per block.


    ### Example:


    ```cpp

    __global__ void useRegisters(int *data, int n) {


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    int value = data[tid]; // Load value into register


    if (tid < n) {


    data[tid] = value * 2; // Use register for computation


    }


    }

    ```


    Caches (`L1` and `L2`) can help boost speed by lowering the latency of global
    memory access. Modern GPUs naturally cache global memory accesses, thus creating
    algorithms that take use of caching can boost speed.


    Optimizing CUDA applications demands a thorough grasp of GPU architecture and
    careful resource management. You may dramatically improve the speed of your CUDA
    applications by limiting warp divergence, utilizing shared memory effectively,
    and optimizing memory access patterns. These optimization approaches are critical
    for creating high-performance parallel applications and realizing the full potential
    of CUDA.


