- fmt: "\nTo get started with CUDA C++, you must first set up your development environment\
    \ properly. This chapter will walk you through the process of installing the CUDA\
    \ Toolkit and setting your Integrated Development Environment (IDE) so you can\
    \ start programming.\n\n# Installing CUDA Toolkit\n\n## System Requirements\n\n\
    Before beginning the installation procedure, make sure that your your system fulfills\
    \ the required specifications. The CUDA Toolkit is designed to function on a number\
    \ of systems, however there are certain unique needs you must consider:\n\n- **Operating\
    \ System**: The CUDA Toolkit supports a variety of operating systems, including\
    \ Windows, Linux, and macOS. Ensure that you have a suitable operating system\
    \ installed.\n- **GPU**: You'll need an NVIDIA GPU with CUDA Compute Capability\
    \ 3.0 or above. You can verify your GPU compatibility on NVIDIA's website.\n-\
    \ **Driver**: The NVIDIA driver must be installed and updated. The required drivers\
    \ are frequently included with the CUDA Toolkit installation, although it is recommended\
    \ that you use the most recent version.\n- **RAM**: A minimum of 2GB of RAM is\
    \ suggested, but more is preferable, especially if you want to deal with huge\
    \ datasets or do sophisticated calculations.\n- **Disk Space**: Make sure you\
    \ have at least 5 GB of free disk space for the CUDA Toolkit and its components.\n\
    \n## Downloading and installing the CUDA Toolkit\n\nTo get started, download the\
    \ CUDA Toolkit from NVIDIA's official website. Here's a step-by-step instruction\
    \ for obtaining and installing the CUDA Toolkit.\n\n1. **Visit the NVIDIA CUDA\
    \ Zone**: by going to the NVIDIA CUDA Toolkit download page [`https://developer.nvidia.com/cuda-toolkit`](https://developer.nvidia.com/cuda-toolkit)`.\n\
    2. **Select Your Operating System**: Select an operating system from the list\
    \ of available options.\n3. **Select the version**: Choose the version of the\
    \ CUDA Toolkit you wish to install. It's usually a good idea to obtain the most\
    \ recent stable release.\n4. **Download the installer**: Click the download link\
    \ to save the installation package to your computer.\n\n### For Windows\n\n- **Run\
    \ the Installer**: To begin the installation, double-click the downloaded installer\
    \ file.\n- **Follow the Prompts**: The installer will walk you through the installation\
    \ steps. You will be requested to install many components, including the CUDA\
    \ Toolkit, CUDA Samples, and NVIDIA drivers.\n- **Complete Installation**: After\
    \ the installation is completed, you may need to restart your computer to finish\
    \ the configuration.\n\n### For Linux\n\n- **Run the Installer**: Launch a terminal\
    \ window and browse to the location where the installer was downloaded.\n- **To\
    \ make the installer executable**, run `chmod +x <installer_filename>`.\n- **Launch\
    \ the installer by running** `sudo ./<installer_filename>`.\n- **Follow the Prompts**:\
    \ Follow the on-screen prompts to finish the installation.\n\n### For macOS\n\n\
    - **To run the installer**, double-click the downloaded `.dmg` file.\n- **Open\
    \ the Package**: Double-click the installer package within the mounted disk to\
    \ start the installation procedure.\n- **Follow the Prompts**: Install the CUDA\
    \ Toolkit and its related components by following the on-screen directions.\n\n\
    ## Verifying the Installation\n\nOnce the CUDA Toolkit has been installed, it\
    \ is critical to ensure that it was successful. Here's how you can accomplish\
    \ it:\n\n1. **Open a Command Prompt or Terminal**:\n   - On Windows, launch the\
    \ Command Prompt.\n   - On Linux or macOS, launch a terminal window.\n2. **To\
    \ check the CUDA version**:\n   - Run the command `nvcc --version`. This command\
    \ should show the version of the CUDA Toolkit installed on your machine.\n   -\
    \ Additionally, you may use `nvidia-smi` to verify the condition of your GPU and\
    \ confirm that it is appropriately recognized by the OS.\n3. **Compile and Run\
    \ a Sample Program**:\n   - The CUDA Toolkit includes various sample applications.\
    \ Navigate to the samples directory, which is normally found in `C:\\ProgramData\\\
    NVIDIA Corporation\\CUDA Samples` on Windows or `/usr/local/cuda/samples` on Linux\
    \ and macOS.\n   - Compile and test a sample program, such as the vector addition\
    \ example, to confirm that everything works properly.\n\n# Configure Your IDE\n\
    \nAfter installing the CUDA Toolkit, the next step is to set up your Integrated\
    \ Development Environment (IDE). This configuration will change based on your\
    \ operating system and desired IDE.\n\n## NVIDIA Nsight Visual Studio Edition\
    \ for Windows\n\nNVIDIA Nsight Visual Studio Edition is a robust IDE addon that\
    \ works smoothly with Microsoft Visual Studio, offering a full set of debugging\
    \ and profiling capabilities for CUDA programming.\n\n1. **Install Visual Studio**:\n\
    \   - If Visual Studio is not already installed, you may download and install\
    \ it from the Microsoft Visual Studio website [`https://visualstudio.microsoft.com/`](https://visualstudio.microsoft.com/).\
    \ Make sure to add the Desktop development with C++ workload during installation.\n\
    2. **Install Nsight Visual Studio Edition**:\n   - During the CUDA Toolkit installation,\
    \ you should have been asked to install Nsight Visual Studio Edition. If not,\
    \ you may get it from NVIDIA's website.\n3. **To configure CUDA Toolkit**:\n \
    \  - Open Visual Studio and start a new project.\n   - In the Solution Explorer,\
    \ right-click your project and select Properties, then CUDA C/C++ settings.\n\
    \   - Make sure the CUDA Toolkit is appropriately referenced in the project settings.\n\
    \n## NVIDIA Nsight Eclipse Edition for Linux and Mac\n\nNVIDIA Nsight Eclipse\
    \ Edition is the preferred IDE for Linux and macOS users. It has comparable functionality\
    \ to the Visual Studio version, but is built built on the Eclipse IDE.\n\n1. **Install\
    \ Eclipse**:\n   - Download and install Eclipse from the Eclipse Foundation website\
    \ [`https://www.eclipse.org/`](https://www.eclipse.org/). Select the Eclipse IDE\
    \ for C and C++ Developers package.\n2. **Install the Nsight Eclipse Edition**:\n\
    \   - During the CUDA Toolkit installation, you should have been asked to install\
    \ Nsight Eclipse Edition. If not, you may get it from NVIDIA's website.\n3. **Configure\
    \ the CUDA Toolkit**:\n   - Open Eclipse and start a new CUDA C/C++ project.\n\
    \   - Go to Project Properties and choose CUDA C/C++ Settings.\n   - Make sure\
    \ the Toolkit is appropriately referenced.\n\n## Alternative Text Editors and\
    \ Tools for Linux Users\n\nIf you prefer utilizing a text editor over a full-fledged\
    \ IDE, there are various alternatives that work well with CUDA programming.\n\n\
    1. **Text Editors**:\n   - **Visual Studio Code**: A lightweight and capable code\
    \ editor with CUDA support. Install the C/C++ extension from VS Code's Marketplace.\n\
    \   - **Sublime Text**: Another popular text editor that provides good support\
    \ for C++ programming. Install the packages required for C++ syntax highlighting\
    \ and compiling.\n   - **Vim/Emacs**: For individuals who prefer command-line\
    \ editors, both Vim and Emacs may be setup for CUDA development using the necessary\
    \ plugins and build tools.\n2. **Building and Debugging**:\n   - Use `make`, `gcc`,\
    \ and `gdb` to create and debug CUDA applications from the command line.\n   -\
    \ Set up your editor to utilize the `NVCC` compiler for CUDA code and the `GCC`\
    \ or `Clang` compiler for host code.\n\n# Configure the NVCC Compiler\n\n`NVCC`\
    \ (NVIDIA CUDA Compiler) provides the foundation for CUDA development. A good\
    \ workflow requires proper configuration in your development environment.\n\n\
    ## Environment Variables\n\nMake sure the CUDA Toolkit's `bin` directory is in\
    \ your system's `PATH` environment variable. This allows the `NVCC` compiler to\
    \ be accessed via the command line.\n\n## Compiler Flags\n\nWhen compiling CUDA\
    \ code, utilize appropriate flags to specify target architecture and parameters.\
    \ For example, the command `nvcc -arch=sm_50 -o output_file source_file.cu` compiles\
    \ a CUDA file for a GPU with computing capability 5.0.\n\n## Integration with\
    \ IDE\n\nSet `NVCC` as the compiler for CUDA files in your IDE project settings.\
    \ Configure any include directories, library locations, and other flags required\
    \ for your project.\n"
  raw: 'To get started with CUDA C++, you must first set up your development environment
    properly. This chapter will walk you through the process of installing the CUDA
    Toolkit and setting your Integrated Development Environment (IDE) so you can start
    programming.


    ### Installing CUDA Toolkit


    System Requirements


    Before beginning the installation procedure, make sure that your system fulfills
    the required specifications. The CUDA Toolkit is designed to function on a number
    of systems, however there are certain unique needs you must consider:


    Operating System: The CUDA Toolkit supports a variety of operating systems, including
    Windows, Linux, and macOS. Ensure that you have a suitable operating system installed.


    GPU: You''ll need an NVIDIA GPU with CUDA Compute Capability 3.0 or above. You
    can verify your GPU compatibility on NVIDIA''s website.


    Driver: The NVIDIA driver must be installed and updated. The required drivers
    are frequently included with the CUDA Toolkit installation, although it is recommended
    that you use the most recent version.


    RAM: A minimum of 2GB of RAM is suggested, but more is preferable, especially
    if you want to deal with huge datasets or do sophisticated calculations.


    Disk Space: Make sure you have at least 5 GB of free disk space for the CUDA Toolkit
    and its components.


    ### Downloading and installing the CUDA Toolkit


    To get started, download the CUDA Toolkit from NVIDIA''s official website. Here''s
    a step-by-step instruction for obtaining and installing the CUDA Toolkit.


    1.​Visit the NVIDIA CUDA Zone: by going to the NVIDIA CUDA Toolkit download page
    [https://developer.nvidia.com/cuda-toolkit](https://developer.nvidia.com/cuda-toolkit)


    2.​Select Your Operating System: Select an operating system from the list of available
    options.


    3.​Select the version: Choose the version of the CUDA Toolkit you wish to install.
    It''s usually a good idea to obtain the most recent stable release.


    4.​Download the installer: Click the download link to save the installation package
    to your computer.


    For Windows


    *   Run the Installer: To begin the installation, double-click the downloaded
    installer file.


    *   Follow the Prompts: The installer will walk you through the installation steps.
    You will be requested to install many components, including the CUDA Toolkit,
    CUDA Samples, and NVIDIA drivers.


    *   Complete Installation: After the installation is completed, you may need to
    restart your computer to finish the configuration.


    For Linux


    *   Run the Installer: Launch a terminal window and browse to the location where
    the installer was downloaded.


    *   To make the installer executable, run ''chmod +x <installer_filename>''.


    *   Launch the installer by running  ''sudo ./<installer_filename>''


    *   Follow the Prompts: Follow the on-screen prompts to finish the installation.


    For macOS


    *   To run the installer, double-click the downloaded .dmg file.


    *   Open the Package: Double-click the installer package within the mounted disk
    to start the installation procedure.


    *   Follow the Prompts: Install the CUDA Toolkit and its related components by
    following the on-screen directions.


    Verifying the Installation


    Once the CUDA Toolkit has been installed, it is critical to ensure that it was
    successful. Here''s how you can accomplish it:


    1.​Open a Command Prompt or Terminal:


    On Windows, launch the Command Prompt.


    On Linux or macOS, launch a terminal window.


    2.​To check the CUDA version:


    Run the command ''nvcc --version''. This command should show the version of the
    CUDA Toolkit installed on your machine.


    Additionally, you may use ''nvidia-smi'' to verify the condition of your GPU and
    confirm that it is appropriately recognized by the OS.


    3.​Compile and Run a Sample Program:


    The CUDA Toolkit includes various sample applications. Navigate to the samples
    directory, which is normally found in ''C:\ProgramData\NVIDIA Corporation\CUDA
    Samples'' on Windows or ''/usr/local/cuda/samples'' on Linux and macOS.


    Compile and test a sample program, such as the vector addition example, to confirm
    that everything works properly.


    2.​Configure Your IDE


    After installing the CUDA Toolkit, the next step is to set up your Integrated
    Development Environment (IDE). This configuration will change based on your operating
    system and desired IDE.


    NVIDIA Nsight Visual Studio Edition for Windows


    NVIDIA Nsight Visual Studio Edition is a robust IDE addon that works smoothly
    with Microsoft Visual Studio, offering a full set of debugging and profiling capabilities
    for CUDA programming.


    1.​Install Visual Studio:


    If Visual Studio is not already installed, you may download and install it from
    the Microsoft Visual Studio website [https://visualstudio.microsoft.com/](https://visualstudio.microsoft.com/).
    Make sure to add the Desktop development with C++ workload during installation.


    2.​Install Nsight Visual Studio Edition:


    During the CUDA Toolkit installation, you should have been asked to install Nsight
    Visual Studio Edition. If not, you may get it from NVIDIA''s website.


    3.​To configure CUDA Toolkit:


    Open Visual Studio and start a new project.


    In the Solution Explorer, right-click your project and select Properties, then
    CUDA C/C++ settings.


    Make sure the CUDA Toolkit is appropriately referenced in the project settings.


    NVIDIA Nsight Eclipse Edition for Linux and Mac


    NVIDIA Nsight Eclipse Edition is the preferred IDE for Linux and macOS users.
    It has comparable functionality to the Visual Studio version, but is built on
    the Eclipse IDE.


    Install Eclipse:


    Download and install Eclipse from the Eclipse Foundation website [https://www.eclipse.org/](https://www.eclipse.org/).
    Select the Eclipse IDE for C and C++ Developers package.


    Install the Nsight Eclipse Edition:


    During the CUDA Toolkit installation, you should have been asked to install Nsight
    Eclipse Edition. If not, you may get it from NVIDIA''s website.


    Configure the CUDA Toolkit:


    *   Open Eclipse and start a new CUDA C/C++ project.


    *   Go to Project Properties and choose CUDA C/C++ Build Settings.


    *   Make sure the CUDA Toolkit is appropriately referenced in the project settings.


    Alternative Text Editors and Tools for Linux Users


    If you prefer utilizing a text editor over a full-fledged IDE, there are various
    alternatives that work well with CUDA programming.


    1.  Text Editors:


    Visual Studio Code: A lightweight and capable code editor with CUDA support. Install
    the C/C++ extension from Visual Studio Code''s Marketplace.


    Sublime Text: Another popular text editor that provides good support for C++ programming.
    Install the packages required for C++ syntax highlighting and compiling.


    Vim/Emacs: For individuals who prefer command-line editors, both Vim and Emacs
    may be setup for CUDA development using the necessary plugins and build tools.


    2.  Building and Debugging:


    Use ''make'', ''gcc'', and ''gdb'' to create and debug CUDA applications from
    the command line.


    Set up your editor to utilize the NVCC compiler for CUDA code and the GCC or Clang
    compiler for host code.


    ### Configure the NVCC Compiler


    NVCC (NVIDIA CUDA Compiler) provides the foundation for CUDA development. A good
    workflow requires proper configuration in your development environment.


    Environment Variables:


    Make sure the CUDA Toolkit''s ''bin'' directory is in your system''s PATH environment
    variable. This allows the NVCC compiler to be accessed via the command line.


    Compiler Flags:


    When compiling CUDA code, utilize appropriate flags to specify target architecture
    and parameters. For example, the command ''nvcc -arch=sm_50 -o output_file source_file.cu''
    compiles a CUDA file for a GPU with computing capability 5.0.


    Integration with IDE:


    Set NVCC as the compiler for CUDA files in your IDE project settings. Configure
    any include directories, library locations, and other flags required for your
    project.'
