    Parallel Programming using CUDA


    Parallel programming in CUDA is based on the optimal use of threads, blocks, and
    grids to maximize the parallel processing capabilities of GPUs. This chapter will
    cover the fundamentals of thread hierarchy, grid and block setups, and synchronization
    strategies.


    ### Thread Hierarchy


    Threads, Blocks, and Grids


    Parallelism in CUDA is performed by using a hierarchical system of threads, blocks,
    and grids. Understanding the hierarchy is critical for developing effective parallel
    algorithms.


    Threads are CUDA''s smallest unit of execution. Each thread performs the same
    code but works with distinct data. Threads are assigned unique thread IDs (''threadIdx'').


    Blocks: A collection of threads running on the same multiprocessor that can collaborate
    by exchanging data via shared memory and coordinating their execution. Blocks
    have unique identifiers (''blockIdx'').


    Grids: A set of blocks that use the same kernel function. Grids can have one,
    two, or three dimensions, and ''blockIdx'' is used to index blocks inside a grid.


    This architecture enables CUDA to expand from a single thread to hundreds of millions
    of threads, maximizing the GPU''s computing power.


    Indexing Threads and Blocks


    To do parallel calculations, each thread must determine its unique location inside
    a block and grid. CUDA has built-in variables for this purpose.


    ''threadIdx'': Returns the thread index inside a block.


    ''blockIdx'': Returns the block index inside a grid.


    ''blockDim'': Returns the dimension of a block.


    ''gridDim'': Returns the dimensions of a grid.


    Here is an example that shows how to index threads and blocks in a kernel.


    __global__ void addVectors(int *a, int *b, int *c, int n) {


    int tid = blockIdx.x * blockDim.x + threadIdx.x;


    if (tid < n) {


    c[tid] = a[tid] + b[tid];


    }


    }


    int main() {


    // Number of elements in the vectors


    int n = 1024;


    // Allocate and initialize host and device memory


    int size = n * sizeof(int);


    int *h_a = (int *)malloc(size);


    int *h_b = (int *)malloc(size);


    int *h_c = (int *)malloc(size);


    for (int i = 0; i < n; i++) {


    h_a[i] = i;


    h_b[i] = i * 2;


    }


    int *d_a, *d_b, *d_c;


    cudaMalloc((void **)&d_a, size);


    cudaMalloc((void **)&d_b, size);


    cudaMalloc((void **)&d_c, size);


    cudaMemcpy(d_a, h_a, size, cudaMemcpyHostToDevice);


    cudaMemcpy(d_b, h_b, size, cudaMemcpyHostToDevice);


    // Define block and grid sizes


    int blockSize = 256;


    int numBlocks = (n + blockSize - 1) / blockSize;


    // Launch the kernel


    addVectors<<<numBlocks, blockSize>>>(d_a, d_b, d_c, n);


    // Copy result back to host


    cudaMemcpy(h_c, d_c, size, cudaMemcpyDeviceToHost);


    // Check results


    for (int i = 0; i < n; i++) {


    if (h_c[i] != h_a[i] + h_b[i]) {


    printf("Error at index %d\n", i);


    return -1;


    }


    }


    printf("All elements are correct!\n");


    // Free memory


    cudaFree(d_a);


    cudaFree(d_b);


    cudaFree(d_c);


    free(h_a);


    free(h_b);


    free(h_c);


    return 0;


    }


    In this example, ''tid'' is computed using ''blockIdx.x'', ''blockDim.x'', and
    ''threadIdx.x'', guaranteeing that each thread handles a distinct element of the
    vector.


    ### Grids and Blocks


    Determine Grid and Block Dimensions


    Choosing the appropriate grid and block size is critical for maximizing performance.
    Dimensions vary depending on the magnitude of the challenge and the GPU''s architecture.


    block size: The quantity of threads per block. A popular choice is 256 or 512
    threads per block, however this might differ depending on the situation.


    grid size: The number of blocks on the grid. This is determined using the total
    number of threads required and the block size.


    An Example Calculation:


    int n = 1024;


    int blockSize = 256;


    int numBlocks = (n + blockSize - 1) / blockSize;


    In this case, ''numBlocks'' is computed to guarantee that all ''n'' components
    are handled by the available blocks and threads.


    Best Practices for Grid and Block Configuration


    Occupancy: Increase occupancy, which is the ratio of active warps to the maximum
    number of warps supported by an SM. Higher occupancy often results in better performance.


    Memory Access Patterns: To ensure coalesced memory access, arrange memory accesses
    in a contiguous way.


    Shared Memory Usage: Make good use of shared memory to limit the number of global
    memory accesses.


    ### Synchronizing Threads


    Synchronization is essential in parallel programming to maintain the right execution
    order and data consistency. CUDA supports thread synchronization methods.


    The __syncthreads function


    The ''__syncthreads()'' method synchronizes all threads within a block. It guarantees
    that all threads have reached the synchronization point before any thread can
    move forward.


    Example:


    __global__ void compute(int *data, int n) {


    __shared__ int sharedData[256];


    int tid = threadIdx.x + blockIdx.x * blockDim.x;


    // Load data into shared memory


    sharedData[threadIdx.x] = data[tid];


    __syncthreads(); // Ensure all threads have loaded their data


    // Perform computation using shared memory


    if (tid < n) {


    data[tid] = sharedData[threadIdx.x] * 2;


    }


    }


    In this example, ''__syncthreads()'' guarantees that all threads have completed
    loading data into shared memory before doing any work.


    Synchronization Techniques Across Blocks


    CUDA does not provide direct synchronization between blocks during kernel startup.
    To accomplish global synchronization, divide your software into numerous kernel
    launches and use ''cudaDeviceSynchronize()'' to guarantee that all kernels finish
    execution.


    Example:


    __global__ void kernel1(int *data, int n) {


    // Perform some computation


    }


    __global__ void kernel2(int *data, int n) {


    // Perform another computation


    }


    int main() {


    int *d_data;


    cudaMalloc(&d_data, size);


    // Launch the first kernel


    kernel1<<<numBlocks, blockSize>>>(d_data, n);


    cudaDeviceSynchronize(); // Ensure kernel1 has finished


    // Launch the second kernel


    kernel2<<<numBlocks, blockSize>>>(d_data, n);


    cudaDeviceSynchronize(); // Ensure kernel2 has finished


    cudaFree(d_data);


    return 0;


    }


    In this example, ''cudaDeviceSynchronize()'' guarantees that ''kernel1'' finishes
    before ''kernel2'' begins.


    Understanding the thread hierarchy, grid and block topologies, and synchronization
    strategies is critical for successful parallel programming in CUDA. By carefully
    planning kernel launches and maintaining synchronization, you may use the capability
    of GPU computation and achieve considerable performance benefits. These fundamental
    abilities will prepare you to handle more complicated parallel programming issues
    in CUDA.


