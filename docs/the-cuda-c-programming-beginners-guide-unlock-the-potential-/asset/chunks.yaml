    A blur filter works by averaging the color values of a pixel and its neighbors.
    This procedure is independent of each pixel, making it extremely parallelizable.


    Example: Blur Filter Kernel


    __global__ void blurKernel(unsigned char *input, unsigned char *output, int width,
    int height) {


    int col = blockIdx.x * blockDim.x + threadIdx.x;


    int row = blockIdx.y * blockDim.y + threadIdx.y;


    if (col < width && row < height) {


    int pixVal = 0;


    int pixels = 0;


    // Sum the color values of the current pixel and its neighbors


    for (int blurRow = -1; blurRow <= 1; ++blurRow) {


    for (int blurCol = -1; blurCol <= 1; ++blurCol) {


