  #### 第 2 步：为主机和设备分配内存\n为主机（CPU）和设备（GPU）上的向量分配 RAM。\n\n![](img/image_rsrc2J5.jpg)\n\
  \n### 内存管理与数据传输\n\n#### 第 3 步：从主机拷贝数据到设备\n`cudaMemcpy` 将数据从主机传输到设备。\n\n![](img/image_rsrc2J6.jpg)\n\
  \n#### 第 4 步：启动内核函数\n确定块的数量和每个块的线程数，然后运行内核函数。\n\n![](img/image_rsrc2J7.jpg)\n\n\
  ### 同步与错误检查\n\n#### 第 5 步：同步并测试错误\n确保所有线程都已完成执行并查找任何问题。\n\n![](img/image_rsrc2J8.jpg)\n\
