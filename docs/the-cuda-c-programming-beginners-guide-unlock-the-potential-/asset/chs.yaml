  cudaFree(d_output);\ncudaFree(d_filter);\n\nstd::cout << \"Convolution forward pass\
  \ completed successfully.\" << std::endl;\n\nreturn 0;\n}\n```\n\n### Thrust 示例：并行排序\n\
