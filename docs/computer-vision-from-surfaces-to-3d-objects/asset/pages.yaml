- pgno: 227
  md: '# The Perceptual

    Representation

    of 3D Shape


    James T. Todd


    # CONTENTS


    +   - Introduction ........................................ 209

    +   - Local Property Maps .......................... 210

    +   - Feature Graphs ................................... 214


    # INTRODUCTION


    Human observers have a remarkable ability to determine the three-dimensional (3D)
    structures of objects in the environment based on patterns of light that project
    onto the retina. There are several different aspects of optical stimulation that
    are known to provide useful information about the 3D layout of the environment,
    including shading, texture, motion, and binocular disparity. Although numerous
    computational models have been developed for estimating 3D structure from these
    different sources of optical information, effective algorithms for analyzing natural
    images have proven to be surprisingly elusive. One possible reason for this, I
    suspect, is that there has been relatively little research to identify the specific
    aspects of an object’s structure that form the primitive components of an observer’s
    perceptual knowledge. After all, in order to compute shape, it is first necessary
    to define what “shape” is.


    An illuminating discussion about the concept of shape was first published almost
    50 years ago by the theoretical geographer William Bunge'
  merge: -1
  img_proc: true
- pgno: 228
  md: '(1962). Bunge argued that an adequate measure of shape must satisfy four criteria:
    it should be objective; it should not include less than shape, such as a set of
    position coordinates; it should not include more than shape, such as fitting it
    with a Fourier or Taylor series; and it should not do violence to our intuitive
    notions of what constitutes shape. This last criterion is particularly important
    for understanding human perception, and it highlights the deficiencies of most
    3D representations that have been employed in the literature. For example, all
    observers would agree that a big sphere and a small sphere both have the same
    shape—a sphere—but these objects differ in almost all of the standard measures
    with which 3D structures are typically represented (see Koenderink, 1990). In
    this chapter, I will consider two general types of data structures—maps and graphs—that
    are used for the representation of 3D shape by virtually all existing computational
    models, and I will also consider their relative strengths and weaknesses as models
    of human perception.


    # LOCAL PROPERTY MAPS


    Consider the image of a smoothly curved surface that is presented in Figure 11.1.
    Clearly there is sufficient information from the pattern of shading to produce
    a compelling impression of 3D shape, but what precisely do we know about the depicted
    object that defines the basis of our perceptual representations? Almost all existing
    theoretical models for computing the 3D structures of arbitrary surfaces from
    shading, texture, motion, or binocular disparity are designed to generate a particular
    form of data structure that we will refer to generically as a *local property
    map*. The basic idea is quite simple and powerful. A visual scene is broken up
    into a matrix of small local neighborhoods, each of which is characterized by
    a number (or a set of numbers) to represent some particular local aspect of 3D
    structure.


    The most common variety of this type of data structure is a depth map, in which
    each local region of a surface is defined by its distance from the point of observation.
    Although depth maps are used frequently for the representation of 3D shape, they
    have several undesirable characteristics. Most importantly, they are extremely
    unstable to variations in position, orientation, or scale. Because these transformations
    have a negligible impact on the perception of 3D shape, we would expect that our
    underlying perceptual representations should be invariant to these changes as
    well, but depth maps do not satisfy that criterion.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/4d808358747f9096d24f831e5f9d8083_229_0.png)


    **FIGURE 11.1** A shaded image of a smoothly curved surface. What do observers
    know about this object that defines the basis of their perceptual representations?


    The stability of local property maps can be improved somewhat by using higher
    levels of differential structure to characterize each local region. A depth map,
    $Z=f(X,Y)$ represents the 0th order structure of a surface, but it is also possible
    to define higher-order properties by taking spatial derivatives of this structure
    in orthogonal directions. The first spatial derivatives of a depth map $(f_X,f_Y)$
    define a pattern of surface depth gradients (i.e., an orientation map). Similarly,
    its second spatial derivatives $(f_{XX},f_{XY},f_{YY})$ define the pattern of
    curvature on a surface. Note that these higher levels of differential structure
    can be parameterized in a variety of ways. For example, many computational models
    represent local orientations using the surface depth gradients in the horizontal
    and vertical directions $(f_X,f_Y)$, which is sometimes referred to as gradient
    space. An alternative possibility is to represent surface orientation in terms
    of *slant* $(\sigma)$ and *tilt* $(\tau)$, which are equivalent to the latitude
    and longitude, respectively, on a unit sphere.


    There are also different coordinate systems for representing second-order differential
    structure. One common procedure is to specify the maximum and minimum curvatures
    $(k_1,k_2)$ at each local region, which'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'are always orthogonal to one another. Another possibility is to parameterize
    the structure in terms of *mean curvature* (H) and *Gaussian curvature* (K), where
    H = (k₁ + k₂)/2 and K = k₁k₂ (see Tyler, 2010). Perhaps the most perceptually
    plausible representation of local curvature was proposed by Koenderink (1990),
    in which the local surface structure is parameterized in terms of *curvedness*
    (C) and *shape index* (S), where C = √(k₁² + k₂²) and S = arctan2(k₁, k₂). An
    important property of this latter representation is that curvedness varies with
    object size, whereas the shape index component does not. Thus, a point on a large
    sphere would have a different curvedness than would a point on a small sphere,
    but they would both have the same shape index.


    There have been many different studies reported in the literature that have measured
    the abilities of human observers to estimate the local properties of smooth surfaces
    (see Figure 11.2). One approach that has been employed successfully in numerous
    experiments is to present randomly generated surfaces, such as the one shown in
    the left panel of Figure 11.2, with two small probe points to designate the target
    regions whose local properties must be compared. This technique has been used
    to investigate observers’ perceptions of both relative depth (Koenderink, van
    Doorn, and Kappers, 1996; Todd and Reichel, 1989; Norman and Todd, 1996, 1998)
    and relative orientation (Todd and Norman, 1995; Norman and Todd, 1996) under
    a wide variety of conditions. One surprising result that has been obtained repeatedly
    in these studies is that the perceived relative depth of two local regions can
    be dramatically influenced by the intervening surface structure along which they
    are connected. It is as if the shape of a visible surface can produce local distortions
    in the structure of perceived space. One consequence of these distortions is that
    observers’ sensitivity to relative depth intervals can deteriorate rapidly as
    their spatial separation along a surface is increased. Interestingly, these effects
    of separation are greatly diminished if the probe points are presented in empty
    space, or for judgments of relative orientation intervals (see Todd and Norman,
    1995; Norman and Todd, 1996, 1998).


    Another technique for measuring observers’ perceptions of local surface structure
    involves adjusting the 3D orientation of a circular disk, called a gauge figure,
    until it appears to rest in the tangent plane at some designated surface location
    (Koenderink, van Doorn, and Kappers, 1996; Todd et al., 1997). There are several
    variations of this technique that have been adapted for different types of optical
    information. For stereoscopic displays, the gauge figure is presented monocularly
    so that the adjustment'
