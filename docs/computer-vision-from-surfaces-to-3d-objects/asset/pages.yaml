  md: '3D space rather than as object reflectance or attentional salience in the 2D
    space of the visual field. Figure 9.2 illustrates that, to match the characteristics
    of human visual processing, such an implementation must conform to the stereoscopic
    limits on the curvature of continuous surfaces discovered by Tyler (1973, 1991).
    This surface smoothness limit has now been validated by Nienborg et al. (2004)
    in cortical cells, indicating the relevance of a surface-level reconstruction
    of the depth structure even in primary visual cortex. Once the depth structure
    is defined for each visual modality alone (e.g., luminance, disparity, motion),
    the integration of the corresponding cues should be modeled by Bayesian methods
    in relation to the estimated reliability of each cue to determine a singular estimate
    of the overall 3D structure in the visual field confronting the observer.


    The concept of surface representation requires a surface *interpolation* mechanism
    to represent the surface in regions of the field where the information is undefined.
    Such interpolation is analogous to the “shrink-wrapping” of a membrane around
    an irregular object such as a piece of furniture.


    ![](img/4d808358747f9096d24f831e5f9d8083_185_0.png)


    FIGURE 9.2  (a) Depiction of a random-dot surface with stereoscopic ripples. (b)
    Thresholds for detecting stereoscopic depth ripples, as a function of the spatial
    frequency of the ripples. (From Tyler, 1991. With permission.) Peak sensitivity
    (lowest thresholds) occurs at the low value of 0.4 cycle/deg (2.5 deg/cycle),
    implying that stereoscopic processing involves considerable smoothing relative
    to contrast processing.'
