- pgno: 29
  md: 'What is more surprising in Figure 1.1c that the correlation between depth and
    intensity is significantly negative. Specifically, the correlation between the
    intensity and the depth at a given pixel is roughly −0.20. In other words, brighter
    pixels tend to be closer to the observer. Historically, physics-based approaches
    to shape from shading have generally concluded that shading cues offer only relative
    depth information. Our findings show there is also an absolute depth cue available
    from image intensity data that could help to more accurately infer depth from
    2D images.


    This empirical finding regarding natural 3D scenes may be related to an analogous
    psychophysical observation that, all other things being equal, brighter stimuli
    are perceived as being closer to the observer. This psychophysical phenomenon
    has been observed as far back as Leonardo da Vinci, who stated, “among bodies
    equal in size and distance, that which shines the more brightly seems to the eye
    nearer” (MacCurdy, 1938). Hence, we referred to our empirical correlation as the
    _da Vinci correlation_. Artists sometimes make use of this cue to help create
    compelling illusions of depth (Sheffield et al., 2000; Wallschlaeger and Busic–Snyder,
    1992).


    In the last century, psychophysicists validated da Vinci’s observations in rigorous,
    controlled experiments (Ashley, 1898; Carr, 1935; Coules, 1955; Farne, 1977; Langer
    and Bülthoff, 1999; Surdick et al., 1997; Taylor and Sumner, 1945; Tyler, 1998;
    Wright and Ledgeway, 2004). In psychology literature, this effect is known as
    _relative brightness_ (Myers 1995). Numerous possible explanations have been offered
    as to why such a perceptual bias exists. One common explanation is that light
    coming from distant objects has a greater tendency to be absorbed by the atmosphere
    (Cutting and Vishton, 1995). However, in most conditions, as in outdoor sunlit
    scenes, the atmosphere tends to scatter light from the sun directly toward our
    eyes, making more distant objects appear brighter under hazy conditions (Nayar
    and Narasimhan, 1999). Furthermore, our database was acquired under sunny, clear
    conditions, under distances insufficient to cause atmospheric effects (maximum
    distances were roughly 200 m). Other explanations of a purely psychological explanation
    have also been advanced (Taylor and Sumner, 1945). Although these might be contributing
    factors for our perceptual bias, they cannot account for empirical observations
    of real scenes.


    By examining which images exhibited the da Vinci correlation most strongly, we
    concluded that the major cause of the correlation was primarily due to shadow
    effects within the environment (Potetz and Lee, 2003). For example, one category
    of images where correlation between nearness and brightness was very strong was
    images of trees and leafy foliage. Because the'
