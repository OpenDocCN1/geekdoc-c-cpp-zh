- pgno: 17
  md: 'binding of the variety of different perceptual cues that are segregated early
    in the visual process.


    # MULTIPLE SURFACE CUES


    Studies of surface properties typically focus on surfaces represented by purely
    stereoscopic cues, but physical surfaces are almost always defined by multiple
    visual cues. Thus, it is important to treat the multimodal representation of surfaces
    as a perceptual primary, integrating the properties of the reflectance structures
    in the world into a unified surface representation:


    $$\Phi(x,y)=f(d_S(x,y),d_D(x,y),d_M(x,y),d_T(x,y)...) \qquad (0.9)$$


    where $d_X(x,y)$ are the independent egocentric distances computed from each of
    the independent distance cues ($S$, luminance shading; $D$, binocular disparity;
    $M$, motion parallax; $T$, texture gradient, etc.), and $f()$ is the operative
    cue combination rule.


    This expression says that the information from these diverse modalities is combined
    into a unitary depth percept, but it does not specify the combination rule by
    which they are aggregated. For the commonly proposed Bayesian combination rule,


    $$f()=\left\|\sigma_X^2/d_X\right\|_2 \qquad (0.10)$$


    where $\sigma_X^2$ are the noise variances for each distance cue.


    If surface reconstruction is performed separately in each visual modality (with
    independent noise sources), the surface distance estimates should combine according
    to their absolute signal–noise ratios. Signals from the various modalities ($S$,
    $D$, $M$, $T$, …, $X$) would combine to improve the surface distance estimation;
    adding information about the object profile from a second surface identification
    modality could never degrade surface reconstruction accuracy.


    More realistic, post-Bayesian versions of the combination rule have also been
    proposed (Tyer, 2004). The main rule by which the area is assigned to a particular
    border is the occlusion rule. If a disparity-defined structure encloses a certain
    region, that region is seen as occluding the region outside the border. The border
    is perceived as “owning” the region inside the enclosure, which is therefore assigned
    to the same depth as the border. The region outside the enclosure is therefore
    more distant and is “owned” by the next'
  merge: -1
  img_proc: true
