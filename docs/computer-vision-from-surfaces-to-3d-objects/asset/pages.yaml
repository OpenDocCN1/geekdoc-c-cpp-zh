- pgno: 31
  md: 'The urban scenes contained primarily smooth, man-made surfaces with fewer concavities
    or crevices, and so we predicted these images to have reduced correlation between
    nearness and brightness. On the other hand, were the correlation found in the
    original dataset due to atmospheric effects, we would expect the correlation to
    exist equally well in both the rural and urban scenes. The average depth in the
    urban database (32 m) was similar to that of the rural database (40 m), so atmospheric
    effects should be similar in both datasets. We found that correlations calculated
    for the rural dataset increased to −0.32, while those for the urban dataset are
    considerably weaker, in the neighborhood of −0.06.


    In Langer and Zucker (1994), it was observed that for continuous Lambertian surfaces
    of constant albedo, lit by a hemisphere of diffuse lighting and viewed from above,
    a tendency for brighter pixels to be closer to the observer can be predicted from
    the equations for rendering the scene. Intuitively, the reason for this is that
    under diffuse lighting conditions, the brightest areas of a surface will be those
    that are the most exposed to the sky. When viewed from above, the peaks of the
    surface will be closer to the observer. Although these theoretical results have
    not been extended to more general environments, our results show that in natural
    scenes, these tendencies remain, even when scenes are viewed from the side, under
    bright light from a single direction, and even when that lighting direction is
    oblique to the viewer. In spite of these differences, both phenomena seem related
    to the observation that concave areas are more likely to be in shadow. The fact
    that all of our images were taken under cloudless, sunny conditions and with oblique
    lighting from above suggests that this cue may be more important than first realized.


    It is interesting to note that the correlation between nearness and brightness
    in natural scenes depends on several complex properties of image formation. Complex
    3D surfaces with crevices and concavities must be present, and cast shadows must
    be present to fill these concavities. Additionally, we expect that without diffuse
    lighting and lighting inter-reflections (light reflecting off of several surfaces
    before reaching the eye), the stark lighting of a single-point light source would
    greatly diminish the effect (Langer and Zucker, 1994). Cast shadows, complex 3D
    surfaces, diffuse lighting, and lighting interreflections are image formation
    phenomena that are traditionally ignored by methods of depth inference that attempt
    to invert physical models of image formation. The mathematics required for these
    phenomena are too cumbersome to invert. However, taken together, these image formation
    behaviors result in the simplest'
