  md: 'stronger contour cue. Consequently, at a large slant, shading is no longer
    associated with surface shape and is perceived as a color of the surface (bottom
    right). Thus, the strength of visual cues changes with visual conditions and defines
    how visual cues are combined or ignored.


    # Cue Promotion


    Another potential nonlinearity of cue integration happens when a cue probability
    becomes multimodal or several cues depend on a common parameter (Landy et al.,
    1995; van Ee, Adams, and Mamassian, 2003; Adams and Mamassian, 2004). In the case
    when cue likelihood is multimodal, cues can interact with each other for the purpose
    of disambiguation: one cue can help another to select a particular peak in its
    likelihood function. When cues depend on a common parameter, interaction happens
    for the purpose of cue promotion. One goal of cue promotion is to eliminate mutual
    dependencies of cues on a common parameter; another goal is to express cues on
    a common scale so that they can be meaningfully combined. For example, both binocular
    disparity and kinetic depth effect cues scale with a visual distance (a common
    parameter) but in essentially different ways. Only at one viewing distance, they
    produce a consistent depth image, which can be used to solve for a viewing distance
    and to restore cue independence.


    Although a particular mechanism of cue promotion remains largely unknown, it does
    not seem to represent a significant challenge on the algorithmic level. In fact,
    Landy et al. (1995) suggested several methods for how to solve for a common parameter
    of depth cues. However, if a cue for a certain scene property also depends on
    surface shape that changes as a function of spatial location, solving jointly
    for the cue and shape may be nontrivial (Ivanchenko, 2006). A more computationally
    plausible solution is to estimate surface shape independently from other scene
    properties. In a sense, this is similar to independent estimations of cues. A
    further discussion of this issue is given in the next section.


    To summarize, the cue integration framework makes several major assumptions about
    information extraction and processing, such as the use of simple visual features
    (cues) and cue independence. On the one hand, these assumptions are quite general
    and simplify computation and learning. On the other hand, the assumptions are
    only approximately true. The visual system seems to compensate for simple dependencies
    between cues using cue promotion and disambiguation. To further improve performance,
    the visual system adjusts the weights on cues and priors depending on viewing
    conditions. Overall, a cue integration framework makes a'
