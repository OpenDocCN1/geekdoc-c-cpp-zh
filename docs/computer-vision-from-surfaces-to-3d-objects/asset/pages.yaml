    # FIGURE–GROUND ORGANIZATION


    The concept of figure–ground organization was introduced by Gestalt psychologists
    in the first half of the 20th century (Wertheimer, 1923/1958; Koffka, 1935). Gestalt
    psychologists emphasized the fact that we do not perceive the retinal image. We
    see objects and scenes, and we can perceptually judge their shapes, sizes, and
    colors, but we cannot easily (if at all) judge their retinal images. The fact
    that we see shapes, sizes, and colors of objects veridically despite changes in
    the viewing conditions (viewing orientation, distance, and chromaticity of the
    illuminant) is called *shape, size,* and *color constancy*, respectively. Changes
    in the viewing conditions change the *retinal image*, but the *percept* remains
    constant. How are those constancies achieved? Gestalt psychologists pointed out
    that the percept can be explained by the operation of a *simplicity principle*.
    Specifically, according to Gestaltists, the percept is the simplest interpretation
    of the retinal image. Figures 6.1 and 6.2 provide illustrations of how a simplicity
    principle can explain the percept. Figure 6.1 can be interpreted as two overlapping
    rectangles or two touching hexagons. It is much easier to see the former interpretation
    because it is simpler. Clearly, two symmetric rectangles is a simpler interpretation
    than two asymmetric hexagons. Figure 6.2a can be interpreted as two lines forming
    an X or two V-shaped lines touching'
