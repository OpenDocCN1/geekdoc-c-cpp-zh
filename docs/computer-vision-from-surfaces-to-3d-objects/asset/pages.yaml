    are two other sources of information available to the observer: the 2D retinal
    shapes produced by figure–ground organization and 3D shape priors representing
    the natural world statistics. Figure–ground organization was defined in the first
    paragraph and will be discussed next. The 3D shape priors include 3D symmetry
    and 3D compactness. These priors have been recently used by the present authors
