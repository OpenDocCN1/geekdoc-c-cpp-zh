  md: 'Another important factor in designing a segmentation algorithm is how it uses
    the visual cues to find the region. There are two types of visual cues: monocular
    cues (namely, intensity, color, and texture) that come from a single image only,
    binocular cues (such as depth), and motion cues that are calculated by using two
    or more images of the scene. Usually, the existing segmentation algorithms handle
    either of these two types of cues. Most importantly, the basic framework changes
    significantly from the image segmentation algorithms that use only monocular cues
    to the motion segmentation algorithms that use motion cues to segment the region
    in the image. Instead, the framework of the desired segmentation algorithm should
    be cue independent, meaning the method to find the region should not change if
    we just have monocular cues to the case when color, texture, depth, and motion
    cues are all available.


    In this chapter, we formulate the problem of segmentation such that it incorporates
    all available cues to segment the region of interest being fixated at. Our'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'segmentation procedure is a two-step process: first, all available visual cues
    are used to generate a probabilistic boundary edge map. The grayscale value of
    an edge pixel in the map is proportional to the probability of that pixel to be
    at a region boundary. In Section 2.3.1, the method to obtain this map is explained
    in detail. Second, the fixation point is selected in the scene either by a visual
    attention module or by any other meaningful strategy. The probabilistic edge map
    from the first step is then transferred from the Cartesian space to the polar
    space with the fixation point as its pole. The closed boundary of the region containing
    the fixation point in the Cartesian space is found as the optimal cut through
    the polar probabilistic edge map as described in Section 2.3.2. Splitting the
    segmentation framework into two steps is important, because this way the visual
    cues are used only to obtain a better probabilistic boundary edge map. Once that
    is calculated, the segmentation is defined optimally for every fixation selected
    in the scene (or image).


    The rest of the chapter is organized as follows: in the next section, the existing
    segmentation algorithms are discussed in detail. In Section 2.3, our segmentation
    algorithm is described. The experimental results are presented with quantitative
    analysis in Section 2.4. We discuss the fixation strategy and how the segmentation
    output is stable against the location of fixation inside the region in Section
    2.5. We conclude our chapter with some suggestions for future research in this
    area.


    # 2.2 BACKGROUND


    Without prior knowledge or context and only on the basis of signal processing,
    whatever the segmentation algorithm may be, somehow it needs to decide when to
    stop growing the segments and stop the process of segmentation. And that input
    comes from the user. Without any user input, segmenting an image into regions
    is an ill-posed problem, because segmentation can be fine or coarse depending
    on when the process is stopped. Most popular algorithms amount to such global
    methods. It is also widely known that it is difficult to estimate the input parameters
    automatically for any given image.


    Several interactive algorithms have been proposed where the objective is to always
    segment the entire image into two regions: foreground and background. There are
    different types of these algorithms, and they take inputs from the user differently.
    These algorithms are not automatic and cannot be used to build an autonomous visual
    system. They are used in interactive applications, such as image/video editing
    and image databases.'
