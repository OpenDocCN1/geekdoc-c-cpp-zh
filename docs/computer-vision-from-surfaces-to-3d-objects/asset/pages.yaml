  md: 'interpolated contours begin and end at junctions or corners in visible contours
    (tangent discontinuities)—locations at which contours have no unique orientation
    (Shipley and Kellman, 1990; Rubin, 2001). Some have suggested that second-order
    discontinuities (points that are first-order continuous but mark a change in curvature)
    might also weakly trigger interpolation (Shipley and Kellman, 1990; Albert and
    Hoffman, 2000; Albert and Tse, 2000; Albert, 2001; for recent discussion see Kellman,
    Garrigan, and Shipley, 2005). Tangent discontinuities arise from the optics of
    how occluded objects project to the eyes: it can be proven that the optical projection
    of one object occluding another will contain these image features (Kellman & Shipley,
    1991). Shipley and Kellman (1990) observed that, in general, interpolated contours
    begin and end at tangent discontinuities and showed that their removal eliminated
    or markedly reduced contour interpolation. Heitger et al. (1992) called tangent
    discontinuities “key points” and proposed a neurally plausible model for their
    extraction from images. The presence or absence of tangent discontinuities can
    be manipulated in illusory contour images by rounding the corners of inducing
    elements, which weakens contour interpolation (e.g., Albert and Hoffman, 2000;
    Kellman et al., 2005; Shipley and Kellman, 1990; Palmer, Kellman, and Shipley,
    2006).


    # Contour Relatability


    What determines which visible contour fragments get connected to form objects?
    Although tangent discontinuities are ordinarily necessary conditions for contour
    interpolation, they are not sufficient. After all, many corners in images are
    corners of objects, not points at which some contour passes behind an intervening
    surface (or in front, as in illusory contours).


    Contour interpolation depends crucially on geometric relations of visible contour
    fragments, specifically the relative positions and orientations of pairs of edges
    leading into points of tangent discontinuity. These relations have been described
    formally in terms of *contour relatability* (Kellman and Shipley, 1991; Singh
    and Hoffman, 1999a). Relatability is a mathematical notion that defines a categorical
    distinction between edges that can connect by interpolation and those that cannot
    (see Kellman and Shipley, 1991, 175–177). The key idea in contour relatability
    is smoothness (e.g., interpolated contours are differentiable at least once),
    but it also incorporates monotonicity (interpolated contours'
