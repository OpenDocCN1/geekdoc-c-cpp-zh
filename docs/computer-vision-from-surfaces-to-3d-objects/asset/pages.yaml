- pgno: 201
  md: 'that paradoxically increase their response to a depth structure stimulus (or
    do not decrease their response significantly) as the density of luminance information
    is reduced. Based on the evidence that there is a single depth interpolation mechanism
    for all visual modalities (Tyler et al., 2006), experiments should be conducted
    for disparity, motion, and texture density cues to the same depth structure, to
    test the prediction that the same cortical interpolation site will show increased
    response as dot density is decreased for all three depth structure cues.


    In conclusion, the primary outcome of this review is the concept of 3D surface
    interpolation, that is, that the predominant mode of spatial processing is through
    a self-organizing surface representation (or attentional shroud, see Ch. 0) within
    a full 3D spatial metric. It is not until such a surface representation is developed
    that the perceptual system seems to be able to localize the components of the
    scene (Likova & Tyler, 2003). This view is radically opposed to the more conventional
    concept that the primary quality is visual stimuli is their location, with other
    properties attached to this location coordinate (Marr, 1982). By contrast, the
    concept of the attentional shroud is a flexible network for the internal representation
    of the external object structure. In this concept, the attentional shroud is,
    itself, the perceptual coordinate frame. It organizes ("shrink-wraps") itself
    to optimize the spatial interpretation implied by the complex of binocular and
    monocular depth cues derived from the retinal images. It is not until this depth
    reconstruction process is complete that the coordinate locations can be assigned
    to the external scene. In this sense, localization is secondary to the full depth
    representation of the visual input. Spatial form, usually seen as a predominantly
    2D property that can be rotated into the third dimension, becomes a primary 3D
    concept of which the 2D projection is a derivative feature.


    The net result of this analysis is to offer a novel insight into the nature of
    the binding problem. The separate stimulus properties and local features are bound
    into a coherent object by the "glue" of the global 3D surface representation.
    This view is a radical counterpart to the concept of breaking the scene down into
    its component elements by means of specialized receptive fields and recognition
    circuitry. The evidence reviewed in this overview emphasizes the inherent three-dimensionality
    of the surface "shrink-wrapping" process by the attentional shroud in the form
    of a prehensile matrix that can cohere the object components whose images are
    projected onto the sensorium. Such active binding processes are readily implementable
    computationally with plausible neural components that could reside in a locus
    of 3D reconstruction in the human cortex.'
