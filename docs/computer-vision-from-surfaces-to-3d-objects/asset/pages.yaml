  md: 'then a curvature vector **k** is admissible if and only if


    $$\sum_{v_i\in I} K_i > -\sum_{(e,v)\in L_k(I)} (\pi-\Phi(e))+2\pi\chi(F_I)$$  (4.26)


    The admissible curvature space for weighted meshes with hyperbolic or spherical
    background geometries is more complicated. We refer the readers to Luo, Gu, and
    Dai (2007) for a detailed discussion.


    # Discrete Surface Ricci Flow


    Suppose $(\Sigma,\Phi)$ is a weighted mesh with an initial circle packing metric.
    The discrete Ricci flow is defined as follows:


    $$\frac{du_i(t)}{dt}=({\bar K}_i-K_i)$$  (4.27)


    where $\bar{\mathbf K}=(\bar K_1,\bar K_2,\ldots,\bar K_n)^T$ is the user-defined
    target curvature. The discrete Ricci flow has the same form as the smooth Ricci
    flow (Equation (4.2)), which deforms the circle packing metric according to the
    Gaussian curvature, as in Equation (4.27).


    The discrete Ricci flow can be formulated in the variational setting—namely, it
    is a negative gradient flow of a special energy form. Let $(\Sigma,\Phi)$ be a
    weighted mesh with spherical (Euclidean or hyperbolic) background geometry. For
    two arbitrary vertices $v_i$ and $v_j$, the following symmetric relation holds:


    $$\frac{\partial K_i}{\partial u_j}=\frac{\partial K_j}{\partial u_i}$$  (4.28)


    Let $\omega=\sum_{i=1}^{n}K_i\,du_i$ be a differential one-form (Weitraub, 2007).
    The symmetric relation guarantees that the one-form is closed (curl free) in the
    metric space:


    $$d\omega=\sum_{i,j}\left(\frac{\partial K_i}{\partial u_j}-\frac{\partial K_j}{\partial
    u_i}\right)du_i\wedge du_j=0$$  (4.29)


    By Stokes theorem, the following integration is path independent:


    $$f(u)=\int_{u_0}^{u}\sum_{i=1}^{n}(\bar K_i-K_i)\,du_i$$  (4.30)


    where $u_0$ is an arbitrary initial metric. Therefore, the above integration is
    well defined and is called the *discrete Ricci energy*. The discrete Ricci flow
    is the negative gradient flow of the discrete Ricci energy. The discrete metric,
    which induces **k**, is the minimizer of the energy.'
