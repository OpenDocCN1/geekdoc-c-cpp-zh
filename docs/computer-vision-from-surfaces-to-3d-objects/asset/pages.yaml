    A function defined on the vertices $u: V \to \mathbb{R}$ is the *discrete conformal
    factor*. The edge length $l_{ij}$ is defined as


    $$l_{ij}=e^{u_i+u_j}d_{ij}$$


    Let $K_i$ and $\overline{K}_i$ denote the current vertex curvature and the target
    vertex curvature, respectively. The discrete Yamabe flow is defined as


    $$\frac{du_i(t)}{dt}=\overline{K}_i-K_i,$$


    with initial condition $u_i(0)=0$. The convergence of Yamabe flow is proven in
    Luo (2004).


    Furthermore, Yamabe flow is the gradient flow of the following Yamabe energy,
    let $\mathbf{u}=(u_1,u_2,\ldots,u_n)$, $n$ be the total number of vertices:


    $$f(\mathbf{u})=\int_{\mathbf{u}_0}^{\mathbf{u}}\sum_{i=1}^{n}(\overline{K}_i-K_i)\,du_i.$$


    Similar to the Ricci flow, one can show that


    $$\frac{\partial K_i}{\partial u_j}=\frac{\partial K_j}{\partial u_i}$$


    The Yamabe energy is well defined and convex. The Hessian matrix can be easily
    constructed as follows. Supposing faces $f_{jk}$ and $f_{ji}$ are adjacent to
    the edge $e_{ij}$, define the *weight* of the edge $e_{ij}$ as


    $$\omega_{ij}=\cot\theta_k+\cot\theta_l$$


    where $\theta_k$ is the angle at $v_k$ in $f_{ijk}$, and $\theta_l$ is the angle
    at $v_l$ in face $f_{jil}$. If the edge is on the boundary, and only attaches
    to $f_{ijk}$, then


    $$\omega_{ij}=\cot\theta_k$$'
