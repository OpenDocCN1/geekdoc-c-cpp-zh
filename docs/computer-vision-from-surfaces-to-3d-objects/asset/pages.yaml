  md: '# INTRODUCTION


    As David Marr observed in his classic book *Vision* (1982), understanding visual
    perception involves issues at multiple levels of analysis. This observation applies
    not only to conceptual differences in the kinds of questions researchers must
    ask, but also to different levels of visual processing. Vision researchers have
    made great progress in understanding early cortical filtering. At the opposite
    end, research has revealed some areas in which high-level representations reside,
    such as those for objects or faces. Between these levels, however, there is a
    considerable gap. This gap in “middle vision” involves all of Marr’s levels: the
    understanding of information for computing representations of contours, surfaces,
    and objects; the representations and processes involved; and the sites and roles
    of cortical areas. Although Marr emphasized that these levels have substantial
    independence in terms of the questions they pose, the lag in understanding what
    goes on “in the middle” is also related to interactions among these levels. Understanding
    the task and information paves the way for process descriptions. Similarly, detailed
    hypotheses about processes and representations guide meaningful neurophysiological
    investigations.


    Fundamental to the middle game in vision are three-dimensional (3D) representations.
    What is the shape of a surface? How do we represent the shapes of 3D objects and
    obtain these representations from incomplete and fragmentary projections of an
    object to the eyes? How do we obtain descriptions of objects and surfaces in ordinary
    environments, where the views of most objects are partly obstructed by other objects,
    and visible areas change in complex ways as objects and observers move?


    Although many traditional approaches to vision have sought to discover how meaningful
    perceptual representations can be gotten by inferences from static, two-dimensional
    (2D) images, it has become increasingly clear that human vision both utilizes
    complex 3D and spatiotemporal information as inputs and constructs 3D surface
    representations as outputs. Although human vision may exploit shortcuts for some
    tasks, 3D surface representations play many important roles both in our comprehension
    of the world and our ability to interact with it.


    In this chapter, we consider several lines of research aimed at improving our
    understanding of 3D and spatiotemporal surface and object formation. Specifically,
    we are concerned with the achievement of surface or object representations when
    the visual system must interpolate across'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'spatial and spatiotemporal gaps in the input. The human visual system possesses
    remarkable mechanisms for recovering coherent objects and surface representations
    from fragmentary input. Specifically, object and surface perception depend on
    interpolation processes that overcome gaps in contours and surfaces in 2D, 3D,
    and spatiotemporal displays. Recent research suggests that the mechanisms for
    doing so are deeply related in that they exploit common geometric regularities.


    # SOME PHENOMENA OF VISUAL INTERPOLATION


    In ordinary perception, partial occlusion of objects and surfaces is pervasive.
    Panels (a)–(d) on the left side of Figure 10.1, for example, show views of a house
    occluded by a fence. Even in a single static view, we are able to get some representation
    of the scene behind the fence. If the several views were seen in sequence by a
    walking observer, we would get a remarkably complete representation, as suggested
    by Figure 10.1c.


    Perceiving whole objects and continuous surfaces requires perceptual processes
    that connect visible regions across gaps in the input to achieve accurate representations
    of unity and shape. These have most often been studied for static 2D representations.
    Yet perception grapples with a 3D world and produces, in part, truly 3D representations
    of object contours and surfaces. Furthermore, when objects or observers move,
    the visible regions of objects change over time, complicating the requirements
    of object formation. The system deals with fragmentation, not only in space, but
    across time as well. Thus, we may think of contour and surface perception in the
    real world as a mapping from information arrayed across four dimensions (three
    spatial dimensions and time) into 3D spatial representations. If motion is represented,
    visual object and surface formation is a mapping from fragmented four-dimensional
    (4D) inputs into coherent, functionally meaningful, 4D representations.


    These phenomena are formally similar in that the same physically specified contours
    of the central figure are given in Figure 10a, 10b, and 10c, and the completed
    object in each case is defined by the same collection of physically specified
    and interpolated contours. (Figure 10d includes only the corresponding interpolations
    in the middle part of the figure.)


    # Categories of Interpolation Phenomena


    A number of phenomena involve connecting visible contours and surfaces across
    gaps (Figure 10.2). Figure 10.2a shows partial occlusion. Six'
