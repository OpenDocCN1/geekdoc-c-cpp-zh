  md: 'in the section on how MRFs propagate information is likely to fail if the surface
    is slanted: the prior may have trouble propagating the linearly changing disparity
    beyond the textured region of the image. In such cases, although the first *x*
    and *y* derivatives of disparity may be nonzero, the second derivatives are zero.
    (Any planar surface has an associated disparity field \(D_r = ax + by + c\), where
    \(r = (x,y)\), that is, the disparity is linear in the *x* and *y* image coordinates.)


    Ongoing research in my laboratory seeks to overcome this fronto-parallel bias
    in the context of a specific application: terrain analysis for visually impaired
    wheelchair users. In this application (Ivanchenko et al., 2008), a stereo camera
    is pointed at the ground, such that the optical axis makes an angle of approximately
    45° with the ground surface. The goal is to detect terrain irregularities such
    as obstacles, holes in the ground, and curbs, and to convey this information to
    the wheelchair user.


    We designed a real-time algorithm for detecting and reporting terrain irregularities
    using a fast, commercially available stereo algorithm that is integrated with
    the stereo camera hardware. The stereo algorithm is based on simple window correlation
    rather than an MRF model and is therefore very fast, processing many frames per
    second. The disadvantage of using such a fast algorithm is that it produces sparse,
    noisy disparity estimates, and smooths over depth discontinuities. However, the
    quality of the disparity estimates suffices for detecting large terrain irregularities
    such as trees and other obstacles. When the algorithm fails to detect any significant
    deviations from the dominant ground plane (e.g., sidewalk surface) in the scene,
    it seems sensible to apply a more sophisticated stereo algorithm such as a MRF
    model to examine the scene in more detail. A second algorithm such as this may
    reveal the presence of a curb or other subtle depth discontinuity that was missed
    by the first algorithm.


    The slant of the ground plane means that the disparity of the ground changes appreciably
    from one image row to the next, violating the fronto-parallel assumption. To rectify
    this problem, we are experimenting with warping one of the images so as to remove
    the disparity corresponding to the ground plane. (This idea was originally proposed
    in Burt, Wixson, and Salgian [1995].) Thus, only scene points that lie off the
    ground plane will have nonzero disparity, and planes parallel to the ground plane
    (e.g., the road bordering the sidewalk) will have *uniform disparities*. In this
    way, the image data are transformed so that the fronto-parallel bias is appropriate.'
