    The ventral region is activated only by temporal changes in the surface structure
    and is therefore likely to be a *temporal comparator mechanism* operating for
    both types of depth motion. Such a mechanism would need input from a surface interpolation
    mechanism, but we do not have direct evidence of a pathway connecting the dorsal
