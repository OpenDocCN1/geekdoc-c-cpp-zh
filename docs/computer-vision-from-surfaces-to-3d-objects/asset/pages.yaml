    disparity:* A given depth interval *d* in the world gives rise to decreasing disparity
    as viewing distance increases. Interval d given by points R and S produces smaller
    disparity differences than P and Q, if R and S are farther away. *Slant:* Obtaining
    slant from disparity depends not only on recovering the depth interval but also
