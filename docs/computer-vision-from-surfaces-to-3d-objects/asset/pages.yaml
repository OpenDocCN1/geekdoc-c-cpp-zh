  md: 'optimization procedures that require an estimate of the number of regions either
    directly or indirectly (in terms of other thresholds) to segment the scene. Figure
    2.1b,c are the segmentation of Figure 2.1a using (Shi and Malik, 2000) with its
    parameter (number of regions) set to 10 and 60, respectively. If the trees in
    the scene are of interest, Figure 2.1b is more meaningful than Figure 2.1c, wherein
    the tree has been oversegmented into a large number of small regions. Such segmentation
    is termed *oversegmentation* because the region of interest is split into many
    small regions. However, if the tiny horse in Figure 2.1a is of interest, then
    Figure 2.1c is more meaningful, as the horse appears as a combination of just
    two regions in the image. The segmentation in Figure 2.1b, on the other hand,
    does not even have the region corresponding to the horse. It is a case of undersegmentation,
    wherein small regions are merged to form bigger regions. Depending upon which
    is an important region and at what scale it exists, the appropriate parameter
    needs to be set for (Shi and Malik, 2000) to output a meaningful segmentation.


    But, in a real scene, there can be multiple regions of interest in the scene,
    and they can exist at dramatically different scales, as is the case in this example.
    So, a consistent and automatic segmentation algorithm is that which can segment
    the region of interest irrespective of its size in the image.


    Such a segmentation is associated with the region of interest. Unlike the current
    algorithms, it will only segment the region of interest as foreground and everything
    else in the scene as background. In fact, we know that the human (primate) visual
    system works in a similar way. It observes and makes sense of a dynamic scene
    (video) or static scene (image) by making a series of fixations at various salient
    locations in the scene. Researchers have studied in great length about where the
    human eye fixates (Cref et al., 2008; Walther and Koch, 2006), but little is known
    about the operations carried out in the human visual system during a fixation.
    It is also well known that the structure of the human retina is such that only
    the small neighborhood around these fixations is captured in high resolution by
    the fovea, while the rest of the scene is captured in lower resolution by the
    sensors on the periphery of retina. We suggest that, as a first step, the visual
    system segments the region on which it is fixating. Rather than segmenting the
    entire scene or image at once, we suggest the human visual system segments the
    scene in terms of individual regions for each of the fixations in the scene. For
    example, as the attention of the visual system is drawn to the horse (Figure 2.2a),
    it segments the horse (Figure 2.2b). When the attention is drawn to the trees
    (Figure 2.2c), it segments the trees (Figure 2.2d).'
