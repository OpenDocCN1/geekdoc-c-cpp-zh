- pgno: 88
  md: 'Converting a surface S to its conformal representation (D<sub>s</sub>,λ<sub>s</sub>,H<sub>s</sub>)
    is a challenging problem. Ricci curvature flow offers a powerful tool for computing
    it.




    Intrinsic curvature flows have been used in Riemannian geometry in the past 50
    years with great success. One of the most recent examples appears in the proof
    of the Poincaré conjecture on two manifolds (Perelman, 2002, 2003a, 2003b), where
    the Ricci flow is employed as a fundamental tool.


    These flows deform a given Riemannian metric according to its curvature. Among
    the most famous ones are the Ricci flow and the Yamabe flow. Both can be used
    to design Riemannian metrics with special curvature properties.


    The Ricci flow deforms the Riemannian metric according to its Ricci curvature.
    In particular, it can be used to find a metric with constant Ricci curvature.
    There is a simple physical intuition behind it. Given a compact manifold with
    a Riemannian metric, the metric induces the curvature function. If the metric
    is changed, the curvature will be changed accordingly. The metric can be deformed
    in the following way: at each point, locally scale the metric, so that the scaling
    factor is proportional to the curvature at the point. After the deformation, the
    curvature will be changed. Repeating this deformation process, both the metric
    and the curvature will evolve like heat diffusion. Eventually, the curvature function
    will become constant everywhere.


    Another intrinsic curvature flow is called Yamabe flow. It has the same physical
    intuition with the Ricci flow, except for the fact that it is driven by the scalar
    curvature instead of Ricci curvature. For two manifolds, the Yamabe flow is essentially
    equivalent to the Ricci flow. But for higher-dimensional manifolds, Yamabe flow
    is much more flexible than the Ricci flow to reach constant-scalar-curvature metrics.


    Due to the ability of intrinsic curvature flows on metric designs, two curvature
    flows have been recently introduced into the engineering fields: a discrete Ricci
    flow on surfaces and a discrete Yamabe flow on surfaces. Through these works,
    the power of curvature flows has been extended from pure theoretical study to
    solving practical problems.


    One should note that in engineering fields, manifolds are usually approximated
    using discrete constructions, such as piecewise linear meshes; in order to employ
    curvature flow to solve practical problems, we need to'
