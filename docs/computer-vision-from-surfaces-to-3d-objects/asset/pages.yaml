    viewed.


    # EMPIRICAL EVIDENCE FOR SURFACE REPRESENTATION IN THE BRAIN


    Surface representations are often discussed in terms of brightness propagation
    and texture segmentation, but these are weak inferences toward a true surface
    representation. Evidence is building from perceptual,'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'psychophysical, neurophysiological, and computational sources in support of
    a surface-level description operating in the brain. Surface-specific neural coding
    has been reported early in the visual processing stream (Nienborg et al., 2005;
    Bredfeldt and Cumming, 2006; Samonds, Potetz, and Lee, 2009) and subsequently
    appears to be a feature of both the temporal-lobe and parietal-lobe streams of
    spatial representation in the cortex. In the temporal-lobe stream, neurons responsive
    to stereoscopic surface orientation have been reported in visual area V4 (Hinkle
    and Connor, 2002), and in middle temporal areas (MT) (Nguyenkim and DeAngelis,
    2003) and medial superior temporal (MST) (Sugihara et al., 2002). Deeper into
    the temporal lobe, many neurons in the inferior bank of the superior temporal
    sulcus are selective for the complex shape of stereoscopic surfaces (Sakata et
    al., 1999; Janssen et al., 2001; Tanaka et al., 2001; Liu, Vogels, and Orban,
    2004). Moreover, Joly, Vanduffel, and Orban. (2009) observed depth structure sensitivity
    from disparity in a small region of macaque inferior temporal cortex, TEs, known
    to house higher-order disparity selective neurons. Even in the frontal lobe, within
    ventral premotor cortex, area F5a (the most rostral sector of F5), showed sensitivity
    for depth structure from disparity. Within this area, 2D shape sensitivity was
    also observed, suggesting that area F5a processes complete 3D shape and might
    thus reflect the activity of canonical neurons.


    Similarly, several regions of the parietal cortex are involved in the coding of
    surface shape. At a simple level, a large proportion of neurons in the occipital
    extension of the intraparietal sulcus of monkey are selective for stereoscopic
    surface orientation in the third dimension (Shikata et al., 1996; Taira et al.,
    2000; Tsutsui et al., 2001, 2002). This wealth of studies makes it clear that
    multimodal surface representation is an important component of the neural hierarchy
    in both the ventral and dorsal processing streams. Furthermore, Durand et al.
    (2007) used functional magnetic resonance imaging (fMRI) in monkeys to show that
    while several intraparietal (IP) areas (caudal, lateral, and anterior IP areas
    CIP, LIP, and AIP on the lateral bank; posterior and medial IP areas PIP and MIP
    on the medial bank) are activated by stereoscopic stimuli, AIP and an adjoining
    portion of LIP are sensitive to the stereoscopic surface shape of small objects.
    Interestingly, unlike the known representation of 3D shape in macaque inferior
    temporal cortex, the neural representation in AIP appears to emphasize object
    parameters required for the planning of grasping movements (Srivastava et al.,
    2009). This interpretation provides the basis for an understanding of the dual
    coding of surface shape in both the ventral and dorsal streams.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The dorsal stream would be involved in the 3D properties for the preparation
    for action, and the ventral stream would be specialized for the processes of semantic
    encoding and categorization of the objects.


    In human cortex, Tyler et al. (2006) focused on the occipital cortex and found
    a dorsal region of the lateral occipital complex (LOC) to be specialized for the
    surface structure represented by both stereoscopic and kinetic depth cues. They
    argued that this region was the first level for the encoding of the generic surface
    structure of visual objects. Extending along the intraparietal sulcus (IPS), Durand
    et al. (2009) determined that retinotopic area V7 had a mixed sensitivity to both
    position in depth and generic depth structure, and the dorsal medial (DIPSM) and
    the dorsal anterior (DIPSA) regions of the IPS were sensitive to depth structure
    and not to position in depth. All three regions were also sensitive to 2D shape,
    indicating that they carry full 3D shape information. Similarly, Georgieva et
    al. (2009) report the involvement of five IPS regions as well as the dorsal LOC,
    the posterior inferior temporal gyrus (ITG), and ventral premotor cortex in the
    extraction and processing of a 3D shape from the depth surface structure of objects
    in the world.


    # CONCLUSION


    This overview emphasizes the view of spatial vision as an active process of object
    representation, in which a self-organization net of neural representation can
    reach through the array of local depth cues to form an integrated surface representation
    of the object structure in the physical world being viewed. Such a description
    is compatible with a realization in the neural networks of the parieto-occipital
    cortex rather than just an abstract cognitive schema. This conceptualization identifies
    an active neural coding process that goes far beyond the atomistic concept of
    local contour or disparity detectors across the field and that can account for
    some of the dynamic processes of our visual experience of the surface structure
    of the scene before us. Once the 3D surface structure is encoded, the nature of
    the elements in the scene can be segmented into the function units that we know
    as “objects.”


    The contributions to this book develop advanced theoretical and empirical approaches
    to all levels of the surface representation problem, from both the computational
    and neural implementation perspectives. These cutting-edge contributions run the
    gamut from the basic issue of the ground plane for surface estimation through
    midlevel analyses of the processes of surface segmentation to complex Riemannian
    space methods'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'of representing and evaluating surfaces. Taken together, they represent a radical
    new approach to the thorny problem of determining the structure and interrelationships
    of the objects in the visual scene, and one that holds the promise of a decisive
    advance both in our capability of parsing scene information computationally and
    also in our understanding the coding of such information in the neuronal circuitry
    of the brain.


