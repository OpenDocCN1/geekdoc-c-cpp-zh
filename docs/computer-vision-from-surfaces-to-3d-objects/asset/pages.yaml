    # RESULTS


    # Surface Color¹


    One of the most surprising findings of modern vision research was the discovery
    of orientation selectivity of neurons in the visual cortex and the emphasis on
    edges (discontinuities of intensity and color) in the cortical representation.
    This can be appreciated by looking at the profile of neuronal activity across
    the representation of the surface of a uniformly colored object (Figure 8.2).
    The results presented here are based on single-cell recordings from the macaque
    visual cortex under awake behavioral conditions (Friedman, Zhou, and von der Heydt,
    2003). The curves show the firing rates of the neurons as a function of the location
    of the receptive field (RF) relative to a square figure. The curves represent
    averaged responses of neurons with near-foveal receptive fields; the square measured
    either 4° or 6° on a side, a multiple of the size of the receptive fields. About
    80% of the neurons in V2 and the supragranular layers of V1 are strongly orientation
    selective. As shown by the top curves in Figure 8.1, these cells respond to the
    edges but are virtually unresponsive to the uniform interior of the square. The
    curves below show that nonoriented and weakly oriented cells, although activated
    by the uniform surface, also emphasize the edges by about a factor of 3. As a
    result, the total activity in these regions of cortex is about five times higher
    at the edges than in the center of the square (bottom curve; in combining the
    activity profiles of oriented and nonoriented cells, the relative number of cells
    was taken into account along with the fact that only a small fraction of the oriented
    cells are activated by the edges at any given orientation, while all nonoriented
    cells contribute activity).


    An important point is that the proportion of color-selective neurons is at least
    as high among oriented cells as it is among nonoriented cells (Friedman, Zhou,
    and von der Heydt, 2003). Because of the overwhelming preponderance of orientation-selective
    neurons, this means that color information is predominantly carried by orientation-selective
    edge responses.


    How can edge signals code for surface color? Edge-selective neurons respond when
    their receptive field is on the border between two regions of different color.
    If the neurons were to signal the color of a surface, and not just the presence
    of an edge, they should be able to differentiate on which side the color is located.
