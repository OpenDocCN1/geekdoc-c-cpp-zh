- pgno: 32
  md: 'possible relationship between shape and appearance—an absolute correlation
    between nearness and brightness. This finding illustrates the necessity of continued
    exploration of the statistics of natural 3D scenes.


    # 1.3 CHARACTERIZING THE LINEAR STATISTICS OF NATURAL 3D SCENES


    In the previous section, we explained the correlation between the intensity of
    a pixel and its nearness. We now expand this analysis to include the correlation
    between the intensity of a pixel and the nearness of other pixels in the image.
    The set of all such correlations forms the cross-correlation between depth and
    intensity. The cross-correlation is an important statistical tool: as we explain
    later, if the cross-correlation between a particular image and its range image
    was known completely, then given the image, we could use simple linear regression
    techniques to infer 3D shape perfectly. Even though perfect estimation of the
    cross-correlation from a single image is impossible, we demonstrate that this
    correlational structure of a single scene follows several robust statistical trends.
    These trends allow us to approximate the full cross-correlation of a scene using
    only three parameters, and these parameters can be measured even from very sparse
    shape and intensity information. Approximating the cross-correlation this way
    allows us to achieve a novel form of statistically driven depth inference that
    can be used in conjunction with other depth cues, such as stereo.


    Given an image $i(x,y)$ with range image $z(x,y)$, the cross-correlation for that
    particular scene is given by


    $$(i \star z)(\Delta x, \Delta y) = \iint i(x,y)z(x+\Delta x,y+\Delta y)\,dx\,dy
    \tag{1.2}$$


    It is helpful to consider the cross-correlation between intensity and depth within
    the Fourier domain. If we use $I(u,v)$ and $Z(u,v)$ to denote the Fourier transform
    of $i(x,y)$ and $z(x,y)$, respectively, then the Fourier transform of $i \star
    z$ is $Z(u,v)I^*(u,v)$. $ZI^*$ is known as the cross-spectrum of $i$ and $z$.
    Note that $ZI^*$ has both real and imaginary parts. Also note that in this section,
    no logarithm or other transformation was applied to the intensity or range data
    (measured in meters). This allows us to evaluate $ZI^*$ in the context of the
    Lambertian model assumptions, as we demonstrate later.


    If the cross-spectrum is known for a given image, and is sufficiently bounded
    away from zero, then the 3D shape could be estimated from a single image using
    linear regression: $Z = I(ZI/II^*)$. In this section, we'
