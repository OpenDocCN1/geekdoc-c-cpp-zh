    # 1.1 INTRODUCTION


    The inference of depth information from single images is typically performed by
    devising models of image formation based on the physics of light interaction and
    then inverting these models to solve for depth. Once inverted, these models are
    highly underconstrained, requiring many assumptions, such as Lambertian surface
    reflectance, smoothness of surfaces, uniform albedo, or lack of cast shadows.
    Little is known about the relative merits of these assumptions in real scenes.
    A statistical understanding of the joint distribution of real images and their
    underlying three-dimensional (3D) structure would allow us to replace these assumptions
    and simplifications with probabilistic priors based on real'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'scenes. Furthermore, statistical studies may uncover entirely new sources of
    information that are not obvious from physical models. Real scenes are affected
    by many regularities in the environment, such as the natural geometry of objects,
    the arrangements of objects in space, natural distributions of light, and regularities
    in the position of the observer. Few current computer vision algorithms for 3D
    shape inference make use of these trends. Despite the potential usefulness of
    statistical models and the growing success of statistical methods in vision, few
    studies have been made into the statistical relationship between images and range
    (depth) images. Those studies that have examined this relationship in nature have
    uncovered meaningful and exploitable statistical trends in real scenes which may
    be useful for designing new algorithms in surface inference, and also for understanding
    how humans perceive depth in real scenes (Howe and Purves, 2002; Potetz and Lee,
    2003; Torralba and Oliva, 2002). In this chapter, we highlight some results we
    obtained in our study on the statistical relationships between 3D scene structures
    and two-dimensional (2D) images and discuss their implications on understanding
    human 3D surface perception and its underlying computational principles.


    # 1.2 CORRELATION BETWEEN BRIGHTNESS AND DEPTH


    To understand the statistical regularities in natural scenes that allow us to
    infer 3D structures from their 2D images, we carried out a study to investigate
    the correlational structures between depth and light in natural scenes. We collected
    a database of coregistered intensity and high-resolution range images (corresponding
    pixels of the two images correspond to the same point in space) of over 100 urban
    and rural scenes. Scans were collected using the Riegl LMS-Z360 laser range scanner.
    The Z360 collects coregistered range and color data using an integrated charge-coupled
    device (CCD) sensor and a time-of-flight laser scanner with a rotating mirror.
    The scanner has a maximum range of 200 m and a depth accuracy of 12 mm. However,
    for each scene in our database, multiple scans were averaged to obtain accuracy
    under 6 mm. Raw range measurements are given in meters. All scanning is performed
    in spherical coordinates. Scans were taken of a variety of rural and urban scenes.
    All images were taken outdoors, under sunny conditions, while the scanner was
    level with the ground. Typical spatial resolution was roughly 20 pixels per degree.


    To begin to understand the statistical trends present between 3D shape and 2D
    appearance, we start our statistical investigation by studying'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'simple linear correlations within 3D scenes. We analyzed corresponding intensity
    and range patches, computing the correlation between a specific pixel (in either
    image or range patch) with other pixels in the image patch or the range patch,
    obtained with the following equation:


    $$\rho = \operatorname{cor}[X,Y] = \frac{\operatorname{cov}[X,Y]}{\sqrt{\operatorname{var}[X]\operatorname{var}[Y]}}$$  (1.1)


    The patch size is 25 × 25 pixels, slightly more than 1 degree visual angle in
    each dimension, and in calculating the covariance, both of the image patch and
    the range patch, we subtracted their corresponding means across all patches.


    One significant source of variance between images is the intensity of the light
    source illuminating the scene. Differences in lighting intensity result in changes
    to the contrast of each image patch, which is equivalent to applying a multiplicative
    constant. In order to compute statistics that are invariant to lighting intensity,
    previous studies of the statistics of natural images (without range data) focus
    on the logarithm of the light intensity values, rather than intensity (Field,
    1994; van Hateren and van der Schaaf, 1998). Zero-sum linear filters will then
    be insensitive to changes in image contrast. Likewise, we take the logarithm of
    range data as well. As explained by Huang et al. (2000), a large object and a
    small object of the same shape will appear identical to the eye when the large
    object is positioned appropriately far away and the small object is close. However,
    the raw range measurements of the large, distant object will differ from those
    of the small object by a constant multiplicative factor. In the log range data,
    the two objects will differ by an additive constant. Therefore, a zero-sum linear
    filter will respond identically to the two objects.


    Figure 1.1 shows three illustrative correlation plots. Figure 1.1a shows the correlation
    between intensity at center pixel (13,13) and all of the pixels of the intensity
    patch. Figure 1.1b shows the correlation between range at pixel (13,13) and the
    pixels of the range patch. We observe that neighboring range pixels are much more
    highly correlated with one another than neighboring luminance pixels. This suggests
    that the low-frequency components of range data contain much more power than in
    luminance images, and that the spatial Fourier spectra for range images drop off
    more quickly than for luminance images, which are known to have roughly $\frac{1}{f}$
    spatial Fourier amplitude spectra (Ruderman and Bialek, 1994). This finding is
    reasonable, because factors that cause high-frequency variation in range images,
    such as occlusion contours or surface texture, tend to also cause variation in
    the luminance image. However,'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'much of the high-frequency variations found in luminance images, such as shadow
    and surface markings, are not observed in range images. These correlations are
    related to the relative degree of smoothness characteristic of natural images
    versus natural range images. Specifically, natural range images are in a sense
    smoother than natural images. Accurate modeling of these statistical properties
    of natural images and range images is essential for robust computer vision algorithms
    and for perceptual inference in general. Smoothness properties in particular are
    ubiquitous in modern computer vision techniques for applications such as image
    denoising and inpainting (Roth and Black, 2005), image-based rendering (Woodford
    et al., 2006), shape from stereo (Scharstein and Szeliski, 2002), shape from shading
    (Potetz, 2007), and others.


    Figure 1.1c shows correlation between intensity at pixel (13,13) and the pixels
    of the range patch. There are two important effects here. The first is a general
    vertical tilt in the correlation plot, showing that luminance values are more
    negatively correlated with depth at pixels lower within the patch. This result
    is due to the fact that the scenes in our database were lit from above. Because
    of this, surfaces facing upward were generally brighter than surfaces facing downward;
    conversely, brighter surfaces were more likely to be facing upward than darker
    surfaces. Thus, when a given pixel is bright, the distance to that pixel is generally
    less than the distance to pixels slightly lower within the image. This explains
    the increasingly negative correlations between the intensity at pixel (13,13)
    and the depth at pixels lower within the range image patch.


    ![](img/4d808358747f9096d24f831e5f9d8083_28_0.png)'
