  md: 'respectively. The operators will also be interpreted as position and angular
    momentum operators, respectively. They satisfy the same commutation rules as the
    operators $X_1, X_2$, as well as the vector fields $\vec{X}_1, \vec{X}_2$:


    $$[Y_1,Y_2]=Y_3,\quad [Y_1,Y_3]=0,\quad [Y_2,Y_3]=Y_1 \tag{7.12}$$


    where


    $$Y_3=\partial_\eta$$


    is the generator of translation in the direction orthogonal to $Y_1$, exactly
    as the corresponding vector $X_3$ is the generator of translations in the direction
    orthogonal to $X_1$.


    The operators $Y_1$ and $Y_2$ represent the propagation along the curves of the
    bidimensional association fields (see Figure 7.4).


    Note that they are self-adjoint with respect to the scalar product in $R^2$:


    $$\langle f,g\rangle_{R^2}=\int_{R^2}f(\xi,\eta)\overline{g(\xi,\eta)}\,d\xi d\eta$$


    # The Uncertainty Principle


    Receptive profiles have been interpreted as the minimal of the Heisenberg uncertainty
    principle by Daugman (1985). His crucial remark is the fact that simple cells
    are able to detect at the same time position and orientation, but these two quantities
    do not commute. Hence, the classical uncertainty principle first introduced by
    Heisenberg in quantum mechanics applies. Roughly speaking, it states that it is
    not possible to detect exactly both position and momentum and that the variance
    of their measurements cannot go below a fixed degree of uncertainty. However,
    there exist functions, the “coherent states,” that are able to minimize the degree
    of uncertainty in both quantities. These minima are Gabor (1946) filters, and
    Daugman (1985) proved that they are a good model of the receptive profiles of
    simple cells.


    It was proven in Folland (1989) that the uncertainty principle does not apply
    only to the generators of the Heisenberg group. It applies to any couple of noncommuting
    operators. Hence, in our setting, it seems more natural to minimize the uncertainty
    principle for the generators of the Lie algebra of rotations and translations.
    Because we are looking for functions defined on the 2D space, we will use the
    representation of the vector fields in terms of the 2D variables, namely, the
    vector fields $Y_1$ and $Y_2$ introduced in Equation 7.11.'
