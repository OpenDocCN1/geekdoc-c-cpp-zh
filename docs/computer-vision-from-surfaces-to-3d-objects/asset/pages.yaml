- pgno: 221
  md: 'fragments via contour and surface interpolation processes that have previously
    been identified for static objects. As a result of persistence and updating processes,
    whether contours are interpolated is constrained by the same geometric relations
    of contour relatability (Kellman and Shipley, 1991; Kellman, Garrigan, and Shipley,
    2005) that determine unit formation in static arrays.


    As the spatial relationships that support interpolation are highly constrained,
    accurate representations of previously seen fragments are important tant for allowing
    spatiotemporal object formation to occur, and to operate accurately. Palmer, Kellman,
    and Shipley (2006) combined the requirements for object formation with proposals
    about visual mechanisms that represent, update, and connect object fragments over
    time in a model of spatiotemporal relatability (STR). The model provides an account
    for perception of dynamically occluded objects in situations such as that presented
    in Figure 10.1.


    In a series of experiments, Palmer, Kellman, and Shipley (2006) found support
    for the persistence, position updating, and relatability notions of STR. The notion
    of persistence was supported because observers performed as if they had seen dynamically
    occluded objects for longer than their physical exposure durations. The notion
    of position updating was supported because observers were highly accurate at discriminating
    between two shape configurations that differed only in the horizontal alignment
    of the pieces. Because the dynamically occluded objects traveled horizontally
    and two partner edges on either side of an occluded region were not seen simultaneously,
    observers’ accurate performance demonstrated that they had information about the
    locations of both edges despite the fact that, at all times, at least one was
    occluded. Finally, the notion that contour and surface interpolation processes
    operated in these displays was supported by a strong advantage in discrimination
    performance under conditions predicted to support object formation. Specifically,
    configurations that conformed to the geometric constraints of STR produced markedly
    better sensitivity than those that did not. The dependence of this effect on object
    formation was also shown in another condition, in which the removal of a mere
    6% of pixels at the points of occlusion (rounding contour junctions) produced
    reliably poorer performance, despite the fact that the global configuration of
    the pieces was preserved. This last result was predicted from prior findings that
    rounding of contour junctions weakens contour completion processes (Albert, 2001;
    Shipley and Kellman, 1990; Rubin, 2001). When'
