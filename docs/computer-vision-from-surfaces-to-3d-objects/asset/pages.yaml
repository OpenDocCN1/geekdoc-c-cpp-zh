    the pairs of 2D points that are images of 3D symmetric points. Finally, the model
    had information about which contours are planar in 3D. Planarity constraint is
    critical in recovering the back, invisible part of the 3D shape (Li, Pizlo, and
    Steinman, 2009). We want to point out, again, that the information about where
    in the image the contours are and which contours are symmetric and which are planar
    in 3D corresponds to establishing figure-ground organization in the 2D image.
    Our model does not solve the figure-ground organization (yet). The model assumes
    that figure-ground organization has already been established. It is clear that
    the model recovered these polyhedral shapes very well. The recovered 3D shapes
    are accurate for most shapes and most viewing directions. That is, the model achieves
    shape constancy. Note that the model can recover the entire 3D shape, not only
