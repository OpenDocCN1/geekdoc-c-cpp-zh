  md: '# Mechanisms for Propagating

    Surface Information in

    3D Reconstruction


    James Coughlan


    # CONTENTS


    +   - Introduction ................................................ 51

    +   - Markov Random Fields for Stereo ......................... 53

    +     - Model Improvements and Refinements ................. 55

    +     - How MRFs Propagate Information ........................ 56

    +   - Tractable Inference and Learning .......................... 57

    +     - Learning MRF Parameters .................................. 59

    +   - More Realistic Priors .......................................... 59

    +   - Biological Plausibility ......................................... 61

    +   - Discussion ........................................................ 62

    +   - Acknowledgments .............................................. 63


    # INTRODUCTION


    Bayesian and other related statistical techniques have emerged as a dominant paradigm
    in computer vision for estimating three-dimensional (3D) surfaces in the presence
    of noisy and sparse depth cues. In particular, for 3D reconstruction problems,
    these techniques have been implemented using Markov random fields (MRFs), which
    are probabilistic models that express how variables arranged in a spatial structure
    jointly vary, such as a rectangular grid of disparity variables aligned to a pixel
    lattice in a stereo model. Such MRF models incorporate powerful priors on surface'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'geometry, which allow 3D estimates to combine evidence from depth cues with
    prior knowledge of smoothness constraints. They embody a natural mechanism for
    propagating surface information from regions with highly informative depth cues
    to neighboring regions with unreliable or missing depth cues, without crossing
    over depth discontinuities. Recent advances in inference algorithms have enlarged
    the range of statistical models that are tractable for computer implementation,
    enabling the use of increasingly realistic and expressive models and leading to
    some of the most robust and accurate 3D estimation algorithms to date. Finally,
    a “belief propagation” framework allows these models to be implemented on a massively
    parallel computer architecture, raising the possibility that they may be realized
    in a biologically plausible form.


    3D reconstruction is a major theme in computer vision, with techniques for estimating
    shape from a variety of cues, including shading (Haines and Wilson, 2008), texture
    (White and Forsyth, 2006), and multiview stereo (Seitz, Curless, Diebel, Scharstein,
    and Szeliski, 2006). A fundamental challenge of 3D reconstruction is estimating
    depth information everywhere in a scene despite the fact that depth cues are noisy
    and sparse. These properties of depth cues mean that depth information must be
    propagated from regions of greater certainty to regions of lesser certainty. The
    3D reconstruction problem that is perhaps the most mature in computer vision is
    stereo using two or more calibrated cameras with known epipolar geometry. The
    most successful stereo algorithms use MRFs (Chellappa and Jain, 1993), which are
    probabilistic models that express the joint distribution of variables arranged
    in a network structure, with the state of any variable exerting a direct influence
    on the states of its neighbors. In the case of stereo (here we consider two-view
    stereo), a basic MRF model consists of a lattice (grid) of disparity variables,
    one for each pixel in the image. For any disparity hypothesized at a given pixel,
    there is (usually ambiguous) evidence from the corresponding match between the
    left and right images that this disparity implies. Nearest-neighbor connections
    enforce a prior smoothness constraint on disparities, which equates to a related
    smoothness constraint on depths in the scene. Inference is performed using a global
    optimization method such as graph cuts (Boykov, Veksler, and Zabih, 2001) or belief
    propagation (Yedidia, Freeman, and Weiss, 2001), which determines a near-optimal
    assignment of disparities to each pixel given the image data. The MRF framework
    embodies a natural mechanism for propagating surface information in the presence
    of noisy and sparse data.'
  merge: -1
  img_proc: true
