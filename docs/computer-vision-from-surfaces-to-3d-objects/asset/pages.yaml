- pgno: 72
  md: 'We proposed here a novel formulation of segmentation in conjunction with fixation.
    The framework combines monocular cues with motion and stereo to disambiguate the
    internal edges from boundary edges. The approach is motivated by biological vision,
    and it may have connections to neural models developed for the problem of border
    ownership in segmentation (Craft et al., 2007). Although the framework was developed
    for an active observer, it applies to image databases as well, where the notion
    of fixation amounts to selecting an image point that becomes the center of the
    polar transformation. One of the reasons for getting good segmentation with only
    monocular cues is the better probabilistic boundary edge map given by (Martin
    et al., 2004). Our contribution here was to formulate an old problem—segmentation—in
    a different way and show that existing computational mechanisms in state-of-the-art
    computer vision are sufficient to lead us to promising automatic solutions. Our
    approach can be complemented in a variety of ways, for example, by introducing
    a multitude of cues. An interesting avenue has to do with learning edges.


    In Figure 2.9, we also provide a visual comparison between the output of the proposed
    segmentation and the interactive Grabcut algorithm (Kass et al., 1998) and Normalized
    Cut (Malik et al., 2001) for some of the difficult images from the berkeley segmentation
    Database. For normalized cut, the best parameter (between 5 to 20) for each image
    is manually selected and the corresponding segmentation is shown in the last row
    of Figure 2.9.'
