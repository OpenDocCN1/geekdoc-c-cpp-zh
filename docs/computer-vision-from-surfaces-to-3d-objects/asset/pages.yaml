    Note from the table that the image power spectra I(u, v)I*(u, v) also obeys a
    power law. The observation that the power spectrum of natural images obeys a power
    law is one of the most robust and important statistic trends of natural images
    (Ruderman and Bialek, 1994), and it stems from the scale invariance of natural
    images. Specifically, an image that has been scaled up, such as i(σx, σy), has
    similar statistical properties as an unscaled image. This statistical property
    predicts that II*(r, θ) ≈ 1/r². The power-law structure of the power spectrum
    II* has proven highly useful in image processing and computer vision and has led
    to advances in image compression, image denoising, and several other applications.
    Similarly, the discovery that ZI* also obeys a power spectrum may prove highly
    useful for the inference of 3D shape.


    As mentioned earlier, knowing the full cross-covariance structure of an image/range-image
    pair would allow us to reconstruct the range image using linear regression via
    the equation Z = I(ZI*/II*). Thus, we are especially interested in estimating
    the regression kernel K = ZI*/II*. IK is a perfect reconstruction of the original
    range image (as long as II*(u, v) ≠ 0). The findings shown in Table 1.1 predict
    that K also obeys a power law. Subtracting αII* from αreal[ZI*] and αimag[ZI*],
    we find that real[K] drops off at 1/r¹·¹, and imag[K] drops off at 1/r¹·². Thus,
    we have that K(r, θ) ≈ BK(θ)/r.


    Now that we know that K can be fit (roughly) by a 1/r power law, we can offer
    some insight into why K tends to approximate this general form. Note that the
    1/r drop-off of K cannot be predicted by scale invariance. If images and range
    images were jointly scale invariant, then II* and ZI* would both obey 1/r² power
    laws, and K would have a roughly uniform magnitude. Thus, even though natural
    images appear to be statistically scale invariant, the finding that K ≈ B_K(θ)/r
    disproves scale invariance for natural scenes (meaning images and range images
    taken together).'
