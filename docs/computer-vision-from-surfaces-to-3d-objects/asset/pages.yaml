  img_proc: true
- pgno: 123
  md: 'The model of information propagation described by Coughlan in Chapter 3 of
    this book is based on probabilistic formulation of a surface as a Markov random
    field (MRF). MRFs are widely used in computer vision to express the joint probability
    of a grid of random variables with local interaction (Weiss, 1997; Weiss and Freeman,
    2001). Similar to cue integration, MRFs combine evidence from image cues and prior
    cue probabilities. Unlike cue integration, MRFs specify a constraint on neighboring
    variables to represent local interactions.


    There are several methods for performing inference with MRFs that maximize either
    marginal or maximum _a posteriori_ (MAP) probabilities. These methods were proven
    to perform optimally in the absence of loops in MRF but were also shown to perform
    well in loopy cases (Cochran, 1937; Felzenszwalb and Huttenlocher, 2006). One
    such method, belief propagation as was suggested in Coughlan in Chapter 3 of this
    book. This is because BP explicitly describes how neighboring variables exchange
    messages related to hypotheses about local surface properties.


    For the purposes of the current discussion, it is sufficient to say that during
    BP, each variable in MRF sends a message to its neighbors, and this process iterates
    throughout the grid until messages converge. The content of these messages reflects
    a best sender’s guess about the receiver’s likelihood based on all locally available
    evidence including a prior. If we associate a discrete likelihood with a set of
    hypotheses about a visual property (e.g., disparity in the image), then we can
    say that through message updates, BP dynamically reevaluates all possible hypotheses
    based on the compromise between local evidence and a prior constraint.


    Note that BP has no explicit mechanism for propagation of strong cues (i.e., those
    weak likelihoods whose strong peaks) into the locations that contain weak cues
    (i.e., those whose likelihoods have no strong peaks). Nevertheless, such propagation
    does happen in the MRF framework. Moreover, the propagation can be facilitated
    if the regions where cues propagate contain variables with flat likelihood. Such
    a case was described by Coughlan in Chapter 3 of this book, where disparity information
    was propagated from a textured image region into a textureless one. Note that
    the textureless region has no cues for disparity; thus, corresponding likelihoods
    are flat. The propagation happens because MAP to which an algorithm converges
    is a product of likelihoods and smoothness priors, and the latter are higher for
    variables with similar likelihoods. Thus, initially flat likelihoods inside of
    the textureless region acquire values similar'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'to the likelihoods at the region periphery. Importantly, in this case, the
    region with flat likelihoods has no evidence that is contrary to the one being
    propagated into the region.


    Here we consider a case when cues are present throughout the image but weak or
    noisy at some of its regions (as happens in the areas with low contrast texture).
    Consequently, cue likelihoods are not flat but rather have a few weakly pronounced
    peaks that correspond to multiple matching hypotheses. Some peaks happen as a
    result of random noise in one or both images of a stereo pair. Though these noisy
    likelihoods look similar to flat ones, propagation is limited. As computer simulations
    show, variables at the regions with noisy likelihoods converge to MAP probabilities
    that show little or no influence from neighboring regions with strong likelihoods.
    Thus, propagation is limited in the case when likelihoods are not completely flat.


    Algorithmically, this can be explained by the fact that when two variable likelihoods
    inside of a noisy region coincidentally express similar similar hypotheses, these
    hypotheses are reinforced by a smoothness prior. Variables with such reinforced
    likelihoods become a major obstruction to propagation. This is because the hypotheses
    expressed in their likelihood often do not support the ones propagated into the
    region (and vice versa). More research is required in order to better understand
    factors for information propagation in MRFs. Here I suggest some solutions for
    improving propagation in the areas with noisy cues.


    A straightforward solution is to discard the regions with noisy or weak cues from
    consideration. This is a common practice for a disparity validation procedure
    in correlation-based stereo. The obvious disadvantage of this procedure is holes
    in a disparity map. Another solution is to use multiscale MRFs where short-distance
    propagation on a rough scale corresponds to long-distance propagation on a fine
    scale. However, a more principled approach is to detect weak likelihoods and flatten
    them out. A tentative definition of a discrete weak likelihood can be based on
    a comparison of the magnitude of its peak with an average value expected for a
    single level. Likelihood is weak if its peaks are not much larger than the expected
    mean value. Note that detecting weak likelihoods is similar to finding weak cues
    during a cue conflict. Moreover, a flattening process is similar to ignoring a
    discrepant cue during robust cue integration. This is because a flat likelihood
    carries no hypothesis and thus cannot be considered as a cue.


    It is interesting to note that although a likelihood flattening method was derived
    solely from practical consideration, there is theoretical justification'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'for it. It is based on the probabilistic theory of a cue conflict discussed
    in the first section. Mathematically, this theory describes a mixture of prior
    assumptions that make cues informative. For the problem of finding binocular correspondence,
    one can model images as a mixture of at least two types of objects. One contains
    strong edges (e.g., outlines of objects and high contrast texture), and the other
    includes image regions with low-contrast intensities (e.g., uniform color of object
    surfaces and low contrast texture). For the first class of objects, we can use
    very informative edge cues, and for the second class of objects, the cues are
    less informative. According to the mixture of priors approach, we can express
    a full cue likelihood as


    $$P(I\mid S)=\pi_{edge}P(I\mid S,M_{edge})+\pi_{intensity}P(I\mid S,M_{intensity})
    \tag{5.4}$$


    Here the first component of the likelihood is due to informative edge cues, and
    the second component comes from less informative intensity cues. The strength
    of the edge can be used to indicate the weight to which each prior model applies.
    Then a formula for likelihood (Coughlan, 2011, this volume) that expresses a matching
    error, $m(D)$ at a certain image location and disparity $D$,


    $$P(m(D)\mid D)=\frac{1}{Z}e^{-\mu m(D)} \tag{5.5}$$


    can be rewritten as


    $$P(m(D)\mid D)=\frac{1}{Z''}\left[\pi_{edge}e^{-\mu_1m(D)}+\pi_{intensity}e^{-\mu_2m(D)}\right]
    \tag{5.6}$$


    Where $\mu_2<\mu_1$ to reflect the fact that an intensity cue is less informative
    than the edge cue. In the marginal case of $\mu_2=0,\pi_{intensity}=1$, and $\pi_{edge}=0$,
    we obtain the above-described flattening method for likelihoods. Note that in
    order to detect cues with weak likelihoods, one can directly analyze likelihood
    peaks, which is more beneficial than measuring edge strength. The former has an
    advantage of finding cases when the reason for weak likelihood is not only a low
    contrast texture but also a highly regular texture (i.e., the one that produces
    multiple matching hypotheses).


    As computer simulations show, flattening weak likelihoods greatly improves propagation
    of disparity information into regions with weak cues. Such a method is especially
    applicable in stereo algorithms, because they often rely on some smoothness constraint
    that justifies cue propagation'
  merge: -1
  img_proc: true
