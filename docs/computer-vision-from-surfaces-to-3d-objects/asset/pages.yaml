    # 1.5  STATISTICAL INFERENCE FOR DEPTH INFERENCE


    The approach described above shows the limits of what is possible using only second-order
    linear statistics. The study of these simple models is important, because it helps
    us to understand the statistical relationships that exist between shape and appearance.
    However, simple linear systems capture only a fraction of what is achievable using
    a complete statistical inference framework. The problem of inferring a 3D shape
    from image cues is both highly complex and highly underconstrained: for any given
    2D image, there are countless plausible 3D interpretations of that scene. Our
    goal is to find solutions that are especially likely. Powerful statistical methods
    will be necessary to achieve these goals. In this section, we discuss the use
    of modern statistical inference techniques for inferring a 3D shape from images.


    In recent years, there has been a great deal of progress made in computer vision
    using graphical models of large joint probability distributions (Fei-Fei and Perona,
    2005; Freeman et al., 2000; Sun et al., 2003; Tang et al., 2005; Torralba et al.,
    2003; Zhu and Tu, 2002). Graphical models offer a powerful framework to incorporate
    rich statistical cues from natural scenes and can be applied directly to the problem
    of depth inference. Bayesian inference of shape (depth) $Z$ from images $I$ involves
    estimating properties of the posterior distribution $P(Z \mid I)$. The dimensionality
    of the posterior distribution $P(Z \mid I)$, however, is far too great to model
    directly. An important observation relevant to vision is that the interdependency
    of variables tends to be relatively local. This allows the factorization of the
    joint distribution into a product of “potential functions,” each of lower dimensionality
    than the original distribution (as shown in Figure 1.6). In other words,


    $$P(I,Z) \propto \prod_a \phi_a(\vec{x}_a) \tag{1.8}$$


    where $\vec{x}_a$ is some subset of variables in $I$ and $Z$. Such a factorization
    defines an example of a graphical model known as a “factor graph”: a bipartite
    graph with a set of variable nodes (one for each random variable in the'
  merge: -1
