  md: '# Admissible Curvature Space


    A mesh $\Sigma$ with edge weight $\Phi$ is called a *weighted mesh*, which is
    denoted as $(\Sigma,\Phi)$. In the following, we want to clarify the spaces of
    all possible circle packing metrics and all possible curvatures of a weighted
    mesh. Let the vertex set be $V=\{v_1,v_2,\ldots,v_n\}$, and the radii be $\mathbf
    r=\{r_1,r_2,\ldots,r_n\}$. Let $u_i$ be


    $$u_i=\begin{cases}\log r_i & \mathbb E^2\\[2pt]\log\tanh\dfrac{r_i}{2} & \mathbb
    H^2\\[2pt]\log\tan\dfrac{r_i}{2} & \mathbb S^2\end{cases} \tag{4.24}$$


    where $\mathbb E^2$, $\mathbb H^2$, and $\mathbb S^2$ indicate the background
    geometry of the mesh. We represent a circle packing metric on $(\Sigma,\Phi)$
    by a vector $\mathbf u=(u_1,u_2,\ldots,u_n)^T$. Similarly, we represent the Gaussian
    curvatures at mesh vertices by the curvature vector $\mathbf k=(K_1,K_2,\ldots,K_n)$.
    All the possible $\mathbf u$''s form the *admissible metric space*, and all the
    possible $\mathbf k$''s form the *admissible curvature space*.


    According to the Gauss–Bonnet theory (Equation [4.23]), the total curvature must
    be $2\pi\chi(\Sigma)$, and therefore the curvature space is $n-1$ dimensional.
    We add one linear constraint to the metric vector $\mathbf u$, $\sum u_i=0$, for
    the normalized metric. As a result, the metric space is also $n-1$ dimensional.
    If all the intersection angles are acute, then the edge lengths induced by a circle
    packing satisfy the triangle inequality. There is no further constraint on $\mathbf
    u$. Therefore, the admissible metric space is simply $\mathbb R^{n-1}$.


    A curvature vector $\mathbf k$ is *admissible* if there exists a metric vector
    $\mathbf u$ that induces $\mathbf k$. The admissible curvature space of a weighted
    mesh $(\Sigma,\Phi)$ is a convex polytope, specified by the following theorem.
    The detailed proof can be found in Chow and Luo (2003).


    # Theorem 4.4


    *Suppose* $(\Sigma,\Phi)$ is a weighted mesh with Euclidean background geometry,
