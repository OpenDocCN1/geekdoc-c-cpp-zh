- pgno: 137
  md: 'It follows that if one is interested in studying the role of *a priori* constraints
    in visual perception, one should use distal stimuli that are as different from
    their retinal images as possible. This naturally implies that the distal stimuli
    should be 3D objects or images of 3D objects. In such cases, the visual system
    will have to solve a difficult inverse problem, and the role of constraints can
    be easily observed. If 2D images are distal stimuli, as in the case of examples
    in Figures 6.1, 6.2, and 6.3, *a priori* constraints may or may not be involved
    depending on whether the visual system “tries” to solve an inverse problem. As
    a result, the experimenter may never know which, if any, constraints are needed
    to explain a given percept. Furthermore, veridicality and constancy of the percept
    are poorly, if at all, defined with such stimuli. Also, if effective constraints
    are not applied to a given stimulus, then the inverse problem remains ill posed
    and ill conditioned. This means that the subjects’ responses are likely to vary
