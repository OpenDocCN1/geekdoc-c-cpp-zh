  md: 'effect on the discriminability of the location of the Gaussian, as long as
    the intersample spacing was beyond the 3 arc min range of the local filters. Kontsevich
    and Tyler (1998) validated the surprisingly local prediction of this limit, finding
    that localization performance was invariant for spacing ranging from 30 down to
    3 arc min separation, but showed a stepwise improvement (to Vernier levels) once
    the sample spacing came within the 3 arc min range. Sample positions were randomized
    to prevent them from being used as the position cue.


    The implication to be drawn from this study is that some long-range interpolation
    mechanism is required to determine the shape of extended objects before us (because
    the position task is a form of shape discrimination). The ability to encode shape
    is degraded once the details fall outside the range of the local filters. However,
    the location was still specifiable to a much finer resolution than the sample
    spacing, implying the operation of an interpolation mechanism to determine the
    location of the peak of the Gaussian despite the fact that it was not consistently
    represented within the samples.


    The conclusions from this work are that (1) the interpolation mechanism was inefficient
    for larger sample numbers, because it used information from only two to three
    samples even though up to 10 times as many samples were available; (2) the interpolation
    mechanism could operate over the long range to determine the shape and location
    of the implied object to a substantially higher precision than the spacing of
    the samples (~6 arc min); and (3) the mechanism was not a simple integrator over
    the samples within any particular range.


    # EVIDENCE FOR A FUNCTIONAL ROLE

    OF 3D SURFACE REPRESENTATION


    Likova and Tyler (2003) addressed the unitary depth map hypothesis of object localization
