- pgno: 233
  md: '# The Perceptual Representation of 3D Shape 215


    ![](img/4d808358747f9096d24f831e5f9d8083_233_0.png)


    analysis of this type of polyhedral object (e.g., see Waltz, 1975; Winston, 1975;
    Biederman, 1987). A common form of representation employed in these analyses is
    focused exclusively on localized features of the depicted structure and their
    ordinal and topological relations (e.g., above or below, connected or unconnected).
    These features are typically of two types: point singularities called _vertices_,
    and line singularities called _edges_. The pattern of connectivity among these
    features is referred to mathematically as a graph.


    The first rigorous attempts to represent the structure of objects using feature
    graphs were developed in the 1970s by researchers in machine vision (e.g., Clowes,
    1971; Huffman, 1971, 1977; Mackworth, 1973; Waltz, 1975). An important inspiration
    for this early work was the phenomenological observation from pictorial art that
    it is possible to convey the full 3D shape of an object by drawing just a few
    lines to depict its edges and occlusion contours, thus suggesting that a structural
    description of these basic features may provide a potentially powerful representation
    of an object’s 3D structure. To demonstrate the feasibility of this approach,
    researchers were able to exhaustively catalog the different types of vertices
    that can arise in line drawings of simple plane-faced polyhedra, and then used
    that to label which lines in a drawing correspond to convex, concave, or occluding
    edges. Similar procedures were later developed to deal with'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'the occlusion contours of smoothly curved surfaces (Koenderink and van Dorn,
    1982; Koenderink, 1984; Malik, 1987).


    A closely related approach was proposed by Biederman (1987) for modeling the process
    of object recognition in human observers. Biederman argued that most namable objects
    can be decomposed into a limited set of elementary parts called *geons*, and that
    the arrangement of these geons can adequately distinguish most objects from one
    another, in much the same way that the arrangement of phonemes or letters can
    adequately distinguish spoken or written words. A particularly important aspect
    of Biederman’s theory is that the different types of geons are defined by structural
    properties, such as the parallelism or cotermination of edges, which remain relatively
    stable over variations in viewing direction. Thus, the theory can account for
    a limited degree of viewpoint invariance in the ability to recognize objects across
    different vantage points (see also Tarr and Kriegman, 2001).


    In principle, the edges in a graph representation can have other attributes in
    addition to their pattern of connectivity. For example, they are often labeled
    to distinguish different types of edges, such as smooth occlusion contours, or
    concave or convex corners. They may also have metrical attributes, such as length,
    orientation, or curvature. Lin Chen (1983, 2005) proposed an interesting theoretical
    hypothesis that the relative perceptual salience of these different possible edge
    attributes is systematically related to their structural stability under change,
    in a manner that is similar to the Klein hierarchy of geometries. According to
    this hypothesis, observers should be most sensitive to those aspects of an object’s
    structure that remain invariant over the largest number of possible transformations,
    such that changes in topological structure (e.g., the pattern of connectivity)
    should be more salient than changes in projective structure (e.g., straight versus
    curved), which, in turn, should be more salient than changes in affine structure
    (e.g., parallel versus nonparallel). The most unstable properties are metric changes
    in length, orientation, or curvature. Thus, it follows from Chen’s hypothesis
    that observers’ judgments of these attributes should produce the lowest levels
    of accuracy or reliability.


    There is some empirical evidence to support that prediction. For example, Todd,
    Chen, and Norman (1998) measured accuracy and reaction times for a match to sample
    task involving stereoscopic wire frame figures in which the foil could differ
    from the sample in terms of topological, affine, or metric structure. The relative
    performance in these three conditions was consistent with Chen’s predictions.
    Observers were most accurate'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/4d808358747f9096d24f831e5f9d8083_235_0.png)


    and had the fastest response times when the foil was topologically distinct from
    the sample, and they were slowest and least accurate when the only differences
    between the foil and standard involved metrical differences of length or orientation.
    A similar result was also obtained by Christensen and Todd (2006) using a same–different
    matching task involving objects composed of pairs of geons like those shown in
    Figure 11.4. Thresholds for different types of geometric distortions were measured
    as a function of the number of changed pixels in an image that was needed to detect
    that two objects had different shapes. The ordering of these thresholds was again
    consistent with what would be expected based on the Klein hierarchy of geometries
    (see also Biederman and Bar, 1999). Still other evidence to confirm this pattern
    of results was obtained in shape discrimination tasks of wire-frame figures that
    are optically specified by their patterns of motion (Todd and Bressan, 1990).


    The relative stability of image structure over changing viewing conditions is
    a likely reason why shape discrimination by human observers is primarily based
    on the projected pattern of an object’s edges and'
  merge: -1
  img_proc: true
- pgno: 236
  md: occlusion contours, rather than pixel intensities or the outputs of simple cells
    in the primary visual cortex. The advantage of edges and occlusion contours for
    the representation of object shape is that they are invariant over changes in
    surface texture or the pattern of illumination (e.g., see Figure 11.3), thus providing
    a greater degree of constancy. That being said, however, an important limitation
    of this type of representation as a model of human perception is that there are
    no viable theories at present of how these features could be reliably distinguished
    from other types of image contours that are commonly observed in natural vision,
    such as shadows, reflectance edges, or specular highlights. The solution to that
    problem is a necessary prerequisite for successfully implementing an edge-based
    representation that would be applicable to natural images in addition to simple
    line drawings.
  merge: -1
  img_proc: true
