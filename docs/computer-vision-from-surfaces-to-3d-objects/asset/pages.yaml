  md: 'visual system to correct for and anticipate the introduction of new shape information.


    Palmer, Kellman, and Shipley (2006) considered the requirements for spatiotemporal
    object formation. One important requirement is *persistence*: In order to be connected
    with fragments not yet visible, a momentarily viewed fragment must be represented
    after it becomes occluded. (See [Figure 10.11 at time *t*₀].) A second requirement
    is *position updating*. Not only must a previously viewed, moving fragment continue
    to be represented, its spatial position must be updated over time, in accordance
    with its previously observed velocity ([Figure 10.11 at time *t*₁].) Finally,
    previously viewed and currently viewed fragments are both utilized by processes
    of contour and surface interpolation, which connect regions across spatial gaps
    ([Figure 10.11 at *t*₂]). When new fragments of the object come into view, they
    are integrated with the persisting, position-updated


    ![](img/4d808358747f9096d24f831e5f9d8083_220_0.png)


    **FIGURE 10.11** Spatiotemporal interpolation processes. An object moves from
    left to right behind an occluder with two circular windows. At *t*₀, shape and
    motion information about visible regions of the rod are perceived. At *t*₁, the
    shape and current position of the occluded region of the rod are represented in
    the dynamic visual icon representation. At *t*₂, another portion of the rod becomes
    visible, and contour interpolation occurs between the occluded and visible regions.'
