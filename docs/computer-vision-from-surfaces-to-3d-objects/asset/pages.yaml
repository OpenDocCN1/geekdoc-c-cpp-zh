- pgno: 127
  md: 'In 3D reconstruction, we used two different smoothness constraints: one enforcing
    smooth disparity and one enforcing smooth elevation of visual surfaces. These
    constraints provide a way for automatic interpolation of information along the
    surface and also bias surface reconstruction to produce either fronto-parallel
    surface patches (disparity prior) or patches that are parallel to the ground plane
    (elevation prior). As can be seen in Figure 5.2, the reconstructed surfaces of
    a staircase have different shapes depending on a corresponding smoothness assumption.
    Two reconstructions look similar only at the locations where cues are strong (i.e.,
    have strong edges).


    Note that while a flattening method helps to obtain a dense surface representation,
    the form of representation in the areas with weak cues is affected by a smoothness
    constraint. Which reconstruction and corresponding smoothness constraint is better?
    There is no single answer to this question. The factors that influence a choice
    of a constraint include the structure of the environment, task requirements, and
    the compactness of a resulting representation (e.g., a number of disparity levels).


    To summarize, this section analyzed the information propagation method described
    by Coughlan in Chapter 3 of this book from a cue integration perspective. Specifically,
    we considered the case when strong cues are propagated across flat or slowly curving
    surfaces into the areas with weak or noisy cues. To guarantee that propagation
    is efficient, it was suggested that cue likelihoods that have only weak peaks
    should be flattened completely. This was justified under a probabilistic approach
    that considers a mixture of prior assumptions for each cue. For the purpose of
    finding a dense disparity map, stereo images were modeled as a mixture of two
    classes of objects: one that has strong edges and one with low-contrast intensities.
    Note that the first class of object is typically sparse in natural images and
    has strong cues; the second class of object is less sparse but has weaker cues.
    To define a prior probability of each class in a certain image location, one can
    use edge strength or directly analyze cue likelihood. While mixture of priors
    describes image properties, there is another class of priors that describe surfaces.
    This section analyzed the effect of two such priors (smoothness of elevation and
    disparity) on 3D reconstruction.


    # CUE INTERPRETATION FOR NONFLAT SURFACES


    So far we described how cues are integrated at a single location and how they
    can be propagated to different locations along a flat or slowly curving surface.
    In the general case of nonflat surfaces, we have to deal'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'with the fact that visual cues for some surface property may also depend on
    surface shape. To give an example, consider a texture foreshortening cue for slant.
    In the case of nonflat surfaces, this cue depends on both surface slant and shape.
    Thus, in order to interpret this cue in terms of slant, the effect of shape should
    be disentangled from the effect of slant. Furthermore, if several cues are present
    at the same location on a nonflat surface, they are no longer independent due
    to the explaining away phenomenon. For instance, different cues for slant can
    mutually depend on a surface shape. This violates the assumptions of linear cue
    combination theory and potentially can make cue integration a difficult problem.


    One of the solutions to this problem is given by a modular approach. Similar to
    the case of cue integration when each cue is processed independently by a separate
    module, we can assign separate modules for estimation of surface shape and slant.
    Then, in a slant module, for example, the information about shape would be represented
    with a fixed prior. A limited interaction would take place after estimation is
    finished, and modules exchange information in order to update their priors.


    Another observation that supports a modular approach is that cues for shape can
    be quite complicated and specific. Consider, for example, a shading cue for shape.
    This cue depends on the vector of light source direction, light spectrum, surface
    reflectance properties, and so forth. It is difficult to imagine a mechanism for
    interaction between this specific cue and the cues for surface slant. On the other
    hand, if shape is represented in a cue independent form (such as surface curvature)
    at the output of a shape-processing module, it would be much easier to incorporate
    such a representation into the interpretation of slant cues. Thus, a simplicity
    principle suggests that surface shape should be estimated in isolation and used
    for the proper interpretation and integration of surface cues. Moreover, according
    to principles described in the second section, shape information can be used to
    propagate sparse cues along nonflat surfaces. In other words, estimation of shape
    can help to automatically interpolate surface cues in locations where they are
    sparse.


    A perceptual mechanism for shape processing is yet to be studied, but we aim to
    establish whether or not the human visual system can use shape information to
    interpret surface cues properly. To investigate this issue, we conducted two psychophysical
    experiments that are described in detail in Ivanchenko (2006). These experiments
    used a slant discrimination task to analyze the role of shape cues on subject
    performance. The'
