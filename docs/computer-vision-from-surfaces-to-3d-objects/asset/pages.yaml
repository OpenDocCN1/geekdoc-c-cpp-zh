    # Surface Depth


    Color information is directly available at the receptor level, but depth is the
    dimension that is lost in the image and needs to be reconstructed by the system.
    Primates and many other species have a specific mechanism for this, using the
    disparity between the images of the two eyes, providing binocular stereopsis.
    Because disparity information derives from matching structures in two different
    images, which cannot be done in uniform image regions, stereoscopic information
    is characteristically sparse. In the case of a uniform square, for example, stereoscopic
    information is available from the edges but not the surface. Disparity can define
    the depth of the contour of the square but does not indicate whether the surface
    inside the contour is flat, convex, or concave, and if it is located at the depth
    of the contour or behind the contour. It could be an object in front, or a surface
    in back that is seen through a square window.


    The sparse representation of depth in the cortex is illustrated in Figure 8.4,
    where the top row shows the response profiles of three disparity selective neurons.
