- pgno: 116
  md: 'the visual system can interpret surface cues in at least two different ways:
    shape can be ignored (i.e., a planar approximation is used instead) or surface
    shape can be estimated beforehand to explain away the effect of shape on interpretation
    of visual cues.


    Numerous motor and visual tasks of everyday life require our visual system to
    operate with dense surface representations. Consider, for example, a simple task
    of placing a cup on a table. Even if a table surface has no texture and thus no
    visual cues for surface position and orientation, humans apparently have no difficulty
    in accomplishing the task. In this case, one can hypothesize that visual cues
    from a table border propagate across a table surface to help in the placing task.
    Note that situations when the visual system has to rely on sparse visual cues
    to build a dense surface representation are not rare. Apart from the lack of texture,
    a visual scene may have very few highly reliable and informative cues (e.g., originating
    from strong edges of regular shapes) that can be effectively used in the locations
    where cues are less informative. Such cue propagation should rely on prior knowledge
    about surface shape in order to interpolate information properly.


    The most realistic scenario for cue propagation is when a visual surface is flat
    or slowly curving and has a known orientation. For nonflat surfaces, cue interpretation
    depends on surface shape. Although most of the previous research focused either
    on flat surfaces or surfaces with only one principle direction of curvature (e.g.,
    cylinders), this chapter considers a more general case of nonflat surfaces. Specifically,
    it explores a case of cue integration when visual cues depend on both slant and
    shape of visual surfaces.


    In the first section, I briefly review a cue integration framework that is used
    to estimate properties of visual scenes and visual surfaces in particular. Cue
    integration considers evidence from a single location, but cue propagation uses
    (interpolates) evidence from multiple locations to compensate for the absence
    or weakness of visual cues. A method for detection of weak cues and facilitation
    of information propagation to corresponding locations is discussed in the second
    section. The third section focuses on nonflat surfaces and considers a hypothesis
    that shape estimation precedes cue interpretation. We report the findings of two
    psychophysical experiments that suggest that shape cues participate in the interpretation
    of slant cues.'
