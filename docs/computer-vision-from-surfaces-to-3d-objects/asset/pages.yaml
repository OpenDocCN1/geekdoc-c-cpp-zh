  md: '# INTRODUCTION


    We present a new mathematical model of the visual cortex, which takes into account
    and integrates geometric and probabilistic aspects.


    From a geometric point of view, the cortex has been recently described as a noncommutative
    Lie group, equipped with a sub-Riemannian metric (Hoffman, 1989; Ben Shahar and
    Zucker, 2003; Bressloff et al., 2001; Citti and Sarti, 2006; Franken et al., 2007;
    Petitot and Tondut, 1999). The associated Lie algebra is generated by two vector
    fields that have integral curves in perfect agreement with the shape of association
    fields of Field, Hayes, and Hess (1993), neurally implemented by the horizontal
    connectivity of the visual cortex.


    The simple cells are able to extract position and orientation of boundaries (i.e.,
    position and momentum variables); therefore, in Sarti, Citti, and Petitot (2008),
    the structure of the cortex has been identified with a symplectic space, which
    in turn can be interpreted as the phase space of the retinal plane. The elements
    of this phase space are operators and, in particular, the generators of the group.
    Then the cortical manifold is formally equivalent to the phase space in quantum
    field theory.


    A similar point of view was already implicitly taken by Daugmann (1985), when
    he proposed to use the minima of the classical Heisenberg uncertainty principle
    to model receptive profiles. Here we prove a similar uncertainty principle, but
    we directly deduce it from the noncommutativity of the geometrical structure.
    The minima of the principle are functions able to detect position and orientation
    with the smallest uncertainty; they are called *coherent states*.


    The natural mapping from a world space to its phase space is performed by the
    Bargmann transform obtained via convolution with the coherent states. Then it
    will be shown that the action of the simple cells, which is exactly a convolution
    with the receptive filters, performs such a transform. The norm of the output
    of the simple cells is generally interpreted as an energy function, always positive,
    output of the complex cells. Hence, the norm of the Bargmann transform, suitably
    normalized, will be considered as a probability measure. Consequently, to the
    image it is associated a natural operator to account for probability distribution,
    that is, the density operator (Carmichael, 2002).


    This approach is in agreement with the probabilistic model proposed by Mumford
    (1994) and further exploited in August and Zucker (2003); Duits and Franken (2007);
    Franken, Duits, and ter Haar Romeny (2007);'
