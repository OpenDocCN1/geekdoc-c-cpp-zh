- pgno: 192
  md: 'processed exclusively through the depth interpretation. Once the depth interpretation
    is nulled by the disparity signal, the luminance information does not support
    position discrimination (null point in the solid curve in Figure 9.5).


    This evidence suggests that depth surface reconstruction is the key process in
    the accuracy of the localization process. It appears that visual patterns defined
    by different depth cues are interpreted as objects in the process of determining
    their location.


    Evidently, the full specification of objects in general requires extensive interpolation
    to take place, even though some textured objects may be well defined by local
    information alone. The interpolated position task may therefore be regarded as
    more representative of real-world localization of objects than the typical Vernier
    acuity or other line-based localization tasks of the classic literature. It consequently
    seems remarkable that luminance information, per se, is unable to support localization
    for objects requiring interpolation. The data indicate that it is only through
    the interpolated depth representation that the position of the features can be
    recognized. One might have expected that positional localization would be a spatial
    form task depending on the primary form processes (Marr, 1982). The dominance
    of a depth representation in the performance of such tasks indicates that the
    depth information is not just an overlay to the 2D sketch of the positional information.
    Instead, it seems that a full 3D depth reconstruction of the surfaces in the scene
    must be completed before the position of the object is known.


    A promising paradigm for studying the surface interpolation process is to use
    a circular version of the sampled-shape task of Likova and Tyler (2003), with
    targets that are Gaussian bulges defined by disparity (Figure 9.6), luminance,
    or motion cues. The samples may be in the form of a random-dot pattern constrained
    (Figure 9.6b) to a minimum dot spacing of half the average dot spacing (in all
    directions). Thus, the samples carrying the luminance, disparity, and motion information
    will always be separated by a defined distance, preventing discrimination by local
    filter processing. The shape/position/orientation information therefore has to
    be processed by some form of interpolation mechanism. Varying the luminance of
    the sample points of the type of Figure 9.6b in the same Gaussian shape generates
    the equivalent luminance figure, and such sampled figures can be used to generate
    the equivalent figure for structure-from-motion (cf, Regan and Hamstra, 1991,
    1994; Regan, Hajdur, and Hong, 1996).'
