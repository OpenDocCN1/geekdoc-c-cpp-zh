    # ## THE SURFACE CORRESPONDENCE PROBLEM


    There has recently been substantial interest in the mechanism by which the motion
    of a surface defined purely by disparity cues is appreciated (Patterson, 1999,
    2002; Lu and Sperling, 1995, 2001). For spatiotemporal structure of a stereoscopic
    surface, there is a fundamental ambiguity about how the surface at one time has
    transformed toward the surface at a later time. For example, did it move laterally,
    did it move in depth, or did it move in some combination of the two? This is what
    we term the _surface correspondence problem_, a global 4D (i.e., 3D spatiotemporal)
    generalization of the local correspondence problem (see Figure 9.5): what principle
    defines which point on the later surface corresponds to a given point on the surface
    at the earlier time? Much of recent computational neuroscience has been driven
    by two correspondence problems: (1) the binocular correspondence problem highlighted
    by Julesz (1971) and (2) its temporal counterpart of the motion correspondence
    problem delimited by the “Braddick limit” (Braddick, 1974). The temporal case
    generalizes to the aperture problem of local correspondence over time in motion
    analysis (Marr, 1982), with its solution via the intersection-of-constraints rule,
    an instantiation of the rigidity constraint. To these seminal problems we now
    add the _surface correspondence problem_, a meld of the stereo and motion correspondence
    problems, but one that operates at the next level of the processing hierarchy.


    Thus, the surface correspondence problem is logically independent from, but interacts
    with, the two lower-level correspondence problems to achieve with a global 4D
    solution. We expect identification of this problem to achieve to start a new series
    of investigations of constraints underlying its global solution to the perceived
    dynamics of 3D surface transformations. In particular, there is an ambiguity between
    the rigid lateral (x-axis) motion of a stereoscopically defined surface (Figure
    9.9a) and the nonrigid set of local motions for the same scale surface replacement
    if the correspondence matching were defined by motion orthogonal to the surface
    structure (as depicted in Figure 9.9b) for sinusoidal cyclopean surfaces. Our
    preliminary data suggest that if a stereoscopic sinusoid is alternated between
    two nearby phases, we may expect to perceive it as moving laterally in a _globally_
    rigid solution (Figure 9.9a), despite the fact that the nearest neighbor rule
    would imply nonrigid shape change (Figure 9.9b; the nearest neighbor'
