  md: 'From our statistical study, we now know that fine details in \( K = ZI^*/II^*
    \) do not generalize across scales, as was assumed by shape recipes. However,
    the coarse structure of \( K \) roughly follows a 1/r power law. We can exploit
    this statistical trend directly. We can simply estimate \( B_K(\theta) \) using
    the low-resolution range image, use the 1/r power law to extrapolate \( K \approx
    B_K(\theta)/r \) into the higher spatial frequencies, and then use this estimate
    of \( K \) to reconstruct the high-frequency range data. Specifically, from the
    low-resolution range and intensity image, we compute low-resolution spectra of
    \( ZI^* \) and \( II^* \). From the highest frequency octave of the low-resolution
    images, we estimate \( B_{II}(\theta) \) and \( B_{ZI}(\theta) \). Any standard
    interpolation method will work to estimate these functions. We chose a \( cos^3(\theta
    + \pi\phi/4) \) basis function based on steerable filters (Adelson and Freeman,
    1991). We now can estimate the high spatial frequencies of the range image, z.
    Define


    where \( F_{low} \) is the low-pass filter that filters out the high spatial frequencies
    of z where depth information is either unreliable or missing.


    Because our model is derived from scene statistics and avoids some of the mistaken
    assumptions in the original shape recipe model, our extension provides a twofold
    improvement over Freeman and Torralba’s original approach (2003), while using
    far fewer parameters. Figure 1.5 shows an example of the output of the algorithm.


    This power law–based approach can be viewed as a statistically informed generalization
    of a popular shape-from-shading algorithm known as _linear shape from shading_
    (Pentland, 1990), which remains popular due to its high efficiency. Linear shape
    from shading attempts to reconstruct 3D cues from a single image using Equation
    (1.5) alone, ignoring shadow cues and the da Vinci correlation. As mentioned previously,
    the da Vinci correlation is a product of cast shadows, complex 3D surfaces, diffuse
    lighting, and lighting interreflections. All four of these image formation phenomena
    are exceptionally cumbersome to invert in a deterministic image formation model,
    and subsequently, they have been ignored by most previous depth inference algorithms.
    However, taken together, these phenomena produce a simple statistical relationship
    that can be exploited using highly efficient linear algorithms such as Equation
    1.7. It was not until the statistics of natural range and intensity images were
    studied empirically that the strength of these statistical cues was made clear.'
