  md: 'This chapter is intended to present the basic principles of this framework
    (which generalize to any 3D reconstruction problem, not just two-frame stereo)
    to an audience of vision researchers who are not computer vision specialists.
    I discuss recent extensions incorporating more realistic modeling of surface geometry,
    and point to recent work suggesting the possibility that belief propagation (or
    something close to it) may be realized in a biologically plausible form. Finally,
    I suggest possible directions for future research.


    # MARKOV RANDOM FIELDS FOR STEREO


    In this section, we outline a simple MRF (Markov random field) formulation of
    stereo, which we describe using a Bayesian model. (Other statistical variants
    such as conditional random fields (Lafferty, McCallum, and Pereira, 2001; Scharstein
    and Pal, 2005), which we mention below, are popular alternatives that are similar.)
    We are given two grayscale images $L$ and $R$ (left and right), which are assumed
    rectified so that a pixel in one image is guaranteed to match a pixel in the same
    row in the other image. The unknown disparity field is represented by $D$, with
    $D_r$ representing the disparity at pixel location $r$. A particular disparity
    value $D_r$, where $r=(x,y)$, has the following interpretation: $(x+D_r,y)$ in
    the left image corresponds to $(x,y)$ in the right image.


    We define a prior on the disparity field $D$ that enforces smoothness:


    $$P(D)=\frac{1}{Z}e^{-\beta V(D)}$$  (3.1)


    where $Z$ is a normalizing constant ensuring that $P(D)$ sums to 1 over all possible
    values of $D$, $\beta$ is a positive constant that controls the peakedness of
    the probability distribution (which in turn determines the importance of the prior
    relative to the likelihood, discussed below), and


    $$V(D)=\sum_{\langle rs\rangle} f(D_r,D_s)$$  (3.2)


    where the sum is over all neighboring pairs of pixels $r$ and $s$. Here, $f(D_r,D_s)$
    is an energy function that penalizes differences between disparities in neighboring
    pixels, with higher energy values corresponding to more severe penalties. (In
    other words, nonzero values of the first derivative of'
