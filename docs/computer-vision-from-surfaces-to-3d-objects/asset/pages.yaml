  md: 'But, discriminating small regions on the basis of their overall flow is difficult.


    b. 3D approaches that identify clusters with consistent 3D motion (Adiv, 1985;
    Costeira and Kanade, 1995; Nelson, 1991; Sinclair, 1993; Thompson and Pong, 1990;
    Torr and Murray, 1994; Zhang et al., 1988) using a variety of techniques. Some
    techniques, such as (Weber and Malik, 1997), are based on alternate models of
    image formation. These additional constraints can be justified for domains such
    as aerial imagery. In this case, the planarity of the scene allows a registration
    process (Ayer et al., 1994; Triggs et al., 2000; Wiles and Brady, 1995; Zheng
    and Chellapa, 1993), and uncompensated regions correspond to independent movement.


    This idea has been extended to cope with general scenes by selecting models depending
    on the scene complexity (Torr et al., 1998), or by fitting multiple planes using
    the plane plus parallax constraint (Irini and Anandan, 1998; Sawney et al., 2000).
    Most techniques detect independently moving objects based on the 3D motion estimates,
    either explicitly or implicitly. Some utilize inconsistencies between egomotion
    estimates and the observed flow field, while some utilize additional information
    such as depth from stereo, or partial egomotion from other sensors. The central
    problem faced by all motion-based techniques is that, in general, it is extremely
    difficult to uniquely estimate 3D motion from flow. Several studies have addressed
    the issue of noise sensitivity in structure from motion. In particular, it is
    known that for a moving camera with a small field of view observing a scene with
    insufficient depth variation, translation and rotation are easily confused (Adiv,
    1989).


    # 2.3 FIXATION-BASED SEGMENTATION


    Since the early attempts on Active Vision (Aloimonos et al., 1988; Bajcsy, 1988;
    Christensen and Eklundh, 2000), there has been a lot of work completed on problems
    surrounding fixation, both from computational and psychological perspectives (Pahlavan
    et al., 1996). Despite all this development, however, the operation of fixation
    never really made it into the foundations of computational vision. Specifically,
    the fixation point has not been a parameter in the multitude of low- and middle-level
    computer vision algorithms.'
