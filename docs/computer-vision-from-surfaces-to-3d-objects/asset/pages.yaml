  md: '# 2.1 INTRODUCTION


    Segmenting a scene (or image) into regions is an important step in visual processing.
    The regions are more discriminative than the individual pixels and fewer in number
    than the total number of pixels. This makes regions better suited and computationally
    less expensive to use for high-level visual processing like tracking, recognizing
    objects, and three-dimensional (3D) reconstruction. But to make segmentation an
    essential first step of vision algorithms, the segmentation algorithm needs to
    be consistent in its output and should not require any user input.


    Let us give a state-of-the-art example to explain what it means for a segmentation
    algorithm to be fully automatic and consistent. We consider only a single image
    here shown in Figure 2.1a, but our analysis is not restricted to single images
    only. Most segmentation algorithms amount to statistical


    ![](img/4d808358747f9096d24f831e5f9d8083_49_0.png)


    ![](img/4d808358747f9096d24f831e5f9d8083_49_1.png)


    (a)


    (b)


    ![](img/4d808358747f9096d24f831e5f9d8083_49_2.png)


    (c)


    **FIGURE 2.1** *(See color insert following p. 94.)* Segmentation results by Jianbo
    Shi and Jitendra Malik (2000) for the image (a) for the two cases when a number
    of regions are chosen to be 10 and 60, as shown in (b) and (c), respectively.
    If the trees are the object of interest, the segmentation in (b) is suitable,
    whereas if the horse is of interest, then the segmentation given in (c) is more
    suitable.'
