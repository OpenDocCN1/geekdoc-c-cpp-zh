  md: '(\(\sigma_{shad}\)) conditions can be used to calculate the expected linear
    threshold (\(\sigma_{linear}\)) in a combined condition:


    \[\frac{1}{\sigma_{linear}^{2}}=\frac{1}{\sigma_{tex}^{2}}+\frac{1}{\sigma_{shad}^{2}}\tag{5.7}\]


    Note that such a rule is applicable only if the visual system ignores the shape
    (e.g., a planar approximation is used instead). If the visual system uses shape
    estimates to inform the estimation of slant, the linear rule is suboptimal. This
    is because the linear rule applied to slant discrimination describes the integration
    of two slant cues but ignores their interaction with shape cues. Optimally, in
    combined cue condition, the overall accuracy of shape estimation increases and
    can further improve slant estimation given that these processes interact. We found
