    # INTRODUCTION


    At the early processing stages in visual cortex, information is laid out in the
    form of maps of the retinal image. However, contrary to intuition, uniform surfaces
    are not mapped by uniform distributions of neural activity. We can perceive the
    three-dimensional (3D) shape of a uniform surface, but stereoscopic neurons are
    activated only by the contours of the surface, not the uniform interior. We perceive
    a uniform color figure, but color-selective neurons respond about five times less
    to the interior of the figure than to its boundaries. How cortical neurons signal
    contour and surface features is well known, but we do not yet understand how the
    brain “organizes” these feature signals to represent surfaces and objects. In
    this'
