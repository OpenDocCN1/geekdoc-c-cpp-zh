  md: '# Discrete Gauss–Bonnet Theorem


    The Gauss–Bonnet theorem (Equation [4.2]) states that the total curvature is a
    topological invariant. It still holds on meshes as follows:


    $$\sum_{v_i\in V} K_i + \lambda \sum_{f_j\in F} A_i = 2\pi\chi(M) \tag{4.23}$$


    where $A_i$ denotes the area of face $f_i$, and $\lambda$ represents the constant
    curvature for the background geometry: +1 for the spherical geometry, 0 for the
    Euclidean geometry, and −1 for the hyperbolic geometry.


    # Discrete Conformal Deformation


    Conformal metric deformations preserve infinitesimal circles and the intersection
    angles among them. The discrete conformal deformation of metrics uses circles
    with finite radii to approximate the infinitesimal circles.


    The concept of the circle packing metric was introduced in 1976 by Thurston (see
    Thurston, 1980) as shown in Figure 4.4. Let $\Gamma$ be a function defined on
    the vertices, $\Gamma: V\to\mathbb{R}^+$, which assigns a radius $\gamma_i$ to
    the vertex $v_i$. Similarly, let $\Phi$ be a function defined on the edges, $\Phi:E\to[0,\pi/2]$,
    which assigns an acute angle $\Phi(e_{ij})$ to each edge $e_{ij}$ and is called
    a weight function on the edges. Geometrically, $\Phi(e_{ij})$ is the intersection
    angle of two circles centered at $v_i$ and $v_j$. The pair of vertex radius function
    and edge weight function on a mesh $\Sigma$, $(\Gamma,\Phi)$, is called a *circle
    packing metric* of $\Sigma$.


    ![](img/4d808358747f9096d24f831e5f9d8083_100_0.png)


    ![](img/4d808358747f9096d24f831e5f9d8083_100_1.png)


    **FIGURE 4.4**  Circle packing metric. (a) Flat circle packing metric. (b) Circle
    packing metric on a triangle.'
