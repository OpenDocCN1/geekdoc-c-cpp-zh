  md: 'to the brain or to artificial sensing systems, however, share none of these
    properties. The visual cues conveying the presence of objects may change in luminance
    or color, and they may be disrupted by reflections or occlusion by intervening
    objects as the view point changes. The various cues such as shading, texture,
    color binocular disparity, edge structure, and motion vector fields may even carry
    inconsistent object information. As exemplified by the dodecahedron drawn by Leonardo
    da Vinci (Figure 9.1a), any of these cues may be sparse, with a lack of information
    about the object structure across gaps where cues are missing. Also, any cue may
    be variable over time. Nevertheless, despite the sparse, inconsistent, and variable
    nature of the local cues, we perceive solid, three-dimensional (3D) objects by
    interpolating the sparse depth cues into coherent spatial structures generally
    matching the physical configuration of the objects.


    In the more restricted domain of the surface structure of objects in the world,
    surfaces are perceived not just as flat planes in two dimensions, but as complex
    manifolds in three dimensions. Here we are using “manifold” in the sense of a
    continuous two-dimensional (2D) subspace of the 3D Euclidean space. A compelling
    example of perceptual surface completion,


