  md: 'Finally, consider the case of images of models of human bodies. Note that two
    of the three human models are asymmetric. The skeletons of humans were marked
    by hand, and the symmetric parts of skeletons were manually identified, as in
    the previous demos. Marking skeletons was no more difficult than marking contours
    in synthetic images. The most interesting aspect of this demo is the recovery
    of asymmetric human bodies. The human body is symmetric in principle, but due
    to changes in the position and orientation of limbs, the body is not symmetric
    in 3D. Interestingly, our model is able to recover such 3D asymmetric shapes.
    The model does it by first correcting the 2D image (in the least squares sense)
    so that the image is an image of a symmetric object. Then, the model recovers
    the 3D symmetric shape and uncorrects the 3D shape (again, in the least squares
    sense), so that the 3D shape is consistent with the original 2D image (Sawada
    and Pizlo, 2008a; Sawada, 2010). The recovered 3D shape is not very different
    from the true 3D shape and from the perceived 3D shape.


    # SUMMARY AND DISCUSSION


    We described the role of 3D mirror symmetry in the perception of 3D shapes. Specifically,
    we considered the classical problem of recovering 3D shapes from a single 2D image.
    Our computational model can recover the 3D structure (shape) of curves and contours
    whose 2D image is identified and described. Finding contours in a 2D image is
    conventionally referred to as a figure–ground organization. The 3D shape is recovered
    quite well, and the model’s recovery is correlated with the recovery produced
    by human observers. Once the 3D contours are recovered, the 3D surfaces can be
    recovered by interpolating the 3D contours (like wrapping the 3D surfaces around
    the 3D contours) (Pizlo, 2008; Barrow and Tenenbaum, 1981). It follows that our
    model is quite different from the conventional, Marr-like approach. In the conventional
    approach, 3D visible surfaces (2.5D sketch) were reconstructed first. Next, the
    “2.5D shape” was produced by changing the reference frame from viewer centered
    to object centered. But does a 2.5D representation actually have shape? Three-dimensional
    shape refers to spatially global geometrical characteristics of an object that
    are invariant under rigid motion and size scaling. However, 3D surfaces are usually
    described by spatially local features such as bumps, ridges, and troughs. Surely,
    specifying the 3D geometry of such surface features does say something about shape,
    but spatially local features are not shapes. Spatially local features have to
    be related (connected) to one another to form a “whole.” Three-dimensional symmetry
    is arguably the best, perhaps even the only'
