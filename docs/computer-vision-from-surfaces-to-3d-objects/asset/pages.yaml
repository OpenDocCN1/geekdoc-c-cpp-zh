- pgno: 11
  md: 'conceptualized as the reciprocal of the radius of curvature for the circle
    tangent to the curve of the surface at this point. For a cut at some angle $\theta$
    in the tangent plane:


    $$\kappa_\theta = \frac{1}{r_\theta} \tag{0.1}$$


    As $\theta$ rotates around the point, it describes a curvature function for the
    surface. Any point on a smooth surface has only one maximum and one minimum direction
    of curvature, and the directions of maximum and minimum curvature are always at
    right angles to each other in the tangent plane. Gauss defined these extrema as
    the *principal curvatures* for that point in the surface:


    $$\kappa_1 = \max(\kappa_\theta) \quad \kappa_2 = \min(\kappa_\theta) \tag{0.2}$$


    where


    $$\theta_{\kappa_2} = \theta_{\kappa_1} \pm \frac{\pi}{2}$$


    The principal curvatures at every point are the fundamental intrinsic properties
    of the surface. The intrinsic 2D curvature is now known as the Gaussian curvature,
    $K$, given by the product of the two principal curvatures:


    $$K = \kappa_1 \cdot \kappa_2 \tag{0.3}$$


    ![](img/4d808358747f9096d24f831e5f9d8083_11_0.png)


    **FIGURE 0.3**  Surface curvature. At a local point on any surface, there are
    orthogonal maximum and minimum curvatures whose tangents (dashed lines) define
    a local coordinate frame on which the surface normal (thick line) is erected.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'If a surface is intrinsically flat, like a sheet of paper, it can never be
    curved to a form with intrinsic curvature, such as the surface of a sphere. Even
    if the flat sheet is curved to give the curvature in one direction a positive
    value, the curvature in the other (minimal) direction will be zero (like a cylinder).
    Hence, the product forming the Gaussian curvature (Equation 0.3) will remain zero.
    For any point of a sphere (or any other convex form), however, both the maximum
    and the minimum curvatures will have the same sign, and $K$ will be positive everywhere
    on the surface.


    When Gaussian curvature is applied to objects, one issue that arises is that the
    value of $K$ varies as an object changes in size. As a measure of shape, this
    is an undesirable property, because we think of a sphere, for example, as having
    the same shape regardless of its size. One option that may be suggested to overcome
    this problem is to normalize the local Gaussian curvature $K$ to the global mean
    curvature of the surface of an object $\hat{H}$ (see Equation 0.4) to provide
    a measure of the normalized Gaussian curvature $K_{\mathrm{norm}}$. Objects meaningfully
    exist only when the mean curvature $\hat{H}>0$, so this should be considered as
    a restriction on the concept of normalized Gaussian curvature (i.e., an isolated
    patch of surface with $\hat{H}\leq 0$) is solely a mathematical construct that
    cannot be a real object). Normalized Gaussian curvature is thus expressed in polar
    angle coordinates with respect to the center of the object, $\Theta$, and is defined
    as


    $$K_{\mathrm{norm}}(\Theta)=K(\Theta)/\hat{H},\qquad \hat{H}>0 \tag{0.4}$$


    where the mean curvature $H=(\kappa_1+\kappa_2)/2$, and global mean curvature
    is the integral of the local mean curvature over all angles with respect to its
    center $\hat{H}=\int H\,d\Theta$.


    Thus, $K_{\mathrm{norm}}=1$ for spheres of all radii, rather than varying with
    radius as does $K$, forming a map in spherical coordinates that effectively encodes
    the shape of the object with a function that is independent of its size. Regions
    where the local Gaussian curvature matches the global mean Gaussian curvature
    will have $K_{\mathrm{norm}}=1$, and regions that are flat like the facets of
    a crystal will have $K_{\mathrm{norm}}=0$, with high values where they transition
    from one facet to the next.


    Another shape property of interest is mean curvature, defined as the mean of the
    two principal curvatures. Constant mean curvature specifies a class of surfaces
    in which $H$ is constant everywhere. In the limiting case, the mean curvature
    is zero everywhere, $H=0$. This is the tendency exhibited by surfaces governed
    by the self-organizing principle of molecular surface tension, like soap films.
    The surface tension within the film operates to minimize'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the curvature of the surface in a manner that is defined by the perimeter to
    which the soap bubble clings. In principle, the shapes adopted by soap films on
    a wire frame are minimal surfaces. Note that if **H** = 0, then **κ₁** = −**κ₂**
    and the Gaussian curvature product is negative (or zero) throughout. Thus, minimal
    surfaces always have negative Gaussian curvature, meaning that they are locally
    saddle shaped with no rounded bulges or dimples of positive curvature. The surface
    tension principle operates to flatten any regions of net positive curvature until
    the mean curvature is zero.


    Until 1967, it was thought that there were only two minimal surfaces exhibiting
    the property of **H** = 0, the negative-curvature hypersphere and the imaginary-curvature
    hyperboloid. Since that time, a large class of such surfaces has been discovered.
    These are very interesting surfaces with quasi-biological resonances, suggesting
    that the minimal surface principle is commonly adopted (or approximated) in biological
    systems (Figure 0.4). Thus, the simple specification of **H** = 0 generates a
    universe of interesting surface forms that may be of relevance in neural processing
    as much as they are in biological form. The ubiquitous operation of lateral inhibition
    at all levels in the nervous system is a minimal principle comparable with surface
    tension. It is generally viewed as operating on a 2D function of the neural array
    in some tissue such as the retina or visual cortex. However, for any form of neural
    connectivity that is effectively 3D, lateral inhibition may well operate to form
    minimal surfaces of neural connectivity with conforming mathematical minimal surface
    principle (or its dynamic manifestation).


    A similar approach to this minimization for the 1D case over the domain Γ(x) has
    been proposed by Nitzberg, Mumford, and Shiota (1993) as minima of the elastic
    functional on the curvature **κ**:


    ```

    $$E = \int_{\Gamma}(\nu + \alpha\kappa^2)\,dx,$$  (0.5)

    ```


    where ν and α are constants.


    Using a sparse set of depth cues Φ, one may define a function $f : \mathbb{R}^3
    \to \mathbb{R}$ that estimates the signed geometric distance to the unknown surface
    S, and then use a contouring algorithm to extract the surface function approximating
    its zero set:


    ```

    $$Z(f) = \{S(\Phi) \in \mathbb{R}^3 : S(\Phi) = 0\}$$  (0.6)

    ```


