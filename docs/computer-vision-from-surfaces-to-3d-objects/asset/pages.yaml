- pgno: 54
  md: 'Rother et al., 2004; Yu and Shi, 2001) always segment the entire image into
    only two regions: foreground and background. The algorithm in (Boykov and Jolly,
    2001) poses the problem of foreground/background segmentation as a binary labeling
    problem that is solved exactly using the maxflow algorithm (Boykov and Kolmogorov,
    2004). It, however, requires users to label some pixels as foreground or background
    to build their color models. The algorithm in (Blake et al., 2004) improved upon
    (Boykov and Jolly, 2001) by using a Gaussian mixture Markov random field to better
    learn the foreground and background models. The algorithm in (Rother et al., 2004)
    requires users to specify a bounding box containing the foreground object. A seed
    point for every region in the image is required in (Arbelaez and Cohen, 2008).
    For foreground/background segmentation, at least two seed points are needed. Although
    these approaches give impressive results, they cannot be used as an automatic
    segmentation algorithm as they critically depend upon the user inputs. In (Yu
    and Shi, 2001), the algorithm tries to automatically select the seed points by
    using spatial attention-based methods and then uses these seed points to introduce
    extra constraints into their normalized cut-based formulation.


    The algorithms in (Bagon et al., 2008; Veksler, 2008) need only a single seed
    point from the user. That in (Veksler, 2008) imposes a constraint on the shape
    of the object to be a star, meaning the algorithm prefers to segment the convex
    objects. Also, the user input for this algorithm is critical, as it requires the
    user to specify the center of the star shape exactly in the image. The algorithm
    in (Bagon et al., 2008) needs only one seed point to be specified on the region
    of interest and segments the foreground region using a compositional framework.
    But the algorithm is computationally intensive. It runs multiple iterations to
    arrive at the final segmentation.


    # 2.2.1.2 *Contour-Based Methods*


    Contour-based segmentation methods start with finding edge fragments in the image
    first, and then joining the edge fragments to form closed contours. The regions
    are enclosed by each of these closed contours. Due to the presence of textures
    and low contrast regions in the image, detecting edge fragments is a problem.
    The second step of joining the edge fragments is done in probabilistic fashion
    using image statistics. In (Williams and Jacobs, 1997), the first-order Markov
    model is used for contour shape, and the contours were completed using random
    walk. In (Ren and Malik, 2002), multiple scales are used to join the contours
    using orientation and'
