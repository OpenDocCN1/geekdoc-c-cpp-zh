  md: 'such as visual, audio, and tactile (Ernst, Banks, and Bülthoff, 2000; Ernst
    and Banks, 2002; Battaglia, Jacobs, and Aslin, 2003).


    Mathematically, one can express cue independence as the product of conditional
    probabilities. In addition, one can rewrite a probability of a scene property
    $S$ conditioned on cue $I1$ and $I2$ according to a Bayesian rule. This allows
    inferences to be made about a scene property (a cause) from observed cues (the
    effect):


    $$P(S\mid I_1,I_2)=\frac{P(I_1,I_2\mid S)P(S)}{P(I_1,I_2)}\propto P(I_1\mid S)P(I_2\mid
    S)P(S)$$  (5.1)


    Here conditional probabilities on the right-hand side describe how cues $I1$,
    $I2$ are generated by a scene property $S$, and $P(S)$ specifies prior information
    about $S$. The denominator can be ignored because it is constant for a given scene.
    In the case of independent Gaussian noise, Equation (5.1) leads to a simple linear
    rule for cue integration (Cochran, 1937):


    $$\hat{S}=\omega_1\hat{S}_1+\omega_2\hat{S}_2$$  (5.2)


    Here, $\hat{S}_1,\hat{S}_2$ are the estimates of a scene property from individual
    cues; $\hat{S}$ is a combined cue estimate; and $\omega_1,\omega_2$ are cue weights.
    It can be shown that weights are inversely proportional to cue uncertainty (i.e.,
    variance of the noise) and that the uncertainty of a combined estimate is smaller
    than the uncertainty of any of its constituents. Cue uncertainty and, consequently,
    a cue weight change across visual conditions, and one of the important functions
    of the visual system is to adjust cue weights accordingly. When weights are known,
    Equation (5.2) provides a simple way to integrate estimates from individual cues
    to improve the overall accuracy of estimation.


    # Cue Conflict


    Because independence of visual cues is an approximation, the performance can be
    further improved if the perceptual system compensates for deviations from a linear
    rule. One of such nonlinearities, called a *cue conflict*, arises when cue estimates
    are too discrepant to be meaningfully combined. This discrepancy was initially
    explained by the presence of processing errors and outliers (Landy et al., 1995).
    To avoid the erroneous estimates, a weaker cue is down weighted or even dropped
    from cue combination. This makes cue integration robust to the presence of outliers.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Such heuristic treatment of a cue conflict was recently rationalized in a probabilistic
    Bayesian framework by associating a large cue conflict with incorrect prior assumptions
    (Knill, 2003, 2007). Prior assumptions (not to be mistaken with a prior probability
    of a scene property) are what make cues informative about a visual scene. For
    example, if one assumes that the world consists of circular objects, the aspect
    ratio of a projected circular outline would be a good cue for object orientation.
    However, if objects in the world have ellipsoidal outlines (less constrained prior),
    the strength of the aspect ratio cue would be greatly reduced. A key idea in this
    example is the assumption that the world consists of a mixture of circular and
    ellipsoidal objects.


    Under different viewing conditions, each class of objects may have different prior
    probabilities of occurrence. This can be modeled with a mixture of priors that
    specifies probabilities for each object class. Then, preferential attenuation
    of a cue during a conflict would be based on the evidence for each prior model.
    Mathematically, the mixture of priors for a cue likelihood describes how the cue
    is generated by different classes of objects:


    $P(I \mid S) = \pi_1 \times P(I \mid S, M_1) + \pi_2 \times P(I \mid S, M_2) \cdots$  (5.3)


    Here, the probabilities associated with each prior assumption $M_1, M_2$ are weighted
    by $\pi_1, \pi_2$ to form a full likelihood model for a cue $I$. The weights reflect
    the degree to which each prior assumption applies to a current environment. A
    large conflict provides evidence that an object was drawn from an ensemble with
    a less-constrained prior. According to Equation (5.3), a cue attenuation effect
    happens when a less-constrained prior dominates a mixture. Because a less-constrained
    prior entails a less informative cue, a cue weight goes down during a cue conflict.


    # Example of Robust Cue Integration


    In order to demonstrate some basic concepts of cue integration, I designed a simple
    visual example, shown in Figure 5.1. Here the shape of visual surfaces is represented
    by four cues: texture, shading, occlusion, and contour. Note that not all the
    cues are available at the same time. Particularly, at a small slant (top row)
    only texture and shading cues are present, while at a larger slant (bottom row)
    all four cues are present. The cues in the left column are consistent with the
    surface shape, and in order to demonstrate a cue conflict, the shading cue in
    the right column was made inconsistent with surface shape.'
