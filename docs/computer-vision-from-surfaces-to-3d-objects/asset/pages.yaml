  md: 'of the retinal image as light intensity or position could be measured by the
    visual system. It is less obvious how 3D shape can be measured on the retina.
    When we view a Necker cube monocularly, we see a cube. This percept cannot be
    a *direct* result of retinal measurement, because this 2D retinal image is actually
    consistent with infinitely many 3D interpretations. The only way to explain the
    percept is to assume that the visual system “selects” the simplest 3D interpretation.
    Surely, a cube, an object with multiple symmetries, is the simplest 3D interpretation
    of any of the 2D images of the cube (except for several degenerate views). Note
    also that a cube is a maximally compact hexahedron. That is, a cube is a polyhedron
    with six faces whose volume is maximal for a given surface area. Recall that both
    symmetry and compactness figured prominently in the writings of the Gestalt psychologists
    (Koffka, 1935).


    We now know that it is more adequate to “view” 3D shape perception as an inverse
    problem, rather than as a result of retinal measurements (Pizlo, 2001, 2008).
    The forward (direct) problem is represented by the retinal image formation. The
    inverse problem refers to the perceptual inference of the 3D shape from the 2D
    image. This inverse problem is ill posed and ill conditioned, and the standard
    (perhaps even the only) way to solve it is to impose *a priori* constraints on
    the family of possible 3D interpretations (Poggio, Torre, and Koch, 1985). In
    effect, the constraints make up for the information lost during the 3D to 2D projection.
    The resulting perceptual interpretation is likely to be veridical if the constraints
    represent regularities inherent in our natural world (natural world statistics).
    If the constraints are deterministic, one should use regularization methods. If
    the constraints are probabilistic, one should use Bayesian methods. Deterministic
    methods are closer to the concept of a Gestalt simplicity principle, whereas probabilistic
    methods are closer to the concept of a likelihood principle, often favored by
    empiricists. Interestingly enough, these two methods are mathematically equivalent,
    as long as simplicity is formulated as an economy of description. This becomes
    quite clear in the context of a minimum description length approach (Leclerc,
    1989; Mumford, 1996). The close relation between simplicity and likelihood was
    anticipated by Mach (1906/1959) and discussed more recently by Pomerantz and Kubovy
    (1986). Treating visual perception as an inverse problem is currently quite universal,
    especially among computational modelers. This approach has been used to model
    binocular vision, contour, motion, color, surface, and shape perception (for a
    review, see Pizlo, 2001).'
