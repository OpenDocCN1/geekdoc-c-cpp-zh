  md: '2D relatability. As in the 2D case, interpolated contours between 3D edges
    must be smooth, monotonic, and bend no more than 90°. Similarly, where 3D interpolated
    contours meet physically given edges, the orientations of the physically given
    part and the interpolated part must match.


    Formally, we define, for a given edge and any arbitrary point, the range of orientations
    that fall within the limits of relatability at that point. In the Cartesian coordinate
    system, let Θ be an angle in the x-y plane, and φ an angle in the x-z plane (for
    simplicity, in both cases zero degrees is the orientation parallel to the x-axis).
    Positioning one edge with orientation Θ = φ = 0 and ending at the point (0, 0,
    0), and positioning a second edge at (x,y,z) somewhere in the volume with x >
    0, the range of possible orientations (θ, φ) for 3D-relatable edges terminating
    at that point are given by


    $$\tan^{-1}\left(\frac{y}{x}\right) \leq \theta \leq \frac{\pi}{2} \tag{10.2}$$


    and


    $$\tan^{-1}\left(\frac{z}{x}\right) \leq \varphi \leq \frac{\pi}{2} \tag{10.3}$$


    As in the 2D case, we would expect quantitative variation in the strength of interpolation
    within these limits. The lower bounds of these equations express the absolute
    orientation difference (180° for two collinear edges ending in opposite directions)
    between the reference edge (edge at the origin) and an edge ending at the arbitrary
    point oriented so that its linear extension intersects the tip of the reference
    edge. The upper bounds incorporate the 90° constraint in three dimensions.


    How might the categorical limits implied by the formal definition of 3D relatability
