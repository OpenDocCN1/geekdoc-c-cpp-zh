    contours. The convex hull of a set of points is the smallest 3D region containing
    all the points in its interior or on its boundary. Again, it can be seen that
    the 3D shapes were recovered by the model accurately. Furthermore, the recovered
    3D shapes are essentially identical to the shapes perceived by the observer. Our
    3D shape recovery model seems to capture all the essential characteristics of
