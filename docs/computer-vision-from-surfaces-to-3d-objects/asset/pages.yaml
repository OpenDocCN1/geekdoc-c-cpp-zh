    of surfaces, it can also imply a restructuring of the perceived objects. Figure
    8.5c shows, on the left, four squares with rounded corners. On the right, the
    same squares are shown without the rounding. It can be seen that perception reorganizes
    the regions: two bars are now perceived instead of the four squares, and the center
    region that was ground before, now appears as a transparent overlay.


    The perceptual interpretations demonstrated in Figure 8.5 obviously involve the
    image context. For example, the edges marked by arrows in Figure 8.5c are locally
    identical in both configurations, but the assignment differs according to the
    context. Alteration of some details elsewhere in the display led to a new interpretation.


    The concepts of border ownership and figure–ground have been used in parallel
    in the literature to describe those perceptual phenomena. The power of the border
    ownership concept in interpreting and modeling the perceptual observations was
    recognized (Nakayama, Shimojo, and Silverman, 1989; Sajda and Finkel, 1995), but
