    # Smooth Surface Ricci Flow


    Suppose $S$ is a smooth surface with a Riemannian metric $\mathbf{g}$. The Ricci
    flow deforms the metric $\mathbf{g}(t)$ according to the Gaussian curvature $K(t)$
    (induced by itself), where $t$ is the time parameter:


    ```

    $$\frac{d g_{ij}(t)}{dt}=-2K(t)g_{ij}(t) \tag{4.17}$$

    ```


    There is an analogy between the Ricci flow and the heat diffusion process. Suppose
    $T(t)$ is a temperature field on the surface. The heat diffusion equation is $dT(t)/dt=-\Delta_gT(t)$,
    where $\Delta_g$ is the Laplace-Beltrami operator induced by the surface metric.
    The temperature field becomes increasingly uniform with the increase of $t$, and
    it will become constant eventually.


    In a physical sense, the curvature evolution induced by the Ricci flow is exactly
    the same as heat diffusion on the surface, as follows:


    ```

    $$\frac{dK(t)}{dt}=-\Delta_{g(t)}K(t) \tag{4.18}$$

    ```


