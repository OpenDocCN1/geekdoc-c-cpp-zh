  md: 'know that the change in disparity or flow across the internal edges is less
    than that across the boundary edges. So, we can look into both sides of the edges
    to find the change in flow and disparity and modify its probability (or gray value)
    accordingly.


    We break the edge map into straight-line segments (such as AB, BC, CD, etc., as
    shown in [Figure 2.3b](#)) and select rectangular regions of width *w* at a distance
    *r* on its both sides (see [Figure 2.3c](#)). We then calculate the average disparity
    and average flow inside these rectangles. The absolute difference in the average
    disparity, Δ*d*, and the magnitude of the average flow, Δ*f*, are measures of
    how likely a segment is to be at the depth boundary. The greater the difference,
    the higher is the likelihood of the edge segment to be at the boundary. The rectangular
    regions are selected at an equal distance *r* on both sides from the edge segment,
    because, at the boundary, the flow or disparity is more corrupted than inside
    the object. We chose *r* and *w* to be 5 and 10 pixels, respectively, for our
    experiments.


    Now, the brightness of an edge pixel on the edge segment is changed as


    $I''(x,y)=\alpha_b I(x,y)+(1-\alpha_b)(\Delta f/\max(\Delta f))$ or $I''(x,y)+I(x,y)=(1-\alpha_b)(\Delta
    d/\max(\Delta d))$


    for motion and stereo cues, respectively, where *I*(.) and *I''*(.) are the original
    and the improved edge maps, respectively; αᵦ is the weight associated with the
    relative importance of the monocular cue-based boundary estimate. For our experiments,
    we chose αᵦ to be 0.2. The improved probabilistic boundary edge map is shown in
    Figure 2.3d, wherein the internal edges are dim, and the boundary edges are bright.


    # 3.2.2  Why Polar?


    Before we explain the method to find the optimal closed boundary around the fixation
    point, it is important to first explain why we choose to do so in the polar coordinate
    system. Let us consider finding the optimal contour for the red fixation on the
    disc shown in Figure 2.4a. The gradient edge map (Figure 2.4b) of the disc has
    two concentric circles. The big circle is the actual boundary of the disc, whereas
    the small circle is just the internal edge on the disc. Say that the edge map
    correctly assigns the boundary contour intensity 0.78 and the internal contour
    0.39 (the intensity ranges from 0 to 1). The lengths of the two circles are 400
    and 100 pixels, respectively. Now, the cost of tracing the boundary and the internal
    contour in the Cartesian space will be 88 = (400.(1 − 0.78)) and 61 = (100.(1
    − 0.39)). Clearly, the internal contour costs less and hence will be considered
    optimal even though the boundary contour is the brightest and should actually'
