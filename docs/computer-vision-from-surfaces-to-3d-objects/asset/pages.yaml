    **FIGURE 1.6** (a) An example factor graph. This graph represents the factorization
    of a joint probability distribution over five random variables: $P(a,b,c,d,e)
    \propto f_1(a,b,c)f_2(b,d)f_3(c,e)f_4(d,e)$. (b) A factor graph to solve the classical
