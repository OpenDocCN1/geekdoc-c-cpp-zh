    while at the corner *P*, it is the sum of two Dirac Masses.


    In this example, the dimension of the coherent states is much smaller than the
    square. Hence, we can apply the rank 2 tensor approximation. This provides us
    with a stick along the boundary, and a tensor shaped as a ball at the corners,
    as in the classical approach of Medioni, Lee, and Tang (2000). In Figure 7.7 (b)
    it is visualized the second-rank tensor field obtained by Equation (7.20).


    In Figure 7.7 (c) it is visualized by the density operator (Equation 7.18). The
    density operator is one-to-one equivalent to the probability *P* by the Glauber–Sudarshan
    theorem, so it keeps all the information contained in the probability density
    distribution and it corresponds to an infinity rank tensor field. The infinity
    rank tensorial representation provides us with a stick along the boundary, as
    in the second-order case, and with an entire cross at the corners, keeping the
    two distinct directions of the borders.


    The density operator is then able to represent arbitrarily complex structures,
    as we will see in the next sections.


    # Propagation of Cortical Activity and the Fokker–Planck Equation


    In the section, Association Fields and Integral Curves of the Structure, we observed
    that different points of the group are connected by the integral curves of the
    vector fields, cortically implemented by horizontal connectivity. Such connectivity
    can be modeled in a stochastic setting by the following stochastic differential
    equation (SDE) first introduced by Mumford (1994) and further discussed by August
    and Zucker (2003), Williams and Jacobs (1997a), and Sarti and Citti (2010):


    $$(x'',y'',\theta'')=(\cos(\theta),\sin(\theta),N(0,\sigma^2))=\bar{X}_1+N(0,\sigma^2)\bar{X}_2$$'
