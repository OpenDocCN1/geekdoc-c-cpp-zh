    The lack of dorsal activation in Figure 9.10c implies not that there was no activation
    by surface structure but that there was no change in the surface structure to
    generate activation as the motion direction changed from z-axis (test) to y-axis
    (control); in contrast, the conditions for Figure 9.10a,b involved changes in
    depth structure, as the control was a flat stereosurface. The final element of
    the flow diagram of Figure 9.11 is a split into separate representations for the
    y-axis (hMT+ region) and z-axis (CSM region) directions of cyclopean motion. The
    separation is mandated by the fMRI activation, but the connections remain speculative
    (as did those of Maunsell and Van Essen, 1983, in their early neurophysiological
    studies). Further manipulations will be required to resolve all the details of
