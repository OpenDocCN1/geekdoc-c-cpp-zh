  md: 'amounts to saying that any function $f$ on $R^2$ can be represented as a linear
    combination of coherent states:


    $$f(\xi,\eta)=\int C(x,y,\theta)\Psi_{x,y,\theta}(\xi,\eta)\,dx\,dy\,d\theta$$


    but the coefficients $C(x,y,\theta)$ are not unique (Folland, 1989).


    The output of single simple cells, defined in Equation (7.3), can be represented
    as a scalar product:


    $$O(x,y,\theta)=\langle I,\Psi_{x,y,\theta}\rangle$$


    and it has the natural meaning of the projection of $I$ in the direction of the
    specific element $\Psi$ of the frame. Because the functions $\Psi$ are coherent
    states, the whole output will be identified with a Bargmann transform, which is
    defined exactly as the scalar product with the entire bank of filters (Antoine,
    2000):


    $$B_I(x,y,\theta)=\int I(\xi,\eta)\Psi_{x,y,\theta}(\xi,\eta)\,d\xi\,d\eta \tag{7.17}$$


    This transform maps the image $I(\xi,\eta)$ defined on the 2D space, to a function
    of three variables defined on the phase space. It inherits regularity properties
    from the properties of the filters. It is simple to verify that


    $$X_jB_I(x,y,\theta)=\int I(\xi,\eta)Y_j\Psi_{x,y,\theta}(\xi,\eta)\,d\xi\,d\eta$$


    Due to Proposition 7.2, this implies that the output satisfies


    $$X_1B_I=iX_2B_I$$


    Hence, the Bargmann transform is an entire function in the Cauchy–Riemann (CR)
    structure generated by $X_1$ and $X_2$ (see Folland, 1989, for the definition
    of CR structure). In this context, the classical complex derivative


    $$\frac{d}{dz}=\partial_x-i\partial_y$$


    is replaced by the derivative with respect to the operators $X_j$. Hence, the
    function $B_I$ output of simple cells is holomorphic in this quasi-complex structure
    because


    $$\frac{d}{dz}B_I=X_1B_I-iX_2B_I=0$$'
