    information (Figure 9.4a), and the disparity in their positions in the two eyes
    carried the disparity profile information (Figure 9.4b). In this way, the two
    separate depth cues could be combined or segregated as needed. Both luminance
    and disparity profiles were identical Gaussians, and the two'
