  md: 'right, than the perceptual “whole would be equal to the sum of its parts.”
    Figure 6.2b provides a counterexample to Marr’s claim. In general, forming perceptual
    shape cannot be explained by summing up the results of spatially local operators.
    The operators must be spatially global.


    It is clear that the percept is more organized, richer, simpler, as well as more
    veridical than the retinal image. This fact demonstrates that the visual system
    adds information to the retinal image. Can this “configurality” effect be formalized?
    Look again at Figure 6.1. You see two “perfect” rectangles. They are perfect in
    the sense that the lines representing edges are perceived as straight and smooth.
    This is quite remarkable considering the fact that the output of the retina is
    more like that shown in Figure 6.3. Specifically, the retinal receptors provide
    a discrete sampling of the continuous retinal image, and the sampling is, in fact,
    irregular. The percept of continuous edges of the rectangles can be produced by
    interpolation and smoothing. Specifically, one can formulate a cost function with
    two components: the first evaluates the difference (error) between the perceptual
    interpretation and the data, and the second evaluates the complexity of the perceptual
    interpretation. The percept corresponds to the minimum of the cost function. Clearly,
    two rectangles with straight-line edges are a better (simpler) interpretation
    than a set of unrelated points, or than two rectangles with jagged sides. This
    example shows that the traditional, Fechnerian approach to perception is inadequate.


    According to Fechner’s (1860/1966) approach, the percept is a result of retinal
    measurements. It seems reasonable to think that such properties


