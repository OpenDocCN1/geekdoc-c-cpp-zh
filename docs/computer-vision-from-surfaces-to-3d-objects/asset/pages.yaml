    # Tensorial Structure of the Image


    The probability density $P(x, y, \theta)$, norm of the Bargmann transform and
    containing information about boundaries of the image, is then propagated by the
    following equation:


    $$X_1u(x,y,\theta)+\sigma^2X_{22}u(x,y,\theta)=P(x,y,\theta) \tag{7.23}$$


    where the Dirac delta in Equation (7.22) has been substituted with the forcing
    term $P(x, y, \theta)$. Equivalently, the distribution $u(x, y, \theta)$ can be
    obtained by the convolution product:


    $$u(x,y,\theta)=\Gamma(x,y,\theta)*P(x,y,\theta)$$


    where Γ(x, y, θ) is the Green function, solution of (7.22).


    For the square of Figure 7.7, the resulting $u(x, y, \theta)$ fills in the entire
    figure and structures the inside. In Figure 7.10, a 2D projection of $u(x, y,
    \theta)$ is visualized by means of a rank 2 tensor field (left) and a rank infinity
    tensor field corresponding to the density operator (right). In both cases, the
    tensors induced inside the figure are similar to balls (i.e., they are more isotropic
    than the tensors in the boundaries). The rank infinity tensor field preserves
    more information about the global shape of the object. It represents with fidelity
    the information content of the whole cortical 3D phase space after horizontal
    connectivity propagation.


