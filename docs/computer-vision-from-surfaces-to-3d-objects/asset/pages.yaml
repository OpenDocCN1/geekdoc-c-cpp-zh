  md: 'work suggests that good continuation and relatability are separate but related
    principles of perceptual organization (Kellman et al., 2003). Both embody underlying
    assumptions about contour smoothness (Marr, 1982), but they take different inputs
    and have different constraints. The smoothness assumptions related to both of
    these principles reflect important aspects of the physical world as it projects
    to the eyes. Studies of image statistics suggest that these principles approach
    optimality in matching the structure of actual contours in the world. Through
    an analysis of contour relationships in natural images, Geisler et al. (2001)
    found that the statistical regularities governing the probability of two edge
    elements cooccurring correlate highly with the geometry of relatability. Two visible
    edge segments associated with the same contour meet the mathematical relatability
    criterion far more often than not.


    # 3D CONTOUR INTERPOLATION


    Object formation processes are three-dimensional. Figure 10.7 gives an example—a
    stereogram that may be free-fused by crossing the eyes. One sees a vivid transparent
    surface with a definite 3D shape. Object formation takes as inputs 3D positions
    and orientations of edges and produces as outputs 3D structures (Kellman and Shipley,
    1991; Carman and Welch, 1992; Kellman et al., 2005; Kellman, Garrigan, and Shipley,
    2005).


    Until recently, there has been no account of the stimulus conditions that produce
    3D interpolation. Kellman et al. (2005) proposed that 3D interpolation might be
    governed by a straightforward 3D generalization of


