- pgno: 6
  md: '# Introduction: The Role

    of Midlevel Surface

    Representation in 3D

    Object Encoding


    Christopher W. Tyler


    # VISUAL ENCODING


    The primary goal of visual encoding is to determine the nature and motion of the
    objects in the surrounding environment. In order to plan and coordinate actions,
    we need a functional representation of the dynamics of the scene layout and of
    the spatial configuration and the dynamics of the objects within it. The properties
    of the visual array, however, have a metric structure entirely different from
    that of the spatial configuration of the objects. Physically, objects consist
    of aggregates of particles that cohere together. Objects may be rigid or flexible
    but, in either case, an invariant set of particles is connected to form a given
    object.


    Although the objects may be stable and invariant in the scene before us, the cues
    that convey the presence of the objects to the eyes are much less stable. They
    may change in luminance or color, they may be disrupted by reflections or highlights
    or occlusion by intervening objects. The various cues carrying the information
    about the physical object structure, such as edge structure, binocular disparity,
    color, shading, texture, and motion vector fields, typically carry information
    that is inconsistent. Many of these cues may be sparse, with missing information
    about the object structure across gaps where there are no edge or texture cues
    to carry information about the object shape (see Figure 0.1).'
  merge: -1
  img_proc: true
- pgno: 7
  md: '![](img/4d808358747f9096d24f831e5f9d8083_7_0.png)


    The typical approach to computational object understanding is to derive the shape
    from the two-dimensional (2D) outline of the objects. For complex object structures,
    however, object shape cannot be determined from the 2D shape of the outline. In
    the scene depicted in Figure 0.1, many of the objects have nontraditional shapes
    that have minimal surface texture between the edges and are set at oblique angles
    to the camera plane. Although the structural edges are well-defined by luminance
    and color transitions, there are shadows that have to be understood as nonstructural
    edges, and the structural edges have to be encoded in terms of their three-dimensional
    (3D) spatial configuration, not just their 2D location. In natural scenes, the
    3D information is provided by stereoscopic disparity, linear perspective, motion
    parallax, and other cues. In the 2D representation of Figure 1, of course, only
    linear perspective is available, and in a rather limited fashion in the absence
    of line or grid texture on the surfaces.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Consequently, the 3D structure of the objects requires both


    +   1. Global integration among the various edge cues to derive the best estimate
    of the edge structure in 3D space, and

    +   2. 3D interpolation from sparse depth cues across regions with no shape information


    These are challenging tasks involving an explicit 3D representation of the visual
    scene, which have not been addressed to be either computational techniques or
    empirical studies of how the visual system achieves them.


    Thus, a primary requirement of neural or computational representations of the
    structure of objects is the filling-in of details of the three-dimensional object
    structure across regions of missing or discrepant information in the local visual
    cues. Generating such three-dimensional representations is a fundamental role
    of the posterior brain regions, but the cortical architecture for the joint processing
    of multiple depth cues is poorly understood in the brain, especially in terms
    of the joint processing of diverse visual cues. Computational approaches to the
    issue of the structure of objects tend to take either a low-level or a high-level
    approach to the problem. Low-level approaches begin with local feature recognition
    and an attempt to build up the object representation by hierarchical convergence,
    using primarily feedforward logic with some recurrent feedback tuning of the results
    (Marr, 1982; Grossberg, Kuhlmann, and Mingolla, 2007). High-level, or Bayesian,
    approaches begin with the vocabulary of likely object structures and look for
    evidence in the visual array as to which object might be there (Huang and Russell,
    1998; Rue and Hurn, 1999; Moghaddam, 2001; Stormont, 2007). Both approaches work
    much better for objects with a stable 2D structure (when translating through the
    visual scene) than for manipulation of objects with a full 3D structure, such
    as those in Figure 1, or for locomotion through a complex 3D scene.


    # SURFACES AS A MID-LEVEL INVARIANT

    IN VISUAL ENCODING


    A more fruitful approach to the issue of 3D object structure is to focus the analysis
    on midlevel invariants to the object structure, such as surfaces, symmetry, rigidity,
    texture invariants, or surface reflectance properties.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# X ■ Introduction


    Each of these properties is invariant under transformations of 3D pose, viewpoint,
    illumination level, haze contrast, and other variations of environmental conditions.
    In mathematical terminology, given a set of object points **X** with an equivalence
    relation A ~ A′ on it, any function *f*: **X** → **Y** is constant over the equivalence
    classes of the transformations. Various computational analyses have incorporated
    such invariants in their object-recognition schemes, but a neglected aspect of
    midlevel vision is the 3D surface structure that is an inescapable property of
    objects in the world. The primary topic of this book is therefore to focus attention
    on this important midlevel invariant of object representation, both to determine
    its role in human vision and to analyze the potential of surface structure as
    a computational representation to improve the capability of decoding the object
    structure of the environment.


    Surfaces are a key property of our interaction with objects in the world. It is
    very unusual to experience objects, either tactilely or visually, except through
    their surfaces. Even transparent objects are experienced in relation to their
    surfaces, with the material between the surfaces being invisible by virtue of
    the transparency. The difference between transparent and opaque surfaces is that
    only the near surfaces of opaque objects are visible, while in transparent objects
    both the near and far surfaces are visible. (Only translucent objects are experienced
    in an interior sense, as the light passes through them to illuminate the density
    of the material. Nevertheless, the interior is featureless and has no appreciable
    shape information.) Thus, the surfaces predominate for virtually all objects.
    Developing a means of representing the proliferation of surfaces before us is
    therefore a key stage in the processing of objects.


    For planar surfaces, extended cues such as luminance shading, linear perspective,
    aspect ratio of square or round objects, and texture gradient can each specify
    the slant of a planar surface (see *Figure 0.2*). Zimmerman, Legge, and Cavanagh
    (1995) performed experiments to measure the accuracy of surface slant from judgments
    of the relative lengths of a pair of orthogonal lines embedded in one surface
    of a full visual scene. Slant judgments are accurate to within 3° for all three
    cue types, with no evidence of the recession to the frontal plane expected if
    the pictorial surface was contaminating the estimations. Depth estimates of disconnected
    surfaces were, however, strongly compressed. Such results emphasize the key role
    of surface reconstruction in human depth estimation.


    In assessing the placement of surfaces in space, Alhazen, in his *Optics* (AD
    ~1000), argued that “sight does not perceive the magnitudes of distances of visible
    objects from itself unless these distances extend along a'
