  md: '*Proof.* The proof can be found, for example, in Theorem 1.34 in Folland (1989).
    It follows from the fact that minimizers must satisfy the equality in the uncertainty
    principle:


    $|\langle Y_3u,u\rangle|=2\| (Y_1-a_1)u\|\,\|(Y_2-a_2)u\|$


    so that also the Schwartz inequality (Equation [7.15]) has to be an equality:


    $|\operatorname{Im}\langle Y_2u,Y_1u\rangle|=\|Y_2u\|\,\|Y_1u\|$ (7.16)


    If the scalar product is equal to the product of the norms, then the vectors $Y_2u$
    and $Y_1u$ have to be parallel:


    $Y_1u=i\lambda Y_2u$


    A direct verification proves that the Gabor filter $\Psi_0$ defined in Equation
    (7.1) satisfies this equation. As we said before, all the other filters were obtained
    from this via rotations and translations, so that they are coherent states in
    the sense of Perelomov (1986). Lee (1996) has shown these states are in agreement
    with the experimental data of the receptive profile (Figure 7.6).


    Let us note that these minimizers are the coherent states of the reducible representation
    of the group. In Barbieri et al. (2010), we used the irreducible representation
    of the operators $Y_j$, so that we searched minimizers in the set of functions
    with fixed frequency in the Fourier domain, and we obtained the classical pinwheels
    structure, observed experimentally by Bosking et al. (1997).


    # Output of Simple Cells and Bargmann Transform


    We recall that the coherent states span the whole Hilbert space of functions defined
