    As we show below, a linear model assumes that shape is not estimated when estimating
    slant. Alternatively, the visual system can use the information about surface
    shape for slant estimation. To measure performance on a discrimination task, we
    calculated a threshold of a psychometric function. Assuming Gaussian noise, the
