  md: "gradient (magnitude and direction), or higher-level descriptors incorporating\
    \ neighboring image structure (such as DAISY) (Tola, Lepetit, and Fua, 2008).\n\
    \n+   3. MRF models may be multiscale (Felzenszwalb and Huttenlocher, 2006), with\
    \ a pyramid structure coupling the original disparity lattice with subsampled\
    \ (coarsened) versions of it.\n+   \n+   4. The conditional independence assumption\
    \ in Equation (3.3) can be relaxed with the use of conditional random fields,\
    \ resulting in a more realistic posterior distribution.\n\n# How MRFs Propagate\
    \ Information\n\nWe now briefly explain how the MRF model propagates noisy and\
    \ sparse disparity cues throughout the image. The general principle behind this\
    \ process is that the prior and likelihood distributions compete for various disparity\
    \ hypotheses, and the relative strength of these two sources of information automatically\
    \ varies across the image according to which source is more reliable.\n\nIn Figure\
    \ 3.1 we show a simple example of a scene consisting only of a flat surface oriented\
    \ fronto-parallel to the cameras (so that the correct disparity field is uniform\
    \ across the image, with value \\(d_o\\)). The entire surface contains a highly\
    \ textured, nonperiodic pattern, except for a central region that is textureless.\
    \ Everywhere in the textured part of the image, the likelihood model provides\
    \ strong evidence for the correct disparity \\(d_o\\) and very low evidence for\
    \ anything but \\(d_o\\) (in practice, the likelihood model will be less discriminating,\
    \ but we assume near-perfect disparity discrimination for the sake of argument).\
    \ By contrast, in the central region there will be no direct evidence favoring\
    \ one disparity over another. Any attempt to perform inference using the likelihood\
    \ without the prior will obviously fail in the central region. However, by incorporating\
    \ the prior with the likelihood, it is easy to see that a disparity field that\
    \ has a uniform value of \\(d_o\\) over the entire image will have a higher posterior\
    \ probability than any other possible disparity field, because any disparity field\
    \ that deviates from \\(d_o\\) will be less smooth than the correct disparity\
    \ field (while having the same support from the likelihood model).\n\nMore realistic\
    \ examples can be analyzed exhibiting similar behavior, in which the MRF prior\
    \ model propagates surface information even when the disparity cues are noisy\
    \ or nonexistent."
