- pgno: 122
  md: 'basis for simple, robust, and statistically optimal estimation of scene properties
    when cues are considered at a single spatial location.


    # CUE PROPAGATION IN THE CASE OF NOISY CUES


    Cue propagation extends a cue integration framework by allowing the combining
    of visual cues at different spatial locations. The benefits of such integration
    are straightforward only if a visual surface has similar properties in some neighborhood;
    hence, we consider only planar or slowly curving surfaces. In those cases, highly
    informative but sparse cues can substitute for less informative neighbors due
    to the redundancy of visual information.


    A mechanism for propagation of surface information was described by James Coughlan
    in detail in Chapter 3 of this book, ”Mechanisms for Propagating Surface Information
    in 3D Reconstruction.” This mechanism is not only tractable in terms of computation
    and learning times but also seems to be physiologically plausible. It also allows
    information to be propagated along a surface without knowing surface position
    and orientation in advance. Merely specifying a prior constraint such as smoothness
    of some surface parameter is enough to produce a consistent and dense surface
    representation. Such constraints specify how information is interpolated during
    propagation.


    Here I look at this mechanism from a viewpoint of cue integration theory and make
    some parallels between computational formulation and cue probabilities. I focus
    on the case when visual information is propagated into a surface area with noisy
    and unreliable cues and show that this situation is analogous to a cue conflict.
    The main goals are to analyze the conditions for cue propagation and compare the
    role of different prior constraints in surface reconstruction. As an example,
    I use three-dimensional (3D) surface reconstruction from binocular disparity that
    is similar to that described by Coughlan in Chapter 3 of this book. Finding binocular
    correspondences remains a hot topic in computer vision (Sun, Shum, and Zheng,
    2002; Zhang and Seitz, 2005; Seitz et al., 2006). Some of the challenges are scarcity
    of strong visual cues and presence of multiple matching hypotheses. Though the
    latter characteristic is different from the assumption of the classical cue integration
    framework (where a unimodal Gaussian distribution represents a single hypothesis),
    the same principles apply. For example, as the strength of a cue declines due
    to the changes in viewing conditions, the role of prior information correspondingly
    increases.'
