- pgno: 47
  md: 'The efficient belief propagation techniques we developed have similar applications
    in a variety of perceptual inference tasks. These and other statistical inference
    techniques promise to significantly advance the state of the art in computer vision
    and to improve our understanding of perceptual inference in general.


    In addition to improved performance, the approach to shape from shading described
    above offers a new degree of flexibility that should allow shading to be exploited
    in more general and realistic scenarios. Previous approaches to shape from shading
    typically relied heavily on the exact nature of the Lambertian reflectance equations,
    and so could only be applied to surfaces with specific (i.e., matte) reflectance
    qualities with no surface markings. Also, specific lighting conditions were assumed.
    The approach described above applies directly to a statistical model of the relationship
    between shape and shading, and so it does not depend on the exact nature of the
    Lambertian equation or specific lighting arrangements. Also, the efficient higher-order
    belief propagation techniques described here make it possible to exploit stronger,
    nonpairwise models of the prior probability of 3D shapes. Because the problem
    of depth inference is so highly underconstrained, and natural images admit large
    numbers of plausible 3D interpretations, it is crucial to utilize an accurate
    model of the prior probability of 3D surface. Knowing what 3D shapes commonly
    occur in nature and what shapes are *a priori* unlikely or odd is a very important
    constraint for depth inference. Finally, the factor graph representation of the
    shape-from-shading problem (see Figure 1.6) can be generalized naturally to exploit
    other depth cues, such as occlusion contours, texture, perspective, or the da
    Vinci correlation and shadow cues. The state-of-the-art approaches to the inference
    of depth from binocular stereo pairs typically employ belief propagation over
    a MRF. These approaches can be combined with our shape-from-shading framework
    in a fairly straightforward way, allowing both shading and stereo cues to be simultaneously
    utilized in a statistically optimal way. Statistical approaches to depth inference
    make it possible to work toward a more unified and robust depth inference framework,
    which is likely to become a major area of future vision research.


    # ACKNOWLEDGMENTS


    This work was supported by NSF CISE IIS 0713206 and AFOSR FA9550-09-1-0678 to
    T. S. Lee, and an NSF Graduate Research Fellowship to B. Potetz.'
