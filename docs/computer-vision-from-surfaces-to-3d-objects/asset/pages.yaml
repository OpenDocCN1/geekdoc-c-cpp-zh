    **FIGURE 10.6** Examples of relatable and nonrelatable contours.


    distinction is important, as object perception often involves a discrete determination
    of whether two visible fragments are part of the same object or not. Figure 10.6
    shows examples of relatable and nonrelatable edges, in both perception of partly
    occluded objects and perception of illusory objects. Complete objects are formed
    in the top row but not in the bottom row. Object formation has profound effects
    on further processing, such as generation of a representation of missing areas,
    generation of an overall shape description, and comparison with items or categories
    in memory. Research indicates that the representation of visual areas as part
    of a single object or different objects has many important effects on information
    processing (Baylis and Driver, 1993; Zemel et al., 2002; Kellman, Garrigan, and
    Shipley, 2005).


    # Quantitative Variation


    Although the discrete classification of visible areas as connected or separate
    is important, there is also reason to believe that quantitative variation exists
    within the category of relatable edges (Kellman and Shipley, 1991; Banton and
    Levi, 1992; Shipley and Kellman, 1992a, 1992b; Field, Hayes, and Hess, 1993; Singh
    and Hoffman, 1999b). For example, experiments indicating a decline to a limit
    around 90° were reported by Field, Hayes, and Hess (1993). Singh and Hoffman (1999a)
    proposed an expression for quantitative decline of relatability with angular change.


    # Ecological Foundations


    The notion of relatability is sometimes described as a formalization of the Gestalt
    principle of good continuation (Wertheimer, 1923/1938). Recent'
