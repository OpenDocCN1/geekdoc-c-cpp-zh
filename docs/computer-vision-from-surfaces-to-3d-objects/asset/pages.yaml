- pgno: 226
  md: 'caudal intraparietal sulcus (cIPS) indicates the presence of units tuned to
    3D slants (Sakata et al., 1997). It is notable that these units appear to respond
    to a particular 3D orientation regardless of whether that orientation is specified
    by stereoscopic information or texture information. These findings indicate where
    the kinds of input units required for 3D relatability—namely, units signaling
    3D orientation and position—may exist in the nervous system.


    In addition to the location of 3D processing, much remains to be learned about
    the nature of its mechanisms. Are there areas of cortex in which units sensitive
    to 3D positions and orientations of contour or surface fragments interact in a
    network that represents 3D relations? At present, we do not know of such a network,
    but the psychophysical results suggest that it is worth looking for.


    All of these same sorts of questions apply as well to spatiotemporal object formation.
    We have impressive capabilities to construct coherent objects and scenes from
    fragments accumulated across gaps in space and time. Where in the cortex are these
    capabilities realized? And what mechanisms carry out the storage of previously
    visible fragments and their positional updating, based on velocity information,
    after they have gone out of sight? A striking possibility is that the same cortical
    areas are involved as those in 3D interpolation. At least, such an outcome would
    be consistent with a grand unification of processes that create objects from fragments.
    Although individual experiments have usually addressed 2D, 3D, and spatiotemporal
    interpolation separately, they may be part of a more comprehensive 4D process.
    Understanding both the computations involved and their neural substrates are fundamental
    and exciting issues for future research.'
