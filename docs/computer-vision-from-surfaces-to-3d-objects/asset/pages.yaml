  md: 'Williams and Jacobs (1997a); and Zucker (2000). They formulated the assumption
    that the signal in the cortex can be described as a Markov process. This consideration
    leads, in turn, to a Fokker–Planck equation in the cortical phase space. Its solution
    expresses the probability that a point with a specific direction belongs to a
    contour, and it is implemented by the horizontal connectivity in the three-dimensional
    (3D) cortical space. The output of the Bargmann transform containing information
    about image boundaries is propagated by the Fokker–Planck equation, resulting
    in boundary completion and the filling in of the figure.


    Projecting the propagated solution from the 3D cortical space to the retinal plane,
    we obtain the density operator giving a tensorial representation associated to
    the perceived image.


    In the next section, the neurogeometry of the cortex is presented, following Citti
    and Sarti (2006). In the third section, we will reinterpret the neurogeometric
    structure from a probabilistic point of view, by replacing vector fields generators
    of the Lie algebra by the corresponding operators (i.e., performing the “second
    quantization”).


    # THE NEUROGEOMETRICAL STRUCTURE OF THE CORTEX


    # The Set of Receptive Profiles and the Lie Group of Rotation and Translation


    The retinal plane $M$ will be identified with the two-dimensional (2D) plane $\mathbb{R}^2$
    with coordinates $(x,y)$. When a visual stimulus $I(x,y):M\cup\mathbb{R}^2\to\mathbb{R}_+$
    activates the retinal layer, the cells centered at every point $(x,y)$ of $M$,
    process in parallel the retinal stimulus with their receptive profile (RP). The
    RP of a single cell can be modeled as a Gabor filter (see [Figure 7.1](#figure-71)):


    $$\Psi_0(\xi,\eta)=e^{-(\xi^2+\eta^2)}e^{2i\eta} \tag{7.1}$$


    All the other observed profiles can be obtained by translation and rotation of
    $\Psi_0(\xi,\eta)$ (see Lee, 1996). We will denote $A_{x,y,\theta}$ the action
    of the group of rotation and translation on $\mathbb{R}^2$, which associates to
    every vector $(\xi,\eta)$ a new vector $(\tilde{\xi},\tilde{\eta})$ according
    to the following law:


    $$(\tilde{\xi},\tilde{\eta})=A_{x,y,\theta}(\xi,\eta)=\begin{pmatrix}x\\y\end{pmatrix}+\begin{pmatrix}\cos(\theta)&-\sin(\theta)\\\sin(\theta)&\cos(\theta)\end{pmatrix}\begin{pmatrix}\xi\\\eta\end{pmatrix}
    \tag{7.2}$$'
