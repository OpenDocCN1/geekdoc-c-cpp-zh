    # CONCLUSION


    The concept of surface representation requires a surface interpolation mechanism
    to represent the surface in regions of the visual field where the information
    is undefined. Whereas a typical receptive-field summation mechanism shows a stronger
    response as the amount of stimulus information increases, the characteristic of
    an interpolation mechanism is to increase its response as stimulus information
    is *reduced* and more extended interpolation is required. The cortical locus of
    the interpolation mechanism may therefore be sought by identifying fMRI activation
    sites'
