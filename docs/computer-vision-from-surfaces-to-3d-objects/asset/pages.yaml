  md: 'Whereas a (2D) receptive-field summation mechanism shows a stronger response
    as the amount of stimulus information increases, the characteristic of an *interpolation*
    mechanism is to *increase* its response, or at least not decrease its response,
    as stimulus information is *reduced* and more extended interpolation is required.
    (Of course, a point will be reached where the interpolation fails and the response
    ultimately drops to zero.)


    Once the object surfaces have been identified, we are brought to the issue of
    the localization of the object features relative to each other, and relative to
    those in other objects. Localization is particularly complicated under conditions
    where the objects could be considered as “sampled” by overlapping noise or partial
    occlusion—the tiger behind the trees, the face behind the window curtain. However,
    the visual system allows remarkably precise localization, even when the stimuli
    have poorly defined features and edges (Toet and Koenderink, 1988; Kontsevich
    and Tyler, 1998; Likova and Tyler, 2003). Furthermore, sample spacing is a critical
    parameter for an adequate theory of localization. Specifically, no low-level filter
    integration can account for interpolation behavior beyond the tiny range of 2
    to 3 arc min in foveal vision (Morgan and Watt, 1982), although the edge features
    of typical objects, such as the form of a face or the edges of a computer monitor,
    may be separated by blank regions of many degrees. Thus, the interpolation required
    for specifying the shape of most objects is well beyond the range of the available
    filters. This limitation poses an additional challenge in relation to the localization
    task, raising the “long-range interpolation problem” that has generated much interest
    in relation to the position coding for extended stimuli, such as Gaussian blobs
    and Gabor patches (Morgan and Watt, 1982; Hess and Holliday, 1992; Levi, Klein,
    and Wang, 1994).


    # NEED FOR 3D SURFACE REPRESENTATION


    One corollary of the surface reconstruction approach is a postulate that the object
    array is represented strictly in terms of its surfaces, as proposed by Nakayama
    and Shimojo (1990). Numerous studies point to a key role of surfaces in organizing
    the perceptual inputs into a coherent representation. Norman and Todd (1998),
    for example, show that discrimination of the relative depths of two visual field
    locations is greatly improved if the two locations to be discriminated lie in
    a surface rather than being presented in empty space. This result is suggestive
    of a surface level of interpretation, although it may simply be relying on the
    fact that the presence of the surface provides more information about the'
  merge: -1
  img_proc: true
