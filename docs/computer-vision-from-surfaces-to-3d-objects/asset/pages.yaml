  md: 'depth regions to be assessed. Nakayama, Shimojo, and Silverman (1989) provide
    many demonstrations of the importance of surfaces in perceptual organization.
    They show that recognition of objects (such as faces) is much enhanced where the
    scene interpretation allows them to form parts of a continuous surface rather
    than isolated pieces, even when the retinal information about the objects is identical
    in the two cases. This study also focuses attention on the issue of border ownership
    by surfaces perceived as in front of rather than behind other surfaces. Although
    their treatment highlights interesting issues of perceptual organization, it offers
    no insight into either the neural or computational mechanisms by which such structures
    might be achieved.


    A key issue raised by the small scale of the local filters for position encoding
    is the mechanism of long-range interpolation. To address this question, Kontsevich
    and Tyler (1998) developed a sampling paradigm for object location in which the
    objects were defined by sampled luminance profiles in the form shown in Figure
    9.3. This sampled paradigm is a powerful means for probing the properties of the
    luminance information contributing to shape perception. Surprisingly, the accuracy
    of localization by humans is almost *independent* of the sample spacing. The data
    showed that as few as two to three samples are all the information about a 1°
    Gaussian bulge that could be processed by the visual system. Adding further samples
    (by increasing sampling density) had no further


    ![](img/4d808358747f9096d24f831e5f9d8083_187_0.png)


    FIGURE 9.3  Sampled Gaussian luminance profile used to study long-range interpolation
    processes by Kontsevich and Tyler (1998; Reprinted with permission.)'
