    sphere.


    potential abnormality. Human brain cortex surfaces are highly convoluted. It is
    difficult to compare the shapes of two cortical surfaces directly. By using conformal
    shape representation, we can map brain surfaces to the unit sphere and compare
    their spherical images easily. By measuring the difference between their conformal
    factor and mean curvature functions, the distance between the shapes can be measured
    quantitatively. Figure 4.11 shows an example of such conformal brain mapping.
    Details can be found in Gu et al. (2004).


    There are prominent biological features on brain cortical surfaces. In the brain
    surface matching process, we can enforce the alignment of these landmarks in the
    following way. As shown in Figure 4.12, the cortex surface is sliced open along
    the landmarks and then mapped to the canonical disk with circular holes. During
    the matching, the corresponding boundaries are aligned together. This guarantees
    the matching between the corresponding landmarks.


    # Surface Matching


    Given two surfaces \(S_1,S_2\) embedded in \(\mathbb{R}^3\), we want to find a
    good matching \(f:S_1\to S_2\), which minimizes the distortion between them. It
    is generally difficult to match the surfaces directly in \(\mathbb{R}^3\). As
    shown in Figure 4.13, we compute two conformal mappings \(\phi_i:S_i\to\mathbb{D},
    i=1,2\), \(\mathbb{D}\) is the canonical unit disk. Then we can find a mapping
    \(\bar f:\mathbb{D}\to\mathbb{D}\), which induces \(f\):


    \[f = \phi_2^{-1} \circ \bar f \circ \phi_1 \tag{4.39}\]'
