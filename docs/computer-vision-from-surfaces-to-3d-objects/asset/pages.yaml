- pgno: 131
  md: '# CONCLUSIONS


    In this chapter, we reviewed a mechanism for information propagation described
    by Coughlan in Chapter 3 of this book from a viewpoint of a cue integration theory.
    We found many similarities between a computational model of information propagation
    and underlying principles of cue integration. We also found that a cue conflict
    theory can be used to improve information propagation into areas with weak and
    noisy cues. Using this improvement, we obtained dense 3D surface reconstructions
    from a stereo pair with sparse strong cues. Importantly, the shape of 3D reconstruction
    depended on the form of a prior constraint that helped to interpolate information
    along flat or slowly curving surfaces. For nonflat surfaces, we showed that the
    human visual system uses shape information to increase the informativeness of
    visual cues for slant. This is consistent with the hypothesis that surface shape
    is estimated in isolation to facilitate interpretation of other cues and interpolate
    them in the location where cues are sparse.


    # ACKNOWLEDGMENT


    I would like to thank James Coughlan, David Knill, and Ender Tekin for helpful
    feedback on this manuscript.'
