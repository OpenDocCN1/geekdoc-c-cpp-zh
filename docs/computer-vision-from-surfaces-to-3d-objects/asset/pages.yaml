  md: 'to a straightforward computation of Equation (1.13), which is O(M4). In (Potetz
    and Lee, 2008), we show how this approach can be used to compute messages in time
    O(M2) for all potential functions of the form


    [\phi(\vec{x}) = g\left(\sum_i g_i(x_i)\right)\tag{1.17}]


    This reduces a problem from exponential time to linear time with respect to the
    number of variables connected to a factor node. Potentials of this form are common
    in graphical models, in part because they offer advantages in training graphical
    models from real data (Friedman et al., 1984; Hinton, 1999; Roth and Black, 2005;
    Zhu et al., 1998).


    This approach reduces a problem from exponential time to linear time with respect
    to the number of variables connected to a factor node. With this efficient algorithm,
    we were able to apply belief propagation to the classical computer vision problem
    of shape from shading, using the factor graph shown in Figure 1.6 (see Potetz,
    2007 for details). Previously, the general problem of shape from shading was solved
    using gradient descent-based techniques. In complex, highly nonlinear problems
    like shape from shading, these approaches often become stuck inside local, suboptimal
    minima. Belief propagation helps to avoid difficulties with local minima in part
    because it operates over whole probability distributions. Gradient descent approaches
    maintain only a single 3D shape at a time, iteratively refining that shape over
    time. Belief propagation seeks to optimize the single-variate marginals \( b_i(x_i)
    \) for each variable in the factor graph.


    Solving shape from shading using belief propagation performs significantly better
    than previous state-of-the-art techniques (see Figure 1.7). Note that without
    the efficient techniques described here, belief propagation would be intractable
    for this problem, requiring over 100,000 times longer to compute each iteration.
    In addition to improved performance, solving shape from shading using belief propagation
    allows us to relax many of the restrictions typically assumed by shape-from-shading
    algorithms in order to make the problem tractable. The classical definition of
    the shape-from-shading problem specifies that lighting must originate from a single
    point source, that surfaces should be entirely matte, or Lambertian in reflectance,
    and that no markings or colorations can be present on any surface. The flexibility
    of the belief propagation approach allows us to start relaxing these constraints,
    making shape from shading viable in more realistic scenarios.'
