    the available disparity information. Concepts of “mirror neurons” imply that there
    are neural representations of the actions of others implemented in the brain in
    a form that is both manipulable and adaptive to new situations faced by the observer
    (Rizzolati et al., 1996; Rizzolatti and Sinigaglia, 2010). The concept of the
    attentional shroud shares some similarities with the mirror concept, in that it
    is mirroring the configuration of the surface in the world with an internal surface
