  md: 'Such a transformation may prove valuable for our application, but a more general
    solution is to impose a prior that assumes that locally planar surfaces with arbitrary
    slant and tilt are common. One way to enforce such a prior is to penalize deviations
    of the second derivatives of the disparity field from zero. At a minimum, such
    a prior must evaluate the relationship among three consecutive pixel disparities,
    because a second derivative requires three consecutive samples to be estimated.
    (A second derivative of zero implies that the three points are collinear in 3D.)
    This measure is beyond the capability of the pairwise MRF presented in this chapter,
    and a straightforward implementation using a more powerful MRF with ternary (triplet)
    interactions would be extremely computationally demanding. Recent work (Woodford
    et al., 2008) replaces BP for such an implementation with another energy minimization
    algorithm that is much more efficient for this problem. The result is a tractable
    stereo algorithm with superior performance, particularly in its ability to propagate
    surface information on non-fronto-parallel surfaces.


    # BIOLOGICAL PLAUSIBILITY


    From time to time, I am asked by neuroscientists and psychophysicists if MRF models
    such as the ones described in this chapter have anything to do with biological
    vision systems. Although I confess to knowing little about biological vision,
    I would like to point to work by others arguing that the MRF-BP framework (perhaps
    extended to incorporate multiple depth cues) may be biologically plausible.


    From a biological perspective, perhaps the most important property of models cast
    in this framework is that they are fully parallelizable: one can implement BP
    in a parallel hardware system with one computing node for each variable in the
    MRF, with directed connections between neighboring variables to represent BP messages.
    In each iteration of BP, messages flow along these connections from each variable
    node to neighboring nodes. Lee and Mumford (2003) have argued that BP may be a
    model for how information is passed top-down and bottom-up in the brain. Recent
    research (Ott and Stoop, 2006) has established that BP for MRFs with binary-valued
    variables (i.e., each variable can assume only two possible states) can be formulated
    with continuous time updates (rather than discrete time updates), resulting in
    behavior that closely matches the dynamics of a Hopfield'
  merge: -1
