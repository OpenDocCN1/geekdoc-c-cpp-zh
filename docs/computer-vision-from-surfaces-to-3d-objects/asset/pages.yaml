- pgno: 143
  md: 'way to provide such a relational structure and, thus, to represent shapes of
    3D objects. But note that visible surfaces of a 3D symmetric shape are never symmetric
    (except for degenerate views). If symmetry is necessary for shape, then arbitrary
    surfaces may not have shape. At least, they may not have shape that can lead to
    shape constancy with human observers and computational models.


    Can our model be generalized to 3D shapes that are not symmetric? The model can
    already be applied to nearly symmetric shapes (see Demo 3). For a completely asymmetric
    shape, the model can be applied as long as there are other 3D constraints that
    can substantially reduce the family of possible 3D interpretations. Planarity
    of contours can do the job, as shown with an earlier version of our shape recovery
    model (Chan et al., 2006). Planarity of contours can often reduce the number of
    free parameters in 3D shape recovery to just three (Sugihara, 1986). With a three-parameter
    family of possible interpretations, 3D compactness and minimum surface area are
    likely to lead to a unique and accurate recovery. This explains why human observers
    can achieve shape constancy with asymmetric polyhedra, although shape constancy
    is not as reliable as with symmetric ones.


    Finally, we will briefly discuss the psychological and physiological plausibility
    of one critical aspect of our model. Recall that the model begins with computing
    a virtual 2D image, which is a mirror reflection of a given 2D real image. Is
    there evidence suggesting that the human visual system computes 2D virtual images?
    The answer is “yes.” When the observer is presented with a single image of a 3D
    object, he or she will memorize not only this image, but also its mirror reflection
    (Vetter, Poggio, and Bülthoff, 1994). Note that a mirror image of a given 2D image
    of a 3D object is useless unless the 3D object is symmetric. When a 3D object
    is asymmetric, the virtual 2D image is not a valid image of this object. This
    means that the observer will never be presented with a virtual image of an object,
    unless the 3D object is mirror symmetric. When the object is mirror symmetric,
    then a 2D virtual image is critical, because it makes it possible to recover the
    3D shape. The computation of a virtual image has been demonstrated not only in
    psychophysical but also in electrophysiological experiments (Logothetis, Pauls,
    and Poggio, 1995; Rollenhagen and Olson, 2000).'
