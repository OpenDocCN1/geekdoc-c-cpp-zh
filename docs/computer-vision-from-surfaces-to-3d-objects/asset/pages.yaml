- pgno: 222
  md: 'the contour interpolation process was compromised, the three projected fragments
    of the objects were less likely to be perceived as a single visual unit, and discrimination
    performance suffered.


    Palmer, Kellman, and Shipley (2006) proposed the notion of a _dynamic visual icon_—a
    representation in which the persistence and position updating (and perhaps interpolation)
    functions of STR are carried out. The idea extends the notion of a visual icon
    representation, first discovered by Sperling (1960) and labeled by Neisser (1967),
    which accepts information over time and allows the perceiver to integrate visual
    information that is no longer physically visible. Perception is not an instantaneous
    process but rather is extended over time, and the visual icon is a representation
    that faithfully maintains visual information in a spatially accurate format for
    100 ms or more after it disappears. The proposal of a dynamic visual icon adds
    the idea that represented information may be positionally updated based on previously
    acquired velocity information. It is not clear whether this feature is a previously
    unexplored aspect of known iconic visual representations or whether it implies
    a special representation. What is clear is that visual information is not only
    accumulated over time and space, but that the underlying representation is geared
    toward the processing of ongoing events.


    A yet unexplored aspect of the dynamic visual icon is whether it incorporates
    position change information in all three spatial dimensions. If so, this sort
    of representation might handle computations in a truly 4D spatiotemporal object
    formation process. Most studies to date, as well as the theory of STR proposed
    by Palmer, Kellman, and Shipley (2006), have focused on 2D contour completion
    processes and motion information. A more comprehensive idea of 3D interpolation
    that incorporates position change and integration over time has yet to be studied
    experimentally. Future work will address this issue and attempt to unify the 3D
    object formation work of Kellman, Garrigan, and Shipley (2005) with the STR theory
    and findings of Palmer, Kellman, and Shipley (2006).


    # FROM SUBSYMBOLIC TO SYMBOLIC REPRESENTATIONS


    One way to further our understanding of contour interpolation processes is to
    build models of contour interpolation mechanisms and compare their performance
    to human perception. One such model takes grayscale images as input, and using
    simulated simple and complex cells, detects contour junctions (Heitger et al.,
    1992) and interpolates between them using geometric constraints much like contour
    relatability (Heitger et al., 1998).'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The output of this model is an image of activations at pixel locations along
    interpolation paths. These activations appear at locations in images where people
    report perceiving illusory contours.


    A more recent model (Kalar et al., 2010), generalizes the framework proposed in
    the model of Heitger et al. (1998) to interpolate both illusory and occluded contours.
    This model, which is a neural implementation of contour relatability and the identity
    hypothesis (that illusory and occluded objects share a common underlying interpolation
    mechanism), generates images of illusory and occluded contours consistent with
    human perception in a wide variety of contexts (e.g., Figure 10.12).


    There is, however, an important shortcoming of models of this type. The inputs
    to these models are _images_ where pixel values represent luminance. The outputs
    of the models are images of illusory and occluded (and real) contours. That is,
    these models take images that represent luminance at each pixel location and return
    images that represent illusory and occluded interpolation _activity_ at each pixel
    location. There is nothing in the outputs to indicate that different pixels are
    connected to each other, that they form part of a contour, and so on. Nothing
    describes the areas that form a complete object, much less provides a description
    of its shape. In this sense, such models can be easily misinterpreted, as the
    observer viewing the outputs provides all of these additional descriptions.


    ![](img/4d808358747f9096d24f831e5f9d8083_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'To account for human perception, the important filtering information provided
    by these models must feed into mechanisms that produce higher-level, symbolic
    descriptions. Beyond representations of contours (both physically defined and
    interpolated) as sets of unbound pixel values must be a more holistic description,
    with properties like shape, extent, and their geometric relationships to other
    contours in the scene.


    This is a very general point about research into object and surface perception.
    Vision models using relatively local filters describe important basic aspects
    of processing. At a higher level, some object recognition models assume tokens
    such as contour shapes, aspect ratios, or volumetric primitives as descriptions.
    The difficult problem is in the middle: How do we get from local filter responses
    to higher-level symbolic descriptions? This question is an especially high priority
    for understanding 3D shape and surface perception. Higher-level shape descriptions
    are needed to account for our use of shape in object recognition and our perceptions
    of similarity. As the Gestalt psychologists observed almost a century ago, two
    shapes may be seen as similar despite being composed of very different elements.
    Shape cannot be the sum of local filter activations. Understanding processes that
    bind local responses into unitary objects and achieve more abstract descriptions
    of these objects are crucial challenges for future research.




    Research in 3D and spatiotemporal perception also raises important issues for
    understanding the cortical processes of vision. A great deal of research and modeling
    has focused on early cortical areas, V1 and V2, as likely sites of interpolation
    processes (Mendola et al., 1999; Sugita, 1999; Bakin, Nakayama, and Gilbert, 2000;
    Seghier et al., 2000) for both illusory and occluded contours. On the basis of
    their results on 3D interpolation, Kellman, Garrigan, and Shipley (2005) suggested
    that interpolation processes involve all three spatial dimensions and are unlikely
    to be accomplished in these early areas. There are several reasons for this suggestion.
    First, orientation-sensitive units in V1 and V2 encode 2D orientation characteristics,
    which are not sufficient to account for 3D interpolation. Second, one could hypothesize
    that 2D orientations combined with outputs of disparity-sensitive cells might
    somehow provide a basis for 3D interpolation. Evidence indicates, however, that
    the type of disparity'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'information available in these early areas is insufficient: whereas relative
    disparities are needed for depth computations, V1 neurons with disparity sensitivity
    appear to be sensitive to absolute disparities, which vary with fixation (Cumming
    and Parker, 1999). Third, even relative disparities do not directly produce perception
    of depth intervals in the world. There are two problems. One is that obtaining
    a depth interval from disparity involves a constancy problem; a given depth interval
    produces different disparity differences depending on viewing distance (Wallach
    and Zuckerman, 1963). To obtain a depth interval, disparity information must be
    combined with egocentric distance information, obtained from some other source,
    to at least one point. Figure 10.13 illustrates this problem, along with a second
    one. The experimental data of Kellman et al. (2005) suggest that edge segments
    at particular slants provide the inputs to 3D interpolation processes. Slant,
    however, depends not only on the depth interval between points, but also on their
    separation. Moreover, 3D slant may be specified from a variety of sources. The
    likely substrate of 3D interpolation is some cortical area in which actual slant
    information, computed from a variety of contributing cues, is available. These
    requirements go well beyond computations that are suspected to occur in V1 or
    V2.


    Where might such computations take place? Although no definite neural locus has
    been identified, research using a single-cell recording in the


