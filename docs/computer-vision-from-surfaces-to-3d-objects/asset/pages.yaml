- pgno: 90
  md: 'Another related discretization method is called *circle pattern*; it considers
    both the combinatorics and the geometry of the original mesh and can be looked
    as a variant to circle packings. Circle pattern was proposed by Bowers and Hurdal
    (2003) and has been proven to be a minimizer of a convex energy by Bobenko and
    Springborn (2004). An efficient circle pattern algorithm was developed by Kharevych,
    Springborn, and Schröder (2006).


    # Yamabe Flow on Surfaces


    The Yamabe problem aims at finding a conformal metric with constant scalar curvature
    for compact Riemannian manifolds. The first proof (with flaws) was given by Yamabe
    (1960), which was corrected and extended to a complete proof by several researchers
    including Trudinger (1968), Aubin (1976), and Schoen (1984). A comprehensive survey
    on this topic was given by Lee and Parker (1987).


    Luo (2004) studied the discrete Yamabe flow on surfaces. He introduced a notion
    of discrete conformal change of polyhedral metric, which plays a key role in developing
    the discrete Yamabe flow and the associated variational principle in the field.
    Based on the discrete conformal class and geometric consideration, Luo gave the
    discrete Yamabe energy as an integration of a differential 1-form and proved that
    this energy is a locally convex function. He also deduced from it that the curvature
    evolution of the Yamabe flow is a heat equation.


    In a recent work of Springborn, Schröder, and Pinkall (2008), they were able to
    identify the Yamabe energy introduced by Luo with the Milnor-Lobachevsky function
    and the heat equation for the curvature evolution with the cotangent Laplace equation.
    They constructed an algorithm based on their explicit formula. Another recent
    work by Gu, Luo, and Yau (2009), which used the original discrete Yamabe energy
    from Luo (2004), has produced an equally efficient algorithm in finding the discrete
    conformal metrics.


    The rest of the chapter is organized as follows. We first introduce some basic
    concepts and theories of the surface Ricci flow in the smooth setting. Then we
    present the discrete setting and numerical algorithms to compute the flow. In
    the final section, we briefly describe the applications for brain mapping, surface
    matching, and Teichmüller shape space. Further details on discrete curvature flows
    and their variational principles can be found in Luo (2004). The details and source
    codes of the algorithms presented here can be found in Gu and Yau (2008) and Gu,
    Luo, and Yau (2009).'
