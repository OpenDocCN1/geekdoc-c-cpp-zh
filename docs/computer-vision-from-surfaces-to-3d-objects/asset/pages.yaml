    # 1.4 IMPLICATIONS TOWARD DEPTH INFERENCE


    Armed with a better understanding of the statistics of real scenes, we are better
    prepared to develop successful depth inference algorithms. One example is range
    image superresolution. Often, we may have a high-resolution color image of a scene
    but only a low spatial resolution range image (range images record the 3D distance
    between the scene and the camera for each pixel). This often happens if our range
    image was acquired by applying a stereo depth inference algorithm. Stereo algorithms
    rely on smoothness constraints, either explicitly or implicitly, and so the high-frequency
    components of the resulting range image are not reliable (Cryer et al., 1995;
    Scharstein and Szeliski, 2002). Laser range scanners are another common source
    of low-resolution range data. Laser range scanners typically acquire each pixel
    sequentially, taking up to several minutes for a high-resolution scan. These slow
    scan times can be impractical in real situations, so in many cases, only sparse
    range data are available. In other situations, inexpensive scanners are used that
    can capture only sparse depth values.


    It should be possible to improve our estimate of the high spatial frequencies
    of the range image by using monocular cues from the high-resolution intensity
    (or color) image. One recent study suggested an approach to this problem known
    as *shape recipes* (Freeman and Torralba, 2003; Torralba and Freeman, 2003). The
    basic principle of shape recipes is that a relationship between shape and appearance
    could be *learned* from the low-resolution image pair, and then *extrapolated*
    and *applied* to the high-resolution intensity image to infer the high spatial
    frequencies of the range image. One advantage of this approach is that hidden
    variables important to inference from monocular cues, such as illumination direction
    and material reflectance properties, might be implicitly learned from the low-resolution
    range and intensity images.'
