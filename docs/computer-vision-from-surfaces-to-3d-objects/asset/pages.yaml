- pgno: 180
  md: 'We saw a similar transition of coding in the case of depth: In V2, 3D edge
    selectivity emerges, and cells respond to the contours of cyclopean figures. Here
    also cells are generally selective for edge polarity, which means that they signal
    the depth ordering of surfaces at the contour. This means that these neurons signal
    edges not only for the purpose of coding shape, for which position and orientation
    of edges would be sufficient, but also for representing the surface. Perhaps the
    3D shape of the surface is also derived from the contour representation.


    Border ownership coding is the string that ties a number of diverse findings together.
    It can help us to understand how the visual cortex imposes a structure on the
    incoming sensory information and how central mechanisms use this structure for
    selective processing. Border ownership is about relating contours to regions.
    The most interesting aspect is the global shape processing that is evident from
    the differential responses to displays that are identical within a large region
    around the receptive field (Figure 8.6a,b). It implies that the four sides of
    the square are assigned to a common region, which is a form of “binding,” the
    essence of creating object representations. In our model, we propose a mechanism
    of two reciprocal types of connectivity, a converging scheme for the integration
    of feature signals, and a diverging scheme of feedback connections that set the
    gain of the feature neurons. This gain change is what leads to the observed different
    firing rates for figures on preferred and nonpreferred sides. Besides this effect
    that is caused by the visual stimulus, the feedback connections serve in top-down
    attention for the selective enhancement of the feature signals (B cells) representing
    the attended object. A large proportion of V2 neurons shows this dual influence
    of stimulus-driven grouping and top-down attentive modulation (Qiu, Sugihara,
    and von der Heydt, 2007). Moreover, the neurons show an asymmetry of attentive
    modulation that is correlated with the side of border ownership preference, as
    predicted by the model.


    Our model differs from many other models of perceptual organization in that it
    postulates a dedicated neural circuitry for the grouping. The grouping in our
    model is not the result of self-organization of activity within the cortical area
    (which would be limited by the length and conduction velocity of horizontal connections
    in the cortex), but is produced by an extra set of neurons, the G cells. We assume
    that these cells are not part of the pattern recognition pathway, but specifically
    serve to provide a structure onto which central processes can latch, forming an
    interface between feature representation and central cognitive mechanisms. This'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'specificity of function is an important difference: The G cells with their
    relatively large receptive fields do not have the high resolution required for
    form recognition. Therefore, the system needs only a relatively small number of
    G cells to cover the visual space.


    I suggest that this general scheme could also explain how the brain represents
    surfaces. A surface representation might correspond to a set of G cells that the
    system activates when a task requires specific surface information. Take the example
    of hiking in the mountains. Here, the visual system needs to provide information
    about the position of the object to be stepped on, such as a rock, and the surface
    normal at the point to be touched by the foot. The calculation of the surface
    normal would involve the activation of a cluster of G cells corresponding to the
    location of the rock, and these cells would then selectively enhance the signals
    representing the contours of the rock. The enhanced contour signals would then
    be collected by a “surface normal calculator” downstream in the pathway. Neurons
    that represent the 3D orientation of lines exist in V4 (Hinkle and Connor, 2002),
    and from the 3D orientations of the contour elements, the system could calculate
    the approximate orientation and curvature of the surface and its normal. A similar
    process can be conceived for the computation of surface color from contour signals.
    Thus, I envision surface representation more like a procedure the system can call
    when needed than a pattern of neural activity representing the surface points
    in space.


    # ENDNOTE


    ¹ “Color” in this paper refers to both chromatic and luminance dimensions. Thus,
    I include gray values among the colors.'
