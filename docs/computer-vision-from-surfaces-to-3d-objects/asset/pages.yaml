    Unlike binary edge detectors like Canny, it successfully removes the spurious
    texture edges and highlights the boundary edges, but it still has some strong
    internal edges (BC, CD, CF) that are not the depth boundaries.


    Now, to suppress these strong internal edge segments and reinforce the boundary
