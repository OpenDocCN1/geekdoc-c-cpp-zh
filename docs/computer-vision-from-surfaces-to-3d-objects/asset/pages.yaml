- pgno: 84
  md: 'network. Other work (Doya et al., 2006) relaxes the assumption of binary-valued
    variables and relates BP to a spiking network model.


    # DISCUSSION


    In this chapter, I presented an MRF framework for propagating surface information
    in 3D reconstruction in the presence of noisy and sparse depth cues. In addition
    to automatically weighing prior and likelihood information according to their
    reliability, the framework is the basis for many of the top-performing stereo
    algorithms in computer vision (see Charstein and Szeliski, 2002), and the Web
    site associated with it, vision.middlebury.edu/stereo/, which maintains up-to-date
    performance rankings of state-of-the-art stereo algorithms. While the standard
    prior used in MRF stereo algorithms imposes an unnatural fronto-parallel bias,
    promising recent work demonstrates the value of using a more realistic prior that
    accommodates the frequent occurrence of locally planar surfaces with arbitrary
    slant and tilt.


    Although 3D reconstruction algorithms have improved a lot in recent years, much
    work remains. Despite the recent emphasis on learning model parameters from training
    data, the images used for training and testing often contain more highly textured,
    colorful objects than commonly occur in real-world scenes, which casts doubt on
    the ability of even the top-performing algorithms to generalize to the real-world
    domain. Additional performance measures may need to be developed to reward algorithms
    that minimize the kinds of catastrophic inference errors that are all too common
    at present, in which the disparities of some points are estimated incorrectly
    by tens of pixels.


    More realistic priors will also be needed for algorithms to improve further. The
    price of increased realism may be the use of higher-level priors formulated to
    represent coherent surfaces, such as planar and cylindrical patches with explicit
    boundaries, rather than pixel-based depth or disparity fields.


    Another avenue for improvement will be to integrate multiple depth cues, including
    monocular cues such as shading and texture, in addition to standard disparity
    cues. (Indeed, impressive work by Saxena, Sun, and Ng, 2007, estimates a depth
    field from a single color image using such cues.) It will also be important to
    integrate information over time (i.e., multiple video frames).'
