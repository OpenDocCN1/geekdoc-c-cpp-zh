- pgno: 81
  md: 'After enough iterations, this series of “conversations” is likely to converge
    to a consensus specifying which state is most likely for each variable.


    The messages exchanged between variables in BP pass information throughout the
    MRF. Information can only be passed from variables to their immediate neighbors
    in one iteration of BP, but after enough iterations, it is possible for information
    to be passed between all variables. At the start of BP, messages express no preference
    for one state over another, but after enough iterations, the messages become more
    “opinionated,” expressing strong preferences for certain states.


    Finally, we note that stereo inference using BP (or graph cuts) is still slow
    relative to simpler (but less accurate) stereo algorithms, requiring on the order
    of seconds (or even minutes) for each pair of images. However, ongoing work on
    boosting the efficiency of these algorithms, as well as steadily improving computer
    hardware, is continually increasing execution speed.


    # Learning MRF Parameters


    The MRF model in the “Markov Random Fields for Stereo” section above has a number
    of free parameters (such as *β*, *τ*, and *μ*) that must be set correctly for
    the model to be realistic and accurate enough to make good inferences. There are
    well-established procedures (Scharstein and Pal, 2005) for learning MRF parameters
    from “labeled” data samples, in this case left/right image pairs and true (“ground
    truth”) disparities. However, until recently, few datasets included ground truth
    disparity fields, which made it difficult to learn the MRF parameters. Fortunately,
    this obstacle is being removed now that there are an increasing number of datasets
    that include ground truth, which is determined using tools such as laser range
    finders (used to measure the precise depth and, hence, disparity, of nearly every
    pixel in a scene).


    Learning MRF parameters from data not only provides a principled way of choosing
    the model parameters (which reflects the statistics of depth and intensity in
    natural scenes) but has also led to improved model performance, measured by comparing
    the disparity field estimated by the model with the ground truth disparities (Zhang
    and Seitz, 2005).


    # MORE REALISTIC PRIORS


    An important limitation of the MRF prior in Equation (3.1) is that it penalizes
    disparity differences in neighboring pixels, which implies a bias in favor of
    fronto-parallel surfaces. Such a bias is inappropriate for many real-world scenes
    with slanted surfaces. Even the toy example considered'
