- pgno: 232
  md: 'Jan Koenderink developed a toolbox of procedures for computing a specific surface
    that is maximally consistent in a least-squares sense with the overall pattern
    of an observer’s judgments for a variety of different probe tasks. The reconstructed
    surfaces obtained through these procedures almost always appear qualitatively
    similar to the stimulus objects from which they were generated, although it is
    generally the case that they are metrically distorted. These distortions are highly
    constrained, however. They typically involve a scaling or shearing transformation
    in depth that is consistent with the family of possible of 3D interpretations
    for the particular source of optical information with which the depicted surface
    is perceptually specified (see Koenderink et al., 2001).


    To summarize briefly, the literature described above shows clearly that human
    observers can make judgments about the geometric structure (e.g., depth, orientation,
    or curvature) of small, local, surface regions. Depending on the particular probe
    task employed, these judgments can sometimes be reasonably reliable for individual
    observers (see Todd et al., 1997). However, observers’ judgments often exhibit
    large systematic distortions relative to the ground truth, and there can also
    be large differences among the patterns of judgments obtained from different observers.
    It is important to point out that these perceptual distortions are almost always
    limited to a scaling or shearing transformation in depth. Thus, although observers
    seem to have minimal knowledge about the metric structures of smoothly curved
    surfaces, they are remarkably accurate in judging the more qualitative properties
    of 3D shape that are invariant over those particular affine transformations that
    define the space of perceptual ambiguity. (See Koenderink et al., 2001, for a
    more detailed discussion.)


    # FEATURE GRAPHS


    It is important to note that all of the local properties described thus far are
    metrical in nature. That is to say, it is theoretically possible for each visible
    surface point to be represented with appropriate numerical values for its depth,
    orientation, or curvature, and these values can be scaled in an appropriate space
    so that the distances between different points can be easily computed. However,
    there are other relevant aspects of local surface structure that are fundamentally
    nonmetrical and are best characterized in terms of ordinal or nominal relationships.
    Consider, for example, the drawing of an object presented in Figure 11.3. There
    is an extensive literature in both human and machine vision that has been devoted
    to the'
