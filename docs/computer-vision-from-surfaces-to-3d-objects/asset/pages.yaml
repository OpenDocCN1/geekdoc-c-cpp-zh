    at their vertices (the Vs are perceived as either vertical or horizontal). The
    reader is more likely to see the former interpretation because it is simpler.
    In Figure 6.2b, the reader perceives two closed shapes touching each other. Note
    that Figure 6.2b was produced from Figure 6.2a by “closing” two horizontal Vs.
    Closed 2D shapes on the retina are almost always produced by occluding contours
    of 3D shapes. Therefore, this interpretation is more likely. So, global closure
    is likely to change the local interpretation of an X. The fact that spatially
    global aspects, such as closure, affect spatially local percepts refutes Marr’s
    criticism of Gestalt psychology. Marr (1982) claimed that all examples of perceptual
    grouping can be explained by recursive application of local operators of proximity,
    similarity, and smoothness. If Marr were


