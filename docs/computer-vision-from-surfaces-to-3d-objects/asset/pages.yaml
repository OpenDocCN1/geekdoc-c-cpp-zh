  md: 'This is the avenue we pursue here. We reformulate a fundamental problem in
    computer vision—segmentation—in conjunction with fixation.


    A fixation lies inside a region in the image, and all the points inside the region,
    including the fixation, are enclosed by the region boundary (or depth boundary).
    Thus, segmenting the region containing the fixation is equivalent to finding the
    enclosing contour, which is a connected set of boundary edge fragments in the
    edge map of the image, around the fixation. It appears similar to the contour-based
    segmentation methods where they try to connect the contours into a closed boundary.
    But, our fixation-based algorithm is different in two ways: first, we are concerned
    with only the optimal contour enclosing the region being fixated at; second, the
    closed contour is found in the polar coordinate system rather than in the Cartesian
    space (used by (Williamо and Jacobs, 1997)), making the process of finding the
    optimal contour unaffected by the scale of the region being segmented (explained
    with an example later). Also, the contour-based completion algorithms focus only
    on the orientation of the edge fragments. We, in addition to the orientation,
    use the strength of the edge pixels to find the closed contour around the fixation.
    The strength of the edge pixel represents the probability of that edge pixel lying
    on a region boundary in the image. (Such an edge map is called a *probabilistic
    boundary edge map*.)


    We are now going to explain how we use different cues to obtain the probabilistic
    boundary edge map. We also explain the rational for using polar space instead
    of the Cartesian space for finding the optimal contour. Then, the details of our
    algorithm to obtain the optimal contour around the fixation are given.


    Finally, we must emphasize that we seek a physical definition of segmentation.
    This means that we are not simply looking for a region that contains the fixation
    point, we rather search for a surface that contains the fixation point. In other
    words, the closed boundary surrounding the figure and separating it from the background
    is a depth boundary.


    # 2.3.1 Computing Probabilistic Boundary Edge Map


    As explained before, the probabilistic boundary edge map encodes the probability
    of the edge pixels to be at the region boundary as their gray value. This means
    the edge pixels along the boundary will be brighter than the internal or textural
    edges. Ideally, we would want to have a probabilistic boundary edge map wherein
    all bright edge pixels are the points'
  merge: -1
  img_proc: true
