- pgno: 114
  md: 'This work proposes a rigorous and general framework for representing 3D surfaces
    with arbitrary topologies in 3D Euclidean space. The geometric information of
    a surface is decomposed to four layers—topology, conformal structure, Riemannian
    metric, and mean curvature—that together determine the surface unique up to a
    rigid motion.


    Ricci curvature flow is the essential tool to compute the surface representation.
    This work presents discrete curvature flow methods that are recently introduced
    into the engineering fields: the discrete Ricci flow and discrete Yamabe flow
    for surfaces. Applications for brain mapping, surface matching, and Teichmüller
    shape space are briefly explained.


    In the future, we will study the relation between the Ricci flow and the middle-level
    vision.




    This work has been supported by NSF CCF-0448399, NSF DMS-0528363, NSF DMS-0626223,
    and NSF IIS-0713145.'
