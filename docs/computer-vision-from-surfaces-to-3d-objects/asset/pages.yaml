    # The Cortex as a Phase Space


    In Sarti, Citti, and Petitot (2008), we identified the space of simple cells with
    the phase space of the retinal plane. A simple cell with the receptive field centered
    at a point \((x,y)\) can be identified with an operator that selects the direction
    of the boundary at that point. It is then identified with the form


    \[\omega=-\sin(\theta)dx+\cos(\theta)dy \tag{7.9}\]


    Note that this is a representation of a general unitary element of the contactant
    space at the fixed point or, equivalently, of the phase space. Its kernel is a
    bidimensional plane generated by the first-order operators \(X_1\) and \(X_2\),
    with the operational version of the vector fields \(X_j\), generators of the group
    and defined in Equation (7.5):


    \[X_1=\cos(\theta)\partial_x+\sin(\theta)\partial_y,\quad X_2=\partial_\theta\]


