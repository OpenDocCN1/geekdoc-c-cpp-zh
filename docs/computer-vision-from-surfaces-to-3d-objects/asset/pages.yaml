    # Experimental Studies of Contour Interpolation


    An objective performance paradigm for testing 3D contour relatability was devised
    by Kellman, Garrigan, Shipley, Yin, and Machado (2005) and is illustrated in Figure
    10.8. In their experiments, subjects were shown stereoscopically presented 3D
    planes whose edges were either relatable or not. Examples of relatable and nonrelatable
    pairs of planes are shown in the columns of Figure 10.8. Orthogonal to relatability
    are two classes of stimuli, converging and parallel planes, shown in the rows
    of Figure 10.8. In these experiments, subjects were asked to classify stimuli
    like the ones shown as either parallel or converging. The idea is that, to the
    extent that 3D relatability leads to object formation, judging the relative orientations
    of 3D relatable planes should be easier than judging the relative orientations
    of 3D nonrelatable planes.


    Kellman et al. (2005) found that subjects could make this classification more
    accurately and quickly when the planes were 3D relatable. This result


