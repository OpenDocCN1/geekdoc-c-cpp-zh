    );\n        }\n        T dequeued = items[0];\n        items.RemoveAt(0);\n  \
    \      return dequeued;\n    }\n}\n```\n\n# 增强的栈和队列操作\n\n高级操作可能涉及通过额外能力增强基本功能。例如，实现一个带有返回当前最小元素方法的栈：\n\
