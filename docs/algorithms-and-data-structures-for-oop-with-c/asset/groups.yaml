    \ 添加元素\n\n在 `ArrayList` 中，可以使用 `Add` 方法动态添加元素。在 `LinkedList` 中，可以使用 `AddFirst`\
    \ 或 `AddLast` 方法在特定位置添加元素。\n\n## ArrayList 和 LinkedList 中的 OOP 原则\n\nC# 中的 `ArrayList`\
    \ 和 `LinkedList` 在其实现上符合 OOP 原则。两者都维护了封装，确保了列表的完整性。然而，链表通过其结构在本质上展示了更多的灵性和继承。\n\
