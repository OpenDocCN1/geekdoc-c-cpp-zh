    # Purpose of Factory Method Pattern


    The Factory Method pattern aims to delegate object creation to subclasses by defining
    an interface for creating objects in a superclass. This enables the creation of
    objects without specifying the exact class of the object created, promoting flexibility
    and reusability.'
