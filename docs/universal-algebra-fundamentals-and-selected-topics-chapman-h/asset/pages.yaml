    # 7. Maltsev Varieties


    Thus locally finite, minimal variety is generated by a strictly simple algebra.
    It is reasonable to wonder about the converse: which strictly simple algebras
    generate minimal varieties? We shall give a complete answer for those algebras
    that lie in a congruence-distributive or a congruence-permutable variety.


    **Proposition 7.62.** Let A be a finite, strictly simple algebra in a congruence-distributive
    variety. Then V(A) is minimal.


    Proof. By Jónsson''s lemma, the subdirectly irreducible algebras in V(A) are members
    of HSPu(A). Since A is strictly simple, the only nontrivial member of HSPu(A)
    is itself. Thus V(A) is minimal.


    As examples, the variety of distributive lattices and implication generated (Exercise
    4.7.5) are minimal since each is congruence distributive and generated by a two-element
    algebra, which is obviously strictly simple. Moreover, every idempotent algebra
    satisfies the conditions of the above proposition, it follows from Theorem 6.17
    that almost every finite algebra generates a minimal variety.


    Now we turn to congruence-permutable varieties lying in such a variety. Suppose
    that A is a strictly simple. Then A either Abelian or nonabelian. We consider
    the two alternatives.


    **Theorem 7.63.** Let V'' be a Maltsev variety and let A be a finite, strictly
    simple, nonabelian member of V''. Then A is quasiple and V(A) is minimal.


    Proof. W'' = V(A) and F be the free W''-algebra on 3 generators. Then F is a subalgebra
    of An^n for some integer n (Exercise 4.3.3). Since A has no proper nontrivial
    subalgebras, the embedding of F into An^n can be assumed to be subdirect. Since
    A is simple and nonabelian, it is neutral. By Theorem 7.51 F is neutral, hence
    is congruence-distributive. Therefore, by Theorem 4.66, W is congruence-distributive,
    and minimal by Proposal 7.62. Finally, A is quasi-permutable by Theorem 6.10.


    **Example 7.64.** Let us revisit the binary Q generates a Maltsev variety and
    is strictly simple. Furthermore, 1 is an identity element. The binary Q is polynomially
    equivalent to a simple loop (Q;·,\,1). According to Exercise 7.40.4, if the loop
    is Abelian, then the multiplication would be commutative, which is obviously not.
    So the loop, and the binary Q, is nonabelian. Therefore by Theorem 7.63, Q is
    quasiprime, and generates a congruence-distributive variety which is minimal.


    In order to address strictly, Abelian algebras, we need a bit of modular lattice
    theory. Let L be a lattice with 1. A coatom of L is an element c such that c <
    1.'
