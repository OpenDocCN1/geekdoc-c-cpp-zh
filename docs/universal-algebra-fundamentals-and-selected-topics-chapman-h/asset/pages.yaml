  md: "# 2. Localization and induced algebras\n\n![](img/4f610fb94046e9c65f60698e9fcee011_275_0.png)\n\
    \na 2-element group structure on $N_3$, so typ$(0,\\alpha) \\in \\{2,3\\}$. If\
    \ typ$(0,\\alpha) = 3$ then $\text{Pol}(\\mathbf{A}|_{N_3})$ would contain a semilattice\
    \ operation $x \\wedge y$ on $N_3$ with, say, $1\\wedge 3=1$. However, it is easy\
    \ to see that the operation $x^y$ restricted to $N_3$ can never behave like a\
    \ semilattice operation. Thus typ$(0,\\alpha) = 2$.\n\nThe types of the remaining\
    \ two prime quotients can be determined using arguments very similar to the ones\
    \ above. Or, they can be derived from the \"transpose property,\" Theorem 8.38.\n\
    \n**Definition 8.22.** Let $\\mathbf{A}$ be a finite algebra.\n\n$\\text{typ}(\\\
    mathbf{A}) = \\{\text{typ}(\\alpha,\\beta) : \\alpha, \\beta \\in \\text{Con}(\\\
    mathbf{A}) \\text{ and } \\alpha < \\beta\\}$.\n\n$\\mathcal{X}$ is a class of\
    \ algebras, so $\\text{typ}(\\mathcal{X}) = U{\\text{typ}(\\mathbf{A}) : \\mathbf{A}\
    \ \\in \\mathcal{X}_{fin}\\}$.\n\nThe five types can be ordered as in Figure 8.4.\
    \ This poset, $\\mathcal{T}$, is derived from the ordering on the clones in Figure\
    \ 8.1 by identifying $\\mathcal{C}_0$ and $\\mathcal{C}_1$ (the two essentially\
    \ clones) and $\\mathcal{C}_5$ and $\\mathcal{C}_6$ (the two clones generated\
    \ by semilattices). Of course, the ordering on $\\mathcal{T}$ is a lattice ordering,\
    \ but the lattice operations do not seem to have any meaning in this context,\
    \ so we prefer to think of it as a poset.\n\nThere are important relationships\
    \ between properties of a variety and its set of types. Here is a simple example.\n\
    \n**Theorem 8.23.** Let $\\mathcal{V}$ be a Maltsev variety. Then $\\text{typ}(\\\
    mathcal{V}) \\in \\{2,3\\}$.\n\nProof. Let $\\mathbf{A} \\in \\mathcal{V}_{fin}$\
    \ and $(\\alpha,\\beta)$ a prime quotient in $\\text{Con}(\\mathbf{A})$. By replacing\
    \ $\\mathbf{A}$ with $\\mathbf{A}/\\alpha$ we can assume that $\\alpha=0$. Let\
    \ $U$ be a $(0,\\beta)$-minimal set, $N$ a trace of $U$, and $e \\in \\mathbf{E}(\\\
    mathbf{A})$, with $\\text{cl}(e)=U$.\n\nSince $\\mathcal{V}$ is Maltsev, there\
    \ is a Maltsev term $(x,y,z)$ on $\\mathcal{V}$. We see that $eq$ is a Maltsev\
    \ polynomial on $\\mathbf{A}|_{N}$. Since the terms and polynomials of $\\mathbf{A}|_{N}$\
    \ are the same, algebra $AIN_{fin}$ lies in a Maltsev variety. Hence it is either\
    \ affine or Boolean type.\n\nIt is obvious that for every $x,y \\in N$, $eq(x,y,y)=eq(y,x,x)=x$.\
    \ the only non-constant part of the polynomial is $eq$, in fact, a polynomial\
    \ of $\\mathbf{A}|_{N}$. For this we need to check if $a,b,c \\in N$ then $eq(a,b,c)\
    \ \\in N$. Recall that $N$ is a $\\beta[\\alpha]$-class, so if $a,b,c \\in N$\
    \ then $a \\beta b \\beta c$. So $eq(a,b,c) \\equiv \\beta eq(b,b,c)=c$, and $eq(a,b,c)\
    \ \\in U$, hence $eq(a,b,c) \\in N$."
