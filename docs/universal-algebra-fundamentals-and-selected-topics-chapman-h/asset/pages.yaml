  md: "# 4. Clones, Terms, and Equational Classes\n\n2. An $n$-ary operation $f$ on\
    \ a set $A$ is called *conservative* if, for all elements $a_1, \\dots, a_n$ in\
    \ $A$, we have $f(a_1, \\dots, a_n) \\in \\{a_1, \\dots, a_n\\}$. Prove that the\
    \ set of all conservative operations forms a clone on $A$. In fact, it is the\
    \ clone $\\mathcal{F}(\text{Rel}_1(A))$.\n\n3. Let $n$ be a positive integer and\
    \ $\\epsilon$ an equivalence relation on $\\{1, \\dots, n\\}$. For any set $A$,\
    \ we define the\n\n```\n$\\theta_\\epsilon = \\{(x_1, \\dots, x_n) : (i, j) \\\
    in \\epsilon \\implies x_i = x_j\\}$.\n```\n\n$\theta$ is called a *diagonal relation*.\
    \ Let $\\mathcal{C}$ be a clone on $A$. Prove that $\\mathcal{C} = \text{Op}(A)$\
    \ if and only if $\\mathcal{R}(\\mathcal{C})$ is the set of all diagonal relations\
    \ on $A$.\n\n4. Let $\\mathbf{A} = (A, F)$ be an algebra and $\theta \\in \\mathcal{R}(F)$\
    \ be binary. Prove or disprove: The equivalence relation on $A$ generated by $\t\
    heta$ is invariant under $F$.\n\n5. Let $A$ be a set and define $\\nu = \\{(x,\
    \ y, z) : x = y \\text{ or } y = z\\}$. Prove that the clone of essentially unary\
    \ operations, $\\mathcal{U}(A)$, is equal to $\\mathcal{F}(\\nu)$.\n\n6. Let $A$\
    \ be a set. Find a set $\\Sigma$ of relations on $A$ so that the clone $\\mathcal{E}(A)$\
    \ of idempotent operations is equal to $\\mathcal{F}(\\Sigma)$.\n\n7. Finish the\
    \ proof of Theorem 4.14. Here $A$ is finite, and let $C$ be a clone on $A$. Let\
    \ $n$ be a natural number. Enumerate the elements of $A^n$: $a_1, \\dots, a_n$.\
    \ For $n$-ary member, $g$, of $\\mathcal{C}$, let $\\hat{g} = (g(a_1), \\dots,\
    \ g(a_n)) \\in A^n$. Now define $\\theta_n = \\{\\hat{g} : g \\in \\mathcal{C}(n)\\\
    }$. Thus $\\theta_n \\in \\text{Rel}(A)$. Prove that $\\mathcal{C} = \\mathcal{F}(\\\
    {\\theta_n : n \\in \\omega\\)$.\n\n8. Let $\\alpha$ and $\beta$ be partial orders\
    \ of a set $A$. Prove that if $\\mathcal{F}(\\alpha) = \\mathcal{F}(\\beta)$ then\
    \ either $\\alpha = \\beta$ or $\\alpha = \\beta^-$. (Hint: it suffices to work\
    \ with unary operations whose range has cardinality at most 2) (Berman)\n\n# 4.3\
    \ Terms and free algebras\n\nSuppose that $\\mathbf{G} = \\langle G, \\cdot^{-1},\
    \ e\\rangle$ and $\\mathbf{H} = \\langle H, \\circ', d\\rangle$ are groups. $\\\
    text{Clo}(\\mathbf{G})$ contains a term operation mapping $(x, y)$ to $x \\cdot\
    \ y \\cdot x^{-1} \\cdot y^{-1}$. Similarly, $\\text{Clo}(\\mathbf{H})$ contains\
    \ the binary term $(x, y) \\mapsto x \\circ y \\circ'$. Of, these two operations\
    \ are completely different. After all, they are honest-goodness functions on different\
    \ sets. Nevertheless, a group theorist would refer to both of them as the commutator\
    \ operation on the respective group. We emphasize that both are built out of the\
    \ basic operations in the same way."
