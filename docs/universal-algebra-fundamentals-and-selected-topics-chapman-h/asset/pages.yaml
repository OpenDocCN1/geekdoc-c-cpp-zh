  md: '# Preface


    This text is based on the two-semester course that I have taught over the years
    at Iowa State University. In the writing, as in my course, I attempt to convey
    my enthusiasm for the subject and my feelings that it is a worthy object of study
    for both graduate students and professional mathematicians.


    In choosing the level of detail, I have taken my inspiration more from the tradition
    of first-year algebra texts such as van dererden, Lang, and Dummit and Foote,
    than from a typical research monograph. The book is addressed to newcomers to
    the field, whom I do not wish to overwhelm, more than veterans seeking an encyclopedic
    reference work.


    It is the job of the author to decide what to omit. One rule of thumb that I have
    always used in my classes is to introduce a tool only if it will be applied later
    in the course. As a teacher, I have always found frustrating to expend a lot of
    effort and class time developing some construction and not be able to demonstrate
    its importance. Thus, for example, in Chapter 7, the basics of commutator theory
    are developed in the context of congruence-permutable varieties and applied to
    the characterization of directly representable varieties. The more involved development
    in the congruence-modular case is omitted since it''s not needed for this application.


    As I have mastered as a teacher, I have come to incorporate many more examples
    into all of classes. Throughout the text a series of examples is developed that
    can be used repeatedly to illustrate new concepts as they are introduced. Whenever
    I work with objects that are already familiar to students, such as Abelian groups
    and commutative rings. Course, part of the subject is the introduction of new
    sorts of structures (quasigroups, pseudocomplemented distributive lattices, implication
    algebras) but especially by working with familiar structures, students will understand
    how this subject of universal algebra is related to topics they have already studied.


    I have also put a great deal of effort into the exercises. The number of exercises
    is not huge, and most of them are not hard. Rather, they have been carefully selected
    to complement the text and push the reader to a deeper understanding of the theorems
    and techniques presented in this section. I encourage the ambitious student to
    do every single one.


    The book is divided into two parts. Part I consists of the core components that
    I think every student of the subject must master. There is a brief first'
