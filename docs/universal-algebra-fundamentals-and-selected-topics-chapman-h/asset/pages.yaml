  md: "# 4. Commutators 219\n\nProof. $[\\alpha, \\Gamma] \\geq \bigvee_\\gamma[\\\
    alpha, \\gamma]$ holds by Proposition 7.45. Let $\beta = \bigvee_\\gamma[\\alpha,\
    \ \\gamma]$. Thus for every $\\gamma \\in \\Gamma$, $\beta$ has the $\\gamma$,\
    \ $\\alpha$-condition. We can complete the proof by showing that $\beta$ has the\
    \ $[\bigvee\\Gamma]$, $\\alpha$-condition.\n\nSo let $(a,b) \\in \bigvee\\Gamma,\
    \ (\\mathbf{c}, \\mathbf{d}) \\in \\alpha$, and $t$ a operation. By Proposition\
    \ 2.16 there are $a_0, \\dots, a_k \\in \\Gamma$ and $\\gamma_1, \\dots, \\gamma_k\
    \ \\in \\Gamma$ such that\n\n```\na = a_0 \\gamma_1 \\gamma_2 \\dots \\gamma_k\
    \ a_k = b.\n```\n\nNow using that $\beta$ has the $\\gamma_i$, $\\alpha$-condition\
    \ we deduce\n\n$t(a,c) \\beta t(a,d) \\implies t(a_0,c) \\beta t(a_0,d) \\implies\
    \ t(a_1,c) \\beta t(a_1,d) \\implies \\dots\\n\\implies t(a_k,c) \\beta t(a_k,d)\
    \ \\implies t(b,c) \\beta t(b,d).\n\nThus $\beta$ has the $\bigvee\\Gamma$, $\\\
    alpha$-condition.\n\nAs an illustration, consider a group **G** with normal subgroups\
    \ **A**, **B** and **D**. Let $\\alpha$, $\beta$ and $\\gamma$ be the corresponding\
    \ elements. Suppose that each element of **A** commutes with every element of\
    \ **B** $\\cup$ **D**. This means that $[\\alpha, \beta] = [\\alpha, \\gamma]\
    \ = 0$, from which we deduce, using Theorem 7.48, $[\\alpha, \beta \\vee \\gamma]\
    \ = 0$. This is equivalent to the obvious group-theoretic conclusion that **A**\
    \ centralizes the normal subgroup **BD**.\n\nThe properties expressed in Theorems\
    \ 7.46 and 7.48 are the ones that make the commutator such a powerful tool. The\
    \ properties expressed in-7.22 and 7.27 can be stated much more generally in terms\
    \ of the commutator.\n\n**Theorem 7.49.** Let $\\mathcal{V}$ be a Maltsev variety,\
    \ **A**, **B**, **A$_1$, **A$_2$** in $\\mathcal{V}$.\n\n+   1) If $\\mathbf{B}\
    \ \\leq \\mathbf{A}$ and $\\alpha, \\beta \\in \\text{Con A}$ then $[\\alpha,\
    \ \\beta] \\leq [\\alpha, \\beta|$.\n\n+   2) Let $h: \\mathbf{A} \\rightarrow\
    \ \\mathbf{B}$ be a surjective homomorphism, and let $\\alpha, \\beta \\in \\\
    text{Con B}$. Then $\\tilde{h}[\\alpha, \\beta] = (\\tilde{h}[\\alpha], \\tilde{h}[\\\
    beta]) \\vee h$.\n\n+   3) Let $\\alpha_1, \\beta_1 \\in \\text{Con A}_1$ and\
    \ $\\alpha_2, \\beta_2 \\in \\text{Con A}_2$. Then $[\\alpha_1 \\times \\alpha_2,\
    \ \\beta_1 \\times \\beta_2] = [\\alpha_1, \\beta_1] \\times [\\alpha_2, \\beta_2]$,\
    \ with the left-hand side contained in Con(**A$_1 \\times$ A$_2$**) and the right-hand\
    \ side in Con(**A$_1 \\times$ A$_2$**).\n\nProof. (1) Let $\\gamma = [\\alpha,\
    \ \\beta]$. Then $\\gamma^{\\Gamma} \\in \\text{C}(\\mathbf{A}, [\\alpha, \\beta])$\
    \ is a straightforward verification.\n\n(2) Let $\\tilde{\\gamma} = \\tilde{h}[\\\
    alpha, \\beta]$. Then $\\tilde{\\gamma} \\geq ker h$ by the correspondence theorem.\
    \ It is straightforward to verify that $\\gamma$ has the $\\tilde{h}[\\alpha],\
    \ \\tilde{h}[\\beta]$-term condition. Hence $\\gamma \\geq \\tilde{h}[\\alpha],\
    \ \\tilde{h}[\\beta] \\vee h$.\n\nConversely, let $\\nu = \\tilde{h}[\\alpha],\
    \ \\tilde{h}[\\beta]] \\vee h$. By Lemma 7.47, $\\nu$ has the $\\tilde{h}(\\alpha),\
    \ \\tilde{h}(\beta)$-term condition. Using this (together the synergy of $h$)\
    \ we easily check that $\\nu$ has the $\\alpha,\\beta$-term condition. Hence $\\\
    tilde{h}(\\nu) \\geq [\\alpha, \\beta]$. By the correspondence theorem again $\\\
    nu \\geq \\tilde{h}[\\alpha, \\beta] = \\gamma$."
