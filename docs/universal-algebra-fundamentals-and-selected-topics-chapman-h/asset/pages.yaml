    0_L \implies (a, b) \in \theta$.\n4. Prove that a lattice $L$ is distributive
    if for every $a < b$, the sublattice $\mathbf{I}[a, b]$ has the property that
    every element has at most one complement. (Note that $\mathbf{L}$ is not required
    to be bounded.)'
