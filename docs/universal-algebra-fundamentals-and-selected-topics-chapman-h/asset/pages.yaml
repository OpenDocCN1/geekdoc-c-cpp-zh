  md: "# 2. Direct products 53\n\n![](img/4f610fb94046e9c65f60698e9fcee011_67_0.png)\n\
    \nFIGURE 3.4: A product congruence\n\nSuppose that $\\mathbf{A} \\cong \\mathbf{A}_1\
    \ \times \\mathbf{A}_2$, and $\\eta_1$ and $\\eta_2$ are the projection kernels.\
    \ Then $\\mathbf{A}/\\eta_i \\cong \\mathbf{A}_i$ for $i=1, 2$. From the Correspondence\
    \ Theorem it follows that the lattice $\text{Con}(\\mathbf{A}_i)$ is isomorphic\
    \ to the interval $\\mathbf{I}[\\eta_i, \\mathbf{1}_A]$ of $\text{Con } \\mathbf{A}$.\
    \ Let $\\alpha$ be a congruence on $\\mathbf{A}_1$. Then, under this correspondence,\
    \ $\\alpha$ is mapped to the congruence $\\alpha_1 = \\overline{p}_1(\\alpha)$.\
    \ A better notation might be $\bar{\\alpha}_1$. Thus\n\n```\n$\\langle a_1, a_2\
    \ \rangle \\equiv_{\\alpha_1} \\langle b_1, b_2 \rangle \\iff \\alpha_1 = b_1$.\n\
    ```\n\nSimilarly, a congruence $\beta$ on $\\mathbf{A}$ corresponds to a congruence\
    \ $\beta_2$ on $\\mathbf{A}$. The congruence $\\alpha_1 \\cap \beta$ is often\
    \ denoted $\\alpha \times \beta$. In other words,\n\n```\n$\\langle a_1, a_2 \r\
    angle \\equiv_{\\alpha \times \beta} (b_1, b_2) \\iff a_1 \\equiv b_1 \\&\\ a_2\
    \ \\equiv b_2$.\n```\n\nSee Figure 3.4 for a picture. Congruences on $\\mathbf{A}_1\
    \ \times \\mathbf{A}_2$ not of the form $\\alpha \times \beta$ are called skew\
    \ congruences.\n\nTheorem 3.11 can be extended to products with finitely many\
    \ factors, see Exercise 3.15.5. But there is not particularly useful characterization\
    \ of direct products with infinitely many factors. We salvage some of the theory\
    \ as we can.\n\nLet $\\mathbf{B} = \\prod_{i \\in I} \\mathbf{A}_i$. For each\
    \ $i \\in I$ there is a surjective homomorphism $p_i : \\mathbf{B} \to \\mathbf{A}_i$\
    \ sending $f \\mapsto f(i)$. See Exercise 1.16. Let $\\eta_i = \text{ker } p_i$.\
    \ Thus for $f, g \\in \\mathbf{B}$\n\n```\n$f \\equiv \\eta_i g \\iff f(i) = g(i)$.\n\
    ```\n\nIt follows that $\\eta_i \\mathbf{B} = \\mathbf{0}$. This inspires the\
    \ next definition.\n\n**Definition 3.13.** Let $\\mathbf{A}$ and $\\mathbf{B}$,\
    \ be algebras, for all $i \\in I$, and let $h_i : \\mathbf{B} \to \\mathbf{A}$\
    \ be a homomorphism for each $i \\in I$. We say that the family $(h_i : i \\in\
    \ I)$ *separates points* if for every pair $x, y$ of distinct members of $B$,\
    \ there is some $i \\in I$ such that $h_i(x) \neq h_i(y)$.\n\nGiven a family of\
    \ $h_i : \\mathbf{B} \to \\mathbf{A}_i$ for $i \\in I$, there is a natural map\
    \ $h : \\mathbf{B} \to \\prod_{i \\in I} \\mathbf{A}_i$ given by $h(b) = f$ where\
    \ the function (that, the member of the product) $f$ is defined by $f(i) = h_i(b)$.\
    \ It seems reasonable to write $h = \\prod_{i \\in I} h_i$. The following easy\
    \ proposition summarizes the situation."
