    One consequence of Theorem 4.46 is that every subvariety of $\mathcal{A}$ is defined
    by a finite set of entities, and furthermore, there are only countably many subvarieties.
    By contrast, the lattice of all varieties is uncountable (Vaughan-Lee, Ol''shanskii[VL70,
    OI70]). Since there are only countably sets of equations, "most" varieties of
    groups are not finitely based.


    Let us move on to a couple of examples of varieties whose lattice of subvarieties
    is particularly small.


    # **Theorem 4.48.** The variety of distributive lattices has only one proper subvariety,
    namely, the trivial variety.


    Proof. Let $\mathcal{D}$ denote the variety of distributive lattices. Recall from
    Example 3.19 that the only subdirectly irreducible lattice is $\mathbf{2}$, the
    two-element chain. Suppose that $\mathcal{W}$ is a subvariety of $\mathcal{D}$.
    By Corollary 3.45 $\mathcal{W}_{si} \subseteq \mathcal{D}$. Consequently, either
    $\mathcal{W}_{si} = {\mathbf{2}\}$, in which case $\mathcal{W} = \mathcal{D}$
    or $\mathcal{W}$ has no subdirectly irreducible algebras, which is to say $\mathcal{W}$
    is the trivial variety.


    Theorem 4.48 tells us that the variety of distributive lattices is an atom in
    the lattice of varieties. Applying the Galois connection, the equationary theory
    of distributive lattices is a proper theory. Such a theory is called equationally
    complete.$2$ Other examples of equationally complete varieties are those of Boolean
    algebras, semilattices, and the varieties $\mathcal{A}_p$ of Abelian groups, for
    $p$ a prime. We shall prove in Proposition 7.61 that every nontrivial variety
    contains an equationally complete subvariety.


