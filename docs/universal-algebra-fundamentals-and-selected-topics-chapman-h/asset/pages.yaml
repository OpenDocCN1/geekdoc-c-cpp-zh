  md: '# # Chapter 5


    # ## Congruence Distributive Varieties


    In lattice theory, distributivity is the single strongest property. Distributive
    lattices have a relatively simple structure and often the key to the structure
    of an arbitrary lattice lies in isolating distributive sublattices.


    It should not be too surprising then to find that algebras with distributive congruences
    often have nice properties. As we will see in this chapter, varieties in which
    every algebra has a distributive congruence lattice themselves to deep analysis.
    The central tool is a discovery of B. Jónsson that imposes considerable structure
    on the subdirectly irreducible members. This allows an analysis of the subvarieties
    of a variety, as well as the equations satisfied by its members.


    # ### 5.1 Ultrafilters and ultraproducts


    Let **B** be a Boolean algebra. Recall that a proper filter on **B** is a nonempty,
    proper upset that is closed under meets. Equivalently, $F$ is a proper filter
    on **B**


    +   (i) $1 \in F \& 0 \notin F$;

    (ii) $x \in F \& x \le y \implies y \in F$;

    (iii) $x, y \in F \implies x \wedge y \in F$.


    We can dualize, Definition 2.30 to get the notion of a prime filter. It follows
    from Exercise 2.475 on a Boolean algebra, prime filters and maximal filters coincide.
    Maximal filters on a Boolean algebra are usually called *ultrafilters*. It is
    not hard to see that a filter $F$ is an ultrafilter and if only


    +   (iv) $x \vee y \in F \implies x \in F \text{ or } y \in F$.


    Now let $T$ be a set and **B** $= \{Sb(T), \cap, \cup, \varnothing, T\}$. In this
    context, a filter on the Boolean algebra **B** is usually called a *filter over
    T*. If we translate the above conditions, a filter over $T$ is a family $\mathcal{F}$
    of subsets of $T$'
