    cdot a_2), a_3, \\dots, a_n\\}$.\n\n+   (a) Show that every nontrivial member\
    \ of $\\mathcal{FT}$ is infinite.\n\n+   (b) Prove that $\\mathbf{A}$ is generated\
    \ by $X$ iff $\\mathbf{A}$ is generated by $X'$.\n\n+   (c) Prove that $\\mathbf{A}$\
    \ has the universal mapping property for $\\mathcal{FT}$ over $X$ iff $\\mathbf{A}$\
    \ has the universal mapping property for $\\mathcal{FT}$ over $X'$.\n\nConclude\
    \ that for any positive integers $m$ and $n$, $\\mathbf{F}_{\\mathcal{FT}}(n)\
    \ \\cong \\mathbf{F}_{\\mathcal{FT}}(m)$.\n\n# 4.4 Identities and Birkhoff’s theorem\n\
    \nNow, finally, we can formalize the idea we have been using since the first page\
    \ of this text.\n\n**Definition 4.35.** Let $\\rho$ be a similarity type. An *identity\
    \ or equation* of type $\\rho$ is an ordered pair of terms, written $p \\approx\
    \ q$, in $T_{\\rho}(X_{\\omega})$. If $\\mathbf{A}$ is an algebra of type $\\\
    rho$ we say that $\\mathbf{A}$ *satisfies* $p \\approx q$ if $p^{\\mathbf{A}}\
    \ = q^{\\mathbf{A}}$. In this situation, we write\n\n$\\mathbf{A} \\models p \\\
    approx q.$\n\nIf $\\mathcal{K}$ is a class of algebras of type $\\rho$, we write\
    \ $\\mathcal{K} \\models p \\approx q$ if, for every $\\mathbf{A} \\in \\mathcal{K}$,\
    \ $\\mathbf{A} \\models p \\approx q$. Finally, if $\\Sigma$ is a set of equations,\
    \ we write $\\mathcal{K} \\models \\Sigma$ if every member of $\\mathcal{K}$ satisfies\
    \ every member of $\\Sigma$.\n\nFor example, consider a similarity type with a\
    \ single binary operation symbol. Let $p$ be the term $(x \\cdot y)$ and $q$ the\
    \ term $(x \\cdot y) \\cdot z$. These terms are distinct. It is not correct to\
    \ write $p=q$. However, in semigroup $\\mathbf{A}$ the terms should represent\
    \ the same quantity. That is precisely the term operation $p^{\\mathbf{A}}$ and\
    \ it is correct to write $p^{\\mathbf{A}} = q^{\\mathbf{A}}$. Observe that the\
    \ equality of these two operations exactly captures the fact that for every $a,\
    \ b, c \\in \\mathbf{A}$, $\\mathbf{a} \\cdot (b \\cdot c) = (a \\cdot b) \\cdot\
    \ c$.\n\nThe satisfaction of an identity is preserved by the formation of subalgebras,\
    \ homomorphic images and products. This principle is formalized in the following\
    \ lemma, proof in Theorem 3.43, is a straightforward verification.\n\n**Lemma\
    \ 4.36.** *For any class \\mathcal{K}, each of the classes $\\mathbf{S}(\\mathcal{K}),\
    \ \\mathbf{H}(\\mathcal{K}), \\mathbf{P}(\\mathcal{K})$ and $\\mathbf{V}(\\mathcal{K})$\
    \ satisfy exactly the same identities as $\\mathcal{K}$.*"
