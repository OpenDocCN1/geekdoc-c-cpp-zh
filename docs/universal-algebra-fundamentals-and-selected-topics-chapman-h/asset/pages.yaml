  md: "# 6. Arithmetic Varieties\n\n**Example 6.13.** For a positive integer $n$,\
    \ define $W_n = \\{0, \\frac{1}{n}, \\frac{2}{n}, \\dots, \\frac{n-1}{n}\\}$ and\n\
    \n$W_n = \\langle W_n, \to, \neg, 1 \rangle$\n\nto be the algebra of similarity\
    \ type $(2, 1, 0)$ and\n\n```\n$x \\to y = \\min[1, 1 - x + y] \\quad \\text{and}\
    \ \\quad \\neg x = 1 - x$.\n```\n\nThe algebra $W_n$ is called a *Wajsberg algebra*\
    \ of cardinality $n+1$. These algebras were the earliest generalizations of classical\
    \ propositional logic to multiple values. $W_n$ is sub--primal for $n \\geq 1$.\
    \ We sketch the proof and leave the details to the interested reader.\n\nFirst,\
    \ by defining $x \\vee y = (x \\to y) \\to y$ and $x \\wedge y = \\neg(\\neg x\
    \ \\vee \\neg y)$ we see that the lattice operations $W_n$ lie in the clone. (Consider\
    \ the cases $x \\leq y$ and $x > y$ separately). Next, the $(\\neg x) \\to x$\
    \ is equal to $\\min[1, 2x]$. Through this construction, we can define a \"scalar\
    \ product\" $1 \\cdot x = x$ and $(k+1) \\cdot x = x$. Using these terms we see\
    \ that the subalgebras of $W_n$ are the algebras $W_k$ for $k$ a divisor of $n$,\
    \ generated by the single element $\\frac{1}{k}$. Thus $W_n$ satisfies all of\
    \ the conditions of Corollary 6.12 except perhaps the existence of a discriminator.\n\
    \nTo find the discriminator, first\n\n```\n$g(x, y) = n \\cdot \\neg((x \\vee\
    \ y) \\to (x \\wedge y)).$$\n```\n\nIt is easy to see that\n\n$$g(x, y) = \\begin{cases}\
    \ 0 & x = y \\ 1 & x \\neq y \\end{cases}$$$\n\nFinally the discriminator is obtained\
    \ as\n\n```\n$d(x, y, z) = (x \\wedge g(x, y)) \\vee (z \\wedge g(g(x, y), y)).$\n\
    ```\n\n**Example 6.14.** Example 6.7, the fields $\\mathbb{F}_{p^k}$ for $k >\
    \ 1$ are not subalgebra-primal unless the subalgebras (including $\\mathbb{F}_{p^k}$\
    \ itself) are not rigid. They are however, automorphism-primal, i.e., $Cl(\\mathbb{F}_{p^k})\
    \ = \\mathcal{F}(Aut(\\mathbb{F}_{p^k}))$, see [BB96a, Example 5.10].\n\n# **Exercise\
    \ 6.15.**\n\n+   1. Let $k > 2$ and $t$ be a k-ary near unanimity term for the\
