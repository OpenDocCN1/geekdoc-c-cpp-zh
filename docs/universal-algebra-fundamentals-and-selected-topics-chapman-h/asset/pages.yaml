    \ A be a finite algebra and $\\alpha < \\beta$ a prime quotient of $Con(A)$. Then\
    \ $\beta$ is Abelian over $\\alphaalpha if and only if $typ(\\alpha, \\beta) \\\
    in \\{1,2\\}$.*\n\nProof. By switching to the algebra $A/\\alpha$ we can assume\
    \ that $\\alpha=0$. (See exercise 8.39.1). So suppose that $\beta$ is an Abelian\
    \ congruence and let $N$ be a $(0, \\beta)$-trace. It follows easily from the\
    \ fact that $Pol(A|_N) = Pol(A)|_N$ and $A|_N$ is a minimal, Abelian algebra,\
    \ so as we observed just above, its type is either 1 or 2.\n\nNow consider the\
    \ converse. Assume $typ(0, \\beta) \\in \\{1,2\\}$. We must show $\\beta < \\\
    beta^*$. Since $\beta$ is an atom of $Con(A)$, it is enough to find a pair of\
    \ distinct elements $a, b, c$ such that $(a,b) \\in \\beta$ and $(a,b) \\in \\\
    beta^*$.\n\nLet $U$ be a $(0, \\beta)$-minimal set and $N$ a trace of $U^*$. Choose\
    \ distinct elements $a$ and $b$ in $N$. We will show that $(a,b) \\in \\beta^*$.\
