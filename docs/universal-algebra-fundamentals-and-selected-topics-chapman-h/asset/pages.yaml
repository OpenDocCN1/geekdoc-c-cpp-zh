  md: "# 3. The Nuts and Bolts of Universal Algebra\n\nWe remark that the two inclusions\
    \ at the bottom become equalities if $f$ is surjective (for the first) or injective\
    \ (for the second).\n\nWe now investigate this construction in the case that **A**\
    \ and **B** are algebras and $f$ a homomorphism.\n\n**Lemma 3.1.** Let $f: A \r\
    ightarrow B$ be a homomorphism. If $U$ is a subuniverse of $A$, then $f(U)$ is\
    \ a subuniverse of $B$. If $V$ is a subuniverse of $B$, then $\bar{f}(V)$ is a\
    \ subuniverse of $A$.\n\nProof. Exercise.\n\n**Theorem 3.2.** Let $f: A \rightarrow\
    \ B$ be a homomorphism. Then for any subset, $X$, of $A$, $\text{S}^A(X) = \t\
    ext{S}^B(\bar{f}(X))$.\n\nProof. It is easy to check that $\bar{f}$ is order-preserving.\
    \ Using that observation and the lemma\n\n$X \\subseteq \text{S}^A(X) \\Rightarrow\
    \ \bar{f}(X) \\subseteq \bar{f}(\text{S}^A(X)) \\Rightarrow \text{S}^B(\bar{f}(X))\
    \ \\subseteq \bar{f}(\text{S}^A(X)).$\n\nConversely, using the lemma and equations\
    \ (3-1)\n\n$X \\subseteq \bar{f}(X) \\subseteq \bar{f}(\text{S}^B(\bar{f}(X)))\
    \ \\Rightarrow \text{S}^A(X) \\subseteq \bar{f}(\text{S}^B(\bar{f}(X))) \\Rightarrow\
    \ \bar{f}(\text{S}^A(X)) \\subseteq \bar{f}(\text{S}^B(\bar{f}(X))) \\subseteq\
    \ \text{S}^B(\bar{f}(X)).\n\n**Corollary 3.3.** Let $f: A \rightarrow B$ be a\
    \ homomorphism. The map $\bar{f}: \text{Sub } A \rightarrow \text{Sub } B$ is\
    \ join-preserving and $\bar{f}: \text{Sub } B \rightarrow \text{Sub } A$ is meet-preserving.\
    \ Thus, both maps are order-preserving.\n\nProof. Follows from equations (3-1)\
    \ and Theorem 3.2.\n\nHere are a pair of examples to demonstrate that the following\
    \ corollary cannot be strengthened. Let $\\mathbb{R}$ denote the additive group\
    \ of real numbers, and define $f:\\mathbb{R}^2 \rightarrow \\mathbb{R}$ by $f(x,y)=x-y$.\
    \ It is easily seen to be a homomorphism. Let $X=\\mathbb{R} \times\\{0\\}$ and\
    \ $Y=\\{0\\}\times\\mathbb{R}$ be subalgebras of $\\mathbb{R}^2$. Then $X\\cap\
    \ Y=\\{\\{0,0\\}\\}$, but $\bar{f}(X)\\cap\bar{f}(Y)=\\mathbb{R}\\cap\\mathbb{R}=\\\
    mathbb{R}$. Thus $\bar{f}$ does not general preserves meets.\n\nFor the second\
    \ example, let $f:\\mathbf{L} \rightarrow \\mathbf{M}$ be the lattice homomorphism\
    \ given in 3.1. The map $f$ identifies $c$ and nothing else. Let $X=\\{0,\\hat{a}\\\
    }$ and $Y=\\{0,\\hat{b}\\}$ be sublattices of **M**. Then $X\\vee Y=M$ so $\b\
    ar{f}(X\\vee Y)=L$. Then $\bar{f}(X)\\vee\bar{f}(Y)=\\{{0,a\\}\\vee\\{0,b\\}=\\\
    {0,a,b,c\\}$. Thus $\bar{f}$ is not join-preserving.\n\nWe can extend this to\
    \ congruences, or to arbitrary n-ary relations. If $\theta \\subseteq \\psi^2$,\
    \ then $B^2$ defines\n\n```\n$\bar{f}(\theta)=\\{(f(x), f(y)) : (x,y) \\in \\\
    theta\\ \\text{ and}$\n$\\bar{f}(\\psi)=\\{(x,y) \\in A^{2} : (f(x), f(y)) \\\
    in \\psi\\}$.\n```"
