  md: "# 2. Lattices\n\nLet $\\langle P, \\le \rangle$ be a poset, $X \\subseteq P$\
    \ and $a \\in P$. Let us write $a \\preceq X$ to indicate that $a \\le x$, for\
    \ all $x \\in X$. When $a \\preceq X$, we call $a$ a *lower bound* of $X$. The\
    \ element $a$ is the *greatest lower bound* or infimum of $X$ if\n\n```\n$a \\\
    preceq X \\text{ and } (\\forall p \\in P) \\ p \\preceq X \\implies p \\le a$.\n\
    ```\n\nThere are analogous definitions of *upper bound* and *least upper bound*\
    \ (a.k.a. supremum.).\n\n**Definition 2.1.** A poset $\\langle P, \\le \\rangle$\
    \ is called a *lattice* if every pair of elements of $P$ has a supremum and an\
    \ infimum.\n\nWe have two definitions of a lattice: one just above and the other\
    \ in Definition 1.7. The two definitions are equivalent in the following sense.\
    \ Starting with a poset satisfying Definition 2.1 there is a transformation\n\n\
    ```\n$\\langle P, \\wedge, \\vee \\rangle \\mapsto x \\wedge y = \\inf\\{x, y\\\
    }\\text{ and } x \\vee y = \\sup\\{x, y\\}$\n```\n\nyielding an algebra satisfying\
    \ the conditions in Definition 1.7. Conversely, let $\\langle P, \\wedge, \\vee\
    \ \\rangle$ be a lattice (as an algebra). For any $x, y$ in $P$, we have $x =\
    \ x \\wedge y$ and only if $y = x \\vee y$\n\n```\n$x = x \\wedge y \\implies\
    \ x \\vee y = (x \\wedge y) \\vee y = y$\n```\n\nwith the last equality between\
    \ $(c_{\\vee})$ and $(c_{\\wedge})$. Now one can easily see\n\n```\n$\\langle\
    \ P, \\wedge, \\vee \\rangle \\mapsto \\langle P, \\le \\rangle \\quad x \\le\
    \ y \\iff x = x \\wedge y$\n```\n\ntransforms a lattice in the sense of 1.7 to\
    \ be as in 2.1. Moreover, these two transformations are inverse to each other.\n\
