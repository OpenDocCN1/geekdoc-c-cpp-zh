  md: '# 1. Ultrafilters and ultraproducts


    Notice that


    $a \eta_J b \iff J \subseteq [[a=b]].$


    It is easy to check that $\mathbf{A}/\eta_{\mathcal{K}} \cong \prod_{j \in J}
    \mathbf{A}_j$. Note also that for subsets $J$ and $K$, $\eta_J \cup \eta_{\mathcal{K}}
    = \eta_J \cap \eta_{\mathcal{K}}$.


    Let $\mathcal{F}$ be a filter over $I$. We define


    $$\eta_{\mathcal{F}} = \{(a,b) \in \mathbf{A}^2 : [[a=b]] \in \mathcal{F}\$


    It is straightforward to verify that $\eta_{\mathcal{F}}$ is a congruence relation
    on $\mathbf{A}$. If $\mathcal{F} = j$, we have $\eta_{\mathcal{F}} = \eta_j$.


    The quotient structure $\mathbf{A}/\eta_{\mathcal{F}}$ is called a *reduced product*.
    In the special case that $\mathcal{F}$ is an ultrafilter, it is called an *ultraproduct*.
    If all the algebras $\mathbf{A}_j$ are isomorphic to a single algebra, say $\mathbf{B}$,
    then the ultraproduct $\mathbf{A}/\eta_{\mathcal{F}}$ is an *ultrapower*, and
    we call it $\mathbf{B}''/\eta_{\mathcal{F}}$.


    It turns out that for a great many properties $\varphi$ \u003 and any ultrafilter
    $\mathcal{U}$, $\mathbf{A}/\eta_{\mathcal{U}}$ satisfies $\varphi$ if and only
    if $[\varphi] \in \mathcal{U}$. In particular, we shall prove in Theorem 5.21
    that this is true when $\varphi$ is any first-order formula. The exercises contain
    some specific examples.


    We introduce new class operators.


    **Definition 5.3.** $\mathcal{K}$ be a class of algebras.


    +   $\mathbf{P}_{\mathcal{K}}(\mathcal{K})$ = the class of all algebras isomorphic
    to reduced products of members of $\mathcal{K}$


    +   $\mathbf{P}_{\mathcal{U}}(\mathcal{K})$ = the class of all algebras isomorphic
    to ultraproducts of members of $\mathcal{K}$.


    It follows from the definitions that $\mathbf{P}_{\mathcal{U}} \le \mathbf{P}_{\mathcal{K}}
    \le \mathbf{HP}$. In particular, varieties are closed under the formation of ultraproducts.
    We present a few other relationships involving these operators.


    **Theorem 5.4.** (1) $\mathbf{P}_{\mathbf{S}} \le \mathbf{SP}_{\mathcal{U}}$.


    +   (2) $\mathbf{P}_{\mathbf{P}} \le \mathbf{SPP}_{\mathcal{U}}$.


    +   (3) $\mathbf{P}_{\mathbf{P}} \le \mathbf{SP}_{\mathcal{U}}$.


    +   (4) $\mathbf{P}_{\mathbf{S}} \le \mathbf{SPP}_{\mathcal{U}}$.


    *Proof.* For the first claim above that $\mathcal{F} = \{I\}$ is a filter over
    $I$ and $\eta_{\mathcal{F}}$ is the identity congruence on $\prod_I \mathbf{A}_j$.
    The second claim is easy and is left to the reader.


    Let us consider (3). Suppose $\mathbf{A} = (\prod_J \mathbf{B}_j)/\eta_{\mathcal{U}}$
    in which $\mathcal{U}$ is an ultrafilter over $J$ and for every $j \in J$, $\mathbf{B}_j
    = \prod_{I_j} \mathbf{C}_i$. Without loss of generality assume that the sets $I_j$
    are pairwise disjoint.'
