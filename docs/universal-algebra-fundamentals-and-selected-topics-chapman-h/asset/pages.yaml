  md: "# 3. Terms and free algebras\n\nRecall that a similarity type is a function\
    \ $\rho: \\mathcal{F} \to \\omega$ where the members of the index set $\\mathcal{F}$\
    \ are called the *operation symbols* of $\rho$. If $f$ is an operation symbol\
    \ and $\\mathbf{A}$ is an algebra of type $\rho$, we usually write $f^A$ to denote\
    \ the basic operation on $\\mathbf{A}$ indexed by $f$. Just as we can build other\
    \ operations in $Clo(A)$ by composing the basic operations, we wish to extend\
    \ the idea of operation symbol to include formal objects that correspond, in any\
    \ given algebra, to the terms on the operation.\n\nFix a similarity type $\rho:\
    \ \\mathcal{F} \to \\omega$, and let $X$ be a set disjoint from $\\mathcal{F}$.\
    \ The elements of $X$ are called *variables*. For every $n \\in \\omega$, let\
    \ $\\mathcal{F}_n = \rho(n)$, in other words, the set of $n$-ary operation symbols.\
    \ A word on $X \\cup \\mathcal{F}$ we mean a nonempty, finite sequence of members\
    \ of $X \\cup \\mathcal{F}$. We define the concatenation of sequences by simple\
    \ juxtaposition.\n\n**Definition 4.19.** *Let $\rho: \\mathcal{F} \to \\omega$\
    \ be a similarity type and $X$ a set disjoint from $\\mathcal{F}$. We define,\
    \ by recursion on $n$, the sets $T_n$ of terms over $X$ by*\n\n+   $T_0 = \\{w\
    \ : w \\in X \\cup \\mathcal{F}\\;\nT_{n+1} = T_n \\cup \\{fs_1s_2\\dots s_k :\
    \ f \\in \\mathcal{F}, k=\rho(n)$ and $s_1,\\dots,s_k \\in T_n\\}$.\n\nFinally,\
    \ we define $T_\rho(X)$ as the set of terms of type $\rho$ over $X$.\n\nMany (not\
    \ all) mathematicians will write $f(s_1, \\dots, s_n)$ instead of $fs_1\\dots\
    \ s_n$. If $w$ is an element of $T_\rho(X)$, we usually identify $w$ and $(w)$.\
    \ Over, if $f$ is a unary or binary symbol, we would probably write something\
    \ like $s'$ or $s \\cdot t$, or whatever is appropriate to the context.\n\nA complicated\
    \ term is a sequence consisting of several operation symbols interspersed with\
    \ variables. We use the notation $t(x_1,\\dots,x_n)$ to denote a term whose variables\
    \ are $x_1,\\dots,x_n$. For example, if $f$ is a binary symbol and $g$ is unary,\
    \ then the term\n\n$g(x,y,z), f(x,y,z))$ which is formally $(f,g,x,y,z,f,x,z)$\n\
    \nis denoted $t(x,y,z)$ if we don't care to indicate the exact form of the term.\n\
    \nReferring again to Definition 4.19, if $w$ is a term, we define $|w|$ to be\
    \ the length such that $w \\in T_n$, called the height of $w$. The height is a\
    \ useful index for recursion and induction.\n\nNotice that $T_\rho(X)$ is nonempty\
    \ if and only if either $X$ or $\\mathcal{F}_0$ is nonempty. As long as $T_\r\
    ho(X)$ is nonempty, we can impose an algebraic structure of type $\rho$.\n\n**Definition\
    \ 4.20.** *For every basic $n$-ary operation symbol $f$ of type $\rho$ let $f^{T_\r\
    ho(X)}$ be the $n$-ary operation that maps an $n$-tuple $(t_1,\\dots,t_n)$ to\
    \ the term $t_1\\dots t_n$. We define $T_\rho(X)$ to be the algebra with universe\
    \ $T_\rho(X)$ and basic operations $f^{T_\rho(X)}$ for $f \\in \\mathcal{F}$.*\n\
    \nThe construction of $T_\rho(X)$ may seem to be making something out of nothing.\
    \ But it plays a crucial role in the theory."
