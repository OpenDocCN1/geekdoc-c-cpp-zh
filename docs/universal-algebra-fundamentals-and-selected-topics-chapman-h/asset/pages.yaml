  md: '# 2. Localization and induced algebras


    The members of $M_A(\alpha, \beta)$ are called $(\alpha, \beta)$-minimal sets
    of **A**.


    Notice that the minimal members of $S$ considered in the simple case are precisely
    the members of $M_A(0,1)$. However, in the general setting a minimal set can have
    a much more complex structure than in a simple algebra. We shall develop some
    tools to study minimal sets.


    A subset $K$ of $Pol_1(A)$ is called a right ideal if $f \in K$ and $g \in Pol_1(A)$
    implies $f \circ g \in K$.


    **Lemma 8.12.** *Let A be an algebra, a right ideal of $Pol_1(A)$, and $\alpha
    < \beta$ in $Con(A)$. Then*


    ```

    $\gamma = {(x, y) : (\forall f \in K) f(x) \equiv_{\alpha} f(y))$

    ```


    is a congruence on $\alpha$ with $\alpha \leq \beta$.


    Proof. It is easy to see that $\gamma$ is an equivalence relation on $A$ and $\alpha
    \subseteq \beta$. To verify that $\gamma$ is a congruence on $A$ it is enough
    to show that every $g \in Pol_1(A), g \in \gamma$. But if $(x, y) \in \gamma$
    then $f \in K$ implies $fg \in K$, so $(fg(x), fg(y)) \in \gamma$. This is precisely
    the condition $(g(x), g(y)) \in \gamma$. $\square$


    Let us establish two fundamental properties that we alluded to above.


    **Theorem 8.13.** *Let A be a finite algebra and $\alpha < \beta$ two congruences
    on **A**. Every, $(\alpha, \beta)$-minimal set is a neighborhood of **A**.*


    Let $U \in M_A(\beta)$ and define $K = {f \in Pol_1(A) : \tilde{f}(U) \subseteq
    U\}$. Observe that $K$ is a right ideal of the semigroup $Pol_1(A)$. By Lemma
    8.12, the congruence $\gamma$ in (8-6) is a congruence with $\alpha \leq \gamma
    \leq \beta$.


    By assumption, there is an $f \in Sep(\alpha, \beta)$ such that $U = \tilde{f}(U)$.
    Choose a pair $(a, b) \in \beta$ such that $(f(a), f(b)) \notin \alpha$. Then
    $(a, b) \notin \gamma$. Thus $\gammagamma \neq \beta$. Since $\alpha < \beta$
    we have $\gamma \neq \alpha$. Now, if $(f(a), f(b)) \notin \gamma$, then there
    is $g \in K$ such that $(gf(a), gf(b)) \notin \alpha$. Therefore $f \in Sep(\alpha,
    \beta)$ and $\tilde{f}(A) \subseteq U$. $\square$


    We see that $\tilde{gf}(U) = \tilde{g}(U) \subseteq U$. By the minimality of $U$
    we have $g$ be a permutation of $U$. Let $k$ be the order of $g$ as a permutation
    of $U$. Let $U = \tilde{g}(U) \subseteq \tilde{g}(A) \subseteq U$ we have $\tilde{g}(U)
    = U$. Let $e = g^k$. Then $U = e(A)$ and $U$ is a neighborhoodhood of **A**. $\square$


    Suppose that $U \in M_A(\alpha, \beta)$ and $U = e(A)$ for some $e \in E(A)$.
    It is useful to keep in mind that $e$ is the identity on $U$. Also, since there
    are $a, b \in U$ with $(a, b) \in \beta$, we see that $(e(a), e(b)) = (a, b) \in
    \beta$. Thus $e \in Sep(\alpha, \beta)$.


    **Definition 8.14.** *Let A be an algebra. Two subsets $X$ and $Y$ of **A** are
    called polynomially isomorphic in **A** if there are $f, g \in Pol_1(A)$ such
    that $f|X$ and $g|Y$ are inverse mappings. We write $X \simeq Y$ if there is a
    polynomial isomorphism from $X$ to $Y$.


    The constructions we have been developing very nearly-polynomial isomorphism,
    as the following lemma attends.'
