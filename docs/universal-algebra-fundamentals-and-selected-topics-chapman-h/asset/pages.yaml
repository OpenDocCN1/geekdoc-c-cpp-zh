  md: Finally, local finiteness is used in Corollary 8.56 only to prove that (3) implies
    (1). Kearns and Kiss [KK] prove the more general assertion that if $\mathcal{V}$
    is an arbitrary variety with a Taylor term, then no algebra in $\mathcal{V}$ has
    a nontrivial, strongly Abelian congruence.
