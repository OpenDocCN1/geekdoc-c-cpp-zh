  md: "# 4. Clones, Terms, and Equational Classes\n\n**Theorem 4.21.** Let $\\rho$\
    \ be a similarity type.\n\n+   (1) $\\mathbf{T}_{\rho}(X)$ is generated by $X$.\n\
    \n+   (2) For every algebra $A$ of type $\\rho$ and every function $h: X \\to\
    \ A$ there is a unique homomorphism $h: \\mathbf{T}_{\rho}(X) \\to A$ such that\
    \ $h|_{|X} = h$.\n\nProof. The definition of $\\mathbf{T}_{\rho}(X)$ exactly parallels\
    \ the construction in Theorem 1.14. For (1), (2), we define $h(t)$ by induction\
    \ on $|t|$. Suppose $|t| = 0$. Then $t \\in X \\mathcal{K} \\mathcal{F}_0$. If\
    \ $t \\in X$ we define $h(t) = \\mathbf{h}(t)$. For $t \\in \\mathcal{F}_0$, $\\\
    mathbf{h}(t)=t^A$. Note that since $A$ is an algebra of type $\\rho$ and $t$ is\
    \ a nullary operation symbol, $t^A$ is defined.\n\nFor the inductive step, let\
