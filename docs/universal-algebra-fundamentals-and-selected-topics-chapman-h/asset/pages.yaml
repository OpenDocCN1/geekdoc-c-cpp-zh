  md: "# 5. Congruence Distributive Varieties\n\nThus $\theta = Cg(a,b)$.\n\nUnfortunately,\
    \ DPC is a bit too to apply broadly. For example, nondistributive variety of lattices\
    \ has definable principal congruences. (For distributive lattices, see Exercise\
    \ 5.41.1.) In [BW02], Baker and Wang-introduced an interesting generalization\
    \ of definable principal congruences and used it to achieve effect.\n\n**Definition\
    \ 5.34.** A variety $\\mathcal{V}$ has definable principal subcongruences (DPSC)\
    \ if there are congruence formulas $\\pi$ such that for all $\\mathcal{B} \\in\
    \ \\mathcal{V}$ and $a,b \\in \\mathcal{B}$ with $a \neq b$, there are $c,d \\\
    in \\mathcal{B}$ with $c \neq d$ such that $\\mathcal{B} \\models \\pi(c,d,a,b)$\
    \ and $\\mathcal{B} \\models \\psi(c,d)$.\n\nDPSC is a bit mysterious. It says\
    \ that for every $a$ and $b$, there is a principal congruence contained in $Cg(a,b)$\
    \ that is defined by $\\psi$, and we get to that principal subcongruence via $\\\
    pi$.\n\nObserve that DPC implies DPSC. For $\\mathcal{V}$ has DPC with defining\
    \ formula $\\pi = \\psi$, $c=a$ and $d=b$ in Definition 5.34. As we now show,\
    \ DPSC is strong enough to obtain a finite basis\n\n**Theorem 5.35** (Baker and\
    \ Wang, 2002). *Let $\\mathcal{V}$ be a variety with definable principal subcongruences\
    \ such that $\\mathcal{V}_{si}$ is finitely axiomatizable. Then $\\mathcal{V}$\
    \ is finitely based.*\n\nIn order to connect the finite axiomatizability of $\\\
    mathcal{V}_{si}$ to that of $\\mathcal{V}$, we need the following result of Jónsson’s\
    \ [J79].\n\n**Theorem 5.36.** *Let $\\mathcal{V}$ be a variety, $\\mathcal{F}$\
    \ and $\\mathcal{K}$ elementary classes. Suppose that*\n\n+   (i) $\\mathcal{V}\
    \ \\subseteq \\mathcal{F}$\n(ii) $F_{si} \\subseteq \\mathcal{K}$\n(iii) Both\
    \ $\\mathcal{F}$ and $\\mathcal{F} \\cap \\mathcal{K}$ are strictly elementary.\n\
    \nThen $\\mathcal{V}$ is finitely based.\n\nProof. By Exercise 5.25.3, it is enough\
    \ to show that $\\mathcal{F} - \\mathcal{V}$ is closed under ultraproducts. Let\
    \ $\\mathcal{B}_i \\in \\mathcal{F}$ for $i \\in I$, and suppose that $\\mathcal{A}\
    \ = (\\prod \\mathcal{B}_i)/\\eta_U \\in \\mathcal{V}$ for some ultrafilter $U$\
    \ on $I$.\n\nBy Birkhoff’s representation theorem, every $\\mathcal{B}$, must\
    \ have a subdirectly irreducible homomorphic image, $C_i$, with $C_i \\notin \\\
    mathcal{V}$. $\\mathcal{A}' = (\\prod C_i)/\\eta'$. $\\mathcal{A}'$, in a natural\
    \ way, is a homomorphic image of $\\mathcal{A}$. Thus $\\mathcal{A}' \\in \\mathcal{V}\
    \ \\subseteq \\mathcal{F}$.\n\nSince $\\mathcal{K}' = \\mathcal{F} \\setminus\
    \ \\mathcal{K}$ is strictly elementary, its complement is closed under ultraproducts.\
    \ Thus $\\mathcal{A}' \\in \\mathcal{K}' \\neq \\mathcal{K}'$.\n\nLet $J = \\\
    {i : i \\in I, C_i \\in \\mathcal{F}\\}$. Since $\\mathcal{F}$ is finitely axiomatizable\
    \ and $\\mathcal{A}' \\in \\mathcal{F}$ we must have $J \\in \\mathcal{U}$. Let\
    \ $U' = \\{X \\cap J : X \\in \\mathcal{U}\\}$. Using the same argument as in\
    \ Theorem 5.6(1), $\\mathcal{A}' \\cong (\\prod C_j)/\\eta'$.\n\nFor every $j\
    \ \\in J, C_j \\in F_{si} \\subseteq \\mathcal{K}$ and $\\mathcal{K}$ is elementary,\
