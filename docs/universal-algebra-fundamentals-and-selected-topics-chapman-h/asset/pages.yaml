  md: "# 8. Finite Algebras and Locally Finite Varieties\n\n**Corollary 8.36.** Let\
    \ *A* be a finite $(\\alpha, \beta)$-minimal algebra in which $\\alpha < \beta$.\
    \ Let *B* denote the body and the trace of *A* respectively.\n\n+   (1) If $\t\
    ext{typ}(\\alpha, \beta) = 5$ then $B=N, N/\\alpha=\\{O, I\\}$ and $I=\\{1\\}$.\
    \ For any $0 \\in O$ there is a polynomial $f$ such that $\\{0,1\\}, f(\\{0,1\\\
    })$ is a meet-semillattice.\n\n+   (2) If $\text{typ}(\\alpha, \beta) = 4$ then\
    \ $B=N=\\{0,1\\}$ and $A|_N$ is polynomially equivalent to a 2-element lattice.\n\
    \n+   (3) If $\text{typ}(\\alpha, \beta) = 3$ then $B=N=\\{0\\}$ and $A|_N$ is\
    \ polynomially equivalent to a 2-element Boolean algebra.\n\n+   (4) If $\text{typ}(\\\
    alpha, \beta) = 2$ then there is an idempotent polynomial $q$ such that $q|_B$\
    \ is a Maltsev operation.\n\nProof. The first three parts follow easily from Lemma\
    \ 8.32 and Theorem 8.33. Let $(\\alpha,\beta)$ be Abelian. In Proposition 8.35\
    \ we constructed a polynomial $q_0$ which induces a Maltsev operation on $B$.\
    \ Let $g(x)=q_0(x,x,x)$. Since $q$ is idempotent on $B$, we must have $g \\in\
    \ \text{Sep}(\\alpha,\beta)$. By minimality, $g$ is a permutation of $A$. Thus\
    \ $q(x,y,z)=g^{-1}q_0(x,y,z)$ is the desired idempotent polynomial induction on\
    \ $B$.\n\nWe can utilize these last results to prove that if two quotients are,\
    \ they share the same type. Recall that the intervals $[I_0, \beta_0]$ and $[I_1,\
    \ \beta_1]$ are called traces, and we write $[I_0, \beta_0] \\lhd [I_1, \beta_1]$\
    \ if $\\alpha_0=\\alpha$ and $\beta_0\\alpha=\beta_1$.\n\n**Lemma 8.37.** Let\
    \ $U$ be a neighborhood of the finite algebra $A$, $\theta$ a congruence on $N$,\
    \ a $\theta_U$-class. The mapping $\\psi \\mapsto \\psi[N]$ is a surjective lattice\
    \ homomorphism from $[I,\theta]$ to $\text{Con}(A|_N)$.\n\nProof. The map in question\
    \ is the composition of the restriction maps\n\n$[I,\theta] \\xrightarrow{u} [I,\t\
    heta] \\xrightarrow{N} \text{Con}(A|_N)$.\n\nWe know from Theorem 8.10 that the\
    \ first of these is a lattice homomorphism. Then we as well assume that $U=A$.\
    \ The restriction map always preserves meets. That restriction preserves joins\
    \ of congruences in $I[0,\theta]$ follows easily from Corollary 2.19. Finally,\
    \ to see that the map is surjective, let $\\psi \\in \text{Con}(A|_N)$ and define\n\
    \n$\\widehat{\\psi} = \\{(x,y) \\in \theta : (\\forall f \\in \text{Pol}_1(A))\
    \ :\n\n$f(x), f(y)\\} \\cap N \neq \\emptyset \\implies f(x) \\equiv_\\psi f(y)$.\n\
    \nIt is straightforward to verify that $\\widehat{\\psi}$ is a congruence on $A$\
    \ and that $\\psi|_N \\leq \\psi$. By the reverse induction, suppose $(x,y) \\\
    in \\psi, f \\in \text{Pol}_1(A)$ and $f(x)$ is in $N$. Then $N$ is a $\theta$-class,\
    \ $f(N) \\subseteq N$, so $f|_N \\in \text{Pol}_1(A|_N)$. Therefore $f(x) \\equiv_\\\
    psi f(y)$.\n\n![](img/4f610fb94046e9c65f60698e9fcee011_286_0.png)"
