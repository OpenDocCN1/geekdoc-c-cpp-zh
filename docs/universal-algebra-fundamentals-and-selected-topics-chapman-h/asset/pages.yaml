  md: '# 2. Lattices


    Notice that the closure operator from topology fails to be algebraic. It is natural
    to wonder what additional properties the lattice of closed subsets will have for
    an algebraic closure operator.


    **Definition 2.29. Let L** be a complete lattice.


    +   (1) An element $a \in L$ is compact if for every $X \subseteq L$,


    ```

    $$a \leq \overline{X} \Longrightarrow (\exists Z \subseteq_\omega X) a \leq \overline{Z}$

    ```


    +   (2) **L** is an *algebraic lattice* if every element is the join of compact
    elements.


    **Theorem 2.30.** Let $C$ be an algebraic closure operator on $A$. Then $L_C$
    is an algebraic lattice. The compact elements of $L_C$ are those sets of the form
    $C(Y)$ for $Y$ a finite subset of $A$.


    *Proof.* As an aid to readability, we will write $\overline{X}$ in place of $C(X)$.
    First let $Y = \{y_1, \dots, y_n\}$ be a finite subset. We show that $\overline{Y}$
    is compact in $L_C$. Suppose that $\overline{Y} \subseteq \overline{X}$ for some
    family $\mathcal{X}''$ of closed subsets.


    ```

    $$\overline{Y} \subseteq \overline{X} = \overline{\mathcal{X}''} = \overline{\{Z
    : Z \subseteq_\omega \mathcal{X}''\}}$

    ```


    Therefore, for each $j \leq n$ there exist $Z_j \subseteq_\omega \mathcal{X}''$
    such that $y_j \in \overline{Z_j}$. Let $Z = Z_1 \cup Z_2 \cup \dots \cup Z_n$.
    Certainly $\overline{Y} \subseteq \overline{Z}$. Since $\overline{Y}$ is finite,
    there is a finite subfamily of $\mathcal{X}''$ such that $Z \subseteq \overline{Z}$.
    Therefore


    ```

    $$\overline{Y} \subseteq \overline{Z} \subseteq \overline{\{Z\}} = \overline{Z}$

    ```


    $\overline{Y}$ is compact.


    Conversely, let $X$ be any compact element of $L_C$. Using the facts that $X$
    is closed, $C$ is algebraic, and Theorem 2.25(3),


    ```

    $$X = \overline{X} = \overline{\{Z : Z \subseteq_\omega X\}} = \overline{\\{Z
    : Z \subseteq_\omega X\}}$

    ```


    Since $X$ is compact, the join on the right-hand can be replaced by a finite subjoin.
    That is, there are $Z_1, Z_2, \dots, Z_n \subseteq_\omega X$ such that $X = \bigvee_{i=1}^n
    Z_i = Z$ where $Z = Z_1 \cup \dots \cup Z_n$ is finite.


    Finally, to show that $L_C$ is algebraic, $X \in L_C$. Since $C$ is algebraic,
    $\overline{X} = \overline{\\{Z : Z \subseteq_\omega X\}}$ is a join of compact
    elements. $\square$


    **Corollary 2.31.** Let $A$ be an algebra. Then both **Sub(A)** and **Con(A)**
    are algebraic lattices. The compact elements are the finitely generated subalgebras
    and congruences respectively.'
