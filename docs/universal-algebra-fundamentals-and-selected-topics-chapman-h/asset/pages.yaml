  md: '# 8. Finite Algebras and Locally Finite Varieties


    Rather express this property as an inclusion, Hobby and McKenzie chose to express
    it as an *omitting types theorem*. Thus, a Maltsev variety omits the types $[1,4,5]$.
    Note that this 3-element set is a downset in the poset $T$. One of the significant
    achievements of congruence theory is a characterization, for each of the downsets
    of $T$, of those varieties that omit that [HM85, Chapter 9].


    We conclude this section with a lemma that is useful in finding idempotent operations.
    It is considered folklore, and perhaps it is, although Knuth[Knnu81] attributes
    it to R. W. Floyd.


    **Lemma 8.24.** *Let S be a finite algebra and $f: S \rightarrow S$ a function.
    There is a positive integer $n$ such that $f^n = f^{2n}$.*


    Proof. There are only finitely many self-maps of $S$, so there are positive integers
    $k$ and $n$ such that $f^k = f^{k+n} = f^{k+2n} = \dots$. Thus we may assume that
    $f^k = f^{k+n}$ and $n \geq k$. Then $f^n = f^k \circ f^{n-k} = f^{k+n} \circ
    f^{n-k} = f^{2n}$. $\square$


    # **Exercise 8.25.**


    +   1. Let A be a finite algebra and $U \subseteq \mathbf{A}$. Show that $\text{Pol}(\mathbf{A}|_U)
    = \text{Pol}(\mathbf{A})|_U$.


    +   2. Be be an algebra and $B$ a subalgebra. Show that for every $f \in \text{Pol}(\mathbf{B})$
    there is an $f \in \text{Pol}(\mathbf{A})$ such that $f|_B = f$. (Hint: this is
    similar to the first paragraph of Lemma 8.18).


    +   3. Let A be a finite algebra and $\alpha < \beta$ a prime quotient of $\text{Con}(\mathbf{A})$.
    Let $\theta = \alpha \cup U\{N : N \text{ is an } \alpha,\beta\text{-trace}\}$.
    Show that $\beta$ is the transitive closure of $\theta$, i.e., $\theta = \beta
    \cup (\theta \circ \theta) \cup (\theta \circ \theta \circ \theta) \dots .$.


    +   4. Let A be a finite algebra and $\alpha < \beta$ a prime quotient in $\text{Con}(\mathbf{A})$.
    Show that there are $u, v$ in $\mathbf{A}$ with $\alpha \beta v$ and for such
    pairs, $N = \{u, v\}$ is an $(\alpha,\beta)\text{-trace}$ of type 4.


    +   5. Let B be the algebra of Theorem 5.28 with $n=3$. Verify that $\text{Con}(\mathbf{B})$
    is a 3-element chain with monolith $\mu = \{012u\}$. Show that $\text{type}(\mathbf{B})
    = \{3, 5\}$.


    +   6. Let A = $(\{0, 1, 2, 3, 4\}, \cdot)$ with the operation being multiplication
    modulo 5. Verify that $\text{Con}(\mathbf{A})$ is a 4-element chain with congruences
    $\alpha = \{014|23\}$ and $\beta = \{01234\}$. Determine $\text{type}(\mathbf{A})$.


    +   7. Prove that if $\mathcal{V}$ is congruence-distributive then $\text{type}(\mathcal{V})$
    omits $\{1,2,5\}$. (Hint: use Theorem 4.66 to imitate the argument in 8.23).'
