  md: "# 2. Invariant relations\n\nProof. Let $\\psi$ be the binary relation described\
    \ in the theorem. 4.4 attempts to illustrate the construction. Since $\theta \\\
    subseteq Cg(\theta)$ and the latter relation is preserved by $F_{(A)}$, we obtain\
    \ $\\psi \\subseteq Cg(\theta)$. Conversely, $\\psi$ is clearly designed to be\
    \ an equivalence relation. Since the identity mapping is a member of $F_{(A)}$\
    \ by definition, $\theta \\subseteq \\psi$. We verify that $\\psi$ is invariant\
    \ under $F_{(A)}$, and we can conclude that $\\psi$ is invariant so $Cg(\theta)\
    \ \\subseteq \\psi$.\n\nTo see this, $(a, b) \\in \\psi$ via the intermediate\
    \ points $z_0, z_1, \\dots, z_n$ and polynomials $f_0, \\dots, f_{n-1}$. For any\
    \ $g \\in F_{(A)}$ we get $g(a) \\equiv g(b)$ via the intermediate points $g(z_0),\
    \ \\dots, g(z_n)$ and mappings $gf_0, \\dots, gf_{n-1}$. Note that each $gf_i\
    \ \\in F_{(A)}$ since this set of polynomials is closed under composition.\n\n\
    It is easy to see that we can replace, in Theorem 4.17, the monoid $F_{(A)}$ with\
    \ the larger monoid $Pol_{(A)}$ and obtain the same result. This is the way the\
    \ theorem is usually stated in the literature.\n\nTheorem 4.17 will see a good\
    \ deal of use in the study of finitely based algebras (Section 5.5). For now we\
    \ use a simple example to illustrate the theorem.\n\nLet **R** be a commutative\
    \ ring and let $c, d$ be elements of $R$. We wish to apply Theorem 4.17 to determine\
    \ the congruence generated by $(c, d)$. The elementary translations are operations\
    \ of the form $f_r(x) = rx$ and $g_s(x) = x + s$, for each $r, s \\in R$. It follows\
    \ that the set $F_{(R)}$ from the theorem will be equal to $\\{rx + s : r, s \\\
    in R\\}$, in which case, coincides with $Pol(\\mathbf{R})$.\n\nThe theorem yields\
    \ a sequence $z_0, z_1, \\dots, z_n$ in which each pair $\\{z_i, z_{i+1}\\}$ is\
    \ of the form $\\{r_ic+s_i, r_id+s_i\\}$ and allows us to conclude that $(z_0,\
    \ z_n) \\in Cg(c, d)$. In the case of sequences, the relations all collapse. For\
    \ example, suppose that $n = 2$. We have relationships of the form\n\n```\n$z_0\
    \ = r_0c + s_0\nz_1 = r_0d + s_0 = r_1c + s_1\nz_2 = r_1d + s_1$.\n```\n\nThen\
    \ $s_0 = r_1c + s_1 - r_0$ so that\n\n```\n$z_0 = (r_0 + r_1)c + (s_1 - r_0)$\
    \ while $z_2 = (r_0 + r_1)d + (s_1 - r_0)$.\n```\n\nBy proceeding on induction,\
    \ one can conclude\n\n```\n$C^R(c,d) = \\{(rc+s, rd+s) : r, s \\in R\\}$.\n```\n\
    \n# Exercise Set 4.18.\n\n+   1. Let '<' be the strict less-than relation on $\\\
    {0, 1\\}$. Show that $\\mathcal{F}(<) = \\mathcal{F}(\\{0\\}, \\{1\\})$. Is this\
    \ the clone as $\\mathcal{F}(\\{0, 1\\})$?"
