  md: '# Chapter 2


    # Lattices


    Lattices play a curious double role in universal algebra. On the one hand the
    lattice concept provides a framework for studying many derived objects that apply
    to any algebraic structure: the collections of all subalgebras, congruences, varieties,
    and clones all lattices. On the other hand, lattices are algebras in their own
    right. As algebras they have some strong properties, and, more important, properties
    that are rather different from the ones we are familiar with from the study of
    groups and rings.


    Thus we devote a whole chapter to lattices. While we won''t delve deeply into
    the study of lattices-as-algebras, we develop enough of the theory to allow us
    to use it later in our examples.


    # 2.1 Ordered sets


    Let P be a nonempty set, and let σ be a binary relation on P. σ is called a (partial)
    ordering of P if it is reflexive, transitive and antisymmetric:


    ```

    ∀x, y \in P) σ y ∧ y x ⇒ x = y

    ```


    (cf. the definition of an ordering on page 14). We usually write x ≤ instead of
    x σ. The pair (P, ≤) is frequently called a poset. Naturally, we sometimes write
    x ≥ instead of x ≤. A poset is called linear, sometimes, a chain if it satisfies


    ```

    ∀x, y \in P) x ≤ ∨ y ≤ x.

    ```


    Posets can be depicted as graphs with vertices representing the elements and edges
    extending upwards to indicate the ordering. These graphs are called Hasse diagrams.
    For example, the poset on {a, b, c, d} with a < d and c < b has the Hasse diagram
    to the right.


    ![](img/4f610fb94046e9c65f60698e9fcee011_35_0.png)


    The dual of a poset P = (P, ≤) is the poset (P, σ^), which we will denote by P°.
    You can think of this poset obtained by turning P upside down. The Hasse diagram
    for P^ is indeed obtained from that of P in this way.'
