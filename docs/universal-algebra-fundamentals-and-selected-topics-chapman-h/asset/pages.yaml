    # 1.3 More about subalgebras, homomorphisms and direct products


    99.9% of the time, when we refer to several algebras in the same breath they will
    be all of the similarity type. In fact, we frequently neglect to state that hypothesis
    explicit. From this perspective it is logical to fix a similarity type and then
    consider algebras of that type.


    Thus, instead of $f$, let us take for an index set family $\mathcal{F}$ of operation
    symbols, and let $\rho:\mathcal{F} \to \omega$. Then by use an algebra $\mathcal{A}$
    of type $\rho$ we mean a set $A$ together with, for each operation symbol $f \in
    \mathcal{F}$, an operation $f^{\mathbf{A}}$ of rank $\rho(f)$. Thus


    $\mathbf{A}=\langle\mathcal{A}, \mathcal{F}^{\mathbf{A}}\rangle$ where $\mathcal{F}^{\mathbf{A}}=\langle
    f^{\mathbf{A}}:f \in \mathcal{F}\rangle$.


    Sometimes it is useful to throw away operations. For example, we may want to discuss
    the additive structure of $a$, or view a group as being merely a monoid. If $\mathbf{A}=\langle\mathcal{A},
    F\rangle$ is an algebra and $G$ is a subsequence of $F$, then the algebra $\mathbf{B}=\langle\mathcal{A},
    G\rangle$ is called a *reduct* of $\mathcal{A}$, and $A$ is called expansion of
    $B$.


    It is frequently to take intersections of subalgebras of an algebra. But there
    are two technical problems with this. First, strictly speaking, subalgebras are
    not sets, so we must intersect their respective universes. Second, it is possible
    for two subalgebras to have disjoint universes, but we are not allowing empty
    algebras. To cope with these technicalities, we introduce the following definition.'
