  md: "# # Introduction to Part II\n\nWe have thus far discussed several properties\
    \ that a variety may or not possess. For example, a variety $\\mathcal{V}'$ is\
    \ called finite if every finitely generated member is finite, and $\\mathcal{V}'$\
    \ is finitely generated if it is of the form $\\mathbf{V}(\\mathcal{X})$ where\
    \ $\\mathcal{X}$ is a finite set of finite algebras. We have also seen some implications\
    \ that hold among these properties. In Theorem 3.49 we proved that every finitely\
    \ generated variety is locally finite.\n\nThis aspect of universal algebra is\
    \ the primary focus of Part II. More precisely, the central theme is the structure\
    \ of congruence lattices. More than any other, this has proved to be a key organizing\
    \ principle in the study of varieties.\n\nRecall that an algebra is congruence-distributive\
    \ if its congruence lattice is distributive. Similarly, it is called congruence-permutable\
    \ if its congruences permute. Not surprisingly, we call an algebra congruence-modular\
    \ if its lattice is modular. Finally, an algebra that is both congruence-distributive\
    \ and congruence-permutable is called arithmetical.\n\nWe extend these definitions\
    \ to varieties in a natural way. If $X$ is one of the above properties, then is\
    \ it not true that a variety is $X$ if and only if every member is $X$. Congruence-permutable\
    \ varieties are also called Maltsev varieties.\n\nA word of caution: an algebra\
    \ property $X$ that its generated variety has $X$. For example the two-element\
    \ semilattice 2 is simple, so it is congruence-distributive and congruence-permutable.\
    \ However, $\\mathbf{V}(2)$ is the variety of all semilattices, which is neither\
    \ congruence-distributive nor permutable.\n\nSince every distributive lattice\
    \ is modular, congruence-distributivity automatically implies congruence-modularity.\
    \ But the following proposition, which is not strictly speaking a lattice-theoretic\
    \ fact, is unexpected.\n\n**Proposition.** *Every congruence-permutable algebra\
    \ is congruence-modular.*\n\n*Proof.* **Let A be an algebra with permuting congruences**\
    \ and let $\\alpha, \beta, \\gamma$ be members of $\\mathbf{Con}(A)$ with $\\\
    alpha \\subseteq \beta$. We wish to show that $\beta \\wedge (\\alpha \\vee \\\
    gamma) \\subseteq \\alpha \\vee (\beta \\wedge \\gamma)$. Applying permutability,\
    \ this is equivalent to\n\n```\n$\\beta \\wedge(\\alpha \\circ \\gamma) = \\alpha\
    \ \\circ(\\beta \\wedge \\gamma)$.\n```\n\nSo let $(a,b) \\in \beta (\\alpha \\\
    circ \\gamma)$. Thus $a \beta b$ and there is $c \\in A$ such that $a \\alpha\
    \ c \\gamma b$. Since $\\alpha \\subseteq \beta$ we get $a \beta c$ and since\
    \ $\\gamma \\subseteq \beta$ we have $c \beta b$. Then $a \\alpha (\beta \\wedge\
    \ \\gamma) b$ as desired. $\\square$"
