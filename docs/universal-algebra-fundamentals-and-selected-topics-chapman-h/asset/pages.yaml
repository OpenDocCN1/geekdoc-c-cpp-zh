  md: '# 3. Terms and free algebras


    **Proposition 4.24.** Let $U_1$ and $U_2$ be free in $\mathcal{K}$ over $X_1$
    and $X_2$ respectively. If $|X_1| = |X_2|$ then $U_1 \cong U_2$.


    *Proof.* As $X_1$ and $X_2$ have the same cardinality, there is a bijection $h:
    X_1 \to X_2$. Since $U_2 \in \mathcal{K}$ and $X_1$, there is a homomorphism $h:
    U_1 \to U_2$ extending $h$. Similarly, since $U_2$ is free for $\mathcal{K}$ and
    $U_1 \in \mathcal{K}$, there is a homomorphism $h_2: U_2 \to U_1$ extending $h^{-1}$.


    Now $h_2 \circ h$ is an endomorphism of $U_1$, extending the identity on $X_1$.
    Of course, the identity map on $U_1$ is also an extension of the identity on $X_1$.
    Therefore by Proposition 4.23, $h_2 \circ h_1$ is the identity on $U_1$. A similar
    argument shows that $h_1 \circ h_2$ is the identity on $U_2$. Thus $U_1 \cong
    U_2$. $\square$


    Note that Proposition 4.24 applies to algebras that are free in $\mathcal{K}$.
    It tells us that up to isomorphism, a free algebra is determined by the cardinality
    of a free generating set. According to the next proposition, freeness extends
    upwards from a class $\mathcal{K}$ to its generated variety.


    # **Proposition 4.25.** Let $U$ be free in $\mathcal{K}$ over $X$. Then it is
    free in $HSP(X)$ over $X$.


    *Proof.* Let $U$ be free in $\mathcal{K}$ over $X$. It is enough to show that
    if $O$ is one of $\mathbf{H}$, $\mathbf{S}$ or $\mathbf{P}$ then $U$ has the universal
    mapping property of $O(X)$ over $X$.


    Consider the case $A \in H(X)$. Then there is $B \in \mathcal{K}$ and a surjective
    homomorphism $h: B \to A$. Let $h: X \to A$ be a function. We must find an extension
    of $h$ to a homomorphism from $U$ to $A$. For each $x \in X$ choose an element
    $b_x \in f(h(x))$. Define the function $g: X \to B$ with $g(x) = b_x$. Since $U$
    is free for $\mathcal{K}$ and $B \in \mathcal{K}$, it extends to a homomorphism
    $\tilde{g}: U \to B$. Then $f \circ g$ is the desired extension of $h$.


    Now assume that $A \in S(X)$. Thus $A \subseteq B$. A mapping from $X$ to $A$
    is automatically a mapping to $B$. By freeness we get homomorphisms: $h$ extends
    to a homomorphism $h^*: U \to B$. Since $X$ generates $U$,


    ```

    $h^*(U) = h^*(Sp^U(X)) = Sp^B(h(X)) \subseteq A$

    ```


    By Theorem 3.2. Consequently, $h^*$ is actually a map from $U$ to $A$.


    Finally, assume that $A \in B(\{B_i\, B_i \in \mathcal{K}})$. If $h: X \to A$
    for each $i$, $p_i \circ h$ is a mapping from $X$ to $B_i$. By freeness we get
    homomorphisms $h_i: U \to B$, which can be reassembled to obtain $h = \Pi h_i:
    U \to A$ $\square$


    As an example, $Z_n$ denote the cyclic group of order $n$. The group $Z_{30}$
    is free for $\mathcal{K} = \{Z_2, Z_3\}$. Thus, $Z_{30}$ is free for $HSP(X)$,
    which happens to be the variety of Abelian groups satisfying the identity $6x
    \approx 0$. But note that $Z_{30}$ is not a member of $\mathcal{A}_6$. In construct
    an algebra free in $\mathcal{A}_6$, we must resort to a homomorphic image of $Z_{30}$
    that retains the universal mapping property, in this case $Z_6$. This approach
    applies quite generally. Let us study the details.'
