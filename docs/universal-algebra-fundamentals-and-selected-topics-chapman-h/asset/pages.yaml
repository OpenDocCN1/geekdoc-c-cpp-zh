    As the last example shows, the class of bounded distributive lattices that are
    pseudocomplemented is not closed under the formation of sublattices. Consider
    also the lattice L, whose Hesse diagram is


    ![](img/4f610fb94046e9c65f60698e9fcee011_78_0.png)


    The pseudocomplement of c is b. In the sublattice L - {b} (which is also pseudocomplemented),
    c* = a.


    In universal algebra, the standard way to avoid these pathologies is to add operations
    to the type. In this case, we add a single unary operation that returns the pseudocomplement
    of element.


    Definition 3.32. A p-algebra is an algebra (L, ∧, ∨, *, 0, 1) of similarity type
    (2, 2, 1, 0, 0) satisfying all of the identities (3–2), and further, the condition:


    ```

    (∀x) x ∧ a = 0 ⇔ x ≤ a*.

    ```


    Pa denotes the class of all p-algebras.


    In the literature, the algebraic structure we defined is generally called a distributive
    p-algebra (since the lattice is distributive), or frequently, a pseudocomplemented
    distributive lattice. We will just call them p-algebras since we won''t be considering
    more than that.


    Note that every Boolean algebra is a p-algebra (by Example 3.31.1). As the other
    examples show, the class Pa is strictly larger than the class Ba of Boolean algebras.


    We begin with some properties that hold in any p-algebra.'
