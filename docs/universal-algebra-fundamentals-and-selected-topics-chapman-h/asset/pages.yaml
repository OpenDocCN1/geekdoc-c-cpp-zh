    # 3.5 Varieties and other classes of algebras


    Recall from Definition 1.10 the operators H, S and P that can be applied to a
    class $\mathcal{K}$ of similar algebras. That is, $H(\mathcal{K})$, $S(\mathcal{K})$
    and $P(\mathcal{K})$ represent the closure of the class $\mathcal{K}$ under the
    formation of homomorphic images, subalgebras and products, respectively. (In practice,
    $\mathcal{K}$ is usually not a set but rather a proper class. There are some set-theoretic
    inherent in any discussion of a class of classes. Putting those aside, we observe
    that each of these are closure operators on the class of all classes of algebras
    of any particular similarity.)


    To more precise, we require each of the classes $H(\mathcal{K})$, $S(\mathcal{K})$
    and $P(\mathcal{K})$ consists of all algebras that can be embedded in a member
    of $\mathcal{K}$, and $P(\mathcal{K})$ consists of all algebras that have a direct
    representation by members of $\mathcal{K}$. Furthermore, we define the “empty
    product” to be a trivial algebra, so that $P(\mathcal{K})$ contains all trivial
    algebras. Let us add one operator to our list.


    **Definition 3.40.** For any class $\mathcal{K}$ of algebras, $P_s(\mathcal{K})$
    denote the class of all algebras isomorphic to a subdirect product of members
    of $\mathcal{K}$.


    These operators can be composed, forming more closure operators. If $O_1$ and
    $O_2$ are closure operators on classes, we can say that $O_1 \le O_2$, if for
    every class $\mathcal{K}$, we have $O_1(\mathcal{K}) \subseteq O_2(\mathcal{K})$.
    The following lemma, whose proof is left as an exercise, gives few important relationships.


    **Lemma 3.41.** $SH \le HS$, $P_s \le SP$ and $PH \le HP$. Trivially, $P_s \le
    SP$.'
