    # 7.7 Functionally complete algebras


    Recall from Definition 6.4 that a finite algebra **A** is primal if every operation
    on $A$ is induced by a term. As we saw in the subsequent theorem, primal algebras
    have very strong properties. One consequence of the definition is that a primal
    algebra must have every constant (unary) operation. One might wonder what happens
    if we bend the rules a bit and throw in a constant symbol for each element of
    an algebra. This is equivalent to the following.


    **Definition 7.70.** A finite algebra **A** is called *functionally complete*
    if $\mathbf{Pol \ A} = \mathbf{Op(A)}$.


    In other words


    For any algebra $A = \langle A, F\rangle$, let $A^+$ denote the algebra with universe
    $A$ and basic operations of $F$ together with a constant null operation for each
    member of $A$. Observe that regardless of the properties of the algebra **A, A^+$**
    is rigid and has no subalgebras. On the other hand since the addition of constant
    operations does not affect congruences, we have $\mathbf{Con(A) = \mathbf{Con(A^+)}$.


    It is immediate from the definition that **A** is functionally complete if and
    only if $A^+$ is primal. Since primal algebra is simple, it follows from the previous
    paragraph that every functionally complete algebra must be as well. It is entirely
    possible for a functionally complete algebra to have subalgebras and automorphisms.
    It is also possible for a functionally complete algebra to generate a variety
    that is not congruence modular. This has made them much harder to characterize
    primal algebras.


    A useful tool in the study of primal algebras is the discriminator operation,
    introduced in Definition 6.9. It turns out to play a decisive role here as well.'
