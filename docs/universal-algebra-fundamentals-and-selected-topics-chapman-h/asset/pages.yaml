    Let 2 denote the two-element chain, viewed as a lattice. We usually write $2 =
    \{0,1\}$ in this context. Suppose $h: L \rightarrow 2$ is a surjective lattice
    homomorphism, and let $I = h^{-1}(0)$. Then $I$ is a prime ideal of $L$. Conversely,
    every prime ideal of a lattice $L$, there is a surjective homomorphism $h: L \rightarrow
    2$ such that $I = h^{-1}(0)$. Thus there is a one-to-one correspondence between
    prime ideals and homomorphisms onto 2.


    **Theorem 2.41** (The Prime Ideal Theorem). Let $L$ be a distributive lattice,
    $I$ an ideal and $F$ a filter of $L$, and suppose $I \cap F = \varnothing$. Then
    there is a prime ideal $P$ such that $I \subseteq P$ and $P \cap F = \varnothing$.


    Proof. Let $S = \{J : J \text{ is an ideal}, I \subseteq J, J \cap F = \varnothing\}$.
    Surely $I \in S$, so $S$ is nonempty. We wish to apply Zorn''s lemma to obtain
    a maximal element of $S$. Let $C$ be a chain in $S$ and take $J = \bigcup C$.
    It is straightforward to check that $J \in S$.


    Therefore, $S$ has a maximal element, $P$. We must show that $P$ is prime. Suppose
    that there are $a, b \notin P$ such that $a \wedge b \in P$.


    ```

    $J = \{p \vee x : p \in P, x \leq a\}$ and $K = \{p \vee y : p \in P, y \leq b\}$

    ```


    Using the distributivity of $L$ and the fact that $P$ is an ideal it is easy to
    show that $J$ is an ideal. Also, $P \subseteq J$ if $p \in P$ then $p = p \vee
    (p \wedge a) \in J$. Finally since $a = (a \wedge P) \vee a \in J - P$ we have
    a proper extension of $P$. By the maximality of $P$ in $S$ it must be that $J$
    intersects $F$. Similarly $K \cap F = \varnothing$.


    Thus there are $x \leq a, y \leq b$, and $p, q \in P$ such that $p \vee x$ and
    $q \vee y$ are members of $F$. Since $F$ is a filter, we can contain $z = (p \vee
    x) \vee (q \wedge x) \vee (x \wedge y) \in P$


    ```

    $z = (p \wedge q) \vee (p \wedge y) \vee (x \wedge y) \in P$

    ```


    since each of the three members lies below either $p$ or $q$ (hence in $P$) and
    the fourth is dominated by $a \wedge b$ which is in $P$ by assumption. Thus $P
    \cap F = \varnothing$. This contradiction proves the theorem.


    **Corollary 2.42.** In a distributive lattice, every proper ideal is an intersection
    of prime ideals.


    Proof. Let $I$ be a proper ideal of a distributive lattice $L$. For each $x \in
    L$ let $F = \{x\}$ and apply the Prime Ideal Theorem.


    For a distributive lattice $L$, let $PrM(L)$ denote the set of prime ideals of
    $L$.


    ```

    $P_a = \{P \in PrM(L) : a \notin P\$

    ```


    For $a \in L$, this is a weak form of the representation theorem for distributive
    lattices, proved by Birkhoff (1933) and strengthened by Stone (1936).


    **Theorem 2.43.** Let $L$ be a distributive lattice. There is a lattice embedding
    of $L$ into $Sb(PrM(L), \varnothing, U)$.'
