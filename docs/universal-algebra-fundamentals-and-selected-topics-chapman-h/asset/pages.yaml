  md: '# Preface


    x chapter introduces the central concepts of operation, algebra and homomorphism.
    This should be an easy conceptual step for anyone with a modest background in
    abstract algebra. The discussion of the set of subalgebras and congruences provides
    natural motivation for the second chapter on lattices.


    The emphasis on Chapter 2 is on complete and algebraic lattices. We do include
    a brief diversion into distributivity and modularity, but primary focus is on
    lattices that are near closure operators, including Galois connections.


    Chapter 3 covers direct and indirect products and the isomorphism theorems. It
    is at this point that we begin to develop some of our primary examples. We characterize
    irreducible Abelian groups, commutative rings that satisfy xⁿ ≈ 1, distributive
    lattices, and pseudocomplemented lattices. We then use these characterizations
    to study the lattices of subvarieties of each of these classes of algebras.


    In Chapter 4 we introduce the definition of a clone of operations. From this point
    on we take every opportunity to discuss concepts from a clone-theoretic point
    of view. Terms and term algebras are covered as the natural analog of term operations
    and clones. I know from experience that free algebras are difficult to grasp,
    so we devote several pages to them. Of course, the whole point is to prove Birkhoff''s
    theorem that the notions of variety and equation class coincide. Part I concludes
    with a derivation of the most finite Maltsev conditions, which seem to fit nicely
    with our discussion of terms and free algebras.


    Part II is, as billed, a selection of topics that I feel illustrate the power
    and breadth of the subject. These seemed to divide naturally according to the
    properties of congruence lattices, the chapter titles shouldn''t be taken religiously.
    Chapter 5 covers the consequences of Jónsson''s lemma and Baker''s theorem on
    finitely based algebras. While we are at it, we provide an example of a nonfinitely
    based algebra and a discussion of definable principal congruences.


    Chapter 6 treats the work of Foster and Pixley on primal and quasipral algebras.
    It also includes a proof of Murskii''s theorem that almost every finite algebra
    is primal. Many instructors will probably choose to skip this proof because of
    its length and nature, relying as it, on asymptotics. First, because I was anxious
    to include the to be counterintuitive upon first learning it. Second, because
    this particular proof, largely due to Bob Quackenbush, is really quite nice; and
    third, because the only published proof in English is a translation from the original
    Russian that is very hard to find.


    The goal in Chapter 7 is Ralph McKenzie''s characterization of directly representable
    varieties. To my mind, this theorem is the best illustration of the power of the
    universal algebraic toolbox. In order to get a complete, it is necessary to develop
    the commutator operation on congruences as well as provide a complete characterization
    of congruence-permutable Abelian varieties.'
