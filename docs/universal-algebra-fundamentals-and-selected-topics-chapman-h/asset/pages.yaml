    The uniqueness of a concurrence is a natural. Naturally we begin by investigating
    this concept in the context of a few familiar algebraic structures.


    **Example 7.18.** Suppose **A** is a group with identity $e$, a concurrence $\alpha$
    on $N = e/\alpha$. Then $e/\alpha^* = \{a \mid (x \in N) ax = xa\}$. The set what
    is generally called the concurrence, $C(N)$, of $N$ in group theory.


    Proof. $M = e/\alpha^*$. Take any $a \in M$ and $d \in N$. Then $(e, a) \in \alpha^*$
    and $(d, e) \in \alpha$. Consider the term $t(x, y) = yxy^{-1}$. Since $t(e, d)
    = t(e, d)$, and the definition of $\alpha^*$ yields $t(a, e) = t(a, d)$. Thus
    $eae^{-1} = dad^{-1}$, i.e. and $d$ commute. This shows $M \subseteq C(N)$.


    Conversely, let $a \in C(N)$. We wish to show that $(a, e) \in \alpha^*$. We must
    apply Definition 7.16. Let $t \in Clon_{n+1}(\mathbf{A})$ and $c, a$ and $d$.
    We must show


    ```

    $t(c, d) \iff t(a, d) = t(a, d). \quad (7-7)$

