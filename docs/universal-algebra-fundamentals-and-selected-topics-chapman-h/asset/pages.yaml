    direction uses the same argument as in Theorem 4.38. So assume that $p^F(y_1,\dots,y_n)
    = q^F(y_1,\dots,y_n)$, where we have written $F$ in place of $F_{\mathfrak{K}}(Y)$.
    To show that $\mathfrak{K} \models p \approx q$, let $A \in \mathfrak{K}$ and
    $a_1, \dots, a_n \in A$. We must show $p^A(a_1, \dots, a_n) = q^A(a_1, \dots,
    a_n)$. There is a homomorphism $h: F \to A$ such that $h(y_i) = a_i$ for $i \le
    n$. Then


    ```

    $p^A(a_1,\dots,a_n) = p^A(hy_1,\dots,hy_n) = h(p^F(y_1,\dots,y_n)) =\nhh(q^F(y_1,\dots,y_n))
    = q^A(a_1,\dots,a_n).$

    ```


    The alert reader will have noticed that $\models$ constitutes a binary relation
    between the class of all algebras and the set of all equations (of some fixed
    similarity type). As as a good universal algebraist, said reader will immediately
    thought: “Galois Connection!” Indeed it is, and perhaps the most important one
    in the set. Let us give names to the polarities.


    **Definition 4.40.** $\mathfrak{K}$ be a class of algebras and $\Sigma$ a set
    of equations, of similarity type $\rho$. We define


    ```

    $Id(\mathfrak{K}) = \{p \approx q : \mathfrak{K} \models p \approx q\}\nMod(\Sigma)
    = \{A : \mathbf{A} \models \Sigma\}$.

    ```


    Classes of the Mod($\Sigma$) are called *equational classes*, and $\Sigma$ is
    called an *equational base* or an *axiomatization* of the class. The class of
    *models* of $\Sigma$. Dually, a set of identities of the form $Id(\mathfrakmathfrak{K})$
    is called an equational theory.


    From the general theory of Galois connections in Section 2.5, $Mod \circ Id$ and
    $Id \circ Mod$ are closure operators and a dual-isomorphism between the lattices
    of closed sets. The equational classes are precisely the closed sets of algebras;
    the equational theories are the closed sets of equations. The theory of Galois
    connections does not tell us more than that. In particular, it does not tell us
    whether either of these closure operators is algebraic. We should address that
    question in the next section.


    It follows from Lemma 4.36 that every equational class is a variety, a principle
    we have been tacitly applying since page 1. In 1935, Birkhoff[Bir35] demonstrated
    that the converse was true.


    # **Theorem 4.41.** *Every variety is an equational class.*


