    **Definition 7.33.** An *Abelian group* is an algebra $A = (A, q)$ in which $q$
    is a Maltsev operation and $A^3 \rightarrow A$ is a homomorphism.


    Notice that the class of Abelian groups forms a variety, by three identities:
    to establish that $q$ is Maltsev and a single 9-variable identity that asserts
    that $q$ is a homomorphism. What do these algebras have to do with Abelian groups?
    The following theorem provides the answer.


    **Theorem 7.34.** Let $A = (A, q)$ be an Abelian group and fix $0 \in A$. Define
    $x+y = q(x, 0, y)$ and $y-x = q(0, x, 0)$. Then $(A, +, -, 0)$ is an Abelian group.
    Furthermore, $q(x, y, z) = x - y + z$.


    Proof. Consider a $3 \times 3$ matrix of variables. That $q$ is a homomorphism
    with respect to it is equivalent to the assertion that $q$ across the rows of
    the matrix and then applying $q$ to the result is the same as first applying $q$
    to the columns by $q$ on the result.


