  md: '# 8. Finite Algebras and Locally Finite Varieties


    We give a little preview of the connection with minimal algebras. Let **A** be
    a finite algebra. Consider the family of subsets


    $\mathcal{S} = \ \hat{h}(\mathbf{A}) : h \in \text{Pol}(\mathbf{A}) \quad \& |\hat{h}(\mathbf{A})|
    > 1 \}$


    Let U be a (under inclusion) member of this family. We shall show in Lemma 8.13
    that U is a neighborhood of **A**, that is, $U = \overline{e}(\mathbf{A})$ for
    some $e \in E(\mathbf{A})$. Thus by the above theorem, the induced algebra $\mathbf{A}|_U$
    is simple.


    Now consider a constant polynomial, $f$ of $\mathbf{A}|_U$. By definition, $f=g|U$
    for $g \in \text{Pol}(\mathbf{A})$ with $\hat{g}(U) \subseteq U$. Define the polynomial
    $h=ge$ of **A**. We have $\hat{h}(\mathbf{A}) = \hat{g}(U) = \hat{f}(U)$ which
    is a nontrivial subset of $U$. By the minimality of $U$ we must have $\hat{h}(\mathbf{A})
    = U$. Thus $f$ is a permutation of $U$. This shows that $\mathbf{A}|_U$ is a minimal
    algebra as defined in the previous section. (And this is the motivation for the
    term "minimal")


    Furthermore, it will follow from Theorem 8.16 that if $U$ and $V$ are minimal
    members of $\mathcal{S}$ then $\mathbf{A}|_U \cong \mathbf{A}|_V$. So simple finite
    algebra has associated with it unique minimal algebra.


    As an example, consider a finite, nonabelian group, **A**. We showed in Theorem
    7.72 that **A** is function complete. Therefore every two-element subset $\{u,b\}$
    is a minimal member of $\mathcal{S}$. Since $\text{Pol}(\mathbf{A}) = \text{Op}(\mathbf{A})$
    it is not hard to see that $\text{Pol}(\mathbf{A}|_U) = \text{Op}(U)$. Thus the
    minimal algebra $\mathbf{A}|_U$ is Boolean type as defined at the end of the last
    section.


    Another example, consider the algebra **B** in Theorem 5.28 with $n > 3$. This
    algebra is simple. To see this, observe first that if $(i,u) \in \theta$ for $i
    < n$ and congruence $\theta$, then by multiplying by $i+1$ we get $(i+1, u) \in
    \theta$. So the only congruence with this property is $1_{\theta}$. Suppose now
    that $\{i,j\} \in \theta$ for some $0 \le i < j < n$. Choose $k$ adjacent to one,
    not both, of $i$ and $j$ in the graph defining **B** (see Figure 5.3). Multiplication
    by $k$ yields $(u,k) \in \theta$ which, as we saw, is enough to conclude that
    $\theta=1$. Thus **B** is simple.


    Let $e(x) = 0 \cdot (1 \cdot x)$. It is easy to verify that $e$ is idempotent
    and $U = \overline{e}(\mathbf{B})} = \{1,u\}$. **U** is a minimal set. What is
    the type of the minimal algebra? Notice that the operation $x \cdot y$ induces
    a semilattice on $\mathbf{B}|_U$. This eliminates 1 and 2. Since any expression
    containing $U$ must evaluate to $U$, $\mathbf{B}|_U$ cannot have a lattice structure.
    Thus **B**|$_U$ must be polynomially equivalent to a semilattice.


    Restricting our attention to simple algebras is not enough. Now we expand the
    ideas introduced above, but in a more general setting. Recall that for congruences
    $\\alpha < \beta$ we write $\alpha / \beta$ if $\\[\alpha, \beta] = \{\alpha,\
    \beta\}$. When this occurs, we refer to $(\alpha,\ \beta)$ as a prime quotient.


    # Definition 8.11. Let **A** be an algebra and $\alpha$ and $\beta$ in $\text{Con}(\mathbf{A})$.


    +   1) $\text{Sep}_{\mathbf{A}}(\alpha, \beta) = \{f \in \text{Pol}(\mathbf{A})
    : \hat{f}(\beta) \notsubseteq \alpha\}$


    +   2) $(\text{Sep}_{\mathbf{A}}(\alpha, \beta)$, is the set of minimal members
    (under inclusion)


    {\f}(\mathbf{A}) : \f \in \text{Sep}_{\mathbf{A}}(\alpha, \beta) \}$'
