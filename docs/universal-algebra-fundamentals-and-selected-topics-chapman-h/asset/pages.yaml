  md: "# 4. Commutators\n\n$\\alpha$, $\beta$ and $\\gamma$ respectively. From Example\
    \ 7.18, $\\gamma \\in C(\\alpha,\beta)$ if and only if $D \\cap A$ and $A/D$ is\
    \ contained in the centralizer of $B/D$. In other words, for all $a \\in A$ and\
    \ $b \\in B, (ad)(bd)=(bd)(ad)$, equivalently $a^{-1}b^{-1}ab \\in D$. Thus Definition\
    \ 7.42 tells us $[\\alpha,\beta]$ corresponds to the smallest normal subgroup\
    \ containing $\\{a^{-1}b^{-1}ab : a \\in A, b \\in B\\}$. Among group theorists,\
    \ this subgroup is denoted $[A, B]$.\n\nBased on its definition, the relationship\
    \ $\\gamma \\in C(\\alpha,\beta)$ seems to involve the algebra $A/\\gamma$. However,\
    \ using the correspondence theorem, we can describe it directly within the algebra\
    \ **A** in a similar manner to Definition 7.16 as follows.\n\n```\n$$\\forall\
    \ t \\in Clon_{n+1}(A), \\gamma(a,b) \\in \\alpha, \\quad t(a,c) \\gamma t(a,d)\
    \ \\implies t(b,c) \\gamma t(b,d). \\quad (7-16)$\n```\n\nProof. If $\\alpha$\
    \ centralizes $\beta$. Then by, $\\gamma \\le \\alpha \\wedge \beta$ and for every\
    \ $t, (a, b) \\in \\alpha$ and $(\\mathbf{c, d}) \\in \beta$\n\n```\n$t(\\alpha/\\\
    gamma, c/\\gamma) = t(\\alpha/\\gamma, d/\\gamma) \\iff t(b/\\gamma, d/\\gamma),\
    \ \\quad (7-17)$\n```\n\nConversely, assume that $\\gamma \\le \\alpha \\wedge\
    \ \beta$ and (7-16) hold. Then the left-to-right implication in (7-17) holds.\
    \ Since $\\alpha$ is a symmetric relation, we can interchange $a$ and $b$ in (7-16)\
    \ and obtain the right-to-left implication in the definition of the centralizer.\n\
    \nWe say that $\\gamma$ has the *$\\alpha,\\beta$-term condition* if the implication\
    \ in (7-16) holds. This turns out to be all we need to obtain the commutator.\n\
    \n# **Theorem 7.44.** Let $A$ be an algebra, $\\alpha, \beta \\in Con \\mathbf{A}$.\n\
    \n+   (1) If $\\gamma$ has the $\\alpha,\\beta$-term condition, then $\\gamma\
    \ \\wedge \\alpha \\wedge \\beta$ has the $\\alpha,\\beta$-term condition.\n\n\
    +   (2) $[a,b] = \\cap \\{\\gamma \\in Con A : \\gamma \\text{ has the } \\alpha,\\\
    beta\\text{-term condition}\\}$.\n\nProof. $\\gamma' = \\gamma \\wedge \\alpha\
    \ \\wedge \\beta$. Suppose that $t$ is a term operation, $a$ and $b$ and **c d**\
    \ $\\in \\beta$. Suppose further that $t(a,c) \\gamma' t(a,d)$. Then $t(a,c) \\\
    gamma t(a,d)$ so by assumption $t(b,c) \\gamma t(b,d)$. Also $c \\beta d \\implies\
    \ t(b,c) \\gamma t(b,d)$. Thirdly, $\\gamma' \\le \\alpha$ and $t(a,c) \\gamma'\
    \ t(a,d)$. Thus\n\n```\n$t(b,c) t(a,c) t(a,c) t(a,d) t(b,d).\n```\n\n$\\gamma'$\
    \ has the $\\alpha,\\beta$-term condition. The second claim follows from the first\
    \ together with Definition 7.42 and Lemma 7.43."
