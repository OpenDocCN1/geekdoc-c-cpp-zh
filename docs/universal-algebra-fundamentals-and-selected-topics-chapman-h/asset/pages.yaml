  md: '# 8. Interpretations


    (1) Turn a ring into an Abelian group by throwing away multiplication.


    (2) Every Abelian group can be turned into a ring by defining $x \cdot y = 0$.


    (3) Every group can be turned into a quasigroup by defining $x/y = x \cdot y^{-1}$
    and $x \backslash y = x^{-1} \cdot y$.


    (4) Every Boolean algebra can be turned into a Boolean ring and vice versa, using
    the definitions in Exercise 2.47.1.


    What these constructions all have in common is that the basic operations of the
    target object are defined as terms of the source object. Before we formalize this,
    let us address one point. We generally consider a Boolean algebra to be of the
    form $\mathbf{B} = (\mathbf{A}, \wedge, \vee, 0, 1)$. It is not uncommon to leave
    out the null operations: $\mathbf{B}'' = (\mathbf{A}, \wedge, \vee'', v'')$. We
    can transform $\mathbf{B}''$ into $\mathbf{B}$ by defining $0$ as $x \wedge x''$
    and $\wedge x''$ is a unary operation with constant value $0$, not a null operation.
    The prevailing notion in universal algebra is that it is more convenient to include
    this transformation in our definition than to exclude it. We handle this with
    a somewhat roundabout definition.


    **Definition 4.76.** $\mathcal{V}$ is a variety of similarity type $\rho: \mathcal{F}
    \to \omega$ and $\mathcal{W}$ a variety of similarity type $\sigma: \mathcal{G}
    \to \omega$.


    (1) A strict *interpretation* of $\mathcal{V}$ in $\mathcal{W}$ is a mapping $\mathcal{D}:
    \mathcal{F} \to \T_{\sigma}(\mathcal{W})$ such that


    +   - For every $f \in \mathcal{F}, \rho(f) = \sigma(D(f))$

    - For every $\mathbf{A} \in \mathcal{W}$, the algebra $\mathbf{A}^{\mathbf{D}}
    = \langle\mathbf{A}, D(f)^{\mathbf{A}}\rangle_{f \in \mathcal{F}}$ is a member
    of $\mathcal{V}$.


    (2) An insignificant *interpretation* on $\mathcal{V}''$ replaces null operation
    symbols with their corresponding constant terms.


    (3) An *interpretation* of $\mathcal{V}$ in $\mathcal{W}^m$ entails a transformation
    from $\mathcal{W}$ to $\mathcal{V}''$. By thinking of it as a mapping from terms
    of $\mathcal{V}''$ to terms of $\mathcal{W}$, it makes sense.


    It may seem strange that "interpretation of $\mathcal{V}$ in $\mathcal{W}^m$ entails
    a transformation from $\mathcal{W}$ to $\mathcal{V}''$. It should be clear that
    all of the examples presented at the beginning of the section are interpretations.
    The fourth example is noteworthy as it involves two interpretations that are each
    other of each other. On the other hand, that the first two are not examples.


    **Definition 4.77.** The varieties $\mathcal{V}$ and $\mathcal{W}$ are *term-equivalent*
    if there are interpretations $\mathcal{D}$ of $\mathcal{V}$ into $\mathcal{W}$,
    and $E$ of $\mathcal{W}$ into $\mathcal{V}$ such that for every $\mathbf{A} \in
    \mathcal{V}$ and $\mathbf{B} \in \mathcal{W}, \mathbf{A}^{\\mathbf{ED}} = \mathbf{A}$
    and $\mathbf{B}^{\mathbf{DE}} = \mathbf{B}$.**'
