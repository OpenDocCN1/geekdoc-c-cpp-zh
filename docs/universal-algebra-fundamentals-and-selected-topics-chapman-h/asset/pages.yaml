  md: "# 6. Arithmetical Varieties\n\n**Theorem 6.10.** Let **A** be a finite algebra.\
    \ The following are equivalent.\n\n+   (a) **A is quasiprimary;\n\n+   (b) Every\
    \ subalgebra of **A** is simple or trivial, and **V(A)** is arithmetical;\n\n\
    +   (c) **Clo A = F(Iso(A)).**\n\n*Proof.* **A** is quasiprimary. Then there is\
    \ a term $p$ such that $p^A = d_A$. Since $p$ is a Pixley term, by Theorem 4.70,\
    \ **V(A)** is arithmetical. Let **B** be a nontrivial subalgebra of **A** and\
    \ $\theta$ a nonzero congruence on **B**. Pick $(a, b) \\in \theta - 0_B$. For\
    \ any $c \\in B$, $p^A(a, a), (a, b), (c)) = (c, c) \\in \theta$. Since $c$ was\
    \ arbitrary, we have $a/\theta = B$. Then $\theta = 1_B$ is simple. This is why\
    \ $(a) \\Rightarrow (b)$.\n\nNow assume **B**. To prove (c) we first show that\n\
    \n```\n$$\\text{Sub}(A) = \\text{Iso}(A) \\cup \\{A_1 \\times A_2 : A_1, A_2 \\\
    in \\text{Sub}(A)\\}. \\eqno (6-2)$\n```\n\nSuppose that **C** is a subalgebra\
    \ of $A^2$. Let $A_i = \\tilde{p}_i(C)$, for $i = 1, 2$. By assumption, $A_i$\
    \ is either simple or trivial. Since **V(A)** is arithmetical, it is certainly\
    \ congruence-mutable, so we can apply Fleischer's lemma. Then there is an algebra\
    \ **B** and homomorphisms $g_i : A_i \\rightarrow B$ for $i = 1, 2$ such that\
    \ $C = E(g_1, p_1, g_2)$. Since $A_1, A_2$ are simple or trivial, either $|B|\
    \ = 1$ or $g_1$ and $g_2$ are isomorphisms. In the case $C = A_1 \\times A_2$,\
    \ **C** is the graph of the isomorphism $g_2^{-1} \\circ g_1$ in **Iso(A)**. Then\
    \ Equation (6-2) holds.\n\nNow, by Corollary 47.1, **A** has a major, so by Theorem\
    \ 6.1, to prove it is enough to show that for any $A_1, A_2 \\leq A, f : \\text{Iso}(A)\
    \ \\rightarrowrightarrow A_1 \\times A_2$. Suppose that $f$ is an $n$-ary operation\
    \ over **Iso(A)**. We show that $f((a_1, b_1), \\dots, (a_n, b_n)) \\in A_1 \\\
    times A_2$. Since $A_i$ is a subalgebra of **A**, $\\delta_i \\in \\text{Iso}(A)$,\
    \ $f \\delta_i = \\delta$. Since $(a_1, a_1), \\dots, (a_n, a_n) \\in \\delta_1$,\
    \ we deduce that $(f(a), f(a)) \\in \\delta_{A_1}$, hence $f(a) \\in A_1$. Similarly\
    \ $f(a) \\in A_2$. Therefore $(f(a), f(b)) \\in A_1 \\times A_2$ as required.\n\
    \nFinally, $(c) \\Rightarrow (a)$ since always preserves the member of **Iso(A)**.\
    \ $\\square$\n\nEvery field is quasiprimary. One sees for a field of order $n$,\
    \ a discriminator term is\n\n```\n$d(x, y, z) = (x - y)^{n-1} \\cdot (x - z) +\
    \ z$.\n```\n\nIn this case, the discriminator term is easy to find and under the\
    \ conditions of Theorem 6.10 to verify. For contrast, consider the following example."
