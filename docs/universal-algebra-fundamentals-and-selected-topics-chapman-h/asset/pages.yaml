  md: "# 1. Algebras\n\nis a quasigroup as defined above, then the Cayley table of\
    \ $\\langle Q, \\cdot \rangle$ is a *Latin square*, that is, a table in which\
    \ each entry appears exactly once in each row and column. (This way of thinking\
    \ makes the most sense for a finite table.). Conversely, each Latin square $\\\
    langle Q, \\cdot \rangle$ can be expanded to a quasigroup in a unique way. Motivated\
    \ by this, we define a *Latin square* to be a binar $\\langle Q, \\cdot \rangle$\
    \ such that for every $a, b \\in Q$\n\n```\n$a \\cdot x = b$ and $y \\cdot a =\
    \ b$\n```\n\nhave *unique* solutions. In a quasigroup, the element $x$ in the\
    \ above pair of equations is equal to $a \\cdot b$ and $y$ is equal to $b/a$.\n\
