    Later we will exhibit finite quasigroups that generate arithmetical varieties.


    **Example 4.72.** We introduce one other arithmetical variety that is interesting
    in its right. We call the variety of $r$-lattices. This, by the way, is one of
    the few examples of a naturally occurring operation of rank greater than 2 that
