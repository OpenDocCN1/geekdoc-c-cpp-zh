    \ \\subseteq \\mathbf{HS}(\\mathcal{K}).$$\n```\n\nInspired by group theory, an\
    \ algebra $\\mathbf{A}$ is *solvable* if there is a sequence $\\beta_0 = \\beta_0\
    \ < \\beta_1 < \\cdots < \\beta_n = 1_{\\mathbf{A}}$ in $\\texttext{Con}(\\mathbf{A})$,\
    \ such that $\\beta_{k+1}$ is Abelian over $\\beta_k$, for all $k < n$. Similarly\
    \ *locally solvable* if each $\\beta_{k+1}$ is strongly Abelian over $\\beta_k$.\n\
    \nSuppose that $\\mathbf{A}$ is a finite algebra. By Exercise 8.39.4, $\\mathbf{A}$\
    \ is solvable if and only if $\\mathbf{A}$ has no $(0, 4)_2$-squaps. Theorem 8.27\
    \ implies that the absence of 2-squaps is equivalent to $\\mathbf{A} \\subseteq\
    \ \\{1, 2\\}$. Analogous conditions hold for strong solvability. Finally, a locally\
    \ solvable algebra is called *locally solvable* (locally *strongly solvable*)\
    \ if every finite subalgebra is solvable (strongly solvable).\n\n**Proposition\
    \ 8.42.** $\\mathcal{V}$ be a locally finite variety. The class of locally solvable\
    \ members of $\\mathcal{V}$ forms a subalgebra, as does the class of strongly\
    \ solvable members.\n\nProof. It is easy to see that the class of locally solvable\
    \ algebras is closed under both subalgebra and arbitrary products. We must check\
    \ over homomorphic images.\n\nLet $\\mathbf{A}$ be locally solvable and let $\\\
    mathbf{B} = \\mathbf{A}/\\theta$. Suppose that $\\mathbf{B}$ fails to be locally\
    \ solvable. Then there is a finite subalgebra $\\mathbf{C}$ of $\\mathbf{B}$,\
