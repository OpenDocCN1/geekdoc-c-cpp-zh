  md: "# 1. Large clones\n\n![](img/4f610fb94046e9c65f60698e9fcee011_185_0.png)\n\n\
    FIGURE 6.1: Fleischer's Lemma\n\n*Proof.* Because of the permutability assumption,\
    \ $\beta = \\eta_1 \\circ \\eta_2$ is a congruence on **A**. Let $\\mathbf{C}\
    \ = \\mathbf{A}/\beta$. Since $\\eta_i \\subseteq \beta$ there are surjective\
    \ homomorphisms $g_i$ mapping $\\mathbf{B}_i$ onto $\\mathbf{C}$, for $i=1,2$.\
    \ Thus for every $(x_1, x_2)$ in $\\mathbf{A}$, $g_i(x_1, x_2) = g_i(x_i) = g_i(x_i)$.\
    \ Since this is true for $i=1$ and $2$ we obtain $g_1(x_1) = g_2(x_2)$.\n\nConversely,\
    \ suppose $x_1 \\in \\mathbf{B}_1, x_2 \\in \\mathbf{B}_2$ and $g_1(x_1) = g_2(x_2)$.\
    \ Since **A** is a subdirect product, there are elements $y_1$ and $y_2$ such\
    \ that $(x_1, y_2)$ and $(y_1, x_2)$ are members of **A**. Then\n\n$q_\beta(x_1,\
    \ y_2) = g_1p_1(x_1, y_2) = g_1(x_1) = g_2p_2(y_1, x_2) = q_\beta(y_1, x_2)$.\
    \ Since $\beta = \\eta_1 \\circ \\eta_2$ in **A** we conclude that $(x_1, y_2)\
    \ \\eta_1 (x_1, x_2) \\eta_2 (y_1, x_2)$, hence $(x_1, x_2) \\in \\mathbf{A}$.\
    \ $\\square$\n\nWe comment that the conclusion of Theorem 6.2 asserts that **A**\
    \ is the equalizer, $E(g_1p_1, g_2p_2)$, of $g_1p_1$ and $g_2p_2$ in $\\mathbf{B}_1\
    \ \times \\mathbf{B}_2$ (see Exercise 1.16.6).\n\n**Theorem 6.3.** *Let **A**\
    \ be a subdirect product of $\\prod_{i=1}^n \\mathbf{B}_i$ in which every $\\\
    mathbf{B}_i$ is simple. Then $\\eta_i$ be the kernel of the projection of **A**\
    \ onto $\\mathbf{B}_i$, for $i \\leq n$. **A** is a subdirect product, so is isomorphic\
    \ to a direct product of those simple algebras.*\n\n*Proof.* Pick a minimal subset\
    \ $J$ of $\\{1, 2, \\dots, n\\}$ such that $\bigcap_{j \\in J} \\eta_j = 0_\\\
    mathbf{A}$. Then for each $j \\in J$ we must have $\\eta_j \neq \bigcap_{k \n\
    eq j} \\eta_k$. From this, the maximality of $\\eta_j$, we deduce $\\mathbf{A}\
    \ \\cong \\prod_{k \neq j} \\eta_k = 1$. Applying Exercise 3.15.55. $\\square$\n\
    \nIf we are to talk about algebras with large clones, we should probably start\
    \ with algebras whose clone contains all possible operations. It is well-known\
    \ that the two-element Boolean algebra has this property. In propositional logic\
    \ this is the observation that every truth table can be built from the propositional\
    \ variables using the logical connectives of “and,” “or,” and “not”."
