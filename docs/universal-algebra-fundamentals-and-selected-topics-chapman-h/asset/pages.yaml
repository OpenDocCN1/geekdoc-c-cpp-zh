    eta$ modulo $\\gamma$.\n\n****Theorem 7.41.** Let $\\mathbf{A}, \\alpha, \\beta$\
    \ be as above, and let $\\gamma = \\bigcap C(\\mathbf{A}, \\alpha, \\beta)$. Then\
    \ $\\gamma$ lies in $C(\\mathbf{A}, \\beta)$.\n\nProof. Let us use $C$ in place\
    \ of $\\gamma$. We have an embedding\n\n$\\alpha/\\gamma \\to \\prod_{\\nu \\\
    in \\mathbf{C}} \\mathbf{A}/\\nu$\n\nLet $\bar{\\alpha} = \\prod_{\\nu \\in \\\
    mathbf{C}} \\mathbf{A}/\\nu$ and $\\bar{\beta} = \\prod_{\\nu \\in \\mathbf{C}}\
    \ \\mathbf{A}/\\nu$. By Proposition 7.22(2) $\\bar{\\alpha} = \\prod \\mathbf{A}/\\\
    nu \\le \\prod((\\beta/\\nu)^* = \\bar{\beta}$. Then by part (1) of the same representation\n\
    \n$$\\alpha/\\gamma = \\bar{\\alpha}|_{\\mathbf{A}/\\gamma} \\le (\\bar{\beta}|_{\\\
    mathbf{A}/\\gamma}) $\n\nThus there is always a smallest congruence $\\gamma$\
    \ such that $\\alpha$ centralizes $\\beta$ modulo $\\gamma$.\n\n****Definition\
    \ 7.42.** Let $\\mathbf{A}$ be an algebra, $\\alpha, \\beta \\in \\text{Con}(\\\
    mathbf{A})$. We define $[\\alpha, \\beta]$ to be $\\bigcap C(\\mathbf{A}, \\alpha,\
