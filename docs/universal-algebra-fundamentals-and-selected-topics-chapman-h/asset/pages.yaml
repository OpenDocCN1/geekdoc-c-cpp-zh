    \ \\alpha \\wedge \beta \\wedge [1,1]$ is called (C2). Prove that every directly\
    \ representable variety satisfies (C2). (Hint: use Theorem 7.56).\n\n# 7.6 Minimal\
    \ varieties\n\nA variety is *minimal* if it is nontrivial and has no proper nontrivial\
    \ subvarieties. Familiar examples include the varieties of distributive lattices,\
    \ Boolean algebras, Abelian groups of prime exponent, and $F$-vector spaces over\
    \ any field **F**.\n\nRecall the duality between varieties and equational theories.\
    \ Under this duality, minimal varieties correspond to maximal proper equational\
    \ theories. The smallest variety—the variety of trivial algebras—corresponds to\
    \ the theory containing every possible equation. Thus an equational theory is\
    \ maximal and proper if and only if the addition of any additional identity allows\
    \ one to deduce every equation. In analogy with similar notions in first-order\
    \ logic, both maximal equational theories and minimal varieties are often called\
    \ *equationally complete*.\n\nThe first order of business is to prove the existence\
    \ of minimal varieties. The following proposition shows that, in particular, it\
    \ is not possible to have an infinite descending chain of varieties whose limit\
    \ is trivial.\n\n**Proposition 7.61.** *Every nontrivial variety contains a minimal\
    \ variety.*\n\nProof. $\\mathcal{V}$ be a nontrivial variety of similarity type\
    \ $\rho$, and let $\\mathbf{T} = \\mathbf{T}_\rho(W_\\omega)$ be the term algebra.\
    \ Under the duality we recalled just above every variety of type $\rho$ corresponds\
    \ to an equational theory, and the equational theories are the fully invariant\
    \ congruences on $\\mathbf{T}$. The variety $\\mathcal{V}$ corresponds to a congruence\
    \ $\theta \\in \text{Con}(\\mathbf{T})$ and we seek a maximal member of $\\{\\\
    psi \\in \text{Con}(\\mathbf{T}) : \theta \\leq \\psi < 1\\}$. Note that a fully\
    \ invariant congruence is proper if and only if it excludes the pair $(x_1, x_2)$.\
    \ Using this observation, an easy Zorn's lemma allows the existence of the desired\
    \ congruence.\n\nObviously, a variety is generated by any one of its nontrivial\
    \ members. Furthermore, let $\\mathcal{V}$ be a variety containing at least one\
    \ finite, nontrivial member and let $\\mathbf{A}$ be a finite, nontrivial member\
    \ of $\\mathcal{V}$ of smallest cardinality. Then $\\mathbf{A}$ is *strictly simple*,\
    \ that is, $\\mathbf{A}$ is finite, and has no proper, nontrivial subalgebras.\
    \ Strictly simple algebras have also been called *plain*."
