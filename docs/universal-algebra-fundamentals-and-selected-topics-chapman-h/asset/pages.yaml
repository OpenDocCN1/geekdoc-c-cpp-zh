    **Claim.** For every $i \leq n$, $\alpha_i \cap \beta_i = \eta_i$.


    *Proof.* For suppose that some $j \leq n$, $\alpha_j \cap \beta_j > \eta_j$. Then
    $\alpha_j \cap \beta_j \geq \mu_j$. Pick $(a, b) \in \mu - 0_A$. Let $x = \langle
    a, a, \dots, a \rangle$ and $y = \langle a, a, \dots, b, b, \dots, a \rangle$,
    with the lone $b$ appearing in the $j$-th place. Notice that both $x$ and $y$
    are members of $A_n(\mu)$. Therefore, for every $i \leq n$, $x \equiv y$ $(\text{mod
    \alpha_i \cap \beta_i)$ which contradicts equation (7–4).


    Since $\eta_i$ is completely meet-irreducible, it follows from the claim that
    for every $i \leq n$ neither $\alpha_i = \eta_i$ or $\beta_i = \eta_i$. On the
    other hand, using distributivity


    ```

    $1_{A_n(\mu)} = \alpha \vee \beta = \bigcap_{i=1}^n \alpha_i \vee \bigcap_{j=1}^n
    \beta_j = (\bigcap \alpha_i \vee \beta_j)$

    ```


    from which it follows that $\alpha_i \vee \beta_j = 1$ for all $i, j$.


    Now, as $\alpha \neq 0$, there is some $j \leq n$ such that $\alpha_j > \eta_j$,
    so from the previous paragraph, $\beta_j = \eta_j$. Similarly, there is $i \leq
    n$ such that $\alpha_i = \eta_i$. But then


    ```

    $1 = \alpha_i \vee \beta_j = \eta_i \vee \eta_j < \mu_i \vee \mu_j = \mu_1$

    ```


    since all the $\mu_i$''s are equal. This contradiction completes the proof.


    **Theorem 7.11** (Burris, 1977). Let $\mathcal{V}$ be a finitely generated and
    congruence-distributive variety. Then $\mathcal{V}$ is directly representable
    if and only if it is semi-simple and outright.


    *Proof.* The right-to-left direction is Theorem 7.2. So assume that $\mathcal{V}$
    is directly representable but not simple. By Theorem 7.9, $\mathcal{V}$ is Maltsev,
    arithmetical. Suppose that **A** is subdirectly irreducible but not simple. Since
    $\mathcal{V}$ is congruence-distributive and finitely generated, **A** is finite
    by Jónsson''s lemma. By Proposition 7.10 every $A_n(\mu)$ is directly indecomposable.
    $\mathcal{V}$ has infinitely many finite directly indecomposable algebras which
    contradicts direct representability.


    As part of his effort to understand the structure of directly representable varieties,
    McKenzie proved earlier that these varieties have definable principal congruences.
    As a result, they are all finitely bounded. The proof does not invoke Theorem
    7.9.


    **Lemma 7.12.** Let $\mathcal{V}$ be a directly representable variety. Then $\mathcal{V}$
    has only finitely many subdirectly irreducible algebras, all finite.


    *Proof.* By assumption, $\mathcal{V}$ is locally finite. Since every subdirectly
    irreducible algebra is directly indecomposable, direct representability implies
    that there are only finitely many finite subdirectly irreducible algebras in $\mathcal{V}$.
    It follows from Theorem 5.7, that $\mathcal{V}$ has no infinite subdirectly irreducible
    algebras.'
