  md: "# 3. Centralizers again!\n\n# 8.3 Centralizers again!\n\nIn Chapter 7 we introduced\
    \ the congruence variety and the associated notions of the commutator and Abelian\
    \ algebras. At that time we showed that within a Maltsev variety, these constructions\
    \ had powerful properties. Unfortunately, those properties fail to hold in arbitrary\
    \ algebras. However, as we show in this section, the centralizer of a congruence\
    \ influence the type of the congruence minimal set.\n\nRecall from Definition\
    \ 7.16 that for a congruence $\beta$ on an algebra $A$, the centralizer of $\b\
    eta$ is if\n\n```\n$\\beta^* = \\{(a,b) \\in A^2 : \\forall f \\in \\text{Pol}_{n+1}(\\\
    mathbf{A}) \\forall(\\mathbf{c},d) \\in \\beta, f(a,c) = f(a,d) \\iff f(b,c) =\
    \ f(b,d)\\}$\n```\n\nWe remark that in the original formulation, the first quantifier\
    \ is over all terms of $A$, while here we have quantified over polynomials. However,\
    \ using the fact that every polynomial is of the form $t(x_1, x_2, \\dots, x_n,\
    \ r_1, \\dots, r_m)$ for some term $t$ and $r_1, \\dots, r_m \\in A$, it is easy\
    \ to see that the two definitions are equivalent. In Propositions 7.17 and 7.22\
    \ we developed what we could about the general centralizer before we specialized\
    \ to Maltsev varieties.\n\nRecall that an algebra $A$ is Abelian if $1'_A = 1_A$.\
    \ We generalize that concept to an arbitrary congruence.\n\n# **Definition 8.26.**\
    \ Let $A$ be an algebra, $\\alpha \\leq \\beta$ congruences on **A**.\n\n+   (1)\
    \ $\beta$ is Abelian if $\beta \\leq \\beta^*$.\n\n+   (2) $\beta$ is Abelian\
    \ over $\\alpha$ if $\beta/\\alpha$ is Abelian in $\\mathbf{A}/\\alpha$.\n\nIn\
    \ the language of the commutator, $\beta$ is Abelian if $[\beta, \\beta] = 0$\
    \ and $\beta$ is Abelian over $\\alpha$ if $[\beta, \\beta] \\leq \\alpha$. This\
    \ latter condition can also be expressed as “$\\alpha$ has the $\\beta$,$\\beta$-condition,”\
    \ see page 217, except that, in the present context, we might want to call it\
    \ $\\beta$,$\\beta$-polynomial condition.\n\nWe first consider this property in\
    \ the context of minimal algebras. That essentially unary algebras are easy to\
    \ see, and vector spaces were studied in Section 7.3. Every minimal algebra of\
    \ one of the remaining types has two elements and contains a semilattice operation.\
    \ Observe with $t(x, y) = x$ we have $t(0,0) = t(0,1)$ but $t(1,0) \\neq t(1,1)$.\
    \ This observation, together with its dual, is enough to show that all three are\
    \ nonabelian.\n\nTo summarize, minimal algebras of types 1 and 2 are Abelian,\
    \ of types 3, 4, and 5 are nonabelian. One of the significant results of tame\
    \ congruence theory is that this distinction carries over the traces obtained\
    \ from prime quotients, and impacts the congruence lattice."
