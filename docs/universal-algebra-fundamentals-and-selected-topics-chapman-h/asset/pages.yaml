  md: '# 8. Finite Algebras and Locally Finite Varieties


    again, a contradiction.


    Here is a simple application. Let A be the group $S_5$. Then Con(A) is a 3-element
    chain: $0 < \mu < 1$ in which $\mu$ corresponds to the normal subgroup $A_5$.
    Since $A$ lies in a Maltsev variety, by Theorem 8.28, the types of the two prime
    quotients must each be 2 or 3. Because $A/\mu$ is a two-element Abelian group,
    its type is 2. Equivalently, $typ(\mu, 1) = 2$. We see the same thing by observing
    that $[1] \leq \mu$ (since for $x,y \in S_5$, the $xy^{-1}y$ is an even permutation)
    and applying the theorem.


    For the other prime quotient, $0 < \mu$. $A_5$ is nonabelian, so we surely do
    not have $[\mu] = 0$, it is nonabelian. Consequently, by Theorem 8.27, $typ(0,
    \mu) \neq 0$, it must be 3.


    As another example, look back at Example 8.21 from the previous section. The congruence
    $\gamma$ is $0-1=0$ while $1 \neq 1 \neq 3$. Of course, this only shows that $typ(\gamma,
    1) \in \{3, 4, 5\}$. Additional arguments are needed to determine the type exactly.
    On the other hand, by (8-7) it is not hard to convince oneself that $\gamma$ is
    itself Abelian. Then follows that all four of prime quotients below $\gamma$ must
    have type 1 or 2. But which is it? What we need is a condition that separates
    types 1 and 2.


    # **Definition 8.28. Let A be an algebra, $\alpha \leq \beta$ congruences on A.**


    +   (1) We $\beta$ is strongly over $\alpha$ if


    > $$\forall f \in Pol_{n+1}(A) (\forall a,b \in \beta) \ (\forall c,d \in \beta)
    : \n f(a,c) \equiv_{\alpha} f(b,d) \implies f(a,e) \equiv_{\alpha} f(b,e)$.$


    +   (2) A is **strongly Abelian** if $L_A$ is strongly over $0_A$.


    To get a hint of the meaning of this condition, consider two prototypical examples
    of Abelian algebras. It is easy to see that essentially unary algebra is strongly
    Abelian. On the other hand, a nontrivial Abelian group is not strongly Abelian
    since for any $a \neq 0$, $0-0=a-a-0 \neq a-0$. It is not hard to see that $\beta$
    strongly Abelian over $\alpha$ implies $\beta$ is Abelian. A minimal algebra is
    type 1 and only if it is strongly Abelian.


    # **Theorem 8.29. Let A be a finite algebra, $\alpha < \beta$ a prime quotient
    in Con(A). Then $\beta$ is strongly Abelian over $\alpha$ if and only if $typ(\alpha,
    \beta) = 1$.**


    Proof. As before, we can assume that $\alpha = 0$ (Exercise 8.39). If $\beta$
    is strongly Abelian over $\alpha$, then for any $(0, \beta)$-trace, $N$, the algebra
    $A|_N$ is minimal and strongly Abelian, hence it has type 1.


