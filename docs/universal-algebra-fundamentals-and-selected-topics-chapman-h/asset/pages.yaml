  md: "# 8. Finite Algebras and Locally Finite Varieties\n\n**Lemma 8.15.** Let **A**\
    \ be an algebra, $U, V \\subseteq A$ and assume that $U \\simeq V$.\n\n+   (1)\
    \ $\\mathbf{A}|_U \\simeq \\mathbf{A}|_V$\n\n+   (2) $\\alpha < \\beta$ in $\\\
    mathrm{Con}(\\mathbf{A})$. Then $U \\in \\mathrm{M}_{\\mathbf{A}}(\\alpha, \\\
    beta)$ if and only if $V \\in \\mathrm{M}_{\\mathbf{A}}(\\alpha, \\beta)$.\n\n\
    Proof. Exercise.\n\nThis lemma holds in complete generality. Most importantly,\
    \ when **A** is finite and is covered by $\beta$, the converse of part (2) holds,\
    \ as we now show.\n\n**Theorem 8.16.** Let **A** be a finite algebra and $\\alpha\
    \ < \\beta$ congruences on **A**. Any two $(\\alpha, \\beta)$-minimal sets are\
    \ polynomially isomorphic.\n\nProof. Let $U_1$ and $U_2$ be the $(\\alpha, \\\
    beta)$-minimal sets. By Theorem 8.13, there is $e_i$ in $\\mathbf{E}(\\mathbf{A})$\
    \ such that $\\tilde{e}_i(\\mathbf{A})=U_i$, for $i=1, 2$. It follows from Definition\
    \ 8.11 that there is $(a, b) \\in \\beta$. We first show that there is a polynomial\
    \ $h$ with $\\tilde{h}(\\mathbf{A}) \\subseteq U_2$ and $(h(a), h(b)) \\in \\\
    alpha$.\n\nTo see this, let $h = e_2 \\circ f : f \\in \\mathrm{Pol}(\\mathbf{A})$.\
    \ Then $K$ is a right ideal of $\\mathrm{Pol}_1(\\mathbf{A})$. Using the same\
    \ argument as in Lemma 8.13, we determine\n\n$\\alpha = \\{(x, y) \\in \\beta\
    \ : (\\forall h \\in \\mathbf{K}) \\ h(x) \\equiv_{\\alpha} h(y)\\}$\n\nSince,\
    \ $(a, b) \\in \\beta - \\alpha$ then there is $h \\in \\mathbf{K}$ such that\
    \ $(h(a), h(b)) \\in \\alpha$. By the definition of $K$, $h = e_1 \\circ h'$ (for\
    \ some polynomial $h'$) so $\\tilde{h}(\\mathbf{A}) \\subseteq \\tilde{e}_2(\\\
    mathbf{A})=U_2$.\nWe have $U_2 \\supseteq h(U_1)=U_1$. Since $a, b$ are elements\
    \ of $U_1$ they are fixed by $e_1$. So $e_1(a) \\equiv_{\\alpha} e_1(b)=e_1(b)$.\
    \ Thus $e_1 \\in \\mathrm{Sep}(\\alpha, \\beta)$. Therefore by the minimality\
    \ of $U_2$, $\\tilde{h}(\\mathbf{A})=h(U_1)$.\n\nWith a similar argument, there\
    \ is a polynomial $g$ with $\\tilde{g}(U_2)=U_1$. Therefore $f=gh$ is a permutation\
    \ of the finite set $U_1$. Let $k$ be the order of $f$ and $f^{k-1} \\circ g$\
    \ are inverse polynomial isomorphisms between $U_1$ and $U_2$.\n\nThere are several\
    \ additional properties of $\\mathrm{M}_{\\mathbf{A}}(\\alpha, \\beta)$ that are\
    \ useful in practice. We list them here.\n\n**Theorem 8.17.** Let **A** be a finite\
    \ algebra, $\\alpha < \\beta$ in $\\mathrm{Con}(\\mathbf{A})$, and $U$ an $(\\\
    alpha, \\beta)$-minimal set.\n\n+   (1) Assume $f \\in \\mathrm{Pol}_1(\\mathbf{A})$\
    \ and $\\tilde{f}(\\beta) \\not\\subseteq \\alpha$. Then $\\tilde{f}(U)$ is minimal\
    \ and $f|_U \\simeq \\tilde{f}(U)$.\n\n+   (2) If $(a, b) \\in \\beta - \\alpha$\
    \ then there is $f \\in \\mathrm{Pol}_1(\\mathbf{A})$ such that $\\tilde{f}(A)=U$\
    \ and $(f(a), f(b)) \\not\\subseteq \\alpha$.\n\n+   (3) If $f \\in \\mathrm{Sep}_{\\\
    mathbf{A}}(\\alpha, \\beta)$ then there is $V \\in \\mathrm{M}_{\\mathbf{A}}(\\\
    alpha, \\beta)$ such that $V \\simeq \\tilde{f}(V)$."
