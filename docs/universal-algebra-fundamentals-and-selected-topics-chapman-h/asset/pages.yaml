    \ notion “relative” to a third congruence. Let $\\mathbf{A}$ be an arbitrary algebra,\
    \ and let $\\alpha$ and $\beta$ be congruences on $\\mathbf{A}$. We define\n\n\
    $C(\\mathbf{A}, \\alpha, \\beta) = {\\gamma \\in \\text{Con}(\\mathbf{A}): \\\
    gamma \\subseteq \\alpha \\wedge \\beta \\text{ and } (\\alpha/\\gamma) \\subseteq\
    \ (\\beta/\\gamma)^*} $\n\nNote that in this description, the relationship $(\\\
    alpha/\\gamma) \\subseteq (\\beta/\\gamma)^*$ is computed in the algebra $\\mathbf{A}/\\\
    gamma$. We only consider congruences $\\gamma$ contained in $\\alpha \\wedge \\\
