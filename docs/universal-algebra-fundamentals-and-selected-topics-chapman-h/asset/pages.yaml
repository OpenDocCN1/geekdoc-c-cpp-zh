    FIGURE 2.1: An isotone map that is not a lattice homomorphism\n\n**Proposition\
    \ 2.3.** Let $f: \text{P} \to \text{Q}$ be a bijective, isotone map from the lattice\
    \ **P** to the lattice **Q**. If $f^{-1}$ is isotone, then $f$ (and consequently\
