  md: '# 2. Lattices


    **Theorem 2.8** (Dedekind, 1900). *Let L be a lattice. The following are equivalent*


    +   (a) **L** is modular.


    +   (b) **L** satisfies $((x \wedge z) \vee y) \wedge z = (x \wedge z) \vee (y
    \wedge z)$.


    +   (c) **L** has no sublattice isomorphic to **$N_5$**.


    *Proof.* Assume that L is modular and we shall prove (b). Let $x,y,z \in L$ and
    set $a=z, b=y$ and $c=a \wedge b$. Then $c \leq a$ by modularity $a \wedge (b
    \vee c) = (a \wedge b) \vee c$. Equivalently, $(x \wedge y) \vee z=(y \wedge z)
    \vee (x \wedge z)$.

    By labeling the elements of $N_5$ so that $0 < x < z < 1$ and $0 < y < 1$ sees
    that $N_5$ fails to satisfy the identity in (b). Then (b) implies (c).

    Finally that L is not modular. We shall find a sublattice of **L** isomorphic
    to $N_5$. There are elements $a,b,c \in L$ with $a \geq c$ and $a \wedge (b \vee
    c) > (a \wedge b) \vee c$. We claim that L contains the sublattice of Figure 2.2.


    ![](img/4f610fb94046e9c65f60698e9fcee011_40_0.png)


    FIGURE 2.2: A sublattice isomorphic to $N_5$


    Notice that we still have some work to do. We must show that the five elements
    are all distinct and that the meets and joins are as Figure 2.2 indicates. Certain
    $a \wedge b \leq b \vee c$ and $a \wedge b \leq c(a \wedge b) < a \wedge (b \vee
    c) \leq (b \vee c)$, with the strict inequality coming from our assumption.


    ```

    $b \vee (c (a \wedge b)) = c \vee b (a \wedge b) = b \vee c\n$a \wedge (b \vee
    c) = a \wedge b \wedge (b) = a \wedge b$.

    ```


    All of the other meets and joins now follow trivially. Finally, all of the inclusions
    must be or else $c \vee (a \wedge b) = a \wedge (b)$, which we know to be false.


    The condition defining modularity in Definition 2.5(2) is not an identity, but,
    rather, an implication. An added bonus of Theorem 2.8 is that it provides an identity
    equivalent to modularity. As a result, a homomorphic image of a modular lattice
    is always modular. Furthermore, the third condition is clearly self-dual. It follows
    that the dual of a modular lattice is modular.'
