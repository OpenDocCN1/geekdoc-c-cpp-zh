  md: "# Chapter 3\n\n# The Nuts and Bolts of Universal Algebra\n\nNuts and bolts\
    \ are among the tools we use to assemble the objects that dominate our lives.\
    \ In this chapter we develop tools that allow us to understand how algebras and\
    \ varieties are put together. Often, it is not assembly that is important, but\
    \ disassembly—that is, recognizing the component parts of an object under study.\n\
    \nAn understanding of the complex interplay of subalgebras, homomorphisms and\
    \ products is essential to the mastery of universal algebra. In Section 3.4 we\
    \ illustrate many of these ideas with several concrete examples.\n\n# 3.1 The\
    \ isomorphism theorems $f: A \\rightarrow B$\n\nLet $A$ and $B$ be sets, $f: A\
    \ \\rightarrow B$ a function. Then $f$ induces two maps on the subsets of $A$\
    \ and $B$ as follows.\n\n```\n$$\\tilde{f}:Sb(A) \\rightarrow Sb(B)$ given by\
    \ $X \\mapsto \\{f(x) : x \\in X}$\\$\\n$\\tilde{f}:Sb(B) \\rightarrow Sb(A)$\
    \ \\quad $Y \\mapsto \\{a \\in A : f(a) \\in Y}\\$\n```\n\nThese maps are usually\
    \ written as $f(X)$ and $f^{-1}(Y)$ instead of $\tilde{f}(Y)$. But our notation\
    \ is more precise, and will help reduce confusion. If we want to use English,\
    \ we can call these maps the direct and inverse image under $f$.\n\nThe inverse\
    \ image behaves very nicely. (The direct image, not so nicely.) The reader might\
    \ like to verify that for all subsets $X$ and $Y$ of $B$, and $Z$ and $W$ of $A$\n\
    \n```\n$$\\tilde{f}(X \\cap Y) = \\tilde{f}(X) \\cap \\tilde{f}(Y)$,$\\n$\\tilde{f}(\\\
    emptyset) = \\emptyset$,$\\n$\\tilde{f}(W \\cup Z) = \\tilde{f}(W) \\cup \\tilde{f}(Z)$,$\\\
    n$\\tilde{f}(B) = A$, \\quad (3-1)\\n$\\tilde{f}(X) \\subseteq X$,$\\n$\\tilde{f}(Z)\
    \ \\subseteq Z$.\n```"
