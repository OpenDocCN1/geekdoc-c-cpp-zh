    It follows from the previous two paragraphs that $\psi|_U = \psi$, then the restriction
    is surjective. Finally to show that restriction preserves arbitrary joins, let
    $\Theta \in Con(\mathbf{A})$ and set


    ```

    $\psi = \bigvee_{\theta \in \Theta} \theta|_U$

    ```


    with the computation of $\psi$ is done in $Con(\mathbf{A}|_U)$. Let $\theta \in
    \Theta$. Then $\theta|_U \le \psi$, it follows from (8-5) that $\theta \le \psi$.
    As this holds for every $\theta$, $V\Theta \le \psi$, so by by (8-5), $(V\Theta)|_U
    \le \psi$. The opposite inclusion is trivially true, we conclude that restriction
    preserves joins.'
