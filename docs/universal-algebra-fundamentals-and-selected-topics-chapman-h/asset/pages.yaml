  md: "# 3. The Nuts and Bolts of Universal Algebra\n\nFor the converse, since $g$\
    \ is a subdirect embedding, $p_i \\circ g$ is surjective so $A/\theta_i \\cong\
    \ B$. Since $ker g = \\bigcap \\theta_i$, the intersection must be 0.\n\nFor example,\
    \ let $P$ denote the set of prime integers, $\\mathbb{Z}$ the additive group of\
    \ integers, and for $p \\in P$, $\\theta_p$ denote \"congruence modulo $p$.\"\
    \ $\\prod_{p \\in P} \\theta_p = 0$, we obtain a subdirect embedding $Z \\longmapsto\
    \ \\mathbb{Z}/\\theta_p \\cong \\prod \\mathbb{Z}$ the product over all cyclic\
    \ groups of prime order.\n\nIn general, we hope to start with an algebra, a subdirect\
    \ representation, and then, perhaps find subdirect representations of all the\
    \ factors, repeating the process until we can do no further reductions. We need\
    \ to define precisely we need.\n\n**Definition 3.18.** A nontrivial algebra $\\\
    mathbf{A}$ is called *subdirectly irreducible* if for every subdirect embedding\
    \ $A \\longmapsto \\prod_{i \\in I} A_i$, there is a $j \\in I$ such that $p_j\
    \ \\circ h : A \\longmapsto \\mathbf{A}_j$ is an isomorphism\n\n**Example 3.19.**\
    \ The only subdirectly irreducible distributive lattice is the two-element chain.\
    \ This is a consequence of Corollary 2.45.\n\n**Example 3.20.** A finite Abelian\
    \ group is subdirectly irreducible if and only if it is cyclic of prime-power\
    \ order. The \"only if\" direction follows from the structure theory for finite\
    \ Abelian groups. The converse is a consequence of Theorem 3.23.\n\nAs we show,\
    \ subdirect irreducibility is really a property of the congruence lattice of algebra.\
    \ One observation is in hand, the existence of subdirect representations by subdirectly\
    \ is quite easy.\n\n**Definition 3.21.** Let $L$ be a complete lattice. An element\
    \ is called *meet-irreducible* if $a = b \\wedge c$ implies $a = b$ or $a = c$.\
    \ The element is a *completely meet-irreducible* if $a \\neq 1_L$ and whenever\
    \ $a = \\bigwedge_{i \\in I} b_i$, there is a $j \\in I$ such that $a = b_j$.\n\
    \n**Lemma 3.22.** Suppose that a is an element of a complete lattice $L$. The\
    \ following are equivalent:\n\n+   (a) $a$ is completely meet-irreducible.\n\n\
    +   (b) There is an element $c \\in L$ such that $a < c$ and for every $x \\in\
    \ L, a < x$ implies $c \\leq x$.\n\nProof. Let $a \\in L, X = \\{x \\in L : x\
    \ > a\\}$ and $c = \\bigwedge X$. If $a$ is completely meet-irreducible, then\
    \ we must have $a < c$. For any $x \\in L, a < x$ implies $x \\in X$ so $c \\\
    leq x$ is the infimum of $X$.\n\nConversely, the subdirect exists as in (b). Assume,\
    \ by way of contradiction, $a = \\bigwedge X$ with $a \\notin X$. By the assumption\
    \ $c \\leq X$ $a < c < \\bigwedge X$ which is false.\n\nWhen $a$ is completely\
    \ meet-irreducible, the element $c$ guaranteed by the above lemma is called the\
    \ *upper cover* of $a$."
