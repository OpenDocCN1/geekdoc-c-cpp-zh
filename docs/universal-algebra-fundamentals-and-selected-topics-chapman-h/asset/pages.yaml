    \ subset. On the other hand, $\\mathbb{B}_1$ is not Boolean, (c) defines a class\
    \ slightly larger than the class of Boolean algebras. The class $\\mathcal{S}$\
    \ is called the variety of Stone algebras, and has been extensively studied.\n\
    \nAs another example, consider the identity $x \\approx x^{**}$. Which p-algebras\
    \ satisfy this identity? Which directly irreducible p-algebras satisfy it? Note\
    \ that if $|\\mathbf{B}| > 1$, then $x^{**} = 1 \\neq e \\in \\mathbf{B}$. The\
    \ only directly irreducible algebra that satisfies $x \\approx x^{**}$ is $x \\\
    in \\mathbb{B}_0$. Therefore, an arbitrary p-algebra satisfies $x \\approx x^{**}$\
    \ iff it is a subdirect product of $\\mathbb{E}_0$, which is to say, it is Boolean.\n\
    \nWe shall consider these details in detail after we have completed a rigorous\
    \ development of identities and their satisfaction. For now, we conclude with\
    \ a few of important properties a variety may possess.\n\n**Definition 3.48.**\
    \ (1) An algebra is called *locally finite* if every finitely generated subalgebra\
    \ is finite. A variety is locally finite if every member is locally finite.\n\n\
    +   (2) A variety is called *finitely generated* if it is of the form $\\mathbf{V}(\\\
    mathcal{K})$ where $\\mathcal{K}$ is a set of finite algebras.\n\nFor example,\
    \ the Abelian group $\\mathbb{Z}$ is not locally finite since for any $n \\neq\
    \ 0$, $\text{S}(n)$ is infinite. On the other hand, the groups $(S_n)$ are locally\
    \ finite. This follows from Exercise 3.26.7. As another example, in Exercise 2.47.7\
    \ we proved that the variety of distributive lattices is locally finite.\n\nPart\
