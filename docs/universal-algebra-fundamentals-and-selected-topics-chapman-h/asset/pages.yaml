  md: '# 1. Algebras


    **Theorem 1.14.** Let $A = \langle A, F \rangle$ be an algebra and $X \subseteq
    A$. Define, by recursion on $n$, the sets $X_n$ by:


    $X_0 = X;$


    $X_{n+1} = X_n \cup \{f(a_1, \dots, a_k) : a_1, \dots, a_k \in X_n, f \in F, \text{
    and } k = rank f\}$.


    Then $Sg^A(X) = \bigcup_{\omega \in \omega} X_\omega$.


    Proof. Let $Y = \bigcup_{\omega \in \omega} X_\omega$. Clearly $X_omega \subseteq
    Y \subseteq A$, for every $\omega \in \omega$. In particular $X_0 =subseteq Y$.
    Let us show that $Y$ is a subuniverse of $A$. Let $f$ be a basic-$k$ operation
    and $a_1, \dots, a_k \in Y$. From the construction of $Y$, there is an $n \in
    \omega$ such that $a_1, \dots, a_k \in X_n$. $f(a_1, \dots, a_k) \in X_{n+1} \subseteq
    Y$. Thus $Y$ is a subuniverse of $A$ containing $X$. By Definition 1.13, $Sg^A(X)
    \subseteq Y$.


    For the opposite, it is enough to check, by induction on $n$, $X_n \subseteq Sg(X)$.
    Well, $X_0 = X \subseteq Sg(X)$. Assume that $X_n \subseteq Sg(X)$. If $b = f(a_1,
    \dots, a_k)$ for a basic-$k$ operation and $a_1, \dots, a_k \in X$. But $a_1,
    \dots, a_k \in Sg(X)$ and thus this latter is subuniverse, $b \in Sg(X)$ as well.


    The argument that appears in Theorem 1.14 is of a type that one encounters throughout
    algebra. It has two parts. First that $Y$ is a subuniverse containing $X$. Second
    that any subuniverse of $X$ such that $a \in Sg(Y)$ must contain $Y$. We will
    explore this phenomenon in more detail in Section 2.4.


    **Corollary 1.15.** Let $A$ and $X$ be as in Theorem 1.14, and let $a \in A$.
    Then $a \in Sg(X)$ if and only if there is a finite subset $Y$ of $X$ such that
    $a \in Sg(Y)$.


    Proof. The right-to-left direction follows from Exercise 1.16.2. For the converse,
    by Theorem 1.14, there is a natural number $n$ such that $a \in X_n$. Assume $Y
    = \{a\}$. Now suppose that $n = m+1 > 0$. By definition, there is a basic operation
    $f$ and $b_1, \dots, b_k \in X_m$ such that $a = f(b_1, \dots, b_k)$. By the induction
    hypothesis, there are finite sets $Y_1, \dots, Y_k$ such that $b_i \in Sg(Y_i)$
    for $i=1, \dots, k$. Let $Y = Y_1 \cup Y_2 \cup \dots \cup Y_k$.


    An algebra $A$ is finitely generated if there is a finite subset $Y$ such that
    $A = Sg^A(Y)$.


