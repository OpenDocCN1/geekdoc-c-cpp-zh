    The index number, 1 through 5, appearing in the above corollary is called the
    type of the minimal algebra. Thus, for example, every finite vector space is of
    type 2. The types 1–5 are also called unary, affine, Boolean, lattice and semilattice
    type, respectively.


    # 8.2 Localization and induced algebras


    In 1980, P. Pálfy and P. Pudlák explored an unusual technique for inducing structure
    on a subset of A. It is this construction that McKenzie used as the foundation
    of congruence theory.


    Let A be a set, $f$ $n$-operation on $A$ and $U$ a subset of $A$. We write $f|_U$
    in place of the more precise $f|_{U}$.


    # Definition 8.8. Let A be an algebra and $U$ a subset of $A$.


    +   (1) $\mathbf{Pol}(A)|_U = \{f : f \in \mathbf{Pol}(A) \text{ & } f(U^n) \subseteq
    U\}$.


    +   (2) $\mathbf{A}|U = \langle U, \mathbf{Pol}(A)|_U \rangle$, called the algebra
    induced on $U$ by $\mathbf{A}$.


    The algebra $\mathbf{A}|U$ is the object of which we speak. It is induced from
    $\mathbf{A}$, but has no obvious relationship to $\mathbf{A}$. It is not even
    of the same similarity type as $\mathbf{A}$—in fact it has no similarity type
    at all. It is a nonindexed algebra. By a nonindexed algebra $(A, F)$ where $A$
    is a nonempty set and $F$ is a set of operations. Given nonindexed algebras $(A,
    F)$ and $(B, G)$, a function $h: A \rightarrow B$ is a nonindexed homomorphism
    if there is some way of indexing the sets $F$ and $G$ so that $h$ becomes a homomorphism
    of the corresponding algebras. We dont try to do too much with this concept, but
    it should be clear that we can take subalgebras, homomorphic images and powers
    of nonindexed algebras. On the rare occasion that we wish to generate a variety
    from $\mathbf{A}|U$, we fix $A$ itself as the index set and call the resulting
    algebra $\mathbf{A}|U$, the normal indexing.


    # Definition 8.9. Let A be an algebra.


    +   (1) $\mathbf{E}(A) = \{e \in \mathbf{Pol}(A) : e \circ e = e\}$. The set of
    idempotent unary terms of A.'
