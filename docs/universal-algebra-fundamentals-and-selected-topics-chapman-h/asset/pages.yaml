  md: "# 4. Clones, Terms, and Equational Classes\n\nFrom the theory of Galois connections\
    \ discussed in Section 2.5, we obtain a closure operation on Op(A). The closed\
    \ subsets of Op(A) are those of the form $\\mathcal{F}(\\Theta)$ for some set\
    \ $\\Theta$ of relations, and $F$ is closed if and only if $F = \\mathcal{F}(\\\
    mathcal{R}(F))$. Similar statements hold for the closed subsets of Rel(A). Furthermore,\
    \ there is an anti-isomorphism between the lattices of closed subsets of Op(A)\
    \ and Rel(A) (see Theorem 2.35).\n\n**Theorem 4.14.** *For any set $A$ and $\\\
    Theta \\in Rel(A)$, $\\mathcal{F}(\\Theta)$ is a *clone* on $A$. If $A$ is finite,\
    \ every clone is of the form $\\mathcal{F}(\\Theta)$ for some set $\\Theta$ of\
    \ relations on $A$.*\n\nIn other words, for a finite set $A$, the closed subsets\
    \ of Op(A) are precisely the clones. This has many applications. For example,\
    \ the clone of isotone operations of a poset $(P, \\le)$ (see Example 4.2.6) is\
    \ nothing but $\\mathcal{F}(\\le)$. The exercises discuss several of the other\
    \ examples from this perspective.\n\nProof. The proof that on a finite set every\
    \ clone is closed is left as Exercise 4.18.7. We shall show that every set of\
    \ form $\\mathcal{F}(\\Theta)$ is a clone. It is easy to see that the projection\
    \ operations preserve every relation. We are reduced to showing that for any relation\
    \ $\theta$ and operations $f_1, g_1, \\dots, g_m$\n\n```\n$f_1, g_2, \\dots, g_m\
    \ : \\theta \\implies f[g_1, g_2, \\dots, g_m] : \\theta.$\n```\n\nSo let $f$\
    \ be an $m$-ary and $g_1, \\dots, g_m$ $n$-ary operations preserving the $k$-relation\
    \ $\theta$. Let $\\hat{a}_i = (a_{i1}, \\dots, a_{ik}) \\in \\theta$, for $i=1,\
    \ \\dots, n$. For $j=1, \\dots, k$, let $\\hat{a}_j = \\{a_{1j}, \\dots, a_{nj}\\\
    }$. That is, $\\hat{a}_j$ is the $j$th column of the matrix in (4-2). We shall\
    \ show that $g_i$ preserves $f[g_1, \\dots, g_m](\\hat{a}_1), \\dots, g_m(\\hat{a}_k)]\
    \ \\in \\theta$. By assumption,\n\n```\n$g_1(\\hat{a}_1) \\quad g_1(\\hat{a}_2)\
    \ \\quad g_1(\\hat{a}_k) \\in \\theta$\\n$g_2(\\hat{a}_1) \\quad g_2(\\hat{a}_2)\
    \ \\quad g_2(\\hat{a}_k) \\in \\theta$\\n$\\dots \\quad \\dots \\quad \\dots$\\\
    n$g_m(\\hat{a}_1) \\quad g_m(\\hat{a}_2) \\quad g_m(\\hat{a}_k) \\in \\theta$\n\
    ```\n\nApplying $f$ to the columns of this matrix (using the fact that $f$ preserves\
    \ $\\theta$) we obtain $(f(g_1(\\hat{a}_1), \\dots, g_m(\\hat{a}_1)), \\dots,\
    \ f(g_1(\\hat{a}_k), \\dots, g_m(\\hat{a}_k))) \\in \\theta$. But $f(g_1(\\hat{a}_j),\
    \ \\dots, g_m(\\hat{a}_j)) = f[\\theta]$ from which the result follows.\n\nSuppose\
    \ once that $f$ is $n$-ary, and $g$ a $k$-ary, operation on a set $A$. The condition\
    \ that $f$ is a homomorphism $(A, g)^n \\to (A, g)$ is precisely\n\n```\n$f(a_{11},\
    \ \\dots, a_{n1}), g(a_{21}, \\dots, a_{2k}), \\dots, g(a_{1k}, \\dots, a_{nk})\
    \ =$\\ng(f(a_{11}, \\dots, a_{n1}), f(a_{12}, \\dots, a_{n2}), \\dots, f(a_{1k},\
    \ \\dots, a_{nk})). (4-3)\n```\n\nBut this equality is also equivalent to the\
    \ assertion that $g: (A, f)^k \to (A, g)$ is a homomorphism. When the condition\
    \ in (4-3) holds, we say that $f$ and $g$ commute."
