  md: "# 4. Identities and Birkhoff's theorem\n\nWhile Definition 4.35 gives the intuitively\
    \ right definition of satisfaction, the following characterization is often more\
    \ useful in practice.\n\n**Lemma 4.37.** $\\mathcal{K} \\models p \\approx q$\
    \ if and only for every $\\mathbf{A} \\in \\mathcal{K}$ and every homomorphism\
    \ $h: \\mathbf{T}(\\mathbf{A}) \to \\mathbf{A}$, we have $h(p)=h(q)$.\n\nProof.\
    \ Assume that $\\mathcal{K} \\models p \\approx q$. Pick $\\mathbf{A}$ and $h$\
    \ as in the theorem. Then\n\n```\n$\\mathbf{A} \\models p \\approx q \\implies\
    \ p^{\\mathbf{A}}=q^{\\mathbf{A}} \\implies$\n\\n$p^{\\mathbf{A}}(h(x_1), \\dots,\
    \ h(x_n)) = q^{\\mathbf{A}}(h(x_1), \\dots, h(x_n)).$\n```\n\nSince $h$ is a homomorphism,\
    \ we get $h(p^{\\mathbf{T}}(x_1, \\dots, x_n)) = h^{\\mathbf{T}}(x_1, \\dots,\
    \ x_n)$, i.e., $h(p)=h(q)$.\n\nTo prove the converse we take any $\\mathbf{A}\
    \ \\in \\mathcal{K}$ and $a_1, \\dots, a_n \\in \\mathbf{A}$ and show that $p^{\\\
    mathbf{A}}(a_1, \\dots, a_n)$. Let $h_0: \\mathcal{X}_\\omega \to \\mathbf{A}$\
    \ be a homomorphism with $h_0(x_i) = a_i$ for $i \\le n$. By Theorem 4.21, $h_0$\
    \ extends to a homomorphism $h$ from $\\mathbf{T}(\\mathcal{X}_\\omega)$ to $\\\
    mathbf{A}$. By assumption $h(p)=h(q)$. Since $h(p)=h(p^{\\mathbf{T}}(x_1, \\dots,\
    \ x_n)) = p^{\\mathbf{A}}(h(x_1), \\dots, h(x_n)) = p^{\\mathbf{A}}(a_1, \\dots,\
    \ a_n)$ (and similarly for $q$) the result.\n\n**Theorem 4.38.** $\\mathcal{K}$\
    \ be a class of algebras and $p \\approx q$ an equation. The following are:\n\n\
    +   (a) $\\mathcal{K} \\models p \\approx q$.\n\n+   (b) $(p,q)$ belong to the\
    \ congruence $\\lambda_{\\mathcal{K}}$ on $\\mathbf{T}(\\mathcal{X}_\\omega)$.\n\
    \n+   (c) $\\mathbf{F}_{\\mathcal{X}_\\omega} \\models p \\approx q$.\n\nProof.\
    \ We show (a) $\\Rightarrow$ (c) $\\Rightarrow$ (b) $\\Rightarrow$ (a). Through\
    \ which we write $\\mathbf{F}$ for $\\mathbf{F}_{\\mathcal{X}_\\omega}$, $\\mathbf{T}$\
    \ for $\\mathbf{T}(\\mathcal{X}_\\omega)$, and $\\lambda$ for $\\lambda_{\\mathcal{K}}$.\
    \ Recall that $\\mathbf{F} = \\mathbf{T}/\\lambda$ in $\\mathbf{SP}(\\mathcal{K})$.\
    \ From (a) and Lemma 4.36 we get $\\mathbf{SP}(\\mathcal{K}) \\models p \\approx\
    \ q$. Thus (c) holds.\n\nFrom (c), we have $p^{\\mathbf{F}}(x_1, \\dots, x_n)\
    \ = q^{\\mathbf{F}}(x_1, \\dots, x_n)$ where $x_i = x_i/\\lambda$. By the definition\
    \ of $F$, $p^{\\mathbf{T}}(x_1, \\dots, x_n) = q^{\\mathbf{T}}(x_1, \\dots, x_n)$\
    \ which from (b) follows that $p=p^{\\mathbf{T}}(x_1, \\dots, x_n)$ and $q=q^{\\\
    mathbf{T}}(x_1, \\dots, x_n)$.\n\nFinally (b). We use Lemma 4.37. Let $\\mathbf{A}\
    \ \\in \\mathcal{K}$ and $h: \\mathbf{T} \\to \\mathbf{A}$ be a homomorphism.\
    \ Then $\\ker h \\in \\mathbf{H}(\\mathcal{K}) \\subseteq \\mathbf{S}(\\mathcal{K})$\
    \ where $\\ker h \\supseteq \\lambda$. Then (b) implies that $h(p)=h(q)$ holds.\n\
    \nTheorem 4.38 tells us that we can determine whether an identity is in a variety\
    \ by a particular algebra, namely $\\mathbf{F}(X_\\omega)$. Sometimes it is convenient\
    \ to work with algebras free over other generating sets besides $X_\\omega$. The\
    \ following corollary takes care of that for us.\n\n**Corollary 4.39.** $\\mathcal{K}$\
    \ be a class of algebras, $p$ and $q$ $n$-ary terms, $Y$ a set and $y_1, y_2,\
    \ \\dots, y_n$ distinct elements of $Y$. Then $\\mathcal{K} \\models p \\approx\
    \ q$ if and only if $p^{\\mathbf{F}(Y)}(Y) = q^{\\mathbf{F}(Y)}(y_1, \\dots, y_n)$.\
    \ In particular, $\\mathcal{K} \\models p \\approx q$ if and only"
