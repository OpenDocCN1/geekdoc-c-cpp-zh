  md: '# 4. Applications


    is a minimal algebra of type 1. To summarize, every passive variety admits type
    1. We now proceed to demonstrate that the converse holds locally finite varieties.


    **Theorem 8.55.** *Let $\mathcal{V}$ be a locally finite variety. If $1 \in \text{typ}(\mathcal{V})$
    then $\mathcal{V}$ has no Taylor term.*


    *Proof.* By assumption, there is a finite algebra, $\mathbf{A}$, in $\mathcal{V}$
    and at atom, $\beta$, of Con(A) such that type$(0,\beta$)=1. Let $U$ be a $(0,\beta)$-minimal
    set and $N$ a trace of $U$. By Theorem 8.13, there is $e \in \mathbf{E}(\mathbf{A})$
    such that $U = \overline{e}(\mathbf{A})$.\nSuppose that $t$ is a Taylor term for
    $\mathcal{V}$, and define $f = e \circ t^{\wedge N}$. Since $t$ is idempotent,
    $f$ is a polynomial of $\mathbf{A}|_N$ and therefore, $f$ is a Taylor term for
    $\mathbf{M} = \mathbf{A}|_N$. However, as the projections are the only terms of
    $\mathbf{M}$ $\mathbf{M}$ cannot support a Taylor term. $\square$


    Putting these arguments, we obtain the following characterization.


    **Corollary 8.56.** *Let $\mathcal{V}$ be a locally finite, idempotent variety.
    The following are equivalent.*


    +   1) $\mathcal{V}$ omits type 1;

    2) $\mathcal{V}$ is active;

    3) $\mathcal{V}$ has a Taylor term.


    *Proof.* The equivalence of (2) and (3) comes from Theorem 8.54, while (3) implies
    (1) is Theorem 8.55. The paragraph preceding 8.55 argues that (1) implies (2).
    $\square$


    **Some remarks.** In the literature, the definition of a Taylor term has the additional
    requirement that in the identities of Definition 8.53, every $x_{ij}$ and $y_0$
    come from $\{x, y\}$. Let us, for a moment, call such a term a “super Taylor term”.
    Obviously, super Taylor term is a Taylor term, by its definition. On the other
    hand, if $t$ is a Taylor term, then by specializing all of the variables to $x$
    and $y$, we determine that $t$ is, in fact, special. Thus “Taylor” and “super
    Taylor” coincide.


    Corollary 8.56 can be significantly strengthened in several ways. First, the finite
    assumption is only used in the proof of (2) implies (3). It possible to do so
    without that assumption. In fact, much more is true. The existence of a Taylor
    term is a Maltsev condition, but not a strong Maltsev condition (since there is
    no bound on the rank of the term). Recent work [see KMM09] and also [Sig10] shows
    that every active variety $\mathcal{V}$ has a term $t(x,y,z,u)$ satisfying the
    identities


    ```

    $t(x,x,x,x) \approx x \quad \approx t(x,y,z,y) \approx t(y,z,x,x).

    ```


    Thus the class of active variety is Maltsev.'
