  md: "# 1. Clones\n\ndenoted $C_{(n)}$. Similarly the set of $n$-ary members of $Clo(F)$\
    \ is denoted $Clo_n(F)$.\n\nAs always, we seek a “bottom-up” description of the\
    \ members of $Clo(F)$. By thinking of a clone as a kind of algebra it is clear\
    \ that a description analogous to Theorem 1.14 ought to be possible. But recall\
    \ that function composition, even generalized composition, is associative. This\
    \ makes it possible to provide a slightly slicker formulation, in the manner of\
    \ Exercise 1.16.4.\n\n**Theorem 4.3.** Let $A$ be a set and $F$ a set of operations\
    \ on $A$. Define\n\n```\n$F_0 = \text{Proj}(A);\nF_{n+1} = F \\cup \\{f[g_1, \\\
    dots, g_k] : f \\in F, k = \text{rank } f\\ng_1, \\dots, g_k \\in F \\cap \\text{Op}_m(A),\
    \ \\text{ some } m \\in \\omega, \\quad \\text{for } n \\in \\omega$.\n```\n\n\
    *Then $Clo^{\\wedge}(F) = \\mathbf{F}$.*\n\n*Proof.* Let $\\mathbf{F} = \\bigcup_n\
    \ F_n$. It is easy to argue that every $F_n \\subseteq Clo(F)$. Thus $\\mathbf{F}\
    \ \\subseteq Clo(F)$. For the converse, we must show that $\\mathbf{F}$ is a clone\
    \ containing $F$. Since $F_0 \\subseteq \\mathbf{F}$, we see that $\\mathbf{F}$\
    \ contains the projection operations. For any $k$-ary operation $f \\in \\mathbf{F}$\
    \ we have $f = f[p_1^k, \\dots, p_k^k] \\in F_1 \\subseteq \\mathbf{F}$. We are\
    \ reduced to showing that $\\mathbf{F}$ is closed under generalized composition.\
    \ This follows from this claim.\n\n**Claim.** If $f \\in \\mathbf{F}$ is $k$-ary\
    \ and $g_1, \\dots, g_k \\in F_m$ are all of the same rank, then $f[g_1, \\dots,\
    \ g_k] \\in F_{n+m}$.\n\n*Proof.* We follow the claim by induction on $n$. If\
    \ $n=0$ then $f$ is a projection, so $f[g_1, \\dots, g_k] = g_i \\in F_{0+m}$\
    \ for some $i \\leq k$. Assume the claim holds for $n$ and $f \\in F_{n+1} - F_n$.\
    \ From the definition, there are operations $f$ of rank $k$ and $h_1, \\dots,\
    \ h_k \\inin F_m$ such that $f = f[h_1, \\dots, h_k]$. Note that the rank of each\
    \ $h_i$ must be equal to the rank of $f$, namely $k$. By the induction hypothesis,\
    \ for $i \\leq k$, $h_i' = f[g_1, \\dots, g_k] \\in F_{n+m}$. Applying the definition,\
    \ $f[h_1', \\dots, h_k'] \\in F_{n+m+1} = F_{(n+1)+m}$. Since\n\n```\n$f[h_1',\
    \ \\dots, h_k'] = f[h_1[g], \\dots, h_k[g]] = f[g]$\n```\n\nthe claim is proved.\n\
    \n**Corollary 4.4.** For any set $A$, $\\mathbf{L}_{Clo^{\\wedge}}$ is an algebraic\
    \ lattice.\n\nIf we take another look at the definition of $F_{n+1}$ in Theorem\
    \ 4.3, we see that the rank of the newly constructed function $f[g_1, \\dots,\
    \ g_k]$ does not depend on $f$, but only on the rank of $g_1, \\dots, g_k$ in\
    \ $F_n$, which already appear (for a fixed $m$), if $F_0$ were to contain only\
    \ $m$-ary operations we would never obtain anything but $m$-ary operations from\
    \ this construction. Using this observation we directly build the set $Clo_m A$."
