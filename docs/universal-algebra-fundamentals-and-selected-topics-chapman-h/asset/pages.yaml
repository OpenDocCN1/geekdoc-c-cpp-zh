  md: '# 4. Clones, Terms, and Equational Classes


    ![](img/4f610fb94046e9c65f60698e9fcee011_112_0.png)


    FIGURE 4.5: Illustration of Theorem 4.28


    **Definition 4.26.** Let $\mathcal{K}$ be a class of algebras and $\mathbf{A}$
    an algebra of the same type. We define


    $$\Lambda^{\mathcal{K}} = {\theta \in \text{Con } \mathbf{A} : \mathbf{A}/\theta
    \in \mathbf{S}(\mathcal{K})}$

    $\lambda_{\mathcal{K}}^{\mathbf{A}} = \Lambda_{\mathcal{K}}^{\mathbf{A}}$


    Of course, we leave out the superscripts and subscripts when we can get away with
    it. Notice that it is possible for $\Lambda$ to be empty. In that case $\lambda^{\mathbf{A}}
    = I_{\mathbf{A}}$ and the quotient $\Lambda/\lambda$ be a trivial algebra.


    **Lemma 4.27.** Let $\mathcal{K}$ be a class of algebras, and $\mathbf{A}$ an
    algebra of the same type. Then $\mathbf{A}/\lambda_{\mathcal{K}} \in \mathbf{SP}(\mathcal{K})$.


    Proof. $\mathbf{A}/\lambda \rightarrow \coprod { \mathbf{A}/\theta : \theta \in
    \Lambda} \in \mathbf{PS}(\mathcal{K})$ so $\mathbf{A}/\lambda_{\mathcal{K}} \in
    \mathbf{SPS}(\mathcal{K}) = \mathbf{SP}(\mathcal{K})$.


    **Theorem 4.28.** Let $\mathbf{U}$ be free for $\mathcal{K}$ over $X$. Then $\mathbf{U}/\lambda_{\mathcal{K}}
    \in \mathbf{SP}(\mathcal{K})$ over $X/\lambda_{\mathcal{K}}$.


    Proof. $\overline{U} = \mathbf{U}/\lambda$ and $\overline{X} = X/\lambda^{\mathcal{K}}$.
    Since $\mathcal{K}$ generates $\mathbf{U}$, it follows from Theorem 3.2 that $\mathcal{K}$
    generates $\overline{U}$. From Lemma 4.27, $\mathbf{U} \in \mathbf{SP}(\mathcal{K})$.
    If we can show that $\overline{U}$ has the universal mapping property for $\mathcal{K}$,
    then by Proposition 4.25 $\overline{U}$ is free in $\mathbf{SP}(\mathcal{K})$
    over $\overline{X}$.


    Let $\mathbf{A} \in \mathcal{K}$ and $h: \mathcal{K} \rightarrow \mathbf{A}$.
    Let $q$ be the canonical map from $\mathbf{U}$ to $\mathbf{A}$. Since $\mathbf{U}$
    is free over $X$, there is a homomorphism $h: \mathbf{U} \rightarrow \mathbf{A}$
    extending $h \circ q$ (see Figure 4.5). We define $\psi = h|q$. By the fundamental
    homomorphism theorem, $\mathbf{U}/\psi \in \mathbf{S}(\mathbf{A})$ and $\lambda_{\mathcal{K}}^{\mathbf{A}}
    \leq \psi$. Since $\lambda_{\mathcal{K}}^{\mathbf{A}} = q$, then by Exercise 1.26.8,
    there is a homomorphism $h'': \overline{U} \rightarrow \mathbf{A}$ such that $h''
    = h \circ q$. But now it follows that $h''|\overline{X} = h|$.


    Although the statement of the above theorem shows that $\lambda_{\mathcal{K}}$
    might identify the two free generators of $\mathbf{U}$, in practice that does
    not occur. Exercise 4.34.2 shows that if $\mathcal{K}$ contains a nontrivial algebra
    then $\lambda_{\mathcal{K}}|X = 0_X$.'
