  md: "# 7. Maltsev Varieties\n\n**Theorem 7.50** (Hagemann and Herrmann [HH79]).\
    \ Let $\\mathcal{V}$ be a Maltsev variety. $\\mathcal{V}$ is congruence-distributive\
    \ if and only if $\\mathcal{V}$ is neutral.\n\nProof. We have already observed\
    \ that every neutral variety is congruence-distributive. Suppose that $\\mathcal{V}$\
    \ is not neutral, $\\mathbf{A} \\in \\mathcal{V}$, $\\alpha, \beta \\in \\text{Con}(\\\
    mathbf{A})$ and $[\\alpha, \beta] < \\alpha \\wedge \\beta$.\n\nLet $\\tilde{\\\
    gamma} = \\alpha \\wedge \\beta$. By monotonicity, $[\\tilde{\\gamma}, \\tilde{\\\
    gamma}] \\leq [\\alpha, \\beta] \\leq \\tilde{\\gamma}$. Take $\\mathbf{B} = \\\
    mathbf{A}/[/\\alpha, \\beta]$ and $\\gamma = \\tilde{\\gamma}/[/\\alpha, \\beta]$.\
    \ We have $\\gamma > 0$ and $[\\gamma, \\gamma] = 0$ by Theorem 7.49(2).\n\nNow\
    \ Con$(\\mathbf{B}(\\gamma))$ contains the following sublattice, which shows that\
    \ $\\mathcal{V}$ is not congruence-distributive. Here $\\Delta$ is $\\Delta_{\\\
    gamma}$.\n\n![](img/4f610fb94046e9c65f60698e9fcee011_236_0.png)\n\nThus to observe\
    \ that $[\\gamma, \\gamma] = 0$ implies $\\gamma \\leq \\gamma^*$. Thus by Theorem\
    \ 7.25 $( \\begin{smallmatrix} a \\ b \\end{smallmatrix} ) \\in \\eta_1 \\wedge\
    \ \\Delta$ implies that $a = c$ and $b = q(a,c,d) = q(a,a,d) = d$. Thus $\\eta_1\
    \ \\wedge \\Delta = 0$. On the other hand, if $a \\gamma c$ then\n\n![](img/4f610fb94046e9c65f60698e9fcee011_236_1.png)\n\
    \nshowing that $\\eta \\ \\wedge \\Delta = \\gamma_1$.\n\nAs an application, we\
    \ can give another proof of Lemma 4.74. Suppose that $\\mathcal{V}$ is a congruence-distributive\
    \ commutative rings. Let $\\mathbf{F} = \\mathbf{F}_q(x)$ be the free algebra\
    \ over one generator. If $\\mathcal{V}$ is congruence-distributive, it is neutral.\
    \ Thus $[1, 1]_{\\mathbf{F}} = 1$. Then by Exercise 7.52.1, $F \\cdot F = F \\\
    mathbf{F}$ (as ideals). Since $\\mathbf{F} = x\\mathbb{Z}[x]$, there are polynomials\
    \ $g_1(x), g_2(x) \\in \\mathbb{Z}[x]$ such that $g_1(x) \\cdot g_2(x) = x$ in\
    \ \\\\mathbf{F}$. By factoring out $x$ from $g_1$, we get $\\mathcal{V}' \\approx\
    \ x$ for some $f(x) \\in \\mathbb{Z}[x]$.\n\n**Theorem 7.51.** Let $\\mathcal{V}$\
    \ be a Maltsev variety. A subproduct of finitely many neutral algebras from $\\\
    mathcal{V}$ and $\\mathbf{C}$ is neutral.\n\nProof. Let $\\mathbf{A}_1, \\mathbf{A}_2$\
    \ be neutral algebras in $\\mathcal{V}$ and $\\mathbfmathbf{C}$ a subproduct of\
    \ $\\mathbf{A}_1 \\times \\mathbf{A}_2$. It suffices to show that $\\mathbf{C}$\
    \ is neutral and apply. The canonical projection and $\\eta_i = \\text{ker} p_i$.\
    \ We claim that\n\n```\n$(\\forall \\theta, \\psi \\in \\text{Con}(\\mathbf{C}))\
    \ \\theta \\wedge \\psi = [\\theta, \\psi] (\\eta_i \\wedge \\theta \\wedge \\\
    psi), \\quad \\text{for } i=1, 2. \\quad (7-19)$\n```\n\nFirst, as $\\mathbf{A}_1$\
    \ is neutral,\n\n```\n$\\theta \\wedge \\psi[\\eta_i] = (\\theta \\wedge \\psi)\
    \ (\\vee \\wedge \\psi) \\geq \\theta \\wedge \\psi$.\n```"
