    \rightarrow \begin{pmatrix} q(x_1, x_2, x_3) \ q(y_1, y_2, y_3) \ q(z_1, z_2,
    z_3) \end{pmatrix} \rightarrow \star$$\$

    $$

    q(x_1, y_1, z_1) \quad q(x_2, y_2, z_2) \quad q(x_3, y_3, z_3)$$

    ```


