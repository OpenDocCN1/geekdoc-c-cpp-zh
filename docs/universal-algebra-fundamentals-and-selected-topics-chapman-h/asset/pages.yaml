    # 5.3 Model theory


    Universal algebra, as algebraic as we have constructed in this text, studies the
    relationship between algebraic structures and identities. First-order formulas
    are far more expressive than identities, allowing us to define a much wider range
    of algebras. But this is a double-edged sword. For the wider one casts''s net,
    the less powerful are the tools one can bring to bear.


    And yet, the tools of model theory are considerable. First-order sentences behave
    nicely within ultraproducts (Theorem 5.21) and the elementary classes from an
    algebraic lattice (Theorem 5.22). These two properties will play a crucial role
    in our analysis of finitely based varieties in Section 5.5.


    First-order logic also allows us to consider structures with basic relations in
    addition to operations. Through graphs, sets and ordered fields become objects
    of study. However, as we broaden the scope, the subject becomes well, less algebraic.
    For this reason and because logic is itself subject worthy of an entire book of
    its own, we restrict our treatment to the bare minimum need to achieve our algebraic
    ends. The interested reader can consult any number of texts, for example [Hin05]
    or [Men10].


    Our definition of first-order formula can be seen as extending the notion of term
    as given in Definition 4.19. In addition we are provided with several logical
    connectives, “$\wedge$”, $$

    eg$”, and “$\exists$”. We use parentheses as additional punctuation when necessary.


