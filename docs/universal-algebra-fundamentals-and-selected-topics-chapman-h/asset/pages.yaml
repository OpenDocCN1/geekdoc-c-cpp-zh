    \nWe are now going to develop the theory of an algebraic structure that is not\
    \ typical part of a first-year algebra course. It forms a contrast to the Abelian\
    \ group and commutative rings.\nRecall that a bounded distributive lattice is\
    \ an algebra $(L, \\wedge, \\vee, 0, 1)$ satisfying the following identities:\n\
    \n```\n$x \\wedge (y \\vee z) \\approx (x \\wedge y) \\vee z,\\n$x \\vee y \\\
    approx y \\vee x,\\n$x \\wedge x \\approx x,\\n$x \\wedge (y \\vee z) \\approx\
    \ x,\\n$x \\wedge 0 \\approx 0,\\n$x \\wedge (y \\vee z) \\approx (x \\wedge z).$\
    \ (3-2)\n```\n\nThere are, of course, many variations on this definition. For\
    \ example, the idempotent laws can be dropped, and the two laws defining the bounds\
    \ can be replaced with: $x \\vee 0 \\approx x \\wedge 1$.\n\n**Definition 3.30.**\
    \ Let $L$ be a bounded distributive lattice, $a,b \\in L$ is called the pseudocomplement\
    \ of $a$, for every $x \\in L$, $x \\wedge a = 0 \\iff x \\leq b$. (That is, $b$\
    \ is the largest element of $L$ disjoint from $a$.)\n\nFinally, a bounded distributive\
    \ lattice is pseudocomplemented if every element has a pseudocomplement. In such\
    \ a lattice, we denote the pseudocomplement of $a$ by $a^*$.\n\n**Example 3.31.**\
    \ (1) Every complemented distributive lattice is pseudocomplemented.\n\n+   Every\
    \ distributive lattice is pseudocomplemented. Let $\\mathbf{L}$ be such a lattice\
    \ and let $a \\in L$. Then\n\n```\n$a^* = \\bigvee_{x \\wedge a=0} x$.\n```\n\n\
    By distributivity\n\n```\n$a^* \\wedge a = \\bigvee_{x \\wedge a=0} (x \\wedge\
    \ a) = 0$.\n```\n\n+   (2) Let $X$ be a set, and $\\Omega$ a topology on $X$.\
    \ Then $\\Omega = \\langle \\Omega, \\cap, \\varnothing, X \\rangle$ forms the\
