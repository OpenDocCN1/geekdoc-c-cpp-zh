    The compact elementary theories are precisely those that are finitely generated.
    The corresponding elementary classes are called finitely axiomatizable or strictly
    elementary. These classes are important for several reasons. For one thing, it
    is always possible to determine which finite algebras are members.


    Note that in general, the complement of an elementary class is not elementary.
    However, by taking an appropriate conjunction, any finitely axiomatizable class
    can actually be axiomatized by a single first-order sentence. And therefore the
    complement of the class is axiomatized by the negation of that sentence. In contrast
    to an arbitrary elementary class, the complement of a finitely axiomatizable class
    is again elementary, and is, in fact, finitely axiomatizable.


