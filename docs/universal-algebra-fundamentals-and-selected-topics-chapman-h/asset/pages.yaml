  md: '# Chapter 7


    # Maltsev Varieties


    In this chapter we drop our assumption of congruence-distributivity, but retain
    congruence-permutability. Structures now will be much more group-like. We lose
    the power of Jónsson''s lemma, so the analysis of subdirectly irreducible algebras
    becomes more delicate. The study of the congruence lattices of products becomes
    essential. One might say that the central goal of this chapter is an understanding
    of skew congruences.


    # 7.1 Directly representable varieties


    Any conception of “highly structured variety” should surely include the varieties
    of Boolean algebras and Abelian groups. Among their attributes, the finite algebras
    in each of these varieties decompose nicely. In fact:


    +   - every finite Boolean algebra is a direct power of $\mathcal{B}_1$;


    +   - every finite Abelian group is a product of cyclic groups of prime-power
    order.


    This is the inspiration for the following definition.


    **Definition 7.1.** A finitely generated variety is called directly representable
    if and only if it has finitely many directly indecomposable algebras.


    Now we acknowledge that the variety of all Abelian groups does not qualify as
    directly representable since it is not finitely generated (and, in fact, infinitely
    many directly indecomposable algebras). However, every proper subvariety of Abelian
    groups is directly representable.


    Several mathematicians contributed to a characterization of directly representable
    varieties, including D. Clark, P. Krauss, and S. Bur. The project was completed
    in 1982 by Ralph McKenzie [McK82], who reduced the question to find these finite
    rings whose variety of modules is directly representable. This characterization
    is one of the milestones of modern universal algebra. The problem for rings is
    still open.


    The reader will not be surprised to learn that congruence-permutability plays
    a role in the analysis of direct representability. McKenzie''s first achievement
    was to prove necessity: every directly representable variety is Maltsev.


