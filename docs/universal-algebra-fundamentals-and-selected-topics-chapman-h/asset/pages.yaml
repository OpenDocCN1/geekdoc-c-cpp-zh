  md: '# 4. Clones, Terms, and Equational Classes


    Op(A) contains all projection operations and is closed under generalized composition.


    **Example 4.2.** Here are some examples of clones to get started.


    +   (1) Op(A) and Proj(A) = \{p_i^k : 1 \le k \le n\} are clones on any set A.


    +   (2) The $Z$-linear functions on Q, i.e., the set of all operations of the
    function $f(x_1, \dots, x_n) = a_1x_1 + \dots + a_nx_n$ with $a_i \in Z$ forms
    a clone on Q. Similarly, the set of $Z$-affine functions on Q forms a clone. $f(x_1,
    \dots, x_n)$ is *affine* if it is of the form $a_1x_1 + \dots + a_nx_n + b$ for
    $a_1, \dots, a_n \in Z$ and $b \in \mathbb{Q}$.


    +   (3) The "polynomial ring" $\mathbb{Z}[x_1, x_2, \dots]$ is a clone over Q
    (or any commutative ring with identity, for that matter).


    +   (4) The set $\mathcal E(A)$ of all idempotent operations on A is a clone.
    Recall that an operation $f$ is *idempotent* if $f(x, \dots, x) = x$ for all $x$.


    +   (5) The set $\mathcal U(A)$ of all essentially unary operations on A is a
    clone. An n-ary operation $f$ is *essentially unary* if for some $k \le n$ and
    $g \in \text{Op}_1(A)$, $f(x_1, \dots, x_n) = g(x_k)$.


    +   (6) $\langle P, \le \rangle$ is a poset. The set of all monotone operations
    is a clone on P. An operation $f$ is *isotone* if $x_i \le y_i$ for $i \le n$
    implies $f(x_1, x_2, \dots, x_n) \le f(y_1, \dots, y_n)$.


    As a rule, a clone is a very complicated object, containing operations of every
    rank. Most clones cannot be described easily as "the set of all f such that blah-blah-blah."
    It is a major challenge to find the techniques for characterizing clones. We provide
    a couple of illustrations in this and the next section.


    First, we see a new-familiar pattern. Let A be a fixed set. The collection of
    clones on A is ordered by inclusion, and is closed under arbitrary intersection.
    By Projection 2.14, it forms a complete lattice. The smallest and largest elements
    of this lattice are Proj(A) and Op(A) respectively. There is an associated clone,
    $\text{Clo}^A$. In other words, for any $F \subseteq \text{Op}(A)$, $\text{Clo}^A(F)$
    is the smallest clone containing $F$. We denote this lattice $\text{L}_{\text{Clo}^A}$.
    In fact, it turns out that $\text{L}_{\text{Clo}^A}$ is not just complete, but
    is both algebraic and co-algebraic. (Naturally, we use the superscript "A" when
    we think that no one will tell us at.)


    Post [54] proved in 1941 that the lattice of clones on a two-element set is countable.
    By contrast, if $|A| > 2$ then A has uncountably many clones (Janov and Mucnik
    [JM59], 1959; and Hulanicki and Swierczkowski [HS60], 1960). For infinite sets
    A, the lattice of clones is so complicated that almost nothing is known about
    it.


