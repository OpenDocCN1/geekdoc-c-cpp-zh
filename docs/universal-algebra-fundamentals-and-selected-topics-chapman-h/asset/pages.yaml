  md: '# 4. Clones, Terms, and Equational Classes


    Term-equivalent varieties are “the same” for most universal-algebraic purposes.
    Subalgebras correspond to subalgebras, products to products. Even the free algebras
    of one variety will be transformed into the free algebras of the other under a
    term-equivalence. (Except perhaps for a free on 0 generators).


    Two important classes of interpretations are the formation of reduces (see page
    7) and subvarieties. In fact, as every function factors into a surjection followed
    by an injection, every interpretation can be obtained as a reduct plus an inclusion
    of a subvariety into a variety, with perhaps a term-equivalence thrown in.


    Of course all familiar transformations are interpretations. For example the mapping
    that assigns to each ring with its identity its group of units is not an interpretation,
    since it does not preserve the underlying set of the ring. The following theorem
    provides a characterization of those transformations that arise from interpretations.


    **Theorem 4.78.** $\mathcal{V}$ and $\mathcal{W}$ be varieties with no nullary
    operation symbols, and let $T: \mathcal{W} \to \mathcal{V}$ be a transformation.
    The following are equivalent.


    +   (1) There is an interpretation $D$ of $\mathcal{V}$ in $\mathcal{W}$ such
    that for every $B \in \mathcal{W}$, $T(\mathbf{B}) = \mathbf{B}^D$.


    +   (2) For **every** $A, B \in \mathcal{W}$ and homomorphism $h: A \to B$, the
    **underlying universes of** $\mathbf{A}$ **and $T(\mathbf{A})$ are the same and**
    $T(\mathbf{A}) \to T(\mathbf{B})$ is a homomorphism.


    The important point in condition (2) is that it is the same function $h$ that
    is operating on both $\mathbf{A}$ and $T(\mathbf{A})$. Of course this would not
    make sense if the underlying universes were not the same. Condition (2) can be
    stated succinctly in the language of category that says $T$ is a function that
    commutes with the forgetful functor. Exercise 480.1 further shows the importance
    of the requirement that $T$ preserve underlying sets.


    *Proof.* $(1) \Rightarrow (2)$ is immediate since a $\mathcal{W}$-homomorphism
    must preserve every $\mathcal{W}$-term. Let $f$ be a basic $n$-ary operation symbol
    of $\mathcal{V}$ and $F = f^{\mathcal{W}}(X_n)$. By assumption, $T(\mathbf{A})$
    and $T(\mathbf{B})$ share the same universe, so $X_i \in T(\mathbf{F})$. Let $f^{T(\mathbf{F})}(x_1,,\dots,x_n)
    = a \in T(\mathbf{F})$. Since $F$ is generated by $X_n$ (as a $\mathcal{W}$-algebra),
    there is a $\mathcal{W}$-term $t_f(x_1,,\dots,x_n) = a$. We define $D(f) = t_f$.


    To verify condition (1), $B \in \mathcal{W}$. By assumption, $T(\mathbf{B}) =
    \mathbf{B}^D$. Let $f$ be an $n$-ary operation symbol of $\mathcal{V}$, and $b_1,
    \dots, b_n \in \mathcal{B}$. To show $f^T(\mathbf{B})(\mathbf{b}) = f^P(\mathbf{b})^P
    = \mathbf{b}^D$. By definition, $(f^B)^D = \mathbf{b}^D$. Let $h: \mathbf{F} \to
    \mathbf{B}$ be such that $h(x_i) = b_i$, for $i \le n$. ($h$ is guaranteed to
    exist because $\mathbf{F}$ is free) Then


    ```

    $t_f^T(\mathbf{B})(\mathbf{b}) = t_f^B(h(x)) = t_f^{T(\mathbf{F})}(h(x)) = a$$

    $$f^{T(\mathbf{F})}(x)) = f^T(\mathbf{B})(h(x)) = f^T(\mathbf{B})(\mathbf{b}).$

    ```'
