    \ \\lambda_{rs}(x)$\n```\n\nNote that the similarity type of a module depends\
    \ upon the ring. If the ring is infinite, and so the similarity type. And also\
    \ that we have employed another device to indicate the basic operations on this\
    \ algebra.\n\n**Definition 1.6.** A *quasigroup* is an algebra $\\langle Q, \\\
