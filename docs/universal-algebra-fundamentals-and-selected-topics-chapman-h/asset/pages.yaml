    # 2.4 Closure operators and algebraic lattices


    **Definition 2.23.** Let **A** be a set. A *closure operator* on **A** is a function
    $C: \text{Sb}(A) \to \text{Sb}(A)$ such that for all $X, Y \subseteq \mathbf{A}$


    +   (1) $X \subseteq C(X)$$\n(2) $C(C(X)) = C(X)$$\n(3) $X \subseteq Y \implies
    C(X) \subseteq C(Y)$.


    From 1.16.2 and 1.26.9 we see that for any algebra **A**, $\text{Sg}^\mathbf{A}$
    and $\text{Cg}^\mathbf{A}$ are closure operators on A. The word “closure” comes
    from topology: if we define $C(X) = \overline{X}$ (the smallest closed set containing
    X), then $C$ is a closure operator on the topological space.


    Carrying this a little further, the closed subsets of a topological space are
    those where $X = C(X)$. This inspires the following definition.


    **Definition 2.24.** Let **C** be a closure operator on the set **A**. We define
    $L_C$ to be the set of all $X \subseteq \mathbf{A}$ such that $X = C(X)$. These
    sets are called the *$C$-closed* subsets of **A**.


    Thus the $\text{Sg}^\mathbf{A}$-closed subsets of A are exactly the congruences
    of **A**, and the $\text{Cg}^\mathbf{A}$-closed subsets of $A^2$ are the congruences
    of **A**. If of course the operator **C** is clear from context, we usually talk
    about “closed sets.”'
