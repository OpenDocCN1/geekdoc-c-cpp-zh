    \ as in Lemma 7.76 and pick $\\alpha \\in \\text{Aut}(\\mathbf{A})$. Since $\\\
    mathbf{A}$ has no proper subalgebras, for every $i \\le m$ there is a unary $r_i$\
    \ such that $r_i^{\\mathbf{A}}(a) = b_i$.\n\n```\n$p(x, y, z, w) = t(x, y, z,\
    \ r_1(w), \\dots, r_m(w)).$\n```\n\nThen $f(x, y, z) = p^{\\mathbf{A}}(x, y, z)$.\\\
