  md: "# 8. Finite Algebras and Locally Finite Varieties\n\n**Exercise Set 8.39.**\n\
    \n+   1. Let **A** be an algebra, $\\delta \\le \\alpha \\le \beta$ congruences\
    \ on **A**. Show that $\beta$ is Abelian over $\\alpha$ in **A** if and only if\
    \ $\beta/\\delta$ is Abelian over $\\alpha/\\delta$ in **A**. Do the same with\
    \ \"Abelian\" replaced by \"strongly Abelian.\"\n\n+   2. Let **A** be a finite\
    \ algebra, $\\alpha < \beta$ in $\text{Con}(\\mathbf{A})$, $U \\in \text{M}_{\\\
    mathbf{A}}(\\alpha, \beta)$, and $U = \\vec{e}(A)$ for some $e \\in \text{E}(\\\
    mathbf{A})$. Then $\\mathbf{A}|_U$ is $(\\alpha|_U, \beta|_U)$-minimal algebra.\n\
    \n+   3. Prove that if $\\alpha_i < \beta_i$ are congruences on a finite algebra\
    \ $\\mathbf{I}[\\alpha_0, \beta_0] / \\mathbf{I}[\\alpha_1, \beta_1]$, then $\t\
    ext{M}(\\alpha_0, \beta_0) = \text{M}(\\alpha_1, \beta_1)$.\n\n+   4. Let **A**\
    \ be a finite algebra and $0_A = \\alpha_0 < \\alpha_1 < \\cdots < \\alpha_n =\
    \ 1_A$ be a chain of congruence covers. Prove that **A** has no $(0_A, 1_A)$-2\
    \ snags if and only if, for every $i < n$, $(\\alpha_i, \\alpha_{i+1})$ is Abelian.\n\
    \n# 8.4 Applications\n\nTame congruence theory provides numerous insights into\
    \ the structure of a finite algebra, far more than we can cover in this text.\
    \ We, however, developed enough of the theory to demonstrate its power. In this\
    \ section, we give several examples.\n\nRecall from Section 5.2 that if $\\mathcal{K}$\
    \ is a set of finite algebras generating a congruence-distributive variety $\\\
    mathcal{V}' and if **A** is a sub irreducible member of $\\mathcal{V}'$, then\
    \ $\\mathbf{A} \\in \text{HS}(\\mathcal{K})$. Here is a related theorem that does\
    \ not require any global assumption\n\n**Theorem 8.40.** Let $\\mathcal{K}$ be\
    \ a finite set of finite algebras and assume that **A** is finite, simple, and\
    \ of Boolean or lattice type. If $A \\in \\mathbf{V}(\\mathcal{K})$ then $\\mathbf{A}\
    \ \\in \text{HS}(\\mathcal{K})$.\n\nIn this theorem, by the type of **A**, we\
    \ mean type$(0_A, 1_A)$ which is defined since **A** is simple. We require a lemma.\n\
    \n**Lemma 8.41.** Let **A** be a finite algebra and $(\\alpha, \beta)$ be a prime\
    \ congruence quotient of type 3 or 4. There is a smallest congruence $\\delta$\
