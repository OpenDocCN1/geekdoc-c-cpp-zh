  md: "# 3. The Nuts and Bolts of Universal Algebra\n\nOne of the Second Isomorphism\
    \ Theorem is given below. Another was given in Example 1.26.\n\n**Theorem 3.5**\
    \ (The Second Isomorphism Theorem). Let $\theta \\subseteq \\psi$ be congruence\
    \ on an algebra $A$. Then $\\psi$ is a congruence on $A/\theta$. The algebras\
    \ $(A/\theta)/(\\psi/\theta)$ and $A/\\psi$ are isomorphic.\n\n*Proof.* Define\
    \ $f: A/theta \\rightarrow A/\\psi$ with $f(a) = a/\\psi$. The condition $\theta\
    \ \\subseteq \\psi$ is equivalent to the assertion that $f$ is well-defined. Clearly,\
    \ $f$ is surjective. A straightforward verification shows that $f$ is a homomorphism\
    \ and $\\ker f = \\psi/\theta$. By the fundamental homomorphism theorem, $A/\\\
    psi \\cong (A/\\theta)/(\\psi/\\theta)$.\\n\\square\n\n**Theorem 3.6** (The Correspondence\
    \ Theorem). Let $A$ be an algebra and $\theta$ be a congruence on $A$. Let $q:\
    \ A \\rightarrow A/\\theta$ be the canonical homomorphism. Then $\\bar{q}$ is\
    \ a lattice homomorphism of the interval $[\\theta, 1_A]$ of $Con(A)$ with $Con(\\\
    bar{q})$ mapping $\\psi$ to $\\theta$.\n\n*Proof.* Suppose that $\\psi$ is a congruence\
    \ on $A$ and that $\\psi \\supseteq \\theta$. It follows directly from the definition\
    \ that $\\bar{q}(\\psi) = \\psi/\\theta$. We wish to show that $\\bar{q}$ is a\
    \ lattice isomorphism with inverse $q$.\\nWe know that both $\\bar{q}$ and $q$\
    \ are order-preserving. And adding to equations (3-1), $q\\bar{q}$ is the identity\
    \ map. For the other direction\n\n```\n$(a,b) \\in \\bar{q}(\\psi) \\iff (q(a),\
    \ q(b)) \\in q(\\psi) \\iff (a/\\theta, b/\\theta) \\in \\psi/\\theta \\iff (a,b)\
    \ \\in \\psi$.\n```\n\nThe Third Isomorphism Theorem for groups is usually stated\
    \ as follows: **H** and **N** are subgroups of a group **G**, **N** normal in\
    \ **G**. Then **HN** is a subgroup of **G**, **N** is normal in **HN** and $HN/N\
    \ \\cong H/(H \\cap N)$.\n\nNow, do we translate this to a statement of universal\
    \ algebra? Obviously we want to replace $N$ with a congruence of $G$. But what\
    \ do we do with $HN$? Well, note that $HN = \\cup_{h\\in H} hN$ and $hN$ is nothing\
    \ the congruence of class $h$ modulo $N$. This motivates the following definition.\n\
    \n**Definition 3.7.** Suppose that $B$ is a subset of an algebra $A$, and $\t\
    heta$ is a congruence on $A$. Then $B^\\theta = \\cup_{b\\in B} b/\\theta$ and\
    \ $\\theta|_B = \\theta^2$.\n\nNow it is an easy verification that if **B** is\
    \ a subalgebra of **A**, then $B^\\theta$ is a subuniverse of **A** containing\
    \ **B** and $\\theta|_B$ is a congruence on **B**. We denote by $B^\\theta$ the\
    \ subalgebra of **A** with universe $B^\\theta$\n\n**Theorem 3.8** (The Third\
    \ Isomorphism Theorem). Let **B** be a subalgebra of **A**, and $\\theta$ a congruence\
    \ on **A**. Then $B^\\theta/(\\theta|_B) \\cong B/(\\theta|_B)$."
