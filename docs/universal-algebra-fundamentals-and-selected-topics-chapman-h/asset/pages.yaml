  md: "# 3. Centralizers again!\n\n![](img/4f610fb94046e9c65f60698e9fcee011_287_0.png)\n\
    \n**Theorem 8.38.** Let $(\\alpha_0, \beta_0)$ and $(\\alpha_1, \beta_1)$ be prime\
    \ quotients in a finite algebra **A** and assume that $I[\\alpha_0, \beta_0] \n\
    eq I[\\alpha_1, \beta_1]$. Then $M_A(\\alpha_0, \beta_0) = M_A(\\alpha_1, \beta_1)$\
    \ and $typ(\\alpha_0, \beta_0) = typ(\\alpha_1, \beta_1)$.\n\n*Proof.* The equality\
    \ of the minimal sets is left as Exercise 8.39. Let us address the equality of\
    \ the types. Fix a set $U$ in $M(\\alpha_0, \beta_0)$.\n\nWe first consider the\
    \ case that $typ(\\alpha_1, \beta_1) \\in \\{3, 4, 5\\}$. According to Theorem\
    \ 8.83, U has a unique $(\\alpha_1, \beta_1)$-minimal set, $N_1$, which is a union\
    \ of two $\\alpha$-classes, $O$ and $I = \\{1\\}$. Let $0$ be a member of $O$.\
    \ By Lemma 8.37, we must have $|\\alpha_1 \\cap N_1| \\vee |\beta_0 \\cap N_1|\
    \ = |\beta_1 \\cap N_1|$. Since $(1, 0) \\in \beta_1 - \\alpha_1$, we have $u\
    \ \\in N_1$ such that $(u, 1) \\in \beta_0 - \\alpha_0$ (see Corollary 2.1). Let\
    \ $N_0$ be the $(\\alpha_0, \beta_0)$-trace containing $\\{u\\}$. Since $\beta_0\
    \ \\leq \beta_1$, we see that $N_0 = 1/\beta_0 \\subseteq 1/\beta_1 = N_1$. (See\
    \ Figure 8.5).\n\nSuppose that $N'$ is $(\\alpha_0, \beta_0)$-trace excluding\
    \ 1. As a nontrivial-class, it must be contained in a nontrivial $\beta_1$-class.\
    \ But the only such nontrivial-class is $N_1$. Since $N_1 - \\{1\\} = \\{0\\}$,\
    \ we conclude that $N'$ lies in a single $\\alpha$-class. By Lemma 8.37, $|\\\
    alpha_0 \\cap N'| \\wedge |\\alpha_1 \\cap N'| = |\\alpha_0 \\cap N_1|$ is a single\
    \ $\\alpha$-class, which is impossible for a trace. Thus $N_0$ is the unique $(\\\
    alpha_0, \beta_0)$-trace.\n\nWe conclude that both $N_1$ and $N_0$ are two-element\
    \ algebras. A polynomial that induces the meet operation on $N_1/\\alpha_1$. That\
    \ same polynomial induces the meet on $N_0/\beta_0$, so $typ(\\alpha_0, \beta_0)\
    \ \\in \\{3, 4, 5\\}$. If $typ(\\alpha_1, \beta_1) \neq 5$ then $N_1$ is a two-set,\
    \ so the same must be true of $N_0$. Thus $A_{N_1} = A_{N_0}$ are Abelian. and\
    \ obviously they have the same type. On the other hand, if $typ(\\alpha_0, \b\
    eta_0) \neq 5$ then there is a polynomial inducing a join operation on $N_0$.\
    \ Polynomial analog also induces the join on $N_1$, so $typ(\\alpha_1, \beta_1)\
    \ \neq 5$.\n\nNow we to the case that $(\\alpha_1, \beta_1)$ is Abelian. According\
    \ to Proposition 7.45, $[\beta_0, \beta_0] \\leq [\beta_0]$ and $[\beta_0, \b\
    eta_0] \\leq [\beta_1, \beta_1]$, hence $[\beta_0, \beta_0] \\leq \\alpha_0$,\
    \ that is $(\\alpha_0, \beta_0)$ is Abelian. An argument similar to Proposition\
    \ 7.45 shows that if $(\\alpha_1, \beta_1)$ is strongly Abelian, then so is $(\\\
    alpha_0, \beta_0)$.\n\nAll that remains is to show $typ(\\alpha_1, \beta_1) =\
    \ 2 \\implies typ(\\alpha_0, \beta_0) \neq 1$. The argument in Proposition 8.35(2)\
    \ shows that any pair $(b, c) \\in \beta_1 - \\alpha_1$ forms a 1-snag. By choosing\
    \ $(b, c)$ in $\beta_0 - \\alpha_1$ (which must be possible if $\\alpha_1 \neq\
    \ \beta_0$), the same polynomial yields an $(\\alpha_0, \beta_0)$-1 snag. So $typ(\\\
    alpha_0, \beta_0) \neq 1$."
