  md: "# 3. The Nuts and Bolts of Universal Algebra\n\n# 3.2 Direct products\n\nLet\
    \ $A_1$ and $A_2$ be similar algebras, and for their product $A_1 \\times A_2$.\
    \ There is a pair of surjective homomorphisms, $p_i: A_1 \times A_2 \to A_i$ called\
    \ the *coordinate projections* mapping $(a_1, a_2) \\mapsto a_i$ for $i=1,2$.\
    \ We denote by $\\eta_i$ the kernel of $p_i$ (called a projection kernel). For\
    \ two pairs $(a_1, a_2)$ and $(b_1, b_2)$ we have\n\n```\n$(a_1, a_2) \\equiv_{\\\
    eta_i} (b_1, b_2) \\longleftrightarrow a_i = b_i, \\quad i = 1,2.$\n```\n\n**Definition\
    \ 3.10.** A pair{\\alpha, \\beta\\ \\subseteq \\text{Con}(A)$ is called a pair\
    \ of *complementary factor congruences* on $A$ if $\\alpha \\cap \\beta = 0_A$\
    \ and $\\alpha \\vee \\beta = 1_A$.\n\nIt is easy to see that the projection kernels\
    \ on a direct product of two algebras always form a pair of factor congru congru.\
    \ The converse of this was the content of Exercise 1.26.7.\n\n**Theorem 3.11.**\
    \ If $\\alpha$ and $\\beta$ form a pair of complementary factor congruences on\
    \ an algebra $A$, then $A \\cong A/\\alpha \\times A/\\beta$ under the map $a\
    \ \\mapsto (a/\\alpha, a/\\beta)$. Conversely, every direct product decomposition\
    \ arises in this way.\n\n**Definition 3.12.** A nontrivial algebra is *directly\
    \ indecomposable* if it is not isomorphic to a direct product of two nontrivial\
    \ algebras.\n\nEquivalently, $A$ is directly indecomposable if and only if the\
    \ only pair of factor congruences on $A$ is $\\{0_A, 1_A\\}$. It is not hard to\
    \ see, by cardinality, that every finite algebra is a direct product of directly\
    \ indecomposable algebras. However, this is not true for infinite algebras.\n\n\
    For example, let $F_2$ denote the field of order 2 and consider the variety of\
    \ $F_2$-vector spaces. The only indecomposable vector space is the one-dimensional\
    \ space. (In a vector space, any partition of a basis into two pieces gives a\
    \ direct decomposition.) Every space of dimension $n$ can be decomposed into a\
    \ product of $n$ one-dimensional spaces.\n\nBut consider a space $V$ with basis\
    \ $\\{v_i : i \\in \\omega\\}$. This space is not directly indecomposable, since\
    \ we can split the basis into two nonempty pieces. It is not product of infinitely\
    \ many 1-dimensional spaces since such a product would be finite, and $V$ is infinite.\
    \ But $V$ is also not the product of infinitely many 1-dimensional spaces. The\
    \ reason is that $V$ has cardinality $\\aleph_0$, while based on a standard set-theoretic\
    \ argument, the product can not have cardinality $\\aleph_0$. Thus $V$ has no\
    \ decomposition into directly indecomposable components.\n\nThe question of *uniqueness*\
    \ of direct decompositions is a complex and fascinating subject. It turns out\
    \ that finite groups, rings, and lattices all have a unique decomposition into\
    \ directly indecomposable algebras. But see Exercise 3.15.7 for an example of\
    \ a finite algebra with nonunique decomposition."
