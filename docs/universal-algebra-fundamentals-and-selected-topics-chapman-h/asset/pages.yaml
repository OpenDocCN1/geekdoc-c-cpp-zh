  md: "# 2. Invariant relations\n\nIf we write $g^{\\square}$ the \"graph\" of $g$,\
    \ i.e.,\n\n```\n$g^{\\square} = \\{(a_1, \\dots, a_k, b) : b = g(a_1, \\dots,\
    \ a_k)\\}$\n```\n\nthen $f$ commutes with $g$ if and only if $f$ preserves the\
    \ relation $g^{\\square}$. It follows that the set of operations that commute\
    \ with $g$ forms a clone, called the centralizer of $g$. More generally, for a\
    \ subset $G$ of Op(A), the centralizer of $G$ is the clone $\\mathcal{F}(\\{g^{\\\
    square} : g \\in G\\)$.\n\nIt is possible, but not necessary, for an operation\
    \ to commute with itself. A unary operation always commutes with itself. For a\
    \ binary operation $\\cdot$, the condition that it commute with itself is\n\n\
    ```\n$(x \\cdot y) \\cdot (z \\cdot w) \\approx (x \\cdot z) \\cdot (y \\cdot\
    \ w)$.\n```\n\nAn operation with this property has variously called medial or\
    \ entropic. For this reason, an algebra $\\langle A, F\\rangle$ is entropic if\
    \ $F$ is contained in its own center. It is easy to see that a monoid or group\
    \ is entropic if and only if it is commutative.\n\nMany concepts of Universal\
    \ Algebra, as subuniverses, automorphisms, congruences, can be described as invariant\
    \ relations with some special property. For example a subuniverse is nothing but\
    \ an invariant unary relation. An automorphism is an binary relation that is the\
    \ graph of a permutation. Here is an application of this principle to congruences.\n\
    \n**Definition 4.15.** Let $A = \\langle A, F\\rangle$ be an algebra. *Elementary\
    \ translation* of $A$ is a unary operation of the form $f(a_1, a_2, \\dots, a_{i-1},\
    \ x, a_{i+1}, \\dots, a_n)$ where $f \\in F$ and $a_1, \\dots, a_n \\in A$. The\
    \ set of elementary translations of $\\langle A, F\\rangle$ is denoted $F(A)$.\n\
    \nThus, the elementary translations are the unary polynomials built from basic\
    \ operation.\n\n**Theorem 4.16.** Let $A = \\langle A, F\\rangle$ be an algebra,\
    \ and $\\theta$ an equivalence relation on $A$. The following are equivalent.\n\
    \n+   (a) $\\theta$ is a congruence on $\\mathbf{A}$;\n\n+   (b) Clo($\\mathbf{A}$)|\\\
    \ $\theta$;\n\n+   (c) Pol($\\mathbf{A}$)|\\ $\theta$;\n\n+   (d) Pol($\\mathbf{A}$)|\\\
    \ $\theta$;\n\n+   (e) $F(\\mathbf{A})$)|\\ $\theta$.\n\n*Proof.* By assumption,\
    \ $\\theta$ is an equivalence relation. To be a congruence relation on $\\mathbf{A}$,\
    \ $\\theta$ must have the substitution property, which is precisely the condition\
    \ $f \\vert \\theta$. Since $F \\subseteq$ Clo($\\mathbf{A}$) $\\subseteq$ Pol($\\\
    mathbf{A}$) and the $\\mathcal{R}$ operator is order-reversing, we obtain $\\\
    mathcal{R}(Pol($\\mathbf{A}$)) \\subseteq$ $\\mathcal{R}(Clo($\\mathbf{A}$)) \\\
    subseteq$ $\\mathcal{R}(F)$. This"
