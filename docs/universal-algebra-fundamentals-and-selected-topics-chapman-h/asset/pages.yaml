  md: "# # Chapter 8\n\n# ## Finite Algebras and Locally Finite Varieties\n\nThroughout\
    \ this text we have considered numerous results about finite algebras. So it might\
    \ seem strange to conclude with a chapter devoted to finite algebras. However,\
    \ our emphasis is different. In the previous chapters we studied the influence\
    \ of the global properties of the congruence lattices (distributivity, permutability,\
    \ etc.) on the behavior of the algebras. In this chapter we investigate the interplay\
    \ between the polynomial operations and the individual congruences (actually,\
    \ pairs of congruences) of an algebra and what it tells us about structure.\n\n\
    One prototype of this approach is the commutator, which we studied in Sections\
    \ 7.2 through 7.4. The relation “$\\alpha$ centralizes $\beta$” does not depend\
    \ solely on the roles of $\\alpha$ and $\beta$ in the congruence lattice, but\
    \ in addition involves the particular term operations on the algebra.\n\nMost\
    \ of the tools needed for this analysis were developed by D. Hobby and R. McKenzie\
    \ in the late 1980s, and presented in their monograph [HM88]. These techniques\
    \ are referred collectively as “tame congruence theory.” The theory was refined\
    \ and extended by several mathematicians, including J. Berman, P. Idziak, K. Kearnes,\
    \ E. Kiss, A. Szendrei, M. Valeriote and R. Willard.\n\n# ## 8.1 Minimal algebras\n\
    \nWe take as our starting point Theorem 4.16, which says that for any algebra\
    \ $A = \\langle A, F \\rangle$,\n\n```\n$$\\text{Con}(\\mathbf{A}) = \\text{Con}(\\\
    langle A, \\text{Pol}_1(\\mathbf{A})\\rangle). \\quadquad (8–1)$\n```\n\nWe emphasize\
    \ that this is not merely a lattice isomorphism, but an equality. Recall that\
