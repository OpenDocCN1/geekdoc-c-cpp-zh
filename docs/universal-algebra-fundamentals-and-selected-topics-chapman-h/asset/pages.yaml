    \ Since we are in a Maltsev variety, there are $a^2, \\dots, a_n^{-1}$ such that\n\
    \n```\n$\\kappa^1 \\ \\kappa^2 \\ \\kappa^3 \\ \\kappa^4 \\ \\dots \\ \\kappa_n^n.$\n\
    ```\n\nWrite $\\mathbf{a}^i = (a_1^i, a_2^i, \\dots, a_n^i)$ for $i=1, \\dots,\
