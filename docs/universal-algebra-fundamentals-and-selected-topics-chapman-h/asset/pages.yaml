    \ $L \\cong \\mathbf{Dn(Prm L)}$.*\n\n*Proof.* All that remains from Theorem 2.43\
    \ is to prove that the assignment $a \\to \\mathcal{P}_a$ is surjective. We set\
    \ $\\mathcal{D}$ be a subset of **Prm(L)**. Since the lattice is finite, it has\
    \ finitely many prime ideals. So we can write $\\mathcal{D}=\\{P_1, P_2, \\dots,\
    \ P_n\\}$. We set $X=L \\setminus \\mathcal{D}=\\\\{x_1, \\dots, x_m\\}$ and set\
    \ $a=x_1 \\wedge \\dots \\wedge x_m$.\nWe claim that $a \\in \\mathcal{D}$. This\
    \ is true if $a \\in P_i$ for some $i \\le n$, since $P_i$ is prime, there is\
    \ some $j$ such that $x_j \\in P_i$, which is false. As $a$ is excluded from every\
    \ $P_i$, which means that $\\mathcal{D} \\subseteq \\mathcal{P}_a$.\nOn the other\
    \ hand, let $P \\in \\mathcal{P}_a$ and set $u=\\vee P$. Note that $u \\in P$\
    \ since $P$ is a finite set and an ideal. If $u \\in X$ then $a \\le u$ which\
    \ implies that $a \\in P$ which is false. Thus $u \\notin X$ which means that\
    \ for some $i \\le n$, $u \\in P_i$. Since $\\P$ is the largest element of $P$,\
    \ we get $P \\subseteq P_i$. Since finally $\\mathcal{D}$ is a downset, we conclude\
    \ $P \\in \\mathcal{D}$. □\n\n# **Exercise 2.47.**\n\n+   1. A *Boolean ring*\
