    Instead we shall verify the following claim from Equation (7-7) easily follows.


    **Claim.** For every operation $t, a \in C(N)$, and $c, a$ and $c = e$.


    ```

    $t(e, c)^{-1} \cdot t(e, d) \cdot t(a, c) = e \quad (7-8)$

    ```


    Proof. The operation term $t(x, y)$ is of the form $z_1 \cdot z_2 \cdot \dots
    \ z_k$ in which $k$ is a natural number and every $z_i$ is a member of $\{x^{\pm1},
    y_1^{\pm1}, \dots, y_n^{\pm1}\}$. We prove the claim by induction on $k$.


    If $k=0$ $t(x, y) = e$ and the equality obviously holds. If $k=1$ $t(x, y) = x^{\pm1}$
    or $y_1^{\pm1}$. In either case the claim is easily seen to be true.


