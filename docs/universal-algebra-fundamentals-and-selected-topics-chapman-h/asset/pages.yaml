  md: "# # Chapter 4\n\n# ## Clones, Terms, and Equational Classes\n\nIn Chapter 3\
    \ we developed the structural side of our subject: subalgebras, homomorphism,\
    \ quotients and products. These are notions familiar from your first-year course\
    \ in abstract algebra. But what distinguishes universal algebra from the traditional\
    \ study of groups and rings is its attention to semantics. We often characterize\
    \ algebras by the operations they possess and the identities that they satisfy.\
    \ That is the focus of the present chapter. The most beautiful and striking results\
    \ (at least in the opinion of this author) provide bridges between the structural\
    \ and the semantic. We shall meet several of these theorems in this chapter and\
    \ many more in Part II.\n\n# ### 4.1 Clones\n\nLet $A$ be a set. For every natural\
    \ number $n$ let $\text{Op}_n(A)$ denote the set of all $n$-ary operations on\
    \ $A$. Put another way, $\text{Op}_n(A) = A^{(A^n)}$. Let $\text{Op}(A) = \bigcup_{n<\\\
    infty} \text{Op}_n(A)$ be the set of all operations on $A$. For any $k \\le n$\
    \ there is $n$-ary operation $f^k_n(x_1, \\dots, x_n) = x_k$, the $k$-th projection\
    \ operation.\n\nLet $n$ and $k$ then define a new $k$-ary operation $f[g_1, \\\
    dots, g_n]$ by $g_1, \\dots, g_n \\in \\text{Op}_k(A)$ and $f \\in \\text{Op}_n(A)$.\n\
    \n```\n$(x_1, \\dots, x_k) \\mapsto f(g_1(x_1, \\dots, x_k), \\dots, g_n(x_1,\
    \ \\dots, x_k))\n```\n\nthe generalized composite of $f$ with $g_1, \\dots, g_n$.\
    \ Note that, unlike the ordinary composite of unary operation, the generalized\
    \ composite exists only when all of the ranks match up.\n\nThere is one peculiarity\
    \ that should be pointed out. Suppose that $f$ is a nullary operation with value\
    \ $c \\in A$. Then $f[]$, the result of $f$ with $0$-many $n$-ary operations is\
    \ the $n$-ary operation $(x_1, \\dots, x_n) \\mapsto c$. Thus, starting from a\
    \ nullary operation with constant value $c$, we can construct an $n$-ary operation\
    \ with constant value $c$ for all $n$.\n\nJust as the set of unary operations\
    \ forms a monoid under the operation of composition, we can form a kind of algebraic\
