  md: "# 4. Clones, Terms, and Equational Classes\n\nBy Proposition 4.24, the isomorphism\
    \ type of the free algebra $\\mathbf{F}_{\\chi}(X)$ depends only on the cardinality\
    \ of $X$. It is customary to write $\\mathbf{F}_{\\chi}(\\omega)$ or $\\mathbf{F}_{\\\
    chi}(n)$ instead of $\\mathbf{F}_{\\chi}(X_{\\omega})$ or $\\mathbf{F}_{\\chi}(X_n)$.\
    \ We will also occasionally denote an equation by a Greek letter, usually $\\\
    varepsilon$ if we don't care about the constituent terms.\n\nBecause of its centrality\
    \ to the subject, we should exhibit a few examples to illustrate Birkhoff's theorem.\
    \ This is complicated by the fact that most of the varieties with which we are\
    \ familiar (groups, rings, lattices, etc.) are initially defined as equational\
    \ classes. But we have set the stage by presenting, in the first chapters of this\
    \ text, a couple of examples of classes closed under **H**, **S** and **P**, not\
    \ only defined by equations.\n\nOur first example is the class of $p$-algebras.\
    \ We proved in Theorem 3.34 that $pa$ is closed under **H**, **S**, and **P**.\
    \ By Theorem 4.41, $pa$ is axiomatized by set of equations. (Recall that (3-3)\
    \ is an implication, not an equation, so it doesn't count). In fact, it is easy\
    \ to verify that an equational base for $p$ consists of the distributive lattice\
    \ identities, (3-2), together with the identities\n\n```\n$0^{\\omega} \\approx\
    \ 1, \\quad 1^{\\omega} \\approx 0$$\nx \\wedge (x \\wedge y)^{*} \\approx x \\\
    wedge y^{*}. \\quad (4-4)\n```\n\nA second example comes from group theory. $\\\
    mathcal{V}$ and $\\mathcal{W}$ are varieties of groups. In Exercise 3.9 we constructed\
    \ a class $\\mathcal{V} \\cdot \\mathcal{W}$ that was a variety. It is defined\
    \ by a set of equations, but can we get our hands on such set? There is a method\
    \ to construct $\text{Id}(\\mathcal{V})$ from $\text{Id}(\\mathcal{U})$ and $\t\
