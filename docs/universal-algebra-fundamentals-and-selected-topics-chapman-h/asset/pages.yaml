    **Lemma 3.33.** Let *L* be a *p-algebra*, $x, y \in L$.


    +   (1) $0^* = 1, 1^* = 0$;


    +   (2) $x \le x^{**}$;


    +   (3) $x \le y \implies x^* \ge y^{**}$;


    +   (4) $x^* = x^{**}$;


    +   (5) $x \wedge y = 0 \implies x^{**} \wedge y = 0$;


    +   (6) $(x \wedge y)^* = x^* \wedge y^*$;


    +   (7) $(x \wedge y)^{**} = x^{**} \wedge y^{**}$.


    *Proof.* (1-4) are left as exercises. For (5), $x \wedge y = 0 \implies x \le
    y^{**}$ \by (3, 4) $x^{**} \le y^* \implies x^{**} \wedge y = 0$.\nFor (6), let
    $z = x^*, z^*$. Then


    $z \le z^*, z^* \le z$;\nz \wedge z^* = 0$ definition of pseudocomplement;\nby
    distributivity;\n$z \wedge (x \vee y)^* = 0$\n$z \le (x \vee y)^*$ definition
    of pseudocomplement.


    Conversely,\n$(x \vee y)^* \le x^*, y^* \implies (x \vee y)^* \le x^* \wedge y^*$.


    Finally, for (7), $x \wedge y \le x, y \implies (x \wedge y)^{**} \le x^{**} \wedge
    y^{**}$, while $y \wedge (x \wedge y)^* = 0$ (by (5)) $y^{**} \wedge (x \wedge
    y)^* = 0$, so by (5) $x^{**} \wedge y^{**} \wedge (x \wedge y)^* = 0$, so $x^{**}
    \wedge y^* \le (x \wedge y)^*$.


    Recall that a variety of algebras is a class of algebras closed under the formation
    of homomorphic images, subalgebras and products. Unlike most of the classes we
    have studied, it is not obvious that $Pa$ is a variety, since it is not defined
    by a set of equations. Nevertheless, it is a fact, as the next theorem demonstrates.


    # **Theorem 3.34.** *Pa* is a variety of algebras.*


    *Proof.* All of the conditions (3-2) are equational, they are preserved by **H,
    S** and **P**. It remains to prove that condition (3-3) is preserved by operators.
    Let $L \in Pa$ and let $A$ a subalgebra of $L$. Suppose $x$ and $a$ are elements
    of $A$. Then $x^* \wedge a = 0$ (in $A$) if $x \wedge a = 0$ (in $L$) if $x \le
    L^*$ (since $L$ is a p-algebra) if $x \le A^{**}$ (since $A$ is a subalgebra of
    $L$, $a^*$ is the star in both $A$ and $L$). Therefore, **S(Pa) = Pa**.


    Secondly, suppose $L_i$ in $Pa$, for $i \in I$. Let $A = \prod_{i \in I} L_i$.
    Then for $x, a \in A$, $x \wedge a = 0 \iff (i \in I) x_i \wedge a_i = 0 \iff
    (i \in I) x_i \le a_i^* \iff x \le a^*$.'
