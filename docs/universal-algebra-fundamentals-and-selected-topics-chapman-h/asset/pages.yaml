  md: "# 4. Commutators 221\n\n![](img/4f610fb94046e9c65f60698e9fcee011_235_0.png)\n\
    \nFIGURE 7.2: The relative commutator Suppose that **B = A/\theta** and $h: A\
    \ \rightarrow B$ is the canonical homomorphism. Let $\tilde{h}(\\alpha)$ and $\b\
    eta = \tilde{h}(\beta)$ are congruences on **B**. Theorem 7.49(2) asserts that\
    \ $\tilde{h}(\\alpha, \bar{\beta}) = [\tilde{h}(\\alpha), \tilde{h}(\beta)] \\\
    vee \\ker h = [\\alpha, \beta]_\theta$. Thus, if $\\alpha$ and $\beta$ are the\
    \ congruences corresponding to $\tilde{\\alpha}$ and $\bar{\beta}$, then $[\\\
    alpha, \beta]_\theta$ is the congruence corresponding to $[\bar{\\alpha}, \bar{\b\
    eta}]$, see Figure 7.2.\n\nBecause of their construction, the congruences $\\\
    alpha$ and $\beta$ that appear in the previous paragraph must dominate $\theta$.\
    \ But observe that if $\\alpha$ and $\beta$ are any two congruences on **A**\n\
    \n```\n$[\\alpha \\vee \\beta \\vee \\theta] = [\\alpha, \beta] \\vee [\\alpha,\
    \ \\theta] \\vee [\beta, \\theta] \\vee \\theta = [\\alpha, \\beta]_\\theta$ (7-18)\n\
    ```\n\nby the additivity and monotonicity of the commutator. As we observed, the\
    \ first congruence in this chain corresponds to a commutator on **B**. Thus, properties\
    \ of the commutator on A/\theta can be used to deduce properties on **A**. It\
    \ is (7-18), together with Exercise 7.52 that forms the argument in 7.49(3).\n\
    \nFrom the definitions, $\\alpha^*$ denotes the center of $\\alpha$ then $[\\\
    alpha^*, \\alpha] = 0$. In fact, $\\alpha^*$ is the largest congruence $\beta$\
    \ such that $[\beta, \\alpha] = 0$. An algebra is Abelian if $1^* = 1$, equivalently,\
    \ $[1, 1] = 0$. It follows from monotonicity that **A** is Abelian if and only\
    \ if $[\\alpha, \beta] = 0$ for all $\\alpha, \beta \\in \\text{Con(A)}$, $[\\\
    alpha, \beta]$ is always as small as possible. At the opposite extreme, we shall\
    \ call an algebra **neutral** if for all congruences $\\alpha$ and $\beta$, we\
    \ have $[\\alpha, \beta] = \\alpha \\wedge \\beta$, which is, by Proposition 7.45(1)\
    \ its largest possible value.\n\nFrom Theorem 7.48 we see that every neutral algebra\
    \ in a Maltsev variety is congruence-distributive. The converse is false (consider\
    \ the group $Z_p$ for a prime $p$). However, at the level of an entire (Maltsev)\
    \ variety we have the following."
