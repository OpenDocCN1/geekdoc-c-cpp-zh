  md: '# 4. Closure operators and algebraic lattices


    **Theorem 2.25.** *Let $L_C$ be a closure operator on $A$.*


    +   (1) $L_C = \{C(Y) : Y \subseteq A\}$.


    +   (2) *The intersection of a nonempty family of closed sets is always closed.*


    +   (3) $\langle L_C, \subseteq\rangle$ is a complete lattice in which the meet
    operation (on a nonempty family) coincides with intersection, and for any $\mathcal{X}
    \subseteq L_C$,


    ```

    \mathcal{X} = c(\bigvee\mathcal{X})$

    ```


    Proof. The first assertion is easy to see. For the second, let $\mathcal{X}$ be
    a nonempty collection of closed subsets of $A$ and let $Y = \cap\mathcal{X}$.
    For every $X \in \mathcal{X}$, $C(Y) \subseteq C(X) = X$. From it follows that
    $C(Y) \subseteq \cap\mathcal{X} \subseteq Y \subseteq C(Y)$, so $Y$ is closed.


    Now consider (3). A itself is closed, by (2) and Proposition 2.14 $L_C$ is a complete
    lattice. Let $Y = \bigvee\mathcal{X}$. $C(Y)$ is clearly a closed set containing
    every member of $\mathcal{X}$, $\bigvee\mathcal{X} \subseteq Y$. On the other
    hand, for every $X \in \mathcal{X}$, $X \subseteq \bigvee\mathcal{X}$, so $Y =
    \bigvee\mathcal{X}$ and therefore $C(Y) \subseteq \bigvee\mathcal{X}$ since the
    latter set is closed by definition.


    Theorem 2.25 has a converse.


    **Theorem 2.26.** *Let $M$ be a complete lattice. There is a closure operator
    $C$ on a set $A$ such that $M \cong L_C$.*


    Proof. For $x \in M$ define $[x] = \{y \in M : y \leq x\}$. Take $A = M$ and for
    every subset $X$ of $A$ define $C(X) = (\bigvee\X)$. It is straightforward to
    check that $C$ is a closure operation on $A$ and that the mapping $f: M \to L_C$,
    given by $f(x) = [x]$, is an isomorphism.


    Theorems 2.25 and 2.26 tell us that closure operators and complete lattices are
    two sides of the same coin. Of course we cannot expect every complete lattice
    **M** **to be equal to a lattice of closed sets since the members of $M$ may not
    even be sets. But algebraically the concepts are interchangeable. Studying one
    is equivalent to studying the other.


    Looking again at Exercise 1.16.2, we see that the closure operator $S^A$ has an
    additional property which somehow expresses the "finitarity" of the subalgebra
    construction. We formalize this in the following definition.


    **Definition 2.27.** *Let $C$ be a closure operator on a set $A$. $C$ is called
    algebraic if every $X \subseteq A$*


    ```

    C(X) = \bigcup{C(Z) : Z \subseteq \omega X\}

    ```


    **Theorem 2.28.** *Let $A$ be an algebra. Both $S^A$ and $C^A$ are algebraic closure
    operators.*


    Proof. Exercises 1.16.2 and 1.26.9.'
