    # 7.5 Directly representable varieties revisited


    Earlier, we considered representable varieties and proved that they are always
    Maltsev. It turns out that every directly representable variety is a join of two
    contrasting subvarieties: one that is semisimple and arithmetical (hence neutral),
    and one that resembles the variety of modules over a ring. We derived a complete
    classification of the first sort in Theorem 7.11: a congruence-distributive variety
    is directly representable if and only if it is semisimple and arithmetical.


    We now the tools to consider the opposite extreme: Abelian groups. It is true
    that finitely finitely Abelian variety is directly representable. More specifically,
    a characterization of those finite rings **R** such is unknown. But modularity
    (which properly belongs to the domain of ring theory, not universal algebra) we
    can completely characterize directly representable varieties. The reader may wish
    to skip the proofs of Theorems 7.55 and 7.56 on first reading.


    As we have observed throughout this, the congruence lattices of the members of
    a variety $\mathcal{V}$ have a profound influence on the properties of $\mathcal{V}$.
    Within the realm of Maltsev varieties we can extend our menu of congruences properties
    to include those that involve the commutator operation. For'
