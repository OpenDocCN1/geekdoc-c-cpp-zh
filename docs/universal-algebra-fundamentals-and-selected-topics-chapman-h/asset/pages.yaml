    # **Definition 1.10.** Let $\mathcal{K}$ be a class of similar algebras. We write


    +   **H($\mathcal{K}$)** for the class of all homomorphic images of members of
    $\mathcal{K}$

    **S($\mathcal{K}$)** for the class of all algebras isomorphic to a subalgebra
    of a member of $\mathcal{K}$

    **P($\mathcal{K}$)** for the class of all algebras isomorphic to a direct product
    of members of $\mathcal{K}$.


    We say that $\mathcal{K}$ is closed under the formation of homomorphic images
    if $\mathbf{H}(\mathcal{K}) \subseteq \mathcal{K}$, and similarly for subalgebras
    and products. Notice that all three of these “class operators” are designed so
    that for any class $\mathcal{K}$, $\mathbf{H}(\mathcal{K})$, $\mathbf{S}(\mathcal{K})$
    and $\mathbf{P}(\mathcal{K})$ are closed under isomorphic images. On those rare
    occasions that we need it, we can write $|(\mathcal{K})$ for the class of algebras
    isomorphic to a member of $\mathcal{K}$.


    Finally, we call $\mathcal{K}$ a *variety* if it is closed under each of $\mathbf{H}$,
    $\mathbf{S}$ and $\mathbf{P}$. Varieties have been the primary objects of study
    in universal algebra since the 1970s. They will increasingly become the focus
    of the text in the later chapters.


