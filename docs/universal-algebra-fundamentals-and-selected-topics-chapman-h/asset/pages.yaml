  md: "# 3. Subdirect products\n\n![](img/4f610fb94046e9c65f60698e9fcee011_71_0.png)\n\
    \n**Theorem 3.23.** *An algebra **A** is subdirectly irreducible if and only if\
    \ $0_A$ is completely meet-irreducible in Con **A**. More generally, if $\theta$\
    \ is a congruence on an algebra **A**, then **A/$\theta$** is subdirectly irreducible\
    \ if and only if $\theta$ is completely meet-irreducible in Con **A**.\n\n*Proof.*\
    \ Suppose first that **A** is subdirectly irreducible. To show that $0_A$ is completely\
    \ meet-irreducible, assume that $0_A = \\wedge_i \theta_i$, where $\theta_i \\\
    in \text{Con **A**, for $i \\in I$. By Proposition 3.17 the natural map $\\mathbf{A}\
    \ \to \\prod_{i \\in I} \\mathbf{A}/\theta_i$ is a subdirect representation. Therefore,\
    \ for some $i \\in I$, the projection $p_i : \\mathbf{A} \to \\mathbf{A}/\theta_i$\
    \ is an isomorphism. Thus $0_A = \\ker p_i = \theta_i$, showing $0_A$ is completely\
    \ meet-irreducible.\n\nConversely, assume that $0_A$ is completely meet-irreducible\
    \ and suppose that $g : \\mathbf{A} \to \\prod_{i \\in I} \\mathbf{B}_i$ is an\
    \ isomorphism. By Proposition 3.17 we obtain $0_A = \\wedge_{i \\in I} \theta_i$\
    \ for some family of congruences. By complete meet-irreducibility, there is an\
    \ $i \\in I$ such that $\theta_i = 0$. Then the map $p_i \\circ g : \\mathbf{A}\
    \ \to \\mathbf{B}_i$ is an isomorphism.\n\nFor the last statement, let $\theta$\
    \ be an arbitrary congruence. By the congruence-theorem (Theorem 3.6) the lattices\
    \ $[\theta, 1_A]$ and Con(**A/$\theta$**) are isomorphic. Thus **A/$\theta$**\
    \ is subdirectly irreducible iff $0_A/\theta$ is completely meet-irreducible in\
    \ Con **A**. $\\square$\n\nIf **A** is subdirectly irreducible, then according\
    \ to Lemma 3.22 and Theorem 3.23, there is a nonzero congruence, $\\mu$, on **A**.\
    \ This congruence is called the *monolith* of **A**. Pick any pair $(a, b)$ in\
    \ $\\mu$ with $a \neq b$. Then by the minimality of $\\mu$, $\\mu = \text{Cg}^A(a,\
    \ b)$. We say that **A** is $(a, b)$-irreducible when we want to specify a pair\
    \ of elements that this so. Figure 3.5 is an illustration of the general form\
    \ of the congruence lattice of a subdirectly irreducible algebra.\n\nNotice that\
    \ for a nontrivial **A**, we have the following sequence of implications:\n\n\
    ```\nsimple subdirectly irreducible = directly indecomposable.\n```"
