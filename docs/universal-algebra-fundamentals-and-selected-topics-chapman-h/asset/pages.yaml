    The ultraproduct construction, when combined with various finiteness conditions,
    tends to degenerate. This can be quite important in practice. The following two
    theorems provide examples of this phenomenon.


    **Theorem 5.5.** (1) An finite algebra can be embedded into each of its ultrapowers.


    +   (2) Every finite algebra is isomorphic to each of its ultrapowers.


    Proof. Let $\mathbf{A}$ be any algebra and $\mathcal{U}$ be an ultrafilter over
    a set $I$. Let $d: \mathbf{A} \to \mathbf{A}^I$ be the “diagonal map” $d(x) =
