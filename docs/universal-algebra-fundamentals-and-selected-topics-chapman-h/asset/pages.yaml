  md: '# 1. Algebras


    **Definition 1.8.** Let A be an algebra. A subuniverse $U$ of $A$ is called a
    *subuniverse of $A$*, for every basic operation $f$ of $A$, with $n = \text{rank}(f)$,


    ```

    $u_1, u_2, \dots, u_n \in U \implies f(u_1, u_2, \dots, u_n) \in U. \quad (1-3)$

    ```


    In common parlance, subunivers are the subsets that are "closed under the operations"
    of A. Note that if **B** is a subalgebra of A, then B is a nonempty subuniverse
    of **A**, and conversely, every nonempty subuniverse is the universe of a subalgebra
    of **A**. However, the empty set may be a subuniverse of A, but it is not the
    universe of a subalgebra. In fact, the empty set is a subuniverse of **A** if
    and only if **A** has no basic operations. (Think about this last statement. It
    is a good exercise for developing an understanding of the boundary case in an
    implication like (1-3).) The set of subuniverses of **A** is denoted $\text{Sub}(A)$.


    An injective (i.e., one-to-one) homomorphism is often called an *embedding*. If
    $h: A \to B$ is a surjective homomorphism, then **B** is called a *homomorphic
    image of A*. And if $h$ is bijective, then **A** and **B** are called *isomorphic*.
    We write $A \cong B$ in this case. An algebra is called *trivial* if its universe
    has cardinality 1. Notice that, up to isomorphism, there is exactly one algebra
    of each similarity type.


    As you can see, if $g, h: C$ are homomorphisms, then $h \circ g$ is a homomorphism
    as well. It follows that the set of all *endomorphisms* of **A**, (that is, homomorphisms
    from A to itself) forms a monoid under the binary operation of composition. And,
    together with Exercise 11.12, we see that the set $\text{Aut}(\mathbf{A})$ of
    automorphisms of **A** can be made into a group. The corresponding algebra $\text{Aut}(\mathbf{A}),
    \circ^{-1}, id_A$ should be denoted $\text{Det}(\mathbf{A})$, although we cheat
    a bit on the boldfacing. The algebra **A** is called *rigid* if its automorphism
    group is trivial.


    **Definition 1.9.** Let $S = \{S_i : i \in I\}$ be a sequence of sets. The *direct*,
    or *Cartesian product* of sets $S$ is


    ```

    $\prod_{i \in I} S_i = \{f: I \to \bigcup_{i \in I} S_i \mid (f(i) \in S_i)\}$.

    ```


    the elements of the direct product are also called *choice functions* since each
    function chooses an element from each $S_i$. Now $A = \{A_i : i \in I\}$ is a
    sequence of algebras (all of the same similarity type). This direct product is
    the algebra **B** with universe $B = \prod_{i \in I} A_i$ and that for each (n-ary)
    basic operation symbol $g$ and $f_1, \dots, f_n \in B$


    ```

    $(g^B(f_1, \dots, f_n))(i) = g^{A_i}(f_1(i), \dots, f_n(i)), \quad \text{for all
    } i \in I$.

    ```


    When $I$ is infinite, direct products are difficult to comprehend and work with.
    (But necessary, nonetheless.) In the finite case, things are not so'
