    \ + t_k$\n```\n\nand from which we conclude $\\sum_i s_{0i}c_i + t_0 = \\sum_i\
    \ s_{ki}d'_i + t_k$. But this implies\n\n```\n$f(b, c) = r_0b + \\sum_i s_{0i}c_i\
    \ + t_0 = r_kb + \\sum_i s_{ki}d'_i + t_k = f(b, d)$\n```\n\nwhich is a contradiction.\n\
    \nNow we turn to the possibility that $\text{typ}(0, \\beta) = 1$. This means\
    \ that every polynomial of $A|_N$ is essentially unique. We argue in manner much\
    \ like the claim in the previous case.\n\n**Claim.** For every $j < k$, $f_j|_N(x,\
    \ y_1, \\dots, y_n)$ depends on $x$ if and only if $f_{j+1}|N$ depends on $x$.\n\
    \nProof. If $f_j|_N$ depends only on its first variable, there are elements $u,\
