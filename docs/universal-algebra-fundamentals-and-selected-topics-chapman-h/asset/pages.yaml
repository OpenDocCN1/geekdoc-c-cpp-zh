  md: '# 2. Distributive and modular lattices


    **Definition 2.5.** Let **L** be a lattice.


    +   1) **L** is called *distributive* if it satisfies $x \wedge (y \vee z) \approx
    (x \wedge y) \vee (x \wedge z)$.


    +   2) **L** is called *modular* if it satisfies $z \leq x \implies x \wedge (y
    \vee z) \approx (x \wedge y) \vee z$.


    Notice that any lattice satisfies


    ```

    $x \wedge (y \vee z) \geq (x \wedge y) \vee (x \wedge z)$

    z\leq x \implies x \wedge (y \vee z) \geq (x \wedge y) \vee z.$.

    ```


    So when verifying either modularity or distributivity, we can restrict our attention
    to the “interesting” inequality.


    # **Proposition 2.6.** Every distributive lattice is modular.


    *Proof.* Let **L** be distributive and $z \leq x$ in L. Then $x \wedge (y \vee
    z) = (x \wedge y) \vee (x \wedge z) = (x \wedge y) \vee z$, the first equality
    coming from distributivity, the second from $z \leq x$. $\square$


    Notice that the definition of distributivity asserts that meet distributes over
    join. One naturally wonders about the dual condition. It is one of the satisfying
    principles of lattice theory that the two conditions are equivalent.


    # **Proposition 2.7.** Let **L** be a lattice. **L** is distributive iff it satisfies
    $x \vee (y \wedge z) \approx (x \vee y) \wedge z$.


    *Proof.* Assume **L** satisfies the identity in Definition 2.5(1). Consider one
    side of the dual identity: $(x \vee y) \wedge (x \vee z)$. Set $a = x \vee y,
    b = x$ and $c = y$.


    ```

    $(x \vee y) \wedge (x \vee z) = a \wedge (b \vee c) \approx (a \wedge b) \vee
    (a \wedge c)\n$= ((x \vee y) \wedge x) \vee ((x \vee y) \wedge z)\n\approx x \wedge
    (z) \vee (y \wedge z) = x \vee (y \wedge z).$.

    ```


    The indicated equalities invoke the original definition of distributivity. $\square$


    It is not hard to see that any lattice of less than 5 is distributive. (There
    are only 5 of them). Why don''t you draw them all in the margin? There are two
    nondistributive lattices with 5 elements, called **N_5$** and **$M_3$**. They
    play a central role in the theory of lattices. Notice that **$M_3$** is modular
    and that **$N_5$** is not. The following theorem tells us that **$N_5$** is the
    smallest nonmodular lattice in a very strong


    ![](img/4f610fb94046e9c65f60698e9fcee011_39_0.png)'
