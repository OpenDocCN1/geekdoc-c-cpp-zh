    \ the clone of all term operations is the set $\\mathbb{Z}[x_1, x_2, \\dots]$.\
    \ To argue this more carefully, we first observe that every member of $\\mathbb{Z}[x_1,\
    \ x_2, \\dots]$ is a term operation on $\\mathbb{Q}$. Thus $\\mathbb{Z}[x_1, x_2,\
    \ \\dots]$ is a clone and it contains the basic operations of the ring. This gives\
