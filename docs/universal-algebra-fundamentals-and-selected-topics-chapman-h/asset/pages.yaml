  md: "# 2. Invariant relations\n\n$f$ preserves $\theta$ and write $f|\\theta$ if\n\
    \n```\n$(x_{11}, x_{12}, \\dots, x_{1k}), (x_{21}, \\dots, x_{2k}), \\dots, (x_{n1},\
    \ \\dots, x_{nk}) \\in \\theta \\implies$$\n$$f(x_{11}, x_{21}, \\dots, x_{n1}),\
    \ \\dots, f(x_{1k}, \\dots, x_{nk})) \\in \\theta.$\n```\n\nIn place of \"$f$\
    \ preserves $\\theta$\" we also say \"$\theta$ is invariant under $f$.\"\n\nAlthough\
    \ this notion seems imposing, it has a simple structure. One way to visualize\
    \ it is to put the $nk$ variables in a matrix:\n\n```\n$$\\begin{matrix}x_{11}\
    \ & x_{12} & \\dots & x_{1k} & \\in & \\theta \\x_{21} & x_{22} & \\dots & x_{2k}\
    \ & \\in & \\theta \\\\vdots & \\vdots & & \\vdots & & \\vdots \\\\x_{n1} & x_{n2}\
    \ & \\dots & x_{nk} & \\in & \\theta \\\\downarrow & \\downarrow & & \\downarrow\
    \ & & \\downarrow \\\\f & f & & f & & \\star & \\in & \\theta \\end{matrix}$ (4-2)$\n\
    ```\n\nThe antecedent says each of the rows of the matrix is an element of $\t\
    heta$. The consequent asserts that if we apply $f$ to the columns of the matrix,\
    \ the resulting row is again an element of $\theta$. Another way to demystify\
    \ the preservation relationship is via the following lemma.\n\n**Lemma 4.12.**\
    \ *Let $\\theta$ be a $k$-ary relation and an operation on $A$. Then $f$ preserves\
    \ $\\theta$ if and only if $\\theta$ is a subuniverse of $\\langle A, f\\rangle^k$.*\n\
    \n*Proof.* Let $x_i = (x_{i1}, \\dots, x_{ik})$, for $i = 1, \\dots, n$, represent\
    \ elements of $A^k$. To say that $\\theta$ is the subalgebra of $\\langle A, f\\\
    rangle$ is to assert that\n\n```\n$x_1, \\dots, x_n \\in \\theta \\implies f^A(x_1,\
    \ \\dots, x_n) \\in \\theta.$\n```\n\nBut $f^A(x_1, \\dots, x_n) = (f^A(x_{11},\
    \ \\dots, x_{n1}), \\dots, f^A(x_{1k}, \\dots, x_{nk}))$ which is precisely the\
    \ condition that $f$ preserves $\\theta$.\n\nOne can, course, extend this notion\
    \ to sets of operations and relations. For $F \\subseteq Op(A)$ and $\\Theta \\\
    subseteq Rel(A)$, write $F|: \\Theta$ iff for every $f \\in F$ and $\\theta \\\
    in \\Theta$, $f|: \\theta$.\n\nThe preservation relation gives rise to a Galois\
    \ connection between the sets $Op(A)$ and $Rel(A)$. We name the polarities in\
    \ the next text.\n\n**Definition 4.13.** Let $A$ be a set, $F \\subseteq Op(A)$\
    \ and $\\Theta \\subseteq Rel(A)$. We define\n\n$\\mathcal{R}(F)$ is the set of\
    \ relations *invariant* under $F$. $\\mathcal{F}(\\Theta)$ is sometimes called\
    \ the set of *polymorphisms* of $\\Theta$."
