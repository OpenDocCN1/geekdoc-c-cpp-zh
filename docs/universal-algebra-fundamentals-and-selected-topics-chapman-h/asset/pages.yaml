  md: "# 3. Centralizers again!\n\n**Claim.** For every $j < k$, $r_j = r_{j+1}$.\n\
    \nProof. Since $N_{ij}$ and $N_{i,j+1}$ overlap, we can find $u_i, v_i \\in N$,\
    \ for $i \\leq n$, such that $g_{ij}(u_i) = g_{i,j+1}(v_i)$. Then\n\n```\n$r_jx\
    \ + \\sum_i s_{ji}u_i + t_j = f(x, u_1, \\dots, u_n) =\nf(x, g_{j1}(u_1), \\dots,\
    \ g_{jn}(u_n)) = f(x, g_{1,j+1}(v_1), \\dots, g_{n,j+1}(v_n)) =\\nf f_{j+1}(x,\
    \ v_1, \\dots, v_n) = r_{j+1}x + \\sum_i s_{ji}v_i + t_{j+1}$.\n```\n\nHence $(r_j\
    \ - r_{j+1})$ does not depend on $x$. This is only possible (in a vector space)\
