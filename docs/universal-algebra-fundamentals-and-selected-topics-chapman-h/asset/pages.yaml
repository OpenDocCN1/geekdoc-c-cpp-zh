  md: "# 4. Applications\n\nLet us say that a finite algebra **A** has empty tails,\
    \ for every $\\alpha \\prec \\beta$ in Con(**A**), the tail of every $(\\alpha,\
    \ \\beta)$-minimal set is empty. (Equivalently, every minimal set is equal to\
    \ its body).\n\n# **Proposition 8.45.** Every congruence-distributive variety\
    \ has empty tails.\n\nProof. Let $p_0, p_1, \\dots, p_n$ be Jónsson trees (Theorem\
    \ 4.66) for a congruencedistributive variety, $\\mathcal{V}$. Let **A** be a finite\
    \ algebra in $\\mathcal{V}$ and $(\\alpha, \\beta)$ a prime congruence quotient\
    \ of **A**. As we have already observed, $\\text{typ}(\\alpha, \\beta) \\in \\\
    {3,4\\}$. By replacing **A** by **A**$/\\alpha$, we can assume that $\\alpha=0$.\
    \ Let $U$ be a minimal set. By Theorem 8.33, $N=[0, 1]$ is the unique trace of\
    \ $U$.\n\nSince $U$ is a neighborhood, there is $e \\in \\mathbf{E}(\\mathbf{A})$\
    \ such that $\\vec{e}(\\mathbf{A})=U$. By replacing each $p_i$ with $cp_i$, we\
    \ can assume that both $U$ and $N$ are closed under $p_0, \\dots, p_n$. Note that\
    \ the $p_i$'s will still satisfy the conditions in Theorem 4.66.\n\nSuppose, by\
    \ way of contradiction, that $c$ is an element of the tail of $U$, i.e., $c \\\
    in U$ and $c \\notin N$. For $i \\le n$, let $f_i(x)=p_i(0, x, 1)$. Then\n\n```\n\
    $f_i(c)=p_i(0, c, 1) =\beta p_i(0, c, 0)=0$\n```\n\nBy 4.66(c). Thus $f_i \\in\
    \ N$. Since $f_i$ must map the finite set $N$ to itself and maps it into $N_i$,\
    \ it must be the case that $f_i$ is not a permutation of $U$. Since $U$ is $(0,\\\
    beta)$-minimal, it must be that $f_i$ is constant on $U$.\n\nWe argue by induction\
    \ that for all $i \\le n$, $f_i(x)=0$. Since each $f_i|U$ is constant, it is enough\
    \ to show this for a single value of $x$. For this we use the identities in 4.66(c).\
    \ Then, if $i$ is even,\n\n```\n$0=f_i(0)=p_i(0,0,1)=p_{i+1}(0,0,1)=f_{i+1}(0)$\n\
    ```\n\nby (iv), if $i$ is odd\n\n```\n$0=f_i(1)=p_i(0,1,1)=p_{i+1}(0,1,1)=f_{i+1}(1)$\n\
    ```\n\n(using). But now, using (iii), $f_n(x)=1$, a contradiction.\n\nAs we now\
    \ show, two conditions: $\\text{typ}(V) \\subseteq\\{3,4\\}$ and empty tails,\
    \ are both necessary and sufficient for congruence distributivity. Note that under\
    \ the assumption that the types are 3 and 4, the \"empty tails\" are equivalent\
    \ to \"every minimal set has cardinality 2.\" We require one preliminary observation.\n\
    \n# **Proposition 8.46.** Let **A** be a finite algebra and let $(\\alpha_1, \\\
    beta_1), \\dots, (\\alpha_n, \\beta_n)$ be a list of all the prime congruence\
    \ quotients in **A**. For each $i \\le n$ choose $U_i \\in M_{\\mathbf{A}}(\\\
    alpha_i, \\beta_i)$. There is a natural subrepresentation\n\n```\n$Con(\\mathbf{A})=\\\
    prod_{i=1}^n Con(\\mathbf{A}|_{U_i})\\$\n```"
