    \ = \theta$. Therefore, by another application of theorem 8.17, there is $u \\\
    in M_S(0,1)$ such that $\tilde{u}(S) \\subseteq U$.\n\nUsing (8-12) we can find\
    \ a pair $(u, v)$ in $\\eta' - \theta$. By (8-11), there is $u' \\in C$ such that\
    \ $p_{u'}|C = p_u|C$, i.e., $(u, u') \\in \\eta'$. Therefore $u = e(u) \\eta e(u')$.\
    \ Setting $u_1 = e(u')$ and picking the same argument for $v$ we get\n\n$(\\exists(u,\
    \ v) \\in \\eta' - \theta) (\\exists(u_1, v_1 \\in \\eta), (u, u_1) \\in \\eta\
    \ \\wedge (v, v_1) \\in \\eta)$.\n\nLet $N_1$ be a trace of $U_1$. Since $\text{typ}(\\\
    eta|C) = \text{typ}(B) \\in \\{3,4\\}$, we can write 8.33 $|N_1|=2$. We can write\
