  md: "# 3. The Nuts and Bolts of Universal Algebra\n\nSome examples of subdirectly\
    \ irreducible algebras.\n\n+   (1) For $n \\geq 5$ the alternating and symmetric\
    \ groups on $n$ letters are subdirectly irreducible. $A_n$ because it is, $S_n$\
    \ because its normal subgroup lattice is a 3-element chain—with $A_n$ as the monolith.\n\
    \n+   (2) The group (also the ring) $Z_{p^k}$ is subdirectly irreducible $(p$\
    \ prime, $k > 0)$ since its congruence lattice is a chain of length $k+1$.\n\n\
    +   (3) According to Lemma 2.9, the lattice $M_3$ is simple, hence subdirectly\
    \ irreducible.\n\n+   (4) Exercise 2.12.13 tells us that the lattice $N_5$ is\
    \ $(a,b)$-irreducible (in the notation of exercise).\n\nThis brings us to outlined\
    \ the Subdirect Representation Theorem.\n\n**Theorem 3.24** (Birkhoff, 1944).\
    \ *Every nontrivial algebra is isomorphic to a subdirect product of subdirectly\
    \ irreducible algebras.*\n\n*Proof.* We give one. Another is outlined in Exercise\
    \ 2.36.8. Let $A$ be a nontrivial algebra and $I = \\{a,b\\} : a \\in A, a \\\
    neq b\\}$. For each $\\{a,b\\} \\in I$ use Zorn's lemma to find a congruence $\\\
    theta_{a,b}$ maximal with respect to the exclusion of $(a,b)$. This congruence\
    \ is completely met-irreducible. If $\\theta_{a,b} = \\cap \\Psi$ then, $(a,b)\
    \ \\notin \\theta_{a,b}$, there is a $\\psi \\in \\Psi$ with $(a,b) \\notin \\\
    psi$. Since $\\theta_{a,b} \\leq \\psi$, the maximality of $\\theta_{a,b}$ ensures\
    \ $\\theta_{a,b} = \\psi = \\Psi$.\nSince $\theta_{a,b}$ is completely met-irreducible,\
    \ $A/\\theta_{a,b}$ is subdirectly irreducible.\nFrom the definition of these\
    \ congruences we obtain\n\n$\bigcap_{\\{a,b\\}\\in I} \\theta_{a,b} = 0_A$$\n\n\
    yielding, by Proposition 3.17, a subdirect representation of **A** by subdirectly\
    \ irreducible algebras.\n\nNotice that the subdirect factors obtained in the Representation\
    \ Theorem are quotients of the represented algebra. If **A** is finite, then all\
    \ of its quotients are finite, and the index set $I$. We have the following corollary.\n\
    \n**Corollary 3.25.** *Every finite algebra is isomorphic to a subdirect product\
    \ of a finite number of subdirectly irreducible algebras.*\n\n**Exercise 3.26.**\n\
    \n+   1. Represent the three-element chain as a subdirect product of subdirectly\
    \ irreducible lattices.\n\n+   2. Review Exercise 1.26.5 on the Rees congruence.\
    \ Recall that a semilattice is a semigroup that is commutative and idempotent."
