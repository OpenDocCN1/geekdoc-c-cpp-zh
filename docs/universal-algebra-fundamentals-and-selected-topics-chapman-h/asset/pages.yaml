    Theorem 3.1.1], a finite field.


    In order to complete our characterization of minimal algebras, we must enumerate
    the two-element algebras, up to polynomial equivalence. This was first accomplished
    by Post [Pos41], who described the lattice of clones on {0, 1}. We present a self-contained
    proof that is complete enough for our current purposes.


    For this discussion we write 2 to represent {0, 1}, “+” will denote addition mod
    2 and $r(x) = x''$ denotes the complement of $x \in \{0, 1\}$. The symbols 0 and
    1 do double-duty both elements and nullary operations. We define seven sets of
    operations of 2:


    ```

    $F_0 = \{0, 1\}, F_1 = \{r, 0\}, F_2 = \{+, 0, 1\}, F_3 = \{\wedge, v, r, 0, 1\},

