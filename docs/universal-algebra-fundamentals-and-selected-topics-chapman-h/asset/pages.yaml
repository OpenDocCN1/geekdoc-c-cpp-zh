  md: '# 16 Algebras


    $f(a)/\theta = f(b)/\theta$? This is precisely the content of the substitution
    property!


    **Definition 1.20.** Let **A** be an algebra and $\theta$ a congruence relation
    on **A**. The *quotient algebra $A/\theta$* is the algebra similar to **A**, with
    universe $A/\theta$ and basic operations defined by equation (1-4).


    From our discussion above, we obtain that $q_\theta$ is a homomorphism from **A**
    to $A/\theta$ with kernel $\theta$. Thus every congruence is the kernel of a homomorphism.


    For any algebra **A**, the equivalence relations $0_A$ and $1_A$ are always congruences.
    We note that $A/0 \cong A$ and $A/1$ is a trivial algebra (see page 8). There
    is, up to isomorphism, one trivial algebra of each similarity type, and it is
    a homomorphic image of every algebra of its type.


    Of course most algebras studied in practice will contain other congruences besides
    0 and 1. Those that do not receive special distinction. A nontrivial algebra possessing
    exactly two congruences is *simple*.


    All this talk of kernels reminds the reader of earlier courses on groups and rings.
    What is the connection? Suppose $h: \mathbf{G} \to \mathbf{H}$ is a group homomorphism.
    Recall that the traditional notion of the kernel of $h$ is the set of elements
    of **G** that map to the identity of **H**. Observe that


    $h(x) = h(y) \iff h(y)^{-1} \cdot h(x) = e_H \iff h(y)^{-1} = e_H$.


    The pair $(x, y)$ lies in the kernel of the kernel in case $y^{-1}x$ is a member
    of the group-theoretic kernel. As we recall from our group theory classes, there
    is a strong relationship between kernels and normal subgroups. Here is a precise
    statement.


    **Theorem 1.21.** *Let **G** be a group.*


    +   (1) *For every normal subgroup N, the relation*


    $$\theta_N = \{(x, y) \in G \times G : y^{-1} \cdot x \in N\}$


    *is a congruence on G.* For any $x \in G$, the right coset $Nx$ coincides with
    $x/\theta_N$.


    +   (2) *For every congruence $\theta$, the equivalence class $e/\theta$ is a
    normal subgroup of **G**.*


    +   (3) *The mapping $N \mapsto \theta_N$ is a bijection from the set of normal
    subgroups to the set of congruences, with inverse map $\theta \mapsto e/\theta$.
    For normal subgroups **N** and **M**, $N \subseteq M$ if and only if $\theta_N
    \subseteq \theta_M$.


    The verification of Theorem 1.21 is left to the reader. It should be clear from
    the theorem that the quotient structure $G/\theta_N$ is the same as the quotient
    group $G/N$. In Exercise 1.26.4 you are asked to formulate a similar correspondence
    between ring congruences and two-sided ideals.'
