    We know that each of the conditions of congruence-distributivity and congruence-permutability
    is important in its own right. The combination of the properties turns out to
    be particularly potent. For one thing it is characterized by a nice Maltsev condition.


    **Definition 4.69.** An algebra is called arithmetical if it is both congruence-permutable
    and congruence-distributive. A variety is arithmetical if every member is arithmetical.


    **Theorem 4.70** (Pixley [Pix63]). Let $\mathcal{V}$ be a variety. The following
    are equivalent,


    +   (a) $\mathcal{V}$ is arithmetical.


    +   (b) $\mathbf{F}_V(3)$ is arithmetical.


    +   (c) There is a term $p(x, y, z)$ such that $\mathcal{V}$ satisfies the identities


    ```

    $p(x, y, x) \approx p(x, y, y) \approx p(y, y, x) \approx x$.

    ```


    The term $p$ described in (c) of the above theorem is called, not surprisingly,
    a Pixley term. The proof of Theorem 4.70 is left as an exercise.

    Since every arithmetical variety is congruence-distributive by definition, it
    should satisfy the conditions of Theorem 4.66, which is to say, it will have a
    set of Jónsson terms. It turns out in this case we can always take $n=2$.


