  md: "# 7. Functionally complete algebras 241\n\nHowever, $\\mathbb{B}_1^-$ is functionally\
    \ complete. To see this that $x' = x \\to 0$ is the complement operation on $\\\
    {0, 1\\}$. Consequently\n\n$x \\vee y = (x \\to y) \\text{ and } x \\wedge y =\
    \ x' \\vee y'$\n\nare polynomials on $\\mathbb{B}_1^-$. Then Pol($\\mathbb{B}_1^-$)\
    \ contains the Boolean algebra operations, hence $\\mathbb{B}_1^-$ is functionally\
    \ complete.\n\nRecall that $\\mathbb{B}_1^-$ generates a congruence distributive\
    \ variety (Exercise 4.75 again) and is therefore simple and nonabelian. Thus this\
    \ algebra demonstrates the necessity of the \"Maltsev\" assumption of Theorem\
    \ 7.72 in a very strong way. Notice that $\\{1\\}$ is a proper (albeit trivial)\
    \ subuniverse of $\\mathbb{B}_1^-$. The following very striking theorem shows\
    \ the degree to which the existence of proper subalgebras limits the strength\
    \ of functional completeness.\n\n**Theorem 7.74** (Kaarli, Szendrei, 1992). *Let\
    \ $A$ be a finite functionally complete algebra with no proper subalgebras. Then\
    \ $\\{V}(A)$ is arithmetical. In fact, $A$ is quasiprimitive.*\n\nIn this theorem,\
    \ quasiprimality follows immediately from Theorem 6.10. Let $A$ be an algebra\
    \ satisfying the assumption in the statement of the theorem. We will find a Pixley\
    \ tree for $A$. The proof requires lemmas\n\n**Lemma 7.75.** *Let $C$ be a nonempty\
    \ subuniverse of $A^2$. Then either $C$ is the graph of an automorphism of $A$\
    \ or there is an element $u$ in $A$ such that $(u, u) \\in C$.*\n\nProof. Suppose\
    \ that $C$ is not an automorphism. Then there are $a_1', a_2', b'$ in $A$ such\
    \ that $(a_1', b'), (a_2', b') \\in C$. Choose $n$ so that $2^n \\geq |A|$. Let\
    \ $f: A^n \\to A$ be any function such that $f(a_1', a_2')^n = A$. Since **A**\
    \ is functionally complete, there is a term $t$ and and $a_1, \\dots, a_m$ in\
    \ $A$ such that\n\n```\n$\\langle x_1, \\dots, x_n \\in \\{a_1', a_2'\\} \\rangle\
    \ \\ f(x_1, \\dots, x_n) = t^A(x_1, \\dots, x_n, a_1, \\dots, a_m).$\n```\n\n\
    Since **A** has no proper subalgebras, $C$ must be a direct square of $A$. Then\
    \ there are $b_1, \\dots, b_m$ in $A$ with $c_i = (a_i, b_i) \\in C$ for $i =\
    \ 1, \\dots, m$. We define\n\n```\n$g(x_1, \\dots, x_n) = t^C(x_1, \\dots, x_n,\
    \ c_1, \\dots, c_m) \\in \text{Pol}(C)$\n```\n\nand set $u = t^A(b', b', \\dots,\
    \ b', b_1, \\dots, b_m) \\in A$. From the surjectivity on $f$, there are $v_1,\
    \ v_2, \\dots, v_n \\in \\{a_1', a_2'\\}$ such that $f(v_1, v_2, \\dots, v_n)\
    \ = u$. Since $v_i \\in \\{a_1', a_2'\\}$, our initial computation in $C$ implies\
    \ that $(v_i', b') \\in C$ for $i = 1, \\dots, n$. thus computing in $C$:\n\n\
    ```\n$g((v_1'), \\dots, (v_n')) = t^C((v_1'), \\dots, (v_n'), (a_1, b_1), \\dots,\
    \ (a_m, b_m)) = \\n$\n$(t^A(v_1, \\dots, v_n, a_1, \\dots, a_m), t^A(b', b', \\\
    dots, b', b_1, \\dots, b_m)) = \\n$\n$(f(v_1, \\dots, v_n), t^A(b', b', \\dots,\
    \ b', b_1, \\dots, b_m)) = (u, u).$.\n```\n\n![](img/4f610fb94046e9c65f60698e9fcee011_255_0.png)"
