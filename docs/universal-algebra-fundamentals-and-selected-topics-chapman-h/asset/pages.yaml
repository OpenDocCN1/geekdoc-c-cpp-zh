  md: "# 4. Clones, Terms, and Equational Classes\n\nThroughout the proof, we shall\
    \ write “equivalent” instead of “equivalent relative to $\\mathcal{A}$”.\n\nSuppose\
    \ $\\mathcal{W}$ is a subvariety of $\\mathcal{A}$. From Birkhoff’s theorem there\
    \ is a set $\\Sigma$ of equations such that $\\mathcal{W} = \text{Mod}(\\Gamma(\\\
    Sigma))$. We wish to show that $\\Sigma$ is equivalent to the single identity\
    \ $nx \\approx 0$ for some $n$. The following four claims accomplish this task.\n\
    \n**Claim 1.** Every identity $s \\approx t$ is equivalent to the identity $s\
    \ - t \\approx 0$ relative to $\\mathcal{A}$.\n\n**Claim 2.** Every identity is\
    \ equivalent to an identity of the form $m_1x_1 + m_2x_2 + \\dots + m_kx_k \\\
    approx 0$ with $m_1, \\dots, m_k \\in \\mathbb{Z}$.\n\nProof. By claim 1, every\
    \ identity is equivalent to one of the form $s - t \\approx 0$. By using the axioms\
    \ of Abelian groups, the term $s - t$ can be rewritten in the form $m_1x_1 + \\\
    dots + m_kx_k$.\n\n**Claim 3.** Every identity $m_1x_1 + \\dots + m_kx_k \\approx\
    \ 0$ is equivalent to the set of identities $\\{m_ix \\approx 0 : i \\le k\\}$.\n\
    \nProof. Suppose an Abelian group $\\mathcal{A}$ satisfies $m_1x_1 + \\dots +\
    \ m_kx_k \\approx 0$ by setting every $x_j = 0$ for $j \neq i$, we see that $\\\
    mathcal{A} \\models m_ix \\approx 0$. Conversely, if $\\mathcal{A}$ satisfies\
    \ each of the identities $+0=0$, then for $a_1, \\dots, a_k \\in \\mathcal{A}$,\
    \ $m_1a_1 + m_2a_2 + \\dots + m_ka_k = 0 + 0 + \\dots + 0 = 0$. Thus $\\mathcal{A}$\
    \ satisfies the $k$-variable identity.\n\n**Claim 4.** Let $M$ be a set of natural\
    \ numbers and $n=\text{gcd}(M)$. Then the set $\\{mx \\approx 0 : m \\in M\\}$\
    \ is equivalent to the identity $nx \\approx 0$.\n\nProof. Suppose $\\mathcal{A}\
    \ \\models nx \\approx 0$. For every $m \\in M$, $n$ is a divisor of $m$, so $\\\
    mathcal{A} \\models mx \\approx 0$ for $m \\in M$. We know from elementary number\
    \ theory there is a finite subset $\\{m_1, \\dots, m_k\\}$ of integers and $p_1,\
    \ \\dots, p_k$ such that $n = p_1m_1 + \\dots + p_km_k$. Then for any $a$,\n\n\
    $n = p_1(m_1) + p_2(m_2) + \\dots + p_k(m_k) = 0$\n\nby assumption. $\\mathcal{A}\
    \ \\models nx \\approx 0$.\n\nAs an example, consider the two identities $\\{8x+4y\
    \ \\approx 2x+y, 20x+9y \\approx 5x\\}$. Applying Claim 1 we obtain the set $\\\
    {6x+3y \\approx 0, 15x+9y \\approx 0\\}$. From Claim 3 we get the equivalent set\
    \ $\\{6z \\approx 0, 3z \\approx 0, 15z \\approx 0\\}$ and then from Claim 4 get\
    \ the single identity $3x \\approx 0$. Our original pair of identities defines\
    \ the variety $\\mathcal{A}_3$.\n\nJoins and meets in the lattice $\\mathbf{Lv}(\\\
    mathcal{A})$ are easily computed: $\\mathcal{A}_n \\vee \\mathcal{A}_m = \\mathcal{A}_{\t\
    ext{lcm}(n,m)}$ and $\\mathcal{A}_n \\wedge \\mathcal{A}_m = \\mathcal{A}_{\t\
    ext{gcd}(n,m)}$. Another way to think about this is that $\\mathbf{Lv}(\\mathcal{A})$\
    \ is duality isomorphic to the lattice of ideals of the ring $Z$. Exercise 4.56.2\
    \ for a generalization.\n\n**Corollary 4.47.** $\\mathbf{Lv}(\\mathcal{A})$ is\
    \ not an algebraic lattice."
