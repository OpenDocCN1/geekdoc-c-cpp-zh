  md: "# 7. Maltsev Varieties\n\nWe turn to (3), which is not quite so straightforward.\n\
    \n$\\gamma = [\\alpha_1 \times \\alpha_2, \beta_1 \times \beta_2]$, and $\\gamma_i\
    \ = [\\alpha_i, \beta_i]$, for $i = 1, 2$.\n\nWe must show that $\\gamma = \\\
    gamma_1 \times \\gamma_2$. One direction is easy: $\\gamma_1 \times \\gamma_2$\
    \ has $(\\alpha_1 \times \\alpha_2)$-term condition. Thus $\\gamma_1 \times \\\
    gamma_2 \\geq \\gamma$.\n\nFor $i=1, 2$ let $p_i: \\mathbf{A}_1 \to \\mathbf{A}_i$\
    \ be the projection map as usual, with kernel denoted by $\theta_i$. For a congruence\
    \ $\theta_i \\in \text{Con}(\\mathbf{A}_i)$ we denote by $\tilde{\theta}_i$ the\
    \ congruence $p_i(\theta_i)$ on the polynomial algebra. Recall from Section 3.2\
    \ that the congruence $\\alpha_1 \times \\alpha_2$ coincides with $\tilde{\\alpha}_1\
    \ \\wedge \tilde{\\alpha}_2$. From part (2) above\n\n```\n$\tilde{\\gamma}_i =\
    \ \tilde{p}_i[\\alpha_i, \beta_i] = [\tilde{\\alpha}_i, \tilde{\beta}_i] \\vee\
    \ \\ker(p_i) = [\tilde{\\alpha}_i, \tilde{\beta}_i] \\vee \\eta_i$.\n```\n\nNow,\
    \ $\\gamma_1 \times \\gamma_2 = (\\gamma_1 \\circ \\eta_2) \\circ \\eta_1 = (\\\
    gamma_1 \\wedge \\eta_1) \\wedge (\\gamma_2 \\wedge \\eta_2)$\n\n```\n$(a_1, a_2)\
    \ (\\gamma_1 \times \\gamma_2) (b_1, b_2) \\Longrightarrow (a_1 \\wedge b_1) \\\
    Longleftrightarrow (a_2 \\wedge b_2) \\Longleftrightarrow$\n```\n\n```\n$(a_1,\
    \ a_2) (\tilde{\\alpha}_1 \\wedge \tilde{\\alpha}_2) (b_1, b_2)$\n```\n\ntogether\
    \ with the fact that we are in a Maltsev variety. Therefore, to complete the proof,\
    \ it is enough to show that $\\gamma \\geq \tilde{\\gamma}_1 \\wedge \\eta_1$.\n\
    \nAgain using congruence permutability, $\tilde{\\alpha}_1 = (\tilde{\\alpha}_1\
    \ \\wedge \\eta_2) \\vee \\eta_1$, and similarly for $\tilde{\beta}_1$. Thus\n\
    \n```\n$\tilde{\\gamma}_1 = [\tilde{\\alpha}_1, \tilde{\beta}_1] \\wedge \\eta_1\
    \ = [(\tilde{\\alpha}_1 \\wedge \\eta_2) \\vee \\eta_1, (\tilde{\beta}_1 \\wedge\
    \ \\eta_2) \\vee \\eta_1] \\wedge \\eta_1 =$\n```\n\n```\n$[\tilde{\\alpha}_1\
    \ \\wedge \\eta_2, \tilde{\beta}_1 \\wedge \\eta_2] \\vee [\tilde{\\alpha}_1,\
    \ \\eta_2, \tilde{\beta}_1, \\eta_2] \\wedge \\eta_1 = \\quad [\tilde{\\alpha}_1\
    \ \\wedge \\eta_2, \tilde{\beta}_1 \\wedge \\eta_2] \\vee \\eta_1$\n```\n\nusing\
    \ Proposition 7.45 and Theorem 7.48. Another application of congruence-permutability\
    \ and the monotonicity of the commutator yields\n\n```\n$\tilde{\\gamma}_1 \\\
    wedge \\eta_2 = [(\tilde{\\alpha}_1 \\wedge \\eta_2, \tilde{\beta}_1 \\wedge \\\
    eta_2) \\circ \\eta_1] \\wedge \\eta_2 = [\tilde{\\alpha}_1 \\wedge \\eta_2, \t\
    ilde{\beta}_1 \\wedge \\eta_2] \\leq \\ \\quad [\tilde{\\alpha}_1 \\wedge \tilde{\\\
    alpha}_2, \tilde{\beta}_1 \\wedge \tilde{\beta}_2] = \\gamma$\n```\n\ncompleting\
    \ the proof.\n\nUnfortunately, part (3) of this is not true for infinite products.\
    \ The first paragraph of argument holds, showing that\n\n```\n$[\\prod_{i \\in\
    \ I} \\alpha_i, \\prod_{i \\in I} \beta_i] \\leq \\prod_{i \\in I} [\\alpha_i,\
    \ \beta_i]$.\n```\n\nThe converse however, can fail. See [FM87, Remark 4.6] for\
    \ an example. Theorem 7.49(2) is particularly useful since it tells that the commutator\
    \ on a homomorphic image is entirely determined by its value in the originating\
    \ algebra. To facilitate computations, it is convenient to introduce an additional\
    \ notation. Let $\\alpha, \beta, \theta$ be congruences on an algebra $\\mathbf\
    \ A$. We write\n\n```\n$[\\alpha, \beta]_\theta = [\\alpha, \beta] \\vee \theta$\n\
    ```"
