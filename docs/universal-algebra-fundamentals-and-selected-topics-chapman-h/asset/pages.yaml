    \n# 3.4 Case studies\n\nNow that we have some of the building blocks of the subject\
    \ under our belt, we pause to develop several examples that we can use to illustrate\
    \ the constructions that we have considered so far, as well as those that are\
    \ to come.\n\nIn this section, our interest is in subdirectly irreducible algebras.\
    \ We already know about distributive lattices and Boolean algebras (Example 3.19).\
    \ We shall characterize the subdirectly irreducible algebras in several varieties:\
    \ certain varieties of commutative rings, Abelian groups, and pseudocomplemented\
    \ distributive lattices.\n\n**Definition 3.27.** For an integer $n > 1$, $Cr_n$\
    \ denotes the class of commutative rings that satisfy the identity $x^n \\approx\
    \ x$.\n\nThe members of $Cr_n$ play a key role in the structure theory of rings.\
    \ These also provide important examples in universal algebra.\n\n**Theorem 3.28.**\
    \ Let $n$ be an integer, $n > 1$. *The subdirectly irreducible members of $Cr_n$\
    \ are finite fields of order $d$, where $(d-1) \\mid (n-1)$.*\n\n*Proof.* Since\
    \ its multiplicative group is cyclic, it is easy to see that a finite field of\
