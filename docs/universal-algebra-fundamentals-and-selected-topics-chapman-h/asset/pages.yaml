    \ In both case **A** and **B** are finite and subdirectly irreducible. An identity\
    \ holding in **B** but not **A** is, of course, the modular law. But suppose we\
    \ reverse roles and take $A = M_3$, $B = N_5$. Now an identity holding in **B**\
    \ but not **A** is harder to find. In fact, the reader can catch\n\n```\n$x \\\
    wedge (y \\vee (z \\wedge w)) \\equiv (x \\wedge (y \\vee (x \\wedge z))) \\vee\
    \ (x \\wedge ((x \\wedge y) \\vee (z \\wedge w)))$\n```\n\nis such identity. (To\
    \ see that $M_3$ fails to satisfy, take $x, y, z$ to be the three atoms and $w\
    \ = y$.)\n\n**Definition 5.14.** An algebra $A$ has the *congruence extension\
    \ property* (CEP) if every $B \\leq A$ and every $\theta \\in \text{Con } B$ be\
    \ such that $\theta \\in \text{Con } A$ such that $\theta|_B = \theta$. A variety\
    \ has the CEP if every member algebra has the CEP.\n\nYou showed in Exercise 5.3.1\
    \ that the variety of Abelian groups has CEP. Note that in a variety every nontrivial\
    \ subalgebra of a simple algebra must be simple. Thus the variety of groups cannot\
    \ have CEP. We seek a bit of a converse to this observation.\n\n**Definition 5.15.**\
    \ A variety $\\mathcal V$ is called *semisimple* if every subdirectly irreducible\
    \ member is simple. $\\mathcal V$ is called *subsemisimple* if every nontrivial\
    \ subalgebra of a subdirectly irreducible algebra is simple.\n\n**Theorem 5.16.**\
    \ Let $\\mathcal V$ be finitely generated, congruence-distributive and sub-semisimple.\
    \ $\\mathcal V$ has the congruence extension property.\n\nProof. Let $A \\leq\
    \ B \\in \\mathcal V$ and $\theta \\in \text{Con}(A)$. We can extend $\theta$\
    \ to $B$. The algebra $B$ has a subdirect representation by subdirectly irreducible\
    \ algebras, say $B \\leq \\prod B_i$, with every $B_i \\in \\mathcal V$. By assumption,\
    \ $\\mathcal V$ is generated by a finite set $\\mathcal K$ of finite algebras,\
    \ by Corollary 5.11.\n\nLet us first assume that $A$ is completely-irreducible.\
    \ By Jónsson's Lemma there is an ultrafilter $U$ on $1$ such that $\\eta_U|_A\
    \ \\leq \theta$. We have an embedding of $A/\\eta_U|_A$ into $\\prod B_i/\\eta_{Ui}$\
    \ (see Figure 5.2). But this latter algebra is a member of $\\mathcal V(\\mathcal\
    \ K) = \\mathcal V$ by Lemma 5.6, and is therefore hence. By sub-semisimplicity,\
    \ $A/\\eta_U|_A$ is simple as well, as $\\eta_U|_A$ is a maximal congruence on\
    \ $A$. By assumption, this congruence is determined by $\theta$ so we conclude\
