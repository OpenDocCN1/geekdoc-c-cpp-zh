    \ such that $t(a) = t(b) = u$. But then $|t(\\tilde{s}(\\mathbf{A}))| < |\\tilde{s}(\\\
    mathbf{A})|$, which is a contradiction.\n\n**Theorem 7.74.** Let $f(x, y, z)$\
    \ be any Pixley operation. By this we mean a unary operation satisfying the equation\
