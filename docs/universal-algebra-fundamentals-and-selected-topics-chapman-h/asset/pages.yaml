  md: "# 218 7. Maltsev Varieties\n\nIn this completely general setting, we do not\
    \ have $[\\alpha, \\beta] = [{\beta, \\alpha]$. We can make only the following\
    \ following observations. The second of these says that the commutator is monotone\
    \ in each variable.\n\n# Proposition 7.45. Let A be an algebra, $\\alpha, \\alpha',\
    \ \\beta, \\beta' \\in \\text{Con } A$.\n\n+   (1) $[\\alpha, \\beta] \\leq \\\
    alpha \\wedge \\beta$.\n(2) $\\alpha \\leq \\alpha'$ and $\\beta \\leq \\beta'$\
    \ implies $[\\alpha, \\beta] \\leq [{\\alpha', \\beta']$.\n\nProof. The first\
    \ inequality follows from the fact that $\\alpha \\wedge \\beta \\in C(\\alpha,\
    \ \\beta)$. We turn to the second. Assume that $\\alpha \\leq \\alpha'$ and $\\\
    beta \\leq \\beta'$ and define $\\gamma' = [{\\alpha', \\beta']$, let $\\gamma\
    \ = \\alpha \\wedge \\beta \\wedge \\gamma'$. By part (2) of Theorem 7.44, $\\\
    gamma'$ has the $\\alpha', \\beta'$-term condition, so it certainly has the $\\\
    alpha, \\beta$-term condition. By part (1) of the theorem $\\gamma$ has the $\\\
    alpha, \\beta$-term condition. $[\\alpha, \\beta] \\leq \\gamma \\leq \\gamma'\
    \ = [{\\alpha', \\beta']$.\n\nTo get any useful work, we must return to the realm\
    \ of Maltsev varieties. We first obtain commutativity of the commutator.\n\n#\
    \ Theorem 7.46. Let A lie in a Maltsev variety, $\\alpha, \\beta \\in \\text{Con\
    \ } A$. Then $[\\alpha, \\beta] = [{\beta, \\alpha]$.\n\nProof. For any $\\gamma\
    \ \\leq \\alpha \\wedge \\beta$, we have $\\gamma \\leq (\\beta/\\gamma)^*$ iff\
    \ $\\gamma \\leq (\\alpha/\\gamma)^*$ by Theorem 7.26. Thus $C(\\alpha, \\beta)\
    \ = C(\\beta, \\alpha)$.\n\nOne of the most important properties of the commutator\
    \ is Theorem 7.48 asserts that it is completely additive. This allows us, in some\
    \ circumstances, to replace the meet operation with the commutator and achieve\
    \ a certain amount of distributivity. To prove this we need a lemma that the congruences\
    \ with the $\\alpha, \\beta$-term condition form a principal filter of the congruence\
    \ lattice\n\n# Lemma 7.47. Let A lie in a Maltsev variety, $\\alpha, \\beta, \\\
    gamma \\in \\text{Con } A$. Suppose that $\\gamma \\geq [{\\alpha, \\beta]$. Then\
    \ $\\gamma$ has the $\\alpha, \\beta$-term condition.\n\nProof. Let $\\nu = [{\\\
    alpha, \\beta]$. Then $\\alpha \\leq (\\beta/\\nu)^*$. Therefore, for any operation\
    \ $t, (a,b) \\in \\alpha$ and $(a,d) \\in \\alpha$,\n\n```\nt(a,c)/\\nu \\quad\
    \ t(b,c)/\\nu \\in \\Delta_{\\alpha/\\nu}^*\n```\n\nBy Theorem 7.25(3)\n\n```\n\
    t(a,c)/\\nu \\equiv t(a,d)/\\nu \\implies t(b,c)/\\nu \\equiv t(b,d)/\\nu \\quad\
    \ (mod \\gamma/\\nu)\n```\n\nwhich is equivalent to $\\gamma$ possessing the $\\\
    alpha, \\beta$-term condition.\n\n# Theorem 7.48. Let A lie in a Maltsev variety,\
    \ $\\alpha \\in \\text{Con } A, \\Gamma \\subseteq \\text{Con } A$. Then $[\\\
    alpha, \\Gamma] = \\bigvee_{\\gamma \\in \\Gamma} [{\\\\alpha, \\gamma]."
