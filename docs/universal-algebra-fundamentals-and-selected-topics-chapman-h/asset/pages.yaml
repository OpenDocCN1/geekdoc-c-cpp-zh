    **Corollary 4.5.** *Let A be a set and F a set of operations on A. For any natural
    number m, define*


    ```

    $G_0 = \{p_1^m, p_2^m, \dots, p_m^m\};\nG_{n+1} = G \cup \{f[g_1, \dots, g_k]
    : f \in F, g_1, \dots, g_k \in G\},\quad \text{for } n \in \omega$.

    ```


    Then $\text{Clo}_A = \cup G_n$.


    *Proof.* A simple inductive argument shows that for every natural number $n$,
    $G_n = F_n \cap \text{Op}_n(A)$, where $F_n$ are clones from Theorem 4.3.* $\square$


    As an example, let $F$ consist of the operations of addition, negation, multiplication
    and 1 (a null operation) on the set $Q$ of rational numbers. The set $G_0$ consists
    of the two projection operations, which are the members of $\text{Clo}_Q(F)$.
    We can abbreviate to $\{x, y\}$. At one level, each member of $F$ to $G_0$ obtaining


    ```

    $G_1 = \{x+x, x+y, y+x, y+y, -y, x\cdot x, x\cdot y, y\cdot x, y\cdot y, 1\}\n2x,
    x+y, 2y, -y, x^2, xy, y^2, 1\}$.

    ```


    The 1 in above $G_1$ is the binary constant operation with value 1. $G_2$ is constructed
    from $G_1$ in the same way. There are too many functions to list, but among them
    are $3x, x^2, 2x+y, y+1$. Note that we will use the binary constant operations
    0 (as $x + (-x)$) and 2. Continuing in this way, we can construct integer powers
    and integer multiples of $x$ and $y$, together with their sums and products. In
    words


    ```

    $$\text{Clo}_2(F) = \mathbb{Z}[x, y].$.

    ```


    Of course, a set $A$ with a family $F$ of operations is nothing but an algebra.
    This motivates the next definition.


    **Definition 4.6.** Let $A = \langle A, F\rangle$ be an algebra. The clone of
    term operations on $A$ is $\text{Clo}(F)$, which we define as Clo(A). The clone
    of polynomial operations on $A$ is the clone of $A$ generated by $F \cup \text{Op}_0(A)$.


    One of the underlying principles of our approach to universal algebra is that
    there is nothing particularly special about the basic operations of an algebra.
    They are merely the generators of the clone of term operations. In other words,
    in most contexts, one can work interchangeably with the algebras $\langle A, F\rangle$
    and $\langle A, \text{Clo}(F)\rangle$.1$


