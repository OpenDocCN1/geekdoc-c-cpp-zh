  md: "# 1. Algebras\n\ntype of **A**. Two algebras are called *similar* if they have\
    \ the same similarity type. It is common to write \"type\" in lieu of \"similarity\
    \ type\" when we feel we can get away with it.\n\n**Definition 1.2.** Let **A**\
    \ = $\\langle A, F\\rangle$ and **B** = $\\langle B, G\\rangle$ be algebras of\
    \ the same similarity type $\rho: I \\to \\omega$.\n\n+   1. Let **B** call a\
    \ *subalgebra* of **A** if $B \\subseteq A$ and for every $i \\in I, g_i = f_i\
    \ \\downarrow B^{\\rho(i)}$.\n2. A function $h: B \\to A$ is called *homomorphism*\
    \ if for every $i \\in I$, and every $b_1, b_2, \\dots, b_n \\in B, h(g_i(b_1,\\\
    dots,b_n)) = f_i(h(b_1),\\dots,h(b_n))$. (Here, $n=\\rho(i)$).\n\nAlgebras in\
    \ which every basic operation is unary called *unary* algebras. An algebra with\
    \ a single basic operation which is binary is called a binarar.\n\n# 1.2 Examples\n\
    \nHere are a few examples to whe your appetite and give an idea of how we use\
    \ the notation and terminology. We will introduce more examples as we go.\n\n\
    **Definition 1.3.** A *semigroup* is an algebra $\\langle S, \\cdot\\rangle$ satisfying\
    \ the associative law\n\n> $x \\cdot (y \\cdot z) \\approx x \\cdot (y \\cdot\
    \ z).$ (1-1)\n\nA *monoid* is an algebra $\\langle M, \\e\\rangle$ satisfying\
    \ the associative law and the identities\n\n> $x-e \\approx x \\text{ and } e\
    \ \\cdot x \\approx x$.$ (1-2)\n\nExamples of semigroups and monoids in mathematics.\
    \ $(Z, +)$ and $(\\omega, \\cdot)$ are semigroups, with the latter being a subalgebra\
    \ of the former. $(\\omega, \\cdot)$ is a algebra, not a subalgebra of $\\langle\
    \ Z, \\cdot\\rangle$. Each of these three can be made into a monoid by including\
    \ the appropriate null operation. For any nonempty $A, A^A$ forms a semigroup\
    \ (in fact, a monoid) under function composition, called the semigroup of *self-maps*\
    \ of $A$.\n\nWhy are we using \"squiggles\" instead of the usual equal signs in\
    \ Definition 1.3? The short answer is that (1-1) and (1-2) are not equalities\
    \ *identities*, since they assert the equality of the left- and right-hand sides\
    \ for each choice of the variables (in this case $x$ and $z$). The study of the"
