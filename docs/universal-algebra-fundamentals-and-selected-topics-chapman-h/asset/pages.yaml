    **Example 6.11.** Let $Q = \langle Q, \cdot \rangle$ be the binar with Cayley
    table


    | | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---||}{

    | 1 | 1 | 2 | 3 | 4 | 5 |

    | 2 | 2 | 3 | 4 | 5 | 1 |

    | 3 | 3 | 5 | 5 | 1 | 4 |

    | 4 | 4 | 1 | 5 | 2 | 3 |

    | 5 | 5 | 4 | 1 | 3 | 2 |


    $Q$ is a Latin square, so according to Exercise 4.80, $Q$ has the clone of a quasigroup.
    Therefore it generates a Maltsev variety. Since the cardinality of $Q$ is 5, $Q$
    must be simple (Exercise 1.26.6). By inspection we see that the only subminor
    of $Q$ is $\{1\}$. Every subalgebra of $Q$ is simple or trivial. Finally, we will
    show in Example 7.64 that $Q$ generates a congruence distributive variety. We
    can then apply condition (b) of Theorem 6.10 and deduce that $Q$ is quasprimal.
    Therefore, it has a discriminator term. However, finding such a term is not so
    easy. In [Bur95], Burris describes a computer-search for such a term. The smallest
    discriminator term found two pages of single-spaced text.


    In Theorem 6.1 and the remarks following, we characterized finite algebras $A$
    for which $Clo(A) = \mathcal{F}(Sub(A^k))$, for $k > 1$. It is natural to wonder
    about the case $k=1$. A finite algebra $A$ is called *subalgebra-primal* if $Clo(A)
    = \mathcal{F}(Sub(A))$.


    **Corollary 6.12.** *Assume $A$ be a finite algebra. Then $A$ is subalgebra-primal
    if and only if $A$ is quasprimal, distinct nontrivial subalgebras of $A$ are nonisomorphic,
    and no subalgebra of $A$ has a nontrivial automorphism.*


    Proof. $(\Leftarrow)$ Let Sub$(A) denote the set of trivial subalgebras of $A$.
    The conditions in the corollary statement imply $Iso(A) = \{\delta_B : B \leq
    A \ \cup Sub(A^2)\}$. It is easy to see that the operations on $A$ that preserve
    this set of binary relations are the same as those preserve the subalgebras of
    $A$. By Theorem 6.10, $Clo(A) = \mathcal{F}(Sub(A))$.\n$(\Rightarrow)$ Assume
    that $A$ is subalgebra-primal. Then the algebra $A$ is quasprimal. Suppose that
    $B_1$ and $B_2$ are nontrivial subalgebras and $h: B_1 \to B_2$ is an isomorphism.
    We must show that $B_1 = B_2$ and $h$ is the identity map. Let $a \in B_1$ and
    $b = h(a)$. Since $B_1$ is assumed nontrivial, there is $z \in B_1$ with $z \neq
    a$. Let $w = h(z)$. Since $h$ is injective, $w \neq b$.


    Define the operation $f$ on $A$


    ```

    $f(x,y) = \begin{cases} y & \text{if } (x,y) = (a,z) \ x & \text{otherwise.} \end{cases}$

    ```


    It is easy to see that $f$ preserves every subalgebra of $A$, $f \in Clo(A)$.
    Since $f$ is a homomorphism, $h(f(a,z)) = f(h(a),h(z))$. But $h(f(a,z)) = h(z)
    = w$. Since $w \neq b$ the definition of $f$ implies $b = a$. This shows that
    $B_1 = B_2$ and $h$ is the identity.'
