    \ a \\vee b$.\n\n# 2.3 Complete lattices\n\n**Definition 2.13.** A L is called\
    \ *complete* if every subset $X$ of $L$, both sup $X$ and inf $X$ exist.\n\nInstead\
    \ of sup $X$, we often write $\bigvee X$, or, if $X = \\{x_i : i \\in I\\}$, we\
    \ might write $\\bigvee_{i \\in I} x_i$. Similarly, inf $X = \\bigwedge X = \\\
    bigwedge_{i \\in I} x_i$.\\nIt is worth thinking about $\\varnothing$ and $\\\
    bigwedge \\varnothing$, which must exist in any complete lattice. If you carefully\
    \ apply the definition, you will see that $\\bigvee \\varnothing = 0_L$ and $\\\
    \bigwedge \\varnothing = 1_L$. In other words, every complete lattice must have\
    \ a smallest and a largest element. Here are some examples for you to contemplate.\n\
    \n+   (1) Both $Z\\cup{\\pm x\\}$ and $\\mathbb{R}\\cup{\\pm x\\}$ are complete\
    \ lattices (the standard ordering);\\n(2) $Q\\cup{\\pm x\\}$ is incomplete;n(3)\
    \ $(Sb_{\\omega}, \\cap, U)$ is complete;n(4) $(Sb_{\\omega}, \\cup, U)$ is incomplete,\
    \ $Sb_{\\omega}(\\omega) \\cup{\\{\\omega\\\\}$ is complete.\n\n**Proposition\
    \ 2.14.** Let $P$ be a poset in inf $X$ exists for every $X \\in P$. Then $P$\
    \ is a complete lattice.\n\nProof. By assumption, $P$ has arbitrary inf's. We\
    \ have to show the existence of sup's. Let $X$ be a subset of $P$. Since sup $X$\
    \ is to be the *least upper* bound of $X$, we consider $Y = \\{y \\in P : y \\\
    geq X\\}$ and set $a = inf Y$ which exists by assumption. Let $x$ be any element\
    \ of $X$, then for all $y \\in X, y \\le a$ by definition of $Y$. $x$ is a lower\
    \ bound of $Y$. Since $a$ is the greatest of all lower bounds, $x \\le a$. Since\
    \ $x$ was arbitrary, we conclude $a \\in Y$. Thus $a$ is the least of all upper\
    \ bounds of $X$. $\\square$\n\nThis is quite a useful proposal. In algebra, we\
    \ encounter many sets composed of sets, and which are closed under arbitrary intersection.\
    \ It follows that the meet operation coincides with intersection and by Proposition\
    \ 2.14, our poset is a complete lattice. The next corollary lists the most important\
    \ applications of some prime. Some that you have encountered are the lattices\
    \ of normal subgroups of a group; of left-, right-, two-sided ideals of a ring;\
    \ and the closed subsets of a topological space."
