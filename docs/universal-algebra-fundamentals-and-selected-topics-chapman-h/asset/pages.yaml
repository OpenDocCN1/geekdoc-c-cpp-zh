  md: "# # Chapter 6\n\n# ## Arithmetical Varieties\n\nThe previous chapter was concerned\
    \ with the lattice-theoretic property of distributivity, and the influence it\
    \ has on the structure of a variety. However, there is another property of a congruence\
    \ lattice—permutability—that plays an important role. In this chapter, we study\
    \ the combination of congruence-distributivity and -permutability and its effect\
    \ on the clone of term operations.\n\n# 6.1 Large clones\n\nUniversal algebra\
    \ is at least partly search for objects with an especially rich structure. Of\
    \ course “rich structure” is in the eye of the beholder. Perhaps the congruence\
    \ lattice has some important property or the identities that hold in the algebra\
    \ are of a special form. In this section we consider algebras whose clone of term\
    \ operations is as large as possible, subject to some imposed constraint. You\
    \ might say we are looking for basic operations that give us the most for the\
    \ bang.\n\nWe begin with a beautiful theorem of Baker and Pixley [BP75] that elucid\
    \ the importance of a majority operation. We not the first result on the subject,\
    \ it is the most general.\n\nRecall from Definition 4.13 that $\\mathcal{F}(\\\
    Theta)$ denotes the clone of all operations that preserve the relations $\\Theta$\
    \ and $\\mathcal{R}(F)$ is the set of all relations invariant under the operations\
    \ in $F$.\n\n**Theorem 6.1** (Baker-Pixley, 1975). *Let A be a finite algebra\
    \ with a majority operation. Then $Clone\\ A = \\mathcal{F}(\text{Sub}(A^2))$.*\n\
    \nBefore we begin the proof we introduce one additional piece of notation. For\
    \ any set $B$ define\n\n$\\delta_B = \\{(x,x) : x \\in B\\$\n\nThe relation $\\\
    delta_B$ is sometimes called the *diagonal* of $B$. Among other things, $\\delta_B$\
    \ is the graph of the identity function on $B$.\n\nProof of Theorem 6.1. For any\
    \ algebra $\\mathbf{A} = (A, F)$, $\text{Sub}(A^2) \\subseteq \\mathcal{R}(F)$,\
    \ thus\n\n$\\mathcal{F}(\text{Sub}(A^2)) \\supseteq \\mathcal{R}(F) = \\text{Clo}(\\\
    mathbf{A})$.$"
