    phi$ holds in the ultraproduct as well.\n\nIn Section 4.4 we investigated the\
    \ Galois connection between algebras and identities. This has a natural extension\
    \ to arbitrary first-order sentences. For a fixed similarity type $\rho$, let\
    \ $S_\rho$ denote the set of all sentences of type $\rho$. For a class $\\mathcal{X}$\
    \ of algebras and a set $\\Phi$ of sentences we write $\\mathcal{X} \\models \\\
    Phi$ to mean that every $A \\in \\mathcal{X}$ and $\\phi \\in \\Phi$, $A \\models\
    \ \\phi$. The polarities of the Galois connection are\n\n```\n$$\\text{Th}(\\\
    mathcal{X}) = \\{ \\phi \\in S_rho : \\mathcal{X} \\models \\phi \\}$$\n$$\\text{Mod}(\\\
    Phi) = \\{ A \\in \\mathcal{Alg}_rho : A \\models \\Phi \\}$$.\n```\n\nThe $\\\
    text{Mod}(\\Phi)$ operator is the same as we have used for identities and varieties.\
    \ In the present context, classes of the form $\\text{Mod}(\\Phi)$ are called\
    \ elementary classes. The $\\text{Th}$ operator is new. $\\text{Th}(\\mathcal{X})$\
    \ is called the elementary theory of $\\mathcal{X}$.\n\nThe polarities give rise\
    \ to closure operators. $\\text{Mod}(\\mathcal{X})$ is the elementary class generated\
