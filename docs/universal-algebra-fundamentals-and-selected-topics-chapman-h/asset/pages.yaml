    \ $\\mathcal{W}'_1 = \text{Mod}(\\Sigma_1)$. Note that $\\mathcal{W}'_1$ is term-equivalent\
    \ to $\\mathcal{W}_0$.\n\nNow, to squash a height 2 term down to height 1, we\
    \ use the trick described just before the proof. By applying the “s” operation\
    \ repeatedly, we can find a single term $h$ (of very large rank, $m$) such that\
    \ every basic operation of $F_1$ is a polymer of $h$.\n\nFinally, define $\\hat{h}\
    \ = h \\star h$. Then every term of height at most 2 is a polymer of $\\hat{h}$.\
    \ In this we convert $\\Sigma_1$ into a set of height 1 identities in the single\
    \ operation symbol $h$. Let $\\Sigma_2$ be that set of identities, together with\
    \ the identity\n\n```\n$h(x_1, x_1, \\dots : x_1, x_2, \\dots, x_2, \\dots, x_m)\
    \ \\approx\\nnh(x_1, x_2, \\dots, x_m, x_2, \\dots, x_m), \\quad (8-13)$\n```\n\
    \nThe variety $\\mathcal{W}_2 = \text{Mod}(\\Sigma_2)$ fulfills the goal for ourselves\
    \ earlier: $\\mathcal{W}_2$ is idempotent, by height 1 identities, and $\\mathcal{W}_2\
    \ \\equiv_t \\mathcal{W}_1 \\equiv_t \\mathcal{W}_0$. Add $\\Sigma_2$ to the identities\n\
    \n```\n$h(\\overline{x}_1, \\dots, \\overline{x}_{mm}) \\approx h(h(x_1, \\dots,\
    \ x_{1m}), \\dots, h(x_{m1}, \\dots, x_{mm}))\\nnh(x, x, \\dots, x) \\approx x.\
    \ \\quad (8-14)$\n```\n\nCall the resulting set $\\Sigma_3$. Note that $\\mathcal{W}_3\
    \ = \text{Mod}(\\Sigma_3)$ is term-equivalent to $\\mathcal{W}_0$.\n\nWe claim\
    \ that $\\hat{h}$ is a Taylor term for $\\mathcal{W}_0$. Suppose not. It follows\
    \ easily from (8-14) that $\\hat{h}$ is idempotent. Say, the $k^{th}$ identity\
    \ of Definition 8.53 fails. Since the only requirement is that the variable in\
    \ position $k$ be different on each side of the identity; it must be in every\
    \ member of $\\Sigma_2$, the $k^{th}$ variables on each side agree. This applies,\
    \ in particular, to (8-13). By dividing $k$ by $m$, we can find $i, j$ with $1\
    \ \\leq i, j \\leq m$ and $k = im + j$. We deduce that in (8-13) have $x_i = x_j$,\
    \ so $i = j$.\n\nBut now we interpret $\\mathcal{W}_3$ into $\\mathcal{Set}$ by\
    \ mapping $h(x_1, \\dots, x_m)$ to $x_i$ and $h(x_1, \\dots, x_m^2)$ to $x_k$.\
    \ This contradicts the radiation\n\n```\n$$\\mathcal{W}_3 \\equiv_t \\mathcal{W}_0\
    \ \\leq_t \\mathcal{Set}$.$\n```\n\nThe point of Theorem 8.54 is that the class\
    \ of varieties possessing a Taylor term is idempotent Maltsev. Any larger class\
    \ would contain a passive variety $\\mathcal{W}$. If $\\mathcal{V}'$ is any variety\
    \ at all, then $\\mathcal{Set} \\leq_t \\mathcal{V}'$, hence $\\mathcal{W}' \\\
    leq_t \\mathcal{V}$. Therefore $\\mathcal{V}$ lies in every Maltsev class, so\
    \ the class consists of all varieties.\n\nIt is time to explain the relationship\
    \ to tame congruence theory. Suppose that $\\mathcal{W}$ is a passive variety.\
    \ Then there is an interpretation of $D$ of $\\mathcal{W}$ into $\\mathcal{Set}$.\
    \ Let 2 denote a two-element set. Then $2^D$ is a D-element of $\\mathcal{W}$\
    \ in which every polynomial is either a projection or constant. Thus $2^D$"
