  md: "# # Chapter 1\n\n#  Algebras\n\nThis first, short, chapter sets sets the stage\
    \ for the entire text. Many of the fundamental notions and several central examples\
    \ are introduced. This will allow us to provide examples and motivation for the\
    \ deeper ideas we encounter in the later chapters.\n\n# ## 1.1 Operations\n\n\
    Let A a set and $n$ a positive integer. We define $A^n$ to be the set of all $n$-tuples\
    \ of elements of $A$, and $A^0 = \\{\\emptyset\\}$.\n\n**Remark.** For any two\
    \ sets $A$ and $B$, $A^B$ denotes the set of all functions from $B$ to $A$. How\
    \ do you reconcile this with the definition of $A^n$ just given? In particular,\
    \ what about $A^0$? What does the definition tell us about the case $A=\\emptyset$?\n\
    \nFor any $A$ and $n$ as before, we call a function $A^n \rightarrow A$ an $n$-ary\
    \ operation on $A$. The natural number $n$ is called the *rank* of operation.\
    \ Operations of rank 1 and 2 are usually called unary and binary operations, respectively.\
    \ Note that an occurrence of operation 0 is a function $c: \\{\\emptyset\\} \r\
    ightarrow A$. Such a function is completely determined by the value $c(\\emptyset)\
    \ \\in A$. Thus, for all intents and purposes, nullary operations (as those of\
    \ rank 0 are often called) are just the elements of $A$. They are frequently called\
    \ constants.\n\nA bit more notation before we proceed. We denote by $\\omega$\
    \ the set of *natural numbers* $\\{0, 1, 2, \\dots\\}$. For any set $X$, $Sb(X)$\
    \ denotes the set of all subsets of $X$ (i.e., the power set). We write $Y \\\
    subseteq X$ to indicate that $Y$ is a finite subset of $X$. Finally $Sb_{\\omega}(X)\
    \ = \\{Y : Y \\subseteq X\\}$. The symbols $\\mathbb{Z}$, $\\mathbb{Q}$ and $\\\
    mathbb{R}$ are used to represent the sets of integers, rationals and real numbers,\
    \ respectively.\n\n**Definition 1.1.** An algebra is a pair $(A, F)$ in which\
    \ $A$ is a nonempty set and $F = \\{f_i : i \\in I\\}$ is a family of operations\
    \ on $A$, indexed by some set $I$. The set $A$ is the universe of the algebra,\
    \ and the $f_i$ are the fundamental or basic operations.\n\nLet $A = \\langle\
    \ A, F \rangle$ be an algebra, with $F = \\langle f_i : i \\in I \rangle$. The\
    \ function $\rho : I \rightarrow \\omega$ which assigns to each $i$ the rank of\
    \ $f_i$ is called the similarity*"
