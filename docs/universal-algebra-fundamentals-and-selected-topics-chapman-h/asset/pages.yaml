    \ \\le^{\text{Q}} \\{f(a), f(b)\\}$. On the other hand, if $x \\le^{\text{Q}}\
    \ \\{f(a), f(b)\\}$, then $f^{-1}(x) \\le^{\text{P}} \\{a, b\\}$. Since $c$ is\
    \ the greatest lower bound, $f^{-1}(x) \\le c$, so $x \\le^{\text{Q}} f(c)$. Thus\
