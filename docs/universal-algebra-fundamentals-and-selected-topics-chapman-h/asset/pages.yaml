    \ We can assume that $a \\preceq b$. Apply Theorem 2.41 to $I = [b]$ and $F =\
    \ [a]$ to obtain a prime ideal $P \\in \\mathcal{P}_a \\setminus \\mathcal{P}_b$.\
    \ The condition\n\n```\n$\\mathcal{P}_a \\cap \\mathcal{P}_b = \\{P : a \\wedge\
    \ b \notin P\\} = \\{P : a \notin P\\} \\cap \\{P : b \notin P\\} = \\mathcal{P}_a\
    \ \\cap \\mathcal{P}_b$\n```\n\nfollows from the fact that $P$ is both a downset\
    \ and prime while\n\n```\n$\\mathcal{P}_a \\cup \\mathcal{P}_b = \\{P : a \\vee\
    \ b \notin P\\} = \\{P : a \notin P\\} \\cup \\{P : b \notin P\\} = \\mathcal{P}_a\
    \ \\cup \\mathcal{P}_b$\n```\n\nis a consequence of the fact that $P$ is an ideal.\n\
    \nFrequently the above theorem is expressed in the form “every distributive lattice\
    \ is isomorphic to a ring of sets.” This reflects the superficial similarity in\
    \ the definitions of rings and lattices. An analogous statement holds for Boolean\
    \ algebras.\n\n**Corollary 2.44.** *Let B be a Boolean algebra. There is a a Boolean\
    \ embedding of $B$ into $\text{Sb}(\text{Prm}B)$, $\\cap, \\cup, \\varnothing,\
    \ \text{Prm}B$.*\n\nProof. Using the same embedding as above, $\\mathcal{P}_0\
    \ = \\varnothing$, since every prime ideal must contain 0, while $P_1 = \text{Prm}B$,\
    \ since every prime ideal must be proper. From these two equalities it follows\
    \ that the mapping must preserve complement.\n\nUsing the relationship between\
    \ prime ideals and homomorphisms onto 2, we can reformulate Theorem 2.43 in a\
    \ way that will generalize to other algebraic structures.\n\n**Corollary 2.45.**\
    \ *Let L be a distributive lattice (or Boolean algebra), and let 2 denote the\
    \ two-element distributive lattice (resp. Boolean algebra). There is a set $J$\
    \ and a lattice embedding $h : L \to 2^J$ such that for every $j \\in J$, $j \\\
