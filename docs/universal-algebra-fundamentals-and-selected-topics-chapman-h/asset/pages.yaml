    \ *A group* is an algebra $(G, \\cdot, e)$ of type $(2, 1, 0)$ such that $\\langle\
    \ G, \\cdot, e \rangle$ is a monoid and Abelian satisfying\n\n```\n$x \\cdot x^{-1}\
    \ \\approx x^{-1} \\cdot x \\approx e.$\n```\n\n*A ring* is an algebra $\\langle\
    \ R, +, -, 0 \rangle$ such that $\\langle R, +, -, 0 \rangle$ is a group, $\\\
