    \ \times \\mathbf{B} \\cong \\mathbf{B} \\cong \\mathbf{A} \times \\mathbf{A}$.**\n\
    \n# 3.3 Subdirect products\n\nDirect decompositions, when they exist, are an extremely\
    \ powerful tool for the analysis of an algebra. Unfortunately, more than not,\
    \ a direct decomposition is not available to us. Furthermore, precisely because\
    \ decomposition is so strong, the property of being directly indecomposable is\
    \ rare.\n\nWe seek a more generous decomposition that can be applied without restrictions.\
    \ Birkhoff (1944) proposed the following which turned out to be a useful tool\
    \ throughout universal algebra.\n\n**Definition 3.16.** An algebra **B** is a\
    \ subdirect product of $\\langle\\mathbf{A}_i : i \\in I\rangle$ if **B** is a\
    \ subalgebra of $\\prod_{i \\in I} \\mathbf{A}_i$ and for every $i \\in I$, $p_i:\
    \ \\mathbf{B} \to \\mathbf{A}_i$ is surjective. An embedding $g: \\mathbf{B} \t\
    o \\prod_{i \\in I} \\mathbf{A}_i$ is called a *subdirect embedding* if $g(\\\
    mathbf{B})$ is a subdirect representation of **B** $\\langle\\mathbf{A}_i : i\
    \ \\in I\rangle$.\n\nAs an example, Corollary 2.45 says precisely that every distributive\
    \ lattice has a subdirect representation by copies of 2.\n\n**Proposition 3.17.**\
    \ *Let **A** be an algebra and $\theta_i$ be a congruence on **A** for every $i\
    \ \\in I$. If $\bigcap_{i \\in I} \theta_i = \theta_A$ then the natural map $\\\
    mathbf{A} \to \\prod_{i \\in I} \\mathbf{A}/\theta_i$ is a subdirect embedding.\
    \ Conversely, if $g: \\mathbf{A} \to \\prod_{i \\in I} \\mathbf{B}_i$ is a subdirect\
    \ embedding, with $\theta_i = ker(p_i \\circ g)$, we have $\bigcap \theta_i =\
    \ \theta_A$ and $\\mathbf{A}/\theta_i \\cong \\mathbf{B}_i$.**\n\nProof. Let $h_i:\
    \ \\mathbf{A} \to \\mathbf{A}/\theta_i$ be the natural map, for each $i \\in I$,\
    \ and $h = \\prod h_i$. Note that each $h_i$ is surjective. From Proposition 3.14.\n\
    \n```\nker h = \\bigcap ker h_i = \\bigcap \\theta_i = 0\n```\n\nby assumption,\
    \ $h$ is an embedding. The projection $p_i: \\prod \\mathbf{A}/\theta_j \to \\\
    mathbf{A}/\theta_i$ has the property that $p_i \\circ h = h_i$. Since $h_i$ is\
    \ surjective, so is $p_i$."
