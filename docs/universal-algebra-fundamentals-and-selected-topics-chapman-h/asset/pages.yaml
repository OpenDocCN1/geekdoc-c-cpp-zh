  md: "# 7. Maltsev Varieties\n\n**Proposition 7.71** (Werner, 1970). *A finite algebra\
    \ is functionally complete if and only if the discriminator operation is a polynomial\
    \ of the algebra.*\n\nProof. Let $d_A$ denote the discriminator operation on a\
    \ set $A$. If an algebra $\\mathbf{A}$ is functionally complete then $\\mathbf{A}^+$\
    \ is primal, hence $d_A \\in \text{Clo}(A^+) = \text{Pol}(\\mathbf{A})$. Conversely,\
    \ suppose that $d_A \\in \text{Clo}(A^+)$. Since $\\mathbf{A}$ is primal, $\\\
    mathbf{A}^+$ is quasipral and has no proper subalgebras or nontrivial automorphisms.\
    \ Therefore by Theorems 6.10 and 6.6, $\\mathbf{A}^+$ is primal, hence it is functionally\
    \ complete □\n\nAs an obvious application of this proposition, every quasipral\
    \ algebra is functionally complete. However, as we show, there are numerous other\
    \ examples.\n\nWithin Maltsev varieties, functionally complete algebras are easily\
    \ recognized. This was first discovered in the case of groups by Maurer and Rhodes\
    \ (1965) and generalized to an arbitrary Maltsev variety by Werner [Wer74]. In\
    \ its present form, the result is due to McKenzie.\n\n# **Theorem 7.72.** *Let\
    \ $\\mathcal{V}$ be a Maltsev variety. A finite member of $\\mathcal{V}$ is functionally\
    \ complete if and only if it is simple and nonabelian.*\n\nProof. For any algebra\
    \ $A$, $\text{Con}(A^2) = \text{Con}((A^+)^2)$. By Theorem 7.30\n\n$\\mathbf{A}\
    \ \\text{ is Abelian} \\Longleftrightarrow \text{Con}(A^2) = \\text{Con}(\\mathbf{M}_3)\
    \ \\Longleftrightarrow$\n\n$\text{Con}((A^+)^2) \\text{ has a spanning } \\mathbf{M}_3\
    \ \\Longleftrightarrow \\mathbf{A}^+ \\text{ is Abelian.}$\n\nNow that $A \\in\
    \ \\mathcal{V}$ and $A^+$ is functionally complete. Then as we have observed,\
    \ $A$ is simple and $A^+$ is primal. Then $\text{Con}((A^+)^2)$ is a distributive\
    \ lattice, so it has no spanning $\\mathbf{M}_3$. Hence $A$ is nonabelian.\n\n\
    Conversely let $A \\in \\mathcal{V}$ be finite, simple and nonabelian. Then $\\\
    mathbf{A}^+$ is strictly simple. By Theorem 7.63, $\\mathbf{A}^+$ is quasipral,\
    \ by Proposition 7.71, $\\mathbf{A}$ is functionally complete □\n\nTheorem 7.72\
    \ yields a host of examples of functionally complete algebras. Every finite, simple,\
    \ nonabelian group for instance. A finite ring is functionally complete if and\
    \ only if it is simple and is not a zero-ring. Any finite, simple member of an\
    \ arithmetic variety is functionally complete. This would include, addition to\
    \ quasipral algebras discussed earlier, the r-lattice $\text{MO}_2$ presented\
    \ on page 190.\n\nOnce we reach the domain of Maltsev varieties, no simple characterization\
    \ of functional completeness is known. We showed in Exercise 4.8(4) that the two-element\
    \ distributive lattice is not functionally complete. Contrast that with fact with\
    \ the following example.\n\n**Example 7.73.** The 2-element implication algebra,\
    \ $\\mathbb{B}_1^-$, of Exercise 4.55.6. You proved in Exercise 7.57 that $\\\
    mathbb{B}_1^-$ does not generate a Maltsev variety (so it is certainly not primal),\
    \ nor does it have a majority term."
