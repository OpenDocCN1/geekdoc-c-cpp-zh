  md: "# 242 7. Maltsev Varieties\n\n**Lemma 7.76.** *Let s be an element of $Clo_1(\\\
    mathbf{A})$ whose range has minimal cardinality. Then for every $a, b \\in \t\
    ilde{s}(\\mathbf{A})$ there is $\\alpha \\in \text{Aut}(\\mathbf{A})$ such that\
