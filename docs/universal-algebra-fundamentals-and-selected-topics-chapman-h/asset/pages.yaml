  md: "# 8. Finite Algebras and Locally Finite Varieties\n\nTaking $a = 1, b = 3$\
    \ and $e = 1$ we see that $a \\cdot c = b \\cdot d$ while $a \\cdot e \neq b$,\
    \ showing that $\\alpha$ is not strongly Abelian, so $\text{tp}(0,\\alpha) \n\
    eq 1$. The congruence $\beta$, on the other hand, is strongly Abelian. Since the\
    \ argument is largely the same as the one on page 260, we omit it.\n\nTheorems\
    \ 8.27 and 8.29 allow us to distinguish prime quotients of type 1 from type 2\
    \ types $\\{3, 4, 5\\}$. It is significant that we can recognize types 1 and 2\
    \ as properties of the congruences within the entire algebra. On the other hand,\
    \ the structure of minimal sets of type 1 and 2 can be quite complex.\n\nContrast\
    \ the above observations with the situation for the nonabelian types. recall that\
    \ a minimal algebra of type 3, 4, or 5 must have two elements and contain a semilattice\
    \ operation in the clone of polynomials. While those properties are not reflected\
    \ in the global structure of the algebra, do impact the structure of a typical\
    \ minimal set. Since we will be concerned with algebras of the form $\\mathbf{A}|_U$\
    \ for some minimal set $U$, it is helpful to make the following definition.\n\n\
    **Definition 8.30.** Let C be a finite algebra and $\\alpha < \beta$ in (C). We\
    \ say that C is $(\\alpha, \beta)$-minimal if $\text{Mc}(\\alpha, \beta) = \\\
    {C\\}$.\n\nThe point here is if $A \\in \text{E}(\\mathbf{A})$, then $U \\in \t\
    ext{Ma}(\\alpha, \beta)$, and $U = \tilde{e}(A)$ for some $e \\in E$, then $\\\
    mathbf{A}|_U$ is an $\\langle\\alpha, \beta\rangle$-minimal algebra. This holds\
    \ for any prime quotient $\\alpha < \beta$.\n\nSuppose that $\\alpha$ is $(\\\
    alpha, \beta)$-minimal for some prime quotient $(\\alpha, \beta)$ of nonabelian\
    \ type, and let $N$ be a trace. So $\text{N}/\\alpha = [0, 1/\\alpha)$ is a minimal\
    \ algebra and there is a polynomial that behaves like the operation on $N/\\alpha$.\
    \ That is,\n\n```\n$f \\in \text{Pol}_2(\\mathbf{A})|_N$ and $f(x,y)/\\alpha =\
    \ (x/\\alpha) \\wedge (y/\\alpha)$ for $x, y \\in \\{0, 1\\}$.\n```\n\nLet $g_0(x)\
    \ = f(x,0)$ and $g_1(x) = f(x,1)$. Since $g_1(0) \\neq g_1(1)$, the minimality\
    \ of $A$ requires that $g_1$ be a permutation of $A$. On the other hand, as $A$\
    \ is finite and $g_0(0) \\equiv_\\alpha g_0(1)$, it is impossible for $g_0$ to\
    \ be a permutation. This observation gives rise to the following definition.\n\
    \n**Definition 8.31.** Let $A$ be a finite algebra, $t(x,y)$ be a term, and $c,\
    \ d$ be members of $A^*$. The polynomials $f(x) = t(x,c)$ and $g(x) = t(x,d)$\
    \ are called twins. If $U \\in \text{Ma}(\\alpha, \beta)$ and $c$ and $d$ come\
    \ from of $U$, then $f$ and $g$ are called $(\\alpha, \beta)$-body twins.\n\n\
    Returning to the discussion, in a minimal algebra of nonabelian type, the polynomials\
    \ $g_0$ and $g_1$ defined above form a pair of $(\\alpha, \beta)$-body twins,\
    \ only one of which is a permutation. We shall prove the converse, and thus may\
    \ derive some additional information.\n\n**Lemma 8.32.** Let $A$ be an $(\\alpha,\
    \ \beta)$-minimal algebra and let $f_0$ and $f_1$ be $(\\alpha, \beta)$-body twins.\
    \ Suppose that $f_1$ is a permutation while $f_0$ is not."
