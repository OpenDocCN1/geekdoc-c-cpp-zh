    The two expressions in part (b) of the above theorem are of interest in their
    own right. Let us define


    ```

    $m_1(x, y, z) = (x \wedge y) \vee (x \wedge z) \vee (y \wedge z)\nm_2(x, y, z)
    = (x \vee y) \wedge (x \vee z) \wedge (y \vee z). \quad (2-2)$

    ```


    It is easy to see that any lattice satisfies the identities


    ```

    $m_1(x, x, y) \approx m_1(x, y, x) \approx m_1(y, x, x) \approx x, \quad \text{for
    } i = 1, 2. \quad (2-3)$

    ```


    For this reason, $m_1$ and $m_2$ are called majority terms. Birkhoff''s theorem
    states that a lattice is distributive if and only if $m_1$ and $m_2$ agree. Majority
    terms play a key role in Theorem 2.21 and in Part II.


    The notion of complementation in set theory can be generalized to an arbitrary
    bounded lattice.


    # **Definition 2.11. Let L** be a bounded lattice.


    +   (1) $x$ and $y$ in $L$ are called *complements* if $x \wedge y = 0$ and $x
    \vee y = 1$.

    (2) $L$ is called *complemented* if every element has a complement.

    (3) $L$ is a *Boolean lattice* if it is bounded, distributive, and complemented.

    (4) A *Boolean algebra* is an algebra $(B, \wedge, \vee, 0'', 1)$ in which $(B,
    \wedge, \vee)$ is a distributive lattice with 0 and 1 and for every $x \in B$,
    $x''$ is the complement of $x$.


    There is no expectation that the complement of an element be unique. The lattices
    $M_3$ and $N_5$ illustrate two ways an element can have multiple complements.
    (And see Exercise 2.12.4 below.)


    # **Exercise Set 2.12.**


    +   1. Let $\mathbf{2} = (0, 1, \wedge, \vee)$ denote the 2-element lattice. Prove
    that for every set $J$, $(Sb(J), \cap, \cup) \cong 2^J$.

