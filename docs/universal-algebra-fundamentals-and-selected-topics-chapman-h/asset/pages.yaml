  md: '# 18 Algebras


    n-tuples of elements of A. We write **a $\theta$ b** when $a_i \\theta b_i$ for
    $i=1,2,\dotsdots,n$. So we can write the substitution property as


    ```

    $\mathbf{a} \\theta \mathbf{b} \implies f(\mathbf{a}) \\theta f(\mathbf{b})$

    ```


    for each basic operation $f$ and all sequences **\mathbf{a}** and **\mathbf{b}**
    from $A$. The construction is a bit more elaborate than the analogue Theorem 1.14
    because we have to ensure the result is transitive.


    **Theorem 1.25.** Let $A = \langle A, F\rangle$ be an algebra and $\nu \subseteq
    A \times A$. Define $\nu_n$ recursively by


    ```

    $\nu_0 = \nu \cup \nu^- \cup 0_A$;

    ```


    ```

    $\nu_{n+1} = (\nu_n \circ \nu_n) \cup \{(f(a), f(b)) : f \in F \ a, b \in \nu_n\}$.

    ```


    Then $Cg^A(\nu) = \bigcup_{n \in \omega} \nu_n$.


    Proof. Let $\nu = \bigcup_{n \in \omega} \nu_n$. We must check three things:


    +   (1) $\nu \subseteq \psi$,


    +   (2) $\psi$ is a congruence,


    +   (3) $\theta \in Con A$ and $\nu \subseteq \theta$ implies $\psi \subseteq
    \theta$.


    Since $\nu \subseteq \theta$ is an equivalence the first these is true. For the
    second, let us define $\sigma_n = \{(f(a), f(b)) : f \in F \ a, b \in \nu b\}$.
    Thus $\nu_{n+1} = (\nu_n \circ \nu_n) \cup \sigma_n$. In the following paragraphs
    we use the fact that $\sigma_n$ is an equivalence in Lemma 1.17 proving that $0_A
    \subseteq \nu_1 \subseteq \dots \subseteq \theta$.


    In order to show that $\psi$ is reflexive, we first claim that $0_A \subseteq
    \psi$. The first inclusion holds by definition. Arguing by induction, $\nu_{n+1}
    \supseteq \nu_n \supseteq 0_A$. Similarly, $\nu_{n+1} = ((\nu_n \circ \nu_n) \cup
    \sigma_n)^- = (\nu_n \circ \nu_n)^- \cup \sigma_n^- = \nu_{n+1}$.


    From the previous paragraph $\psi$ is reflexive and $\psi^- = (\bigcup \nu_n)^-
    = \bigcup \nu_n^- = \bigcup \nu_n$, in other words by transitivity,


    ```

    $\psi \circ \psi = (\bigcup_{j,k \in \omega} (\nu_j \circ \nu_k)) \subseteq (\bigcup_{k
    \in \omega} \nu_k) \subseteq (\bigcup_{k \in \omega} \nu_k) = \nu_{n+1}$.

    ```


    Thus $\psi$ is transitive, hence an equivalence relation. The argument that $\psi$
    has the substitution property is similar to the proof of Theorem 1.14 using the
    fact that $\sigma_n \subseteq \nu_{n+1}$.


    Finally, for the third, assume that $\nu \subseteq \theta \in Con A$. Arguing
    by induction and using the transitivity of $\theta$ and the substitution property,
    $\nu_{n+1} \subseteq \theta$ for every $n$. Therefore $\psi \subseteq \theta$
    as desired.


    A congruence of the form $Cg(\nu)$ where $\nu$ is a finite set (of pairs) is called
    finitely generated. Of special interest are congruences $Cg(\{(x,y)\})$. These
    are called principal congruences. It is customary to show the notation of this
    congruence to $Cg(x,y)$.'
