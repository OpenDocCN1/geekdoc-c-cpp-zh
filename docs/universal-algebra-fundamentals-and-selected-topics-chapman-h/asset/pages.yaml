    **Theorem 8.10.** Let A be an algebra, $e \in \mathbf{E}(A)$ and $U = \vec{e}(A)$.
    There is a complete, surjective, lattice homomorphism $Con(\mathbf{A}) \to Con(\mathbf{A}|_U)$
