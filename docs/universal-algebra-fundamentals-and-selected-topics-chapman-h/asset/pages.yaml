    Let $\psi$ be a congruence on $A|_U$ and define


    ```

    $\widehat{\psi} = \{(x, y) \in A^2 : \forall f \in Pol(\mathbf{A})) f(x) \equiv_{\psi}
    f(y)\}$.

    ```


    $\widehat{\psi}$ is clearly an equivalence relation on A and it is quite easy
    to see that it is preserved by every member of $Pol(\mathbf{A})$. Another application
    of Theorem 4.16 shows that $\widehat{\psi}$ is a congruence on A. If $(x, y) \in
    \psi$, then $e \circ f$ is a polynomial of $A|_U$, we get $(x, y) \in \widehat{\psi}$.
    Thus $\psi \subseteq \widehat{\psi}|_U$.


    On the other hand, for $\theta \in Con(\mathbf{A})$


