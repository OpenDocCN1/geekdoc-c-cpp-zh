    \ see that every finite lattice is bounded. But there are many familiar unbounded\
    \ lattices. For example, the lattice of integers (with the standard ordering)\
    \ and the open interval $\\{x \\in \\mathbb{R} : 0 < x < 1\\}$ are not bounded.\
    \ The poset $\\langle S_{\\omega}, \\ \\subseteq \\rangle$ has a lower bound but\
