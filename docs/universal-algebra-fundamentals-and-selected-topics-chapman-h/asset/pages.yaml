  md: "# 172 Arithmetical Varieties\n\nWe shall call such algebras primal. In Section\
    \ 4.8, we prefer to blur the distinction between nullary and constant unary operations.\
    \ Our definition of primality reflects this preference.\n\n**Definition 6.4.**\
    \ A finite algebra P is called primal if every n > 0, Clone$_n$(P) = Op$_n$(P).\n\
    \nIn Theorem 6.5, we distinguish between nullary and constant unary operations,\
    \ so we don't use the word “primal.” The formalization of primal algebra is in\
    \ the following corollary\n\n**Theorem 6.5.** Let P be a finite algebra. Then\
    \ Clone(P) = Op(P) if and only if V(P) is arithmetical and P is simple, and has\
    \ no proper subuniverse.\n\nProof. Let Clo(P) = Op(P). Then P certainly has a\
    \ Pixley term so V(P) is arithmetical. Since every constant operation is a term,\
    \ P has no proper subalgebras or nontrivial automorphisms. Since P has nullary\
    \ operations, the empty set is not a subuniverse. Since P is simple, let θ be\
    \ a nonzero congruence. Choose (a, b) $\\in$ θ-0P and (c, d) $\\in$ P$^2$. There\
    \ is a unary operation f that f(a) = c and f(b) = d. By assumption, f is a term\
    \ of P, so (c, d) $\\in$ θ, proving that P is simple.\n\nNow assume that P has\
    \ all the properties listed in the statement of the theorem. V(P) is arithmetical,\
    \ by Corollary 4.71 P has a majority term, m. Therefore by Theorem 6.1 Clo(P)\
    \ = $\\mathcal{F}$(P$^2$, $\\delta_P$). We shall show that Sub(P) contains only\
    \ members: P$^2$ and $\\delta_P$ = {(x, x) : x $\\in$ P}. From this it follows\
    \ that Clo(P) = $\\mathcal{F}$(P$^2$) = Op(P).\n\nSuppose that A is a subuniverse\
    \ of P, contrary to our assumption. If A is empty $\\varnothing$ is a proper subuniverse.\
    \ Then for i = 1, 2, $p_i$ : P $\rightarrow$ B be the coordinate direction. Since\
    \ P has no proper subalgebra, each $p_i$ must be surjective. By Fleischer's lemma\
    \ there is an algebra g : P $\rightarrow$ B, for i = 1, 2, that A = E($g$ $\\\
    circ$ $p_1, g$ $\\circ$ $p_2$). Since P is simple, there are only two possibilities\
    \ for B. Either B is trivial or B $\\cong$ P.\n\nIn the first case\n\n**Corollary\
    \ 6.6** (Foster-Pixley, 1964). Let P be a finite algebra. Then P is primal if\
    \ and only if V(P) is arithmetical and P is simple, and has no proper subuniverses.\n\
    \nProof. If P has at least one nullary operation, then it has every constant unary\
    \ operation. This is case covered by the previous theorem. On the other hand,\
    \ suppose that P has no nullary operations. This corresponds precisely to the\
    \ presence of the empty subuniverse. Allowing for this difference, the proof of\
    \ 6.5 goes through just as before."
