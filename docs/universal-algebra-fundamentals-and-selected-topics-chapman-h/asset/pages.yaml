    **Definition 5.26.** Let $\mathcal{K}$ be a class of algebras and let $n$ be a
    natural number. Then $Id_n(\mathcal{K}) = \{p \approx q, p, q \in T(X_n), \Sigma
    \vdash p \approx q\}$.


    Recall that $T(X_n)$ is the set of terms in the variables $\{x_1, x_2, \dots,
    x_n\}$. Note that $Id_n(\mathcal{K})$ will be an equation theory, where the variables
    that may appear are restricted to $\{x_1, \dots, x_n\}$. If $\Sigma$ and $\Gamma$
    are sets of equations, we will use the notation $\Sigma \vdash \Gamma$ to define
    the relation $Mod(\Sigma) \subseteq Mod(\Gamma)$. In other words, every model
    of $\Sigma$ is a model of $\Gamma$.


    **Theorem 5.27** (Birkhoff [Bir35]). *Let A be a finite algebra of finite similarity
    type, and let $n$ be a natural number. Then there is a finite subset $\Sigma$
    of $Id_n(A)$ such that $\Sigma \vdash Id_n(A)$.*


    *Proof.* Recall from Lemma 4.27 that $T(X_n)/\lambda_{\\{A\\}} \in \mathbf{V}(A)$
    and is generated by $X_n$. Since $A$ is finite, it generates a locally variety
    (Theorem 3.49) so $T(X_n)/\lambda$ is fix. Fix a $Q = \{q_1, q_2, \dots, q_k\}$
    of terms from $T(X_n)$ to represent the $\lambda$-classes.


    Let $\Sigma$ be the set of identities $s \approx t$ such that $(s,t) \in \lambda$
    and $s \approx t$ is one of the forms


    $x_i \approx x_j$


    $q_i \approx q_j\n f(q_1, q_2, \dots, q_m) \approx q_l$


    where $i, j \le n, i_1, i_2, \dots, i_m \le k$ and $f$ is a basic operation symbol
    of $\Sigma$. Note that the finiteness of $\Sigma$ and of the similarity type of
    $A$ implies the finiteness of $\Sigma$.


    Let $p \in T(X_n)$ and $q \in Q$. We claim that $\Sigma \vdash p \approx q$ if
    and only if $(p,q) \in \lambda$. For the right-left


    $\Sigma \vdash p \approx q \Rightarrow T(X_n)/\lambda \vdash p \approx q \Rightarrow
    (p,q) \in \lambda$.


    The proof of the converse is by induction on $|p|$. If $p = x_i$ then $p \approx
    q \in \lambda$ by definition. So suppose $p = f(p_1, \dots, p_m)$ and $(p,q) \in
    \lambda$. Then for each $i \le m$ there is $j_i$ such that $(p_i, q_{j_i}) \in
    \lambda$ (since $Q$ is a set of representatives). By the induction hypothesis,
    $p_i \vdash q_{j_i}$, for $i \le m$. Since $\lambda$ is a congruence, $(f(p_1,
    \dots, p_m), f(q_{j_1}, \dots, q_{j_m})) \in \lambda$. Thus $(p, f(q_{j_1}, \dots,
    q_{j_m})) \in \lambda$. From the definition of $\Sigma$, $\Sigma \vdash f(q_{j_1},
    \dots, q_{j_m}) \approx q$.


    $\Sigma \vdash \{p_1 \approx q_{j_1}, \dots, p_m \approx q_{j_m}, f(q_{j_1}, \dots,
    q_{j_m}) \approx q\}$


    from which it follows $\Sigma \vdash f(p_1, \dots, p_m) \approx q$.'
