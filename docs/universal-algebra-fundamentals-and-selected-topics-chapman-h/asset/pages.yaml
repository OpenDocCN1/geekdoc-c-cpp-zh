    2, \dots, n}\}\n$\mathcal{Alg}_{\rho,n}[P] = \{ A \in \mathcal{Alg}_{\rho,n} :
    A \text{ has } P \}$

    ```


    And now define the probability that a finite algebra of type $\rho$ has $P$ by


    ```

    $Pr_{\rho}(P) = \lim_{n\to\infty} \frac{\mathcal{Alg}_{\rho,n}[P]}{\mathcal{Alg}_{\rho,n}}$

    ```


    (assuming the limit exists). It is straightforward to argue that this finitely
    additive probability measure on the set $\omega\in\mathcal{Alg}_{\rho,n}$. For
    a detailed discussion of this, and a related, notion of probability, please see
    [Fre90].


    Murskii proved that when $P$ is taken to be the property of primality, then with
    a mild assumption on $\rho$ we have $Pr_{\rho}(P) = 1$. In other words, every
    finite algebra is primal. We begin the analysis by considering a simpler property
    of an algebra, namely the presence of idempotent elements.


    **Theorem 6.16.** Let $E$ be the property that an algebra has no trivial subalgebras.


    +   (1) $\rho = \langle k\rangle$, with $k > 1$. Then $Pr_{\rho}(E) = 1/e \approx
    0.368$.


    +   (2) $\rho$ contains two least operation symbols, at least one of which is
    nonunary, then $Pr_{\rho}(E) = 1$.


    Proof. Let''s consider the first case of a single binary operation on $\{1, 2,
    \dots, n\}$. The operation is uniquely specified by its Cayley table, and there
    are $n^2$ spaces in the space, and $n$ choices for each space, we see that $|\mathcal{Alg}_{\rho,n}|
    = n^{(n^2)}$


    Now, in order for the algebra to have no trivial subalgebras, we must have $1\cdot
    1 \neq 2, 2\cdot 2 \neq 2$. This means that each diagonal of the Cayley table
    has only $n-1$ choices instead of $n$. Since there are $n$ diagonals, we obtain
    $|\mathcal{Alg}_{\rho,n}[E]]=n^{(n^2-n)} \cdot (n-1)^n$. Therefore


    ```

    $Pr_{\rho}(E) = \lim_{n\to\infty} \frac{n^{(n^2-n)} \cdot (n-1)^n}{n^{n^2}} =
    \frac{1}{e}$

