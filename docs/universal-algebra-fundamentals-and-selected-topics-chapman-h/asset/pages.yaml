  md: '# 8. Finite Algebras and Locally Finite Varieties


    restriction. In practice, Maltsev conditions that have arisen in practice are
    idempotent.


    If we want to understand minimal structure, we should first identify those varieties
    that have no structure at all. One example is: a set has no structure. To be more
    precise, an algebra with no operations has no identifiable structure. But we can
    not cast a little wider. For example, a left-zero semigroup has a basic binary
    operation, but that operation is nothing but a projection, so a left-zero semigroup
    is term-equivalent to a set.


    **Definition 8.52.** *Set* denote the variety of sets—that is, algebras with no
    operations. A variety, $W$, is *passive* if and only if $W \leq_J Set$, otherwise
    it is *active*.


    The word “passive” shouldn''t be seen as having an overly negative connotation.
    It follows from our example above that the variety of semigroups is passive. Nevertheless,
    plenty of people spend their lives studying semigroups. We merely wanted to suggest
    a certain absence of structure. For instance, since Set$ is not congruence-distributive,
    we can immediately conclude that the variety of semigroups fails to be congruence-distributive.
    More generally, a passive variety can satisfy no nontrivial Maltsev condition.


    In [77] W. Taylor proved a converse to this observation, under the assumption
    of idempotency.


    **Definition 8.53.** Let $W$ be a variety, $n > 1$, and $t$ an $n$-ary term of
    $W$. We call $t$ a *Taylor term* for $W$ if $W$ satisfies identities


    ```

    $t(x_{11}, x_{12}, \dots, x_{1n}) \approx t(y_{11}, y_{12}, \dots, y_{1n})$

    $t(x_{21}, x_{22}, \dots, x_{2n}) \approx t(y_{21}, y_{22}, \dots, y_{2n})$

    ```


    ```

    :

    $t(x_{n1}, x_{n2}, \dots, x_{nn}) \approx t(y_{n1}, y_{n2}, \dots, y_{nn})$

    $t(x, x, \dots, x) \approx x$

    ```


    in which every $x_{ij}$ and $y_{ij}$ is a variable and $x_{ii} \neq y_{ii}$ for
    $1 \leq i, j \leq n$.


    Every Maltsev term (for congruence-permutability) and majority term is a Taylor
    term. In fact, every near-unanimity term is Taylor. A binary term is Taylor if
    and only if it is idempotent and commutative. From these observations we see almost
    every variety we have discussed in this text, including semilattices, has a Taylor
    term.


    **Theorem 8.54.** *Let $W$ be an idempotent variety. Then $W$ is active if and
    only if $W$ has a Taylor term.*


    Before presenting the proof of Taylor’s term, we isolate a construction, first
    presented by Padmanaban and Quackenbush [PQ73]. Let $f$ be an n-ary, and $g$ a
    $k$-operation. We define the $kn$-operation $h$ by


    ```

    $h(x_{11}, \dots, x_{kn}) = f(g(x_{11}, \dots, x_{1k}), g(x_{21}, \dots, x_{2k}),
    \dots, g(x_{n1}, \dots, x_{nk}))$

    ```'
