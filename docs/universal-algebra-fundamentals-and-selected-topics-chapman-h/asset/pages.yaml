    \ it has both a 0 and a 1. We first show that $L$ is complemented. Obviously with\
    \ respect to the property that 0 and 1 are complements. Let $x \\in L-\\{0,1\\\
    }$. Pick $u \\in L$ minimal with respect to the property that $x \\vee u=1$. (Such\
    \ a $u$ exists because the lattice is finite and $x \\vee V=1$.) To show that\
    \ $L$ is complemented, it is enough to show that $x \\wedge u>0$.\n\nSuppose to\
    \ the contrary that $x \\wedge u>0$. Since $\bigwedge C=0$, there is $c \\in C$\
    \ with $c \\subseteq x \\wedge u$. We have $[c,1] \\cap u=\\{c\\}$. Since $c$\
    \ is a coatom, it follows that $u$ covers $u \\wedge c$ (Exercise 2.12.5). By\
    \ the minimality of $u$, $x \\vee (u \\wedge c)<1$. Since $L$ is finite, every\
