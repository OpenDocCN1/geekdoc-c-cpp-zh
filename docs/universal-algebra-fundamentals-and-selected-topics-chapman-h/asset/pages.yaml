  md: '# Preface


    Since the book largely parallels the course that I have taught, one can simply
    start at the beginning and progress as far as possible in the time there allotted.
    In one semester it would be possible to cover almost all of Part I, at least through
    Birkhoff''s theorem in Section 4.4. If the instructor feels the need to omit something,
    the "case studies" are a likely candidate, as are the examples that compose Section
    4.4. A one-semester course need not cover the section on interpretations.


    For a two-semester course, I would encourage the instructor to cover everything
    in Part I and then choose some of the sections in Part II. There are very long
    paths that one might skip. These are Baker''s Theorem (5.39), Murskii''s Theorem
    (all of Section 6.2, although one might omit only the proof of Lemma 6.22), and
    two theorems used in the characterization of directly representable varieties,
    7.55 and 7.56.


    A recent development is to bear out the discovery that universal algebra can be
    constraint satisfaction problems. A reader specifically interested in this line
    of research could, after reading most of Part I, concentrate on Sections 7.2–7.4
    and then move on to Chapter 8.


    I cring at the amount of specialized notation that appears in these pages. I have
    done what I can to help the reader by providing an index of symbols, alphabetized
    to the degree it is possible. In mathematical writing, there is always a trade-off
    between precision and readability. While one never wants to leave a reader guessing
    about the exact meaning of any assertion, it is equally true that an author should
    not become a slave to notation. Thus, when I feel that the context allows, I omit
    superscript or subscript quantifiers and closure under isomorphism.


    I am greatly indebted to my students and colleagues in the universal algebraic
    community for all the ideas, suggestions and criticisms that they supplied. Lib
    Barto, Keith Kearnes, Ralph McKenzie, George McNulty, Bob Quackenbush, Jonathan
    Smith and Ross Willard all very patiently answered my questions on the fine points
    of the subject. The treatment in Chapter 8 relies heavily on some nodes of Matt
    Valeriote and I very greatly acknowledge both Joel Berman and David Failing for
    their painstaking rendering of portions of the manuscript.


    This text is obviously influenced by the books that have come before, especially
    those of Burris and Sankappanavar [BS81] and McKenzie, McNulty and Taylor [MMT87],
    both of which are undeservedly out of print. My copies of each are dog-eared and
    marked up. I fondly hope that the book you are now holding will meet the same
    fate.'
