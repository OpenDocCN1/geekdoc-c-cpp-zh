- pgno: 85
  md: 'Although the community-based website was a promotional and marketing vehicle
    for the game, its overall aim was also to generate useful feedback from train
    and rail enthusiasts that could then guide and refine ongoing development of the
    project. It was about engaging lead users in the process that Eric Von Hippel
    (2006) describes so well as user-led innovation. These early adopter trains and
    rail fans would respond to and adapt our design proposals based on their interests
    and requirements. Making contact with the existing train sim fan sites was also,
    in part, a marketing and promotional exercise. We exchanged links with many of
    the sites, and this had the effect of increasing traffic to our site from potential
    future purchasers of the game. Securing endorsement of *Trainz* by leading train
    sim fan sites was an important goal of the Auran online marketing team. For their
    part, fan site owners regularly approach game developers for exclusive preview
    content: an ability to be a source of news about the game development process
    and to publish exclusive preview content helps them establish and maintain their
    position as leaders in the online fan community. The relationship with the fans
    was also fostered to gain feedback on the game''s planned features, which the
    developers would then act on where feasible. But what was feasible was in regular
    dispute among members of the development team.


    Decisions on how fan input may influence *Trainz* design were contradictory and
    shaped by internal tensions. For example, for commercial and business reasons,
    we initially resisted fan demands from individuals such as Vern that Auran introduce
    a stronger element of simulation realism into *Trainz* rather than follow the
    model railroad route; introducing such a significant change would have required
    a much longer development time. Members of the *Trainz* team, particularly the
    project producer, resisted too many significant changes based on fan feedback.
    This was grounded in project management concerns. The producer felt project outcomes
    could be at risk if major features were to be introduced or significant changes
    and modifications made. At team meetings in which the ideas put forward by the
    *Trainz* community were discussed, he would respond that such ''feature creep''
    and ''design by committee'' introduced significant risk that he was not prepared
    to allow. His brief was for a model train simulation with detailed 3D models and
    user-friendly editing tools that were seamlessly integrated with the game, leaving
    everything else for future releases. The producer argued that the fans often just
    did not have the information or design understanding to appreciate the implications
    of their proposals. I will return to this question of the relationship between
    professional expertise and amateur fan creators in Chapter 5 (''Co-creative expertise'').


    I presented the views and opinions emerging from the growing *Trainz* fan community
    at many development team meetings. I would provide printouts of emails and forum
    posts that I considered representative of the views being expressed. Debate in
    these meetings was at times quite strident.'
