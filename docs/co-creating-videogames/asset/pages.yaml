- pgno: 125
  md: 'co-creative networks. Building the smart rooms and networks that Weinberger
    (2011) suggests are transforming our very knowledge institutions, requires us
    to pay serious attention to the identities and working conditions of these professionals.
    But we also need to question whether the categories of political economy critique
    are up to the job of grappling with these challenges.


    This research with Auran and the Trainz fan community demonstrates that gamers
    are not only well aware of the value they create; they are also sophisticated
    practitioners who participate in the production network. The player creators tend
    to strategically use terms like labour and work at the point at which they have
    begun to feel that the terms of the exchange are unfair and their motivations
    for participating are not being satisfied. Sometimes it was at the point that
    the rewards and value of their participation were not fairly recognized by Auran.
    But it is important to also note their sense of discomfort and uncertainty about
    using concepts of labour and work to understand and assess the value which they
    contribute as their motivations are mixed – some are more likely to subscribe
    to discourses of creativity and art that position their activities as arising
    from passionate interest and needing only the intrinsic and social rewards of
    the social economies, while others emphasize the potential to pursue commercial
    opportunities.


    The fan creators'' refusals to fit Auran''s corporate schedules also unsettles
    and disrupts our assumptions about relations between experts and non-experts in
    the production of cultural products. What would it mean to radically reorganize
    the development process and associated organizational structures to account for
    and support the fan content creators'' contributions? How would it transform relations
    among experts and non-experts, professional and non-professionals? For corporations,
    the use of terms such as labour and work implies obligation, contracts and formalized,
    regulated relationships with producers, which are institutional forms that do
    not necessarily fit with co-creative production that is more ad hoc and fluid.
    However, while the current institutional forms may not comfortably fit ad hoc
    co-creative networks, this does not necessarily imply that there are now no obligations
    for the firm to meet in relation to both user creation activities and the working
    conditions of professional creatives. We need to explore what new forms of obligations
    and accountability a firm might accrue when it engages with user-creators and
    professional creatives across the financial and social economies of co-creative
    production.


    How can we better understand the transactions and exchanges that characterize
    these relationships and unsettle our current frameworks of work and labour? As
    Nigel Thrift (2006: 295–6) argues co-creative relations indicate a profound and
    ''general change in how and what constitutes the value form'' that exceeds our
    current understandings and arrangements of labour at work. I pursue these questions
    in the following two chapters.'
