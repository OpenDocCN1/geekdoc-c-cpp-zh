    The Trainz project came to increasingly rely on the unruly assemblage of this
    ad hoc and distributed collaborative fan content-creation network. Here the commercial
    and the non-commercial, the proprietary and the non-proprietary, are linked in
    ways that profoundly reshape the networks of work and play. On the one hand we
    have this fan-based voluntary, collaborative effort, creating content that contributes
    directly to the promotion and success of a commercial, proprietary product. On
    the other, this fan network is imbricated with, and relies on, a proprietary support
    infrastructure.


    Now this fan-based producerly activity could easily be read within the tradition
    of cultural studies as an example of active audience practice. Aren’t gamers,
    in Jenkins’s terms, functioning here as textual poachers? Aren’t they taking the
    products of capital and reworking them according to their own agendas, pleasures
    and enjoyments? The problem here, as we’ve already seen, is that Auran actively
    encourages and supports the practice. These participatory collaborations are immanent
    to these corporate practices and processes. Care must be taken at this point as
    immanent does not necessarily mean that they are seamlessly integrated within
    the networks of corporate capital. Further more, these fan practices do not aim
    so much at disrupting corporate processes as they take pleasure from the products
    of international capital. To disrupt those flows would be to disrupt the fans
    own participatory pleasures. But as we’ve seen this is not just about a banal
    form of populist pleasure. These activities concern innovations in the growth
    of knowledge and distributed learning. But these learning and knowledge creating
    and sharing activities are occurring through the commercial domain. The interests
    of fans as co-creators, then, must surely lie in not disrupting the source of
    their benefits. Rather than subverting, fan practices often involve efforts to
    increase their levels of participation in these commercial networks (Jenkins 2006;
    Hartley 2009). How are these co-creative networks being made and what is the nature
    and characteristics'
