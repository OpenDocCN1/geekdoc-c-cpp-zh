    *Dark Reign* was released in September 1997 and quickly became commercially successful,
    eventually selling over 700,000 copies. It received favourable reviews from online
    game-site press and offline game-review magazines. Auran released the *Tactics
    Engine Manual* that explained in detail how the Tactics Engine could be modified,
    and how users could access, modify and create game scripts to change and alter
    various key game parameters. Shortly after the release, new game maps created
    by users started to appear for download on the fan websites. Lane was hopeful
    that this was just the start of a growing source of fan-generated content that
    would support *Dark Reign*. However, fan content creation activity was lower than
    anticipated and never became a significant feature of the player activity around
    *Dark Reign*. Lane felt that a number of compromises had been made in the design
    of *Dark Reign* that made it somewhat difficult for players to modify or create
    add-ons. He commented in March 1998:


    > > We learnt from that, it really needs to be simpler, easier to use, the barrier
    has to be lower, because we know if it is too difficult to use then, well most
    people won''t give it a go, or they''ll give up. All except the really hard-core
    guys . . . I still think the open architecture engine approach is the way we want
    to go. Involving fans, the gamers in the process is going to be increasingly important.
    It may well change how we make games and an open engine is important here. It
    amazes me what groups of fans are achieving, and the developers need to tap into
    that.


