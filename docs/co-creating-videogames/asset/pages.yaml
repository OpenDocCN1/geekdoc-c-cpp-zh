  md: 'networking strategies for *Fury*, a competitive PvP, massively multiplayer
    online game released in October 2007. I closely followed and observed members
    of Auran’s online community relations team, *Fury*’s developers, and Auran senior
    management. I also participated in pre-release play testing of *Fury*, joining
    in extensive game and feedback sessions with the *Fury* gamers, as well as interviewing
    gamers participating in this co-creative relationship with Auran. More specifically,
    I consider how the design and production practice of Auran’s professional developers
    (designers, producers, community managers, etc.), as well as their professional
    identities, were disrupted and unsettled by the need to negotiate with the expertise
    and knowledge of players. In exploring these issues I also draw on interviews
    I conducted with Maxis’s professional developers. I discuss the diverse and often
    conflicting relationships and interactions between the company and the gamers
    that shape these emergent co-creative relationships. We’ve already seen, for example,
    that Auran’s professional developers did not always wholeheartedly embrace the
    increasingly close relationship with the *Trainz* fans. The developers were often
    divided over their support for involving fans in the making of *Trainz*. While
    often expressing in-principle support for the idea of involving the player community,
    producers, lead designers and graphic artists working on the project also expressed
    their reservations about the risks associated with integrating the players throughout
    the development process. Producers, designers, programmers, artists, community
    relations managers, marketing managers and CEOs often have very different and
    at times competing assessments of the risks and opportunities of these emerging
    co-creative practices. They also have different understandings of how these practices
    should be realized.


    # ‘It’s your game now?’ Negotiating gamer expertise


    Games scholar T. L. Taylor asks (2006a): ‘What it might mean to move beyond simply
    managing player communities to enrolling them into the heart of design and game
    worlds.’ Such a scenario poses expertise as a problem, as it asks us to consider
    extending expertise to player-consumers. It asks us to legitimize the role of
    players in the design decision-making process. But what does it mean to extend
    expertise beyond the boundaries of the firm and the craft skills of professionals
    to include the knowledge and skills of players? In late 2008 Auran management
    approached me to provide them with consultancy advice on their relationship with
    an online gamer community forming around the final stage of the development and
    launch of *Fury*. The'
