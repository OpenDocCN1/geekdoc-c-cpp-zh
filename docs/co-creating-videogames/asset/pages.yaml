    the significance of the tool kit and engine technologies, the question of how
    technologies shape and contribute to these emerging user-participatory relationships
    is not a primary focus of her PhD study.


    # ## Auran’s game-engine project


    In early 1998, Lane believed open-architecture game-engine technologies and sophisticated
    but user-friendly editing tools would transform game development. Game engines
    were becoming more complex as they moved towards modelling 3D environments. Developing
    an engine that could support a cutting-edge game was becoming a challenging long-term
    project that required a team of programmers working for at least two years. It
    was a multimillion dollar undertaking. This created an R&D barrier to entering
    the game industry. By early 1998, it was increasingly unlikely that a small team
    of enthusiastic programmers working from their garage would be able to develop
    a game engine that could then support the design of a commercially competitive
    game. The alternative was to license a game engine from another developer, and
    then modify it based on the requirements of the game design. But rapidly escalating
    licence fees for the high-end engines were again prohibitive.


    Auran urgently needed an engine to support its next game project. Lane believed
    that there was also an opportunity for Auran to become a technology provider,
    licensing an open-architecture engine to independent game developers seeking to
    break into the industry. Auran management needed to work out a business model
    that could effectively take advantage of this opportunity. Building on the success
    of *Dark Reign*, Auran had developed a significant profile within Australia and
    the wider international PC games industry. In this environment, the company managed
    to attract significant investment from both private investors and Australian federal
    government R&D grants. The aim from 1998 through to 2000 was to raise the local
    and international profile of Auran by developing an engine technology that could
    be licensed to other game developers, then to produce a game and secure a publishing
    deal to cement Auran’s position as a top-tier developer, and to promote Auran’s
    technology.'
