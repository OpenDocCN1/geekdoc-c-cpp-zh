  md: '# Modelling co-creativity:\

    A co-evolutionary approach\

    (with Jason Potts)


    # ‘How do you make this damned thing work?’


    In a *Time Magazine* interview, ‘Getting rich off those who work for free’ (Fox
    2007) Yochai Benkler asks, ‘How do you make this damned thing work?’ And he responds
    that co-creative relationships require ‘managing the marriage of money and non-money
    without making non-money feel like a sucker’. Transactions or exchanges play out
    across the boundaries of the commercial and the non-commercial. But what are the
    specific mechanisms of these dynamic exchanges?


    Over the past decade or so we have entered the era of ‘consumer productivity’
    where the networked agency of co-creative consumers, combined with the work of
    professionals employed by creative industry firms, increasingly contributes to
    the productivity of the entire system – a system in which economic and cultural
    values co-evolve. To grapple with the implications of these changing dynamics
    we need to move beyond structural and oppositional modes of analysis that consider
    a gain for one side as necessarily signalling exploitation and loss for the other.
    We need different models and theoretical frameworks for analysing and understanding
    co-creativity. In this final chapter we suggest one such model or framework: *multiple
    games* in the context of *social network markets* (Banks and Humphreys 2008; Potts
    et al. 2008; Banks and Potts 2010). At the core of the social network markets
    model is a conception of consumers linked through social networks as agents engaged
    in production and exchange value creation, not just as recipients of utility through
    consumption. These agents are assessing and making deals,'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'they are exchanging money, attention, connectivity, content and ideas in conditions
    of uncertainty and risk (Hartley 2009).


    In proposing this idea of social network markets, Potts et al. (2008: 169) propose
    that consumer choice in the creative industries is not governed by just the ‘set
    of incentives described by conventional demand theory, but by the choices of others’.
    Social network markets then are fundamentally about ‘individual choice in the
    context of a complex social system of other individual choice’. Coordination does
    not predominantly occur through price signals, as in mature markets, but through
    the social information signals of the behaviours of other agents. Auran’s and
    Maxis’s effort to integrate gamers throughout the development process recognizes
    that the commercial success of game titles relies on precisely such social network
    interactions and transactions. We saw Tony Hilliard, Auran’s CEO, and Lucy Bradshaw,
    Maxis’s general manager, emphasizing the significance of what they call ‘word
    of mouth’. This is therefore a demand-driven dynamic in which the agency and choices
    of creative citizen-consumers and their social networks are fundamental. For example,
    the purchase of a videogame and investment in its online social networks may be
    prompted by a group of fellow game enthusiasts that have recommended the title,
    or a positive reviews posted to fan forums by other gamers. These social network
    dynamics can clearly be seen playing out around the success of enterprises such
    as Facebook, YouTube (Burgess and Green 2009b) and Amazon.


    In a critical survey of scholarly efforts to explain and theorize the emerging
    modes of agency in user-generated content, Jose van Dijck (2009; see also van
    Dijck and Nieborg 2009) carefully examines many of the assumptions implied in
    the ideas of participatory and co-creative cultures. She notes that we need to
    pay more attention to the ‘different levels of participation’ that comprise this
    user agency as it ‘encompasses a range of different uses and agents, and it is
    extremely relevant to develop a more nuanced model for understanding its cultural
    complexity’ (45–6). At moments her critique overreaches, for example, when asking,
    ‘How valid is the claim that all users become “co-creators” or “producers of content”?
    (2009: 46). These ways of describing this emerging mode of agency can perhaps
    be criticized for overly valorizing productive activity but scholars such as Jenkins
    and Bruns certainly do not claim that all users are participating in these activities.
    But for all that van Dijck’s (42) critique is well made – we most certainly need
    better models to grapple with the complexity of user agency. Graeme Turner (2009)
    also challenges that we need a ‘reality check’ on the more enthusiastic if not
    exuberant and optimistic responses to the changes associated with digital media.
    He suggests that many of the claims around social media and web 2.0 phenomenon
    broadly, from Twitter and Facebook through to videogames, are too often ahead
    of the evidence. We agree. We now need to figure out'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'the dynamics that are changing relations between the cultural and economic
    domains. Both Van Dijck''s survey and Turner''s critical assessment continue to
    maintain these domains as somewhat separate and opposed perspectives without suggesting
    how we should bring them together as we endeavour to develop more illuminating
    explanations and models. In conclusion van Dijck urges that we ''need more than
    singular disciplinary theories to help us understand the intricate relationships
    between social and technological agents'' (54). She suggests that we need a ''multidisciplinary
    approach to user agency'' that should ''yield a model that accounts for users''
    multiple roles, while concurrently accounting for technologies and site operators-owners
    as actors who steer user agency'' (55). As we saw in Chapter 3 van Dijck''s *The
    Culture of Connectivity* (2013) takes up this challenge by combining actor-network
    theory and political economy to develop an analytic model for elucidating how
    social media platforms construct sociality. She proposes an approach that focuses
    on the ''co-evolution of social media platforms and sociality in the context of
    a rising culture of connectivity'' (van Dijck 2013: 28). The problem is that without
    a theory of evolutionary dynamics van Dijck falls short of this ambition and too
