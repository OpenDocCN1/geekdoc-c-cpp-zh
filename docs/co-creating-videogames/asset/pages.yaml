  md: 'costs associated with further internal art content creation at the scale required
    to support another release of Trainz could not be justified. The continuing commercial
    viability of Trainz relied on collaborating with the fan content creators. As
    Auran worked towards the next significant release, Trainz Railroad Simulator 2004
    (TRS2004), the decision was made to source new art content (locomotives models,
    trackside accessories such as station and factory models, and layouts) from the
    fan content creators. The Auran development team concentrated on introducing new
    core features and functionality including interactive industries, steam operations
    and a new scripted rules system that enables users to attach scripts to objects,
    controlling their interactions in layout environments. The inclusion of fan content
    with Auran''s official release package was therefore a quite contingent and strategic
    response to a particular commercial situation. In his post to the third-party
    creator community, Lane suggested that as an open platform, evolving game Trainz
    would increasingly draw on the third-party creators for content. The Auran development
    team would therefore commit its resources to expanding the core features and functionality
    of the Trainz platform, while supporting the art content creation efforts of the
    player community. Over a series of posts to the private third-party creator forum
    area, Lane also raised the commercialization opportunities available to creators,
    although he emphasized that Auran would continue to support both freeware and
    payware creators.


    By this time a number of fan content creation teams had formed, and Auran sourced
    much of the content for TRS2004 from these teams. For example, TrainzProRoutes
    (www.trainzproroutes.com) a distributed team of approximately 24 fan creators
    from the United States, United Kingdom and Sweden, had collaborated on very popular,
    high-profile routes for Trainz, such as Clinchfield. They committed to create
    a route for TRS2004, ''Tidewater point''. The Razorback Railway team, led by Shutter,
    contributed an updated version of its popular Razorback Railway route (www.razorbackrailway.com).
    3801''s Robe River Iron and CeeBee''s Highland Valley routes were also included.
    Strat provided Auran with his Big Boy steam locomotive and Jetsteamsky offered
    his Mallard steam locomotive. By the time TRS2004 was released in October 2004,
    35 third-party fan creators had contributed content to the CD release and many
    fan community members had participated in the beta-testing process. The TRS2004
    manual acknowledges this contribution.


    The third party group involved with TRS2004 is possibly the first time a developer
    has utilized the talents of their community to assist so closely in creating a
    commercial product. The process was not without its pitfalls and problems, and
    there were many who found the going too tough. To all of you, especially those
    of you who have contributed product for the CD, we would like to congratulate
    you for a fantastic effort. Without you we simply couldn''t have released TRS2004.'
