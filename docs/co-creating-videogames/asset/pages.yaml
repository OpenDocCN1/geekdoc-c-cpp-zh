- pgno: 113
  md: 'foregrounds the participants’ complex negotiations of how the meanings and
    experiences of work and labour are changed and unsettled. In *No Collar: The Humane
    Workplace and its Hidden Cost* (2003), an ethnography of Razorfish, a new media
    company in New York’s Silicon Alley, Ross offers a compelling study of the informal
    economy workplace. He carefully maintains the uncertainties and contradictions
    in the creative workers accounts of both the potential to reinvent the meanings
    and experiences of work in a more creative and empowering direction, alongside
    their realization that this simultaneously may explain the fact that they often
    work incredibly long hours that encroach on their non-work lives.


    The games industry does not have a particularly enviable record in relationship
    to working hour conditions. Labour conditions are known to be precarious, with
    workers often doing unpaid overtime, and working 80–100 hour weeks during ‘crunch’
    times (IGDA 2004; de Peuter and Dyer-Witheford 2005; Deuze et al. 2007). The adoption
    of co-creative production happens in the context of a labour market where workers
    often struggle to maintain equitable conditions. Of course these uncertain labour
    conditions are not just characteristic of the games industry; they are a feature
    of the creative industries more generally (Ross 2000; Gill 2002; McRobbie 2002).


    Even a cursory reading of Terranova’s much-cited article ‘Free labour: Producing
    culture for the digital economy’ (2000; in which she identifies and grapples with
    the increasing reliance of creative industry enterprises on an unpaid, ad hoc
    network of voluntary labour finds that she foregrounds tensions and contradictions
    as these ‘productive activities . . . are pleasurably embraced and at the same
    time often shamelessly exploited’ (2004: 216). She carefully maintains the complexities
    shaping co-creative relations by pointing out that this affective labour is neither
    directly produced by capital, nor developed as a direct response to the needs
    of capital. The process should not be understood as a straightforward incorporation
    or appropriation of the free labour of an otherwise authentic fan culture. Rather,
    as Terranova proposes, these dynamics reconfiguring relations between production
    and consumption are played out within a field that ‘is always and already capitalism’;
    they are immanent to the networks of informational capitalism (2004: 80). This
    free labour has not been seamlessly appropriated but voluntarily given. The relations
    are much more nuanced and complex than the language of manipulation or exploitation
    suggests. Terranova writes, ‘Such processes are not created outside capital and
    then reappropriated by capital, but are the results of a complex history where
    the relation between labour and capital is mutually constitutive, entangled and
    crucially forged during the crisis of Fordism’ (2004: 94).


    Here though labour is often used as a category to not so much describe the emerging
    relations between professionals and amateurs, or to consider'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'how and in what ways co-creative relations may indeed be reshaping and transforming
    media workplaces. Instead, it becomes an explanation in the form of critique,
    which seeks to unveil or disclose social forces that may be at work behind the
    actors'' backs (Layton 2005: 136). I question this ''unknowingness'' and suggest
    from my observations of negotiations within player communities and between players
    and game industry developers, that players and professional developers most often
    do know what they are doing and producing and the conditions under which they
    are doing it. The user-creators are often quite competent and canny participants
    in the making of these relationships.


    A pressing issue in all of this is whether these particular theorizations of labour
    and work provide us with explanatory traction as we grapple with the various problems
    associated with co-creative media relations. Changes in the relations among media
    producers and consumers, as well as between professionals and amateurs, may indicate
    a profound shift in which our frameworks and categories of analysis (such as the
    traditional labour theory of value) that worked well in the context of an industrial
    media economy are less helpful than before. As John Hartley (2008) argues, applying
    the categories that are appropriate to the context of modern industrial economies
    with their divisions of labour and closed systems of applied expertise may well
    be a mistake. Trying to understand the emerging paradigm of knowledge production
    and circulation from an industrial model, including its categories of political
    economy, is a paralax error. These new and emerging co-creative relationships
    and the associated labour relations questions may be incompatible both analytically
    and practically with these former models and frameworks. Even after taking into
    account that ideas of immaterial labour, affective labour, free labour and precarious
    labour have been reworked through an engagement with the work of theorists such
    as Maurizio Lazzarato and Hardt and Negri, one has to question to what extent
    such reworkings give us tools to come to grips with the ongoing transformations
    associated with co-creative culture.² As Mark Poster (2006: 54–6) suggests, neo-Marxist
    production-based models of the economy may in the end simply and comfortably return
    the critique of capital to the labour process although that process is now expanded
    and redefined. Such critical perspectives do not come to terms with flows and
    exchanges of value that are very different from a simple displacement of traditional
    labour by unpaid creative labour. The modes of agency, social network practice
    and market-based enterprise emerging through these new relationships sit uncomfortably
    with our current understandings of industrial relations and organizations of labour.
    We cannot assume a labour theory of value in which the productive activity of
    users is simply exploited by enterprise to displace paid labour. We need models
    and approaches that can grapple with how economic outcomes sit alongside and co-evolve
    with significant social and cultural outcomes.'
