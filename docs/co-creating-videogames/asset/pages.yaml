  md: 'Auran''s senior programmers explained to me in early 1998 that the SAGE engine
    concept involved enabling game designs that were open to end-user content creation.
    Lane explained.


    The extensibility, the customisability, of the engine supports all the add-ons
    and mods that the fans will create. We headed in this direction with the *Tactics
    Engine* for *Dark Reign*, the extensible engine idea grew as we went along. It
    has now become more important, more significant, as we progress with the new engine.
    But now it isn''t just for the fans. There is an opportunity here, if we get it
    right, to really open up the game production process. But this will be a big task.
    It is kind of like trying to build the game engine to do everything. If we want
    it to be useful for game designers at a generic level, as a general game creation
    tool or environment, then we need to keep it open so that they can do things with
    it that we haven''t even thought of. It has to be modular and flexible so that
    designers and their teams can add on to it based on the requirements of their
    project.


    Drawing on discussions and semi-structured interviews with Auran management, programmers,
    designers and artists, in this chapter I follow the making of SAGE from 1998 through
    to 2000. This engine (renamed Jet in 2000) also provided the core technologies
    for the development of Auran''s *Trainz* train and rail simulator. This game technology
    is therefore an important actor in the making of the co-creative networks that
    I discuss in the following chapters. In engaging with the materiality of objects
    such as game engines by describing them as ''actants'', and thereby attributing
    to them agency that is often restricted to human actors, I am drawing on ANT.
    ANT is generally associated with the work of theorists including Bruno Latour,
    John Law, Annemarie Mol and Michel Callon.


    # ## Actor–Network Theory


    ANT asks what happens if we refuse the starting-point assumption of a divide between
    the human and the non-human? By focusing on the process of construction, on the
    diverse materials that contribute to the making of technical artefacts, Latour
    questions the assumption of a stable divide between humans and non-humans. For
    Latour and ANT theorists generally, the social is an outcome – an effect that
    is made from heterogeneous materials. It is not, in itself, a sufficient explanatory
    category (Latour 2005: 4–9). As Latour (1999: 109) comments in *Pandora''s Hope*,
    positing an external domain of the social can have an effect of cutting or distancing
    the complex web of relations that we are seeking to describe and account for'
