- pgno: 179
  md: 'protected over to where it is a totally remix culture and being able to take
    digital content and remix it however I want then send it back out into the world.
    It’s where these views intersect that it gets really tricky. As players create
    more content and it becomes increasingly important to interactive entertainment
    that all starts interesting legal issues. Also do we owe them anything for creating
    the content that we are now distributing?


    I responded, ‘What do you think?’


    I’m not sure, I think it is a give and take. If we’re in a system like Spore where
    everybody has free access to everything. You know we’re not charging every time
    you download a creature and keeping that money even though someone else made it.
    At the same time we are reaping the benefit of hundreds of millions of pieces
    of content. But then there is a cost of all that to us as well – the development
    costs and so on. And you know the entire player community also reaps the benefit
    from all that content.


    You know my inclination on a lot of this is wait and see what emerges from the
    community self-learning dynamics I was talking about earlier. With *The Sims*
    we did see some players emerge who established these sites for aggregating content
    and monetising it. We kept out of that. The players then kind of self-policed
    it around issues and problems such as people taking and packaging content without
    permission of the creator and so on. This community learning is extraordinary
    – when you have these tens of thousands of people working through all this and
    how they’re going to get attention for this, some of them are going to be very
    creative and very effective because it’s this huge parallel exploration. When
    issues like these come up you know it might be around the economy, intellectual
    property rights, it might be political, well having ten thousand people freely
    trying ten thousand different things is far more likely to get results than relying
    on you know existing structures and institutions that are perhaps a little too
    rigid for handling these emerging dynamics. It’s basically a kind of hive mind
    [laughs] and it can be used in a creative sense like Spore, many people making
    billions of things and also in terms of how they respond to a problem. It’s amazing,
    it really is in some sense our first exposure to you know a meta-intelligence
    made up of thousands of people with all these tools and the information flows.
    Computers in this sense are not providing AI, they’re not fundamentally recreating
    human intelligence, all they’re doing is they’re amplifying and connecting existing
    human intelligences. But what emerges from that is different so in some sense
    it is kind of like AI, as you know AIs made up of ten thousand people able to
    communicate and share information and ideas. We’re starting to see the sorts of
    possibilities that opens. Computers are fundamentally really good'
  merge: -1
