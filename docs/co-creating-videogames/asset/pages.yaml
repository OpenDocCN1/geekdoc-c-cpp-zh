  md: 'The salient point introduced by the social network market model is that this
    is not a static or closed situation in which we can always clearly and definitively
    identify what the pay-offs are: market or non-market motivations, incentives or
    behaviours. Instead, these emergent co-creative practices potentially redefine
    our understandings of what markets are and how they operate in relation to social
    and cultural networks. These markets are because exchange occurs, but it is social
    connections and recommendations, access and attention that perform the coordinating
    function, not just price.


    # ## Attention economy dynamics


    Auran''s effort to involve and integrate the gamers throughout the development
    process recognizes that the commercial success of *Trainz* and *Fury* relies on
    social network dynamics and transactions. Will the *Fury* beta-testers recommend
    and endorse the game to fellow gamers. For example, a high point for the Auran
    community relations team occurred when a screenshot circulated through the online
    networks of competitive PvP guilds and websites showing a high-profile guild play-testing
    *Fury*. The point here was not that the screenshot portrayed the game''s graphical
    splendour, but rather the screenshot was significant because it identified members
    of a high-profile guild supporting *Fury*. If this high-ranking guild were playing
    *Fury* then that alone may attract the attention and interest of other guilds.
    In one sense, this might just be considered word-of-mouth online viral marketing.
    However, the value of the screenshot draws on the credibility and status of those
    seen posing their avatars in the shot, as many other gamers recognize their skills
    and abilities as players. They are expert players with knowledge and understanding
    of videogame design and aesthetics – they know a good game when they play one,
    and can often carefully breakdown and articulate what makes for a quality game
    play experience. They possess a carefully honed game literacy and competency and
    other gamers rely on their opinions when making purchase decisions as well as
    decisions to commit their time to a beta-test process. In the language of Richard
    Lanham (2005: 17), gamers are ''acute and swift economists of attention''.


    We also see these attention economy dynamics at work with Maxis''s *Spore*. In
    an interview with me Maxis''s Community Manager, Theresa Duringer, noted that
    as well as giving players'' a tool to create with, *Spore* also provides them
    with a ''viewer base and communication tools, so they''re sharing their stuff,
    commenting about it on forums, you know, so it''s also about who''s got the best
    creation. So there''s a competitive edge to it that I think is really neat''.
