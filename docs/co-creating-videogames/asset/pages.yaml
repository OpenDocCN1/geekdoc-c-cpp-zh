- pgno: 111
  md: 'and categories that worked well in the context of an industrial media economy
    are no longer helpful. Co-creative media production sits uncomfortably with our
    current understandings and theories of work and labour.


    Approaching media consumption as a form of labour is not new. Dallas Smyth (1981)
    and Miller et al. (2001), for example, describe how the attention and activity
    of consumers generates value for the media industries, and they use the category
    of labour to ground a critical politics that shapes their analysis of these exchanges.
    In the context of new media, Lev Manovich (2001: 44, 109) argues that new media
    objects encourage an overlap between producers and users and asks how these dynamics
    are perhaps functioning to shift labour from the company to the customer and may
    therefore indicate a significant change in the relationship between the domains
    of work and leisure, the professional and the amateur. Manovich, however, does
    not assume that these changes are in any sense necessarily liberating, democratizing
    or exploitative. He carefully opens for our consideration a terrain of difficult
    and demanding questions without finally resolving or settling them.


    As we have seen, Auran''s and Maxis''s pursuit of co-creative relationships unsettles
    industry production and project practice from a closed innovation model towards
    a more open and dynamic model. In the context of labour relations, this shifts
    our focus from concerns with the exploitation of consumer co-creators as free
    labour and the potential displacement of employed creative labour, which are themes
    pursued in much of the literature in the area. I argue that co-creative practice
    may work as a dynamic wrecker of industrial-era modes of production and associated
    business practices. User co-creation may not be best understood as a source of
    cheap content or unpaid and exploited labour. It may be more a dynamic mechanism
    for coordination and change that transforms business and consumer practices towards
    more open and distributed innovation networks. In short it may provide an opportunity
    to adaptively and experimentally explore how to build the smart rooms that Weinberger
    (2011) describes in *Too Big To Know*. Building these smart, distributed, networks
    requires professional skills and capabilities that may reshape workplaces and
    professional identities.


    We need to move beyond commentary that frames user-created content that becomes
    commercially valuable as a marker of exploited labour in the mills of neo-liberal
    capital. These emerging hybrid relations cut across the commercial and non-commercial,
    social networks and markets. We have seen in the Auran and Maxis case studies
    that non-monetary, social economies play an increasingly constitutive role in
    monetary or financial economies; the making and selling of video games. But rather
    than assuming that the social has therefore become commoditized and reduced to
    bottom-line economic imperatives, I suggest that extracting economic value from
    such social relationships is a dynamic process which also potentially transforms'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'business practices. The rooms that are game development studios may need to
    look very different from industrial-era workplaces if they are to successfully
    harness these co-creative opportunities for mutual benefit. The co-evolution of
    these two economies (the social/affective and business) produce not outright exploitation
    of unpaid labour by capital, but a terrain of negotiated relations and transactions
    that are quite different from those of industrial-era production.


    # ## User co-creation and labour


    The linking of the terms labour and exploitation is common in current literature
    (academic and non-academic) on the games industry and player labour – usually
    in ways that position the player creators as unknowing and somewhat blind dupes
    of the developers and publishers. Games studies scholars such as Yee (2006), Grimes
    (2006), Garite (2003), Kücklich (2005) and Kline et al. (2003) all suggest in
    varying ways that users are unknowingly seduced into activities of work. Kücklich
    (2005), for example, argues that industries’ rhetoric of collaboration masks their
    profit-seeking motives (assuming perhaps that players don’t understand the value
    of their contributions). Herman, Coombe and Kaye (2006: 204) conclude that playing
    in Second Life may well be a ‘half-life’ of ‘corporate servitude’ in which participants
    misrecognize their social relations as part of an intellectual property exchange.
    These approaches assume that players are in some sense unaware that their participation
    is a productive practice from which firms extract economic value.


    Critical scholars propose that rather than only constituting greater consumer
    agency, this harnessing of user-created content by media businesses extracts surplus
    value from the unpaid labour of the consumer co-creators as a form of outsourcing,
    and may therefore contribute to the precarious employment conditions of professional
    creatives (Terranova 2000, 2004; Scholz and Lovink 2007; Scholz 2008). Andrew
    Ross (2009: 22) argues that in social network content production platforms such
    as YouTube, Flickr, Twitter and MySpace ‘the burden of productive waged labor
    is increasingly transferred to users or consumers’ and asks us to consider what
    happens to labour and the labour conditions of professional creatives in the context
    of amateur created content. Ross comments that this ‘free or cut-price content’
    is ‘a clear threat to the livelihoods of professional creatives whose prices are
    driven down by, or who simply cannot compete with, the commercial mining of these
    burgeoning, discount alternatives’ (2009: 22; see also Allen 2008 and Jarrett
    2008b).


    These co-creative relationships, however, cannot easily be reduced to corporate
    exploitation, and critics such as Ross seldom reduce the problem to one of such
    straightforward exploitation. The strength of Ross’s work is that it'
