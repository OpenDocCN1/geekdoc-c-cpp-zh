    First, a publisher based in Canada. Strategy First would handle the North American
    release and engage other publishers and distributors for the release in Europe.
    *Trainz*’s retail launch was planned for early 2002. Forum posts and emails from
    fans seeking further details about *Trainz* significantly increased over the last
