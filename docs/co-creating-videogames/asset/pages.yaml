  md: '# # Co-creative technologies


    # ## Introduction


    As we have seen in the previous chapter, accounts of co-creative culture by game
    developers at both Auran and Maxis often revolve around the status of games engine
    and editing tool technologies. These technologies have a quite active and lively
    status in their accounts. Exploring the potential of co-creativity required these
    professionals to develop game engines and software tools that would support these
    emerging relationships. The designers, producers and programmers also eagerly
    anticipated the unexpected ways in which gamers may take up these tools to explore
    the possibilities of modifying and adding on to games such as *Spore*. We need
    to carefully consider the status of these technologies that openly display their
    contingency by inviting users to modify them.


    During my early discussions with programmers at Auran, my understanding of a game
    engine was rudimentary. But it was proving difficult to disentangle Auran from
    technologies such as game engines and editing tools. In the videogames industry,
    the game engine is the research and development component of game production.
    As first described to me by Lane and one of Auran’s lead programmers, a game engine
    is a software design environment constituted by a range of sub-systems and functionality
    that can then be used by designers to implement a particular game design. Game
    engines render the 3D environments that often characterize contemporary games;
    they also provide the physics routines that govern the movement and interactions
    of objects and characters, such as collision detection; they manage sound, artificial
    intelligence routines, networking and tools. It is this tools layer that is particularly
    important for co-creative activities such as user-created content as it makes
    the game and engine accessible so that it can be modified by changing various
    parameters and by importing new content. The game engine'
