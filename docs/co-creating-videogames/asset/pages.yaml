    we focused on the significance and challenges of emerging co-creative relationships
    between game developers and gamers. At the time *Spore* had been recently released
    and were witnessing the phenomenal growth in the amount of player-created content
    for the game. Shaw expressed the Maxis development team’s surprise at the amount
    of content created by the players over such a short period – a matter of two months.
    She also said that the designers were surprised by the speed at which the players
