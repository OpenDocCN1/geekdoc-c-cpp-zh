- pgno: 180
  md: 'at collecting and harvesting human intelligence not recreating it. So with
    *Spore* the program and the technology in some ways isn''t creative at all; it''s
    harvesting the creativity of millions of players and reflecting it back to them.
    But then how do you enable people to use that at scale you know. That''s now the
    challenge with *Spore*. In some ways the game is about half-done, we''ve got this
    huge amount of content. I think it might be the biggest database of 3D content
    in the world right now. The amount of content we ended up dealing with was really
    much larger than anticipated by quite a few orders of magnitude [laughs]. It''s
    to the point, the scale of it I mean, that we''re almost at a loss on how to utilise
    it. It has almost no indexing, you know we have rough categories and that''s about
    it. Getting in there and indexing and finding different ways to access that data
    and present it in interesting ways – that would be a start. One of the things
    we did was open up the API with the database so anyone can actually request data
    and use it for different things. We''re hoping the players will start showing
    some cool things they can do with that presenting that data and such. But you
    know it is still very much an experimental process.


    # ## Growing knowledge and co-creativity


    Approached as an evolutionary process of adaptive change, co-creativity involves
    people originating and adopting new ideas by learning how to do new things and
    creatively experimenting with variations (Hartley 2009; Potts et al 2008; Potts
    and Cunningham 2008). Co-creativity matters not simply as a source of creative
    content or even new ideas, but from its role in how the emerging identities and
    roles associated with these practices are adopted, adapted and retained (such
    as the transforming relationships between professional experts and amateurs).
    Social network markets and multiple-games model and describe co-creativity as
    social-learning dynamics and not just as the output of cultural products or the
    shifting of costs associated with these activities. This perspective then does
    not focus on co-creativity as a resource allocation problem. Instead, it asks
    us to consider the challenge of coordinating knowledge in the context of open
    and self-organizing systems in which adaptive learning behaviours and practices
    are crucial


    This is the fascination and excitement we see in the game developers'' accounts
    of how the co-creative players are going about the activity of generating and
    sharing content and ideas. For example, how they are gaining attention for their
    content or how they lobby the developers for changes or how they share and extend
    their discoveries and learnings with other players. All of this may be part of
    a fundamental and profound evolution in how we grow knowledge.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'In their study of YouTube, Jean Burgess and Joshua Green (2009a: 69–74) argue
    that the value of YouTube and why it matters is not measured just by the enormous
    repository of content but perhaps more significantly by the skills and competences
    acquired and shared through participation in the YouTube co-creative culture.
    In Will Wright’s terms this is emergent self-learning. Burgess and Green argue
    that approaching YouTube as a peer-learning platform involves how users share
    the technological and cultural competencies needed to navigate and innovate within
    this social network. These values and norms ’are collectively constructed, taught
    and learned as part of how the social network develops’ (73–4). My earlier account
    of the P10 steam locomotive is fundamentally about how that digital object mediated
    such processes. Also, as we saw in that case and in the case of Spore, this process
    of collective action and learning is not simply about amateurs replacing media
    professionals, but how these identities and practices are co-evolving and re-coordinating.
    This is about the growth of knowledge and how we grow knowledge.


    This is not a panglossian view of the changes and transformations associated with
    user-created content and user-led innovation. We need to pay close attention to
    the potential costs and risks associated with these changes, including the job
    losses and employment precarity that critics such as Andrew Ross draw to our attention.
    This dynamic understanding acknowledges the creative destruction and unintended
    consequences that flow from these changes.


    We need to craft rigorous and robust understandings and models of how economic
    and cultural co-evolution shapes these co-creative relationships. As we have seen
    these processes are associated with much uncertainty, especially surrounding the
    rapidly changing relationships between professionals and amateurs. We can expect
    that established identities and institutions will be unsettled. Cultural and economic
    change interacts to generate new identities, ways of being, business models and
    learning practices. In the context of such irreducible uncertainty neither extravagant
    claims about the democratizing potential of co-creative culture nor critical dismissals
    get us all that far. We need analytical tools and models that combine the rich
    hermeneutic traditions of the humanities with evolutionary theory, and complex,
    adaptive system models to better understand the phenomena of co-creative culture
    and the associated practices of emergent social learning. As I put the finishing
    touches to this manuscript I read economist Tim Harford’s (2011) latest popular
    work, *Adapt: Why Success Always Starts with Failure*. Harford’s core premise
    is that as we confront increasingly unpredictable and complex problems that seem
    somewhat intractable to traditional models of expert opinion and analysis we must
    adapt. And Harford means adapt in a rigorously evolutionary sense. Like Arthur
    (2009), Harford adopts an evolutionary sciences perspective to suggest that in
    tackling such complex problems we must abandon our search for grand designs that
    provide comprehensive and centralized plans of action.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Our task as researchers is to describe and model and analyse the various institutional
    arrangements and norms that emerge to tackle and solve the various social dilemmas
    and problems associated with co-creative media production. Here we can learn from
    the work of Elinor Ostrom who was jointly awarded (with Oliver Williamson) the
    Nobel Prize in Economics in 2009. Her work on governance problems in the context
    of common-pool resources, the classic ‘tragedy of the commons’ problem expounded
    by Garrett Hardin (1968), establishes that institutions of coordination can evolve
    from bottom-up collective interactions and norms negotiated locally among the
    participants. As Potts and Farl (2010) note in their survey of Ostrom’s work,
    ‘Ostrom uses case studies and experiments to show how the governance problems
    of collective resources can be resolved through *ad hoc* bottom-up institutions
    or rule formulation’ (2). In effect this is a self-organizing and emergent system
    of rules and norms that can resolve the social dilemmas associated with collective
    property (16). Co-creative relations involve both common-pool resources and proprietary,
    commercial interests. The dilemmas of how to coordinate across these different
    frames may also be negotiated, if not resolved, through such bottom-up interactions
    rather than by the imposition of controls by top-down managerial or governance
    systems.


    Adopting Ostrom’s (2005) formulation, the challenge is to identify how these rules,
    understood as forms of collective action, develop through the various interactions
    among participants. We need to describe and analyse the forms of collective action
    that enable participants to negotiate the various dilemmas characterizing these
    situations. Understood as patterns of interactions and their outcomes, what are
    the ‘action situations’ through which ‘individuals interact, exchange goods and
    services, solve problems, dominate one another, or fight (among the many things
    that individuals do)’ (Poteete et al. 2010: 40). Ostrom (2005; also see Ostrom
    and Hess 2006) provides a general analytic framework of institutional analysis
    and development by combining the strengths of field-based comparative qualitative
    research case studies (including ethnographic) with the tools of micro-behavioural
    analysis such as game theory and agent-based modelling simulations and experiments
    to understand and analyse such ‘action situations’.


    The multiple game model offers propositions and hypothesis about how participants,
    especially at the micro-behavioural level, may be negotiating the dilemmas characterizing
    these situations. This model now needs to be tested and refined through further
    comparative research. But the driving problems or questions for me remain: how
    is it possible for participants (both professional and amateur) to act collectively
    through these forms of co-creative practice and organization for sustainable mutual
    benefit? How can we understand and identify the factors that contribute to creating
    situations where such forms of collaboration and cooperation are sustainable and
    successful? What are the conditions and relationships that influence the prospects
    for such successful'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'collective action? In what contexts and situations do the participants behave
    cooperatively to negotiate the dilemmas (which we call multiple games) that they
    confront? We need better tools and theories to help us ask and explore these questions
    about the social-ecological systems of co-creative culture.


    This book does not present a finished general theory of collective action in the
    context of co-creative media production. But I think we have taken some steps
    in that direction. In all of this I am not proposing that co-creative relationships
    will necessarily be democratizing or empowering for the consumer participants
    or indeed for the professionals. Sometimes they are and sometimes they are not.
    The aim is to understand how the participants are negotiating and coordinating
    these emerging modes of collective action. Any optimism about the nature of these
    relationships must be tested through rigorous research. We need to unpack the
    specific mechanisms and processes, especially the micro-institutional variables,
    which shape these collective actions. But as the multiple-games approach suggests,
    we have to remain open on the questions of what these variables, behaviours and
    incentives are. We should not assume that our explanations can confidently rest
    on an understanding of the individual calculating their options and actions based
    on a particular type of pay-off function (be that intrinsic or extrinsic). The
    theoretical and empirical challenge of grappling with and explaining such phenomena
    is far more uncertain and complex (Poteete et al. 2010: 220–21). Nevertheless,
    any approach that seeks to take up this challenge needs to be based on dynamics
    of distributed social learning and norm adoption. The task ahead is to advance
    our understanding of these forms of collective action by offering tools that simplify
    and allow general principles to be elucidated and tested (this is the theoretical
    endeavour) *while at the same time* allowing for complexity and contingency. As
    Poteete et al. (2010: 222) suggest, ‘The weight of an explanation for cooperation
    in social dilemmas must lie both in general theory of human behaviour and in specific
    characteristics of the microinstitutions they are in embedded in a broader context.’
    This is the kind of distortion research agenda that Stark (2009) also proposes,
    for example, by adopting a multiple methods and collaborative research initiative
    that combines ethnographic case study with social network analysis.


    This book offers some initial steps in this direction of disciplinary and methodological
    cross-fertilization, especially through the collaborative work with evolutionary
    economist Jason Potts that informs the final chapter, but there is much work to
    be done to grow and share our knowledge about co-creative practices that may be
    in the process of evolving how we grow and share knowledge. It is very early days
    in this exciting endeavour and my hope is that we can craft a rigorous and generous,
    even playful, model of co-creative enquiry that will contribute to the making
    of our co-creative media cultures.'
