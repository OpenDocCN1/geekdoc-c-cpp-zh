    This ethnographic material does not provide a comprehensive account of Auran from
    1997–2007 nor is it a comprehensive study of the games industry over this period.
    I draw on the ethnographic material to illuminate the complex processes and practices
    of co-creativity. Many of the following chapters descriptively foreground the
    various ways that games developers and gamers wrestle with the opportunities and
    challenges of emerging co-creative relationships. Other chapters, especially the
    final three, draw on this material to propose and develop an analytic model of
    co-creativity. I want to be clear here on the relationship between ethnographic
    description and theory building. The thick detailed description and interview
    extracts should not be reduced to simply exemplars for the analytic and theoretical
    propositions. The ethnographic material informs and guides my theoretical account
    but there is a necessary tension between the ethnographic material and the theory.
    It is a tension that cannot be overcome through appropriate methodological reflexivity.
    Furthermore, although I have carefully selected the interview extracts from the
    many hours of recordings and hundreds of pages of transcripts, (ethnographic accounts
    are as the earlier Rabinow quotation suggests ‘fashioned’), I do not think this
    material is seamlessly reduced to my accounts. Drawing on Meghan Morris’s (1988)
    work, John Frow (1995) warns that the ethnographic object of study (he is examining
    the category of the popular) can become ‘the textually delegated, allegorical
    emblem of the critic’s own activity.’ Their ethos may be constructed as other,
    but it is used as the ethnographer’s mask’ (69). The risk here then is that the
    interview and descriptive material from these game development workplaces may
    be my mask. However, I do not think we are stuck in a stark opposition between
    representational ethnographic verisimilitude and theoretical or critical analysis.
    Nor do I think that is what Morris or Frow are necessarily getting at here. I
    am not, I hope, appropriating these game developer accounts as a stand in for
    my academic discourse that ‘denies its own expository and analytic – its intellectual
    status’ (Frow 1995: 69). My aim is that this ethnographic account builds from
    this constitutive tension and dilemma. The analytic risks Frow and Morris identify
    are not necessarily an impediment or objection to undertaking ethnographic research.
    I think it also a mistake, however, to reduce ethnography to what Frow calls ‘its
    intellectual status’. My position in the making of this account is far more diverse
    and multiple than an academic proposing theory. It also comes from my experience
    as an employee of Auran games in the role of online community manager seeking
    to both understand and participate in the craft of making co-creative media relationships.
