  md: 'keeping open diverse performance criteria rather than by creating consensus
    about one set of rules. Entrepreneurship is disruptive and centred about feedback-driven
    recombination. The entrepreneur, in this view, is an insider to multiple games
    who is further engaged in the recombination of assets and positions to exploit
    these learning opportunities. Entrepreneurship then not so much at the gap of
    different evaluation orders, but emerging from the productive fiction that disrupts
    identities and organizational norms. It makes possible the redefinition, redeployment,
    and recombination of resources. In short, entrepreneurship occurs not at the gap
    but through the generative friction at the overlap of evaluative frameworks''
    (Stark 2009: 19).


    Evolutionary coordination and development takes place not despite but because
    of misunderstandings due to dissonance in overlapping value networks, or structural
    folds (Stark 2009: 191–3). Stark''s ''situations'', following the work of pragmatist
    philosopher John Dewey, are complex contexts that reflect the fact that the actual
    context of most human action is rarely neatly decomposable and commonly consists
    of situations of simultaneous multiple contexts that do not permit multiple actions
    targeted to isolated value domains but more often require a single action or choice
    that plays out across all contexts simultaneously. This is a multiple game. Our
    argument is that co-creative relations are a paradigmatic instance of a multiple
    game.


    Multiple games theory (Page and Bednar 2007) is a recent extension of game theory
    that analyses choice situations in which an individual agent uses a single strategy
    to interact in multiple conceptual spaces, or ''games'', that are otherwise incommensurable.
    Standard game theory allows considerable complexity in the agents, strategies
    and rules of the game, but always supposes that only one game is being played.
    A multiple game differs in that a single strategy is played over multiple games,
    with each game representing a different set of rules, pay-offs and even players.
    Multiple games theory provides a model to address the notion that not only are
    there multiple contexts of action in consumer co-creation – such as intellectual
    property production, future labour market signalling, learning and feedback, equity
    stakes, cultural identity and opportunity, cultural participation, community norms
    – but also that these dimensions are fundamentally incommensurable. This is important,
    because were these dimensions commensurable then it would be possible to sum the
    costs and benefits associated with each dimension, appropriately weighted to reflect
    the agent''s cultural and economic preferences, to arrive at a single rational
    choice or play.


    Yet this is not what we see through this ethnographic research. My research participants
    often did not display evidence of neatly compartmentalizing different aspects
    of context and then resolving these into actions that reflected the various inherent
    trade-offs. Rather, they sometimes behaved as if these multiple contexts and distinct
    tensions were characteristic of the situations'
