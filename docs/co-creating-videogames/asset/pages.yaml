  md: 'Jenkins approaches media users as pursuing complex and contradictory alliances
    and suggests that fans seek to open and explore possibilities for participatory
    alliances within these commercial networks. Problems then become those of access,
    and the terms and conditions of this participation, rather than opposition or
    resistance.³ This is a framework in which fan communities are not understood as
    either resisting the culture industries or being seamlessly incorporated to corporate
    interests and agendas. Instead, these participatory culture negotiations and alliances
    are perhaps becoming ‘part of the normal ways that media operates’ (246).


    The particular strength of Jenkins’ analysis is that it foregrounds the dynamic
    relationships between media consumers and media industries that define participatory
    culture. But is his work still open to the criticisms levelled by Hills that it
    overly valorizes the productive activity of media consumers? This becomes clearer
    perhaps in recent work that picks up from Jenkins’s work such as Bruns’s (2008)
    idea of produsage. In an exemplary study that canvasses the increasing role of
    users and consumers in making and creating media content, from open source software
    development, news blogging and Wikipedia, through to Flickr, YouTube and the videogames
    industry, Bruns argues that the very term production is itself a problem as it
    locks us into industrial model understandings of production. What he describes
    as ‘produsage’ so thoroughly involves and integrates users in the process of making
    content in their own right that it exceeds and fundamentally breaks from industrial
    modes of organizing production. But in the effort to foreground this productive
    agency of media users and consumers does Bruns perhaps too quickly overlook that
    much of this activity still predominantly occurs through commercially owned and
    produced platforms and tools. Furthermore, media professionals remain central
    to creating and making the various media products and practices that he discusses.


    The level of abstraction of a concept such as produsage, while its very strength,
    perhaps overly abstracts it from the very relationships and media production practices,
    which make many of the activities possible in the first place. It also postulates
    production as something of a static form rather than itself a complex and evolving
    set of relationships that are not necessarily and finally defined by a particular
    form of industrial fordist organization. Bruns is describing an evolving *production–consumption*
    relationship and perhaps too quickly rejects categories such as producer, consumer
    and user as unhelpful and outmoded, commenting ‘the role of “consumer” and even
    that of ”end user” have long disappeared, and the distinction between producers
    and users of content have faded into comparative insignificance’ (2). When Bruns
    analyses the videogames industry as an ‘outright facilitator of these processes’
    (289), briefly referring to *The Sims* and touching upon Auran’s *Trainz*, he
    acknowledges this somewhat problematic as these are commercial products and platforms
    in which the ‘producers’ making the content are also'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'consumers purchasing the game software. Professional game developers and the
    work they do also figure prominently in the practices that Bruns describes. The
    very generality of the concept of produsage starts to get in the way of describing
    and analysing the precise characteristics of these changing production and consumption
    relationships as they emerge and are negotiated across different media industry
    sectors. There is no sense, for example, that the specificities of the videogames
    industry may require us to revisit the idea of produsage for some fine-tuning
    – it provides another example to illustrate the general principles detailed in
    the book''s second chapter. But that said general principles are important and
    in the concluding chapter I will offer some general principles about these emerging
    modes of cultural production myself. However, I hope that productive tensions
    will remain among the empirical detail of the ethnographic case studies and the
    proposed principles.


    We need closer and more detailed accounts of how these co-creative relations work
    and of how they are negotiated in creative industries workplaces. Important studies
    such as Thomas M. Malaby''s (2009) *Making Virtual Worlds: Linden Lab and Second
    Life* point us in this direction by offering a richly textured ethnographic account
    of how the employees of Linden Lab grappled with the challenges and complex processes
    of making virtual worlds such as Second Life. I am offering these observations,
    however, not to reject either Bruns''s or Jenkins''s foregrounding of consumers''
    increasing role in making and circulating media content and experiences – this
    is certainly fundamental to the idea of co-creativity. But my starting point with
    the idea of co-creativity is not in such a rush to leave behind categories such
    as production and consumption; it is rooted in the uncertainties and controversies
    about how these emerging cultural and economic relations are made. Malaby''s account
    of Linden Labs is significant precisely because it foregrounds the Linden designers''
    uncertainties as they attempt to craft a virtual world that at its core and in
    its very usability sought to encourage users to creatively make the world of Second
    Life. Malaby describes this as a ''contrived architecture'' (8) in which the somewhat
    top-down design intentions and goals of the Linden staff meet and collide with
    the often-unanticipated practices of the users. As Malaby notes, ''Second Life
    depends on unanticipated uses by its consumers'' (8). However, as he describes
    so well, the efforts of Linden designers to control or direct user practices often
    have quite complex and unintended consequences. Malaby''s ethnography then is
    an account of what this user co-creation activity means not simply for the users
    themselves, the participatory culture and produsage emphasis of Jenkins''s and
    Bruns''s work, ''but for the increasing number of such architectures of digital
    environs, all of whom may be charting a new way to design this open-endedness''
    (8). He carefully foregrounds the craft skills and practices of the professional
    Linden Lab employees in making these worlds and rigorously describes their diverse
    understandings of these emerging practices.'
