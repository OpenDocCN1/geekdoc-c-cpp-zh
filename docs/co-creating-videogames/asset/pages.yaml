    also enables a reproduction that involves variability and customizability. The
    same PC hardware technologies and software tools that are used to make and produce
    these objects are also employed in their consumption and use. This use often involves
    variation and customizing. Manovich suggests that this is enabled by the modularity
    of new media objects. He describes this as the ‘fractal structure of new media’
    (30)9 and suggests that this logic follows or expresses post-industrial logics
    of ‘just in time’ and ‘production on demand’ modes of production and distribution
    that value individuality and customization (36; also see 41–2).10 He refers to
    computer games as providing a strong example of this trend (120).


    Manovich observes that these new media objects indicate a shift in the production
    process which makes end users feel that they are not just consumers but participants
