    ‘A crucial assumption underwriting these persistent boundaries is the premise
    that technical expertise is not only a necessary, but is the sufficient form of
    knowledge for the production of new technologies.’ I would add here the increasing
    status of design expertise. Developers and designers will not share control over
    technology and game design easily. As Suchman observes, the socio-material connections
    and working relationships that sustain these networks are often invisible in discussions
    of participatory culture and design. Suchman (2000b: 2) unsettles and reworks
    understandings of technology design and production as involving discrete objects
    shaped by a designer/user opposition. These oppositions close off the possibility
    of recognizing that networks of working relations ‘including both contests and
    alliances . . . make technical systems possible’. Co-creativity reworks and questions
    these oppositions and boundaries. But ‘reconstructing relations of technology
    production and use to acknowledge this reality is an enormously difficult task.
    The boundaries that currently define professional practice are realized through
    institutionalized arrangements crafted precisely to their reproduction’ (3). Suchman
    argues that such a reworking requires a problematization of the designer/user
    opposition, and making social relations that disrupt and cross the boundaries
    between them.


    Across the *Trainz* and *Fury* projects we see an increasing disjuncture between
    the ambitions and intent of Auran management to harness player co-creative activity
    around their products and an oversight about the organizational remaking and transformations
    needed to understand and support co-creative practice. Gaps and tensions increasingly
    emerged across the firm about the relationship between professional design practice
