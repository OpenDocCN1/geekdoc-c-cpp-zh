  md: 'consumerly non-fans. As a remedy, he proposes an approach grounded in a factual
    basis that offers a ‘more complex and less celebratory model of fandom’ (9).¹
    Hills encourages us to articulate a more complex understanding of the relationships
    between fandom, corporate commercial culture and academic research. He argues,
    for example, that Jenkins’s version of fandom is designed to ‘act upon particular
    academic and institutional spaces and agendas’ (10). Jenkins’s fan is not a cultural
    object to be understood and represented. Rather, it is modified into a ‘shape
    which will allow it to act on the academic community’. Here the fan functions
    as a screen against which the political values of the cultural studies academic
    are projected (10–11).² Hills then poses the troubling question: what happens
    to these notions of the fan that have tended to dominate cultural studies research
    such as Jenkins’s ‘when fan cultures are themselves directly targeted as a niche
    market’ (27)?


    These criticisms of cultural studies work on fandom and the active audience thesis
    are not particularly new. Nor is the observation that fandom offers a tempting
    niche market for corporations (Ang 1996: 10–11; Nightingale 1996: 95–100, 126–30).
    Hills adds the concern that such an understanding of fandom also relies on an
    assumed separation between producers and consumers. Producers own the apparatus
    of production while consumers poach on the production space by appropriating the
    end products. He questions this reliance on de Certeau’s work, observing that
    ‘it seems too rigid to deal helpfully with any blurring of consumer and consumer-as-producer
    identities. It effectively cannot come to terms with the possibility that consumers
    can actively seek and adopt strategic positions in the official, production space’
    (39). Here Hills brings to our attention the fact that the conditions through
    which fandom is shaped are in the process of a significant transformation. We
    see this playing out in my initial research with Auran. Jenkins’s work has also
    moved on from the *Textual Poachers* position to grapple with the implications
    of these changes for his understanding of participatory culture.


    In ‘Interactive audiences’ (2002) Jenkins takes up the work of Pierre Lévy to
    think through the transformed relations among interactive audiences and media
    industries. Lévy argues that, in economic terms, ‘the production of added value
    is shifted to the consumer or, rather, the notion of consumption should be replaced
    by that of the coproduction of merchandise or interactive services’ (80–1). For
    Lévy, these trends indicate ‘the emergence of a qualitatively different transaction
    space in which the roles of consumer and producer are undergoing profound change’
    (78).


    In *Convergence Culture* (2006) Jenkins develops an understanding of these changes
    in participatory culture that avoids an oppositional logic that sees consumers
    as either resisting or co-opted by the media industries. He unsettles such either/or
    logics – refusing to see media consumers as either totally autonomous from or
    totally vulnerable to the creative industries. Instead,'
