    As companies seek to engage consumers as active co-creative participants, this
    in turn transforms consumers’ expectations of how companies will participate and
    the terms and conditions of that participation. As consumers accept and act on
    these invitations they now demand levels of engagement, collaboration and participation
    that many companies are not comfortable with, or have not yet adapted appropriate
    business models with which to successfully engage.


    # ## Accounting for co-creative value


    We have seen in comments throughout this book that many game developers acknowledge
    the value they gain from this co-creative ecology and, more importantly, demonstrate
    a growing sense that they are accountable for this exchange. Lucy Bradshaw for
    example commented in my discussions and interviews with her on what it might mean
    to ‘respect’ this contribution made by the players. This awareness is also prominent
    in my concluding interview with Will Wright. But what does such accountability
    mean and how should companies such as Auran and Maxis be held accountable for
    their relationships with the player communities?


