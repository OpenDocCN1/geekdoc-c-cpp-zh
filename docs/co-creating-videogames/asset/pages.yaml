  md: 'corporations and their player user-base, then do current intellectual property
    regimes and contractual arrangements provide a useful or equitable framework within
    which to understand and manage these relationships?


    These relationships are currently formally governed and regulated largely through
    private contract law arrangements such as End User Licence Agreements (EULAs)
    and Terms of Service Agreements that are overwhelmingly drafted to protect the
    interests and minimize the developers’ and publishers’ exposure to risk. I am
    here heading in the direction of important governance and regulatory questions
    that are beyond the scope of this book (Humphreys 2005b, 2008, 2009; Suzor 2009,
    2010). As a starting point, I suggest that accountability in this context would,
    as a minimum, require the developers and publishers to revisit current contractual
    and intellectual property instruments as well as their governance procedures and
    practices to ensure they more fairly and transparently recognize the nature of
    the co-creative relationship and the value these enterprises derive from the relationship.
    For example, Terms of Service agreements that simply stipulate publishers and
    platform owners can at their sole and absolute discretion exclude or remove users
    are just not good enough.


    A pressing problem in all of this, as Stark (2009: 202–3) argues, is that these
    networked organizations and co-creative media practices generate new kinds of
    value-creating relationships and therefore new kinds of problems and dilemmas.
    And a central problem here is one of accountability. If the unit of action or
    agency is not the choosing individual or the firm but the network, then what does
    it mean to suggest that the network is in some sense accountable? As Beinhocker
    (2006: 267) suggests, it is all well and good to extol the benefits of non-zero
    sum games,


    But for people to have an incentive to cooperate, they must receive some share
    of the spoils. How the gains of cooperation are divided up is therefore a crucial
    question. If the rewards are distributed in the wrong way, then cooperation collapses
    and the non-zero sum gains evaporate.


    Here we are back with Benkler’s question of ‘how do you make this damn thing work’.
    We are experimenting with new ways of organizing and coordinating ourselves to
    create and share value, including knowledge. We are learning how to do this at
    rapidly growing scales that blur organizational boundaries and transform the established
    identities of both media professionals and consumers. This is at the heart of
    Benkler’s work as well as central to the popular musings of Clay Shirky (2008,
    2010). And I do not mean popular to be dismissive. Writers such as Shirky often
    identify and describe this rapidly changing landscape more astutely than do many
    academic researchers and critics. Shirky contributes thinking tools that arguably
    shape how media'
