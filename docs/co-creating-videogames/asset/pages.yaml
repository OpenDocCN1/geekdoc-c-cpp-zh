    # # Co-creating *Trainz*


    # ## From ethnographer to online community relations manager


    My research with Auran became a dialogue about how to create and manage relationships
    with online gamer fans. At a meeting in June 2000 Lane challenged me: ''It is
    one thing to study these things, how about actually applying these ideas and seeing
    how they work out in practice.'' I accepted a position as online community manager
    and commenced working at Auran on a part-time basis; a few months later this became
    a full-time job.


    Managing fan community relations is now an integral part of games development
    companies'' innovation, product development and marketing practices. Gamers increasingly
    expect and demand that developers will not only listen to their views, but also
    enter into active dialogue with them. Developers like Auran and Maxis actively
    solicit feedback from consumers and audiences.


    What are the implications of taking up the community manager position at Auran
    and participating actively in the making and management of a gamer fan community,
    and being paid for it? Does this irredeemably compromise the research with a sell-out
    to commercial imperatives and objectives? At best this is a case of the ethnographer
    going native and at worst a commercial takeover of academic research? As Auran''s
    online community relations manager, I was directly involved in the process of
    making a commercially exploitable fan community (Nightingale 1996: 124).


    Ethnographic research methodologies are increasingly taken up by commercial enterprises
    as a tool for understanding and accessing customer and user culture. In ''Anthropology
    as "Brand": Reflections on corporate anthropology'', Lucy Suchman (an anthropologist
    who spent many years working as a researcher with the Xerox PARC corporation)
    examines this'
