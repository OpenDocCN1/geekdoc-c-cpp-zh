  md: 'The methodological problem then does not only involve how ethnographic objects
    are constructed as objects of knowledge, but also how they relate to and intervene
    in other versions of the networks and objects that are being studied. But, in
    making this point, it is also important to maintain the ANT understanding that
    the ontology of these objects is variable and multiple. Mediators such as SAGE
    are far from singular or settled; these quasi-objects ‘are’ collective because
    they attach us to one another, because they circulate in our hands and define
    our social bond by their very circulation. They are discursive, however; they
    are narrated, historical, passionate, and peopled with actants of autonomous forms’
    (89).


    John Law and Annemarie Mol have pursued the implications and potential of this
    thinking about variable ontologies to question the network logics and metaphors
    of ANT. In *The Body Multiple: Ontology in Medical Practice* Mol (2002) argues
    that her ethnography of medical practices surrounding the disease atherosclerosis
    is not a study of how ‘medicine knows its objects’ (vii), but rather concerns
    how medicine enacts realities. These objects are multiple and need to be coordinated
    (vii–viii). She carefully describes how atherosclerosis is enacted through the
    patient-doctor interview, through the technical practices and diagnostic tools
    in a vascular laboratory, and in the practices of radiologists and pathologists,
    as well as in the work of vascular surgeons and the materiality of a haematologist’s
    research laboratory. By drawing on interviews with the medical practitioners,
