  md: 'contributing to the open, peer sharing of content and ideas, then shifted towards
    more entrepreneurial practice. What initially started out as non-monetary practice
    sometimes developed into market behaviours or hybrid mixes of the two. What may
    initially be socially motivated behaviours, may well turn out to be also smart
    investments in potential and emerging markets. As these ''non-market'' social
    networks interact and co-evolve with ''market'' contexts, they may give rise to
    potential for-profit businesses in their own right, as well as instrumentally
    shaping the creation and development of markets themselves (see Malaby 2006).
    Participation in these co-creative networks may also be a future investment in
    developing skills, competencies and literacies to participate in these emerging
    markets. These skills and competencies may well eventually be traded for commercial
    outcomes – including jobs. Operating in conditions of significant uncertainty
    and from a diverse range of motivations actors are seeking opportunities to generate
    value. What the terms of exchange are, precisely what is being exchanged and what
    the regulating institutions and norms may be are still being worked through. This
    is not a static or closed situation in which we can clearly and precisely define
    what are market or non-market practices and behaviours. These practices are not
    simply being incorporated into existing stable market institutions but are potentially
    redefining what a market is and how it operates in relation to social networks.


    In ''The entrepreneurial vlogger'' (2009b) Jean Burgess and Joshua Green, for
    example, offer a compelling analysis of the practices of YouTube Vloggers as ''symptomatic
    of a changing media environment, but it is one where the practices and identities
    associated with cultural production and consumption, commercial and non-commercial
    enterprise, and professionalism and amateurism, interact and converge in new ways''.
    They argue that YouTube is disruptive as a co-creative culture ''because it is
    the site of dynamic and emergent relations between market and non-market, social
    and economic activity''. In conclusion they suggest that we should not separate
    or oppose the amateur and entrepreneurial uses of YouTube as they are ''coexistent
    and coevolving''.


    # ## Explaining co-creation: Markets or culture?


    Co-creation poses various analytic challenges. Most obviously is the question
    of motivations to participate in such relationships, both by consumer co-creators
    and businesses, and the specific nature of the costs and benefits that accrue
    to each. As we have seen, there are two fairly distinct lines of recent analysis:
    either (1) viewing consumer co-creation as an extension of market exchange, and
    thus a product of incentives associated with existing institutions; or'
  merge: -1
  img_proc: true
- pgno: 161
  md: '(2) viewing consumer co-creation as the emergence of a new non-market model
    of production centred about socio-cultural explanations, such as altruistic and
    other-regarding preferences (Benkler 2006, 2011a, 2011b).


    The first, broadly associated with economic explanations, centres about recognition
    that consumer co-creation is a voluntary (rational, incentivized and non-coercive)
    exchange. It is therefore axiomatic that both sides benefit, else the exchange
    would not take place (Johnson 2002; Lerner and Tirole 2002; Llanes 2007; Boldrin
    and Levine 2008). Labour signalling and learning-by-doing are presumed to be behind
    otherwise seemingly altruistic motivations (Lee et al. 2003; Mustonen 2003). This
    economic perspective emphasizes consumer co-creation not so much as a production
    relation, but as a voluntary exchange relation with often complex and subtle incentives
    and forms. These extend beyond labour and goods markets to include a more complex
    exchange of less tangible and fungible ‘goods’, such as reputation, opportunity,
    learning, recommendation and access (Lahnam 2006). These in turn involve future
    labour markets and options over intellectual property that create additional incentives
    that mostly operate in ‘shadow markets’, such as markets for reputation, that
    may only be monetized indirectly, if at all, and are difficult to observe. For
    example, Alex Weekes did not set out to monetize his fandom; rather, that just
    happened. And the skills he gained in establishing and coordinating fan networks
    were not a deliberate strategy of human capital investment. It just turned out
    that way. But it is precisely such unintended outcomes from trial-and-error experimentation
    that you would expect in these contexts characterized by profound uncertainty.
    That they are unplanned does not mean that they are inconsequential. This ‘shadow
    market’ aspect is easily and often confused with non-market motivations and context.


    Although these two perspectives arrive at very different analytic frameworks and
    thus explanatory mechanisms of consumer co-creation, they both hew to an exclusivist
    line of analysis: either consumer co-creation can be understood as a market-based
    exchange activity governed by extrinsic incentives, or it can be understood as
    a non-market cultural production governed by intrinsic incentives. It is implicit
    that only one of these explanations can be correct. Yet that does not fit the
    facts as outlined in this ethnographic research. A central finding was that complex
    motivations were often at work over multiple markets. These behaviours I describe
    as co-creative do not neatly fit a single, narrowly defined model of human behaviour.
    As Ostrom’s work suggests, we need multiple models of human behaviour. Alex, for
    example, was able to monetize his contributions in secondary markets. This tends
    to point toward the market-based economic explanation. At the same time, there
    is considerable conflict between norms, expectations and institutions, all of
    which imply that cultural factors and emergent institutions also matter. As we'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'have seen throughout this study it would also be a mistake to assume that the
    participants (*both* amateurs and professionals) are acting primarily from commercial
    incentives. Of course intrinsic incentives and other-regarding preferences are
    prominent and often clash and contend with commercial imperatives. We do not deny
    this.


    We therefore need an explanatory model of co-creation that seeks to integrate
    *both* market exchange explanations and cultural production explanations at once.
    But this framework does not simply add these explanations together, *mutatis mutandis*,
    but rather reframes *both* into a more general co-evolutionary analytic model
    in which economic and cultural factors are conceptualized in dynamic open relationship:
    each effects the other such that consumer co-creation emerges as an evolved process
    in respect of practices, identities, social norms, business models and institutions
    of *both* market-based extrinsically motivated exchange relations and culturally
    shaped intrinsically motivated production relations.


    # ## Co-evolving markets and culture


    A co-evolutionary model of consumer co-creation is neither an economic analysis
    nor a cultural analysis per se, but employs both modes of explanation to account
    for the *dynamics* of consumer co-creation. This will then occur over multiple
    dimensions that include market outcomes, practice and identity, institutions,
    and so on. The central aspect of such a co-evolutionary analysis is that cultural
    factors identity conceptions, received practices, the symbolic) affect the space
    of economic outcomes, and at the same time economic factors (implicit contracts,
    incentives, markets and business models) affect the space of cultural outcomes.
    This then sets up a dynamic *co-evolutionary process*, in which change in one
    affects the conditions of the other, which then adapts, in turn inducing a change
    that affects the other, causing it to adapt, and so on. The point is that this
    approach shifts the core of explanatory analysis to the study of the interactions
    between the economic and cultural domains and the nature of those interactions.


    This leads to somewhat different perspectives that override the notion that consumer
    co-creation is fundamentally an exchange relation or a production context: *either*
    a market or a non-market context. Instead, both may be occurring simultaneously
    with analysis then focused on how they mutually affect and continuously transform
    each other. Further more, conceiving consumer co-creation in terms of social network
    markets also avoids assigning behaviour as *either* intrinsic socially motivated
    or extrinsic economically motivated, but instead allows a complex interaction
    between the two motivations and domains (Johnson 2002; Lanham 2006).'
