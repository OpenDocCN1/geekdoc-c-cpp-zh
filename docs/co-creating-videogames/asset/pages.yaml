  md: '# # 1


    # # Situating co-creativity


    # ## Auran and Dark Reign


    I was made aware of Auran in mid-1997 by gamer fans forming around *Dark Reign*,
    a then forthcoming real-time strategy (RTS) game co-produced by Auran and leading
    videogames publisher Activision, and published in September 1997 by Activision.
    The fans were in the process of establishing websites focusing on the game that
    included preview content, news and descriptions of game features; they were enthusiastic
    about the level of Auran’s involvement with the online fan community. Auran was
    heavily promoting the fact that the game would include user-friendly editing tools,
    enabling players to create and share add-on maps. Auran had also committed to
    releasing an extensive user guide or manual, available for download from its website,
    providing detailed information about how to modify various game features.


    Auran was experimenting with various methods of establishing and maintaining relations
    with the *Dark Reign* fans. Part of this effort included both Auran and Activision
    staff participating in a weekly Internet Relay Chat (IRC) meeting on the ‘*Dark
    Reign*’ channel. In these sessions, organized by a key figure in the fan community,
    programmers and designers would answer questions and discuss game features. Now,
    these discussions were obviously a promotional and marketing vehicle – it was
    a way of generating interest in the game. In discussions with me, gamers indicated
    that they were well aware that this strategy was part of the ‘ramp-up-to-release
    hype’. But they were also encouraged by Auran’s participation: they believed or
    hoped that the game developers were listening to them, and that their ideas might
    perhaps even influence game design decisions. The company impressed fans at the
    time with its willingness to enter into open-ended exchanges about the forthcoming
    *Dark Reign*. Since then, hard-core gamers participating in the online communities
    have increasingly come to expect that game'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'development companies will now actively listen to, engage with and support
    the fan groups that form around game titles. Fans expect to be increasingly involved
    in the game production process. In short, they expect a collaborative and co-creative
    relationship.


    Auran''s effort back in 1997 to build closer relationships with the fans can be
    viewed as a canny strategy adopted by an emerging small-to-medium enterprise developer
    as it attempted to increase its profile in the global game marketplace. This peer-to-peer
    marketing initiative certainly raised Auran''s profile among the hard-core gamers
    of the online RTS fan community.


    With all of this in mind I approached Auran and negotiated an opportunity to visit
    them and research the relationships they were exploring with online fan communities.
    At my first visit to Auran''s inner-city Brisbane office in mid-1997 I recall
    noticing a cluttered open-plan layout. Auran was obviously quickly outgrowing
    its office space, as workstations were crammed together. In this initial meeting
    Auran''s CEO, Greg Lane, was summing up an effort to decide whether to provide
    me with access to Auran and on what terms. I was nervous and Lane made an effort
    to put me at ease by discussing our common background as gamers. We discovered
    that we shared a boyhood hobby of playing board war games and the role-playing
    game *Dungeons and Dragons*. Lane had been very active in the Brisbane role-playing
    scene and had organized a large role-playing club in the mid-1980s. He pointed
    out that it was this involvement with role playing and gaming generally that provided
    him with an appreciation of the value and importance of fans.


    The Auran development team had just returned from a trip to the United States
    where they had worked for a number of weeks with the Activision team, *Dark Reign*''s
    publisher, putting the final touches on the game. *Dark Reign* was approximately
    six weeks from release.


    It seemed to me that the discussion was going well, as Lane discussed *Dark Reign*
    and Auran in a reasonably open way. Lane then said: ''I guess you''d like to see
    the game''. He demonstrated various features that were standard in the RTS genre
    and a few new functions, then said: ''But I think this is probably one of the
    coolest things about *Dark Reign*''. He switched to the editing tools package
    and demonstrated how easy it would be for gamers to create new maps and modify
    various parameters. He spent a lot of time showing me how the game could be extended
    and modified – how the editor toolset could be used as a paint program to create
    new maps, and how players could access configuration scripts to change or modify
    various variables (including AI routines). He commented:


    > From the start of the project, developing the Tactics Engine [the games engine
    used to develop the *Dark Reign* design], we''ve wanted it to be as extensible
    and customisable as possible. The idea and importance of'
