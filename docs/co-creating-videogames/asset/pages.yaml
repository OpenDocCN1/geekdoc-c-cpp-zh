- pgno: 211
  md: '# Co-creating Videogames


    > > ''In the realm of game scholarship, John Banks'' Co-Creating Videogames is
    that rare combination of significant access to the sites of videogame production
    and astute analysis that resists easy answers. His account of co-creative digital
    production shows how creativity, uncertainty, and value combine in the new economies
    (in the broad sense) that videogames have ushered onto the cultural landscape.
    A crucial contribution is his willingness to recognize the top-down elements of
    contrivance and design that inevitably shape the seemingly ''bottom-up'' dynamics
    of digital cultural production. This book belongs on the bookshelves of anyone
    interested or invested in cultural production in the digital age.''

    > >

    > > Thomas Malaby, Professor and Chair of Anthropology, University of Wisconsin-Milwaukee,
    USA


    > > ''John Banks'' Co-creating Videogames provides a thorough and nuanced theory
    of production in the maturing Web 2.0 era. Based on original ethnographic research,
    Banks convincingly shows how video production these days is the outcome of an
    evolutionary process between economic and cultural, commercial and non-commercial
    factors. A far cry from the bifurcated theories in the early years of Web 2.0
    culture, Banks'' model is neither a euphoric celebration nor an ideological detraction,
    but a balanced academic study of how various actors are simultaneously shaping
    co-creativity. It''s a must read for every scholar and student specializing in
    games and digital culture.''

    > >

    > > Jose van Dijck, Professor of Comparative Media Studies, University of Amsterdam,
    The Netherlands


    > > ''This book is a must read for anyone interested in co-creative culture, one
    of the most important aspects of gaming and network life. Banks'' nuanced and
    insightful treatment of the emerging relations between players and developers
    as they jointly produce our gaming spaces is an incredibly valuable contribution.
    Drawing on his rich ethnographic work, he pushes beyond simplistic models and
    takes us into the heart of fan practices, development processes, and new forms
    of creative production.''

    > >

    > > T.L. Taylor, Associate Professor, Massachusetts Institute of Technology, USA


    Co-creativity has become a significant cultural and economic phenomenon. Media
    consumers have become media producers. This book offers a rich description and
    analysis of the emerging participatory, co-creative relationships within the videogames
    industry. Banks discusses the challenges of incorporating these co-creative relationships
    into the development process. Drawing on a decade of research within the industry,
    the book gives us valuable insight into the continually changing and growing world
    of video games.


    John Banks is Senior Lecturer in the Creative Industries Faculty at Queensland
    University of Technology, Australia. He has also worked in the videogames industry
    and has published widely from research grounded in this industry background.


