  md: 'We are not seeking here to make a banal point about the success of a bottom-up,
    consumer-driven viral marketing campaign. Rather, our point is to foreground how
    players are learning from each other. The YouTube clips are not significant just
    because of the creativity or otherwise of their content, as for example the creativity
    involved in terraforming a *Minecraft* environment into the USS Enterprise or
    Hogwarts Castle. What’s really significant is that players are imitating and copying
    and adapting behaviours about how to learn and how to collaborate through and
    in online networks. This is also the evolutionary, adaptive, social-learning mechanism
    through which the solutions that Benkler is searching for might emerge. The problem
    is this kind of evolutionary search mechanism is not necessarily ‘efficient’,
    in Benkler’s terminology, although it may be effective, as we find solutions through
    adaptive trial-and-error processes that are often characterized by failures (Harford
    2011). You can learn this quite quickly by playing games like *Minecraft*; a lot
    of my crafting experiments have been agent failures. But it is by experimental
    play with and through these failures that I figure out better solutions to the
    design challenges of the *Minecraft* environment. But even more helpfully, I search
    and find some of these adaptive possibilities by following and learning from what
    others are doing and have already discovered. *Minecraft* is a massively scaled,
    distributed, social-learning sandpit. In fact the solution to Benkler’s question,
    ‘how do we make this damn thing work’, may well be by tolerating if not embracing
    a certain kind of ‘inefficiency’ that is needed to foster these trial-and-error
    adaptive experiments. We may need to just try out lots of things and combinations
    of things to figure out what works: precisely the kind of learning habits and
    competencies that the *Minecraft* gamers are exploring through their choices and
    behaviours. So co-creative culture is a massively distributed search process for
    exploring precisely the kinds of challenges and dilemmas that Benkler’s question,
    ‘how do you make this damn thing work?’ poses? We co-create and co-craft the solutions.


    # Entrepreneurial co-creativity


    The attention-seeking competitive and collaborative action that we see in games
    such as *Trainz*, *Spore* and *Minecraft* can be characterized as a type of consumer
    entrepreneurialism in that it is both creative and destructive. It creates knowledge,
    but these distributed networks of both professional and non-professional expertise
    also disrupt industrial-era modes of controlling and organizing cultural production.
    This entrepreneurialism introduces growth, dynamism and change, and this focus
    on the agency exercised by creative consumer-citizens requires us to analytically
    grapple with the processes'
