  md: '# # 5


    # # Co-creative expertise


    # ## Distributing expertise


    Co-creativity requires distributed networks of amateurs and professionals, experts
    and non-experts. Creativity and innovation are attributable not just to professional
    developers alone, but also to the distributed expertise and co-creative practices
    of socially networked citizen-consumers. We saw this distributed expertise at
    work as the *Trainz* fans brought steam locomotives to the game. This re-engineering
    of producer-consumer relations unsettles the paradigm of professional expertise
    and the associated claims to authority and control that have dominated the organization
    of media production throughout the industrial era (Weinberger 2007, 2011; Hartley
    2009). A July 2008 report from NESTA, *The New Inventors*, acknowledges that users
    are changing the rules of innovation process as they increasingly participate
    in the development of new and improved products and services. Recognizing that
    user-led innovation creates significant commercial value, the report also acknowledges
    that this activity challenges and disrupts the boundaries and controls of traditional
    innovation and R&D processes.


    By blurring the professional-amateur divide these transformations foreground the
    increasingly interdependent relationships between professional media producers
    and users (Jenkins 2006: 50–8; Bruns 2008: 214–19; Hartley 2009: 131–5). In the
    previous chapter I argued, however, that it is not all that helpful to approach
    these co-creative relations as necessarily involving media companies exploiting
    the free labour of consumers. Nevertheless, consumer participation is increasingly
    part of creative professionals'' every day work environment. As we have seen in
    the case of the *Trainz* project, demanding and unruly user co-creators unsettle
    professional developers'' work practices and routines. The very identities of
    professional media workers are therefore at stake in these co-creative media networks
    (Deuze 2007, 2009). Co-creative'
