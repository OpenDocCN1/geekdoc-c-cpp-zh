  md: 'These choosing relationships and behaviours are also increasingly externalized;
    they are configured through the devices and materials constituting these networks
    and therefore framing incentives as intrinsic or choice as individual becomes
    somewhat problematic. To pursue the implications of the social network market
    model, our ideas of the choosing individual need to shift toward a more externalized
    and distributed understanding of cognition (Stark 2009: 203–3, 164, 187; Hermann-Pillath
    2010). Drawing on the work of Edward Hutchins (1995), Latour (2005: 211) argues:
    ‘Cognitive abilities do not reside in “you” but are distributed throughout the
    formatted setting, which is not only made of localizers but also of many competence-building
    propositions, of many small intellectual technologies.’ This then starts to unsettle
    somewhat the idea of the individual agent that subtends Pott et al.’s original
    statement of the social network market idea; possibly in a rather different direction
    than the authors envisaged. The identity of the choosing agent and the nature
    of that identity are very much at stake in exploring the implications of a social
    network market approach. In fact, as David Stark (2009: 164–5) notes, such distributed
    cognition approaches unsettle ideas of choice because the kinds of ‘practical
    action’ exercised and enabled through these networks are difficult to reduce to
    individual choice.


    Consumer co-creator agents can seek both economic opportunity and the social status
    and intrinsic rewards earned from participation in social networks as sophisticated
    navigators of the motivation spectrum of Lanham’s (2006) ‘attention economy’.
    Lanham (2006) argues that in the terrain of the ‘attention economy’, consumers
    now oscillate between the economic and the symbolic/cultural. Thus, far from being
    incommensurate and non-fungible, creative citizen-consumers now transact across
    these motivation and incentive domains, giving rise to new institutional forms
    about which both cultural and economic institutions then re-coordinate. This proposition
    though does not rule out continuing tensions and conflicts between these evaluative
    domains or even uncertainty about how these domains relate. We have seen these
