  md: 'trend of corporate anthropology, suggesting that it involves anthropology''s
    taking on the form of a commodity or brand as anthropologists are employed by
    corporations and engage with the ''worlds of commercial development, research,
    marketing and public relations'' (2000: 2-3). She argues that such anthropologists
    come to take on a role or identity as ''proxy'' for customers and users within
    the corporate workplace (2000: 4) – as indeed I did as an ethnographer within
    Auran. Suchman comments that these roles provide a unique intervention ''inside
    the engine rooms of early 21st century capitalism'', but also raise the challenge
    of how we should occupy such positions. The anthropologist participates in discovering
    and observing consumer experience that is then addressed by corporate design and
    marketing, but also simultaneously contributes to constituting consumer experience
    ''through activities of design and marketing''. I agree with Suchman that these
    tensions are irresolvable and are the conditions for undertaking such a research
