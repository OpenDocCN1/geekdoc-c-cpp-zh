    becomes apparent that you can terraform and craft the world to create quite elaborate
    structures. When you start out, the world has no artificial structures. But after
    many hours of making and constructing, you may have created elaborate castles
    or intricate below-ground mine complexes, complete with mine-cart systems for
    moving mined minerals.


    Players figure out how to go about crafting in Minecraft by observing, imitating
    and learning from each other because some players are recording their Minecraft
    play sessions as a series of tutorial guides that explain how to survive in the
    Minecraft world, how to craft various tools, and how to get started with making
    various structures. The best and most popular of these, such as Halnicholas''s
    ''Building mega-objects in Minecraft,'' describe how to use its various capabilities
    ingeniously to make a replica of Star Trek''s USS Enterprise. The point here is
    not to celebrate the individual creative genius of a player such as Halnicholas
    (although it can certainly be admitted). The social-learning argument is not simply
    that these Minecraft players are learning from each other through YouTube videos.
    That is obvious. The point is how they are learning to learn.


    Tutorial series such as davidr64yt''s ''Adventures in Minecraft,''^3 function
    as an entertaining videoblog journal of how he learnt to play. Episodes share
    with viewers various crafting opportunities and skills that he has discovered,
