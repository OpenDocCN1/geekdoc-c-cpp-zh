    in the United States, United Kingdom and Australia, but they would not be prototypical
    of particular routes.


    Each post made by Vern over this period was carefully scrutinized and discussed
    by Auran management and raised in regular *Trainz* team meetings. Field notes
    I made include entries covering concerns raised by Auran’s marketing manager about
    how representative forum posts were of our target market for *Trainz*. As she
    put it: ‘Are we overreacting to a hard-core here?’ There was considerable uncertainty
    surrounding how we should engage with these community views. To what extent should
    they influence the actual *Trainz* design and production process? How should this
    user involvement be integrated with the development and production process? My
    notes record a heated exchange with members of the development team who argued
    this ‘community stuff’ was marketing and web team, and shouldn’t be allowed to
    impact significantly on the project schedule or features. However, I also noted
    that, in team meetings, forum posts made by fans would be raised from time to
    time in support of a particular feature change or addition that the developers
    themselves wanted to make. There certainly was not a single Auran position on
    how influential suggestions from fans should be on the actual design and project
    direction.


    The role of the rapidly growing and demanding fan community was becoming a topic
    of controversy at Auran. The web team had a vested interest in supporting the
    value of fan involvement, and was under increasing pressure to ensure that the
    website traffic was continually increasing. The team argued that it needed regular
    preview content releases in order to generate traffic. The forthcoming launch
    of the *Trainz* website would attract a rise, but in order to maintain traffic
    levels and expand the fan community they would also need to regularly release
    preview content. Lane also actively supported the importance of online community
    development for the success of *Trainz*. Members of the development team, on the
    other hand, considered it to be more of a marketing initiative that got in the
    way of their job of making *Trainz*. As the senior producer commented to me, ‘This
    is all a distraction really, it can get in the way of developing the game’.'
