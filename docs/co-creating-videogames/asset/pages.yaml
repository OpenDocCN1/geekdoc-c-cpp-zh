  md: 'The content creators’ views on Auran’s plans were varied: there was no singular
    Trainz fan position on these issues. For many, these creative activities emerge
    from their shared passion for trains and rail; for others it concerns the satisfaction
    derived from carefully crafting a detailed model, or the social status gained
    within the Trainz community for freely sharing their creations. For some, it also
    offers a pathway into paid employment as we have seen with Rob Shaw. In some instances,
    this productive activity is freely given. Others pursue the commercial opportunities
    that are available for their creative endeavors. The intersection of these diverse
    practices and interests that constitutes co-creative culture generates conflict
    and tensions concerning how the rights to material are to be negotiated and who
    should have access to information and support. Auran’s ultimate concern is profitable
    business outcomes, and this means production processes that are carefully managed.
    Many of the fan content creators, on the other hand are motivated by their passionate
    investment in trains and rail and by the social rewards that are associated with
    their position as high-profile creators in the fan community. The ways in which
    these different practices and understandings come together are uneven and even
    conflictual. The Auran Trainz team itself was far from united in its understanding
    of this collaborative production process. Producers, programmers, artists, community
    development managers and CEOs often have very different understandings of how
    the relationships should be managed. The fact that the work of the fan creators
    on the Trainz Railroad Simulator 2004 project did not entirely mesh with Auran’s
    project schedule points to how these user-creators can be unruly and guided by
    their own interests and agendas. But it is from these uneven and messy practices
    that co-creative culture is being made.


    > Bruno Latour (2005: 11–12) reminds us that in situations of controversy ‘where
    innovations proliferate, where group boundaries are uncertain, when the range
    of entities to be taken into account fluctuates’ then we must not limit actors
    to the role of informers offering cases of some well-known types. You have to
    grant them back the ability to make up their own theories of what the social is
    made of. Your task is no longer to impose some order, to limit the range of acceptable
    entities, to teach actors what they are, or to add some reflexivity to their blind
    practice.


    We need to carefully consider how the actors themselves, both professional and
    non-professional, navigate and define these relationships that I’m describing
    as co-creativity. I agree with Gill and Pratt’s (2008: 18–20) provocation that
    when considering questions of creative work and labour we need to pay more attention
    to the meanings that cultural workers give to these activities themselves. We
    also need to extend this to the meanings'
