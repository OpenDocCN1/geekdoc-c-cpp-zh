  md: 'We need to recognize that co-creative and social network market formations
    hold a wide range of benefits and value. These include (but are not limited to)
    economic innovation. Rather than being a zero-sum game where if companies derive
    economic benefit it negates social benefit to the users (and hence is couched
    in terms of exploitation), this is instead can be a cooperative and non-zero-sum
    game whereby different motivations, incentives, and value regimes co-exist. These
    emerging social network markets and multiple games are social practices through
    which we experiment and innovate with ''new ways to cooperate across larger and
    larger scales and devise new ways to play increasingly complex and profitable
    non-zero-sum games'' (Beinhocker 2006: 266). But we need a better understanding
    of the factors and conditions that contribute to both the successes and failures.


    Further research into consumer co-creation in the context of digital media should
    aim to be a study of that co-evolutionary process through which we are learning
    to play such non-zero-sum games. Both multiple games and social network markets
    are proposed as key mechanisms in this process.'
