    the levels of interaction with and responsiveness to a rapidly growing fan community.


    It would be easy at this point to accuse Auran of cynically manipulating the *Trainz*
    user community as a marketing ploy in which my research has colluded. But before
    rushing to judgement we might ask how these relationships are being made. For
    example, emails received from individual members such as Vern, Barney, CeeBee,
    3801 and many others clearly demonstrated awareness that this community initiative
    by Auran was aimed at creating a market for *Trainz*. However, they also hoped
    that it was more than just this and that the community input would directly influence
    the design. These emerging co-creative relationships raise questions about changing
    markets. What are the transactions and exchanges occurring between these gamer
    co-creators and Auran? Is this simply about firms and markets taking advantage
    of the work of unsuspecting gamers?


