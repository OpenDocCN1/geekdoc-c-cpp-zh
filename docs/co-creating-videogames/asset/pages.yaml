    closer look at the status of this model.


    Investigating co-creativity in terms of co-evolutionary dynamics is grounded by
    a concern with the problem and question of dynamics of cultural change. This is
    a non-reductive naturalist approach that seeks to understand cultural process
    though the lens of processes of variation, selection and retention – the fundamental
    principles of evolutionary theory (Hartley 2009; Hodgson and Knudsen 2010).⁹ From
    the perspective of evolutionary economics, markets are not primarily or only a
    mechanism for efficiently allocating resources. More importantly, writes Beinhocker
    (2006: 294), markets are evolutionary search mechanisms, effective at enabling
    ‘innovation in disequilibrium’. From this perspective markets themselves are far
    from simply static institutions that operate to maintain equilibrium conditions;
    they evolve and dynamically change, and are often volatile and disruptive. This
    approach emphasizes that markets and market transactions are never just economic;
    they are entangled with social, cultural and technical conditions that make them
    possible (Callon 1998: 22–3; 2007: 315; also see MacKenzie 2006: 15–20).


    Callon''s (2007) idea of socio-technical agencements comes close to expressing
    the dynamic of social network markets. Agencements are combinations of heterogeneous
