    Before pursuing these questions further, we need to consider that the very ways
    in which they are posed can predispose us towards particular frameworks for responses
    – for example, we could approach them as problems of corporate co-optation and
    exploitation of fan culture. However, these co-creative relationships are shaped
    by a complex series of negotiations and compromises. It would be a mistake, I
    argue, to view these emerging relations as an opposition between the commercial
    and the non-commercial, the corporate developer and the fan community. Rather
    than being exterior and oppositional terms, these entities that are ‘Auran’ and
    the ‘*Trainz* fan community’ are immanent to these proprietary–non-proprietary
    and commercial–non-commercial dynamics. There is no exterior position from which
    to securely critique these conflicts and compromises. The problem is how to participate
    in these processes. The more interesting challenge is how to build, in Weinberger’s
    terms, ‘smart rooms’. What would it mean, for example, to co-creatively build
    a project such as *Trainz* for mutual benefit? What are the conditions in which
    that might occur and are the factors that might disrupt and impede such mutually
    beneficial outcomes? Fully answering these questions is beyond the scope of the
    book, but these are the questions that have emerged for me from this ethnographic
    research. Posing these questions I argue is far more illuminating about the nature
    of co-creativity than simply asking are these practices exploitative in the context
    of an assumed opposition between the commercial and the non-commercial spheres.


