  md: 'fan culture and its forms of knowledge and competence – than the fans themselves.
    (40)


    Hills insightfully argues that the tendency of fan research to foreground fandom’s
    hostility towards commercialization and commodification overlooks the ‘potentially
    curious co-existence within fan cultures of both *anti-commercial ideologies*
    and *commodity-compliant practices*’ (his emphasis, 28). This tension cannot be
    overcome by coming up with better descriptions of fandom or even a better theory
    of fan practices. Fandom is shaped and made by these contradictions. In fact,
    the very production and marketing of *Trainz* is enabled by these incommensurable
    relations. It is here, in this uneasy space, that the dynamics of emerging co-creative
    relations play out. For Hills the moral dualism of bad fan as consumer versus
    good fan as producer should be radically challenged. The practices I have been
    describing unsettle and disrupt this oppositional structure. Valorizing of fan
    production does not engage with the tensions and contradictions that are the conditions
    of fandom, and is more about creating a figure of the fan, mobilized in academic
    institutional practice, which can carefully erase the traces and taint of crass
    consumerism (30–5).² There can also perhaps be a tendency in some media studies
    research to overly valorize the bottom-up agency and productive activity of the
    fans somewhat at the expense of considering the work of media professionals that
    enables these activities.


    # User-created content and the *Trainz* development project


    Over a series of releases from 2001 through to 2008 *Trainz* increasingly foregrounded
    user-created content. Using the tools provided with the Surveyor module, users
    made their own 3D layouts and then shared them with other users through the *Trainz*
    website Download Station. Using third-party modelling tools as 3D Studio Max,
    players could also make their own 3D locomotive and rolling stock models and import
    them into the game.


    Fan content became increasingly integral to *Trainz* and its commercial success
    relied on such content. At first commercial release in 2001 Auran did not fully
    anticipate the extent to which *Trainz* would become reliant on user-created content.
    This raised questions concerning how Auran would manage the relationship with
    fan creators. How would this fan content fit within the *Trainz* project? Would
    Auran distribute the content from its website? Would Auran allow fans to retain
    ownership of the content that they created? Would fans be permitted to sell the
    content that they created? How would'
