    Multiple games are what each of us plays every day, when we make choices to act
    in and through the overlap of sometimes complex, conflicting and uncertain multiple
    environments. What may appear as an irrational choice in each decision may nevertheless
    be evolutionarily rational in a multiple games context.


    The overarching point is that this frames consumer co-creation as a context of
    institutional evolution over the populations of agents that are negotiating multiple
    games into action possibilities for mutual benefit against those who are not.
    In other words, this is not a context of opposed ‘conflicted motivations’ – for
    example market self-interest versus cultural participation – and irrespective
    of whether this plays out in a single person seeking to balance these conflicting
    objectives, or between groups representing each objective, like businesses versus
    the communities.


    From the multiple games theory perspective this may not be a battle between two
    existing institutional modes of production, where the gain of one implies the
    loss of the other, but rather is an evolutionary process that pits new complex
    behaviours and emergent institutions against all older institutional forms. Again,
    this co-evolutionary dynamic is subtle, because if so, then this will also give
    rise to new non-market behaviours and institutions (e.g. co-creator cultural communities)
    that do not comfortably fit with extant categories as well as new market forms
    and institutions (e.g. reputation markets, networked business models).


    We witness these co-evolutionary dynamics at work in the emergent identities associated
    with new institutions. Playing multiple games implies new professional identities
