  md: 'title, and enable users to modify or produce new material for the game. Skins
    or textures modify and alter the graphics of elements and models in the game.
    More extensive modifications such as ''total modifications'' include the ability
    to create new game levels or game units and objects that can be shared with other
    players. Games researchers recognize the value and significance of modding for
    the videogames industry and games culture (Banks 2002; Postigo 2003, 2007, 2008;
    Dovey and Kennedy 2006; Kerr 2006; Nieborg and van der Graaf 2008), often citing
    the multiplayer modification *Counter-Strike*, a counterterrorism themed first-person
    shooter, developed by amateurs Minh Lee and Jess Cliffe in 1999 for Valve''s popular
    *Half-Life* (1998). As Nieborg and van der Graaf (2008: 178) note,


    The success of *Counter-Strike* eventually surpassed that of *Half-Life*, and
    gamers started to buy the original game just to play the mod. Foreseeing a great
    future for *Counter-Strike* and its developers, *Half-Life*''s original developer
    Valve responded by offering the mod team a spot on Valve''s professional development
    team and in so doing, acquiring *Counter-Strike*''s valuable intellectual property.


    Commercially successful titles such as the retail phenomenon that is *The Sims*
    (Maxis and Electronic Arts, 2000) franchise rely heavily on gamers creating and
    sharing content. In ''Learning from the Sims'', J. C. Herz (2001) suggests that
    the success of the popular phenomenon of *The Sims* is perhaps explained, at least
    in part, by Maxis''s efforts to involve its customers directly in the process
    of developing and evolving the product. This reached ''the point where customers
    not only do a large portion of the innovation and marketing but also produce as
    much intellectual capital as they consume''.


    The success of the Maxis developed and Electronic Arts published *Spore* (2008)
    thrives on user-created content. Players use 3D editors to design creatures and
    other in-game content, guide their creatures through stages of evolution and then
    share their creations with other players. Maxis harvests this player-created content
    to populate other players'' games through a system they describe as ''pollinated
    content''. Since *Spore*''s release in September 2008 well over 100,000,000 items
    of player-created content were uploaded to the online Sporepedia repository within
    the first year. Players can also upload directly from within their game videos
    of their creature creations to the *Spore* YouTube channel. Creating and sharing
    content is such a core feature of *Spore* that the game is perhaps best understood
    as a social network generated from player creativity. The puzzle-platformer *LittleBigPlanet*,
    developed by UK-based Media Molecule and released in October 2008 for the PlayStation3
    console, and its sequel *LittleBigPlanet2*, also rely heavily on user-created
    content. Players can use drag-and-drop level editors embedded throughout'
