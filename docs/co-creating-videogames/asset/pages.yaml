  md: 'draws on ANT to better understand how designed artefacts enact the social.
    For Yaneva this concerns,


    how objects with their scripts and incorporated programs of action compel and
    rearticulate new social ties, how the way they are shaped and designed is related
    to specific ways of enacting the social.


    But a problem with such ANT-inspired approaches in the effort to describe such
    relational networks one can end up trying to encompass everything and therefore
    analytically explaining nothing. What kind of dynamics constitutes these interrelations?
    In *The Culture of Connectivity: A Critical History of Social Media* (2013), José
    van Dijck (2013: 26-9) adopts ANT as a theoretical approach for understanding
    how social media platforms increasingly inform and construct people''s sociality.
    She suggests that ANT usually allows us to consider ''the co-evolving networks
    of people and technologies'' (26). It allows us to approach platforms such as
    social media and game engines not simply as artifacts but as a set of relations
    constituted by humans and non-humans that ''constantly need to be performed; actors
    of all kinds attribute meanings to platforms'' (van Dijck 2013: 26). van Dijck,
    however, argues that although ANT offers a helpful ontological starting point
    with this refusal to distinguish the social and the technological, it may still
    be important to make these distinctions for analytical purposes. Here she questions
    the analytic traction that ANT provides. She argues that such distinctions may
    be important when we want to understand the changing relationships between technologies
    and society (van Dijck 2013: 26). To overcome this difficulty van Dijck combines
    perspectives offered by ANT with a political economy (drawing especially on Manuel
    Castells'' work) approach to get at the ''dynamic intricacies of platforms'' (van
    Dijck 2013: 28). ANT enables her to systematically approach platforms as socio-technical
