    In *The Wealth of Networks*, Yochai Benkler notes that firms’ efforts to harness
    social peer-production challenges business with how to integrate these ‘newly
    ambitious relationships . . . which use peer production as a critical component
    of its business ecology’ (125). Benkler observes:


    > > The critical and difficult point for business managers to accept is that bringing
    the peer-production community into the newly semi-porous boundary of the firm
    – taking those who used to be customers and turning them into participants in
    a process of co-production – changes the relationship of the firm’s managers and
    its users. (125)


    Opening *Fury*’s development to this distributed network of expert gamers provided
    useful critical feedback and forward marketing. But it also exposed Auran to management
    challenges by disrupting a closed industrial model of expertise in favour of a
    more open innovation model. Many of Auran’s senior managers failed to recognize
    that harnessing the support and input of these players involves an implicit recognition
    of the players’ expert status as co-creators. Harnessing the benefits of a co-creative
    relationship came with a responsibility to respect that expertise, and when, in
    the minds of the player co-creators at least, the developers failed to do so,
    an implicit contract was broken and a distributed asset of innovation and development
    turned rapidly into a market network liability. Auran misunderstood and mishandled
    the context across which these interactions played out by failing to appreciate
    that coordinating those competing and often conflicting forms of expertise requires
    us to rethink how businesses and their customers form collaborative webs that
