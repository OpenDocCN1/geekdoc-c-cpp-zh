  md: 'exchange context or in a socio-cultural production context, but not both. It
    is of course entirely logical to decompose complex situations into, for instance,
    economic contexts that induce economic behavioural responses, and cultural contexts
    that induce cultural behavioural responses. This can be an important analytic
    and modelling heuristic. But the actual context of human action is rarely so neatly
    decomposable and commonly consists of situations of simultaneous multiple contexts
    that do not permit multiple actions (e.g. a separate economic action from a socio-cultural
    action) but require actions and indeed choices that play out across all contexts
    simultaneously: this is the context of a multiple game. Our argument is that consumer
    co-creation is a paradigmatic instance of a multiple game.⁶


    David Stark’s (2009) *The Sense of Dissonance: Accounts of Worth in Economic Life*
    is helpful for approaching this idea of simultaneous multiple evaluative contexts
    that is at the core of this multiple games model. An economic sociologist and
    ethnographer, Stark draws on four ethnographic studies of very different companies
    (so a comparative ethnographic approach) to develop a compelling proposal about
    innovation and entrepreneurship. He asks what counts as worth or value, and how
    do we evaluate that, in circumstances of quite profound uncertainty and overlapping
    valuation contexts; that is, the environments the organizations he studies are
    encountering and struggling with.


    Stark’s compelling thesis is that firms are perhaps, and in an evolutionary context
    at very least, better served by allowing multiple logics of worth and not discouraging
    the resulting exploration of uncertainty. He advises developing organizational
    forms (‘heterarchy’) to harness the benefits and opportunities of such ‘dissonance’
    arising from these structural folds over value (cf. Burt’s concept of structural
    holes) (17). He became interested in how the actions of agents in these firms
    were made possible by the uncertainty and that they were ‘attempting to benefit,
    not from asserting or fixing their worth in one order, but by maintaining an ongoing
    ambiguity among the co-existing principles’ (Stark 2009: xiii–xiv). Why? Because
    this dissonance became an opportunity for organizational reflexivity from the
    ongoing rivalries and disputes, which pointed to possibilities for entrepreneurship
    from exploration and recombination.


    The kinds of agents and agency that emerge from Stark’s account are those centred
    about search and navigation. He suggests a new kind of search in which ‘you do
    not know what you are looking for but will recognise it when you find it’ (Stark
