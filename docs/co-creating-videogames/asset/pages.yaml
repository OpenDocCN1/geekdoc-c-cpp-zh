    in the *Trainz* manual’s acknowledgements and credits, for providing additional
    research – as are over 50 community members who contributed directly to the development
    project. 3801 also took on a role as community moderator on the Auran forum for
    a period, assisting with welcoming new visitors and answering common questions.
    And he made a decision that despite Auran’s claims that it was not designed for
    creating prototypical routes, he would endeavour to create such a lengthy route.
    In discussions with Auran he commented that he viewed this as a suitable reply
    and counter to those in the train sim community who wanted prototypical routes
    for *Trainz*. In short, his view was that Auran had provided the tools to ‘do
    it yourself’. As a member of the beta-test team, 3801 had access to early builds
    of *Trainz* and he started work on this route, based on an Australian segment
    of rail, Robe River. The completed route was eventually included in Auran official
    updates to the *Trainz* release. Here, fan-created content is integrated directly
    with the official, corporate commercial release. Does this blurring of the boundaries
    between corporate producer and fan content creator amount to nothing more than
    the incorporation of fan culture within the networks of capitalism? Or does it
    provide a strong example of consumer empowerment, and perhaps even a democratizing
    of fan-corporation relations?


    Such stark oppositions are not helpful in negotiating the complexities and contradictions
    that shape this emerging landscape. Such an oppositional explanatory framework
    does not so much represent or describe these relations; rather, it is a tool for
    creating the figure of the fan as an object of academic desire. By engaging with
    the specificities and particularity of people’s encounters with these relations,
    and providing detailed descriptions of how audiences and media professionals negotiate
    with media technologies and each other, ethnographic research can help us to get
    at the ambivalences of our positioning in these networks without necessarily falling
    back into the banalities of equating this consumer co-creative activity with resistance,
    or democratic empowerment.


    In his study of fandom, *Fan Cultures*, Matt Hills (2002: 27) carefully positions
    fans within the processes of contemporary consumer capital. He asks what happens
    to our conceptions of the fan-producer ‘when fan cultures are themselves directly
    targeted as a niche market’. Fans’ participation in development and production
    involves:


    > > mechanisms of market segmentation, in which fans’ values and authenticities
    are . . . sold back to them. And thus who is better placed to produce this material
    – which by definition must draw on immersion in'
