  md: '# # Acknowledgements


    This book has been a long time in the making, by now well over a decade, and there
    are many people who have helped me along the way. It started out at the University
    of Queensland as a PhD research project back in 1997 and there I need to especially
    thank my friend and mentor Tony Thwaites and supervisor Tom O''Regan.


    Thanks to the management and staff at Auran, especially Greg Lane, Tony Hilliam,
    and Graham Edelsten, and the members of the *Trainz* and *Fury* development teams
    (especially former Auran colleagues Rob Shaw, Rachel Nixon, Ieuan Hyde, Stephanie
    Bond, Jason Robson, Alex Weekes and Dan Gray). Thanks also to the many members
    of the *Trainz* fan community who participated in this research and shared their
    experience and knowledge with me. It was a privilege to collaborate with you all
    on building the wonderfully creative *Trainz* community. Thanks also to the management
    and staff at Maxis for participating in this research (especially Caryl Shaw for
    making this aspect of the project happen). Thanks also to Will Wright for providing
    valuable insights over the closing stages of the research.


    The final stages of the research on which this book is based and the writing of
    it was carried out while I was a post-doctoral Research Fellow on John Hartley''s
    Federation Fellowship program *The Uses of Multimedia* (project number FF0561981),
    funded by the Australian Research Council and supported by Queensland University
    of Technology, between 2007 and 2011. Colleagues at this institution have provided
    support, critical feedback, encouragement and the collegial exchange of ideas
    that makes doing research a rewarding vocation. My thanks especially over this
    period to my friend, colleague and former office-mate, Jean Burgess. Thanks also
    to Christy Collis, Sal Humphreys (now at the University of Adelaide), Alan McKee,
    Lucy Montgomery, Thomas Petzold, Deb Polson, Jason Potts, Christine Spurgeon,
    Jason Sternberg and Nic Suzor.


    Special thanks to Stuart Cunningham and John Hartley who encouraged me throughout
    the past five years.


    I must also thank that wider circle of colleagues around the world who have provided
    feedback and encouragement along the way. My thanks to Nancy Baym, Mark Deuze,
    Henry Jenkins, Thomas Malaby, Hector Postigo, T. L. Taylor, Tiziana Terranova
    and Fred Turner.'
