  md: 'These co-creative consumers now judge companies such as Auran and

    Maxis on how well they respond to their feedback and on how well they

    provide and deliver a service that effectively integrates the consumer across

    the creative development process. The positive word of mouth that Auran''s

    CEO hoped to harness doesn''t come for free. ‘Attention-economy’ (Lanham

    2007) transactions play out here: the participation of the gamer consumers

    endorsing Fury through their fan social networks requires Auran in turn to

    recognize the status and contribution of the gamers'' expertise in the context

    of a co-creative relationship for mutual benefit.


    This case study of Auran''s Fury and its complex and fraught interaction

    with its base of consumer co-creators raises obvious business strategy and

    process questions, but also some fundamental analytic questions. What are

    the mechanisms and processes that may help us to better understand these

    co-creative expertise exchanges? We need to develop analytical tools and

    models that help us to work through the dynamic relationships that shape

    these emergent co-creative exchanges. We need a framework or model of

    expertise that situates the expertise of citizen-consumers in proper perspective

    alongside professional creatives'' expertise in the fields of design and media

    production. This problem of ‘expertise extension’ identified by H. M. Collins

    and Robert Evans (2002, 2007) acknowledges the need to extend the domain

    of technical decision making beyond the confines of a professionally qualified

    elite to include, for example, the ‘experience-based expertise’ of people that
    is

    not recognized by certification or professional standing. But Collins and Evans

    ask how do we then go about establishing grounds for limiting the extension

    of these decision-making rights (2002: 237)? We saw this issue of identifying

    the limits and boundaries of such rights in the ‘design by committee’ concerns

    raised by Fury''s lead designer. Collins and Evans provide us with a starting

    point for undertaking this task by establishing the necessity of recognizing

    and categorizing different types of expertise. They then argue that it then

    becomes ‘possible to begin to think about how different kinds of expertise

    combine in social life, and how they combine in technical decision-making’

    (2002: 251).


    # ## ‘Interactional expertise’ and co-creative trading zones


    In these contexts of asymmetrical co-creative expertise exchange the

    participants need to develop and use what Collins and Evans describe as

    ‘interactional expertise’ (2002: 256; Collins 2004; Collins and Evans 2007).

    Defined as (Collins and Evans 2007a: 14) ‘the ability to master the language

    of a specialist domain in the absence of practical competence’, interactional'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'expertise is a translation role that facilitates and supports communication,
    dialogue and exchange across expertise domains. In developing this category of
    expertise, Collins draws on his experience as an ethnographer studying scientists
    researching gravitational waves. He argues that through this participatory engagement
    with the scientists over an extended period, he acquired competencies and communication
    skills that enabled him to contribute to discussions about the subject in a way
    that passes for expertise, although he does not possess the rigorous mathematical
    knowledge or core experimental skills required to participate fully in that domain
    of scientific research. Collins and Evans (2002, 2007) argue that this interactional
    expertise that often sits between and cuts across specific expertise domains is
    vital to the success of projects that involve collaboration across different expertise
    sub-groups.


    Collins, Evans and Gorman (2007) have refined further this idea of interactional
    expertise by drawing on Peter Galison’s (1997) term ‘trading zone’ to understand
    the exchanges and transactions that routinely occur in interdisciplinary scientific
    research across fields that may appear to be formally quite incommensurable. Galison
    emphasizes the need to address communication problems across these domains by
    developing ‘in-between vocabularies’ and ‘inter-languages’. They identify the
    importance of interactional expertise to the successful development of trading
    zones as coordinating mechanisms. Collins, Evans and Gorman (2007: 662) assert
    that ‘interactional expertise trading zones seem so widespread that it might be
    argued that it is the norm for new interdisciplinary work’.


    Co-creative expertise can be understood then as a coordination or re-coordination
    problem that requires the use of interactional expertise to create and facilitate
    trading zones. But developing such interactional expertise is difficult and time
    consuming and project managers routinely underestimate its significance (Collins,
    Evans and Gorman 2007: 663–5; Collins and Evans 2007; also see Stark 2009: 192–4).
    In the case of Fury it is argued that Auran failed to construct an effective trading
    zone that supported interchange and transactions across the differing skills that
    needed to combine to identify and solve the game’s design problems. Interactional
    expertise is a skill that Auran undervalued to its cost.


    The idea of a trading zone as a place where problems of coordination are resolved
    provides us with a useful starting point for understanding co-creative expertise
    and the problem of making co-creativity work fairly and effectively. But to develop
    this idea further it is necessary to acknowledge that the asymmetries and incommensurabilities
    shaping these co-creative trading zones will be very different from those evident
    in interdisciplinary science research projects. For a start co-creativity in the
    forms explored in this book blur relations between economic and cultural domains.
    Nevertheless, one'
