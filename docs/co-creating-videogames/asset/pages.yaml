  md: 'Some of the project’s that we’re working on right now here are about that but
    taking it out of this box we still call games and seeing what it might look like
    across the broader field of entertainment with films, television, social network
    sites, this [is gesturing at his iPhone] and so on. This needs a lot of experimenting
    with though.


    I asked Wright for his view on the proposition that by drawing so extensively
    on user-created content and user-metrics companies such as Maxis and EA were taking
    advantage of a form of free labour as an outsourcing and cost-reduction exercise:


    Well all of this is optional and if it were onerous on the player they wouldn’t
    bother doing it. Games are a discretionary form of entertainment so describing
    this as labour, well I really don’t get it, I don’t see it that way. We’re giving
    them things they enjoy doing and they’re paying us money for that. There’s also
    the factor of all this content they’re enjoying, the huge amounts of it, there’s
    no way we could fund producing that in a viable way and they’re also enjoying
    creating and sharing it. So it’s hard for me to take that proposition seriously.
    The other aspect of your question, the cost savings. I think I mentioned that
    in interviews I’ve given before as you said. But there again does what we’re doing
    here with the players creating and sharing all that content really make sense
    in these terms of cost savings and free labour? Realistically and economically
    there’s no way we could supply that amount of content. But the other thing you
    asked about the privacy and surveillance issues associated with the player data
    that is generated, there’s something there for sure. You know we need to think
    hard about how to give players themselves more control over that. The ownership
    of that information and the content the players are making is also a thornier
    issue. This is also about the whole DRM (Digital Rights Management) issue, you
    know a player can just take that cool creature add a couple of little minor changes
    and then say that’s my creature now and re-upload it. At the moment we have very
    little control over those what you would call them, editing rights? We do try
    to embed within the creatures, the content, a lineage of creators who have touched
    it or modified it in some way, so you can kind of track this.


    I asked Wright to expand a little more on the DRM question as it had been particularly
    controversial in the case of Spore.


    You know it’s a thorny issue and there’s a lot of grey between the two sides.
    And the grey zone is kind of challenging as well, there’s not a smoothly descending
    ramp from those people that should in a sense enjoy the fruits of their labour
    and should have their intellectual property'
  merge: -1
