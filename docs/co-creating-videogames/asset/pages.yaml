    that help players as they learn to use the level editors and create their own
    levels. Since *LittleBigPlanet*''s release over two million player-created levels
    are available and the Game of the Year edition includes 18 of these levels.


    The particular significance of titles such as *Spore* and *LittleBigPlanet* is
    that they integrate co-creative media culture into the very core of the gaming
    experience and the videogame business. *LittleBigPlanet*''s tag ''Play, Create,
    Share'' foregrounds the centrality of this co-creativity.


    Back in 1997, however, as I interviewed Lane and visited Auran, I was just glimpsing
    the potential of user-created content and its implications for transforming producer-consumer
    relations. After securing Auran''s agreement to participate in the research, regular
    visits to the workplace were arranged, including the opportunity to interview
    programmers and designers working on *Dark Reign*. I was aiming to obtain a programmer''s
    perspective on the open-architecture game engine design that Lane had been discussing
    with me. My fieldnotes record that on one of these early visits I approached a
    young programmer asking, ''what he was working on'', and he gestured at the screen
    replying, ''You know, tracking down the last few bugs''. When I asked further
    about *Dark Reign*, the open-architecture Tactics Engine and Auran''s plans to
    support the fan community''s efforts to create add-ons and modifications, he appeared
    to be uneasy about how to respond. He said:


    > > Yeah, the fan stuff is really cool and important. We want to put some effort
    into that area of the game. Like how we do the chats with the fans.


    I then asked about the Tactics Engine technology behind *Dark Reign*, and how
    Lane had described it as being open and modifiable by the gamers. The programmer
    appeared to be somewhat uncomfortable, and said, ''I should be getting back to
    it, it''s crunch time here and there''s still heaps to do.''


    On that note our discussion abruptly ended. As I left the main workspace area,
    I noticed that he was sitting back down in front of the PC, obviously back at
    it, whatever ''it'' was. I assumed that he meant working on fixing bugs. The real
