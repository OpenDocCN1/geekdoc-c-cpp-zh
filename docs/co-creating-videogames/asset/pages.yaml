  md: 'a configurable game kind of emerged as we worked on the engine. I''m looking
    forward to see what the users do with this, what kind of content they create.


    For the remainder of the meeting, we discussed the relationship between game developers
    and the online fan communities. Lane said:


    > > Extensibility or customisability of a game engine is very important, I think,
    to attract the hard-core gamer group, particularly those whose gaming activities
    are internet based. . . . We''re not sure exactly how important our involvement
    with the fans will be to eventual sales of *Dark Reign*. But we do believe that
    it is important; it is something that we are very committed to . . . . I think
    that the hard-core online gamers do have an influence, particularly the ones who
    run the major fan sites. They are opinion leaders. They influence the level of
    presence and credibility that a game title has online. The more fan activity around
    a game title (creating websites, making additional content), the greater is the
    title''s credibility with gamers who are online. We believe that online gaming
    activity will only grow in the coming years. So yes, we do believe it is important
    to listen to the fans. But how important our involvement is for sales is anyone''s
    guess at this stage. What''s our return on investing in all of this – who knows
    really? I have a view that it will extend the shelf-life of games. Games have
    a relatively brief period in which to make their sales. Maybe fan activity, like
    content creation, can extend the interest in a game. But apart from that, it is
    a lot of fun. The fans obviously enjoy it and the guys here also have fun with
    it.


    An important feature of the emerging gamer fan culture, and one which is now supported
    by many titles, is user-created content – extensions and additions to the game
    software (often described as ''mods'' or ''add-ons''). This opening of the game
    architecture to the end user contributed to the success of ID Software''s break-out
    title *Doom*. In *Joystick Nation*, J. C. Herz (1997: 90) observes that *Doom*
    marked a potential transformation in how games are made, becoming open-ended processes
    in which end users participate. ID released the source code of *Doom* in December
    1997 under a not-for-profit license, allowing fans with programming skills to
    modify the game. They could create custom soundscapes, tweak the game''s configurations,
    or even create new levels, entire episodes of the game. . . . Players became a
    part of *Doom''s* world not just because they played the game but also because
    they constructed bits of it.


    Game development companies now routinely include editing and modding tools with
    their game release software package. These are often the software tools that the
    game designers and artists use in the production of the release'
