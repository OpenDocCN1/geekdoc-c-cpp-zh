  md: 'professionals imagine and make for and through these co-creative networks.
    Such commentators’ work is profoundly performative rather than merely descriptive.
    Dismissing the contribution that their work makes to this domain would be a mistake.
    Nevertheless, as I hope is clear throughout this book, I do not go so far as to
    suggest, as does Shirky (2008), that this is a ‘power of organizing without organizations’
    (the subtitle from his book *Here Comes Everybody*). Instead, I suggest that some
    organizations, including certain types of firms and their associated project-based
    forms of coordinating cultural production, are morphing and changing. Certain
    kinds of organizations in certain kinds of contexts and places are changing. But
    they are still organizations. And they are organizations that seek to extract
    and harness the value of these co-creative relationships. Auran, Maxis and the
    other game developers featured in this study are organizations, firms, which are
    central to coordinating co-creative culture. Their highly skilled employed professionals
    contribute to the making and crafting of these relationships. Here I am pushing
    back somewhat at the tendency to valorize the bottom-up agency of consumers and
    users, which overlooks the extent to which much of this activity is mediated and
    supported by diverse craft skills of professionals. As the Maxis senior producer
    commented: ‘It’s a trick’. Not a trick in the sense of deceiving or misleading,
    but a negative and creative trick that indeed does often result in genuinely innovative
    and valuable creativity from consumers and users. But back to the topic of organizations
    – we need better accounts of the kinds of organizations and modalities of organizing
    that are emerging. What is working and what is not working? Where are the successes
    and failure? What norms and criteria are emerging from the very midst of these
    dissonant organizational experiments for how we might go about judging what counts
    as working and success? How is the challenge of searching for non-zero sum outcomes
    resolved in the context of co-creative media making?


    Following the evolutionary theory approach that orients much of this book, the
    response to these challenges will emerge through an adaptive, trial-and-error
    process. There will be failures. Firms and consumers will get it wrong as they
    search for those non-zero-sum possibilities. Opportunistic zero-sum plays will
    most certainly feature such as aggressive rent-seeking behaviours. Some of these
    behaviours may well provide competitive advantage for a period while others will
    be punished as the participants share their learnings about more effective non-zero
    sum arrangements that better reward effective cooperation. Reciprocity, trust
    and self-interest will shape these collective actions. The participants are still
    figuring out the norms that may contribute to better outcomes. This is about emergent
    governance rather than prejudging what we think should and will work. We doubt
    that these solutions can be imposed in top-down, central planning fashion.'
