    Mol''s work, is that object multiplicity and singularity are not an oppositional
    either/or relationship. The mode of fractionality that both Mol and Law are exploring
    is more a case of both/and; complex interferences that arise from the ''coherence
    of noncoherence'' (116).

    +   9. Manovich (2001: 258) notes that ''in new media the relation between production
    tools and media objects is one of continuity, in fact, it is often hard to establish
    the boundary between them''.

    +   10. Manovich (2001: 41–2) comments that the ''logic of new media fits the
    logic of the postindustrial society, which values individuality over conformity
    . . . In a postindustrial society, every citizen can construct her own custom
    lifestyle and "select" her ideology from a large (but not infinite) number of
    choices. Rather than pushing the same objects/information to a mass audience,
    marketing now tries to target each individual separately. The logic of new media
    technology reflects this new social logic''.


