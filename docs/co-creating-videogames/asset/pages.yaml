  md: 'Many of the content creators were attracted to the TRS2004 program by Auran''s
    promise that they would enjoy early access to builds of TRS2004 and, more importantly,
    to direct support from members of the *Trainz* team. The creators who were pursuing
    commercialization of their content also viewed it as a valuable promotional opportunity,
    as having their content in the TRS2004 release may encourage users to visit their
    websites and purchase their other content offerings. As the project progressed
    over the second half of 2003 it became increasingly difficult to meet the support
    expectations of the fan creators. We received many emails, forum requests and
    telephone calls from creators seeking advice and assistance from the Auran programmers
    as they worked to finalize their content and get it in before the deadline. These
    user-creators were finding that in one build-release of TRS2004 their content
    would work, and then in the next release it would suddenly no longer function.
    Frustration and anger was a common reaction from the fan creators. They were also
    expressing dissatisfaction with the tardiness of replies from the Auran development
    team. Some abandoned their projects, feeling that it was just not possible to
    meet Auran''s commercial deadlines; after all, for many of them it was a hobby
    that they were pursuing on weekends and evenings after work. A few emailed Auran
    stating that it was no longer fun and was becoming more of a job, and therefore
    they had made the decision to resign from the group. They would still work on
    the content, but at their own pace and release the content, when it was ready,
    through Download Station. Influential creators were expressing concerns about
    Auran''s management of the third-party content program for the TRS2004 project.
    In June 2003, Prjindigo emailed that the code builds they were receiving in order
    to test their content were ''incapable of doing the testing and creation that
    we need to be doing''. He added:


    > > The lack of flexibility in scheduling that has been indicated to us with totally
    impossible fixed deadlines and a half-way announced inability to get us a working
    version of the first beta to do content for one week before it goes to full beta
    are real turn-offs to the content group . . . The larger proportion of the 3rd
    party group expected a more smooth and fair treatment in the concerns of time
    to build and time to test than this schedule has compressed upon them.


    His main concern was that the content creators were not being provided with the
    level of information and support that they needed.


    Members of the Auran development team, particularly Rob Shaw, worked closely with
    many of these creators to ensure that their content meshed with the final TRS2004
    build. A few of the creators even arranged to take leave from'
