    is to ''find the spaces that allow us to refigure the projects . . . rather than
    merely to be incorporated passively into them''. However, it does not follow from
    this that these research participations are or should be opposed to corporate
    agendas. As we shall see, co-creative relationships unsettle such oppositional
    logics.


