  - 3.14.5  函数重载 – 通过命名空间解决可见性问题
- - '##'
  - 在深入代码分析之前，请注意第 [3] 行的 using namespace std 结构。它打开了当前编译软件（即编译单元）中所有已包含标准头文件的整个标准命名空间。因此，标准函数和类可以省略
    `std::` 前缀。缺点是，如果已经存在一个与打开的命名空间中的函数或类同名的函数或类，就可能发生名称冲突。因此，应避免使用前面的结构，尤其是在头文件中。这意味着应显式使用
    `std::` 前缀，尤其是当这样做不会降低代码可读性时。另一种替代方法（也在我们的大多数示例中使用）是逐字引入我们希望使用的每个构造而不带 `std::`
    前缀，例如 using std::cout、using std::string 等。尽管如此，在源文件（.cpp）中使用该命名空间中的数十个函数和类时，如果潜在名称冲突得到良好控制（如
    Functions_Lambdas.cpp 中所示，清单 3.16 仅展示了其中的一小部分），有时打开整个 std 或其他命名空间也是合理的。我们的首要目标应该是软件的正确性，这条规则和其他规则都应谨慎选择，并且只有在支持这一首要目标时才应用。
- - '##'
  - 考虑到参数 o 可以表示任何流，例如 `std::cout`，也可以表示打开的文件或网络端口，第 [18–20] 行应该很容易理解。为了打印可读信息，在第
    [21] 行，输出了第 [16] 行定义的 vector 中的文本。
