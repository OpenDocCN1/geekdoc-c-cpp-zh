  trans: "\n我们会在微波炉中加热食物。我们按下几个按钮来设置定时器晚餐类型。最后，我们享用了一份热腾又美味的午餐。我们并不知道微波炉内部有什么。我们以一种非常直接的方式获得了对容量的访问。\n\
    \n对象是面向对象编程的主要构建模块。一个对象由属性和方法组成。通过访问修饰符，抽象将它们与外部全局隔离开。我们可以在其他包中提供对重要功能和属性的访问。在\
    \ OOP 中，这是强制抽象的完整技术。\n\n**继承**：面向对象编程最重要的方面之一是继承（`OOP`）。理解继承的关键在于它促进了代码的重用。我们不需要重复相同的代码，而是真正可以将一个父类的属性继承到另一个子类中。\n\
    \n**多态**：多态一词被用于各种场合，用来描述事物以多种不同形式出现的情况。它描述了了在编程语言中，可以通过相同的接口访问不同类型的设备的理念。每种类型都可以为该接口提供其自己的、无偏见的实现。这是一个基础概念，也是面向对象编程（`OOP`）的基础。\n\
    \n# 第 2 章\n\n## ![](img/image00108.jpeg)2.1 如何开始 C++\n\n### 2.1.1 编写 Hello World\n\
    \n```cpp\n#include <iostream>\nint main() {\n    std::cout << \"Hello World\"\
    ;\n    return 0;\n}\n```\n\n代码分析：\n\n这是一个包含 `<iostream>` 的预处理器指令。头文件被包含在源代码中。`iostream`\
    \ 包含了用于输出流和输入流的双向的函数。\n\n当执行源代码时，会调用 `main` 函数。当程序执行时，`main` 函数应该是独一无二的。\n\n`main`\
    \ 函数中的关键字 `int` 表示它应该返回一个整数类型的数字。\n\n`Hello, World`：它是一个字面量字符串。它是将要打印的文本。文本始终放在引号内。\n\
    \n分号（`;`）：它是通知编译器语句已结束的标记。\n\n### 2.1.2 文件包含指令\n\n文件包含指令 `#include` 允许我们在源代码中包含各种文件。在我们的代码中，我们应该包含任何提供若干预设功能定义的头文件记录。可以使用以下语法在程序中包含头文件：\n\
    \n`<FILENAME>` 应该被包含。\n\n随着我们的包尺寸扩大或功能变得更加复杂，我们可能需要将软件拆分为不同的文件，或从其他文件导入功能。在这种情况下，我们采用程序员定义的文件。若要在我们的软件中包含程序员定义的文件，我们可以使用以下\
    \ `#include` 指令语法。\n\n`\"FILENAME\"` 必须被包含。\n\n这是我们打算整合到代码中的用户定义文件，以获取其功能。\n\n\
    ## 2.2 宏定义指令\n\n`#define`：此命令用于定义符号常量。创建一个宏名称 `code`。\n\n`#undef`：使用 `#undef`\
    \ 指令，程序中通过 `#define` 指令定义的宏将被关闭，直到它们不再定义。当程序遇到 `#undef` 时，使用宏（通过 `#undef` 未定义的宏）将导致编译失败。\n\
    \n### 2.2.1 条件指令编译\n\n在编码中，使用了如 `if` 和 `else` 等指令。一些 C++ 条件编译指令如下：\n\n`#elif`\n\
    `#ifdef`\n`#if`\n`#endif`\n`#ifndef`\n`#else`\n\n`#` 和双符号 `##` 运算符用于将文本标记转换为字符串。\n\
    \n### 2.2.2 附加目录\n\n`#error`：当编译器发现源代码中存在错误时，错误指令会导致编译器产生错误消息。\n\n`#line`：此指令指示编译器将存储的文件名和行号替换为给定的文件名和行号。\n\
    \n`#pragma`：它为实现提供了指令。\n\n## 2.3 注释\n\n良好的注释是对程序员的极佳锻炼。它提高了代码的可读性并使更容易发现错误。注释是有效文档不可或缺的一部分。\n\
    \n注释是计算机程序源代码中程序员可读的理由或注解。注释是编译器或解释器未完成的语句。在 C/C++ 中有几种类型的反馈：\n\n- 单行注释\n- 多行注释\n\
    \n`// single-line or solo comment`\n\n`/* Comment on many lines */`\n\n### 单行注释\n\
    \n`//` 双正斜杠是它的写法方式。它是用于表示单行注释的标记。它仅将注释应用到单行。它被称为 C++ 风格注释，因为它是 C++ 编程中非常早期的组件。\n\
    \n例如：\n\n```cpp\nint main() {\n    std::cout << \"Hello World\"; //single line\
    \ remark\n}\n```\n\n### 多行注释\n\n`/* any text */` 以正斜杠和星号（`/*`）开头，以星号和正斜杠（`*/`）结束。它用于表示多行注释。它可以观察以上的注释。因为它是在\
    \ C 语言中提供的，所以它被称为 C 风格注释。\n\n```cpp\n/* How to Begin Sentene1\nSentence2 Sentence3\
    \ Sentence4\n.\n.\n*Commentary concludes */\n```\n\n### 代码\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello, World\"\
    ;\n    return 0;\n}\n```\n\n### 注释的优点：\n\n注释像任何其他编程语言一样，提供了许多好处：\n\n- 代码应该被显式注释，以便阅读。\n\
    - 代码的原因和用处的合理化。\n- 在代码背后，你可以找到关于代码的历史信息。\n- 版权信息、项目说明、贡献者致谢等。无需中断源代码的运行。\n\n然而，注释也有某些缺点：\n\
    \n- 它们必须随着代码的任何更改保持更新。\n- 通常，过多的注释会使代码更难理解。\n\n通过编写清晰、自解释的代码，可以减少对注释的需求。一个简单的例子是函数、变量等使用解释性名称。\n\
    \n### 使用标记注释禁用代码\n\n注释也可以用于在开发期间某些时候快速禁用部分代码而不将其删除。这在测试或调试期间非常有用，但不适用于除临时修改以外的任何情况。这通常被称为“注释掉”。\n\
    \n同样，在注释中保留代码的旧版本作为参考是不被鼓励的，因为这会弄乱文件，而且与使用版本控制方法调查代码历史相比，提供的价值很小。\n\n## 2.4 C++\
    \ 编译过程\n\n编译器通常用于生成可执行的 C++ 代码。\n\n编译器是一种将代码从一种计算机语言转换为另一种（额外的）的软件，计算机可以一次执行。编译是使用编译器转换代码。\n\
    \nC++ 的编译技术基于其“父级”语言 C。以下是 C++ 编译的四个基本步骤：\n\n1. C++ 预处理器将任何包含的头文件的内容插入源代码记录，创建宏代码，并将通过\
    \ `#define` 定义的符号常量的值替换为它们的值。\n2. C++ 预处理器生成的改进源代码文件被编译成平台相应的汇编语言。\n3. 编译器生成汇编代码，然后将其汇编成平台相应的对象代码。\n\
    \n"
