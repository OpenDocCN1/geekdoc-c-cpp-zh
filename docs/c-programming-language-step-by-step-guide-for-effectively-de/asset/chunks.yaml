    requirements (for example, should connect to a remote database) h. On subsystems,
    disclose rather than wrap selection is used.


    g. Tool for development and improvement.


    2\. Factors affecting operations, such as


    A. Performance


    B. Scripting abilities


    C. Customizability


    D. Internationalization


    E. Concurrency


    F. Reliability


    G. Extensibility


    H. Memory Utilization


    I. Security


    J. Availability


    Network bandwidth (K)


    It is the software program architect''s responsibility to prioritize these elements,
    in conjunction with the customer limits contained in the purposeful necessities,
    and to find the best compromises that result in a flexible and green layout. Designing
    an API with consideration for its intended target audience will only improve its
    usability and fulfilment.


