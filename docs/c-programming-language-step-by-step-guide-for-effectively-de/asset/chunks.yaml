    ## 7.2 Loop for


    While the loop situation is true, a `for` loop executes statements in the loop
    body. Before the loop initialization assertion is completed precisely once. The
    generation execution element is executed at the end of each cycle.


    The following is the definition of a `for` loop:


    ```cpp

    For (/*initialization*/, /*conditional statement*/, and /*iteration increment
    */),

    {

    / the body

    }

    ```


    Corrections to the placeholder statements:


    - **Initialization**: This statement is most easily completed at the start of
    the `for` loop. You may input a statement with several variables of the same type,
    such as `int I = 0, x = 1, y = 2`. These variables are only valid within the context
    of the loop. Variables with the same name as those described before the loop are
    hidden throughout loop execution.

    - **Conditional statement**: This declaration is evaluated prior to the execution
    of each loop body and aborts the loop if it evaluates to false.

    - **Iteration increment**: This assertion is completed after the loop body, prior
    to the next scenario evaluation, unless the `for` loop is aborted within the frame
    (by way of wreck, `goto`, `return` or an exception being thrown). You may enter
    a few statements into the generator execution component, such as `x++`, `y+=10`,
    and `z = x + y`.


    A `for` loop''s hard equivalent, rewritten as a `while` loop, is:


    ```cpp

    While (/*conditional statement*/) /*initialization of the while loop*/

    /* body of the while loop; usage of the continue keyword skips incrementing the
    remainder of the code below */

    /*condition for iteration increment*/

    }

    ```


    The most typical use of a `for` loop is to execute statements a predefined number
    of times. Consider the following as an example:


    ```cpp

    For(i = 0; I = 9; i++)

    {

    Cout << i << endl;

    }

    ```


    Similarly, a legal loop is:


    ```cpp

    For(x = 0, y = 5, z = 10; (x + y + z 100); z—, y++, x+= z) Cout x''y''z endl;

    ```


    Here''s an example of declaring variables and hiding them before a loop:


    ```cpp

    j = 100 int; / j = 100 int

    For(int j = 0; j ten; j++) /we declare a new variable j

    /a few operations, the cost of j levels ranging from 0 to 9 during loop execution

    }

    ```


    /Once the loop is completed, we can obtain entry to `j` with a value of 100.


    However, if you want to use the previously declared variable without hiding it,
    omit the declaration component:


    ```cpp

    j = 100 int; / j = 100 int

    For(j = 0; j 10; j++) /we are using the previously specified variable j.

    /during some operations, the value of j has ranged from 0 to 9 for the duration
    of the loop execution.

    }

    ```


    /Once the loop is completed, we can gain access to `I` for a fee of ten dollars.


    Notes:


    - If you want, the initialization and increment statements can conduct activities
    unrelated to the condition assertion, or they can do nothing at all. However,
    for clarity motivations, it''s miles a satisfactory exercise to only carry out
    activities that are immediately related to the loop.

    - A variable declared within the initialization announcement is only visible within
    the scope of the `for` loop and is launched at loop termination.

    - Remember that the variable declared in the initialization announcement, as well
    as the variable verified within the scenario, may be modified at some point in
    the loop.


