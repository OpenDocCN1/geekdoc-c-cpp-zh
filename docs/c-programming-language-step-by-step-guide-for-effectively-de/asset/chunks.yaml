    \ directive syntax.\n\n`\"FILENAME\"` must be included.\n\nThat is the user defined\
    \ file that we intend to incorporate in our code in order to gain its functionality.\n\
    \n## 2.2 Directive on Macro Definitions\n\n`#define`: This command is used to\
    \ define symbolic constants. Create a macro name `code`.\n\n`#undef`: Using the\
    \ `#undef` directive, macros in a programme defined with the `#define` directive\
    \ are closed until they are no longer defined. When the programme meets `#undef`,\
    \ the use of macro (undefined through `#undef`) will result in compilation failures.\n\
    \n### 2.2.1 Conditional Directives Compilation\n\nIn coding, directives such as\
    \ `if` and `else` are used. Some C++ conditional compilation directives:\n\n`#elif`\n\
    `#ifdef`\n`#if`\n`#endif`\n`#ifndef`\n`#else`\n\nThe `#` and double `##` operators\
    \ are used to turn a text token into a string.\n\n### 2.2.2 Additional directories\n\
    \n`#error`: When the compiler discovers an error in the source code, the error\
    \ directory causes the compiler to produce an error message.\n\n`#line`: this\
    \ directive instructs the compiler to replace the compiler's stored filename and\
    \ line number with the given filename and line number.\n\n`#pragma`: It offers\
    \ instructions for implementation.\n\n## 2.3 Comments\n\nA well-documented code\
    \ is an excellent workout for a programmer. It improves code readability and makes\
    \ spotting bugs easier. Comments are an essential component of effective documentation.\n\
    \nA remark is a programmer-readable justification or annotation within the source\
    \ code of a computer program. Comments are statements that have not been completed\
    \ by the compiler or interpreter. There are several types of feedback in C/C++:\n\
    \n- Single-line remark\n- Multiple-line remark\n\n`// single-line or solo comment`\n\
    \n`/* Comment on many lines */`\n\n### Comment in a single line\n\n`//` double\
    \ forward slash is how it's written. It is miles that is used to denote a single\
    \ line remark. It just applies remark to a single line. It's known as C++-style\
    \ comments because it's much an early component of C++ programming.\n\nAs an example:\n\
    \n```cpp\nint main() {\n    std::cout << \"Hello World\"; //single line remark\n\
    }\n```\n\n### Comment on several lines\n\n`/* any text */` begins with a forward\
    \ slash and an asterisk (`/*`) and ends with an asterisk and a forward slash (`*/`).\
    \ It's used to denote a multi-line remark. It can observe more than one line of\
    \ remark. Because it was delivered in C programming, it is known as a C-style\
    \ comment.\n\n```cpp\n/* How to Begin Sentene1\nSentence2 Sentence3 Sentence4\n\
    .\n.\n*Commentary concludes */\n```\n\n### Code\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    cout << \"Hello, World\";\n    return\
