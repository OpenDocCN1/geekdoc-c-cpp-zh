    }


    void total ( int a)


    {


    A is equal to a plus ten.


    }


    Result: 10


    Because we provide argument by value, the actual variable an is not modified in
    this case; instead, a copy of an is exceeded, which is changed, and that copied
    value is destroyed because the function terminates (is going out of scope). As
    a result, the variable an inside main () still has a price of 10.


    However, we will modify this application to change the unique a by making the
    procedure sum() yield a value and putting that price in x.


    void total ( int a)


    main int ( )


    {


    Cout a; Int a = 10; Sum (a);


    }


    void total ( int a)


    {


    A is equal to a plus ten.


    a should be returned;


    }


    Result: 20


    ### Call by Referral


    On this, we pass the variable''s cope with as arguments. In this situation, the
    formal parameter can be used as a reference or a pointer; in either case, the
    values of the authentic variable will be exchanged.


    (int *b) void sum


    main int ( )


    {


    Cout a; Int a = 10; Sum (&a);


    }


    (int *b) void sum


    {


    *b + 10 = *b


    }


    Result: 20


    Definition of Function


    The function definition is similar to the function declaration.


    The following is an example of a function declaration:


    Integer sum2 ( int a )


    {


    Return b; Int b = a+ 2;


    }


    Overloading of functions


    Object-oriented programming allows for overloading. Overloading occurs when two
    functions with the same name but different amount of arguments are used in the
    function.


    To summaries ( int a)


    {


    Return b; Int b = a + 2;


    }


    To summaries (int a , int b)


    {


    Return c; Int c = a + b + 2;


    }


    Both functions have the same name, but when a function is called, it is fully
    dependent on the parameters. Which function is invoked relies entirely on how
    many parameters are supplied to the function.


    Default settings


    In the function declaration, default values can only be set for the function''s
    parameters.


    Int add (int x, int y=5) /y has a default value of 5 Int add (int x, int y=5)
    ( int x, int y)


    {


    x + y = return;


    }


    ### Operators with Special Functions:


    In C++, there are unique function calls with better syntax than name-of-function
    (value 1, value 2, value3 ). The most common example is that of operators.


    Certain unusual character sequences, such as!, are on their way to being reduced
    to function calls via the compiler.


    , +, -, *, percentage, and many more. These special symbols are typically connected
    with non-programming applications or are employed for aesthetic purposes (for
    example, the + symbol is commonly known as the addition symbol both in C++ programming
    and in elementary mathematics).


    C++ has a specific syntax for handling man or woman sequences; nonetheless, in
    essence, every occurrence of an operator is reduced to a function name. As an
    example, consider the following C++ expression:


    5 + 5 =


    It is the same as calling the following function:


    Plus, operator (5, 5)


    All operator function names begin with the letter operator.


    While in C++''s immediate predecessor, C, operator function names cannot be assigned
    specific meanings by presenting supplementary definitions with specified type
    signatures, this is legal in C++. "Hiding" extra function definitions under a
    single feature call is known as operator overloading in C++, and it is a very
    common, but no longer standard, convention in C++.


    ### Preprocessor:


    The preprocessor is an essential component of the compiler. It modifies the source
    code by removing certain sections, transforming others, and introducing new information.
    We can include preprocessor directives in source files. These directives instruct
    the preprocessor to execute specific moves. A directive begins with a # on a new
    line.


    Example:


    #define 0 0


    The most common preprocessor directive you will encounter is the


    #include _the name of the file>


    Directive. It takes the entirety of something and inserts it into the record of
    how the directive came to be. The line "hello world global" is the first line
    of the application.


    iostream> should be included.


    This line of source code allows you to use standard input and output.


    C++ may make use of all of the C language''s header files. The C++ language has
    more header files than the C language.


    #define smth else


    This instructs the preprocessor that because it will be running alongside the
    file, it must replace every occurrence of something with something else. It could
    also make things comparable to features, although that would most likely be considered
    superior C++.


    The something else isn''t desired, but if you define something as not anything,
    then all occurrences of something will vanish outside of preprocessor directives.'
