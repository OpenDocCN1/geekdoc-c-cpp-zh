  trans: "\n用例不应过度细节化。实例必须解释系统的黑盒功能；也就是说，不应指定任何实现细节信息。你还应该避免在用例中包含过多的元素。Alistair Cockburn\
    \ 使用了向糖果机投入硬币的例子。与其尝试指定插入相应金额的独特组合，例如“角色插入三枚四角币，或 15 枚镍币，或一枚四角币后跟 10 枚镍币”，不如简单地写“人员插入硬币”。\n\
    \n并不是所有的需求都通过用例示例来定义。用例并不包含所有可能积累的需求类型。例如，它们不描述系统结构、功能列表、规则集规范或任何其他不以客户为中心的机器元素。用例强调的是消费者必须与\
    \ `API` 交互的行为准则。你可能仍然希望构建实际的非功能性需求，以便应用示例。\n\n实例不用于勾勒布局。虽然用例通常可以用于生成高层次的初步布局，但你不应该掉入“认为用例会自动定义满意布局”的陷阱。其中一个原因是它们没有定义所有的需求。例如，它们没有描述\
    \ `API` 的性能、安全或网络元素，这些元素会对特定设计产生重大影响。此外，用例是从客户的角度产出的。与其过于严肃地对待它们，在出现冲突或模糊的愿景时，你应该重新解读它们的反馈（Meyer,\
    \ 1997）。\n\n在用例中，不要指定设计。人们普遍认为，你应该避免在用例中指定用户界面，因为 `UI` 是一种设计而非需求，而且 `UI` 设计是特别容易改变的（Cockburn,\
    \ 2000）。虽然这一概念并不总是能立即适用于 `UI`，更不用说 `API` 设计了，但它可以通过声明“你应该将 `API` 布局的细节排除在用例之外”来将其应用于我们的情况。用户也可能尝试提交一个特定的解决方案，希望它能被实现，然而针对该问题可能存在更好的答案。`API`。\n\
    \n根据你对用例的评估，你的布局必须遵循它。换句话说，用例定义了用户想要如何实现目标，无论实际布局如何。\n\n用例可以指导测试。因为用例没有提供唯一的输入和输出值，所以执行实例本身并不是检查计划。然而，它们勾勒了消费者期望获得的关键工作流。因此，它们是引导自动化测试针对你的\
    \ `API` 的极佳来源。编写一组验证这些核心工作流的测试，将让你确保你已经满足了客户的预期，并且在未来演进 `API` 时不会破坏这些功能。\n\n预期的迭代。不要过度担心第一次就写对所有的用例。用例分析是一个发现过程，让你更多地了解你想要设计的设备。因此，将其视为一个迭代过程，随着你对整个机器的知识的增加，你可以修改当前的用例（alexander,\
    \ 2003）。然而，通常人们公认的是，需求上的偏差可能对任务产生重大影响，导致大量的重新设计和重新实现工作。这就是为什么我的第一条建议变成了“避免让你的用例实例过于具体”。\n\
    \n不要期望完全覆盖。你不应该再期望你的用例能传达 `API` 的所有组件，这与用例不包含所有类型的需求的原因是一致的。然而，你可能并不要求它们覆盖所有内容。机器的某些组件可能已经得到了很好的理解，或者不需要以用户为导向的视角。还有一个实际问题是，由于你没有无限的时间资源来编写详尽的用例，你必须将精力集中在最重要的面向用户的目标和工作流上。\n\
    \n## ![](img/image00121.jpeg)12.4 架构限制\n\n架构并不是在真空中创建的。几乎总会有影响并约束结构的元素。在正式开始设计过程之前，你必须识别并适应这些元素。Christine\
    \ Hofmeister 和她的同事将这一部分称为“全局分析”（Hofmeister et al., 2009）。在此语境下，“国际（international）”意味着这些方面对设备具有全面影响，并且它们作为一个整体经常相互关联且相互冲突。这些元素可以分为三类。\n\
