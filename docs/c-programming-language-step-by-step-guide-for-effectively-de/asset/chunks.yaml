    \ 引言\n\n1979 年开始，比雅恩·斯特拉斯鲁普（Bjarne Stroustrup）在贝尔实验室作为 `C` 语言的扩展开发了 `C++`。`C++`\
    \ 为 `C` 语言增加了许多新功能，可以被视为 `C` 的超集，但这种说法并不完全准确（因为 `C99` 增加了一些 `C++` 并不具备的能力）。`C++`\
    \ 的声誉主要源于它是一门面向对象的编程语言。我们将在第八章（简单的项目导向编程）中讨论什么是对象，以及它与传统的编程技术有何不同。\n\n"
- fmt: "\n7. Variables in C++ can be defined everywhere and everywhere in the programme,\
    \ but they must be declared before they can be utilised.\n\n![](Images/image00106.jpeg)\n\
    \nThis note presents a few simple C++ principles and describes a subset of C++\
    \ that is easier to learn and apply than the other languages. Although this note\
    \ was originally prepared to explain the C++ used in the Nachos challenge, it\
    \ is extremely valuable to anyone studying C++. Most individuals are already familiar\
    \ with C notions such as procedures, for loops, and pointers; these are easy to\
    \ pick up from reading Kernighan and Ritchie's \"The C Programming Language.\"\
    \n\nThere are a few C++ purists (possibly an oxymoron?). Who vehemently disagrees\
    \ with some of the prescriptions stated right here; most of the arguments are\
    \ of the kind, how could you possibly have excluded function X?\"\n\nThe primary\
    \ idea of this notice is that, while object-oriented programming is a great method\
    \ to simplify programmes, C++ is a grossly over-complicated language with a slew\
    \ of capabilities that are better used very, very rarely. It is no longer a stretch\
    \ to state that C++ offers every programming language feature ever envisioned,\
    \ and more. When confronted with a brand-new language function, the natural impulse\
    \ is to try to use it, however in C++, this strategy results in disaster. As a\
    \ result, users must carefully discern between:\n\n1. The fundamental ideas (e.g.,\
    \ `classes`, `member functions`, `constructors`) that everyone should understand\
    \ and use.\n2. Those that are frequently but infrequently useful (e.g., `single\
    \ inheritance`, `templates`) and that rookie programmers should be able to grasp\
    \ (in case they come across them) but avoid using their very own packages for\
    \ a while.\n3. Those that are simply a bad idea and should be avoided like the\
    \ plague (e.g., `multiple inheritance`, `exceptions`, `overloading`, `references`,\
    \ and many others).\n\nOf course, all of the objects in this last category have\
    \ supporters, and one must admit that, like the reviled `goto`, it is possible\
    \ to assemble circumstances while the programme would benefit from the use of\
    \ a `goto` or multiple inheritance. However, it is common knowledge that most\
    \ programmers will never come into such circumstances, and even if they do, the\
    \ user is much more likely to misuse the feature than properly use it.\n\nSome\
    \ advantages of utilising C++ include:\n\n1. **Maintainability**: changing code\
    \ is less difficult because it just requires a few textual content changes as\
    \ opposed to rearranging a large number of processor instructions. C++ is object-oriented,\
    \ which enhances maintainability even further.\n2. **Portability**: different\
    \ processors provide different instructions. Packages written in text may be converted\
    \ into instructions for numerous different processors; one of C++'s benefits is\
    \ that it can be used to write apps for almost any CPU.\n3. **Conciseness**: Programming\
    \ languages allow us to express typical command sequences in a more concise manner.\
    \ C++ has some particularly effective shortcuts.\n\nC++ is a compiled programming\
    \ language:\n\n```\nC++\nThe Source Code\n1001100100\nMachine code.\nCOMPILE\n\
    ```\n\nC++ includes the letter C.\n\nC++ is a superset of C to a large extent,\
    \ and most correctly written ANSI C will compile as C++. However, there are certain\
    \ important caveats:\n\n1. All function and definition header declarations should\
    \ utilise new-style declarations, such as `extern int foo(int X, char* Y);`.\n\
    2. Rather than using the default type `int`, all functions must be declared before\
    \ they are utilised.\n3. If you want to link C objects with C++, you must do the\
    \ following when declaring C capabilities for C++:\n```\nint foo(int X, char*\
    \ Y); extern \"C\"\n```\nIn any other scenario, the C++ compiler will change the\
    \ name in an unusual way.\n4. The form `extern int foo();` method that `foo` takes\
