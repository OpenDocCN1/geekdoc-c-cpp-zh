    \ a literal character string. It is a text that will be printed. Text is always\
    \ put inside quotation mark.\n\nSemicolon (`;`): It is the notification to the\
    \ compiler that the statement has been ended.\n\n### 2.1.2 File Inclusion Instructions\n\
    \nThe file inclusion directive `#include` enables us to include various files\
    \ in our source code. In our code, we shall include any header record that provides\
    \ definitions of several preset features. The following syntax can be used to\
