    \ programming (`OOP`).\n\n# Chapter 2\n\n## ![](Images/image00108.jpeg)2.1 How\
    \ to Begin with C++\n\n### 2.1.1 Program Hello World\n\n```cpp\n#include <iostream>\n\
    int main() {\n    std::cout << \"Hello World\";\n    return 0;\n}\n```\n\nExamination\
    \ of the code:\n\nIt is a preprocessor directive to include `<iostream>`. The\
