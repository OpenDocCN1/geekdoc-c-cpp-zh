  trans: "\n\n## Functions\n\n函数是代码的单元，表示构建可执行程序所需的一系列语句。需要注意的是，少量的编译代码被链接在一起但并未形成最终的应用程序。许多\
    \ C++ 编译器还可以使用专门工具对函数进行合并或拆分，这些工具涉及了 `Images/image0010.jpeg` 的创建。\n\n### 5. Function\n\
    \n函数是一个表示系列语句的单元。函数可以接受参数，也可以只返回一个值（或不返回）。函数调用用于执行函数。许多 C++ 程序员使用专门的工具，但所有工具通常都遵循程序的创建规则。\n\
    \n函数名通过其返回类型进行修饰。每个函数都有签名，包括它的参数和返回类型。在程序的其他地方调用函数之前，必须对其进行声明和定义。需要注意的是，C++ 函数本质上是方法，而不是法律。\n\
    \n### 函数声明\n\n函数实现了代码的模块化并有助于理解。使用函数使得捕获错误等变得变得于许多。声明函数的根本语法如下：\n\n```cpp\nfunctionName(parameter1,\
    \ parameter2)\n{\n    // function body\n}\n```\n\n### 返回类型\n\n这指示函数在被调用时将返回的内容。它可以是\
    \ `char`、指针或 `int`。可能存在不返回任何内容的函数；这些函数具有 `void` 返回类型。函数通过其名称被引用。参数是存储在调用函数时提供的参数值的变量。函数可能包含也不包含参数列表。\n\
    \n```cpp\nint sum2(int a);\n```\n\n### 调用函数\n\n函数通过其名称识别。如果在不带参数的情况下调用函数，可以立即识别。然而，对于带有参数的函数，我们有两种选择：\n\
    \n*   按值传递\n*   按引用传递\n\n### 按值传递\n\n我们将已存储或复制的参数值传递给函数的形式参数以执行此调用过程。结果是，原始值保持不变；只有参数内部的值发生了变化。\n\
    \n```cpp\nvoid total(int a)\nint main()\n{\n    cout << a;\n    int a = 10;\n\
    \    total(a);\n}\n\nvoid total(int a)\n{\n    a = a + 10;\n}\n```\nResult: 10\n\
    \n由于我们通过值提供参数，在这种情况下实际变量 `a` 没有被修改；相反，`a` 的副本被修改，并且该副本值在函数终止（超出作用域）时被销毁。因此，`main()`\
    \ 的变量 `a` 仍然为 10。\n\n然而，我们将修改此应用程序，通过让过程 `sum()` 返回一个值并将该值放入 `x` 来改变唯一的 `a`。\n\
    \n```cpp\nint total(int a)\nint main()\n{\n    cout << a;\n    int a = 10;\n \
    \   total(a);\n}\n\nint total(int a)\n{\n    return a + 10;\n}\n```\nResult: 20\n\
    \n### 按引用传递\n\n在这里，我们将变量的地址作为参数传递。在这种情况下，形式参数可以使用引用或指针；无论何种情况，真实变量的值将被交换。\n\n\
    ```cpp\nvoid sum(int *b)\nint main()\n{\n    cout << a;\n    int a = 10;\n   \
    \ sum(&a);\n}\n\nvoid sum(int *b)\n{\n    *b + 10 = *b;\n}\n```\nResult: 20\n\n\
    ### 函数定义\n\n函数定义与函数声明相似。以下是一个函数声明的示例：\n\n```cpp\nint sum2(int a)\n{\n    int b\
    \ = a + 2;\n    return b;\n}\n```\n\n### 函数重载\n\n面向对象的编程允许重载。当在函数中使用两个名称相同但参数数量不同的函数时，就会发生重载。\n\
    \n```cpp\nint summaries(int a)\n{\n    int b = a + 2;\n    return b;\n}\n\nint\
    \ summaries(int a, int b)\n{\n    int c = a + b + 2;\n    return c;\n}\n```\n\n\
    这两个函数都具有相同的名称，但在 C++ 中，它们通过参数列表进行区分。每个函数都有一个类型，包括它的参数和返回类型。`int sum2(int a)` 是\
    \ `int` 类型。返回类型是 `int`。`sum2` 是函数的名称。该函数只接受一个参数。\n\n"
