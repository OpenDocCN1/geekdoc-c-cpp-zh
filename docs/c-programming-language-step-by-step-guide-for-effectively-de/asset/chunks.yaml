- fmt: "\nUse cases should not be over-specified. Instances must explain a system's\
    \ black-box functionality; that is, no implementation information should be specified.\
    \ You should also avoid including an excessive number of elements in your use\
    \ cases. Alistair Cockburn uses the example of putting money into a candy machine.\
    \ Instead of attempting to specify unique combinations of inserting the appropriate\
    \ amount, such as \"character inserts three quarters, or 15 nickels, or a quarter\
    \ followed by 10 nickels,\" simply write \"person inserts money.\"\n\nAll requirements\
    \ are not defined by use examples. Use cases do not include all possible types\
    \ of requirements accumulating. They do not, for example, describe system structure,\
    \ feature lists, set of rules specifications, or any other machine elements that\
    \ are not customer centric. Use cases emphasize on behavioral criteria for how\
    \ the consumer must interact with the `API`. You may still wish to construct practical\
    \ and non-functional requirements in order to apply examples.\n\nInstances are\
    \ not used to outline a layout. While use cases can usually be used to generate\
    \ a high-level preliminary layout, you should not fall into the trap of believing\
    \ that use cases automatically define the satisfactory layout. One reason is because\
    \ they do not define all requirements. For example, they do not describe the `API`'s\
    \ performance, security, or network elements, which could have a significant impact\
    \ on the specific design. In addition, use cases are produced from the perspective\
    \ of customers. Instead of treating them too seriously, you should misinterpret\
    \ their feedback in the case of conflicting or obscure dreams (Meyer, 1997).\n\
    \nIn use cases, do not specify design. It's widely accepted that you should avoid\
    \ specifying user interfaces in use cases since `UI` is a design, not a requirement,\
    \ and because `UI` designs are especially changeable (Cockburn, 2000). While this\
    \ concept isn't always immediately applicable to `UI`-much less `API` design,\
    \ it may be applied to our situation by stating that you should keep `API` layout\
    \ specifics out of your use cases. Users may also attempt to submit a specific\
    \ remedy in the hope that it would be implemented, however better answers to the\
    \ problem may exist. `API`.\n\nAs a result of your use case evaluation, your layout\
    \ must adhere to it. In other words, use cases define how a user wants to achieve\
    \ a goal regardless of the actual layout.\n\nUse cases can guide testing. Because\
    \ they do not provide Unique input and output values, usage instances are not\
    \ check plans in and of themselves. They do, however, outline the critical workflows\
    \ that your consumers expect to acquire. As such, they're an excellent source\
    \ for directing automated testing efforts to your `API`. Writing a set of tests\
    \ that validate these essential workflows will give you assurance that you have\
    \ met your customers' expectations and that you will not break this functionality\
    \ as you evolve the `API` in the future.\n\nExpect to iterate. Don't be overly\
    \ concerned about getting all of your use cases right the first time. Use case\
    \ analysis is a discovery process that allows you to learn more about the device\
    \ you want to design. As a result, consider it as an iterative process in which\
    \ you can modify current use cases as you gain knowledge of the entire machine\
    \ (alexander, 2003). However, it is commonly acknowledged that inaccuracies in\
    \ needs can have a significant influence on a task, necessitating significant\
    \ redesign and reimplementation efforts. This is why my first piece of advise\
    \ changed into to avoid making your use instances overly specific.\n\nDon't expect\
    \ complete coverage. You should no longer expect your use cases to convey all\
    \ components of your `API` for the same reasons that use cases do not contain\
    \ all types of requirements. However, you may not require them to cover everything.\
    \ Some components of the machine may also already be well understood or do not\
    \ require a user-directed angle. There's also the practical issue that, because\
    \ you won't have unlimited time and resources to compile extensive use cases,\
    \ you must focus your efforts on the most important user-oriented goals and workflows.\n\
    \n## ![](Images/image00121.jpeg)12.4 Architecture Restrictions\n\nArchitecture\
    \ is not created in a vacuum. There will almost always be elements that influence\
    \ and constrain the structure. Before you can begin the designing process in earnest,\
    \ you must first identify and accommodate for those elements. Christine Hofmeister\
    \ and her colleagues refer to this section as global analysis (Hofmeister et al.,\
    \ 2009). The term international in this context denotes that the aspects have\
    \ a comprehensive impact on the device and that they are frequently interconnected\
    \ and conflicting as a group. These elements can be divided into three categories.\n\
    \n1. Organizational factors, as well as a. Finances\n   a. Agenda\n   b. Team\
    \ size and expertise\n   c. Procedure for enhancing software program\n   d. Subsystem\
    \ construction vs. purchase decision\n   e. Control identification (e.g., date\
    \ as opposed to feature as opposed to exceptional).\n2. Environmental factors\
    \ such as\n   a. Computer hardware (e.g., set-pinnacle field or cell tool)\n \
    \  b. The platform (e.g., home windows, Mac, and Linux)\n   c. Constraints of\
    \ software (e.g., use of other `api`)\n   d. Constraints on customer/server (e.g.,\
    \ constructing a web carrier)\n   e. Protocol limitations (e.g., POP vs IMAP for\
    \ a mail patron)\n   f. Record format limits (for example, must support GIF and\
    \ JPEG images)\n   g. Database requirements (for example, should connect to a\
    \ remote database)\n   h. On subsystems, disclose rather than wrap selection is\
    \ used.\n   g. Tool for development and improvement.\n3. Factors affecting operations,\
    \ such as\n   A. Performance\n   B. Scripting abilities\n   C. Customizability\n\
    \   D. Internationalization\n   E. Concurrency\n   F. Reliability\n   G. Extensibility\n\
    \   H. Memory Utilization\n   I. Security\n   J. Availability\n   Network bandwidth\
    \ (K)\n\nIt is the software program architect's responsibility to prioritize these\
    \ elements, in conjunction with the customer limits contained in the purposeful\
    \ necessities, and to find the best compromises that result in a flexible and\
    \ green layout. Designing an `API` with consideration for its intended target\
    \ audience will only improve its usability and fulfilment.\n\n# Chapter 13\n\n\
    ## ![](Images/image00122.jpeg)13.1 Templates\n\nBecause C++ supports both templates\
    \ and dynamic dispatch, they can be mixed in ways that can be rather complex.\
    \ Alternatively, it's a fascinating question whether the growing power of templates\
    \ in C++ makes inheritance less important than it was thought to be in the 1990s.\
    \ The C++ general library is currently referred as as the standard Template Library\
    \ (`STL`), and templates appear to be more relevant to its design than complex\
    \ deep magnificence hierarchies.\n"
