    \      cout << \"id\" << \"name\" << \"college\" << endl;\n    }\n};\n```\n\n\
    #### main(void) Integer\n\n```cpp\nS1.display(); \nS2.display(); \nStudent S1\
    \ = Student(01, \"Elsa\", \"AIC\"); \nStudent S2 = Student(04, \"John\", AIC);\
    \ \nS1.display();\nS2.display();\nreturn 0;\n```\n\n### The null pointer\n\nIt\
    \ is used to represent the null pointer as a constant. It is converted to a pointer\
