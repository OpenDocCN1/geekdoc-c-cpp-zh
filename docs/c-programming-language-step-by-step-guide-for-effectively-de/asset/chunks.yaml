    ### 4.1.3 Logical Operators AND and OR


    AND operator: In C++, the AND operator takes precedence over the OR operator.
    And the logical operator returns true only if both requirements are met.


    can open account = have cnic + have source of income + age >= 18;


    OR logical operator: The OR logical operator returns true if either of the two
    conditions is true.


    can drive car = has foreign lic | | has domestic lic;


    ### 4.1.4 Arithmetic Operators


    Arithmetic operators are treated similarly to how they are treated in mathematics,
    with the same level of precedence in C++.


    Multiplication and division can be solved associatively. For example, if you have
    multiplication and division in the code at the same time, they will be evaluated
    from left to right, with whichever comes first being evaluated first from left
    to right.


    The usage of parentheses might imply precedence. In both mathematics and C++,
    () parentheses take priority.


    Addition:


