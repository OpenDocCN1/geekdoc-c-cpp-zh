    \nThe suffix is unsigned. It's the letter `u` or `U`.\n\n```cpp\nu 1 (unsigned\
    \ int) = 52u;\n```\n\n#### Note:\n\n*   Inside the integer literals, letters are\
    \ case-insensitive: `0xdeadbabeu` and `0xdeadbabeu` indicate the same broad variety\
    \ (one exception is the lengthy-lengthy-suffix, which is either `ll` or `LL`,\
    \ in no way `ll` or `Ll`).\n*   There are no dreadful integer literals. Expressions\
    \ like `-1` apply the unary subtraction operator to the value represented by the\
