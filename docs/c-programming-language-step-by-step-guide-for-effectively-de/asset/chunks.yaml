    # ![](Images/image00105.jpeg)INTRODUCTION


    Beginning in 1979, Bjarne Stroustrup at Bell Labs developed C++ as an extension
    to C. C++ adds numerous new functions to the C language and can be thought of
    as a superset of C, however this is not exactly correct (since C99 added a few
    capabilities that C++ does not have). C++''s reputation stems mostly from the
    fact that it is an object-oriented programming language. We''ll talk about what
    an object is and how it differs from traditional programming techniques in Chapter
    8\. (simple item-orientated programming). C++ became standardised in 1998 by the
    ISO committee (this means that the ISO committee ratified a document detailing
    the C++ language, to help ensure that all compilers adhered to the same set of
    standards). In 2003, a minor update (dubbed C++03) was released. Since then, three
    major improvements to the C++ language (C++11, C++14, and C++17, certified in
    2011, 2014, and 2017, respectively) have been produced, each adding greater functionality.
    C++ 11 in particular introduced a wide range of additional capabilities, and the
    new baseline is being heavily considered. As of this writing, C++ 20 is in the
    works, promising even more new possibilities. The language is expected to be upgraded
    every three years or so.


    Every new formal release of the language is referred to as a language fashionable
    (or language specification). Standards are named after the year they are expected
    to be released. For example, there is no C++15 because there was no new well-known
    code in 2015.


    C++ is a statically typed, compiled, general-purpose, case-sensitive, loose-form
    programming language that can be used for procedural, object-oriented, or standard
    programming. C++ is classified as a middle-level language since it combines high-level
    and low-level language features. C++ is a superset of C, which means that every
    lawful C application/program is also a legal C++ application.


    The main distinction is in the concept of OOP; C++ is an object oriented language,
    whereas C is merely a procedural language. Aside from this distinction, there
    are several characteristics of C++ that give it an advantage over the C language.
    Because of these features, C++ has an advantage over C.


    C++''s characteristics make it a more powerful language than C:


    1\. C++ has improved type checking.


    2\. All of the OOPS methods in C++, such as Abstraction, Encapsulation, Inheritance,
    and many others, make it more valuable and beneficial to any programmer who uses
    the C++ language.


    3\. C++ facilitates and allows customer defined operators (i.e. Operator Overloading),
    as well as function overloading.


    4\. C++ handles exceptions and their handling.


    5\. The concept of virtual functions, as well as Constructors and Destructors
    for objects.


    6\. C++ has inline capabilities as compared to Macros in the C programming language.
    Inline capabilities cause the entire characteristic body to behave as if it were
    Macro, totally and terribly.'
