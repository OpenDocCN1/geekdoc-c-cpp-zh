    \ a = 2 % 2;\n```\n\n# Chapter 5\n\n## ![](Images/image00112.jpeg) 5.1 Operators\
    \ for bits\n\n### 5.1.1 OR (bitwise)\n\n```cpp\nInteger x = 6; // 0110b\nInteger\
