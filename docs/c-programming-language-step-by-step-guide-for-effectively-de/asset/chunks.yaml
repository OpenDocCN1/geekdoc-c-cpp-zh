    **脆弱性 (Fragility)**：当软件程序产生不可预见的副作用，或者实现细节暴露的程度以至于机器上表面不相关的组件依赖于机器其他部分的内部实现时，程序就会变得脆弱。结果，对系统至少一个区域的修改可能会在代码中看似无关的部分产生意外错误。因此，工程师害怕触碰代码，代码将成为维护的负担。


    **僵性 (Rigidity)**：缺乏灵活性的软件是指抵抗变化的软件。结果是布局变得脆弱，以至于即使是微小的变化也必须付出巨大的努力才能实现，这通常需要大量、耗时且不稳定的重构。最终结果是一个粘稠的代码库，它显著减慢了进行新改进的努力。


    **不动性 (Immobility)**：聪明的工程师会识别出可以复用 `code` 来提高软件可维护性和稳定性的实例。静态代码是指不受这些努力影响软件，使其难以在其他地方复用。例如，实现可能与其周围代码过度纠缠，或者可能硬编码了特定领域的知识。


    **不可迁移性 (Non-transferability)**：如果你的公司只有一名工程师能够处理代码的优秀部分，则称它是不可迁移的。所有者通常是最初编写代码的开发者，或者是试图简化代码的倒霉个人。对于许多大型代码库来说，让每个工程师都彻底理解代码的每一个元素已不再可行，因此，拥有工程师无法轻松深入并有效处理的区域，对于你的任务来说是一个糟糕的状况。


    由于这些问题，组件之间形成了依赖关系，导致概念无关的代码组件相互依赖它们的内部实现细节。随着时间的推移，这导致软件的大部分逻辑变成了全局性的或被复制。这被称为面条代码（spaghetti
    code）或巨大的大尘球。


    ## 12.2 长期规划


    替换退化代码库的大型下一代工程可能耗费一家公司数百万美元。例如，支付一个由 20 名开发人员、测试人员、作者和经理组成的团队一年的工资（平均工资 100,000
    美元）需要 2,000,000 美元。另一方面，遵循卓越的设计原则有助于防止这种极端的行动。让我们先列出导致这种困境的一些可能原因。


    a. 公司从初根本没有构建稳固的软件设计，因为它认为这会浪费大量的时间和金。


    b. 项目工程师要么不知道良好的设计技术，要么认为这些技术不适用于他们的项目。


    c. 代码从未打算长期存在，例如，它是为了演示或作为丢弃型原型代码而快速开发的。


    d. 因为软件开发过程没有让技术债可见化，所有需要修正的系统元素的知识随着时间的推移而丢失或遗忘。（敏捷流程，如 `Scrum`，尝试通过产品待办列表来保持债务可见。）


    e. 起初系统构建得很好，但其布局由于不受控的扩展随时间逐渐侵蚀。允许对代码进行错误的更改（即使这些更改危害了设备的设计）就是一个例子。根据弗雷德·布鲁克斯的话，系统失去了概念完整性。


    f. 变化的需求要求设计也随之调整，但组织始终刻意或无意地推迟这项重构工作，转而采用短期修复、补丁和胶水代码。


    g. 允许 Bug 长期存在。这通常是因为倾向于不断增加更多功能，而不关注最终产品的整体质量。h. 因为代码中没有检查，当工程师限制功能时，回归会侵入系统，代码库的某些区域最终恶化为工程师害怕进行更改的恐怖荒野。


    这解决了这些问题中的几个。首先，有一种误解认为顶层布局会让你过度变慢。实际上，开发设计松散的软件可能是最便宜的通用方案，可以让你更快进入市场，一旦你在市场上立足，再完全重新设计代码。此外，构建适当软件程序的许多组件可能看起来更耗时，例如编写额外的代码来完善你的指令，或编写单元测试来验证你的
    `APIs` 的性能。另一方面，顶层设计并不像你想的那么长时间，而且从长期来看是有回报的。接口和实现之间保持强分离即使在短期内也能在代码维护性方面带来回报，开发自动化测试带给你快速切换功能而不影响现有行为的信心。值得注意的是，Michael
    Feathers 将遗留代码定义为未经测试的代码，使得这一因素相关。


    遗留并不意味着古老；你今天就可以编写遗留代码。`APIs` 的美丽之处在于，底层实现可以像你希望那样简单肮脏，也可以像你想要那样复杂时尚。良好的 `API`
    设计意味着创建一个稳定的逻辑接口来解决问题。然而，该 `API` 底层的代码最初可以是简单且低效的。之后，你可以在不破坏逻辑布局的情况下增加更多的实现复杂度。类似，`APIs`
    允许你将问题缩小到特定的添加。通过管理组件之间的依赖关系，你可以减少问题的数量。而在面条代码中，每个方面都依赖于其他组件的内部，行为是非正交的，一个项目中的错误可能会以不明显的方式影响其他元素。因此，核心信息是花时间建立适当的高层布局，以识别添加之间的依赖和关系。这是这种破产最重要的认知。另一个问题是，如果你不对代码质量保持高标准，独特的布局随着代码的演变逐渐化。为了截止日期而走捷是可以的，只要你下次正确这样做即可。考虑尽快偿还技术债。代码倾向于比你预期的寿命长得多。在削弱
    `API` 时记住这一点至关重要，因为你可能需要在未来长时间协助效果。因此，理解近期需求对 API 设计的影响并更改代码以保持一致且更新的架构至关重要。对你的
    `API` 执行控制也是重要的，以防止它以不受监控或混乱的方式进化。我将在第 8 章讨论 API 版本时讨论如何实现这些目标。


    ## 12.3 有用案例


    使用领域特定术语。对于 API 消费者，用例应该以自然语言句子呈现。客户必须熟悉可以使用的术语，并且这些术语必须来自所关注的领域。因此，消费者必须能够毫不费力地检查用例并理解场景。


