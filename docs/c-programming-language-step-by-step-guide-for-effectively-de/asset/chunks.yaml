    time; otherwise, the capability will remain the same.


    To inline a feature, place the keyword inline before the feature name and define
    the function before any calls to the feature. If the defined function is longer
    than a line, the compiler can ignore the inline qualifier.


    Even if the inline specifier is not used, a function definition in a category
    definition is an inline function definition.


