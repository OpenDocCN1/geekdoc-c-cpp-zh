    ## 7.2 for 循环


    当循环情况为真时，`for` 循环会执行循环体内的语句。在循环初始化断言完成之前会精确地执行一次。生成执行执行元素在每个循环结束时执行。


    以下是 `for` 循环的定义：


    ```cpp

    For (/*initialization*/, /*conditional statement*/, and /*iteration increment
    */),

    {

    /主体

    }

    ```


    对占位符语句的修正：


    - **初始化**：该语句最容易在 `for` 循环开始时完成。你可以输入一个带有多个相同类型变量的语句，例如 `int I = 0, x = 1, y =
    2`。这些变量仅在循环上下文中有效。与循环前描述同名的变量在整个循环执行期间是隐藏的。

    - **条件语句**：该声明在执行每个循环体之前求值，如果求结果为假，则中止循环。

    - **迭代增量**：该断言在循环体之后、下一次场景评估之前完成，除非 `for` 循环在框架内中止（通过 `break`、`goto`、`return`
    或抛出异常）。你可以在生成执行组件中输入几个语句，例如 `x++`、`y+=10` 和 `z = x + y`。


    `for` 循环的等价形式重写为 `while` 循环是：


    ```cpp

    While (/*conditional statement*/) /*initialization of the while loop*/

    /* while 循环体; 使用 continue 关键字跳过下面剩余代码的增量 */

    /*迭代增量的条件*/

    }

    ```


    `for` 循环最典型的用法是执行指定次数的语句。考虑以下示例：


    ```cpp

    For(i = 0; I = 9; i++)

    {

    Cout << i << endl;

    }

    ```


    同样，一个合法的循环是：


    ```cpp

    For(x = 0, y = 5, z = 10; (x + y + z 100); z—, y++, x+= z) Cout x''y''z endl;

    ```


    这是一个在循环之前声明变量并隐藏它们的示例：


    ```cpp

    j = 100 int; / j = 100 int

    For(int j = 0; j ten; j++) /我们声明了一个新变量 j

    / 几次操作，在循环执行期间，j 的层级范围从 0 到 9

    }

    ```


    /一旦循环完成，我们可以获得值为 100 的 `j` 的入口。


    然而，如果你想在不隐藏它的情况下使用之前声明的变量，请省略声明组件：


    ```cpp

    j = 100 int; / j = 100 int

    For(j = 0; j 10; j++) /我们正在使用之前指定的变量 j。

    / 在某些操作期间，j 的值在整个循环执行期间范围从 0 到 9。

    }

    ```


    /一旦循环完成，我们可以以十美元的费用访问 `I`。


    注意：


    - 如果你愿意，初始化和增量语句可以执行与条件断言无关的活动，或者什么都不做。然而，出于清晰性考虑，只执行与循环直接相关的活动是一项满意的练习。

    - 在初始化声明中声明的变量仅在 `for` 循环的作用范围内可见，并在循环终止时启动。

    - 记住，初始化声明中声明的变量以及在场景内验证的变量可能会在循环的某处被修改。


