    \ decimal values that do not fit in lengthy int are allowed to have the kind unsigned\
    \ lengthy int in C prior to C99 (but no longer in C++).\n*   When used in a controlling\
    \ expression of `#if` or `#elif`, all signed integer constants behave as if they\
