    As a result of your use case evaluation, your layout must adhere to it. In other
    words, use cases define how a user wants to achieve a goal regardless of the actual
    layout.


    Use cases can guide testing. Because they do not provide Unique input and output
    values, usage instances are not check plans in and of themselves. They do, however,
    outline the critical workflows that your consumers expect to acquire. As such,
    they''re an excellent source for directing automated testing efforts to your API.
    Writing a set of tests that validate these essential workflows will give you assurance
    that you have met your customers'' expectations and that you will not break this
    functionality as you evolve the API in the future.


    Expect to iterate. Don''t be overly concerned about getting all of your use cases
    right the first time. Use case analysis is a discovery process that allows you
    to learn more about the device you want to design. As a result, consider it as
