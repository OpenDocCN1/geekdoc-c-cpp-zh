    ## 7.6 Loop control statements: Continue after a brief break


    Loop control statements are used to modify the execution flow from its normal
    collection. When execution exits a scope, all computerized objects generated within
    that scope are destroyed. The loop control statements are `break` and `retain`.


    **Break**: Using the `break` statement, you can exit the loop immediately. The
    control is removed from the loop.


