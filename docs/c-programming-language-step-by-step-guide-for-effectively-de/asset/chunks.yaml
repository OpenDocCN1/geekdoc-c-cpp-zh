  trans: "\n7. C++ 中的变量可以在程序的任何地方定义，但在使用它们之前必须进行声明。\n\n![](img/image00106.jpeg)\n\n\
    本笔记介绍了一些简单的 C++ 原则，并描述了这部分比其他语言更容易学习和应用的 C++ 子集。尽管本笔记最初是为了解释在 Nachos 挑战中使用的 C++，但它对任何学习\
    \ C++ 的人来说都极具价值。大多数人已经熟悉 C 语言的概念，如过程、for 循环和指针；这些内容通过阅读 Kernighan 和 Ritchie 的《C\
    \ 编程语言》可以轻松掌握。\n\n有少数几个 C++ 纯主义者（这可能是一个自矛盾的词？）。他们强烈反对此处处列出的某些规定；大多数的论点都是之类的：“你怎么可能排除函数\
    \ X 呢？”\n\n本公告的核心思想是，虽然面向对象编程是简化程序的一种棒方法，但 C++ 是一种极其复杂的语言，拥有许多本应该非常、非常少使用的功能。说\
    \ C++ 提供了人们想象过的每一个编程语言功能甚至更多，也并不夸张。当面对一个全新的语言功能时，人的本能是尝试使用它，但在 C++ 中，这种策略会导致灾难。因此，用户必须仔细区分：\n\
    \n1. 每个人都应该理解并使用的基础概念（例如 `classes`、`member functions`、`constructors`）。\n2. 那些虽然很有用但并不频繁使用的功能（例如\
    \ `single inheritance`、`templates`），新手程序员应该能够掌握这些功能（以防遇到它们），但在一段时间内应避免在自己的程序包中使用它们。\n\
    3. 那些完全是坏主意且应该像避瘟疫一样避免的功能（例如 `multiple inheritance`、`exceptions`、`overloading`、`references`\
    \ 以及许多其他）。\n\n当然，最后一个类别中的所有对象都有支持者，人们必须承认，就像备受讨厌的 `goto` 一样，确实可能出现程序从使用 `goto`\
    \ 或多重继承中获益的情况。然而，常识是，大多数程序员永远不会遇到这种情况，即使他们遇到了，用户也更有可能误用该功能而不是正确地使用它。\n\n利用 C++\
    \ 的一些优势包括：\n\n1. **可维护性**：修改代码的难度较低，因为只需要少量文本内容的更改，而不需要重新排列大量的处理器指令。C++ 是面向对象的，这进一步增强了可维护性。\n\
    2. **移植性**：不同的处理器提供不同的指令。用文本编写的包可以转换为许多不同处理器的指令；C++ 的优点之一是它可以用于为几乎任何 CPU 编写应用程序。\n\
    3. **简洁性**：编程语言允许我们以更简洁的方式表达典型的命令序列。C++ 有一些特别有效的快捷方法。\n\nC++ 是一种编译型编程语言：\n\n```\n\
    C++\nThe Source Code\n1001100100\nMachine code.\nCOMPILE\n```\n\nC++ 包含字母 C。\n\
    \nC++ 在很大程度上是 C 的语言超集，大多数编写正确的 ANSI C 都会编译为 C++。然而，有一些重要的注意事项：\n\n1. 所有的函数和定义头文件声明应该使用新风格声明，例如\
    \ `extern int foo(int X, char* Y);`。\n2. 不要使用默认类型 `int`，所有函数必须在使用之前进行声明。\n3. 如果你想将\
    \ C 对象与 C++ 链接，在为 C++ 声明 C 能力时必须执行以下操作：\n```\nint foo(int X, char* Y); extern\
    \ \"C\"\n```\n在任何其他情况下，C++ 编译器将以一种异常的方式更改名称。\n4. `extern int foo();` 这种形式允许 `foo`\
    \ 优先采用不确定类型和多种参数。事实上，有些人建议即使在日常 C 代码中也使用 C++ 编译器，因为它可以捕获普通 C 编译器会忽略的滥用函数等问题。\n\
    5. 有许多新术语不再可以作为标识符；一些常见的词汇是如 `delete`、`const` 和 `class` 等新词。\n\n# 第一章\n\n## ![](img/image00107.jpeg\
    \ 面向对象编程（OOP）的基础\n\n在介绍面向对象语言的一些核心概念之前，回顾 C++ 的一些基本概念是重要的。在几个示例的帮助下，面向对象编程的思想将变得有意义：\n\
    \n1. **成员函数 (Member functions)**：这些是种视为项目成员的函数，并在类声明中定义。它们通常被称为函数成员。与成员函数类似，类别的行为由以下内容指定：\n\
    \   a. 在创建新对象时做什么（该对象的函数 `Object() { [native code] }`），换句话说，如何初始化对象的记录。\n   b.\
    \ 在删除项目时做什么（该项目的析构函数）。\n2. **对象和类 (Objects and classes)**：类类似于 C，不同在于数据结构定义和所有操作该数据结构的\
    \ `Function` 能力都聚集在一个部分。作为一个类别（数据结构实例）的例子，相同类的对象在类内部具有相同的函数，但每个对象（每个实例）都有自己的自己私人的数据结构克隆。因此，一个类定义了两个组件：它们包含的对象以及它们拥有的数据。\n\
    3. **私有成员与公共成员 (Private vs. Public members)**：类的公共成员是可以公开研究或发表的（如数据成员），或者是众所皆知的（如成员函数）。私有成员最好通过类成员特征进行研究、编写或调用。\n\
    \n类的使用主要出于两个原因：\n1. 私有个体的使用允许你这样做，让你对程序数据所有权的方式更有信心，以及\n2. 如果能将数据与管理该数据的函数分组在一起，组织你的程序将变得容易得多。\n\
    \n面向对象编程结合了额外的思想，如抽象、封装、多态、继承、模块化等。\n\n### 封装 (Encapsulation)\n面向对象编程的核心原则之一是封装（`OOP`）。它定义了在单个单元内对数据打包以及操作该数据的功能的概念，例如\
    \ C++ 中的 `class`。\n\n这种思想也被广泛用于将对象的内部内容（或状态）与其边界隔离开。这被称为数据隐藏。这种机制的整体概念非常简单。如果你有一个从对象外部不可见的的属性，并将其与提供读取或写入访问权限的方法打包，你就可以屏蔽特定信息并管理对对象内部状态的访问。\n\
    \n任何面向对象编程语言中都有 `getter` 和 `setter` 方法。`getter` 方法获取特征，而 `setter` 方法修改它。根据程序员实现的技巧，用户可以选择某个特征是否可以被读取和更改、是否是只读的或者完全不可见。\n\
    \n### 抽象 (Abstraction)\n抽象是一种从外部世界隐藏应用程序内部信息的方法。使用简单的句子通过抽象描述事物。它被用于在工具和客户端程序之间设置障碍。\n\
    \n抽象存在于生活的几乎每一个方面：\n你的汽车是抽象的一个极佳例子。你可能通过转钥匙或按下启动按钮来启动汽车。你不想知道引擎如何启动或汽车包含哪些组件。汽车的内部实现和复杂逻辑对消费者是完全隐藏的。\n"
