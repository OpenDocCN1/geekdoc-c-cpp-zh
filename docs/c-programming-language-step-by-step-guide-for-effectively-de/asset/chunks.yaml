    操作系统，无论是 Microsoft Windows、Mac OSX 还是 Linux，都是用 `C++` 编写的。`C`/`C++` 是所有知名操作系统的骨干，因为它是一种强类型且运行快速的编程语言，使其成为开发运行设备的极选择。此外，`C`
    与汇编语言非常相似，这使得创建底层运行模块成为可能。


    ### 浏览器

    由于其提供的速度，多个网络浏览器的渲染引擎实际上是用 `C++` 编写的。渲染引擎需要更快的执行速度，以确保用户无需等待内容显示在屏幕上。因此，`C++`
    被选为此类延迟系统的编程语言。


    `C++` 是许多高级库所使用的中间编程语言。由于其速度快，`C++` 被用于许多设备学习库的后端。`TensorFlow` 作为最流行的机器学习库之一，采用
    `C++` 作为其后端编程语言。由于这些库在训练机器学习模型时涉及巨型矩阵的乘法，因此需要极高的整体性能计算。因此，性能变得至关重要。在这些库中，`C++`
    发挥了关键作用。


    ### 图形

    所有的图形软件包都需要快速渲染，而 `C++` 像网络浏览器一样，在这里也能降低延迟。`C++` 是采用计算机想象与预测、数字图像处理以及过度停止图形处理的软件程序的后端编程语言。即使是具有大量像素的知名视频游戏也使用
    `C++` 作为它们的主编程语言。`C++` 在此类情况下提供的速度有助于开发者扩大其目标市场，因为优化的工具甚至可以在没有多少可用计算能力的低端设备上运行。


    ### 银行程序

    `Infosys Finacle` 是最广泛使用的银行系统之一，它采用 `C++` 作为其后端编程语言之一。银行应用程序每天处理数千万次交易，需要高并发和低延迟支持。由于
    `C++` 的速度优势和多线程支持（这些支持通过作为 `C++` 编程包一部分的知名模板库提供），`C++` 经常是此类软件包的首选。


    ### 云/分布式结构

    扩展云存储结构和各种分配结构的大型公司使用 `C++`，因为它与硬件的连接得非常好，并且兼容广泛的机器。云存储解决方案利用了接近硬件的可扩展文档结构。在这种情况下，`C++`
    成为受青睐的选择，因为它接近硬件，而且 `C++` 中的多线程库提供了高并发和容错性，这在这些情况下非常重要。


    ### 数据库

    最广泛使用的数据库 `Postgres` 和 `MySQL` 是用 `C++` 和 `C`（`C++` 的前身）编写的。这些数据库被用于我们每天使用的几乎所有知名应用程序——`Quora`、`YouTube`
    等。


    ### 嵌入式系统

    嵌入式系统包括广泛的类型，如临床机器、智能手表等。使用 `C++` 作为首选编程语言，因为它比其他高级编程语言更接近硬件层。


    ### 手机交换机

    由于 `C++` 是最快的编程语言之一，它被广泛用于手机交换机、路由器和区域探头。


    ### 编译器

    许多编程语言的编译器使用 `C` 和 `C++` 作为后端编程语言。这是由于 `C` 和 `C++` 是面向硬件的极底层语言，因此是此类编译系统的最佳选择。这些是
    `C++` 编程语言应用和软件包的一些示例。现在，让我们了解 `C++` 相比不同编程语言的额外优势。


    ## C++ 的优势


    `C++` 具有以下两个特征，使其成为大多数软件包的流行选择：


    1. `C++` 比大多数其他编程语言都快，并提供出的并发支持。这使得它对性能至关重要且延迟极低的领域非常有用。此类需求在高负载服务器中很常见，如 Web
    服务器、应用服务器、数据库服务器等。`C++` 在此类服务器中是必不可少的。

    2. 面向硬件：`C++` 比大多数其他编程语言（如 `Python`）更面向硬件。这使得在软件程序与硬件紧密连接且在软件层面需要低阶段支持的情况下是有益的。


    ## 结论


    `C++` 是一种著名的面向对象编程（OOP）语言，它是 `C` 语言的扩展。在继承了训练后，该语言被称为 `C++`。它是一种编译语言，可以在多种平台上运行。面向对象的编程能力允许进行底层的内存操作。它是一组预配置的训练，即可以多次使用的记录类型。`C++`
    编程语言还有助于验证用户描述的训练。类（Classes）可以支持额外的成员能力以实现关键功能。为了优雅地创建函数，可以定义特定类的几个对象。


    `C++` 为软件包提供了清晰的模块化结构，使其成为定义抽象记录类型的理想选择，其中实现信息被隐藏，且单元具有清晰描述的接口 `C++` 使得维护和管理现有代码变得简单，因为可以根据现有对象的细微变化创建新对象。`C++`
    为代码库提供了一个极佳的框架，提供的软件程序插件可以被程序员轻松地适配和修改。这在创建图形用户界面时特别有用。用于对象通信的消息传递方法极大地简化了与外部设备的接口描述。


    # 结论


    尽管有很多内容需要学习，但 SQL 在数据库中仍然是一种非常简单的语言。只要使用书中的必要工具，你就可以成功地处理任何数据库。


