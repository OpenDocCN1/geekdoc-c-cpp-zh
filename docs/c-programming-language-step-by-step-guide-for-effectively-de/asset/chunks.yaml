    Widget = nullptr; / After deleting a pointer, always set it to null.\n```\n\n\
    # Chapter 4\n\n## ![](Images/image00111.jpeg) 4.1 Operation Priority\n\n### 4.1.1\
    \ Univalent operators\n\nThey take precedence over the items to which they are\
