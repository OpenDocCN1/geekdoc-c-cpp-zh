    \ timer and the type of dinner. Finally, we are served a hot and delectable lunch.\
    \ We don't know what's inside the microwave. We were given access to the capacity\
    \ in a very straightforward manner.\n\nObjects are the primary building pieces\
    \ of object-oriented programming. An object is made up of attributes and methods.\
    \ Through access modifiers, abstraction shields them from the outer global. We\
