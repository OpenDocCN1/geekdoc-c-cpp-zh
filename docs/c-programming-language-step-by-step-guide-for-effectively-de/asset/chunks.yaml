    Because C++ supports both templates and dynamic dispatch, they can be mixed in
    ways that can be rather complex. Alternatively, it''s a fascinating question whether
    the growing power of templates in C++ makes inheritance less important than it
    was thought to be in the 1990s. The C++ general library is currently referred
    as as the standard Template Library (STL), and templates appear to be more relevant
    to its design than complex deep magnificence hierarchies.'
