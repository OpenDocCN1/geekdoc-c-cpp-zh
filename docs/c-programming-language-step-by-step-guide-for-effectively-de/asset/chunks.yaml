  trans: '

    C++ 可以被视为具有两层语言结构。底层是一个简单的过程化语言，旨在设计主要由 `structs` 和类（class）构建的低级统计结构。"C++" 中的
    "C" 层就是这种语言。而 "++" 层则提供了抽象方法，旨在以一种依赖且类型安全的方式开发复杂的软件。由于 C++ 在 C 之上添加的这种高级语言层具有众公认的卓越能力，C++
    有时被错误地定性为“面向对象的语言”。虽然 C++ 在历史上是从“带有类的 C”演变而来的，但当前的标准 C++ 11 定义了一个更广为人知的语言。`C++
    11` 支持多种编程范式，包括面向对象编程。需要注意的是，在 C++ 中使用类（class）本身并不反映面向对象编程。相反，在 C++ 中，“类（class）”一词指的是用户定义的类型，并与
    `struct` 交叉使用。如果没有使用继承，特别是泛型，那么此类指令或系统可能并没有特定的面向对象特性。例如，我们可以利用一个仅具有静态成员特征的类，作为
    C++ 为（元组）函数提供的一等近似，而结构体可以是简单的信息元组。


    在这些笔记中，我们可以关注 C++11 的一个子集，被称为“带有模板的 C”。模板到为止是 C++ 最复杂的方面，而且令人惊讶的是，它是 C++ 最接近函数式编程和
    lambda 演算的部分。模板创建了一种排序更好、类型化，且用通俗的话来说更有用的语言，这种语言在编译时进行评估。然而，我们不再再假装 C++ 是或需要成为一种实用的编程语言。低级语言阶段（内部特性和系统）仍然可以是常规且地道的
    C，带有赋值、指针以及其他内容；只有高级别的抽象过程才像是刻意的编程。


    一些模板的介绍侧重于它们在汇装时执行任意计算的能力。例如，你可以创建一个模板，在 C++ 编译期间计算阶乘特征，并为了增加奇异感将结果在编译器错误消息中输出。然而，当前
    C++ 11 标准中的 `constexpr` 特性已经提供了编译时的实际计算。在这里，我们可以强调模板与泛型参数化的关系，而不是它们的编译时计算组件（后者有时被称为元编程）。


    # 第 14 章


    ## 14.1 C++ 编译器


    ### 14.1.2 程序编译、链接与构建


    将包含 C++ 代码的一系列文本文档转换为可执行报告的过程被称为“构建”。由于代码可能分散在许多 C++ 代码文件和头文件中，创建一个赋值任务由许多较小的步骤组成。最常见的是编译（将单个
    C++ 文件转换为设备指令）。然而，还有其他需要考虑的过程，例如预处理和链接。本节总结了每个步骤中发生的情况。


    编译器是一种软件，它将用特定编程语言编写的语句转换为计算机处理器可以使用并理解的机器语言或“代码”。通常情况下，程序员使用编辑器在某种语言（如 C++）中编写语言语句。生成的文档（C++
    语言中为 `filename.cpp`）包含了所谓的源文件或高级编程语句。然后，程序员调用相应的语言编译器（包括 C++），指定包含源语句的文档名称。编译器的工作是获取该源报告（C++
    文档），逐行检查可能存在的语法错误，然后将其重构为一系列相应的设备级指令。值得注意的是，每种类型的计算机处理器都有自己的一套机器指令。因此，没有统一的 C++
    编译器，而是针对每个目标硬件平台的编译器。编译 C++ 记录不会直接生成可执行文件。C++ 文件中描述的程序可能包含了对操作系统 API（应用程序编程接口）的调用（例如
    I/O 函数），或对内置函数以及数学能力的调用。编译器创建的文件被称为“对象文件”。它包含了对这些各种外部指定能力的引用，外加上与（转换后的）C++ 代码行对应的设备指令。它本身是不可执行的，但必须将那些外部声明的元素提供给它，或将其“链接”到它上面。除了包含可执行语句的源文件（`.cpp`）外，还有头文件（`.h`）。头文件通常只包含最基本的声明。在“编译”之前，必须完成进一步步骤：“预处理”。预处理器程序读取文本格式的源文件并输出另一个文本记录。以特殊字符
    `#` 开头的源代码行现在是用预处理器语言编写的，而不是 C++。预处理器会将一个字符串替换为另一个字符串，将头文件的内容替换为一组 `#include`
    语句，甚至完全根据这些语句将某些特征调用扩展为其他文本。大多数项目的代码都包含在 C++ 文件和头文件中。这使得文档保持在可管理的长度，并允许代码被“模块化”，即分成较小的部分，每个阶段仅包含精确连接的代码，例如一个类的实现或一组固定的链接软件函数。要构建任何此类项目，每个
    C++ 文件都必须编译，然后将对象文件与库能力共同链接在一起。当然，每个编译阶段都包含一个准备步骤，在在该步骤中使用 `#` 指令来修改文档的文本。`make`
    表示多文档项目的构建技术。


    ## ![](img/image00123.jpeg) 14.2 C++ 的语言特性


    C++ 具有以下引入胜的能力：


    -   **面向对象**：C++ 是一种面向对象的计算机语言。也就是说，重点是“对象”以及对这些项目的操作。关于这些操作如何运作的统计数据是从产品的那里提取的。

    -   **丰富的库支持**：通过 C++ 标准模板库（`STL`）可以使用许多函数，有助于快速创建代码。对于多种容器（如集合、映射、哈希表等许多其他）都有首选库。

    -   **性能**：C++ 是首选语言，延迟是一个重要的指标。C++ 程序的编译和执行时间明显快于大多数其他流行的编程语言。

    -   **编译**：与不需要编译的解释型语言不同，C++ 代码必须先编译成低级代码，然后完成。

    -   **指针支持**：C++ 还支持指针，指针在编程中很常用，但在其他编程语言中并不总是可用。


    它是到目前为止最重要的编程语言之一，因为你使用的几乎所有程序/结构都有部分或全部用 C/C++ 编写的代码库。C++ 在我们使用的几乎所有程序都至关重要，无论是
    Windows、照片编辑软件、你最喜欢的游戏还是你的内核浏览器。


    ### C++ 语言的用途

    在探索 C++ 特性之后，以下是 C++ 常用的一些兴奋领域。


