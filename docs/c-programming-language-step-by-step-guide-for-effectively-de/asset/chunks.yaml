    \n它们也可以取 `nullptr` 值，这表示空内存区域。等于 `nullptr` 的指针包含错误的内存区域，结果不与合法数据交互。\n\n通过在变量前加上内存地址运算符\
    \ `&`，你可以获取特定类型变量的内存地址。`&` 产生的值指向底层类型的指针，它包含了变量的内存地址（只要变量不再超出作用域，该地址就是有效的）。\n\n\
    ### 10.1.3 指针算术的增/减\n指针可以增加或减少（前缀和后置）。增加指针会将指针移动到数组中当前指向元素之后的一个细节。当指针递减时，它移动到数组的前一个细节。不完全类型为\
    \ void。\n\n```cpp\nchar* str = new char [5];\n++str;\n```\n\n"
