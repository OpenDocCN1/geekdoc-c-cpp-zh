    templates) and that rookie programmers should be able to grasp (in case they come
    across them) but avoid using their very own packages for a while.


    3\. Those that are simply a bad idea and should be avoided like the plague (e.g.,
    multiple inheritance, exceptions, overloading, references, and many others).


    Of course, all of the objects in this last category have supporters, and one must
    admit that, like the reviled goto, it is possible to assemble circumstances while
