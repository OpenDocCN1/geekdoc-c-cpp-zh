    \ 0;\n}\n```\n\n### 9.1.2 Struct\n除以下版本外，可与 `class` ：\n\n如果使用 `struct` 关键字指定类别类型，则基类和成员的默认访问权限是公有的，而不是私有的。\n\
    \n`struct` 不能用于声明模板类型或模板参数；然而，简单的 `class` 可以。\n\n# 第 10 章\n\n## 10.1 备注\n\n###\
    \ 10.1.1 指针的使用\n指针是指向内存位置的地址。它们通常用于允许函数或数据结构访问并修改内存，而不需要复制指定的内存。建议可以用于原始类型（集成或内置）或用户定义类型。\n\
    \n为了处理“解引用” `*`、“取地址” `&` 和“箭头” `->` 运算符，指针使用了三种。`*` 和 `->` 运算符用于访问内存位置；它们直接引用指针指向的变量的分配内存位置，而\
    \ `&` 运算符返回内存地址。\n\n对于指针，有两个运算符：用于获取内存地址的取地址运算符(`&`）：返回其操作数的内存地址。内容运算符（解引用）(`*`）：使用该运算符，精确地返回位于内存地址处的变量值。\n\
    \n```cpp\nUsing the std namespace; #include iiostream>\n\nint variable = 10;\n\
