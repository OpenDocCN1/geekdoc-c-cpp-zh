  md: '# What''s noticed :method => :delete?


    You may have noticed that the scaffold-generated Destroy link includes the parameter
    :method => :delete. This determines which method is called in the ProductsController
    class and also affects which HTTP method is used.


    Browsers use HTTP to talk with servers. HTTP defines a set of verbs that browsers
    can employ and defines when each can be used. A regular hyperlink, for example,
    using an HTTP GET. A GET request is defined by HTTP to be used to retrieve data;
    it''s not supposed to have any side effects. Using this parameter in this way
    indicates that an HTTP DELETE method should be used for this hyperlink. Rails
    uses this information to determine which action in the controller to route this
    request.


    Note when used within a browser, Rails will substitute the POST HTTP method for
    PUT and DELETE methods and in process track on an additional parameter so that
    the router can determine the original intent. Either way, the request will not
    be cached or triggered by web crawlers.


    deleting the product. (Also, see the sidebar on the current page for some inside
