  md: "The :precision and scale parameters are optional for decimal columns. However,\n\
    incompatibilities between different databases lead us to strongly recommend\n\
    that you include the options for each decimal column.\n\nHere are some column\
    \ definitions using the migration types and options:\n\n```\nadd_column :orders,\
    \ :attn, :string, :limit => 100\nadd_column :orders, :order_type, :integer\nadd_column\
    \ :orders, :ship_class, :string, :null => false, :default => 'priority'\nadd_column\
    \ :orders, :amount, :decimal, :precision => 8, :scale => 2\n```\n\n# Renaming\
    \ Columns\n\nWhen we refactor code, we often change our variable names to make\
    \ them\nmore meaningful. Rails migrations allow us to do this to database column\n\
    names, too. For example, a week after we added it, we might decide that\ne_mail\
    \ isn't the best name for the new column. We can create a migration\nit using\
    \ the rename_column method:\n\n```\nclass RenameEmailColumn < ActiveRecord::Migration\n\
    \  def self.up\n    rename_column :orders, :e_mail, :customer_email\n  end\n\n\
    \  def self.down\n    rename_column :orders, :customer_email, :e_mail\n  end\n\
    ```\n\nNote that the rename does not destroy any data associated with the\ncolumn.\
    \ Also be aware that renaming is not supported by all the adapters.\n\n# Changing\
    \ Columns\n\nUse the change_column method to change the type of a column or to\
    \ alter the\noptions associated with a column. Use it the same way you'd use add_column,\n\
    but specify the name of an existing column. Let's say that the order type col-\\\
    umn is currently an integer, but we need to change it to a string. We want\nto\
    \ keep the existing data, so an order type of 123 will become the string '123'.\n\
    Later, we'll use noninteger values such as 'new' and 'existing'.\n\nChanging from\
    \ an integer to a string is easy:\n\n```\ndef self.up\n  change_column :orders,\
    \ :order_type, :string\nend\n```\n\nHowever, the opposite transformation is problematic.\
    \ We might be tempted to\nwrite the obvious migration:\n\n```\ndef self.down\n\
    \  change_column :orders, :order_type, :integer\nend\n```"
