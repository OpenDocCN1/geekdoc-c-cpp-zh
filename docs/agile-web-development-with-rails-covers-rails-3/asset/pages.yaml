  md: "# FRAGMENT CACHING\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_374_0.png)\n\
    \n22.1: Refreshing a page with cached and noncached data\n\nThe key concept here\
    \ is that the stuff that's cached is the fragment generated in the view. If we'd\
    \ constructed the article list in the controller and then passed that list to\
    \ the view, the future access to the page would not have to reender the list,\
    \ but the database would still be accessed on every request. Moving the database\
    \ request into the view means it won't be called when the output is cached.\n\n\
    OK, you say, but that just broke the rule about putting application-level code\
    \ into view templates. Can't we avoid that somehow? We can, but it means caching\
    \ a little less transparent than it would otherwise be. The trick is to have the\
    \ action test for the presence of a cached fragment. If one exists, the action\
    \ bypasses the expensive database operation, knowing that the fragment will be\
    \ used.\n\n```\nDownload e1/views/app/controllers/blog1_controller.rb\n```\n\n\
    ```\nclass BlogController < ApplicationController\n```\n\n```\ndef list\n  @dynamic_content\
    \ = Time.now.to_s\n  unless read_fragment(:action => 'list')\n    logger.info(\"\
    Creating fragment\")\n    @articles = Article.find_all_recent\n  end\nend\n```"
