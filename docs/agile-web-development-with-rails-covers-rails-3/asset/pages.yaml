    # Core Extensions (core-xl)


    Active Support extends some of Ruby''s built-in classes in interesting, useful,
    and sometimes whimsical ways. In this section, we''ll quickly list the most popular
    of these core extensions.


    +   *Array*: second, third, fourth, fifth and forty-two. These complement the
    first and last methods provided by Ruby itself.


    +   *CGI*: escape_skipping_slashes. As the name implies, it differs from escape
    in that it doesn''t escape slashes.


    +   *Class*: Accessors for class attributes, delegating others, inheritable readers
    and writers (as subclasses). These methods are too numerous to enumerate; see
    the documentation for details.


    +   *Date*: yesterday, future?, next_month, and many, many more.


    +   *Enumerable*: group_by, sum, each_with_object, index_by, many?, and exclude?.


    +   *File*: atomic_write, and path.


    +   *Float*: Adds an optional precision argument to round.


    +   *Hash*: diff, deep_merge, except, stringify_keys, symbolize_keys, reverse_merge,
    and slice. Many of these methods also have variants ending in an exclamation-point.


    +   *Integer*: ordinalize, multiple_of?, months, years. See also Numeric.


    +   *Kernel*: debugger, breakpoint, silence_warnings, enable_warnings.


    +   *Module*: Accessors for module attributes, aliasing support, delegation, deprecation,
    internal readers and writers, synchronization, and પોતાના.


    +   *Numeric*: bytes, kilobytes, megabytes, and so on; seconds, minutes, hours,
