  md: '# CREATING, READING, UPDATING, AND DELETING (CRUD)


    There are times when you want to ensure you always have a model object to work
    with. If there isn''t one in the database, you will want to create one. Dynamic
    finders can handle this. Calling a method whose name starts find_or_initialize_by_
    or_create_by will either call or create the model class if the finder would otherwise
    return nil. The new model object will be initialized so that its attributes corresponding
    to the finder criteria have the values passed to the finder method, and it will
    have been saved to the database if the create variant is used.


    ```

    cart = Cart.find_or_initialize_by_user_id(user.id)

    cart.items << new_item

    cart.save

    ```


    And, no, there is not a find_by_ form that lets you use _or_ rather than _and_
    between column names.


    # SQL and Active Record


    To illustrate how Active Record works with SQL, let''s pass a simple string to
    the where method call corresponding to a SQL clause. For example, to return a
    list of all orders for Dave with a payment type of "po", we could use this:


    ```

    pos = Order.where("name = ''Dave'' and pay_type = ''po'')

    ```


    The result will be an ActiveRecord::Relation containing all the matching rows,
    each neatly wrapped in an Order object.


    That''s fine if our condition is predefined, but how do we handle the situation
    where the name of the customer is set externally (perhaps coming from a web form)?
    One way is to substitute the value of the variable into the condition string:


    ```

    # get the name from the form

    name = params[:name]

    # DON DO THIS!!!

    pos = Order.where("name = ''#{name}'' and pay_type = ''po'')

    ```


    As the comment suggests, this really isn''t a good idea. Why? It leaves the database
    wide open to something called SQL injection, which we describe in more in the
    Rails Guides that you generated on page 262. For now, take it as given that substituting
    a string from an external source into a SQL statement is effectively the same
    as publishing your entire database to the whole world.


    Instead the safe way to generate SQL is to let Active Record handle it. Doing
    this allows Active Record to properly escaped SQL, which is immune to SQL injection
    attacks. Let''s see how this works.'
