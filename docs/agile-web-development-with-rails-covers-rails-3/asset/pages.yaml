  md: 'In this chapter, we''ll see


    +   - reviewing Rails concepts: model, view, controller, configuration,

    - testing, and deployment; and

    - links to places for further exploration.


    # # Chapter 27


    # # Where to Go from Here


    Congratulations! We''ve covered a lot of ground together.


    In Part I, you installed Rails, verified the installation using a simple application,
    got exposed to the architecture of Rails, and got acquainted (reacquainted) with
    the Ruby language.


    In Part II, you iteratively built an application, built up test cases along the
    way, and ultimately deployed it using Capistrano. We designed this application
    to touch on all of the aspects of Rails that every developer needs to be aware
    of.


    Whereas Parts I and II of this book served a single purpose, Part III of this
    book served a dual role.


    For some of you, Part III methodically filled the gaps and covered enough for
    you to get real work done. For others, this will be the first steps of a much
    longer journey.


    For most of you, the real value is a bit of both. A foundation is required in
    order for you to be able to explore further. And that''s why we started this part
    with a chapter that not only covered the convention and configuration of Rails
    but also covered the generation of documentation.


    Then we proceeded to devote each chapter to the model, views, and controller,
    which are the backbone of the Rails architecture. We covered topics ranging from
    database relationships to the REST architecture to HTML forms and helpers.


    We covered migration and caching as essential maintenance and tuning aspects of
    a deployed application.


    Finally, we split Rails apart and explored the concept of gems from a number of
    different perspectives: from making use of individual Rails components separately
    to making full use of the foundation upon which Rails is built and finally to
    building and extending the framework to suit your needs.'
