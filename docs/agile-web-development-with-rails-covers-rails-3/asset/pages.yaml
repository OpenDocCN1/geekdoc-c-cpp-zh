  md: 'command. What it does is put the version of the software that you are depen-dent
    into the repository:


    ```

    $ bundle pack

    $ git add Gemfile.lock vendor/cache

    $ git commit -m "bundle gems"

    ```


    We will explain more of the features of Bundler in Section 25.3, Managing Dependencies
    with Bundler, on page 412.


    From here, it is a simple matter to push all your code to the server:


    ```

    $ git remote add origin ssh://user@host/~/depot.git

    $ git push origin master

    ```


    With these few steps, you have gained control over what is being deployed. You
    control what is being committed to your local repository. You control when this
    is pushed out to your server. Next up, you will control putting this code into
    production.


    # Deploying the Application Remotely


    We previously deployed the application locally on a server. Now we are going to
    do a second deployment, this time remotely.


    The prep work is now done. Our code is on the SCM where it can be accessed by
    the app server. Again, it matters not whether two servers are the same: what is
    important here is the roles that are being performed.


    To add the necessary files to the project for Capistrano to do its magic, execute
    the following command:


    ```

    $ capify .

    [add] writing ''./Capfile''

    [add] writing ''./config/deploy.rb''

    [done] capified!

    ```


    From the output, we can see that Capistrano sets up two files. The first, Capfile,
    is Capistrano''s analog to a Rakefile. We won''t need to touch this file further.
    The second, config/deploy.rb, contains the recipes needed to deploy our application.
    Capistrano will provide us with a minimal version of this file, but the following
    is a somewhat complete version that you can download and use as a starting point:


    ```

    # be sure to change these

    set :user, ''rubys''

    set :domain, ''depot.pragprog.com''

    set :application, ''depot''


    set :repository, "#{:user}@#{:domain}:git/#{:application}.git"

    set :deploy_to, "#{home}/#{:user}/#{application}"

    ```'
