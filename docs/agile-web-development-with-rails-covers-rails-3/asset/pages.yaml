  md: "Where should we put this method? It could sit directly in the admin controller,\
    \ but for reasons that will become apparent shortly, let's put instead in ApplicationController,\
    \ the parent class of all our controllers. This is in the file application_controller.rb\
    \ in the directory app/controllers. Note that we chose to restrict access to this\
    \ method. This prevents it from ever being exposed to end users as an action.\n\
    \nDownload repo/app/controllers/application_controller.rb\n\n```\nclass ApplicationController\
    \ < ActionController::Base\n  before_filter :authorize\n  protect_from_forgery\n\
    \n  private\n    def current_cart\n      Cart.find(session[:cart_id])\n    rescue\
    \ ActiveRecord::RecordNotFound\n      cart = Cart.create\n      session[:cart_id]\
    \ = cart_id\n      cart\n    end\n```\n\nprotected\n\n```\ndef authorize\n  unless\
    \ User.find_by_id(session[:user_id])\n    redirect_to login_url, :notice => \"\
    Please log in\"\n  end\n```\n\nThe before_filter line causes the authorization\
    \ to be invoked every before in our application.\n\nThis is going too far. We\
    \ have limited access to itself to administrators. That's not good.\n\nWe could\
    \ go back and change things so that we mark only methods that specifically need\
    \ authorization. Such an approach is called blacklisting and is prone to errors\
    \ of omission. A much better approach is to \"whitelist\" or list methods and\
    \ controllers for which authorization is not required. We do this simply by inserting\
    \ a skip_before_filter call within the StoreController:\n\nDownload repo/app/controllers/store_controller.rb\n\
    \n```\nclass StoreController < ApplicationController\n  skip_before_filter :authorize\n\
    ```"
