    Now it is all starting to come together. We can log in, and by clicking a link
    on the sidebar, we can see a list of users. Let''s see whether we can break something.


    **Would the Last Admin to Leave...** We bring up the user list screen that looks
    like Figure 14.4; then we click the Destroy link next to *dave* to delete that
    user. Sure enough, our user is removed. But to our surprise, we''re presented
    with the login screen instead. When we deleted the only administrative user from
    the system. When the next request came in, the authentication failed, and the
    access refused to let us in. We have to log in before using any administrative
    functions.


    But now we have an embarrassing problem: there are no administrative users in
    the database, so we can''t log in.


    Fortunately, we can quickly add a user to the database from the command line.
    If you invoke the command rails console, Rails invokes Rails'' it utility, but
    it does so in the context of your Rails application. This means you can interact
    with your application''s code by typing Ruby statements and logging the values
    you return.'
