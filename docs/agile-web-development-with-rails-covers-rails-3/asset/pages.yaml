- img_proc: true
  md: 'Remember that Rails tries to make your application independent of the underlying
    database; you could develop using SQLite 3 and deploy to Postgres if you wanted.
    For example, different databases use different names for the types of columns.
    If you used a SQLite 3 type in a migration, that migration might not work if applied
    to a Postgres database. So, Rails insulate from the underlying database type systems
    using logical types. If migrating a SQLite 3 database, the string will create
    a column of type varchar(255). On Postgres, the migration adds a column with the
    type char varying(255).


    The types supported by migrations are :binary, :boolean, :date, :datetime, :decimal,
    :float, :integer, :string, :text, :time, and :timestamp. The default mappings
    of these types for the database adapters in Rails are shown in Figure 23.1, on
    the next page. Using this figure, you could work out that a column declared to
    be :integer in a migration would have the type integer in SQLite 3 and number(38)
    in Oracle.


    You can specify up to three options when defining columns in a migration: decimal
    columns can take an additional option. Each of these options is given as a key
    => value pair. The common options are as follows:


    ```

    null => true or false

    ```


    If false, the underlying column has a not null constraint added (if the database
    supports it).


    ```

    :limit => size

    ```


    This sets a limit on the size of the field. This basically appends the string
    (:size) to the database column type definition.


    ```

    :default => value

    ```


    This sets the default value for the column. Note that the default is calculated
    once, at the point the migration is run, the following code will set the default
    value to the date and when the migration was run:


    ```

    add_column :orders, :placed_at, :datetime, :default => Time.now

    ```


    In addition, decimal columns take the options :precision and :scale. The :precision
    option specifies the number of significant digits that will be stored, and the
    :scale option determines where the number of decimal point will be located in
    these digits (think of the scale as the precision of 5 and a scale of 0 can store
    numbers from -99,999 to +99,999. A decimal number with a precision of 5 and a
    scale of 2 can store the range -999.99 to +999.99.'
  merge: -1
