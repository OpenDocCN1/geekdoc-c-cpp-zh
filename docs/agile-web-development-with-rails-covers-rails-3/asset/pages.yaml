  md: "We specify this in our Active Record model using something like the following:\n\
    \n```\nclass LegacyBook < ActiveRecord::Base\n  self.primary_key = \"isbn\"\n\
    end\n```\n\nNormally, ActiveRecord takes care of creating primary key values for\
    \ records that we create and add to the database—they'll be ascending integers\
    \ (possibly with some gaps in the sequence). However, if we override the key column's\
    \ name, we also take on the responsibility of setting the primary key to a unique\
    \ value before we save a new row. Perhaps surprisingly, we will still set an attribute\
    \ called id to do this. As far as ActiveRecord is concerned, the primary attribute\
    \ is always set using an attribute called id. The primary_key= declaration sets\
    \ the column to use in the table. In the following code, we use an attribute called\
    \ id even though the primary key in the database is isbn:\n\n```\nbook = LegacyBook.new\n\
    book.id = \"0-12345-6789\"\nbook.title = \"My Great American Novel\"\nbook.save\n\
    ```\n\n```\n#\nbook = LegacyBook.find(\"0-12345-6789\")\nputs book.title #=> \"\
    isbn\"=>\"0-12345-6789\"\npbook.attributes #=>\"My Great American Novel\"\n```\n\
    \nJust to make life confusing, the attributes of the model object have the column\
    \ names ids and title—doesn't appear. When you need to set the primary key, use\
    \ id. At all other times, use the actual column name.\n\nModel objects also redefine\
    \ the Ruby id and hash methods to reference the model's primary key. This means\
    \ model objects with valid ids may be used as hash keys. It also means that unsaved\
    \ model objects cannot reliably be used as hash keys (because they won't have\
    \ a valid id).\n\nOne final note: Rails considers two model objects as equal (==)\
    \ if they are instances of the same class and have the same primary key. This\
    \ means that unsaved model objects may compare as equal if they have different\
    \ attribute data. If you find yourself comparing unsaved model objects (which\
    \ is not a particularly frequent operation), you might need to override the ==\
    \ method.\n\nAs we will see, ids also play an important role in relationships."
