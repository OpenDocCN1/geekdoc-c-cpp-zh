    \ list to display the time at which it was created.\n\n```\nDownload e1/views/app/models/article.rb\n\
    ```\n\n```\nclass Article\n  attr_reader :body\n\n  def initialize(body)\n   \
    \ @body = body\n  end\n\n  def self.find_recent\n    new(\"It is now #{Time.now.to_s}\"\
    )\n    new(\"Today I had pizza\")\n    new(\"Yesterday I watched Spongebob\")\n\
    \    new(\"Did nothing on Saturday\")\n  end\nend\n```\n\nNow we'd like to set\
    \ up a template that uses a cached version of the rendered articles but still\
    \ updates the dynamic data. It turns out be trivial.\n\n```\nDownload e1/views/views/blog/list.html.erb\n\
    ```\n\n```\n<%= @dynamic_content %> <!---- Here's dynamic content. -->\n<% cache\
