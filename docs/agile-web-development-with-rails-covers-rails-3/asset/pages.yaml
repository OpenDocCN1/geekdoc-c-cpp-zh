    The first line specifies where to find new gems and new versions of existing gems.
    Feel free to repeat this line in order to list your private gem repositories.


    The next lines list what version of Rails to load. Note that it specifies a specific
    version. After this is a comment that you could use as an alternative in order
    to run the latest version of Rails.


    The remaining lines list a few gems that you are using and a few gems you might
    consider using. Some are placed in groups named :development,:test,or production
    and will be made available only in those environments. Others include an optional
    require parameter, which specifies the name to use on a requirement statement
    for the cases where it differs from the gem name.


    On the line for will_paginate you see a version identifier that is preceded by
    a comparison operator. Although Gemfile supports a number of such operators, only
    two are commonly used. >= is for the unfortunately too rare condition where the
    author of the Gemfile can be trusted to maintain strict backward compatibility
    so all that is needed to be specified is a minimum version number.


    ~ widely recommended. Essentially all the parts of the version, with the exception
    of the last part, must be matched exactly, and the last part specifies a minimum.
    So, ->3.1.4 matches any version that starts with a 3.1 and is not less than 3.1.4.
    Similarly, ->3.0 means any version string that starts with a 3.


    A Gemfile has a companion file, named Gemfile.lock. This second file is regularly
    updated by one of two commands: bundle install and bundle update. The difference
    between the two is rather subtle.


    Before proceeding, it is helpful to look at a Gemfile.lock file. Here is a small
    excerpt:'
