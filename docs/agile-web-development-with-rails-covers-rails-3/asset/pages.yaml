    Meanwhile, let''s explore how the data forms submit is processed.


    # 21.3 Processing Forms


    In Figure 21.2, on the following page, we can see how the various attributes

    in the model pass through the controller to the view, on the HTML page,

    and back again the model. The model object has attributes such as name,

    country and password. The template uses helper methods to construct an HTML

    form to let the user edit the data in the model. Note how the form fields are

    named. The country attribute, for example, maps to an HTML input field with

    the user(country).


    When the user submits the form, the POST data is sent back to our appli-

    cation. Rails extracts the fields from the form and constructs the params hash.

    Simple values (such as the id, extracted by routing from the form action)

    are stored directly in the hash. But, if a parameter name has brackets in,

    Rails assumes it is part of more structured data and constructs a hash

    to hold the values. Inside this hash, the string inside the brackets acts as the

    key. This process repeat if a parameter name has multiple sets of brackets

    in.


    | Form parameters | params |

    |---|---|

    | id=123 | { id => ''123'' } |

    | user(name)=Dave | { user => { name => ''Dave'' } } |

    | user(address)[city]=Wien | { user => { address => {: city => ''Wien'' } } |


    In the final part of the integrated whole, model objects can accept new attribute

    values from hashes, which allows us to say:


    ```

    user.update_attributes(params[:user])

    ```


    Rails integration goes deeper than this. Looking at the .html.erb file in Fig-

    ure 21.2, we can see that the template uses a set of helper methods to create

    the form''s HTML; these are methods such as form_for and text_field.


