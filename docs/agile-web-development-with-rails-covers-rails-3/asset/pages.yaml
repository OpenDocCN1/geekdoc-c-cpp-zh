  md: "For all other requests, Rails will produce the necessary HTTP headers for you,\
    \ if you call one of the stale? or fresh_when methods.\n\nBoth methods accept\
    \ both a :last_modified timestamp (in UTC) and an :etag. The latter is either\
    \ an object on which the response depends or an array of such objects. Such objects\
    \ need to respond to either cache_key or :param. ActiveRecord takes care of this\
    \ for you.\n\nstale? is typically used in statements when custom rendering is\
    \ involved:\n\n```\ndef show\n  Article = Article.find(params[:id])\n```\n\n```\n\
    if stale?(etag=>@article, :last_modified=>@article.created_at)\n  #\nend\nend\n\
    ```\n\nfresh_when is often more convenient when you are making use of default\
    \ rendering because it will produce a 304 Not Modified response for you:\n\n```\n\
    def show\n  fresh_when(:etag=>@article, :last_modified=>@article.created_at)\n\
    end\n```\n\nIn addition to caching a full page, Rails also provides support for\
    \ caching parts of a page. We cover why that is useful and how to integrate it\
    \ into your application next.\n\n# 22.3 Fragment Caching\n\nCaching parts of a\
    \ page turns out to be remarkably useful in dynamic sites. Perhaps you customize\
    \ the greeting and the sidebar on your blog application for each individual user.\
    \ In this case, you can't page caching, because the overall page is different\
    \ for each user. But because the list of articles doesn't change between users,\
    \ you can use fragment caching—you construct the HTML that displays the articles\
    \ once and include it in customized pages delivered to individual users.\n\nJust\
    \ to illustrate fragment caching, let's set up a blog application. Here's the\
    \ controller. It sets up @dynamic_content, representing content that should change\
    \ each time page is viewed. For any fake blog, we use the current time as this\
    \ content.\n\n```\nload app/controllers/blog_controller.rb\nclass BlogController\
    \ < ApplicationController\n  def list\n    @dynamic_content = Time.now.to_s\n\
    end\n```"
