  md: '# Editors


    We write different editors using a programmer''s editor. We''ve found over the
    years that different editors work best with different languages and environments.
    For example, Dave originally wrote this chapter using Emacs, because he thinks
    that the Fillad mode is unsurprised when it comes to nearly formatting XML as
    types. Sam updated the chapter using Vim. But many think neither Emacs nor Vim
    is ideal for Rails development and prefer to use TextMate. Although the choice
    of editor is a personal one, here are some suggestions of features to look for
    in a Rails editor:


    +   - Support for syntax highlighting of Ruby and HTML. Ideally support for .erb
    files (a Rails file format that embeds Ruby snippets within HTML).

    - Support of automatic indentation and reindent of Ruby source. This is more than
    an aesthetic feature: having an editor indent your program as you type is the
    best way of spotting bad nesting in your code. Being able to reindent when you
    refactor your code and move stuff.(TextMate''s ability to reindent when it pastes
    code from the clipboard is very convenient).

    - Support for insertion of common Ruby and Rails constructs. You''ll be writing
    lots of short methods, and if the IDE creates method skeletons with a keystroke
    or two, you can concentrate on the interesting stuff inside.

    - Good file navigation. As you''ll see, Rails applications are spread across many
    files: a newly created Rails application enters the world containing forty-six
    files spread across thirty-four directories. That''s before you''ve written a
    single line.

    - Navigation between.

    nYou need an environment that helps you navigate quickly between these. You''ll
    add a line to a controller to load a value, switch to the view to add a line to
    display it, then switch to the editor to verify that you did all right. Something
    like Notepad, when you traverse a File Open dialog to select each file to edit,
    just won''t cut it. We prefer a combination of a view of files in a sidebar, a
    small set of keystrokes that help you find a file (or files) in a directory tree
    by name, and some built-in smarts that know how to navigate (say) between a controller
    action and the corresponding view.

    - Name completion. Names in Rails tend to be long. A nice editor will let you
    type the first few characters and then suggest completions to you at the touch
    of a key.


    We recommend specific editors because we''ve used only a few in earnest and would
    undoubtedly leave someone''s favorite off the list. Nonetheless, to help you get
    started with something other than Notepad, here are some suggestions:'
  merge: -1
