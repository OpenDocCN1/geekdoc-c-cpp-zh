  md: "# Iteration E1: Creating a Smarter Cart\n\nThere's one last change to show\
    \ the store view to use this new information:\n\n```\nDownload depot.g/app/views/carfs/show.html.erb\n\
    ```\n\n```\n<h2>Your Pragmatic Cart</h2>\n<ul>\n  <% @cart.line_items.each do\
    \ |item| %>\n    <li><%= item.quantity %> &amp; <%= item.product.title %></li>\n\
    \  <% end %>\n</ul>\n```\n\nNow that all the pieces are in place, we can go back\
    \ to the store page and hit the Add to Cart button for a product that is already\
    \ in the cart. What are we likely to see is a mixture of individual products listed\
    \ separately and a single product with a quantity of two. This is because we added\
    \ a quantity of 1 to existing columns instead of collapsing multiple rows when\
    \ possible. What we need to do is migrate the data.\n\nWe start by creating a\
    \ migration:\n\n```\ndepot> generate migration combine_items_in_cart\n```\n\n\
    This time, Rails can't infer what we are trying to do, so it is entirely up to\
    \ us to fill in the self.up method.\n\n```\nDownload depot.g/db/migrate/20110211000005_combine_items_in_cart.rb\n\
    ```\n\n```\ndef self.up\n  # replace multiple items for a single product in a\
    \ cart with a single item\n  Cart.all.each do |cart|\n    # count the number of\
    \ each product in the cart\n    sums = cart.line_items.group(:product_id).sum(:quantity)\n\
    \    if quantity > 1\n      # remove individual items\n      cart.line_items.where(:product_id=>product_id).delete_all\n\
    \      # replace with a single item\n      cart.line_items.create(:product_id=>product_id,\
    \ :quantity=>quantity)\n    end\n  end\nend\n```\n\nThis is easily the most extensive\
    \ code we've seen so far. Let's look at it in small pieces:\n\n+   - We start\
    \ by iterating over each cart.\n\n+   - For each cart, we get a sum of the quantity\
    \ fields for each of the line items associated with this cart, grouped by product_id.\
    \ The resulting sums will be a list of ordered pairs of product_ids and quantity.\n\
    \n![](img/8ef700b628afd52a22f1d4980b1cf82f_127_0.png)"
  merge: -1
