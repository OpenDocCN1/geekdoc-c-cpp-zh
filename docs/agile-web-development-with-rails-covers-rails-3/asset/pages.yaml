  md: 'A method can invoke an associated block one or more times using the yield statement.
    You can think of yield as being something like a method call that calls out to
    the block associated with the method containing the yield. You can pass values
    to the block by giving parameters to yield. Within the block, you list the names
    of the arguments to receive these parameters between vertical bars ().


    Code blocks appear throughout Ruby applications. They are often used in conjunction
    with iterators: methods that return successive elements from some collection,
    such as an array:


    ```

    animals = %w(an bee cat dog elk) # create an array

    animals.each { |animal| puts animal } # iterate over the contents

    ```


    Each integer implements a times method, which invokes an associated block\N times:


    ```

    3.times { "Ho! " } => Ho! Ho! Ho!

    ```


    The & prefix operator & will allow a method to capture a passed block as a named
    parameter.


    ```

    def wrap &b

    print "Santa: "

    3.times(&b)

    print "\n"

    wrap { print "Ho! " }

    ```


    Within a block, or a method, control is sequential except when there is an exception.


    # Exceptions


    Exceptions are objects (of class Exception or its subclasses). The raise method
    causes an exception to be raised. This interrupts the normal flow through the
    code. Instead, Ruby searches back through the stack call for code that can handle
    this exception.


    Both methods and blocks of code wrapped between begin and end keywords intercept
    classes of exceptions using rescue clauses.


    ```

    begin

    content = load_blog_data(file_name)

    rescue BlogNotFoundError

    STDERR.puts "File #{file_name} not found"

    rescue BlogDataFormatError

    STDERR.puts "Invalid blog data in #{file_name}"

    rescue Exception => exc

    STDERR.puts "General error loading #{file_name}: #{exc.message}"

    end

    ```'
