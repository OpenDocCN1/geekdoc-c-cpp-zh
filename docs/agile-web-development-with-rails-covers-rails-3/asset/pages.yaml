  md: 'In this chapter, we''ll see


    +   - using partial templates,

    - rendering into the page layout,

    - updating pages dynamically with Ajax and RJS,

    - highlighting changes with Script.aculo.us.

    - hiding and revealing DOM elements, and

    - testing the Ajax updates.


    # Chapter 11


    # Task F: Add a Dash of Ajax


    Our customer wants to add Ajax support to the store. But just what is Ajax?


    In the old days (up until 2005 or so), browsers were treated as really dumb devices.
    When you wrote a browser-based application, you''d send stuff to the browser and
    forget about that session. At some point, the user would fill in some form fields
    or click a hyperlink, and your application would get woken up by an incoming request.
    It would render a complete page back to the user, and the whole tedious process
    would start afresh. That''s exactly how our Depot application behaves so far.


    But it turns out that browsers aren''t dumb (who knew?). They can run code. Almost
    all browsers can run JavaScript. And it turns out that the JavaScript in the browser
    can interact behind the scenes with the application on the server, updating the
    user sees as result. Jesse James Barnett this style of interaction Ajax (which
    once stood for Asynchronous JavaScript and XML but now just means "making browsers
    less suck")


    So, let''s Ajaxify your shopping cart. Rather than having a shopping cart page,
    let''s put the current cart display into the catalog''s sidebar. We''ll add the
    Ajax magic that updates the cart in the sidebar without redisplaying the whole
    page.


    Whenever you work with Ajax, it''s good to start with the non-Ajax version of
    the application and gradually introduce Ajax features. That''s what we''ll do
    here. For starters, let''s move the cart from its page and put it in the sidebar.'
