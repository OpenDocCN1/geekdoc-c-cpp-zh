    this state is transient, lasting for just a couple of interactions with the user.
    Sometimes the state is permanent and will be stored outside the application, often
    in a database.


    A model is more than just data; it enforces all the rules that apply to that data.
    For example, if a discount shouldn''t be applied to orders less than $20, the
    model will enforce the constraint. This makes sense; by putting the implementation
    of these business rules in the model, we make sure that nothing else in the application
    can make our data invalid. The model acts as a gatekeeper and a data store.


    The **view** is responsible for generating a user interface, normally based on
    data in the model. For example, an online store will have a list of products to
    be displayed on a catalog screen. This list will be accessible via the model,
    but it will be a view that accesses the list from the model and formats it for
    the end user. Although the view may present the user with various ways of inputting
