  md: '# Specifying Relationships in Models


    Active Record supports three types of relationship between tables: one-to-one,
    one-to-many, and many-to-many. You indicate these relationships by adding declarations
    to your models: has_one, has_many, belongs_to, and the wonder-fully named has_and_belongs_to_many.


    A one-to-one association (or, more accurately, a one-to-zero-or-one relation-ship)
    is implemented using a foreign key in one row in one table to reference at most
    a single row in another table. A one-to-one relationship might exist between orders
    and indices; for each order there''s at most one invoice.


    | invoices | orders |

    |---|---|n| id | id |

    | order_id | name |

    | ... | ... |


    ```

    class Invoice < ActiveRecord::Base

    belongs_to :order

    ...

    end

    ```


    ```

    class Order < ActiveRecord::Base

    has_one :invoice

    ...

    end

    ```


    As the examples show, we declare this in Rails by adding a has_one declaration
    to the Order model and by adding a belongs_to declaration to the invoice model.


    There''s an important rule illustrated here: the model for the table that contains
    the foreign key always has the belongs_to declaration.


    # One-to-Many Relationships


    A one-to-many association allows you to represent a collection of objects. For
    example, an order might have any number of associated line items. In the database,
    all the line item rows for a particular order contain a foreign key referring
    to that order.


    | line_items | orders |

    |---|---|n| id | id |

    | order_id | name |


    ```

    class LineItem < ActiveRecord::Base

    belongs_to :order

    ...

    end

    ```


    ```

    class Order < ActiveRecord::Base

    has_many :line_items

    ...

    end

    ```


    In Active Record, the parent object (the one that logically contains a collection
    of child objects) uses has_many to declare its relationship to the child.'
