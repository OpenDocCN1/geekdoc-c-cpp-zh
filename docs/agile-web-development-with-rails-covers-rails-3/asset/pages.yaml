    puts result => [\"TX\", 12345], [\"NC\", 3456], ...]\n```\n\nThis code returns\
    \ order hash. You identify it using the grouping element ('TX', 'NC', in our example).\
    \ You can also iterate over the entries in order each. The value of each entry\
    \ is the value of the aggregation function.\n\nThe order and limit methods come\
