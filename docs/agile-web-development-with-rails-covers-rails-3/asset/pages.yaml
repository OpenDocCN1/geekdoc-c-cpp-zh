    # Layouts


    Rails allows you to render pages that are nested inside other rendered pages.
    Typically this feature is used to put the content from an action within a standard-site-wide
    page frame (title, footer, and sidebar). In fact, if you''ve been using the generate
    script to create scaffold-based applications, you''ve been using these layouts
    all along.


    When Rails honors a request to render a template within a controller, it actually
    renders two templates. Obviously, the one you ask for (or the default template
    named after the action if you don''t explicitly render anything). But Rails also
    tries to find and render a layout template (we''ll talk about how it finds the
    layout in a second). If it finds the layout, it inserts the action-specific output
    into the HTML produced by the layout.


    Let''s look at a layout template:


    ```

    <html>

    <head>

    <title>Form: <%= controller.action_name %></title>

    <%= stylesheet_link_tag ''scaffold'' %>

    </head>

    <body>

    <%= yield :layout %>

    </body>

    </html>

    ```


    The layout sets out a standard HTML page, with the head and body sections. It
    uses the current action name as the page title and includes a CSS file. In the
    body, there''s a call to yield. This is where the magic takes place. The template
    for the action was rendered. Rails stored its content, labeling it layout. Inside
    the layout template, calling yield retrieves this. In fact, :layout is the default
    content when rendering so, you can write yield instead of yield layout. We personally
    prefer the slightly more explicit version.


    If the my_action.erb template contains this:


    ```

    <html><%= msg %> </html>

    ```'
