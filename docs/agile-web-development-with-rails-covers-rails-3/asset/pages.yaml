  md: 'However, there''s a trap waiting for you here. The transaction protected the
    database from becoming inconsistent, but what about our model objects? To see
    what happened to them, we have to arrange to intercept the exception to allow
    the program to continue running:


    What we see is a little surprising:


    ```

    Transfer aborted

    Paul has 550.0

    Peter has -250.0

    ```


    Although the database was left uncatched, our model objects were updated anyway.
    This is because Active Record not keeping track of the before and after states
    of the various objects—in fact it couldn''t, because it had no easy way of knowing
    which models were involved in the transactions.


    # Built-in Transactions


    When we discussed parent and child tables in Section 19.2, Specifying Relationships
    on Models, on page 278, we said that Active Record takes care of saving all the
    child row when you save a parent row. This takes multiple SQL executions (one
    for the parent and one for each changed or new children). Clearly, this change
    should be atomic, but until now we haven''t been using when saving these interrelated
    objects. We have been negligent?


    Fortunately, Active Record is smart enough to wrap all the updates and inserts
    related to a particular save (and the deletes related to) in a transaction; either
    all succeed or no data is written permanently to the database. You need explicit
    transactions only when you manage multiple SQL statements.'
