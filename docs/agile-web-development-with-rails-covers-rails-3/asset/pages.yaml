  md: '# Iteration C3: USING A HELPER TO FORMAT THE PRICE


    Looking at this page, we spot a minor problem with how prices are displayed. The
    database stores the price as a number, but we would like to show it as dollars
    and cents. A 12.34 should be shown as $12.34, and 13 should display as $13.00.
    We''ll tackle that next.


    # 8.3 Iteration C3: Using a Helper to Format the Price


    Ruby provides a sprintf function that can be used to format prices. We could place
    logic that makes use of this function directly in the view. For example, we could
    say this:


    ```

    <span class="price\%= sprintf("$0.02f", product.price) %></span>

    ```


    This would work, but it embeds knowledge of currency formatting into the view.
    We would want to internationalize the application layer, but this would be a maintenance
    problem.


    Instead, let''s use a helper method to format the price as a currency. Rails has
    an appropriate one built in—it''s called number_to_currency.


    Using our helper in the view is simple; in the index template, we change this:


    ```

    <span class="price\%= product.price %></span>

    ```


    to the following:


    ```

    Download depot_e/app/views/store/index.html.erb

    ```


    ```

    <span class="price\%= number_to_currency(product.price) %></span>

    ```


    Sure enough when we Refresh, we see a nicely formatted price:


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_111_0.png)


    Although it looks nice enough, we are starting to get a nagging feeling that we
    really should be running and writing tests for all this new functionality, particularly
    after our experience of adding logic to our model.'
