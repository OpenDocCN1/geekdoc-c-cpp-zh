  md: "In the old days of Rails, people frequently resorted to using find_by_sql.\
    \ Since then, all the options added to the basic find method mean that you can\
    \ avoid resorting to this low-level method.\n\n# Reloading Data\n\nIn an application\
    \ where the database is potentially being accessed by multiple processes (or by\
    \ multiple applications), there's always the possibility that a fetched model\
    \ object become stale—someone may have written a more recent copy to the database.\n\
    \nTo some extent, this issue is addressed by transactional support (which is described\
    \ on page 302). However, there'll be times when you need to refresh a model object\
    \ manually. Active Record makes this easy—simply call its reload method and the\
    \ object's attributes will be refreshed from the database:\n\n```\nstock = Market.find_by_ticker(\"\
    RUBY\")\nloop\n  puts \"price = #{stock.price}\"\n  sleep 60\n  stock.reload\n\
    \n```\n\nIn practice, reload is rarely used outside the context of unit tests.\n\
    \n# Updating Existing Rows\n\nAfter such long discussion of finder methods, you'll\
    \ be pleased to know that there's not much to say about updating records with\
    \ Active Record.\n\nIf you have an Active Record object (perhaps representing\
    \ a row from our orders table), you can write it to the database by calling its\
    \ save method. If this object had previously been read from the database, this\
    \ save will update the existing row; otherwise, the save will insert a new row.\n\
    \nIf an existing row is updated, Active Record will use its primary key column\
    \ to match it in the in-memory object. The attributes contained in the Active\
    \ Record object determine the columns that will be updated—a column will be updated\
    \ in the database only if its value has changed. In the following example, all\
    \ the values in the row for order 123 can be updated in the database table:\n\n\
    ```\norder = Order.find(123)\norder.name = \"Fred\"\norder.save\n```\n\nHowever,\
    \ in the following example, the Active Record object contains just the attributes\
    \ id, name—only these columns will be updated when the object is saved. (Note\
    \ that you have to include the id column if you intend to save a row fetched using\
    \ find_by_sql.)"
