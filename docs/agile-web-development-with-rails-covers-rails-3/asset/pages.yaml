- img_proc: true
  md: "This code gets the job done. It contains the basic HTML, with interspersed\
    \ bits of Ruby code enclosed in <% and %> markup. Inside that markup, an equals\
    \ sign is used to indicate that the value of the expression is to be converted\
    \ to HTML and displayed.\n\nThis is not the only adequate solution to the problem\
    \ at hand; it is also all that is really needed for a large number of Rails applications.\
    \ Additionally, it is an ideal place to start for books—like this one—where knowledge\
    \ of HTML may be presumed, by many of the readers are now in Rails and often to\
    \ Ruby itself. The last thing you would want to do in that situation is to introduce\
    \ another new language.\n\nBut now that you are past that learning curve, let's\
    \ go ahead and explore a new language—one that more closely integrates the production\
    \ of markup with Ruby code, namely, HTML Abstraction Markup Language (Haml).\n\
    \nTo start with, let's remove the file we just looked at:\n\nIn its place, let's\
    \ create a new file:\n\n```\n$ rm app/views/store/index.html.erb\n\n- if notice\n\
    %p#notice= notice\n%h1= t('.title.title_html1')\n\n- @products.each do |product|\n\
    \  = image_tag(product.image_url)\n  %h3= product.title\n  p= sanitize(product.description)\n\
    \  .price_line\n  %span.code= number_to_currency(product.price)\n  = button_to\
    \ t('.add_html'), line_items_path(product.id => product),\n    :remote => true\n\
    ```\n\nNote the extension: .html.haml. This indicates that the template is a Haml\
    \ template instead of an ERB template.\n\nThe first thing you should notice is\
    \ that the file is considerably smaller. Here's a quick overview of what is going\
    \ on inside, based on what the first character is on each line:\n\n+   - Dashes\
    \ indicate a Ruby statement that does not produce any output\n- Percent signs\
    \ (%) indicate an HTML element.\n- Equals signs (=) indicate a Ruby expression\
    \ that does produce output to be displayed. This can be used on other lines by\
    \ themselves or following HTML elements."
  merge: -1
  pgno: 427
- img_proc: true
  md: '![](img/8ef700b628afd52a22f1d4980b1cf82f_428_0.png)


    Figure 26.1: Storefront using Haml


    +   - Dots (.) and hash (#) characters may be used to define class and id attributes,
    respectively. This can be combined with percent signs or used stand-alone. When
    used by itself, a div element is implied.

    - A comma, at the end of a line containing an expression implies a continuous
    action. In the previous example, the button_to_call is continued across two lines.


    An important thing to note is that indentation is important in Haml. Returning
    to the same level of indentation closes the if statement, loop, or tag that is
    currently open. In this example, the paragraph is closed before the h1, the h1
    is closed before the first div, but the div elements nest, with the first containing
    an h3 element and the second containing a span and a button_to.


    As you can also see, all of your family helpers are available, things like it,
    image_tag, and button_to. In every meaningful way, Haml is as integrated into
    your application as ERB. You can mix and match: you have some templates using
    ERB and others using Haml.


    As you have already installed the Haml gem, there is nothing more than you need
    to do. To see this in action, all you need to do is to visit your storefront.
    What you should see match Figure 26.1.


    If that looks unremarkable, that''s because it should look exactly like it did
    before, and if you think about it, is all the more remarkable as the application
    layout needs to be implemented as an ERB template and the index'
