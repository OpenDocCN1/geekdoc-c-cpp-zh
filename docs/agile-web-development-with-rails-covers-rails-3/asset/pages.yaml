  md: '# Where''s My IDE?


    If you''re coming to Ruby and Rails from languages such as C# and Java, you may
    be wondering about IDEs. After all, we all know that it''s impossible to code
    modern applications without at least 100MB of IDE supporting your every keystroke.
    For you enlightened ones, here''s the point in the book we recommend you sit down—ideally
    propped up on each side by a frame-work references and 1,000-page Made Easy books.


    It may surprise you to know that most Rails developers don''t use fullyfledged
    IDEs for Ruby or Rails (although some of the environments come). Indeed, many
    Rails developers use plain old editors. And it turns out that this isn''t as much
    of a problem as you might think. With other, less expressive languages, programmers
    rely on IDEs to do much of the grunt work for them, because IDE do code generation,
    assist with navigation, and compile incrementally to give early warning of errors.


    With Ruby, however, much of this support just isn''t necessary. Editors such as
    TextMate and BBEdit give you 90 percent of what you''d get from an IDE but are
    far lighter weight. Just about the only useful IDE facility that''s missing is
    refactoring.


    for and edit previous commands, and how to complete the names of files and commands
    as you type.


    So-called tab completion is standard on Unix shells such as Bash and zsh. It allows
    you to type the first few characters of a filename, hit Tab, and have the shell
    look for and complete the name based on matching files.


    # Version Control


    We keep all our work in a version control system (currently Git). We make a point
    of checking a new Rails project into Git when we create it and committing changes
    once we have passed the tests. We normally commit to the repository many times
    in an hour.


    If you''re working on a Rails project with other people, consider setting up a
    continuous integration (CI) system. When anyone checks in, the CI system will
    check out a fresh copy of the application and run all the tests. It''s a simple
    way to avoid accidental regressions You can also set up your CI system so that
    your users can use it to play with the bleeding-edge version of your application.
    This kind of transparency is a great way of ensuring your project isn''t going
    off the tracks.'
  merge: -1
  pgno: 29
