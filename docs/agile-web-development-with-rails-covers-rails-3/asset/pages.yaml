  md: "# WRITE LESS AND DO MORE WITH JQUERY 43\n\nRJS file is executed on the server\
    \ and has access to the database models, and everything in the jQuery file with\
    \ the exception of the code contained in the <% %> markup is executed on the client\
    \ and has access to the Object Model (DOM) of the browser. This difference was\
    \ the reason for a small change in the order of these statements: check for the\
    \ length of the chart is done before the rendering. Note that a length of 1 is\
    \ used because there is a row of tables in the display, which is important if\
    \ you are thinking in the DOM.\n\nThere is one more that is needed, because one\
    \ line in the layout also uses another Prototype method:\n\n```\nDownload depot\
    \ v/app/views/layouts/application.html.erb\n<-- ... -->\n<div id=\"banner\">\n\
    \  <%= form_tag store_path, :class => 'locale' % %>\n  <%= select_tag 'locale',\
    \ \n\n  options_for_select(LANGUAGES, I18n.locale_to_s),\n\n  :onchange => 'this.form.submit()'\
    \ % %>\n  <%= submit_tag 'submit' % %>\n  <%= javascript_tag(\\('#.locale input').hide()')\
    \ %>\n  <%= image_tag(\"logo.png\") %>\n  <%= @page_title || t('.title') %>\n\
    </div>\n<-- ... -->\n```\n\nUnlike Wahlmi, with a pure addition, there is an extra\
    \ step we need to perform, to download the jQuery libraries and remove the unnecessary\
    \ prototype libraries. To assist with this, jquery-rails installs a Rails generator\
    \ that will take care of all the necessary steps. All we need to invoke it:\n\n\
    ```\nrails generate jquery:install --force\nremove public/javascripts/controls.js\n\
    remove public/javascripts/dragdrop.js\nremove public/javascripts/effects.js\n\
    remove public/javascripts/prototype.js\nfetching jQuery (1.4.3)\ncreate public/javascripts/jquery.js\n\
    create public/javascripts/jquery.min.js\nfetching jQuery UI (latest 1.x release)\n\
    create public/javascripts/jquery-ui.js\ncreate public/javascripts/jquery-ui.min.js\n\
    fetching jQuery UJS adapter (github HEAD)\nforce public/javascripts/rails.js\n\
    ```\n\nThe --ui parameter gets the jquery-ui libraries. The --force option will\
    \ replace the rails.js file."
