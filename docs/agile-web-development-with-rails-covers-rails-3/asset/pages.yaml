    # A Real Unit Test


    Let''s get onto the business of testing validation. First, if we create a product
    with no attributes we''ll expect it to be invalid and for there to be error methods
    associated with each field. We can use the model''s errors and invalid methods
    to see whether it validates, and we can use the any method of the error list to
    see whether there is an error associated with a particular attribute.


    Now that we know what to test, we need to know how to test the framework whether
    our code passes or fails. We do that using assertions. An assertion is a simple
    method that calls the framework what we expect to be true. The simplest assertion
    is the method assert(), which expects its argument to be true. If it is, nothing
    happens. But, if the argument to assert is false, the assertion fails. The framework
    will output a message and will stop executing the test method containing the failure.
    In our case, we expect that an empty Product will not pass validation, so we expect
    that asserting it isn''t valid.


    ```

    assert product.invalid?

    ```


    Replace the test test with the following code:


    ```

    Download depot_c/unit/product_test.rb

    test "product attributes must not be empty" do

    product = Product.new

    assert product.invalid?

    assert product.errors[:title].any?

    assert product.errors[:description].any?

    assert product.errors[:price].any?

    assert product.errors[:image_url].any?

    end

    ```


    We can rerun the unit tests using the command rake test:units. When we do so,
    we see the test executed successfully:


    ```

    depot rake test:units

    Loaded suite lib/rake/rake_test_loader

    Started


    Finished in 0.092314 seconds.

    1 tests, 5 assertions, 0 failures, 0 errors

    ```


    Sure enough, the validation kicked in, and all our assertions passed.'
