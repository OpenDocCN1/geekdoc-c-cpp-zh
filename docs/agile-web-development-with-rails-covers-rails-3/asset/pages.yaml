  md: "While YAML is one way to represent data, particularly when interacting with\
    \ humans, Ruby provides a more general way for representing data for use by applications.\n\
    \n# 4.5 Marshalling Objects\n\nRuby can take an object and convert it into a stream\
    \ of bytes that can be stored outside the application. This process is called\
    \ marshaling. This saved object can later be read by another instance of the application\
    \ (or by a totally separate application), and a copy of the originally saved object\
    \ can be reconstituted.\n\nThere are two potential issues when you use marshaling.\
    \ First, some objects cannot be dumped. If the objects to be dumped includes bindings,\
    \ procedure or method objects, instances of class, or singleton objects, or if\
    \ you try to dump anonymous classes or modules, a typeerror will be raised.\n\n\
    Second, when you load a marshaled object, Ruby needs to know the definition of\
    \ the class of that object (and all of the objects it contains).\n\nRails uses\
    \ marshaling to store session data. If you rely on Rails to dynamically load classes,\
    \ it is possible that a particular class may not have been defined at the point\
    \ it reconstitutes session data. For that reason, you'll use the model declaration\
    \ in your controller to list all models that are marshaled. This preemptively\
    \ loads the necessary classes to make marshaling work.\n\nNow that you have the\
    \ Ruby basics, let's give what what we learned a whirl with a slight rigor, annotated\
    \ example that pulls together a number of concepts. We'll follow with a walkthrough\
    \ of special features that will help you with your Rails coding.\n\n# 4.6 Pulling\
    \ It All Together\n\nLet's look at an example of how Rails applies a number of\
    \ Ruby features together to make the code you need to maintain more declarative.\
