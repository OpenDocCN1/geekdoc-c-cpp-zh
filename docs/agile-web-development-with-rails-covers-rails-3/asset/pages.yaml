  md: '# Creating Your Own Rails API Documentation


    You can create your own local version of the consolidated Rails API documentation.
    Just type the following commands at a command prompt:


    ```

    rails_apps> new dummy_app

    rails_apps> cd dummy_app

    dummy_app> rake doc:rails

    ```


    The last step takes a while. When it finishes, you''ll have the Rails API documentation
    in a directory tree at doc/api. We suggest moving this folder to your desktop
    and deleting the dummy_app. free.


    To view the Rails API documentation, open the location doc/api/index.html with
    your browser.


    normally run this window with a very small font so it takes up less space—if we
    see something interesting flash by, we zoom it up to investigate.


    We also need access to the Rails API documentation, which we view in a browser.
    In the introduction, we talked about using the gem server command to run a local
    web server containing the Rails documentation. This is convenient, but it unfortunately
    splits the Rails documentation across a number of separate documentation trees.
    If you''re online, you can use http://api.rubyonrails.org/ to see a consolidated
    view of all the Rails documentation in one place.


    # 1.6 Rails and Databases


    The examples in this book were written using SQLite 3 (version 3.6.16 or others).
    If you want to follow along with our code, it''s probably simplest if you use
    SQLite 3 too. If you decide to use something else, it won''t be a major problem.
    You may have to make minor adjustments to any explicit SQL in your code, but Rails
    works pretty much eliminates database-specific SQL from applications.


    If you want to connect to a database other than SQLite 3, Rails also works with
    DB2, MySQL, Postgres, Firebird, and SQL Server. For all SQLite 3, you''ll need
    to install a database driver, a library that Rails can use to connect and use
    your database engine. This section contains instructions to get that done.


    The database drivers are all written in C and are primarily distributed in source
    form. If you don''t want to bother building a driver from source, take a careful
    look at the driver''s website. Many times you''ll find that the author distributes
    binary versions.'
  merge: -1
