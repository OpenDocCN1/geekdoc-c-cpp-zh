    # What We Just Did


    In this iteration, we added Ajax support to our cart:


    +   * We moved the shopping cart into the sidebar. We then arranged for the

    create action to redraw the catalog page.

    * We used remote => true invoke the LineItemsController.create action using

    Ajax.

    * We used an RJS template to update the page with just the cart''s

    HTML.

    * To help the user see changes to the cart, we added a highlight effect,

    using the RJS template.

    * We wrote a helper method that hides the cart when it is empty and used

    t RJS template to reveal when an item is added.

    * We wrote a test that verifies not only the creation of a line item but also

    the content of the response that is returned from such a request.


    The key point to take away is the incremental style of Ajax development. Start

    with a conventional application, then add Ajax features, one by one.

    can be hard to debug: adding it slowly to an application, you make it easier

    t track what changed if your application stops working. And, as we saw,

    starting with a conventional application makes it easier to support both Ajax

    and non-Ajax behavior in the same codebase.


    Finally, we''ll give you a couple of hints. If you plan to do a lot of Ajax

    development, you''ll probably need to get familiar with your browser''s Java-

    script debugging facilities and with its DOM inspectors, such as Firefox''s Fire-

    , Internet Explorer 8''s Developer Tools, Google Chrome''s Developer Tools,

    Safari''s Web Inspector, or Opera''s Dragonfly. And, second a one-click breeze.
    Other-

    find it useful to run two different browsers when they are developing-with

    JavaScript enabled in one and in the other. Then, as features are

    added, poking it with both browsers will make your application work

    regardless of the state of JavaScript.'
