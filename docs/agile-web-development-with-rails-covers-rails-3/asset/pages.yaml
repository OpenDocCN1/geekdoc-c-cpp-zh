    # # Chapter 24


    # # Nonbrowser Applications


    Previous chapters focused primarily on server-to-human communications, mostly
    via HTML. But not all web interactions need to directly influence a person. This
    chapter focuses accessing your Rails application and data from within a stand-alone
    script.


    There are a variety of reasons why you might want to access portions of your Rails
    application from outside a browser. For example, you may desire to have your database
    loaded or synchronized periodically using a background job kicked off by a utility
    like cron. You may have existing applications, perhaps even Rails applications,
    that want to directly access the data in (another) Rails application, possibly
    even on a different machine. You might just want a command-line interface, not
    because it is required but just because.


    Whatever your reasons, Rails is there for you. As you will see, you will be able
    to pull in as little or as much of Rails as you need to get your job done.


    We will start with the assumption that your application is on the same machine
    as your installation of Rails and your data, and then we will proceed to describe
    how you can do the same on a remote machine.


    # ## 24.1 A Stand-Alone Application Using Active Record


    One of the first things you will want unfettered access to your data. You will
    be pleased to know that you can make full use of Active Record from within a stand-alone
    application. First, we will show you the "hard" to do so (the "scare quotes" because
    it isn''t all that hard—remember it is Rails we are talking about, after all).
    Then we will show you the easy way.


    We will start with a stand-alone program that uses Active Record to wrap a table
    of orders in a SQLite 3 database. After finding the order with a particular id,
    it modifies the purchaser''s name and saves the result in the database, updating
    the original row.'
