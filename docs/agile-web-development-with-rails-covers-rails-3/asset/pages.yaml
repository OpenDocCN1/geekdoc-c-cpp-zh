    # Identifying Individual Rows


    Active Record classes correspond to tables in a database. Instances of a class
    correspond to the individual rows in a database table. Calling Order.find(1),
    for instance, returns an instance of an Order class containing the data in the
    row with the primary key of 1.


    If you are creating a new schema for a Rails application, you''ll probably want
    to go with the flow and let it add the id primary key column to all your tables.
    However, if you need to work with an existing schema, Active Record gives you
    a simple way of overriding the default name of the primary key for a table.


    For example, we may be working with an existing schema that uses the ISBN as the
    primary key for the books table.


