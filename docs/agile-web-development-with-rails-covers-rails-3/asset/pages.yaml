    This code uses the new Order class to fetch the order with an id of 1 and modify
    the pay_type. (We''ve omitted the code that creates a database connection for
    now.) Active Record relieves us of the hassles of dealing with the underlying
    database, leaving us free to work on business logic.


    But Active Record is more than that. As you will see when we develop our shopping
    cart application, starting on page 71, Active Record integrates seamlessly with
    the rest of the Rails framework. If a web form sends the application data related
    to a business object, Active Record can extract it into our model. Active Record
    supports sophisticated validation of model data, and if the form data fails validations,
    the Rails views can extract and format errors.


    Active Record is the solid foundation of the Rails architecture.


