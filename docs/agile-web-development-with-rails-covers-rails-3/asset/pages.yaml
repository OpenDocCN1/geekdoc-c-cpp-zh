    is a gem that provides this functionality for us.


    You''ve already seen how you control gems get loaded by your application: you
    do this by editing your Gemfile. Since we are going to cover a number of such
    gems in this chapter, let''s go ahead and add all of the gems that we will cover
    at once. You can actually add this place you like; we''ve chosen to do so immediately
    under the line adding the dependency on will_paginate.'
