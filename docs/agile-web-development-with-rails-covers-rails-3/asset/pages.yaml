    # # Chapter 17


    # ## Depot Retrospective


    Congratulations! By making it this far, you have obtained a solid understanding
    of the basics of every Rails application. There is much more to learn, which we
    will pick back up again in Part III. For now, relax, and let''s recap what we
    saw in Part II.


    # ### 17.1 Rails Concepts


    InChapter 3, *The Architecture of Rails Applications.*, on page 48 we introduced
    models, views, and controllers. Now let''s see how we applied each of these concepts
    in the Depot application. Let''s explore how we used configuration, testing, and
    deployment.


    # ### Model


    Models are all the persistent data retained by your application is managed. In
    developing the Depot application, we created five models: *Cart, Lineitem, Order,
    Product, and User.*


    By default, all models have id, *created_at*, and *updated_at* attributes. To
    our models, we added attributes of type string (examples: title, name), integer
    (quantity), text (address, description), decimal (price), and foreign keys (product_id,
    cart_id). We created a virtual attribute that is never stored in the database,
    namely, a password.


    We created *has_many* and *belongs_to* relationships that we can use to navigate
    between our model objects, such as from *Cart* to *Lineitems* to Products.


    We employed migrations to update the databases, not only to introduce new schema
    information but also to modify existing data. We demonstrated that they can be
    applied in a fully reversible manner.


    The models we created were never passively receptacles for our data. For starters,
    they actively validate the data, preventing errors from propagating.'
