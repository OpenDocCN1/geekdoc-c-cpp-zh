    # Filters


    Filters enable you to write code in your controllers that wrap the processing
    performed by actions—you can write called before or after any number of actions
    in your controller (or your controller''s subclasses). This turns out to be a
    powerful facility. Using filters, you can implement authentication schemes, logging,
    response compression, and even response customization.


    Rails supports three types of filters: before, after, and around. Filters are
    called just prior to and/or after the execution of actions. Depending on how you
    define them, they either run as methods inside the controller or are passed the
    controller object when they are. Either way, they get access to details of the
    request and response objects, along with the other controller attributes.


    # Before and After Filters


    As their names suggest, before and after filters are invoked before or after an
    action. Rails maintains two chains of filters for each controller. When a controller
    is about to run an action, it executes all filters on the before chain. It executes
    the action before running the filters on the after chain.


    Filters can be passive, monitoring activity performed by a controller. They can
    also take a more active part in request handling. If a before filter returns false,
    processing of the filter chain terminates, and the action is not run. A filter
    may also render output or redirect requests, in which case the original action
    never gets invoked.


    We saw an example of using filters for authorization in the administration part
    of our store example on page 208. We defined an authorization method that redirected
    to a login screen if the current session didn''t have a logged-in user. We made
    this method a before filter for all the actions in the administration controller.


    Filter declarations also accept blocks and the names of classes. If a block is
    specified, it will be called with the current controller as a parameter. If a
    class is given, its filter method will be called with the current controller as
    a parameter.'
