  md: "# 11.1 Iteration F1: Moving the Cart\n\nCurrently, our cart is rendered by\
    \ the show action in the CartController and the corresponding_html.erb template.\
    \ What we'd like to do is moving that into the sidebar. This means it will no\
    \ longer be in its own page. Instead, we'll render it in the layout that displays\
    \ the overall catalog. And that's easy using partial templates.\n\n# Partial Templates\n\
    \nProgramming languages let you define methods by name, and the corresponding\
    \ chunk of code with a name: invoke the method and of code runs. And, of course,\
    \ you can pass parameters to a method, which you write one piece of code that\
    \ can be used in many different circumstances.\n\nYou can think of Rails partial\
    \ templates (partials for short) as a kind of method for views. A partial is simply\
    \ a chunk of a view in its own separate file. You can invoke (render) from another\
    \ template or the same controller, and the partial will render itself and return\
    \ the results of that rendering. And, just with methods, you can pass parameters\
    \ to a partial, so the same partial can render different results.\n\nWe'll use\
    \ partials twice in this iteration. First, let's look at the cart display itself:\n\
    \n```\n<div class=\"cart-title\">Your Cart</div></div>\n<table>\n  <% @cart.line_items.each\
    \ do |item| %>\n  <tr>\n    <td><%= item.quantity %>&amp;</td>\n    <td><%= item.product.title\
    \ %></td>\n    <td class=\"item_price\"><%= number_to_currency(item.total_price)\
    \ %></td></td>\n  </tr>\n  <% end %>\n\n  <tr class=\"total_line\">\n    <td colspan=\"\
    2\"><%= \"Total:\" %></td></td>\n    <td class=\"total_cell\"><%= number_to_currency(@cart.total_price)\
    \ %></td></td>\n  </tr>\n</table>\n\n<%= button_to 'Empty cart', @cart, :method\
    \ => :delete,\n  :confirm => \"Are you sure?\" %>\n```\n\nIt creates a list of\
    \ rows, one for each item in the cart. Whenever you find yourself iterating like\
    \ this, you might want to stop and ask yourself, is this too much logic in a template?\
    \ It turns out we abstract away the logic using partials (and, as we see, this\
    \ also sets the stage for some Ajax magic later)."
