    \n```\n<%= link_to \"Delete\", product_path(@product),\n      { :class => \"dangerous\"\
    , :method => 'delete' }\n>\n```\n\nThis third parameter also supports two additional\
    \ options that modify the behavior of the link. Each requires JavaScript to be\
    \ enabled in the browser.\n\nThe :method option is a hack—it allows you to make\
    \ the link to the application if the request were requested as a POST, PUT, or\
    \ DELETE, rather than the normal GET method. This is done by creating a chunk\
    \ of JavaScript that submits the request when the link is clicked—if JavaScript\
    \ is disabled in the browser, a GET will be generated.\n\nThe :confirm option\
    \ takes a short message. If present, JavaScript is generated to display the message\
    \ and get the user's confirmation before the link is followed:\n\n```\n<%= link_to\
