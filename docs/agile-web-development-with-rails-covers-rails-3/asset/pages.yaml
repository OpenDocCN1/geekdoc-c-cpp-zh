  md: '# Joe Asks...


    # Can I Also Receive Email?


    Action Mail makes it easy to write Rails applications that handle appropriate
    emails. Unfortunately, you need to find a way to retrieve emails from your server
    environment and inject them into the application; this requires a bit more work.


    The easy part is handling an email within your application. In your Action Mailer
    class, an instance method Mail::Message receive takes a single parameter. This
    parameter will be a Mail::Message object corresponding to the incoming email.
    You can extract fields, the body text, and/or attachments and use them in your
    application.


    All the normal techniques for intercepting email end up running a command, passing
    that command the content of the email as standard input. If we make the Rails
    runner script the command that invoked whenever an email arrives, we can arrange
    to pass that email into our application''s email-handler code. For example, using
    proc-based interception, we could write a rule that looks like the example that
    follows. Using the arcane syntax of proc, this rule copies any incoming email
    subject lines through our script:


    ```

    RUB=/opt/local/bin/ruby

    TICKET_APP_DIR=$/users/ave/Work/dept

    HANDLER=''IncomingTicketHandler.receive(STDIN.read)''

    ```


    ```

    :0 c

    + ^Subject: Bug Report.

    | cd $TICKET_APP_DIR && $RUB HANDLER

    ```


    The receive class method is available to all Action Mailer classes. It takes the
    email text, parses it into a Mail object, creates a new Instance of the receiver''s
    class, and passes the Mail object to the receive instance method in class.


    But, for email templates, there''s a little bit more magic naming. If you create
    multiple templates with the same name but different content types embedded in
    their filenames, Rails will send all of them in one email, aggregating the content
    so that the email client will be able to distinguish each.


