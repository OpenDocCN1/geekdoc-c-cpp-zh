    \ start by creating a new database table. (Make sure your database supports transactions,\
    \ or this code won't work for you.)\n\n```\nDownload e|/ar/transactions.rb\ncreate_table\
    \ :accounts, :force => true do |t|\nt.string :number\nt.decimal :balance, :precision\
    \ => 10, :scale => 2, :default => 0\nend\n```\n\nNext, we'll define a simple bank\
    \ account class. This class defines instance methods to deposit money and withdraw\
    \ money from the account. It provides some basic validation—for this particular\
