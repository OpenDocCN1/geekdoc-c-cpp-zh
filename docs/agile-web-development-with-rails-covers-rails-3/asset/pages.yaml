    session_store = :drb_store

    DRB is a protocol that allows Ruby processes to share objects over a network connection.
    Using the DRStore database manager, Rails stores session data on a DRB server
    (which you manage outside the web application). Multiple instances of your application,
    potentially running on distributed servers, can access the same DRB store. DRB
    uses Marshal to serialize objects.


    session_store = :mem_cache_store

    memcached is a freely available, distributed object caching system maintained
    by Dormando. The Rails MemCacheStore uses Michael Granger''s Ruby interface to
    memcached sessions. memcached is more complex to use than the other alternatives
    and is probably interesting if you are already using it for other reasons at your
    site.


    session_store = :memory_store

    This option stores the session data locally in the application''s memory. Because
    no serialization is involved, any object can be stored in an in-memory session.
    As we''ll see in a minute, this generally is not a good idea for Rails applications.


    session_store = :file_store

    Session data is stored in flat files. It''s pretty much useless for Rails applications,
    because the contents must be strings. This mechanism supports the additional configuration
    options :prefix, :suffix, and :tmpdir.


