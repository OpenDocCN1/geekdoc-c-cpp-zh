  md: "Classes are not the only organizing structure in Ruby. The other organizing\
    \ structure is a module.\n\n# Modules\n\nModules are similar to classes in that\
    \ they hold a collection of methods, constants, and other module and class definitions.\
    \ Unlike classes, you cannot create objects based on modules.\n\nThere are two\
    \ purposes. First, they act as a namespace, letting you define methods whose names\
    \ will not clash with those defined elsewhere. Second, they allow you to share\
    \ functionality between classes—if a class mixes in a module, that module's instance\
    \ methods become available as if they had defined in the class. Multiple classes\
    \ can mix in the same module, sharing the module's functionality without using\
    \ inheritance. You can also mix multiple modules into a single class.\n\nHelper\
    \ methods are an example of where Rails uses modules. Rails automatically mixes\
    \ these methods into the appropriate templates. For example, if you wanted to\
    \ write a helper method that would be callable from views invoked by the store\
    \ controller, you could define the module in the file `store_helper.rb` in the\
    \ app/helpers directory:\n\n```\nmodule StoreHelper\n  def capitalize_words(string)\n\
    \    string.split(' ').map {|word| word.capitalize}.join(' ')\nend\n```\n\nThere\
    \ is one module that is part of the standard library of Ruby that deserves special\
    \ mention given its usage in Rails, YAML.\n\n# YAML\n\nYAML is a recursive acronym\
    \ that stands for YAML Ain Markup Language. In the context of Rails, YAML is used\
    \ as a convenient way to define configuration of things such as databases, test\
    \ data, and translations. Here is an example:\n\n```\ndevelopment:\n  adapter:\
    \ sqlite3\n  database: db/development.sqlite3\n  pool: 5\n  timeout: 5000\n```\n\
    \nIn YAML, indentation is important, so this defines development as having a set\
    \ of four key/value pairs, separated by colons.\n\n+   - http://www.yaml.org/"
