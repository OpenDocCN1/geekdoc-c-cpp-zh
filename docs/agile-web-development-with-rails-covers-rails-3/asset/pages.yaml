  md: "# David Says...\nBattle of the Routes: product_path vs. product_url\n\nIt can\
    \ seem hard in the beginning to know when to use product_path and when to use\
    \ product_url when you want to link or redirect to a given route. In reality,\
    \ it's quite simple enough.\n\nWhen you use product_url, you'll get the full enchilada\
    \ with protocol and domain name, like http://example.com/products/1. That's the\
    \ thing to use when you're redirecting to the HTTP spec requires a qualified URL\
    \ when doing 302 Redirect and friends. You also need the full URL if you're redirecting\
    \ from one domain to another, product_url(domain=\"example2.com\", :product=product).\n\
    \nThe rest of the time, you can happily use product_path. This will generate only\
    \ the /products/1 part, and that's all you need when doing links or pointing forms,\
    \ link_to=\"My lovely product\", product_path(product).\n\nNow the confusing part\
    \ is oftentimes the two are interchangeable because lenient browsers. You can\
    \ do a redirect_to with a product_path and it'll properly work, but it won't be\
    \ valid according to spec. And you can link_to to a product_url, but then you're\
    \ littering your HTML with needless characters, which is a bad idea too.\n\nNow\
    \ when we view our cart and click the `Empty Cart` button, we get back to the\
    \ catalog page, and a nice little message says this:\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_134_0.png)\n\
