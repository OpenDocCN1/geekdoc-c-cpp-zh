    format:


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_40_0.png)


    Notice that if you hit Refresh in your browser, the time updates each time the
    page is displayed. It looks as if we''re really generating dynamic content.


    # Adding the Time


    Our original problem was to display the time to users of our application. We now
