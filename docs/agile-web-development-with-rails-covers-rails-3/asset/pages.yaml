  md: 'Now we need to link the two screens. We will put a link on the hello screen
    that takes us to the goodbye screen, and vice versa. In a real application, we
    might want to make these proper buttons, but for now we''ll just use hyperlinks.


    We already know that Rails uses a convention to parse the URL into a target controller
    and an action within that controller. So, a simple approach would be to adopt
    this URL convention for our links.


    The file `hello.html.erb` would contain the following:


    ```

    ...

    <p>

    Say <a href="/goodbye">Goodbye</a>!

    </p>

    ...

    ```


    And the file `goodbye.html.erb` would point the other way:


    ```

    ...

    <p>

    Say <a href="/hello">Hello</a>!

    </p>

    ...

    ```


    This approach would certainly work, but it''s a bit fragile. If we were to move
    our application to a different place on the web server, the URLs would no longer
    be valid. It also encodes assumptions about Rails format into our code; it''s
    possible a future version of Rails might change this.


    Fortunately, these aren''t risks to take. Rails comes with a bunch of `helper
    methods` that can be used in view templates. Here we''ll use the helper method
    `link_to`, which creates a hyperlink to an action.(The `link_to` method can do
    a lot more than this, but let''s take it gently for now.) Using `link_to`, `hello.html.erb`
    becomes the following:


    ```

    load work/demo/05/views/say/hello.html.erb

    <h1>Hello from Rails!</h1>

    <p>

    It is now <%= @time %>

    </p>

    <p>

    Time to say

    <%= link_to "Goodbye", say_goodbye_path %>

    </p>

    ```


    There''s a `link_to` call within an ERB `<%= %>` sequence. This creates a link
    to a URL that will invoke the goodbye action. The first parameter in the call
    to `link_to` is the text to be displayed in the hyperlink, and the next parameter
    tells Rails to generate the link to the goodbye action.'
