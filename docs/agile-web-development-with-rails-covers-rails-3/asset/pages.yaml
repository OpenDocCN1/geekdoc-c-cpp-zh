    # 14.3 Iteration I3: Limiting Access


    We want to prevent people without an administrative login from accessing our site''s
    admin pages. It turns out it''s easy to implement using the Rails filter facility.


    Rails filters you to intercept calls to action methods, adding your processing
    before they are invoked, after return, or both. In our case, we''ll use a before
    filter to intercept all calls to the actions in our admin controller. The interceptor
    can check session[:user_id]. If it''s set and it corresponds to a user in the
    database, the application knows an administrator is logged in, and the call can
    proceed. If it is not set, the interceptor can issue a redirect, in this case
    to our login page.'
