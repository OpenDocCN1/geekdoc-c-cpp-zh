    bundle install will use the Gemfile.lock as a starting point and install only
    the versions of the various gems as specified in this file. For this reason, it
    is important that this file gets checked into your version control system, because
    this will ensure that your colleagues and deployment targets will be using the
    exact same configuration.


    bundle update (surprisingly) update one or more gems will update the Gemfile.lock
    accordingly. If you want to use a specific version of a particular gem, the workflow
    would be to edit the Gemfile to express your constraints and then run bundle update
    listing the gems you want to update. If you don''t specify a list of gems. Bundler
    will attempt to update all gems—this is generally not recommended, particular
    when close to deployment.


    Bundler also has a runtime component that is used to ensure that your application
    strictly loads only the versions of the gems listed in Gemfile.lock. We will explore
    that further by looking into how the server operates.


    # 25.4 Interfacing with the Web Server with Rack


    Rails runs your application in the context of a web server. So far, we have used
    two web servers: WEBrick, which comes built into the Ruby language itself, and
    Phusion Passenger, which integrates with the Apache HTTP web server. There are
    a number of other choices available, including Mongrel, Lighttpd, and Unicorn.


    Based on this, you might come to the conclusion that Rails has code that allows
    it to plug into each of these web servers. In earlier releases of Rails, this
    was true; as of Rails 2.3, this integration was delegated to a gem named Rack.


    So, Rails integrates with Rack, Rack integrates with (for example) Passenger,
    and Passenger integrates with Apache httpd.'
