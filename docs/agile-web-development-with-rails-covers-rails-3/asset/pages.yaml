  md: '# ITERATION 11: ADDING USERS


    ```

    Download depot_r/app/models/user.rb

    def User.encrypt_password(password, salt)

    digest::SHA2.hexdigest(password + "wibble" + salt)

    end

    ```


    In cryptography, salts are used to make it harder to crack the password. We''ll
    create a salt string by concatenating a random number and the object id of the
    user object. It doesn''t matter much what the salt is as long as it''s unpredictable
    (using the time as a salt, for example, has lower entropy than a random string).
    We store this new salt into the model''s salt attribute. This should be a private
    method, place after the private keyword in the source:


    ```

    Download depot_r/app/models/user.rb

    def generate_salt

    self.salt = self.object.id_to_s + rand.to_s

    end

    ```


    There''s a subtlety in this code we''ve never seen before. Note that we wrote
    self.salt = ... This forces assignment to the salt accessor method—we''re saying
    "call the method salt in the current object." Without self., Ruby would have thought
    we were assigning to a local variable, and our code would have no effect.


    Although using the instance variable directly would achieve the correct results,
    it would also tie you to a representation that may not be the same. The attribute
    salt=" is official to the underlying model attributes, so it is better to use
    them rather than instance variables.


    Another way of looking at it is that the attributes form part of the public interface
    of the class, the class should eat its own dog food and use that interface. If
    you use @@ internally and @x externally, the door is wide open for some kind of
    mismatch down the road.


    Now we need to write code so that whenever a new-text password is stored into
    our object we automatically generate a hashed version (which will get stored in
    the database). We''ll do that by making the plain-text password a virtual attribute
    of the model—it looks like an attribute to our application, but it isn''t persisted
    into the database.


    If it''s needed to create the hashed version, we could do this using Ruby''s attr_accessor
    declaration:


