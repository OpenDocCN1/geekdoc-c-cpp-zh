    \ migration 4: our application longer contains a class called OrderHistory, so\
    \ the migration fails.\n\nOne solution, proposed by Tim Lucas, is to create local,\
    \ dummy versions of the model classes needed by a migration within the migration\
    \ itself. The following version of the fourth migration will work even if the\
