    and `memcached` as overkill, the server-side choices boil down to PStore, Active
    Record store, and DRB-based storage. You should need to store more in a session
    than you can with cookies, we recommend you start with an Active Record solution.
    If your application grows, you find this becoming a bottleneck, you can migrate
    to DRB-based solution.


    # Session Expiry and Cleanup


    One problem with all the server-side session storage is that each new session
    adds something to the session store. This means you''ll eventually need to do
    some housekeeping or you''ll run out of server resources.


    There''s another reason to tidy up sessions. Many applications don''t want a session
    to last forever. Once a user has logged in from a particular browser, the application
    might want to enforce a rule that the user stays logged only as long as they are
    active; when they log out or some fixed time after they use the application, their
    session should be terminated.


    You can achieve this effect by expiring the cookie holding the session id. However,
    this is end-user abuse. Worse, it is hard to synchronize the expiry of a cookie
    with the browser with the tidying of the session data on the server.


    We therefore suggest that you expire sessions by simply removing their server-side
    session data. Should a browser request subsequently arrive containing session
    id for data that has been deleted, the application will receive no session data;
    the session will effectively not be there.


    Implementing this expiration depends on the storage mechanism being used.


    For PStore-based sessions, the easiest approach is to run a sweeper task periodically
    (for example using cron() under Unix-like systems). This task should inspect the
    last modification times of the files in the session data directory, deleting those
    older than a given time.


    For Active Record-based session storage, use the `updated_at` columns in the sessions
    table. You can delete all sessions that have not been modified in the'
