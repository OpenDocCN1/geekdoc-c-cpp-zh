  md: 'Idiomatic Rails developers use a variable named after the template (article
    in this instance). In fact, it''s normal to take this step further. If the object
    to be passed to the partial is a controller instance variable with the same name
    as the partial, you can omit the object parameter. If, in the previous example,
    our controller had set up the article in the instance variable @article, the view
    could have rendered the partial using this:


    ```

    <%= render(partial => "article") %>

    <h3>Add Comment</h3>

