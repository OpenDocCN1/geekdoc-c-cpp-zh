  md: 'In this chapter, we''ll see


    +   - localizing templates, and

    - database design considerations for i118n.


    # Chapter 15


    # # Task J: Internationalization


    Now we have a basic cart working, and our customer starts to inquire about languages
    other than English, noting that her company has a big push on expansion in emerging
    markets. Unless we can present something in a language that visitors to our customer''s
    website will understand, our customer will be leaving money on the table. We can''t
    have that.


    The first problem is that none of us is a professional translator. The customer
    reassures us that this is not something we need to concern ourselves with because
    that part of the effort will be outsourced. We all need to worry about *enabling*
    translation. Furthermore, we don''t have to worry about the administration pages
    just yet, because all the administrators speak English. What we have to focus
    is on the store.


    That''s a relief—but is still a tall order. We are going to define a way to enable
    the user to select a language, we are going to have to provide the translations
    themselves, and we are going to have change the views to use these translations.
    But we are up to the task, and armed with a bit of memory high-school Spanish,
    we set off to work.


    > > Joe Asks...\ If I Stick to One Language, Do I Need to Read This Chapter?


    The short answer is no. In fact, many Rails applications are for a small or homogeneous
    group and never need translating. Being that said, pretty much everybody do find
    that they need translation agrees that it is best if it is done early. So, unless
    you are sure that translation will never ever be needed, it is our recommendation
    that you at least understand what would be involved so that you can make an informed
    decision.'
