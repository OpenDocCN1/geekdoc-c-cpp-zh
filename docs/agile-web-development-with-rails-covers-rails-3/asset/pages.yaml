  md: '# ITERATION K1: DEPLOYING WITH PHUSION PASSENGER AND MYSQL


    In a third iteration, we will cover various administrative and cleanup tasks.

    Let''s get started!


    # 16.1 Iteration K1: Deploying with Phusion Passenger and MySQL


    So far, we''ve been developing a Rails application on our local machine, we''ve
    probably been using WEBrick or Mongel when we run our server. The most part, it
    doesn''t matter. The rails server command will sort out the most appropriate way
    to get our application running in development mode on port 3000. However, a deployed
    Rails application works a bit differently. We can''t just fire a single Rails
    server and let it do all the work. Well, could, but it''s far from ideal. The
    reason for this is that Rails is single-threaded. It can work on one request at
    a time


    The Web, is an extremely concurrent environment. Production web servers, such
    as Apache, Lighttpd, and Zeus, can work on several requests—even tens or hundreds
    of requests—at the same time, single-threaded Ruby web server cannot possibly
    keep up. Luckily, it doesn''t have to keep up. Instead, the way that we deploy
    a Rails application into production is to use a front-end server, such as Apache,
    to handle requests from the client. Then, you use the HTTP proxying of Passenger
    to send requests that should be handled by Rails to any number of back-end application
    processes.


    # Installing Passenger


    The first step is to ensure that the Apache web server is installed. For Mac X
    users, and many Linux users, it is already installed with the operating system.
    Windows users can find instructions on installing this product on the Apache website.¹


    The next step is to install Passenger:


    ```

    $ sudo gem install passenger

    $ sudo passenger-install-apache2-module

    ```


    If the necessary dependencies are not met, the latter command will tell you what
    you need to do. For example, on a Ubuntu 10.04 (Lucid Lynx) Linux, you will find
    that you need to install build-essential, apache2-prefork-dev, libapr1-dev, and
    libaprutil1-dev. If this happens, follow the provided instructions, and try the
    passenger command again.


    Once the dependencies are satisfied, this command causes a number of sources to
    be compiled and the configuration files to be updated. During the process, it
    will ask us to update our Apache configuration. The first will be to enable firstly
    module and will adding lines as the


    +   1. http://httpd.apache.org/docs/2.2/platform/windows.html#inst'
