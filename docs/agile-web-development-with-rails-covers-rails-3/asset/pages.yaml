    # ## Subsetting Records Returned


    Now that we know how to specify conditions, let''s turn our attention to the various
    methods supported by ActiveRecord::Relation, starting with first and all.


    As you may have guessed, first returns the first row in the relation. It returns
    nil if the relation is empty. Similarly, all returns all the rows of array. ActiveRecord::Relation
    also supports many of the methods of Array objects, such as each and map. It does
    so implicitly by calling the first.


    It''s important to understand that the query is not evaluated until one of these
    methods is used. This enables us to modify the query in a number of ways, namely,
    by calling additional methods, prior to making this call. Let''s look at these
    methods now.


    # order


    SQL that will be returned in any particular order unless we explicitly add an
    order by clause to the query. The order method lets us specify the criteria we''d
    normally add after the order by keywords. For example, the following query would
    return all of Dave''s, sorted by payment type and then by shipping date (in descending
    order):


    ```

    orders = Order.where(:name => ''Dave'')

    order("pay_type, shipped_at DESC")

    ```


    # limit


    We can limit the number of rows returned by calling the limit method. Generally
    when we use the limit method, we will probably also need to sort the order to
    ensure consistent results. For example, the following returns the first ten


    ```

    orders = Order.where(:name => ''Dave'')

    order("pay_type, shipped_at DESC")

    limit(10)

    ```'
