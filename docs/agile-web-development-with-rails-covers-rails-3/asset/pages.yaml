  md: 'When we refresh our browser window, we will see again the current time, showing
    that the communication between the controller and the view was successful.


    Why did we go to the extra trouble of setting the time to be displayed in the
    controller? Good question. In this application, it doesn''t make much difference,
    but by putting the logic in the controller instead, we owe ourselves benefits.
    For example, we may want to extend our application in the future to support users
    in many countries. In that case, we''d want to localize the display of the time,
    choosing a time appropriate to their time zone. That would be a fair amount of
    application-level code, and it probably not be appropriate to embed it at the
    view level. By setting the time in the controller, we make our application more
    flexible—we can change the time zone in the controller without updating any view
    that uses that time object. The time is *data*, and it should be supplied to the
    view by the controller. We''ll see a lot more of this when we introduce models
    into the equation.


    # The Story So Far


    Let''s briefly review our current application works:


    +   1. The user navigates to our application. In our case, we do that using a
    local URL such as `http://localhost:3000/say/hello`.


    +   2. Rails matches the route pattern, which it previously split into two parts
    and analyzed.


    > The part is taken to be the name of a controller, Rails creates a new instance
    of the Ruby class `SayController` (which finds it in `app/controllers/say_controller.rb`).


    +   3. The next part of the pattern, `hello`, identifies an action. Rails invokes
    a method of that name in the controller. This action creates a new `Time` object
    holding the current time and tucks it away in the `@time instance variable.


    +   4. Rails looks for a template to display the result. It searches the directory
    `app/views` for a subdirectory with the same name as the controller (`say`) and
    in that subdirectory for a file named after the action (`hello.html.erb`).


    +   5. Rails processes this file through the ERB templating engine, executing
    any embedded Ruby and substituting in values set up by the controller.


    +   6. The result is returned to the browser, and Rails finishes the request.'
