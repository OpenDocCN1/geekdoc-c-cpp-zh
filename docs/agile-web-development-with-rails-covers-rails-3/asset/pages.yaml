  md: "Regardless of which store you pick for caching fragments, you should be aware\
    \ network bottlenecks can quickly become a problem. If your site depends heavily\
    \ on fragment caching, every request will need a lot of transferring from the\
    \ network drive to the specific server before it's sent on to the user. To use\
    \ this on a high-profile site, you will need to have a high-bandwidth internal\
    \ network between your servers, or you will see slowdown.\n\nThe caching store\
    \ system is available only for caching actions and fragments. Full-page caches\
    \ need to be kept on the filesystem the public directory. In this case, you will\
    \ have to go the network drive route if you want to use page caching across multiple\
    \ web servers. You can then symlink the entire directory (but that will also cause\
    \ your images, stylesheets, and JavaScript to be passed over the network, which\
    \ may be a problem) or just the individual directories that are needed for your\
    \ page caches. In the latter case, you would, for example, symlink public/products\
    \ to your network drive to keep page caches for your products controller.\n\n\
    # Expiring Pages Implicitly\n\nThe expire_xxx methods work, but they also couple\
    \ the caching function to the code in your controllers. Every time you change\
    \ something in the database, you also have to work out which pages might affect\
    \ this. Although this is easy for smaller applications, this gets more difficult\
    \ as the application grows. A change made in one controller might affect page\
    \ caches in another. Business logic in helper methods, which really needs to know\
    \ about HTML pages, now needs to worry about expiring cached pages.\n\nFortunately,\
    \ Rails sweepers can simplify some of this coupling. A sweeper is a special kind\
    \ of observer on your model objects. When something significant happens in the\
    \ model, the sweeper expires the cached pages that depend on that model's data.\n\
    \nYour application can have as many sweepers as it needs. You'll typically create\
    \ a sweeper to manage the caching for each controller. Put your sweeper in app/sweepers:\n\
    \n```\nDownload/cookies.app/sweepers/article_sweeper.rb\nclass ArticleSweeper\
    \ < ActionController::Caching::Sweeper\n  observe Article\n\n  # If we create\
    \ a new article, the public list of articles must be regenerated\n  def after_create(article)\n\
    \    expire_public_page\n  end\n```"
