  md: "of a tag is the kind of thing that gives templating languages a bad name. Let's\
    \ not let that kind of ugliness litter our code. Instead, let's create an abstraction\
    \ that hides it—we'll write a helper method.\n\n# Helper Methods\n\nWhenever we\
    \ want to abstract some processing out of a view (any kind of view), we should\
    \ write a helper method.\n\nIf you look in the app directory, you'll find five\
    \ subdirectories:\n\n```\ndepot> $ ls -p app\ncontrollers/ mailers/ models/ views/\n\
    ```\n\nNot surprisingly, our helper methods go in the helpers directory. If you\
    \ look in that directory, you'll already contains some files:\n\n```\ndepot> $\
    \ ls -p helpers\napplication_helper.rb line_items_helper.rb store_helper.rb\n\
    carts_helper.rb products_helper.rb\n```\n\nThe Rails automatically created a helper\
    \ file for each of our controllers (products and store). The Rails command itself\
    \ (the one that created the application initially) created the file application_helper.rb.\
    \ If you like, you can organize your methods into controller-specific helpers,\
    \ but because this method will be used in the application layer, let's put it\
    \ in the application helper.\n\nLet's write a helper method called hidden_div_if.\
    \ It takes a condition, an optional set of attributes, and a block. It wraps the\
    \ output generated by the block in a `<div>` tag, adding the display: none style\
    \ if the condition is true. Use it in the store layout like this:\n\n```\nDownload\
    \ depot n/app/views/layouts/application.html.erb\n<%= hidden_div_if(@cart.line_items.empty?,\
    \ :id => \"cart\") do %>\n  <%= render @cart %>\n<% end %>\n```\n\nWe'll outline\
    \ our helper so that it is visible to the store controller by adding it to application_helper.rb\
    \ in the app/helpers directory:\n\n```\nDownload depot n/app/helpers/application_helper.rb\n\
    module ApplicationHelper\ndef hidden_div_if(condition, attributes = {}, &block)\n\
    \  if condition\n    attributes[\"style\"] = \"display: none\"\n  end\n  Content_tag(\"\
    div\", attributes, &block)\nend\nend\n```"
