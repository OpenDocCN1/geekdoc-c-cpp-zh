  md: "like returned. As you have seen, Rails accomplishes this by including a field\
    \ called :format in your route definitions:\n\n```\nGET /products..format\n  {:action=>\"\
    index\", :controller=>\"products\"}\n```\n\nBecause a full stop (period) is a\
    \ separator character in route definitions, format is treated as just another\
    \ field. Because it has a nil default value, it's an optional field.\n\nHaving\
    \ done this, we can use a respond_to block in our controllers to select our response\
    \ type depending on the requested format:\n\n```\ndef show\n  respond_to do |format|\n\
    \    format.html\n    format.xml { render :xml => @product_to_xml }\n    format.yaml\
    \ { render :text => @product_to_yaml }\n  end\n\n```\n\nGiven a request to /store/show/1\
    \ or /store/show/1.html will return HTML content, while /store/show/1.xml will\
    \ return YAML. You can also pass the format as an HTTP request parameter:\nGET\
    \ HTTP://pragprog.com/store/show/123?format=xml\n\nThe routes defined by resources\
    \ have this facility enabled by default.\n\nAlthough the idea of having a single\
