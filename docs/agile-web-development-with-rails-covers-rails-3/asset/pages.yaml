  md: 'The most efficient request is the request that is never made. Many pages (par-icularly
    images, scripts, and stylesheets) change rarely yet may be refer-enced fairly
    frequently. One way to ensure that re-retrievals are optimized before they get
    to your server is to provide an Expires header.


    Although an Expires header may provide a number of different options, the most
    common usage is to indicate how long the given response is to be considered "good
    for," suggesting that the client need not re-request this data in the interim.
    Calling the expires_in method in your controller achieves this result:


    ```

    expires_in 20.minutes

    expires_in 1.year

    ```


    A server should not provide a date more than one year in the future on Expires
    headers.


    An alternate use for the Expires header is to indicate that the response is not
    to be cached at all. This can be accomplished with the expires_now method, which
    understandably takes no parameters.


    You can find additional information on more expiration options in the HTTP specification.


    Be aware that if you are using page-level caching, requests that are cached at
    the server won''t get to your application, this mechanism needs to be implemented
    at the server level to be effective. Here''s an example for the Apache web:


    # LastModified and ETag Support


    The next thing to eliminating requests entirely is to respond immediately with
    an HTTP 304 Not Modified. This will instruct user agents and intermediaries to
    use the version of the page that they already have in their cache. At a minimum,
    such responses will save on bandwidth. This often will enable you to eliminate
    the server load associated with producing a more complete response.


    If you are already doing page-level caching with Apache, the web server will generally
    take care of this for you, based on the timestamp associated with the on-disk
    cache.


    +   1. http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec1.4.9'
