  md: '# Time-Based Expiry of Cached Pages


    Consider a site that shows fairly volatile information such as stock quotes or
    news headlines. If we did the style of caching where we expired a page when the
    underlying information changed, we''d be expiring pages constantly. The cache
    would rarely get used, and we''d lose the benefit of having it.


    In these circumstances, you might want to consider switching to time-based caching,
    where you build the page caches exactly as we did previously but don''t expire
    them when their content becomes obsolete.


    You run a separate background process that periodically goes into the cache directory
    and deletes the cache files. You choose how this deletion occurs—you could simply
    remove all files, the files created more so many minutes ago, or the files whose
    match some pattern. That is application-specific.


    The next time a request comes for one of these pages, it won''t be satisfied from
    the cache, and the application will handle it. In the process, it''ll automatically
    repopulate that particular page in the cache, lightening the load for subsequent
    fetches of it.


    Where do you find the cache files to delete? Not surprisingly, this is configured.
    Page caches are by default stored in the public directory of your application.
    They''ll be named after the URL they are caching, with an .html extension. For
    example, the page cache for content/show/1 will be:


    ```

    app/public/content/show/1

    ```


    This naming is no coincidence; it allows the web server to find the cache files
    automatically. You can, however, override the defaults using:


    ```

    config.action_controller.page_cache_directory = "dir/name"

    config.action_controller.page_cache_extension = ".html"

    ```


    Action cache files are not by default stored in the regular filesystem directory
    structure cannot be expired using this technique.


    # Playing Nice with Client Caches


    When we said earlier that creating cache pages is only one half of the equation,
    we failed to mention that there are three halves. Oops.


    Clients (generally, but not always, browsers) often have caches too. Intermediaries
    between your server and the client may also provide caching services. You can
    help optimize these caches (and reduce load on your server) by providing HTTP
    headers. Doing so is entirely optional and won''t always result in a bandwidth
    reduction, but on the other hand, the savings can be quite significant.'
