    # Partial-Page Templates


    Web applications commonly display information about the application object or
    objects on multiple pages. A shopping cart might display order line item on the
    shopping cart page and again on the order summary page. A blog application might
    display the contents of an article main page and again at the top of a page soliciting
    comments. Typically this would involve copying snippets of code between the different
    pages.


    Rails, however, eliminates this duplication with the partial-page templates (frequently
    called partials). You can think of a partial as a kind of subroutine. You invoke
    it one or more times from another template, potentially passing it to objects
    as parameters. When the partial template finishes rendering, it returns to the
    calling template.


    Internally, a partial template looks like any other template. Externally, there''s
    a slight difference. The name of the file containing the template code must start
    with an underscore character, differentiating the source of partial templates
    from their more complete brothers and sisters.


    For example, the partial to render a blog entry might be stored in the _article.html.erb
    in the normal views directory, app/views/blog:


    ```

    <div class="article">

    <div class="articleheader">

    <h3><%= article.title %></h3>

    </div>

    <div class="articlebody">

    <%= article.body %%

    </div>

    </div>

    ```


    Other templates use the render(:partial => ...) method to invoke this:


    ```

    <%= render(:partial => "article", :object => @an_article) %>

    <h3>Add Comment</h3>

    ```


    ..


    The :partial parameter is the name of the template to render (without the leading
    underscore). This name must be a valid Ruby identifier (a-z and 0-9 are not valid
    names for partial). The :object identifies an object to be passed into the partial.
    This object will be available within the template via a local variable with the
    same name as the template. In this example, the @an_article object will be passed
    to the template, and the template can access it using the local variable. That''s
    why we could write things such as article.title in the partial.'
