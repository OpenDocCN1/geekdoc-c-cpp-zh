  md: '# David Says...

    To Raise, or Not to Raise?


    When you use driven by primary keys, you''re looking for a particular record.
    You expect it to exist. A call to Person.find(5) is based on our knowledge of
    the people table. We want the row with an id of 5. If this call is unsuccessful—the
    record with the id of 5 has been destroyed—we''re in an exceptional situation.
    This mandates the raising of an exception, Rails raises RecordNotFound.


    On the other hand, finders use criteria to search are looking for a match. So,
    Person.where(name=''Dave'').first is the equivalent of telling the database (as
    a black box) "Give me the first person row that has the name Dave." a distinctly
    different approach to retrieval; we''re not certain up front we''ll get a result.
    It''s entirely possible the result set be empty, returning nil in the case of
    finders that search for one row and an empty array for find search for many rows
    is the natural, exceptional response.


    # Reading Existing Rows


    Reading from a database involves first specifying which particular rows of data
    are interested in—you''ll give Active Record some kind of criteria, and it will
    return objects containing data from the row(s) matching the criteria.


    The simplest way of finding a row in a table is by specifying its primary key.
    Every model class supports the find method, which takes one or more primary key
    values. If given just one primary key, it returns an object containing data for
    the corresponding row (or throws a RecordNotFound exception). If multiple primary
    key values, it returns an array of the corresponding objects. Note that in this
    case a RecordNotFound exception is raised if any of the ids cannot be found (if
    the method returns without raising an exception, the length of the resulting array
    will be equal to the number of ids passed as parameters)


    ```

    an_order = Order.find(27) # find the order with id = 27

    ```


    ```

    # Get a list of ids from order, then

    # sum the total price

    product_list = params[:product_ids]

    total = Product.find(product_list).sum(:price)

    ```


    Often, you need to read rows based on criteria other than their primary key value.
    Active Record provides a range of options for performing these queries. We''ll
    start looking at an alternate way to express simple where clauses and then look
    at additional ways to modify the query Rails generates.'
