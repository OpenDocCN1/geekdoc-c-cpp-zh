    # Additional Active Support Classes


    In addition to extending the base objects provided by Ruby, Active Support provides
    plenty of additional functionality. More than with the core extensions, these
    classes tend to support specific needs of other Rails components, but you are
    welcome to make use of these functions directly.


    +   * BasicObject: A backport of Ruby 1.9''s class of the same name to Ruby 1.8.

    * Benchmark: Measures the execution time of a block in a template and records
    the results to the log.

    * Cache::Store: Various implementations of caches, based on files or memory; with
    synchronized or compressed options.

    * Callbacks: Provides hooks into the life cycle of an object.

    * Concern and Dependencies: Helps manage dependencies in a modular way.

    * Configurable: Provides a config Hash class.

    * Deprecation: Provides behavior, reporting, and wrapping to support deprecation
    of methods.

    * Duration: Additional methods such as ago and since.

    * Gzip: Convenience methods to compress and decompress a String.

    * HashWithIndifferentAccess: Allows both params[''key''] and params[''key''].

    * 11n: Internationalization support.

    * Inflections: Handles English''s inconsistent rules for pluralization.

    * JSON: JavaScript Object Notation encoding and decoding methods.

    * LazyLoadHooks: Support for deferred initialization of modules.

    * Memoizable: Caches the result of a method call.

    * MessageEncryptor: Encrypts values that are to be stored somewhere untrusted.

    * MessageVerifier: Generates and verifies signed messages (prevents tampering).

    * MultiByte: Encoding support (primarily for Ruby 1.8.7).

    * Notifications: Instrumentation API.

    * OptionMerge: Deep merge lambda expressions.

    * OrderedHash and OrderedOptions: Provides ordered hash support (primarily for
    Ruby 1.8.7).'
