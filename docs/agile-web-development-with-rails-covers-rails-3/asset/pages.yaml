    # Picking a Caching Strategy\n\nCaching, like sessions, features a number of storage\
    \ options. You can keep the fragments in file, in a database, or in memcached\
    \ servers. But whereas sessions usually contain small amounts of data and require\
    \ only one row per user, fragment caching can easily create sizeable amounts of\
    \ data, and you can have many per user. This makes database storage a poor fit.\n\
    \nFor many setups, it is easiest to cache each file on the filesystem. But you\
    \ can't keep these files locally on each server, expiring a cache on one server\
    \ would not expire on the rest. You therefore need to set up a network drive that\
    \ all the servers can share for their caching.\n\nWith session configuration,\
    \ you can configure a file-based caching strategy globally in environment.rb or\
    \ in a specific environment's:\nActionController::Base.cache_store = :file_store,\
