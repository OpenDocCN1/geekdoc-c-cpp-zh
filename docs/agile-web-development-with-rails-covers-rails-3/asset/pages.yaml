    # # Chapter 23


    # # Migrations


    Rails encourages an agile, iterative style of development. We don''t expect to
    get everything the first time. Instead, we write tests and interact with our customers
    to refine our understanding as we go.


    For that to work, we need a supporting set of practices. We write tests to help
    us design our interfaces and act as a safety net when we change things, and we
    use version control to store our application''s source files, allowing us to undo
    mistakes and monitor what changes day to day.


    But there''s another area of the application that changes, an area that we can''t
    directly manage using version control. The database schema in a Rails application
    constantly evolves as we progress through the development: we add a table, rename
    a column there, and so on. The database changes in step with the application''s
    code.


    With Rails, each of these is made possible through the use of a migration. You
    saw this in use throughout the development of the Depot application, starting
    when we created the first products in Section 6.1. Generating the Scaffold, on
    and when we performed tasks such as adding a quantity to the line_items in Section
    10.1, Iteration E1: Creating a Smarter Cart, on page 126. Now it is time to dig
    deeper into how migrations work and what else you can do with them.


    # ## 23.1 Creating and Running Migrations


    A migration is a Ruby source file in your application''s db/migrate directory.
    Each migration file''s name starts with a number of digits (typically fourteen)
    and an underscore. Those digits are key to migrations, because they define the
    sequence in which the migrations are applied—they are the individual migration''s
    version number.'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'The version number itself is the Coordinated Universal Time (UTC) timestamp
    at the migration was created. These numbers count the four-digit year, followed
    by two digits each for the month, day, hour, minute, and second, based on the
    mean solar time at the Royal Observatory in Greenwich. Because migrations tend
    to be created infrequently and the accuracy is recorded down to the second, the
    chances of any two people getting the same timestamp is vanishingly small. And
    the benefit of having deterministically ordered far outweighs the miniscule risk
    of this occurring.


    Here''s what db/migrate directory of your Depot application looks like:


    ```

    depot> ls db/migrate

    20110211000001_create_products.rb

    20110211000002_create_carts.rb

    20110211000003_create_line_items.rb

    20110211000004_add_quantity_to_line_items.rb

    20110211000005_combine_items_in_cart.rb

    20110211000006_create_orders.rb

    20110211000007_order_id_to_line_item.rb

    20110211000008_create_users.rb

    ```


    Although you could create these migration files by hand, it''s easier (and less
    error prone) to use a generator. As we saw when creating the Depot application,
    there are actually two generators that create migration files:


    +   * The model generator creates a migration to create in the table associated
    with the model (unless you specify the --skip-migration option). The example that
    follows shows, creating a model also creates a migration called ygyuyJMMddhmmmms_create_discounts.rb:


    ```

    depot> rails generate model discount

    exists app/models/

    exists test/unit/

    exists test/fixtures/

    ncreate app/models/discount.rb

    create test/unit/discount_test.rb

    create test/fixtures/discounts.yml

    exists db/migrate

    create db/migrate/20110211000010_create_discounts.rb

    ```


    +   * You can also generate a migration on your own:


    ```

    depot> rails generate migration add_price_column

    exists db/migrate

    create db/migrate/20110211000011_add_price_column.rb

    ```


    Later, in Anatomy of a Migration, we''ll see what goes on in the migration files.
    But for now, let''s jump a little in the workflow and how to run migrations.'
  merge: -1
