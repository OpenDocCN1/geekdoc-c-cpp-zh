    # Chapter 13


    # Task H: Sending Mail


    At this point, we have a website that will respond to requests and provide feeds
    that allow sales of individual titles to be checked on periodically. At times
    it makes sense to have something more than that. For those times, what we need
    is the ability to actively target a message to somebody specific when an event
    occurs. It could be wanting to notify a system administrator when an exception
    occurs. It could be a user feedback form. In this chapter, we will opt to simply
    send confirmation emails to people who have placed orders. Once we complete that,
    we will create tests not only for the mail support that we just added for the
    entire user scenario we created so.


    # 13.1 Iteration H1: Sending Confirmation Emails


    Thereare three basic parts to sending email in Rails: configuring how email is
    to be sent, determining when to send the email, and specifying what you want to
    say. We will cover each of these three in turn.


    # Email Configuration


    Email configuration is part of Rails application''s environment and involves Depot::Applicationconfigure
    block. If you want to use the same configuration for development, testing, and
    production, add the configuration to environment.rb in the config directory; otherwise,
    add different configurations to the appropriate files in the config/environments
    directory.


    Inside the block, you will need to have one or more statements. You first have
    to decide how you will send your mail delivered:


    ```

    config.action_mailer.delivery_method = :smtp | :sendmail | :test

    ```


    The :smtp and :sendmail options are used when you want Action Mailer to attempt
    to deliver email. You''ll clearly want to use one of these methods in production.'
