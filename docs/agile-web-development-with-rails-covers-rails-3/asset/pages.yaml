  md: '# Page Flow


    We all like to have an idea of the main pages in our applications and to understand
    roughly how users navigate between them. This early in the development, these
    page flows are likely to be incomplete, but they still help us focus on what needs
    doing and know how actions are sequenced.


    Some folks like to mock up web application page flows using Photoshop, Word, or
    (shudder) HTML. We like using a pencil and paper. It''s quicker, and the customer
    gets to play too, grabbing the pencil and scribbling alterations on the paper.


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_72_0.png)


    Figure 5.1: Flow of buyer pages


    The first sketch of the buyer flow is shown in Figure 5.1. It''s pretty traditional.
    The buyer sees a catalog page, from which he selects one product at a time. Each
    product selected gets added to the cart, and the cart is continue shopping using
    the catalog pages or check out and use the contents of the cart. During checkout,
    we capture contact and payment details and then display a receipt page. We don''t
    know how we''re going to handle payment, so those details are fairly vague in
    the flow.'
