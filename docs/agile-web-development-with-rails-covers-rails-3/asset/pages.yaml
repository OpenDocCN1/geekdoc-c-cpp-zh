  md: 'Although HTML looks superficially a lot like XML, it is enough of a different
    beast that different templating engine is generally used to produce HTML. We cover
    that next.


    # 25.2 Generating HTML with ERb


    At its simplest, an ERb template is just a regular HTML file. If a template contains
    no dynamic content, it is simply as to the user''s browser. The following is a
    perfectly valid `html.erb` template:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    How are you, today?

    </p>

    ```


    However, applications that just render static templates tend to be a bit boring
    to use. We can spice them up using dynamic content:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    It''s <%= Time.now %>

    </p>

    ```


    If you''re a JSP programmer, you''ll recognize this as an inline expression. Erb
    evaluates every code inside <%= %>`, converts the results into a string using
    to_s, and finally substitutes that string into the resulting page. The expression
    inside the tags can be arbitrary code:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    It''s <%= require ''date''

    DAY_NAMES = %w{ Sunday Tuesday Wednesday

    Thursday Friday Saturday }

    today = Date.today

    DAY_NAMES[today.wday]

    %>

    </p>

    ```


    Putting lines of business logic into a template is generally considered to be
    a Very Bad Thing, and you''ll risk incurring the wrath of the coding police should
    you get caught. We discussed a much better way of handling this with helpers on
    page 349.


    Sometimes you need code in a template that doesn''t directly generate any output.
    If you leave the equals off the opening tag, the contents are executed, but nothing
    is inserted into the template. We could have written the previous example as:


    ```

    <%= require ''date''

    DAY_NAMES = %w{ Sunday Tuesday Wednesday

    Thursday Friday Saturday }

    today = Date.today

    %>

    ```'
  merge: -1
