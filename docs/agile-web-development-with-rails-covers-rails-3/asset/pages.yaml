  md: 'One final point before we move on: both validation and functional tests will
    test the behavior of controllers only: they will not retroactively affect any
    objects that already exist in the database or fixtures. In the example, two products
    contain the same title. Such data will cause no problems and will go undetected
    up to the point where records are modified and saved.


    We''ve touched on only a few things that `assert_select` can do. More information
    can be found in the online documentation.


    That''s a lot of verification in just a few lines of code. We can see that it
    works by rerunning the functional tests (after all, that''s all we changed):


    ```

    depot> rake test:functionals

    ```


    Now we might have something recognizable as a storefront, we have tests that ensure
    that all of the pieces—the model, view, and controller—are all working together
    to produce the desired result. Although this sounds like a lot, Rails made it
    easy. In fact, it was mostly HTML and CSS and not much in way of code or tests.


