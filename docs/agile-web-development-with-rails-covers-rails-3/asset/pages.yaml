    The flow through the sweeper is somewhat convoluted:


    +   * You first declare the sweeper as an observer on one or more Active Record
    classes. In our example case, it observes the Aricle model. (We first talked about
    observers back on page 301.) The sweeper uses hook methods (such as after_update_update)
    to expire cached pages if appropriate.

