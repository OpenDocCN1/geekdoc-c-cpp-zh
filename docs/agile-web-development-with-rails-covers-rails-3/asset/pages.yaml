  md: 'and do it without a bunch of coding or configuration hassle. As you''ll see,

    Ruby on Rails shines when it comes to dealing with change—it''s an ideal agile

    programming environment.


    Along the way, we will be building and maintaining a corpus of tests. These

    tests ensure that the application is always doing what we intend to do. Not

    only Rails enable the creation of such tests, but it actually provides you

    with an initial set of tests each time you define a new controller.


    On with the application.


    # 5.2 What Depot Doses


    Let''s start by jotting down an outline specification for the Depot application.

    We''ll look at the high-level use cases and sketch the flow through the web

    pages. We''ll also try working out what the depot application needs (acknowledg-

    ing that our initial guesses will likely be wrong.


    # Use Cases


    A case is a statement about how some entity uses a system. Con-

    sultants invent this kind of phrases to label things we''ve all known

    along—it''s a perversion of business life that fancy words always cost more

    plain ones, even though the plain ones are more valuable.


    Depot''s use cases are simple (some would say tragically). We start off by

    identifying two different roles or actors: the buyer and the seller.


    The buyer uses Depot to browse the products we have to sell, select some to

    purchase, and supply the information needed to create an order.


    The seller uses Depot to maintain a list of products to sell, to determine the\orders
    that are awaiting shipping, and to mark orders as shipped. (The seller

    al also uses Depot to make scads of money and retire to a tropical island, but

    hat''s the subject of another book.)


    For now, that''s the detail we need. We could go into excavating detail\about
    what it means to maintain products and what constitutes an order

    ready to ship, but why bother? If there are details that aren''t obvious, we''ll

    discover them soon enough as we reveal successive iterations of our work to

    the customer.


    Talking of getting feedback, let''s not forget to get some right now—let''s make

    sure our initial (admittedly sketchy) use cases are on the mark by asking our

    . Assuming the use cases pass muster, let''s work out how the application

    will work from the perspectives of its various users.'
