  md: '# David Says...

    Why Extending Base Classes Doesn''t Lead to the Apocalypse


    The awe that seeing 5months + 30minutes for the first time is usually replaced
    by a state of panic shortly thereafter. If everyone can just change how integers
    work, won''t that lead to an utterly unmaintainable spaghetti of hell? Yes, if
    everyone did that all the time, it would. But they don''t, so it doesn''t.


    Don''t think about Active Support as a collection of random extensions and their
    brother to add their own pet feature to the string class. Think of it as a dialect
    of Ruby spoken universally by all Rails programmers. Because Active Support is
    a required part of Rails, you can always rely on that 5months will work in any
    Rails application. That negates the problem of having a thousand personal dialects
    of Ruby.


    Active Support gives us the best of both worlds when it comes to language extensions.
    It''s contextual standardization.


    +   * String: exclude?, pluralize, singularize, camelize, titleize, underscore,
    dashizer, demodulize, parametrize, tableize, classify, humanize, foreign_key,
    constantize, squish, mb_chars, at?, from, to, first, last, to_time, to_date, and
    try.

    * Time: yesterday, future?, advance, and many, many more.


    As you can see, this is a long list. These methods tend to be fairly small; many
    are only a single line of code. Although you will probably only ever use a small
    percentage of these, all of them are available for use in your Rails application.


    As you can also see, there is a lot. Most of it you won''t ever directly use.
    You''ll quickly find yourself adopting a small portion of additional methods as
    if they were part of the Ruby language itself. Although all of these are documented
    online, the best way to learn is often to experiment directly by using rails console.
    Here are a few things to:


    +   * 2.years.ago

    * [1,2,3,4].sum

    * 5.gigabytes

    * "man".pluralize

    * String.methods.sort


    +   1. http://as.rubyonrails.org/'
