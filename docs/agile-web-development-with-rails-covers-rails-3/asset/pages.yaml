- img_proc: true
  md: "# ITERATION E1: CREATING A SMARTER CART\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_128_0.png)\n\
    \nFigure 10.1: A cart with quantities\n\n+   - We iterate over these sums, extracting\
    \ the product_id and quantity from each.\n- In cases where the quantity is greater\
    \ than 1, we will delete all of the line items associated with this cart and replace\
    \ them with a single line item with the correct quantity.\n\nNote how easily and\
    \ elegantly Rails enables you to express this algorithm.\nWith this code in place,\
    \ we apply this migration just like any other migration:\n`rake db:migrate`\n\n\
    We can immediately see the results by looking at the cart, as shown in Figure\
    \ 10.1. Although we have reason to be pleased with ourselves, we are not done\
    \ yet. An important principle of migrations is that each step needs to be reversible,\
    \ so we implement `self.down` too. This method finds line items with a quantity\
    \ greater than 1; adds new line items for this cart and product, each with a quantity\
    \ of 1; and finally deletes the line item. The following completes that:\n\n```\n\
    def self.down\n  # split items where quantity>1 into multiple items\n  LineItem.where(\"\
    quantity>1\").each do |line_item|\n    # add individual items\n    line_item.quantity.times\
    \ do\n      LineItem.create :cart_id=>line_item.cart_id, :product_id=>line_item.product_id,\
    \ :quantity=>1\n```"
  merge: -1
