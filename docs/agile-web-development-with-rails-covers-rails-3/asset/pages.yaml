  md: 'Sometimes we need to be specific about what file to include. We can do that
    by giving require a full filesystem path. The problem is, we don''t know what
    that path will be—our users could install our code anywhere.


    Wherever our application ends up getting installed, the relative path between
    the file doing the requiring and the target file will be the same. Knowing this,
    we can construct the absolute path to the target by taking the absolute path to
    the file doing the requiring (available in the special variable _FILE_), stripping
    out all but the directory name, and then appending the relative path to the target
    file.


