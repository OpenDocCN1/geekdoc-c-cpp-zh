    \    :confirm => \"Are you sure?\",\n        :method => :delete }\n>\n```\n\n\
    The :button_method works the same as :link_to which generates a button in a self-contained\
    \ form, rather than a straight hyperlink. This is the preferred method of linking\
    \ to actions that have side effects. However, these buttons live in their own\
