    \ might have different-looking pages if the site is down for maintenance. Rails\
    \ supports this with dynamic layouts. If the parameter to the layout declaration\
    \ is symbol, it's taken to be the name of a controller instance method that returns\
    \ the name of the layout to be used:\n\n```\nclass StoreController < ApplicationController\n\
    n  layout :determine_layout\n\n  #...\n```\n\n```\nprivate def determine_layout\n\
    \  if Store.is_closed?\n    \"store_down\"\n  else\n    \"standard\"\n  end\n\
    ```\n\nSubclasses of a controller will use the parent's layout unless they override\
    \ it using the layout directive. Finally, individual actions can choose to render\
    \ a specific layout (or with no layout at all) by passing the :layout option:\n\
    \n```\ndef rss\n  render(:layout => false) # may not use a layout\n```\n\n```\n\
    def checkout\n  render(:layout => \"layouts/simple\")\n```\n\n# Passing Data to\
    \ Layouts\n\nLayouts have access to all the same data that's available to conventional\
    \ templates. In addition, any instance variables set in the normal template will\
    \ be available in the layout (because the regular template is rendered before\
    \ the layout is invoked). This might be used to parameterize headings or menus\
    \ in the layout. For example, the layout might contain this:\n\n```\n<html>\n\
