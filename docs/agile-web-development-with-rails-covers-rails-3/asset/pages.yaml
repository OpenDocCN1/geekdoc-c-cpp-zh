  md: "Rails provides a convenient and intuitive way of declaring the routes for this\n\
    type of situation:\n\n```\n:products do\n  resources :reviews\nend\n```\n\nThis\
    \ defines the top-level set of products routes and additionally creates a\nset\
    \ of subroutes for reviews. Because the review resources appear inside the\nproducts\
    \ block, a review resource must be qualified by a product resource.\nThis means\
    \ that the path to a review must always be prefixed by the path to a particular\
    \ product. To fetch the review with id 4 for the product with id 99, use'd use\
    \ a path of /products/99/reviews/4.\n\nThe named route for /products/product_id/reviews/id\
    \ is product_review, not sim-\\pleview. This naming simply reflects the nesting\
    \ of these resources.\n\nAs always, you can see the full set of routes generated\
    \ by our configuration\nusing the rake routes command.\n\n# Shallow Route Nesting\n\
    \nAt times, nested resources can produce cumbersome URLs. A solution to this\n\
    is to use shallow route nesting:\n\n```\n:products, :shallow => true do\n  resources\
    \ :reviews\nend\n```\n\nThis will enable the recognition of the following routes:\n\
    \n```\n/products/1 => product_path(1)\n/products/1/reviews => product_reviews_index_path(1)\n\
    /reviews/2 => reviews_path(2)\n```\n\nTry the rake routes command to see the full\
    \ mapping.\n\n# Selecting a Data Representation\n\nOne of the goals of a REST\
    \ architecture is to decouple data from its repres-\ntation. If a human uses the\
    \ URL path /products to fetch some products, they\n see nicely formatted HTML.\
    \ If an application asks for the same URL,\nit could elect to receive the results\
    \ in a code-friendly format (YAML, JSON, or\nXML, perhaps.\n\nWe're already seen\
    \ how Rails can use the HTTP Accept header in a response_to\nblock in the controller.\
    \ However, it isn't always easy (and sometimes it's plain\nimimpossible) to set\
    \ the Accept header. Deal with this, Rails allows you to\npass the format of response\
    \ you'd like as the URL. To do this, a set\n:format parameter in your routes to\
    \ the file extension of the MIME type you"
