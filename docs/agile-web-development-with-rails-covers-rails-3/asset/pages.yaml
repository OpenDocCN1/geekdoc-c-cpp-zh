    Forms and uploads are just two examples of helpers that Rails provides. Next we
    we will show you how you can provide your own helpers and introduce you to a number
    of other helpers that code with Rails.


    # 21.5 Using Helpers


    Earlier we said that it''s OK to put code in templates. Now we''re going to modify
    that statement. It''s perfectly acceptable to put some code in templates—that
    what makes them dynamic. However, it''s poor style to put too much code in templates.


    There are three main reasons for this. First, the more code you put in the view
    side of your application, the easier it is to let discipline slip and start adding
    application-level functionality to the template code. This is definitely poor
    form; you want to put application stuff in the controller and model layers so
    that it is available everywhere. This will pay off when you add new ways of viewing
    the application.


    The second reason is that htmlerb is basically HTML. When you edit it, you''re
    editing an HTML file. If you have the luxury of having professional designers
    create your layouts, they''ll want to work with HTML. Putting a bunch of Ruby
    code in just makes it hard to work with.


    The final reason is that code embedded in views is hard to test, whereas code
    split into helper modules can be isolated and tested as individual units.


    Rails provides a nice compromise in the form of helpers. A helper is a module
    containing methods that assist a view. Helper methods are output-centric. They
    exist to generate HTML (or XML, or JavaScript)—a helper extends the behavior of
    a template.


    # Your Own Helpers


    By default, each controller gets its own helper module. Additionally, there is
    an application-wide helper named application_helper.rb. It won''t be surprising
    to learn that Rails makes certain assumptions about help link the helpers into
    the controller and views. All view helpers are available to all controllers, or


