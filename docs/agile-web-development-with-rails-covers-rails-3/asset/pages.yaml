  md: "This is one of those times where the legal notice at the start of this book\
    \ kicks\nin. We're not liable if this deletes your data.\n\n# ## 23.6 Schema Manipulation\
    \ Outside Migrations\n\nFor example, you might have discovered that a particular\
    \ long-running report\runs a lot faster if the orders table has an index on the\
    \ column. However,\nthat index isn't needed during the day-to-day running of the\
    \ application, and\ntests have shown that maintaining it scales the application\
    \ appreciably.\n\nLet's write a method that creates the index, runs a block of\
    \ code, and then\ndrops the index. This could be a private method in the model\
    \ or could be\nimplemented in a library.\n\n```\ndef run_with_index(column)\n\
    \    connection.add_index(:orders, column)\nbegin\n    yield\n    connection.remove_index(:orders,\
    \ column)\nend\nend\n```\n\nThe statistics-gathering method in the model can use\
    \ this as follows:\n\n```\ndef get_city_statistics\n    run_with_index(:city)\
    \ do\n        # .. calculate stats\n    end\nend\n```\n\n# ## What We Just Did\n\
    \nWhile we had been informally using migrations throughout the development of\n\
    the Depot application and even into deployment, in this chapter we saw how\nmrations\
    \ are the bases for a principled and disciplined approach to config-\nration management\
    \ of the schema for your database.\n\nYou learned how to create, rename, and delete\
    \ columns and tables; to manage\nindices and keys; to play and back out entire\
    \ sets of changes; and even to\nmix your own SQL into the mix, all in a completely\
    \ reproducible\nmanner.\n\nAt this point we've covered the externals of Rails.\
    \ The next few chapters are\ngo to delve deeper. We are going to show you how\
    \ to take Rails apart and\nit put back together. The first step along the way\
    \ is to show you how to use\nSelect classes and methods outside the context of\
    \ a web server."
