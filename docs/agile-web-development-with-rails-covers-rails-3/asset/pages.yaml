  md: 'This means that dynamic pages that depend on information not in the URL are
    poor candidates for caching. These include the following:


    +   - Pages where the content is time based (although Section 22.2, Time-Based
    Exppiry of Caches, on page 371).

    - Pages whose content depends on session information. For example, if you customize
    pages for each of your users, you''re unlikely to be able to cache them (although
    you might be able to take advantage of fragment caching, described starting on
    page 373).

    - Pages generated from data that you don''t control. For example, a page displaying
    information from your database might not be cacheable if non-Rails applications
    update that database too. Our cached page would become out-of-date without our
    application knowledge.


    However, caching can cope with pages generated from volatile content that''s under
    your control. As we will see in the next section, it''s simply a question of removing
    the cached pages when they become outdated.


    # 22.2 Expiring Pages


    Creating pages is only one half of the equation. If the content initially used
    to create these pages pages, the cached versions will become out-of-date, and
    we''ll need a way of expiring them.


    The trick is to code the application to notice when the data used to create a
    dynamic page has changed and then remove the cached version. The next time a request
    comes from that URL, the cached page will be regenerated based on the new content.


    # Expiring Pages Explicitly


    The low-level way to remove cached pages is with the methods expire_page and expire_action.
    These take the same parameters as url_for and expire the cached page that matches
    the generated URL.


    For example, our content controller might have an action that allows us to create
    an article and another action that updates an existing article. When we create
    an article, the list of articles on the public page will become obsolete, we call
    expire_page, passing in the action name that displays the public page. When we
    update an existing article, the public index remains unchanged (at least, it does
    in our application), but any cached should be deleted. This cache was created
    using caches_action, we need to expire the page using expire_action, passing in
    the action name and the article id.'
