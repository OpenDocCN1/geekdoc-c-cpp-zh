  md: '# ITERATION K3: CHECKING UP ON A DEPLOYED APPLICATION


    Once we have a console session open, we can poke and prod all the various methods
    on our models. We can create, inspect and delete records. In a way, it''s like
    having a root console to your application.


    Once you put an application into production, we need to take care of a few chores
    to keep your application running smoothly. These chores aren''t auto-matically
    taken care of us, but luckily, we can automate them.


    # Dealing with Log Files


    As an application runs, it will constantly add data to its log file. Eventually,
    the log files can grow extremely large. To overcome this, most logging solutions
    roll over log progressive set of log files of increasing age. This will break
    up our log files into manageable chunks or even deleted after a certain amount
    of time has passed.


    The Logger supports rollover. We need to specify how many (or how often) log files
    we want and the size of each, using a line like one of the following in the file
    config/environments/production.rb:


    ```

    config.logger = Logger.new(config.paths.log.first, ''daily'')

    ```


    Or perhaps this:


    ```

    require ''active_support/core_ext/numeric/bytes''

    config.logger = Logger.new(config.paths.log.first, 10, 10.megabytes)

    ```


    Note that in this case an explicit require of active_support is needed because
    this statement is processed early in the initialization of your application—before
    the Active Support libraries have been included. In fact, one of the configuration
    options that Rails provides is not to include Active Support libraries at all:


    ```

    config.active_support.bare = true

    ```


    Alternately, we can direct our logs to the system logger for our machine:


    ```

    config.logger = Sysloglogger.new

    ```


    Find more options at http://rubyonrails.org/deploy.


    # Moving On to Launch and Beyond


    Once we set up our initial deployment, launch it into production. We''ll likely
    set up additional deployment servers, and the lessons we learn from first deployment
    tell us a bit about how we should structure later deployments. For example, we''ll
    likely find that Rails is one of the slower components of our system—most of the
    request time will be spent in Rails than waiting on the database or filesystem.
    This indicates that we to scale up is to add machines to split the Rails load
    across.'
  merge: -1
