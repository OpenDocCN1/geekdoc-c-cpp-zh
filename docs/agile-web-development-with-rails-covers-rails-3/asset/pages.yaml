  md: '# Getting Agile


    # Agile in a Flash


    The best agile book isn''t a book: Agile in a Flash is a unique deck of index
    cards that fit neatly in your pocket. You can tape them to the wall. Spread them
    out over your project table. Get stains on them over lunch. These cards are meant
    to be used, not just read.


