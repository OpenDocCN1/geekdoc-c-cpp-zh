  md: '# General Recovery Advice


    Everything in this book has been tested. If you follow along with this scenario
    precisely, using the recommended version of Rails and SQLite3 on Linux, Mac OS
    X, or Windows, then everything should work as described. deviations from this
    path may occur. Typos happen to be the best of us, and not only are side explorations
    possible, but they are positively encouraged. Be aware that this light might lead
    you to strange places. Don''t be afraid: specific recoveries for common problems
    appear in the specific sections where problems often occur. A few general suggestions
    are included here.


    You should only ever need to restart the server in the few places where so is
    noted in the book. But if you get truly stumped, restarting the server might be
    worth trying.


    A "magic" command worth knowing, explained in detail in Part III, rake db:migrate:redo.
    It will undo and reapply the last migration.


    If your server won''t accept some input on a form, refresh the form on your browser,
    and resubmit it.


    Again, at this point we''ll double-check with the customer that we''re still on
    the right track. (The customer was most likely sitting in the room with us while
    we drew these three diagrams.)


    # 5.3 Let''s Code


    So, after sitting down with the customer and doing some preliminary analysis,
    we''ll be ready to start using a computer for development! We''ll be working from
    our original three diagrams, but the chances are pretty good that we''ll be throwing
    away fairly quickly as we gather feedback. Interestingly, that''s why we didn''t
    spend too long on them; it''s easier to throw something away if you didn''t spend
    a long time creating it.


    In the chapters that follow, we''ll start developing the application based on
    our current understanding. However, before we turn that page, we have to answer
    just one more question: what should we do first?


    We like to work with the customer so we can jointly agree on priorities. In this
    case, we''d point out to them that it''s hard to develop anything else until we
    have some basic products defined in the system, we suggest spending a couple of
    hours getting the initial version of the product maintenance functionality up
    and running. And, of course, the client would agree.'
