    Real shopping carts, she explains, don''t show separate lines for two of the same
    product. Instead, they show the product line once with a quantity of 2. Looks
    like we''re lined up for our next iteration.


    # What We Just Did


    It has been a busy, productive day so far. We''ve added a shopping cart to our
    store, and along the way we''ve dipped our toes into some neat Rails features:


    +   * We created a Cart object in one request and were able to successfully locate
    the same cart in subsequent requests using a session object.


    +   * We added a private method in the base class for all of our controllers,
    making it accessible to all of our controllers,


    +   * We created relationships between carts and line items and relationships
    between line items and products, and we were able to navigate between these relationships.


    +   * We added a button that caused a product to be posted to a cart, causing
    a new line item to be created.


    # Playline


    Here''s some stuff to try on your:


    +   * Change the application so that clicking a book''s image will also invoke
    the create action. Hint: the first parameter to link_to is placed in the generated
    <a> tag, and the Rails helper image_tag constructs an HTML <img> tag. Include
    a link to call it as the first parameter to link_to_call. Be sure to include .method
    => :post in your html_options on your call to link_to.


    +   * Add a new variable to the session to record how many times the user has
    accessed the store controller''s index action. Note that the first time this page
    is accessed, your count won''t be in the session. You can test for this with code
    like:


    ```

    if session[:counter].nil?

    ```


    ...


    If the variable isn''t there, you''ll need to initialize it. Then you''ll be able
    to increment it.


    +   * Pass this counter to your template, and display it at the top of the catalog
    page. Hint: the pluralize helper (described on page 352) might be useful when
    forming the message you display.


    +   * Reset the counter to display whenever the user adds items to the cart.


    +   * Change the template to display the counter only if it is greater than five.


    (You''ll find hints at http://pragprog.com/wiki/Rails/Playline).'
