  md: 'If you''re using observers within a Rails application, you need to list them
    in your application''s application.rb file (in the config directory):


    ```

    config.active_record.observers = :order_observer, :audit_observer

    ```


    If you need use your Active Record observers in a stand-alone application (that
    is, you are not running Active Record within a Rails application), you need to
    create instances of the observers manually using instance:


    ```

    OrderObserver.instance

    AuditObserver.instance

    ```


    In a way, observers bring to Rails much of the benefits of first-generation aspect-oriented
    programming in languages like Java. They allow you to inject behavior into model
    classes without changing any of the code in those classes.


    # 19.5 Transactions


    A database transaction groups a series of changes together in such a way that
    either the database applies all of the changes or it applies none of the changes.
    The classic example of the need for transactions (and one used in Active Record''s
    own documentation) is transferring money between two bank accounts. The basic
    logic is simple:


    ```

    account1.deposit(100)

    account2.withdraw(100)

    ```


    However, we have to be careful. What happens if the deposit succeeds but for some
    reason the withdrawal fails (perhaps the customer is overn?) We''ve added $100
    to the balance in account1 without a corresponding deduction from account2. In
    effect, we''ve created $100 out of thin air.


    Transactions to the rescue. A transaction is something like the Three Musketeers
    with their motto "All for one and one for all." Within the scope of a transaction,
    either any SQL statement succeeds or they all have no effect. Putting another
    way, if any statement fails, the entire transaction has no effect on the database.


    In Active Record we use the transaction method to execute a block in the context
    of a particular database transaction. It is committed, updating the database,
    unless an exception is raised within the block, in which case the database rolls
    back all of the changes. Because transactions exist in the context of a database
    connection, we have to invoke them with an Active Record class as a receiver.'
