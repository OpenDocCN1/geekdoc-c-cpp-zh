  md: 'The seller flow, shown in Figure 5.2, is also fairly simple. After logging
    in, the seller sees a menu letting her create or view a product or ship existing
    orders. Once viewing a product, the seller may optionally edit the product information
    or delete the product entirely.


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_73_0.png)


    Figure 5.2: Flow of seller pages


    The shipping option is very simplistic. It displays each order that has not yet
    been shipped, one order per page. The seller may choose to skip to the next or
    may ship the order, using the information from the page as appropriate.


    The shipping function is clearly not going to survive in the real world, but shipping
    is where reality is often stranger than you might think. Overspecify it up front,
    and we''re likely to get it wrong. For now let''s leave it as is, i confident
    that we can change it as the user gains experience using our application.


    # Data


    Finally, we need to think about the data we''re going to be working with.


    Notice that we''re not using words as schema or classes here. We''re also not
    talking about databases, tables, keys, and the like. We''re simply talking about
    data. In this stage in development, we don''t know whether we''ll even be using
    a database.'
