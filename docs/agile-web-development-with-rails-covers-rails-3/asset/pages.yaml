  md: '+   - The controller can return a string directly to the browser without invoking
    a view. This is fairly rare but can be used to send error notifications.


    +   - The controller can return nothing to the browser. This is sometimes used
    when responding to an Ajax request. In all cases, however, the controller returns
    a set of HTTP headers, because some kind of response is expected.


    +   - The controller can send other data to the client (something other than HTML).
    This is typically a download of some kind (perhaps a PDF document or a file''s
    contents).


    A controller always responds to the user exactly one time per request. This means
    that you should have just one call to a render, redirect_to, or send_xxx method
    in the processing of any request. (A DoubleRenderError exception is thrown on
    the second render).


    Because the controller must respond exactly once, it checks to see whether a response
    has been generated just before it finishes handling a request. If not, the controller
    looks for a template named after the controller and action and automatically renders
    it. This is the most common way rendering takes place. You may have noticed that
    in most of the actions in our shopping cart tutorial we never explicitly rendered
    anything. Instead, our action methods set up the context for the view and return.
    The controller notices that no rendering has taken place and automatically invokes
    the appropriate template.


    You can have multiple templates with the same name but different extensions (for
    example, html.erb, .xml.builder, and js.js). If you don''t specify an extension
    in a request, Rails assumes html.erb.


    # Rendering Templates


    A template is a file that defines the content of a response for our application.
    Rails supports three template formats out of the box: erb, which is embedded Ruby
    code (typically HTML); builder, a more programmatic way of constructing XML content;
    and R/JS, which generates JavaScript. We''ll talk about these types files starting
    on page 339.


    By convention, the template for action controller controller will be in the file
    app/views/controller/action.type (where type is the file type, such as html, atom,
    or js; which is one of erb, builder, or rjs). The app/views part of the name is
    the default. You can override this for an entire application by setting this:


    ```

    ActionController.prepend_view_path dir_path

    ```


    The render method is the heart of all rendering in Rails. It takes a hash of options
    that tell it what to render and how to render.'
