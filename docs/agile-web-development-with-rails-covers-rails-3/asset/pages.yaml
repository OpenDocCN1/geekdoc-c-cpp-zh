  md: "Callbacks are a fine technique, but they can sometimes result in a model class\
    \ taking responsibilities that aren't really related to the nature of the model.\
    \ For example, on page 296 we created a callback that generated a log message\
    \ when an order was created. This functionality isn't really part of the basic\
    \ Order class—we put it there because that's where the callback executed.\n\n\
    Active Record *observers* overcome that limitation.\n\n# Observers\n\nAn Active\
    \ Record observer is an object that transparently links itself into a model class,\
    \ registering itself for callbacks as if it part of the model without requiring\
    \ any changes to the model itself. Here's our previous logging example using an\
    \ observer:\n\nDownload e/app/observer.rb\n\n```\nclass OrderObserver < ActiveRecord::Observer\n\
    \  def after_save(an_order)\n    an_order.logger.info(\"Order #{an_order.id} created\"\
    )\n  end\n```\n\nWhen ActiveRecord::Observer is subclassed, it looks at the name\
    \ of the new class, strips the word *Observer* from the end, and assumes what\
    \ is left is the name of the model class to be observed. In our example, we called\
    \ our observer class *OrderObserver*, so it automatically hooked itself into the\
    \ model Order.\n\nSometimes this convention breaks down. When it does, the observer\
    \ class can explicitly list the model or models it wants to observe using the\
    \ observer method:\n\nDownload e/app/observer.rb\n\n```\nclass AuditOrder < ActiveRecord::Observer\n\
    \  observer Order, Payment\n  def after_save(model)\n    model.logger.info(\"\
    [Audit] #{model.class.name}#{model.id} created\")\n  end\n```\n\nBy convention,\
    \ observer source files live in app/models.\n\n# Instantiating Observers\n\nSo\
    \ we've defined our observers. However, we also need to instantiate them—if we\
    \ don't, they won't fire. When we instantiate observers depends on whether we're\
    \ using them inside or outside the context of a Rails application."
