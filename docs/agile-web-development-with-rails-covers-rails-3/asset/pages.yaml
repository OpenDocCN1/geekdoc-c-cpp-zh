  md: "The :test setting is for unit and functional testing, which we will make use\
    \ of Section 13.1, Function Testing Email, on page 187. Email will not be delivered;\
    \ it will be appended to an array (accessible via the ActionMailer::Base.deliveries).\
    \ This is the default method in the test environment, although, the default in\
    \ development mode is :smtp. if you want Rails to deliver email during the development\
    \ of your application, this is good. If you rather disable email delivery in development\
    \ mode, edit the file development.rb in the directory config/environments, and\
    \ add the following lines:\n\n```\nDept::Application.configure do\n  config.action_mailer.delivery_method\
    \ = :test\nend\n```\n\nThe :sendmail setting delegates delivery to your local\
    \ system's sendmail program, which is assumed to be in /usr/bin. This delivery\
    \ mechanism is not particularly portable, because sendmail is not always installed\
    \ in this directory on different operating systems. It relies on your local sendmail\
    \ supporting the -i and -t commands.\n\nYou achieve more portability by leaving\
    \ this option at its default value of :smtp. If you do, you'll need to specify\
    \ some additional configuration to tell Action Mailer where to find an SMTP server\
    \ to handle your outgoing email. This may be the machine running your web application,\
    \ or it may be a separate box (perhaps at your ISP if you're running Rails in\
    \ a noncorporate environment). Your system administrator will be able to give\
    \ you the settings for these parameters. You may also be able to determine them\
    \ from your own client configuration.\n\nThe following are typical settings for\
    \ Gmail. Adapt as you need.\n\n```\nDept::Application.configure do\n  config.action_mailer.delivery_method\
    \ = :smtp\n\n  config.action_mailer.smtp_settings = {\n    address => \"smtp.gmail.com\"\
    ,\n    port => 587,\n    domain => \"domain.of.sender.net\",\n    authentication\
    \ => \"plain\",\n    user_name => \"dave\",\n    password => \"secret\",\n   \
    \ enable_starttls_auto => true\n  }\nend\n```\n\nAs with all configuration changes,\
    \ you'll need to restart your application if you make changes to the environment\
    \ files."
