    def destroy\n  session[:user_id] = nil\n  redirect_to store_url, :notice => \"\
    Logged out\"\nend\n```\n\nFinally, it's time to add the index page, the first\
    \ screen that administrators see when they log in. Let's make it useful—we'll\
