  md: 'That''s why we named our template file hello.html.erb; the .html.erb suffix
    tells Rails to expand the content in the file using a system called ERB.


    nERB is a filter that is installed as part of the Rails installation that takes
    an .erb file and outputs a transformed version. The output file is often HTML
    in Rails, but it can be anything. Normal content is passed through without being
    changed. However, content between <%= %> is interpreted as Ruby code and executed.
    The result of that execution is converted into a string, and value is substituted
    in the file in place of the <%=...%> sequence. For example, change hello.html.erb
    to display the current:


    ```

    Download work/demo2/app/views/say/hello.html.erb

    <h1>Hello from Rails!</h1>

    <p>It is now <%= Time.now %></p>

    >

    ```


