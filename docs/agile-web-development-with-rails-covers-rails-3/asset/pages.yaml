    def ensure_not_referenced_by_any_line_item\n  if line_items.empty?\n    return\
    \ true\n  else\n    errors.add(:base, 'Line Items present')\n    return false\n\
    end\n```\n\nHere we declare that a product has many line items and define a hook\
    \ method named ensure_not_referenced_by_any_line_item. A hook method is a method\
    \ that Rails calls automatically at a given point in an object's life. In this\
    \ case, the method will be called before Rails attempts to destroy a row in the\
    \ database. If the hook method returns false, the row will not be destroyed.\n\
    \nNote that we have direct access to the errors object. This is the place where\
    \ the validates stores error messages. Errors can be associated with individual\
    \ attributes, but in this case we associate the error with the object itself.\n\
