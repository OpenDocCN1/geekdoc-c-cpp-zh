    on. At this point, it makes sense to talk about how such dependencies are managed.


    # 25.3 Managing Dependencies with Bundler


    Dependency management is a deceptively hard problem. During development, you may
    choose to install updated versions of gems that you depend on. Once you do this,
    you may find not being able to reproduce problems that occur in production because
    your runs are picking up different versions of the gems your application depends
    on. Or perhaps you see problems that don''t exist in production.


    It turns out that dependencies are every bit as important to manage your application
    source code or database schemas. If you are developing as part of a team, you
    want every member of the team to be using the same version of the dependencies.
    When you deploy, you want to ensure that the version of the dependencies that
    you tested with are installed on the target machine and the ones actually used
    in production.


    Bundler takes care of this, based on a named Gemfile that is placed in the top
    of your application directory. In this file, you list the dependencies of your
    application. Let''s take a closer look at the Gemfile for the Depot application:


    ```

    Download depot_u/Gemfile

    source ''http://rubygems.org''


    gem ''rails'', ''3.0.5''


    # Bundle edge Rails instead:

    # gem ''rails3'', git => ''https://github.com/rails/rails.git''


    gem ''sqlite3''

    group :production

    gem ''mysql''


    # Use unicorn as the web server

    # gem ''unicorn''


    # Deploy with Capistrano

    gem ''capistrano''


    # To use debugger (ruby-debug for Ruby 1.8.7+, ruby-debug19 for Ruby 1.9.2+)

    # gem ''ruby-debug''

    # gem ''ruby-debug19'', :require => ''ruby-debug''

    ```


    +   2. http://rubygembler.com/'
