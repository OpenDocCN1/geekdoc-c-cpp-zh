  md: 'In this application, we are taking advantage of a number of things we have
    learned so far. The first thing we do is to directly require active_record and
    builder. Then we establish a connection with our database and define a class for
    our Product. We won''t need to do any of this once we integrate this application
    with our Rails application, but for now we are going bare-bones.


    Then comes the application itself. It is a simple class that defines a simple
    method named coll. This method accepts a single parameter named en that contains
    information about the request and is not used by this application.


    This application uses Builder to create a simple HTML rendering of a product list
    and then builds a response, sets the content type, and calls finish.


    By creating a new backup file, we can run this as a stand-alone application:


    ```

    Download depot_u/store

    require ''rubygems''

    require ''bundler/setup''

    require ''./app/store''


    use Rack::ShowExceptions


    map ''/store'' do

    run StoreApp.new

    end

    ```


    The first thing this script does is to initialize Bundler, which will make available
    the right versions of all the gems that will be required. It requires the store
    application.


    Next, it pulls one of the standard middleware classes provided with Rack; this
    formats a stack traceback when things goes wrong. Middleware in Rack is filters
    like Rails—both can inspect requests and adjust the responses produced.


    You can see the list of middlewares that Rails provides for Rails applications
    using the command rake middleware.


    Finally, we map the store URI to this application.


    We can start this application using the rackup command:


    ```

    backup store.ru

    ```


    By default, this rackup starts servers using port 9292 instead of port 3000. You
    can select the port using the -p option.'
