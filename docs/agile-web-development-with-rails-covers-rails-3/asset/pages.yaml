  md: '# # Think Better


    # # Pomodoro Technique Illustrated


    Do you ever look at the clock and wonder where the day went? You spent all this
    time at work and didn''t come close to getting everything done. In Pomodoro Technique
    Illustrated, Staffan Noteberg shows how to organize your work to accomplish more
    less expensive software or fancy planners. You can get started with nothing more
    than a piece of paper, a pencil, and a kitchen timer.


    ## Pomodoro Technique Illustrated: The Easy Way to Do More in Time

    Staffan Noteberg

    (144 pages) ISBN: 9781934356500, $24.95

    http://prprog.com/titles/infofocus


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_455_0.png)


    # # Pragmatic Thinking and Learning


    Software development happens in your head. Not in editor, IDE, or design tool.
    In this book by Pragmatic Programmer Andy Hunt, you learn how our brains are wired,
    and how to take advantage of your brain''s architecture. You will master new tricks
    and tips to learn faster, and retain more of what you learn.


    +   - Use the Dreyfus Model of Skill Acquisition to become more expert

    - Leverage the architecture of the brain to strengthen different thinking modes

    - Avoid "known bugs" in your mind

    - Learn more deliberately and more effectively

    - Manage knowledge more efficiently


    ## Pragmatic Thinking and Learning:

    Refactor Your Wetware

    Andy Hunt

    (288 pages) ISBN: 978-1-93435650-0, $24.95

