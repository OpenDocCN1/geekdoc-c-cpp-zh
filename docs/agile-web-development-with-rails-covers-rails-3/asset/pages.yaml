  md: "# Object-Relational Mapping\n\nORM libraries map database tables to classes.\
    \ If a database has a table called orders, our program will have a class named\
    \ Order. Rows in this table correspond to objects of the class—a particular order\
    \ is represented as an object of class Order. Within that, attributes are used\
    \ to get and set the individual columns. Our Order object has methods to get and\
    \ set the amount, the sales tax, and so on.\n\nIn addition, the Rails classes\
    \ that wrap our database provide a set of class-level methods that perform table-level\
    \ operations. For example, we might need to find the order with a particular id.\
    \ This is implemented as a class method that returns the corresponding Order object.\
    \ In Ruby code, this might look like this:\n\n```\norder = Order.find(1)\nputs\
    \ \"Customer #{order.customer_id}, amount=\\#{order.amount}\" ,\n```\n\nSometimes\
    \ these class-level methods return collections of objects:\n\n```\nOrder.where(:name\
    \ => 'dave').each do |order|\n  puts order.amount\n```\n\nFinally, the objects\
    \ corresponding to individual rows in a table have methods that operate on that\
    \ row. Probably the most widely used is, the operation that saves the row to the\
    \ database:\n\n```\nOrder.where(:name => 'dave').each do |order|\n  order.pay_type\
    \ = \"Purchase order\"\n  order.save\n```\n\nSo, an ORM layer maps tables to classes,\
    \ rows to objects, and columns to attributes of these objects. Class methods are\
    \ used to perform table-level operations, and instance methods perform operations\
    \ on the individual rows.\n\nIn a typical ORM library, you use configuration data\
    \ to specify the mappings between entities in the database and entities in the\
    \ program. Programs using these ORM tools find themselves creating and maintaining\
    \ a boatload of XML configuration files.\n\n# Active Record\n\nActive Record is\
    \ the ORM layer supplied with Rails. It follows the standard ORM model: maps tables\
    \ to classes, rows to objects, and columns to object attributes. It differs from\
    \ most other ORM libraries in the way it is configured. By relying on convention\
    \ and starting with sensible defaults, Active Record minimizes the amount of configuration\
    \ that developers perform."
