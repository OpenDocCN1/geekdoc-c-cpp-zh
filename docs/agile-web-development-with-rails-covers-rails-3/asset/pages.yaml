  md: 'In this chapter, we''ll see


    +   * running our application in a production web server,

    * configuring the database for MySQL;

    * using Bundler and Git for version control, and

    * deploying our application with Capistano.


    # Chapter 16


    # # Task K: Deployment and Production


    Deployment is supposed to mark a happy point in the lifetime of our application.
    It''s when we take the code that we''ve so carefully crafted and upload it to
    a server so other people can use it. When it''s beer, champagne, and hors d''oeuvres
    are supposed to flow. Shortly thereafter, our application will be written about
    in Wired magazine, and we''ll be overnight names in the geek community.


    The reality, however, is that it often takes a bit of up-front planning to pull
    off a smooth and repeatable deployment of your application.


    By the time we are through with this chapter, our setup will look like Figure
    16.1, on the next page.


    > Joe Asks...

    Can I Deploy to Microsoft Windows?

    Although you can deploy applications to Windows environments, the overhelming
    amount of Rails tools and shared knowledge assumes a Unix-based operating system
    such as Linux or Mac OS X. One tool, Phusion Passer, is highly recommended by
    the Ruby on Rails development team and covered in this chapter.

    The techniques described in this chapter can be used by those developing on Windows
    and deploying to Linux or Mac OS X.

    nIf deploying on Windows is a requirement for your installation, then you can
    find good advice in Chapter 6 of Deploying Rails Applications: A Step-by-Step
    Guide (Z108).


