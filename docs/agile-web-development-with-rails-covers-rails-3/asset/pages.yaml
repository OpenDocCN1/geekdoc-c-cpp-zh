    #  Chapter 3


    # # The Architecture of Rails Applications


    One of the interesting features of Rails is that it imposes some fairly serious
    constraints on how you structure your web applications. Surprisingly, these constraints
    make it easier to create applications—a lot easier. Let''s see why.


    #  3.1 Models, Views, and Controllers


    Back in 1979, Trygve Reenskaug came up with a new architecture for developing
    interactive applications. In his design, applications were broken into three types
