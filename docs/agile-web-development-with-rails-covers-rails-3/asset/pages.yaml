    # ### Figure 19.1: Mapping SQL types to Ruby types


    We can see the mapping between SQL types and their Ruby representation in Figure
    19.1. Decimal and Boolean columns are slightly tricky.


    Rails maps columns with Decimals with no decimal places to Fixnum objects; otherwise,
    it maps them to BigDecimal objects, ensuring that no precision is lost.


    In the case of Boolean, it turns out that all databases have a native boolean
    type. In the case of MySQL, a value of 0 is used for false, and a value of 1 is
    used for true. Unfortunately, Ruby treats everything that is not false or nil
    as true, direct usage of these values is problematic. Instead, append a question
    mark to the column name:


    ```

    user = User.find_by_name("Dave")

    if user.superuser?

    grant_privileges

    end

    ```


    In addition to the attributes we define, there are a number of attributes that
    Rails provides automatically or have special meaning.


