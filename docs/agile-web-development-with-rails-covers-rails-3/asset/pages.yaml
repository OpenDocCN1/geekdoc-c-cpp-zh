    \ attr_reader :password\n\n  validate :password_must_be_present\n\n  private\n\
    \    def password_must_be_present\n      errors.add(:password, \"Missing password\"\
    ) unless hashed_password.present?\n    end\n```\n\nThat's a fair amount of validation\
    \ for such a simple model. We check that the name is present and unique (that\
    \ is, no two users can have the same name in the database). Then there is the\
    \ mysterious :confirmation => true parameter.\n\nYou know those fields that prompt\
    \ you to enter a password and then make you reenter it in a separate field so\
    \ you can validate that you typed what you thought you typed? Well, Rails can\
    \ automatically validate the two passwords matches. We'll see how that works in\
    \ a minute. For now, we just have to know that we need two password fields, one\
    \ for the actual password and the other for its confirmation.\n\nFinally, we check\
    \ that the password has been set. But we don't check the password attribute itself.\
    \ Why? Because it doesn't really exist—at least not in the database. Instead,\
    \ we check for the proxy of its, the hashed password. To understand that, we have\
    \ to look at how we handle password storage.\n\nNow we need to create a hashed\
    \ password, and we do so in three steps. First, we create a unique salt value\
    \ (we talk about salts in few paragraphs). Then we combine this salt value with\
    \ the plain-text password and produce a single string. Then we run an SHA2 digest,\
    \ returning a 40-character string of hex digits. We'll write this as a public\
    \ class method. (We'll also need to require the digest/sha2 library in our file.\
