  md: 'Adding our validation should be fairly clean. Let''s start by validating that
    the text fields all contain something before a row is written to the database.
    We do this by adding some code to the existing model:


    ```

    validates :title, :description, :image_url, :presence => true

    ```


    The validates method is the standard Rails validator. It will check each of the
    named fields against one or more conditions.


    :presence => true tells the validator to check that each of the named fields and
    its contents are not empty. In Figure 7.1, on the following page, we can see what
    happens if we try to submit a new product with none of the fields filled in. It''s
    pretty impressive: the fields with errors are highlighted, and the errors are
    summarized in a list at the top of the form. That is not bad for one line of code.
