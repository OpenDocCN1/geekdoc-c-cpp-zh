  md: 'In this chapter, we''ll see


    +   - Representational State Transfer (REST);

    - defining how requests are routed to controllers;

    - selecting a data representation;

    - testing routes;

    - the controller environment;

    - rendering and redirecting; and

    - sessions, flash, and filters.


    # Chapter 20


    # Action Dispatch and Action Controller


    Action Pack lies at the heart of Rails applications. It consists of three Ruby
    modules: ActionDispatch, ActionController, and ActionView. Action Dispatch routes
    requests to controllers. Action Controller converts requests into responses. Action
    View is used by ActionController to format responses.


    As a concrete example, in the Depot application, we routed the root of the site
    (/) to the index method of the StoreController. At the completion of this method,
    the template in app/views/store/index.html.erb was rendered. Each of these activities
    was orchestrated by modules in the ActionPack component.


    Working together, these three submodules provide support for processing requests
    and generating outgoing responses. We''ll look at both Action Dispatch and Action
    Controller. In this chapter, we''ll cover Action View.


    When we looked at Active Record, we saw it could be used as a freestanding library;
    you can use Active Record as part of a newbie Rails application. Action Pack is
    different. Although it is possible to use it as a framework, you probably won''t.
    Instead, you''ll take advantage of the tight integration offered by Rails. Components
    such as Action Controller, Action View, and Active Record handle the processing
    of requests, and the Rails environment knits them together into a coherent (and
    easy-to-use) whole. For that reason, we''ll describe Action Controller in the
    context of Rails. Let''s start by looking at how Rails applications handle requests.
    We''ll then dive into the details of routing and URL handling. How you write code
    in a controller. Finally, we will cover sessions, flash, and filters.


    # 20.1 Dispatching Requests to Controllers


    At its simplest, a web application accepts an incoming request from a browser,
    processes it, and sends a response.'
