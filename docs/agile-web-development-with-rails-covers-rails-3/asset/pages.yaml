  md: 'While we have covered the basics, transactions are actually very subtle. They
    exhibit the so-called ACID properties; they''re Atomic, they ensure Consistency,
    they work in Isolation, and their effects are Durable (they are made permanent
    when the transaction is committed). It''s worth finding a good database book and
    reading up on transactions if you plan to take a database application live.


    # What We Just Did


    We learned the relevant data structures and naming conventions for tables, classes,
    columns, attributes, Ids, and relationships. We saw how to create, read, update,
    and delete data. Finally, we now understand how transactions and callbacks can
    be used to prevent inconsistent changes.


    This, coupled with validation as described in Chapter 7, Task B: Validation and
    Unit Testing, on page 90, covers all the essentials of Active Record that every
    Rails programmer needs to know. If you have specific needs beyond what is covered
    here, look to the Rails Guides that you generated on page 262 for more information.


    The next major subsystem to cover is Action Pack, which covers both the view and
    controller portions of Rails.'
