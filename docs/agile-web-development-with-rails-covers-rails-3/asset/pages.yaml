    when debugging. For example the html template uses the debug method to display
    the contents of the session, the details of the parameters, and the current response:


    ```

    <h1>Session</h1> <%= debug(session) %>

    <h2>Params</h1> <%= debug(params) %>

    <h2>Response</h1> <%= debug(response) %>

    ```


    +   - The current controller object is accessible using the attribute controller.
    This allows the template to call any public method in the controller (including
    the methods in ActionController).


    +   - The path to the base directory of the templates is stored in the attribute
    base_path.


