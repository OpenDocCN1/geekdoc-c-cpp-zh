  md: '# <h1>Hello, Dave!</h1>


    ```

    <p>

    It''s <%= DAY_NAMES[today.wday] %>.

    Tomorrow is <%= DAY_NAMES[(today + 1).wday] %>.

    </p>

    ```


    In the JSP world, this would chastise you if they discover you adding code to
    templates. Ignore them—they are falling prey to dogma. There''s nothing wrong
    with putting code in a template. Just don''t put too much code in there (and especially
    don''t put business logic in a template). As we have already seen, you can use
    helper methods to successfully resist this temptation.


    You can think of the HTML text between code fragments as if each line were written
    by a Ruby program. The <%...%> fragments are added to that same program. The HTML
    is interwoven with the explicit code that you write. As a result, code between
    % and % can affect the output of HTML in the rest of the template.


    For example, consider this template:


    ```

    <% 3.times do %>

    Ho!<br/>

    <% end %>

    ```


    For safety reasons,when you insert a value using <%=...%>, the results will be
    HTML escaped before being placed directly into the output stream. This is generally
    what you want.


    If, however, the text you''re substituting contains HTML you want to be interpreted,
    this will cause the HTML tags to be escaped—if you create a string containing
    <em>hello</em> and then substitute it into a template, the user will see <em>hello</em>
    rather than *hello*. Rails provides two helpers to address this case.


    The raw method will cause the string to pass right through to the output without
    escaping. This provides the most amount of flexibility, as well as the least amount
    of security.


    The sanitize method offers some protection. It takes a string containing HTML
    and cleans up dangerous elements: <form> and <script> tags are escaped, and on
    attributes and links javascript are removed.


    The product descriptions in our Depot application were rendered as HTML (that
    is, they were marked as safe using the raw method). This allowed us embed formatting
    information in them. If we allowed people outside our organization to enter these
    descriptions, it would be prudent to use the sanitize method to reduce the risk
    of our site being attacked successfully.


    +   1. http://www.owasp.org/index.php/Cross_site_scripting_%28XSS%29'
