  md: "A first attempt to hide the flash might involve adding the following line to\n\
    creole.items/js.js:\n\n```\npage[:notice].hide\n# rest as before...\n```\n\nHowever,\
    \ this does not work. If we come to the store for the first time, there's\nnothing\
    \ in the flash, so the paragraph with notice is not displayed.\nAnd, if there's\
    \ no tag with an id of notice, the JavaScript generated by the RJS\ntemplate that\
    \ tries to hide it bombs out, and the rest of the template never\ngets run. As\
    \ a result, you never see the cart update in the sidebar.\n\nThe solution is a\
    \ little hack. We want to run .hide if only the notice is\npresent, RJS doesn't\
    \ give us the ability to generate JavaScript that\nfor individual ids. It does,\
    \ however, let us iterate over tags on the page that\nmatch a CSS selector pattern.\
    \ So, let's iterate over all tags with an id of\nofice. The loop will find one\
    \ such tag, which we can hide, or none, in\nwhich case the hide won't get caught.\n\
    \n```\nDownload deplo/app/views/line_items/creole.js\npage.select('#notice').each\
    \ { |notice| hide }\n```\n\n```\npage.replace_html('cart', render(@cart))\npage[:].visual_effect\
    \ :bind_if @cart.total_items == 1\npage[:current_item].visual_effect :startcolor\
    \ => \"#88ff88\",\n:endcolor => \"#114411\"\n```\n\nNow we've captured the cart,\
    \ it is time to alert the ordering department.\nWe will do that with feeds, specifically,\
    \ an Atom-formatted feed of orders.\n\n# 12.2 Iteration G2: Atom Feeds\n\nUsing\
    \ a standard format, as Atom, means you can immediately take\nadvantage of a wide\
    \ variety of preexisting clients. Because Rails already knows\ndates, and links,\
    \ it can free you from worrying about these\npesky details and let you focus on\
    \ producing a human-readable summary. We\nstart by adding a new action to the\
    \ resource and include Atom to the list of\nformats that we respond to:\n\n```\n\
    Download deplo/app/controllers/products_controller.rb\ndef who_bought\n  @product\
    \ = Product.find(params[:id])\n  respond_to do |format|\n    format.atom\n   \
