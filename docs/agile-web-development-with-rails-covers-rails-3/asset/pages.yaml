  md: "# 15.1 Iteration J1: Selecting the Locale\n\nWe start by creating a new configuration\
    \ file that encapsulates our knowledge of what locales are available and which\
    \ one is to be used as the default.\n\n```\nDownload depot_s/config/initializers/i18n.rb\n\
    #encoding: utf-8\nI18n.default_locale = :en\n\nUAGES = [\n  'English', 'en'],n\
    \  'Españ&tilde;ol'.html_safe, 'es'\n]\n```\n\nThis code is doing two things.\n\
    \nThe first thing it does use the i18n module to set the default locale. i18n\
    \ is a funny name, but it beats typing out internationalization all the time.\
    \ Internationalization, after all, starts with an i, ends with an n, and has eighteen\
    \ letters in between.\n\nThen it defines a list of associations with display names\
    \ and locale names. Unfortunately, we all available at the moment is a U.S. keyboard,\
    \ and español has a character that can't be directly entered via our keyboard.\
    \ Operating systems have different ways of dealing with this, and often the easiest\
    \ way is to simply copy and paste the correct text from a website. If you do this,\
    \ make sure your editor is configured for UTF-8. Meanwhile, we've opted to use\
    \ the HTML equivalent of \"n tile\" character in Spanish. If we didn't do anything,\
    \ the markup itself would be shown. By calling html_safe, we inform Rails that\
    \ the string is safe as containing HTML.\n\nTo get Rails to pick up this configuration\
    \ change, the server needs to be restarted.\n\nSince each page that is translated\
    \ will have an an and es version (for now, more will be added later), it makes\
    \ sense to include this in the URL. Let's plan to put the locale up front, make\
    \ it optional, and have it default to the current locale, which in turn default\
    \ to English.\n\nTo implement this cunning plan, let's start with modifying config/routes.rb:\n\
    \n```\nDownload depot_s/config/routes.rb\nDepot::Application.routes draw\n  get\
    \ 'admin' => 'admin#index'\n  controller :sessions do\n    get 'login' => :new\n\
    \    post 'login' => :create\n    delete 'logout' => :destroy\nend\n```"
  merge: -1
  pgno: 216
- img_proc: true
  md: "```\nscope ':locale' do\n  resources :users\n  resources :orders\n  resources\
    \ :line_items\n  resources :carts\n  resources :products => :member\n    get :who_bought,\
    \ :on => :member\n  end\n  root :to => '#store#index', as => 'store'\nend\n```\n\
    \nWhat we have done is nested our resources and root declarations inside a scope\
    \ declaration :locale in parentheses, is the way to say that it is optional. Note\
    \ that we did not choose to put the administrative and session functions inside\
    \ this scope, because it is not our intent to translate them at this time.\n\n\
    What this means is that both http://localhost:3000/ will use the default locale,\
    \ namely, English, and therefore be routed exactly the same as http://localhost:3000/en,\
    \ http://localhost:3000/es will route to the same controller and action, but we\
    \ want this to use the locale to set differently.\n\nTo do this, we need to create\
    \ a :filter and set the default_url_options. The logical place to do this is in\
    \ the common base class for all of our controllers, which is Application:\n\n\
    ```\nDownload depresot_s/app/controllers/application_controller.rb\n```\n\n```\n\
    class ApplicationController < ActionController::Base\n  before_filter :i18n_locale_from_params\n\
    \  # ...\n```\n\n```\nprotected\n  def i18n_locale_from_params\n    if params[:locale]\n\
    \      if I18n.available_locales.include?(params[:locale].to_sym)\n        I18n.locale\
    \ = params[:locale]\n      else\n        flash.now[:notice] = \"#{params[:locale]}\
    \ translation not available\"\n        logger.error flash.now[:notice]\n     \
    \ end\n    end\n  end\n  def default_url_options\n    { locale => I18n.locale\
    \ }\n  end\n```\n\nThis set_i18n_locale_from_params does pretty much what it says:\
    \ it sets the locale in the session from the params, but only if there is a locale\
    \ in the params;"
