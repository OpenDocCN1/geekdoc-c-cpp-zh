  md: "# The Customer Is Never Satisfied\n\nWe're feeling pretty pleased with ourselves.\
    \ We changed a handful of lines of code, and our boring old Web 1.0 application\
    \ now sports Web 2.0 speed stripes. We breathlessly called the client to come\
    \ over. Without saying anything, we proudly pressed Add to Cart and looked at\
    \ her, each eager for the praise we know will come. Instead, she looks surprised.\
    \ \"You called me over to show me a bug? she asks. \"You click that button, and\
    \ nothing happens.\"\n\nWe patiently explain that, in fact, quite a lot happened.\
    \ Just look at the cart in the sidebar. When we add something, the quantity changes\
    \ from 4 to 5.\n\n\"Oh,\" she says. \"I didn't notice that.\" And, if she didn't\
    \ notice the page update, it's likely our customers won't either. It's time for\
    \ some-interface hacking.\n\n# Iteration F3: Highlighting Changes\n\nIncluded\
    \ with Rails is a number of JavaScript libraries. One of those libraries, effects.js,\
    \ lets you decorate your web pages with a number of visually interesting effects!\
    \ One of these effects is the (now) infamous Yellow Fade Technique. This highlights\
    \ an element in a browser: by default it flashes the background yellow and then\
    \ gradually fades back to white. We use the Yellow Technique being applied to\
    \ our cart in Figure 11.2, on the following page; the image at back shows the\
    \ original cart. The user clicks the Add to Cart button, and the count updates\
    \ to 2 as the line flares brighter. It then fades back to the background color\
    \ over a short period of time.\n\nLet's add this kind of highlight to our cart.\
    \ Whenever an item in the cart is updated (either when it is added or when we\
    \ change the quantity), let's flash its background. That will make it clearer\
    \ to users that something has changed, even though the page hasn't refreshed.\n\
    \nThe first problem we have is identifying the most recently updated item in the\
    \ cart. Right now, each item is a <tr>. We need to flag the most recently changed\
    \ one. The work starts in LineItemsController. Let's pass the current line item\
    \ to the template by assigning it to an instance variable:\n\n```\nDownload depot_mop/app/controllers/line_items_controller.rb\n\
    ```\n\n```\ndef create\n  @cart = current_cart\n  product = Product.find(params[:product_id])\n\
    \  @line_item = @cart.add_product(product.id)\n\n  response_to do |format|\n \
    \   if @line_item.save\n```\n\n+   effects.js is from Script.aculo. Take a look\
    \ at the visual effects at https://github.com/madrobby/scriptaculous/wiki to see\
    \ what you can do with."
