  md: '# David Says...


    # Where Are Our Attributes?


    The notion of a database administrator (DBA) as a separate role from programmer
    has led some developers to see strict boundaries between code and schema. Active
    Record blurs that distinction, and no other place is that more apparent than in
    the lack of explicit attribute definitions in the model.


    But fear not. Practice has shown that it makes little difference whether we''re
    looking at a database schema, a separate XML mapping file, or inline attributes
    in the model. The composite view is similar to the separations already happening
    in the Model-View-Controller pattern—just on a smaller scale.


    Once the discomfort of treating the table schema as part of the model dissipation,
    you''ll start to realize the benefits of keeping DRY. When you need to add an
    attribute to the model, you simply create a new migration and reload the application.


    Taking the "build" step out of schema evolution makes it just as agile as the
    rest of the code. It becomes much easier to start with a small schema and extend
    it as needed.


    We access these attributes using accessor methods. Rails automatically constructs
    both attribute readers and attribute writers when it reflects on the schema:


    ```

    o = Order.find(1)              => "David Thomas"

    puts o.name

    o.name = "Fred Smith"        # set the name

    ```


    Setting the value of an attribute does not change anything in the database—we
    must save the object for this to become permanent.


    The value returned by the attribute readers is cast by Active Record to an appropriate
    Ruby type if possible (for example, if the database column is a timestamp, a Time
    object is returned). If we want to get the raw value of an attribute, we append
    `before_type_cast` to its name, as shown in the following code:


    ```

    product.price_before_type_cast    => "29.95", a string

    product.updated_at_before_type_cast => "2008-05-13 10:13:14"

    ```


    Inside the code of the model, we can use the `read_attribute` and `write_attribute`
    private methods. We take the attribute name as a string parameter.'
