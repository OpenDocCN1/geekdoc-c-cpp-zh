  md: 'If we pass multiple parameters to a where call, Rails treats the first parameter
    as a template for the SQL to generate. Within this SQL we can embed placeholders,
    which will be replaced at runtime by the values in the rest of the array.


    One way of specifying placeholders is to insert one or more question marks in
    the SQL. The first question mark is replaced by the second element of the array,
    the next question by the third, and so on. For example, we could rewrite the previous
    query as:


    ```

    name = params[:name]

    pos = Order.where("name = ? and pay_type = ''po'', name])

    ```


    We can also use placeholders. We do that by placing placeholders of the form into
    the string and by providing corresponding values in a hash, where the keys correspond
    to the names in the query:


    ```

    name = params[:name]

    pay_type = params[:pay_type]

    pos = Order.where("name = :name and pay_type = :pay_type",

    :pay_type => pay_type, name => name})

    ```


    We can take this step further. Because params is effectively a hash, we can simply
    pass it all to the condition. If we have a hash that is used to enter search criteria,
    we can use the hash of values returned from that form directly:


    ```

    pos = Order.where("name = :name and pay_type = :pay_type",

    params[:order])

    ```


    We can take this even further. If we pass a hash as the condition, Rails generates
    a where clause using the keys as column names and the values to match. Though,
    we could have written the previous code even more succinctly:


    ```

    pos = Order.where(params[:order])

    ```


    Be careful with this latter form of condition: it takes all the key/value pairs
    in the hash you pass when constructing the condition. An alternative would be
    to specify which parameters to use explicitly:


    Regardless of which form of placeholder you use, Active Record takes great care
    to quote and escape the values substituted into the SQL. Use these forms of dynamic
    SQL, and Active Record will keep you safe from injection attacks.


