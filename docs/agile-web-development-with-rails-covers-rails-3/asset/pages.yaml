    # 2.1 Creating a New Application


    When you install the Rails framework, you also get a new command-line tool, rails,
    that is used to construct each new Rails application you write.


    Why do we need a tool to do this? Why can''t we hack away in our favorite editor
    and create the source for our application from scratch? We could just hack off.
    After all, a Rails application is just Ruby source code. But Rails also does a
    lot of magic behind the curtain to get our applications to work with a minimum
    of effort configuration. To get this magic to work, Rails needs to find all the
    components of your application. As we''ll see later in Section 18.1. Where Things
    Go, on page 258, this means we need to create a specific directory structure,
    slotting the code into the appropriate places. The rails command simply creates
    this directory structure for us and populates it with some standard Rails code.


    To create your first Rails application, pop open a shell window, and navigate
    to a place in your filesystem where you want to create your application''s directory
    structure. In our example, we''ll be creating projects in a directory called demo.
    In that directory, we''ll use the rails command to create an application called
    demo. If you have an existing directory you will be asked whether you to overwrite
    any existing files. (Note: if you want to specify which Rails version to use,
    as described in Section 1.4. Choosing a Rails Version, on page 28, now would be
    the time to do so.)


    ```

    ruby> cd work

    work> rails new demo

    create      .README

    create      .gitignore

    ```'
