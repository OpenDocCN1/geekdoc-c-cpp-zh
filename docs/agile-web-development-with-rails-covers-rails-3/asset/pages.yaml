  md: "```\norders = Order.find_by_sql(\"select id, name, pay_type from orders where\
    \ id=123\")\nfirst = orders[0]\nfirst.name = \"Wilma\"\nfirst.save\n```\n\nIn\
    \ the addition method, Active Record lets us change the values of attributes and\
    \ a model object in a single call to update_attribute:\n\n```\norder = Order.find(123)\n\
    order.update_attribute(:name, \"Barney\")\n```\n\n```\norder = Order.find(321)\n\
    order.update_attributes(:name => \"Barney\",\nemail => \"barney@bedrock.com\"\
    )\n```\n\nThe update_attributes method is most commonly used in controller actions\
    \ where it merges data from a form into an existing database:\n\n```\ndef save_after_edit\n\
    \  order = Order.find(params[:id])\n  if order.update_attributes(params[:order])\n\
    \    redirect_to :action => :index\n  else\n    render :action => :edit\n  end\n\
    end\n```\n\nWe can combine the functions of reading a row and updating it using\
    \ the class methods update and all. The update method takes an id parameter and\
    \ a set of attributes. It fetches the corresponding row, updates the attributes,\
    \ and returns the model object.\n\n```\norder = Order.update(12, :name => \"Barney\"\
    , :email => \"barney@bedrock.com\")\n```\n\nWe can pass an array of ids and an\
    \ array of attribute value hashes, and it will update all the corresponding rows\
    \ in the database, returning an array of model objects.\n\nFinally, the update_all\
    \ class method allows us to specify the set and where clauses of the SQL update\
    \ statement. For example, the following increases the prices of all products in\
    \ Java in their title by 10 percent:\n\n```\nresult = Product.update_all('price\
    \ = 1.1*price', 'title like %Java%\")\n```\n\nThe return value of update_all depends\
    \ on the database; most (but not Oracle) return the number of rows that were changed\
    \ in the database.\n\n# save, save!,, create, and create!\n\nIt turns out there\
    \ are two versions of the save and create methods. The variants differ in the\
    \ way they report errors:\n\n+   - save returns true if the record was saved;\
    \ it returns nil otherwise."
