  md: "# Sending Email\n\nNow we have everything configured, let's write some code\
    \ to send emails.\n\nBy now you shouldn't be surprised that Rails has a generator\
    \ script to create mailers. What might be surprising is where it creates them.\
    \ In Rails, a mailer is a class that's stored in the app/mailers directory. It\
    \ contains one or more methods, with each method corresponding to an email template.\
    \ To create the body of the email, these methods in use views (just the same way\
    \ that controller actions use views to create HTML and XML). So, let's create\
    \ a mailer for our application. We'll use it to send two types of emails: one\
    \ when an order is placed and a second when the order ships. The rails generate\
    \ mailer command takes the name of the mailer class, with the names of the email\
    \ method actions:\n\n```\ndepot rails generate mailer Notifier order_received\
    \ order_shipped\ncreate app/mailers/notifier.rb\ninvoke erb\ncreate app/views/notifier\n\
    create app/views/notifier/order_received.text.rb\ncreate app/views/notifier/order_shipped.text.rb\n\
    invoke test_unit\ncreate test/functional/notifier_test.rb\n```\n\nNotice that\
    \ we've created a Notifier class in app/mailers and two template files, for each\
    \ email template, in app/views/notifier.(We also created a test file—we'll look\
    \ into this later in Section 13.1, Function Testing, on page 187.)\n\nEach method\
    \ in the mailer class is responsible for setting up the environment for sending\
    \ a particular email. Let's look at an example before going into the details.\
    \ Here is the code that was generated for our Notifier class, with one default\
    \ changed:\n\n```\ndepot_p/app/mailers/notifier.rb\n```\n\n```\nclass Notifier\
    \ < ActionMailer::Base\n  default :from => 'Sam Ruby <depot@example.com>',\n```\n\
    \n```\n# Subject can be set in your I18n file at config/locales/en.yml\n# with\
    \ the following lookup:\n# en.notifier.order_received.subject\n#\n```\n\n```\n\
    def order_received\n  @greeting = \"Hi\"\n\nmail :to => \"to@example.org\"\nend\n\
    ```"
