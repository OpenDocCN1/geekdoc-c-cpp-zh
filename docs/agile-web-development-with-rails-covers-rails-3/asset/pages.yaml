    # A Place for Documentation


    As we saw in Section 17.2, Documenting What We Have Done, on page 256, Rails provides
    the docapp rake task to generate documentation, which it places in the doc/ directory.
    In addition to this, Rails provides other tasks that generate documentation: docrails
    will provide documentation for the version of Rails you are running, and docguides
    will provide usage guides. Before you build the guides, you will need to add the
    gem RedCloth (note: case significant) to your Gemfile and run bundle install.


    Rails also provides other document-related tasks. To see them all, enter the command
    rake -T doc.


    # A Place for Supporting Libraries


    The lib directory holds code that doesn''t fit neatly into a model, view, or controller.
    For example, you may have written a library that creates PDF receipts for your
    store''s customers can download. These receipts are sent directly from the controller
    to the browser (using the send_data method). The code that creates these PDF receipts
    will sit naturally in the lib directory.


    The lib directory is also a good place to put code that is shared among models,
    views, or controllers. You may need a library that validates a credit card number''s
    checksum, that performs some financial calculation, or works out the date of Easter.
    Anything that isn''t directly a model, view, or controller should be slotted into
    lib.


    Don''t feel that you have to stick a bunch of files directly into the lib directory.
    Feel free to create subdirectories in which you group related functionality under
    lib. For example, on the Pragmatic Programmer site, the code that generates receipts,
    customs documentation for shipping, and other PDF-formatted documentation is in
    the directory lib/pdf_stuff.


