  md: '# ## Joe Asks...

    ### So, Where''s Rails?


    One of the interesting aspects of Rails is how you spend your time dealing with
    high-level modules such as Active Record and Action View. There is a component
    called Rails, but it sits below the other components, silently orchestrating what
    they do and making them work together seamlessly. Without the Rails component,
    not much would happen. But at the same time, only a small part of this underlying
    infrastructure is relevant to developers in their day-to-day work. We''ll cover
    the parts that are relevant in the rest of this chapter.


    +   * Gemfile specifies the dependencies of your Rails application. You have already
    seen this in use when the paginate plugin was added to the Depot application.
    Application dependencies also include the database, web server, and even scripts
    used for deployment.

    * Technically, this file is not used by Rails itself but rather by your application.
    You can find calls to the Bundler² in the config/boot.rb and config/application.rb
    files.

    * Rakefile defines tasks to run tests, create documentation, extract the current
    structure of your schema, and more. Type rake -tasks at a prompt for the full
    list. Type rake --desc to see a complete description of a specific task.

    * README contains general information about the Rails framework itself.


    Now''s look at what goes into each directory (although not necessarily in order).


