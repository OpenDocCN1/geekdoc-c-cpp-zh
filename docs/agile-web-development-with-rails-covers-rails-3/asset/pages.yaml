  md: "```\ndef self.down\n    remove_column :line_items, :quantity\nend\nend\n```\n\
    \nOnce complete, we run the migration:\n\n```\ndepot> rake db:migrate\n```\n\n\
    Now we need a smart add_product method in our Cart, one that checks whether our\
    \ list of items already includes the product we're adding: if it does, it bumps\
    \ the quantity, and if not, it builds a new LineItem:\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_126_0.png)\n\
    \n```\ndef add_product(product_id)\n    current_item = line_items.find_by_product_id(product_id)\n\
    \    if current_item\n        current_item.quantity += 1\n    else\n        current_item\
    \ = line_items.build(:product_id => product_id)\n    current_item\n```\n\nThis\
    \ code uses a clever Active Record trick. You see that the first line of the method\
    \ calls find_by_product_id. But we don't define a method with that name. Active\
    \ Record notices the call that it starts with the string find_by and ends with\
    \ the name of a column. It dynamically constructs a finder method for us, adding\
    \ it to our class. We will talk more about these dynamic finders starting on page\
    \ 283.\n\nWe also need to modify the line item controller to make use of this\
    \ method:\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_126_1.png)\n\n```\ndef create\n\
    \    @cart = current_cart\n    product = Product.find(params[:product_id])\n \
    \   @line_item = @cart.add_product(product_id)\n```\n\n```\nrespond_to do |format|\n\
    \    if @line_item.save\n        format.html { notice => 'Line item was successfully\
    \ created.' }\n        format.xml { render :xml => @line_item,\n             \
    \       status: :location => @line_item }\n    else\n        format.html { render\
    \ :action => \"new\" }\n        format.xml { render :xml => @line_item.errors,\n\
    \                    status: :unprocessable_entity }\n```"
