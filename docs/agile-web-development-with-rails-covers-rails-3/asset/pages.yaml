    Figure 10.3: Our application spills its guts.


    # 10.2 Iteration E2: Handling Errors


    Looking at the page displayed in Figure 10.3, it''s apparent that our application
    raised an exception at line 16 of the carts controller. ¹ That turns out to be
    the line:


    ```

    @cart = Cart.find(params[:id])

    ```


    If the cart cannot be found, ActiveRecord raises a RecordNotFound exception, which
    we clearly need to handle. The question arises—how?


    We could just ignore it. From a security standpoint, this is probably the best
    move, because it gives no information to a potential attacker. However, it also
    means that we should have a bug in our code that generates bad ids, our application
    will appear to the outside world to be unresponsive—no one will know there has
    an error.


    Instead, we''ll take two actions when an exception is raised. First, we''ll log
    the fact to an internal log file using Rails logger facility². Second, we''ll
    eventually the catalog page, with a short message to the user (among the lines
    of "invalid cart") so they can continue to use our site.


    Rails has a convenient way of dealing with errors and error reporting. It defines
    a structure called a flash. A flash is a bucket (closer to a Hash) in which you
    can store stuff as you process a request. The contents of the flash are available
    to the next request in this session before being deleted automatically.


    +   1. Your line number might be different. We have some book-related formatting
    stuff in our source files.

    2. http://guides.rubyonrails.org/debugging_rails_applications.html#the-logger'
