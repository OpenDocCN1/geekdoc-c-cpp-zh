    Another variation is the way that numbers themselves are displayed. Decimal values
    are delimited by a comma, and separators for the thousands place are indicated
    by a dot.


    Currency is a lot more complicated than it appears, and that''s a lot of decisions
    to be made. Fortunately, Rails knows to look in your translations for this information;
    all we need to do is supply it. First for en:


    [Download](depol_s/config/locales/en.yml)


    ```

    number:

    currency:

    format:

    unit: "$"

    precision: 2

    separator: ","

    delimiter: ","

    format: "%u%n"

    ```


    And then for es:


    [Download](depol_s/config/locales/es.yml)


    ```

    number:

    currency:

    format:

    unit: "$US"

    precision: 2

    separator: ","

    delimiter: ","

    format: "%u&nbsp;%u"

    ```'
