  md: '# Joe Asks...

    Why Atom?


    There are a number of different feed formats, most notably RSS 1.0, RSS 2.0, and
    Atom, standardized in 2000, 2002, and 2005, respectively. These three are all
    widely supported. To aid with the transition, a number of sites provide multiple
    feeds for the same site, but this is no longer necessary, increases user confusion,
    and generally is not recommended.


    The Ruby language provides a low-level library, which can produce any of these
    formats, as well as a number of lower common versions of RSS. For best results,
    stick with one of the three main versions.


    The Rails framework is all about picking reasonable defaults and has chosen Atom
    as the default for feed formats. It is specified as an Internet standards protocol
    for the Internet community by the IETF, and Rails provides a higher-level helper
    named atom_feed that takes care of a number of details based on Rails naming conventions
    for things like ids and dates.


    By adding format.atom, we cause Rails to look for a template named who_bought.atom.builder.
    Such a template can make use of the generic XML functionality as well as of the
    knowledge of the Atom feed that the atom_feed helper provides:


    ```

    Download depot_o@views/products/who_bought.atom.builder

    atom_feed do |feed|

    feed.title "Who bought #{@product.title}"


    latest_order = @product.orders.sort_by(&:updated_at).last

    feed.update(latest_order && latest_order.updated_at)


    @product.orders do |order|

    feed.entry(order) do |entry|

    entry.title "Order #{order.id}"

    entry.summary :type => ''xhtml'' do |html|

    html.p "Shipped to #{order.address}"

    html.table do

    html.tr do

    html.th "Product"

    html.th "Quantity"

    html.th "Total Price"

    end

    order.line_items.each do |item|

    html.tr do

    html.td item.product

    end

    end

    end

    ```'
