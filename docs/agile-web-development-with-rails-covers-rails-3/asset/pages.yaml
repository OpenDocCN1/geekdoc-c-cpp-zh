  md: "# Joe Asks...\nAren't You Creating Duplicate Orders?\n\nJoe is concerned to\
    \ see our controller creating Order model objects in two actions: new and create.\
    \ He's wondering why this doesn't lead to duplicate orders in the database.\n\n\
    The answer is simple: the checkout action creates an Order object in memory to\
    \ simplify the template code to work with. Once the response is sent to the browser,\
    \ that particular object gets abandoned, and it will eventually be reaped by Ruby's\
    \ garbage collector. It never gets close to the database.\n\nThe create action\
    \ creates an Order object, populating it from the form fields. This object does\
    \ get saved in the database. So, model objects perform two roles: they map data\
    \ into and out of the database, but they are just regular objects that hold business\
    \ data. They affect the database only when you tell them to, typically by calling\
    \ save.\n\nThe method itself ends up looking something like this:\n\n```\ndeploy_p/app/controllers/orders_controller.rb\n\
    def create\n  @order = Order.new(params[:order])\n  @order.add_line_items_from_cart(current_cart)\n\
    \n  respond_to do |format|\n    if @order.save\n      destroy(session[:cart_id])\n\
    \      session[:cart_id] = nil\n      format.html { render redirect_to(:store_url,\
    \ :notice => \n        \"Thank you for your order.\" }\n      format.xml { render\
    \ xml => @order, status => :created,\n        :location => @order }\n    else\n\
    \      format.html { render action => \"new\" }\n      format.xml { render xml\
    \ => @order.errors,\n        status => :unprocessable_entity }\n    end\n  end\n\
    ```\n\nWe start by creating a new Order object and initialize it from the form\
    \ data. In this case, we format all the form data related to order objects, so\
    \ we select the :order hash from the parameters (this is the name we passed as\
    \ the first parameter to form_for). The next line adds items into the order that\
    \ are already stored in the cart—we'll write the actual method to do this in a\
    \ minute."
  merge: -1
  pgno: 166
- img_proc: true
  md: "Next we tell the object to save itself (and its children, the line items) to\
    \ the database. Along the way, the order object will perform validation (but we'll\
    \ get to that in a minute). If the save succeeds, we do two things. First, we\
    \ ready ourselves for this customer's next order by deleting the cart from the\
    \ session. Then, we redisploy the catalog using the redirect_to method to display\
    \ a cheerful message. If, instead, the save fails, we redirect the checkout.\n\
    \nIn the create action we assumed that the order contains the method add_items_from_cart,\
    \ so let's implement that method now:\n\n```\nDownload depot_p/app/models/order.rb\n\
    class Order < ActiveRecord::Base\n  #...\n  def add_line_items_from_cart(cart)\n\
    \    cart.line_items.each do |item|\n      item.cart_id = nil\n      line_items\
    \ << item\n    end\nend\n```\n\nFor each item we transfer from the cart to the\
    \ order, we need to do two things. First we set the cart_id to nil to prevent\
    \ the item from going poor when we destroy the cart.\n\nThen we add the item itself\
    \ to the line_items collection for the order. Notice that we didn't have to do\
    \ anything special with the various foreign key fields, such as setting the order_id\
    \ column in the line item rows to reference the newly created order. Rails does\
    \ knitting for us using the has_many and belongs_to: declarations we added to\
    \ the Order and Lineitem models. Adding each new item to the line_items collection\
    \ handles the responsibility for key management over Rails.\n\nWe will also need\
    \ to modify the test to reflect the new redirect:\n\n```\nDownload depot_p/test/functional/orders_controller_test.rb\n\
    require 'test_helper'\nclass OrdersController < ActionController::TestCase\n \
    \ #...\n  test \"should create order\" do\n    assert_difference('Order.count')\
    \ do\n      post :create, :order => @order.attributes\n    end\n  end\n\n  assert_redirected_to\
    \ store_path\n  #...\nend\n```"
