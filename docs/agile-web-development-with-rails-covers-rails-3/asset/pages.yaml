  md: 'The destroy instance method deletes from the database the row corresponding
    to a particular model object. It freezes the contents of that object, preventing
    future changes to the attributes.


    ```

    order = Order.find_by_name("Dave")

    order.destroy

    # order is now frozen

    ```


    There are two class-level destruction methods, destroy (which takes an id or an
    array of ids) and destroy_all (which takes a condition). Both read the corresponding
    rows in the database table into model objects and call the instance-level method
    of those objects. Neither method returns anything meaningful.


    ```

    Order.destroy_all("shipped_at < ?, 30.days.ago")

    ```


    Why do we need both the delete and destroy class methods? The delete methods bypass
    the Active Record callback and validation functions, while destroy ensure they
    are all invoked. In general, it is better to use the destroy method if you want
    to ensure that your database is consistent according to the business rules defined
    in your model classes.


    We covered validation in Chapter 7, Task B: Validation and Unit Testing, on page
    90. We cover callbacks next.


    # 19.4 Participating in the Monitoring Process


    Active Record controls the life cycle of model objects—it creates them, monitors
    them as they are modified, saves and updates them, and watches as they are destroyed.
    Using callbacks, Active Record lets our code participate in this monitoring process.
    We can write code that gets invoked at any significant event in the life of an
    object. With these callbacks we can perform complex validation, using column values
    as we pass in and out of the database, and even prevent certain operations from
    completing.


    Active Record defines twenty callbacks. Eighteen of them before/after pairs and
    bracket some operation on an Active Record object. For example, the before_destroy
    callback will be invoked just before the destroy method is called, and after_destroy
    will be invoked after. The exceptions are after_find and after_initialize, which
    have no corresponding before_xxx callback. (These two callbacks are generated
    in different ways, too, as we will see later).


    In Figure 19.2, on the next page, we can see how Rails wraps the eighteen paired
    callbacks around the create, update, and destroy operations on model objects.
    Perhaps surprisingly, the before and after validation calls are not strictly needed.'
