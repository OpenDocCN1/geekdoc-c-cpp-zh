    # Chapter 7


    # Task B: Validation and Unit Testing


    At this point, we have an initial model for a product, as well as a complete maintenance
    application for this data provided for us by Rails scaffolding. In this chapter,
    we are going to focus on making the model more bulletproof—as in, making sure
    that errors in the data never get committed to the database—before we proceed
    to other aspects of the Depot application in subsequent chapters.


    # 7.1 Iteration B1: Validating!


    While playing with the results of iteration A1, our client noticed something.
    If she entered an invalid price or forgot to set up a product description, the
    application accepted the form and added a line to the database. Although a missing
    description is embarrassing, a price of $0.00 actually costs her money, so she
    asked that we add validation to the application. No product should be allowed
    in the database if it has an empty title or description field, an invalid URL
    for the image, or an invalid price.


    So, where do we put the validation? The model layer is the gatekeeper between
    the world of code and the database. Nothing to do with our application comes out
    of the database or gets stored into the database that doesn''t first go through
    the model. This makes models an ideal place to put validations; it doesn''t matter
    whether the data comes from a form or from some programmatic manipulation in our
    application. If a model checks before writing to the database, then the database
    will be protected from bad data.


    Let''s look again at the source code of the model class (in app/models/product.rb):


    ```

    class Product < ActiveRecord::Base

    end

    ```'
