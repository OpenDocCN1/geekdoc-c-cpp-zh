    \   <%= sanitize(product.description) %>\n    <div class=\"price\">\n      <span><%=\
    \ number_to_currency(product.price) %></span>\n      <%= button_to \"Add to Cart\"\
    , line_items_path(:product_id => product) %>\n    </div>\n  </div>\n<% end %>\n\
    ```\n\nThere's one more formatting issue, button_to creates an HTML <form>, and\
