  md: "# 14.2 Iteration I2: Authenticating Users\n\nWhat does it mean to add login\
    \ support for administrators of our store?\n\n+   - We need to provide a form\
    \ that allows them to enter their username and password.\n- Once they are logged\
    \ in, we need to record that fact somehow for the rest of their session (until\
    \ they log out).\n- We need to restrict access to the administrative parts of\
    \ the application, allowing only people who are logged in to administer the store.\n\
    \nWe'll need a session controller to support logging in and, and we'll need a\
    \ controller to welcome administrators.\n\n```\ndepot> rails generate controller\
    \ sessions new destroy\ndetot> rails generate controller admin index\n```\n\n\
    The SessionsController#create will need to record something in session to say\
    \ that an administrator is logged in. Let's have to store the id of User object\
    \ using the key :user_id. The code looks like this:\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_202_0.png)\n\
    \n```\ndef create\n  if user = User.authenticate(params[:name], params[:password])\n\
    \    session[:user_id] = user.id\n    redirect_to admin_url\n  else\n    redirect_to\
    \ login_url, alert: \"Invalid user/password combination\"\n  end\n```\n\nWe are\
    \ also doing something new here: using a form that isn't directly associated with\
    \ a model object. To see how that works, let's look at the template for the sessions#new\
    \ action:\n\n![](img/8ef700b628afd52a22f1d4980b1cf82f_202_1.png)\n\n```\n<div\
    \ class=\"depot-form\">\n  <% if flash[:alert] %>\n    <p id=\"notice\"><%= flash[:alert]\
    \ %></p>\n  <% end %>\n\n  <%= form_tag do %>\n    <fieldset>\n      <legend>Please\
    \ Log In</legend>\n      <div>\n        <label for=\"name\">:</label>\n      \
    \  <%= text_field_tag :name, params[:name] %>\n      </div>\n```"
