  md: '# Acknowledgments


    You''d think that producing a new edition of a book would be easy. After all,
    you already have all the text. It''s just a tweak to some code here and a minor
    wording change there, and you''re done. You''d think....


    It''s difficult to tell exactly, but our impression is that creating each edition
    of Agile Web Development with Rails took about as much effort as the first edition.
    Rails is constantly evolving and, as it does, so has this book. Parts of the Depot
    application were rewritten several times, and all of the narrative was updated.
    The emphasis on REST and the avoidance of features as they become deprecated have
    repeatedly changed the structure of the book as was once hot became just lukewarm.


