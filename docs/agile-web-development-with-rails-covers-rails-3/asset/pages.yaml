    To someone new to Ruby, this is a lot of heavy machinery thrown at solving such
    a simple problem. To someone familiar with Ruby, none of this machinery is particularly
    heavy. In any case, Rails makes extensive use of the facilities provided by Ruby
    to make defining operations (for example, migration tasks) as simple and declarative
    as possible. Even small features of the language, such as optional parentheses
    and braces, contribute to the overall readability and ease of authoring.


