  md: '# REDUCING MAINTENANCE WITH LAYOUTS AND PARTIALS


    The stylesheet_link_tag method can also take a parameter named :all, indicating
    that styles in the stylesheet directory are included. Adding :recursive => true
    causes Rails to include all styles in all subdirectories.


    The javascript_include_tag method takes a list of JavaScript (assumed to live
    in public /javascripts) and creates the HTML to load these into a page. In addition
    to :all, javascript_include_tag accepts a parameter as the value :defaults, which
    acts as a shortcut and causes Rails to load the prototype.js, effects.js, dragdrop.js,
    and controls.js, along with application.js if it exists. Use the latter file to
    add your own JavaScript to your application''s pages.


