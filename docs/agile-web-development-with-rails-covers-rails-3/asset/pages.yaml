  md: '# What We Just Did


    Strictly speaking, this chapter exposed you to only one new Rails command:

    rails plugin install. In many cases the need for that command is being subsumed

    by bundler and Gemfile. Although this chapter did cover a few plugins, the

    purpose of this chapter wasn''t to cover any particular plugin in depth but to

    troduce you to some of the capabilities that plugins can provide.


    If we include the gems that we saw in previous chapters, we have seen plug-

    ins that simply add some new features (Active Merchant and Capstrano), also add
    some

    Rake tasks (Asset Packager), add some view helpers (again, Asset Packager), add

    some some methods to model objects (will_paginate), add a new templating lan-

    gauge (Haml), interface to a new database (mysql), and even replace the entire

    client-side scripting framework (jquery-rails).


    If you think about it, there really isn''t all that much a plugin can''t do.'
