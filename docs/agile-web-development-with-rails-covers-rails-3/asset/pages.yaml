    +   - Builder templates use the Builder library to construct XML responses. We
    talk more about Builder in Section 25.1, Generating XML with Builder, on page
    408.


    +   - ERB templates are a mixture of content and embedded Ruby. We are typically
    used to generate HTML pages. We talk more about Erb in Section 25.2, Generating
    HTML with ERB, on page 410.'
