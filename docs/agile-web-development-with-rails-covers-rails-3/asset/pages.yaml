  md: "* save! returns true if the save was successful; it raises an exception otherwise.\n\
    * create returns the Active Record object regardless of whether it was successfully\
    \ saved. You'll need to check the object for validation errors if you want to\
    \ determine whether the data was written.\n* create! returns the Active Record\
    \ object on success; it raises an exception otherwise.\n\nLet's look at this in\
    \ a bit more detail.\n\nPlain old save returns true if the model object is valid\
    \ and can be saved:\n\n```\nif order.save\n  # all OK\nelse\n  # validation failed\n\
    end\n```\n\nIt's up to you to check on each to see that it did what we expected.\
    \ The reason Active Record is so lenient is that it assumes save is called in\
    \ the context of a controller's action method and that the code will be presenting\
    \ any errors back to the end user. For many applications, that's the case.\n\n\
    However, if we need to save a model object in a context where we want to handle\
    \ all errors programmatically, we should use save!. This method raises a RecordInvalid\
    \ exception if the object could not be:\n\n```\nbegin\n  order.save!\n  rescue\
    \ RecordInvalid => error\n  # validation failed\nend\n```\n\n# Deleting Rows\n\
    \nActive Record supports two styles of row deletion. First, it has class-level\
    \ methods, delete and delete_all, that operate on the database level. The delete\
    \ method takes a single id or an array of ids and deletes the corresponding row(s)\
    \ in the underlying table. delete_all deletes rows matching a given condition\
    \ (or all rows if no condition is specified). The return values from both depend\
    \ on the adapter but are typically the number of rows affected. An exception is\
    \ not thrown if the row doesn't exist prior to the call.\n\n```\nOrder.delete([123])\n\
    User.delete([2,3,4,5])\nProduct.delete_all([\"price > ?\", @expensive_price])\n\
    ```\n\nThe various destroy methods are the second form of row deletion provided\
    \ by Active Record. These methods work via Active Record model objects."
