  md: "# 23.5 When Migrations Go Bad\n\nMigrations suffer from one serious problem.\
    \ The underlying DDL statements that update the database schema are not transactional.\
    \ This isn't a failing in Rails—most databases do not support the rolling back\
    \ of create table, after table, and other DDL statements.\n\nLet's look at a migration\
    \ that tries to add two tables to a database:\n\n```\nclass ExampleMigration <\
    \ ActiveRecord::Migration\n  create_table :one do\n    end\n  create_table :two\
    \ do\n    end\n```\n\n```\ndef self.down\n  drop_table :two\n  drop_table :one\n\
    end\n```\n\nIn the normal course of events, the up method adds tables, one and\
    \ two, and the down method removes them.\n\nBut what happens if there's a problem\
    \ creating the second table? We'll end up with a database containing table one\
    \ but not table two. We can fix whatever the problem is in the migration, but\
    \ now we can't apply it—if we try, it will fail because table one already exists.\n\
    \nWe could try to roll the migration back, but that won't work. Because the original\
    \ migration failed, the schema version in the database wasn't updated, so Rails\
    \ won't try to roll it back.\n\nAt this point, you could mess around and manually\
    \ change the schema information and drop table one. It probably isn't worth it.\
    \ Our recommendation in these circumstances is to simply drop the entire database,\
    \ re-create it, and apply migrations to bring it back-to-date. You'll have lost\
    \ nothing, and you'll know you have a consistent schema.\n\nAll this discussion\
    \ suggests that migrations are dangerous to use on production databases. Should\
    \ you run them? We can't say. If you have database administrators in your organization,\
    \ it'll be their call. If it's up to you, you'll have to weigh the risks. But,\
    \ if you decide to go for it, you really must back up your database first. Then,\
    \ you can apply the migrations by going to your application's directory on the\
    \ machine with your production servers and executing this command:\n\n```\ndepot>\
    \ RAILS_ENV=production db:migrate\n```"
