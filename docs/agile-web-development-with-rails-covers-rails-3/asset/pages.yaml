  md: "But if our application has taken to storing data like 'new' in this column,\
    \ the down method will lose it—'new' can't be converted to an integer. If that's\
    \ acceptable, the migration is acceptable as it stands. If, however, we want to\
    \ create a one-way migration—one that cannot be reversed—we'll want to stop the\
    \ down migration from being applied. In this case, Rails provides a special exception\
    \ that we can throw:\n\n```\nclass ChangeOrderStateType < ActiveRecord::Migration\n\
    \  def self.up\n    change_column :orders, :order_type, :string, :null => false\n\
    \  end\n\n  def self.down\n    raise ActiveRecord::IrreversibleMigration\n  end\n\
    ```\n\n# 23.3 Managing Tables\n\nSo far we have been using migrations to manipulate\
    \ the columns in existing tables. Now let's look at creating and dropping tables:\n\
    \n```\nclass CreateOrderHistories < ActiveRecord::Migration\n  def self.up\n \
    \   create_table :order_history do |t|\n      t.integer :order_id, :null => false\n\
    \      t.text :notes\n      t.timestamps\n  end\n\n  def self.down\n    drop_table\
    \ :order_history\n  end\n```\n\ncreate_table takes the name of a table (remember,\
    \ table names are plural) and a block. The block is passed a table definition\
    \ object, which we use to define the columns in the table.\n\nThe calls to the\
    \ value definition methods should look familiar—they're similar to the add_column\
    \ method we used previously except these methods don't take the name of the table\
    \ as the first parameter, and the name of the method itself is the data type desired.\
    \ This reduces repetition.\n\nNote that we don't define the id column for our\
    \ new table. Unless we say otherwise, Rails automatically add a primary key to\
    \ all tables they create. For a deeper discussion of this, see Section 23.3, Primary\
    \ Keys, on page 390."
