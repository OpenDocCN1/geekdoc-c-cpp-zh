    ```

    render(:partial => ''article'',

    :object => @an_article,

    :locals => { :authorized_by => session[:user_name],

    :from_ip => request.remote_ip })

    ```


    # Partials and Collections


    Applications commonly need to display collections of formatted entries. A blog
    might show a series of articles, each with text, author, date, and so on. A store
    might display entries in a catalog, where each has an image, a description, and
    a price.


    The :collection parameter to lets render works in conjunction with the :partial
    parameter. The partial defines the format of an individual entry, and the :collection
    parameter applies this template to each member of the collection. To display a
    list of article objects using our previously defined _article.html.erb partial,
    we could write:


    ```

    <%= render(:partial => "article", :collection => @article_list) %>

    ```


    Inside the partial, the local variable article will be set to the current article
    from the collection. In addition, the variable article_counter will be set to
    the index of the current article in the collection.


    The optional :spacer_template parameter lets you specify a template that will
    be rendered between each element of the collection. For example, a view might
    contain the following:


    ```

    Download l/views/app/views/partial/list.html.erb

    <%= render(:partial => "animal",

    :collection => %{ant bee cat dog elk j,},

    :spacer_template => "spacer") %>

    ```'
