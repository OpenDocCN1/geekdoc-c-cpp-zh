  md: "# 8.4 Iteration C4: Functional Testing of Controllers\n\nNow for the moment\
    \ of truth. Before we focus on writing new tests, we need to determine whether\
    \ we have actually broken anything. Remembering our experience after we added\
    \ validation logic to our model, with some trepidation we run our tests again:\n\
    \n```\ndepot> rake test\n```\n\nThis time, all is well. We added a lot, but we\
    \ didn't break anything. That's a relief, but our work is not yet done; we still\
    \ need tests for what we just added.\n\nThe unit testing of models that we previously\
    \ seemed straightforward enough. We called a method and compared what it returned\
    \ against we expected it to return. But now we are dealing with a server that\
    \ requests and a user viewing responses in a browser. We will need *functional\
    \ tests* that verify the model, view, and controller work together. Never fear,\
    \ Rails makes this easy to.\n\nFirst, let's look at what Rails generated for us:\n\
    \n```\nDownload depot_de/test/functional/store_controller_test.rb\nrequire 'test_helper'\n\
    class StoreControllerTest < ActionController::TestCase\n  test \"should get index\"\
    \ do\n    get :index\n    assert_response :success\nend\n```\n\nThe *should get\
    \ index* test gets the index and asserts that a successful response is expected.\
    \ That certainly seems straightforward forward. That's a reasonable beginning,\
    \ but we also want to verify that the response contains our layout, our product\
    \ information, and our number formatting. Let's see what that looks like code:\n\
    \n```\nDownload depot_de/test/functional/store_controller_test.rb\nrequire 'test_helper'\n\
    class StoreControllerTest < ActionController::TestCase\n  test \"should get index\"\
    \ do\n    get :index\n    assert_response :success\n    assert_select #columns\
    \ #side a', :minimum => 4\n    assert_select #main .entry, 3\n    assert_select\
    \ #h3, 'Programming Ruby 1.9'\n    assert_select #price, /\\$[.\\d]+\\.\\d+/\n\
    end\n```"
