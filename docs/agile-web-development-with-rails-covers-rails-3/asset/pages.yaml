  md: '# A Place for Configuration


    Theconfig directory contains files that configure Rails. In the process of developing-Depot,
    we configured a few routes, configured the database, created an initializer, modified
    some locales, and defined deployment instructions. The rest of the configuration
    was done via Rails conventions.


    Before running your application, Rails loads and executes config/environment.rb
    and config/application.rb. The standard environment that these files set up includes
    the following directories (relative to your application''s base directory) in
    your application''s load path:


    +   * The app/controllers directory and its subdirectories

    * The app/models directory and all of its subdirectories whose names start with
    an underscore or a lowercase letter

    * The vendor directory and the lib contained in each plugin subdirectory

    * The directories app, app/helpers, app/mailers, app/services, and lib


    Each of these directories is added to the load path only if it exists.


    In addition, Rails will load a per environment configuration file. This file lives
    in the environments directory and is where you place configuration options that
    vary depending on the environment.


    This is done because Rails recognizes your needs, as a developer, are very different
    when writing code, testing code, and running code in production. When writing
    code, you want lots of logging, convenient reloading of changed source files,
    in-your-face notification of errors, and so on. In testing, you want a system
    that exists in isolation so you can have repeatable results. In production, your
    system should be tuned for performance, and users should be kept away from errors.


    The switch that dictates the runtime environment is external to your application.
    This means that no application code needs to be changed as you move from development
    to testing to production. In Chapter 16, Task K: Deployment and Production, on
    page 235, you specified the environment on the rake command using a RAILS_ENV
    parameter and to Phusion Passenger using a RailsEnv line in your Apache configuration
    file. When starting WeBrick with the rails server command, use the -e option:


    ```

    depot> rails server -e development

    dep> rails server -e test

    dep> rails server -e production

    ```


    If you have special requirements, for example, if you favor a staging environment,
    you can create your own environments. You''ll need to add a new section to the
    database configuration file and a new file to the config/environments directory.'
