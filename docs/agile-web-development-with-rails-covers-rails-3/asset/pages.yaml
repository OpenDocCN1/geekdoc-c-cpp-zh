    # What We Just Did


    Views are the public face of Rails applications, and we have seen that Rails delivers
    extensive support for what we need to build robust and maintainable user and application
    programming interfaces.


    We started with templates, which Rails provides built-in support for three types:
    erb, builder, and rjs. Templates make it easy for us to provide HTML XML, and
    JavaScript responses to any request. We will discuss another option in Section
    26.3, *Beautifying Our Markup with Haml*, on page 427.


    We do into forms, which are the primary means by which users will interact with
    your application. Along the way, we covered uploading files.


    We continued with helpers, which enable us to factor out complex application logic
    to allow our views to focus on presentation aspects. We explored a number of helpers
    that Rails provides, ranging from simple formatting to hypertext links, which
    are the final way in which users interact with HTML pages.


    We completed our tour of Action View by covering two related ways of factoring
    out large chunks of content for reuse. We use layouts to factor out the outlayers
    of a view and provide a common look and feel. We use partials to factor out common
    inner components, such as a single form or table.


    That covers how a user with a browser will access our Rails application. Next
    up: how we can use caching techniques to reduce or even eliminate the computational
    overhead of rendering a view when the underlying data in the database has not
    changed between requests.'
