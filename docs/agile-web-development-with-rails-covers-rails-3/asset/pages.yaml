  md: "# Using Native SQL\n\nMigrations give you a database-independent way of maintaining\
    \ your application's schema. However, if migrations don't contain the methods\
    \ you need to be able to do what you need to do, you'll need to drop down to database-specific\
    \ code. Rails provides two ways to do this. One is with options arguments to methods\
    \ like add_column. The second is the execute method.\n\nA common example in our\
    \ migrations is the addition of foreign key constraints to a child table.\n\n\
    When you use options or execute, you might well tying your migration to a specific\
    \ database engine, because any SQL you provide in these two locations uses your\
    \ database's native syntax.\n\nAn optional second to the execute method specifies\
    \ a string that will be prepended to log messages produced during the execution\
    \ of this SQL.\n\n# Extending Migrations\n\nIf you look at the line item migration\
    \ in the preceding section, you might wonder about the duplication between the\
    \ two option parameters. It would be nice to abstract the creation of foreign\
    \ key constraints into a helper method.\n\nWe could do this by adding a method\
    \ such as the following to our migration file:\n\n```\ndef self.foreign_key(from_table,\
    \ from_column, to_table)\n  constraint_name = \"#{from_table}_#{to_table}\"\n\n\
    execute %%\n  CREATE TRIGGER #{constraint_name}_insert\n  BEFORE INSERT ON #{from_table}\n\
    \  FOR EACH ROW BEGIN\n    SELECT\n      RAISE(ABORT, \"constraint violation:\
    \ #{constraint_name}\")\n    WHERE\n      (SELECT id FROM #{to_table} WHERE\n\
    \        id = NEW.#{from_column}) IS NULL;\n  END;\n%%%\n\nexecute %%\n  CREATE\
    \ TRIGGER #{constraint_name}_update\n  BEFORE UPDATE ON #{from_table}\n  FOR EACH\
    \ ROW BEGIN\n    SELECT\n      RAISE(ABORT, \"constraint violation: #{constraint_name}\"\
    )\n    WHERE\n      (SELECT id FROM #{to_table} WHERE\n        id = NEW.#{from_column})\
    \ IS NULL;\n  END;\n%%\n```"
  merge: -1
