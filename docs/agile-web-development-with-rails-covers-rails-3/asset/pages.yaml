  md: '# Primary Keys


    Rails assumes every table has a numeric primary key (normally called id) and ensures
    the value of this column is unique for each new row added to a table.


    We will rephrase that.


    Rails really doesn''t work well unless each table has a numeric primary key. It
    is less fussy about the column. So, for your average Rails application, our strong
    advice is to go with the flow and let Rails have its column.


    If you decide to be adventurous, you can start by using a different name for the
    primary key as column (but keeping it as an incrementing integer). By specifying
    :primary_key option on the create_table call:


    ```

    create_table :tickets, :primary_key => :number |t|

    t  text :description

    ```


    ```

    t.timestamps

    ```


    This adds the number column to the table and sets it up as the primary key:


    ```

    $ sqlite db/development.sqlite .schema tickets

    CREATE TABLE tickets ("number" INTEGER PRIMARY KEY AUTOINCREMENT

    NOT NULL, "description" TEXT DEFAULT NULL, "created_at" datetime

    DEFAULT NULL, "updated_at" datetime DEFAULT NULL);

    ```


    The next step in the adventure might be to create a primary key that isn''t an
    integer. Here''s a clue that the Rails developers don''t think this is a good
    idea: migrations don''t let you do this (at least not directly


    # Tables with No Primary Key


    Sometimes we need to define a table that has no primary key. The most common case
    in Rails is for join tables—with two columns where each column is a foreign key
    to another table. To create a join table using migrations, we have to tell Rails
    not to automatically add an id:


    ```

    create_table :authors_books, :id => false |t|

    t  .integer :author_id, :null => false

    t  .integer :book_id, :null => false

    ```


    In this case, you might want to investigate creating one or more indices on this
    table to speed navigation between books and authors.


