  md: '# Upgrading RubyGems on Linux


    There are many different ways to upgrade RubyGems. Unfortunately, depending on
    which version of RubyGems you have installed and what distribution you are running,
    not all of the ways work. Try each of the following- until you find one that works
    for you:


    +   - Using the gem update system:

    - sudo gem update --system

    - Using the gem designed to update troublesome systems:

    sudo gem install rubygems-update

    sudo update_rubygems

    - Using setup.rb, which is provided with rubygems-update:

    sudo gem install rubygems-update

    cd /var/lib/gems/1.8/gems/rubygems-update=

    sudo ruby setup.rb

    - Finally, installing from source:

    wget http://rubyforge.org/frs/download.php/69365/rubygems-1.3.6.tgz

    tar xf rubygems-1.3.6.tgz

    cd rubygems-1.3.6

    sudo ruby setup.rb


    We will install the Rails framework and the SQLite3 database:

    sudo gem install rails

    sudo gem install sqlite3


    On the last command, you will be prompted to select which gem to install for your
    platform. Simply select the latest (topmost) gem that contains the word *ruby*
    in parentheses, and a native extension will be built for you.


    At this time, try the command rails -v. If it can''t find the rails command, you
    may need to add /var/lib/gems/1.8/bin to your PATH environment variable. You can
    do this by adding a line to your .bashrc file:


    ```

    export PATH=$var/lib/gems/1.8/bin:$PATH

    ```


    At this point, we have covered Windows, Mac OS X, and Linux. Instructions at this
    point are common to all three operating systems.


