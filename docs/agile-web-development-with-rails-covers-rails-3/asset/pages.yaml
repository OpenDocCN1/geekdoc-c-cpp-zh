  md: "# Functional testing of controllers\n\nControllers direct the show. They receive\
    \ incoming web requests (typically user input), interact with models to gather\
    \ application state, and then respond by causing the view to display something\
    \ to the user. When we're testing controllers, we're making sure that a given\
    \ request is answered with an appropriate response. We still need models, but\
    \ we have already covered them with unit tests.\n\nThe next level of testing is\
    \ to exercise the flow through our application. In many ways, this is like testing\
    \ one of the stories that our customer gave us when we first started to code the\
    \ application. For example, we might have been told the following: *A user goes\
    \ to the store index page. They select a product, adding it to their cart. They\
    \ check out, filling in their details on the checkout form. When they submit,\
    \ an order is created in the database containing their information, along with\
    \ a single line item corresponding to the product they added to their cart. Once\
    \ the order has been received, an email is sent confirming their purchase.\n\n\
    This is ideal material for an integration test. Integration tests simulate a continuous\
    \ session between one or more virtual users and our application. We can use them\
    \ to send in requests, monitor responses, follow redirects, and so on.\n\nWhen\
    \ you create a model or controller, *Rails creates* the corresponding unit or\
    \ functional tests. Integration tests are not automatically created, but you can\
    \ use a generator to create one.\n\n```\ndepot> rails generate integration_test\
    \ test user_stories\n  invoke test_unit\n  create test/integration/user_stories_test.rb\n\
    ```\n\nNotice that Rails automatically adds _test to the name of the test.\n\n\
    Let's look at the generated file:\n\n```\nrequire 'test_helper'\nclass UserStoriesTest\
    \ < ActionController::IntegrationTest\n  fixtures :all\n\n# Replace this with\
    \ your real tests.\n  test \"the truth\"\n    assert true\n  end\nend\n```\n\n\
    Let's launch straight in and implement the test of our story. Because we'll only\
    \ be testing the purchase of a product, we'll need only our products fixtures."
