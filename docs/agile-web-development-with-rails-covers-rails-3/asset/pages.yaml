    So, far we have been looking at requests and responses in isolation. Rails also
    provides a number of mechanisms that span requests.


    # 2.3 Objects and Operations That Span Requests


    While the bulk of the state persists across requests belongs via Active Record,
    some other bits of state have different life spans and need to be managed differently.
    In the Depot application, knowledge of which cart is the user-cart was stored
    in the database, by sessions. Flash notices were used to communicate simple messages
    as “Can''t delete the last user” to the next request after a redirect. And filters
    were used to extract locate data from the URLs themselves.


    In this section, we will explore each of these mechanisms in turn.


    # Rails Sessions


    A Rails session is a hash-like structure that persists across requests. Unlike
    raw cookies, sessions can hold any objects (as long as those objects can be marshaled),
    which make them ideal for holding state information in web applications. For example,
    in our store application, we used a session to handle the shopping cart object
    between requests. The Cart object could be used in our application like any other
    object. But Rails arranged such that the cart was saved at the end of handling
    each request and, more important, the correct cart for an incoming request was
    restored when Rails started to handle that request. Using sessions, we can pretend
    that our application stays around between requests.


    And that leads to an interesting question: exactly does this data stay around
    requests? One choice is for the server to send it down to the client as a cookie.
    This is the default for Rails 3.0. It places limitations on size and increases
    the bandwidth but that there is less for the server to manage and clean up. Note
    that the contents are cryptographically signed but (by default) unencrypted, which
    means that users can see but not tamper with the contents.'
