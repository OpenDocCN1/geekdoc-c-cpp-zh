- img_proc: true
  md: '# Running Migrations


    Migrations are run using the db:migrate Rake task:


    ```

    depot> rake db:migrate

    ```


    To see what happens next, let''s dive down into the internals of Rails.


    The migration code maintains a table schema_migrations inside every Rails database.
    This table has one column, called version, and it will have one row per successfully
    applied migration.


    When you run db:migrate, the first task looks for the schema_migrations table.
    If it doesn''t exist, it will be created.


    The migration code then looks at all the migration files in db:migrate and skips
    from consideration any that have a version (the leading digits in the filename)
    that is already in the database. Then it proceeds to apply the remainder of the
    migrations, creating a row in the schema_migrations table for each.


    If we were to run migrations again at this point, nothing would happen. Each of
    the version numbers of the migration files would match with a row in the database,
    so there''d be no migrations to apply.


    However, if we subsequently create a new migration file, it will have a version
    number not in the database. This is true even if the version number was before
    one or more of the already applied migrations. This can happen when multiple users
    are using a version control system to store the migration files. If we then run
    migrations, this new migration file—and only this migration file—will be executed.
    This might mean that migrations are out of order, so you might want to take care
    and ensure that these migrations are independent. Or you might want to revert
    your database to a previous state and then apply the migrations in order.


    You can force the database to a specific version by supplying the VERSION=parameter
    to the rake db:migrate:


    ```

    depot> rake db:migrate VERSION=20110211000009

    ```


    If the version you give is greater than all of the migrations that have to be
    applied, these migrations will be applied.


    However, if the version number on the command line is less than one or more versions
    listed in the schema_migrations table, something different happens. Rails looks
    for the migration file whose matches the database version and undoes it. It repeats
    this process until there are no more versions listed in the schema_migrations
    table that exceed the number you specified on the command line. That is, the migrations
    are unapplied in reverse order to take the schema back to the version that you
    specify.'
  merge: -1
  pgno: 380
- img_proc: true
  md: "You can also redo one or more migrations:\n\n```\ndepot> rake db:migrate:redo\
    \ STEP=3\n```\n\nBy default, redo will roll back one migration and rerun it. To\
    \ roll back migrations, pass the STEP=parameter.\n\n# 23.2 Anatomy of a Migration\n\
    \nMigrations are subclasses of the Rails class ActiveRecord::Migration. The class\
    \ you create should contain at least the two class methods up down:\n\n```\nclass\
    \ SomeMeaningfulName < ActiveRecord::Migration\n  def self.up\n    # ...\n  end\n\
    \n  def self.down\n    #\n  end\n```\n\nThe name of the class, after all uppercase\
    \ letters are downcased and preceded by an underscore, must match the portion\
    \ of the filename after the version number. For example, the previous class could\
    \ be found in a file named 2011021100017_some_meaningful_name.rb. No two migrations\
    \ can contain classes with the same name.\n\nThe up method is responsible for\
    \ applying the schema changes for this migration, while the down method undoes\
    \ those changes. Let's make this more concrete. Here is a migration that adds\
    \ an e_mail column to the orders table:\n\n```\nclass AddEmailToOrders < ActiveRecord::Migration\n\
    \  def self.up\n    add_column :orders, :e_mail, :string\n  end\n\n  def self.down\n\
    \    remove_column :orders, :e_mail\n  end\n```\n\nSee how the down method undoes\
    \ the effect of the up method?\n\n# Column Types\n\nThe third parameter to add_column\
    \ specifies the type of the database column. In the previous example, we specified\
    \ that the e_mail column has a type of string. But just what does this mean? Databases\
