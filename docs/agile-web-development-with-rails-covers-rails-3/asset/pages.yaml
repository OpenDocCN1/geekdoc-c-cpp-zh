    # # Important Information

    About Rails Versions


    This book is written for Rails 3.


    The Rails core team is continuing to work on Rails. From time to time, new releases
    may introduce incompatibilities for applications written for prior versions of
    Rails, including the code in this book.


    To run the examples provided in this book, it is important that you install the
    correct version of Rails, as described in Chapter 1, *Installing Rails*, on page
    24


    To determine the version of Rails that you are running, you can issue rails -v
    at a command prompt.


    Information on changes to Rails that affect this book can be found at http://www.prprog.com/wiki/wiki/ChangesToRails.


