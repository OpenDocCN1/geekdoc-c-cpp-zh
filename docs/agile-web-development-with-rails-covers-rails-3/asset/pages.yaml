  md: "In this chapter, we'll see\n\n+   - modifying the schema and existing data.\n\
    - error diagnosis and handling.\n- the flash, and\n- logging.\n\n# # Chapter 10\n\
    \n# # Task E: A Smarter Cart\n\nAlthough we have rudimentary cart functionality\
    \ implemented, we have much to do. To start with, we will need to recognize when\
    \ customers add multiples of the same item to the cart. Once that's done, we will\
    \ also have to make sure that the cart itself can handle error cases and communicate\
    \ problems along the way to the customer or the system administrator, as appropriate.\n\
    \n# ## 10.1 Iteration E1: Creating a Smarter Cart\n\nAssociating a count with\
    \ each product in our cart is going to require us to modify the line_items table.\
    \ We've used migration before in Section 6.1, Applying the Migration, on page\
    \ 79 to update the schema of the database. While that was as part of creating\
    \ the initial scaffolding for a model, the basic approach is the same.\n\n```\n\
    \ depot> rails generate migration add_quantity_to_line_items quantity:integer\n\
    ```\n\nRails can tell from the name of the migration that we are adding one or\
    \ more columns to the line_items table and can pick up the names and data types\
    \ for each column from the last argument. The two patterns that Rails matches\
    \ is add_XXX_to_TABLE and remove_XXX_from_TABLE where the value of XXX is ignored;\
    \ what matters is the list of column names and types that appear after the migration.\n\
    \nThe only thing Rails can't tell is what reasonable default is for this column.\
    \ In many cases, a null value would do, but let's make it the value 1 for existing\
    \ carts by modifying the migration before we apply:\n\n```\n Download depot/db/migrate/202111021000004_add_quantity_to_line_items.rb\n\
    class QuantityToLineItems < ActiveRecord::Migration\n  def self.up\n    add_column\
    \ :line_items, :quantity, :integer, :default => 1\nend\n```\n\nDownload from Wow!\
    \ eBook <www.wowebook.com>"
  merge: -1
