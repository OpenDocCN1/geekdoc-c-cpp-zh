  md: '# Prepping Your Deployment Server


    Although putting your software under version control is a really, really, really
    good idea during development, not putting your software under version control
    when it comes to deployment is downright foolhard—enough so that the soft-ware
    we have selected to manage your deployment, namely Capistrano, all but requires
    it.


    Plenty of software configuration management (SCM) systems are available. Subversion,
    for example, is a particularly good one. But if you haven''t yet chosen one, with
    Git, which is easy to set up and doesn''t require a separate server process. The
    examples that will be based on Git, but if you picked a different SCM system,
    don''t worry. Capistrano doesn''t much care which one you pick, just as long as
    you pick one.


    The first step is to create an empty repository on a machine accessible by your
    deployment servers. In fact, if we have only one deployment server, there is no
    reason that it can''t double duty as your Git. So, log onto that server, and issue
    the following commands:


    ```

    $ mkdir -p ~/git/depot.git

    $ cd ~/git/depot.git

    $ git init

    ```


    The next thing is to be aware that even if the SCM server and our web server are
    the same physical machine, Capistrano will be accessing our SCM software as if
    it were remote. We can make this smoother by generating a public key (if you don''t
    already have one) and then installing it gives permission to access our server:


    ```

    $ test -e ~/.ssh/id_rsa.pub || ssh-keygen -t dsa

    $ cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys2

    ```


    Test by sh ing into your own server. Another thing, this will ensure that your
    known_hosts file is updated.


    While we are here, we should attend to two other things. The first is quite trivial:
    Capistrano will insert a directory named current between your application directory
    and the Rails subdirectories, including the public subdirectory. This means you
    will have to adjust your DocumentRoot in your httpd.conf if you control your server
    or in a control panel for your shared host:


    ```

    DocumentRoot /home/rubys/work/depot/current/public/

    ```


    That''s for the server! From here on, we will be doing everything from your development
    machine.


    # Getting an Application Under Control


    The first thing we are going to do is update our Gemfile to indicate that we are
    using Capistrano.'
