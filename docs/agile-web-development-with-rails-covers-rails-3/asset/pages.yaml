  md: 'The four lines we added take a look *into* the HTML that is returned, using
    CSS selector notation. As a refresher, selectors that start with a number sign
    (#) match on `id` attributes, selectors that start with a dot (.) match class
    attributes, and selectors that contain no prefix at all on element names.


    So, the first test looks for an element `a` that is contained in an element with
    an `id` with a value of `side`, which is contained within an element with an `id`
    with a value of `columns`. This test verifies that there are a minimum of four
    such elements. Pretty powerful stuff, `assert_select`, eh?


    The next three lines verify that all of our products are displayed. The first
    verifies that there are three elements with a class name of `entry` inside the
    main portion of the page. The next line verifies that there is an `h3` element
    with the title of the Ruby book that we had entered previously. The third line
    verifies that the price is formatted correctly. These assertions are based on
    the test data that we have put inside fixtures:


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_113_0.png)


    # Read about fixtures at http://ar.rubyonrails.org/classes/Fixtures.html


    ```

    one:

    title: MyString

    description: MyText

    image_url: MyString

    price: 9.99

    ```


    ```

    two:

    title: MyString

    description: MyText

    image_url: MyString

    price: 9.99

    ```


    ```

    ruby:

    title: Programming Ruby 1.9

    description:

    Ruby is the fastest growing and most exciting dynamic language out there. If you
    need to get working programs delivered fast, you should add Ruby to your toolbox.

    price: 49.50

    image_url: ruby.png

    ```


    If you noticed, the type of test that `assert_select` performs varies based on
    the type of the second parameter. If it is a number, it will be treated as an
    expected result. Another useful type of test is a regular expression, which is
    what we use in our final assertion. We verify that there is a price that has a
    value that contains a dollar sign followed by any number (but at least one), commas,
    or digits; followed by a decimal point; followed by two digits.'
