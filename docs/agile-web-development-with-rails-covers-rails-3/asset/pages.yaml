  md: "Open the newly created cart.rb file in app/models, and add a call to has_many:\n\
    \n```\nclass Cart < ActiveRecord::Base\n  has_many :line_items, :dependent =>\
    \ :destroy\nend\n```\n\nThat has_many :line_items part of the directory is fairly\
    \ self-explanatory; a cart (potentially) has many associated line items. They\
    \ are linked to the cart because each line item contains a reference to its cart's\
    \ id. The :dependent => :destroy part indicates that the existence of line items\
    \ is dependent on the existence of the cart. If we destroy a cart, deleting it\
    \ from the database, we'll want Rails to destroy any line items that are associated\
    \ with that cart.\n\nNext, we will specify links in the opposite direction, the\
    \ row item to the carts and products tables. To do this, we use the belongs_to\
    \ declaration twice in the line_item.rb file:\n\n```\nclass LineItem < ActiveRecord::Base\n\
    \  belongs_to :product\n  belongs_to :cart\nend\n```\n\nbelongs_to tells Rails\
    \ that rows in the line_items table are children of rows in the carts and products\
    \ tables. No line item can exist unless the corresponding cart and product rows\
    \ exist. There's an easy way to remember where to put belongs_to: if a table has\
    \ foreign keys, the corresponding model should have a belongs_to for each.\n\n\
    Just what do these various declarations do? Basically, we add navigation capabilities\
    \ to the model objects. Because we added the belongs_to declaration to Lineitem,\
    \ we can now retrieve its product and display the book's title:\n\n```\nli = LineItem.find(...)\n\
    puts \"This line item is for #{li.product.title}\"\n```\n\nAnd because Cart is\
    \ declared to have many line items, we can reference them (as a collection) from\
    \ a cart object:\n\n```\ncart = Cart.find(...)\nputs \"This cart has #{cart.line_items.count}\
    \ line items\"\n```\n\nNow, for completeness, we should add a has_many directive\
    \ to our Product model. After we have lots of carts, each product might have many\
    \ line items referencing it. This time, we will make use of validation to prevent\
    \ removal of products that are referenced by line items.\n\n```\nclass Product\
    \ < ActiveRecord::Base\n  default_scope => 'title'\n  has_many :line_items\n```"
