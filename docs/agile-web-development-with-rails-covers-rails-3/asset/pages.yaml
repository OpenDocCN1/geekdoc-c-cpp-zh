  md: '# Dynamic Finders


    Probably the most common search performed on databases is to return the row or
    rows where a column matches a given value. A query might return all the orders
    for Dave or get the blog postings with a subject of "Rails Rocks." In other languages
    and frameworks, you construct SQL queries to perform these searches. Active Record
    uses Ruby''s dynamic power to do this for you.


    For example, our Order model has attributes such as name, email, and address.
    We can use these names in finder methods to return rows where the columns match
    value:


    ```

    order = Order.find_by_name("Dave Thomas")

    orders = Order.find_all_by_name("Dave Thomas")

    orders = Order.find_all_class(params[:email])

    ```


    If you invoke a class method where the method name starts with by_, last_by_,
    or find_all_by_, Active Record converts it to a finder, using the rest of the
    method''s name to determine the column to be checked. Then, the call to this:


    order = Order.find_by_name("Dave Thomas")


    (is) effectively converted by Active Record into this:


    order = Order.where(:name => "Dave Thomas").first


    Similarly, calls to find_all_by_xxx and to find_last_by_xxx substitute calls to
    all and last, respectively, for the implicit call to find.


    Appending a bang (!) character to the find_by_ call will cause a ActiveRecord::RecordNotFound
    exception to be raised instead of returning nil if it can''t find a matching record:


    order = Order.find_by_name!("Dave Thomas")


    The magic doesn''t stop. Active Record will also create search on multiple columns.
    For example, you could write this:


    ```

    user = User.find_by_name_and_password(name, pw)

    ```


    This is equivalent to following:


    ```

    user = User.where(:name => name, :password => pw).first

    ```


    To determine the names of the columns to check, Active Record simply splits the
    name that follows the find_by_ or find_all_by_ around the string _and_. This is
    good enough as it breaks down most of the time if you have a column name such
    as tax_and_shipping. In these cases, you''ll have to use other methods to construct
    the query.'
