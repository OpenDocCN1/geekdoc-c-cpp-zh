    \ name. That means there must be some magic happening in the model.\n\n```\nDownload/views/app/models/picture.rb\n\
    ```\n\n```\nclass Picture < ActiveRecord::content_type,\n  validates_format_of\
    \ :with => /\\^image/,\n  message => \"\"- you can only upload pictures\"\n\n\
    def uploaded_picture(picture_field)\n  self.name = base_part_of(picture_field.original_filename)\n\
    \  self.content_type = picture_field.content_type.chomp\n  self.data = picture_field.read\n\
    \ndef base_part_of(file_name)\n  file.basename(file_name).gsub(/\\^\\w\\.\\-_]/,\
    \ '')\nend\n```\n\nWe define an accessor called uploaded_picture= to receive the\
    \ file uploaded by the form. The object returned by the form is an interesting\
    \ hybrid. we can read its contents with the read method; that's how we get the\
