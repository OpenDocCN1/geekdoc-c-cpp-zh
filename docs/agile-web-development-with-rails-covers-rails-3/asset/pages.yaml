    nearly every application, this is the primary place where the creativity of your
    application is expressed. While Active Record and Action View are hardly passive,
    our routes and our controllers are the place where action is.


    We started this chapter by covering the concept of REST, which was the inspiration
    for the way in Rails approaches routing of requests. We saw how this provided
    seven basic actions as a starting point and how to add more actions. We also saw
    how to select a data representation (for example, JSON or XML). And we covered
    how to test routes.


    We then covered the environment that Action Controller provides for your actions,
    as well as the methods it provides for rendering and redirecting. Finally, we
    covered sessions, flash, and filters, each of which is available for use in your
    application''s controllers.


    Along the way, we showed how each of these concepts were used in the Depot application.
    Now that you have seen each in use and have been exposed to the theory behind
    each, how you combine and use these concepts is limited only by your own creativity.


    In the next chapter, we will cover the remaining component of Action Pack, namely,
    Action View, which handles the rendering of results.'
