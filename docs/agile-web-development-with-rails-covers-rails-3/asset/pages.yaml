  md: '# group


    The group method adds a group by clause to the SQL generated by find:


    ```

    summary = LineItem.select("sku", sum(amount) as amount")

    group("sku")

    ```


    # lock


    The lock method takes an optional string as a parameter. If we pass a string,
    it should be a SQL fragment in our database''s syntax that specifies a kind of
    lock. With MySQL, for example, a share mode gives us the latest data in a row
    and guarantees that no one else can alter while we hold the lock. We could write
    code that debits an account only if there are sufficient funds using something
    like the following:


    ```

    Account.transaction do

    ac = Account.where(id:id).lock("LOCK IN SHARE MODE")

    ac.balance -= amount if ac.balance > amount

    ac.save

    ```


    If we don''t specify a string value or we give a lock of true, the database''s
    default exclusive lock is obtained (normally this will be "for update"). We can
    eliminate the need for this kind of locking using transactions (discussed starting
    on page 302).


    Databases can do more than simply find and reliably retrieve, they can also do
    a bit of data reduction analysis. Rails provides access to these methods too.


    # Getting Column Statistics


    Rails has the ability to perform statistics on the values in a column. For example,
    a table of orders, we can calculate the following:


    ```

    average = Order.average(:amount) # average amount of orders

    max = Order.maximum(:amount)

    min = Order.minimum(:amount)

    total = Order.sum(:amount)

    number = Order.count

    ```


    These all correspond to aggregate values in the underlying database, they work
    in a database-independent manner.


    As before, methods can be combined:


    ```

    Order.where("amount > 20").minimum(:amount)

    ```


    These functions aggregate values. By default, they return a single result, producing,
    for example, the minimum order amount for orders meeting some condition. However,
    if you include the group method, the functions instead'
