  md: '# David Says...


    # Picking Good Fixture Names


    Like the names of variables in general, you want to keep the names of fixtures
    as self-explanatory as possible. This increases the readability of the tests when
    you''re asserting that product:valid_order_for_fred is indeed Fred''s valid order.
    It also makes it a lot easier to remember which fixture you''re supposed to test
    against without having to look up it or order4. The more fixtures you get, the
    more important it is to pick good fixture names. So, starting early keeps you
    happy later.


    But what do we do with fixtures that can''t easily get a self-explanatory name
    like valid_order_for_fred? Pick natural names that you have an easier time associating
    to a role. For example, instead of using order1, use christmas_order. Instead
    of customer1, use fred. Once you get into the habit of natural names, you''ll
    be weaving a nice little story about how fred is paying for his christmas_order
    with his invalid_credit_card first, then paying with his valid_credit_card, and
    finally choosing to ship it all off to auntmary.


    Association-based stories are key to remembering large worlds of fixtures with
    ease.


    for a Product model, which is stored in the products table, we''ll add it to the
    file called products.yml.'
