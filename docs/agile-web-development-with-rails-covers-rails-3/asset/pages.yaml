  md: "# ITERATION F2: Creating an AJAX-Based Cart\n\nSo far, we've arranged for the\
    \ browser to send an AJAX request to our application. The next step is to have\
    \ the application return a response. The plan is to create the updated HTML fragment\
    \ that represents the cart and have the browser switch that HTML into the browser's\
    \ internal representation of the structure and content of the document being displayed,\
    \ namely, the Document Object Model (DOM). By manipulating the DOM, we can cause\
    \ the display to change in front of the user's eyes.\n\nThe first change is to\
    \ stop the create action from redirecting to the index page if the request is\
    \ for JavaScript. We do this by adding a call to respond_to telling it we want\
    \ to respond with a format of .js.\n\nThis syntax may seem surprising at first,\
    \ but it is simply a method that can be passing an optional block as an argument.\
    \ Blocks and literals, are described in Section 4.3, page 61. We will cover the\
    \ respond_to method in greater detail on page 315.\n\n```\ndef create\n  @cart\
    \ = current_cart\n  product = Product.find(params[:product_id])\n  @line_item\
    \ = @cart.add_product(product.id)\n\n  respond_to do |format|\n    if @line_item.save\n\
    \      format.html { redirect_to(@store_url) }\n      format.js { render :xml\
    \ => @line_item,\n                 status => :created, location => @line_item\
    \ }\n    else\n      format.html { render :action => \"new\" }\n      format.js\
    \ { render :xml => @line_item.errors,\n                   status => :unprocessable_entity\
    \ }\n    end\n  end\nend\n```\n\n```\nBecause of this change, when create finishes\
    \ handling the Ajax request, Rails will look for a create.template to render.\n\
    \nRails supports JS templates—the JS stands for JavaScript. A .js.rb template\
    \ is a way of getting JavaScript on the browser to do what you want, by writing\
    \ server-side Ruby code. Let's create our first: create.js. It goes in the app/views/line_items/directory,\
    \ like any other view for line items:\n\n```\n```\npage.replace_html('cart', render(@cart))\n\
    ```\n```\n\nLet's analyze that. The page variable is an instance of something\
    \ called a JavaScript generator—a Rails that knows how to create Java-"
