- img_proc: true
  md: 'The first question that springs to mind is, how does the application know what
    to do with the incoming request? A shopping cart application will receive requests
    to display a catalog, add items to a cart, create an order, and so on. How does
    it route these requests to the appropriate code?


    It turns out that Rails provides two ways to define how to route a request: a
    comprehensive way that you will use when you need and a convenient way that you
    will generally use whenever you.


    The comprehensive way lets you define a direct mapping of URLs to actions based
    on pattern matching, requirements, and conditions. The convenient way lets you
    define routes based on resources, such as the models you define. And because the
    convenient way is built on the comprehensive way, you can freely mix and match
    the two approaches.


    In both cases, Rails encodes information in the request URL and uses a system-called
    Action Dispatch to determine what should be done with that request. The actual
    process is very flexible, but at the end of it determines the name of the controller
    that handles this particular request, along with a list of any other request parameters.
    In the process, either of these additional parameters or the HTTP method itself
    is used to identify the action to be invoked in the target controller.


    Rails routes support the mapping between URLs and actions based on the contents
    of the URL and on the HTTP method used to invoke the request. We''ve seen how
    to do this on URL-by-URL using anonymous or named routes. Rails also supports
    a higher-level way of creating groups of related routes. To to understand the
    motivation for this, we need to take a little diversion into the world of Representational
    State Transfer.


    # REST: Representational State Transfer


    The idea behind REST was formalized in Chapter 5 of Roy Fielding''s 2000 PhD dissertation.¹
    In a REST approach, servers communicate with clients using stateless connections.
    All the information about the state of the interaction between the two is encoded
    into the requests and responses between them. Long-term state is kept on the server
    as a well-defined (and severely constrained) set of resource identifiers (URLs
    in our context). REST distinguishes the content of resources from the presentation
    of that content. REST is designed to support highly scalable computing while constraining
    architecture to be decoupled by nature.


    There''s a lot of abstract stuff in this description. What does REST mean in practice?


    +   1. http://www.lcs.uci.edu/~fielding/dissertation/rest_arch_style.htm'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'First, the formalities of RESTful approach mean that network designers know
    when and where they can cache requests to requests. This enables load to be pushed
    out through the network, increasing performance and resilience while reducing
    latency.


    Second, the constraints imposed by REST can lead to easier-to-write (and maintain)
    applications. RESTful applications don''t worry about implementing remotely accessible
    services. Instead, they provide a regular (and simple) interface to a set of resources.
    Your application implements a way of listing, creating, editing, and deleting
    each resource, and your clients do the rest.


    Let''s make this concrete. In REST, we use a simple set of verbs on a rich set
    of nouns. If we''re using HTTP, the verbs correspond to HTTP methods (GET, PUT,
    POST, and DELETE, typically). The nouns are the resources in our application.
    We name those resources using URLs.


    The Depot application that we produced a set of products. There are implicitly
    two resources here. First, there are the individual products. There''s also a
    second resource: the collection of products.


    To fetch list all the products, we could issue an HTTP GET request against this
    collection, say on the path /products. The path fetches the contents of an individual
    resource, we have to identify it. The Rails way would be to give its primary key
    value (that is, its id). Again we issue a GET request, this time against the URL
    /products/.


    To create a new product in our collection we use an HTTP POST request directed
    at the /products path, with the post data containing the product to add. Yes,
    that''s the same path we used to get a list of products. If you issue a GET to
    it, it responds with a, and if you do a POST to it, it adds a new product to the
    collection.


    Take this step further. We''ve already seen you can retrieve the contents of a
    product—you just issue a GET request against the /products/1. To update that product,
    you''d issue an HTTP PUT request against the same URL. And to delete it, you could
    issue an HTTP DELETE request, again using the same URL.


    Take this further. Maybe our system also tracks users. Again, we have a set of
    resources to deal with. REST tells us to use the same set of verbs (GET, POST,
    PUT, and DELETE) against a similar-looking set of URLs (/users, /users/1, ...).


    Now we see from of the power of the constraints imposed by REST. We''re already
    familiar with the Rails way constrains us to structure our applications a certain
    way. Now the REST philosophy allows us to structure interface our applications
    too. Suddenly our world gets simpler.'
