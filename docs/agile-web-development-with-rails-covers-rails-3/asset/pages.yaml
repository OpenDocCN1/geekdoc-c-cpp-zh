  md: '+   Some plugins implement behavior that was previously in the core of Rails
    and has since been moved out. As an example, pagination was originally a core
    function of Rails and was subsequently moved to a plugin named classic_pagination.6
    It has also been replaced by the will_paginate plugin that we used in Section
    12.3, Iteration G3: Pagination, on page 176. Others, like acts_as_tree,7 have
    thrived as plugins. And still others, like rails_xs,8 backport essential functionality
    from future versions of Rails in order to help with management.


    +   Some plugins actually implement significant pieces of application logic and
    user interface. The device9 and authlogic10 plugins implement user authentication
    and session management. We implemented these functions ourselves in Depot, but
    this is generally something we don''t recommend. We''ve found that laziness pays:
    if somebody else has written a plugin for a function that you need to implement,
    that''s all the time that you can spend on your application.


    +   Some plugins replace large portions of Rails. For example, datapper11 replaces
    ActiveRecord. The combination of cucumber,12 rspec,13 and webrat14 can be used
    separately or together to replace test scripts with plain test stories, specifications,
    and browser simulation.


    +   hoptonotifier15 and exception_notification16 will help you monitor errors
    in your deployed servers.


    Of course, this is a small fraction of the plugins that are available. And this
    list is continually growing: there undoubtedly will be many more available by
    the time you read this.


    Finally, you can create your own plugins. Although beyond the scope of this book,
    you can find out more in the Rails Guides17 and documentation.18


