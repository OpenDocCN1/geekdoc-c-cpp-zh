- img_proc: true
  md: "want to keep using InnoDB if you're using MySQL, because this engine gives\
    \ transaction support. You might need transaction support in your application,\
    \ and you'll definitely need it in your tests if you're using the default of transactional\
    \ test fixtures.\n\n# Renaming Tables\n\nIf refactoring leads us to rename variables\
    \ and columns, then it's probably not a surprise we find ourselves renaming tables,\
    \ too. Migrations support the rename_table method:\n\n```\nclass RenameOrderHistories\
