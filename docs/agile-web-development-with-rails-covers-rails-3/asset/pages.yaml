  md: 'The final step is to restart our Apache server:


    ```

    $ sudo apachectl restart

    ```


    You will need to configure your client so that it maps the host name you chose
    to the correct machine. This is done in a file named /etc/hosts. On Windows machines,
    this file can be found in C:\windows\system32\drivers\etc\. To edit this file,
    you will need to open the file as an administrator.


    A typical /etc/hosts line will look like this:


    ```

    127.0.0.1 depot.yourhost.com

    ```


    That''s it! We can now access our application using the host (or virtual host)
    we specified. Unless we used a port number other than 80, there is no longer any
    need for us to specify a port number over our URL.


    There are a few things to be aware of:


    +   * If your server serves you a message that The address or port is invalid,
    this means the NameVirtualHost is already present, perhaps in another configuration
    file in the same directory. If so, remove the line you added because this directive
    needs to be present once.


    +   * If we to run in an environment other than production, we can include a RailsEnv
    directive in each VirtualHost in our Apache configuration: RailsEnv development


    +   * We can restart our application without restarting Apache at any time by
    creating a file restart.txt in the /tmp of our application:


    ```

    $ touch tmp/restart.txt

    ```


    Once the server restarts, this file will be deleted.

    The output of the passenger-install-apache2-module command will tell us where
    we can find additional documentation.


    # Using MySQL for the Database


    The SQLite website is refreshingly when it comes to describing what this database
    is good at and what is not good at. In particular, SQLite is not recommended for
    high-volume, high-concurrency websites with large datasets. And, of course, we
    want our website to be a website.


    There are plenty of alternatives to SQLite, both free and commercial. We will
    go with MySQL. It is already included in OS X, it is available via your native
    packaging tool in Linux, and an installer is provided for Microsoft Windows on
    the MySQL website.


