  md: 'and capture a payment, though this does require you to have a login and password
    with an existing commerce gateway. Once that is set up, you know how to call this
    logic from your controller.


    Just think: all of that was made possible by the addition of a single line to
    your Gemfile.


    As we started at the beginning of this chapter, adding gems to your Gemfile is
    the preferred way to extend Rails 3.0. The advantages of doing so are numerous:
    all of your dependencies are tracked by Bundler, and are all preloaded for immediate
    use by your application, and can be packed for easy deployment.


    At the time of this writing, the instructions for installing ActiveMerchant have
    not been updated on their website: they describe three other ways to install this
    function, depending on the version of Rails you are using. What we have described
    is the method you should use whenever possible.


    Next, we will cover an extension that is not available as a gem.


    # 26.2 Saving Bandwidth with Asset Packager


    Inside your Depot application you now have multiple CSS files. These files are
    not as compact as they possibly be; instead, they are written in a way that makes
    your development and maintenance easier. However, if your site gets significant
    traffic, it might make sense to deliver this same content in fewer requests and
    to have those serve fewer bytes.


    This is the function that the Asset Packager plugin² is not currently available
    as a gem. The primary disadvantages of nongem gems vs. gems is that you don''t
    get any dependency tracking, a way to verify that the plugin is compatible with
    the version of other gems you have installed, or any convenient way to check for
    updates.


    Because this function has no dependencies other than Rails itself, it has no need
    for dependency tracking. Also unlike ActiveMerchant, Asset Packager is not independent
    of Rails; it actually extends Rails functionality, which is why we are covering
    it now.


    To install Asset Packager, use the rails plugin install command:


    ```

    $ rails plugin install git://github.com/sbecker/asset_packager.git

    ```


    This causes files to be placed into your vendor/plugins directory. These files
    can be checked into Git and deployed using Capistrano.


    +   2. http://synthesis.sbecker.net/pages/asset_packager'
  merge: -1
  pgno: 424
- img_proc: true
  md: "# SAVING BANDWIDTH WITH ASSET PACKAGER\n\nWhat the Asset Packager plugin does\
    \ is to add new Rake tasks that you can use. You already know how to list Rake\
    \ tasks, and that is by using the -T\n\n```\n$ rake -T asset\n(in /home/rubys/work/depot)\n\
    rake assetpacker:build_all # Merge and compress assets\nrake assetpacker:create_yml\
    \ # Generate asset_packages.yml from existing assets\nrake assetpacker:delete_all\
    \ # Delete all asset builds\n```\n\nThe first thing you are going to do is to\
    \ create a YAML file. You can build this on your own, but you might as well use\
    \ the task that was provided to accomplish this:\n\n```\n$ rake assetpacker:create_yml\n\
    (in /home/rubys/work/depot)\nconfig/asset_packages.yml example file created!\n\
    ```\n\nPlease reorder files under 'base' so dependencies are loaded in correct\
    \ order.\n\nLet's take a look at the file produced:\n\n```\nDownload depot_v/config/asset_packages.yml\n\
    ---\njavascript:\nbase:\n  - jquery\n  - jquery-ui\n  - application\n  - rails\\\
    stylesheets:\nbase:\n  - scaffold\n  - depot\n```\n\nThe basic idea here is simple:\
    \ list all of the stylesheets and scripts that you wanted and in the order in\
    \ which they are to be placed into the consolidated file. In many cases, the order\
    \ doesn't matter, and the initial order that the asset packager provided for you\
    \ will work just fine for you, so let's move onto the next task: building the\
    \ bundles.\n\n```\n$ rake assetpacker:build_all\n(in /home/rubys/work/depot)\n\
    Created /home/rubys/work/depot/public/javascripts/base_packaged.js\nCreated /home/rubys/work/depot/public/stylesheets/base_packaged.css\n\
    ```\n\nNow, if you take a look at the generated stylesheet, you will see that\
    \ the combined base_packaged.css file is smaller than the depot.css alone. The\
    \ generated stylesheet (and script) can be checked into Git, or you can find instructions\
    \ on how to create a Capistrano recipe for running this at deployment on the asset_packager\
    \ we mentioned earlier."
  merge: -1
  pgno: 425
- img_proc: true
  md: "At this point, while you have a more efficient replacement for your CSS file,\
    \ the original files continue to be used by your layout. This is easy to correct:\n\
    \nDownload depot_v/app/views/layouts/application.html.erb\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Pragmatic Books Online Store</title>\n  <%= stylesheet_link_merged\
    \ :base %>\n  <%= raw javascript_include_merged :base %>\n  <%= csrf_meta_tag\
    \ %>\n</head>\n<!-- ... -->\n```\n\nWhat we did here was to replace the two lines\
    \ that used to call stylesheet_link_tag with a single line that calls stylesheet_link_merged\
    \ and to replace the line that called javascript_include_tag with a line that\
    \ calls javascript_include_merged.\n\nBecause this is a chapter that talks about\
    \ plugins in general instead of focusing on any specific plugin happens to do,\
    \ it is important to point out that stylesheet_link_merged and javascript_link_merged\
    \ are two view helpers that were installed by the plugin.\n\nSo far, we have talked\
    \ about simple additions: a new class, a few tasks, and a couple of view helpers.\
    \ Let's move onto something more significant: something that provides a clear\
    \ alternative to one of the gems that Rails depends on.\n\n#  26.3 Beautifying\
    \ Our Markup with Haml\n\nLet's take a look again at a simple view that we use\
    \ in the Depot application, in this one, that presents our storefront:\n\nDownload\
    \ depot_u/app/views/store/index.html.erb\n\n```\n<% if notice %>\n  <p id=\"notice\"\
    ><%= notice %></p>\n<% end %>\n<h1><%= t('.title.html') %></h1>\n\n<% @products.each\
    \ do |product| %>\n  <div class=\"entry\">\n    <%= image_tag(product.image_url)\
    \ %>\n    <h3><%= product.title %></h3>\n    <%= sanitize(product.description)\
    \ %>\n    <div class=\"price_line\">\n      <span class=\"price\"><%= number_to_currency(product.price)\
    \ %></span>\n      <%= button_to(t('.add_to_cart'), line_items_path(product_id:\
    \ product.id), remote: true) %>\n    </div>\n  </div>\n<% end %>\n```"
