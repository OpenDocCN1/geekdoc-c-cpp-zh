- img_proc: true
  md: "We can use this to invoke our user model directly, having it add a user into\
    \ the database for us:\n\n```\ndepot> rails console\nLoading development environment.\n\
    >> User.create(:name => 'dave', :password => 'secret',\n:password_confirmation\
    \ => 'secret')\n=> #User:09233060 @Attributes={...} ->\n>> User.count\n=> 1\n\
    ```\n\nThe sequences are prompts. After the first, we call the User class to create\
    \ a new user, and after the second, we call it to show that we do indeed have\
    \ a single user in our database. After each command we enter, rails console returns\
    \ the value by the code (in the first case, it's the model object, and in the\
    \ second case, it's the count).\n\nPanic over. We can now log back in the application.\
    \ But how can we stop this from happening again? There are several ways. For example,\
    \ we could write code that prevents you from deleting your user. In theory, A\
    \ could delete B at the same time that B deletes A. Instead, we try a different\
    \ approach. We'll delete the user inside a database transaction. If we've deleted\
    \ the user there are no users left in the database, we will roll back the transaction,\
    \ restoring the user.\n\nTo do this, we'll use an Active Record hook method. The\
    \ validate hook is called by Active Record to validate an object's state. It turns\
    \ out that Active Record defines twenty or so hooks, each called at a particular\
    \ point in an object's life cycle. We'll use the after_destroy hook, called after\
    \ the SQL delete is executed. By this name which is publicly visible, it will\
    \ be conveniently called in the same transaction as the delete, so if it raises\
    \ an exception, the transaction will be rolled back. The hook method works like\
    \ this:\n\n```\ndepot s/app/models/user.rb\nafter_destroy :ensure_an_admin_remains\n\
    \ndef ensure_an_admin_remains\n  if User.count.zero?\n    raise \"Can't delete\
    \ last user\"\nend\n```\n\nThe key concept here is the use of an exception to\
    \ indicate an error when deleting the user. This exception serves two purposes.\
    \ First, because it is raised inside a transaction, it causes an automatic rollback.\
    \ By raising the exception if the users table is empty after the deletion, we\
    \ undo the delete and restore that last user."
