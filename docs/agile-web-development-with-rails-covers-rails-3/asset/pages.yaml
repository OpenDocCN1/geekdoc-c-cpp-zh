    # # Chapter 26


    # # Rails Plugins


    Since the beginning of this book, we''ve talked incessantly about convention over
    configuration that Rails has sensible defaults for just about everything. And
    more recently in the book, we have described Rails in terms of the underlying
    gems that you get when you install Rails. Now it is time to put those two thoughts
    together and reveal that the initial set of gems that Rails provides you is, itself,
    a sensible set of defaults—ones that you can add to and change.


    With Rails 3.0, gems are the primary way in which you plug in new functionality!
    Instead of describing this in the abstract, we will select a few plugins and use
    them to illustrate different aspects of how plugins are installed and what plugins
    can do. The fact that many of these plugins turn out to be immediately useful
    for your day-to-day work is simply a bonus!


    Let''s start with a simple plugin that can literally make you money.


