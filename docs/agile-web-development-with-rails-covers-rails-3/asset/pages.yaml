  md: "```\n<div>\n<label for=\"password\">Password:</label>\n<%= password_field_tag(password,\
    \ params[:password]) %>\n</div>\n<div>\n<%= submit_tag \"Login\" %>\n</div>\n\
    </fieldset>\n<%= end %>\n</div>\n```\n\nThis is different from ones we saw earlier.\
    \ Rather than using form_for, it uses form_tag, which simply builds a rapid HTML\
    \ <form>. Inside that, it uses text_field_tag and password_field_tag, two helpers\
    \ to create HTML <input> tags. Each helper takes two parameters. The first is\
    \ the name of the field, and the second is the value with to populate the field.\
    \ style of form allows us to associate values in the params structure directly\
    \ with form fields—no model object is required. In our case, we chose to use the\
    \ params object directly in the form. An alternative would be to use the controller\
    \ set instance variables.\n\nSee Figure 14.2, on the next page. Note how the the\
    \ form field is communicated between the controller and the view using the params\
    \ hash: the view gets the value to display in the form from params[:name], and\
    \ when the user submits the form, the new value is made available to the controller\
    \ same way.\n\nIf the user successfully logs in, we store the ID of the user in\
    \ the session data. We'll use the presence of that value in the session as a flag\
