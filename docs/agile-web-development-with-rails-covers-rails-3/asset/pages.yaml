  md: "# Iteration E2: HANDLING ERRORS\n\nTypically the flash is used to collect error\
    \ messages. For example, when our show method detects that it was passed an invalid\
    \ cart id, it can store that error message in the flash area and redirect to the\
    \ index action or catalog. The view for the index action can extract the error\
    \ and display it at the top of the catalog page. The flash information is accessible\
    \ within the views by using the flash accessor method.\n\nWouldn't we store the\
    \ error in any old instance variable? Remember that after a redirect is sent by\
    \ our application to the browser, the browser sends a new request back to our\
    \ application. By the time we receive that request, our application has moved\
    \ on—all the instance variables from previous requests are long gone. The flash\
    \ data is stored in the session in order to make it available between requests.\n\
    \nArmed with this background about flash data, we can change our show method to\
    \ intercept bad product ids and report on the problem:\n\n```\ndepot_h/app/controllers/carts_controller.rb\n\
    # GET /carts/1\n# GET /carts/1.xml\ndef show\n  begin\n    @cart = Cart.find(params[:id])\n\
    \  rescue ActiveRecord::RecordNotFound\n    logger.error \"Attempt to access invalid\
    \ cart ##{params[:id]}\"\n    redirect_to :store, notice => 'Invalid cart'\n \
    \ else\n    respond_to do |format|\n      format.html # show.html.erb\n      format.xml\
    \ { render: xml => @cart }\n    end\n  end\nend\n```\n\nThe rescue clause intercepts\
    \ the exception raised by Cart.find. In the handler, we do the following:\n\n\
    +   - The Rails logger to record the error. Every controller has a logger attribute.\
    \ We use it to record a message at the error logging level.\n- Redirect to the\
    \ catalog display using the redirect_to method. The .notice parameter specifies\
    \ a message to be stored in the flash as a notice. Why redirect, rather than just\
    \ display the catalog, here? If we redirect, the user's browser will end up displaying\
    \ the store URL, rather than http://.../cart/wibble. We expose loss of the application\
    \ way. We also prevent the user from triggering the error by hitting the Reload\
    \ button.\n\nWith this code in, we can rerun our customer's problematic query.\
    \ When we enter the following URL:\n\n```\nhttp://localhost:3000/carts/wibble\n\
    ```"
