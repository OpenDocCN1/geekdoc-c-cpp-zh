  md: 'So, now we have a store with a cart with the sidebar. When we click to add
    an item to the cart, the page is redisplayed with an updated cart. However, if
    our catalog lists, that redraw might take a while. It uses bandwidth, and it uses
    server resources. Fortunately, we can use Ajax to make this better.


    # Iteration F2: Creating an Ajax-Based Cart


    Ajax lets us use code that runs in the browser that interacts with our server-based
    application. In our case, we''d like to make the Add to Cart buttons invoke the
    create action on the Items controller in the background. The server can then send
    down the HTML for the cart, and we can replace the cart in the sidebar with the
    developer''s.


    Now, normally we would do this by writing JavaScript in the browser and by writing
    server-side code that communicated with this technology (possibly JavaScript Object
    Notation (JSON)). The news is that, with Rails, all is hidden from us. We can
    do everything we need to do using Ruby (and with a whole lot of support from some
    Rails helper methods).


    The trick when adding Ajax to an application is to take small steps. So, let''s
    start with the most basic one. Let''s change the catalog page to send an Ajax
    request to our server application and handle the response with the HTML fragment
    containing the updated cart.


    On the index page, we''re using button to create the link to the create action.
    We want to change this to an Ajax request instead. To do this, we add :remote
    => true to the call.


    ```

    /views/store/index.html.erb

    <% if notice %>

    <p id="notice"><%= notice %></p>

    <% end %>

    <h1>Your Pragmatic Catalog| %

    <% @products.each do |product| %>

    <div class="entry">

    <%= image_tag(product.image_url) %>

    <h3><%= product.title %></h3>

    <%= sanitize(product.description) %>

    <div class="price-line">

    <%=- "" %>

    <span class="price"><%= number_to_currency(product.price) %></span>

    <%= link_to ''Add to Cart'', line_items_path(:product_id => product), remote:
    true %>

    </div>

    <% end %>

    /</div>

    ```'
