  md: '# Going Further on Rails


    # Crafting Rails Applications


    Rails 3 is a huge step forward. You can now easily extend the framework, change
    its behavior, and replace whole components to bend it to your will, without messy
    hacks. This pioneering book is the first resource that deep dives into the new
    Rails 3 APIs and shows you how to use them to write better applications and make
    your day-to-day work with Rails more productive.


    Crafting Rails Applications: Expert Practices for Everyday Rails

    Jos Valim

    (180 pages) ISBN: 9781934356739, $33.00

    http://proprog.com/titles/jrails


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_452_0.png)


    # Rails Test Prescriptions


    Your comprehensive guide to testing Rails applications, covering both a theoretical
    perspective (why to test) and from a practical perspective (how to test effectively).
    It covers the core Rails testing tools and procedures for Rails 2 and 3, and introduces
    popular add-ons, including RSpec, Shoulda, Cucumber, Factory Girl, and RSpec.


    Rails Test Prescriptions: Keeping Your Application Healthy

    Noel Rappin

    (368 pages) ISBN: 9781934356647, $34.95

    http://proprog.com/titles/nrtest


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_452_1.png)'
  merge: -1
