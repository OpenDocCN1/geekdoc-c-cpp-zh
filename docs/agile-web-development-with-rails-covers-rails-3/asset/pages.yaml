- img_proc: true
  md: '# More Ruby


    # Metaprogramming Ruby


    This book describes metaprogramming as an essential component of Ruby. Once you
    understand the object model, scopes, principles of Ruby, and eigenclasses, you''re
    on your way to applying metaprogramming both in your daily work and fun, after-hours
    projects. Whether you''re a Ruby apprentice on the path to mastering the language
    or a Ruby wiz in search of new tips, this book is for you.


    Metaprogramming Ruby


    Paolo Perrotta


    (240 pages) ISBN: 9781934356470. $32.95

    http://prprog.com/titles/ppmetr


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_453_0.png)


    # Using JRuby


    Ruby has the heart, and Java has the reach. With JRuby, you can bring the best
    of Ruby into the world of Java. Written in 100% Java, JRuby''s expressiveness
    and wide array of open-source libraries make an even better Ruby. With JRuby,
    the entire JRuby core team helps Java developers and Rubyists exploit the interoperability
    of their respective languages. With JRuby, you''ll be surprised at what''s possible.


    Using JRuby: Bringing Ruby to Java


    Charles O Nutter, Thomas Enero, Nick Sieg, Ola Bini, and Ian Lees


    (300 pages) isbn: 978-193435665-4. $84.95

    http://prprog.com/titles/jruby


    ![](img/8ef700b628afd52a22f1d4980b1cf82f_453_1.png)'
