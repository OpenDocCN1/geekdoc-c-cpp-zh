  md: '# Introduction


    Ruby on Rails is a framework that makes it easier to develop, deploy, and maintain
    web applications. During the months that followed its initial release, Rails went
    from being an unknown toy to a worldwide phenomenon, and more important, it has
    become the framework of choice for the implementation of a wide range of so-called
    Web 2.0 applications.


    Why is that?


    # Rails Simply Feels Right


    First, a large number of developers were frustrated with the technologies they
    were using to create web applications. It didn''t seem to matter whether they
    were using Java, PHP, or .NET—there was a growing sense that their job was just
    too damn hard. And then, suddenly, came Rails, and Rails was easier.


    But easy on its own doesn''t cut it. We''re talking about professional developers
    writing real-world websites. They wanted to feel that the applications they were
    developing would stand the test of time—that they were designed and implemented
    using modern, professional techniques. So, developers dug into Rails and discovered
    it wasn''t just a tool for hacking out sets.


    For example, all Rails applications are implemented using the Model-View-Controller
    (MVC) architecture. Java developers are used to frameworks such as Tapestry and
    Struts, but Rails takes MVC further: when you develop in Rails, you start with
    a working application, there''s a place for each piece of code, and all the pieces
    of your application interact in a standard way.


    Professional programmers write tests. And again, Rails delivers. All Rails applications
    have testing support right in. As you add functionality to the code, Rails automatically
    creates test stubs for functionality. The framework makes it easy to test applications,
    and as a result, Rails applications tend to get tested.'
  merge: -1
  pgno: 15
- img_proc: true
  md: "Rails applications are written in Ruby, a modern, object-oriented scripting\
    \ language. Ruby is concise without being unintelligibly terse—you can express\
    \ ideas naturally and cleanly in Ruby code. This leads to programs that are easy\
    \ to write and (just as important) are easy to read months later.\n\nRails takes\
    \ Ruby to the limit, extending it in novel ways that make a programmer's life\
    \ easier. This also allows us to perform tasks that would normally be done in\
    \ external configuration files inside the codebase instead. This makes it far\
    \ easier to see what's happening. The following code defines the model class for\
    \ a project. Don't worry about the details for now. Instead, just think about\
    \ how much information is being expressed in a few lines of code.\n\n```\nclass\
    \ Project < ActiveRecord::Base\n  belongs_to :portfolio\n  has_one :project_manager\n\
    \  has_many :milestones\n  has_many :deliverables, :through => :milestones\n\n\
    \  validates name, :description, :presence => true\n  validates non_disclosure_agreement,\
    \ :acceptance => true\n  validates short_name, :uniqueness => true\n```\n\nTwo\
    \ philosophical underpinnings keep Rails code short and readable: DRY and over\
    \ configuration. DRY stands for *don't repeat yourself*; every piece of knowledge\
    \ in a system should be expressed in just one place. Rails uses the power of Ruby\
    \ to bring to life. In a Rails application: you say what you need to say in one\
    \ place—a place often suggested by the conventions of the MVC architecture—and\
    \ then move on. For programmers to use other web frameworks, where a simple change\
    \ to the schema could involve them in a dozen or more code changes, this was a\
    \ revelation.\n\n*Convention over configuration* is crucial, too. It means Rails\
    \ has sensible defaults for just every aspect of knitting together your application.\
    \ Follow the conventions, and you can write a Rails application using less code\
    \ than a typical Java web application uses in XML. If you need to override Rails\
    \ makes it easy, too.\n\nDevelopers coming to Rails found something else, too.\
    \ Rails isn't catching up with the de facto web standards; it's defining them.\
    \ And Rails makes it easy for developers to integrate features such as Ajax and\
    \ RESTful interfaces into their code, because support is built in. (And if you're\
    \ not familiar with Ajax and REST interfaces, fear not—we'll explain them later\
    \ in the book.)"
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Developers are worried about deployment too. They found that with Rails can
    deploy successive releases of your application to any number of servers with a
    single command (and roll back equally easily should the release prove to be somewhat
    less than perfect).


    Rails was extracted from a real-world, commercial application. It turns out the
    best way to create a framework is to find the central themes in a specific application
    and then bottle them up in a generic function of code. When you''re developing
    your Rails application, you''re starting with half of a really good application
    already in place.


    But there''s something else to Rails—something that''s hard to describe. Somehow,
    it feels right. Of course, you''ll have to take our word for until you write some
    Rails applications for yourself (which should be in the next forty-five minutes
    or so...). That''s what this book is all about.


    # Rails Is Agile


    The title of this book is Agile Web Development with Rails. You may be surprised
    to discover that we don''t have explicit sections on applying agile practices
    X, Y, and Z to Rails coding.


    The reason is both simple and subtle. Agility is the fabric of Rails.


    Let''s look at the values expressed in the Agile Manifesto as a set of four preferences:


    +   * Individuals and interactions over processes and tools

    * Working software over comprehensive documentation

    * Customer collaboration over contract negotiation

    * Responding to change following a plan


    Rails is all about individuals and interactions. There are no heavy toolsets,
    no complex configurations, and no elaborate processes. There are just small groups
    of developers, their favorite editors, and chunks of Ruby code. This leads to
    transparency; what the developers do is reflected immediately in what the customer
    sees. It''s an intrinsically interactive process.


    Rails doesn''t denounce documentation. Rails makes trivially easy to create HTML
    documentation for every codebase. But the Rails development process isn''t driven
    by documents. You won''t find 500-page specifications at the heart of a Rails
    project. Instead, you''ll find a group of users and developers exploring their
    need and the possible ways of answering their need. You''ll find solutions that
    change as both the developers and the users become more experienced with the problems
    they''re trying to solve.


    > 1. http://agilemanifesto.org/. Dave Thomas was one of the authors of this document.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'a framework that delivers working software early in the development cycle.
    This software may be rough around the edges, but it lets the users start to get
    a glimpse of what you''ll be delivering.


    In this way, Rails encourages customer collaboration. When customers see how quickly
    a Rails project can respond to change, they start to trust the team can deliver
    what''s required, not just what has been requested. Confrontations are replaced
    by "What if? sessions.


    That''s all tied to the idea of being able to respond to change. The strong, almost
    obsessive, way that Rails honors the DRY principle means that changes to Rails
    applications import a lot less than the changes would output in other frameworks.
    And since Rails applications are written in Ruby, concepts can be expressed accurately
    and concisely, changes tend to be localized and easy to write. The deep emphasis
    on both unit and functional testing, along with support for test fixtures and
    stubs during testing, gives developers the safety net need when making those changes.
    With a good set of tests in place, changes are less nerve-wracking.


    Rather than constantly trying to tie Rails processes to the agile principles,
    we''ve decided to let the framework speak for itself. As you read through the
    tutorial chapters, try to imagine yourself developing web applications in this
    way: working alongside your customers and jointly determining solutions to problems.
    Then, as you read the more advanced concepts that follow in Part III, see how
    the underlying structure of Rails can enable you to meet your customers'' needs
    faster and with less ceremony.


    One last point about agility and Rails: although it''s probably unprofessional
    to mention this, think how much fun the coding will be.


    # Who This Book Is For


