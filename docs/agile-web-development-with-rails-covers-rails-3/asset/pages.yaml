  md: "# Iteration D3: Adding a Button\n\nWe could connect the button to the line\
    \ item by specifying the URL, but we can let Rails take care of this for us by\
    \ simply appending _path to the controller's name. In this case, we will use line_items_path.\n\
    \nHowever, there's a problem with this: how will the line_items_path method know\
    \ which product add to our cart? We'll need to pass the id of the product corresponding\
    \ to the button. That's enough—all we need to do is add :product_id option to\
    \ the line_items_path call. We can even pass in the product instance itself—Rails\
    \ knows to extract the record in circumstances such as these.\n\nIn all, the one\
    \ line we need to add to index.html.erb looks like this:\n\n```\nDownload depot_f/app/views/store/index.html.erb\n\
    <% if notice %>n  <p id=\"notice\"><%= notice %></p>\n<% end %>\n\n<h1>Your Pragmatic\
