  \ = C * 9/5 + 32\n// 反向公式为：\n// C = (F - 32) * 5/9\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int argc, char*\
  \ pszArgs[])\n{\n    // 输入摄氏度温度\n    double celsius;\n    cout << \"Enter temperature\
  \ in Celsius: \";\n    cin >> celsius;\n\n    // 将摄氏度转换为华氏度\n    double fahrenheit;\n\
  \    fahrenheit = (celsius * 9 / 5) + 32;\n\n    // 输出结果\n    cout << \"Fahrenheit\
  \ is: \" << fahrenheit << endl;\n\n    return 0;\n}\n```\n\n3. **选择 `文件（File）⇒保存（Save）`\
  \ 保存。**\n\n### 捷径\n\n书中的所有程序都在线提供，以及用于构建它们的项目文件。你需要按照此步骤下载它们并安装到你的硬盘上：\n\n![tip.eps](img/tip_fmt.png)\
