  \ 我所说的“局部变量”，是指在函数内部声明的普通变量。C++ 纯洁者实际上称这些为 `自动变量`，以区分它们于静态变量（在第 18 章中讨论）。\n\n幸运的是，小型数组可以在声明时使用初始化列表进行初始化。下面的代码段演示了如何操作：\n\
  \n```cpp\nfloat floatArray[5] = {0.0, 1.0, 2.0, 3.0, 4.0};\n```\n\n这会将 `floatArray[0]`\
  \ 初始化为 0，`floatArray[1]` 初始化为 1.0，`floatArray[2]` 初始化为 2.0，依此类推。\n\n如果初始化列表中的元素数量少于数组的大小，C++\
  \ 会用 0 填充初始化列表。事实上，可以使用空初始化列表来将数组初始化为 0：\n\n```cpp\nint nArray[128] = {}; // 将数组初始化为所有\
  \ 0\n```\n\n初始化常量的数量可以决定数组的大小。例如，你只需要通过数大括号内的值，就可以确定 `floatArray` 有五个元素。C++ 也会数数（这至少是\
  \ C++ 能为自己做的一件事）。\n\n```cpp\nfloat floatArray[] = {0.0, 1.0, 2.0, 3.0, 4.0};\n```\n\
  \n### 访问数组越界\n\n数学家从 1 开始计数数组。大多数编程语言也从偏移量 1 开始。C++ 数组从 0 开始计数。C++ 数组的第一个成员是 `valueArray[0]`。这意味着一个\
  \ 128 整数数组的最后一个元素是 `integerArray[127]`，而不是 `integerArray[128]`。\n\n遗憾对于程序员来说，C++\
  \ 不会检查你使用的索引是否在数组范围内。C++ 非常乐意让你访问 `integerArray[200]`。我们的 `integerArray` 院子只有 128\
  \ 个整数那么长 —— 200 已经进入了别人的院子 72 个整数。无法知道那里住在谁，以及他在那个位置存储了什么。从 `integerArray[200]`\
  \ 读取将返回某个未知且不可预测的值。向该位置写入产生不可预测的结果。它可能什么都不做 —— 那栋房子可能被遗弃，院子未未使用。另一方面，它可能会覆盖某些数据，从而困扰邻居并让程序以一种看似随机的方式运行。或者可能会导致程序崩溃。\n\
  \n![warning.eps](img/warning_fmt.png) 访问数组最常见的错误方法是读取或写入位置 `integerArray[128]`。虽然它只比数组结尾多元素，但读取或写入此位置与使用任何其他错误地址一样危险。\n\
  \n### 基于范围的 for 循环\n\n![c++11_fmt.eps](img/c11_fmt.png) 在某些情况下，你可以使用基于范围的 `for`\
  \ 循环访问数组元素。下面的 `for` 循环将 `nArray` 的所有成员初始化为 0：\n\n```cpp\nint nArray[128];\nfor(int&\
  \ n: nArray)\n{\n    n = 0;\n}\n```\n\n这个 `for` 循环表示将变量 `n` 赋值为 `nArray` 中每个元素的引用。然后通过引用\
  \ `n` 为 `nArray` 中的每个元素分配 0。\n\n![warning.eps](img/warning_fmt.png) 下面的基于范围的 `for`\
  \ 循环没有任何效果：\n\n```cpp\nint nArray[128];\nfor(int n: nArray)\n{\n    n = 0;\n}\n\
  ```\n\n如果没有和符号 (`&`)，`n` 将被赋值为 `nArray` 每个元素的值。然后变量 `n` 会被 0 覆盖，导致 `nArray` 的值保持不变。将此比于第\
  \ 6 章描述的按值传递参数与按引用传递参数。\n\n![tip.eps](img/tip_fmt.png) 基于范围的 `for` 循环只能用于 C++ 在编译时知道数组大小的地方。例如，基于范围的\
  \ `for` 循环在 `displayArray()` 函数内部无法工作。该函数旨在处理任何大小的数组。当你在未知的数组上使用基于范围的 `for` 循环时，你会得到非常奇怪的编译时错误信息。关于这一点我在第\
  \ 26 章会有更多说明。\n\n### 定义和使用数组数组\n\n数组擅长存储数字序列。某些应用需要序列的序列。这种矩阵配置的一个经典例子是电子表格。电子表格像棋盘一样布局，每个元素都有\
  \ `x` 和 `y` 偏移量。\n\nC++ 如下实现矩阵：\n\n```cpp\nint intMatrix[10][5];\n```\n\n这个矩阵在一个维度上有\
  \ 10 个元素，在另一个维度上有 5 个，总共 50 个元素。换句话说，`intMatrix` 是一个 10 元素的数组，每个元素都是一个 5 元素的数组。正如你预期的，一个角是\
  \ `intMatrix[0]`，而另一个角是 `intMatrix[9][4]`。认为 `intMatrix` 在 `x` 维度上长度为 10 个元素还是在\
  \ `y` 维度上，这取决于喜好。矩阵可以像数组一样初始化：\n\n```cpp\nint intMatrix[10][5] = {{1, 2, 3}, {4,\
  \ 5}};\n```\n\n这一行将 `intMatrix[0]` 初始化为 1, 2, 3；并将 `intMatrix[1]` 初始化为 4, 5。\n\n\
  ### 使用字符数组\n\n数组的元素可以是任何类型。`float`、`double` 和 `long` 数组都是可能的；然而，字符数组有特殊的意义。\n\n\
  ### 创建字符数组\n\n人类的单词和句子可以用字符数组表示。下面的程序显示了我的名字：\n\n```cpp\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// 原型声明\nvoid displayCharArray(charArray[],\
  \ int sizeOfArray);\n\nint main(int nNumberArgs, char* pszArgs[])\n{\n    char charName[]={'S',\
  \ 't', 'e', 'h', 'e', 'n'};\n    displayCharArray(charName, 7);\n    cout << \"\
  按回车继续...\" << endl;\n    cin.get();\n    return 0;\n}\n\n// displayCharArray 逐个显示数组\n\
  void displayCharArray(charArray[], int sizeOfArray)\n{\n    for(int i = 0; i< sizeOfArray;\
  \ i++)\n    {\n        cout << charArray[i];\n    }\n}\n```\n\n*(注：由于原文提供的待翻译文本在最后一段代码块中存在严重的语法错误和截断，我遵循“代码块不需要翻译”的原则，保留了其原始样貌，仅翻译了其中的注释。)*\n\
  \n\n\n\n\n```cpp\n{'S', 't', 'e', 'p', 'h', 'e', 'n', '\\0'};\n\n    displayString(charMyName);\n\
  \n    cout << endl;\n\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n    cout << \"Press\
  \ Enter to continue...\" << endl;\n\n    cin.ignore(10, '\\n');\n\n    cin.get();\n\
  \n    return 0;\n}\n\n// displayString - 显示一个字符字符串\n//               一次显示一个字符\n\
  void displayString(char stringArray[])\n{\n    for(int i = 0; stringArray[i] !=\
  \ '\\0'; i++)\n    {\n        cout << stringArray[i];\n    }\n}\n```\n\n`charMyName`\
  \ 的声明定义了一个在末尾带有额外空字符（null character）`\\0` 的字符数组。`displayString` 程序遍历该字符数组，直到遇到空字符为止。\n\
  \n`displayString()` 函数比它的前身函数 `displayCharArray()` 更容易使用，因为不再需要传递字符数组的长度。这种用空字符终止字符数组的“秘密握手”非常方便，以至于贯穿整个\
  \ C++ 语言。C++ 甚至为这种数组赋予了一个特殊的名称。\n\n![remember.eps](img/remember_fmt.png) `字符字符串`是一个以空字符终止的字符数组。它的正式名称是`空终止字节字符串`，或\
  \ `NTBS`。也使用更通用的术语 `C-string` 来将其与 C++ 类型 `string` 区分开来。\n\n选择 `\\0` 作为终止字符并不是随机的。记住，0\
  \ 是唯一可以转换为 `false` 的数值；所有其他值都会转换为 `true`。这意味着 `for` 循环可以（并且通常是）被写成：\n\n```cpp\n\
  for(int i = 0; stringArray[i]; i++)\n```\n\n这种关于空终止字符字符串的整个做法已经深根于 C++ 语言的心理之中，因此\
  \ C++ 使用双引号包围的字符字符串作为自动以 `\\0` 字符终止的字符数组。以下是相同的声明：\n\n```cpp\nchar szMyName[] =\
  \ \"Stephen\";\nchar szAlsoMyName[] = {'S', 't', 'e', 'p', 'h', 'e', 'n', '\\0'};\n\
  ```\n\n这里使用的命名约定完全就是一种约定。C++ 并不在乎。前缀 `sz` 代表 `zero-terminated string`（零终止字符串）。\n\
  \n![remember.eps](img/remember_fmt.png) 字符串 `Stephen` 长度为八字符而不是七个——`n` 之后的空字符是假设存在的。字符串\
  \ `\"\"` 长度为一个字符，仅由空字符组成。\n\n## 使用字符操作字符串\n\n以下 `Concatenate` 程序从键盘输入两个字符串，并将它们合并为一个单字符串：\n\
  \n```cpp\n// Concatenate - 合并两个字符串\n//               中间加一个 \" - \"\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// 原型声明\nvoid\
  \ concatString(char szTarget[], const char szSource[]);\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 读取第一个字符串...\n    char szString1[256];\n    cout <<\
  \ \"Enter string #1:\";\n    cin.getline(szString1, 128);\n\n    // ...现在读取第二个字符串...\n\
  \    char szString2[128];\n    cout << \"Enter string #2:\";\n    cin.getline(szString2,\
  \ 128);\n\n    // ...在第一个字符串上拼接一个 \" - \"\n    concatString(szString1, \" - \");\n\
  \n    // ...现在加上第二个字符串...\n    concatString(szString1, szString2);\n\n    // ...并显示结果\n\
  \    cout << \"\\n\" << szString1 << endl;\n\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n\
  \    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n\n// concatString - 将 szSource 字符串拼接\n//    \
  \           到 szTarget 的末尾\nvoid concatString(char szTarget[], const char szSource[])\n\
  {\n    // 找到第一个字符串的结尾\n    int targetIndex = 0;\n    while(szTarget[targetIndex])\n\
  \    {\n        targetIndex++;\n    }\n    // 将第二个接到第一个后面\n    int sourceIndex =\
  \ 0;\n    while(szSource[sourceIndex])\n    {\n        szTarget[targetIndex] = szSource[sourceIndex];\n\
  \        targetIndex++;\n        sourceIndex++;\n    }\n    // 加上终止空字符\n    szTarget[targetIndex]\
  \ = '\\0';\n}\n```\n\n`Concatenate` 程序读取两个字符字符串并在它们中间加上一个 `\" - \"` 将它们连接在一起。程序从从键盘读取一个字符串开始。程序没有使用普通的\
  \ `cin >> szString1`，原因有两个。首先，`cin >>` 操作在遇到任何类型的空白符时就会停止读取。直到第一个空白符之前的字符会被读取，空白符被丢弃，剩余字符将留在输入缓冲区中供下一个\
  \ `cin >>` 语句使用。因此，如果我输入“the Dog”，`szString2` 将填充为“the”，而单词“Dog”将留在输入缓冲区中。\n\n第二个原因是\
  \ `getline()` 允许程序员指定缓冲区的大小。`getline(szString2, 128)` 不会读取超过 128 个字节。相反，`getline()`\
  \ 会读取整行，直到遇到换行符。\n\n在读取第一个字符串到 `szString1` 之后，程序通过调用 `concatString()` 在末尾拼接 `\"\
  \ - \"`。`concatString()` 函数接受一个目标字符串 `szTarget` 和一个源字符串 `szSource`。该函数通过扫描 `szTarget`\
  \ 来寻找空字符，并将其存储在 `targetIndex` 中。随后函数进入第二个循环，将 `szSource` 中的字符拷贝到 `szTarget`。`concatString()`\
  \ 的最后一个语句在完成的字符串上打上终止空。\n\n程序的示例输出如下：\n\n```\nEnter string #1:this is a string\n\
  Enter string #2:THIS A STRING\nthis is a string - THIS A STRING\nPress Enter to\
  \ continue...\n```\n\n## 添加一些库函数\n\nC++ 程序员经常需要操作零终止字符串。C++ 提供了许多标准字符串处理函数来简化工作。其中一些函数列在表\
  \ 7-1 中。\n\n### 表 7-1 字符串处理函数\n\n| 名称 | 操作 |\n| --- | --- |\n| `int strlen(string)`\
  \ | 返回字符串的字符数（不包括终止空）。 |\n| `char strcpy(target, source)` | 将源字符串拷贝到目标数组。 |\n| `char\
  \ strcat(target, source)` | 将源字符串拼接到目标字符串的末尾。 |\n| `char strncpy(target, source,\
  \ n)` | 从源字符串拷贝最多 `n` 个字符到目标数组。 |\n| `char strncat(target, source, n)` | 将源字符串拼接到目标字符串末尾，或拼接\
  \ `n` 个字符，以先到为准。 |\n| `char strstr(string, pattern)` | 返回 `pattern` 在 `string` 中首次出现的地址。如果未找到\
  \ `pattern` 则返回空。 |\n| `int strcmp(source1, source2)` | 比较两个字符串。如果 `source1` 在字典中于\
  \ `source2` 之前则返回 -1，之后则返回 1。如果两个字符串完全匹配则返回 0。 |\n| `int strncmp(source1, source2,\
  \ n)` | 比较两个字符串的前 `n` 个字符。 |\n\n![tip.eps](img/tip_fmt.png) 在任何使用 `str...` 函数的程序开头，都需要添加\
  \ `#include <cstring>` 语句，因为这个包含文件包含了 C++ 检查你工作时所需的原型声明。\n\n\n\n\n\n[content]\n\n\
  ![warning.eps](img/warning_fmt.png) 对于任何理性的人来说，`str...()` 函数的参数似乎是反过来的（你可能认为这是对“理性”的酸性测试）。例如，`strcat(target,\
  \ source)` 函数将第二个字符串 `source` 接到第一个参数 `target` 的末尾。\n\n`strncpy()` 和 `strncat()`\
  \ 函数与它们的 `strcpy()` 和 `strcat()` 类似，不同在于它们接受目标缓冲区的长度作为参数之一。调用 `strncpy(szTarget,\
  \ szSource, 128)` 的意思是“将 `szSource` 中的字符复制到 `szTarget` 中，直到遇到空字符或复制了 128 个字符，以先者为准”。这避免了无意中写入源字符串数组的末尾。\n\
  \n## 为宽字符留出空间\n\n标准 C++ 库包含了处理宽字符字符串的类似函数。其中几个函数列在表 7-2 中。\n\n### 表 7-2 宽字符串处理函数\n\
  \n| 名称 | 操作 |\n| :--- | :--- |\n| `int wcslen(string)` | 返回字符串中宽字符的数量，不包括终止的空字符。\
  \ |\n| `wchar_t wcscpy(target, source)` | 将源宽字符串拷贝到目标数组。 |\n| `wchar_t wcscat(target,\
  \ source)` | 将源宽字符串接到目标宽字符串的末尾。 |\n| `wchar_t wcsncpy(target, source, n)` | 从源字符串中复制最多\
  \ `n` 个宽宽字符串到目标数组。 |\n| `wchar_t wcsncat(target, source, n)` | 将源字符串接到目标字符串的末尾或最多\
  \ `n` 个字符，以先者为准。 |\n| `wchar_t wcsstr(string, pattern)` | 查找 pattern 在 string 中首次出现的地址。如果未找到\
  \ pattern，则返回空。 |\n| `int wcscmp(source1, source2)` | 比较两个宽字符串。如果 `source1` 在字典序中于\
  \ `source2` 之前，则返回 –1；在之后则返回 1。如果两个字符串完全匹配，则返回 0。 |\n| `int wcsncmp(source1, source2,\
  \ n)` | 比较两个宽字符串中的前 `n` 个宽字符。 |\n\n![remember.eps](img/remember_fmt.png) 记住第 2 章，宽字符用于必须支持外语的应用，在这些应用中，仅仅\
  \ 255 个不同的字符可能是不够。\n\n以下是 `Concatenate` 程序的宽字符版本：\n\n```cpp\n// ConcatenateWide\
  \ - 使用库例程连接两个宽字符串\n//     并在中间插入 \" - \"\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 读取第一个字符串...\n    wchar_t wszString1[260];\n    cout << \"\
  Enter string #1:\";\n    wcin.getline(wszString1, 128);\n    // ...现在是第二个字符串...\n\
  \    wchar_t wszString2[128];\n    cout << \"Enter string #2:\";\n    wcin.getline(wszString2,\
  \ 128);\n    // 现在将第二个接到第一个的末尾\n    // 中间加一个折号\n    wcsncat(wszString1, L\" - \"\
  , 260);\n    wcsncat(wszString1, wszString2, 260);\n    wcout << L\"\\n\" << wszString1\
  \ << endl;\n    // 在程序终止前等待用户准备好\n    // 以允许用户看到程序结果\n    cout << \"Press Enter\
  \ to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
  \ 0;\n}\n```\n\n宽字符字符串程序与其单字节字符字符串亲戚版本相似，但有以下差异：\n\n- 变量声明为 `wchar_t` 而不是 `char`。\n\
  - 常量字符和常量字符串前面带有一个 `L,`，如 `L“This is a wide string”`。\n- 使用 `wcin` 和 `wcout` 代替\
  \ `cin` 和 `cout` 进行输入输出。\n- `wcs …` 函数代替了窄字符的 `str …` 函数。\n\n![warning.eps](img/warning_fmt.png)\
  \ 对于我们大多数在欧洲语言中进行输入输出的人来说，`ConcatenateWide` 的输出与基于 `char` 的 `Concatenate` 程序输出看起来完全相同。编写能够处理具有不同字母和语法规则的多语言程序被称为\
  \ `本地化` (localization)，这超出了初级书籍的范围。\n\n![tip.eps](img/tip_fmt.png) ANSI C++ 包含一种\
  \ `string` 类型，旨在使其更容易操作文本字符串。然而，该类型利用了你尚未看到的语言特性。我将在第 13 章中回到 `string` 类型。\n\n#\
  \ 第 8 章：初探 C++ 指针\n\n### 本章内容\n\n- 指针\n- 指针数组\n- 动态内存\n- 智能指针\n- 智能指针\n- 引用\n\n\n\
  \n\n俗话所说，“人总要有归宿。”每一个 C++ 变量都存储在计算机内存的某个地方。内存被划分为单个字节（byte），每个字节都有自己从 0, 1, 2 等开始编号的地址。\n\
  \n变量 `intReader` 可能位于地址 `0x100`，而 `floatReader` 可能在 `0x180` 处。（按照惯例，内存地址用十六进制表示。）当然，`intReader`\
  \ 和 `floatReader 也可能位于内存中完全不同的地方——只有计算机确切知道，而且只有在程序执行的那一刻才确定。\n\n这与酒店非常相似。当你预订房间时，可能会被分配到\
  \ `0x100` 房。（我知道套房号通常*不是*用十六进制表示的，但请听我说。）你的朋友可能被分配在 80 门外的 `0x180` 房间。每个变量在创建时都会被分配一个地址（关于这一点，在本章之后讨论作用范围时会详细介绍）。\n\
  \n## 地址运算符\n\n表 8-1 显示了两个与指针相关的运算符。`&` 运算符表示“告诉我你的地址”，而 `*` 表示“后续地址处的值”。\n\n表 8-1\
  \ 指针运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `&` (一元) | (在表达式中) ……的地址 |\n| `&` (一元)\
  \ | (在声明中) ……的引用 |\n| `*` (一元) | (在表达式中) ……所指向的内容 |\n| `*` (一元) | (在声明中) 指向……的指针\
  \ |\n\n![warning.eps](img/warning_fmt.png) 这些不要与第 3 和第 4 章讨论过的二进制 `&` 和 `*` 运算符混淆。\n\
  \n以下 `Layout` 程序演示了如何使用 `&` 运算符显示变量在内存中的布局：\n\n```cpp\n// Layout - 此程序试图让\n//  \
  \    读者对其编译器中\n//      局部内存的布局有所了解\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    int  start;\n    int    n; long    l; long long   ll;\n    float  f; double\
  \  d; long double ld;\n    int  end;\n    // 将输出设置为十六进制模式\n    cout.setf(ios::hex);\n\
  \    cout.unsetf(ios::dec);\n    // 输出每个变量的地址\n    // 以了解变量在内存中的\n    // 布局情况\n\
  \    cout << \"--- = \" << &start << endl;\n    cout << \"&n  = \" << &n      <<\
  \ endl;\n    cout << \"&l  = \" << &l      << endl;\n    cout << \"&ll = \" << &ll\
  \    << endl;\n    cout << \"&f  = \" << &f      << endl;\n    cout << \"&d  = \"\
  \ << &d      << endl;\n    cout << \"&ld = \" << &ld     << endl;\n    cout << \"\
  --- = \" << &end    << endl;\n    // 在终止程序前等待用户准备好\n    // 以允许用户查看程序结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n该程序声明了一组不同类型的变量。然后它对每个变量应用 `&` 运算符以找到它们的地址。在 Code::Blocks\
  \ 中运行该程序的执行如下所示：\n\n```text\n--- = 0x28fefc\n&n  = 0x28fef8\n&l  = 0x28fef4\n&ll\
  \ = 0x28fee8\n&f  = 0x28fee4\n&d  = 0x28fed8\n&ld = 0x28ec0\n--- = 0x28febc\nPress\
  \ Enter to continue...\n```\n\n![warning.eps](img/remember_fmt.png) 你的结果可能会有所不同。程序变量的绝对地址取决于许多因素。C++\
  \ 标准并没有规定变量应该如何布局。注意变量 `n` 恰好距离第一个变量 `start` 4 个字节，这对应于 `int` 的大小（4 字节）。同样，变量 `l`\
  \ 出现在其下方 4 个字节处，这也是 `long` 的大小。然而，`float` 变量 `f` 距离其相邻变量 `d` 有 12 个字节（`0x28fee4\
  \ – 0x28fed8 = 0x00c`）。这超过了 `float` 所需的 4 个字节。\n\n![warning.eps](img/warning_fmt.png)\
  \ C++ 编译器并不要求在内存中紧打包。事实上，当你混合不同大小的变量时，你经常可以看到这些间隙。\n\n![tip.eps](img/tip_fmt.png)\
  \ 编译器可以在变量之间存储供自己使用的变量。或者更有可能是变量布局方式的特殊性导致编译器浪费了少量空间。\n\n## 指针变量\n\n`指针变量`是一个包含地址的变量，通常是另一个变量的地址。回到房间号的类比，我可能会告诉我的儿子我会在\
  \ `0x100` 房间。我的儿子可以充当某种指针变量。任何人时候都可以问他：“爸爸在哪里？”有了这个问题，他会毫不犹豫地招出一切。顺便说一下，注意指针变量的一点：无论我儿子在哪里，无论他告诉了多少人，我仍然在\
  \ `0x100` 房间。\n\n以下伪 C++ 代码演示了表 8-1 所示两个地址运算符是如何使用的：\n\n```cpp\nmySon = &DadsRoom;\
  \ // 告诉儿子房间的地址\nroom = *mySon; // “爸爸的房间号是”\n```\n\n以下 C++ 代码段显示了正确使用这些运算符：\n\n\
  ```cpp\nvoid fn()\n{\n    int nVar;\n    int* pnVar;\n    pnVar = &nVar; // pnVar\
  \ 现在指向 nVar\n    pnVar = 10; // 将 10 存储到 int 位置\n} // 被 pnVar 指向\n```\n\n函数 `fn()`\
  \ 开始于声明 `nVar`。下一条语句声明变量 `pnVar` 为指向 `int` 的指针的类型变量。指针变量的声明与普通变量一样，只是多了一元字符 `*`。这个\
  \ `*` 字符可以出现在基本类型名称之间的任何位置——以下两个声明是等价的：\n\n```cpp\nint* pnVar1;\nint *pnVar2;\n\
  ```\n\n使用哪一个取决于个人喜好。\n\n![tip.eps](img/tip_fmt.png) `*` 字符被称为 `asterisk character`（星号字符，这很容易），但因为\
  \ `asterisk` 很难读，很多程序员已经称它为 star（星）或不常用的 `splat character`（喷点字符）。因此，他们会说“star pnVar”或“splat\
  \ pnVar”。在表达式中，一元运算符 `&` 表示“……的地址”。因此，我们将赋值 `pnVar = &nVar` 为“pnVar 获取 nVar 的地址”。\n\
  \n### 使用不同类型的指针\n\n每个表达式都有类型以及值。表达式 `nVar` 的类型是 `int`，`&nVar` 的类型是“指向整数的指针”，写做 `int*`。将此与\
  \ `pVar` 的声明比较，可以看到类型完全匹配：\n\n```cpp\nint* pnVar = &nVar; // 赋值双方\n            \
  \       //都是 int*\n```\n\n同样，因为 `pnVar` 的类型是 `int`，`*pnVar` 的类型是 `int`：\n\n```cpp\n\
  *pnVar = 10; // 赋值双方\n             //都是 int\n```\n\n`pnVar` 所指向的内容的类型是 `int`。这等同于如果\
  \ `houseAddress` 是房子的地址，那么 `houseAddress` 指向的内容必须是一个房子。令人置信，但确实。其他类型变量的指针表达式相同：\n\
  \n```cpp\ndouble doubleVar;\ndouble* pdoubleVar = &doubleVar;\n*pdoubleVar = 10.0;\n\
  ```\n\n在 Pentium 类机器上，指针无论指向什么都占用 4 字节。也就是说，Pentium 上的地址就是 4 字节。\n\n## 将指针传递给函数\n\
  \n指针变量用途之一是向函数传递参数。为了理解为什么这很重要，你需要理解参数是如何传递给函数的。（我在第 6 章中提到过这一点，但现在有了对指针的新理解，你现在更好的条件来理解它。）\n\
  \n### 按值传递\n\n\n\n默认情况下，参数是通过值传递给函数的。这产生了一个有些出乎意料的结果：在函数中修改变量的值通常不会改变调用函数中的该值。考虑以下示例代码段：\n\
  \n```cpp\nvoid fn(int nArg)\n{\n    nArg = 10;\n    // 此时 nArg 的值为 10\n}\n\nvoid\
  \ parent(void)\n{\n    int n1 = 0;\n    fn(n1);\n    // 此时 n1 的值仍然为 0\n}\n```\n\n\
  在这里，`parent()` 函数将整数变量 `n1` 初始化为 0。然后将 `n1` 的值传递给 `fn()`。在进入函数时，`nArg` 等于传递的值 0。`fn()`\
  \ 在返回 `parent()` 之前将 `nArg` 的值改为 10。返回到 `parent()` 后，`n1` 的值仍然是 0。\n\n这种行为的原因是 C++\
  \ 并没有将变量传递给函数（我甚至不确定这意味着什么）。相反，C++ 传递的是调用时变量所包含的值。也就是说，表达式会被求值，即使它只是一个变量名，传递的是它的结果。\n\
  \n在示例中，`n1` 的值（0）被传递给了 `fn()`。函数对该值进行的任何操作对 `n1` 都没有影响。\n\n### 传递指针值\n\n与其他任何内置类型一样，指针也可以作为参数传递给函数：\n\
  \n```cpp\nvoid fn(int* pnArg)\n{\n    *pnArg = 10;\n}\n\nvoid parent(void)\n{\n\
  \    int n = 0;\n    fn(&n);      //传递了 n 的地址\n                // 现在 n 的值为 10\n\
  }\n```\n\n在这种情况下，传递给函数 `fn()` 的 `n` 的地址而不是 `n` 的值。当你考虑 `fn()` 内部的赋值时，这种区别的意义就显而易见了。\n\
  \n假设 `n` 位于地址 `0x100`。调用 `fn(&n)` 传递的是值 `0x100` 而不是 10。在 `fn()` 中，赋值 `pnArg = 10`\
  \ 将 10 存储在位于 `0x100` 处的 `int` 变量中，从而覆盖了值 0。返回到 `parent()` 后，`n` 的值变为 10，因为 `n` 只是\
  \ `0x100` 的另一个名称。\n\n### 引用传递\n\nC++ 提供了一种通过地址传递参数的简写方式——这种简写让你无需处理指针的麻烦。以下声明创建了一个变量\
  \ `n1` 以及指向相同 `n1` 的第二个引用，但使用了新名称 `nRef`：\n\n```cpp\nint n1;               // 声明一个\
  \ int 变量\nint& nRef = n1;      // 声明 n1 的第二个引用\nnRef = 1;             // 现在访问引用\n\
  \                      // 与访问 n1 的效果相同；\n                      // n1 现在等于 1\n```\n\
  \n引用变量如 `nRef` 必须在声明时进行初始化，因为之后每次使用该名称时，C++ 都会认为你指的是 `nRef` 所引的变量。\n\n引用变量的主要应用是在函数调用中：\n\
  \n```cpp\nvoid fn(int& rnArg)// 声明引用参数\n{\n    rnArg = 10;  // 修改 rnArg 所引的变量的值...\n\
  }                     \nvoid parent(void)\n{\n    int n1 = 0;\n    fn(n1);     \
  \ // 传递 n1 的引用\n                // 此时 n1 的值变为 10\n}\n```\n\n这被称为*引用传递*（passing by\
  \ reference）。`int& rnArg` 的声明将 `rnArg` 为整数参数的引用。`fn()` 函数将值 10 存储在 `rnArg` 引用的 int\
  \ 位置中。\n\n![tip.eps](img/tip_fmt.png) 引用传递与传递变量地址相同。引用语法让 C++ 负责对引用应用“取地址”运算符，而不是要求程序员这样做。\n\
  \n![warning.eps](img/warning_fmt.png) 你不能用引用传递等价函数来重载值传递函数。因此，你不能在同一个程序中定义 `fn(int)`\
  \ 和 `fn(int&)` 两个函数。C++ 将不知道该调用哪一个。\n\n## 常量 const 的困扰\n\n`const` 关键字意味着变量一旦声明并初始化就不能被修改。\n\
  \n```cpp\nconst double PI = 3.1415926535;\n```\n\n函数的参数也可以声明为 `const`，这意味着参数在函数内部不能被修改。然而，这在指针变量的情况下引入了一个有趣的二分法。考虑以下声明：\n\
  \n```cpp\nconst int* pInt;\n```\n\n这里的常量究竟是什么？我们不能改变什么？是变量 `pInt` 还是 `pInt` 指向的整数？事实证明两者都是可能的，但此声明声明了一个指向常量内存位置的变量指针。\n\
  \n```cpp\nconst int* pInt;   // 声明指向 const int 的指针\nint nVar;\npInt = &nVar;   \
  \   // 这是允许的\n*pInt = 10;        // 但这是不允许的\n```\n\n我们可以更改 `pInt` 的值，例如将其赋值为 `nVar`\
  \ 的地址。但示例中的最后赋值会产生编译错误，因为我们不能修改 `pInt` 指向的 `const int`。\n\n如果我想创建一个具有常量值的指针变量呢？下面的片段展示了这一点：\n\
  \n```cpp\nint nVar;\nint * const cpInt = &nVar; // 声明一个常量指针\n                  \
  \            // 现在 cpInt 的值是常定的\n```\n\n\n\n\n```\nparent();\n\n}\n```\n\n这段程序片段从变量\
  \ `intGlobal` 的声明开始。该变量从程序开始执行一直到结束都存在。我们说 `intGlobal` 具有“程序作用域（program scope）”。我们还说该变量在调用函数\
  \ `main()`之前就已“进入了作用域”。\n\n`main()` 函数立即调用了 `parent()`。处理器在 `parent()` 中看到的第一个内容是\
  \ `intParent` 的声明。在那个点，`intParent` 进入了作用域——也就是说，`intParent` 被定义并在 `parent()` 函数的剩余执行时间内是可用的。\n\
  \n`parent()` 中的第二个语句是调用 `child()`。再次，函数 `child()` 声明了一个局部变量，这次是 `intChild`。变量 `intChild`\
  \ 的作用域限于函数 `child()`。从技术上讲，`intParent` 并没有在 `child()` 的作用域内定义，因为 `child()` 无法访问\
  \ `intParent`；然而，在 `child()` 执行期间，变量 `intParent` 依然存在。\n\n当 `child()` 退出时，变量 `intChild`\
  \ 离开了作用域。`intChild` 不仅不再可访问，而且不再存在了。（`intChild` 占据的内存被返回到通用池以供其他用途使用。）\n\n随着 `parent()`\
  \ 继续执行，变量 `intLater` 在声明处进入了作用域。当 `parent()` 返回到 `main()` 时，`intParent` 和 `intLater`\
  \ 均离开了作用域。\n\n由于 `intGlobal` 在此例中是全局声明的，它对所有三个函数都是可用的，并在整个生命周期内保持可用。\n\n### 检查作用域问题\n\
  \n以下代码段可以编译通过而不报错，但无法运行（难道你不讨厌这种事情吗？）：\n\n```cpp\ndouble* child(void)\n{\n    double\
  \ dLocalVariable;\n    return &dLocalVariable;\n}\n\nvoid parent(void)\n{\n    double*\
  \ pdLocal;\n    pdLocal = child();\n    *pdLocal = 1.0;\n}\n```\n\n这个函数的问题在于 `dLocalVariable`\
  \ 只定义在函数 `child()` 的作用域内。因此，当 `dLocalVariable` 的内存地址从 `child()` 返回时，它指向的是一个已经不存在的变量。`dLocalVariable`\
  \ 原先占据的内存可能正被其他用途。\n\n![warning.eps](img/warning_fmt.png) 这种错误非常常见，因为可以通过许多方式悄悄出现。遗憾的是，这个错误不会导致程序立即停止。事实上，程序在大多数时候可能运行良好——只要\
  \ `dLocalVariable` 原先占据的内存没有被立即重，程序就能继续工作。这种间歇性问题是最难解决的。\n\n### 使用堆堆内存提供解决方案\n\n\
  作用域问题的产生是因为 C++ 在程序员准备好之前收回了局部定义的内存。我们需要的是一块由程序员控制的内存。她可以在自己需要时分配内存，并在需要时将其归还——而不是因为\
  \ C++ 认为这是一个好主意。这样一个内存块被称为“堆（heap）”。\n\n堆内存使用 `new` 关键字后跟要分配的对象类型来分配。`new` 命令从堆上切出一块足够大以容纳指定类型对象的内存，并返回其地址。例如，以下代码在堆上分配了一个\
  \ `double` 变量：\n\n```cpp\ndouble* child(void)\n{\n    double* pdLocalVariable =\
  \ new double;\n    return pdLocalVariable;\n}\n```\n\n这个函数现在可以正常工作了。虽然变量 `pdLocalVariable`\
  \ 在函数 `child()` 返回时离开了作用域，但 `pdLocalVariable` 所指向的内存并没有离开。`new` 返回的内存位置在显式使用 `delete`\
  \ 关键字将其返回堆之前，都不会离开作用域，而该关键字正是为该目的设计的：\n\n```cpp\nvoid parent(void)\n{\n    // child()\
  \ 返回一块\n    // 堆内存的地址\n    double* pdMyDouble = child();\n    // 在那里存储一个值\n    *pdMyDouble\
  \ = 1.1;\n    // ...\n    // 现在将内存返回给堆\n    delete pdMyDouble;\n    pdMyDouble =\
  \ 0;\n    // ...\n}\n```\n\n这里 `child()` 返回的指针被用于存储一个 `double` 值。在函数完成对内存位置的使用后，它被返回到了堆。`parent()`\
  \ 函数在堆内存返回后将指针设置为 0——这并不是强制要求的，但这是一个非常好的主意。如果程序员错误地尝试在 `delete` 之后向 `pdMyDouble`\
  \ 存储内容，程序将立即崩溃并带有（我希望）一个有意义的错误信息。\n\n你可以使用 `new` 从堆上分配数组，但你必须使用 `delete[]` 关键字返回数组：\n\
  \n```cpp\nint* nArray = new int[10];\nnArray[0] = 0;\ndelete[] nArray;\n```\n\n\n\
  \n\n但询问 4 距离 123 Main Street 有多远或者 123 Main 和 127 Main 的和是多少是没有意义的。同样地，你不能将两个地址相加。你不能对地址进行乘法、除法、平方或开平方运算——你明白我的意思了。你可以执行任何可以转换为加法或减法的操作。例如，如果你对指向\
  \ 123 Main Street 的指针进行递增，它现在将指向隔壁的房子（当然，是在 124 Main！）。\n\n### 结合指针变量重新审数组\n\n现在短暂回到那个完美的数组。考虑一个名为\
  \ `charArray` 的包含 32 个 1 字节字符的数组。如果该数组的第一个字节存储在地址 `0x100`，则数组将从 `0x100` 延伸到 `0x11f`。`charArray[0]`\
  \ 位于地址 `0x100`，`charArray[1]` 位于 `0x101`，`charArray[2]` 位于 `0x102`，以此此类推。\n\n执行以下表达式后\n\
  \n```\nchar* ptr = &charArray[0];\n```\n\n指针 `ptr` 包含地址 `0x100`。指针加上整数偏移量的定义使得表\
  \ 9-2 所示的关系成立的。表 9-2 还证明了为什么给 `ptr` 加上偏移量 `n` 可以计算出 `charArray` 中第 `n` 个元素的地址。\n\
  \n表 9-2 加上偏移量\n\n| 偏移量 | 结果 | 是哪个元素的地址 |\n| :--- | :--- | :--- |\n| + 0 | 0x100\
  \ | `charArray[0]` |\n| + 1 | 0x101 | `charArray[1]` |\n| + 2 | 0x102 | `charArray[2]`\
  \ |\n| … | … | … |\n| + n | 0x100 + n | `charArray[n]` |\n\n给指针加上偏移量与对数组应用索引是等同。\n\
  \n因此，如果\n\n```\nchar* ptr = &charArray[0];\n```\n\n那么\n\n```\n*(ptr + n) ← 对应 →\
  \ charArray[n]\n```\n\n![warning.eps](img/warning_fmt.png) 因为 `*` 的优先级高于加法，`ptr\
  \ + n` 会在 `ptr` 所指向的字符上加上 `n`。需要括号是为了强制让加法在间接引用之前发生。表达式 `(ptr + n)` 获取由指针 `ptr`\
  \ 指向的字符加上偏移量 `n`。\n\n事实上，这两种表达式形式之间的对应关系是如此紧密，以至于 C++ 认为 `array[n]` 仅仅是 `(ptr +\
  \ n)` 的简化版本，其中 `ptr` 指向 `array` 中的第一个元素。\n\n```\narray[n] -- C++ 解释为 → (&array[0]\
  \ + n)\n```\n\n为了完成这种关联，C++ 采取了第二个快捷方法。如果给出\n\n```cpp\nchar charArray[20];\n```\n\
  \n`charArray` 被定义为 `&charArray[0]`。也就是说，不带下标的数组名称就是数组本身的地址。因此，你可以将关联进一步简化为\n\n```cpp\n\
  array[n] -- C++ 解释为 → *(array + n)\n```\n\n![tip.eps](img/tip_fmt.png) `charArray`\
  \ 的类型实际上是 `char const*`；也就是说是“指向字符的常量指针”，因为它的地址不能被改变。\n\n### 对数组地址应用运算符\n\n数组索引与指针算术之间的对应关系是有用的。例如，一个用于显示整数数组内容的\
  \ `displayArray()` 函数可以写如下：\n\n```cpp\n// displayArray - 显示长度为 nSize 的\n//     \
  \          数组的成员\nvoid displayArray(int intArray[], int nSize)\n{\n    cout << \"\
  The value of the array is:\\n\";\n    for(int n = 0; n < nSize; n++)\n    {\n  \
  \      cout << n << \": \" << intArray[n] << \"\\n\";\n    }\n    cout << endl;\n\
  }\n```\n\n这个版本使用了你熟悉的数组操作。相同函数的指针版本如下所示：\n\n```cpp\n// displayArray - 显示长度为 nSize\
  \ 的\n//               数组的成员\nvoid displayArray(int intArray[], int nSize)\n{\n \
  \   cout << \"The value of the array is:\\n\";\n    // 初始化指针 pArray 为\n    // 数组\
  \ intArray 的地址\n    int* pArray = intArray;\n    for(int n = 0; n < nSize; n++,\
  \ pArray++)\n    {\n        cout << n << \": \" << *pArray << \"\\n\";\n    }\n\
  \    cout << endl;\n}\n```\n\n新的 `displayArray()` 开始时创建一个指向整数的指针 `pArray`，它指向 `intArray`\
  \ 的第一个元素。\n\n![remember.eps](img/remember_fmt.png) 名字 `intArray` 本身的类型是 `int**`\
  \ 并引用数组的地址。\n\n函数然后遍历数组的每个元素。在每次循环中，`displayArray()` 在将指针增加到 `intArray` 中的下一个条目之前，输出当前的整数（即\
  \ `pArray` 指向的整数）。可以使用以下版本的 `main()` 来测试 `displayArray()`：\n\n```cpp\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    int array[] = {4, 3, 2, 1};\n    displayArray(array,\
  \ 4);\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  该程序的输出是\n\n```\nThe value of the array is:\n0: 4\n1: 3\n2: 2\n3: 1\nPress Enter\
  \ to continue...\n```\n\n你可能认为这种指针转换很愚蠢；然而，在懂行的 C++ 程序员中，`displayArray()` 的指针版本实际上比数组版本更常见。由于某些原因，C++\
  \ 程序员似乎并不喜欢数组，但热爱指针操作。\n\n使用指针访问数组在访问数组时没有哪里更常见的。\n\n### 将指针操作扩展到字符串\n\n空终止字符串仅仅是一个最后一个字符为零的字符数组。C++\
  \ 使用结尾的空作为终止符。（请参见第 7 章\n{\n    cout << \"Display the string as array: \";\n   \
  \ for(int i = 0; i < 5; i++)\n    {\n        cout << szString[i];\n    }\n    cout\
  \ << endl;\n\n    // 现在使用指针算术\n    cout << \"Display string using a pointer: \"\
  ;\n    const char* pszString = szString;\n    while(*pszString)\n    {\n       \
  \ cout << *pszString;\n        pszString++;\n    }\n    cout << endl;\n\n    //\
  \ 声明一个字符串\n    const char* szString = \"Randy\";\n    cout << \"The array is '\"\
  \ << szString << \"'\" << endl;\n\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n   \
  \ cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    DisplayString(\"Randy\");\n    return 0;\n}\n```\n\n该程序的输出是\n\n```\nDisplay\
  \ the string as array: Randy\nDisplay string using a pointer: Randy\nThe array is\
  \ 'Randy'\nPress Enter to continue...\n```\n\n\n\n\n![tip.eps](img/tip_fmt.png)\
  \ 解引用和递增可以（通常也是）合并为单个表达式，如下：\n\n```cpp\ncout << *pszString++;\n```\n\n程序的输出如下：\n\
  \n```\nThe array is 'Randy'\nDisplay the string as an array: Randy\nDisplay string\
  \ using a pointer: Randy\nPress Enter to continue...\n```\n\n### 证明指针型字符串操作的合理性\n\
  \n基于指针的字符串操作有时具有晦涩的性质，这可能会让读者产生疑问：“为什么？”也就是说，`char**` 指针版本比易于阅读的索引版本有什么优势呢？\n\n\
  答案部分源于历史（或前历史）原因，部分源于人性。当 C 语言（C++ 的祖先）被发明时，编译器非常简单。这些编译器无法执行现代编译器能够执行的复杂优化。对于人类读者来说，这可能看起来很复杂，但像\
  \ `pszString++` 这样的语句，即使由一个愚笨的编译器也能转换为极少数机器级指令。\n\n旧的计算机处理器按今天的标准来看并不快。在 C 语言早期，节省几条计算机指令是一件大事。这使得\
  \ C 语言相比当时的其他语言具有巨大优势，特别是是不提供指针算术的 Fortran。\n\n除了效率因素外，程序员喜欢编写巧妙的程序语句。在 C++ 程序员学习了如何编写紧凑、晦涩但高效的语句后，他们就不会再回到使用索引访问数组了。\n\
  \n![tip.eps](img/tip_fmt.png) 不要为了创建更高效的程序而编写复杂的 C++ 表达式。C++ 语句的数量与生成的机器指令数量之间没有显的联系。\n\
  \n### 对 char 以外的指针类型应用操作符\n\n当 `szTarget` 是 `char` 数组时，要让自己相信 `szTarget + n` 指向\
  \ `szTarget[n]` 并不太难。毕竟，一个 `char` 占用一个字节。如果 `szTarget` 存储在 `0x100`，那么 `szTarget[5]`\
  \ 位于 `0x105`。\n\n指针加法在 `int` 数组上的工作方式完全相同并不显而易见，因为每个 `int` 占用 4 个字节，而每个 `char` 占用\
  \ 1 个字节（至少在 32 位 Intel 处理器上是这样）。如果 `intArray` 中的第一个元素位于 `0x100`，那么 `intArray[5]`\
  \ 将位于 `0x114` `(0x100 + (5 * 4) = 0x114)` 而不是 `0x104`。\n\n幸运的是，无论 `array` 的单个元素有多大，`array\
  \ + n` 都会指向 `array[n]`。C++ 替我们处理了元素的大小——它的聪明之处就在于。\n\n再次，这个“尘封的老房子”类比在这里也适用。（我说的是尘封的比喻，而不是尘封的老房子。）从主路\
  \ 123 号往下第三间房子是 126 号，无论建筑有多大，无论是单层住宅还是豪宅。\n\n### 对比指针与数组\n\n数组和指针之间存在一些差异。首先，数组为数据分配了空间，而指针没有，如下：\n\
  \n```cpp\nvoid arrayVsPointer()\n{\n    // 为 128 个字符分配存储空间\n    char charArray[128];\n\
  \    // 为指针分配空间，但未为\n    // 指向的内容分配空间\n    char* pArray;\n}\n```\n\n这里，`charArray`\
  \ 为 128 个字符分配了空间。`pArray` 仅分配了 4 个字节——指针所需的存储空间。\n\n考虑以下示例：\n\n```cpp\nchar charArray[128];\n\
  charArray[10] = '0'; // 这可以正常工作\n\nchar* pArray;\npArray[10] = '0';    // 这会写入随机位置\n\
  ```\n\n表达式 `pArray[10]` 在语法上等同于 `charArray[10]`，但 `pArray` 未经初始化，因此 `pArray[10]`\
  \ 引用了内存中的某个随机（垃圾）位置。\n\n![tip.eps](img/tip_fmt.png) 使用未初始化的指针变量引用内存的错误通常会在程序执行时被\
  \ CPU 捕获，导致可怕的*段错误（segment violation）* 错误，这种错误偶尔会从你喜爱的应用程序中、在你喜爱的（或不喜欢的）操作系统下出现。这个问题通常不是处理器或操作系统的错，而是应用程序的问题。\n\
  \n![c++11_fmt.eps](img/c11_fmt.png) 这种差异的另一个影响是你可以在大小已知的数组上使用基于范围的 `for` 循环，不能在元素数量未知的指针上使用：\n\
  \n```cpp\nchar charArray[128];\nfor(char& c : charArray) { c = '\\0';} // 初始化数组\n\
  \nchar* pArray = charArray;\nfor(char& c : pArray) {c = '\\0';} // 不合法\n```\n\n\
  第一个范围 `for` 循环可以用于将 `charArray` 初始化为空字符。然而，第二个 `for` 循环无法编译。尽管 `pArray` 被赋值为包含 128\
  \ 个字符的字符数组地址，但 C++ 并没有在指针中保留该大小信息，因此它不知道在范围 `for` 循环中应该迭代到何处。（请参见第 5 章关于范围 `for`\
  \ 循环的描述。）\n\n指针与数组地址之间的第二个区别是 `charArray` 是一个常量，而 `pArray` 不是。因此，以下用于初始化数组 `charArray`\
  \ 的 `for` 循环不起作用：\n\n```cpp\nchar charArray[10];\nfor (int i = 0; i < 10; i++)\n\
  {\n    *charArray = '\\0';    // 这是合理的...\n    charArray++;         // ...这不合理\n\
  }\n```\n\n`charArray++` 表达式的意义并不比 `10++` 大。下面的版本是正确的：\n\n```cpp\nchar charArray[10];\n\
  char* pArray = charArray;\nfor (int i = 0; i < 10; i++)\n{\n    *pArray = '\\0';\n\
  }\n\n```\n\n### 指针何时不是？\n\nC++ 对于什么是合法或不合法的完全保持沉默，但有一个例外。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 实际上，关键字 `nullptr` 是在 2011 标准标准中引入的。在此之前，使用常量 0 来表示空指针。\n\n将指针初始化为 `nullptr`（如果你的编译器不支持\
  \ `nullptr`，则使用 0）是一种安全的做法。在调用 `delete` 之后，你也应该清除指针，以避免删除同一块内存：\n\n```cpp\ndelete\
  \ pHeap;\npHeap = nullptr;\n```\n\n两次向 `delete` 传递同一个地址始终会导致你的程序崩溃。将 `nullptr`（或\
  \ 0）传递给 `delete` 没有影响。\n\n### 声明和使用指针数组\n\n如果指针指向数组，那么反过来似乎也是合理的。指针数组是一种特别感兴趣的类型。\n\
  \n正如数组可以包含其他类型，数组也可以包含指针。以下声明了一个指向 `int` 的指针的数组：\n\n```cpp\nint* pInts[10];\n```\n\
  \n根据前面的声明，`pInts[0]` 是指向 `int` 值的指针。因此，以下是正确的：\n\n```cpp\nvoid fn()\n{\n    int\
  \ n1;\n    int* pInts[3];\n    pInts[0] = &n1;\n    *pInts[0] = 1;\n}\n```\n\n或者：\n\
  \n```cpp\nvoid fn()\n{\n    int n1, n2, n3;\n    int* pInts[3] = {&n1, &n2, &n3};\n\
  \    for (int i = 0; i < 3; i++)\n    {\n        *pInts[i] = 0;\n    }\n}\n```\n\
  \n甚至：\n\n```cpp\nvoid fn()\n{\n    int* pInts[3] = {(new int), (new int), (new int)};\n\
  }\n```\n\n\n\n\n后者在堆外声明了三个 `int` 对象。除非是在字符字符串指针数组的情况下，否则这种声明并不常见。接下来的两个示例展示了为什么字符字符串数组是很有用的。\n\
  \n### 利用字符字符串数组\n\n假设我需要一个函数，能够根据传递给它的整数参数返回相应的月份名称。例如，如果向程序传递 `1`，它将返回指向字符串`“January”`的指针；如果是\
  \ `2`，则报告`“February”`，依此类推。月份 `0` 和任何大于 `12`的数字被认为是非有效的。我可以这样写这个函数：\n\n```cpp\n\
  // int2month() - 返回月份的名称\n\nconst char* int2month(int nMonth)\n{\n    const char*\
  \ pszReturnValue;\n    switch(nMonth)\n    {\n        case 1: pszReturnValue = \"\
  January\";\n                break;\n        case 2: pszReturnValue = \"February\"\
  ;\n                break;\n        case 3: pszReturnValue = \"March\";\n       \
  \         break;\n        // ...依此类推...\n        default: pszReturnValue = \"invalid\"\
  ;\n    }\n    return pszReturnValue;\n}\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ `switch()` 控制命令就像一组 `if` 语句。\n\n一种更优雅的解决方案是将月份的整数值作为索引，进入一个指向月份名称指针数组。在使用时，它的形式如下：\n\
  \n```cpp\n// 定义一个包含月份名称的数组\nconst char *const pszMonths[] = {\"invalid\",\n    \
  \                           \"January\",\n                               \"February\"\
  ,\n                               \"March\",\n                               \"\
  April\",\n                               \"May\",\n                            \
  \   \"June\",\n                               \"July\",\n                      \
  \         \"August\",\n                               \"September\",\n         \
  \                      \"October\",\n                               \"November\"\
  ,\n                               \"December\"};\n```\n\n```cpp\n// int2month()\
  \ - 返回月份的名称\nconst char* int2month(int nMonth)\n{\n    // 首先检查值是否超出范围\n    if (nMonth\
  \ < 1 || nMonth > 12)\n    {\n        return \"invalid\";\n    }\n    // nMonth\
  \ 是效的 - 返回月份名称\n    return pszMonths[nMonth];\n}\n```\n\n`int2month()` 首先检查 `nMonth`\
  \ 是否为 `1` 到 `12` 之间的数字（在上一个示例中，`switch` 语句的 `default` 子句处理了这一点）。如果 `nMonth` 有效，函数将其作为包含月份名称数组的偏移量。\n\
  \n![tip.eps](img/tip_fmt.png) 这种通过索引引用字符字符串的技术在编写可在不同语言运行的程序时特别有用。例如，程序可以声明一个指向不同语言的儒略月份指针的数组\
  \ `ptrMonths`。程序在执行时会将 `ptrMonth` 初始化为相应的名称，它们可以是英语、法语或德语（例如）。这样，`ptrMonth[1]` 就指向第一个儒略月份的正确名称，无论语言如何。一个演示\
  \ `int2Month()` 的程序包含在额外的 `www.dummies.com/extras/cplusplus` 中，命名为 `DisplayMonths`。\n\
  \n### 访问 main 的参数\n\n现在可以揭开真相了——我们模板中 `main()` 的那些参数声明到底是什么？`main()` 的第二个参数是一个指向空终止字符字符串的指针数组。这些字符串包含了程序的参数。程序的参数是在当你启动程序时出现在程序名后的字符串。这些参数也被称为\
  \ `parameters`（参数）。`main()` 的第一个参数是传递给程序的参数数量。例如，假设我在命令行提示符输入了以下命令：`MyProgram file.txt\
  \ /w`。操作系统执行文件 `MyProgram` 中的程序（在 Windows 机器上为 `MyProgram.exe`），并向其传递参数 `file.txt`\
  \ 和 `/w`。考虑以下简单的程序：\n\n```cpp\n// PrintArgs - 将程序的参数写入标准输出\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 打印一个横幅\n    cout << \"The to \" <<\
  \ pszArgs[0] << \" are:\\n\";\n    // 现在写入剩余参数\n    for (int i = 1; i < nNumberofArgs;\
  \ i++)\n    {\n        cout << i << \":\" << pszArgs[i] << \"\\n\";\n    }\n   \
  \ // 就这样\n    cout << \"That's it\" << endl;\n    // 在程序终止前等待用户准备好\n    cout <<\
  \ \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n如既往，`main()` 函数接受两个参数。第一个参数是一个我一直称之为（事实证明很有描述性）`nNumberofArgs`\
  \ 的 `int`。这个变量是传递给程序的参数数量。第二个参数是一个 `char` 类型的指针数组，我一直称之为 `pszArgs`。\n\n#### 以 DOS\
  \ 风格访问程序参数\n\n如果我在命令行窗口通过 `PrintArgs arg1 arg2 arg3 /w` 执行 `PrintArgs` 程序，那么 `nArgs`\
  \ 将是 5（每个参数一个）。第一个参数是程序本身的名称。它可以是从简单的 `“PrintArgs”` 到稍微复杂的 `“PrintArgs.exe”`，再到完整路径——C++\
  \ 标准并没有规定这一点。如果环境无法访问程序名称，它甚至可以提供一个空字符串 `“ ”`。`pszArgs` 中的剩余元素指向程序参数。例如，元素 `pszArgs[1]`\
  \ 指向“arg1”`，`pszArgs[2]` 指向`“arg2”`。因为 Windows 不认为 `“/w”` 有任何特殊意义，这个字符串也被作为参数传递程序处理。\n\
  \n![tip.eps](img/tip_fmt.png) 实际上，C++ 还包含一个最后一个值。数组中的最后一个值（在程序最后一个参数指针之后）包含 `nullptr`。\n\
  \n为了演示参数传递的工作原理，你需要在 Code::Blocks 内部构建程序，然后直接从命令行运行该程序。首先，确保 Code::Blocks 有一个可执行文件，只需打开\
  \ `PrintArgs` 项目并选择 `Build⇒Rebuild`。接下来，打开命令行提示符窗口。如果你运行的是 Unix 或 Linux，你已经在那里了。如果你运行的是\
  \ Windows，选择 `Programs⇒Accessories⇒Command Prompt` 打开一个 80 字符宽的命令行提示符窗口。现在你需要使用\
  \ `CD` 命令导航到 Code::Blocks 放置 `PrintArgs` 程序的目录。如果你在安装 Code::Blocks 时使用了默认设置，该目录将是\
  \ `C:\\CPP_Programs_from_Book\\Chap09\\PrintArgs\\bin\\Debug`。\n\n你现在可以通过输入程序名称后跟你的参数来执行程序。以下显示了我在\
  \ Windows 7 中这样做发生的情况：\n\n```\nC:\\Users\\Randy>cd \\cpp_programs_from_book\\chap09\\\
  printargs\\bin\\debug\nC:\\CPP_Programs_from_book\\Chap09\\PrintArgs\\bin\\Debug>PrintArgs\
  \ arg1 arg2 arg3 /n\nThe arguments to PrintArgs are:\n1:arg1\n2:arg2\n3:arg3\n4:/n\n\
  That's it\nPress Enter to continue...\n```\n\n通配符（如 `**.`）在传递给程序之前可能会展开，也可能不展开——标准对此点是沉默的。Code::Blocks/gcc\
  \ 编译器在 Windows 上确实会执行这种扩展，如下例所示：\n\n```\nC:\\CPP_Programs_from_book\\Chap09\\PrintArgs>bin\\\
  debug\\PrintArgs *.*\nThe arguments to bin\\debug\\PrintArgs are:\n1:bin\n2:main.cpp\n\
  3:obj\n4:PrintArgs.cbp\n```\n\n通配符扩展在所有形式的 Linux 以及 Macintosh 上都会进行。\n\n\n\n\n\n\
  ### 以 Code::Blocks 风格访问程序参数\n\n当你从 Code::Blocks 执行程序时，也可以为程序添加参数。在 Code::Blocks\
  \ 内部，选择 `Project⇒Set programs' arguments`。在 `Program arguments` 窗口中输入你想要的命令行。\n\n\
  ### 以 Windows 风格访问程序参数\n\nWindows 同样通过参数作为与你的程序通信的手段。尝试以下实验：像往常一样构建你的程序。使用 Windows\
  \ 资源管理器找到可执行文件。（如前所述，`PrintArgs` 程序的默认位置为 `C:\\CPP_Programs_from_book\\Chap09\\\
  PrintArgs\\bin\\Debug`。）现在，取一个文件并将其拖到文件名上。（选择哪个文件无所谓，因为程序并不会损坏它。）砰！`PrintArgs` 程序直接启动了，你拖到程序上的文件名就会显示出来。\n\
  \n现在再次尝试，但一次性拖入多个文件。按住 `Ctrl` 键同时选择多个文件名，或使用 `Shift` 键选择一组。现在将这些文件全部拖到 `PrintArgs.exe`\
  \ 并松手。每个文件的名称将作为输出出现。\n\n我将我的 `\\Program Files\\WinZip` 文件夹中的几个文件拖到了 PrintArgs 上作为示例：\n\
  \n`C:\\CPP_Programs_from_book\\Chap09\\PrintArgs\\bin\\Debug\\PrintArgs.exe` 的参数为：\n\
  \n1:C:\\Program Files\\WinZip\\VENDOR.TXT\n2:C:\\Program Files\\WinZip\\WHATSNEW.TXT\n\
  3:C:\\Program Files\\WinZip\\WINZIP.CHM\n4:C:\\Program Files\\WinZip\\WINZIP.TXT\n\
  5:C:\\Program Files\\WinZip\\WINZIP32.EXE\n6:C:\\Program Files\\WinZip\\WZ.COM\n\
  \n就是这些\n\n按回车键继续...\n\n注意，每个文件的名称作为一个单独的参数出现，即使文件名可能包含空格。还要注意，Windows 传递的是文件的完整路径。\n\
  \n# 第 10 章\n\n# C++ 预处理器\n\n## 本章\n\n- ![arrow](img/arrow.png) 包含源文件\n- ![arrow](img/arrow.png)\
  \ 定义常量和宏\n- ![arrow](img/arrow.png) 枚举常量的替代方案\n- ![arrow](img/arrow.png) 插入编译时检查\n\
  - ![arrow](img/arrow.png) 通过 `typedef` 简化声明\n\n你原以为你只需要学习 C++。事实证明，C++ 包含一个预处理器，它在“真正的\
  \ C++ 编译器”看到你的源文件之前就会对其进行处理。遗憾的是，预处理器的语法与 C++ 本身完全不同。\n\n然而，在你绝望之前，让我赶紧补充一下：预处理器非常基础，而且\
  \ C++'11 标准已经增加了许多特性，使得预处理器变得几乎不再必要。尽管如此，如果你在下次“咖啡俱乐部”会议中谈到 C++，你仍会被要求理解预处理器。\n\n\
  ## 什么是预处理器？\n\n到目前，你可能认为 C++ 编译器是一次性吃掉你的源代码并吐出可执行程序，但事实并非完全如此。\n\n首先，预处理器会对你的程序进行一次扫描，寻找预处理器指令。预处理步骤的输出是一个中间文件，其中所有的预处理器命令都已展开。这个中间文件被传递给\
  \ C++ 编译器进行处理。C++ 编译器的输出是一个对象文件，它包含了与你的 C++ 源代码等效的机器指令。在最后一步，一个名为链接器（linker）的独立程序会将一组标准库与你的对象文件（或文件，我们将在第\
  \ 21 章中看到）相结合，创建一个可执行程序。（本章下一节将详细介绍标准库。）\n\n![tip.eps](img/tip_fmt.png) 对象文件通常带有\
  \ `.o` 扩展名。Windows 下的可执行程序带有 `.exe` 扩展名，而在 Linux 或 Mac OS X 下没有扩展名。Code::Blocks\
  \ 将对象和可执行文件存储在自己的文件夹中。例如，如果你已经构建了第 2 章中的 `IntAverage` 程序，你的硬盘上会有 `C:\\CPP_Programs*_from_book*\\\
  IntAverage\\obj\\Debug` 文件夹（包含 `main.o`）和 `C:\\CPP_Programs*_from_book*\\IntAverage\\\
  bin\\Debug` 文件夹（包含可执行程序）。\n\n所有预处理器命令都以第 1 列的 `#` 符号开头，并以换行符结束。\n\n![warning.eps](img/warning_fmt.png)\
  \ 与 C++ 中几乎所有的规则一样，这条规则也有例外。你可以通过用反斜杠字符 `\\` 结束行来将一个预处理器命令跨越多行。不过，我们不会有那么复杂的预处理器命令。\n\
  \n在书中，我们将使用三个预处理器命令：\n\n- `#include` 将指定文件的内容替换为 `#include` 语句。\n- `#define` 定义常量或宏。\n\
  - `#if` 如果后续条件为真，则在中间文件中包含一段代码。\n\n这些预处理器命令中的每一个都将在后续章节中介绍。\n\n## 包含文件\n\nC++ 标准库由足够简单的函数组成，几乎每个人都需要它们。强迫每个程序员都自己编写这些函数是愚蠢的。例如，我们从键盘输入并输出到控制台的\
  \ I/O 函数就包含在标准库中。\n\n然而，C++ 要求你调用的任何函数都需要原型声明，无论它是否在库中（如果你不理解，请参阅第 6 章）。为了不强迫程序员手动输入所有声明，库作者创建了包含文件，其中几乎只包含原型声明。\n\
  \n看下面这个简单的示例。假设我创建了一个包含 `sin()`、`cosin()`、`tan()` 以及许多其他三角函数的库。我可能会创建一个名为 `mytrig`\
  \ 的包含文件，其内容如下：\n\n```cpp\n// 我的库的包含声明\ndouble sin(double x);\ndouble cosin(double\
  \ x);\ndouble tan(double x);\n// ...更多原型声明...\n```\n\n任何想要使用这些函数之一的程序都会 `#include`\
  \ 该文件，将包含文件名放在括号或引号中，如：\n\n```cpp\n#include <mytrig>\n```\n\n或\n\n```cpp\n#include\
  \ \"mytrig\"\n```\n\n![tip.eps](img/tip_fmt.png) 两种 `#include` 形式的区别在于预处理器去哪里寻找\
  \ `mytrig` 文件。当文件被包含在引号中时，预处理器假设该文件是本地生成的，因此它开始在发现源文件的相同目录中查找该文件。如果在该处没有找到，它将开始在自己的包含目录中查找。预处理器假设角括号中的包含文件来自\
  \ C++ 库，因此它会跳过源文件目录，直接进入标准包含文件夹。对于你创建的任何包含文件使用引号，对于 C++ 库包含文件使用角括号。\n\n因此，你可能会编写如下的源文件：\n\
  \n```cpp\n// MyProgram - 非常智能\n#include \"mytrig\"\n\nint main(int nArgc, char*\
  \ pArguments[]) {\n    cout << \"The sin of .5 is \" << sin(0.5) << endl;\n    return\
  \ 0;\n}\n```\n\n在预处理器完成展开 `#include` 之后，C++ 编译器看到以下中间文件：\n\n```cpp\n// MyProgram\
  \ - 非常智能\n// 我的库的包含声明\ndouble sin(double x);\ndouble cosin(double x);\ndouble tan(double\
  \ x);\n// ...更多原型声明...\n\nint main(int nArgc, char* pArguments[]) {\n    cout <<\
  \ \"The sin of .5 is \" << sin(0.5) << endl;\n    return 0;\n}\n```\n\n\n\n\n\n\
  ![warning.eps](img/warning_fmt.png) 在历史上，习惯是将包含文件以 `*.h.*` 结尾。C 仍然在使用该标准。然而，C++\
  \ 在重构包含文件结构时舍弃了扩展名。现在，C++ 标准包含文件没有扩展名。\n\n## 定义内容\n\n预处理器允许程序员 `#define` 表达式，这些表达式在预处理器处理阶段会被展开。例如，你可以\
  \ `#define` 一个在整个程序使用的常量。\n\n![tip.eps](img/tip_fmt.png) 在使用时，你将 `#` 符号读作“pound”，所以你说“pound-define\
  \ a constant”（定义一个常量），以与其他方式定义常量区分开来。\n\n```cpp\n#define TWO_PI 6.2831852\n```\n\
  \n这使得下面的语句变得更容易理解：\n\n```cpp\ndouble diameter = TWO_PI * radius;\n```\n\n而不是其等价的表达式，后者才是\
  \ C++ 编译器在预处理器将 `TWO_PI` 替换为其定义后实际看到的：\n\n```cpp\ndouble diameter = 6.2831852 *\
  \ radius;\n```\n\n另一个优势是可以在一处 `#define` 一个常量并在处处使用。例如，我可能会在一个包含文件中包含以下 `#define`：\n\
  \n```cpp\n#define MAX_NAME_LENGTH 512\n```\n\n在整个程序中，我可以将从键盘读取的名称截断为通用且一致的 `MAX_NAME_LENGTH`。这不仅易于阅读，而且如果我想增加或减少所选择处理的最大名称长度，在程序中提供了一个单一的修改位置。\n\
  \n预处理器还允许程序 `#define` 带有参数的函数体宏，这些参数在定义在使用时会被展开：\n\n```cpp\n#define SQUARE(X) X\
  \ * X\n```\n\n在实际中，此类宏定义看起来非常像函数：\n\n```cpp\n// 计算圆的面积\ndouble dArea = HALF_PI *\
  \ SQUARE(dRadius);\n```\n\n记住，C++ 编译器实际上看到的是所有宏展开后生成的文件。这可能会导致一些意想不到的结果。考虑以下代码片段（这些均取自程序\
  \ `MacroConfusion,*`，包含在 `www.dummies.com/extras/cplusplus` 的额外程序中）：\n\n```cpp\n\
  int nSQ = SQUARE(2);\ncout << \"SQUARE(2) = \" << nSQ << endl;\n```\n\n令人放的是，这产生了预期的输出：\n\
  \n```text\nSQUARE(2) = 4\n```\n\n然而，接下来的几行\n\n```cpp\nint nSQ = SQUARE(1 + 2);\n\
  cout << \"SQUARE(1 + 2) = \" << nSQ << endl;\n```\n\n产生了令人惊讶的结果：\n\n```text\nSQUARE(1\
  \ + 2) = 5\n```\n\n预处理器简单地将宏定义中的 `X` 替换为 `1 + 2`。C++ 编译器实际看到的是\n\n\n\n```cpp\nint\
  \ nSQ = 1 + 2 * 1 + 2;\n```\n\n由于乘法的优先级高于加法，它被转换为 `1 + 2 + 2`，其结果当然是 `5`。这种困惑可以通过在宏定义中大量使用圆括号来解决：\n\
  \n```cpp\n#define SQUARE(X) ((X) * (X))\n```\n\n这个版本产生了预期的结果：\n\n```text\nSQUARE(1\
  \ + 2) → ((1 + 2) * (1 + 2)) → 9\n```\n\n然而，某些意想不到的结果无论你如何尝试都无法修复。考虑以下片段：\n\n```cpp\n\
  int i = 2;\ncout << \"i = \" << i << endl;\nint nSQ = SQUARE(i++);\ncout << \"SQUARE(i++)\
  \ = \" << nSQ << endl;\ncout << \"now i = \" << i << endl;\n```\n\n这产生了如下：\n\n```text\n\
  i = 3;\nSQUARE(i++) = 9\nnow i = 5\n```\n\n`SQUARE` 生成的值是正确的，但变量 `i` 被递增了两次。考虑到展开后的宏，原因变得显而易见：\n\
  \n```cpp\nint i = 3;\nnSQ = i++ * i++;\n```\n\n由于自增操作优先级更高，两个 `i++` 操作先执行。它们都返回\
  \ `i` 的当前值，即 `3`。这两个值被相乘，返回预期的值 `9`。然而，`i` 随后递增了两次，生成了结果 `5`。\n\n### 那么，如果不定义内容会怎样？\n\
  \n预处理器有时产生的意想不到结果让 C++ 的父辈（以及母亲们）从一开始就很痛苦。多年来，C++ 包含了许多功能，使得大多数 `#define` 的使用变得不再必要。\n\
  \n例如，C++ 定义了内联函数来替换宏。它看起来和任何其他函数声明完全一样，只是在前面加上了关键字 `inline`：\n\n```cpp\ninline int\
  \ SQUARE(int x) { return x * x; }\n```\n\n这个内联函数定义看起来与之前的 `SQUARE()` 宏定义非常相似（我将此定义写在一行是为了突出相似性）。然而，内联函数是由\
  \ C++ 编译器而不是预处理器处理的。这个 `SQUARE()` 定义不会受到之前提到的任何奇怪副作用。\n\n![warning.eps](img/warning_fmt.png)\
  \ `inline` 关键字旨在建议编译器“内联展开函数”而不是生成函数调用。这是为了满足那些想要避免函数调用开销的性能狂热者。\n\n![warning.eps](img/warning_fmt.png)\
  \ `inline` 关键字旨在建议编译器“内联展开函数”而不是生成函数调用。这是为了满足那些想要避免函数调用开销的性能狂热者。\n\nC++ 允许你使用 `const`\
  \ 变量：\n\n```cpp\nconst int MAX_NAME_LENGTH = 512;\n```\n\nC++ 允许你使用 `constexpr`\
  \ 函数：\n\n```cpp\nconstexpr int square(int n1, int n2) { return n1 * n2; }\n```\n\
  \n### 列举其他选项\n\nC++ 提供了一种定义独立类型常量的机制。例如，假设我正在编写一个处理州的程序。我可以通过名称引用它们，例如“德克萨斯”或“北达科他州”。在实践中这并不方便，因为字符串比较非常耗资源。\n\
  \n我可以为每个州定义一个唯一的值：\n\n```cpp\n#define DC_OR_TERRORY 0\n#define ALABAMA 1\n#define\
  \ ALASKA 2\n```\n\n这不仅避免了字符串的笨拙；还允许我将州作为数组的索引：\n\n```cpp\nint population[3];\n```\n\
  \n像 `population[ALASKA]++` 这样的语句比语义相同的语句更容易理解得多。C++ 提供了所谓的“枚举”（enumeration）：\n\n\
  ```cpp\nenum State {\n};\n```\n（等等，让我重新对齐提供的文本逻辑）\n\n```cpp\nenum STATE {\n    DC_OR_TERRORY,\n\
  \    ALABAMA,\n    ALASKA,\n    ARKANSAS\n};\n```\n\n此枚举中的每个元素都被赋予从 0 开始的值，所以 `DC_OR_TERRORY`\
  \ 被定义为 0，`ALABAMA` 被定义为 1，依此类推。你可以通过如下赋值语句覆盖这种增量序列：\n\n```cpp\nenum STATE {\n  \
  \  DC,\n    TERRITORIES = 0,\n    ALABAMA,\n    ALASKA\n};\n```\n\n这个版本的 *STATE*\
  \ 定义了一个元素 `DC,`，其值被赋予 0。然后它定义了一个新元素 `TERRITORIES,`，也被赋值为 0。`ALABAMA` 像之前一样从 1 开始。\n\
  \n\n\n\n\n![c++11_fmt.eps](img/c11_fmt.png) ’11 标准扩展了枚举，允许程序员创建用户定义的枚举类型，如下所示（注意代码段中添加了\
  \ `class` 关键字）：\n\n```cpp\nenum class STATE {DC,\n                  TERRITORIES\
  \ = 0,\n                  ALABAMA,\n                  ALASKA,\n                \
  \  // ...and so on...\n};\n```\n\n此声明创建了一个新类型 `STATE` 并为其分配了 52 个成员（从 `ALABAMA`\
  \ 到 `WYOMING`，加上 `DC` 和 `TERRITORIES`）。程序员现在可以像使用其他变量类型一样使用 `STATE`。可以声明一个 `STATE`\
  \ 类型的变量：\n\n```cpp\nSTATE s = STATE::ALASKA;\n```\n\n函数调用可以通过这种新类型进行区分：\n\n```cpp\n\
  int getPop(STATE s);            // 返回人口\nint setPop(STATE s, int pop);   // 设置人口\n\
  ```\n\n`STATE` 类型不仅仅是 `int` 的另一个别名：`STATE` 类型的成员没有定义算术运算。以下尝试将 `STATE` 用作数组索引的操作是非法的：\n\
  \n```cpp\nint getPop(STATE s)\n{\n    return population[s];  // 不合法\n}\n```\n\n\
  然而，通过应用强制转换，可以将 `STATE` 的成员转换为对应的整数（`DC` 和 `TERRITORIES` 为 0，`ALABAMA` 为 1，`ALASKA`\
  \ 为 2，依此类推）：\n\n```cpp\nint getPop(STATE s)\n{\n    return population[(int)s]; \
  \ // 合法\n}\n```\n\n## 包含我所说的话\n\n第三大类预处理器语句是 `#if`，它是 C++ `if` 语句的预处理器版本：\n\n```cpp\n\
  #if constexpression\n// 如果 constexpression 结果非 0，则包含\n#else\n// 如果 constexpression\
  \ 结果为 0，则包含\n#endif\n```\n\n这被称为*条件编译*，因为只有当条件为真时，`#if` 和 `#else` 或 `#endif` 之间的语句才会被编译中。`constexpression`\
  \ 短语限于简单的算术运算符和比较运算符。这没关系，因为除了等值比较和偶尔的加法之外，更复杂的操作很少见。\n\n例如，以下是 `#if` 的常见用法。我可以在一个名为\
  \ `LogMessage` 的包含文件中包含以下定义：\n\n```cpp\n#if DEBUG == 1\ninline void logMessage(const\
  \ char *pMessage)\n    { cout << pMessage << endl; }\n#else\n#define logMessage(X)\
  \ (0)\n#endif\n```\n\n现在我可以在程序中需要的地方到处散布错误信息：\n\n```cpp\n#define DEBUG 1\n#include\
  \ \"LogMessage\"\n\nvoid testFunction(char *pArg)\n{\n    logMessage(pArg);\n  \
  \  // ...函数继续...\n}\n```\n\n当 `DEBUG` 设置为 1 时，`logMessage()` 被转换为对内联函数的调用，将参数输出到显示器。一旦程序运行正常，我就可以移除\
  \ `DEBUG` 的定义。现在对 `logMessage()` 的引用将调用一个什么都不执行的宏。\n\n条件编译的第二个版本是 `#ifdef`（读作“if\
  \ def”）：\n\n```cpp\n#ifdef DEBUG\n// 如果 DEBUG 被 #定义过则包含\n#else\n// 如果 DEBUG 没有被\
  \ #定义过则包含\n#endif\n```\n\n还有一个 `#ifndef`（读作“if not def”），它是 `#ifdef` 的逻辑反反。\n\n\
  ## 内建定义对象\n\nC++ 定义了一组内建常量，如表 10-1 所示。这些是 C++ 认为没有它们就太酷的常量——而且你自己也很难定义它们。\n\n###\
  \ 表 10-1 预定义预处理器常量\n\n| 常量 | 类型 | 含义 |\n| :--- | :--- | :--- |\n| `__FILE__` | `const\
  \ char const *` | 源文件的名称。 |\n| `__LINE__` | `const int` | 当前行号。 |\n| `__func__`\
  \ | `const char const *` | 当前函数的名称（仅 C++ ’11）。 |\n| `__DATE__` | `const char const\
  \ *` | 当前日期。 |\n| `__TIME__` | `const char const *` | 当前时间。 |\n| `__TIMESTAMP__`\
  \ | `const char const *` | 当前日期和时间。 |\n| `__STDC__` | `int` | 如果 C++ 编译器符合标准，则置为\
  \ 1。 |\n| `__cplusplus` | `int` | 如果编译器是 C++ 编译器（而非 C 编译器），则置为 1。这允许包含文件跨环境间共享。\
  \ |\n\n这些内部宏在生成错误信息时特别有用。你可能会认为 C++ 本身已经生成了大量的错误信息，不需要额外的帮助，但有时你想创建自己的编译器错误。对于你，C++\
  \ 提供了不是一个、不是两个，而是三个选项：`#error`、`assert()` 和 `static_assert()`。这三种机制的工作方式略有不同。\n\n\
  `#error` 命令是一个预处理器指令（从它以 `#` 号开头看出）。它会导致预处理器停止并输出一条消息。假设你的程序只能在标准 C++ 环境下运行。你可以在程序的开头添加以下内容：\n\
  \n```cpp\n#if !__cplusplus || !__STDC__\n#error 这是一个标准的 C++ 程序。\n#endif\n```\n\n\
  与 `#error` 不同，`assert()` 在程序执行时执行测试。例如，假设我写了一个计算 `N` 的阶乘函数。为了保险见，我应该为非正值添加一个测试：\n\
  \n```cpp\nint factorial(int N)\n{\n    assert(N > 0);\n    // ...程序继续\n}\n```\n\n\
  程序现在每次调用时都会检查参数。一旦出现负值的迹象，`assert()` 就会带有指向文件和行号的消息停止程序。在整个程序中大量使用 `assert()` 是在开发早期检测问题的好方法，但不断测试已发现的错误会不必要的减慢程序。为了避免这种情况，C++\
  \ 允许程序员在创建发布的程序版本时“移除”测试：#define` 常量 `NDEBUG`（代表“非调试模式”）。这会导致预处理器将所有对 `assert()`\
  \ 的调用转换为“无操作”（通用称为 NO-OP）。\n\n![c++11_fmt.eps](img/c11_fmt.png) 预处理器无法执行某些编译时测试。例如，假设你的程序在默认整数大小为\
  \ 32 位时运行正常。预处理器帮不上忙，因为它对整数或浮点一无所知。为了解决这种情况，C++ 引入了关键字 `static_assert()`，它由编译器（而不是预处理器）解释。它接受两个参数：一个\
  \ `const` 表达式和一个字符串，如下例：\n\n```cpp\nstatic_assert(sizeof(int) == 4, \"int 不是 32\
  \ 位的.\");\n```\n\n如果 `const` 表达式在编译期间求值为 0 或 *false*，编译器将输出该字符串并停止。`static_assert()`\
  \ 不生成任何运行时代码。\n\n## Typedef\n\n`typedef` 关键字允许程序员为声明创建一个简短名称。谨慎地应用 `typedef` 可以使生成的程序更易读。（注意\
  \ `typedef` 实际上并不是预处理器命令，但它主要与包含文件和预处理器相关。）\n\n```cpp\ntypedef int* IntPtr;\n\n\
  typedef const IntPtr IntConstPtr;\n\nint i;\n\nint *const ptr1 = &i;\n\nIntConstPtr\
  \ ptr2= ptr1; // ptr1 和 ptr2 类型相同\n```\n\n\n\n\n此代码段中的前两个声明为现有类型赋予了新名称。因此，第二个声明将\
  \ `IntConstPtr` 定义为 `int const` 的另一个名称。当这个新类型在 `ptr2` 的声明中使用时，它的效果与更复杂的 `ptr1` 声明相同。\n\
  \n虽然 `typedef` 没有引入任何新功能，但它能让一些复杂的声明变得更容易易读。\n\n# 第三部分\n\n## 类类论\n\n![9781118823774-pp0301.tif](img/9781118823774-pp0301_fmt.png)\n\
  \n![webextras.eps](img/webextras_fmt.png) 访问 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取精彩的 Dummies 在线内容。\n\n在本部分中……\n\n* 回顾面向对象编程\n* 声明和定义类成员\n* 声明构造函数和析构函数\n* 定义静态成员函数\n\
  * 访问 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取精彩的 Dummies 在线内容\n\n# 第 11 章\n\n## 审面向对象编程\n\n### 本章内容\n\n![arrow](img/arrow.png)\
  \ 制作墨西哥塔\n![arrow](img/arrow.png) 回顾面向对象编程\n![arrow](img/arrow.png) 引入抽象和分类\n![arrow](img/arrow.png)\
  \ 探索为什么面向对象编程很重要\n\n面向对象编程到底是什么？面向对象编程，或者正如内行人士所喜欢的称呼—— OOP，依赖于两个你在穿纸尿裤之前就学会的原则：抽象和分类。为了解释这一点，让我给你们讲一个小故事吧。\n\
  \n### 微波炉的抽象化\n\n有时候当我和我儿子一起看足球时（这通常发生在我妻子找不到遥控器频道器的时候），我会随手做一顿极不健康的墨西哥塔。我在盘子里倒上一些薯片，撒上一些豆子、奶酪和大量的辣椒，然后把这整堆东西放入微波炉中加热五分钟。使用我的微波炉时，我打开门，把东西放进去，然后按几个按钮。几分钟后，墨西哥塔就做好了。\n\
  \n现在，想一下我使用微波炉时**没有**做的事情：\n\n* 我没有为了让它工作而重新布线或改变微波炉内部的。微波炉有一个接口——带有所有按钮和小型时间显示器的前面板——这让我能够完成我需要的一切。\n\
  * 我不需要重新编写用于驱动微波炉内部微处理器的软件，即使我上次使用微波炉时做的是另一道菜。\n* 我不需要看微波炉的外壳内部。\n* 即使我是一个微波炉设计师，了解微波炉的所有内部原理（包括它的软件），我仍然用同样的方式加热我的墨西哥塔，而不会考虑内部的那些东西。\n\
  \n这些并不是什么深刻的洞察。你在生活中能处理的压力是有限的。为了减少你需要处理的事情的数量，你会在特定的细节水平上工作。\n\n![remember.eps](img/remember_fmt.png)\
  \ 在面向对象（OO）计算机术语中，你工作的细节水平被称为`抽象级别`（level of abstraction）。趁此机会再介绍一个 OO 术语，我`抽象掉`（abstract\
  \ away）微波炉内部的细节。\n\n当我制作墨西哥塔时，我把微波炉看作一个盒子。（我不能一边担心微波炉的内部，一边还在电视上跟着牛仔队。）只要我只通过接口（键盘）操作微波炉，就不应该能做到：\n\
  \n* 导致微波炉进入不一致状态并崩溃。\n* 将我的墨西哥塔变成一片焦黑、冒火焰的。\n* 让微波炉（以及周围的房子）起火！\n\n#### 准备函数式墨西哥塔\n\
  \n假设我让我儿子写一个关于“爸爸如何做墨西哥塔”的算法。在他理解了我的意图后，他可能会写“打开一罐豆子，磨一些奶酪，切开辣椒”等等。当涉及到微波加热混合物的部分时，他会写类似“在微波炉中加热五分钟”的内容。\n\
  \n这种描述是直观且完整的。但并不是函数式程序员编写制作墨西哥塔程序的方式。函数式程序员生活在一个没有微波炉或其他电器等对象的世界里。他们倾向于担心具有无数功能路径的流程图。在墨西哥塔问题的函数式解决方案中，控制流将通过我的手指传递到面板，然后进入微波炉的内部。很快，流就会在关于微波炉管要开启多久以及是否要响“来吃饭了”提示音的复杂逻辑路径中穿梭。\n\
  \n在这样的世界中，要以抽象级别来思考是非常困难的。没有对象，也没有抽象来隐藏内在的复杂性。\n\n#### 准备面向对象的墨西哥塔\n\n在制作墨西哥塔的面向对象方法中，我首先识别问题中的对象类型：薯片、豆子、奶酪和一个烤箱。然后我将开始在软件中对这些对象进行建模，而不考虑它们在最终程序中如何使用的细节。\n\
  \n当我做这些工作时，被认为是在基础对象的水平上工作（和思考）。我需要考虑如何制作一个实用的烤箱，但还不需要考虑制作墨西哥塔的逻辑过程。毕竟，微波炉的设计师并没有考虑我制作零食的特定问题。相反，他们致力于解决设计和建造一个实用微波炉的问题。\n\
  \n在我需要的对象被成功编码和测试之后，我可以提升到下一个抽象级别。我可以开始在制作墨西哥塔的层面思考，而不是制作微波炉的层面。在这一点，我几乎可以直接把我儿子的指令翻译成\
  \ C++ 代码。\n\n#### 分类微波炉\n\n抽象概念的关键是分类。如果我问我儿子：“什么是微波炉？”他可能会说：“它是一个……的烤箱。”如果我接着问：“什么是烤箱？”他可能会回答道：“它是一个……的厨房电器。”（如果我接着问：“什么是厨房电器？”，他可能会说：“你为什么要问这么多蠢问题？”）\n\
  \n我儿子对我问题的回答源于他对我们特定的微波炉的理解，将其作为“微波炉”这类事物的一个例子。此外，我儿子认为微波炉仅仅是种特殊的烤箱，而烤箱本身只是种特殊的厨房电器。\n\
  \n![remember.eps](img/remember_fmt.png) 在面向对象的计算机术语中，我厨房里的微波炉是`微波炉`类的一个`实例`（instance）。`微波炉`类是`烤箱`类的`子类`（subclass），而`烤箱`类是`厨房电器`类的`子类`。我们说微波炉从烤箱`继承`（inherit）了烹饪属性。\n\
  \n人类会分类。我们世界的一切的一切都被组织在分类法中。我们这样做是为了减少我们需要记忆的事情的数量。例如，你第一次看到混合动力汽车时。广告可能会称这种混合动力车是“独特的，前所未有的”。但你我知道事实并非如此。我喜欢混合动力车，我承认它们在引擎盖下有很多不同，但嘿，混合动力车仍然是一辆汽车。因此，它共享其他汽车的所有（或至少是大部分）属性。它有方向盘、座椅、电机、刹车等等。我打赌我甚至可以不读用户手册就能开它。\n\
  \n\n\n\n我不必把混合动力汽车与其他汽车的所有共同特征都弄乱我有限的存储空间。我只需要记住“混合动力汽车是一种……的汽车”，然后加上那几项混合动力汽车特有的特征（比如价格标签）。我还可以更进一步。汽车是轮式车辆的一个子类，其他成员包括卡车和皮卡。也许轮式车辆是车辆的一个子类，而车辆包含了船只和飞机。以此类推。\n\
  \n## 为什么要分类？\n\n为什么要分类？这听起来很麻烦。而且，人们已经使用了很长时间的函数式方法了，为什么要现在改变呢？\n\n专门为这一个问题设计并建造一个微波炉似乎更简单，而不是构建一个独立的、更通用的烤箱对象。例如，我想构建一个只用来烤墨西哥玉米片（nachos）的微波炉。我不需要给它安装前面板，除了一个\
  \ `Start` 按钮以外。我制作玉米片的时间总是固定，所以我可以省去所有 `Defrost`（解冻）和 `Temp Cook`（定时烹饪）等废话。只做玉米片的微波炉只需要容纳一个小平盘。三立方英尺的空间将浪费在玉米片上。\n\
  \n就此，我完全可以抛弃“微波炉”的概念。我真正只需要烤箱的核心部件。然后在食谱中，我写下让它运行的指令：“把玉米片放入盒中。将红线连接到黑线。将辐射管电压升至约\
  \ 3000 伏。注意会有轻微的嗡嗡声。如果你打算生孩子，尽量不要站得太近。”之类的。\n\n但函数式方法存在问题：\n\n- **太复杂：** 我不想让建造烤箱的细节与制作玉米片的细节混合在一起。如果我不能定义对象并将它们从细节的泥潭中提取出来单独处理，我就必须同时处理该问题的所有复杂性。\n\
  - **不灵活：**某一天我可能需要将微波炉更换为其他类型的烤箱。只要接口相同，我就应该能够这样做。如果没有清晰的划分和独立开发，就不可能干净地移除一个对象类型并替换为另一个。\n\
  - **不可重用：** 烤箱用于制作很多不同的菜肴。我不想每次遇到新食谱就创建一个新烤箱。一旦解决过某个问题，如果能够在未来的程序中重用该解决方案就太好了。\n\
  \n本部分的剩余章节将演示 `C++` 的面向对象语言特性如何解决这些问题。\n\n![warning.eps](img/warning_fmt.png) 在现实生活中，它并没有我在这里说的那么纯粹。我没有时间去构建一个软件等同的通用微波炉。毕竟，工程师团队花费了数千个开发小时来设计微波炉（而且前面板仍然晦涩难懂！）。当我构建类时，我通常只构建解决特定问题需要的功能，但原理仍然是相同的。当我建造微波炉时，我只需要考虑烤箱本身。当我制作玉米片时，我只需要考虑使用烤箱。这样更简单。\n\
  \n## 第 12 章\n\n# 在 C++ 中添加类\n\n### 本章内容\n\n- ![arrow](img/arrow.png) 将数据分组为类\n-\
  \ ![arrow](img/arrow.png) 声明和定义类成员\n- ![arrow](img/arrow.png) 为类添加活动属性\n- ![arrow](img/arrow.png)\
  \ 访问类成员函数\n- ![arrow](img/arrow.png) 重载成员函数\n\n程序通常处理一组数据：一个人的姓名、等级和序列号之类的。这些值中的任何一个都不足以描述一个人——只有当这些值汇在一起时才有意义。像数组这样的简单结构对于存储独立值很棒，但对于数据组来说效果并不好。这使得老数组不足以存储复杂数据（例如网络公司维护的个人信用记录，以防它们被黑客窃取）。\n\
  \n由于很快就会明确的原因，我将这种数据分组称为 `object`（对象）。微波炉是一个对象（如果这听起来不通，请参见第 11 章）。你是一个对象（无意）。你在数据库中的储蓄账户信息是一个对象。\n\
  \n## 介绍类\n\n如果我们能在 `C++` 中创建与我们建模的现实对象具有相关属性的对象，该有多好了。我们需要一个能够包含描述单个对象所需的所有不同类型数据的结构。`C++`\
  \ 将将多个数据组合成单个对象的结构称为 `class`（类）。\n\n## 类的格式\n\n类由关键字 `class` 后面跟着一个名称以及一对大括号组成。一个用于描述包含账户号码和余额的储蓄账户类可能如下：\n\
  \n```cpp\nclass SavingsAccount\n{\npublic:\n    unsigned accountNumber;\n    double\
  \ balance;\n};\n```\n\n大括号后的语句是关键字 `public`。（先别问关于 `public` 关键字的含义。我稍后会公开它的含义。）\n\
  \n![tip.eps](img/tip_fmt.png) 备选关键字 `struct` 可以代替 `class`。这两个关键字完全相同，区别在于 `struct`\
  \ 假设是 `public` 声明且可以省略。由于本章稍后会变得明确的原因，对于大多数程序，你应该坚持使用 `class`。\n\n紧随 `public` 关键字之后的是描述该对象的条目。`SavingsAccount`\
  \ 类包含两个元素：一个无符号整数 `accountNumber` 和账户 `balance`。我们也可以说 `accountNumber` 和 `balance`\
  \ 是类 `SavingsAccount` 的成员或属性。\n\n要创建一个实际储蓄账户对象，我输入类似下面的内容：\n\n```cpp\nSavingsAccount\
  \ mySavingsAccount;\n```\n\n我们说 `mySavingsAccount` 是类 `SavingsAccount` 的一个 `instance`（实例）。\n\
  \n![tip.eps](img/tip_fmt.png) 这里使用的命名规范很常见：类名通常大写开头。在像 `SavingsAccount` 这样包含多个单词的类名中，每个单词大写，并挤在一起而不使用下划线。对象名称遵循相同的多个单词挤在一起的规则，但它们通常以小字母开头，如\
  \ `mySavingsAccount`。一如既往，这些规范（我我不于称之为规则）是为了帮助人类读者——`C++` 并不在乎哪种。\n\n## 访问类的成员\n\
  \n以下语法用于访问特定对象的属性：\n\n```cpp\n// 创建一个储蓄账户对象\nSavingsAccount mySave;\nmySave.accountNumber\
  \ = 1234;\nmySave.balance = 0.0;\n\n// 从键盘输入第二个储蓄账户\ncout << \"Input your account\
  \ number and balance\" << endl;\nSavingsAccount urSave;\ncin >> urSave.accountNumber;\n\
  cin >> urSave.balance;\n```\n\n这段代码片段声明了两个 `SavingsAccount` 类的对象：`mySave` 和 `urSave`。该片段通过为账户号码赋值并为余额赋值\
  \ 0（按照我储蓄账户的惯例）来初始化 `mySave`。然后它创建了同种类的第二个对象 `urSave`。该片段从键盘读取账户号码和余额。\n\n这段片段中需要注意的一个重要点是，`mySave`\
  \ 和 `urSave` 是分离、独立的对象。操作其中一个成员对另一个的成员没有影响（对 `urSave` 来说很幸运）。\n\n此外，没有关联对象的成员名称是没有意义的。我不能说以下任何一种：\n\
  \n```cpp\nbalance = 0.0;      // 非法；没有对象\nSavingsAccount.balance = 0.0; // 有类但仍然没有对象\n\
  ```\n\n\n\n\n\n每个储蓄账户都有其唯一的账号，并维护一个独立的-`balance`。（可能存在所有储蓄账户共有的属性——我们将在第 18 章中介绍这些——但账号和余额恰好不属于其中。）\n\
  \n# 激活我们的对象\n\n你使用类来模拟现实世界的对象。`Savings` 类试图表示一个储蓄账户。这允许你以对象的角度来思考，而不是简单地看代码行。C++\
  \ 对象越接近真实世界的建模，在程序中处理它们就越容易。这听起来很简单。然而，`Savings` 类在模拟储蓄账户方面做得并不好。\n\n## 模拟现实世界的对象\n\
  \n真实的账户具有数据类型属性，如账号和余额，这与 `Savings` 类相同。这使得 `Savings` 成为描述真实账户良好的起点。但真实的账户会执行操作。储蓄账户会积累利息；定期存款（CD）在提前取出时收取巨额罚金——诸此类。\n\
  \n函数式程序通过函数来“执行操作”。一个 C++ 程序可能会调用 `strcmp()` 来比较两个字符字符串，或者调用 `max()` 返回两个值的最大值。事实上，第\
  \ 23 章解释了即使是流 I/O (`cin >>` 和 `cout <<`) 也是函数 `call` 的特殊形式。\n\n如果 `Savings` 类要很好地表示一个现实概念，它需要它自己的活动属性：\n\
  \n```cpp\nclass Savings\n{\npublic:\n    double deposit(double amount)\n    {\n\
  \        balance += amount;\n        return balance;\n    }\n    unsigned accountNumber;\n\
  \    double balance;\n};\n```\n\n除了账号和余额，这个版本的 `Savings` 还包含了函数 `deposit()`。这让 `Savings`\
  \ 拥有控制自己未来的能力。`Savings` 类需要一个 `accumulateInterest()` 函数，而 `CD` 类需要一个 `penalizeForEarlyWithdrawal()`\
  \ 函数。\n\n![remember.eps](img/remember_fmt.png) 在类中定义的函数被称为`成员函数`.\n\n## 为什么要费力使用成员函数？\n\
  \n为什么要费力使用成员函数呢？过去函数式编程的好时代有什么不好吗？\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 我使用“函数式编程”一词等同于“过程化编程”，就像在面向对象编程出现之前的编程方式那样。\n\n```cpp\nclass Savings\n{\npublic:\n\
  \    unsigned accountNumber;\n    double balance;\n};\n\ndouble deposit(Savings&\
  \ s, double amount)\n{\n    s.balance += amount;\n    return s.balance;\n}\n```\n\
  \n在这里，`deposit()` 实现了“向储蓄账户存款”的功能。这种函数式解决方案依赖于外部函数 `deposit()` 来实现一个储蓄账户执行但 `Savings`\
  \ 缺失的活动。这虽然完成了任务，但它是通过破坏面向对象 (OO) 规则完成的。\n\n微波炉有内部组件，它“知道”如何使用这些组件来烹饪、解冻和烤焦。类的数据成员类似于微波炉的零件——类的成员函数执行着类似烹饪的功能。\n\
  \n当我做纳荷饼时，我不需要以某种特定的方式开始连接烤箱的内部组件来让它工作。我也不依赖某些外部设备为我伸进杂乱的电线中。我希望我的类工作方式和我的微波炉一样（不，我的意思不是“不太好”）。我希望我的类知道如何在没有外部干预的情况下操纵内部结构。\n\
  \n## 添加成员函数\n\n为了演示成员函数，首先定义一个 `Student` 类。此类类的一种可能表示如下（取自程序 `CallMemberFunction`）：\n\
  \n```cpp\nclass Student\n{\npublic:\n    // 向记录中添加已完成的课程\n    double addCourse(int\
  \ hours, double grade)\n    {\n        // 计算所有课程学时乘以\n        // 平均分数\n        double\
  \ weightedGPA;\n        weightedGPA = semesterHours * gpa;\n        // 现在加上新课程\n\
  \        semesterHours += hours;\n        weightedGPA += grade * hours;\n      \
  \  gpa = weightedGPA / semesterHours;\n        // 返回新的 gpa\n        return gpa;\n\
  \    }\n    int  semesterHours;\n    double gpa;\n};\n```\n\n函数 `addCourse(int,\
  \ double)` 被称为 `Student` 类的成员函数。在原则上，它是类的一个属性，就像数据成员 `semesterHours` 和 `gpa` 一样。\n\
  \n有时不是类成员的函数是类的“普通函数”，但我会简单地称它们为 `nonmembers`。\n\n![tip.eps](img/tip_fmt.png) 成员函数不需要像这个示例那样排在数据成员之前。类的成员可以任何顺序列出——我只是喜欢把函数放在前面。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 出于历史原因，成员函数也被称为 `methods`. 这个词源于最早的面向对象语言之一。这个名字在当时很有意义，但在\
  \ C++ 中没有意义。尽管如此，该术语在 OO 圈已变得流行。\n\n## 调用成员函数\n\n以下 `CallMemberFunction` 显示了如何调用成员函数：\n\
  \n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nclass Student\n{\npublic:\n    // 向记录中添加已完成的课程\n    double addCourse(int\
  \ hours, double grade)\n    {\n        // 计算所有课程学时乘以\n        // 平均分数\n        double\
  \ weightedGPA;\n        weightedGPA = semesterHours * gpa;\n        // 现在加上新课程\n\
  \        semesterHours += hours;\n        weightedGPA += grade * hours;\n      \
  \  gpa = weightedGPA / semesterHours;\n        // 返回新的 gpa\n        return gpa;\n\
  \    }\n    int  semesterHours;\n    double gpa;\n};\n\nint main(int nNumberArgs,\
  \ char* pszArgs[])\n{\n    // 创建一个 Student 对象并初始化它\n    Student s;\n    s.semesterHours\
  \ = 3;\n    s.gpa = 3.0;\n\n    // 调用前的值\n    cout << \"Before: s = (\" << s.semesterHours\
  \ << \", \" << s.gpa << \")\" << endl;\n\n    // 对象调用成员函数 add()\n    cout << \"\
  Adding 3 hours with a grade of 4.0\" << endl;\n    s.addCourse(3, 4.0);\n\n    //\
  \ 值现在已经改变了\n    cout << \"After: s = (\" << s.semesterHours << \", \" << s.gpa <<\
  \ \")\" << endl;\n\n    // 等待用户准备好后再终止程序\n    // 让用户看到程序结果\n    cout << \"Press\
  \ Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\n\
  \    return 0;\n}\n```\n\n调用成员函数的语法看起来像是访问数据成员的语法与调用函数的语法的混合。点号的右侧看起来像传统的函数调用，但点号左侧是一个对象。\n\
  \n在调用 `s.addCourse()` 时，我们说 `addCourse()` 作用于对象 `s`，或者换句话说，`s` 是要添加课程的那个学生。如果你不知道从哪个学生那里获取学时，你就无法获取学时——如果你不知道要添加哪个学生，你就无法将学生添加到课程中。没有对象就调用成员函数与没有对象就引用数据成员没有区别。\n\
  \n\n\n\n\n我能清楚地看到：你对自己反复说：“没有对象就访问成员是没有意义的。没有对象就访问成员是没有意义的。访问……” 正当你准备接受这一点时，你看到了成员函数\
  \ `Student::addCourse()`，然后*砰！* 瞬间击中了你的大脑：`addCourse()` 在没有引用对象的情况下访问了类的其他成员。那么，它们是怎么做到的呢？\n\
  \n好了，到底行还是不行？相信我，你是不行的。当你从 `addCourse()` 引用 `Student` 的成员时，该引用是针对调用 `addCourse()`\
  \ 时的那个 `Student` 对象。哈？回到 `CallMemberFunction` 示例。这里有一个精简后的版本：\n\n```cpp\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    Student s;\n    s.semesterHours = 10;\n\
  \    s.gpa       = 3.0;\n    s.addCourse(3, 4.0); // 调用成员函数\n    Student t;\n  \
  \  t.semesterHours = 6;\n    t.gpa       = 1.0;   // 情况不太妙\n    t.addCourse(3, 1.5);\
  \ // 情况并没有\n                         // 变得好多少\n    return 0;\n}\n```\n\n当使用对象 `s`\
  \ 调用 `addCourse()` 时，`addCourse()` 中所有其他未限定的成员引用也都指向 `s`。因此，`addCourse()` 中对 `semesterHours`\
  \ 的引用指向 `s.semesterHours`，而 `gpa` 指向 `s.gpa`。但当使用 `Student t` 对象调用 `addCourse()`\
  \ 时，这些相同的引用转而指向 `t.semesterHours` 和 `t.gpa`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 调用成员函数的对象是“当前”对象，所有对类成员的未限定引用都指向该对象。换句话说，从成员函数发出的对类成员的未限定引用总是针对当前对象的。\n\n## 作用域解析（我指的不是望镜……不对，我指的不是你望远镜运行得好不好）\n\
  \n成员与其类名之间的 `::` 被称为*作用域解析运算符*，因为它指示了成员所属的类。冒号之前的类名就像姓氏，而冒号之后的函数名就像名字——其顺序类似于中文名字，姓在后。\n\
  \n你可以使用 `::` 运算符通过使用空类名来描述一个非成员函数。例如，如果你愿意的话，非成员函数 `addCourse` 可以被表述为 `::addCourse(int,\
  \ double)`。这就像是一个没有家的函数。\n\n通常情况下 `::` 运算符是可选的，但在某些特定情况下并非如此，如下所示：\n\n```cpp\n//\
  \ addCourse - 将学时和成绩合并为\n// 加权平均分\ndouble addCourse(int hours, double grade)\n{\n\
  \    return hours * grade;\n}\n\nclass Student\n{\n  public:\n    // 将已完成的课程添加到记录中\n\
  \    double addCourse(int hours, double grade)\n    {\n        // 调用某些外部函数来计算\n\
  \        // 加权平均分\n        double weightedGPA=::addCourse(semesterHours,gpa);\n\
  \        // 现在添加新课程\n        semesterHours += hours;\n        // 使用相同的函数计算这门新课程的\n\
  \        // 加权平均分\n        weightedGPA += ::addCourse(hours, grade);\n        gpa\
  \ = weightedGPA / semesterHours;\n        // 返回新的 gpa\n        return gpa;\n   \
  \ }\n    int  semesterHours;\n    double gpa;\n};\n```\n\n在这里，我希望成员函数 `Student::addCourse()`\
  \ 调用非成员函数 `::addCourse()`。如果没有 `::` 运算符，从 `Student` 调用 `addCourse()` 将指向 `Student::addCourse()`。这会导致函数调用其自身。\n\
  \n## 在类中定义成员函数\n\n成员函数可以在类内部定义，也可以单独定义。当在类定义中定义时，函数形式如下，包含在头文件 `Savings.h` 中：\n\n\
  ```cpp\n// Savings - 定义一个具有存款\n// 能力的类\nclass Savings\n{\n  public:\n    // 定义成员函数\
  \ deposit\n    double deposit(double amount)\n    {\n        balance += amount;\n\
  \        return balance;\n    }\n    unsigned int accountNumber;\n    double balance;\n\
  };\n```\n\n使用这样的包含方式非常酷。现在，程序可以在 `SavingsClass_inline` 程序中如下所示包含类定义（连同成员函数的定义）：\n\
  \n```cpp\n// SavingsClassInline - 调用一个在类内部\n// 并定义的成员函数\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\nusing namespace std;\n#include \"Savings.h\"\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Savings s;\n    s.accountNumber\
  \ = 123456;\n    s.balance = 0.0;\n    // 现在向账户添加一些东西\n    cout << \"Depositing\
  \ 10 to account \" << s.accountNumber << endl;\n    s.deposit(10);\n    cout <<\
  \ \"Balance is \" << s.balance << endl;\n    // 在退出前等待用户准备好\n    // 让用户看到程序\n  \
  \  cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n这之所以很酷，是因为除了 `Savings` 类的程序员之外，其他人都可以专注于执行存款的操作，而不是银行业务的细节。这些细节被整齐地隐藏在自己的包含文件中。\n\
  \n![remember.eps](img/remember_fmt.png) `#include` 指令在编译过程中插入文件的内容。C++ 编译器实际上“看到”的是已经包含了\
  \ `Savings.h` 文件内容的你的源文件。\n\n## 在类之后保留成员函数\n\n对于较大的函数，将代码直接放在类定义中可能会导致类定义变得巨大且难以处理。为了防止这种情况，C++\
  \ 允许你在类外部定义成员函数。\n\n![tip.eps](img/tip_fmt.png) 在类外部定义的函数被称为*外链函数*（outline function）。这个术语与在类内部定义的内联函数（inline\
  \ function）相反。我们自第 5 章以来所定义的那些基础函数也是外链函数。\n\n当在类声明外部编写时，`Savings.h` 文件按如下声明了 `deposit()`\
  \ 函数而没有定义它：\n\n```cpp\n// Savings - 定义一个具有存款\n// 能力的类\nclass Savings\n{\n  public:\n\
  \    // 声明但不定义成员函数\n    double deposit(double amount);\n    unsigned int accountNumber;\n\
  \    double balance;\n};\n```\n\n`deposit()` 函数的定义必须包含在构成程序的一个源文件中。为了简单起见，我将其定义在\
  \ `main.cpp` 中。\n\n通常你不会将成员函数的定义与程序的其余部分混合。更方便的方法是将外链成员函数的定义收集到一个具有适当名称的源文件中（例如\
  \ `Savings.cpp`）。该源文件与其他源文件一起，作为构建可执行程序的一部分。我将在第 21 章中描述这一点。\n\n\n\n\n```cpp\n \
  \   cout << \"Depositing 10 to account \"\n         << s.accountNumber << endl;\n\
  \    s.deposit(10);\n    cout << \"Balance is \" << s.balance << endl;\n    // wait\
  \ until user is ready before terminating program\n    // to allow the user to see\
  \ the program results\n    cout << \"Press Enter to continue...\" << endl;\n   \
  \ cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n该类定义仅包含 `deposit()`\
  \ 函数的原型声明。函数的定义单独出现。结构体中的成员函数原型声明与任何其他原型声明类似，并且和所有原型声明一样，它们是必须的。\n\n注意看，当函数在类内部定义时，函数名\
  \ `deposit()` 绰号就足够了。然而，当在类外定义时，该函数需要其扩展名称 `Savings::deposit()`。\n\n## 成员函数的重载\n\
  \n成员函数的重载方式与普通函数的重载方式相同。（如果你忘记了它的意思，请参阅第 6 章。）但请记住，类名是扩展名称的一部分。因此，以下函数都是合法的：\n\n\
  ```cpp\nclass Student\n{\n  public:\n    // grade -- 返回当前的平均学点\n    double grade();\n\
  \    // grade -- 设置学点并返回之前的值\n    double grade(double newGPA);\n    // ...数据成员和其他其他内容...\n\
  };\n\nclass Slope\n{\n  public:\n    // grade -- 返回斜率的百分比成绩\n    double grade();\n\
  \    // ...这里也可以包含内容...\n};\n\n// grade - 返回数字成绩对应的字母等成绩\nchar grade(double value);\n\
  \nint main(int argcs, char* pArgs[])\n{\n    Student s;\n    s.grade(3.5);     \
  \   // Student::grade(double)\n    double v = s.grade(); // Student::grade()\n \
  \   char c = grade(v);   // ::grade(double)\n    Slope o;\n    double m = o.grade();\
  \ // Slope::grade()\n    return 0;\n}\n```\n\n从 `main()` 发出的每个调用都会在注释中用所调用函数的扩展名称进行标记。\n\
  \n在调用重载函数时，不仅是参数，而且调用该函数的对象类型（如果有）也被用于解析调用。（*resolve*（解析）一词是面向对象编程的术语，意为“在编译时决定调用哪个重载函数”。凡人可能会说“differentiate（区分）”。）\n\
  \n# 第 13 章\n\n# 指针与观察对象\n\n### 本章内容\n\n- 检查对象数组对象\n- 关于对象指针的几点提示\n- 强类型——对我们的指针变得挑剔\n\
  - 遍历对象列表\n\nC++ 程序员总是在生成各种东西数组——`ints` 数组、`doubles` 数组——那么为什么不创建学生数组呢？学生总是在排队——比他们愿意排队的次数要多得多。`Student`\
  \ 对象静静地排队等待名字被叫出来执行某些平庸的任务，这个概念太有吸引力，无法错过。\n\n## 声明对象数组\n\n对象数组的工作方式与简单变量数组的方式相同。（第\
  \ 7 章 介绍了简单——内置——变量数组的养护，而第 8 章和第 9 章 详细描述了简单指针。）以来自 ArrayOfStudents 程序的以下片段为例：\n\
  \n```cpp\n// ArrayOfStudents - 定义一个学生对象数组\n// 并访问其中的一个元素。此\n// 程序没有执行操作\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Student\n{\n  public:\n    int  semesterHours;\n    double gpa;\n    double\
  \ addCourse(int hours, double grade){return 0.0;}\n};\n\nvoid someFn()\n{\n    //\
  \ 声明一个包含 10 个学生的数组\n    Student s[10];\n    // 为第 5 个学生分配 4.0 的 gpa（幸运的家伙）\n   \
  \ s[4].gpa = 4.0;\n    s[4].semesterHours = 32;\n    // 为第 5 个学生增加另一课程；\n    //\
  \ 这次他挂格了——活有该\n    s[4].addCourse(3, 0.0);\n}\n```\n\n这里 `s` 是一个 `Student` 对象数组。`s[4]`\
  \ 指向数组中的第五个 `Student` 对象。此类推，`s[4]` 代表第五个 `Student` 对象。\n\n## 声明指向对象的指针\n\n对象的指针工作方式类似于简单类型的指针，如示例所示：\n\
  \n```cpp\n// ObjPtr - 定义一个指向对象的指针\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Student\n{\n  public:\n    int  semesterHours;\n\
  \    double gpa;\n    double addCourse(int hours, double grade);\n};\n\nint main(int\
  \ argc, char* pArgs[])\n{\n    Student s;\n    Student* pS = &s; // 创建指向 Student\
  \ 的指针\n    s.gpa = 3.0; // 设置 gpa\n    s.semesterHours = 32; // 设置学期学时\n    cout\
  \ << \"GPA: \" << pS->gpa << endl; // 输出 gpa\n    cout << \"Hours: \" << pS->semesterHours\
  \ << endl; // 输出学时\n    pS->addCourse(3, 4.0); // 调用成员函数\n    return 0;\n}\n```\n\
  \n`pS` 是一个指向 `Student` 对象的指针。`pS->gpa` 指向 `Student` 对象的 `gpa` 成员。`pS->addCourse(3,\
  \ 4.0)` 调用了成员函数。\n\n### 解引用对象指针\n\n类比简单变量指针，你可能认为以下代码是有效的：\n\n```cpp\nint main(int\
  \ argc, char* pArgs[])\n{\n    Student s;\n    Student* pS = &s; // 创建指向 s 的指针\n\
  \    pS.gpa = 3.5; // 这行无效\n    return 0;\n}\n```\n\n如注释所示，这是是无效的。问题在于点运算符 `.` 在指针运算符\
  \ `*` 之前求值。因此，需要括号来强制指针运算符在点运算符之前求值：\n\n```cpp\nint main(int argc, char* pArgs[])\n\
  {\n    Student s;\n    Student* pS = &s; // 创建指向 s 的指针\n    (*pS).gpa = 3.5; //\
  \ 这行有效\n    return 0;\n}\n```\n\n`*pS` 求值为为 `pS` 所指向的 `Student` 对象。`.gpa` 指向该对象的\
  \ `gpa` 成员。\n\n### 使用箭头指针\n\n使用星号运算符配合括号来解引用指针完全可行；然而，即使是最老练的技术人员也会承认，这种星号和括号的混合有些别扭。C++\
  \ 提供了一个更方便的运算符来访问对象的成员，以避免笨拙的对象指针表达式。`->` 运算符定义如下：\n\n`ps->gpa` 等同于 `(*pS).gpa`\n\
  \n这导致了：\n\n```cpp\nint main(int argc, char* pArgs[])\n{\n    Student s;\n    Student*\
  \ pS = &s; // 创建指向 s 的指针\n    pS->gpa = 3.5;\n    return 0;\n}\n```\n\n箭头运算符几乎专门用于此，因为它更易读；然而，两种形式是完全等价的。\n\
  \n\n\n\n\n# 使用对象值调用函数\n\n如你所知，当参数类型被标记了 `&` 属性时，C++ 通过引用将参数传递给函数（参见第 8 章）。然而，在默认情况下，C++\
  \ 通过值将参数传递给函数。（如果你坚持要确认这一点，可以检查这方面的第 6 章）。\n\n复杂的用户自定义类对象的传递方式与简单的 `int` 值相同，如下面的\
  \ `PassObjVal` 程序所示：\n\n```cpp\n// PassObjVal - 尝试在函数中更改对象的值\n// 当对象按值传递时，该操作会失败\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Student\n{\n  public:\n    int  semesterHours;\n    double gpa;\n};\n\n\
  void someFn(Student copyS)\n{\n    copyS.semesterHours = 10;\n    copyS.gpa    \
  \         = 3.0;\n    cout << \"The value of copyS.gpa = \"<<copyS.gpa<< endl;\n\
  }\n\nint main(int argc, char* pArgs[])\n{\n    Student s;\n    s.gpa = 0.0;\n  \
  \  // 在调用 someFn() 之前显示 s.gpa 的值\n    cout << \"The value of s.gpa = \" << s.gpa\
  \ << endl;\n    // 传递现有对象的地址\n    cout << \"Calling someFn(Student)\" << endl;\n\
  \    someFn(s);\n    cout << \"Returned from someFn(Student)\" << endl;\n    //\
  \ s.gpa 的值保持为 0\n    cout << \"The value of s.gpa = \" << s.gpa << endl;\n    //\
  \ 等待用户准备好后再终止程序\n    //以便用户看到程序结果\n    cout << \"Press Enter to continue...\" <<\
  \ endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n函数\
  \ `main()` 创建了一个对象 `s`，然后将 `s` 传递给函数 `someFn()`。![remember.eps](img/remember_fmt.png)\
  \ 传递的并不是 `s` 本身，而是 `s` 的拷贝。`someFn()` 中的对象 `copyS` 是 `main()` 中变量 `s` 的精确拷贝。由于它是拷贝，在\
  \ `someFn()` 中对 `copyS` 进行的任何更改对 `main()` 中的 `s` 都没有影响。执行此程序将产生以下可以理解但令人失望的结果：\n\
  \nThe value of s.gpa = 0\nCalling someFn(Student)\nThe value of copyS.gpa = 3\n\
  Returned from someFn(Student)\nThe value of s.gpa = 0\nPress Enter to continue...\n\
  \n## 使用对象指针调用函数\n\n大多数情况下，程序员希望在函数中进行的任何更改也能反映在调用函数中。为了这一点，C++ 程序员必须传递对象的地址或对象的引用。接下来的\
  \ `PassObjPtr` 程序使用了地址法：\n\n```cpp\n// PassObjPtr - 通过指针在函数中\n// 修改对象的内容\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nclass\
  \ Student\n{\n  public:\n    int semesterHours;\n    double gpa;\n};\n\nvoid someFn(Student*\
  \ pS)\n{\n    pS->semesterHours = 10;\n    pS->gpa = 3.0;\n    cout << \"The value\
  \ of pS->gpa = \" << pS->gpa << endl;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    Student s;\n    s.gpa = 0.0;\n    // 在调用 someFn() 之前显示 s.gpa 的值\n    cout\
  \ << \"The value of s.gpa = \" << s.gpa << endl;\n    // 传递现有对象的地址\n    cout <<\
  \ \"Calling someFn(Student*)\" << endl;\n    someFn(&s);\n    cout << \"Returned\
  \ from someFn(Student*)\" << endl;\n    // s.gpa 的值现在是 3.0\n    cout << \"The value\
  \ of s.gpa = \" << s.gpa << endl;\n    // 等待用户准备好后再终止程序\n    //以便用户看到程序结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n`someFn()` 参数的类型是一个指向 `Student` 对象的指针（也称为 `Student*`）。这体现在程序调用\
  \ `someFn()` 的方式上，它传递的是 `s` 的地址而不是 `s` 的值。给 `someFn()`  `s` 的地址允许它修改存储在该处的任何值。从概念上说，这类似于在纸张\
  \ `pS` 上写下房子 `s` 的地址，然后将那张纸传递给 `someFn()`。函数 `someFn()` 使用箭头语法对 `pS` 指针进行解引用。\n\n\
  `PassObjPtr` 的输出要令我满意得多（至少对我来说）：\n\nThe value of s.gpa = 0\nCalling someFn(Student*)\n\
  The value of pS->gpa = 3\nReturned from someFn(Student*)\nThe value of s.gpa = 3\n\
  Press Enter to continue...\n\n## 使用引用运算符调用函数\n\n第 6 章介绍了使用 `&` 运算符通过引用将简单参数类型传递给函数的概念。接下来的\
  \ `PassObjRef` 为用户自定义对象演示了相同的操作：\n\n```cpp\n// PassObjRef - 使用引用在函数中\n// 修改对象的内容\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\
  \nclass Student\n{\n  public:\n    int semesterHours;\n    double gpa;\n};\n\n//\
  \ 与之前相同，但这次使用了引用\nvoid someFn(Student& refS)\n{\n    refS.semesterHours = 10;\n\
  \    refS.gpa = 3.0;\n    cout << \"The value of refS.gpa = \" << refS.gpa << endl;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Student s;\n    s.gpa\
  \ = 0.0;\n    // 在调用 someFn() 之前显示 s.gpa 的值\n    cout << \"The value of s.gpa =\
  \ \" << s.gpa << endl;\n    // 传递现有对象的地址\n    cout << \"Calling someFn(Student*)\"\
  \ << endl;\n    someFn(s);\n    cout << \"Returned from someFn(Student&)\" << endl;\n\
  \    // s.gpa 的值现在是 3.0\n    cout << \"The value of s.gpa = \" << s.gpa << endl;\n\
  \    // 等待用户准备好后再终止程序\n    //以便用户看到程序结果\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  在这个示例中，C++ 传递的是 `s` 的引用而不是拷贝。该版本的输出与 `PassObjPtr` 相同——在 `someFn()` 中进行的更改被保留在 `main()`\
  \ 中。\n\n## 为什么要用指针或引用？\n\n好了，指针和引用都提供了相对的优势，但为什么要费心使用其中之一呢？为什么不总是传递对象？我在本章前面提到过一个显而见的答案：你无法从一个只得到拷贝的函数中修改该对象。\n\
  \n这是第二个原因：某些对象很大——我的意思是*真的*很大。一个表示屏幕图像的对象可能有几兆字节长。按值传递此类对象意味着将整个内容拷贝到函数的内存中。如果该函数调用了另一个函数，该对象将需要再次拷贝。一段时间后，你会有该对象的几十个拷贝。这会消耗内存，而且拷贝所有对象会让你的程序运行速度比启动\
  \ Windows 还慢。\n\n![warning.eps](img/warning_fmt.png) 拷贝对象的问题变得更糟糕。你在第 17 章中看到，拷贝对象可能比简单的移动某些内存更加痛苦。\n\
  \n传递指针（或引用）非常快。无论指向的对象有多大，指针都只有 4 字节。\n\n## 返回堆内存\n\n存在于简单指针类型也困扰着类对象指针。特别是，你必须确保你使用的指针实际上指向一个有效对象。例如，不要返回函数局部内定义对象的引用：\n\
  \n```cpp\nMyClass* myFunc()\n{\n    // 以下代码不起作用\n    MyClass mc;\n    MyClass* pMC\
  \ = &mc;\n    return pMC;\n}\n```\n\n从 `myFunc()` 返回后，`mc` 对象超出了作用域。`myFunc()` 返回的指针在调用函数中是无效。\n\
  \n\n\n\n\n![remember.eps](img/remember_fmt.png) 关于返回即将超出作用域的内存的问题在第 9 章进行了讨论。\n\n\
  在堆外分配对象可以解决这个问题：\n\n```cpp\nMyClass* myFunc()\n{\n    MyClass* pMC = new MyClass;\n\
  \    return pMC;\n}\n```\n\n在这里，堆外分配的内存不会在变量 `pMC` 超出作用域时被释放。\n\n![remember.eps](img/remember_fmt.png)\
  \ 如果程序员不希望内存在任何特定变量超出作用域时丢失，他们就会从堆上分配内存。程序员负责堆内存的分配和释放。\n\n### 分配堆上的对象\n\n也可以使用以下语法在堆外分配对象数组：\n\
  \n```cpp\nclass MyClass\n{\npublic:\n    int nValue;\n};\n\nvoid fn()\n{\n    MyClass*\
  \ pMC = new MyClass[5]\n    // 像普通数组一样引用单个成员\n    for (int i = 0; i < 5; i++)\n\
  \    {\n        pMC[i].nValue = i;\n    }\n    // 使用不同的 delete 关键字将内存\n    // 返回堆\n\
  \    delete[] pMC;\n};\n```\n\n注意，一旦分配，`pMC` 就可以像任何其他数组一样使用，其中 `pMC[i]` 指向 `MyClass`\
  \ 类型的第 `i` 个对象。同样请注意，你使用略有不同的关键字 `delete[]` 将类对象数组返回堆中。\n\n### 当自动为你分配内存时\n\n许多类（特别是第\
  \ 27 章中描述的容器）会为你管理堆内存。例如，`string` 类在内存中维护一个它在堆上分配的字符字符串。这些类的作者非常仔细地在所有正确的位置返回堆内存，以便编写类似下面的函数是安全的：\n\
  \n```cpp\nstring myFunc()\n{\n    string localString;\n    localString << cin;\n\
  \    return localString;\n}\n```\n\n对象 `localString` 在创建时分配了堆内存，但在函数结束超出作用域时仔细地返回了该内存。（你将在第\
  \ 16 章看到这种魔法是如何实现的。）\n\n## 接链表\n\n数组之后，第二种常见的结构被称为 `list`（列表）。列表有不同的尺寸和类型；然而，最常见的是\
  \ `linked list`（链表）。在链表中，每个对象都指向某种贯穿内存的“链”中的下一个成员。程序可以简单地将列表的最后一个元素指向一个对象，将其添加到列表中。这意味着用户不需要在程序开始时声明链表的大小——你只需断开链接即可从列表中添加或删除对象。此外，你可以通过改变链接来对链表的成员进行排序——而无需实际移动数据对象。\n\
  \n这种灵活性的代价是访问速度。例如，你不能像处理数组那样直接伸手抓取第十个元素。相反，你必须从列表开始，从一个对象到下一个对象链接十次。\n\n链表除了运行时可扩展性（这是好事）和随机访问对象的困难性（这是坏事）外，还有另一个特征：链表大量使用了指针。这使得链表成为一个可以为你提供操作指针变量经验的绝佳工具（这是非常好的）。\n\
  \n![tip.eps](img/tip_fmt.png) C++ 标准库提供了许多类型的列表。你可以在第 27 章中看到它们的运行情况；然而，自己实现第一个链表总是是好的，这样可以获得操作指针的练习。\n\
  \n并不是每个类都能用于创建链表。你按照如下所示声明一个可链类：\n\n```cpp\nclass LinkableClass\n{\n    public:\n\
  \        LinkableClass* pNext;\n        // 类的其他成员\n};\n```\n\n可链类的关键在于 `pNext` 指针。乍一看，这似乎确实奇怪——一个类包含一个指向自身的指针？实际上，`pNext`\
  \ 并不是指向它自己，而是指向同相同类型的另一个不同对象。\n\n链表类似于一群穿过马路的小学生组成的链条。`pNext` 指针对应于孩子伸出手并抓住旁边孩子的手。\n\
  \n在链表外部某处有一个指向列表第一个元素的指针，即 `head pointer`（头指针）。头指针仅仅是一个类型为 `LinkableClass*` 的指针，就像老师拉着链条中的第一个孩子一样。\n\
  \n![c++11_fmt.eps](img/c11_fmt.png) 始终将任何指针初始化为 `nullptr`，即不指向任何内容的指针，即非指针。\n\n\
  ```cpp\nLinkableClass* pHead = nullptr;\n```\n\n![warning.eps](img/warning_fmt.png)\
  \ 对于 '11 标准之前的 C++ 编译器，对于 `nullptr`，即不指向任何内容的指针，即非指针，使用 0。\n\n```cpp\nLinkableClass*\
  \ pHead = nullptr;\n```\n\n为了看到链表是如何工作的，请考虑以下函数，它将参数添加到列表的开头：\n\n```cpp\nvoid add(LinkableClass*\
  \ pNDS)\n{\n    // 将当前项指向列表的开头\n    pNDS->pNext = pHead;\n    // 将头指针指向当前项\n   \
  \ pHead = pNDS;\n}\n```\n\n在这里，`pNext` 指针指向列表的第一个成员。就像老师拉着链条中的第一个孩子一样。\n\n### 链表的其他操作\n\
  \n将对象添加到列表头部是最简单的操作。遍历列表元素可以更好地了解链表：\n\n```cpp\n// 遍历链表\nLinkableClass* pL = pHead;\n\
  while(pL)\n{\n    // 在此处执行某些操作\n    // 获取下一个\n    pL = pL->pNext;\n}\n```\n\n\n\n\
  \n```cpp\n// 如果输入的名字是 'exit'...\n\nif (name == \"exit\")\n{\n    // ...返回空指针以终止输入\n\
  \    return nullptr;\n}\n// 获取新条目并填充值\nNameDataSet* pNDS = new NameDataSet;\npNDS->sName\
  \ = name;\npNDS->pNext = nullptr; // 清零链接\n// 返回创建的对象的地址\nreturn pNDS;\n}\n\nint\
  \ main(int nNumberofArgs, char* pszArgs[])\n{\n    cout << \"读取学生姓名\\n\"\n     \
  \    << \"第一个名字时输入 'exit' 退出\"\n         << endl;\n    // 创建（另一个）NameDataSet 对象\n\
  \    NameDataSet* pNDS;\n    while (pNDS = getData())\n    {\n        // 将其添加到 NameDataSet\
  \ 对象列表中\n        add(pNDS);\n    }\n    // 为了显示这些对象，遍历列表\n    //（当下一个地址为 NULL 时停止）\n\
  \    cout << \"\\n 条目:\" << endl;\n    for(NameDataSet *pIter = pHead;\n       \
  \              pIter; pIter = pIter->pNext)\n    {\n        // 显示当前条目的姓名\n     \
  \   cout << pIter->sName << endl;\n    }\n    // 在终止程序前等待用户准备好\n    // 让用户看到程序结果\n\
  \    cout << \"按回车键继续...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n虽然 `LinkedListData` 程序有些冗长，但只要你分部分来理解，它是非常简单的。`NameDataSet`\
  \ 结构体有空间存储一个人的姓名，以及一个指向链表中下一个 `NameDataSet` 对象的链接。我之前提到过，在实际应用中，这个类会有其他成员。\n\n![tip.eps](img/tip_fmt.png)\
  \ 我使用了 `string` 类来包含人的姓名。虽然我直到第 27 章才会详细描述 `string` 类的所有方法，但它比以零结尾的字符字符串要用得多。在如今的大多数应用程序中，你会看到人们倾向于使用\
  \ `string` 类而不是字符字符串。`string` 类已经变得尽可能接近 C++ 语言中的内置类型了。\n\n`main()` 函数开始循环，在每次迭代中调用\
  \ `getData()` 以从用户处获取另一个 `NameDataSet` 条目。如果 `getData()` 返回空指针（即地址的“非地址”），程序将退出循环。\n\
  \n`getData()` 函数提示用户输入姓名并读取用户输入的任何内容。如果输入的字符串等于 `exit`，该函数向调用者返回空指针，从而退出 `while`\
  \ 循环。如果输入的字符串不是 `exit`，程序会创建一个新的 `NameDataSet` 对象，填充姓名，并将 `pNext` 指针置零。\n\n![remember.eps](img/remember_fmt.png)\
  \ 永远不要让链接指针处于未初始化状态。使用老程序员的迷信：“如果不确定，就把它清零。”（我的意思是“老老话”，而不是“老妻子的故事”。）\n\n最后，`getData()`\
  \ 返回对象的地址给 `main()`。\n\n`main()` 将 `getData()` 返回的每个对象添加到由全局变量 `pHead` 指向的链表开头。当\
  \ `getData()` 返回空指针时，控制权退出初始 `while` 循环。然后 `main()` 进入第二个部分，遍历完成后的列表并显示每个对象。\n\n\
  这次我使用了一个 `for` 循环，其功能与之前的 `while` 循环等效。`for` 循环通过赋值 `pIter = pHead` 将迭代指针 `pIter`\
  \ 指向列表中的第一个元素。接着检查 `pIter` 是否为空，当列表耗尽时，它将为空。然后进入循环。在 `for` 循环的每次循环中，第三个子句通过赋值 `pIter\
  \ = pIter->pNext` 将 `pIter` 从一个对象移动到下一个对象，然后重复测试和循环体。这种模式通用于所有列表类型。\n\n程序示例运行的输出所示：\n\
  \n```\n读取学生姓名\n第一个名字时输入 'exit' 退出\n输入姓名:Randy\n输入姓名:Loli\n输入姓名:Bodi\n输入姓名:exit\n\
  条目:\nBodi\nLoli\nRandy\n按回车键继续...\n```\n\n![tip.eps](img/tip_fmt.png) 程序输出姓名的顺序与输入的顺序相反。这是因为每个新对象都被添加到列表的开头。或者，程序也可以将每个对象添加到列表的末尾——这只需要多一点代码。我在网站上的程序中包含了这样一个版本。它被称为\
  \ `LinkedListForward`，它将新添加的对象链接到列表末尾，使得列表输出顺序与输入顺序一致。唯一的区别在于 `add()` 函数。在偷看我的答案之前，看看你是否能创建这个正向版本。\n\
  \n## 一线希望之光：与 C++ 库链接的容器列表\n\n我相信每个人都应该先走路后跑步，在在使用计算器之前应该学会如何在头脑中进行算术，并且在使用别人写的列表类之前应该写一个链表程序。尽管如此，在第\
  \ 27 章，我将介绍 C++ 环境提供的列表类。\n\n## 第 14 章\n\n# 保护成员：请勿打扰\n\n### 本章内容\n\n- ![arrow](img/arrow.png)\
  \ 保护成员\n- ![arrow](img/arrow.png) 在类内部访问保护成员\n- ![arrow](img/arrow.png) 从外部访问保护成员\n\
  \n第 12 章介绍了类的概念。该章将 `public` 关键字描述为类声明的一部分——在本章中，你发现 `public` 的替代方案。\n\n## 保护成员\n\
  \n类的成员可以标记为 `protected`，这意味着它们在类外部是不可访问的。替代方案是将成员设置为 `public`。公共成员对所有人可见。\n\n![remember.eps](img/remember_fmt.png)\
  \ 请从弱的意义上理解“不可访问”。任何程序员都可以进入源代码，移除 `protected` 关键字并随心所欲。此外，任何有本事的黑客都可以进入保护区域。`protected`\
  \ 关键字的设计是为了防止无意访问来保护程序员自己。\n\n### 为什么你需要保护成员\n\n为了理解 `protected` 的作用，请思考面向对象的目标：\n\
  \n- **保护类内部不受外部函数的干扰**。例如，假设你计划构建一个软件微波炉，为它提供一个简单的外部接口，然后给它套上盒子以防止他人干扰内部。`protected`\
  \ 关键字就是那个盒子。\n- **让类负责维护其内部状态**。如果其他人可以伸手操纵其内部，那么要求类负责是不公平的（这远比要求我为弄乱微波炉内部布线造成的后果负责更不公平）。\n\
  - **限制类与外部世界的接口**。一个接口有限（公共成员）的类更容易理解和使用。保护成员对用户是隐藏的，不需要学习。接口就是类；这被称为`抽象`（更多关于抽象的内容见第\
  \ 11 章）。\n- **减少类与其他代码之间的耦合性**。通过限制耦合，你可以更轻松地替换一个类或在其他程序中使用该类。\n\n现在，我知道那些非面向对象类型的人在说什么：“你不需要什么花哨的功能来实现这一切。只需要制定一个规则，规定某些成员是公开访问的，而另一些不是。”\n\
  \n\n\n\n虽然这在理论上是正确的，但在实践中并不行。人们起初都抱着良好的意图，但只要语言至少不阻止直接访问保护成员，这些良好的意图就会在交付产品的压力下化之无形。\n\
  \n### 发现保护成员是如何运作的\n\n默认情况下，类的成员是受保护的（protected），这意味着它们无法被类的非成员函数访问。在类中添加 `public`\
  \ 关键字会使后续成员变为公有的（public），这意味着它们可以被非成员函数访问。添加 `protected` 关键字则使类的后续成员变为受保护的。你可以根据需要频繁地在\
  \ `public` 和 `protected` 之间进行切换。\n\n假设你有一个名为 `Student` 的类。在这个示例中，一个功能完全且正直的 `Student`\
  \ 仅需要以下功能（注意，这里没有 `spendMoney()` 和 `drinkBeer()` ——这是一个高度理想化的学生）：\n\n*   `addCourse(inthours,\
  \ double grade)` — 添加课程\n*   `grade()` — 返回当前的平均学分\n*   `hours()` — 返回获得毕业所需的累积学时\n\
  \n`Student` 的其余成员可以声明为 `protected`，以防止其他函数的窥探干扰到 `Student` 的事务。\n\n```cpp\nclass\
  \ Student\n{\n  public:\n    // grade - 返回当前的平均学分\n    double grade() { return gpa;}\n\
  \    // hours - 返回学期学时\n    int hours() {  return semesterHours; }\n    // addCourse\
  \ - 向学生的记录中添加课程\n    double addCourse(int hours, double grade);\n    // 以下成员对外部不可访问\n\
  \  protected:\n    int semesterHours; // 获得毕业所需的学时\n    double gpa; // 平均学分\n};\n\
  ```\n\n现在，成员 `hours` 和 `gpa` 只能由 `Student` 的成员函数访问。因此，以下代码无法运行：\n\n```cpp\nStudent\
  \ s;\nint main(int argcs, char* pArgs[])\n{\n// 提高我的分数（不要弄得太高；否则没人会相信）\ns.gpa =\
  \ 3.5;    <- 产生编译器错误\ndouble gpa = s.grade();//这个公有函数读取了值的副本，但你\nreturn 0;     \
  \  // 无法在这里进行修改\n}\n```\n\n应用程序尝试更改 `gpa` 值的行为会被编译器错误标记。\n\n![technicalstuff.eps](img/technicalstuff.png)\
  \ 类成员也可以通过声明为 `private` 来使其受保护。在本书中，我专门使用 `protected` 关键字。`private` 和 `protected`\
  \ 之间的区别与继承有关，这将在第 19 章中介绍。\n\n## 为保护成员辩护\n\n现在你已经多了解了一些关于如何在实际类中使用保护成员的知识，我可以重新阐述这些论点了。\n\
  \n### 保护类的内部状态\n\n将 `gpa` 成员设为 `protected` 可以防止应用程序将平均学分设置为任意值。应用程序可以添加课程，但不能直接更改平均学分。\n\
  \n如果应用程序有正需要直接设置平均学分，类可以为此目的提供一个成员函数，如下所示：\n\n```cpp\nclass Student\n{\n  public:\n\
  \    // 与之前相同\n    double grade() { return gpa; }\n    // 在这里我们允许更改学分\n    double\
  \ grade(double newGPA)\n    {\n      double oldGPA = gpa;\n      // 只有当新值有效时\n \
  \     if (newGPA > 0 && newGPA <= 4.0)\n      {\n        gpa = newGPA;\n      }\n\
  \      return oldGPA;\n    }\n    // ...其他内容保持相同，包括数据成员\n  protected:\n    int semesterHours;\
  \ // 获得毕业所需的学时\n    double gpa;\n};\n```\n\n成员函数 `grade(double)` 的添加允许应用程序设置 `gpa`。然而，注意，类并没有放弃控制权。应用程序不能将\
  \ `gpa` 设置为任何旧值；只接受合法范围（0 到 4.0）内的 `gpa`。因此，`Student` 类在提供内部数据成员访问权限的同时，并没有放弃其确保类内部状态有效的责任。\n\
  \n### 使用具有有限接口的类\n\n类提供有限的接口。要使用一个类，你只需要知道它的公有成员以及它们的功能和参数。这可以大大减少你需要掌握和记住使用该类的内容。\n\
  \n随着条件的改变或 Bug 的发现，你希望能够更改类的内部工作机制。如果你可以隐藏类的内部工作机制，对这些细节的更改就不太需要更改外部应用程序代码。\n\n\
  第二个，也许更重要的原因在于人类在任何给定时刻在大脑中记住大量事物的能力是的。使用严格定义的类接口允许程序员忘记其背后的运行细节。同样，构建类的程序员也不需要以完全相同的程度集中在每一个具体函数是如何被使用的上。\n\
  \n## 让非成员函数访问保护成员\n\n偶尔，你希望非成员函数能够访问类的保护成员。你可以通过使用 `friend` 关键字将函数声明为类的“朋友”（友元）来实现这一点。\n\
  \n`friend` 声明出现在包含保护成员的类中。`friend` 声明类似于原型声明，因为它包含了扩展名称和返回类型。在接下来的示例中，函数 `initialize()`\
  \ 现在可以访问 `Student` 中的任何想要的内容：\n\n```cpp\nclass Student\n{\n  friend void initialize(Student*);\n\
  \  public:\n    // 与之前相同的公有成员...\n  protected:\n    int semesterHours; // 获得毕业所需的学时\n\
  \    double gpa;\n};\n\n// 以下函数是 Student 的朋友\n// 所以它可以访问保护成员\nvoid initialize(Student\
  \ *pS)\n{\n  pS->gpa = 0;    // 这现在是合法的...\n  pS->semesterHours = 0; // 而以前是不合法的\n\
  }\n```\n\n一个函数可以同时声明为两个类的朋友。虽然这可能很方便，但它倾向于将类耦合在一起。这种类的耦合通常被认为是不好的，因为它使一个类依赖于另一个类。然而，如果类自然地属于在一起，那么并不坏，如下所示：\n\
  \n```cpp\nclass Student; // 前向声明\nclass Teacher\n{\n  friend void registration(Teacher&\
  \ t, Student& s);\n  public:\n    void assignGrades();\n  protected:\n    int noStudents;\n\
  \    Student *pList[100];\n};\n\nclass Student\n{\n  friend void registration(Teacher&\
  \ t, Student& s);\n  public:\n    // 与之前相同的公有成员...\n  protected:\n    Teacher *pT;\n\
  \    int semesterHours; // 获得毕业所需的学时\n    double gpa;\n};\n\nvoid registration(Teacher&\
  \ t, Student& s)\n{\n  // 初始化 Student 对象\n  s.semesterHours = 0;\n  s.gpa = 0;\n\
  \  // 如果有空间...\n  if (t.noStudents < 100)\n  {\n    //将其添加到列表末尾\n    t.pList[t.noStudents]\
  \ = &s;\n    t.noStudents++;\n  }\n}\n```\n\n\n\n\n```cpp\nclass Teacher\n{\n  \
  \  // ...other members as well...\npublic:\n    void assignGrades();\n};\n\nclass\
  \ Student\n{\n    friend void Teacher::assignGrades();\npublic:\n    // same public\
  \ members as before...\nprotected:\n    int semesterHours; // hours earned toward\
  \ graduation\n    double gpa;\n};\n\nvoid Teacher::assignGrades()\n{\n    // can\
  \ access protected members of Teacher from here\n}\n```\n\n与非成员函数的示例不同，成员函数 `assignGrades()`\
  \ 必须在类 `Student` 声明其为友元之前先声明。\n\n整个类可以被声明为另一个类的友元。这样做的效果使得该类的每个成员函数都是友元：\n\n```cpp\n\
  class Student;   // forward declaration\n\nclass Teacher\n{\n  protected:\n    int\
  \ noStudents;\n    Student *pList[100];\n  public:\n    void assignGrades();\n};\n\
  \nclass Student\n{\n    friend class Teacher; // make entire class a friend\npublic:\n\
  \    // same public members as before...\nprotected:\n    int semesterHours; //\
  \ hours earned toward graduation\n    double gpa;\n};\n```\n\n现在，`Teacher` 的任何成员函数都可以访问\
  \ `Student` 的保护成员。将一个类声明为另一个类的友元会将这两个类密不可分地绑定在一起。\n\n# 第 15 章\n\n# “你为什么要这样建立我，却又要毁了我，宝贝？”\n\
  \n### 本章内容\n\n- 创建和销毁对象\n- 声明构造函数和析构函数\n- 调用构造函数和析构函数\n\n程序中的对象就像现实世界中的物体一样被构建和废弃。如果一个类要对自己的健康负责，它必须对这个过程有一定的控制力。幸运的是（我猜其中包含了一些规划），C++\
  \ 恰恰提供了正确的机制。首先，我们需要讨论什么是创建一个对象。\n\n## 创建对象\n\n有些人在使用 `class` 和 `object` 这两个术语时有点粗心。它们之间的区别是什么？关系是什么？\n\
  \n我可以创建一个 `Dog` 类，用来描述人类最好朋友的相应属性。在我家里，有两只狗。因此，我的单个类 `Dog` 有两个实例：`Jack` 和 `Scruffy`。（嗯，我*认为*有两个实例——我已经好几天没见过\
  \ Scruffy 了。）\n\n类描述的是一种事物。对象是这些事物中的一个。对象是类的实例。无论我有多少只狗，都只有一个 `Dog` 类。\n\n对象会被创建和销毁，但类仅仅是存在。我的宠物来来去去，但（抛开进化不谈）`Dog`\
  \ 类是永恒的。\n\n不同类型的对象在不同的时间被创建。`全局对象`在程序首次开始执行时创建。`局部对象`在程序遇到它们的声明时创建。\n\n全局对象是在函数外部声明的对象。局部对象是在函数内部声明的对象，因此，它是该函数的局部的。在接的示例中，变量\
  \ `me` 是全局的，而变量 `notMe` 是函数 `pickOne()` 的局部变量：\n\n```cpp\nint me = 0;\n\nvoid pickOne()\n\
  {\n    int notMe;\n}\n```\n\n根据规则，全局对象在程序开始执行时初始化为全零。声明为局对象的对象没有特定的初始值。让所有数据成员处于随机状态对于所有类来说可能并不是一个有效条件。\n\
  \nC++ 允许类定义一个特殊的成员函数，该函数在类类的对象创建时自动被调用。这个成员函数被称为“构造函数”，它将对象初始化为有效的初始状态。此外，类可以定义一个析构函数来处理对象的销毁。这两个函数是本章的主题。\n\
  \n## 使用构造函数\n\n构造函数是在对象创建时自动调用的成员函数。它的主要工作是将对象初始化为该类法的初始值。（其余成员函数的工作是确保对象的状态保持合法。）\n\
  \n构造函数的名称与类相同，以便与类的其他成员区分开来。C++ 的设计者本可以使用不同的规则，例如：“构造函数必须命名为 `init()`。”只要编译器能够识别构造函数，这就没有区别。此外，构造函数没有返回值，甚至连\
  \ `void` ，因为它只被自动调用——如果构造函数返回了某些值，就没有地方放置它。构造函数不能被手动调用。\n\n### 构造单个对象\n\n有了构造函数后，`Student`\
  \ 类如下：\n\n```cpp\n// Constructor - invokes a constructor\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n{\n \
  \ public:\n    Student()\n    {\n        cout << \"constructing student\" << endl;\n\
  \        semesterHours = 0;\n        gpa = 0.0;\n    }\n    // ...other members...\n\
  \  protected:\n    int semesterHours;\n    double gpa;\n};\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    cout << \"Creating new object\" << endl;\n    Student\
  \ s;\n    cout << \"Creating new object off the heap\" << endl;\n    Student* p\
  \ = new Student;\n    // wait until user is ready before terminating\n    // to\
  \ allow the user to see the results\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  在声明 `s` 的点，编译器插入了对 `Student()` 的调用。从堆上分配一个 `Student` 相同的效果，输出所示：\n\n```\nCreating\
  \ new object\nconstructing student\nCreating new object off the heap\nconstructing\
  \ student\nPress Enter to continue...\n```\n\n这个简单的构造函数是写成内联函数的。构造函数也可以写成定义函数，如下所示：\n\
  \n```cpp\nclass Student\n{\n  public:\n    Student();\n    // ...other members...\n\
  \  protected:\n    int semesterHours;\n    double gpa;\n};\n\nStudent::Student()\n\
  {\n```\n\n### 构造多个对象\n\n数组的每个元素都必须单独构造。例如，接的 `ConstructArray` 程序通过声明一个单元素数组创建了五个\
  \ `Student` 对象：\n\n```cpp\n// ConstructArray - invokes a constructor on an array\
  \ of objects\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Student\n{\n  public:\n    Student()\n    {\n        cout\
  \ << \"constructing student\" << endl;\n    }\n};\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    cout << \"Creating an array of 5 Student objects\" <<\
  \ endl;\n    Student s[5];\n    // wait until user is ready before terminating\n\
  \    // to allow the user to see the results\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  执行该程序产生如下输出：\n\n```\nCreating an array of 5 Student objects\nconstructing student\n\
  constructing student\nconstructing student\nconstructing student\nconstructing student\n\
  Press Enter to continue...\n```\n\n### 构造复用对象\n\n如果一个类包含一个作为另一个类对象的数据成员，那么该类的构造函数也会被自动调用。考虑接的\
  \ `ConstructMembers` 示例程序。我添加了输出语句，以便你可以看到对象调用的顺序。\n\n```cpp\n// ConstructMembers\
  \ - the member objects of a class\n// are each constructed before the\n// container\
  \ class constructor gets\n```\n\n\n\n\n\n```cpp\n//                  尝试运行一下\n\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Course\n{\n  public:\n    Course(){ cout << \"constructing course\" << endl;}\n\
  };\n\nclass Student\n{\n  public:\n    Student()\n    {\n        cout << \"constructing\
  \ student\" << endl;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n  protected:\n\
  \    int  semesterHours;\n    double gpa;\n};\n\nclass Teacher\n{\n  public:\n \
  \   Teacher(){cout << \"constructing teacher\" << endl;}\n  protected:\n    Course\
  \ c;\n};\n\nclass TutorPair\n{\n  public:\n    TutorPair()\n    {\n        cout\
  \ << \"constructing tutorpair\" << endl;\n        noMeetings = 0;\n    }\n  protected:\n\
  \    Student student;\n    Teacher teacher;\n    int   noMeetings;\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    cout << \"Creating TutorPair object\"\
  \ << endl;\n    TutorPair tp;\n    // wait until user is ready before terminating\
  \ program\n    // to allow the user to see the program results\n    cout << \"Press\
  \ Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n执行此程序会产生以下输出：\n\n```text\nCreating TutorPair object\n\
  constructing student\nconstructing course\nconstructing teacher\nconstructing tutorpair\n\
  Press Enter to continue...\n```\n\n在 `main` 中创建对象 `tp` 会自动调用 `TutorPair` 的构造函数。然而，在控制传递到\
  \ `TutorPair` 构造函数体之前，两个成员对象 `student` 和 `teacher` 的构造函数会被调用。\n\n`Student` 的构造函数首先被调用，因为它是先声明的。然后调用\
  \ `Teacher` 的构造函数。\n\n`Course` 类的成员 `Teacher.c` 是作为构建 `Teacher` 对象的一部分被构造的。`Course`\
  \ 构造函数首先执行。类中的每个对象在调用类构造函数之前必须先完成自身的构造。否则，主构造函数将不知道其数据成员的状态。\n\n在所有成员数据对象构造完成后，控制返回到左大括号，允许\
  \ `TutorPair` 的构造函数构造对象的剩余部分。\n\n## 剖析析构函数\n\n对象会被创建一样，也会被销毁（灰归尘，尘归土）。如果一个类可以有一个构造函数来设置内容，它也应该有一个特殊的成员函数来拆解对象。这个成员被称为**析构函数**（destructor）。\n\
  \n### 为什么你需要析构函数\n\n类可能会在构造函数中分配资源；这些资源在对象消失之前需要被释放。例如，如果构造函数打开了一个文件，那么在离开该类或程序之前需要关闭文件。或者，如果构造函数从堆上分配了内存，必须在对象消失之前释放这些内存。析构函数允许类自动执行这些清理任务，而不需要依赖应用程序调用相应的成员函数。\n\
  \n### 使用析构函数\n\n析构函数的名称与类名相同，但在前面添加了一个波浪号（`~`）。（C++ 又在耍小聪明了——波浪号是逻辑非运算符的符号。懂了吗？析构函数就是“非构造函数”。真聪明。）和构造函数一样，析构函数没有返回值。例如，添加了析构函数的\
  \ `Student` 类显示如下：\n\n```cpp\nclass Student\n{\n  public:\n    Student()\n    {\n\
  \        semesterHours = 0;\n        gpa = 0.0;\n    }\n    ~Student()\n    {\n\
  \        // ...在此处返回任何资源...\n    }\n  protected:\n    int  semesterHours;\n    double\
  \ gpa;\n};\n```\n\n析构函数在对象被销毁时自动调用，或者用 C++ 的术语来说，当对象被 `destructed`（析构）时。这听起来有点循环（“当对象被析构时，析构函数被调用”），所以我之前一直避免使用这个词。对于堆内存，你也可以说“当对象超出作用域时”。局部对象在函数返回时超出作用域。全局或静态对象在程序结束时超出作用域。\n\
  \n但堆内存呢？在堆上分配的对象在通过 `delete` 命令返回到堆时会被析构。这在接下来的 `DestructMembers` 程序中展示了这一点：\n\n\
  ```cpp\n//  DestructMembers - 此程序同时构造并\n//                  析构一组数据成员\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Course\n{\n  public:\n    Course()  { cout << \"constructing course\" << endl;\
  \ }\n    ~Course() { cout << \"destructing course\" << endl;  }\n};\n\nclass Student\n\
  {\n  public:\n    Student() { cout << \"constructing student\" << endl;}\n    ~Student()\
  \ { cout << \"destructing student\" << endl; }\n};\n\nclass Teacher\n{\n  public:\n\
  \    Teacher()\n    {\n        cout << \"constructing teacher\" << endl;\n     \
  \   pC = new Course;\n    }\n    ~Teacher()\n    {\n        cout << \"destructing\
  \ teacher\" << endl;\n    }\n  protected:\n    Course* pC;\n};\n\nclass TutorPair\n\
  {\n  public:\n    TutorPair()\n    {\n        cout << \"constructing tutorpair\"\
  \ << endl;\n        noMeetings = 0;\n    }\n    ~TutorPair()\n    {\n        cout\
  \ << \"destructing tutorpair\" << endl;\n    }\n  protected:\n    Student student;\n\
  \    Teacher teacher;\n    int   noMeetings;\n};\n```\n\n（注：在原文中，`pC` 在 `Teacher`\
  \ 中使用但未在保护区域中声明；我添加了 `Course* pC;` 以确保代码逻辑有效，同时保持内容的意图。）\n\n```cpp\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    cout << \"Creating TutorPair object\"\
  \ << endl;\n    TutorPair tp;\n    // 等到用户准备就绪再终止程序\n    // 以允许用户看到程序结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n执行此程序会产生以下输出：\n\n```text\nCreating TutorPair object\n\
  constructing student\nconstructing course\nconstructing teacher\nconstructing tutorpair\n\
  Press Enter to continue...\n```\n\n在 `main` 中创建对象 `tp` 会自动调用 `TutorPair` 的构造函数。然而，在控制传递到\
  \ `TutorPair` 构造函数体之前，两个成员对象 `student` 和 `teacher` 的构造函数会被调用。\n\n`Student` 的构造函数首先被调用，因为它是先声明的。然后调用\
  \ `Teacher` 的构造函数。\n\n`Course` 类的成员 `Teacher.c` 是作为构建 `Teacher` 对象的一部分被构造的。`Course`\
  \ 构造函数首先执行。类中的每个对象在调用类构造函数之前必须先完成自身的构造。否则，主构造函数将不知道其数据成员的状态。\n\n\n\n\n\n### 本章内容\n\
  \n- 带有参数的构造函数\n- 构造函数的重载\n- 使用构造函数创建对象\n- 调用成员构造函数\n- 构造与析构的顺序\n\n类代表了现实世界中的一种对象类型。例如，在之前的章节中，我使用\
  \ `Student` 类来表示学生的属性。就像学生一样，类是自主的。与学生不同，类负责于自己的照顾和喂养——类必须始终保持自己处于有效状态。\n\n第 15\
  \ 章节中介绍的默认构造函数并不总是够用的。例如，默认构造函数可以将学生 ID 初始化为 0，这样它就不会包含一个随机值；然而，ID 为 0 的 `Student`\
  \ 可能是无效的。\n\nC++ 程序员需要一种能够接受某种类型参数的构造函数，以便将对象初始化为除默认值以外的其他值。本章将介绍带参数的构造函数。\n\n##\
  \ 为构造函数配置参数\n\nC++ 允许程序员定义带有参数的构造函数，如下：\n\n```cpp\nclass Student\n{\npublic:\n \
  \   Student(const char *pName);\n    // ...类继续...\n};\n```\n\n### 使用构造函数\n\n从概念上说，添加参数的想法非常简单。构造函数是一个成员函数，而成员函数可以拥有参数。因此，构造函数也可以拥有参数。\n\
  \n但请记住，你不能像调用普通函数那样调用构造函数。因此，向构造函数传递参数的唯一时刻是在创建时。例如，以下程序通过调用 `Student(const char*)`\
  \ 构造函数创建了 `Student` 类的对象 `s`。当函数 `main()` 返回时，对象 `s` 被析构。\n\n```cpp\n//  ConstructorWArg\
  \ - 类可以将参数传递\n//                给成员的构造函数\n\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n    Student(const\
  \ char* pName)\n    {\n        cout << \"constructing Student \" << pName << endl;\n\
  \        name = pName;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n\
  \  // ...其他公共成员...\n  protected:\n    string  name;\n    int     semesterHours;\n\
  \    double  gpa;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    // 在栈上创建一个学生，在堆上创建一个\n\
  \    Student s1(\"Jack\");\n    Student* pS2 = new Student(\"Scruffy\");\n    //\
  \ 确保删除堆上的学生\n    delete pS2;\n    // 在终止程序前等待用户准备好\n    // 让用户看到程序的运行结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n这里的 `Student` 构造函数看起来与第 15 章节所示的构造函数相同，但增加了 `const char**`\
  \ 参数 `pName`。构造函数将数据成员初始化为空的启动值，但数据成员 `name` 除外，它从 `pName` 获取初始值，因为一个没有名字的 `Student`\
  \ 对象不是有效的学生。\n\n对象 `s1` 在 `main()` 中被创建。传递给构造函数的参数出现在 `s1` 的声明中，紧挨着对象的名称。因此，在此声明中，学生\
  \ `s1` 被命名为 `Jack`。\n\n在紧接着的一行在堆上分配了第二个学生。在这种情况下，构造函数的参数出现在类名旁边。\n\n程序中的第三行可执行代码在退出程序之前将新分配的对象返回给堆。这可能不是必要的；例如，Windows\
  \ 或 Unix 在程序终止时关闭你可能打开的任何文件并返回所有堆内存，即使你忘记手动这样做。然而，在完成后删除你的堆内存是一个良好的习惯。\n\n构造函数声明\
  \ `Student::Student(const char*)` 中的 `const` 是必要的，它允许像下面的语句执行：\n\n```cpp\nStudent\
  \ s1(\"Jack\");\n```\n\n“Jack”的类型是 `const char*`。我不能将一个指向常量字符字符串的指针传递给声明为 `Student(char*)`\
  \ 的构造函数。以这种方式声明的函数（包括构造函数）可能会尝试修改字符字符串，这将不好。你不能剥离声明中的 `const` 部分。\n\n然而，你可以添加 `const`\
  \ 属性，如下所示：\n\n```cpp\nvoid fn(char* pName)\n{\n    // 即使构造函数声明为 Student(const char*)\n\
  \    // 也是允许的\n    Student s(pName);\n    // ...执行任何操作...\n}\n```\n\n函数 `fn()` 将一个\
  \ `char**` 字符串传递给一个承诺将字符串视为常量的构造函数。这没有大碍！\n\n## 对木工提出过高的要求：重载构造函数\n\n我可以在本章中在构造函数与其他更普通的成员函数之间做另一个类比：构造函数可以被重载。\n\
  \n重载函数意味着定义两个具有相同短名称但参数类型不同的函数。有关函数重载的最新消息，请参见第 6 章节。\n\nC++ 根据声明中的参数选择合适的构造函数。例如，`Student`\
  \ 类可以同时拥有以下片段所示的三个构造函数：\n\n```cpp\n//  OverloadConstructor - 为类提供多种\n//  创建对象的方法\n\
  \n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <string>\n\
  \nusing namespace std;\n\nclass Student\n{\npublic:\n    Student()\n    {\n    \
  \    cout << \"constructing Student No Name\" << endl;\n        name = \"No Name\"\
  ;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n    Student(const char\
  \ *pName)\n    {\n        cout << \"constructing Student \" << pName << endl;\n\
  \        name = pName;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n\
  \    Student(const char *pName, int xfrHours, float xfrGPA)\n    {\n        cout\
  \ << \"constructing Student \" << pName << endl;\n        name = pName;\n      \
  \  semesterHours = xfrHours;\n        gpa = xfrGPA;\n    }\nprotected:\n    string\
  \  name;\n    int     semesterHours;\n    float   gpa;\n};\n\nint main(int argcs,\
  \ char* pArgs[])\n{\n    // 以下代码调用了三个构造函数\n    Student noName;\n    Student freshman(\"\
  Marian Haste\");\n    Student xferStudent(\"Pikup Andropov\", 80, 2.5);\n    //\
  \ 在终止程序前等待用户准备好\n    // 让用户看到程序的运行结果\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  \n\n\n\n// ConstructorWDefaults - 多个构造函数通常与默认参数的定义结合\n\n```cpp\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n\
  {\n  public:\n    Student(const char *pName = \"No Name\",\n            int xfrHours\
  \ = 0,\n            double xfrGPA = 0.0)\n    {\n        cout << \"constructing\
  \ student \" << pName << endl;\n        name = pName;\n        semesterHours = xfrHours;\n\
  \        gpa = xfrGPA;\n    }\n  protected:\n    string name;\n    int semesterHours;\n\
  \    double gpa;\n};\n```\n\n...其余相同...\n\n现在所有三个对象都使用同一个构造函数构造；对于 `noName` 和 `freshman`\
  \ 中不存在的参数，提供了默认值。\n\n![c++11_fmt.eps](img/c11_fmt.png) 2011 标准中添加的一种更灵活的替代方案是从一个构造函数调用另一个构造函数，如\
  \ `ConstructorsCallingEachOther` 所示。这被称为`委托构造函数（delegating constructors）：`\n\n//\
  \ ConstructorsCallingEachOther - 2011 年新增，一个构造函数可以调用同一类中的另一个构造函数\n\n```cpp\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Student\n{\n  public:\n    Student(const char *pName,\n            int xfrHours,\n\
  \            double xfrGPA)\n    {\n        cout << \"constructing student \" <<\
  \ pName << endl;\n        name = pName;\n        semesterHours = xfrHours;\n   \
  \     gpa = xfrGPA;\n    }\n    Student() : Student(\"No Name\", 0, 0.0) {}\n  \
  \  Student(const char *pName): Student(pName, 0, 0.0){}\n  protected:\n    string\
  \ name;\n    int semesterHours;\n    double gpa;\n};\n```\n\n...其余与之前相同...\n\n在这里，声明\
  \ `Student noName` 调用了无参数构造函数，该构造函数转而调用了通用构造函数并提供默认参数。`Student freshman` 声明调用了 `Student(const\
  \ char*)*)` 构造函数。\n\n这种方式更加灵活，因为你可以设置最后一个参数以外的默认参数。此外，你对参数如何设置默认值有更多的控制权。例如，构造一个有学期时但没有\
  \ GPA 的学生是没有意义的。这个版本将不允许构造此类对象，因为没有提供 `Student(const char*, int)`。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当你读到本章末尾时，这种有些怪异的语法将会显得合理得多。\n\n## 默认构造函数\n\n对于 C++ 而言，每个类都必须有一个构造函数；否则，你就无法创建该类的对象。如果你没有为你的类提供构造函数，C++\
  \ 可能会直接生成一个错误，但它并没有这样做。为了与无视构造函数的现有 C 代码兼容，C++ 会自动提供一个默认构造函数（某种“默认的默认构造函数”）。\n\n\
  如果你为自己的类定义了构造函数，C++ 就不会自动提供默认构造函数了。通过创建一个构造函数，作者实际上是在告诉 C++ 默认构造函数是不够的。\n\n下面的代码片段有助于说明这一点。这是合法的：\n\
  \n```cpp\nclass Student\n{\n    string name;\n};\n\nint main(int argcs, char* pArgs[])\n\
  {\n    Student noName;\n    return 0;\n}\n```\n\n自动提供的默认构造函数调用默认的 `string` 构造函数来创建一个空的\
  \ `name` 对象。下面的代码片段无法正常编译：\n\n```cpp\nclass Student\n{\n  public:\n    Student(const\
  \ char *pName) {name = pName;}\n    string name;\n};\n\nint main(int argcs, char*\
  \ pArgs[])\n{\n    Student noName; // 无法编译\n    return 0;\n}\n```\n\n看似无害的添加 `Student(const\
  \ char*)` 构造函数会导致 C++ 无法提供用于构建对象 `noName` 的 `Student()` 构造函数。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ C++ '11 标准允许通过新关键字 `default` “找回默认构造函数”，如下：\n\n```cpp\nclass Student\n{\n  public:\n\
  \    Student(const char *pName) { name = pName; }\n    Student() = default;\n  \
  \  string name;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student noName;\n\
  \    return 0;\n}\n```\n\n`default` 关键字实际上是在说：“我知道我定义了一个构造函数，但我仍然想要回我的自动默认构造函数。”\n\
  \n'11 标准还允许使用新关键字 `delete:` 显式移除默认方法（如默认构造函数）：\n\n```cpp\nclass Student\n{\n  public:\n\
  \    Student() = delete;\n    string name;\n};\n```\n\n## 构造类成员\n\n在之前的示例中，所有数据成员都是\
  \ `int` 和 `double` 等简单类型。对于简单类型，在构造函数内部赋值值就足够了。在初始化数据成员类型时就会出现问题。\n\n考虑以下示例，它创建了一个新类\
  \ `StudentId` 来管理学生编号，而不是依赖普通变量：\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint nextStudentId = 1000;\n\nclass\
  \ StudentId\n{\n  public:\n    // 默认构造函数顺序分配 ID\n    StudentId()\n    {\n      \
  \  value = nextStudentId++;\n        cout << \"Take student id \" << value << endl;\n\
  \    }\n    // int 允许用户分配 ID\n    StudentId(int id)\n    {\n        value = id;\n\
  \        cout << \"Take student id \" << value << endl;\n    }\n  protected:\n \
  \   int value;\n};\n\nclass Student\n{\n  public:\n    Student(const char *pName)\n\
  \    {\n        cout << \"constructing student \" << pName << endl;\n        name\
  \ = pName;\n        semesterHours = 0;\n        gpa = 0.0;\n    }\n    // ...其他成员...\n\
  \  protected:\n    string name;\n    int semesterHours;\n    double gpa;\n    StudentId\
  \ id;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    // 创建两个学生\n    Student s1(\"\
  Jack\");\n    Student s2(\"Scruffy\");\n\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n\
  \    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n\n\n\n好的，对于默认构造函数来说，这些都很棒。但如果你想调用默认构造函数以外的构造函数怎么办？要把对象放在哪里？`StudentId`\
  \ 类提供了第二个构造函数，允许将学生 ID 分配给任意值。问题是，如何调用它呢？\n\n让我先给你们展示一下什么是不行通的。考虑以下程序段（这里只包含了相关部分——整个程序\
  \ `ConstructSeparateID` 随本书的附录位于 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)）：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student(const char *pName, int ssId)\n\
  \    {\n        cout << \"constructing student \" << pName << endl;\n        name\
  \ = pName;\n        // 别在家里尝试这样做，孩子们。这行不通\n        StudentId id(ssId);   // 构建一个学生\
  \ id\n    }\nprotected:\n    string name;\n    StudentId id;\n};\n\nint main(int\
  \ argcs, char* pArgs[])\n{\n    Student s(\"Jack\", 1234);\n    cout << \"This message\
  \ from main\" << endl;\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n    cout << \"\
  Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  }\n```\n\n在 `Student` 的构造函数内部，程序员（也就是我）（聪明地）尝试构造一个名为 `id` 的 `StudentId` 对象。（我还为\
  \ `StudentId` 添加了一个析构函数，它的作用仅仅是输出被销毁对象的 ID。）\n\n如果你看这个程序的输出，就能发现问题所在：\n\n```\ntake\
  \ next student id 1000\nconstructing student Jack\nassign student id 1234\ndestructing\
  \ 1234\nThis message from main\nPress Enter to continue...\n```\n\n我们似乎构建了两个 `StudentId`\
  \ 对象：第一个是像以前一样使用默认构造函数创建的。当控制权进入 `Student` 的构造函数后，创建了分配了值 1234 的第二个 `StudentId`。奇怪的是，这个\
  \ 1234 对象在程序退出 `Student` 构造函数时立即被销毁了。\n\n这种诡异行为的解释很清楚了。在进入构造函数体时，数据成员 `id` 已经存在了。构造函数中提供的声明并没有构建已存在的数据成员\
  \ `id`，而是创建了一个同名的局部对象。这个局部对象在从构造函数返回时被析构。\n\n某种程度上，我们需要一种不同的机制来指示“构建现有成员；不要创建新的”。这种机制需要出现在函数参数列表之后、左括号之前。C++\
  \ 为此提供了一种结构，如下从 `ConstructDataMembers` 程序中截取的子集（该程序与上一个程序的唯一区别在于 `Student` 类构造函数——整个程序随本书的附录位于\
  \ [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)）：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student(const char *pName, int ssId)\n\
  \        : name(pName), id(ssId)\n    {\n        cout << \"constructing student\
  \ \" << pName << endl;\n    }\nprotected:\n    string name;\n    StudentId id;\n\
  };\n```\n\n特别注意构造函数的第一行。这里是你以前没见过的东西。`:` 意味着后面的是对当前类数据成员构造函数的调用。对于 C++ 编译器来说，这一行的含义是：“使用\
  \ `Student` 构造函数的参数 `pName` 和 `ssId` 分别构造成员 `name` 和 `id`。任何没有以这种方式调用的成员都将使用它们的默认构造函数进行构造。”![remember.eps](img/remember_fmt.png)\n\
  \n### 将此与 C++ 成员初始化结合\n\n`string` 类型实际上定义在 `iostream` 包含的头文件中的约定类。在此示例之前的程序一直使用默认的\
  \ `string` 构造函数来创建一个空的 `name`，然后在构造函数体内将学生的姓名拷贝到对象中。如果可能，在创建 `string` 对象时对其赋值会更具有效率。\n\
  \n这个新程序生成了预期的结果：\n\n```\nassign student id 1234\nconstructing student Jack\nThis\
  \ message from main\nPress Enter to continue...\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 现在你可以看到调用构造函数的语法从哪里来了！\n\n### 构建常量成员\n\n那么当数据成员被初始化时会发生什么呢？考虑以下人为的示例：\n\n```cpp\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass StudentId\n{\npublic:\n    StudentId(int id) : value(id)\n    {\n      \
  \  cout << \"id = \" << value << endl;\n    }\nprotected:\n    int value;\n};\n\n\
  int nextStudentId = 1000;\n\nclass Student\n{\npublic:\n    Student(const char *pName,\
  \ int ssId)\n        : name(pName), id(ssId)\n    {\n        cout << \"constructing\
  \ student \" << pName << endl;\n    }\nprotected:\n    string name;\n    StudentId\
  \ id;\n};\n\nint main(int argcs, char* pArgs[])\n{\n    Student s1(\"Jack\", 1234);\n\
  \    Student s2(\"Scruffy\");\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n### 构建常量数据成员\n\n参数构造解决了 `const` 数据成员的类似问题，如下例所示：\n\n```cpp\n\
  class Mammal\n{\npublic:\n    Mammal(int nof) : numberOfFeet(nof) {}\nprotected:\n\
  \    const int numberOfFeet;\n};\n```\n\n表面上，一个给定的 `Mammal` 有固定数量的脚（除非发生截肢）。脚的数量可以也应该声明为\
  \ `const`。这个构造函数定义在对象创建时为变量 `numberOfFeet` 分配了一个值。\n\n## 重构构造顺序\n\n当存在多个带有构造函数的对象时，程序员通常不在乎构建它们的顺序。然而，如果一个或多个构造函数有副作用，顺序就会产生影响。\n\
  \n构造顺序的规则如下：\n\n*   局部和静态对象按照它们声明的顺序进行构造。\n*   静态对象只构造一次。\n*   所有全局对象在 `main()`\
  \ 之前完成构造。\n*   全局对象的构造没有特定顺序。\n*   成员按照它们在类中特定访问类型内声明的顺序进行构造（即：所有公共成员按其声明顺序构造，所有保护成员按其声明的顺序构造）。\n\
  \n\n\n\n\n-   对象的析构顺序与它们构造的顺序相反。\n\n![remember.eps](img/remember_fmt.png) `static\
  \ variable` 是一个局部于函数、但在一次函数调用到下一次调用之间保留其值的变量。`global variable` 是一个在函数外部声明的变量。\n\n\
  现在我们将逐一考虑上述每个规则。\n\n### 局部对象按顺序构造\n\n局部对象的构造顺序按照程序遇到它们声明的顺序进行。通常情况下，这与对象在函数中出现的顺序相同，除非函数在特定的声明之间发生跳转。（顺便说一句，在声明之间跳转是件糟糕的事情。它会困扰读者和编译器。）\n\
  \n### 静态对象只构造一次\n\n静态对象类似于局部变量，不同在于它们只被构造一次。C++ 会等待到控制流第一次通过 `static` 声明处时才构造该对象。考虑下面这个简单的\
  \ `ConstructStatic` 程序：\n\n```cpp\n//  ConstructStatic - demonstrate that statics\
  \ are only\n//                  constructed once\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass DoNothing\n{\n\
  \  public:\n    DoNothing(int initial) : nValue(initial)\n    {\n        cout <<\
  \ \"DoNothing constructed with a value of \"\n              << initial << endl;\n\
  \    }\n    ~DoNothing()\n    {\n        cout << \"DoNothing object destructed\"\
  \ << endl;\n    }\n    int nValue;\n};\n\nvoid fn(int i)\n{\n    cout << \"Function\
  \ fn passed a value of \" << i << endl;\n    static DoNothing dn(i);\n}\n\nint main(int\
  \ argcs, char* pArgs[])\n{\n    fn(10);\n    fn(20);\n    cout << \"Press Enter\
  \ to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
  \ 0;\n}\n```\n\n执行此程序会产生以下结果：\n\n```\nFunction fn passed a value of 10\nDoNothing\
  \ constructed with a value of 10\nFunction fn passed a value of 20\nPress Enter\
  \ to continue...\nDoNothing object destructed\n```\n\n注意，函数 `fn()` 的消息出现了两次，但 `DoNothing`\
  \ 构造函数的输出仅在第一次调用 `fn()` 时出现。这表明该对象在第一次调用 `fn()` 时被构造，此后不再构造。还要注意，析构函数直到程序作为程序关闭流程的一部分从\
  \ `main()` 返回时才被调用。\n\n### 所有全局对象在 main() 之前构造\n\n所有全局变量在程序启动时立即进入作用域。因此，所有全局对象在控制权传递给\
  \ `main()` 之前就已经构造完成了。\n\n![warning.eps](img/warning_fmt.png) 初始化全局变量会导致真正的调试头疼。某些调试器尝试在程序加载后且在将控制权交给用户之前直接执行到\
  \ `main()`。这可能会导致问题，因为在你夺取程序控制权之前，所有全局对象的构造代码已经执行完毕。如果这些构造函数中的其中一个有致命错误，你根本没有机会发现问题。在这种情况下，程序似乎在启动之前就崩溃了！\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 我发现检测此类问题的最佳方法是在每个你稍有怀疑的构造函数中设置断点，并在\
  \ `main()` 的第一条语句处设置断点。一旦你启动程序，每个声明的全局对象都会触发断点。在每个断点处点击“继续”，直到程序崩溃——现在你知道你多按了一次“继续”。重启程序并重复此过程，但在导致程序崩溃的构造函数处停止。你现在可以单步执行构造函数，直到找到问题。如果你一直到达\
  \ `main()` 中的断点，说明程序在构造全局对象时没有崩溃。\n\n### 全局对象的构造没有特定顺序\n\n确定局部对象的构造顺序是很容易的。顺序由控制流隐含。对于全局变量，没有这种控制流来提供顺序。所有全局变量同时进入作用域——还记得吗？好了，你可能会说，为什么编译器不能直接从文件顶部开始向下处理全局对象列表呢？\n\
  \n这对于单个文件运行没问题（我假设大多数编译器都是这么做的）。现实世界上大多数程序由多个单独编译然后链接的文件组成。由于编译器无法控制这些文件的链接顺序，因此它无法影响全局对象在文件之间的构造顺序。\n\
  \n大多数时候，全局构造的顺序是非常无关紧要的。然而，偶尔全局变量会产生极难追踪的 bug。（这种情况发生的频率足以让我们在书中提一下它。）\n\n考虑下面的例子：\n\
  \n```cpp\nclass Student\n{\n  public:\n    Student (int id) : studentId(id) {}\n\
  \    const int studentId;\n};\n\nclass Tutor\n{\n  public:\n    Tutor(Student& s)\
  \ : tutoredId(s.studentId) {}\n    int tutoredId;\n};\n\n// 设置一个学生\nStudent randy(1234);\n\
  // 为该学生分配一个导师\nTutor janet(randy);\n```\n\n在这里，`Student` 的构造函数分配了一个学生 ID。`Tutor`\
  \ 的构造函数记录了学生的 ID 以帮助。程序声明了一个学生 `randy`，然后为该学生分配了一个导师 `janet`。\n\n问题在于程序做了隐含假设，认为\
  \ `randy` 在 `janet` 之前构造。如果反过来，那么 `janet` 将构造自一个尚未变为 `Student` 对象的内存块，因此 ID 是垃圾值。\n\
  \n![tip.eps](img/tip_fmt.png) 上面的例子并不难理解，甚至有些刻意。尽管如此，源于全局对象构造顺序的问题可能会微妙的方式出现。为了避免这个问题，不要让一个全局对象的构造函数引用另一个全局对象的内容。\n\
  \n### 成员按声明顺序构造\n\n类的成员按照它们在类内部声明的顺序构造。这听起来可能并不那么显而易见。考虑下面的例子：\n\n```cpp\nclass\
  \ Student\n{\n  public:\n    Student (int id, int age) : nAge(age), nId(id){}\n\
  \    const int nId;\n    const int nAge;\n    double dAverage = 0.0;\n};\n```\n\n\
  在这个例子中，`nId` 在 `nAge` 之前构造，尽管 `nId` 在构造函数的初始化列表中第二个，因为它在类定义中位于 `nAge` 之前。数据成员 `dAverage`\
  \ 因为同样的原因最后构造。构造构造顺序差异的情况都是具有相互副作用构造函数的类实例。\n\n### 析构函数按构造函数的反顺序析构\n\n最后，无论构造函数以什么顺序启动，你都可以确保析构函数是按反顺序调用的。（知道\
  \ C++ 中至少有一个规则没有如果、并且或但是是很好的。）\n\n## 创建数组\n\n当你声明一个数组时，数组的每个元素都必须被构造。例如，以下声明会调用五次默认\
  \ `Student` 构造函数，对应数组的每个成员：\n\n```cpp\nStudent s[5];\n```\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 2011 标准允许你使用初始化列表调用默认构造函数以外的构造函数，如下简略示例程序所示（完整程序可以在在线材料 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取）：\n\n```cpp\n//  ConstructArray - construct an array of objects\n\n// ...具有重载构造函数的相同\
  \ Student 类...\n\nint main(int argcs, char* pArgs[])\n{\n```\n\n\n\n\n\n```cpp\n\
  \    // 以下调用三个不同的构造函数\n\n    Student s[]{\"Marian Haste\", \"Pikup Andropov\"};\n\
  \n    Student t[]{{\"Jack\", 0, 0.0}, {\"Scruffy\", 12, 2.5}};\n\n    // 在程序终止前等待用户准备就绪\n\
  \    // 允许用户查看程序结果\n    cout << \"Press Enter to continue...\" << endl;\n\n    cin.ignore(10,\
  \ '\\n');\n\n    cin.get();\n\n    return 0;\n}\n```\n\n数组 `s` 通过调用两次 `Student(const\
  \ char*)` 构造函数创建了两个成员对象。数组 `t` 是通过 `Student(const char*, int, double)` 构造函数构建的。该程序的输出如下：\n\
  \n```text\nconstructing freshman Marian Haste\nconstructing freshman Pikup Andropov\n\
  constructing transfer Jack\nconstructing transfer Scruffy\nPress Enter to continue...\n\
  ```\n\n![remember.eps](img/remember_fmt.png) 包含在大括号中的一系列对象被称为初始化列表。\n\n## 作为转换形式的构造函数\n\
  \nC++ 将带有单个参数的构造函数视为从一种类型转换为另一种类型的方法。考虑一个用于表示复数的用户定义类型 `Complex`。在不涉及过多技术的情况下（对我而言，不是对你而言），实数和复数之间存在自然的转换，就像从整数到实数的转换一样，如下例所示：\n\
  \n```cpp\ndouble d = 1;   // 这是合法的\nComplex c = d;  // 这也应该被允许\n```\n\n事实上，C++ 会寻找方法来尝试理解此类语句。如果类\
  \ `Complex` 有一个接受 `double` 作为其参数的构造函数，C++ 将使用该构造函数作为一种转换形式，就像前面的语句被写如下一样：\n\n```cpp\n\
  double d = 1;\nComplex c(d);\n```\n\n某些构造函数引入的转换并没有意义。例如，你可能不希望 C++ 仅仅因为存在 `Student(int)`\
  \ 构造函数就将整数转换为 `Student` 对象。当 C++ 尝试解释简单的编码错误时，意外的转换可能会导致奇怪的运行时错误。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 程序员可以使用 `explicit` 关键字来避免创建意外且非预期的转换路径。标记为 `explicit` 的构造函数不能作为隐式转换路径：\n\n```cpp\n\
  class Student\n{\npublic:\n    // 以下 \"No Name\" 构造函数不能用作\n    // 从 int 到 Student\
  \ 的隐式转换路径\n    explicit Student(int nStudentID);\n};\n\nStudent s = 1;         //\
  \ 生成编译错误\nStudent t(123456);     // 这仍然被允许\n```\n\n`s` 的声明没有隐式调用 `Student(int)`\
  \ 构造函数，因为它被标记为“仅可显式调用”。显式调用构造函数来创建对象 `t` 仍然是可以的。\n\n演示这一原理的完整 `TypeConversion` 程序包含在在线材料\
  \ [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus) 中。\n\
  \n# 第 17 章\n\n# 拷贝/移动构造函数\n\n### 本章内容\n\n- ![arrow](img/arrow.png) 引入拷贝/移动构造函数\n\
  - ![arrow](img/arrow.png) 创建拷贝\n- ![arrow](img/arrow.png) 让系统自动创建拷贝\n- ![arrow](img/arrow.png)\
  \ 浅拷贝与深拷贝的区别\n- ![arrow](img/arrow.png) 使用移动构造函数避免所有拷贝\n\n构造函数是一个特殊的函数，C++ 在创建对象时会自动调用它，以允许对象进行自我初始化。第\
  \ 15 章介绍了构造函数的概念，而第 16 章描述了其他类型的构造函数。本章研究了构造函数的两种特殊变体，即“拷贝构造函数”和“移动构造函数”。\n\n##\
  \ 拷贝对象\n\n拷贝构造是 C++ 用于创建对象拷贝的构造函数。它的名称为 `X::X(const X&)`，其中 `X` 是类名。也就是说，它是类 `X`\
  \ 的构造函数，接受一个类 `X` 对象的引用作为参数。现在，我知道这听起来真的没用，但请给我一个机会解释为什么 C++ 需要这些“小怪物”。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 移动构造函数是 C++ 2011 特有的。本章大部分内容关于拷贝构造函数。我将在本章最后介绍移动构造函数的细节。\n\n### 为什么你需要拷贝构造函数\n\
  \n想一下当你调用如下所示函数时会发生什么：\n\n```cpp\nvoid fn(Student fs)\n{\n    // ...相同的情景；不同的参数...\n\
  }\n\nint main(int argcs, char* pArgs[])\n{\n    Student ms;\n    fn(ms);\n    return\
  \ 0;\n}\n```\n\n在对 `fn()` 调用中，C++ 传递的是对象 `ms` 的拷贝而不是对象本身。\n\n现在考虑创建一个对象拷贝意味着什么。首先，它需要一个构造函数来创建一个对象，即使是现有对象的拷贝。C++\
  \ 可以创建一个默认拷贝构造函数，将现有对象一个字节一个字节地拷贝到新对象中。这是旧语言（如 C）所做的。但如果类不想要简单的拷贝呢？如果需要其他方式呢？（暂时忽略“为什么？”。）类需要能够指定具体如何创建拷贝。\n\
  \n因此，C++ 在前面的示例中使用拷贝构造函数在调用函数 `fn()` 时在栈上创建对象 `ms`。这个特定的拷贝构造函数是 `Student::Student(Student&)`\
  \ —— 说三次。\n\n### 使用拷贝构造函数\n\n理解拷贝构造函数如何工作的最好方法是看它实际运行。考虑以下 CopyConstructor 程序：\n\
  \n```cpp\n// CopyConstructor - 演示拷贝构造函数\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n    //\
  \ 常规构造函数\n    Student(const char *pName = \"no name\", int ssId = 0)\n      : name(pName),\
  \ id(ssId)\n    { cout << \"Constructed \"  << name << endl; }\n\n    // 拷贝构造函数\n\
  \    Student(const Student& s)\n      : name(\"Copy of \" + s.name), id(s.id)\n\
  \    { cout << \"Constructed \" << name << endl; }\n\n    ~Student() { cout << \"\
  Destructing \" << name << endl; }\n\nprotected:\n    string name;\n    int id;\n\
  };\n\n// fn - 按值接收参数\nvoid fn(Student copy)\n{\n    cout << \"In function fn()\"\
  \ << endl;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Student scruffy(\"\
  Scruffy\", 123);\n    cout << \"Calling fn()\" << endl;\n    fn(scruffy);\n    cout\
  \ << \"Back in main()\" << endl;\n    // 在程序终止前等待用户准备就绪\n    // 允许用户查看程序结果\n   \
  \ cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n\n\n\n与默认构造函数一样，拷贝构造函数也非常重要；其重要性足以让 C++\
  \ 认为任何类都不应该缺少它。如果你不提供自己的拷贝构造函数，C++ 就会为你生成一个。（这与 C++ 提供的默认构造函数不同，除非你的类已经为它定义了构造函数。）\n\
  \nC++ 提供的拷贝构造函数会对每个数据成员执行逐个成员的拷贝。你可以在下面的 `DefaultCopyConstructor` 程序中看到这一点。（为了节省空间，我省略了\
  \ `Student` 类的定义——它与 `CopyConstructor` 程序中显示的完全相同。整个 `DefaultCopyConstructor` 程序可以在\
  \ [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus) 在线获取。）\n\
  \n```cpp\nclass Tutor\n{\n  public:\n    Tutor(Student& s)\n      : student(s),\
  \ id(0)\n    { cout << \"Constructing Tutor object\" << endl; }\n\nprotected:\n\
  \    Student student;\n    int id;\n};\n\nvoid fn(Tutor tutor)\n{\n    cout << \"\
  In function fn()\" << endl;\n}\n\nint main(int argcs, char* pArgs[])\n{\n    Student\
  \ scruffy(\"Scruffy\");\n    Tutor tutor(scruffy);\n    cout << \"Calling fn()\"\
  \ << endl;\n    fn(tutor);\n    cout << \"Back in main()\" << endl;\n    // wait\
  \ until user is ready before terminating program\n    // to allow the user to see\
  \ the program results\n    cout << \"Press Enter to continue...\" << endl;\n   \
  \ cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n执行此程序将产生以下输出：\n\
  \n```\nConstructed Scruffy\nConstructed Copy of Scruffy\nConstructing Tutor object\n\
  Calling fn()\nConstructed Copy of Copy of Scruffy\nIn function fn()\nDestructing\
  \ Copy of Copy of Scruffy\nBack in main()\nPress Enter to continue...\nDestructing\
  \ Copy of Scruffy\nDestructing Scruffy\n```\n\n构造 `scruffy` 对象会生成来自“普通”构造函数的第一条输出消息。`tutor`\
  \ 对象的构造函数调用了 `Student` 拷贝构造函数来生成它自己的 `Student` 数据成员，然后输出自己的消息。这解释了接下来的两行输出。\n\n\
  程序将 `Tutor` 对象的拷贝传递给函数 `fn()`。由于 `Tutor` 类没有定义拷贝构造函数，程序调用默认拷贝构造函数来创建一个拷贝传递给 `fn()`。\n\
  \n默认的 `Tutor` 拷贝构造函数会调用每个数据成员的拷贝构造函数。`int` 的拷贝构造函数除了拷贝值之外什么都不做。你已经见过 `Student` 拷贝构造函数是如何工作的了。这正是生成\
  \ `Constructed Copy of Copy of Scruffy` 消息的原因。拷贝的析构函数在从函数 `fn()` 返回时被调用。最后的析构函数在程序从\
  \ `main()` 返回时被调用。\n\n## 创建浅拷贝与深拷贝\n\n在拷贝构造函数中，执行逐个成员的拷贝似乎是理所当然的。除了增加一种在学生名字前面加上诸如\
  \ `Copy of` 这种愚蠢的功能外，你什么时候会想要执行逐成员拷贝以外的任何操作呢？\n\n考虑如果构造函数分配了资源（例如堆上的内存）会发生什么。如果拷贝构造函数只是简单地拷贝该资源而不分配它自己的资源，你就会陷入一个麻烦的局面：两个对象认为它们拥有同一个资源的独占访问权限。当两个对象的析构函数都被被调用且它们都尝试释放同一个资源时，情况会变得更糟糕。为了更具体，考虑以下示例类：\n\
  \n```cpp\n//  ShallowCopy - 执行逐字节（浅层）拷贝\n//              当类持有资源时，这样做是不正确的\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nclass\
  \ Person\n{\n  public:\n    Person(const char *pN)\n    {\n        cout << \"Constructing\
  \ \" << pN << endl;\n        pName = new string(pN);\n    }\n    ~Person()\n   \
  \ {\n        cout << \"Destructing \" << pName\n              << \" (\" << *pName\
  \ << \")\" << endl;\n      *pName = \"already destructed memory\";\n        // delete\
  \ pName;\n    }\n\nprotected:\n    string *pName;\n};\n\nvoid fn()\n{\n    // create\
  \ a new object\n    Person p1(\"This_is_a_very_long_name\");\n    // copy the contents\
  \ of p1 into p2\n    Person p2(p1);\n}\n\nint main(int argcs, char* pArgs[])\n{\n\
  \    cout << \"Calling fn()\" << endl;\n    fn();\n    cout << \"Back in main()\"\
  \ << endl;\n    // wait until user is ready before terminating program\n    // to\
  \ allow the user to see the program results\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  此程序产生以下输出：\n\n```\nCalling fn()\nConstructing This_is_a_very_long_name\nDestructing\
  \ 0x3f2bb8 (This_is_a_very_long_name)\nDestructing 0x3f2bb8 (already destructed\
  \ memory)\nBack in main()\nPress Enter to continue...\n```\n\n`Person` 的构造函数在堆上分配内存来存储人的姓名。析构函数通常会使用\
  \ `delete` 关键字将此内存返回给堆；然而，在这种情况下，我将 `delete` 的调用替换为一条替换名字信息的语句。主程序调用函数 `fn()`，该函数创建了一个人\
  \ `p1`，然后创建该人的拷贝 `p2`。当程序从 `fn` 返回时，两个对象都会自动析构。\n\n执行此程序时只出现了一个构造函数消息。这并不意外，因为用于构建\
  \ `p2` 的 C++ 提供的拷贝构造函数没有执行。当 `p1` 和 `p2` 离开作用域，析构函数被调用了两次。第一个析构函数输出 `This_is_a_very_long_name`。第二个析构函数指示内存已经删除\
  \ (`0x3f2bb8`）。如果程序删除了该内存，程序在第二次 `delete` 后将变得不稳定。`p1` 和 `p2` 最终指向相同的资源（在本例中为堆内存）。这被称为浅拷贝，因为它只是“触及表面”，拷贝了成员。\n\
  \n这个问题在图 17-1 中形象化地显示。`p1` 被拷贝到新对象 `p2` 中，但资源没有被拷贝。该解决方案在图 17-2 中直观地展示。\n\n以下显示了\
  \ `Person` 类的适当拷贝构造函数，这是你为止见过的类型。（该类体现在 `DeepCopy` 中，它位于本书的在线材料 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 上。）\n\n```cpp\nclass Person\n{\n  public:\n    Person(const char *pN)\n    {\n\
  \        cout << \"Constructing \" << pN << endl;\n        pName = new string(pN);\n\
  \    }\n    Person(Person& person)\n    {\n        cout << \"Copying \" << *(person.pName)\
  \ << endl;\n        pName = new string(*person.pName);\n    }\n    ~Person()\n \
  \   {\n        cout << \"Destructing \" << pName\n              << \" (\" << *pName\
  \ << \")\" << endl;\n      *pName = \"already destructed memory\";\n        // delete\
  \ pName;\n    }\n\nprotected:\n    string *pName;\n};\n```\n\n\n\n在这里你看到拷贝构造函数为名称分配了自己的内存块，然后将源对象的名称内容复制到这个新的名称块中。这种情况与图\
  \ 17-2 所示的情况类似。`Deep copy`（深拷贝）之所以这样命名是因为它深入内部并复制了所有资产。（好吧，这个比喻很牵强，但他们就是这么称呼的。）\n\
  \n该程序的输出如下：\n\n```\nCalling fn()\nConstructing This_is_a_very_long_name\nCopying\
  \ This_is_a_very_long_name\nDestructing 0x9f2be0 (This_is_a_very_long_name)\nDestructing\
  \ 0x9f2ba0 (This_is_a_very_long_name)\nBack in main()\nPress Enter to continue...\n\
  ```\n\n现在，`Person` 的析构函数表明 `p1` 和 `p2` 中的字符串指针不再指向同一块内存：两个对象的地址不同，且拷贝版本中的名称没有被覆盖，这表明它已经被删除。\n\
  \n![remember.eps](img/remember_fmt.png) 真正的 `~Person` 析构函数应该执行 `delete pName.`\n\
  \n## 临时变量的路途漫长\n\n通过值传递参数给函数是使用拷贝构造函数的最明显但并非唯一的例子。在其他情况下，C++ 也会创建对象的副本。\n\n考虑一个按值返回对象的函数。在这种情况下，C++\
  \ 必须使用使用拷贝构造函数来创建一个副本。下面的代码段演示了这种情况：\n\n```cpp\nStudent fn();      // 按值返回对象\n\n\
  int main(int argcs, char* pArgs[])\n{\n  Student s;\n  s = fn();        // 调用 fn()\
  \ 创建了临时对象\n  // fn() 返回的临时对象持续多长时间？\n  return 0;\n}\n```\n\n函数 `fn()` 按值返回一个对象。最终，返回的对象被拷贝到\
  \ `s`，但在那之前它存在于何处？\n\nC++ 会创建一个临时对象，并将返回的对象存入其中。“好的，”你说，“C++ 创建了临时对象，但它是如何知道什么时候析构它的呢？”好问题。在这个例子中，这并没有太大区别，因为当拷贝构造函数将其拷贝到\
  \ `s` 时，你已经用完了这个临时对象。但如果 `s` 被定义为引用呢？临时变量的生存周期会有很大影响，因为 `refS` 在整个函数执行期间都存在：\n\n\
  ```cpp\nint main(int argcs, char* pArgs[])\n{\n  Student& refS = fn();\n  // ...现在呢？...\n\
  \  return 0;\n}\n```\n\n编译器创建的临时对象在创建它们的扩展表达式期间有效，此后不再有效。\n\n在下面的函数中，我标记了临时对象不再有效的位置：\n\
  \n```cpp\nStudent fn1();\nint fn2(Student&);\n\nint main(int argcs, char* pArgs[])\n\
  {\n  int x;\n  // 通过调用 fn1() 创建一个 Student 对象。\n  // 将该对象传递给函数 fn2()。\n  // fn2()\
  \ 返回一个整数用于某些愚的计算。\n  // 在此期间，从 fn1 返回的临时对象保持有效。\n  x = 3 * fn2(fn1()) + 10;\n  //\
  \ 从 fn1 返回的临时对象现在不再有效\n  // ...其他内容...\n  return 0;\n}\n```\n\n这使得引用的示例变得无效，因为对象可能在\
  \ `refS` 之前消失了，导致 `refS` 指向一个非对象。\n\n### 永久地避免临时变量\n\n你可能会想，这种到处拷贝对象的操作可能有点耗时。如果你不想对所有内容进行拷贝怎么办？最直接的解决方案是通过引用将对象传递给函数并从函数返回引用对象。这样做可以避免大多数的临时变量。\n\
  \n但如果你仍然不确定 C++ 是否在暗中巧妙地构造你一无所知的临时对象呢？或者如果你的类分配了你不希望被拷贝的唯一资产呢？该怎么办？\n\n你可以在拷贝构造函数中添加一条输出语句。执行程序时出现此消息会警告你刚刚完成了一次拷贝。\n\
  \n更智能的方法是将拷贝构造函数声明为 `protected`，如下：\n\n```cpp\nclass Student\n{\nprotected:\n  \
  \  Student(Student&s){}\npublic:\n    // ...其他内容一切正常...\n};\n```\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ C++ 标准还允许程序员删除拷贝构造函数：\n\n```cpp\nclass Student\n{\n  Student(Student&s) = delete;\n\
  \  // ...其他内容...\n};\n```\n\n将拷贝构造函数声明为 `protected` 或将其删除都可以防止任何外部函数（包括 C++ 内部）构造\
  \ `Student` 对象的副本。如果没有人调用拷贝构造函数，就不会生成拷贝。此如此。\n\n## 移动构造函数\n\n在某些条件下，C++ 可以创建一个仅用于单条语句持续时间的对象的副本。此类对象被称为临时对象，它们在表达式完成后就会被析构。对于即将被析构的临时对象创建拷贝是没有意义的。\n\
  \n![c++1_fmt.eps](img/c1_fmt.png) C++ 允许程序员创建一个名为移动构造函数（move constructor）的构造函数，它只需将资产从源移动到目的地，而不是进行不必要的拷贝。移动构造函数的格式为\
  \ `X(X&&)`。这是 `&&` 的新用法。\n\n考虑下面这个构造的例子。\n\n![tip.eps](img/tip_fmt.png) C++ 包含了若干优化以避免创建不必要的对象拷贝，这个例子必须克服这些优化才能演示移动构造函数。在对第\
  \ 2 章讨论运算符时，你会看到更少这种刻意的例子。\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\nusing namespace std;\n\nclass Person\n{\n  public:\n    Person(const\
  \ char *pN)\n    {\n      pName = new string(pN);\n      cout << \"Constructing\
  \ \" << *pName << endl;\n    }\n    Person(Person& p)\n    {\n      cout << \"Copying\
  \ \" << *p.pName << endl;\n      pName = new string(\"Copy of \");\n      *pName\
  \ += *p.pName;\n    }\n    Person(Person&& p)\n    {\n      cout << \"Moving \"\
  \ << *p.pName << endl;\n      pName = p.pName;\n      p.pName = nullptr;\n    }\n\
  \    ~Person()\n    {\n      if (pName)\n      {\n        cout << \"Destructing\
  \ \" << *pName << endl;\n        delete pName;\n      }\n      else\n      {\n \
  \       cout << \"Destructing null object\" << endl;\n      }\n    }\nprotected:\n\
  \  string* pName;\n};\n\nPerson fn2(Person p)\n{\n  cout << \"Entering fn2\" <<\
  \ endl;\n  return p;\n}\n\nPerson fn1(char* pName)\n{\n  cout << \"Entering fn1\"\
  \ << endl;\n  return fn2(*new Person(pName));\n}\n\nint main(int argcs, char* pArgs[])\n\
  {\n  Person s(fn1(\"Scruffy\"));\n  // 等到用户准备好后再终止程序\n  // 允许用户看到程序结果\n  cout <<\
  \ \"Press Enter to continue...\" << endl;\n  cin.ignore(10, '\\n');\n  cin.get();\n\
  \  return 0;\n}\n```\n\n\n\n\n在这种情况下，`fn1()` 创建了一个 `Person` 对象。然后它在调用 `fn2()` 时使用拷贝构造函数复制了该对象。然而，函数\
  \ `fn2()` 仅仅仅仅是将该对象的拷贝返回给 `fn1();`；但这个拷贝只是 `fn1()` 返回给 `main()` 的临时对象。C++'11 并没有使用拷贝构造函数来创建一个“Scruffy\
  \ 的拷贝拷贝”，而是调用移动构造函数来获取临时对象的内容。当这个临时对象随后被析构时，它变成了一个“空对象”，因为它的 `pName` 已经被提取并重新赋值了。\n\
  \n![tip.eps](img/tip_fmt.png) 你不需要创建移动构造函数。即使只用拷贝构造函数，程序也能正常运行，只是速度稍微慢一点。移动构造函数应该被视为一个高级课题。你将在第\
  \ 22 章中看到不那么刻意的示例。\n\n# 第 18 章\n\n# 静态成员：柔顺剂能帮上忙吗？\n\n### 本章内容\n\n- ![arrow](img/arrow.png)\
  \ 声明静态成员数据\n- ![arrow](img/arrow.png) 定义并使用静态成员函数\n- ![arrow](img/arrow.png) 理解为什么我的静态成员函数无法调用其他成员函数\n\
  \n默认情况下，数据成员是按对象分配的。例如，每个人都有自己自己的名字。你也可以通过将某个成员声明为 `static` 来让该类的所有对象共享该成员。`static`\
  \ 一词既适用于数据成员也适用于成员函数，尽管含义略有不同。本章将描述这两种类型，从静态数据成员开始介绍。\n\n## 定义静态成员\n\n程序员可以通过在声明中添加\
  \ `static` 关键字，使数据成员成为该类所有对象的共用成员。此类成员被称为**静态数据成员**。（如果它们被称为其他名字，我会有点不悦的。）\n\n###\
  \ 为什么你需要静态成员\n\n大多数属性都是对象的属性。使用那个老掉牙（人们可能会说是陈词滥调）的学生示例，姓名、ID 编号和课程等属性属于特定的学生。然而，所有学生共享某些属性——例如，当前注册的学生人数、所有学生中的最高分，或者指向链表中第一个学生的指针。\n\
  \n将这类信息存储在常见的、普通的全局变量是非常容易的。例如，你可以使用一个低级的 `int` 变量来跟踪 `Student` 对象的数量。然而，这种解决方案的问题在于，全局变量位于类之外。这就像把微波炉的电压调节器放在外壳外面。当然，我可以这样做，而且可能也能运行——唯一的问题是，如果我的狗钻进了电线，我可能得把它从天花板上撕下来（狗也不会对此感到高兴致的）。\n\
  \n如果一个类要对自己的状态负责，那么像全局变量这样的对象就必须带到类内部，就像电压调节器必须在微波炉盖内部，远离好奇的爪子。这就是静态成员背后的思想。\n\n\
  ![tip.eps](img/tip_fmt.png) 你可能会听到静态成员被称为`类成员`；这是因为类中的所有对象都共享它们。相比之下，普通成员被称为`实例成员`或`对象成员`，因为每个对象都拥有这些成员的自己的拷贝。\n\
  \n### 使用静态成员\n\n静态数据成员是使用 `static` 存储类声明的成员，如下所示：\n\n```cpp\nclass Student\n{\n\
  public:\n    Student(char *pName = \"no name\") : name(pName)\n    {\n        noOfStudents++;\n\
  \    }\n    ~Student(){ noOfStudents--; }\n    static int noOfStudents;\n    string\
  \ name;\n};\n\nStudent s1;\nStudent s2;\n```\n\n数据成员 `noOfStudents` 是 `Student`\
  \ 类的一部分，但它不是 `s1` 或 `s2` 的部分。也就是说，对于 `Student` 类的每个对象，都有独立的 `name`，但只有一个 `noOfStudents`，所有\
  \ `Students` 都必须共享它。\n\n“那么，”你问，“如果 `noOfStudents` 的空间没有在 `Student` 类的任何对象中分配，它分配在哪里呢？”答案是：“没有分配。”你必须专门为它分配空间，如下：\n\
  \n```cpp\nint Student::noOfStudents = 0;\n```\n\n这种看起来有些奇怪的语法为静态数据成员分配了空间并将其初始化为\
  \ 0。（在声明静态成员时不需要初始化它；如果不初始化，C++ 将调用默认构造函数。）静态数据成员必须是全局的——静态变量不能是函数的局部变量。\n\n![remember.eps](img/remember_fmt.png)\
  \ 当成员出现在类边界之外时，必须提供类名。\n\n![tip.eps](img/tip_fmt.png) 这种手动分配空间的操作有点让人困惑，直到考虑到类定义被设计为放在被多个源代码模块包含的文件中。C++\
  \ 必须知道在哪些 `.cpp` 源文件中为静态变量分配空间。这对于非静态变量来说不是问题，因为空间会在创建的每个对象中分配。\n\n### 引用静态数据成员\n\
  \n静态成员的访问规则与普通成员的访问规则相同。在类内部，静态成员的引用方式与其他任何类成员都一样。公共静态成员可以在类外部引用，而保护良好的静态成员则不能。下面的代码片段展示了两种引用方式，使用了上一节中\
  \ `Student` 的声明：\n\n```cpp\nvoid fn(Student& s1, Student& s2)\n{\n    // 引用公共静态\n\
  \    cout << \"No of students \"\n         << s1.noOfStudents // 从外部引用\n       \
  \  << endl;           // 类的\n}\n```\n\n在 `fn()` 中，`noOfStudents` 使用对象 `s1` 被引用。但\
  \ `s1` 和 `s2` 共享同一个成员 `noOfStudents`。我怎么知道选择 `s1` 的？我为什么不用 `s2` 呢？没有区别。你可以使用该类的任何对象来引用静态成员。\n\
  \n事实上，你完全不需要对象。如果你愿意，可以直接使用类名，如下所示：\n\n```cpp\n// ...class 的定义与之前相同...\nvoid fn(Student&\
  \ s1, Student& s2)\n{\n  // 以下代码产生相同的结果\n  cout << \"Number of students \"\n   \
  \      << Student::noOfStudents\n         << endl;\n}\n```\n\n如果你在访问静态成员时使用了对象名，C++\
  \ 只使用该对象的声明类。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 这是一个微小的技术细节，但为了完全披露：用于引用静态成员的对象即使是一个表达式，也不会被求值。例如，考虑以下情况：\n\
  \n```cpp\nclass Student\n{\npublic:\n    static int noOfStudents;\n    Student&\
  \ nextStudent();\n    // ...其他内容相同...\n};\n\nvoid fn(Student& s)\n{\n    cout <<\
  \ s.nextStudent().noOfStudents << \"\\n\"\n}\n```\n\n成员函数 `nextStudent()` 实际上并没有被调用。C++\
  \ 访问 `noOfStudents` 只需要返回类型，它可以在不费力求值表达式的情况下获取它。即使 `nextStudent()` 应该做其他事情（比如洗窗户或擦鞋）也是如此。这些事情都不会被执行。虽然这个例子很晦涩，但它确实会发生。这就是你试图在一个表达式中塞进太多东西的后果。\n\
  \n### 静态数据成员的用途\n\n\n\n\n静态数据成员有许多用途，但让我在这里介绍其中的几种。首先，你可以使用静态成员来统计浮空中对象的数量。例如，在\
  \ `Student` 类中，计数器初始化为 0，构造函数对其加 1，而析构函数对其减 1。在任何给定时刻，静态成员都包含了当前存在的 `Student` 对象的计数。但请记住，这个计数器反映的是\
  \ `Student` 对象的数量（包括任何临时对象），而不一定是学生的数量。\n\n静态成员的另一个密切相关的用途是作为标志位，用于指示特定动作是否已经发生。例如，`Radio`\
  \ 类可能需要在发送第一个 `tune` 命令之前初始化硬件，但在随后的 `tunes` 之前不需要。一个指示这是第一次 `tune` 的标志位就足够了。这包括在发生错误时进行标记。\n\
  \n另一个常见用途是为列表第一个成员的指针提供空间——所谓的头指针（如果这听起来不熟悉，请参阅第 13 章节）。静态成员可以分配所有函数中所有对象共享的公共数据位（过度使用这种公共内存是一个非常糟糕的主意，因为这样做会导致错误跟踪变得困难）。\n\
  \n## 声明静态成员函数\n\n成员函数也可以声明为静态的。当你想要将一个动作与类关联，但不需要将该动作与特定对象关联时，静态成员函数非常有用。例如，成员函数\
  \ `Duck::fly()` 与特定的 `duck` 关联，而更为激进的成员函数 `Duck::goExtinct()` 则没有。\n\n和静态数据成员一样，静态成员函数与类关联，而不是与该类的特定对象关联。这意味着，就像引用静态数据成员一样，对静态成员函数的引用不需要对象。如果存在对象，则只使用它的类型。\n\
  \n因此，在下面的示例中对静态成员函数 `number()` 的两次调用都是合法的。这引出了我们的第一个静态程序——我的意思是我们的第一个使用静态成员的程序——CallStaticMember：\n\
  \n```cpp\n// CallStaticMember - 演示调用\n//                    静态成员函数的两种方法\n\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  class Student\n{\n  public:\n    Student(const char* pN = \"no name\") : sName(pN)\n\
  \    {\n        noOfStudents++;\n    }\n    ~Student() { noOfStudents--; }\n   \
  \ const string& name() { return sName; }\n    static int number() { return noOfStudents;\
  \ }\n  protected:\n    string sName;\n    static int noOfStudents;\n};\n\nint Student::noOfStudents\
  \ = 0;\n\nint main(int argcs, char* pArgs[])\n{\n    // 创建两个学生并询问类“有多少个？”\n    Student\
  \ s1(\"Chester\");\n    Student* pS2 = new Student(\"Scooter\");\n    cout << \"\
  Created \" << s1.name()\n         << \" and \"     << pS2->name() << endl;\n   \
  \ cout << \"Number of students is \"\n          << s1.number() << endl;\n    //\
  \ 现在删除一个学生并再次询问\n    cout << \"Deleting \" << pS2->name() << endl;\n    delete pS2;\n\
  \    cout << \"Number of students is \"\n          << Student::number() << endl;\n\
  \    // 等待用户准备好后再终止程序\n    // 以便用户看到程序结果\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  该程序了两个 `Student` 对象，一个在本地，一个在堆上。然后它显示它们的名字和学生数量。接下来，程序删除了其中一个学生并询问类有多少学生。程序的输出如下：\n\
  \n```\nCreated Chester and Scooter\nNumber of students is 2\nDeleting Scooter\n\
  Number of students is 1\nPress any key to continue...\n```\n\n该类保持其数据成员的保护状态，并提供了访问函数，允许外部（非\
  \ `Student`）代码读取但不能修改它们。\n\n![tip.eps](img/tip_fmt.png) 将 `name()` 方法的返回类型声明为 `string&`\
  \ 而不是简单的 `string`，会导致函数返回对象现有名称的引用，而不是创建一个临时字符串对象。（关于构造和避免临时对象的精彩论述，请参阅第 17 章节。）在声明中添加\
  \ `const` 可以防止调用者修改类的名称成员。\n\n注意静态成员函数 `number()` 如何访问静态数据成员 `noOfStudents`。事实上，这是该类中它唯一访问的成员——静态成员函数不与任何对象关联。如果我将\
  \ `name()` 声明为静态的，我可以引用 `Student::name()`，这会立即引发问题：“哪一个名字？”\n\n下面的代码段仅是我知道的一个案例，其中静态方法可以直接引用非静态成员：\n\
  \n```cpp\nclass Student\n{\n  public:\n    static int elementsInName()\n    {\n\
  \        int sizeOfArray = sizeof(name);\n        return sizeOfArray/sizeof(char);\n\
  \    }\n  protected:\n    char name[MAX_NAME_SIZE];\n};\n```\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 在这里，静态方法 `elementsInName()` 引用了 `name` 而没有引用任何对象。这在 2011 标准之前是不合法的。现在它是允许的，因为所有对象的\
  \ `sizeof name` 都是相同的。因此，你引用哪个对象并不重要。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 你可能会纳奇为什么我将 `sizeof(name)` 除以 `sizeof(char)`。`sizeof(name)` 返回数组名中的字节数。但我们想要的是\
  \ `name` 中的元素数量，所以我们必须除以 `sizeof(char)`。\n\n## 这是关于什么？\n\n非静态对象如何知道它正在引用什么？换句话说，当我向\
  \ `Student` 对象索要它的名字时，`name()` 如何知道是指哪一个 `sName`？\n\n当前对象的地址作为隐式参数传递给每个非静态方法。当需要引用此对象时，C++\
  \ 给它命名为 `this`。`this` 是每个对象中的一个关键字，意味着“当前对象”。接下面的代码说明了这一点：\n\n```cpp\nclass SC\n\
  {\n  public:\n    void dyn(int a); // 类似 SC::dyn(SC *this, int a)\n    static void\
  \ stat(int a); // 类似 SC::stat(int a)\n};\n\nvoid fn(SC& s)\n{\n    s.dyn(10); //\
  \ -转换为 SC::dyn(&s, 10);\n    s.stat(10); // -转换为 SC::stat(10);\n}\n```\n\n也就是说，函数\
  \ `dyn()` 的解释几乎就像它声明为 `void SC::dyn(SC *this, int a)` 一样。编译器所示，对 `dyn()` 的调用将 `s`\
  \ 的地址作为第一个参数传递。`SC::dyn()` 中对其他非静态成员的引用会自动使用 `this` 参数作为当前对象的指针。当调用 `SC::stat()`\
  \ 时，没有传递对象地址。因此，在引用非静态函数时，它没有 `this` 指针可用，这就是为什么我说静态成员函数不与任何当前对象关联。\n\n你可以在第 13\
  \ 章节面向对象的列表程序中显式使用 `this`，该程序被称为 `LinkedLIstData`。整个程序可以在在线材料 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取；`NameDataSet` 类出现在：\n\n```cpp\n// NameDataSet - 存储人的名字（这些对象\n// 可以轻松存储任何其他所需的\n\
  // 信息）。\nclass NameDataSet\n{\n  public:\n    NameDataSet(string& refName)\n   \
  \   : sName(refName), pNext(nullptr) {}\n};\n```\n\n\n\n\n```cpp\n    // 将自已添加到列表开头\n\
  \n    void add()\n    {\n        this->pNext = pHead;\n        pHead = this;\n \
  \   }\n    // 访问方法\n    static NameDataSet* first() { return pHead; }\n    NameDataSet*\
  \ next()  { return pNext; }\n    const string& name()  { return sName; }\nprotected:\n\
  \    string sName;\n    // 指向列表中第一个和下一个成员的链接\n    static NameDataSet* pHead;\n \
  \   NameDataSet* pNext;\n};\n\n// 为头指针分配空间\nNameDataSet* NameDataSet::pHead = nullptr;\n\
  ```\n\n在这里你可以看到，指向列表开头的 `pHead` 指针已转换为静态数据成员，因为它适用于整个类。此外，`pNext` 已成为一个数据成员，并提供了访问方法，以便其他程序访问该类中现在受保护的成员。\n\
  \n`add()` 方法通过首先将其 `pNext` 指针设置为列表开头，将当前对象添加到列表中。下一条语句通过赋值操作 `pHead = this.` 使头指针指向当前对象。\n\
  \n# 第四部分\n\n## 继承\n\n![9781118823774-pp0401.tif](img/9781118823774-pp0401_fmt.png)\n\
  \n![webextras.eps](img/webextras_fmt.png) 访问 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取优质的 Dummies 在线内容。\n\n在这一部分……\n\n* 继承基类\n* 探索关系\n* 提取共同属性\n* 声明抽象类\n* 访问 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取优质的 Dummies 在线内容\n\n# 第 19 章\n\n# 继承类\n\n### 本章内容\n\n![arrow](img/arrow.png)\
  \ 定义继承\n![arrow](img/arrow.png) 继承基类\n![arrow](img/arrow.png) 构建基类\n![arrow](img/arrow.png)\
  \ 探索有意义的关系：IS_A 与 HAS_A 关系\n\n本章讨论了 `inheritance`，即一个类继承另一个类的能力或属性的能力。\n\n继承是一个常见的概念。我是一个人类（除非我早上刚醒来时除外）。我从\
  \ `Human` 类继承了某些属性，例如我（在多程度上）智能地对话的能力，以及对空气、水和碳水化合物营养的依赖（我恐怕我对后者的依赖过度了）。这些属性并不是人类所独。`Human`\
  \ 类从 `Mammal` 类继承了对空气、水和营养的依赖，而 `Mammal` 又从 `Animal` 类继承了这些依赖。\n\n传递属性的能力是非常强大的能力。它让你能够以一种非常经济的方式描述事物。例如，如果我儿子问：“什么是鸭子？”我说：“它是一种会嘎嘎叫的鸟。”尽管你怎么想，这个答案传达了大量的信息。他知道什么是鸟，现在他知道了关于鸭子的所有相同信息，加上鸭子额外的属性“嘎嘎叫性”（关于此点和其他深刻观察的进一步讨论，请参阅第\
  \ 11 章。）\n\n面向对象（OO）语言通过允许一个类继承另一个类来表达这种继承关系。面向对象语言生成的模型比不支持继承的语言生成的模型更接近真实世界（记住真实世界中的东西！）\n\
  \nC++ 允许一个类按如下方式继承另一个类：\n\n```cpp\nclass Student\n{\n};\n\nclass GraduateStudent\
  \ : public Student\n{\n\n};\n```\n\n在这里，`GraduateStudent` 继承了 `Student` 的所有成员。因此，一个\
  \ `GraduateStudent` **是一个**（IS_A）`Student`。（`IS_A` 的大写强调了这种关系的重要性。）当然，`GraduateStudent`\
  \ 也可能包含 `GraduateStudent` 特有的其他成员。\n\n## 我需要继承吗？\n\n继承引入到 C++ 有几个原因。当然，主要的原因是为了表达继承关系的能力。（我稍后会回到这一点。）一个次要原因是为了减少打字量。假设你有一个\
  \ `Student` 类，你被要求添加一个名为 `GraduateStudent` 的新类。继承可以极地减少你需要放入类中的内容。在 `GraduateStudent`\
  \ 类中，你真正需要的只是描述学生和研究生之间差异的内容。\n\n另一个次要的副作用与软件修改有关。假设你自某个现有的类。后来，你发现基类的行为并不完全符合子类的需求。或者该类有一个\
  \ Bug。修改基类可能会破坏使用该基类的其他代码。创建并使用一个新的子类，用修正的版本重载该功能可以解决你的问题，而不会给他人带来进一步的问题。\n\n##\
  \ 类继承吗？\n\n这里是填充成程序的 `GraduateStudent` 示例：\n\n```cpp\n// 继承示例 - 演示继承关系\n// 子类构造函数将参数信息传递给基类中的构造函数\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\
  \nclass Advisor {}; // 定义一个空的\n\nclass Student\n{\npublic:\n    Student(const char\
  \ *pName = \"no name\")\n    : name(pName), average(0.0), semesterHours(0)\n   \
  \ {\n        cout << \"Constructing student \" << name << endl;\n    }\n    void\
  \ addCourse(int hours, float grade)\n    {\n        cout << \"Adding grade to \"\
  \ << name << endl;\n        average = semesterHours * grade;\n        semesterHours\
  \ += hours;\n        average = average / semesterHours;\n    }\n    int hours()\
  \ { return semesterHours; }\n    float gpa() { return average; }\nprotected:\n \
  \   string name;\n    double average;\n    int semesterHours;\n};\n\nclass GraduateStudent\
  \ : public Student\n{\npublic:\n    GraduateStudent(const char *pName, Advisor adv,\
  \ double qG = 0.0)\n    : Student(pName), advisor(adv), qualifierGrade(qG)\n   \
  \ {\n        cout << \"Constructing graduate student \" << pName << endl;\n    }\n\
  \    double qualifier() { return qualifierGrade; }\nprotected:\n    Advisor advisor;\n\
  \    double qualifierGrade;\n};\n\nint main(int nNumberofArgs, char* psz[])\n{\n\
  \    // 创建一个虚拟导师给给 GraduateStudent\n    Advisor adv;\n    // 创建两个 Student 类型\n \
  \   Student llu(\"Cy N Sense\");\n    GraduateStudent gs(\"Matt Madox\", adv, 1.5);\n\
  \    // 现在为他们的平均学点分添加一个分数\n    llu.addCourse(3, 2.5);\n    gs.addCourse(3, 3.0);\n\
  \    // 显示研究生的毕业考试分\n    cout << \"Matt's qualifier grade = \" << gs.qualifier()\
  \ << endl;\n    // 等待用户准备好后再终止程序\n    // 让用户看到程序结果\n    cout << \"Press Enter to\
  \ continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
  \ 0;\n}\n```\n\n此程序演示了两个对象的创建和使用，一个是 `Student` 类，另一个是 `GraduateStudent`。该程序的输出如下：\n\
  \n```\nConstructing student Cy N Sense\nConstructing student Matt Madox\nConstructing\
  \ graduate student Matt Madox\nAdding grade to Cy N Sense\nAdding grade to Matt\
  \ Madox\nMatt's qualifier grade = 1.5\nPress Enter to continue...\n```\n\n### 使用子类\n\
  \n`Student` 类是按照传统定义的。然而，`GraduateStudent` 类有点不同。类定义开头的冒号后面 `public Student` 声明\
  \ `GraduateStudent` 是 `Student` 的子类。\n\n![tip.eps](img/tip_fmt.png) `public` 关键字的出现暗示可能存在保护继承。好吧，确实如此，但\
  \ `protected` 继承很少使用，并且超出了本书的范围。\n\n\n\n\n\n程序员喜欢发明新术语，或者给现有术语赋予新含义。甚至，程序员会发明新术语，然后给它们赋予第二个含义。以下是一组描述相同关系的等效表达式：\n\
  \n* `GraduateStudent` 是 `Student` 的子类。\n* `Student` 是 `GraduateStudent` 的基类或父类。\n\
  * `GraduateStudent` 继承或派自 `Student`。\n* `GraduateStudent` 扩展 `Student`。\n\n作为 `Student`\
  \ 的子类，`GraduateStudent` 继承了它所有的成员。例如，一个 `GraduateStudent` 拥有 `name`，尽管该成员是在基类中声明的。然而，子类可以添加自己的成员，例如\
  \ `qualifierGrade`。毕竟，`gs` 从字面意思来说确实是一个 `Student` 加上多出来点东西。\n\n`main()` 函数声明了两个对象：类型为\
  \ `Student` 的 `llu` 和类型为 `GraduateStudent` 的 `gs`。然后，它访问了这两种类型学生的 `addCourse()`\
  \ 成员函数。随后 `main()` 访问了仅作为子类成员的 `qualifier()` 函数。\n\n### 构建子类\n\n尽管子类可以访问基类的保护成员并可能初始化它们，但每个子类都负责初始化自己。\n\
  \n在控制权离开 `GraduateStudent` 构造函数的左括号之前，控制权会传递给 `Student` 相应的构造函数。如果 `Student` 是基于另一个类（例如\
  \ `Person`），那么该类的构造函数将在 `Student` 构造函数获取控制权之前被调用。就像盖大楼一样，对象的构建是从“地下室”类开始，一层向上沿着类结构构建的。\n\
  \n就像成员对象一样，你通常需要能够向基类构造函数传递参数。示例程序如下声明子类构造函数：\n\n```cpp\nGraduateStudent(const char\
  \ *pName, Advisor adv,\n                double qG = 0.0)\n    : Student(pName),\
  \ advisor(adv), qualifierGrade(qG)\n{\n    // 构造函数执行的其他任何操作\n}\n```\n\n在这里，`GraduateStudent`\
  \ 的构造函数调用了 `Student` 的构造函数，并为其传递了参数 `pName`。然后，C++ 在执行构造函数括号内的语句之前，初始化成员 `advisor`\
  \ 和 `qualifierGrade`。\n\n如果子类没有显式引用不同的构造函数，则执行基类的默认构造函数。因此，在下面的代码段中，`Pig` 基类在 `LittlePig`\
  \ 的任何成员之前被构建，尽管 `LittlePig` 没有显式引用该构造函数：\n\n```cpp\nclass House {};\n\nclass Pig\n\
  {\n  public:\n    Pig() : pHouse(nullptr) {}\n  protected:\n    House* pHouse;\n\
  };\n\nclass LittlePig : public Pig\n{\n  public:\n    LittlePig(double volStraw,\
  \ int numSticks,\n              int numBricks)\n      : straw(volStraw), sticks(numSticks),\n\
  \      bricks(numBricks) { }\n  protected:\n    double straw;\n    int sticks;\n\
  \    int bricks;\n};\n```\n\n同样，基类的拷贝构造函数也会自动调用。\n\n### 析构子类\n\n根据析构函数调用顺序与构造函数相反的规则，`GraduateStudent`\
  \ 的析构函数首先获得控制权。在完成最后的奉献后，控制权传递给 `Advisor` 的析构函数，然后传递给 `Student` 的析构函数。如果 `Student`\
  \ 是基于类 `Person`，那么 `Person` 的析构函数将在 `Student` 之后获得控制权。\n\n这是逻辑性的。内存块首先转换为 `Student`\
  \ 对象。只有那时，`GraduateStudent` 构造函数的任务才是将这个简单的 `Student` 转换为 `GraduateStudent`。析构函数只是反转了这一过程。\n\
  \n### 继承构造函数\n\n![c++11_fmt.eps](img/c11_fmt.png) 从 2011 标准开始，子类也可以继承其基类的构造函数，如下代码所示：\n\
  \n```cpp\nclass Student\n{\n  public:\n    Student(string name);\n};\n\nclass GraduateStudent\
  \ : public Student\n{\n  public:\n    using Student::Student; // 继承基类构造函数\n};\n\
  ```\n\n这创建了一个 `GraduateStudent(string)` 构造函数，就像输入了以下内容一样：\n\n```cpp\nclass GraduateStudent\
  \ : public Student\n{\n  public:\n    GraduateStudent(string name) : Student(name)\
  \ {}\n};\n```\n\n继承基类构造函数的优势是子类继承了基类所有的构造函数。当在以某种简单的方式扩展重要的基类构建子类时，这非常有用。\n\n##\
  \  HAS_A 关系\n\n注意 `GraduateStudent` 类包含了 `Student` 类和 `Advisor` 类的成员，但方式不同。通过定义一个\
  \ `Advisor` 类型的数据成员，你知道 `Student` 内部包含了 `Advisor` 的所有数据成员。然而，你不能说 `GraduateStudent`\
  \ 是一个 `Advisor` —— 相地，你说 `GraduateStudent` 拥有（HAS_A）一个 `Advisor`。这与继承之间有什么区别？\n\n\
  以汽车为例。你可以逻辑上将汽车定义为车辆的子类，因此它继承了其他车辆的属性。同时，汽车有一个发动机。如果你买了一辆汽车，你逻辑上可以假设你也买了一个发动机。（除非你去了我上次买回那堆废铁的二手车场）。\n\
  \n如果朋友请你周六开上你选择的车辆参加集会，而你开车去，他们就不能抱怨（即使有人骑自行车出现），因为汽车是一辆车辆（IS_A vehicle）。但如果你徒脚提着发动机出现，你的朋友会有理由嘲笑你，因为发动机不是车辆。发动机缺少了所有车辆共有的某些关键属性——例如可以骑的地方。\n\
  \n从编程的角度来看，HAS_A 关系非常直观。考虑以下：\n\n```cpp\nclass Vehicle {};\n\nclass Motor {};\n\n\
  class Car : public Vehicle\n{\n  public:\n    Motor motor;\n};\n\nvoid VehicleFn(Vehicle&\
  \ v);\n\nvoid MotorFn(Motor& m);\n\nint main(int argcs, char* pArgs[])\n{\n  Car\
  \ car;\n  VehicleFn(car); // 这是允许的\n  MotorFn(car);   // 这是不允许的\n  MotorFn(car.motor);//\
  \ 这是允许的\n  return 0;\n}\n```\n\n调用 `VehicleFn(car)` 是允许的，因为 `car` 是车辆。调用 `MotorFn(car)`\
  \ 不允许，因为 `car` 不是 Motor，尽管它包含一个 Motor。如果意要把 `c` 的 Motor 部分传递给函数，必须显式表示，例如调用 `MotorFn(car.motor)`。\n\
  \n第 20 章\n\n# 检查虚成员函数：它们是真的吗？\n\n本章内容\n\n![arrow](img/arrow.png) 发现多态（又称晚绑定）是如何工作的\n\
  ![arrow](img/arrow.png) 找出玉米片有多安全\n![arrow](img/arrow.png) 在子类中重写成员函数\n![arrow](img/arrow.png)\
  \ 查看关于多态的特殊考虑因素\n\n函数参数的数量和类型包含在它的完整（或*扩展的*）名称中。这使得你只要扩展名称不同，就可以给两个函数取相同的名字：\n\n\
  ```cpp\nvoid someFn(int);\nvoid someFn(char*);\nvoid someFn(char*, double);\n```\n\
  \n在所有三种情况下，这些函数的短名都是 `someFn()`（嘿！这很有趣）。这三个函数的扩展名称各不相同：`someFn(int)` 相对于 `someFn(char*)`，依此类推。C++\
  \ 在调用时根据参数来确定指的是哪一个函数。\n\n成员函数可以被重载。参数的数量、参数类型以及类类都是扩展名称的一部分。\n\n然而，继承引入了一个全新的问题。如果基类中的一个函数与子类中的一个函数同名怎么办？考虑下面这个简单的代码段：\n\
  \n```cpp\nclass Student\n{\n  public:\n    double calcTuition();\n};\n\nclass GraduateStudent\
  \ : public Student\n{\n  public:\n    double calcTuition();\n};\n```\n\n\n\n\n```cpp\n\
  \   Student s;\n\n   GraduateStudent gs;\n\n   s.calcTuition(); //calls Student::calcTuition()\n\
  \n   gs.calcTuition();//calls GraduateStudent::calcTuition()\n\n   return 0;\n}\n\
  ```\n\n与任何重载情况一样，当程序员引用 `calcTuition()` 时，C++ 必须决定意图是指哪一个 `calcTuition()`。显然，如果这两个函数的参数类型不同，就没有问题。即使参数相同，类名也足以解析该调用，这个例子也不例外。调用\
  \ `s.calcTuition()` 指的是 `Student::calcTuition()`，因为 `s` 在局部被声明为 `Student` 类型，而 `gs.calcTuition()`\
  \ 指的是 `GraduateStudent::calcTuition()`。但如果对象的确切类在编译时无法确定了呢？为了演示这种情况是如何发生的，请以一种看似微不足道的方式修改前面的程序：\n\
  \n```cpp\n // OverloadOverride - 演示函数何时\n// 在编译时重载，何时在运行时覆盖的\n\n#include <cstdio>\n\
  \n#include <cstdlib>\n\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n\
  {\n  public:\n    // 取消下面两行中的某一个\n    // 其中一个早期绑定 calcTuition()，\n    // 另一个晚期绑定\n\
  //      void calcTuition()\n    virtual void calcTuition()\n    {\n        cout\
  \ << \"We're in Student::calcTuition\" << endl;\n    }\n};\n\nclass GraduateStudent\
  \ : public Student\n{\n  public:\n    void calcTuition()\n    {\n      cout<<\"\
  We're in GraduateStudent::calcTuition\"<<endl;\n    }\n};\n\nvoid fn(Student& x)\n\
  {\n    x.calcTuition(); // 哪个 calcTuition()？\n}\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 将基类对象传递给函数\n    // (以匹配声明)\n    Student s;\n    fn(s);\n\
  \    // 改为传递基类的特化类\n    GraduateStudent gs;\n    fn(gs);\n    // 在终止程序前等待用户准备好\n\
  \    // 允许用户查看程序结果\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n现在不再是直接调用 `calcTuition()`，而是通过一个中间函数\
  \ `fn()` 进行调用。取决于如何调用 `fn()`，`x` 可以是 `Student` 也可以是 `GraduateStudent`。`GraduateStudent`\
  \ **是一个** `Student`。\n\n![remember.eps](img/remember_fmt.png) 如果你忘记了为什么 `GraduateStudent`\
  \ **是一个** `Student`，请参阅第 19 章 节。\n\n传递给 `fn()` 的参数 `x` 被声明为 `Student` 的引用。\n\n![remember.eps](img/remember_fmt.png)\
  \ 通过引用传递对象比按值传递对象要高效得多。关于创建对象的论述，请参见第 17 章 节。\n\n你可能希望当 `x` 是 `Student` 时，`x.calcTuition()`\
  \ 调用 `Student::calcTuition()`；而当 `x` 是 `GraduateStudent` 时，调用 `GraduateStudent::calcTuition()`。如果\
  \ C++ 那么智能，那就太酷了。\n\n![tip.eps](img/tip_fmt.png) 你到目前为止的类型被称为**静态**类型，或**编译时**类型。在上述两种情况下，`x`\
  \ 的编译时类型都是 `Student`，因为 `fn()` 中的声明是这样说的。另一种类型是**动态**类型，或**运行时**类型。在示例函数 `fn()`\
  \ 的例子中，当用 `s` 调用 `fn()` 时，`x` 的运行时类型是 `Student`；当用 `gs` 调用 `fn()` 时，`x` 的运行时类型是\
  \ `GraduateStudent`。我们不是觉得很有趣吗？\n\n根据运行时类型决定调用多个重载成员函数中的哪一个的能力被称为**多态**（polymorphism）或**晚期绑定**（late\
  \ binding）。在编译时决定调用哪个重载函数被称为**早期绑定**（early binding），因为这听起来像是晚期绑定的相反面。\n\n以多态方式重载基类函数被称为**覆盖基类函数**（overriding\
  \ the base class function）。这个新名称用于将这种更复杂的情况与普通的重载情况区分开。\n\n## 为什么你需要多态\n\n多态是面向对象编程力量的关键。它是如此重要，以至于不支持多态的语言不能自称为面向对象的语言。（我认为这是一项政府规定——如果一种语言不支持多态，你就不能将其标记为面向对象，除非你加上来自医务长的免责声明之类的。）\n\
  \n没有多态，继承几乎没有任何意义。记得我如何在烤箱里做玉米片吗？在这个意义上，我扮演了晚期绑定者的角色。食谱写着：在烤箱中加热玉米片。它并没有写道：如果烤箱类型是微波炉，这样做；如果烤箱类型是传统的，那样做；如果烤箱类型是对流的，做另一件事。食谱（代码）依赖于我（晚期绑定者）来决定动作\
  \ `heat`（成员函数）作用于烤箱（`Oven` 类的特定实例）或其任何变体（子类，如微波炉（`Microwave`）时意味着什么。人类就是这样思考的，按照人类思考的方式来设计语言，允许编程模型更准确地描述人们生活的的世界。\n\
  \n## 多态如何工作\n\n任何给语言都可以根据其开发者的喜好支持早期绑定或晚期绑定。旧语言如 C 倾向于只支持早期绑定。现代语言如 Java 和 C# 仅支持晚期绑定。作为一个“跨界者”，C++\
  \ 同时支持早期绑定和晚期绑定。\n\n你可能会对 C++ 的默认值是早期绑定感到惊讶。`OverloadOverride` 程序的输出如下：\n\n```\n\
  \  We're in Student::calcTuition\nWe're in Student::calcTuition\nPress Enter to\
  \ continue...\n```\n\n原因很简单，尽管有点过时。首先，C++ 默认必须尽可能像 C，以保持与其前身语言的向上兼容性。其次，多态在数据存储和执行调用所需的代码方面都为每个函数调用增加了少量开销。C++\
  \ 的创始人担心任何额外的开销都会被作为不采用 C++ 作为系统首选语言的理由，因此他们将效率更高的早期绑定设置为默认。\n\n要使成员函数具有多态性，程序员必须使用\
  \ C++ 关键字 `virtual` 对该函数进行标记，如下所示对 `OverloadOveride` 程序声明的修改：\n\n```cpp\n  class\
  \ Student\n{\n  public:\n    virtual void calcTuition()\n    {\n        cout <<\
  \ \"We're in Student::calcTuition\" << endl;\n    }\n};\n```\n\n`virtual` 关键字告诉\
  \ C++ `calcTuition()` 是一个多态成员函数。也就是说，将 `calcTuition()` 声明为虚意味着如果对调用 `calcTuition()`\
  \ 的对象的运行时存在任何疑问，则对它的调用将晚期绑定。\n\n在 `calcTuition()` 声明为虚的情况下执行 `OverloadOveride` 程序会产生以下输出：\n\
  \n```\n  We're in Student::calcTuition\nWe're in GraduateStudent::calcTuition\n\
  Press Enter to continue...\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 如果你熟悉 C++ 环境自带的调试器，你真的应该单步执行这个示例。看到程序在第一次调用 `fn()` 时单步进入 `Student::calcTuition()`，而在第二次调用时进入\
  \ `GraduateStudent::calcTuition()`，这种感觉简直太酷了。我不认为在尝试过之前，你就能真正领会多态。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你只需要在基类中将函数声明为虚函数。“虚性”会自动传递到子类。然而，在本书中，我遵循在处处声明虚函数的编码规范。\n\n## 虚函数何时不是虚的？\n\n\n\
  \n\n\n仅仅你认为某个特定的函数调用是晚绑定（late bound），并不意味着它确实如此。如果在子类中没有以相同的参数声明，那么成员函数就不会发生多态重写，无论它们是否被声明为\
  \ `virtual`。\n\n相同声明规则有一个例外：如果基类中的成员函数返回指向基类对象的指针或引用，那么子类中重写的成员函数可以返回指向子类对象的指针或引用。换句话说，函数\
  \ `makeACopy()` 是多态的，尽管这两个函数的返回类型不同：\n\n```cpp\nclass Base\n{\n  public:\n    //\
  \ 返回当前对象的拷贝\n    Base* makeACopy();\n};\n\nclass SubClass : public Base\n{\n  public:\n\
  \    // 返回当前对象的拷贝\n    SubClass* makeACopy();\n};\n\nvoid fn(Base& bc)\n{\n    Base*\
  \ pCopy = bc.makeACopy();\n    // 继续执行...\n}\n```\n\n在实践中，这是非常自然的。`makeACopy()`\
  \ 函数应该返回一个 `SubClass` 类型的对象，即使它可能重写了 `BaseClass::makeACopy()`。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 这种默默决定函数何时重写、何时不重写的机制是 C++ 中的错误来源；以至于 2011 年的标准引入了 `override` 描述符，程序员可以使用它来表示其重写基类函数的意图。如果一个函数被声明为\
  \ `override` 但由于某种原因（例如参数不匹配）实际上没有重写基类函数，C++ 将生成编译错误，如下例：\n\n```cpp\nclass Student\n\
  {\n  public:\n    virtual void addCourseGrade(double grade);\n};\n\nclass GradStudent\
  \ : public Student\n{\n  public:\n    virtual void addCourseGrade(float grade) override;\n\
  };\n```\n\n这段代码会产生编译错误，因为方法 `GradStudent::addCourseGrade(float)` 被声明为 `override`，但它实际上并没有重写基类函数\
  \ `Student::addCourseGrade(double)`，因为参数类型不匹配。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 程序员还可以使用 `final` 关键字将函数声明为不可重写，即使该函数本身重写了之前的某个基类函数，如下面的额外 `PostDoc` 类所示：\n\n```cpp\n\
  class GradStudent : public Student\n{\n  public:\n    virtual void addCourseGrade(double\
  \ grade) final;\n};\n\nclass PostDoc : public GradStudent\n{\n  public:\n    virtual\
  \ void addCourseGrade(double grade);\n};\n```\n\n由于 `Student::addCourseGrade()`\
  \ 被标记为 `final`，`PostDoc::addCourseGrade()` 的声明会产生错误，因为它试图重写该 `Student` 方法。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 此外，整个类也可以被声明为 `final:`：\n\n```cpp\nclass GradStudent final: public Student\n```\n\
  \n影响的不仅仅是类的虚方法。`final` 类完全无法被继承。\n\n## 虚函数的考量\n\n在使用虚函数时，你需要记住几点。首先，静态成员函数不能声明为\
  \ `virtual`。因为静态成员函数不是通过对象调用的，因此没有运行时对象可以作为绑定决策的基础。\n\n其次，在调用时指定类名会强制调用进行早期绑定（early\
  \ bind），无论该函数是否为虚函数。例如，以下调用是对 `Base::fn()` 的调用，因为程序员是指定的，即使 `fn()` 被声明为虚函数：\n\n\
  ```cpp\nvoid test(Base& b)\n{\n  b.Base::fn();     // 此处调用不是晚绑定的\n}\n```\n\n最后，构造函数不能是虚函数，因为没有（已完成的）对象来确定类型。在构造函数被调用时，对象占据的内存仅仅是一块无形的区域。只有在构造函数执行完成后，对象才成为该类正式的成员。\n\
  \n相比之下，析构函数几乎应该总是声明为虚函数。否则，你将面临不当析构对象的风险，如下所示：\n\n```cpp\nclass Base\n{\n  public:\n\
  \    ~Base();\n};\n\nclass SubClass : public Base\n{\n  public:\n    ~SubClass();\n\
  };\n\nvoid finishWithObject(Base* pHeapObject)\n{\n    // ...处理对象...\n    // 现在将其归还给堆\n\
  \    delete pHeapObject; // 无论 pHeapObject 的运行时类型是什么，都会调用 ~Base()\n}\n```\n\n如果传递给\
  \ `finishWithObject()` 的指针确实指向一个 `SubClass`，那么 `SubClass` 析构函数就不会被正确调用——因为析构函数没有声明为虚函数，它总是早期绑定的。将析构函数声明为虚函数解决了这个问题。\n\
  \n那么，什么你不想将析构函数声明为虚函数？只有一种情况。虚函数会引入“微小的”开销。具体来说：当程序员在类中定义第一个虚函数时，`C++` 会增加一个额外的隐藏指针——不是每个虚函数一个指针，只要该类有虚函数就添加一个指针。没有虚函数的类（且没有从基类继承任何虚函数的类）则没有这个指针。\n\
  \n现在，一个指针听起来没什么什么，除非满足以下两个条件，否则确实如此：\n\n*   该类没有许多数据成员（因此与现有内容相比，一个指针代表了很大比例）。\n\
  *   你打算创建大量该类的对象（否则，开销不会产生任何影响）。\n\n如果这两个这两个条件且你的类已经没有虚成员函数，你可能不想将析构函数声明为虚函数。\n\n\
  ![warning.eps](img/warning_fmt.png) 除了这一种情况外，始终将析构函数声明为虚函数，即使一个类尚未被子类化——你永远不知道何时会有人出现并将你的类作为他们自己的基类。如果你不将析构函数声明为虚函数，请将类声明为\
  \ `final`（如果你的编译器支持此功能）并对其进行说明！\n\n# 第 21 章\n\n# 类的重构\n\n## 本章\n\n*   ![arrow](img/arrow.png)\
  \ 将公共属性重构到基类\n*   ![arrow](img/arrow.png) 使用抽象类持有重构后的信息\n*   ![arrow](img/arrow.png)\
  \ 声明抽象类\n*   ![arrow](img/arrow.png) 继承自抽象类\n*   ![arrow](img/arrow.png) 使用项目文件将程序分为多个模块\n\
  \n继承的概念允许一个类继承基类的属性。继承有许多目的，包括支付我儿子的大学费。继承的主要优势是能够指出类与类之间的关系。这就是所谓的 IS_A（是一个）关系——例如\
  \ `微波炉 是一个 烤箱` 之类的关系。\n\n如果你能建立正确的关联，重构（Factoring）是非常棒的。例如，微波炉与传统烤箱的关系看起来是自然的。如果声称微波炉是一种特殊的烤面包机，你就会遇到麻烦。确实，它们都能让东西变热，都使用电，而且都在厨房里，但相似性仅此于此——微波炉不能烤面包，而烤面包机不能做墨西哥玉米。\n\
  \n识别问题中固有的类并在这些类之间建立正确的关系被称为 `factoring`（重构/分解）。（这个词与你小学被迫做的算术有关：例如，分解最小公分母，12 等于\
  \ 2 乘以 2 乘以 3。）\n\n## 重构\n\n本节描述了如何通过银行账户示例使用继承来简化你的程序。假设你被要求编写一个简单的银行程序，实现储蓄账户和支票账户的概念。\n\
  \n\n\n\n\n关于这些类，我可以一直聊到口破舌燥；然而，面向对象的程序员们想出了一种简洁的方法，通过图表来描述类的要点。`Checking` 和 `Savings`\
  \ 类如图 21-1 所示。（这只是用图形化表达相同内容的几种方法之一。）\n\n![9781118823774-fg2101.tif](img/9781118823774-fg2101_fmt.png)\n\
  \n图 21-1：独立的类 `Checking` 和 `Savings`。\n\n阅读此图及其他图表时，请记住以下几点：\n\n*   大框表示类，类名位于顶部。\n\
  *   框内的名称是成员函数。\n*   不在框内的名称是数据成员。\n*   延伸到框外的名称是公开访问的成员；也就是说，这些成员可以被该类或其任何后代类的函数访问。完全在框内的成员无法从类外部访问。\n\
  *   粗箭头（见图 21-2）表示 IS_A（是）关系。\n*   细箭头表示 HAS_A（拥有）关系。\n\n![remember.eps](img/remember_fmt.png)\
  \ 一辆 `Car` 是一辆 `Vehicle`（车辆），但一辆 `Car` 拥有一个 `Motor`（发动机）。\n\n你可以从图 21-1 中看到 `Checking`\
  \ 和 `Savings` 类有许多共同点。例如，这两个类都有 `withdrawal()` 和 `deposit()` 成员函数。然而，由于这两个类并不完全相同，它们必须保持为独立的类。（在现实银行应用程序中，这两个类的区别会比这个示例中大得多。）尽管如此，应该有一种方法来避免这种重复。\n\
  \n你可以让其中一个类继承另一个。`Savings` 的成员比 `Checking` 多，所以你可以让 `Savings` 继承自 `Checking`。这种安排如图\
  \ 21-2 所示。`Savings` 类继承了所有的成员。该类通过添加数据成员 `noWithdrawals` 并重写函数 `withdrawal()` 来完善。你必须重写\
  \ `withdrawal()`，因为从储蓄账户取款的规则与从支账户取款的规则不同。\n\n![9781118823774-fg2102.tif](img/9781118823774-fg2102_fmt.png)\n\
  \n图 21-2：作为 `Checking` 子类的实现的 `Savings`。\n\n虽然让 `Savings` 继承 `Checking` 可以省力，但并不让人完全满意。主要问题是，就像我驾照上写的体重一样，它歪曲了事实。这种继承关系意味着储蓄账户是支账户的一种特殊类型，但事实并非如此。\n\
  \n“那又怎样？”你说。“继承是有效的，而且省力。”确实如此，但我的顾虑不仅仅是风格上的小事节——我的顾虑涉及到城里一些最好的餐厅（至少所有卡车司机都是这么说的）。这种歪曲的表示对今天和明天的程序员来说都是困惑的。总有一天，一个不熟悉我们编程技巧的程序员将不得不阅读并理解我们的代码在做什么。误导性的表示是很难调和和理解的。\n\
  \n此外，这种歪曲的表示在未来导致问题。例如，假设银行更改了关于支账户的政策。假设它决定，只有当月内最低余额低于给定值时，才对支账户收取服务费。\n\n这种变化可以通过对\
  \ `Checking` 类进行极少修改来轻松处理。你需要在 `Checking` 类中添加一个新的数据成员，以跟踪月内的最低余额。让我们大胆地称它为 `minimumBalance`\
  \ 吧。\n\n但现在你有一个问题了。因为 `Savings` 继承自 `Checking`，`Savings` 也得到了这个新数据成员。它对这个成员毫无用，因为最低余额不会影响储蓄账户，所以它就只能呆在那里。记住，每个支账户对象都有这个额外的\
  \ `minimumBalance` 成员。多出一个数据成员可能不是什么大问题，但它会增加困惑。\n\n这种变化会累积。今天是一个额外的数据成员——明天是一个改变的成员函数。最终，储蓄账户类携带了许多仅适用于支账户的额外负担。\n\
  \n现在银行又回来决定更改某些储蓄账户政策。这要求你修改 `Checking` 中的某些函数。基类中的此类更改会自动传播到子类，除非该函数在子类 `Savings`\
  \ 中已经过重写。例如，假设银行决定每向支账户存款一次，就送送一台烤箱机。（嘿——这真的可能发生！）在银行（或其程序员）不知情的情况下，向支账户存款会自动导致赠送烤箱机。除非你非常小心，否则对\
  \ `Checking` 的更改可能会意外地出现在 `Savings` 中。\n\n如何避免这些问题呢？声称 `Checking` 是 `Savings` 的特例并不能解决我们的问题。你需要第三个类（为了开玩笑，称它为\
  \ `Account`），它体现了 `Checking` 和 `Savings` 之间的共同点，如图 21-3 所示。\n\n![9781118823774-fg2103.tif](img/97811118823774-fg2103_fmt.png)\n\
  \n图 21-3：基于公共 `Account` 类构建 `Checking` 和 `Savings`。\n\n构建新账户是如何解决问题的？首先，创建一个新的 `Account`\
  \ 类是对现实更准确的描述（无论现实是什么）。在我们事物的概念中（至少在我的概念中），确实存在一种被称为“账户”的东西。储蓄账户和支账户是这个更基础概念的特例。\n\
  \n此外，`Savings` 类不受 `Checking` 类更改的影响（反亦然）。如果银行对所有账户实行根本变更，你可以修改 `Account`，所有子类将自动继承该更改。但如果银行只对支账户更改政策，你只需要修改\
  \ `Checking`，而不影响 `Savings`。\n\n这种从相似类中提取共同属性的过程就是类提取（class factoring）的本质。\n\n![warning.eps](img/warning_fmt.png)\
  \ 只有当继承关系对应现实时，类提取才是合法的。\n\n```markdown\n## 实现抽象类\n\n尽管类提取在智力上令人满足，但它引入了自己的问题。再次回到银行账户类，特别是公共基类\
  \ `Account`。思考一下，你可能会如何定义 `Account` 中定义的不同成员函数。\n\n大多数 `Account` 成员函数没有问题，因为两种类型的账户都以相同的方式实现它们。然而，使用\
  \ `Account::*withdrawal()` 实现这些共同函数的情况是不同的。从储蓄账户取款的规则与从支账户取款的规则不同。你必须以不同于 `Checking::withdrawal()`\
  \ 的方式实现 `Savings::withdrawal()`。但你应该如何实现 `Account::withdrawal()` 呢？\n\n让我们向银行经理寻求帮助。我想象对话大致如下：\n\
  \n“从账户取款的规则是什么？”你问。\n\n“什么种类型的账户？储蓄还是支账户？”回答道。\n\n“从账户，”你说，“只是一个账户。”\n\n空白的眼神。（人们可能会说那是‘银行式的空白眼神’……话虽如此，也许也许不是。）\n\
  ```\n\n\n\n\n问题在于，这个问题本身没有意义。不存在所谓的“仅仅是一个账户”。所有的账户（在本例中）要么是支票账户，要么是储蓄账户。账户的概念是一个抽象概念，它提取了两个具体类共有的属性。它是不完整的，因为缺少了关键属性\
  \ `withdrawal()`。（在你进一步深入了解细节后，你可能会发现简单账户所欠缺的其他属性。）\n\n*抽象类*（abstract class）是仅存在于子类类。*具体类*（concrete\
  \ class）是指不是抽象类的类。\n\n### 描述抽象类概念\n\n抽象类是具有一个或多个纯虚函数的类。噢，太棒了！这非常有帮助。\n\n好了，一个*纯虚*（pure\
  \ virtual）函数是一个标记为没有实现的虚成员函数。它很可能没有实现，是因为根据类（包括任何基类）中提供的信息无法实现它。一种常规、普通的非纯虚函数被称为*具体函数*（concrete\
  \ function）（注意，具体函数可以是虚函数——遗憾的是，C++ 使用这个术语表示多态。请参见第 20 章）。\n\n声明纯虚函数的语法在以下类 `Account:`\
  \ 中演示：\n\n```cpp\n// Account - 此类是一个抽象类\nclass Account\n{\n  public:\n    Account(unsigned\
  \ accNo, double initialBalance = 0.0);\n    // 访问函数\n    unsigned int accountNo(\
  \ );\n    double acntBalance( );\n    static int noAccounts( );\n    // 事务函数\n \
  \   void deposit(double amount);\n    // 以下是一个纯虚函数\n    virtual void withdrawal(double\
  \ amount) = 0;\n\n  protected:\n    // 将账户存储在链表中，这样账户数量就没有限制\n    static int count;\
  \     // 账户数量\n    unsigned  accountNumber;\n    double    balance;\n};\n```\n\n\
  `withdrawal()` 声明后的 `= 0` 表示程序员并不打算定义此函数。该声明是为子类留的占位符。预期 `Account` 的子类将用一个具体函数来重写此函数。程序员必须为每个未声明为纯虚的成员函数提供实现。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 我觉得这种符号很愚蠢，我并不比你更喜欢它。但它会一直存在，所以你只能学会与之共处。这种符号有一个原因，即使不是完全的理由。每个虚函数必须在特殊表中有一个条目。该条目包含函数的地址。推测至少在某一次，纯虚函数的条目是\
  \ 0。无论如何，这是我们现在必须使用的语法。\n\n抽象类不能实例化为对象；也就是说，你不能从一个抽象类创建一个对象。例如，以下声明是不合法的：\n\n```cpp\n\
  void fn( )\n{\n    // 声明一个 100 美元的账户\n    Account acnt(1234, 100.00);// 这是不合法的\n\
  \    acnt.withdrawal(50);      // 你期望会发生什么\n} // 这个调用要干什么？\n```\n\n如果允许这种声明，结果对象将是不完整的，缺少某些功能。例如，前面的调用应该做什么？记住，并没有\
  \ `Account::withdrawal()`。\n\n抽象类充当其他类的基类。`Account` 包含了所有与通用银行账户相关的属性。你可以通过继承 `Account`\
  \ 来创建其他类型的银行账户。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 技术术语是*实例化*（instantiate）。我们说\
  \ `Account` 类不能实例化为对象，或者说给定的对象实例化 `Savings` 类。\n\n### 从抽象类创建一个实实在在的类\n\n抽象类的子类在所有纯虚函数被重写之前，仍然是抽象的。`Savings`\
  \ 类不是抽象的，因为它用一个完美的定义重写了纯虚函数 `withdrawal()`。`Savings` 类知道在被调用时如何执行 `withdrawal()`。`Checking`\
  \ 类也是如此，尽管答案可能不同。这两个类都不是虚类，因为 `withdrawal()` 函数重写了基类中的纯虚函数。\n\n### 传递抽象类\n\n由于你不能实例化抽象类，因此可以声明指向抽象类的指针或引用这听起来可能很奇怪。然而，通过多态，这听起来并不没那么疯狂。考虑以下代码段：\n\
  \n```cpp\nvoid fn(Account *pAccount);  // 这是合法的\n\nvoid otherFn( )\n{\n    Savings\
  \ s; Checking c;\n    // 这是合法的，因为 Savings 是一个 Account\n    fn(&s);\n    // 这里也一样\n\
  \    fn(&c);\n}\n```\n\n在这里，`pAccount` 被声明为指向 `Account` 的指针。但可以理解，当调用该函数时，将传递某些非抽象子类对象的地址，例如\
  \ `Savings` 或 `Checking`。\n\n`fn()` 接收到的所有对象要么是 `Savings` 类，要么是 `Checking` 类（或者未来某个类似的非抽象的\
  \ Account 子类）。函数确保你永远不会传递 `Account` 类的实际对象，因为你根本无法创建一个对象来传递。\n\n[www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus）上的在线材料包含一系列程序\
  \ `Budget1` 到 `Budget5`。每个程序都基本上解决了相同的问题。然而，每个程序都比前一个程序更面向对象。`Budget1` 是一个完全的功能实现，没有类的概念。`Budget2`\
  \ 实现了独立的 `Savings` 和 `Checking`。`Budget3` 使用本章介绍的技术将这两个类的相似之处提取到一个公共的抽象 `Account`\
  \ 类中。`Budget4` 和 `Budget5` 继续使用后续章节中介绍的功能。\n\n\n\n\n\n# 运算符\n\n运算符无非一个具有特殊语法的内置函数。下面的加法操作\n\
  \n```\na + b\n```\n\n可以被理解为写成：\n\n```\noperator+(a, b)\n```\n\n事实上，C++ 为每个运算符都提供了一个函数风格的名称。运算符的函数名称是关键字\
  \ `operator` 后面跟着运算符符号，并在后跟相应的参数类型。例如，将一个 `int` 加到另一个 `int` 并生成一个 `int` 的 `+` 运算符被称为\
  \ `int operator+(int, int)`。\n\n## 为用户定义的类取消运算符\n\n任何现有的运算符都可以为用户定义的类定义。因此，我可以创建一个\
  \ `Complex operator(const Complex&, const Complex&)`，它允许我乘以两个 `Complex` 类型的对象。新运算符可能与它所重载的运算符具有语义，但并非必须如此。在重载运算符时适用以下规则：\n\
  \n- 程序员不能重载 `.`（点）、`::`（冒号）、`.*`、`->`、`sizeof` 和 `?:`（三元）运算符。\n- 程序员不能发明新的运算符。例如，你不能发明操作\
  \ `x $ y`。\n- 运算符的语法不能更改。因此，你不能定义操作 `%i`，因为 `%` 已经定义为二元运算符。\n- 运算符的优先级不能改变。程序无法强制\
  \ `operator+` 在 `operator.*` 之前求值。\n- 当应用于内置类型时不能重新定义运算符——你不能改变 `1 + 2` 的含义。现有的运算符只能为新定义的类型重载。\n\
  \n重载运算符是那些看起来比实际上要好得多的事情。根据我的经验，运算符重载引入的问题比它解决的要多，本章将讨论三个著名的例外。\n\n## 插入新运算符\n\n\
  插入和提取运算符 `<<` 和 `>>` 无非为一组输入/输出类重载的左移和右移运算符。这些定义位于包含文件 `iostream`（这就是为什么每个程序都包含该文件）。因此，`cout\
  \ << \"some string\"` 变成了 `operator<<(cout, \"some string\")`。我们的老朋友 `cout` 和 `cin`\
  \ 是预定义的对象，分别绑定到控制台和键盘。我将在第 23 章 中详细讨论这一点。\n\n## 创建浅拷贝是一个深层次问题\n\n无论任何人对运算符重载有何看法，你可能需要为你生成的许多类重载赋值运算符。C++\
  \ 为所有类提供了 `operator()` 的默认定义。此默认定义执行逐个成员的拷贝。这对于像 `int` 这样的内置类型，由于其唯一的“成员”就是整数本身，这种方法非常有效。\n\
  \n```\nint i;\ni = 10; // “逐个成员”拷贝\n```\n\n相同的默认定义也应用于用户定义的类。在接下来的示例中，`source` 的每个成员都被复制到\
  \ `destination:` 中对应的成员：\n\n```cpp\nvoid fn()\n{\n    MyStruct source, destination;\n\
  \    destination = source;\n}\n```\n\n默认赋值运算符适用于大多数类；然而，对于分配了资源（如堆内存）的类，它是不正确的。程序员必须重载\
  \ `operator()` 来处理资源的转移。\n\n赋值运算符类似于拷贝构造函数（参见第 17 章）。在使用时，两者看起来几乎完全一样：\n\n```cpp\n\
  void fn(MyClass& mc)\n{\n    MyClass newMC(mc);   //当然，这使用了\n                  \
  \      //拷贝构造函数\n    MyClass newerMC = mc;//不那么明显，这同样调用了\n                     \
  \    //拷贝构造函数\n    MyClass newestMC;   //这创建了一个默认对象\n    newestMC = mc;      //然后用传递的\n\
  \                        //参数覆盖了它\n}\n```\n\n`newMC` 的创建遵循标准模式，即使用拷贝构造函数 `MyClass(const\
  \ MyClass&)` 创建一个原始对象的镜像的新对象。并不明显的是 `newerMC` 也是使用拷贝构造函数创建的。`MyClass a = b` 只是 `MyClass\
  \ a(b)` 的另一种写法——特别是，这个声明*并没有*涉及赋值运算符，尽管它看起来如此。然而，`newestMC` 使用默认构造函数创建，然后使用赋值运算符用\
  \ `mc` 进行覆盖。\n\n![tip.eps](img/tip_fmt.png) 规则是：当创建新对象时，使用拷贝构造函数。如果左侧对象已经存在，则使用赋值运算符。\n\
  \n与拷贝构造函数一样，每当浅拷贝不合适时都应该提供赋值运算符。（第 17 章 讨论了浅拷贝与深拷贝构造函数。）简单的规则是为具有用户定义拷贝构造函数的类提供赋值运算符。\n\
  \n注意，默认拷贝构造函数对于包含本身具有拷贝构造成员的类是有效的，如下例所示：\n\n```cpp\nclass Student\n{\n  public:\n\
  \    int nStudentID;\n    string sName;\n};\n```\n\nC++库类 `string` 确实在堆外分配内存，因此该类的作者包含了一个拷贝构造和一个赋值运算符，它们（希望）执行创建成功拷贝\
  \ `string` 所需的所有操作。`Student` 的默认拷贝构造函数调用 `string` 的拷贝构造函数，将 `sName` 从一个学生拷贝到另一个。同样，`Student`\
  \ 的默认赋值运算符也执行相同的操作。\n\n## 重载赋值运算符\n\n`DemoAssignmentOperator` 程序演示了如何提供赋值运算符。程序还包含一个拷贝构造函数以供比较：\n\
  \n```cpp\n//DemoAssignmentOperator - 在用户定义的类上演示赋值\n//                         运算符\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \n// DArray - 一个动态大小数组类，用于\n//  演示赋值运算符和拷贝构造函数\n//  运算符\nclass DArray\n{\n  public:\n\
  \    DArray(int nLengthOfArray = 0)\n      : nLength(nLengthOfArray), pArray(nullptr)\n\
  \    {\n      cout << \"Creating DArray of length = \" << nLength << endl;\n   \
  \   if (nLength > 0)\n      {\n        pArray = new int[nLength];\n      }\n   \
  \ }\n    DArray(DArray& da)\n    {\n      cout << \"Copying DArray of length = \"\
  \ << da.nLength << endl;\n      copyDArray(da);\n    }\n    ~DArray()\n    {\n \
  \     deleteDArray();\n    }\n    //赋值运算符\n    DArray& operator=(const DArray& s)\n\
  \    {\n      cout << \"Assigning DArray of length = \" << s.nLength << \" target\
  \ of length = \" << this->nLength << endl;\n      //删除内容\n      deleteDArray();\n\
  \      //在替换为新内容之前\n      copyDArray(s);\n      //返回对象的引用\n      return *this;\n\
  \    }\n    int& operator[](int index)\n    {\n      return pArray[index];\n   \
  \ }\n    int size() { return nLength; }\n    void display(ostream& out)\n    {\n\
  \      if (nLength > 0)\n      {\n        out << pArray[0];\n        for(int i =\
  \ 1; i < nLength; i++)\n        {\n          out << \", \" << pArray[i];\n     \
  \   }\n      }\n    }\n  protected:\n    void copyDArray(const DArray& da);\n  \
  \  void deleteDArray();\n    int nLength;\n    int* pArray;\n};\n\n//copyDArray()\
  \ - 创建 int 动态数组\nvoid DArray::copyDArray(const DArray& source)\n{\n  nLength = source.nLength;\n\
  \  pArray = nullptr;\n  if (nLength > 0)\n  {\n    pArray = new int[nLength];\n\
  \    for(int i = 0; i < nLength; i++)\n    {\n      pArray[i] = source.pArray[i];\n\
  \    }\n  }\n}\n\n//deleteDArray() - 返回堆内存\nvoid DArray::deleteDArray()\n{\n  nLength\
  \ = 0;\n  delete pArray;\n  pArray = nullptr;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n\n{\n}\n```\n\n\n\n\n```cpp\n// 定义动态数组并为其赋值\n\nDArray da1(5);\n\
  \nfor (int i = 0; i < da1.size(); i++)\n{\n    // 使用用户定义的索引运算符来访问\n    // 数组的成员\n\
  \    da1[i] = i;\n}\ncout << \"da1=\"; da1.display(cout); cout << endl;\n// 现在使用拷贝构造函数创建该动态数组的副本\n\
  // 这等同于 da2(da1)\nDArray da2 = da1;\nda2[2] = 20;   // 修改拷贝中的值\ncout << \"da2=\"\
  ; da2.display(cout); cout << endl;\n// 用原始的 da1 覆盖现有的 da2\nda2 = da1;\ncout << \"\
  da2=\"; da2.display(cout); cout << endl;\n// 在程序终止前等待用户准备就绪\n// 以允许用户看到程序结果\ncout\
  \ << \"Press Enter to continue...\" << endl;\ncin.ignore(10, '\\n');\ncin.get();\n\
  return 0;}\n```\n\n`DArray` 类定义了一个长度可变的整数数组：你在构造对象时，告诉类要创建一个多大的数组。它通过在类中封装两个数据成员来实现：`nLength`（包含数组的长度）以及\
  \ `pArray`（一个指向在堆上分配的适当内存块的指针）。\n\n默认构造函数将 `nLength` 初始化为指定的长度，然后将 `pArray` 初始化为\
  \ `nullptr`。\n\n![c++11_fmt.eps](img/c11_fmt.png) `nullptr` 关键字是 '11 标准新引入的。如果你的编译器不识别\
  \ `nullptr`，你可以在程序的顶部添加以下定义：\n\n```cpp\n#define nullptr 0\n```\n\n如果数组的长度实际上大于 0，构造函数会在堆上分配一个适当大小的\
  \ `int` 数组。\n\n拷贝构造函数创建一个与源对象相同大小的数组，然后使用保护方法 `copyDArray()` 将源数组的内容拷贝到当前数组中。析构函数使用\
  \ `deleteDArray()` 方法将构造函数中分配的内存返回给堆。一旦内存被删除，该方法会将指针 `pArray` 置空。\n\n赋值运算符 `operator=`\
  \ 是类的一个方法。它看起来就像一个析构函数紧接着一个拷贝构造函数。这是很典型的。考虑示例中的赋值 `da2 = da1`。对象 `da2` 已经与其相关的数据。在赋值过程中，必须通过调用\
  \ `deleteDArray()` 将原始动态数组返回堆，就就像 `DArray` 析构函数一样。赋值运算符随后调用 `copyDArray()` 将新信息拷贝到对象中，类似于拷贝构造函数。\n\
  \n关于赋值运算符还有两个细节。首先，`operator()` 的返回类型是 `DArray&`，且返回值始终是 `this`。涉及赋值运算符的表达式有一个值和一个类型，这两个都来自左侧参数的最终值。在下面的示例中，`operator()`\
  \ 的值为 `2.0`，类型为 `double`。\n\n```cpp\ndouble d1, d2;\nvoid fn(double);\nd1 = 2.0;\
  \      // 此表达式的类型是 double\n```\n\n这使得程序员能够编写以下代码：\n\n```cpp\nd2 = d1 = 2.0 // 执行赋值并将结果传递给\
  \ fn()\nfn(2.0); \n```\n\n赋值 `d1 = 2.0` 的值 `(2.0)` 和类型 `(double)` 被传递给赋值 `d2`。在第二个示例中，赋值\
  \ `d2 = 3.0` 的值被传递给函数 `fn()`，但 `operator=` 的类型与声明 `fn(double)` 匹配。用户创建的赋值运算符应该支持与内置版本相同的语义：\n\
  \n```cpp\nfn(DArray&); // 假设有此声明...\nfn(da2 = da1); // ...这是合法的\n```\n\n第二个细节是 `operator=`\
  \ 被写为成员函数。左侧参数被视为当前对象 `this`。与其他运算符不同，赋值运算符不能用非成员函数进行重载。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 如果你不想定义自己的，可以删除默认构造函数和赋值运算符：\n\n```cpp\nclass NonCopyable\n{\npublic:\n    NonCopyable(const\
  \ NonCopyable&) = delete;\n    NonCopyable& operator=(const NonCopyable&) = delete;\n\
  };\n```\n\n`NonCopyable` 类对象不能通过构造或赋值进行拷贝：\n\n```cpp\nvoid fn(NonCopyable& src)\n\
  {\n    NonCopyable copy(src); // 不允许\n    copy = src; // 也不允许\n}\n```\n\n如果你的编译器不支持\
  \ '11 扩展，你可以将赋值运算符声明为保护属性：\n\n```cpp\nclass NonCopyable\n{\nprotected:\n    NonCopyable(const\
  \ NonCopyable&) {};\n    NonCopyable& operator=(const NonCopyable&)\n    {\n   \
  \     return *this;\n    }\n};\n```\n\n![tip.eps](img/tip_fmt.png) 如果你的类分配了如堆内存之类的资源，你**必须**让默认赋值运算符和拷贝构造函数不可访问，理想情况下是用它们替换为你自己的实现。\n\
  \n## 重载下标运算符\n\n之前的 `AssignmentOperator` 示例实际上顺带了第三个为容器类重载的运算符：下标运算符。下面的定义允许 `DArray`\
  \ 类的对象像原生数组一样被操作：\n\n```cpp\nint& operator[](int index)\n{\n    return pArray[index];\n\
  }\n```\n\n这使得像下面的赋值变得可行：\n\n```cpp\nint n = da[0]; // 变为 n = da.operator[](0);\n\
  ```\n\n但注意，下标运算符并不是返回一个整数值，而是返回 `pArray` 内部值的引用。这允许调用函数像 `AssignmentOperator` 程序中演示的那样修改值：\n\
  \n```cpp\nda2[2] = 20;\n```\n\n你可以在第 27 章节看到更多容器类重载索引运算符的示例。\n\n## 移动构造函数与移动赋值运算符\n\
  \n![c++11_fmt.eps](img/c11_fmt.png) 整个主题对于 C++ '11 来说是全新的。\n\n拷贝构造函数和拷贝赋值运算符对于为你创建的类保持简单的语义非常有用用。然而，自它们诞生以来，C++\
  \ 程序员对它们可能产生的低效性一直并不满意。考虑以下示例：\n\n```cpp\nMyContainer fn(int size)\n{\n    MyContainer\
  \ localMC(size);\n    return mc;\n}\nMyContainer mc(fn());\n```\n\n在这种情况下，函数 `fn()`\
  \ 创建了一个局部的 `MyContainer` 对象 `localMC`，然后通过值将其返回给调用者。这个简单的调用可能会导致同一个 `MyContainer`\
  \ 对象被拷贝两次而非一次：\n\n1. 作为返回的一部分，C++ 必须将 `localMC` 对象的临时副本拷贝到返回栈上，以返回给调用者。\n2. 随后对拷贝构造函数的调用会将该临时对象的内容拷贝到局部的\
  \ `mc` 对象中。\n\n第二次拷贝是不必要的。由于临时对象即将被析构，移动构造函数可以只需从临时对象中“夺取”资产，而不是费精力去拷贝一个即将被放回堆的东西。这就是移动构造函数的本质。\n\
  \n移动构造函数看起来像拷贝构造函数，但有两不同：\n\n- 移动构造函数从源对象获取资源并交给目标对象，而不是拷贝。\n- 移动构造函数的参数类型为 `MyContainer&&`，双安符号表示“仅用于临时值”。\n\
  \n下面的示例程序展示了移动构造函数和移动赋值运算符的操作：\n\n```cpp\n// DemoMoveOperator - 展示移动运算符\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing\
  \ namespace std;\n\nclass MyContainer\n{\npublic:\n    MyContainer(int nS, const\
  \ char* pS) : nSize(nS)\n    {\n        pString = new char[nSize];\n        strcpy(pString,\
  \ pS);\n    }\n    ~MyContainer()\n    {\n        delete pString;\n        pString\
  \ = nullptr;\n    }\n};\n```\n\n\n\n\n\n```cpp\n    //拷贝构造函数\n    MyContainer(const\
  \ MyContainer& s)\n    {\n        copyIt(*this, s);\n    }\n    MyContainer& operator=(MyContainer&\
  \ s)\n    {\n        delete pString;\n        copyIt(*this, s);\n        return\
  \ *this;\n    }\n    //移动构造函数\n    MyContainer(MyContainer&& s)\n    {\n       \
  \ moveIt(*this, s);\n    }\n    MyContainer& operator=(MyContainer&& s)\n    {\n\
  \        delete pString;\n        moveIt(*this, s);\n        return *this;\n   \
  \ }\n\n  protected:\n    static void moveIt(MyContainer& tgt, MyContainer& src)\n\
  \    {\n        cout << \"Moving \" << src.pString << endl;\n        tgt.nSize =\
  \ src.nSize;\n        tgt.pString = src.pString;\n        src.nSize = 0;\n     \
  \   src.pString = nullptr;\n    }\n    static void copyIt(MyContainer& tgt,\n  \
  \                     const MyContainer& src)\n    {\n        cout << \"Copying\
  \ \" << src.pString << endl;\n        delete tgt.pString;\n        tgt.nSize = src.nSize;\n\
  \        tgt.pString = new char[tgt.nSize];\n        strncpy(tgt.pString, src.pString,\
  \ tgt.nSize);\n    }\n    int nSize;\n    char* pString;\n};\n\nMyContainer fn(int\
  \ n, const char* pString)\n{\n    MyContainer b(n, pString);\n    return b;\n}\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    MyContainer mc(100, \"Original\"\
  );\n    mc = fn(100, \"Created in fn()\");\n    // 等待用户准备好后再终止程序\n    // 允许用户查看程序结果\n\
  \    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n该程序的输出如下：\n\n```\nMoving Created in fn()\n\
  Press Enter to continue...\n```\n\n函数 `fn()` 返回一个临时对象，该对象通过移动赋值运算符 `operator=(MyContainer&&)`\
  \ 移动到 `mc` 对象中。`moveIt()` 函数执行速度比 `copyIt()` 函数快得多——它没有在堆上分配内存，也没有拷贝任何内容。`moveIt()`\
  \ 函数只是从 `src` 对象中获取内存块，在本例中，这就是从 `fn()` 返回的临时对象。\n\n![warning.eps](img/warning_fmt.png)\
  \ 确保将 `src` 对象中的指针置零；否则析构函数会将内存块返回给堆，导致目标对象指向未分配的内存。\n\n第 23 章\n\n# 使用流 I/O\n\n\
  本章内容\n\n- ![arrow](img/arrow.png) 执行输入/输出\n- ![arrow](img/arrow.png) 重新发现作为重载运算符的流\
  \ I/O\n- ![arrow](img/arrow.png) 查看文件类的其他方法\n- ![arrow](img/arrow.png) 使用流缓冲区 I/O\n\
  \n在本章之前的程序从 `cin` 输入对象读取，并通过 `cout` 输出对象输出。也许你并没有深入思考过它，但这种输入/输出技术是所谓的*流 I/O*的子集。\n\
  \n在本章中，我将更详细描述流 I/O。我必须警告你，流 I/O 是一个巨大的课题，无法在一个章节内完全涵盖——整本书都专门讨论这一个主题。对我们双方来说幸运的是，编写大多数程序并不需要了解那么多流\
  \ I/O 的知识。\n\n## 流 I/O 如何工作\n\n流 I/O 基于重载版本的 `operator>>()` 和 `operator<<()`。这些重载运算符的定义可以在头文件\
  \ `iostream` 中找到，本书中从第 1 章开始的所有程序都包含了它。这些函数的代码包含在标准库中，你的 C++ 程序与之链接。\n\n以下代码显示了\
  \ `iostream:` 中出现的几个原型：\n\n```cpp\n//对于输入，我们有：\nistream& operator>>(istream& source,\
  \ char    *pDest);\nistream& operator>>(istream& source, string &sDest);\nistream&\
  \ operator>>(istream& source, int     &dest);\nistream& operator>>(istream& source,\
  \ double &dest);\n//...依此类推...\n\n//对于输出，我们有：\nostream& operator<<(ostream& dest,\
  \ char    *pSource);\nostream& operator<<(ostream& dest, string &sDest);\nostream&\
  \ operator<<(ostream& dest, int     source);\nostream& operator<<(ostream& dest,\
  \ double  source);\n//...依此类推...\n```\n\n当重载用于执行 I/O 时，`operator>>()` 被称为*提取器*（extractor），而\
  \ `operator<<()` 被称为*插入器*（inserter）。`istream` 类是从文件或键盘等设备进行输入的基本基类。C++ 在程序启动时会打开\
  \ `istream` 对象 `cin`。同样，`ostream` 是输出的基础。\n\n### 默认流对象\n\nC++ 在程序启动时打开 `istream`\
  \ 对象 `cin`。同样，`ostream` 是输出的基础。当重载用于执行 I/O 时，`operator>>()` 被称为*提取器*，而 `operator<<()`\
  \ 被称为*插入器*。`istream` 类是从文件或键盘等设备进行输入的基类。C++ 在程序启动时会打开 `istream` 对象 `cin`。同样，`ostream`\
  \ 是输出的基础。\n\n表 23-1 标准 I/O\n\n| 对象 | 类 | 目的 |\n|---|---|---|\n| `cin` | `istream`\
  \ | *char* 输入 |\n| `wcin` | `wistream` | *wchar_t* 输入 |\n| `cout` | `ostream` |\
  \ *char* 输出 |\n| `wcout` | `wostream` | *wchar_t* 输出 |\n| `cerr` | `ostream` | 错误\
  \ |\n| `wcerr` | `wostream` | *wchar_t* 错误 |\n| `clog` | `ostream` | 日志 |\n| `wclog`\
  \ | `wostream` | *wchar_t* 日志 |\n\n`wcin, wcout,* 和 `wcerr` 分别是标准输入、输出和错误的宽版本。这些设计用于处理\
  \ Unicode 符号：\n\n```cpp\ncout << \"This is narrow output\" << endl;\nwcout << L\"\
  This is wide output\" << endl;\n```\n\n\n\n\n\n`ios_base::openmode mode = ios_base::out|ios_base::trunc);`\n\
  \n第一个参数是指向要打开的文件名的指针。第二个参数指定模式。`openmode` 类型是在 `ios_base` 中定义的整数类型。在 `ios_base`\
  \ 内部还定义了 `mode` 的可能取值，见表 23-2。这些是程序员通过按位或（bitwise OR）组合在一起的位字段。（有关位字段或运算的解释，请参阅第\
  \ 4 章节。）`ifstream` 的默认模式是由于以输入模式打开文件，并将指针设置为文件开头（这很合乎逻辑了）。\n\n### 表 23-2 控制文件打开方式的常量\n\
  \n| 标志 | 含义 |\n| :--- | :--- |\n| `ios_base::app` | 在每次写入之前定位到文件末尾。 |\n| `ios_base::ate`\
  \ | 如果文件存在，打开文件后立即定位到文件末尾。 |\n| `ios_base::binary` | 以二进制模式打开文件（另一种方案是文本模式）。 |\n\
  | `ios_base::in` | 以输入模式打开文件（对于 `istream` 隐含）。 |\n| `ios_base::out` | 以输出模式打开文件（对于\
  \ `ostream` 隐含）。 |\n| `ios_base::trunc` | 如果文件存在，则截断文件（`ostream` 的默认值）。 |\n\n`ofstream`\
  \ 的默认值是以输出模式打开，如果文件已经存在，则将其截断。截断的替代方案是 `ios_base::app`，这意味着如果文件已经存在，则将新输出追加到文件末尾。这两个选项在文件不存在时都会创建一个文件。\n\
  \n例如，接下来的 `StreamOutput` 程序打开了 `MyName.txt` 文件，然后向该文件写入了一些重要且绝对真实的信息：\n\n```cpp\n\
  // StreamOutput - 输出到文件的简单输出\n#include <fstream>\n\nusing namespace std;\n\nint\
  \ main(int nNumberofArgs, char* pszArgs[])\n{\n    ofstream my(\"MyName.txt\");\n\
  \    my << \"Stephen Davis is suave and handsome\\n\"\n        << \"and definitely\
  \ not balding prematurely\"\n        << endl;\n    return 0;\n}\n```\n\n文件流类的析构函数会自动关闭关联的文件。在我的简单示例中，当\
  \ `my` 对象在从 `main()` 返回时离开作用时，`MyName.txt` 文件被关闭了。全局对象在程序终止时会被关闭。\n\n### 打开模式\n\n\
  表 23-2 显示了打开文件时可能的不同模式。然而，每当你打开一个文件时，都需要回答三个基本问题：\n\n*   你是想从文件中读取还是向文件中写入？使用 `ifstream`\
  \ 读取，使用 `ofstream` 写入。如果你打算对同一个文件同时进行写入和读取，请使用 `fstream` 并将模式设置为 `in|out`，但祝你好运——更好的做法是完全写完文件，然后关闭并作为独立的对象重新打开它进行读取。\n\
  *   如果你正在向文件写入且文件已存在，你是想向现有内容中添加（这种情况下，设置 `ate` 打开），还是截断文件并从头开始（这种情况下使用 `trunc`）？\n\
  *   你是在读取或写入文本还是二进制数据？`ifstream` 和 `ofstream` 默认都是文本模式。如果你正在读取或写入原始的非文本数据，请使用 `binary`\
  \ 模式。\n\n二进制模式和文本模式之间的主要区别在于处理换行的方式。Unix 操作系统编写于打字机仍然流行的时代（那时它被称为“打字”而不是“键盘输入”）。Unix\
  \ 用换行符（linefeed）接回车符（carriage return）来结束句子。\n\n随后的操作系统没有理由继续使用两个字符来结束句子，但它们对于使用哪种字符无法达成一致。有些使用回车，另一些使用换行符（现在重命名为\
  \ newline）。C++ 标准是单个换行符。\n\n当文件以文本模式打开时，C++ 库会在输出时将单个换行符转换为适用于你操作系统的内容，无论是回车加换行符、单个回车、换行符还是完全不同的东西。在读取文件时，它执行相反的转换。对于以二进制模式打开的文件，C++\
  \ 库不会进行此类转换。\n\n![remember.eps](img/remember_fmt.png) 在处理非人类可读格式的文件时，始终使用二进制模式。否则，如果数据流中的某个字节恰好等于回车或换行，文件\
  \ I/O 库将修改它。\n\n### 嘿，文件，你处于什么状态？\n\n构造的 `fstream` 对象（包括 `ifstream` 和 `ofstream`）成为它所关联文件的代理。例如，流对象维护有关\
  \ I/O 过程的状态信息。成员函数 `bad()` 如果发生“坏”情况会返回 `true`。这个模糊的术语意味着文件无法打开、某些内部对象乱了，或者事情完全搞砸了。较小的错误\
  \ `fail()` 表示 `bad()` 发生或上次读取失败——例如，如果你尝试读取一个 `int` 但程序能找到的所有内容都不是数字。\n\n\n\n\n\n\
  ![tip.eps](img/tip_fmt.png) 如果打开失败，请忘记删除 `pFileStream` 对象。这些都是内存泄漏悄悄发生的途径。\n\n程序从\
  \ `fileStream` 引用的对象中读取整数值，直到调用 `fail()` 或程序达到成员函数 `eof()` 指示的文件末尾（EOF）为止。\n\n![tip.eps](img/tip_fmt.png)\
  \ 我再次提醒你一次：从发生错误的输入流中读取不仅不会返回任何内容，而且缓冲区也会保持不变。这个程序很容易得出一个错误的结论，认为它刚刚读取了之前读取过的相同值。此外，对于发生错误的输入流，`eof()`\
  \ 永远不会返回 `true`。\n\n该程序的输出如下（我为输入内容加了粗体）：\n\n```\n输入包含整数的文件名：**chicken**\n无法打开 chicken\n\
  \n输入包含整数的文件名：**integers.txt**\n\n成功打开了 integers.txt\n\n1\n2\n3\n4\n5\n6\n按回车键继续...\n\
  ```\n\n![tip.eps](img/tip_fmt.png) Windows 版 Code::Blocks 会在项目目录中打开控制台应用程序，因此你只需要输入所示的文件名。Mac\
  \ 版 Code::Blocks 在你的用户目录中打开控制台窗口，因此你需要输入文件的完整路径：`Desktop/CPP_Programs_from_Book/Chap23/StreamInput/integers.txt`（假设你将源文件安装在了默认位置）。\n\
  \n## 流类的其他方法\n\n`istream` 和 `ostream` 类提供了许多方法，如表 23-3 所示（这不是完整列表）。这些函数的原型定义在 `fstream`\
  \ 头文件中。它们将在本节的剩余部分进行描述。\n\n### 表 23-3 I/O 流类主要方法\n\n| 方法 | 含义 |\n| :--- | :--- |\n\
  | `bool bad()` | 如果发生严重错误，返回 `true`。 |\n| `void clear(iostate flags = ios_base::goodbit)`\
  \ | 清除（或设置）I/O 状态标志。 |\n| `void close()` | 关闭与流对象关联的文件。 |\n| `bool eof()` | 如果文件中没有更多字符可读，返回\
  \ `true`。 |\n| `iostate exception()` | 返回会导致异常的条件。 |\n| `void exception(iostate)`\
  \ | 设置会导致异常的条件。多个条件可以进行逻辑或操作组合；例如，`exception(ios_base::badbit\\|ios_base::failbit)`。有关异常的讨论请参见第\
  \ [24]](#32_9781118823774-ch24.xhtml) 章。 |\n| `char fill()char fill(char newFill)`\
  \ | 返回或设置填充字符。 |\n| `fmtflags flags()fmtflags flags(fmtflags f)` | 返回或设置格式标志。（参见“控制格式””章节。）\
  \ |\n| `void flush()` | 将输出缓冲区刷新到磁盘。 |\n| `int gcount()` | 返回上次输入期间读取的字节数。 |\n|\
  \ `char get()` | 从文件中读取单个字符。 |\n| `char getline( char* buffer, int count, char delimiter\
  \ = '\\n')` | 读取多个字符，直到文件末尾、遇到分隔符或读取了 `count - 1` 个字符。在读取的行末尾添加一个空字符。不要将读取的分隔符存入缓冲区。\
  \ |\n| `bool good()` | 如果没有设置任何错误条件，则返回 `true`。 |\n| `void open( const char* filename,\
  \ openmode mode = default)` | 参数与构造函数相同。在现有对象上执行的文件打开操作，与构造函数在创建新对象时执行的操作相同。 |\n\
  | `streamsize precision() streamsize( streamsize s)` | 读取或设置浮点变量显示的数字位数。 |\n| `ostream&\
  \ put(char ch)` | 向流写入单个字符。 |\n| `istream& read( char* buffer, streamsize num)`\
  \ | 读取一个数据块。读取 `num` 个字节或遇到文件末尾，以先发生者为准。 |\n| `istream& seekg( pos_type position)istream&\
  \ seekg( off_type offset, ios_base::seekdir)` | 将读取指针置到文件开始处 `position` 字节处或当前位置偏移\
  \ `offset` 字节处。 |\n| `istream& seekp( pos_type position)istream& seekp( off_type\
  \ offset, ios_base::seekdir)` | 设置写入指针的位置。 |\n| `fmtflags setf(fmtflags)` | 设置特定的格式标志。返回旧值。\
  \ |\n| `pos_type tellg()` | 返回读取指针的位置。 |\n| `pos_type tellp()` | 返回写入指针的位置。 |\n\
  | `fmtflags unsetf(fmtflags)` | 清除特定的格式标志。返回旧值。 |\n| `int width()int width(int w)`\
  \ | 读取或设置下一个格式化输出语句要显示的字符数。 |\n| `ostream& write( const char* buffer, streamsize\
  \ num)` | 向输出文件写入一个数据块。 |\n\n### 直接读写流\n\n插入运算符（inserter）和提取运算符（extractor）为读取格式化输入提供了一种方便的机制。然而，有时你只想说：“把它给我吧，我不在乎格式是什么。”在这种情况下，有几种方法非常有用。\n\
  \n最简单的函数 `get()` 仅返回输入文件中的下一个字符。其对应的输出函数是 `put()`。函数 `getline()` 返回一个字符字符串，直到遇到终止符——默认是换行符。`getline()`\
  \ 会剥离终止符，但不会尝试对输入进行其他重格式化或解释。\n\n成员函数 `read()` 更加基础。该函数读取你指定的字符数，如果程序遇到文件末尾，则读取较少字符。函数\
  \ `gcount()` 总是返回实际读取的字符数。对应的输出函数是 `write()`。\n\n下面的示例程序使用 `read()` 和 `write()`\
  \ 函数，为你提供的任何文件创建备份，通过在文件名后添加字符串 `.backup` 来创建一个副本：\n\n```cpp\n// FileCopy - 为传递给\n\
  //             程序的文件的文件创建备份副本\n#include <cstdio>\n#include <cstdlib>\n#include <fstream>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 对传递的每个文件重复该过程\n    for (int n = 1; n < nNumberofArgs; n++)\n\
  \    {\n        // 创建文件名和带 \".backup\" 的名称\n        string szSource(pszArgs[n]);\n\
  \        string szTarget = szSource + \".backup\";\n        // 现在打开源文件读取\n     \
  \   // 目标文件写入\n        ifstream input(szSource.c_str(), ios_base::in);\n       \
  \ ofstream output(szTarget.c_str(), ios_base::out|ios_base::trunc);\n        if\
  \ (input.good() && output.good())\n        {\n            cout << \"Backing up \"\
  \ << szSource << \"...\";\n            // 读取并写入 4k 块，直到\n            // 发生错误或文件到达\
  \ EOF\n            while(!input.eof() && input.good())\n            {\n        \
  \        char buffer[4096];\n                input.read(buffer, 4096);\n       \
  \         output.write(buffer, input.gcount());\n            }\n            cout\
  \ << \"finished\" << endl;\n        }\n        else\n        {\n            cerr\
  \ << \"Couldn't copy \" << szSource << endl;\n        }\n    }\n    cout << \"按回车键继续...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  \n\n\n\n注意，在调用 `write()` 时，程序使用了 `gcount()` 返回的值，而不是硬编码 4096。这是因为，除非源文件的长度恰好是 4096\
  \ 字节的整数倍，否则最后一次 `read()` 调用在遇到文件结束之前，获取的字节数少于请求的次数。\n\n## 控制格式\n\n`flags()`、`setf()`\
  \ 和 `unsetf()` 方法均用于设置或检索 `istream` 或 `ostream` 对象中维护的一组格式标志。这些格式标志在对象创建时被设置为默认值，代表了最常见的格式选项。这些选项显示在表\
  \ 23-4 中。\n\n表 23-4 I/O 流格式标志\n\n| 标志 | 如果标志为真，则…… |\n| :--- | :--- |\n| `boolalpha`\
  \ | 将 bool 显示为 true 或 false，而不是 1 或 0。 |\n| `dec` | 以十进制格式格式读取或写入整数（默认）。 |\n| `fixed`\
  \ | 以固定点显示浮点数，而不是科学计数法（默认）。 |\n| `hex` | 以十六进制读取或写入整数。 |\n| `left` | 输出左对齐显示（即在右侧填充）。\
  \ |\n| `oct` | 以八进制读取或写入整数。 |\n| `right` | 输出右对齐显示（即在左侧填充）。 |\n| `scientific` |\
  \ 以科学计数法格式显示浮点数。 |\n| `showbase` | 为八进制输出显示前导 0，为十六进制输出显示前导 0x。 |\n| `showpoint`\
  \ | 即使小数部分为 0，也为浮点数输出显示一个十进制点。 |\n| `skipws` | 使用提取器读取时跳过空白字符。 |\n| `unitbuf` |\
  \ 每次输出操作后刷新输出缓冲区。 |\n| `uppercase` | 输出时将小写字母替换为其等效的大写字母。 |\n\n以下代码段曾被用于以十六进制格式显示数字（参见第\
  \ 4 章中的 `BitTest` 程序）：\n\n```cpp\n// 读取当前的格式标志\n// (当需要稍后恢复输出\n// 格式时，这很重要)\nios_base::fmtflags\
  \ prevValue = cout.flags();\n\n// 清除十进制标志\ncout.unsetf(cout.dec);\n\n// 现在设置十六进制标志\n\
  cout.setf(cout.hex);\n\n// ...执行某些操作..\n\n// 调用 flags() 将格式标志恢复为\n// 之前的值\ncout.flags(prevValue);\n\
  ```\n\n在此示例中，程序必须同时使用 `setf()` 设置十六进制标志，并使用 `unsetf()` 取消（即清除）十进制标志，因为十进制、八进制和十六进制标志是互斥的。\n\
  \n最后一次 `flags()` 的调用将格式标志恢复为之前读取的值。如果程序即将终止，则这种操作是不必要的。\n\n进一步的格式控制由 `width()` 方法提供，该方法设置了下一次输出操作的最小宽度。如果字段没有占据指定的全部宽度，插入器将添加所需的填充字符数量。默认填充字符是空格，但你可以通过调用\
  \ `fill()` 来更改它。C++ 在左侧还是右侧添加填充字符取决于是否设置了 `left` 或 `right` 格式标志。\n\n例如，以下段落\n\n\
  ```cpp\nint i = 123;\ncout.setf(cout.right);\ncout.unsetf(cout.left);\ncout.fill('+');\n\
  cout << \"i = [\";\ncout.width(10);\ncout << i;\ncout << \"]\" << endl;\n```\n\n\
  生成如下输出：\n\n`i = [+++++++123]`\n\n![warning.eps](img/warning_fmt.png) 注意，`width()`\
  \ 方法仅适用于紧邻的输出语句。与其他格式标志不同，`width()` 必须在输出的每个值后重置。\n\n## endl 到底是怎么的？\n\n书中的大多数程序通过插入对象\
  \ `endl` 来结束输出流。然而，某些程序在文本中包含 `\\n` 以输出换行符。这有什么区别？\n\n`\\n` 实际上是换行符。表达式 `cout <<\
  \ “First line\\nSecond line;` 输出两行。`endl` 对象输出一个换行，但又多走了一步。\n\n磁盘是慢设备。比需要更频繁写入磁盘会显著减慢你的程序。为了避免这种情况，`fstream`\
  \ 类将输出收集到一个名为 `cache`（发音类似“cash”）的内部缓冲区。当缓冲区满时，该类会将内容写入磁盘（这被称为“刷新缓存”）。`endl` 对象输出一个换行然后刷新输出缓存。成员函数\
  \ `flush()` 刷新输出缓冲区而不向末尾添加换行符。\n\n注意，标准错误对象 `cerr` 不对输出进行缓冲。\n\n## 在文件中定位指针\n\n\
  `istream` 类维护一个读取指针，该指针是文件中下一个要读取字节的位置。这被测量为“从文件开始计算的字节数”。你可以使用 `tellg()` 方法获取它。（同样地，`tellp()`\
  \ 返回 `ostream` 对象中下一个写入位置的指针。）保存好位置后，你稍后可以通过传递位置给 `seekg()` 返回。\n\n重载版本的 `seekg()`\
  \ 取一个绝对位置、一个偏移量和一个方向。该方向的合法值是以下三个常量之一：\n\n* `ios_base::beg` (`beg` 代表 `beginning\
  \ of file`）：偏移量必须为正，相对于文件开头的字节数。\n* `ios_base::end` (`end` 代表 `end of file`）：偏移量必须为负，相对于文件末尾的字节数。\n\
  * `ios_base::cur` (`cur` 代表 `current position`）：偏移量可以是正也可以是负，相对于当前位置的字节数。\n\n在文件中移动读取（或写入）指针可能是非常慢的（从计算机的角度来看），因此谨慎使用此功能。\n\
  \n## 使用 stringstream 子类\n\n流类为程序员提供了轻松拆分 `int`、`float` 和 `char` 数组变量输入的机制。一组被称为\
  \ `stringstream` 的类允许程序从内存中的字符数组读取，就像从文件读取一样。`istringstream` 和 `ostringstream` 定义在头文件\
  \ `sstream` 中。\n\n![tip.eps](img/tip_fmt.png) 这些类的旧版本是定义在头文件 `strstream` 中的 `istrstream`\
  \ 和 `ostrstream`。stringstream 类与相应的文件类具有相同的语义。这在接下来的 `StringStream` 程序中得到了演示，它从文件中解析账户信息：\n\
  \n```cpp\n// StringStream - 读取并解析文件内容\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <fstream>\n#include <sstream>\n#include <iostream>\n\nusing namespace std;\n\n\
  // parseAccountInfo - 读取传递的缓冲区，就像它是\n//                    实际文件 - 读取以下格式：\n//  \
  \                  name, account\n//                    如果全部成功返回 true\nbool parseString(const\
  \ char* pString, int arraySize, char* pName, long& accountNum, double& balance)\n\
  {\n    // 将 istrstream 对象与输入\n    // 字符串关联\n    istringstream inp(pString);\n  \
  \  // 读取到逗号分隔符\n    inp.getline(pName, arraySize, ',');\n    // 现在是账户号码\n    inp\
  \ >> accountNum;\n    // 以及余额\n    inp >> balance;\n    // 返回错误状态\n    return !inp.fail();\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 必须文件名\n    char szFileName[128];\n\
  \    cout << \"Input name of file to parse:\";\n    cin.getline(szFileName, 128);\n\
  \    // 获取文件流\n    ifstream* pFileStream = new ifstream(szFileName);\n    if (!pFileStream->good())\n\
  \    {\n        cerr << \"Can't open \" << pszArgs[1] << endl;\n        return 0;\n\
  \    }\n    // 从文件中读取出一行，解析并显示\n    // 结果\n    for(int nLineNum = 1;;nLineNum++)\n\
  ```\n\n\n\n\n\n```cpp\n{\n    // read a buffer\n    char buffer[256];\n    pFileStream->getline(buffer,\
  \ 256);\n    if (pFileStream->fail())\n    {\n        break;\n    }\n    cout <<\
  \ nLineNum << \":\" << buffer << endl;\n    // parse the individual fields\n   \
  \ char name[80];\n    long accountNum;\n    double balance;\n    bool result = parseString(buffer,\
  \ name, 80, accountNum, balance);\n    if (result == false)\n    {\n        cerr\
  \ << \"Error parsing string\\n\" << endl;\n        continue;\n    }\n    // output\
  \ the fields we parsed out\n    cout << \"Read the following fields:\" << endl;\n\
  \    cout << \"  name = \" << name << \"\\n\"\n          << \"  account = \" <<\
  \ accountNum << \"\\n\"\n          << \"  balance = \" << balance << endl;\n   \
  \ // put the fields back together in a different\n    // order (inserting the 'ends'\
  \ makes sure the\n    // buffer is null terminated\n    ostringstream out;\n   \
  \ out << name << \", \"\n        << balance << \" \"\n        << accountNum << ends;\n\
  \    string oString = out.str();\n    cout << \"Reordered fields: \" << oString\
  \ << endl;\n}\ncout << \"Press Enter to continue...\" << endl;\ncin.ignore(10, '\\\
  n');\ncin.get();\nreturn 0;\n}\n```\n\n该程序首先打开一个名为 `Accounts.txt` 的文件，该文件包含格式为 `name,\
  \ accountNumber, balance,\\n` 的账户信息。假设文件已成功打开，程序进入一个循环，读取行，直到文件内容耗尽。`getline()`\
  \ 的调用读取到默认的换行符为止。程序将刚刚读取的行传递给 `parseString()` 函数。\n\n`parseString()` 将 `istringstream`\
  \ 对象与字符字符串关联。程序使用 `getline()` 成员函数读取到 `','`（或字符串缓冲区结束处）的字符。然后，程序使用传统的提取器读取 `accountNum`\
  \ 和 `balance`。\n\n在调用 `parseString()` 之后，`main()` 输出从文件中读取的缓冲区，随后是解析出的值。然后，它使用 `ostringstream`\
  \ 类重构一个具有相同数据但格式不同的 `string` 对象（仅仅是为了好玩）。\n\n示例执行的结果如下所示：\n\n输入要解析的文件名：**Accounts.txt**\n\
  \n1:Chester, 12345 56.60\nRead the following fields:\n  name = Chester\n  account\
  \ = 12345\n  balance = 56.6\nReordered fields: Chester, 56.6 12345\n\n2:Arthur,\
  \  34567 67.50\nRead the following fields:\n  name = Arthur\n  account = 34567\n\
  \  balance = 67.5\nReordered fields: Arthur, 67.5 34567\n\n3:Trudie,  56x78 78.90\n\
  Error parsing string\n\n4:Valerie, 78901 89.10\nRead the following fields:\n  name\
  \ = Valerie\n  account = 78901\n  balance = 89.1\nReordered fields: Valerie, 89.1\
  \ 78901\n\nPress Enter to continue ...\n\n在继续之前思考一秒。注意程序在输入文件出现错误后是如何重新同步的。同样，请注意程序核心部分\
  \ `parseString()` 函数的简单性。考虑一下如果没有 `istringstream` 类辅助，这个函数会变成什么。\n\n## 操纵操作符 (Manipulating\
  \ Manipulators)\n\n你可以使用流 I/O 通过默认格式输出数字和字符字符串。通常情况下，默认格式是可以的，但有时它们并不够用。\n\n例如，当我最近的一个程序中财务计算结果的总和为\
  \ 249.600006 而不是 249.6（或者更好的 249.60）时，我并不高兴。必须有一种方法能让默认设置符合我的意愿。一如既往，C++ 提供了两种方法来控制输出的格式。\n\
  \n![warning.eps](img/warning_fmt.png) 根据你编译器的默认设置，你可能会得到输出 249.6。尽管如此，你想要 249.60。\n\
  \n首先，你可以通过在流对象上调用一系列成员函数来控制格式。例如，显示有效数字数量是通过如下使用 `precision()` 函数设置的（参见表 23-3）：\n\
  \n```cpp\n#include <iostream>\n\nvoid fn(double interest, double dollarAmount)\n\
  {\n    cout << \"Dollar amount = \";\n    cout.precision(2);\n    cout << dollarAmount;\n\
  \    cout.precision(4);\n    cout << interest << endl;\n}\n```\n\n在这个示例中，`precision()`\
  \ 函数在输出值 `dollarAmount` 之前立即将精度设置为 `2`。这为你提供了像 249.60 这样你想要的结果类型。然后它在输出利率之前将精度设置为\
  \ `4`。\n\n第二种方法使用了被称为“操作符”(manipulators) 的东西。（听起来像是纽约证券交易所幕后的某人，不是吗？）`Manipulators`\
  \ 是定义在 `iomanip` 头头文件中的对象，效果与成员函数相同。操作符的唯一优势是程序可以将它们直接插入流中。最常见的操作符及其含义如表 23-5 所示：\n\
  \n| 操作符 | 成员函数 | 描述 |\n| :--- | :--- | :--- |\n| `dec` | `setf(dec)` | 设置进制为 10\
  \ |\n| `hex` | `setf(hex)` | 设置进制为 16 |\n| `oct` | `setf(oct)` | 设置进制为 8 |\n| `fill(c)`\
  \ | `fill(c)` | 设置填充字符为 `c` |\n| `precision(n)` | `precision(n)` | 设置精度为 `n` |\n\
  | `w(n)` | `width(n)` | 设置字段宽度为 `n` |\n\n如果你将前面的示例重写为使用操作符，程序将如下：\n\n```cpp\n#include\
  \ <iostream>\n#include <iomanip>\n\nvoid fn(double interest, double dollarAmount)\n\
  {\n    cout << \"Dollar amount = \";\n    cout << precision(2) << dollarAmount;\n\
  \    cout << precision(4) << interest << endl;\n}\n```\n\n## 24 处理错误 — 异常 (Handling\
  \ Errors — Exceptions)\n\n在本章中，我们引入了一种处理错误的异常方法。我知道这很难接受，但函数偶尔无法正常工作。C++ 包含了一种捕获错误的机制，它基于\
  \ `try`、`catch` 和 `throw` 关键字。概来说，它的工作原理如下：函数 `try` 执行代码。如果代码检测到问题，它就会 `throw` 出一个调用函数必须\
  \ `catch` 的错误。下面的代码片段演示了其工作原理：\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\nusing namespace std;\n\n// factorial - 计算阶乘\nint factorial(int\
  \ n)\n{\n    // 你无法处理负值 n；\n    // 最好先检查这一点\n    if (n < 0)\n    {\n        throw\
  \ string(\"Argument for factorial negative\");\n    }\n    // 继续计算阶乘\n    int accum\
  \ = 1;\n    while(n > 0)\n    {\n        accum *= n;\n        n--;\n    }\n    return\
  \ accum;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    try\n    {\n\
  \        // 这将可以工作\n        cout << \"Factorial of 3 is \" << factorial(3) << endl;\n\
  \        // 这将产生异常\n        cout << \"Factorial of -1 is \" << factorial(-1) <<\
  \ endl;\n    }\n}\n```\n\n\n\n\n\n```cpp\n// control will never get here\n\n   \
  \     cout << \"Factorial of 5 is \"\n               << factorial(5) << endl;\n\
  \   }\n\n   // control passes here\n\n   catch(string error)\n   {\n        cout\
  \ << \"Error occurred: \" << error << endl;\n   }\n   catch(...)\n   {\n       \
  \ cout << \"Default catch \" << endl;\n   }\n   // wait until user is ready before\
  \ terminating program\n   // to allow the user to see the program results\n   cout\
  \ << \"Press Enter to continue...\" << endl;\n   cin.ignore(10, '\\n');\n   cin.get();\n\
  \n   return 0;\n}\n```\n\n`main()` 开始时创建一个带有 `try` 关键字的代码块。在这个代码块内部，它的执行方式可以像该代码块不存在时一样。在这种情况下，`main()`\
  \ 尝试计算一个负数的阶乘。并没有被欺骗，聪明的 `factorial()` 函数检测到了这个虚假的请求，并使用 `throw` 关键字抛出一个错误指示。控制权传递到紧随\
  \ `try` 块结束大括号之后的 `catch` 语句。\n\n第三次调用 `factorial()` 不会被执行。\n\n![tip.eps](img/tip_fmt.png)\
  \ 通过一个并不高明的名为“异常规范”（exception specification）的特性，你可以将 `factorial()` 抛出的对象类型添加到它的声明中。曾经，有人认为这是一个好主意，但时代变了。异常规范从未是强制性的，并且在\
  \ 2011 年的标准中被弃用了。本书未介绍异常规范。\n\n## 为新的错误机制提供理论护？\n\n像 FORTRAN 过去那样使用错误返回值有什么问题？阶乘不能为负数，所以我可以说类似：“好的，如果\
  \ `factorial()` 检测到错误，它就返回一个负数。实际值表示问题的来源。”这有什么问题吗？长期以来都是这样做的（“如果它对我爷爷来说已经足够用了……”）。\n\
  \n遗憾的是，会出现几个问题。首先，虽然阶乘的结果不能为负数是事实，但其他函数就没有那么幸运了。例如，你不能对负数取对数，但对数可以是负数也可以是正数。对数函数没有无法返回的值。\n\
  \n其次，整数中可以存储的信息非常多。也许你可以用 –1 表示“参数为负”，用 –2 表示“参数过大”。但是，如果参数太大，你想知道参数具体是多少，因为这些信息可能帮助你调试问题。没有地方可以存储这类信息。\n\
  \n第三，错误返回值的处理是可选的。假设有人编写了 `factorial()`，让它忠实地检查参数，并在参数超出范围时返回一个负数。如果调用 `factorial()`\
  \ 的函数没有检查错误返回，那么返回错误值就无济于事。当然，你可以发出各种威胁性的警告，例如“你必须检查错误返回，否则后果”，程序员可能出于最好的意图，但你们都知道人会变懒，并回到他们以前不检查错误的老习惯。\n\
  \n即使你检查了 `factorial()` 或任何其他函数的错误返回，该函数又能对错误做什么呢？它可能只能输出它自己的错误消息，并向调用者返回另一个错误指示，而调用者可能也做同样的事情。很快，错误检测代码就会比“真实”代码还要多，而且它们全部混杂在一起。\n\
  \n异常机制通过从正常代码路径中移除错误路径解决了这些问题。此外，异常使得错误处理变得强制性。如果你的函数没有处理抛出的异常，控制权就会沿着调用函数链向上传递，直到\
  \ C++ 找到一个处理错误的函数。这赋予了你灵活性，可以忽略那些你根本无能为力的错误。只有那些能够处理问题的函数才需要捕捉异常。\n\n## 检查异常机制\n\
  \n仔细观察代码处理异常的步骤。当发生 `throw` 时，C++ 首先将抛出的对象拷贝到某个中性位置。然后，它开始寻找当前 `try` 块的结束。\n\n如果在当前函数中没有找到\
  \ `try` 块，控制权将传递给调用函数。然后对该函数进行搜索。如果那里也没有找到 `try` 块，控制权将传递给调用它的函数，以此沿着调用函数栈向上类推。这个过程被称为“栈展开”（unwinding\
  \ the stack）。\n\n栈展开的一个重要特性是，当每个堆栈被展开时，离开作用的对象会被析构，就像函数执行了 `return` 语句一样。这防止了程序丢失资源或留下悬挂对象。\n\
  \n当找到外层的 `try` 块时，代码会搜索 `catch` 块结束大括号紧后的第一个 `catch` 语句。如果抛出的对象与 `catch` 语句指定的参数类型匹配，控制权就会传递到该\
  \ `catch` 语句。如果不匹配，则检查下一个 `catch` 语句。如果没有找到任何匹配的 `catch` 语句，代码将不断向外螺旋搜索更高层级的 `try`\
  \ 块，直到找到适当的 `catch` 为止。如果未找到 `catch` 语句，程序将终止。\n\n考虑以下示例：\n\n```cpp\n  // CascadingException\
  \ - 下面的程序演示了\n//                一个栈展开的示例\n\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\n// 我们之后需要的一些函数的原型\nvoid f1();\nvoid\
  \ f2();\nvoid f3();\n\nclass Obj\n{\n  public:\n    Obj(char c) : label(c)\n   \
  \ { cout << \"Constructing object \" << label << endl;} }\n    ~Obj()\n    { cout\
  \ << \"Destructing object \" << label << endl; }\n  protected:\n    char label;\n\
  };\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    f1();\n    // wait until\
  \ user is ready before terminating program\n    // to allow the user to see the\
  \ program results\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n\nvoid f1()\n{\n    Obj a('a');\n \
  \   try\n    {\n        Obj b('b');\n        f2();\n    }\n    catch(float f)\n\
  \    {\n        cout << \"Float catch\" << endl;\n    }\n    catch(int i)\n    {\n\
  \        cout << \"Int catch\" << endl;\n    }\n    catch(...)\n    {\n        cout\
  \ << string(\"Generic catch\") << endl;\n    }\n}\n\nvoid f2()\n{\n    try\n   \
  \ {\n        Obj c('c');\n        f3();\n    }\n    catch(string msg)\n    {\n \
  \       cout << \"String catch\" << endl;\n    }\n}\n\nvoid f3()\n{\n    Obj d('d');\n\
  \    throw 10;\n}\n```\n\n执行此程序的输出如下：\n\nConstructing object a\nConstructing object\
  \ b\nConstructing object c\nConstructing object d\nDestructing object d\nDestructing\
  \ object c\nDestructing object b\nInt catch\nDestructing object a\nPress Enter to\
  \ continue...\n\n首先，你看到对象 *a, b, c,* 和 *d* 被构造，因为 `main()` 调用了 `f1()`，`f1()` 调用了\
  \ `f2()`，`f2()` 调用了 `f3()`。然而，`f3()` 没有返回而是抛出了整数 10。由于 `f3()` 中没有定义 `try` 块，C++\
  \ 展开 `f3()` 的栈，导致对象 *d* 被析构。链中的下一个函数 `f2()` 定义了一个 `try` 块，但它唯一的 `catch` 语句旨在处理 *string*，这与抛出的\
  \ *int* 不匹配。因此，C++ 继续寻找。这展开了 `f2()` 的栈，导致对象 *c* 被析构。\n\n回到 `f1()` 中，C++ 找到了另一个 `try`\
  \ 块。离开该块导致对象 *b* 离开作用域。C++ 跳过了第一个针对 *float* 的 `catch` 语句。下一个 `catch` 语句与 *int* 完全匹配，因此\
  \ C++ 将控制权传递到该语句。\n\n\n\n\n\n控制权从 `catch(int)` 语句传递到最后一个 `catch` 语句的结束大括号，然后从那里返回\
  \ `main()`。最后的 `catch(...)` 语句（捕获任何抛出的对象）会被跳过，因为已经找到了匹配的 `catch` 语句。\n\n## 我可以抛出什么类型？\n\
  \n`throw` 关键字后面的内容实际上是一个创建一个某种类型对象的表达式。在之前的示例中，我抛出了一个 `int` 和 `string` 对象，但 `throw`\
  \ 可以处理任何类型的对象。这意味着你可以抛出几乎任何你想要的信息。考虑以下对阶乘程序的更新版本，`CustomExceptionClass`：\n\n```cpp\n\
  //\n//  CustomExceptionClass - 通过创建自定义\n//              异常类来演示异常机制的灵活性\n//     \
  \         a custom exception class\n\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n#include <sstream>\n\nusing namespace std;\n\n// MyException - 通用异常处理类\n\
  class MyException\n{\n  public:\n    MyException(const char* pMsg, int n,\n    \
  \            const char* pFunc,\n                const char* pFile, int nLine)\n\
  \    : msg(pMsg), errorValue(n),\n      funcName(pFunc), file(pFile), lineNum(nLine){}\n\
  \n    virtual string display()\n    {\n      ostringstream out;\n      out << \"\
  Error <\" << msg << \">\"\n          << \" - value is \" << errorValue << \"\\n\"\
  \n          << \"in function \" << funcName << \"()\\n\"\n          << \"in file\
  \ \" << file\n          << \" line #\" << lineNum << ends;\n      return out.str();\n\
  \    }\n\n  protected:\n    // 错误消息\n    string msg;\n    int   errorValue;\n  \
  \  // 函数名、文件名和行号\n    // 错误发生的地方\n    string funcName;\n    string file;\n    int\
  \ lineNum;\n};\n\n// factorial - 计算阶乘\nint factorial(int n) throw(MyException)\n\
  {\n    // 你不能处理 n 的负值；\n    // 最好先检查该条件\n    if (n < 0)\n    {\n        throw MyException(\"\
  Negative argument not allowed\",\n                        n, __func__, __FILE__,\
  \ __LINE__);\n    }\n    // 继续计算阶乘\n    int accum = 1;\n    while(n > 0)\n    {\n\
  \        accum *= n;\n        n--;\n    }\n    return accum;\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    try\n    {\n        // 这将会运行\n       \
  \ cout << \"Factorial of 3 is \"\n              << factorial(3) << endl;\n     \
  \   // 这将产生一个异常\n        cout << \"Factorial of -1 is \"\n              << factorial(-1)\
  \ << endl;\n        // 控制权永远不会到达这里\n        cout << \"Factorial of 5 is \"\n   \
  \           << factorial(5) << endl;\n    }\n    // 控制权传递这里\n    catch(MyException\
  \ e)\n    {\n        cout << e.display() << endl;\n    }\n    catch(...)\n    {\n\
  \        cout << \"Default catch \" << endl;\n    }\n    // 等待用户准备好后再终止程序\n    //\
  \ 允许用户查看程序结果\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n这个程序与本章初的阶乘程序非常相似。区别在于使用了用户定义的\
  \ `MyException` 类，该类包含了比简单字符串更多关于错误性质的信息。阶乘程序能够抛出错误消息、非法值以及发生错误的的确切位置。\n\n![remember.eps](img/remember_fmt.png)\
  \ `__FILE__`、`__LINE__` 和 `__func__` 是内置的 `#define` 宏，它们分别设置为源文件名、该文件中当前的行号以及当前函数的名称。\n\
  \n`catch` 捕获了 `MyException` 对象，然后使用内置的 `display()` 成员函数显示错误消息。（查看第 23 章以复习如何使用 `ostringstream`\
  \ 类来格式化内部字符串。）该程序的输出如下：\n\n```\nFactorial of 3 is 6\nError <Negative argument not\
  \ allowed> - value is -1\nin function factorial()\nin file C:\\CPP_Programs_from_Book\\\
  Chap24\\CustomExceptionClass\\main.cpp line #52\nPress Enter to continue...\n```\n\
  \n## 只是路过\n\n在本地分配资源的函数可能需要捕获异常，进行一些处理，然后将其重新抛回栈链。考虑以下示例：\n\n```cpp\n  void fileFunc()\n\
  \  {\n    ofstream* pOut = new ofstream(\"File.txt\");\n    otherFunction();\n \
  \   delete pOut;\n  }\n```\n\n正如任何读过第 8 章的人所知，`new` 分配的内存不会被返回。如果 `otherFunction()`\
  \ 抛出异常，它将会丢失。为了避免这种情况，`fileFunc()` 可以包含 `catch(...)` 来捕获任何异常：\n\n```cpp\n  void\
  \ fileFunc()\n  {\n    ofstream* pOut = new ofstream(\"File.txt\");\n    try\n \
  \   {\n      otherFunction();\n    }\n    catch(...)\n    {\n      delete pOut;\n\
  \      throw;\n    }\n}\n```\n\n在此内部，`fileFunc()` 返回了内存。然而，`throw` 关键字将异常重新抛回链链中。\n\
  \n## 多重继承\n\n在讨论的章节中，每个类都继承自一个父类。然而，某些类代表了多个类的融合。这被称为多重继承。这种类的一个例子是沙发床。你可以像使用沙发一样在沙发床上看电视……然后你可以又把它展开……在\
  \ C++ 中，沙发床应该能够继承床的属性。\n\n### 描述多重继承\n\n图 25-1 显示了 `SleeperSofa` 的继承图。实现 `SleeperSofa`\
  \ 的代码如下：\n\n```cpp\n// SleeperSofa - 既是床也是沙发\n//  MultipleInheritance - 单个类可以继承\n\
  //  多于一个基类\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Bed\n{\n  public:\n    Bed(){}\n    void sleep(){ cout\
  \ << \"Sleep\" << endl; }\n  int weight;\n};\n\nclass Sofa\n{\n  public:\n    Sofa(){}\n\
  \    void watchTV(){ cout << \"Watch TV\" << endl; }\n  int weight;\n};\n\n// SleeperSofa\
  \ - 继承 Bed 和 Sofa\nclass SleeperSofa : public Bed, public Sofa\n{\n  public:\n \
  \   SleeperSofa(){}\n    void foldOut(){ cout << \"Fold out\" << endl; }\n};\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    SleeperSofa ss;\n    // 你可以像沙发一样在沙发床上看电视……\n\
  \    ss.watchTV(); // 调用 Sofa::watchTV()\n    //……然后你就可以又把它展开……\n    ss.foldOut();\
  \ // 调用 SleeperSofa::foldOut()\n    // ...在它上面睡觉\n    ss.sleep(); // 调用 Bed::sleep()\n\
  \n    // 等待用户准备好后再终止程序\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\n    // 允许用户看到程序结果\n\
  \n    cout << \"Press Enter to continue...\" << endl;\n\n    cin.ignore(10, '\\\
  n');\n\n    cin.get();\n\n    return 0;\n}\n```\n\n在这里，`Bed` 和 `Sofa` 类看起来像普通的类。然而，与之前的示例不同，`SleeperSofa`\
  \ 类同时继承了 `Bed` 和 `Sofa`（即多重继承）。从类声明中同时出现这两个类可以明显看出这一点。`SleeperSofa` 继承了两个基类的所有成员。因此，`ss.sleep()`\
  \ 和 `ss.watchTV()` 这两个调用都是合法的。你可以将 `SleeperSofa` 当作 `Bed` 或 `Sofa` 使用。此外，`SleeperSofa`\
  \ 类还可以拥有自己的成员，例如 `foldOut()`。该程序的输出如下：\n\n看电视\n折叠展开\n睡觉\n按回车键继续...\n\n这个国家真太棒了，不是吗？\n\
  \n## 消除继承歧义\n\n虽然多重继承是一个强大的特性，但它引入了几个可能的问题。其中一个问题在前面的示例中显而易见。注意 `Bed` 和 `Sofa` 都包含一个成员\
  \ `weight`。这是逻辑性的，因为它们都有可测量的重量。问题是：“`SleeperSofa` 继承了哪一个 `weight`？”\n\n答案是“两个”。`SleeperSofa`\
  \ 继承了成员 `Bed::weight` 和另一个独立的成员 `Sofa::weight`。由于它们的名称相同，对 `weight` 的未限定引用现在变得歧义。下面的代码片段演示了这一点，它会产生编译时错误：\n\
  \n```cpp\n#include <iostream>\n\nvoid fn()\n{\n    SleeperSofa ss;\n    cout <<\
  \ \"weight = \"\n         << ss.weight   // 非法 - 哪个重量？\n         << \"\\n\";\n}\n\
  ```\n\n程序现在必须通过指定所需的基类来指示这两个重量中的一个。以下代码片段是正确的：\n\n```cpp\n#include <iostream>\n\n\
  void fn()\n{\n    SleeperSofa ss;\n    cout << \"sofa weight = \"\n         << ss.Sofa::weight\
  \  // 指定是哪一个重量\n         << \"\\n\";\n}\n```\n\n虽然这个解决方案解决了问题，但在应用函数中指定基类是不理想的，因为它迫使类信息泄露到类外部的应用程序代码中。在这种情况下，`fn()`\
  \ 必须知道 `SleeperSofa` 继承自 `Sofa`。这种所谓的“名称冲突”在单继承中是不可能的，但在多重继承中是一个持续的危险。\n\n## 添加虚拟继承\n\
