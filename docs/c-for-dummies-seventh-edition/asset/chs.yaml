  \ 找到更高版本的 `Code::Blocks` 以及适用于不同 Linux 版本。\n\n![tip.eps](img/tip_fmt.png) 如果你去了\
  \ [www.codeblocks.org](http://www.codeblocks.org)，请务必下载包含 `gcc` 编译器的版本。\n\n如果你已经在计算机上安装了你倾向于使用的\
  \ C++ 编译器，请随意使用，只要它与 C++ 标准兼容（大多数编译器都是的）。并不是所有的编译器都已实现 2011 年标准，因此我在书中标记了 '11 扩展。此外，如果你使用不同的编译器，你的屏幕看起来可能与书中的插图不完全一样。\n\
  \n![warning.eps](img/warning_fmt.png) 我不建议在使用本书时 `Visual Studio` 或 `Visual Studio\
  \ Express` 包。它有许多设计用于与 `.NET Framework` 兼容的扩展。一旦你在 `Code::Blocks` 上学会了 C++，就可以用\
  \ `Visual Studio` 学习 `.NET` 编程。\n\n## 接下来去哪里\n\n了解一种编程语言不是一项观赏运动。我会尝试让它变得尽可能不痛苦，但你必须启动旧电脑并开始一些认真的编程。活动活动手指，把书脊压断让它平平放在键盘旁边（这样你就没法带回书店了），然后投入其中吧。\n\
  \n如果你遇到问题，首先检查常见问题解答（FAQ）。\n\n\n\n计算机是一个速度惊人但极其愚笨的机器。计算机可以完成任何你告诉它的事情（在合理范围内），但它*完全*是按照指令执行的——不多不少，分也不差。\n\
  \n或许对我们来说有些不幸的是，计算机并不理解任何人类的语言——它们也不说英语。好了，我知道你想说什么了：“我见过能听懂英语的计算机。”你看到的实际上是计算机在执行一个能够有意义地理解英语的`program`。\n\
  \n计算机理解一种各种被称为`计算机语言`或`机器语言`的语言。对人类来说，说机器语言是可能的但极其困难。因此，计算机和人类同意在中间区域会合，使用如 `C++`\
  \ 等中间语言。人类可以编写 `C++`（某种意义上来说），而 `C++` 可以被转换为机器语言供计算机理解。\n\n# 掌握 C++ 概念\n\n一个 `C++`\
  \ 程序是一个文本文件，其中包含了 `C++` 语法规则组合在一起的一系列 `C++` 命令。这个文本文件被称为`源代码`（可能是因为它是所有挫败的源头）。`C++`\
  \ 源代码通常带有 `.CPP` 扩展名，就像 Adobe Acrobat 文件以 `.PDF` 结尾，或者 MS-DOS（还记得吗？）批处理以 `.BAT`\
  \ 结尾一样。\n\n在 `C++` 中编程的目的是编写一系列命令，这些命令可以转换为机器语言程序，并实际上*执行*我们想要完成的任务。这种转换被称为`编译`，是编译器的工作。你编写的机器码必须与一些设置和销毁指令以及标准库例程结合，这个过程被称为`链接`。编译和链接合称为`构建`。生成的`机器可执行`文件在\
  \ Windows 中带有 `.EXE` 扩展名。在 Linux 或 Macintosh 上，它们没有任何特定的扩展名。\n\n这听起来挺容易的——那有什么大不了的？继续看。\n\
  \n要写一个程序，你需要两个专门的计算机程序。其中一个（编辑器）是你构建 `.CPP` 源文件时编写代码的工具。另一个（编译器）将你的源代码转换为机器可执行文件，以执行你的真实世界命令（打开电子表格、发出粗鲁的噪音、躲避飞来的小行星，等等）。\n\
  \n如今，工具开发者通常将编译器和编辑器合并成一个软件包——开发`环境.*`。当你完成输入构成程序的命令后，只需点击一个按钮即可构建可执行文件。\n\n幸运的是，有公共领域的\
  \ `C++` 环境。我在本书中使用了其中一个——`Code::Blocks` 环境。这个编辑器可以与许多不同的编译器配合工作，但编写本书时结合 `GNU gcc`\
  \ 编译器的 `Code::Blocks` 版本适用于 Windows、Macintosh 以及各种版本的 Linux 下载，正如本章的安装部分所述。\n\n\
  尽管 `Code::Blocks` 是公共领域的，但鼓励你支付小额费用以支持它的进一步开发。你*不一定*必须付费使用 `Code::Blocks`，但如果你愿意，可以贡献一份力量。详见\
  \ `Code::Blocks` 网站。\n\n我使用 `Code::Blocks` 13.12 测试了书中的程序，它内置了 `gcc` 版本 4.7.1。这个版本的\
  \ `gcc` 实现了 `C++` 2011 标准的大部分。\n\n![c++11_fmt.eps](img/c11_fmt.png) 如果你愿意可以使用不同版本的\
  \ `gcc` 甚至不同的编译器，但它们可能没有实现完整的‘11 标准’。由于如此，2011 扩展被标记为此处所示的 '11 图标。\n\n![c++14_fmt.eps](img/c14_fmt.png)\
  \ 截至本文，`gcc` 编译器尚未实现 `C++` 2014 标准中添加的任何扩展，但我已经在适用的地方包含了它们，因为终某一天它们会实现的。\n\n好吧，我承认：这本书某种程度上以\
  \ Windows 为中心。我在 Windows 2000/XP/Vista/7/8、Ubuntu Linux 和 Macintosh OS X 上测试了书中的所有程序。我在文中标记了操作系统之间的任何差异。此外，我在本章中包含了针对上述三种操作系统的安装说明。`Code::Blocks`\
  \ 和 `gcc` 的版本也适用于其他 Linux 发行版和其他版本的 Macintosh OS。这些程序应该在这些平台上正常运行。\n\n![warning.eps](img/warning_fmt.png)\
  \ `Code::Blocks/gcc` 软件包生成 32 位程序，但它并不容易创建“窗口化”程序。书中的程序从命令行提示符运行并输出到命令行。尽管这听起来很无聊，但我强烈建议你在应对窗口化开发*之前*先完成书中的示例以学习\
  \ `C++`。`C++` 和窗口编程是两件不同的事情（为了你的脑健康），在你的脑海中应该保持独立。\n\n按照下一节的步骤安装 `Code::Blocks`\
  \ 并构建你的第一个 `C++` 程序。该程序的任务是将用户输入的摄氏度温度值转换为华氏度。\n\n## 安装 Code::Blocks\n\n[www.dummies.com/extra/cplusplus](http://www.dummies.com/extra/cplusplus)\
  \ 网站包含了本书时适用于 Windows、Ubuntu Linux 和 Macintosh OS X 10.6 或更高版本的最新 `Code::Blocks`\
  \ 环境。按照适用于你操作的下方安装说明操作。\n\n### Windows\n\n`Code::Blocks` 环境以易于安装的压缩可执行文件形式提供，兼容\
  \ Windows 2000 之后的所有 Windows 版本。以下是安装该环境的概述：\n\n1.  **从 [**www.dummies.com/extra/cplusplus**](http://www.dummies.com/extra/cplusplus)\
  \ 下载 `codeblocks-13.12.mingw-setup.exe`。**\n\n    将可执行文件保存到桌面或其他你可以找到的地方。\n\n  \
  \  ![tip.eps](img/tip_fmt.png) 这包含了 4.71 版本的 GCC。这不是最新版本，但它是 CodeBlocks 推荐的版本。如果你想要更新但可能有\
  \ Bug 的 4.81 版本，可以下载并安装 *codeblocks-13.12.mingw-setup-TDM-GCC-481.exe*。我用这两个版本测试了书中的程序，但在编写期间使用的是\
  \ 4.71。\n\n2.  **程序下载完成后双击程序。**\n\n3.  **根据你使用的 Windows 版本，你可能会收到无处不在的“一个未识别程序想要访问你的计算机”警告弹出框。如果是，点击“允许\
  \ (Allow)”让安装开始。**\n\n4.  **在 CodeBlocks 安装向导的欢迎对话框如警告的那样，关闭所有无关应用程序后点击“下一步 (Next)”。**\n\
  \n5.  **阅读用户许可协议（通常称为 EULA），如果你能接受其条款，请点击“同意 (Agree)”。**\n\n    这不像你有多少选择——如果你不接受，软件包真的不会进行安装。假设你*确实*点击了确定，CodeBlocks\
  \ 会打开一个显示安装选项的对话框。默认选项是可以的。\n\n6.  **点击“下一步 (Next)”按钮。**\n\n    安装程序允许你只安装部分功能。你必须选择“默认安装\
  \ (Default Install)”和“MinGW 编译器套件 (MinGW Compiler Suite)”。默认是安装所有——这是最佳选择。\n\n \
  \   ![warning.eps](img/warning_fmt.png) 如果没有 MinGW 编译器套件，那么你下载是不包含 gcc 的 Code::Blocks\
  \ 版本。该版本无法正常工作。\n\n7.  **点击“安装 (Install)”并接受默认的目标文件夹 (Destination Folder)。**\n\n\
  \    Code::Blocks 开始将大量文件复制到你的硬盘。然后 Code::Blocks 询问“现在运行 Code::Blocks 吗？”\n\n8.\
  \  **点击“是 (Yes)”启动 Code::Blocks。**\n\n    Code::Blocks 现在询问打算使用哪种编译器。默认是 GNU GCC\
  \ 编译器，这是正确的选择。\n\n\n\n\n9. **在 Code::Blocks 内部，选择`Settings（设置）⇒Compiler（编译器）`。**\n\
  \n10. **选择`Compiler Flags（编译器标志）`选项卡。**\n\n11. **确保选中以下三个标志，如图图 1-1\n\n    图 1-1：确保设置了\
  \ Enable All Compiler Warnings 和 C++ 2011 标志。\n\n    ![warning.eps](img/warning_fmt.png)\
  \ 如果默认位置为空，则 `Code::Blocks` 将不知道 `gcc` 编译器的位置，它将无法编译你的程序。请确保你下载了包含了 `gcc` 的 `Code::Blocks`\
  \ 版本，并在安装过程中包含了 `MinGW`。如果你正在使用已经安装的现有 `gcc` 编译器，则你需要将 `Code::Blocks` 指向它在硬盘上的位置。\n\
  \n13. **关闭`Settings（设置）`对话框。**\n\n14. **点击`Code::Blocks Setup`对话框中的 Next（下一步），然后点击\
  \ Finish（完成）以完成安装程序。**\n\n    安装程序退出。\n\n### Ubuntu Linux\n\n`Code::Blocks` 在 Linux\
  \ 上不包含 `gcc`，因此安装是一个两个步骤的过程。首先，你需要安装 `gcc`。然后你可以安装 `Code::Blocks`。\n\n![9781118823774-fg0102.tif](img/9781118823774-fg0102_fmt.png)\n\
  \n图 1-2：确保编译器的安装目录是正确的。\n\n#### 安装 `gcc`\n\n`gcc` 编译器在 Linux 上可以很 easily 获得。按照以下步骤进行安装：\n\
  \n1. **在命令行提示符输入以下命令：**\n   ```bash\n   sudo apt-get update\n   sudo apt-get medical-upgrade\n\
  \   sudo apt-get install g++\n   ```\n   标准的 Ubuntu Linux 发行版包含 GNU C 编译器，但不包含 C++\
  \ 扩展，特别是不包含 C++ 2011 标准扩展。前两个命令更新并升级你已有的工具。第三个命令安装 C++。\n\n2. **在命令行提示符输入以下命令：**\n\
  \   ```bash\n   gcc --version\n   ```\n   我的 Ubuntu 13.04 下载了 GNU C++ 版本 4.7.3。你使用\
  \ 4.7.1 或更高版本也是没问题的。如果你有更早的版本，某些 C++ 2011 功能可能无法正常工作，但在其他情况下应该是没问题的。\n\n   ![tip.eps](img/tip_fmt.png)\
  \ 如果你使用的是 Debian Linux，命令是相同的。如果你使用的是 Red Hat Linux，请将命令 `apt-get` 替换为 `yum`，以便你得到：\n\
  \   ```bash\n   sudo yum install g++\n   ```\n\n#### 安装 `Code::Blocks`\n\n对所有相关人员来说，Ubuntu\
  \ 软件中心提供了适用于 Ubuntu 的 `Code::Blocks`。许多其他 Linux 版本也包含与软件中心类似的内容。按照以下步骤安装 `Code::Blocks`：\n\
  \n1. **点击 Ubuntu 桌面上的软件中心图标。**\n2. **从可用软件列表中选择`Code::Blocks`。**\n   这将开始安装过程。\n\
  \   `Code::Blocks` 会在你的硬盘上搜索 C++ 编译器。它应该能够顺利地找到它，但如果没有找到，请执行以下步骤。\n3. **启动 `Code::Blocks`。**\n\
  4. **选择`Settings（设置）⇒Compiler（编译器）`。**\n5. **选择`Compiler Flags（编译器标志）`选项卡。**\n6.\
  \ **确保选中以下三个标志，如图图 1-1\n\n   图 1-3：Xcode 下载框允许安装 Xcode。\n3. **点击 Install 图标。**\n\
  4. **输入你的系统密码（在启动 Mac 时输入）。**\n   图标变为 Installing。\n   下载和安装需要一些时间，因为 `Xcode` 超过\
  \ 2GB。\n\n#### 安装 Line Tools\n\n即使你认为 `Xcode` 已经包含了一切，但你也错了。你需要 Apple 的另一个包来完成你的工作。按照以下步骤安装\
  \ Command Line Tools：\n\n1. **打开 Safari 浏览器并访问`developer.apple.com/downloads`。**\n\
  \   你可能会被要求注册 Apple ID。请尽管注册——它是免费的。\n2. **搜索 Command Line Tools for Xcode。如图 1-4\
  \ 所示的应用程序。点击 Download 图标。**\n3. **双击下载的 `mpkg` 包进行安装。**\n4. **接受所有默认值。**\n   安装应该显示\
  \ Successful。\n\n#### 安装 `Code::Blocks`\n\n现在你可以通过下载 `Code::Blocks` 编辑器来完成安装：\n\n\
  1. **打开 Safari 浏览器并访问`www.codeblocks.org/downloads`。**\n2. **点击`Downloads（下载）⇒Binaries（二进制文件）`。**\n\
  \   ![9781118823774-fg0104.tif](img/9781118823774-fg0104_fmt.png)\n\n   图 1-4：你必须安装两者才能在\
  \ Macintosh 上获得 gcc 编译器。\n3. **点击 Mac OS X。**\n4. **选择 BerliOS 或 Sourceforge.net\
  \ 镜像获取最新版本。**\n   当时 `CodeBlocks-13.12.zip` 是最新版本。\n5. **将下载的 Zip 文件安装到 Applications（应用程序）文件夹。**\n\
  \   如果你从未从第三方网站安装过应用程序，可能需要执行这些额外步骤：\n   1. *点击 System Preferences（系统偏好设置）。*\n \
  \  2. *点击 Security and Privacy（安全性与隐私）。*\n   3. *点击对话框左下角的锁图标以允许更改。*\n   4. *点击\
  \ Allow Applications Downloaded from: Anywhere（允许从任何地方下载的应用程序），如图 [1-5](#05_9781118823774-ch01.xhtml_z5）所示。*\n\
  \n   完成安装后，你可以选择返回此对话框并将设置还原为 Mac App Store。\n\n6. **双击 Code::Blocks 图标。**\n\n\n\
  \n\n\n当你第一次执行此操作时，Mac OS 会询问：“你确定要打开它吗？”\n\n7. **选择 `在打开此磁盘映像上的应用程序时不再次询问` 并点击 `打开`。**\n\
  \n`Code::Blocks` 应该启动并找到通过 `Command Line Tools` 安装的 `gcc` 编译器。\n\n8. **选择 `gcc`\
  \ 编译器，如图 1-6 所示。点击 `设为默认`，然后点击 `OK` 继续启动 `Code::Blocks`。**\n\n`Code::Blocks` 打开后，首先显示一个横幅页，随后在对话框顶部出现一个菜单。\n\
  \n9. **选择 `设置（Settings）⇒Compiler`，然后点击 `让 g++ 遵循随来的 C++0x ISO C++ 语言标准`。点击 `OK`\
  \ 关闭对话框。**\n\n你现在已经准备好构建你的第一个 C++ 程序了。\n\n![9781118823774-fg0106.tif](img/9781118823774-fg0106_fmt.png)\n\
  \n图 1-6：首次执行 `Code::Blocks` 时，它会自动找到 `gcc` 编译器。\n\n## 创建你的第一个 C++ 程序\n\n在本节中，你将创建你的第一个\
  \ C++ 程序。你把 C++ 代码输入名为 `CONVERT.CPP` 的文件中，然后将 C++ 代码转换为可执行程序。\n\n### 创建项目\n\n创建\
  \ C++ 程序的第一步是创建一个所谓的“项目（project）”。*项目* 告诉 `Code::Blocks` 要包含的 `.CPP` 源文件名称以及要创建什么种类型的程序。书中的大多数程序将由单个源文件组成，并且是命令行风格：\n\
  \n1. **启动 `Code::Blocks` 工具。**\n\n2. **在 `Code::Blocks` 内部，选择 `文件（File）⇒新建（New）⇒项目（Project）`。**\n\
  \n3. **选择 `控制台应用程序（Console Application）` 图标然后点击 `转`。**\n\n4. **在下一个对话框中选择 `C++`\
  \ 作为你想使用的语言。点击 `下一步（Next）`。**\n\n`Code::Blocks` 和 `gcc` 也支持普通的 C 程序。\n\n5. **在 `要构建项目的文件夹（Folder\
  \ to Build Project In）` 字段中，选择 `…` 图标。**\n\n6. **点击 `计算机（Computer）` 然后点击 Windows\
  \  `C:` 盘。**\n\n在 Linux 和 Macintosh 上，你可以选择 `桌面（Desktop）`。\n\n7. **点击屏幕左下角的 `新建文件夹（Make\
  \ New Folder）` 按钮。**\n\n8. **将新文件夹命名为 `CPP_Programs_from_Book`。**\n\n结果应该如图 1-7\
  \ 所示。\n\n![9781118823774-fg0107.tif](img/9781118823774-fg0107_fmt.png)\n\n图 1-7：在\
