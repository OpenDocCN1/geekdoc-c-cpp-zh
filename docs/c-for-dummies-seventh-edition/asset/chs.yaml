  380. 394\n381. 395\n382. 397\n383. 396\n384. 398\n385. 399\n\n# 引言\n\n欢迎阅读《C++ 傻瓜指南》第七版。请把这本书看作是\
  \ C++ 的“精选”，它将带你入门，并避开所有枯燥的内容。\n\n## 本书简介\n\n《C++ 傻瓜指南》是对 `C++` 语言的介绍。我们从基础开始，逐步进入更高级的技术。我不假设你有任何基础知识（至少在编程方面）。\n\
  \n与其他 C++ 编程书籍不同，《C++ 傻瓜指南》认为“为什么”和“怎么做”同样重要。`C++` 的特性就像拼图碎片。我不只是介绍这些特性，我认为理解它们是如何结合在一起的非常重要。你也可以参考这本书：例如，如果你想了解所有模板的内容，只需翻到第\
  \ 26 章。每一章都与其他章节有引用，以防你不按顺序阅读。\n\n《C++ 傻瓜指南》并非针对特定操作系统的。它对于 Macintosh 或 Linux 程序员与\
  \ Windows 开发者同样有用。\n\n你必须首先掌握一种强大的编程语言，比如 `C++`，即使你的目标是成为一名 Windows 应用程序或 .NET 程序员。在完成《C++\
  \ 傻瓜指南》后，你可以在自己的专业领域继续深入，无论那个领域是什么。\n\n在当今黑客横行的时代，即使是初学者，学习防御性编程也是重要的，因此我确实涵盖了一些防止程序不被攻击的概念。\n\
  \n\n\n\n如果你是手动输入这些程序，必须按照所示的内容完全输入文本，唯一的例外：`whitespace`（空格、制表符和换行符）的多少并不关键。你不能在关键词中间插入空格，但你不必担心多输或少输一个空格。\n\
  \n![warning.eps](img/warning_fmt.png) 然而，大小写（Case）是关重要的。如果它显示为 `int`，它并不代表 `Int`\
  \ 或 `INT`！\n\nC++ 单词通常基于含义相似的英文单词。在没有帮助的情况下，阅读既包含英文又包含 C++ 代码的句子可能会很困难。为了提供帮助，C++\
  \ 命令和函数名将以不同的字体显示，，`like this`。此外，函数名后面总是跟着左括号和右括号，例如 `myFavoriteFunction()`。除非有特殊需要让它们更易读，否则函数的参数会被省略。\n\
  \n有时，我会要求你使用菜单命令，例如 `File⇒Open`。这种表示法意味着使用键盘或鼠标打开 `File` 菜单，然后选择 `Open` 选项。\n\n\
  在写指南书时，性别的使用始终是一个棘手的话题。我不希望看起来是在告诉男士们有多无知，同时又一直用 `he` 和 `him` 来放过女士们。在书中，当我指的是程序员时使用代词\
  \ `she` 和 `her`，当指的是程序用户时使用 `he` 和 `him`。所以，*她*写了一个*他*可以使用的程序。\n\n每个新功能通过回答以下三个问题来引入的：\n\
  \n*   `What` 这个新功能是什么？\n*   `Why` 为什么要将其引入语言中？\n*   `How` 它是如何工作的？\n\n小段代码大量散落在各个章节中。每个片段都演示了某个新引入的功能，或突出了我提出的某些精彩观点。这些片段可能不完整，而且肯定没有执行任何实际意义。然而，每个概念都至少在一个功能性程序得到了演示，你可以在自己的计算机上执行并运行它。\n\
  \n一个真实的程序可能会占用很多页面。然而，对于任何读者来说，看到这样的程序是一个重要的教学工具。我包含了一系列程序，并对这些程序的工作原理进行了解释。\n\n\
  我使用了一个简单的示例程序，我称之为 `BUDGET`。该程序最初是一个简单的、面向函数的 `BUDGET1`。这个程序维护了一组简单的检查和储蓄账户。鼓励读者在第\
  \ II 部分结束处回顾此程序。随后的版本 `BUDGET2` 增加了在第 III 部分介绍的面向对象概念。示例通过使用越来越多的语言特性进行，最终以 `BUDGET5`\
  \ 达到顶峰，你应该在掌握了书中的所有章节后回顾它。`BUDGET` 程序包含在书的源代码中，地址位于 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)。\n\
  \n## 本书使用的图标\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 这是技术性内容，你在第一遍阅读时可以跳过。\n\
  \n![tip.eps](img/tip_fmt.png) 提示（Tips）突出了可以节省你大量时间和精力的点。\n\n![remember.eps](img/remember_fmt.png)\
  \ 记住这个。这很重要。\n\n![warning.eps](img/warning_fmt.png) 也记住这个。它会在你最意想不到的时候溜出来出现，并产生那些非常难发现的\
  \ bug。\n\n![c++11_fmt.eps](img/c11_fmt.png) 此图标标记了语言与前身标准（称为 C++ 2003）相比的一些 2011\
  \ 年新增内容。如果你已经对 C++ 有了了解，或者某些内容看起来完全是新的，或者某些内容在你现有的 C++ 工具上无法运行，可能是因为它是 '11 年新增的。\n\
  \n![c++14_fmt.eps](img/c14_fmt.png) 此图标标记了 C++ 2014 标准建议新增的内容。这些功能在本书编写时可用的 `Code::Blocks/gcc`\
  \ 中尚未实现，但它们可以在 [www.codeblocks.org](http://www.codeblocks.org) 获取。\n\n## 书籍之外的内容\n\
  \n*C++ For Dummies* 在网上提供了以下额外资源以供方便下载：\n\n*   在一个页（相当）易于阅读的页面上提供 C++ 语法的概览的速查表可以在\
  \ [www.dummies.com/cheatsheet/cplusplus](http://www.dummies.com/cheatsheet/cplusplus)\
  \ 获取。初学者在学习后续章节时会想要将其打印并备用。就像“渐进式社会主义”一样，C++ 语法最终将成为本能，你将不再需要速查表了。\n\n*   书中所有示例的源代码可以从\
  \ [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus) 下载。程序按章节组织。我包含了一个用于\
  \ `Code::Blocks` 的项目文件（关于 `Code::Blocks` 的更多信息见下一个项目符号，我在第 1 章解释了项目文件）。\n\n*   本书使用了免费的开源\
  \ `Code::Blocks` 环境和 `GCC C++` 编译器。编写本书时使用的 `Code::Blocks` 版本（`Version13.12`）可以在\
  \ [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus) 下载。我包含了\
  \ Windows（2000 及更高版本）和 Macintosh（10.6 及更高版本）的版本。Linux 版本也可以在网上获得。第 1 章包含了如何下载和安装\
  \ `Code::Blocks` 的说明。你可以在 [www.codeblocks.org/downloads/binaries](http://www.codeblocks.org/downloads/binaries)\
  \ 找到更高版本的 `Code::Blocks` 以及适用于不同 Linux 版本。\n\n![tip.eps](img/tip_fmt.png) 如果你去了\
  \ [www.codeblocks.org](http://www.codeblocks.org)，请务必下载包含 `gcc` 编译器的版本。\n\n如果你已经在计算机上安装了你倾向于使用的\
  \ C++ 编译器，请随意使用，只要它与 C++ 标准兼容（大多数编译器都是的）。并不是所有的编译器都已实现 2011 年标准，因此我在书中标记了 '11 扩展。此外，如果你使用不同的编译器，你的屏幕看起来可能与书中的插图不完全一样。\n\
  \n![warning.eps](img/warning_fmt.png) 我不建议在使用本书时 `Visual Studio` 或 `Visual Studio\
  \ Express` 包。它有许多设计用于与 `.NET Framework` 兼容的扩展。一旦你在 `Code::Blocks` 上学会了 C++，就可以用\
  \ `Visual Studio` 学习 `.NET` 编程。\n\n## 接下来去哪里\n\n了解一种编程语言不是一项观赏运动。我会尽量让它变得痛苦，但你必须启动旧电脑并开始一些认真的编程。活动活动手指，把书脊压断让它平平放在键盘旁边（这样你就没法带回书店了），然后投入其中吧。\n\
