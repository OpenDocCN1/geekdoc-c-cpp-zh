  \n图 1-9：`管理（Management）` 对话框显示了所有可用程序的目录结构。\n\n2. **按照书写的内容完全编辑 `main.cpp` 以输入以下程序。**\n\
  \n不要过于担心缩进或间距——某行缩进两个空格还是三个空格，或者两个单词之间是一个还是两个空格，并不关键。然而，C++ 是区分大小大小的，因此你需要确保一切都是小写。\n\
  \n![tip.eps](img/tip_fmt.png) 你可以利用下一节介绍的 [www.dummies.com/extra/cplusplus](http://www.dummies.com/extra/cplusplus)\
