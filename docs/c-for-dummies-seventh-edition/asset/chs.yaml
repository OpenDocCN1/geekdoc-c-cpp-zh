  \ 获取优质 Dummies 在线内容。\n\n在本部分中……\n\n*   编写函数\n*   使用数组\n*   传递指针\n*   定义常量和宏\n* \
  \  访问 [www.dummies.com/extras/cplusplus](http://www.dummies.com/extras/cplusplus)\
  \ 获取优质 Dummies 在线内容\n\n## 第六章\n\n# 创建函数\n\n## 本章\n\n![arrow](img/arrow.png) 编写函数\n\
  ![arrow](img/arrow.png) 向函数传递数据\n![arrow](img/arrow.png) 使用不同参数命名函数\n![arrow](img/arrow.png)\
  \ 创建函数原型\n![arrow](img/arrow.png) 值传递与引用传递\n![arrow](img/arrow.png) 为参数提供默认值\n\n\
  之前章节中开发的程序足够小，可以很容易地作为一个单元来阅读。而现实世界中的大型程序通常有数千甚至数百万行代码。开发者需要将这些“巨兽级”程序拆分成更小的块，以便更容易进行构思、描述、开发和维护。\n\
  \nC++ 允许程序员将代码划分为此类“函数”的块。一个 `function` 是一个可以作为单一实体执行的小型代码块。这允许程序员将其程序划分为许多这样的实体，每个实体都实现整个程序中某个定义良好的子集。函数本身又被拆分成更小、更详细的函数，形成一个不断减小、不断详细的解决方案金字塔，最终构成了完整的程序。\n\
  \n这种分治方法将创建一个相当规模的运行程序的复杂性降低到了凡人可以完成的程度。\n\n## 编写和使用函数\n\n通过示例理解函数是。本节从示例程序 `FunctionDemo`\
  \ 开始，它通过定义一个函数来包含部分逻辑，简化了我在第 5 章中讨论过的 `NestedDemo` 程序。然后，本节将解释如何定义以及如何调用该函数，并将 `FunctionDemo`\
  \ 作为理解问题和解决方案的模式。\n\n第 5 章中的 `NestedDemo` 程序包含至少三个可以在脑海中和事实中被轻松分离的部分：\n\n*   对操作员关于如何输入数据的说明\n\
  *   一个累加单个数字序列的内层循环\n*   一个反复调用内层循环直到累加值为 0 的外层循环\n\n沿着这些思路分离程序，允许程序员集中处理程序的每个部分。下面的\
  \ `FunctionDemo` 程序展示了如何通过创建函数 `displayExplanation()` 和 `sumSequence()` 来拆分 `NestedDemo`：\n\
  \n```cpp\n// FunctionDemo - 展示函数的用法\n//              将 NestedDemo 程序的\n//      \
  \        内层循环拆分到独立的\n//              函数中\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\n// displayExplanation - 提示用户游戏的\n\
  //                      规则\nvoid displayExplanation(void)\n{\n    cout << \"This\
  \ program sums multiple series\\n\"\n         << \"of numbers. Terminate each sequence\\\
  n\"\n         << \"by entering a negative number.\\n\"\n         << \"Terminate\
  \ the series by entering an\\n\"\n         << \"empty sequence.\\n\"\n         <<\
  \ endl;\n    return;\n}\n\n// sumSequence - 从键盘输入数字序列\n//              直到用户输入\n\
  //              负数。\n//              return - 输入数字的总和\nint sumSequence(void)\n{\n\
  \    // 无限循环\n    int accumulator = 0;\n    for(;;)\n    {\n        // 获取另一个数字\n\
  \        int nValue = 0;\n        cout << \"Enter next number: \";\n        cin\
  \ >> nValue;\n        // 如果是负数...\n        if (nValue < 0)\n        {\n        \
  \    // ...那么跳出循环\n            break;\n        }\n        // ...否则将数字加到\n      \
  \  // 累加器\n        accumulator += nValue;\n    }\n    // 返回累加值\n    return accumulator;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 向用户显示提示\n    displayExplanation();\n\
  \    int accumulatedValue = sumSequence();\n    if (accumulatedValue == 0)\n   \
  \ {\n        // ...\n    }\n    cout << \"The total is \" << accumulatedValue <<\
  \ endl << endl;\n    // ... ( user10,\n\n    \n    get ...\n    cout << \"Press\
  \ Enter to continue...\" << endl;\n    return 0;\n}\n```\n\n\n\n\n\n`sumSequence()`\
  \ 函数还包含一个用于退出程序的 `return` 语句。这个 `return` 是不是可选的，因为它包含了要返回的值 `accumulator`。返回值的类型必须与声明中的函数类型匹配，在本例中为\
  \ `int`。\n\n### 调用函数 `sumSequence()`\n\n再次回到 `FunctionDemo` 中的 `main()` 函数。这段代码看起来与\
  \ `NestedDemo` 中的外层循环相似。\n\n主要的区别在于 `accumulatedValue = sumSequence();` 表达式，它出现在本应该是内层循环的位置。`sumSequence()`\
  \ 语句调用了同名的函数。表达式 `sumSequence()` 的值是函数返回的值。该值被存储在变量 `accumulatedValue` 中并显示。主程序将继续循环，直到\
  \ `sumSequence()` 返回一个为 0 的和，这表示用户已完成求和计算。\n\n### 分治与策略\n\n`FunctionDemo` 程序将 `main()`\
  \ 中的外层循环和内层循环拆分为函数 `sumSequence()`，并创建了 `displayExplanation()` 来启动程序。这种划分并不是任意的：`FunctionDemo`\
  \ 中的两个函数执行的是逻辑上独立的操作。\n\n![tip.eps](img/tip_fmt.png) 一个好的函数是易于描述的。你不应该使用超过一句话，且最少使用\
  \ *and*、*or*、*unless*、*until* 或 *but*。例如，这里有一个简单直接的定义：“函数 `sumSequence` 累加用户输入的一系列整数值。”这个定义简洁清晰。它与\
  \ `NestedDemo` 程序的描述相比大相径庭：“程序向用户解释程序如何工作，然后对一组正数序列求和，然后显示和，并重新开始，**直到**用户输入一个长度为\
  \ 0 的和。”\n\n该程序的示例运行输出似乎与 `NestedDemo` 程序生成的输出完全相同。\n\n## 理解函数的细节\n\n函数对于创建 C++\
  \ 程序来说是如此基础，以至于掌握定义、创建和测试它们的细节至关重要。结合示例程序 `FunctionDemo`，请考虑以下函数的定义：一个 `function`\
  \ 是一个逻辑上独立的 C++ 代码块。\n\n函数构造具有如下形式：\n\n```\n<return type> name(<arguments to the\
  \ function>)\n\n{\n    // ...\n    return <expression>;\n}\n```\n\n函数的 `arguments`（参数）是可以传递给函数并用作输入信息的值。`return`\
  \ value（返回值）是函数返回的值。例如，在调用函数 `square(10)` 时，值 10 是函数 `square()` 的一个参数。返回值是 100（如果不是，那么这个函数的命名就很糟糕）。\n\
  \n参数和返回值都是可选的。如果缺失其中任一者，则使用关键字 `void` 代替。也就是说，如果函数具有 `void` 参数列表，则在调用时该函数不接受任何参数（`FunctionDemo`\
  \ 程序中就是这种情况）。如果返回类型为 `void`，则函数不向调用者返回任何值。\n\n![tip.eps](img/tip_fmt.png) 函数的默认参数类型为\
  \ `void`，意味着它不接受任何参数。函数 `int fn(void)` 可以声明为 `int fn()`。\n\n### 理解简单函数\n\n简单函数 `sumSequence()`\
  \ 返回它所计算的整数值。函数可以返回第 2 章 中描述的任何内置变量类型。例如，函数可以返回 `double` 或 `char`。如果函数没有返回值，则函数的返回类型标记为\
  \ `void`。\n\n![tip.eps](img/tip_fmt.png) 函数可以用其返回类型来标记——例如，返回 `int` 的函数通常被称为整数函数。不返回值的函数被称为\
  \ void 函数。\n\n例如，以下 `void` 函数执行了操作但没有返回值：\n\n```cpp\nvoid echoSquare()\n{\n    int\
  \ value;\n    cout << \"Enter a value:\";\n    cin >> value;\n    cout << \"\\nThe\
  \ square is:\" << (value * value) << \"\\n\";\n    return;\n}\n```\n\n控制从左括号开始并持续到\
  \ `return` 语句。`void` 函数中的 `return` 语句后面没有值。`void` 函数中的 `return` 语句是可选的。如果不存在，当控制遇到右括号时，执行将返回调用函数。\n\
  \n### 理解带参数的函数\n\n没有参数的函数用途有限，因为通信是单向的——通过返回值。双向通信是通过函数参数实现的。\n\n#### 带参数的函数\n\n\
  `function argument`（函数参数）是一个变量，其值在调用操作期间传递给调用函数。以下 `SquareDemo` 示例程序定义并使用了一个函数 `square()`，它返回传递给它的双精度浮点数的平方：\n\
  \n```cpp\n// SquareDemo - demonstrate the use of a function\n// which processes\
  \ arguments\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\n// square - returns the square of its argument\n// doubleVar\
  \ - the value to be squared\n// returns - square of doubleVar\ndouble square(double\
  \ doubleVar)\n{\n    return doubleVar * doubleVar;\n}\n\n// displayExplanation -\
  \ prompt the user as the rules\n// of the game\nvoid displayExplanation(void)\n\
  {\n    cout << \"This program sums the square of multiple\\n\"\n         << \"series\
  \ of numbers. Terminate each sequence\\n\"\n         << \"by a negative number.\\\
  n\"\n         << \"Terminate the series by entering an\\n\"\n         << \"empty\
  \ sequence.\" << endl;\n    return;\n}\n\n// sumSquare - accumulate the square of\
  \ the number\n// at the keyboard into a sequence\n// until the user enters a negative\
  \ number\ndouble sumSquare(void)\n{\n    // loop forever\n    double accumulator\
  \ = 0.0;\n    for(;;)\n    {\n        // fetch another number\n        double dValue\
  \ = 0;\n        cout << \"Enter next number: \";\n        cin >> dValue;\n     \
  \   // if it's negative...\n        if (dValue < 0)\n        {\n            // ...then\
  \ exit from the loop\n            break;\n        }\n        // ...otherwise calculate\
  \ the square\n        double value = square(dValue);\n        // now add the square\
  \ to the accumulator\n        accumulator += value;\n    }\n    // return the accumulated\
  \ value\n    return accumulator;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    displayExplanation();\n    // Continue to accumulate numbers...\n    for(;;)\n\
  \    {\n        // sum a sequence of numbers entered from the keyboard\n       \
  \ cout << \"Enter next sequence\" << endl;\n        double accumulatedValue = sumSquare();\n\
  \        // terminate if the sequence is zero or negative\n        if (accumulatedValue\
  \ <= 0.0)\n        {\n            break;\n        }\n        // now output the accumulated\
  \ result\n        cout << \"\\nThe total of the values squared is \"\n         \
  \    << accumulatedValue << endl << endl;\n    }\n    // wait until user is ready\
  \ before terminating program\n    // to allow the user to see the program results\n\
  \    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n这本质上是同一个 `FunctionDemo` 程序，只是 `sumSquareSequence()`\
  \ 函数累加了输入值的平方并将其作为 `double` 而不是 `int` 返回。`square()` 函数返回其唯一参数乘以自身的乘积。对 `sumSequence()`\
  \ 函数的更改非常简单：现在现在不是累加输入的值，而是累加从 `square()` 返回的结果。\n\n#### 带多个参数的函数\n\n\n\n\n函数可以有多个参数，并用逗号分隔。因此，以下函数返回其两个参数的乘积：\n\
  \n```cpp\nint product(int arg1, int arg2)\n{\n    return arg1 * arg2;\n}\n```\n\n\
  ### 暴露 main()\n\n我们标准程序模板中的“关键字” `main()` 不仅仅是一个函数——尽管这是一个带有奇怪参数的函数，但它终是一个函数。\n\n\
  当 C++ 从源代码构建程序时，它会添加一些在你的程序启动之前执行的样板代码（如果不深入研究 C++ 库函数的内部，你是看不到这些代码的）。这些代码设置了程序运行的环境。例如，这些样板代码打开了默认的输入输出通道\
  \ `cin` 和 `cout`。\n\n在建立环境后，C++ 样板代码会调用函数 `main()`，从而开始执行你的代码。当你的程序结束时，它会从 `main()`\
  \ 退出。这使得 C++ 样板代码可以在将控制权交给杀死程序的操作系统之前进行一些清理工作。\n\n`main()` 的参数非常复杂——我们稍后会讨论。`main()`\
  \ 返回的 `int` 是状态指示器。如果程序正常终止，程序返回 0。任何其他值都可以用来表示错误——返回的实际值表示导致程序退出的错误性质。\n\n## 函数名重载\n\
  \nC++ 必须有一种区分函数的方法。因此，两个函数不能共享相同的名称和参数列表，这被称为*扩展名*（extended name）或*签名*（signature）。以下扩展函数名都是不同的，可以存在于同一个程序中：\n\
  \n```cpp\nvoid someFunction(void)\n{\n    // ....执行某些功能\n}\n\nvoid someFunction(int\
  \ n)\n{\n    // ...执行某些不同的功能\n}\n\nvoid someFunction(double d)\n{\n    // ...执行某些非常不同的功能\n\
  }\n\nvoid someFunction(int n1, int n2)\n{\n    // ....再执行一些不同的事情\n}\n```\n\nC++\
  \ 知道函数 `someFunction(void)`、`someFunction(int)`、`someFunction(double)` 和 `someFunction(int,\
  \ int)` 不是同一个。\n\n![tip.eps](img/tip_fmt.png) 这种对名称的多次使用被称为函数*重载*（overloading）。\n\
  \n程序员通常通过函数的简名称（引用不带参数的名称）来称呼函数，例如 `someFunction()`，就像我把 Stephen 简称为 Stephen（实际上，我的绰号是\
  \ Randy，但在这里请配合我一下）。但如果有任何疑问，可以通过包含我的姓来与其他 Stephens 区分来。同样，重载函数可以通过它们的参数列表来区分。\n\
  \n这是一个使用具有唯一扩展名的重载函数的典型应用：\n\n```cpp\nint intVariable1, intVariable2;\ndouble doubleVariable;\n\
  \n// 函数通过传递的参数的类型进行区分\nsomeFunction();                  // 调用 someFunction(void)\n\
  someFunction(intVariable1);     // 调用 someFunction(int)\nsomeFunction(doubleVariable);\
  \ // 调用 someFunction(double)\nsomeFunction(intVariable1, intVariable2); // 调用 someFunction(int,\
  \ int)\n\n// 这对于常量也有效\nsomeFunction(1);               // 调用 someFunction(int)\n\
  someFunction(1.0);             // 调用 someFunction(double)\nsomeFunction(1, 2); \
  \           // 调用 someFunction(int, int)\n```\n\n在每种情况下，参数的类型都与这三个函数的扩展名匹配。\n\n\
  ![warning.eps](img/warning_fmt.png) 返回类型不是函数扩展名的一部分。以下两个函数名称相同，因此它们不能属于同一个程序：\n\n\
  ```cpp\nint someFunction(int n);  // 函数的全名\ndouble someFunction(int n); // 相同的名称\n\
  long l = someFunction(10);  // 调用哪个函数？\n```\n\n在这里 C++ 不知道是将从 `double` 版本的 `someFunction()`\
  \ 返回的值转换为 `long`，还是提升 `int` 版本返回的值。\n\n## 定义函数原型\n\n函数在使用之前必须先声明。这样 C++ 就可以将调用处与声明进行比较，以确保执行任何必要的转换。然而，函数在第一次声明时并不需要定义。函数可以在模块的任何地方定义（*模块*是文件的另一个名称）。\n\
  \n考虑以下代码段：\n\n```cpp\nint main(int nOfArgs, char* psz[])\n{\n    someFunction(1,\
  \ 2);\n}\n\nint someFunction(int arg1, int arg2);\n{\n    // ...实现\n}\n```\n\n`main()`\
  \ 中的调用 `someFunction(1, 2)` 与声明匹配。通常做法是在模块的开头或更常见的在单独文件中为每个函数包含函数原型：\n\n```cpp\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n```\n\n这三个文件 `cstdio`、`cstdlib`\
  \ 和 `iostream` 包含了我们一直在使用的常用函数（如 `cout`）的原型声明。\n\n## 参数参数\n\n你可以在函数声明中为参数提供默认值。考虑以下简单示例：\n\
  \n```cpp\n// isLegal - 如果年龄大于或等于最小年龄则返回 true，最小年龄默认为 21\nbool isLegal(int age, int\
  \ minAge = 21)\n{\n    return age >= minAge;\n}\n```\n\n如果传递的第一个参数 `age` 大于第二个参数\
  \ `minAge`，该函数返回*true*；如果你在函数调用中没有说明，第二个参数将默认为 21。因此，以下调用都是合法的：\n\n```cpp\nlegal\
  \ = isLegal(age); // 等同于 isLegal(age, 21)\n\nif (inLouisiana())\n{\n    legal =\
  \ isLegal(age, 18);\n}\n```\n\n调用 `isLegal(age)` 完全等同于 `isLegal(age, 21)`。C++ 只是为你提供了默认参数。调用\
  \ `isLegal(age, 18)` 则忽略默认值。\n\n你可以为多个参数设置默认值，但默认值必须从右到左定义，并从左到右填充：\n\n```cpp\n\
  // 以下是合法的\n```\n\n\n\n\n```cpp\nbool isWorkingAge(int age, int minAge=18, int maxAge=65);\n\
  \n// 检查工人是否在 18 到 65 之间\n\nlegal = isWorkingAge(age);\n\n// 检查工人是否在 21 到 65 之间\n\
  \nlegal = isWorkingAge(age, 21);\n\n// 检查工作是否在 21 到 60 之间\n\nlegal = isWorkingAge(age,\
  \ 21, 60);\n\n// 以下代码并不会检查工人是否\n// 在 18 到 60 之间\n\nlegal = isWorkingAge(age, 60);\n\
  ```\n\n第一次调用对最小和最大年龄使用了默认值（分别为 18 和 65）。第二次调用使用了默认的最大年龄 65，但提供了一个不同的最小年龄 21。第三次调用则同时显了显式的最小和最大年龄。\n\
  \n![warning.eps](img/warning_fmt.png) 最后一次调用并没有像你预期的那样去检查年龄是否在 18 到 60 之间。在这种情况下，调用时使用的最小年龄是\
  \ 60，最大年龄是 65。\n\n![warning.eps](img/warning_fmt.png) 默认参数在与函数重载结合时有时会让 C++ 产生困惑。例如，以下是不合法的：\n\
  \n```cpp\nbool isLegal(int age);\n\nbool isLegal(int age, int minAge = 21); // 不允许\n\
  ```\n\n问题在于，如果你调用 `isLegal(10)`，C++ 不知道应该调用这两个函数中的哪一个：只有一个参数的第一个函数，还是带有默认参数的第二个函数。\n\
  \n## 值传递与引用传递\n\nC++ 通常通过值传递将参数传递给函数。这意味着，如果我调用函数 `fn(n)`，传递给函数的是 `n` 的值。这允许我进行如下的调用：\n\
  \n```cpp\nfn(a + b);   // 传递 a + b 的值\n```\n\n在段片段中，传递的是表达式 `a + b` 的结果。\n\n这有一个可能会意料之外的副作用，如下代码段所示：\n\
  \n```cpp\nvoid multiplyByTwo(int m)\n{\n    m *= 2;\n}\n\nint n = 1;\nmultiplyByTwo(n);\n\
  cout << \"n = \" << n << endl;\n```\n\n你可能会惊讶地发现这个示例打印出 `n = 1`。\n\n让我们逐步分析这个示例：\n\
  \n1. 主程序声明变量 `n` 并将其初始化为 1。\n2. 随后程序将 `n (1)` 的值传递给函数 `multiplyByTwo()`，并将其命名为 `m`。\n\
  3. 函数将传递的值乘以 2，并将结果存储在局部变量中。\n4. `multiplyByTwo()` 在返回时丢弃 `m`。\n5. 主程序显示未改变的 `n\
  \ (1)`。\n\n![tip.eps](img/tip_fmt.png) 这被称为*值传递*（pass by value），另一种被称为*引用传递*。\n\n\
  你可以通过在类型后添加 ampersand `(&)` 来告诉 C++ 你传递的不是变量的值，而是变量的引用，如下片段所示：\n\n```cpp\nvoid multiplyByTwo(int&\
  \ m)  // 引用参数\n{\n    m *= 2;\n}\n\nint n = 1;\nmultiplyByTwo(n);\ncout << \"n =\
  \ \" << n << endl;\n```\n\n这个示例执行了以下操作：\n\n1. 主程序声明变量 `n` 并将其初始化为 1。\n2. 随后程序将 `n`\
  \ 的引用传递给函数 `multiplyByTwo()`，该函数将该引用称为 `m`。\n3. 函数将 `m` 引用的变量乘以 2，并将结果保存回 `m` 引用的变量中（换句话说，变量\
  \ `n`）。\n4. 主程序显示改变后的 `n (2)`。\n\n![warning.eps](img/warning_fmt.png) 数组（我将在下一章介绍）总是通过引用传递的，原因我将在第\
  \ 8 章中解释。\n\n我将在第 8 章中对引用参数进行更多说明。\n\n## 变量存储类型\n\n变量还会根据它们在函数中的定义位置和方式被分配一个存储类型，如下例所示：\n\
  \n```cpp\nint globalVariable;\n\nvoid fn()\n{\n    int localVariable;\n    static\
  \ int staticVariable = 1;\n}\n```\n\n在函数内部定义的如 `localVariable` 的变量被称为局部变量。在执行通过函数\
  \ `fn()` 内部的声明处之前，`localVariable`并不存在。当函数返回时，`localVariable` 消失。返回后，`localVariable`\
  \ 中存储的任何值都会丢失。此外，只有 `fn()` 可以访问 `localVariable` —— 其他函数无法进入该函数来访问它。\n\n相比之下，变量 `globalVariable`\
  \ 在程序开始执行时创建，只要程序运行它一直存在。所有函数都可以一直访问 `globalVariable`。\n\n`static` 关键字可以用来创建一种混合体——某种介于全局和局部变量之间的东西。静态变量\
  \ `staticVariable` 在函数 `fn()` 第一次被调用且执行到达声明处时创建，就像局部变量一样。然而，当程序执行从函数返回时，静态变量并不会销毁。相反，它保留了从一次调用到下一次调的值。如果\
  \ `fn()` 给 `staticVariable` 赋值过一次值，那么下一次调用 `fn()` 时它仍然在那里。在后续每次执行通过该处时，声明的初始化部分会被忽略。\n\
  \n第 7 章\n\n# 在数组中存储序列\n\n### 本章内容\n\n- ![arrow](img/arrow.png) 考虑对类似数组结构的需求\n- ![arrow](img/arrow.png)\
  \ 介绍数组数据类型\n- ![arrow](img/arrow.png) 使用数组\n- ![arrow](img/arrow.png) 使用最常见的数组类型——字符字符串\n\
  \n*数组*是一个共享相同名称并通过索引引用的变量序列。数组是非常实用的的小工具，允许你存储许多相同类型且以某种方式相关的值——例如，同一支球队所有球员的击球率可能是存储在数组中的良好选择。数组也可以是多维的，允许你存储按月份划分的击球率数组。\n\
  \n在本章中你将了解如何初始化和使用数组来娱乐和盈利。你还将发现一种非常有用的数组形式，称为*字符字符串*。\n\n## 数组的参数数组\n\n考虑以下问题。你需要一个可以读取数字序列并显示它们的和的程序。你猜得没错——一旦你输入负数，程序就会停止读取。然而，与第\
  \ 5 章和第 6 章中的类似程序不同，此程序会在显示平均值之前输出所有输入的数字。\n\n你可以尝试将数字存储一组独立的变量中，如下：\n\n```cpp\n\
  cin >> value1;\nif (value1 >= 0)\n{\n    cin >> value2;\n    if (value2 >= 0)\n\
  \    {\n        ...\n    }\n```\n\n你可以看到这种方法无法处理包含几个数字的序列。此外，它很丑。我们需要的是某种像变量一样命名但可以存储多个值的结构。请允许向大家介绍\
  \ A. Ray 女士。\n\n数组很好地解决了序列问题。例如，以下片段声明了一个名为 `valueArray` 的数组，它可以存储多达 128 个 *int*\
  \ 值。然后用键盘输入的数字填充数组：\n\n```cpp\nint nValue;\n// 声明一个可以容纳 128 个 int 的数组\nint nValueArray[128];\n\
  // 定义用于访问数组后续成员的索引；不要超过 128 个 int 的限制\nfor (int i = 0; i < 128; i++)\n{\n    cin\
  \ >> nValue;\n    // 当用户输入负数时退出循环\n    if (nValue < 0)\n    {\n        break;\n\
  \    }\n    nValueArray[i] = nValue;\n}\n```\n\n\n\n\n\n此代码段的第二行声明了一个数组 `nValueArray`。数组声明以数组成员的类型开始：在本例中，为\
  \ `int`。紧接着是数组的名称。数组声明的最后元素是成对的括号，其中包含了数组可以容纳的最大元素数量。在代码段中，`nValueArray` 最可以存储 128\
  \ 个整数。\n\n![c++11_fmt.eps](img/c11_fmt.png) 数组的大小必须是一个常量表达式——这意味着这是一个 C++ 在构建构建时可以计算的表达式。\n\
  \n![c++14_fmt.eps](img/c14_fmt.png) 2014 年的标准允许程序使用任何表达式声明数组的大小，只要该值在遇到声明时是已知的。然而，一旦声明，数组的大小就固定了。\n\
  \n此代码段从键盘读取一个数字，并将其存储在数组 `nValueArray` 的后续每个成员中。你通过提供数组名称以及包含索引的括号来访问数组的单个元素。数组中的第一个整数是\
  \ `nValueArray[0]`，第二个是 `nValueArray[1]`，依此类推。\n\n在使用时，`nValueArray[i]` 代表数组中的第\
  \ `i` 个元素。索引变量 `i` 必须是一个计数变量——也就是说，`i` 必须是 `char`、`int` 或 `long`。如果 `nValueArray`\
  \ 是一个 `int` 数组，那么 `nValueArray[i]` 就是一个 `int`。\n\n### 使用数组\n\n以下程序从键盘输入一系列整数值，直到用户输入负数为止。程序随后显示输入的数字并报告它们的和。\n\
  \n```cpp\n// ArrayDemo - 演示数组的使用\n// 通过读取一系列整数\n// 然后显示它们以及它们的和\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// 原型声明\nint\
  \ readArray(int integerArray[], int maxNumElements);\nint sumArray(int integerArray[],\
  \ int numElements);\nvoid displayArray(int integerArray[], int numElements);\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入循环计数\n    cout << \"This\
  \ program sums values entered \"\n         << \"by the user\\n\";\n    cout << \"\
  Terminate the loop by entering \"\n         << \"a negative number\\n\";\n    cout\
  \ << endl;\n\n    // 从用户处读取要求和的数字存入\n    // 局部数组\n    int inputValues[128];\n  \
  \  int numberOfValues = readArray(inputValues, 128);\n\n    // 现在输出值以及这些的和\n   \
  \ displayArray(inputValues, numberOfValues);\n    cout << \"The sum is \"\n    \
  \     << sumArray(inputValues, numberOfValues)\n         << endl;\n\n    // 等待用户准备好后再退出程序\n\
  \    //以便用户看到程序结果\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n\n    return 0;\n}\n\n// readArray - 从运算符处读取整数到\n// 'integerArray'\
  \ 直到运算符输入负数。\n// 返回存储的元素个数\nint readArray(int integerArray[], int maxNumElements)\n\
  {\n    int numberOfValues;\n    for(numberOfValues = 0;\n        numberOfValues\
  \ < maxNumElements;\n        numberOfValues++)\n    {\n        // 获取另一个数字\n    \
  \    int integerValue;\n        cout << \"Enter next number: \";\n        cin >>\
  \ integerValue;\n        // 如果是负数...\n        if (integerValue < 0)\n        {\n\
  \            // ...那么退出\n            break;\n        }\n        // ... 否则将数字存储\n\
  \        // 到存储数组\n        integerArray[numberOfValues] = integerValue;\n    }\n\
  \    // 返回元素个数\n    return numberOfValues;\n}\n\n// displayArray - 显示长度为\n// 数组的成员\n\
  void displayArray(int integerArray[], int numElements)\n{\n    cout << \"The value\
  \ of the array is:\" << endl;\n    for (int i = 0; i < numElements; i++)\n    {\n\
  \        cout << i << \": \" << integerArray[i] << endl;\n    }\n    cout << endl;\n\
  }\n\n// sumArray - 返回数组成员的和\nint sumArray(int integerArray[], int numElements)\n\
  {\n    int accumulator = 0;\n    for (int i = 0; i < numElements; i++)\n    {\n\
  \        accumulator += integerArray[i];\n    }\n    return accumulator;\n}\n```\n\
  \n程序 `ArrayDemo` 开始于函数 `readArray()`、`sumArray()` 和 `displayArray()` 的原型声明，这些函数稍后将需要用到。主程序从提示用户输入要求和的数据开始。随后程序声明了一个数组\
  \ `inputValues[]`，用于存储用户输入的值。主程序将此数组传递给 `readArray()`，并带有数组的长度——`readArray()`。如果用户不输入负数，`readArray()`\
  \ 无法读取超过 128 个值，因为 `inputValues[]` 数组中只分配这么多空间。\n\n![warning.eps](img/warning_fmt.png)\
  \ 数组 `inputValues` 被声明为 128 个整数长度。如果你认为这足够了，请不要以此为准。无论你把数组做得多大，始终要进行一个检查以确保你没有超过数组的限制。写入比数组能容纳更多的数据会导致你的程序运行异常并经常崩溃。这在第\
  \ 28 章中进行了详细讨论。\n\n主函数随后调用 `displayArray()` 来打印数组的内容。最后，该函数调用 `sumArray()` 来相数组中的元素。\n\
  \n`readArray()` 函数接收两个参数：用于存储其读取的值的 `integerArray[]` 以及 `maxNumElements`（即有空间存储的最大整数值数量）。该函数从一个\
  \ `for` 循环开始读取整数值。函数读取的每个非负值都会被保存到 `integerArray[]` 中。第一个元素进入 `integerArray[0]`，第二个进入\
  \ `integerArray[1]`，依此类推。\n\n一旦用户输入负数，程序跳出循环并返回输入的总数 `numberOfValues`。\n\n`displayArray()`\
  \ 函数同样使用 `for` 循环遍历数组元素，从 0 开始到最后一个元素（即 `numElements - 1`）。最后一个函数 `sumArray()` 也遍历数组，但将存储的元素累加到\
  \ `accumulator` 中，并返回给调用者。\n\n再次注意，`displayArray()` 和 `sumArray()` 函数中的索引 `i` 初始化为\
  \ 0 而不是 1。此外，注意当 `i` 达到 `numElements` 时 `for` 循环如何终止。示例运行的输出如下：\n\n```\nThis program\
  \ sums values entered by the user\nTerminate the loop by entering a negative number\n\
  Enter next number: 10\nEnter next number: 20\nEnter next number: 30\nEnter next\
  \ number: 40\nEnter next number: -1\nThe value of the array is:\n0: 10\n1: 20\n\
  2: 30\n3: 40\nThe sum is 100\nPress Enter to continue...\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 为了让非程序员感到困惑，“遍历”（iterate）意味着遍历一组对象，例如数组。程序员说前面的函数正在遍历数组。\n\n### 初始化数组\n\n局部变量在创建时并没有有效值，甚至不是\
  \ 0。换句话说，在实际向其存储内容之前，局部变量包含垃圾值。局部定义的数组也是如此——在实际对其进行赋值之前，每个元素都包含垃圾值。你应该在声明局部变量时初始化它们。这一规则对于数组来说更为如此。访问未初始化的数组元素并认为它们是有效值太容易了。\n\
  \n\n\n\n\n![warning.eps](img/warning_fmt.png) 我所说的“局部变量”，是指在函数内部声明的普通变量。C++ 纯洁者实际上称这些为\
  \ `自动变量`，以区分它们于静态变量（在第 18 章中讨论）。\n\n幸运的是，小型数组可以在声明时使用初始化列表进行初始化。下面的代码段演示了如何操作：\n\
  \n```cpp\nfloat floatArray[5] = {0.0, 1.0, 2.0, 3.0, 4.0};\n```\n\n这会将 `floatArray[0]`\
  \ 初始化为 0，`floatArray[1]` 初始化为 1.0，`floatArray[2]` 初始化为 2.0，依此类推。\n\n如果初始化列表中的元素数量少于数组的大小，C++\
  \ 会用 0 填充初始化列表。事实上，可以使用空初始化列表来将数组初始化为 0：\n\n```cpp\nint nArray[128] = {}; // 将数组初始化为所有\
  \ 0\n```\n\n初始化常量的数量可以决定数组的大小。例如，你只需要通过数大括号内的值，就可以确定 `floatArray` 有五个元素。C++ 也会数数（这至少是\
  \ C++ 能为自己做的一件事）。\n\n```cpp\nfloat floatArray[] = {0.0, 1.0, 2.0, 3.0, 4.0};\n```\n\
  \n### 访问数组越界\n\n数学家从 1 开始计数数组。大多数编程语言也从偏移量 1 开始。C++ 数组从 0 开始计数。C++ 数组的第一个成员是 `valueArray[0]`。这意味着一个\
  \ 128 整数数组的最后一个元素是 `integerArray[127]`，而不是 `integerArray[128]`。\n\n遗憾对于程序员来说，C++\
  \ 不会检查你使用的索引是否在数组范围内。C++ 非常乐意让你访问 `integerArray[200]`。我们的 `integerArray` 院子只有 128\
  \ 个整数那么长 —— 200 已经进入了别人的院子 72 个整数。无法知道那里住在谁，以及他在那个位置存储了什么。从 `integerArray[200]`\
  \ 读取将返回某个未知且不可预测的值。向该位置写入产生不可预测的结果。它可能什么都不做 —— 那栋房子可能被遗弃，院子未未使用。另一方面，它可能会覆盖某些数据，从而困扰邻居并让程序以一种看似随机的方式运行。或者可能会导致程序崩溃。\n\
  \n![warning.eps](img/warning_fmt.png) 访问数组最常见的错误方法是读取或写入位置 `integerArray[128]`。虽然它只比数组结尾多元素，但读取或写入此位置与使用任何其他错误地址一样危险。\n\
  \n### 基于范围的 for 循环\n\n![c++11_fmt.eps](img/c11_fmt.png) 在某些情况下，你可以使用基于范围的 `for`\
  \ 循环访问数组元素。下面的 `for` 循环将 `nArray` 的所有成员初始化为 0：\n\n```cpp\nint nArray[128];\nfor(int&\
  \ n: nArray)\n{\n    n = 0;\n}\n```\n\n这个 `for` 循环表示将变量 `n` 赋值为 `nArray` 中每个元素的引用。然后通过引用\
  \ `n` 为 `nArray` 中的每个元素分配 0。\n\n![warning.eps](img/warning_fmt.png) 下面的基于范围的 `for`\
  \ 循环没有任何效果：\n\n```cpp\nint nArray[128];\nfor(int n: nArray)\n{\n    n = 0;\n}\n\
  ```\n\n如果没有和符号 (`&`)，`n` 将被赋值为 `nArray` 每个元素的值。然后变量 `n` 会被 0 覆盖，导致 `nArray` 的值保持不变。将此比于第\
  \ 6 章描述的按值传递参数与按引用传递参数。\n\n![tip.eps](img/tip_fmt.png) 基于范围的 `for` 循环只能用于 C++ 在编译时知道数组大小的地方。例如，基于范围的\
  \ `for` 循环在 `displayArray()` 函数内部无法工作。该函数旨在处理任何大小的数组。当你在未未数组上使用基于范围的 `for` 循环时，你会得到非常奇怪的编译时错误信息。关于这一点我在第\
  \ 26 章会有更多说明。\n\n### 定义和使用数组数组\n\n数组擅长存储数字序列。某些应用需要序列的序列。这种矩阵配置的一个经典例子是电子表格。电子表格像棋盘一样布局，每个元素都有\
  \ `x` 和 `y` 偏移量。\n\nC++ 如下实现矩阵：\n\n```cpp\nint intMatrix[10][5];\n```\n\n这个矩阵在一个维度上有\
  \ 10 个元素，在另一个维度上有 5 个，总共 50 个元素。换句话说，`intMatrix` 是一个 10 元素的数组，每个元素都是一个 5 元素的数组。正如你预期的，一个角是\
  \ `intMatrix[0]`，而另一个角是 `intMatrix[9][4]`。认为 `intMatrix` 在 `x` 维度上长度为 10 个元素还是在\
  \ `y` 维度上，这取决于喜好。矩阵可以像数组一样初始化：\n\n```cpp\nint intMatrix[10][5] = {{1, 2, 3}, {4,\
  \ 5}};\n```\n\n这一行将 `intMatrix[0]` 初始化为 1, 2, 3；并将 `intMatrix[1]` 初始化为 4, 5。\n\n\
  ### 使用字符数组\n\n数组的元素可以是任何类型。`float`、`double` 和 `long` 数组都是可能的；然而，字符数组有特殊的意义。\n\n\
  ### 创建字符数组\n\n人类的单词和句子可以用字符数组表示。下面的程序显示了我的名字：\n\n```cpp\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n// 原型声明\nvoid displayCharArray(charArray[],\
  \ int sizeOfArray);\n\nint main(int nNumberArgs, char* pszArgs[])\n{\n    char charName[]={'S',\
  \ 't', 'e', 'h', 'e', 'n'};\n    displayCharArray(charName, 7);\n    cout << \"\
  按回车继续...\" << endl;\n    cin.get();\n    return 0;\n}\n\n// displayCharArray 逐个显示数组\n\
  void displayCharArray(charArray[], int sizeOfArray)\n{\n    for(int i = 0; i< sizeOfArray;\
  \ i++)\n    {\n        cout << charArray[i];\n    }\n}\n```\n*(注：由于原文提供的文本中 `main`\
  \ 函数代码块似乎存在截断或格式混乱（例如大括号未闭合），在翻译时我根据上下文进行了逻辑微调，以确保代码的可读性，但严格遵循了不翻译代码块的原则。)*\n\n\
