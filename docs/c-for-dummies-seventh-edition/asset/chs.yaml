  \n### 构建你的程序\n\n在你将 C++ 源文件保存到硬盘之后，就是时候生成可执行的机器指令了。\n\n要构建你的 `Conversion` 程序，你可以从菜单中选择\
  \ `Build⇒Build` 或按下 `Ctrl-F9`。`Code::Blocks` 几乎立即启动并兴致勃勃地编译你的程序。如果一切顺利，右下角的对话框中将会显示\
  \ `0 Errors, 0 Warnings`（0 错误，0 个警告），如图图 1-10\n\n图 1-10：Code::Blocks 快速构建 `Conversion`\
  \ 程序。\n\n这似乎是一个相当无害的错误——也许你我彼此可以原谅，但对 C++ 则不然。选择 `Build⇒Build` 开始编译和构建过程。`Code::Blocks`\
  \ 几乎立即在错误行旁边放置一个红色方块。Build Message（构建消息）选项卡中的消息是一条相当晦涩的 `error: expected primary-expression\
  \ before '>' token`。要消除这条消息，请删除多余的 `>` 并重新编译。\n\n![tip.eps](img/tip_fmt.png) 你可能认为示例生成的错误信息有点神秘，但请给一点时间——你现在只编程了大约\
  \ 30 分钟。随着时间的推移，你将更好地理解 `Code::Blocks` 和 `gcc` 生成的错误信息。\n\n![warning.eps](img/warning_fmt.png)\
  \ 这一次 `Code::Blocks` 能够直接指向错误，但它并不总是那么好。有时它直到下一行或其之后的某行才会注意到错误，所以如果标记有错误的行行看起来没问题，请开始查看它的前一行，看看错误是否在那里。\n\
  \n### 执行你的程序\n\n现在是时候执行你的新作品了……也就是说，运行你的程序。你将运行 `Conversion` 程序文件并提供输入以查看它的运行效果如何。\n\
  \n要在 Windows 的 `Code::Blocks` 上执行 `Conversion` 程序，选择 `Build⇒Build and Run` 或按下 `F9`。如果发生了任何变化，它将重新构建程序；如果构建成功，将执行程序。\n\
  \n一个对话框立即打开，要求输入摄氏度温度。输入一个已知温度，例如 100 度。按下 `Enter` 后，程序将返回等同的 212 度华氏度，如下：\n\nEnter\
  \ the temperature in Celsius:****100**\n\nFahrenheit value is:212\n\nPress Enter\
  \ to continue…\n\n`Press Enter to continue ...` 消息让你在它消失之前有机会阅读你输入的内容。按下 `Enter`，对话框（及其内容）就会消失。恭喜你！你刚刚输入、构建并执行了你的第一个\
  \ C++ 程序。\n\n注意，`Code::Blocks` 并不是真的用于开发像 Windows 中那样的窗口化程序。理论上，你可以使用 `Code::Blocks`\
  \ 写 Windows 应用程序，但不简单。（在 Visual Studio 中构建窗口应用程序要容易得多。）\n\nWindows 程序向用户显示视觉导向的输出，整齐地排列在屏幕窗口中。`Conversion.exe`\
  \ 是一个在 Windows 下运行的 32 位程序，但从视觉意义上来说它并不是 Windows 程序。\n\n如果你不知道 `32-bit program`\
  \ 是什么，不要担心。正如我所说，这本书不是关于编写 Windows 程序的。你在书中编写的 C++ 程序具有在 MS-DOS 框内执行的命令行界面。\n\n\
  初学 Windows 程序员不应该绝望——你没有浪费钱。学习 C++ 是编写 Windows 程序的前提。我认为它们应该分开掌握：先 C++，后 Windows。\n\
  \n### 审查带注释的程序\n\n在别人的程序中输入数据就像看别人开车一样无。你真的需要自己坐在驾驶位上。程序也很像汽车。所有的汽车基本上是一样的，只有细小的区别和增加——好吧，法国汽车与其他汽车差别很大，但这一点仍然有效。汽车遵循相同的基本模式——方向盘在你面前，座椅在你下方，车顶在你上方，诸此类推。\n\
  \n同样，所有的 C++ 程序都遵循一个共同模式。这种模式已经出现在这第一个程序中了。我们可以通过寻找所有程序共有的元素来审查 `Conversion` 程序。\n\
  \n### 检查所有 C++ 程序的框架\n\n你为这本书编写的每个 C++ 程序都使用相同的基本框架，看起来非常像这样：\n\n```cpp\n//\n//\
  \ Template - 提供一个可以作为\n//             起点的模板\n//\n// 以下包含的文件定义了任何程序\n//         \
  \    需要的大部分函数\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 你的 C++\
  \ 代码在这里开始\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    cout<< \"Press Enter to\
  \ continue...\" <<endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
  \ 0;\n}\n```\n\n在不涉及所有无聊细节的情况下，执行始于紧跟在 `main()` 行之后的紧合大括号中的代码。\n\n我已将这段代码复制到名为 `Template.cpp`\
  \ 的文件中，位于主 `CPP_Programs_from_Book` 文件夹中。\n\n### 使用注释澄清源代码\n\n`Conversion` 程序中的前几行看起来是自由格式文本。要么这段代码是写给人类看的，要么\
  \ C++ 比我所认为的要聪明得多。这前六行被称为注释。注释是程序员在编写特定代码段时对她正在做什么或思考的解释。编译器忽略注释。程序员们（至少是优秀的程序员）不忽略。\n\
  \nC++ 注释以双斜杠 `//` 开始并以换行符结束。你可以在注释中放入任何想要的字符。注释可以像你想要的那么长，但习惯上是将注释行保持不超过 80 个字符宽。在过去——这里的“过去”是相对的——屏幕宽度限制为\
  \ 80 个字符。某些打印机在打印文本时仍默认为 80 个字符宽。现如今，保持单行少于 80 个字符只是一个很好的实用建议（更易读；不容易引起眼睛疲劳；常理如此）。\n\
  \n在打字机时代，换行符被称为回车——那时向机器中输入字符的行为被称为“打字”而不是“键盘输入”。换行符是终止命令行的字符。\n\n![warning.eps](img/warning_fmt.png)\
  \ C++ 允许第二形式的注释，其中 `*/` 之后和 `/*` 之前的所有内容都会被忽略；然而，这种形式的注释在 C++ 中不再常用。\n\n在 C++（或任何其他编程语言）中有一个被计算机特意忽略的命令可能看起来很奇怪。然而，所有的计算机语言都有某种版本的注释。程序员解释她在编写代码时脑子里的想法是至关重要的。程序员的想法对于下一个尝试使用或修改她程序的同事来说并不显而易见。事实上，如果程序员自己在自己在编写原始代码几个月后再次查看它，她可能也会忘记她的程序的含义。\n\
  \n### 基于 C++ 语句编写程序\n\n所有的 C++ 程序都基于所谓的 C++ 语句。本节将审查构成 `Conversion` 程序所用框架的语句。\n\
  \n\n\n语句（statement）是一组单一的命令。除了注释外，几乎所有的 C++ 语句都以分号结束。（在第 10 章中你还会看到另一个例外。）程序的执行从左大括号后的第一个\
  \ C++ 语句开始，并按照列表顺序一个接一个地继续执行。\n\n当你查看程序时，你会发现空格、制表符和换行符贯穿整个程序。事实上，我在这个程序的每条语句后面都放置了换行符。这些字符统称为*空白字符*（whitespace），因为你无法显示器上看到它们。\n\
  \n![tip.eps](img/tip_fmt.png) 你可以在程序的任何喜欢的地方添加空白字符来增强可读性——但在单词中间除外：\n\n明白我的意思吗？\n\
  \n尽管 C++ 可能忽略空白字符，但它并不忽略大小写。事实上，C++ 对大小写的敏感程度近乎痴迷。变量 `fullspeed` 和变量 `FullSpeed`\
  \ 之间彼此没有任何关系。命令 `int` 完全可以被理解，但 C++ 并不知道 `INT` 的意思。明白我说的“快速但愚蠢的编译器”是什么了吗？\n\n###\
  \ 编写声明\n\n`int celsius;` 这一行是一个声明语句。`声明`（declaration）是一个定义变量的语句。`变量`（variable）是存储某种类型值的“存储容器”。变量包含一个`值`（value），例如数字或字符。\n\
  \n*变量*一词源于以下类型的代数公式：\n\n```\nx = 10\ny = 3 * x\n```\n\n在第二个表达式中，`y` 被赋值为 `x` 的 3\
  \ 倍，但 `x` 是什么？变量 `x` 充当值的存储容器。在这种情况下，`x` 的值是 10，但我们完全也可以将 `x` 的值设置为 20、30 或 -1。无论\
  \ `x` 的值是多少，第二个公式都是意义的。\n\n在代数中，你可以（但并不要求）以 `x = 10` 这样的语句开始。在 C++ 中，程序员必须在使用变量\
  \ `x` 之前先定义它。\n\n在 C++ 中，一个变量有一个类型和一个名称。第 11 行定义的变量称为 `celsius`，并声明为存储一个整数。（为什么他们不能直接说\
  \ `integer` 而不是 `int`，我永远不知道。这只是你必须学会适应的事物之一。）\n\n变量的名称对 C++ 并没有特殊意义。变量必须以字母 `A`\
  \ 到 `Z`、字母 `a` 到 `z` 或下划线（`_`）开头。所有后续字符必须是字母、数字 0 到 9 或下划线。变量名可以根据你的需要任意长。\n\n![tip.eps](img/tip_fmt.png)\
  \ 习惯上变量名从小写字母开头。变量*内部*的每个新单词以大写字母开头，例如 `myVariable`。\n\n![tip.eps](img/tip_fmt.png)\
  \ 尝试让变量名简短但具有描述性。避免使用像 `x` 这样的名称，因为 `x` 没有特殊意义。像 `lengthOfLineSegment` 这样的变量名描述得多。\n\
  \n### 生成输出\n\n以 `cout` 和 `cin` 开头的行被称为输入/输出语句，通常缩称为 I/O 语句。（和所有工程师一样，程序员都喜欢缩写和首字母缩写词。）\n\
  \n第一个 I/O 语句说将短语 *Enter the temperature in Celsius* 输出到 `cout`（读音为“see-out”）。`cout`\
  \ 是标准 C++ 输出设备的名称。在这种种情况下，标准 C++ 输出设备就是你的显示器。\n\n下一行完全相反。它实际上在说：“从 C++ 输入设备中提取一个值并将其存储在整数变量\
  \ `celsius` 中。”C++ 输入设备通常是键盘。我们在这里得到的是与刚才提到的代数公式 `x = 10` 的 C++ 类比形式。在程序的剩余部分，`celsius`\
  \ 的值取决于用户在该处输入的内容。\n\n### 计算表达式\n\n除了最基础的程序外，所有程序都会执行某种计算。在 C++ 中，`表达式`（expression）是一个执行计算的语句。换句话说，表达式是一个具有值的语句。`运算符`（operator）是一个产生值的命令。\n\
  \n例如，在转换（Conversion）示例程序中——特别是在标记为*计算表达式*的那两行中——程序声明了一个变量 `factor`，然后给它赋值为计算得到的结果。这条特定命令计算了\
  \ 212 减 32 的差；运算符是减号（–），表达式是 `212–32`。\n\n### 存储表达式的结果\n\n口语语言可能非常具有歧义。*equals*（等于）一词就是这些歧义之一。*equals*\
  \ 这个词可以意味着两个事物具有相同的值，如“美元等于一百美分”。*equals* 也可以暗示赋值，就像数学中你说 \"`y` 等于 `x` 的 3 倍”一样。\n\
  \n为了避免歧义，C++ 程序员将 `=` 称为`赋值运算符`（assignment operator），它（实际上）表示：“将赋值符号右侧表达式的结果存储在左侧的变量中。”程序员会说“`factor`\
  \ 被赋值为 212 减 32”。简之，你可以说“`factor` 得到了 212 减 32”。\n\n![warning.eps](img/warning_fmt.png)\
  \ 永远不要说“`factor` *等于* 212 减 32”。你会从一些懒惰的人那里听到这种说法，但你我都很清楚。\n\n### 检查转换程序的剩余部分\n\n\
  转换程序中的第二个表达式比第一个稍微复杂一点。这个表达式使用了相同的数学符号：`*` 用于乘法，`/` 用于除法，`+` 用于加法。然而，在这种情况下，计算是在变量上进行的而不仅仅是常量。\n\
  \n名为 `factor` 的变量包含的值（顺便说一下，它是通过 212 – 32 的结果计算出来的）乘以 `celsius` 变量包含的值（这是从键盘输入的）。结果除以\
  \ 100 并加上 32。整个表达式的结果赋值给整数变量 `fahrenheit`。\n\n接下来的两条命令将字符串 *Fahrenheit value is:*\
  \ 输出到显示器，随后是 `fahrenheit` 的值——速度之快，用户几乎察觉不到这正在发生。\n\n最后三个语句提示用户按回车键，然后等待他操作。这是因为在某些系统中，程序显示结果并关闭控制框的速度快到你甚至没看到发生了什么。\n\
  \n![tip.eps](img/tip_fmt.png) 在许多系统中，你可以跳过这三行——Code::Blocks 会保持对话框打开——但这些行并没有坏处。\n\
  \n最后的 `return 0` 将控制权返回给操作系统。\n\n第 2 章\n\n# 经常声明变量\n\n在本章\n\n![arrow](img/arrow.png)\
  \ 声明变量\n![arrow](img/arrow.png) 声明不同类型的\n![arrow](img/arrow.png) 使用浮点变量\n![arrow](img/arrow.png)\
  \ 声明和使用其他类型\n\nC++ 中最基本的概念是`变量`——变量就像一个小盒子。你可以在里面存储东西以供以后使用，特别是数字。变量的概念借自数学。如下所示语句\n\
  \n```\nx = 1\n```\n\n将值 1 存储在变量 `x` 中。从该点开始，数学家可以使用变量 `x` 代替常量 1——直到他改变 `x` 的值。\n\
  \n变量在 C++ 中的工作方式相同。你可以进行赋值\n\n```\nx = 1;\n```\n\n从程序执行的该点开始，`x` 的值是 1，直到程序更改它的值。\n\
  \n## 声明变量\n\n数学家可能会写类似的内容：\n\n```\n(x + 2) = y / 2\nx + 4 = y\n```\n\n解 x 和 y\n\n\
  \n\n\n任何学过代数的读者都会立刻意识到，数学家引入了变量 `x` 和 `y`。但 C++ 并不那么聪明。（计算机可能很快，但它们很笨。）\n\n你必须在使用每个变量之前，先向\
  \ C++ 声明它。你必须说些像这样安抚人心的话：\n\n```\nint x;\nx = 10;\nint y;\ny = 5;\n```\n\n这些代码行\
  \ `declare`（声明）变量 `x` 存在、类型为 `int` 值为 10；并且类型为 `int` 的变量 `y` 也存在，值为 5。（下一节将讨论变量类型）。你可以在程序中（几乎）任何地方声明变量——只要你\
  \ `在使用变量之前先声明它` 即可。\n\n## 声明不同类型的变量\n\n如果你和数学关系不错（谁又不是如此呢？），你可能把数学中的变量看作一个无形状的盒子，能够容纳你选择存储其中的任何内容。你可以很容易地写出类似下面的代码：\n\
  \n```\nx = 1\nx = 2.3\nx = \"this is a sentence\"\n```\n\n唉，C++ 并没有那么灵活。（另一方面，C++\
  \ 可以做到人类做不到的事情，比如在一秒内加十亿个数字，所以我们不要太自以为是。）对 C++ 来说，有不同类型的变量，就像有不同类型的存储箱一样。有些存储箱非常小，只能处理单个数字。处理一个句子则需要一个较大的存储箱。\n\
  \n![tip.eps](img/tip_fmt.png) 一些计算机语言尝试努力更好地适应程序员，允许他们在同一个变量中放置不同类型的数据。这些语言被称为 `弱类型`（weakly\
  \ typed）语言。C++ 是一种 `强类型`（strongly typed）语言——它要求程序员具体地声明每个变量及其精确类型。\n\n变量类型 `int`\
  \ 是 C++ 中对应的 `integer`（整数）——一个没有小数部分的数字。（整数也称为 `counting numbers` 计数数字或 `whole numbers`\
  \ 整数。）\n\n整数对于大多数计算都是非常用的。我用整数度过了大部分的小学生活。直到我 11 岁左右，老师们才开始用分数来搅局。C++ 的情况也是如此：C++\
  \ 中超过 90% 的变量都被声明为 `int` 类型。\n\n遗憾的是，`int` 变量并不适用于所有问题。例如，如果你学习了第 [1] 章中的温度转换程序，你可能会注意到程序有一个潜在问题——它只能计算到最接近的度。不允许有任何度的分数。这种整数限制不会影响日常使用，因为除了气象学家之外，不太有人会因为几分之一度的误差而感到兴奋。然而，有很多情况并非如此——例如，你不希望在下一次飞机旅行中，因为导航舍入导致导致飞机跑道时差了半英里。\n\
  \n### 复习 C++ 中整数的局限性\n\n`int` 变量类型是 C++ 版本的整数。`int` 变量所遭受的局限性与其数学中对应的计数整数相同。\n\n\
  ### 整数舍入\n\n丢弃数字的小数部分被称为 `truncation`（截断）。考虑计算三个数平均值的问题。给定三个 `int` 变量——`nValue1`、`nValue2`\
  \ 和 `nValue3`，计算平均值的方程为：\n\n```\nint nAverage; int nValue1; int nValue2; int nValue3;\n\
  nAverage = (nValue1 + nValue2 + nValue3) / 3;\n```\n\n因为所有三个值都是整数，所以和假设是整数。给定值 1、2\
  \ 和 2，和为 5。将之除以 3，得到 1/3 或 1.666。C++ 使用了略有不同的规则：由于三个变量 `nValue1`、`nValue2` 和 `nValue3`\
  \ 都是整数，它们的和也被假设为整数。一个整数除以另一个整数的结果也是整数。因此，`nAverage` 的结果值是不合理但符合逻辑的 1。\n\n在以下数学等价的表述中，问题要严重得多：\n\
  \n```\nint nAverage; int nValue1; int nValue2; int nValue3;\nnAverage = nValue1/3\
  \ + nValue2/3 + nValue3/3;\n```\n\n代入相同的 1、2 和 2 值，`nAverage` 的结果是 0（真是太不合理了）。要看看这是如何发生的，考虑\
  \ 1/3 截断为 0，2/3 截断为 0，2/3 截断为 0。0、0 和 0 的和是 0。你可以看到整数截断可能是完全不可接受的。\n\n### 有限的范围\n\
  \n`int` 变量类型的第二个问题是其有限的范围。一个普通的 `int` 变量可以存储的最大值为 2,147,483,647，最小值为 –2,147,483,648——大约从正\
  \ 20 亿到负 20 亿，总范围约为 20 亿。\n\n### 解决截断问题\n\n虽然浮点变量可以解决许多计算问题（例如截断），但它们也有自己的局限性——这些与整数变量相关的局限性相反。浮点变量不能用于计数，对计算机来说处理起来困难，而且还会受到舍入误差（尽管程度远不如\
  \ *int* 变量）。\n\n\n\n\n在对计数重要的应用程序中，你不能使用浮点变量。这包括用于计数的 C++ 构造结构。C++ 无法验证一个给定的浮点数代表的是哪个整数值。\n\
  \n例如，对于我和来说，1.0 是 1 是显而易见的，但对 C++ 来说并不那么。。 0.9 或 1.1 呢？这些也应该被视为 1 吗？C++ 简单通过在涉及计数时强制要求使用\
  \ `int` 值来规避这个问题。\n\n### 计算速度\n\n从历史角度来看，计算机处理器处理整数算术的速度比处理浮点算术快。因此，虽然一个处理器在给定时间内可以相加\
  \ 100 万个整数，但同一台处理器在相同这段时间内可能只能执行 20 万次浮点数计算。\n\n随着微处理器速度的提高，计算速度正逐渐不再是一个问题。此外，如今的通用微处理器在板上集成了专门的浮点电路，以提高这些操作的性能。然而，对整数值进行算术运算仍然比对浮点值执行相同操作要简单得多、快得多。\n\
  \n### 精度丢失\n\n浮点 `float` 变量的精度约为 6 位数字，而被称为 `double` 的额外节省尺寸、双倍强的 `float` 可以处理大约\
  \ 13 位有效数字。这也会导致舍入问题。\n\n考虑 ¹⁄[3] 在连续序列中表示为 0.333 …。无限级数的概念在数学是有意义的，但对计算机没有意义，因为它具有有限的精度。`FloatAverage`\
  \ 程序输出 1, 2 和 2 的平均值为 1.66667 —— 这比 `IntAverage` 版本输出的 0 要好得多，但远没有无限序列。C++ 在很多情况下可以修正舍入误差。例如，在输出时，C++\
  \ 有时可以确定用户真正想要的是 1 而不是 0.999999。在其他情况下，即使是 C++ 也无法修正舍入误差。\n\n### 不有限的范围\n\n尽管 `double`\
  \ 数据类型的范围远大于整数，但它仍然有限限制。`int` 的最大值比 20 亿多一点。`double` 变量的最大值大约是 10 的 38 次方。那是 1 后面跟着\
  \ 38 个零；它把 20 亿当成早餐吃掉了。（至少在写本文时，它甚至比国债还要多。）\n\n![warning.eps](img/warning_fmt.png)\
  \ 只有 `double` 的前 13 位左右才有任何意义；剩余的 25 位是屈服于浮点舍入误差的噪声。\n\n## 声明变量类型\n\n到本章为止，我一直在宣扬变量必须声明，并且它们必须分配一个类型。幸运的是（哒哒！），C++\
  \ 提供了多种变量类型。请参见表 2-1 的变量列表、它们的优点和局限性。\n\n表 2-1 常见的 C++ 变量类型\n\n| 变量 | 定义常量 | 它是什么\
  \ |\n| :--- | :--- | :--- |\n| `int` | `1` | 简单的计数数字，正数或负数。 |\n| `short int` | `---`\
  \ | `int` 的一个可能更小的版本。它使用的内存较少，但范围较小。 |\n| `long int` | `10L` | `int` 的一个可能更大的版本。在\
  \ gcc 中，`long` 和 `int` 没有区别。 |\n| `long long int` | `10LL` | `int` 的一个可能更大的版本。 |\n\
  | `float` | `1.0F` | 单精度实数。这个较小版本比 `double` 占用的内存少，但精度较低且范围较小。 |\n| `double` | `1.0`\
  \ | 标准浮点变量。 |\n| `long double` | `---` | 一个可能更大的浮点数。在 PC 上，`long double` 用于 80x86\
  \ 浮点处理器的原生尺寸，即 80 位。 |\n| `char` | `‘c’` | 单个 `char` 变量存储单个字母或数字字符。不适用于算术运算。 |\n\
  || `wchar_t` | `L'c'` | 一种较大的字符，能够存储如中文等较大字符集的符号。 |\n| `char string` | `“this is\
  \ a string”` | 字符字符串形成一个句子或短语。 |\n| `bool` | `true` | 另一个值是 `false`。不，我的意思是，它是*真的*假的。逻辑上的\
  \ `false`。不是指虚假的或替代品的或…… 没了。 |\n\n![c++11_fmt.eps](img/c11_fmt.png) `long long int`\
  \ 和 `long double` 是随 C++11 正式引入的。\n\n整数类型有有符号和无符号两个版本。有符号始终是默认的（除 `char` 和 `wchar_t`\
  \ 外的所有类型）。无符号版本通过在声明类型前添加 `unsigned` 关键字创建。无符号常量在它们的类型标记中包含 `U` 或 `u`。因此，以下代码声明了一个\
  \ `unsigned int` 变量并为其赋值为值 10：\n\n```cpp\nunsigned int uVariable;\nuVariable = 10U;\n\
  ```\n\n以下语句将两个变量 `lVariable1` 和 `lVariable2` 声明为 `long int` 类型并设置为值 1，而 `dVariable`\
  \ 是一个被设置为 1.0 的 double。注意在声明 `lVariable2` 时，`int` 是被假设的可以省略：\n\n```cpp\n// 声明两个\
  \ long int 变量并将它们设置为 1\nlong int lVariable1\nlong lVariable2;     // 假设 int\nlVariable1\
  \ = lVariable2 = 1;\n\n// 声明一个 double 类型的变量并设置为 1.0\ndouble dVariable; dVariable\
  \ = 1.0;\n```\n\n![tip.eps](img/tip_fmt.png) 你可以在同一语句中声明变量并初始化它：\n\n```cpp\nint\
  \ nVariable = 1;  // 声明一个变量并\n                     // 将初始化为 1\n```\n\n`char` 变量可以包含单个字符；字符字符串（虽然不是真正的变量类型，但对于大多数用途来说它的工作方式像变量）持有字符字符串。因此，`‘C’`\
  \ 是一个包含字符的 `char`，而 `“C”` 是一个字符串。类比是，`‘C’` 是手中的钉子，而 `“C”` 是弹夹里的钉子。（9 详细描述了字符串。）\n\
  \n![warning.eps](img/warning_fmt.png) 如果应用程序需要字符串，你必须提供一个，即使字符串只包含一个字符。\n\n### 常量类型\n\
  \n`常量值` 是不改变的数字或字符（例如 1、0.5 或 ‘c’）。与变量一样，每个常量都有一个类型。在如 `n = 1;` 的表达式中，常量 1 是一个 `int.`。要让\
  \ 1 成为 `long` 整数，写语句 `n = 1L;`。类比如下：1 代表装有一个球的皮卡车，而 `1L` 是同样装有一个球的倾倒车。两种情况下球的数量相同，但其中一个容器的容量大得多。\n\
  \n遵循 `int` 到 `long` 的比较，1.0 代表值 1 但在浮点容器中。然而注意，浮点常量的默认类型是 `double.`。因此，1.0 是一个 `double`\
  \ 数字而不是 `float.`。\n\n你可以使用大写或小写字母表示特殊常量。因此，10UL 和 10ul 都是无符号长整数。\n\n常量值 `true` 和\
  \ `false` 的类型是 `bool.`。根据 C++ 对大小写的敏感性，`true` 是一个常量而 `TRUE` 没有意义。\n\n变量可以在创建时通过\
  \ `const:` 关键字声明为常量：\n\n```cpp\nconst double PI = 3.14159; // 声明一个常量变量\n```\n\n\
  `const` 变量在声明时必须初始化，且其值不能被任何后续语句更改。\n\n![tip.eps](img/tip_fmt.png) 声明为 `const` 的变量不需要全大写命名，但按照惯例它们通常是这样的。这只是给读者的提示，这个所谓的变量实际上并不是。\n\
  \n\n\n我承认，声明一个变量然后说它不能改变似乎很奇怪。为什么要大费周章呢？很大程度上是因为命名良好的 `const` 变量可以使程序变得更容易理解。考虑以下两个等价的表达式：\n\
  \n```\ndouble dC = 6.28318 * dR;  // 这是什么意思？\ndouble dCircumference = TWO_PI * dRadius;\
  \ // 这容易理解得多\n```\n\n对于这段代码的读者来说，第二个表达式将某个物体的半径乘以 2π 来计算周长，这应该要清晰得多。\n\n### 数值类型的范围\n\
  \n这看起来可能很奇怪，但 C++ 标准并没有具体说明每种数据类型可以容纳多大的数字。标准只提到了每种数据类型的相对大小。例如，它说 `long int` 的最大值至少与\
  \ `int` 的最大值一样。\n\nC++ 的作者们并不是故故神秘。他们只是想允许编译器为基础机器实现可能最快的代码。该标准的设计是为了适用于运行不同操作系统的所有不同处理器。\n\
  \n然而，了解你特定实现中的限制是有用的。表 2-2 显示了使用 Code::Blocks/gcc 编译器的 Windows PC 上每种数字类型的大小。\n\n\
  ![0202](img/9781118823774-tbl0202_fmt.png)\n\n尝试计算超出其类型范围的数字被称为 `overflow`（溢出）。C++\
  \ 标准通常将溢出的结果留为未定义。这是 C++ 定义者保持灵活性的另一种方式。\n\n![tip.eps](img/tip_fmt.png) 在 PC 上，浮点溢出会导致异常，如果不进行处理，它将导致你的程序崩溃。（我直到第\
  \ 24 章节之后才讨论异常。）尽管这听起来很糟糕，但整数溢出更糟——C++ 会静默地生成一个错误值而不产生任何抱怨。\n\n### 特殊字符\n\n你可以在\
  \ `char` 或 `string` 变量中存储任何你可打印字符。你还可以存储一组用作字符常量的不可打印字符。请参见表 2-3 对这些重要的不可打印字符的描述。\n\
  \n表 2-3 特殊字符\n\n| 字符常量 | 它是什么 |\n| :--- | :--- |\n| `'\\n'` | 换行 |\n| `'\\t'` |\
  \ 制表符 |\n| `'\\040'` | 进制值为 40 的字符（关于数字系统的讨论请参见第 4 章节） |\n| `'\\x20'` | 十进制值为 20\
  \ 的字符（这与 `'\\040'` 相同） |\n| `'\\0'` | 空字符（即值为 0 的字符） |\n| `'\\\\'` | 反斜杠 |\n\n你已经见过过字符串末尾的换行字符了。这个字符会中断字符串并将部分放在不同的行上。换行字符可能出现在字符串的任何位置。例如：\n\
  \n```\n\"This is line 1\\nThis is line 2\"\n```\n\n在输出上显示为：\n\n```\nThis is line\
  \ 1\nThis is line 2\n```\n\n同样，`\\t` 制表符会将输出移动到下一个制表符位置。（此位置可能变化，取决于你运行程序的计算机类型。）\n\
  \n数值形式允许你指定任何你喜欢的非打印字符，但结果可能有所不同。例如，由 `0xFB` 表示的字符取决于字体和字符集（甚至可能不是一个合法字符）。\n\n由于反斜杠字符用于表示特殊字符，因此反斜杠本身需要一个字符对。字符对\
  \ `\\\\` 代表反斜杠。\n\n### 字符高速道上的宽负载载荷\n\n标准的 `char` 变量仅有 1 字节宽，只能处理 255 个不同的字符。这对于欧洲语言来说足够了，但不足以处理如汉字等基于符号的语言。\n\
  \n出现了几种标准来扩展字符集以满足这些语言的需求。UTF-8 使用 8 位、16 位和 32 位字符的混合来实现你可以想象到的几乎每个汉字或象形文字，但仍与简单的\
  \ 8 位 ASCII 兼容。UTF-16 使用 16 位和 32 位字符的混合来实现扩展字符集，而 UTF-32 对所有字符使用 32 位。\n\n![tip.eps](img/tip_fmt.png)\
  \ UTF 代表 Unicode 转换格式（Unicode Transformation Format），由此获得了常见的昵称 Unicode。\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 表 2-4 描述了 C++ 支持的不同字符类型。起初，C++ 试图用一个模糊定义的宽字符类型 `wchar_t` 来应付。这种类型旨在作为应用程序环境中原生的宽字符类型。C++11\
  \ 为 UTF-16 和 UTF-32 引入了特定类型。\n\n表 2-4 C++ 字符类型\n\n| 变量 | 示例 | 它是什么 |\n| :--- | :---\
  \ | :--- |\n| `char` | `'c'` | ASCII 或 UTF-8 字符 |\n| `wchar_t` | `L'c'` | 宽格式字符\
  \ |\n| `char_16t` | `u'c'` | UTF-16 字符 |\n| `char_32t` | `U'c'` | UTF-32 字符 |\n\n\
  ![tip.eps](img/tip_fmt.png) UTF-16 是 Windows 应用的标准编码。在 Code::Blocks/gcc 编译器中，`wchar_t`\
  \ 类型指的是 UTF-16。\n\n表 2-4 中的任何字符类型都可以组合成字符串：\n\n```\nwchar_t* wideString = L\"this\
  \ is a wide string\";\n```\n\n（现在忽略星号。我将在第 8 章节中关于它的含义说明很多内容。）\n\n### 这些是逻辑吗？\n\n\
  C++ 提供了一个名为 `bool` 的逻辑变量。`bool` 类型源于布尔（Boole），逻辑发明的者的姓氏。布尔值。\n\n![tip.eps](img/tip_fmt.png)\
  \ 逻辑变量有两个值：`true` 和 `false`。\n\n### 混合表达式\n\nC++ 允许在单个表达式中混合类型。也就是说，你被允许将整数与 `double`\
  \ 相加。在以下表达式中，例如，`n1` 允许是 `int`：\n\n```cpp\nint n1 = 1;\nn1 + 1.0\n```\n\n操作数类型不相同的表达式被称为\
  \ `混合表达式`。混合表达式生成的类型等于两者中能力更强的。在这种情况下，`n1` 被转换为 `double`。同样，一种类型的表达式可以赋值给不同类型的变量，如下所示：\n\
  \n```cpp\n// 在下面的赋值中，dVariable 的整数部分\n// 被存入 nVariable\ndouble dVariable = 1.0;\n\
  int nVariable;\nnVariable = dVariable;\n```\n\n![warning.eps](img/warning_fmt.png)\
  \ 如果赋值左侧的变量小，可能会丢失精度或范围。在前面的示例中，C++ 在将值存入 `nVariable` 之前截断了 `dVariable` 的值。\n\n\
  将较大的值类型转换为较小的值类型被称为 `demotion`（降级），而在相反方向转换值被称为 `promotion`（提升）。程序员说，`int` 变量 `nVariable1`\
  \ 在如下表达式中提升为 `double`：\n\n```cpp\nint nVariable1 = 1;\ndouble dVariable = nVariable1;\n\
  ```\n\n![tip.eps](img/tip_fmt.png) 混合表达式不是好主意。避免强制 C++ 为你进行转换。\n\n### 自动声明\n\n![c++11_fmt.eps](img/c11_fmt.png)\
  \ 如果你非常懒惰，可以让 C++ 为你确定变量的类型。考虑以下声明：\n\n```cpp\nint nVar = 1;\n```\n\n你可能会问，“为什么\
  \ C++ 不能推断出 `nVar` 的类型？”答案是，如果你礼貌地请求，它可以做到，如下：\n\n```cpp\nauto var1 = 1;\nauto var2\
  \ = 2.0;\n```\n\n\n\n这句话是：“将 `var1` 声明为与常量值 1（恰好是一个 `int`）相同类型的变量，并将 `var2` 声明为与\
  \ 2.0 相同的类型（这是一个 `double`）。”\n\n![warning.eps](img/warning_fmt.png) 我认为 `auto` 这个词对于这个目的来说是一个特别不幸的选择，因为在\
  \ C++ ’11 之前，`auto` 关键字具有完全不同的含义。然而，`auto` 已经至少 20 年没有被使用了，因此标准制定者认为夺用这个术语是安全的。请注意，如果你在某些旧代码中看到\
  \ `auto` 关键字，你需要将其移除。\n\n![c++11_fmt.eps](img/c11_fmt.png) 你也可以使用 `decltype()` 关键字告诉\
  \ C++ 你想将一个变量声明为与另一个变量相同的类型，无论该类型是什么。\n\n```cpp\nint var1;\n\ndecltype(var1) var2;\
  \ // 将 var2 声明为与\n                       // var1 相同的类型\n```\n\nC++ 将 `decltype(var1)`\
  \ 替换为 `var1` 的类型，再次是一个 `int`。\n\n# 第 3 章\n\n# 执行数学运算\n\n### 本章内容\n\n* ![arrow](img/arrow.png)\
  \ 在 C++ 中定义数学运算符\n* ![arrow](img/arrow.png) 使用 C++ 数学运算符\n* ![arrow](img/arrow.png)\
  \ 识别表达式\n* ![arrow](img/arrow.png) 使用特殊的数学运算符提高清晰度\n\nC++ 提供了常用的算术运算：C++ 程序可以进行乘、加、除等。程序必须能够执行这些操作才能完成任务。如果一个医疗保险程序无法计算你应该支付（多付）多少钱，它有什么用呢？\n\
  \nC++ 运算看起来就像你在纸上进行的算术运算，不同之处在于你必须在使用任何变量之前对其进行声明（在第 2 章详细介绍）：\n\n```cpp\nint var1;\n\
  \nint var2 = 1;\n\nvar1 = 2 * var2;\n```\n\n这段代码段声明了两个变量 `var1` 和 `var2`。它将 `var2`\
  \ 初始化为 1，然后将 2 乘以 `var2` 值的结果存储在 `var1` 中。\n\n本章介绍了完整的 C++ 数学运算符。\n\n## 执行简单的二元算术\n\
  \n`二元运算符`是有两个参数的运算符。如果你可以说 `var1 op var2`，那么 `op` 必须是一个二元运算符。常见的二元运算符是你在小学进行过的简单操作。二元运算符在表\
  \ 3-1 中标记。（此表还包括一元运算符，我将在本章稍后描述它们。）\n\n### 表 3-1 按优先级排序的数学运算符\n\n| 优先级 | 运算符 | 含义\
  \ |\n| :--- | :--- | :--- |\n| 1 | `+` (一元) | 实际上什么都不做 |\n| 1 | `-` (一元) | 返回参数的负值\
  \ |\n| 2 | `++` (一元) | 递增 |\n| 2 | `--` (一元) | 递减 |\n| 3 | `*` (二元) | 乘法 |\n| 3\
  \ | `/` (二元) | 除法 |\n| 3 | `%` (二元) | 取模 |\n| 4 | `+` (二元) | 加法 |\n| 4 | `-` (二元)\
  \ | 减法 |\n| 5 | `=`, `*=`, `%=`, `+=`, `-=` (特殊) | 赋值类型 |\n\n乘、除、模、减是用于执行算术运算的运算符。在实践中，它们的工作与熟悉的算术运算完全一样。例如，对浮点数\
  \ `double` 变量使用二元除法运算符所示：\n\n```cpp\ndouble var = 133.0 / 10.0;\n```\n\n![warning.eps](img/warning_fmt.png)\
  \ 表达式 `133/10` 执行的是整数除，产生 `int` 结果 13，而不是浮点数 13.3。\n\n每个二元运算符都有你在小学学习过的惯用含义——但有一个例外。你可能在学习中没有遇到过取模。`modulus`\
  \ 运算符 `%` 的工作与除法相似，但它产生除法*之后*的余数而不是商。例如，14 除以 4 是三次，余数为 2。因此我们说 14 模 4 等于 2：\n\n\
  ```cpp\nint var = 14 % 4; // var 被设置为 2\n```\n\n浮点数变量未定义取模。（我在第 2 章中讨论了舍入误差。）\n\n\
  ## 分解表达式\n\nC++ 中常见的语句类型是表达式。`表达式`是一个带有值的 C++ 语句。每个表达式都有一个类型，例如 `int`、`double` 或\
  \ `char`。涉及任何数学运算符的语句都是表达式，因为所有这些运算符都返回一个值。例如，`1 + 2` 是一个表达式，其值为 3，类型为 `int`。（记住，没有小数点的常量类型为\
  \ `int`。）\n\n表达式可以是复杂的，也可以是极其简单的。事实上，语句 `1` 是一个表达式，因为它有一个值 (1) 和一个类型 (`const int`)。以下语句包含六表达式：\n\
  \n```cpp\nz = x * y + w;\n```\n\n表达式是：\n* `x`\n* `y`\n* `w`\n* `x * y`\n* `x * y\
  \ + w`\n* `z = x * y + w`\n\n## 确定运算顺序\n\n所有运算符都执行某些定义的函数。此外，每个运算符都有`优先级`——即评估表达式的顺序。例如，考虑优先级如何影响解决以下问题：\n\
  \n```cpp\nint var = 2 * 3 + 1;\n```\n\n如果在执行乘法之前执行加法，表达式的值为 2 乘以 4，即 8。如果先执行乘法，值就是\
  \ 6 加上 1，即 7。\n\n运算符的优先级决定了谁先执行。表 3-1 显示乘法优先级高于加法，所以结果是 7。那么当相同优先级的运算符出现在同一个表达式中时会发生什么？例如：\n\
  \n```cpp\nint var = 8 / 4 / 2;\n```\n\n当相同优先级的运算符出现时，它们从左到右计算。因此，在这个代码中 `var` 等于\
  \ 2。\n\n表达式\n\n```cpp\nx / 100 + 32\n```\n\n将 `x` 除以 100 再加 32。但如果程序员想让 `x` 除以 (100\
  \ 加 32) 呢？程序员可以通过括号来改变优先级：\n\n```cpp\nx / (100 + 32)\n```\n\n这个表达式的效果是将 `x` 除以 132。\n\
  \n## 执行一元运算\n\n算术二元运算符（接受两个参数的运算符）我们很多人学校时代都很熟悉。但考虑一下一元运算符，它们只需要单个参数（例如 `a`）。许多一元运算并不为人熟悉。\n\
  \n一元数学运算符有加、减、加、减（分别为 `+`、`-`、`++` 和 `--`）。减运算符改变参数的符号。正数变成负数，反之亦然。加运算符不改变参数的符号。加运算符很少使用。\n\
  \n```cpp\nint var1 = 10;\nint var2 = -var1; // var2 现在是 -10\n```\n\n后者表达式使用减一元运算符\
  \ (`-`) 计算负 10 的值。\n\n`++` 和 `--` 运算符对你来说可能是新的。这些运算符（分别）将其参数加一或从其参数减一，因此它们被称为（分别称为）递增运算符和递减运算符。由于它们依赖于可以计数的数字，因此它们限于非浮点变量。例如，执行以下表达式后\
  \ `var` 的值为 11：\n\n```cpp\nint var = 10; // 初始化 var\nvar++; // 现在将其增加\n// var 的值现在是\
  \ 11\n```\n\n递增和递减运算符的特殊之处在于它们都有两种：*前缀*版本和*后缀*版本（分别称为前增和后增）。例如，考虑递增运算符（递减运算符的方法相同）。\n\
  \n\n\n假设变量 `n` 的值为 5。`++n` 和 `n++` 都会将 `n` 递增到 6。两者之间的区别在于：`++n` 的值是递增后的值（6），而 `n++`\
  \ 的值是递增之前的值（5）。下面的示例说明了这种差异：\n\n```cpp\n// 声明三个整数变量\nint n1, n2, n3;\nn1 = 5;\n\
  n2 = ++n1; // n1 和 n2 的值现在都是 6\nn1 = 5;\nn3 = n1++; // n1 的值为 6，但 n3 的值为 5\n```\n\
  \n因此，`n2` 得到的是 `n1` 递增后（使用前置递增运算符）的值，而 `n3` 得到的是 `n1` 使用后置递增运算符递增之前的值。\n\n## 使用赋值运算符\n\
  \n*赋值运算符*是一个改变其左侧操作数值的二元运算符。等号（`=`）作为一种简单的赋值运算符，在任何编程语言中都是必不可缺的。该运算符将右侧操作数的值放入左侧操作数中。其他的赋值运算符足够奇特，以至于像是某人的随性而为。\n\
  \n那么以下情况呢：\n\n```cpp\nint var1;\nint var2 = 2;\nvar1 = var2 = 1;\n```\n\n如果我们使用从左到右的规则，`var1`\
  \ 的最终值为 2 而 `var2` 值为 1，这是违背直觉的。为了避免这种情况，多个赋值运算符从右到左求值。因此，该代码段将值 1 赋值给 `var2`，然后将相同的值复制到\
  \ `var1`。\n\nC 的创建者（C++ 起源于此）注意到赋值通常遵循以下形式：\n\n`变量 = 变量 # 常数`\n\n其中 `#` 是某个二元运算符。因此，为了让一个整数运算符加\
  \ 2，程序员可能会写：\n\n```cpp\nnVariable = nVariable + 2;\n```\n\n这个表达式的意思是：“将 `nVariable`\
  \ 的值加 2，并将结果存回 `nVariable`。”这样做会让 `nVariable` 的值在原有增加 2。\n\n由于同一个变量出现在 `=` 符号的双方，C\
  \ 革命的这些教父们决定创建一个带有一个二元运算符的赋值运算符版本。这实际上是在说：“你对一个变量执行任何操作，并将结果直接存回该变量中。”\n\n每个二元运算符都有对应的这种巧妙的*赋值版本*。因此，上面给出的赋值可以这样写：\n\
  \n```cpp\nnVariable = nVariable + 2;\nnVariable += 2;\n```\n\n在这里，第一行说（现在说得非常明确）：“取\
  \ `nVariable` 的值，加 2，并将结果存回 `nVariable`。”下一行说（稍微有点突兀点）：“给 `nVariable` 的值加 2。”\n\n\
  ![tip.eps](img/tip_fmt.png) 除了赋值本身，这些赋值运算符并不经常使用。然而，尽管它们看起来可能很奇怪，但有时它们实际上可以使生成的程序更易读。\n\
  \n# 第 4 章：执行逻辑操作\n\n### 本章内容\n\n- ![arrow](img/arrow.png) 使用有时不符合逻辑的逻辑运算符\n- ![arrow](img/arrow.png)\
  \ 定义逻辑变量\n- ![arrow](img/arrow.png) 逻辑地使用位逻辑运算符进行操作，逐位处理\n\nC++ 中常见的语句是表达式。大多数表达式都涉及算术运算符，如加法（`+`）、减法（`–`）和乘法（`*`），正如第\
  \ 3 章所示。\n\n本章介绍了另一类运算符，逻辑运算符。与算术运算符相比，大多数人并不会过多考虑这类操作。并不是人们不处理 AND（与）和 OR（或）这样的逻辑操作——我们经常在计算它们。除非碗里有谷物且碗里有牛奶且谷物表面涂有糖层（很多糖），否则我不会吃麦片。如果威士忌是单一麦芽且有人替我买单，我会喝一杯。人们一直使用这样的逻辑操作，但他们不会将它们写成机器指令（或不以这种方式思考它们）。\n\
  \n逻辑运算符分为两类。AND 和 OR 运算符是我所说的简单逻辑运算符。第二类逻辑运算符是位运算符。人们在日常事务中完全不使用位运算符；它是计算机世界特有的。我们本章将从简单的开始，逐渐过渡到位运算符。\n\
  \n## 为什么要折腾逻辑操作？\n\nC++ 程序必须做出决策。一个不能做出决策的程序用途有限。第 1 章中列出的温度转换程序在没有某种决策机制的情况下已经尽可能复杂了。计算机程序不可避免地会遇到诸如下的情况：“如果变量\
  \ `a` 小于某个值，则执行*此*操作；如果不是，则执行*另一个*操作。”决策的能力让计算机看起来很智能。（同样，这一属性让计算机看起来很智能。）\n\n##\
  \ 使用简单运算符\n\n表 1 所示的简单逻辑运算符求值结果 `true`（真）或 `false`（假）。\n\n### 表 4-1 简单运算符\n\n| 运算符\
  \ | 作用 |\n| :--- | :--- |\n| `==` | 等于；如果左侧操作数与右侧相同，则为 `true` |\n| `!=` | 不等于；等等的反面\
  \ |\n| `>` | 大于；如果左侧操作数大于右侧，则为 `true` |\n| `<` | 小于；如果左侧操作数小于右侧，则为 `true` |\n| `>=`\
  \ | 大于等于或小于等于；如果左侧操作数大于或等于右侧，则为 `true` |\n| `&&` | 与；如果左、右侧操作数均为 `true`，则为 `true`\
  \ |\n| `\\|\\|` | 或；如果左侧或右侧操作数之一为 `true`，则为 `true` |\n| `!` | 非；如果操作数为 `false`，则为\
  \ `true`；否则为 `false` |\n\n相等运算符用于比较两个数字。例如，如果 `n` 为 0，则如下为 `true`：\n\n```cpp\nn\
  \ == 0;\n```\n\n![warning.eps](img/warning_fmt.png) 外表具有欺骗性。不要混淆相等运算符（`==`）和赋值运算符（`=`）。这不仅是一个常见的错误，而且是\
  \ C++ 编译器通常无法捕捉的错误——以下代码并没有初始化 `n` 为 0；它将 `n` 的当前值与 0 进行比较，并没有任何操作：\n\n```cpp\n\
  n == 0; // 程序员想说的是 n = 0\n```\n\n大于（`>`）和小于（`<`）运算符在日常生活中同样常见。下面的逻辑比较为 `true`：\n\
  \n```cpp\nint n1 = 1;\nint n2 = 2;\nn1 < n2;\n```\n\n大于等于运算符（`>=`）和小于等于运算符（`<=`）与小于、大于运算符相似，但有一个主要区别：它们包含了相等的情况；而其他运算符不包含。\n\
  \n `&&`（与）和 `||`（或）与其他逻辑运算符结合，构建更复杂的逻辑表达式，如下：\n\n```cpp\n// 如果 n2 大于 n1 且\n// n2\
  \ 小于 n3，则结果为 true\n// （这是判断 n2 是否在\n// n1 到 n3 范围内（不包含端点）的最常用方法）\n(n1 < n2) && (n2\
  \ < n3);\n```\n\n### 存储逻辑值\n\n逻辑操作的结果可以赋值给 `bool` 类型的变量。`bool` 一术是指布尔代数，即逻辑代数。这是由\
  \ 19 世纪一位英国数学家乔治·布尔（George Boole）发明的。\n\n```cpp\nint n1 = 1;\nint n2 = 2;\nbool\
  \ b;\nb = (n1 == n2);\n```\n\n这个表达式突显了赋值运算符 `=` 和比较运算符 `==` 之间的区别。表达式的意思是：“比较变量\
  \ `n1` 和 `n2`。将比较结果存入变量 `b` 中。”\n\n\n\n\n以下 `BoolTest` 程序演示了 `bool` 变量的用法：\n\n```cpp\n\
  // BoolTest - 比较从键盘输入的变量\n//            并将结果存储在\n//            逻辑变量中\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 设置 bool 变量的输出格式\n    // 使用 true 和 false\
  \ 而不是\n    // 1 和 0\n    cout.setf(cout.boolalpha);\n    // 输入两个值\n    int nArg1;\n\
  \    cout << \"Input value 1: \";\n    cin >> nArg1;\n    int nArg2;\n    cout <<\
  \ \"Input value 2: \";\n    cin >> nArg2;\n    // 比较两个变量并存储结果\n    bool b;\n   \
  \ b = nArg1 == nArg2;\n    cout << \"The statement, \" << nArg1\n         << \"\
  \ equals \"          << nArg2\n         << \" is \"            << b\n         <<\
  \ endl;\n    // 在程序结束前等待用户准备好\n    // 以允许用户看到程序结果\n    cout << \"Press Enter to\
  \ continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return\
  \ 0;\n}\n```\n\n第一行 `cout.setf()` 确保了我们的 `bool` 变量 `b` 输出为“true”或“false”。接下来的部分解释了为什么这是必要的。\n\
  \n程序从键盘输入两个值，并显示等值比较的结果：\n\nInput value 1: 5\nInput value 2: 5\nThe statement, 5\
  \ equals 5 is true\nPress Enter to continue...\n\n![tip.eps](img/tip_fmt.png) 特殊值\
  \ `endl` 插入一个换行符。`endl` 值与字符 `\\n` 之间的差异（如第 2 章中所述）是微妙的，并在第 23 章中进行了解释。\n\n### 使用逻辑\
  \ int 变量\n\nC++ 并不是一直都有 `bool` 类型变量。在旧时代（当相机仍使用实际胶片时），C++ 使用 `int` 变量来存储逻辑值。值 0\
  \ 被视为 `false`，所有其他值均视为 `true`。同样，逻辑运算符为 `false` 生成 0，为 `true` 生成 1。（因此，`10 < 5`\
  \ 返回 0，而 `10 > 5` 返回 1。）\n\nC++ 保留了 `bool` 和 `int` 之间高程度的兼容性，以支持较旧的程序。如果你移除 `cout.setf(cout.boolalpha):`\
  \ 这一行，`BitTest` 程序将产生完全不同的输出：\n\nInput value 1: 5\nInput value 2: 5\nThe statement,\
  \ 5 equals 5 is 1\nPress Enter to continue...\n\n`int` 和 `bool` 类型的变量也可以在表达式中混合。例如，C++\
  \ 允许以下荒谬的语句而面不改色：\n\n```cpp\nint n;\nn = (nArg1 == nArg2) * 5;\n```\n\n这如果 `nArg1`\
  \ 和 `nArg2` 相等，将 `n` 设置为 5，否则设置为 0。\n\n### 在浮点变量上执行逻辑操作时要小心\n\n浮点计算中的舍入误差会对逻辑操作造成混乱。考虑以下示例：\n\
  \n```cpp\nfloat f1 = 10.0;\nfloat f2 = f1 / 3;\nbool b1 = (f1 == (f2 * 3.0)); //\
  \ 这两个相等吗？\n```\n\n尽管我们显然看出 `f1` 等于 `f2` 乘以 3，但 `b1` 的结果并不一定为 true。浮点变量无法持有无限数量有效数字。因此，`f2`\
  \ 并不等于我们所谓的“三又三分”，而是等于在若干位后停止的 3.333……\n\n![remember.eps](img/remember_fmt.png)\
  \ `float` 变量支持大约 7 位的精度，而 `double` 支持 16 位。我用“大约”和“稍微”是因为由于浮点计算的变数性，计算机可能会生成类似 3.333347\
  \ 的数字。现在，在纯数学中，小数点后的 3 是无限的，但没有制造出来的计算机可以处理无限数量的数字。因此，在将 3.333 乘以 3 之后，你得到的是 9.999，而不是乘以“三又三分”时得到的\
  \ 10 —— 实际上就是舍入误差。这种微小的差异对人类来说可能察觉不到，但对计算机却如此。相等意味着精确——现代处理器在执行此类计算时是非常复杂的。处理器可能会实际适应舍入误差，但在\
  \ C++ 内部，你无法精确预测任何处理器会做什么。更安全的比较方法如下：\n\n```cpp\nfloat f1 = 10.0;\nfloat f2 = f1\
  \ / 3;\nfloat f3 = f2 * 3.0;\nfloat delta = f1 - f3;\nbool bEqual = -0.0001 < delta;\n\
  ```\n\n如果 `f1` 和 `f3` 在 `delta` 范围内，则该比较为真。\n\n#### 短路求值\n\nC++ 的 `&&` 和 `||` 运算符执行的是被称为短路求值的操作。考虑以下情况：\n\
  \n```cpp\nint n1 = 0;\nint n2 = 0;\nbool b = n1++ && (n2++);\n```\n\n无论 `n1` 的值如何，`n2++`\
  \ 都不会被执行，因为如果 `n1` 为假，整个表达式的结果已经确定。再考虑以下情况：\n\n```cpp\nint n1 = 1;\nint n2 = 0;\n\
  bool b = n1++ || (n2++);\n```\n\n如果 `n1` 为真，则 `n2++` 也不会被执行，因为整个表达式的结果已经确定。\n\n\
  ![tip.eps](img/tip_fmt.png) 短路求值意味着 `n2++` 不会被执行，即使 `n1` 为真。考虑以下代码片段：\n\n```cpp\n\
  int n1 = 0;\nint n2 = 0;\nbool b = n1++ && (n2++);\n```\n\n无论 `n1` 的值如何，`n2++` 都不可能被执行。再考虑以下情况：\n\
  \n```cpp\nint n1 = 1;\nint n2 = 0;\nbool b = n1++ || (n2++);\n```\n\n如果 `n1` 为真，则\
  \ `n2++` 也不会被执行。\n\n#### 位运算符\n\nC++ 了一了一组位运算符用于此目的。这些运算符按位进行操作：\n\n```cpp\nint\
  \ a = 0b00001010; // 10\nint b = 0b00000110; // 6\nint c = a | b;      // 00001110\
  \ (14)\nint d = a & b;      // 00000010 (2)\nint e = a ^ b;      // 00001100 (12)\n\
  int f = a << 2;     // 00010100 (20)\nint g = a >> 1;     // 00000101 (5)\n```\n\
  \n这些运算符按位进行操作：\n\n-   `|` 按位或运算符：如果两个操作数的对应位有一个为 1，则结果位为 1。\n-   `&` 按位与运算符：只有当两个操作数的对应位都为\
  \ 1 时，结果位才为 1。\n-   `^` 按位异或运算符：如果两个操作数的对应位不同，则结果位为 1。\n-   `<<` 左移运算符：将操作数的位向左移动指定的位数，右侧补\
  \ 0。\n-   `>>` 右移运算符：将操作数的位向右移动指定的位数，左侧取决于符号位（对于有符号类型）。\n\n![remember.eps](img/remember_fmt.png)\
  \ 这些运算符按位进行操作。\n\n## 二进制数\n\nC++ 变量内部存储为二进制数。二进制数是 0 和 1 的序列，被称为位。通常，你不需要处理表示数的位。\n\
  \n```cpp\nint a = 0b00001010; // 10\nint b = 0b00000110; // 6\nint c = a | b;  \
  \    // 00001110 (14)\nint d = a & b;      // 00000010 (2)\nint e = a ^ b;     \
  \ // 00001100 (12)\nint f = a << 2;     // 00010100 (20)\nint g = a >> 1;     //\
  \ 00000101 (5)\n```\n\n![technical.eps](img/remember_fmt.png) 有时，处理位是非常实用且方便的——所以\
  \ C++ 提供了一组运算符用于此目的。\n\n### 进制法\n\nC++ 支持不同的前缀来表示二进制、八进制和十六进制数：\n\n```cpp\nint a\
  \ = 10;      // 十进制 10\nint b = 0b1010;  // 二进制 10\nint c = 012;     // 八进制 10\n\
  int d = 0xA;     // 十六进制 10\n```\n\n-   `0b` 前缀表示二进制数。\n-   `0` 前缀表示八进制数。\n-   `0x`\
  \ 前缀表示十六进制数。\n\n注意：在 C++14 之前，`0b` 前缀不是标准的。\n\n```cpp\nint a = 10;      // 十进制 10\n\
  int b = 0b1010;  // 二进制 10\nint c = 012;     // 八进制 10\nint d = 0xA;     // 十六进制\
  \ 10\n```\n\n\n\n\n\n如果我们的计数方案是由狗发明的，它很可能基于 `8`（每只爪子上的一位数字在腿后部是看不见的）。在数学上，这样一个`八进制`系统同样运行良好：\n\
  \n`123[10] = 1 * 8² + 7 * 8¹ + 3 * 8⁰ = 173[8]`\n\n这里的数字 `10` 和 `8` 指的是计数系统，`10`\
  \ 代表十进制（底数为 10），`8` 代表八进制（底数为 8）。计数系统可以使用任何正整数基数。\n\n### 二进制计数系统\n\n计算机本质上只有两个手指。（也许这就是为什么计算机如此愚蠢：没有了相反的大拇指，它们什么也抓不住。不过话又回来，也许不是。）计算机倾向于使用底\
  \ `2` 计数。数字 `123[10]` 的表达方式如下：\n\n`123[10] = 0*2⁷ + 1*2⁶ + 1*2⁵ + 1*2⁴ + 1*2³ +\
  \ 0*2² + 1*2¹ + 1*2⁰`\n`123[10] = 0*128 + 1*64 + 1*32 + 1*16 + 1*8 + 0*4 + 1*2 +\
  \ 1*1`\n`= 01111011[2]`\n\n计算机习惯使用 4, 8, 16, 32 甚至 64 个二进制位来表示二进制数，即使高位是 `0`。这也是由于计算机内部的构建方式。\n\
  \n由于 `digit`（数字）一词指的是 10 的倍数，因此 `binary digit`（二进制位）被称为 `bit`（binary digit 的缩写）。一个\
  \ `byte`（字节）由 8 个 `bit` 组成。（将二进制位称为 `byte-it` 似乎不是个好主意。）内存通常以字节为单位（就像面包用“十二打”作为单位衡量一样）。\n\
  \n\n\n由于如此小的基数，你必须使用大量的`large` `bit` 来表示数字。人类不想用诸如 `01111011[2]` 这样繁琐的表达式来表示 `123[10]`\
  \ 这样一个平庸的值。程序员更倾向于使用偶数位的位来表示数字。八进制系统——基于 3 个 `bit`——是 C 语言早期的默认二进制系统。我们直到今天还能看到它的遗迹——在\
  \ C++ 中，以 `0` 开头的常量被认为是八进制。因此，这一行代码：\n\n```\ncout << \"0173 = \" << 0173 << endl;\n\
  ```\n\n产生以下输出：\n\n`0173 = 123`\n\n然而，八进制几乎完全被`十六进制`系统取代了，后者基于 4 位数字。\n\n十六进制对于 0\
  \ 到 9 的数字使用相同的数字。对于 9 到 16 之间的数字，十六进制使用字母表的前六字母：A 代表 10，B 代表 11，以此此类推。因此，`123[10]`\
  \ 变成了 `7B[16]`，如下：\n\n`123 = 7 * 16¹ + B (即 11) * 16⁰ = 7B[16]`\n\n程序员即使在每个数字的首位都是\
  \ `0` 的情况下，也倾向于用 4 个十六进制位的倍数来表示十六进制。\n\n最后，谁想用下标来表示像 `7B[16]` 这样的十六进制数呢？终端甚至不支持下标。即使是在我正在使用的文字处理器上，为了输入两个糟糕的数字而在下标模式和普通模式之间切换字体也是件麻烦事。因此，程序员们（他们并不傻）使用了以\
  \ `0x.` 开头的十六进制数的习惯。（为什么？嗯，这种奇怪习惯的起源可以追溯到 C 语言的早期，在一个遥远、遥远的星系里……没了。）因此，`7B` 变成了\
  \ `0x7B.`。使用这种习惯，十六进制数 `0x7B` 等于十进制 123，而十六进制 `0x123` 等于十进制 291。代码段\n\n```\ncout\
  \ << \"0x7B  = \" << 0x7B  << endl;\ncout << \"0x123 = \" << 0x123 << endl;\n```\n\
  \n产生以下输出：\n\n`0x7B  = 123`\n`0x123 = 291`\n\n你可以像对十进制数应用的那样，在十六进制数上使用所有的数学运算符。（好吧，我们中的大多数人无法在脑中完成如\
  \ `0xC * 0xE` 这样的乘法，但这更多是因为我们在学校学的乘法表，而不是由于数字系统的任何限制。）\n\n![c++14_fmt.eps](img/c14_fmt.png)\
  \ 如果你真的想，可以在 C++ '14 中使用前缀 `0b` 写二进制数。因此，123 变成了 `0b0111011`。\n\n## 执行位运算\n\n所有的\
  \ C++ 数字都可以用二进制表示。二进制数只使用数字 1 和 0 来表示值。表 4-2 定义了一次处理一个位的操作集合，因此有了 `bitwise`（位）这个术语。\n\
  \n表 4-2 位运算符\n| 运算符 | 功能 |\n| :--- | :--- |\n| `~` | 非：反转每个位，从 1 变为 0，从 0 变为 1 |\n\
  | `&` | 与：将左侧参数的每个位与右侧位进行与运算 |\n| `|` | 或：将左侧参数的每个位与右侧位进行或运算 |\n| `^` | 异或：将左侧参数的每个位与右侧位进行异或运算\
  \ |\n\n位运算可能在少量内存中存储大量信息。世界上许多特征只有两种可能——要么这样，要么那样。你不是结婚就是没结婚。在 C++ 中，你可以将这些特征中的每一个存储在单个位中——通过这样，你可以将\
  \ 32 个独立的属性打包到一个 32 位的 `int` 中。此外，位操作可以极快。32 比 1 的节省没有任何性能损失。\n\n![tip.eps](img/tip_fmt.png)\
  \ 尽管现在内存很便宜，但它不是无限的。有时，当你存储大量数据时，这种将大量属性打包到一个字（word）的能力是一个巨大的优势。\n\n### 单位运算符\n\n\
  位运算符——`&`、`|` 和 `~`——对单个位执行操作。如果你将 0 视为 `false` 将 1 视为 `true`（不一定必须这样，但这是一个常见的约定），你可以对\
  \ `~` 运算符说如下的话：\n\n`~1 (true) 是 0 (false)`\n`~0 (false) 是 1 (true)`\n\n`&` 运算符定义为：\n\
  \n`1 (true) & 1 (true) 是 1 (true)`\n`1 (true) & 0 (false) 是 0 (false)`\n\n`|` 运算符的情况类似：\n\
  \n`1 (true) | 0 (false) 是 1 (true)`\n`0 (false) | 0 (false) 是 0 (false)`\n\n`AND`（与）运算符的定义出现在表\
  \ 4-3 中。读取一个位：\n\n`1 (true) & 1 (true) 是 1 (true)`\n`1 (true) & 0 (false) 是 0 (false)`\n\
  \n`|` 运算符的情况类似：\n\n`1 (true) | 0 (false) 是 1 (true)`\n`0 (false) | 0 (false) 是 0\
  \ (false)`\n\n`AND` 运算符的定义出现在表 4-3 中。读取一个位：\n\n`1 (true) & 1 (true) 是 1 (true)`\n\
  `1 (true) & 0 (false) 是 0 (false)`\n\n`AND` 运算符的定义出现在表 4-3 中。读取一个位：\n\n`1 (true)\
  \ & 1 (true) 是 1 (true)`\n`1 (true) & 0 (false) 是 0 (false)`\n\n`AND` 运算符的定义出现在表\
  \ 4-3 中。读取一个位：\n`1 (true) & 1 (true) 是 1 (true)`\n`1 (true) & 0 (false) 是 0 (false)`\n\
  \n`AND` 运算符的定义出现在表 4-3 中。\n\n` ` AND 1 是 0。\n\n表 4-3 与运算符真值表\n| AND | 1 | 0 |\n\
  | :--- | :--- | :--- |\n| 1 | 1 | 0 |\n| 0 | 0 |\n\n装备了这些单位运算符，我们就可以处理 C++ 位逻辑运算。\n\
  \n### 使用位运算符\n\n位运算符的使用与其他任何二进制算术运算符类似。NOT 运算符是最容易理解的。取反一个数字就是取反组成该数字的每一个位（对程序员来说，这句话完全合理）。考虑这个例子：\n\
  \n`~0110[2] (0x6)`\n`1001[2] (0x9)`\n\n因此我们说 `~0x6` 等于 `0x9`（读作“非 6 等 9”）。\n\n下面的计算演示了\
  \ `&` 运算符：\n\n```\n   0110[2]\n&\n   0011[2]\n   0010[2]\n```\n\n从最高位开始，0 AND 0\
  \ 是 0。在下一位，1 AND 0 是 0。在第 3 位，1 AND 1 是 1。在最低位，0 AND 1 是 0。用十六进制表示，相同的表达式如下：\n\n\
  ```\n   0x6   0110[2]\n&\n   0x3   0011[2]\n   0x2   0010[2]\n```\n\n\n\n\n\n简而言之，我们\
  \ `0x6 & 0x3` 等于 `0x2`（读作“6 AND 3 equals 2”）。\n\n### 一个简单的测试\n\n以下程序演示了位运算符的操作。该程序初始化两个变量，并输出它们进行与、或、异或运算的结果：\n\
  \n```cpp\n// BitTest - 初始化两个变量并输出\n//           应用 ~,,& , | 和 ^ 操作\n//         \
  \  的结果\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 将输出格式设为十六进制\n\
  \    cout.unsetf(cout.dec);\n    cout.setf(cout.hex);\n    // 初始化两个参数\n    int nArg1\
  \ = 0x78ABCDEF;\n    int nArg2 = 0x12345678;\n    // 现在依次执行每个操作\n    // 首先是一元取非运算符\n\
  \    cout << \" nArg1 = 0x\" << nArg1  << endl;\n    cout << \"~nArg1 = 0x\" <<\
  \ ~nArg1 << \"\\n\" << endl;\n    cout << \" nArg2 = 0x\" << nArg2  << endl;\n \
  \   cout << \"~nArg2 = 0x\" << ~nArg2 << \"\\n\" << endl;\n    // 现在是二元运算符\n   \
  \ cout << \"  0x\" << nArg1 << \"\\n\"\n         << \"& 0x\" << nArg2 << \"\\n\"\
  \n         << \"  ----------\" << \"\\n\"\n         << \"  0x\" << (nArg1 & nArg2)\
  \ << \"\\n\"\n         << endl;\n    cout << \"  0x\" << nArg1 << \"\\n\"\n    \
  \     << \"| 0x\" << nArg2 << \"\\n\"\n         << \"  ----------\" << \"\\n\"\n\
  \         << \"  0x\" << (nArg1 | nArg2) << \"\\n\"\n         << endl;\n    cout\
  \ << \"  0x\" << nArg1 << \"\\n\"\n         << \"^ 0x\" << nArg2 << \"\\n\"\n  \
  \       << \"  ----------\" << \"\\n\"\n         << \"  0x\" << (nArg1 ^ nArg2)\
  \ << \"\\n\"\n         << endl;\n    // 等待用户准备好后再终止程序\n    // 以允许查看查看结果\n    cout\
  \ << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n程序中的前两个表达式 `cout.unsetf(ios::dec)` 和 `cout.setf(ios::hex),`\
  \ 将默认输出格式从十进制更改为十六进制。（在阅读第 23 章之前，你得相信我是有效的。）\n\n程序的其余部分非常直观。程序为 `nArg1` 赋值测试值 `0x78ABCDEF`，为\
  \ `nArg2` 赋值值 `0x12345678`。然后程序输出所有位运算组合。额外的换行符（如如下行所示）会产生空行，帮助分组输出以使其更容易阅读：\n\n\
  ```cpp\n  cout << \"~nArg1 = 0x\" << ~nArg1 << \"\\n\" << endl;\n```\n\n输出如下：\n\n\
  ```\n    nArg1 = 0x78abcdef\n~nArg1 = 0x87543210\nnArg2 = 0x12345678\n~nArg2 = 0xedcba987\n\
  \  0x78abcdef\n& 0x12345678\n  ----------\n  0x10204468\n  0x78abcdef\n| 0x12345678\n\
  \  ----------\n  0x7abfdfff\n  0x78abcdef\n^ 0x12345678\n  ----------\n  0x6a9f9b97\n\
  Press Enter to continue...\n```\n\n你可以将每个数字转换为二进制以检查位算运算。例如，从每个示例的第一位可以看出，你可以看到\
  \ `7 & 1` 等于 `1`，`7 | 1` 等于 `7`，而 `7 ^ 1` 等于 `6`。\n\n#### 使用分支控制流\n\n最简单的控制形式是 `if`\
  \ 语句。它允许程序根据条件决定走哪条路径。\n\n```cpp\nif (m > n)\n{\n    // 路径 1\n}\nelse\n{\n    //\
  \ 路径 2\n}\n```\n\n在 C++ 中，会评估 `if` 表达式。如果结果为*真*，控制传递到路径 1。如果为*假*，控制传递到 *else* 子句。*else*\
  \ 子句是可选的；如果不存在，当条件为假时，程序直接跳过 `if` 块。\n\n大括号用于分组属于同一个块的多个语句。如果只有一个语句，则不需要大括号，但通常建议包含它们以避免以后添加代码时出现错误。\n\
  \n\n\n\n\n![tip.eps](img/tip_fmt.png) 注意 `if` 块内的指令是如何稍微缩进的。这完全是为了人类阅读，因为 C++ 会忽略空白字符（空格、制表符和换行符）。这看起来可能微不足道，但清晰的编码风格可以提高你的\
  \ C++ 程序的可读性。Code::Blocks 编辑器可以强制执行这种风格或任何其他几种编码风格。选择 `Settings⇒Editor`，然后从左侧滚动列表中点击\
  \ `Source Formatter` 选择。我使用的是 ANSI 括号样式，每个缩进四个空格。\n\n# 在程序中执行循环\n\n*分支语句*允许你将程序的执行流引导至一条或另一条路径。这是一个巨大的改进，但仍然不足以编写功能完整的程序。\n\
  \n考虑更新计算机显示器的问题。典型的 PC 在从左到右绘制图像时，每行必须更新一千多个像素。它对显示器上的一千多行每一行都重复这个过程。它是通过执行相同的少数几条指令数百万次来实现的——每个像素执行一次。\n\
  \n## 当条件为真时循环\n\n最简单的循环语句形式是 `while` 循环。\n\n`while` 循环的形式如下：\n\n```cpp\nwhile(condition)\n\
  {\n    // 只要条件为真就会重复执行\n}\n```\n\n测试 `condition`。这个条件可以是 `var > 10`、`var == var2`\
  \ 或任何返回 `true` 或 `false` 值的表达式。如果条件为 `true`，大括号内的语句就会执行。遇到大括号时，C++ 返回到开头并重新开始。如果条件为\
  \ `false`，控制传递到大括号后的第一个语句。只要条件为 `true`，大括号内的代码就会反复执行（这让我想起带狗散步……直到完成）。\n\n如果条件第一次为\
  \ `true`，什么会让它以后变为 `false` 呢？考虑以下程序：\n\n```cpp\n// WhileDemo - 输入循环次数。循环直到\n// 输出指定次数的字符串。\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入循环次数\n    int nLoopCount;\n\
  \    cout << \"Enter loop count: \";\n    cin >> nLoopCount;\n\n    // 现在循环相应的次数\n\
  \    while (nLoopCount > 0)\n    {\n        nLoopCount = nLoopCount - 1;\n     \
  \   cout << \"Only \" << nLoopCount\n             << \" loops to go\" << endl;\n\
  \    }\n    // 在程序终止前等待用户\n    // 让用户看到结果\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\n    return 0;\n}\n```\n\
  \n`WhileDemo` 从用户处获取循环次数并存储在变量 `nLoopCount` 中。程序随后执行 `while` 循环。`while` 首先测试 `nLoopCount`。如果\
  \ `nLoopCount` 大于 0，程序进入循环体（大括号之间的代码），将 `nLoopCount` 减 1 并输出结果。程序返回循环顶部测试 `nLoopCount`\
  \ 是否仍然为正。\n\n执行时，程序 `WhileDemo` 输出此处代码段所示的结果。我输入的循环次数为 `5`。结果是程序循环了五次，每次输出倒计时：\n\
  \n```\nEnter loop count: 5\nOnly 4 loops to go\nOnly 3 loops to go\nOnly 2 loops\
  \ to go\nOnly 1 loops to go\nOnly 0 loops to go\nPress Enter to continue...\n```\n\
  \n如果用户输入负循环次数，程序将完全跳过循环。因为指定的条件从未为 `true`，所以控制不会进入循环。此外，如果用户输入一个很大的数字，程序将循环很久才能完成。\n\
  \n另一种不常使用的 `while` 循环版本被称为 `do … while`，它的相同之处在于直到循环底部才测试条件：\n\n```cpp\ndo\n{\n\
  \    // 循环内部\n} while (condition);\n```\n\n由于直到最后才测试条件，`do … while` 至少执行一次。![warning.eps](img/warning_fmt.png)\
  \ 条件在 `while` 的结束处检查。\n\n## 使用自增/自减\n\n程序员经常使用自增或自减。从以下代码段可以看出，程序是这样减的：\n\n```cpp\n\
  while (nLoopCount > 0)\n{\n    nLoopCount = nLoopCount - 1;\n    cout << \"Only\
  \ \" << nLoopCount\n         << \" loops to go\" << endl;\n}\n```\n\n更紧凑的版本使用了自减：\n\
  \n```cpp\nwhile (nLoopCount > 0)\n{\n    nLoopCount--;\n    cout << \"Only \" <<\
  \ nLoopCount\n         << \" loops to go\" << endl;\n}\n```\n\n事实上，更紧凑的版本（将自减嵌入逻辑比较中）更容易读。![remember.eps](img/remember_fmt.png)\
  \ `nLoopCount--` 和 `--nLoopCount` 表达式都会递减 `nLoopCount`。然而，前者在减 1 之前返回 `nLoopCount`\
  \ 的值；后者在减 1 后返回。\n\n当用户输入 1 时，`WhileDemo` 的自减版本应该执行多少次？如果你使用前减版本，`nLoopCount` 的值为\
  \ 0，循环体永远不会执行。使用后减版本，`nLoopCount` 的值为 1，控制进入循环。\n\n## 使用 for 循环\n\n常见的循环形式是 `for`\
  \ 循环。`for` 循环优于更基础的 `while` 循环，因为它通常更容易读。\n\n`for` 循环具有以下格式：\n\n```cpp\nfor (initialization;\
  \ conditional; increment)\n{\n    // ...循环的体\n}\n```\n\n`for` 循环等同于以下 `while` 循环：\n\
  \n```cpp\n{\n    initialization;\n    while(conditional)\n    {\n        {\n   \
  \         // ...循环的体\n        }\n        increment;\n    }\n}\n```\n\n\n\n\n执行通过\
  \ `conditional clause` 继续。该子句的工作方式与 `while` 循环相同：只要条件句为 `true`，`for` 循环就会继续执行。\n\
  \n在循环体内的代码执行完毕后，控制权将传递到增量子句，然后返回检查条件句——从而重复该过程。增量子句通常包含用于更新 `counting variables`\
  \ 的自增或自减语句。\n\n通过示例来理解 `for` 循环是最佳的。接下来的 `ForDemo1` 程序仅仅是将 `WhileDemo` 转换为使用 `for`\
  \ 循环结构的结果：\n\n```cpp\n// ForDemo1 - input a loop count. Loop while\n//         \
  \   outputting a string arg number of times.\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // input the loop count\n    int nLoopCount;\n    cout << \"\
  Enter loop count: \";\n    cin  >> nLoopCount;\n    // count up to the loop count\
  \ limit\n    for (; nLoopCount > 0;)\n    {\n        nLoopCount = nLoopCount - 1;\n\
  \        cout << \"Only \" << nLoopCount\n             << \" loops to go\" << endl;\n\
  \    }\n    // wait until user is ready before terminating program\n    // to allow\
  \ the user to see the program results\n    cout << \"Press Enter to continue...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n\
  该程序从键盘读取一个值到变量 `nloopCount`。`for` 开始比较 `nLoopCount` 与 0。如果 `nLoopCount` 大于 0，控制权进入\
  \ `for` 循环。一旦进入 `for` 循环，程序就会递减 `nLoopCount` 并显示结果。完成后，程序返回 `for` 循环控制处。一旦 `nLoopCount`\
  \ 递减到 0，控制权将立即跳转到 `for` 循环的下一行。\n\n![tip.eps](img/tip_fmt.png) `for` 循环的三个部分都可以为空。空的初始化部分或增量部分什么都不做。空的比较部分被视为返回\
  \ `true` 的比较。\n\n这个 `for` 循环有两个小问题。首先，它是破坏性的——不是指我的小狗对拖鞋的那样，而是指它改变了 `nLoopCount`\
  \ 的值，“破坏”了原始值。其次，这个 `for` 循环从大值向小值倒数。这两个问题通过在 `for` 循环中添加专门的计数变量来解决。它的样子如下：\n\n\
  ```cpp\n// ForDemo2 - input a loop count. Loop while\n//            outputting a\
  \ string arg number of times.\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  \nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    //\
  \ input the loop count\n    int nLoopCount;\n    cout << \"Enter loop count: \"\
  ;\n    cin  >> nLoopCount;\n    // count up to the loop count limit\n    for (int\
  \ i = 1; i <= nLoopCount; i++)\n    {\n        cout << \"We've finished \" << i\n\
  \             << \" loops\" << endl;\n    }\n    // wait until user is ready before\
  \ terminating program\n    // to allow the user to see the program results\n   \
  \ cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n\
  \    cin.get();\n    return 0;\n}\n```\n\n这个修改后的 `ForDemo` 版本循环方式与之前相同。然而，这个 `ForDemo2`\
  \ 版本没有修改 `nLoopCount` 的值，而是使用了一个新的计数器变量。\n\n这个 `for` 循环声明了一个计数变量 `i` 并将其初始化为 0。它随后将该计数变量与\
  \ `nLoopCount` 进行比较。如果 `i` 小于 `nLoopCount`，控制权进入 `for` 循环体内的输出语句。一旦体执行完毕，控制权传递到增量子句，在那里\
  \ `i` 增加并与 `nLoopCount` 进行比较，依此类推。\n\n以下是程序的输出：\n```\nEnter loop count: 5\nWe've\
  \ finished 1 loops\nWe've finished 2 loops\nWe've finished 3 loops\nWe've finished\
  \ 4 loops\nWe've finished 5 loops\n```\n![warning.eps](img/warning_fmt.png) 在 `for`\
  \ 循环的初始化部分声明时，索引变量仅在 `for` 循环内部可见。书呆 C++ 程序员说该变量的作用范围仅限于 `for` 循环。在 `ForDemo2` 示例中，无法从\
  \ `return` 语句访问变量 `i`，因为该语句不在循环内部。\n\n### 避免可怕的无限循环\n\n`infinite loop`（无限循环）是一个永远持续的执行路径。只要终止循环的条件无法发生，就会发生无限循环——这通常是编码错误的结果。考虑之前循环的以下微小变化：\n\
  \n```cpp\nwhile (nLoopCount > 0)\n{\n    cout << \"Only \" << nLoopCount << \" loops\
  \ to go\" << endl;\n}\n```\n程序员忘记递减变量 `nLoopCount`。结果是循环计数器永远不会改变。测试条件要么为 `false`要么始终为\
  \ `true`。程序在无尽的（无限）循环中执行。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 我意识到没有什么是无限的。最终电力会中断，电脑会损坏，微软会破产，狗会和猫一起睡觉……要么循环会停止，要么你不再继续。但无限循环将一直执行，直到程序外部某些因素让它停止。你可以通过比这里多多的方式创建无限循环，其中许多都更难发现。\n\
  \n### For each\n\n![c++11_fmt.eps](img/c11_fmt.png) 2011 年新增了一种 `for` 语句的形式，通常被称为\
  \ `for each` 或 `range-based for loop`（基于范围的 for 循环）。在这个 `for` 循环中，计数变量后面跟着值列表，如下程序所示：\n\
  \n![warning.eps](img/warning_fmt.png) 截至本文编写，`ForEach` 在 Macintosh 版 Code::Blocks\
  \ 上不支持。\n\n```cpp\n// ForEachDemo - C++ includes a form of the \"for each\"\n//\
  \               which iterates through each member of\n//               a list\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    cout << \"The primes less\
  \ than 20:\" << endl;\n    for(int n : {1, 2, 3, 5, 7, 11, 13, 19})\n    {\n   \
  \     cout << n << \", \";\n    }\n    cout << endl;\n    // wait until user is\
  \ ready before terminating program\n    // to allow the user to see the program\
  \ results\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n括号内的值被称为列表。变量 `n` 被赋予列表中的每个值：第一次循环赋值为\
  \ 1，然后是 2，然后是 3，然后是 5，以此此类推。当列表耗尽时，`for` 循环终止。该程序的输出如下：\n```\nThe primes less than\
  \ 20 are:\n1, 2, 3, 5, 7, 11, 13, 17, 19,\nPress Enter to continue...\n```\n我在第\
  \ 7 章 中再次提到初始化列表，并在第 26 章 中详细讨论。\n\n![warning.eps](img/warning_fmt.png) 此处所示的范围循环示例在\
  \ Macintosh 版 Code::Blocks 上无法工作。然而，第 7 章 中的数组示例在 Mac 上可以正常工作。\n\n### 应用特殊的循环控制\n\
  \nC++ 定义了两个名为 `break` 和 `continue` 的特殊流控制命令。有时终止循环的条件既不在循环的开头也不在结尾，而是在中间。考虑一个累加用户输入数值的程序。当用户输入负数时，循环终止。\n\
  \n这个问题的挑战在于，程序在用户输入值之前无法退出循环，但必须在将该值加到总和之前退出。\n\n\n\n\n对于这些情况，C++ 定义了 `break` 命令。当遇到\
  \ `break` 时，`break` 会导致控制立即退出当前循环。控制流从 `break` 语句传递到循环结束处大括号之后的后续语句。\n\n`break`\
  \ 命令的格式如下：\n\n```cpp\nwhile(condition) // break 在 for 循环中同样有效\n{\n    if (some other\
  \ condition)\n    {\n        break;   // 退出循环\n    }\n}               // 当程序遇到 break\
  \ 时\n                // 控制流传递到这里\n```\n\n用上了这个新的 `break` 命令，我解决累加器问题的解决方案如程序 `BreakDemo:`\
  \ 所示：\n\n```cpp\n// BreakDemo - 输入一系列数字。\n// 继续累加这些数字的和，\n// 直到用户输入一个负数为止。\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入循环计数器\n    int accumulator\
  \ = 0;\n    cout << \"This program sums values from the user\\n\"\n         << \"\
  Terminate by entering a negative number\"\n         << endl;\n\n    // “无限”循环\n\
  \    for(;;)\n    {\n        // 获取另一个数字\n        int nValue = 0;\n        cout <<\
  \ \"Enter next number: \";\n        cin  >> nValue;\n        // 如果是是负数...\n    \
  \    if (nValue < 0)\n        {\n            // ...则退出\n            break;\n   \
  \     }\n        // ...否则将数字加到累加器中\n        accumulator += nValue;\n    }\n    //\
  \ 现在我们已经退出了循环\n    // 输出累加的结果\n    cout << \"\\nThe total is \"\n         << accumulator\n\
  \         << endl;\n\n    // 在终止程序前等待用户准备好，\n    // 以允许用户看到程序结果\n    cout << \"\
  Press Enter to continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n```\n\n在向用户解释了规则（输入负数终止等）之后，程序进入了一个看起来像无限的 `for` 循环。一旦进入循环，`BreakDemo`\
  \ 会从键盘获取一个数字。只有在程序读取该数字后，才能测试该数字是否匹配退出标准。如果输入的数字是负数，控制传递到 `break`，导致程序退出循环。如果输入的数字不是负数，控制将跳过\
  \ `break` 命令，执行将新值累加到 accumulator 中的表达式。程序退出循环后，输出累加的值然后退出。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当在循环对变量反复执行操作时，请确保变量在进入循环之前已正确初始化。在这种情况下，程序在进入将 `nValue` 加入它的循环之前将 `accumulator`\
  \ 清零。\n\n示例运行的结果如下：\n\n```text\nThis program sums values from the user\nTerminate\
  \ by entering a negative number\nEnter next number: 1\nEnter next number: 2\nEnter\
  \ next number: 3\nEnter next number: -1\nThe total is 6\nPress Enter to continue...\n\
  ```\n\n相似的 `continue` 命令使用频率稍低。当程序遇到 `continue` 命令时，它会立即回到循环顶部。循环中剩余的语句对于当前迭代将被忽略。\n\
  \n下面的示例代码片段忽略了用户可能输入的负数。只有 0 会终止此版本（完整程序在网站上显示为 `ContinueDemo`）：\n\n```cpp\nwhile(true)//这个\
  \ while() 的效果与 for(;;)相同\n{\n    // 输入一个值\n    cout << \"Input a value:\";\n   \
  \ cin  >> nValue;\n    // 如果该值是负数...\n    if (nValue < 0)\n    {\n        // ...输出一条消息...\n\
  \        cout << \"Negative numbers are not allowed\\n\";\n        // ...回到循环顶部\n\
  \        continue;\n    } // ...继续像正常一样处理\n}\n```\n\n## 嵌套命令\n\n另一个循环内部循环被称为嵌套循环。作为一个示例，我修改了\
  \ `BreakDemo` 程序来累加序列。在 `NestedDemo` 程序中，内部循环累加从键盘输入的数字，直到用户输入负数。外层循环继续累加，直到总和为\
  \ 0。它看起来像这样：\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  \nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    //\
  \ 外层循环\n    cout << \"This program sums multiple series\\n\"\n         << \"of numbers.\
  \ Terminate each sequence\\n\"\n         << \"by a negative number.\\n\"\n     \
  \    << \"Terminate the series by entering\\n\"\n         << \"negative numbers\
  \ in a row\\n\"; // 继续累加序列\n    int accumulator;\n    for(;;)\n    {\n        //\
  \ 开始下一组数字\n        accumulator = 0;\n        cout << \"Start the next sequence\\\
  n\"; // 无限循环\n        for(;;)\n        {\n            // 获取另一个数字\n            int\
  \ nValue = 0;\n            cout << \"Enter next number: \";\n            cin >>\
  \ nValue;\n            // 如果是负数...\n            if (nValue < 0)\n            {\n\
  \                // ...则退出\n                break;\n            }\n            //\
  \ ...否则将数字加到累加器中\n            accumulator += nValue;\n        }\n        // 如果累加总和为\
  \ 0，则退出循环\n        if (accumulator == 0)\n        {\n            break;\n      \
  \  }\n        // 输出累加的结果并重新开始\n        cout << \"The total for this sequence is\
  \ \"\n             << accumulator << endl << endl;\n    }\n    // 在终止程序前等待用户准备好\n\
  \    // 以允许用户看到程序结果\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n注意内部的 `for` 循环看起来和累加器示例一样。然而，在该循环之后增加了一个测试。如果\
  \ `accumulator` 等于 0，程序将执行 break 以退出外层循环。否则，程序将输出累加的值并重新开始。\n\n## 切换到不同的主题\n\n最后一个控制语句在有限的情况下有用。`switch`\
  \ 语句通过包含多种不同的可能性而不是单一测试，看起来类似于复合 `if` 语句：\n\n```cpp\nswitch(expression)\n{\n   \
  \ case c1:\n        // 如果 expression == c1，则到这里\n        break;\n    case c2:\n\
  \        // 如果 expression == c2，则到这里\n        break;\n    default:\n        // 如果没有匹配，则到这里\n\
  }\n```\n\n`expression` 的值必须是整数（`int`、`long` 或 `char`）。case 值必须是常量。根据 '14 标准，它们也可以是常量表达式。我将在第\
  \ 10 章中再描述常量表达式。\n\n当遇到 `switch` 语句时，表达式会被求值并与各种 case 常量进行比较。控制流分支到匹配的 case。如果没有哪个\
  \ case 匹配，控制流传递到 `default` 子句。\n\n\n\n\n\n考虑以下代码片段：\n\n```cpp\nint choice;\n\ncout\
  \ << \"Enter a 1, 2 or 3:\";\n\ncin >> choice;\nswitch(choice)\n{\n    case 1:\n\
  \        // do \"1\" processing\n        break;\n    case 2:\n        // do \"2\"\
  \ processing\n        break;\n    case 3:\n        // do \"3\" processing\n    \
  \    break;\n    default:\n        cout << \"You didn't enter a 1, 2 or 3\\n\";\n\
  }\n```\n\n再次，`switch` 语句有等价写法；在这种情况下，可以使用多个 `if` 语句。然而，当 case 超过两个或三个时，`switch`\
  \ 结构更更容易理解。\n\n![warning.eps](img/warning_fmt.png) `break` 语句对于退出 `switch` 命令是必要的。如果没有\
  \ `break` 语句，控制将从一个 case 贯透到下一个 case。（请注意下文！）\n\n## 第二部分\n\n# 成为一名实用的 C++ 程序员\n\n\
  ![9781118823774-pp0201.tif](img/9781118823774-pp0201_fmt.png)\n\n![webextras.eps](img/webextras_fmt.png)\
