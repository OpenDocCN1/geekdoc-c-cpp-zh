  \ + ″ as well as ″\n\ncolor!″.fontcolor(″#0000ff″).bold();\n\ndocument.write(htmlOutput);\n\
  ```\n\n这在我们的浏览器中看起来会像这样：**图 7-3**\n![069](img/whit_9780470550502_oeb_069_r1.gif)\n\
  \n另外两个实用的格式方法用于创建锚点标签（<A> 标签）。`.link(lunkUrl)` 方法可以从某些文本创建超链接，该链接指向提供的 URL。例如：″Check\
  \ out Google Search″.link(″[`google.com`](http://google.com)″)`。这将创建 HTML：`″<a href=″[`google.com`](http://google.com)″>Check\
  \ out Google Search</a>″。另一个锚点方法用于页内锚点，如 (<a name=″allaboutcats″>All About Cats</a>)。这些使用\
  \ `.anchor(anchorName)` 方法创建：″All About Cats″.anchor(″allaboutcats″)\n\n## 自定义 HTML\
  \ 标签格式化\n\n在现代 Web 开发中，开发者广泛使用 CSS（*级联样式表*）为浏览器提供样式信息。能够像处理粗体 (<B>) 和斜体 (<I>) 那样，对字符串中的\
  \ HTML 格式应用样式也是很好的。一个非常有用的辅助方法是允许我们在 JavaScript 字符串字面量或变量上应用带有特定 CSS 的 <SPAN> 或\
  \ <DIV> 或段落标签 <P>。这里有一个用于此操作的小实用工具。为了方便起见，它附加到全局 String 对象上。\n\n```javascript\n\
  // 此工具函数将在字符串字面量周围封装任何 HTML 标签，\n// 以及可选的 CSS 类\nString.prototype.tagify = function(tag,\
  \ cssClasses) {\n\n  // 首先检查是否传递了 cssClasses\n  if (!cssClasses)\n    cssClasses\
  \ = ″″;\n\n  // 现在确保你传递了一个有效的标签\n  if (tag)\n    return ′<′ + tag + ′ CLASS=″ +\
  \ cssClasses + ′″>′ + this + ′</′ + tag + ′>′;\n  else\n    return this;\n}\n```\n\
