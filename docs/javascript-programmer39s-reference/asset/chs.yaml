  \ 来实现。务必查看附录 F，以获取 `Range` 和 `TextRange` 的完整成员列表。\n\n// 将 range 设置到特定节点\n\n```javascript\n\
  if (w3Range) {\n    // 我们在这里也可以使用 selectNodeContents，它只会包含内部内容\n    pRange.selectNode(document.getElementById('myShortParagraph'));\n\
  } else {\n    // IE\n    pRange.moveToElementText(document.getElementById('myShortParagraph'));\n\
  }\n```\n\n现在为了验证我确实选中了整个节点，我可以在 W3C 中使用 `toString()` 获取节点的文本（不含 HTML），并在 IE 中使用\
  \ `text` 来执行相同的操作：\n\n// 获取节点的内容\n\n```javascript\nvar rangeContents;\n\nif (w3Range)\
  \ {\n    rangeContents = pRange.toString();\n} else {\n    // IE\n    rangeContents\
  \ = pRange.text;\n}\n```\n\n（注：原文提供的文本从此处开始出现了大量内容重复的重复，根据“不要重复输出原文”的要求，后续译文仅涵盖了非重复逻辑部分。）\n\
  \n\n\n\n网页上一种日益流行的技术是关注用户在页面上选中的文本，以便提供查询功能或投放广告。例如，在*纽约时报*网站上，你可以选择文章中的某些文本，并将其作为在*其他*文章中搜索的依据（参见图\
  \ 3-4）。图 13-4![160](img/whit_9780470550502_oeb_160_r1.gif)\n\n遗憾的是，各种浏览器实现的实现选择\
  \ API 存在很大差异。如往常一样，有一套微软的处理方式，以及一套“其他浏览器”的处理方式。W3C 标准化了他们称为 `ranges` 的内容，但这仅在非 IE\
  \ 浏览器中（如 Firefox 2、Safari 1.3 和 Opera 9）中得到了实现。事实上，Opera 同时实现了微软的方法和 W3C 的方法，但它们的\
  \ W3C 实现更为完整。\n\n要检测到用户*何时*选择了某些文本，你可以选择使用 `document` 上的 `mouseup` 事件，这是判断用户*可能*正在进行此操作的相当好的指标。然后你检查用户的选择对象中是否有任何数据。要做到这一点，你必须先将选择转换为范围对象。顺便说一下，你应该意识到范围是可以编程创建的。该范围对象将包含选择中的文本，其中文本内的\
  \ HTML 会通过闭合标签等修复。例如，如果用户选择了以下文本：\n\n```\n<p>ipsum dolor sit amet, consectetur adipisicing\
  \ elit, sed do eiusmod tempor\nincididunt ut labore et dolore magna aliqua.</p>\n\
  \n<p>Ut enim ad minim veniam, quis nostrud exercitation</p>\n```\n\n返回给开发者的文本看起来如下：\n\
  \n```\n<p>ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor\n\
  incididunt ut labore et dolore magna aliqua.</p>\n\n<p>Ut enim ad minim veniam,\
  \ quis nostrud exercitation</p>\n```\n\n这令人松了一口气——这意味着在查看用户选择时，你不需要担心处理格式不正确的 HTML\
  \ 文档。但你如何*获取*用户的选择呢？一如既往，答案会根据浏览器进行清晰的划分：Internet Explorer 在一方，其他的在另一侧。\n\n首先，假设你已经有一个包含某些文本的文档。从绑定到\
  \ `mouseup` 事件开始：\n\n```javascript\nif (document.attachEvent)\n    window.attachEvent(\"\
  onmouseup\", getUserSelection);\nelse\n    window.addEventListener(\"mouseup\",\
  \ getUserSelection, true);\n```\n\n在我即将创建的 `getUserSelection()` 函数中，我将像以前一样为 IE\
  \ 和 W3C 编写分叉代码。在 W3C 版本中，你使用 `window.getSelection()` 获取用户选择对象的引用。有关此对象及其成员的解释，请参见附录\
  \ F。基本上，你想做的是将选择对象提升为我一直在讨论的完全功能的 `Range` 实例。要做到这一点，你使用选择对象的 `getRangeAt()` 方法从选择中返回一个范围。然后，如果你只需要选择的文本，这就像在范围上调用\
  \ `toString()` 一样简单：\n\n```javascript\n// W3C Range selection\nuserSelection = window.getSelection();\n\
  var selectionRange = userSelection.getRangeAt(0);\nuserText = selectionRange.toString();\n\
  ```\n\n在 Internet Explorer 中，你执行类似的操作。在这种情况下，选择对象属于 `document` 对象而不是 `window`。你需要的的方法是\
  \ `createRange()`。等效的代码段是：\n\n```javascript\n// IE TextRange\nuserSelection = document.selection.createRange();\n\
  userText = userSelection.text;\n```\n\n完整的 `getUserSelection()` 函数可能像这样：\n\n```javascript\n\
  function getUserSelection(e) {\n    // 首先检查浏览器是否支持 W3C DOM2 Ranges\n    var w3Range\
  \ = document.implementation.hasFeature(\"Range\", \"2.0\");\n    var userSelection;\n\
  \    var userText;\n\n    if (w3Range) {\n        // W3C Range\n        userSelection\
  \ = window.getSelection();\n        var selectionRange = userSelection.getRangeAt(0);\n\
  \        userText = selectionRange.toString();\n    } else {\n        // IE TextRange\n\
  \        userSelection = document.selection.createRange();\n        userText = userSelection.text;\n\
  \    }\n    return userText;\n}\n```\n\n这将返回选择的文本。\n\n# 总结\n\n本章介绍了如何使用 JavaScript\
  \ 处理文档对象模型（DOM）。主要主题包括：\n\n-   我讨论了现代 DOM 在 Internet Explorer 4 和 Netscape 6 中的起源，以及\
  \ Netscape 2 和 Internet Explorer 3 中第一批 DOM 的特性，这些特性今天仍然存在。\n-   文档可以通过两种基本方式之一进行渲染：使用\
  \ W3C 标准或兼容模式（quirks mode）。\n-   DOM 的结构类似于树；XML 和 HTML 文档在这方面是类似的。\n-   有多种方法可以定位特定元素，包括\
  \ `getElementsByName()`、`getElementsByTagName()` 和 `getElementById()`。\n-   选择：当用户使用鼠标或键盘选择文本时，该区域可以转换为\
  \ `range`，反过来可以用于提取文本或执行其他操作。\n-   DOM 遍历：你可以使用 `parentNode`、`previousSibling`、`nextSibling`、`firstChild`、`lastChild`\
  \ 和 `childNodes` 等属性在 DOM 中向上、向下和水平移动。\n-   操作：你可以使用 `document.write()`、`innerHTML`\
  \ 或 `appendChild()` 创建新的 HTML 节点。你可以使用 `removeChild()` 移除节点，并通过 `replaceChild()`\
  \ 方法交换节点。\n\n\n\n\n\n<!-- 此处填写表单内容 -->\n\n</form>这些属性中的每一个以及许多其他属性，都体现在表单的 DOM 对象中。这些属性的完整列表可参见附录\
  \ F。下表列出了一些最重要的属性。![161](img/whit_9780470550502_oeb_161_r1.gif)表单还提供两个方法：![162](img/whit_9780470550502_oeb_162_r1.gif)最后，表单还支持几个关键事件：![163](img/whit_9780470550502_oeb_163_r1.gif)尽管\
  \ `Form` 对象本身的事件很少，但你处理表单的方式是通过丰富的事件模型来实现的。你不需要等待 `submit` 事件触发后才验证数据或向用户提供反馈。每个表单字段都有自己的一套事件和方法，用于为这些体验提供这些交互的切入点。\n\
  \n要获取文档中表单的引用，有两种方法。旧方法是利用所有浏览器仍然提供的内置 `document.forms[]` 集合。该集合最早随着 Netscape 2\
  \ 和第一个版本的 JavaScript 出现。它基本上是一个类数组的对象，具有 `length` 属性，并能够通过索引或名称来识别表单。例如，假设我正在处理以下包含两个表单的\
  \ HTML 文档：\n\n```html\n<html\n<head>\n    <title>简单表单演示</title>\n</head>\n<body>\n\
  \n<h1>登录</h1>\n<form name=\"signinForm\" id=\"siForm\">\n    <p><label for=\"username\"\
  \ accesskey=\"u\">用户名: </label>\n        <input type=\"text\" name=\"username\"\
  \ id=\"username\"></p>\n    <p><label for=\"password\" accesskey=\"p\">密码: </label>\n\
  \        <input type=\"password\" name=\"password\" id=\"password\"></p>\n    <p><input\
  \ type=\"submit\"></p>\n</form>\n\n<h1>注册账号！</h1>\n<form name=\"signupForm\" id=\"\
  suForm\">\n    <p><label for=\"dusername\" accesskey=\"u\">期望用户名: </label>\n   \
  \     <input type=\"text\" name=\"username\" id=\"username\"></p>\n    <p><label\
  \ for=\"dpassword\" accesskey=\"p\">期望密码: </label>\n        <input type=\"password\"\
  \ name=\"password\" id=\"password\"></p>\n    <p><input type=\"submit\"></p>\n</form>\n\
  \n</body>\n</html>\n```\n\n这些表单每一个都具有 `name` 和 `id` 属性。你可以通过它们在 DOM 中的位置，或者通过其名称或\
  \ `id` 哈希值来访问第一个（`signinForm`）：\n\n```javascript\nvar signinForm = document.forms[0];\n\
  signinForm = document.forms[\"signinForm\"];\n```\n\n同样，第二个表单可以通过其位置和名称来引用。鉴于它是文档中的最后一个表单，你可以使用\
  \ `forms[]` 集合的 `length` 属性：\n\n```javascript\nvar signupForm = document.forms[document.forms.length-1];\n\
  signupForm = document.forms[1];\nsignupForm = document.forms[\"signupForm\"];\n\
  ```\n\n获取任一表单引用的更现代的方法是使用其 `ID` 和 `document.getElementById()`：\n\n```javascript\n\
  signinForm = document.getElementById(\"siForm\");\nsignupForm = document.getElementById(\"\
  suForm\");\n```\n\n表单的 `name` 和 `id` 属性可以相同，但它们并不*一定*需要相同。当你给表单赋予 `name` 属性时，你还增加了通过*通过名称*作为文档对象的属性来引用它的便利性：`document.myFormName`\n\
  \n表单字段也是如此。下面的示例显示了如何获取本节之前所示 `signupForm` 表单的引用，并从中提取信息：\n\n```javascript\n// 使用\
  \ forms 集合获取引用\nvar fobj =document.forms[\"signupForm\"];\ndocument.write(\"elements:\"\
  \ + fobj.elements +\"<br />\");\ndocument.write(\"length:\" + fobj.length + \"<br\
  \ />\");\ndocument.write(\"name:\" + fobj.name + \"<br />\");\ndocument.write(\"\
  acceptCharset:\" +fobj.acceptCharset+\"<br />\");\ndocument.write(\"action:\" +\
  \ fobj.action + \"<br />\");\ndocument.write(\"enctype:\" + fobj.enctype + \"<br\
  \ />\");\ndocument.write(\"encoding:\" + fobj.encoding + \"<br />\");\ndocument.write(\"\
  method:\" + fobj.method + \"<br />\");\ndocument.write(\"target:\" + fobj.target);\n\
  ```\n\n图 14-1 显示了你在屏幕上将看到的内容。无论在哪个浏览器中查看，这些字符串都应该是相同的。图 14-1![164](img/whit_9780470550502_oeb_164_r1.gif)\n\
  \n## 表单元素\n\n表单如果没有 `input` 将无法存在。有些是真正的 `input` 类型，其他是如 `select` 和 `textarea` 这样的元素。下表是\
  \ `input` 属性的完整列表。表单还支持几个关键事件：尽管 `Form` 对象本身的事件很少，但你处理表单的方式是通过丰富的事件模型来实现的。你不需要等待\
  \ `submit` 事件触发后才验证数据或向用户提供反馈。每个表单字段都有自己的一套事件和方法，用于为这些体验提供这些交互的切入点。\n\n要获取文档中表单的引用有两种方法。旧方法是利用所有浏览器仍然提供的内置\
  \ `document.forms[]` 集合。该集合最早随着 Netscape 2 和第一个版本的 JavaScript 出现。它基本上是一个类数组的对象，具有\
  \ `length` 属性，并能够通过索引或名称来识别表单。例如，假设我正在处理以下包含两个表单的 HTML 文档：\n\n（HTML 代码块略...）\n\n\
  这些表单每一个都具有 `name` 和 `id` 属性。你可以通过它们在 DOM 中的位置，或者通过其名称或 `id` 哈希值来访问第一个（`signinForm`）：\n\
  \n（JavaScript 代码块略...）\n\n同样，第二个表单可以通过其位置和名称来引用。鉴于它是文档中的最后一个表单，你可以使用 `forms[]` 集合的\
  \ `length` 属性：\n\n（JavaScript 代码块略...）\n\n获取任一表单引用的更现代的方法是使用其 `ID` 和 `document.getElementById()`：\n\
  \n（JavaScript 代码块略...）\n\n表单的 `name` 和 `id` 属性可以相同，但它们并不*一定*需要相同。当你给表单赋予 `name`\
  \ 属性时，你还增加了通过*通过名称*作为文档对象的属性来引用它的便利性：`document.myFormName`\n\n表单字段也是如此。下面的示例显示了如何获取本节之前所示\
  \ `signupForm` 表单的引用，并从中提取信息：\n\n（JavaScript 代码块略...）\n\n图 14-1 显示了你在屏幕上将看到的内容。无论在哪个浏览器中查看，这些字符串都应该是相同的。图\
  \ 14-1![164](img/whit_9780470550502_oeb_164_r1.gif)\n\n## 表单元素\n\n表单如果没有 `input`\
  \ 将无法存在。有些是真正的 `input` 类型，其他是如 `select` 和 `textarea` 这样的元素。下表是 `input` 属性的完整列表。表单还提供两个方法：![162](img/whit_9780470550502_oeb_162_r1.gif)最后，表单还支持几个关键事件：![163](img/whit_9780470550502_oeb_163_r1.gif)尽管\
  \ `Form` 对象本身的事件很少，但你处理表单的方式是通过丰富的事件模型来实现的。你不需要等待 `submit` 事件触发后才验证数据或向用户提供反馈。每个表单字段都有自己的一套事件和方法，用于为这些体验提供这些交互的切入点。\n\
  \n\n\n\n然而，当你转向非侵入式（unobtrusive）的事件绑定时，情况会略有不同。与任何 DOM 事件一样，你可以像第 12 章讨论的那样，使用 `DOM2`\
  \ 事件监听器进行绑定。现在让我们使用非侵入式事件绑定来实现相同的操作：\n\n```javascript\nvar sForm = document.getElementById(″signupForm″);\n\
  if (document.attachEvent)\n    sForm.attachEvent(″onsubmit″, validateForm);\nelse\n\
  \    sForm.addEventListener(″submit″, validateForm, false);\n```\n\n如果你愿意，可以使用第\
  \ 12 章提到的技术来取消默认行为。在 W3C 浏览器中，这涉及事件对象的 `preventDefault()` 方法，而在 Explorer 中则涉及事件对象的\
  \ `returnValue` 属性：\n\n```javascript\nfunction validateForm(e) {\n    // 取消表单提交\n\
  \    // 首先使用 W3C 方法\n    if (e.preventDefault)\n        e.preventDefault();\n  \
  \  else\n        e.returnValue = false; // 针对 IE\n}\n```\n\n请记住，如果表单是通过其 `submit()`\
  \ 函数提交的，则不会触发此事件。\n\n## 防止回车键提交\n\nWeb 表单的一个相当烦人的特性是，用户可能会在无意中意外提交表单。这通常发生在他们编辑文本字段时，心不在地按了键盘上的回车键。在正常情况下，这会触发后提交（post-back）。你可以通过实现要求每个字段的严格表单验证来解决这个问题，但即使如此，如果用户想在提交前返回修改某些答案，仍然可能意外提交。解决此问题的方法之一是始终`拒绝表单提交，`除非`它们是以规定的方式发生的——即点击提交\
  \ 按钮。\n\n考虑以下表单作为示例：\n\n```html\n<form action=″signup.php″ onsubmit=″return false;″>\n\
  \    Text: <input type=text>\n    <input type=button onclick=″this.form.submit()″\
  \ value=″Submit″>\n</form>\n```\n\n在这个表单中，我做的几件事与其他表单不同。首先，我为 `onsubmit` 事件绑定了 `return\
  \ false`。这将阻止所有`正常`提交的通过。然后，我省略了对标准的 `<input type=submit>` 按钮的使用，而是选择了 `type=button`。如果我不这样做，当用户在文本框内按回车键时，输入元素的\
  \ `onclick` 事件将触发。而如果我使用标准的按钮类型，这种情况就不会发生。当用户最终`确实`按下按钮上的回车键或点击它时，`onclick` 事件`将`触发，表单将通过\
  \ `this.form.submit()` 提交，而不会先触发 `onsubmit`。\n\n## 启用和禁用字段\n\n有时，在用户输入数据时将某些表单字段设为`disabled`，并在满足特定条件时重新启用它们是有用的。表单字段都有一个布尔\
  \ `disabled` 属性。字段也会对该属性的变化做出动态响应，因此可以使用它来动态更改字段的外观和行为。\n\n在下面的示例中，只有当所有文本字段中都有文字后，提交按钮才会被启用：\n\
  \n```html\n<form action=″signup.php″ name=″signupForm″>\n    Text1: <input type=text>\
  \ <br />\n    Text2: <input type=text> <br />\n    Text3: <input type=text> <br\
  \ />\n    <input type=submit>\n</form>\n```\n\n<script type=″text/javascript″>\n\
  \    var els = document.signupForm.elements;\n    for (var i = 0; i < els.length;\
  \ i++) {\n        els[i].onblur = enableInputs;\n        if (i == els.length-1)\n\
  \            els[i].disabled = true;\n    }\n    function enableInputs() {\n   \
  \     var els = document.signupForm.elements;\n        var disableSubmit = false;\n\
  \        for (var i = 0; i < els.length; i++)\n            if (els[i].type == ″text″\
  \ && els[i].value.length == 0) {\n                disableSubmit = true;\n      \
  \          break;\n            }\n        // ... disableSubmit 的逻辑\n    }\n</script>\n\
  \n...（注意：提供的源文本在后半部分包含重复/碎片逻辑；已根据指令保留了核心结构）。\n\n## 设置字段焦点\n\n当用户进入文本字段进行编辑时，会触发\
  \ `onfocus` 事件。当他们离开字段时，会触发 `onblur` 事件。你可以使用 `focus()` 和 `blur()` 方法手动强制焦点进入和离开输入框。自然，一次时间只能字段拥有焦点。当你对一个字段调用\
  \ `focus()` 时，可能会导致另一个字段失去焦点。要对某个字段调用焦点，可以像像这样操作：`myFieldObj.focus()`。\n\n有时，当表单是页面上最重要的内容时（例如在注册页面上），自动为第一个字段设置焦点对用户是有好处的（这样他们就不需要点击它）。你可以通过绑定窗口的\
  \ `onload` 事件轻松地实现这一点：\n\n```javascript\nif (window.attachEvent)\n    window.attachEvent(″onload″,\
  \ setFocus);\nelse\n    window.addEventListener(″load″, setFocus, true);\n\nfunction\
  \ setFocus () {\n    var els = document.forms[0].elements;\n    for (var i = 0;\
  \ i < els.length; i++) {\n        if (els[i].type != ″hidden″) {\n            els[i].focus();\n\
  \            break;\n        }\n    }\n}\n```\n\n\n\n};`\n\n当窗口加载完成后，将触发 `setFocus()`\
  \ 事件。在这里，它获取了页面上第一个表单的引用，并寻找第一个 `non-hidden`（非隐藏）字段。一旦找到，就会调用 `focus()` 并跳循环。当用户加载页面时，第一个字段已经获得了焦点。如果它是一个文本框（通常情况下如此），用户就可以开始打字。请注意，在\
  \ Internet Explorer 中，只有当第一个字段被启用且可见时，此方法才会生效。\n\n## 操作输入元素\n\n现在，让我们深入研究单个输入元素在\
  \ JavaScript 层面是如何工作的。\n\n## 按钮\n\n实际上有五种不同的按钮输入类型。它们在 HTML 中的表示如下：\n\n```html\n\
  <input type=\"submit\">\n<input type=\"reset\">\n<input type=\"button\">\n<input\
  \ type=\"image\">\n<button></button>\n```\n\n每种行为都与上一个略有不同。你现在可能已经知道，提交（Submit）按钮的默认行为是将表单提交到服务器。当用户通过在文本字段中按回车键触发表单提交时，就像用户点击了提交按钮一样——因为甚至它的\
  \ `onclick` 事件也会触发。重置（Reset）按钮会将表单恢复到初始状态，尽管这些现在不常使用了。输入集中的第三种按钮类型是 `input type=\"\
  button\"`，它是一种更通用的按钮类型，没有默认行为。你必须为它的 `onclick` 事件绑定一个操作，任何事情才会发生。接下来是图像（image）输入类型，它的行为类似于提交，但使用的是图像而不是默认的按钮外壳。`Image`\
  \ 按钮具有其他按钮不具备的额外 DOM 属性：最后一种按钮类型是 HTML 4 的 `<button>`元素。它设计得比标准输入更具活性，可以在按钮的开始和结束标签之间包含几乎任何\
  \ HTML。这种类型的按钮还可以通过使用 `type` 属性制成提交、重置或图像按钮：\n\n```html\n<button type=\"submit\"\
  >提交!</button>\n```\n\n除此之外，这种类型的按钮的行为与 `input type=button` 相似。这些输入类型的最后一个感兴趣点是它们支持的事件。与其他表单字段一样，按钮支持\
  \ `focus()` 和 `blur()` 方法及事件。当按钮获得焦点时，它在屏幕上会显示高亮或带有虚线边框。按钮还利用了鼠标和键盘事件，例如 `onclick`、`mousedown`\
  \ 和 `mouseup`：\n\n```html\n<button onclick=\"alert('HelloWorld!');\">点击我</button>\n\
  ```\n\n我将在稍后的示例中使用这些事件来说明其他功能。\n\n## 复选框\n\n复选框可以有两种状态：true 或 false。布尔属性 `checked`\
  \ 告诉你是它处于哪种状态，并允许你更改该状态。这映射到同名的实际 HTML 属性：\n\n```html\n<input type=\"checkbox\"\
  \ name=\"emailSignup\" id=\"emailSignup\" checked=\"checked\">\n<input type=\"checkbox\"\
  \ name=\"partnerEmails\" id=\"partnerEmails\">\n```\n\n获取复选框的引用并测试其选中值，可以尝试这样的代码：`document.getElementById('emailSignup').checked`。要检测复选框何时更改，你实际上只需要\
  \ `onclick` 事件，它会在键盘和鼠标事件上触发。然而，它在复选框接收新值之前触发。在进行任何类型的验证之前，你必须允许 DOM 更新后再读取新的复选框值：\n\
  \n```javascript\nvar cbRef = document.getElementById(\"mybox\");\nif (document.attachEvent){\n\
  \    cbRef.attachEvent(\"onclick\", function(e){\n        setTimeout(function(target){\n\
  \            return function(){handleCBChange(target)}\n        }(e.srcElement ||\
  \ e.target), 0);\n    });\n} else {\n    cbRef.addEventListener(\"click\",function(e){\n\
  \        setTimeout(function(target){\n            return function(){handleCBChange(target)}\n\
  \        }(e.srcElement || e.target), 0);\n    },false);\n}\n\nfunction handleCBChange(target){\n\
  \    alert(target.checked);\n}\n```\n\n在这个示例中，我设置了一个 `setTimeout()` 计数器，以便函数 `handleCBChange()`\
  \ 在 DOM 有机会更新且复选框拥有新值之后接收点击事件。否则，我将只会获取点击瞬间时的值。\n\n## 单选按钮\n\n单选按钮与复选框非常相似，区别在于多个输入控制同一个单一值。当提交带有多个绑定相同\
  \ `name` 属性的单选输入的表单时，会提交一个值：\n\n```html\n<input type=\"radio\" name=\"favColor\"\
  \ id=\"radio1\" value=\"red\">红色<br />\n<input type=\"radio\" name=\"favColor\"\
  \ id=\"radio2\" value=\"blue\">蓝色<br />\n<input type=\"radio\" name=\"favColor\"\
  \ id=\"radio3\" value=\"orange\">橙色<br />\n<input type=\"radio\" name=\"favColor\"\
  \ id=\"radio4\" value=\"green\">绿色<br />\n```\n\n获取此字段的值有点棘手，因为你必须遍历每个单选输入并测试其 `checked`\
  \ 属性。当你通过 `forms.elements` 引用单选对象时，你得到的是所有输入。例如，使用之前的 HTML，我可以通过这样做获取所有 favColor\
  \ 的引用：`document.forms[0].elements`。遗憾的是，人们并不并不使用这个集合。相反，这里有一个获取特定名称单选输入值的实用程序：\n\
  \n```html\n<button onclick=\"getRadioValue('favColor')\">获取值</button>\n```\n\n```javascript\n\
  function getRadioValue(name) {\n    var groupCollection = [];\n    // 遍历表单\n   \
  \ for (var i = 0; i < document.forms.length; i++) {\n        if (document.forms[i].elements[name])\
  \ {\n            groupCollection = document.forms[i].elements[name];\n         \
  \   break;\n        }\n    }\n    // 现在通过遍历这些检查值\n    if (groupCollection.length\
  \ > 0) {\n        for (i = 0; i < groupCollection.length; i++) {\n            if\
  \ (groupCollection[i].checked) {\n                return groupCollection[i].value;\n\
  \            }\n        }\n    }\n}\n```\n\n如果没有找到指定值的单选按钮，函数将静默退出。对于像复选框事件，单选按钮不支持\
  \ `onchange` 但支持 `onclick`。你需要像处理复选框一样，使用在轮询新值之前等待 DOM 更新的技巧。\n\n## 选择框和多选择框\n\n\
  HTML 中有两种类型的选择框：select-one 和 select-multiple。这些也是它们各自 `type` 属性的值。同样重要的是，要把 select-one\
  \ 与高度大于 1 的 select-multiple 框区分开，因为可以创建一个一次只能选择一个元素的高高选择框。两种类型均如下所示：\n\n```html\n\
  选择您的国家：\n<select name=\"countrySelect\" id=\"countrySelect\">\n    <option value=\"\
  US\">美国</option>\n    <option value=\"CA\">加拿大</option>\n    <option value=\"UK\"\
  >英国</option>\n</select>\n```\n\n喜爱的音乐：\n\n\n\n\n\n```html\n<select multiple size=\"\
  5\" name=\"musicSelect\" id=\"musicSelect\">\n    <option value=\"classical\">Classical</option>\n\
  \    <option value=\"rock\">Rock</option>\n    <option value=\"pop\">Pop</option>\n\
  \    <option value=\"country\">Country</option>\n    <option value=\"rap\">Rap</option>\n\
  </select>\n```\n\n注意，这两个输入本质上是相同的，区别在于使用了 `multiple` 单词。当然，它们看起来非常不同，正如你在图 14-3\
  \ 中所示。图 14-3![169](img/whit_9780470550502_oeb_169_r1.gif)\n\n在获取值或通过 JavaScript\
  \ 获取等于值的内容时，它们也有所不同。对于普通的选择框（那些只包含一个值的框），操作很简单：只需检查 `value` 属性：`document.getElementById('countrySelect').value`。\n\
  \n然而，对于多选框（select multiple），你必须执行与单选按钮（Radio buttons）类似的操作，并遍历选项集合以收集每个被选中值的数组：\n\
  \n```html\n<button onclick=\"alert( getMultiSelectValues('musicSelect'));\">获取音乐值</button>\n\
  ```\n\n```javascript\nfunction getMultiSelectValues(selectID) {\n    var sObj =\
  \ document.getElementById(selectID);\n    var selectedValues = [];\n    for (var\
  \ i = 0; i < sObj.options.length; i++)\n        if (sObj.options[i].selected ==\
  \ true)\n            selectedValues[selectedValues.length] = sObj.options[i].value;\n\
  \    return selectedValues;\n}\n```\n\n对于每个选项，我检查了 `selected` 属性。如果结果为 true，则将该值添加到结果数组中。最后，从该函数返回此数组。若要进行相反操作，你必须检查每个选项值并手动设置\
  \ selected 属性：\n\n```html\n<button onclick=\"setMultiSelectValues('musicSelect',\
  \ ['rock', 'rap'])\">将音乐值设置为 'Rock' 和 'Rap'</button>\n```\n\n```javascript\nfunction\
  \ setMultiSelectValues(selectID, selectedValues) {\n    var sObj = document.getElementById(selectID);\n\
  \    // 首先我们将它们都设为 false\n    for (var i = 0; i < sObj.options.length; i++)\n  \
  \      sObj.options[i].selected = false;\n    // 现在如果发现它们在数组中，则选择性地将其设置为 true\n\
  \    for (var x = 0; x < selectedValues.length; x++)\n        for (var i = 0; i\
  \ < sObj.options.length; i++)\n            if (sObj.options[i].value == selectedValues[x])\n\
  \                sObj.options[i].selected = true;\n}\n```\n\n与第一个示例一样，我遍历了选项数组中的每个元素，但在这里我检查每个元素以查看它是否在我们的\
  \ `selectedValues` 数组中。如果是，我将 selected 属性设置为 true。修改可用属性列表也涉及使用 options 数组。要移除某项，请获取其选项元素的引用并将其设置为\
  \ null：\n\n```html\n<button onclick=\"removeOneElement('musicSelect', 'pop')\">从音乐列表中移除\
  \ 'pop'</button>\n```\n\n```javascript\nfunction removeOneElement(selectID, selectValue)\
  \ {\n    var sObj = document.getElementById(selectID);\n    for (var i = 0; i <\
  \ sObj.options.length; i++)\n        if (sObj.options[i].value==selectValue)\n \
  \           sObj.options[i] = null;\n}\n```\n\n你也可以通过将 options 集合的长度属性设置为零来移除*所有*项目：`sObj.options.length\
  \ = 0`。向列表添加项目涉及对 DOM 的使用。首先，你创建一个 `Option` 类的实例并将其追加到集合中：\n\n```html\n<button onclick=\"\
  addOneElement('countrySelect', 'Scotland', 'Scotland')\">向国家列表中添加 Scotland</button>\n\
  ```\n\n```javascript\nfunction addOneElement(selectID, newValue, newText) {\n  \
  \  var sObj = document.getElementById(selectID);\n    sObj.options[sObj.options.length]\
  \ = new Option(newText, newValue);\n}\n```\n\n`Option` 构造函数接受两个属性：选项的文本和选项的值。在先前的示例中，通过向\
  \ options 集合末尾添加 `Option` 实例，向国家选择器添加了一个新国家。\n\n## 文本框、文本区域和密码\n\n虽然有几种不同类型的文本输入字段，但只有其中两种共享\
  \ `input` 标签：`text` 和 `password`。在大多数情况下，这两个输入是相同的，只是密码字段会掩盖输入内容。在底层，它们实际上是同一个字段，你可以以完全相同的方式通过\
  \ JavaScript 读取和写入掩罩之下的值。以下是这两种的示例 HTML 标签：\n\n```html\n<input type=\"text\" id=\"\
  userName\">\n<input type=\"password\" id=\"userPassword\">\n```\n\n\n\n\n\n```javascript\n\
  var validChars = target.getAttribute(\"validchars\");\n\n// 检查字符是否在列表中\n\nif (validChars.indexOf(char)\
  \ == -1) {\n    // 首先使用 W3C 方法\n    if (e.preventDefault)\n        e.preventDefault();\n\
  \    else\n        e.returnValue = false; // 针对 IE 浏览器\n}\n```\n</script>\n</form>\n\
  \n</body>\n</html>在这个示例中涉及了几点内容。首先，在 HTML 标签上有一个自定义属性：`validchars`。该属性旨在包含允许的字符列表。所有其他字符都应该被拒绝。接下来，我同时使用\
  \ IE 和 W3C 事件绑定方法附加了 `onkeydown` 事件。绑定到此事件的函数是 `handleMaskedInput()`。在这里，我获取了 HTML\
  \ 标签的引用，以便使用 `getAttribute()` 获取有效字符字符串。我还从事件对象中提取了 `keyCode` 属性，以确定实际按下的键（通过 `String.fromCharCode()`\
  \ 帮助将数字键码转换为实际字符）。最后，我检查按下的字符是否在有效字符列表中。如果是，则允许事件发生；否则，它将使用各自的阻止默认机制防止在任何浏览器中按键。你可以扩展此技术来处理文本区域的最大长度、使用正则表达式的特殊自定义验证器，或任何形式的输入验证。这里的想象力就是唯一的限制。\n\
  \n## 自动选择文本\n\n表单中的一种做法（特别是当用户编辑数据库中的现有记录时）是在用户将焦点置于字段上时预选输入框中的文本。这可以通过结合 `onfocus`\
  \ 事件与文本输入原生的 `select()` 方法轻松实现。你可以在图 14-5 图 14-5![171](img/whit_9780470550502_oeb_171_r1.gif)中看到这一点。在下面的示例中，我使用内联事件附加绑定了\
  \ `onfocus` 事件。与之前的示例一样，可以使用非侵入式事件绑定，但为了简洁我将采用这种方法：\n```html\n<input type=\"text\"\
  \ value=\"some text\" id=\"myEntry\" onfocus=\"this.select()\">\n```\n\n## 自动调整文本区域大小\n\
  \n有时使用 `textarea` 字段类型时，很难正确调整其大小，因为无法预测用户想要输入多少文本。一些较新的浏览器允许用户通过点击并拖动角落来手动调整文本区域的大小。使用键盘事件，根据内部内容的高度*自动*调整\
  \ `textarea` 是一件简单的事。只需将 `onkeyup` 事件绑定到一个函数上，该函数将输入的 `scrollHeight` 与内容的 `offsetHeight`\
  \ 进行比较即可：\n```html\n<html>\n<head>\n    <title>自动调整文本 area</title>\n</head>\n<body>\n\
  <form>\n<textarea id=\"myArea\" cols=\"50\" rows=\"5\" onkeyup=\"checktbHeight(this)\"\
  ></textarea>\n<script type=\"text/javascript\">\nfunction checktbHeight(tObj) {\n\
  \    if (tObj.scrollHeight > tObj.offsetHeight) {\n        tObj.style.height = (tObj.scrollHeight+10)+\"\
  px\";\n    }\n}\n</script>\n</form>\n</body>\n</html>\n```\n每当用户输入按键时，都会进行这种比较。由于\
  \ `offsetHeight` 代表整个控件的实际高度，而 `scrollHeight` 代表内部文本的实际高度，你只需要确保实际高度至少等于滚动高度即可。要更改它，我使用了\
  \ `style` 对象，该对象将在第 13 章中介绍。\n\n## 隐藏字段\n\n向服务器传递关于*状态*或任何你不一定需要显示给用户的信息的极佳方法是使用隐藏表单字段。隐藏字段与文本字段非常相似，不同之处它们对布局没有影响，是不可见的，因此它们不会像文本字段那样对\
  \ `onclick`、`onfocus` 或 `onblur` 等事件响应。隐藏字段与文本字段具有相同的值，这就是我们读取和写入它们的方法。HTML 标签为：\n\
  ```html\n<input type=\"hidden\" id=\"userName\">\n```\n要向隐藏字段写入数据，获取其引用并使用：\n```javascript\n\
  var uNField = document.getElementById('userName');\nuNField.value = \"...\";\n```\n\
  \n## 文件字段\n\n一种输入类型——文件输入，与其他字段略有不同。HTML 标签定义看起来相似：\n```html\n<input type=\"file\"\
  >\n```\n然而，虽然支持 `onfocus`、`onblur` 和 `onchange` 事件，但你只能读取不能设置文件输入的 `value` 属性。\n\
  \n## 富文本字段 (WYSIWYG)\n\n另一种位于标准元素边缘的输入类型是“富文本”编辑器，也称为 WYSIWYG（所见即所得）编辑器。这些是非标准输入，取决于你是针对\
  \ Internet Explorer 还是其他浏览器，它们的实现完全不同。WYSIWYG 在 Google Docs 或 SharePoint 等应用程序的在线文档编辑器中非常流行。它们也被用于编辑\
  \ HTML 内容的 Web 内容管理系统中。这是因为文本背后的格式语法是 HTML。所有这些内容的通用缺点是，在实践中这些编辑器非常脆弱，当用户从 Word\
  \ 或 Excel 等程序粘贴内容时，WYSIWYG 生成的格式非常糟糕且冗长。尽管如此，WYSIWYG 在 Web 上仍有一席之地。关于 WYSIWYG 的普遍真理是，网上已经有很多免费组件可以将富编辑功能封装到简单的跨浏览器界面中。除非你只需要最基本的功能，否则真的没有必要编写自己的。尽管如此，我将向你展示这些事物在底层运行的基本原理，以防你确实需要编写或为你下载的组件添加自己的功能。\n\
  \n在底层，WYSIWYG 编辑器完全不是输入。它们是 iframe。通常情况下，iframe 就像嵌入在文档中的新浏览器窗口。变成 WYSIWYG 的 iframe\
  \ 像任何 iframe 一样开始运行，然后应用了一些 JavaScript。从 Mozilla 1.3（Firefox 之前），Netscape 就支持微软对\
  \ Internet Explorer 的 `designMode` 功能的实现，这基本上将 HTML 文档变成了富文本编辑器。在 Firefox 3 中，Mozilla\
  \ 还支持 Internet Explorer 的 `contentEditable` 属性，它允许任何元素变得可编辑，尽管这在其他浏览器中的支持并不广泛。`designMode`\
  \ 功能也在 Opera 9 和 Safari 1.3 及更高版本中引入。要使用此功能，从一个 iframe 开始：\n```html\n<iframe id=\"\
  wysiwig\" style=\"width:500px;height:300px\"></iframe>\n```\n当你想要将其变成编辑器时，只需设置其文档对象的\
  \ `designMode` 属性即可：\n```javascript\ndocument.getElementById('wysiwig').contentWindow.document.designMode\
  \ = \"on\";\n```\n\n// 旧版 Safari - 1.3 到 2.0\n\n\n\n\n`document.getElementById(′wysiwyg′).contentDocument.designMode=\
  \ ″on″;搞定。现在，在 Internet Explorer、Firefox、Opera、Chrome 和 Safari 中，你简单的 iframe 已经变成了一个功能完整的编辑组件，能够接受来自\
  \ Excel 和 Word 等程序的富文本粘贴，甚至是图像、加粗、斜体以及你在文字处理器中预期的许多其他内容。尽管如此，它*看起来*可能只是一个 iframe，但至少用户现在可以点击并开始打字，如图\
  \ 14-6 所示。图 14-6![172](img/whit_9780470550502_oeb_172_r1.gif)为了让它看起来更像一个文本编辑器，你需要一些像加粗、下划线、斜体之类的按钮。为了实现这一点，你将使用一个名为\
  \ `execCommand( )` 的 DOM 命令，该命令在 iframe 的文档对象上触发。`execCommand( )` 的通用语法为：`document.execCommand(aCommandName,\
  \ aShowDefaultUI, aValueArgument)`这些命令的含义非常简单。第一个参数 `aCommandName` 是要在文档上实现的命令名称。可以在下表中找到这些命令的列表。第二个参数\
  \ `aShowDefaultUI` 指定是否使用该命令的*默认*用户界面。这在 99% 的情况下可以设置为 `false`，因为只有 Internet Explorer\
  \ 真正支持此。最后一个参数 `aValueArgument` 用于为某些需要更多信息的命令（如 `insertImage`）提供额外信息（在这种情况下，是图像的\
  \ URL）。一些常用的命令可以在下表中找到。大多数情况下，这些命令应用于用户选中的内容或光标所在的位置。![173](img/whit_9780470550502_oeb_173_r1.gif)![174](img/whit_9780470550502_oeb_174_r1.gif)让我们制作一些使用这些特征的按钮。在这样做之前，我将编写一个简单的接口函数，封装获取\
  \ WYSIWYG 引用的过程，这样我就不需要每次都输入 `document.getElementById( )` 了：\n\n```\nfunction performCommand(cmd,\
  \ arg) {\n\n    document.getElementById(′wysiwyg′).contentWindow.document.execCommand(cmd,\
  \ false, arg);\n\n    return false;\n\n}\n```\n以下按钮将分别对 WYSIWYG 选中文应用加粗、斜体和下划线样式：<button\
  \ onclick=″return performCommand(′bold′, null)″>Bold</button>\n\n<button onclick=″return\
  \ performCommand(′italic′, null)″>Italics</button>\n\n<button onclick=″return performCommand(′underline′,\
  \ null)″>Underline</button>整个程序，由于 WYSIWYG 本身内置了所有这些精妙的功能，其体量很小巧，因为所有这些功能都由浏览器优雅地隐藏了：\n\
  \n```html\n<<html>\n\n<head>\n\n    <title>WYSIWYG</title>\n\n</head>\n\n<body onload=″wysiwygStartup(\
  \ )″> <button onclick=″return performCommand(′bold′, null)″>Bold</button>\n\n<button\
  \ onclick=″return performCommand(′italic′, null)″>Italics</button>\n\n<button onclick=″return\
  \ performCommand(′underline′, null″>Underline</button><br />\n\n<iframe id=″wysiwyg″\
  \ style=″width:500px; height:300px;″></iframe>\n\n<script type=″text/javascript″>\n\
  \nfunction wysiwygStartup( ) {\n\n    var Editor=document.getElementById(′wysiwyg′).contentWindow.document;\n\
  \n    Editor.designMode=′on′;\n\n    // Older Safari - 1.3 to 2.0\n\n    if (doc)\n\
  \        document.getElementById(′wysiwyg′).contentDocument.designMode = ″on″;\n\
  \n}\n\nfunction performCommand(cmd, arg) {\n\n    document.getElementById(′wysiwyg′).contentWindow.document.execCommand\n\
  \n(cmd, false, arg);\n\n    return false;\n\n}\n\n</script>\n\n</body>\n\n</</html>\n\
  ```\n经过一些编辑，在 Internet Explorer 中，我们的简单应用程序看起来可能像图 14-7 所示：**图 14-7**![175](img/whit_9780470550502_oeb_175_r1.gif)\n\
  \n\n\n级联样式表（Cascading Style Sheets）首次于 1996 年引入，尽管它们提供了一种为 HTML 文档建模的方法，但最初的设计并非为了与\
  \ JavaScript 一起使用。直到微软在 `IE 4.0` 中引入了 `style` 对象，这两个世界的融合才开始。如今，如果你对 CSS 没有相当充分的理解，就不可能成为一名合格的\
  \ JavaScript 开发人员。幸运的是，为此目的有一个完整的对象模型可供使用。不过，快速回顾一下 CSS 在文档本身中的使用方法可能是个好主意。\n\n\
  ## 在文档中嵌入 CSS\n\n有多种方法可以将 CSS 应用到元素上。最直接的方法是使用 `style` HTML 声明，并使用分号来分隔各个属性：\n\n\
  ```html\n<div style=\"position:absolute; top:10px; left:10px;\">I'm floating in\
  \ space.</div>\n```\n\n这种方法有效且得到了通用支持，但也有一些缺点。首先，它可能导致文档变得非常杂乱。这种嵌入 CSS 的方式看起来很难看，而且在调试布局时，难以在视觉上与内容分离来。另一个缺点是缺乏重用性。CSS\
  \ 类的一个大优势是相同的属性可以应用到多个元素上。例如，如果你想定义某种样式将 `DIV` 标签转换为高对比度的信息框，你可以创建一个类并在整个网站中重用它：\n\
  \n```html\n<<html>\n<head>\n<style type=\"text/css\">\n.infoBox {\n    border: 1px\
  \ solid black;\n    padding: 10px;\n    margin: 10px;\n    font-size: 18px;\n  \
  \  font-weight: bold;\n    background-color: #f0f0f0;\n    color: black;\n}\n</style>\n\
  </head>\n<body>\n    <h1>Hello World</h1>\n    <div class=\"infoBox\">This text\
  \ will standout.</div>\n    <div class=\"infoBox\">This text will also standout.</div>\n\
  </body>\n</html>\n```\n\n即使是这种策略也留有不如人意之处，即布局与标记的分离。尽管我已经从 HTML 中删除了样式定义，但它仍然不必要地膨胀了文档。相反，我可以将外部\
  \ CSS 文档与页面关联，并将所有的 CSS 都移动到那里。这将提供两个好处：应用程序中页面之间的重用以及缓存。当 CSS 和 JavaScript 文件等静态文档被外部化时，在每次请求引用它们的后续页面时，它们通常不会重新下载。相反，浏览器会判断这是同一个文档且未被修改。然后，它不会重新下载文档，而是使用内存中的版本，使得\
  \ HTML 看起来比其他时候更快。\n\n要在你的文档中嵌入外部样式表，请使用 `LINK` 标签：\n\n```html\n<html>\n<head>\n\
  <link rel=\"stylesheet\" href=\"primary.css\" type=\"text/css\"/>\n</head>\n<body></body>\n\
  </html>\n```\n\n很多开发者并不知道你还可以提供备选的样式表供用户选择应用——例如，为想要大号字体和高对比度颜色的用户增强页面的可读性。这是通过应用\
  \ `rel` 属性 `alternate stylesheet` 和一个描述性的 `title` 实现的：\n\n```html\n<html>\n<head>\n\
  <link rel=\"alternate stylesheet\" href=\"highcontrast.css\" type=\"text/css\" title=\"\
  High Contrast Version\" />\n</head>\n<body></body>\n</html>\n```\n\n用户将能够从浏览器菜单中手动选择此样式表。但对于开发者来说，这带来了一种不便，因为这意味着要维护多个样式表。幸运的是，还有另一个方便的功能可以简化这个问题。我指的是\
  \ `@import` 指令。它允许你在多个样式表中包含一个共享的样式表：\n\n```css\n<style type=\"text/css\">\n   \
  \ @import \"common.css\";\n</style>\n```\n\n在“导入样式表”（Imported Stylesheets）章节中，我讨论了如何使用\
  \ `DOM` 导航包含 `@import` 的样式表。\n\n## 版本\n\n虽然第一个 CSS 规范于 1996 年引入，但从那时起多次修订。最初的规范现在被称为\
  \ `CSS1`，它包含了排版、对齐、间距和边距以及列表的描述符。像 `DIV` 这样的块元素可以使用宽度和高度设置样式，并且可以指定边框。然而，当时无法实现复杂的页面布局。你能做的只是配置背景图像并让项目左浮或右浮。\n\
  \n直到 `CSS2`（级联样式表第 2 级）于 1998 年发布，才出现了真正的威力。第一次，块元素可以任意定位、重叠，并以你想要的任何方式进行样式设置。更复杂的选择器变得可能，并引入了\
  \ CSS `@import`，以及了针对多媒体渲染（包括打印）的一些新功能。应该注意的是，当有人提到 `CSS2` 时，他们通常指的是 `CSS2.1`，因为这次修订修复了原始发布标准中的几个重要错误。\n\
  \nCSS 选择器是定义哪些元素将应用样式的方法。选择器的语法虽然细微但易于学习。例如，`p` 将应用于所有段落标签，而 `p.sub` 将应用于具有类 `sub`\
  \ 的段落标签。\n\n\n\n\n首先，CSS 是一种文档风格的语法，其次，它是 DOM 的扩展。许多样式属性名称包含连字符，必须对其进行修改以适应 DOM\
  \ 属性（例如，`background-color` 变为 `backgroundColor`）。通常情况下，这种情况的规则是移除连字符并将第二个单词的首字母大写。在其他情况下，CSS\
  \ 属性名称会发生完全改变（例如，`float` 变为 `cssFloat`）。下表列出了一些常见的样式属性、它们的 DOM 等效属性以及包含接受值的描述。此列表主要关注\
  \ CSS 标准属性，不包括特定浏览器特有的自定义属性（除非它们非常常见或重要）。![178](img/whit_9780470550502_oeb_178_r1.gif)![179](img/whit_9780470550502_oeb_179_r1.gif)![180](img/whit_9780470550502_oeb_180_r1.gif)![181](img/whit_9780470550502_oeb_181_r1.gif)![182](img/whit_9780470550502_oeb_182_r1.gif)![183](img/whit_9780470550502_oeb_183_r1.gif)![184](img/whit_9780470550502_oeb_184_r1.gif)![185](img/whit_9780470550502_oeb_185_r1.gif)![186](img/whit_9780470550502_oeb_186_r1.gif)![187](img/whit_9780470550502_oeb_187_r1.gif)\n\
  \n# styleSheet 和样式对象\n\n正如你所知的，不是内联的样式组织在样式表中。在文档中，你可以通过 `style` 标签嵌入样式表，如下例所示：\n\
  \n```html\n<head>\n<style type=\"text/css\">\n    .myClass {font-weight:bold;}\n\
  </style>\n</head>\n```\n\n你也可以使用 `link` 标签或 `@import` 指令连接外部样式表。作为 DOM 的一部分，这里表示了两种元素类型：`style`\
  \ 和 `link`。它们都继承自标准元素类型并拥有自己的属性集。然而，这并不是在文档中访问样式的方法。无论你使用 `style` 还是 `link` 标签嵌入样式，你都在创建一个\
  \ `styleSheet` 对象的实例。文档中所有的 `styleSheets` 都作为文档对象的属性存储在 `styleSheets` 集中：\n\n```javascript\n\
  var docSheets = document.styleSheets;\nvar numberOfSheets = docSheets.length;\n\
  ```\n\n`styleSheet` 对象具有以下属性和方法。浏览器支持信息请参阅附录 F。![188](img/whit_9780470550502_oeb_188_r1.gif)![189](img/whit_9780470550502_oeb_189_r1.gif)\n\
  \n从这里开始，情况会发生一些变化，取决于你使用的是 Internet Explorer 还是符合 W3C 标准的浏览器（如 Netscape、Firefox、Safari、Chrome\
  \ 和 Opera）。在 IE 中，每个 `styleSheet` 对象都有一个以 `rules[]` 数组形式存在的样式规则集：\n\n```javascript\n\
  // Internet Explorer\nvar rulesInStylesheet = document.styleSheets[0].rules;\nvar\
  \ ruleCount = rulesInStylesheet.length;\n```\n\n在其他浏览器中，对象是 `cssRule`，集合被称为 `cssRules[]`：\n\
  \n```javascript\n// Firefox, Netscape, Safari, Opera\nvar rulesInStylesheet = document.styleSheets[0].cssRules;\n\
  var ruleCount = rulesInStylesheet.length;\n```\n\n`rule` 和 `cssRule` 对象的属性非常相似：![190](img/whit_47050502_oeb_190_r1.gif)\n\
  \n在 Firefox、Netscape、Safari、Opera 和 Chrome 等 W3C 浏览器中，`cssRule` 对象的关键属性之一是 `type`。它告诉你是哪种规则，这在查找导入的样式表时特别重要。`type`\
  \ 属性是一个整数，具有以下值：![191](img/whit_47050502_oeb_191_r1.gif) 所有普通样式规则（如类定义）的类型均为 1。第二个重要的属性是\
  \ `selectorText`，它返回规则的选择器（例如使用示例中的 `.myClass`），以及 `style` 对象，它是样式所有属性的引用。\n\n##\
  \ 导入的样式表\n\n除了 `styleSheets`，外部样式表可以使用你见过的 `@import` 指令连接到文档。考虑使用导入的外部样式表，如何在 DOM\
  \ 中定位它？答案取决于你使用的是 IE 还是其他浏览器。\n\n在 Internet Explorer 中，导入包含在 `styleSheet` 对象的特殊属性\
  \ `imports[]` 中。每个导入都是另一个 `styleSheet` 对象，反过来拥有自己的导入集：\n\n```javascript\n// IE 导入\n\
  var someImportRules = document.styleSheets[0].imports[0].rules;\n```\n\n在 Firefox\
  \ 和 Safari 等浏览器中，`@import` 指令是另一个具有特殊属性 `styleSheet` 的规则。该属性是导入样式表的引用：\n\n```javascript\n\
  // Firefox, Netscape, Safari 和 Chrome 导入\nvar someImportRules = document.styleSheets[0].cssRules[0].styleSheet.cssRules;\n\
  ```\n\n# 遍历所有样式表\n\n虽然使用 `styleSheets` 集合获取顶级样式表列表很容易，但如果考虑到导入，这并不是文档样式表的完整列表。要获取所有样式表，你需要遍历每个样式表的\
  \ `imports` 集合（在 IE 中）或每个类型为 3 的 `cssRule`（在其他浏览器中）。为了做到，可能的第一件事是将所有顶级样式表导出到一个普通数组。这样做是为了避免更改内置的\
  \ `styleSheets` 对象：\n\n```javascript\n// 存储所有样式表\nvar styleCollection = [];\n//\
  \ 跟踪查看过的哪些\nvar indexedSheets = 0;\n// 复制所有顶级样式表\nfor (var i = 0; i < document.styleSheets.length;\
  \ i++)\n    styleCollection[styleCollection.length] = document.styleSheets[i];\n\
  ```\n\n然后你希望反复遍历 `styleCollection`，并在发现新导入时添加它们。每次迭代：\n\n```javascript\nwhile (indexedSheets\
  \ < styleCollection.length) {\n    for (var i = indexedSheets; i < styleCollection.length;\
  \ i++) {\n        indexedSheets += 1;\n        if (styleCollection[i].cssRules)\
  \ {\n            // W3C 浏览器\n            for (var x = 0; x < styleCollection[i].cssRules.length;\
  \ x++) {\n                if (styleCollection[i].cssRules[x].type == 3) {\n    \
  \                styleCollection[styleCollection.length] = styleCollection[i].cssRules[x].styleSheet;\n\
  \                }\n            }\n        } else {\n            // Internet Explorer\n\
  \            for (var x = 0; x < styleCollection[i].imports.length; x++) {\n   \
  \             styleCollection[styleCollection.length] = styleCollection[i].imports[x];\n\
  \            }\n        }\n    }\n}\n```\n\n当样式表包含 `cssRules` 集合时，你知道它是符合 W3C 标准的浏览器，必须遍历所有规则以发现导入。否则，在\
  \ IE 的情况下，你只需要遍历 `imports[]` 数组并将每个直接添加到 `styleCollection` 中。最后，你将拥有文档中所有样式表的数组，无论它们是如何包含的。你可以将其抽象为一个整洁的小实用函数，就像我在下面的示例中所做的那样。首先，我向你展示两个外部\
  \ CSS 文档的内容，`main.css` 被 HTML 直接引用：\n\n```css\n@import url(shared.css);\n.myClass1\
  \ {\n    font-weight: bold;\n}\n```\n\n以及被 `main.css` 导入的 `shared.css`：\n\n```css\n\
  .mySharedClass1 {\n    color:#000000;\n}\n```\n\n然后，主 HTML 文档包含了遍历所有样式表的代码以及一些将结果输出到页面的代码（`outputSheetsInformation()`）：\n\
  \n```html\n<html>\n<head>\n    <title>样式表测试</title>\n    <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"main.css\" />\n    <style type=\"text/css\">\n      \
  \  .myClass2 {\n            color: red;\n        }\n    </style>\n</head>\n<script\
  \ type=\"text/javascript\">\nfunction getSheets() {\n    var styleCollection = [];\n\
  \    var indexedSheets = 0;\n    for (var i = 0; i < document.styleSheets.length;\
  \ i++)\n        styleCollection[styleCollection.length] = document.styleSheets[i];\n\
  \    while (indexedSheets < styleCollection.length) {\n        for (var i = indexedSheets;\
  \ i < styleCollection.length; i++) {\n            indexedSheets += 1;\n        \
  \    if (styleCollection[i].cssRules) {\n                // W3C 浏览器\n          \
  \      for (var x = 0; x < styleCollection[i].cssRules.length; x++) {\n        \
  \            if (styleCollection[i].cssRules[x].type == 3) {\n                 \
  \       styleCollection[styleCollection.length] = styleCollection[i].cssRules[x].styleSheet;\n\
  \                    }\n                }\n            } else {\n              \
  \  // Internet Explorer\n                for (var x = 0; x < styleCollection[i].imports.length;\
  \ x++) {\n                    styleCollection[styleCollection.length] = styleCollection[i].imports[x];\n\
  \                }\n            }\n        }\n    }\n    return styleCollection;\n\
  }\n</script>\n</html>\n```\n\n\n\n\n\n```javascript\nfor (var i = indexedStylesheets;\
  \ i < styleCollection.length; i++) {\n    indexedStylesheets += 1;\n    if (styleCollection[i].cssRules)\
  \ {\n        // W3C Browsers\n        for (var x = 0; x < styleCollection[i].cssRules.length;\
  \ x++) {\n            if (styleCollection[i].cssRules[x].type == 3)\n          \
  \      styleCollection[styleCollection.length] = styleCollection[i].cssRules[x].styleSheet;\n\
  \        }\n    } else {\n        // Internet Explorer\n        for (var x = 0;\
  \ x < styleCollection[i].imports.length; x++) {\n            styleCollection[styleCollection.length]\
  \ = styleCollection[i].imports[x];\n        }\n    }\n}\nreturn styleCollection;\n\
  }\n\nfunction outputSheetsInformation() {\n    var stylesheetList = getSheets();\n\
  \    var resultContent = \"\";\n    for (var i = 0; i < stylesheetList.length; i++)\n\
  \        resultContent += \"<p>Stylesheet href:\" + stylesheetList[i].href + \"\
  </p>\";\n    document.body.innerHTML = resultContent;\n}\n</script>\n\n<body onload=\"\
  outputSheetsInformation()\"></body>\n\n</html>\n```\n\n当文档加载且所有外部样式表下载完成后，`onload`\
  \ 事件将触发，并调用 `outputSheetsInformation()`。函数 `getSheets()` 将执行迭代并返回一个包含三个样式表的集合。其中两个是外部的（`main.css`\
  \ 和 `shared.css`），第三个是文档 `head` 中嵌入的 `style` 样式标签。在 Internet Explorer 中，你会在页面看到如下输出：\n\
  Stylesheet href: main.css\nStylesheet href:\nStylesheet href: shared.css\n\n在 Firefox、Safari、Opera\
  \ 以及其他浏览器中，你会看到略有不同：`href` 属性显示的是 CSS 文档的完整路径而不是相对路径：\nStylesheet href: http://localhost/test/js/main.css\n\
  Stylesheet href: null\nStylesheet href: http://localhost/test/js/shared.css\n\n\
  稍后我将为你展示如何扩展这项技术来构建一个 CSS 预加载器，这对于让 CSS 图片在 DHTML 中立即显示非常有用。\n\n在 Safari 和 Konqueror\
  \ 中处理样式表有时会有些棘。不要指望在 Firefox 和 Opera 中生效的所有功能在 Safari 中同样有效。例如，`document.styleSheets`\
  \ 中包含的样式表数组并不一定包含所有通过 `<style>` 元素嵌入的样式。此外，使用标准的 `.disabled` 方法无法轻松禁用样式表。\n\n##\
  \ 添加和移除样式表\n\n如果你想在文档加载后向其附载新的外部样式表，这种方法在 Internet Explorer 和其他浏览器之间再次有所不同。在 IE\
  \ 中，你使用 `document.createStyleSheet()`，它允许向文档添加多达 31 个额外的样式表。其语法为：\n`oStylesheet\
  \ = object.createStyleSheet([sURL][,iIndex])`\n\n第一个参数 `sURL` 指定了新外部样式表的 URL。它不仅可以是一个\
  \ URL，还可以包含以内联 CSS 形式存在的样式信息。对于外部 CSS 文档，它最终会被添加到 `styleSheets` 集合并作为链接对象添加到文档中。如果你为\
  \ `iIndex` 提供一个整数值，它将指示引用在 `styleSheets` 集合中的位置，这对于计算渲染后的样式可能非常重要：`document.createStyleSheet(\"\
  mySheet.css\")`。\n\n在其他浏览器中不支持这种语法。相反，你需要创建一个链接对象并使用 `appendChild()` 将其手动追加到 DOM\
  \ 中。以下工具函数会根据浏览器完成这两项操作：\n\n```javascript\nfunction addSheet(cssURL) {\n    var\
  \ ss = document.createElement(\"link\");\n    ss.type = \"text/css\";\n    ss.rel\
  \ = \"stylesheet\";\n    ss.href = cssURL;\n    if (document.createStyleSheet)\n\
  \        document.createStyleSheet(cssURL);\n    else\n        document.getElementsByTagName(\"\
  head\")[0].appendChild(ss);\n}\n```\n\n注意，对于非 IE 浏览器，设置 link 标签的 `type` 和 `rel`\
  \ 属性非常重要，否则浏览器不会将其识别为样式表。移除样式表可以通过几种不同的方式实现最简单的方法是将样式表的 `disabled` 属性设置为 `true`：\n\
  ```javascript\n// 禁用第一个样式表\ndocument.styleSheets[0].disabled = true;\n```\n这对于外部链接或使用\
  \ `<style>` 标签的样式表都有效。当你禁用一个样式表时，DOM 将进行重流和重绘以更新新样式。\n\n如果你真的想彻底删除一个样式表（可能是为了替换另一个），你必须使用\
  \ DOM。首先，你需要从 `styleSheet` 对象获取 DOM 中对应样式或链接对象的引用。在 IE 中，这是 `owningElement`。在其他浏览器中，它是\
  \ `ownerNode`。然后你使用 `removeChild()` 将其从文档中删除：\n\n```javascript\nfunction disableSheet(index)\
  \ {\n    var sheet = document.styleSheets[index];\n    var containerEl = sheet.ownerNode\
  \ || sheet.owningElement;\n    if (containerEl)\n        containerEl.parentNode.removeChild(containerEl);\n\
  }\n```\n同样，当你执行此操作时，DOM 将进行重流和重绘以反映新样式。\n\n## 遍历所有规则\n\n一旦你有了文档中所有样式表的列表，获取所有规则就简单了。只需遍历每个样式表的\
  \ `rules[]`（IE）或 `cssRules[]`（其他）集合即可：\n\n```javascript\n// 使用本章早些介绍的 getSheets\
  \ 获取样式表列表\nvar stylesheetList = getSheets();\nvar resultContent = \"\";\nfor (var\
  \ i = 0; i < stylesheetList.length; i++) {\n    var ruleSet = (stylesheetList[i].cssRules\
  \ || stylesheetList[i].rules);\n    for (var x = 0; x < ruleSet.length; x++)\n \
  \       resultContent += \"<p>Rule selectorText: \" + ruleSet[x].selectorText +\
  \ \"</p>\";\n}\ndocument.body.innerHTML = resultContent;\n```\n如前所述，`selectorText`\
  \ 属性将返回描述应用的字符串。使用本章之前的示例将产生如下输出：\nRule selectorText: body\nRule selectorText: .myClass\n\
  \n## 搜索规则\n\n既然你已经理解如何遍历样式集合，那么构建一个样式“搜索”工具就很简单，你可以传入一个搜索字符串（如类选择器），并返回包含该字符串的 `selectorText`\
  \ 的规则。如果你想通过在全局样式表中查找样式来修改页面样式，这将非常有用。首要任务是用类似于我在上一节的方法获取所有样式列表：\n\n```javascript\n\
  function searchForRules(searchString, exact) {\n    var stylesheetList = getSheets();\n\
  \    // 这将存储我们的样式列表\n    var styleList = [];\n    // 遍历所有样式表\n    for (var i = 0;\
  \ i < stylesheetList.length; i++) {\n        var ruleSet = (stylesheetList[i].cssRules\
  \ || stylesheetList[i].rules);\n        for (var x = 0; x < ruleSet.length; x++)\n\
  \            if (exact && ruleSet[x].selectorText == searchString)\n           \
  \     styleList.push(ruleSet[x]);\n            else if (!exact && ruleSet[x].selectorText.indexOf(searchString)\
  \ > -1)\n                styleList.push(ruleSet[x]);\n    }\n    return styleList;\n\
  }\n```\n\n## 读取和写入样式属性\n\n一旦你拥有了规则或 cssRule 对象的引用，就可以通过 `style` 对象访问其所有属性的对象表示。考虑以下示例：\n\
  \n```css\n.myRule {\n    background-color:#f0f0f0;\n}\n```\n\n\n\n\n\n```css\nwidth:25px;\n\
  height:100px;\n}\n```\n\n你可以通过 `style` 对象修改这些键/值属性中的任何一个。例如，如果你想将样式的背景颜色从灰色改为浅蓝色，只需使用\
  \ `style` 对象的 `backgroundColor` 属性即可：`document.styleSheets[0].rules[0].style.backgroundColor=\"\
  #ccccff\";`。\n\n你对样式属性的任何更改都会立即反映在受影响的元素上。你也可以通过直接修改它们的 `inline` 属性来影响这些元素。例如：\n\
  ```javascript\ndocument.getElementById('myElementID').style.backgroundColor=\"#ccccff\"\
  ;\n```\n\n如果你随后检查 DOM 的渲染 HTML，你会发现 `background-color` 属性已经嵌入到元素的 `style` HTML 属性中：\n\
  ```html\n<div id=\"myElementID\" style=\"backround-color: #ccccff\"></div\n```\n\
  \n这也是你为了实现动态 HTML（Dynamic HTML）动画而修改 DOM 的方法。例如，当用户点击链接时切换 div（显示或隐藏），你可以使用类似的技术。看下这个具体的示例。首先，创建一个作为“展开或收起”链接的超链接，以及一个包含你想要展示内容的\
  \ div：\n\n```html\n<a href=\"#\"\" onclick=\"return toggleContent(this);\" id=\"\
  readMore\">点击阅读更多！</a>\n<div id=\"readMoreContent\" style=\"display: none;\">\n\
  \    我们的小组件被国际组件评级学院评为比其他领先组件快 22% 且更耐用。尝试我们的免费样本并亲自发现吧！\n</div\n```\n\n在这个示例中，我将超链接的\
  \ `onclick` 事件连接到一个名为 `toggleContent()` 的函数，并将链接引用作为参数传递。超链接和包含显示内容的 div 具有相同的 ID\
  \ 根（`readMore` 和 `readMoreContent`）。我将使用对象引用和 ID 来获取 div 的引用。\n\n由于我将 `display:none`\
  \ 属性内联写入了 HTML 的 `style` 属性，我将能够通过 `DIV` 的 `style` 属性读取它。如果样式是继承的而不是内联的，我无法这样做。相反，我可以尝试确定\
  \ div 的计算后样式（computed style）——我将在“计算样式”（Computed Styles）章节中讨论这个话题。\n\n现在来看 `toggleContent()`\
  \ 函数，它会在用户点击时隐藏或显示该 div：\n\n```javascript\nfunction toggleContent(hrefObj) {\n \
  \   var divID = hrefObj.id + \"Content\";\n    var divObj = document.getElementById(divID);\n\
  \    if (divObj.style.display == \"none\")\n        divObj.style.display = \"block\"\
  ;\n    else\n        divObj.style.display = \"none\";\n    return false;\n}\n```\n\
  \n首先，我通过从链接的 ID 构建一个 ID 来获取 div 的引用。接下来，我检查 div 的内联显示样式属性，查看它是 block（可见）还是 none（隐藏）。在设置新属性后，我从函数返回\
  \ `false`，防止超链接的默认行为。\n\n## 添加和删除规则\n\n动态创建一个新的 CSS 规则需要一些工作。在你可以任意创建规则之前，必须先创建一个样式表来放置该规则。你也可以将其附加到现有的样式表中，但无法保证文档甚至*拥有*一个样式表。因此在向文档添加新规则之前，让我们获取一个样式表的引用（如果有必要，则创建一个）：\n\
  \n```javascript\n// 检查是否有可以附加此规则的样式表..\nif (document.styleSheets.length > 0)\n \
  \   var cssObj = document.styleSheets[0];\nelse\n    if (document.createStyleSheet)\n\
  \        var cssObj = document.createStyleSheet();\n    else {\n        // 我们在符合\
  \ W3C 标准的浏览器中，创建一个表。\n        var ss = document.createElement(\"style\");\n    \
  \    ss.type = \"text/css\";\n        document.getElementsByTagName(\"head\")[0].appendChild(ss);\n\
  \        var cssObj = document.styleSheets[0];\n    }\n```\n\n现在你保证在 `cssObj` 中有一个\
  \ `styleSheet` 引用，可以添加规则了。在 Internet Explorer 中，你可以使用 `styleSheet` 对象上的 `addRule()`\
  \ 方法，其语法如下：\n`plNewIndex = styleSheetObject.addRule(sSelector, sStyle[,iIndex])`\n\
  \n第一个参数 `sSelector` 是一个包含规则选择器的字符串（例如 `.className`）。它也可以是一个由逗号分隔的选择器列表。第二个个参数 `sStyle`\
  \ 是一个包含所有样式的字符串。它的格式化应该像你在文档内部编写样式一样，每个属性用分号分隔，键/值对用冒号分隔。最后一个可选参数是规则放置在集合中的位置。默认情况下，它位于末尾。\n\
  \n等待，让我们重新检查所提供文本的实现逻辑。源文本包含一些混乱/重复的片段。我将根据提供的逻辑对其进行清理：\n\n```javascript\nfunction\
  \ addNewRule(selector, ruleText) {\n    if (cssObj.addRule) {\n        cssObj.addRule(selector,\
  \ ruleText);\n    } else {\n        cssObj.insertRule(selector + \"{\" + ruleText\
  \ + \"}\", 0);\n    }\n}\n```\n\n等待，查看提供的原始文本，它有些重复且破碎。我将提供所描述逻辑的清理版本：\n\n```javascript\n\
  // 添加规则的逻辑\nif (cssObj.addRule) {\n    cssObj.addRule(selector, ruleText);\n} else\
  \ {\n    cssObj.insertRule(selector + \"{\" + ruleText + \"}\", 0);\n}\n```\n\n\
  要删除规则，你在 Internet Explorer 中使用 `removeRule()` 方法，其语法为：`styleSheetObject.removeRule([iIndex])`。参数\
  \ `iIndex` 是集合中要删除的顺序位置。如果你不指定 `iIndex`，它将删除数组中的第一个规则。在其他浏览器中，有一个对应的 `deleteRule()`\
  \ 方法，语法相似。与 IE 不同，这里的 `iIndex` 参数是强制性的。要删除第一条规则，传递 0，最后一条规则是 `cssRules.length-1`。这里有一个删除第一个样式表中最后一个规则的简单实用函数：\n\
  \n```javascript\nfunction deleteLastRule() {\n    var styleObj = document.styleSheets[0];\n\
  \    if (styleObj.cssRules) {\n        styleObj.deleteRule(styleObj.cssRules.length-1);\n\
  \    } else {\n        styleObj.removeRule(styleObj.cssRules.length-1);\n    }\n\
  }\n```\n\n## 计算样式\n\n我已经向你展示了如何使用 CSS 的 `style` 对象表示来读写样式属性。例如，你可以通过如下操作读取 div 的内联\
  \ `backgroundColor` 属性：`document.getElementById('myDivID').style.backgroundColor`。\n\
  \n然而，大多数情况下这并不是一个实行的解决方案，因为并不是应用于元素的样式属性都是以*内联*方式表示的——它们是继承的。当浏览器渲染元素时，它会根据流向 DOM\
  \ 树到该点的所有级联样式来*计算*样式。如果你在样式表中有一个适用于*所有* div 的规则定义如下：\n\n```css\ndiv{\n    background-color:yellow;\n\
  }\n```\n\n\n\n\n\n如果你尝试通过 `div` 元素的直接样式对象来执行相同的操作，你将无法获取 `backgroundColor` 的任何值。为什么呢？因为元素的\
  \ `style` 对象只包含 `inline` 属性。相反，你需要的是 `computed style`（计算样式）。在 Internet Explorer\
  \ 中，你可以通过 `currentStyle` 对象获取它，它与 `style` 相同但包含了计算后的样式。遗憾的是，这是一个只读对象。如果你想进行更改，需要在\
  \ `style` 对象上进行。要获取计算后的 `backgroundColor`，只需将 `style` 替换为 `currentStyle`：`document.getElementById('myDivID').currentStyle.backgroundColor`。\n\
  \n在 Firefox、Safari、Opera 或 Chrome 等符合 W3C 标准的浏览器中，你使用方法 `document.defaultView.getComputedStyle()`，其语法如下：\n\
  \n`styleObj = document.defaultView.getComputedStyle(element, pseudoElt);`\n\n你也可以通过\
  \ `window` 对象访问 `getComputedStyle()`。大多数情况下，你唯一需要考虑的参数是 `element`，它是指向目标节点的 DOM\
  \ 引用。使用这种方法对 `backgroundColor` 执行相同的操作，可以这样做：\n\n`document.defaultView.getComputedStyle(document.getElementById('myDivID')).backgroundColor`\n\
  \n在下面的演示中，我构建了一个简单的工具函数，它根据浏览器进行分支并返回给定 DOM 节点的计算属性：\n\n```html\n<html\n<head>\n\
  \    <title>Getting the Computed Style</title>\n    <style type=\"text/css\">\n\
  \        .myCSSClass {\n            background-color:yellow;\n            border:\
  \ 1px dotted black;\n        }\n    </style>\n</head>\n<script type=\"text/javascript\"\
  >\nfunction computeStyle (myDivID, styleAttr){\n    var elObj = document.getElementById(myDivID);\n\
  \    if (elObj.currentStyle)\n        var computed = elObj.currentStyle;\n    else\n\
  \        var computed = document.defaultView.getComputedStyle(elObj, null);\n  \
  \  return computed[styleAttr];\n}\n</script>\n<<body>\n<div class=\"myCSSClass\"\
  \ id=\"myDiv\">\n我们的组件被国际组件评级学院评定为比其他领先组件快 22%，且更耐用。尝试我们的免费样品并亲身验证！\n</</div>\n\
  <button onclick=\"alert(computeStyle('myDiv', 'backgroundColor'));\">获取背景的计算样式</button>\n\
  </</body>>\n</html>\n```\n\n关于计算样式需要注意的一点是，不同浏览器返回的字符串之间存在差异。在 Internet Explorer\
  \ 中，宽度和内边距等属性单位将按照它们在样式表中出现的形式精确返回（例如 \"12px\" 或 \"1em\"），而 W3C 浏览器将对这些值进行规范化处理。同样，在\
  \ W3C 浏览器中获取十六进制颜色时，它们会被转换为 RGB 值（例如 \"rgb(10,12,150)\"），但在 IE 中，它们将按照在样式表中出现的形式精确返回。\n\
  \n## IE 的 filter 对象\n\n从 Internet Explorer 4.0 开始，可以使用一种对 IE 而言的专有 CSS 属性 `filter`\
  \ 在网页上层叠丰富的多媒体风格的视觉效果。在那个不支持 32 位图像的时代，这是一个非常强大的工具。如今，`filter` 仅用于为 Internet Explorer\
  \ 6 及以下版本提供向后兼容的 32 位 PNG 支持和透明度。由于该属性仍然具有一定的相关性，查看设置过滤器与其他 CSS 属性之间的语法差异是值得的。\n\
  \n在 CSS 类中，你可以使用属性描述符在元素上指定 32 位 PNG 背景：\n\n```css\n.mySemiOpaqueDiv {\n    filter:progid:DXImageTransform.Microsoft.AlphaImageLoader(src='myimage.png',sizingMethod='scale');\n\
  }\n```\n\n要用 JavaScript 实现等效果，你必须保留对 progid 的引用。实现方式如下：\n\n```javascript\nvar divObj\
  \ = document.getElementById('myDiv');\ndivObj.style.filter['DXImageTransform.Microsoft.AlphaImageLoader'].src\
  \ = \"myimage.png\";\ndivObj.style.filter['DXImageTransform.Microsoft.AlphaImageLoader'].sizingMethod\
  \ = \"scale\";\n```\n\n当你开始涉及此类 DirectX 过滤器时，请务必对你的页面进行严格测试，以确保稳定性和兼容性。CSS 过滤器在某些情况下会导致不稳定和性能下降。\n\
  \n# 总结\n\n\n\n\n\n在本章中你探索了许多与 CSS 操作相关的话题。具体来说，你学习了：\n\n- 自 CSS 规范发明以来，它已经经过了多次修订。现代浏览器支持截至\
  \ 2.1 版本的大部分规范内容，少数浏览器已支持仍处于初步阶段的 CSS3 标准。\n- 样式在 DOM 中以多种方式表示。存在 `link` 和 `style`\
  \ HTML 元素。导航规则更实用的方法是通过 `styleSheets` 集合，它包含了文档中顶层样式表的列表。\n- 在 Internet Explorer\
  \ 中，你通过 `rules[]` 数组访问样式表的规则集合。在其他浏览器中，这被称为 `cssRules[]`，但其他部分是相同的。\n- 样式属性的读取和写入是通过\
  \ `style` 对象实现的。处理“计算后样式”（*computed style*，即在应用所有规则后应用于元素上的样式）在 IE 中可以通过 `currentStyle`\
  \ 对象实现。在其他浏览器中，通过调用 `document.defaultView.getComputedStyle()` 来访问该对象。\n\n在第 16 章中，我将\
  \ CSS 再向前迈几步。CSS 是动态 HTML（Dynamic HTML）编程的基石，它是你让页面变得生动的工具。通过 DHTML，你可以制作元素动画、创建拖放效果，并真正让页面变得\
  \ `dynamic`。\n\n# 16 动态 HTML\n\n虽然 HTML、XHTML、CSS 和 JavaScript 等术语指的是特定的技术，但 `Dynamic\
  \ HTML`（`DHTML`）并不是指一个离散的特性，而是技术的集合以及一种让网页活起来的方法。DHTML 涉及使用 JavaScript 通过操作 CSS\
  \ 以及 DOM 和页面元素来控制页面上的 HTML。开发社区对于 DHTML 是否真的不同于渐进式增强（`Progressive Enhancement`）、`Ajax`\
  \ 或 DOM 脚本（`DOM Scripting`）等方法存在一些歧义。在大多数情况下，这些术语指的是非常相似的内容，你通过这些方法所的操作也可以被视为动态\
  \ HTML，因为它们涉及了 JavaScript、CSS 和 DOM 的使用。\n\n在 DHTML 的伞下，你可以产生广泛的可能效果和交互。你在网页浏览器中看到的、大多数超出静态\
  \ HTML 范围的交互（如模态窗口、拖放和简单动画）都是通过 DHTML 实现的。在这方面，通过创造性地应用你已经读过的某些核心概念（包括面向对象开发、非侵入式事件模型、DOM\
  \ 和 CSS），可以实现惊人的创新。\n\n多年来，DHTML 技术一直受到相当多的批评。一些人认为，如果你在浏览器中使用动态功能，它将不具有“可访问性”（`accessible`）。另一些人坚持认为，浏览器之间的差异使得调试和通常提供质量保证是一项不可逾越的任务。近年来，由于浏览器厂商之间快速的现代化和合作，网络已经拥抱了\
  \ DHTML 技术。在大多数情况下，主流浏览器都以非常相似的方式支持同一套技术，使得可以 `layer on`（叠加）一些丰富的用户界面行为，而不需要花费太多时间调试代码。像\
  \ `Firebug` 或 `IE Web Developer Toolbar` 这样非常好的调试工具的出现也使得处理 DHTML 变得简单得多，使其成为大多数\
  \ JavaScript 开发人员的可行工具。现用组件和 JavaScript 框架的普及也让实现动态功能变得容易得多。\n\n由于 DHTML 很大程度上关于技术的结合，在本章中，我将介绍许多你可以在自己的\
  \ Web 应用中构建并复用的方法，以为页面添加额外的交互层。在大多数情况下，我将使用已经介绍的概念，因此如果你已经读过关于事件、DOM 和 CSS 的章节，你将很好地受益于这里的材料。首先，我将讨论\
  \ CSS 在 DHTML 中的作用，并介绍几种按钮悬停（button rollovers）技术，这是 DHTML 最早且最常用的之一。随后，我将深入探讨定位问题、颜色和透明度以及动画。最后，我通过几个常见的\
  \ DHTML 示例（如模态对话框和 HTML 表单的验证提示）来结束本章。结束时，你应该很好地掌握开发者如何使用 DHTML 构建丰富的用户界面。\n\n##\
  \ CSS 的作用\n\n向元素应用特定的 CSS 属性是 DHTML 的基石。当你想要以某种方式改变页面的物理外观时，你必须以动态的方式思考对象的 CSS 状态。例如，考虑一个可折叠区域的情况。为了连接一个\
  \ `div`，使其在点击按钮时显示，在再次点击时消失，你需要考虑元素 CSS 可能处于的各种状态：\n\n- **初始状态：** `div` 是可见还是隐藏的？你是通过给\
  \ `div` 应用带有 `display:none` 的 CSS 类来实现此点的，还是直接在 HTML 中设置内联 CSS 属性？\n- **过渡状态：**\
  \ 当用户点击显示 `div` 时，它在那一刻的 CSS 是什么样的？你需要让 `div` 从不可见状态动画到可见状态（需要一个 `tween` 补间动画），还是一个简单的切换（toggle）？在切换的情况下，可能只需要给元素应用一个新的\
  \ CSS 类即可。\n- **静止或恢复状态：** 元素是恢复到原始状态，还是有 CSS 需要处于的第三种状态？同样，这仅仅是“撤销”（`undoing`）过渡状态的变化，还是比这更复杂？\n\
  \n通常，DHTML 行为可以通过动态添加或删除 CSS 类来实现。为此，编写一些基础的 `addClass()` 和 `removeClass()` 工具函数是有用的，这些函数负责解析元素的\
  \ `className` 字符串以获取类名。我将从一个根据元素是否 `has` 特定类来返回值的函数开始：\n\n```javascript\nfunction\
  \ hasClass(el, classNm) {\n    var cNames = el.className.split(' ');\n    for (var\
  \ i = 0; i < cNames.length; i++)\n        if (cNames[i] == classNm)\n          \
  \  return true;\n    return false;\n}\n```\n\n它是通过将 `className` 字符串按空格分隔符分成数组，然后遍历每个类并比较字符串。这样做是因为当元素应用了多个类时，它看起来像\
  \ \"myClass0 myClass1 myClass2\"。这个函数对于根据应用的类确定元素的状态非常有用。我在下面的 `addClass()` 工具函数中使用它：\n\
  \n```javascript\nfunction addClass(el, classNm){\n    if (!hasClass(el, classNm))\n\
  \        el.className+= \" \" +classNm;\n}\n```\n\n通过编程添加类只需检查类是否已经应用，如果没有则将其作为字符串追加到\
  \ `className` 中。删除类稍微复杂一点，因为它涉及作为数组遍历每个类，将匹配项置为空，然后重新组装字符串：\n\n```javascript\nfunction\
  \ removeClass(el, classNm) {\n    var cNames = el.className.split(' ');\n    for\
  \ (var i = 0; i < cNames.length; i++)\n        if (cNames[i] == classNm)\n     \
  \       cNames[i] = \"\";\n    el.className = cNames.join(' ');\n}\n```\n\n\n\n\n\
  通过这种方式，你可以对 DOM 的外观产生巨大的变化。正如你在第 15 章中看到的，这并不是动态更改 CSS 的唯一方法。很多时候，你只是随着时间的推移`微调`\
  \ CSS 属性，例如位置属性、透明度或颜色。正是通过对 `top`、`left`、`color`、`width` 和 `height` 等 CSS 属性进行微小但迭代的更改，你创造了动画的*幻觉*。当你尝试这些属性时，请务必参阅第\
  \ 15 章，查看带有对应 DOM 属性名的 CSS 属性表。当然，当你处理 CSS 时，还必须记住 DOCTYPE 对 CSS 确切`如何` 被渲染的影响。在第\
  \ 13 章中，我详细介绍了文档类型如何改变不同浏览器对 CSS 的解释方式。\n\n# 窗口与文档几何结构\n\nDOM 和窗口我尚未介绍的关键剩余功能之一是\
  \ `geometry`（几何结构）。我指的是窗口本身的布局特性，包括可视区域的 `width` 和 `height`，以及文档本身的 `width` 和 `height`。如果你在页面上`绝对`地定位元素（通过\
  \ X 和 Y 坐标），你可能需要知道这些，例如你想显示一个自定义对话框且它必须位于用户显示屏的中间。遗憾的是，图 16-1 中看到的属性在不同浏览器`或`文档类型中的存在方式并不相同。图\
  \ 16-1![192](img/whit_9780470550502_oeb_192_r1.jpg) 要获取大多数浏览器中的窗口，只需要检查非标准的 `window.innerWidth`\
  \ 和 `window.innerHeight` 属性。这将告诉你窗口宽度，`包括滚动条`，无论文档类型如何。这在 Opera 8+、Firefox、Safari\
  \ 和 Chrome 中均有效。但在 Internet Explorer 中，不支持这种支持。相反，你必须查看文档的 `clientWidth` 和 `clientHeight`。遗憾的是，代表文档的合适元素取决于你处于`quirks`（怪异）还是\
  \ `standards`（标准）模式。在怪异模式下，通过 `document.body` 获取，在标准模式下通过 `document.documentElement`\
  \ 获取：\n\n```javascript\nvar doc = (document.compatMode == 'CSS1Compat') ? document.documentElement\
  \ : document.body;\n\nif (window.innerWidth) {\n    // 大多数浏览器（FF, Opera, Safari,\
  \ Chrome）中的浏览器尺寸\n    var browserWidth = window.innerWidth;\n    var browserHeight\
  \ = window.innerHeight;\n} else {\n    // IE\n    var browserWidth = doc.clientWidth;\n\
  \    var browserHeight = doc.clientHeight;\n}\n```\n\n这是等式的另一半。要获取文档尺寸，情况会变得复杂一些。首先，让我们定义\
  \ `document dimensions`（文档尺寸）。如果你有一个非常小的文档，只有 100 像素高，但窗口有 500 像素高，文档的高度是 100 像素还是\
  \ 500 像素？对于大多数用途来说，说文档的高度和宽度`至少`与窗口一样但可能更大是正确的。然而，浏览器在内部可能并非以这种方式表示它。你需要检查文档是否小于窗口。如果是，则使用窗口值。要获取文档的内部表示，使用文档的\
  \ `scrollWidth` 和 `scrollHeight`。再次，根据 DOCTYPE：\n\n```javascript\nvar docWidth =\
  \ doc.scrollWidth;\nvar docHeight = doc.scrollHeight;\n```\n\n配合窗口的实际尺寸，有时知道滚动条是否存在是有用的。通过这种方式你可以获得这些尺寸。将这些内容封装成一个方便的函数，看起来如下：\n\
  \n```javascript\nfunction getWindowGeometry() {\n    var doc = (document.compatMode\
  \ == 'CSS1Compat') ? document.documentElement : document.body;\n\n    if (window.innerWidth)\
  \ {\n        // 大多数浏览器（FF, Opera, Safari, Chrome）中的浏览器尺寸\n        var browserWidth\
  \ = window.innerWidth;\n        var browserHeight = window.innerHeight;\n    } else\
  \ {\n        // IE\n        var browserWidth = doc.clientWidth;\n        var browserHeight\
  \ = doc.clientHeight;\n    }\n\n    var docWidth = doc.scrollWidth;\n    var docHeight\
  \ = doc.scrollHeight;\n\n    return {\n        browserWidth: browserWidth,\n   \
  \     browserHeight: browserHeight,\n        docWidth: docWidth,\n        docHeight:\
  \ docHeight\n    };\n}\n```\n\n## 获取滚动条宽度\n\n获取滚动条宽度的方法似乎有点复杂。这种方法通过创建元素来测试这些值。将这些操作封装成一个方便的函数，看起来如下：\n\
  \n```javascript\nfunction getScrollbarWidth() {\n    // 创建一个外部 div\n    var dv =\
  \ document.createElement('div');\n    dv.style.position = 'absolute';\n    dv.style.left\
  \ = '-1000px';\n    dv.style.top = '-1000px';\n    dv.style.width = '100px';\n \
  \   dv.style.height = '100px';\n    dv.style.padding = '0px';\n    dv.style.margin\
  \ = '0px';\n    dv.style.overflow = 'scroll';\n    dv.style.border = '0px';\n\n\
  \    // 将其添加到 DOM\n    document.body.appendChild(dv);\n\n    // 内部 div 改变滚动区域以产生滚动条\n\
  \    var inn = document.createElement('div');\n    inn.style.position = 'relative';\n\
  \    inn.style.border = '0px';\n    inn.style.height = '200px';\n    inn.style.padding\
  \ = '0px';\n    inn.style.margin = '0px';\n    dv.appendChild(inn);\n\n    // 现在它们在\
  \ DOM 内部，通过减去内部元素的 offsetWidth 来计算滚动条宽度\n    var scrollbarWidth = 100 - inn.offsetWidth;\n\
  \n    // 最后，移除原始 div 以免污染\n    document.body.removeChild(dv);\n\n    return scrollbarWidth;\n\
  }\n```\n\n\n\n\n在 DHTML 脚本中，开发者测量 DOM 元素的宽度和高度，这并不罕见。他们这样做有许多原因。有时这样做是为了帮助将其他元素定位在它们的上方或侧面，有时是为了为复杂的动画计算像素位置。元素的宽度和高度由\
  \ DOM 属性 `offsetWidth` 和 `offsetHeight` 描述。虽然它们不是任何官方规范的一部分，但它们得到了非常广泛的支持。图 16-2\
  \ 展示了这些属性如何融入元素的整体布局中。图 16-2![193](img/whit_9780470550502_oeb_193_r1.gif)\n\n在 JavaScript\
  \ 中，当你访问这些属性时，你将得到一个数值，该值可以直接用于任何计算而无需进一步处理（这与 CSS 数字不同）。例如：\n\n```html\n<html>\n\
  <head><title>Element Dimensions</title></head>\n<body>\n    <div id=\"testDiv\"\
  >\n        <h1>Hello World!</h1>\n    </>\n    <script type=\"text/javascript\"\
  >\n        var tdiv = document.getElementById('testDiv');\n        document.write(\"\
  Div width: \" + tdiv.offsetWidth + \"<br />\");\n        document.write(\"Div height:\
  \ \" + tdiv.offsetHeight + \"<br />\");\n    </script>\n</body>\n</html>\n```\n\n\
  由于 `div` 将占据页面的整个宽度，结果将取决于此因素以及其他几个因素。在我的屏幕上，它的输出为：\nDiv width: 1175\nDiv height:\
  \ 36\n\n## 图像切换与悬停效果 (Image Swapping and Rollovers)\n\nDHTML 最早的使用可能是为了在用户鼠标悬停在按钮上时产生悬停效果。在支持任何类型\
  \ DHTML 的极早期浏览器中，这是可以实现的（尽管方式很迂回），而且这种技术一直使用至今。可以使用一些内联脚本实现原始的悬停效果：\n\n`<img src=\"\
  button.gif\" onmouseover=\"this.src='button_hover.gif'\" onmouseout=\"this.src='button.gif'\"\
  \ onclick=\"window.location='/store/'\">`\n\n在 `onmouseover` 事件绑定中，`this` 指向图像对象，因此\
  \ `this.src` 直接指向元素的源。当用户用鼠标悬停在图像上时，`src` 将动态更改。这种方法有几个缺点。首先，作为按钮，这种方法极不符合可访问性（inaccessible）。使用屏幕阅读器的用户很难理解这是一个按钮或与其进行交互。另一个问题是，浏览器在\
  \ `src` 更改时必须下载 `button_hover.gif`。这将导致突兀的效果，因为悬停状态只有几秒钟后才会出现。第三个问题是它只适用于按钮这一狭用途。如果你想让页面更广泛的区域在鼠标悬停时做出反应怎么办？第四个问题仅仅是将你的代码内联在图像标签中是混乱且难以维护的，特别是当有很多按钮时。\n\
  \n这些都是问题。为了让我的解决方案简单明了，我将分步骤解决它们。如果我使用 CSS 类而不是切换图像的 `src` 属性，就可以避免突兀的重绘效果（尽管图像仍然必须下载）。此外，通过将此按钮转换为超链接，它现在是一个可访问的链接，搜索引擎和用户都可以遵循并理解它：\n\
  \n```css\n<style type=\"text/css\">\n.rollover {\n    background-image: url(button.png);\n\
  \    background-repeat:none;\n    display:block;\n    width:162px;\n    height:40px;\n\
  \    color:white;\n}\n.rollover:hover {\n    background-image: url(button_hover.png);\n\
  }\n</style>\n```\n\n```html\n<a href=\"/store/\" class=\"rollover\">Store </a>\n\
  ```\n\n通过使用 CSS，我成功完全消除了对 JavaScript 来实现悬停效果。使用的两张图像见 图 16-3。当超链接处于 `:hover` 状态时，这会产生很好的高亮效果。图\
  \ 16-3![194](img/whit_9780470550502_oeb_194_r1.jpg)\n\n仍然存在用户悬停在按钮上时下载图像的问题。这个问题的解决方案是精灵图（sprites）。精灵图是一种在许多\
  \ DHTML 小部件中使用的技术。它基本上涉及使用背景将一张大图像的部分置于页面的特定区域上，以创建具有独立图像的效果，但复用同一张大图像。我可以通过将两张图像合并为一张，将按钮示例转换为使用精灵图，如\
  \ 图 16-4 所示。图 16-4![195](img/whit_9780470550502_oeb_195_r1.gif)\n\n为了解决用户悬停在按钮时下载图像的问题，我们可以使用\
  \ `background-position` 属性来移动精灵图的显示区域。这样，只需要下载一次大图，就可以在悬停时显示不同的部分。\n\n```css\n/*\
  \ 示例精灵图 */\n.rollover {\n    background-image: url(sprite.png);\n    background-position:\
  \ 0 0px;\n    /* ... */\n}\n.rollover:hover {\n    background-position: 0 -40px;\n\
  }\n```\n\n\n\n\n\n这会将原始元素的引用连同事件对象一起传递给处理器。我希望这个设置函数在页面的 `onload` 事件中被调用，因此为了简单起见，我将它直接作为内联事件添加到\
  \ body 标签上：`<body onload=\"addHandlers()\">`。\n\n现在，我将使用 `mouseenter` 和 `mouseleave`\
  \ 技术创建 `hoverElement()` 和 `unHoverElement()`：\n\n```javascript\nfunction hoverElement(e,\
  \ oTarget) {\n    var isChildOf = function(pNode, cNode) {\n        if (pNode ===\
  \ cNode)\n            return true;\n        while (cNode && cNode !== pNode)\n \
  \           cNode = cNode.parentNode;\n        return cNode === pNode;\n    }\n\
  \    var target = e.srcElement || e.target;\n    if (!oTarget)\n        oTarget\
  \ = target;\n    var relTarg = e.relatedTarget || e.toElement;\n    if (document.attachEvent\
  \ || !isChildOf(oTarget, relTarg))\n        addClass(oTarget, \"regionHighlight\"\
  );\n}\n\nfunction unHoverElement(e, oTarget) {\n    var isChildOf = function(pNode,\
  \ cNode) {\n        if (pNode === cNode)\n            return true;\n        while\
  \ (cNode && cNode !== pNode)\n            cNode = cNode.parentNode;\n        return\
  \ cNode === pNode;\n    }\n    var target = e.srcElement || e.target;\n    if (!oTarget)\n\
  \        oTarget = target;\n    var relTarg = e.relatedTarget || e.toElement;\n\
  \    if (document.attachEvent || !isChildOf(oTarget, relTarg))\n        removeClass(oTarget,\
  \ \"regionHighlight\");\n}\n```\n\n如果浏览器是 Internet Explorer，`document.attachEvent()`\
  \ 检查将允许事件代码触发；否则，在每情况下，必须遍历 DOM 来验证 `relatedTarget` 是否不是容器元素的祖元素。这将有效地控制事件的触发，使得\
  \ `mouseenter` 的代码只在用户鼠标悬在元素上时触发一次，而当他在元素内部移动鼠标时不触发（`mouseleave` 也是如此）。\n\n你会发现这种技术经常派用。像\
  \ MooTools 和 JQuery 这样的 JavaScript 框架支持它们自己的 `mouseenter` 和 `mouseleave` 函数，让你无需自己完成所有这些繁重的工作。你可以在几乎任何情况下在此复用这种技术。\n\
  \n# 定位\n\n许多 DHTML 组件涉及定位非常精确的块级元素，如 div。例如，工具提示组件可能会在页面上的某些文本旁边放置一个 div。滑块控件将有一个\
  \ div 位于两个端点之间的平面上。下拉菜单会在页面其他内容之上的浮框内显示其子菜单项。要创建这些效果，你必须理解定位的细微差别，包括如何定位物体以及如何确定元素的位置。\n\
  \n## 绝对定位与相对定位\n\n在 CSS2 规范中，架构师们意识到开发者需要一种方式来控制元素的绝对定位（例如在指定的 x,y 处放置一个 div）和相对定位（例如将一个\
  \ div 放置在另一个 div 下方 20 像素处）。因此，CSS 定位诞生了。这里有几种不同的定位类型，但有两种类型在 DHTML 中特别有用。\n\n###\
  \ 绝对定位\n\n当使用 CSS 属性设置 `position:absolute` 时，你可以强制任何元素出现在文档的标准流和布局之外，并在特定的坐标上覆盖在其他内容之上。以下元素将不会出现在标题下方；它将出现在标题上方：\n\
  \n```html\n<html>\n<body>\n    <h1>Heading</h1>\n    <div style=\"position:absolute;\
  \ top:10px;left:10px;\">Hello World</div>\n</body>\n</html>\n```\n\n属性 `top:10px`\
  \ 和 `left:10px` 告诉浏览器，该元素将距离最顶部相对元素的顶部 10 像素。（注：原文重复了多次 `top:10px` 和 `left:10px`\
  \ 的描述，我将遵循核心逻辑）。\n\n### 相对定位\n\n使用相对定位，你拥有相同的四个边缘（上、下、左、右），但位置不是相对于文档，而是相对于元素本身。\n\
  \n```html\n<p>Paragraph 1</p>\n<p style=\"position:relative; left:20px;\">Paragraph\
  \ 2</p>\n<p>Paragraph 3</p>\n```\n\n相对定位的另一个有用功能是，包含在内部的绝对定位元素是相对于该元素的。要注意，你可以在页面渲染后的任何时候更改元素的定位。你可以通过修改其\
  \ CSS 将元素从流中“拔出”。以下代码片段将通过 ID 识别元素，然后将其拔出：\n\n```javascript\nfunction yankOut(elId)\
  \ {\n    var elObj = document.getElementById(elId);\n    elObj.style.position =\
  \ \"absolute\";\n    elObj.style.left = \"10px\";\n    elObj.style.top = \"10px\"\
  ;\n}\n```\n\n为了在快速示例中使用，请考虑以下四段 HTML：\n\n```html\n<p id=\"para1\">Lorem ipsum dolor\
  \ sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore\
  \ et magna aliqua. Ut enim ad minimveniam,quis nostrud exercitation laboris nisi\
  \ ut aliquip ex ea commodo sequatat.</p>\n<p id=\"para2\">Lorem ipsum dolor sit\
  \ amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore\
  \ et magna aliqua. Ut enim ad minimveniam,quis nostrud exercitation laboris nisi\
  \ ut aliquip ex ea commodo sequatat.</p>\n<p id=\"para3\">Lorem ipsum dolor sit\
  \ amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore\
  \ et magna aliqua. Ut enim ad minimveniam,quis nostrud exercitation laboris nisi\
  \ ut aliquip ex ea commodo sequatat.</p>\n```\n\n为了将第二个段落移出布局并使文档重新重流，我将创建一个调用我的\
  \ `yankOut()` 函数的按钮：`<button onclick=\"yankOut('para2')\">弹出第二个段落</button>`。点击按钮后，更新后的文档将如图\
  \ 16-6 所示。\n\n\n\n\n使用绝对定位，你将能够让元素重叠在一起。它们显示的顺序（`order`，即哪个元素显示在最上方（`top`））是由它们在\
  \ DOM 中出现的顺序控制的。对于 DHTML 来说，这是不够的，因为你可能需要根据情况定期更改元素的堆叠顺序。解决此问题的 CSS 解决方案是 `z-index`。在三维空间中，有三个轴。x\
  \ 轴等同于 CSS 属性 `left` 和 `right`，因为它代表水平平面。y 轴对应于 CSS 属性 `top` 和 `bottom`，因为它是垂直平面。堆叠顺序，或称\
  \ `z 轴`（见图 16-7），由 CSS 属性 `z-index` 或其 DOM 属性 `zIndex` 表示。图 16-7![199](img/whit_9780470550502_oeb_199_r1.jpg)绝对定位的元素不会自动被赋予默认的\
  \ `zIndex`，但你可以设置它的 `zIndex`，DOM 将相应地更新堆叠顺序。带有 `zIndex` 的元素将显示在没有 `zIndex` 的元素之上，索引较高的元素将显示在索引较低的元素之上。在下面的\
  \ HTML 代码段中有三个 `div`，它们都相互重叠。在图 16-8 中，你将在左侧的图像中看到它们的初始状态。\n\n```css\n<style type=\"\
  text/css\">\ndiv {\n    position:absolute;\n    width:100px;\n    height:100px;\n\
  \    background-color:yellow;\n    border: 1px solid black;\n}\n</style>\n```\n\n\
  ```html\n<div id=\"di1\" style=\"top:50px; left:50px\">Div 1</div>\n<div id=\"div2\"\
  \ style=\"top:80px; left:120px\">Div 2</div>\n<div id=\"div3\" style=\"top:120px;\
  \ left:80px;\">Div 3</div>\n```\n\n我可以通过将 `zIndex` 设置为某个数字，强制将当前位于堆栈底部的第一个 `div`\
  \ 移到顶端。图 16-8![200](img/whit_9780470550502_oeb_200_r1.jpg)<button onclick=\"setZ('div1',\
  \ 1000)\">让 Div 1 回到最。</button>\n\n```javascript\n<script type=\"text/javascript\"\
  >\nfunction setZ(elId, newZ) {\n    var elObj = document.getElementById(elId);\n\
  \    elObj.style.zIndex = newZ;\n}\n</script>\n```\n\n当用户点击按钮时，新索引将被设置，DOM 将自动更新以反映新的排序顺序。\n\
  \n## 获取元素的绝对位置\n\n换句话说，硬币的另一面是读取 DOM 中的元素位置。例如，工具提示（tooltip）组件需要知道内容或超链接的位置，以便定位在它旁边。组合框（combo-box）的下拉部分需要直接定位在输入区域正下方看起来才正确。如果你不知道目标的精确像素坐标，要正确实现这些功能非常困难。遗憾的是，目前没有标准且简单的方法从浏览器中获取这些信息，这确实令人惊讶，因为这是一个非常常见的用例。相反，开发者使用了多种技术来获取这些信息，准确程度各不相同。\n\
  \n在 Internet Explorer 5+ 和 Firefox 3.0+ 中，所有 DOM 元素上都有一个名为 `getBoundingClientRect()`\
  \ 的函数，它返回元素相对于窗口左上角的坐标。返回对象的成员包括：![201](img/whit_9780470550502_oeb_201_r1.gif)\n\
  \n要将其转换为一组有文档坐标，你必须加上文档的滚动位置，并将结果舍入到最近的整数。让我们来看一个例子。首先，我从一个简单的文档并在底部创建一个按钮：\n\n\
  ```html\n<head></head>\n<body>\n    <p>Lorem ipsum dolor sit amet, consectetur adipisicing\
  \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim\
  \ ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex\
  \ ea commodoconsequat.</p>\n    <p id=\"para2\">Lorem ipsum dolor sit amet, consectetur\
  \ adipisicing elit, sed do eiusmod incididunt ut labore et dolore magna aliqua.\
  \ Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip\
  \ ex ea commodoconsequat.</p>\n    <p>Lorem ipsum dolor sit amet, consectetur adipisicing\
  \ elit, sed do eiusmod incididunt ut labore et dolore magna aliqua. Ut enim ad minim\
  \ veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodoconsequat.</p>\n\
  \    <button onclick=\"alertCoords('para2')\">告诉我第二个段落的位置。</button>\n</body>\n```\n\
  \n现在，我将根据 ID 编写 `alertCoords` 函数：\n\n```javascript\nfunction alertCoords(elId){\n\
  \    // 我将通过传入的 ID 获取该元素的引用\n    var elObj = document.getElementById(elId);\n  \
  \  if (elObj.getBoundingClientRect()){\n        // 我将使用 getClientRect() 获取坐标\n \
  \       var coords = elObj.getBoundingClientRect();\n        // 接下来，我需要加上文档的滚动位置并将结果舍入到最近的整数\n\
  \        var scrollX = document.body.scrollLeft;\n        var scrollY = document.body.scrollTop;\n\
  \        if (window.pageXOffset){\n            // Firefox\n            scrollX =\
  \ window.pageXOffset;\n            scrollY = window.pageYOffset;\n        }\n  \
  \      // 最后，我将坐标值映射到像素\n        coords = {\n            left: Math.round(coords.left)\
  \ + scrollX,\n            right: Math.round(coords.right) + scrollX,\n         \
  \   top: Math.round(coords.top) + scrollY,\n            bottom: Math.round(coords.bottom)\
  \ + scrollY\n        };\n    }\n    }\n    // 遗憾的是，在任何不支持这两种方法的浏览器中，必须\n    // 遍历\
  \ DOM 并通过累加滚动位置、offsetTop 和 offsetLeft 来计算元素的位置\n    // 直到到达 body：\n    else {\n\
  \        var elCopy = elObj;\n        var originalElement = elObj;\n        for\
  \ (var lx = 0, ly = 0; elObj != null;\n            lx += elObj.offsetLeft, ly +=\
  \ elObj.offsetTop, elObj = elObj.offsetParent);\n        for(; elCopy != document.body;\n\
  \            lx -= elCopy.scrollLeft, ly -= elCopy.scrollTop, elCopy = elCopy.parentNode);\n\
  \        coords = {\n            left: lx,\n            right: lx + originalElement.offsetWidth,\n\
  \            top: ly,\n            bottom: ly + originalElement.offsetHeight\n \
  \       };\n    }\n    alert(coords.left + \", \" + coords.right + \", \" + coords.top\
  \ + \", \" + coords.bottom);\n}\n```\n\n这种方法通过计算为元素提供了相当准确的位置。如果这是兼容性最好的方法，我们为什么不总是这样做呢？如果使用原生浏览器方法来确定位置，性能会相当好。为了可重用性，我们将这个工具函数封装在一个方便的小函数中，返回一个对象而不是直接将结果显示在屏幕上。这是一个你可以在应用程序中使用的函数，我在后后书的其他部分还会使用它：\n\
  \n\n\n\n```javascript\nvar scrollY = document.body.scrollTop;\n\nif (window.pageXOffset)\
  \ {\n    // Firefox\n    scrollX = window.pageXOffset;\n    scrollY = window.pageYOffset;\n\
  }\ncoords = {\n    left:Math.round(coords.left)+scrollX,\n    right:Math.round(coords.right)+scrollX,\n\
  \    top:Math.round(coords.top)+scrollY,\n    bottom:Math.round(coords.bottom)+scrollY\n\
  };\n} else if (document.getBoxObjectFor) {\n    var coords = document.getBoxObjectFor(elObj);\n\
  \    coords = {\n        left:coords.x,\n        right:coords.x+coords.width,\n\
  \        top:coords.y,\n        bottom:coords.y+coords.height\n    };\n} else {\n\
  \    var elCopy = elObj;\n    var originalElement = elObj;\n    for (var lx=0, ly=0;elObj!=null;lx+=elObj.offsetLeft,ly+=elObj.offsetTop,elObj=elObj.offsetParent);\n\
  \    for (;elCopy!=document.body;lx-=elCopy.scrollLeft,ly-=elCopy.scrollTop,elCopy=elCopy.parentNode);\n\
  \    coords = {\n        left:lx,\n        right:lx+originalElement.offsetWidth,\n\
  \        top:ly,\n        bottom:ly+originalElement.offsetHeight\n    };\n}\nreturn\
  \ coords;\n```\n\n## 动画\n\n既然你已经理解了 DHTML 定位以及使用 CSS 操作元素的基础知识，现在查看动画就很合理了。现代浏览器提供了极高性能的\
  \ DHTML 引擎，能够每秒多帧地对文档中的元素进行动画。尽管 JavaScript 是单线程的，但可以创建许多执行独立动画且速度相对较快的伪线程。如果你从未想过在应用程序中使用动画，你可能认为它的用处仅限于娱乐和游戏。你就错错了。你可以使用动画来传达应用程序正在发生的情况，并向用户提示重要信息和文档内容的变化。当增量变化以每秒约\
  \ 10 帧的速度连接时，普通人开始感知到动画中的流体运动（尽管这只是一个指南）。为了创建一个方框从 50 像素增加到 100 像素的印象，你可能先将宽度改为\
  \ 55 像素，等待 100 毫秒，将宽度增加到 60 像素，再等待 100 毫秒，并重复。当 1000 毫秒（1 秒）结束时，方框将变为 100 像素宽，你就为用户完成了过渡动画。这样做的好处是，用户对过渡的关注比方框突然增大得多。虽然这表面上看可能很复杂，但\
  \ DHTML 动画是你编写的最简单的脚本之一。它们涉及 DOM 极其基础的属性，并使用了每个浏览器都支持的功能。\n\n## 使用计时器伪线程\n\n基于你对动画的了解，你可能会尝试像这样的实验：使用\
  \ `for` 循环将方框的宽度从 50 迭代到 100 像素。每次执行循环时，等待十分之一。看看会发生什么。以下是这种令人失望的动画在代码中的示例：\n\n\
  ```javascript\n// 一个损坏的 div 宽度动画\nvar divObj = document.getElementById(\"myDiv\"\
  );\nfor (var width = 50; width <= 100; width++) {\n    divObj.style.width = width\
  \ + \"px\";\n    var timer = new Date();\n    while ((new Date())-timer < 100) {}\n\
  }\n```\n\n浏览器并没有平滑地运行，而是冻结了一会儿；然后方框突然地变成了 100 像素宽。为什么会发生这种情况？JavaScript 是单线程的，这意味着只有一个光标在代码的每一行上迭代，当它到达所有将执行代码的末尾时，它才有机会实现对\
  \ DOM 所做的任何更改（称为重流和重绘）。只有当所有的代码都执行完毕，JavaScript 才有机会执行这一点。在像 Opera 的某些浏览器中，关于重流和重绘的规则要微妙得多，但从任何角度来看，你不能这样组织你的代码。相反，你需要创建线程（实际上是伪线程），允许\
  \ DOM 在每个“帧”之间更新自身。线程是通过计时器函数 `setTimeout()` 和 `setInterval()` 创建的。这些是全局函数，并具有以下通用语法：\n\
  \n```javascript\ntimeoutObj = window.setTimeout(codeOrFnRef, delay);\nintervalObj\
  \ = window.setInterval(codeOrFnRef, delay);\n```\n\n`setTimeout()` 调用会创建一个一次性事件，该事件将在创建大约\
  \ `delay` 毫秒后触发。当发生时，如果 `codeOrFnRef` 是字符串，它将被执行 `eval()`。如果它是函数引用，则会被调用。第二个函数 `setInterval()`\
  \ 创建一个重复事件，它将每隔大约 `delay` 毫秒触发一次。要在 `setTimeout()` 事件触发之前停止或取消它，请使用 `clearTimeout()`：`clearTimeout(timeoutObj)`。对于间隔器，使用\
  \ `clearInterval()`：`clearInterval(intervalObj)`。通过将动画的每一帧放入计时器事件中，这些事件之间的时间会被浏览器用于更新\
  \ DOM：\n\n```javascript\nfunction animDiv() {\n    var divObj = document.getElementById(\"\
  myDiv\");\n    var divWidth = divObj.offsetWidth;\n    if (divWidth < 100) {\n \
  \       divObj.style.width = divWidth+1 + \"px\";\n        setTimeout(animDiv, 100);\n\
  \    }\n}\n```\n\n这种实现对 CPU 的影响最小，并允许同时创建多个此类计时器，以便多个动画同时进行。\n\n## 非线性动画与补间\n\n\n\
  \n\n\n上一个示例是 `linear`（线性）动画的良好演示，它基本上是一个从一个位置到另一个位置的匀速动画。这也被称为 `tween`（补间动画），因为它计算了两个参考位置之间的中间位置。执行\
  \ `tweening` 操作的动画框架通常支持多种类型的 `nonlinear`（非线性）以及线性动画。这基本上意味着，当对象在时间和空间上从 `p0`（起始位置）到\
  \ `p1`（结束位置）移动时，其积分（即运动的加速度）一直在不断变化。因此，你看到的不是一个框以恒定速度从一个点移动到另一个点，它可能在移动过程中逐渐加速，然后在接近目的地时逐渐减速，正如你在图\
  \ 16-9 中所示。这可以创建出更加真实的动画。该原理适用于所有类型的动画，而不仅仅是位置。图 16-9![203](img/whit_9780470550502_oeb_203_r1.gif)\
  \ 基于 ECMAScript 的补间动画以及这些“缓动方程”（如它们被所称）的许多领导性工作是由 Robert Penner 完成的，他写了一本关于该主题的书并在\
  \ BSD 协议下许可了他的工作（[`www.robertpenner.com`](http://www.robertpenner.com)）。许多支持补间动画的流行\
  \ JavaScript 框架（如 Mootools）都使用他的工作作为基础。为了在你的动画中利用补间动画，从一个基础动画类开始是合理的，该类接受运动的基本参数以及提供你所需要的非线性运动的数学\
  \ `equation`（方程）。首先，让我们创建动画类的构造函数：\n\n```javascript\nfunction animation(targetObj,\
  \ fromX, fromY, targetX, targetY, animTime, animFn){\n  // 因为这是一个简单的“从这里到那里”的移动动画类，我只接受四个描述运动性质的动画参数：`fromX`\
  \ 和 `fromY` 将是 `targetObj` 的起始位置，`targetX` 和 `targetY` 将是元素的结束位置。总动画时间将由 `animTime`\
  \ 定义，而 `animFn` 将作为过渡公式（我还没有向你展示这些）。在构造函数中，我记录了这些属性的每一个以备后用：\n  // 记录对象\n  var that\
  \ = this;\n  // 存储我们的动画参数\n  this.targetObj = targetObj;\n  this.fromX = fromX;\
  \ this.fromY = fromY;\n  this.targetX = targetX; this.targetY = targetY;\n  this.animTime\
  \ = animTime;\n  this.animFn = animFn;\n\n  接下来，我将定义一个导致动画开始的函数：\n  this.go= function()\
  \ {\n    that.startTime= new Date();\n    that.drawFrame();\n  }\n}\n```\n\n该函数设置了起始时间，然后调用另一个函数\
  \ `drawFrame()`，该函数渲染动画的每一帧。在 `drawFrame` 中，第一个任务是计算动画的 `percentage completion`（完成百分比）。简单来说，这就是通过的时间除以动画中剩余的总时间（参见图\
  \ 16-10）。图 16-10![204](img/whit_9780470550502_oeb_204_r1.gif)\n\n```javascript\n\
  this.drawFrame= function() {\n  var progress = that.animFn(((new Date() -that.startTime)/that.animTime));\n\
  }\n```\n\n然后，结果被传递通过 `animFn` 定义的函数，该函数返回一个非线性进的 `new` 百比值（参见图 16-11）。205 调节动画的算法可以从简单到复杂。这里有两个示例：\n\
  \n```javascript\ntransitions = {\n  linear:function(p) {\n    return p;\n  },\n\
  \  sine:function(p) {\n    return 1-Math.sin((1 - p) * Math.PI / 2);\n  }\n};\n\
  ```\n\n第一个函数将创建一个像之前那线性动画，而第二个函数将在突然停止之前创建一个“ease-in”（淡入）效果。现在我有了计算出的进度，我可以使用它来计算\
  \ `x` 和 `y` 坐标：\n\n`newX = (progress*(that.targetX-that.fromX))`\n`newY = (progress*(that.targetY-that.fromY))`\n\
  \n这种方法可以应用于所有类型的属性，而不仅仅是位置。图 16-9![203](img/whit_9780470550502_oeb_203_r1.gif) 这种可以创建出更加真实的动画。\n\
  \n\n\n\n\n`myDiv.style.backgroundColor = \"rgb(100%,0%,0%)\";` 使用 RGB 颜色值，通过遍历数值范围来执行颜色动画非常简单。\n\
  \n## 黄色渐变 (Yellow-Fade)\n\n基于 Ajax 的应用程序开发者中一种流行的技术是 `yellow-fade`，它基本上通过将背景颜色从黄色渐变为白色，来引起对文档中变化区域的关注。它的优点是引人注目但又不会过度分散注意力。使用\
  \ CSS `rgb()` 值可以轻松实现这种效果。首先，让我们创建一个通用函数来执行所有工作：\n\n```javascript\nfunction yellowFade(elRef){\n\
  为了存储动画状态，我将使用 DOM 节点本身的扩展属性（expando property）：\nif (!elRef.yFade) {\n    elRef.yFade=\
  \ 0;\n}\n在每次迭代中，我将将其增加 2，直到达到 255。此时，将扩展属性重置为 null，并将 `backgroundColor` 属性设置为透明：\n\
  elRef.yFade+= 2;\n\nif (elRef.yFade >=255) {\n    elRef.yFade= null;\n    elRef.style.backgroundColor=\"\
  transparent\";\n} else {\n// 最后，将背景设置为我为这次迭代选择的黄色调。由于纯黄色是 `#FFFF00` 或 `rgb(255,255,0)`，而白色是\
  \ `#FFFFFF` 或 `rgb(255,255,255)`，我必须在 0 到 255 之间迭代 `b` 值：\n    elRef.style.backgroundColor=\"\
  rgb(255,255,\"+ elRef.yFade+\")\";\n    setTimeout(function(){yellowFade(elRef)},20);\n\
  }\n}\n```\n\n每次迭代都会设置背景颜色，并启动一个 20 毫秒间隔的定时器。这将创建一个持续约 2.5 秒的渐变效果。\n\n## 透明度 (Opacity)\n\
  \n在现代浏览器中，你也可以可以在范围内调整元素的 `opacity`。通常情况下，你可以让元素从完全不透明渐变为完全透明，从而实现一些有趣的效果。然而，这种能力也有局限性。首先，来看\
  \ CSS：\n\n```javascript\nfunction setOpacity(elRef, value) {\n    //value 应该是 0\
  \ 到 1 之间\n    // W3C 浏览器和 IE7+\n    elRef.style.opacity= value;\n    // 旧版本的 IE\n\
  \    elRef.style.filter='alpha(opacity=' + Math.round(value*100) + '}';\n}\n```\n\
  \n在符合 W3 标准的浏览器中，你可以将 `opacity` CSS 值设置为 0.0 到 1.0 之间的数字。在 `IE7` 之前的 Internet Explorer\
  \ 版本中，你必须使用 `filter` 对象的 `alpha()` 命令来实现。\n\n在早期的浏览器中，并不是所有的 HTML 元素都可以更改 `opacity`。在\
  \ Internet Explorer 中，像 `tbody` 和 `tr` 这样的表格元素不能更改其透明度，但包含表格的元素可以，这意味着整个表格可以应用 `opacity`，但子元素不行。\n\
  \n另一个局限性是在 `Internet Explorer 7+` 中：无法对已经具有 alpha 通道（PNG 图像）的 24 位图像设置 `opacity`。尝试这样做会导致在\
  \ `<100%` alpha 透明度的区域出现难看的黑色边缘。你应该注意的最后一种情况是 Internet Explorer 中非常大的半透明区域。由于某种原因，如果你尝试渐变的对象太大，`opacity`\
  \ 设置将不起作用；相反，你将得到一个完全不透明或完全不可见的区域。\n\n## Internet Explorer 和 32 位图像\n\n*便携网络图形*\
  \ (`PNG`) 是一种所有现代浏览器都支持的多功能图像格式。Internet Explorer 6 原生支持 PNG，但它没有实现 PNG `alpha 通道`，这是允许图像半透明的变变透明度功能。这一功能对于制作如精细阴影等效果非常有用。在\
  \ `IE7` 及以上版本中，现在原生支持 alpha 通道，同时也支持向后的 `filter` 技术以便在 IE 6 中也能工作。\n\n要加载支持 alpha\
  \ 通道的 32 位 PNG 并显示 alpha 通道，请使用 `filter` CSS 属性加载 `DirectX AlphaImageLoader` 过滤器。将\
  \ `src` 属性设置为图像的*绝对路径名*。如果你想调整图像大小，可以将 `sizingMethod` 设置为 `scale`。这非常像使用图像作为背景而不是仅仅使用\
  \ `img` 元素：\n\n```css\nfilter:progid:DXImageTransform.Microsoft.AlphaImageLoader(src='varyAlpha.png');\n\
  ```\n\n基于浏览器编写一个原生同时支持普通 `backgroundImage` 和 `filter` 实现 PNG 的工具函数是一件简单的事。以下是一个示例：\n\
  \n```html\n<head>\n    <title>Opacity</title>\n    <script type=\"text/javascript\"\
  >\n    function loadAlphaImage(imgSrc, width, height) {\n        var img =document.createElement(\"\
  div\");\n        img.style.width= width + \"px\";\n        img.style.height= height\
  \ + \"px\";\n        if (document.attachEvent){\n            img.style.filter='progid:DXImageTransform.Microsoft.AlphaImageLoader(src='+imgSrc+'sizingMethod='scale')';\n\
  \        } else {\n            img.style.backgroundImage=\"url('\"+imgSrc+\"')\"\
  ;\n        }\n        return img;\n    }\n    </script>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n此示例使用了来自 Google 地图的下投影阴影图像，并将其覆盖在段落文字上。由于同时支持 `backgroundImage`\
  \ 和 `filter`，因此它将在所有主流浏览器中正常运行。\n\n\n\n\n\n```html\n<button onclick=\"DisplayWindow('windowContents')\"\
  >启动 Modal 窗口</button>\n\n<div style=\"display:none; padding:20px;\" id=\"windowContents\"\
  >\n    <h1>关于</h1>\n    <p>模态窗口 v1.0</p>\n    <button onclick=\"window.currentModalWindow.close()\"\
  >关闭</button>\n</div>\n\n</body></html>\n```\n\n我在这里完成的另一件事是创建了一个隐藏的 `div`，它包含了要在窗口中显示的内容。我设置了\
  \ `display:none` 属性，以确保它在默认情况下不会在页面上显示。我还给这个 `div` 分配了一个 `ID`，以便于引用。`div` 内部还有另一个按钮，稍后将关闭模态窗口。我稍后会解释它是如何运作的。\n\
  \n目前，该页面并没有实际什么。如果我点击`启动 Modal 窗口`按钮，将会抛出一个 JavaScript 错误，因为我还没有定义 `DisplayWindow()`\
  \ 函数。在在此之前，让我们开始为这个小部件编写一个类。我们把这个类命名为 `modalWindow()`。我需要创建一个构造函数，并允许用户设置窗口的内容。在这种情况下，我们的内容将是页面上的那个隐藏\
  \ `div`。\n\n```javascript\n// modalWindow 类\nfunction modalWindow(contents) {\n\
  \    // 创建对自身的引用\n    var that = this;\n```\n\n我假设对 `contents` 的引用是有效的。在确定窗口的宽度和高度之前，我需要确保\
  \ `contents` 设置为 `display:block` 但保持 `visibility:hidden`。我这样做是因为只有当它被渲染到 DOM 中，我才能读取它的宽度和高度。保持\
  \ `visibility:hidden` 可以防止用户看到它，而设置 `position:absolute` 则可以确保我的任何操作都不会导致 DOM 的重流或改变。\n\
  \n```javascript\n// 让内容对象隐藏但渲染，以便我测量其尺寸\ncontents.style.position= \"absolute\";\n\
  contents.style.visibility= \"hidden\";\ncontents.style.display= \"block\";\n```\n\
  \n现在我可以安全地测量内容的宽度和高度，这样我就知道该把窗口做多大了。\n\n```javascript\n// 获取内容 div 的尺寸\nthis.width\
  \ = contents.offsetWidth;\nthis.height = contents.offsetHeight;\n```\n\n早些时候，我提到过需要一个与页面大小相同的\
  \ `div`，以防止用户在我不希望他们点击或与模态窗口下方的元素进行交互。现在来处理这个问题。我将使用 `document.createElement()`\
  \ 生成一个 `div` 元素并设置它的一些 CSS。\n\n```javascript\n// 首先创建一个半透明的输入阻塞器来覆盖页面\nvar iBlockr\
  \ = document.createElement(\"div\");\niBlockr.style.position= \"absolute\";\niBlockr.style.top=\
  \ \"0px\";\niBlockr.style.left= \"0px\";\niBlockr.style.backgroundColor= \"#00\"\
  ;\niBlockr.style.zIndex= 1000;\nsetOpacity(iBlockr,0.5); // 使其变为半透明\n```\n\n注意我最后做的的一件事，即将\
  \ `div` 的透明度设置为 50%。这使用了我之前编写并包含在 `utils.js` 中的 `setOpacity()` 工具函数。另外请注意，我将 `div`\
  \ 的 `zIndex` 设置为 1000。这个数字是任意的，但我稍后将为窗口内容（`contents`）定位，并希望它显示在最上方。\n\n接下来我将定位 `iBlockr`\
  \ `div` 使它占据整个表面。为了实现这一点，我将重用我之前编写的 `getWindowGeometry()` 工具函数。\n\n```javascript\n\
  // 获取文档和窗口的尺寸并用它来调整输入阻塞器的尺寸\nvar windowGeometry=getWindowGeometry();\niBlockr.style.width=windowGeometry.bodyWidth+\"\
  px\";\niBlockr.style.height=windowGeometry.bodyHeight+\"px\";\n```\n\n注意，如果我现在关闭它并开始使用，我将无法看到我创建的那个\
  \ `div`，因为我还没有把它添加到 DOM 中。目前它只是挂在内存中，等待我对它进行操作。稍后我会处理那一点。现在，让我们继续构建我之前提到的 `iframe`\
  \ 垫片（shim）。\n\n`iframe` 垫片将有两个作用。首先，它将成为窗口的背景，这样内容就能清晰地显示。此外，正如我之前提到的，因为它是一个 `iframe`，它具有遮盖某些否则会露出的元素的属性。让我们创建\
  \ `iframe` 节点并设置它的位置和大小：\n\n```javascript\n// 创建窗口垫片以阻塞框元素并为窗口本身创建一个不透明背景\nvar shim\
  \ =document.createElement(\"iframe\");\nshim.style.position= \"absolute\";\nshim.frameBorder=\
  \ \"0\";\nshim.style.top=(windowGeometry.scrollY+((windowGeometry.windowHeight-this.height)/2))+\"\
  px\";\nshim.style.left=(windowGeometry.scrollX+((windowGeometry.windowWidth-this.width)/2))+\"\
  px\";\nshim.style.width= this.width+\"px\";\nshim.style.height= this.height+\"px\"\
  ;\nshim.style.zIndex= 2000;\nshim.style.backgroundColor= \"#FFF\";\n```\n\n用于确定\
  \ `top` 和 `left` 坐标的公式很简单。使用已经计算出的 `width` 和 `height` 属性，我从窗口宽度和高度中减去它们并除以二以居中。我加上了窗口的滚动位置，以便\
  \ `iframe` 显示在用户视口的中间。最后，我将 `zIndex` 设置为 2000，这是一个比 `iBlockr` 元素大的数字，这意味着它保证显示在最上方。\n\
  \n窗口的设置就此了。我现在需要一个显示窗口的命令。让我们将其命名为 `display()`。\n\n```javascript\n// 此函数将显示窗口\n\
  this.display= function() {\n```\n\n在这里，我首先想做的是为窗口对象创建一个全局引用。我这样做是因为这个类被设计成一个单例，也就是说，在任何时间不应该多于一个显示的窗口。为了实现这一点，我将获取全局对象（`window`）的引用，并在窗口实例上设置一个额外的属性。\n\
  \n```javascript\n// 将此窗口设置为单例并保留全局引用\nwindow.currentModalWindow = that;\n```\n\n\
  接下来，我将 `iBlockr` 节点和 `shim` 添加到 DOM 中，使它们可见：\n\n```javascript\n// 将输入阻塞器添加到文档\n\
  document.body.appendChild(iBlockr);\n// 将垫片添加到文档\ndocument.body.appendChild(shim);\n\
  ```\n\n然后我将内容窗口定位到上方：\n\n```javascript\n// 将内容定位\ncontents.style.position= \"absolute\"\
  ;\ncontents.style.top= shim.style.top;\ncontents.style.left= shim.style.left;\n\
  contents.style.visibility= \"visible\";\ncontents.style.zIndex= 3000;\n}\n```\n\n\
  剩下的工作是提供一种关闭窗口的方法。我将将其命名为 `close()`：\n\n```javascript\n// 将移除模态窗口\nthis.close= function()\
  \ {\n    // 移除输入阻塞器和垫片\n    document.body.removeChild(iBlockr);\n    document.body.removeChild(shim);\n\
  \    // 隐藏内容窗口\n    contents.style.display= \"none\";\n    window.currentModalWindow=\
  \ null;\n}\n}\n```\n\n这将从 DOM 中移除 `iBlockr` 和 `shim` 节点，并将内容的显示设置为 `display:none`。它还删除了全局对象中的引用。最后的任务是填充按钮引用的\
  \ `DisplayWindow()` 函数，创建 `modalWindow()` 的实例并调用 `display()`：\n\n```javascript\n\
  function DisplayWindow(windowContentsID) {\n    var contentsObj = document.getElementById(windowContentsID);\n\
