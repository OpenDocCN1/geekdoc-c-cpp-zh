  \ FF1+, IE3+, NN2+, O5+, SF1+)\n- `queryCommandEnabled(commandName)` -- 如果 Midas\
  \ 命令可以在当前范围上执行，则返回 true。（支持: FF1+, IE4+, NN7+) *返回：* 布尔值。\n- `queryCommandIndeterm(commandName)`\
  \ -- 如果 Midas 命令在当前范围上处于不确定状态，则返回 true。（支持: FF1+, IE4+, NN7+) *返回：* 布尔值。\n- `queryCommandState()`\
  \ -- 如果 Midas 命令已在当前范围上执行，则返回 true。（支持: FF1+, IE4+, NN7+) *返回：* 布尔值。\n- `queryCommandValue(commandName)`\
  \ -- 返回当前范围对应的 Midas 命令当前值。（支持: FF1+, IE4+, NN7+) *返回：* 取决于内容。\n- `querySelector(selectors)`\
  \ -- 返回在调用它的元素后代中匹配指定选择器组的第一个元素。（支持: FF3.5+) *返回：* DOM 节点。\n- `querySelectorAll(selectors)`\
  \ -- 返回在调用它的元素后代中所有匹配指定选择器组的元素列表。（支持: FF3.5+) *返回：* 元素数组。\n- `recalc([allFlag])`\
  \ -- 导致动态属性之间的依赖关系重新计算。（支持: IE5+)\n- `write()` -- 向文档写入文本。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+) *返回：* 布尔值。\n- `writeln()` -- 向文档写入一行文本。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+) *返回：* 布尔值。\n\n## Events\n\n- **onoffline** -- 返回 onoffline 事件的处理代码。（支持:\
  \ FF3.5+)\n- **ononline** -- 返回 ononline 事件的处理代码。（支持: FF3.5+)\n- **onselectionchange**\
  \ -- 返回 onselectionchange 事件的处理代码（编辑模式下）（支持: IE5.5+)\n- **onstop** -- 返回 onstop\
  \ 事件（当用户点击浏览器停止按钮时）的处理代码。（支持: IE5+)\n\n## body 对象引用\n\nbody 对象表示当前页面或文档的 `<body>`\
  \ 或 `<frameset>` 节点。\n\n### **属性**\n\n\n\n\n\n- `alink` -- (支持: CH1+, FF1+, IE4+,\
  \ NN6+, O5+, SF1+) *返回值：*字符串，读/写。\n- `background` -- 设置或检索对象中文字和图形后面平铺背景图片的 URL。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回值：*字符串，读/写。\n- `bgColor` -- 设置或检索一个指示对象后面背景颜色的值。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回值：*字符串，读/写。\n- `bgProperties` -- (支持: IE4+)\
  \ *返回值：*字符串常量，读/写。\n- `bottomMargin` -- (支持: IE4+) *返回值：*整数，读/写。\n- `leftMargin`\
  \ -- (支持: IE4+) *返回值：*整数，读/写。\n- `link` -- (支持: CH1+, FF1+, IE4+, NN6+, O5+, SF1+)\
  \ *返回值：*字符串，读/写。\n- `noWrap` -- 设置或检索浏览器是否自动进行换行。（支持: IE4+) *返回值：*布尔值，读/写。\n- `rightMargin`\
  \ -- (支持: IE4+) *返回值：*整数，读/写。\n- `scroll` -- 将窗口滚动到文档中的特定位置。（支持: IE4+) *返回值：*字符串常量，读/写。\n\
  - `scrollLeft` -- 获取或设置左滚动偏移量。（支持: FF1+, IE4+, NN7+) *返回值：*整数，读/写。\n- `scrollTop`\
  \ -- 获取或设置顶部滚动偏移。（支持: FF1+, IE4+, NN7+) *返回值：*整数，读/写。\n- `text` -- (支持: CH1+, FF1+,\
  \ IE4+, NN6+, O5+, SF1+) *返回值：*字符串，读/写。\n- `topMargin` -- (支持: IE4+) *返回值：*整数，读/写。\n\
  - `vLink` -- (支持: CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回值：*字符串，读/写。\n\n## 方法\n-\
  \ `createControlRange()` -- 为文本选择创建一个 `controlRange`。（支持: IE5+) *返回值：*数组。\n- `createTextRange()`\
  \ -- (支持: IE4+) *返回值：*对象。\n- `doScroll([scrollAction])` -- 模拟对滚动条组件进行点击。（支持: IE5+）。\n\
  \n## 事件\n- `onafterprint` -- 在窗口打印后触发。（支持: IE4+)\n- `onbeforeprint` -- 在窗口打印前触发。（支持:\
  \ IE4+)\n- `onscroll` -- 返回 `onscroll` 事件的事件处理代码。（支持: CH1+, FF1+, IE4+, NN6+, O5+,\
  \ SF1+)\n\n# TreeWalker 对象\nTreeWalker 对象持有 DOM 的结构以及在该结构中的一个位置。你可以使用 `document.createTreeWalker()`\
  \ 方法创建一个新的 `TreeWalker`。\n\n## 属性\n- `currentNode` -- 指当前节点的引用。（支持: FF1+, NN7+)\
  \ *返回值：*DOM 节点，读/写。\n- `expandEntityReference` -- 传递给 `createTreeWalker` 的参数值。（支持:\
  \ FF1+, NN7+) *返回值：*DOM 节点，只读。\n- `filter` -- 传递给 `createTreeWalker` 的参数值。（支持: FF1+,\
  \ NN7+) *返回值：*字符串，只读。\n- `root` -- 传递给 `createTreeWalker` 的参数值。（支持: FF1+, NN7+)\
  \ *返回值：*DOM 节点，只读。\n- `whatToShow` -- 传递给 `createTreeWalker` 的参数值。（支持: FF1+, NN7+)\
  \ *返回值：*字符串，只读。\n\n## 方法\n- `firstChild()` -- 第一个直接子节点，如果该元素没有子节点则返回 null。（支持: FF1+,\
  \ NN7+) *返回值：*DOM 节点。\n- `lastChild()` -- 最后一个直接子节点，如果该元素没有子节点则返回 null。（支持: FF1+,\
  \ NN7+) *返回值：*DOM 节点。\n- `nextNode()` -- 在 TreeWalker 对象当前包含的节点列表中向前导航。（支持: FF1+,\
  \ NN7+) *返回值：*DOM 节点。\n- `nextSibling()` -- 树中紧随于给定节点之后的节点，如果没有兄弟节点则返回 null。（支持:\
  \ FF1+, NN7+) *返回值：*DOM 节点。\n- `parentNode()` -- 此节点的父元素，如果该节点不在 DOM 文档中则返回 null。（支持:\
  \ FF1+, NN7+) *返回值：*DOM 节点。\n- `previousNode()` -- 在 TreeWalker 对象当前包含的节点列表中向后导航。（支持:\
  \ FF1+, NN7+) *返回值：*DOM 节点。\n- `previousSibling()` -- 树中紧邻于给定节点之前的节点，如果没有兄弟节点则返回\
  \ null。（支持: FF1+, NN7+) *返回值：*DOM 节点。\n\n# 事件对象引用\n你通常会在事件处理程序触发时遇到 Event 实例。当这种情况发生时，会传递一个包含事件对象的单个参数。在\
  \ Internet Explorer 中，也可以通过 `window.event` 访问它。不同浏览器之间的事件属性差异很大。请参阅第 12 章了解如何使用事件。\n\
  \n\n\n\n\n- `altKey` -- 返回一个布尔值，表示事件期间是否按下了 <alt> 键。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 布尔，只读。\n- `altLeft` -- 获取表示左侧 ALT 键状态的值。（支持: IE5.5+) *返回：* 布尔，只读。\n\
  - `behaviorCookie` -- 获取一个标识触发事件的渲染行为的 cookie。（支持: IE6+) *返回：* 整数，只读。\n- `behaviorPart`\
  \ -- 获取一个标识触发事件的渲染行为部分的的值。（支持: IE6+) *返回：* 布尔，只读。\n- `bookmarks` -- 返回一个与当前事件影响的行绑定的\
  \ Microsoft ActiveX 数据对象 (ADO) 书签集合。（支持: IE4+) *返回：* 数组，只读。\n- `boundElements` --\
  \ 元素引用数组，包含绑定到当前事件所触的相同数据集的元素。（支持: IE5+) *返回：* 数组，只读。\n- `bubbles` -- 返回一个布尔值，表示事件是否在\
  \ DOM 中冒泡。（支持: CH1+, FF1+, NN6+, O5+, SF1+) *返回：* 布尔，只读。\n- `button` -- 指示哪个鼠标按钮引起了事件。0\
  \ 表示左键，1 表示中间键，2 表示右键。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 整数，只读。\n- `cancelable`\
  \ -- 返回一个布尔值，表示事件是否可以被取消。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 布尔，可读写。\n\
  - `cancelBubble` -- 返回一个布尔值，表示事件的冒泡是否已被取消。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\
  \ *返回：* 布尔，可读写。\n- `charCode` -- 返回在按键事件中被按下的字符键的 Unicode 值。（支持: CH1+, FF1+, NN6+,\
  \ O5+, SF1+) *返回：* 整数，只读。\n- `clientX` -- 返回事件的水平位置。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 整数，可读写。\n- `clientY` -- 返回事件的垂直位置。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 整数，可读写。\n- `ctrlKey` -- 返回一个布尔值，表示事件期间是否按下了 <ctrl> 键。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 布尔，只读。\n- `ctrlLeft` -- 返回一个布尔值，表示事件期间是否按下了左侧\
  \ <ctrl> 键。（支持: IE5.5+) *返回：* 布尔，只读。\n- `currentTarget` -- 返回当前注册的事件目标的引用。（支持: CH1+,\
  \ FF1+, NN6+, O5+, SF1+) *返回：* DOM 节点，只读。\n- `dataFld` -- 设置或获取受 `oncellchange`\
  \ 事件影响的数据列。（支持: IE5+) *返回：* 字符串，只读。\n- `dataTransfer` -- 用于拖放操作的对象，用于控制传输的数据和光标的外观。（支持:\
  \ FF1+, IE5+, SF2+) *返回：* 对象，只读。\n- `detail` -- 返回有关事件的详细信息，取决于事件类型。（支持: CH1+, FF1+,\
  \ NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `eventPhase` -- 用于指示当前正在评估事件流的哪个阶段。（支持: CH1+,\
  \ FF1+, NN5+, O5+, SF1+) *返回：* 整数，只读。\n- `explicitOriginalTarget` -- 事件的显式原始目标。（支持:\
  \ FF1+, NN6+) *返回：* DOM 节点，只读。\n- `fromElement` -- 鼠标指针滚入的位置。（支持: IE4+) *返回：* DOM\
  \ 节点，只读。\n- `isChar` -- 返回一个布尔值，表示事件是否产生了键字符。（支持: CH1+, FF1+, NN6+, O5+, SF1+) *返回：*\
  \ 布尔，只读。\n- `keyCode` -- 返回按键事件中非字符键的 Unicode 值，或任何其他类型键盘事件中的任何键。（支持: CH1+, FF1+,\
  \ IE4+, NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `layerX` -- 返回相对于当前层的事件水平坐标。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `layerY` -- 返回相对于当前层的事件垂直坐标。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `metaKey` -- 返回一个布尔值，表示事件期间是否按下了\
  \ meta 键。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 布尔，只读。\n- `nextPage` -- 显示表格绑定的数据集中的下一页记录。（支持:\
  \ IE5.5+) *返回：* 字符串，只读。\n- `offsetX` -- 设置或获取鼠标指针相对于触发事件对象的 x 坐标。（支持: CH1+, FF1+,\
  \ IE4+, NN6+, O6+, SF1+) *返回：* 整数，可读写。\n- `offsetY` -- 设置或获取鼠标指针相对于触发事件对象的 y 坐标。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 整数，可读写。\n- `originalTarget` -- 事件的原始目标。（支持:\
  \ FF1+, NN6+) *返回：* DOM 节点，只读。\n- `pageX` -- 返回相对于页面的水平坐标。（支持: CH1+, FF1+, IE4+,\
  \ NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `pageY` -- 返回相对于页面的垂直坐标。（支持: CH1+, FF1+, NN6+,\
  \ O5+, SF1+) *返回：* 整数，只读。\n- `propertyName` -- 设置或获取事件的。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O5+, SF1+) *返回：* 字符串，只读。\n- `qualifier` -- 返回事件的。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O5+, SF1+) *返回：* 字符串，只读。\n- `reason` -- 返回滚轮滚动的距离和方向。（支持: IE5.5+) *返回：* 整数，只读。\n\
  - `recordset` -- 记录集。（支持: IE4+) *返回：* 整数，可读写。\n- `relatedTarget` -- 标识次要目标。（支持:\
  \ CH1+, FF1+, NN6+, O5+, SF1+) *返回：* DOM 节点，只读。\n- `repeat` -- 返回事件是否重复。（支持: IE5+)\
  \ *返回：* 布尔，只读。\n- `returnValue` -- 返回给函数的返回值。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\
  \ *返回：* 布尔，只读。\n- `saveType` -- 获取事件的类型。（支持: IE5+) *返回：* 字符串，只读。\n- `screenX` --\
  \ 返回事件在屏幕上的水平位置。（支持: CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `screenY`\
  \ -- 返回事件在屏幕上的垂直位置。（支持: CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 整数，只读。\n- `shiftKey`\
  \ -- 返回一个布尔值，表示事件期间是否按下了 <shift> 键。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：*\
  \ 布尔，只读。\n- `shiftLeft` -- 获取左侧 <shift> 键的状态。（支持: IE5.5+) *返回：* 布尔，只读。\n- `srcElement`\
  \ -- 设置或获取触发事件的对象。（支持: CH1+, FF1+, IE4+) *返回：* DOM 节点，只读。\n- `srcFilter` -- 设置或获取引起\
  \ `onfilterchange` 事件触发的过滤器对象。（支持: IE4+) *返回：* 字符串，只读。\n- `srcUrn` -- 获取触发事件的统一资源名称\
  \ (URN)。（支持: IE5+) *返回：* 字符串，只读。\n- `target` -- 返回最初分发事件的目标引用。（支持: CH1+, FF1+, NN6+,\
  \ O5+, SF1+) *返回：* DOM 节点，只读。\n- `timeStamp` -- 返回事件创建的时间。（支持: CH1+, FF1+, NN6+,\
  \ O6+, SF1+) *返回：* 整数，只读。\n- `toElement` -- 设置或获取用户移动鼠标指针的目标对象引用。（支持: IE4+) *返回：*\
  \ DOM 节点，只读。\n- `type` -- 返回事件的名称（不区分大小写）（支持: CH1+, FF1+, IE4+, NN4+, O5+, SF1+)\
  \ *返回：* 字符串，只读。\n- `view` -- view 属性标识生成事件的 AbstractView。（支持: CH1+, FF1+, NN6+,\
  \ O6+, SF1+) *返回：* Window 对象引用，只读。\n- `wheelData` -- 获取滚轮按钮滚动的距离和方向。（支持: IE5.5+)\
  \ *返回：* 整数，只读。\n- `which` -- 返回键盘事件中键的 Unicode 值，无论按下的是哪种键。（支持: FF1+, NN7+) *返回：*\
  \ 字符串，只读。\n- `x` -- 设置或获取鼠标指针相对于触发事件元素最近相对定位父元素的 x 坐标（像素）。（支持: CH1+, FF1+, IE4+,\
  \ NN6+, O5+, SF1+) *返回：* 整数，可读写。\n- `y` -- 设置或获取鼠标指针相对于触发事件元素最近相对定位父元素的 y 坐标（像素）。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 整数，可读写。\n\n\n\n\n\n## 方法\n\n- `initEvent(eventType,\
  \ bubblesFlag, cancelableFlag)` -- 初始化通过 `DocumentEvent` 接口创建的事件值。（支持: CH1+, FF1+,\
  \ NN6+, O6+, SF1+)\n- `initKeyEvent(eventType, bubblesFlag, cancelableFlag, view,\
  \ ctrlKeyFlag, altKeyFlag, shiftKeyFlag, metaKeyArg, ke)` -- 初始化键盘事件。（支持: CH1+,\
  \ FF1+, NN6+, O7+, SF1+）返回：Event 对象。\n- `initMouseEvent(eventType, bubblesFlag,\
  \ cancelableFlag, view, detailVal, screenX, screenY, clientX, clientY, ctrlKe)`\
  \ -- 在鼠标事件创建后初始化它。（支持: CH1+, FF1+, NN6+, O7+, SF1+）返回：Event 对象。\n- `initUIEvent(eventType,\
  \ bubblesFlag, cancelableFlag, view, detailVal)` -- 在 UI 事件创建后初始化。（支持: CH1+, FF1+,\
  \ NN6+, O7+, SF1+)\n- `preventDefault()` -- 取消事件（如果该事件是可取消的）。（支持: CH1+, FF1+, NN6+,\
  \ O6+, SF1+)\n- `stopPropogation()` -- 停止事件在 DOM 中进一步继续传播。（支持: CH1+, FF1+, NN6+,\
  \ O5+, SF1+)\n\n# 外部对象引用\n\n外部对象是浏览器访问原生代码的切入点。当 Internet Explorer 作为嵌入组件使用时，它是页面与托管该页面的程序之间通信的方式。外部对象还支持一些日常使用的浏览器功能，例如在\
  \ IE 中安装搜索提供程序和加速器。有关这些功能的更多解释，请参见第 22 章。\n\n## 属性\n\n- `menuArguments` -- 返回触发键菜单的窗口对象。（支持:\
  \ IE4+）返回：只读。\n\n## 方法\n\n- `AddChannel(url)` -- 显示对话框，让用户添加通道，或如果已安装则更改通道 URL。已弃用。（支持:\
  \ IE5, IE5.5, IE6）\n- `AddDesktopComponent(sURL, sType [, iLeft] [, iTop] [, iWidth]\
  \ [, iHeight])` -- 将网站或图像添加到 Microsoft Active Desktop。（支持: IE5+）\n- `AddFavorite(sURL\
  \ [, sTitle])` -- 询问用户是否将该 URL 添加到其收藏列表。（支持: IE5+）\n- `AddSearchProvider(engineURL)`\
  \ -- 安装搜索提供程序。（支持: FF2+, IE7+, O9+, SF2+）\n- `AddService(URL)` -- 安装加速器。（支持: IE8+）\n\
  - `AutoCompleteSaveForm(oForm)` -- 将指定的表单保存到自动完成存储区域。（支持: IE5+）\n- `AutoScan(sUserQuery,\
  \ sURL [, sTarget])` -- 尝试通过完成模板传递指定的查询来连接 Web 服务器。（支持: IE5+）\n- `ContentDiscoveryReset()`\
  \ -- 重置与页面相关的订阅、搜索提供程序和 Web Slice 列表。（支持: IE8+）\n- `ImportExportFavorites(bImportExport,\
  \ sImportExportPath)` -- 处理 IE 收藏的导入导出。已弃用。（支持: IE5, IE5.5）\n- `InPrivateFilteringEnabled()`\
  \ -- 检测用户是否启用了 InPrivate 过滤（仅限 IE）（支持: IE8+）\n- `IsSearchProviderInstalled(sUrl)`\
  \ -- Determine 用户是否安装了搜索提供程序。（支持: FF2+, IE7+, O9+, SF2+）\n- `IsServiceInstalled(URL,\
  \ Verb)` -- Determine 用户是否安装了加速器。（支持: IE8+）\n- `IsSubscribed(sURLToCDF)` -- 表示用户是否订阅了指定的通道。已弃用。（支持:\
  \ IE5, IE5.5, IE6）\n- `NavigateAndFind(sLocation, sQuery, sTargetFrame)` -- 导航到指定的\
  \ URL 并选择指定的文本。（支持: IE5+）\n- `ShowBrowserUI(sUI, null)` -- 打开指定的浏览器对话框。有效值包括 LanguageDialog、OrganizeFavorites、PrivacySettings\
  \ 和 ProgramAccessAndDefaults。（支持: IE5+）\n\n# 通用元素引用\n\n这些特性被 DOM 中的所有的 HTML 元素继承。\n\
  \n## 属性\n\n\n\n\n\n- `accessKey`: 对于许多元素，用于聚焦该元素的 ALT 键组合（MacOS 上为 Ctrl 键，Opera\
  \ 中为 Shift-Esc 键）（支持: CH1+, FF1+, IE4+, NN7+, O7+, SF1+）*返回：* `String`，读/写。\n- `all[\
  \ ]`: 此节点内的所有子元素，以 `Array` 形式返回。（支持: IE4+）*返回：* 元素的 `Array`，只读。\n- `attributes[\
  \ ]`: 此节点的所有属性，以 `Array` 形式返回。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+）*返回：* 对象的 `Array`。\n\
  - `baseURI`: 字符串格式的基础 URI。（支持: FF1+, IE5+, NN6+）*返回：* `String`，只读。\n- `baseURIObject`:\
  \ 表示节点基础 URI 的对象。（支持: FF3+）*返回：* 对象引用，只读。\n- `behaviorUrns[ ]`: 分配给此节点的所有行为的 URN（统一资源名称）列表。（支持:\
  \ IE5+）*返回：* `Array`，只读。\n- `canHaveChildren`: 表示当前节点是否能够包含嵌套节点。（支持: IE5+）*返回：*\
  \ `Boolean`，只读。\n- `canHaveHTML`: 表示当前节点是否能够包含 HTML 内容。（支持: IE5+）*返回：* `Boolean`，只读。\n\
  - `childNodes[ ]`: 元素的所有子节点，以 `Array` 形式返回。（支持: CH1+, FF1+, IE5+, NN6+, O8+, SF1+）*返回：*\
  \ 元素的 `Array`，只读。\n- `children[ ]`: 元素的所有子节点，以 `Array` 形式返回。（支持: IE4+, SF1+）*返回：*\
  \ 元素的 `Array`，只读。\n- `cite`: 作为元素来源引用的 URL。仅用于 `blockquote`、`q`、`del` 和 `ins` 对象。（支持:\
  \ CH1+, FF1+, IE6+, NN6+, O7+, SF1+）*返回：* URL 字符串，读/写。\n- `className`: 获取和设置元素的类名。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O8+, SF1+）*返回：* `String`，读/写。\n- `clientHeight`: 元素的内部高度。（支持:\
  \ CH1+, FF1+, IE4+, NN7+, O8+, SF1+）*返回：* `Integer`，只读。\n- `clientLeft`: 元素的左边框宽度。（支持:\
  \ IE4+）*返回：* `Integer`，只读。\n- `clientTop`: 元素的上边框宽度。（支持: IE4+）*返回：* `Integer`，只读。\n\
  - `clientWidth`: 元素的内部宽度。（支持: CH1+, FF1+, IE4+, NN7+, O8+, SF1+）*返回：* `Integer`，只读。\n\
  - `contentEditable`: 表示节点是否可以编辑。默认为继承。（支持: CH1+, IE5.5+, SF1+）*返回：* `Boolean`，读/写。\n\
  - `currentStyle`: 保存由全局样式表、内联样式和 HTML 属性指定的对象级联格式和样式。（支持: IE5+）*返回：* 对象引用，只读。\n\
  - `dir`: 获取和设置元素的方向。接受的值为 ltr 和 rtl。（支持: CH1+, FF1+, IE5+, NN6+, O8+, SF1+）*返回：*\
  \ `String`，读/写。\n- `disabled`: 表示元素是否被禁用。（支持: IE5.5+）*返回：* `Boolean`，读/写。\n- `document`:\
  \ 对文档对象的引用。（支持: CH1+, IE4+, SF1+）*返回：* 对象引用，只读。\n- `filters[ ]`: 作用于对象的 IE 样式过滤器数组。（支持:\
  \ IE4+）*返回：* `Array`，只读。\n- `firstChild`: 第一个直接子节点，如果该元素没有子节点则返回 null。（支持: CH1+,\
  \ FF1+, IE5+, NN6+, O8+, SF1+）*返回：* 对象引用，只读。\n- `hideFocus`: 设置或获取指示对象是否可见地显示焦点的值。（支持:\
  \ IE5.5+）*返回：* `Boolean`，读/写。\n- `id`: 分配给元素的标识符。（支持: CH1+, FF1+, IE4+, NN6+, O6+,\
  \ SF1+）*返回：* `String`，读/写。\n- `innerHTML`: 获取/设置元素的标记和内容。（支持: CH1+, FF1+, IE4+,\
  \ NN6+, O8+, SF1+）*返回：* `String`，读/写。\n- `innerText`: 获取/设置元素不含标记的文本。（支持: IE4+）*返回：*\
  \ `String`，读/写。\n- `isContentEditable`: 表示当前元素是否设置为可编辑。（支持: CH1+, IE5.5+, SF1+）*返回：*\
  \ `Boolean`，只读。\n- `isDisabled`: 表示当前元素是否被设置为禁用。（支持: IE5.5+）*返回：* `Boolean`，只读。\n\
  - `isMultiLine`: 表示当前元素是否能够显示多行文本。（支持: IE5.5+）*返回：* `Boolean`，只读。\n- `isTextEdit`:\
  \ 获取是否可以使用该对象创建 IE `TextRange` 对象。（支持: IE4+）*返回：* `Boolean`，只读。\n- `lang`: 获取/设置元素属性、文本和元素内容的语言。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O7+, SF1+）*返回：* `String`，读/写。\n- `language`: 设置或获取当前脚本编写的语言。有效值包括\
  \ JScript, javascript, vbscript, vbs 和 xml。（支持: IE4+）*返回：* `String`，读/写。\n- `lastChild`:\
  \ 最后一个直接子节点，如果该元素没有子节点则返回 null。（支持: CH1+, FF1+, IE5+, NN6+, O8+, SF1+）*返回：* 对象引用，只读。\n\
  - `localName`: 元素限定名称的本地部分。（支持: CH1+, FF1+, NN6+, O7+, SF1+）*返回：* `String`，只读。\n\
  - `name`: 获取和设置 name 属性。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+）*返回：* `String`，读/写。\n\
  - `namespaceURI`: 元素的命名空间 URI。（支持: CH1+, FF1+, IE5+, NN6+, O7+）*返回：* `String`，只读。\n\
  - `nextSibling`: 树中的下一个兄弟节点，如果没有后续节点则返回 null。（支持: CH1+, FF1+, IE5+, NN6+, O7+）*返回：*\
  \ `String`，只读。\n- `nodeName`: 节点的节点名称。（支持: CH1+, FF1+, IE6+, O7+）*返回：* `String`，只读。\n\
  - `nodeName`: 节点的主命名空间支持。（支持: IE3+）*返回：* `String`，只读。\n- `nodeType`: 节点的类型。对于元素始终为\
  \ 1。（支持: CH1+, FF1+, IE5+）*返回：* `Integer`，只读。\n- `nodeValue`: 节点的值。对于元素始终为 null。（支持:\
  \ CH1+, FF1+, IE6+）*返回：* `String`，只读。\n- `offsetHeight`: 元素的高度。（支持: CH1+, FF1+,\
  \ IE4+）*返回：* `Integer`，只读。\n- `offsetLeft`: 距离左边框的距离。（支持: CH1+, FF1+, IE4+）*返回：*\
  \ `Integer`，只读。\n- `offsetTop`: 距离上边框的距离。（支持: CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n\
  - `offsetWidth`: 元素的宽度。（支持: CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n- `outerHTML`:\
  \ 获取/设置元素及其后代元素的 HTML。（支持: FF1+, IE9+）*返回：* `String`，读/写。\n- `outerText`: 获取/设置元素及其后代元素的文本。（支持:\
  \ IE5.5+）*返回：* `String`，读/写。（注：在某些浏览器中等同于 `innerText`）。\n- `ownerDocument`: 包含此节点的文档。（支持:\
  \ IE6+）*返回：* `Object Reference`，只读。\n- `parentElement`: 节点的父元素。（支持: CH1+, FF1+,\
  \ IE9+）*返回：* `Element`，只读。\n- `parentNode`: 节点的父节点。（支持: CH1+, FF1+, IE9+）*返回：* `Node`，只读。\n\
  - `parentText`: 节点的父元素的文本。（支持: IE5.5+）*返回：* `String`，只读。\n- `prefix`: 命名空间前缀。（支持:\
  \ IE3+）*返回：* `String`，只读。\n- `previousSibling`: 树中的前一个兄弟节点，如果没有之前的节点则返回 null。（支持:\
  \ CH1+, FF1+, IE5+, NN6+, O7+）*返回：* `Node`，只读。\n- `readyState`: 文档当前状态。包括 `uninitialized`,\
  \ `loading`, `interactive` 和 `complete`。（支持: IE4+）*返回：* `String`，只读。\n- `recordNumber`:\
  \ 元素列表中的序号。（支持: IE4+）*返回：* `Integer`，只读。\n- `runtimeStyle`: 浏览器对元素的默认样式。（支持: IE5+）*返回：*\
  \ `Object`，只读。\n- `scrollHeight`: 元素的滚动高度。（支持: CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n\
  - `scrollLeft`: 获取或设置左滚动距离。（支持: CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n- `scrollTop`:\
  \ 获取或设置上滚动距离。（支持: CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n- `scrollWidth`: 元素的滚动宽度。（支持:\
  \ CH1+, FF1+, IE4+）*返回：* `Integer`，只读。\n- `sourceIndex`: 元素列表中的数字索引。（支持: IE4+）*返回：*\
  \ `Integer`，只读。\n- `style`: 访问元素的样式对象。（支持: CH1+, FF1+, IE4+, NN6+, O7+）*返回：* `Object`，读/写。\n\
  - `tabIndex`: 控制元素的标签页遍历顺序。（支持: CH1+, FF1+, IE4+, NN6+, O7+）*返回：* `Integer`，读/写。\n\
  - `tagName`: 给定元素的标签名称。（支持: CH1+, FF1+, IE4+, NN6+, O7+）*返回：* `String`，只读。\n- `textContent`:\
  \ 获取并设置元素及其所有后代的文本内容。（支持: FF2+）*返回：* `String`，读/写。\n- `title`: 鼠标悬停在元素上时显示的提示字符串。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O7+）*返回：* `String`，读/写。\n- `uniqueID`: 获取自动生成的唯一标识符。（支持:\
  \ IE5+, NN6+, O7+）*返回：* `String`，只读。\n- `unselectable`: 指定元素不可被选中。（支持: IE5.5+）*返回：*\
  \ `String Constant`，读/写。\n\n\n\n\n\n## 方法\n\n\n\n\n- `addBehavior(url)` -- 为元素挂载\
  \ IE 行为。（支持: IE5+） *返回：* 整数。\n- `addEventListener(eventType, listenerFunction, useCapture)`\
  \ -- 为元素的特定事件类型注册事件处理程序。（支持: CH1+, FF1+, NN6+, O7+, SF1+）\n- `appendChild(elementNode)`\
  \ -- 将节点作为该元素的最后一个子节点插入。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+） *返回：* DOM 节点。\n\
  - `applyElement(elementNode[, type])` -- 使该元素成为另一个元素的子元素或父元素。（支持: IE5+）\n- `attachEvent(eventName,\
  \ functionReference)` -- 将指定的函数绑定到事件上，这样当对象上触发该事件时，该函数就会被调用。（支持: IE5+） *返回：* 布尔值。\n\
  - `blur()` -- 使元素失去焦点并触发 onblur 事件。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+）\n- `clearAttributes()`\
  \ -- 移除对象上的所有属性和值。（支持: IE5+）\n- `click()` -- 模拟点击并触发 onclick 事件。（支持: CH1+, FF1+,\
  \ IE4+, NN2+, O3+, SF1+）\n- `cloneNode(bool)` -- 从文档层次结构中复制一个指向该对象的引用。（支持: CH1+,\
  \ FF1+, IE5+, NN6+, O7+, SF1+） *返回：* DOM 节点。\n- `componentFromPoint(x,y)` -- 通过特定事件返回位于指定坐标的组件。（支持:\
  \ IE5+） *返回：* 字符串。\n- `contains(elementReference)` -- 检查给定元素是否包含在对象内。（支持: IE4+）\
  \ *返回：* 布尔值。\n- `createControlRange(param)` -- 为文本选择创建一个控制范围。（支持: IE5+） *返回：* 整数。\n\
  - `detachEvent(eventName, functionReference)` -- 将指定的函数从事件上取消绑定，这样当事件触发时，该函数停止接收通知。（支持:\
  \ IE5+） *返回：* 布尔值。\n- `dispatchEvent(eventObject)` -- 向 DOM 中的此节点派发事件。（支持: CH1+,\
  \ FF1+, NN6+, O7+, SF1+） *返回：* 布尔值。\n- `doScroll(scrollAction)` -- 模拟对滚动条组件的点击。（支持:\
  \ IE5+）\n- `dragDrop()` -- 拖放事件。（支持: IE5.5+） *返回：* 布尔值。\n- `fireEvent(eventType[,\
  \ eventObjectReference])` -- 允许在该元素上触发任何事件。（支持: IE5.5+） *返回：* 布尔值。\n- `focus()`\
  \ -- 给当前元素键盘焦点并触发 onfocus 事件。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+）\n- `getAdjacentText(position)`\
  \ -- 返回相邻文本字符串。（支持: IE5+） *返回：* 字符串。\n- `getAttribute(attrName[, caseSensitive])`\
  \ -- 从当前节点获取命名属性的值。（支持: CH1+, FF1+, IE4+, NN6+, O7+, SF1+） *返回：* 字符串。\n- `getAttributeNode(attrName)`\
  \ -- 从当前节点获取命名属性的节点表示。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+） *返回：* 对象。\n- `getAttributeNodeNS()`\
  \ -- 从当前节点获取具有指定名称和命名空间的属性的节点表示。（支持: FF1+, NN6） *返回：* 对象。\n- `getAttributeNS(nameSpace,\
  \ localName)` -- 从当前节点获取具有指定名称和命名空间的属性值。（支持: FF1+, NN6） *返回：* 对象。\n- `getBoundingClientRect()`\
  \ -- 获取一个对象，该对象指定了一个 TextRectangle 集合的边界。（支持: IE5+） *返回：* 对象。\n- `getClientRects()`\
  \ -- 获取一组矩形，描述对象在客户端内内容区域的布局。每个矩形描述单行。（支持: IE5+） *返回：* 数组。\n- `getElementsByTagName(tagName)`\
  \ -- 根据元素名获取一个对象集合。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+） *返回：* 数组。\n- `getElementsByTagNameNS(nameSpaceURI,\
  \ localName)` -- 从当前元素获取所有具有特定标签名和命名空间的后代元素。（支持: FF1+, NN6） *返回：* 元素。\n- `getExpression(attributeName)`\
  \ -- 获取给定属性的表达式。（支持: IE5+） *返回：* 字符串。\n- `hasAttribute(attributeName)` -- 确定是否存在指定名称的属性。（支持:\
  \ CH1+, FF1+, IE8+, NN6+, SF1+） *返回：* 布尔值。\n- `hasAttributeNS(nameSpaceURI, localName)`\
  \ -- 检查元素是否具有指定命名空间下的指定属性。（支持: FF1+, NN6） *返回：* 布尔值。\n- `hasAttributes()` -- 检查元素是否有任何属性。（支持:\
  \ CH1+, FF1+, NN6+, SF1+） *返回：* 布尔值。\n- `hasChildNodes()` -- 检查元素是否有任何子节点。（支持: CH1+,\
  \ FF1+, IE5+, NN6+, O7+, SF1+） *返回：* 布尔值。\n- `insertAdjacentElement(location, elementObject)`\
  \ -- 在指定位置插入元素。（支持: IE5+）\n- `insertAdjacentHTML(location, text)` -- 在指定位置插入 HTML。（支持:\
  \ IE4+）\n- `insertAdjacentText(location, text)` -- 在指定位置插入文本。（支持: IE4+）\n- `insertBefore(newNode,\
  \ referenceNode)` -- 将新节点在参考节点之前插入到元素中。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+） *返回：*\
  \ 节点。\n- `isSupported(feature, version)` -- 测试是否支持特定功能及版本。（支持: IE5+）\n- `mergeAttributes(source)`\
  \ -- 将源属性合并到元素。（支持: CH1+, FF1+, NN6+, SF1+） *返回：* 对象。\n- `normalize()` -- 产生归一化的文本节点。（支持:\
  \ CH1+, FF1+, NN6+, SF1+)\n- `querySelector(selectors[, nsresolver])` -- 返回匹配选择器的第一个元素。（支持:\
  \ IE8+） *返回：* 元素。\n- `querySelectorAll(selectors[, nsresolver])` -- 返回匹配选择器的所有元素列表。（支持:\
  \ IE8+） *返回：* 元素列表。\n- `releaseCapture()` -- 释放鼠标捕获。（支持: IE5+）\n- `removeAttribute(attrName)`\
  \ -- 从元素移除指定属性。（支持: CH1+, FF1+, IE4+, NN6+, O7+, SF1+）\n- `removeAttributeNode(attrName)`\
  \ -- 从元素移除指定属性的节点表示。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+）\n- `removeAttributeNS(namespaceURI,\
  \ qualifiedName)` -- 从当前节点移除指定命名空间和名称的属性。（支持: FF1+, NN6）\n- `removeBehavior(url)`\
  \ -- 从元素移除挂载的行为。（支持: IE5+） *返回：* 布尔值。\n- `removeChild(node)` -- 从对象中移除子节点。（支持: CH1+,\
  \ FF1+, IE5+, NN6+）\n- `removeEventListener(eventType, listenerFunction, useCapture)`\
  \ -- 从元素移除事件处理器。（支持: CH1+, FF1+, NN6+, O7+, SF1+）\n- `removeExpression(propertyName)`\
  \ -- 移除对象的指定属性的表达式。（支持: IE5+）\n- `removeNode(node)` -- 从文档层次结构中移除该节点。（支持: IE5+）\
  \ *返回：* 节点。\n- `replaceAdjacentText(location, text)` -- 替换相邻的文本。（支持: IE5+） *返回：*\
  \ 字符串。\n- `replaceChild(newChild, oldChild)` -- 用新子元素替换旧子元素。（支持: CH1+, FF1+, IE5+,\
  \ NN6+, O7+, SF1+） *返回：* 节点。\n- `replaceNode(newNode)` -- 用新元素替换对象。（支持: IE5+） *返回：*\
  \ 节点。\n- `scrollIntoView(topAlign)` -- 使对象进入视野，对齐窗口顶部或底部。（支持: CH1+, FF1+, IE4+,\
  \ NN7+, O7+, SF2+）\n- `setActive()` -- 设置对象为激活但不赋予焦点。（支持: IE5.5+）\n- `setAttribute(name,\
  \ value[, caseSensitive])` -- 设置指定属性的值。（支持: CH1+, FF1+, IE4+, NN6+, O8+, SF1+）\n\
  - `setAttributeNode(attributeNode)` -- 将属性对象节点作为对象的一部分。（支持: CH1+, FF1+, IE6+, NN6+,\
  \ O8+, SF1+） *返回：* 对象。\n- `setAttributeNodeNS(attributeNode)` -- 设置当前节点中具有指定名称和命名空间的属性节点表示。（支持:\
  \ FF1+, NN6） *返回：* 对象。\n- `setAttributeNS(namespaceURI, qualifiedName, value)` --\
  \ 设置当前节点中具有指定命名空间和名称的属性值。（支持: FF1+, NN6）\n- `setCapture(container)` -- 将鼠标捕获设置为当前文档的对象。（支持:\
  \ IE5+）\n- `setExpression(propertyName, expression[, lang])` -- 为指定对象设置表达式。有效的语言值包括\
  \ JScript、VBScript 和 JavaScript。（支持: IE5+）\n- `swapNode(otherNodeElement)` -- 交换文档层次结构中两个对象的位置。（支持:\
  \ IE5+） *返回：* 节点。\n\n\n\n\n\n## 事件 (Events)\n\n- `onactivate` -- 返回 `onactivate`\
