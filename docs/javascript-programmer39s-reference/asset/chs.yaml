  \ -- 设置或获取处理表单的服务器必须接受输入数据的字符编码列表。（支持: CH1+, FF1+, IE5+, NN6+, O6+, SF1+) *返回值：*\
  \ 字符串，读/写。\n- `action` -- 获取并设置 `FORM` 元素的动作。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\
  \ *返回值：* URL 字符串，读/写。\n- `autocomplete` -- 设置或获取对象的自动完成（输入提示）状态。（支持: FF1+, IE5+)\
  \ *返回值：* 布尔值，读/写。\n- `elements[ ]` -- 表单控件元素的数组。（支持: CH1+, FF1+, IE3+, NN2+, O4+,\
  \ SF1+) *返回值：* 元素数组，读/写。\n- `encoding` -- 设置或获取表单的 MIME 编码。（支持: CH1+, FF1+, IE6+,\
  \ NN6+, O7+, SF1+) *返回值：* MIME 类型字符串，读/写。\n- `enctype` -- 设置或获取表单的 MIME 编码。（支持:\
