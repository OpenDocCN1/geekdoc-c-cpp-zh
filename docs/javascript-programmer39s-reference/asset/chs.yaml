  \ -- 返回具有给定类名的元素列表。（支持: FF3+) *返回：* 引用数组。\n- `getElementsByName(elementName)` --\
  \ 返回具有给定名称的元素列表。（支持: CH1+, FF1+, IE5+, NN6+, O7+, SF1+) *返回：* 引用数组。\n- `getElementsByTagName()`\
  \ -- 根据指定的元素名获取对象集合。（支持: CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* 元素数组。\n- `getElementsByTagNameNS(tagName)`\
  \ -- 从当前元素开始获取所有特定标签名和命名空间的后代元素集。（支持: FF1+, NN7+) *返回：* 元素数组。\n- `importNode(node,\
