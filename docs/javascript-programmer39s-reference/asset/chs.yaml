  \ 字符串，可读/写。\n- `domConfig` -- 应返回一个 DOM 对象。（支持: FF1.5+）*返回：* 对象，只读。\n- `embeds[]`\
  \ -- 返回当前文档嵌入对象的列表。（支持: CH1+, FF1+, IE4+, NN3+, O6+, SF1+）*返回：* 元素数组，只读。\n- `expand`\
  \ -- 设置或检索指示对象内可以创建任意变量的值。（支持: IE4+）*返回：* 布尔值，可读/写。\n- `fgColor` -- 获取并设置当前文档的前景颜色（或文本颜色。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O3+, SF1+）*返回：* 字符串，可读/写。\n- `fileCreatedDate` -- 获取文件的创建日期。（支持:\
  \ IE4+）*返回：* 字符串，只读。\n- `fileModifiedDate` -- 获取文件的最后修改日期。（支持: IE4+）*返回：* 字符串，只读。\n\
  - `fileSize` -- 获取文件大小。（支持: IE4+）*返回：* 整数，只读。\n- `firstChild` -- 第一个直接子节点，如果元素没有子节点则返回\
  \ null。（支持: FF1+, NN8+）*返回：* DOM 节点，只读。\n- `forms[]` -- 返回当前文档内 FORM 元素的列表。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O4+, SF1+）*返回：* 元素数组，只读。\n- `frames[]` -- 返回当前文档内 FRAME\
  \ 元素的列表。（支持: IE4+）*返回：* 元素数组。\n- `height` -- 获取并设置当前文档的高度像素。（支持: FF1+, NN4+）*返回：*\
  \ 整数，只读。\n- `images[]` -- 返回当前文档中的图像列表。（支持: FF1+, IE4+, NN3+, O5+）*返回：* 元素数组，只读。\n\
  - `implementation` -- 返回与文档相关的实现。（支持: FF1+, IE6+, NN6+, O7+）*返回：* 对象，只读。\n- `inputEncoding`\
  \ -- 解析文档时使用的编码。（支持: FF1.5+）*返回：* 字符串，只读。\n- `lastModified` -- 返回文档最后修改的日期。（支持:\
