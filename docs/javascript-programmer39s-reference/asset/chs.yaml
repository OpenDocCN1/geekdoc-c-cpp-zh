  \n## 引言\n自 Netscape 在十四多年前推出以来，`JavaScript` 已成为世界上最广泛使用的脚本语言之一。今天，地球上几乎每台电脑都配备了\
  \ `JavaScript` 引擎，无论是 Mac、Windows PC 还是 Linux 。它帮助开发者在 Web 上创建丰富的用户体验，是互联网成为可用业务应用程序平台的推动因素之一。本书旨在不仅仅是教程和参考材料的集合。它旨在为新手和资深开发者提供一个全面且准确的资源。它是你希望一直放在电脑旁边的书，随时翻阅以回顾技巧、浏览器兼容性以及对语言一些最前沿功能的深入解释。它从语法基础、通用特性和流程控制开始，一直到面向对象的继承、离线存储、Ajax\
  \ 和调试等高级方法。尽管如此，你不需要从头到尾读这本书。它使用离散的示例而不是大型参考程序，并提供清晰明确的标题以便浏览。你可以跳转到材料的任何位置，只要你对前面的章节有一定的理解，你就可以直接开始。最后，本书与其他\
  \ `JavaScript` 书籍的区别在于，它促使你超越浅表的熟悉，并提供了一些解决困难现实问题的新工具。\n\n# 本书目标读者\n\n\n\n\n鉴于 ECMAScript\
  \ 在浏览器内外都有许多多种不同的实现方式，有必要明确谁将从本参考书中受益最浅。本书面向主要从事客户端浏览器端 JavaScript 开发的开发者，尽管其中许多概念也适用于服务器端以及使用\
  \ `Rhino`、`Spidermonkey` 或 `JScript.NET` 等工具的编译实现。\n\n本书的早期章节对所有语言基础知识提供了详尽的介绍，因此不需要预先具备\
  \ JavaScript 经验。具备其他相关的编程经验将会有帮助，因为许多术语和语法将与其他语言相同。经验丰富的 JavaScript 开发者也将从书的中部、后部分以及附录中的参考资料中获益良多。\n\
  \n具备一些 `HTML` 先先经验也是理想的，因为我不会详细解释不同 `HTML` 标签的含义，也不会深入解释 `HTML` 文档的基本结构。对于希望扩展对浏览器脚本理解的设计师来说，这本书也是一份理想的资源。如果你拥有设计背景并已经理解\
  \ `CSS` 和 `HTML`，那么你已经为 `DHTML`、动画和级联样式表（Cascading Style Sheets）章节做好了充分准备。\n\n最重要的是，我将本书设计为所有严肃的\
  \ JavaScript 开发者的首选资源，也是那种你想要一直放在电脑旁边的书籍。随着你能力的提高和应用程序变得日益复杂，你将在这些页码中发现新的宝藏，让你流连忘返。\n\
  \n# 本书的结构\n\n\n\n本书的章节设计遵循循序渐进的原则：前四章涵盖基础内容，第五到第十五章涵盖中等主题，结尾部分则是高级主题。这种渐进性体现在：初学者应该从第\
  \ 1 章开始并一直读下去，但整本书的结构也适用于所有技能水平的开发者。即使在前面的章节中，高级开发者也会欣赏书中包含关于语言、性能和兼容性的相当底层的信息。以下是各章节的简要描述，供你参考。\n\
  \n## 第 1 章：JavaScript 简介\n概述了该语言的现状，并简要介绍了从 `Netscape 2` 时代开始的演变历史。本章解释了 `CSS` 和\
  \ `DOM` 等各种相关技术的作用。还向读者介绍了一个代表性的“Hello World” JavaScript 应用。\n\n## 第 2 章：浏览器中的 JavaScript\n\
  详细概述了 JavaScript 具体是如何接入浏览器运行环境的、如何在页面中引入脚本，以及如何通过浏览器事件控制执行。\n\n## 第 3 章：JavaScript\
  \ 基础\n解释了 JavaScript 的基本特性，以及它在底层如何与其他编程语言进行比较。此处涵盖的其他主题还包括变量、垃圾收集、类型转换和对象。\n\n\
  ## 第 4 章：表达式、运算符和语句\n涵盖了所有的标准运算符、语句，以及我们如何构建表达式。还提供了一些关于优先级和性能的详细信息。\n\n## 第 5 章：函数\n\
  介绍了我们创建函数的各种方式，包括闭包（closures）这一不寻常的概念。本章还讨论了作用域、嵌套函数和执行上下文。\n\n## 第 6 章：全局对象和 Object\
  \ 对象\n详细概述了该语言中几个最基础的概念。本章解释了 `global object`（全局对象）的作用以及它在浏览器中是如何使用的。我们查看了需要避免的陷阱，以及使用它来简化开发的方法。之后，我们查看了\
  \ `Object` 对象，它充当该语言中所有其他对象的原型。我们简要介绍了继承的概念，以展示如何通过扩展这个对象来为我们所有其他类型添加功能。\n\n## 第\
  \ 7 章：String 和 RegExp 对象\n详细概述了核心对象 `String` 以及一些高级字符串处理操作。\n\n## 第 8 章：Boolean、Number\
  \ 和 Math 对象\n深入讨论了 `Number` 对象、`Boolean` 对象和 `Math` 对象，包括一些常用操作的示例。\n\n## 第 9 章：Array\
  \ 和 Date 对象\n描述了数组并向你展示如何处理日期。\n\n## 第 10 章：面向对象开发\n概述了 JavaScript 的面向对象特性、如何创建类和对象，以及一些模拟其他语言中面向对象概念的有用工具。\n\
  \n## 第 11 章：窗口与框架（Frames）\n解释了浏览器检测的原理、`location` 和 `history` 对象、窗口几何结构、窗口的创建与操作，以及其他几个相关主题。\n\
  \n## 第 12 章：事件\n描述了 `DOM` 事件模型（包括浏览器之间的差异）以及创建自定义事件的系统。本章还回顾了各种常用窗口事件的内部细节以及它们在不同浏览器之间的区别。\n\
  \n## 第 13 章：文档对象模型（DOM）\n描述了与在浏览器内部操作 `DOM` 相关的所有重要概念和活动，包括浏览器差异及其适用场景。\n\n## 第\
  \ 14 章：表单（Forms）\n描述了如何访问和操作表单集合、动态更改并创建新表单，以及每个表单字段类型的所有重要功能。本章还提供了一些常见表单任务的配方（recipes），并描述了如何创建和使用所见即所得（WYSIWYG）字段。\n\
  \n## 第 15 章：层叠样式表（CSS）\n涵盖了与与 JavaScript JavaScript 交互交互，包括如何访问和操作样式、表格，甚至如何预加载样式中包含的图像。\n\
  \n## 第 16 章：动态 HTML（DHTML）\n回顾了一些用于执行 `DOM` 操作和动画的有用技术和工具，旨在构建丰富的用户界面。此处涵盖的主题包括定位、`z-index`、动画和非线性动画、精灵图、32\
  \ 位图形，甚至一些构建 DHTML 组件的示例。\n\n## 第 17 章：JavaScript 安全\n解释了与 JavaScript 相关的许多安全问题和限制，特别是针对\
  \ `Ajax` 开发者。\n\n## 18 章：客户端数据与持久化\n描述了如何使用 `cookies`、`sessionStorage`、`globalStorage`、`userData`\
  \ 等离线存储机制，在跨页面加载和浏览器会话期间持久化客户端数据。\n\n## 第 19 章：Ajax\n包含了使用 `XMLHttpRequest` 对象与服务器通信的所有要点，以及在浏览器和服务器之间往返传输数据的其他方法。\n\
  \n## 第 20 章：处理 XML\n展示了如何在浏览器中解析和操作 XML 文档。\n\n## 第 21 章：处理 JSON\n涵盖了 JavaScript\
  \ 对象表示法（JSON）在 `Ajax` 和通用 JavaScript 开发中的作用和用法。\n\n## 第 22 章：独特的浏览器特性\n探索了 Internet\
  \ Explorer、Firefox 和 Safari 中可用的一些专用浏览器扩展。主题包括搜索提供程序、Web Slices、条件注释、`CSS Filters`、地理位置（Geolocation）、Web\
  \ Workers、Google Gears 等。\n\n## 第 23 章：脚本插件\n包含了与浏览器插件（如 Adobe Flash、Java Applets、DivX\
  \ 视频播放器和 Silverlight）进行交互的示例。\n\n## 第 24 章：调试\n解释了 `Error` 对象的用法、错误处理程序的利用，以及使用\
  \ Firebug、Fiddler、Drosera 和 Dragonfly 等工具排查 JavaScript 问题的方法。\n\n## 第 25 章：性能调优\n\
  研究了通过避免常见陷阱来优化代码性能的方法。还将查看如何对页面进行速度分析以识别问题。\n\n## 附录 A：核心 JavaScript 语言\n描述了所有的标准运算符和语句，包括一些私有的浏览器扩展（带示例）。\n\
  \n## 附录 B：JavaScript 全局对象\n包含了所有全局对象的完整引用（带示例），包括一些私有的浏览器对象。\n\n## 附录 C：JavaScript\
  \ 全局属性\n描述了作为全局对象的一部分的标准属性（带示例）。\n\n## 附录 D：JavaScript 全局函数\n描述了作为全局对象的一部分的所有标准函数（带示例）。\n\
  \n## 附录 E：保留字与特殊单词\n列出了 ECMAScript 规范中所有已知的保留字，以及流行的浏览器扩展和专用浏览器功能使用的额外关键字。\n\n##\
  \ 附录 F：文档对象引用\n包含了详尽的 `DOM` 对象和属性列表，并带有详细的浏览器支持信息和描述。\n\n## 附录 G：网络资源\n指向了一些用于 JavaScript、DHTML\
  \ 和 CSS 开发的有用 Web 资源。\n\n# 使用本书的准备\n\n使用本书不需要特殊的软件或硬件。建议下载 Firefox、Opera 和 Safari\
  \ 进行测试，并在 Windows 网上将 Internet Explorer 升级到最新版本。简单的文本编辑器就足够编辑和测试书中的示例。根据需要，还将推荐一些额外的免费工具用于性能分析和调试。需要时我会告诉你去哪里获取。\n\
