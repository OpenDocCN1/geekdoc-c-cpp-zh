  \ 链接 target 属性提供的窗口名称。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回：* 字符串，读/写。\n•\
  \ `type` -- 设置或获取对象的 MIME 类型。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+) *返回：* 字符串，读/写。\n\
  • `urn` -- 设置或获取目标文档的统一资源名称 (URN)（支持: IE4+) *返回：* 字符串，读/写。\n\n# Location 对象引用\n\n\
  Location 对象是 window 对象的成员，并以组件化的方式访问文档的 URL。\n\n## 属性\n\n\n\n\n\n• `hash` -- URL\
  \ 中符号符号之后的部分，包含该符号。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `host`\
  \ -- 主机名和端口号。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `hostname`\
  \ -- 主机名（不包含端口号）。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `href`\
  \ -- 引用的完整 URL。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `pathname`\
  \ -- 路径（相对于主机）。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `port`\
  \ -- URL 的端口号。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `protocol`\
  \ -- 设置或获取 URL 的协议部分。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n• `search`\
  \ -- URL 中 ? 符号之后的部分，包含 ? 符号。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* 字符串，读/写。\n\
  \n## Methods\n\n• `assign(URL)` -- 加载指定 URL 的文档。（支持: CH1+, FF1+, IE3+, NN2+, O5+,\
  \ SF1+)\n• `reload(unconditionalGetBoolean)` -- 从当前 URL 重新加载文档。（支持: CH1+, FF1+,\
  \ IE4+, NN3+, O6+, SF1+)\n• `replace(URL)` -- 用指定 URL 的文档替换当前文档。（支持: CH1+, FF+,\
  \ IE4+, NN3+, O6+, SF1+)\n• `toString()` -- 返回 Location 对象 URL 的字符串表示。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O5+, SF1+) *返回：* 字符串。\n\n# Range Object Reference\n\nRange 对象是\
  \ Microsoft 对文档中连续区域的表示——类似于选择。此对象在某种程度上对应于 W3C TextRange。参见第 13 章：文档对象模型以获取关于范围更完整的解释。\n\
  \n## Properties\n\n• `collapsed` -- 返回一个布尔值，表示范围的起点和终点是否在同一位置。（支持: CH1+, FF1+, NN6+,\
  \ O6+, SF1+) *返回：* 布尔值，只读。\n• `commonAncestorContainer` -- 返回包含 startContainer 和\
  \ endContainer 节点的深层 Node。（支持: CH1+, FF1+, NN6+, O6+, SF1+) *返回：* DOM 节点，只读。\n•\
  \ `endContainer` -- 返回 Range 结束所在的节点。（支持: CH1+, FF1+, NN6+, O6+, SF1+) *返回：* DOM\
  \ 节点，只读。\n• `endOffset` -- 返回一个数字，表示 Range 在 endContainer 中的结束位置。（支持: CH1+, FF1+,\
  \ NN6+, O6+, SF1+) *返回：* 整数，只读。\n• `intersectsNode` -- 返回一个布尔值，表示给定节点是否与范围交叉。Mozilla\
  \ 仅限。已弃用。（支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 布尔值。\n• `startContainer` -- 返回\
  \ Range 开始所在的节点。（支持: CH1+, FF1+, NN6+, O6+, SF1+) *返回：* DOM 节点，只读。\n• `startOffset`\
  \ -- 返回一个数字，表示 Range 在 startContainer 中的起始位置。（支持: CH1+, FF1+, NN6+, O6+, SF1+) *返回：*\
  \ 整数，只读。\n\n## Methods\n\n• `cloneContents()` -- 返回一个复制了 Range 节点的文档片段。（支持: CH1+,\
  \ FF1+, NN7+, O7+, SF1+) *返回：* DocumentFragment 节点引用。\n• `cloneRange()` -- 返回一个边界点与克隆的\
  \ Range 相同的 Range 对象。（支持: CH1+, FF1+, NN7+, O7+, SF1+) *返回：* Range 对象引用。\n• `collapse([startBool])`\
  \ -- 将 Range 折叠到其一个边界点上。（支持: CH1+, FF1+, NN6+, O7+, SF1+)\n• `compareBoundaryPoints()`\
  \ -- 比较两个 Range 的边界点。（支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 整数 ( -1, 0 或 1 )。\n\
  • `compareNode(nodeRef)` -- 返回一个常量，表示节点在范围的之前、之后、内部还是周围。Mozilla 仅限。已弃用。（支持: FF1,\
  \ FF1.5, NN6+) *返回：* 整数 (0, 1, 2, 或 3)。\n• `comparePoint(nodeRef, offset)` -- 返回\
  \ -1, 0 或 1，表示该点发生在范围的之前、内部还是之后。（支持: FF1+, NN6+) *返回：* 整数 (-1, 0, 或 1)。\n• `createContextualFragment(text)`\
  \ -- 返回从给定代码字符串创建的文档片段。Mozilla 仅限。（支持: FF1+, NN6+) *返回：* DOM 节点。\n• `deleteContents()`\
  \ -- 从 Range 中删除内容。（支持: CH1+, FF1+, NN6+, O7+, SF1+)\n• `detach()` -- 断开 Range 连接。（支持:\
  \ CH1+, FF1+, NN6+, O7+, SF1+)\n• `extractContents()` -- 从 Range 中提取并删除内容。（支持: CH1+,\
  \ FF1+, NN6+, O7+, SF1+)\n• `insertNode(nodeRef)` -- 在 Range 中插入节点。（支持: CH1+, FF1+,\
  \ NN6+, O7+, SF1+)\n• `selectNode(text)` -- 将 Range 设置为文本。（支持: CH1+, FF1+, NN6+,\
  \ O7+, SF1+)\n• `isNode(nodeRef)` -- 返回一个布尔值，表示给定节点是否在范围内。Mozilla 仅限。（支持: FF1+,\
  \ NN6+) *返回：* 布尔值。\n• `selectNode(nodeRef)` -- 将 Range 设置为该节点。（支持: CH1+, FF1+, NN6+,\
  \ O7+, SF1+)\n• `selectNode(nodeRef)` -- 将 Range 设置为该节点。（支持: CH1+, FF1+, NN6+, O7+,\
  \ SF1+)\n• `setEnd(nodeRef)` -- 将 Range 的终点设置为该节点。（支持: CH1+, FF1+, NN6+, O7+, SF1+)\n\
  • `setEnd(nodeRef, offset)` -- 将 Range 的终点设置为节点中的偏移位置。（支持: CH1+, FF1+, NN6+, O7+,\
  \ SF1+)\n• `setStart(nodeRef)` -- 将 Range 的起点设置为该节点。（支持: CH1+, FF1+, NN6+, O7+,\
  \ SF1+)\n• `setStart(nodeRef, offset)` -- 将 Range 的起点设置为节点中的偏移位置。（支持: CH1+, FF1+,\
  \ NN6+, O7+, SF1+)\n• `surroundContents(nodeRef)` -- 用新节点包裹 Range 的内容。（支持: CH1+,\
  \ FF1+, NN7+, O7+, SF1+)\n• `toString()` -- 返回 Range 的文本。（支持: CH1+, FF1+, NN6+,\
  \ O7+, SF1+)\n\n# Selection Object Reference\n\nSelection 对象代表页面上连续文本的选择。参见第 13\
  \ 章：文档对象模型以获取关于选择和范围的完整解释。\n\n## Properties\n\n• `anchorNode` -- 选择开始的节点。（支持: FF1+,\
  \ NN6+) *返回：* DOM 节点，只读。\n• `anchorOffset` -- 选择在 anchorNode 中的偏移字符数。（支持: FF1+,\
  \ NN6+) *返回：* 整数，只读。\n• `focusNode` -- 选择结束的节点。（支持: FF1+, NN6+) *返回：* DOM 节点，只读。\n\
  • `focusOffset` -- 选择在 focusNode 中的偏移字符数。（支持: FF1+, NN6+) *返回：* 整数，只读。\n• `isCollapsed`\
  \ -- 返回一个布尔值，表示选择的起点和终点是否在同一位置。（支持: FF1+, NN6+) *返回：* 布尔值，只读。\n• `rangeCount` --\
  \ 选择中包含范围的数量。（支持: FF1+, NN6+) *返回：* 整数，只读。\n• `type` -- 指明元素的类型（例如：button, submit,\
  \ reset ）（支持: IE4+) *返回：* 字符串，只读。\n• `typeDetail` -- 获取选择类型的名称。（支持: IE5.5+) *返回：*\
  \ 字符串，只读。\n\n\n\n\n\n## Methods\n\n* `addRange(rangeRef)` -- 将被添加到选择中的范围对象。((支持:\
  \ FF1+, NN6+)\n* `clear()` -- 清空选择的内容。((支持: IE4+)\n* `collapse(nodeRef, offset)`\
  \ -- 将当前选择折叠为单个点。((支持: FF1+, NN6+)\n* `collapseToEnd()` -- 将选择的锚点移动到与焦点相同的点。焦点位置不变。((支持:\
  \ FF1+, NN6+)\n* `collapseToStart()` -- 将选择的焦点移动到与锚点相同的点。((支持: FF1+, NN6+)\n* `containsNode()`\
  \ -- 表示特定节点是否是选择的一部分。((支持: FF1+, NN6+) *返回：* 布尔值。\n* `createRange()` -- 创建一个 `Range`\
  \ 对象。((支持: IE4+) *返回：* TextRange 对象。\n* `deleteFromDocument()` -- 从父文档中移除选择内容。((支持:\
  \ FF1+, NN6+)\n* `empty()` -- 如果选择为空，则返回真。((支持: IE4+)\n* `extend(nodeRef, offset)`\
  \ -- 将选择的焦点移动到指定点。((支持: FF1+, NN6+)\n* `getRangeAt(rangeIndex)` -- 返回一个代表当前选择范围之一的范围对象。((支持:\
  \ FF1+, NN6+) *返回：* Range 对象。\n* `removeAllRanges()` -- 从选择中移除所有范围。((支持: FF1+, NN6+)\n\
  * `removeRange(rangeRef)` -- 从选择中移除一个范围。((支持: FF1+, NN6+)\n* `selectAllChildren(elementNodeRef)`\
  \ -- 将指定节点的所有子添加到选择中。((支持: FF1+, NN6+)\n* `toString()` -- 返回当前选择对象表示的字符串。((支持: FF1+,\
  \ NN6+)\n\n# 对象引用 (Storage Object Reference)\n\n由 HTML 5 会话存储（session）和本地存储（local\
  \ storage）接口创建。请参阅第 18 章：客户端数据与持久化以了解 HTML 5 DOM 存储。\n\n## 属性\n\n* `length` -- 返回当前存储器中项的数量。((支持:\
  \ FF3.5+, IE8+, SF4+)\n* `remainingSpace` -- 返回当前存储对象未使用的存储空间（以字节计数）。(支持: FF3.5+,\
  \ IE8+, SF4+)\n\n## 方法\n\n* `clear()` -- 清空当前存储对象。((支持: FF3.5+, IE8+, SF4+)\n* `getItem(keystring)`\
  \ -- 返回当前存储对象中项目的值。((支持: FF3.5+, IE8+, SF4+)\n* `key(lIndex)` -- 返回当前存储对象中指定索引处的键。((支持:\
  \ FF3.5+, IE8+, SF4+)\n* `removeItem(keystring)` -- 从当前存储对象中移除项目。((支持: FF3.5+, IE8+,\
  \ SF4+)\n* `setItem(keystring, value)` -- 在当前存储对象中设置存储键-值对。((支持: FF3.5+, IE8+, SF4+)\n\
  \n## 事件\n\n* `onstorage` -- 当存储区域发生变化时，在文档中触发。((支持: FF3.5+, IE8+, SF4+)\n* `onstoragecommit`\
  \ -- 当本地存储写入磁盘时触发。((支持: IE8+)\n\n# 样式对象引用 (Style Object Reference)\n\n单个规则的接口。DOM\
  \ 元素拥有 Style 对象，样式表也是如此。\n\n## 属性\n\n* `media` -- 控制样式表适用于何种输出设备的属性。((支持: CH1+,\
  \ FF1+, IE4+, NN6+, O7+, SF1+) *返回：* 字符串，可读写。\n* `type` -- 设置或获取对象的 MIME 类型。((支持:\
  \ CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串，可读写。\n\n# 样式表对象引用 (styleSheet Object\
  \ Reference)\n\n级联样式表（Cascading Stylesheet）的对象表示。\n\n## 属性\n\n* `cssRules` -- 以数组形式返回样式表中所有的\
  \ CSS 规则。((支持: CH1+, FF1+, NN6+, O9+, SF1+) *返回：* 规则对象数组，只读。\n* `cssText` -- 设置或获取样式规则的持久化表示。((支持:\
  \ IE5+) *返回：* 字符串，可读写。\n* `disabled` -- 表示当前样式表是否已应用。((支持: CH1+, FF1+, IE4+, NN6+,\
  \ O9+, SF1+) *返回：* 布尔值，可读写。\n* `href` -- 返回样式表的位置。((支持: CH1+, FF1+, IE4+, NN6+,\
  \ O9+, SF1+) *返回：* 字符串，可读写。\n* `id` -- 分配给元素的标识符。((支持: CH1+, IE4+) *返回：* 字符串，只读。\n\
  * `imports` -- 获取为相应 styleSheet 对象定义的所有导入样式表的集合。((支持: IE4+) *返回：* styleSheet 对象数组，只读。\n\
  * `media` -- 指定样式信息的预定目标介质。((支持: CH1+, FF1+, IE4+, NN6+, O9+, SF1+) *返回：* 取决于类型，可读写。\n\
  * `ownerNode` -- 返回将此样式表与文档关联的节点。((支持: CH1+, FF1+, NN6+, O9+, SF1+) *返回：* DOM 节点，只读。\n\
  * `ownerRule` -- 如果此样式表来自 `@import`，则 `ownerRule` 属性将包含 `CSSImportRule`。((支持: CH1+,\
  \ FF1+, NN6+, O9+, SF1+) *返回：* CSSImportRule。\n* `owningElement` -- 返回拥有此样式表的元素。((支持:\
  \ IE4+) *返回：* DOM 节点。\n* `pages` -- 获取表示页面的集合。((支持: IE5+) *返回：* 页面。\n* `parentStyleSheet`\
  \ -- 返回包含此项的样式表。((支持: CH1+, FF1+, NN6+, O9+, SF1+) *返回：* styleSheet。\n* `readOnly`\
  \ -- 表示规则是否为只读。((支持: IE4.5+) *返回：* 布尔值。\n* `rules` -- 获取样式表中定义的规则。如果没有规则，则集合长度为\
  \ 0。((支持: IE4+) *返回：* 规则对象数组。\n* `title` -- 返回样式表的标题。((支持: CH1+, FF1+, IE4+, NN6+,\
  \ O9+, SF1+) *返回：* 字符串，可读写。\n\n## 方法\n\n* `addImport(URL[, index])` -- 为样式表添加样式表。((支持:\
  \ IE4+) *返回：* 整数。\n* `addRule(selector, styleSpec[, index])` -- 为样式表创建一个规则。((支持:\
  \ IE4+) *返回：* 整数。\n* `deleteRule(index)` -- 从样式表中删除规则。((支持: CH1+, FF1+, NN6+, O9+,\
  \ SF1+)\n* `insertRule(rule, index)` -- 在样式表中插入一条新规则。((支持: CH1+, FF1+, NN6+, O9+,\
  \ SF1+) *返回：* 整数。\n* `removeRule(index)` -- 从样式表中删除现有规则，并相应地调整索引。((支持: IE4+)\n\n\
  # Text 引用 (TextRange Reference)\n\n连续文本块的 W3C 实现。`TextRange` 对象对应于 Microsoft 的 `Range`\
  \ 对象。见第 13 章。\n\n## 属性\n\n* `boundingHeight` -- 获取边界 TextRange 对象的矩形高度。((支持: IE5.5+)\n\
  * `boundingLeft` -- 获取边界 TextRange 对象的矩形左边缘与包含该 TextRange 的对象左侧之间的距离。((支持: IE5.5+)\n\
  * `boundingTop` -- 获取边界 TextRange 对象的矩形上边缘与包含该 TextRange 的对象顶侧之间的距离。((支持: IE5.5+)\n\
  * `boundingWidth` -- 获取边界 TextRange 对象的矩形宽度。((支持: IE5.5+)\n* `htmlText` -- 获取有效\
  \ HTML 片段的源码。((支持: IE5.5+)\n* `offsetLeft` -- 获取对象相对于布局或坐标父元素的计算后的左位置，由 `offsetParent`\
  \ 属性决定。((支持: IE5.5+)\n* `offsetTop` -- 获取对象相对于布局或坐标父元素的计算后的上位置，由 `offsetParent`\
  \ 属性决定。((支持: IE5.5+)\n* `text` -- 设置或获取范围内的文本。((支持: IE5.5+)\n\n\n\n\n\n# Window\
  \ 对象引用\n\nwindow 对象代表浏览器窗口本身，同时也是全局对象的引用。\n\n## 属性\n\n- `collapse([bStart])` --\
  \ 将插入点移动到当前范围的开始或结束。（支持：IE5.5+）\n- `compareEndPoints(sType, oRange)` -- 将 `TextRange`\
  \ 对象的端点与另一个范围的端点进行比较。（支持：IE5.5+）\n- `duplicate()` -- 返回 `TextRange` 的副本。（支持：IE5.5+）\n\
  - `execCommand(sCommand [, bUserInterface] [, vValue])` -- 在当前文档、当前选择项或给定的范围内执行命令。（支持：IE5.5+）\n\
  - `expand(sUnit)` -- 扩展范围，使部分单元被完全包含。（支持：IE5.5+）\n- `findText(sText [, iSearchScope]\
  \ [, iFlags])` -- 在文档中搜索文本，并定位范围的起始和结束点，以包含搜索字符串。（支持：IE5.5+）\n- `getBookmark()`\
  \ -- 获取书签（不透明字符串），该书签可配合 `moveToBookmark` 使用返回相同的范围。（支持：IE5.5+）\n- `getBoundingClientRect()`\
  \ -- 获取一个对象，用于指定一组 `TextRectangle` 对象的边界。（支持：IE5.5+）\n- `getClientRects()` -- 获取一个矩形集合，描述客户端内某个对象或范围的内容的布局。每个矩形描述单行。（支持：IE5.5+）\n\
  - `inRange(oRange)` -- 返回一个值，指示一个范围是否包含在另一个范围内。（支持：IE5.5+）\n- `isEqual(oCompareRange)`\
  \ -- 返回一个值，指示指定的范围是否等于当前范围。（支持：IE5.5+）\n- `move(sUnit [, iCount])` -- 折叠给定的文本范围，并按指定的单元数移动空范围。（支持：IE5.5+）\n\
  - `moveEnd(sUnit [, iCount])` -- 改变范围的结束位置。（支持：IE5.5+）\n- `moveStart(sUnit [, iCount])`\
  \ -- 改变范围的起始位置。（支持：IE5.5+）\n- `moveToBookmark(sBookmark)` -- 移动到书签。（支持：IE5.5+）\n\
  - `moveToElementText(oElement)` -- 移动文本范围，使范围的起始和结束位置包含给定元素中的文本。（支持：IE5.5+）\n- `moveToPoint(iX,\
  \ iY)` -- 将文本范围的起始和结束位置移动到给定点。（支持：IE5.5+）\n- `parentElement()` -- 获取给定文本范围的父元素。（支持：IE5.5+）\n\
  - `pasteHTML(sHTMLText)` -- 将 HTML 文本粘贴到给定的文本范围内，替换范围内之前的任何文本和 HTML 元素。（支持：IE5.5+）\n\
  - `queryCommandEnabled(sCmdID)` -- 返回布尔值，指示根据当前文档状态，指定的命令是否可以使用 `execCommand` 成功执行。（支持：IE5.5+）\n\
  - `queryCommandIndeterm(sCmdID)` -- 返回布尔值，指示指定的命令是否处于确定状态。（支持：IE5.5+）\n- `queryCommandState(sCmdID)`\
  \ -- 返回布尔值，指示命令当前的状态。（支持：IE5.5+）\n- `queryCommandSupported(sCmdID)` -- 返回布尔值，指示当前范围是否支持当前命令。（支持：IE5.5+）\n\
  - `queryCommandValue(sCmdID)` -- 返回给定命令在文档、范围或当前选择项中的当前值。（支持：IE5.5+）\n- `scrollIntoView(\
  \ [bAlignToTop])` -- 使该对象滚动到视图中，将其对齐到窗口的顶部或底部。（支持：IE5.5+）\n- `select()` -- 使选择项等于当前对象。（支持：IE5.5+）\n\
  - `setEndPoint(sType, oTextRange)` -- 根据另一个范围的端点设置一个范围的端点。（支持：IE5.5+）\n\n\n\n\n\n\
