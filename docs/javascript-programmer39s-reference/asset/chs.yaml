  \ Wrox 代码下载主页查看本书以及所有其他 Wrox 书籍的代码。\n\n# 错\n\n我们尽力确保文本或代码没有错误。然而，没有人是完美的，错误在所避免。如果你在我们的某本书书中发现错误（例如拼写错误或代码缺陷），我们将非常感谢你的反馈。通过提交错别信息，你可以为其他读者节省数小时的挫败时间，同时也将帮助我们提供更高质量的信息。\n\
