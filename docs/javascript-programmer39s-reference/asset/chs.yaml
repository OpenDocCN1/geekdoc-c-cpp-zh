  \ 字符串，只读。\n- `mimeType` -- 返回文档的 MIME 类型，未指定时返回空。（支持: IE5+）*返回：* 字符串，只读。\n- `nameProp`\
  \ -- 文档的名称。（支持: FF1+, IE4+, 07+）*返回：* 字符串，只读。\n- `namespaces[]` -- 返回文档的命名空间对象。（支持:\
