  \ 5.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 5.0+, Netscape Navigator 7.0 (Gecko 1.0.1)+, Opera 8.0+, Safari 1.0+\n\n### 语法\n\
  `myXHRInstance.open(method, URL)`\n`myXHRInstance.open(method, URL, async, userName,\
  \ password)`\n\n### 描述\n指定请求的方法、URL 以及其他可选属性。\n\n## 示例\n```html\n<script type=\"\
  text/javascript\">\n// 为了避免重复，未包含 getXHRReference\n// 获取 XHR 对象的实例\nvar request\
  \ = getXHRReference();\n// 执行 POST 请求\nrequest.open(\"POST\", \"/quicktest/data\"\
  , true);\nrequest.setRequestHeader(\"Content-Type\", \"application/x-www-form-urlencoded\"\
  );\nrequest.send(\"vars=none&cool=yes\"); // 我们将发送一些虚拟占位变量作为数据\n</script>\n```\n\
  \n# XMLHttpRequest.send(content)\n\n**标准:** JavaScript 1.5+, JScript 5.0+\n**支持:**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 5.0+, Netscape\
  \ Navigator 7.0 (Gecko 1.0.1)+, Opera 8.0+, Safari 1.0+\n\n### 语法\n`myXHRInstance.send(content)`\n\
  \n### 描述\n发送请求。Content 可以是字符串或文档的引用。\n\n## 示例\n```html\n<script type=\"text/javascript\"\
  >\n// 为了避免重复，未包含 getXHRReference\n// 获取 XHR 对象的实例\nvar request = getXHRReference();\n\
  // 执行 POST 请求\nrequest.open(\"POST\", \"#\", true);\nrequest.send(\"var1=true&var2=false\"\
  ); // 发起请求\n</script>\n```\n\n# XMLHttpRequest.setRequestHeader(label, value)\n\n\
  **标准:** JavaScript 1.5+, JScript 5.0+\n**支持:** Google Chrome Beta+, Firefox 1.0\
  \ (Gecko 1.7)+, Internet Explorer 5.0+, Netscape Navigator 7.0 (Gecko 1.0.1)+, Opera\
  \ 8.0+, Safari 1.0+\n\n### 语法\n`myXHRInstance.setRequestHeader(label, value)`\n\n\
  ### 描述\n向要发送的 HTTP 请求头中添加新的标签值对。\n\n## 示例\n```html\n<script type=\"text/javascript\"\
  >\n// 为了避免重复，未包含 getXHRReference\n// 获取 XHR 对象的实例\nvar request = getXHRReference();\n\
  // 执行 POST 请求\nrequest.open(\"POST\", \"/quicktest/data\", true);\nrequest.setRequestHeader(\"\
  Content-Type\", \"application/x-www-form-urlencoded\");\nrequest.send(\"vars=none&cool=yes\"\
  ); // 我们将发送一些虚拟占位变量作为数据\n</script>\n```\n\n## JavaScript 属性\n除了全局对象外，程序还可以使用几个可用的全局属性。\n\
  \n# Infinity\n**标准:** JavaScript 1.3+, JScript 3.0+, ECMAScript 1.0+\n**支持:** Google\
  \ Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator\
  \ 4.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n`Infinity`\n\n### 描述\n一个表示无穷大的数字。Infinity\
  \ 和 NaN 都是 Number 对象的成员。\n\n## 示例\n```html\n<script>\nvar myVal = Infinity;\ndocument.write(myVal\
  \ + \"<br>\");\nmyVal = 1/Infinity; // 应该是零\ndocument.write(myVal); // 0\n</script>\n\
  ```\n\n# NaN\n**标准:** JavaScript 1.3+, JScript 3.0+, ECMAScript 1.0+\n**支持:** Google\
  \ Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator\
  \ 4.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n`NaN`\n\n### 描述\n返回一个表示“不是数字”的特殊值。Infinity\
  \ 和 NaN 都是 Number 对象的成员。\n\n## 示例\n```html\n<script>\ndocument.write(NaN);\n</script>\n\
  ```\n\n# undefined\n**标准:** JavaScript 1.3+, JScript 5.0+, ECMAScript 1.0+\n**支持:**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 5.5+, Netscape\
  \ Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n`undefined`\n\n### 描述\n一个标识符未定义的数值。这是\
  \ Undefined 类型的唯一成员。\n\n## 示例\n```html\n<script>\nvar x;\nif (x === undefined) {\n\
  \  document.write(\"x is undefined. <br>\"); // x 是未定义的\n}\nx = 1;\nif (x === undefined)\
  \ {\n  // 这部分不会执行\n  document.write(\"x is still undefined.\"); // 不执行\n}\n</script>\n\
  ```\n\n## JavaScript 全局函数\n程序还可以使用几个全局函数。这些函数大部分涉及为了某种目的而解析字符串，其中几个用于准备字符串以用作 URI。关于这些函数的更多解释，请参阅第\
  \ 6 章：全局对象和对象对象。\n\n# decodeURI(string)\n**标准:** JavaScript 1.3+, JScript 5.5+,\
  \ ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 5.5+, Netscape Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n`var\
  \ myString = decodeURI(encodedString)`\n\n### 描述\n返回已编码的统一资源标识符（URI）字符串的未编码值。\n\n\
  ## 示例\n```html\n<script>\nvar myString=\"£€&?@ And this is some test text\";\ndocument.write(encodeURI(myString)\
  \ + \"<br>\");\n// %C2%A3%E2%82%AC&?@%20And%20this%20is%20some%20test%20text\ndocument.write(decodeURI(encodeURI(myString)));\n\
  // £€&?@ And this is some test text\n</script>\n```\n\n# decodeURIComponent(string)\n\
  **标准:** JavaScript 1.3+, JScript 5.5+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+,\
  \ Firefox 1.0 (Gecko 1.7)+, Internet Explorer 5.5+, Netscape Navigator 4.0+, Opera\
  \ 3.0+, Safari 1.0+\n\n### 语法\n`var myString = decodeURIComponent(encodedString)`\n\
  \n### 描述\n返回已编码的统一资源标识符（URI）字符串的某个部分的未编码值。\n\n## 示例\n```html\n<script>\nvar myString=\"\
  £€&?@ And this is some test text\";\ndocument.write(encodeURIComponent(myString)\
  \ + \"<br>\");\n// %C2%A3%E2%82%AC%26%3F%40%20And%20this%20is%20some%20test%20text\n\
  document.write(decodeURIComponent(encodeURIComponent(myString)));\n// £€&?@ And\
  \ this is some test text\n</script>\n```\n\n# encodeURI(string)\n**标准:** JavaScript\
  \ 1.3+, JScript 5.5+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0\
  \ (Gecko 1.7)+, Internet Explorer 5.5+, Netscape Navigator 4.0+, Opera 3.0+, Safari\
  \ 1.0+\n\n### 语法\n`var myEncodedString = encodeURI(myring)`\n\n### 描述\n通过编码保留字符，将字符串编码为有效的统一资源标识符（URI）。\n\
  \n## 示例\n```html\n<script>\nvar myString=\"£€&?@ And this is some test text\";\n\
  document.write(encodeURI(myString) + \"<br>\");\n// %C2%A3%E2%82%AC&?@%20And%20this%20is%20some%20test%20text\n\
  document.write(decodeURI(encodeURI(myString)));\n// £€&?@ And this is some test\
  \ text\n</script>\n```\n\n# encodeURIComponent(string)\n**标准:** JavaScript 1.3+,\
  \ JScript 5.5+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 5.5+, Netscape Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\
  \n### 语法\n`var myEncodedString = encodeURIComponent(myring)`\n\n### 描述\n通过编码保留字符，将字符串编码为有效的统一资源标识符（URI）的某个部分。\n\
  \n## 示例\n```html\n<script>\nvar myString=\"£€&?@ And this is some test text\";\n\
  document.write(encodeURIComponent(myString) + \"<br>\");\n// %C2%A3%E2%82%AC%26%3F%40%20And%20this%20is%20some%20test%20text\n\
  document.write(decodeURIComponent(encodeURIComponent(myString)));\n// £€&?@ And\
  \ this is some test text\n</script>\n```\n\n\n\n\n通过将所有特殊或保留字符替换为相应的编码字符来对字符串。`escape()`\
  \ 不是 Unicode 安全的。\n\n## 示例\n\n```html\n<script>\n\nvar myString=″£€&?@ And this\
  \ is some test text″;\n\ndocument.write(escape(myString) + ″<br />″);\n\n// %A3%u20AC%26%3F@%20And%20this%20is%20some%20test%20text\n\
  \ndocument.write(unescape(escape(myString)));\n\n// £€&?@ And this is some test\
  \ text\n\n</script>\n```\n\n# eval(string)\n\n**标准:** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n## 语法\n\n####\
  \ 基于 Gecko 的引擎 (Firefox)\n```\neval(string[, object])\n```\n\n#### 其他引擎 (JScript,\
  \ Rhino, JavaScriptCore, V8, 等)\n```\neval(string)\n```\n\n## 描述\n\n评估 JavaScript\
  \ 源代码并执行它。\n\n## 示例\n\n```html\n<script>\n\nvar mySimpleExpression = ″document.write(′This\
  \ is a test′);″;\n\neval(mySimpleExpression); // This is a test\n\nvar myExpression\
  \ = new String(″10*10″);\n\neval(myExpression.toString());\n\n</script>\n```\n\n\
  # isFinite(numval)\n\n**标准:** JavaScript 1.1+, JScript 3.0+, ECMAScript 1.0+\n**支持:**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape\
  \ Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\n## 语法\n```\nvar myBool = isFinite(myNum)\n\
  ```\n\n## 描述\n\n返回一个布尔值，指示提供的数字是否有限的。\n\n## 示例\n\n```html\n<script>\n\nvar myNum\
  \ = 10;\n\nif (isFinite(myNum)) {\n    // 这将执行\n    document.write(myNum + ″ was\
  \ finite. <br />″);\n}\n\nvar myNum2 = Infinity;\n\nif (isFinite(myNum2)) {\n  \
  \  // 这将不会执行\n    document.write(myNum2 + ″ was finite. <br />″);\n}\n\n</script>\n\
  ```\n\n# isNaN(numval)\n\n**标准:** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n\
  **支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n## 语法\n```\nvar boolResult = isNaN(numval)\n\
  ```\n\n## 描述\n\n确定传递的值是否会被视为数字。\n\n## 示例\n\n```html\n<script>\n\ndocument.write(isNaN(10)\
  \ + ″<br /> ″); // false\n\ndocument.write(isNaN( ″1 0″) + ″<br /> ″); // false\n\
  \ndocument.write(isNaN( ″ABCD ″) + ″<br /> ″); // true\n\ndocument.write(isNaN(\
  \ ″25CC ″) + ″<br /> ″); // true\n\ndocument.write(isNaN(Math.sqrt(-1))); // true\n\
  \n</script>\n```\n\n# parseFloat(string)\n\n**标准:** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n## 语法\n```\n\
  var myFPNum = parseFloat(numstring)\n```\n\n## 描述\n\n从表示数字的字符串返回一个浮点数。\n\n## 示例\n\
  \n```html\n<script>\n\ndocument.write(parseFloat( ″3.9 9″) + ″<br /> ″); // 3.99\n\
  \ndocument.write(parseFloat( ″399e- 2″) + ″<br /> ″); // 3.99\n\ndocument.write(parseFloat(\
  \ ″0.0399E+ 2″) + ″<br /> ″); // 3.99\n\nvar x = ″3.9 9″;\n\ndocument.write(parseFloat(x)\
  \ + ″<br /> ″); // 3.99\n\ndocument.write(parseFloat( ″3.99 plus point-o-one would\
  \ be four ″) + ″<br /> ″);\n// 3.99\n\n</script>\n```\n\n# parseInt(string)\n\n\
  **标准:** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+,\
  \ Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera\
  \ 3.0+, Safari 1.0+\n\n## 语法\n\n// 大多数 JavaScript 引擎：\n```\nvar myNum = parseInt(numstring)\n\
  ```\n\n基于 基于 Gecko 的：\n```\nvar myNum = parseInt(numstring[, radix])\n```\n\n##\
  \ 描述\n\n从表示数字的字符串返回一个整数。\n\n## 示例\n\n```html\n<script>\n\ndocument.write(parseInt(\
  \ ″F ″, 16) + ″<br /> ″); // 16\n\ndocument.write(parseInt( ″1 0″) + ″<br /> ″);\
  \ // 1\n\ndocument.write(parseInt( ″ABCD ″) + ″<br /> ″); // NaN\n\ndocument.write(parseInt(\
  \ ″25CC ″) + ″<br /> ″); // 25\n\ndocument.write(parseInt(Math.sqrt(-1))); // NaN\n\
  \n</script>\n```\n\n\n\n\n## 属性\n\n- `fillStyle` -- 用于在用颜色或图案填充区域时，设置填充操作的画笔样式。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+) *返回:* 字符串，可读写。\n- `globalAlpha` -- 控制画布整体透明度的浮点值。范围在\
  \ 0.0 到 1.0 之间。（支持: CH1+, FF1.5+, O8+, SF1+) *返回:* 浮数，可读写。\n- `globalCompositeOperation`\
  \ -- 控制画布在底层 HTML 内容之上的显示方式。有效值包括 source--over, copy, lighter 和 darker。（支持: CH1+,\
  \ FF1.5+, O8+, SF1+) *返回:* 字符串，可读写。\n- `lineCap` -- 影响线条绘制。决定线条末端的样式（平头、斜接或圆角）（支持:\
  \ CH1+, FF1.5+, O8+, SF1+) *返回:* 字符串，可读写。\n- `lineJoin` -- 决定线条之间的连接方式。有效值包括倒角、斜接或圆角。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+) *返回:* 字符串，可读写。\n- `lineWidth` -- 决定画布坐标空间中线条的宽度。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+) *返回:* 浮数，可读写。\n- `miterLimit` -- 控制线条如何连接的浮点值。（支持: CH1+,\
  \ FF1.5+, O8+, SF1+) *返回:* 浮数，可读写。\n- `shadowBlur` -- 决定阴影的宽度。（支持: CH1+, FF1.5+,\
  \ O8+, SF1+) *返回:* 整数，可读写。\n- `shadowColor` -- 决定阴影的颜色。（支持: CH1+, FF1.5+, O8+, SF1+)\
  \ *返回:* 字符串，可读写。\n- `shadowOffsetX` -- 决定阴影的水平偏移量。（支持: CH1+, FF1.5+, O8+, SF1+)\
  \ *返回:* 整数，可读写。\n- `shadowOffsetY` -- 决定阴影的垂直偏移量。（支持: CH1+, FF1.5+, O8+, SF1+) *返回:*\
  \ 整数，可读写。\n- `strokeStyle` -- 控制用于绘制画布的描边样式。可以设置为 CSS 颜色、渐变或图案。（支持: CH1+, FF1.5+,\
  \ O8+, SF1+) *返回:* 字符串，可读写。\n\n## 方法\n\n- `arc(x, y, radius, startAngle, endAngle,\
  \ clockwise)` -- 绘制一条弧线。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `arcTo(x1, y1, x2, y2,\
  \ radius)` -- 向特定点绘制一条弧线。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `beginPath()` -- 开始一个新的路径段。以\
  \ `closePath()` 结束。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `bezierCurveTo(cp1x, cp1y, cp2x,\
  \ cp2y, x, y)` -- 使用控制点绘制贝塞尔曲线。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `clearRect(x, y,\
  \ width, height)` -- 用于擦除矩形。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `clip()` -- 根据当前路径和已存在的裁剪路径重新计算裁剪路径。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+)\n- `closePath()` -- 结束由 `beginPath()` 开始的新路径段。（支持: CH1+,\
  \ FF1.5+, O8+, SF1+)\n- `createLinearGrandient(x1, y1, x2, y2)` -- 用于创建线性填充渐变。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+)\n- `createPattern(image, repetition)` -- 用于根据图像和重复模式（repeat,\
  \ repeat--x, repeat--y 和 no--repeat）创建填充图案。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `createRadialGrandient(x1,\
  \ y1, radius1, x2, y2, radius2)` -- 用于根据中心坐标和半径创建径向填充渐变。（支持: CH1+, FF1.5+, O8+,\
  \ SF1+)\n- `drawImage(image, x, y[, width, height[, destX, destY, destWidth, destHeight]])`\
  \ -- 在指定的坐标处按特定尺寸绘制图像。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `fill()` -- 填充当前路径内的区域。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+)\n- `fillRect(x, y, width, height)` -- 填充矩形内的区域。（支持: CH1+,\
  \ FF1.5+, O8+, SF1+)\n- `getContext(contextID)` -- 用于从画布元素获取用于绘制的上下文。（支持: CH1+,\
  \ FF1.5+, O8+, SF1+)\n- `lineTo(x, y)` -- 从当前位置到指定坐标绘制一条线。（支持: CH1+, FF1.5+, O8+,\
  \ SF1+)\n- `moveTo(x, y)` -- 将当前笔触位置移动到指定坐标。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `quadraticCurveTo(cpx,\
  \ cpy, x, y)` -- 向目标坐标绘制二次贝塞尔曲线。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `rect(x, y, width,\
  \ height)` -- 向路径添加矩形。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `restore()` -- 从内存中恢复图形上下文。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+)\n- `rotate(angle)` -- 按指定的弧度旋转画布坐标平面。（支持: CH1+, FF1.5+,\
  \ O8+, SF1+)\n- `save()` -- 保存图形上下文，稍后可以使用 `restore()` 获取。（支持: CH1+, FF1.5+, O8+,\
  \ SF1+)\n- `scale(x, y)` -- 改变图形上下文的比例。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `stroke()`\
  \ -- 将当前路径绘制到画布上。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `strokeRect(x, y, width, height)`\
  \ -- 在画布上绘制矩形框。（支持: CH1+, FF1.5+, O8+, SF1+)\n- `translate(x, y)` -- 按指定的偏移量移动画布坐标系。（支持:\
  \ CH1+, FF1.5+, O8+, SF1+)\n\n\n\n\n\n- `activeElement` -- 获取父级文档拥有焦点时具有焦点的对象。（支持:\
  \ IE4+）*返回：* 对象引用，只读。\n- `alinkColor` -- 返回或设置文档正文中活动链接的颜色。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+）*返回：* 字符串，可读/写。\n- `anchors[]` -- 返回文档中所有锚列表。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+, SF1+）*返回：* 元素数组，只读。\n- `applets` -- 返回文档内 applet 的有序列表。（支持: CH1+,\
  \ FF1+, IE3+, NN2+, O3+, SF1+）*返回：* 对象数组，只读。\n- `async` -- 与 `document.load` 一起使用，表示异步请求。（支持:\
  \ FF1.5+）*返回：* 布尔值，可读/写。\n- `baseURI` -- 字符串格式的基 URI。（支持: FF1+, NN7+）*返回：* 字符串，只读。\n\
  - `baseURIObject` -- 表示节点基 URI 的对象。（支持: FF3+）*返回：* 对象，可读/写。\n- `bgColor` -- 设置或检索指示对象后背景颜的值。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O3+, SF1+）*返回：* 字符串。\n- `body` -- 返回当前文档的 BODY 节点。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O5+, SF1+）*返回：* 节点引用，可读/写。\n- `characterSet` -- 返回文档正在使用的字符集。（支持:\
  \ FF1+, NN6+）*返回：* 字符串，可读/写。\n- `charset` -- 设置或检索用于编码对象的字符集。（支持: IE4+）*返回：* 字符串，可读/写。\n\
