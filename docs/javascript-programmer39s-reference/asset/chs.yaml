  \ URL。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+) *返回：* `Object`，可读/写。\n- `locationbar`\
  \ -- 返回位置栏对象，可以在窗口中切换可见性。（支持: FF1+, NN4+) *返回：* `Object`，可读/写。\n- `menubar` -- 返回菜单栏对象，可以在窗口中切换可见性。（支持:\
  \ FF1+, NN4+) *返回：* `Object`，可读/写。\n- `name` -- 获取并设置名称。（支持: CH1+, FF1+, IE3+, NN2+,\
  \ O5+, SF1+) *返回：* `String`，可读/写。\n- `navigator` -- 返回导航对象，可以查询运行脚本的信息。（支持: CH1+,\
  \ FF1+, IE3+, NN2+, O4+, SF1+) *返回：* `Object`，只读。\n- `offscreenBuffering` -- 控制是否使用离屏缓冲区来及时渲染屏幕内容。（仅在\
  \ IE4 和 Safari 1.2 中支持 *返回：* `Boolean`，可读/写。\n- `opener` -- 设置或获取创建窗口的引用。（支持: CH1+,\
  \ FF1+, IE3+, NN3+, O7+, SF1+) *返回：* `Window` 对象引用。\n- `outerHeight` -- 获取浏览器外部的高度。（支持:\
  \ FF1+, NN4+) *返回：* `Integer`，可读/写。\n- `outerWidth` -- 获取浏览器外部的宽度。（支持: FF1+, NN4+)\
  \ *返回：* `Integer`，可读/写。\n- `pageXOffset` -- `window.scrollX` 的别名。（支持: FF1+, NN4+,\
  \ SF1+) *返回：* `Integer`，只读。\n- `pageYOffset` -- `window.scrollY` 的别名。（支持: CH1+,\
  \ FF1+, NN4+, O7+, SF1+) *返回：* `Integer`，只读。\n- `parent` -- 返回当前窗口或子框架的父级引用。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O6+, SF1+) *返回：* `Window` 对象引用。\n- `personal` -- 返回个人对象，可以在窗口中切换可见性。（支持:\
  \ FF1+, NN4+) *返回：* `Object`，可读/写。\n- `returnValue` -- `showModalDialog()` 函数返回值。（支持:\
  \ FF3+, IE4+) *返回：* `String`，可读/写。\n- `screen` -- 返回屏幕对象的引用。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O7+, SF1+) *返回：* `Object`，只读。\n- `screenLeft` -- 返回窗口的左侧坐标。（支持: FF1+, NN4+,\
  \ SF1+) *返回：* `Integer`，只读。\n- `screenTop` -- 返回窗口的顶部坐标。（支持: CH1+, FF1+, NN4+, O7+,\
  \ SF1+) *返回：* `Integer`，只读。\n- `screenX` -- 返回窗口的左侧坐标。（支持: FF1+, NN4+, SF1+) *返回：*\
  \ `Integer`，只读。\n- `screenY` -- 返回窗口的顶部坐标。（支持: FF1+, NN4+, SF1+) *返回：* `Integer`，只读。\n\
  - `scrollbars` -- 返回滚动条对象，可以在窗口中切换可见性。（支持: FF1+, NN4+) *返回：* `Object`，可读/写。\n- `scrollMaxX`\
  \ -- 窗口可以滚动的最大偏移量。（支持: FF1+, NN4+, SF1+) *返回：* `Integer`，可读/写。\n- `scrollMaxY` --\
  \ 窗口可以滚动的最大偏移量。（支持: CH1+, FF1+, NN4+, O7+, SF1+) *返回：* `Integer`，可读/写。\n- `scrollX`\
  \ -- 返回文档水平滚动的像素数。（支持: FF1+, NN4+, SF1+) *返回：* `Integer`，只读。\n- `scrollY` -- 返回文档垂直滚动的像素数。（支持:\
  \ CH1+, FF1+, NN4+, O7+, SF1+) *返回：* `Integer`，只读。\n- `self` -- 返回窗口自身的对象引用。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O6+, SF1+) *返回：* `Window` 对象引用。\n- `sessionStorage` --\
  \ 用于单页会话数据的存储对象。（支持: FF2+) *返回：* `Object`，只读。\n- `sidebar` -- 返回侧边栏对象的引用。（支持: FF1+,\
  \ NN6+) *返回：* `DOM Node`。\n- `status` -- 获取并设置浏览器底部状态栏文本。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O5+, SF1+) *返回：* `String`，可读/写。\n- `statusbar` -- 返回状态栏对象，可以在窗口中切换可见性。（支持:\
  \ FF1+, NN4+) *返回：* `Object`，可读/写。\n- `toolbar` -- 返回工具栏对象，可以在窗口中切换可见性。（支持: FF1+,\
  \ NN4+) *返回：* `Object`，可读/写。\n- `top` -- 返回窗口层级中最高层窗口的引用。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O5+, SF1+) *返回：* `Window` 对象引用。\n- `window` -- 返回当前窗口对象的引用。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O5+, SF1+) *返回：* `Window` 对象引用，只读。\n\n\n\n\n\n## 方法\n\n- `alert()`\
  \ -- 显示警报对话框。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n- `atob()` -- 解码使用 base-64\
  \ 编码的数据字符串。（支持: FF1.5+）*返回：*字符串。\n- `back()` -- 回到窗口历史记录中的上一个页面。（支持: FF1+, NN4+)\n\
  - `blur()` -- 使元素失去焦点并触发 `onblur` 事件。（支持: FF1.5+）\n- `btoa()` -- 从二进制数据字符串创建 base-64\
  \ 的 ASCII 字符串。（支持: FF1.5+）*返回：*字符串。\n- `clearInterval(intervalReference)` -- 取消使用\
  \ `setInterval` 设置的重复执行。（支持: CH1+, FF1+, IE4+, NN4+, O6+, SF1+)\n- `clearTimeout(timeoutReference)`\
  \ -- 清除使用 `setTimeout` 为特定函数设置的延迟。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)\n- `close()`\
  \ -- 关闭当前窗口。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)\n- `confirm(message)` -- 显示一个带有消息的对话框，用户必须响应。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O5+, SF1+)*返回：*布尔值。\n- `createPopup()` -- 创建一个弹窗窗口对象。（支持:\
  \ IE5.5+）*返回：*对象。\n- `dump(message)` -- 将消息打印到控制台，通常用于调试 JavaScript。（支持: FF1+, NN7+)\n\
  - `escape(string)` -- 字符串编码，将某些字符替换为十六进制转义序列。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)*返回：*字符串。\n\
  - `execScript(expressionList[, language])` -- 在提供的语言中执行指定的脚本。（支持: IE4+)\n- `find(searchString[,\
  \ matchCaseBool, searchUpBool])` -- 在窗口中查找字符串。（支持: FF1+, NN4+)*返回：*布尔值。\n- `focus()`\
  \ -- 给当前元素键盘焦点，并触发 `onfocus` 事件。（支持: FF1.5+）\n- `forward()` -- 将窗口在历史记录中向前移动一个文档。（支持:\
  \ FF1+, NN4+)\n- `getAttention()` -- 尝试获取用户的注意力。具体实现方式取决于操作系统和窗口管理器。注意：Web 内容未启用此功能。（支持:\
  \ FF1+, NN6+)\n- `getComputedStyle(elementNodeReferece, pseudoElName)` -- 获取元素的计算样式。计算样式表示该元素所有\
  \ CSS 属性的计算后值。（支持: FF1+）*返回：*CSS 样式对象。\n- `getSelection()` -- 返回代表所选项目或多个项目的选择对象。（支持:\
  \ FF1+, NN6+)*返回：*选择对象。\n- `home()` -- 将浏览器返回到主页。（支持: FF1+, NN4+)\n- `moveBy(x,y)`\
  \ -- 按指定的量移动当前窗口。（支持: CH1+, FF1+, IE4+, NN4+, O6+, SF1+)\n- `moveTo(x,y)` -- 将窗口移动到指定的坐标。（支持:\
  \ CH1+, FF1+, IE4+, NN4+, O6+, SF1+)\n- `navigate(URL)` -- 将指定的 URL 加载到当前窗口。（支持:\
  \ IE4+)\n- `open(URL, windowName [, windowFeatures[, replaceFlag]])` -- 打开新窗口并加载由指定\
  \ URL 指定文档。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)*返回：*窗口对象。\n- `openDialog(URL,\
  \ windowName[, windowFeatures[, arg1[, argn]]])` -- `window.open` 的扩展——行为相同，不同之处在于可以在\
  \ `windowFeatures` 之后可选地接收一个或多个参数，且 `windowFeatures` 本身处理方式略有不同。（支持: FF1+, NN7+)*返回：*窗口对象。\n\
  - `postMessage(message, targetOrigin)` 为一个窗口向另一个窗口安全地发送数据字符串提供了一种手段，后者不需要与第一个窗口在同一域内。（支持:\
  \ FF3+)\n- `print()` -- 打开打印对话框打印当前文档。（支持: FF1+, IE5+, NN4+, O6+)\n- `prompt(message,\
  \ defaultReply)` -- 返回用户在提示对话框中输入的文本。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)*返回：*字符串。\n\
  - `resizeBy(x,y)` -- 按指定的量调整当前窗口大小。（支持: CH1+, FF1+, IE4+, NN4+, O6+, SF1+)\n- `resizeTo(x,y)`\
  \ -- 动态调整窗口大小。（支持: CH1+, FF1+, IE4+, NN4+, O6+, SF1+)\n- `scroll(x,y)` -- 将窗口滚动到文档中的特定位置。（支持:\
  \ CH1+, FF1+, IE4+, NN3+, O5+, SF1+)\n- `scrollBy(x,y)` -- 按指定的量滚动窗口内的文档。（支持: CH1+,\
  \ FF1+, IE4+, NN4+, O6+, SF1+)\n- `scrollByPages(intervalCount)` 按指定的页数滚动当前文档。（支持:\
  \ FF1+, NN6+)\n- `scrollTo(x,y)` -- 滚动到文档中的一组坐标。（支持: CH1+, FF1+, IE4+, NN4+, O6+,\
  \ SF1+)\n- `setInterval(expression, delayMS[, language])` 每隔 delayMS 毫秒执行一次函数。（支持:\
  \ CH1+, FF1+, IE4+, NN4+, O6+, SF1+)*返回：*对象。\n- `setTimeout(func, delay, [param1,\
  \ param2, . . . ]) 在指定的延迟后执行代码段或函数。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)*返回：*定时对象。\n\
  - `showHelp(url[, contextID])` 显示帮助文件。此方法可用于 Microsoft HTML Help。（支持: IE4+)\n- `showModalDialog(URL[,\
  \ arguments[, features]])` 创建一个模态对话框加载由指定 URL 指定文档。（支持: FF3+, IE4+, SF2+)\n- `showModelessDialog(URL[,\
  \ arguments[, features]])` 创建一个非模态对话框加载由指定 URL 指定文档。（支持: IE4+, SF2+)*返回：*窗口对象。\n\
  - `sizeToContent()` 根据内容调整窗口大小。（支持: FF1+, NN6+)\n- `stop()` 此方法停止窗口加载。（支持: FF1+,\
  \ NN4+)\n- `unescape(string)` 解码用十六进制编码的值，可能是由 `escape()` 函数编码的。（支持: CH1+, FF1+,\
  \ IE4+, NN3+, O5+, SF1+)*返回：*字符串。\n- `updateCommands(sCommandName)` 更新当前外壳窗口命令的状态。（支持:\
  \ FF1+)\n\n## 事件\n\n\n\n\n\n- `onafterprint` -- 窗口打印后触发。(支持: IE5+)\n- `onbeforeprint`\
  \ -- 窗口打印前触发。(支持: IE5+)\n- `onbeforeunload` -- 在窗口卸载之前的瞬间触发。(支持: FF1+, IE4+)\n-\
  \ `onblur` -- 当窗口失去焦点时触发。(支持: FF1+, NN6+)\n- `onchange` -- 当文档发生变化时触发。(支持: FF1+,\
  \ NN7+)\n- `onclick` -- 当窗口上触发鼠标点击事件时触发。(支持: FF1+, IE6+, NN7+)\n- `onclose` -- 当窗口关闭时触发。(支持:\
  \ FF1+, NN7+)\n- `oncontextmenu` -- 当触发右键菜单时触发。(支持: CH1+, FF1+, IE5+, NN6+, O7+,\
  \ SF1+)\n- `ondragdrop` -- 当文档被拖到窗口上时触发。(支持: FF1+)\n- `onerror` -- 返回 `onerror`\
  \ 事件的事件处理代码（用于 JavaScript 错误）。(支持: CH1+, FF1+, IE4+, NN3+, O6+, SF1+) *返回：* 读写。\n\
  - `onfocus` -- 当窗口接收焦点时触发。(支持: FF1+, IE5.5+, NN7, NN9)\n- `onhelp` -- 当按下帮助键（通常为\
  \ F1）时触发。(支持: IE4+)\n- `onkeydown` -- 当按下键时触发。(支持: FF1+, NN7+)\n- `onkeypress` --\
  \ 当按下并释放按键时触发。(支持: FF1+, NN7+)\n- `onkeyup` -- 当释放按键时触发。(支持: FF1+, NN7+)\n- `onload`\
  \ -- 当文档完成加载（包括所有图像和外部文件）时触发。(支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)\n- `onmousedown`\
  \ -- 当按下鼠标按钮时触发。(支持: FF1+, IE5.5+, NN7+)\n- `onmousemove` -- 当窗口记录鼠标移动时触发。(支持: CH1+,\
  \ FF1+, IE5+, NN7+, O7+, SF1+)\n- `onmouseout` -- 当鼠标移出窗口时触发。(支持: FF1+, NN5+)\n\
  - `onmouseover` -- 当鼠标移入窗口时触发。(支持: FF1+, NN6+)\n- `onmouseup` -- 当释放鼠标按钮时触发。(支持:\
  \ FF1+, NN7+)\n- `onpaint` -- 当窗口渲染时触发。已废用。(支持: FF1+, NN7+)\n- `onreset` -- 当用户点击表单上的重置按钮时触发。(支持:\
  \ FF1+, NN6+)\n- `onresize` -- 当用户调整窗口大时触发。(支持: CH1+, FF1+, IE3+, NN4+, O5+, SF1+)\n\
  - `onscroll` -- 当用户滚动窗口时触发。(支持: CH1+, FF1+, IE4+, NN7+, O7+, SF1+)\n- `onselect`\
  \ -- 当文本框或文本区域内的文本被选中时触发。(支持: FF1+, NN6+)\n- `onsubmit` -- 当表单提交时触发。(支持: FF1+, NN6+)\n\
  - `onunload` -- 在页面卸载时触发（例如在页面切换期间）。(支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)\n\n\
  ## navigator\n\n返回 `navigator` 对象的引用，可以通过它可以查询运行脚本的应用程序的信息。\n\n## 属性\n\n- `navigator.appCodeName`\
  \ -- 返回当前浏览器的内部代码。(支持: CH1+, FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，只读。\n- `navigator.appMinorVersion`\
  \ -- 完整版本号小数点右侧数字。(支持: IE4+) *返回：* 字符串，只读。\n- `navigator.appName` -- 返回浏览器的官方名称。(支持:\
  \ CH1+, FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，只读。\n- `navigator.appVersion` --\
  \ 以字符串形式返回浏览器的版本。(支持: CH1+, FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，只读。\n- `navigator.browserLanguage`\
  \ -- 浏览器的本地化语言。有效值可能包括 en, de, es 等。(支持: IE4+) *返回：* 字符串，只读。\n- `navigator.buildID`\
  \ -- 返回基于 Gecko 的浏览器的构建标识。构建 ID 格式为 YYYYMMDDHH。(支持: FF2+) *返回：* 字符串，只读。\n- `navigator.cookieEnabled`\
  \ -- 返回布尔值，表示浏览器是否启用了 cookie。(支持: CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* 布尔，只读。\n\
  - `navigator.cpuClass` -- 运行 IE 的什么系列 CPU。可能的值包括 x86, PPC, 68K, Alpha 和 Other。(支持:\
  \ IE4+) *返回：* 字符串，只读。\n- `navigator.language` -- 返回一个表示浏览器语言版本的字符串。(支持: CH1+, FF1+,\
  \ NN5+, SF1+) *返回：* 字符串，只读。\n- `navigator.mimeTypes` -- 返回浏览器支持的 MIME 类型列表。(支持:\
  \ CH1+, FF1+, NN4+, O7+, SF1+) *返回：* 字符串，只读。\n- `navigator.onLine` -- 返回布尔值，表示浏览器是否在线。(支持:\
  \ IE4+) *返回：* 布尔，只读。\n- `navigator.osc` -- 返回表示操作系统的字符串。(支持: FF1+, NN6+)\n- `navigator.platform`\
  \ -- 返回表示浏览器平台的字符串。(支持: CH1+, FF1+, IE4+, NN4+, O7+, SF1+) *返回：* 字符串。\n- `navigator.plugins`\
  \ -- 返回浏览器中安装的插件。(支持: FF1+, NN3+, O5+, SF1+) *返回：* 插件数组。\n- `navigator.product`\
  \ -- 返回当前浏览器的产品名称。(支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 字符串，只读。\n- `navigator.productSub`\
  \ -- 返回浏览器的构建版本号。(支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 字符串，只读。\n- `navigator.securityPolicy`\
  \ -- 实施了什么安全策略。典型值包括导出策略、美国国内。(支持: CH1+, FF1+, NN4+, O7+, SF1+) *返回：* 字符串，只读。\n\
  - `navigator.systemLanguage` -- 操作系统的语言代码。(支持: IE4+) *返回：* 字符串，只读。\n- `navigator.userAgent`\
  \ -- 返回当前浏览器的用户代理字符串。(支持: CH1+, FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，只读。\n- `navigator.userLanguage`\
  \ -- 操作系统的语言代码（类似于 systemLanguage）。(支持: IE4+) *返回：* 字符串，只读。\n- `navigator.userProfile`\
  \ -- 该对象提供了对某些设置的有限访问（用户权限）。(支持: IE4+) *返回：* userProfile 对象，只读。\n- `navigator.vendor`\
  \ -- 返回当前浏览器的厂商名称。(支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 字符串，只读。\n- `navigator.vendorSub`\
  \ -- 返回厂商版本号。(支持: CH1+, FF1+, NN6+, O7+, SF1+) *返回：* 字符串。\n\n## 方法\n\n- `navigator.javaEnabled()`\
  \ -- 表示主机浏览器是否启用了 Java。(支持: FF1+, NN4+) *返回：* 布尔，只读。\n- `navigator.mozIsLocallyAvailable(uri,\
  \ ifOffline)` -- 让代码检查给定 URI 在不使用网络的情况下是否可用。(支持: FF1.5+) *返回：* 布尔，只读。\n- `navigator.preference(name,\
  \ val)` -- 设置用户偏好。此方法仅对特权代码可用。(支持: FF1+, NN4+) *返回：* 字符串，只读。\n- `navigator.registerContentHandler(mimeType,\
  \ uri, title)` -- 允许网站注册为给定 MIME 类型的处理器。(支持: FF2+) *返回：* 只读。\n- `navigator.registerProtocolHandler(protocol,\
  \ uri, title)` -- 允许网站注册为给定协议的处理器。(支持: FF3+) *返回：* 只读。\n\n## screen\n\n返回一个与窗口关联的屏幕对象的引用。\n\
  \n## 属性\n\n\n\n\n\n- `screen.availTop` -- 指定未分配给永久或半永久用户界面功能的第一个像素的 y 坐标。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O7+, SF1+) *返回：* Integer，只读。\n- `screen.availLeft` -- 返回屏幕左侧第一个可用像素。（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* Integer，只读。\n- `screen.availHeight` --\
  \ 指定屏幕的高度（以像素为单位），该高度减去了操作系统显示的永久或半永久用户界面功能（例如 Windows 上的任务栏）。（支持: CH1+, FF1+, IE4+,\
  \ NN6+, O7+, SF1+) *返回：* Integer，只读。\n- `screen.availWidth` -- 返回窗口可用的水平空间（以像素为单位）（支持:\
  \ CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* Integer，只读。\n- `screen.colorDepth` --\
