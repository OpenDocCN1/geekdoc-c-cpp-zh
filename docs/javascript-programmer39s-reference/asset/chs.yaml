  >Hello</a>\n    <script>\n        // 示例代码逻辑\n    </script>\n</body>\n</html>\n```\n\
  *(注：原文后续的 HTML 标签是杂乱且截断的，已根据 `for .. in` 示例进行逻辑对齐：)*\n\n```html\n<html>\n<body>\n\
