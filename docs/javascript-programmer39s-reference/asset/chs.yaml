  \n## FRAME 对象\n\nFrames 用于在同一个浏览器窗口中显示多个 HTML 文档。`FRAME` 对象与同名的 HTML 元素对应。\n\n##\
  \ 属性\n\n- `allowTransparency` -- 指示帧的背景是否透明。（支持: IE6+) *返回：* Boolean，读/写。\n- `borderColor`\
  \ -- 设置边框的颜色。（支持: IE4+) *返回：* String，读/写。\n- `contentDocument` -- 帧内包含的文档对象的引用。（支持:\
