  \ 字符串，可读/写。\n- `doctype` -- 返回当前文档的文档定义（DTD de 支持: FF1+, NN6+）*返回：* 文档对象，只读。\n-\
  \ `documentElement` -- 返回文档的直接子元素。对于 HTML 文档，这通常是 HTML 元素。（支持: CH1+, FF1+, IE5+,\
