  \n## 事件\n\n• `onabort` -- 当用户取消下载图像时触发。（支持: CH1+, FF1+, IE4+, NN3+, O5+, SF1+)\n\
  • `onerror` -- 在对象加载期间发生错误时触发。（支持: CH1+, FF1+, IE4+, NN3+, O5+, SF1+)\n• `onload`\
  \ -- 返回 onload 事件（当图像加载时）的事件处理代码。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n\n# 链接和锚点对象引用\n\
  \n所有超链接都是该对象的实例。\n\n## 属性\n\n• `charset` -- 用于链接的字符集。（支持: CH1+, FF1+, IE3+, NN2+,\
  \ O3+, SF1+) *返回：* 字符串，读/写。\n• `coords` -- 使用图像地图时触发的坐标。（支持: CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 字符串，读/写。\n• `hash` -- URL 中跟在 # 符号之后的部分。（支持: IE4+) *返回：* 字符串，读/写。\n\
  • `host` -- 主机名和端口。（支持: CH1+, FF1+, IE3+) *返回：* 字符串，读/写。\n• `hostname` -- 不带端口的主机名。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O4+) *返回：* 字符串，读/写。\n• `href` -- 链接的完整 URL。（支持: CH1+,\
  \ FF1+, IE3+, NN2+, O3+) *返回：* 字符串，读/写。\n• `hreflang` -- 链接的语言。（支持: CH1+, FF1+,\
  \ IE6+, NN6+, O6+, SF1+) *返回：* 字符串，读/写。\n• `Methods` -- 关于浏览器使用哪些方法的指令。（支持: IE4+)\
  \ *返回：* 字符串，读/写。\n• `mimeType` -- 如果定义，则返回链接的 mimeType。（支持: IE4+) *返回：* 字符串，只读。\n\
  • `name` -- 获取并设置 name 属性。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回：* 字符串，读/写。\n\
  • `nameProp` -- 文档的标题。（支持: IE4+) *返回：* 字符串，只读。\n• `pathname` -- 相对于主机的路径。（支持: CH1+,\
  \ FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，读/写。\n• `port` -- URL 的端口。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O4+, SF1+) *返回：* 字符串，读/写。\n• `protocol` -- 设置或获取 URL 的协议部分。（支持: CH1+,\
  \ FF1+, IE3+, NN2+, O3+, SF1+) *返回：* 字符串，读/写。\n• `rel` -- 设置或获取对象与目标之间的关系。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串，读/写。\n• `rev` -- 设置或获取对象与目标之间的关系。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串，读/写。\n• `search` -- URL 中跟在 ? 符号之后的部分，包括\
  \ ? 符号。（支持: CH1+, FF1+, IE3+, NN2+, O4+, SF1+) *返回：* 字符串，读/写。\n• `shape` -- 当与链接使用图像地图时，shape\
