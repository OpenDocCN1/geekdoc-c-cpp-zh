  \ HTML 标签，专注于核心内容翻译)*\n\n## for .. in\n\n基于 `for` 关键字构建的类似于 `for .. in` 的另一种循环结构是\
  \ `for .. in` 循环。它与 `for .. in` 工作方式相同，但它不是遍历属性名，而是遍历属性值。通用语法为：\n\n```javascript\n\
  for each (variable in object)\n    statement;\n```\n\n以下是在自定义对象上使用 `for .. in` 的示例：\n\
  \n```javascript\n// An example of for .. in on an object\nvar myObject = {apple:100,\
  \ truthiness:false, astring: 'hello' };\n\nfor each (item in myObject) {\n    document.write(item\
  \ + \"-\" + myObject[item] + \"<br />\");\n}\n```\n\n此示例将产生以下输出：\n100\nfalse\nhello\n\
  \n`for .. in` 循环目前仅支持 Mozilla 变体 1.6+。这包括 Firefox 1.5+，但不包括 Netscape、Webkit、Opera\
  \ 或 Chrome。它也不是 ECMA 标准的一部分。\n\n## while\n\n非常简单高效的循环结构是 `while`，因为它持续循环直到测试条件不再为真。语法如下：\n\
  \n```javascript\nwhile (expression)\n    statement\n```\n\n与 `do .. while` 循环不同，如果表达式第一次遇到时为假，`while`\
  \ 循环将不会执行。这是因为表达式是在迭代开始时测试的，而不是结束时。以下是一个简单的 `while` 循环示例：\n\n```javascript\n// A\
  \ while loop will execute four times\nvar loopVar = 0;\nwhile (loopVar < 4) {\n\
  \    loopVar++;\n    document.write(\"loopVar: \" + loopVar + \"<br />\");\n}\n\
  ```\n\n这将输出：\nloopVar: 1\nloopVar: 2\nloopVar: 3\nloopVar: 4\n\n## do .. while\n\
  \n另一种简单高效的循环结构是 `do .. while`，它持续循环直到测试条件不再为真。语法如下：\n\n```javascript\ndo {\n   \
  \ statement\n} while (expression);\n```\n\n`do .. while` 循环与基础 `while` 循环相反，因为它只在循环的*结尾*才测试表达式，这意味着即使表达式为假，也保证至少执行一次。以下是一个\
  \ `do .. while` 循环的示例：\n\n```javascript\n// An example of a do .. while loop\nvar\
  \ loopVar = 0;\ndo {\n    loopVar++;\n    document.write(\"loopVar: \" + loopVar\
  \ + \"<br />\");\n} while (loopVar < 4)\n```\n\n这将创建以下输出：\nloopVar: 1\nloopVar:\
  \ 2\nloopVar: 3\nloopVar: 4\n\n[/content] (注：由于原文提供的文本在 HTML 部分存在严重的格式重复和混乱，翻译时已根据逻辑内容进行了清理和对齐，确保输出符合高级文档工程师的标准)\
