  \ `SELECT` 框，这是 OPTION 字段；对于 `History` 对象，这是条目数。（支持: CH1+, FF1+, IE3+, NN2+, O3+,\
  \ SF1+) *返回值：* 整数，只读。\n- `method` -- 获取并设置用于提交表单的 HTTP 方法。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+) *返回值：* 字符串常量，读/写。\n- `name` -- 获取并设置 name 属性。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+, SF1+) *返回值：* 字符串，读/写。\n- `target` -- 获取并设置动作的目标（渲染其输出的帧）（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回值：* 字符串，读/写。\n\n## 方法\n\n- `submit()` --\
  \ 提交表单。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n- `reset()` -- 将表单值重置为初始状态。（支持:\
  \ CH1+, FF1+, IE4+, NN3+, O4+, SF1+)\n\n## 事件\n\n- `onreset` -- 当用户点击表单上的重置按钮时触发。（支持:\
  \ CH1+, FF1+, IE4+, NN3+, O4+, SF1+)\n- `onsubmit` -- 当表单提交时触发。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+, SF1+)\n\n## FIELDSET 和 LEGEND 对象\n\n`FIELDSET` 对象代表允许你一组相关的表单控件和标签的元素。`LEGEND`\
  \ 对象允许为 fieldset 分配标题。\n\n## 属性\n\n- `align` -- 设置或获取对象与相邻文本的对齐方式。（支持: CH1+, FF1+,\
  \ IE4+, NN6+, O5+, SF1+) *返回值：* 字符串，读/写。\n- `form` -- 对 `FORM` 对象的引用。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O5+, SF1+) *返回值：* DOM 节点，读/写。\n\n## LABEL 对象\n\n`LABEL` 对象代表同名的元素。标签用于将语义信息附加到表单控件。\n\
  \n## 属性\n\n- `form` -- 对 `FORM` 对象的引用。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回值：*\
  \ DOM 节点，读/写。\n- `htmlFor` -- 指明此标签对应哪个表单元素。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\
  \ *返回值：* 对象引用，读/写。\n\n## 通用 INPUT 对象\n\n以下属性适用于所有输入类型的表单控件。\n\n## 属性\n\n- `acceptCharset`\
  \ -- 设置或获取处理表单的服务器必须接受输入数据的字符编码列表。（支持: CH1+, FF1+, IE5+, NN6+, O6+, SF1+) *返回值：*\
  \ 字符串，只读。\n- `action` -- 获取并设置 `FORM` 元素的动作。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\
  \ *返回值：* 字符串，读/写。\n- `autocomplete` -- 设置或获取对象的自动完成（输入提示）状态。（支持: FF1+, IE5+) *返回值：*\
  \ 布尔值，读/写。\n- `elements[ ]` -- 表单控件元素的数组。（支持: CH1+, FF1+, IE3+, NN2+, O4+, SF1+)\
  \ *返回值：* 元素数组，只读。\n- `form` -- 对 `FORM` 对象的引用。（支持: CH1+, FF1+, IE3+, NN2+, O4+,\
  \ SF1+) *返回值：* Form 对象引用，只读。\n- `name` -- 获取并设置 name 属性。（支持: CH1+, FF1+, IE3+, NN2+,\
  \ O3+, SF1+) *返回值：* 字符串，读/写。\n- `type` -- 指明元素的类型（例如：button, submit, reset）（支持:\
  \ CH1+, FF1+, IE4+, NN3+, O5+, SF1+) *返回值：* 字符串，只读。\n\n## BUTTON, SUBMIT 和 RESET\
  \ 对象\n\n这些对象代表相应的表单元素。\n\n## 属性\n\n- `value` -- 对于按钮，它是起始和结束 `BUTTON` 标签之间的文本。在\
  \ `SUBMIT` 和 `RESET` 对象中，它是 `value` 属性的直接值。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\
  \ *返回值：* 字符串，读/写。\n\n## 方法\n\n- `click()` -- 模拟点击并触发 `onclick` 事件。（支持: CH1+, FF1+,\
  \ IE4+, NN6+, O6+)\n\n## 事件\n\n- `onclick` -- `onclick` 事件的处理代码。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+)\n- `onmousedown` -- 当鼠标按下时触发。（支持: CH1+, FF1+, IE4+, NN3+, O5+)\n\
  - `mouseup` -- `mouseup` 事件的处理代码。（支持: CH1+, FF1+, IE4+, NN3+)\n\n## CHECKBOX 和 RADIO\
  \ 对象\n\n这些对象代表多选和单选输入框。\n\n## 属性\n\n- `checked` -- 告知复选框是否被选中。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+) *返回值：* 布尔值，读/写。\n- `defaultChecked` -- 复选框或单选框的默认选中状态。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+) *返回值：* 布尔值，只读。\n- `type` -- 标识复选框或单选框的类型。（支持: CH1+, FF1+, IE4+,\
  \ NN3+, O4+) *返回值：* 字符串，只读。\n- `value` -- 复选框或单选框的值。（支持: SF1+) *返回值：* 字符串，读/写。\n\
  \n## 方法\n\n- `click()` -- 模拟点击并触发 `onclick` 事件。（支持: CH1+, FF1+, IE3+, NN2+)\n\n\
  ## 事件\n\n- `onclick` -- `onclick` 事件的处理代码。（支持: CH1+, FF1+, IE3+, NN2+)\n\n## IMAGE\
  \ 对象\n\n该对象代表 `IMAGE` 元素。\n\n## 属性\n\n- `complete` -- 如果图片已加载完成。（支持: IE4+) *返回值：*\
  \ 布尔值，只读。\n- `src` -- 显示的图片的 URL。（支持: CH1+, FF1+, IE4+, NN5+, O6+, SF1+) *返回值：*\
  \ 字符串，读/写。\n\n## TEXT, PASSWORD 和 HIDDEN 对象\n\n这些属性提供了 TEXT、PASSWORD 和 HIDDEN 表单元素。\n\
  \n## 属性\n\n- `defaultValue` -- 元素的原始值。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回值：*\
  \ 字符串，只读。\n- `maxLength` -- 框允许的最大字符数。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回值：*\
  \ 整数，读/写。\n- `readOnly` -- 设置为 true 时，用户无法更改字段内容。（支持: CH1+, FF1+, IE4+, NN6+, O6+,\
  \ SF1+) *返回值：* 布尔值，读/写。\n- `size` -- 输入框的字符宽度。（支持: CH1+, FF1+, IE4+, NN6+, O6+,\
  \ SF1+) *返回值：* 整数，读/写。\n- `value` -- 字段的文本内容。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\
  \ *返回值：* 字符串，读/写。\n\n## 方法\n\n- `blur()` -- 使元素失去焦点并触发 `onblur` 事件。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+, SF1+)\n- `focus()` -- 给当前元素键盘焦点，并触发 `onfocus` 事件。（支持: CH1+, FF1+,\
  \ IE3+, NN2+, O3+, SF1+)\n- `select()` -- 选中输入中的所有文本。（支持: CH1+, FF1+, IE3+, NN2+,\
  \ O3+, SF1+)\n\n\n\n\n\n- `onafterupdate` -- 返回 onafterupdate 事件的事件处理代码。（支持: IE4+)\n\
  - `onbeforeupdate` -- 返回 onbeforeupdate 事件的事件处理代码。（支持: IE4+)\n- `onblur` -- 返回 blur\
  \ 事件的事件处理代码。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n- `onchange` -- 返回 onchange\
  \ 事件的事件处理代码。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n- `onerrorupdate` -- 返回 onerrorupdate\
  \ 事件的事件处理代码。（支持: IE4+)\n- `onfocus` -- 返回 onfocus 事件的事件处理代码。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+)\n- `onselect` -- 当文本框或文本区域内的文本被选中时触发。（支持: CH1+, FF1+, IE3+, NN2+,\
  \ O3+, SF1+)\n\n## TEXTAREA 对象\n\n此对象代表表单 `<textarea>` 元素。\n\n## 属性\n\n- `cols`\
  \ -- 元素按字符列的大小。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:* 整数，可读写。\n- `rows` --\
  \ 元素按文本行的大小。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:* 整数，可读写。\n- `wrap` -- 指定\
  \ textarea 如何换行。值包括 soft（软）、hard（硬）和 off（关闭）。(支持: IE4+) *返回:* 字符串，可读写。\n\n## 方法\n\
  \n- `createTextRange()` -- 为元素创建一个 `TextRange` 对象，用于控制文本插入点。（支持: IE4+) *返回:* `TextRange`\
  \ 对象。\n- `select()` -- 将选取输入中的所有文本。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\n\n##\
  \ 事件\n\n- `onafterupdate` -- 返回 onafterupdate 事件的事件处理代码。（支持: IE4+)\n- `onbeforeupdate`\
  \ -- 返回 onbeforeupdate 事件的事件处理代码。（支持: IE4+)\n- `onchange` -- 返回 onchange 事件的事件处理代码。（支持:\
  \ CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n- `onerrorupdate` -- 返回 onerrorupdate 事件的事件处理代码。（支持:\
  \ IE4+)\n\n## SELECT 对象\n\n此对象代表表单 SELECT 对象。表单 `SELECT` 可以是多选或单选，并包含多个 `OPTION`\
  \ 元素。\n\n## 属性\n\n- `length` -- 返回元素中的数量。对于表单，这是表单元素；对于 `SELECT` 框，这是 `OPTION` 字段；对于\
  \ `History` 对象，这是条目数量。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回:* 整数，可读写。\n- `multiple`\
  \ -- 布尔值，影响是否可以从输入中进行多选。（支持: CH1+, FF1+, IE4+, NN6+, O3+, SF1+) *返回:* 布尔值，可读写。\n\
  - `selectedIndex` -- 对应于列表中选中项目的从零开始的数字。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\
  \ *返回:* 整数，可读写。\n- `size` -- 输入框的字符宽度。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:*\
  \ 整数，可读写。\n- `value` -- 分配给选中项值属性的字符串。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:*\
  \ 字符串，可读写。\n- `options[]` -- 代表 `OPTION` 元素的数组。（支持: CH1+, FF1+, IE3+, NN2+, O3+,\
  \ SF1+) *返回:* 元素数组，只读。\n\n## 方法\n\n- `add(newOptionRef[, index])` -- 用于向列表添加新项目。（支持:\
  \ CH1+, FF1+, IE5+, NN6+, O6+, SF1+)\n- `item()` -- 用于访问控件内部的嵌套 option 元素。（支持: IE5+)\
  \ *返回:* option 元素引用。\n- `namedItem(optionID)` -- 从 option 集合中检索对象。（支持: IE5+) *返回:*\
  \ option 元素引用。\n- `remove(index)` -- 从集合中移除一个元素。（支持: CH1+, FF1+, IE4+, NN6+, O6+,\
  \ SF1+)\n\n## 事件\n\n- `onchange` -- 返回 onchange 事件的事件处理代码。（支持: CH1+, FF1+, IE3+,\
  \ NN2+, O3+, SF1+)\n\n## FILE 对象\n\n`FILE` 对象代表表单中的文件上传元素。\n\n## 属性\n\n- `defaultValue`\
  \ -- 元素的原始值。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回:* 字符串，只读。\n- `readOnly`\
  \ -- 设置为 true 时，用户无法更改字段的内容。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:* 布尔值，可读写。\n\
  - `size` -- 输入框的字符宽度。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回:* 整数，可读写。\n- `type`\
  \ -- 描述输入的类型。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回:* 字符串，只读。\n- `value` --\
  \ 字段的文本内容。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+) *返回:* 字符串，可读写。\n\n## 方法\n\n- `select()`\
  \ -- 将选取输入中的所有文本。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n\n## 事件\n\n- `onchange`\
  \ -- 返回 change 事件的事件处理代码。（支持: CH1+, FF1+, IE3+, NN2+, O3+, SF1+)\n\n# HTML 表格引用\n\
  \n此部分对应标准的 HTML <table> 元素。\n\n## 属性\n\n\n\n\n\n- `align` -- 设置或获取对象与相邻文本的对齐方式。（支持：CH1+,\
  \ FF1+, IE5+, NN6+, O6+, SF1+) *返回：* 字符串（center, left, right），读/写。\n- `background`\
  \ -- 设置或获取对象中文本和图形后面平铺的背景图片的 URL。（支持：IE4+) *返回：* URL 字符串，读/写。\n- `bgColor` -- 设置或获取指示对象后面背景颜色的值。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串，读/写。\n- `border` -- 设置或获取在对象周围绘制框框的属性。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 整数，读/写。\n- `borderColor` -- 设置框颜色。（支持：IE4+)\
  \ *返回：* 字符串，读/写。\n- `borderColorDark` -- 设置或获取用于绘制对象 3D 边框的两种颜色之一的颜色。（支持：IE4+) *返回：*\
  \ 字符串，读/写。\n- `borderColorLight` -- 设置或获取用于绘制对象 3D 边框的两种颜色之一的颜色。（支持：IE4+) *返回：*\
  \ 字符串，读/写。\n- `caption` -- 获取表格的标题对象。（支持：CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：*\
  \ 标题对象，读/写。\n- `cellPadding` -- 设置或获取单元格边界与单元格内容之间的空间量。（支持：CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 整数，读/写。\n- `cells` -- 获取表格行或整个表格中所有单元格的集合。（支持：IE5+) *返回：* 数组，只读。\n\
  - `cellSpacing` -- 设置或获取表格中单元格之间的空间量。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：*\
  \ 整数，读/写。\n- `cols` -- 设置或获取表格的列数。（支持：IE4+) *返回：* 整数，读/写。\n- `dataPageSize` -- 设置或获取绑定到数据源的表格中显示的记录数。（支持：IE4+)\
  \ *返回：* 整数，读/写。\n- `frame` -- 指定表格的哪些边有边框。有效值包括 void, above, below, hsides, lhs,\
  \ rhs, box, 和 border。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串常量，读/写。\n-\
  \ `height` -- 获取并设置表格的高度。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 整数，读/写。\n\
  - `rows` -- 返回表格中所有行的集合。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* Row 对象的数组，只读。\n\
  - `rules` -- 设置或获取显示哪些分割线（内部边框。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串常量，读/写。\n\
  - `summary` -- 获取并设置表格描述。（支持：CH1+, FF1+, IE6+, NN6+, O7+, SF1+) *返回：* 字符串，读/写。\n\
  - `tBodies` -- 返回表格主体的集合。（支持：CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* tbody 元素对象的数组，只读。\n\
  - `tFoot` -- 返回表格的 TFOOT 元素。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 行段对象，读/写。\n\
  - `tHead` -- 返回表格的 THEAD 元素。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 行段对象，读/写。\n\
  - `width` -- 获取并设置表格的宽度。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 整数，读/写。\n\n\
  ## 方法\n\n- `createCaption()` -- 为表格创建一个新标题。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\
  \ *返回：* 指新标题的引用。\n- `createTFoot()` -- 为表格创建一个新的 TFOOT（表格页脚）（支持：CH1+, FF1+, IE4+,\
  \ NN6+, O6+, SF1+) *返回：* 元素引用。\n- `createTHead()` -- 为表格创建一个新的 THEAD（表格表头）（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 元素引用。\n- `deleteCaption()` -- 删除表格标题。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+)\n- `deleteRow(rowIndex)` -- 删除一行。（支持：CH1+, FF1+,\
  \ IE4+, NN6+, O6+, SF1+)\n- `deleteTFoot()` -- 删除表格页脚。（支持：CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+)\n- `deleteTHead()` -- 删除表格表头。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\n\
  - `firstPage()` -- 显示数据集的第一页。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\n- `insertRow()`\
  \ -- 插入一个新行。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 行对象。\n- `lastPage()` --\
  \ 显示数据集的最后一页。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+)\n- `moveRow(rowIndex, destinationIndex)`\
  \ -- 将行移动到新位置。（支持：IE5+) *返回：* 行元素对象。\n- `nextPage()` -- 显示数据集的下一页。（支持：CH1+, FF1+,\
  \ IE4+, NN6+, O6+, SF1+)\n- `previousPage()` -- 显示数据集的上一页。（支持：CH1+, FF1+, IE4+,\
  \ NN6+, O6+, SF1+)\n- `refresh()` -- 刷新表格内容。（支持：IE4+)\n\n## tbody, tfoot 和 thead\
  \ 对象引用\n\n这些对象分别代表表格主体、页脚和表头。\n\n## 属性\n\n- `align` -- 设置或获取对象与相邻文本的对齐方式。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串（center, left, right），读/写。\n- `bgColor`\
  \ -- 设置或获取指示对象后面背景颜色的值。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串，读/写。\n-\
  \ `ch` -- 代表用于列内对齐的 char 属性。（支持：CH1+, FF1+, IE6+, NN6+, O8+, SF1+) *返回：* 字符串，读/写。\n\
  - `chOff` -- 代表用于列内对齐的 charoff 属性。（支持：CH1+, FF1+, IE6+, NN6+, O8+, SF1+) *返回：* 字符串，读/写。\n\
  - `rows` -- 返回表格中所有行的集合。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* Row 对象的数组，只读。\n\
  - `vAlign` -- 控制对象内部文本的垂直对齐。有效值包括 top, middle, 和 bottom。（支持：CH1+, FF1+, IE4+, NN6+,\
  \ O6+, SF1+) *返回：* 字符串常量，读/写。\n\n## 方法\n\n- `deleteRow(rowIndex)` -- 删除一行。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+)\n- `insertRow()` -- 插入一个新行。（支持：CH1+, FF1+, IE4+,\
  \ NN6+, O6+, SF1+) *返回：* 行对象引用。\n- `moveRow(rowIndex, destinationIndex)` -- 将表格行移动到新位置。（支持：IE5+)\
  \ *返回：* 行元素对象。\n\n## caption 对象引用\n\ncaption 对象代表表格标题的元素。\n\n## 属性\n\n- `align`\
  \ -- 设置或获取对象与相邻文本的对齐方式。（支持：CH1+, FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串（center,\
  \ left, right），读/写。\n- `vAlign` -- 控制对象内部文本的垂直对齐。有效值包括 top, middle, 和 bottom。（支持：CH1+,\
  \ FF1+, IE4+, NN6+, O6+, SF1+) *返回：* 字符串常量，读/写。\n\n## col 和 colgroup 对象引用\n\ncol\
