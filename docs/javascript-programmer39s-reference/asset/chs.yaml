  **示例：**\n```javascript\nvar myStr = \"Jimminy\";\nvar myStr2 = \"Cricket\";\nif\
  \ (myStr > myStr2) {\n    document.write(myStr + \" 大\");\n} else {\n    document.write(myStr\
  \ + \" 小于\");\n}\n```\n\n### >= (大于等于)\n\n**标准：** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n**语法：** `string1\
  \ >= string2`\n**描述：** 进行字母顺序比较，如果左侧操作数在字母顺序上靠前或相等则返回 true。\n**示例：**\n```javascript\n\
  var myStr = \"Jimminy\";\nvar myStr2 = \"Cricket\";\nif (myStr >= myStr2) {\n  \
  \  document.write(myStr + \" 大于等于\");\n} else {\n    document.write(myStr + \" 小于\"\
  );\n}\n```\n\n# 其他\n\n# 运算符列表 ![289](img/whit_9780470550502_oeb_289_r1.gif)![290](img/whit_9780470550502_oeb_290_r1.gif)\n\
  \n### ( ) (函数调用 / 实例化)\n\n**标准：** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n\
  **支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n**语法：**\n```javascript\n// 函数定义：\nfunction\
  \ myFunctionName([param1, param2, ...,paramN]) {\n    // 我的代码写在这里\n}\n\n// 函数调用\n\
  ```\n\n\n\n\n\n# `myFunctionName(param1, param2, etc)` \n\n**描述：** 函数调用。调用函数并能够向该函数传递参数。\n\
  \n**示例：**\n```javascript\n// function invocation:\n\nfunction myFunctionName(param1,\
  \ param2) {\n    // 在此处编写代码\n}\n\n// function call\nmyFunctionName(true, true);\n\
  ```\n\n## `,` (逗号)\n\n**标准：** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n**语法：** `statementA, statementB, statementC`\n\
  **描述：** 逗号允许将多个语句作为一个整体来执行。这将只返回最右侧语句的结果。\n**示例：**\n```javascript\n//让我们让我们使用逗号运算符将指令串联在一起\n\
  var a = (b = 8, c = 2); // a 现在等于 2，这是最后一条指令\n\ndocument.write(\"a= \" + a + \"\
  <br />\"); // 2\ndocument.write(\"b= \" + b + \"<br />\"); // 8\ndocument.write(\"\
  c= \" + c + \"<br />\"); // 2\ndocument.write(\"a = \" + a + \" b = \" + b + \"\
  \ c = \" + c + \"<br />\"); // a = 2 b = 8 c = 2\n```\n\n## `.` (点操作符)\n\n**标准：**\
  \ JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari\
  \ 1.0+\n**语法：** `myProp= object.property`, `object.property=myProp`\n**描述：** 点操作符（或“点表示法”）适用于包含方法或属性的\
  \ JavaScript 对象。当使用点表示法时，属性必须是属于该对象的有效 JavaScript 标识符。例如：`document.body.innerHTML=\"\
  test\";`。在前面的示例中，我们使用点表示法访问 document 的 body 元素，并再次访问 body 的 innerHTML 属性。\n**示例：**\n\
  ```javascript\nvar myObject= {apples:23, bananas: 12, oranges:9};\n\ndocument.write(myObject.bananas+\"\
  <br />\"); // 12\n```\n\n## `?:` (条件运算符)\n\n**标准：** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n**语法：** `expression\
  \ ? val1 : val2`\n**描述：** 如果最左侧的操作数（布尔值）求值为真，则从操作返回 `val1`。否则，返回 `val2`。\n**示例：**\n\
  ```javascript\n// 首先我们创建一个随机数\nvar myRandom = Math.random()*100;\n// 现在对该数字使用条件语法\n\
  var result = (myRandom > 50) ? \"Was greater than 50\" : \"Was less than 50\";\n\
  document.write(result);\n```\n\n## `delete`\n\n**标准：** JavaScript 1.0+, JScript\
  \ 3.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+,\
  \ Internet Explorer 4.0+, Netscape Navigator 2.0+, Opera 5.0+, Safari 1.0+\n**语法：**\
  \ \n```javascript\ndelete identifierName\ndelete myObject.property\ndelete myObject[\"\
  property\"]\ndelete myObject[index]\ndelete myProperty // 在 with 语句内部是允许的\n```\n\
  **描述：** 删除对象、对象的成员（方法或属性）或 `Array` 中指定索引处的元素。在 JavaScript 1.2 之前，`delete` 操作符导致对象结果于\
  \ `null` 而不是 `undefined`。\n**示例：**\n```javascript\n// 首先我们创建一个随机数\nmyRandom = Math.random()*100;\n\
  delete myRandom;\ntry {\n    document.write(myRandom + \" still exists!<br />\"\
  );\n} catch(e) {\n    document.write(\"Doesn′t exist!<br />\"); // 将执行\n}\n```\n\
  \n## `get`\n\n**标准：** JavaScript 1.5+\n**支持：** Firefox 1.0 (Gecko 1.7)+\n**语法：**\
  \ `{get my Property [ functionName]() { ... } }`\n**描述：** 将属性绑定到函数，当在对象上查找该属性时，该函数会被调用。\n\
  **示例：**\n```javascript\nvar articles = {\n  get latest () {\n    if (this.log.length\
  \ > 0) {\n      return this.log[this.log.length - 1];\n    } else {\n      return\
  \ null;\n    }\n  },\n  set current (str) {\n    return this.log[this.log.length]\
  \ = str;\n  },\n  log: []\n}\narticles.current = \"About the Universe\";\narticles.current\
  \ = \"A Brief History of Time\";\narticles.current = \"A Longer History of Time\"\
  ;\ndocument.write(articles.latest); // A History of Time\n```\n\n## `in`\n\n**标准：**\
  \ JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 3.0+, Netscape Navigator 2.0+, Opera 3.0+,\
  \ Safari 1.0+\n**语法：** `property in object`\n**描述：** 如果指定的属性存在于对象中，则返回 true。\n**示例：**\n\
  ```javascript\nvar myArr= \"tree\", \"horse\");\n// 测试属性\ndocument.write(length\
  \ in myArr)); // true\n```\n\n## `instanceof`\n\n**标准：** JavaScript 1.2+, JScript\
  \ 3.0+, ECMAScript 2.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+,\
  \ Internet Explorer 4.0+, Netscape Navigator 2.0+, Opera 5.0+, Safari 1.0+\n**语法：**\
  \ `object instanceof type`\n**描述：** 确定对象是否是另一个对象的实例。\n**示例：**\n```javascript\nvar\
  \ myDay = Date(1980, 3);\nif (myDay instanceof Date) {\n    // 一个 Date 对象\n}\n```\n\
  \n## `new`\n\n**标准：** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：** Google\
  \ Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator\
  \ 2.0+, Opera 3.0+, Safari 1.0+\n**语法：** `object= new type([params])`\n**描述：** 创建任何类型的实例，包括用户定义的类型。\n\
  **示例：**\n```javascript\nfunction Animal() {\n    this.fur=true;\n    this.scales=false;\n\
  \    this.location='Canada';\n}\nvar cat = new Animal(); // Canada\n```\n\n## `set`\n\
  \n**标准：** JavaScript 1.5+\n**支持：** Firefox 1.0 (Gecko 1.7)+\n**语法：** `{set myProperty\
  \  functionName { ... }}`\n**描述：** 将属性绑定到函数，当尝试在对象上设置该属性时，该函数会被调用。\n**示例：**\n```javascript\n\
  var articles = {\n  get latest () {\n    if (this.log.length > 0) {\n      return\
  \ this.log[this.log.length - 1];\n    } else {\n      return null;\n    }\n  },\n\
  \  set current (str) {\n    return this.log[this.log.length] = str;\n  },\n  log:\
  \ []\n}\narticles.current = \"About the Universe\"; // 尝试设置属性\n```\n\n## `this`\n\
  \n**标准：** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：** Google Chrome\
  \ Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+,\
  \ Opera 3.0+, Safari 1.0+\n**语法：** `this`, `this.property`, `this.method`\n**描述：**\
  \ 指向当前的父对象。\n**示例：**\n```javascript\nfunction Animal() {\n    this.fur=true;\n \
  \   this.scales=false;\n    this.location='Canada';\n}\nvar cat = new Animal();\n\
  document.write(cat.location); // Canada\n```\n\n## `typeof`\n\n**标准：** JavaScript\
  \ 1.1+, JScript 1.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0\
  \ (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari\
  \ 1.0+\n**语法：** `typeof myObject`\n**描述：** 返回一个指示操作数类型的字符串。\n**示例：**\n```javascript\n\
  var var1 = undefined;\nvar var2 = null;\nvar var3 = \"Test\";\nvar var4 = 12345;\n\
  var var5 = {a:23,b:'3242'};\nvar var6 = true;\ndocument.write(typeof var1 + \"<br\
  \ />\"); // undefined\ndocument.write(typeof var2 + \"<br />\"); // object\ndocument.write(typeof\
  \ var3 + \"<br />\"); // string\ndocument.write(typeof var4 + \"<br />\"); // number\n\
  document.write(typeof var5 + \"<br />\"); // object\ndocument.write(typeof var6\
  \ + \"<br />\"); // boolean\n```\n\n\n\n\n\n```javascript\ndocument.write(typeof\
  \ var7 + \"<br />\"); // undefined\n```\n\n### void\n\n**标准：** JavaScript 1.1+,\
  \ JScript 1.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\
  **语法**\n`void(expression)`\n\n**描述**\n求表达式并返回 `undefined`。\n\n**示例**\n```html\n\
  <a href=\"javascript:void(0);\">点击此处什么都不做</a>\n\n<a href=\"javascript:void(document.body.style.backgroundColor='red');\"\
  >点击此处变为红色背景</a>\n```\n\n### [ ]（对象和数组访问器）\n\n**标准：** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n**语法**\n// 在对象中：\n\
  ```javascript\nmyProp = object[propertyName]\nobject[propertyName] = myProp\n```\n\
  // 在数组中：\n```javascript\nmyArrItem = myArray[0]\nmyArrItem = myAssociativeArray[hashindexstring]\n\
  ```\n**描述**\n括号表示法可以访问对象的方法和属性，也可以访问数组对象中的元素。对于对象，可以使用点符号法或括号表示法来访问方法和属性。例如：`document.body.innerHTML`\
  \ 等于：`document['body']['innerHTML']`\n\n**示例**\n```javascript\nvar myObject = {apples:23,\
  \ bananas: 12, oranges:9};\ndocument.write(myObject['bananas'] + \"<br />\"); //\
  \ 12\n```\n\n# JavaScript 语句\n\n语句是程序的构建块，定义了程序的行为。JavaScript 支持许多常见的语句类型，包括条件语句（`if\
  \ .. else`）和迭代语句（`for .. in`）。\n\n**语句列表**\n![291](img/whit_9780470550502_oeb_291_r1.gif)![292](img/whit_9780470550502_oeb_292_r1.gif)\n\
  \n## block { }\n\n**标准：** JavaScript 1.0+, JScript 1.0+, ECMAScript 1.0+\n**支持：**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\n{\n    myStatement\n\
  \    anotherStatement\n    ...\n}\n```\n\n**描述**\n用于对语句分组并提供共享的上下文。块由一对大括号 ({ })\
  \ 定界。\n\n**示例**\n```javascript\nvar x = 0;\nwhile (x < 10) {\n    x++;\n}\ndocument.write(x\
  \ + \"<br />\"); // 10\nif (x) {\n    var x = 2;\n}\ndocument.write(x); // 输出 2\n\
  ```\n\n## break\n\n**标准：** JavaScript 1.1+, JScript 1.0+, ECMAScript 1.0+\n**支持：**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 3.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\nbreak;\nbreak\
  \ [label];\n```\n\n**描述**\n终止当前的循环、switch 语句或标签语句，并从该语句块之后继续执行。\n\n**示例**\n```javascript\n\
  var count = 0;\nwhile (count < 1000) {\n    count++;\n    if (count == 100)\n  \
  \      break;\n}\ndocument.write(\"Count:\" + count); // 100\n```\n\n## const\n\n\
  **标准：** JavaScript 1.5+\n**支持：** Firefox 1.0 (Gecko 1.7)+, Netscape Navigator 7.0\
  \ (Gecko 1.0.1)+\n\n**语法**\n```javascript\nconst myVariable [= InitialValue]\n```\n\
  \n**描述**\n声明一个只读的全局常量并将其初始化为某个值。\n\n**示例**\n```javascript\nconst a = 7;\ndocument.writeln(\"\
  is \" + a + \".\"); // 7\n// 现在我们尝试修改 a\na = 5;\ndocument.writeln(\"is \" + a +\
  \ \".\"); // 7\n```\n\n## continue\n\n**标准：** JavaScript 1.1+, JScript 3.0+, ECMAScript\
  \ 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 4.0+, Netscape Navigator 3.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\n\
  continue;\ncontinue [myLabel];\n```\n\n**描述**\n结束带标签循环的当前迭代中任何语句的执行，并恢复下一次迭代。\n\n\
  **示例**\n```javascript\ni = 0;\nn = 0;\nwhile (i < 5) {\n    i++;\n    if (i == 3)\n\
  \        continue;\n    n++;\n}\ndocument.write(\"i is \" + i + \" but n is \" +\
  \ n);\n// i is 5 but n is 4\n\ni = 0;\nn = 0;\nj = 0;\nstartingpoint:\nwhile (i\
  \ < 4) {\n    i++;\n    n = 0;\n    while (n < 4) {\n        n++;\n        if (n\
  \ > 2) {\n            continue startingpoint;\n        }\n    }\n}\ndocument.write(\"\
  Shouldhave 16 iterations. There were: \" + j);\n// Should have 16 iterations. There\
  \ were: 2\n```\n\n## do..while\n\n**标准：** JavaScript 1.2+, JScript 3.0+, ECMAScript\
  \ 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 4.0+, Netscape Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\n\
  do {\n    statement;\n} while (expression)\n```\n\n**描述**\n创建一个循环，直到测试条件为假。do..while\
  \ 循环至少执行一次。\n\n**示例**\n```javascript\nvar myCount = 0;\ndo {\n    myCount++;\n \
  \   document.write(\"myCount:\" + myCount + \"<br />\");\n} while (myCount < 5);\n\
  /*\nmyCount: 1\nmyCount: 2\nmyCount: 3\nmyCount: 4\nmyCount: 5\n*/\n```\n\n## export\n\
  \n**标准：** JavaScript 1.2+\n**支持：** Firefox 1.0 (Gecko 1.7)+, Netscape Navigator\
  \ 4.0+\n\n**语法**\n```javascript\nexport name1, name2, ..., nameN;\nexport *;\n```\n\
  \n**描述**\n允许签名脚本向或其他签名脚本提供属性、函数和对象。\n\n**示例**\n```javascript\nvar myObj = {a:12,b:true,c:(new\
  \ Date())};\nexport myObj;\n```\n\n### for\n\n**标准：** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\n\
  for ([initial-expression]; [condition]; [final-expression])\n    statement\n// 或者使用块表示：\n\
  for ([initial-expression]; [condition]; [final-expression]) {\n    statement\n}\n\
  ```\n\n**描述**\n创建一个由三个可选表达式定义的循环，随后是由该循环执行的语句。\n\n**示例**\n```javascript\nfor (var\
  \ myCount = 0; myCount < 5; myCount++) {\n    document.write(\"myCount:\" + myCount\
  \ + \"<br />\");\n}\n/*\nmyCount: 0\nmyCount: 1\nmyCount: 2\nmyCount: 3\nmyCount:\
  \ 4\n*/\n```\n\n## for..in\n\n**标准：** JavaScript 1.6+\n**支持：** Firefox 1.5 (Gecko\
  \ 1.8)+\n\n**语法**\n```javascript\nfor each (variable in object)\n    statement\n\
  // 使用块表示：\nfor each (variable in object) {\n    statement\n}\n```\n\n**描述**\n通过一个变量遍历对象属性的所有值。\n\
  \n**示例**\n```javascript\nvar myObj = {a:32,b:true,c:(new Date())};\nfor each (i\
  \ in myObj) {\n    document.write(i + \"<br />\");\n}\n/*\n32\ntrue\nSun Sep 28\
  \ 2008 20:34 GMT-0700 (PDT)\n*/\n```\n\n## for..in\n\n**标准：** JavaScript 1.0+, JScript\
  \ 5.0+, ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+,\
  \ Internet Explorer 5.0+, Netscape Navigator 2.0+, Opera 5.0+, Safari 1.0+\n\n**语法**\n\
  ```javascript\nfor (variable in object)\n    statement\n// 使用块表示：\nfor (variable\
  \ in object) {\n    statement\n}\n```\n\n**描述**\n遍历对象的所有属性。\n\n**示例**\n```javascript\n\
  var myObj = {a:32,b:true,c:(new Date())};\nfor (var i in myObj) {\n    document.write(i\
  \ + \":\" + myObj[i] + \"<br />\");\n}\n/*\na: 32\nb: true\nc: Sun Sep 28 2008 20:33:23\
  \ GMT-0700 (PDT)\n*/\n```\n\n## function\n\n**标准：** JavaScript 1.0+, JScript 1.0+,\
  \ ECMAScript 1.0+\n**支持：** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n**语法**\n```javascript\n\
  function myFunctionName([param] [, param] [..., param]) {\n    statements ..\n}\n\
  ```\n\n**描述**\n声明一个带有可选参数的函数。\n\n**示例**\n```javascript\nfunction calcTax(price)\
  \ {\n    return parseFloat(price)*1.15;\n}\ndocument.write(\"The cost with tax of\
  \ $10 is $\" + calcTax(10));\n//The cost with tax of $10 is 11.5\n```\n\n\n\n\n\n\
  # if\n\n**标准:** `JavaScript 1.0+`, `JScript 1.0+`, `ECMAScript 1.0+`\n**支持:** Google\
  \ Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator\
  \ 2.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n```javascript\nif (condition)\n    statement1\n\
  [else\n    statement2]\n```\n\n使用块表示法：\n```javascript\nif (condition) {\n    statement1\n\
  } [else {\n    statement2\n}]\n```\n\n### 描述\n根据条件是否为真来执行语句。如果条件为假，则可以执行另一个语句（如\
  \ `else` 块指定的）。\n\n## 示例\n```html\n<script>\nvar myNum = Math.random()*100;\nif\
  \ (myNum > 50) {\n    document.write(\"It was greater than fifty.\");\n} else if\
  \ (myNum < 10) {\n    document.write(\"It was less than ten.\");\n} else {\n   \
  \ document.write(\"It was greater than ten and less than fifty.\");\n}\n</script>\n\
  ```\n\n# import\n\n**标准:** `JavaScript 1.2+`, `JScript 3.0+`\n**支持:** Firefox 1.0\
  \ (Gecko 1.7), Netscape Navigator 4.0+\n\n### 语法\n```javascript\nimport myObject\n\
  import myObject.property\nimport myObject.method\n```\n\n### 描述\n允许脚本从显式导出此类信息的签名脚本中导入属性、函数和对象。\n\
  \n## 示例\n```html\n<script>\ntry {\n    import myObj.*;\n} catch(e) {\n    document.write(\"\
  Could not import that member.\");\n}\n</script>\n```\n\n# label\n\n**标准:** `JavaScript\
  \ 1.2+`, `JScript 3.0+`, `ECMAScript 3.0+`\n**支持:** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator 4.0+, Opera 3.0+,\
  \ Safari 1.0+\n\n### 语法\n```javascript\nlabel :\n    statement\n```\n\n### 描述\n\
  声明一个可以配合 `break` 或 `continue` 使用标识符，用于指示程序应该继续执行的位置。\n\n## 示例\n```html\n<script>\n\
  var i = 0;\nvar n = 0;\nvar j = 0;\nstartingpoint:\nwhile (i < 4) {\n    i++;\n\
  \    n = 0;\n    while (n < 4) {\n        n++;\n        j++;\n        if (n > 2)\
  \ {\n            continue startingpoint;\n        }\n    }\n}\ndocument.write(\"\
  Should have been 16 iterations. There actually were: \" + j);\n// Should have been\
  \ 16 iterations. There actually were: 12\n</script>\n```\n\n# return\n\n**标准:**\
  \ `JavaScript 1.0+`, `JScript 1.0+`, `ECMAScript 1.0+`\n**支持:** Google Chrome Beta+,\
  \ Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera\
  \ 3.0+, Safari 1.0+\n\n### 语法\n```javascript\nreturn;\nreturn [expression];\n```\n\
  \n### 描述\n指定由函数返回的内容。如果省略，则返回 `undefined`。\n\n## 示例\n```html\n<script>\nfunction\
  \ square(x) {\n    return x * x;\n}\ndocument.write(square(10)); // 100\n</script>\n\
  ```\n\n### switch\n\n**标准:** `JavaScript 1.2+`, `JScript 3.0+`, `ECMAScript 3.0+`\n\
  **支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape\
  \ Navigator 4.0+, Opera 5.0+, Safari 1.0+\n\n### 语法\n```javascript\nswitch(expression)\
  \ {\n    case myLabel1:\n        statements..\n        break;\n    case myLabel2:\n\
  \        statements..\n        break;\n    case myLabel3:\n        statements..\n\
  \        break;\n    case myLabel4:\n        statements..\n        break;\n    default:\n\
  \        statements..\n}\n```\n\n### 描述\n允许通过与传递给它的表达式匹配标签来处理该表达式。\n\n## 示例\n```html\n\
  <script>\nvar myPet = \"Cat\";\nswitch (myPet) {\n    case \"Dog\":\n        document.write(\"\
  Big and friendly.<br>\");\n        break;\n    case \"Cat\":\n        document.write(\"\
  Small and aloof.<br>\");\n        break;\n    case \"Parrot\":\n        document.write(\"\
  Won't shut up.<br>\");\n        break;\n    case \"Fish\":\n        document.write(\"\
  Good with lemon and onions.<br>\");\n        break;\n    default:\n        document.write(\"\
  Not familiar with \" + expr + \", sorry.<br>\");\n}\n</script>\n```\n\n### throw\n\
  \n**标准:** `JavaScript 1.4+`, `JScript 5.0+`, `ECMAScript 3.0+`\n**支持:** Google Chrome\
  \ Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 5.0+, Netscape Navigator 5.0+,\
  \ Opera 3.0+,\n\n### 语法\n```javascript\nthrow;\n```\n\n### 描述\n抛出一个用户定义的异常。\n\n\
  ## 示例\n```html\n<script>\ntry {\n    throw \"Error\";\n} catch (e) {\n    document.write(e);\n\
  }\n</script>\n```\n\n# try...catch\n\n**标准:** `JavaScript 1.4+`, `JScript 5.0+`,\
  \ `ECMAScript 3.0+`\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 5.0+, Netscape Navigator 5.0+, Opera 3.0+,\n\n### 语法\n```javascript\n\
  try {\n    statement1..\n} catch(expression) {\n    statement2..\n} finally {\n\
  \    statement3..\n}\n```\n\n### 描述\n处理块中可能发生的错误。\n\n## 示例\n```html\n<script>\n\
  var totalMoney = 2000;\ntry {\n    throw \"Error\";\n} catch (e) {\n    document.write(e);\n\
  } finally {\n    document.write;\n}\n</script>\n```\n\n## var\n\n**标准:** `JavaScript\
  \ 1.0+`, `JScript 1.0+`, `ECMAScript 1.0+`\n**支持:** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari\
  \ 1.0+\n\n### 语法\n```javascript\nvar varIdentifier\nvarIdentifier = initialValue\n\
  ```\n\n### 描述\n用于声明带有初始值的变量。\n\n## 示例\n```html\n<script>\nvar totalMoney;\ndocument.write(totalMoney);\n\
  </script>\n```\n\n## while\n\n**标准:** `JavaScript 1.0+`, `JScript 1.0+`, `ECMAScript\
  \ 1.0+`\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n```javascript\n\
  while(condition) {\n    statement\n}\n```\n\n### 描述\n创建一个循环，每次迭代必须传递一个条件。一旦条件不满足，循环就会终止。\n\
  \n## 示例\n```html\n<script>\nvar n = 0;\nvar x = 0;\nwhile (n < 3) {\n    n++;\n\
  \    x += n;\n    document.write(\"n : \" + n + \"<br>\");\n}\n</script>\n```\n\n\
  ## with\n\n**标准:** `JavaScript 1.0+`, `JScript 1.0+`, `ECMAScript 1.0+`\n**支持:**\
  \ Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n```javascript\nwith(object)\
  \ {\n    statement\n}\n```\n\n### 描述\n获取一个对象并允许直接引用该对象的所有成员，而无需引用对象本身。\n\n## 示例\n\
  ```html\n<script>\nwith (Math) {\n    document.write(\"Math.PI: \" + PI + \"<br>\"\
  );\n    document.write(\"Math.random(): \" + random());\n}\n// Math.PI: 3.141592653589793\n\
  // Math.random(): 0.9609651856055049\n</script>\n```\n\n# JavaScript Comments\n\n\
  JavaScript 支持两种基本的注释类型：单行注释和多行注释。Internet Explorer 还支持一种特殊的注释类型称为*条件编译*，它支持 IE 选择性执行代码。\n\
  \n## /* */ (多行注释)\n\n**标准:** `JavaScript 1.0+`, `JScript 1.0+`, `ECMAScript 1.0+`\n\
  **支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 3+, Netscape\
  \ Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n```javascript\n/* Some text\
  \ */\n// Or..\n\n/*\n    Some text\n    Some more text\n*/\n```\n\n\n\n\n\n所有出现在起始和结束注释操作符之间的文本（包括换行符）都会被\
  \ JavaScript 解释器忽略。此注释标签还允许在代码内联插入多行文本。\n\n# // (注释)\n\n**标准:** `JavaScript 1.0+,\
  \ JScript 1.0+, ECMAScript 1.0+`\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 3+, Netscape Navigator 2.0+, Opera 3.0+, Safari 1.0+\n\
  \n### 语法\n```javascript\n// My text\n```\n\n### 描述\n出现在 `//` 注释操作符同一行后的所有文本会被 JavaScript\
  \ 解释器忽略。\n\n# /*@cc_on */ (条件编译)\n\n**标准:** `JScript 3.0+`\n**支持:** Internet Explorer\
  \ 4.0+\n\n### 描述\n条件编译允许开发者使用 JScript/Internet Explorer 特有功能，同时对其他浏览器保留优雅的降级处理。在\
  \ Internet Explorer 4 及更高版本（JScript 3）中，条件注释（或更广为人知的条件编译）是在 Internet Explorer 中执行自定义\
  \ JavaScript 的方便方法。条件编译的一些典型用途包括在 JScript 中使用新功能、在脚本中嵌入调试支持以及跟踪代码执行。它在跨浏览器场景下也非常有用，因为它为不支持该功能的浏览器提供了优雅的降级支持。通过在代码中使用\
  \ `@cc_on` 语句启用条件编译，或者在多行注释块中引用如 `@if` 或 `@set` 等自定义语句来启用。\n\n## 示例\n```html\n<script>\n\
  /*@cc_on\n   /*@if (@_jscript_version >=5)\n      document.write(″此环境支持 JScript\
  \ 5+″);\n   @elif (@_jscript_version >= 4)\n      document.write(″此环境支持 JScript\
  \ 4+″);\n   @else@*/\n      document.write(″此环境不支持新版本的 JScript″);\n   /*@end\n@*/\n\
  </script>\n```\n\n### 条件编译指令\n以下指令告诉浏览器在条件编译期间如何行为。请注意，这些指令仅在 JScript.NET 中支持。\n\
  \n`@debug`\n`@debug` 指令开启或关闭调试符号的输出。当关闭时，编译器不会为局部变量生成调试信息，但不会阻止全局变量信息的输出。编译器仅在从命令行使用\
  \ `/debug` 选项编译时，或在 `@page` 指令中设置 `debug` 标志编译 ASP.NET 页面时，才会生成调试符号。在这些情况下，`debug`\
  \ 指令默认开启。当 `debug` 指令出现时，它将一直有效，直到遇到文件末尾或找到下一个 `debug` 指令。\n\n```javascript\nfunction\
  \ debugDemo() {\n    // 关闭 debugOffVar 的调试信息。\n    @set @debug(off)\n    var debugOffVar\
  \ = 42;\n    // 开启调试信息。\n    @set @debug(on)\n    // debugOnVar 有调试信息。\n    vardebugOnVar=\
  \ 10;\n    // 启动调试器。\n    debugger;\n}\n\n// 调用示例。\ndebugDemo ();\n```\n\n`@position`\n\
  在错误消息中提供代码位置信息。\n\n#### 语法\n`@set @position(end | [file = fname ;] [line = lnum\
  \ ;] [column = cnum])`\n\n## 示例\n```javascript\n// 10 行宿主机插入的代码。\n//...\n// 宿主机插入的代码结束。\n\
  /* @set @position(line = 1) */\nvar i :int = 42;\nvar x = ; // 报告错误在第 2 行。\n// 文件剩余部分。\n\
  ```\n\n### 条件编译语句\n条件编译最基本的用法涉及使用 `@if`、`@eliff`、`@else` 和 `@end` 语句。一个示例为特定的 JScript\
  \ 版本显示自定义代码。例如：\n\n```html\n<script>\n/*@cc_on@*/\n/*@if (@_jscript_version >= 6)\n\
  \ document.write (″JScript 版本 6.0 或更高。<BR>″);\n@elif (@_jscript_version >= 5)\n\
  \ document.write (″JScript 版本高于 5.0 但低于 6.0。 <BR>″);\n@else @*/\n document.write(″您需要更新的脚本引擎。<BR>″);\n\
  /*@end @*/\n// 输出: JScript 版本高于 5.0 但低于 6.0。\n</script>\n```\n这些流程控制语句镜像了你在 JavaScript\
  \ 中看到的内容。需要特别注意的一点是在是在非 JScript 浏览器中要显示的部分之前，多行注释是如何关闭的。这是因为否则，那些浏览器将认为整个部分都是注释并忽略它。\n\
  \n### 条件编译变量\nJScript 提供了一列你可能想在条件编译中使用的预设变量此外此外你还可以使用 `@set` 操作符定义自己的变量。\n\n####\
  \ 预定义变量\n当然，在使用这些任何变量之前，必须先用 `@cc_on` 语句激活条件编译。例如：\n\n```html\n<script>\n/*@cc_on\n\
  \   document.write(″JScript 版本: ″ + @_jscript_version + ″);\n   @if (@win32)\n \
  \     document.write(″运行在 32 位系统上″);\n   @elif (@win16)\n      document.write(″运行在\
  \ 16 位系统上″);\n   @else@*/\n      document.write(″运行在不同的平台上″);\n   @end\n@*/\n//\
  \ 输出: JScript 版本: 5. 运行在 32 位系统上。\n</script>\n```\n\n### 设置自定义变量\n开发者可以通过先使用 `@set`\
  \ 声明来创建和评估自定义变量。例如：\n\n```html\n<script>\n/*@cc_on\n   @set Qualify = false\n  \
  \ @if (@jscript_version < 6)\n      @set Qualify = true\n   @end\n   @if (Qualify\
  \ == true)\n      document.write(″您的浏览器是 Internet Explorer 5、6 或 8″);\n@*/\n// 输出:\
  \ \n</script>\n```\n\n### JavaScript 全局对象\nJavaScript 有很多全局对象。其中一些是 ECMAScript 类，如\
  \ `Array` 和 `Boolean`，但另一些是特有对象，如 `Enumerator` 和 `VBArray`。请确保阅读第 6 章：全局与对象。\n\n\
  # ActiveXObject\n**标准:** `JScript 1.0+`\n**支持:** Internet Explorer 3+\n\n### 语法\n\
  `var myAXObj = new ActiveXObject(servername [, location])`\n\n### 描述\n启用并返回 ActiveX\
  \ 对象的引用。\n\n## 示例\n```html\n<script type=\"text/javascript\">\n// 使用 ActiveXObject\
  \ 创建一个 Ajax 对象\nif(typeof ActiveXObject != \"undefined\") {\n    // 创建一个 Ajax 对象\n\
  \    xmlhttp = new ActiveXObject(\"MSXML2.XMLHTTP\");\n    xmlhttp.open(\"GET\"\
  , \"#\", false);\n    xmlhttp.send(null);\n} else {\n    // 不是 JScript\n    document.write(\"\
  此浏览器不支持 ActiveXObjects.\");\n}\n</script>\n```\n\n# Array\n**标准:** `JavaScript 1.1+,\
  \ JScript 3.0+, ECMAScript 1.0+`\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 4.0+, Netscape Navigator 3.0+, Opera 3.0+, Safari 1.0+\n\
  \n### 语法\n```javascript\narrayObject = new Array();\narrayObject = new Array(size);\n\
  arrayObject = new Array(element0, element1, ..., elementN);\n// 数组字面量\narrayObject\
  \ = [element0, element1, ..., elementN];\n```\n\n### 描述\n为任何数据类型的数组提供支持。\n\n## 示例\n\
  ```html\n<script type=\"text/javascript\">\nvar myArrInstance = new Array(\"apple\"\
  , \"show\", 23, true);\n</script>\n```\n\n\n\n\n```javascript\ndocument.write(myArrInstance.toString());\
  \ // apple,show,23,true\n```\n\n## Array.index\n\n**标准:** JavaScript 1.2+, JScript\
  \ 3.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 4.0+, Netscape Navigator 4.0+, Opera 7.0+, Safari 1.0+\n\n### 语法\n```javascript\n\
  myArrayInstance.index\n```\n\n### \n字符串中正则表达式匹配的索引。仅当数组由正则表达式搜索创建时，该属性才存在。\n\n##\
  \ 示例\n```html\n<script type=&quot;text/javascript&quot;// 由于此属性仅在数组由正则表达式创建时才会显示\n\
  \n// 我们创建一个字符串：\nvar myString = \"This is really bad grammer really. really.\";\n\
  \n// 现在我们对单词 'really' 执行匹配\n\nvar myArray = myString.match(/really/);\n\n// 这将为我们返回一个包含一个元素的数组\n\
  \n// 现在我们写出结果，结果将是 8\ndocument.write(myArray.index);\n</script>\n```\n\n## Array.input\n\
  \n**标准:** JavaScript 1.2+, JScript 5.8+\n**支持:** Google Chrome Beta+, Firefox 1.0\
  \ (Gecko 1.7)+, Internet Explorer 6.0+, Netscape Navigator 4.0+, Opera 7.0+, Safari\
  \ 1.0+\n\n### 语法\n```javascript\nmyArray.input\n```\n\n### \n用于正则表达式匹配的原始字符串。仅当数组通过\
  \ `RegExp` 匹配创建时，该属性才存在于数组中。\n\n## 示例\n```html\n<script type=&quot;text/javascript&quot;//\
  \ 由于此属性仅在数组由正则表达式创建时才会显示\n\n// 我们创建一个字符串：\nvar myString = \"This is really bad grammer\
  \ really. really.\";\n\n// 现在我们对单词 'really' 执行匹配\n\nvar myArray = myString.match(/really/);\n\
  \n// 这将为我们返回一个包含一个元素的数组\n\n// 现在我们写出输入，这将原始字符串\ndocument.write(myArray.input);\n\
  </script>\n```\n\n## Array.length\n\n**标准:** JavaScript 1.1+, JScript 3.0+, ECMAScript\
  \ 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer\
  \ 4.0+, Netscape Navigator 3.0+, Opera 3.0+, Safari 1.0+\n\n### 语法\n```javascript\n\
  myArrayInstance.length\n```\n\n### \n保存数组中元素的数量。该属性既可以读取也可以写入。如果写入长度属性且其值比之前大，则新元素将附加到数组中。如果它现在变短，则元素将从尾部截断。\n\
  \n## 示例\n```html\n<script type=&quot;text/javascript&quot;\nvar myArray = new Array(\"\
  apple\", \"orange\", \"pear\");\n\n// arrlength 将等于 3\nvar arrlength = myArray.length;\n\
  \nmyArray.length = 2; // \"pear\" 被移除了\n\ndocument.write(myArray.join(\",\")); //\
  \ apple,orange\n</script>\n```\n\n## Array.prototype\n\n**标准:** JavaScript 1.1+,\
  \ JScript 3.0+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 4.0+, Netscape Navigator 3.0+, Opera 3.0+, Safari 1.0+\n\
  \n### 语法\n```javascript\nArray.prototype.property\nArray.prototype.method\n```\n\
  \n### \n`prototype` 属性允许你扩展对象以为所有实例添加新的属性和方法。\n\n## 示例\n```html\n<script type=&quot;text/javascript&quot;//\
  \ 此函数统计包含特定字符串元素的数量\nfunction searchCount(strSearch) {\n  var itemCount = 0;\n \
  \ if (this.length > 0) {\n    for (var i in this) {\n      if (this[i].toString().indexOf(strSearch)\
  \ > -1) {\n        itemCount++;\n      }\n    }\n  }\n  return itemCount;\n}\n//\
  \ 现在我们使用原型扩展 Array 对象以包含此函数\nArray.prototype.searchCount = searchCount;\n\n// 现在我们创建一个数组\n\
  var myArray = new Array(\"applebook\", \"apple\", \"dell\", \"microsoft\");\n//\
  \ 现在我们使用此方法计算 'apple' 出现次数\nvar myResult = myArray.searchCount(\"apple\");\n// 显示结果，为\
  \ 3\ndocument.write(myResult);\n</script>\n```\n\n## Array.concat(element0, ...,\
  \ elementN)\n\n**标准:** JavaScript 1.2+, JScript 3.0+, ECMAScript 1.0+\n**支持:** Google\
  \ Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator\
  \ 4.0+, Opera 4.0+, Safari 1.0+\n\n### 语法\n```javascript\nvar myOutputArray = myArrayInstance.concat(value1,\
  \ value2, ..., valueN);\n```\n\n### \n将一个数组与另一个数组或项合并。不修改原始数组。\n\n## 示例\n```html\n\
  <script type=&quot;text/javascript&quot;\nvar array1 = new Array(\"one\", \"two\"\
  , \"three\", \"four\");\nvar array2 = new Array(\"apple\", \"tree\", \"cow\");\n\
  // 这将合并数组\nvar myFinalArray = array1.concat(array2);\n// 现在我们将任意项合并到数组中\nmyFinalArray\
  \ = array1.concat(23, 44);\n// myFinalArray 看起来像：one,two,three,four,apple,tree,cow,23,44\n\
  document.write(myFinalArray.join(\",\"));\n</script>\n```\n\n## Array.every(callback)\n\
  \n**标准:** JavaScript 1.2+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+,\
  \ Safari 3.0+\n\n### 语法\n```javascript\nvar boolPassed = myArrayInstance.every(callbackFn)\n\
  ```\n\n### \n测试数组中的所有项是否通过了由回调函数的测试（返回 true 或 false）。\n\n## 示例\n```html\n<script\
  \ type=&quot;text/javascript&quot;\nvar myShortArray = new Array(\"one\", \"yah\"\
  , \"house\");\nvar myLongArray = new Array(\"cartoon\", \"javascript\", \"forest\"\
  );\n\n// 创建一个我们将用于测试数组的函数\nfunction isLongEnough(element, index) {\n  return (element.length\
  \ > 3);\n}\n// 将我们的数组通过上述函数进行测试\ndocument.write(myShortArray.every(isLongEnough)\
  \ + \"<br />\"); // 输出 false\ndocument.write(myLongArray.every(isLongEnough) + \"\
  <br />\"); // 输出 true\n</script>\n\n## Array.filter(callback)\n\n**标准:** JavaScript\
  \ 1.2+\n**支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Safari 3.0+\n\n###\
  \ 语法\n```javascript\nvar myNewArray = myArrayInstance.filter(callbackFn)\n```\n\n\
  ### \n返回一个包含所有通过回调函数测试的元素的数组。\n\n## 示例\n```html\n<script type=&quot;text/javascript&quot;\n\
  var myArrayInstance = new Array(\"one\", \"two\", \"three\", \"four\", \"three\"\
  , \"four\");\n// 创建一个我们将用于过滤数组的函数\nfunction isLongerThree(element, index) {\n  return\
  \ (element.length > 3);\n}\n// 通过上述函数过滤数组\nvar filtered = myArrayInstance.filter(isLongerThree);\n\
  // filtered 看起来像：three,four,three,four\ndocument.write(filtered.join(\",\"));\n\
  </script>\n```\n\n## Array.forEach(callback)\n\n**标准:** JavaScript 1.6+\n**支持:**\
  \ Google Chrome Beta+, Firefox 1.5 (Gecko 1.8)+, Safari 1.0+\n\n### 语法\n```javascript\n\
  myArrayInstance.forEach(callbackFn);\n```\n\n### \n遍历数组，为每个项执行提供的函数。\n\n## 示例\n\
  ```html\n<script type=&quot;text/javascript&quot;\nvar myArrayInstance = new Array(\"\
  one\", \"two\", \"three\", \"four\", \"one\");\n\nfunction writeItOut(element, index,\
  \ array) {\n  document.write(index + \" is \" + element + \"<br />\");\n}\nmyArrayInstance.forEach(writeItOut);\n\
  // 输出：\n//0 is one\n//1 is two\n//2 is three\n//3 is four\n//4 is one\n</script>\n\
  ```\n\n## Array.indexOf()\n\n**标准:** JavaScript 1.6+\n**支持:** Google Chrome Beta+,\
  \ Firefox 1.5 (Gecko 1.8)+, Safari 3.0+\n\n### 语法\n```javascript\nvar myIndexInt\
  \ = myArrayInstance.indexOf(searchElement[, fromIndex])\nmyIndexInt = myArrayInstance.indexOf(searchElement)\n\
  ```\n\n### \n在数组中搜索元素的第一个实例。如果找到则返回索引，否则返回 -1。\n\n## 示例\n```html\n<script type=&quot;text/javascript&quot;//\
  \ 首先创建一个带有带有重复元素的数组\nvar myArrayInstance = new Array(\"one\", \"two\", \"three\"\
  , \"four\", \"one\", \"two\", \"three\", \"four\");\n\ndocument.write(myArrayInstance.indexOf(\"\
  two\") + \"<br />\"); // 返回 1\ndocument.write(myArrayInstance.indexOf(\"two\", 2)\
  \ + \"<br />\"); // 返回 5\n</script>\n```\n\n## Array.join(separator)\n\n**标准:**\
  \ JavaScript 1.1+, JScript 3.0+, ECMAScript 1.0+\n**支持:** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator 3.0+, Opera 3.0+,\
  \ Safari 1.0+\n\n### 语法\n\n\n\n\n\n`var myString = myArrayInstance.join(\",\")`\n\
  \n### **描述**\n将数组的所有元素连接成由分隔符分隔的字符串。\n\n### **示例**\n```javascript\n<script type=\"\
  text/javascript\">\nvar myArrayInstance = new Array(\"one\", \"two\", \"three\"\
  , \"four\");\n// 在每个值之间使用一个字符串组合数组\nvar myString = myArrayInstance.join(\"oO0Oo\"\
  );\n// 输出 \"oneoO0OotwooO0OothreeoO0Oofour\"\ndocument.write(myString);\n</script>\n\
  ```\n\n## Array.lastIndexOf(searchElement [, fromIndex])\n**标准:** JavaScript 1.6+\
  \ **支持:** Google Chrome Beta+, Firefox 1.5 (Gecko 1.8)+, Safari 3.0+\n\n### **语法**\n\
  ```javascript\nvar myIndexInt = myArrayInstance.lastIndexOf(searchElement[, fromIndex])\n\
  myIndexInt = myArrayInstance.lastIndexOf(searchElement)\n```\n\n### **描述**\n在数组中搜索元素的最后一个实例。如果找到，则返回索引；如果未找到则返回\
  \ -1。\n\n### **示例**\n```javascript\n<script type=\"text/javascript\">\n// 首先创建一个包含重复元素的数组\n\
  var myArrayInstance = new Array(\"one\", \"two\", \"three\", \"four\", \"one\",\
  \ \"two\", \"three\", \"four\");\ndocument.write(myArrayInstance.lastIndexOf(\"\
  two\") + \"<br />\"); // 返回 \"5\"\ndocument.write(myArrayInstance.lastIndexOf(\"\
  two\", 2) + \"<br />\"); // 返回 \"1\"\n</script>\n```\n\n## Array.map(callback [,\
  \ thisObject])\n**标准:** JavaScript 1.6+ **支持:** Google Chrome Beta+, Firefox 1.5\
  \ (Gecko 1.8)+, Safari 1.0+\n\n### **语法**\n```javascript\nvar myMappedArray = myArrayInstance.map(callbackFn\
  \ [, thisObject])\n```\n\n### **描述**\n返回一个新数组，其元素为对父数组中的每个项目调用函数产生的结果。\n\n### **示例**\n\
  ```javascript\n<script type=\"text/javascript\">\nvar array1 = new Array(\"one\"\
  , \"cartoon\", \"yah\", \"citywide\", \"cat\");\nvar array2 = new Array(\"house\"\
  , \"two\", \"three\", \"yup\", \"forest\");\nfunction isLongEnough(element, index,\
  \ array) {\n  return (element.length > 3);\n}\ndocument.write(array1.map(isLongEnough).join(\"\
  ,\") + \"<br />\");\n// 输出 false,true,false,true,false\ndocument.write(array2.map(isLongEnough).join(\"\
  ,\") + \"<br />\");\n// 输出 true,false,true,false,true\n</script>\n```\n\n## Array.pop()\n\
  **标准:** JavaScript 1.2+, JScript 3.0+, ECMAScript 3.0+ **支持:** Google Chrome Beta+,\
  \ Firefox 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator 4.0+, Opera\
  \ 4.0+, Safari 1.0+\n\n### **语法**\n```javascript\nmyArrayInstance.pop()\n```\n\n\
  ### **描述**\n返回数组中的最后一个项，并将其移除。\n\n### **示例**\n```javascript\n<script type=\"text/javascript\"\
  >\nvar myArray = new Array(\"house\", \"tree\", \"bark\", \"cow\");\n// 这会将数组（不含最后一个元素）写入\
  \ poppedArray\nvar poppedVal = myArray.pop();\n// 现在 poppedVal 等于 \"cow\"\n// 这将输出：house,tree,bark\n\
  document.write(myArray.join(\",\"));\n</script>\n```\n\n## Array.push()\n**标准:**\
  \ JavaScript 1.2+, JScript 3.0+, ECMAScript 3.0+ **支持:** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator 4.0+, Opera 3.0+,\
  \ Safari 1.0+\n\n### **语法**\n```javascript\nmyArrayInstance.push(val1, val2, ..\
  \ )\n```\n\n### **描述**\n向数组添加一个或多个元素，并返回数组的最终长度。\n\n### **示例**\n```javascript\n\
  <script type=\"text/javascript\">\nvar myArray = new Array(\"house\", \"tree\",\
  \ \"bark\", \"cow\");\n// 这将向数组添加两个元素\nmyArray.push(\"car\", \"bicycle\");\n// 这将输出：house,tree,bark,cow,car,bicycle\n\
  document.write(myArray.join(\",\"));\n</script>\n```\n\n## Array.reduce(callback\
  \ [, initialValue])\n**标准:** JavaScript 1.8+ **支持:** Firefox 3.0 (Gecko 1.9)+\n\n\
  ### **语法**\n```javascript\nvar resultString = myArrayInstance.reduce(callbackFn\
  \ [, initialValue])\n```\n\n### **描述**\n对数组中的两个项目同时执行一个函数（从左到右移动）。\n\n### **示例**\n\
  ```javascript\n<script type=\"text/javascript\">\nvar array1 = new Array(\"one\"\
  , \"cartoon\", \"yah\", \"citywide\", \"cat\");\nfunction combineWords(previousValue,\
  \ currentValue, index, array) {\n  return (previousValue + currentValue + \",\"\
  );\n}\ndocument.write(array1.reduce(combineWords));\n// 输出 onecartoon,yah,citywide,cat\n\
  </script>\n```\n\n## Array.reduceRight(callback [, initialValue])\n**标准:** JavaScript\
  \ 1.8+ **支持:** Firefox 3.0 (Gecko 1.9)+\n\n### **语法**\n```javascript\nvar resultString\
  \ = myArrayInstance.reduceRight(callbackFn [, initialValue])\n```\n\n### **描述**\n\
  对数组中的两个项目同时执行一个函数（从右向左移动）。\n\n### **示例**\n```javascript\n<script type=\"text/javascript\"\
  >\nvar array1 = new Array(\"one\", \"cartoon\", \"yah\", \"citywide\", \"cat\");\n\
  function combineWords(previousValue, currentValue, index, array) {\n  return (previousValue\
  \ + currentValue + \",\");\n}\ndocument.write(array1.reduceRight(combineWords));\n\
  // 输出 cat,citywide,yah,cartoon,one\n</script>\n```\n\n## Array.reverse()\n**标准:**\
  \ JavaScript 1.1+, JScript 3.0+, ECMAScript 1.0+ **支持:** Google Chrome Beta+, Firefox\
  \ 1.0 (Gecko 1.7)+, Internet Explorer 4.0+, Netscape Navigator 3.0+, Opera 4.0+,\
  \ Safari 1.0+\n\n### **语法**\n```javascript\nmyArrayInstance.reverse()\n```\n\n###\
  \ **描述**\n反转数组的顺序。\n\n### **示例**\n```javascript\n<script type=\"text/javascript\"\
  >\nvar myArray = new Array(\"one\", \"two\", \"three\", \"four\");\n// 这会将反转后的数组写入\
  \ myArray\nmyArray.reverse();\n// 输出：four,three,two,one\ndocument.write(myArray.join(\"\
  ,\"));\n</script>\n```\n\n## Array.shift()\n**标准:** JavaScript 1.2+, JScript 3.0+,\
  \ ECMAScript 3.0+ **支持:** Google Chrome Beta+, Firefox 1.0 (Gecko 1.7)+, Internet\
  \ Explorer 4.0+, Netscape Navigator 4.0+, Opera 4.0+, Safari 1.0+\n\n### **语法**\n\
  ```javascript\nmyArrayInstance.shift()\n```\n\n### **描述**\n从数组中移除第一个项并返回该项。\n\n\
  ### **示例**\n```javascript\n<script type=\"text/javascript\">\nvar myArray = new\
  \ Array(\"one\", \"two\", \"three\", \"four\");\n// 这会将数组的第一个元素写入 myEl\nvar myEl\
  \ = myArray.shift();\n// 现在 myArray 看起来像：two,three,four\ndocument.write(myArray.join(\"\
  ,\"));\n</script>\n```\n\n## Array.slice(beginIndex [,endIndex])\n**标准:** JavaScript\
  \ 1.2+, JScript 3.0+, ECMAScript 3.0+ **支持:** Google Chrome Beta+, Firefox 1.0 (Gecko\
  \ 1.7)+, Internet Explorer 4.0+, Netscape Navigator 4.0+, Opera 3.0+, Safari 1.0+\n\
  \n### **语法**\n```javascript\nvar myNewArray = myArrayInstance.slice(beginIndex)\n\
  myNewArray = myArrayInstance.slice(beginIndex,endIndex)\n```\n\n### **描述**\n复制数组的一部分并返回一个新数组。不改变原始数组。使用两个参数时，第二个参数必须大于第一个参数才能返回结果。\n\
  \n### **示例**\n```javascript\n<script type=\"text/javascript\">\nvar myArrayInstance\
  \ = new Array(\"one\", \"two\", \"three\", \"four\");\n// 这将从索引 2 开始提取数组\nvar myNewArray\
  \ = myArrayInstance.slice(2);\ndocument.write(myNewArray.join(\",\") + \"<br />\"\
  ); // 输出 three,four\nmyNewArray = myArrayInstance.slice(1,2);\ndocument.write(myNewArray.join(\"\
  ,\") + \"<br />\"); // 输出 two\n</script>\n```\n\n## Array.some(callback [, thisObject])\n\
  **标准:** JavaScript 1.6+ **支持:** Google Chrome Beta+, Firefox 1.5 (Gecko 1.8)+, Safari\
  \ 1.0+\n\n### **语法**\n```javascript\nvar myBoolResult = myArrayInstance.some(callback)\n\
  ```\n\n### **描述**\n如果数组中至少有一个元素通过传递给它的函数，则返回 true。\n\n### **示例**\n```javascript\n\
  <script type=\"text/javascript\">\nvar array1 = new Array(\"one\", \"cartoon\",\
  \ \"yah\", \"citywide\", \"cat\");\nvar array2 = new Array(\"yah\", \"two\", \"\
  cat\", \"yup\", \"hut\");\nfunction isLongEnough(element, index, array) {\n  return\
  \ (element.length > 3);\n}\ndocument.write(array1.some(isLongEnough) + \"<br />\"\
  ); // 输出 true\ndocument.write(array2.some(isLongEnough) + \"<br />\"); // 输出 false\n\
  </script>\n```\n\n\n\n通过一次向自定义函数传递两个元素对数组进行排序。\n\n## 示例\n\n```javascript\n<script\
  \ type=\"text/javascript\">\nvar myArray = new Array(\"cable\", \"zebra\", \"apple\"\
  , \"dart\", \"bow\", 29, \"elephant\");\n\n// 通过调用 sort，所有项目将按字母顺序排序，'29' 位于开头\n\
  myArray.sort();\n\n// 我们也可以传递一个函数来执行自定义排序算法。在这种情况下，通过\nlengthfunction customSortbyLength(item1,\
  \ item2) {\n    // 如果顺序正确，我们应该返回 1\n    // 如果顺序错误，则返回 -1\n    // 如果它们相等，返回 0\n \
  \   // 首先我们确保它们是字符串\n    item1 = item1.toString();\n    item2 = item2.toString();\n\
  \    if (item1.length == item2.length)\n        return 0;\n    if (item1.length\
  \ < item2.length)\n        return -1;\n    if (item1.length > item2.length)\n  \
  \      return 1;\n}\n\n// 通过调用 sort，所有项目将通过此函数排序\nmyArray.sort(customSortbyLength);\n\
  \n// 现在 myArray 看起来像：two,three,four\ndocument.write(myArray.join(\",\"));\n</script>\n\
  ```\n\n## Array.splice(index, deleteCount, [element0, . . . , elementN])\n\n**标准:**\
