  \ 字符串，只读。\n\n\n\n\n## Methods\n\n- `adoptNode(externalNode)` -- 从外部文档采用一个节点。（支持:\
  \ FF3+)\n- `captureEvents(eventTypeList)` -- 注册窗口以捕获指定类型的所有事件。（支持: NN4）\n- `close()`\
  \ -- 关闭用于写入文档流。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+)\n- `createAttribute(attrName)`\
  \ -- 创建一个新的属性节点并返回它。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+) *返回：* 属性对象引用。\n- `createAttributeNS()`\
  \ -- 在指定的命名空间中创建一个新的属性节点并返回它。（支持: FF1+, NN7+) *返回：* 属性对象引用。\n- `createCDATASection(data)`\
  \ -- 创建一个新的 CDATA 节点并返回它。（支持: FF1+, IE5+, NN7+) *返回：* CDATA 节段对象引用。\n- `createComment(commentText)`\
  \ -- 创建一个新的注释节点并返回它。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+) *返回：* 注释对象引用。\n- `createDocumentFragment()`\
