  \ -- 使用给定的标签名创建一个新元素。（支持: CH1+, FF1+, IE4+, NN6+, O7+, SF1+) *返回：* 元素对象引用。\n- `createElementNS(namespaceURI,\
  \ tagName)` -- 使用给定的标签名和命名空间 URI 创建新元素。（支持: FF1+, NN6+) *返回：* 元素对象引用。\n- `createEvent(eventType)`\
  \ -- 创建一个事件。（支持: CH1+, FF1+, NN6+, SF1+) *返回：* 事件对象引用。\n- `createEventObject([eventObject])`\
  \ -- 生成一个事件对象，在使用 `fireEvent` 方法时用于传递事件上下文信息。（支持: IE5.5+) *返回：* 事件对象。\n- `createNSResolver()`\
  \ -- 用于 XPath 中修改节点以便能够解析命名空间。（支持: FF1+, NN7+) *返回：* XPath 解析器对象。\n- `createProcessingInstruction(target,\
