  [content]\n\n## statement\n\n这三个参数描述了循环执行的次数，并定义了在循环内部使用的迭代器。初始化部分（initializer）描述了将使用哪个变量作为迭代器。通常在这里使用一个变量声明（例如，`var\
  \ myIterator = 0;`）。在下一个参数中，`test_` 条件是一个每次循环准备执行时评估的表达式。如果表达式为假，循环继续；如果为真，循环终止。第三个参数是\
  \ `increment_expression`（增量表达式），它指定了初始化部分定义的迭代器变量如何增加。这并不非要是 `+1` 增加。你可以自由地将迭代器增加\
  \ `2`、`10`、`1000` 或 `-1000`，或者使用某种非迭代。\n\n在下面的示例中，我使用 `for` 循环显示了一个乘法表：\n\n```javascript\n\
  // A multiplication table\nfor (var myLoop = 0; myLoop <= 10; myLoop++) {\n    document.write(\"\
  10x\" + myLoop + \" = \" + (10*myLoop) + \"<br />\");\n}\n```\n\n这将输出以下内容：\n10x0\
  \ = 0\n10x1 = 10\n10x2 = 20\n10x3 = 30\n10x4 = 40\n10x5 = 50\n10x6 = 60\n10x7 =\
  \ 70\n10x8 = 80\n10x9 = 90\n10x10 = 100\n\n`for` 循环有趣之处在于，这是你极少数可以使用逗号运算符来为语句添加细节的地方之一。初始化部分和\
  \ `increment_expression` 都可以包含多个连接的语句，如下例所示：\n\n```javascript\n// Multiple iterators\n\
  for (myNumber = 0, myOtherNumber = 10; myNumber <= 10; myNumber++, myOtherNumber--)\
  \ {\n    document.write(myNumber + \"*\" + myOtherNumber + \" = \" + (myNumber*myOtherNumber)\
  \ + \"<br />\");\n}\n```\n\n这段代码将输出以下文本：\n0*10 = 0\n1*9 = 9\n2*8 = 16\n3*7 = 21\n\
  4*6 = 24\n5*5 = 25\n6*4 = 24\n7*3 = 21\n8*2 = 16\n9*1 = 9\n10*0 = 0\n\n构建 `for`\
  \ 循环或任何类型的循环时需要注意的大事是，`test_condition` 在每次循环迭代时都会被评估，因此出于性能考虑，你应该尽量减少在这里进行的处理量。在第\
  \ 25 章中，我建议了一些最大化 `for` 循环性能的方法。\n\n## for .. in\n\n更高级的循环类型是 `for .. in`。这种循环的目的是遍历\
  \ `Object` 或 `Array` 中的枚举属性。这包括任何枚举值（`Array` 的元素）以及添加到 `Object` 或 `Array` 的任何自定义属性，但不包括任何内置方法或属性，例如所有\
  \ `Objects` 继承的 `valueOf()` 方法。其通用语法如下：\n\n```javascript\nfor (variable in object)\n\
  \    statement;\n```\n\n与其他任何循环一样，`statement` 可以是一个代码块（`{}`），在随后的示例中将会看到。当循环执行时，`object`\
  \ 内部由 `variable` 描述的属性名将替代 `variable`，可以在循环内部访问它。遗憾的是，这些元素的迭代顺序无法控制或容易预测，因此如果需要特定的顺序，它就没那么用。事实上，在大多数浏览器中，项目将按照它们被添加的顺序取出的。基于\
  \ V8 JavaScript 引擎的 Google Chrome 版本已知在某些情况下会返回不同的顺序。然而，这个问题正在被跟踪中。\n\n```javascript\n\
  // Iterates over the elements of an array and object using the for .. in construct\n\
  var animals = [\"cow\", \"horse\", \"cat\", \"pig\", \"rabbit\", \"fish\"];\n\n\
  for (theanimal in animals) {\n    document.write(theanimal + \"-\" + animals[theanimal]\
  \ + \"<br />\");\n}\n\ndocument.write(\"-----------<br />\"); // breaks up the two\
  \ loops on the page\n\nvar myObject = {apple:100, truthiness:false, astring: 'hello'\
  \ };\n\nfor (item in myObject) {\n    document.write(item + \"-\" + myObject[item]\
  \ + \"<br />\");\n}\n```\n\n此示例将产生以下输出：\n0-cow\n1-horse\n2-cat\n3-pig\n4-rabbit\n\
  5-fish\n-----------\napple-100\ntruthiness-false\nastring-hello\n\n在实践中，这是遍历自定义\
  \ `Objects` 和 `Arrays` 中所有项（但不 `DOM` 元素）的好方法。原因是取决于浏览器和浏览器版本，你会得到不同的结果。如果这不是问题，`for\
  \ .. in` 是一个很好的选择。例如，如果你执行以下在 `DOM` 元素上使用 `for .. in` 的代码，你会得到一组非常特殊的结果，反映了 Internet\
  \ Explorer DOM 的独特性：\n\n```html\n<html>\n<body>\n    <a href=\"www.cnn.com\" id=\"\
  hrelink\">Hello</a>\n    <script>\n        // 示例代码逻辑\n    </script>\n</body>\n</html>\n\
  ```\n\n## for .. in\n\n基于 `for` 关键字构建的类似于 `for .. in` 的另一种循环结构是 `for .. in`。它工作方式相同，但它不是遍历属性名，而是遍历属性值。以下是在自定义对象上使用\
  \ `for .. in` 的示例：\n\n```javascript\n// An example of for .. in on an object\nvar\
  \ myObject = {apple:100, truthiness:false, astring: 'hello' };\n\nfor each (item\
  \ in myObject) {\n    document.write(item + \"-\" + myObject[item] + \"<br />\"\
  );\n}\n```\n\n此示例将产生以下输出：\n100\nfalse\nhello\n\n`for .. in` 循环目前仅支持 Mozilla 变体 1.6+。这包括\
  \ Firefox 1.5+，但不包括 Netscape、Webkit、Opera 或 Chrome。它也不是 ECMA 标准的一部分。\n\n## while\n\
  \n非常简单高效的循环结构是 `while`，因为它持续循环直到测试条件不再为真。语法如下：\n\n```javascript\nwhile (expression)\n\
  \    statement\n```\n\n与 `do .. while` 循环不同，如果表达式第一次遇到时为假，`while` 循环将不会执行。这是因为表达式是在迭代开始时测试的，而不是结束时。以下是一个简单的\
  \ `while` 循环示例：\n\n```javascript\n// A while loop will execute four times\nvar loopVar\
  \ = 0;\nwhile (loopVar < 4) {\n    loopVar++;\n    document.write(\"loopVar: \"\
  \ + loopVar + \"<br />\");\n}\n```\n\n这将输出：\nloopVar: 1\nloopVar: 2\nloopVar: 3\n\
  loopVar: 4\n\n## do .. while\n\n另一种简单高效的循环结构是 `do .. while`，它持续循环直到测试条件不再为真。语法如下：\n\
  \n```javascript\ndo {\n    statement\n} while (expression);\n```\n\n`do .. while`\
  \ 循环与基础 `while` 循环相反，因为它只在循环的*结尾*才测试表达式，这意味着即使表达式为假，也保证至少执行一次。以下是一个 `do .. while`\
  \ 循环的示例：\n\n```javascript\n// An example of a do .. while loop\nvar loopVar = 0;\n\
  do {\n    loopVar++;\n    document.write(\"loopVar: \" + loopVar + \"<br />\");\n\
  } while (loopVar < 4)\n```\n\n这将创建以下输出：\nloopVar: 1\nloopVar: 2\nloopVar: 3\nloopVar:\
  \ 4\n\n\n\n\n\n有三类语句与循环结构的控制密切相关，但它们本身并不是循环。这些是 `break`、`label` 和 `continue` 语句。它们允许你不仅中断循环的执行，还可以中断其他类型的块语句的执行。\n\
  \n从 `break` 开始是合理的。如果你想提前退出循环或 switch 结构，可以使用 `break` 语句。`break` 的基本语法简单为：`break\
  \ [label];`。例如，你可以用它来终止一个 `for` 循环，如下所示：\n\n```javascript\n// Use the break statement\
  \ to abort a for loop\nfor (var i = 0; i < 10; i++) {\n  document.write(i + \"<br\
  \ />\");\n  if (i == 3)\n    break;\n}\n```\n\n这这将产生以下输出：\n0\n1\n2\n3\n\n在不使用可选的\
  \ `label` 参数的情况下，`break` 语句只会中断当前的父级循环或 switch。如果层级中还有其他结构，它们将不受影响地继续执行。\n\n在讨论\
  \ `switch` 语句时，你已经了解过标签（labels）。`case` 和 `default` 关键字都是标签。你可以用任何有效标识符为 JavaScript\
  \ 中的几乎任何语句标记，但它们最常用的用途是标记循环，以便跳出特定的循环并继续其他循环。标签的语法为：`label : statement;`。\n\n在下面的示例中，你使用标签标识两个循环（`bigloop`\
  \ 和 `smallerloop`），并使用 `break` 语句选择性地终止其中一个：\n\n```javascript\n// Use label and\
  \ break to control the execution of loops\nbigloop:\nfor (var i = 0; i < 10; i++)\
  \ {\n  smallerloop:\n  for (var x = 0; x < 10; x++) {\n      document.write(\"i:\"\
  \ + i + \" x:\" + x + \"<br />\");\n      if (x == 3)\n        break smallerloop;\n\
  \      if (i == 2)\n        break bigloop;\n  }\n}\n```\n\n在这里发生的情况是：每当小循环遇到 `x\
  \ == 3` 时都会终止，而大循环在它第一次等于 `2` 时就会终止。因此，输出如下：\ni:0 x:0\ni:0 x:1\ni:0 x:2\ni:0 x:3\n\
  i:1 x:0\ni:1 x:1\ni:1 x:2\ni:1 x:3\ni:2 x:0\n\n我已经说过，标签不仅可以与循环配合使用，而且这是它们最常见的用途。在使用*带有*标签的\
  \ `break` 语句时，唯一的要求是该标签必须是 `break` 的父级语句。它不能位于程序中其他不相关的区域。看下面的示例：\n\n```javascript\n\
  // Using a break statement in an IF block\nvar a = 10;\nmyspecialIf:\nif (a > 5)\
  \ {\n  document.write(\"We're about to break this if statement. <br />\");\n  break\
  \ myspecialIf;\n  document.write(\"This will never be seen.\");\n}\ndocument.write(\"\
  This will always be seen.\");\n```\n\n尽管我跳出的语句不是循环，但我仍然能够引用标签 `myspecialIf` 并跳出该块。由于这个原因，第二个\
  \ `document.write(\"This will never be seen.\")` 永远不会被写入页面。\n\n循环的另一个有用语句是 `continue`。与\
  \ `break` 类似，`continue` 允许你控制循环，但它会在新的迭代中重启循环而不是跳出循环。像 `break` 一样，你可以单独使用 `continue`\
  \ 或配合标签使用。`continue` 的语法与 `break` 相似：`continue [label];`。\n\n在不带标签的情况下，它会自动引用最顶级循环或\
  \ switch。与 `break` 不同，它只能在以下结构中使用：`while`、`do .. while`、`for`、`for .. in` 和 `for\
  \ .. in`。它的行为根据其所在的循环类型也略有不同：\n- 在 `while` 循环中，它跳转到顶部，重新测试条件，如果条件为真则继续；否则终止循环。\n\
  - 在 `do .. while` 循环中，它跳转到底部，重新测试条件，如果条件为真（在顶部）则继续。\n- 在 `for` 循环中，如果跳转到顶部测试条件，如果条件为假，它执行更新表达式并继续循环。\n\
  - 在 `for .. in` 或 `for .. in` 循环中，它跳转到系列中的下一个属性。\n\n`continue` 的一个常见用途是当 `Array`\
  \ 中的元素不适合某些用途时跳过它，如下例所示：\n\n```javascript\n// Skipping over an array element in\
  \ a for loop using continue\nvar myArray = [\"a\", \"b\", \"cat\", \"dog\", \"tree\"\
  , \"e\", \"house\"];\ndocument.write(\"Some the longer items in the array are: <br\
  \ />\");\nfor (var i = 0; i < myArray.length; i++) {\n  if (myArray[i].length <=\
  \ 3)\n    continue;\n  document.write(myArray[i] + \"<br />\");\n}\n```\n\n在这个示例中我们会跳过元素。输出是：\n\
  数组中的一些长项是：\ncat\ntree\nhouse\n\n## 函数语句\n\n有两个语句与函数的使用有关：`function` 和 `return`。这并不是定义函数的唯一方法。你也可以通过\
  \ `function` 构造函数（`var myFunction = Function()`）或函数运算符（`var myFunction = function(){}`）。与许多语言不同，不需要预定义函数是否会返回值以及返回值的类型。`return`\
  \ 语句用于返回结果：`return expression;`。在下面的示例中，你创建了一个返回值的函数：\n\n```javascript\nfunction\
  \ squareit(x) {\n  return x*x;\n}\ndocument.write(squareit(10));\n```\n\n## 异常处理语句\n\
  \n有些语句用于创建抑制和捕获异常。异常是包含程序问题的事件。当我们犯错时（例如除以零或使用无效语法），解释器会自动抛出异常。你也可以使用相同的系统抛出自定义异常，然后对其进行捕获。\n\
  \n### throw\n\n在 JavaScript 中，与其他语言一样，你使用名为 `throw` 的语句创建自定义异常。当你抛出异常时，可以传递任意的信息，这些信息在你决定捕获错误的地方可以使用。可以是任何对象类型，包括简单的字符串：`throw\
  \ \"There was a problem!\";` 或者复杂的对象 `throw {problem:true, info:\"There was a problem!\"\
  , when:new Date()};`\n\n\n\n\n\n当你说你可以处理异常时，我的意思是你可以在异常发生时对其进行“捕获（trap）”，而不是让它们层层冒泡到顶层并报告给用户，你可以选择抑制它们或采取其他行动来修正问题。你通过使用\
  \ `try .. catch .. finally` 结构来处理异常。许多其他语言也支持类似，包括 `C++`、`Java` 和 `C#`。其通用语法如下：\n\
  \n```javascript\ntry {\n    tryStatements\n}\ncatch(exception) {\n    catchStatements\n\
  }\nfinally {\n    finallyStatements\n}\n```\n\n在 JavaScript 1.5 (Netscape 6+ 和 Firefox\
  \ 1+) 中，增加了对多个 catch 子句的额外支持，以及条件 catch 子句。这允许开发者构建仅在特定情况下触发的 catch 子句。到目前为止，这并不是官方\
  \ ECMAScript 规范的一部分，也没有被其他解释器通用的支持。这里描述的标准语法仍然被所有现代浏览器支持，如果担心兼容性，则应该使用它。\n\n`tryStatements`\
  \ 内部的代码块是正在处理异常的代码块。如果发生异常，`try` 块中的执行将立即终止，并开始执行 `catch` 子句。只有当 `try` 块出现异常时，`catch`\
  \ 子句才会执行。可选的 `finally` 块保证在任何情况下都会执行，无论是否发生异常，但如果发生了异常，它会在最后执行，在 `catch` 块完成后执行。`catch`\
  \ 子句中的异常是你必须定义的标识符，以便你能够访问异常中的信息。\n\n`finally` 块不是必须的，但如果你有一些“清理”代码，希望无论 `try` 块发生了什么都可能执行这些代码，那么它很有用。例如，假设你用\
  \ JavaScript 写了一个文字处理器。你可以将所有应用程序代码封装在一个大的 `try` 块中，以防程序执行过程中某处出现错误。如果发生了错误，你可以使用\
  \ `finally` 块来确保能够强制将文档保存回服务器作为备份。\n\n在下面的示例中，当你尝试访问一个不存在的对象的方法时，你使用 `try .. catch\
  \ .. finally` 来优雅地报告错误：\n\n```javascript\n// try catch finally 的示例\ndocument.write(\"\
  Here is the contents of your page: <br />\");\n\ntry {\n    for (var i = 5; i >\
  \ -5; i--) {\n        document.write(document.blody.innerHTML);\n    }\n} catch\
  \ (err) {\n    document.write(\"There was an error: \" + err.message + \"<br />\"\
  );\n} finally {\n    document.write(\"You should see this text regardless.\");\n\
  }\n```\n\n在 Firefox 中，这将输出以下：\nHere is the contents of your page:\nThere was an\
  \ error: TypeError: document.blody is undefined\nYou should see this text regardless.\n\
  \n`try .. catch` 有趣的地方在于，它在复杂的调用栈中工作得非常好。如果你愿意在调用栈的最顶端放置一个处理器（不推荐，但你可以这样做），你就不需要在整个文档中编写大量的异常处理器。例如，来看以下代码段：\n\
  \n```javascript\n// 调用栈如何与 try catch 工作\nfunction throwSomeError () {\n    throw\
  \ \"My Custom Error!\";\n}\n\nfunction masterFunction() {\n    throwSomeError();\n\
  }\n\ntry {\n    masterFunction ();\n} catch(e) {\n    document.write(e.toString());\n\
  }\n```\n\n在这个示例中，我有两个函数：`throwSomeError()` 和 `masterFunction()`。在代码段的底部，我调用了 `masterFunction()`，它反过来调用了\
  \ `throwSomeError()`。在这里，通过使用 `throw`，我在一个甚至没有 `try .. catch` 处理器的函数中创建了一个异常。然而，因为我在对\
  \ `masterFunction()` 的初始调用包裹了一个处理器，解释器能够向上爬取调用栈并找到它，因此它被优雅地处理了。如果运行此代码段将生成以下输出：\n\
  My Custom Error!\n\n# 杂项语句 (Miscellaneous Statements)\n\nJavaScript 中还有两个语句值得提及，但似乎不属于其他类别。这些是\
  \ `var` 和 `with`。\n\n## var\n我在第 3 章介绍变量时已经讨论过 `var` 语句。你已经学习了它被用于显式声明一个或多个变量，你还可以在相同类型中实例化它们。总结一下，`var`\
  \ 的语法如下：`var identifier [ = value] [, identifier2 [ = value2]] [...];`\n\n以下是不同方式使用\
  \ `var` 的一些示例：\n\n```javascript\nvar myVar;\nvar myInt = 19;\nvar myMath = 10 +\
  \ myInt;\nvar firstName = \"Alexei\", lastName = \"White\";\nfor (var i = 0; i <\
  \ 100; i++) ;\n```\n\n最后一行显示了你在 `for` 循环中使用 `var` 来实例化变量，这是一个常见的做法。使用 `var` 声明变量也有助于你明确变量的作用范围。例如，在下面的示例中，有两个名为\
  \ `myVar` 的变量。它们是隔离且互不干扰的，因为它们在不同的作用域中使用 `var` 显式定义：\n\n```javascript\nvar myVar\
  \ = 10;\n\nfunction myFunct () {\n    var myVar = \"Hello world\";\n    document.write\
  \ (\"myVar in myFunct () : \" + myVar + \"<br />\");\n}\n\nmyFunct () ;\ndocument.write\
  \ (\"myVar in global scope: \" + myVar + \"<br />\");\n```\n\n这将产生输出：\nmyVar in\
  \ myFunct () : Hello world\nmyVar in global scope: 10\n\n## with\nJavaScript 中不为人知的关键字和语句是\
  \ `with`。它本质上扩展了特定对象的作用链，让你能够像访问本地成员一样访问其成员。简而言之，在处理像 `document.body` 这样长的对象时，它可以让你少写代码。它的工作原理是在评估包含方法或属性的表达式时首先检查该对象，然后再检查作用链的其他部分。`with`\
  \ 的通用语法是：`with (object) statement`\n\n例如，你可以用以下方式更改文档的某些样式：\n\n```javascript\n//\
  \ 使用 with 简化重复使用对象名称的代码\nwith (document.body.style) {\n    backgroundColor = \"\
  green\";\n    fontSize = \"30px\";\n    fontFamily = \"Courier, monospace\";\n}\n\
  ```\n\n这等同于编写：\n```javascript\ndocument.body.style.backgroundColor = \"green\";\n\
  document.body.style.fontSize = \"30px\";\ndocument.body.style.fontFamily = \"Courier,\
  \ monospace\";\n```\n\n虽然这看起来很方便，但有几个理由建议考虑不要使用 `with` 语句：\n- 由于使用 `with` 重新路由了自然作用链，当使用不在对象中的方法和变量名时，解释器的搜索可能花费更多时间，从而导致你的程序运行较慢（尽管非常轻微）。\n\
  - 虽然使用 `with` 编写代码可能更容易，但更难读。对于代码的普通读者来说，可能不清楚哪些对象是通过 `with` 对象访问的，哪些是在作用链的其他地方找到的。\n\
  - 如果你引用了既出现在 `with` 语句使用的对象中，又出现在作用链其他地方的标识符，它可能会导致一些不可预测的结果。如果你忘记在你的对象中使用该变量，解释器将突然开始使用作用链中较高位置的变量，无疑会导致程序逻辑错误。\n\
  \n为了透明起起见，你也可以如下所示编写相同的代码块：\n\n```javascript\nvar dbs = document.body.style;\ndbs.backgroundColor\
  \ = \"green\";\ndbs.fontSize = \"30px\";\ndbs.fontFamily = \"Courier, monospace\"\
  ;\n```\n这与使用原始的 `with` 快捷方式一样简单。\n\n\n\n\n\n本章探索了 JavaScript 中的几个新主题。总结来说，你学习了：\n\
  - 表达式（Expressions）是任何有效的变量、字面量和运算符的集合，可以解析为单个值。你在条件语句中广泛使用它们，并用它们影响变量。\n- 有六大类型的运算符。由于\
  \ JavaScript 的动态类型特性，它们与数据的交互可能会产生不同的结果，这取决于使用的数据类型和所应用的操作。\n- 运算符具有可预测的从左到右结合性和脚本执行优先级。这告诉你如何构建表达式，以便它们按照你设想的模式执行。\n\
  - JavaScript 支持大量且相当标准的语句集。这些包括条件语句；循环和迭代语句；创建函数和返回值的语句；异常处理语句以及其他几种。\n\n在第 5 章中，我将开始深入讨论函数，函数是离散且可重用的代码块，用于执行特定任务。我将涉及到作用域、返回值、重载和闭包。\n\
  \n## 函数 (Functions)\n\n在这个阶段，你已经在之前章节的示例和讨论中遇到过函数。如果你熟悉另一种编程语言，你对这个概念无疑并不陌生。和其他语言一样，JavaScript\
  \ 的处理方式略有不同，所以如果这描述了你——别担心；你可能会学到一些以前不知道的东西。\n\nJavaScript 函数的有趣之处在于，与其他语言的函数相比，它们的功能相当有限——但同时也有一些特性让它们变得极其强大。例如，正如你很快看到的，虽然你不能在传统意义上重载\
  \ JavaScript 函数，但你可以在运行时动态更改它们，甚至在程序开始运行后创建新函数。JavaScript 的动态性质延伸到了你处理函数的多种方式。\n\
  \n## 函数对象 (The Function Object)\n\nJavaScript 中的所有函数都是一类对象（first class objects），这意味着它们像任何其他对象引用一样被传递。事实上，无论如何创建，函数都是一个名为（名副其实地）`Function`\
  \ 的全局对象的实例。这意味着你代码中的每个函数都可以访问某些方法和属性，并可以像对象一样被处理。在附录 B 中，我将详细介绍这些方法和属性。现在，这里有一个快速参考。请记住，并不是所有的成员在所有\
  \ JavaScript 解释器中都可用。兼容性信息请参见附录 B。\n\n![051](img/whit_9780470550502_oeb_051_r1.gif)![052](img/whit_9780470550502_oeb_052_r1.gif)\n\
  \n## 声明函数 (Declaring Functions)\n\n在现代 JavaScript 中，除了你目前看到的这种方法外，还有几种定义或声明函数不同方法。理解这种灵活性的关键在于，从根本上你处理的是对象。像大多数对象一样，它们可以随时被创建、销毁和修改。\n\
  \n定义函数最基本的方法也是自 JavaScript 第一版本以来一直受支持的方法。就是使用第 4 章描述的函数语句。语法如下：\n\n```javascript\n\
  function functionName([argname1 [, ...[, argnameN]]])\n{\n    statements;\n}\n```\n\
  \n在选择函数名时，请记住第 2 章描述的标识符命名规则。此外，确保避开保留关键字（见附录 E）。通常，你还应该采用一致的命名规范。对于函数，有时习惯使用一种被称为\
  \ `lowerCamelCase`（小驼峰命名法）的大写形式，涉及复合单词。第一个单词以小写字母开头，所有后续单词以大写字母开头。关于命名规范的更多信息，请务必查看第\
  \ 23 章。\n\n你还可以定义任意数量的参数（arguments），这些参数作为局部变量传递给函数。这些参数可以在函数内部访问，并且可以是任何类型——甚至是对其他函数的引用。\n\
  \n// 使用函数语句声明函数\n```javascript\nfunction writeln(message) {\n    // 首先我们检查参数是否存在\n\
  \    if (message)\n        document.write(message + \"<br />\");\n    // 现在我们已经使用\
  \ document.write 将其写入文档，并添加了换行符\n}\n\nwriteln(\"Hello world!\"); // \"Hello World!\"\
  \n```\n\n当你用这种方式创建函数时，它们会被添加到全局对象，这意味着可以从任何地方访问。在浏览器中，可以通过输入简单的 `writeln()` 或 `window.writeln()`\
  \ 来访问此处所示函数。在浏览器模型中，`window` 对象是全局上下文。稍后你将查看嵌套函数，它们被附加到备用的激活对象或上下文。\n\n前面的示例创建了一个函数，它封装了一个简单的\
  \ `document.write()` 函数调用，用于输出消息和换行符。你可以用其他几种方式表示这个函数。另一种方法是使用第 4 章演示的函数字量形式。例如：\n\
  \n// 使用函数字量符号声明函数（一个“匿名”函数）\n```javascript\nvar writeln = function(message) {\n\
  \    // 首先我们检查参数是否存在\n    if (message)\n        document.write(message + \"<br />\"\
  );\n}\n\nwriteln(\"Hello world!\"); // \"Hello World!\"\n```\n\n这也称为匿名函数（anonymous\
  \ function）。“匿名”一词是指它不一定有名称。此函数可以访问包含函数中所有的方法和属性。你可以将匿名函数传递给另一个函数，而无需给它命名，如下例所示：\n\
  \n```javascript\nfunction addTwo(myNum, otherMath) {\n    myNum += 2;\n    if (otherMath)\n\
  \        myNum = otherMath(myNum);\n    return myNum;\n}\n\ndocument.write(addTwo(3,\
  \ function(x) { return x*3 })); // 15\n```这与嵌套函数的概念密切相关，你将会学习。声明函数的最后方法是使用 `Function`\
  \ 对象构造函数。记住，函数像每个数据类型一样都是对象。`Function` 类有一个构造函数使用以下不寻常的语法：`functionName = new Function([param1Name,\
  \ param2Name,...paramNName], functionBody);`。参数名必须作为字符串传递。如果你用这种方法重写我们的 `writeln()`\
  \ 函数，看起来是这样的：\n\n```javascript\n// 使用 Function 类构造函数声明函数\nvar writeln = new Function(\"\
  message\", \"if (message) document.write(message + '<br />');\");\n\nwriteln(\"\
  Hello world!\"); // \"Hello World!\"\n```\n\n## 值传递与引用传递 (Passing Arguments by Value\
  \ versus Reference)\n\n正如 3 章所述，这些将按值或引用传递给函数，取决于变量是基本类型还是引用类型。当你将基本数据类型传递给函数时，你无法在函数外部更改它的值，但当你对复合或引用数据类型执行相同操作时，你会修改它们的原始值，如下例：\n\
  \n```javascript\nvar myNum = 100;\nvar myObj = {name: 'David', age:12};\n\nfunction\
  \ changeVals(num, obj) {\n    num = 0;\n    obj.name = \"Changed\";\n}\n\nchangeVals(myNum,\
  \ myObj);\n\ndocument.write(myNum + \"<br />\"); // \"100\"\ndocument.write(myObj.name\
  \ + \"<br />\"); // \"Changed\"\n```\n\n这将输出以下文本：\n100\nChanged\n\n\n\n\n\n如果所有数据类型的行为都相同，你可能会期望结果是\
  \ 0 或 Changed，或者 100 或 David 之一。由于 `Number` 是原始类型，而 `Object` 是引用类型，它们在这方面的表现有所不同。总结一下，通过*值*传递的原始数据类型有：\n\
  * `Number`\n* `String`\n* `Boolean`\n* `null`\n* `undefined`\n\n而仅通过*引用*传递的引用数据类型有：\n\
  * `Object`\n* `Array`\n* `Function`\n* `Date`\n* `RegExp`（正则表达式）\n* `Error`（及其子类型）\n\
  \n# 返回值\n\n所有函数都会返回一个值。你可以使用 `return` 语句有选择地控制返回什么值（如第 3 章所述）。如果未指定 `return` 语句，则会改为返回一个自动值\
  \ `undefined`。请注意，每当你调用 `return` 时，函数的执行会立即停止，即使函数中还有更多代码需要执行。以下函数返回一个一个的 `Number`\
  \ 值：\n\n```javascript\n// Returning values from functions\nfunction addTwoNumbers\
  \ (x,y) {\n    return (x + y);\n}\n\ndocument.write( addTwoNumbers (9,3) );    \
  \ // \"12\"\n```\n\n记住，函数可以返回的内容具有极大的灵活性。例如，你可以返回一个文档对象引用，甚至像下面的示例一样返回任意对象：\n\n\
  ```javascript\n// Returning a complex object\nfunction addTwoNumbers (x,y) {\n \
  \   return {result:(x+y), originalX: x, originalY: y};\n}\n\nvar sumResult = addTwoNumbers\
  \ (9,3) ;\ndocument.write(\"Sum: \" + sumResult.result + \" (comes from adding \"\
  \ + sumResult.originalX + \" and \" + sumResult.originalY + \")\");\n// \"Sum: 12\
  \ (comes from adding 9 and 3)\"\n```\n\n## 变量作用域\n\n变量的*作用域*是指程序可以直接访问它的部分。讨论隐式与显式变量声明时，我已经提到过这个概念。当变量被显式定义时，它们被程序的所有部分访问——因此它们具有*全局作用域*。如果变量的作用域限制在它的函数内部，它具有*局部作用域*。变量所属的作用域被称为它的*上下文*。属于\
  \ `window` 或全局对象的变量也具有全局上下文。很让人困惑对吧？我将尝试通过一些示例来澄清这种情况。\n\n全局上下文包含许多可以被程序任何部分访问的对象。当你创建一个全局变量时，它会加入一组处于同一层级的其他方法和属性中。其中一些是\
  \ JavaScript 语言的原生部分，另一些则是仅因为你在特定的网络浏览器中工作而存在的浏览器扩展。有关这些内置成员的更多信息，请参阅第 6 章。\n\n\
  ```javascript\nvar a = \"apple\";\n\nfunction myFunct () {\n    var a = \"book\"\
  ;\n    document.write(a + \"<br />\"); // \"book\"\n}\n\nmyFunct ();     // \"book\"\
  \ndocument.write(a + \"<br />\"); // \"apple\"\n```\n\n这段代码段的输出将如下：\nbook\napple\n\
  \n要理解为什么这样，首先要了解解释器是如何执行作用域的。在你的代码中，当调用 `myFunct()` 时，它声明了 `a`。当你引用 `a` 时，它首先检查局部作用域。如果没有找到，它将沿层次结构向上移动直到到达全局作用域。这就是为什么当\
  \ `myFunct()` 结束时，变量 `a` 保持未受影响。\n\n（注：提供的文本在作用域部分包含大量的重复和乱码字符串，我已处理了核心逻辑并清理了提供的功能代码示例。）\n\
  \n\n\n\n\n// 我们看到对 `threeArguments` 的引用已经被重写了。你可以看到，当你到达实际调用该函数的代码行时，包含三个参数的 `threeArguments()`\
  \ 原始描述已经被覆盖了（参见图 5-1）。图 5-1![053](img/whit_9780470550502_oeb_053_r1.gif)记住，像 `threeArguments`\
  \ 这样的函数指针并不实际上包含函数的所有数据。它们只包含内存中存放函数的实际位置的*引用*。当你像前一个示例那样删除函数引用时，你实际上是在重写包含该函数的原始内存位置。相反，你可以使用匿名函数指针在内存中创建一个新函数，将其分配给原始指针，并保留对旧函数的引用。为了证明这一点，我将在重写旧指针之前通过将指针复制到另一个变量来创建一个某种*备份*。再次，这是可能的因为当你使用匿名函数时，你完全为该对象分配了新的内存。\n\
  \n## 备份函数引用，然后删除原始引用\n\n```javascript\nfunction threeArguments (a, b, c) {\n   \
  \ return \"expect 3 arguments: \" + a + \", \" + b + \", \" + c;\n}\n\n// 对引用进行备份\n\
  var threeBackup = threeArguments;\n\n// 现在我们尝试重载函数\nthreeArguments = function(a,b,c,d)\
  \ {\n    return \"expect 4 arguments: \" + a + \", \" + b + \", \" + c + \", \"\
  \ + d;\n}\n\n// 现在我们尝试使用第一个版本\ndocument.write(threeArguments (1, 2, 3)); // expect\
  \ 4 arguments: 1, 2, undefined\n\n// 现在我们尝试使用备份\ndocument.write(threeBackup (1,\
  \ 2, 3)); // expect 3 arguments: 1, 2, 3\n```\n\n我们看到对 `threeArguments` 的原始引用被保留了。这段代码片段的输出如下：\n\
  expect 4 arguments: 1, 2, undefined\nexpect 3 arguments: 1, 2, 3\n\n我们模拟这种交互的图参见图\
  \ 5-2。图 5-2![054](img/whit_9780470550502_oeb_054_r1.gif)\n\n虽然我已经证明了并不直接支持真正的重载，但仍有一些技术可以实现与重载相同的*效果*。我已经展示了函数在响应中不需要返回一致的数据类型。这意味着你可以根据提供的参数来更改函数的返回值。这满足了多态函数的目标之一。另一个目标——动态参数定义，可以通过利用其他几个功能来实现：可选参数和\
  \ `arguments` 对象。\n\n## 可选参数\n\nECMAScript 规范中明显缺失的另一个特性是*可选参数*。在 PHP 和 C++ 等其他语言中，你有能力定义函数预期的参数，但如果没有提供它们，它们将使用默认值进行实例化。与\
  \ C# 一样，JavaScript 不允许你在函数定义中这样做。然而，如果你在调用函数时忽略了某些参数，解释器不会将其视为语法错误。你可以利用这一事实来模拟可选参数。\n\
  \n### 在函数中模拟可选参数\n\n```javascript\nfunction addFiveNumbers (a,b,c,d,e) {\n    var\
  \ result = 0;\n    if (a) result += a;\n    if (b) result += b;\n    if (c) result\
  \ += c;\n    if (d) result += d;\n    if (e) result += e;\n    return result;\n\
  }\n\ndocument.write (addFiveNumbers (1,2,3)); // 6\n```\n\n在前面的示例中，你有一个有一个期望五个参数（`a,b,c,d,e`）的函数。当你调用底部的函数时，你只提供了五个中的三个。JavaScript\
  \ 解释器会传递这三个参数，并为剩下的两个赋值为 `undefined`。使用第 3 章描述的*类型转换*原则，`undefined` 的值在作为布尔值测试时被求值为\
  \ false。在构建输出 `result` 时，你只需通过 `if (var)` 来测试所有参数是否已定义。或者，如果对我们有帮助，你可以为这些变量分配默认值，如下面\
  \ `addFiveNumbers()` 函数的修改所示。\n\n### 一种更简洁的可选参数默认值方法\n\n```javascript\nfunction\
  \ addFiveNumbers(a,b,c,d,e) {\n    if (!a) a = 0;\n    if (!b) b = 0;\n    if (!c)\
  \ c = 0;\n    if (!d) d = 0;\n    if (!e) e = 0;\n    return a + b + c + d + e;\n\
  }\n```\n\n再次，在这里你测试变量是否未定义（使用布尔非 `!`）。如果结果为真，你就会创建一个同名的局部变量，当你到达 `return` 行时，每个参数都已定义，并且有一个默认值（如果尚未可用）。最后，你可以用一种更简单但可读性较低的方式来表达这种逻辑。基于我们的类型转换原则，你可以采取以下操作：\n\
  \n### 一种更简洁且高效的可选参数默认值方法\n\n```javascript\nfunction addFiveNumbers(a,b,c,d,e) {\n\
  \    a = a || 0;\n    b = b || 0;\n    c = c || 0;\n    d = d || 0;\n    e = e ||\
  \ 0;\n    return a + b + c + d + e;\n}\n```\n\n这里的原理是相同的。当评估表达式 `a || 0` 时，解释器会“a\
  \ 或零”。如果 `a` 是 `undefined`，它求值为 false，并将零赋值给 `a`。这对于每个参数都会重复一次。这种方法的优点是性能。通过不需要评估条件，你减少了执行的指令数量。\n\
  \n在本章的开头，我提到了*作用域链*以及当解释器找不到变量时将如何沿着作用域链向上爬。如果这是真的，你可能会担心一个恰好名为 `d` 的全局变量可能会干扰前面的示例，因为这在测试\
  \ `d` 时会对使用哪个变量产生歧义。幸运的是，当你在函数调用中省略变量时，它们仍然被声明为局部变量，但它们并没有被*初始化*。这意味着解释器只会检查被识别为\
  \ `d` 的参数，而不会进入作用域链寻找同名的全局变量——即使你没有在调用中包含该变量。\n\n\n\n\n\n`arguments` 对象是所有函数的一个本地属性。它本质上是一个类似于\
  \ `Array` 的对象，保存了传递给函数的所有参数——无论这些参数是否在函数定义中出现。我将在第 9 章中详细讨论数组的语法，但 `arguments` 对象只是*看起来*像一个\
  \ `Array`——它并不具备许多 `Array` 类的属性。目前，只需要知道要访问典型 `Array` 的元素，你可以使用括号运算符 `[ ]`。这些参数在数组中的顺序与它们传递给函数的顺序相同。要访问第一个元素，可以使用\
  \ `arguments[0]`。第二个参数可以使用 `arguments[1]` 访问，以此此类推。你可以通过查看 `arguments.length` 来了解参数的总数。\n\
  \n// 使用 arguments 对象读取传递给函数的任何所有参数\n```javascript\nfunction myFunction() {\n  for\
  \ (var i = 0; i < arguments.length; i++) {\n    document.write(i + \": \" + arguments[i]\
  \ + \"<br />\");\n  }\n}\n\nmyFunction(\"Hello\", 21, new Date());\n```\n\n根据上一个示例中传递的参数，将生成以下输出：\n\
  0: Hello\n1: 21\n2: Tue Dec 02 2008 10:57:08 GMT-0800 (PST)\n\n仅依赖 `arguments` 对象，你可以提供比上一一节描述的可选参数技术更优函数伪重载（pseudo-overloading）。缺点是，从视觉上看，函数的*接口*是什么样的并不那么直观，而且对我们的代码进行内省的\
  \ IDE 无法提供智能提示（intellisense）。像 JSDoc 这样的文档工具也无法自动生成函数接口的文档。以下使用 `arguments` 对象进行伪重载的简单示例：\n\
  \n```javascript\n// 使用 arguments 对象进行伪重载\nfunction saveData() {\n  if (arguments.length\
  \ == 2) {\n    // 这是一种保存行为\n  } else if (arguments.length == 4) {\n    // 这是另一种类型\n\
  \  }\n}\n```\n\n# 参数哈希 (Argument Hashes)\n\n另一种向函数传递参数的方法是，它不仅能让你设置默认值，还能提供重载能力。这种方法涉及使用一个包含*哈希*（hash）、*关联数组*或对象的单一参数。由于其高效性、易用性和灵活性，这种方法比其他技术越来越受欢迎。\n\
  \n虽然 JavaScript 中实际上没有名为 `hash` 的特定数据类型，但我的真实意思是使用一个普通对象来存储一组键值对。在第 3 章中我涵盖了*对象字面量*（object\
  \ literals），它们看起来像这样：\n`var myObj = {name:'Jimmy', age:12, height: '180cm' };`\n\
  在第 9 章和第 10 章，我将更详细地讨论对象和数组。现在我将基于你已经知道的知识，即对象可以使用这种字面表示法来描述。使用前面的示例，你可以这样访问 `myObj`\
  \ 的 `age` 属性：`myObj.age`。如果你使用对象的键/值对作为参数，可以用多个参数替换单个参数，如下例所示：\n\n// 使用对象哈希向函数发送任意参数。\n\
  ```javascript\nfunction describeBook(args) {\n  document.write(\"Name: \" + args.name\
  \ + \"<br />\");\n  document.write(\"Pages: \" + args.pages + \"<br />\");\n  document.write(\"\
  Chapters: \" + args.chapters + \"<br />\");\n  document.write(\"Author: \" + args.author\
  \ + \"<br />\");\n  document.write(\"Publish Date: \" + args.published + \"<br />\"\
  );\n  document.write(\"Type: \" + args.type + \"<br />\");\n  document.write(\"\
  Section: \" + args.section + \"<br />\");\n}\n\ndescribeBook({name: 'Gone with the\
  \ Wind', pages:1021, chapter:22, author: 'Margaret Mitchell', published: '1936',\
  \ type: 'Paperback', section: 'Historical Fiction' });\n```\n\n这种方法与上一一节描述的 `arguments`\
  \ 方法相比具有明显的优势。如果你使用 `arguments` 对象，必须按照非常特定的顺序提供参数，否则函数将无法知道哪些参数映射到哪些数据。通过使用对象字面量，它们的顺序并不重要，因为每个值都映射到一个特定的键，并可以使用点表示法访问。重用前两节介绍的方法，你可以通过检查可用哪些特定属性并采取相应操作来使此函数重载。例如，在\
  \ `describeBook()` 示例中，你可以检测某些属性是否可用并仅显示这些：\n\n// 使用参数哈希进行简单重载\n```javascript\n\
  function describeBook(args) {\n  if (args.name)\n    document.write(\"Name: \" +\
  \ args.name + \"<br />\");\n  if (args.pages)\n    document.write(\"Pages: \" +\
  \ args.pages + \"<br />\");\n  if (args.chapters)\n    document.write(\"Chapters:\
  \ \" + args.chapters + \"<br />\");\n  if (args.author)\n    document.write(\"Author:\
  \ \" + args.author + \"<br />\");\n  if (args.published)\n    document.write(\"\
  Publish Date: \" + args.published + \"<br />\");\n  if (args.type)\n    document.write(\"\
  Type: \" + args.type + \"<br />\");\n  if (args.section)\n    document.write(\"\
  Section: \" + args.section + \"<br />\");\n}\n\ndescribeBook({name: 'Gone with the\
  \ Wind', author: 'Margaret Mitchell', section: 'Historical Fiction'});\n```\n\n\
  这种方法虽然有效，但如果不阅读每行代码，几乎无法为开发者提供关于哪些参数是可以接受的提示。它也没有提供任何默认值机制。能够指定默认值对于我们函数的正确运行可能至关重要。幸运的是有一种简单的方法可以将\
  \ `args` 对象与一组默认值合并，且既简洁又易读：\n\n```javascript\n// 将参数对象与包含默认值的对象合并\nfunction describeBook(args)\
  \ {\n  var fArgs = defaults({\n    name: 'Unknown',\n    pages: 1,\n    chapters:\
  \ 1,\n    author: 'John Doe',\n    published: 'Unknown',\n    type: 'Paperback',\n\
  \    section: 'Unclassified Books'\n  }, args);\n  document.write(\"Name: \" + fArgs.name\
  \ + \"<br />\");\n  document.write(\"Pages: \" + fArgs.pages + \"<br />\");\n  document.write(\"\
  Chapters: \" + fArgs.chapters + \"<br />\");\n  document.write(\"Author: \" + fArgs.author\
  \ + \"<br />\");\n  document.write(\"Publish Date: \" + fArgs.published + \"<br\
  \ />\");\n  document.write(\"Type: \" + fArgs.type + \"<br />\");\n  document.write(\"\
  Section: \" + fArgs.section + \"<br />\");\n}\n\n// 确保对象包含一组特定的\n// 键/值对并带有默认值\n\
  function defaults(defaultValues, originalArgs) {\n  // 确保我们处理的是有效对象\n  if (originalArgs\
  \ && typeof originalArgs == \"object\")\n    for (var arg in originalArgs)\n   \
  \   defaultValues[arg] = originalArgs[arg] || defaultValues[arg];\n  // 输出新对象而不修改原始对象\n\
  \  return defaultValues;\n}\n```\n\n\n\nsection: 'Historical Fiction' }) ;此示例中的一些内容是新的。同样，你是在向\
  \ `describeBook()` 传递一个对象，而不是一组参数。然而，现在你在函数内部创建了一个名为 `fArgs`（代表“final arguments”，最终参数）的新对象，并使用一个名为\
  \ `defaults()` 的新函数将一个包含我们所有必需属性和默认值的对象字面量与我们的 `args` 对象合并。\n\n至关重要的是记住，对象是*引用类型*。如果你向函数传递一个对象引用并修改该对象，更改将应用到原始对象上。这在本章的前面已经解释过。这种特的意义在于，你被迫创建一个*新*对象（`fArgs`），以避免在为函数应用默认值的过程中修改原始对象。\n\
  \n在你的新函数 `defaults()` 中，你接受两个参数：`defaultValues`，这是一个包含所有你希望确保存在且具有初始值的属性的对象；以及 `originalArgs`，它是传递给原始函数的实际参数对象。同样，在\
  \ `defaults()` 中，你只修改 `defaultValues`（这是一个新对象），以避免永久修改原始对象。接下来，在行 `if (originalArgs\
  \ && typeof originalArgs == \"object\")` 中……你检查确保参数对象不为空且它是一个对象*类型*（使用 `typeof`\
  \ 运算符）。最后，你使用后续部分中的 `for .. in` 迭代器遍历参数值：\n\n```javascript\nfor (var arg in originalArgs)\
  \ {\n    defaultValues[arg] = originalArgs[arg] || defaultValues[arg] ;\n```\n\n\
  在每次迭代中，属性名（*key / value* 中的 **key*）被赋值给变量 `arg`。在第 9 章中，我展示了如何使用此处看到的方括号符号将此类对象当作数组。目前，你只需要知道\
  \ `originalArgs.name` 等同于 `originalArgs[\"name\"]`。这就是你能够动态检查对象是否存在自定义属性的方法。`(originalArgs[arg]\
  \ || defaultValues[arg])` 语句简单意味着，如果从 `originalArgs` 中没有找到 `arg`，则改用 `defaultValues`\
  \ 中的值。通过这种方式，你将 `originalArgs` 中包含的所有值合并到 `defaultValues` 中。如果缺少任何属性，你将保留默认版本。\n\
  \n最后，你所做的是合并了一组用于你函数的参数，并且你可以保证这些参数至少有一个默认值。如果你愿意，甚至可以扩展你的 `defaults()` 方法来对每个默认值进行类型检查，并确保你的对象在类型和属性上都符合定义。目前，上述示例的输出将是：\n\
  Name: Gone with the Wind\nPages: 1\nChapters: 1\nAuthor: Margaret Mitchell\nPublish\
  \ Date: Unknown\nType: Paperback\nSection: Historical Fiction\n\n## 嵌套函数\n\n由于函数是一等公民对象，因此你能够很容易地在函数*内部*创建函数。这被称为函数*嵌套*。考虑以下示例：\n\
  \n```javascript\n// Nesting functions\nfunction addSquare(a,b) {\n    function multiply(x,y)\
  \ {\n        return x*y;\n    }\n    return multiply((a+b),(a+b));\n}\n\ndocument.write(\
  \ addSquare(3,4) );    // 49\n```\n\n此示例中的嵌套函数 `multiply(x,y)` 形成了一个*闭包（closure），这意味着它继承了包含它的函数或对象的方法和属性。内部对象是外部函数作用域的*扩展*。值得注意的是，虽然内部函数可以访问外部函数的局部变量，但反之则不然。此外，内部函数*只能*从外部函数访问——它在全局上下文中无法访问。\n\
  \n```javascript\n// Demonstrating the scope properties of closures\nfunction addFive(theVal)\
  \ {\n    function addNumber(howmany) {\n        return theVal+howmany;\n    }\n\
  \    return addNumber(5);\n}\n\ndocument.write( addFive(15) );    // 20\n```\n\n\
  在这个示例中，你可以从闭包 `addNumber()` 访问局部变量 `theVal`，因为 `addFive()` 的作用域扩展到了嵌套函数 `addNumber()`。\n\
  \n## 闭包\n\n在上节中，我提到了*闭包*。这个想法需要更详细的解释。在上一节中，我展示了嵌套函数如何访问父函数的属性。闭包是它们实现此点的机制。每当你创建一个引用其即时作用域之外属性的函数时，就会形成闭包。来看以下示例：\n\
  \n```javascript\n// A simple example of a closure\nfunction greetMe(name) {\n  return\
  \ function(greeting) {\n    return greeting + \" \" + name;\n  }\n}\n\nvar greetAlexei\
  \ = greetMe(\"Alexei\");\ndocument.write( greetAlexei(\"Hello\") ); // \"Hello Alexei\"\
  \n```\n\n这个示例的有趣之处在于，我从 `greetMe()` 返回了一个匿名函数的引用，并将其赋值给变量 `greetAlexei`。尽管包含局部变量\
  \ `name` 引用的上下文在函数终止后应该消失，当我调用 `greetAlexei(\"Hello\")` 时，它仍然存在且运行完好。这是通过我在匿名函数内部引用变量\
  \ `name` 时创建的闭包所实现的。如果你感到困惑，请再次查看代码示例。有两个函数，一个嵌套在另一个内部。在内部函数（没有名称）中，它引用了仅在外部函数可用的变量（name`）。闭包是该函数存在的环境，以便访问本不该存在的变量。\n\
  \n## 闭包的用途\n\n在本书的后后部分，你将反复看到闭包的使用。它们提供了一种方便的方法，可以在程序中传递执行代码、控制执行代码的上下文并避免使用 `eval()`（用于执行字符串代码）带来的混乱和风险。闭包的实际用途从简单到极其复杂。以下是一些常见的用途。\n\
  \n## 清理求值代码\n\n在处理事件时，你通常希望响应鼠标点击、按键或其他情况执行一段特定的代码。有时，你只是想在一段时间后执行某些代码。实现此点的非常简单的方法是使用\
  \ `setTimeout()` 方法：\n\n```javascript\nfunction putTextInLater(objID, text, timedelay)\
  \ {\n    setTimeout(\"document.getElementById('\" + objID + \"').innerHTML='\" +\
  \ text + \"'\", timedelay);\n}\n\nputTextInLater('myDiv', \"Hello!\", 500);\n```\n\
  \n这个示例函数将在 500 毫秒后执行由表达式 `\"document.getElementById('\" + objID + \"').innerHTML='\"\
  \ + text + \"'\"` 的字符串。为什么这样做不好？首先，它*慢*。解释器为了执行字符串的内容，必须分配大量内存动态编译代码块。另一个，它很*乱*。你本质上在使用字符串操作编写源码。这使得你的\
  \ IDE 难以为你提供帮助，视觉上也难以追踪。幸运的是，闭包可以帮助你：\n\n```javascript\n// A nice way to use closures\
  \ with setTimeout\nfunction putTextInLater(objID, text, timedelay) {\n    setTimeout(function()\
  \ {\n        document.getElementById(objID).innerHTML = text;\n    }, timedelay);\n\
  }\n\nputTextInLater('myDiv', \"Hello World!\", 500);\n```\n\n## 函数工厂\n\n基于闭包对已不存在的作用域内的变量具有永久访问权限的这一观点，你可以使用它们为特定目的预配置复杂的函数，而无需在程序中添加许多额外代码。在以下示例中，你通过预填充另一个函数所需的输入，创建了一个简单的将数字乘以十的函数：\n\
  \n```javascript\n// A function factory that multiplies numbers\nfunction multiplyFactory(multiplier)\
  \ {\n    return function(amount) {\n        return amount*multiplier;\n    }\n}\n\
  \nvar timesTen = multiplyFactory(10);\n```\n\n\n\n\n```javascript\ndocument.write(\
  \ timesTen(4) ); // 40\n```\n当你将 `mulitplyFactory(10)` 的结果赋值给 `timesTen` 时，你基本上是在预先配置\
  \ `multiplyFactory` 的使用，专门用于乘以 10 的目的。这简化了你的程序，并且如果你需要更改使用该方法的大块代码的特定配置，它会更容易修改。\n\
  \n## 模拟私有方法\n\n在第 10 章中，我将更详细地讨论面向对象的开发，但通过闭包，你现在就可以模拟私有方法的概念（即仅供该对象内部其他函数访问的函数）。虽然\
  \ JavaScript 支持具有实例方法的对象，但目前没有简单的方法让方法变成私有的，或者说，从该对象的公共接口中隐藏它们。你可能想这样做是为了减少命名空间的污染，并保持你的公共接口尽可能简洁精炼。\n\
  \n让我们想象一个假设的情景：你想使用数组来提高字符串操作的性能。在第 4 章中，我展示了某些字符串拼接操作非常慢（特别是在 Internet Explorer\
  \ 中）。幸运的是，向数组中添加元素非常快。在接下来的示例中，你在名为 `StringBuilder` 的匿名函数内部创建了一个简单的闭包。该闭包被称为 `privateAppend()`，并且它可以访问闭包内部的一个名为\
  \ `privateArray` 的变量。这个数组包含了我们字符串的所有片段。\n\n```javascript\n// 使用模拟的私有函数构建一个高性能的字符串拼接器\n\
  \nvar StringBuilder = (function() {\n\n  var privateArray = new Array();\n\n  function\
  \ privateAppend(str) {\n    privateArray[privateArray.length] = str;\n  }\n\n  return\
  \ {\n    add: function(str) {\n      privateAppend(str);\n    },\n    value: function()\
  \ {\n      return privateArray.join(\"\");\n    }\n  }\n})();\n\n// 首先我们显示字符串是空的\n\
  \ndocument.write(\"Our String: \" + StringBuilder.value() + \"<br />\"); // \"Our\
  \ String: \"\nStringBuilder.add(\"Super\");\nStringBuilder.add(\"Cala\");\nStringBuilder.add(\"\
  Frajalistic\");\n\n// 现在我们显示完成后的拼接字符串\n\ndocument.write(\"Our String: \" + StringBuilder.value()\
  \ + \"<br />\"); // \"Our String: SuperCalaFrajalistic\"\n```\n\n如果你抛弃 `return`\
  \ 语句中的所有代码，你就可以关注这里的核心代码了，即 `var StringBuilder` 语句：\n```javascript\nvar StringBuilder\
  \ = (function() { })()\n```\n这本质上创建了一个匿名函数，该函数随后被立即执行（使用结尾的括号）。在该函数内部，有一个名为 `privateArray`\
  \ 的变量和一个名为 `privateAppend()` 的嵌套函数。通常情况下，这些引用在函数终止的那一刻就会丢失。然而，函数的最后语句是 `return`，它返回了一个包含两个闭包（`add()`\
  \ 和 `value()`）的对象。这些确保了只要对象 `StringBuilder` 存在，对数组和函数的引用就会一直存在。虽然你无法直接访问函数 `privateAppend()`，因为它是一个嵌套函数，但两个闭包都可以访问它。通过这种方式，你可以为简单的简单对象维护一个公共接口和一个私有接口。\n\
  \n## 循环中的闭包\n\n如果你不小心，闭包有时会让你感到困扰。它们产生这种影响的一种方式是你忘记了它们可以共享相同的变量引用环境。引用相同函数的闭包会受到该函数局部变量变化的影响——即使在闭包创建之后也是如此。说明这一点的一个经典方法是观察循环如何改变赋值给其他闭包的变量值。\n\
  \n```javascript\n// 闭包和循环中的问题\n\nvar myArray = [\"Apple\", \"Car\", \"Tree\", \"\
  Castle\"];\nvar closureArray = new Array();\n\n// 遍历 myArray 并为每个项创建一个闭包以输出该项\n\n\
  for (var i = 0; i < myArray.length; i++) {\n  var theItem = myArray[i];\n  closureArray[i]\
  \ = function() {\n    document.write(theItem + \"<br />\");\n  }\n}\n\n// 遍历闭包并执行每一个一个。\n\
  \nfor (var i = 0; i < closureArray.length; i++) {\n  closureArray[i]();\n}\n```\n\
  在这个示例中，我有一个名为 `myArray` 的单词数组。我还创建了一个名为 `closureArray` 的数组，它将持有所有的闭包。接下来，我遍历 `myArray`，为每个单词创建一个闭包并将其写入页面。请记住，我实际上还没有执行这些闭包，所以页面上什么不会显示任何内容。在示例的最后部分，我遍历闭包数组（`closureArray`）并执行每个函数。你看到的结果可能会让你惊讶：\n\
  Castle\nCastle\nCastle\nCastle\n你看到的不是每个单词，而是最后一个单词的四个实例。这是为什么呢？这个问题与你第一个循环中的变量\
  \ `theItem` 有关。尽管我创建了四个独立的闭包，但它们共享同一个环境并引用同一个变量。随着该变量在循环过程中变化，每个闭包都会受到影响。解决这个办法的方法是我在上一节中引入的函数工厂技术。例如：\n\
  \n```javascript\n// 循环中闭包的正确用法\n\nvar myArray = [\"Apple\", \"Car\", \"Tree\", \"\
  Castle\"];\nvar closureArray = new Array();\n\nfunction writeItem(word) {\n  return\
  \ function() {\n    document.write(word + \"<br />\");\n  }\n}\n\n// 遍历 myArray\
  \ 并为每个项创建一个闭包以输出该项\n\nfor (var i = 0; i < myArray.length; i++) {\n  var theItem\
  \ = myArray[i];\n  closureArray[i] = writeItem(theItem);\n}\n\n// 遍历闭包并执行每一个一个。\n\
  \nfor (var i = 0; i < closureArray.length; i++) {\n  closureArray[i]();\n}\n```\n\
  在这个修改后的示例中，我创建了一个新函数 `writeItem(word)`，它返回了之前使用的闭包。当我遍历单词数组时，我返回了该函数的引用。这样做的效果为循环中的每个闭包创建了一个独立的环境——无疑这看起来与上一节的函数工厂示例非常相似。当你运行这个示例时，你会看到正确的单词写入页面：\n\
  Apple\nCar\nTree\nCastle\n\n## 循环引用\n\n另一个需要注意的巨大陷阱是循环引用。在我们的 JavaScript 引擎内部有被称为垃圾回收器的小型程序。这些程序定期扫描我们的\
  \ JavaScript 上文中未被引用的对象以释放内存。正如你想象的，这是一项重要任务，因为它直接影响我们程序使用的内存总量，进而影响浏览器和整个操作系统的整体性能。Internet\
  \ Explorer 和 Mozilla 的垃圾回收机制在清理具有这些循环引用的闭包内存存在问题。它们最终没有被垃圾回收器识别，随着时间的推移，会导致你的程序出现严重的内存泄漏。闭包内部的循环引用是在\
  \ JavaScript 对象包含对 DOM（文档对象模型）对象（如 DIV）的引用，而该 DOM 对象反过来引用该 JavaScript 对象时创建的。这通常发生在你使用闭包处理“mouseover”或“click”事件时。在第\
  \ 6 章中我们将更详细地介绍事件。现在你只需要知道，将闭包设置给 DOM 元素的 `onclick` 属性会告诉浏览器在有人点击该对象时执行该代码。\n\n\
  ```html\n<div id=\"myDiv\">Hello World</div>\n\n<script>\n// 演示闭包的循环引用内存泄漏\n\nfunction\
  \ myFunction(){\n  var elObj = document.getElementById(\"myDiv\");\n  elObj.onclick\
  \ = function() {\n    alert(\"这个函数正在泄漏.\");\n  }\n}\n\nmyFunction();\n</script>\n\
  ```\n\n\n\n\n在上一个示例中，我有一个由 JavaScript 对象 `elObj` 表示的 DOM 对象。接下来，我将一个闭包赋值给该 DOM 元素的\
  \ `onclick` 事件。这意味着，当你点击页面上的该对象时，你会看到一个显示为“此函数正在泄露。”的警报框。不幸的是，内存泄漏在你点击它之前很久就已经开始了。由于问题在于，闭包本身可以访问\
  \ `elObj`，尽管它并没有真正引用它。正如你所知的，这就是闭包的工作原理。反过来，`elObj` 也对该闭包有一个隐式引用（通过 `onclick` 属性）。这是一个循环引用，某些浏览器将无法协调这种关系以便在垃圾回收中清理它。请记住，`elObj`\
  \ 在浏览器中占用的内存越多，这种内存泄漏的速度就越快。\n\n有几种方法可以解决这个问题。最简单的方法就是*打破其中一个引用*。如果它不再是循环的，就没有问题了。由于我并不真的需要闭包对\
  \ `elObj` 的引用（我可以使用 `this` 关键字），我应该在 `myFunction()` 结束时将 `elObj` 设置为 `null`，如下所示的修改后的版本：\n\
  \n```javascript\n// 演示闭包引起的循环引用内存泄漏\n\nfunction myFunction(){\n    var elObj = document.getElementById(″myDiv″);\n\
  \    elObj.onclick = function() {\n        alert(″此函数正在泄露。″);\n    }\n    elObj\
  \ = null; // 这打破了循环引用\n}\n\nmyFunction();\n```\n\n修复此示例中循环引用的另一种方法。这种方法是确保用于 `onclick`\
  \ 事件的闭包位于不同的作用域中，并且无法访问 `elObj`。如果你想保持相同的整体结构，可以使用如下例所示第二个闭包来实现：\n\n```javascript\n\
  function myFunction(){\n  var anotherClosure = function() {\n    alert(″我保证不会在你的程序中泄露的！″);\n\
  \  }\n  function innerFunction() {\n    var elObj = document.getElementById(″myDiv″);\n\
  \    elObj.onclick = anotherClosure;\n  };\n\n  innerFunction();\n}\n\nmyFunction();\n\
  ```\n\n在这里，我将闭包移动到了名为 `anotherClosure` 的变量中。接着，我创建了另一个名为 `innerFunction()` 的函数。在这个函数内部，我获取了\
  \ DOM 元素的引用 (`elObj`) 并分配了 `onclick`。我这样做是为了创建一个新的上下文，使得 `elObj` 超出 `anotherClosure`\
  \ 的访问范围。这看起来可能复杂，但实际上非常简单。可以使用一个完全独立的函数而不是闭包来进一步重构它，使其更有意义：\n\n```javascript\nfunction\
  \ myFunction(){\n  var elObj = document.getElementById(″myDiv″);\n  elObj.onclick\
  \ = myNewFunction;\n}\n\nfunction myNewFunction() {\n  alert(″我甚至不再使用闭包了！″);\n}\n\
  \nmyFunction();\n```\n\n这实现了相同的目标，只是没有使用闭包。我绕了一了一圈，但其实没必要这样做。只需通过像我第一次修改中那样打破循环引用，我就解决了最初的内存问题。虽然最后像我这样保留了两个独立的函数，但我丢失了原始方法的一些优雅性。\n\
  \n# 无意闭包\n\n当数量较少在使用时，闭包是非常高效的。然而，它们确实有一些隐性缺点。创建大量闭包是非常消耗内存，因为维护闭包本身以及内部的函数需要额外的内存。*无意中*创建闭包是非常常见的。根据定义，当一个函数在其原始作用域之外变得可访问时，闭包就形成了。下面的示例通过将闭包挂载到全局引用来实现这一点：\n\
  \n```javascript\nfunction setOnClick(obj) {\n  obj.onclick = function() {\n    alert(′你好！′)\
  \ ;\n  }\n  return null;\n}\n\nvar myDivObj = document.getElementById(′myDiv′) ;\n\
  setOnClick(myDivObj) ;\n\n// 现在 myDivObj 对 setOnClick 函数内部形成的\n// 闭包有一个永久引用\n```\n\
  \n尽管我并没有像在许多其他示例那样从 `setOnOnClick()` 内部返回函数引用（参见函数最后一行 `return null`）——但我实际上*确实*创建了一个闭包，因为全局对象\
  \ `myDivObj` 现在对那个匿名函数有一个永久引用。在这种情况下，避免此问题的简单方法是完全不要使用闭包：\n\n```javascript\nfunction\
  \ setOnClick(obj) {\n    obj.onclick = clickHandler;\n}\n\nfunction clickHandler()\
  \ {\n    alert(′你好！′) ;\n}\n\nvar myDivObj = document.getElementById(′myDiv′) ;\n\
  setOnClick(myDivObj) ;\n```\n\n你可以完全想象在许多 DOM 对象上运行原始的 `setOnClick()` 的影响。你将创建许多带有许多循环引用的独立闭包，而你从根就没这么做！\n\
  \n## 执行上下文和作用域\n\n我已经谈过一些关于*作用域*的概念，即你在任何给定时间可以访问的执行上下文的范围。查看*上下文*这一术语的另一种方式是，它是作用域链中最为直接的阶段——而且在该阶段你可以访问所有变量。例如：\n\
  \n```javascript\n// 通过赋值演示作用域\nvar myObj = {\ninnerFunction : function() {\nthis.val\
  \ = 100;\n}\n}\n\nmyObj.innerFunction();\ndocument.write(myObj.val); // 100\n```\n\
  \n根据你为止所看到的，你会认为 `this` 总是指向 `myObj`，但上下文不是这样工作的。考虑这个修改：\n\n```javascript\n// 显示这如何工作\n\
  var myObj = {\n  innerFunction : function() {\n    this.val = 100;\n  }\n}\n\nvar\
  \ myNewObj = {};\nmyNewObj.innerFunction = myObj.innerFunction;\n\nmyNewObj.innerFunction();\n\
  document.write(myObj.val); // undefined\ndocument.write(myNewObj.val); // 100\n\
  ```\n\n如果你在另一个对象上创建指向 `innerFunction` 的指针，该对象将接收 `val` 属性（因为 `this` 总是引用上下文）。你有几种方法可以控制函数的执行上下文，强制在我们指定的范围内运行——这让面向对象的代码变得简单得多。这些方法涉及\
  \ `apply` 和 `call` 函数。\n\n## 使用 apply()\n\n`Function` 对象有一个方法名为 `apply()`。它接受两个参数，语法如下：`obj.apply(thisContext\
  \ [, argsArray])`。\n\n第一个参数 `thisContext` 是一个对象引用，作为 `this` 操作符的主机。每你在代码中引用当前上下文，它将应用于该对象。通过这种方式，你本质上可以将函数从一个对象临时赋值给另一个对象，它就像该函数实际上属于\
  \ `thisContext` 对象一样。第二个参数是 `argsArray`，包含发送给函数的有序参数列表。这是一个可选参数。在下面的示例中，我使用 `apply`\
  \ 来更改函数的执行上下文，改变 `this` 的含义：\n\n```javascript\n// 使用 apply 更改函数的执行上下文\nvar person\
  \ = {\n  name: ″Daniel″,\n  age: 12,\n  weight: ″150lb″,\n  describe: function(useLongDesc)\
  \ {\n    document.write(″Person′s name: ″ + this.name + ″<br />″);\n    document.write(″Person′s\
  \ age: ″ + this.age + ″<br />″);\n    if (useLongDesc == true) {\n      document.write(″Person′s\
  \ weight: ″ + this.weight + ″<br />″);\n    }\n  }\n}\n\nvar jamesBond = {\n  name:\
  \ ″James, James bond.″,\n  age: ″timeless″,\n  weight: ″enough″\n}\n\nperson.describe.apply(jamesBond,\
  \ [true]);\n```\n\n\n\n\n`person.describe.apply(jamesBond, [true]);` 这将生成以下输出：\n\
  Person′s name: James, James bond.\nPerson′s age: timeless\nPerson′s weight: enough\n\
  \n## 使用 call()\n\n另一个属于 `Function` 类所有实例的方法是 `call()`。这与 `apply()` 非常相似，不同之处在于接收参数的方式。它不使用数组，而是使用一个由普通参数组成的列表。\n\
  `functionObj.call(thisContext [, arg1 [, arg2 [, ...]]]);`\n再次，参数 `thisContext`\
  \ 指的是对于任何正在使用的函数，它将等于的值。\n\n# 总结\n\n在本章中，你学习了 JavaScript 中的函数是如何行为的。具体来说，你涵盖了以下主题：\n\
  - 函数是一等类对象，可以像其他对象一样被创建、引用、修改和销毁。\n- 传递给函数的参数根据其数据类型表现得不同。\n- 从函数返回值会终止执行。\n- 你探索了作用域在函数内部是如何工作的，以及\
  \ JavaScript 是如何定义作用链的。\n- 尽管该语言没有显式支持重载，但有多种方法可以实现函数重载。\n- 闭包是函数类型，它们在一个包含可能可能不再存在的上下文的环境中运行。它们是语言的一项强大功能，但应该谨慎使用，以避免内存泄漏和意外行为。\n\
  - 函数的执行上下文（通过 `this` 关键字定义）可以通过使用 `apply()` 和 `call()` 来改变。\n\n在第 6 章中，我将论述全局对象的各种属性，包括可用的方法、对象和属性，以及全局对象在网页内部是如何被处理的。\n\
  \n## Global 对象和 Object 对象\n\n学习编程语言最好的方法是掌握所有低层概念并逐步深入。在我开始认真讨论面向对象开发、窗口、表单等内容之前，我应该介绍另外两个在\
  \ JavaScript 中反复出现的低层概念。其中一个是 `Global object`（全局对象），它是所有其他对象、变量和函数所属的父结构。另一个是 `Object\
  \ object`（对象），它是语言中所有其他对象（包括内置对象）继承的基类。一旦你理解了这些是如何工作的，将完善你对 JavaScript 其他特性行为的理解。\n\
  \n## 全局对象的特性\n\n全局对象是所有其他对象所属的最顶层上下文。它具有某些你可以依赖来构建应用程序的属性和函数。它在 Web 开发中也起着重要作用——作为作用域的最上层上下文，并与你将要依赖的一些非常高级的浏览器特性共享。除此之外，全局对象包含：\n\
  - JavaScript 中所有的内置对象，如 `String`、`Number`、`Math` 等。\n- 你在语言中经常使用的几个内置属性。\n- 几个内置函数。\n\
  - 几个特定于浏览器的对象，如 `document` 和 `window`。\n\n它在作用域中很有用。当引用一个变量但未找到时，解释器会沿作用链移动，沿路检查变量直到到达全局对象。如果在那里没有找到，它将被认为不存在并发生异常。当你处于全局作用域时，可以使用关键字\
  \ `this` 访问全局对象。\n\n## 浏览器中的全局对象\n\n在浏览器中，全局对象具有特殊用途。除了持有 JavaScript 的所有普通功能并作为全局上下文外，它还是许多浏览器特定对象（如\
  \ `window` 和 `document`）的宿主。有趣的是，`window` 是一个*自引用成员*。在全局作用域中工作时，你可以通过 `window.variablename`\
  \ 或直接使用 `variablename` 来访问变量。\n\n你可能会奇怪*为什么*你既有一个全局对象*又*有一个本质上是相同的东西 `window` 对象。这是因为当你想要具体地访问全局上下文中的某些内容（例如，浏览器窗口的\
  \ name 属性）时，将其表示为 `window.name` 比简单用 `name` 要可靠得多，如下例所示：\n\n```html\n<!-- 全局对象和\
  \ window 对象的本质 -->\n<head></head>\n<body>\n<script type=\"text/javascript\">\nvar\
  \ myVar = \"Hello\";\n\nfunction checkVars1() {\n    document.write(\"checkVars1:\
  \ Checking myVar: \" + myVar + \"<br />\"); // \"Hello\"\n}\n\nfunction checkVars2()\
  \ {\n    var myVar = \"World\";\n    document.write(\"checkVars2: Checking myVar:\
  \ \" + myVar + \"<br />\"); // \"World\"\n    document.write(\"checkVars2: Checking\
  \ window.myVar: \" + window.myVar + \"<br />\"); // \"Hello\"\n}\n\ncheckVars1();\n\
  checkVars2();\n</script>\n</body>\n</html>\n```\n\n此示例产生以下输出：\ncheckVars1: Checking\
  \ myVar: Hello\ncheckVars2: Checking myVar: World\ncheckVars2: Checking window.myVar:\
  \ Hello\n\n这里有两个函数：`checkVars1()` 和 `checkVars2()`。第一个函数引用了变量 `myVar`，它属于全局对象。第二个函数声明了一个同名的变量并执行了相同的操作。你可以看到，除非直接提到全局上下文（恰好是\
  \ `window.myVar`），否则你的全局引用是有歧义的。\n\n在浏览器中，每个窗口、`iFrame` 和标签页都有自己独特的全局对象。有时你可以通过\
  \ DOM 在这些作用域之间进行通信，但通常它们是独立且不同的。\n\n## 获取全局对象\n\n当然，在浏览器中，获取全局对象就像引用 `window` 一样简单，但在其他\
  \ JavaScript 环境可能没有 window。幸运的是，有一种更通用的方法来显式引用它\n\n```javascript\n// 获取全局对象\nfunction\
  \ getGlobal() {\n    return (function(){\n        return this;\n    }).call(null);\n\
  }\n```\n\n正如我在上一章中提到的，当你使用 `call()` 或 `apply()` 而没有指定上下文时，将使用全局上下文。你也知道，当你在全局上下文中使用关键字\
  \ `this` 时，你指的是全局对象。因此，如果你创建一个闭包并在全局上下文中对其 `call()`，你实际上是在返回全局对象。前面的示例创建了这个函数。调用它只需：\n\
  `var globalObj = getGlobal();`\n\n## 全局属性\n\n全局提供了几个在应用程序中很有用的属性。它们是：\n\n### 属性列表\n\
  ![055](img/whit_9780470550502_oeb_055_r1.gif)\n\n`Infinity` 和 `NaN` 属性处理数值时非常有帮助。`Infinity`\
  \ 最初等于 `Number.POSITIVE_INFINITY`，这只是一个像数字但实际上不是数字的数学构造。例如，在数学中，任何数字乘以无限都是无限。同样，JavaScript\
  \ 中的任何数字乘以 `Infinity` 将等于 `Infinity`。\n\n`NaN`（不是数字）属性在你尝试将非数值视为数字时非常有用。某些 JavaScript\
  \ 函数（如 `Number` 构造函数、`parseFloat` 和 `parseInt`）如果指定的参数无法解释为数字，则返回 `NaN`；但是，你不能通过与\
  \ `NaN` 比较来检查一个值是否为 `NaN` —— 请在此处使用 `isNaN()`（在下一节，全局函数中介绍）。\n\n三个全局属性的最后一个是 `undefined`。早些时候，我介绍\
  \ `undefined` 是 JavaScript 的一种正式类型。正如你所知，当变量没有实例化时，它们的初始值为 `undefined`。未实例化的变量的\
  \ `typeof` 也是 *undefined*。以下两个语句都真：\n`myUndefinedVar == undefined`\n\n\n\n\n\n`typeof\
  \ myUndefinedVar == \"undefined\"` 使用 `undefined` 来检查变量存在的唯一困难之处在于，你可以重写 `undefined`\
  \ 属性：// 演示检查变量的 `typeof` 比检查是否等于 `undefined` 更具健壮性\n\n```javascript\nvar myUndefinedVar;\n\
  \nif (myUndefinedVar === undefined) {\n  document.write(\"1: myUndefinedVar is undefined.<br/>\"\
  );\n}\n\nvar undefined = \"undefined\";\n\nif (myUndefinedVar === undefined) {\n\
  \  document.write(\"2: myUndefinedVar is undefined.<br/>\");\n}\n\nif (typeof myUndefinedVar\
  \ == \"undefined\") {\n  document.write(\"3: myUndefinedVar is undefined.<br/>\"\
  );\n}\n```\n\n这将产生以下输出：\n1: myUndefinedVar is undefined.\n3: myUndefinedVar is undefined.\n\
  \n通过重写 `undefined` 属性，我让检测无值变量的策略变得失效。如果我检查一个既没有实例化也没有被声明的变量，该技术也会失败。例如，如果我尝试执行\
  \ `if (myVar == undefined)` .. 但 `myVar` 未被声明，我将得到一个 `ReferenceError`。然而，如果我只是检查一个未声明变量的\
  \ `typeof`，这将是一个有效的操作。\n\n## 全局函数\n\n除了少数有用的全局属性外，全局对象中还有许多可用函数。这些是：**方法列表**![056](img/whit_9780470550502_oeb_056_r1.gif)\n\
  \n## URI 编码\n\n许多此类全局函数用于将字符串值编码和解码为其他格式。这些函数是全局对象的一部分而不是 `String` 类的一部分这似乎很奇怪，但在浏览器脚本的早期阶段，这可能是这样设计的，以便为经常需要这些辅助函数的开发者提供方便。\n\
  \n函数 `decodeURI()`、`encodeURI()`、`escape()`、`unescape()`、`decodeURIComponent()`\
  \ 和 `encodeURIComponent()` 均以不同程度对字符串进行编码，以便它们可以在其他计算机上读取并在 URL 字符串中传输。我在第 7 章中将详细介绍这些内容。现在，请考虑以下示例。\n\
  \n以 URL 参数的形式在互联网上发送一段数据是简单的。使用以下语法：`[`myurl.com/index.php?myparam=true&myparam2=hello`](http://myurl.com/index.php?myparam=true&myparam2=hello)`\n\
  \n然而，如果你想将字符串 \"A & W Root Beer\" 作为 URL 字符串中的参数，就会遇到问题。首先，URL 不能包含空格。其次，符号 `&`（和）被保留为参数分隔符（用于分隔同一查询字符串中的多个参数）。你需要对此字符串进行编码，以保留所有信息，同时又不破坏你的查询字符串。一个简单的解决方案是使用上述函数之一对其进行编码。例如，如果你对字符串使用\
  \ `encodeURIComponent()`，你将得到：`\"A%20%26%20W%20Root%20Beer\"`。这是一个你随后可以在 URL 中传输的字符串。\n\
  \n## 求值代码\n\n你可用的全局函数之一是 `eval()`，它允许你在没有特定的情况下执行（求值）字符串代码。`eval()` 的语法非常简单：`eval(\
  \ string )`\n\n单个参数 `(string)` 是一个包含单个或一组 JavaScript 表达式或语句的字符串。它可以包含变量、新对象定义或对其他现有对象的引用。简而言之，它可以是一个整个程序或你程序的扩展。字符串可以来自\
  \ Web 表单、你创建的字符串字量，或者来自我们程序其他部分的生成的字符串。\n\n以下是 `eval()` 逐渐变得复杂的示例：\n\n```javascript\n\
  eval(\"1 + 1\"); // 2\neval(new String(\"1 + 1\")); // \"1 + 1\"\neval((new String(\"\
  1 + 1\")).toString() ); // 2\neval(\"document.write('hello')\"); // \"hello\"\n\
  eval(\"var myVar = 10;\");\neval(\"var myVar = 10; document.write(myVar);\");\n\
  eval(\"window.myVar\"); // 10\neval(\"function myFunction() {return true;}; myFunction()\
  \ ; \"); // true\n```\n\n## 执行上下文\n\n虽然你不能直接为 `eval()` 调用设置求值上下文，但上下文确实重要。它将始终采用调用时的作用域和上下文。例如：//\
  \ 演示上下文对 eval 的影响\n\n```javascript\nwindow.myVar = \"hello\";\n\nfunction evalTest()\
  \ {\n  var myVar = \"World\";\n  document.write( eval(\"myVar\") ); // \"World\"\
  \n}\nevalTest();\n```\n\n当你调用 `evalTest()` 时，它将假设调用者的执行上下文。在前面的示例中，因为我在 `evalTest()`\
  \ 的范围内调用它，所以它引用了该函数中的局部变量。某些旧版本的 Mozilla 接受在字符串后作为 `eval()` 的第二个参数作为执行上下文。由于这并没有被通用支持，你可以使用另一种途径，通过使用\
  \ `with` 语句来设置代码块的上下文：// 设置 eval() 的执行上下文\n\n```javascript\nvar elvis = {\n  name:\
  \ \"Elvis Presley\",\n  occupation: \"Rock Star\",\n  status: \"Abducted\"\n};\n\
  with (elvis) {\n  eval(\"document.write(name);\"); // \"Elvis Presley\"\n}\n```\n\
  \n## eval 的危险性\n\n可用的全局函数之一是 `eval()`，它允许你在没有特定的情况下执行（求值）字符串代码。关于 `eval()` 的相对安全性有很多争议。如果你要求值的字符串受到用户输入的影响，通常被认为是不安全的，因为用户创建的代码将与程序具有相同的权限。一个更大的问题可能是\
  \ `eval()` 对性能的影响。使用 `eval()` 执行一行代码比直接内联执行要慢。这种性能下降取决于浏览器，但它是普遍存在的。\n\n另一个问题是求值代码更难调试。你无法从\
  \ IDE 中获得语法高亮或代码提示，而且很难使用浏览器的调试器单步执行你的求值代码。通常，你应该寻找非求值的方法来动态执行代码。\n\n# 数字辅助函数\n\n\
  许多全局函数既处理数字也处理字符串。这些是 `isNaN()`、`isFinite()`、`parseInt()` 和 `parseFloat()`。\n\n\
  这些函数中的第一个 `isNaN()` 用于判断一个值是否等于“非数字”（Not a Number）。由于你无法简单地通过比较 NaN 来测试一个值是否可以转换为数字，可以使用此函数进行测试。例如，`myVar\
  \ == NaN` 和 `myVar === NaN` 始终为假，而 `isNaN(myVar)` 根据 `myVar` 是否可以转换为数值而返回真或假。以下是\
  \ `isNaN()` 的几个示例：\n\n```javascript\nisNaN(NaN); // true\nisNaN(\"Hello World\"\
  ); // true\nisNaN(\"99\"); // false\nisNaN(99); // false\n```\n\n下一个 `isFinite()`\
  \ 用于判断一个数字是否为有限。它接受一个参数，如果该值是 `NaN`、`Number.POSITIVE_INFINITY` 或 `Number.NEGATIVE_INFINITY`，则它返回假；否则返回真。\n\
  \n最后两个函数 `parseInt()` 和 `parseFloat()` 用于将值转换为数字。它们接受单个参数并尝试将其转换为舍整数或浮点值。如果无法转换，它们将返回\
  \ `NaN`。语法非常简单：\n\n```javascript\n// 大多数 JavaScript 引擎：\nvar myInt = parseInt(numstring)\n\
  var myFloat = parseFloat(numstring)\n\n// 基于 Gecko 的引擎：\nvar myInt = parseInt(numstring[,\
  \ radix])\nvar myFloat = parseFloat(numstring[, radix])\n```\n\n## 全局对象\n\n\n\n\n\
  \n全局对象中最重要的成员可能是语言中每种数据类型的基类。这些被称为 `global objects`（全局对象集）。它们不应与 `global object`（全局对象）混淆，后者仅仅是\
  \ JavaScript 中所有内容所属的上下文。`global objects` 都是全局对象的直接成员。`global objects` 都是同一个类的实例：即\
  \ `Object object`（对象对象）。\n\n## Object object（对象）\n\n`Object object` 是语言中所有其他对象的基类。它也是你动态实例化自定义对象的方法。虽然你还没有接触过面向对象开发，但这是大多数高级编程语言的基础性概念。从本质上说，对象是一个封装结构，它既持有信息（属性），又能执行某些操作（方法）。它是一种将这些内容组合在一起的方便方式，以便你的程序可以方便地引用它们。我将在第\
  \ 10 章中详细讨论这些内容，但现在我需要快速介绍另外几个相关概念，这样我们之后对 JavaScript 中各种对象的讨论才会有意义。\n\n这些概念之一是\
  \ `inheritance`（继承）。我们有时说某人继承了父亲的耳朵或母亲的鼻子。同样，当某个东西属于一个类（沿用比喻的话，称为 `family` 家庭）时，它继承自该类。当我们说\
  \ JavaScript 中的所有对象都基于 `Object object` 时，我们的意思是它们继承了该类的一组属性和方法。事实上，你在 JavaScript\
  \ 中创建的变量都源自 `Object` 类。\n\n尽管如此，`Object object` 本身也是非常有用的。有多种方法可以创建 `Object` 的实例。一种是使用对象的构造函数，其语法是\
  \ `new Object([])`。`new` 关键字表示你正在使用特定对象的构造函数来创建一个对象实例。同样，我将在第 10 章中详细介绍这一点。`Object`\
  \ 构造函数为给定的值提供了一个方便的封装。如果该值恰好是 `null` 或 `undefined`，它将仅仅创建一个空对象。当提供标识符或字面量时，它会返回一个与值类型对应的对象。例如，以下是有效的对象构造列表：\n\
  \n```javascript\nvar myObj = new Object(); // 空对象实例\nmyObj = new Object(\"hello\"\
  ); // 字符串实例\nmyObj = new Object(Boolean()); // 初始值为 false 的布尔对象\nmyObj = new Object(false);\
  \ // 与上相同\n```\n\n在现代 JavaScript 中，你也可以使用对象表示法创建简单对象。这会隐式地调用类构造函数并返回一个实例。我已经展示了许多对象表示法的示例，但这里是另一个：\n\
  \n```javascript\nvar myObj = {}; // 空对象实例\nmyObj = true; // 布尔对象实例\nmyObj = \"hello\"\
  ; // 字符串对象实例\n```\n\n看起来眼熟吗？这意味着每当你创建一个字符串、数字或其他数据类型的变量时，你都在创建该对象类的一个实例，并随之继承了该类的所有成员。在前面的方法和属性矩阵中，你看到了许多实用的功能。这些功能中的每一个（如果被浏览器支持）都会扩展到你创建的每个变量。请注意，并非所有成员在所有\
  \ JavaScript 解释器中都可用。请参附录 B 获取详细的兼容性信息。例如：\n\n```javascript\nvar myString = \"Hello\"\
  ;\nvar myNumber = 123;\nvar myObj = {};\n// 现在我们测试每个对象，看看 Object 方法 toString() 是否被继承\n\
  document.write(myString.toString() + \"<br>\"); // \"Hello\"\ndocument.write(myNumber.toString()\
  \ + \"<br>\"); // \"123\"\ndocument.write(myObj.toString()); // \"[object Object]\"\
  \n```\n\n## Object Prototypes（对象原型）\n\n正如你可能已经知道，JavaScript 并不是典型的面向对象语言。它使用一种名为\
  \ `prototypal inheritance`（原型继承）的方法，而不是经典式的继承。这意味着你不是定义类，而是创建对象并指定一个 `prototype`（原型）。困惑了？我将在第\
  \ 10 章消除这个主题的任何歧义。现在，你只需要知道通过修改 `Object` 的原型，就可以改变语言中所有对象的定义。看看这个例子：\n\n```javascript\n\
  // 给对象类添加一个名为 developedBy 的属性\nObject.prototype.developedBy = \"John Smith\";\n\n\
  // 现在我们创建一些不同类型的对象\nfunction myFunction() {}\nvar myArray = new Array(\"apple\"\
  , \"tree\", \"horse\");\nvar myBool = new Boolean(\"true\");\n\n// 现在我们测试新属性是如何应用到这些后代对象的\n\
  document.write(myFunction.developedBy + \"<br>\"); // John Smith\ndocument.write(myArray.developedBy\
  \ + \"<br>\"); // John Smith\ndocument.write(myBool.developedBy); // John Smith\n\
  ```\n\n因为你修改了 `Object` 类的原型，而所有其他对象都继承了这个类，你会看到你的测试函数、数组和 `Boolean` 值都继承了你的这个新属性。这将产生以下输出：\n\
  \nJohn Smith\nJohn Smith\nJohn Smith\n\n同样，你可以扩展 `Object` 原型以包含你选择的函数。在后面的章节中，我经常这样做来为\
  \ JavaScript 中的不同对象添加功能。对于使用 `prototype` 属性来扩展 JavaScript 语言组成的基类的安全性，存在不同的观点。某些人出于各种原因不倾向于这样做。通常情况下，在你控制的环境中进行开发时，这是一种安全的做法——但请继续阅读第\
  \ 12 章，讨论你为什么可能或不想在你的应用程序中使用这种方法。\n\n# Determining if a Property Exists（判断属性是否存在）\n\
  \n`Object` 类为所有对象提供了许多实用的功能。其中之一是 `hasOwnProperty()`，它可以告诉任何对象特定实例是否拥有特定的属性。例如：\n\
  \n```javascript\nperson = {name: \"Elvis\"};\n// 首先我们测试一个已知属性\ndocument.write(person.hasOwnProperty(\"\
  name\") + \"<br>\"); // true\n// 现在我们测试一个不存在的属性\ndocument.write(person.hasOwnProperty(\"\
  age\")); // false\n// 现在我们测试一个存在但被继承的属性！\ndocument.write(person.hasOwnProperty(\"\
  hasOwnProperty\")); // false\n```\n\n如前面的示例所示，它接受一个参数，即属性名称的字符串值。这对于函数以及像字符串或数字这样的简单属性同样有效。然而，它对于通过原型链向上递归的继承属性无效，如示例的最后一行所示。\n\
  \n\n\n\n\n另外两个属于 `Object` 类但扩展到所有其他对象的函数是 `valueOf()` 和 `toString()`。这两个函数之间的区别通常并不总是一而易见的。关键区别在于\
  \ `valueOf()` 设计用于为对象返回一个 `primitive value`（原始值），而 `toString()` 设计用于为对象返回一个对对象最有意义的\
  \ `text value`（文本值）。换句话说，`valueOf()` 在编程意义上通常更有用，而 `toString()` 在可读性方面则更有用。如果你想将对象的内容打印为文本，你会使用\
  \ `toString()`；而如果你想根据现有的对象构建新对象，你可能会查看 `valueOf()`。\n\n在实践中，大多数继承自 `Object` 的对象类型（如\
  \ `String`、`Boolean`、`Date` 等）都会在原型上重写 `valueOf()` 方法，以返回一个更有意义的值。通用对象的默认响应通常类似于\
  \ `[object Object]` 的内容，而日期（`Date`）对象的 `valueOf()` 原始值将是 `ticks` 的数量（这可以用于构建一个新的日期对象）。通常，当你构建自定义对象时，建议你重写\
  \ `valueOf` 方法，以提供比 `[object Object]` 更有意义的原始值。\n\n同样，`toString()` 并不总是为对象提供非常有用的文本表示。对象的默认字符串值通常（取决于浏览器）类似于\
  \ `[object Object]`，而例如，一个 `Date` 对象的 `toString()` 值可能看起来像 `\"Thu Dec 11 2008 21:26:00\
  \ GMT-0800 (PST)\"`。幸运的是，这些只是简短的实用函数，如果你想使用更复杂的内容，可以重写它们。\n\n利用已经引入的原型概念，你可以轻松地编写一个新的\
  \ `toString()` 方法，将其扩展到原型链上任何没有自己版本版本的对象。例如：\n\n```javascript\n// 为 Object 类编写一个更有实用的\
  \ toString() 方法\nObject.prototype.toString = function() {\n  var result = \"“\"\
  ;\n  for (prop in this) {\n    result += prop + \": \" + this[prop].toString() +\
  \ \", \";\n  }\n  return result;\n}\n\nperson = {name:\"Elvis\", age:57};\ndocument.write(person.toString());\
  \ // name: Elvis, age: 57\n```\n\n当你查看更多 JavaScript 中的全局对象时，你将基于对对象和继承的理解，以类似的方式添加功能。稍后，你将深入研究\
  \ JavaScript 中的面向对象开发。\n\n# 对象的常用实用函数\n\n现在我已经介绍了 `Object` 对象的角色，以及你如何在其基础上构建为 JavaScript\
  \ 中的所有对象提供新功能，你将看到它有时被扩展的某些常用方式，以提供实用的新功能。\n\n## 合并对象\n\n在第 5 章中，你查看了使用对象来重载函数参数定义的实践。其中的一个关键步骤是将我们的参数对象与一组默认值进行合并。与其将此合并函数作为一个独立的实用工具，不如将其构建到对象定义本身中，以便获得一个更简洁、更易于使用的工具。\n\
  \n你再次使用 `Object` 的 `prototype` 属性来实现此。每个继承此定义的对象（包括你的所有其他数据类型）都将获得此内置功能。首先从编写一个简单的合并函数开始，遍历对象中的所有项并将它们复制过去：\n\
  \n```javascript\n// 将一个对象合并到另一个对象中，如果存在则保留原始值\nObject.prototype.merge = function(objSource)\
  \ {\n  // 确保我们处理的是有效对象\n  if (typeof this == \"object\" && objSource && typeof objSource\
  \ == \"object\") {\n    for (var arg in objSource) {\n      if (typeof objSource[arg]\
  \ == \"object\" && !objSource[arg].length) {\n        if (!this[arg]) {\n      \
  \    this[arg] = {};\n        }\n        this[arg].merge(objSource[arg]);\n    \
  \  } else {\n        this[arg] = this[arg] || objSource[arg];\n      }\n    }\n\
  \  }\n}\n```\n\n通过使用 `for .. in` 循环，你按顺序遍历对象的每个属性，无论是属性还是函数引用。由于此设计用于对对象类型工作，因此你检查\
  \ `this` 的类型以确保你没有将其应用于不同的类型上，同时你也会检查 `objSource` 的类型，即你正在与之合并的对象。当你遍历 `objSource`\
  \ 时，你会检查每个属性以查看它是对象或其他类型。由于对象是 `reference types`（引用类型），你希望确保对每个恰好也是对象的属性应用 `merge()`。否则，你只需复制该属性。\n\
  \n接下来，你创建两个对象并测试合并是否有效：\n\n```javascript\n// 将一个对象合并到另一个对象中。我们从一个通用定义开始\nperson\
  \ = {\n  name: \"Unknown\",\n  age: 0,\n  height: \"Unknown\",\n  weight: \"Unknown\"\
  ,\n  occupation: \"Unknown\",\n  children: {\n    count: 0,\n    names: []\n  }\n\
  };\n\nelvis = {\n  name: \"Elvis\",\n  age: 57,\n  occupation: \"Rock Star\"\n};\n\
  \n// 现在我们将 person 合并到 elvis\nelvis.merge(person);\n// 测试新属性是否已复制\ndocument.write(\"\
  Elvis's Weight: \" + elvis.weight); // Elvis's Weight: Unknown\n```\n\n## 更好的 typeof\n\
  \n正如第 4 章所述的，你使用 `typeof` 运算符来确定一个东西是什么类型的对象。例如，表达式 `typeof (new Object())` 将返回\
  \ `\"object\"`。`typeof` 运算符的问题在于并不是所有的返回值都特别有用。例如，看看以下这些对象类型的响应：某些值是有意义的：布尔值（Booleans）返回\
  \ `\"boolean\"`，字符串（Strings）返回 `\"string\"`。少数值则没用。例如，`null` 返回 `\"object\"`，`Array`\
  \ 也是如此。在 `Array` 的情况下，我们知道它继承自 `Object` 类，所以这至少是有意义的，但如果它返回 `\"array\"` 会不是更有意义吗？某些框架为对象类添加了一个实用方法来实现这一点。实现此点的良好方法是使用\
  \ Object 对象中名为 `constructor` 的属性。你可以通过多种方式来实现。其中一种方法是重用 `prototype` 属性将其扩展到所有对象：\n\
  \n```javascript\n// 为我们的 Object 类添加改进的 typeof 功能\nObject.prototype.getType = function()\
  \ {\n  if (typeof(this) == \"object\") {\n    if (this.constructor == Array) return\
  \ \"array\";\n    if (this.constructor == Date) return \"date\";\n    if (this.constructor\
  \ == RegExp) return \"regex\";\n    return \"object\";\n  }\n  return typeof(this);\n\
  }\n\n// 测试我们新的 getType() 函数\nvar myArray = new Array();\nvar myObj = new Object();\n\
  var myRegex = new RegExp();\nvar myDate = new Date();\n\ndocument.write(myArray.getType()\
  \ + \"<br>\"); // array\ndocument.write(myObj.getType() + \"<br>\"); // object\n\
  document.write(myRegex.getType() + \"<br>\"); // regex\n```\n\n\n\n`document.write(myDate.getType()\
  \ + \"<br />\");`   // \"date\" 对于你确定是对象的变量，这种方法可以正常工作，但这种方法的一个缺点是它无法处理 null，因为变量没有继承自\
  \ Object 类。呈现此种功能的另一种方法是将其作为静态函数添加到 Object 类中并直接引用。这同样可以地放在一个独立的工具类中，但将这些类型的辅助函数分组到\
  \ Object 上是有意义的。// 重写我们改进后的 typeof 以作为静态函数并测试 null\n\n```javascript\nObject.getType\
  \ = function(obj) {\n    if (typeof(obj) == \"object\") {\n        if (obj === null)\
  \ return \"null\";\n        if (obj.constructor == (new Array).constructor) return\
  \ \"array\";\n        if (obj.constructor == (new Date).constructor) return \"date\"\
  ;\n        if (obj.constructor == (new RegExp).constructor) return \"regex\";\n\
  \        return \"object\";\n    }\n    return typeof(obj);\n}\n```\n\n现在你可以测试这个静态方法并包含对\
  \ null 的测试了：// 测试我们的静态 getType() 函数\n\n```javascript\nvar myArray = new Array();\n\
  var myObj = new Object();\nvar myRegex = new RegExp();\nvar myDate = new Date();\n\
  var myNull = null;\n\ndocument.write(Object.getType(myArray) + \"<br />\");   //\
  \ \"array\"\ndocument.write(Object.getType(myObj) + \"<br />\");   // \"object\"\
  \ndocument.write(Object.getType(myRegex) + \"<br />\");   // \"regex\"\ndocument.write(Object.getType(myDate)\
  \ + \"<br />\");   // \"date\"\ndocument.write(Object.getType(myNull) + \"<br />\"\
  );   // \"null\"\n```\n\n## isType() 函数\n\n你改进后的 typeof 方法无疑很有帮助，但如果你用它来*检查*对象的类型以执行某些特定操作，你将不可避免地在代码中嵌入大量的字符串比较，例如：`if\
  \ (Object.getType(myObj) == \"array\") ...`。这种方法虽然完全有效，但也显得冗长，有些人会认为它很杂乱。如果你在使用它但忘记了正则表达式对象的准确返回结果，或者拼错了\
  \ \"array\" 单词，这些比较可能会成为 bug 的来源。对对象进行快速类型检查的更简洁、更可靠的方法可能是是在 Object 类上嵌入几个简单的辅助函数，来为你完成这些比较。例如，你可能更喜欢使用这样的代码：`if\
  \ (Object.isArray(myObj)) ...`。这里有几个你可能想使用的函数：\n\n### isArray()\n\n如果参数是数组，则该方法返回\
  \ true，否则返回 false。// 检查某物是否为数组\n\n```javascript\nObject.isArray = function(obj)\
  \ {\n    // 测试它是否是一个对象且其构造函数是数组\n    return (typeof obj == 'object' && obj.constructor\
  \ == Array)\n}\n```\n\n### isBoolean()\n\n如果参数是布，则该方法返回 true，否则返回 false。// 检查某物是否为布\n\
  \n```javascript\nObject.isBoolean = function(obj) {\n    // 测试它是否是一个对象且其构造函数是布\n\
  \    return (typeof obj == 'boolean')\n}\n```\n\n### isDate()\n\n如果参数是日期，则该方法返回\
  \ true，否则返回 false。// 检查某物是否为日期\n\n```javascript\nObject.isDate = function(obj) {\n\
  \    // 测试它是否是一个对象且其构造函数是日期\n    return (typeof obj == 'object' && obj.constructor\
  \ == Date)\n}\n```\n\n### isFunction()\n\n如果参数是函数，则该方法返回 true，否则返回 false。// 检查某物是否为函数\n\
  \n```javascript\nObject.isFunction = function(obj) {\n    return (typeof obj ==\
  \ 'function')\n}\n```\n\n### isNull()\n\n如果参数是 null，则该方法返回 true，否则返回 false。// 检查某物是否为\
  \ null\n\n```javascript\nObject.isNull = function(obj) {\n    return (typeof obj\
  \ == 'object' && !obj)\n}\n```\n\n### isNumber()\n\n如果参数是有效的数字，则该方法返回 true，否则返回\
  \ false。// 检查某物是否为数字\n\n```javascript\nObject.isNumber = function(obj) {\n    return\
  \ typeof obj == 'number' && isFinite(obj);\n}\n```\n\n### isObject()\n\n如果参数是对象（包括继承自对象的类型），则该方法返回\
  \ true，否则返回 false。// 检查某物是否为对象\n\n```javascript\nObject.isObject = function(obj)\
  \ {\n    return (typeof obj == 'object' && !!obj) || (typeof obj == 'function');\n\
  }\n```\n\n### isRegex()\n\n如果参数是正则，则该方法返回 true，否则返回 false。// 检查某物是否为正则\n\n```javascript\n\
  Object.isRegex = function(obj) {\n    return (typeof obj == 'object' && obj.constructor\
  \ == RegExp)\n}\n```\n\n### isString()\n\n如果参数是字符串，则该方法返回 true，否则返回 false。// 检查某物是否为字符串\n\
  \n```javascript\nObject.isString = function(obj) {\n    return (typeof obj == 'string')\n\
  }\n```\n\n### isUndefined()\n\n如果参数是 undefined，则该方法返回 true，否则返回 false。// 检查某物是否为字符串（注：此处原文误，应为\
  \ undefined）\n\n```javascript\nObject.isUndefined = function(obj) {\n    return\
  \ (typeof obj == 'undefined')\n}\n```\n\n# 总结\n\n在本章中，你探索了与全局对象相关的问题，以及面向对象开发的主要构建块之一：Object\
  \ 对象。让我们回顾一下一路上我们讨论的内容。全局对象是语言中可用的顶层上下文，在浏览器中被赋值给 window。它包含了许多非常有用的属性和函数，例如用于 URL\
  \ 编码字符串、处理数值以及即时评估新的表达式和语句。全局对象还包含了许多基础类，如 Number、Date、String 等。所有这些类都继承自父对象。Object\
  \ 对象还包含了许多属性和函数，它们可以扩展到语言中的所有其他对象（无论是内置还是自定义的）。Object 对象最重要的属性之一是 prototype，它提供了一种扩展对象以默认包含新属性和方法的方法。使用\
  \ prototype 属性扩展 Object 是为所有对象添加新功能的方便方法。Object 类也是存储与对象相关的静态工具函数的绝佳位置。\n\n\n\n\
  JavaScript 中的所有字符串都变成 `String` 对象的实例，这是一个`包装类`（wrapper class），全局对象的一个成员。这会自动为每个创建的字符串扩展某些属性和方法。但重要的是，尽管字符串是对象，但仍然存在一种字符串`原始类型`（primitive），`String`\
  \ 包装类为其增强了额外的功能。`String` 包装类包含以下成员：![061](img/whit_9780470550502_oeb_061_r1.gif)![062](img/whit_9780470550502_oeb_062_r1.gif)这些特性被继承到所有字符串，无论它们是用字面量符号还是使用对象构造函数创建的。注意，并非所有特性在所有浏览器中都可用。详细的兼容性信息请参见附录\
  \ B。\n\n# 字符串基础\n\nJavaScript 的字符串支持底层有一个强大的框架，这使得处理字符串变得简单。在这里我将介绍字符串的基础知识：你如何创建它们、它们在底层是如何运行的、你如何插入基础格式信息，以及它们如何与数字交互。\n\
  \n## 字符串字面量\n\n可以通过代码中的字面量符号轻松地创建字符串。字符串字面量（或`原始类型`）表示为由两个单引号（’’ ’）或两个双引号（″ ″）括起来字符序列。以下是一些示例：\n\
  \n```javascript\nvar emptystring = ″″; // 接受没有字符的情况\n\nvar myname =″Alex″; // 一个基础字面量\n\
  \nvar nickname = ″Ol′ Stink Eye″; // 注意双引号内有一个未编码的单引号\n\n```\n\n双引号\n\n```javascript\n\
  var pets = ′One dog one cat′; // 注意这里任意地使用了单引号\n\nvar favourite_expression = ′Don\\\
  ′t count your chickens until they\\′re hatched.′;\n```\n\n在最后一个示例中（借自第 3 章），你使用反斜杠来对单词\
  \ `Don’t` 内部的单引号进行编码。这样做是因为单引号样式也被用于包裹字符串字面量。这被称为`转义`（escaping），将在本章稍后的部分进行详细介绍。能够使用两种类型的包引号仅仅是为了方便，使用其中一种而不是另一种并没有区别。唯一需要记住的是字符串的两端必须使用相同类型的引号。\n\
  \n## 字符串编码\n\n正如我在第 3 章描述的，现代 JavaScript 解释器在语法和字符串上都支持全国际化（`i18n`）。它通过支持 `Unicode`\
  \ 字符标准来实现，这是表示大多数语言的主流国际标准。使用 `Unicode` 时，你必须选择一种编码方案来表示需要多个字节的字符（例如日语汉字符号）。`Unicode`\
  \ 中一种流行的编码方案是 `UTF-8`，它使用单字节来描述拉丁字母中的字符以及原始 256 个 ASCII 符号中的任何内容，但使用二到四字节来描述该子集之外的其他字符。这很重要，因为你不仅可以通过这种方式使应用程序本地化；在底层，你还可以依赖内置的字符串处理函数来安全地处理多字节字符串。这在其他语言中并不总是如此。特别是像\
  \ Ruby 和 PHP 这样的语言，其字符串处理函数在用于 Unicode 时会崩溃而臭名昭著。原始规范中的几个过时函数不支持 Unicode；例如，`escape()`\
  \ 和 `unescape()`（请使用 `encodeURI()` 或 `encodeURIComponent()`）。此外，在基于 Mozilla 的浏览器中，1.3\
  \ 之前的 JavaScript 版本不支持 Unicode。浏览器对 Unicode 的支持包括 Netscape 4.06+、Firefox（所有）、Safari（所有）、Chrome（所有）、Opera\
  \ 7.2+ 以及 Internet Explorer 4.0+。并不意外，浏览器之间的 Unicode 支持并非没有问题。特别是 IE5 被认为在显示阿拉伯语的中形式和末形式存在问题，使其在该用途上毫无用。Safari\
  \ 不允许西里尔字母（俄语文本）斜体。某些基于 Mozilla 的浏览器（包括所有版本的 Netscape）似乎在显示某些下标和上标字符（如希伯来元音符号）存在问题。\n\
  \n在字符串内部，你可以使用`转义序列`（escape sequence）对文本中难以（或不安全）表示的字符进行编码，例如格式符号（回车和制表符）以及键盘上没有的\
  \ Unicode 字符。转义序列以反斜杠开头，然后是一个指示类型的字母。一些基础的格式转义序列如下：![063](img/whit_9780470550502_oeb_063_r1.gif)\n\
  \n例如，如果你想在 `alert()` 框中显示换行符，你可以这样做：\n\n```javascript\nalert(″Hello World!\\nWe\
  \ hope you enjoy this site.″);\n```\n\n这将产生下面的 alert 框，如图 7-1 所示。**图 7-1`![064](img/whit_9780470550502_oeb_064_r1.gif)\n\
  \n正如我们讨论过的，字符串字面量可以使用两种引号创建，只要两端相同即可。在单引号和双引号之间切换可能非常方便。例如，在浏览器中工作时，交替使用单引号和双引号非常有用。由于\
  \ HTML 使用双引号，你可以选择单引号来节省大量字符。例如，考虑以下两个字面量：\n\n```html\n″<textarea cols=30″ rows=10\
  \ name=textarea1″\n\n′<textarea cols=30′ rows=10 name=textarea1′\n```\n\n在第一个例子中，你必须编码双引号，因为那是样式。在第二个例子中，因为你使用了单引号，你可以省略大量编码。Unicode\
  \ 值也一样。Unicode 转义序列以 `\\u` 开头，然后是一个由十六进制定义的十六位数值。例如，`00AE` 表示商标符号。要在字面量中使用这种编码表示它，人们会写\
  \ `\\u00AE`。`\\u0048\\u0065\\u006c\\u006c\\u006f` 将被写作 ″Hello″。如果你想在文本中编码反斜杠，编码仅仅是将两个反斜杠放在一起：\n\
  \n```javascript\n″He was her friend\\\\\n```\n\n如果你不小心创建了一个不存在的转义序列（在任何地方都没有定义的），如\
  \ `\\x`，解释器不会抛出错误，而是仅仅返回反斜杠后的字母。例如，″hello \\world″ 将被解释为 hello world.″如果你在不需要的字符串中错误地编码了引号，该编码将被忽略。看这些示例：\n\
  \n```javascript\n// Don′t worry\n″Don\\′ worry″\n\n// The boat′s name was ″Distant\
  \ Shores″。\n\n′The boat\\s name was \\″Distant Shores″′\n```\n\n在这些示例中，引号被多余编码是因为使用了另一种类型来包裹字面量。解释器将忽略这些编码并返回预期的字符串。\n\
  \n## 字符串中的换行\n\n字符串字面量中也可以包含实际的换行，允许你将字面量跨越代码行。这是通过在换行前加上反斜杠转义序列 `″″` 实现的。下面的示例演示了这一点。Mozilla\
  \ JavaScript 文档指出，这些类型的换行并不意味着字面量本身包含 `\\n` 样式的换行，它们只是允许我们将字面量分散在多行中，就像它们都在同一行一样。但在实践中，情况并非如此。由于此功能似乎存在\
  \ Bug 且不被其他引擎支持，建议不要使用它。\n\n```javascript\nvar lineBreakString = ″Hello \\\n\nWorld″;\n\
  \nvar noLineBreakString = ″Hello World″;\n```\n\n\n\n\n```javascript\n// 在 Mozilla\
  \ 中不会抛出错误，但在其他浏览器中会\n\n// 在 Mozilla 中应该返回 \"true\"\n\ndocument.write( lineBreakString\
  \ == noLineBreakString );\n```\n\n## 字符串的不可变性\n\n字符串的一个有趣（尽管并不总是有用）的特性是它们是`不可变的`（immutable）。这意味着它们的值永远无法被改变。起初，这听起来可能不对，因为你知道你可以修改包含字符串的变量，甚至在它们上执行复杂的操作。这是一个非常底层的考量，仅影响特性在解释器层面的实现方式。不可变对象在编译器或解释器层面通常由指针表示。通常情况下，在具有不可变字符串的语言中，当对字符串进行更改时，编译器会取消原始数据的引用，创建一个带有请求更改的新字符串值，并将新指针分配给字符串对象。这种技术被称为`写时复制`（`COW`）。让字符串等基本数据类型保持不可变性，为并发和内存节省等低层编程问题提供了方便的解决方案。\n\
  \n然而，在 JavaScript 中，发生了更奇怪的事情。它不是将字符串复制到新指针，而是返回一个应用了更改的完全新的字符串对象。每个字符串变异器，包括`replace()`、`slice()`、`split()`、`big()`\
  \ 等，都会让原始字符串对象保持原样并返回一个全新的。这意味着你无法通过`charAt()` 等方法或`Array`表示法（在 Firefox 中）来选择性地修改字符串的部分。例如，尝试执行以下操作将不起作用：\n\
  \n```javascript\n// 这在任何浏览器中都不行\nmyString.charAt(2) = \"A\";\n\n// 这样做也不行\nmyString[2]\
  \ = \"A\";\n```\n\n这对开发者来说，其效果是每个字符串操作在 CPU 和内存上都有内生成本，而且这种成本可能是巨大的。具体有多大将在接下来的章节中解释。这些悬挂在内存中的取消引用字符串还会影响垃圾回收器的性能，垃圾回收器不能总是通过简单的性能测试轻松衡量，因为它与字符串操作是异步的。既然如此，按理来说，开发者可以使用某些技术来提高字符串操作的性能和效率。惊讶的是，在现代浏览器中，情况并不总是如此。原生字符串操作已经进行了大量的优化，使其比以前任何时候都更快，正如你将在接下来的章节中看到的，你只需为工作选择正确的技术就能获益。\n\
  \n## 字符串长度\n\n字符串对象的内置属性和方法的一部分包含了组合字符串、读取字符串部分、搜索字符串以及更改字符串所需的所有工具。最基础的内置属性之一是其字符数长度。这可以通过简单地引用字符串的`length`属性来读取。无论字符串是字面量还是变量，你都可以提取它们的长度属性：\n\
  \n```javascript\nvar myString = \"Hello World\";\n\ndocument.write(myString.length\
  \ + \"<br />\");    // \"11\"\n\ndocument.write(\"Hello World\".length);       \
  \  // \"11\"\n```\n\n`length`属性只测量写入的字符并忽略任何语法标点符号（如编码符号）。例如，字符串`\"\\u0048\\u0065\\\
  u006c\\u006c\\u006f\"` (\"Hello\") 虽然在字面量中看起来有 30 个字母，但返回的长度为 5。格式化转义序列如`\\n`（换行\
  \ - 1 个字符）和`\\t`（水平制表符 - 1 个字符）也是如此。`length`属性适用于 JavaScript 中的所有字符串，而不仅仅是我们自己创建的字符串。例如，你可以轻松地读取`document.title`字符串的长度，就像读取你自己的变量一样。\n\
  \n## 基本数据类型还是对象\n\n在某些语言中，字符串是由许多更多名为`Chars`的原始类型类组成的结构。这把某些其他属性扩展到了`String`类，例如作为`引用类型`的属性。正如第\
  \ 3 章讨论的，引用类型的变量仅仅`指向`或`引用`数据存在的内存位置。此外，正如我之前演示的那样，当你创建引用类型的拷贝时，你仅仅复制了它们的指针，对原始对象的任何更改都会影响任何“副本”。在\
  \ JavaScript 中，具有基本数据类型状态的字符串是通过`值`而不是引用进行复制的，并且不像在其他某些语言那样由特殊的`Char`类数组组成，因为 JavaScript\
  \ 中没有这种类型。例如，如果字符串是引用类型，那么以下操作将无法按预期工作：\n\n```javascript\n// 如果字符串是引用类型，以下操作将不起作用..\n\
  var myString1 = \"Hello World\";\n\nvar myString2 = myString1;\n\nmyString1 = \"\
  Hello Universe\";\n\ndocument.write(myString2); // \"Hello World\"\n```\n\n然而，在\
  \ JavaScript 中既有字符串`基本类型`（primitive），也有`String`对象。在功能上，它们非常相似，但存在细微的差别。创建字符串有多种方法，我们所说的`string`有两个子类。这些是字符串`基本类型`和包装类`String`，后者是一个功能完备的`对象`（object）。首先，看看你可以创建字符串的各种方式：\n\
  \n```javascript\n// 从字面量创建一个简单的字符串基本类型\nvar myStringPrimitive = \"Hello World\"\
  ;\n\n// 使用 String 对象构造函数创建一个更复杂的 String 对象\nvar myStringObject = new String(\"Hello\
  \ World\");\n\n// 我们也可以通过通过省略 \"new\" 关键字来创建一个字符串基本类型..\nvar myStringPrimitive2\
  \ = String(\"Hello World\");\n```\n\n关于构造函数的说明，请参阅第 12 章。你可能会问自己，如果可以在代码中以不同的方式创建字符串，执行其中一种或另一种会有区别吗？答案是带有条件的`是的`（肯定的）。在表面上，所有这些字符串的行为都是相同的。例如，你可以在这些种类型上访问`String`对象的方法和属性：\n\
  \n```javascript\n// 字符串的长度属性可以在变量上访问\n//（无论是基本类型还是对象），也可以在字面量（基本类型的另一种形式）上访问\ndocument.write(myStringPrimitive.length\
  \ + \"<br />\"); // \"11\"\n\ndocument.write(myStringPrimitive2.length + \"<br />\"\
  ); // \"11\"\n\ndocument.write(\"Hello World\".length + \"<br />\");    // \"11\"\
  \n\ndocument.write(myStringObject.length); // \"11\"\n```\n\n但这种实现是因为 JavaScript\
  \ 在需要时会自动将基本类型转换为对象。这不是永久性的更改，只是针对该特定操作的临时转换。在上述使用字符串基本类型长度属性的每个案例中，JavaScript 都将其转换为了对象。这并不意味着它们都是相同的。例如，如果你使用`typeof`写出变量*类型*，你就能立即看出区别：\n\
  \n```javascript\ndocument.write(typeof myStringPrimitive + \"<br />\"); // \"string\"\
  \n\ndocument.write(typeof myStringPrimitive2 + \"<br />\"); // \"string\"\n\ndocument.write(typeof\
  \ \"Hello World\" + \"<br />\");    // \"string\"\n```\n\n\n\n\n\n```javascript\n\
  document.write( typeof myStringObject );    // \"object\"一个正确实例化的对象实例会将自身标识为一个对象。你可以使用\
  \ `valueOf()` 方法从对象中提取原始值：\ndocument.write( typeof myStringObject.valueOf() ); \
  \   // \"string\"\n```\n诚然，每个方法都会创建一个 `String` 对象的实例，并继承必要的方法和属性以对它们执行操作。简单地向变量赋值一个字面量，例如\
  \ `var myVar = \"Hello World!\";`，基本上等同于编写 `var myVar = new String(\"Hello World!\"\
  );`，因为两者在需要时表现得像对象，在作为字面量使用时也像字面量。JavaScript 会会在需要时隐式地将两者相互转换。\n\n通常情况下，由于若干细微的原因，你应该坚持使用字符串的原始版本。首先，字符串原始类型在使用\
  \ `typeof` 查询时（如上一个示例所示）能够正确地识别自身。两者的另一个区别是，它们在通过 `eval()` 作为脚本评估时的表现不同。请看以下示例：\n\
  \n```javascript\n// 字符串对象和原始类型在 eval() 中的行为差异\n\nvar stringPrimitive = \"1 + 1\"\
  ;    // 创建一个简单的数学表达式字符串-原始类型\n\nvar stringObject = new String(\"1 + 1\");    //\
  \ 创建一个包含相同表达式的字符串对象\n\ndocument.write( eval(stringPrimitive) + \"<br />\");    //\
  \ \"2\"\n\ndocument.write( eval(stringObject) );    // 返回字符串 \"1 + 1\"\n```\n配合\
  \ `eval()` 使用，取决于使用的是 `String` 对象还是其原始等类型，会出现不同的结果。最后的考虑可能是一致性。鉴于在某些情况下使用不同的类型会获得不同的结果，你应该标准化其中一种，以避免代码中出现困惑的错误。\n\
  \n## 扩展 String 对象\n\n扩展 `String` 对象是一件非常方便的事，因为在 浏览器中，处理字符串是你最常见的操作之一。在第 6 章中，我介绍了\
  \ `prototype` 属性并展示了如何扩展内置对象类。你也可以对 `String` 类这样做。请看下面的示例，它为字符串对象添加了一个方法来反转字符串中的所有单词。与第\
  \ 6 章一样，你使用 `prototype` 属性和匿名函数将此功能添加到全局 `String` 包装类中。\n\n```javascript\nString.prototype.reverseWords\
  \ = function() {\n\n  var resultString = \"\";\n\n  if (this.length > 0) {\n   \
  \ var StringArr = this.split(\" \");\n    for (var i = StringArr.length-1; i > -1;\
  \ i--) {\n      resultString += StringArr[i];\n      if (i > 0)\n        resultString\
  \ += \" \";\n    }\n  }\n  return resultString;\n}\n```\n注意，你没有将结果写入 `this`。相反，你只是返回结果，开发者可以随心意欲对结果进行处理。这样做是因为字符串是不可变的，因此无法更改。然而，你*可以*在任何类型的字符串上使用此函数，无论是原始类型还是对象：\n\
  \n```javascript\nvar StringObjectInstance = new String(\"This is a test of the String\
  \ prototype.\");\n\nvar StringPrimitiveInstance1 = \"This is a test of the String\
  \ prototype on a primitive.\";\n\nvar StringPrimitiveInstance2 = String(\"This is\
  \ a test of the String prototype on another kind of primitive.\");\n\ndocument.write(StringObjectInstance.reverseWords()\
  \ + \"<br />\");\n\ndocument.write(StringPrimitiveInstance1.reverseWords() + \"\
  <br />\");\n\ndocument.write(StringPrimitiveInstance2.reverseWords() + \"<br />\"\
  );\n\ndocument.write(\"This is a test of the string primitive\".reverseWords());\n\
  ```\n这将产生以下输出：\nprototype. String the of test a is This\nprimitive. a on prototype\
  \ String the of test a is This\nprimitive. of kind another on prototype String the\
  \ of test a is This\nprimitive string the of test a is This\n\n在本章中，你将频繁地使用这种技术来提供有关字符串的常见编程问题的解决方案。\n\
  \n## 字符串拼接\n\n为了将多个字符串组合，你可以使用重载的*连接*运算符（`+`），如下例：\n`String1 + \"blabla\" + String3`\n\
  \n如果你正在追加一个字符串或一组字符串，可以通过使用*连接赋值*运算符（`+=`）来进一步简化，如下所示：\n\n```javascript\n// 使用连接赋值运算符创建一个拼接后的字符串\n\
  \nvar myStr = \"Alexei\";\n\nmyStr += \"Robert\";\n\nmyStr += \"White\";\n\ndocument.write(myStr);\
  \ // \"Alexei Robert White\"\n```\n这等同于编写：\n```javascript\nvar myStr = \"Alexei\"\
  ;\n\nmyStr = myStr + \"Robert\";\n\nmyStr = myStr + \"White\";\n```\n`String` 对象上还有一个名为\
  \ `concat()` 的内置方法。这为 Java 开发者提供了一个语法上类似的便利方法。在功能上，使用连接运算符和 `concat()` 没有任何区别：\n\
  \n```javascript\n// 使用 .concat() 创建一个拼接后的字符串\n\nvar myStr = \"Alexei\";\n\nmyStr\
  \ = myStr.concat(\"Robert\");\n\nmyStr = myStr.concat(\"White\");\n\ndocument.write(myStr);\
  \ // \"Alexei Robert White\"\n```\n\n## 关于性能的说明\n\n多年来，人们对字符串操作的性能投入了关注。Internet\
  \ Explorer 在拼接字符串方面的性能糟糕。某些语言（例如 C#）拥有 `StringBuilder` 类或类似的针对字符串拼接优化的类。由于 JavaScript\
  \ 没有那样的类，因此了解各种技术的优劣对比是非常有用的（见图 7-2）。\n\n\n\n\n\nJavaScript 是一种`loosely typed`（弱类型）语言，这意味着变量可以从一种类型开始（例如，日期），之后变为另一种类型（可能是字符串）。这种弱类型的另一个方面是，变量可以根据其被使用的上下文被解释为一种类型或另一种类型。这方面一个典型的例子是数字和字符串之间几乎是可以互换的。例如，如果你向一个字符串添加一个数字，它会将该数字解释为`as`字符串：``var\
  \ myString = \"Hello Number \" + 9;   // \"Hello Number 9\"` `\n\n但是，在字符串中嵌入更复杂的数学表达式时，你必须小心。考虑以下表达式：``var\
  \ myString2 = \"Hello Number \" + 8+1;   // \"Hello Number 81\"` `\n\n在这里，它将两个数字都解释为字符串，因此它们不会被相加。你可以通过给数学表达式加括号来回避这个问题，使其单独求值：``var\
  \ myString3 = \"Hello Number \" + (8+1);   // \"Hello Number 9\"` `\n\n然而，如果你嵌入了不`包含`加法运算符（加法运算符也重载了用于字符串）的未加括号的数学表达式，解释器将应用它自己的操作顺序来适应你：``var\
  \ myString4 = \"Hello Number \" + 9*1;   // \"Hello Number 9\"` `\n\n同样，当字符串与非字符串数学运算符（如减号或除法符号）一起使用时，解释器首先尝试将字符串值转换为其数值等：``var\
  \ myResult = \"28\" - 4;   // 24` `\n\n`var myResult2 = \"28\" / 4;   // 7` `\n\n\
  # 转换为字符串\n\n当非字符串类型隐式或显式地转换为字符串时，将应用一组特定的规则将该类型表示`as`字符串。你已经知道，在字符串拼接中使用数字会触发向该数字等效字符串的隐式转换。如果你深入研究这个转换规则，你会发现许多需要考虑的场景。例如，将一个通用对象转换为字符串（如下例所示），将输出一个相当没用的通用对象标识标识符：\n\
  \n```javascript\n// 将通用对象转换为字符串\n\n// 首先我们创建对象\n\nvar myObj = {a:true, b:23};\n\n\
  // 下述语句将触发对象到字符串的隐式\n\n// 转换\n\nvar myString = \"The object: \" + myObj;\n\n// 现在我们将结果写入页面\n\
  \ndocument.write(myString);\n\n// \"The object: [object Object]\"\n```\n\n在第 6 章中，我演示了一个用于对象到字符串转换的实用工具函数。现在，请查看将各种数据类型转换为字符串的完整规则：![066](img/whit_9780470550502_oeb_066_r1.gif)\n\
  \n## 比较字符串\n\n在表达式内部比较字符串本质上几乎是数学性的，不需要像 `strcmp()` 或许多人可能在 PHP 和 C++ 等语言中熟悉的类似的工具函数。以下是字符串运算符列表。大多数这些都与比较有关。![067](img/whit_9780470550502_oeb_067_r1.gif)\
  \ 参见附录 A 获取这些运算符的完整引用，包括示例。\n\n## 等效性和字母顺序比较\n\n通过使用重载的等运算符（`==`）测试等效性：\n\n```javascript\n\
  var stringA = \"Hello World\";\n\nvar stringB = \"Hello World\";\n\nvar stringC\
  \ = \"Yellow World\";\n\ndocument.write( (stringA == stringB) + \"<br />\");   //\
  \ true\n\ndocument.write( (stringA == stringC) + \"<br />\");   // false\n```\n\n\
  记住，字符串比较是非常简单的原始字母逐个测试。由于这个原因，像 `('JavaScript' == 'Java' + 'Scr' + 'ipt')` 这样的表达式始终求值为\
  \ true。然而，正如我之前提到的，如果我比较字符串`对象` 而不是原始类型，我将得到一个非常不同的结果：\n\n```javascript\nvar stringA\
  \ = new String('JavaScript');\n\nvar stringB = new String('JavaScript');\n\ndocument.write(stringA\
  \ == stringB);  // \"false\"\n```\n\n这是因为变量 `stringA` 和 `stringB` 根据定义是`对象`，而不是原始类型（正如我之前解释的那样）。因为对象是`引用类型`，所以你不能以这种方式测试等效性。对于原始类型，你还可以按字母顺序测试字符串是否大于或小于其他字符串。这是通过在数学意义上相同的符号来实现的：\n\
  \n```javascript\ndocument.write( (stringA >= stringB) + \"<br />\");   // true\n\
  \ndocument.write( (stringA <= stringC) + \"<br />\");   // true\n\ndocument.write(\
  \ (stringA > stringB) + \"<br />\");   // false\n\ndocument.write( (stringA < stringC)\
  \ + \"<br />\");   // true\n```\n\n每个字母都是按顺序比较的。如果两个字符串在其他方面相等，但一个比另一个长，它将比短的字符串`更大`。如果一个字符串比另一个字符串短，但在字母顺序上更大，它也将比长的字符串`更大`。下面的示例说明了这一点：\n\
  \n```javascript\nvar aaa = \"AAA\";\n\nvar aaaa = \"AAAA\";\n\nvar bb = \"BB\";\n\
  \ndocument.write( (aaa < aaaa) + \"<br />\");   // true\n\ndocument.write( (bb >\
  \ aaaa) + \"<br />\");   // true\n```\n\n## 使用 localeCompare()\n\n在较新的浏览器（Internet\
  \ Explorer 5.5+, Opera 8.0+, Safari 2.0+, Chrome 和 Firefox）中，你已经可以使用一种更高级的特性，在一个调用中直接比较字符串或对象的等效性或字母顺序不等效性。`localeCompare(comparisonString)`\
  \ 方法执行本地字符串比较并返回 `< 0`（小于）、`0`（相等）或 `> 0`（大于），取决于系统的默认排序。使用此方法的简单语句如下所示：\n\n```javascript\n\
  // 使用 localeCompare 检查字符串等效性\n\nvar aa = \"AA\";\n\nvar bb = \"BB\";\n\nif (aa.localeCompare(bb)\
  \ < 0) {\n  document.write(aa + \" is less than \" + bb);\n} else if (aa.localeCompare(bb)\
  \ == 0) {\n  document.write(aa + \" is equal to \" + bb);\n} else if (aa.localeCompare(bb)\
  \ > 0) {\n  document.write(aa + \" is greater than \" + bb);\n}\n```\n\n# 处理字符串\n\
  \n使用字符串处理方法来按摩和格式化所需的字符串并不总是容易的。在本节中，你将探索以实用方式处理字符串的某些技巧——包括一些位于核心 String 对象之外的方法。虽然开箱提供了许多字符串功能，但通过构建这些字符串\
  \ API，你可以提供许多实用的功能。我将建议一些易实现的工具，以便让字符串在应用程序中发挥更多作用。\n\n## 格式化方法\n\n字符串对象的早期特性之一是一组对\
  \ JavaScript 字符串应用 HTML 格式的方法。这些方法在下方，也可以在附录 B 中找到详细示例。大多数方法大约在 Internet Explorer\
  \ 3+、Netscape Navigator 2.0+ 和 Opera 3.0+ 时代引入，并在所有 JavaScript 实现中都可用。![068](img/whit_9780470550502_oeb_068_r1.gif)\n\
  \n## **对字符串应用 HTML 格式**\n\n\n\n\n\n上述的大多数方法都不接受任何参数，因为它们只是将字符串封装在特定的 HTML 标签中。例如，如果你想给一个字符串添加删除线格式，可以使用\
  \ `.strike()`。`″This document is still draft″.strike()`。这将生成以下 HTML：`″<strike>This\
  \ document is still draft</strike>″`。你也可以将它们结合在一起，如下所示：`″This document is still\
  \ draft″.strike().bold()`。变为：`″<b><strike>This document is still draft</strike></b>″`。这样做的好处是，你可以在我们的\
  \ HTML 文本上实现格式，而无需在代码中嵌入实际的 HTML —— 这种方法更容易调试，并且限制了我们将 HTML 代码混杂在源代码中的需求。\n\n`.quote()`\
  \ 方法仅在基于 Gecko 的浏览器中支持。下面的示例演示了在一个简单程序中使用所有基本格式方法。视觉输出将如下：\n\n```javascript\nvar\
