  \ IE5.5+, NN7+) *返回：* document 对象引用，只读。\n- `frameBorder` -- 设置帧周围边框的可见性。（支持: CH1+,\
  \ FF1+, IE4+, NN6+, O7+, SF1+) *返回：* 字符串形式的 \"yes\", \"no\", \"1\", \"0\"，读/写。\n\
  - `height` -- 设置帧的高度。（支持: IE4+) *返回：* Integer，只读。\n- `longDesc` -- 一种可访问属性，提供指向包含该对象更详细描述的文档的\
  \ URL。（支持: CH1+, FF1+, IE6+, NN6+, O6+, SF1+) *返回：* String，读/写。\n- `marginHeight`\
  \ -- 帧与其内容之间边距的高度。（支持: CH1+, FF1+, IE6+, NN6+, O7+, SF1+) *返回：* Integer，读/写。\n-\
