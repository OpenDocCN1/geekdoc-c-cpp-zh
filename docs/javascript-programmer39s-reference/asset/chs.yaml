  - `strictErrorChecking` -- 如果强制错误检查则返回 true，否则返回 false。（支持: FF1.5+）*返回：* 布尔值，只读。\n\
  - `styleSheets[]` -- 返回文档上的样式表列表。（支持: CH1+, FF1+, IE4+, NN6+, O6+, SF1+）*返回：* 数组，只读。\n\
  - `title` -- 当前文档的标题。（支持: CH1+, FF1+, IE3+, NN2+, O5+, SF1+）*返回：* 字符串，可读/写。\n- `URL`\
  \ -- 返回包含当前文档 URL 的字符串。（支持: CH1+, FF1+, IE4+, NN3+, O6+, SF1+）*返回：* 字符串，只读。\n- `URLEncoded`\
  \ -- 将所有字母数字字符转换为转义字符的 `document.URL`。（支持: IE5.5+）*返回：* 字符串，只读。\n- `vlinkColor`\
  \ -- 获取并设置已访问链接的颜色。（支持: CH1+, FF1+, IE3+, NN2+, O3+）*返回：* 字符串，可读/写。\n- `width` --\
  \ 返回当前文档的宽度。（支持: FF1+, NN4+）*返回：* 整数，只读。\n- `xmlEncoding` -- 根据 XML 声明确定的编码。（支持:\
