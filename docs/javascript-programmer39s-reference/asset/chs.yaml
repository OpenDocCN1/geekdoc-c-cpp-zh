  \       {\n            string: navigator.vendor,\n            subString: \"Camino\"\
  ,\n            versionSearch: [\"Camino/\"],\n            identity: {name: \"Camino\"\
  , basetype: \"mozilla\"}\n        },\n        {\n            // 针对 Netscapes (6+)\n\
  \            string: ua,\n            subString: \"Navigator\",\n            versionSearch:\
  \ [\"Navigator/\"],\n            identity: {name: \"Netscap\", basetype: \"mozilla\"\
  }\n        },\n        {\n            string: ua,\n            subString: \"MSIE\"\
  ,\n            identity: {name: \"Explorer\", basetype: \"ie\"},\n            versionSearch:\
  \ [\"MSIE\"]\n        },\n        {\n            string: ua,\n            subString:\
  \ \"Gecko\",\n            identity: {name: \"Mozilla\", basetype: \"mozilla\"},\n\
  \            versionSearch: [\"rv\"]\n        },\n        {\n            // 针对旧版本的\
  \ Netscapes (4-)\n            string: ua,\n            subString: \"Netscape\",\n\
  \            versionSearch: [\"Netscape/\"],\n            identity: {name: \"Netscape\"\
  , basetype: \"mozilla\"}\n        }\n    ];\n    function setBrowserIdentity(identity)\
  \ {\n        for (key in identity.identity) {\n            that[key] = identity.identity[key];\n\
  \        }\n        // 执行版本检测\n        for (key in identity.identity) {\n      \
  \      that[key] = identity.identity[key];\n        }\n        // (此处内部代码逻辑简化，保持与原文一致)\n\
  \    }\n    // ... \n```\n\n这将提供一个包含许多你可以直接查询的属性的对象实例。在示例中使用该类，你可以看到直接查询 `browser.ie`\
  \ 是比每次都进行功能检查或检查 `navigator.userAgent` 要简单得多：\n\n```javascript\nbrowser = new BrowserSniff();\n\
  \ndocument.write(\"name: \" + browser.name + \"<br />\");\ndocument.write(\"version:\
  \ \" + browser.version + \"<br />\");\ndocument.write(\"iPhone: \" + browser.iPhone\
  \ + \"<br />\");\ndocument.write(\"BlackBerry: \" + browser.BlackBerry + \"<br />\"\
  );\ndocument.write(\"language: \" + browser.language + \"<br />\");\ndocument.write(\"\
  os: \" + browser.os + \"<br />\");\ndocument.write(\"osver: \" + browser.osver +\
  \ \"<br />\");\ndocument.write(\"basetype: \" + browser.basetype);\n```\n\n在 Mac\
  \ OSX 上的 Firefox 3 中，这产生如下输出：\n```\nname: Firefox\nversion: 3.05\n\niPhone: undefined\n\
  \nBlackBerry: undefined\n```\n\n\n\n\nlanguage: en-US\nos: Macintosh\nosver: X\n\
  basetype: mozilla\n\n使用此类类，你拥有足够的信息来分叉你的代码，以支持用户可能提供的任何平台。当然，随着新浏览器的发布，你可能需要更新此脚本以支持不同的搜索模式。\n\
  \n# 窗口事件\n\n`window` 对象还支持许多事件。其中许多是特定于浏览器的私有事件。在第 12 章中，我演示了如何以非侵入的方式绑定事件。你也可以通过引用其所属的对象的属性（在本例中为\
  \ `window` 对象）来直接绑定事件。例如，如果你想在窗口加载完成文档时执行某些代码，可以写：\n\n```javascript\nwindow.onload\
  \ = function() { alert('Loaded!'); };\n```\n\n你可以随时跳到第 12 章查看如何正确地绑定这些事件。现在，这里是所有窗口事件及其已知的浏览器支持列表：\n\
  \n![124](img/whit_9780470550502_oeb_124_r1.gif)\n![125](img/whit_9780470550502_oeb_125_r1.gif)\n\
  \n# 总结\n\n本章回顾了将 浏览器作为 JavaScript 的执行上下文。它涵盖了与窗口、框架和其他高层浏览器特定功能相关的许多主题：\n\n* 你查看了框架和窗口如何与全局对象交互，以及如何从父到子、从子到子以及子到父来引用它们。\n\
  * 你涵盖了打开和关闭新窗口，以及对它们进行定位和调整大小。\n* 你学习了如何滚动窗口。\n* 你查看了大多数浏览器常见的各种内置对话框类型，包括 `alert()`、`confirm()`\
  \ 和 `prompt()`。\n* 你学习了浏览器功能检测以及用户代理（user-agent）浏览器和操作系统的检测基础。\n* 最后，你涵盖了窗口事件的基础以及如何绑定到它们。在第\
  \ 12 章中，我们将介绍更高级的事件绑定，这些绑定也可以应用于窗口事件。\n\n在第 12 章中，你将学习 JavaScript 事件模型，以及它在基于标准的浏览器和\
  \ Internet Explorer 之间的区别。你将涵盖事件冒泡、非侵入式 JavaScript、事件复制以及高级事件绑定（如窗口的 `\"domready`），以及鼠标和键盘事件。\n\
  \n## 事件\n\n在一个没有 JavaScript 的世界里，网页上拥有的只有静态、不变的布局和内容。浏览器脚本增加了一个动态维度，允许你响应用户输入并周期性地更改页面状态。事件是将\
  \ HTML 和 CSS 的静态世界与 JavaScript 机制结合在一起的纽带。每当页面上*发生*某些事情时，例如点击按钮、滚动窗口或移动鼠标，一个 JavaScript\
  \ *事件* 可能也被触发了。某些事件即使在没有用户帮助的情况下触发。例如，当窗口加载完成时会触发 `\"load\"` 事件，当图像源无法下载时，图像上会触发\
  \ `\"error\"` 事件。\n\n在像 JavaScript 这样的事件驱动型编程语言中，程序执行通常有两个阶段。第一个阶段是事件定义阶段，在这一阶段你设置环境、执行某些初始代码、定义初始视图，并绑定到任何可能触发后续代码执行的后续程序事件。在网页上，这对应于浏览器对文档的初始解析。在此期间，页面中内联的任何\
  \ JavaScript 一旦被发现就会执行（大部分情况下）。这通常包括一些需要下载的外部 JavaScript 文件。它们也会按照出现的顺序进行解析。然而，通常在这个阶段执行的实际代码很少。通常，你做的是将所有的代码绑定到页面上的事件上以备稍后执行。第二个阶段当然是实际的事件执行。这是窗口或浏览器触发预定义事件，并执行与它们相关的任何代码的时候。你完全可以想象，页面上的许多不同对象上触发了许多不同的事件。事实上，浏览器拥有极其丰富的事件模型，你需要变得熟悉它。\n\
  \n遗憾的是，这个事件模型是该语言的大痛点之一，因为 Internet Explorer 与 Firefox、Opera、Chrome 和 Safari 等基于标准的浏览器之间存在显著差异。你可以将这些差异追溯到事件模型的最早版本，它出现在\
  \ Netscape Navigator 2 中。这个现代事件模型的早期先驱只支持少数基本事件，如 `mouseover`、`mouseout` 以及表单验证事件如\
  \ `\"focus\"`、`\"blur\"` 和 `\"submit\"`。这些事件也被称为*内联*（inline）事件绑定，因为它们直接定义在 HTML\
  \ 内部：\n\n```html\n<a href=\"http://www.lycos.com\" onclick=\"alert('Thanks for visiting!');\"\
  >Search on Lycos</a>\n```\n\n此时还没有 DOM 或 JavaScript *标准*，因此 Netscape 实际上正在编写第一套所有其他浏览器都必须支持的\
  \ JavaScript 事件模型事实规范（de facto specification）。它非常简单，但这些事件和连接它们的样式在如今的浏览器中仍然被支持。事实上，直到\
  \ 2000 年 DOM 层级 2 发布，一直不存在正式的规范。到那时，Netscape 和 Internet Explorer 都发明了自己独特的事件绑定样式。在\
  \ 2000 年左右，浏览器社区的趋势转向了基于标准的浏览器，Mozilla、Opera 最终 Safari 都选择开始向其发布的事件模型标准移动。这让微软被“晾在了冷外”（打个比方），他们仍然是唯一一个使用完全私有事件模型的供应商。当然，微软和\
  \ Mozilla 最终都超越了内联事件绑定。在 Netscape 4 和 Internet Explorer 4 中，可以完全从 JavaScript 连接到事件。你不再需要在\
  \ HTML 中散布数百个混乱的事件绑定，而是可以在你的表示层和页面上的任何脚本之间提供某种分离。\n\n\n\n\n尽管我提到了许多差异，但各种事件模型之间存在许多共同点。我将这些通用的共享特征称为\
  \ `basic event model`（基础事件模型）。这些特征之一是 (X)HTML 中的大多数元素有一组共同的 `event bindings`（事件绑定）。这些绑定等于事件名称（例如\
  \ `mouseover`）加上单词 `on`。在之前的示例中，当我们使用 `onclick=\"alert('Thanks for visiting!');\"\
  ` 链接一个超链接的 `click` 事件时，浏览器会将`event handler`（即代码 `alert('Thanks for visiting!');`）与`event`（即单词\
  \ `click`）关联起来。大多数事件都是这样以描述性命名的，该单词非常清楚地指示了将触发它的因素——例如 `mouseout`、`submit`、`dblclick`\
  \ 等。另一些则没有那么明显：`domready`、`blur`、`reset` 等。\n\n关于哪些事件会在哪些元素上触发，有一些规则。例如，页面上的不可见元素没有\
  \ `blur` 事件，而 `change` 事件仅限于属于表单的一小部分元素。接下来的表格提供了常见事件绑定的简短列表，以及它们通常在 HTML 和 XHTML\
  \ 中支持的元素：\n\n![126](img/whit_9780470550502_oeb_126_r1.gif)![127](img/whit_9780470550502_oeb_127_r1.gif)\n\
  \n在本章的后半部分，我将详细介绍私有事件和 DOM 事件及其浏览器支持的更详细分解。\n\n# 基础事件注册\n\n通过 Netscape 3 和 Internet\
  \ Explorer 4，浏览器开始远离传统的内联事件绑定模型。这样做是为了对事件处理程序进行程序化控制（能够设置它们并在稍后更改它们），并增加 JavaScript\
  \ 与 HTML 之间的分离。这当然是一件好事，因为它意味着你拥有了更多控制权，而且调试所有集中在一个处的代码更加容易。\n\n在这种情况发生之前，绑定事件的唯一方法是使用\
  \ HTML 属性处理事件，并指定一个在事件发生时进行求值的字符串。例如：\n\n### 内联事件注册\n\n```html\n<script type=\"\
  text/javascript\">\nfunction checkForm(formObj) {\n    // 取消表单提交\n    return false;\n\
  }\n</script>\n\n<form onsubmit=\"return checkForm(this)\">\n    <input type=\"submit\"\
  \ value=\"Click me to submit!\">\n</form>\n```\n\n这种语法在今天是被支持的。在前面的示例中，当用户提交表单时，`onsubmit`\
  \ 属性指定的代码会执行，并将 `this` 作为参数传递（引用表单对象）。这非常基础，但在我拥有 JavaScript 绑定之前，这是我唯一能做的事。\n\n\
  随后出现了所谓的 `traditional event registration`（传统事件注册），也被称为 `programmatic event registration`（程序化事件注册）。在这里，你直接使用\
  \ JavaScript 将事件处理程序分配到 DOM 节点的事件属性上。虽然我还没有详细讨论 DOM，但你只需要知道文档是由表示页面上所有结构和内容的节点组成的。DOM\
  \ 节点也可以直接向它们绑定事件：\n\n```javascript\nfunction myClickHandler(e) {}\n\nmyDOMNode.onclick\
  \ = myClickHandler;\n```\n\n当由标识符 `myDOMNode` 引用的 DOM 元素被鼠标或键盘点击时，会触发点击事件，`myClickHandler()`\
  \ 也会随之触发。注意：在使用这种方法时，*不要*在函数标识符后包含括号。当调用 `myClickHandler()` 时，在非 Explorer 浏览器中，事件对象\
  \ `e`（在这种情况下，尽管它可以被命名为任何名称）将作为第一个参数传递。如果你想向你的函数传递更多数据，可以使用匿名函数封装你对 `myClickHandler()`\
  \ 的调用：\n\n```javascript\nfunction myClickHandler(e, name) { alert(\"Hi \" + name);\
  \ }\n\nmyDOMNode.onclick = function(e) { myClickHandler(e, \"Jimmy\"); };\n```\n\
  \n要完全移除事件处理程序，你可以给它分配 `null`：\n\n```javascript\nmyDOMNode.onclick = null;\n```\n\
  \n由于 `onclick` 实际上只是一个函数引用，你也可以程序化地*像调用函数一样*调用它：\n\n```javascript\nif (myDOMNode.onclick)\n\
  \    myDOMNode.onclick();\n```\n\n这种方法的主要缺点是你只能为每个事件处理程序绑定 `one function`（一个函数）。没有理由这应该是一个限制，这就是为什么你现在在浏览器中拥有更先进的事件模型，它被称为\
  \ `unobtrusive model`（非侵入式模型）。我稍后会讨论这一点。\n\n## this 关键字\n\n你已经学习了一些关于 `this` 关键字以及它如何应用于对象上下文的知识。在用传统事件模型处理事件时，它也具有重要的意义。请记住，这仅适用于特定的特定的事件方式。具体来说，当你在事件处理程序内部使用\
  \ `this` 时，你指的是 `owner object`（所有者对象）。例如，如果你向一个 `DIV` 绑定事件并在事件处理程序内部使用 `this`，它指的是该\
  \ `DIV`：\n\n```html\n<head></head>\n<body>\n<!-- 内联事件注册 -->\n<div>Hi, I am div #1</div>\n\
  <div>Hi.. I'm also a div.</div>\n<div>Don't forget me!</div>\n\n<script>\n// 获取页面上所有\
  \ DIV 的数组。\nvar divList = document.getElementsByTagName(\"div\");\n\n// 遍历每一个 div\n\
  for (var i = 0; i < divList.length; i++) {\n    divList[i].onmouseover = function()\
  \ {\n        this.style.backgroundColor = \"yellow\";\n    };\n    divList[i].onmouseout\
  \ = function() {\n        this.style.backgroundColor = \"transparent\";\n    };\n\
  }\n</script>\n</body>\n</html>\n```\n\n在这个示例中，我使用 `document.getElementsByTagName(\"\
  div\")` 获取了页面上的 DIV（三个）。在第 13 章我将解释它是如何工作的。对于每一个项，你绑定了当鼠标悬停或离开时触发的事件。\n\n# 防止默认行为\n\
  \n当你对某些行为绑定事件时（例如超链接的 `click` 或表单的 `submit` 事件），除了你的代码外，还需要考虑默认行为。例如，当你为超链接的 `click`\
  \ 绑定某些代码时，你的代码会先执行，但在之后超链接本身会执行点击并跳转。同样，在表单情况下，在你代码执行后，表单会继续提交到服务器：\n\n```html\n\
  <a href=\"http://www.google.com\" onclick=\"sayGoodbye()\">Click to leave</a>\n\
  ```\n\n如果你不想这种情况发生怎么办？无论你是*如何*绑定事件（使用传统的还是非侵入式的注册），只要你的事件处理程序在默认行为计划之前执行，就可以覆盖这种默认行为。在超链接的情况下，你可以通过在事件处理程序代码的末尾添加\
  \ `return false` 来防止默认操作：\n\n```html\n<a href=\"http://www.google.com\" onclick=\"\
  sayGoodbye(); return false\">Click to leave</a>\n```\n\n如果你想将返回值整合到 `sayGoodbye()`\
  \ 中，你可以这样重构它：\n\n```html\n<script type=\"text/javascript\">\nfunction sayGoodbye()\
  \ {\n    return false;\n}\n</script>\n\n<a href=\"http://www.google.com\" onclick=\"\
  return sayGoodbye()\">Click to leave</a>\n```\n\n这防止了链接被跟随。对于任何内联的事件也是如此。如果你使用程序化事件注册，不需要在绑定中包含\
  \ `return`：\n\n```javascript\nfunction sayGoodbye() {\n    return false;\n}\n```\n\
  \n\n\n\n`myLinkObj.onclick = sayGoodbye;` 但需要注意的是，并不是所有的默认操作都可以停止。例如，出于显而易见的原因，你无法阻止用户关闭窗口或输入新地址时离开页面。当然，从原则上讲，你不应该允许这样做，但这无关紧要。\n\
  \n从你的事件处理程序中返回 `false` 是防止默认行为的最通用方法。取决于你使用的事件模型，还有其他方法。例如，在 Firefox 和 Safari 等基于标准的浏览器中，事件对象包含一个名为\
  \ `preventDefault()` 的方法，可以实现相同的目标。在 Internet Explorer 中，事件对象有一个名为 `returnValue`\
  \ 的属性，可以可以将其设置为 `false` 来实现相同的操作。不过，如果你想处理这两种情况，通常从事件处理程序中返回 `false` 会更容易。\n\n#\
  \ 非侵入式 JavaScript (Unobtrusive JavaScript)\n\n这引出了另一个完全不同的主题，即所谓的“非侵入式 JavaScript”。在\
  \ Web 开发早期，人们对浏览器脚本编程有很多批评。这些批评通常属于以下三大类关注点：\n* JavaScript 将标记（HTML 和 CSS）与代码混合在一起，使得调试和管理变得困难。\n\
  * 对于有无障碍需求的用户，JavaScript 造成了可用性上的障碍。\n* 对于没有启用 JavaScript 的用户（出于任何原因），需要 JavaScript\
  \ 的页面将会崩溃。\n\n仅由于这些原因，许多 Web 应用在编写时完全没有使用任何 JavaScript。虽然自这种做法成为常态以来 Web 并没有发生太大变化，但你的开发方法已经发生了。一场运动正朝着一种耦合更少、内联更少、对用户假设更少的编程风格发展。。非侵入式编程寻求实现以下三个目标：\n\
  * 将 Web 页面的结构和内容（“表现层”）与功能分离，以保持代码组织的整洁，并减少为了功能运行对 JavaScript 的依赖。\n* 渐进增强页面，确保在用户没有启用\
  \ JavaScript、使用过旧浏览器或使用屏幕阅读器时，页面不会崩溃。\n* 采用某些解决浏览器不一致性问题的最佳实践。\n\n除了许多通用实践（如使用抽象层、避免全局变量、一致的命名约定和熟悉的设计模式之外），非侵入式开发的一个关键策略是使用高级的事件注册技术。这样做是为了给\
  \ HTML 元素附加丰富的功能，同时在由于某些原因无法执行该 JavaScript 时，仍保留某种默认行为。\n\n考虑以下示例。这里有一个在“click”事件上具有内联事件绑定的链接。当用户点击链接时，页面将重定向到一个空哈希（#”），这实际上什么都没做，然后触发\
  \ `showDHTMLDialogue()`，可能是为了向用户展示某种屏幕对话框而无需刷新页面：\n\n```html\n<a href=\"#\" onclick=\"\
  showDHTMLDialogue('/ajax/askquestion.php'); return false;\">告诉我们你的名字</a>\n```\n\n\
  假设用户浏览器足够新、没有使用屏幕阅读器并且可以运行 JavaScript，这看起来可能很好。如果不是，你可能失去了一个用户。当然，你无法取悦所有人，但只要稍加努力就可以以非侵入式的方式设计这种交互，让每个人都不损失。这个超链接破坏了非侵入式编程的三大原则中的两个：关注点分离和渐进增强。接下来，我将向你展示如何使用非侵入式事件注册重新设计这种交互。\n\
  \n# 非侵入式事件注册\n\n微软 和 W3C 都意识到传统的事件模型对于 Web 来说是不够的，它们必须对其进行现代化，以便允许每个事件有多个处理器，并对事件捕获阶段进行更细粒度的控制（这涉及到冒泡，我稍后会讨论）。不幸的是，微软自自走了一条路，而\
  \ W3C 走了另一条路。总的来说，它们实现了相同的目标。\n\n正式的事件模型在 2000 年的 W3C DOM Level 2get 中引入，适用于 Internet\
  \ Explorer 之外的所有浏览器。该模型的基石有两个方法：`addEventListener()` 和 `removeEventListener()`。它们的语法如下：\n\
  \n```\ntargetElement.addEventListener(type, listener, useCapture);\ntargetElement.removeEventListener(type,\
  \ listener, useCapture)\n```\n\n这里我们感兴趣的第一项是 `targetElement`。这是你希望附加事件的 DOM 节点、窗口或文档对象，或\
  \ `XMLHttpRequest` 对象。`type` 是一个表示我们要附加的事件类型的字符串（例如“click”或 mouseover）。`listener`\
  \ 是一个处理事件的函数引用，而 `useCapture` 指你希望处理的事件传播方向。我稍后会讨论事件冒泡。简单来说，当 `useCapture` 为 `true`\
  \ 时，事件监听器将在 DOM 树中其下方的任何监听器之前接收到事件。\n\n通过这个快速示例使用这种方法，你可以看到将传统的事件绑定交换为 `addEventListener()`\
  \ 是多么简单：\n\n```html\n<html>\n<head></head>\n<body>\n内联事件注册\n<div>Hi, I am div #1</div>\n\
  <div>Hi.. I'm also a div.</div>\n<div>Don’t forget me!</div>\n<script>\nvar divList\
  \ = document.getElementsByTagName(\"div\");\nfor (var i = 0; i < divList.length;\
  \ i++) {\n    divList[i].addEventListener(\"click\", makeYellow, false);\n}\nfunction\
  \ makeYellow(e) {\n    this.style.backgroundColor = \"yellow\";\n}\n</script>\n\
  </body>\n</html>\n```\n\n在这里，你遍历了页面上所有的 div 标签，并为每个标签添加了“click”事件监听器，使 `makeYellow`\
  \ 函数成为该事件处理器。当用户点击 div 时，它会变成黄色。注意，尽管你在事件处理程序中继续使用 `this` 关键字，这种方法仅适用于 W3C 事件模型。要从\
  \ DOM 节点中移除这些事件，只需遍历它们并使用 `removeEventListener()`：\n\n```javascript\nfor (var i\
  \ = 0; i < divList.length; i++) {\n    divList[i].removeEventListener(\"click\"\
  , makeYellow, false);\n}\n```\n\n要从节点移除特定的监听器，你必须使用附加时使用的完全参数——相同的函数引用和 `useCapture`\
  \ 样式。如果节点上附加了两个事件，一个 `useCapture == false` 另一个 `useCapture == true` 但其他方面相同，必须分别移除。如果你出错并尝试移除一个不存在的事件监听器，`removeEventListener()`\
  \ 将静默失败而不会产生异常。\n\n在 Internet Explorer 世界中，你有两个基本相同的方法。它们是 `attachEvent()` 和 `detachEvent()`：\n\
  \n```\ntargetElement.attachEvent(type, listener)\ntargetElement.detachEvent(type,\
  \ listener)\n```\n\n在 Internet Explorer 模式下，目标对象 `targetElement` 也是你要附加元素的 DOM 节点，`type`\
  \ 是事件类型（但在所有事件名称前都需要前缀“on”），`listener` 是作为事件监听器的函数引用。如果你重写示例以支持 Internet Explorer，它看起来可能像这样：\n\
  \n```html\n<html>\n<head></head>\n<body>\n内联事件注册\n<div>Hi, I am div #1</div>\n<div>Hi..\
  \ I'm also a div.</div>\n<div>Don’t forget me!</div>\n<script>\nvar divList = document.getElementsByTagName(\"\
  div\");\nfor (var i = 0; i < divList.length; i++) {\n    divList[i].attachEvent(\"\
  onclick\", makeYellow);\n}\nfunction makeYellow(e) {\n    e.srcElement.style.backgroundColor\
  \ = \"yellow\";\n}\n</script>\n</body>\n</html>\n```\n\n\n\n\n这里的一切看起来大体上都是那样的，除了\
  \ `attachEvent()` 缺少 `useCapture` 参数外，以及你的 `makeYellow()` 函数也发生了变化。你不再使用 `this`\
  \ 关键字，而是使用 `e.srcElement`。这是因为 IE 中的事件监听器是被引用而非复制的，因此为了访问目标元素而引用 `this` 是没有意义的。相反，你必须使用事件对象的\
  \ `srcElement` 属性，该属性是作为参数传递给你的处理函数的。你很快就会探索事件对象。\n\n# 检查事件监听器\n\n在传统的事件模型中，你可以检查事件处理程序以查看它上是否绑定了任何内容。例如，你只需通过以下方式找到并移除\
  \ `onclick` 事件上的处理器： \n\n```javascript\nif (myElement.onclick) {\n    myElement.onclick\
  \ = null;\n}\n``` \n\n遗憾的是，使用非侵入式（unobtrusive）的方法没有获取处理程序列表的方法。在 DOM Level 3 事件模型（尚未被采用）中，有一个名为\
  \ `eventListenerList()` 的方法，它可以返回一个事件处理程序的数组，但目前尚未被任何浏览器支持。\n\n# 事件对象\n\n当事件触发时，JavaScript\
  \ 会自动向事件处理器传递一个参数，其中包含一个事件对象的实例。该对象提供了许多关于发生什么的关键信息，并让你对接下来将发生的情况进行某些控制。事件对象的具体属性取决于你讨论的是\
  \ DOM 2 事件模型还是 IE 事件模型。\n\n在 Internet Explorer 中，你有以下核心属性可用：\n![128](img/whit_9780470550502_oeb_128_r1.gif)![129](img/whit_9780470550502_oeb_129_r1.gif)\n\
  \nDOM 2 事件模型在事件对象上定义了以下核心属性。这适用于非 Internet Explorer 浏览器：\n![130](img/whit_9780470550502_oeb_130_r1.gif)![131](img/whit_9780470550502_oeb_131_r1.gif)\n\
  \n## 获取事件类型\n\n获取事件类型（例如 `click`、`mouseover` 等）只需检查 `event.type` 属性即可。这将返回一个字符串，并且在两种事件模型中都支持：\n\
  \n```javascript\nfunction handleEvent(e) {\n    alert(e.type);\n}\n```\n\n## 获取目标\n\
  \n目标是触发事件的元素。在两个模型中获取目标的方法略有不同。在 Internet Explorer 中，你检查 `srcElement` 属性，但在 DOM\
  \ 2 中你检查 `target`：\n\n```javascript\nfunction handleEvent(e) {\n    var target =\
  \ e.target || e.srcElement;\n    // 下面一行是为了针对文本节点的 safari  bug\n    if (target.nodeType\
  \ == 3)\n        target = target.parentNode;\n}\n```\n\n在前述示例的最后部分，你检查了 `nodeType`\
  \ 属性以判断它是否为文本节点。如果是，你将 `target` 赋值为该节点的父节点（或所有者）。这是为了补偿 Safari 中关于文本节点的一种奇特行为，即文本节点本身（而不是容器）变成了目标。\n\
  \n## 获取鼠标按键\n\n关于鼠标，你可能想知道两类通用信息。一个是按了哪个按钮。这可以通过 `button` 属性来确定。然而，数字代码取决于你是否在 Internet\
  \ Explorer 中。IE 的按键代码如下：\n![132](img/whit_9780470550502_oeb_132_r1.gif)\n\n然而，在其他浏览器中，你有这些代码：\n\
  ![133](img/whit_9780470550502_oeb_133_r1.gif)\n\n获取事件的鼠标坐标要困难得多，并且涉及大量的跨浏览器问题。\n\
  \n# 跨浏览器事件工具\n\n现在你已经知道如何在几乎所有浏览器中非侵入式地绑定事件，请看一个通过单一接口完成所有操作的简单事件工具。该接口通过*特性检测*检查哪种事件模型可用并使用那一个：\n\
  \n```javascript\nfunction addEvent(target,eventType,eventHandler) {\n    if (target.addEventListener)\n\
  \        target.addEventListener(eventType,eventHandler,false);\n    else if (target.attachEvent)\n\
  \        target.attachEvent('on' + eventType, eventHandler);\n}\n\nfunction removeEvent\
  \ (target, eventType, eventHandler) {\n    if (target.removeEventListener)\n   \
  \     target.removeEventListener (eventType, eventHandler, false);\n    else if\
  \ (target.detachEvent)\n        target.detachEvent('on'+eventType, eventHandler);\n\
  }\n```\n\n注意，我在 Internet Explorer 绑定中在 `eventType` 参数后添加了单词 `\"on\"`。这是因为在 DOM 事件绑定中，你可以通过名称引用事件（例如\
  \ `click`、`mouseover`），但在 Internet Explorer 中你必须在事件名称前加上 `on`。\n\n# 事件传播\n\n关于事件还有一个我尚未解释的方面。这就是事件在触发时会进行*传播*的理念。当用户点击文档中的一个\
  \ DIV 时，说用户点击了文档还是点击了 DIV 更准确？事实上，两者都是正确的。通过点击*属于*文档的 DIV，用户实际上点击了两者。有时，这种想法必须与你的事件模型相协调。\n\
  \n当微软和网景引入各自的*现代*事件模型时，它们都引入了*事件传播*的概念。如果一个事件不仅在元素上触发，还会在其所属的每个父元素上触发——一直向上传播到直到文档（可能还有窗口），这必须以一种可预测的方式发生，并且你应该有办法控制这种事件。\n\
  \n遗憾的是，微软和网景以某种冲突的方式解决了这个问题。微软决定，当事件在 DIV 上触发时，它随后会在该节点的父节点上触发，然后在*该*节点的父节点上触发——一直向上直到直到到达顶级对象，即窗口（实际上是文档元素，但在\
  \ IE 6.0 中他们将其扩展到了窗口）。这种从底向上的事件传播被称为*冒泡*，因为它就像从海洋底部释放的泡泡，逐渐向海面移动（参见图 12-1）。\n\n\
  如果你的文档所示，并且你在每个节点上都附加了内联事件监听器，你将看到它们从*最具体*的元素到*最不具体*的元素触发：\n\n```html\n<html>\n\
  <head></head>\n<body onclick=\"alert('body')\">\n    <div onclick=\"alert('div 1')\"\
  >\n        <div onclick=\"alert('div 2')\">\n            <div onclick=\"alert('div\
  \ 3')\">\n                我在 div 内部。\n            </div>\n        </div>\n    </div>\n\
  </body>\n</html>\n```\n\n\n\n\n\n当你点击最内层 `DIV` 中的文本时，告的顺序将是 3, 2, 1, body。在 Internet\
  \ Explorer 或 Firefox 等 W3C 标准浏览器中确实如此，但这些其他浏览器在底层实现上略有不同。虽然使用传统的事件模型进行这种内联事件绑定被视为仅限冒泡的事件，但当你使用非侵入模型（unobtrusive\
  \ model）时，事件将向*两个*方向移动。这些浏览器并不是简单地让事件从最特定到最不特定冒泡，而是从最不特定的事件开始，传播到目标元素（称为*捕获阶段*），*然后*调转方向并将事件再次冒泡回顶部（参见图\
  \ 12-2）。这样做是为了根据你如何定义事件绑定，在任何方向上拦截事件。\n\n图 12-2![135](img/whit_9780470550502_oeb_135_r1.gif)\n\
  \n由 Mozilla、Opera 7+ 和 Safari (WebKit) 采用的 W3C 模型允许根据你在*捕获*阶段还是*冒泡*阶段绑定事件，来控制事件处理器的执行*顺序*。请参见图\
  \ 12-3 以查看事件在往返过程中的捕获阶段和冒泡阶段的说明。\n\n图 12-3![136](img/whit_9780470550502_oeb_136_r1.gif)\n\
  \n复习 `addEventListener()` 和 `removeEventListener()` 的语法，你可以看到每个函数的第三参数定义了你是否会在*捕获*阶段执行此操作：\n\
  \n```javascript\ntargetElement.addEventListener(type, listener, useCapture);\ntargetElement.removeEventListener(type,\
  \ listener, useCapture)\n```\n\n如果 `useCapture == false`，则你是在*冒泡*阶段绑定到事件；否则，你是在*捕获*阶段进行绑定。为了在实践中说明这一点，请看另一个示例：\n\
  \n```html\n<html>\n<head></head>\n<body>\n    <div id=\"div1\">\n        <div id=\"\
  div2\">\n            我是在一个 div 内部。\n        </div>\n    </div>\n<script type=\"\
  text/javascript\">\nvar div1 = document.getElementById(\"div1\");\nvar div2 = document.getElementById(\"\
  div2\");\ndiv1.addEventListener(\"click\", eventHandler1, true);\ndiv1.addEventListener(\"\
  click\", eventHandler3, false);\ndiv2.addEventListener(\"click\", eventHandler4,\
  \ true);\ndiv2.addEventListener(\"click\", eventHandler2, false);\n\nfunction eventHandler1()\
  \ {}\nfunction eventHandler2() {}\nfunction eventHandler3() {}\nfunction eventHandler4()\
  \ {}\n</script>\n</body>\n</html>\n```\n\n在这里，你将“click”事件绑定到了两个 DIV 上，一个在另一个内部（`div2`\
  \ 在 `div1` 内部）。对于 `div1` 事件，你是在*捕获*阶段（或初始阶段）绑定的。对于另一个，你是在*冒泡*阶段（或次阶段）绑定的。当用户点击 `div2`\
  \ 时，会发生以下事件序列：\n\n1. 捕获阶段开始。事件从 DOM 顶部（document）向 `div2` 移动，并在途中检查事件处理器。\n2. 事件触发了\
  \ `div1` 上的处理器 `eventHandler1()`。\n3. 事件继续向 `div2` 移动，找到为捕获阶段设置的事件处理器 `eventHandler4()`\
  \ 并触发它，然后停止移动。\n4. 事件调转方向并准备返回 DOM 顶部。首先，它在 `div2` 上找到为*冒泡阶段*设置的事件处理器。这触发了 `eventHandler2()`。\n\
  5. 事件再次命中 `div1` 并发现 `eventHandler3()`，并触发它。\n6. 事件再次一直向上移动到 DOM，寻找处理器，但没有找到。\n\n\
  # IE 鼠标事件的捕获模式\n\n尽管在 Internet Explorer 中没有对应的方法在*捕获阶段*捕获事件，但在处理鼠标事件时，你确实选项。微软意识到，为了让开发者编写利用鼠标的\
  \ DHTML 组件，必须有一种可靠的方法来捕获鼠标事件（比冒泡更可靠）。他们的解决方案是 `setCapture()` 和 `releaseCapture()`。你可以强制让像“mousemove”、“mouseover”之类的鼠标事件在特定元素上触发，*无论*它们如何传播。遗憾的是，这并不是\
  \ W3C 的完美替代品。一个关键区别是 `setCapture()` 会干扰其他元素。\n\n```html\n<html>\n<head></head>\n\
  <body>\n    <div id=\"div1\">\n        <div id=\"div2\">\n            Hello World\n\
  \        </div>\n    </div>\n<script type=\"text/javascript\">\ndocument.body.setCapture();\n\
  document.getElementById(\"div1\").addEventListener(\"click\", function(e) {\n  \
  \  var dEl = document.getElementById(\"div2\");\n    dEl.innerHTML += \"<br>div1\"\
  ;\n    e.cancelBubble = true;\n}, false);\ndocument.attachEvent(\"onclick\", function()\
  \ {\n    var dEl = document.getElementById(\"div2\");\n    dEl.innerHTML += \"<br>Body\
  \ click\";\n});\n</script>\n</body>\n</html>\n```\n\n# 默认处理器\n\n这种冒泡行为的优势在于可以在文档对象上为所有类型的事件定义*默认*处理器。例如，与其在页面上的所有元素上附加“click”处理器，你只需要为文档附加单个事件并等待它冒泡即可：\n\
  \n```javascript\nif (document.addEventListener)\n    document.addEventListener(\"\
  click\", eventHandler, false);\nelse\n    document.attachEvent(\"onclick\", eventHandler);\n\
  \nfunction eventHandler(e) {\n    var target = e.srcElement || e.target;\n    alert(target.id);\n\
  }\n```\n\n使用事件对象的 `srcElement` 或 `target` 属性，你可以看到文档上的哪个元素实际上触发了事件，这使得工作变得简单许多。这非常有效，除非事件被阻止冒泡到表面，这是可能的。\n\
  \n# 防止事件传播\n\n如果你想停止事件传播，你可以这样做，但仅限于*冒泡*阶段。这正好，因为 Internet Explorer 没有捕获阶段。如果你不希望特定组件中的事件影响文档的其他部分，或者你想通过消除不必要的事件处理提高页面性能，就可以这样做。无论如何，你可以在\
  \ IE 中通过 `cancelBubble = true` 来阻止事件冒泡：\n\n`e.cancelBubble = true`\n\n在其他浏览器中，你使用\
  \ `stopPropagation()` 代替：`e.stopPropagation()`\n\n为了将两者结合在一个方便的单元中，你可以编写这样的代码：\n\
  \n```javascript\nfunction eventHandler(e) {\n    if (e.stopPropagation)\n      \
  \  e.stopPropagation();\n    else\n        e.cancelBubble = true;\n}\n```\n\n正如我之前解释的，然而无法停止在事件周期的捕获阶段捕获的事件处理器执行。\n\
  \n\n\n\n在任何一种事件模型中，实际上都可以通过编程触发原生事件。你可能会奇怪为什么需要这样做，但这种情况确实会发生。不过，对于 IE 和其他浏览器，处理方法略有不同。在\
  \ Internet Explorer 中，你使用 `fireEvent()`，但如果你想控制任何事件属性，就必须使用 `createEvent()` 创建事件对象。`createEvent()`\
  \ 的语法为：`oEvent = document.createEvent(oEvent)`。唯一的可选参数是一个现有的事件对象，你希望以此为基础创建一个新的对象。通常情况下，你不会使用它。一旦你创建了事件对象，就可以对它的某些属性进行自定义，并使用\
  \ `fireEvent()` 直接在元素上调用它：`element.fireEvent(sEvent [,oEvent])`。这里唯一的参数是 `sEvent`，它是一个表示\
  \ `type` 的字符串。一些示例可能是 `onclick`、`onmouseover` 等。让我们结合使用这两者来模拟在 DIV 上触发一个 `click`\
  \ 事件：\n\n```html\n<html\n<head>\n</head>\n<body>\n<div id=\"div1\">Hello World</>\n\
  <script type=\"text/javascript\">\nvar div1 = document.getElementById(\"div1\");\n\
  div1.attachEvent(\"onclick\", function() {alert('clicked')});\nvar eventObj = document.createEvent();\n\
  // 让我们设置事件对象的任意属性。然而，我们实际上需要这个属性。\neventObj.cancelBubble = true;\ndiv1.fireEvent(\"\
  onclick\",eventObj);\n</script>\n</body>\n</html>\n```\n\n在这个示例中，我为页面顶部 DIV 的 `onclick`\
  \ 事件创建了事件绑定。然后，我使用 `createEvent()` 创建事件对象，并使用 `fireEvent()` 触发该事件。在浏览器中运行时，这将立即触发事件监听器并显示一个带有“clicked”字样的警告框。在\
  \ Firefox、Opera 和 Safari 等 W3C 标准浏览器中，你必须使用更复杂的 `dispatchEvent()`。与 Internet Explorer\
  \ 类似，你必须首先使用 `createEvent()` 创建事件对象。其语法为：`var event = document.createEvent(type)`。然后必须对事件本身进行初始化。对于每个类型，都有不同的初始化器。下表列出了可用类型及其初始化器的列表：![137](img/whit_9780470550502_oeb_137_r1.gif)\
  \ 此列表中两个重要的是 `MouseEvents` 和 `MouseEvent`，它们提供了足够的覆盖范围来复制页面上的常见事件。要初始化事件，请使用事件初始化器。`initMouseEvent`\
  \ 初始化器采用以下语法：`event.initMouseEvent(type, canBubble, cancelable, view, detail, screenX,\
  \ screenY, clientX, clientY, ctrlKey, altKey, shiftKey, metaKey, button, relatedTarget)`\
  \ 每个属性都代表事件对象的一个属性，在本章前面已介绍过。更通用的 `initEvent` 语法为：`event.initEvent(type, bubbles,\
  \ cancelable)`。`initEvent()` 的参数很简单。第一个参数 `type` 是事件类型（例如 `click`）。`bubbles` 代表事件是否会冒泡到元素之外，`cancelable`\
  \ 表示事件是否可以被取消。最后，一旦你初始化了事件，就可以使用 `dispatchEvent()` 在目标上执行它，这是每个 DOM 节点都有的方法。`dispatchEvent()`\
  \ 函数只接受一个参数，即事件对象：`bool = element.dispatchEvent(eventObj)`。让我们在之前的示例中使用它——为了重新创建一个鼠标点击，你可能会执行如下操作：\n\
  \n```javascript\nvar div1 = document.getElementById(\"div1\");\ndiv1.addEventListener(\"\
  click\", function() {alert('clicked')}, false);\nvar evt = document.createEvent(\"\
  MouseEvents\");\nevt.initMouseEvent(\"click\", true, true, window, 0, 0, 0, 0, false,\
  \ false, false, false, 0, null);\ndiv1.dispatchEvent(evt);\n```\n\n这些步骤与我们在 Internet\
  \ Explorer 示例中的步骤完全相同。运行示例时，当在 `div1` 上调用 `dispatchEvent()` 时，第 2 行定义的事件监听器就会执行。用户将立即看到一个带有“clicked”内容的警告框。\n\
  \n# 常见事件绑定\n现在是时候查看在浏览器内部连接原生事件的一些非常具体且实用的示例了。遗憾的是，一些常用的浏览器事件受到跨浏览器问题的困扰，你必须学习这些问题才能利用它们。正如你所看到的，其中某些事件存在这种缺陷。\n\
  \n# 检测按键\n按键事件是不同浏览器之间略有不同之一。在所有浏览器中都有三种通用的键事件：`keydown`、`keyup` 和 `keypress`。`keydown`\
  \ 和 `keyup` 事件仅在实际按键按下或释放时触发，而 `keypress` 事件在用户同时完成这两个操作时触发。当事件被触发时，你可以通过硬件键码 `code`\
  \ 访问被按的键，在 `keypress` 事件中，你可以访问键的屏幕可打印字符。在 Internet Explorer 中，只有当用户最终输入一个屏幕可打印字符时才会触发\
  \ `keypress` 事件，而不是当用户按下 ESC、退格键或回车键时。按键事件的字符码可以通过 `keyCode` 属性获取。在下面的示例中，当用户在文本输入框中输入时，我会在警告框中显示键码：\n\
  \n```html\n<input type=\"text\" id=\"myTB\">\n<script type=\"text/javascript\">\n\
  var tb = document.getElementById('myTB');\nif (document.attachEvent) {\n    tb.attachEvent(\"\
  onkeydown\", function(e) {\n        alert(e.keyCode);\n    });\n}else {\n    tb.addEventListener(\"\
  keydown\", function(e) {\n        alert(e.keyCode);\n    }, false);\n}\n</script>\n\
  ```\n\n如果你想查找 shift、alt 或 ctrl 键是否被按下，有一种更简单的方法。W3C 和微软对这一点也达成了一致。只需查询事件对象的布尔属性\
  \ `eventObj.shiftKey`、`eventObj.altKey` 或 `eventObj.ctrlKey` 即可。`var isShiftPressed\
  \ = e.shiftKey;`, `var isAltPressed = e.altKey;`, `var isCtrlPressed = e.ctrlKey;`\
  \ 这特别有用，因为它有助于在应用程序中设置热键，例如使用 CTRL-S 保存。当你支持在浏览器内部也可能具有含义的热键时，请记住阻止这些事件的默认行为。\n\n\
  # 鼠标位置\n\n\n\n\n\n# 获取鼠标位置\n\n当涉及到 Explorer 以及所有其他浏览器时，获取鼠标位置是另一项棘手的任务。当我们在处理鼠标事件并想要获取鼠标的\
  \ `coordinates` 时，至少有少于 12 个不同的属性可以查看：\n\n![139](img/whit_9780470550502_oeb_139_r1.gif)\
  \ \n\n如果你真正想要的是相对于页面顶部的鼠标坐标（也许这些是你能够跨浏览器获取的、唯一 `only` 有用的坐标），你必须查看两组不同的属性：在 Firefox\
  \ 等浏览器上的 `pageX` 和 `pageY`，以及在 IE 中的 `clientX` 和 `clientY`。虽然 `pageX` 和 `pageY`\
  \ 能够精确提供你想要的内容，但另外两个属性只能告诉你鼠标相对于视口（viewport）的位置。\n\n什么是视口？它是窗口当前的滚动位置，如图 12-4 所示：图\
  \ 12-4\n\n![140](img/whit_9780470550502_oeb_140_r1.gif)\n\n要获取 `true` 鼠标坐标，你必须将滚动位置加上\
  \ `clientX` 和 `clientY`。当文档处于兼容模式（quirks mode）时，通过 `document.body.scrollLeft` 和\
  \ `document.body.scrollTop` 访问。在标准模式下，则通过 `document.documentElement.scrollLeft`\
  \ 和 `document.documentElement.scrollTop` 属性找到。\n\n*兼容模式 (Quirks mode)*是指某些浏览器使用的一种技术，目的是为了为旧版浏览器设计的网页保持向后兼容，而不是严格遵守\
  \ W3C 和 IETF 标准。浏览器是否处于兼容模式取决于文档类型，但在 JavaScript 中也可以检测到。在这种情况下，没有必要知道浏览器处于哪种模式，因为两个滚动属性中只有一个会有实际值，另一个将等于零。*\n\
  \n让我们在一个示例中整合所有这些内容。下面的演示将跟踪鼠标在页面上的移动，并将结果放入文本框中：\n\n```html\n<html\n<head></head>\n\
  <<body>\n<input type=\"text\" id=\"myTB\">\n<script type=\"text/javascript\">\n\
  function handleMouseMove(e) {\n    var posx = 0;\n    var posy = 0;\n    if (e.pageX)\
  \ {\n        // 这是一个符合 W3C 标准的浏览器\n        posx = e.pageX;\n        posy = e.pageY;\n\
  \    } else {\n        // 这可能是 Internet Explorer\n        posx = e.clientX + document.body.scrollLeft\
  \ + document.documentElement.scrollLeft;\n        posy = e.clientY + document.body.scrollTop\
  \ + document.documentElement.scrollTop;\n    }\n    // 将结果放入页面顶部的文本框\n    document.getElementById(\"\
  myTB\").value = posx + \",\" + posy;\n}\n// 绑定事件\nif (document.attachEvent)\n  \
  \  document.attachEvent(\"onmousemove\", handleMouseMove);\nelse\n    document.addEventListener(\"\
  mousemove\", handleMouseMove, false);\n</script>\n</body>\n</html>\n```\n\n# scroll\
  \ 事件 (滚动)\n\n使用 `scroll` 事件，你可以跟踪窗口或页面上的某个元素滚动到了哪里。页面上任何带有滚动条的元素都可以具有一个你可以跟踪的滚动事件。当你想要获取页面本身的滚动事件时，请绑定到\
  \ `window` 对象：\n\n```html\n<html\n<head></head>\n<body>\n<input type=\"text\" id=\"\
  myTB\">\n<script type=\"text/javascript\">\nfunction handleScroll(e) {\n    // 在兼容模式下，使用\
  \ body.scrollX，否则使用 documentElement.scrollX\n    var scrollLeft = document.body.scrollLeft\
  \ + document.documentElement.scrollLeft;\n    var scrollTop = document.body.scrollTop\
  \ + document.documentElement.scrollTop;\n    // 将结果放入页面顶部的文本框\n    document.getElementById(\"\
  myTB\").value = scrollLeft + \",\" + scrollTop;\n}\nif (document.attachEvent)\n\
  \    document.attachEvent(\"onscroll\", handleScroll);\nelse\n    document.addEventListener(\"\
  scroll\", handleScroll, false);\n</script>\n</body>\n</html>\n```\n\n在这个示例中，我为窗口添加了事件监听器，然后打印结果。你必须检查\
  \ `document.body`（针对兼容模式）和 `document.documentElement`（针对标准模式）。\n\n## resize 事件 (大小调整)\n\
  \n有时知道窗口何时调整了大小是有用的，特别是当你有用户界面元素时。`resize` 事件作用于 `window`，其使用方式与 `scroll` 事件几乎相同：\n\
  \n```javascript\nif (document.attachEvent)\n    document.attachEvent(\"onresize\"\
  , handleResize);\nelse\n    document.addEventListener(\"resize\", handleResize,\
  \ false);\n```\n\n关于此事件的一个浏览器兼容性注意：在 Firefox 和其他基于 Mozilla 的浏览器中，`resize` 事件仅在用户释放控制后触发一次。在其他浏览器中，它会在用户调整大小时持续触发。\n\
  \n# load 和 unload 事件 (卸载)\n\n在开发者发现 `domready` 事件之前，所有人都使用 `load` 事件作为页面上事件绑定和 JavaScript\
  \ 设置的入口。如果你在页面上有 DHTML 组件（例如下拉菜单或数据网格），它们通常会在 `load` 事件中初始化。所有浏览器都原生支持 `load` 事件，直到今天将其用于此目的也很常见。`load`\
  \ 事件在页面所有内容下载后触发，包括文档的 HTML 内容、引用的外部 JavaScript 或 CSS 文件，以及页面上的任何图像（以 `IMG` 标签形式而非\
  \ CSS）。你可以确定，当 `load` 事件触发时，页面已基本完全构建。`unload` 事件在文档拆毁阶段触发。例如，当用户导航到另一个页面时，`unload`\
  \ 事件将触发。请记住，在 `unload` 之后，你对 DOM 的更改权限非常有限。在 Internet Explorer 和 Firefox 中，你可以继续修改\
  \ DOM 甚至执行 Ajax 请求；但在 WebKit 中你无法进行这些操作。\n\n绑定到 `load` 和 `unload` 事件推荐的方法是使用你一直使用的事件附加方式。这避免了多个想要绑定到同一事件的脚本冲突：\n\
  \n```javascript\nfunction startupScript(e) {\n    // 当窗口加载时，执行此代码\n    alert(\"\
  Loaded!\");\n}\n\nfunction teardownScript(e) {\n    // 当窗口卸载时，执行此代码\n}\n\nif (document.attachEvent)\
  \ {\n    window.attachEvent(\"onload\", startupScript);\n    window.attachEvent(\"\
  onunload\", teardownScript);\n} else {\n    window.addEventListener(\"load\", startupScript,\
  \ false);\n    window.addEventListener(\"unload\", teardownScript, false);\n}\n\
  ```\n\n\n\n\n\n正如我之前提到的，既然人们已经发现了 `domready` 事件，`load` 事件就不再被频繁使用了。`domready` 非常有意思。首先，它并不是一个标准事件——因为它没有被任何浏览器正式实现（至少不是以这个名字命名）。它是一个你创建的“伪事件”，用于在文档完成渲染、但在任何图像或其他杂项完成下载之前的这一刻进行操作。\n\
  \n为什么这是一个重要的事件呢？它是你可以可靠地开始操作 DOM 的尽可能早的时刻。如果你能在 `domready` 事件中而不是 `load` 事件中开始你的初始化脚本，你就有潜力为用户节省几秒钟的页面加载时间，并创建一个视觉上更流畅的体验。\n\
  \n事实上，如果你尝试在 DOM 完成渲染之前对其进行更改，可能会导致严重的违背的后果。在 Internet Explorer 中，这可能会触发一个灾难性的 HTML\
  \ 解析错误，导致页面完全无法加载。在其他浏览器中，它可能意味着你无法获得所有你想要的 DOM 节点。无论如何，在页面至少有机会渲染之前，你没有理由开始操作该页面。\n\
  \n### domready 事件的起源\n\n`domready` 事件的起源于 Mozilla。长期以来，他们一直有一个未记录的事件叫做 `DOMContentLoaded`，它最终被\
  \ Opera 和 WebKit (Safari) 采用。这个事件被赋予了一个有意义的昵号 `domready`，因为对于我们开发者来说，这实际上就是它的含义。要绑定\
  \ `DOMContentLoaded` 事件，你只需要使用 `addEventListener()` 并像处理任何其他事件一样对待它：\n\n```javascript\n\
  // 这在 Firefox 以及较版本的 Opera 和 Webkit 中可以工作\ndocument.addEventListener(\"DOMContentLoaded\"\
  , myStartupScript, false);\n```\n\n遗憾的是，世界上最流行的浏览器 Internet Explorer 没有这样一个事件。事实上，如果不诉诸某些相当诡异的破解手段（hackery），并没有真正优雅的方法来实现它。我遇到过的最佳解决方案来自\
  \ Diego Perini ([`javascript.nwbox.com`](http://javascript.nwbox.com))，现在被 jQuery\
  \ 这样的流行框架使用。它涉及持续轮询 DOM 以获取 `doScroll()` 调用的结果。一旦此调用成功，就意味着 DOM 已经解析并就绪。如果处理你的 `domready`\
  \ 事件的函数命名为 `domReady()`，那么这个调用可能像这样：\n\n```javascript\nif (document.documentElement.doScroll)\
  \ {\n    try {\n      document.documentElement.doScroll(\"left\");\n    } catch(e)\
  \ {\n      setTimeout( function() {domReady(fnRef)}, 0 );\n      return;\n    }\n\
  \    // 你的代码在这里！\n}\n```\n\n当这被放在一个函数内部时，它会不断调用自己，直到 DOM 就绪。让我们将其封装成一个统一的模块：\n\n\
  ```javascript\nfunction domReady(fnRef) {\n    // 这部分将在 Firefox、Mozilla 变体、较版本的\
  \ Opera 和较版本的 Webkit 中工作\n    if (document.addEventListener) {\n      document.addEventListener(\"\
  DOMContentLoaded\", fnRef, false);\n    } else {\n      if (document.documentElement.doScroll)\
  \ {\n        try {\n          document.documentElement.doScroll(\"left\");\n   \
  \     } catch(e) {\n          setTimeout( function() {domReady(fnRef)}, 0 );\n \
  \         return;\n        }\n      } else {\n        // 这里什么都不起作用，我们直接绑定到 onLoad\n\
  \        window.attachEvent(\"onload\", fnRef);\n        return;\n      }\n    \
  \  // 我们的代码在这里！\n      fnRef.apply();\n    }\n}\n\ndomReady(function() {\n    alert(\"\
  The dom is ready!\");\n});\n```\n\n这个 `domready` 函数的变体承认是非常简单的——它只处理单个函数引用。这样做是为了清晰起见。在本章后面的部分，我将演示你如何编写自己的事件订阅和类，这些类可以用于此目的。\n\
  \n## mouseenter 和 leave 事件\n\n微软引入了一组非常有用的鼠标事件：`mouseenter` 和 `mouseleave`。它们模拟了\
  \ `mouseover` 和 `mouseout` 事件，但忽略了冒泡。如果你正在构建包含悬停效果的酷炫 HTML 组件，这将非常方便。想象一下你正在构建一个菜单。当用户鼠标悬停在标题上时，菜单出现。当用户鼠标离开菜单时，它就会消失。遗憾的是，如果你将\
  \ `mouseout` 事件绑定到容器上，由于冒泡作用，你会发现当鼠标移动到该菜单的任何子元素上时，`mouseout` 事件就会触发。困惑吗？\n\n如你所看到的，在这种场景下有两个基本的鼠标事件：一个是好的，一个是坏的。在\
  \ Internet Explorer 中，这非常容易解决。与其使用 `mouseout` 和 `mouseover`，不如使用 `mouseenter` 和\
  \ `mouseleave`，它们执行相同的功能，但没有这种副作用。遗憾的是，由于这些是非标准事件，它们在其他浏览器中不受支持。幸运的是，你可以在 W3C 浏览器中通过模拟这些事件的行为来解决这个问题。部分工作涉及传递原始目标的引用进行比较，如下：\n\
  \n```javascript\ntheDiv.addEventListener(\"mouseover\", function(el) {\n    hoverElement(e,\
  \ el)\n}, true);\ntheDiv.addEventListener(\"mouseout\", function(el) {\n    unHoverElement(e,\
  \ el)\n}, true);\n```\n\n一旦你在事件处理程序中实现了这些，你就可以检查 `relatedTarget` 是否是目标元素的祖先。如果是，则不要触发事件。如果不是，则继续触发。请看下面的示例：\n\
  \n```html\n<html>\n<head></head>\n<body>\n<div id=\"div0\" style=\"padding:30px;\
  \ border:1px solid green;\">\n  <div id=\"div1\" style=\"padding:30px; border:1px\
  \ solid black;\" onclick=\"alert('fds')\">\n      Hello I am div1\n      <div id=\"\
  div2\" style=\"padding:30px; border:1px dotted grey;\">\n        Hello I am div2\n\
  \        <div id=\"div 3\" style=\"padding:30px; border:1px dotted grey;\">\n  \
  \        Hello I am div3\n        </div>\n      </div>\n  </div>\n</div>\n<script\
  \ type=\"text/javascript\">\nfunction hoverElement(e, oTarget) {\n    var isChildOf\
  \ = function(pNode, cNode) {\n      if (pNode === cNode)\n        return true;\n\
  \      while (cNode && cNode !== pNode)\n        cNode = cNode.parentNode;\n   \
  \   return cNode === pNode;\n    }\n    var target = e.srcElement || e.target;\n\
  \    if (!oTarget)\n      oTarget = target;\n    var relTarg = e.relatedTarget ||\
  \ e.toElement;\n    if (document.attachEvent || isChildOf(oTarget, relTarg) == false)\n\
  \      alert(\"Mouseenter!\");\n}\n\nfunction unHoverElement(e, oTarget) {\n   \
  \ var isChildOf = function(pNode, cNode) {\n      if (pNode === cNode)\n       \
  \ return true;\n      while (cNode && cNode !== pNode)\n        cNode = cNode.parentNode;\n\
  \      return cNode === pNode;\n    }\n    var target = e.srcElement || e.target;\n\
  \    if (!oTarget)\n      oTarget = target;\n    var relTarg = e.relatedTarget ||\
  \ e.toElement;\n    if (document.attachEvent || (!isChildOf(oTarget, relTarg)))\n\
  \      alert(\"Mouseleave!\");\n}\n\nvar theDiv = document.getElementById('div1');\n\
  if (document.attachEvent) {\n  theDiv.attachEvent(\"onmouseenter\", hoverElement);\n\
  \  theDiv.attachEvent(\"onmouseleave\", unHoverElement);\n} else {\n  theDiv.addEventListener(\"\
  mouseover\", function(el) {\n    hoverElement(e, el)\n  }, true);\n  theDiv.addEventListener(\"\
  mouseout\", function(el) {\n    unHoverElement(e, el)\n  }, true);\n}\n</script>\n\
  </body>\n</html>\n```\n\n\n\n\n\n在这里，当 IE 支持时，我们使用原生的 ″mouseleave″ 事件。否则，你依赖 ″mouseout″，但在执行事件处理程序代码*之前*，请检查\
  \ `currentTarget` 是否源自原始目标（original target）。页面顶部的 HTML 是一组级联嵌套的 `DIV`，一个嵌套在另一个里面。每当鼠标悬停在内部的某个\
  \ `DIV` 上时，我们实际上是从父级 `DIV` 中*移出*，并触发事件。本文档以及触发的 `alert()` 可以在图 12-6 中看到。**图 12-6**![142](img/whit_9780470550502_oeb_142_r1.gif)\n\
  \n# 事件兼容性\n\n有很多事件，其中一些仅由一种浏览器支持。这没关系，因为*某些*专有事件是非常棒的主意，已经通过 JavaScript 框架在浏览器间实现（例如\
  \ ″mouseenter″、″mouseleave″ 和 ″DOMContentLoaded″）。下表列了一些重要事件的浏览器兼容性：![143](img/whit_9780470550502_oeb_143_r1.gif)![144](img/whit_9780470550502_oeb_144_r1.gif)以下是关于上表的若干说明：\n\
  1. 这在 Safari 3.1 (Windows) 中部分实现。\n2. 在 Opera 和 Safari 中，blur 事件在超链接上的触发是不一致的。在\
  \ iPhone 上，当用户切换浏览器窗口或关闭浏览器时，blur 事件不会触发。\n3. 在 Internet Explorer 中，这在表单的复选框或单选按钮不会正确触发。\n\
  4. 在这些浏览器中，通过 `innerHTML` 实现的更改后事件不会触发。\n5. 在 Internet Explorer 中，`DOMMouseScroll`\
  \ 与 `mousewheel` 相同。\n6. 在 iPhone 上，mousewheel 只有在 `textareas` 和 `DIV` 等可滚动元素滚动时才会触发，而当文档本身滚动时不会触发。\n\
  7. 在 Opera 和 Safari 中，链接无法可靠地支持 focus 和 blur。在 iPhone 上，当窗口获取焦点时事件不会触发。\n8. 在 Safari\
  \ 中，当你按住键时，`keydown` 事件不会按预期对每个键重复。\n9. 在 iPhone 上，`mousemove` 事件仅在用户将焦点移动到特定元素时在\
  \ mouseover 之前触发。当然，因为没有移动的光标，它无法连续触发。\n\n## 自定义事件\n\n到目前，你已经了解了 JavaScript 原生事件的所有必要知识。如果你想为你的应用程序创建一个*自己的*事件系统呢？例如，如果你正在构建一个组件，并想要创建开发者可以订阅的特殊事件——比如\
  \ ″tabChange″ 或 ″onInitialize″ 之事件。遗憾的是，语言本身并没有内置用于创建此类*自定义*事件的机制。然而，利用你已经对对象的知识，构建一个你自己的\
  \ `Event` 类来完成此任务是一件简单的事。\n\n一个自定义事件类应该具有四个基本特性：\n• 一种订阅你自定义事件的方法。\n• 一种取消订阅你自定义事件的方法。\n\
  • 一种为事件定义*目标*并传递某种自定义事件对象的方法。\n• 一种触发事件的方法。\n\n来看这里解决此问题的可能解决方案：\n\n```javascript\n\
  var Event = function(eventName) {\n    // 记录事件名称\n    this.eventName = eventName;\n\
  \n    // 事件监听器数组\n    var eventListeners = [];\n\n    // 提供一种订阅事件的方法\n    this.subscribe\
  \ = function(fn) {\n        eventListeners[eventListeners.length] = fn;\n    };\n\
  \n    // 提供取消订阅事件的方法\n    this.unsubscribe = function(fn) {\n      for (var i =\
  \ 0; i < eventListeners.length; i++)\n        if (eventListeners[i] == fn)\n   \
  \       eventListeners[i] = null;\n    };\n\n    // 触发事件\n    this.fire = function(sender,\
  \ eventArgs) {\n        this.eventName = eventName;\n        for (var i = 0; i <\
  \ eventListeners.length; i++)\n          if (eventListeners[i])\n            eventListenersi;\n\
  \    };\n};\n```\n\n将其拆解为各个组件，你会看到一些简单但实用的代码。首先，`Event` 对象是一个构造函数，你可以用它来创建实例。当你这样做时，可以选择为事件*命名*，尽管这不是必须的。让我们为你的程序创建一个虚构事件：`var\
  \ oninitialize = new Event(\"initialize\");`\n\n你想要做的下一件事是绑定一些监听器。在内部，监听器在 `eventListeners[]`\
  \ 中表示。每当你调用 `subscribe()`，监听器就会被追加到数组中。这样你就可以为任何事件拥有任意数量的事件监听器——这正是它应该有的。现在让我们绑定一些监听器：\n\
  \n```javascript\nfunction listenerA(sender, eventArgs) {\n    alert(\"Listener A\
  \ 被触发。 \" + eventArgs.info);\n}\n\nfunction listenerB(sender, eventArgs) {\n   \
  \ alert(\"Listener B 被触发。 \" + eventArgs.info);\n}\n```\n\n`oninitialize.subscribe(listenerA);`\n\
  `oninitialize.subscribe(listenerB);`\n\n对于每个监听器，我允许了两个参数：`sender` 和 `eventArgs`。这是随意的，但它可以让你完成两件事。当你最终触发事件时，你可以将所需的″上下文″\
  \ 分给 `sender`。例如，你可以传递一个 DOM 节点或程序的其他部分的引用，以便在监听器代码中方便访问。第二个参数 `eventArgs` 代表你可能在监听器函数中使用的某种任意参数集合。\n\
  \n除了 `subscribe()` 函数外，我还提供了 `unsubscribe()`。通过将同一个事件监听器的引用传递给 `unsubscribe()`，你可以遍历\
  \ `eventListeners[]` 数组以检查它是否存在并将其移除。不过，我们现在不理会这一点。\n\n现在你可以触发事件了。要做到这一点，你需要使用 `Event`\
  \ 实例上的 `fire()` 方法。当你调用 `fire()` 时，可以选择通过 `sender` 传递事件上下文（如果适用），并通过 `eventArgs`\
  \ 传递一个包含参数的任意对象：\n\n`oninitialize.fire(window, { info: 'Success!' } });`\n\n当这种情况发生时，`fire()`\
  \ 方法会遍历 `eventListeners[ ]`，按顺序执行每个函数引用。`listenerA()` 和 `listenerB()` 都会被触发，你会在屏幕上看到两个警框。类似的系统可以用于你的应用程序，以提供灵活的自定义事件绑定。\n\
  \n\n\n\n本章引入了 JavaScript 事件的概念。具体来说，你学习了：\n\n-   有三种你需要处理的事件模型：传统模型、微软模型以及 W3C 模型（所有非\
  \ Internet Explorer 浏览器都使用该模型）。\n-   现代首选的事件绑定方式是使用事件监听器。你学习了如何在微软模型和 W3C 模型中实现这一操作。\n\
  -   非侵入式 JavaScript（Unobtrusive JavaScript）是一种设计哲学，其目的是提高由于某些原因不支持 JavaScript 的浏览器的优雅降级能力，并创建出可扩展且健壮的\
  \ Web 应用程序。\n-   你可以在两种模型中通过它们各自的事件初始化器来模拟事件。你可以借此触发绑定到原生 DOM 事件的事件监听器。\n-   你学习了如何捕获击键事件。\n\
  -   你学习了如何获取鼠标位置，并考虑了微软事件模型中的缺陷。\n-   `domready` 和 `load` 事件用于在网页加载时注入 JavaScript。\n\
  -   `unload` 事件用于在页面切换期间注入 JavaScript。\n-   在嵌入的 DOM 元素结构上捕获 `mouseout` 事件可能会很棘。你查看了一种解决方案，它结合了原生\
  \ IE `mouseleave` 事件和 W3C 事件模型属性。\n-   你可以使用 JavaScript 对象和事件监听器设计范式轻松创建自定义事件。\n\
  \n在第 13 章中，我将正式介绍文档对象模型。我们将涵盖 `DOM` 的结构，以及你如何对其进行查询和修改以影响网页的布局。\n\n## 13 文档对象模型\n\
  \n当你考虑到面向对象设计原则在多大程度上已深深融入 JavaScript 语言中时，网页本身在内存中的表示方式大不相同，这并不令人意外。`Document Object\
  \ Model`（`DOM`）是一组很大程度上独立于厂商的集合和 API，用于表示 HTML 和（你可能不相信）XML 文档。`DOM` 是你访问网页内容的门户，也是通过\
  \ JavaScript 让你的页面活跃起来的关键。\n\n`DOM` 还是一个极其详尽的资源，通过它可以确定关于网页内容和布局的几乎任何信息。页面上的每一个元素都在模型中得到了描述，包括表格、表单和文本。还可以访问关于这些元素的非常详细的信息，包括对象的样式、节点的大小和位置、元素上是否有滚动条、超链接指向何处等。它甚至提供了一个复杂的事件模型（你已经看过了），让你能够为页面添加一层交互——使它们不再仅仅是静态的画布。\n\
  \n我已经向你介绍了了 `DOM` 的许多方面，包括 `document` 对象、`DOM` 节点、元素 ID 等。例如，你已经查看了事件如何让你接入页面上关键的交互时机。现在，你将完成对如何查询、导航和更改文档的理解。你还将学习一些非常实用的非标准特性。不过，首先我会简单介绍\
  \ `DOM` 的历史。\n\n## DOM 的历史\n\n当微软（Microsoft）和网景（Netscape）开始将浏览器脚本与 HTML 进行“联姻”时，他们面临着一项艰巨的任务。为\
  \ HTML 文档的“内部”表示提供程序化接口的任务，看起来必须是复杂且前无先例的。由于缺乏正式标准机构的帮助（即 `W3C`），意味着……（此处省略后续重复性排版性内容，保留核心逻辑）\n\
  \n\n\n尽管起步较慢，但 Internet Explorer 4（在 Navigator 4 发布后不久发布）所引入的重要创新在很大程度上归功于微软。这是那种“跨越式”事件之一，类似于\
  \ Ajax 的引入，它将浏览器脚本推向了一个新的水平。首先，他们开始在对象模型中表示整个文档。所有的 HTML 节点都可以通过 `DOM` 访问，并且可以通过脚本使用\
  \ `CSS` 对元素进行样式设置。微软引入了几个新集合，包括 `document.all`，这是一个包含页面上所有元素的数组。这些元素可以通过它们的 ID 访问，使得每个元素都变成了一个可脚本对象。如果你有一个\
  \ ID 为 `myForm` 的表单字段，你可以像这样通过 `all` 对象访问它：`document.all.myForm`\n\n时此今日，这种语法在 IE\
  \ 中仍然可用。\n\n除了 `styleSheets` 集合外，IE 4 还允许开发者直接在对象上设置样式属性。它还允许开发者通过四个新的对象属性修改 `DOM`\
  \ 的内容：`innerHTML`、`outerHTML`、`innerText` 和 `outerText`。这一项功能为想要设计真正动态 HTML 文档的开发者开启了无限可能。开发者现在只需通过输入代码即可重写\
  \ `DOM` 的部分：\n\n```javascript\ndocument.all.myTableId.outerHTML″<p>NowI′m a paragraph\
  \ instead of atable!</p>″\n```\n\nIE4 的另一个重要创新（至少在 32 位版本中）是引入了 CSS 过滤器样式，即可以应用于\
  \ `DOM` 元素的多媒体效果。这让开发者能够在其网页上添加如模糊、透明度和 32 位图像等效果。由于过滤器与微软的技术栈（包括其 GDI API）紧密结合，它们从未被正式采纳为\
  \ W3C 标准的一部分。\n\n该版本还引入了至今仍在使用 Internet Explorer 中使用的现代事件模型。对开发者来说遗憾的是，它与 Netscape\
  \ 模型（你将在第 12 章中学习到）完全不同。除了事件 API 和事件对象的差异外，另一个关键区别在于事件仅向一个方向冒泡——即向上。由于微软的事件模型没有捕获阶段，因此（到今天也是如此）除非你为每个元素都绑定事件处理器，否则没有方法可以保证\
  \ `DOM` 中全局事件的捕获。\n\n## Internet Explorer 5 扩展\n\n虽然发布时没有那么剧烈，但 Internet Explorer\
  \ 5 确实让浏览器向更符合标准的 `DOM` 进了一步。此时，一个名为 W3C 的国际标准机构已经开始为提供 `HTML`、`CSS` 和 `DOM` 功能的网页浏览器定义正式预期。微软已经对这些\
  \ API 应该长什么样下了注，而事实的发展证明，W3C 并不认同这一观点。然而，在 IE5 中，他们对对象模型进行了一些补充，以更符合这些标准。\n\n此时的其他关键新增内容包括动态\
  \ HTML “行为”（behaviors），它允许开发者将某些 JavaScript 动作移动到可以重用的外部模块中。另一个新增的功能是支持一种用于 HTML\
  \ 和 JavaScript 应用程序的桌面应用模式，称为 HTML  (HTAs)。这赋予了开发者更高的安全权限来执行诸如移除浏览器所有外壳的操作，从而提供用户正在运行原生软件的错。遗憾的是，这些功能既没有被采用也没有被广泛使用，并在很大程度上被遗忘记了。\n\
  \nInternet Explorer 和 W3C `DOM` 之间的关键区别之一是它们表示文本和空白节点的方式。在 IE 中，空白在很大程度上被忽略了，但 W3C\
  \ `DOM` 实现会为空白创建特殊的文本节点。通常，你会发现文档中的节点数量取决于文档在哪个浏览器中渲染的。\n\n## W3C DOM\n\n到 20 世纪\
  \ 90 年代后期，微软和 Netscape 在合作制定 JavaScript 语言标准方面已经取得了一些成功。现在是时候坐下来为网页编程的其他方面确定路线了，即\
  \ `CSS`、`HTML` 和 `DOM`。W3C `DOM` 工作组被负责制定一种同时适用于 `HTML` 和 `XML` 文档的规范。两者都是任何名称节点的层次级结构，并且在处理它们时具有类似的用例。\n\
  \n设计 `DOM` 规范的任务被分为两个部分。规范的第一部分称为核心 DOM（Core DOM），描述了适用于 `HTML` 和 `XML` 文档的通用特性和能力。规范的第二部分涉及\
  \ `HTML` 的特定需求。这部分继承了核心 DOM 的所有功能，并附带了一些额外的描述，以引入最早具有此类功能的浏览器中引入的 `DOM` 原始功能。\n\n\
  W3C `DOM` 规范并没有描述任何现有的 `DOM` API。它是一个全新的产物，与微软或 Netscape 产出的任何东西都不同。尽管在随后的几年里，微软努力更加符合最新规范，但这是一个非常缓慢的过程，他们似乎并不急于加速。与此同时，W3C\
  \ 发布了规范的多次更新，以反映 Web 不演变的需求。每次更新都被称为规范的某一个新级别（level）。Level 0 虽然没有正式发布，但指的是由 Netscape\
  \ 定义并由微软采纳的原始未文档化的 `DOM`。`DOM` Level 1 是第一个正式规范。Level 2 引入了现代事件模型以及检查文档层次结构的方法。其他新功能包括\
  \ `XML` 命名空间、样式表和文本范围。\n\n最最近的规范是 Level 3。它引入了键盘事件、`XPath` 以及将文档序列化为 `XML` 的能力。\n\
  \n任何厂商（微软、Mozilla 或其他）都不可能仅限于生产单一完全符合标准的软件。你在任何浏览器中依赖的某些功能是非标准的，但非常有用。同样，例如微软不太可能因为对向后兼容性的担忧而弃用许多与标准冲突的私有功能。尽管\
  \ Web 移动有时很快，但总有一部分固执拒绝升级的用户。由于缺乏向后支持，浏览器的开发者接口创新需要多年才能变得真正有用。\n\n## 文档类型\n\n当微软和\
  \ Mozilla 开始将他们多年来做的某些 `CSS` 和 `DOM` 实现决策与发布的 W3C 标准进行协调时，他们意识到，如果不按照标准描述的方式实现这些内容，将完全破坏使用旧模型构建的应用程序。一种允许他们不受阻碍地追求统一模型并保护向后兼容性的临时解决方案，是让开发者在文档顶部显式设置\
  \ `<!DOCTYPE>`。这种技术被称为 DOCTYPE 切换，它形式化了标准模式和兼容模式（也称为怪异模式）的概念。Internet Explorer 6+（Mac\
  \ 上的 IE 5）以及所有基于 Mozilla 的浏览器都识别这些模式的区别。\n\nDOCTYPE 切换很简单。当浏览器在文档最顶部遇到格式良好的文档类型定义时，它会使用该定义，但选择使用标准规则而不是怪异规则渲染页面。有效的\
  \ DOCTYPE 包括：\n\n```html\n<!DOCTYPE html PUBLIC \"-////W3C//DTD HTML 4.01//EN\"\
  \ \"http://www.w3.org/TR/html4/strict.dtd\">\n```\n\n```html\n<!DOCTYPE html PUBLIC\
  \ \"-////W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.w3.org/TR/html4/loose.dtd\"\
  >\n```\n\n\n\n\n\n```html\n<!DOCTYPE html PUBLIC \"-////W3C//DTD HTML 4.01 Frameset//EN\"\
  \ \"http://www.w3.org/TR/html4/frameset.dtd\">\n```\n遗憾的是，各种浏览器实现的“规则”往往会随着版本的更新而*变化*。Internet\
  \ Explorer `7` 破坏了大量使用文档类型定义的网站，因为这些开发者认为使用 `DTD`（文档类型定义）实际上是在为他们应用程序的外观和感受“面向未来”。遗憾的是，除非将应用程序编写在怪异模式（quirks\
  \ mode），否则没有办法可以做到。在 Internet Explorer `8` 中，微软引入了一个新概念：*版本目标*（version targeting）。除了定义文档类型外，开发者还可以指定特定的浏览器版本，未来的浏览器将使用该版本来选择页面的渲染规则。这涉及使用\
  \ `http-equiv` 属性设置 `<META>` 标签，如下方的假设所示：\n\n```html\n<meta http-equiv=\"X-UA-Compatible\"\
  \ content=\"IE=7;FF=3;OtherUA=4\" />\n```\n目前这仅在 Internet Explorer `8` 中有效，但这是一个值得关注的有趣想法。未来，其他厂商可能决定也实现这一。\n\
  \n# 怪异模式下发生了什么\n\n尽管不同浏览器之间的具体差异不相同，且怪异模式没有*正式*的规范（这也是其名字来源），但在使用怪异模式设计页面时，观察到了以下行为：\n\
  \n*   百分比高度（例如 `<div style=\"height:50%\"></div`）使用可用空间作为参考点进行应用——即使包含对象使用的是 `auto`\
  \ 高度也是如此。在标准模式下，只有当包含元素被应用了特定的高度值时，它才有效。\n*   使用 `width` 和 `height` CSS 属性时会应用不同的盒模型，指定整个元素框的尺寸（包括内边距和边框），而不是只是元素的内容。\n\
  *   表单在 Mozilla 的标准模式下缺少下外边距，但在 IE 的两种模式下都有下外边距。\n*   溢出（overflow）行为处理不同。在怪异模式下，使用\
  \ `overflow:visible`（CSS）时，当内容过大，绝对定位的容器框会扩展。在标准模式下，内容会超出容器，但容器本身不会调整大小。\n*   非块级内联元素（如\
  \ `<span>` 标签）受 `width` 和 `height` 属性的影响（在标准模式下不受影响）。\n*   `img` 和 `input type=\"\
  image\"` 元素的 CSS 图像内边距（padding）会被忽略。\n*   在 Internet Explorer 中，怪异模式不支持固定定位。\n*\
  \   对于应用了*float*（浮动）的图像，默认水平边距为三像素而不是零。在非 IE 浏览器中，此边距仅应用于浮动图片的“内边缘”。\n*   在怪异模式下，使用\
  \ CSS 关键字“xx-small, x-small, small, medium, x-large, xx-large”时，字体字体通常较大。\n*   格式不正确的\
  \ CSS 属性值可以根据“最佳猜测”进行解释。例如，`padding:10` 可以被解释为 `padding:10px` 等以此此类推。类名和标识选择器也是如此。\n\
  *   在怪异模式下，字体不会从包含元素级联到表格中。\n*   CSS 的许多新增仅在 IE 的标准模式下受支持。\n*   在 IE 怪异模式下，块元素之间的空白可能是显著的，而在标准模式下则可能不是（例如在标签之间）。\n\
  \n## 检查 DOCTYPE\n\n包括 Internet Explorer、Mozilla、Safari 和 Opera 在内的大多数浏览器都支持 `document.compatMode`\
  \ 检查，用于报告浏览器是否处于怪异模式或标准模式。在现代浏览器中，`document` 在标准模式下会将此值填充为字符串“CSS1Compat”，在怪异模式下填充为“BackCompat”。Opera\
  \ `7` 将使用字符串“QuirksMode”来代替。用一行简单的 JavaScript 表达这一点，你可以这样写：\n\n```javascript\nvar\
  \ isQuirks = (document.compatMode == \"BackCompat\" || document.compatMode == \"\
  QuirksMode\");\n```\n\n## 文档树\n\n在 DOM Level 0 或最早期的对象模型中，从对象关系映射的角度来看，文档是一个非常扁平的结构。即使是最近的\
  \ IE `4`，DOM 中的所有元素都可以从包含页面上每个元素的扁平集合中访问。尽管数据在页面上渲染时存在隐含的*层级结构*，但这种树形结构直到后续版本才被构建到文档对象模型中。事实上，思考文档的最好方式*就是*像树一样。页面上的每个节点都包含另一个节点内部，一直向上直到文档的根，即文档对象（根据\
  \ W3C 称为 `documentElement`）。你可以使用内置 API 在此结构中上下导航，并利用这种层级关系计算屏幕位置等内容。考虑一个包含列表的简单\
  \ HTML 文档。该页面的文本版本（当然是查看源码）可能如下：\n\n```html\n<html>\n    <head>\n        <title>My\
  \ List</title>\n    </head>\n    <body>\n        <h1 class=\"myHeading\">My List!</h1>\n\
  \        <ul id=\"myUnorderedList\">\n            <li>Item 1</li>\n            <li>Item\
  \ 2</li>\n            <li>Item 3</li>\n            <li>Item 4</li>\n        </ul>\n\
  \    </body>\n</html>\n```\n当浏览器遇到此页面时，它将开始创建 DOM，创建一个包含两个节点的元素：`html` 和 `body`。\n\
  \n![146](img/image placeholder)\n\n在怪异模式中，块元素之间的空白可能是重要的。\n在标准模式下，它可能不是（例如在标签之间）。\n\
  \n## 节点类型\n\n根据 W3C 规范第 2，HTML 或 XML 文档中有 12 种节点类型。然而，只有 7 种与 HTML 特关。实际上，只有三种使用频率很高：文档、元素和文本。\n\
  \n文档的层级性质体现在父节点和子节点之间的关系中。这反映在 W3C 和微软提供的 API 中，因为一旦你*拥有*了某个节点的引用，就可以利用这些关系在链条中上下移动。例如，在\
  \ `body` 下，`ul` 元素（代表*列表*）属于 `body`，而四个 `li` 属于 `ul`。`body` 和 `li` 之间没有直接关系，但你可以通过识别\
  \ `ul` 来找到 `li`。如果你尝试将前述结构表示为 DOM 格式，每个节点占一行，结果可能如下：\n\n```text\ndocument\n  <html>\n\
  \    <head>\n        <title>My List</title>\n    </head>\n    <body>\n        <h1\
  \ class=\"myHeading\">My List!</h1>\n        <ul id=\"myUnorderedList\">\n     \
  \       <li>Item 1</li>\n            <li>Item 2</li>\n            <li>Item 3</li>\n\
  \            <li>Item 4</li>\n        </ul>\n    </body>\n  </html>\n```\n\n节点类型\n\
  \n包括 Internet Explorer `5+`、Mozilla (Firefox)、Safari 和 Opera 在内的大多数浏览器都实现了这三种，而只有\
  \ Mozilla 实现了所有类型。Internet Explorer `6` 实现了大部分（除了一个），而 Safari 实现了所有（除了两个）。这些主要的节点类型为：\n\
  \n![146](img/image placeholder)\n\n每当你处理 HTML 元素时，你实际上是在处理 Element 节点类型。\n\n## 节点属性\n\
  \n\n\n\n节点也有许多属性。那些不是方法的属性要么包含了关于节点的特定细节，要么包含了树中附近其他节点的引用：![147](img/whit_9780470550502_oeb_147_r1.gif)![148](img/whit_9780470550502_oeb_148_r1.gif)\n\
  \n在尝试确定节点的 `type` 时，最好的方法可能是查看 `nodeType` 属性。在 IE 之外的几个浏览器（实现 DOM Level 2 的）中，有许多数值常量可以与它们进行比较，这些常量映射到每个节点编号。这使得代码更易读，但实际上并非必须。请参阅上一个表格获取节点类型数字列表。\n\
  \n此表中的其他几个属性对于导航 DOM 至关重要。如 `parentNode` 和 `childNodes` 等属性提供了对当前节点上下层级的访问，这让你能够从特定的引用点在树上上下移动。\n\
  \n## 节点方法\n\n除了属性之外，节点还拥有许多方法。最常用的在下表：![149](img/whit_9780470550502_oeb_149_r1.gif)![150](img/whit_9780470550502_oeb_150_r1.gif)\n\
  \n## implementation 对象\n\n在 DOM Level 1 中，文档对象定义了一个名为 `implementation` 的属性。该对象只有一个方法：`hasFeature(moduleName,\
  \ moduleVersion)`，用于确定此 DOM 是否支持某个特定功能。大多数浏览器都支持 implementation 对象，包括 CH1+, FF1+,\
  \ IE6+, NN6+, O7+, 和 SF1+。它会告诉你在特定浏览器中支持哪些 DOM 部分。然而，你必须传递正确的模块名称和有效版本。下表解释了 `moduleName`\
  \ 和 `moduleVersion` 的可接受值：![151](img/whit_9780470550502_oeb_151_r1.gif)![152](img/whit_9780470550502_oeb_152_r1.gif)如果你想检查浏览器是否支持\
  \ CSS2 规范，你可以写出类似下面的表达式：`var CSS2Support = document.implementation.hasFeature(\"\
  CSS2\", \"2.0\");`；这将返回一个布尔值。注意，模块名称需要正确的大小写。\n\n## 遍历 DOM\n\n如你现在所知，DOM 是一个关系结构，每个节点的属性都指向树中附近的其他节点。在这棵树的顶部，你有文档元素，它是\
  \ `HTMLDocument` 的实例。要获取网页 `<HTML>` 属性的引用，请引用 `document.documentElement` 属性。你也可以通过\
  \ `ownerDocument.documentElement` 属性从任何元素获取该节点的引用：\n\n```javascript\n// 如果 myElement\
