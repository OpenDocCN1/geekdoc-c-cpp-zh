    \ 10 |\n\nFor this particular example, the value of the sum is 10 because you\
    \ resorted to integer promotion. You also converted the ‘c’ value to ASCII before\
    \ you performed the actually operation of addition.\n\nIn this chapter, we discussed\
    \ command line arguments. In the next chapter, get ready to create your first\
    \ program!\n\nGreat progress so far!\n\n# Chapter 12 Extension Methods\n\nExtension\
    \ Methods (introduced in C# 3.0) provides programmers with a simple framework\
    \ to “extend” the functionalities of existing types in their programs. “Static”\
    \ in nature, Extension Methods gives you the freedom to add already present methods\
    \ into your types without a need to create derived types or modifying any old\
    \ ones. They use a “this” keyword in their parameters / parameters lists. Since\
    \ they are “static” methods, it’s essential for you to use them in static classes.\
    \ However, they are used as if they were instance methods of the extended type.\n\
    \nIn this chapter, we will discuss Extension Methods in depth, and will learn:\n\
    \nContents\n\n- What Extension Methods are\n- How to create them\n- How to applying\
    \ Extension Methods to existing types\n- i. Extension Methods\n\nThe OCP, Open\
    \ close principle, directs programmers to write code and functions in a way that\
    \ they are open for extension all the time, but dead end on modification. In C#,\
    \ Extension Methods are a practical case of OCP, which we can use in custom defined\
    \ and system user types to cater to our requirements.\n\nIt’s also important for\
    \ us to know a few basic facts about Extension Methods and how they work. One,\
    \ they have only access (and hence can use) the “public” properties of the data\
    \ type they are extending. Two, their type signature should never be the same\
    \ as any existing method of that type. Three, to use Extension Methods, their\
    \ parent type must be in the namespace of the calling application. Four, in case\
    \ of a method overloading (methods with same signature), an instance method will\
    \ be executed (called) instead of the Extended Method (as per the overload resolution\
    \ mechanism), and lastly, we cannot apply Extension Methods on events, properties,\
    \ and fields.\n\nThe generic, or old way, of doing that is:\n\nExample 1:\n\n\
    ```csharp\nstruct MyExample\n{\n    int num;\n    public MyExample(int val)\n\
    \    {\n        this.num = val;\n    }\n    public int Negative()\n    {\n   \
    \     return -num;\n    }\n}\n\nstatic void Main(string[] args)\n{\n    MyExample\
    \ i = new MyExample(34);\n    Console.WriteLine(i.Negative());\n}\n```\n\nWhile\
    \ the code is quite basic, where we have created a strict “MyExample()” that has\
    \ a simple function that returns negative of our passed value.\n\n# ii. Creating\
    \ Extension Methods\n\nThe code above works fine, but technically speaking we\
    \ are not actually extending the type of our existing type. Instead we have created\
    \ a new type altogether. Hence,\n\nif we are really looking to “extend” the functionality\
    \ of our existing type, we should\ndoing something better and more generic than\
    \ that.\n\nExample 2:\n\n```csharp\nstatic class MySampleExtension\n{\n    public\
    \ static int Negative(this int val)\n    {\n        return -val;\n    }\n    static\
    \ void Main(string[] args)\n    {\n        int i = 53;\n        Console.WriteLine(i.Negative());\n\
    \    }\n}\n```\n\nWhile the basic functionality and output of this is similar\
    \ in that it will output the\nnegative of the passed “int”, how it works is different.\
    \ See the method declaration\nhere: “public static int Negative()”. We are adding\
    \ our method “negative” with type\n“int” and are bounding it to be called only\
    \ with the int type. We are not creating a\nnew type as in the previous example,\
    \ and we are only extending functionality of the type “int”. Hence, to create\
    \ our Extension Methods, we should:\n\n- Have a “Static” class.\n- Use a “public\
    \ static” method with the same name as the class and have an an explicit return\
    \ type.\n- Use the parameters type with the “this” keyword.\n\nThe “this” keyword\
    \ is very important since it tells it our compiler that we are\n\n“extending”\
