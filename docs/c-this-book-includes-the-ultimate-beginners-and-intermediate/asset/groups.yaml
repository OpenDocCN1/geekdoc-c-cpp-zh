    correlates, the cast will succeed and the compiler will extract the value from
    the boxed int and copy it to i. (i.e. the boxed value will be stored in i.) This
    is called unboxing


    However, if o does not refer to a boxed int, there has been a type mismatch and
    the cast will fail. InvalidCastException is invoked. The following illustrates
