    You should have someone else, like a friend or a co-worker''s familiar with programming,
    look at the class and agree that it makes sense that those objects ended up together.
    This does not mean that the objects need to be identical, but they need to at
    least related in some way.


    For example, if you have a class that is called ''Toys'', you don''t just place
    the same toy inside and leave it as it. You could include all sorts of ''toys''
