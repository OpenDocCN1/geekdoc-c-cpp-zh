    \ Methods on existing types\n\nUsing the above created Extension Method, let's\
    \ now see how we can call an Extension Method on our existing types. Also note\
    \ that we used the “this” keyword above, but what about the cases where we want\
    \ to use additional parameters? We can easily do this by defining all such parameters\
