  mdcn: "\n当此条件被视为假时，控制将跳出 `while` 循环，循环将完全停止。相反，它将移动到代码的后续部分并从那里继续执行。\n\n处理这类代码和循环并不困难。稍后我们将查看一个如何处理这种情况的示例。请查看语法并对其进行一些实验，看看它是如何工作的。你也可以查找代码中的\
    \ `while` 部分，它将告诉我们我们正在操作的循环从哪里开始。一个使用 `while` 循环的示例如下：\n\n```csharp\n// 演示 while\
    \ 循环的 C# 程序\nusing System;\n\nclass whileLoopDemo\n{\n  public static void Main()\n\
    \  {\n    int x = 1;\n\n    // 当 x 大于 4 时退出\n    while (x <= 4)\n    {\n     \
    \ Console.WriteLine(\"GeeksforGeeks\");\n\n      // 增加 x 的值以供\n      // 下一次迭代\n\
    \      x++;\n    }\n  }\n}\n```\n\n通过这个示例，我们创建了一个打印了三次 \"GeeksforGeeks\" 单词的循环。`while`\
    \ 循环告诉语法不要执行超过三次。如果我们让循环执行四次，那么条件将被视为假，这样我们就无法在过程中获得想要的结果。这个循环看到，当我们打印一次（少于四次）时，它是真的。当打印两次和三次时也是如此。但当程序再次进入循环时，似乎再次进行迭代并再次打印该术语将使我们达到四，这超出了我们的需求范围。\n\
    \n你完全可以检查并更改想要在此示例中使用的术语，并确定你想在代码中看到什么种语句。继续尝试尝试 `while` 循环，并确定你希望在该语句中运行多少次迭代，以获得你想要的结果。\n\
    \n现在是时候迁移到 `for` 循环了。在功能方面，它将与 `while` 循环相似，但它具有不同的语法。当你开始执行之前就已经知道循环语句应该执行的次数时，`for`\
    \ 循环将是首选方法。\n\n循环变量的初始化、要测试的条件、以及循环变量的递增或递减都将在循环的单行代码中完成，这有助于为我们提供一个更短、更易编写的循环结构。当你遇到问题或需要修复代码部分时，你可能会发现这种格式的循环在之后调试起来实际上更容易，因此你可能想要考虑使用它。\n\
    \n现在，在 C# 中处理循环时，会有几个不同的部分参与进来，以确保它按照我们想要运行。其中包括：\n\n- 1. **循环变量的初始化**：控制循环的变量或表达式将在此步中初始化。它是循环的起点。可以使用已经声明的变量，也可以声明一个仅用于当前操作循环的局部变量。\n\
    - 2. **测试条件**：我们在这里需要关注的第二点是测试条件。这是我们用来执行循环中语句的工具。它被用于许多情况，以测试循环的退出条件。它必须向我们返回一个布尔值，这意味着我们将得到\
    \ `true` 或 `false` 的结果。当条件结果为 `false` 时，控制将跳出循环，这种循环将对我们结束。\n- 3. **递增和递减**：根据我们输入的要求，对循环变量进行递增或递减，当这种情况发生时，控制将转移到测试条件上。\n\
    \n在我们开始查看想要执行的一些代码之前，需要注意的一点是，初始化部分在循环开始之前仅会被评估一次。如果你按照你真正想看到的方式设置它，那么这就足够了。考虑到这一点，让我们结合上面讨论过的一些信息并添加代码，看看这种循环是如何工作的：\n\
    \n```csharp\n// 演示 for 循环的 C# 程序\nusing System;\n\nclass forLoopDemo\n{\n  public\
    \ static void Main()\n  {\n    // for 循环从 x=1 开始开始\n    // 并运行到 x<=4\n    for\
    \ (int x = 1; x <= 4; x++)\n      Console.WriteLine(\"GeeksforGeeks\");\n  }\n\
    }\n```\n\n既然我们刚刚讨论了 C# 中的一些进入控制循环，现在是时候转向我们可以在代码中使用的第二类循环了。这些将被称为**退出控制循环**。测试条件位于循环体末尾的循环被称为退出控制循环。在这些循环中，最为人所知的是退出控制循环。\n\
