    \ the types in each category stem from differences in copying strategies, which\
    \ in turn result in each type being stored differently in memory.\n\n## Value\
    \ types\n\nValue types encompass most built-in types (In specific terms, all numeric\
    \ types, char type, and bool type) as well as custom struct and enum type. These\
    \ types all have a fixed size, variables of value types directly contain their\
    \ own values.\n\n## Reference types\n\nReference types comprise all classes, array,\
    \ delegate and interface types and are handled differently by the compiler. For\
    \ example, take the Circle Class type (previous code listing). Once you declare\
    \ a Circle variable, the compiler allocates a small portion of memory which can\
    \ possibly hold the address of (or a reference to) additional block of memory\
    \ holding a Circle. Only once an actual Circle object is created (via the new\
    \ keyword) then the memory is allocated.\n\n## Copying value & reference types\n\
    \nWhen you take a copy of a value type there are two memory locations. For example,\
    \ you create a integer variable called i and give it the value 42 then an additional\
    \ integer variable named copy and assign i to copy, copy will hold the identical\
    \ value as i (42). Although copy and i hold the exact same value, there are actually\
    \ two blocks of memory holding the value 42: one block and another block for copy.\
    \ If you adjust the value of i, the value of copy doesn't change:\n\n```csharp\n\
    int i = 42; // declare i as integer & assign i 42\n```\n\n```csharp\nint copyi\
    \ = i; /* declare copyi equal to i (i copyi now holds a copy of i - its value\
    \ 42) */\n```\n\n```csharp\ni++;/* incrementing by 1. copyi is unchanged*/\ni\
    \ now holds 43, but copyi still has 42 value*/\n```\n\nThis is in marked difference\
    \ to declaring a variable as a class type where you are essentially copying the\
    \ same address. E.g. if you declare c as a Circle, c can refer to a Circle object;\
    \ the actual value held by c is the address of a Circle object in memory. Should\
    \ you declare a further variable called refc (a Circle) and assign c to refc,\
    \ refc will have a copy of the identical address as c. To summarize, both refc\
    \ and c now denote the Circle object.\n\n```csharp\nCircle c = new Circle(42);\
    \ // declare c variable of Circle object = 42\n```\n\n```csharp\nCircle refc =\
    \ c;// assign c to refc. refc has identical address as c\n```\n\nNote that the\
    \ behaviour of method parameters hinge on whether they are value types or reference\
    \ types.\n\n## Null values\n\nThe null value identified with the null keyword,\
    \ indicates that the variable does not refer to any valid object, i.e. stipulates\
    \ that a variable does not exist. This may seem a bit confusing when we are first\
    \ getting started, so a good way to take a look at this is to look at some of\
    \ the coding that we need to put it below:\n\n```csharp\nstatic void Main()\n\
    {\n    String phoneNum;\n    phoneNum = null;\n}\n```\n\n## Nullable types\n\n\
    Value types can’t typically be null. However, C# defines a modifier that you can\
    \ use to declare that a value type is nullable, like so:\n\n```csharp\nint? i\
    \ = null; // valid code\n```\n\nYou can ascertain whether a nullable variable\
    \ contains null by testing it in the same way as reference type:\n\n```csharp\n\
    if (i== null)\n```\n\n## The System.Object class\n\nOne of the most important\
    \ reference types in the .NET Framework is the Object class. To completely appreciate\
    \ the significance of the System.Object you need understand inheritance - described\
    \ later in this Ebook. For the time being, simply accept that all classes are\
    \ specialized types of System.Object and that you can use System.Object to create\
    \ a variable that can refer to any reference type.\n\nIn the subsequent example,\
    \ the variables c and o both reference the same object. The fact that the type\
    \ of c is Circle and the type of o is object (the alias for System.Object) in\
    \ effect offers two different views of the same item in memory.\n\n```csharp\n\
    Circle c;\nc = new Circle(42);\nobject o;\no = c;\n```\n\n## Boxing\n\nAs discussed,\
    \ variables of type object can refer to any item of any reference type. However,\
    \ variables of type object can also refer to a value type. To illustrate, both\
    \ the following statements initialize the variable i (of type int, a value type)\
    \ to 42 and then initialize the variable o (of type object, a reference type)\
    \ to i:\n\n```csharp\nint i = 42;\n```\n\n```csharp\nobject o = i;\n```\n\nIn\
    \ the second there is a bit more happening. Remember that i is a value type and\
    \ that it lives on the stack. Should the reference o referred directly to i, then\
    \ the reference would refer to the stack. Nevertheless, all references must refer\
    \ to objects on the heap; creating references to items on the stack could seriously\
    \ compromise the robustness of the runtime and create a potential security flaw,\
    \ so it is not allowed. Therefore, the runtime allocates a piece of memory from\
    \ the heap, copies the value of integer i to this piece of memory, and then refers\
    \ the object o to this copy. Boxing is term for automatically copying an item\
    \ from the stack to the heap.\n"
  mdcn: "\n在编写代码时，有时你可能需要在代码的同一部分将两个循环结合在一起。你需要确保它们能够相互结合，并且都运行到两者完成为止。这对于你想要编写的一些代码非常重要，例如在此过程中创建你自己的乘法表。这些嵌套循环（即在一个循环内部另一个循环）的良好示例包括：\n\
    \n```csharp\n// C# program to demonstrate nested loops\nusing System;\n\nclass\
    \ nestedLoops\n{\n    public static void Main()\n    {\n        // 循环中的循环，打印 GeeksforGeeks\n\
    \        for(int i = 2; i < 3; i++)\n            for(int j = 1; j < i; j++)\n\
    \                Console.WriteLine(\"GeeksforGeeks\");\n    }\n}\n```\n\n最后，我们在本章将介绍的最后一种循环被称为\
    \ `continue` 语句。这种语句非常有用，因为我们可以利用它在特定条件下跳过循环的执行部分，然后移动流程，以便在需要时进入下一个更新部分。初学者在使用时可能会觉得有些困惑，因此观察它的好方法是查看下面的代码：\n\
    \n```csharp\n// C# program to demonstrate continue statement\n\nusing System;\n\
    \nclass demoContinue\n{\n    public static void Main()\n    {\n        // GeeksforGeeks\
    \ 只打印了 2 次\n        // 因为使用了 continue 语句\n        for(int i = 1; i < 3; i++)\n\
    \        {\n            if(i == 2)\n            {\n                continue;\n\
    \            }\n            Console.WriteLine(\"GeeksforGeeks\");\n    }\n}\n\
    }\n```\n\n在处理 C# 时有很多类型的循环，这是一好事，因为在很多情况下你都想在代码中使用这些循环，而且每种情况都需要不同类型的循环。好消息是，当你以正确的方式使用它们时，你能够写出所需的最佳代码，而无需同时重写大量代码。花时间研究这些不同的循环以及它们能为你提供什么，并尝试几次，看看它们在你自己的代码中是如何运行的。\n\
    \n## 第 5 章 值类型和引用类型\n\nC# 中的类型可以分为值类型或引用类型。每类类型之间的差异源于拷贝策略的不同，这又导致了每种类型在内存中的存储方式不同。\n\
    \n## 值类型\n\n值类型包含了大多数内置类型（具体而言，所有数值类型、char 类型和 bool 类型）以及自定义的 struct（结构体）和 enum（枚举）类型。这些类型具有固定的大小，值类型的变量直接包含它们的值。\n\
    \n## 引用类型\n\n引用类型包括所有的类、数组、委托和接口类型，编译器以不同的方式处理它们。例如，考虑 `Circle` 类（之前的代码列表）。一旦你声明了一个\
    \ `Circle` 变量，编译器就会分配一小部分内存用于存储持有 `Circle` 的额外内存块的地址（或引用）。只有当通过 `new` 关键字创建了实际的\
    \ `Circle` 对象后，才会分配内存。\n\n## 拷贝值类型和引用类型\n\n当你对类型进行拷贝时，有两个内存位置。例如，你创建了一个名为 `i`\
    \ 的整数变量并赋值为 42，然后创建了一个名为 `copy` 的额外整数变量并将 `i` 赋值给 `copy`，`copy` 将持有与 `i` 相同的值\
    \ (42)。尽管 `copy` 和 `i` 持有完全相同的值，但实际上有两个内存块持有值 42：一个块属于 `i`，另一个块属于 `copy`。如果你调整了\
    \ `i` 的值，`copy` 的值不会改变：\n\n```csharp\nint i = 42; // 声明 i 为整数并赋值 42\n```\n\n```csharp\n\
    int copyi = i; /* 声明 copyi 等于 i (copyi 现在持有 i 的副本 - 其值为 42) */\n```\n\n```csharp\n\
    i++;/* 增 1. copyi 保持不变*/\ni 现在持有 43，但 copyi 仍为值 42*/\n```\n\n这与声明类类型的变量有显著区别，你本质上是在拷贝同一个地址。例如，如果你声明\
    \ `c` 为 `Circle`，`c` 可以引用一个 `Circle` 对象；`c` 持有的实际值是内存中 `Circle` 对象的地址。如果你声明另一个名为\
    \ `refc` (Circle) 的变量并将 `c` 赋值给 `refc`，`refc` 将拥有与 `c` 相同的地址副本。总结来说，`refc` 和 `c`\
    \ 现在指向同一个 `Circle` 对象。\n\n```csharp\nCircle c = new Circle(42); // 声明 Circle 对象变量\
    \ c = 42\n```\n\n```csharp\nCircle refc = c;// 将 c 赋值给 refc. refc 与 c 地址相同\n```\n\
    \n注意，方法参数的行为取决于它们是值类型还是引用类型。\n\n## Null 值\n\n用 `null` 关键字标识的 `null` 值表示变量不引用任何有效对象，即规定变量不存在。这在初学者在使用时可能会觉得有些困惑，因此观察它的好方法是查看下面的代码：\n\
    \n```csharp\nstatic void Main()\n{\n    String phoneNum;\n    phoneNum = null;\n\
    }\n```\n*(注：原文中 Null values 部分存在大量重复和 OCR 错误，已根据要求进行清理并保留核心逻辑内容)*\n"
