    # Chapter 13 Nullable Types


    C# provides some special types that consist of an additional null value along
    with the usual possible range of values of that data type. For example, int32
    data type can store a null value ranging from -2147483648 to 2147483647 while
    the nullableint32 is able to store a null value along with its original range.
    Similarly, in the case of a Boolean variable, the Nullable of a Boolean variable
    is able to store a true, false, or a null value in it.


    In this chapter we will study:


    Contents


    +   - Structures of Nullable types in C#n- Syntax of Nullable types

