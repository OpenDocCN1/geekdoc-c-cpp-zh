- md: "\n# Introduction\n\nC is a general high-level programming language ideal for\
    \ creating various firmware or portable applications. C is one of the most used\
    \ programming languages, as well as one of the oldest existing languages there\
    \ is. It has led to the creation of other languages such as C++. It's one of the\
    \ preferred languages because of its power and flexibility.\n\nEven with its low-level\
    \ proficiencies, C was made to promote cross-platform programming and has achieved\
    \ a huge following, even in academic communities. It has also been standardized\
    \ and made a part of POSIX, which stands for Portable Operating System Interface.\n\
    \nThe first major creation using C was actually the Unix operating system. Because\
    \ of that, Unix has been always connected to C. Today, however, C has become independent\
    \ from Unix but is still viewed as an important language for every programmer\
    \ to use.\n\nIt's good to learn C programming; it has been here for a while because\
    \ it's such a low-level language, it's still very powerful and useful. It's a\
    \ great way to get to learn other languages better. You'll find it easy to move\
    \ on to other programming languages. C is also relatively easy to use for application\
    \ development.\n\n# C Programming Features\n\nWhat features does the C Programming\
    \ Language offer? Here are some of them:\n\n- It has this basic form of modularity;\
    \ files can possibly be separately linked and compiled.\n\n- You have a set number\
    \ of keywords that includes control primitives i.e. if, for, switch, while and\
    \ do while.\n\n- Different assignments can be used in one statement.\n\n- It offers\
    \ different mathematical and logical operators with bit manipulators.\n\n- You\
    \ can choose to ignore function return values if not needed.\n\n- Typing is static\
    \ for C, but weakly enforced. All the data has type, yet yet can possibly be implicitly\
    \ converted such as using characters as integers.\n\n# Chapter 1 Data Types\n\n\
    In the C programming language, data types allude to a framework utilized for pronouncing\
    \ variables or functions of distinctive data types. The type of a variable decides\
    \ the amount of space it will take and how the bit pattern saved in it is utilized.\
    \ The fundamental classification used for data types is given below:\n\n- Basic\
    \ Types:\n  They are number-crunching sorts and comprises of the two following\
    \ types: (a) integer sorts and (b) floating point sorts.\n- Enumerated sorts:\n\
    \  They are again number sorts and are utilized to characterize variables that\
    \ must be allocated discrete number values all through the system.\n- Void type:\n\
    \  The keyword void demonstrates that no value can be assigned.\n- Derived sorts:\n\
    \  They incorporate (a) Array, Pointer, (c) Union, (d) Structure and (e) Function.\
    \ The array and structure data types are also referred to as aggregate types.\
    \ The type of a function defines the kind of value the function will return upon\
    \ termination. We will discuss the essential data types in the accompanying segments.\n\
    \n# Integer Types\n\nHere is a list of data types that follow under this category.\
    \ In addition, the storage space occupied by them and their range are also specified\
    \ for your reference.\n\n- char\n  - Allocated Memory: 1 byte\n  - Range: -128\
    \ to 127 or 0 to 255\n\n- signed char\n  - Allocated Memory: 1 byte\n  - Range:\
    \ -128 to 127\n\n- unsigned char\n  - Allocated Memory: 1 byte\n  - Range: 0 to\
    \ 255\n\n- int\n  - Allocated Memory: 2 or 4 bytes\n  - Range: -32,768 to 32,767\
    \ or -2,147,483,648 to 2,147,483,647\n\n- short\n  - Allocated Memory: 2 bytes\n\
    \  - Range: -32,768 to 32,767\n\n- unsigned short\n  - Allocated Memory: 2 bytes\n\
    \  - Range: 0 to 65,535\n\n- unsigned int\n  - Allocated Memory: 2 or 4 bytes\n\
    \  - Range: 0 to 65,535 or 0 to 4,294,967,295\n\n- long\n  - Allocated Memory:\
    \ 4 bytes\n  - Range: -2,147,483,648 to 2,147,483,647\n\n- unsigned long\n  -\
    \ Allocated Memory: 4 bytes\n  - Range: 0 to 4,294,967,295\n\nTo get the precise\
    \ size of a variable or data type, you can utilize the sizeof operator. The declarations\
    \ sizeof(<data type>) yields the size of the data type or variable in bytes. Given\
    \ below is an example, which illustrates the concept, discussed below:\n\n```c\n\
    #include <limits.h>\n#include <stdio.h>\nint main() {\n    printf(\"Data type\
    \ char (size in bytes): %d \\n\", sizeof(char));\n    return 0;\n}\n```\n\nUpon\
    \ compilation and execution of this code, you must get the following output:\n\
    Data type char (size in bytes): 1\n\n# Floating Point Data Types\n\nHere is a\
