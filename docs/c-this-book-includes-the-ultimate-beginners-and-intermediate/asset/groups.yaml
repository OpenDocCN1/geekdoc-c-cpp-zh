    along with the range of data that each data type can store. Nullable types have
    an additional value of Null.


    | Type | Range |

    |---|---|

    | Nullable Boolean | True or False or Null |

    | Nullable byte | 0 to 255 or Null |

    | Nullable decimal | (-7.9 x 1028 to 7.9 x 1028) / 100 to 28 or Null |

    | Nullable double | (+/-)5.0 x 10-324 to (+/-)1.7'
