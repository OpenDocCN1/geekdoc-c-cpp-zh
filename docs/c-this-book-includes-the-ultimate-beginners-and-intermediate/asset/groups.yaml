    ## Chapter 5 Value types and Reference types\n\nTypes in C# can be split into\
    \ either value types or reference types. The differences between the types in\
    \ each category stem from differences in copying strategies, which in turn result\
    \ in each type being stored differently in memory.\n\n## Value types\n\nValue\
    \ types encompass most built-in types (In specific terms, all numeric types, char\
    \ type, and bool type) as well as custom struct and enum type. These types all\
    \ have a fixed size, variables of value types directly contain their own values.\n\
    \n## Reference types\n\nReference types comprise all classes, array, delegate\
    \ and interface types and are handled differently by the compiler. For example,\
    \ take the Circle Class type (previous code listing). Once you declare a Circle\
    \ variable, the compiler allocates a small portion of memory which can possibly\
    \ hold the address of (or a reference to) additional block of memory holding a\
    \ Circle. Only once an actual Circle object is created (via the new keyword) then\
    \ the memory is allocated.\n\n## Copying value & reference types\n\nWhen you take\
    \ a copy of a value type there are two memory locations. For example, you create\
    \ a integer variable called i and give it the value 42 then an additional integer\
    \ variable named copy and assign i to copy, copy will hold the identical value\
    \ as i (42). Although copy and i hold the exact same value, there are actually\
    \ two blocks of memory holding the value 42: one block and another block for copy.\
    \ If you adjust the value of i, the value of copy doesn't change:\n\n```csharp\n\
    int i = 42; // declare i as integer & assign i 42\n```\n\n```csharp\nint copyi\
    \ = i; /* declare copyi equal to i (i copyi now holds a copy of i - its value\
    \ 42) */\n```\n\n```csharp\ni++;/* incrementing by 1. copyi is unchanged*/\ni\
    \ now holds 43, but copyi still has 42 value*/\n```\n\nThis is in marked difference\
    \ to declaring a variable as a class type where you are essentially copying the\
    \ same address. E.g. if you declare c as a Circle, c can refer to a Circle object;\
    \ the actual value held by c is the address of a Circle object in memory. Should\
    \ you declare a further variable called refc (a Circle) and assign c to refc,\
    \ refc will have a copy of the identical address as c. To summarize, both refc\
    \ and c now denote the Circle object.\n\n```csharp\nCircle c = new Circle(42);\
    \ // declare c variable of Circle object = 42\n```\n\n```csharp\nCircle refc =\
    \ c;// assign c to refc. refc has identical address as c\n```\n\nNote that the\
    \ behaviour of method parameters hinge on whether they are value types or reference\
