    学习一个程序并真正理解它是非常棒的——这确实是我们目前最接近拥有“魔法力量”的时刻。你可以从无中生有，从零开始构建，并让它完全按照你的意图运行。


    在这一系列指南中，你学习了 C# 的基础知识，虽然我不可能教你所有需要知道的内容，但我至少为你开启了一段发现之旅。我希望你现在觉得可以迈出下一步了，并且已经准备好深入学习
    C#，直到你熟练使用它。


    感谢你花时间阅读我的指南，我想借此机会祝你的 C# 编程之旅好运。


    # 结


    本指南到此结束。C# 是一种由微软开发的编译型编程语言。C# 也是一种面向对象的编程语言，意味着它支持类、对象、继承、封装等概念。要在 C# 中编程，你需要
    .Net 框架。该框架也由微软开发。你还需要一个集成开发环境（IDE）。Visual Studio 是编程 C# 时常用的 IDE。你可以在网上获取它的免费版本。.Net
    框架只能运行在 Windows 操作系统上。这意味着如果你正在使用 Linux 或 Mac OS，你必须寻找替代方案以便使用 C# 编程。你可以使用 Mono，这是一个作为
    .Net 框架替代方案的开源框架。它可以同时在 Linux 和 Mac OS 上运行。


    C# 是一种易的编程语言，甚至非常适合编程初学者。你只需要搭建环境并开始编写和运行你的 C# 代码。你可以仅使用 C# 就能开发一个完整的计算机应用程序。


    如果你喜欢开始学习 C#，那么这门奇妙的语言还有许多可以学习和可以做的。请务必通过该系列的第二本书继续你的旅程，它将探讨一些稍微复杂的话题，但仍然对初学者友好。


    C# 是一门非常有价值的编程语言，用途广泛。它是实用、高效且极易使用的。它将成为你未来编程生涯中巨大的资产和参考点。只要你能想到，你就能创造出来。不要害怕尝试新事物。


    祝好运，编程愉快！

    '
