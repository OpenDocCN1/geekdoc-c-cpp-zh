- md: "\n# Unboxing\n\nBecause a variable of type object can refer to a boxed copy\
    \ of a value, it's only reasonable to allow you to get at that boxed value through\
    \ the variable. You may be thinking that could access the boxed int value that\
    \ a variable o refers to via a simple assignment statement like:\n\n```\nint i\
    \ = o;\n```\n\nThis however will result in a compile error. You can't use the\
    \ int i = o code. The variable o could be referencing absolutely almost anything\
    \ - not just an integer. Take for example the subsequent code if such a statement\
    \ were allowable:\n\n```\nCircle c = new Circle();\n```\n\n```\nint i = 42;\n\
    ```\n\n```\nobject o;\n```\n\n```\no = c; // refers to a circle\n```\n\n```\n\
    i = o; // what is stored in i?\n```\n\nTo get the value of the boxed copy, you\
    \ must utilize what is known as a cast. This operation checks if it's safe to\
    \ convert an item of one type to another before actually making the copy. You\
    \ prefix the object variable with the name of the type in parentheses, as follows:\n\
    \n```\nint i = 42;\n```\n\n```\nobject o = i; // boxing ok\n```\n\n```\ni = (int)o;\
    \ // this compiles ok\n```\n\nThe effect of this cast is subtle. The compiler\
    \ sees that you've specified the type int in the cast. It generates code to check\
    \ what o actually refers to at run time. It could be really anything. Even though\
    \ your cast says o refers to an int, it doesn't mean that it actually does. If\
    \ o actually refer to a boxed int and everything correlates, the cast will succeed\
    \ and the compiler will extract the value from the boxed int and copy it to i.\
    \ (i.e. the boxed value will be stored in i.) This is called unboxing.\n\nHowever,\
    \ if o does not refer to a boxed int, there has been a type mismatch and the cast\
    \ will fail. InvalidCastException is invoked. The following illustrates an unboxing\
    \ cast that fails:\n\n```\nCircle c = new Circle(42);\n\nobject o = c; // fails\
    \ to box since Circle is a reference variable\n\nint i = (int)o; // compiles ok\
    \ but throws an exception at run time\n```\n\nNote that boxing and unboxing are\
    \ expensive operations because of the quantity of checking that is required and\
    \ the need to allocate additional heap memory. Boxing is useful but overuse will\
    \ really negatively impact the performance of your program.\n\n# Casting data\
    \ safely\n\nBy utilizing a cast, you can in your opinion specify that the data\
    \ referenced by an object has a specific type and it is safe to reference the\
    \ object by using that type. It is important to note that it is of your opinion.\
    \ The C# compiler will not check that this is the case, but the runtime will.\
    \ If the type of object in memory doesn't match the cast, the runtime will throw\
    \ an InvalidCastException. You should expect this exception and deal with it appropriately\
    \ when it occurs.\n\nIn saying that, catching an exception and attempting to recover\
    \ in the event that the type of an object is rather an unwieldy approach. C# offers\
    \ two really useful operators that can help you perform casting in a much more\
    \ elegant manner: is and as operators.\n\n# The is operator\n\nYou can utilize\
    \ the is operator to authenticate that the type of an object is what you assume\
    \ it to be, like so:\n\n```\nWrappedInteger wi = new WrappedInteger();\n```\n\n\
    ...\n\n```\nobject o = wi;\n\nif (o is WrappedInteger)\n{\n    WrappedInteger\
    \ temp = (WrappedInteger)o;\n    // This is safe;\n    o is a WrappedInteger\n\
    }\n...\n```\n\nThe operator accepts two operands: the left - a reference to an\
    \ object, the right – a type. Should type of the object, referred to on the heap,\
    \ have the specified type, it evaluates to true; or else, it evaluates to false.\
    \ The prior code tries to cast the reference to the object variable o only if\
    \ it knows that the cast will be successful.\n\n The as operator\n\nThe as operator\
    \ achieves a similar role to is but in a slightly condensed method. You utilize\
    \ the as operator like so:\n\n```\nWrappedInteger wi = new WrappedInteger();\n\
    ...\nobject o = wi;\nWrappedInteger temp = o as WrappedInteger;\n\nif (temp !=\
    \ null)\n{\n    // Cast was a success!\n}\n```\n\nThe as operator is similar to\
    \ the is operator in that it takes an object and a type as its operands. The runtime\
    \ attempts to cast the object to the specified type. If the cast is a success,\
    \ the result is returned and is assigned to the WrappedInteger variable. Should\
    \ the cast fail, then the as operator appraises to the null value and instead\
    \ assigns that to temp.\n\n# Chapter 6 Enumerations\n\nAn enum is a value type\
    \ that the developer can declare. The key characteristic of an enum is that it\
    \ declares at compile time a set of possible constant values that can be referred\
    \ to by name. The subsequent is an example of an enum:\n\n```\nenum Season { Spring,\
    \ Summer, Autumn, Winter }\n```\n\nOnce you have declared an enum, you can use\
    \ it in the exact same way as any other type. That is, if the name of your enum\
    \ is Season then you can create variables, fields and parameters of type Season\
    \ as demonstrated here:\n\n```\nenum Season { Spring, Summer, Autumn, Winter }\n\
    \nclass Example\n{\n    public void Method(Season parameter) // method parameter\n\
    \    {\n        Season localVariable; // local variable\n        ...\n    }\n\
    \    private Season currentSeason; // private field\n}\n```\n\nAn enum is a value\
    \ type that the developer can declare. The key characteristic of an enum is that\
    \ it declares at compile time a set of possible constant values that can be referred\
    \ to by name. The subsequent is an example of an enum:\n\n```\nenum Season { Spring,\
    \ Summer, Autumn, Winter }\n```\n\nOnce you have declared an enum, you can use\
