    # Accessing the classes


    The next thing that we will take a look at how to access these classes. C# allows
    support from four modifiers when it comes to who can access each class. These
    modifiers are ‘public,’ ‘internal,’ ‘private,’ and ‘protected.’ What these modifiers
    do is that they allow you to control who will be able to see the elements that
    are in a particular class. Let''s look at how each of these work so you can decide
    which one to use when writing your own code:


    +   * Private


    The function of this modifier is will place some strict restrictions on one of
    your classes. If the class is tagged as a private class, it will not be accessible
    by the other classes in the code. The C# language will use this as the default
    modifier if you do not place anything else there. This can help to avoid problems
    in the future in case you forget to add on that modifier.


    +   * Public


    You can also choose to make the class public. This means that the modifier will
    tell the other classes that they have access to this class. This modifier can
    take away all the limitations about how visible this class is to all the other
    classes.


    +   * Internal


    If your code has the ‘internal’ modifier on it, it means that this class will
    be accessible, but only to the files that fall in the same project.


    +   * Protected


    This is the modifier that you want to use if you would like to prevent a user
    from accessing the element. However, it allows all the descendant classes to have
    access to the elements of that class if they need it.


    As you can see, each of these elements works in a slightly different way compared
    to one another based on how you want your classes to be private in terms of permitted
    access. If you would like to make sure that the class remains private and that
    nothing or no one else is allowed to get ahead of it or use the information, then
    you working in the private setting is obviously the best for you. However, if
    you need'
  - '[PAGE 231]


    other classes to have the ability to work with this particular class, then it
    is just fine to change it to the public modifier.


    As you go through your program, think about which of these modifiers will work
