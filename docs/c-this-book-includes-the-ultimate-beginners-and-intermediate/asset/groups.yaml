    \    private Season currentSeason; // private field\n}\n```\n\n# Structures\n\n\
    Classes specify reference types that are created on the heap. However, on some\
    \ occasions the class may have so little data that the overhead of managing it\
    \ is disproportionate. Since structs are stored on the stack, as long as the structure\
    \ is reasonably small, the memory overhead is reduced.\n\nA structure is similar\
    \ to a class in that it can have its own fields, methods, and constructors. Declaring\
    \ a structure is similar to that of a class. You utilize the keyword struct the\
    \ name of the type, then followed by the body of the structure. Here for example\
    \ is a structure named Time that contains three fields:\n\n```\nstruct Time\n\
    {\n    public int hours, minutes, seconds;\n}\n```\n\nIn some cases, there is\
    \ no way to control the values. A better idea is to make the fields private and\
    \ provide your structure with constructors to initialize these fields, as shown\
    \ in this example:\n\n```c\nstruct Time\n{\n    private int hours, minutes, seconds;\n\
    \    ...\npublic Time(int hh, int mm, int ss)\n{\n    this.hours = hh % 24;\n\
    \    this.minutes = mm % 60;\n    this.seconds = ss % 60;\n}\n\npublic int Hours()\n\
    {\n    return this.hours;\n}\n```\n\nWhen you copy a value type variable, you\
    \ get two copies of the value. With reference types however, once you copy a variable,\
    \ you get two references to the said object. In summary, use structures for small\
    \ data values for which it is just as efficient to copy the value as it would\
    \ be to copy an address.\n\n# Differences between structures and classes\n\nSyntactically\
    \ a structure and a class are somewhat alike, although there are a few significant\
    \ differences. Firstly, it is impossible to declare a default constructor (i.e.\
    \ a constructor with zero parameters) for a structure. In the next example the\
    \ code would compile if Time were a class, but since Time is a structure, it doesn’t:\n\
    \n```\nstruct Time\n{\n    public Time() { . . . } // Results in compile time\
    \ error\n    ...\n}\n```\n\nSecondly in a class, you can initialize instance fields\
    \ at their point of declaration. In a structure, you cannot. In this next example,\
    \ the code would compile if Time were a class, but because Time is a structure,\
    \ it triggers a compile-time error:\n\n```\nstruct Time\n{\n    private int hours\
    \ = 0; // Results in compile time error\n    private int minutes;\n    private\
    \ int seconds;\n    ...\n}\n```\n\nThe main differences between a structure and\
    \ a class as summarized here:\n\n| Question | Structure | Class |\n| :--- | :---\
    \ | :--- |\n| What type is it? | Value | Reference type |\n| Are instances on\
    \ the | Stack | Heap | instances known as |\n"
  mdcn: "\n\n# 解箱 (Unboxing)\n\n由于 `object` 类型的变量可以引用值的装箱副本（boxed copy），因此允许你通过变量获取该装箱值是合理的。你可能认为可以通过简单的赋值语句来访问变量\
    \ `o` 所引用的装箱 int 值，例如：\n\n```\nint i = o;\n```\n\n然而，这将导致编译错误。你不能使用 `int i = o;`\
    \ 这样的代码。变量 `o` 可能引用几乎任何东西——不仅仅是一个整数。假设这种语句是允许的，考虑下面的代码：\n\n```\nCircle c = new\
    \ Circle();\n```\n\n```\nint i = 42;\n```\n\n```\nobject o;\n```\n\n```\no = c;\
    \ // 引用一个圆\n```\n\n```\ni = o; // i 中存储了什么？\n```\n\n要获取装箱副本的值，你必须利用所谓的类型转换（cast）。该操作在实际进行拷贝之前，会检查将一个类型的项目转换为另一种类型是否安全的。你在对象变量前加上带括号括的类型名称，如下所示：\n\
    \n```\nint i = 42;\n```\n\n```\nobject o = i; // 装箱正常\n```\n\n```\ni = (int)o;\
    \ // 编译通过\n```\n\n这种类型转换的效果是微妙的。编译器看到你在类型转换中指定了 `int` 类型。它生成代码在运行时检查 `o` 实际上引用了什么。它可能是任何东西。尽管你的类型转换说\
    \ `o` 引用一个 `int`，但这并不意味着它确实如此。如果 `o` 确实引用一个装箱 int 且一切都匹配，则转换将成功，编译器将从装箱 int 中提取值并将其拷贝到\
    \ `i`（即装箱值将存储在 `i` 中）。这被称为解箱（unboxing）。\n\n然而，如果 `o` 未引用装箱 int，则发生了类型不匹配，转换将失败。这将调用\
    \ `InvalidCastException`。下面说明了一个失败的解箱转换：\n\n```\nCircle c = new Circle(42);\n\n\
    object o = c; // 装箱失败，因为 Circle 是引用变量\n\nint i = (int)o; // 编译通过但在运行时抛出异常\n```\n\
    \n注意，装箱和解箱是非常开销的操作，因为需要大量的检查并且需要分配额外的堆内存。装箱很有用，但过度使用会严重负面影响程序的性能。\n\n# 安全地转换数据\
    \ (Casting data safely)\n\n通过利用类型转换，你可以根据你的观点指定对象引用的数据具有特定类型，并且使用该类型引用该对象是安全的。需要注意的是，这是你的观点。C#\
    \ 编译器不会检查这种情况是否成立，但运行时会检查。如果内存中对象类型与转换不匹配，运行时将抛出 `InvalidCastException`。你应该预料此异常的发生，并在其发生时进行妥善处理。\n\
    \n尽管如此，在对象类型不正确时捕获异常并尝试恢复是一种相当笨拙的方法。C# 提供了两个非常有用的运算符，可以帮助你以更优雅的方式执行类型转换：`is` 运算符和\
    \ `as` 运算符。\n\n# `is` 运算符\n\n你可以利用 `is` 运算符来验证对象的类型是否如你假设的那样，如下所示：\n\n```\nWrappedInteger\
    \ wi = new WrappedInteger();\n```\n\n...\n\n```\nobject o = wi;\n\nif (o is WrappedInteger)\n\
    {\n    WrappedInteger temp = (WrappedInteger)o;\n    // 这是安全的；\n    // o 是一个 WrappedInteger\n\
    }\n...\n```\n\n该运算符接受两个操作数：左侧——一个对象的引用，右侧——一个类型。如果堆上引用的对象具有指定的类型，则求值为 `true`；否则，求值为\
    \ `false`。前述代码仅在知道转换将成功时，才尝试将对象的引用转换为对象变量 `o`。\n\n# `as` 运算符\n\n`as` 运算符的作用与 `is`\
    \ 运算符类似，但方法略为简洁。你按如下方式使用 `as` 运算符：\n\n```\nWrappedInteger wi = new WrappedInteger();\n\
    ...\nobject o = wi;\nWrappedInteger temp = o as WrappedInteger;\n\nif (temp !=\
    \ null)\n{\n    // 转换成功了！\n}\n```\n\n`as` 运算符与 `is` 运算符相似之处在于它也接受一个对象和一个类型作为操作数。运行时尝试将对象转换为指定的类型。如果转换成功，则返回结果并赋值给\
    \ `WrappedInteger` 变量。如果转换失败，则 `as` 运算符评估为 `null` 值，并将该值赋值给 `temp`。\n\n# 第 6 章\
    \ 枚举 (Enumerations)\n\n枚举（enum）是开发者可以声明的值类型。枚举的核心特征是它在编译时声明一组可以通过名称引用的可能的常量值。下面是枚举的示例：\n\
    \n```\nenum Season { Spring, Summer, Autumn, Winter }\n```\n\n一旦你声明了枚举，就可以像使用任何其他类型一样使用它。也就是说，如果你的枚举名称是\
    \ `Season`，那么你可以像这里演示的那样创建 `Season` 类型的变量、字段和参数：\n\n```\nenum Season { Spring,\
    \ Summer, Autumn, Winter }\n\nclass Example\n{\n    public void Method(Season\
    \ parameter) // 方法参数\n    {\n        Season localVariable; // 局部变量\n        ...\n\
    \    }\n    private Season currentSeason; // 私有字段\n}\n```\n\n（注：原文后续部分存在大量重复的枚举描述段落，根据要求，此处已按逻辑处理，避免重复输出翻译，确保核心内容完整：）\n\
    \n```\nenum Season { Spring, Summer, Autumn, Winter }\n```\n\n一旦你声明了枚举，就可以像使用任何其他类型一样使用它。也就是说，如果你的枚举名称是\
    \ `Season`，那么你可以像这里演示的那样创建 `Season` 类型的变量、字段和参数：\n\n```\nenum Season { Spring,\
    \ Summer, Autumn, Winter }\n\nclass Example\n{\n    public void Method(Season\
    \ parameter) // 方法参数\n    {\n        Season localVariable; // 局部变量\n        ...\n\
    \    }\n    private Season currentSeason; // 私有字段\n}\n```\n\n（此处省略原文中重复出现的相同段落，以保持文档整洁）\n\
    \n# 结构 (Structures)\n\n类（Classes）指定在堆上创建的引用类型。然而，在某些情况下管理它们是不比例的。由于结构存储在栈上，只要结构足够小，内存开销就会减少。\n\
    \n结构与类相似之处在于它可以拥有自己的字段、方法和构造函数。声明结构的方式与类相似。这里是一个包含三个字段的结构示例：\n\n```\nstruct Time\n\
    {\n    public int hours, minutes, seconds;\n}\n```\n\n在某些情况下，没有方法控制值。更好的想法是将字段设为私有，并为结构提供构造函数来初始化这些字段，如下所示：\n\
    \n```c\nstruct Time\n{\n    private int hours, minutes, seconds;\n    ...\npublic\
    \ Time(int hh, int mm, int ss)\n{\n    this.hours = hh % 24;\n    this.minutes\
    \ = mm % 60;\n    this.seconds = ss % 60;\n}\n\npublic int Hours()\n{\n    return\
    \ this.hours;\n}\n```\n\n当你拷贝值类型变量时，你会得到该值的副本。而对于引用类型，一旦你拷贝变量，你得到的是对该对象的引用。总结来说，对于拷贝值比拷贝地址更高效的数据，请使用结构。\n\
    \n# 结构与类的区别 (Differences between structures and classes)\n\n在语法上，结构和类有些相似，尽管存在一些显著的区别。首先，结构无法声明默认构造函数（即零参数的构造函数）。在下一个示例中，如果\
    \ Time 是类，代码将通过，但由于 Time 是结构，则不会：\n\n```\nstruct Time\n{\n    public Time() {\
    \ . . . } // 编译错误\n    ...\n}\n```\n\n其次，在类中，你可以在声明处初始化实例字段。在结构中，你可以这样做。在接下来的示例中，如果\
    \ Time 是类，代码将通过，但因为 Time 是结构，它会触发编译时错误：\n\n```\nstruct Time\n{\n    private int\
    \ hours = 0; // 编译错误\n    private int minutes;\n    private int seconds;\n   \
    \ ...\n}\n```\n\n下表总结了结构与类的区别：\n\n| 问题 | 结构 | 类 |\n| :--- | :--- | :--- |\n| 是什么类型？\
    \ | 值 | 引用类型 |\n| 实例在哪个位置？ | 栈 | 堆 | 被称为 |\n\n"
