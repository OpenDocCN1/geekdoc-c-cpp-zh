    by Microsoft. C# is also an object-oriented programming language, meaning that
    it supports concepts like the use of classes, objects, inheritance, encapsulation,
    etc. To program in C#, you need the .Net framework. This framework was also developed
    by Microsoft. You also need an integrated development environment (IDE). Visual
    studio is the common IDE used for programming in C#. You can get its free edition
    online. The .Net framework can only run on the Windows operating system. This
