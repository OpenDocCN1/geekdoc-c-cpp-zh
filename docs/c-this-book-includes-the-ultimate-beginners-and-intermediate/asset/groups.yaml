- md: "\nthe other programs.\n\nhow do I need to get started?\n\nNow it is time to\
    \ learn what you will need to get started with using this programming language\
    \ so you can get to make the codes that you want. The first thing that you should\
    \ look at is to check whether or not your code has the .NET framework in place.\
    \ You should also have the development kit for this presentation on your Windows\
    \ computer. Starting on Windows Vista, this framework was automatically placed\
    \ on the computer for you so this will save you some time if you are working with\
    \ the right operating system.\n\nIf you are on a computer that does not have the\
    \ .NET framework, you will have to go with Mono Project rather than working with\
    \ the .NET framework for your projects. You can visit the Microsoft store at www.microsoft.com\
    \ to find the right framework for the computer that you want to work with.\n\n\
    Remember that this language works the best for Windows computers, but this doesn't\
    \ mean you can't use it on other systems. If you are working with a MAC or a Linux\
    \ computer, you have to make sure that you are working with Mono Project rather\
    \ than the .NET framework. You can check out their website: www.monoproject.com\
    \ where you can find the right framework for your system.\n\n## Getting started\
    \ with the C# language\n\nAfter you have gone through and downloaded the things\
    \ that you need, it is time to get started with using the C# language. When it\
    \ comes to working with your Windows computer, C# is a great programming language\
    \ to work with. It is compatible with the .NET framework that should already be\
    \ found on your Windows computer. The C# language is also really simple and flexible\
    \ to use, and at the same time, it provides you with the power that your codes\
    \ will need. If you are someone who is still new to the idea of programming and\
    \ you like using Windows products, then the C# language is definitely worth your\
    \ time to learn and use.\n\nJust like when you work with Java, C# will not support\
    \ any code pointers, and you won’t have any access to working with multiple inheritances.\
    \ It is important to remember this because some other programming languages are\
    \ capable of doing those things. Rather, memory collection and type checking are\
    \ what C# can offer. It also has some powerful and useful features that you may\
    \ recognize if you’re familiar with using C++ so you can add a lot of functionality\
    \ to your codes. Let's take a look at some of the things that you can do with\
    \ code writing in C#.\n\n## Writing out a program with C#\n\nThe best thing that\
    \ you can do while you're still learning how to work with C# is to actually write\
    \ out a program and see how the code looks. As an example, we will write out a\
    \ simple program that will help you understand what is going on with C# and how\
    \ it can be used to help out with other codes that you might want to write in\
    \ the future.\n\nThe first thing that you have to do is launch the text editor\
    \ that you prefer using. If you are using a computer on the Windows operating\
    \ system, going with the popular Notepad is a great option. There are also several\
    \ other options available depending on the type of computer you are planning on\
    \ working with.\n\nOnce the text editor is open and ready to go, write out the\
    \ following code inside:\n\n```\nclass FirstProgram\n{\n  static void Main()\n\
    {\n    Console.WriteLine(\"Using C# is fun.\");\n  }\n}\n```\n\nNow you can access\
    \ the command prompt and type:\n\ncsc FirstProgram.cs\n\nAfter you issue this\
    \ command, the compiler for C# will process this file and then create an .exe\
    \ file in the same location as your code. For example, if you saved the original\
    \ file on the desktop, you should see a new program come up called ‘FirstProgram.exe’\
    \ right in the same place. If there is an error in the code that you wrote, you\
    \ will see an error message come up.\n\nNow you can run this application by entering\
    \ ‘FirstProgram.exe’ into the command prompt. If everything was done correctly,\
    \ you should see that the command prompt will display the message: ‘Using C# is\
    \ fun’.\n\n## Analyzing the program\n\nNow that you have written out the program\
    \ that you want to use, it is time to take a look at the different parts of the\
    \ code and what they all mean. The code above is pretty simple to work with, and\
    \ you will find that it will include a variety of the different components that\
    \ you need to write out a decent code inside C#. Some of the parts that you should\
    \ look for include the following:\n\n- The first line\n\nIn the first line, we\
    \ will include the identifier and the keyword. The keyword is the word inside\
    \ the code that has special functions inside the language. With the keyword that\
    \ we used in the last example, you were creating a new class for the program.\
    \ The identifier is in charge of listing out the code, the variable, and the method\
    \ and the one that we are using here is called ‘FirstProgram’.\n\n- The third\
    \ line\n\nIn this line, we will define the method Main(). This is what will be\
    \ the starting point for any of the applications that are on your computer. The\
    \ program will always start if the Main() method is executed, no matter where\
    \ you place it inside the code. Only two words will fit in there, and one of them\
    \ will be ‘static’ while the other one is ‘void.’ These will help to determine\
    \ the kind of object that is in the code.\n\n- The fifth line\n\nThis is the final\
    \ part of the code we are working on. On this line is where you write out the\
    \ message that you want to come after the code has been executed. This method\
    \ is called WriteLine() and it's used to make sure that you can write things out\
    \ of the code. You can also add any message that you like.\n\nIn addition to the\
    \ things that we talked about, you may have noticed that there were braces placed\
    \ into the code. These braces are to tell our computer that there are some blocks\
    \ of code throughout the program and it will keep everything separated nicely.\
    \ Keep in mind that when you write your code in C#, you have to use a semicolon\
    \ the same way you do when writing a code with C and with Java.\n\n## Comments\
    \ in C#\n\nIt is useful to know how to leave comments when you’re writing a code\
    \ with the C# coding language. These comments are helpful no matter what kind\
    \ of programming language you prefer to use and can add a little something to\
    \ the code that you are trying to create. These are like little notes that will\
    \ remind you or tell the other programmers something about your code. When you\
    \ write the comments properly, the compiler will know that it should skip over\
    \ them and will not read through them. You can add in as many of these comments\
    \ as you would like, but it is best if they are only used when necessary, so they\
    \ do not make the code look too messy.\n\nThere are two main types of comments\
    \ that you can work with inside of C#. The first one is a ‘single line’ comment.\
    \ This is written with two forward slashes. These are used only if you need to\
    \ write out a small sentence or a few words, and you want all of it to stay on\
    \ one line. If you end up using these slashes, and then you go over that one line,\
    \ the compiler will notice this and will bring up an error message.\n\nYou can\
    \ also choose to work with multi-line comments. There are times when you might\
    \ want or need to write out a comment that is a bit longer. You would not be able\
    \ to do this with the slashes that we talked about before. If you would like to\
    \ write out one of these longer comments, you simply have to write /* at the beginning\
    \ of the comment and end it with */.\n\nIt really is that simple to learn how\
    \ to work with the C# programming language. It may look a little bit intimidating\
    \ at first, but with some practice and willingness to learn some of the basics\
    \ that we have already been talking about, you can start writing your codes in\
    \ no time.\n\n## Chapter 1 Data Types\n\nC# is a strongly typed language; hence\
    \ it expects you to state the data type any time you are declaring a variable.\
    \ Let us explore some of the common data types and how they work:\n\n- bool: this\
    \ is a simple data type. It takes 2 values only, True or False. It is highly applicable\
    \ when using logical operators like if statement.\n\n- int: this stands for integer.\
    \ It is a data type for storing numbers with no decimal values. It marks the most\
    \ popular data type for numbers. Integers also have several data types within\
    \ C#, based on the size of the number that is to be stored.\n\n- string: this\
    \ is used for storage of text, which is a sequence of characters. C# strings are\
    \ immutable, meaning that you cannot change a string once it has been created.\
    \ If you use a method that changes a string, the string will not be changed but\
    \ instead, a new string will be returned.\n\n- char: this is used for storage\
    \ of a single character.\n\n- float: this is a data type used for storage of numbers\
    \ with decimal values in them.\n\nThe sizeof() method allows us to know the size\
    \ of a variable or data type. The size is returned in the form of bytes.\n\nConsider\
    \ the following example:\n\n```\nusing System;\nnamespace TypeApp {\n    class\
    \ IntType {\n        static void Main(string[] args) {\n```\n"
  mdcn: "\n其他程序。\n\n我该如何开始？\n\n现在是时候学习使用这种编程语言所需的准备工作了，这样你就可以编写你想要的代码。你首先应该做的是检查你的电脑是否安装了\
    \ .NET 框架。你的 Windows 电脑上还应该安装了用于本演示的开发工具包。从 Windows Vista 开始，该框架会自动安装在你的电脑上，所以如果你使用的是正确的操作系统，这将会为你节省一些时间。\n\
    \n如果你使用的电脑没有安装 .NET 框架，你将必须使用 Mono Project 而不是 .NET 框架来进行你的项目。你可以访问微软商店 www.microsoft.com，为你想要运行的电脑寻找合适的框架。\n\
    \n请记住，这种语言在 Windows 电脑上运行最好，但这并不意味着你不能在其他系统上使用它。如果你在使用 MAC 或 Linux 电脑，你必须确保你使用的是\
    \ Mono Project 而不是 .NET 框架。你可以查看他们的网站：www.monoproject.com，在在那里你可以找到适用于你系统的框架。\n\
    \n## 开始学习 C# 语言\n\n在你浏览并下载了所需内容之后，是时候开始使用 C# 语言了。在处理 Windows 电脑时，C# 是一门非常棒的编程语言。它与你的\
    \ Windows 电脑上可能已经存在的 .NET 框架兼容。C# 语言的使用也非常简单灵活，同时它还能提供你的代码所需的动力。如果你是一个对编程概念还不熟悉的人，并且喜欢使用\
    \ Windows 产品，那么 C# 语言绝对值得你花时间去学习和使用。\n\n就像你使用 Java 一样，C# 不支持任何代码指针，你也无法使用多重继承。记住这一点很重要，因为其他一些编程语言能够做到这些事情。相反，内存收集和类型检查是\
    \ C# 所能提供的。它还具有一些强大且实用的特性，如果你熟悉使用 C++，可能会发现这些特性，这样你可以为你的代码添加很多功能。让我们看看用 C# 编写代码时可以做的一些事情。\n\
    \n## 使用 C# 编写程序\n\n在学习如何使用 C# 的期间，你可以做的最好的事情就是实际编写一个程序并查看代码的样式。作为一个示例，我们将编写一个简单的程序，帮助你理解\
    \ C# 内部发生了什么，以及它是如何帮助你未来可能想要编写的其他代码的。\n\n你必须做的第一件事是启动你喜欢的文本编辑器。如果你使用的是 Windows\
    \ 操作系统上的电脑，使用流行的记事本（Notepad）是一个很棒的选择。根据你计划使用的电脑类型，还有其他几种可用选项。\n\n一旦文本编辑器打开并准备就绪，在里面编写以下代码：\n\
    \n```\nclass FirstProgram\n{\n  static void Main()\n{\n    Console.WriteLine(\"\
    Using C# is fun.\");\n  }\n}\n```\n\n现在你可以访问命令提示符并输入：\n\ncsc FirstProgram.cs\n\
    \n在你发出此命令后，C# 编译器将处理此文件并在与你代码相同的位置创建一个 .exe 文件。例如，如果你将原始文件保存在桌面上，你应该会在同一个地方看到出现一个名为‘FirstProgram.exe’\
    \ 的新程序。如果你写的代码中有错误，你将看到一条错误消息。\n\n现在你可以通过在命令提示符中输入‘FirstProgram.exe’来运行此应用程序。如果一切都完成得正确，你应该看到命令提示符将显示消息：‘Using\
    \ C# is fun’。\n\n## 分析程序\n\n现在你已经写好了想要使用的程序，是时候查看代码的不同部分以及它们代表的意思了。上面的代码处理起来非常简单，你会发现它包含了你在\
    \ C# 中编写体面代码时所需的各种组件。你应该寻找的一些部分包括：\n\n- 第一行\n\n在第一行中，我们将包含标识符和关键字。关键字是代码中在语言内部具有特殊功能的单词。通过我们在上一个示例中使用的关键字，你正在为程序创建一个新类。标识符负责列出代码、变量和方法，我们在这里使用的那个被称为‘FirstProgram’。\n\
    \n- 第三行\n\n在这一行中，我们将定义方法 `Main()`。这将是你电脑上任何应用程序的起点。无论你将 `Main()` 方法放在代码的哪个位置，只要执行了它，程序就会一直启动。那里只有两个单词适合那里，其中一个是‘static’，另一个是‘void’。这些将帮助确定代码中对象的类型。\n\
    \n- 第五行\n\n这是我们正在处理的代码的最后部分。这一行就是你写下希望在代码执行后显示的消息。这个方法被称为 `WriteLine()`，它用于确保你可以从代码中输出内容。你也可以添加任何喜欢的的消息。\n\
    \n除了我们谈到的事情之外，你可能注意到代码中放置了大括号。这些大括号是为了告诉我们的计算机代码各处有一些代码块。\n\n## C# 中的注释\n\n注释是用来解释代码的说明，它们不会被编译器执行。注释可以帮助其他程序员（甚至是未来的你）理解代码的逻辑。\n\
    \n## C# 中的注释\n\n在 C# 中，知道如何编写注释是有用的。C# 中有两种主要的注释类型。第一种是“单行”注释，它们使用双斜杠 `//` 编写。这些注释当你只想在一行内写一些句子或单词时有用。如果你使用了这些斜杠，编译器将会并跳过它们。\n\
    \n你还可以选择使用多行注释。有时你可能需要编写较长的的注释。如果你想编写这类注释，只需在注释开始处写 `/*` 并用 `*/` 结束即可。\n\n## 第\
    \ 1 章 数据类型\n\nC# 是一门强类型语言；因此它在声明变量时要求你指明数据类型。让我们探索一些常见的数据类型以及它们的工作原理：\n\n- bool：这是一种简单的数据类型。它只取两个：True（真）或\
    \ False（假）。它在使用逻辑运算符（如 if 语句时非常有用。\n\n- int：这代表整数。它是存储不带小数数值的数据类型。它标记了最常用的数字类型。整数在\
    \ C# 中也有几种数据类型，取决于要存储数字的大小。\n\n- string：这用于存储文本，文本是字符序列。C# 字符串是不可变的，这意味着一旦创建了字符串你就无法更改它。如果你使用更改字符串的方法，字符串本身不会发生改变，而是返回一个新字符串。\n\
    \n- char：这用于存储单个字符。\n\n- float：这是一个用于存储带有小数数值的数据类型。\n\n`sizeof()` 方法允许我们了解变量或数据类型的大小。大小以字节的形式返回。\n\
    \n考虑以下示例：\n\n```\nusing System;\nnamespace TypeApp {\n    class IntType {\n  \
    \      static void Main(string[] args) {\n```\n"
