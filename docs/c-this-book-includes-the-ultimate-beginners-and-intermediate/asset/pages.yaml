  md: '# Copying value & reference types


    When you take a copy of a value type there are two memory locations. For example,
    you create a integer variable called i and give it the value 42 then an additional
    integer variable named copy and assign i to copy, copy will hold the identical
    value as i (42). Although copy and i hold the exact same value, there are actually
    two blocks of memory holding the value 42: one block and another block for copy.
    If you adjust the value of i, the value of copy doesn''t change:


    ```

    int i = 42; // declare i as integer & assign i 42

    ```


    ```

    int copyi = i; /* declare copyi equal to i (i copyi now holds a

    ncopy of i - its value 42) */

    ```


    ```

    i++;/* incrementing by 1. copyi is unchanged*/

    ```


    I now holds 43, but copyi still has 42 value*/


    This is in marked difference to declaring a variable as a class type where you
    are essentially copying the same address. E.g. if you declare c as a Circle, c
    can refer to a Circle object; the actual value held by c is the address of a Circle
    object in memory. Should you declare a further variable called refc (a Circle)
    and assign c to refc, refc will have a copy of the identical address as c. To
    summarize, both refc and c now denote the Circle object.


    ```

    Circle c = new Circle(42); // declare c variable of Lirlce object = 42

    ```


    ```

    Circle refc = c;// assign c to refc. refc has identical address as c

    ```


    Note that the behaviour of method parameters hinge on whether they are value types
    or reference types.'
