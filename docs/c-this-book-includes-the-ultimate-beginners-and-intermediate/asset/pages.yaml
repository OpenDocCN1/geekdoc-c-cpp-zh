  md: '# Floating Point Literals


    Floating Point literals are literals that possess a fractional or exponential
    part in addition to the integer part. Therefore, they may be represented in decimal
    form where the integer part is followed by a decimal point and fractional component
    or in the exponential form.


    Some examples of floating point literals are 510E, 3.14159 and 210E-5F. However,
    literals like .e55 are not allowed because they do not have an integer component.
    Likewise, constants like 210f are also invalid as they lack a decimal or exponent
    component. Therefore, the decimal form must have exponent or/and decimal and the
    exponential form must have fractional part and/or integer part.'
