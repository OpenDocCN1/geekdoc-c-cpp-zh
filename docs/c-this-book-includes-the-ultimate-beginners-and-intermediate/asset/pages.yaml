  md: '# The Graphical Hardware and Software


    # The Graphic Hardware


    In modern technology, computers utilize the concept of a bitmap display to output
    the products of most programs. In other words, the bit-mapped display consists
    of a screen which is made up of millions of pixels and picture elements. These
    pixels are usually laid out in a 2-Dimensional grid that can hold up to a range
    of (800-1560) x (600-1280). These are the numbers of the pixels in the 2-Dimensional
    grid. The quality of the display can be determined by the number of pixel in the
    output of the screen. High numbers of pixels refer to high resolution whereas
    low numbers of pixels in a screen refer to low resolution. High-resolution images
    provide very clear and sharp pictures and low-resolution images provide less quality
    pictures which are sometimes blurry and less visible to the eyes.


    In terms of storage components, the frame that stores the images in the actual
    screen is referred to as buffer frames. In connection to high-resolution pictures,
    the buffer required are directly related to the number of pixels that are found
    in the screen. However, a major drawback to the graphics technology is that the
    higher the resolution the the memory required in the buffer frames of the screen.
    This main disadvantage here is that it requires almost four times the number of
    memory space that could have been used to store the program in text form.


    The hardware which provides the display represents every value of the number of
    pixel in the buffer frame. It works by balancing the three colors which are Red,
    Blue and Green. The most interesting thing is that the balancing occurs for each
    and every pixel on the screen regardless of the range of numbers between half
    to two million pixels. It is also important to know that the color intensity of
    each and every pixel is not permanent but fades away within a fraction of a second.


    For stability of a picture, repainting of the pixel is done quickly after the
    fading of the color intensity in order to avoid flickering of pictures. For these
    to be accurately achieved, the screen must be well updated and in good condition.
    The screen should also be refreshed at least thirty to fifty times a second. The
    user is also at the liberty'
