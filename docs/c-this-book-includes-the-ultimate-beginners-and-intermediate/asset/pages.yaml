  md: '# Comments in C#


    It is useful to know how to leave comments when you’re writing a code with the
    C# coding language. These comments are helpful no matter what kind of programming
    language you prefer to use and can add a little something to the code that you
    are trying to create. These are like little notes that will remind you or tell
    the other programmers something about your code. When you write the comments properly,
    the compiler will know that it should skip over them and will not read through
    them. You can add in as many of these comments as you would like, but it is best
    if they are only used when necessary, so they do not make the code look too messy.


    There are two main types of comments that you can work with inside of C#. The
    first one is a ‘single line’ comment. This is written with two forward slashes.
    These are used only if you need to write out a small sentence or a few words,
    and you want all of it to stay on one line. If you end up using these slashes,
    and then you go over that one line, the compiler will notice this and will bring
    up an error message.


    You can also choose to work with multi-line comments. There are times when you
    might want or need to write out a comment that is a bit longer. You would not
    be able to do this with the slashes that we talked about before. If you would
    like to write out one of these longer comments, you simply have to write /* at
    the beginning of the comment and end it with */.


    It really is that simple to learn how to work with the C# programming language.
    It may look a little bit intimidating at first, but with some practice and willingness
    to learn some of the basics that we have already been talking about, you can start
    writing your codes in no time.'
  merge: -1
