  md: 'lesson that we needed to cover in this book and it does fit in well to the
    overall lesson of control flow, so we''re going to cover it here.


    Let''s go back to the inventory example. Let''s say that we wanted to create an
    array of integer values that could hold as many as 10 items. To do this, we would
    do the following:


    ```

    int[] item = new int[10];

    ```


    This initializes an array with 10 spaces.


    You can then start adding values to the array by referencing indices. An index
    of an array is a specific location within the array, or in other words, a specific
    one of the boxes which was set aside. When you initialize an array like we did
    above, you can refer to as a soft initialization, all of the values are zero from
    the get-go and essentially waiting to be filled.


    To understand how to refer to an index of an array, you have to understand how
    computers understand them. Computers don''t count things starting from 1 like
    we do. They actually start at 0. This means that if you want to refer to the first
