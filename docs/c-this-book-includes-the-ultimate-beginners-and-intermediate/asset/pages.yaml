  md: '# Boxing


    As discussed, variables of type object can refer to any item of any reference
    type. However, variables of type object can also refer to a value type. To illustrate,
    both the following statements initialize the variable i (of type int, a value
    type) to 42 and then initialize the variable o (of type object, a reference type)
    to i:


    ```

    int i = 42;

    ```


    ```

    object o = i;

    ```


    In the second there is a bit more happening. Remember that i is a value type and
    that it lives on the stack. Should the reference o referred directly to i, then
    the reference would refer to the stack. Nevertheless, all references must refer
    to objects on the heap; creating references to items on the stack could seriously
    compromise the robustness of the runtime and create a potential security flaw,
    so it is not allowed. Therefore, the runtime allocates a piece of memory from
    the heap, copies the value of integer i to this piece of memory, and then refers
    the object o to this copy. Boxing is term for automatically copying an item from
    the stack to the heap.'
  merge: -1
  pgno: 176
