  md: '# Integer Literals


    A hexadecimal or integer literal is associated with Integer Literals. The radix
    of the literal is determined by the prefix attached to the number. For instance,
    if the prefix is 0X or 0x, then the number is hexadecimal else the number is decimal.
    In addition to this, numbers may have a suffix of U or L. While U stands for unsigned,
    L stands for Long. The prefix and suffix may have any case and appear in any order.
