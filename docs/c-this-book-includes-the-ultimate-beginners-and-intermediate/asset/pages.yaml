  md: '| | x 10308 or Null |

    | Nullable DateTime | Represents an instant in Time or Null |

    | Nullable Int16 | -32,768 to +32,767 or Null |

    | Nullable Int32 | -2,147,483,648 to 2,147,483,647 or Null |

    | Nullable Int64 | -9,223,372,036,854,775,808 to +9,223,372,036,854,775,807 or
    Null |

    | Nullable Single | Single value or Null |

    | Nullable char | U+0000 to U+FFFF or Null |


    # ii. Syntax for Nullable types in C#


    Nullable types can be declared in two ways. The Syntax for the first way to declare
    a Nullable type is as follows:


    ```

    System.Nullable<data_type> <variable_name>;

    ```


    It starts with the System.Nullable keyword, followed by data_type (i.e., int,
    double) followed by the variable name.


    The Syntax for declaring a Nullable type the other way is:


    ```

    < data_type> ? <variable_name> = null;

    ```


    Starting with the data_type (i.e., int, double), it is followed by a question
    mark and then the name of variable.


    Let’s now see Nullable types at work.


