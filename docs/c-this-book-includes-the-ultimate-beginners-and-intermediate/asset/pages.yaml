  md: '# Chapter 12 Extension Methods


    Extension Methods (introduced in C# 3.0) provides programmers with a simple framework
    to “extend” the functionalities of existing types in their programs. “Static”
    in nature, Extension Methods gives you the freedom to add already present methods
    into your types without a need to create derived types or modifying any old ones.
    They use a “this” keyword in their parameters / parameters lists. Since they are
    “static” methods, it’s essential for you to use them in static classes. However,
    they are used as if they were instance methods of the extended type.


    In this chapter, we will discuss Extension Methods in depth, and will learn:


    Contents


    +   - What Extension Methods are

    - How to create them

    - How to applying Extension Methods to existing types

    - i. Extension Methods


    The OCP, Open close principle, directs programmers to write code and functions
    in a way that they are open for extension all the time, but dead end on modification.
    In C#, Extension Methods are a practical case of OCP, which we can use in custom
    defined and system user types to cater to our requirements.


    It’s also important for us to know a few basic facts about Extension Methods and
    how they work. One, they have only access (and hence can use) the “public” properties
    of the data type they are extending. Two, their type signature should never be
    the same as any existing method of that type. Three, to use Extension Methods,
    their parent type must be in the namespace of the calling application. Four, in
    case of a method overloading (methods with same signature), an instance method
    will be executed (called) instead of the Extended Method (as per the overload
    resolution mechanism), and lastly, we cannot apply Extension Methods on events,
    properties, and fields.'
