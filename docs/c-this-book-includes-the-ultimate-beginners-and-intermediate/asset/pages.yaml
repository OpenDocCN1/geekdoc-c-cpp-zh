  md: '# Chapter 3 Arrays and Loops


    I solemnly promise not to bore you straight out the gate in in this chapter with
    a long discussion on abstract logic. However, it’s important for me to make the
    case that all of this is highly important in the pursuit of a stronger grasp on
    programming. A lot of programming books will try to teach you the essentials,
    but they’ll fail to teach you the underlying concepts that actually explain why
    something works the way that it works. This means that in effect, your learning
    will be incomplete. You may have absolutely no idea why something works in the
    way that it does.


    This is the last place that you want to be when it comes to logic, though. Logic
    and programming go so intrinsically hand-in-hand. Back in my time undergrad, I
    would constantly see people confused about why something worked in one way or
    another, or why a program didn’t work even though they were so sure their logic
    was sound.


    When I would go to review their logic, though, their program would be wrong in
    some glaring way, at least from a logical standpoint. Because of this, I’ve really
    come around to the opinion that logic and the underlying concepts behind programming
    are some of the most important things that you can grasp.


    Let’s start our discussion of arrays with a simple question. What would you do
    if you needed to connect several variables together in some way? As in, what if
    you needed to access a bunch of variables from the same location?


    The simple answer is that you couldn’t, at least not with what you know now. This
    is an issue, and allow me to show you how you.


    If you had to start take inventory of a bunch of items in your program, then you
    may yourself doing something like this:


    ```

    int item1 = 3;

    int item2 = 2;

    int item3 = 6;

    ```'
