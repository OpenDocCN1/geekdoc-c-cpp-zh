  md: '# Chapter 2 Data Structures, Handling and Functions


    # Introduction and Significance of Data Structures


    In this chapter we are going to learn about the definition of data structures
    and their significance in the C# programming language. We will learn on the importance
    of the data structures and when and how to use them during the programming sessions.
    It is equally important to know that a great programmer writes efficient and effective
    programs using very appropriate data structures.


    Programming is made up of two major components. These are algorithms and data
    structures. This explains the reason why more attention is given to these two
    components. A good developer or software engineer is that has vast skills and
    knowledge of data structures and efficient in programming.


    Before we get deeper into the data structure there are few terms that we should
    know and understand in to become a good developer. Algorithm complexity-this can
    be defined as a standard which examines the order of the operations count that
    is performed and evaluated by an algorithm which becomes a function of input data
    size. This standard is commonly represented by O (f) notation which is referred
    to as “Big O notation or asymptotic notation”. There are many types of complexities
    such as constant, logarithmic, exponential, linear, cubic and quadratic.


    # Enumerations, Arrays and structs


    # Enumerations


    This can be defined as a data type that specifies the number of items by equally
    assigning them to an identifier for example a name. This is made possible by the
