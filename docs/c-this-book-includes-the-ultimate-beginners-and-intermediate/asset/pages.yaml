  md: '# Linked lists


    These can either be singly or doubly linked lists. The major function done by
    both the singly and doubly linked list is the storage of collection of components
    by maintaining their order. They are represented in the memory as dynamic and
    pointer-based.


    *Addition* into the linked list is a very fast process. Although it is slower
    than dynamic arrays, it is an advanced process. This is achieved by a new allocation
    of memory space. It is a high-speed process that is always unpredictable. *Searching*
    is a very slow process because it uses the same principle as dynamic arrays to
    traverse all the elements during the search. *Deletion* of an element is a slow
    operation. This is because searching is done before deletion hence the indexing
    process makes it generally slow.


    In summary, a linked list has a fast addition process. It is suitable for situations
    when addition and removal are needed at a faster rate at both sides of the linked
    lists.


    # Stack


    This is a linear data structure that has three major steps; addition of components
    to the top of the specific stack(push), removing components from the top of the
    specific stack(pop) and inspection of the components at the top of the stack without
    interfering with the order(peek).


    The *addition* and *deletion* of the stack is a very fast process because a constant
    time is used. The stack does not have the searching and accessing by index features.
    It generally works with the LIFO technique where the Last In is the First Out.


    Stack is used in situations where LIFO (Last In First Out) is applicable.


    # Queue


    This is also another type of linear data structures that is specific to two operations:
    addition of a component to the tail (enqueue) and extraction of the component
    from the head (dequeue). The two processes are fast because it utilizes a constant
    timing. The operations here are similar to the processes in addition and deletion
    of linked'
