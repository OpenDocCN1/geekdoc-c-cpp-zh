  md: '# Chapter 11 Command Line Arguments


    In C programming, it is perfectly possible to accept and to have command line
    arguments. These arguments are typically provided after the program name in the
    operating systems of the command line. Some of these operating systems include
    Linux and DOS. Command line arguments are then passed on to the created program
    from your operating system.


    To utilize these command line arguments in the created program, you need to completely
    understand the entire declaration for the main function first. This main function
    should previously have no arguments to begin with.


    Interestingly, the main function can simultaneously accept two types of arguments.
    The first one would be the number of the command line arguments. The second one
    would be the entire list of every command line argument included in the program.


    The main argument''s full declaration somehow appears like this:


    ```

    int main (int argc, char *argv[])

    ```


    For this code, argc is considered as the argument count. The argument count is
    the given number of command line arguments passed on to the created program. The
    command line is the origin for this argument. The line argument includes the program''s
    name as well.


    The array of the pointers for the character is regarded as the listing of every
    argument. On the other hand, argv[0] will be the program''s name. For the declaration
    above, it is an empty string in case the name is not yet available. After this,
    every number of the element in the declaration that is less than the argc string
    will be considered as one of the command line arguments.


    You may handle the command line arguments using main() as your function argument.
    If you combine it with other commands, argv[] will be considered as the number
    of passed arguments. On the other hand, argv[] will be the pointed array. This
    means that argv[] will point the each of the passed argument to the created program.


    You may use each of the argv elements in the same way that you will use a string.'
