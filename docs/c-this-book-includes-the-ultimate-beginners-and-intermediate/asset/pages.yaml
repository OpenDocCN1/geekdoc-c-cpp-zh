  pgno: 21
- img_proc: true
  md: '```

    int item4 = 5;

    ```


    As you can see, this would get unruly after a while. This is not even to mention
    the fact that you''re creating so many extraneous variables that you really don''t
    need. What could you do instead of creating all of these variables?


    The ideal solution would be if you had one singular variable called *item*, from
    which you could access all of these values stored in it. Well, fortunate for you,
    you can do exactly that.


    The concept of storing a bunch of variables together is known as an *array*, and
    they are a central concept to computer programming. Let me explain how they work.


    Remember how we talked about how computers store values in what are essentially
    little boxes in the computer''s memory that you can reference through the use
    of a variable (or by directly referring to the given location in memory, but that''s
    for a more advanced language than this one?) Arrays allow you to set a bunch of
    boxes aside and declare them all to contain related data. So what does this mean?


    Well, for one, it tells the computer that this specific location in memory is
    related, meaning that when you want to move through this data, it actually goes
    faster since the computer doesn''t have to randomly pull information from different
    places in memory. Understand that computers don''t store values in a rational
    way, especially not in RAM, and when you''re trying to pull information from RAM
    there''s always a pretty decent chance that the computer will have the values
    scattered all over the place. When all of the boxes are there together and the
    computer knows they''re related, it''s easier for the computer to move from box
    to box efficiently.


    However, on top of this, what this essentially means is to the computer, these
    things are related. That is, all of these boxes connect in one way or another.
    You''ve already told the computer how big of something is going to be in these
    boxes, how many boxes it needs to set aside, and a variety of other information.


    Arrays then offer the optimal way to store related information. For the record,
    it doesn''t have *specifically* to do with control flow but it is an extremely
    important'
  merge: -1
