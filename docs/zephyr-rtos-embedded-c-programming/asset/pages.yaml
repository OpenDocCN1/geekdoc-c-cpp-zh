  md: 'Architectures that implement Zephyr system calls must implement seven inline
    functions, _arch_syscall_invoke() through to _arch_syscall_invoke6(), which marshal
    arguments into designated CPU registers and perform the necessary privilege elevation
    and which are a key part of the system call implementation code. The parameters
    of an API inline function, before being passed as arguments to system call, are
    cast to a uintptr_t type, which matches the size of a register. However, when
    passing 64-bit parameters on a 32-bit system, the 64-bit parameter is split into
    lower and higher parts and passed as two consecutive 32-bit arguments.


