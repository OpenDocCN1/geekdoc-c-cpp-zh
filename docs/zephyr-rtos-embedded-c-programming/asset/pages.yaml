    # Counting Semaphore


    A counting semaphore can be acquired or released multiple times. It does this
    via a counter. If the count value is 0, the counting semaphore is in the unavailable
    state. If the count is greater than 1, then the semaphore is available. When a
    counting semaphore is created, its initial count can be specified. In some operating
    systems, the maximum count value can also be specified – that is, the counting
    semaphore is a bounded semaphore (the count is bounded). In other operating systems,
    the count may be unbounded. Acquiring a counting semaphore reduces the counter
    value by 1, and releasing the counting semaphore increases the counter value by
    1.


    The behavior of a counting semaphore is described by the FSM shown in Figure 2-6.'
