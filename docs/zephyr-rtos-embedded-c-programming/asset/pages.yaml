    AND I2C IN PARTICULAR


    Multiple SPI devices can be attached to an SPI bus; however, any point in time,
    only two devices can be involved in the movement of data. In the case of SPI,
    one device is the master, and it controls the clock signal. The other device is
    a slave, and it can only send data when permitted to do so by the master. In order
    to select one of several attached slave devices, each device has a "slave select"
    (SS) pin, and a "select" line goes from a pin on the master device to the "select"
    pin on the slave device. Hence, a master can control multiple slaves. However,
    the addition of an extra slave consumes an extra pin on the microcontroller.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_455_0.png)


    Figure 9-1. Simple SPI network schematic'
