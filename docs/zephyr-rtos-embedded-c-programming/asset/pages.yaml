    # ARM Cortex M Memory Protection Unit (MPU): An Overview


    A Memory Protection Unit provides a subset of the functionality that can be provided
    by a Memory Management Unit (MMU) Difference between MMU and MPU. Both an MMU
    and an MPU are hardware components involved in memory management and protection.


    The main difference between an MMU and an MPU is that an MMU provides virtual
    memory support while an MPU only provides physical memory protection. An MMU is
    used in the implementation of virtual memory systems that work by splitting physical
    memory into small (say 4 Kbytes) sized pages and mapping these pages into the
    virtual address space of a task running on an operating system like Linux. Virtual
    memory makes it possible for an operating system to create an illusion that a
    process has a large address space at its disposal and also prevents a process
    from corrupting the “virtual” memory of another process. An MPU is much more limited
    in that it only provides a way to specify which areas of memory can be accessed
    by a given process/thread,'
