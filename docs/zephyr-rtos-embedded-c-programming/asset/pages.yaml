- img_proc: true
  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    The implementation of FAT that is used in many embedded system applications is
    the one implemented by ChaN, and this is the implementation used in Zephyr RTOS.


    FatFs is implemented in ANSI C so as make it easy to port to a variety of processor
    architectures. The FatFs code is also designed to be thread safe as to make it
    suitable for use in embedded operating systems-based applications. FatFs is not
    dependent on any particular operating system platform or storage medium and defines
    a media interface for communication with storage device control modules.


    The implementation of the interface for a given device module is implementation
    dependent. This approach, in which the user application abstractions and the platform
    code are separated and the low-level disk I/O layer (driver) must be implemented
    separately, means that an application system can have several storage devices,
    each with their own specific driver. An application needs to ensure that when
    it is built, the correct libraries and drivers are installed, but from the point
    of view of the application developer, it is a standard API that is used, and the
    details of the underlying physical media are hidden.


    A minimum driver layer implementation must provide support for the disk_status,
    disk_initialize, and disk_read interfaces.


    disk_status returns the block device status information, disk_initialize initializes
    the physical device, and disk_read reads blocks of data from the physical device.


    A fuller driver layer implementation will also provide support for disk_write(),
    which writes sector(s) to the disk; disk_ioctl(), which controls device-specified
    features, and get_fattime(), which returns the current time.'
