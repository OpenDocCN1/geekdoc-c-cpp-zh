    involves the use of the ## concatenation operator, whose purpose, here, to generate
    global variables with unique names, where the uniqueness comes, in effect, from
    information in the devicetree.


    in the driver, so that the global variable token contains the ordinal number 63.


    The ordinal number is the result of enumerating the nodes in the devicetree. Each
    node will have a distinct ordinal number associated with it, and this ensures
    devices will be associated with uniquely named global variables.


