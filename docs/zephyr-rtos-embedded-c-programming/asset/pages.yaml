  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    Data is written to a file with fs_write():


    ```

    ssize_t fs_write(struct fs_file_t *zfp, const void *ptr, size_t size)

    ```


    The return value is the number of bytes actually written. If a negative value
    is returned from the function, the file pointer has not been advanced, and if
    the function returns a non-negative number that is lower than size (the number
    of bytes to be written), then the global errno variable should be checked for
    an error code, the device may not have sufficient free space for storing all of
    the data to be written.


    Conceptually, a file can be thought of as a large array of bytes, and when traversing
    a file, a (conceptual) cursor tracks the current position in the file. The fs_seek()
    function is used to move the cursor to a new file location.


    ```

    int fs_seek(struct fs_file_t *zfp, off_t offset, int whence)

    ```


    The offset is added to file position based on the whence parameter, which can
    be one of FS_SEEK_SET for the beginning of the file, FS_SEEK_CUR for the current
    position, and FS_SEEK_END for the end of the file. fs_tell() is used to retrieve
    the current file position, off_t fs_tell(struct fs_file_t *zfp).


    There is also an fs_truncate() function that can be used to truncate or extend
    an open file to some given size.


    ```

    int fs_truncate(struct fs_file_t *zfp, off_t length)

    ```


    The fs_sync() function can be used to flushed write buffers buffers an open file.


    ```

    int fs_sync(struct fs_file_t *zfp)

    ```


    A typical use case is to make sure that data gets written to the storage media
    immediately, for example, to avoid data loss should the power be removed unexpectedly.'
