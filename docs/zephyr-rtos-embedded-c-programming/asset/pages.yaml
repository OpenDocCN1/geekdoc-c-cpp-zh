    A Zephyr Mailbox object is created by defining a variable of the correct type
    and initializing it. A mailbox variable is of type k_mbox, and the initialization
    method is k_mbox_init() and the basic code pattern for defining and initializing
    an empty mailbox


    ```

    struct k_mbox some_mbox;

    k_mbox_init(&some_mbox);

    ```


    Zephyr provides the K_MBOX_DEFINE macro for defining and initializing a mailbox
    at compile time, and the following code snippet will have the same effect as the
    two-line code in the previous snippet:


    ```

    K_MBOX_DEFINE(some_mbox);

    ```


    # Message Descriptors


    Message descriptors are instances of a structure of type k_mbox_msg. This structure
    contains fields that can be used in applications as well as other fields that
    are only for internal mailbox use. The fields for application use are info, size,
    tx_data, tx_target_thread, and rx_source_thread:


    +   - info is an application-defined 32-bit value that can be exchanged between
    a sender and a receiver. This exchange can occur in both directions. A sender
    can pass a value to the receiver during message exchange. A receiver can pass
    a value to the sender in a synchronous message exchange. Recall that in a synchronous
    exchange, the sending thread blocks until the message has been fully processed
    by the receiving thread, whereas in an asynchronous exchange, the sending thread
    does not wait until the message has received by another thread before continuing.'
