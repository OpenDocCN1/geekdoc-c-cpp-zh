  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    interface (which will serve as an introduction to techniques involved in implementing
    device drivers for real physical devices), the use of memory partitions, working
    with message queues and queues, heap creation and memory management, and, additionally,
    making use of supervisor threads.


    Another objective of this section is to provide insights into the work involved
    in developing more complex real-world applications. Do not, on a first reading/studying
    of the code, try to fully understand all the details, but rather try and get a
    feel for the problems addressed, as restricting access to kernel resources by
    user threads, sandboxing of untrusted data processing, and dropping a thread from
    privileged mode to user mode. You should try to build and run this example on
    various boards and in Renode and QEMU.


    The example also involves the use of the processor MPU (Memory Protection Unit).
    In connection with working with a processor MPU, it should be noted that in systems
    without an embedded OS, the MPU can be programmed to have a static configuration,
    which can be used to provide functionality such as setting a RAM/SRAM region as
    read-only so that the data here is protected from accidental corruption, making
    a piece of the RAM/SRAM space at the bottom of the stack inaccessible so to be
    able to detect stack overflow, and setting a region of RAM/SRAM to be XN (execution
    no) so to mitigate code injection attacks.


    In systems with an embedded OS, the MPU can be programmed at each context switch,
    which makes it possible for an application task to have its own task-specific
    MPU configuration. Using this approach, it is possible to define memory access
    permissions in such a way that application stack operations in one thread are
    not able to access the stack of another application in the event of a stack leak,
    and also to constrain task memory access to the data and peripherals that the
    task should be permitted to access.


    The producer-consumer example also includes a, fairly trivial, system call example
    involving a "magic cookie," included in the example, to demonstrate a template
    to follow for the creation and invocation of system calls.'
