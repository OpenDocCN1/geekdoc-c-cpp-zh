    # Claiming and Finishing a Channel


    The user_data pointer in the zbus_chan structure can be used to associate metadata
    (extra information) with a ZBus channel. Working with this metadata in a multithreading
    context requires the ability to access this data safely. To this end, the API
    functions zbus_chan_claim() and zbus_chan_finish() have been provided. Once a
    channel has been claimed, the actions associated with that channel will not be
    available. For the actions to become again, the finish operation needs to be performed
    on that channel.


