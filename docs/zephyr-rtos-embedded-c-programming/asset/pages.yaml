    # Overview of SPI and I2C


    The examples studied in this chapter will involve I2C and SPI sensors and peripherals.
    The number of available I2C and SPI devices is large and includes devices such
    as accelerometer sensors, gas sensors, SPI EEPROM, SPI flash, SPI Ethernet controllers,
    and SPO CAN bus controllers.


    I2C is a serial bus that consumes a small number of the pins of a microcontroller
    and to which multiple devices can be attached. SPI consumes a relatively small
    number of pins when only a few SPI devices are attached. However, because each
    SPI device requires a chip select line, the more devices that are attached to
    an SPI, the greater the number of pins that will be required. For instance, five
    SPI devices would require five chip selects together with the three pins for the
    bus itself, eight pins will be required in total.


    The basic, general, plan of action when deciding to use SPI or I2C devices in
    a project, typically involves coming up with answers to questions such as which
    pins are available for I2C or SPI use and whether these pins are fixed or configurable.
    There is the issue of whether the use of an I2C or SPI peripheral is appropriate,
    and for a given functionality, whether an I2C or SPI device variant should be
    used. Where power consumption is important, the power consumption characteristics
    of the various possible devices that are being considered also need to be taken
    into account.'
