    The build system ensures that the base address of my_partition will be properly
    aligned, and the total size of the region will conform to the requirements of
    the memory management hardware requirements, including adding padding if necessary.


    For creating multiple partitions, Zephyr provides a variadic preprocessor macro,
    the definition of which can be found in app_macro_support.


    FOR_EACH(K_APPMEM_PARTITION_DEFINE, part0, part1, part2);


    Zephyr RTOS automatically creates partitions for Static Library Globals and provides
    a number of predefined partitions such as the z_malloc_partition, which contains
    the system-wide pool of memory used by libc malloc(), and z_libc_partition for
    globals required by the C library and runtime.


    A memory domain is defined using a variable of type k_mem_domain and must be initialized
    by calling k_mem_domain_init(), for example:


    The following code snippet shows how to define and initialize an empty memory
    domain:


    ```

    struct k_mem_domain app0_domain;

    k_mem_domain_init(&app0_domain, 0, NULL);

    ```


    Memory partitions can be added to a memory domain as part of the memory domain
    creation process, or they can be added into an initialized memory domain individually.


    This, next, code snippet demonstrates adding memory partitions when creating a
    memory domain:


    ```

    /* the start address of the MPU region needs to align with its size */

    uint8_t __aligned(32) app0_buf[32];

    uint8_t __aligned(32) app1_buf[32];

    K_MEM_PARTITION_DEFINE(app0_part0, app0_buf, sizeof(app0_buf), K_MEM_PARTITION_P_RW_U_RW);

    ```'
