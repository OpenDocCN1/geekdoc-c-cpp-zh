    # # Timing and Timers


    Timers are essential in embedded systems in general and operating systems in particular.


    Time-sensitive activities in an embedded system may be driven by hard timers that
    use physical timer circuitry that directly interrupts the processor when the timer
    expires, and soft timers in which timing events are generated by software. The
    number of hard timers is limited, but the number of soft timers that can be created
    is much greater. Soft timers are used where high timing precision (of the order
    of microseconds) is not required and a timing resolution within a couple of milliseconds
    is adequate.


    Zephyr, like most operating systems, has a System Clock that tracks the time that
    has elapsed since system power-up. The initial value can be retrieved from a real-time
    clock if there is one in the application hardware. The System Clock is driven
    by a programmable interval timer. The timer initialization is performed as part
    of the startup process.


    An RTOS timer API should include methods for creating and initializing a timer,
    a function pointer to a function to execute when the timer expires, methods for
    starting and stopping a timer, as well as'
