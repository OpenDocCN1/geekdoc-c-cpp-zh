    The Actions View, to be found under the Devicetree View, provides access to common
    actions associated with building, configuring, debugging, flashing, and seeing
    the memory report.


    When working with the Zephyr SDK as opposed to the nRF Connect SDK, similar functionality
    can be obtained using the PlatformIO IDE for VS Code: https://docs.platformio.org/en/stable/integration/ide/vscode.html#ide-vscode.


    # # Exercise: Building and Running a Zephyr Sample Application Using VS Code


    The aim of this exercise is to build and run the blinky sample on a board such
    as the nRF52840 DK board. The sequence of steps to follow is given here.


    Start by clicking on the Create new application option, and enter the requisite
    information in the fields in the New Application View that is displayed.


    The application details are that it should be a Freestanding application (linked
    to and using an installed version of the nRF Connect SDK) and that the nRF Connect
    Toolchain version corresponds to the version of the SDK installed. The directory
    for storing the application folder needs to be specified as well as a template
    on which the application is to be based. In this case, the template is to be based
    on the blinky sample, which path, relative to the directory in which the nRF Connect
    SDK is installed will be


    zephyr\samples\basic\blinky'
