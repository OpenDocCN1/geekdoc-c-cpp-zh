  md: "# Attribute Operations\n\nThere are six attribute operations. They are Commands,\
    \ Requests, Notifications, Responses, Indications, and Confirmations.\n\n+   *\
    \ Commands are sent by the client to the server and do not require a response.\n\
    * Requests are sent by the client to the server and do require a response.\n \
    \   * There are two types of request: a Find Information Request and a Read Request.\n\
    * Responses are sent by the server in response to a request.\n* Notifications\
    \ that have been enabled for a characteristic of interest by a client are sent\
    \ by the server to the client to let the client know that the value of a specific\
    \ characteristic has changed.\n    * A notification does not require a response\
    \ from the client to acknowledge its receipt.\n* Indications are sent by the server\
    \ to the client; they are similar to notifications but require an acknowledgment\
    \ to be sent back from the client to inform the server that the indication was\
    \ successfully received.\n\nNotifications and indications are exposed via the\
    \ Client Characteristic Configuration Descriptor (CCCD) attribute. Writing a “1”\
    \ to this attribute value enables notifications, writing a “2” enables indications,\
    \ and writing “0” disables both notifications and indications.\n\nConfirmation\
    \ acknowledgment packets are packets sent by the client to the server to inform\
    \ it that the client successfully received an indication."
  merge: -1
  pgno: 335
