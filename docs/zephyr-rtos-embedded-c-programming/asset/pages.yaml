  md: '# CHAPTER 7


    # Developing Zephyr

    BLE Applications


    Zephyr RTOS is becoming increasingly important as an RTOS for developing IoT (Internet
    of Things) applications, not only smart sensors but also edge computing devices.
    In the IoT ecosystem, the importance of BLE (Bluetooth Low Energy) is as a short-distance
    radio communications link for, for example, connecting wearable sensors to mobile
    devices and for use in wireless connected computer peripherals such as BLE mice
    and BLE keyboards. BLE support and its APIs are, therefore, a very important part
    of the Zephyr framework.


    This chapter will start by covering BLE (Bluetooth Low Energy) concepts, terminology,
    and programming and will overview the differences between BLE 4 and the newer,
    BLE 5 standards. The next section will then go on to explore the Nordic Semiconductor
    BLE-capable SoC (System on Chip) and Nordic’s closed source BLE stack and how
    it is used with Zephyr RTOS, and also introduce Zephyr’s open source BLE stack,
    and explore a number of Zephyr RTOS-based BLE applications.'
  merge: -1
