  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVCETREE IN GENERAL AND SPI
    I2C IN PARTICULAR


    The Zephyr build system uses devicree sources and bindings to produce a “generated”
    C header. The contents of this generated header are abstracted by the devicree.h
    API, which contains a collection of macros that can be used to extract device-related
    information from the project’s devicree. This usage pattern is outlined in the
    schematic 9-3.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_460_0.png)


    Figure 9-3. Generating devicree.h


    Zephyr and application source code files can include and use devicree.h. In Zephyr
    projects, the devicree is used in conjunction with Kconfig. With Kconfig, overrides
    of default values taken from devicree are possible, and furthermore, devicree
    information can be referenced from Kconfig by the use of Kconfig functions.


    # Device Tree Source (DTS) Representation of Devicrees


    The following several sections are a “distillation” of the Zephyr devicree documentation
    and various Zephyr examples put together to provide a basic understanding of devicree
    syntax and how devicree files are processed when building Zephyr applications.


    Device Tree Source code provides a human-readable representation of a devicree.
    The complete syntax is to be found in the devicree specification [3]


    A devicree has its origin in a starting root node, below which is a collection
    of nodes that, in turn, have subnodes (child nodes) and so on. A node has named
    properties and property values. These are denoted as name-value pairs.'
