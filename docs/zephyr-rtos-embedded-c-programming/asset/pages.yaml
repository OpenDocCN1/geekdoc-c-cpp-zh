    # # Walkthrough of a VDED Execution Scenario


    The following example, from the Zephyr documentation, illustrates a basic VDED
    execution scenario. Implementing all the low-level code for even such a relatively
    simple scenario would involve a considerable amount of effort and code testing.
    It is worth noting that the Zephyr RTOS code undergoes quite rigorous testing
    before being published.


    Consider a scenario consisting of four threads in ascending priority, S1, MS2,
    MS1, and T1 (the highest priority); two listeners, L1 and L2; and a single channel,
    A. In this scenario, L1, L2, MS1, MS2, and S1 observe channel A. The priority
    ordering is T1 > MS1 > MS2 > S1, with T1 having the highest priority.


    Figure 11-4 shows the aforementioned state of affairs.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_562_0.png)


    **Figure 11-4.** Example virtual distributed event dispatcher (VDED) scenario'
