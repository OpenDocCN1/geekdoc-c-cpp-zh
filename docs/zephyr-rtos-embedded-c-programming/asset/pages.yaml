  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVETREE IN GENERAL AND SPI
    AND I2C IN PARTICULAR


    Statements such as the following will result in compiler errors:


    ```

    void *i2c_0 = DT_INST(0, vnd_soc_i2c);

    unsigned int i2c_1 = DT_INST(1, vnd_soc_i2c);

    long my_i2c = DT_NODELABEL(i2c1);

    ```


    Given the variables


    ```

    void *i2c_0;

    unsigned int i2c_1;

    long my_i22;

    ```


    the Zephyr way to initialize these variables is to use C macros, for example:


    ```

    #define MV_I2C DT_NODELABEL(i2c1)

    #define INST(i) DT_INST(1, vnd_soc_i2c)

    #define I2C_0 INST(0)

    #define I2C_1 INST(1)

    ```


    The DT_NODE_HAS_PROP macro can be used to check whether a node has a particular
    property or not. For example, in the case of the example devicree shown earlier:


    ```

    DT_NODE_HAS_PROP(DT_NODELABEL(i2c1), clock_frequency)

    /*expands to 1 */

    DT_NODE_HAS_PROP(DT_NODELABEL(i2c1), not_a_property) /*/

    expands to 0 */

    ```


    The DT_PROP(node_id, property) macro can be used to read basic integer, boolean,
    string, numeric array, and array properties. For example, the clock-frequency
    property value in the preceding example can be read in several different ways:


    ```

    DT_PROP(DT_PATH(soc, i2c_40020000), clock_frequency)

    DT_PROP(DT_NODELABEL(i2c1), clock_frequency)

    DT_PROP(DT_ALIAS(sensor_controller), clock_frequency)

    ```'
