  md: '# CHAPTER 10 BUILDING ZEPHYR RTOS APPLICATIONS USING RENODE


    +   - It supports a variety of network protocols.


    +   - It has built-in emulation for commonly used processor architectures such
    as ARM, RISC-V, PowerPC, and x86.


    +   - It is a good environment for exploring Zephyr RTOS programming in a hardware-agnostic
    environment.


    +   - Renode can use the same firmware as used in production and run it against
    emulated cores, peripherals, and even sensors and actuators.


    +   - Because of its extensive networking support and multisystem emulation capabilities,
    it is well suited for testing systems made up of multiple communicating devices.


    +   - It makes it possible to start development before the hardware is ready,
    to test the firmware on multiple target architectures.


    +   - Makes for faster iteration cycles because it avoids the flash loading delays
    inherent when loading compiled code to actual targets.


    +   - Because Renode is built using the Mono/C# framework, it can run on multiple
    workstation operating systems without modification.


    +   - It is focused on embedded devices, unlike QEMU, which is more focused on
    emulating systems designed for use with higher-level OSes (e.g., Linux computers).


    +   - However, Zephyr applications can be run on systems emulated using QEMU.'
  merge: -1
