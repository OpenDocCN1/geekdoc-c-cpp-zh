    using the ZBus in Zephyr RTOS applications. In the documentation, the description
    of these examples involves running the code in the QEMU emulator. They can also
    be run using Renode and on target boards.


    In this section, the Zephyr repository ZBus examples explored were run on the
    nRF52840 DK board.


    The final section explores a prototype controller application involving a sensor,
    an actuator, and a Wi-Fi network controller. It uses the nRF70002 DK and shows
    how some of the examples in the Zephyr Wi-Fi chapter might be extended or refactored
    to make use of the ZBus framework.'
