    # Introduction to the Zephyr RTOS Device Driver Model and the Zephyr RTOS Device
    Driver APIs and Data Structures


    The kinds of Zephyr applications commonly built to gain familiarity with building
    multitasking Zephyr RTOS applications typically involve things such as flashing
    or more LEDs, detecting button presses, and sending messages to a PC terminal
    over a serial (UART) port. Because Zephyr runs on hardware platforms that do not
    have an MMU (Memory Management Unit) and hence do not support virtual memory,
    the Zephyr driver model is not the same as the device driver models found in Linux,'
