  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    Essentially, the life cycle of a thread involves the following thread life cycle
    events: Thread Creation, Thread Termination, Thread Aborting, and Thread Suspension.


    A thread must be created and initialized before it can be used. Each thread has
    its own stack buffer for which memory has to be allocated before the thread is
    created. The memory allocated may also have a part that is reserved for memory
    management structures. For example, if guard-based stack overflow detection is
    enabled, a small write-protected memory region will be present, immediately preceding
    the stack buffer whose purpose is to catch overflows. If userspace is enabled,
    a separate fixed-size privilege elevation stack must be reserved to serve as a
    private kernel stack for handling system calls. Also, if userspace is enabled,
    the thread''s stack buffer must be appropriately sized and aligned in such a way
    that a memory protection region may be programmed to exactly fit. The alignment
    constraints may be architecture dependent. For example, some MPUs require their
    regions to be of some power of two in size and aligned to the MPU size. The consequence
    is that portable code cannot simply map any arbitrary buffer to the thread create
    function, k_thread_create(). Zephyr provides macros to instantiate (define) stacks,
    K_KERNEL_STACK_DEFINE for a kernel privilege-level stack and K_THREAD_STACK_DEFINE
    for a userspace thread. When a thread is created, the kernel initializes the thread
    control block and one end of the stack memory. The remainder of the stack is typically
    left uninitialized. K_THREAD_STACK_SIZEOF() gives the size for a stack object
    defined using K_THREAD_STACK, and K_KERNEL_STACK_SIZEOF() gives the size of a
    stack object defined using K_KERNEL_STACK.


    The start delay can be specified. The parameter K_NO_WAIT if the thread is start
    execution immediately, or K_FOREVER if the thread is start suspended and has to
    be started explicitly. A delayed start can be cancelled before the thread begins
    executing by issuing a cancellation request; however, a thread whose delayed start
    was successfully cancelled must be explicitly re-spawned before it can be used.


