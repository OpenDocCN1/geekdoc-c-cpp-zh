    # Zephyr Logging Module


    Additional features of the logging module include runtime filtering of messages,
    timestamping of messages, and a data dumping API. Zephyr RTOS logging borrows
    ideas from Linux kernel logging and syslog. Filtering is based on log message
    severity levels. The severity levels are summarized in Table 3-3.


    Table 3-3. Log message severity levels


    | 1 (most severe) | Error | Severe error conditions | LOG_LEVEL_ERR |

    | 2 | Warning | Conditions that should be taken care of | LOG_LEVEL_WRN |

    | 3 | Info | Informational messages that require no action | LOG_LEVEL_INF |

    | 4 (least severe) | Debug | Debugging messages | LOG_LEVEL_DBG |'
