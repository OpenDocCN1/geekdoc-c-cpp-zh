  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND SPI

    2C IN PARTICULAR


    The setup for a simple SPI network involving a master and three slaves in a multiprop
    configuration is shown in Figure 9-1 [1].


    +   - MOSI (Master Output/Slave Input) – The line used by the master to send data
    to the slave


    +   - MISO (Master Input/Slave Output) – The line used by the slave to send data
    to the master


    +   - SCLK (Clock) – The line for the clock signal


    +   - SS/CS (Slave Select/Chip Select) – The line used by the master to select
    the slave device it will be sending data to


    SPI is a “full duplex” protocol because data can be sent from master to slave
    and slave concurrently. The data is sent on two separate lines, namely the MOSI
    and MISO lines.


    The maximum speed for SPI is 10 Mbps; however, in practice, lower speeds are used.
    The maximum number of slaves is theoretically unlimited; however, in practice,
    only a few slaves are attached to a microcontroller at a time in real-world applications.


    Data transmission requires that the bus master configures the SPI clock to a frequency
    that the slave device supports, typically up to several MHz. Transmission itself
    involves the master selecting a slave device by asserting a logic level of 0 on
    the chosen line. After a suitable delay, if required, where the device needs to
    complete an analog-to-digital conversion, the master starts the transmission by
    beginning to issue cycles. On every SPI clock cycle, a full duplex data transmission
    takes place. The master sends a bit on the MOSI line and the slave sends a bit
    on the MISO line, which the master reads. This sequence is used even when only
    one-directional data transfer is being performed.'
