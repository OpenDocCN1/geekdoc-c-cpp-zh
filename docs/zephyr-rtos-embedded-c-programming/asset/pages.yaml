  md: '# GATT Attribute and Data Hierarchy


    GATT organizes attributes in a hierarchical way. Attributes are organized as a
    GATT Server Profile and are grouped into Services, containing Characteristics,
    containing the Attributes Declaration, Value, and Descriptor. The Descriptor is
    optional.


    A GATT service is made up of one or more include services and more characteristics.
    A characteristic will have a number of properties, a value, and zero or more characteristic
    descriptors. An include service allows a service to refer to other services for
    the purpose, for example, of extending the included service.


    A Primary Service represents primary functionality of a device, and a Secondary
    Service provides auxiliary functionality of the device and is referenced (included)
    by at least one other primary service on the device.


    # Characteristics


    A characteristic is an essential part of a service and represents a piece of information/data
    that the server wants to provide to a client. For example, the battery level characteristic
    represents the remaining power level of a battery in a device, and this information
    can be read by a client. A characteristic is made up of Properties and Descriptors,
    attributes that are part of the definition of the value held by the characteristic.
    Properties are represented by bits that define how a characteristic value can
    be used, for example, read, write, write without response, notify, and indicate.
    Descriptors contain information related to the characteristic value and include
    information such as extended properties, a user description, fields used for subscribing
    to notifications and indications, and also a field defining the presentation of
    the value such as, for example, the format and the units of the value.'
  merge: -1
  pgno: 332
