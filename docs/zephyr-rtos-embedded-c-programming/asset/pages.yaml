    Here, FS_FATFS is the file system type such as FatFs or LittleFS; for example,
    FATFS_MNTPC is the mount point at which the file system will be mounted, and fat_fs
    is the file system data that is used by the fs_mount() API.


    The Zephyr file system API is very similar to the standard POSIX file system API.
    The handle to access a given filesystem is a pointer to a data structure struct
    fs_file_t, and it is initialized, prior to first use, with fs_file_t_init().


    ```

    static inline void fs_file_t_init(struct fs_file_t *zfp)

    ```


    For directories, a struct fs_dir_t variable is initialized with fs_dir_t_init()
    prior to calling fs_opendir().


    ```

    static inline void fs_dir_t_init(struct fs_dir_t *zdp)

    ```


    A file is referred to via a struct fs_file_t instance and is opened/created with
    fs_open() and associated with a data stream.


    ```

    int fs_open(struct fs_file_t *zfp, const char *file_name, fs_mode_t flags)

    ```


    The flags can be 0 or a binary combination of one or more of FS_O_READ open for
    read, FS_O_WRITE open for write, FS_O_RDWR open for read/write (FS_O_READ | FS_O_WRITE),
    FS_O_CREATE to create a file if it does not exist, and FS_O_APPEND to move to
    the end of the file before each write. If flags are set to 0, the function will
    attempt to open an existing file with no read/write access; this may be used to,
    for example, check if the file exists.'
