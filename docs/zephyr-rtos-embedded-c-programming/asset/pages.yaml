- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    Management frames packets are used to discover APs (access points) and to join
    a BSS (Basic Service Set). They include frames such as Beacon, Probe Request and
    Response, Authentication and Deauthentication, Association, and Disassociation
    frames.


    Control frame packets are used to acknowledge successful transmission and reserve
    the wireless medium. Control frame packets are used for the delivery of management
    and data information. Common control frame subtypes are ACK, request-to-send,
    and clear-to-send.


    Data frame packets contain actual data and are the only packets that will be forwarded
    from the wireless network to the wired network. Data frame types include Data
    and null function packets.


    The Wi-Fi layer header is more complex than the corresponding wired Ethernet layer
    header. It provides information such as channel, data rate, and signal strength.


    +   - Channel (frequency) is necessary because a wireless LAN may support anywhere
    from 3 to 25 different channels.

    - Data rate information about the data rates that are being used.

    - Signal strength – Indicates the power level in dBm. It is a measure of the expected
    quality of the signal.


    # Access Points


    An access point can be thought of as a bridge that bridges traffic between a client
    (mobile station) and other devices on an accessible network. Before a mobile station
    can send traffic through an AP, it must set up an association that puts it into
    an appropriate connection state [4].'
