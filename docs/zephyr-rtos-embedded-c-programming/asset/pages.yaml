  md: '# Multitasking and Interprocess Communication and Synchronization Concepts
    and Patterns


    # Tasks


    Formally a task (thread) is an independent thread of execution that has to compete
    with other threads for processor execution time. Concurrency in a single processor
    system is really an illusion that is illustrated in Figure 2-3.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_45_0.png)


    Figure 2-3. Context switching and the illusion of concurrency


    The illusion of concurrency is realized because context switching between one
    thread and another is fast. However, it is not free because of the context-switching
    overhead of storing and restoring execution state when switching between one thread
    and another.


    The actual multitasking context-switching schedule depends on the type of scheduling
    algorithm (strategy) used. Zephyr RTOS can be configured using various scheduling
    strategies such as the following:


    +   - Thread priority-based preemptive multitasking where a running lower priority
    thread can be preempted by a higher priority thread when the conditions needed
    for that thread to run have been met

    - Cooperative multitasking where threads decide to pause so that other threads
    have a chance to run'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# CHAPTER 2 A REVIEW OF RTOS FUNDAMENTALS


    +   - Round-robin scheduling where threads are given a slice of time in which
    to run in sequence


    +   - And other variations


    When a thread is created, it is given a distinct set of parameters and, also supporting
    data structures such as


    +   - Name


    +   - Unique ID


    +   - Priority (if associated with a preemptive scheduler)


    +   - A task control block for holding state information


    +   - A stack


    +   - A task routine


    Typically, when a real-time kernel starts, it will create some system tasks as
    well as user tasks that are associated with appropriate priorities and privileges.
    The finer details will vary from RTOS to RTOS.


    The kinds of system tasks provided by the kernel can include tasks for handling
    kernel startup, an idle task that uses up CPU cycles when there is no work to
    do, a logging task that logs system message to some logging system, an exception-handling
    task that runs when exceptions are detected, and, when debugging code, a debug
    agent task. In systems that must minimize energy consumption, the idle task may
    also be responsible for putting the system into a low power mode/sleep mode.


    Tasks in a multitasking system may be in one of a number of defined states. A
    basic enumeration of states envisages a task as either in a ready-to-run state,
    a waiting or blocked state in which the task is waiting for a resource to become
    available, or an event to occur, or a task sleep interval to expire, or in an
    actually running state. An RTOS may also be able to suspend or terminate a task.'
