  md: '# CHAPTER 5


    # Message Queues,

    Pipes, Mailboxes,

    and Workqueues


    Message queues, mailboxes, and pipes provide both synchronization between a producer
    and a consumer (sender and receiver) as well as temporary storage of data where
    necessary. Workqueues represent requests for work to be done.


    Underlying these mechanisms are data structures, algorithms, and APIs (Application
    Programming Interfaces).


    In the case of a message queue, the maximum size of a message and the maximum
    number of messages the circular buffer associated with the message queue can store
    are fixed when an instance of the message queue is created. A mailbox, on the
    other hand, allows threads to send and receive messages of any size and makes
    use of message descriptors, structures that contain a pointer to the message in
    question.


    Whereas message queues and mailboxes are concerned with whole messages, pipes
    are used for streaming data. Unlike POSIX pipes, Zephyr pipes are not associated
    with file descriptors.


    Figure 5-1 illustrates a common embedded system application scenario.'
