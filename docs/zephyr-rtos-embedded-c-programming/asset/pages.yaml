  md: '# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS


    ![](img/d625a3dc80e999570aa2c88dcc398b17_322_0.png)


    Figure 7-3. BLE RF channels, showing the Primary Advertising Channels (yellow)


    Advertising starts with advertisement packets being sent on all or some of the
    three Primary Advertising Channels. Devices scan for advertisers and read the
    data being advertised. Some advertisers support scan requests. Here, a scanner
    can initiate a scan request, and the advertiser can respond and send additional
    advertisement data to a device requesting this data.


    # BLE Link Layer


    The BLE link layer directly interfaces with the physical layer, and it is this
    layer that is responsible for advertising, scanning, and creating/ maintaining
    connections. Because driving a transceiver uses significant amounts of energy,
    transceivers are not turned on continuously. Rather, advertising and scanning
    activities occur at regular intervals. However, because Advertisers and Scanners
    are not synchronized, scanning and advertising activities must not overlap if
    discovery is to occur. This involves configuring suitable advertising intervals,
    for example, 20 ms, and on the scanner side, configuring scan intervals (e.g.,
    50 ms) and scan windows, for example, 25 ms, so that discovery may be made in
    a relatively timely manner, as illustrated in Figure 7-4 [2].


    309'
