  md: '# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND nZEPHYR APPLICATION
    BUILDING PRINCIPLES


    This chapter will cover the setting up of Zephyr RTOS application environments.
    Zephyr has been incorporated into the Nordic Semiconductor application development
    platform nRF Connect SDK [5]. The nRF Connect SDK includes the Zephyr framework
    as well as extra libraries and examples developed by Nordic Semiconductor for
    its families of processors. The nRF Connect SDK can be used to develop applications
    targeting other processors than nRF processors.


    Zephyr has an SDK called the Zephyr SDK [6] that has toolchains for the processor
    architectures supported by Zephyr and also includes host tools, such as a custom
    QEMU and OpenOCD.


    Zephyr RTOS application development can make use of IDEs for which there are suitable
    plug-ins. These include Eclipse and Microsoft VS Code. There are Zephyr SDK and
    nRF Connect plug-ins for VS Code, and VS Code is widely used by Zephyr application
    developers.


    It is also perfectly possible to follow ''old-school'' practices using text editors
    as vim and emacs to develop code and then using to build and flash applications.
    Here, setting up both VS Code and classical command-line development environments
    will be explored. In a later chapter, the setup of simulator/emulator-based development
    using QEMU and Renode will be introduced. For any given setup, a number of standard
    sample applications are typically built first in order to check the installation
    and setup. Exploring these basic examples will provide an introduction into the
    philosophy and mindset of the Zephyr RTOS application building process.


    The intricate details of tools such as CMake and Ninja, which are used in the
    Zephyr application build process, will be "glossed over" at this stage, and only
    the "necessary details" will be covered. CMake can be thought of as a kind of
    DSL (Domain-Specific Language) tool. It is implemented in C++ and embeds a lot
    of knowledge about C and C++ compilers, and its main purpose is to generate make
    files or Ninja files that can then be used to drive the build process using the
    make and ninja commands, respectively. Craig Scott’s Professional CMake: A Practical
    Guide, now in'
