  md: '# CHAPTER 7 DEVELOPING ZEPHYR APPLICATIONS


    contained in the advertising packets) may become an Initiator and initiate a connection
    with a specific advertiser. In the Connecting phase, the Initiator sends a CONNECT_REQ
    advertising packet to the Advertiser. If the Advertiser accepts the connection
    request, the connected phase is reached. In this phase, the Advertiser is the
    Slave, while the Initiator is the Master.


    The sequence of exchanges in the unicast scenario looks something like Figure
    7-5 [3].


    ![](img/d625a3dc80e999570aa2c88dcc398b17_324_0.png)


    **Figure 7-5.** BLE unicast scenario sequence diagram


    # BLE Broadcast Connect Scenario


    In the case of broadcast connections, the link layer roles do not change, and
    the defined roles are Broadcaster (the host sending the packets) and Observer.
    The messages are one-way, and the BLE standard defines the allowed types of advertising
    packets and their structure.'
