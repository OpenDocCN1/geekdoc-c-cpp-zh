    any data. When receiving a message, the size specifies the maximum amount of data
    wanted, or zero if the message data is not wanted. This field is updated by the
    mailbox to the actual number of data bytes exchanged when the message is received.


    +   * tx_data is a pointer to the message buffer used by the sending thread. When
    sending an empty message, it is set to NULL, and when receiving a message, this
    field is uninitialized.


    +   * tx_target_thread is the address (id) of the thread for which the message
    is destined. It is set to K_ANY if the intention is to allow any thread to receive
    the message. This value is not initialized when receiving a message as the mailbox
    will update this field with the address of the actual receiver that receives the
    message.


    +   * rx_source_thread is the address of the thread from which a message is wanted.
    It is set to K_ANY in the case where a message sent by any thread is acceptable.
    This field is not initialized when sending a message as the mailbox will update
    this field with the address of the actual sender when the message is put into
    the mailbox.'
