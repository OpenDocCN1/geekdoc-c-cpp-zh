  md: '# Exploring the nRF Connect SDK Wi-Fi

    Shell Example


    This example implements a UART CLI shell that has Wi-Fi commands

    can be used to test the nRF7002 chip. It provides not only basic

    TCP/IP commands also Wi-Fi subcommands as scan, connect,

    disconnect, status, and statistics, subcommands for configuring

    p saving modes and options and an add subcommand for adding a

    network to the credential storage with <SSID>, <Passphrase>, and other

    parameters. The example documentation at nrf/samples/wifi/shell/

    README.rst should be consulted for the full details.


    Once the application has been built and a connection with a terminal

    such as, for example, PuTTY on Windows or minterm on Linux has

    established, various shell commands can be run to, for example,

    ect to an access point router, check the DHCP IP address and DNS

    configuration of the nRF7002 DK Wi-Fi interface by the access point router,

    and then test connectivity by, for example, pinging another device on the

    local network and pinging a DNS server.


