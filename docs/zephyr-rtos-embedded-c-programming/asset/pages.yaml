- img_proc: true
  md: 'A callback can be registered with a call to the net_mgmt_add_event_callback()
    function and unregistered with a call to the net_mgmt_del_event_callback() function.
    The net_mgmt_init_event_callback() function can be used to initialize the corresponding
    struct net_mgmt_event_callback data structure correctly.


    When an event matches one in the event set associated with the callback, the callback
    function will be invoked with the actual event code. Because set filtering may
    pass through false positives to the callback function, it is the responsibility
    of the callback function to check that the event code (passed as an argument)
    corresponds to one of the specific network events it will handle.


    In order to receive events from multiple layers, multiple listeners to be registered,
    one for each layer being listened on. With this proviso, a callback handler function
    can be shared between different layer events.


    # # Defining Network Management Procedures


    Management procedures specific to a custom stack implementation can be provided
    by defining a handler and registering it with an associated mgmt_request code.


    Management request codes are defined in relevant places depending on the targeted
    layer or eventually, if L2 is the layer, on the technology also. For example,
    IP layer management request code is to be found in the include/zephyr/net/net_event.h
    header file. In the case of the L2 technology Ethernet, for example, these codes
    will be found in include/zephyr/net/ethernet.h.'
