    # Zephyr RTOS Workqueues


    A workqueue is, essentially, a thread and a collection of workqueue items. It
    is a kernel object that uses a dedicated thread to process work items in a first,
    in out manner. A workqueue contains a function pointer to the function that "does
    the work item work."


    Workqueues provide a mechanism by which an ISR or high-priority thread can pass
    less urgent processing to a thread of lower priority.


    A project can have multiple workqueues, with each workqueue being referenced by
    its memory address. The priority of the workqueue thread is configurable, which
    means that it is possible to have either cooperative or preemptive workqueue threads
    depending on the project requirements. Whatever priority a workqueue thread has,
    it will yield between each'
