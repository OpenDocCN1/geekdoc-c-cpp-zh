    If CONFIG_USERSPACE is defined, then in the application, the user threads run
    at a different privilege level to kernel threads then. Many of the processors
    on Zephyr RTOS applications are implemented have an MPU (Memory Protection Unit),
    and Zephyr provides various mechanisms for creating and managing memory partitions.


    The server application defines an app_partition and a struct k_mem_domain variable
    app_domain in the file echo-server.c.


    ```

    #if defined(CONFIG_USERSPACE)

    K_APPMEM_PARTITION_DEFINE(app_partition)

    struct k_mem_domain app_domain;

    #endif

    ```


    Automatic memory partitions such as app_partition are configured as read-write
    regions and are defined with K_APPMEM_PARTITION_DEFINE(). Global variables are
    and routed to this partition using K_APP_DMEM() for initialized data and K_APP_BMEM()
    for BSS.


    The way APP_BMEM and APP_DMEM are defined in common.h (in the snippet shown previously)
    means that if CONFIG_USERSPACE is not defined, they expand to nothing, but if
    it is defined, they expand to K_APP_BMEM and K_APP_DMEM, respectively.'
