    \ Pub an invalid value to a channel with validator successfully.\n\n# Zephyr Bus\
    \ Workqueue Example\n\nZBus operations cannot be used directly in an interrupt\
    \ service routine (ISR), an ISR must use some second-stage deferred processing\
