  md: '# BLE Actors – Peripherals, Broadcasters, Centrals, and Observers


    From the application development point of view, it is the implementation of the
    code that realizes the behavior of the BLE actors taking part that is the focus
    of interest.


    # BLE Peripheral


    A BLE peripheral device announces its presence by sending out advertising packets
    and can accept a connection from another BLE device (a BLE central), whereas a
    BLE broadcaster (Beacon) is a device that sends out advertising packets but does
    not allow a connection from a central device. Beacons are commonly used to provide
    indoor location services. Broadcasters and peripherals can be distinguished by
    virtue of the different types of advertising packets they transmit.


    # BLE Central


    A Central is a device that discovers and listens to other BLE devices that are
    advertising and is capable of establishing a connection to a BLE peripheral. A
    Central can establish connections with multiple peripherals. An Observer, on the
    other hand, discovers and listens to other BLE devices but cannot initiate connections
    with a peripheral device.


    The features of the various BLE actors are summarized in the following table:'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS


    | Broadcaster | Peripheral | Observer | Central |

    | --- | --- | --- | --- |

    | Does not need to have a radio receiver | Must have both a transmitter and a
    receiver | Does not need to have a radio receiver | Must have both a transmitter
    and a receiver |

    | There is no bidirectional data transfer | Capable of bidirectional data transfer
    | There is no bidirectional data transfer | Capable of bidirectional data transfer
    |

    | Can function with reduced hardware and a reduced BLE software stack | Requires
    a full BLE software stack | Can function with reduced hardware and a reduced BLE
    software stack | Requires a full BLE software stack |


    It is possible to implement a BLE device that can act as a central and a peripheral.

    An example of this multi-role BLE device is a device that can monitor multiple
    sensors (peripheral devices) and, concurrently, advertise its presence to a smartphone
    as to allow access to sensor data via a mobile interface.

    Important HCI (Host Controller Interface) elements include GAP (Generic Access
    Profile), GATT (Generic Attribute Profile), and ATT (Attribute Protocol) and are
    outlined in the following sections.


    # HCI – Generic Access Profile (GAP)


    The Generic Access Profile (GAP) is mandatory as it defines how BLE devices interact
    with each other and what is possible for BLE devices to interoperate, communicate,
    and exchange data with each other. It is concerned with the various modes and
    roles of BLE devices and includes things such as advertisements (advertising,
    scanning, advertising parameters, advertising data, scanning parameters), connection
    establishment (initiating, accepting, connection parameters), and security.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Attribute Protocol (ATT)


    ATT defines how a server exposes data to a client and how that data is structured.


    ATT involves two roles: a server role and a client role. The server exposes data
    it controls or contains. It may also expose other aspects of server behavior that
    other devices may be able to control. The server accepts incoming commands from
    a peer device and sends responses, notifications, and indications. For example,
    a BLE thermometer device will behave as a server when it exposes the temperature
    of its surrounding environment, as well as other details, which might include
    details such as the units of measurement, the time intervals at which temperature
    readings are taken, and, possibly, further information such as, the battery life
    of the sensor device. Instead of being polled for data by a client, a thermometer
    device may notify a client when a temperature reading has changed. The client
    device interfaces with the server in order to read the server’s exposed data and/or
    control one or more aspects of the server’s behavior. The client sends commands
    and requests and accepts incoming notifications and indications.


    # Data Attributes


    In BLE, the data exposed by a BLE server is structured in the form of attributes.
    An attribute is a generic term for a type of data exposed by the server and serves
    to define the structure of that data. An attribute type is a Universally Unique
    Identifier or UUID. In the case of a Bluetooth SIG-Adopted Attribute, it is a
    16-bit number. For a custom attribute type defined by an application developer,
    it is a 128-bit number. Custom attribute UUIDs are also referred to as vendor-specific
    UUIDs.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS


    For example, the UUID for a SIG-adopted temperature measurement value is 0x2A1C.
    SIG-adopted attribute types (UUIDs) share all but 16 bits of a special 128-bit
    base UUID 00000000-0000-1000-8000-00805F9B34FB.


    The published 16-bit UUID value replaces the 2 bytes in bold in the base UUID.


    A custom UUID, on the other hand, is a 128-bit number that does not use the SIG-adopted
    base UUID. A benefit of using a SIG-adopted UUID is that it results in a reduction
    in packet size as it can be transmitted using a 16-bit representation instead
    of a full 128-bit UUID value. Data attributes also include an Attribute Handle
    and Attribute Permissions.


    An Attribute Handle is a 16-bit value that the server assigns to attributes for
    identification purposes. It is used by the client to reference a given attribute
    and is guaranteed by the server to uniquely identify that attribute for the duration
    of the connection between two devices. Handle''s values lie in the range 0x0001-0xFFFF,
    as the value 0x0000 is reserved.


    Attribute Permissions determine things such as whether an attribute can be read
    or written to, whether that attribute can be notified or indicated, and, also,
    the security levels required for the attribute operations. Permissions are not
    defined or discovered via the Attribute Protocol (ATT), but rather defined at
    a higher layer (GATT layer or Application layer).


    The structure of an attribute is shown schematically in Figure 7-7.


    | 2 Octets | 2 or 16 Octets | Variable Length | Implementation Specific |

    | --- | --- | --- | --- |

    | Attribute Handle | Attribute Type | Attribute Value | Attribute Permissions
    |


    ( An octet is equivalent to a byte )


    # Figure 7-7. Structure of an attribute'
