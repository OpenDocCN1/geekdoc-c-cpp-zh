    # Mutual Exclusions Semaphore (Mutex)


    A mutex such as the Zephyr RTOS is sometimes described as a special kind of binary
    semaphore that has the properties of ownership, recursive locking, task deletion
    safety, and priority inversion avoidance protocol behavior. It is probably better
    to think of semaphore and mutexes as serving separate purposes. The mutex is an
    object to be used for mutual exclusion, and the semaphore is an object to be used
    for task synchronization.


    The mutex can be in one of two states: locked (0) or unlocked (1). When created,
    it is in the unlocked state – and can be acquired by a task. Once a mutex is acquired,
    its state becomes the locked state, and that mutex can only be released by the
    task that acquired ownership of that mutex when it obtained the mutex. Once released,
    its state becomes the unlocked state.


    Recursive locking means that a task that owns a mutex acquire it multiple times
    in the locked state. A recursive mutex permits nesting of attempts to lock the
    mutex in the sense that a function that acquires the mutex can call another function
    that acquires the mutex again, and can release the mutex just before it returns.
    In practice, the use of this recursive feature is best avoided even though it
    is supported.


    The property of task deletion safety means that a task cannot be deleted while
    it owns the mutex.


    36'
