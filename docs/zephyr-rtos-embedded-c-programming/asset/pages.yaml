    Any thread may join a memory domain, and a memory domain can have multiple threads
    assigned to it. Threads are assigned to memory domains with the API call:


    ```

    k_mem_domain_add_thread(&app0_domain, app_thread_id);

    ```


    Where the thread was already a member of some other domain (including the default
    domain), it will be removed from that domain in favor of the new one. Also, if
    a thread is a member of a memory domain and it creates a child thread, that child
    thread will also belong to that memory domain.'
