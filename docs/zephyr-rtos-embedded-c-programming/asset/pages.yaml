  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    The problems (scenarios) that result in the Wi-Fi MAC protocol being the way it
    is include the following [1]:


    +   * The "near/far" problem


    +   * For a station (network interface) to detect a collision, in has to be able
    to transmit and listen at the same time. However, in an 802.11 WLAN, transmission
    will been drawn out the ability of the station to detect a collision.


    +   * The "hidden node" issue


    +   * This arises when two stations on opposite sides of an access point may both
    hear activity from that access point, but not from each other. This may be due
    to distance effects, or the presence of some obstruction.


    +   * The need for power efficiency that arises when Wi-Fi in battery-powered
    devices, in which battery life considerations are important


    # Approaches to Tackling the Various Wi-Fi MAC Problems


    The 802.11 CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance) protocol,
    or the Distributed Coordination Function (DCF), was designed to handle the "near/far"
    problem. In this protocol, a station wishing to transmit listens for wireless
    transmission activity; if no activity is detected, it waits for an additional,
    randomly selected period of time and then transmits if the medium is still free.
    This strategy will tend to reduce the probability that two or more stations will
    begin transmitting at the same time and will tend to ensure a degree of fairness.'
  merge: -1
  pgno: 585
- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    Because CSMA/CA cannot guarantee that a collision will not occur, 802.11 uses
    an explicit acknowledgment (ACK) scheme, which involves the receiving station
    sending an ACK packet to confirm the data packet arrived intact. If the sending
    station does not detect an ACK frame, it assumes that the packet was not received
    and retransmits it after waiting for a random period of time. This acknowledgment
    mechanism imposes an overhead, which means that 802.11 LAN will have a lower performance
    than an equivalent Ethernet LAN.


    The 802.11 RTS/CTS protocol represents an attempt to address the “hidden node”
    issue. When RTS/CTS is being used, a sending station transmits RTS and waits for
    the access point to reply with a CTS. As all stations in the network can hear
    the access point, the CTS will cause them to delay any intended transmissions,
    giving the sending station the opportunity to transmit and receive a packet acknowledgment
    without a collision occurring. Because RTS/CTS adds a further processing overhead
    to the network by temporarily reserving the medium, it is typically only when
    sending large packets, the retransmission of which would be costly.


    # Security Issues


    IEEE 802.11 involves authentication and encryption. Authentication proves that
    a particular station is the one it claims to be, and therefore, is authorized
    to communicate with a second station in a given area. In the infrastructure mode,
    authentication is established between an AP (access point) and each station.


    802.11 specifies two methods of authentication: open system or shared key.


    An open system allows any client to authenticate as long as it conforms to any
    MAC address filter policies that may have been set. All authentication packets
    are transmitted without encryption.'
  merge: -1
  pgno: 586
- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    Various key authentication schemes have been developed as the Wi-Fi standards
    have evolved. The sequence of authentication schemes from least secure to most
    secure is WEP, WPA, WPA2, and then WPA3 [2].


    The newer protocols were developed as weaknesses were discovered in the earlier
    protocols. Wired Equivalent Privacy (WEP) was shown to have many flaws and should
    no longer be used. There are readily available tools that can be used to break
    WEP encryption. For this reason, the Wi-Fi Alliance officially retired the WEP
    Wi-Fi encryption standard in 2004.


    WPA launched in 2003 served as a stepping stone to WPA2, which was launched in
    2004.


    WPA3, developed in light of vulnerabilities discovered in WPA2, was released in
    2018.


    The features added in WPA3 include


    +   - Brute-force protection by protecting from brute-force dictionary attacks


    +   - Public network privacy


    +   - Security support for the Internet of Things (IoT)


    +   - Stronger encryption by supporting 192-bit encryption


    Modern WPA3 routers support WPA2/WPA3 Transitional mode because not all devices
    connecting to the access point will support WPA2, a special mixed mode that uses
    WPA3-Personal (more on this in the following) and WPA2-Personal, allowing older
    devices without WPA3 support to connect to the router.


    WPA2 is vulnerable to the Key Reinstallation Attack (KRACK), which can be used
    by a hacker to intercept and manipulate the creation of new encryption keys within
    the secure connection process. However, it is a relatively sophisticated attack,
    and so WPA2 can provide a useful level of security where WPA3 is not possible.'
  merge: -1
  pgno: 587
- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    WPA3 requires all connections to use Protected Management Frames (PMF), which
    provide additional security. WPA3 can use 128-bit AES, but for WPA3-Enterprise
    connections, 192-bit AES is required.


    There are three versions of WPA3:


    +   - WPA3-Personal

    - WPA3-Enterprise

    - Wi-Fi Enhanced Open


    Wi-Fi Enhanced Open was designed to provide Wi-Fi encryption to users on “open”
    networks. A wireless router encrypts network traffic using a key. In the case
    of WPA3-Personal, this key is calculated from the Wi-Fi passphrase set up on the
    router. For security reasons, it is important to use strong passrases that are
    difficult to guess.


    # WPA3 SAE Key Exchange Protocol


    SAE (Simultaneous Authentication of Equals) is a key exchange protocol that eliminates
    the reuse of encryption keys and also provides “forward secrecy.” Forward secrecy
    prevents an attacker from decrypting a previously recorded Internet connection,
    even if they know the WPA3 password. SAE also uses peer-to-peer connection to
    establish the exchange, which can protect against man-in-the-middle interception
    attacks.


    # How Wi-Fi Uses the Radio Spectrum Allocated to It


    Wi-Fi can use the 2.4 GHz ISM (Industrial Scientific Medical) band and the 5 GHz
    band. The 2.4 GHz band is very congested because it is relatively narrow and is
    also used by other protocols such as BLE and Zigbee. By contrast, the 5 GHz band
    is far less congested. Although in theory Wi-'
  merge: -1
  pgno: 588
- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    should move over entirely to using the 5 GHz spectrum, in practice, this is unlikely
    to happen any time soon because there are so many Wi-Fi devices out there that
    work at 2.4 GHz.


    Wi-Fi has been evolving continually in a never ceasing effort to provide faster
    data rates, better security, and lower power consumption. The standards have both
    IEEE names and Wi-Fi Alliance names. For example, 802.11ac is also referred to
    as Wi-Fi 5.


    The evolution of Wi-Fi is summarized in the next bullet points [3]:


    +   IEEE 802.11 is the original 2.4 GHz Wi-Fi standard, introduced in 1997, which
    kicked off the development of Wi-Fi, one of the most widely used wireless networking
    protocols.


    +   IEEE 802.11b, or Wi-Fi 1, was introduced in 1999 and used a direct-sequence
    spread spectrum/complementary code keying (DSSS/CCK) so as to cope with interference
    from other devices such as microwave ovens, cordless phones, and baby monitors,
    for example. It had an indoor range of around ~38 m and an outdoor range of ~140
    m.


    +   IEEE 802.11a, or Wi-Fi 2, was introduced in 1999 as the successor to IEEE
    802.11b. It used OFDM (Orthogonal Frequency Division Multiplexing) modulation
    to provide higher data rates and also supported 5 GHz operation.


    +   IEEE 802.11g, or Wi-Fi 3, was introduced in 2003 and provided faster data
    rates of up to 54 Mbit/s in the same 2.4 GHz frequency band as IEEE 802.11b, using
    various enhancements of OFDM. It was popular in the mass market for such devices
    because 2.4 GHz devices were less expensive than 5 GHz devices.'
  merge: -1
