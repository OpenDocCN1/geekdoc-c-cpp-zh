- img_proc: true
  md: '# Condition Variables


    A condition variable is a kernel object that is associated with some shared resource.
    It is used by one to wait until some other task sets the shared resource to some
    specified condition. The condition is deduced by evaluating some kind of logical
    expression (predicate). When a task examines a condition variable, it must have
    exclusive access to that variable, and hence, a mutex is used in conjunction with
    a condition variable. The task must first acquire the mutex before evaluating
    the predicate. If the predicate evaluates to false, the task blocks till the desired
    condition is attained. The implementation is such that the operation of releasing
    the mutex and block-waiting for the condition is an atomic (indivisible) operation.


    The following pseudocode snippet illustrates the common way of using condition
    variables:


    ```

    //Task 1:

    Lock Mutex

    Examine shared resource

    While ( shared resource is busy )

    WAIT ( condition variable )

    Mark shared resource as Busy

    Unlock Mutex


    //Task 2:

    Lock Mutex

    Mark shared resource as Free

    SIGNAL ( condition variable )

    Unlock Mutex

    ```


    Because a signal on a condition variable is lost when there is nothing waiting
    on it, a task should check for the presence of the desired condition before waiting
    on it and should check for the presence of the desired condition after a wakeup.'
