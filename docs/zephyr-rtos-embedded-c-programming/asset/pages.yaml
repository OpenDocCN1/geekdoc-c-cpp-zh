    fs_read() is used to read data from a file:


    ```

    ssize_t fs_read(struct fs_file_t *zfp, void *ptr, size_t size)

    ```


    fs_read() reads up to size bytes of data to ptr buffer and returns number of bytes
    read, and the return value, the number of bytes actually read, may be less than
    the number of bytes requested if fewer bytes were available at the time of the
    read request.'
