  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    The implementation of the Zephyr network API makes extensive use of the short-read/short-write
    property of the POSIX API whenever possible. This is done in order to minimize
    both overheads and code complexity. This property permits calls such as recv()
    and send() on SOCK_STREAM type sockets to actually process (receive or send) less
    data than was actually requested by the user. For example, a call such as recv(sock,
    1000, 0) may return 100, meaning that only 100 bytes were read (short read). To
    retrieve the remaining 900 bytes, the application will need to invoke call() repeatedly
    till all the bytes have been received.


    # Zephyr Echo Server Example Overview


    The Zephyr echo-server application implements UDP/TCP server that listens for
    incoming IPv4 (and, if configured to do so, IPv6) packets (sent by an echo client)
    and simply sends them back. Additionally it is possible to configure the project
    to include TLS 1.2 support by providing a suitable overlay-tls.conv. The example
    code can be found in the Zephyr repository [2]. Even though the concept of an
    echo server is simple, the actual code covers many aspects of implementing TCP
    and UDP server applications in Zephyr RTOS. In real-world applications, the number
    of concurrent server applications is likely to be small, because of resource constraints
    on the kinds of hardware Zephyr RTOS will be running on.


    Recent versions of the server example support client connections to the server
    and the server port number is configured to be 4242. As TCP and UDP port numbers
    are independent the application will have a TCP port 4242 and a UDP port number
    4242.


    The echo server can be tested by setting up a second board running the echo client
    application, or by implementing a suitable testing program in, for example, C,
    C++, or Python running on a Windows or Linux PC, for example.


    387'
