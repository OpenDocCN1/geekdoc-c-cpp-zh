  md: '# Priority Inversion Avoidance


    Typically, priority inversion occurs when a higher priority task is blocked because
    it is waiting for a lower priority task to release a needed mutex, and where the
    lower priority task has itself been preempted by an intermediate level task. In
    effect, the priority of the high priority task has been inverted to that of the
    low priority task. Where the RTOS implements a priority inversion avoidance scheme,
    as Zephyr, the thread that has locked a mutex is eligible for priority inheritance.
    Here, the kernel will temporarily elevate the thread''s priority when a higher
    priority thread tries to acquire that mutex. The intention is that the owning
    thread will now be able to complete its work and release the mutex sooner by executing
    at the same priority as the waiting thread. When the owning thread releases the
    lock (or if the high priority waiting thread times out), the kernel restores the
    base priority of that thread from the value saved in the mutex data structure.


    An FSM description of the behavior of the mutex is shown in Figure 2-7.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_53_0.png)


    Figure 2-7. State machine for a recursive mutex'
