  md: '# Summary


    This chapter has introduced key Zephyr RTOS mechanisms (message queues, mailboxes,
    and pipes) for moving data around in multithreading applications and the synchronization
    and interprocess communications made possible by using these mechanisms. The various
    examples explored showed coding idioms and patterns that can be used to provide
    both synchronization between a producer and a consumer (sender and receiver) as
    well as temporary storage of data where necessary, and also for the movement of
    data and information from interrupt handles to threads that consume that data.
    These idioms and patterns can then be incorporated into more complex real-world
    applications.'
