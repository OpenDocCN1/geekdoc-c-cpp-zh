- img_proc: true
  md: "CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVCETREE IN GENERAL AND SPI I2C\
    \ IN PARTICULAR\n\n# # Working with Devices\n\nThe skills to master include knowing\
    \ how to allocate and configure a device and how to create a device instance and\
    \ use it in an application. For illustrative purposes, a scenario involving a\
    \ Bosch BME280 environmental sensor and a nRF52840 board will be considered. The\
    \ BME280 is quite a versatile sensor and is a popular component in “weather station”\
    \ projects. It is a humidity sensor that not only measures relative humidity but\
    \ barometric pressure and ambient temperature. It was developed for use in mobile\
    \ applications and wearables where size and low power consumption are key design\
    \ parameters. The humidity sensor has a low power consumption and has a high accuracy\
    \ over a fairly wide temperature range.\n\nAn overlay file for working with the\
    \ BME sensor could be written along the following lines:\n\n```\nspi3 {\n  compatible\
    \ = \"nordic,nrf-spim\";\n  status = \"okay\";\n  cs-gpios = <gpio1 12 GPIO_ACTIVE_LOW>;\n\
    \  sensor: bme280@ {\n    compatible = \"bosch, bme280\";\n    label = \"BME280\"\
    ;\n    reg = <0>;\n    spi-max-frequency = <1000000>;\n  };\n};\n```\n\nNodes\
    \ in the devetree are segmented by the kinds of hardware they describe. In this\
    \ example, spi3 node describes nordic, nrf-spi hardware. Nodes for different hardware\
    \ elements will have different compatible properties. For example, in the case\
    \ of sensor: bme280, it is necessary to describe how the sensor device attached\
    \ to the SPI bus is configured."
  merge: -1
