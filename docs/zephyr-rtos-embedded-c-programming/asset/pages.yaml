    # Synchronizing Threads Using Semaphores and Sleeping


    The interleaving of the work done by application threads according to some specified
    set of requirements is a common need.


    For relatively uncomplicated applications, one or more solutions can usually be
    found without too much effort.


    For more complex systems, especially applications involving distributed systems,
    the challenges are far greater. The pattern/scenario described in this section
    is one of several potentially useful “building block” patterns.'
