  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    scheduled by the Linux kernel. A Linux task runs in its own virtual memory space.
    Threads in Linux share the same virtual memory space but, from the scheduling
    point of view, are are scheduled as tasks.


    In Microsoft Windows, on the other hand, when a task is created, a thread (the
    primary thread) is also created, and this thread may spawn other threads. Here,
    the task can be thought of as the holder of resources and the threads are the
    units of work that are scheduled. In FreeRTOS, the terms "thread" and "task" are
    used interchangeably. "Each task executes within its own context with no coincidental
    dependency on other tasks within the system or the RTOS scheduler. Only one task
    within the application can be executed at any point in time, and the real-time
    RTOS scheduler is responsible for deciding which task should be."


    Where FreeRTOS talks about tasks, Zephyr RTOS talks about threads. Zephyr regards
    the scheduling of work. In Zephyr, a thread is a kernel object that is used for
    application processing. Any number of threads can be defined by an application
    (subject to the availability of sufficient RAM), and each thread will have a unique
    id that is assigned when the thread is spawned and can be used to reference that
    thread. From the application point of view, a Zephyr thread can be thought of
    as a "semi-independent" piece of an application that performs some specific function
    (carries out some specific duty) [2].


    A thread will have a number of properties such as a stack area, a thread control
    block, an entry point function, and a thread scheduling priority. The stack area
    is the region of memory used for the thread''s stack. The stack area can be configured
    to conform to the actual processing needs of the thread, and Zephyr provides macros
    to create and make use of stack memory regions. A thread control block is used
    for kernel bookkeeping of the thread''s metadata and is realized as an instance
    of type k_thread. An entry point function, the function that is invoked when the
    thread is started, can take up to three argument values that can be passed to
    this function. The scheduling priority of a thread is used in connection with
    thread scheduling and the allocation of CPU time to the thread.'
