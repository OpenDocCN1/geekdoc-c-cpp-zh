  md: '# CHAPTER 1 AN INTRODUCTION


    An operating system can be thought of as software that provides services that
    can be used for developing applications where multiple pieces of work (tasks)
    have to be worked on concurrently. At the center of an operating system is the
    scheduler, whose job is to decide which task is to run next. In a cooperative
    multitasking operating system, a task runs until it decides to suspend what it
    is doing and transfer control to the scheduler, which will determine which task
    to run next. In a preemptive multitasking operating system, a task can be preempted
    by the operating system at any point. Preemption may occur because a higher priority
    task is ready to run, or because the running task needs to access a resource that
    is currently not available because it is being used by another task. The concept
    of Real Time refers to how long it takes the system to respond to some event,
    as a button press, or arrival of data at a communications peripheral, or completion
    of an ADC (Analog to Digital) conversion. A distinction is often made between
    hard and soft real-time systems. In a hard real-time system, it is an error if
    the time taken for a response exceeds some specified duration. In a soft real-time
    system, the response time is interpreted in a statistical sense in which most
    of the required time-to-completion limits are met, but, occasionally, they not.


    Classical bare metal multitasking, typically, involves a combination of a “superloop”
    that handles non-time-critical work, with time-critical work being done in interrupt
    handlers. The Arduino IDE also follows this pattern.


    In the modern world of networked devices (both wired and wireless networking)
    running relatively complex network protocol stacks and doing so in a secure manner,
    the standard bare metal approach runs into difficulties. A networked device may
    have several interfaces, for example, wired or wireless Ethernet, USB, and serial
    communications such as CAN bus, RS232, or RS485. The code involved is quite complex,
    and having to handle the low-level details together with the other tasks being
    performed by the device, such as, for example, taking sensor readings on a periodic
    basis, adds further complexity. A networked device may have to interact'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 1 AN INTRODUCTION


    with a number of other devices, and the communication traffic patterns may be
    unpredictable. Worse still traffic may be bursty, and the system may need to protect
    itself against overloading by heavy bursts of traffic.

    Packet-oriented communications protocols such as TCP/IP are multilayer, and a
    packet will contain multiple headers corresponding to the various layers and the
    functionality they provide. It is not uncommon for protocols to support multiplexing.
    For example, the TCP/IP stack handles both UDP and TCP traffic as well as ICMP
    traffic, and in the case of UDP and TCP, there may be traffic associated with
    different processes running on the device each identified by a particular identifier
    (port number).


    From the design and implementation point of view, a multitasking approach allows
    the various tasks to be worked on separately and then combined together, courtesy
    of the scheduling and intertask communication and synchronization mechanisms such
    as semaphores and message queues provided by the RTOS.


    The key motivation underlying the use of an RTOS to build embedded applications
    is that it provides a framework and its associated abstractions, APIs that support
    developing code that can handle the time, priorities, and preemptionibility of
    the tasks that constitute application so that task deadlines can be met and the
    system exhibits deterministic behavior. From a developer''s point of view, an
    RTOS can be thought of as providing services, not only scheduling, synchronization,
    and intertask communication services also, if required, file systems services,
    communications services, and security services.


    # What Is an RTOS?


    The OS in RTOS stands for Operating System. An operating system can be thought
    of as a collection of modules (libraries) that provide task scheduling and control
    services, where a task is code that carries out a'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'particular piece of the overall application''s work. A modern advanced operating
    system will also provide device drivers for widely used devices and peripherals,
    communications protocol stacks and application layer modules on which actual applications
    can be layered, security and memory protection or memory management services,
    and much more besides. The RT in RTOS stands for Real Time.


    Real Time refers to predictable and reproducible behavior. This behavior may be
    predictable in a statistical sense, for example, where the response times to some
    event will follow a statistical distribution with a certain mean and variance.
    For certain applications, there may be a requirement that the response time is
    always less than some specified value. Such applications are referred to as “hard”
    real-time applications. It is also possible to have systems that involve both
    “hard” and “soft” real-time aspects.


    # Using Open Source RTOS in Systems Requiring Functional Safety


    In the case of applications where a high degree of functional safety is involved,
    the question also arises as to whether open source version of Free software can
    be used for systems for which “functional safety” is a mandatory requirement.


    The use of RTOS code in safety-critical systems generally involves the use of
    code that has been rigorously tested and validated that it conforms to one or
    more of the published safety standards. In the case of FreeRTOS, for example,
    there is an open source version of FreeRTOS and a validated version called SAFERTOS
    pre-certified to IEC 61508 for safety-critical applications. Currently, there
    is no pre-certified version of Zephyr RTOS. The Zephyr project is aiming to, eventually,
    be able to provide a version that has been certified for use in safety-critical
    applications. It is reflected in the Zephyr development and code review process.'
  merge: -1
