  md: 'BLE unicast connections give rise to a piconet (tiny) network architecture
    in which a master coordinates data transfer with one or more slaves and where
    a slave can only belong to a single piconet.


    # HCI (Host Controller Interface) Layer


    The HCI layer protocol is defined in the Bluetooth specification, and it defines
    how the host layer can communicate with the controller layer. The host layer and
    the controller layer may exist in separate chipsets, or they may exist in the
    same chipset.


    In the case where the host and controller are in separate chipsets, the HCI layer
    is implemented over a physical communication interface such as UART, USB, or SDIO
    (Secure Digital Input Output).


    In the case where the two layers (host and controller) live on the same chipset,
    the HCI layer is a logical interface. The task of the HCI layer is to relay commands
    from the host to the controller and to send events from the controller to the
    host.


    # Logical Link Control and Adaptation Protocol (L2CAP) Layer


    The Logical Link Control and Adaptation Protocol (L2CAP) layer acts as a protocol
    multiplexing layer. It takes multiple protocols from the upper layers and places
    them in standard BLE packets that are passed down to the lower layers. It is responsible
    for fragmentation and reassembly of larger packets (which exceed the maximum BLE
    payload size). L2CAP layer handles the BLE Attribute Protocol (ATT) and the BLE
    Security Manager Protocol (SMP).'
  merge: -1
