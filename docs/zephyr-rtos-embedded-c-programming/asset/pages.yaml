    # Patterns Involving the Use of Critical Sections


    In a typical scenario, the application code may contain two sections of code that
    can access the same shared resource e.g. one that reads the shared resource and
    another that modifies the shared resource. The critical section code that reads
    the shared resource running in one task must not run when the critical task that
    modifies the shared resource is running in another task and vice versa. Hence,
    critical sections need to be guarded by a suitable mutual exclusion mechanism
    to ensure that each task has exclusive use to the shared resource when it needs
    it (e.g., writing to a shared area of memory). Where critical deadlines have to
    be met, the size and complexity of critical section code will be important. Ideally
    a mutual exclusion mechanism should guarantee that only one task can enter its
    critical section at any given time. In practice, it is also important to ensure
    that multiple competing tasks are granted fair access to the shared resource and
    also to ensure that a task executing in its critical section does not prevent
    another task from executing in a noncompeting critical section.


