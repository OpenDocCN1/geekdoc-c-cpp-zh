    Zephyr provides several "convenience" macros for logging messages at different
    severity levels, LOG_INF, LOG_DBG, LOG_WRN, and LOG_ERR, as shown in the following
    example:


    ```

    LOG_INF("Count %d",2);

    LOG_DBG("Debug I2C sensor value %d", 33);

    LOG_WRN("Temp sensor reading HIGH");

    LOG_ERR("Out of range setting given");

    ```


    The Zephyr Logger module is similar to logging libraries with other embedded systems
    development environments such as, for example, the ESP32 logging library [4].


    Zephyr also provides a set of LOG_HEXDUMP_X macros for dumping data as a sequence
    of hexadecimal byte values, where X can be DBG, INF, WRN, or ERR.


    A LOG_HEXDUMP_X macro takes, as its three parameters, a pointer to the data to
    be dumped, the size of data bytes, and a description string to describe the data,
    for example:


    ```

    uint8_t data[] = { 0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06,

    0x07, ''H'', ''e'', ''l'', ''o'' };

    ```


    ```

    LOG_HEXDUMP_INF(data, sizeof(data), "hexy hello");

    ```


    The data displayed in the terminal window will be


    ```

    00 01 02 03 04 05 06 07 48 65 6c 6c 6f

    ```


    The Logger module can be configured either globally or on a module basis. Global
    logging settings apply to all modules. Module-specific logging configuration can
    be used to specify a module logging level (LOG_LEVEL_[level]) or to disable logging
    from that module by using the setting LOG_LEVEL_NONE. It is also possible to override
    logging levels globally. However, a global override can only be used to increase
    the logging level.'
