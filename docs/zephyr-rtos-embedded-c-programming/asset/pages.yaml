  md: '# CHAPTER 12

    Zephyr RTOS Wi-Fi Applications


    Wi-Fi is the brand name for a wireless networking technology that can be used
    by devices such as computers (laptops and desktops), mobile devices (smartphones
    and wearables), and other equipment such as printers, video cameras, and Wi-Fi-enabled
    sensors to interface with the Internet and exchange information with one another.


    The standards underlying Wi-Fi belong to the IEEE 802.11 family of standards.
    The device that provides wireless connectivity to the Internet is commonly referred
    to as an access point. A Wi-Fi router is an access point that is also a router.


    Wireless LAN protocols work at the physical and link layers of the ISO-OSI 7 layer
    model.


    The 802.11 data link layer is made up of two sublayers: a Logical Link Control
    (LLC) layer and a Media Access Control (MAC) layer. 802.11 uses the same 802.2
    LLC and 48-bit addressing as other 802 LANs. The MAC protocol details of a wireless
    LAN are not the same as those for a wired LAN. For 802.3 Ethernet LANs, the Carrier
    Sense Multiple Access with Collision Detection (CSMA/CD) protocol controls how
    Ethernet stations establish access to the wire and how they detect and handle
    collisions that occur when two or more devices to simultaneously communicate over
    the LAN.'
