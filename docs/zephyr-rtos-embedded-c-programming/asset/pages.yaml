    # # FIFOs in Zephyr


    A Zephyr FIFO is a kernel object that implements a (FIFO) queue that can be used
    by threads and ISRs to add and remove data items of any size. The main (typical)
    use of a FIFO is to asynchronously transfer data items of arbitrary size in a
    “first in, first out” manner. The Zephyr queue is implemented as a linked list
    that, on initialization, is empty. Because the first word of a data item is a
    pointer to the next item in the queue, FIFO data items k_fifo_get() is a blocking
    operation whose blocking behavior is defined by the second argument passed to
    k_fifo_get(). The possible blocking behaviors are to return at once, block for
    some specified amount of time, and block further. The Zephyr FIFO API consists
    of the functions/Macros K_FIFO_DEFINE, k_fifo_init(), k_fifo_alloc_put(), k_fifo_put(),
    k_fifo_put_list(), k_fifo_put_slist(), and k_fifo_get(), and these are described
    in the Zephyr documentation.


