  md: '# CHAPTER 2 A REVIEW OF RTOS FUNDAMENTALS


    an allocation table, which tracks the areas of memory that are in use and those
    that are free, including the size of each free area of memory.


    Memory is normally allocated in multiples of some fixed block size, for example,
    32 bytes. When a request for memory is made, the smallest number of contiguous
    blocks that can satisfy that request is allocated. One possible technique for
    handling memory fragmentation is to use some form of memory compaction to combine
    free blocks into one larger block of contiguous memory. The disadvantages of such
    an approach include things such as the need for block copying of data and the
    inability of an application to access data while it is being copied. Memory management
    also needs to take architecture-specific memory alignment requirements into account
    (e.g., multi-byte data items as long integers may need to be aligned on an address
    that is a multiple of 4). Zephyr provides a variety of memory management approaches
    such as shared multi-heaps, memory slab allocation, fixed block size allocation,
    and demand paging.


    In general, in embedded system applications, it is best to avoid having a thread
    allocate memory dynamically. Common good practice is to allocate dynamic memory
    at the start of the application so that this memory will, in effect, appear to
    be static memory.


    When allocating memory dynamically, it is important to consider whether a thread
    trying to allocate memory from the heap should either block indefinitely until
    memory becomes available, block for some specified timeout period, or return without
    blocking when memory is not available. Best practice is to keep dynamic memory
    allocation in the middle of a running program to a minimum, performing all the
    dynamic memory allocation early on in the application and then working as if that
    dynamically allocated memory is static then on.


