    The subscriber task uses the ZBus API function


    ```

    int zbus_sub_wait(const struct zbus_observer *sub,

    const struct zbus_channel **chan, k_timeout_t timeout)

    ```


    to wait for a channel notification. The arguments are the subscriber reference
    (sub), the channel notification reference (chan), and a timeout, which can be
    either K_NO_WAIT or K_FOREVER or an explicit timeout value.


    The possible return values are as follows:


    +   - 0 - Notification received.

    - -ENMSG - Returned without waiting.

    - -EAGAIN - Waiting period timed out.

    - -EINVAL - The observer is not a subscriber.

    - -EFAULT - A parameter is incorrect, or the function context is invalid (e.g.,
    inside an ISR). The function returns this value when CONFIG_ZBUS_ASSERT_MOCK is
    enabled.'
