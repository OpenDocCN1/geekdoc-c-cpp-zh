  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICEETREE IN GENERAL AND SPI
    AND I2C IN PARTICULAR


    Recall that the DTS property clock-frequency is spelled clock_frequency in C,
    because of the rule that replaces special characters with underscores and converts
    names to all lowercase.


    The DT_PROP() macro expands to a string literal in the case of strings and the
    number 0 or 1 in the case of booleans, for example:


    ```

    #define I2C1 DT_NODABEL(i2c1)

    DT_PROP(I2C1, status) /* expands to the string literal "okay" */

    ```


    In the case of properties with type array, uint8-array, and string-array, DT_PROP()
    expands to an array initializer.


    In the case of the following example devicree fragment:


    ```

    foo: foo@1234 {

    a = <1000 3000>; /* array */

    b = [aa bb cc dd]; /* uint8-array */

    c = "bar", "baz"; /* string-array */

    };};

    ```


    its properties can be accessed as shown here:


    ```

    #define FOO DT_NODABEL(foo)

    int a[] = DT_PROP(FOO, a); /* {1000, 2000, 2000} */

    unsigned char b[] = DT_PROP(FOO, b);/*0xaa, 0xbb, 0xcc, 0xdd */

    char c[] = DT_PROP(FOO, c);/*{"foo", "bar" */

    ```


    Zephyr provides the DT_PROP_LEN() macro to obtain logical array lengths, for example:


    ```

    size_t_a_len = DT_PROP_LEN(FOO, a); /* 3 */

    size_t_b_len = DT_PROP_LEN(FOO, b); /* 4 */

    size_t_c_len = DT_PROP_LEN(FOO, c); /* 2 */

    ```


    DT_PROP_LEN() cannot, however, be used with the special reg or interrupts properties.'
  merge: -1
  pgno: 490
