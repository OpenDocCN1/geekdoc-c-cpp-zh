  md: '# Overview of the Virtual Distributed Event Dispatcher (VDED)


    The virtual distributed event dispatcher (VDED) implements the bus logic responsible
    for sending notifications/messages to the observers. The VDED logic runs inside
    the publishing action in the same thread context as the publishing action. Because
    it might block, a VDED cannot run inside an interrupt service routine (ISR), and
    consequently, ISRs should only access channels indirectly, using some kind of
    deferred processing mechanism such as a workqueue.


    The sequence of VDED steps involved in dispatching an event conforms to the following
    pattern:


    +   - Acquire the channel mutex.

    - Receive the new message to be dispatched into the channel via a direct raw memcpy().

    - Execute the listener callback methods.

    - Send a copy of the message to each of the message subscribers, and push the
    channel''s reference to the notification message queue of each subscriber in the
    same sequence they appear on the channel observers'' list.

    - The listeners can perform a non-copy quick access to the constant message reference
    directly, using the zbus_chan_const_msg() function, as the channel is still locked.

    - Finally, the publishing function unlocks the channel.'
  merge: -1
  pgno: 561
