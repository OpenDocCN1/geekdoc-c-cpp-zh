  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    The following code snippet shows how a thread can be created at runtime. In this
    snippet, the thread that is created starts immediately:


    ```

    #define MY_STACK_SIZE 500

    #define MY_PRIORITY 5

    extern void my_entry_point(void *, void *, void);

    K_THREAD_DEFINE(my_stack_area, MY_STACK_SIZE);

    struct k_thread my_thread_data;

    k_tid_t my_tid = k_thread_create(&my_thread_data,

    my_stack_area,

    _THREAD_SIZEOF(my_stack_area), my_entry_point,

    NULL, NULL, MY_PRIORITY, 0, K_NO_WAIT);

    ```


    A thread can be declared at compile time by invoking the K_THREAD_DEFINE macro.
    This macro defines the stack area, control block, and thread id variables automatically.


    The following code snippet has the same effect as the code snippet shown previously:


    ```

    #define MY_STACK_SIZE 500

    #define MY_PRIORITY 5

    extern void my_entry_point(void *, void *, void *);

    _THREAD_DEFINE(my_tid, MY_STACK_SIZE,

    my_entry_point, NULL, NULL, NULL,

    MY_PRIORITY, 0, 0);

    ```


    If CONFIG_USERSPACE is enabled, the K_THREAD_STACK macros and the K_KERNEL_STACK
    macros will have exactly the same effects, because in this case there will be
    no distinction, privilege level between the threads. In the context where userspace
    is enabled, each thread will have access to all the resources.'
