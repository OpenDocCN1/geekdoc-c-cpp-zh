    These usage patterns are used for the purposes of waiting, signalling, tracking
    and for controlling access to shared resources. Some of the patterns depend on
    the use of semaphores combined with tasks running at appropriate priority levels.
    Some of the patterns can become quite complex, and only the simpler, generally
    used, patterns will be considered here.


