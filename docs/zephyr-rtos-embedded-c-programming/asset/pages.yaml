  md: '# An Overview of Generic Zephyr Features Pertaining to Privilege Modes, Stack
    Protection and Separation, User Mode Threads, and Memory Domains Privilege Modes


    By default, Zephyr runs in a single privilege mode called kernel mode, which is
    the privilege level of the OS kernel itself. For hardware platforms not configured
    to support unprivileged mode, application threads will run at the same privilege
    level as the kernel. The danger, here, is that a "rogue thread" might corrupt
    other application threads or even the kernel itself.


    If the architecture supports additional modes with reduced privileges, and Zephyr
    is configured so as be able to run threads at a reduced privilege level, then
    threads can be isolated from the kernel and isolated from other threads.


    Zephyr can support hardware stack protection on systems that have stack protection
    capabilities. When stack protection is enabled, stack buffer overflows are detected
    when the system is running in supervisor mode, which will catch issues when the
    kernel stack buffer has overflowed. Overflows for individual stack frames will,
    however, not be detected. However, Zephyr can support compiler option features
    that enable stack canary for individual frames. In addition to stack overflow
    protection, Zephyr can be configured to implement per-thread stacks When this
    is combined with memory protection in systems having a Memory Protection Unit
    (MPU), the result makes possible an MPU-backed userspace. In such a configuration,
    unprivileged user threads can only access their required memory regions and no
    other regions.'
