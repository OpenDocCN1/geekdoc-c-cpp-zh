    # Thread Custom Data


    Thread custom data is a 32-bit custom data area, accessible only by the thread
    itself, which can be used by the application for any purpose it chooses. The default
    custom data value for a thread is zero. By default, thread custom data support
    is disabled. It is enabled with the configuration option CONFIG_THREAD_CUSTOM_DATA.
    The Zephyr API provides the k_thread_custom_data_set() and k_thread_custom_data_get()
    functions to write and read a custom data, respectively. A thread can only access
    its own custom data. Typically, thread custom data is used to allow a routine
    to access thread-specific information, by using the custom data as a pointer to
    a data structure owned by the thread.


    It should be noted that custom data support is not available to ISRs because they
    operate within a single shared kernel interrupt handling context.


    # Dropping Privileges


    If CONFIG_USERSPACE is enabled, a thread running in supervisor mode can perform
    a one-way transition to user mode by using the k_thread_user_mode_enter() API
    function. This one-way operation will reset and zero the thread''s stack memory
    and mark that thread as non-essential.'
