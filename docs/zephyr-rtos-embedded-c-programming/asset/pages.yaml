- img_proc: true
  md: "# Disadvantages of Simulators and Emulators\n\n+   * Because simulators and\
    \ emulators are virtual copies and not the actual devices, the test results may\
    \ not be completely accurate. It will be necessary to be aware of the possibility\
    \ of false-positive and false-negative results.\n\n+   * Not all features can\
    \ be tested with emulators and simulators, for example:\n  * Battery performance\n\
    \  * CPU performance\n  * Memory consumption\n  * Video and audio quality\n  *\
    \ Connectivity issues involving, for example, Wi-Fi and BLE networks\n  * Color\
    \ display details\n\n+   * Staying up to date with the underlying physical devices\
    \ and their peripherals and drivers.\n\n# Renode\n\n+   * Renode [3] is designed\
    \ to be a “whole-system emulator” that can be used in continuous integration and\
    \ continuous development (CI/CD) scenarios on multiple devices.\n\n+   * It is\
    \ capable of simulating systems with multiple cores and multiple heterogenous\
    \ CPUs."
  merge: -1
