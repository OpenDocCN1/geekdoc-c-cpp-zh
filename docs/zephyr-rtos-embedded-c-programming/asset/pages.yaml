    # Overview of the FAT File System and FatFs


    Figure 6-8. Conceptual diagram showing a layered approach to file systems


    FAT file system stands for file allocation table (FAT) file system. The original
    design and implementation was credited to Bill Gates and Marc McDonald. FAT specifies
    a format and procedures for storing and organizing files on some kind of storage
    device, which can be, for example, a disk drive or some kind of memory-based storage
    device. FAT filesystem software provides APIs for accessing files and directories,
    time stamping file creation or file modification time, and retrieving storing
    file attributes such as file size and read/write attributes, for example, a file
    may be a read-only file, whether a file should be hidden in the context of displaying
    the contents of a directory. A fairly detailed history of the origins'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    and evolution of FAT can be found on Wikipedia (https://en.wikipedia.org/wiki/File_Allocation_Table).
    The technical details of FAT and how its design evolved are described in this
    Wikipedia article: https://en.wikipedia.org/Design_of_the_FAT_file_system.


    Originally FAT was developed for use with floppy disks, and, later, it was extended
    to cope with larger hard disk drives. Thus, there are various versions of FAT
    oriented to file systems of different sizes and include FAT12 (12-bit version
    – introduced in 1980), 1984 with DOS 3.0–based PCs), and FAT32 (32-bit version
    with 28 bits used – introduced in 1996 in Windows 95 OSR2).


    Descriptions of file systems include terms such as sector and cluster. A sector
    is a disk drive unit of storage. It depends on the drive and is typically 256
    bytes for a RAM disk and 512 bytes for a hard disk. A cluster is a file system
    unit of storage and is, typically, an multiple of the sector size.


    Blocks in a file system can be allocated using a contiguous allocation strategy
    where all the blocks of a file are contiguous, or a linked allocation strategy
    where file data blocks are stored as a linked list. FAT uses a linked list approach
    as shown in the schematic featured in Figure 6-9.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_300_0.png)


    Figure 6-9. Block allocation in FatFs


