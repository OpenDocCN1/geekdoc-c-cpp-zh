    There are various acronyms associated with BLE. These include Generic Access Profile
    (GAP), Generic Attribute Profile (GATT), Attribute Protocol (ATT), Security Manager
    (SM), Logical Link Control and Adaptation Protocol (L2CAP), and the Host Controller
    Interface (HCI) host side. For the link (L2CAP), PHY refers to the physical layer,
    and HCI refers to the controller side Host Controller Interface.


    # # BLE Physical Layer


    The BLE physical layer (PHY) is concerned with the radio hardware used for communication
    and for modulating/de-modulating the data being transmitted.


    BLE operates in the somewhat congested ISM band (2.4 GHz spectrum). In the case
    of BLE, this is segmented into 40 RF channels, each of which is separated by a
    2 MHz (center-to-center) gap. Three of the channels are the Primary Advertising
    Channels, and the remaining 37 channels are used for Secondary Advertisements,
    and for data transfer during a connection. This is shown schematically in Figure
    7-3.'
