  md: '# CHAPTER 10


    # # Building Zephyr RTOS Applications Using Renode


    When developing relatively complex embedded systems applications, it can be useful
    to start developing firmware and application software before actual hardware is
    available. Development kits based on the selected target processor are useful
    but limited because they may not support all the peripherals that will be used
    in the actual application. Many development kits support the addition (plugging
    in) of peripherals either because they provide Arduino connectors to which shields
    containing the needed peripherals can be used or because they provide connectors
    such as PMod [1] connectors or Mikroe [2] connectors for attaching various sensors
    and peripherals. An alternative approach is to use an emulator as Renode to emulate
    the target system and test application code.


    The use of Zephyr RTOS in the development of IoT embedded applications, in other
    words, involve multiple devices that are part of a network which can involve both
    wired and wireless communications links, is growing rapidly, driven by the adoption
    of Zephyr RTOS by companies like Nordic, STM, Microchip, and Labs.'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# CHAPTER 10 BUILDING ZEPHYR RTOS APPLICATIONS USING RENODE


    More and more complex applications are being developed to tighter and tighter
    development deadlines. Some of the applications have safety-critical and security
    applications in addition to having satisfy real-time requirements. There is therefore
    a need to develop and test application code and associated firmware in parallel
    with the development of the hardware.


    Modern continuous integration and continuous delivery approaches depend on being
    able to automate testing, version control, and delivery. Testing and test automation
    can benefit from the availability of a powerful and extensible emulator such as
    Renode.


    In addition to being used for developing and testing networked multi-node applications,
    Renode can be used for the development of single node applications, especially
    where actual target boards are not yet available.


    An emulator is not the same thing as a simulator. A good way of distinguishing
    between the two is to imagine a car simulator or flight simulator. If the car
    or flight simulator could actually carry the user from place to place, it would
    be an emulator.


    Complex application development may involve part simulation and part emulation,
    for instance, emulating a microcontroller core, or simulating peripherals and
    sensors or communications links.


    To place Renode in context, it is important to distinguish between simulators
    and emulators and to consider the advantages and disadvantages of using emulators
    and simulators in the development of embedded systems applications.


    | Emulator | Simulator |

    |---|---|

    | Purpose Substitutes an actual device | Reveals application behavior | Coding
    Both assembler and compiled high level language code | High-level language using
    the simulator API |n Environment being imitated Both software and hardware aspects
    | End behavior of the software (what the user will experience) |


    (continued)'
  merge: -1
  pgno: 519
- img_proc: true
  md: "| Emulator | Simulator |\n| --- | --- |\n| Performance | Can be slow | Typically,\
    \ runs compiled code, hence faster |\n| Use cases | Testing at the level of detailed\
    \ internal behavior | Testing the external (visible/experienced) behavior |\n\n\
    # # Simulator Use Cases\n\n+   - Developing software when the target devices have\
    \ not been decided on or are not available, or are expensive\n- When evaluating\
    \ how an application interacts with users or some external environment\n- Checking\
    \ effects of using different kinds of peripheral, for example:\n  - Using UI (User\
    \ Interface) devices with different screen sizes and different screen resolutions\n\
    \n# # Emulator Use Cases\n\n+   - Checking how application software interacts\
    \ with the hardware or a combination of the hardware and an OS (Operating System)\n\
    - Note: It may not be possible to emulate all hardware units."
  merge: -1
  pgno: 520
- img_proc: true
  md: "+   - In continuous integration testing approaches, for example, when using\
    \ an Agile development methodology where there is a requirement to carry out testing\
    \ during the early stages of the project life cycle\n\n+   - Emulator-based automation\
    \ testing makes it possible to test in parallel with the development process life\
    \ cycle\n\n+   - More powerful/insightful debugging involving measuring things\
    \ such as\n  - CPU load\n  - Memory consumption\n  - Network loads\n\n# Advantages\
    \ of Simulators and Emulators\n\n+   - Saving money when testing network application\
    \ performance as it is not necessary to actually build and administer a physical\
    \ network\n\n+   - Ability to use scalability and pay-as-you-go benefits of cloud\
    \ computing to scale up as needed\n  - As well as relative ease of cloud deployment\n\
    \n+   - The convenience of using virtual emulator and simulator devices for test\
    \ automation purposes"
