  md: '# Accessing the Devicree in C and C++ Application Code


    Zephyr devicree build process generates a C header in which all the required devicree
    data is abstracted behind a macro API framework. Information about a particular
    devicree node is obtained by using a corresponding C macro, which is referred
    to as a name identifier for device. The devicree build process that goes from
    a devicree to struct device definitions is sometimes referred to as the "Cheshire
    Cat model of setting up devices" [5]. This is a metaphor based on Lewis Carroll’s
    Alice in Wonderland with a character, the Cheshire Cat, fades away and all that
    remains is its smile. Loosely speaking, the Zephyr approach to setting up devices
    involves "messing around with the devicree," then "fighting with the build system"
    so that when the build system is run, the devicree "disappears" and all that is
    left are the "devices."


    A Zephyr application uses APIs as drivers to do work on real hardware. The APIs
    are to be found in C headers, and the drivers are to be found in C files. This
    is shown schematically in Figure 9-10.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_486_0.png)


    **Figure 9-10.** APIs found in C headers and drivers found in .c files


    The key driver abstraction in Zephyr is that, from the device perspective, everything
    is a struct device, and particular kinds of struct device correspond to particular
    kinds of driver.


    An application will have a .conf Kconfig specifying which drivers are needed.
    For a supported board, there will be a base devicree in the Zephyr source code.
    This base devicree can be modified for'
