  md: '# Interrupts and Exceptions


    The subject of interrupts and exceptions and how interrupts and exceptions are
    handled is complex, and here, only the key basic concepts and issues will be covered.


    An exception is an event that disrupts the normal execution of the processor and
    forces the processor into the execution of some specified special instructions
    in a privileged state.


    Exceptions may be either synchronous exceptions, generated as a result of the
    execution of some processor instructions (e.g., memory alignment exception, divide-by-zero
    exception), or asynchronous exceptions (normally called interrupts) that are raised
    by external events not directly related to the execution of processor instructions
    that are generally associated with hardware signals (e.g., processor reset, receipt
    of a packet by some network interface device).


    Exceptions provide a powerful communication mechanism between the hardware and
    an application running on the processor and are used in contexts such as the handling
    of internal errors and special conditions, dealing with hardware concurrency,
    and the handling of service requests.


    Special conditions are generated by the execution of special instructions such
    as when a task running at a user privilege level attempts to issue an instruction
    that can only be run at a privileged supervisor (kernel) level. These kinds of
    exceptions can be used to force the processor into a privileged level where it
    has access to the privileged instruction set.


    In Zephyr RTOS, it is possible to configure an application build into user code
    and privileged code and so prevent user code from calling various kernel functions
    and services directly. This is how Zephyr user applications can be implemented
    that need to issue some kind of call to access privileged services indirectly.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# CHAPTER 2 A REVIEW OF RTOS FUNDAMENTALS


    Exceptions can be split into two types, namely, asynchronous and synchronous.
    A synchronous exception arises at a chosen point in the execution of a task thread,
    whereas an asynchronous exception can occur at any time or place in the execution
    of a task thread. Asynchronous exceptions (interrupts) can be subdivided into
    maskable interrupts that can be blocked or enabled by software and nonmaskable
    interrupts that cannot be blocked by software and will always be acknowledged
    by the processor. A hardware reset exception, for example, is always nonmaskable.
    Synchronous exceptions can be subdivided into precise exceptions, where the processor''s
    program counter points exactly to the instruction that gave rise to the exception,
    and imprecise exceptions, where this is not the case. Imprecise exceptions may
    arise in processor architectures that make extensive use of pipelining, or pre-fetch
    algorithms.


    When an exception or external interrupt occurs (is raised), the processor will
    save the current state information of the processor and load address (entry point)
    of the function that is to handle that exception or interrupt and then transfer
    control to that function for it to execute. After the handler has completed its
    work, the processor state information that was saved is restored, and a return
    from the interrupt takes places. Returning from an interrupt can also be a point
    at which the scheduler can run and decide whether the task was interrupted can
    continue to run, or whether that task should be paused and a higher priority task
    be scheduled to run in its place.


    Best practice when implementing interrupt handling is that the interrupt handler
    does only the minimum amount of work needed to deal with the interrupt and then
    delegates the remaining work to some lower order priority task.


    This approach is commonly considered a best practice approach when it comes to
    implementing real-world interrupt handlers.'
