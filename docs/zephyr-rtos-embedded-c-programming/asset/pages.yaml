  md: '# BLE Application Development APIs Provided by Zephyr and the nRF Connect SDK


    The Zephyr set of BLE APIs is both large and extensive. Only the most essential
    APIs needed to get started with BLE application development will be covered here.
    The core, fundamental, Zephyr BLE APIs are the ATT, GAP, GATT, UUID, SDP (Service
    Discovery Protocol) API, and Logical Link Control and Adaptation Protocol (L2CAP)
    APIs.


    When developing Zephyr RTOS applications for Nordic nRF devices, it is common
    practice to use the nRF Connect SDK, which includes standard Zephyr as well as
    Nordic-specific libraries and source code files. A Bluetooth Low Energy (LE) application
    must include a Bluetooth LE Controller which implements the Link Layer, the low-level,
    real-time protocol that controls BLE communications.


    The nRF Connect SDK provides two implementations of a Bluetooth LE Controller:
    the SoftDevice Controller implemented by Nordic Semiconductor and the open source
    Zephyr Link Layer implementation. Both of these Link Layers integrate with the
    Zephyr Bluetooth Host firmware, which completes the full Bluetooth LE protocol
    stack solution in the nRF Connect SDK. In general, either Bluetooth LE Controller
    can be used for application development.


    The SoftDevice Controller was designed for nRF52 and nRF53 Series devices and
    is provided as a set of precompiled libraries conforming to the Bluetooth 5.2
    specification as well as some extensions for high-performance applications such
    as Low Latency Packet Mode (LLPM) operation.


    The Zephyr Bluetooth Low Energy stack includes a Zephyr Bluetooth LE Controller
    implemented in the form of an upper and a lower implementation suited to supporting
    multiple hardware platforms. To use Zephyr’s Bluetooth LE Controller in an application,
    it is necessary to include a Controller-only build of the Bluetooth LE stack.
    Zephyr’s Bluetooth LE Controller implementation supports most standard Bluetooth
    features.'
  merge: -1
