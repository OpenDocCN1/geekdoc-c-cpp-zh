    \ is to group related characteristics together in a way that defines the specific\
    \ functionality of a device.\n\n# Profiles\n\nProfiles have a broader scope than\
    \ services and are used to define various aspects of the behavior of both the\
    \ client and server. This covers things such as services, characteristics, connections,\
    \ and security requirements. This needs to be distinguished from pure server-side\
    \ definitions, which are concerned only with the implementation of the services\
    \ and characteristics on the server side.\n\nThere are various BLE SIG-adopted\
