    # Renode and Firmware Testing


    CI/CD makes extensive use of unit testing and version control. Automated firmware
    testing using real hardware is difficult because it relies on stable firmware
    code on top of which to build the test code as well as hardware such as code flashing
    tools and power supplies, and in addition providing code that will orchestrate
    the tests and collect the test data. The renode-test command can be used to run
    test scripts. The Robot framework provides many testing scripts that can either
    be used as or extended (modified). Where necessary, custom testing scripts can
    be implemented. By combining Renode with GitHub actions, it is possible to ensure
    that pull requests and commits to the project repository pass the necessary tests.
    Although quite a steep learning process is involved, this approach is very powerful
    for developing complex IoT systems and for developing and testing code before
    the target hardware is available.


    # Building Machines in Renode


    At a conceptual level, a machine can be thought of as a system bus to which a
    processor core and various (memory-mapped) peripherals can be attached. Renode
    provides a language for building machines and extending existing Renode provided
    machines.'
