  md: '![](img/d625a3dc80e999570aa2c88dcc398b17_389_0.png)


    # Figure 8-3. Network Device Drivers


    A Zephyr network application can use the application-level protocol libraries
    provided by Zephyr. Alternatively networking applications can be developed that
    make use of Zephyr''s implementation of the BSD Sockets API directly. Zephyr also
    provides a Network Management API that can be used to configure the network and
    setting networking parameters such as network link options, starting a scan (when
    applicable), listen for network configuration events, and more. Zephyr''s network
    interface API can be used to perform actions such as assigning an IP address to
    a network interface, taking a network interface down, and more.


    Application layer protocols supported by Zephyr include CoAP, LwM2M, and MQTT.


    TCP/IP layer 3 and layer 4 protocols supported by Zephyr include IPv6, IPv4, UDP,
    TCP, ICMPv4, and ICMPv6, and these protocols are accessed via the BSD Sockets
    API.


    Layer 2 (Link) Network Technologies supported in Zephyr include Ethernet, IEEE
    802.15.4, Bluetooth, and CAN bus.


    The low-level device drivers are responsible for the physical layer sending and
    receiving of network packets.


    Common practice when implementing Zephyr networking applications is to run the
    application code in userspace context and the network stack code in kernel context.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    The Zephyr Network Interface Abstraction layer plays an important role in providing
    a common API functionality for network interfaces, especially the ability to set
    network interfaces up or down. Data transfers for sent and received data place
    via a network interface. In Zephyr, network interfaces cannot be created at runtime.
    A special linker containing information about network interfaces is created as
    part of the build process and populated them at linking time. Network interfaces
    are created by the use of the NET_DEVICE_INIT() macro or a more specialized variant.
    In the case of an Ethernet network, the ETH_NET_DEVICE_INIT() macro should be
    used as it will create VLAN interfaces automatically if CONFIG_NET_VLAN is enabled.
    Network initialization macros are mostly used in device driver implementation.


    A network interface can be turned ON by calling net_if_up() and OFF by calling
    net_if_down(). In Zephyr, the default behavior is that when a networking device
    is powered ON, the network interface is also turned ON. Network interfaces can
    be referenced via a struct net_if* pointer or via a network interface index. A
    network interface can be resolved from its index by calling net_if_get_by_index()
    and from an interface pointer by calling net_if_get_by_iface().


    For IP networks, the IP address for a network device must be set correctly. IP
    addresses can be set automatically via DHCP4 or manually by using an API function
    such as net_if_ipv4_addr_add().


    The Zephyr networking framework provides a mechanism for prioritizing classes
    of packets. The intention is to enable higher priority packets to be sent or received
    earlier than lower priority packets. To include support for packet prioritization,
    Zephyr provides the CONFIG_NET_TC_TX_COUNT and CONFIG_NET_TC_RX_COUNT options.


    CONFIG_NET_TC_TX_COUNT is used to define the number of Tx (transmit) traffic classes
    a network device can have, and CONFIG_NET_TC_RX_COUNT is used to define the number
    of Rx (receive) traffic classes a network device can have.'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'A network packet priority can then be mapped to the traffic class so that higher
    prioritized packets can be processed before lower prioritized ones. This involves
    a queue for each priority with the handling for each queue handled by a separate
    thread, and a higher traffic class value corresponds to a lower priority value.
    In the case of transmission classes, the number of classes is 0, transmission
    network traffic is pushed to the driver directly without any queues. In the case
    of receive classes, a count of 0 means that all the network traffic will be pushed
    from the driver to the application without any intermediate RX queue. There is
    a receive socket queue between the device driver and the application. Disabling
    the RX thread has the effect that the network device driver, typically running
    in IRQ context, will handle the packet all the way to the application. A consequence
    of this handling is that other packets may be lost if RX processing is time consuming,
    relative to the packet arrival rate.


    Where USERSPACE is enabled, in the current implementation, at least 1 TX thread
    and 1 RX thread need to be enabled.


    Zephyr can be used to configure promiscuous mode for network technologies as Ethernet
    when this is applicable. If the CONFIG_NET_PROMISCUOUS_MODE is enabled, then all
    the network packets that the network device driver is able to receive will be
    accepted. If promiscuous mode is not configured, then only packets destined for
    the MAC address of the Ethernet device will be accepted. In general, promiscuous
    mode is used when monitoring all traffic. It is not something would normally be
    configured on an embedded system with limited memory and processing resources.


    # Zephyr and Network Management


    The RFC 2863 standard is concerned with that part of the Management Information
    Base (MIB) concerned with managed objects used for managing network interfaces.
    It identifies Zephyr’s two interface'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    states, namely, the administrative state and the operational state. The administrative
    state indicates whether an interface is turned ON or OFF. In Zephyr, it is represented
    by NET_IF_UP flag, which is controlled by the application. Its value can be changed
    by calling the net_if_up() or net_if_down() function. Just because an interface
    is up does not mean that it is ready to transmit or receive packets. The operational
    state represents the internal interface status. It is updated whenever an interface
    is brought up by the application (administrative state changes), or the interface
    is notified by the driver/L2 that the PHY (layer 1) status has changed, or the
    interface is notified by the driver/L2 that it joined/left a network.


    The PHY status is represented with NET_IF_LOWER_UP flag and can be changed by
    the functions net_if_carrier_on() and net_if_carrier_off(). By default, this flag
    is set for a newly initialized interface. In the case of Ethernet, for example,
    the carrier state will be changed when an Ethernet is connected or disconnected.


    The network association status is represented with NET_IF_DORMANT flag and can
    be changed with net_if_dormant_on() and net_if_dormant_off(). In the case of Wi-Fi,
    the dormant state is changed when the dormant state to ON during initialization,
    and when it detects a connection to a Wi-Fi network has been established, the
    dormant state is set to OFF.


    The Zephyr network API provides a number of functions for testing the status of
    an interface such as net_if_is_admin_up(), net_if_carrier_ok(), and net_if_is_dormant.


    Zephyr networking support is quite comprehensive, and the list of available application
    APIs includes many of the protocols that are used in IoT applications, such as


    +   - CoAP

    - CoAP client

    - HTTP client'
