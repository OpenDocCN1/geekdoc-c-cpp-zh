    # Details View


    The Details View provides detailed detailed access to the application project
    contents. It comes after the Applications View and relates to the currently selected
    application. Its three main sections (views) relate to the source files, input
    files, and output files. The source files section lists the source files used
    by the application, the input files section lists the CMake and devicetree configuration
    files, and the output files generated by the build process (see Figure 3-19).
