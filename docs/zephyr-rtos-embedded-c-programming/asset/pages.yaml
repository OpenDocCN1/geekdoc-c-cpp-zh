  md: '# Renode Scripts


    Renode is a scripting language.


    +   - The simplest scripts are one-line Renode commands.

    - Scripts can be constructed by combining commands.

    - Scripts, in turn, can include both commands and other scripts.


    Renode scripts are concerned with creating and running emulations of a single
    emulated (guest) platform or a networked collection of platforms.


    Renode commands can be used to interact with the external interfaces (peripherals)
    of the emulated machines as UARTs or Ethernet controllers.


    When running Renode interactively, the user would normally start with creating
    the emulation through a sequence of commands building up, configuring, and connecting
    the relevant emulated (guest) platform or platforms (called “machines”).


    This is normally done using nested .resc scripts, which help encapsulate some
    of the repeatable elements in this activity (normally, the user will want to create
    the same platform over and over again in runs, or even script the execution entirely).


    When the emulation is created and all the necessary elements (including, e.g.,
    binaries to be executed) are loaded, the emulation itself can be started – to
    do this, the start command is entered in the Monitor.


    At this point, it is possible to see a lot of information about the operation
    of the emulated environment in the log window, extract additional information,
    and manipulate the running emulation using the Monitor (or plug-ins such as Wireshark)
    – as well as interact with the external interfaces of the emulated machines like
    UARTs or Ethernet controllers.


    Renode scripts can be saved in files, which, typically, have a .resc extension.'
  merge: -1
