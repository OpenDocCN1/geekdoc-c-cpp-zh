    # Message Queueing and Message Queues


    The purpose of a message queue is to provide a mechanism that can be used by tasks
    as well ISRs to communicate and synchronize while at the same time conveying data.
    The mechanism involves the use of a buffer-like object – a pipeline that, temporarily,
    holds messages from a sender(s) till the target receiver is able to read them.
    A beneficial effect of this approach is that it decouples the sending and receiving
    tasks. When a message queue is created, then, typically, an associated Queue Control
    Block (QCB), a message queue name, a unique ID, and a memory buffer(s) are assigned
    to it. The amount of memory allocated will depend on factors such as queue length
    and maximum message length.


    Blocking is built into the message queue in the sense that the sending task blocks
    when the message queue is full, and a reading task blocks when the message queue
    is empty.


    The schematicatic illustrated in Figure 2-8 shows the typical parameters and data
    structure illustrated with a message queue.'
