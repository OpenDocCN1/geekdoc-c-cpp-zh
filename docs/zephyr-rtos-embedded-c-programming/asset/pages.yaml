  md: '# BLE Security


    BLE security is handled by the Security Manager (SM) layer of the architecture.


    The Security Manager defines the protocols and algorithms for generating and exchanging
    keys between two devices and involves mechanisms for pairing, which is the process
    of creating shared secret keys between two devices; bonding, which is the process
    of creating and storing shared secret keys on each side (central and peripheral)
    for use in subsequent connections between the devices; authentication, which is
    the process of verifying that the two devices share the same secret keys; encryption,
    which is the process of encrypting the data exchanged between the devices; and,
    finally, message integrity, which is the process of signing the data sent and
    verifying the signature at the receiving end.


    These steps are illustrated in the sequence diagram shown in Figure 7-8.'
  merge: -1
