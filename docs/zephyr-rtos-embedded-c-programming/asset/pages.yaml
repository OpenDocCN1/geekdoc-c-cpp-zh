    # # Unit Addresses and the Devicetree


    Understanding and working with unit addresses is the key to the successful use
    of devicrees. Unit addresses are those parts of node names after an “at” sign
    (@), such as 40003000 in i2c@40003000, or 39 in apds9960@39.


    Unit addresses are optional; for example, the soc in the devicetree example shown
    previously, there is no unit address associated with the SoC node. Technically,
    in a devicetree, the unit address is the address of a node in the address space
    of the parent node of that node. A unit address must be appropriate for the hardware
    type of the component that is associated with that node.


    In the case of a memory-mapped peripheral, the unit address is the register map
    base address of the peripheral. For example, in the case of a node named i2c@40003000,
    the name represents an I2C controller whose register map base address is 0x40003000.
    In the case of an I2C peripheral, the address is the address of the peripheral
    on the I2C bus.


    Thus, for a child node apds9960@39 of the I2C controller, the address being referred
    to is an I2C bus address. For an SPI peripheral, the address would be an index
    representing the chip select line number for particular peripheral. (If there
    is no chip select line, 0 is used.) When referring to memory, the address is the
    start address of a physical block of memory. For example, in the case of a node
    named memory@2000000, the address represents RAM starting at the physical address
    0x20000000.


    Memory, such as flash memory, for example, can be partitioned. The devicetree
    snippet shown in Figure 9-7 demonstrates how partitions are handled in a devicetree
    [4].'
