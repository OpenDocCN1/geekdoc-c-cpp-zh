    devicetree processing. They include dtlib.py, a low-level DTS library; edtlib.py,
    a library layered on top of dtlib that uses bindings to interpret properties and
    provide a higher-level view of the devicetree; and gen_defines.py, which uses
    dtlib to generate C preprocessor macros from the devicetree. The standard dtc
    (devicetree compiler) tool, if installed, can be run on the final devicetree to
    catch errors or warnings.


    The output files generated from devicetree processing during a Zephyr application
    build are created in the application''s build directory. These include header
    files that are not intended to be used directly but, rather, to be accessed from
    C/C++. The header files are in devicetree_unfixed.h and device_fixups.h, which
    are included via #include statements at the start of devicetree.h. devicetree.h
    is part of the Zephyr distribution source code and can be found at zephyr/include/zephyr/devicetree.h.


    From the previous overview, it can be seen that devicetree construction and building
    as part of the Zephyr application build process is quite complex and involves
    the use of some “powerful and nontrivial” Python scripts. In the “great scheme
    of things,” the advantages of this approach are that it makes for flexibility,
    API consistency, code reuse, and portability.


    # Devicetree Bindings


    Devicetree bindings provide more detailed hardware descriptions by declaring requirements
    that the contents of a node must satisfy and also semantic information about the
    contents of a node. During the configuration phase of the build process, the build
    system attempts to match each node in the devicetree to a binding file. The information
    in the binding file is used to validate the contents of a node and also in the
    process of generating macros for working with that node in an application.'
