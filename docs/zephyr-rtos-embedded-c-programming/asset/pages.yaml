    # Message Queue Example


    This example involves a scenario where pressing one button triggers the writing
    of a message to a message queue and pressing a different button triggers the retrieval
    of a message from that message queue.


    The messages contain information used by the recipient of the message.


    A message data item contains two fields: one identifying the LED to flash and
    the other specifying the number of times that LED is to be flashed. The flash
    period in this example is set to a constant value, 200 msecs in this case. The
    message items are selected at random from a collection of possible messages that
    are generated during startup. The thread that retrieves a message item will not
    only flash the target LED for the specified number of times but will also set
    a busy flag while it is executing a flashing sequence.'
