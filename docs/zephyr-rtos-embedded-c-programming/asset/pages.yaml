  md: '# Building an nRF52840 DK Application and Running It in Renode


    The “dining philosophers” example is a widely used scenario to demonstrate multithreading
    and the “possibility of deadlock” occurring.


    It is one of the examples used in testing target boards and their Renode emulations.
    When the example is run in Renode, the results are displayed in the Renode boards
    dashboard.


    The dining philosophers example can be run in Renode by entering the appropriate
    monitor command manually. Later these commands can be collected together as a
    Renode script.


    The first step is to build the dining philosophers demo for a particular target
    board using the Zephyr west tool, for example:


    ```

    west build -b nrf52840dk_nrf52840 -p=auto --force -d \ dining_philosophers_demo
    ./zephyr/samples/philosophers

    ```


    The west tool creates a build directory in which the project is built. If all
    goes well, it will contain a zephyr subid in which the compiled application, called
    zephyr.elf, will be located.


    To run the application code in Renode, it is necessary to start renode and then,
    in the monitor window, invoke individual commands, or, alternatively, invoke a
    renode script file that contains multiple commands.


    In the directory containing renode, run the renode command, which brings up the
    renode monitor window.


    As commands are entered into the monitor window, output is written to the PowerShell
    window from which renode was started.'
  merge: -1
