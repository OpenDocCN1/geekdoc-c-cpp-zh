  md: '# Sending a Message


    The sequence of steps followed when sending a message is perfectly logical. To
    send a message, the sending thread creates (acquires) the data it wishes to send,
    if any. It creates a message descriptor characterizing the message to be sent.


    Finally, the sending thread invokes the mailbox send API to start the message
    exchange. In the case there is already a waiting thread, the message is passed
    to that thread straight away; otherwise, the message is added to the send queue
    of the mailbox.


    The mailbox send queue can contain multiple messages, and these are sorted according
    the priority of the sending thread. Messages of equal priority are sorted in the
    order from the oldest to the most recent so that the oldest message can be received
    first.


    In the case of a synchronous send operation, normal completion means that the
    receiving thread has received the message and has actually retrieved the message
    data. Where the message is not received before the timeout specified by the sending
    thread expires, the message is removed from the send queue of the mailbox, and
    the send operation is considered to have failed.


    When a send operation has completed successfully, the sending thread can find
    out which thread actually received the message by reading the rx_source_thread
    field of the message descriptor. Similarly, by reading the corresponding fields,
    it can find how much data was actually exchanged and also the application-defined
    info value supplied by the receiving thread.


    In synchronous transmission, once a message is received, there is no limit to
    the time the receiving thread may take to retrieve the message data and unlock
    the sending thread.


    Hence, it is possible that a synchronous send operation may block the sending
    thread indefinitely, even when the thread specifies a maximum waiting period.
    This is because the timeout period only limits the amount'
