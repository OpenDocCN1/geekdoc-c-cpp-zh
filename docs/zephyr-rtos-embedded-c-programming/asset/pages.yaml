    Zephyr applications use overlays for various purposes such as enabling a peripheral
    that is disabled by default or for selecting a sensor on a target board for some
    application-specific purpose. By using the devicetree together with KConfig, it
    is possible to reconfigure the kernel and the device without needing to modify
    the application source code. Overlays can also be used for setting up shields
    attached to development boards or kits.


    The Zephyr build system automatically picks up overlay files stored from certain
    defined locations. A list of overlays to include can also be specified explicitly
    via the DTC_OVERLAY_FILE CMake variable. The build system combines BOARD.dts and
    .overlay files by concatenating them. The overlays are added in last. This process
    makes use of the DTS syntax, which permits merging overlapping definitions of
    nodes in the devicetree.


    Devicetree bindings are YAML files. Their purpose is to describe the contents
    of devicetree sources, includes, and overlays that can be considered valid. Devicetree
    bindings are used by the build system to generate C macros that can be used in
    device driver and application code.


