  md: '# CHAPTER 9


    # Understanding and Working with the Devicetree in General and SPI and I2C in
    Particular


    When developing applications involving a custom board, or adding peripherals such
    as I2C or SPI peripherals to an existing board, an understanding of the Zephyr
    devicetree and how it is used in application development is required.


    The devicetree concept used in Zephyr has its origins in Linux, where the main
    purpose of the devicetree was to provide a means of describing nondiscoverable
    hardware, namely, hardware that is connected via nondiscoverable protocols as
    I2C, SPI, UART, and GPIO. The kernel, which controls the hardware, needs to know
    what the connected devices are and how to communicate with these attached devices.


    Prior to the introduction of the devicetree approach, information about such devices
    had to be hard-coded in the source code. The devicetree'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND SPI
    AND I2C IN PARTICULAR


    approach itself had its origins in the Sun Microsystems OpenBoot framework, which
    was, later, incorporated into the IEEE Firmware standard. In the context of the
    Zephyr application development, the devicetree framework provides a way to describe
    hardware in a format that can be made use by the Zephyr Device Driver model.


    Working with devicetrees makes the devicetree syntax as well as a devicetree schema
    syntax, which can be used for describing the structural and syntactic details
    of different types of device. There are also tools for parsing and processing
    devicetree information and tools for checking a particular devicetree section
    against a corresponding schema definition. In Zephyr, the devicetree associated
    with a project is built up by including various devicetree components, which are
    then processed to produce header files that are, turn, used in the creation of
    the device driver instances used in the application itself.


    # Firmware Development Aspects of Application Development


    Developing applications running on specialized and resource-constrained embedded
    systems requires, typically, a much deeper understanding of the underlying hardware
    than developing Windows, Linux, and Mac OS X applications running on PC or server
    machines.


    Firmware design issues that need to be considered include, for example, things
    such as deciding on the hardware that should be used to control a particular device,
    details of working with device drivers for the hardware devices involved, the
    implementation of the code required to support the hardware involved, and understanding
    how the hardware interacts with the application code.'
