    # Devicetree Configuration


    The aforementioned introduction to I2C and SPI devices should provide a sufficient
    background to be able to follow the I2C and SPI devicetree configuration and programming
    examples that will be introduced later in this chapter. First, however, it is
    necessary to acquire some familiarity with the devicetree syntax and how devicetrees
    are processed during a Zephyr application build.


    The whole point of devicetrees is to minimize the number of separate application
    code projects involving devices and boards in applications that are broadly similar
    but which differ in the details of the devices being used. A devicetree is, essentially,
    a hierarchical data structure that describes hardware.


    The devicetree specification defines both source and binary representations. In
    Zephyr projects, devicetrees are used to describe the hardware available on supported
    Boards, as well as the initial configuration of that hardware. Two types of devicetree
    input files are involved, namely, the devicetree sources, which contain the devicetree
    itself, and the devicetree bindings, which describe its contents, including data
    types.'
