  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    segments to the main network. Using this approach, a large Wi-Fi network can be
    deployed, for example, in an office or warehouse building.


    Once an nRF7002-based device has been assigned an IP address, it is possible to
    build regular TCP/IP applications and both client and server applications and
    run them on that device. In the following section, applications implementing relatively
    simple TCP and UDP clients and servers will be explored. The examples are based
    on the nRF Connect SDK sta (station) example and the BSD sockets programming case
    study from “abluethinginthecloud” (https://github.com/abluethinginthecloud/nrf7002-bsd-sockets-example).


    # Structured Exploration of the nRF Connect SDK Wi-Fi sta Example


    The Station example is located at v2.5.0/nrf/samples/wifi/sta in the nRF Connect
    SDK repository. It shows how to implement application code to connect the Wi-Fi
    station on the nRF7002 DK board to a specified access point using the Dynamic
    Host Configuration Protocol (DHCP) to configure IP addressing and TCP/IP.


    The example implements LED support to indicate connection and disconnection events.


    +   - Starts blinking when the sample is connected to the access point

    - Stops blinking when the sample is disconnected from the access point'
