  md: "# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND\nZEPHYR APPLICATION\
    \ BUILDING PRINCIPLES\n\nWindows, or macOS systems. Hence, part of the process\
    \ of learning Zephyr\nRTOS programming is to learn about the Zephyr RTOS device\
    \ driver model\nand its associated APIs. The Zephyr device driver modelling framework\n\
    h borrowed the devicetree language from Linux for specifying processor\nand board\
    \ configurations. However, the devicetree files are used in\nZephyr RTOS is quite\
    \ different from how they are used in Linux.\n\nAs already mentioned, application\
    \ configuration involves both\nKconfig and devicree aspects. As a rule of thumb,\
    \ the devicetree is used\nto describe the hardware and its boot-time configuration\
    \ such as the\nperipherals on a board, the boot-time frequencies, interrupt lines,\n\
    etc. Kconfig is used to configure what software support to build into\nthe final\
    \ image, for example, whether to add networking support, which\ndrivers are needed\
    \ by the application, and such.\n\nThe devicree syntax takes a certain amount\
    \ of effort and practice to\nmaster. For many projects, the devicetree details\
    \ do not have to be given in\nfull as the final devicetree can be built up from\
    \ processor and target board\ndevicetree files combined with project-specific\
    \ overlays. The devicetree\ntextual description is parsed and compiled as part\
    \ of the build process.\nThe, textual, devicetree syntax is illustrated in Figure\
    \ 3-21.\n\n```\n/dtts-v1/;\n(\n  a-node {\n    subnode_label: a-sub-node {\n \
    \     foo = <3>;\n    }\n  }\n);\n```\n\nFigure 3-21. Devicetree .dts file example"
  merge: -1
  pgno: 113
- img_proc: true
  md: "# CHAPTER 3 ZEPHY RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND\nZEPHY APPLICATION\
    \ BUILDING PRINCIPLES\n\nThe /ts-v1/; line means the file's contents are in version\
    \ 1 of the DTS syntax. The preceding tree has three nodes: a root node \"/\",\
    \ a node named a-node, which is a child of the root node, and a node named a-sub-node,\
    \ which is a child of a-node.\n\nNodes can have zero or labels. A label can be\
    \ thought of as a unique shorthand that can be used to refer to the labelled node\
    \ elsewhere in the devicetree. In the preceding code snippet, a-sub-node has a\
    \ label subnode_label. Devicree nodes have paths that identify their locations\
    \ in the tree. A devicetree path is a string separated by slashes (/). The root\
    \ node's path is a single slash \"/. In general, a node is formed by concatenating\
    \ the node's ancestors' names with the name of the node itself. For example, the\
    \ full path to a-sub-node is /a-node/a-sub-node.\n\nDevicetree nodes also have\
    \ properties, which are, quite simply, name/value pairs. A property value can\
    \ be any sequence of bytes. A property can be given as an array of cells, where\
    \ a cell is simply a 32-bit unsigned integer. In the preceding code snippet, the\
    \ node a-sub-node has a property named foo, whose value is a cell with value 3.\
    \ The size and type of foo's value are implied by the enclosing angle brackets\
    \ (< >) in the DTS. Most often, devicetree nodes correspond to some piece of hardware,\
    \ and the node hierarchy reflects the physical arrangement/layout of the hardware.\n\
    \nThe devicetree also provides aliases that can be used to reference other nodes\
    \ in the devicetree. It is possible to have collections of aliases. In the following\
    \ devicetree snippet, the /aliases node contains properties that are aliases,\
    \ in this case just a single alias. The name of the property is the name of that\
    \ alias, and the value of the property is a reference to a node in the devicree.\
    \ The & is analogous to C's address of operator.\n\n```\n/ {\n  aliases {\n  \
    \  subnode_alias = &subnode_label;\n  };\n};\n```"
  merge: -1
  pgno: 114
- img_proc: true
  md: "# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND nZEPHYR APPLICATION\
    \ BUILDING PRINCIPLES\n\nThe preceding code snippet snaps the node a-sub-node,\
    \ referenced by its label subnode_label as the alias subnode_alias.\n\nThe Zephyr\
    \ devicree build process generates a C header that contains the required devicetree\
    \ data abstract behind a C macro API framework. Information about a particular\
    \ devicetree node can be obtained via the corresponding C macro, which is referred\
    \ to as a node identifier for device. The two common macros used in practice DT_NODABEL(),\
    \ which is used to access a node via its label, and DT_ALIAS(), which is used\
    \ to access a node via an alias. An alias can be thought of as an abbreviation\
    \ of a full node label and can be used as an easier-to-remember label as opposed\
    \ to providing a full path. Using the preceding snippet, the node identifier of\
    \ the a-sub-node could be obtained via DT_NODABEL(subnode-label).\n\nThe DT_PROP()\
    \ macro can be used to retrieve the value assigned to a certain devicetree property.\
    \ For example, to get the value assigned to the foo property, the macro DT_PROP(DT_NODABEL(subnode-label),\
    \ foo) could be used.\n\nA specific devicetree node is referenced by the full\
    \ path to name in the devicetree, for example, /external-bus/ethernet@0,0. Where\
    \ a user wishes to obtain an answer to a question such as “which device is eth0?”\
    \ having to provide a full path may involve time spent searching through the shorter\
    \ devicetree. An aliases node can be thought of as providing a shorter user and\
    \ application-friendly aliases for the full path, for example:\n\n```\naliases\
    \ {\n    ether0 = &eth0;\n    serial0 = &serial0;\n}\n```"
  merge: -1
  pgno: 115
- img_proc: true
  md: "# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND\nZEPHYR APPLICATION\
    \ BUILDING PRINCIPLES\n\nWriting a Zephyr application may involve getting a driver-level\
    \ struct device corresponding to a particular devicetree. The following example,\
    \ based on the Zephyr documentation, illustrates how this can be done in application\
    \ code. It is based on the following example devicetree fragment pertaining to\
    \ a serial device serial@40002000:\n\n```\n/ { \nsoc {\n  serial0: serial@40002000\
    \ {\n    status = \"okay\";\n    current-speed = <115200>;\n    /* ... */\n  }\n\
    aliases {\n    my-serial = &serial0;\n  }\nchoesen {\n  zephyr,console = &serial0;\n\
    }\n}\n```\n\nThe /chosen node is a special node that contains properties that\
    \ have values describing system-wide settings, and the DT_CHOSEN() macro can be\
    \ used to get the node identifier for a chosen node.\n\nDevicetree nodes can be\
    \ referenced using the ampersand (&) character and the label.\n\nTo overwrite\
    \ a property, the node has to be referenced using the ampersand character and\
    \ the label. Devicetree entries occurring later in the devicetree overwrite earlier\
    \ entries (the sequence order is important)."
  merge: -1
  pgno: 116
- img_proc: true
  md: "# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND ZEPHYR APPLICATION\
    \ BUILDING PRINCIPLES\n\nTo obtain a device-level struct, it is necessary to provide\
    \ the correct node identifier. The Zephyr framework provides a number of convenience\
    \ macros for this purpose, which include the following:\n\n+   - A macro that\
    \ uses a label, for example, #define MY_SERIAL DT_NODELABEL(serial0)\n- A macro\
    \ that uses an alias, for example, #define MY_SERIAL DT_ALIAS(my_serial)\n- A\
    \ macro that uses a path, for example, #define MY_SERIAL DT_PATH(soc, serial_40002000)\n\
    \nThe Zephyr framework provides various macros that can be given a node identifier\
    \ and expand to code that returns a pointer to the corresponding struct device,\
    \ for example:\n\n```\nconst struct device *uart_dev = DEVICE_DT_GET(MY_SERIAL);\n\
    if (!device_is_ready(uart_dev)) {\n    /* Not ready, do not use */\n    return\
    \ -ENODEV;\n}\n```\n\nOther variants of DEVICE_DT_GET() are DEVICE_DT_GET_OR_NULL(),\
    \ DEVICE_DT_GET_ONE() or DEVICE_DT_GET_ANY()\n\nIn the interests of portability,\
    \ Zephyr tries to work with generic driver models as much as possible. In the\
    \ nRF Connect SDK, as in the Zephyr SDK, the driver implementation is decoupled\
    \ from its API to make it possible to switch out one low-level driver implementation\
    \ and replace it with another without having to modify the application code that\
    \ uses the same generic API in both cases."
  merge: -1
