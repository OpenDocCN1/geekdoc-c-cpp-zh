    static bool is_mac_addr_set(struct net_if *if) {

    struct net_linkaddr *linkaddr = net_if_get_link_addr(iface);

    struct net_eth_addr wifi_addr;

    if (!linkaddr || linkaddr->len != WIFI_MAC_ADDR_LEN) {

    return false;

    }

    memcmpy(wifi_addr.addr, linkaddr->addr, WIFI_MAC_ADDR_LEN);

    return net_eth_is_addr_valid(&wifi_addr);

