    # Including yaml Binding Files


    Commonly needed property definitions bindings can be shared by including other
    files by using the include: key whose value is either a string or a list. For
    example, include: foo.yaml will result in any file named foo.yaml that is found
    being included into the binding. Included files are merged into a binding file
    by means of a recursive dictionary merge. The build system will check that the
    resulting merged binding is well formed. With one exception, it is an error if
    a key appears with a different value in a binding and in a file that has bindings.
    That exception is where a binding has a required: true for a property definition
    and the included file has a required: false. In this particular case, the required:
    true will take precedence. This illustrates how a binding can strengthen requirements
    from included files. A pattern based on strengthening is where a file base.yaml,
    for example, contains definitions for many common properties and a strengthening
    merge is used to make a property defined in base.yaml obligatory.


    The converse, the weakening of requirements, is a pattern where the binding has
    required: false and where the included file has required: true. This is not allowed
    and will result in an error.'
