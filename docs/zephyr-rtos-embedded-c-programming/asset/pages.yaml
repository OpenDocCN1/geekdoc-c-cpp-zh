  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    Management request codes are defined in relevant places depending on the layer
    being focused on. At layer L2, part of the focus will be on the technology being
    used. As an example IP layer, management request code will be declared in the
    include/zephyr/net/net_event.h header, whereas for Ethernet (L2 technology), it
    will be declared in include/zephyr/net/ethernet.h.


    The signature for a handler function will take the form


    ```

    static int some_handler(uint32_t mgmt_event, struct net_if

    *iface, void *data, size_t len);

    ```


    This handler would be registered with an associated mgmt_request\code according
    to the following pattern:


    ```

    NET_MGMT_REGISTER_REQUEST_HANDLER(<mgmt_request code>, your_

    handler);

    ```


    and, then, the new management procedure could be called as

    net_mgmt(<mgmt_request code>, ...);


    # Signalling a Network Event


    A specific network event is signalled using the net_mgmt_event_notify()

    function and providing it with the network event code. Event code can also

    found on specific L2 technology mgmt headers, for example, in include/

    zephyr/net/ieee802154_mgmt.h listening on events at 802.15.4 L2.


    The function pointer net_mgmt_request_handler is defined as

    follows:


    ```

    typedef int (*net_mgmt_request_handler_t)(uint32_t mgmt_

    request, struct net_if *iface, void *data, size_t len);

    ```'
