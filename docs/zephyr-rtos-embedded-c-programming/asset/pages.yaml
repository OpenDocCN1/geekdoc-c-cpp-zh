    errno are dependent on the file system backend. A file is closed using fs_close(struct
    fs_file_t *zfp) and unlinked/deleted using fs_unlink(const char *path).


    Files and directories can be renamed using fs_rename(const char *from, const char
    *to).


    The source path (from) can refer to either a file or a directory. All intermediate
    directories in the destination path must already exist. If the source path, not
    just the new parent directory. Where an object refers to a file, the destination
    path must contain a full name path, not already exists at the specified destination
    path, it will be unlinked prior to the renaming operation taking effect (i.e.,
    the preexisting file at the destination location is deleted). In Zephyr RTOS (currently),
