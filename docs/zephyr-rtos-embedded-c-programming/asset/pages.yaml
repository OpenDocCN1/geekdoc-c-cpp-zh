    The kinds of synchronization that arise in real-world applications are resource
    synchronization, activity synchronization, barrier synchronization, and rendezvous
    synchronization. Resource synchronization is concerned with safe access to some
    shared resource(s) and makes use of synchronization primitives such as mutexes
    and semaphores in the implementation of mutual exclusion algorithms. Activity
    synchronization is concerned with situations in multithreaded/multitasking applications
