  pgno: 215
- img_proc: true
  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    constraints. In the case of an MMU-based system, a partition has to be aligned
    to a page boundary, and its size is a multiple of the page size. Overlap between
    partitions in a given memory domain is not permitted. A given partition may be
    specified in more than one memory domain, for example, in the case of a shared
    memory area that multiple domains grant access to. For safety and security reasons,
    user mode access should not be allowed to memory containing private kernel data.


    In Zephyr, memory partitions can be defined in one of ways: manually or automatically.


    Defining a memory partition manually, typically, involves declaring a global memory
    array, declaring a memory partition with appropriate read/write permissions, and
    then adding the declared array to the specified partition, for example:


    ```

    uint8_t __aligned(32) buf[32];

    _MEM_PARTITION_DEFINE(my_partition, buf, sizeof(buf), K_MEM_PARTITION_P_RW_U_RW);

    ```


    A downside of manually defining memory partitions is that such an approach will
    not scale well to situations assigning multiple objects scattered over multiple
    C files into a common partition. In the case of automatic memory partition creation,
    the globals to be placed inside a partition are tagged with a destination partition.
    The Zephyr system will coalesce them into the corresponding contiguous block of
    memory, zero any BSS variables at boot time, and define a memory partition of
    appropriate base address and size, which will contain all of the tagged data.


    This is handled by the Zephyr gen_app_partitions.py script, one of a number of
    Python scripts used in the west-driven application build process (see Figure 4-11).'
