    # Zephyr Mailbox


    A mailbox is a kernel object that extends the capabilities of a message queue
    object. A mailbox can be used by threads to send and receive messages of any size
    synchroniously or asynchronously, and the number of mailboxes that have been sent
    but not yet received and a receive queue of messages is referenced by its memory
    address and has a send queue of threads that are waiting to receive a message.
    Before starting to use a mailbox, it must be initialized, both of its queues to
    empty. Because mailboxes are designed for message exchange between threads, ISRs
    (interrupt service routines) cannot use mailboxes to exchange messages, as an
    ISR is not associated with any thread.


    The use case pattern for mailboxes involves a sending thread a message and a receiving
    thread receiving the message. A message may be received by only one thread because
    the Zephyr implementation does not support point-to-multipoint (multicast) and
    broadcast messaging. Furthermore, the messages exchanged using a mailbox are handled
    non-anonymously. The threads participating in an exchange know the identity'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# CHAPTER 5 MESSAGE QUEUES, PIPES, MAILBOXES, AND WORKQUEUES


    of the other thread. In fact, a thread can even specify the identity of the thread
    whose mail messages it is interested in. This feature can be used, for example,
    in implementing a managing and monitoring thread that controls several managed
    threads on the basis of information received from these threads. Where there is
    a requirement to synchronize multiple tasks, use be made of Zephyr Events. An
    event can be used to indicate that some set of conditions has occurred and can
    notify multiple threads. Where only small amounts of data are involved, an event
    provides a way of passing small amounts of data to several threads concurrently.


    # Mailbox Message Format


    A mailbox message is associated with a message descriptor, a data structure, which
    specifies the starting address of the message data and how the message is to be
    handled by the mailbox. The mailbox sending thread and the mailbox message receiving
    thread need to provide a message descriptor when accessing a mailbox. The message
    descriptor fields are modified (updated) by the mailbox so that the sending thread
    and receiving thread can track the message exchange. During message exchange,
    message descriptor fields are modified (updated) by the mailbox The mailbox message
    itself can contain zero or more bytes of message data. The application defines
    the size and format of the mail messages that are to be exchanged, and these can
    vary from message to message. Sending and receiving threads must supply a message
    buffer memory for holding messages.


    A message that has no buffer associated with it and, hence, no bytes of data is
    an empty message. A message that has a message buffer associated with it and where
    there is no data in that message buffer is not an empty message in Zephyr mailbox
    parlance.'
