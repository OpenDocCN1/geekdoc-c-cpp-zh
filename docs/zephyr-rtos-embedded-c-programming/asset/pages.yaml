    # # Uses of BLE


    BLE can be used for applications such as controlling actuators over a low bandwidth
    connection, for personal and wearable devices often in combination with a BLE-capable
    smartphone (cell phone), which can provide a graphical user interface and relay
    data from a smart BLE sensor to the cloud. Another use is in the deployment of
    broadcast-only beacon devices, which broadcast data that can be discovered and
    read by other devices.


    # # BLE Architecture


    Like most networking protocols, BLE has a layered architecture. This is illustrated
    in Figure 7-2, which shows the various layers and sublayers of BLE.'
  merge: -1
