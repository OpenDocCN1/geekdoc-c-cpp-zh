  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    This is shown schematically in the diagram in Figure 6-3. In this diagram the
    top line (trace) is the clock cycle. For dual mode to work, it has to be supported
    on both the microcontroller and the flash chip.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_286_0.png)


    **Figure 6-3.** QSPI double data rate mode


    Modern flash chips are, typically, both SPI and QSPI pin compatible. The advantages
    of using Quad-SPI are that it involves a smaller pin count than solutions using
    a parallel memory bus and that it is possible to link multiple devices to a single
    QSPI interface, with a chip select pin being used to select a particular device.


    The details of QSPI on a particular processor are manufacturer dependent and may
    include features as DMA (Direct Memory Access) support. The low-level chip-specific
    driver code is accessed via suitable HAL (Hardware Abstraction Layer) code provided
    by the chip vendor.


    The next two sections will overview QSPI support in example Nordic Semiconductor
    and STM32 devices.


    The QSPI peripheral in the nRF52840 processor is a versatile device that supports
    single/dual/quad QSPI input/output, has a clock frequency configurable in the
    range 2–32 MHz, supports single-word


