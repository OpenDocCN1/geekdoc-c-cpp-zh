- img_proc: true
  md: '# Discovering an Access Point


    Scanning for nearby access points can use either a passive or an active approach.


    In an active approach, the seeking device tunes its radio to each supported channel
    in turn, transmits a Probe Request frame, and waits for about 20–40 ms to collect
    Probe Response frames from APs on that channel and moves on to the next channel.


    In a passive scan, the seeking device tunes to each channel in turn and waits
    for the duration of a typical Beacon Interval (about 100 ms) to collect Beacons.
    Passive scanning is slower than active scanning.


    # Authentication and Association


    The three 802.11 connection states are as follows:


    +   * Not authenticated or associated

    * Authenticated but not yet associated

    * Authenticated and associated


    For bridging to take place, a mobile station must be in an authenticated and associated
    state. Authentication involves the mobile station and the AP exchanging a series
    of 802.11 management frames.


    The sequence of exchanges is shown in the following schematic:'
  merge: -1
  pgno: 592
- img_proc: true
  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    ![](img/d625a3dc80e999570aa2c88dcc398b17_593_0.png)


    Figure 12-1. Authentication and Association Sequence Diagram


    +   1. A mobile station sends probe requests to discover 802.11 networks within
    its vicinity. Probe requests advertise the mobile station''s supported data rates
    and 802.11ac. Because the probe request is sent from the mobile station to the
    destination layer 2 address with a BSSID (48-bit MAC address of an access point''s
    radio card) of ff:ff:ff:ff:ff, all APs that receive it will respond.


    582'
  merge: -1
  pgno: 593
- img_proc: true
  md: '2. APs receiving the probe request check to see if the mobile station has at
    least one common supported data rate. If this is found to be the case, a probe
    response is sent advertising the SSID (wireless network name), supported data
    rates, encryption types if required, and also other 802.11 capabilities of the
    AP.


    A mobile station chooses compatible networks from the probe responses it receives.
    Compatibility may take encryption type into account. When a compatible to connect
    to has been discovered, the mobile station will attempt low-level 802.11 authentication
    with the compatible AP. Initial 802.11 authentication uses authentication frames
    that are open and should, almost, always succeed.


    3. The mobile station sends a low-level 802.11 authentication frame to an AP,
    setting the authentication to open and the sequence to 0x0001.


    4. The AP receives the authentication frame and responds to the mobile station
    with an authentication frame set to open indicating a sequence of 0x0002.


    If an AP receives any frame other than an authentication or probe request from
    a mobile station that is not authenticated, it will respond with a deauthentication
    frame placing the mobile into an unauthenticated and unassociated state. The station
    will have to begin the association process from the low-level authentication step
    again. At this point, the mobile station is authenticated but not yet associated.'
  merge: -1
  pgno: 594
- img_proc: true
  md: 'Some 802.11 capabilities allow a mobile station to low-level authenticate to
    multiple APs, which can speed up the association process when moving between APs.
    Although a mobile station may be 802.11 authenticated to multiple APs, it can
    only be actively associated and transferring data through a single AP at a time.


    +   5. Once a mobile station determines which AP it would like to associate to,
    it will send an association request to that AP. The association request contains
    chosen encryption types if required and other compatible 802.11 capabilities.


    Once an AP receives a frame from a mobile station that is authenticated but not
    yet associated, it responds with a disassociation frame placing the mobile into
    an authenticated but unassociated state.


    +   6. If the elements in the association request match the capabilities of the
    AP, the AP will create an Association ID for the mobile station and respond with
    an association response success message granting network access to the mobile
    station.


    +   7. Now the mobile station is successfully associated to the AP, and data transfer
    can begin.


    Where WPA/WPA2/WPA3 or 802.1X authentication is required on the wireless network,
    the mobile station will not be able to send data until dynamic keying and authentication
    have taken place after the 802.11 Association is complete.'
