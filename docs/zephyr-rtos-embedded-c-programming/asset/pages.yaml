    # Multithreading in Zephyr


    A key service provided by Zephyr is multithreading. Small 32-bit SoC devices such
    as ARM Cortex M processor or RISC-V32 devices do not have an MMU (Memory Management
    Unit), and virtualization is not used in applications building such devices. A
    few processors will incorporate an MPU (Memory Protection Unit), which can be
    used to isolate threads from one another, and Zephyr is designed to accommodate
    devices having an MPU. An MPU can be used to prevent threads accessing certain
    areas of memory that may contain privileged data and code. This can be important
    when, for security reasons, it is necessary to isolate certain pieces of code
    from others. MPUs such as those found in ARM Cortex M33 processors make trusted
    execution environments possible.


