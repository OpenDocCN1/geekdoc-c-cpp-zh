  md: 'CHAPTER 7  DEVELOPING ZEPHYR BLE APPLICATIONS


    # # BLE Link Layer Addressing


    A BLE device is identified by a unique 48-bit (6-byte) address. There are two
    types of device address, public and random, and one or both can be set on a device.
    A Public Device Address is the standard, IEEE-48-bit universal MAC address that
    must be obtained from the IEEE Registration Authority. It is divided into two
    fields, namely, an IEEE-assigned company ID, held in the 24 most-significant bits,
    and a Company-assigned device ID, held in the 24 least-significant bits. A Random
    Device Address does not require registration with the IEEE and is programmed on
    the device or generated at runtime. There are two kinds (types) of BLE Random
    Address, static and private. A random static address is used in place of a Public
    address. It can be generated at bootstrap or stay the same during the lifetime
    of the device. If generated at boot time, it cannot change until a power cycle
    occurs.


    There are two private address subsets: resolvable and nonresolvable. Nonresolvable
    private addresses, which are not widely used in practice, are temporary addresses
    with a certain duration. Resolvable private addresses are used for privacy and
    are generated using an Identity Resolving Key (IRK) and a random number. Resolvable
    private addresses change periodically (even during the lifetime of the connection).
    They are used to avoid being tracked by unknown scanners. However, trusted devices
    can resolve a resolvable private address using a previously stored IRK.


    # # BLE Packet Types


    The (BLE) link layer defines a single packet format that is used for both advertising
    channel packets and data channel packets. It is structured as illustrated in the
    schematic featured in Figure 7-6 [4].'
