    Nordic nRF processors support a Nordic-specific form of DMA (Direct Memory Access)
    called EasyDMA. An SPI master with EasyDMA is a nordic nrf_spi device. This device
    is an SPI bus. The base properties in the previous table are those of SPI devices.
    The table that follows summarizes the node-specific properties for Nordic nRF
    family SPIM (SPI master with EasyDMA) nodes.


    | Name | Type | Details |

    | --- | --- | --- |

    | miso-pull-up | boolean | Enable pull-up on MISO line |

    | miso-pull-down | boolean | Enable pull-down on MISO line |

    | anomaly-58-workaround | boolean | Enables the workaround for the nRF52832 SoC
    SPIM PAN 58 anomaly. Must be used in conjunction with CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=
    |

    | rx-delay-supported | boolean | Indicates if the SPI instance has the capability
    of delaying MISO sampling. This property needs to be defined at SoC level DTS
    files. |

    | rx-delay | int | Number of 64 MHz clock cycles (15.625 ns) delay from the sampling
    edge (leading or trailing, depending on the CPHA setting) until the input serial
    data on MISO is actually sampled. This property does not have any effect if the
    rx-delay-supported property is not set. Legal values: 0, 1, 2, 3, 4, 5, 6, 7 |

    | max-frequency | int | Maximum data rate the SPI peripheral can be driven, in
    Hz. This property must be set at SoC level DTS files. This property is required.
    |


    (continued)'
