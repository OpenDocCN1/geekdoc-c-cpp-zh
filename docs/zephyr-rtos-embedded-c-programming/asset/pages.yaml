  md: "# CHAPTER 11 UNDERSTANDING AND USING THE ZEPHYR BUS IN APPLICATION DEVELOPMENT\n\
    \nThe subscriber runs an infinite loop involving making a blocking zbus_sub_wait\
    \ call on each iteration of the loop and only exiting the loop when zbus_sub_wait\
    \ returns with an error code. In the body of the loop, the message data is retrieved\
    \ by calling zbus_chan_read to obtain the data and then processing the data and\
    \ acting on it as required by the application. In this example, the extracted\
    \ data is simply output to a logger.\n\nThe thread itself is defined using the\
    \ K_THREAD_DEFINE macro.\n\nThe example includes a couple of function iterators:\
    \ a channel iterator and a data iterator.\n\nThis is the code for the print_channel_data_iterator()\
    \ function:\n\n```\nstatic bool print_channel_data_iterator(const struct zbus_\n\
    channel *chan, void *user_data) {\n    int *count = user_data;\n    LOG_INF(\"\
    %d - Channel %s: Message size: %d, zbus_chan_msg_\nsize(chan));\n    LOG_INF(\"\
    Observers: %\");\n    ++(*count);\n    struct zbus_channel_observation *observation;\n\
    \    for (int16_t i = chan->data->observers_start_idx,\n         limit = chan->data->observers_end_idx;\n\
    \         i < limit; ++i) {\n        STRUCT_SECTION_GET (zbus_channel_observation,\
    \ i,\n        &observation);\n        ASSERT(observation != NULL, observation\
    \ must be\nnot NULL\\n        LOG_INF(\" - %s\", observation->obs->name);\n  \
    \  }\n    struct zbus_observer_node *obs_nd, *tmp;\n    SYS_SLIST_FOR_EACH_CONTAINER_SAFE\
    \ (&chan->data-\n>observers, \\\n```"
