  md: '# About the Technical Reviewer


    **Jacob Beningo** is an embedded software consultant with over 15 years of experience
    in microcontroller-based real-time embedded systems. After spending over ten years
    designing embedded systems for automotive, defense, and space industries, Jacob
    founded B Embedded Group in 2009. He has worked with clients in more than a dozen
    countries to dramatically transform their businesses by improving product quality,
    cost, and time to market. Jacob has published more than 500 articles on embedded
    software development techniques and is a sought-after speaker and technical trainer
    who holds three degrees that include a Master of Engineering from the University
    of Michigan. He is an avid writer, trainer, consultant, and entrepreneur who transforms
    the complex into simple and understandable concepts that accelerate technological
    innovation. Jacob has demonstrated his leadership in the embedded systems industry
    by consulting and training at companies such as General Motors, Intel, Infineon,
    and Renesas with successfully completing over 50 projects. He holds bachelor''s
    degrees in Electronics Engineering, Physics, and Mathematics from Central Michigan
    University and a master''s degree in Space Systems Engineering from the University
    of Michigan.


    In his spare time, Jacob enjoys spending time with his family, reading, writing,
    and playing hockey and golf. In clear skies, he can often be found outside with
    his telescope, sipping a fine scotch while imaging the sky.


