    # # Advantages and Disadvantages of SPI


    Advantages


    +   - As there are no start and stop bits, data can be streamed continuously without
    interruption.

    - Because slaves are selected explicitly, there is no addressing system in I2C,
    which would add extra complexity to the application.

    - SPI is capable of faster data transfer rates than I2C.

    - The presence of separate MISO and MOSI lines means that data can be sent and
    received at the same time.


    Disadvantages


    +   - SPI uses more I/O pins compared to I2C (SPI involves four wires, whereas
    I2C involves two wires).

    - In SPI, unlike I2C, there is no automatic acknowledgment that the data has been
    successfully received.

    - SPI provides no form of error checking.

    - An SPI network can only have a single master.


    # # I2C Explained


    I2C was developed by Philips in the early 1980s as a simple serial protocol that
    supported a two-wire interface that could be used to connect relatively low-speed
    devices such as microcontrollers, EEPROMs, A/D and D/A converters, I/O interfaces,
    and various other peripheral chips in embedded systems. Because multiple I2C devices
    could be attached to the'
