    Recall that advertising data is made up of Advertising Data (AD) elements, where
    each element has the following structure:


    +   - 1st byte - Length of the element (excluding the length of byte itself)

    - 2nd byte - AD type - Specifies the type of data is included in the element

    - AD data - The actual data


    The possible AD type values are listed on the Bluetooth SIG website [5]. Here,
    the type values of interest are the following two.


    BT_DATA_UUID16_SOME has a #define of 0x02, which implies that the data is 16-bit
    Service Class UUIDs available, but that this is not a complete list and more are
    available.


    BT_DATA_UUID16_ALL has a #define of 0x03, which implies that the data is a complete
    list of 16-bit Service Class UUIDs.

    data->data_len % sizeof(uint16_t) != 0 checks that the data is well formed, which
    is a multiple of 2 bytes.


    BT_UUID_DECLARE_16(sys_le16_to_cpu(u16)) returns a pointer to a generic UUID given
    a 16-bit UUID value in host endian format. sys_le16_to_cpu takes a 16-bit integer
    in little-endian format and converts it from little-endian to host endian.


    UUIDs are compared with bt_uuid_cmp(), which has the function prototype (defined
    in the header file uuid.h).


    ```

    int bt_uuid_cmp ( const struct bt_uuid * u1, const struct bt_uuid * u2 )

