  md: '# CHAPTER 1


    # An Introduction


    # What This Book Is “All About”


    This book is a foundational guidebook introducing programming embedded and IoT/IIoT
    (Internet of Things/Industrial Internet of Things) applications in C using the
    Zephyr RTOS framework. It is for engineers and programmers planning to embark
    on a project involving the use of Zephyr RTOS, or evaluating the potential advantages
    of Zephyr RTOS in an upcoming project.


    You, the reader, probably have a digital electronics and embedded systems programming
    background building embedded systems applications in C and assembler. May be the
    requirements of upcoming applications are such that a classical bare metal programming
    approach may not be the best way to go. Maybe you have inherited some poorly documented
    multitasking code and the developers involved in developing this code have left
    the project and your company is considering migrating the code to use a real-time
    multitasking operating system.


    The aims of this book are to show you what Zephyr is capable of and to introduce
    you to the basic RTOS programming skills required before embarking on a real-world
    real-time RTOS-based project. The book can also be thought of as a guide to the
