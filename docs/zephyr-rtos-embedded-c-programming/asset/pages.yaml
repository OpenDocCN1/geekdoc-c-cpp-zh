  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND SPI\n\
    2C IN PARTICULAR\n\n# # Handles, Phandle-Array Type Properties, and Specifier\
    \ Cell Names\n\nIn devicree terminology, a phandle value provides a means to reference\
    \ another node in the devicree. Any node that can be referenced defines a phandle\
    \ property with a unique <u32> value, and that is used for the value of properties\
    \ with a phandle value type. A phandle-array is a list of comma-separated p-values.\
    \ For example a phandle-array describing pulse width modulation for a device may\
    \ be written as follows:\n\n```\nmy-device {\n  pwms = <&pwm0 1 2>, <&pwm3 4>;\n\
    }\n```\n\nWhen an entry such as this is being processed, the tooling strips away\
    \ the final s from the property name of this property, resulting in pwm. Then\
    \ the value of the #pwm-cells property is looked up in each of the PWM controller\
    \ nodes pwm0 and pwm3, as shown here:\n\n```\npwm0@0 {\n  compatible = \"foo,pwm\"\
    ;\n  #pwm-cells = <2>;\n}\n```\n\n```\npwm3@3 {\n  compatible = \"bar,pwm\";\n\
    \  #pwm-cells = <1>;\n}\n```\n\nThe &pwm0 1 part of the property value has two\
    \ cells, 1 and 2, which matches #pwm-cells = <2>, so these cells are considered\
    \ as the specifier associated with pwm0 in the phandle array. Similarly, cell\
    \ 4 is the specifier associated with pwm3."
