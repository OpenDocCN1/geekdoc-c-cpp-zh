    from which the event originated, info is a valid pointer in the use case where
    the user wishes to get the information associated with the event (NULL otherwise),
    info_length is the size of the info memory area (only valid if info is not NULL),
    and timeout is a timeout delay (a timeout of K_FOREVER means waiting indefinitely).
    The return values are 0 on success, a negative error code otherwise. -ETIMEDOUT
    is returned if a timeout occurred.


