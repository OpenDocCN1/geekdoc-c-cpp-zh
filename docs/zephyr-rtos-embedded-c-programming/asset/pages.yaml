    \ pointer values will be used in the initialization of the collection of function\
    \ pointers data structure for the API. In the case of code snippet shown previously,\
    \ suppose that the actual driver functions were defined as follows:\n\nThen the\
    \ collection of function pointers of the API could be initialized as follows:\n\
    \n```\nstatic struct subsystem_api real_driver_api_funcs = {\n  .do_it = real_driver_do_this,\n\
    \  .do_other = real_driver_do_other,\n};\n```\n\nImplementing device drivers is\
    \ something that must be learned by experience and studying actual device driver\
    \ implementations. A more advanced aspect of device driver implementation in Zephyr\
    \ includes implementing device-specific extensions, for example, where a particular\
