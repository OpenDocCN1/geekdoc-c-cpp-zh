  md: '# SDC and MMC Cards


    SDC and MMC cards essentially consist of a flash memory array combined with an
    on-card (micro)controller inside. The flash memory operations such as reading,
    writing, erasing, wear levelling, and error handling and reporting take place
    inside the memory card. The transfer of data between the memory card and the host
    controller takes place as 512-byte data block transfers. In essence, it is possible,
    from the perspective of upper-layer software, to think of an SDC or MMC care as
    a kind of generic hard drive.


    The block diagram in Figure 6-7 illustrates, schematically, the architecture of
    SDC and MMC cards.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_290_0.png)


    **Figure 6-7.** Schematic of architecture of SDC and MMC cards'
