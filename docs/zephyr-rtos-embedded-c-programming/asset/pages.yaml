  md: "# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS\n\nThe function wifi_connect()\
    \ attempts to set up a Wi-Fi connection. Conceptually it is a straightforward\
    \ function that initializes a struct wifi_connect_req_params connection parameters\
    \ structure, and the context structure that controls LED0 behavior, and then calls\
    \ the Wi-Fi API net_mgmt() function with the arguments needed to request a Wi-Fi\
    \ connection.\n\n```\nstatic int wifi_connect(void) {\n    struct net_if *iface\
    \ = net_if_get_default();\n    static struct wifi_connect_req_params cnx_params;\n\
    \    context.connected = false;\n    context.connect_result = false;\n    __wifi_args_to_params(&cnx_params);\n\
    \n    if (net_mgmt(NET_REQUEST_WIFI_CONNECT, iface, cnx_params, sizeof(struct\
    \ wifi_connect_req_params))) {\n        LOG ERR(\"Connection request failed\"\
    );\n        return -ENOVEC;\n    }\n    LOG_INF(\"Connection requested\");\n \
    \   return 0;\n}\n```\n\nIt is possible to configure the example so that it encrypts\
    \ data being sent over the QSPI bus. The example code also contains a utility\
    \ function bytes_from_str() for converting a string into a sequence of bytes in\
    \ connection with decryption of the QSPI encryption key if programmed into the\
    \ device. The Nordic Semiconductor documentation should be consulted for the necessary\
    \ details, and in the demonstration program tested, it was not used as it an optional\
    \ feature."
