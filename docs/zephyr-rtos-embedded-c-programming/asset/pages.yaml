  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    # # Building and Troubleshooting the Zephyr Network Programming Examples Using
    the STM32 Nucleo-F767ZI Board


    The Zephyr network programming samples cover many aspects of TCP/ IP network programming
    that include dhcpv4_client, dns_resolve, sockets, ipv4_autoconfig, lldp (Link
    Layer Discovery Protocol), and telnet. There are also IoT-oriented protocol examples
    that include lwm2m_client (lightweight M2M client) and an mqtt_publisher example.


    When building Zephyr net examples for various boards, problems may arise, the
    aim of the Zephyr project is to support a wide range of boards which has the consequence
    that documentation pertaining to the “quirks and features” of individual boards
    is sometimes limited. When building and testing network applications, it is often
    necessary to troubleshoot and carefully check things such as the assignment of
    IP addresses and subnet masks where addresses are assigned manually, or setting
    up or configuring DHCP correctly if addresses are being assigned automatically.
    Running the application in a real network also requires some knowledge of network
    configuration and troubleshooting. This can include dealing with issues such as
    configuring firewalls, network routing, and NAT (Network Address Translation)
    as well as IPv4 and IPv6 configuration details such as the IP address of a default
    gateway and IP address(es) of DNS resolvers to use.


    The Zephyr source repository has a comprehensive collection of net sockets examples
    demonstrating a dumb http server, a basic multithreading http server, echo and
    client servers running over TCP and UDP, an http client, and custom tcp socket
    client examples. The examples explored in this chapter will be a UDP and TCP echo
    server example, an asynchronous select example, and a WebSocket client example.
    These examples correspond, broadly speaking, the kinds of examples covered when
    introducing Linux TCP/IP programming. The'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'difference here is that Zephyr applications monolithic applications and everything
    that is needed must be built into the application. Historically Zephyr used to
    incorporate the CivetWeb embedded HTTP server. However, Zephyr''s CivetWeb module
    has been deprecated and removed. The stated cause was complications of maintaining
    a fork of the third-party,Civet project in an external module.


    The requirements for a Zephyr HTTP server module are that it should interface
    with existing Zephyr building blocks and support the ZTest Framework, the HTTP,
    WebSocket, JSON, and mbedTLS libraries and include POSIX API support for socket,
    threads, and filesystem operations, Kconfig, and Build System to permit tuning
    of server options. There is also a requirement for Zephyr Iterable Section support,
    to make possible a more flexible specification of HTTP services and resources.


    # The BSD Sockets API


    The BSD Sockets API (a part of the POSIX standard) was designed at Berkeley in
    connection with the development of the original version of the TCP/IP protocol.


    Zephyr includes an implementation of this protocol, designed to have as minimal
    overhead as possible. The Zephyr BSD Sockets API uses a namesacing convention
    that involves adding a zsock_ prefix to the native BSD Sockets API name, for example,
    zsock_socket() and zsock_close() for the BSD socket() and close() functions. This
    is to avoid name conflicts with names such as close(), which may be part of libc
    or one of the other POSIX compatibility libraries. The Config option CONFIG_NET_SOCKETS_POSIX_NAMES
    can be exposed to native POSIX names. The BSD functions supported are socket(),
    close(), recv(), recvfrom(), send(), sendto(), connect(), bind(), listen(), accept(),
    fcntl(to set nonblocking mode), getsockopt(), setsockopt(), poll(), select(),
    getaddrinfo(), and getnameinfo().'
