    The buttons are connected to GPIO pins configured to have edge-triggered interrupts.


    Button presses will be acted upon by interrupt handlers detecting edge-triggered
    interrupts on the target buttons. The interrupts will trigger sending or receiving
    of data by the use of binary counting semaphores.


    In this case, the interrupt handlers will control the behavior of the threads
    that write and read messages to and from the message queue.


    The purpose of this example is to provide some insights into how Zephyr applications
    can make use of some of the synchronization and message passing mechanisms available
