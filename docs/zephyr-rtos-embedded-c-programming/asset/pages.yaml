  md: 'Applications that previously used only buttons and LEDs and possibly an LCD
    display for user interaction can, these days, communicate over channels such as
    BLE, Zigbee, and LTE.


    Adding such features, which superficially might appear quite straightforward,
    actually places considerable demands on both the underlying hardware as well as
    software developers. One of the great challenges faced by modern product and application
    developers lies in being able to cope with and manage increased code size and
    complexity and the need to provide feature-rich applications and deliver them
    with tight time constraints.


    Traditionally embedded systems code is developed in a linear fashion. In such
    systems, real-time requirements are taken care of with the help of on-chip and
    off-chip (board-level) components. As new requirements and features are added,
    the ability to fine-tune the system behavior becomes more and more limited, till
    a point is reached where a complete redesign becomes necessary, or the implementation
    of fixes by, for example, adding an extra microcontroller to the board. Fine-tuning,
    tweaking, and adapting the application code pose serious problems as far as code
    maintainability and code reusability are concerned.


    A typical standard embedded systems approach uses a “big loop design” supplemented
    with interrupts for dealing with “time-critical event handling.” The basic pattern
    for this kind of programming is outlined in the left-hand-side flowchart of Figure
    2-1.'
