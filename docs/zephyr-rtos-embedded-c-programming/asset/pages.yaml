  md: '# CHAPTER 4 ZEPHYR MULTITHREADING


    A thread will also have a set of thread options that influence thread handling
    under certain specific circumstances. These include a start delay that specifies
    a waiting time before the thread is started and an execution mode. The execution
    mode can either be a supervisor or user mode. By default, threads run in supervisor
    mode, which allows access to privileged CPU instructions, the entire memory address
    space, and peripherals.


    User threads have a reduced set of privileges, depending on the CONFIG_USERSPACE
    option, and will have to make appropriate system calls to access services running
    at a higher supervisor privilege level.


    The details of Zephyr user mode are described in detail in the Zephyr documentation
    [1]. Zephyr support for user mode is important when developing networked applications.
    This is especially important in IoT and IIoT contexts, where security is an important
    part of the implementation and design process. The following scenarios illustrate
    recommended practice for having applications run user mode threads:


    +   - Protect against unintentional programming errors where a thread with system-level
    privileges could corrupt the system and cause it to fail


    +   - To sandbox complex data parsers such as interpreters, network protocols,
    and filesystems so that kernel or other threads will not be compromised by malicious
    code or data


    +   - To make possible designs made up of multiple logical “applications,” each
    with its own group of threads and private data structures, and isolation so that
    the system can continue to function if one thread crashes or is compromised in
    some way


