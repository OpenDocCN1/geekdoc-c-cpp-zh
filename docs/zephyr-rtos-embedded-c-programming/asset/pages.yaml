  md: '# Zephyr Network Management API


    In order to be robust, an embedded network application needs to be able to respond
    to network events as well as other events such as sensor interrupt events and
    user interaction events for example. It may also be necessary to shut down network
    interfaces or bring up network interfaces under various conditions.


    Zephyr provides various Network Management APIs that can be used by network applications
    as well as network layer code itself, for example, call specific network routines
    at any given level in the IP stack, or to receive notifications when network events
    of interest occur. An application should, for example, be able to request notification
    if a network interface IP address changes. In connection with applications using
    wireless interfaces, it may be necessary to request that a scan be performed on,
    for example, a Wi-Fi network interface of a BLE network interface.


    In conformity with the Zephyr convention of including what is necessary in an
    application, the Network Management API implementation is modular and configurable.
    As opposed to using statically defined APIs for network management procedures,
    the Zephyr philosophy is to register defined procedure handlers as required via
    a NET_MGMT_REGISTER_REQUEST_HANDLER macro. The net_mgmt( ) API is used to invoke
    registered handlers for their corresponding requests.


    The Network Management APIs are evolving and should be thought of as “work in
    progress.”


    # How to Request a Defined Procedure


    Network management requests take the form net_mgmt (mgmt_request, ...), where
    the mgmt_request parameter is a bit mask indicating which stack layer is the focus
    of attention. Where a net_if object is involved and'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    a specific management procedure is requested, the procedure request details will
    depend on what has been implemented in the corresponding network stack. To minimize
    resource usage, net_mgmt() calls are direct.


    # Listening for Network Events


    Notifications about various network events are handled by registering a callback
    function and providing a set of events of interest to use to filter incoming events
    in the context of callback invocation. The net_mgmt_add_event_callback() function
    is used for registering a callback function, and the net_mgmt_del_event_callback()
    is used for unregistering a callback. Zephyr also has a net_mgmt_init_event_callback()
    helper function for initializing the callback structure.


    When an event triggers a match''s event occurs, the associated callback function
    is called with the actual event code. It is possible for different events to be
    handled by the same callback function which makes sense. To deal with false positives,
    a callback handler has to check the event code (passed as an argument) against
    the specific network events it is prepared to handle.


    To receive events from multiple layers, multiple listeners need to be registered,
    one for each layer being listened on. It is possible for a callback handler function
    to be shared between different layer events.


    The following code snippet illustrates, in template style, how to define and register
    a callback:


    ```

    #define EVENT_INTERFACE_SET (NET_EVENT_IF_xxx) | NET_EVENT_IF_yyy

    #define EVENT_IPV4_SET (NET_EVENT_IPV4_xxx) | NET_EVENT_

    IPV4_yyy)

    struct net_mgmt_event_callback iface_callback;

    struct net_mgmt_event_callback ipv4_callback;

    void callback_handler(struct net_mgmt_event_callback *cb,

    uint32_t mgmt_event, struct net_if *iface)

    ```'
