    ![](img/d625a3dc80e999570aa2c88dcc398b17_233_0.png)


    **Figure 5-1.** Common embedded system application scenario


    In this scenario, there are three threads: a thread associated with fetching sensor
    data and writing it to an input queue, a thread that is responsible for analyzing
    the input data and identifying application events on the basis of that data, and
    finally, a thread that is responsible for retrieving event information from the
    event queue and writing event to a log file.


    More complex scenarios may involve applications pulling data from multiple sensors,
    writing commands to actuators, and receiving instructions and commands over a
    communications link such as BLE or Ethernet.


    # # Zephyr Message Queue


    A Zephyr Message Queue can be thought of as a container that can hold a collection
    of fixed-size data items. The size of the item and the data it contains is determined
    by the application being implemented. When a message queue is created, the maximum
    number of items it can contain is also specified. The Zephyr Message Queue API
    and implementation provide the logic for adding and removing items from the queue
    and also provide blocking semantics whereby a thread attempting to retrieve a
    message from an empty message queue will exhibit configurable blocking behavior
    (returning immediately (K_NO_WAIT), blocking indefinitely (K_FOREVER), blocking
    for a specified timeout period). Similarly, attempting to read from an empty queue
    also exhibits blocking semantics when the message queue is empty.


