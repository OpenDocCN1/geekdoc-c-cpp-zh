    \ all the tokens in its argument list after the last named argument (this macro\
    \ has none), including any commas, become the variable arguments.\n\nThis, in\
    \ turn, can be used in a helper macro that declares a 128-bit UUID given a readable\
    \ format of UUID as shown here:\n\n```\n#define BT_UUID_DECLARE_128(value...)\
