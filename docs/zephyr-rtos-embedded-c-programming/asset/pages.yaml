  md: '# CHAPTER 11


    # Understanding and Using the Zephyr ZBus in Application Development


    # Zephyr ZBus


    ZBus has many concepts in common with DBus, which is used in Linux-based systems.
    Whereas DBus is concerned with communication between processes running in separate
    virtual memory spaces, ZBus is concerned with communication between Zephyr RTOS
    threads.


    The underlying ZBus is an observer pattern in which a thread can broadcast messages
    to all observers interested in receiving such messages. ZBus can be used for many-to-many
    communication purpose as well. The communication patterns supported by ZBus are
    publish/subscribe and message passing. ZBus-based communication makes use of shared
    memory and can be either synchronous or asynchronous in nature.'
  merge: -1
  pgno: 542
- img_proc: true
  md: '# CHAPTER 11 UNDERSTANDING AND USING THE ZEPHYR ZBUS IN APPLICATION DEVELOPMENT


    The essential ZBus abstraction is the channel. Zephyr threads publish messages
    to read messages from channels. Threads can also observe channels and receive
    notifications from the bus when the channels are modified.


    The ZBus architecture is illustrated conceptually in Figure 11-1.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_543_0.png)


    Figure 11-1. Conceptual overview of the ZBus architecture


    The application logic that uses ZBus is hardware independent. An application thread
    communicates with other threads over this bus. Threads communicating with one
    another over the ZBus do not need to know each other''s details. In this sense,
    the threads are decoupled from one another.


    # ZBus Architecture


    The architecture of the ZBus, as outlined in the following schematic, consists
    of


    +   - A set of channels with each channel having a unique identifier and control
    metadata information

    - A virtual distributed event dispatcher (VDED), which provides the bus logic
    for sending notifications to the observers'
  merge: -1
  pgno: 543
- img_proc: true
  md: '# CHAPTER 11 UNDERSTANDING AND USING THE ZEPHYR ZBUS IN APPLICATION DEVELOPMENT


    +   - Threads (subscriber threads) and callbacks (listener threads), which do
    the publishing, reading, and receiving of notifications from the bus


    This is outlined in Figure 11-2.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_544_0.png)


    Figure 11-2. Schematic overview of the ZBus architecture


    The ZBus actions that can be performed over a channel are publish, read, and subscribe.


    Publishing and reading cannot be used in an ISR (interrupt service routine) context
    because the underlying operations may block. This is because publishing and copying
    involve a mutex locking step followed by a memory copy to or from a shared memory
    region.


    The registration of a ZBus observer can be either static or dynamic. A static
    observer registration is defined at compile time and cannot be removed. It can,
    however, be suppressed via a call to the zbus_obs_set_enable() method. Dynamic
    observer registrations can be added and removed at runtime as required.


    The Zephyr documentation provides an example of a fairly typical use of the ZBus
    in a sensor-based application. The scenario underlying this example is illustrated
    in Figure 11-3.'
  merge: -1
  pgno: 544
- img_proc: true
  md: '# CHAPTER 11 UNDERSTANDING AND USING THE ZEPHYR ZBUS IN APPLICATION DEVELOPMENT


    ![](img/d625a3dc80e999570aa2c88dcc398b17_545_0.png)


    Figure 11-3. Example ZBus usage scenario


    In this scenario, when the timer is triggered, it pushes an action to a workqueue
    that publishes the Start trigger channel. This is the standard way of getting
    an interrupt handler to send something to the ZBus. The sensor thread, which is
    subscribed to the Start trigger channel, will start retrieving the sensor data
    when notified. The event dispatcher will execute the blink callback because it
    listens to the Start trigger channel. Once the sensor data is ready, the sensor
    thread publishes it to the Sensor data channel.


    The core thread, which is a Sensor data channel subscriber, retrieves and processes
    the sensor data that was sent over the ZBus and stores it in its internal sample
    buffer. This process is repeated until the sample buffer becomes full. At this
    point, the core aggregates the stored sample information, packages it up, and
    publishes it to the Payload channel. The LoRa thread, as a subscriber to the Payload
    channel, receives this message and transmits it. Once it has finished transmitting,
    the LoRa thread publishes a suitable event as this callback is a listener on the
    Transmission done channel.


    The power of the ZBus comes from the flexible way in which it can be used. For
    example, instead of using a timer interrupt to trigger the sequence of events
    described, the code could be modified to use a'
