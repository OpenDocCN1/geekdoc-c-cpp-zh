    \ = <1000000>\n  };\n}\n```\n\nDriver macro expansion will result in device global\
    \ variables with unique names being created in the C file that is to be compiled,\
    \ as shown in the following:\n\n```\nconst struct device __device_dts_ord_65 =\
    \ {\n  ...\n```\n\n```\nconst struct device __device_dts_ord_70 = {\n  ...\n```\n\
    \nIt should be noted that instance numbers are not the same thing as ordinal numbers.\
    \ In this, next, example, the instance numbers are 0 and 1. In the application,\
    \ there will be two devices produced as a result of macro expansion. The macro\
    \ expansion of\n\n```\nconst struct device\n  *spidev = DEVICE_DT_GET(DT_NODELABEL(onspi)),n\
    \  *i2cdev = DEVICE_DT_GET(DT_NODELABEL(oni2c));\n```\n\nresults in the following:\n\
    \n```\nconst struct device\n  *spidev = (&_device_dts_ord_70);\n  *i2cdev = (&_device_dts_ord_65);\n\
    ```"
