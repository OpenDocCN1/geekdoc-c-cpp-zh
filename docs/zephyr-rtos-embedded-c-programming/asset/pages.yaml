  md: '# About the Author


    ![](img/d625a3dc80e999570aa2c88dcc398b17_16_0.png)


    Andrew Eliasz is the Founder and Head at Croydon Tutorial College as well as the
    Director of First Technology Transfer Ltd. First Technology Transfer runs advanced
    training courses and consults on advanced projects in IT, real-time, and embedded
    systems. Most courses are tailored to customers’ needs. Croydon Tutorial College
    evolved from Carshalton Tutorial College, which was established to provide classes,
    distance-level teaching, workshops, and personal tuition in computer science,
    maths, and science subjects at GCSE, A Level, BTEC, undergraduate, and master’s
    levels. It has now changed its name and location to Croydon Tutorial College at
    Weatherill House, Croydon. In addition to teaching and tutoring, they also provide
    mentoring and help for students having difficulties with assignments and projects
    (e.g., by suggesting how to add to a project to obtain a better grade as well
    as reviewing project content and writing styles).'
