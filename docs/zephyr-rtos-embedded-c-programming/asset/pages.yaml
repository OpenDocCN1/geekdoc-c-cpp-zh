    A shell module instance can be connected to various transports for

    command input and output. Supported transport layers include Segger

    RTT, SMP, Telnet, UART, and USB.


    # Zephyr Shell Module


    As previously discussed, the shell module is a Unix-like shell that can be

    extended by adding user-defined command sets.


    # Shell Commands


    Shell commands are organized as a tree structure and are grouped into

    several categories. Root commands (level 0 commands) are collected

    together and organized in an alphabetically sorted manner in a dedicated

    memory section. Static commands (level > 0) are commands whose

    number and syntax are known at compile time and are created in software.

    Dynamic subcommands (level > 0) are created dynamically in software,

    and their number and syntax do not have to be known at compile time.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Command Creation Macros


    Zephyr provides an extensive set of macros for adding shell commands that are
    listed here together with brief descriptions. Root commands must have distinct
    names and can be created using the SHELL_CMD_REGISTER macro. For root commands
    that are created conditionally, if a compile flag is set, there is the SHELL_COND_CMD_REGISTER
    macro.


    It is possible to create a root command that takes arguments, and in this case,
    the SHELL_CMD_ARG_REGISTER macro should be used. The variant that creates commands
    that take arguments conditionally on a compile time being set is SHELL_COND_CMD_ARG_REGISTER.
    Further macros include SHELL_CMD_CMD for initializing a command and its conditional
    variant SHELL_COND_CMD. Other macros include the SHELL_EXPR_CMD for initializing
    a command if a given compile time expression is nonzero and SHELL_ARG for initializing
    a command with arguments. Additionally there are the macros SHELL_COND_CMD_ARG
    for initializing a command with arguments if a compile time flag is set, and SHELL_EXPR_CMD_ARG
    for initializing a command with arguments is non-zero.


    For creating arrays of static subcommands, the SHELL_STATIC_SUBCMD_SET_CREATE
    macro is provided, and for creating a dictionary subcommands array, the corresponding
    macro is SHELL_SUBCMD_DICT_SET_CREATE.


    Finally, a dynamic subcommands array can be created using the SHELL_DYNAMIC_CMD_CREATE
    macro.


    Commands can be created in any file in the system that includes include/zephyr/shell/shell.h,
    and these created commands are available for all shell instances.


    # Creating Static Commands


    The following code snippet, based on the Zephyr documentation [4], illustrates
    the process of creating a root command and a set of associated subcommands.'
