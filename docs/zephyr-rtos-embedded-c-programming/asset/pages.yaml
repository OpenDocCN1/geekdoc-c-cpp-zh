  md: 'CHAPTER 5 MESSAGE QUEUES, PIPES, MAILBOXES, AND WORKQUEUES


    # Mailbox Message Life Cycle


    The mailbox message life cycle is relatively simple. A message is created when
    passed to the mailbox by a sending thread. The mailbox has ownership of the message
    until that message is actually given to the receiving thread. A receiving thread
    may choose to retrieve the message data when it receives the message from the
    mailbox, or may carry out the data retrieval in a follow-on mailbox operation.
    Once data retrieval by the receiving thread has completed, the mailbox message
    can be deleted by the mailbox.


    # Mailbox Sending and Receiving Thread Compatibility


    In the Zephyr mailbox implementation, a sending thread can specify the address
    (identity) of the thread or threads to which the message is to be sent, as mentioned
    earlier. The K_ANY identifier means "sending to any receiving thread." Also, a
    receiving thread can specify an address of a thread from which it wishes to receive
    a message. K_ANY can be used to indicate that the thread is willing to receive
    a message from any sender thread. A message can only be exchanged between compatible
    threads.


    For example, where thread A sends a message to thread B exclusively, then thread
    B can receive message if thread B indicates that it is willing to receive messages
    from thread A or if it is willing to receive any message. The message exchange
    will not occur if thread B tries to receive a message from thread C. Thread C
    cannot receive a message sent exclusively to thread B, even where thread C is
    willing to receive messages from thread A, or to receive messages from any thread.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Mailbox Message Sending – Synchronous and Asynchronous


    The sender and receiver of mailbox messages can use either a synchronous approach
    or an asynchronous approach. Synchronous exchange involves blocking of the sending
    thread until the message has been fully received by the receiving thread. In asynchronous
    exchange, the sending thread does not block and can continue running and doing
    further work. The sending policy, synchronous or asynchronous, is determined by
    the sending thread.


    Flow control is implicit in synchronous exchange as the sending thread cannot
    send messages faster than they can be received. Technique provides an implicit
    form of flow control, preventing a sending thread from generating messages faster
    than they can be consumed by receiving threads. Flow control can be implemented
    in asynchronous message exchange by having the sending thread first check whether
    a previously sent message is still in the mailbox before attempting to send another
    message.


    # The Mailbox API – Data Types and Functions


    The Zephyr Mailbox API is deceptively simple. Here, the API will be described
    and explained. The “real fun” begins with implementing real-world applications
    that make effective use of this API. As always with embedded systems, it is important
    to take heed of the mantra that “resources are limited and must be used sparingly
    and effectively.” The other important observation is that the Zephyr RTOS API
    can be used for sending messages having variable sizes (including a size of zero),
    which can be really useful in applications where the sizes of the data responses
    from various attached sensors (e.g., different I2C and SPI sensors) may differ.'
  merge: -1
