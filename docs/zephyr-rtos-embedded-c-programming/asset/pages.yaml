  md: '# CHAPTER 2 A REVIEW OF RTOS FUNDAMENTALS


    An application with characteristics such as the following will probably not require
    an (RT)OS:


    +   The application is relatively simple and involves a small number of tasks
    that do not require any complex scheduling. The on-chip and on-board peripherals
    can handle any necessary real-time scheduling requirements. As a simple example,
    timers can be used to blink LEDs, and edge-triggered interrupts can be used to
    react to button presses.


    +   The application involves the monitoring of only a few external signals, and
    the number of actions needed to produce the required/expected behavior is small.
    In such a system, the use of a sophisticated scheduler would be excessive, and
    it would probably make the code more difficult to follow. Furthermore, incorporating
    a scheduler would increase the total code size. In such an application, the gains
    from separating the application into clearly demarcated tasks would be small.
    Code reusability might probably be realized at the driver level.


    +   The realization/implementation of a more complex scenario might involve the
    use of global variables for data exchange and the use of state machines and interrupts.
    Task flexibility would favor code reusability. However, at the application level,
    the requirements and needs of the particular tasks involved would need to be considered
    carefully as the requirements of one task could impose constraints on the resources
    available for another'
