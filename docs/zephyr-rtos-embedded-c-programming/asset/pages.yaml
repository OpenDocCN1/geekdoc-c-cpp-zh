    For a module to use the logger, it must specify a unique name and register itself
    with the logger. Where a module is made up of source files, registration is performed
    in one file, but each module has to declare the module name. The logging system
    API can be called by general application code. The “fine control” logging capabilities
    of the Zephyr Logger provide a useful set of logging tuning, management, and control
    mechanisms. It is up to the developer to devise effective policies for the debugging,
    monitoring, and troubleshooting task being tackled and to move from a global logging
    approach to a more “fine-grained” logging approach. Log messages automatically
    include a timestamp and report on what part of the application they come from.
    The importance of each message can be specified. This makes it possible to select,
    at compile time, which logging messages will be included in the binary. A program
    can contain various debug-level messages a build time priority be included or
    left out of the build based on setting a build time priority level. This can be
    done by setting the value of CONFIG_LOG_MAX_LEVEL in the Kconfig file. This is
    the maximal level that is compiled in, and lower-level messages will not be compiled
    into the code. At runtime, it is also possible to turn off the logging of certain
    messages by increasing the severity threshold.


    The Zephyr logging architecture design is quite sophisticated. There are three
    main components, namely a frontend, which is the application logging interface;
    the core component, which filters messages and routes them to a given backend,
    which may be a network interface to send log messages to a log server in the cloud.
    By adding a mean to send commands to the running device remotely, there is also
    the possibility of dynamically controlling the level of logging based on the behavior
    of the system under various testing scenarios.'
