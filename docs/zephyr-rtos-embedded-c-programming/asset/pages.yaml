  md: "# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS\n\nZephyr RTOS supports\
    \ a number of SD card controllers and also provides support for interfacing SD\
    \ cards over SPI. The drivers make use of the disk driver interface so that a\
    \ file system can access the SD cards via the disk access API. Zephyr supports\
    \ both standard and high-capacity SD cards.\n\nThe current Zephyr firmware does\
    \ not support inserting or removing cards while the system is running, which means\
    \ that the cards must be present at boot time and must not be removed while the\
    \ system is running.\n\nThe Zephyr SD Memory Card (SDMMC) subsystem is used transparently\
    \ by the Zephyr RTOS disk driver API. It can also be used to access data in a\
    \ memory card at the block level. The SDMMC subsystem uses the SD host controller\
    \ API to communicate with an attached SD card.\n\n# SD Card Support via SPI\n\n\
    To build an application that accesses an SD card via SPI, it is necessary to add\
    \ an appropriate fragment to the devicree that will add an SD card node to the\
    \ given processor SPI interface. An introduction to devicree configuration is\
    \ given in a following chapter. The devicree snippet shown setting up pin PA27\
    \ for chip select and running the SPI bus at 24 MHz once the SD card has been\
    \ initialized:\n\n```\n&spi {\n    status = \"okay\";\n    cs-gpios = <&porta\
    \ 27 GPIO_ACTIVE_LOW>;\nsdhc0: sdhc@{\n    compatible = \"zephyr,sdhc-spi-slot\"\
    ;\n    reg = <0>;\n    status = \"okay\";\n}\n```"
