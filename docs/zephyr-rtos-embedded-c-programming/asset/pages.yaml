    # Event Objects (Event Registers)


    An event object is associated with a task. The implementation details are hardware
    and kernel specific. It is, essentially, a collection of binary event flags, typically
    32 bits, where every bit is associated with some specific event. These bits can
    be set or cleared and are used by a task to check for the occurrence/non-occurrence
    of a particular event. An ISR can, for example, set a bit in an event object to
    inform a task that particular event has occurred. A task can perform conditional
    checks specified by a combination (using ANDs and ORs) of the event register flags.
    Event checking strategies are not to wait (block), to wait indefinitely, or to
    wait with a timeout.


    In Zephyr RTOS, there is no fixed limit on the number of event objects that can
    be defined. Each event object is referenced by its memory address, and one or
    more threads may wait on an event object until some specified set of events has
    been delivered to the event object. When new events are delivered to an event
    object, all the threads whose wait conditions are met, simultaneously, become
    ready to run. In Zephyr RTOS, events may be delivered by a thread or an ISR that
    may overwrite the existing set of events or add to it in a bitwise fashion.


    When working with event objects, it is worth noting that no data is associated
    with an event when an event is delivered (sent) through an event object (register)
    and that identifying protocols need to be agreed upon between senders and receivers,
    that is, a particular task sends a particular event by setting a particular flag
    (bit) in the event object. The events in an event object are not queued, and an
    event object cannot count the number of occurrences of an while it is pending.'
