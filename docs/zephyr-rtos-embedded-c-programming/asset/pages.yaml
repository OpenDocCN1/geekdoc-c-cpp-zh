- img_proc: true
  md: '+   IEEE 802.11n, or Wi-Fi 4, was introduced in 2009 as a standard that supported
    both the 2.4 GHz and 5 GHz frequency bands, with data rates up to 600 Mbit/s.
    IEEE 802.11n data throughputs led to the development and deployment of WLAN networks
    in place of wired networks.


    +   IEEE 802.11ac, or Wi-Fi 5, was introduced in 2013 to support data rates up
    to 3.5 Gbit/s, providing greater bandwidth, additional channels, and improved
    modulation. It was the first Wi-Fi standard to enable the use of multiple input/multiple
    output (MIMO) technology.


    +   IEEE 802.11ax, or Wi-Fi 6, was published in 2021. It supports a theoretical
    data rate of up to 9.6 Gbit/s; however, the underlying design was to address the
    fact that the very pervasive use of Wi-Fi usage may cause performance degradation
    in areas of dense Wi-Fi traffic, such as sports stadiums, concert halls, and public
    transportation hubs, and in office and home environments where routers have to
    communicate simultaneously with a large number of digital gadgets.


    # Wi-Fi Frames and the 802.11 Packet Structure – An Overview


    Wi-Fi frames are of three main types:


    +   Management frames


    +   Control frames


    +   Data frames'
  merge: -1
