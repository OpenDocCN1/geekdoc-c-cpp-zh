  md: '# Zephyr As a Modular RTOS


    The idea behind a modular RTOS is to develop it as a set of components that can
    be combined to be able to construct an application that incorporates only the
    functionality required for the application. This is not a new approach. The early
    versions of Microsoft’s Windows NT operating system were modular with the possibility
    of being able to build operating system variants best suited to the task at hand.


    Zephyr therefore tries to provide a solution to RTOS application development centered
    around a modular open source architecture appropriate for implementing a wide
    variety of use cases and design architectures running on connected, resource-constrained
    embedded controllers. Zephyr has an Apache 2.0 license, hosted at the Linux Foundation,
    and has extensive support for Bluetooth and for TCP/IP.


    The modular aspects of the Zephyr OS can be conceptualized as a layered model
    shown in Figure 1-3 [3].


    | Zephyr OS |

    | 3rd Party Libraries |

    | Application Services |

    | Middleware Networking |

    | Kernel |

    | HAL |


    **Figure 1-3.** Zephyr layered modular architecture'
