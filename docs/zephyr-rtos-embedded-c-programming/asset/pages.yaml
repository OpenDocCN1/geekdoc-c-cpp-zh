    # # Zephyr RTOS Thread Priorities


    Although thread priorities are conceptually similar in preemptive multitasking
    operating systems, the API and implementation details vary, and when developing
    Zephyr applications, it is important to be familiar with the way thread priorities
    are defined and handled.


    Thread priority is an integer value and can be either negative or non-negative.
    Numerically lower priorities take precedence over numerically higher values; for
    example, the scheduler will treat thread A having a priority of 4 as having a
    higher priority than B having a priority of 7. Similarly, thread C of priority
    -2 will have a higher priority than both thread A and B.


    Additionally, the Zephyr scheduler distinguishes between two classes of threads,
    based on thread priority. A cooperative thread has a negative priority value,
    and once it becomes the current thread, a cooperative thread remains the current
    thread until it performs some action that makes it uneasy. A preemptible thread
    has a non-negative priority value.


    Once it becomes the current thread, a preemptible thread may be supplanted at
    any time if a cooperative thread, or a preemptible thread of higher or equal priority,
    becomes ready to run.


    The initial priority value of a thread can, later, be altered up or down after
    the thread has been started. This means that it is possible for a preemptible
    thread to become a cooperative thread, and vice versa, by changing that thread''s
    priority. Whether to use of cooperative multithreading in an application or is
    it a design decision.


    The Zephyr documentation suggests using cooperative threads for device drivers
    and other performance-critical work and also using cooperative threads to implement
    mutual exclusion without the need for a kernel object, such as a mutex. Preemptive
    threads can be used to give priority to time-sensitive processing over less time-sensitive
    processing [5].


    The Zephyr kernel supports a virtually unlimited number of thread priority levels.
    Limits can be placed on priority levels via the configuration'
