  md: "# CHAPTER 4 ZEPHYR RTOS MULTITHREADING\n\nA philosopher can only take the fork\
    \ on their right or the one on their left as they become available, and they cannot\
    \ start eating before getting both forks.\n\nEating is not limited by the remaining\
    \ amounts of spaghetti or stomach space; an infinite supply and an infinite demand\
    \ are assumed.\n\nThis problem was designed to illustrate the challenges involved\
    \ in implementing code that avoids deadlock, a system state in which no progress\
    \ is possible.\n\nThe example solution used in the Zephyr dining philosophers\
    \ is based on the use of multiple preemptive and cooperative threads of differing\
    \ priorities, as well as mutexes and thread sleeping. The solution depends on\
    \ acquiring resources in a fixed order and then releasing them in a fixed order.\
    \ In the example, a philosopher always tries to acquire the lowest fork first,\
