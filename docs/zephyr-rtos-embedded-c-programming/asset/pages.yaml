    # Figure 4-8. Dining philosophers


    Five silent philosophers sit at a round table with bowls of spaghetti.

    Forks are placed between each pair of adjacent philosophers.

    Each philosopher must alternately think and eat.

    However, a philosopher can only eat spaghetti when they have both left and right
    forks.

    Each fork can be held by only one philosopher at a time, and so a philosopher
    can use the fork only if it is not being used by another philosopher.

    After an individual philosopher finishes eating, they need to put both forks so
    that the forks become available to others.'
