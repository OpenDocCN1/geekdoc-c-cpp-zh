  md: '# Requests – Flow Control, Reading Attributes, and Writing to Attributes


    Requests are sequential in the sense that they require a response from the server
    before a new request can be sent. Indications have a similar requirement; a new
    indication cannot be sent before a confirmation for the previous indication is
    received by the server.


    Requests and indications, however, are mutually exclusive in terms of the sequence
    requirement. Thus, an indication can be sent by the server before it responds
    to a request earlier.


    Commands and notifications do not require any flow control; they can be sent at
    any time. There is therefore possible that commands and notifications may be missed
    because of issues such as a buffer and processing limitations. This implies that
    commands and notifications cannot be considered as reliable. Where reliability
    is a concern, requests and indications should be used instead of commands and
    notifications.


    Attribute reads are, in effect, requests because they require a response. There
    are various possible kinds of read. These include a read request where both a
    handle and an offset indicating where the read should start are given, and which,
    therefore, returns only a part of, and which, therefore, returns only a part of
    the specified characteristic.


    A write to an attribute can be issued either in the form of a write request or
    in the form of a write command. Write commands do not require a response from
    the server, whereas write requests do require an acknowledgment from the server
    that the attribute has been successfully written.


    There are also queued writes that can be used to provide an atomic operation involving
    several writes. A queued write involves the preparation of the corresponding write
    requests that will include an offset specifying'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS


    the position at which the sent value should be written within the attribute value.
    These sent values are also referred to as prepared values, and they are used whenever
    a large value needs to be written that not fit within a single message. The prepared
    values are stored in a buffer on the server side and not written directly to the
    attribute. Once all the prepared values have been sent and received, a write request
    is used to request the server to either execute or cancel the write operation
    of the prepared values. The server has to respond with a confirmation that the
    complete attribute value that was sent to the server has been written.


    # Bluetooth 5


    Bluetooth 5 adds a number of extra features to BLE. These include 2M PHY, which
    specifies how to achieve twice the speed of earlier versions of Bluetooth, Coded
    PHY, which makes it possible to extend the range of earlier versions of Bluetooth
    and make possible BLE communication between devices several hundred meters apart.
    BLE 5 also supports extended advertisements that make use of secondary advertisement
    channels to make it possible for a device to advertise more data than allowed
    on the primary advertisement channels. In the case of extended advertisements,
    the advertisement packets sent on the primary advertisement channels provide the
    information necessary to discover the offloaded advertisements that are sent on
    the secondary advertisement channels. BLE 5 also supports a periodic advertising
    mode in which two or more devices communicate in a connectionless manner.


    In periodic advertising mode, the peripheral device sends out synchronization
    information and other extended advertisement data that will allow another device
    to become synchronized with the peripheral and receive the peripheral device''s
    extended advertisements at regular, deterministic intervals.'
  merge: -1
