  md: "# CHAPTER 11 UNDERSTANDING AND USING THE ZEPHYR ZBUS IN APPLICATION DEVELOPMENT\n\
    \n```\nstruct sensor_msg {\n    uint32_t temp;\n    uint32_t press;\n    uint32_t\
    \ humidity;\n};\n```\n\nOne structure is for publishing version information messages,\
    \ and the other is for publishing sensor reading messages.\n\nSensor readings\
    \ are simulated in a peripheral thread, the thread function code for which is\
    \ given in sensors.c and is created at compile time using K_THREAD_DEFINE.\n\n\
    ```\n// sensors.c\n#include <zephyr/logging/log.h>\n#include <zephyr/zbus/zbus.h>\n\
    LOG_MODULE_DECLARE(zbus, CONFIG_ZBUS_LOG_LEVEL);\nZBUS_CHAN_DECLARE(sensor_data_chan);\n\
    void peripheral_thread(void) {\n    struct sensor_msg sm = {0};\n    while (1)\
    \ {\n        LOG_DBG(\"Sending sensor data...\");\n        sm.press += 1;\n  \
    \      sm.temp += 10;\n        sm.humidity += 100;\n        zbus_chan_pub(&sensor_data_chan,\
    \ &sm, K_MSEC(250));\n        k_msleep(500);\n    }\n}\n\nK_THREAD_DEFINE(peripheral_thread_id,\
    \ 1024, peripheral_thread, NULL, NULL, NULL, 5, 0, 0);\n```\n\nIn this example,\
    \ the simulated pressure, temperature, and humidity sensor readings are published\
    \ every 500 msecs."
