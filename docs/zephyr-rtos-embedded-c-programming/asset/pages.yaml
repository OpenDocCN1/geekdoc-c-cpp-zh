  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVCETREE IN GENERAL\nSPI AND\
    \ I2C IN PARTICULAR\n\napplication-specific purposes by providing a devicetree\
    \ overlay file. The\nfinal devicetree is consumed by the device driver source\
    \ code files, which\nwill use it to allocate the corresponding struct device structures.\
    \ Access\nto the devices in the application code will be via pointers to actual\
    \ device\nstructure instances.\n\n# Working with Devices in Applications\n\nTo\
    \ work with a device in an application, it is necessary to \"get hold of\" a\n\
    node identifier from the application devicetree. There are various ways in\nthis\
    \ can be done, which involve the use of devicetree (DT) macros.\nIf the full path\
    \ to the node in the devicetree is known, the macro DT-\nPATH() can be used by\
    \ supplying the full path to the node in the devicetree.\nThe macro DT_NODELABEL()\
    \ can be used to get a node identifier from a\n label. Node labels are often provided\
    \ by the SoC .dts, which gives\node names that match the SoC data sheet, such\
    \ as i2c1, spi2, and so on.\n\nThe DT_ALIAS() macro can be used to get a node\
    \ identifier for a\nproperty of the special /aliases node. The DT_INST() macro\
    \ can be used\nwhen an instance number is available. Still other approaches include\n\
    using the macro DT_CHOSEN() to get a node identifier for /chosen\nproperties,\
    \ or using DT_PARENT() and DT_CHILD() to get a node identifier\nfor a parent or\
    \ child node, starting from some node identifier.\n\nFrom the coding perspective,\
    \ two node identifiers that refer to the\nsame node and can be used interchangeably.\
    \ This rich\n\"ecosystem\" of macros is an example of TIMTOWODI (There Is More\
    \ Than\nWay Of Doing It), pronounced as \"tim tau dee,\" in action.\n\nThe use\
    \ of the macros is not nearly as daunting as it might first appear\nto be. The\
    \ next few examples will show that the use of the various\nDT_ macros is reasonably\
    \ straightforward.\n\nThe examples explored in this section are based on those\
    \ in the Zephyr\ndocumentation."
