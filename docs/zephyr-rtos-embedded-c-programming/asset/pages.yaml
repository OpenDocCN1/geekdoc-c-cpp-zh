    # Zephyr Shared Memory Example


    Having laid some foundations regarding shared memory and memory partitions, the
    Zephyr shared memory example is a good starting point for exploring how to use
    shared memory in Zephyr applications.


    The Zephyr Shared Memory example involves running multiple threads assigned to
    unique memory domains with protected partitions. In the example, the threads carry
    out computations that simulate a simple cryptographic machine. The sample depends
    on the subsystem app_memory subsystem. When the application is built and run,
    it will display some starting messages in the console, followed by messages corresponding
    to the input and output of the enigma-like machine. The second message is the
    output after processing the first message, and the resulting output is the first
    message without spaces. In the output, the two messages are marked as 1 and 1021,
    respectively.'
