  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND SPI
    AND I2C IN PARTICULAR


    The devicetree processing generates a header file that pre-declares all the potential
    devices in header file so that they do not have to be declared by the application
    developer before taking their addresses.


    Codewise the results will have the same footprint as one involving access to a
    global data structure. However, the macro-based approach combines a hierarchical
    configuration language without incurring the footprint and performance penalty
    of having to explicitly carry out tree-walking.


    In summary, the devicetree-based design achieves the following outcome:


    +   - The devicetree captures dependencies, and this dependency information is
    available at build time.


    +   - The ordinals capture the dependency structure of the devicetree, and this
    dependency information is available at preprocessor time.


    +   - There are also devicetree APIs for querying the forward and reverse dependencies
    of a node, and having dependency information available in device structures makes
    it possible to control the sequence of the device initialization steps at link
    time so that when the application is run, the devices are initialized in the correct
    order.


    +   - Knowing device dependencies is also important in connection with device
    power management as it helps ensure things are shut down in the correct order,
    for example, when entering sleep mode.'
  merge: -1
