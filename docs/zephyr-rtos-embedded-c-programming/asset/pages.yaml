  md: '# CHAPTER 5 MESSAGE QUEUES, PIPES, MAILBOXES, AND WORKQUEUES


    An ISR or thread can send a data item to a message queue. When an item is sent,
    it will be sent to a waiting thread if one is waiting, or otherwise it is copied
    into the message queue ring buffer. The memory area into which the message queue
    is copied must have the same size as defined for the memory queue data item.


    If a thread tries to send a data item when the ring buffer is full, the sending
    thread may choose to wait for space to become available. Multiple threads can
    wait on a full ring buffer, and when space becomes available, the thread that
    is unblocked will be the one that has the highest priority, or, in the case of
    multiple threads with equal priority, the thread that has been waiting the longest.


    When data is fetched (received) from a message queue, it is copied into a specified
    area, whose size equals the size of the data item, provided by the receiving thread.


    If a thread tries to fetch a data item from an empty buffer, the attempt can be
    given a timeout value for which the thread is to wait. Multiple threads can be
    waiting on an empty mail queue, and, as sending when data becomes available, the
    thread that is unblocked will be the one that has the highest priority, or, in
    the case of multiple threads with equal priority, the thread that has been waiting
    the longest.


    The Zephyr Message Queue API also has a method for peeking at the message at the
    head of the queue, without removing it from the queue.


    An important point to note when working with message queues is the amount of data
    being transferred via the message queue. Generally a message queue should be used
    to transfer relatively small amounts of data. This is because data interrupts
    are locked when data is being written or read, and hence, the greater the amount
    of data involved, the greater the latency. Common practice when transferring larger
    amounts of data is to make use of pointers to the data item in questions as opposed
    to transferring the data item itself.'
