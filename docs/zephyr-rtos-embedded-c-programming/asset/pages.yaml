    \ I2C IN PARTICULAR\n\nThe following basic example, based on the Zephyr documentation,\
    \ illustrates various aspects of the binding process. It concerns a hypothetical\
    \ DTS node bar-device and a matching YAML binding.\n\nSuppose the node entry in\
    \ a DTS file for bar-device\n\n```\nbar-device {\n    compatible = \"foo-company,bar-device\"\
    ;\n    num-foos = <3>;\n}\n```\n\nand the matching YAML binding\ncompatible: \"\
    foo-company,bar-device\"\n\nProperties:\n\n+   - Num-foos:\n    type: int\n  \
    \  required: true\n\nThe build system will match the bar-device node to its YAML\
    \ binding because the node's compatible property matches the binding's compatible:\
    \ line. When converting the devicetree_unfixed.h header file, the build system\
    \ will use the given binding to check that the required num-foos property is present\
    \ in the bar-device node and that its value, <3>, has the correct type. The build\
    \ system will then generate a macro for the bar-device node's num-foos property,\
    \ which will expand to the literal 3. This macro can be used to get the value\
    \ of that property in the C/C++ application code.\n\nWhere a node has more than\
    \ one in its compatible property, the build system looks for compatible bindings\
    \ in the listed order and uses the first match it finds. In the case of a node\
    \ that does not have compatible properties, matching will be attempted on bindings\
    \ associated with the parent node. In the case where a node describes hardware\
    \ on a bus, such as an I2C or SPI bus, then the bus type is also taken into account\
    \ when matching the node to its binding."
