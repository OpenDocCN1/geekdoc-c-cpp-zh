    Their advertising channel PDU (Protocol Data Unit) types are ADV_IND for connected
    unidirectional advertising, ADV_DIRECT_IND for connectable directed advertising,
    ADV_NONCONN_IND for nonconnectable undirected advertising, and ADV_SCAN_IND for
    scannable undirected PDUs.


    The scanning PDU handles the request and respond PDUs SCAN_REQ and SCAN_RSP. The
    connection initiating PDU CONNECT_REQ defines things such as the frequency hopping
    interval, the connection interval, and the time between two connection events.


    # Connections and Connection Events


    Connection events are the regular exchanges of data between master and slave.
    0-byte data packets are exchanged if there is no data to send. If a packet is
    not received, the connection event is terminated, and data will have to be resent
    at the next connection event.


    Once a connection has been established, the link layer functions as a reliable
    data bearer. Received packets are checked against a 24-bit CRC and re-transmissions
    requested as necessary. The link layer will resend a packet until it is acknowledged.'
