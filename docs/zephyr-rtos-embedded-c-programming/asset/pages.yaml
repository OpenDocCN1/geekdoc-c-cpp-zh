  md: '# Using Zephyr RTOS System Calls: Essential Concepts and Overview


    System calls provide a mechanism that allows a user thread to access resources
    and perform operations not directly available to it. Access by a user thread to
    private kernel data is only possible via system call interface functions.


    Digging deeper into the “workings” of the Zephyr framework will reveal the presence
    of various Python scripts that generate code such as linker files and header files.
    There are also Python scripts for processing devicetree files and Kconfig files
    and generating code as a result of doing so. This also applies to implementing
    system calls. A Zephyr system call has a C prototype prefixed with __syscall for
    the API. The prototype is never implemented manually but is created by the scripts/gen_syscalls.py
    script.


    Inline functions are used in the implementation of Zephyr system calls. The code
    for an inline function is actually expanded in the code at the point where the
    function is called. Unlike C macro expansion in which the macro parameters are
    not checked, the parameters passed to an inline function are checked.


    The inline function generated by the gen_syscalls.py script either calls the implementation
    function directly (if called from supervisor mode) or goes through privilege elevation
    and validation steps if called from user mode. The function that implements the
    system call can be written on the assumption that all the parameters passed in
    have been validated if the function was invoked from user mode. The implementation
    function itself is wrapped by a verification function that performs the validation
    of all the arguments passed in. In the system code generation process also produces
    an un-marshalling function, which is an automatically generated handler that must
    be included by user source code.'
