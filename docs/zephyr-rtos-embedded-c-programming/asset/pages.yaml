  md: 'CHAPTER 5 MESSAGE QUEUES, PIPES, MAILBOXES, AND WORKQUEUES


    # Sending and Receiving Zephyr Mailbox Messages


    The Zephyr Mailbox has many features, and using it to its best advantage will,
    almost certainly, involve deciding on which features to use and how to use them.
    An attempt to construct a UML sequence diagram covering all of these features
    would result in a very large, complicated, and difficult-to-follow diagram, which
    defeats the whole purpose of working with UML diagrams. A better approach might
    be to devise various scenarios to illustrate possible use patterns and situations
    where multiple threads exchange information via the use of a common mailbox, and
    then, when examining examples, to consider the various patterns that are being
    followed in practice. It is also worth considering that analyzing such patterns
    and scenarios can be of considerable help in unit testing of application code.


    Here are a couple of example scenarios:


    # Scenario 1


    The mailbox is empty.


    A consumer thread is waiting for a message, and it is the only thread in the mailbox
    receive queue.


    The sending thread sends a message that does not target any particular thread.


    The message is sent to the receiving thread directly.


    # Scenario 2


    The mailbox is not empty.


    The mailbox receive queue is empty.


    The sending thread sends a message that is placed in the mailbox send queue, which
    sorts messages by priority and time arrival order.


    A consumer thread requests a message.


    There are variants of these scenarios involving messages targeting certain threads
    and threads only interested in certain messages.


    242'
