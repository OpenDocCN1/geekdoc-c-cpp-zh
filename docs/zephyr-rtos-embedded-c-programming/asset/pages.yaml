  md: '# CHAPTER 8


    # Zephyr RTOS and Ethernet, Wi-Fi, and TCP/IP


    Networking lies at the heart of IoT, and Zephyr provides extensive embedded TCP/IP
    networking support. This chapter assumes that you have a basic understanding of
    computer networking and TCP/IP. The focus here will be on developing application
    using the Zephyr RTOS networking framework.


    Zephyr’s network stack is a Zephyr OS stack implementation. As with most networking
    stacks, it has a layered architecture where the interface associated with a given
    layer provides services to other layers. In Zephyr, the network stack functionality
    to be incorporated into an application is specified by selecting the required
    Kconfig options.


    Zephyr’s network stack has many components, and its architecture is summarized
    in the diagrams in Figures 8-1 through 8-3, going from application layers and
    ending up at the physical layer.'
  merge: -1
