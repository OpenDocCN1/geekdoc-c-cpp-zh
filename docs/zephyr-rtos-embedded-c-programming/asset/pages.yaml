- img_proc: true
  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND I2C
    IN PARTICULAR


    same bus, and there were no select pins, each attached device had to have a unique
    address. The original version of I2C could only run at speeds up to 100 kHz, and
    addresses were 7 bits wide. Later, in 1992, in the first public specification,
    the included a 400 kHz fast-mode and enhanced 10-bit wide address space. Further
    additions to the specification included three extra modes: a fast mode, at 1 MHz;
    a high-speed mode, at 3.4 MHz; and an ultra-fast mode, at 5 MHz, although, such
    speeds are not commonly found in standard microcontrollers.


    There is also an I2C variant of I2C that was developed by Intel called SMBus (System
    Management Bus), which was, originally, designed to provide more predictable communications
    between ICs deployed on PC motherboards. SMBus is relatively low speed with speeds
    from 10 kHz to 100 kHz. In addition to "vanilla" I2C, Intel introduced a variant
    in 1995 called "System Management Bus" (SMBus). SMBus also has a clock timeout
    mode designed to make very low-speed operations illegal.


    The I2C bus uses two lines: SDA (data line) and SCL (clock line). Data transmission
    between master and slave is half-duplex, either from master to slave or slave
    to master. Data transfer between slave and master is always initiated by the master.
    The master initiates the data transfer and generates all the synchronization signals.
    A slave will only start sending data when requested to do by the master. In addition
    to multiple slaves, it is also possible to have more than one master on a bus.
    However, only one master can be active at any time.


    I2C devices are connected to the bus via an open collector or open drain. This
    means that a device may output either a logic zero or nothing at all (the output
    is in the high impedance state). If the outputs of all the connected devices are
    in the high-impedance state, external pull-up resistors, Rp, which must be present,
    will hold the lines at a high voltage level (logic 1 state). The resistors have
    values, typically, in the high range from 1K to 10K. The schematic in Figure 9-2
    shows a typical setup [2].'
