    # Signalling Using a Condition Variable


    The pattern/example implemented in this scenario involves two threads that turns
    incrementing a counter and a third thread that watches the count value. The counter
    incrementing code is enclosed inside a mutex-based critical section that a thread
    will not be preempted by another thread in the middle of the counter processing
    code. Inside the counter incrementing critical section, when the counter value
    reaches a predefined COUNT_LIMIT, a condition variable condition is signalled,
    which a count watching thread is waiting on. In the example, k_thread_join() is
    used to synchronize the termination of the three threads via a thread join operation.'
