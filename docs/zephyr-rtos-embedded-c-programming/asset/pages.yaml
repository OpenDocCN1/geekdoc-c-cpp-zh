  md: '# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS


    ![](img/d625a3dc80e999570aa2c88dcc398b17_323_0.png)


    Figure 7-4. BLE link layer advertising and scanning


    The three main operational states of a BLE device are the Advertising, Scanning,
    and Connected states.


    In addition to handling timing, the link layer manages hardware-accelerated operations
    such as CRC checksumming, random number generation, and encryption.


    BLE link layer use cases involve role pairs that are played out the various phases
    of discovery/connection. These are the Advertiser/Scanner (Initiator), Slave/Master,
    and Broadcaster/Observer role pairs.


    BLE distinguishes between unicast (peer-to-peer) and broadcast connections.


    # BLE Unicast Connection Scenario


    A typical unicast connection scenario involves a sequence of steps that start
    with a situation in which two BLE hosts, initially in a Standby (unconnected)
    state, enter a Discovery state in which the device wishing to be discovered becomes
    the Advertiser and the host wishing to connect becomes a Scanner. The Advertiser
    sends advertising packets containing basic information about the host it is running
    on, and all scanners receive these packets. The Scanner (after filtering/analyzing
    information'
