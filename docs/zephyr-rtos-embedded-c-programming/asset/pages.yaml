  md: "# Hard Channels and Message Validation\n\nA hard channel is a channel that\
    \ only allows valid messages to be published. This requirement is enforced by\
    \ providing a Validator function. The following code snippet in the Zephyr documentation\
    \ demonstrates the implementation of a channel that will only publish messages\
    \ whose values are equal to 0.\n\nThe following code defines and initializes a\
    \ hard channel and its dependencies. Only valid messages can be published to a\
    \ hard channel. This is possible because a Validator function is passed to the\
    \ channel's definition. In this example, only messages with move equal to 0, 1,\
    \ or -1 are valid.\n\n```\nstruct control_msg {\n    int move;\n};\n\nbool control_validator(const\
    \ void* msg, size_t msg_size) {\n    struct control_msg* cm = msg;\n    bool is_valid\
    \ = (cm->move == -1) || (cm->move == 0) || (cm->move == 1);\n    return is_valid;\n\
    }\n\nstatic int message_count = 0;\nZBUS_CHAN_DEFINE(control_chan,\n    struct\
    \ control_msg,\n    control_validator,\n    &message_count,\n    ZBUS_OBSERVERS_EMPTY,\n\
    \    /* Name * */\n    /* Message type * */\n    /* Validator * */\n    /* User\
    \ data * */\n    /* observers * */\n    ZBUS_MSG_INIT(.move = 0) /* Initial value\
    \ {.move=0} */\n);\n```"
