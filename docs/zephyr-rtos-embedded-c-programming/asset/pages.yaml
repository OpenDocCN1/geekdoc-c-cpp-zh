  md: '# Using Semaphores and Mutexes in Interrupt Service Routines


    An interrupt service routine must be responsive; hence, the code involved must
    be of short duration. This means that invoking an operation that might block is
    not permissible in an interrupt service routine. Hence, releasing a binary semaphore
    or a counting semaphore is allowed, but attempting to acquire a binary semaphore
    or a counting semaphore is not allowed. In general, mutexes should not be used
    in interrupt service routines.


