    # Zephyr ZBus Hello World


    This example can be found at samples/subsys/zbus/hello_world.


    It involves setting up several threads and setting up communications between them
    by means of ZBus channels. The importance of this example is that it covers most
    of the ZBus API functionality and can be readily adapted and modified for real-world
    applications.


    The prj.conf file shows the configuration required for a typical ZBus application.
    These are


    ```

    CONFIG_LOG=y

    CONFIG_LOG_MODE_MINIMAL=y

    CONFIG_BOOT_BANNER=n

    CONFIG_MAIN_THREAD_PRIORITY=5

    CONFIG_ZBUS=y

    CONFIG_ZBUS_LOG_LEVEL_INF=y

    CONFIG_ZBUS_CHANNEL_NAME=y

    CONFIG_ZBUS_SERVER_NAME=y

    CONFIG_ZBUS_RUNTIME_OBSERVERS=y

    ```


    The CMakeLists.txt file is fairly simple:


    ```

    # SPDX-License-Identifier: Apache-2.0

    cmake_minimum_required(VERSION 3.20.0)

    find_package(Zephyr REQUIRED HINTS $ENV{ZEPHYR_BASE})

    project(hello_world)

    FILE(GLOB app_sources src/*.c)

    target_sources(app PRIVATE ${app_sources})

    ```


    The application involves two kinds of messages whose structures are shown in the
    following code snippet, which also shows the header files that need to be included
    and the declaration of the logging module.'
