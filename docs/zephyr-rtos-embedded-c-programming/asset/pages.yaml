  md: "# CHAPTER 8 ZEPHY RTOS AND ETHERNET, WI-FI, AND TCP/IP\n\nAn illustrative example\
    \ is the following, which is concerned with the implementation of a command to\
    \ set the gain on an amplifier associated with an ADC converter. Here, the string\
    \ would indicate the gain value, and the value would be the corresponding integer\
    \ value, which would be used in the ADC driver API. The command handler code for\
    \ this scenario might be implemented along the lines shown in the following code\
    \ snippet:\n\n```\nstatic int gain_cmd_handler(const struct shell *shell,\n  \
    \  size_t argc, char **argv, void *data)\n{\n    int gain;\n    /* data value\
    \ corresponds to called command syntax */\n    gain = (int)data;\n    adc_set_gain(set\
    \ to: %s\\n)\n    shell_print(shell, \"Value send to ADC driver: %d\",\n     \
    \   argv[0],\n        gain);\n\n    return 0;\n}\n\nSHELL_SUCMD_DICT_SET_CREATE(sub_gain,\
    \ gain_cmd_handler,\n    (gain1, 1), (gain2, 2), (gain3, 3), (gain4, 4))\n);\n\
    \nSHELL_CMD_REGISTER(gain, &sub_gain, \"Set ADC gain\", NULL);\n```\n\nThe Zephyr\
    \ shell also supports the dynamic addition of subcommands. Adding subcommands\
    \ dynamically in a real-world project needs to be considered carefully at the\
    \ application design stage. The security aspects of adding subcommands dynamically\
    \ must be taken into account, and this will involve careful testing and analysis."
