    # Sending Urgent/High Priority Data Between Tasks


    A streaming data channel does not support data prioritization. One way to make
    it possible to send high priority out of stream is to use an urgent message queue
    for this purpose, with the regular data going into a normal message queue. When
    a data producer task or ISR has regular data, it places that data into its normal
    message queue. However, when a data producer task or ISR has urgent data that
    needs to be handled, it places that into an urgent message queue and signals the
    consumer task.


    The consumer task''s urgent data signal handler retrieves urgent data from the
    urgent data message queue and deals with it. This pattern can be further enhanced
    by adding flow control mechanisms to control the flow of urgent data.


    # Device Drivers


    Zephyr RTOS has implementations of device drivers for most of the devices and
    peripherals encountered in embedded systems such as GPIO, I2C, SPI, CAN bus, and
    ADC. Zephyr RTOS also provides stacks for TCP/IP, Wi-Fi, and BLE (Bluetooth Low
    Energy). Some specialist devices such as the nRF5x devices from Nordic Semiconductor
    also support proprietary BLE stacks, in addition to the open source BLE stack
    included with'
