  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL\nSPI AND\
    \ I2C IN PARTICULAR\n\n| Name | Type | Details |\n\ncs-gpios phandlearray An array\
    \ of chip select GPIOs to use. Each element in the array specifies a GPIO. The\
    \ index in the array corresponds to the child node that the CS gpio controls.\n\
    \nExample:\n\n```\nspi@... {\ncs-gpios = &gpio0 23 GPIO_ACTIVE_LOW,\n  &gpi1 10\
    \ GPIO_ACTIVE_LOW;\n  ...\nspi-device@0 {\n  reg = <0>;\n  ...\n}\nspi-device@1\
    \ {\n  reg = <1>;\n  ...\n}\n}\n```\n\nThe child node \"spi-device@0\" specifies\
    \ an SPI device with chip select controller gpio0, pin 23, and devicetree GPIO\
    \ flags GPIO_ACTIVE_LOW. Similarly, \"spi-device@1\" has CS GPIO controller gpio1,\
    \ pin 10, and flags GPIO_ACTIVE_LOW. Additional devices can be configured in the\
    \ same way.\nIf about the flags cell, GPIO_ACTIVE_LOW is generally a safe choice\
    \ for a \"Csn\" pin. GPIO_ACTIVE_HIGH may be used if intervening hardware inverts\
    \ the signal to the peripheral device or the line itself is active high.\nThis\
    \ property is not defined, no chip select GPIOs are set. SPI controllers with\
    \ dedicated CS pins do not need to define the cs-gpios property.\n\n(continued)"
