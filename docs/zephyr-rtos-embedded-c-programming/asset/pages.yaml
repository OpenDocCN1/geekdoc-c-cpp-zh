  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    # Quad-SPI (QSPI), essentially,


    Quad-SPI [3, 6-9] is essentially, a serial interface standard, which uses four
    data lines to read, write, and erase flash memory chips. A QSPI device (peripheral)
    can be used to interface with flash memory that supports QSPI.


    The diagram shown in Figure 6-1 from the ARM mbed-os documentation (4) illustrates
    a typical configuration.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_284_0.png)


    **Figure 6-1.** Typical Quad-SPI configuration


    SPI as Quad-SPI uses four data lines (I0, I1, I2, and I3) as opposed to two data
    lines (MOSI and MISO) in traditional SPI.


    SPI has a data transfer rate of up to 16 Mbps, which is quite sufficient for use
    cases such as the reading of data from sensors and the sending of data to actuators
    or output devices.


    However, traditional SPI has limitations when it comes to its use as a bus for
    transferring data to and from flash memory. Although flash memory is cheap and
    durable (an attractive option) when it comes to embedded system applications),
    it is inherently slow, and flash devices are not capable of sending data at the
    maximum data rates that SPI is capable of. Prior to the development of QSPI, acceptably
    high data transfer rates for transferring data from flash memory were based on
    using parallel memory involving 8, 16, or 32 pins (depending on the address range)
    to connect external memory devices with the microcontroller. The disadvantages


    270'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# CHAPTER 6 USING FILESYSTEMS IN ZEPHYR APPLICATIONS


    of such an approach were that it resulted in more complicated PCB designs and
    the need to devote a block of pins exclusively for use with one particular chip
    to achieve fast performance. But this approach had two major cons.


    The QSPI approach was to modify SPI protocols to use two extra and to have all
    the data lines bidirectional.


    Whereas normal SPI uses separate data lines for input and output (MISO and MOSI),
    the Quad-SPI interface configures the data lines dynamically so that they can
    best be used as outputs to send data to flash memory, or as inputs to read data
    from flash memory. The switch from input to output takes two clock cycles, as
    shown in Figure 6-2.


    ![](img/d625a3dc80e999570aa2c88dcc398b17_285_0.png)


    Figure 6-2. Quad-SPI clock cycle traces


    Four bits are transferred every clock cycle, and the bit order is that in the
    first clock cycle, IO0 sends bit0, IO1 sends bit1, and in the second clock cycle,
    bits 4, 5, 6, and 7 are sent. In effect, a byte can be transmitted in just two
    clock cycles.


    QSPI also defines a double data rate mode, in which the data line can change on
    both the rising edge and the falling edge, the effect of this is to send 2 bits
    per clock cycle, which doubles the effective transmission rate.'
