  md: '# Testing Out the BSD Sockets Example


    The “big bang” approach is to start the PC side UDP and TCP servers running, flash
    the application to the target board, and then run the PC side UDP and TCP clients
    and collect the log messages sent from the target board to the PC terminal emulator
    and to note the output messages from the PC side Python servers and clients.


    Alternatively by only starting up some of the threads in the target board application
    (by modifying the main() function), the individual components can be tested one
    at a time.


