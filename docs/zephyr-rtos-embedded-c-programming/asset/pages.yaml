  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVCETREE IN GENERAL AND SPI\
    \ I2C IN PARTICULAR\n\nThe Zephyr approach to implementing device drivers involves\
    \ classifying drivers in various types of driver. A given type of driver has a\
    \ generic API (Application Programming Interface) associated with it.phyr defines\
    \ a device model and the mechanisms for configuring the drivers used in an application.\n\
    \nThe Zephyr device model provides a consistent device model for configuring the\
    \ drivers that are part of a system. The device model is responsible for initializing\
    \ all the drivers configured into the system. The API can be thought of as a collection\
    \ of interface functions for the corresponding device type, and an instance of\
    \ a given type of device is defined by a variable of type struct device, which\
    \ has the following\n\n```\nstruct device {\n    const char *name;\n    const\
    \ void *config;\n    const void *api;\n    void * const data;\n};\n```\n\nIn this\
    \ structure, the config member points to an area of memory that holds read-only\
    \ device configuration data that is set at build time. The configuration data\
    \ includes things such as the base memory-mapped IO addresses of the device and\
    \ the IRQ line numbers associated with the device. The data element points to\
    \ an area of memory that is used by the driver at runtime and may contain objects\
    \ such as reference counts, semaphores, and scratch buffers required by the driver.\
    \ The api element points to a collection of function pointers that define the\
    \ actual behavior of the driver. Typically this element is read-only and is populated\
    \ with pointers to the actual API methods at build time.\n\nThe different firmware\
    \ components in a given device can be thought of as a collection of subsystems.\
    \ In general, the drivers used in an application will implement (use) a device-independent\
    \ subsystem-specific API for"
  merge: -1
  pgno: 450
- img_proc: true
  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVETREE IN GENERAL AND SPI\
    \ I2C IN PARTICULAR\n\nthat type of device. This has the consequence that when\
    \ an application uses a device instance, it does not need to know the details\
    \ of the internal implementations of the various API functions involved. An approach\
    \ this goes a long way simplifying the task of porting applications from one architecture\
    \ to another.\n\nThe following code snippets illustrate this approach:\n\n```\n\
    typedef int (*subsys_api_func1)(const struct device *dev,\nint param1, int param2);\n\
    typef void (*subsys_api_func2)(const struct device *dev, void\n*pparam);\nstruct\
    \ subsystem_api {\n    subsys_api_func1 do_it;\n    subsys_api_func2 do_other;\n\
    };\nstatic inline int subsys_do_this(const struct device *dev, intparam1, int\
    \ param2)\n{\n    struct subsystem_api *api;\n    api = (struct subsystem_api\
    \ *)dev->api;\n    return api->do_it(dev, param1, param2);\n}\nstatic inline void\
    \ subsys_do_other(const struct device *dev,\nvoid *pparam)\n{\n    struct subsystem_api\
    \ *api;\n    api = (struct subsystem_api *)dev->api;\n    api->do_other(dev, pparam);\n\
    }\n```"
