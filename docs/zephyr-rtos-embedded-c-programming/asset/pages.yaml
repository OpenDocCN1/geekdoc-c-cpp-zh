    \ I2C IN PARTICULAR\n\n# # Binding and Bus Controller Nodes\n\nWhere a node is\
    \ a bus controller, bus is used in the binding to specify the type of the bus.\
    \ For example, a binding for an SPI peripheral on an SoC would be written as\n\
    \n```\ncompatible: \"manufacturer,spi-peripheral\"\nbus: spi\n```\n\nThe presence\
    \ of the bus key in the binding tells the bus system that the children of any\
    \ node matching this binding correspond to devices appearing on this type of bus.\
    \ This influences the on-bus: is used to match bindings for the child nodes. Where\
    \ a node appears as a device on a bus, the on-bus key is used in the binding of\
    \ that node to specify the type of bus involved, for example, on-bus: spi in the\
    \ case of an external SPI, or on-bus: i2c in the case of an I2C-based temperature\
    \ sensor. When searching for a binding for a node attached to a bus, the build\
    \ system checks to see if the binding for the parent node contains bus:<bus type>.\
    \ If it does, then only bindings with on-bus key will be considered.\n\nBindings\
    \ with an explicit on-bus: <bus type> are searched for before bindings without\
    \ an explicit on-bus. Hence, it is possible for the same device to have different\
    \ bindings depending on what bus it appears on; for example, a sensor device with\
    \ a compatible manufacturer, sensor value could be used via either I2C or SPI.\
    \ This is illustrated in the next devicetree snippet:\n\n```\nspi-bus@0 {\n  \
    \  /* ... some compatible with 'bus: spi', etc. ... */\n    sensor@0 {\n     \
    \   compatible = \"manufacturer,sensor\";n        reg = <0>;n        /* ... */\n\
    ```\n\n469"
