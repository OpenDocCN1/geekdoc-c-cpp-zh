  md: '# CHAPTER 8 ZEPHYR RTOS AND ETHERNET, WI-FI, AND TCP/IP


    # # Strategies for Studying and Reverse Engineering (Where Necessary) Zephyr Application
    Code


    When reading and trying to understand and analyze a Zephyr application, the key
    is to try and understand things such as initialization details, interrupt handling
    details, and the number of threads involved and the interactions between these
    threads. Also vital is getting to understand how access to resources that are
    shared between threads is controlled and the various ways blocking and asynchronous
    calls are used when accessing shared resources.


    For complex applications, it can be helpful to split up the application into its
    components and incorporate combinations of these components into partial applications
    that are simpler and can be analyzed in a simpler context.


    In the case of the echo_server example, the source code files contain multiple
    #ifdef ... #endif sections that can be used to control which parts of the code
    are included in the project build and which are ignored. Here, the focus of interest
    is on the TCP and UDP echo services, exploring the shell net subcommands, the
    use of the basic telnet service capabilities, and the implementation of the shell
    shell command with a quit menu option. To illustrate the usefulness of Python
    scripts running on a PC for testing network connectivity with embedded, we will
    also introduce and explore two Python scripts, a TCP echo client script and a
    UDP echo client script.


    When the basic project (i.e., not using any of the available, optional, overlays
    in the project source directory) is built and flashed onto the target board, the
    output displayed on a terminal (e.g., PuTTY in Windows) console will be something
