- img_proc: true
  md: 'The Wi-Fi credentials for a given AP must be provided in the "prj.conf"

    file, namely:


    +   * Network name (SSID)

    * Key management protocol to use

    * Password


    In the example, Zephyr’s power management policy is enabled by

    default, which sets the nRF5340 processor into low-power mode whenever

    it is idle.


    The example uses DHCP to obtain an IP address for the Wi-Fi

    interface. However, a static IP address can be configured to handle

    networks without DHCP servers, or to deal with the case where the DHCP

    server is not available. A successful DHCP handshake overrides the default

    static IP address configuration.


    The default static IP address configuration is provided in the prj.conf

    file, example:


    ```

    CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.98"

    CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

    CONFIG_NET_CONFIG_MY_IPV4_Gw="192.168.1.1"

    ```


    The build target for the application is "nrf7002dk_nrf5340_cpuapp"

    The prj.conf file is quite large, and it is important, for the application to

    work, to ensure that the configuration settings are correct for the type of AP

    being used. The configuration settings are listed as follows:


    ```

    CONFIG_WIFI=y

    CONFIG_WIFI_NRF700X=y

    # WPA supplicant

    CONFIG_WPA_SUP=y

    # Choose the setting that matches the security capabilities

    of the AP

    ```'
