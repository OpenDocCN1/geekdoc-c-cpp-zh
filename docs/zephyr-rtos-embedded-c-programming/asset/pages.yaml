  md: '# Building and Testing Peripheral and Central BLE Applications


    Building and testing BLE applications requires setting up, at a minimum, a small
    BLE network containing several BLE nodes running, for example, a BLE peripheral
    application, a BLE central application, and possibly, a BLE communications scanning
    and protocol analysis application. The examples covered here involve Nordic Semiconductor
    nRF devices using a combination of nRF52840 DK, nRF52840 dongle, a mobile phone,
    and a nRF Connect Bluetooth Low Energy application. An alternative approach is
    to simulate a BLE network and BLE applications using Renode.


    # The nRF52840 Dongle and Its Uses


    The nRF52840 dongle is a small (compact), low-cost, USB dongle based on the nRF52840
    chipset from Nordic Semiconductor that has a few I/O peripherals that include
    one button, two LEDs (one green, one RGB), and 15 GPIO pins. As a dongle, it can
    be used to enable nRF Connect PC applications such as the Bluetooth Low Energy
    application (central and peripheral emulator), the nRF Cloud Gateway application,
    and the RSSI Viewer application. As be used to develop custom applications and
    run sample applications that are provided in the nRF Connect SDK and run BLE example
    programs. The dongle can also be programmed to work as a BLE sniffer.'
