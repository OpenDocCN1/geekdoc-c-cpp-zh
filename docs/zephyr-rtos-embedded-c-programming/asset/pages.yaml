  md: '# CHAPTER 4 ZEPHYR RTOS MULTITHREADING


    In a producer-consumer scenario, the Producer and Consumer are two separate threads
    that share a common buffer or queue. The producer produces data of some sort and
    pushes it onto the buffer, whereas the consumer pulls data from the shared buffer
    and does something with it (i.e., consumes the data). Producer-consumer implementations
    have to be aware of and capable of dealing with a variety of problems. The producer
    and consumer must not try to update the shared queue at the same time as this
    might result in loss of data, or ending up in an inconsistent state. In cases
    where the rates at which data is being produced and consumed not match, situations
    may arise such as where the producer would need to be concerned with the possibility
    of overflowing a finite sized (bounded) queue, or where the consumer consumes
    data faster than it is being produced and will have to pause when the queue is
    empty. It is quite common for real-world scenarios to involve several producers
    and several consumers using the same shared buffer.


    # The Zephyr RTOS Producer-Consumer Example


    This section will explore the basic Zephyr RTOS consumer-producer example [8].
    The example is an “example of many parts” and covers many aspects not covered
    in simplistic “producer-consumer” examples.


    The scenario in this example involves a “sample driver” that receives incoming
    data from some source and generates an interrupt with a pointer to the received
    data every time a data item is received.


    The data is processed by application code, and then the transformed (processed)
    data is sent back to the driver. Figure 4-9 illustrates the movement and processing
    of data from the device, transforming it and then writing the transformed data
    back to the device.'
