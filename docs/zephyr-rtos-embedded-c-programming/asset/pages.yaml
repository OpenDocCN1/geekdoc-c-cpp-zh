  md: '# Shared Memory, Protected Memory

    Partitions, and Memory Domains


    In Linux, sharing memory between tasks involves using the Linux memory mapping
    API that uses the Linux kernel virtual memory management framework. Zephyr is
    designed to run on a user thread on systems that do not have a memory management
    unit, but it is designed to make use of a Memory Protection Unit where this is
    available. The Zephyr Memory Domains framework provides the means by which access
    to additional blocks of memory can be provided to a user thread. A memory domain
    is, essentially, just a collection of a specified set of memory partitions. A
    given MPU has an upper limit on the number of MPU regions that it can support,
    and this, of course, also places a limit on the number of partitions a memory
    domain can have in. In Zephyr, the memory domain APIs can only be used in supervisor
    mode. From the user mode perspective, a thread''s child threads automatically
    become members of the parent''s domain.


    In Zephyr, a thread is a member of some memory domain. Zephyr provides a default
    domain k_mem_domain_default that will be assigned to a thread that has not been
    assigned to some specific domain or inherited a memory domain membership from
    their parent thread. The main thread starts as a member of the default domain.


    # Memory Partitions


    A memory partition''s attributes include a starting memory address, a size, and
    access attributes. The purpose of memory partitions is to control access to system
    memory. A partition represents a memory region that can be programmed by the underlying
    memory management hardware and conforms to the underlying processor implementation
    design hardware'
