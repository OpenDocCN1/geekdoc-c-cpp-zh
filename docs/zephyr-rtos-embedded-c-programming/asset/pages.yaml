    # Producers and Consumers and Multithreading


    Producer-consumer problems crop up frequently in multitasking applications. The
    first description of the family of producer-consumer problems is due to Edsger
    Dijkstra, who described some of the initial solutions to these problems. We have
    already come across Dijkstra in connection with the dining philosophers problem.
    Not many people know about him, yet he has been described as “The Man Who Carried
    Computer Science on His Shoulders” [6].'
