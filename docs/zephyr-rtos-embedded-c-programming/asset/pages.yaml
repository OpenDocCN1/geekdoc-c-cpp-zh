    # Memory Management


    In embedded systems with limited memory resources, dynamic memory allocation and
    management should be avoided unless really necessary. In this section, the essential
    aspects of dynamic memory management in embedded system applications will be introduced.
    In a later section, an example of working with the Zephyr RTOS memory management
    APIs will be explored.


    An embedded system such as Zephyr RTOS will provide some memory management services
    – usually system/library calls such as malloc() and free(). A common problem with
    applications that make frequent, varying memory size calls to malloc() and free()
    is that this may lead to memory fragmentation. In its most basic form, dynamic
    memory allocation takes place from a contiguous block of memory called the heap.
    A memory management facility maintains information about the heap in a reserved
    (control block) area of memory, which includes things such as the start address
    and total size of the memory block, and will implement'
