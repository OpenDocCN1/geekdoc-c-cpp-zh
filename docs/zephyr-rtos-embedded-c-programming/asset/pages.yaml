    # # What Is an RTOS and When and Why “Do You Need One?”?


    Modern microcontrollers come in a wide variety of sizes and complexity ranging
    from 8-bit microcontrollers with less than 10 kilobytes (10K) Flash and less than
    2 kilobytes (2K) RAM through multiprocessor 64-bit microcontrollers interfacing
    with gigabytes of memory. There are SoC (System on Chip) processor architectures
    at the lower end of the embedded computing spectrum and SoM (System on a Module)
    boards at the upper end.


    For tiny systems performing a single specialized task, or a small number of fixed
    tasks, such as a motor controller in a toothbrush or drill controlling a motor,
    the code can be implemented as a bare metal application. The complexity of modern
    connected applications means that they are not best suited to being implemented
    as bare metal applications. Modern microcontroller vendors often provide IDEs
    that provide a graphical interface for configuring peripherals and “pulling in”
    driver code into the project, this allowing developers to focus on the application
    they are trying to build. Examples include Microchip’s Harmony tool and STMicroelectronics
