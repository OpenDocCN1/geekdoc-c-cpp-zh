  md: '# Overview of the Message Queue API Functions


    The API has functions for creating and initializing a message queue as well as
    functions for putting a message into and getting a message from a message queue.


    They are summarized as follows:


    ```

    void k_msgq_init(struct k_msgq *msgq, char *buffer, size_t msg_size, uint32_t
    max_msgs) for initializing a message queue after the memory for the message queue
    structure and the message queue buffer has already been allocated.

    ```


    ```

    int k_msgq_alloc_init(struct k_msgq *msgq, size_t msg_size, uint32_t max_msgs),
    which initializes a message queue and allocates the memory required from the calling
    thread''s memory pool.

    ```


