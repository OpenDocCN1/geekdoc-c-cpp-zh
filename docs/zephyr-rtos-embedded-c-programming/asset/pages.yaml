  md: '# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICETREE IN GENERAL AND SPI
    I2C IN PARTICULAR


    Although serial protocols such as SPI, I2C, and UART are significantly slower
    than higher-speed serial protocols as USB, Ethernet, Bluetooth, and Wi-Fi, they
    have the advantage of being much simpler and more economical in the use of code
    and hardware. They are well suited for scenarios involving communications between
    microcontrollers or between microcontrollers and sensors where the amount of data
    to be transferred is relatively small and where high data transmission rates are
    not needed.


    In serial protocols, the actual data are sent through a single wire, and there
    are two main strategies for sending the serial data, namely, asynchronous vs.
    synchronous. In a synchronous protocol as well as sending the data bits along
    one wire, a clock signal is sent along another wire. The clock signal tells the
    receiver when to read the signal level on the data wire. In an asynchronous protocol,
    only the data bits are sent, and the sender and receiver need to have agreed on
    a common data rate. Additionally, in asynchronous protocols, it is necessary to
    also send start bits and stop bits to “frame” the data bits.


    # SPI Explained


    The Serial Peripheral Interface (SPI) is widely used in embedded system applications.
    It is used, for example, in SD memory card modules, RFID card reader modules,
    and also in 2.4 GHz wireless transmitter/receivers in order to communicate with
    a microcontroller. SPI is a synchronous protocol. This means that a clock signal
    is sent on one wire and a data signal on another wire. This makes it possible
    to send data bits as a continuous stream rather than as individual framed data
    packets. The SPI protocol has been around for quite some time, being developed,
    originally by Motorola in the mid-1980s.'
