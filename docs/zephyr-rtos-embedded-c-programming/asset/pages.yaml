  md: '# CHAPTER 2 A REVIEW OF RTOS FUNDAMENTALS


    Managing tasks and their associated resources is a critical aspect of implementing
    real-time applications. For instance, when a task is terminated (deleted), it
    is important that any resources it was using are released or freed correctly.
    For systems with limited resources running on processors not having a memory management
    unit, dynamically creating and deleting multiple tasks can cause problems as difficulties
    of guaranteeing deterministic behavior, and the continuous creation and deletion
    of tasks increase the risk of memory fragmentation. Task creation may make sense
    where the target system is running a server supporting multiple clients.


    The need for testability and determinism in constrained embedded systems favors
    designs in which the number of tasks and the work they do as well as their priorities
    is fixed as part of the application design process.


    Many RTOS kernels, including Zephyr, provide an API that can control task scheduling.
    Such APIs contain methods for doing things such as suspending, resuming, delaying,
    and restarting tasks, as well as methods for getting and setting the priority
    of a task.


    RTOS APIs also, typically, provide methods for obtaining task details such as
    the IDs of the installed tasks, task control block information, and resources
    owned by a task.


    The tasks in an application may be either “run-to-completion” tasks or “infinite
    loop” tasks.


    A common scenario involving a “run-to-completion” task is that it is a high priority
    task that initializes and starts up a set of tasks associated with the application
    and ends itself. Most tasks in an application are “infinite loop” tasks.


    There is some debate about the merits of describing application code using pseudocode
    as part of the design and documentation process and using this pseudocode as a
    source of documentation. An alternative approach favors a “clean code” approach
    in which the only comments permitted in the code pertain to engineering decisions,
    and implicit documentation is contained in the use of descriptive names for functions
    and variables.'
