  md: '# Reconciling Certification with Open Source


    Reconciling an open source project with many potential contributors with a project
    that can produce safety-critical system certified software is tricky and represents
    “work in progress.”


    Various approaches are being explored and tried out. These include the following:


    +   - Snapshotting a Source Tree (branch), validating it then controlling updates,
    which is a viable approach to software qualification.

    - Defining the supported feature set as an up-front decision, bearing in mind
    that the more features that are supported, the greater the amount of documentation
    that will need to be provided and the amount of software testing that will need
    to be carried out. In this context, it will be important to automate as much of
    the information tracking as possible and to auto-generate documents from test
    and issue tracking systems.

    - Obtaining proof-of-concept approval from a certification authority as early
    as possible.


    An ideal project that can connect the best aspects of open source development
    and critical system certification will be one based on a split development model
    having a flexible open instance path and an auditable instance path [3]. Aligning
    the auditable path with the open instance path will be dictated by the need to
    add new features and the costs of the certification process.'
  merge: -1
