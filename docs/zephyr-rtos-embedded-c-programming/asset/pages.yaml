  md: '# CHAPTER 12 ZEPHYR RTOS WI-FI APPLICATIONS


    any level in the network protocol stack. These APIs can, for example, used to
    invoke scans on a Wi-Fi- or Bluetooth-based network interface, or to request notification
    if the IP address of a network interface changes.


    Because Zephyr applications are monolithic and like the operating system itself,
    only those routines that are required are compiled into the application, and application-specific
    network management code is provided by defining and registering handlers using
    a NET_MGMT_REGISTER_REQUEST macro. Procedure requests are then invoked with a
    single net_mgmt () API that invokes the handler that has been registered for the
    corresponding request. Function prototypes and macros for collecting information
    concerning receive and transmit packets are defined in the net_private.h header
    file located in the zephyr/subsys/net/ip folder.


    # # Requesting a Defined Network Management Procedure


    A network management request takes the form net_mgmt(mgmt_request, ...).


    The mgmt_request parameter is a bit mask that indicates the stack layer being
    targeted, and if a net_if object is implied and a specific management procedure
    is being requested. The procedure requests that are available depend on the way
    the stack has been implemented.


    # # Listening to Network Events


    The procedure to follow to receive notifications on network events is to register
    a callback function and to specify a filter to select the events of interest for
    which the callback will be invoked.'
