    as a Wi-Fi 6 companion IC [8, 9]. The nRF7002 DK uses an nRF5340 multiprotocol
    System-on-Chip (SoC) as the host processor for the nRF7002. The nRF7002 Wi-Fi
    Companion IC is designed to be power efficient and supports 2.4 GHz and 5 GHz
    dual-band Wi-Fi, Wi-Fi 6 Station (STA), compliance with 802.11a/b/g/n/ac/ax as
