    button press interrupt. Changing the transmission medium from LoRa to Bluetooth
    Low Energy (BLE) would only require replacing the LoRa thread with an analogous
    BLE thread.


    # The ZBus Code Reusability


    Suppose a given module has a set of well-defined behaviors and only uses ZBus
    channels as opposed to hardware channels. Such a module can readily be reused
    in other applications. If the new application implements the interfaces (set of
    channels) that the module needs to work with, this new application can be made
    to work together with that module.


    # Limitations of the ZBus


    The ZBus is better suited to some problems than others, and it is important to
    be aware of the limitations of the ZBus. For example, ZBus benchmarking will reveal
    that the ZBus is not well suited for sending a high-speed stream (megabits per
    second or higher) of bytes from one thread to another. That particular requirement
    might be better met by using a Pipe kernel object. Limitations to take into account
    include those concerning message delivery guarantees and those concerning message
    delivery sequence guarantees.


    # ZBus Message Delivery Guarantees and Message Delivery Rates


    Although ZBus will always deliver messages to listeners, this will not necessarily
    be the case for subscribers. This is because a subscriber will be sent a notification,
    and the reading of the message will depend on the way the subscriber has been
    implemented.'
  merge: -1
  pgno: 546
- img_proc: true
  md: 'Heuristics to use to increase the delivery rate include the following:


    +   - Making the listeners fast and,, where necessary, offloading more time-consuming
    processing by submitting that work to a workqueue

    - Assigning producer threads a high priority to avoid losses

    - Ensuring there are sufficient CPU resources available for observers to consume
    the data produced in a timely manner

    - Considering the use of message queues or pipes for fast transfer of streams
    of bytes


    # # ZBus Message Delivery Sequence Guarantees


    Listeners, being synchronous observers, will follow the channel definition sequence
    as their notification and message consumption sequence. Subscribers, on the other
    hand, which behave asynchronously, although they will receive notifications in
    the channel definition sequence, will consume the data when they run next. As
    a result, the priority assigned to the subscribers will serve to define the reaction
    sequence.


    In ZBus applications, all listeners (whether static or dynamic) will receive a
    given message before any of the subscribers receive the notification for that
    message. The rule for the sequence of delivery is that the order, from first to
    last, will be (SRLSRS)


    +   - Static listeners, then

    - Runtime listeners, then

    - Static subscribers, and finally

    - Runtime subscribers'
  merge: -1
