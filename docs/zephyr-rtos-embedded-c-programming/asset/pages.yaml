  md: 'its 15th edition, is a good starting point for those of who want to study CMake
    in greater depth [1]. The analogy between Ninja and Make is that “ninja is to
    assembly” as “make is to a high-level programming language.” Ninja was developed
    as a better tool than Make when building large complex projects. The intention
    was to have developers use of tools such as CMake to generate ninja build scripts
    instead of writing scripts manually. To dig deeper into Ninja, it is necessary
    to consult the official ninja documentation [2].


    For large complex projects, the corresponding CMake files can become quite complex,
    because they are often by including CMake parts from various parts of the project.
    This is the case with Zephyr projects. The CMake file in the application directory
    is usually quite small. The actual CMake file that drives the build is constructed
    by “pulling in” CMake files from other parts of the Zephyr source code. CMake
    has command-line options for producing verbose output (lots and lots of output
    in the case of Zephyr application builds), which can be invoked via the line options
    --trace, --trace-expand, and --trace-source=some_cmake_source. When trying to
    make sense of CMake usage in building Zephyr applications, a good approach is
    to learn how to “read and understand” CMake files and then to explore the various
    Zephyr CMake files by piece.


