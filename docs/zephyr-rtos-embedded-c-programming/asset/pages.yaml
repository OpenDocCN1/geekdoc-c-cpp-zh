  md: '# Using Filesystems in Zephyr Applications


    Many IoT and IIoT systems and applications running on them fall into the “middle
    ground where bare metal multitasking has implications from the point of view of
    “cross-platform” portability and the use of standardized APIs (Application Programming
    Interfaces). Applications using systems in this “middle ground” have, sometimes,
    a requirement to store persistent information in a “structured way” using some
    kind of file system.


    SRAM is a limited resource in the kinds of systems being considered here, and
    hence, implementing a small file system in RAM may not be an optimal solution.


    The file systems discussed in this section, FatFs and LittleFS, are, typically
    built on top of QSPI flash memory, or on SD/MMC card-based systems.


    This chapter will begin by introducing QSPI flash and SD/MMC and how they are
    supported in Zephyr RTOS. This will be followed by an introduction and overview
    of FatFs and LittleFS systems and how are supported in Zephyr RTOS.


    This, in turn, will be followed by an introduction and overview of Zephyr RTOS
    support for a “generic POSIX-like” file system API.'
