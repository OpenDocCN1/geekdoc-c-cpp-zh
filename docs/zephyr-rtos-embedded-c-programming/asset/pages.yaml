  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVCETREE IN GENERAL AND SPI\
    \ I2C IN PARTICULAR\n\nUsing the I2C interface on an nRF5 device and using EasyDMA,\
    \ the node will be “i2c” node of the Nordic nRF family TWIM (TWI) master with\
    \ EasyDMA), namely, nordic,nrf-twim. The node specific properties for this type\
    \ of node can be found in Zephyr documentation [8] and the nRF Connect SDK documentation\
    \ [9].\n\nThe overlay for the BME280 sensor attached to an I2C bus controller\
    \ shown as follows:\n\n```\n&i2c0 {\n    compatible = \"nordic, nrf-twim\";\n\
    \    status = \"okay\";\n    sda_pin = <26>;\n    scl_pin = <27>;\n    mysensor:\
    \ bme280@77 {\n        compatible = \"bosch, bme280\";\n        reg = <077>;\n\
    \        label = \"BME280\";\n    }\n}\n```\n\nSetting up the sensor device attached\
    \ to the I2C bus, the sensor is a child of the I2C bus controller – where the\
    \ node is i2c0. The BME280 node has the same compatible as for the SPI example\
    \ covered previously, but because of the tree hierarchy, the driver will know\
    \ that the communication is for I2C and that I2C should be used. Here, reg = <077>,\
    \ which is the address to be used by the i2c0 bus master to communicate with the\
    \ sensor.\n\nUsing the preceding overlay, the code for the I2C sensor that corresponds\
    \ to shown previously for the SPI sensor will be the same:\n\n```\nconst struct\
    \ device *dev = DEVICE_DT_GET(DT_NODABEL(mysensor));\nif (!device_is_ready(dev))\
    \ { return; }\n```"
