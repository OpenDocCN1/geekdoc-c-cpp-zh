  md: '# CHAPTER 5 MESSAGE QUEUES, PIPES, MAILBOXES, AND WORKQUEUES


    +   - Where there is no compatible thread, the receiving thread may choose to
    block for one to arrive, for the time specified in the API call. It is considered
    a failure if no compatible thread arrives before the expiry time limit is reached.


    +   - Once the receive operation has completed, the receive thread can examine
    the message details in the message descriptor.


    Multiple threads can wait concurrently on the receive queue of the mailbox.


    +   - The threads are sorted in order of priority, and in the case of multiple
    threads with equal priorities, the thread chosen is the one that has been waiting
    the longest (i.e., the one that arrived first at the mailbox).


    The order in which messages are received will be influenced by the thread compatibility
    constraints specified in the message descriptors. This may result in threads not
    necessarily being received in a FIFO order, for example, in a scenario where thread
    A is waiting to receive a message from thread X and later on thread B arrives
    and waits to receive a message from thread Y. In this case, a message from thread
    Y directed to any thread will be passed to thread B, and thread A will continue
    waiting.


    The receiving thread can control the amount of data it retrieves from the incoming
    message and where data will be placed. The thread may, for example, choose to
    fetch all of the message data, or part of it or none at all.


    The possible options for retrieving message data are either to retrieve the data
    at receive time or to retrieve the data into a designated message buffer at some
    later point in time.'
