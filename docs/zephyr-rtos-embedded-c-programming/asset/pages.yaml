  md: "# CHAPTER 7 DEVELOPING ZEPHYR BLE APPLICATIONS\n\nThe code makes extensive\
    \ use of GNU extensions to specify details such as the packing and alignment of\
    \ data structures. For example, the bt_att_signed_write_cmd is defined in the\
    \ following way:\n\n```\n/* Signed Write Command */\n#define BT_ATT_OP_SIGNED_WRITE_CMD\
    \ Oxd2\nstruct bt_att_signed_write_cmd {\n    uint16_t handle;\n    uint8_t value[0];\n\
    } __packed;\n```\n\nHere, although the size of a zero-length array is zero, an\
    \ array member of this kind may increase the size of the enclosing type as a result\
    \ of tail padding. The offset of a zero-length array member from the beginning\
    \ of the enclosing structure is the same as the offset of an array with one or\
    \ more elements of the same type. The alignment of a zero-length array is the\
    \ same as the alignment of its elements. The __packed qualifier forces the alignment\
    \ of all the fields of a structure/union on a single boundary (i.e., with no padding).\
    \ The constraints on using the __packed qualifier are that it cannot be used for\
    \ structures or unions with floating-point fields. Neither it can be used for\
    \ structures that were previously declared without __packed, and it applies to\
    \ all the members of a union or structure when that is declared using __packed.\
    \ In particular there is no padding between members of the data structure, or\
    \ at the end of the structure. Also, all the substructures of a packed structure\
    \ must also have been declared using __packed. This packing and alignment to a\
    \ byte level is very well suited to transmission of packed byte-oriented data.\n\
    \nThe header file dealing with UUIDs is zephyr/includezephyr/bluetooth/uuid.h.\n\
    \nIt contains many data structure definitions as well as helper macros and builder\
    \ macros."
