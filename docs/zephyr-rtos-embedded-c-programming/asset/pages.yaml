  md: "# CHAPTER 9 UNDERSTANDING AND WORKING WITH THE DEVICEETREE IN GENERAL\nSPI\
    \ AND I2C IN PARTICULAR\n\n# Working with reg and interrupts Properties\n\nThere\
    \ are special (specific) macros for working with reg and interrupts properties.\n\
    \nFor a node that has only one register block, DT_REG_ADDR(node_id) can be used\
    \ to obtain the register block address for that node, and DT_REG_SIZE(node_id)\
    \ can be used to obtain its size.\n\nWhere a node has multiple register blocks,\
    \ the macro DT_REG_ADDR_BY_IDX(node_id, idx) or DT_REG_SIZE_BY_IDX(node_id, idx)\
    \ should be used instead. DT_REG_ADDR_BY_IDX(node_id, idx) gives the address of\
    \ register block at index idx, and DT_REG_SIZE_BY_IDX(node_id, idx) gives the\
    \ size of the block at index idx. The idx argument must be an integer literal\
    \ or a macro that expands to an integer literal without any arithmetic. The idx\
    \ cannot be a variable. The following snippet will result in a compiler error:\n\
    \n```\nfor (size_t i = 0; i < DT_NUM_REGS(node_id); i++) {\n  size_t addr = DT_REG_ADDR_BY_IDX(node_id,\
    \ i);\n}\n```\n\nThere are also macros for working with interrupts properties.\n\
    Given a node identifier node_id, DT_NUM_IRQS(node_id) can be used to get the total\
    \ number of interrupt specifiers in the interrupts property for that node. Interrupt\
    \ specifiers can be accessed with the macro DT_IRQ_BY_IDX(node_id, idx, val) where\
    \ idx is the logical index into the interrupts array and the val argument is the\
    \ name of a cell within the interrupt specifier.\n\nThe DT_HANDLE(), DT_HANDLE_BY_IDX(),\
    \ and DT_HANDLE_BY_NAME() macros provide a means for converting a handle to a\
    \ node identifier."
