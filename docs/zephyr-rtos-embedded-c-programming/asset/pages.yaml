  md: '# CHAPTER 3 ZEPHYR RTOS APPLICATION DEVELOPMENT ENVIRONMENTS AND

    ZEPHYR APPLICATION BUILDING PRINCIPLES


    In principle, a UART only requires two signal lines to successfully communicate:
    a TXD (transmit data) and RXD (receive data) line as well as a common ground line
    (used as a reference point). When communicating with another UART device, the
    TXD line will be attached to a corresponding RXD line, and vice. No clock line
    is used with the UART protocol. Rather, users specify a particular baud rate for
    the two devices to operate at. The UART standard specifies two extra lines, RTS
    (to send) and CTS (to send). The RTS and CTS lines, if connected, are responsible
    for flow control. If flow control is disabled, these two pins are not used.


    The USB connection between the interface MCU and the PC can forward data sent
    sent from the nRF52840 processor to the PC. From the PC’s point of view, this
    USB connection is behaving as a serial connection, with a virtual COM port. The
    virtual COM port is configurable, with a flexible baud rate setting up to 1 Mbps.
    It also supports Dynamic Hardware Flow Control (HWFC) handling if configured.


    From the perspective of experimenting with various multithreading coding patterns,
    the virtual COM port-based UART is valuable because it is the port used when the
    Zephyr kernel printf() function is used to send text strings to a PC console terminal.
    To a certain extent, the Zephyr RTOS printf() mimics the corresponding printf()
    used in Linux kernel programming, printf() is a printf()-like function that supports
    a subset of the printf() format specifiers. From the application real-time performance
    point of view, it is worth remembering that the output of printf() is not deferred
    but is immediately sent to the console without any mutual exclusion or buffering
    and that printf() will not return until all the bytes of the message have been
    sent. Bearing this, in mind, the use of printf() in time-critical applications
    is best avoided.'
