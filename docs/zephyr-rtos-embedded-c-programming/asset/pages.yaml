- img_proc: true
  md: '# File Systems – A High-Level Overview


    File systems, essentially, organize storage on disk drives. From the system point
    of view, the typical file system design is a layered design. The lowest layer
    is provided by the physical devices on which the file system is installed. Above
    this layer is an I/O control layer and its associated low-level device drivers.
    The next layer is the basic file system-level layer that is concerned with retrieving
    and storing raw blocks of data. Raw blocks or data are read and written without
    needing to know exactly what is present in each block. The next level up is associated
    with file organization. A file organization module is aware of files, their logical
    blocks, and how these map to physical blocks on the disk. Its responsibilities
    include the translation from logical to physical blocks, maintaining a list of
    free blocks and allocating free blocks to files as required. The logical file
    system layer deals with file details (file metadata), which are distinct from
    the data held in the file itself.


    The main advantage of a layered approach to file system realization is that it
    makes it possible for the same code to be used on various different file systems
    and only for some file system-specific layers. See Figure 6–8.'
