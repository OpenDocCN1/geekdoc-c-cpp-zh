  md: '# BLE: A Short History


    What is now BLE began as a Nokia research project concerned with the development
    of a wireless technology derived from the Bluetooth standard, which could provide
    lower power usage while making use of the existing Bluetooth technology standards.
    Continued development work led to Vibree, which was released in 2006 and was,
    later, incorporated into evolving Bluetooth standard specification as a Bluetooth
    ultra-low-power technology. This was initially called Bluetooth Smart and integrated
    into version 4.0 of the Core Specification in 2010. The first smartphone to implement
    the 4.0 specification was the iPhone 4S, released in October 2011.


    The latest version of BLE, as part of Bluetooth 5, was announced in 2016 by the
    Bluetooth SIG. BLE 5 added features such as increasing the range of BLE by using
    increased the transmit power, use of coded physical layer approaches and increasing
    the advertising data length of low-energy Bluetooth transmissions as compared
    to Bluetooth 4.x. In a more recent development, the Bluetooth SIG released a Mesh
    Profile and Mesh Model specifications in 2017 for use in many-to-many device communications
    applications such as, for example, home automation and distributed sensor networks.


    The range of a BLE transmission depends on the environment of the communicating
    BLE device and the mode being used, standard mode vs. long-range mode. The typical
    range is 10–30 meters.


    To transfer data from a BLE device to the Internet, another BLE device (BLE Gateway)
    that has an IP connection is required. Typically this involves connecting a BLE-capable
    sensor or BLE-capable controller to a BLE Gateway that can connect to the Internet.'
  merge: -1
