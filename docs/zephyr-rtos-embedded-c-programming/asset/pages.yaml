    In this scenario, a button 1 press interrupt handler issues a give operation to
    a synchronizing binary semaphore, the sender semaphore, that the message sending
    thread is blocking on.


    The message sending thread, itself, runs in a loop. At the start of the loop,
    the thread performs a take operation on the synchronizing binary semaphore. This
    means that it will block on the next loop iteration unless a button 1 press has
    released the synchronizing sender semaphore. Once unblocked, the thread posts
    a message to the message queue. The message data specifies which led to flash
    and the number of times to flash it. When the message queue is full, a “mailbox
    full” message is sent to the console, and the button 1 press will have no effect.


    The button 2 press interrupt handler issues a give operation to a synchronizing
    binary semaphore, the receiving semaphore, that the receiving thread is blocking
    on. In this case, also, the message receiving thread, itself, runs in a loop.
    At the start of the loop, the thread performs a take operation on the synchronizing
    binary semaphore. This means that it will block on the next loop iteration unless
    a button 2 press has released the synchronizing sender semaphore. Once unblocked,
    the thread will get a message from the message queue. The receiving thread will
    send details of the received message, it will flash the designated led the specified
    number of times. While the LED is being flashed, a busy flag is set, and if button
    2 is pressed while flashing is in progress, then a “busy” message will be sent
    to the console, and the button 2 press handler will not retrieve a message from
    the mail queue. If the message queue is empty, an “empty mailbox” is sent to the
    console.


