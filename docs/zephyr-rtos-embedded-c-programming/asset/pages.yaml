  md: '# Iterating over Channels and Observers


    Because the use of the ZBus envisages multiple channels and multiple observers,
    the need for a convenient mechanism to iterate over such collections of channels
    and observers is obvious. Zephyr''s solution to this is Iterable Sections and
    its associated API.


    An iterable area is a block of memory containing a number of sized data structures
    that can be iterated over using the STRUCT_FOREACH macro.


    When setting an iterable section, background linker processing is necessary. As
    part of the compilation process, the linker has to be instructed to place the
    iterable structure in a contiguous memory segment using one of the linker macros
    as ITERABLE_SECTION_RAM or ITERABLE_SECTION_ROM. Custom linker snippets can be
    declared using one of the zephyr_linker_sources() CMake functions, providing the
    appropriate section identifier, namely, DATA_SECTIONS for RAM structures and SECTIONS
    for ROM-based structures.


    The ZBus subsystem provides an implementation of Iterable Sections for channels
    and observers and supporting API functions such as zbus_iterate_over_channels(),
    zbus_iterate_over_channels_with_user_data(), zbus_iterate_over_observers(), and
    zbus_iterate_over_observers_with_user_data(). This makes it possible to call a
    procedure over all the declared channels, with a procedure parameter of type pointer
    to a zbus_channel. The execution sequence proceeds in the alphabetical order of
    the channels.


    ZBus implements a similar feature for zbus_observer.


    The following code snippet shows a typical implementation pattern for iterating
    over channels and observers. It involves implementing suitable “iterator” functions
    that can be used to collect and extract information during the iteration process
    then applying these functions.'
