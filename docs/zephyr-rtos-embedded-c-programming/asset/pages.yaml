    Zephyr threads may have various options associated with them, some of which may
    be processor architecture specific. Thread options are, essentially, bit fields
    corresponding to special thread handling requirements and are specified when the
    thread is spawned.


    A thread that does not require any thread option has an option value of zero,
    and a thread can have multiple options by bitwise OR’ing the required option bits.
    A particularly significant option is K_ESSENTIAL, which tags a thread as an essential
    thread. Zephyr will treat the termination or aborting of an essential thread as
    a fatal system error.


    The K_FP_REGS option is used to indicate that the thread uses the CPU floating-point
    registers. If this option is set, the kernel will take additional steps to save
    and restore the contents of the floating-point registers when scheduling the thread,
    as opposed to the default behavior where the kernel does not attempt to save and
    restore the contents of floating-point registers'
