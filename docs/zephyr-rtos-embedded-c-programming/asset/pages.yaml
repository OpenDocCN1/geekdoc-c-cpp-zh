    The complexity of all the configurations is that the application being built is
    a monolithic application, in contrast to a similar Linux application where much
    of the functionality is built into the kernel and is accessible via suitable utilities
    and system calls.


    # Basic TCP/IP Application ProgrammingnUsing the nRF7002 DK


    A Wi-Fi access point has hub-like behavior as well as bridge-like behavior. Only
    one frame can be successfully transmitted at a time, and collisions do occur,
    as is the case for a hub. An access point must receive an entire frame before
    forwarding it, and the frame is forwarded or filtered based on the destination
    MAC address, which is bridge-like behavior. The wireless clients associated with
    an access point (AP) constitute a Local Area Network (LAN), and it is possible
    to configure these clients with static (manually configured) IP addresses. An
    alternative is to configure the client IP addresses dynamically using the DHCP
    protocol. One way to do this would to set up a DHCP server on the local Wi-Fi
    LAN. Alternatively, if the access point is combined with a router (i.e., part
    of a Wi-Fi router) it is possible to makeuse of the DHCP server on the router
    itself. More complex Wi-Fi setups can be created using APs that can act as mesh
    repeaters [6], for example, by using Cisco Meraki MR access points. Because repeaters
    also support wired clients plugged into their wired interfaces, they can also
    be used to bridge remote LAN'
