    Both of these intuitively obvious methods will produce a smaller set of values
    that should be adequate for testing purposes, by dividing the values into partitions
    that are meaningful for the program being tested. One value is selected for each
    partition. The objective is to partition the input space such that any value selected
    from the partition will affect the program under test in the same way as any other
    value in the partition. Thus, ideally if a test case contains a parameter x which
    has value y, replacing x with any other value from the partition will not affect
    the test result. This ideal may not always be achieved in practice.


    How should the partitions be determined? One, but not necessarily good, approach
    is to simply select values from various points on the range of a variable. For
    example, if capacity can range from 0 to 20,000, it might be sensible to select
    0, 10,000, and 20,000 as possible values. But this approach is likely to miss
    important cases that depend on the specific requirements of the system under.
    Some judgment is involved, but partitions are usually best determined from the
    specification. In this example, 9 am and 5 pm are significant, so 0540 (9 hours
    past midnight) and 1020 (17 hours past midnight) determine the appropriate partitions:


