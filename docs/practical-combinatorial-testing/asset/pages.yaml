    # 8 Assertion-Based Test Oracles


    Many programming languages include an assert feature that allows the programmer
    to specify properties that are assumed at a particular point in the program. For
    example, a function that has a division in which a particular parameter x will
    be used as a divisor may require that this parameter never be zero. This function
    may include the C statement assert(x != 0); as the first statement. Note that
    the assertion is not the same as an input validation that checks an error message
    if input is not acceptable. The assertion gives conditions that must hold for
    the function to operate properly, in this case a non-zero divisor. It is the responsibility
    of the programmer to ensure a zero divisor is never passed to the function. The
    distinction between assertions and input validation is that assertions are intended
    to catch programming mistakes, while input validation detects errors in user or
    file/database input.


    With a sufficient number of assertions derived from a specification, the program
    can have a self-checking property [27, 60, 47]. The assertions can serve as a
    embedded proof of important properties, such that if the assertions hold for all
    executions of the program, the properties encoded in them are guaranteed to hold.
    Then, if the assertions form a chain of logic that implies a formal statement
    of program properties, the program''s correctness with respect to these properties
    is proven. We can take advantage of this scheme in combinatorial testing by demonstrating
    that assertions hold for all i-way combinations of inputs. While this is not as
    strong as a correctness proof, it is an effective way of integrating formal methods
    for correctness with program testing, and an extensive body of research has developed
    this idea for practical use (for a survey, see [4]). Modern programming languages,
    such as Eiffel [52], include extensive support for including assertions that encode
    program properties, and tools such as the Java Modeling Language [42] have been
    designed to integrate assertions with testing. In many cases, using assertions
    to self-check properties makes it practical to run thousands of tests in a fully
    automated fashion, so high-strength interactions of 4-way and above can be done
    in reasonable time.


    > With self-checking assertions, thousands of tests can often be run at very low
    cost, allowing high-strength interaction coverage.


    # 8.1 Basic Assertions for Testing


    To clarify this abstract discussion, we will analyze requirements for a small
    function that handles withdrawal processing for an automated teller machine (ATM).
    Graphical interface code for the ATM will not be displayed, as this would vary
    considerably for different systems. The decision not to include GUI code in this
    example also illustrates a practical limitation of this type of testing: there
    are many potential sources of error in a software project, and testing may not
    deal with all of them at the same time. The GUI may be analyzed separately, or
    a more complex verification with assertions may specify properties of the GUI
    calls, but in the end some human involvement'
