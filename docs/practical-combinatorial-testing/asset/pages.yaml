    # 9 MODEL-BASED TEST ORACLES


    One of the most effective ways to test oracles is to use a model of the system
    under test, and generate complete tests, including both input data and expected
    results, directly from the model. The model in this case is exactly what the name
    implies: it incorporates the most important aspects of the system, but not every
    detail such as the location of an answer on screen (if it did include all details,
    it would be equivalent to the system itself). This chapter provides a step-by-step
    introduction to model-automated generation of tests that provide combinatorial
    coverage. Procedures introduced in this tutorial will produce a set of complete
    tests, i.e., input values with the expected output for each set of inputs.


    In addition to the ACTS covering array generator (Appendix C), we use NuSM [18],
    a variant of the original SMV model checker. NuSM is freely available and developed
    by Carnegie Mellon University, Istituto per la Ricerca Scientifica e Tecnologica
    (IRST), U. of Genova, and U. of Trento. NuSM can be installed on UNIX/Linux or
    Windows systems running Cygwin. Links and instructions for downloading NuSM are
    included in the appendix.


    Also needed is a formal or semi-formal specification of the system or subsystem
    under test (SUT). This can be in the form of a formal logic specification, but
    state transition tables, decision tables, and structured natural language can
    also be used, as long as the rules are unambiguous. Specification can be converted
    to SMV code, which provides a precise, machine-processable set of rules that can
    be used to generate tests.


    # 9.1 Overview


    To apply combinatorial testing, two tasks must be accomplished:


    +   1. Using ACTS, construct a set of tests that will cover t-way combinations
    of parameter values. The covering array specifies data, where each row of the
    array can be regarded as a set of parameter values for an individual test (see
    Chapter 4).


    +   2. Determine what output should be produced by the SUT for each set of input
    parameter values. The test data output from ACTS will be incorporated into SMV
    specifications that can be processed by the NuSM model checker. In many cases,
    the conversion to SMV is straightforward. The example in Section 9.2.1 illustrates
    a simple conversion of rules in the form "if condition then action" into the syntax
    used by the model checker. The model checker will instantiate the specification
    with parameter values from the covering array for each test in the covering array.
    The resulting specification is evaluated against a claim that negates each specified
    result $R_j$ using a model checker, so that the model checker evaluates claims
    in the following: $C_i \sim R_p$, where $C_i$ is a set of parameter values in
    one row of the covering array in the form $p_1 = v_{i1} \& p_2 = v_{i2} \& \&
    \&$


    47'
