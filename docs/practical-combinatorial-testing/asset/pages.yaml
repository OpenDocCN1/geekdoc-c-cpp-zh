    # 3.3 Cost and Practical Considerations


    # 3.3.1 Invalid Combinations and Constraints


    The system described in Section 3.1 illustrates a common situation in all types
    of testing: some combinations cannot be tested because they don''t exist for the
    systems under test. In this case, if the operating system is other OS X or Linux,
    Internet Explorer is not available as a browser. Note that we cannot simply delete
    tests with these untestable combinations, which would result in losing combinations
    that are essential to test but are not covered by other tests. For example, deleting
    tests 5 and 7 in Section 2.1.1 would mean we would also lose the test for Linux
    with the IPv6 protocol.


    One way around this problem is to delete tests and supplement the test suite with
    manually constructed configurations to cover the deleted combinations, but array
    tools offer a better solution. With ACTS we can specify constraints, which the
    tool not to include specified combinations in the generated tests. ACTS supports
