    # 6.2.3 Variable-Value Configuration coverage


    So far we have only considered measures of the proportion of combinations for
    which all configurations of $t$ are fully covered. When $t$ variables with $v$
    values are considered, each $t$-tuple has $v^t$ configurations. For example, in
    pairwise (2-way) coverage of binary variables, every 2-way combination has four
    combinations: 00, 01, 10, 11. We can define two measures with respect to configurations:


    **Definition.** For a given combination of $t$ variables, variable-value configuration
    coverage is the proportion of variable-value configurations that are covered.


    **Definition.** For a set of $n$ variables, $(p, t)$-completeness is the proportion
    of the $C(n, t)$ combinations that have configuration coverage of at least $p$
    [50].


    **Example.** For Figure 16, there are $C(4, 2) = 6$ possible variable combinations
    and $C(4,2)2^2 = 24$ possible variable-value configurations. Of these, 19 variable-value
    configurations are covered, and the only ones missing are ab=11, ac=11, ad=10,
    be=01, bc=10. While only two, $bd$ and $cd$, are covered with all 4 value pairs.
    So for the basic definition of $t$-way coverage, we have only $33\%(2/6)$ coverage,
