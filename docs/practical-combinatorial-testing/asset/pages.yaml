    \ the total number of combinations instantiated with values that must be covered\n\
    \n$\binom{n}{t}$ (1)\n\nFortunately, each test $t$ covers $C(n, t)$ combination\
    \ configurations. This is the source of combinatorial testing's power. With 34\
    \ binary variables, we need $2^{34} = 1.7 \times 10^{10}$ tests to cover all possible\
    \ configurations, but with only 33 tests we can cover all 3-way combinations of\
    \ these 34 variables. This happens because each test covers $C(34, 3)$ combinations.\n\
