    # 5 SEQUENCE-COVERING ARRAYS


    In testing event-driven software, the critical condition for triggering failures
    is often whether or not a particular event has occurred prior to a second one,
    not necessarily if they are back to back. This situation reflects the fact that
    in many cases, a particular state must be reached before a particular failure
    can be triggered. For example, a failure might occur when connecting device A
    only if device B is already connected. The methods described in this chapter were
    developed to solve a real problem in interoperability test and evaluation, using
    combinatorial methods to provide efficient testing. Sequence covering arrays,
    as defined here, ensure that any t events are tested in every possible t-way order.


    For this problem we can define a sequence-covering array [39, 40], which is a
    set of tests that ensure all t-way sequences have been tested. The t events in
    the sequence may be interleaved with others, but all permutations will be tested.
    For example, we may have a component of a factory system that uses certain devices
    interacting with a control program. We want to test the events defined in Table
    6.


    > In many systems, the order of inputs is important.


    There are 6! = 720 possible sequences for these six events, and the system should
    respond correctly and not matter the order in which they occur. Operators may
    be instructed to use a particular order, but mistakes are inevitable, and should
    not result in injury to users or compromise the enterprise. Because setup, connections
    and operations of this component are manual, each test can take considerable amount
    of time. It is not uncommon for system-level tests as this to take hours to execute,
    monitor, and complete. We want to test this as thoroughly as possible, but constraints
    do not allow for testing all possible sequences, so we will test all 3-event sequences.


    With events, a, b, c, d, e, and f one subset of three is {[b, d, e}, which can
    be arranged in permutations: [b e d] [b d e] [d b e] [e b d]. A test covers the
    permutation [b d e]: [a d c f e]; another is [a d e b]. A larger system may have
    10 devices to connect, in which the number of permutations is 10!, or 3,628,800
    tests for exhaustive testing. In that case, a 3-way sequence covering array with
