    a much smaller problem. For example, if a project uses combinatorial testing for
    a system that has 20 parameters and several hundred tests, a much larger system
    with 40 to 50 parameters may only require a few dozen more tests. Combinatorial
    methods may generate the best cost benefit ratio for large systems.


    # 4.4 Chapter Summary


    +   1. The key advantage of combinatorial testing derives from the fact that,
    nearly all, software failures appear to involve interactions of only a few parameters.
    Generating a covering of input array allows us to test all of these interactions,
    up to a level of 5-way or 6-way combinations, depending on resources.


    +   2. Practical testing often requires abstracting the values of a variable into
    a small set of equivalence classes. For example, if a variable is a 32-bit integer,
    it is clearly not possible to test the full range of values in -2^31. This problem
    is not unique to combinatorial testing, but in most test methodologies. Simple
    heuristics and engineering judgment are required to determine the appropriate
    portioning of values into equivalence classes, but once this is accomplished it
    is possible to generate covering arrays of a few hundred to a few thousand tests
    for many applications. The thoroughness of coverage will depend on resources and
    criticality of the application.'
