    is 100%, by definition, but many test sets not based on covering arrays may still
    provide significant-tway coverage. If the test set is large, but not designed
    as a covering array, it is very possible that it provides 2-way coverage or better.
    For example, random input generation may have been used to produce the tests,
    and branch or condition coverage may have been achieved. In addition to the structural
    coverage figure, for software assurance it would be helpful to know what percentage
