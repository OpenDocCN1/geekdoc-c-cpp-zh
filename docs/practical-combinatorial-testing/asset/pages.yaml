    Our task is to develop a covering array of tests for these inputs. The first step
    will be to develop a table of parameters and possible values, similar to that
    in Section 3.1 in the previous chapter. The only difference is that in this case
    we are dealing with input parameters rather than configuration options. For the
    most part, the task is simple: we just take the values directly from the specifications
    or code, as shown in Figure 10. Several'
