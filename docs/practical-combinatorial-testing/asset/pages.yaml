  md: '# Practical Combinatorial Testing


    # 6 MEASURING COMBINATORIAL COVERAGE


    Since it is nearly always impossible to test all possible combinations, combinatorial
    testing is a reasonable alternative. For some value of $t$, testing all $t$-way
    interactions among n parameters will detect nearly all errors. It is possible
    that $t = n$, but recalling the empirical data on failures, we expect $t$ to be
    relatively small. Determining the level of input or configuration state space
    coverage can help in understanding the degree of risk that remains after testing.
    If 90% - 100% of the state space has been covered, presumably the risk is small,
    but if coverage is much smaller, then the risk may be substantial. This chapter
    describes some measures of combinatorial coverage that can be helpful in estimating
    this risk that we have applied to spacecraft software [50] but have general application
    to any combinatorial coverage problem.


    # 6.1 Software Test Coverage


    Test coverage is one of the most important topics in software assurance. Users
    would like some quantitative measure to judge the risk in using a product. For
    a given test, what can we say about the combinatorial coverage it provides? With
    physical products, such as light bulbs or motors, reliability engineers can provide
    a probability of failure within a particular time frame. This is possible because
    the failures in physical products are typically the result of natural processes,
    such as metal fatigue.


    With software it is more complex, and many different approaches have been devised
    for determining software test coverage. With millions of lines of code, or even
    a few thousand, the number of paths through a program is so large that it is impossible
    to test all paths. For each statement, there are a sequence of n statements result
    in $2^n$ possible paths. Even a small program with 270 statements in an execution
    trace may have more paths than there are atoms in the universe, which is on the
    order of $10^{80}$. Loops (while statements) the number of paths is literally
    infinite. Thus a variety of measures have been developed to gauge the degree of
    test coverage. The following are some of the better-known coverage metrics:


    +   *Statement coverage: This is the percentage of statements exercised by the
    test set. While it may seem at first that 100% statement coverage should provide
    good confidence in the program, in practice, statement coverage is a relatively
    weak criterion. At best, statement coverage represents a sanity check: unless
    statement coverage is close to 100%, the test set is probably inadequate.


    +   *Decision or branch coverage: The percentage of branches that have been evaluated
    to both true and false by the test set.'
