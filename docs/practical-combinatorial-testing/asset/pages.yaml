    can now consolidate these heuristics for identifying the failure-triggering combination(s)
    C.


    +   - For a deterministic system, F\P must contain the fault-triggering combinations
    C if any of them were in P, then the test would have failed.


    +   - Interaction lower bound: If all t-way tests fail, then a t-way or lower
    combination did not fail. The failure must have been caused by a (t+k)-way combination,
    for some k > t. Note that the converse is not necessarily true: if some t-way
    tests fail, we cannot conclude that a t-way test caused the failure, because any
    t-way test contains some k-way combinations, for k > t.


    +   - Interaction continuity: Now consider Ct. Because t-way tests cover all combinations
    of t-way or lower strength (e.g., 4-way tests also cover all 3-way combinations),
    a combination that triggered the failure in Ft must also be in F(t+1), F(t+2),
