    # 8.2 Stronger Assertion-based Testing


    While the method described in the previous section can be very effective in testing,
    notice that it will be inadequate for many problems, because basic assertion functions
    as in C language library do not support logic operators as ∀ (for all) and ∃ (for
    some). Expressing simple properties such as S is sorted in ascending order = ∀:0≤i<n-1:S[i]≤S[i+1]
    cannot be done without a good deal of adding coding. While would be possible to
    add code to handle these problems in assertions, a better solution is to use an
    assertion language that is designed for the purpose and contains all the necessary
    features.


    Tools such as Anna [44] for Ada, the Java Modeling language (JML) [42] and iContract
    [28] for Java, and APP [57] or Nano [46] for C, can be used to introduce complex
    assertions, embedding a formal specification within the code. The embedded assertions
    as an executable form of the specification, providing an oracle for the testing
    phase. With embedded assertions, exercising the application with all t-way combinations
    can provide reasonable assurance that the code works correctly across a wide range
    of inputs. This approach has been used successfully for testing smart cards, with
    embedded JML assertions as an oracle for combinatorial tests [25]. Results showed
    80%- 90% of errors could be found in this way.'
