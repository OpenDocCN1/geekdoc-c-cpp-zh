    For $n$ variables, there are $n!$ permutations and $\binom{n}{t} = \\frac{n!}{t!(n-t)!}$\
    \ ($n$ choose $t$) combinations\n\nof $t$ variables, also needed for convenience\
    \ as $C(n, t)$. To exercise all the $t$-way combinations of inputs to a program,\
    \ we need to cover all $t$-way combinations of variable values, and each $v$ can\
