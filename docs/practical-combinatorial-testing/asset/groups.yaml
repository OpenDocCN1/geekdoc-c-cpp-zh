    ## 3.2 Smart Phone Application Example


    Smart phones have become enormously popular because they combine communication
    capability with graphical displays and processing capability. Literally tens of
    thousands of smart phone applications, or ‘apps’, are developed annually. Among
    the platforms for smart phone apps is Android, which includes an open source development
    and specialized operating system. Android units contain a large number of configuration
    options that control the behavior of the device. Android apps must operate across
    a variety of hardware and software platforms, since not products support the same
    options. For example, some smart phones may have a physical keyboard and others
    present a soft keyboard using the touch screen. Keyboard may be either numeric
    with few special keys, or a typewriter keyboard. Depending on the type of the
    app and user choices, the keyboard may be visible or hidden. Ensuring that a particular
    app works the enormous number of options is a significant challenge for developers.
    The extended set of options makes it intractable to test all configurations, so
    combinatorial testing is a practical alternative.


