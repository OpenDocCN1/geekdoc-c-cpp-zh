- md: "\n## Executive Summary\n\nSoftware implementation errors are one of the most\
    \ significant contributors to information system security vulnerabilities, making\
    \ software testing an essential part of system assurance. In 2003 NIST published\
    \ a widely cited report which estimated that inadequate testing costs the US economy\
    \ $59.5 billion per year, even 50% to 80% of development budgets go toward testing.\
    \ Exhaustive testing – testing all possible combinations of inputs and execution\
    \ paths – is impossible for real-world software, so high assurance testing is\
    \ used with methods that require extensive staff time and have enormous cost.\
    \ For less critical software, budget constraints often limit the amount of testing\
    \ that can be accomplished, increasing the risk of residual errors that lead to\
    \ system failures and security weaknesses.\n\nCombinatorial testing is a method\
    \ that can reduce cost and increase the effectiveness of software testing for\
    \ many applications. The key insight underlying this form of testing is that not\
    \ every parameter contributes to every failure and most failures are caused by\
    \ interactions between relatively few parameters. Empirical data gathered by NIST\
    \ and others suggest that software failures are triggered by only a few variables\
    \ interacting (6 or fewer). Finding this has important implications for testing\
    \ because it suggests that combinatorial combinations of parameters can provide\
    \ highly effective fault detection. Pairwise (2-way combinations) testing is sometimes\
    \ used to obtain good results at low cost, but pairwise testing may miss 10% to\
    \ 40% or more of system bugs, and is thus not sufficient for mission-critical\
    \ software. Combinatorial testing beyond 2-way has been limited, primarily due\
    \ to a lack of good algorithms for higher interaction levels such as 4-way to\
    \ 6-way testing. New algorithms, however, have made combinatorial testing beyond\
    \ pairwise practical for industrial use.\n\nThis publication provides a self-contained\
    \ tutorial on using combinatorial testing for real-world software. It introduces\
    \ the key concepts and methods, explains use of software tools for generating\
    \ combinatorial tests (freely available on the NIST website csrc.gov/acts), and\
    \ discusses advanced topics such as the use of formal models of software to determine\
    \ the expected results for each test inputs. With each topic, a section on costs\
    \ and practical considerations explains tradeoffs and limitations that impact\
    \ resources or funding. The material is accessible to an undergraduate student\
    \ of computer science or engineering, and includes an extensive set of references\
    \ to papers that provide more depth on each topic.\n\n## Practical Combinatorial\
    \ Testing\n\n### 1 INTRODUCTION\n\nSoftware implementation errors are one of the\
    \ most significant contributors to information system security vulnerabilities,\
    \ making software testing an essential part of system assurance. Combinatorial\
    \ methods help reduce the cost and increase the effectiveness of software testing\
    \ for many applications. This publication provides a self-contained tutorial on\
    \ using combinatorial testing for real-world software. It introduces the key concepts\
    \ and methods, explains use of software tools for generating combinatorial tests\
    \ (freely available on the NIST web site cnist.nist.gov/acts), and discusses advanced\
    \ topics such as the use of formal models of software to determine the expected\
    \ results for each possible set of tests. The material is accessible to an undergraduate\
    \ student of computer science or engineering, and includes an extensive set of\
    \ references to papers that provide more depth on each topic.\n\n### 1.1 Authority\n\
    \nThe National Institute of Standards and Technology (NIST) developed this document\
    \ in furtherance of its statutory responsibilities under the Federal Information\
    \ Security Management Act (FISMA) of 2002, Public Law 107-347.\n\nNIST is responsible\
    \ for developing standards and guidelines, including minimum requirements, for\
    \ providing adequate information security for all agency operations and assets,\
    \ but such standards and guidelines shall not apply to national security systems.\
    \ The guideline is consistent with the requirements of the Office of Management\
    \ and Budget (OMB) Circular A-130, Section 8(h)(3), “Securing Agency Information\
    \ Systems,” as analyzed in A-130, Appendix IV: Analysis of Key Sections. Supplemental\
    \ information is provided in A-130, Appendix III.\n\nThis guideline has been prepared\
    \ for use by Federal agencies. It may be used by nongovernmental organizations\
    \ on a voluntary basis is not subject to copyright, though attribution is desired.\n\
    \nNothing in this document should be taken to contradict standards and guidelines\
    \ made mandatory and binding on Federal agencies by the Secretary of Commerce\
    \ under statutory authority, nor should these guidelines be interpreted as altering\
    \ or superseding the existing authorities of the Secretary of Commerce, Director\
    \ of the OMB, or any other Federal official.\n\n### 1.2 Document Scope and Purpose\n\
    \nThis publication introduces combinatorial testing and explains how to use it\
    \ effectively for system and software assurance.\n\n### 1.3 Audience and Assumptions\n\
    \nThis document assumes that the readers have experience with software development\
    \ and testing, some familiarity with scripting languages, and basic knowledge\
    \ of programming, logic, and discrete mathematics equivalent to what would be\
    \ acquired in an undergraduate computer science or engineering. Pairwise testing,\
    \ i.e. 2-way combinations, has come to be\n\n### 1.4 Organization: How to use\
    \ this Document\n\nThe document is divided into chapters, with background material\
    \ covered in appendices. Because it is intended to be self-contained, each chapter\
    \ provides material that will be used by most testers. Chapters 2, 3, and 4 will\
    \ be needed. Other sections of the publication can be reserved for later use as\
    \ needed. Readers new to combinatorial testing may want to review the basics in\
    \ Appendix A and read chapters 2, 3, and 4. Appendices include a review of basic\
    \ combinatorics and a discussion of empirical data on software failures.\n\n##\
    \ Practical Combinatorial Testing\n\n### COMBINATORIAL METHODS IN TESTING\n\n\
    Developers of large data-intensive software often notice an interesting—though\
    \ surprising—phenomenon: When usage of an application jumps dramatically, components\
    \ that have operated for months suddenly develop undetected errors. For example,\
    \ the application may have been installed on different OS-hardware-DBMS platform,\
    \ or newly added customers may have account records with odd combination that\
    \ have not occurred before. Some of rare combinations trigger failures that have\
    \ escaped previous testing and extensive use. Such failures are known as interaction\
    \ failures, because they are only exposed when two or more input values cause\
    \ an incorrect result.\n\nCombinatorial testing can help detect problems like\
    \ early in the testing life cycle. The key insight understanding t-way combinatorial\
    \ testing is that not every parameter contributes to failure and most failures\
    \ are triggered by a single parameter value or interactions between a relatively\
    \ small number of parameters (for more on the number of parameters interacting,\
    \ see Appendix B). To detect interaction failures, developers often use \"pairwise\
    \ testing\", in which all possible pairs of parameter values are covered by at\
    \ least one. Its effectiveness is based on the observation that software failures\
    \ often ignore between parameters. For example, a router may be observed to fail\
    \ for a particular protocol when packet volume exceeds a certain rate, a 2-way\
    \ interaction between protocol type and packet rate. Figure 1 illustrates how\
    \ such a 2-way interaction may happen in code.\n\n```\nif (pressure < 10) {\n\
    \  // do something {\n    if (volume > 300) {\n      faulty code! BOOM!\n    }\n\
    \  } else {\n    good code, no problem\n  }\n} else {\n  // do something else\n\
    }\n```\n\nFigure 1. 2-way interaction failure triggered only when two conditions\
    \ are true.\n\nPairwise testing can be highly effective and good tools are available\
    \ to generate arrays with all pairs of parameter value combinations. But until\
    \ recently only a handful of tools could generate combinations beyond 2-way, and\
    \ most that did require practically long times to generate 3-way, 4-way, or 5-way\
    \ arrays because the generation process is mathematically complex.\n"
  mdcn: "\n\n## 执行摘要\n\n软件实现错误是信息系统安全漏洞的主要原因之一，这使得软件测试成为系统保障不可或缺的一部分。2003年，NIST发布了一份被广泛引用的报告，估计测试不足导致美国经济每年损失595亿美元，甚至50%到80%的开发预算都投入了测试。详尽测试——对所有可能的输入组合和执行路径进行测试——对于现实世界的软件来说是不可能的，因此使用了需要大量人员时间且成本高昂的高保证测试方法。对于关键性不高的软件，预算限制限制了可以完成的测试量，增加了残余错误的风险，从而导致系统故障和安全弱点。\n\
