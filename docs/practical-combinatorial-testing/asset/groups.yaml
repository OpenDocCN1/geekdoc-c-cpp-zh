    ## 9.2.2 将组合测试集成到模型中


    我们将计算提供所有 t 路组合的覆盖数组，在本例中，交互覆盖度为 2。本节描述了如何将 ACTS 作为独立的命令行工具使用，使用文本文件输入（见第 3.1
    节）。第一步是在系统定义文件中定义参数及其值，该文件将作为 ACTS 的输入。此文件命名为 "in.txt"，格式如下：


    ```

    [System]

    [Parameter]

    uu_l: 0,1,2

    f_l: 0,1,2

    act: rd,wr

    [Relation]

    [Constraint]

    [Misc]

    ```


    对于此应用程序，文件中的 [Parameter] 部分是所需的。其他标签引用了将在其他文档中解释的高函数。保存系统定义文件后，如下所示运行 ACTS：


    ```

    java -Ddoi2=2 -jar acts_cmd.jar ActsConsoleManager in.txt out.txt

    ```


    "Doi2" 参数设置了我们希望 ACTS 计算的覆盖数组的交互度。在这种情况下，我们使用的是简单的 2 路（或两对）交互。（对于具有更多参数的系统，我们将使用更高强交互，但由于只有三个参数，3
    路交互等同于穷举测试）。ACTS 生成如图 29 所示的输出。


    每个配置定义了输入参数 u_l、f_l 和 act 的一组值。完整的测试集确保了参数值的所有 2 路组合都已覆盖。如果我们有更多参数，就可以生成覆盖所有 3
    路、4 路等组合的测试配置。ACTS 可能会对某些参数值输出“don’t care”（不关心）。这意味着该参数的任何合法值都可以，且完整配置集将覆盖所有 t
    路组合。由于“don''t care”通常不是被测试程序的接受输入，因此在使用覆盖数组产生测试例之前，会为该参数替换一个随机值。


    参数数量：3

    每个参数的最大值数量：3

    配置数量：9

    ---------------------------------------

    Configuration #1:

    1 = u_l=0

    2 = f_l=0

    3 = act=rd

    ---------------------------------------

    Configuration #2:

    1 = u_l=0

    2 = f_l=1

    3 = act=wr

    ---------------------------------------

    Configuration #3:

    1 = u_l=0

    2 = f_l=2

    3 = act=rd

    ---------------------------------------

    Configuration #4:

    1 = u_l=1

    2 = f_l=0

    3 = act=wr

    ---------------------------------------

    Configuration #5:

    1 = u_l=1

    2 = f_l=1

    3 = act=rd

    ---------------------------------------

    Configuration #6:

    1 = u_l=1

    2 = f_l=2

    3 = act=wr

    ---------------------------------------

    Configuration #7:

    1 = u_l=2

    2 = f_l=0

    3 = act=rd

    ---------------------------------------

    Configuration #8:

    1 = u_l=2

    2 = f_l=1

    3 = act=wr

    ---------------------------------------

    Configuration #9:

    1 = u_l=2

    2 = f_l=2

    3 = (don''t care)


    图 29. ACTS 输出


    下一步是将覆盖数组中的值分配给模型中使用的参数。对于每个测试，我们声称预期结果将不会发生。模型检查器确定能够反驳这些断言的组合，并将这些输出作为反例。每个反例都可以转换为具有已知预期结果的测试用例。来自
    ACTS 工具的每个测试都会被使用，模型检查器为每个测试提供预期结果（显而易见的肯定断言已被注释掉。我们关注的是生成反例）。


    回想第 9.1 节引入的结构：C_j -> R_j。这里 C_j 是覆盖数组的参数值集。例如，对于本节中的配置 #1：


    ```

    u_l = 0 & f_l = 0 & act = rd

    ```


    如下所示，对于覆盖数组中的 9 个配置的每一个，我们都为以下内容创建一个 SPEC：


    ```

    SPEC AG((covering array values>) -> AX! (access = <result>);

    ```


    此过程对每个可能的结果重复（在本例中为 "GRANT" 或 "DENY"），因此对于两个结果中的每个结果都有 9 个断言。模型检查器能够使用第 9.2 节中定义的模型确定每组输入值哪一个是正确的，总共产生
    9 个测试。


    摘录：


