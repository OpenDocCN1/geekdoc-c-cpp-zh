    \n## 实用组合测试\n\n### 测试中的组合方法\n\n数据密集型软件的开发者经常会注意到一个有趣但令人惊讶的现象：当应用程序的使用量激增时，运行了几个月的组件出现了未被检测到的错误。例如，应用程序可能安装在不同的操作系统-硬件-数据库平台上，或者新增的客户可能拥有以前出现过的异常账户记录。某些稀有组合触发了此前通过测试和广泛使用的故障。此类故障被称为交互故障，因为它们只有在两个或多个输入值导致错误结果时才会暴露。\n\
