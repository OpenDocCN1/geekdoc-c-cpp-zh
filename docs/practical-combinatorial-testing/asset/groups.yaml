    \ ( ( ( ( ( basic elements of regular expressions:\n\n| Operator | Description\
    \ |\n| :--- | :--- |\n| `\\|` | \"or\" alternation. Ex: abac matches \"ab\" or\
    \ \"ac\" |\n| `?` | 0 or 1 of the preceding element. Ex: abc? matches \"ac\" or\
    \ \"abc\" |\n| `*` | 0 or more of the preceding element. Ex: ab* matches \"a\"\
    , \"ab\", \"abb\", \"abbb\" etc. |\n| `+` | 1 or more of the preceding element.\
    \ Ex: ab+ matches \"ab\", \"abb\", \"abbb\" |\n| `()` | grouping. Ex: (abc\\|bcd)\
    \ matches \"abc\" or \"bcd\" |\n| `.` | matches any single character. Ex: a.c\
    \ matches \"abc\", \"axc\", \"a@c\" etc. |\n| `[]` | matches any single character\
    \ within brackets. Ex: [abc] matches \"a\" or \"b\" or \"c\". A range may also\
    \ be specified. Ex: [a-z] matches any single lower case character. (This option\
    \ depends on the character supported.) |\n| `[^` | matches any single character\
    \ that is not contained in the brackets. Ex: [^ab] matches any character except\
    \ \"a\" or \"b\" |\n| `^` | matches start position, i.e., before the first character\
    \ |\n| `$` | matches end position, i.e., after the last character |\n\n# Combining\
    \ Operators\n\nThe operators above can be combined with symbols to create arbitrarily\
    \ complex expressions. Examples include:\n\n- `\\.a.*b.*c.*` \"a\" followed by\
    \ \"b\" followed by \"c\" with zero or more symbols prior to \"a\", following\
    \ \"c\", or interspersed with the three symbols\n- `a\\|b*` null or \"a\" or zero\
    \ or more occurrences of \"b\"\n- `a+` equivalent to `aa*`\n\nMany regular expression\
    \ utilities such as egrep support a broader range of operators and features. Readers\
    \ should consult documentation for grep, egrep, or other regular expression processors\
    \ for detailed coverage of the options available on particular tools.\n\n# Practical\
    \ Combinatorial Testing\n\n# Appendix B - EMPIRICAL DATA ON SOFTWARE FAILURES\n\
    \nOne of the most important questions in software testing is \"how much is enough\"\
    . For combinatorial testing, this question includes determining the appropriate\
    \ level of interaction that should be tested. That is, if some failure is triggered\
    \ by an unusual combination of more than two values, how many testing combinations\
    \ are enough to detect all errors? What degree of interaction occurs in testing\
    \ real systems? This section summarizes what is known about these questions based\
    \ on research by NIST and others [4, 7, 34, 35, 36, 65].\n\nTable 1 summarizes\
    \ what we know from empirical studies of a variety of application domains, showing\
    \ the percentage of failures that are triggered by the interaction of one to six\
    \ variables. For example, 66% of the medical devices were triggered by a single\
    \ variable value, and 97% were triggered by either one or two values interacting.\
    \ Although nearly conclusive, the available data suggests that the number of interactions\
    \ involved in system failures is relatively low, with a maximum of 4 to 6 in the\
    \ six studies cited below. (Note: TCAS used seeded errors, others are naturally\
    \ occurring.)\n\n| Vars | Medical Devices | Browser | Server | NASA GSFC | Network\
    \ Security | TCAS |\n|---|---|---|---|---|---|---|\n| 1 | 66 | 29 | 42 | 68 |\
    \ 17 | * |\n| 2 | 97 | 76 | 70 | 93 | 62 | 53 |\n| 3 | 99 | 95 | 89 | 98 | 87\
    \ | 74 |\n| 4 | 100 | 97 | 96 | 100 | 98 | 89 |\n| 5 | | 99 | 96 | | 100 | 100\
    \ |\n| 6 | | | 100 | 100 | | |\n\nTable 1. Number of variables\n\n- Medical Devices\
    \ | Embedded | Fielded products | $10^2-10^4$ (variations)\n- Browser | Web browser\
    \ | Development/beta release | approx. $10^3$\n- Server | HTTP server | Development/beta\
    \ release | approx. $10^5$\n- NASA database | Distributed scientific database\
    \ | Development, integration test | approx. $10^5$\n- Network security | Network\
    \ protocols | Fielded products | $10^5$\n\n# Practical Combinatorial Testing\n\
