    4 路组合进行测试。但所有的 4 路组合就足够检测所有错误吗？真实系统中发生了何种程度的交互？惊讶的是，自从 NIST 在 1999 年开始调查故障以来，这个问题一直没有得到研究。结果显示，在各个领域中，所有故障都可以由最多
    4 路到 6 路的交互触发 [34, 35, 36, 65]。如图 2 所示，t-way 组合中的交互水平通常被称为“强度（strength）”。以 NASA
    应用为例，67% 的故障由单个参数值触发，93% 由 2 路组合触发，98% 由 3 路组合触发。所研究的其他应用的检测率也相似，在 4 到 6 路交互下达到
