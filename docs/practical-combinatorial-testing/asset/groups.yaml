    # 3.4 Chapter Summary


    +   1. Configuration testing is probably the most commonly used application of
    combinatorial methods in software testing. Whenever an application has five or
    more configurable attributes, a covering array is likely to make testing more
    efficient. Configurable attributes have a small number of possible values, which
    is an ideal situation for combinatorial methods. The number of tay tests is proportional
    to v^ log n in n parameters with v values, unless configurable attributes have
    more than 8 or 10 possible values, the number of tests generated will probably
    be reasonable. The real-world testing problem introduced in Section 3.2 is a fairly
    typical size, where 4-way interactions can be tested with a few hundred tests.

