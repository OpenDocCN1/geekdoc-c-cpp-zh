    # 6 MEASURING COMBINIAL COVERAGE


    Since it is nearly impossible to test all possible combinations, combinatorial
    testing is a reasonable alternative. For some value of $t$, testing all $t$-way
    interactions among parameters will detect nearly all errors. It is possible that
    $t=n$, but recalling the empirical data on failures, we expect $t$ to be relatively
    small. Determining the level of input or state coverage can help in understanding
    the degree of risk that remains after testing. If 100% of state space has been
    covered, presumably the risk is small, but if coverage is much smaller, then the
    risk may be substantial. This chapter describes some measures of combinatorial
    coverage that can be helpful in estimating this risk and applied to software.


    ## 6.1 Software Test Coverage


    Test coverage is one of the most important topics in software assurance. Users
    would like some quantitative measure to judge the risk in using product. For a
    given test, what can we say about the coverage it provides? With physical products,
    such as light bulbs or motors, reliability engineers can provide a probability
    of failure within a particular time frame. This is possible because the failures
    in physical products are typically the result of natural processes, such as metal
    fatigue.


    With software it is more complex, and many different approaches have been devised
    for determining software test coverage. With millions of lines of code, or even
    a few thousand, the number of paths through a program is so large that it is impossible
    to test all paths. For each statement, there are a sequence of $n$ result in $2^n$
    possible paths. Even a small program with 70 statements in an execution may have
    more paths than there are atoms in the universe, which is on the order of $10^{80}$.
    Loops (while statements) the number of paths is literally infinite. Thus a variety
    of measures have been developed to gauge the degree of test coverage. The following
    are some of the better-known coverage metrics:


    - Statement coverage: This is the percentage of statements exercised by the test
    set. While it may seem at first that 100% statement coverage should provide good
    confidence in the program, in practice, statement coverage is a relatively weak
    criterion. At best, statement coverage represents a sanity check: unless statement
    coverage is close to 100%, the test set is probably inadequate.


    - Decision or branch coverage: The percentage of branches that have been evaluated
    to both true and false by the test set.


    - Condition coverage: The percentage of conditions within decision expressions
    that have been evaluated to true and false. Note that 100% condition coverage
    does not guarantee 100% decision coverage. For example, “if (A || B) (do something)
    else (do something else)” tested with [0], [1], then A and B will both have evaluated
    to 0 and 1, but the else branch will not be taken because test leaves both A and
    B false.


    - Modified decision coverage (MCDC): This is a strong coverage criterion that
    is required by the US Federal Aviation Administration for Level A (catastrophic
    failure consequence); software; software failure could lead to complete loss of
    life. It requires that every condition in the program has taken on at least once,
    and each condition has been shown to independently affect the decision outcome,
    and each entry and exit point have been invoked at least.


    ## 6.2 Combinatorial Coverage


    Note that the coverage measures depend on access to program source code. Combinatorial
    testing, in contrast, is a black box technique. Inputs are specified and expected
    results derived from some form of specification. The program is then treated as
    simply as a processor that accepts inputs and produces outputs, with no knowledge
    expected of its workings.


    Even in the absence of knowledge about a program’s inner structure, we can apply
    combinatorial methods to produce precise and useful measures. In this case, we
    measure the state of inputs. Suppose we have a program that accepts two inputs,
    x and y, with 10 values each. Then the input state consists of the 10²=100 pairs
    of x and y values, which could be pictured as a chessboard of 10 rows by 10 columns.
    With three inputs, x, y, and z, we would have a cube with 10³=1,000 points in
    its input state space. Extending the example to n inputs we would have a (to visualize)
    hypercube of n dimensions with 10ⁿ. Exhaustive testing would require inputs of
    all 10ⁿ, but combinatorial testing could be used to reduce the size of the test
    set.


