    # Practical Combinatorial Testing


    The situation is more complex with continuous variables. If, for example, a failure-related
    branch takes any time x > 100, z < 1000, there may be many combinations implied
    the failure. Analysis will show that [x = 200, y = 3, z = 120], [x = 201, y =
    3, z = 119], [x = 999, y = 3, z = 999], [x = 101, y = 3, z = 0], [x = 200, y =
    3, z = 0] are all combinations that trigger the failure. With more than three
    input parameters, there may be dozens or hundreds of failure-triggering combinations,
    even though there is most likely a single point in the code that is error.


    # 10.2 Cost and Practical Considerations


    As shown in the example above, it is a non-trivial matter to determine the failure-triggering
    combination(s) from test results alone. When source code is available, the methods
    described in this section are probably unnecessary, and can be replaced with conventional
    debugging techniques. In black-box testing situations where there is no source
    code, these methods may be useful in narrowing the search for failure-triggering
    combinations. Tools to implement these methods have been developed and are available
    from the ACTS project site.


    # 10.3 Chapter Summary


    When source code is available, the best way to identify the cause of a failure
    is with conventional debugging techniques, since the error must be fixed in code
    anyway. With pure black-box testing and no access to source code, the heuristics
    discussed in this chapter may help to narrow down possible causes. Usually there
    will be many combinations identified as possible causes, so substantial additional
    testing may be needed to determine the exact cause.


    # Appendix A – MATHEMATICS REVIEW


    This appendix reviews a few basic facts of combinatorics, regular expressions,
    and mathematical logic that are necessary to understand the concepts in this publication.


    ## Combinatorics


    ### Permutations and Combinations


    For $n$ variables, there are $n!$ permutations and $\binom{n}{t} = \frac{n!}{t!(n-t)!}$
    ($n$ choose $t$) combinations of $t$ variables, also needed for convenience as
    $C(n, t)$. To exercise all the $t$-way combinations of inputs to a program, we
    need to cover all $t$-way combinations of variable values, and each $v$ can have
    $v^t$ configurations, where $v$ is the number of values per variable. Thus the
    total number of combinations instantiated with values that must be covered


    $\binom{n}{t}$ (1)


    Fortunately, each test $t$ covers $C(n, t)$ combination configurations. This is
    the source of combinatorial testing''s power. With 34 binary variables, we need
    $2^{34} = 1.7 \times 10^{10}$ tests to cover all possible configurations, but
    with only 33 tests we can cover all 3-way combinations of these 34 variables.
    This happens because each test covers $C(34, 3)$ combinations.


    **Example.** If we have five binary variables, $a, b, c, d$, and $e$, then expression
    (1) says we will need to cover $2^5 * C(5, 3) = 32 * 10 = 80$ configurations.
    For 3-way combinatorial testing, we will need to take all 3-variable combinations,
    of which there are 10:


    - abc, abd, abe, acd, ace, ade, bce, bde, cde


    Each of these will need to be instantiated with 8 possible configurations of three
    binary variables:


    - 000, 001, 010, 011, 100, 101, 111


    The test $[0\ 1\ 0\ 0\ 1]$ covers the following $C(5, 3) = 10$ configurations:


    - abd abe acde bcd bce bde cde

    010 000 011 001 001 101 101 101 001


    ## Orthogonal Arrays


    Many software testing problems can be solved with an orthogonal array, a structure
    that has been used for combinatorial testing in fields other than software for
    decades. An orthogonal array. $OA_{\lambda}(N;t,k,v)$ is an $N \times k$ array.
    In every $N \times t$ subarray, each t-tuple occurs exactly $\lambda$ times. We
    refer to $t$ as the *strength* of the coverage of interactions, $k$ as the number
    of parameters or components (degree), and $v$ as the number of possible values
    for each parameter or component (order).


    **Example.** Suppose we have a system with three on-off switches, controlled by
    an embedded processor. Thus $t = 2, \lambda = 1, v = 2$. Note that $v'' = 2^2$
    possible combinations for each pair: $00, 01, 10, 11$. There are $C(3,2) = 3$
    ways to select switch pairs: $(1,2), (1,3)$ and $(2,3)$, and each test covers
    three pairs, so the tests cover a total of 12 combinations which implies each
    combination is covered exactly once.


    | Test | Sw1 | Sw2 | Sw3 |

    |---|---|---|---|

    | 1 | 0 | 0 | 0 |

    | 2 | 0 | 1 | 1 |

    | 3 | 0 | 1 | 0 |

    | 4 | 1 | 0 | 1 |


    ## Covering Arrays


    An alternative to an orthogonal array is a set *covering array*, which includes
    all t-way combinations of variables. $CA_{\lambda}(N;t,k)$ is an $N \times k$
    array. In every $N \times t$ subarray, each t-tuple occurs at least $\lambda$
    times. Note that $v'' = 2^t$ possible combinations for each pair. The challenge
    in combinatorial testing is is not out of reach.


    The challenge in computing covering arrays is to find the smallest possible array
    that covers all combinations of t variables. If every new test covered all uncovered
    combinations, then the number of tests needed would be


    Since this is not generally possible, the covering array will be significantly
    larger than $v''$, but still a reasonable number for testing.

