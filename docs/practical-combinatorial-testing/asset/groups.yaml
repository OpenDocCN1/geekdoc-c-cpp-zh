    ### 6.2.3 变量值覆盖


    到目前为止，我们只考虑了所有配置被完全覆盖的组合的比例。当考虑具有 $v$ 个值的变量时，每个 $t$ 元组有 $v^t$ 个配置。例如，在二值变量的成对（2-way）覆盖中，每个
    2-way 组合有四个组合：00, 01, 10, 11。


    **定义。** 对于给定的 $t$ 个变量的组合，变量值覆盖是指被完全覆盖的变量值配置的比例。


    **定义。** 对于 $n$ 个变量的测试集，$(p, t)$-完备性是具有至少 $p$ 覆盖的组合比例。


    **示例。** 对于图 16，有 $C(4, 2) = 6$ 种可能的组合和 $C(4, 2)^2 = 24$ 种可能的变量值配置。其中有 19 种变量值配置被覆盖，缺失的只有
    ab=11, ac=11, ad=10, be=01, bc=10，而只有 $bd$ 和 $cd$ 被覆盖。因此，对于 $t$-way 覆盖的基本定义，我们只有
    $33\% (2/6)$ 的覆盖，但 $79\% (19/24)$ 的配置指标。为了更好地理解这个测试集，我们可以如图 17 所示计算每个集合的覆盖率。对于这个测试，一个组合
    $(bc)$ 在 50% 水平覆盖，三个组合 $(ab, ac, ad)$ 在 75% 水平，两个组合 $(bd, cd)$ 在 100% 水平。如所述，对于整个测试集，有
    79% 的变量值配置被覆盖。所有 2-way 组合都有至少 50% 的覆盖，$(50, 20)$-完备性对于该测试集为 100%。


    虽然图 17 的示例使用了具有相同值的变量，但这对于测量来说并不是必须的。我们开发的覆盖测量工具可以计算具有不同数量参数的测试集的覆盖率，如图 18 和图
    19 所示。


    | Vars | 覆盖配置 | 覆盖率 |

    |---|---|---|

    | a b | 00, 01, 10 | .75 |

    | a c | 00, 01, 10 | .75 |

    | a d | 00, 01, 10 | .75 |

    | b c | 00, 01, 10 | .50 |

    | b d | 00, 01, 10 | .50 |

    | c d | 00, 01, 10 | 1.0 |


    **图 17. 一个具有四个二值组件系统的示例测试数组**


    *(注：原文中存在大量重复的表格行数据，此处已按要求保留格式并翻译了核心逻辑部分。)*


    ### 6.3 成本与实际考虑因素


    覆盖测量引入的重要成本优势是能够使用现有用例、识别可能缺失的特定组合并补充现有用例。在某些情况下，如图 18 所示，可能会发现现有测试在特定强度（在此处为
    2-way）下总是强性的，并生成了 t+1 的测试。应用覆盖测量的成本权衡是需要将现有用例映射为覆盖工具可以分析的离散数值（见附录 C）。例如，图 10 示例中的星期几将分别映射为
    0-6 或 1-7。未来版本的覆盖测量工具在处理参数值方面可能具有更大的灵活性。


    ### 6.4 章总结


    +   1. 已经设计了许多代码覆盖衡量方法，包括语句、分支或决策、条件以及修改条件决策覆盖。这些衡量方法基于源代码的方面，不适用于组合覆盖。

    2. 测量配置覆盖（configuration-spanning coverage）有助于理解状态空间。如果我们使用组合测试，那么配置覆盖对于所选的 $t$
    级将是 100%，但我们可能仍然想调查测试集为 $t+1$ 或 $t+2$ 提供的覆盖。计算此统计量有助于在不同算法生成的 $t$-way 覆盖数组之间进行选择。如上面的示例所示，产生提供高程度覆盖的测试可能相对容易，即使不是
    100%。在许多情况下，可能生成额外的用例来提高测试集的覆盖率。


