    Despite the discouraging numbers in the table, above, there is some good news.
    Note that formula (2) grows only logarithmically with the number of variables,
    $n$. This is fortunate for software testing. Early applications of combinatorial
    methods were typically involved with small numbers of variables, such as a few
    types of crops or fertilizers, but for software testing, we must deal with tens,
    or in some cases hundreds of variables.


    # Regular Expressions


    Regular expressions are formal descriptions of strings of symbols, which may represent
    text, events, characters, or other objects. They are developed within automata
    theory and formal languages, where it is shown that there are direct mappings
    between expressions and automata to process them, and are encountered in many
    areas within computer science. In combinatorial testing they may be encountered
    in sequence ordering or in processing input or output. Implementations vary, but
    standard syntax is explained below.


    # Expression Operators


    Basic elements of regular expressions:


    | Operator | Description |

    | :--- | :--- |

    | `\|` | "or" alternation. Ex: abac matches "ab" or "ac" |

    | `?` | 0 or 1 of the preceding element. Ex: abc? matches "ac" or "abc" |

    | `*` | 0 or more of the preceding element. Ex: ab* matches "a", "ab", "abb",
    "abbb" etc. |

    | `+` | 1 or more of the preceding element. Ex: ab+ matches "ab", "abb", "abbb"
    |

    | `()` | grouping. Ex: (abc\|bcd) matches "abc" or "bcd" |

    | `.` | matches any single character. Ex: a.c matches "abc", "axc", "a@c" etc.
    |

    | `[]` | matches any single character within brackets. Ex: [abc] matches "a" or
    "b" or "c". A range may also be specified. Ex: [a-z] matches any single lower
    case character. (This option depends on the character supported.) |

    | `[^` | matches any single character that is not contained in the brackets. Ex:
    [^ab] matches any character except "a" or "b" |

    | `^` | matches start position, i.e., before the first character |

    | `$` | matches end position, i.e., after the last character |


    # Combining Operators


    The operators above can be combined with symbols to create arbitrarily complex
    expressions. Examples include:


    - `\.a.*b.*c.*` "a" followed by "b" followed by "c" with zero or more symbols
    prior to "a", following "c", or interspersed with the three symbols

    - `a\|b*` null or "a" or zero or more occurrences of "b"

    - `a+` equivalent to `aa*`


    Many regular expression utilities such as egrep support a broader range of operators
    and features. Readers should consult documentation for grep, egrep, or other regular
    expression processors for detailed coverage of the options available on particular
    tools.


    # Practical Combinatorial Testing


    # Appendix B - EMPIRICAL DATA ON SOFTWARE FAILURES


    One of the most important questions in software testing is "how much is enough".
    For combinatorial testing, this question includes determining the appropriate
    level of interaction that should be tested. That is, if some failure is triggered
    by an unusual combination of more than two values, how many testing combinations
    are enough to detect all errors? What degree of interaction occurs in testing
    real systems? This section summarizes what is known about these questions based
    on research by NIST and others [4, 7, 34, 35, 36, 65].


    Table 1 summarizes what we know from empirical studies of a variety of application
    domains, showing the percentage of failures that are triggered by the interaction
    of one to six variables. For example, 66% of the medical devices were triggered
    by a single variable value, and 97% were triggered by either one or two values
    interacting. Although nearly conclusive, the available data suggests that the
    number of interactions involved in system failures is relatively low, with a maximum
    of 4 to 6 in the six studies cited below. (Note: TCAS used seeded errors, others
    are naturally occurring.)


