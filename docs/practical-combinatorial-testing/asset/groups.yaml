    | 8 | RHL | Firefox | IPv4 | Intel |

    | 9 | XP | IE | IPv4 | AMD |


    **Figure 8.** Test configurations for simple example with constraint.


    ## 3.3.2 Cost Factors


    Using combinatorial methods to design test configurations is is probably the most
    widely used combinatorial approach because it is quick and easy to do and typically
    deliver significant improvements to testing. Combinatorial testing for input parameters
    can provide better test coverage at lower cost than conventional tests, and can
    be extended to high strength coverage to provide much better assurance.

