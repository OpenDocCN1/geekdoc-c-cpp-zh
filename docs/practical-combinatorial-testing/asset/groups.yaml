    ## 7.4 章总结


    - 1. 现有研究表明，组合测试要么存在差异（对于某些问题），要么具有更高的故障检测效率（对于大多数问题）。分析随机测试集为这一结果提供了原因。特别是，一个高度优化的化的覆盖数组可能比等规模的随机测试集包含更少的
    $t+1$、$t+2$ 以及更高阶的交互测试。同样，产生较大数组的覆盖算法在统计学上更有可能作为测试生成的副产品包含 $t+1$、$t+2$ 以及更高阶的交互测试。


    - 对于多个故障，随机测试的效率可能低得多，因为它检测到所有故障的概率为 $c^m$，其中 $c$ 为覆盖百分比，$m$ 为故障数量。


    # 实际组合测试


    ## 8 基于断言的 Oracle（Oracles）


    许多编程语言都包含 `assert` 功能，允许程序员在特定点指定假设的属性。例如，一个包含除法的函数其中特定的 $x$ 将用作除数，可能要求该参数永远为
    0。该函数可以在第一条语句中包含 C 语句 `assert(x != 0);`。注意断言与输入验证的区别在于：断言旨在捕获编程错误，而输入验证用于检测用户或数据库输入中的错误。


    通过从规范中推导出足够数量的断言，程序可以自检查属性 [27, 60, 47]。断言可以作为重要属性的嵌入证明，只要断言在程序的所有执行中都成立，它们所编码的属性就能保证成立。然后，如果断言形成了一个暗示程序属性正式陈述的逻辑链，该程序相对于这些属性的正确性就得到了证明。我们可以在组合测试中利用这种方案，通过证明断言在所有
    $i$ 路组合中都成立。虽然这不如形式化证明强大，但它是将形式化性方法与测试相结合的有效方法，已有大量研究开发了这一想法的实际应用（见 [4]）。现代编程语言（如
    Eiffel [52]）对包含程序属性的断言提供了广泛支持，而 Java 建模语言 [42] 等工具旨在将断言与测试集成。在许多情况下，使用断言自检查属性使得全自动地运行数千次测试变得可行，因此
    4 路及以上的强度交互可以在合理时间内完成。


    > 为了澄清这一抽象讨论，我们将分析一个处理自动取款机（ATM）取款流程的小型函数的需求。


    通过自检查断言，通常可以以极低的成本运行数千次测试，允许高强度交互。我们将显示 ATM 的图形界面代码，因为它在不同系统中差异很大。示例中不包含 GUI 代码决定也说明了这种测试类型的一个实际局限性：软件项目中存在许多潜在的错误源，测试可能无法同时处理所有问题。

