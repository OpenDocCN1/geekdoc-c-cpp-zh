    ## 3.3.1 Combinations and Constraints


    Because many systems have certain configurations that may not be of interest (such
    as Internet Explorer browser on a Linux system), constraints are an important
    consideration in any type of testing. With combinatorial methods, it is important
    that the covering array generator allows for the inclusion of constraints so that
    all relevant interactions are tested, and important information is not lost because
    a test contains an impossible combination. In this case, the following constraint
    can be used:


    ```

    (OS != "XP") => Browser = "Firefox")

    ```


    The covering array will then generate a set that not include invalid combinations,
    but does cover all. The revised configuration array is shown in Figure 8.


