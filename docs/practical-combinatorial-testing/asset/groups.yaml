    # 组合测试实践


    ![](img/1ed33ef73de52a1c4905e6292418700a_27_0.png)


    图 13 航空电子学示例的测试次数。


    在将组合方法应用于输入参数时，关键成本因素是每个参数的数值数量、交互强度以及参数的数量。如所示，随着 $t$ 值的增加，测试次数会迅速增加，但增长速率取决于每个参数的取值数量。二进制变量只有两个值，其测试次数远少于具有许多取值的参数。在实际操作中，对于输入空间的划分（第
    4.1 节），最好将每个参数的取值数量保持在 8 或 10 以下。


    由于测试次数仅随参数数量呈对数增长，因此大型问题的测试集大小可能比小得多的问题大一些。例如，如果一个项目对一个具有 20 个参数和数百次用例的系统使用组合测试，那么一个具有
    40 到 50 个参数的大得多系统可能只需要多出几十次测试。组合方法可能为大型系统产生最佳的成本效益比。


    ## 4.4 章节总结


    - 1. 组合测试的主要优势在于，几乎所有的软件故障似乎都只涉及少数参数的交互。生成输入数组的覆盖允许我们测试所有这些交互，根据资源情况，可以达到 5 路或
    6 路组合的水平。


    - 2. 实际测试通常需要将变量的值抽象为一小组等价类。例如，如果一个变量是 32 位整数，显然无法测试 $-2^{31}$ 整个范围内的所有值。这个问题并不是组合测试所特有的，在大多数测试方法中都是如此的。这需要简单的启发式方法和工程判断来确定取值到等价类的适当划分，但一旦完成这一步，就可以为许多应用程序生成几百到几千次测试的覆盖数组。覆盖的彻底程度将取决于资源和应用的关键性。


    # 5 序列覆盖数组


    在测试事件驱动型软件时，触发故障的关键条件通常是某个特定事件是否在另一个事件之前发生，而不一定取决于它们是否是连续发生的。这种情况反映了在许多情况下，在触发特定故障之前必须到达特定的状态。例如，只有在设备
    B 已连接的情况下，连接设备 A 可能会发生故障。本章描述的方法是为了解决互操作性测试和评估中的实际问题而开发的，使用组合方法提供高效的测试。这里定义的序列覆盖数组确保了任何
    $t$ 个事件在所有可能的 $t$ 路顺序上都经过测试。


    对于这个问题，我们可以定义序列覆盖数组 [39, 40]，这是一组确保所有 $t$ 路序列都经过测试的测试集。序列中的 $t$ 个事件可能与其他事件交错，但所有排列都将被测试。例如，我们可能有一个工厂系统组件，它使用某些设备与控制程序交互。我们想要测试表
    6 中定义的事件。


    > 在许多系统中，输入的顺序非常重要。


    这六个事件有 $6! = 720$ 种可能的序列，系统应该正确响应，而不论它们发生的顺序如何。操作员可能会被指示使用特定的顺序，但错误是不可避免的，且不应导致用户受到伤害或损害企业利益。由于该组件的设置、连接和操作是手动的，每次测试可能花费大量时间。这种系统级测试的执行、监控和完成需要几个小时并不罕见。我们希望尽可能彻底地测试此，但限制不允许测试所有可能的序列，因此我们将测试所有的
    3 事件序列。


    对于事件 $a, b, c, d, e$ 和 $f$，三个元素的一个子集是 $\{[b, d, e\}$，它可以排列为排列：$[b e d]$ $[b d
    e]$ $[d b e]$ $[e b d]$。一个测试覆盖了排列 $[b d e]$：$[a d c f e]$；另一个是 $[a d e b]$。更大的系统可能有
    10 个设备需要连接，其中排列组合的数量为 $10!$，即穷举测试需要 $3,628,800$ 次测试。在这种情况下，一个用 14 次测试覆盖所有 10 路序列的
    3 路序列覆盖数组是一个巨大的改进，而所有 4 路序列则需要 72 次测试（见表 8）。


    | 事件 | 描述 |

    |---|---|

    | a | 连接气流 |

    | b | 连接压力计 |

    | c | 连接卫星链路 |

    | d | 连接压力读数 |

    | e | 启动驱动 |

    | f | 启动转向 |


    表 6 系统事件


    **定义。** 我们定义一个包含 $s$ 个符号的有限集 $S$，SCA($N, S, t$) 为一个 $N \times S$ 矩阵，其元素来自 $S$，使得来自
    $S$ 符号的每种 $t$ 路排列至少出现在某行；排列中的 $t$ 个符号并不要求是相邻的。也就是说，对于 $n$ 个变量 $x_1, x_2, ...,
    x_t$ 的每种 $t$ 路组合，正则表达式 $*x_1\*\*x_2\*\*x_t\*$ 匹配序列中的至少一行。覆盖数组类似于标准数组，包含 $t \le
    n$ 的每种 $t$ 路组合的至少一种。有多种算法可用于构建和生成 $t$ 路序列。


    **示例 1。** 考虑四个事件 $a, b, c, d$ 的问题。为了方便起见，$t$ 路符号排列被称为 $t$ 路序列。这四个事件有 $4! = 24$
    种可能的排列，但我们可以仅用六次测试覆盖所有的 3 路序列（见表 7）。


    ## 5.1 构建覆盖数组


    2 路序列覆盖数组可以通过在某种测试中列出事件，在另一种测试中反向排列来构建：


    | | a | b | c | d |

    |---|---|---|---|

    | 1 | a | b | c | d |

    | 2 | b | a | d | c |

    | 3 | b | d | c | a |

    | 4 | c | a | b | d |

    | 5 | c | d | b | a |

    | 6 | d | a | c | b |


    表 7 四个事件的测试。


    为了看到覆盖所有 2 路序列的测试，请注意对于 2 路覆盖，每对变量 $x$ 和 $y$，$x..y$ 和 $y..x$ 都出现在某个测试中（其中 $a..b$
    意味着 $a$ 之后是 $b$）。对于 $t$ 路序列生成，当 $t > 2$ 时，我们使用贪心算法根据未覆盖序列的数量生成大量测试，然后选择得分最高的。这种简单的方法产生了异常好的结果。


    ## 5.2 使用数组


    序列覆盖数组已整合到使用多个输入和输出的笔记本电脑的任务关键系统测试中。测试程序有 8 个步骤：启动系统、打开应用程序、扫描、外设 P-1 到 P-5。对于某些序列，系统将无法正常运行，因此连接外设的顺序是测试的关键方面。此外，事件顺序存在约束：除非打开应用，否则无法扫描。有
    40,320 次排列，但有些是冗余的（例如在启动之前更改外设顺序），有些是无效的（约束）。大约 7,000 个是有效的且非冗余的，但对于需要手动连接设备的系统来说，这仍然太多了。


    使用七步序列覆盖数组进行测试，假设不存在涉及启动的 3 路序列。初始配置（图 14）来自预计算测试库。根据测试的唯一要求，如果打开应用并扫描，则情况 1,
    4, 6, 8, 10 和 12 是无效的，无法在应用程序启动之前运行扫描。这通过在它们相邻时（1 和 4）交换 0 和 1 来处理。对于其他情况，从每个无效用例中生成了多个有效用例。还添加了一个测试以查看三个
    USB 连接的位置是否重要。最终数组如 9 所示。


    | 测试 | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---|---|---|---|---|---|

    | 测试 1 | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    | 测试 2 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | 测试 3 | 2 | 1 | 0 | 6 | 5 | 4 | 3 |

    | 测试 4 | 3 | 4 | 5 | 6 | 0 | 1 | 2 |

    | 测试 5 | 4 | 1 | 6 | 0 | 3 | 2 | 5 |

    | 测试 6 | 5 | 2 | 3 | 0 | 6 | 1 | 4 |

    | 测试 7 | 0 | 6 | 4 | 5 | 2 | 1 | 3 |

    | 测试 8 | 3 | 1 | 2 | 5 | 4 | 6 | 0 |

    | 测试 9 | 6 | 2 | 5 | 0 | 3 | 4 | 1 |

    | 测试 10 | 1 | 4 | 3 | 0 | 5 | 2 | 6 |

    | 测试 11 | 2 | 0 | 3 | 4 | 6 | 1 | 5 |

    | 测试 12 | 5 | 1 | 6 | 4 | 3 | 0 | 2 |


    图 14 从预计算测试库提取的七事件测试。


    ## 5.3 成本与实际考虑因素


    在其他形式的组合测试中，某些组合可能是不可实现的，或者在被测系统上不存在。例如，“接收消息”必须在“处理消息”之前发生。我们开发的算法使得指定值对 $x,y$
    成为可能，其中序列 $x..y$ 从生成的覆盖数组中排除。这通常会导致额外的测试，但不会显著增加测试数组的大小。


