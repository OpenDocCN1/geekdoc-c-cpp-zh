    # Number of Tests Required


    The challenge in computing covering arrays is to find the smallest possible array
    that covers all combinations of t variables. If every new test covered all previously
    uncovered combinations, then the number of tests needed would be


    ![](img/1ed33ef73de52a1c4905e6292418700a_68_0.png)


    Since this is not generally possible, the covering array will be significantly
    larger than $v''$, but still a reasonable number for testing. It can be shown
    that the number of tests in a t-way covering array will be proportional to


    for $n$ variables with $v$ values each.


    It''s worth considering the components of this expression to gain a better understanding
    of what will be required to do combinatorial testing. Note that the number of
    tests grows exponentially with the interaction strength t. The number of tests
    required for $t+1$-way testing will be in the neighborhood of $v$ times the number
    required for $t$-way testing. The table below shows how $v''$, grows for values
    of $v$ and $t$. Although the number of tests required for high-strength combinatorial
    testing can be very large, with advanced software and cluster processors it is
