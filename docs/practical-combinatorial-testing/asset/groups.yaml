    # Practical Combinatorial Testing


    number of random tests. Although ACTS pairwise tests provide better 3-way coverage
    than the random tests, at other interaction strengths and values of t, the random
    tests are roughly the same or slightly better in coverage than ACTS. Recall from
    Section 7.1 that pairwise combinatorial detected fewer events than the equivalent
    number of random tests. One possible explanation may be that the 4-way and 5-way
    coverage of random tests detected more events. Almost paradoxically, an algorithm
    that produces a larger, sub-optimal covering array may provide better failure
    detection because the larger array is statistically more likely to include t+1,
    t+2, and higher degree interactions as a product of the test generation. Again,
    however, the less optimal covering array is likely to more closely resolve the
    random test set in failure detection.


    A less optimal (by size) array may provide better failure detection because it
    includes more interactions at t+1, t+2, etc.


    Note that the number of failures in the SUT can affect the degree to which random
    testing approaches combinatorial testing. For example, suppose the random test
    set covers 99% of combinations for 4-way interactions, and the SUT contains only
    one 4-way interaction failure. Then there is a 99% probability that the random
    tests will contain the 4-way interaction that triggers this failure. However,
    if the SUT contains m independent failures, then the probability that combinations
    for all m failures are included in the random test set is $99^m$. Hence with multiple
    failures, random testing may be significantly less effective, as its probability
    of detecting all failures will be $c^m$, for $c$ = percent coverage and $m$ =
    number of failures.


