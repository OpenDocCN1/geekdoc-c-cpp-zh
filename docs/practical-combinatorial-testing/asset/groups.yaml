    ### 6.2.2 (t+k)-way 组合覆盖


    为 (t+1)-way 组合提供完全覆盖的测试集也将为 (t+2)-way 等提供某种程度的覆盖。这对于比较组合测试集可能有用。例如，可以使用不同的算法来生成
    3-way 覆盖数组。它们都实现了 100%-3-way 覆盖，但如果其中一个提供了 4-way 和 5-way 覆盖，那么可以认为它提供了更多的软件测试保障。


    > t-way 交互的测试集也将覆盖 t+1、t+2 等更高强度的交互。


    **定义。** 对于给定的 *n* 个变量的测试集，(t+k)-way 组合覆盖是指 *n* 个变量的 (t+k)-way 组合中，所有变量值配置被完全覆盖的比例。（注意，这种衡量方法通常适用于
    t-way 覆盖数组，作为超出 t 的覆盖的衡量标准）。


    **示例。** 如果将图 15 中的测试集如图 16 所示扩展，我们可以扩展 t-way 覆盖。对于该测试集，在四个 3-way 组合中，*bcd* 被覆盖，因此
    2-way 覆盖为 100%，而 (2+1)-way = 3-way 覆盖为 25%。


