    As shown in Fig. 2, most branching statement expressions are simple, with over
    70% containing only a single variable. Superimposing the curve from Fig. 2 on
    Fig. 1, we see (Fig. 3) that most failures are triggered by more complex interactions
    among variables. It is interesting that the NASA distributed database failures,
    from development-phase software reports, have a distribution similar to branching
    statements. This distribution may be because this was development-phase rather
    than fielded software like all other types reported in Fig. 1. As failures are
    removed, the remaining failures may be harder to find because they require the
    interaction of more variables. Testing and use may push the curve down and to
    the right.


