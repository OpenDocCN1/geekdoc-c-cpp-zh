    $p_n = v_{in}$, and $R_j$ is one of the possible results. The output of this step
    is a set of counterexamples that show the SUT can reach the claimed result $R_j$
    from a given set of inputs.


    The example in the following sections illustrates how these counterexamples are
    converted into tests. Other approaches to determining the correct output for each
    test can also be used. For example, in some cases we can run a model checker in
    simulation mode, producing results directly rather than a counterexample.


    The completed tests can be used to validate correct operation of the system for
    interaction strengths up to some pre-defined level $t$. Depending on the type
    and level of effort, we may use pairwise $(t=2)$ or higher strength, up to $t=6$
    interactions. We do not claim this guarantees of the system, as there may be failures
    triggered only by interaction strengths greater $t$. In addition, some of the
    parameters are likely to have a large number of possible values, requiring that
    they be abstracted into equivalence classes. If the abstraction does not faithfully
    represent the some flaws may not be detected by equivalence classes used.


