    # 8.2 Stronger Assertion-based Testing


    While the method described in the previous section can be very effective in testing,
    notice that it will be inadequate for many problems, because basic assertion functions
    as in C language library do not support logic operators as ∀ (for all) and ∃ (for
    some). Expressing simple properties such as S is sorted in ascending order = ∀:0≤i<n-1:S[i]≤S[i+1]
    cannot be done without a good deal of adding coding. While would be possible to
    add code to handle these problems in assertions, a better solution is to use an
    assertion language that is designed for the purpose and contains all the necessary
    features.


    Tools such as Anna [44] for Ada, the Java Modeling language (JML) [42] and iContract
    [28] for Java, and APP [57] or Nano [46] for C, can be used to introduce complex
    assertions, embedding a formal specification within the code. The embedded assertions
    as an executable form of the specification, providing an oracle for the testing
    phase. With embedded assertions, exercising the application with all t-way combinations
    can provide reasonable assurance that the code works correctly across a wide range
    of inputs. This approach has been used successfully for testing smart cards, with
    embedded JML assertions as an oracle for combinatorial tests [25]. Results showed
    80%- 90% of errors could be found in this way.'
  - '[PAGE 51]


    # Practical Combinatorial Testing


    # 8.3 Cost and Practical Considerations


    Assertions may be a cost-effective approach to test automation because they can
    be a simple extension of coding. In general, use of assertions is correlated with
    reduced error rates [41], but a wide range of effectiveness results from variations
    in usage. In many applications, assertions are used in a very basic way, such
    as ensuring that null pointers are not passed to a function that will them, or
    parameters that may be used as divisors are non-zero.


    More complex assertions can provide stronger assurance, but there are limits to
    their effectiveness. For example, invariants (properties that are expected to
    hold throughout a computation) cannot be assured without placing an assertion
    for every line of code. Since assertions must be executed to show the presence
    or absence of a property at some point, errors that prevent the assertion from
    being reached may not be detected. As an example, consider the code in Figure
    26. If a coding error in the first few lines of the function prevents execution
    the code at of lines 15 and 17, the assertions will not be executed and it may
    be assumed that the test passed. In this case, an ERROR return for the particular
    test case might trigger an investigation that would identify the faulty code,
    but this may not happen with other applications.


    # 8.4 Chapter Summary


    Assertions are one of the easiest to use and most effective approaches to dealing
    with the oracle problem. Properties ranging from simple parameter checks to effectively
    embedded proofs can be encoded in assertions, but special language support is
    needed for the stronger forms of assurance. This support may be provided as language
    preprocessors, as in the case of Anna [44]. Placement within code is particularly
    important to assertion effectiveness [60, 61], but if sufficiently strong assertions
    are embedded, the code becomes self-checking for important properties. With self-checking
    code, thousands of tests can be run at low cost in most cases, greatly improving
    the chances that faults will be detected.'
- md: "\n# Practical Combinatorial Testing\n\n## 9 MODEL-BASED TEST ORACLES\n\nOne\
    \ of the most effective ways to test oracles is to use a model of the system under\
    \ test, and generate complete tests, including both input data and expected results,\
    \ directly from the model. The model in this case is exactly what the name implies:\
    \ it incorporates the most important aspects of the system, but not every detail\
    \ such as the location of an answer on screen (if it did include all details,\
    \ it would be equivalent to the system itself). This chapter provides a step-by-step\
    \ introduction to model-automated generation of tests that provide combinatorial\
    \ coverage. Procedures introduced in this tutorial will produce a set of complete\
    \ tests, i.e., input values with the expected output for each set of inputs.\n\
    \nIn addition to the ACTS covering array generator (Appendix C), we use NuSM [18],\
    \ a variant of the original SMV model checker. NuSM is freely available and developed\
    \ by Carnegie Mellon University, Istituto per la Ricerca Scientifica e Tecnologica\
    \ (IRST), U. of Genova, and U. of Trento. NuSM can be installed on UNIX/Linux\
    \ or Windows systems running Cygwin. Links and instructions for downloading NuSM\
    \ are included in the appendix.\n\nAlso needed is a formal or semi-formal specification\
    \ of the system or subsystem under test (SUT). This can be in the form of a formal\
    \ logic specification, but state transition tables, decision tables, and structured\
    \ natural language can also be used, as long as the rules are unambiguous. Specification\
    \ can be converted to SMV code, which provides a precise, machine-processable\
    \ set of rules that can be used to generate tests.\n\n### 9.1 Overview\n\nTo apply\
    \ combinatorial testing, two tasks must be accomplished:\n\n- 1. Using ACTS, construct\
    \ a set of tests that will cover t-way combinations of parameter values. The covering\
    \ array specifies data, where each row of the array can be regarded as a set of\
    \ parameter values for an individual test (see Chapter 4).\n- 2. Determine what\
    \ output should be produced by the SUT for each set of input parameter values.\
    \ The test data output from ACTS will be incorporated into SMV specifications\
    \ that can be processed by the NuSM model checker. In many cases, the conversion\
    \ to SMV is straightforward. The example in Section 9.2.1 illustrates a simple\
    \ conversion of rules in the form \"if condition then action\" into the syntax\
    \ used by the model checker. The model checker will instantiate the specification\
    \ with parameter values from the covering array for each test in the covering\
    \ array. The resulting specification is evaluated against a claim that negates\
    \ each specified result $R_j$ using a model checker, so that the model checker\
    \ evaluates claims in the following: $C_i \\sim R_p$, where $C_i$ is a set of\
    \ parameter values in one row of the covering array in the form $p_1 = v_{i1}\
    \ \\& p_2 = v_{i2} \\& \\& \\&$ $p_n = v_{in}$, and $R_j$ is one of the possible\
    \ results. The output of this step is a set of counterexamples that show the SUT\
    \ can reach the claimed result $R_j$ from a given set of inputs.\n\nThe example\
    \ in the following sections illustrates how these counterexamples are converted\
    \ into tests. Other approaches to determining the correct output for each test\
    \ can also be used. For example, in some cases we can run a model checker in simulation\
    \ mode, producing results directly rather than a counterexample.\n\nThe completed\
    \ tests can be used to validate correct operation of the system for interaction\
    \ strengths up to some pre-defined level $t$. Depending on the type and level\
    \ of effort, we may use pairwise $(t=2)$ or higher strength, up to $t=6$ interactions.\
    \ We do not claim this guarantees of the system, as there may be failures triggered\
    \ only by interaction strengths greater $t$. In addition, some of the parameters\
    \ are likely to have a large number of possible values, requiring that they are\
