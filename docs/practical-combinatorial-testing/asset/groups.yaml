    # # Executive Summary


    Software implementation errors are one of the most significant contributors to
    information system security vulnerabilities, making software testing an essential
    part of system assurance. In 2003 NIST published a widely cited report which estimated
    that inadequate testing costs the US economy $59.5 billion per year, even 50%
    to 80% of development budgets go toward testing. Exhaustive testing – testing
    all possible combinations of inputs and execution paths – is impossible for real-world
    software, so high assurance testing is used with methods that require extensive
    staff time and have enormous cost. For less critical software, budget constraints
    often limit the amount of testing that can be accomplished, increasing the risk
    of residual errors that lead to system failures and security weaknesses.


    Combinatorial testing is a method that can reduce cost and increase the effectiveness
    of software testing for many applications. The key insight underlying this form
    of testing is that not every parameter contributes to every failure and most failures
    are caused by interactions between relatively few parameters. Empirical data gathered
    by NIST and others suggest that software failures are triggered by only a few
    variables interacting (6 or fewer). Finding this has important implications for
    testing because it suggests that combinatorial combinations of parameters can
    provide highly effective fault detection. Pairwise (2-way combinations) testing
    is sometimes used to obtain good results at low cost, but pairwise testing may
    miss 10% to 40% or more of system bugs, and is thus not sufficient for mission-critical
    software. Combinatorial testing beyond 2-way has been limited, primarily due to
    a lack of good algorithms for higher interaction levels such as 4-way to 6-way
    testing. New algorithms, however, have made combinatorial testing beyond pairwise
    practical for industrial use.


    This publication provides a self-contained tutorial on using combinatorial testing
    for real-world software. It introduces the key concepts and methods, explains
    use of software tools for generating combinatorial tests (freely available on
    the NIST website csrc.gov/acts), and discusses advanced topics such as the use
    of formal models of software to determine the expected results for each test inputs.
    With each topic, a section on costs and practical considerations explains tradeoffs
    and limitations that impact resources or funding. The material is accessible to
    an undergraduate student of computer science or engineering, and includes an extensive
    set of references to papers that provide more depth on each topic.'
