    # Practical Combinatorial Testing


    accepted the common approach to combinatorial testing because it is computationally
    tractable and reasonably effective.


    But if some failure is triggered only by a unusual combination of 3, 4, or more
    sensor values? It is very unlikely that pairwise tests would detect this unusual
    case; we would need to test 3-way and 4-way combinations of values. But is all
    4-way combinations enough to detect all errors? What degree of interaction occurs
    in real systems? Surprisingly, this question has not been studied since NIST began
    investigating failures in 1999. Results showed that across a variety of domains,
    all failures could be triggered by a maximum of 4-way to 6-way interactions [34,
    35, 36, 65]. As shown in Figure 2, the interaction level in t-way combinations
    is often referred to as strength). With the NASA application, for example, 67%
    of the failures were triggered by only a single parameter value, 93% by 2-way
    combinations, and 98% by 3-way combinations. The detection rate for the other
    applications studied are similar, reaching 100% detection with 4 to 6-way interactions.
    Studies by other researchers [6, 7, 26] have been consistent with these results.


    > Failures appear to be caused by interactions of only a few variables, so tests
    that cover such-variable interactions can be very effective.


    ![](img/1ed33ef73de52a1c4905e6292418700a_10_0.png)


    Figure 2. Error detection rates for interaction strengths 1 to 6


    While conclusive, these results are interesting because they suggest that, while
    pairwise testing is not sufficient, the degree of interaction involved in failures
    is relatively low. We summarize this result in what we call the interaction rule,
    an empirically-derived rule that characterizes the distribution of interaction
    faults:


    **Interaction Rule:** Most failures are induced by single factor faults or by
    the joint combinatorial effect (interaction) of two factors, with progressively
    fewer failures induced by interactions between three or more factors.


    # Practical Combinatorial Testing


    Testing all 4-way to 6-way combinations may therefore provide reasonably high
    assurance. With most issues in software, however, the situation is not that simple.
    Efficient generation of test suites to cover all t-way combinations is a difficult
    mathematical problem that has been studied for nearly a century. In addition,
    parameters are continuous variables which have possible values in a very large
    range (+/- 52). Values must be discretized to a few distinct values. Most glaring
    of all is the problem of determining the correct result that should be expected
    from the system under test for each set of tests. Generating 1000 test data inputs
    is of little help if we cannot determine what the system under test (SUT) should
    produce as output for each of the 1,000 tests.


    With the exception of combination testing these challenges are common to all types
    of software testing, and a variety of good techniques have been developed for
    dealing with them. What makes combinatorial testing today is the development of
    efficient algorithms to generate tests t-way combinations, and effective methods
    of integrating the tests into the testing process. A variety of approaches introduced
    in this publication can be used to make combinatorial testing practical and effective
    addition to the software''s toolkit.


    > Advances in algorithms have made combinatorial testing finally practical.


    A note on terminology: we use the definitions below, following the Institute of
    Electrical and Electronics Engineers [30]. The term “bug” may be used where its
    meaning is clear.


    - error: a mistake made by a developer. This could be a coding error or a misunderstanding
    of requirements or specification.

    - fault: a difference between an incorrect program and one that correctly implements
    a specification. An error may result in one or more failures.

    - failure: a result that differs from the correct result as specified. A fault
    in code may result in zero or more failures, depending on inputs and execution
    path.


    ## 2.1 Two Forms of Combinatorial Testing


    There are basically two approaches to combinatorial testing — use combinations
    of configuration parameter values, or combinations of input parameter values.
    In the first case, we select combinations of values by setting up any 4-way combinations
    of configuration parameters such as many of simultaneous connections allowed,
    OS, database size, etc., with the same test suite against each have been constructed
    using any methodology, not necessarily combinatorial coverage. The combinatorial
    aspect of this approach is in achieving combinatorial coverage of configuration
    parameter values. (Note, the term variable is often used interchangeably with
    parameter to refer to inputs to a function)


    > Combinatorial testing can be applied to configurations, input data, or both.


    In the second approach, we select combinations of input data values, which then
    become part of complete test cases, creating a test suite for the application.
    In this case combinatorial coverage of input data values is required for tests
    constructed. A typical hoc approach to testing involves matter experts setting
    up scenarios, selecting input values to exercise the application in each scenario,
    possibly supplementing these tests with unusual or suspected problems. In the
    combinatorial approach to input data selection, a test generation tool is used
    to cover all combinations of input values up to some specified limit. One such
    tool is ACTS (described in Appendix C), which is available freely from NIST.


    ### 2.1.1 Configuration Testing


    Many, if not, software systems have a large number of configuration parameters.
    Many of the earliest applications of combinatorial testing were testing in all
    pairs of system configurations. For example, telecommunications software may be
    configured with different types of call (local, long distance, international),
    billing (caller, phone card, 800), access (ISDN, VOIP, PBX), and server for billing
    (Windows Server, Linux/MySQL, Oracle).


    Configuration coverage is perhaps the most developed form of testing. For example,
    suppose we have an application that must work across a variety of systems. To
    ensure this, we create a test suite that covers all combinations of these configurations.
    As shown in Table 1, each pair is covered at least once.


    | Test | OS | Protocol |

    |---|---|---|

    | 1 | XP | DBMS |

    | 2 | XP | MySQL |

    | 3 | XP | IPv6 |

    | 4 | OS | IPv4 |

    | 5 | OS | Intel |

    | 6 | OS | Sybase |

    | 7 | RHEL | IPv4 |

    | 8 | RHEL | Firefox |

    | 9 | RHEL | AMD |


    ## 2.1.2 Input Testing


    Even if an application has no configuration, some form of input testing is needed.
    For example, a word processor may have many inputs that can be combined. Combinatorial
    testing can be used to ensure that combinations of these inputs are tested. An
    example is given in Figure 3, which shows a three-way covering array for 10 variables.
