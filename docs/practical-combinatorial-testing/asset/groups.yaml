    # 2.2 The Test Oracle Problem


    Even with efficient algorithms to produce covering arrays, the oracle problem
    remains testing both data and results that should be expected for each data input.
    High interaction strength combinatorial testing may require a large number of
    tests in some cases, although not always. Approaches to solving the oracle problem
    for combinatorial testing include:


    Crash testing: the easiest and least expensive approach is to simply run tests
    against the system under test (SUT) to check whether any unusual combination of
    input causes a crash or easily detectable failure. This is essentially the procedure
    used in "fuzz testing", which sends random values against the SUT. This form of
    combinatorial testing could be regarded as a disciplined form of fuzz testing
    [59]. It should be noted that although pure random testing will generally cover
    a high percentage of t-way combinations, 100% coverage of combinations requires
    a random test set much larger than a covering array. For example, all 3-way combinations
    of 10 parameters with 4'
  - '[PAGE 15]


    # Practical Combinatorial Testing


    values each can be covered with 151 tests. Purely random generation requires over
    900 tests to provide full 3-way coverage.

    Embedded assertions: An increasingly popular "light-weight formal methods" technique
    is to embed assertions within code to ensure proper relationships between data,
    for example precedents, postconditions, or value checkers. Tools such as the Java
    Modeling language (JML) are used to introduce complex assertions, effectively
    forming a formal specification within the code. The embedded assertions serve
    as an executable form of the specification, providing an oracle for the testing
    phase. With embedded assertions, exercising the application with all t-way combinations
    can provide reasonable assurance that the code works correctly across a wide range
    of inputs. This approach has been used successfully for testing smart cards, with
    embedded JML assertions acting as an oracle for combinatorial tests [25]. Results
    showed that 80% - 90% of errors could be found in this


    Model test generation uses a mathematical model of the SUT and a simulator or
    model checker to generate expected results for each input [1,8,92,55]. If a simulator
    can be used, expected results can be generated directly from the simulation, model
    checkers are widely available and also be used to prove properties such as in
    parallel processes, in generating tests. Conceptually, a model checker can be
    viewed as exploring states of a system model to determine if a property claimed
    in a specification is true. What makes a model checker particularly valuable is
    if the claim is false, the model checker not reports this, but also provides a
    "counterexample" showing how the claim can be shown false. If the claim is false,
    the model checker indicates this and provides a trace of parameter input values
    and expected result. It is then simple to map these values into complete test
    cases in the syntax for the system under test. Later chapters develop detailed
    procedures for applying each of these testing approaches.


    Several types of test oracle can be used, depending on resources and the system
    test.


    # 2.3 Chapter Summary


    +   1. Empirical data suggest that software failures are caused by the interaction
    of relatively few parameters, and the proportion of failures attributable to t-way
    interactions declines rapidly with t. That is, usually single parameter value
    or a pair of values is the cause of a failure, but increasingly smaller proportions
    are caused by 3-way, 4-way, and higher order interactions.

    2. Because a small number of parameters are involved in failures, we can attain
    a high degree of assurance by testing all t-way interactions, for an appropriate
    interaction strength (2 to 6 usually). The number of t-way tests that will be
    required is proportional to v log n, for n parameters with v values each.

    3. Combinatorial methods can be applied to configurations or input parameters,
    or in some cases both.

    4. With all other types of testing, the oracle problem must be solved i.e., for
    every test input, the expected output must be determined in order to check if
    the application is'
