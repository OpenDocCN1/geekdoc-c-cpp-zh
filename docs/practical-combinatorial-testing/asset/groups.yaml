    set of values cannot be found in fact to the particular result, the model checker
    indicates that this is true. For example, for the configuration below, the claim
    that will not grant is true, because the user''s clearance level (u_l = 0) is
    below the file''s level (f_l = 2):


    ```

    -- AG ((u_l = 0 & f_l = 2) & act = rd) -> AX (access = GRANT) is true

    ```


    If the claim is false, the model checker indicates this and provides a trace of
    parameter values and states that will prove it is false. In effect this is a complete
    test case, i.e., a set of parameter values and expected result needed for the
    system under. Excerpt from NuSMV output:


    ```

    -- AG ((u_l = 0 & f_l = 0) & act = rd) -> AX (access = GRANT) is false

    as demonstrated by the following execution sequence

    Trace Description: Counterexample

    Trace Type: Counterexample

    -> State: 1.1 <-

    u_l = 0

    f_l = 0

    act = rd

    -> Input: 1.2 <-

    -> State: 1.2 <-

    access = GRANT

    ```


    The model checker finds that 6 of the input parameter configurations produce a
    result of GRANT and 3 produce a DENY result, so at the completion of this step
    we have successfully matched each input configuration with the result that should
    be produced by the SAT. We strip out the parameter names and values, giving tests
    that can be applied to the system under. This can be accomplished using a variety
    of methods; a simple script used in this example is given in the appendix. The
    test inputs and expected results are shown below:


    ```

    u_l = 0 & f_l = 0 & act = rd -> access = GRANT

    u_l = 0 & f_l = 1 & act = wr -> access = GRANT

    u_l = 1 & f_l = 1 & act = rd -> access = GRANT

    u_l = 1 & f_l = 2 & act = wr -> access = GRANT

    u_l = 2 & f_l = 0 & act = rd -> access = GRANT

    u_l = 2 & f_l = 2 & act = rd -> access = GRANT

    u_l = 0 & f_l = 2 & act = rd -> access = DENY

    u_l = 1 & f_l = 0 & act = wr -> access = DENY

    u_l = 2 & f_l = 1 & act = wr -> access = DENY

    ```


    These tests can be post-processed using simple scripts written in PERL, Python,
    or similar tool to produce a test harness that will execute the SUT with each
    input and check the results. While tests for this trivial example could easily
    have been constructed manually, the procedures introduced in this tutorial can,
    and have, been used to produce tens of thousands of complete test cases in a few
    minutes, and the SMV model has been defined for the SUT.


    ## 9.3 Cost and Practical Considerations


    Model based test generation trades up-front analysis and specification time against
    the cost of greater human interaction for analyzing tests. The model or formal
    specification may be costly, but once it is available, large numbers of tests
    can be generated, executed, and analyzed without human intervention. This can
    be an enormous cost, since testing usually involves 50% or more of the software
    development budget. For example, suppose a $100,000 development project expects
    to spend $50,000 on testing, and analyze results. If a formal model can be created
    for $20,000, complete tests generated and analyzed automatically, with another
    $10,000 for a smaller number of human-involved tests and analysis, the project
    will save 20%. One tradeoff for this savings is the requirement for staff with
    skills in formal methods, but in some cases this approach may be practical and
    highly cost-effective.


    ## 9.4 Chapter Summary


    1. The oracle problem must be solved for any test methodology, and it is particularly
    important for thorough testing that produces a large number of test cases. One
    approach to determining expected results for each test input is to use a model
    of the system that can be simulated or analyzed to compute output for each input.


    2. Model checkers can be used to solve the oracle problem because whenever a property
    for a model does not hold, the checker generates a counter-example. The counter-example
    can be post-processed into a complete working test harness that executes all tests
    from the covering area and checks results.


    3. Several approaches are possible for integrating combinatorial testing with
    model checkers, but some present practical problems. The method reported in this
    chapter can be used to generate full combinatorial tests, with expected results
    for each test, in a cost effective way.

