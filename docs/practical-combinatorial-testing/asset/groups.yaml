    嵌入式断言：一种日益流行的“轻量级形式化方法”技术是在代码中嵌入断言，以确保数据之间的正确关系，例如前置条件、后置条件或值检查器。Java 建模语言 (JML)
    等工具用于引入复杂的断言，有效地在代码中形成一个形式化规范。嵌入式断言作为规范的可执行形式，为测试阶段提供了断言。通过嵌入式断言，使用所有 $t$ 路组合运行应用程序，可以合理地保证代码在广泛的输入范围内正常工作。这种方法已成功用于智能卡测试，嵌入的
    JML 断言作为组合测试的断言 [25]。结果显示，80% - 90% 的错误可以在此中找到。


    模型测试生成使用 SUT 的数学模型以及模拟器或模型检查器来为每个输入生成预期结果 [1,8,92,55]。如果可以使用模拟器，可以直接从仿真中生成预期结果；模型检查器广泛可用，也用于在生成测试时证明并行过程中的属性。从概念上讲，模型检查器可以被视为探索系统模型的状态，以确定规范中声称的属性是否为真。模型检查器特别有价值的地方在于，如果断言为假，模型检查器不仅报告这一点，还会提供一个显示如何证明断言为假的“反例”。如果断言为假，模型检查器会指示这一点并提供参数输入值和预期结果的轨迹。将这些值映射到被测系统语法的完整测试用例中非常简单。后续章节将详细介绍应用这些测试方法的具体程序。


    根据资源和系统测试，可以使用几种类型的测试断言。


    # 2.3 章总结


    1. 经验数据表明，软件故障是由少数参数的交互引起的，归因于 $t$ 路交互的故障比例随 $t$ 的增加而迅速下降。也就是说，通常单个参数值或一对值是失败的原因，但由
    3 路、4 路及更高阶交互引起的失败比例越来越小。

    2. 由于涉及故障的参数较少，通过测试所有的 $t$ 路交互（适当的交互强度通常为 2 到 6），我们可以获得高度的保证。对于 $n$ 个每个有 $v$ 个值的参数，所需的
    $t$ 路测试数量与 $v \log n$ 成正比。

    3. 组合方法可以配置或输入参数，在某些情况下两者均可。

    4. 对于所有其他类型的测试，必须解决断言问题，即对于每个测试输入，必须确定预期输出，以检查应用程序是否为每组输入产生正确的结果。有多种方法可以解决断言问题。


