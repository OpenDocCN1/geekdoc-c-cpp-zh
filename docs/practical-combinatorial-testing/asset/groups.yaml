    # Practical Combinatorial Testing


    Reports on Computer Systems Technology


    The Information Technology Laboratory (ITL) at the National Institute of Standards
    and Technology (NIST) promotes the U.S. economy and public welfare by providing
    technical leadership for the Nation’s measurement and standards infrastructure.
    ITL develops tests, test methods, reference data, proof of concept implementations,
    and technical analyses to advance the development and the productive use of information
    technology. ITL’s responsibilities include the development of technical, physical,
    administrative, and management standards and guidelines for the cost-effective
    security and privacy of sensitive unclassified information in Federal computer
    systems. This Special Publication 800-series reports on ITL’s research, guidance,
    and outreach efforts in computer security, and its collaborative activities with
    industry, government, and academic organizations.


