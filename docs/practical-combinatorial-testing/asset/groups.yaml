    # 4.3 Cost and Practical Considerations


    Combinatorial methods can be highly effective and reduce the cost of testing substantially.
    For example, Justin Hunter has applied these methods to a wide variety of test
    problems and consistently found both lower cost and more rapid error detection
    [30]. But with most aspects of engineering, tradeoffs must be considered. Among
    the most important is the question of when to stop testing, balancing the cost
    of testing against the risk of failing to discover additional failures. An extensive
    body of research has been devoted to this topic, and sophisticated models are
    available for determining when the cost of further testing will exceed the expected
    benefits [10, 45]. Existing models for when to stop testing can be applied to
    the combinatorial test approach also, but there is an additional consideration:
    What is the appropriate interaction strength to use in this type of testing?


    To answer these questions consider the number of tests at different interaction
    strengths for an avionics software example [34] shown in Figure 13. While the
    number of tests will be different (probably much smaller than in Figure 13) depending
    on the system under test, the magnitude of difference between levels of $t$ will
    be similar to Figure 13, because the number of tests grows with $v!$, for parameters
    with $v$. That is, the number of tests grows with the exponent $t$, so we want
    to use the smallest interaction strength that is appropriate for the problem.
    Intuitively, it seems that if no failures are detected by $t$-way tests, then
    it may be reasonable to consider additional testing for $t+1$ interactions, but
    get no additional failures are found at $t+1$. In the empirical studies of software
    failures, the number of failures detected at $t > 2$ decreased monotonically with
    $t$, so this heuristic makes sense: Start testing using 2-way (pairwise) combinations,
    continue increasing the interaction strength $t$ until no errors are detected
    by the $t$-way tests, then (optionally) try t+1 and ensure that no additional
    errors are detected. As with other aspects of software development, this guideline
    is also dependent on resources, time constraints, and cost-benefit considerations.'
