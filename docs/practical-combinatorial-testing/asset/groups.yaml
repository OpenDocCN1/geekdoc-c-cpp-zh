    \ 小时）会发生什么。测试数量将与 $24^4 = 331,776$ 成正比。在这个示例中，时间是以分钟提供的，这显然是完全无法行的。因此，我们必须为小时参数选择代表性值。这个问题出现在所有类型的测试中，而不仅仅是组合方法，已经开发了良好的方法来处理它。大多数测试人员已经熟悉其中两种：等价类划分和边界值分析。关于这些方法的额外背景可以在软件测试书中找到，如\
