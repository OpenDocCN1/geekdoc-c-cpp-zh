  mdcn: "\n\n# 组合测试与随机测试\n\n为了使测试最高效且最有效，我们需要理解何时何特定的测试最为合适。也就是说，问题的哪些特征导致我们选择某种形式的测试而非另一种？在成本和有效性方面存在怎样的权衡？一些研究比较了组合测试方法和随机测试方法的的有效性，并得出了结论\
