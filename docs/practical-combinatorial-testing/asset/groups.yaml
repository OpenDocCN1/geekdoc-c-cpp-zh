    # 组合测试实践


    连续变量使得情况更加复杂。例如，如果一个与失败相关的分支消耗任何时间 $x > 100, z < 1000$，则可能存在许多暗示失败的组合。分析将显示 $[x
    = 200, y = 3, z = 120], [x = 201, y = 3, z = 119], [x = 999, y = 3, z = 999],
    [x = 101, y = 3, z = 0], [x = 200, y = 3, z = 0]$ 都是触发失败的组合。当输入参数超过三个时，可能会有几十甚至数百个触发失败的组合，尽管代码中很可能只有一个点点是错误的。


    # 10.2 成本与实际考虑


    如上面的示例所示，仅凭测试结果确定触发失败的组合并不是件易事。当源代码可用时，本节描述的方法可能是不必要的，并可以用传统的调试技术来代替。在没有源代码的黑盒测试情况下，这些方法可能有助于缩小搜索触发失败组合的范围。实现这些方法的工具已经开发完成并可以在
    ACTS 项目网站获取。


    # 10.3 章总结


    当源代码可用时，识别失败原因的最佳方法是使用传统的调试技术，因为无论如何在代码中修复错误。在纯黑盒测试且无法访问源代码的情况下，本章讨论的启发式方法可能有助于缩小可能的原因。通常会有许多组合被识别为可能的原因，因此可能需要大量的额外测试来确定确切原因。


    # 附录 A – 数学回顾


    本附录回顾了理解本文物中概念所需的组合数学、正则表达式和数学逻辑的基本事实。


    ## 组合数学


    ### 排列与组合


    对于 $n$ 个变量，有 $n!$ 种排列和 $\binom{n}{t} = \frac{n!}{t!(n-t)!}$（$n$ 取 $t$）种 $t$ 个变量的组合，为了方便也记作
    $C(n, t)$。为了测试程序输入的所有 $t$ 路组合，我们需要覆盖变量值的所有 $t$ 路组合，每个变量 $v$ 可以有 $v^t$ 种配置，其中 $v$
    是每个变量的值数。因此，必须覆盖的实例化值的组合总数为：


    $\binom{n}{t}$ (1)


    幸运的是，每个测试 $t$ 覆盖了 $C(n, t)$ 种组合配置。这就是组合测试威力所在。对于 34 个二进制变量，我们需要 $2^{34} = 1.7
    \times 10^{10}$ 次测试来覆盖所有可能的配置，但仅需 33 次测试即可覆盖这 34 个变量的所有 3 路组合。这是因为每个测试覆盖了 $C(34,
    3)$ 种组合。


    **示例。** 如果我们有五个二进制变量 $a, b, c, d, e$，那么公式 (1) 显示我们需要覆盖 $2^5 * C(5, 3) = 32 * 10
    = 80$ 种配置。对于 3 路组合测试，我们需要取所有的 3 变量组合，共计 10 组：


    - abc, abd, abe, acd, ace, ade, bce, bde, cde


    其中每一个组合都需要用三个二进制变量的 8 种可能配置来实例化：


    - 000, 001, 010, 011, 100, 101, 111


    测试 $[0\ 1\ 0\ 0\ 1]$ 覆盖了以下 $C(5, 3) = 10$ 种配置：


    - abd abe acde bcd bce bde cde

    010 000 011 001 001 101 101 101 001


    ## 正交表


    许多软件测试问题可以通过正交表解决，这种结构在软件以外的其他领域已用于组合测试数十年。正交表 $OA_{\lambda}(N;t,k,v)$ 是一个 $N
    \times k$ 数组。在每个 $N \times t$ 子数组中，每个 $t$ 元恰好出现 $\lambda$ 次。我们将 $t$ 称为交互覆盖的*强度*，$k$
    称为参数或组件的数量（度），$v$ 称为每个参数或组件的可能值的数量（阶）。


    **示例。** 假设我们有一个由嵌入式处理器控制的三个开关的系统。因此 $t = 2, \lambda = 1, v = 2$。注意每对有 $v'' = 2^2$
    种可能的组合：$00, 01, 10, 11$。有 $C(3,2) = 3$ 种选择开关对的方法：$(1,2), (1,3)$ 和 $(2,3)$，每个测试覆盖三对，因此测试总共覆盖了12种组合，这意味着每个组合恰好被覆盖一次。


    | 测试 | Sw1 | Sw2 | Sw3 |

    |---|---|---|---|

    | 1 | 0 | 0 | 0 |

    | 2 | 0 | 1 | 1 |

    | 3 | 0 | 1 | 0 |

    | 4 | 1 | 0 | 1 |


    ## 覆盖表


    正交表的替代方案是集*覆盖表*，它包含了变量的所有 $t$ 路组合。$CA_{\lambda}(N;t,k)$ 是一个 $N \times k$ 数组。在每个
    $N \times t$ 子数组中，每个 $t$ 元至少出现 $\lambda$ 次。注意每对有 $v'' = 2^t$ 种可能的组合。组合测试的挑战并非遥不可及。


    计算覆盖表的挑战是找到覆盖所有 $t$ 个变量组合的最小数组。如果每个新测试都能覆盖所有未覆盖的组合，那么所需的测试次数将是


    由于这通常不可能，覆盖表将显著大于 $v''$，但对于测试来说是一个合理的范围内。


