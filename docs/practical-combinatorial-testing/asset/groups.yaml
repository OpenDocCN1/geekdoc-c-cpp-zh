    # 10 故障定位


    开发可靠的软件需要尽可能地防止 bug，并检测后修复剩余的 bug。测试可以识别软件中的缺陷，但在发现测试失败后，有必要确定失败的原因。在大多数情况下，这可以通过与其他测试方法相同的方式，通过组合测试、使用调试器或在电路仿真器来完成。但组合测试的目标之一是识别触发故障的
    t-way 组合。故障定位问题（即识别此类组合）是一个活跃的研究领域，但可以识别出一些基本方法。本章的讨论假设系统是确定性的，即特定的输入始终会产生相同的输出。


    从表面上看，故障定位似乎并不是一个困难的问题，在很多情况下确实如此，但我们希望尽可能地自动化这一过程。为了理解问题的规模，考虑一个具有 20 个输入参数的模块。一组
    3-way 覆盖测试的通过率为 100%，但从 4-way 覆盖出的若干测试会导致失败。（因此，至少四个参数值参与了故障的触发。可能是 5-way 或更高组合导致了故障，因为任何一组
    t-way 测试都包含了 (t+1)-way 及更高强度的组合。）一个具有 20 个输入参数的测试有 C(20, 4) = 4845 个 4-way 组合，但推测其中一个（或仅几个）触发了故障。为了确定故障所在的组合，可以使用多种策略。


    ## 10.1 集合论分析


    这里提出的分析适用于确定性系统，在 particular系统中，特定的输入值集合始终产生相同的处理和输出。令 P = {通过测试的组合}，F = {失败测试中的组合}，C
    = {触发故障的组合}。那么 F\P（即失败测试中但不在任何通过测试中的组合）必须包含触发故障的组合 C，因为如果 C 中的任何一个组合在 P 中，那么测试将会失败。在大多数情况下，C
    ⊆ F\P，如图 30 所示。


    ![](img/1ed33ef73de52a1c4905e6292418700a_61_0.png)


    **图 30. 失败测试中但不在通过测试中的组合。**


    ## 实用组合测试


    继续以这种分析，某些属性变得显而易见。对于下文的讨论，Pt = {t-way 通过测试的组合}，Ft 和 Ct 定义类似。令 T = {t-way 测试}，f(x)
    是一个指示测试 x 在测试下是通过还是失败的函数。因此 P4 = {4-way 通过测试的组合}，TS={5-way 测试} 等。


    假设如果每当组合 c 包含在某些测试 x 中，f(x)=fail，则特定的组合 c 就会触发或导致失败。（也就是说，系统是确定性的，且触发故障的组合没有被其他参数标记。）我们现在整合这些用于识别触发故障组合
    C 的启发式方法。


    - 对于确定性系统，F\P 必须包含触发故障的组合 C，如果其中任何一个在 P 中，则测试将会失败。

    - 交互下界：如果所有 t-way 测试都失败，那么一个 t-way 或更低级的组合没有失败。故障一定是由某个 (t+k)-way 组合引起的，其中 k >
    t。注意，其反过来并不一定成立：如果某些 t-way 测试失败，我们不能断定是 t-way 测试导致了故障，因为任何 t-way 测试都包含某些 k-way
    组合，k > t。

    - 交互连续性：现在考虑 Ct。由于 t-way 测试覆盖了所有 t-way 或低强度的组合（例如，4-way 测试也覆盖了所有 3-way 组合），在 Ft
    中触发故障的组合也必须在 F(t+1), F(t+2) 等。我们可以通过计算 Ft∩F(t+1)...F(t+k)（其中 k 是具有可用测试的交互强度）来进一步减少潜在的故障触发组合。

    - 值依赖性：如果 Ft 中的测试覆盖了 t-way 参数组合的所有值，则故障与 c 无关；即 c 不是 t-way 故障触发组合。


    **示例：** 在前面的描述中，我们假设如果每当组合 c 包含在某些测试 x 中，f(x)=fail，则特定的组合 c 就会触发或导致失败。然而，在许多情况下，特定的组合可能会触发故障，但不保证一定触发（参见上文对交互下界的讨论）。考虑以下：


    ```

    1. p(int a, int b, int c, int d, int e) {

    2. if (a && b) return 1;

    3. else if (c && d) return 2;

    4. else if (e) return 3;

    5. else return 4;

    6. }

    ```


    如果第 3 行错误实现为 "return 7" 而不是 "return 2"，那么 p(1,1,1,1,0) = 1，因为 "a && b" 结果为一；而
    p(0,1,1,1,0) 将检测到错误。一个完整的 3-way 覆盖集将检测到错误，因为它必须包含至少一个 0,1,1,1.. 以及一个带有 0,1,1,1..
    的测试。图 31 显示了该示例在 t = 2, 3 和 4 的测试。失败的测试带有下划线。2-way 测试可能会检测到错误，因为 "c && d" 是必要的，但只有在到达第
    3 行且需要 a=0 或 b=0 时才会发生。在这种情况下，一个 2-way 测试在 P 和 F 中都检测到了 c=1 和 d=1。调试可能会识别出 c=1,
    d=1 为触发故障的组合，使用在失败测试中不在通过测试中的组合的启发式方法识别 a=0 和 b=0。如图 32 所示，我们将找到多个导致故障的组合。


