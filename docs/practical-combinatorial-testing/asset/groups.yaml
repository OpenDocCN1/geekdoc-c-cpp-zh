    SPEC AG (u_l = 0 & f_l = 1 & act = wr) -> AX (access = GRANT);

    SPEC AG (u_l = 0 & f_l = 2 & act = rd) -> AX (access = GRANT);

    SPEC AG (u_l = 1 & f_l = 0 & act = rd) -> AX (access = GRANT);

    SPEC AG (u_l = 1 & f_l = 1 & act = wr) -> AX (access = DENY);

    SPEC AG (u_l = 1 & f_l = 2 & act = rd) -> AX (access = DENY);

    SPEC AG (u_l = 2 & f_l = 0 & act = rd) -> AX (access = DENY);

    SPEC AG (u_l = 2 & f_l = 1 & act = wr) -> AX (access = DENY);

    SPEC AG (u_l = 2 & f_l = 2 & act = rd) -> AX (access = DENY);

    ```


    ## 9.2.3 从反例生成测试


    NuSMV 产生反例，这些输入值反驳了上一节指定的断言。每个反例都是一组引发 GRANT 或 DENY 结果的测试数据。对于每个 SPEC 断言，如果无法在特定结果中找到这组值，模型检查器将指示它是正确的。例如，对于下方的配置，不会授权的断言是正确的，因为用户的权限级别（u_l
    = 0）低于文件的级别（f_l = 2）：


    ```

    -- AG ((u_l = 0 & f_l = 2) & act = rd) -> AX (access = GRANT) is true

    ```


    如果断言为假，模型检查器会指示这一点，并提供证明其为假的参数值和状态。实际上，这是一个完整的测试用例，即被测系统所需的参数值和预期结果。以下是 NuSMV
    输出的摘录：


    ```

    -- AG ((u_l = 0 & f_l = 0) & act = rd) -> AX (access = GRANT) is false

    as demonstrated by the following execution sequence

    Trace Description: Counterexample

    Trace Type: Counterexample

    -> State: 1.1 <-

    u_l = 0

    f_l = 0

    act = rd

    -> Input: 1.2 <-

    -> State: 1.2 <-

    access = GRANT

    ```


    模型检查器发现 6 个输入配置产生了 GRANT 结果，3 个产生了 DENY 结果，因此在此步骤我们成功地将每个输入配置与 SAT 应产生的结果匹配。我们提取参数名称和值，给出可以应用于被测系统的测试。这可以使用多种方法；附录提供了本示例使用的简单脚本。测试输入和预期结果所示：


    ```

    u_l = 0 & f_l = 0 & act = rd -> access = GRANT

    u_l = 0 & f_l = 1 & act = wr -> access = GRANT

    u_l = 1 & f_l = 1 & act = rd -> access = GRANT

    u_l = 1 & f_l = 2 & act = wr -> access = GRANT

    u_l = 2 & f_l = 0 & act = rd -> access = GRANT

    u_l = 2 & f_l = 2 & act = rd -> access = GRANT

    u_l = 0 & f_l = 2 & act = rd -> access = DENY

    u_l = 1 & f_l = 0 & act = wr -> access = DENY

    u_l = 2 & f_l = 1 & act = wr -> access = DENY

    ```


    这些测试可以使用 PERL、Python 或类似工具编写的简单脚本进行后处理，以产生执行每个输入的被测系统并检查结果的测试框架。虽然这个简单易示例的测试很容易手动构建，但本教程介绍的方法可以并且已经用于在几分钟内生成数万个完整测试用例，并为被测系统了
    SMV 模型。


    ## 9.3 成本与实际考虑


    基于模型的测试生成是用前期的分析和规范时间与分析测试时更高的人机交互成本进行交易。模型或形式规范可能很高，但一旦可用，就可以在无需人工介入的情况下生成、执行和分析大量测试。这是一项巨大的成本，因为测试通常涉及软件开发预算的
    50% 或以上。例如，假设一个 100,000 美元的开发项目预计花费 50,000 用于测试和分析结果。如果花费 20,000 创建形式模型，自动生成并分析完整测试，再花费
    10,000 用于少量的人工参与测试和分析，该项目将节省 20%。这种节省的代价是需要具有形式方法技能的员工，但在某些情况下，这种方法可能是可行且高效益的。


    ## 9.4 章节总结


    1. 任何测试方法必须解决求解器问题（oracle problem），对于产生大量测试用例的彻底测试来说特别重要。确定每个测试输入的预期结果的一种方法是使用系统模型，该模型可以被模拟或分析以计算每个输入的输出。


    2. 模型检查器可以用于解决求解器问题，因为每当模型的属性不成立时，检查器就会生成一个反例。反例可以被后处理成一个完整的工作测试框架，该框架执行覆盖区域的所有测试并检查结果。


    3. 将组合测试与模型检查器集成有多种方法，但某些方法存在实际问题。本章报告的方法可以以成本效益的方法生成带有每个测试预期结果的全组合测试。


