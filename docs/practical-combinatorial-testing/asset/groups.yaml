    # 6 测量组合覆盖率


    由于测试所有可能的组合几乎是不可能的，因此组合测试是一种合理的替代方案。对于某些 $t$ 值，测试参数之间所有的 $t$ 阶交互将检测出几乎所有的错误。$t=n$
    是可能的，但回想起故障的经验数据，我们预计 $t$ 较小。确定输入或状态的覆盖水平有助于理解测试后剩余的风险程度。如果覆盖了 100% 的状态空间，推测风险很小，但如果覆盖率小得多，那么风险可能是巨大的。本章描述了一些组合覆盖率的指标，这些指标有助于估计这种风险。


    # 6 组合覆盖率


    由于测试所有可能的组合几乎是不可能的，组合测试是一种合理的替代方案。对于某些 $t$ 值，测试参数之间所有的 $t$ 阶交互将检测出几乎所有的错误。$t=n$
    是可能的，但回想起故障的经验数据，我们预计 $t$ 较小。确定输入或状态的覆盖水平有助于理解测试后剩余的风险程度。如果覆盖了 100% 的状态空间，推测风险很小，但如果覆盖率小得多，那么风险可能是巨大的。本章描述了一些组合覆盖率的指标，这些指标有助于估计这种风险。


    ## 6 组合覆盖率


    注意，覆盖率指标依赖于对程序代码的访问。相比之下，组合测试是一种黑盒技术。输入是预定义的，预期结果是从某些形式的规范中得出的。程序被简单地视为一个接受输入并产生输出的处理器，不需要了解工作原理。


    即使在不知道程序内部结构的情况下，我们也可以应用组合方法产生精确且有效的指标。在这种情况下，我们测量输入的状态。假设我们有一个程序接受两个输入 x 和 y，每个输入有
    10 个值。那么输入状态由 10²=100 对 x 和 y 值组成，这可以想象成一个 10 行 10 列的棋盘。如果有三个输入 x、y 和 z，我们将得到一个具有
    10³=1000 个点的立方体。将示例扩展到 n 个输入，我们将得到一个（为了可视化）n 维超立方体，具有 10ⁿ 个点。即使对于几千行代码，可能的路径数量在逻辑上是无限的。因此，已经开发了多种方法来衡量覆盖率。以下是一些常用的覆盖率指标：


    - 语句覆盖（Statement coverage）：测试集执行的语句百分比。虽然看起来 100% 的语句覆盖应该提供良好的信心，但在实践中，语句覆盖是一个相对弱的标准。除非语句覆盖接近
    100%，否则可能。


    - 决策或分支覆盖（Decision or branch coverage）：被测试集评估为真和假的分支百分比。


    - 条件覆盖（Condition coverage）：决策表达式中被测试集评估为真和假的条件百分比。注意，100% 的条件覆盖并不保证 100% 的决策覆盖。例如，对于“if
    (A || B) (do something) else (do something)”使用 [0], [1] 进行测试，那么 A 和 B 都将被视为 0
    和 1，但 else 分支不会被执行。


    - 修改决策覆盖（MCDC）：这是一种强覆盖标准，是美国联邦航空管理局对 A 类（灾难性后果）软件的要求；故障可能导致人员完全损失。它要求程序中的每个条件至少出现一次，且每个条件都被证明能独立影响决策结果，并且每个入口和出口点都被调用过一次。


