    | 0,0,0,1 | 0,0,0,1 | 0,0,0,1 | 0,0,0,1 |


    The heuristics above can be applied to combinations in failed tests to identify
    possible-triggering combinations, shown in Figure 32.


    - The 1-way tests do not detect any failures, so t=2 is lower bound for interaction
    level to detect a failure.

    - The value dependence applies to combinations "be" – since all four values for
