    \ ACT 生成的数组的 2 到近 5 倍。因此，如果需要100% 的组合覆盖，组合测试的成本应远低于随机测试。\n\n在比较组合测试与随机测试时，一个重要的实际考虑因素是覆盖数组生成器的效率。不同算法生成的覆盖数组大小范围很大。更好的算法生成的数组比其他算法小\
    \ 50% 的情况并不罕见。我们在与其他工具比较时发现，并没有统一的“最佳”算法。其他算法可能会产生更小或更大的组合测试集，因此相应的随机套件在覆盖组合数量上会有所不同。\n\
