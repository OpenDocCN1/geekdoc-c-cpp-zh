    \n# 正则表达式\n\n正则表达式是符号字符串的形式化描述，可以代表文本、事件、字符或其他对象。它们开发于自动机理论和形式语言领域，这些领域表明，表达式与处理它们的自动机之间存在直接映射，并且它们出现在计算机科学的许多领域。在组合测试中，它们可能会出现在序列排序或输入输出的处理中。实现方式各异，但下文解释了标准语法。\n\
    \n# 表达式运算符\n\n正则表达式的基本元素：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `\\|` | “或”选择分支。例如：abac\
    \ 匹配 \"ab\" 或 \"ac\" |\n| `?` | 前一个元素的 0 次或 1 次。例如：abc? 匹配 \"ac\" 或 \"abc\" |\n\
    | `*` | 前一个元素的 0 次或多次。例如：ab* 匹配 \"a\", \"ab\", \"abb\", \"abbb\" 等。 |\n| `+` |\
    \ 前一个元素的 1 次或多次。例如：ab+ 匹配 \"ab\", \"abb\", \"abbb\" |\n| `()` | 分组。例如：(abc\\|bcd)\
    \ 匹配 \"abc\" 或 \"bcd\" |\n| `.` | 匹配任意单个字符。例如：a.c 匹配 \"abc\", \"axc\", \"a@c\"\
    \ 等。 |\n| `[]` | 匹配括号内的任意单个字符。例如：[abc] 匹配 \"a\" 或 \"b\" 或 \"c\"。也可以指定范围。例如：[a-z]\
    \ 匹配任何单个小写字母。（此选项取决于支持的字符。） |\n| `[^` | 匹配不在括号内的任意单个字符。例如：[^ab] 匹配除 \"a\" 或 \"\
    b\" 外的任何字符 |\n| `^` | 匹配起始位置，即第一个字符之前 |\n| `$` | 匹配结束位置，即最后一个字符之后 |\n\n# 组合运算符\n\
    \n上述运算符可以与符号组合创建任意复杂的表达式。示例包括：\n\n- `\\.a.*b.*c.*` \"a\" 后接 \"b\" 后接 \"c\"，且在\
    \ \"a\" 之前有零或多个符号，在 \"c\" 之后，或在三个符号之间穿插\n- `a\\|b*` 空或 \"a\"或 \"b\" 的零次或多次出现\n\
    - `a+` 等价于 `aa*`\n\n许多正则表达式实用程序（如 egrep）支持更广泛的运算符和功能。读者应咨询 grep、egrep 或其他正则表达式处理器的文档，以获取特定工具可用选项的详细范围。\n\
