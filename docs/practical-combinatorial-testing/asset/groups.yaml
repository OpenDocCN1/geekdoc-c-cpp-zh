    # 实用组合测试


    计算机系统技术报告


    美国国家标准与技术研究院（NIST）下属的信息技术实验室（ITL）通过为国家测量和标准基础设施提供技术领导力，促进美国经济和公共福利。ITL 开发了测试、测试方法、参考数据、概念验证实现和技术分析，以推进信息技术的开发和生产性利用。ITL
    的职责包括为联邦计算机系统中敏感非机密信息的成本效益安全和隐私制定技术、物理、行政和管理标准及指南。本 800 系列特别出版物报告了 ITL 在计算机安全方面的研究、指导和推广工作，以及与工业、政府和学术组织的协作活动。


