    # 3 CONFIGURATION TESTING


    This chapter presents worked examples illustrating development of test configurations.
    As will be seen, the advantages of combinatorial testing increase with the size
    of the problem.


    # 3.1 Simple Application Platform Example


    Returning to the simple example introduced in Chapter 2, we illustrate development
    of test configurations, and compare the size of test suites for various interaction
    strengths versus all configurations. For the five configuration parameters, we
    have $3-2-2-2-3 = 72$. The convention for describing the variables and values
    in combinatorial testing is $v_1^{n_1}v_2^{n_2}$ where $v_i$ are number of variables
    and $n_i$ are number of occurrences. Thus configuration is designated $2^{3^7}$.
    Note that at $t=5$, the number of tests is as exhaustive as testing for this example,
    because there are only five parameters. The savings as a percentage of exhaustive
    testing are good, but not impressive for this small example. With larger systems
