    \ 12 所示面板开关设置的软件。有 34 个开关，可以开启或关闭，共有 $2^{34}$ 种组合。\n\n> 系统越大，从组合测试中获得的益处越多。\n\n\
    ![](img/ed33ef73de52a1c4905e629241870a_26_0)\n\n图 12 具有 34 个开关的面板。\n\n### 4.3\
    \ 成本与实际考虑\n\n组合方法可以非常有效，并大幅降低测试成本。例如，Hunter 将这些方法应用于各种测试问题，并始终发现更低的成本和更快的错误检测速度。但对于大多数工程方面，必须考虑权衡。其中最重要的问题之一是何时停止测试，即平衡测试成本与未能发现额外故障的风险。关于这一主题已有大量的研究，并且有复杂的模型可以确定何时进一步测试的成本将超过预期收益\
    \ [10, 45]。现有的何时停止测试模型也可以应用于组合测试方法，但还有一个额外的考虑因素：在此类测试中使用合适的交互强度是多少？\n\n"
