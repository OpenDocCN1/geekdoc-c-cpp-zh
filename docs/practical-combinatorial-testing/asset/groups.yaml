    of parameters. As shown above, the number of tests increases rapidly as the value
    of t is increased, but the rate of increase depends on the number of values per
    parameter. Binary variables, with only two values each, result in fewer tests
    than parameters with many values each. As a practical matter, partitioning the
    input space (section 4.1), it is best to keep the number of values per parameter
    below 8 or 10 if possible.


    Because the number of tests increases only logarithmically with the number of
    parameters, test set size for a large problem may be somewhat larger than for
    a much smaller problem. For example, if a project uses combinatorial testing for
    a system that has 20 parameters and several hundred tests, a much larger system
    with 40 to 50 parameters may only require a few dozen more tests. Combinatorial
    methods may generate the best cost benefit ratio for large systems.


    ## 4.4 Chapter Summary


    - 1. The key advantage of combinatorial testing derives from the fact that, nearly
    all, software failures appear to involve interactions of only a few parameters.
    Generating a covering of input array allows us to test all of these interactions,
    up to a level of 5-way or 6-way combinations, depending on resources.


    - 2. Practical testing often requires abstracting the values of a variable into
    a small set of equivalence classes. For example, if a variable is a 32-bit integer,
    it is clearly not possible to test the full range of values in -2^31. This problem
    is not unique to combinatorial testing, but in most test methodologies. Simple
    heuristics and engineering judgment are required to determine the appropriate
    partitioning of values into equivalence classes, but once this is accomplished
    it is possible to generate covering arrays of a few hundred to a few thousand
    tests for many applications. The thoroughness of coverage will depend on resources
    and criticality of the application.


    # 5 SEQUENCE-COVERING ARRAYS


    In testing event-driven software, the critical condition for triggering failures
    is often whether or not a particular event has occurred prior to a second one,
    not necessarily if they are back to back. This situation reflects the fact that
    in many cases, a particular state must be reached before a particular failure
    can be triggered. For example, a failure might occur when connecting device A
    only if device B is already connected. The methods described in this chapter were
    developed to solve a real problem in interoperability test and evaluation, using
    combinatorial methods to provide efficient testing. Sequence covering arrays,
    as defined here, ensure that any t events are tested in every possible t-way order.


    For this problem we can define a sequence-covering array [39, 40], which is a
    set of tests that ensure all t-way sequences have been tested. The t events in
    the sequence may be interleaved with others, but all permutations will be tested.
    For example, we may have a component of a factory system that uses certain devices
    interacting with a control program. We want to test the events defined in Table
    6.


    > In many systems, the order of inputs is important.


    There are 6! = 720 possible sequences for these six events, and the system should
    respond correctly and not matter the order in which they occur. Operators may
    be instructed to use a particular order, but mistakes are inevitable, and should
    not result in injury to users or compromise the enterprise. Because setup, connections
    and operations of this component are manual, each test can take considerable amount
    of time. It is not uncommon for system-level tests as this to take hours to execute,
    monitor, and complete. We want to test this as thoroughly as possible, but constraints
    do not allow for testing all possible sequences, so we will test all 3-event sequences.


    With events, a, b, c, d, e, and f one subset of three is {[b, d, e}, which can
    be arranged in permutations: [b e d] [b d e] [d b e] [e b d]. A test covers the
    permutation [b d e]: [a d c f e]; another is [a d e b]. A larger system may have
    10 devices to connect, in which the number of permutations is 10!, or 3,628,800
    tests for exhaustive testing. In that case, 3-way sequence covering array with
    14 tests covering all 10-way sequences is a dramatic improvement, as 72 tests
    for all 4-way sequences (see Table 8).


    | Event | Description |

    |---|---|

    | a | connect air flow |

    | b | connect pressure gauge |

    | c | connect satellite link |

    | d | connect pressure readout |

    | e | engage drive |

    | f | engage steering |


    Table 6. System events


    **Definition.** We define a finite set $S$ of $s$ symbols, SCA($N, S, t$) as an
    $N \times S$ matrix where entries are from $S$, such that every $t$-way permutation
    of symbols from $S$ occurs at least one row; the $t$ symbols in the permutation
    are not required to be adjacent. That is, for every $t$-way combination of $n$
    variables $x_1, x_2, ..., x_t$, the regular expression $*x_1**x_2**x_t*$ matches
    at least one row in the sequence. Covering arrays, analogous to standard arrays,
    which include at least one of every $t$-way combination where $t \le n$. A variety
    of algorithms are available for constructing and generating $t$-way sequences.


    **Example 1.** Consider the problem of testing four events, $a, b, c$, and $d$.
    For convenience, a $t$-way permutation of symbols is referred to as $t$-way sequence.
    There are $4! = 24$ possible permutations of these four events, but we can test
    all 3-way sequences of these events with only six tests (see Table 7).


    ## 5.1 Constructing Covering Arrays


    A 2-way sequence covering array can be constructed by listing the events in some
    order for one test and in reverse order for the second test:


    | | a | b | c | d |

    |---|---|---|---|---|

    | 1 | a | b | c | d |

    | 2 | b | a | c | d |

    | 3 | b | d | c | a |

    | 4 | c | a | b | d |

    | 5 | c | d | b | a |

    | 6 | d | a | c | b |


    Table 7. Tests for four events.


    To see the difference in Example 2 generates tests that cover all 2-way sequences,
    note that for 2-way coverage, every pair of variables $x$ and $y$, $x..y$, and
    $y..x$ must be in some test (where $a..b$ means that $a$ is essentially followed
    by $b$). All variables are included in each test, therefore any sequence $x..y$
    must be in either test 1 or test 2 and reverse $y..x$ in the other test. For $t$-way
    sequence generation, where $t > 2$, we use a greedy algorithm that generates a
    large number of tests, scores each by the number of uncovered sequences it covers,
    then chooses the highest scoring. This simple approach produces surprisingly good
    results.


    ## 5.2 Using Sequence Arrays


    Sequence covering arrays have been incorporated into operational testing for a
    mission-critical system that uses multiple devices with inputs and outputs to
    a laptop computer. The test procedure has 8 steps: boot system, open application,
    run scan, peripherals P-1 through P-5. It is expected that for some sequences,
    the system will not function properly, thus the order of connecting peripherals
    is a critical aspect of testing. In addition, there are constraints on the sequence
    of events: cannot scan unless the app is open; cannot open app until system is
    built. There are 40,320 permutations of 8 steps, but some are redundant (e.g.,
    changing the order of peripherals before boot), and some are invalid (constraints).
    Around 7,000 are valid, and non-redundant, but this is far too many for a system
    that requires manual, physical connections of devices.


    The system was tested using a seven-step sequence covering array, incorporating
    the assumption that there is no strength-3 sequences that involve boot-up. The
    initial configuration (Figure 14) was drawn from the library of pre-computed sequence
    tests. Some changes were made to the pre-computed sequences based on unique requirements
    of the test. If=Open App and=Run Scan, then cases 1, 4, 6, 8, 10, and 12 are invalid,
    the scan cannot be run before the application is started. This was handled by
    swapping 0 and 1 when they are adjacent (1 and 4), out of order. For the other
    cases, several cases were generated from each that were valid mutations of the
    invalid case. A test was also added to see whether it mattered where of three
    USB connections were placed. The last test case ensures at least strength 2 (sequence
    of length 2) for all peripheral connections and ''Boot'', i.e., that each peripheral
    connection occurs prior to boot. The final array is shown in Table 9.


    | Test | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---|---|---|---|---|---|---|

    | Test 1 | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    | Test 2 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | Test 3 | 2 | 1 | 0 | 6 | 5 | 4 | 3 |

    | Test 4 | 3 | 4 | 5 | 6 | 0 | 1 | 2 |

    | Test 5 | 4 | 1 | 6 | 0 | 3 | 2 | 5 |

    | Test 6 | 5 | 2 | 3 | 0 | 6 | 1 | 4 |

    | Test 7 | 0 | 6 | 4 | 5 | 2 | 1 | 3 |

    | Test 8 | 3 | 1 | 2 | 5 | 4 | 6 | 0 |

    | Test 9 | 6 | 2 | 5 | 0 | 3 | 4 | 1 |

    | Test 10 | 1 | 4 | 3 | 0 | 5 | 2 | 6 |

    | Test 11 | 2 | 0 | 3 | 4 | 6 | 1 | 5 |

    | Test 12 | 5 | 1 | 6 | 4 | 3 | 0 | 2 |


    Figure 14. Seven-event test from pre-computed test library.


    ## 5.3 Cost and Practical Considerations


    With other forms of combinatorial testing, some combinations may be either impossible
    or not exist on the system under test. For example, ''receive message'' must occur
    before ''process message''. The algorithm we developed made it possible to specify
    pairs x,y, where the sequence x..y is to be excluded from the generated covering
    array. Typically this will lead to extra tests, but not increase the test array
    significantly.

