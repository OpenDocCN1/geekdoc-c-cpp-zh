    ## 7.3 成本与实际考量


    覆盖数组与随机生成测试之间的关系带来了一些有趣的问题。为组合测试生成覆盖数组是复杂的；已被证明是一个 NP-hard 问题。随机生成测试是易易的。因此，对于大型问题，我们可以比较生成组合数组与随机产生测试的成本和时间，测量它们的覆盖率（第
    6 章），然后根据需要添加测试以提供完全组合。注意表 10 的最后一列。对于 4 路测试，当参数数量超过约 20 时，随机生成将覆盖 99%；例如，100
