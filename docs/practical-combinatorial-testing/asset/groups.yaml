    ### 6.2.2 (t+k)-way combination coverage


    A test set that provides full combinatorial coverage for (t+1)-way combinations
    will also provide some degree of coverage for (t+2)-way combinations, etc. This
    might be useful for comparing combinatorial test sets. For example, different
    algorithms may be used to generate 3-way covering arrays. They both achieve 100%-3-way
    coverage, but if one provides 4-way and 5-way coverage, then it can be considered
    to provide more software testing assurance.


    > A test set for t-way interactions will also cover higher strength interactions
    at t+1, t+2, etc.


    **Definition.** For a given test set for *n* variables, (t+k)-way combination
    coverage is the proportion of (t+k)-way combinations of *n* variables for which
