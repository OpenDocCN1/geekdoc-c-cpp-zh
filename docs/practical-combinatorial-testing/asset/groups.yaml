    We have also investigated a particular class of vulnerabilities, denial-of-service,
    using reports from the National Vulnerability Database (NVD), a publicly available
    repository of data on all publicly reported software vulnerabilities. NVD can
    be queried for fine-granularity reports on vulnerabilities. Data from 3,045 denial-of-service
    vulnerabilities have the distribution shown in Table 3. We present this data separately
    from that because it covers only one particular kind of failure, rather than data
    on any failures occurring in a particular program as shown in Figure 1.


    | Vars | NVD cumulative % |

    |---|---|

    | 1 | 93% |

    | 2 | 99% |

    | 3 | 100% |

    | 4 | 100% |

    | 5 | 100% |

    | 6 | 100% |


    **Table 3.** Cumulative percentage of denial-of-service vulnerabilities triggered
    by t-way interactions.


    Why do the failure detection curves look this way? That is, does the error rate
    tail off with more variables interacting? One possibility is that there are simply
    few complex interactions in branching points in software. If branches involve
    4-way, 5-way, or 6-way interactions among variables, this degree of interaction
    could be for failures as well. The table below (Table 4 and Fig. 2) gives the
    number and percentage of branches in avionics code triggered by one to 19 variables.
    This distribution was'
