    --SPEC AG ((u_l = f_l = 0 & act = rd) -> AX (access = GRANT);

    --SPEC AG ((f_l = 1 & act = wr) -> AX (access = GRANT);

    --SPEC AG ((!(u_l = f_l = 2 & act = rd) | (f_l = u_l & act = wr)) -> AX (access
    = DENY));

