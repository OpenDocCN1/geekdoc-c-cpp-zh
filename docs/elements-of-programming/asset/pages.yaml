    # ## 9.1 Writability


    This chapter discusses the second kind of access to iterators and other coordinate
    structures: writability. A type is *writable* if a unary procedure sink is defined
    on it; sink can only be used on the left side of an assignment whose right side
    evaluates to an object of ValueType(T):


    ```

    Writable(T) ≜

    ValueType : Writable → Regular

    (∀x ∈ T) (∀v ∈ ValueType(T)) sink(x) ← v is a well-formed statement

    ```


    The only use of sink(x) justified by the concept *Writable* is on the left side
    of an assignment. Of course, other uses may be supported by a particular type
    modeling Writable.


    sink does not have to be total; there may be objects of a writable type on which
    sink is not defined. As readability, the concept does not provide a definition-space
    predicate to determine whether sink is defined for a particular object. Validity
    of its use in an algorithm must be derivable from preconditions.'
