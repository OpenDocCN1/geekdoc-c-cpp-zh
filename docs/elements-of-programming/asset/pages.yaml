    # 4.3 Order Selection


    Given a weak ordering r and two objects a and b from r''s domain, it makes sense
    to ask which is the minimum. It is obvious how to define the minimum when r or
    its converse holds between a and b is not so when they are equivalent. A similar
    problem arises if we ask which is the maximum.


    A property for dealing with this problem is known as *stability*. Informally,
    an algorithm is *stable* if it respects the original order of equivalent objects.
    If we think of minimum and maximum as selecting, respectively, the smallest and
    second smallest from a list of two arguments, stability requires that when called
    with equivalent elements, minimum should return the first and maximum the second.¹


    > 1. In later chapters we extend the notion of stability to other categories of
    algorithms.'
