    create overloaded procedures. When actual type parameters satisfy the requirements,
    the instances of the abstract procedure have the same semantics.


    # 3.6 Linear Recurrences


    A linear recurrence function of order k is a function f such that


    $f(y_0, \dots, y_{k-1}) = \sum_{i=0}^{k-1} a_i y_i$


    where coefficients $a_0, a_{k-1} \neq 0$. A sequence $\{x_0, x_1, \dots\}$ is
    a linear recurrence sequence of order k if there is a linear recurrence function
    of order k—say, f—and


    $(\forall n \geq k) x_n = f(x_{n-1}, \dots, x_{n-k})$


    Note that indices of k decrease. Given initial values $x_0, \dots, x_{k-1}$ and
    a linear recurrence function of order k, we can generate a linear recurrence sequence
    via a straightforward iterative algorithm. This algorithm requires $n-k+1$ applications
    of the function to compute $x_n$, for $n \geq k$. As we will see, we can compute
    $x_n$ in $O(\log_2 n)$ steps, using power. If $f(y_0, \dots, y_{k-1}) = \sum_{i=0}^{k-1}
    a_i y_i$ is a linear recurrence


    +   7. The first O($\log n$) algorithm for linear recurrence is due to Miller
    and Brown [1966].'
