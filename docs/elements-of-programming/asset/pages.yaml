  md: '# Preface


    needed to specify algorithms. We assume programming maturity and understanding
    of computer architecture² and fundamental algorithms and data structures.³


    We chose C++ because it combines powerful abstraction facilities with faithful
    representation of the underlying machine.⁴ use a small subset of the language
    and write requirements as structured comments. We hope that readers not already
    familiar with C++ are able to follow the book. Appendix B specifies the subset
    of the language used in the book.⁵ Wherever there is a difference between mathematical
    notation and C++, the typesetting and the context determine the mathematical or
    C++ meaning. While many concepts and programs in the book have parallels in STL
    (the C++ Standard Template Library), the book departs from some of the STL design
    decisions. The book also ignores issues that a real library, such as STL, has
    to address: namespaces, livability, inline directives, and so on.


    Chapter 1 describes values, objects, types, procedures, and concepts. Chapters
    2–5 describe algorithms on algebraic structures, as semigroups and totally ordered
    sets. Chapters 6–11 describe algorithms on abstractions of memory. Chapter 12
    describes objects containing other objects. The Afterword presents our reflections
    on the approach presented by the book.


