  md: '# 1.4 Procedures


    A procedure is a sequence of instructions that modifies the state of some objects;
    it may also construct or destroy objects.


    The objects with which a procedure can be divided into four kinds, corresponding
    to the intentions of the programmer.


    +   1. Input/output consists of objects passed to/from a procedure directly or
    indirectly through its arguments or returned result.

    2. Local state consists of objects created, destroyed, and usually modified during
    a single invocation of the procedure.

    3. Global state consists of objects accessible to this and other procedures across
    multiple invocations.

    4. Own state consists of objects accessible only to this procedure (and its affiliated
    procedures) but shared across multiple invocations.


    An object is passed directly if it is passed as an argument or returned as the
    result and is passed indirectly if it is passed via a pointer or pointerlike object.
    An object is an input to a procedure if it is read, not modified, by the procedure.
    An object is an output from a procedure if it is written, created, or destroyed
    by the procedure, but its initial state is not read by the procedure. An object
    is an input/output of a procedure if it is modified as well as read by the procedure.


    A computational basis for a type is a finite set of procedures that enable the
    construction of any other procedure on the type. A basis is efficient if and only
    if any procedure implemented using it is as efficient as an equivalent procedure
    written in terms of an alternative basis. For example, a basis for unsigned k-bit
    integers providing only zero, equality, and the successor function is not efficient,
    since the complexity of addition in terms of successor is exponential in k.


    A basis is expressive if and only if it allows compact and convenient definitions
    of procedures on the type. In particular, all the common mathematical operations
    need to be provided when they are appropriate. For example, subtraction could
    be implemented using negation and addition but should be included in an expressive
    basis. Similarly, negation could be implemented using subtraction and zero but
    should be included in an expressive basis.


    # 1.5 Regular Types


    A set of procedures whose inclusion in the computational basis of a type lets
    us place objects in data structures and use algorithms to copy objects from one
    data structure to another. We call types having such a basis regular, their'
