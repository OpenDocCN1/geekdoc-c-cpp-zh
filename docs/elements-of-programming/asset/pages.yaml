  md: "# Structures\n\nA structure is a type consisting of a heterogeneous tuple of\
    \ named, typed objects called data members. Each data member is either an individual\
    \ object or an array of constant size. In addition, the structure may include\
    \ definitions of constructors, a destructor, member operators (assignment, application,\
    \ and indexing), and local typedefs. A structure with an apply operator member\
    \ is known as a function object. Omitting the structure body allows a forward\
    \ declaration.\n\n```\nstructure               = \"struct structure_name [structure_body]\
    \ \";\nstructure_name      = identifier;\nstructure_body       = \"{ member }\
    \ \";\nmember               = data_member\n                       | constructor\n\
    \                       | assign | apply | index\n                       | typedef;\n\
    data_member          = expression identifier(\"[\" expression \"]\" \";\nconstructor\
    \           = structure_name(\" ( [parameter_list] \")\"\n                   \
    \    | [: initializer_list \\];\ndestructor            = \"~\" \"operator\" \"\
    =\" body.\nassign               = \"( parameter \")\" body.\napply           \
    \     = expression \"operator\" \"[ [\" body.\n                       | \"( [parameter_list]\
    \ \")\" body.\nindex                = expression \"operator\" \"[ [\" body.\n\
    \                       | \"( parameter \")\" body.\ninitializer_list     = initializer(\"\
    ,\", initializer);\ninitializer           = identifier(\" ( [expression_list]\
    \ \").\n```\n\nA structure taking a constant reference to the type of the structure\
    \ is a copy constructor. If a copy constructor is not defined, a member-by-member\
    \ constructor is generated. A structure with no arguments is a default constructor.\
    \ A member-by-member default constructor is generated only if no other constructors\
    \ are defined. If an assignment operator is not defined, a member-by-member assignment\
    \ operator is generated. If no destructor is supplied, a member-by-member destructor\
    \ is generated. Each identifier in an initializer list is the identifier of a\
    \ data member of the structure. If a constructor contains an initializer list,\
    \ every data member of the structure is constructed with a constructor matching¹\
    \ the expression list\n\n+   1. The matching mechanism performs overload resolution\
    \ by matching without any implicit conversions."
