  md: 'Designing data structures as composite objects with ownership and remote parts
    leads to a programming style in which the primary objects—those that are not subparts
    of other objects—reside in static variables, with a lifetime of the entire program
    execution or, in local variables, with a lifetime of a block. Dynamically allocated
    memory is used only for remote parts. This extends the stack-based block structure
    of Algol 60 to handle arbitrary data structures. Such structure naturally fits
    many applications. However, there are circumstances in which reference counting,
    garbage collection, or other memory-management techniques are appropriate.


    # # Conclusions


    Programming is an iterative process: studying useful problems, finding efficient
    algorithms for them, distilling the concepts underlying the algorithms, and organizing
    the concepts and algorithms into a coherent mathematical theory. Each new discovery
    adds to the permanent body of knowledge, but each has its limitations.'
  merge: -1
