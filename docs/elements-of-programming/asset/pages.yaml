    # 6.9 Random-Access Iterators


    Some iterator types satisfy the requirements of both indexed and bidirectional
    iterators. These types, called *random-access iterators*, provide the full power
    of computer addresses:


    ```

    RandomAccessIterator(T) ⊎

    IndexedIterator(T) ⊓ BidirectionalIterator(T)

    ^ TotallyOrdered(T)

    (Vi, j ∈ T) i < j ⇔ i < j

    ^ DifferenceType: RandomAccessIterator → Integer

    ^ + : T × DifferenceType(T) → T

    − : T × DifferenceType(T) → T

    − : T → DifferenceType

    ^ < takes constant time

    ^ between an iterator and an integer takes constant time

    ```


    DifferenceType(T) is large enough to contain distances and their additive inverses;
    if i and j are iterators of a valid range, i - j is always defined. It is possible
    to add a negative integer to, or subtract from it, an iterator.


    On weaker iterator types, the operations + and – are only defined within one range.
    For random-access iterator types, this holds for < as well as for + and –. In
    general, an operation on two iterators is defined only when they belong to the
    same range.


