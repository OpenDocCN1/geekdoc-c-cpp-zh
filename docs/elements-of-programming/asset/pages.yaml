  md: '# # Appendix A Mathematical Notation


    We use the symbol ≜ to mean “equals by definition.”

    If P and Q are propositions, so too are ¬P (read as “not P”), P ∨ Q (“P or Q”),
    P ∧ Q (“P and Q”), P ⇒ Q (“P implies Q”), and P ⇔ Q (“P is equivalent to Q”).

    For equivalence, we often write “P if only if Q”.


    If P is a proposition and x is a variable, (∃x)P is a proposition (read as “there
    exists x such that P”). If P is a proposition and x is a variable, (∀x)P is a
    proposition (read as “for all x, P”); (∀x)P ⇔ ¬(∃P).


    We use this vocabulary from set theory:


    +   - a ∈ X (“a is an element of X”)

    - X ⊂ Y (“X is a subset of Y”)

    - {a₀, ..., aₙ} (“the finite set with elements a₀, ..., aₙ”)

    - {a|P(a)} (“the subset of X for which the predicate P holds”)

    - X ∪ Y (“the union of X and Y”)

    - X ∩ Y (“the intersection of X and Y”)

    - X × Y (“the direct product of X and Y”)

    - f: X → Y (“f is a function from X to Y”)

    - f: X₀ × X₁ → Y (“f is a function from the product of X₀ and X₁”)

    - x ↦ ε(x) (“x maps to ε(x), always following a function signature)


    A closed interval [a, b] is the set of all elements x that a ≤ x ≤ b. An open
    interval (a, b) is the set of all elements x that a < x < b. A half-open-right
    interval [a, b) is the set of all elements x such that a ≤ x < b. A half-open-left
    interval (a, b] is the set of all elements x that a < x ≤ b. A half-open-on-right
    interval is our shorthand for half-open on right. These definitions generalize
    to weak orderings.'
