    A relation is transitive, whenever it holds between a and b, and between c, it
    holds between a and c:


    +   **property(R : Relation)**

    transitive : R

    r ↦ (∀a, b, c ∈ Domain(R)) (r(a, b) ∧ r(b, c) ⇒ r(a, c))


    Examples of transitive relations are equality, equality of the first of a pair,
    reachability in an orbit, and divisibility.'
