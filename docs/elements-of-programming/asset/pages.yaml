    direct product. We follow standard mathematical usage, where partial function
    includes total function. We call partial procedures that are not nontontal. Implementations
    of some total functions are nontontal on the computer because of the finiteness
    of the representation. For example, addition on signed 32-bit integers is nontontal.


    A nontontal procedure is accompanied by a precondition specifying its definition
    space. To verify the correctness of a call of that procedure, we determine that
    the arguments satisfy the precondition. Sometimes, a partial procedure is passed
    as a parameter to an algorithm that needs to determine at runtime of the procedural
    parameter. To deal with such cases, we define a definition-space predicate with
    the same inputs as the procedure; the predicate returns true and only if the inputs
    are within the definition space of the procedure. Before a nontontal procedure
    is called, either its precondition must be satisfied, or the call must be guarded
    by a call of its definition-space predicate.


