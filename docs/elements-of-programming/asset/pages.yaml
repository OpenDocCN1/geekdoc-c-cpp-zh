  md: '# ABOUT THE AUTHORS


    ![](img/a479d6552a61d9597526ad091f9f868d_276_0.png)


    Alexander Stepanov

    studied mathematics at Moscow State University from 1967 to 1972. He has been
    programming since 1972, first in the Soviet Union and then, after emigrating in
    1977, in the United States. He has programmed operating systems, programming tools,
    compilers, and libraries. His work on the foundations of programming has been
    supported by General Electric, Polytechnic Institute of New York, AT&T, Hewlett-Packard,
    Silicon Graphics, and, since 2002, Adobe Systems. In 1995, he received the Dr.
    Dobb''s Excellence in Programming Award for the design of the C++ Standard Library.


    ![](img/a479d6552a61d9597526ad091f9f868d_276_1.png)


    Paul McJones studied engineering mathematics at the University of California,
    Berkeley, from 1967 to 1971. He has been programming since 1967 in the areas of
    operating systems, programming environments, transaction processing systems, and
    enterprise and consumer applications. He has been employed by the University of
    California, IBM, Xerox, Tandem, Digital Equipment Corporation, and, and since
    2003, Adobe Systems. In 1982, he and his coauthors received the ACM Programming
    Systems and Languages Paper Award for "The Recovery Manager of the System Database
    Manager."


    Jacket design and illustration by Chuti Prasertsith

    Author photos by Kelly Castro


    # Addison-Wesley

    Pearson Education'
