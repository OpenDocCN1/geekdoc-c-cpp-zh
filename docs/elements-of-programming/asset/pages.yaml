    # Expressions


    Expressions may be either runtime or compile time. Compile-time expressions may

    evaluate to either a value or a type.


    Expressions are defined by the following grammar. Operators in inner

    productions—those appearing lower in the grammar—have a higher order of prece-

    de than those in outer productions:


    ```

    expression = conjunction("|") conjunction.

    conjunction = equality("==") equality.

    equality = relational("===" | "!\=

    ```'
