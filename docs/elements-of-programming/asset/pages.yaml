  md: '# 1.3 Objects 5


    Describing the states of objects in terms of values allows us to abstract from
    the particular implementations of the objects when discussing equality. Functional
    programming deals with values; imperative programming deals with objects.


    We use values to represent entities. Since values are unchanging, they can represent
    abstract entities. Sequences of values can also represent sequences of concrete
    entities. Objects hold values representing entities. Since objects are changeable,
    they can represent concrete entities by taking on a new value to represent a change
    in the entity. Objects can also represent abstract entities: staying constant
    or taking on different approximations to the abstract.


    We use objects in the computer for the following reasons.


    +   1. Objects model changeable concrete entities, such as employee records in
    a payroll application.


    +   2. Objects provide a powerful way to implement functions on values, such as
    a procedure implementing the square root of a floating-point number using an iterative
    algorithm.


    +   3. Computers with memory constitute the only available realization of a universal
    computational device.


    Some properties of value types carry through to object types. An object is well
    formed if and only if its state is well formed. An object type is properly partial
    and if only if its value type is properly partial; otherwise it is total. An object
    type is uniquely represented if and only if its value type is uniquely represented.


    Since concrete entities have identities, objects representing need a notion of
    identity. An identity token is a unique value expressing the identity of an object
    and is computed from the value of the object and the address of its resources.
    Examples of identity tokens are the address of the object, an index into an array
    where the object is stored, and an employee name in a personnel record. Testing
    equality of identity tokens corresponds to testing identity. During the lifetime
    of an application, a particular object could use different identity tokens as
    it moves either within a data structure or from one data structure to another.


    Two objects of the same type are equal if and only if their states are equal.
    If two objects are equal, we say that one is a copy of the other. Making a change
    to an object does not affect any copy of it.


    This book uses a programming language that has no way to describe values and value
    types as separate from objects and object types. From this point on, when we refer
    to types without qualification, we mean object types.'
