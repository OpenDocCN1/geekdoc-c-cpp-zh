  md: '# B.1 Language Definition 235


    primary = literal | identifier | " expression " | basic_type | template_name |
    "typename".


    expression_list = expression ("," expression).


    The || && operators designate v (disjunction) and ^ (conjunction), respectively.
    The operands must be Boolean values. The first operand is evaluated prior to the
    second operand. If the first operand determines the outcome of the expression
    (true for ||, or false for &&), the second operand is not evaluated, and the result
    is the value of the first operand. Prefix ! ~ (negation) and must be applied to
    a Boolean value.


    == and != are, respectively, equality and inequality operators and return a Boolean
    value.


    <, <=, and >= are, respectively, less, greater, less or equal, and greater or,
    returning a Boolean value.


    + and - are, respectively, addition and subtraction; prefix - is additive inverse.
    *, /, % are, respectively, multiplication, division, and remainder.


    Postfix . (dot) takes an object of structure type and returns the member corresponding
    to the identifier dot. Postfix () takes a procedure or object on which the apply
    operator is defined and returns the result of invoking the procedure or function
    with the given arguments. When applied to a type, () performs a construction using
    the given arguments; when applied to a function, it returns another type. Postfix
    [] takes an object on which the index operator is defined and returns the element
    whose position is determined by the value of the expression within the brackets.


    Prefix const is a type operator returning a type that is a constant version of
    its operand.


    Postfix & is a type operator returning a reference type of its operand.


    # Enumerations


    An enumeration generates a type with a unique value corresponding to each identifier
    in the list. The only operations defined on enumerations are those of regular
    types: equality, relational operations, inequality, construction, destruction,
    and assignment-.


    ```

    enumeration = "enum" identifier "(" identifier_list ");"

    identifier_list = identifier ("," identifier).

    ```'
