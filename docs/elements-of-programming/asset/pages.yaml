- img_proc: true
  md: '# Alexander Stepanov

    Paul McJones


    Ask a mechanical, structural, or electrical engineer how far they would get without
    a heavy reliance on a mathematical foundation, and they will tell you ‘not far.’
    Yet so-called software engineers often practice their art with little or no idea
    of the mathematical underpinnings of what they are doing. And then we wonder why
    software is notorious for being delivered late and full of bugs, while other engineers
    routinely deliver bridges, automobiles, electrical appliances, etc., on time and
    with only minor defects. This book sets out to redress this imbalance. Members
    of my advanced development team at Adobe took the course based on the same material
    all benefited greatly from the time invested. It may appear as a highly technical
    text intended for computer scientists, but it should be required reading for all
    practicing software engineers.


    > -Martin Newell, Adobe Fellow


    The book contains some of the most beautiful code I have ever seen.


    > -Bjarne Stroustrup, Designer of C++


    I am happy to see the content of Alex’s course, the development and teaching of
    which I strongly supported as the CTO of Silicon Graphics, now available to all
    programmers in this elegant book.


    > -Forest Baskett, General Partner, New Enterprise Associates


    Paul’s patience and architectural experience helped to organize Alex’s mathematical
    approach into a tightly-structured edifice—an impressive feat!


    > -Robert W. Taylor, Founder of Xerox PARC PSL

    and DEC Systems Research Center'
