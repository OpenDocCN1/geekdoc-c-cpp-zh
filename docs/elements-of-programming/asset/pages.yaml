    # ## 7.1 Bifurcate Coordinates


    Iterators allow us to traverse linear structures, which have a single successor
    at each position. While there are data structures with an arbitrary number of
    successors, in this chapter we study an important case of structures with exactly
    two successors at every position, labeled left and right. In order to define algorithms
    on structures, we define the following concept:


    ```

    BifurcateCoordinate(T) ⊓

    Regular(T)

    ^ WeightType : BifurcateCoordinate → Integer

    ^ empty : T → bool

    ^ has_left_successor : T → bool

    ^ right_successor : T → bool

    ^ left_successor : T → T

    ^ right_successor : T → T

    ^ (Vi, j ∈ T) (left_successor(i) = j ∨ right_successor(i) = j) ⇒ ¬empty(j)

    ```


    The WeightType type function returns a type capable of counting all objects in
    a traversal that uses a bifurcate coordinate. WeightType is analogous to DistanceType
    for an iterator type.'
