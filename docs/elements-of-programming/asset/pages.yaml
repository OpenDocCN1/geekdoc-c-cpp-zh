    It is frequently useful to identify commonly occurring expressions involving procedures
    and constants by defining special-case procedures. Often these special cases can
    be implemented more efficiently than the general case and, therefore, belong to
    the computational basis of the type. For built-in types, there may exist machine
    instructions for the special cases. For user-defined types, there are often even
    more significant opportunities for optimizing special cases. For example, division
    of two arbitrary polynomials is no more difficult than division of a polynomial
    by x. Similarly, division of two Gaussian integers (numbers of the a + bi where
    a and b are integers and i = \sqrt{-I}) is more difficult than division of a Gaussian
    integer by 1 + i.


