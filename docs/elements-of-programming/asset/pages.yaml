    \ a satisfactory implementation of the algorithm and is appropriate when the cost\
    \ of performing the operation is considerably larger than the overhead of the\
    \ function calls caused by recursion. In this section we derive the iterative\
    \ algorithm that performs the same number of operations as power.0, using a sequence\
    \ of program transformations that can be used in many contexts. For the rest of\
    \ the book, we will show only final or almost-final versions.\n\npower.0 contains\
    \ two identical recursive calls. While only one is executed in a given invocation,\
    \ it is possible to reduce the code size via common-subexpression elimination:\n\
    \n```\ntemplate<typename I, typename Op>\nrequires(Integer(I) && BinaryOperation(Op))\n\
    Domain(Op) power_1(Domain(Op) a, I n, Op)\n{\n    // Precondition: associative(op)\
    \ ^ n > 0\n    if (n == I(1)) return a;\n    Domain(Op) r = power_1(op(a, a),\
    \ n / I(2), op);\n    if (n % I(2) != I(0)) r = op(r, a);\n    return r;\n}\n\
    ```\n\nOur goal is to eliminate the recursive call. A first step is to transform\
    \ the procedure to tail-recursive form, where the procedure's execution ends with\
    \ the recursive call. One of the techniques that allows this transformation is\
    \ accumulation-variable introduction, where the accumulation variable carries\
    \ the accumulated result between recursive calls:\n\n```\ntemplate<typename I,\
    \ typename Op>\nrequires(Integer(I) && BinaryOperation(Op))\nDomain(Op) power_accumulate0(Domain(Op)\
    \ r, Domain(Op) a, I n,\nOp op)\n```\n\n> 5. Compilers perform similar transformations\
    \ for built-in types when the semantics and complexity of the operations are known.\
    \ The concept of regularity is an assertion by the creator of a type that programmers\
    \ and compilers can safely perform such transformations."
