    # 7.3 Coordinate Structures


    So far, we have defined individual concepts, each of which specifies a set of
    procedures and their semantics. Occasionally it is useful to define a concept
    schema, which is a way of describing some common properties of a family of concepts.
    While it is not possible to define an algorithm on a concept schema, it is possible
    to describe structures of related algorithms on different concepts belonging to
    the same concept schema. For example, we defined several iterator concepts describing
    linear traversals and bifurcate concepts describing traversal of binary trees.
    To allow traversal within arbitrary data structures, we introduce a concept schema
    called coordinate structures. A coordinate structure may have several interrelated
    coordinate types, each with diverse traversal functions. Coordinate structures
    abstract the navigational aspects of data structures, whereas composite objects,
    introduced in Chapter 12, abstract storage management and ownership. Multiple
    coordinate structures can describe the same set of objects.


    A concept is a coordinate structure if it consists of one or more coordinate types,
    zero or more value functions, and zero or more access functions. Each traversal
    function maps one or more coordinate types and/or value types into a coordinate
    type, whereas each access function maps one or more coordinate types and/or value
    types into a value type. For example, when considered as a coordinate structure,
    a readable indexed iterator has one value type and two coordinate types: the iterator
    type and its distance type. The traversal functions are + (adding a distance to
    an iterator) and — (giving the distance between two iterators). There is one access
    function: source.


    # 7.4 Isomorphism, Equivalence, and Ordering


    Two collections of the same coordinate structure concept are isomorphic if they
    have the same shape. More formally, they are isomorphic if there is a one-to-one
    correspondence between the two collections such that any valid application of
    a traversal function to coordinates from the first collection returns the coordinate
    corresponding to the same traversal function applied to the corresponding coordinates
    from the second collection.'
