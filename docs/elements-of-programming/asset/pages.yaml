  md: '# Programming Techniques


    Using successor, a transformation that is strictly functional, allowed us chose
    to write a variety of clear and efficient programs. In Chapter 9, however, we
    chose to encapsulate calls of successor and predecessor into small mutative machines,
    such as copy_step, since it led to clearer code for a family of related algorithms.
    Similarly, it is appropriate to use goto in the state machines in Chapter 8 and
    to use reinterpretcast for the underlying type mechanism in Chapter 12. Instead
    of restricting the expressive power of the underlying machine and the language,
    it is necessary to determine the appropriate use for each available construct.
    Good software results from the proper organization of components, not from syntactic
    or semantic restrictions.


    # Meanings of Pointers


    The book demonstrates two ways of using pointers: (1) iterators and other coordinates
    representing intermediate positions in an algorithm, and (2) connectors, representing
    ownership of the remote parts of a composite object. For example, in Section 12.2,
    we discussed the use of pointers to connect nodes within a list and extents within
    an array.


    These two roles for pointers determine different behavior when an object is copied,
    destroyed, or compared for equality. Copying an object follows its connectors
    to copy the remote parts, so the new object contains new connectors pointing to
    the copied parts. On the other hand, copying an object containing iterators (e.g.,
    a bounded range) simply copies the iterators following them. Similarly, destroying
    an object follows connectors to destroy the remote parts, while destroying an
    object containing iterators has no effect on the object to which the iterators
    point. Equality on a container follows connectors to compare responding parts,
    while equality on a noncontainer (e.g., a bounded range) simply tests for equality
    of corresponding iterators.


    There is, a third way to use pointers: to represent a relationship between entities.
    A relationship between two or more objects is not a part owned by these objects;
    it has an existence of its while maintaining mutual dependencies between the objects.
    In general, a pointer representing a relationship does not participate in the
    regular operations. For example, copying an object does not follow or copy a relationship
    pointer, since the relationship exists for the object being copied but not for
    its copy. If a one-to-one relationship is represented as a pair of embedded pointers
    linking two objects, destroying either of the objects must clear the corresponding
    pointer in the other object.'
