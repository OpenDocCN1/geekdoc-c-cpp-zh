    # 5.6 Stein gcd


    In 1961 Josef Stein discovered a new gcd algorithm for integers that is frequently
    faster than Euclid''s algorithm [Stein, 1967]. His algorithm depends on these
    familiar properties:


    ```

    gcd(a, b) = gcd(b, a)

    gcd(a, a) = a

    ```


    together with these additional properties that for all a > b > 0:


    ```

    gcd(2a, 2b) = 2 gcd(a, b)

    gcd(2a, 2b + 1) = gcd(a, 2b + 1)

    gcd(2a + 1, 2b) = gcd(2a + 1, b)

    gcd(2a + 1, 2b + 1) = gcd(2b + 1, a - b)

    ```


    **Exercise 5.3** Implement Stein gcd for integers, and prove its termination.


    While it may appear that Stein gcd depends on the binary representation of integers,
    the intuition that 2 is the smallest prime allows generalizing it to other domains
    by using smallest primes in these domains; for example, the monomial x for polynomials⁹
    or t+i for Gaussian integers.¹⁰ Stein gcd could be used in rings that are not
    Euclidean.¹¹


