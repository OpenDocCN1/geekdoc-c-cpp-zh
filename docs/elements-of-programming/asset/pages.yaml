    Afterword


    We noted in Section 1.2 that when implementing behavioral equality on values is
    not feasible, we can implement representational equality. For composite objects,
    we often implement representational equality with the techniques of Section 7.4.
    Such structural equality is often useful in giving the semantics of copy construction
    and assignment may be useful for other purposes. Recall that representational
    equality implies behavioral equality. Similarly, while a natural total ordering
    is not always realizable, a default total ordering based on structure (e.g., lexicographical
    ordering of sequences) allows us to efficiently sort and search. There are, of
    course, objects for which copy construction nor assignment—nor equality—makes
    sense, because they owe their own unique resource.


    # Concepts


    We use concepts from abstract algebra—semigroups, monoids, and modules—to describe
    such algorithms as power, remainder, and gcd. In many cases we need to adapt standard
    mathematical concepts to fit algorithms. Sometimes, we introduce new concepts,
    such as HalvableMonoid, to strengthen requirements. Sometimes, we relax requirements,
    as with the partially-associative property. Often we deal with partial domains,
    as with the definition-space predicate passed to collision. Mathematical tools
    are to be used and freely modified. It is the same with concepts originating in
    computer science. The iterator connects fundamental properties of certain algorithms
    and data structures; however, there are other coordinate structures described
    by concepts yet to be discovered. It is a task of the programmer to determine
    whether a given concept is useful.


    # Algorithms and Their Interfaces


    Bounded half-open ranges correspond naturally to the implementation of many data
    structures and provide a convenient way to represent inputs and outputs for such
    algorithms as find, rotate, partition, merge, and so on. However, with some algorithms,
    such as partition_n, a counted range is the natural interface. Even for algorithms
    for which bounded ranges are natural, there usually exist natural variations taking
    counted ranges. Limiting ourselves to a single variety of interface would be a
    false economy.


    Three rotation algorithms, described in Chapter 10, correspond to three iterator
    concepts. For every algorithm, we need to discover its conceptual requirements,
    the preconditions on its input, and any other characteristics that make its use
    appropriate. It is rarely the case that a single algorithm is appropriate in all
    circumstances.'
