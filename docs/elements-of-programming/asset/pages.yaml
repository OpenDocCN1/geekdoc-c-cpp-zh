  md: '# Afterword


    We recap the main themes of the book: regularity, concepts, algorithms and their
    interfaces, programming techniques, and meanings of pointers. For each theme,
    we also discuss its particular limitations.


    # Regularity


    Regular types define copy construction and assignment in terms of equality. Regular
    functions return equal results when applied to equal arguments. For example, regularity
    of transformations allowed us to define and reason about algorithms for analyzing
    orbits. Regularity was in fact relied throughout the book by ordering relations,
    the successor function for forward iterators, and many others.


    When we work with built-in types, we usually treat the complexity of equality,
    copying, and assignment as constant. When we deal with composite objects, the
    complexity of these operations is expected to be linear in the area of objects:
    the total amount of memory, including remote as well as local parts. Our expectation,
    however, that equality is worst linear in the area of its arguments cannot always
    be met in practice.


    For example, consider representing a multiset, or unordered collection of potentially
    repeated elements, as an unordered dynamic sequence. Although inserting a new
    element takes constant time, testing two multisets for equality O(n log n) time
    to sort them and compare them lexicographically. If equality testing is infrequent,
    this is a good tradeoff; however, putting multisets into a sequence to be searched
    with find could lead to unacceptable performance. For an extreme example, consider
    a situation in which the equality for a type must be implemented with graph isomorphism,
    a problem for which no polynomial-time algorithm is known.'
