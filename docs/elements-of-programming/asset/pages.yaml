    that interprets zero as false and nonzero as true is not uniquely represented.
    A type representing an integer as a sign bit and an unsigned magnitude does not
    provide a unique representation of zero. A type representing an integer in two''s
    complement is uniquely represented.


    A value type is ambiguous if and only if a value of the type has more than one
    interpretation. The negation of ambiguous is unambiguous. For example, a type
    representing a calendar year over a period longer than a single century as two
    decimal digits is ambiguous.


    Two values of a value type are equal if and only if they represent the same entity.
    They are representationally equal if and only if their datums are identical sequences
    of 0s and 1s.


    +   Lemma 1.1 If a value type is uniquely represented, equality implies representational
    equality.


    +   Lemma 1.2 If a value type is not ambiguous, representational equality implies
    equality.


    If a value type is uniquely represented, we implement equality by testing that
    both sequences of 0s and 1s are the same. Otherwise we must implement equality
    in such a way that preserves its consistency with the interpretations of its arguments.
    Nonunique representations are chosen when testing equality is done less frequently
    than operations generating new values and when it is possible to make generating
    new values at the cost of making equality slower. For example, two rational numbers
    as pairs of integers are equal if they reduce to the same lowest terms. Two finite
    sets represented as unsorted sequences are equal if, after sorting and eliminating
    duplicates, their corresponding elements are equal.


    Sometimes, implementing true behavioral equality is too expensive or even impossible,
    as in the case for a type of enc of computable functions. In these cases we must
    settle for the weaker representational equality: that two values are the same
    sequence of 0s and 1s.


    Computers implement functions on abstract entities as functions on values. While
    values reside in memory, a properly implemented function on values does not depend
    on particular memory addresses: It implements a mapping from values to values.


