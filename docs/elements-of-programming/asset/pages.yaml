  md: '# Chapter 5

    Ordered Algebraic Structures


    This chapter presents a hierarchy of concepts from abstract algebra, starting
    with semigroups and ending with rings and modules. We then combine algebraic concepts
    with the notion of total ordering. When ordered algebraic structures are Archimedean,
    we can define an efficient algorithm for finding quotient and remainder. Quotient
    and remainder in turn lead to a generalized version of Euclid''s algorithm for
    the greatest divisor. We briefly treat concept-related logical notions, such as
    consistency and independence. We conclude with a discussion of computer integer
    arithmetic.


    # 5.1 Basic Algebraic Structures


    An element is called an identity element of a binary operation if, when combined
    with any other element as the first or second argument, the operation returns
    the other element:


    ```

    property(T : Regular, Op : BinaryOperation)

    requires(T = Domain(Op))

    identity.element : T × Op

    (e, op) ↦ (∀a ∈ T) op(a, e) = op(e, a) = a

    ```


    **Lemma 5.1** An identity element is unique:


    ```

    identity.element(e, op) ^ identity.element(e'', op) ⇒ e = e''

    ```


    The empty string is the identity element of string concatenation. The matrix (identity
    matrix) is the multiplicative identity of 2 × 2 matrices, while (zero matrix)
    is their additive identity.'
