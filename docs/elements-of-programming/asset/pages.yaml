  md: '# Preface


    His book applies the deductive method to programming by affiliating programs with
    the abstract mathematical theories that enable them to work. Specification of
    these theories, algorithms written in terms of these theories, and theorems and
    lemmas describing their properties are presented together. The implementation
    of the algorithms in a real programming language is central to the book. While
    the specifications, which are addressed to human beings, should, and even must,
    combine rigor with appropriate formality, the code, which is addressed to the
    computer, must be absolutely precise even while being general.


    With other areas of science and engineering, the appropriate foundation of programming
    is the deductive method. It facilitates the decomposition of complex systems into
    components with mathematically specified behavior. That, in turn, is a necessary
    precondition for designing efficient, reliable, secure, and economical software.


    The book is addressed to those who want a deeper understanding of programming,
    whether they are full-time software developers, or scientists and engineers for
    whom programming is an important part of their professional activity.


    The book is intended to be read from beginning to end. By reading the code, proving
    the lemmas, and doing the exercises readers gain understanding of the material.
    In addition, we suggest several projects, some open-ended. While the book is terse,
    a careful reader will eventually see the connections between its parts and the
    reasons for our choice of material. Discovering the architectural principles of
    the book should be the reader''s goal.


    We assume an ability to elementary algebraic manipulations.¹ We also assume familiarity
    with the basic vocabulary of logic and set theory at the level of undergraduate
    courses on discrete mathematics; Appendix A summarizes the notation that we use.
    We provide definitions of a few concepts of abstract algebra when they are


    +   1. For a refresher on elementary algebra, we recommend Chrystal [1904].'
