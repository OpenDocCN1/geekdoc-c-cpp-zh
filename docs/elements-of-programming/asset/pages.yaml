  md: "# 3.2 Computing Powers\n\nAn algorithm to compute a^n for an associative operation\
    \ will take a, n, and op as parameters. The type of a is the domain of op; n must\
    \ be of an integer type. Without the assumption of associativity, two algorithms\
    \ compute power from left and right to left, respectively:\n\n```\ntemplate<typename\
    \ I, typename Op>\nrequires(Integer(I) && BinaryOperation(Op))\nDomain(Op) power_left.associated(Domain(Op)\
    \ a, I, Op)\n{\n    // Precondition: n > 0\n    if (n == I(1)) return a;\n   \
    \ return op(power_left.associated(a, n - I(1), op), a);\n}\n```\n\n```\ntemplate<typename\
    \ I, typename Op>\nrequires(Integer(I) && BinaryOperation(Op))\nDomain(Op) power_right.associated(Domain(Op)\
    \ a, I, Op)\n{\n    // Precondition: n > 0\n    if (n == I(1)) return a;\n   \
    \ return op(a, power_right.associated(a, n - I(1), op));\n}\n```\n\nThe algorithms\
    \ perform n - 1 operations. They return different results for nonassociative operation.\
    \ Consider, for example, raising 1 to the 3rd power with the operation of subtraction.\n\
    \nWhen both a and n are integers, and if the operation is multiplication, both\
    \ algorithms give us exponentiation; if the operation is addition, both give us\
    \ multiplication. The ancient Egyptians discovered a faster multiplication algorithm\
    \ that can be generalized to computing powers of any associative operation. Since\
    \ associativity allows us to freely regroup operations, we have\n\n$a^n = \\begin{cases}\
    \ a & \\text{if } n=1 \\ (a^2)^{n/2} & \\text{if } n \\text{ is even} \\ (a^2)^{n/2}a\
    \ & \\text{if } n \\text{ is odd} \\end{cases}$\n\n> 1. The original is in Robins\
    \ and Shute [1987, pages 16–17]; the papyrus is from around 1650 BC but its scribe\
    \ noted that it was a copy of papyrus from around 1850 BC."
