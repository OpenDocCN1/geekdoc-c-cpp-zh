  md: '# 1.5 Regular Types


    use guarantees regularity of behavior and, therefore, interoperability.¹1 We derive
    the semantics of regular types from built-in types, such as bool, int, and one,
    restricted to well-formed values, double. A type is regular if and only if its
    basis includes equality, assignment, destructor, default constructor, copy constructor,
    total ordering, and underlying type.³3


    Equality is a procedure that takes two objects of the same type and returns true
    if only if the states are equal. Inequality is always defined and returns the
