    # 8.2 Link Rearrangement


    A link rearrangement is an algorithm taking one or more linked ranges, returning

    one or more linked ranges, and satisfying the following properties.


    +   * Input ranges (either counted or bounded) are pairwise disjoint.

    * Output ranges (either counted or bounded) are pairwise disjoint.

    * Every iterator in an input range appears in one of the output ranges.

    * Every iterator in an output range appeared in one of the input ranges.

    * Every iterator in each output range designates the same object as before thenrearrangement,
    and this object has the same value.


    Note that successor and predecessor relationships that held in the input rangesnmay
    not hold in the output ranges.'
