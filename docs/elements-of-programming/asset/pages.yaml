  md: '# 238


    # Programming Language


    ```

    case = "case" expression :" {statement};

    while = "while" (" expression ") statement.

    do = "do" statement

    while = "while" (" expression ") \

    ```


    A simple statement, which is often a procedure call, is evaluated for its side
    effects. An assignment applies the assignment operator for the type of the object
    on the left-hand side. The first expression for a construction is a type expression
    giving the type to be constructed. A construction without an initialization applies
    the default constructor. A construction with a parenthesized expression list applies
    the matching constructor. A construction with an equal sign followed by an expression
    copy constructor; the expression must have the same type as the object being constructed.


    The return statement returns control to the caller of the current function with
    the value of the expression as the function result. The expression must evaluate
    to a value of the return type of the function.


    The conditional statement executes the first statement if the value of the expression
    is true; if the expression is false and there is an else clause, the second statement
    is executed. The expression must evaluate to a Boolean.


    The switch statement evaluates the expression and executes the first statement
    following a case label with matching value; subsequent statements are executed
    to the end of the switch statement or until a break statement is executed. The
    expression in a switch statement must evaluate to an integer or enumeration.


    The while statement repeatedly evaluates the expression and executes the statement
    as long as the expression is true. The do statement repeatedly executes the statement
    and evaluates the expression until the expression is false. In either case, the
    expression must evaluate to a Boolean.


    The compound statement executes the sequence of statements in order. The goto
    statement transfers execution to the statement following the corresponding label
    in the current function.


    The break statement terminates the execution of the smallest enclosing switch,
    while, or do statement; execution continues with the statement following the terminated
    statement.


    The typedef statement defines an alias for a type.'
