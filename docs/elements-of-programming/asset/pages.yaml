  md: '# Chapter 1


    # Foundations


    Starting with a brief taxonomy of ideas, we introduce notions of value, object,
    type, procedure, and concept that represent different categories of ideas in the
    computer. A central notion of the book, regularity, is introduced and elaborated.
    When applied to procedures, regularity means that procedures return equal results
    for equal arguments. When applied to types, regularity means that types possess
    the equality operator and equality-preserving copy construction and assignment.
    Regularity enables us to apply equational reasoning (substituting equals for equals)
    to transform and optimize programs.


    # 1.1 Categories of Ideas: Entity, Species, Genus


    In order to explain what objects, types, and other foundational computer notions,
    it is useful to give an overview of some categories of ideas that correspond to
    these notions.


    An abstract entity is an individual that is eternal and unchangeable, while a
    concrete entity is an individual that comes into and out of existence in space
    and time. An attribute—a correspondence between a concrete entity and an abstract
    entity—describes some property, measurement, or quality of the concrete entity.
    Identity, a primitive notion of our perception of reality, determines the sameness
    of a thing changing over time. Attributes of a concrete entity can change without
    affecting its identity. A snapshot of a concrete entity is a complete collection
    of its attributes at a particular point in time. Concrete entities are not only
    physical entities but also legal, financial, or political entities. Blue and 13
    are examples of abstract entities. Socrates and the United States of America are
    examples of concrete entities. The color of Socrates’ eyes and the number of U.S.
    states are examples of attributes.'
  merge: -1
