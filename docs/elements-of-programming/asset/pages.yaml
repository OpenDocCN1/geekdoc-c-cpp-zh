    \ a stack of previous coordinates, we would obtain a new coordinate type with\
    \ an additional transformation for obtaining the predecessor. (It would be more\
    \ efficient to use actions rather than transformations, to avoid copying the stack\
    \ each time.) Such a coordinate would model the concept bidirectional bifurcate\
    \ coordinate. There is a simpler and more flexible model of this concept: trees\
    \ that include a predecessor link in each node. Such trees allow concurrent, constant-space\
    \ traversals and make possible various rebalancing algorithms. The overhead for\
    \ the extra link is usually justified.\n\n```\nBirectionalBifurcateCoordinate(T)\
