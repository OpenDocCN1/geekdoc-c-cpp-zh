    A concept is consistent if it has a model. Continuing our example, addition of
    natural numbers is associative and commutative. A concept is inconsistent if both
    a proposition and its negation can be derived from its axioms. In other words,
    to demonstrate consistency, we construct a model; to demonstrate inconsistency,
    we derive a contradiction.


    A concept is useful if there are useful algorithms for which this is the most
    abstract setting. For example, parallel out-of-order reduction applies to any
    associative, commutative operation.


    # 5.10 Computer Integer Types


    Computer instruction sets typically provide partial representations of natural
    numbers and integers. For example, a bounded unsigned binary integer type, U_n,
    where n = 8, 16, 32, 64, …, is an unsigned integer type capable of representing
    a value in the interval [0, 2ⁿ); a bounded signed binary integer type, Sₙ, where
    n = 8, 16, 32, 64, …, is a signed integer type capable of representing a value
    in the interval (−2ⁿ⁻¹, 2ⁿ⁻¹¹). Although these types are bounded, typical computer
    instructions provide total operations on them because the results are encoded
    as a type of bounded values.


    Instructions on bounded unsigned types with signatures like these usually exist:


    ```

    sum_extended : U_n × U_n × U_₁ → U_₁ × U_n

    difference_extended : U_n × U_n × U_₁ → U_₁ × U_n

    product_extended : U_n × U_n → U₂ₙ

    quotient_remainder_extended : U₂ₙ × U_n → U_n × U_n

    ```


    Observe that U₂ₙ can be represented as U_n × U_n (a pair of U_n). Programming
    languages that provide full access to these hardware operations make it possible
    to write efficient and abstract software components involving integer types.


