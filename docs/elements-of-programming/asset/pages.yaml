  md: '# # Chapter 8

    Coordinates with

    Mutable Successors


    This chapter introduces iterator and coordinate structure concepts that allow
    relinking: modifying successor or other traversal functions for a particular coordinate.
    Relinking allows us to implement rearrangements, such as sorting, that preserve
    the value of source at a coordinate. We introduce relinking machines that preserve
    structural properties of the coordinates. We conclude with a machine allowing
    certain traversals of a tree without the use of a stack or predecessor links,
    by temporarily relinking the coordinates during the traversal.


    # ## 8.1 Linked Iterators


    In Chapter 6 we viewed the successor of a given iterator as immutable: Applying
    successor to a particular iterator value always returns the same result. A linked
    iterator type is a forward iterator type for which a linker object exists; applying
    the linker object to an iterator allows the successor of that iterator to be changed.
    Such iterators are modeled by linked lists, where relationships between nodes
    can be changed. We use linker objects rather than a single set_successor function
    overloaded on the iterator type to allow different links of the data structure.
    For example, doubly lists could be linked by setting successor and predecessor
    links or by setting successor links only. This allows a multipass algorithm to
    minimize work by omitting maintenance of the predecessor links until the final
    pass. We specify concepts for linked iterators directly, in terms of the corresponding
    linker objects. Ideally, we still speak of linked iterator types. To define the
    requirements on linker objects, we define the following related concepts:


    ```

    ForwardLinker(S) ≙

    IteratorType : ForwardLinker → ForwardIterator

    ^ I = IteratorType(S) in:

    ```'
