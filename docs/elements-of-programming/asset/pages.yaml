  md: '# 2


    # Foundations


    An abstract species describes common properties of essentially equivalent abstract
    entities. Examples of abstract species are natural number and color. A concrete
    species describes the set of attributes of essentially equivalent concrete entities.
    Examples of concrete species are man and U.S. state.


    A function is a rule that associates one or more abstract entities, called arguments,
    from corresponding species with an abstract entity, called the result, from another
    species. Examples of functions are the successor function, which associates each
    natural number with the one that immediately follows it, and the function that
    associates with two colors the result of blending them.


    An abstract genus describes different abstract species that are similar in some
    respect. Examples of abstract genus are number and binary operator. A concrete
    genus describes different concrete species similar in some respect. Examples of
    concrete genera are mammal and biped.


    An entity belongs to a single species, which provides the rules for its construction
    or existence. An entity can belong to several genera, each of which describes
    certain properties.


    We show later in the chapter that objects and values represent entities, types
    represent species, and concepts represent genera.


    # 1.2 Values


    Unless we know the interpretation, the only things we see in a computer are 0s
    and 1s. A datum is a finite sequence of 0s and 1s.


    A value type is a correspondence between a species (abstract or concrete) and
    a set of datums. A datum corresponding to a particular entity is called a representation
    of the entity; the entity is called the interpretation of the datum. We refer
    to a datum together with its interpretation as a value. Examples of values are
    integers represented in 32-bit two''s complement big-endian format and rational
    numbers represented as a concatenation of two 32-bit sequences, interpreted as
    integer numerator and denominator, represented as two''s complement big-endian
    values.


    A datum is well formed with respect to a value type if and only that datum represents
    an abstract entity. For example, every sequence of 32 bits is well formed when
    interpreted as a two''s complement integer; an IEEE 754 floating-point NaN (Not
    a Number) is not well formed when interpreted as a real number.


    A value type is properly partial if its values represent a proper subset of the
    abstract entities in the correspondence; otherwise it is total. For example, the
    type int is properly partial, while the type bool is total.


    A value is uniquely represented if and only if at most one value corresponds to
    each abstract entity. For example, a type representing a truth value is a byte-'
