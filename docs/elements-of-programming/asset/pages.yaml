  md: "# Language Definition\n\n# Templates\n\nA template allows a structure or procedure\
    \ to be parameterized by one or more types or constants. Template definitions\
    \ and template names use < and > as delimiters.\n\n```\ntemplate = template_decl\n\
    \  (structure | procedure | specialization).\nspecialization = \"struct\" structure_name\
    \ \"<\" additive_list \">\"\n  [structure_body];\";\ntemplate_decl = \"template\"\
    \ \"<\" [parameter_list] \">\" [constraint].\nconstraint = \"requires\" (\" expression\
    \ \");\ntemplate_name = (structure_name | procedure_name)\n  (\"<\" additive_list\
    \ \">\").\nadditive_list = additive(\", additive).\n```\n\nWhen a template is\
    \ used as a primary, the template definition is used to generate a structure or\
    \ procedure with parameters replaced by corresponding template arguments. These\
    \ template arguments are either given explicitly as the delimited expression list\
    \ in the template_name or, for procedures, may be deduced from the procedure argument\
    \ types.\n\nA template structure can be specialized, providing an alternative\
    \ definition for the template that is considered when the arguments match the\
    \ unspecialized version of the template structure.\n\nWhen the definition includes\
    \ a constraint, the template argument types and values must satisfy the Boolean\
    \ expression following requirements.\n\n# Intrinsics\n\npointer(T) is a type constructor\
    \ that returns the pointer to T. If x is an object of type T, addressof(x) returns\
    \ a value of type pointer(T) referring to x. source, sink, and deref are unary\
    \ functions defined on pointer types. source is defined for all pointer types\
    \ and returns a corresponding constant reference; see Section 6.1. sink and deref\
    \ are defined for pointer types to non-constant objects and return corresponding\
    \ nonconstant references; see Section 9.1. reinterpret_cast is a function that\
    \ takes a reference type and an object (passed by reference) and returns a reference\
    \ of the reference type to the same object. The object must also have a valid\
    \ interpretation with the reference type.\n\n> 2. To disambiguate the use of <\
    \ and > as relations or as template name delimiters, structure_name or procedure_name\
    \ is parsed as part of a template, it becomes a terminal symbol."
