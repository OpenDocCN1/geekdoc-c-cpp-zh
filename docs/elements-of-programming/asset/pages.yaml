    # 9.5 Conclusions\n\nExtending an iterator type with sink leads to writability\
    \ and mutability. Although the axiom for sink is simple, the issues of aliasing\
    \ and of concurrent updates—which this book does not treat—make imperative programming\
    \ complicated. In particular, defining preconditions that deal with aliasing through\
    \ different iterator types requires great care. Copying algorithms are simple,\
    \ powerful, and widely used. Composing these algorithms from simple machines helps\
    \ to organize them into a family by identifying commonalities and suggesting additional\
    \ variations. Using value exchange instead of value assignment leads to an analogous\
    \ but slightly smaller family of useful range-swapping algorithms."
