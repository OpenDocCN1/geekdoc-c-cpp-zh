    # 9.2 Position-Based Copying


    We present a family of algorithms for copying objects from one or more input ranges
    to one or more output ranges. In general, the postconditions of these algorithms
    specify equality between objects in output ranges and the original values of objects
    in input ranges. When input and output ranges do not overlap, it is straightforward
    to establish the desired postcondition. It is, however, often to copy objects
    over overlapping ranges, so the precondition of each algorithm specifies what
    kind of iterator is allowed.


