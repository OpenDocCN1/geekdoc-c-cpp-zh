    # 6.10 Conclusions


    Algebra provides us with a hierarchy of concepts, such as semigroups, monoids,
    and groups, that allows us to state algorithms in the most general context. Similarly,
    the iterator concepts (Figure 6.1) allow us to state algorithms on sequential
    data structures in their most general context. The development of these concepts
    uses three kinds of refinement: adding an operation, strengthening semantics,
    and tightening complexity requirement. In particular, the three concepts *forward
    iterator*, and *indexed iterator* differ not by their operations but only by their
    semantics and complexity. A variety of search algorithms for different iterator
    concepts, counted and bounded ranges, and range ordering serve as the foundation
    of sequential programming.


