  md: '# Chapter 6

    Iterators


    His chapter introduces the concept of iterator: an interface between algorithms
    and sequential data structures. A hierarchy of iterator concepts corresponds to
    different kinds of sequential traversals: single-pass forward, multipass forward,
    bidirectional, and random access. We investigate a variety of interfaces to common
    algorithms, such as linear and binary search. Bounded and counted ranges provide
    a flexible way of defining interfaces for variations of a sequential algorithm.


    # 6.1 Readability


    Every object has an address: an integer index into computer memory. Addresses
    allow us to access or modify an object. In addition, they allow us to create a
    variety of data structures, many of which rely on the fact that addresses are
    effectively integers and allow integer-like operations.


    Iterators are a family of concepts that abstract different aspects of addresses,
    allowing us to write algorithms that work not only with addresses but also with
    any dislike objects satisfying the minimal set of requirements. In Chapter 7 we
    introduce an even broader conceptual family: coordinate structures.


    There are two kinds of operations on iterators: accessing values or traversal.
    There are three kinds of access: reading, writing, or both reading and writing.
    There are four kinds of linear traversal: single-pass forward (an input stream),
    multipass forward (a singly linked list), bidirectional (a doubly linked list),
    and random access (an array).


    > Our treatment of iterators is a further refinement of the one in Stepanov and
    Lee [1995] but differs from it in several aspects.'
