  md: '# TotallyOrdered(T) ≡


    ```

    Regular(T)

    ∦ <: T → boolȢ6

    ∦ total.ordering(<)

    ```


    For example, the natural total ordering on integers respects fundamental operations:


    ```

    a < successor(a)

    a < b \Rightarrow successor(a) < successor(b)

    a < b \Rightarrow a + c < b + c

    a < b \wedge 0 < c \Rightarrow ca < cb

    ```


    Sometimes, a type does not have a natural total ordering. For example, complex
    numbers and employee records do not have natural total orderings. We require regular
    types to provide a default total ordering (sometimes abbreviated to default-ordering)
    to enable logarithmic searching. An example of default total ordering where no
    natural total ordering exists is lexicographical ordering for complex numbers.
    When the natural total ordering exists, it coincides with the default ordering.
    We use the following notation:


    | Default ordering for T | Specifications | C++ |

    |--- | --- | --- |

    | | less\T | less<T> |


    # 4.5 Clusters of Derived Procedures


    Some procedures naturally come in clusters. If some procedures in a cluster are
    defined, the definitions of the others follow. The complement of equality, inequality,
    is defined whenever equality is defined; the operators = and \neq must be defined
    consistently. For every totally ordered type, all four operators <, >, \u2264,
    and must be defined together in a way that the following holds:


    ```

    a > b \Leftrightarrow b < a

    a \leq b \Leftrightarrow \neg(b < a)

    a \geq b \Leftrightarrow \neg(a < b)

    ```'
