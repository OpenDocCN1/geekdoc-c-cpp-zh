    > Computers Kay McNulty (left) and Alyse Snyder use a differential analyzer at
    the University of Pennsylvania to calculate ballistics during World War II. The
    differential analyzer was a type of mechanical analog computer.


    Although her work was important to the war effort, Jennings grew tired of doing
    the repetitive calculations. She was ready for a new adventure. In 1945 Jennings
    applied to work on a new project.


    # Chapter 3


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_17_0.png)


    > The ENIAC was the first general-purpose electronic computer.


    # THE ENIAC


    In June 1945, Jennings was one of six women hired as programmers for a newly developed
    computer called the Electronic Numerical Integrator and Computer (ENIAC). All
    six of them had majored in math. They knew how to run numbers on a calculator,
    but the ENIAC was quite different. For one thing, it took up almost an entire
    room. It stood nearly 9 feet (2.7 meters) tall. It stretched 80 feet (24 m) in
    length, and it weighed 30 tons (27 metric tons). It was faster and more reliable
    than a human computer. But it was still in its infancy.


    The ENIAC was developed at the Moore School of Electrical Engineering at the University
    of Pennsylvania by John Mauchly and John Presper Eckert. It was the first general-purpose
    electronic computer. This means it could be used to complete many different types
    of calculations. The military wanted to use the machine to calculate ballistics
    faster and more reliably than humans could do by hand. But Mauchly and Eckert
    had designed the computer to solve many other problems as well.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_18_0.png)


    > Two of the original six programmers, Ruth Lichtenman (left) and Marilyn Wescoff,
    work on the ENIAC.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_19_0.png)


    The ENIAC could solve problems one thousand times faster than any other computing
    machine of its time. It had forty individual panels that performed different functions.
    It contained twenty accumulators, which could add and subtract. Each of the accumulators
    could also hold a ten-digit decimal number in memory.


    Jennings and her colleagues first had to figure out how the ENIAC worked. But
    they had to learn how it worked without ever seeing the actual machine. The ENIAC
    was so top secret that very few people had high enough clearance to see the computer
    in action. The programmers examined diagrams of the ENIAC’s circuits. And Mauchly
    answered any questions they came up with along the way. Then World War II ended
    when Japan surrendered in September 1945. In October Jennings and her fellow programmers
    were allowed to see the ENIAC for the first time. Jennings and her colleague Betty
    Snyder finally began to program the ENIAC to calculate ballistics for the military.


    On February 15, 1946, Mauchly, Eckert, and the six programmers shared the ENIAC
    with the world. They gave a formal demonstration of Jennings and Snyder’s program
    to the scientific community. The demonstration was a success. It proved to the
    world that the ENIAC was the first computer to successfully run a program.


    > TECH TALK

    “We were thrilled to see the ENIAC for the first time and amazed by its size.
    It was much bigger and more magnificent and intimidating than we had imagined.”

    —Jean Bartik


    In the fall of 1946, the ENIAC was moved from the University of Pennsylvania to
    Aberdeen Proving Ground in Maryland. Jennings and others continued to improve
    it. In December of that year, Jennings also married Bill Bartik and began using
    her husband''s last name.


    In December 1946, Bartik was asked to lead a team to turn the ENIAC into a stored-program
    computer. The first computers could only be wired to run one program at a time.
    In order to run a new program, the computers had to be rewired. By the end of
    March 1948, the team had figured out how to store programs in memory. This meant
    the ENIAC could be programmed faster. The ENIAC operated until October 1955.


    > TECH TALK

    “We were thrilled to see the ENIAC for the first time and amazed by its size.
    It was much bigger and more magnificent and intimidating than we had imagined.”

    —Jean Bartik


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_22_0.png)


