    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_16_0.png)


    > 计算机凯·麦克尔蒂（Kay McNulty，左）和艾莉丝·斯奈德（Alyse Snyder）在宾夕法尼亚大学使用微分分析仪在第二次大战期间计算弹道。微分分析仪是一种机械模拟计算机。


    尽管她的工作对战争努力意义重大，但詹宁斯（Jennings）厌倦了重复性的计算。她已经准备好迎接新的冒险。1945年，詹宁斯申请参加一项新项目的工作。


    # 第三章


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_17_0.png)


    > ENIAC 是第一台通用电子计算机。


    # ENIAC


    1945年6月，詹宁斯是受雇的六名程序员之一，她们负责为一台名为“电子数值积分计算机”（ENIAC）的新型计算机编程。这六个人都是数学专业的。他们知道如何在计算器上运行数字，但
    ENIAC 完全不同。首先，它占据了几乎整个房间。它高近9英尺（2.7米），长度达80英尺（24米），重量达30吨（27公吨）。它比人类计算机更快、更可靠。但它仍处于婴儿阶段。


    ENIAC 是由宾夕法尼亚大学电气工程学院的约翰·莫奇奇利（John Mauchly）和约翰·普雷斯珀·埃克特（John Presper Eckert）开发的。它是第一台通用电子计算机。这意味着它可以用于完成许多类型的计算。军方希望使用这台机器以比人工手动更快、更可靠地计算弹道。但莫奇奇利和埃克特设计这台计算机也是为了解决许多其他问题。


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_18_0.png)


    > 最初的六名程序员中的两位——露丝·利希特曼（Ruth Lichtenman，左）和玛丽莲·韦斯科夫（Marilyn Wescoff）正在操作 ENIAC。


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_19_0.png)


    ENIAC 解问题的速度比当时的任何其他计算设备快一千倍。它有四十个执行不同功能的独立面板。它包含二十个累加器，可以进行加减法运算。每个累加器还可以在内存中存储一个十位的小数。


    詹宁斯和同事们首先必须弄清楚 ENIAC 是如何工作的。但他们必须在从未见过实物的情况下学习它的工作原理。ENIAC 是极其机密的，极少数人拥有足够的权限看到计算机的运行。程序员们检查了
    ENIAC 的电路图。莫奇奇利会回答他们在此过程中提出的任何问题。随后，随着1945年9月日本投降，二大战结束。10月，詹宁斯和她的程序员同事们第一次允许看到
    ENIAC。詹宁斯和她的同事贝蒂·斯奈德（Betty Snyder）终于开始为 ENIAC 编程，为军方计算弹道。


    1946年2月15日，莫奇奇利、埃克特和六名程序员向世界展示了 ENIAC。他们向科学界正式演示了詹宁斯和斯奈德的程序。演示取得了成功。它向世界证明了 ENIAC
    是第一台成功运行程序的计算机。


    > 技术杂谈

    “我们第一次看到 ENIAC 时感到非常兴奋，并对其规模感到惊叹。它比我们想象的要大得多、更壮丽，也更令人生畏。”

    —— 珍·巴蒂克（Jean Bartik）


    1946年秋，ENIAC 从宾夕法尼亚大学搬到了马里兰州的阿伯丁丁试验场（Aberdeen Proving Ground）。詹宁斯等人继续改进它。在那年的12月，詹宁斯还嫁给了比尔·巴蒂克，并开始使用丈夫的姓。


    1946年12月，巴蒂克被要求带领团队将 ENIAC 变成存储程序计算机。当时的计算机只能运行一个程序。为了运行新程序，必须重新布线。到1948年3月底，团队找到了将程序存储在内存中的方法。这意味着
    ENIAC 编程变得更快了。ENIAC 一直运行到1955年。


    > 技术杂谈

    “我们第一次看到 ENIAC 时感到非常兴奋，并对其规模感到惊叹。它比我们想象的要大得多、更壮丽，也更令人生畏。”

    —— 珍·巴蒂克（Jean Bartik）


