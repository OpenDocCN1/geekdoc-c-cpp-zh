    # 第一章


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_7_0.png)


    在成长过程中，贝蒂·詹宁斯 (Betty Jennings) 在密苏里州波因特卢克（Point Lookout）的一所与这里类似的单间教室学校。


    # 数学之星


    贝蒂·珍·詹宁斯 (Betty Jean Jennings) 于1924年出生于密苏里州的一个农场，她有着远大的梦想。她的父亲是一名老师兼农民。她的母亲是一名家庭主妇。贝蒂·珍是七个孩子中的第六个。作为一个女孩，贝蒂·珍梦想着有一天能成为一名独立的女性。她想在世界上脱颖而出。


    贝蒂·珍在一个单间教室学校上学。一年级到八年级的学生一起学习。每当她完成自己的作业时，贝蒂·珍喜欢听听高年级的课程。这帮助她能学到更多知识。


    贝蒂·珍特别热爱数学。她非常擅长数学。老师建议贝蒂·珍将五、六年级的数学合并为一年完成。贝蒂·珍跳了一个级。


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_8_0.png)


    在完成八年级后，贝蒂·珍于1937年进入了斯坦伯里高中（Stanberry High School）。她决定成为一名护士。在当时，热爱数学的女性机会并不多。但护士需要使用加法、减法、分数和比例来计算给患者服用多少药物。他们在记录生命体征时每天也会使用数学。贝蒂·珍喜欢帮助别人的想法。怀着这个目标，贝蒂·珍和她最喜欢的老师马德拉小姐（Miss
    Madeira）一起学习拉丁语，因为许多医学术语都使用拉丁语。


    # 技术杂谈


