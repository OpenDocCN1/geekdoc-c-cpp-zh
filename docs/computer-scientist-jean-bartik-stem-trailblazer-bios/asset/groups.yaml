    work on the ENIAC.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_23_0.png)


    > The ENIAC was the first general-purpose electronic computer.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_24_0.png)


    > The ENIAC was the first general-purpose electronic computer.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_25_0.png)


    > The ENIAC was the first general-purpose electronic computer.


