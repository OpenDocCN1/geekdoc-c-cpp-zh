    # Chapter 1


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_7_0.png)


    Growing up, Betty Jennings attended a one-room schoolhouse similar to this one
    in Point Lookout, Missouri.


    # MATH STAR


    Betty Jean Jennings was born on a farm in Missouri in 1924, and she had big dreams.
    Her father was a teacher and a farmer. Her mother was a homemaker. Betty Jean
    was the sixth of seven children. As a young girl, Betty Jean dreamed of'
  - '[PAGE 8]


    being an independent woman one day. She wanted to stand out in the world.


    Betty Jean went to school in a one-room schoolhouse. Students in the first through
    eighth grades were taught together. Whenever she finished her own work, Betty
    Jean liked to listen to lessons being taught to the upper grades. This helped
    her learn even more.


    Betty Jean especially loved math. She was very good at it. Her teacher suggested
    that Betty Jean combine fifth and sixth grade math into one year. Betty Jean skipped
    a grade.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_8_0.png)'
  - '[PAGE 9]


    After completing eighth grade, Betty Jean enrolled in Stanberry High School in
    1937. She decided she wanted to become a nurse. At the time, there were not many
    opportunities for women who loved math. But nurses use addition, subtraction,
    fractions, and ratios to figure out how much medicine to give to a patient. They
    also use math every day when recording vital signs. Betty Jean liked the idea
    of helping others. With this goal in mind, Betty Jean and her favorite teacher,
    Miss Madeira, studied Latin together, since many medical terms used Latin.


    # TECH TALK


    > “Lots of medical terms are derived from Latin, so I decided to study Latin,
    which wasn’t offered by the school. However, Miss Madeira came to my rescue, offering
    to refresh her Latin and study it with me. I went over to Miss Madeira’s house
    one night a week, and sometimes after our lessons, Miss Madeira would listen with
    kind understanding and encouragement to my fantasies and ambitions.”

    —Jean Bartik'
  - '[PAGE 10]


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_10_0.png)


    > A nurse helps a doctor with a patient in October 1943. Nursing was one of the
    few career options available to women in math.


    Betty Jean graduated from high school in 1941. She was just sixteen years old.
    She was the second-best pupil in the school, and she also earned the highest mathematics
    grades anyone had ever received at the school.'
  - '[PAGE 11]


    # Chapter 2


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_11_0.png)


    > After high school, Jennings attended Northwest Missouri State Teachers College.


    # HUMAN COMPUTERS


    College offered Jennings the opportunity to leave home and start her adventure.
    She attended Northwest Missouri State Teachers College (now Northwest Missouri
    State University) in Maryville, Missouri. But she no longer wanted to'
  - '[PAGE 12]


    be a nurse. She decided to major in mathematics with a minor

    in English.


    During Jennings''s first year in college, the United States entered World War
    II (1939–1945). Japanese aircraft attacked the US naval base in Pearl Harbor,
    Hawaii, in December 1941, drawing the United States into the war. Because of the
    war, many men were drafted into the military. Most of the students remaining at
    Jennings''s college were women. However, the US Navy set up a program at her college
    and sent hundreds of sailors there for training. Jennings took math and science
    classes such as calculus, trigonometry, and physics with these sailors. She was
    the only woman in the classes.


    > Jennings (left) and her college roommate, Virginia McGinness, lived on Fourth
    Street in Maryville, Missouri.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_12_0.png)'
  - '[PAGE 13]


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_13_0.png)


    Jennings graduated in 1945. She was the only person from her college to graduate
    with a degree in math that year. Jennings did not yet know what she was going
    to do with her math degree.


    With many of the nation''s men fighting overseas, women were taking over jobs
    that had previously only been held by men. This was especially true for jobs related
    to technology. Women served as code breakers and machine operators. These jobs
    were all classified work. This meant they were top secret. The women who performed
    these jobs were known as the Top Secret Rosies.'
  - '[PAGE 14]


    A woman packs cartridges at a factory in Philadelphia, Pennsylvania, during World
    War II. Women who did defense work during the war were often referred to as “Rosies."


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_14_0.png)'
  - '[PAGE 15]


    # TECH TALK


    > "A computer wasn’t a machine. It was a person. . . .

    Mathematics was a crucial weapon of the US arsenal, and women, its secret practitioners."

    —LeAnn Ericksonson, director of a documentary on the Top Secret Rosies


    Jennings heard the military was hiring math majors to be “computers.” In the 1940s,
    the word computer referred to workers who performed calculations by hand. These
    workers were often women. They worked long hours doing mathematical calculations.
    Jennings applied for a job as a computer for the United States Department of War
    and was hired.


    The US Department of War assigned Jennings to work at the Ballistics Research
    Lab at the University of Pennsylvania. There she calculated ballistics for military
    weapons. These calculations determined how far and fast a bullet or missile would
    go when shot. This information allowed the military to aim their weapons at specific
    targets.'
