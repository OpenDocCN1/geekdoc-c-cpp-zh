    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_22_0.png)


    > Mauchly (front left), Jennings (back left), and other members of the ENIAC team
    operate the machine in 1946.'
  - '[PAGE 23]


    # Chapter 4


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_23_0.png)


    > Eckert demonstrates the UNIVAC in 1951.


    # WELL-DESERVED RECOGNITION


    After the success of converting the ENIAC to a stored-program computer, Bartik
    began working for the Eckert-Mauchly Computer Corporation, a private company formed
    by Eckert and Mauchly after World War II. There,'
  - '[PAGE 24]


    Bartik helped program a new computer, the Universal Automatic Computer (UNIVAC)
    I. The UNIVAC could quickly do simple math problems, and it could also store words.
    This made it easier for businesses to use the computer for a wider variety of
    tasks, such as keeping track of inventory. While working on it, she wrote the
    world''s first sort/merge program


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_24_0.png)


    > The UNIVAC was the first commercial computer produced in the United States.'
  - '[PAGE 25]


    for a computer. Sort/merge programs allow computers to break down large pieces
    of data into smaller, more manageable pieces.


    Eckert-Mauchly Computer Corporation was acquired by Remington Rand Inc. in 1950.
    Many employees, including Bartik, continued working for Remington Rand. In 1951
    they sold the


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_25_0.png)


    > After the 1950 population census, workers used the UNIVAC to tabulate the entire
    1954 economic census.'
  - '[PAGE 26]


    first UNIVAC to the United States Census Bureau to help calculate the 1950 US
    census.


    While working on the UNIVAC, Bartik also programmed the Binary Automatic Computer
    (BINAC), a computer used by Northrop Aircraft. The BINAC was designed to control
    long-range missiles. It consisted of two identical computers


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_26_0.png)


    > The BINAC undergoes a test run at the manufacturer in 1949.'
  - '[PAGE 27]


    that did the same tasks, double-checking each calculation in the process.


    Even though Bartik was a successful computer programmer, it was difficult for
    her to get any recognition for her work. The same year Remington Rand purchased
    Eckert-Mauchly, Bartik was scheduled to give a presentation to one of its customers,
    the Naval Aviation Supply Office. But as the date for the meeting drew nearer,
    Remington Rand decided a man should give the presentation to the navy commanders
    instead. Bartik only delivered a proposal at the end of the meeting. After the
    presentation, Bartik wasn''t allowed to attend dinner with the men because they
    thought she might be offended by their jokes. Remington Rand never allowed Bartik
    to give another presentation.


    Bartik decided to leave Remington Rand in 1951. She dedicated the next sixteen
    years to raising her three children. She also went back to school. In August 1967
    she received a master''s degree in English from the University of Pennsylvania.


    After completing her degree, Bartik decided to rejoin the workforce. However,
    she discovered that jobs for women in the computer science world were hard to
    come by. In addition, computers were now completely different than they had been
    when she first began her career. They had become much'
  - '[PAGE 28]


    Two employees work in the computer room of Huntsman House in 1968. By the late
    1960s, computers had gotten smaller and faster.'
  - '[PAGE 29]


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_29_0.png)


    smaller. They could process and store information much faster and better than
    computers such as the ENIAC ever could.


    So, instead of programming, Bartik wrote and edited publications about computers
    and the computer science industry. She worked for Auerbach Corporation, Honeywell,
    and Data Decisions. And she also had another mission. She fought for the recognition
    of women in technology and the workplace.'
- md: '

    Bartik encouraged women in the field of computing. She gave many talks to women
    in college and in the computer industry.


    Bartik also received awards recognizing her as a pioneering programmer. In 2002
    the Jean Jennings Bartik Computing Museum opened at Northwest Missouri State University.


    In 2008 the Computer History Museum in Mountain View, California, granted Bartik
    the Museum Fellows Award. That same year, Bartik received the Institute of Electrical
    and Electronics Engineers Computer Pioneer Award. It honored her pioneering efforts
    as one of the first computer programmers.


    The Computer History Museum- The museum inducted Bartik (center) into their Hall
    of Fellows in 2008.


    > The Computer History Museum is dedicated to preserving artifacts related to
    the history of computing. The museum inducted Bartik (center) into their Hall
    of Fellows in 2008.


    # TECH TALK


    > “I think you should be prepared, and work hard—everyone that succeeds must work
    hard—and open the door when opportunity knocks. Opportunity comes in a lot of
    different ways. But I do believe that you should enjoy what you do.”

    —Jean Bartik, offering advice to young women entering the field of computer science


    In 2011, Bartik died of congestive heart disease. She left behind an important
    legacy. At a time when women were—not encouraged to pursue careers in math and
    technology, Bartik seized every chance to put her talents to use. During her career,
    many people overlooked the importance of Bartik’s contributions. But as one of
    the world’s first computer programmers, Bartik helped to shape the field for decades
    to come.


    # TIMELINE


    ## 1924

    Betty Jean Jennings is born on December 27 in Gentry County, Missouri.


    ## 1941

    The United States enters world War II.


    ## 1945

    Jennings graduates from college. In June Jennings is hired to work on the ENIAC.


    ## 1946

    Jennings marries Bill Bartik on December 14.


    ## 1948

    Bartik is hired as a programmer by the Eckert-Mauchly Corporation, where she works
    on the UNIVAC I and the BINAC.


    ## 1967

    Bartik receives a master''s degree in English from the University of Pennsylvania.
    Auerbach Publishers hires her to write about computer science.


    ## 1997

    Bartik is inducted into the Women in Technology International Hall of Fame.


    ## 2002

    The Jean Jennings Bartik Computing Museum opens.


    ## 2008

    Bartik receives awards from the Computer History Museum and the Institute of Electrical
    and Electronics Engineers Society.


    ## 2011

    Bartik dies on March 23.


