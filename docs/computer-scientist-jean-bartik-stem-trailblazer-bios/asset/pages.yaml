  md: 'Do you love solving problems with mathematics? So did groundbreaking computer
    programmer Jean Bartik. She turned her passion for math into a successful career
    in what was then a brand-new field.


    During World War II, women took on more technology jobs as men joined the armed
    forces. Bartik started her career doing mathematical calculations for top-secret
    weapons systems projects. After the war, a new machine took over these calculations.
    It was the first all-electronic computer, and Bartik helped build and program
    it. But how did Bartik''s interest in mathematics take her to the forefront of
    cutting-edge technology? Find out how she went from gifted student to computer
    software pioneer.


