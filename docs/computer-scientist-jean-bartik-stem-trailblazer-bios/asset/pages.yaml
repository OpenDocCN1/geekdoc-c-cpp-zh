  md: '# # TIMELINE


    # ## 1924


    Betty Jean Jennings is born on December 27 in Gentry County, Missouri.


    # ## 1941


    The United States enters world War II.


    # ## 1945


    Jennings graduates from college. In June Jennings is hired to work on the ENIAC.


    # ## 1946


    Jennings marries Bill Bartik on December 14.


    # ## 1948


    Bartik is hired as a programmer by the Eckert-Mauchly Corporation, where she works
    on the UNIVAC I and the BINAC.


    # ## 1967


    Bartik receives a master''s degree in English from the University of Pennsylvania.
    Auerbach Publishers hires her to write about computer science.


    # ## 1997


    Bartik is inducted into the Women in Technology International Hall of Fame.


    # ## 2002


    The Jean Jennings Bartik Computing Museum opens.


    # ## 2008


    Bartik receives awards from the Computer History Museum and the Institute of Electrical
    and Electronics Engineers Society.


    # ## 2011


    Bartik dies on March 23.'
