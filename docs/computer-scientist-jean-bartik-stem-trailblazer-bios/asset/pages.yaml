    # GLOSSARY


    **accumulator**

    a part in a computer where numbers are stored


    **memory**

    a device in a computer where information is stored


    **arsenal**

    a collection of weapons


    **programmer**

    a person who writes programs, which are sets of instructions for computers to
    follow


    **ballistics**

    the science of the motion of bullet, missile, or bomb


    **computer**

    an electronic machine that can store, program, and retrieve data and information'
