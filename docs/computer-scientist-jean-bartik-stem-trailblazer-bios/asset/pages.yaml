  md: '# Chapter 1


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_7_0.png)


    Growing up, Betty Jennings attended a one-room schoolhouse similar to this one
    in Point Lookout, Missouri.


    # MATH STAR


    Betty Jean Jennings was born on a farm in Missouri in 1924, and she had big dreams.
    Her father was a teacher and a farmer. Her mother was a homemaker. Betty Jean
    was the sixth of seven children. As a young girl, Betty Jean dreamed of'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'being an independent woman one day. She wanted to stand out in the world.


    Betty Jean went to school in a one-room schoolhouse. Students in the first through
    eighth grades were taught together. Whenever she finished her own work, Betty
    Jean liked to listen to lessons being taught to the upper grades. This helped
    her learn even more.


    Betty Jean especially loved math. She was very good at it. Her teacher suggested
    that Betty Jean combine fifth and sixth grade math into one year. Betty Jean skipped
    a grade.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_8_0.png)'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'After completing eighth grade, Betty Jean enrolled in Stanberry High School
    in 1937. She decided she wanted to become a nurse. At the time, there were not
    many opportunities for women who loved math. But nurses use addition, subtraction,
    fractions, and ratios to figure out how much medicine to give to a patient. They
    also use math every day when recording vital signs. Betty Jean liked the idea
    of helping others. With this goal in mind, Betty Jean and her favorite teacher,
    Miss Madeira, studied Latin together, since many medical terms used Latin.


    # TECH TALK


    > “Lots of medical terms are derived from Latin, so I decided to study Latin,
    which wasn’t offered by the school. However, Miss Madeira came to my rescue, offering
    to refresh her Latin and study it with me. I went over to Miss Madeira’s house
    one night a week, and sometimes after our lessons, Miss Madeira would listen with
    kind understanding and encouragement to my fantasies and ambitions.”

    —Jean Bartik'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_10_0.png)


    > A nurse helps a doctor with a patient in October 1943. Nursing was one of the
    few career options available to women in math.


    Betty Jean graduated from high school in 1941. She was just sixteen years old.
    She was the second-best pupil in the school, and she also earned the highest mathematics
    grades anyone had ever received at the school.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Chapter 2


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_11_0.png)


    > After high school, Jennings attended Northwest Missouri State Teachers College.


    # HUMAN COMPUTERS


    College offered Jennings the opportunity to leave home and start her adventure.
    She attended Northwest Missouri State Teachers College (now Northwest Missouri
    State University) in Maryville, Missouri. But she no longer wanted to'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'be a nurse. She decided to major in mathematics with a minor

    in English.


    During Jennings''s first year in college, the United States entered World War
    II (1939–1945). Japanese aircraft attacked the US naval base in Pearl Harbor,
    Hawaii, in December 1941, drawing the United States into the war. Because of the
    war, many men were drafted into the military. Most of the students remaining at
    Jennings''s college were women. However, the US Navy set up a program at her college
    and sent hundreds of sailors there for training. Jennings took math and science
    classes such as calculus, trigonometry, and physics with these sailors. She was
    the only woman in the classes.


    > Jennings (left) and her college roommate, Virginia McGinness, lived on Fourth
    Street in Maryville, Missouri.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_13_0.png)


    Jennings graduated in 1945. She was the only person from her college to graduate
    with a degree in math that year. Jennings did not yet know what she was going
    to do with her math degree.


    With many of the nation''s men fighting overseas, women were taking over jobs
    that had previously only been held by men. This was especially true for jobs related
    to technology. Women served as code breakers and machine operators. These jobs
    were all classified work. This meant they were top secret. The women who performed
    these jobs were known as the Top Secret Rosies.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'A woman packs cartridges at a factory in Philadelphia, Pennsylvania, during
    World War II. Women who did defense work during the war were often referred to
    as “Rosies."


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# TECH TALK


    > "A computer wasn’t a machine. It was a person. . . .

    Mathematics was a crucial weapon of the US arsenal, and women, its secret practitioners."

    —LeAnn Ericksonson, director of a documentary on the Top Secret Rosies


    Jennings heard the military was hiring math majors to be “computers.” In the 1940s,
    the word computer referred to workers who performed calculations by hand. These
    workers were often women. They worked long hours doing mathematical calculations.
    Jennings applied for a job as a computer for the United States Department of War
    and was hired.


    The US Department of War assigned Jennings to work at the Ballistics Research
    Lab at the University of Pennsylvania. There she calculated ballistics for military
    weapons. These calculations determined how far and fast a bullet or missile would
    go when shot. This information allowed the military to aim their weapons at specific
    targets.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_16_0.png)


    > Computers Kay McNulty (left) and Alyse Snyder use a differential analyzer at
    the University of Pennsylvania to calculate ballistics during World War II. The
    differential analyzer was a type of mechanical analog computer.


    Although her work was important to the war effort, Jennings grew tired of doing
    the repetitive calculations. She was ready for a new adventure. In 1945 Jennings
    applied to work on a new project.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 3


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_17_0.png)


    > The ENIAC was the first general-purpose electronic computer.


    # THE

    ENIAC


    In June 1945, Jennings was one of six women hired as programmers for a newly developed
    computer called the Electronic Numerical Integrator and Computer (ENIAC). All
    six of them had majored in math. They knew how to run numbers'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'on a calculator, but the ENIAC was quite different. For one thing, it took
    up almost an entire room. It stood nearly 9 feet (2.7 meters) tall. It stretched
    80 feet (24 m) in length, and it weighed 30 tons (27 metric tons). It was faster
    and more reliable than a human computer. But it was still in its infancy.


    The ENIAC was developed at the Moore School of Electrical Engineering at the University
    of Pennsylvania by John Mauchly and John Presper Eckert. It was the first general-purpose
    electronic computer. This means it could be used to complete many different types
    of calculations. The military wanted to use the machine to calculate ballistics
    faster and more reliably than humans could do by hand. But Mauchly and Eckert
    had designed the computer to solve many other problems as well.


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_18_0.png)


    > Two of the original six programmers, Ruth Lichtenman (left) and Marilyn Wescoff,
    work on the ENIAC.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_19_0.png)


    The ENIAC could solve problems one thousand times faster than any other computing
    machine of its time. It had forty individual panels that performed different functions.
    It contained twenty accumulators, which could add and subtract. Each of the accumulators
    could also hold a ten-digit decimal number in memory.


    Jennings and her colleagues first had to figure out how the ENIAC worked. But
    they had to learn how it worked without ever seeing the actual machine. The ENIAC
    was so top secret that very few people had high enough clearance'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'to see the computer in action. The programmers examined diagrams of the ENIAC’s
    circuits. And Mauchly answered any questions they came up with along the way.
    Then World War II ended when Japan surrendered in September 1945. In October Jennings
    and her fellow programmers were allowed to see the ENIAC for the first time. Jennings
    and her colleague Betty Snyder finally began to program the ENIAC to calculate
    ballistics for the military.


    On February 15, 1946, Mauchly, Eckert, and the six programmers shared the ENIAC
    with the world. They gave a formal demonstration of Jennings and Snyder’s program
    to the scientific community. The demonstration was a success. It proved to the
    world that the ENIAC was the first computer to successfully run a program.


    > TECH TALK

    “We were thrilled to see the ENIAC for the first time and amazed by its size.
    It was much bigger and more magnificent and intimidating than we had imagined.”

    —Jean Bartik'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'In the fall of 1946, the ENIAC was moved from the University of Pennsylvania
    to Aberdeen Proving Ground in Maryland. Jennings and others continued to improve
    it. In December of that year, Jennings also married Bill Bartik and began using
    her husband''s last name.


    In December 1946, Bartik was asked to lead a team to turn the ENIAC into a stored-program
    computer. The first computers could only be wired to run one program at a time.
    In order to run a new program, the computers had to be rewired. By the end of
    March 1948, Bartik''s team had figured out how to increase the ENIAC’s memory.
    That meant the ENIAC could store different program instructions in its memory.
    The ENIAC continued operating until October 2, 1955. Over the years, it was used
    for many purposes, including weather prediction and research on the design of
    wind tunnels.


    # TECH TALK


    > "We had tamed a mechanical beast and made it purr."

    —Jean Bartik, discussing the successful programming of the ENIAC'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_22_0.png)


    > Mauchly (front left), Jennings (back left), and other members of the ENIAC team
    operate the machine in 1946.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 4


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_23_0.png)


    > Eckert demonstrates the UNIVAC in 1951.


    # WELL-DESERVED RECOGNITION


    After the success of converting the ENIAC to a stored-program computer, Bartik
    began working for the Eckert-Mauchly Computer Corporation, a private company formed
    by Eckert and Mauchly after World War II. There,'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Bartik helped program a new computer, the Universal Automatic Computer (UNIVAC)
    I. The UNIVAC could quickly do simple math problems, and it could also store words.
    This made it easier for businesses to use the computer for a wider variety of
    tasks, such as keeping track of inventory. While working on it, she wrote the
    world''s first sort/merge program


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_24_0.png)


    > The UNIVAC was the first commercial computer produced in the United States.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'for a computer. Sort/merge programs allow computers to break down large pieces
    of data into smaller, more manageable pieces.


    Eckert-Mauchly Computer Corporation was acquired by Remington Rand Inc. in 1950.
    Many employees, including Bartik, continued working for Remington Rand. In 1951
    they sold the


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_25_0.png)


    > After the 1950 population census, workers used the UNIVAC to tabulate the entire
    1954 economic census.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'first UNIVAC to the United States Census Bureau to help calculate the 1950
    US census.


    While working on the UNIVAC, Bartik also programmed the Binary Automatic Computer
    (BINAC), a computer used by Northrop Aircraft. The BINAC was designed to control
    long-range missiles. It consisted of two identical computers


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_26_0.png)


    > The BINAC undergoes a test run at the manufacturer in 1949.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'that did the same tasks, double-checking each calculation in the process.


    Even though Bartik was a successful computer programmer, it was difficult for
    her to get any recognition for her work. The same year Remington Rand purchased
    Eckert-Mauchly, Bartik was scheduled to give a presentation to one of its customers,
    the Naval Aviation Supply Office. But as the date for the meeting drew nearer,
    Remington Rand decided a man should give the presentation to the navy commanders
    instead. Bartik only delivered a proposal at the end of the meeting. After the
    presentation, Bartik wasn''t allowed to attend dinner with the men because they
    thought she might be offended by their jokes. Remington Rand never allowed Bartik
    to give another presentation.


    Bartik decided to leave Remington Rand in 1951. She dedicated the next sixteen
    years to raising her three children. She also went back to school. In August 1967
    she received a master''s degree in English from the University of Pennsylvania.


    After completing her degree, Bartik decided to rejoin the workforce. However,
    she discovered that jobs for women in the computer science world were hard to
    come by. In addition, computers were now completely different than they had been
    when she first began her career. They had become much'
  merge: -1
  pgno: 27
- img_proc: true
  md: Two employees work in the computer room of Huntsman House in 1968. By the late
    1960s, computers had gotten smaller and faster.
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/88bdd5e8cf4a27d56c7d3c258bc79156_29_0.png)


    smaller. They could process and store information much faster and better than
    computers such as the ENIAC ever could.


    So, instead of programming, Bartik wrote and edited publications about computers
    and the computer science industry. She worked for Auerbach Corporation, Honeywell,
    and Data Decisions. And she also had another mission. She fought for the recognition
    of women in technology and the workplace.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Bartik encouraged women in the field of computing. She gave many talks to women
    in college and in the computer industry.

    Bartik also received awards recognizing her as a pioneering programmer. In 2002
    the Jean Jennings Bartik Computing Museum opened at Northwest Missouri State University.

    in 2008 the Computer History Museum in Mountain View, California, granted Bartik
    the Museum Fellows Award. That same year, Bartik received the Institute of Electrical
    and


    ![](img/88bdd5e8cf4a27d56c7d3c258bc79156_30_0.png)


    > The Computer History Museum is dedicated to preserving artifacts related to
    the history of computing. The museum inducted Bartik (center) into their Hall
    of Fellows in 2008.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# TECH TALK


    > “I think you should be prepared, and work hard—everyone that succeeds must work
    hard—and open the door when opportunity knocks. Opportunity comes in a lot of
    different ways. But I do believe that you should enjoy what you do.”

    —Jean Bartik, offering advice to young women entering the field of computer science


    Electronics Engineers Computer Pioneer Award. It honored her pioneering efforts
    as one of the first computer programmers.

    In 2011, Bartik died of congestive heart disease. She left behind an important
    legacy. At a time when women were—not encouraged to pursue careers in math and
    technology, Bartik seized every chance to put her talents to use. During her career,
    many people overlooked the importance of Bartik’s contributions. But as one of
    the world’s first computer programmers, Bartik helped to shape the field for decades
    to come.'
  merge: -1
