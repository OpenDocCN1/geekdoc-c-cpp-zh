- pgno: 314
  md: 'When you typed on the iPhone keyboard in the past, you received visual feedback
    of the key you struck because that letter momentarily swelled to a larger size.
    If you want the iPhone to follow this traditional ritual, make sure that the new
    Character Preview switch under Keyboard settings is enabled.


    Note the Keyboard settings under Accessibility settings. You can flip a switch
