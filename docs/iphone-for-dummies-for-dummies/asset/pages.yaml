    mail, you''ll receive a notification to that, giving you a chance to add the information
    to your calendar. If a phone number is recognized in a mail message, a notification
    will ask you to add the number to your contacts.


    Moreover, you can act upon Mail notifications that arrive in Notification Center
    via 3D Touch. Gently press against the notification and then select Trash or Mark
    as Read. We have more to say about 3D Touch''s role in Mail later in this chapter.


