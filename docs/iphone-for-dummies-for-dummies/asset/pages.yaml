    # # I Can See Clearly Now


    If you know how to open a web page (if you don''t


    These neat tricks:


    > > Double-tap the screen so that the portion of the text you want to read fills
    the entire screen: it takes just a second before the screen comes into focus.
    By way of example, check out Figure 11-3. It shows two views of the same TODAY
    web page. In the first view, you see what the page looks like when you open it.
    In the second view, you see how the picture takes over much of the screen after
    you double-tap. To return to the first view, double-tap the screen again.


    > > Pinch the page: Sliding your thumb and index finger together and spreading
    them apart (or, we like to say, (unpinching)) zooms out and in of a page. Again,
    wait a moment for the screen to come into focus.


    > > Press on a page and drag it in all directions, or click through a page from
    top to bottom: You''re panning and scrolling, baby.


    > > Rotate the iPhone to its side: What happens to the White House website, in
    Figure 11-4. It reorients from portrait to a widescreen view. The keyboard is
    also wider, making it a little easier to enter a new URL.


    # # Opening multiple web pages at a time


    When we surf the web on a desktop PC or laptop, we rarely go to a single web page
    and call it day. In fact, we often have multiple web pages open the same time.
    Sometimes, several pages are open because we choose to hop around the web without
    closing the pages we visit. Other times, a link (see the next section) auto-opens
    a new page without shuttering the old. (If these additional pages are advertisements,
    they aren''t always welcome.)'
