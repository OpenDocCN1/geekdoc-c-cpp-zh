- pgno: 35
  md: 'For existing iPhone customers, the upgrade price for a new model may depend
    on how far you''re into your previous contract, how prompt you are paying your
    bill, and other factors. And as they say in the fine print, taxes and fees are
    extra.


    You may also get a nice trade-in deal on your existing phone, from Apple or other
    retailers.


    # # Activating the iPhone


    You will typically activate the iPhone where you bought the thing, just as you
    do with other cellphones. However, if you buy your iPhone from Apple''s online
    store, the folks will ship it to you and activate it through iTunes, like the
    old days, or through iCloud. If you''re a customer upgrading from an earlier iPhone
    or a different phone, you can convert your plan during the ordering process. You
    also choose your monthly bucket of voice minutes and SMS (Short Message Service)
    or text messages as well as your allotment of data minutes in the right.


    As mentioned, we aren''t going to go through all the wireless options here. Suffice
    to say that plans by wireless carrier and two-year contracts are subject to change.
    At the time this book was written, ironclad two-year contracts were rapidly becoming
    far less, well, ironclad. Of course, you''re still obligated to pay what you owe
    your carrier. Indeed, carriers are moving away from contracts to installment pricing.


    Unlimited data plans are also in a state of flux. Verizon and AT&T used to offer
    unlimited data but now typically change based on usage, those of you signed up
    for an unlimited data plan are grandfathered.


    Many "unlimited" plans are subject to data-speed throttling at a customer reaches
    a threshold of data, such levels are being raised in the consumer''s favor. For
    example, AT&T announced that customers wouldn''t be reduced to data speeds and
    potential latencies until they consumed 22GB in a month. In the post, such penalties
    may be incurred over 5GB per month.


    If you plan on tapping into the faster 4G LTE (Long Term Evolution) networks that
    the iPhone 5 and later models are capable of making nice with, you may end consuming
    more data and ultimately paying more.


    You may also have to fork over extra coin for a plan that includes tethering,
    or the capability to use your iPhone as a broadband modem for other devices you
    might carry, such as laptops and netbooks.'
