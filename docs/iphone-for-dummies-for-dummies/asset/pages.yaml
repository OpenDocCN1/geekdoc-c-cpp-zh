  md: '# If Nothing We Suggest Helps


    If you tried every trick in the book (this one) and still have a malfunctioning
    iPhone, it''s time to consider shipping it off to the iPhone hospital (better
    known as Apple, Inc.). You can send it in or visit your nearest Apple Store. (Hint:
    Make an appointment online first.) The repair is free if your iPhone is under
    its one-year limited warranty or you purchased AppleCare (or AppleCare+).


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_357_0.png)


    You can extend your warranty up to two years from the original purchase date.
    To do so, you need to buy the AppleCare Protection Plan for your iPhone. You don''t
    have to do it when you buy the phone, but you must buy it before your one-year
    limited warranty expires. The cost is $99.


    Here are a few things you should do before you take your iPhone to be repaired:


    +   > Your iPhone is erased during your repair, so you should sync your iPhone
    with iTunes before you take it in, if you can. If you can''t and you entered data
    on the phone since your last sync, such as a contact or an appointment, the data
    won''t be there when you restore your iPhone upon its repair.


    +   > Remove any third-party accessories, such as a case or screen protector.


    +   > Remove the SIM card from your iPhone (described in the earlier section "Problems
    with Calling or Networking+") and keep it in a safe place.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_357_1.png)


    Do not, under circumstances, forget to remove your SIM card. Apple doesn''t guarantee
    that your SIM card will be returned to you after a repair. If you forget this,
    Apple suggests that you contact your local AT&T, Verizon, or Sprint store and
    obtain a new SIM card with the proper account information. Och.


    Although you may be able to get your iPhone serviced by your provider or by mail,
    we recommend that you take it to your nearest Apple Store, for three reasons:


    +   No one knows your iPhone like Apple does. One of the Geniuses at the Apple
    Store may be able to fix whatever is wrong without sending your iPhone away for
    repairs.


    +   The Apple Store will


    +   Only the Apple Store offers an Express Replacement Service (ERS) for iPhones
    needing repair. The AppleCare Express Replacement Service'
