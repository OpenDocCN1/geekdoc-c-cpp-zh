- pgno: 28
  md: 'Cell signal: The strength of the cellular signal. The cell signal icon tells
    you whether you''re within range of your wireless telephone carrier''s cellular
    network and therefore can make and receive calls. The more filled circles you
    see (five is the highest), the stronger the cellular signal. If you''re out of
    range, the circles are replaced with the words No Service. And if your iPhone
    is looking for a cellular signal, the circles are replaced with Searching.


    If your screen shows only one or two filled circles, try moving a little bit.
    Walking a few feet can sometimes mean the difference between no service and three
    or four filled circles.


    Airplane mode: All wireless features of your iPhone — 4G, 3G, GPRS (General Packet
    Radio Service), and EDGE networks, Wi-Fi, and Bluetooth — turned off. You''re
    allowed to use your iPod on a plane after the captain gives the word. But you
    can''t use your cellular except when the plane is in the gate area before or after
    landing. Fortunately, iPhone offers an airplane mode, which turns off all wireless
    features of your iPhone and makes it possible to enjoy music or video during your
    flight.


    Some flights offer on-board Wi-Fi. If you''re on a flight, you can turn on Wi-Fi
    when airplane mode is enabled. Don''t turn it on until the captain says it''s.


    LTE: Your wireless carrier''s high-speed LTE network is available.


    4G: Your wireless carrier''s high-speed UMTS network is available.


    3G: Your wireless carrier''s 3G UMTS or EV-DO data network is available and your
    iPhone can connect to the Internet via 3G.


    EDGE: Your wireless carrier''s slower EDGE (Enhanced Datarate for GSM Evolution)
    network is available and you can use it to connect to the Internet.


    GPRS/1xRTT: Your wireless carrier''s slower GPRS data network is available and
    your iPhone can use it to connect to the Internet.


    Wi-Fi: Your iPhone is connected to the Internet over a Wi-Fi network. The more
    semicircular lines you see (up to three), the stronger the Wi-Fi signal. If your
    screen displays only one or two semicircles of Wi-Fi strength, try moving around
    a bit. If you don''t see the Wi-Fi icon in the status bar, Internet access is
    not available.


    Wireless (that is, cellular) carriers offer one of four data networks. The fastest
    are the so-called 4th generation networks such as LTE and 4G UMTS; the next fastest
    is 3G; and the slowest are EDGE and GPRS. The device looks for the fastest available
    network. If it can''t find one, it looks for a slower network.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_28_0.png)


