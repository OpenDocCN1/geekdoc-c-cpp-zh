- pgno: 242
  md: '# Smart Safari Settings


    Along with the riches galore found on the Internet are places in cyberspace you''ve
    hassled. You might want to take pains to maintain your security.


    Return with us now to Settings, by tapping the Settings on the Home page. Now
    tap Safari. You''ve already discovered how to change the default search engine
    and clear the record of the sites you visited through Settings. Now see what else
    you can do:


    +   Fill forms with AutoFill: When AutoFill is turned on, Safari automatically
    fill out web forms by using your personal contact information, usernames, passwords,
    and credit card information or by using information from other contacts in your
    address book. You can also save AutoFill credit card info. No rot.


    +   View Passwords: Use a finger to authorize TouchID and you can view and edit
    the passwords you use all over the Internet.


    +   Flip the switch on the Frequently Visited Sites setting: Choose this setting
    if you want your phone to keep a record of such sites.


    +   Play favorites: Here''s the place to determine whether to quickly access Favorites
    bookmarks when you enter an address, search, or create a tab.


    +   Open links: Choose whether links will open in a new tab or in the background.


    +   Block cookies: We''re not talking about crumbs you may have accidentally dropped
    on the iPhone. Cookies are tiny bits of information that a website places on the
    iPhone when you visit so that the site recognizes you when you return. Do not
    assume the worst: Most cookies are benign and many are beneficial.


    If this content wigs you, you can take action: Tap Block Cookies to always block
    cookies. Or you can allow them under certain circumstances. That is, you can choose
    to allow cookies from the current website you''re visiting or any of the websites
    you visit. Or you can always allow cookies. Tap Safari to return to the main Safari
    settings page.


    If you don''t set the iPhone to accept cookies, certain web pages won''t load
    properly and sites such as Amazon and organizations you belong to will no longer
    recognize you when you appear at their doors.


    +   Hide your tracks: We''ve already told you about private browsing. By turning
    on Do Not Track in Safari settings, you''re taking an additional safeguard.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_242_0.png)


    CHAPTER 11 Going on a Mobile Safari 231'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Field search suggestions: Choose whether to turn on search engine suggestions,
    Safari Suggestions, Quick Website search, or to reload the Top Hit when you''re
    searching in the smart search field. It''s worth noting that unless you alter
    your privacy settings, when you enable Safari Suggestions, your search queries
    and Safari Suggestions that you select are shared with Apple, as is any related
    usage data.


    Cellular Data for Reading List: When on, this option lets you use your cellular
    network to save reading list items from iCloud so you can read them offline.


    Turn JavaScript on off: Programmers use JavaScript to add various kinds of functionality
    to web pages, such as displaying the time and changing images when you access
    them. In the past, some security risks have also been associated with JavaScript,
    though none we we know of affect mobile Safari. You find this option under Advanced
    in Safari settings.


    Receive fraud Warnings: By turning this on, you''ll be warned when you inadvertently
    visit a fraudulent website, perhaps one engaging in phishing or scams to steal
    your username, password, and other account information. Fraudulent websites sometimes
    masquerade as legitimate banks or financial institutions to trick you into freely
    rendering your data. As a result, we think it''s a good idea to keep this turned
    on.


    Check for Apple Pay: You can use the Apple Pay mobile payments technology when
    you''re shopping on the web with your iPhone. Once you''ve set up Apple Pay, Safari
    has all your payment and shipping information, so you can easily complete the
    transaction with your fingerprint. In Settings, make sure the Check for Apple
    Pay switch is enabled.


    Block pop-ups: Pop-ups are these web pages that show whether you want them or
