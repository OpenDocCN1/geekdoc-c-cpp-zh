- pgno: 220
  md: 'Tap the slow-motion video you want to watch. The video starts playing at normal
    speed, and then slows at a point determined by the phone. You can adjust this
    slow-motion section by sliding the vertical bars above the frame viewer (see Figure
    10-5). When the vertical lines are close, the video is playing back at a normal
    speed. The video plays back slowly when the lines are spread apart. When you''re
