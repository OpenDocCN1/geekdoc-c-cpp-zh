- pgno: 32
  md: '+   **Health**: This app gathers info from fitness devices and other health
    apps to provide a clear and current overview of your health on an easy-to-read
    dashboard.


    +   **Settings**: Use this app to adjust your iPhone''s settings. If you''re a
    Mac user, think System Preferences; if you''re a Windows person, think Control
    Panel.


    # # The second Home screen


    You won''t find the icons we''re about to describe on your Home screen — at least
    not on the first (main) one. These apps usually appear on the second Home screen
    (which you will find out in Chapter 2). If you just can''t see them, swipe your
    finger across the screen from right to left and they''ll appear like magic.


    # # Inside the Extras Folder


    In the Extras you find these icons:


    +   **Compass**: The Compass app is kind of having a magnetic needle compass inside
    your iPhone, but better.


    +   **Tips**: This app provides tips for using your iPhone and iOS 10.


    +   **Voice Memos**: This handy little app turns your iPhone into a convenient
    handheld recording device.


    +   **Contacts**: This app stores contact information, which can be synced with
    iCloud, macOS Contacts, Yahoo! Address Book, Google Contacts, and many more.


    +   **Find Friends**: This app shows a map with the locations of friends who have
    consented to being tracked by Find My Friends.


    +   **Find iPhone**: This app displays a map with the last known locations of
    your family''s iPhones (assuming it''s enabled on each misplaced phone before
    it was misplaced).


    # # Outside the Extras Folder


    In addition to the Extras folder, you find several additional icons on the second
    Home screen:


    +   **FaceTime**: This app is used to make FaceTime video or voice calls to others
    using Apple devices.'
