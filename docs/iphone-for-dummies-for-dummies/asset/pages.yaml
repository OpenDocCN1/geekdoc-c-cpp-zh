    # Phoning In More Settings


    We cover most of the remaining settings in earlier chapters devoted to calendars,
    music, photos, Safari, and email. Still, we didn''t get to a few other settings
    — ''til now.


    # iCloud


    The iCloud settings are where you let iCloud know of your apps, Pl Photo Stream,
