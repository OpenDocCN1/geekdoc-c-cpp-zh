  md: '# Continuing the setup


    Your iPhone setup continues. You get to determine whether you want to call on
    Siri, your loyal loquacious iPhone genie. We tell you all about Siri in Chapter
    5, so we''ll skip the details here.


    Apple makes another couple of requests at this stage. Apple would love for you
    to have your iPhone automatically send the company daily diagnostic and usage
    data, including your location. Armed with such information, Apple says it can
    improve the company''s products and services. We think the request is harmless.
    In addition, you can also assist developers by permitting Apple to share with
    crash data and statistics on how you use your apps. If you find other prospect
    unappealing, just say no — or be precise, Choose Don''t or Don''t share, respectively.


    Thanks to the extra real estate on the 4.7-inch iPhone 6, 6s, and 7, and the 5.5-inch
    6 Plus, 6s Plus, and 7 Plus (compared to the 4-inch SE) includes another step
    to the setup process: You can choose a zoomed view (with larger text and controls)
    or a standard view that fits more items on the screen. Don''t worry too much about
    this setting at this stage. You can always change the Display Zoom setting later
    in Settings. (If you do, restart your phone.)


    From then on, you''re pretty much go to go.


    If you want to give your iPhone a quick nap, you can put it to sleep by pressing
    and quickly letting go of the sleep/wake button. To turn the sleep/wake button
    until a transluc Slide to Power Off button appears at the top of the screen. Drag
    the button to the right. Tap Cancel (X) if you change your mind.


    # Locking the iPhone


    Carrying a naked cellphone in your pocket is asking for trouble. Unless the phone
    has some locking mechanism, you may inadvertently dial a phone number. Try explaining
    to your boss why he or she got a call from you at 4 a.m. jog. Fortunately, Apple
    makes it a cinch to lock the iPhone so this pocket-dialing scenario won''t happen
    to you.


    In fact, you don''t need to do anything to lock the iPhone; it happens automatically,
    as long as you don''t touch the screen for one minute. (You can change this duration
    in iPhone Settings, a topic in Chapter 14.)


