  md: '> Speaker: The speaker is used by the iPhone''s built-in speakerphone and plays
    audio — music or video soundtracks — if no headset is plugged in. It also plays
    the ringtone you hear when you receive a call. iPhone 7 models have stereo speakers.


    # On the front


    On the front of your iPhone, you find the following (labeled in Figure 1-3):


    +   Camera: The camera on the front of the iPhone is tuned for FaceTime, so it
    has the right field of view and focal length to focus on your face at arm''s length,
    which presents you in the best possible light.


    +   Receiver: The receiver is the speaker that the iPhone uses for telephone calls.
    It naturally sits close to your ear whenever you hold your iPhone in the "talking
    phone" position.


    You should be the only one who hears sound coming from the receiver. If you have
    the volume set above 50 percent and you''re in a location with little or no background
    noise, someone standing nearby may be able to hear the sound. So be careful.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_26_0.png)


    If you require privacy during phone calls, use the included Apple headset (or
    any compatible third-party wired or wireless headset — as discussed in Chapter
    14).


    +   Status bar: The status bar displays important information, as you discover
    in a page or two.


    +   Touchscreen: You find out how to use the iPhone''s gorgeous high-resolution
    color touchscreen in Chapter 2. All we have to say this is time not to drool over
    it.


    +   Home button and Touch ID sensor: No matter what you''re doing, you can press
    the Home button at any time to display the Home screen, which is the screen shown
    in Figure 1-3. The iPhone''s Touch ID sensor can use your fingerprint to unlock
    the phone (first) see Chapter 2.


    +   App icons: Each icon on the (first) Home screen launches an included iPhone
    app or you''ve acquired from the App Store.


    # On the back


    On the back of your iPhone is a camera lens. It''s the little circle in the top-left
    corner. The iPhone also has one or more LEDs next to the camera lens for a flash
    for still photos, as a floodlight for videos, and as a flashlight (turn it on
    and off in Control Center). For more on using the camera and shooting videos,
    see Chapters 9 and 10, respectively; for more on the flashlight and Control Center,
    see Chapter 5.'
