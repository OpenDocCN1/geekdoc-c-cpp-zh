    +   Add fingers after the initial setup, tap Settings Touch ID & Passcode. Type
    yours, and tap Add a Fingerprint. Repeat the setup until you described.


    If you choose to set fingerprint authentication now, later, or not at all, you
    need to establish an old-fashioned passcode, a longer custom numeric code, or
    a longer alphanumeric code. In fact, if you opt to go with Touch ID, you must
    set up a passcode as a backup should the iPhone fail to recognize your paw three
    times in a row. Hey, it happens you''re sweating profusely, or you have a cut
