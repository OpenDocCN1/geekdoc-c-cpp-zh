    she, um, started that way. You can now choose a male or female voice to represent
    Siri, and yes, we''ll resist making any other transgender references. We''ll also
    resist saying much about Siri until later in this chapter because we want to get
    to another feature that helps you control your phone, the aptly named Control
    Center, which is a mere swipe away.


    # Controlling Control Center


    As its name suggests, Control Center is a single repository for the controls,
    apps, and settings you frequently call upon. We briefly wrestled with holding
    off on the discussion of Control Center until Chapter 14, where we go deeper into
    the iPhone settings. We quickly dismissed that idea because we think you''re going
    to take advantage of Control Center as much as we do. Indeed, you will almost
    certainly spend a lot more time in Control Center than in Settings.


    To access Control Center, swipe up from the bottom of the screen — any screen.
    The beauty of Control Center is that it''s always available when you need it.


    Now, take a gander at Figure 5–1 and you''ll get an immediate handle on all the
    things Control Center lets you get at right away.


    We start our Control Center tour on the upper row and move from left to right.
    We see controls for airplane mode (see Chapter 14 for more), Wi-Fi, Bluetooth,
    the Do Not Disturb feature, and the screen''s orientation lock.


    Now drop down to the next line. Here you can slide a controller to increase or
    decrease the brightness of the screen.


    Next are controls for AirPlay and AirDrop. The latter is a way to share pictures,
    videos, and other files wirelessly with folks nearby who have iOS devices (iOS
    7 or later) of their own and Bluetooth turned on. By contrast, AirPlay is a way
    to stream music and movies wirelessly via Wi-Fi to Apple TVs and to compatible
    AirPlay–enabled speakers and receivers. We discuss AirPlay in greater depth in
    Chapter 8.'
