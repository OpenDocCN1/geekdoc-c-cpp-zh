  md: '# Shazam


    Ever heard a song on the radio or television, in a store, or at a club, and wondered
    what it was called or who was singing? With the Shazam app, you may never wonder
    again. Launch Shazam, tap Touch to Shazam, and point your iPhone''s microphone
    at the source of the music.


    If you have an iPhone with 3D Touch, you can press the Shazam icon and choose
    the Shazam Now quick action shortcut (thus skipping the whole “tap Touch to step).


    In a few seconds, the song title and artist''s name magically appear on your iPhone
    screen, as shown in Figure 17–1.


    In Shazam parlance, that song has been tagged. Now, if tagging was all Shazam
    could do, would surely be enough. But wait, there''s more. After Shazam tags a
    song you can


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_363_0.png)


    +   Buy the song at the iTunes Store

    Listen to the song on Apple Music

    Watch related videos on YouTube

    Tweet the song on Twitter

    Listen to the song on Spotify

    Read a biography, a discography, or the lyrics

    Take a photo and attach it to the tagged item in Shazam

    Email a text to a friend


    Shazam isn''t great at identifying classical music, jazz, big bands, show tunes,
    or opera, nor is it adept at identifying really obscure indie bands. But if you
    use it primarily to identify popular music or classic rock, it rocks (pun intended).


    As of iOS 10, Siri has Shazam technology built in, which means you don''t even
    need the app to identify a song. Just ask Siri what song is playing, as shown
    in Figure 17–2, and she''ll usually be able to tell you.


    Figure 17–1:Point your phone at the music and Shazam tells you the artist, title,
    and more.'
