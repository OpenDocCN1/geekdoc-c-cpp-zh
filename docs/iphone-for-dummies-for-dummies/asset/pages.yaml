- pgno: 87
  md: 'Your iPhone contacts reflect any groups you belong to, such as different departments
    in your company, friends from work, and friends from school. When you''re looking
    at the Contacts for an individual person, a Contacts button appears in the upper-left
    corner. Tap Contacts to display the roster of all your contacts, and the button
    at the upper-left corner changes to Groups. Tap that button to access contacts
    for a given group.


    Among the Group listings you see is one for all your iCloud contacts and one for
    all your friends on Facebook. In some cases, your contacts will be linked — that
    is, information supplied by Facebook, Microsoft Exchange, or some other source
    will be combined into a single entry. The obvious benefit of this linking is that
    you can cut down on duplicate contact lists. If the iPhone doesn''t automatically
    link appropriate entries, you can do the job manually from the given contact.
    Tap Edit, scroll to the bottom, and tap the green circle with the white + inside
    to link contacts from your entire list of contacts.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_87_0.png)


    Your own iPhone number, let you forget it, appears at the top of the Contacts,
    provided you arrived in Contacts through the iPhone app.


    Tapping Edit in a specific contact lets you all sorts of additional information
    for that person, including addresses (a thumbnail map), birthdate, and social
    profiles.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_87_1.png)


    You can initiate text messages and emails from Contacts. These topics are discussed
    in greater depth in Chapters 6 and 12, respectively.


    If you have the iPhone 6, 6s, SE, 7 or 7 Plus, you can press on a contact to seek
    additional ways to connect. Yep, you''re exploiting 3D Touch.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_87_2.png)


    With the arrival of iOS 10, third-party apps get the green light to highlight
    your information with your iPhone contacts.


    # Favorites


    Favorites is where you can keep a list of the people and numbers you dial most
    often. Consider Favorites the iPhone equivalent of speed dialing. Merely tap the
    person''s name in Favorites, and your iPhone calls the person.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_87_3.png)


    You can set as many favorites as you need for a person. So, for example, you create
    separate favorite listings for your spouse''s office phone number, cell number,
    and FaceTime entry.


    If you have the 6, 6s, SE, 7, or 7 Plus, you can add 3D Touch to watch. Press
    down a name in your Favorites list. That gives you a shortcut to'
