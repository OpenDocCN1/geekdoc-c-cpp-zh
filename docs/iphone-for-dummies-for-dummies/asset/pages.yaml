    # Summoning Siri


    When you first set up the iPhone, you have the option of turning on Siri during
    which you can train Siri to your voice by repeating "Hey Siri" and a few other
    phrases. If you did set up Siri, you''re good to go. If you didn''t, tap Settings
    General and flip the switch to on, meaning greener than white is shining. (If
    you turn off Siri, you effectively turn on Voice Control.)


    Having Siri is a prerequisite for using the Dictation functionality on your phone,
    discussed later in this chapter. Siri assumes a vital role in search.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_111_0.png)


    You have a few ways to call Siri into action. The traditional way is to press
    and hold down the Home button until you hear a tone. Simply, eh? The question,
    "What can I help you?" appears on the screen, as shown in Figure 5-2. You can
    start talking.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_111_1.png)


    You can summon Siri by merely saying, "Hey Siri." And yes, this is Apple''s answer
    to the "OK Google" command on Android phones. Unless you have the iPhone 6s, 6s
    Plus, or later, your phone has to be connected to power and running iOS 8 or later
    to take advantage of the Siri feature.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_111_2.png)


    If you have the 6s or 6s Plus with its M9 processor or the 7 or Plus with its
    A9 Fusion chip, you can utter the phrase "Hey Siri" to call her into action without
    plugging in — such robust processors in these models Siri is always effectively
    on call.


    Just make sure the Hey Siri option is turned on in Siri''s settings.


