    # # Turning the iPhone On and Off


    Apple has taken the time to nearly charge your iPhone, so you''ll get some measure
    of instant gratification. After taking the phone out of the box, press and hold
    down the sleep/wake button. on the top-right edge of iPhones. On the iPhone SE,
