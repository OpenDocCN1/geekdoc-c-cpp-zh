- pgno: 303
  md: '![](img/8361dd8dda9818e97bf48313b13b8d6b_303_0.png)


    A couple more things to note in Privacy settings: if you scroll down near the
    bottom, you''ll see Diagnostics & Usage. At your discretion, you can send daily
    diagnostic and usage data to help out Apple. This data may include information.
    Next, you''ll see an Advertising listing where you have the option to disable
    Advertising Identifier that apps may use to serve you targeted ads. If you decide
    to limit ad tracking, whatever you do, apps are not permitted to use the Advertising
    Identifier. As Apple warns, turning Limit Ad Tracking doesn''t necessarily mean
    you''ll see fewer ads, just that they may be less relevant because they aren''t
    based on your interests.


    # Sounds


    Consider the Sounds area as the iPhone''s soundstage. (This setting is known as
    Sounds & Haptics on the iPhone 7 and Plus). There, you can turn on or off audio
    alerts and choose the sounds for a variety of functions: voicemail messages, text
    messages, new mail, sent mail, tweets, Facebook posts, calendar alerts, reminder
    alerts, and AirDrop. You also set the default ringtones and text tones here (as
    described in Chapter 4).


    That''s not all. Want to hear lock sounds and keyboard clicks or not? The Sounds
    settings area is where you make that decision. In addition, you can determine
    whether the iPhone should vibrate when you receive a call. And you can drag the


    FIGURE 14-6: Tap an in the Privacy list to see which apps are accessing it.


    292 PART 5 The Undiscovered iPhone'
