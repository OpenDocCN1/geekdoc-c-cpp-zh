- pgno: 320
  md: 'If the iPhone can correctly match a Facebook friend entry with an existing
    contact entry, it will try to unify contact under a single view. Meanwhile, the
    Update All Contacts option under Facebook settings on the iPhone serves a slightly
    different-purpose. It tries to add Facebook profile information to your contacts
