  md: 'pronto on the iPhone, just as they do on your other computers. (To keep everything-to-date,
    the iPhone also supports push calendars and push contacts.) For push to work,
    your company must be simpatico with one of the last iterations of Microsoft Exchange
    ActiveSync. Ask your company''s IT or department if you run into an issue.


    Setting up Exchange isn''t particularly taxing, and the iPhone connects to Exchange
    right out of the box. However, you might still have to consult your employer''s
    techies for certain settings.


    Start up by tapping the Microsoft Exchange button on the Add screen. Fill in what
    you can: your email address, username (usually as domain\user), and password.
    Or call on your IT staff for assistance.


    On the next screen, shown in Figure 12-4, enter the server address, assuming that
    the Microsoft Autodiscover service didn''t already find it. That address usually
    begins with exchange.com.


    The company you work for doesn''t want anyone to have access to your email — heaven
    forbid if you is lost or stolen. So your bosses might insist that you change the
    passcode lock settings in Settings. (The passcode is different from the password
    for your email account.) Skip over Chapter 14 to find instructions for adding
    or changing a passcode. (We''ll wait for you.) Now if your iPhone ends in the
    wrong hands, your company can remotely wipe your contents clean.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_249_0.png)


    After your corporate account is fully configured, you have to choose which information
