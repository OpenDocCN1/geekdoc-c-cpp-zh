    # Chapter 2


    # # iPhone Basic Training


    If you were caught up in the initial iPhone frenzy of 2007, you may have plotted
    for months about how to land one. After all, the iPhone quickly emerged as the
    ultimate fashion phone, and the chic device hosted a bevy of cool features.


    Owning the happiest and most-hyped handset on the planet came at a premium cost
    compared with rival devices. To snag the very first version, you may have saved
    your pennies or said, "The budget be damned."


    That''s ancient history now. Almost a decade later, the iPhone has gone mainstream
    and you get more bang for your buck. A lot more bang.


    We can list a bunch of prices, but pricing for the wireless industry, and 예정이다
    the iPhone, is in a state of flux. You used to be able to buy an iPhone for a
    subsidized and relatively low upfront price that was tied to a two-year contract
    with your carrier. As of this, however, such contracts are no longer the norm.
    Instead, wireless companies are pushing instalment pricing options, which you
    can choose to put little or no money down but then obligated to pay for the device
    over typically a two-year term. In some cases you lease the phone; in others,
    you buy the phone outright.


    The entry-level iPhone SE (at the time of this writing) started at $399 or $16.63
    with carrier financing. The highest capacity 256GB iPhone 7 Plus from a carrier
    such as AT&T cost $969.99 or $32.24 a month.


    Of course you must still pay for cellular and data coverage and data from a wireless
    carrier.


    CHAPTER 2 iPhone Basic Training 23'
