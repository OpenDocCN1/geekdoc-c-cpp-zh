    capability of the FaceTime HD camera. For the faintest selfies or group shots,
    the iPhone will capture each and every one. Burst mode bursts out ten images per
    second on this front camera as well, and Apple says every burst sequence is analyzed
    in real time for sharpness and clarity. Face detection has also been improved,
    and Apple even claims to better identify blinks and smiles.'
