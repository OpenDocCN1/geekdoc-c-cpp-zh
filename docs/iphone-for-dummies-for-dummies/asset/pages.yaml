- pgno: 41
  md: '# TRAINING YOUR DIGITS


    We''ve already told you how to train your digits to use Touch ID. Well, your fingers
    play a prominent role throughout your iPhone experience, tapping, flicking, pinching,
    and dragging. Fortunately, these gestures are not challenging, so you''ll be mastering
    many of the iPhone''s features in no time:


    +   * **Tapping:** Tap serves multiple purposes, as becomes evident throughout
    this book. You can tap an icon to open an app from the Home screen. Tap to start
    playing a song or choose the photo album you want to look through. Sometimes you''ll
    double-tap (tapping twice in rapid succession), which has the effect of zooming
    in (or out) of web pages, maps, and emails.

    * **Flick:** A flick of the finger on the screen lets you quickly scroll through
    lists of songs, emails, and picture thumbnails. Tap the screen to stop scrolling,
    or merely wait for the list to stop scrolling.

    * **Pinch/spread:** On a web page, pinch your fingers to shrink the image, or
    spread your apart to enlarge it. Pinching and spreading (what we call unpinching)
    are cool gestures that are easy to master and sure to wow an unfamiliar audience.

    * **Drag:** Slowly press your finger against the touchscreen and, without lifting
    your finger, you might drag a map that is too large for the iPhone''s display.


    A gesture reachability helps owners of the larger-display iPhones. By double-tapping
    (but not double-pressing) the Home button, the top portion of the screen shifts
    toward the bottom of the display so that you can tap icons and items that were
    previously out of reach. The purpose of this gesture is to help you use these
    phones with one hand.


    Can''t? Lock the iPhone immediately, press the sleep/wake button. To unlock it,
    you can press the sleep/wake button again. Or press the Home button on the front
    of the screen. Either way, press the Home button to open your phone, a change
    that arrived with iOS 10. Prior to iOS 10, the Slide to Unlock appeared near the
    bottom of the screen and to unlock, you drag your finger to the right and then,
    in some cases, also entered a passcode, another topic reserved for Chapter 14.
    If you set up the iPhone to use Touch ID, you can merely press your finger against
    the Home button to unlock.


    The iOS 10 software upgrade brings another capability to the most recent iPhones:
    the capability to wake up the screen merely by raising the phone. The Raise-to-wake
    feature, which you can turn on or off inside Settings, requires an iPhone with
    an M9 processor or later, which as of this writing means the iPhone 6,


    PART 1 Meet Your iPhone'
