- pgno: 178
  md: '# Chapter 9


    # “Smile”: Taking Pictures with Your iPhone


    t''s no longer we that camera phones outsold dedicated digital cameras. What is
    news to some is the number of camera features built into smartphones, compared
    to when cameras in phones were for the most part afterthought.


    The camera in the iPhone has always been among the very best, and the cameras
    in the iPhone 7 and 7 Plus are the best cameras to date from Apple, and among
    the best cameras, period. But the picture takers inside the models that came before
    these models aren''t slouches either.


    Such models are fast, easy to use, and sport some neat features, most notably
    the capability to apply a variety of filters and to shoot a burst of photos in
    the blink of an eye.


    We get to all these features over the next several pages. We then move on to the
    real magic — finding the digital photos that are on your iPhone and making them
    come alive — whether you imported them from your computer, they reside in the
    cloud, or you captured them with the iPhone''s camera.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # Taking Your Best Shot


    As we with many apps on the iPhone, you find the Camera app icon on the Home screen.
    Unless you moved things around, the Camera app is positioned on the upper row
    of icons, all the way to the right and adjacent to its next of kin, the Photos
    icon. We tap both icons throughout this chapter.


    Might as well snap an image now:


    +   1. Fire up the camera itself. Choose one of the following:

    * On the Home screen, tap the Camera app icon. Or from the Lock screen, swipe
    from right to left.

    * Drag Control Center from the bottom of the screen and tap the Camera icon in
    here.

    * On the Lock screen, drag the screen from right to left.

    2. Keep your eyes peeled on the iPhone display.

    You are taken to the viewfinder window. We get to the controls that frame that
    window shortly.

    3. Aim the camera at whatever you want to shoot.

    Use the iPhone''s display as your viewfinder. We marvel at the iPhone''s display
    throughout this book; the Camera app gives us another reason to do.

    You have several shooting formats. You move from one format to another by swiping
    right or left (in portrait mode) or swiping up or down (in landscape mode). Your
    choices are Video (kindly read the next chapter for more), Photo (your basic snapshot),
    Square (for a picture formatted to make nice with Instagram photo-sharing app),
    Pano (short for panorama), Time-Lapse (accelerated sequence), and Slo-Mo mode.
    You find out about them in the next chapter.

    4. When you''ve chosen a shooting format and are satisfied with what''s in the
    frame, do one of the following to snap the picture:

    * Tap the round shutter button. The button is at the bottom center of the screen
    in portrait mode (see Figure 9-1) or on the right or the left in landscape mode.
    As we show you in a moment, you''ll be able to change the point of focus if necessary.

    * Press the physical volume up or volume down button. These buttons are on the
    side of the phone (portrait mode) or at the top of the device (landscape mode).
    We generally consider this method a better way of shooting because it mimics the
    experience of capturing photos with a regular camera, at least when you''re holding
    the phone sideways.'
  merge: -1
  img_proc: true
