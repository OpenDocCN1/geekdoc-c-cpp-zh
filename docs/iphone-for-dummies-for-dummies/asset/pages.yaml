- pgno: 282
  md: '# Get route maps and driving directions


    You can get route maps and driving directions to any other location in a couple
    of ways.


    If a marker is already on the screen, tap the bubble with the name of the location,
    and then tap the Directions button in the overlay to get directions to or from
    that location.


    The second method applies to searches:


    +   1. Tap the Directions below the search field.


    The Start and End fields appear at the top of the screen displaying your current
    location. If you need directions from somewhere else than your current location,
    type a destination in the Start field or choose from your Favorites, Contacts,
    or Recents list.


    +   2. Type a destination in the End field or select a destination from your Favorites,
    Contacts, or Recents list.


    If you want to swap the starting and ending locations, tap the little swirly arrow
    to the left of the Start and End fields. If you need to change the start or end
    location, tap the Cancel button in the top-left corner and try again.


    When start and end locations are correct, tap the Route button in the top-right
    corner of the screen and the route map appears.


    Weird but: if you type the location, you will have to tap the Route button to
    proceed, or if you select the location (from your Favorites, Contacts, or Recents
    list), you won''t see a Route button and won''t have it to tap before you proceed.


    +   3. If Maps suggests several routes, select one by tapping its light blue line
    or bubble.


    In Figure 13-6, the 40-minute route is selected.


    Tap the i-in-circle in the lower-right corner of the map you''re viewing and then
    tap the Show Traffic button to help you decide which route will be most expedient.


    +   4. Tap the Start button at the top of the screen to receive turn-by-turn driving
    directions, as shown in Figure 13-7.


    +   5. To see the next step in the directions, swipe the fingers near the top
    of the screen from right to left; to see the preceding step, swipe from left to
    right.


    +   6. When you''re finished with the step-by-step directions, tap the End button
    in the top-left corner to return to the regular map screen.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_282_0.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_282_1.png)'
