- pgno: 132
  md: '# IN THIS CHAPTER


    +   >> Understanding the calendar''s views


    +   >> Using the clock as an alarm, stopwatch, and a timer too


    +   >> Paying with your phone


    +   >> Honing in on health


    # Chapter 7

    Ten Indispensable Utilities


    he iPhone is a smartphone. And, as a smart device, it can remind you of appointments,
    tell you the time (where you live or halfway around the world), and even help
    you perform arithmetic.


    Over the course of this chapter, we look at a few of the iPhone''s core — and,
    frankly, unsexy — apps. Indeed, we''d venture to say that no one bought an iPhone
    because of its calendar, calculator, clock, voice recorder, Reminders app, Wallet/Apple
    Pay feature, or even clever AirDrop wizardry. And even we know we should pay attention
    to health and fitness, the presence of a Health app probably not the reason you
    bought an iPhone either. But having these programs around is awfully handy and
    in some cases good to your overall well-being.


    # Working with the Calendar


    The Calendar program lets you keep on top of your appointments and events (birthdays,
    anniversaries, and the like). You open it by tapping the Calendar icon on the
    Home screen. The icon is smart in its own right because it changes daily, displaying
    the day of the week and the date.


    CHAPTER 7 Ten Indispensable Utilities 121'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'What’s more, thanks to interactive notifications you can accept or reject incoming
    calendar invitations without ever entering the Calendar app. When you enter the
    app, you can display five main calendar views: by year, by month, by day, by week,
    and by a searchable list view that shows current and future appointments.


    You must hold the phone in portrait mode to check the calendar in yearly, monthly,
    or daily view. In these portrait views, the current date on your calendar is circled
    in red. A Today button at the bottom of the screen returns you to the current
    date. Next to the Today button are Calendars button and an Inbox button, which
    we get to shortly.


    Get to list view, orient the phone in portrait mode and tap a particular day.
    You will see either the daily view or the list view, depending on how you last
    viewed the calendar. To toggle from one to the other, tap the icon at the top
    of the screen shown in the margin. To peek at a weekly calendar instead, rotate
    the iPhone to landscape mode.


    Take a closer look at the following sections.


    # # Year view


    There’s not much to the yearly view (see Figure 7-1, left), but at a glance you
    can see the current year scroll, or scroll up or down to see prior or future appointments.
    Unfortunately, from this view you can’t tell on which days you have your appointments.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_133_0.png)


    PART 2 The PDA iPhone'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Month view


    Tap any of the months visible in the yearly view to jump to that specific month,
    as shown in Figure 7-1, center. When your iPhone is in month view, a gray dot
    appears on any day that has an appointment or a scheduled event. Tap a given day
    to see the list of activities on the agenda for that day, which leads nicely into
    the next section.


    # Day view


    As we mentioned, you have to tap a date to see what you have going on in a 24-hour
    period — though to see an entire day''s worth of entries, you''ll have to scroll
    up or down. You can swipe to the left to advance to the next day of the week and
    beyond; swipe to the right to retrieve one or more days.


    In this day view, all events, birthdays, and events pulled from your Facebook
    account (if you provide your Facebook credentials) appear in a narrow strip above
    the timeline for the day, as shown in Figure 7-1, right. Your daily appointments
    span the entire time in which they''ve been scheduled on your calendar. For example,
    if an appointment runs from 11 a.m. to 1 p.m., those two hours will be blocked
    off on the calendar.


    You find out how to create calendar entries in a moment, but for know how you
    can hold down on an event and drag it to a new time slot should your plans change.
    If you have overlapping appointments, you''ll see more than a single entry claim
    a given time slot.


    Calendars are color-coded to the calendar in which you scheduled the appointment
    to help distinguish an appointment you made on your work calendar, say, a family
    calendar.


    # Week view


    As mentioned, you have to rotate the iPhone to its side to examine your weekly
    calendar. The view shown in Figure 7-2 (left), you can glance at only five days
    of entries so you must scroll in either direction to peek at any days that are
    not initially visible. On the smallest iPhones, you can see five days of entries.
    The current day is circled in red. You can arrange to start your weekly view on
    any day of the week. Tap Settings ⚙️ Calendar Start Week On, and then tap the
    day you want to start your week.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# FIGURE 7-2:

    What''s going on the week ahead?


    Ah, you may be wondering about the view on the Plus models, given their relatively-massive
    5.5-inch display. Indeed, Apple redesigned the Calendar app so you get a different
    view when you rotate the phone to its side. You''ll see tabs at the top of the
    screen for the day, week, month, and year, as shown in Figure 7-2

    (right). When you tap the Week tab, you indeed get a full-day view.


    # List view


    List view isn''t complicated. As you would expect, your calendar appointments
    are listed chronologically, as shown in Figure 7-3. If you have a lengthy list,
    drag up or down with your finger or flick to rapidly scroll through your appointments.
    If you''re looking for a specific calendar entry, you can search for appointments
    by typing the names, locations, or notes in the search box above your list of
    entries (or Spotlight to help you search). The search box becomes visible after
    you tap the search icon.


    Tap any of listings to get meeting or appointment details for that entry. If you
    tap a person''s birthday, you see his or her contact information. Sorry, but you
    just ran out of excuses for not sending a card at least. Tap the calendar + in
    the upper-right corner to add a new entry, described in detail in the next section.


    If you have an iPhone 6s, 6 Plus, 7, or 7 Plus, you can take advantage of the
    3D Touch feature. Gently tap a calendar listing to peek at the entry. Press harder
    to pop into the Event Details page for that listing.


    # FIGURE 7-3:

    The Calendar list view.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_135_0.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_135_1.png)


    TIP'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The iPhone can display the color-coding assigned in Calendar in OS X Mountain
    Lion, Mavericks, Yosemite, El Capitan, and macOS Sierra on a Mac, huh?


    If you''re a Mac user who uses Calendar, you can create multiple calendars and
    choose ones to sync with your phone (described in Chapter 3). What''s more, you
    can choose to display any or all of your calendars. You can also sync calendars
    with Microsoft Outlook on a Mac or versions of Microsoft Outlook dating all the
    way back to Outlook 2003 on a PC.


    # # Adding Calendar Entries


    In Chapter 3, you discover pretty much everything there is to know about syncing
    your iPhone, including calendar entries from your Windows machine (using the likes
    of Microsoft Outlook) or Mac (using Calendar, Microsoft Entorage, or Outlook).
    You can also add calendar entries from iCloud.


    In addition, any calendar entries in Facebook can automatically show up in the
    Calendar app. You''ll have to visit Settings, enter your username and password,
    and make sure the Facebook setting is turned on.


    In plenty of sincerities, you enter appointments on-the-fly. Adding appointments
    directly to your iPhone is:


    +   1. Find and tap the Calendar icon and launch the year, week, month, or day
    view.

    2. Tap the + icon in the upper-right corner of the screen.

    3. Tap the Title and Location fields in turn and enter as much (or as little)
    information as you feel necessary.

    4. To add a start time or end time (or both):'
