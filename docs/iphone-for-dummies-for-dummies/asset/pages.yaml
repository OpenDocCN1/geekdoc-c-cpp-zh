- pgno: 317
  md: '**Assistive touch:** Turn on this setting if you need to use an adaptive accessory
    such as a joystick because of difficulties touching the screen. When this setting
    is on, you can create your own custom gestures.


    **Touch accommodations:** You can change how the screen responds to touch in various
