- pgno: 59
  md: 'To access the search screen on an iPhone, swipe down from anywhere. To see
    Siri suggestions (for people to contact or apps you might want to use at the moment),
    as well as suggestions based on the time and your location (such as places to
    lunch, shop, or get gas), swipe from left to right from the Home or Lock screen
    to summon the today view.


    To actively search the main search screen you pull down from the top of the screen,
    like a window shade, enter your search query using the virtual keyboard. The iPhone
    starts spitting out results the moment you type a character, and the list grows
    as you type.


    The results are pretty damn thorough. Say you entered Bell as your search term,
    as shown in Figure 2-14. Contacts whose names contain Bell will show up, along
    with folks for companies named Bell. If your iTunes library has the song "One
    Last Bell to Answer" or music performed by Joshua Bell, those will show up. Same
    for third-party apps with the name and if Bell is mentioned in a note, a message,
    an event, and more will also appear. Tap any listing to jump to the contact, or
    app if you''re searching.


    You have some control over the type of search that Spotlight conducts. From the
    Home screen, tap Settings > General > Spotlight Search. Make sure the switch for
    each bundle or third-party app on the iPhone you like is flipped (so that green
    is showing). Tap to turn off the switch for any of these items that don''t want
    included in your search.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_59_0.png)


    # Notifications and the Today View


    When you stop to think about it, a smartphone is smart because of all the things
    it can communicate, from stock prices to social-networking friends.


    We already tell you that Apple split Notification Center and the today view. Don''t
    worry, both are readily accessible to deliver potentially important and


    Figure 2-14: Putting the spotlight on search.


    PART 1 Meet Your iPhone'
