  img_proc: true
- pgno: 36
  md: 'iPhones are available also from smaller regional carriers such as C Spire and
    U.S. Cellular.


    Three prerequisites for enjoying the iPhone have been in place since the original
    release and remain — at least for U.S. customers:


    +   - One, unless you''re already in the fold, there''s the aforementioned business
    of becoming an AT&T, Verizon, Sprint, or T-Mobile subscriber or a customer of
    any other company that subsequently sells the devices.

    - Two, you may have to free yourself from any wireless contract you''ve already
    entered into. by getting liberated and ironclad two-year contracts are disappearing
    in favor of installment pricing. Heck, your new wireless company may even pay
    any early termination fees due your carrier.


    A number of retailers will give you a credit for your iPhone that you can use
    trade toward a new model. The amount of the credit depends on the condition of
    the device. You must pay the phone over a set period, again typically two years.
    But unless you''re right up to the latest models.


    Under its trade-in program, Apple won''t give you cash for your old phone but
    will issue a gift card that you can use in the store. As of this writing, you
    can get a card valued up to $250 if you trade in an iPhone 6 Plus. You can even
    get a $50 gift card for trading in a new iPhone 4. Prices vary depending on the
    condition of the phone you''re trading in. Keep in mind that you may get cash
    or a better trade-deal elsewhere.


    Apple has its in-store upgrade program, based on a 24-month installment. As this
    book was going to press, you could get a 32GB iPhone 7 for $32.41, a 128GB model
    for $36.58, and a 256GB model for $40.75. Pricing for the 7 Plus under the Apple
    upgrade program is $37.41, $45.18, and $54,75, respectively. You get to choose
    your carrier. AppleCare warranty protection is included.


    +   - Make sure you download the freshest version of iTunes software for syncing
    with your PC or Mac. Apple doesn''t supply the software in the box, so go to www.apple.com
    if you need to fetch a copy, or launch your current version of iTunes and then
    choose iTunes> Check for Updates (Mac) or Help> Check for Updates (Windows).


    The uninitiated might not know that iTunes is the nifty jukebox software for iPod,
    iPad, PC, and Mac users to manage music, videos, and more. iTunes is at the core
    of the iPhone as well because it is what is called the Music app instead. You
    employ iTunes to synchronize a bunch of stuff on your computer and iPhone, including
