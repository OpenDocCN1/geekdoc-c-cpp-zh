  img_proc: true
- pgno: 304
  md: 'volume slider to determine the loudness of your ringer and alerts. Note that
    you can instead use the physical volume buttons on the side of the iPhone to change
    the volume of the ringer and alerts, as long as you''re not already on a call
    or using the iPhone to listen to music or video.


    # Happy haptics (iPhone 7 and 7 Plus)


    The iPhone 7 and 7 Plus have an especially large haptic engine, the Apple technology
    that produces the vibrations that lend tactile feedback when using your phone.
    Here''s where you can control what to receive feedback. On each device, tap Settings
    > Sounds & Haptics and scroll down to System Haptics. When this is enabled, the
    phone will play the various haptics for system controls and other interactions.
    Flip it off if you''d prefer otherwise.


    # Happy Home button (iPhone 7 and 7 Plus)


    The Home button on the iPhone 7 and 7 Plus is not a mechanical button at all rather
    a customizable solid-state-sensitive button that can deliver feedback via the
    aforementioned taptic engine. The button doesn''t physically move, but it makes
    you think that it does. And the Home button also course invokes Siri, multitasking,
    Touch ID, Apple Pay, and other functions.


    In Settings General on the 7 or 7 Plus, you''ll find a Home Button listing where
    you can sample one of three touch options. Tap one of the three circular buttons
    (labeled 1, 2, or 3) and then tap the actual Home button to see how the Home button
    feels under that option. Tap Done to apply the setting with which you are most
    comfortable.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_304_0.png)


    # Brightening up your day


    Who doesn''t want a bright, vibrant screen? Alas, the brightest screens excite
    a trade-off: Before you drag the brightness slider in Figure 14-7 to the max,
    remember that brighter screens save the life from your battery more quickly. You''ll
    find the brightness slider under the Display & Brightness setting.


    > FIGURE 14-7: Sliding this control adjusts screen brightness.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'We recommend tapping the Auto-Brightness switch so that it''s on. This control
    adjusts the screen according to the lighting conditions around the iPhone while
    being considerate of your battery. You can find a similar brightness slider in
    Control Center, but you''ll have to visit Settings to turn the Auto-Brightness
    switch on or off.


    If the app''re spending time in supports dynamic type, you can adjust your type
    size by dragging a slider. Under Display & Brightness, you''ll find a slider for
    making text bold. Back when you set up an iPhone 6 or later, you will have the
    option to choose the Display Zoom from a standard (normal-sized) view to a zoomed
    (larger) icon view that claims more on-screen real estate. If you''re not satisfied
    with your first choice, you can change it. You''ll have to reboot whenever you
    make such change.


    As of iOS 10, Apple added the Night Shift feature here in Settings. When enabled,
    the phone automatically alters the colors on your iPhone after dark so that they''re
    at the warmer end of the color spectrum. The promise is of better sleep. You can
    drag a slider to change the temperature to a warmer setting — give it a try to
    see which effect warms you up, or perhaps more to the point where we''re talking
    sleep, cools you down. You can manually turn on Night Shift so that it is enabled
    until the next day. Or you can schedule the hours when you use Night Shift to
    automatically kick in and cease.


    Settings for the Raise to Wake feature that we mentioned way back in Chapter 2
    are also found under the Display & Brightness setting. As with Night Shift, the
    feature arrived with iOS 10.


    # Auto-lock


    Under Display & Brightness, you will also find Auto-Lock settings, which used
    to be listed as a stand alone item under General settings. Its functionality is
    unchanged: You can set the amount of time that elapses before the phone automatically
    turns off the display. Your choices are 5 minutes, 4 minutes before, and down
    to 30 seconds. Or you can choose to have the iPhone never lock automatically.


    If you work for a company that insists on a passcode, the Never Auto-Lock option
    isn''t on the list when your iPhone shows you.


    Don''t worry if the iPhone is locked. You can still receive calls and text messages,
    adjust the volume, see notifications, access Control Center (if you made it here
    in Settings), take pictures, call upon Siri''s services, access the Wallet app
    and transfer through Apple Pay, and reply with a message when you can''t answer
    an incoming call.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Wallpaper


    Choosing wallpaper is a neat way to dress up the iPhone according to your taste.
    You can sample the patterns and designs that Apple has already chosen for you
    by tapping the thumbnails in Figure 14–8.


    Among your choices are colorful dynamic wallpapers with floating bubbles that
    add a subtle dizzying effect or live wallpapers that come when you press against
    the screen with 3D Touch. But stunning as they are, these images may not hold
    a candle to the masterpieces in your own photo albums, including your live photos
    (about those in Chapter 9). After making a selection, tap the image, and then
    Set. You can set wallpaper for the Home screen, the Lock screen, or by tapping
    the appropriate button. To have the same or different images.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_306_0.png)


    Figure 14–8: Choosing a masterpiece background.


    You can toggle Perspective Zoom on or off while setting wallpaper. This setting
    turns the motion effect on or off.


    # In General


    Certain miscellaneous settings are difficult to pigeonhole. Apple wisely lumped
    many of these under the General settings moniker. Figure 14–9 gives you a look
    at them, though not all the settings in this section are under General.


    # About About


    You aren''t seeing double. Within Settings is a setting called About, full of
    trivial (and not-so-trivial) information about the device, from the number of
    applications on the phone to its serial number.


