- pgno: 177
  md: 'By the way, Siri''s newfound song-identification prowess is powered by Shazam
    but doesn''t require you to install the Shazam app. That said, we like all the
    other bells and whistles that the Shazam app brings to the party enough that we
    still recommend it in Chapter 17.


    # Shopping with the iTunes Store app


    Last but certainly not least, the iTunes Store app lets you use your iPhone to
    download, buy, or rent just about anything you can download, buy, or rent with
    the iTunes application on your Mac or PC, including music, audiobooks, and videos.
    And, if you''re fortunate enough to have an iTunes gift card or gift certificate
    in hand, you can redeem it directly from your iPhone.


    If you want to do any of those tasks, you must first sign in to your iTunes Store
    account. Tap Settings > > iTunes & App Store > Sign In. Type your username and
    password, and then tap OK. Or, in the unlikely event that you don''t have an iTunes
    Store account, tap Settings > > iTunes & App Store > Create New Account, and follow
    the on-screen instructions.


    After the iTunes Store knows who you are (and, more importantly, knows your credit
    card number, gift card balance, or PayPal info), tap the iTunes Store icon on
    your Home screen and shop until you drop.'
