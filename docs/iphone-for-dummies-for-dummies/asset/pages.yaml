- pgno: 64
  md: '# Chapter 3


    # # Synchronicity: Getting Stuff to and from Your iPhone


    After you pass basic training (in Chapter 2), the next thing you''re likely to
    want is to get some or all of the following into your iPhone: contacts, appointments,
    events, bookmarks, ringtones, music, movies, TV shows, podcasts, books, courseware,
    photos, documents, and applications.


    We have good news and ... more good news. The good news is that you can easily
    copy any or all of those items from your computer to your iPhone. And the more
    good news is that after you do that, you can synchronize your contacts, appointments,
    reminders, and events so they''re kept up-to-date automatically everywhere where
    on your computer, iPhone, iPad, or iPod. When you add or change a contact, an
    appointment, a reminder, or even on your iPhone, that information is automatically
    added or changed on your computer and other devices.


    This communication between your iPhone, computer, and other devices is called
    syncing (short for synchronization). Don''t worry: Syncing is easy and you will
    find out how it works in this very chapter.


    +   - Syncing iPhone with iTunes

    - Syncing contacts and calendars

    - Syncing everything else'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Here''s even more good news: You can set up and use an iPhone PC-free, means
    you never have to connect it to a computer or sync with iTunes if you prefer not
    to. You discover how to sync with and without connecting your iPhone to a computer
    in this chapter. Please bear in mind that certain tasks — such as rearranging
    the icons on your Home screens and managing music, movies, and pictures — are
    much easier a computer than on the iPhone''s smaller screen. Finally, some tasks,
    such as changing the order of the Home screens on your iPhone, are possible only
    by using iTunes on a computer.


    The information in this chapter is based on iTunes version 12.5 and iOS version
    10, the latest and when these words were written. If your screens don''t look
    exactly like ours, you might need to upgrade to iOS 12.5 or higher (choose iTunes
    > Check for Updates) or to iOS 10 or higher (on your iPhone, tap Settings > General  >
    Software Update), or both. The iTunes and iOS upgrades are free and offer features
    not found in their predecessors.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_65_0.png)


    You start this chapter with an introduction to iCloud, Apple''s free wireless
    storage and synchronization solution (which, by the way, is better than in iOS
    10), and find out how it makes your iPhone more convenient. Then you get to the
    heart of this chapter: syncing.


    One thing: if your iPhone is brand-new sparking and pushes out of the box, go
    to www.dummies.com/how-to/content/setting-up-a-new-iphone.html for a walk-through
    on the phone''s initial setup.


    # # A Brief iCloud Primer


