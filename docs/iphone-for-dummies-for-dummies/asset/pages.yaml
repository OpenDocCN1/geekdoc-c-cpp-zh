- pgno: 275
  md: '+   - Get turn-by-turn directions for driving or walking from any address to
    any other address.


    +   - See real-time traffic information for most urban locations.


    The biggest difference between the two apps is that Google Maps app offers information
    about traveling via public transportation for most major cities. And although
    Apple-powered Maps app has been upgraded and steadily improved since its intro
    and now offers info on public transportation (and good info at that), the info
    is available only for relatively large cities at present.


    The free Google Maps app is available in the iTunes App Store, with directions
    for public transportation in more cities than the Apple Maps app. We keep both
    apps on our iPhones; you might want to do so as well.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_275_0.png)


    Maps in iOS 10 contains several useful features. First, the application has been
