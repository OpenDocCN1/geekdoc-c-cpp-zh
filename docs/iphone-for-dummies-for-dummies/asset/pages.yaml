    When you tap a mailbox to open it, Mail fetches the most recent messages. Tap
    a message to read it. When a message is on the screen, icons for managing messages
    appear below it. These controls are addressed in the next section.


    Meanwhile, swipe down to refresh a mailbox. You will momentarily see a spinning
    gear until the mail is satisfied that all the emails that can be delivered have
    been delivered. (Obviously, you''ll need an Internet connection to receive new
    mail.)


