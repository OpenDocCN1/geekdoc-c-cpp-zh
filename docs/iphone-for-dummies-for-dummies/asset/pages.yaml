    explain the zoom distinctions in Chapter 9.


    # 5. When you’re finished, tap the shutter icon to start recording.


    Your video is automatically saved to the Camera or All Photos album, alongside
    any saved videos and still pictures.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_218_0.png)


    You can tap the flash to shine an LED light when you record video. And, as taking
    digital stills, you can switch from the front to the rear camera before starting
    to shoot video. But you can’t switch from front to back camera when you’re capturing
    video. Remember that the flash is only available with the rear camera.


    You can switch frame rates. Go to Settings > Photos & Camera > Record Video and
    choose 720p HD at 30 FPS, 1080p HD at 60 FPS, or 1080p HD at 30 FPS. The last
    listing is the default because higher-quality 60 FPS videos devour storage space
    faster than 30 FPS. Stick to 30 FPS if you’re on low light or want to shoot longer
    videos.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_218_1.png)


    Speaking of taking up space, the iPhone 6s, 6s Plus, SE, and 7 are capable of
    shooting 4K video with a resolution of 3840 x 2160. That’s four times the resolution
    of 1080p HD video, so we’re talking about video with incredible detail.


    Thus, you will see an option in Settings to make Apple decided not to make 4K
    video a default setting for two reasons. Relatively few people of us have writing
    any way to play back 4K video. Second, 4K video consumes space and lots of, approximately
    350MB for one minute of video.


    On the iPhone 7 Plus, you can also lock the camera lenses so that you’re not-automatically
    switching between them when recording video. To make this happen, go to Settings
    > Photos & Camera > Record Video and enable the Lock Camera Lens switch.


    When you decide to shoot in 4K, you’ll see a 4K indicator in the Camera in the
