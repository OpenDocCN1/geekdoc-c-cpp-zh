- pgno: 18
  md: '# IN THIS CHAPTER

    >> Looking at the big picture

    >> Touring the outside of the iPhone

    >> Checking out the iPhone''s apps


    # Chapter 1

    Unveiling the iPhone


    Congratulations. You''ve selected one of the most incredible handheld devices
    we''ve ever seen. Of course, the iPhone is one heck of a wireless telephone, but
    it''s actually four handheld devices in one. At least it''s four devices right
    out of the box. Add some iPhone apps, and your iPhone becomes a PDA, an e-book
    reader, a handheld gaming device, a memory jogger, an exercise assistant, and
    ever so much more. We discuss optional apps—how to install, add and delete them—through
    the book and particularly in Chapters 15, 17, and 18.


    Now, we focus on the four awesome handheld devices your iPhone is the day you
    take out of the box. In addition to being an excellent cellular phone, the iPhone
    is a gorgeous widescreen video player, a fantastic 8- or 12-megapixel camera/camcorder,
    as well as a tiny-yet-powerful Internet communications device.


    In this chapter, we offer a gentle introduction to four devices that make up your
    iPhone, plus overviews of its revolutionary hardware and software features.


    # The Big Picture


    The iPhone has best-of-class features, but perhaps its most unusual feature is
    the lack of a physical keyboard or stylus. Instead, it is a super-high-resolution
    (326 pixels per inch) for all Plus Models, touchscreen that you operate using
    a pointing device you''re already intimately familiar with: your finger.


    CHAPTER 1 Unveiling the iPhone 7'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# WHAT''S IN THE BOX?


    Somehow we think you''ve already opened the elegant box that the iPhone came in.
    But if you didn''t, here''s what you can expect to find inside:


    +   - EarPods: Use them for music, videos, and, yes, phone calls. iPhone 7 and
    7 PlusPods have a Lightning connector; all other models have standard 3.5mm headplugs.

    - Lightning-to-USB cable: Use this handy cable to sync or charge your iPhone.
    You can plug the USB connector into your PC or Macintosh to sync or the included
    USB power adapter. By the way, if you prefer to have your iPhone standing up on
    your desk while you sync or charge it, as we do, check out one of the charging/syncing
    docks from Apple and others.

    - USB power adapter: Use this adapter to recharge your iPhone from a standard
    AC outlet.

    - Some Apple logo decals: Of course.

    - A quick start guide: Not to use it. You see the names of the buttons; how to
    turn on the phone; and where to learn more and get support. We save you time of
    looking; you can learn more at http://www.apple.com/iphone and get help at www.apple.com/support/iphone.
    You''re welcome.

    - iPhone info sheet: Here where you find safety warnings, legality, warranty information,
    and regulatory compliance gobbledook, other things.

    - SIM eject tool: Just kidding. Apple once a SIM eject tool in the box but in
    many years. Now — just use a straightened paper clip or safety pin if you need
    to remove your SIM card. (See Chapter 16 for more on the SIM card.)

    - iPhone: You were starting to worry. Yes, the iPhone itself is in the box.


    And what a display it is. We venture that you''ve never seen a more beautiful
    scene on a handheld device in your life.

    The accelerometer detects when you rotate the device from portrait to landscape
    mode and adjusts what''s on the display accordingly.


    The iPhone''s built-in also still knock your socks off. A proximity sensor detects
    when the iPhone gets near your face, so it can turn off the display to save power
    and prevent touches by your cheek. A light sensor adjusts the display''s brightness
    in response to the current ambient lighting situation. The iPhone even has a gyro-scope
    for advanced motion sensing and GPS sensors so your phone can determine where
    in the world you are. Our favorite example of motion sensing is that our iPhones
    rarely ask if we want to join a Wi-Fi network when we''re in a moving car. That''s
    smart smartphone.


    PART 1  Meet Your iPhone'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'In this section, we take a brief look at some of the iPhone''s features, broken
    down by product category.


    # The iPhone as a phone and a digital camera or a camcorder


    On the phone side, the iPhone synchronizes with the contacts and events on your
    Mac or PC, as well as contacts and events on iCloud, Google, Yahoo!, and Facebook.
    It includes a full-featured QWERTY soft, or virtual, keyboard, makes typing text
    easier than ever before — for some folks. Granted, the virtual keyboard takes
    a bit of time to get used to. But we think that many of you eventually be whizzing
    along at a much faster pace than you thought possible on a mobile keyboard of
    this type.


    The 12-megapixel camera (iPhone 6s and newer) is paired with iOS 10''s improved
    Camera and Photos apps, so taking and managing digital photos and videos on your
    iPhone is a pleasure rather the nightmare it can be on others. Plus, you can automatically
    synchronize iPhone photos and videos with the digital photo library on your Mac
    or PC.


    The iPhone 6s Plus has better cameras than the iPhone SE or iPhone 6s, and the
    iPhone 7 models have the best cameras yet. Of course, both iPhone 7 models include
    all the features of the previous generation (iPhone 6s and Plus camera), including
    autofocus with focus pixels to prevent out-of-focus pictures. The 6 Plus and both
    iPhone 7 models have one of the coolest features we''ve seen on any camera-a-phone:
    optical image stabilization, which uses data from the processor, gyroscope, and
    motion processor to determine camera motion when you''re shooting. It then provides
    lens movement to compensate for your shaky hands or low light. The iPhone 7 models
    shoot better low–light photos than we''ve seen from any previous iPhone, and the
    iPhone 7 Plus, with two lenses and true optical zoom, shoots the best pictures
    and videos.


    Finally, don''t miss the Live Photos feature (all iPhone models), which captures
    a bit of video before and after the still image. This brings images to life when
    viewed and may be the coolest iPhone camera feature since, well last year''s optical
    image stabilization.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_20_0.png)


    Before iOS 10, if you chose to edit a live photo with the Photos app, you destroyed
    its "liveness" and turned it into a still image. With iOS 10, you can edit and
    adjust photos without turning them into stills. Yeah!


    Another of our favorite phone accouterments is visual voicemail. (Try saying that
    three times fast.) This feature lets you see a list of voicemail messages and
    choose


    CHAPTER 1 Unveiling the iPhone 9'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'which ones to listen to or delete without being forced to deal with every message
    in your voice mailbox in sequential order. Now, that''s handy!


    Finally, all iPhone models include Siri, an intelligent voice-controlled assistant
    that understands what you tell him or her (most of the time). We say "him or her"
    because you can (since iOS 7) choose the optional voice for Siri (Chapter 5).
    Regardless of which gender you choose, Siri can figure out what you mean and determine
    (if any) iPhone app should be used to find the right answer. And, like a real
    personal assistant, Siri replies in a natural sounding voice. Furthermore, he
    or she has become smarter in iOS 10 with "proactive assistance," which provides
    the most relevant information and suggestions at a particular moment. One last
    thing: Both flavors — male and female — take dictation!


    If you''ve tried control before, forget everything you''ve learned and give Siri
    a try. You''ll be as impressed as we are (as long as you have a good Internet
    connection when you try it — Siri can be close to useless if your connection is
    slow) — and in a relatively quiet environment.


    We''ve mentioned the highlights of the iPhone''s superb set of features. Because
    we still have the entire book ahead of us, we''ll put the extended coverage on
    hold for now (pun intended).


    # The iPhone as an iPod


    We agree with the late Steve Jobs on this one: The iPhone is a better iPod than
    any iPod Apple has ever made. (Okay, we can quibble about the iPod touch and the
    iPad, as well as wanting more storage — you know what we mean). You can enjoy
    all your existing iPod media — music, audiobooks, audio and video podcasts, iTunes
    U, music videos, television shows and movies — on the iPhone''s gorgeous high-resolution
    color display, which is bigger, brighter, and richer than any iPod display before.


    Bottom line: If you can get the content — be it video, audio, or whatever — into
    iTunes on your Mac or PC, you can synchronize it and watch or listen to on your
    iPhone.


    # The iPhone as an Internet communications device


    But wait — there''s more! Not only is the iPhone a great phone and a stellar player,
    but it''s also a full-featured Internet communications device with — we''re'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'about to drop a bit of industry jargon on you — a rich HTML email client''s
    compatible with most POP and IMAP mail services, with support for Microsoft ExchangeSync.
    (For more on this topic, see Chapter 12.) Also on board is Safari, a world-class
    web browser, that lives on most other phones, makes surfing fun and easy.


    Another cool Internet feature is Maps. By using GPS, Maps can determine your location,
    let you view maps and satellite imagery, obtain directions and traffic information
    for much of the United States. You can find businesses as gas stations, pizza
    joints, hospitals, and Apple Stores with just a few taps. And iOS 10 adds information
    on public transit for even more cities. Finally, the Compass app not only displays
    your current GPS coordinates but also orients Maps to show the direction you''re
    facing.


    You might also enjoy using Stocks, an included app that delivers real-time stock
    quotes and charts any any place, or Weather, another included app that obtains
    and displays the weather forecast for as many cities as you like.


    The Internet experience on an iPhone is far superior to the Internet experience
    on any other handheld device we''ve seen, except the iPad. (Technically, we''d
    call a full-sized iPad a “two-hands-held device” because it''s difficult to hold
    in one hand for more than a few minutes. But we agree.)


    # Technical specifications


    One last thing before we proceed. Here''s a list of everything you need before
    you can use your iPhone:


    +   * An iPhone

    * In the States, a wireless contract with AT&T, Verizon, Sprint, one of the smaller
    carriers, such as C Spire or Cricket, or a contract-free T-Mobile or other service

    * An Apple ID

    * Internet access (required) — broadband wireless Internet access recommended


    In addition, think you''ll find that some tasks are easier and faster if you perform
    them on a computer using iTunes instead of your iPhone''s much smaller screen
    — although you don''t technically need a computer to use your iPhone. And some
    tasks, such as reordering Home screens, can only be accomplished in iTunes on
    a computer.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'If you decide to introduce your iPhone to your computer (and we recommend for
    anyone who has a computer), here''s what''s required for syncing with iTunes:


    +   - For Macs: A Mac with a USB 2.0 or 3.0 port, OS X10.9 or later, and iTunes

    12.5 or later


    +   - For Windows: A PC with a USB 2.0 or 3.0 port; Windows 7 or later; and iTunes

    12.5 or later (free download at www.itunes.com/download)


    # A Quick Tour Outside


    The iPhone is a harmonious combination of hardware and software. In this section,
    we take a brief look at what''s on the outside. In the next section, we peek at
    the software.


    # On the top and side


    The top of iPhone 6 and 7 models is as smooth as a baby''s bottom, as shown in
    Figure 1–1. If you have one of the iPhone 6 models, your sleep/wake button is
    on the side. For all models, the SIM card tray is on one side, and the ring/silent
    switch and volume buttons are on the other side. We describe these elements fully
    in the following list:


    +   - Microphone: Used for FaceTime calls and noise suppression during phone calls.


    +   - SIM card tray: The SIM card tray is where you remove or replace the SIM
    card inside your iPhone.


    A SIM (Subscriber Identity Module) card is a removable smart card used to identify
    mobile phones. Users can change phones by moving the SIM card from one to another
    — kind of. The iPhone uses a nano-SIM.


    +   - Sleep/wake button: This button is used to lock or unlock your iPhone and
    to turn your iPhone on or off. When iPhone is locked, you can still receive calls
    and messages, but nothing happens if you touch your screen. When your iPhone is
    turned off, all incoming calls go directly to voicemail.


    +   - Ring/silent switch: This switch, which is on the left side of your iPhone,
    lets you quickly swap ring mode and silent mode. When the switch is set to ring
