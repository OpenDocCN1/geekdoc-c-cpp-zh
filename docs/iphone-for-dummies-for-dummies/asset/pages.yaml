    # Share and share alike


    One of our favorite features on the iPhone has always been Home Sharing, which
    lets you use your iPhone to stream music, movies, TV shows, and other media content
    from the iTunes library on your Mac or PC.


    Then there''s Family Sharing, which lets you share purchases from iTunes, eBooks,
    and the App Store with up to six people in your family without having to share
    account information. Now you can pay for family purchases with the credit card
    and approve kids'' spending right from your iPhone or iPad. Here''s the scoop
    on types of sharing: Home and Family.


    # Home Sharing


    Turn on Home Sharing to stream music, movies, TV shows, and other media from your
    computer to your iPhone. The big gotcha is that Home Sharing is available only
    if your iPhone and your computer are on the same Wi-Fi network and use the same
    Apple ID.


    To make Home Sharing work for you, first enable it on your computer, and enable
    it on your iPhone. To set up Home Sharing on your computer, launch iTunes and
    choose File > Turn on Home Sharing. Type your Apple ID and password in the appropriate
    fields and click the Turn On Home Sharing button. From now on, or as long as iTunes
    is open, your iTunes library will be available for Home Sharing on your Wi-Fi
    network.


    To enable Home Sharing on your iPhone, tap Library at the bottom of the screen
    and scroll down and tap Home Sharing. If shared libraries are available, you''ll
    see one or more to view your contents on your iPhone for long as you''re connected
    to this Wi-Fi network.


    Here''s where it gets cool: Now, when you look at your library, rather than just
    seeing the playlists, artists, and songs you synced with your iPhone (and your
    Apple Music), you''ll also see all the playlists, artists, songs, albums, and
    everything else in the iTunes libraries on the Home Sharing computers as well.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'And you''ll continue to see the shared content in your Music app as long as
    your iPhone remains connected to this Wi-Fi network.


    To switch back to seeing just music, reverse the process and disable Home Sharing
    on your iPhone.


    Movies and TV shows shared via Home Sharing don''t appear in the Music app. Look
    for them in the Videos app, as described in Chapter 10.


    Home Sharing is simple, elegant, and free. If you''ve never used this feature,
    what are you waiting for?


    # Family Sharing feature


    Family Sharing lets up to six members of the same family share everything they
    buy at the iTunes, iBooks, and App Stores. It also provides sharing of family
    photos and a family calendar, location sharing, and more. Finally, if you have
    a family subscription to Apple Music, up to five additional members can use Apple
    Music at no additional cost.


    To set up Family Sharing, one adult in the household (known as the family organizer)
    invites you to five family members to join and pay for all iTunes, iBooks, and
    App Store purchases those family members initiate part of Family Sharing.


    When any family member buys an app, a song, album, a movie, or an eBook, it is
    billed directly to the family organizer''s account and shared with the rest of
    the family. The organizer can Ask to Buy for any family member to approve for
    any purchase. When a purchase is initiated, a notification is sent to the family
    organizer, who can review the item and approve or decline the request from his
    or her iPhone.


    The fine print says: You can be part of only one family group at a time and switch
    to a different family group twice per year. The features of Family Sharing may
    vary based on country and content eligibility.


    To become the family organizer, open Settings on your iPhone, tap iCloud, and
    then Set Up Family Sharing.


    After you enable Family Sharing and invite your family members to join, everyone
    will have immediate access to other members'' music, movies, TV shows, books,
    and apps, so you can download whatever you want to your iPhone with a any time
    you like without having to share an Apple ID or password.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Taking Control of Your Tunes


    Now that you have the basics down, take a look at some other things you can do
    with the Music app, starting with the controls you see when a song is playing.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_171_0.png)


    If you don''t see the controls when a song is playing, tap the song name near
    the bottom of the screen.


    Now, here''s how to use those controls:


    +   **Back icon**: Tap to return to whichever list you used last — Playlists,
    Artists, Songs, and so on.


    +   **Scrubber bar**: Drag the little gray dot (the playhead) along the scrubber
    bar to skip to any point within the song. Note that the playhead is roughly one-third
    of the way into it in Figure 8-4, which means the person has heard roughly one-third
    of the song so far.


    +   **Time elapsed and remaining**: Just below the scrubber bar on the left is
    the amount of time this song has already played (0:43 in Figure 8-4) and how much
    of this song remains to be played (1:54 in the figure).


    +   **Restart/previous track/rewind**: Tap once to go to the beginning of the
    track. Tap twice to go to the start of the preceding track in the list. Touch
    and hold down to rewind the song at double speed.


    +   **Play/pause icon**: Tap to play or pause the song.


    +   **Next track/forward icon**: Tap to skip to the next track in the list. Touch
    and hold down it to fast-forward through the song at double speed.


    +   **Volume control**: Drag the little dot left or right to reduce or increase,
    respectively, the volume level.


    +   **AirPlay selector**: You may not see the AirPlay selector icon (shown in
    the margin) in Center on your iPhone (visible in Figure 8-4). AirPlay lets you
    stream content wirelessly over Wi-Fi from your iPhone to AirPlay-enabled device.
    Check out the “Playing with AirPlay” sidebar for details.


    +   **Share button**: Tap to share this song with others via AirDrop, Message,
    Mail, Twitter, Facebook, or any of the other options in your iOS 10 Share sheet.


    +   **Shuffle function**: Tap once to shuffle songs and play them in random order.
    The button turns dark gray when shuffling is enabled. Tap again to play songs
    in order again. The button goes back to its original color — light gray.


    You can also shuffle tracks in any list of songs — such as playlists or albums
    — by tapping Shuffle, which appears at the top of the list.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_171_1.png)


    160 PART 3 The Multimedia iPhone'
  merge: -1
  img_proc: true
