  md: 'The free version of Shazam offers unlimited tagging but also displays lots
    of ads. If that works for you, you''re all set. But if you''re like us, prefer
    Shazam Encore, which eliminates the ads and has several exclusive features, including
    premium recommendations.


    We''ve tried other apps that come to do as good Shazam, but we''ve yet to find
    one as good (free) or Shazam Encore ($6.99). It has worked for us in noisy airport
    terminals, crowded shopping malls, and even once at a wedding ceremony.


    # # TurboScan


    If you travel for work, your pockets are probably littered with business cards,
    expense receipts, notes, pictures, and documents. If you could only carry a scanner
    in your pocket to get that photo into some sense of order.


    Stop dreaming. TurboScan turns your iPhone into one.


    If you''ve read previous versions of this book you may remember that we listed
    TurboScan in the very next chapter on favorite paid apps. And there is a paid
    version of TurboScan called TurboScan Pro, which costs $4.99.


    But TurboScan itself is free, and when we asked the app''s producer Piksoft what
    the differences are between the free and paid versions — it isn''t we were told
    that such differences are “very minor."


    Thus, you now find Piksoft''s app here.


    TurboScan lets scan and spit out high-quality PDFs. It is fast — processing a
    page in less than four seconds — and can detect paper edges to help improve accuracy.
    And by tapping the 3x button, shown in Figure 17-3, you can take three pictures
    of the same document image, a feature Piksoft calls SureScan. You can process
    scans in color or black-and-white.


    After you''ve scanned a document, you can choose a name, an appropriate size (such
    as US letter, receipt, or business card), and add a datestamp. You can email the
    document to yourself as a PDF or a JPEG, print it, or save it to


