  md: '# About the Authors


    Edward C. Baig writes the Personal Technology column in USA TODAY and makes regular
    video appearances on the web and TV. Ed is also the author of Mac For Dummies,
    10th Edition, and cowriter (with Bob LeVitus) of iPad For Dummies. Before joining
    USA TODAY as a columnist and reporter in 1999, Ed was on the editorial staff at
    Business Week, U.S. News & World Report, and Fortune magazine.


    Bob LeVitus, often referred to as “Dr. Mac,” has written or rewritten nearly 80
    popular books, selling millions of copies worldwide. His most recent includes
    iPad For Dummies and macOS Sierra For Dummies for John Wiley & Sons, Inc. In addition
    to books, Bob has penned the popular “Dr. Mac” column in the Houston Chronicle
    for 20 years and has written for pretty every magazine that has ever used the
    word Mac in its title.


    # Dedications


    I dedicate this book to my beautiful and amazingly supportive wife, Janie, and
    to my incredible kids: daughter Sydney, son Samuel, and canine Sadie. The book
    is also written in the memory of my “doggie son,” Eddie, Jr., and my mom and dad,
    Lucille and Sam. I love you all.


    > — Ed Baig


    As always, this book is dedicated to the best wife in the world, mine. Lisa Satenspiel
    LeVitus has taught me pretty much everything I know pretty much everything I know
    other than technology and has put up with me for over 30 years. And, as always,
    I dedicate this book also to my adult/kids, Allison and Jacob, who love their
    iPhones almost as much as I love them.


    > — Bob LeVitus'
