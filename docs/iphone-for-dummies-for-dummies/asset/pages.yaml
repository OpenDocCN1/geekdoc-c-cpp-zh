    +   9. If you want to set a reminder or an alert for the entry, tap Alert and
    choose a time.


    Alerts can be set to arrive at the actual time of an entry, or 1 week before,
    2 days before, 1 day before, 1 hour before, 30 minutes before, 15 minutes before,
    or 5 minutes before the event. If it''s an all-day entry, you can request alerts
