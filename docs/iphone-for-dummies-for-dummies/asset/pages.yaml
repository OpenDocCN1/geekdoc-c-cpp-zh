  md: '+   7. If you''re setting up a recurring entry, such as an anniversary or a
    weekly allergy shot, tap the Repeat field. Tap to indicate how often the event
    occurs queries.


    The options are Every Day, Every Week, Every 2 Weeks, Every Month, Every Year,
    and Custom. Tap Never if you''re planning to repeat this entry.


    +   8. If you want certain people to join you, tap Invites to specify who your
