  md: '# Viewing open pages on other devices


    Apple includes a helpful feature called iCloud Tabs that lets you venture into
    cyberspace to look at web pages on your other iOS devices and computers.


    You get to iCloud Tabs by tapping the pages icon and scrolling all the way to
    the bottom, past the carousel of cool-looking 3D tabs. You''ll then see your list
    of open links, segregated by device, as shown in Figure 11-7. Tap any listing
    to access that page on your phone.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_237_0.png)


    When in the Pages view, tap Done to return to the last page you were looking at
    by tapping the pages icon. Tap instead to return to the icons representing your
    bookmarks and frequently visited pages. Tap Private to close all your existing
    pages before turning on private browsing, which we get to later in this chapter.


    If for some reason you don''t see iCloud Tabs after tapping the pages icon, head
    to Settings, tap iCloud, and make sure the option for Safari is turned on.


    Through the Continuity and Handoff features baked into iOS 8 and later, you can
    now browse a page on your iPad or Mac with OS Yosemite, OS El Capitan, or macOS
    Sierra, and resume from the same link on your iPhone. Each machine or device must
    be signed into the iCloud account.


    # Letting history repeat itself


    Sometimes, you want to revisit a site that you bookmarked, but you can''t remember
    the darn destination or where you left in the first place. Good thing you can
    study the history books.


    Safari records the pages you visit and keeps the logs on for several days. Tap
    the bookmarks icon, tap History (likely second down on the list), and then tap
    the day you think hung out at the site. You will see web pages segregated into
    categories as This Evening, This Afternoon, and Tuesday Morning. When you find
    the listing, tap it. You''re about to make your triumphant return.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'To clear your history — nobody else can trace your steps — and just is it you''re
    hiding? — tap Clear at the bottom right of the screen. You can clear your history
    for the last hour, for the day you''re looking at, for the day you''re looking
    at plus the day before, or all time.


    Alternatively, on the Home page, tap Settings > Safari > Clear History and Website-Data.
    In both instances, per usual, you may have to check out without wiping the slate
    clean.


    Folks browsing the web on their iPhones using their employer''s Wi-Fi network
    shouldn''t have a false sense of security. Your bosses will still have a history
    of every website you have visited, even if you clear your history.


    # Launching a mobile search mission


    Most of us spend a lot of time using search engines on the Internet. And the search
    engines we use most often are Google, Yahoo!, and Microsoft Bing, at least in
    the United States. If you''re in China, changes as you search Bing. In any event,
    these search options are available on the iPhone, is another resource called DuckDuckGo,
    a search engine that claims not to track you. We''ll take DuckDuckGo at your word,
    and assume that the claim is all it''s quacked up (sorry, we couldn''t resist).


    Although you can certainly use the virtual keyboard to type google.com, yahoo.com,
    or bing.com into the smart search field, Apple doesn''t require tedious effort.
    Instead, just type your search query directly in the box.


    In Settings, you can also enable Search Engine Suggestions that you can browse
    and search from the aforementioned smart field.


    When you want to conduct a web search on the iPhone, tap the smart search field.
    You immediately see icons for your favorite web destinations, with Apple betting
    on your frequent returns. When you start typing in the smart search field, a Google
    (or other) search mission commences, with a Top Hit''s — an educated guess reply
    — shown at the top. Apple bases on your bookmarks and browsing history.


    You other see search suggestions as you tapping additional letters. In Figure
    11–8, for example, typing the letters le yields suggestions as Lee Daniels'' The
    Butler and Leon James. Tap any search results that look promising, or Go on the
    keyboard to immediately land on the Top Hit. Or keep tapping letters to generate
    more search results.


    As you can see in Figure 11–8, any Bookmarks and History results are also shown.
    On This Page matches may be displayed (though you may have to scroll down to see
    them).'
