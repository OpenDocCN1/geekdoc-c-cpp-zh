    protected by Apple''s digital rights management copy protection. GarageBand won''t
    let you drag a song onto its timeline.


    Apple stopped copy protection for music files in 2009. If you purchased the song
    before that, you''re good to go. If you pay a small upgrade fee (30c at press
    time) to convert the song to iTunes Plus, Apple''s higher-quality, non-copy-protected
    format.


    The bottom line is that you can make ringtones only from songs you''ve ripped
    from CD or downloaded without rights management or other copy protection (such
    as MP3s from files in Apple''s iTunes Plus format) — or sounds you record yourself
    on your iPhone or computer.


