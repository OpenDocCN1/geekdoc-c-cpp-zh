  md: '# Get traffic info in real time


    You can find out the traffic conditions for whatever map you''re viewing by tapping
    i-in-a-circle in the lower-right corner and then tapping the Show Traffic. When
    you do this, major roadways are color-coded to inform you of the current traffic
    speed, as shown in Figure 13–8.


    Here''s the key to these colors:


    +   ** Green:** More than 50 miles per hour

    ** Orange:** 25 to 50 miles per hour

    ** Red:** Under 25 miles per hour

    ** Gray:** No data available at this time


    Traffic info isn''t available in every location, but the only way to find out
    is to give it a try. You might have to zoom in to see the color codes; if they
    don''t appear, assume that traffic information doesn''t work for that particular
    location.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_284_0.png)


    > WARNING


    # Do more on the Info screen


    If a location bubble has a > to the right of the location name (refer to Figure
    13–2), you can tap the bubble to see the Info screen.


    As we explain in this chapter, you can get directions to or from that location,
    add the location to your bookmarks or contacts, or create a contact from it. But
    wait! There''s more. From a location''s Info screen, you can


    +   Tap the phone number to call the location.

    Tap the email address to launch the Mail app and send an email to the location.

    Tap the URL to launch Safari and view the location''s website.


    If your iPhone has 3D Touch, you can press almost any identified location on the
    map—be a landmark, a restaurant, a store, a park, or whatever—and choose Directions,
    Call, Open Homepage, or Share Location from the Quick Actions list.


