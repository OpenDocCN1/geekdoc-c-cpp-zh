  md: '# Settings for sending email


    You can customize the mail you send and receive in lots of ways. In this section,
    we explore settings for sending email. Later in this chapter, we show you settings
    that affect the mail you receive and read messages. In each instance, you start
    by tapping Settings on the Home screen. Then:


    +   To hear an alert when you successfully send a message: Tap the Sounds option
    on the main Settings screen to choose what the Sent Mail alert sounds like, from
    a Suspense to Swoosh (the default). If you want to change other settings, tap
    the Settings button in the upper-left corner of the screen. If you''re finished
    setting settings, press the Home button on the front of your iPhone.


    The instructions in the preceding paragraph are similar for all the settings we
    discuss in this section and later sections, so we won''t repeat them. To summarize,
    if you want to continue using settings, tap whatever button appears in the upper-left
    corner of the screen — it might be that upper-left button always returns to the
    preceding screen so that you can change other settings. The same concept applies
    to pressing the Home button on the front of your iPhone when you''re finished
    setting a setting. That always saves the change you made and returns you to the
    Home screen.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_268_0.png)


    REMEMBER


    +   To add a signature line, or block of text to every email message you send:
    Settings Mail > Signature (You may need to scroll down to see the Signature option).
    The default signature is Sent from my iPhone. You can add text before or after,
    delete it or type something, keeping your signature no longer than four lines
    if you want to follow the unwritten rules of netiquette. Your signature is now
    affixed to the end of your outgoing email. You can also assign signatures to each
    of your mail accounts, a useful feature if you use one account for professional
    purposes, and another account for more personal staff.


    +   To have your iPhone send you a copy of every message you send: Settings Mail,
    and then turn on the Always Bcc Myself setting.


    +   To mark addresses not associated with a particular email domain: Tap Settings
    Mark Addresses and enter the domain name you have in mind, very likely the domain
    name of the company you work for. Whenever you send email to a recipient who doesn''t
    work for the same employer, that person''s name or address will show up in the
    Field in red (as opposed to gray for the people who work at the same place). Marking
    addresses in this way could help warn you before dispatch confidential or incriminating
    mail to people who are not meant to see such messages.'
  merge: -1
  img_proc: true
