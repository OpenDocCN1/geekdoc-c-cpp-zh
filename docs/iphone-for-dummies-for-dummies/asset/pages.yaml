  md: '# 4. (Optional) You can exploit the iPhone’s pinch to zoom capabilities to
    move closer to the subject.


    On the 7 Plus, you can exploit the dual cameras on the rear and tap the screen
    to go from 1x to 2x using the optical zoom feature. Or you can pinch to zoom or
