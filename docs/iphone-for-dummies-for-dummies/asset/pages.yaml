    multitasking. But you can set up the iPhone so triple-pressing the button (pressing
    three times really fast) turns on certain Accessibility features. By doing so,
    you can turn on or off VoiceOver, Invert Colors, Color Filters, Reduce White Point,
    Zoom, Switch Control, and AssistiveTouch.


    **3D Touch:** Throughout this book, we discuss the benefits of 3D Touch, the multitouch
    added to recent models. Under this setting, you can drag a slider to adjust the
    sensitivity of 3D Touch (from light to firm). You can even press against an image
    designed to test the sensitivity of the 3D feature known as peek and pop. Meantime,
    if for some reason you''re not taken with 3D Touch, know that you can turn it
    off by tapping a switch.


    **Shake to Undo:** In many instances, you can shake your iPhone to bring up an
    alert that you can tap to undo your last actions on the phone. If you prefer to
    disable the feature, do so here.


    **Vibration:** You can flip a switch to turn off all the vibration on your phone,
    including vibrations for earthquakes, tsunamis, and other emergency alerts.


    **Call Audio Routing:** You can route phone calls or FaceTime audio through a
    headset or the iPhone speaker.


    **Home-click speed:** Slow the speed required to double- or triple-click the Home
    button.


    **Reachability:** If the Reachability switch is enabled, you can double-tap the
    Home button to bring the top of the iPhone display into reach. This may especially
    benefit owners of the largest display iPhones.


    # Reset


    As kids playing sports, we ended an argument by agreeing to a do-over. Well, the
    Reset settings on the iPhone are one big do-over. Now that we''re (presum-) grown
    up, we''re wise enough to think long and hard about the consequences'
