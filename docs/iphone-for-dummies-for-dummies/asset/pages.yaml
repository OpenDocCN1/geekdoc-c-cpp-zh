    up to 999 images — couldn''t be easier. When you''re ready to shoot, press your
    finger against the shutter button and keep it until you''re satisfied that you
    have what you want. The A8 chip in the 6 and 6 Plus, the A9 chip in the 6s, 6s
    Plus, and, the A10 Fusion chip in the 7 and 7 Plus include an image processor
