    events, and more — and make it available to all your computers and devices automatically.


    iCloud pushes information such as email, calendars, contacts, reminders, and bookmarks
    to from your computer and to your iPhone and other iDevices, then keeps those
    items updated on all devices wirelessly and with- any effort on your part. iCloud,
    iCloud Photo Library, and iCloud Photo Sharing (see Chapter 9), and email (see
    Chapter 12).


