    and merchants, with more partners added all the time. Check out Chapter 7 for
    more on this feature.


    Apple has also opened up Touch ID to third-party app developers.


    You won''t have to use your fingerprint as a shortcut to enter web account names
    or passwords. A feature known as iCloud Keychain keeps your credit cards and passwords
