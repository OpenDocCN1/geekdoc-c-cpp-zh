- pgno: 140
  md: 'You have a few other IT options in Settings. You can choose to start the week
    on a particular day. You can display invitee declines. And you can display week
    numbers in the month view.


    You can also choose a Calendar setting to delete any unconfirmed suggestions found
    in Mail and prevent suggestions from appearing in the Calendar app. And you can
    get suggestions based on your location, or turn off this option.


    # Letting your calendar push you around


    If you work for a company that uses Microsoft Exchange Active, calendar entries
    and meeting invitations from coworkers are pushed to your device so they show
    up on the screen monitors after they''re entered, even if they''re entered on
    computers at work. Setting up an account to facilitate this pushing of calendar
    entries to your iPhone is a breeze, although you should check with your company''s
    tech or IT department to make sure your employer allows it. Then follow these
    steps:


    +   1. Tap Settings:⚙️ Calendars:⚙️ Accounts:⚙️ + Add Account.

    2. From the Add Account list, tap Exchange.

    3. Fill in the email address, username, password, and description fields, and
    then tap Next.

    4. If required, enter your server address and domain on the next screen that appears.


    The iPhone supports the Microsoft Autodiscovery service, which uses your name
    and password to automatically determine the address of the Exchange server. The
    rest of the fields should be filled with the email address, username, password,
    and description you entered.


    +   5. Tap Next.


    +   6. Tap the switch to turn on each information type that you want to synchronize
    using Microsoft Exchange.


    The options are Mail, Contacts, Calendars, and Reminders. You should be good to
    go now, although some employers may require you to add passcodes to safeguard
    company secrets.


    > If you have a business-issued iPhone and it is lost or stolen — or someone discovers
    you''re a double-agent working for a rival company — your employer''s IT administrators
    can remotely wipe your device clean.


    Calendar entries can also be pushed as part of iCloud, of course.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Displaying multiple calendars


    By tapping the Calendars button at the bottom of the yearly, monthly, or daily
    view, you can choose the calendar or calendars to display on your phone. Merely
    tap the calendar that you want to include such that a check mark appears next
    to it, as shown in Figure 7-7.


    You can tap the Hide All Calend button when you don''t want any calendars to be
    visible, or conversely tap Show All calendars when you want your entire schedule
    to be an open book. You can also scroll down to turn events found in the app to
    display them in your calendar, as well as display birthdays, including those of
    the people you''ve friended on the Facebook social network. You can even tap a
    switch to display events you''ve declined.


    From the Calendars view, tap the *i*-in-a-circle for even more tricks. You can
    assign a color to your calendar, share the calendar with a given individual (tap
    Add Person to do), make a calendar public (by flipping a switch), or delete the
    calendar.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_141_0.png)


    Figure 7-7:

    Choosing the calendars to display.


    # Responding to meeting invitations


    The iPhone has one more important button in the Calendar app. It''s the Inbox
    button, located at the bottom–right corner of the yearly, monthly, and daily views.
    If you partake in a Microsoft Exchange account, or have a calendar that adheres
    to the CalDAV standard, you can send and receive a meeting invitation, though
    you''ll also need a compatible email application that lets you only receive but
    respond to the invitation.


    If you have any pending invitations, you''ll see them when you tap the inbox,
    which is separated into new invitations and invitations to which you''ve already
    replied. You can tap any of the items in the list to see more details about which
    you''ve been invited.


    As noted, you can also accept or decline a meeting invitation that arrives via
    an interactive notification. In other words, you wouldn''t have to open the Calendar
    app to see such an invitation. Suppose that a meeting invitation arrives'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'from your boss. You can see who is attending the shindig, check scheduling
    conflicts, and more. Tap Accept to let the meeting organizer know you''re attending,
    Decline if you have something better to do (and aren''t worried about upsetting
    the person who signs your paycheck), or tap Maybe if you''re writing for a better
    offer.


    And as pointed out previously, you can also invite folks to attend an event that
    you''re putting together.


    Meantime, if you run into a conflict, why not ask Siri to change your schedule?
    For that matter, you can also call Siri to remind you when you have your next
    appointment. Visit Chapter 5 for this clear feature.


    As mentioned, if you take advantage of iCloud, you can keep calendars synchronized
    between your iPhone, iPad, iPod, and Mac or PC. When you make a scheduling change
    on your iPhone, it''s automatically updated on your computer and other devices,
    and vice versa. Choose iCloud from the Account Screen to get started, unless you
    didn''t when you activated your phone.


    # Subscribing to calendars


    You can subscribe to calendars that adhere to the CalDAV and iCalendar (.ics)
    standards, which are supported by the popular Google and Yahoo! calendars and
    by the Mac''s Calendar app. Although you can read entries on the iPhone from the
    calendars you subscribe to, you can''t create entries from the phone or the entries
    that are already present.


    To subscribe to one of these calendars, tap Settings > Accounts. Then tap Account
    > Other. Then you choose CalDAV Account or Addscribed Calendar. Next, enter the
    server where the iPhone can find the calendar you have in mind, and if need, be
    a username, a password, and an optional description.


    # Sharing a family calendar


    Through a Family Sharing feature, you can, well, share a calendar with up to five
    other members. This family calendar shows up in the Calendar app of each participating
    member of your clan.


    The requirements: One in the household (a.k.a. the family organizer) invites everyone
    to partake. Everyone must be signed into the same iCloud account. Family Sharing
    works with iOS 8, iOS 9, or iOS 10 devices, Mac OS X 10.10 (or later), macOS Sierra,
    Find My Friends 3.0 (or later), Find My iPhone 3.1 (or later), and iCloud for
    Windows 4.0 (or later).'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Because Family Sharing is designed to be used by only a single-family unit,
    you can be part of only one family group at a time, and you can switch to another
    family group only twice a year. (We suppose you might switch, say, if you married
    into a new family.)


    Each participating family member can add or modify events in the family calendar
    and receive notifications, alerts, and location-based reminders.


    Family Sharing extends well beyond the calendar. Family members can share photos,
    music, TV shows, books, apps, their respective locations, and even the location
    of their iPhones (or other devices). Through Parental Controls, the family organizer
    can limit the content that minors can access.


    If you''re using Family Sharing and iTunes on a PC or Mac, you can hide-purchased
    music, TV shows, and movies from other computers. To hide use, iBooks on a Mac
    or iTunes on a Windows PC. But you can''t hide any of your purchased-content directly
    from your iPhone (or, for that, from an iPod touch or an iPad), unless you''re
    a member of a Family Sharing group.


    To get started, tap Settings<cloud> Set Up Family Sharing. The family organizer
    enters his or her iTunes credentials (payment method), and sends emails to family
    members, who will be invited to participate.


    # Calculate This


    Quick — what''s 3,467.8 times 982.3? Why, the answer is 3,406,419.94 (of course).
    You, too, can solve the problem quickly thanks to the iPhone calculator. You can
    find the app on one of your home pages or via Control Center.


    Your handy iPhone calculator does fine for adding, subtracting, multiplying, and
    dividing. Numbers and symbols (such as C for clear) are large and easy to see.
    But are you thinking, “This isn''t the most advanced calculator I''ve ever used?”
    Well, you''re right. The calculator can''t handle a sine or a square root, much
    less more advanced functions.


    Fortunately, the math whizzes at Apple were thinking right along with you. See
    what they came up with, rotate the iPhone (and make sure the portrait lock isn''t
    enabled). As by slight of hand, your pocket calculator is now a full-fledged scientific
    calculator, capable of tackling dozens of complex functions.


    Isn''t it to know how much smarter a smartphone can make you feel?'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Punching the Clock


    We hear you: "So the iPhone has a clock. Big whoop. Doesn''t every cellphone have
    a clock?


    Well, yes, every cellphone does have a clock. But not every phone has a world
    clock that lets you display the time in multiple cities around the continent.
    And not every cellphone has an alarm, a stopwatch, and a timer to boot.


    Let''s take a moment in time to look at the time functions on your iPhone, which
    you can conveniently get to Control Center.


    # World clock


    Want to know the time in Beijing or Bogotá? Tapping World Clock (in the Clock
    app) lets you display the time in numerous cities around the globe, as shown in
    Figure 7–8.


    Tap the + icon in the upper-right corner of the screen and use the virtual keyboard
    to start typing a city or country name. The moment you use the first letter, the
    iPhone displays a list of cities or countries that begin with that letter. So,
    as Figure 7–9 shows, typing v brings up Caracas, Venezuela, and Hanoi, Vietnam,
    among myriad other possibilities. You can create clocks for as many cities as
    you like. How many cities can you see on one screen depends on your iPhone. Scroll
    up or down


    To remove a city from the list, tap Edit and tap the red circle with the white
    horizontal line that appears to the left of the city you want to drop. Then tap
    Delete.


    By the way, you''ll always know the time in Cupertino, California (unless you
    remove it) because Apple lists the location of its corporate headquarters in the
    world clock.


    You can also rearrange the order of the cities displaying the time. Tap Edit,
    and then press your finger against the symbol with three horizontal lines to the
    right of the city you want to move up or down in the list. Drag the city to its
    new spot.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/8361dd8dda9818e97bf48313b13b8d6b_145_0.png)


    Figure 7-8:

    What time is it in Barcelona?


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_145_1.png)


    Figure 7-9:

    Clocking in around the world.


    # Alarm clock


    Ever try to set the alarm in a hotel room? It''s remarkable how complicated an
    alarm can be, even on the most inexpensive clock radio. Like almost everything
    else, the procedure is dit-simple on the iPhone:


    +   1. Tap Clock on the Home screen to display the Clock app.

    2. At the bottom of the screen, tap the Alarm icon.

    3. In the upper-right corner of the screen, tap the + icon.

    4. Choose the time of the alarm by rotating the carousel controls in the upper
    half of the screen.


    This step is similar to the action required to set the time that an event starts
    or ends on your calendar.


    +   5. If you want the alarm to go off on other days, tap Repeat and tell the
    iPhone the days you want the alarm to be repeated, as in Every Monday, Every Tuesday,
    and so on.

    6. Tap Sound to choose the ringtone (see Chapter 4) to use to wake you up.


    You can use a custom ringtone you created or choose a song from Music library.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '+   7. Tap Snooze to display a Snooze button along with the alarm.


    Tap the Snooze button to shut down the alarm for nine minutes.


    +   8. If you want to call the alarm something other than um, Alarm, tap the Label
    field and use the virtual keyboard to type another descriptor.


    +   9. When the alarm settings are to you want really simple, like Save.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_146_0.png)


    Simple stuff, really. If you want really simple ask Siri to set the alarm for
    you.


    By now you surely appreciate 3D Touch on the 6 and 7 models affords you other
    shortcut options. So on either of these models, you can press against the Clock
    icon to dial a Quick Actions menu that lets you learn or start the stopwatch,
    the timer, topics that are coming up in the next two sections.


    You know that an alarm has been set and activated by the tiny status icon (surprise,
    surprise — it looks like an alarm clock) that appears in the upper-right corner
    of the screen.


    An alarm takes precedence over any tracks you''re listening to your iPhone in
    the Music app. A song momentarily pauses when an alarm goes off and resumes when
    you turn off the alarm (or tap the Snooze button).


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_146_1.png)


    When your ring/silent switch is set to silent, your iPhone doesn''t ring, play
    alert effects, or make iPod sounds. But it will play alarms from the Clock app.
    That''s good to know when you set your phone to silent at a movie or an opera.
    And, although it seems obvious, if you want to hear an alarm, you have to make
    sure that iPhone volume is turned up.


    If you''ve set an alarm, it takes precedence over the Do Not Disturb feature we
    de-cuss in Chapters 4 and 14.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_146_2.png)


    Not all phone carriers support the network time option in all locations, or an
    alarm may not sound at the correct time in a given area.


    # Stopwatch


    If you''re helping a loved one train for a marathon, the iPhone Stopwatch function
    can provide an assist. Open it by tapping Stopwatch in the Clock app.


    Just tap Start to begin the count, and then tap Stopwatch at the finish line.
    You can also tap a Lap button to monitor the times of individual laps. If you
    don''t like your results, tap the Reset button after tapping Stopwatch and pretend
    that your less-than-gold-medal-winning performance never happened.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Timer


    Cooking a hard-boiled egg or Thanksgiving turkey? Again, the iPhone comes to the
    rescue. Tap Timer (in the Clock app) and rotate the hour and minute controls until
    the time you have in mind is selected. When Timer Ends to choose the ringtone
    that will signify time''s up.


    After you set the length of the timer, tap Start when you''re ready to begin.
    You can watch the minutes and seconds down on the screen, if you have nothing
    better to do.


    If you''re doing anything else on the iPhone — admiring photos, say — you hear
    the ringtone and set a Timer Done notification on the screen at the appropriate
    time. Tap Stop to silence it.


    You can also set a timer in the iPhone to shut down music or video after you''ve
    shut down. Set the amount of time that you think''ll want the iPhone to be spitting
    out sound, and tap Timer Ends. Then stop Playing. The iPhone will be silenced
    by the time you''ve been exhausted.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_147_0.png)


    Apple considers the Timer app to be so essential that it deserves a spot for its
    icon in Control Center. And when you open Timer, you can also access the other
    components of the Clock app: World Clock, Alarm, Stopwatch, and the newest addition,
    Bed.


    # Bedtime


    The aptly named Bedtime feature, inside the Clock app, is all about getting a
    healthy and consistent night''s sleep. To get started, you''re asked a few simple
    questions, such as what time you would like to wake up, which days of the week
    the alarm should go off (if it is every day), and how many hours of sleep you
    need each night. You choose when to receive a bedtime reminder and which tone
    to hear when you wake up.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_147_1.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_147_2.png)


    As shown in Figure 7-10, you can also get a good grasp on your sleep history by
    displaying data from your wakeup alarm, sleep trackers, and any other sleep data
    added to the HealthKit on your phone.


    FIGURE 7-10: Your iPhone helps you to get a good night''s sleep.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Voicing Memos


    Consider all the times you''d find it useful to have a voice recorder in your
    pocket — perhaps when you''re attending a lecture or interviewing an important
    source

    (that''s a big for us journalist types). Or maybe you just want to leave yourself

    a quickie reminder about something (“Pick up milk after work”). Well, you''re
    in

    luck. Apple has a built-in digital voice recorder.


    A bunch of third-party apps add voice recording to the iPhone. Ed sometimes uses

    Recorder from Retronyms and Dictation from Nuance, and Bob uses iTalk

    Recorder from Griffin.


    # Making a recording


    After you have that recorder in your pocket,

    how do you capture audio? When you tap the

    Voice Memo icon on the Home screen or in

    t Extras folder, where it typically hangs out,

    u pops the screen displayed in Figure 7-11.

    You use the app with the iPhone microphone,

    whose location varies by model (see Chapter 1

    for details), or with a Bluetooth headset mic or

    an microphone.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_148_0.png)


    Recordings using the internal mics of the

    phone are made in mono, but you can record

    voice memos in stereo if you have the proper

    external gear.


    Tap the red record icon in the lower part of

    t screen to start recording. The waveform

    moves across the screen as Voice Memo

    detectss sounds how you gauge the recording

    level. You can pause a recording by tapping the

    red icon a second time and then tapping again

    to resume. A timer on the screen indicates the

    length of your recording session. Tap Done

    when you''re done to save the recording. It''s

    that easy.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_148_1.png)


    FIGURE 7-11:

    Leaving a voice memo.


    We recommend speaking in a normal voice. To adjust the recording level, simply

    move the microphone closer to or farther from your mouth.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Listening to recordings


    After you capture your thoughts or musings, how do you play them back?


    You can start playback in a couple of ways, and both involve the same icon. Immediately
    after recording the memo and tapping Done, you''ll get a chance to name your recording.
    When you do, a list of all your recordings pops up in chronological order, as
    shown in Figure 7-1, with the most recent on top. That memo is the one you just
    recorded, of course. When you launch the app, you''ll also see a list of the few
    recent memos you''ve made. To make a more complete list, tap Done. From the list,
    tap the recording in question and then tap the play icon to start listening.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_149_0.png)


    You can drag the playback along the scrub bar to move to any point in the membro.


    If you don''t hear anything after tapping play, tap the speaker icon in the upper-right
    corner of the screen. Sound will pump through the built-in iPhone speaker.


    > TIP


    # Trimming recordings


    Maybe the person who left the recording rambled on and on. You just want to trim
    the chase, for goodness'' sake. Fortunately, you can trim the audio directly on
    the iPhone.


    To do so, tap a recording and tap Edit. Then tap the trim icon (shown in the margin)
    and drag the red start and end markers to choose the audio segment you want to
    keep. To conclude the process, tap Trim — but before doing so, recommend that
    you preview your edit by tapping the play icon.


    Your edits are permanent. Make sure that you''re completely satisfied with your
    cuts before tapping Trim — or that you''ve synced the original back to iTunes
    on your computer so that you''re working with a copy.


    > WARNING


    FIGURE 7-12: Tap the voice memo you want to play.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Adding a title to a recording


    When a memo is added to your list of recordings, it shows up with the date and
    time of the recording and the uninspiring title *New Recording*. You could have
    named something else at that point, but if you didn''t, you might have a tough
    time remembering which recording was made for which purpose. Fortunately, you
    can easily create a custom title after the fact:


    +   1. From the list of recordings, tap a recording.

    2. Tap the name Apple assigned (New Recording 1, New Recording 2, and so) or the
    date.

    3. Type your name for the voice memo.


    Professor Snooks on *Biology*, for example. That''s. Your recording is duly identified.


    You may want to share with others the good professor''s wacky theories. Tap the
    share icon for the given voice memo. You then have the option to email the memo
    or send it in a message. Or you can share it via AirDrop, which we get to later
    this chapter, or add it to the Notes app or use the Music app. You might also
    import the recording to a third-party app such as WhatsApp.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_150_0.png)


    You can also sync voice memos to your Mac or PC by using iTunes, as described
    in Chapter 3. Recordings synced from your phone to the computer appear in the
    Music list and in the Voice Memos playlist in iTunes. And memos synced from your
    computer appear in the Voice Memos app on the iPhone.


    Here''s another cool trick you can do with a recording. Email the recording to
    yourself, download it to a Mac or PC, change the extension to .m4r, and put the
    recording in iTunes. Presto, you''ve added a ringtone.


    When you have no further use for a recording, you can remove it from the Voice
    Memos app by tapping it in the list and then tapping the trashcan icon. Alternatively,
    slide your finger from right to left and tap Delete.


    # Reminding me


    The Reminders app isn''t just any ordinary to-do list: Reminders on the iPhone
    can be tagged by your location, and it also works nicely with Calendar and Reminders-on
    a Mac running Mountain Lion, Mavericks, Yosemite, El Capitan, Sierra, or iCloud.
    You can keep reminders on the iPhone, or iCloud can keep reminders in sync across
    all your iOS devices and computers.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Consider the power of tying a reminder to your location. You''ll be notified
    of the items you must pick up at the supermarket the moment you drive into the
    grocery parking lot. Or perhaps a reminder to call your spouse pop up when you
    land following a business trip. If you take advantage of the Family Sharing feature,
    each family member will also receive certain reminders, including some based on
    location.


    Reminders are organized in lists, as shown in Figure 7-13. Apple supplies a scheduled
    list of the current day''s reminders. If you''ve set up Family Sharing, you''ll
    also see a Family reminders list. The number to the right of a list indicates
    the number of uncompleted items.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_151_0.png)


    Figure 7-13:

    Listing your Reminders lists such as groceries.


    You can create your own lists, of course, perhaps one for groceries and another
    for the tasks you must do for the PTA. Simply tap the + and name your list you
    want. If you want to color-code your new list, tap a color dot.


    When you go into a list, you''ll see any due dates you''ve assigned plus the location
    (if any) where you can act upon the task. Tap the circle next to an item in a
    list to indicate that you''ve completed that particular chore.


    To add a reminder to a list, tap the list in question. (For example, we tapped
    groceries to summon the list shown in Figure 7-13, right.) Tap a blank line in
    the list, and type the next item to add to the list.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'If you want to remove any items, tap Edit and then tap the red circle that
    appears.


    As an alternative, swipe to the left on an item and tap Delete. You can change
    the order in which an item appears by dragging the three horizontal lines to next


    the item.


    When you tap Edit, you can also delete the entire list.


    As we just mentioned, when you swipe to the left on an item, labeled More, a Delete
    button is summoned. Tap More to display a Details screen. You can get to this
    same screen when you tap a reminder and then tap the i-in-a circle. From here,
    you are presented with several choices: You can tap the name of the item in the
    list to rename it. You can assign a priority to the reminder (using one, two,
    or three exclamation marks for emphasis). You can add notes to the task (“When
    you get milk, make sure to buy Layctaid”). You can also choose a date and time
    to be reminded, and tack on an alarm if you need.


    But the feature that we think is specially cool is that you can also request to
    be reminded at a location. The location can be your current whereabouts, a previous
