    # Don''t grow too attached to attachments


    Your iPhone can even receive email messages with attachments in a wide variety
    of file formats. Here are some of the most common:


    +   ** Apple Keynote:** .key

    ** Apple Numbers:** .numbers

    ** Apple Pages:** .pages

    ** Contact information:** .vcf

    ** Images:** .jpg, .tiff, .gif, .png

    ** Microsoft Excel:** .xls, .xlsx

    ** Microsoft PowerPoint:** .ppt, .pptx

    ** Microsoft Word:** .doc, .docx

    ** Preview and Adobe Acrobat:** .pdf

    ** Rich Text:** .rtf

    ** Text:** .txt

    ** Web pages:** .htm, .html


    The iPhone can also play many types of audio attachments that turn up in an email,
    including MP3, AAC, WAV, and AIFF.


    > If the attachment is a file format not supported by the iPhone (for example,
    a Photoshoppsd file), you see the name of the file but you can''t open it on your
    iPhone. In some other instances, you may see an Open Button if one of your apps
    handle the file type. Often, an attachment will automatically appear in the body
    of an message — no action is required on your part.'
