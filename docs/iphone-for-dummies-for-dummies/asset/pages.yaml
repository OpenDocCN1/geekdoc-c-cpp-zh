    # # Proactive Searching


    With the Safari browser (see Chapter 11), you can search the web using Google,
    Yahoo!, Microsoft Bing, and DuckDuckGo — as well as Chinese search engines if
    you add a Chinese keyboard. You can also search for people and programs across
    your iPhone or within specific apps, using a combination of Spotlight and Siri.
    We show you how to search within apps in the various chapters dedicated to Mail,
    Contacts, Calendar, Notes, and Music.


    Spotlight can search for news and trending topics, local restaurants, movie times,
    and content in Apple’s own iTunes Store, App Store, and iBooks Store.


    Moreover, with Siri using the Spotlight feature (familiar to Mac owners), you’ll
    also see circled icons representing the contacts you engage with the most, the
    people you are scheduled to meet, as well as eateries, shops, and other places
    of possible interest nearby.


    The searches with the iOS are also proactive, meaning that the device gets to
    know you over time and makes suggestions accordingly. The phone might suggest
    the News app, for example, if it gets to learn that you turn out early morning
    (while enjoying your coffee). Or if you’re in a particular area, you might see
    the news that’s trending in your location.


    CHAPTER 2 iPhone Basic Training 47'
