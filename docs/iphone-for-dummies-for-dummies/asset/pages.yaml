    # # Keyboard


    Under Keyboard settings, you can turn on or off auto-capitalization and turn or
    Enable Caps Lock. Autocapitalization, which the iPhone turns by default, means
    that the first letter of the first word you type after ending the preceding sentence
    with a question mark, or an exclamation point is capitalized. If Caps Locks is
    enabled, all letters are uppercase LIKE THIS if you double-tap the shift key (The
    shift key is the one with the arrow pointing up.)


    You can also tap on a keyboard that inserts a period when you double-tap the space
    key. Additionally, you can choose to use an international keyboard (as discussed
    in Chapter 2), which you select by tapping Keyboards under the Keyboard setting
    and choosing New Keyboard.


    Apple gives you the power to substitute the keyboard on your phone for a custom
    alternative. Among the choices you might consider — some free and for most fees
    — are Swype, SwiftKey, Flexapt, Advext, and Minuum. For more on adding a third-party
    keyboard, see Chapter 2.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_313_0.png)


    If you''re using Apple’s default keyboard, you can turn on or off the keyboard-autocorrect
    smart.


    You can add keyboard shortcuts as *omw for My way!* To do so, tap Shortcuts so
    that it is turned on. Tap Text Replacement, and create a shortcut that will automatically
    expand the word or phrase you have in mind as you type. Tap + - under Text Replacement
    to type such a shortcut or tap an existing shortcut to make a change. If you edit
    it instead, you can remove an existing shortcut.


    If you like that fact Apple is now making predictions as you type (as discussed
    in Chapter 2), leave the Predictive text turned on. If you prefer things the old-fashioned
    way, flip the Predictive switch off. You can also turn on a setting that lets
    your keyboard check your spelling.'
