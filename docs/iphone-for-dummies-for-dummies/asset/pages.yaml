  md: '# Reading clutter-free web pages


    It''s all too easy to get distracted reading web pages nowadays, what with ads
    and other clutter surrounding the stuff you actually want to take in. So pay attention
    to the horizontal lines that often appear in the smart search field, as shown
    in Figure 11-10. Tap those lines to view the same article without the needless
    diversions, as shown in Figure 11-10 (right).


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_240_0.png)


    FIGURE 11-10:

    Reducing clutter when reading a web story.


    # Private Browsing


    Don''t leave any tracks while you surf? Don''t worry, we won''t and we won''t
    tell. Turn on private browsing for a “what happens in Safari stays in Safari”
    tool. Truly bent on staying private will also want to tap Clear History and Website
    Data, as we mention earlier in this chapter.


    To go incognito, tap Pages so you see a tabbed view of open pages, and tap the
    Private button, in the bottom-left corner. You''re given the option to close your
    existing tabs before turning on private browsing.


    After private browsing is on, any traces of your visit to nonstop.com (or wherever)
    are not visible to other users of your phone. The owner of the Wi-Fi network that
    you''re using or your network administrator, however, may still be able


    CHAPTER 11 Going On a Mobile Safari 229'
