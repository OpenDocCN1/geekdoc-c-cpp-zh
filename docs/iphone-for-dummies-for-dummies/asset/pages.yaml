  md: '+   1. Check the cell icon in the upper-left corner of the screen.


    If you don''t have at least one or two bars, you may not be able to use the phone
    or messaging function.


    +   2. Make sure you haven''t left your iPhone in airplane mode, as described
    in Chapter 14.


    In airplane mode, all network-dependent features are disabled, so you can''t receive
    phone calls, send or receive messages, or use any apps that require a Wi-Fi or
    data network connection (that is, Mail, Messages, Safari, Stocks, Maps, and Weather).


    +   3. Try moving around.


    Changing your location as little as a few feet can sometimes mean the difference
    between four bars and zero bars or being able to use a Wi-Fi or wireless data
    network or not. If you''re inside, try going outside. If you''re outside, moving
    10 or 20 paces in any direction. Keep an eye on the cell signal or Wi-Fi icon
    as you move around, and stop when you see more bars than you saw earlier.


    +   4. Try changing your grip on the phone.


    +   5. Turn on airplane mode by tapping Settings on the Home screen or swiping
    up to reveal Control Center, and then tapping the airplane mode switch to turn
    it on. Wait 15 or 20 seconds, and then turn it off.


    Toggling airplane mode on and off like this resets the Wi-Fi and wireless data-network
    connections. If your network connection was the problem, toggling airplane mode
    on and off may correct it.


    +   6. Restart your iPhone.


    If you''ve forgotten how, refer to the "Restart your iPhone" section, a few pages
    back. Restarting your iPhone is often all it takes to fix whatever was wrong.


    +   7. Make sure your SIM card is firmly seated.


    A SIM (Subscriber Identity Module) card is a removable smart card used to identify
    mobile numbers. You can change phones by moving the SIM card from one to another.


    To remove the SIM card, straighten one end of a fine-gauge paper clip and insert
    the straight end **gently** into the SIM tray.


    When the SIM tray slides out, carefully lift the SIM card and make sure it''s
    firmly situated in the tray before you **gently** push the tray back until it
    locks.


