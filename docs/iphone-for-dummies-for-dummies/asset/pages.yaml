  md: 'You can organize your apps in the following ways:


    +   * In the Home screens section, double-click any Home screen to expand it so
    you can click and drag an app icon to a new location on the same screen.


    +   * You can drag an app from the Apps list to the left of any of the 19 available
    screens in the scrolling list of Home screens on the right, as long as the screen
    has no empty screens preceding it. In other words, you can drag an app to screen
    7 as long as at least one app is on the screens numbered 1 through 6.


    +   * You can add new Home screens by clicking the + icon.


    +   * You can change the order of screens in the Home screens grid by dragging
    it to a different position on the grid. After you have a few pages'' worth of
    apps, give it a try — it''s easy and kind of fun.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_338_0.png)


    You can change the order of Home screens only in iTunes. While you can move individual
    app icons around your heart''s content on your iPhone, there''s no method for
    reordering Home screens.


    You can also create folders to organize your apps by dragging one app onto another
    app. After, folders work a lot like Home screens:


    +   * You can click and drag an app icon to a new location in a folder or on any
    page.


    +   * You can drag an app from the Apps list to the left to any folder.


    +   * You can change the order of pages in folders the same way you change the
    Home screens. First, scroll down past your last Home screen, where''ll see all
    folders on your iPhone (if you have any folders), and then click the page you
    want to move, and drag it to your new location.


    +   * You can add new pages to folders by clicking their icons.


    # On your iPhone


    To rearrange apps and folders on your iPhone, first press and hold down on any
    app or folder until all the apps begin to jiggle and the little “delete” x’s appear.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_338_1.png)


    A folder icon is the same as an app icon when it comes to rearranging icons-screen.
