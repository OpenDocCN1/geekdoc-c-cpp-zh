- pgno: 92
  md: 'You will find a share button inside voicemail listings. It appears next to
    the i-circle and lets you share the voicemail message via the Messages, Mail,
    Notes, and Voice Memos apps.


    The scrubber (labeled in Figure 4–4) shows you the length of the message and the
    tiny playhead along the bar shows how much of the message you''ve heard. If you
    hold callers forever, drag the playhead to rapidly advance through a message.
    Perhaps more importantly, if you miss something, you can replay that segment.


    Returning a call is as simple as tapping Call Back. If the caller''s name is unknown,
    Call Back appears dimmed. And you can delete a voicemail by pressing Delete.


    You may be able to view a typed transcript of a voicemail that a caller left.
    The feature, new to iOS 10, was still in (test mode) at the time of this writing.


    Meanwhile, through iOS 10, the iPhone is also capable of receiving Voice over
    IP (VoIP) calls right on the Lock screen. *VoIP is a fancy way to refer to calls
    over the Internet.* If you receive this type of call, it will be lumped in with
    all the calls in your Recents log.


    You can listen to your iPhone voicemail from another phone. Just dial your iPhone
    voicemail number, and while the greeting plays, you can set up a password from
    the Home screen by tapping Settings  Phone  Change Voicemail Password. You''ll
    be asked to enter your custom voicemail password, if you have one. If one doesn''t
    exist yet, tap Done. If you have a password, enter it and tap Done. You''ll be
    asked to type the new password and tap twice.


    # # Recording a greeting


    You have two choices when it comes to the voicemail greeting your callers hear.
    You can accept a generic greeting with your phone number by default. Or you can
    create a custom greeting in your own voice, as follows:


    +   1. In Voicemail, tap Greeting.

    2. Tap Custom.

    3. Tap Record and dictate a clever, deserving-of-being-on-the-iPhone voicemail
    greeting.

    4. When you''ve finished recording, tap Stop.

    5. Review the greeting by pressing Play.

    6. If the greeting is worthy, tap Save. If not, tap Cancel and start over at Step
    1.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# THE GLOBETROTTER IPHONE


    Different countries employ different radios and frequencies, and Apple has managed
    to cram a bunch of radios into the latest iPhones.


    Among its networks, the iPhone supports GSM/EDGE radios (850, 900, 1,800, and
    1,900 MHz), UMTS/HSPA+/DC-HSDPA (850, 900, 1700/2100, 1,900, and 2,100 MHz), plus
    CDMA EV-DO Rev. A and Rev B radios (800, 1700/2100, 1,900, and 2,100 MHz and more).
    Oh, and radios for Bluetooth, Wi-Fi, and GPS, Wi-Fi Calling now available in more
    global markets, can be a godsend if you have a nonexistent or poor cellular signal.


    The phones also support LTE (Long Term Evolution) networks. LTE, a 4G (fourth-generation)
    communications standard, handles data rather than voice calls, and Verizon is
    the early LTE leader, though the other carriers are all in the game.


    The iPhone 6, 6 Plus, 6s, 6s Plus, SE, and 7 Plus can tap into faster LTE networks
    and Support over LTE (VoLTE) technology, for high-quality broadband bands. VoLTE
    is available in select markets with carriers; T-Mobile is the first to support
    this capability in the U.S. Wi-Fi Calling is also possible on the newest phones,
    T-Mobile is the first to exploit this capability as well.


    The iPhone 7 and 7 Plus support up to 25 LTE bands and technology known as LTE
    Advanced. The promise: exceptionally fast data speeds.


    When you''re cruising at LTE speeds, you''ll see the little LTE indicator in the
