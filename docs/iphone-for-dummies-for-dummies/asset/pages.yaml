- pgno: 112
  md: 'On earlier models, you can bring the phone up to your ear, wait for a tone,
    and then talk. Siri responds also when you press a button on a Bluetooth headset.
    For this work, the Raise to Speak feature must be enabled inside Siri''s settings.


    What happens next is up to you. You can ask a wide range of questions or issue
    voice commands. If you didn''t get your words out enough or you were misunderstood,
    tap the microphone icon and try again.


    Siri relies on voice recognition, artificial intelligence, and, of course, an
    Internet connection. She (or he) will respond in a conversational (if still slightly
    robotic) manner. Using Siri isn''t entirely a hands-free experience. Spoken words
    are supplemented by information on the iPhone (so you can see in the next section).


    And where does Siri get that information? By tapping into Location Services and
    seeking answers from the web using such as Bing, Wikipedia, Yelp, Yahoo!, OpenTable,
    Twitter, and Wolfram|Alpha, which you can learn more about in the coming sidebar.


    And Siri can open apps, Apple''s own and third-party apps. Indeed, from your contacts,
    Siri might be able to determine your suppose, coworkers, friends, as well as where
    you live. You might ask, "How do I get home from here?” and Siri will fire up
    Maps to show you your way. Or you can ask, "Find a Italian restaurant near Barbara''s
    house," and Siri will serve up a list, sorted by Yelp rating. Siri can even let
    you make a reservation (via OpenTable).


    If you ask about a favorite sports team, Siri will retrieve the score of last
    night''s game and if you''re rummaging through a longish email that you can''t
    get through at the moment, you can have Siri set a reminder to follow up later
    in the evening.


    We also think it''s pretty cool that Siri teams up with one of our favorite apps,
    Shazam (see Chapter 17), to identify the name and artist of the musical track
    that''s playing. Just ask Siri what song is playing and she''ll tell you (assuming
    that you can identify the song). When the song is properly identified, you can
    choose to buy it.


    > WARNING

    as noted, Siri requires Internet access. In addition, many factors go into its
    accuracy, including surrounding noises and unfamiliar accents.


    # Figuring out what to ask


    The beauty of Siri is that you don''t have to follow a designated protocol when
    talking to her. Asking, "Will I need an umbrella in New York tomorrow?" produces
    the same result as "What is the weather forecast around here?" as shown in Figure
    5–3.'
