    ![](img/8361dd8dda9818e97bf48313b13b8d6b_42_0.png)


    # Understanding Pressure-Sensitive Touch


    Speaking of feel, the arrival of the iPhone 6s and 6s Plus few years ago introduced
    iPhone owners to new pressure-sensitive technology known as 3D Touch, essentially
    your pressure recognizing force. The feature was eventually added to subsequent
    models. Another way, the amount of pressure you apply when touching the display
    changes the outcome of what happens on the screen.


    For example, if you press against an email in your Mail inbox, you can peek at
    the message. Press harder and in Apple parlance you have popped into the content
    (in this instance, you''d be able to do all the things you''d do with a Mail message,
    a subject for Chapter 12). Apple coined the phrase peek and pop.


    On the Home screen, you can use 3D Touch to employ shortcuts, including a selfie,
    marking a location in Maps, and searching for what''s nearby. Apple calls these
    shortcuts quick actions. As mentioned, you can also use 3D Touch to interact with
    notifications inside Notification Center.


    As you discover later, you can use 3D Touch also in apps such as Mail or Notes
    to transform your on-screen keyboard into a trackpad.'
