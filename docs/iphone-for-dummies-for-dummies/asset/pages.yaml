    or playlist that they discover in these four tabs; nonsubscribers can pur-chase(almost)
    any song, album, or playlist they discover.


    Here''s a quick rundown of what you''ll find in each tab:


    +   Library: The library displays a list of songs available on this iPhone. Tap
