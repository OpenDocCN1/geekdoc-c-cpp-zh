  md: 'When you''re typing notes or sending email and want to type a number, symbol,
    or punctuation mark, tap the 123 key. The keyboard morphs into an alternative
    virtual keyboard with numbers and symbols. The 123 key is now the #+= Tap to display
    keys with additional symbols to return to the alphabetical keyboard. These extra
    steps are not hard to get to, but some may find them irritating.


    As mentioned, you can rotate the iPhone so that its keyboard changes to a landscape
    mode in certain apps, including Mail, Messages, Notes, and Safari. The keys are
    slightly larger in landscape mode, a boon to those who do a lot of typing or have
    large fingers.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_50_0.png)


    # Correcting mistakes


    It''s a good idea to type with abandon and not get up over mistyped characters.
    The iPhone''s self-correcting keyboard will fix many errors and, as mentioned,
    will help you reduce mistakes in the first place by predicting which words you
    have in mind. Still, you may have to make some corrections manually.


    FIGURE 2-7:

    When the keyboard bails you out.


    If the iPhone thinks you''ve made a mistake while typing, it may underline or
    highlight the suspect word. For instance, in our earlier example, *nptes* is not
    a recognized English word, the iPhone will flag that possible error in the body
    of your message. Tap the word to *see* possible alternatives (like *notes appears*)
    just below the suspect word.


    If you want to decline the suggestion and type your own replacement, you can do
    so. And of course you keep the word that the iPhone thought you typed in.


    Sometimes misspelled words appear with an underline and no suggestion. If you
    tap the misspelled word, a suggestion for another spelling may appear. Tap the
    new word to accept it. Sometimes when you tap the underlined word, you instead
    see the note *No Replacements Found.*


    A neat trick when manually correcting text is to hold your finger against the
    screen to bring up the magnifying glass shown in Figure 2–8. Use it to position
    the pointer to the spot where you need to make the correction.


    CHAPTER 2 iPhone Basic Training 39'
