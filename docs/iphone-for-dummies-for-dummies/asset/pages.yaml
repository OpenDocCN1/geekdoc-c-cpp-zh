- pgno: 173
  md: '# PLAYING WITH AIRPLAY


    AirPlay is a wicked cool bit of technology baked into every copy of iOS. It enables
    you to wirelessly stream music, photos, and video to AirPlay-enabled devices such
    as Apple’s AirPort Express Wi-Fi base station and second-generation (and later)
    Apple TVs, plus third-party devices that have AirPlay technology, including (but
    not limited to) speakers and receivers.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_173_0.png)


    The AirPlay Selector icon (shown here), which is available in some apps and Control
    Center, can be quite shy. It will appear only if your iPhone detects an AirPlay-enabled
    device on the same Wi-Fi network. Bob has two Apple TVs at his house, so he sees
    when he taps his AirPlay selector icon.


    Tapping Apple TV or the other sends whatever is playing on the Music app to Apple
    TV. The Apple TV, in turn, is connected to an HDTV via HDMI (an audio cable would
    suffice if you want to stream only audio, not).


    But wait—there is more! If you use Apple TV as your AirPlay-enabled device, in
    addition to streaming music, video, or photos from your iPhone to your HDTV, you
    can also stream from your Mac, PC, iPad, or iPod touch. Bob loves his Apple TV
    and says it is one of his favorite Apple inventions and would be a bargain at
    twice the price.


    And that, gentle reader, is all you need to know to enjoy listening to music (and
    podcasts and audiobooks) on your iPhone. But wait! There’s more! Although you
    now know all you need to know about listening to music, you can customize your
    listening experience to make it even better.


    # Customizing Your Audio Experience


    In this section, we cover some Features designed to make your listening experience
    more enjoyable.


    # Setting preferences


    You can change a few preference settings to customize your iPhone listening experience.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Play all songs at the same volume level


    The iTunes Sound Check option automatically adjusts the level of songs so that
    they play at the same volume relative to each other. That way, one song never
    blasts out your ears even if the recording level is much louder than the song
    before or it. To tell the iPhone to use these volumes, you first have to turn
    on the feature in iTunes on your computer. Here''s how to do it:


    +   1. Choose iTunes: Preferences (Mac) or Edit: Preferences (PC).

    2. Click the Playback tab.

    3. Select the Sound Check check box to enable it.


    Now, to tell the iPhone to use the Sound Check settings from iTunes: On the iPhone''s
    Home screen, tap Settings: Music: Sound Check.


    # Choose an equalizer setting


    An equalizer increases or decreases the relative levels of specific frequencies
    to enhance the sound you hear. Some equalizer settings emphasize the bass (low
    end) in one song; other equalizer settings make the higher frequencies more apparent.
    The iPhone has more than a dozen equalizer presets, with names as Acoustic, Bass
    Booster, Bass Reduce, Dance, Electronic, Pop, and Rock. Each one is ostensibly
    tailored to a specific type of music.


    The way to find whether using equalizer is to listen to music while trying different
    settings. To do that, first start listening to a song you like, while the song
    is playing, follow these steps:


    +   1. On the Home screen, tap Settings: Music: EQ.

    2. Tap EQ presets (Pop, Rock, R&B, or Dance), and listen carefully to the way
    they change how the sounds.

    3. When you find an equalizer preset that you think sounds good, press the Home
    button and you''re finished.


    If you don''t like any of the presets, tap Off at the top of the EQ list to turn
    off the equalizer.


    According to Apple''s iPhone battery information page (www.apple.com/batteries/iphone.html),
    applying an equalizer setting to song playback on your iPhone can decrease battery
    life. So need to decide which is more important to you: using equalization or
    maximizing battery life.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_174_0.png)


    CHAPTER 8 Get in Tune(s): Audio on Your iPhone 163'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Set a volume limit for music (and videos)


    You can instruct your iPhone to limit the loudest listening level for audio or
    video.

    To do so, here''s the drill:


    +   1. On the Home screen, tap Settings  > Music  > Volume Limit.


    +   2. Drag the slider to adjust the maximum volume level to your liking.


    +   3. (Optional) Assign a four-digit passcode to the setting so that others can''t
    easily change it, tap Lock Volume Limit.


    The Volume Limit setting limits the volume of only music and videos. It doesn''t
    apply to podcasts or audiobooks. And, although the setting works with any head-phones,
    or speakers plugged into your iPhone, it doesn''t affect sound played on your
    iPhone''s internal speaker.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_175_0.png)


    # Setting a sleep timer


    If you like to fall asleep with music playing but don''t want to leave your iPhone
    playing music all night long, you can turn on its sleep timer.


    Here''s how:


    +   1. On the Home screen, tap the Clock icon.


    +   2. In the lower-right corner, tap the Timer icon.


    +   3. Set the number of hours and minutes you want music to play, and then tap
    when the Timer Ends button.


    +   4. Tap the item in the list, Stop Playing.


    If you don''t see the Stop Playing item, don''t be alarmed (semi-lever wordplay
    intended). You''re simply looking at the middle (or the beginning) of the list
    of available alert sounds. To scroll to the bottom of the list and find the elusive
    Stop Playing item, flick upward on the list a few times.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_175_1.png)


    +   5. Tap the Start button.


    That''s it! If you have music playing already, you''re finished. If not, press
    the Home button, tap the Music icon, and select the music you want to listen to
    as you fall asleep. When the specified time period elapses, the music stops playing
    and your iPhone goes to sleep. By then, we hope you''re in slumberland as well.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Using your voice to control your music


    Here''s something cool: You can boss around your music by using nothing but your
    voice. Just press and hold down the Home button (or the equivalent button on your
    headset) and, after you hear the tune, you can:


    +   - Play an album, an artist, or a playlist: Say "Play" and then say "album,"
    "artist," or "playlist," and the name of the album, artist, or playlist, respectively.
    You can issue these voice commands at any time when you''re on a phone call or
    having a FaceTime video chat. In other words, you don''t have to have music playing
    for these voice commands to work.

    - Shuffle the current playlist: Say "Shuffle." This voice command works only if
    you''re listening to a playlist.

    - Find out about the song that''s playing: Ask "What''s playing?" "What is this
    song?" "Who is this song by?" Again, these commands work only if you''re already
    listening to music.

    - Get creative: In iOS 10, Siri has a much better grasp on music than before,
    and remember to use her things like these:


    +   - Play songs popular in 1973.

    - Play music by The Beatles.

    - Play the playlist "Music I Love."

    - Play James Taylor''s first album.

    - Play some classic rock.


    Siri can interpret commands such as these, and in seconds you''ll be listening
    to exactly what you want to hear. Plus, if you''re an Apple Music subscriber,
    you can ask Siri to play virtually any song in the iTunes Store (30 million plus
    at last). Finally, because your listening to music on your iPhone, you won''t
    look stupid when you''re talking to it


    Although we found that controlling your music by speaking words works most of
    the time, in noisy environments the iPhone may mislead your request and start
    playing the wrong song or artist or try to call someone on the phone. Using the
    wired headset helps. And syntax matters, you can use the exact wording in the
    list.


    Siri can also identify songs playing in the background


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_176_0.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_176_1.png)


    CHAPTER 8 Get in Tune(s): Audio on Your iPhone 165'
