    Music app (Chapter 8).


    Content for the Podcasts, eBooks, and iTunes U is synced in a similar manner to
    movies and TV shows. The following sections detail the minor differences.


    # Podcasts


    To transfer podcasts to your iPhone, select the Podcasts pane and then select
    the Sync Podcasts check box. Next, you can include however many podcasts you want
    by making selections from the Automatically Include and or Selected Podcasts pop-up
    menus.


    # iTunes U


    To sync educational content from iTunes U, first select the iTunes U check box
    to enable iTunes syncing. Next, from the two pop-up menus, choose how many episodes
    to include and whether you want all collections or selected collections. If you
    want to also include individual items from a collection, click the collection
    and select the appropriate check boxes in the Items section.


    # Books


    By now we’re sure you know the drill: You can sync all your e-books and audiobooks
    as well as just sync selected titles by choosing the appropriate buttons and check
    boxes in the Books pane.'
