  md: 'Wi-Fi networks, however, are even faster than any cellular data network. So
    all iPhones will connect to a Wi-Fi network if one is available, even if a 4G,
    3G, GPRS, or EDGE network is also available.


    But not least, if you don''t see any of these icons — LTE, 4G, 3G, GPRS, EDGE,
    or Wi-Fi — you don''t have internet access.


    +   ** Wi-Fi call: Your iPhone is making a call over Wi-Fi.


    +   ** Do Not Disturb: The Do Not Disturb feature (Chapter 4) is enabled.


    +   ** Personal Hotspot: The iPhone is providing a personal hotspot connection
    to another iPhone or device.


    +   ** Syncing: Your iPhone is syncing with iTunes.


    +   ** Network activity: Some network activity is occurring, such as over-the-air
    synchronization, receiving or sending email, or loading a web page. Some third-party
    apps use this icon to indicate network or other activity.


    +   ** Call forwarding: Call forwarding is enabled on your iPhone.


    +   ** VPN: Your iPhone is currently connected to a virtual private network (VPN).


    +   ** TTY: Your iPhone is set up to work with a teletype (TTY) machine, which
    is used by those who are hearing or speech impaired. You need an option Apple
    iPhone TTY Adapter (suggested retail price $19) to connect your iPhone to a TTY
    machine.


    +   ** Portrait orientation lock: The screen is locked in portrait orientation.
    Swipe up from the bottom of the screen to reveal Control Center and tap the portrait
    orientation lock icon to lock your screen in portrait orientation.


    +   ** Alarm: You set one or more alarms in the Clock app.


    +   ** Location Services: An application is using Location Services, a topic we
    discuss in Chapter 13.


    +   ** Bluetooth: The icon displays the current state of your Bluetooth connection.
    If the icon is blue, Bluetooth is on and a device (such as a wireless headset
    or car kit) is connected. If the icon is gray, Bluetooth is turned on off. If
    you don''t see a Bluetooth icon, Bluetooth is turned off. Chapter 14 goes into
    more about Bluetooth.


    +   ** Bluetooth battery: A tiny battery next to the Bluetooth icon displays the
    battery level of some Bluetooth devices.


    +   ** Battery: This battery icon displays the level of your battery''s charge.
    The icon is completely filled with green or white when your battery is fully charged
    and then empties as your battery becomes depleted. You see a lightning bolt next
    to the icon when your iPhone is recharging.


