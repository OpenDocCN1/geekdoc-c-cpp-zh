    # # Shooting Video


    All the iPhones dating back to 3GS can shoot video. The 4s and later can pro-

    duce high-definition video at what techies refer to as 1080p. The 6, 6 Plus, SE,
    7,\and 7 Plus models also provide continuous autofocus as you shoot, which helps

    when you, or the people you''re trying to shoot, are on the run. These models
    also

    let you shoot at a frame rate of 60 FPS instead of 30 FPS. That''s true of the
    6s

    6 Plus too. As we mentioned, these newer iPhones can also shoot 4K

    video, albeit at 30 FPS.


    The front-facing camera on the iPhone plays in the high-def leagues, but at

    t the lower 720p video standard. It''s known as the FaceTime HD camera.


    The iPhone 5s made further improvements to the video stabilization feature

    introduced in the 4s. And through a process known as temporal noise reduction,

    you can shoot video even in dim light. The iPhone 6 family, followed by

    t SE, added cinematic image stabilization for reducing the shakes of a shooter
    and

    smoothing out the resulting videos, as your authors happily discovered. (It is
    not

    available when shooting 4K on the 6s or 6 Plus)


    Meantime, the 6s, 6 Plus, 7, and 7 Plus use optical image stabilization, which
    helps you capture jitter-free videos in lower light.


    Here''s how to shoot video on these latest phone models. Note that you can capture

    ideo in portrait or landscape mode:


    +   1. Tap the Camera icon on the Home screen.


    +   2. Drag the screen or swipe across the options so that Video becomes your

    preferred shooting format.'
