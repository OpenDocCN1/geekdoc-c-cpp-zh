  md: '# It’s a Wallet


    We reckon that most of you never leave the house without three things: your keys,
    your cellphone, and your wallet. That''s a habit unlikely to change anytime soon.
    Nor do we expect most of you to ditch the plastic cards in your physical wallet
    for digital versions. That said, the tech and financial worlds are combining efforts
    to turn modern smartphones such as the iPhone into a version of a digital wallet.


    Apple''s relatively early push in this area was with the Passbook feature, which
    arrived with iOS 6 and was renamed Wallet with iOS 9. The introduction of Apple
    Pay, which launched in October 2014, placed Apple smack in the middle of the mobile
    payments space, with what potentially is a big deal, especially in the long term.


    As of this writing, Apple Pay works with the iPhone 6, 6 Plus, 6s, 6s Plus, SE,
    and 7 Plus, along with some recent iPad models


    If you have a 3D Touch-capable model, you can press against the Wallet app and
    summon yet Quick Actions menu, allowing you, for example, to view your last transaction.


    If you have the Apple Watch, check out the Watch app on the iPhone. It''s the
    place to pair your iPhone with your Apple Watch and choose settings and apps for
    the watch. An Activity tied to the Apple Watch also appears on the phone.


    But with any of the credit or debit cards stored in the Wallet app on your phone,
    you can press the Touch ID button on the phone to make a payment at a participating
    merchant — more than 1 retail locations have contactless payments terminals with
    the NFC (near field communication) capability required to complete transactions
    in physical stores and are otherwise compatible with Apple Pay. NFC technology
    is built into all iPhone 6 and 7 models. (Apple Pay works with online transactions.)


    With the arrival iOS 10, you can use Apple Pay on your iPhone to pay for stuff
    you on the Safari website.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_153_0.png)


    At a retail store, you can use a credit card stored in Wallet to make a payment
    by generally pressing your finger against the Touch ID button as you phone within
    an inch of the terminal — we think the requirement to use your fingerprint to
    transact is a darn good security measure. Meanwhile, Apple is kept in the dark
    about the details of the transaction: The company doesn''t know how much you spent
    or what you bought. Instead, payment information is stored on a chip called the
    Secure Element.


    Even ahead of Apple Pay, some people use the iPhone to scan boarding passes at
    the airport or to pay for coffee in Starbucks through a third-party app. Wallet


