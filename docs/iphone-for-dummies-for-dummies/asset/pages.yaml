- pgno: 181
  md: '# # Making Photos Come to Life


    One of the coolest features added to the 6s and 6s Plus (and beyond) is called
    Live Photos. Essentially, you snap a still image as always, a snippet of video
    (and sound) is captured about a second and a half before you tap the shutter.
    Think of a live photo as an animated GIF.


    Models with live photos, you''ll see a glyph when you fire up the camera (see
    Figure 9-1). If the glyph is yellow, the Live Photos feature is enabled, as it
    is by default. Otherwise, the glyph will be white. You can tap the glyph to toggle
    the feature on or off. You see a live indicator in a yellow box when the iPhone
    is capturing a scene.


    You can view your live photo on your iPhone or on other devices by leaving your
    finger pressed down on the screen. You can also use a live photo as your Lock
    screen iPhone wallpaper.


    According to Apple, a live photo claims roughly the same amount of space as two
    photos with the live feature turned off do. That means storage shouldn''t become
    a major issue for most iPhone owners who snap a decent amount of photos, even
    of you with the smallest capacity iPhones. Of course, you''ll find out in this
    chapter, photos need not stay resident on your phone; you can store images on
    the cloud via iCloud.


    > TIP We recommend that you think of live photos as photos than videos. The 12-megapixel
    still image is still at the heart of what you''re trying to capture. That said,
    you may want to think about keeping the camera steady for a second or so longer
    and after you snap the photo.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_181_0.png)


    # # Keeping Things in Focus


    The camera in the iPhone can detect up to ten faces in a scene, placing a rectangle
    on top of each mug (the focus box in Figure 9-1). Behind the scenes, the camera
    is balancing the exposure across each face. If you want to take a picture, press
    and hold your finger against the screen until the rectangle pulses. AE/AF Lock
    will appear on the screen. Tap the screen again to make AE/AF Lock disappear.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'If you have the 6 Plus, 6s, 7, or 7 Plus, your photography skills get a boost
    from optical image stabilization, which uses complex algorithms to help you compensate
    for a case of the shakes. The 6 Plus works with the A8 chip, gyroscope, and M8
    motion coprocessor inside the phone to improve the results of your pictures in
    dimmer light


    The 6s and the SE beef up the specs with an A9 chip and M9 motion coprocessor.


    The iPhone 6, 6s, SE employ a somewhat less effective *digital image stabilization*
    method to compensate for a jittery shooter.


    The 7 and 7 Plus have an A10 Fusion chip from Apple.


    When a sun is visible, you can drag your finger up or down the screen to increase
    or decrease the brightness in a scene. You can change the exposure settings of
    a given shot by up to four f-stops. You can lighten or darken scenes for both
    stills and video.


    All iPhone 6 models and later include a *focus pixels* sensor. This is it of a
    under-the-hood tool to help the cameras focus faster and better.


    The 6s, SE, and 7 Plus raised the megapixel count on the rear iSight camera to
    12 (from 8mp on prior models) and have engineered pixels, Apple say, to produce
