    gray dot on the scrubber bar) left and right. The only problem is that the scrubber
    isn''t very precise and your fat keeps moving it too far away or the other.


    Never fear — your iPhone has a wonderful fix (albeit hidden by your finger). Just
    press your finger on the scrubber, but instead of sliding your finger to the left
    or right, by sliding it up or down, as shown in Figure 19–2.


    Tap the playhead and drag up or down...

    Draw left or right to scrub


