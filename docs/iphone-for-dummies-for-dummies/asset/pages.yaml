    display—and even on the smallest model in the current lineup—watching movies and
    other videos on the iPhone can be a cinematic delight. And if you''re bordering
    on the larger screen, you can always use your iPhone to pump video to an Apple
    TV via AirPlay.


    As you discover later in this chapter, you can shoot your own blockbuster footage
    and shoot in stunning 4K on the iPhone 6s, 6 Plus, SE, 7, and 7 Plus. As a measure
    of sharpness, 4K boasts more than 8 million pixels and four times the resolution
    of what was the top-of-line 1080p high-definition video standard. If you have
    an older device and are shooting in 1080p, don''t fret; the quality is still excellent.
