  md: 'You can delete email messages without opening them in a few ways:


    +   Swipe left halfway across the message, and then tap the Red Trash button that
    appears to the right of the message, adjacent to the yellow Flag and gray More
    buttons. If you swipe all the way to the left by keeping your finger pressed against
    the screen, you''ll trash the message immediately. Be careful if that was not
    your intention. Or, if you swipe in the other direction (to the right), you can
    mark a message as unread. As well in some email accounts such as Google''s Gmail,
    an Archive button may appear inside Trash, depending on whether you turned on
    Archive Mailboxes in Settings. In this case, tap the Archive button to archive
    the message; it is not deleted. We get to that later in the chapter.


    +   Tap the Edit button (in the upper-right corner of the Inboxes or a mail sender
    selection), and then tap the circle to the left of each message you want to remove,
    as shown in Figure 12-10. Tapping that circle puts a check in it and changes the
    Trash All button at the bottom of the screen to a Trash button. Tap that Trash
    button to erase all messages you selected.


    +   Trash the message (or mark it as read) inside an interactive notification
    that appears regardless of the screen you are viewing. The advantage of this method
    is you don''t have to leave the screen to delete the message. Just tap the Trash
    button in the notification.


    +   When you''ve opened a message to read it, drag the entire edge of the screen
    toward the right. Upon doing so, you can sneak a peek at the messages in your
    inbox, as revealed in Figure 12-11. You haven''t trashed the message you just
    dragged to the right — it remains in the inbox and subfolder where it was — but
