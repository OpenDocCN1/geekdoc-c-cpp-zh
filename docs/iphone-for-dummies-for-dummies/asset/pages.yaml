    # Chapter 13

    Tracking with Maps, Compass, Stocks, and Weather


    In this chapter, we look at four of the iPhone''s Internet-enabled apps: Maps,
    Compass, Stocks, and Weather. We call them Internet-enabled because they display
    information collected over your Internet connection — whether Wi-Fi or cellular
    data network — in real time (or in the case of Stocks, near-real time).


    # Maps Are Where It''s At


    A few years ago, Apple jettisoned the Google-powered Maps app and replaced it
    with a version that was powered by Apple. The latest Apple-powered Maps app hasn''t
    changed much from the first rendition (in iOS 6) and still lets you quickly easily


    +   - Discover exactly where you are.

    - Find nearby restaurants and businesses.


    CHAPTER 13 Tracking with Maps, Compass, Stocks, and Weather 263'
