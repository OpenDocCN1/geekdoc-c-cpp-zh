- pgno: 281
  md: '# Favorites


    Favorites in the Maps app, like bookmarks in Safari, let you return to a location
    without typing a single character. (Earlier versions of the Maps app had bookmarks
    instead of favorites).


    Moving right along, if you''ve already searched for an address, you can make it
    favorite by swiping upward on the overlay until you see the heart (Add to Favorites)
    icon, and then tapping it.


    You can also save a location as a favorite by dropping a pin (a temporary favorite)
    on the map to mark the location. To drop a pin, press with one finger until a
    bubble with a pin appears. To reposition it, press on the bubble and drag it to
    the map. When you lift your finger, you''ll see one bubble with the location of
    the pin on an overlay near the bottom of the screen (if Maps can figure it out).
    Swipe upward until the heart (Add to Favorites) icon appears; tap it to save the
    location as a favorite.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_281_0.png)


    Don''t forget you can zoom by pinching or swiping or by tapping the map with one
    or two fingers.


    After you add a location to Favorites, you can recall it at any time by first
    tapping in the search field, swiping up on the eight icons to get to the bottom
    of the list (where Favorites appears), and then tapping the Favorites button.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_281_1.png)


    The first things you should mark as favorites are your home and work addresses.
    You''ll use these addresses all the time with Maps, so you might as well make
    zip code favorites for your home, work, and other locations you frequently visit.
    When you want to find businesses near any of those locations, you can choose the
    zip code favorite and add what you''re looking for, such as 78729 pizza, 90201
    Starbucks.


    One more thing: To delete a favorite from the list, swipe from right to left and
    tap Remove.


    When you''re finished using Favorites, swipe down on the overlay to return to
    the map.


    # Smart map tricks


    The Maps app has many tricks up its sleeve. This section lists a few features
    that you may find useful.'
