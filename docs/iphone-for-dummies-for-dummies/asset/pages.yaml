- pgno: 347
  md: '# Restart your iPhone


    If you recharge your iPhone and it still misbehaves, the next thing to try is
    restart-it. Just as restarting a computer often fixes problems, restarting your
    iPhone sometimes works wonders.


    Here''s how to restart:


    +   1. Press and hold down the sleep/wake button

    2. Slide the red slider to turn off the iPhone, and then wait a few seconds.

    3. Press and hold down the sleep/wake button until the Apple logo appears on the
    screen.


    If your iPhone is still frozen, misbehaves, or doesn''t start up, it''s time to
    try the third R, resetting your iPhone.


    # Reset your iPhone


    To reset any iPhone a 7 or 7 Plus, merely press and hold down the sleep/wake button
    while pressing and holding the Home button on the front at the same time. After
    about ten seconds, the screen will go black; when the Apple logo reappears, you
    can release buttons.


    > Because iPhone 7 and 7 Plus have solid-state Home buttons, which may not respond
    if your iPhone isn''t running properly, the reset procedure is slightly different.
    Instead of pressing and holding down sleep/wake and Home, press hold down the
    sleep/wake and volume buttons.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_347_0.png)


    Resetting your iPhone is like forcing your computer to restart after a crash.
    Your data shouldn''t be affected by a reset. So don''t be shy about using this
    technique a. In many cases, your iPhone goes back to normal after you reset it.


    > Remember to press and hold down the sleep/wake button and the Home button (or
    the volume down button for the iPhone 7 or 7 Plus). If you press both and then
    release them, you create a screen shot — a picture of yours at the time — rather
    than resetting your iPhone. This type of picture, by the way, is stored in the
    Photos app''s Camera Roll album as well as the Screen-shots.)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_347_1.png)


    Unfortunately, sometimes resetting doesn''t do the trick. When that''s the case,
    you have to take stronger measures.'
