    be able to see the icons for these apps on any Home screen, so you''ll have to
    access them with a Spotlight search.


    A few more facts about Home screens. We mention this elsewhere, but in case you
    missed it: The little dots above the four apps on dock indicate how many Home
    screens you have. The white dots denote the Home screen you''re currently looking
