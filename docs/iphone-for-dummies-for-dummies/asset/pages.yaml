    # Altering bookmarks


    If a bookmarked site is no longer meaningful, you can change it or get rid of
    it:


    +   To remove a bookmark (or folder): Tap the bookmarks icons and swipe the entry
    for the bookmark you want to toss off the list from right to left so that a red
    Delete button appears on the right. Tap Delete. Then Done, unless another bookmark
    appears to go away. As an alternative, you can tap Edit at the bottom-right of
    the screen and then tap the rect next to each bookmark you want to delete.


    +   To change a bookmark''s name or location: Tap Edit and then tap the bookmark.
    The Edit bookmark appears with the name, URL, and location of the bookmark. The
    fields you want to change. In the Name field, tap the X in the gray circle and
    use the keyboard to enter a new title. In the Location field, scroll up or down
    the list until you find a new home for your bookmark, and then tap that new destination.


    +   To create a new folder for your bookmarks: Tap Edit and then tap New Folder
    in the bottom left. Enter the name of the new folder and choose to put it.


    +   To move a bookmark up or down a list: Tap Edit and then drag the three bars
    to the right of the bookmark''s name.'
