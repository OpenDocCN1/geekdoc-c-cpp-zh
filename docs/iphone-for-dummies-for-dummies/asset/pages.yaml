  md: '# Auto apostrophes are good for you


    First, before moving on from the subject of punctuation, you should know that
    you can type don''t to get to don''. We told you to put some faith in the iPhone''s
    autocorrection software, and that applies to contractions. In other words, save
    time by letting the iPhone''s intelligent keyboard insert the apostrophes on your
    for these and other common commands.


    We''re aware of a few exceptions. The iPhone cannot distinguish between it''s,
    the contraction of it is, and the possessive and possessive pronoun. It has the
    same issue with other contractions as won''t and can''t (cant) because the words
    (as apostrophes) exist in the iPhone''s dictionary. It may offer a suggestion
    for those words (and a handful of others), with and without an apostrophe, but
    the suggestions are wrong more often than not. Which leads us to our next correct
    tip.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_392_0.png)


    # Make rejection for you


    If the autocorrection suggestion isn''t the word you want, reject it instead of
    ignoring it. Finish typing the word and then tap the x to reject the suggestion
    before you type another word. Doing so makes your iPhone more likely to accept
    your word the next time you type it (or less likely to make the incorrect suggestion
    the next time you type the word).


    Here though you were buying a tech book, and you get grammar and typing lessons
    thrown in at no extra charge. Think of us as your full-service authors.


    # ASSAULT ON BATTERIES


    Because this is a chapter of tips and hints, we''ll be remiss if we didn''t include
    some ways that you can extend your battery life. First and foremost: If you use
    a carrying case, charging the iPhone while it''s in case may generate more heat
    than is healthy. Overheating is bad for both battery capacity and battery life.
    Take the iPhone out before you charge it if possible.


    If you''re not using a 3G, 4G, or Wi-Fi or Bluetooth device (such as a headset
    or car kit), consider turning off the features you don''t need in Control Center.
    Switching the iPhone''s functions on and off has never been easier or faster,
    and so could mean the difference between running out of juice and being able to
    make it later in the day.


    Or enable airplane mode (also in Control Center) to turn off all your iPhone''s
    radios. Airplane mode disables cellular, Wi-Fi, Bluetooth, Location Services,
    and push


    (continued) CHAPTER 19 Ten Helpful Hints, Tips, and Shortcuts 381'
  merge: -1
  img_proc: true
- pgno: 393
  md: '(continued)


    notifications all at once. You can''t make or receive phone calls in airplane
    mode, nor do anything that requires network access. If you''re going to be off
    the grid for any length of time, like on a long flight, your battery will last
    a lot longer if you use Control Center or the Settings to enable airplane mode
    until you return to civilization.


    Speaking of Control Center, use its brightness slider to reduce brightness whenever
    possible and activate auto-brightness. This enables your iPhone to adjust its
    screen brightness based on current lighting conditions, which can be easier on
    your battery. From the Home screen, tap Settings > Display & Brightness, and tap
    the On/Off switch, if necessary, to turn it off.


    If your battery is low and airplane mode and auto-brightness aren''t appropriate
    solutions, try low power mode. Just tap Settings > Battery and then tap the Low
    Power Mode on/off. With this feature enabled, mail fetch, background refresh,
    automatic downloads, and some visual effects are disabled to reduce power consumption.


    And while you''re on the Battery page, scroll down and you''ll see which apps
    used battery in the last 24 hours. Tap the clock icon on the right to see the
    precise number of minutes (or hours) each app was active on the screen and in
    the background. This representation of which apps using the most battery power
    is probably the most accurate, so don''t forget to visit Settings > Battery every
    few hours to take a peek.


    Turning off Location Services (tap Settings > Privacy > Location Services), and
    then tap the On/Off switch can save tons of battery, so consider turning it off
    until you need it. Many apps that use Location Services will offer to enable it
    if you launch them where Location Services is turned off.


    Believe it or not, disabling EQ (see Chapter 8) for audio also saves battery life.
    EQ (equalization) may make music sound better than better, but it also uses more
    processing power, and means it uses more of your battery. If you''ve added EQ
    to tracks in iTunes the Track Info window, and you want to retain the EQ from
    iTunes on your iPhone to flat. Because you''re not turning off, your battery life
    will be slightly worse but your songs will sound just the way you expect them
    to sound. Either, to alter your EQ settings from the Home screen, tap Settings
    > Music > EQ.


    Apple says a properly maintained battery will retain up to 80% of its original
    capacity after 400 charge and discharge cycles. You can replace the battery at
    any time it no longer holds sufficient charge. Your one-year limited warranty
    includes the replacement of a defective battery. Coverage jumps to two years with
    the AppleCare and AppleCare+ Protection Plans. Apple will replace the battery
    if it drops below 50 percent of its original capacity.


    If your iPhone is out of warranty, Apple will replace the battery for $79 plus
    $6.95 shipping and local tax will also dispose of your old battery in an environmentally
    friendly manner.


