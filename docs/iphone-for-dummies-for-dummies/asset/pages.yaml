- pgno: 294
  md: '# Chapter 14


    # # Setting You Straight on Settings


    Are you a control freak? Do you have to have it your way? Boy, you have landed
    in the right chapter.


    Throughout this book, you have occasion to drop in on Settings, which is the makeover
    factory for the iPhone. For example, we show you how to open Settings (by tapping
    its Home icon) to set ringtones and text tones, change the phone''s background
    or wallpaper, and specify your search engine of choice. We also show you how to
    alter settings in Safari, tailor email to your liking, and get a handle on how
    to fetch or push new data.


    The Settings area on the iPhone is roughly analogous to Control Panel in Windows
    and System Preferences on a Mac.


    But you won''t have to visit Settings in every case because Control Center grants
    you immediate access to some of the settings and controls that used to require
    a separate visit to Settings, including airplane mode and display brightness,
    which we address in this chapter. But even with Control Center, we expect to run
    into you in Settings time to time. Because we cover some settings elsewhere, do
    not dwell on every setting. But you can still discover plenty to help you make
    the iPhone your own.


    # IN CHAPTER


    +   - Preparing networks


    +   - Seeking sensible sounds and screen brightness


    +   - Keeping the clan together Family Sharing


    +   - Finding a lost iPhone


    CHAPTER 14 Setting You Straight on Settings 283'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Sky-High Settings


    When you first open Settings, you see the scrollable list shown in Figure 14-1.(Not
    all the settings are visible in the figure.) In all airplane mode (at the top
    of the list), a greater-than symbol (>) appears to the right of each listing.
    This symbol tells you that the listing has a bunch of options. Throughout this
    chapter, you tap the > symbol to check out those options.


    If you scroll down to the bottom of the Settings list, you''ll see settings that
    pertain to Twitter and Facebook and settings that pertain to some of the specific
    apps you added to the iPhone. (See Chapter 15 for the scoop on third-party apps.)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_295_0.png)


    # Airplane mode


    First, even though you''re reading about airplane mode, we''re obliged to tell
    you that you can turn this setting on or off also in Control Center. Because you''re
    here-anyway, come, fly with us.


    > Figure 14-1: Presenting lists of settings.


    Using a cellphone to make calls on an airplane is a no-no. But nothing''s verbose
    about using an iPhone to listen to music, watch videos, and peek at pictures—and
    the rules that make you want to do so until the craft has reached altitude have
    been relaxed. So how to take advantage of the iPhone''s built-in Music player
    (or other capabilities) while temporarily turning it off, email, and Internet
    functions? The answer is, by turning airplane mode. To do, merely tap airplane
    mode on the Settings screen to turn the switch (which is showing green). That
    act disables the iPhone''s wireless radios (Wi-Fi, EDGE, 3G, 4G, LTE) and Bluetooth.
    While your iPhone is in airplane mode, you can''t make receive calls, surf the
    web, or do anything that requires an Internet connection. The good news is that
    airplane mode makes your battery running longer—particularly useful if you are
    flying half-around the world.


    The appearance of a tiny airplane icon on the status bar in the top-left corner
    reminds you that airplane mode is turned on. Just remember to turn it off when
    you''re back on the ground.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Since many flights now offer Wi-Fi, you can go into airplane mode and separately
    turn on Wi-Fi, using the method addressed in the next section.


    # Wi-Fi


    As we mention in Chapter 11, Wi-Fi is typically the fastest wireless network you
    can use to surf the web, send email, and perform other Internet tricks on your
    iPhone, including (in some cases) making calls. You use the Wi-Fi setting to determine
    which Wi-Fi networks are available to you and which one to exploit based on its
    signal.


    Tap Wi-Fi, and you see any Wi-Fi networks in range, as shown in Figure 14–2.


    A signal-strength indicator can help you choose the network to connect to if more
    than one is listed; tap the appropriate Wi-Fi network when you reach a decision.
    If a network is password-protected, you see a lock icon.


    You can turn on or off the Ask to Join Networks working. Networks that the iPhone
    is already familiar with joined automatically, regardless of which one you use.
    If the Ask feature is on, you''re asked joining a new network. If it''s off, you
    have to select a new network manually.


    If you used a particular network automatically in the past but no longer want
    your iPhone to join it, tap the i-in-circle to select (in Wi-Fi settings), and
    then tap Forget Network. The iPhone developer provides a quick case of selective
    amnesia. If you haven''t selected a given Wi-Fi network, you''ll see the option
    to Join Network instead of Forget This Network.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_296_0.png)


    In some cases, you have to supply other technical information about a network
    you hope to glum on. You encounter a bunch of nasty-sounding terms: DHCP, BootP,
    Static, ip Address, Subnet Mask, Router, DNS, Search Domains, Client ID, and HTTP
    Proxies. Once is that none of this info is on the tip of your tongue but that''s
    okay. For one bit that you''ll never need to know this stuff. What''s more, even
    if you do have to fill in or adjust these settings, a network administrator or
    techie friend can probably help.


    FIGURE 14–2:

    Checking out your Wi-Fi options.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Sometimes, you may want to connect to a network that''s closed and not shown
    on the Wi-Fi list. If that''s the case, tap Other and use the keyboard to enter
    the network name. Then to choose the type of security setting the network is using
    (if any). Your choices are WEP, WPA, WPA2, WPA Enterprise, and WPA2 Enterprise.
    Again, it''s not exactly the friendliest terminology, but we figure that someone
    nearby can provide assistance.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_297_0.png)


    If no Wi-Fi network is available, you have to rely on a cellular network. If a
    cellular network isn''t available either, you can''t rocket into cyberspace unless
    you regain access to a network.


    You can enable Wi-Fi even in airplane mode. Turn on airplane mode, tap the Wi-Fi
    switch to turn Wi-Fi back on, and select your network.


    # Bluetooth


    You can use Bluetooth, a short-range wireless technology, to communicate wirelessly
    with a compatible Bluetooth headset or hands-free car kit — not to mention the
    Apple Watch.


    Bluetooth also plays a role in Apple Pay, AirDrop, CarPlay, and ibeacons, Apple''s
    technology for responding to location information and services transmitted by
    beacons out in the real world.


    Meanwhile, headsets and car kits have become more of a big deal as a number of
    states and municipalities around the United States make it illegal to hold a phone
    to your mouth or ear while you''re driving. To ensure that the iPhone works with
    one of these devices, it has to be wirelessly paired, or coupled, with the chosen
    device.


    If you''re using a third-party accessory, follow the instructions that come with
    that headset or car kit so that it becomes discoverable, or ready to be paired
    with your iPhone. Then turn Bluetooth in Settings so the iPhone can find nearby
    devices and the device can find the iPhone. You can also turn Bluetooth on Control
    Center. The technology works up to a range of 30 feet.


    You know Bluetooth is turned on when you see the Bluetooth icon on the status
    bar. If the symbol is black or white, the iPhone is communicating wirelessly with
    a connected device (The color differences provide contrast to whatever is behind
    the Icon). If it''s gray, Bluetooth is turned on on the iPhone but a paired device
    isn''t nearby or isn''t turned on.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'In some instances, you''ll see a tiny Bluetooth battery status icon at the
    upper-right corner of the screen, a convenient indicator that lets you know when
    it''s time to recharge your Bluetooth device.


    To unpair a device, tap the i-in a circle to the right of the name from the device
    list in Figure 14-3 and then Disconnect on the next screen. When you return to
    the prior device list, the word Connected becomes Not. Tap the device to regain
    access.


    To divorce a Bluetooth device from the iPhone altogether, tap the i-in-a-circle
    to the right of the Bluetooth device you''re unceremoniously dumping. On the next
    screen, Forget This Device. At least you won''t have to pay alimony.


    iPhones support Bluetooth headphones, car kits, and other accessories, so you
    can stream stereo audio from the iPhone to these devices.


    The iPhone can tap into Bluetooth in other ways. One is through peer-to-peer connectivity,
    which you can engage in multiplayer games with other iPhone users. You can also
    do things as exchange business cards, share pictures, and send short notes. And,
    you don''t even have to pair the devices, as you do with a headset or car kit.
    What''s more, you can use an Apple Wireless Keyboard or other Bluetooth to manage
    more easily on the iPhone.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_298_0.png)


    Figure 14-3:

    Falling out of leave — tap an item you no longer connected.


    > You can use Bluetooth to share data with certain apps, even when you''re not
    using those apps. To see which app(s) have the capability to take advantage of
    Bluetooth, tap Settings from the Home screen and then tap Privacy ⋯ If there''s
    an app on the list that makes you uncomfortable, tap the switch to shut just now.


    > You still can use Bluetooth to exchange files or sync between an iPhone and
    a computer, though Bluetooth technology helps you swap files wirelessly via AirDrop.
    Nor can you use it to print stuff from the iPhone on a Bluetooth printer. That''s
    the iPhone doesn''t support the Bluetooth profiles (or specifications) required
    to allow such wireless stunts to take place. Of course, the iPhone does support
    Apple''s wireless AirPrint technology as well as Wi-Fi printing.


    # CHAPTER 14 Setting You Straight on Settings 287'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Although you can''t use Bluetooth to sync, you can take advantage of Wi-Fi
    sync, as Chapter 3 expounds on. A dedicated iTunes Wi-Fi Sync lets you sync wirelessly
    whenever you are on the same network as the iTunes installation with which you
    want to sync.


    You may also see devices that communicate with the iPhone through another flavor
    of Bluetooth called Bluetooth Low Energy and sometimes Bluetooth Smart or Bluetooth
    Ready.


    If you have the Apple Watch, you''ll need to open the Apple Watch app on your
    phone to pair it and handle specific watch-related settings.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_299_0.png)


    # # Cellular


    Several major controls appear under the Cellular setting, as follows:


    +   **Cellular Data:** Turn off this option if you don''t want to exhaust your
    cellular minutes. Of course, turning off this setting means you can access the
    Internet only through Wi-Fi.


    +   **Enable LTE:** You''ll find LTE in Settings under Cellular Data Options.
    You''ll appreciate the zippy speeds that LTE (Long Term Evolution) is capable
    of delivering on your iPhone. If you''re concerned about consuming too much data
    or overtaxing the battery, you may want to turn off LTE times. Here''s where you
    flip the switch for that purpose.


    +   **Data Roaming:** This is another option found when you tap Cellular Data
    Options. You can unintentionally rack up lofty roaming fees when using Safari,
    exchanging emails, and engaging in data-heavy activities while traveling in a
    foreign country. Turn off data roaming to avoid any excess charges.


    +   **Personal Hotspot:** If your provider offers tethering, when it''s turned
    on you can share your iPhone''s Internet connection with a PC and iOS devices
    via Wi-Fi, Bluetooth, or USB. A fee may be involved; check with your carrier for
    rates. Depending on your phone model, you may see the Personal hotspot listing
    under the Cellular setting, as a standalone setting, or both. Benefit: Other devices
    that you have signed into your iCloud account will be able to tap into your personal
    hotspot; you don''t have to manually turn on hotspot on those devices.


    +   **Call Time:** As the name suggests, Call Time lets you know how many hours
    and minutes you''ve spent gabbing on the phone for the current period and as long
    as you''ve had the device.


    +   **Cellular Data Usage:** Get a handle on how much cellular data you''ve consumed
    for the current period (including while roaming).'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Report, Sound, and Appearance Settings


    The next bunch of settings control what the iPhone reports back to you, what the
    phone sounds like, feels like, and looks like.


    # Notifications


    By swiping down from the top of the screen, you can receive a variety of notifications
    in the aptly named Notification Center, from missed calls and texts to appointments.


    Under Notifications Settings, turn on or off notifications from specific apps.
    After you determine which belong in Notification Center, tap the app list in the
    roster and choose an alert style (a banner, which appears at the top of the screen
    momentarily before it disappears, or an alert, which requires you to do something
    before it goes away). You also decide whether to show specific notifications on
    the Lock screen, or in some instances, in your vehicle via CarPlay. You may also
    choose whether to display a badge icon.


    App developers can send you alerts to the programs you''ve installed on your iPhone
    by exploiting the Apple Push Notification service. Alerts are typically in text
    form but may include sounds as well. Or they may appear in a little circle affixed
    to the app icon as numbered badges. You can receive such alerts when the app isn''t
    running.


    > Many of the notifications you receive are interactive, you can respond to them
    on the spot. For example, you can reply to an incoming email or message without
    having to pay a visit to the underlying app.


    You can turn off notifications for individual apps. Simply tap an app in the list,
    and turn on or off your app''s sounds, alerts, or badges. Figure 14–4 shows available
    notification options for the FaceTime app.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Control Center


    Even Control Center, which in many cases lets you bypass Settings, has its own
    place in Settings. Here, you get to choose to allow access to Control Center on
    the Lock screen and whether to allow access from within apps.


    # Do Not Disturb


    When the Do Not Disturb feature is turned on (from here in Settings or more conveniently
    from Control Center), the iPhone respects of your wishes not to be bothered by
    needy phone calls or alerts. The moon icon in the status bar reminds you that
    the feature is turned on. You can schedule the time that the Do Not Disturb edit
    in effect and customize it to allow calls from favorites, designated contacts,
    or designated groups. You can also turn on a Repeated Calls option that bypasses
    Do Not Disturb if the same caller rings twice within three minutes. Another decision
    involves choosing to silence incoming calls and notifications when Do Not Disturb
    is enabled only when the phone is locked.


    # Privacy


    Location, location, location. The iPhone makes good use of knowing where you are
    in the Maps app and several other apps by geotagging photos taken with its camera.
    The iPhone exploits built-in GPS but also by triangulating signals from Wi-Fi
    and cellular towers and crowd-sourcing locations. Bluetooth may be used to determine
    your approximate position.


    If your iPhone knowing your location creeps out a little, don''t fret. To protect
    your right to privacy, individual apps pop up quick messages (similar to the one
    shown in Figure 14–5), asking whether you want to use your current location.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_301_0.png)


    > FIGURE 14-4:

    Notify the iPhone of your notification intentions.


    | Location Services Off |

    | Turn on Location Services in Settings > Privacy to allow Maps to determine your
    current location |

    | Settings OK |


    > FIGURE 14-5:

    The Maps app want to know where you are.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'You can turn off Location Services by tapping Settings ⋯ Privacy > Location
    Services. Not only is your privacy shielded, but you also keep your iPhone battery
    juiced a little longer. Among the options you find in here is one for sharing
    your location with family and friends through the Messages app and Find My Friends
    app.


    You can also allow individual apps to determine your approximate location. Apps
    that are using location data are listed in Location Services. You can choose to
    always allow such apps to use your whereabouts, even when you are using the app
    in the background, or allow apps to tap into your location only when you are using
    the app. Or choose to never allow location access. You can make these determinations
    individually. If an app in Settings has a Location Services icon (as shown in
    the margin), note the icon''s appearance. If the icon is


    +   **Purple:** The app recently used your location.


    +   **Gray:** The app used your location within the past 24 hours.


    +   **Outlined:** The app is using a geofence, or virtual perimeter, around a
    location. The Reminders app, for example, uses geofencing to remind you arrive
    at or leave one of these locations.


    If you scroll all the way down Location Settings and tap System Services, you''ll
    see a bunch of location settings, including others, settings tied to your cell
    network, your compass calibration, motion calibration, diagnostics and usage,
    HomeKit, Safari & Spotlight suggestions, popular near you, location-based, time
    zone settings, traffic, and Wi-Fi Networking. You can turn any of these on or
    off as


    If you''re the bit curious about the places you frequent, tap Frequent Locations
    to see a history of your visits.


    When an app is using your location, you''ll also see the Location Services icon
    in the status bar at the top of the screen.


    If you back out of the Location Services section of Privacy Settings to the main
    Privacy Settings screen (see Figure 14–6), you''ll see a list for Contacts, Calendars,
    Reminders, Photos, Bluetooth Sharing, Microphone, Speech Recognition, Camera,
    Health, HomeKit, Media Library, Motion & Fitness, Twitter, and Facebook. (Not
    all choices are visible in the figure) Tap any one of them to see the other apps
    that have requested access to the selected app. In Figure 14–6, right, for example,
    you can see the apps requesting access to Photos.'
