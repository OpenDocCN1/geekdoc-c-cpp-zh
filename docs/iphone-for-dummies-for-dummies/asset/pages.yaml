    # Storing pictures in the (iCloud)


    As mentioned, the iCloud service, any photo you take with the iPhone or other
    iOS 8, 9, 10 device can be automatically stored in the cloud and pushed to another
    iPhone, or your PC, Mac, iPad, iPod, Apple TV (third generation or later). The
    transfer takes place through the magic of iCloud Photo Sharing, the antidote to
    the endless problem, “I''ve snapped a picture!” Pictures are uploaded when your
    iCloud devices are connected to Wi-Fi.


    And you no longer fret about storage space when using iCloud Photo Sharing. Apple
    used to store the last 1,000 pictures you took over a 30–day period in a special
    (called) Photo Stream album—enough time, Apple for all your devices to connect
    and grab those images, because a Wi-Fi connection was your only requirement. All
    the pictures you took on your PC or Mac, because the 1,000–picture limit on iOS
    devices no longer applies. Again, you can always move images that you have in
    the cloud into other albums on your iPhone or other iOS devices and computers,
    which you want to view pictures when you don''t have an Internet connection.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_201_0.png)


    There''s a catch to using the iCloud Photo Library: You have to pay for storage.
    You get 5GB of iCloud storage gratis, but shatterbugs use that amount in a flash.
    You can get 50GB of storage for $9.9 a month, 200GB for $2.99 a month, 1 terabyte
    for $9.9 a month, or 2 terabytes for $19.99 a month.


    Photos taken on the iPhone are whisked to the cloud until you leave the Camera
    app. In way, you get a chance to delete pictures that you''d rather have turn
    everywhere. But after you leave the Camera app, all the pictures are saved in
    All Photos (found in the list of Albums in the Photos app), including pictures
    that arrived as email attachments that you saved as well as screen captures on
    the phone. We found this last feature when writing this book.'
