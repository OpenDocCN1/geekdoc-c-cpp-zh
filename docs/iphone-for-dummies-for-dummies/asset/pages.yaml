    lets you switch to a zoom in which the text is zoomed but the keyboard that you
    are typing on is not.


    >> Larger text: Yes, you see the Larger text setting listed even though the aforementioned
    Text Size setting slider (under Display & Brightness) functions the same way.


    >> Bold text: If you don''t think the text is bold or bright enough, consider
    using the Bold Text switch. By doing so (or turning it off) requires that you
