  md: '# Find your direction


    Here''s one last cool map trick: Tap the current location icon (in the lower-left
    corner of the Maps app) two times and the blue marker grows a little blue cone
    that indicates the direction you''re facing


    Also note when the map is in what we like to call "compass mode," the current
    location in the lower-left corner grows a little blue tip (as shown in the margin),
    to let you know you are using compass mode.


    If you rotate to face a different direction while Maps is in compass mode, the
    map rotates in real time. So the map always displays the direction you''re facing,
    even if you''ve moved around a bit, which is pretty darn cool.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_285_0.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_285_1.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_285_2.png)


    # Dude, where''s my car?


    In iOS 10, Maps automatically drops a pin wheneveru201d park your car so you can
    find it later. The feature works with any car that connects to your iPhone via
    Bluetooth or CarPlay. If yours does, whenever you disconnect the phone and leave
    the car, the location will be marked with a car pin.


    > FIGURE 13-9:

    The cone says I''m facing north.


    To enable (or disable) the Show Parked Location feature, tap Settings\u2314 Maps
    and enable the Show Parked Location switch.


    Once enabled, you can find your parked car by tapping the search field and choosing
    Parked Car from the suggestions list or asking Siri, \u201dWhere is my car parked?\u201d


    # Contemplating the Compass


    Speaking of compasses, your iPhone includes a Compass app, which works a magnetic
    needle compass. Launch the Compass app by tapping its icon in the Extras folder
    on the second Home screen.'
