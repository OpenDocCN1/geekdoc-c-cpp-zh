    Permit us to explain. We hope you''ve admired the pictures of the iPhone screens
    that we are sprinkled throughout this book. We also secretly hope that you''re
    thinking what marvelous photographers we must be.


    FIGURE 19-6:

    Slide the app you want to quit up and off the screen.


    Well, the fact is, we couldn''t take a blurry picture of the iPhone using its
    built-in screen-grab feature if we wanted to.


    Press the sleep/wake button at the same time you press the Home button, but just
    for an instant. The iPhone grabs a snapshot of whatever is on the screen. The
    picture lands in the iPhone''s Camera Roll; from there, you can synchronize it
    with your PC or Mac, along with all your other pictures. And from there, the possibilities
    are endless. Why, your picture could wind up just anywhere, including in a For
    Dummies book.'
