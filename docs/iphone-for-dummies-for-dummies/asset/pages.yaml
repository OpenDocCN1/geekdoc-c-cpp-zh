  md: '# IN THIS CHAPTER


    +   >> Setting up accounts


    +   >> Reading and managing email messages


    +   >> Sending email messages


    # Chapter 12

    The Email Must

    Get Through


    Chapter 6 shows how well your iPhone sends SMS text messages, MMS messages, and
    iMessages. But such messages aren''t the iPhone''s only written communication
    trick, not by a long shot. One of the nifty things your iPhone can do is send
    and receive real, honest-to-gosh email, using Mail, its modern email app. It''s
    designed not only to send and receive email messages but also to handle rich HTML.
    email messages — formatted email messages complete with font type styles and embedded
    graphics.


    Furthermore, your iPhone can read several types of file attachments, including
    PDF, Microsoft Word, PowerPoint, and Excel documents, as well as stuff produced
    through Apple''s own productivity software, which is output from Pages, Numbers
    and Keynote. Better still, all this sending and receiving of text, graphics, and
    documents can happen in the background so that you can surf the web or talk to
    a friend while your iPhone quietly and handles your email behind the scenes.


    The Mail app is compatible with the most popular email providers: Yahoo! Mail,
    Gmail, AOL, Outlook, and Apple''s own iCloud service. As part of iCloud, Apple
    issues you a free, ad-free iCloud.com email address.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'As you discover in this chapter, you can access a unified inbox of all your
    email accounts (assuming you have multiple accounts). Moreover, you can organize
    messages by thread, or conversation. You can best VIP status to your most important
    senders. And through the Continuity and Handoff features, you can start composing
    an email on your iPhone and finish it on a Mac with OS Yosemite, OS X El Capitan,
    or macOS Sierra.


    # # Prep Work: Setting Up Your Accounts


    First things first. To use Mail, you need an email address. If you have broadband
    Internet access (that is, a cable modem, FIOS, or DSL), you probably received
    one or more addresses when you signed up. If you''re one of the handful readers
    who doesn''t already have an email account, you can get one free from Yahoo! (http://mail.yahoo.com),
    Google (http://mail.google.com), Microsoft (www.outlook.com), AOL (www.aol.com),
    or one of many service providers.


    > > Some free providers add a bit of advertising at the end of your outgoing messages,
    though the practice is decreasing. Still, if you''d rather not be a billboard
    for your email provider, check out your numerous options, starting with your broadband
    Internet access (address) that you have (username@comcast.net or username@email.net,
    for example). You might also pay a few dollars for a premium email account that
    doesn''t track advertising (or anything else) onto your messages, though that
    is rarely necessary anymore. As mentioned, you can get a free email account as
    part of Apple''s iCloud service.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_245_0.png)


    # ## Setting up your account the easy way


    Chapter 3 explains the option of automatically syncing the emails on your computer
    with your iPhone. If you choose that option, your email accounts should be configured
    on your iPhone alone. You may proceed directly to the later section, "Darling,
    You Send Me (Email).",


    If you haven''t chosen that option but want to set up your account the easy way,
    go to Chapter 3 and read the section on syncing mail with the iPhone. Then you,
    too, can proceed directly to the "Darling, You Send Me (Email)" section.


    # ## Setting up your account the less way


    If you don''t want to sync the emails on your computer, you can set up an email
    account on your iPhone manually. It''s not quite as easy as clicking and syncing
    your iPhone, but it''s not rocket science.'
  merge: -1
  img_proc: true
