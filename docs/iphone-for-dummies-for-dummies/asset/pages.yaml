    and so) takes greeting you on a screen with a gray background.


    If the phone is shipped to the Apple Store, you get a Connect to iTunes screen
    so that the device can connect to your provider''s servers and perform the activation.
    Or you can compute-free through iCloud. Slide your finger to the right to continue
    the setup, and you go off. Even if the phone is activated in the store, you have
    several decisions to make: Do you want to set up the device as a new iPhone, restore
    the phone from an iCloud backup (the next chapter), or restore it from an iTunes
