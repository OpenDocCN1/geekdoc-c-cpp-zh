    # Date & Time


    In our neck of the woods, the time is reported as 11:32 PM (or whatever time happens
    to be). But in some circles, it''s reported as 23:32. If you prefer the format
    on the iPhone''s status bar, the 24-Hour Time setting (under Date & Time) to turn
    on the setting.


    This setting is just one that you can adjust Date & Time. You can also have the
    iPhone set the time automatically, using the time reported by the cellular network
    (adjusted for your time zone).


    If you''ve turned off the option to set the time automatically, you''re asked
    to select the time zone and then set the date and time manually. Here''s:


    +   1. Tap Set Automatically so that it''s off.


    You see fields for setting the time zone and the date and time.


    +   2. Tap the Time Zone.


    The current time zone and virtual keyboard are shown.'
