    When you''re ready to watch the sped-up sequence, tap play as you do with any
    other video.


    # Editing what you shot


    We assume that you captured some really great stuff — as well as some footage
    that belongs to the cutting room floor. That''s not a problem because you can
    perform simple edits on your iPhone. Just do the following:


    +   1. Tap a video recording to display the on-screen controls, and then tap the
    Edit icon (shown in the margin).


    +   2. Drag the start and end points along the timeline to select only the video
    you want to keep, as shown in Figure 10-6.'
