  md: '# Threading messages


    Apple lets you thread messages, or have automatically group related misses. The
    beauty of this arrangement is that you can easily trace an email conversation.


    When you organize messages by thread or conversation, the related messages show
    up as a single entry in the mailbox, with a box-right arrow pointing you that
    the message is part of a larger ongoing exchange. If a message is not part of
    a thread, you see a single arrow. Figure 12–12 (left) shows that Bob and Susan
    are part of the same conversation in Ed—the listing reveals pretty the eight outlying
    messages that make up the conversation. Only two portions of them are visible
    in Figure 12–12 (right); you’d have to scroll to see the rest of the messages.


