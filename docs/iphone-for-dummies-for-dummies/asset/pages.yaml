- pgno: 57
  md: 'Be careful not to swipe down from the very top edge of the screen. That gesture
    pulls Notification Center instead of Spotlight search although with iOS 10, Spotlight
    is also available at the top of Notification Center.


    Press and hold down the Home key for more than a second or so to summon Siri (unless
    you turn the Siri feature off in Settings) or to summon Voice Control on older
    models.


    # # Organizing Icons into Folders


    Finding the single app you want to use among apps spread out over 15 screens is
    a daunting task. But Apple felt your pain and added a handy organizational tool
    called Folders. The Folders feature enables you to create folders, each holding
    dozens of apps. You might want to create folders for social apps, photos, travel-related
    apps, and any other number of categories.


    To create a folder, press your finger against an icon until all the icons on the
    screen jiggle, as shown in Figure 2-13, left. Decide which apps you want to move
    to a folder, and drag the icon for the first app on top of the second app. In
    the figure, we''re dragging the Withings app on top of the Health app, as shown
    in Figure 2-13, right. Apple names the folder according to the category of apps
    inside the folder, but you can easily change the folder name by tapping the X
    in the bar where the folder name appears and substituting a new name.


    To launch an app that''s inside a folder, tap that folder''s icon and tap the
    icon for the app that you want to open.


    Apps can be dragged into and out of any folder. As of iOS 9, you can stash up
    to 9 apps per page in a folder and have as many as 15 pages. That''s a grand total
    of 135 (more, we speak, than you''d possibly ever to tuck away in a folder). If
    you drag all apps outside the folder, the folder automatically disappears.


    Folders are a great organizational tool. But if you have numerous apps on the
    phone, it''s all easier to create and arrange folders not from the phone when
    syncing your iPhone in iTunes.


    3D Touch comes into play if you have the 6s, 6s Plus, SE, 7 or 7 Plus and want
    to get all the icons to jiggle so can rearrange them. You can still make that
    happen on such models, but you may have to practice. In our experience, extremely
    gently touch is required. Otherwise, you might bring up a share icon on the icon
    you touch or Rename on a folder.'
