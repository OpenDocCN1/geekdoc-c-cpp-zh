  md: 'To turn threading, go to the Home screen and tap Settings > Mail > Organize
    Thread. Finally, tap the switch so that it is visible, as shown in Figure 12-13.
    You may have to scroll down to see the Organize Thread setting. While in Settings,
    you can choose to place the most recent message in a thread on top by enabling
    that. Still another threading option lets you display all the messages that make
    up a conversation, even if some have been moved to other mailboxes. If that is
