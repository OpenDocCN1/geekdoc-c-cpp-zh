- pgno: 89
  md: 'You can designate new favorites by tapping the + symbol at the upper-right
    corner of the screen. Doing so brings you back to Contacts. From there, select
    the appropriate-person and number.


    You can add a contact''s FaceTime listing as a shortcut to a FaceTime audio or
    video call, which we get to later in the chapter.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_89_0.png)


    # Recents


    Tapping the Recents icon displays the iPhone call log. The Recents feature logs
    logs of all, well, recent calls made or received, as well as calls you missed.
    Tap to show all the recent calls or missed to show just what you missed. Under
    the All list, completed calls and missed calls that have been returned by tapping
    the red entry are shown in black, and missed calls that haven''t been returned
    in this fashion are red, with a descriptor of the phone you were calling or received
    a call from (home, mobile, or location). You also get an indicator of whether
    the call was a phone call or FaceTime call.


    By tapping the $i$-in-circle to an item in the list, you can find out the calls
    were made or missed, as well as any new info about the caller from your Contacts
    information. Also shown is the length of the time you spoke to the person, assuming
    a conversation took place.


    To return a call, tap anywhere on the name.


    If one of the calls you missed came from someone who isn''t already in your Contacts,
    you can add that person. Tap the right-pointing arrow, and then tap Create New.
    If the person is among your contacts but has a new number, tap Add to Existing
    Contact and choose the contact from your list.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_89_1.png)


    Tap Share to share a contact with a friend, family member, or colleague. You have
    the option to send that person an email or a message (MMS, text, or iMessage message).
    The contact info is already embedded in the message that you send.


    You can share with people also using the wireless AirDrop feature, which works
    on the iPhone 5 and later models. For more on AirDrop, read Chapter 7.


    You can clear an individual entry from the Recents list by swiping right to left
    on a name and tapping the red delete button. Or tap Edit, the red circle next
    to an entry, and then tap the red delete button.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_89_2.png)


    Meantime, if you press down on a name or number in the Recents list on a 3D Touch–capable
    iPhone, you can add the person as a contact or modify an existing contact. You
    can also use alternative ways to connect to that person again, perhaps via an
    iMessage or FaceTime.'
