- pgno: 12
  md: '# Introduction


    Precious few products ever come close to generating the kind of buzz seen with
    the iPhone. Its messianic arrival receives front-page treatment in newspapers
    and top billing on network and cable shows year after year. People line up days
    in advance to ensure landing one of the first units. Years from now, people will
    still insist, "I was there on day one."


    But we trust you didn''t pick up this book to read yet another account about how
    your year''s iPhone launch was an epochal event. We trust you did buy the book
    to find out how to get the very out of your remarkable device. Our goal is to
    deliver information in an informed but light and breezy fashion. We expect you
    to have fun using your iPhone, and we hope you have spending time with us.


    # About This Book


    Let''s get one out of the way right from the get-go. We think you''re pretty darn
    smart for buying a For Dummies book. That says to us you have the confidence and
    intelligence to know what you don''t know. The For Dummies franchise is built
    around the core notion that all of us feel insecure about topics when tackling
    them for the first time, especially when these topics have to do with technology.


    As with most Apple products, every iPhone to date is beautifully designed and
    intuitive to use. And though our editors may not want to reveal this little secret
    (especially on the first page, for goodness'' sake), the truth is you''ll get
    pretty far by exploring the iPhone''s many functions and features on your own,
    without the help of this (or any other) book.


    Okay, now that we spilled the beans, we''ll tell you you shouldn''t run back to
    the bookstore and request a refund: This book is chock-full of useful tips, advice,
    and other nuggets that will make your iPhone experience all the more pleasurable.
    So keep this book nearby and consult it often.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'But before you that, let us tell you a bit about how we go about our business.
    iPhone For Dummies, 10th Edition, makes generous use of numbered steps, bullet
    lists, and pictures. Web addresses look like this: www.boblevitus.com. For reading
    the e-book version, links are live so you can click them.


    We also include sidebars with information that is not required reading (not that
    any of this book is) but that we hope will provide a richer understanding of certain
    subjects. Overall, we aim to keep technical jargon to a minimum, under the principle
    that with rare exceptions you need not know any of it really


    # Foolish Assumptions


    Although we know what happens when you make assumptions, we''ve made a few anyway.
    First, we assume that you, gentle reader, know nothing about using an iPhone or
    OS — beyond what an iPhone is, that you want to use iOS, that you want to understand
    your iPhone and its operating system without digesting an incomprehensible technical
    manual, and that you made the right choice by selecting this particular book.


    And so, we do our best to explain each new concept in full and loving detail.
    Haps''that your foolish, . . .oh, well.


    One last thing: We also assume that you can read. If you can''t, please ignore
    this paragraph.


    # Icons Used in This Book


    Little round pictures (icons) appear in the left margin throughout this book.
    Consider these icons miniature road signs, telling you something extra about the
    topic at hand or hammering a point home.


    Here''s what the five icons used in this book look like and mean.


    This text contains the juicy morsels, shortcuts, and recommendations that make
    the task at hand faster or easier.


