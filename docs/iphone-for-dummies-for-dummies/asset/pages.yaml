- pgno: 219
  md: 'You can capture still images while you''re shooting video as well. Tap the
    white camera icon that appears when you''re shooting video (labeled in Figure
    10-4, bottom). If you''re shooting in landscape mode, which is often recommended
    for video, the white camera icon appears whether you''re using the rear-facing
    Isight camera or the front-facing FaceTime camera.


    If you''re shooting in 4K, you can grab an 8-megapixel still image while doing
    so.


    Videos that you shoot on the iPhone in the All Photos album, where they are identified
    by the video length on their thumbnail, as well as by their own special Videos
    listing in the Photos app. If you shoot a slow motion video (read the next section),
    it lands in the All Photos album too, and also shows up in the Videos album and
    its own slow-mo album. Apple supplies a dedicated album for time-lapse videos.


    If you have a 3D Touch-capable iPhone, you can get a quick start on shooting.
    Press your finger against the Camera app and choose Record Video Slo-mo, a handy
    lead-in to the next section.


    # Going slow


    If you have the iPhone 5s or later, you get another shooting benefit: the capability
    to capture video in slow motion, which we think is truly nifty. You''ll love back
    in slow motion your kid''s amazing catch in the varsity football game, like the
    TV networks do show super plays by the pros.


    On the 6 and 6 Plus, you have the option to shoot slow-mo at 720 and 240 FPS.
    Choose Settings > Camera & Record Slo-mo, and then choose 720p at 120 FPS or 720p
    at 240 FPS. On the 6s, 6 Plus, SE, 7, and 7 Plus, you can record slo-mo at 1080p
    HD at 120 FPS or 720p at 240 FPS.


    After shooting, you get to select where to play back the video at quarter speed,
    and we show you in a moment.


    But first things: You have to grab the video before you can play back. To shoot
    in slow motion, launch the Camera app and select Slo-Mo as your shooting format
    of choice.


    Shoot your slow-motion footage the same way you shoot at regular speeds. Note
    that the white circle surrounding the red shutter icon has teeny-tiny lines around
    it.'
