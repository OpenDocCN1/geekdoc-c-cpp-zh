- pgno: 51
  md: 'If you have the iPhone 6s, 6s Plus, SE, 7 or 7 Plus, you can apply 3D Touch
    to turn your on-screen keyboard into a trackpad, which we find is really useful.
    Say you''re opening an app such as Mail or Notes, in which you typically summon
    a keyboard to write a message or note. Now press down against the keyboard that
    you want to edit that message or note. When the keys disappear later, you can
    drag your finger along what is now a trackpad, correspondingly moving the cursor
    in the message or to the spot in which you want to make a change. Lift your finger
    off so that the keys reappear. You''re now in a position to type again.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_51_0.png)


    # Choosing an alternative keyboard


    Apple permits you to choose an alternative keyboard from a third-party app developer,
    a boon to the producers of Swiftkey, Swipe, and Fleksky keyboards among others,
    that debated on the rival Android mobile operating system. Some third-party keyboards
    let you swipe gestures that is, gliding rather than lifting your finger from one
    key to the next. If you''ve tried and liked this input method on other phones,
    you''ll appreciate being able to employ it on your iPhone.


    Figure 2-8: Magnifying errors.


    In the App Store, you can fetch new keyboards some are free and require a modestum.
    After you download it visit Settings > General > Keyboards > Add New Keyboard
    and select your keyboard. Then, press and hold down the globe key on the iPhone''s
    keyboard and select your keyboard in the list that appears. Alternatively, keeping
    the globe key until the keyboard takes over.


    # Cutting, copying, pasting, and replacing


    Apple adds pizzazz to the usual cut, copy, and paste functions, and provides another
    helpful remedy for correcting errors: A replace pop-up option appears when you
    double-tap a word. (A Look Up option is here too)


    Here''s how to exploit the copy-and-paste feature. Say you''re in the Notes app,
    jotting down ideas that you want to copy in an email message. Double-tap a word
    to select'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'it, and then drag the grab points or handles to select a larger block of text,
    as shown in Figure 2–9. (You can use the handles to correct selected text too.)
    After you''ve selected the text, tap Copy. (If you want to delete the text block,
    tap Cut instead.)


    Now open the Mail program (see Chapter 12) and start composing a message. When
    you decide where to insert the text you just copied, tap the cursor. Up pop commands
    to Select, Select All, and Paste, as shown in Figure 2–10. Tap Paste to paste
    the text into the message.


    Here''s the pizzazz part. If you make a mistake while you''re cutting, pasting,
    replacing, or typing, shake the iPhone. It gives you the option to undo the last
    edit or action.


    Or suppose you notice a typo in what you''ve entered. Select the word, and you''ll
    see the Replace option you mentioned above with the other options, as shown in
    Figure 2–11, top. Tap Replace and the iPhone serves up a few suggested replacement
    words, as shown in Figure 2–11, bottom. If you have the word in mind as a substitute,
    tap it and the iPhone automatically makes the switch.


    # FINGERS OR THUMBS?


    We are we with fingers. (Notice a trend here?) Should you use your fingers or
    thumbs to type? We use both, but your preference may depend on the size of your
    iPhone''s display. It seems somewhat easier to hold the iPhone in your nondominant
    hand (that is, your left hand if you''re right-handed or vice versa) and with
    the index finger of your dominant hand, especially when you''re starting out with
    the iPhone. And that''s what we suggest try first.


    When you get the hang of typing with one index finger, try to speed things up
    using both hands. You can type two-handed in two ways:


    +   - Set the iPhone on a sturdy surface (such as a desk or table) and tap with
    both index fingers. You can''t easily use this technique when you''re standing
    up with no stable surface at the height.


    +   - Cup the iPhone with both hands and type with thumbs. This technique has
    the advantage of being possible in almost any situation, or without a sturdy surface.
    The downside is that your thumbs are bigger than your other fingers, so typing
    accurately with them takes more practice — and if you larger-than-average thumbs,
    you''re flirting with trouble.


    Which technique is better? Don''t ask us — try ways and use the method that feels
    the most comfortable or lets you with the best accuracy. Better still, master
    techniques and use whichever is more appropriate at the time.'
