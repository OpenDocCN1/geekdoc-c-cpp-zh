- pgno: 222
  md: '# Sharing video


    Unlike other video on your iPhone, you can play back what you''ve just shot in
    portrait or landscape mode. And if the video is any good (and why wouldn''t it
    be?), you''re likely going to want to share it with others. To do so, display
    the playback controls by tapping the screen, and tap the share icon, which appears
    all the way to the bottom left of the screen (in the margin). You have several
    options: Make the video part of a slideshow (see Chapter 9), email it, include
    it in a message or in your Notes app, or send it to iCloud Photo Sharing, Facebook,
    Vimeo, or YouTube. (You have additional options if you''ve enabled a Chinese keyboard.)
    You can also add the video to the Notes app, or send it via AirDrop to a person
    who is nearby and carrying his or own AirDrop-compatible device.


    To help you remember a video that''s worth sharing, tap the heart icon that appears
    with the playback controls to designate it a favorite. As noted in Chapter 9,
    you can also tap the heart for still images.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_222_0.png)


    # Watching video on TV


    The Retina display on the iPhone is worth boasting, but sometimes you want to
    watch videos on your iPhone on a larger television. Apple affords you several
    ways to do:


    +   **Add a cable:** Apple is all too happy to sell you a cable to connect the
    iPhone to a TV. The cable you choose depends on your TV setup, the available ports,
    and the iPhone model you use. Wired connections include an A/V adapter and HDMI
    cable (iPhone 4); a composite A/V adapter and a VGA adapter and VGA cable. Apple
    sells its Digital AV adapter for $49 and Lightning-to-VGA adapter for the same
    price. Some older cables no longer be available directly from Apple, but you can
    typically find them online for less money.

    **Use wireless streaming:** You''ve heard us mention AirPlay, a wonderful feature
    for people who have iPhones and Apple TV boxes. If you''re watching video, tap
    the AirPlay icon or summon it from Control Center, and choose an Apple TV unit
    from the list of AirPlay devices that shows up. If all goes well, the video you''re
    watching now appears like magic on your TV set. If it doesn''t go well, make sure
    the Apple TV is tapping into the same wireless network as your phone.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'You can take AirPlay streaming one step further and exploit the AirPlay Mirroring
    feature. It lets you share, or mirror, to a TV anything on the iPhone screen —
    not just videos or music, but also games, pictures, web pages, and so on. As you
    rotate the iPhone from portrait to landscape or back, AirPlay Mirroring follows
    the big screen. We think you''ll agree that the feature is cool and useful, especially
    if you want to share what you''re watching or with a larger audience. Note, however,
    that the quality of the experience is related to the quality of your network connection.


    # Restricting video and other usage


    If you''ve given an iPhone to your kid or someone who works for you, you may not
    want them spending time watching videos. You want him or her to do something more
    productive, such as homework or the quarterly budget.


    That''s where parental (or might we say “Mean Boss”) restrictions come in. Please
    note the use of this iron-first tool you can make unpopular.


    Tap Settings ↩︎ General ↩ Restrictions. Then tap Enable Restrictions. You''ll
    be asked to establish a passcode by entering it twice. Or enter a previously established
    passcode. Having done so, in the Allowed Content section, tap Movies, Shows, and
    any other content you want to restrict. Choose the Don''t Allow option for each,
    or choose a movie rating or a TV show rating (PG or whatever) or both that you
    feel comfortable watching the youngsters. If you make any specific app no-no,
    when you return to the Home screen the icon for that app is missing in action
    and you can''t search for it using Spotlight. Goes for other restricted activities.
    To restore privileges, go back to Restrictions and tap Disable Restrictions. You''ll
    have to reenter your passcode.


    You can apply restrictions to Safari, the Camera app, FaceTime, iTunes, Siri and
    Dictation, AirDrop, and more, as you see when we delve into Settings further (see
    Chapter 14).


    With that, let''s roll the closing credits to this chapter.'
