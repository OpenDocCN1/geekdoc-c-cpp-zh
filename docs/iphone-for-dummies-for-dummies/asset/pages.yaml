    # Flickr and Vimeo


    These two settings let add your user credentials to Flickr, the Yahoo!-owned photo-sharing
    site, and to Vimeo, a popular destination to share your videos and discover others.


    # Sorting and displaying contacts


    Do you think of us as Ed and Bob or Baig and Levit? The answer to that question
