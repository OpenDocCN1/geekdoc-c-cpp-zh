    # Setting corporate email


    The iPhone is friendly for business users, in large measure because it makes nice
    with the Microsoft Exchange servers that are a staple in large enterprises.


    What''s more, if your company supports something known as Microsoft Exchange ActiveSync,
    you can exploit push email (messages are pushed to your iPhone automatically as
    opposed to being pulled (on a schedule) so that messages arrive


