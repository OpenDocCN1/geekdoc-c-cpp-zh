  img_proc: true
- pgno: 60
  md: 'timely at-glance views of everything you want to keep on top of: new emails,
    texts, the current temperature, appointments and reminders, tweets, and more.
    To display Notification Center, drag it down like a window shade from the top
    of any screen. Get to the Today screen, swipe from right to left from the Home
    or Lock screen. While we''re at it, we''ll mention swiping from left to right
    on the Lock screen summons the iPhone’s Camera app. But we digress.


    Notifications in Notification Center are segregated when they come in (Recent,
    Yesterday, Thursday, and so on) and appear as Mail message notifications, phone
    call notifications, and notifications from apps (with your prior permission).
    You might see TODAY notifications — typically headlines of breaking news — are
    with other USA TODAY notifications, mixed in with the financial tidbit notifications-
    you get from, say, CNBC.


    Notifications are now interactive or actionable — something made even so on iPhone
    models with 3D Touch. That means you can respond to them immediately for example,
    you can accept or decline a Calendar invitation. Without leaving the app you''re
    working in, you can reply to an email or message. Notification Center, meanwhile,
    you can mark off reminders from your to-do list.


    The today view displays widgets or notifications pertaining to the day you are
    viewing, of course, but it also may clue you in what''s next on your calendar,
    say, even if what''s next is the day. But today is called today for a reason.
    You''ll know whether to do a raincoat or run out and buy a last-minute birthday
    gift for your officiate who is celebrating the Four-O. You''ll know what''s on
    the immediate agenda. And you can also get a read on how the stocks in your portfolio
    are performing.


    If you scroll to the bottom of the today view, you can tap an Edit button that
    gives you a bit more control over the items and widgets in your today view and
    the order in which those lists appears. You can remove the notifications you see
    in this view (or not) rearrange the order in which, among others, the Stocks,
    Calendar, and Reminders appear. Notifications from some third-party apps can also
    show up in the today view.


    Apple has also opened up Notification Center to third-party developers, enabling
    you to respond to notifications from some of your favorite apps.


    To dismiss an individual notification, lightly press the notification using 3D
    Touch and the X. If that notification represented an email, your 3D Touch option
    might be to archive the message or mark it as read. You can also tap an X to clear
    an entire day''s worth of notifications, or press a little harder to Clear All
    Notifications. You can also dismiss individual notifications by swiping the notification
    from left to right and tapping Clear.


    # CHAPTER 2 iPhone Basic Training


