- pgno: 30
  md: '# Home Sweet Home Screen


    The first page of your Home screen offers a bevy of icons, each representing a
    different bundled app or function. Because the rest of the book covers each and
    every one of these babies in full and loving detail, we merely provide brief descriptions
    here.


    To get to the first Home screen, press the Home button. If your iPhone is asleep
    when you press the button, the Unlock screen appears. Once unlocked, you''ll see
    whichever page of icons was on the screen when you went to sleep. If that screen
    happens to be on the first Home screen, you''re golden. If it wasn''t, press the
    Home button again to summon your iPhone''s first (main) Home screen.


    Three steps to rearrange icons on your iPhone:


    +   1. Press and hold down on any icon until all icons begin to jiggle.

    2. Drag the icons around until you''re happy with their positions.

    3. Press the Home button to save your arrangement and stop the jiggling.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_30_0.png)


    # the first Home screen


    If you haven''t rearranged your icons, you should see the following apps on your
    first Home screen, starting at the top left:


    +   **Mail:** This app lets you send and receive emails with most POP3 and IMAP
    email systems and, if you work for a company that grants permission, Microsoft
    Exchange accounts, too.


    +   **Calendar:** No matter what calendar program you prefer on your Mac or PC
    (as long as it is Calendar, Microsoft Entourage, Outlook, or Exchange, or the
    online calendars from Google or Yahoo!), you can synchronize events and alerts
    between your computer and your iPhone. Create an event on one, and it''s automatically
    synchronized with the other next time they''re synced. Neat stuff.


    +   **Photos:** This is the iPhone''s photo manager. You can view pictures that
    you took with the iPhone''s built-in cameras, transferred through email, saved
    from Safari, or acquired as part of your Photo Stream. You can zoom in or out,
    create slideshows, email photos to friends, and much more. Other phones may let
    you take pictures; the iPhone lets you enjoy them in many ways.


    +   **Camera:** Use this app when you want to shoot a picture or video with one
    of the iPhone''s built-in cameras.


    CHAPTER 1 Unveiling the iPhone 19'
