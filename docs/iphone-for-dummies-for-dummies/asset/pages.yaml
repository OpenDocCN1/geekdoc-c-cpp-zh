    News. You can buy single issues of a magazine or,, and subscribe and share some
    articles without a subscription.


    You have to possibly subscribe to some of these newspapers and magazines, and
    (if not all) of them contain ads (somebody has to pay the freight).


    # # News


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_342_0.png)


    The second path to periodicals is iOS 10''s overhauled News app, which replaced
    iOS 8''s Newsstand app. Now you have a single app that gathers news articles,
    images, and videos you might be interested in and displays in a visually appealing
    fashion. Participating publishers at launch include ESPN, The New York Times,
    Hearst (publisher of Bob''s newspaper, the Houston Chronicle), Time, Inc., CNN,
