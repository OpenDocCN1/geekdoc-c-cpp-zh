- pgno: 350
  md: 'This action erases all your data and media and resets all your settings.


    If your computer isn''t available, you can trigger this step from your iPhone
    by tapping Settings > General > Reset Erase All Content and Settings.


    All your data and media should still exist on your computer or iCloud, with the
    possible exception of photos you''ve taken since your last sync if you aren''t
    using Photo Stream or iCloud Photo Library or both, plus any contacts, calendar
    events, notes, and playlists you created or modified that haven''t synced to iCloud.
    You may also lose any iTunes or App Store content you''ve purchased or downloaded
    on the iPhone since its last sync, but you can download them again at no cost
    if they disappear. In other words, you probably won''t lose anything by restoring.
    It''s a hassle and your new sync will take much longer than usual. And you''ll
    have to reconfigure all settings you''ve changed since you got your iPhone. But
    other those inconveniences, restoring shouldn''t cause you trouble.


