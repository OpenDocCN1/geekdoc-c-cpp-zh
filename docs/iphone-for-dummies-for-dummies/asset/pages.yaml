    # Multitasking


    Multitasking simply lets you run numerous apps in the background simultaneously
    or easily switch from one app to another. For example, music from a third-party
    app like Slack can play in the background while you surf the web, peek at pictures,
    or check email.


    But that''s not if you use an Internet voice-calling app as Skype, you will be
    able to receive notification of an incoming call even if you haven''t launched
    the Skype app. The multitasking feature also allows a navigation app using GPS
    update your position while you are listening to an Internet radio app as Pandora.
    From time to time, the navigation app or Apple''s own Maps app will pipe in with
    turn-by-turn directions, lowering the volume of the music so you can hear the
    instructions.


    In another example, you can leave notes in the Evernote app while checking out
    a web page.


    Multitasking couldn''t be easier — and it has gotten a lot smarter through the
    years. Now your iPhone can anticipate your needs. If it detects over that you


