    ![](img/8361dd8dda9818e97bf48313b13b8d6b_339_2.png)


    TIP


    And but not least, we''d be remiss if we didn''t provide the following reminders.
    Remembering where you put a particular screen of apps and folders can be difficult.
    When that happens, Spotlight can quickly find and launch apps no matter which
    Home screen they''re on or folder they''re in. Or Siri to open the app by name.
    Finally, take advantage of multitasking (by double-tapping the Home button) to
