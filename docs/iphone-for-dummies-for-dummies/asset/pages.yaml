    The next request differs by phone and has to do with security, something no one
    should take lightly. You''re given the option to create a passcode to prevent
    anyone from getting to the contents of your device without knowing code.


    But if you have the iPhone 5s or later, you''re asked whether you want to set
    Touch ID, Apple''s name for a nifty fingerprint authentication system. This feature
    is worth a deeper dive.


    # Pointing a finger at Touch ID


    Apple wants to give you the iPhone finger. But only in a good way.


    Setting passcode safeguards is a good idea, and it''s something we also touch
    on in Chapter 14 on Settings. But we also know that passcodes can be a hassle
    at times, when you''re holding an umbrella in one hand and tapping a passcode
    with the other. Apple has said in the past that about half the folks with an iPhone
    don''t even bother with passcodes, and we and think that''s unfortunate because
    you don''t want to just let anybody get your personal information.


    Enter the iPhones with Touch ID, a fingerprint scanner cleverly embedded in the
    Home button. With a gentle press of any designated finger, you bypass your passcode.


    What''s more, you can use your digit (not the numerical kind) to authenticate
    iTunes and App Store purchases. (Go to Settings under Touch ID & passcode to make
    sure that the iTunes & App Store switch is turned on.)


    The 6, 6 Plus, 6s Plus, SE, and 7 afford you another benefit, the ability to purchase
    stuff at retail (and online) by using a payment technology known as Apple Pay.
    By holding the phone in a store near a compatible contactless'
