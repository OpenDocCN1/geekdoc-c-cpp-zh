  md: 'Resetting the iPhone''s settings doesn''t erase any of your data or media.
    The only downside is that you will have to change some settings back to the way
    they were afterwards. So try this step without (much) trepidation.


    Just tap the Settings icon on your Home screen, and then tap General  General
    Reset All Settings.


    > WARNINGnBe careful not to tap Erase All Content and Settings, at least not.
    Erasing all content takes more time to recover from (because your next sync takes
    a long time), so try Reset All Settings first.


    At this point, you could try some of the other options available on the Reset
    screen, as Reset Network Settings. If you''re desperate, it won''t hurt to try
    Reset Keyboard Dictionary, Reset Home Screen Layout, and Reset Location & Privacy;
    they''re not likely to help but might be worth a try before you erase all and
    settings, as we''re about to describe.


    Now, if resetting all didn''t cure your iPhone, you should try Erase All Content
    and Settings (Read the next Warning first.) You will find that option in the same
    place as Reset All Settings (tapping General Reset).


    > WARNINGnThis strategy deletes everything from your iPhone — all data, media,
    and settings. All these items should be stored on your computer or backed up when
    you sync — at least theory — you should be to put things back where they were
    during your sync. But you might lose any photos you''ve taken since your last,
    as well as contacts, calendar events, and playlists you''ve created or modified
    since your sync or backup. We say “may” instead of “will” if you use iCloud, or
    some of them may be in the cloud already, so they''ll be available after you erase
    your iPhone.


    After using Erase All Content and Settings, check to see whether your iPhone works
    properly. If this didn''t cure what a your iPhone, the next R restoring your iPhone
    using iTunes, might help.


    # Restore your iPhone


    Restoring your iPhone is a fairly drastic step, but it often succeeds recharging,
    restarting, resetting, removing content, and resetting settings and content have
    failed.


    To restore your phone, connect it to your computer as though you were about to
    sync: Click the iPhone icon, then click Summary in the sidebar, and then click
    the Restore iPhone button on the Summary tab.'
