    # You send me: Sending text messages


    Tap the Messages icon on the Home screen to launch the Messages app, and tap the
    little pencil—paper icon (shown in the margin) in the top-right corner of the
    screen to start a new text message.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_120_1.png)


    If iPhone have 3D Touch, you can press the Messages icon and use the quick action
    to open directly to three recent conversations or a blank message. And if you’re
    not in the habit of pressing Home screen icons, you should be—many offer quick
    shortcuts that let you open the app and perform an action with just a single press.


    At this point, the To field is active and awaiting your input. You can do three
    things at this point:


    +   **If the recipient isn’t in your Contacts list, type his or her phone number
    or email address (iMessage users only).


    +   **If the recipient is in your Contacts list, type the first few letters of
    the name.** A list of contacts appears. Scroll through it if necessary and tap
    the name of the contact.


    The more letters you type, the shorter the list becomes. And, after you’ve tapped
    the name of a contact, you can begin another name so you can send the message
    to multiple recipients at once.


