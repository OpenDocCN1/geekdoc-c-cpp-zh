    # Chapter 16

    When Good iPhones Go Bad


    In our experience, iPhones are usually quite reliable; most users we''ve talked
    to report mostly trouble-free operation. Notice our use of the words most and
    mostly. That''s because every so often, a good iPhone goes bad. It''s not a common
    occurrence, but it does happen. So in this chapter, we look at the types of bad
    things that can happen, along with suggestions for fixing them.


    What kinds of bad things are we talking about? Well, we''re referring to problems
    involving


    +   >> The phone itself

    >> Making or receiving calls

    >> Wireless networks

    >> Syncing with your Mac or PC


    After all the troubleshooting, we tell you how to get even more help if nothing
    we suggest does the trick. Finally, if your iPhone is so badly hoped that it needs
    to go back to the motherhood for repairs, we offer ways to survive the experience
    with a minimum of stress or fuss.'
