- pgno: 46
  md: '# The incredible, intelligent, and virtual iPhone keyboard


    Before you consider how to use the keyboard, we''d like to share a bit of the
    philosophy behind its so-called intelligence. In fact, with iOS 10, the QuickType
    keyboard managed to raise its IQ. For one thing, it leverages Siri. Now, it relies
    on deep neural network technology, which sounds as smart as it is. Knowing what
    makes this keyboard smart will help you make it even smarter when you use it.
    The iPhone keyboard


    +   - Uses a bundled English dictionary that even includes words from today''s
    popular culture.

    - Adds your contacts to its dictionary automatically.

    - Uses complex analysis algorithms and the aforementioned neural technology to
    predict the word you''re trying to.

    - Suggests corrections as you type, and then offers the suggested word just below
    the word you typed.

    - Reduces the number of mistakes you make as you type by intelligently and dynamically
    resizing the touch zones for certain keys. The iPhone increases the zones for
    keys it predicts might next and decreases the zones for keys that are unlikely
    to come next, though you can''t see these changes.


    # Anticipating what comes next


    The keyboards on your iPhone have become even more useful through generations
    of iOS. These days, the keyboard takes an educated stab at the next word you mean
    to type and presents what it surm to be the best possible word choices front center.
    Say you''re preparing a note in the Notes app. You start typing. *This is a*.
    Above the row of keys in the iPhone keyboard, you''ll see buttons with three suggestions:
    *great, good,* and very (as shown in Figure 2–4). If one of those were the appropriate
    response, you could tap the button to insert its text into your reply.


    Of course, if you wanted to respond with something different than the three options
    presented by Apple, just type your response with the regular QWERTY keys. As you
    add additional letters and words, the three suggested choices above the keyboard
    change in real time.


    Such QuickType keyboard predictions vary by app and by whom you are communicating.
    So the predictive text choices that show up in Messages when you''re involved
    in an exchange with a friend are likely to be more casual than the those in an
    email to your boss.'
