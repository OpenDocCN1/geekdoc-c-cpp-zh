    Reminders by tapping each one. When one of them is on, a green button is visible,
    as shown in Figure 12-5; otherwise you see appears dimmed. You may also see options
    to turn on Notes, depending on the account.


    The iPhone typically keeps synchronized for a week. To sync for a longer or shorter
    period, head to Settings and tap Mail, Contacts, Calendars, and then tap the account
    that is using ActiveSync. Tap Mail Days to Sync, and then tap No Limit or choose
    another time frame (1 day, 3 days, 2 weeks, or 1 month).


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_249_1.png)


    If you''re moonlighting at a second job, you can configure more than one Exchange
