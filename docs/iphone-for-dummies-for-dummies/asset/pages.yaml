  md: '# Tricks with Links and Phone Numbers


    The iPhone does something special when it encounters a phone number or URL in
    email and text messages. The iPhone interprets as a phone number any sequence
    of numbers that looks like a phone number: 1-123-555-4567, 555-4567, 1.123.555.4567,
    and so on. The same goes for characters that look like a web address (URL), such
    as http://www.WebsiteName.com or www.WebsiteName.com, and email addresses, such
    as iPhoneLevitus@boblevitus.com. When the iPhone sees what it assumes to be a
    URL, it appears as a blue link on your screen.


    If you tap a phone number or URL sequence like the ones just shown, the iPhone
    does the right thing. It launches the Phone app and dials the number for a phone
    number, or it launches Safari and takes you to the appropriate web page for a
    URL. That''s useful but somewhat unexpected. What''s more is that Safari handles
    phone numbers and URLs.


    Let''s start with phone numbers. When you encounter a phone number on a web page,
    give it a tap. A little dialog appears on the screen displaying that phone number
    and offering you choice of two buttons: Call or Cancel. Tap Call to switch to
    the Phone app and dial the number; Tap Cancel to return to the web page.


    Here''s another cool Safari trick, this with links. If you press and hold down
    a link rather than tapping it, the following buttons appear: Open, Open in New
    Page, Add to Reading List, and Copy the URL. There''s also a Cancel button in
    case none of these appeals to you.


    You also see the underlying URL if you press and hold down a URL in Mail or Messages.
    Having this information in Mail or Messages is even more useful because it allows
    you to spot bogus links and phishing attempts without switching to Safari or actually
    visiting the URL.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_395_0.png)


    If you have an iPhone 6 or 7 model, press lightly on a link to peek at the page.
    You can swipe up to open the link in a new tab; add it to Reading List; or copy
    its URL to the Clipboard. Or just press a bit to open the link.


    Finally, here''s one last Safari trick. If you press and hold down on most graphic
    images, Save Image and Copy Image buttons appear. Tap Save Image and the picture
    is saved to Camera Roll in the Photos app. Tap Copy Image and the picture is copied
    to the Clipboard so you can paste it into any app that accepted images, including
    but not limited to Messages and Mail.'
