    credentials to populate the list with Twitter usernames and photos.


    Here''s how to make these contacts work to your benefit:


    +   1. **In the Phone app**, tap Contacts.


    +   2. Flick your finger so the list of contacts on the screen scrolls rapidly
    up or down, loosely reminiscent of the Lucky 7s on a Las Vegas slot machine. (Okay,
    very loosely)


    Think of a payout on a One-Armed Bandit with that kind of power. Don''t feel like
    flickering? You can find a contact by


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_86_0.png)


    +   * Moving your fingers along the alphabet on the right of the Contacts list.
    You can also tap one of the letters to jump to names that begin with that, easier
    said than done with the tiny size of those letters on older phones but a bit simpler
    on the larger display models.


    +   * Starting to type in the search field near the top of the list. Try the name
    of the contact or the place where you work contacts.


    +   * Using Spotlight (refer to Chapter 2).


    +   3. When you''re at or near your contact name, stop the scrolling by tapping
    the screen.


    Note that when you tap to stop the scrolling, that doesn''t select an item in
    the list. This behavior may seem counterintuitive the few times you try it, but
    we got to it and now we really like this way.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_86_1.png)


    +   4. Tap the name of the person you want to call.


    As shown in Figure 4-1, you can see a lot of fields with the individual''s phone
    number, physical and email addresses, and possibly a mug shot. You may have to
    scroll down to see more contact info.


    If the person has more than one phone number, the hardest decision you must is
    choosing one to call.


    +   5. Tap the phone number or the circled icon with the phone icon visible in
    Figure 4-1, and the iPhone initiates the call.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_86_2.png)


    FIGURE 4-1: Contact me.


