    # Using dictation


    In many instances where you''ve used the iPhone touchscreen keyboard, you can
    now use Siri instead. In lieu of typing, tap the microphone icon on the keyboard
    and speak. Tap Done when you''re done. Dictation works as you search the web,
    take notes, compose messages, and so on. You can update your Facebook status by
    voice.


    Voice isn''t the solution to everything. Putting Siri to work typically involves
    a combination of using voice, touch, and your eyes to see what''s on the screen.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_114_0.png)


    # Correcting mistakes


    As we point out, Siri is good but sometimes needs to be put in his or her place.
    Frankly, you can correct mistakes fairly easily. The simplest way is to tap the
    microphone icon and try your query.


    You can also tap your question to edit or fix what Siri thinks you said. You can
    use the touch keyboard or your voice to make a correction.


    Siri seeks your permission before sending a dictated message. That''s a safeguard
    you come to appreciate. If you need to modify the message, you can change "it"
    and dictate a new message.'
