  md: '![](img/8361dd8dda9818e97bf48313b13b8d6b_307_0.png)


    14-9: You find these items on the General settings screen.


    # # Software update


    If there''s a software update to be had, you can find it under the Software Update
    setting. Otherwise, you''ll be informed that your software is up to date.


    # # Storage & iCloud Usage


    Think of the Storage & iCloud Usage as one of the places to go on the iPhone for
    statistics about how you employ the device. You find other information in the
    About setting (under General on the Settings screen). A list of all the apps taking
    space on your iPhone appears under Manage Storage. Ask yourself if you really
    need all the apps that are hogging the most space. If not, tap the name of the
    app and tap Delete App (You can''t delete a native iPhone app such as Safari or
    Mail, not that you''d want to.) You can always sync again (or fetch the app from
    the App Store) if you find that your total iCloud storage and how much is available,
    not only on the iPhone, but also across your iCloud-capable devices. If you need
    to buy more storage, under the iCloud section, tap Manage Storage Change Plan,
    which brings you to a Buy More Storage screen.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # Background App Refresh


    When this setting is on, apps are allowed to freshen their content in the background
    whenever you have a cellular or Wi-Fi connection. You can cherry-pick apps which
    get this automatic refresh. Although this feature is a nice convenience, turning
    it off may bolster the life of the device.


    # ## Siri


    Apple''s voice assistant (see Chapter 5) gets its own dedicated place in Settings.
    Choose the language Siri works in, determine whether you always want feedback
    or only in a hands-free solution, let Siri know your own information, and decide
    whether Siri will kick in when you bark the words "Hey Siri On models prior to
    the iPhone 6s or 6 Plus, you must be connected to power for "Hey Siri" to work.
    That is not a requirement for later models.


    Meantime, in Settings, you also get to choose you want Siri to use a male or female
    voice, for English speakers, whether or not you want to have an American, Australian,
    or British accent. We revisit another setting relevant to Siri later in this chapter,
    in the “Touch ID & Passcode” section.


    # ## Handoff and Suggested Apps


    The Handoff feature added with iOS 8 lets you start a task—such as typing an email
    on your iPhone, on another iOS 8, 9 or device, or on a Mac running OS X Yosemite,
    the El Capitan, or macOS Sierra, and pick up on another iPhone, iOS 8, 9, or 10,
    or Mac. All the devices must be running the identical iCloud account. On the phone,
    you''ll be able to resume with the app from your Lock screen or app switcher.
    On a Mac, you''ll see the appropriate app on the dock.


    In the Suggested Apps section, you can turn on to showcase installed apps or App
    Store suggestions that are relevant to your current location. Suggestions-appear
    on the Lock screen and in the app switcher.


    # ## CarPlay


    If the vehicle you drive supports Apple''s CarPlay, you can get directions, make
    calls, and listen to an audiobook while you''re at the wheel. You can steer all
    this activity via the car''s knobs, buttons, or dashboard touchscreen, or by tapping
    into Siri''s voice control.


    Here in Settings, you can turn on the ignition for CarPlay and choose whether
    to allow CarPlay to work when the phone (not the car) is locked.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# VPN


    A virtual private network, or VPN, is typically a way to securely access your
    company’s network behind the firewall — using an encrypted Internet connection
    that acts as a “tunnel” for data. The iPhone software supports the protocols IKEv2
    (Internet Key Exchange), L2TP (Layer 2 Tunneling Protocol), and IPSec, which anyway
    provides the kind of security that satisfies network administrators.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_309_0.png)


    You can configure a VPN on the iphone by tapping VPN under General, tapping Add
    VPN Configuration, and tapping one of the aforementioned protocols. Then, using
    configuration settings provided by your company, fill in the private server information,
    account, password, encryption level (if appropriate), and other information. Better
    yet, lend your iPhone to the techies where you work and let them fill in the blanks
    for you. After you configure your iPhone for VPN usage, you can turn that capability
    on or off by tapping (yep) the VPN on or off switch under Settings.


    # iTunes Wi-Fi sync


    Through the magic of wireless, you no longer have to connect a cable to a PC or
    Mac to sync your iPhone with your iTunes account. If you’ve set up Wi-Fi syncing
    with iTunes, you can click Sync Now here to commence a Wi-Fi syncing session.
    For more syncing, consult Chapter 3. To get started, you have to connect to iTunes
    on a computer using a cable, and then click Sync with This iPhone over Wi-Fi.


    # Spotlight search


    You can designate which apps on your phone are searchable when you advantage Spotlight.
    (As a reminder, you initiate a Spotlight search by dragging down any screen, or
    if you have to the Home screen, swiping from left to right to summon the Today
    screen.) By default, all the options on the list shown in Settings will be part
    of a search. Tap the switch to remove any app that you don’t want the iPhone to
    include in its search mission.


    Meantime, if Siri Suggestions is on, Siri can suggest apps, people, locations,
    and more, before you type. You see Siri Suggestions on the Today screen. Siri
    is iOS 10 to make your phone work for you proactively.


    Spotlight shines its search beyond your phone. You can get Spotlight suggestions
    from the Internet, iTunes, and the App Store. Among other suggestions, you might
    receive timeouts for movies and info on nearby attractions.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'And you can rely on Spotlight suggestions when you use Look Up, the feature
    inside your phone that used to be called Define.


    # Battery


    You count on the iPhone battery getting you through the workday and well beyond.
    The controls over the Battery setting can help you monitor how much juice is left
    and give you a chance to get something out of the battery.


    +   **Low power mode:** When it''s critical to keep the battery going but you''re
    unable to charge your phone for a while, consider flipping to the Lower Power
    Mode switch. Upon doing so, the phone temporarily cuts down on power consumption
    by reducing or disabling various tasks, including fetching mail in the background,
    refreshing apps, and downloading stuff automatically. Some visual effects are
    also eliminated.


    +   **Battery percentage:** You can turn on a gauge that reports how much of your
    battery is charged in percentage terms. The percentage appears just to the left
    of the battery gauge at the upper-right corner of the iPhone.


    +   **Battery usage:** You can see the proportion of battery use by each app in
    the last 24 hours or the last seven days, expressed in percentage terms.


    +   **Time since last full charge:** This information is indicated in days and
    hours, for the time when the iPhone has been unlocked and in use also when it
    has been in standby mode.


    # Touch ID & Passcode


    You can select a passcode to prevent people from unlocking the iPhone. Tap Touch
    ID & Passcode, and then use the virtual keypad to enter a 4- or 6-digit code.
    During this setup, you have to enter the code set times before it''s accepted.


    The iPhone can be set to automatically erase your data if you (or someone else!)
    make ten successive failed passcode attempts. Your settings will be reset to their
    defaults and all memory information might as well be dust.


    You can also change the passcode or turn it off later (unless your employer dictates
    otherwise), but you need to present the passcode to apply any changes. If you
    forget the passcode, you have to restore the iPhone software, as described in
    Chapter 16.


    The iPhone has two kinds of passcodes — three if you count the fingerprint authorization
    feature known as Touch ID. In fact, the Passcode Lock setting is called Touch
    ID & Passcode.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'A simple passcode is a four-digit number. If you require a more stringent password
    — one is much harder to guess — turn off the simple passcode and come up with
    something much more difficult to crack, a longer combination of letters, punctuation,
    and special characters. Apple lets you choose a custom numeric or a custom alphanumeric
    one.


    Siri can send an email, send a message, or dial the phone from the Lock screen.
    In fact, having Siri ready from the Lock is the default. Although that''s a convenience
    for some, others might construe this as a security risk because an intruder would
    not need to know the phone''s passcode to make a call or send an email or text.
    If this bothers you, turn off Siri Under Allow When Locked.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_311_0.png)


    You can allow Today notifications and the Notifications view to appear on the
    Lock screen. Relevant Wallet passes (such as airline boarding passes and location-based
    gift cards) can also appear at your discretion on the Lock screen, as the capability
    to reply to a message.


    Another switch here lets you choose voice dialing is always enabled.


    We strongly recommend that you use the clever fingerprint authentication scheme
    that not only lets you bypass the Lock screen by pressing your thumb or another
    finger against the Home button but also lets you purchase stuff in the iTunes
    and App Stores through Apple Pay in certain retail locations and on websites.


    You can store up to five fingerprints (yours and people you trust with whom you
    share the phone). To do so, tap Add Fingerprint and go through the training session
    that you likely encountered when you set up your phone (consult Chapter 2 for
    details). If the iPhone doesn''t recognize your finger, you will see Again at
    the top of the screen. You get three tries before you''re forced to use a traditional
    passcode instead, at least for this session.


    As an added security measure, a regular passcode is required the first time you
    get to pass a Lock screen after restarting the phone.


    If you want to delete an authorized fingerprint, tap the listing for the finger
    in question, and tap Delete Fingerprint. Excuse our French, but you''ve just given
    the finger to the printer.


    # Restrictions


    Parents and bosses may love the Restrictions tools, but kids and employees usually
    think otherwise. You can clamp down on — um, provide parental'
