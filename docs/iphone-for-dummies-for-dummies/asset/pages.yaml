    Within Markup, you have the option to change the color and thickness of the lines
    and symbols you draw.


    Lastly, you can write your signature in script, a potential boon for lawyers or
    folks needing to get a John Hancock on a contract or lease. Just choose the fourth
    icon at the bottom of the Markup screen and tap Add or Remove Signature. Tap the
    + and sign your name with your finger.


    # Replying to or forwarding an email message


    When you receive a message and want to reply to it, open the message and then
    tap the reply, reply all, forward, print icon (labeled in Figure 12–9). Then tap
    the Reply, Reply All, Forward, or Print button.


    The Reply button creates a new email addressed to the sender of the original message.
    The Reply All button creates an outgoing message addressed to the sender and all
    other recipients of the original message. In both cases, the Subject is retained
    with Re: prefix. If the original Subject line were iPhone Tips, the reply''s Subject
    line would be Re: iPhone Tips. You also see text from the original message in
    the body of your reply (whether you are replying to one person or more than one
    person).


    Tapping the Forward button creates an unaddressed email message that contains
    the text of the original message. Add the address(es) of the person or people
    whom you want to forward the message, and tap Send. In this case, rather than
    a Re: prefix, the Subject line begins with Fwd. So this time the Subject line
    reads Fwd: iPhone Tips.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_267_0.png)


    You can edit the Subject line of a reply or a forwarded message or edit the body
    of a forwarded message the same way you would edit any other text. It''s usually
    considered good form to leave the Subject lines alone (with the Re: or Fwd: prefix
    intact), but you may want to change them sometimes. You know that you can.


    To send your reply or forwarded message, tap the Send button as usual.


    Printing requires an AirPrint-capable printer. If you have one, tap the Print
    option.'
