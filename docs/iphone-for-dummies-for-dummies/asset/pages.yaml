    # Twitter


    In Twitter settings, you can add a new Twitter account and update your contacts
    so that Twitter uses their email addresses and phone numbers to automatically
    add their Twitter handles and photos. You can choose may on whether you can use
    various apps with Twitter.


    # Facebook


    Most of us know Facebook as a great service to help you stay in touch with relatives,
    associates, and old pals, rekindle those relationships, and make new friends.
    But some people collect Facebook friends like baseball cards. If it seems like
    you''re acquainted with all 1.7 billion or so counting members of the mammoth
    social network, know what you mean.


    Fortunately, Apple organizes your Facebook relationships on the iPhone. If you
    turn on the Calendar and Contacts settings under Facebook settings on the iPhone,
    your Facebook friends automatically populate your Contacts list, complete with
    their profile pictures as well as their email addresses and phone numbers (if
    they made them on Facebook). Birthdays and calendar appointments appropriately
    turn you in the iPhone Calendar app.


    Think of these Facebook entries as synced contact entries. If a person changes
    his phone number and email address on Facebook, that change will be reflected
    on your iPhone, provided you have Wi-Fi or cellular coverage or the next time
    you have coverage. And if your friends de-friend you — what did you do, anyway?—
    their contact info will disappear altogether.'
