- pgno: 80
  md: 'To sync e-books, you need the free iBooks app from the App Store. For more
    information on apps and the App Store, read Chapter 15.


    # Photos


    Syncing photos is a little different from syncing media because your iPhone has
    a built-in camera — two cameras, actually — and you may want to copy pictures
    or videos you take with the iPhone to your computer, as well as copy pictures
    stored on your computer to your iPhone.


    The iPhone syncs photos and videos, too, with the following programs:


    +   - Mac: Aperture version 3.2 or later or Photos version 1.1 or later

    - PC: Adobe Photoshop Elements or Adobe Photoshop Album


    You can also sync photos with any folder on your computer that contains images.


    Select the Photos pane, and then select the Sync check box. Next, choose an application
    or folder from the pop-up menu; we selected the Photos app in Figure 3–7.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_80_0.png)


    Figure 3–7: Use the Photos pane to determine which photos will be synchronized
    with your iPhone.


    If you choose an application that supports photo albums (such as Photoshop Elements,
    Aperture, or Photos), projects (Aperture), events (Photos), facial recognition
    and places (Aperture or Photos), or any combination thereof, you can automatically
    include recent projects (Aperture), events (Photos), or faces (Aperture and Photos)
    by making a selection from the same pop-up menu.


    CHAPTER 3 Synchronicity: Getting Stuff to and from Your iPhone 69'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'You can also type a word or phrase in the search field (an oval with a magnifying
    glass) to search for a specific event or events.


    If you choose a folder of images, you can create subfolders inside it that will
    appear as albums on your iPhone. But if you choose an application that doesn''t
    support albums or events, or a single folder of images with no subfolders, you
    have to transfer all or nothing.


    Because we selected Photos in the Sync Photos menu, and Photos 1.1 (the version
    installed on our Mac) syncs projects and faces in addition to albums and photos,
    we have the option of syncing any combination of photos, albums, and faces.


    If you''ve taken any photos with your iPhone or saved images from a web page,
    an email, an MMS message, or an iMessage since the last time synced, the appropriate
    program launches (the appropriate folder is selected) when you connect your iPhone,
    and you have the option of uploading the pictures on your iPhone to computer.


    # # Manual Syncing


    This chapter has focused on automatic syncing thus far. Automatic syncing is great;
    it selects items to sync based on criteria you''ve specified, such as genre, artist,
    playlist, and album. But it''s not efficient for transferring a few items songs,
    movies, podcasts, or other files — to your iPhone.


    The solution? Manual syncing. With automatic syncing, iTunes updates your iPhone
    to match your criteria. Changes to your iTunes library since your last sync are
    synced automatically to your iPhone. With manual syncing, you merely drag individual
    items to your iPhone.


    Automatic and manual sync aren''t mutually exclusive. If you set up automatic
    syncing, you can still sync individual items manually.


    You can manually sync music, movies, TV shows, podcasts, and iTunes U less not
    photos and info as contacts, calendars, and bookmarks.


    Use the On My Device section in the sidebar (if the sidebar isn''t displayed,
    View Show Sidebar) to see which songs, movies, TV shows, and other media are already
    on your device.'
