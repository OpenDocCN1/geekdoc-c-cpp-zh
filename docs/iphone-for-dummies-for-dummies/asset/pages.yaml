    When you look at a message that''s part of a thread, the numbers at the top of
    the screen tell you the message''s location in the conversation. For example,
    in Figure 12-14, the message is 6 of 8 in this thread.


    # Searching emails


    You can easily search through a bunch of messages to find the one you want to
    read away—such as that can''t miss stock tip from your broker. Tap status bar
    to scroll through the top of the inbox or manually scroll to search. You can type
    or whichever search term seems relevant. Matching emails that have already been
    downloaded surface. Scroll to the top of the screen to see your current mailbox.
    If you have multiple accounts on your phone, you''ll also see an option at the
    top to search all your mailboxes.


    What''s more, Apple groups search results by people, subjects, unread, flagged
    messages, messages with VIPs, and attachments


    In the stock example, if you have an email to from a person named Stockman, he
    or she will show up in the People search results. And if you have a subject line
    that reads "Your stock portfolio performance," it will appear in the Subjects
