  md: '# MAKING YOUR iPhone (AND OTHER COMPUTERS) REALLY SMART


    Chances are you haven''t heard of Wolfram | Alpha. But if you want to know the
    gross domestic product of France or find events that happened on the day you were
    born, Wolfram | Alpha can deliver such facts. You don''t search the web per on
    Wolfram | Alpha as you would using a service such as Google, Wolfram | Alpha describes
    itself as a “new way to get knowledge ... by doing dynamic computations based
    on a vast collection of built-in data, algorithms, and methods.” It taps into
    knowledge curated by human “experts.” So you can get nutritional information for
    peanut M&Ms or com-pute growth for your 4-foot, 7-inch, 10-year-old daughter.


    There''s a reason Siri relies on this “computational knowledge engine,” which
    was driven over a period of nearly 30 years by a really smart guy: Stephen Wolfram.
    We also recommend checking out the $2.99 Wolfram | Alpha app for your iPhone.


    # Making Siri smarter


    You can tell Siri in language which you want to convert by going to Settings General
    > Siri. Siri is available in English (United States, United Kingdom, New Zealand,
    India, Ireland, Singapore, South Africa, or Australia), Arabic, Danish, Dutch,
    Finnish, French, German, Chinese, Italian, Hebrew, Korean, Malay, Norwegian, Portuguese,
    Russian, Spanish, Swedish, and Turkish.


    You can also receive feedback from Siri all the time or when you control by a
    ring switch.


    In the Info field in Settings, you can tell Siri who you are. When you type My
    Info, your Contacts list appears. Tap your own name in Contacts.


    And as we mean earlier, you can call Siri''s voice from male to female or versa.
    You can also give an English-speaking Siri an accent: Australian or British.


    As noted, you can call Siri even from the Lock Screen. The default setting away.
    Consider this feature a mighty blessing. Not having to type a passcode to activate
    Siri is convenient. On the other hand, if your phone ends up in the wrong person,
    she would be able to use Siri to make a call, send an email, or send a message
    in your, bypassing passcode security you thought was place. If you find this potential
    scary scenario, tap Settings Touch ID & Passcode. Enter your passcode — a fingerprint
    won''t cut it — and under Access When Locked, change the Siri option to off (white
    rather than green is showing). For more on Settings, read Chapter 14.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_115_0.png)


    104 PART 2 The PDA iPhone'
