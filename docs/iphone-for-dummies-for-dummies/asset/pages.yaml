- pgno: 33
  md: '**Calculator**: The Calculator app lets you perform addition, subtraction,
    multiplication, and division. Give the phone a quarter turn, however, and you''ll
    find a nifty scientific calculator that does all and that much.


    **Podcasts**: Podcasts used to be included in the Music app but were moved to
    this stand-alone app on iOS 7. Use it to manage and consume podcasts on your iPhone.


    **Watch**: This app is used to manage features on your Apple Watch. It''s useless
    unless you have an Apple Watch.


    **iCloud**: This new app displays all documents saved to iCloud either in a single,
    searchable location if you enabled it when you first set up your iPhone or in
    Settings > iCloud > iCloud Drive.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_33_0.png)


    # The dock (all Home screens)


    Finally, four icons at the bottom of the Home screen are in a special area known
    as the dock. When you switch Home screens (Chapter 2), all the icons above the
    dock change. The four items on the dock, which remain available on all Home screens:


    +   **Phone**: Tap this app icon to use the iPhone as a phone. What a concept!


    +   **Safari**: Safari is your web browser. If you''re a Mac user, you know that
    already. If you''re a Windows user who hasn''t discovered the wonderful Safari
    for Windows, think Internet Explorer on steroids.


    +   **Messages**: The Messages app lets you exchange text messages (SMS) and multimedia
    messages (MMS) with almost any other cellphone. The app also lets you exchange
    Apple-exclusive iMessages using any Apple device with iOS 5 or higher (iPhone)
    or a Mac running Mountain Lion (OS X 10.8) or higher, as described in Chapter
    6. We''ve used a lot of mobile phones in our day, and this app is as good as it
    gets.


    +   **Music**: This icon unleashes all the audio power of an iPod right on your
    phone.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_33_1.png)


    If the four apps on the dock aren''t the ones that you use most, move different
    apps to the dock, as described in Chapter 2.


    In iOS 10 is the capability to delete most of the preinstalled apps. See Chapter
    15 for details.


    Okay, Now that you and your iPhone have been properly introduced, it''s time to
    turn it around and actually use it. Onward!


