    If at this point you aren''t holding an iPhone that works flawlessly and has most
    (not all) of your stuff on, it''s time to break out the big guns and make an appointment
    with a Genius at your local Apple Store. Call the support hotline (800-275-2273)
    or visit the support web page at www.apple.com/support/iphone. That said, some
    or all of your stuff may not be on it. If that''s the case, the following section
    offers a two-trick solution that works usually.


    # Dude, Where''s My Stuff?


    If you performed a restore or had your iPhone replaced or repaired, you still
    have one more task to accomplish. Your iPhone may work flawlessly but some or
    all of your stuff — your music, contacts, iMessages, or whatever is missing. You''re
    not stuck, at least not yet. We still have a few tricks up your sleeve:


    +   Trick 1: Sync your iPhone with iTunes, and sync again. That right — sync and
    sync again. Why? Because sometimes stuff doesn''t get synced properly on the first
    try. Just do it. If that doesn''t seem right, try Trick 2.


    CHAPTER 16 When Good iPhones Go Bad 347'
  merge: -1
  img_proc: true
- pgno: 359
  md: '>> Trick 2: Restore from backup. Click the iPhone icon near the top left in
    the iTunes window, click Summary in the sidebar, and then click Restore Backup.
    The Restore Backup dialog appears and offers you a choice of backups. Select the
    one you want, click the Restore button, and let the iPhone work some magic.


    If you have more than one backup for a device, try the most recent (undated) one
    first. If it doesn''t work or you''re still missing files, restoring from any
    other backups before you throw in the towel.


    Note that these backups include photos in the Recently Added folder or Camera
    Roll, text messages, notes, contact favorites, videos, sound settings, and more,
    but not media such as music, videos, or photos. If media is missing, perform Trick
    1 again.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_359_0.png)


    And finally, if neither Trick 1 nor Trick 2 did the trick, try this:


    >> Trick 3: Sync one media type at a time. Start syncing (or downloading from
    the App Store) apps you use regularly. Test the iPhone for a while and, if everything
    seems okay, sync another type of media — music, movies, calendars, photos, or
    whatever. Test the iPhone again, and if everything seems okay, continue until
    the problem recurs or you''ve synced all your media. If the problem comes back,
    you should have a good idea of what media type is to blame.


    We hope you have resolved your iPhone issues by this point. If not, we''re sorry
    to say that this is all we''ve got.'
