    # TripCase


    We both travel more than most people and are somewhat set in our ways. In the
    old days, we used our computers to print boarding passes, hotel and rental car
    details, and any other info we might need while transit. The printouts were strictly
    analog, so they didn''t notify us (or anyone else) of gate changes or flight delays
    or cancellations. And, of course, they couldn''t remind us to check in. The system
    worked reliably unless we lost our printed documents.


    What we wished and hoped for was a single intelligent repository for travelrelated
    information, one that was smart enough to alert us of gate changes, weather delays,
    flight cancellations, and the like, one that was easy to configure, convenient
    to use, and free. What we found was TripCase, which is all that and more. It''s
    a free iPhone app (and a website) that organizes details of each trip in place,
    with reminders and flight alerts delivered directly to your iPhone.


    TripCase has a lot to like, but one thing we like is that it''s drop-dead simple
    to add to your travel events — without copying and pasting or even typing.


    354 PART 6 The Pen of Tens'
