- pgno: 90
  md: 'On the subject of 3D Touch, you can press against the iPhone docked at the
    bottom of the display to call upon a Quick Actions menu with initials representing
    names of some favorites you might want to call or search for a contact or create
    a contact. You can also view your most recent call.


    # # Keypad


    From time to time, of course, you have to dial the number of a person or company
    who hasn''t earned a spot in your Contacts. Or you need to access a keypad to
    navigate a voicemail system. In those situations, you''ll want to tap the iPhone
    icon to bring up the large keys of the virtual touchscreen keypad you see in Figure
    4-3. Just tap the appropriate keys and tap the Green button to dial. If you''re
    dialing across in your Contacts list, you''ll see the name of the caller just
    below the digits you''ve dialed.


    If you dial an unfamiliar number, you can add it to your Contacts by tapping the
    + sign to the number you just dialed. After doing so, tap New Contact, Add to
    Existing Contact, or Cancel.


    You can use the iPhone''s keypad to remotely check your voicemail at work or home.
    Come to think of it, what a perfect segue into the next section. It''s on one
    of our favorite iPhone features, visual voicemail.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_90_0.png)


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_90_1.png)


    FIGURE 4-3:

    A virtually familiar way to dial.


    # # Visual voicemail


    How often have you had to listen to four or five (or more) voicemail messages
    before getting to the message you really wanted, or to hear? As shown in Figure
    4-4, the iPhone''s clever visual voicemail presents a list of your voicemail messages
    in the order in which calls were received. But you need not listen to those messages
    in order.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'You can tell if you even have voicemail in a few ways:


    +   A red circular badge showing the number of pending messages awaiting your
    attention appears above the Phone icon on the Home screen or over the Voicemail
    icon in the Phone app. The tally, if it appears over the Phone icon on the Home
    screen, as well as include missed calls as well as voicemail messages.


    +   You may also see a message alert on the iPhone display that shows the name
    of the caller and the word voicemail. You can tap to listen, or close the alert
    and listen later. You''ll also be notified in Notification Center, where you can
    tap against a notification to return the call.


    Whatever draws you, tap that Voicemail icon to display the list of voicemails.
    You will see the caller''s number (assuming this info is known through Caller
    ID) and, in some cases, his or her name. Or you see the words Unknown or Private
    Caller.


    The beauty of all of this is that you can ignore (or at not listening to) certain
    messages. We are not in the advice-giving business on what calls you can safely
    avoid; disregard messages from the IRS or your parole officer at your own risk.


    A blue dot to a name or number signifies that you haven''t heard the message yet.


    To play back a voicemail, tap the name or number in question. Tap the tiny icon
    that shows up to the left. To pause the message; tap again to resume. Tap Speaker
    if you want to hear the message through the iPhone''s speakerphone. Tap Call Back
    to immediately dial the person''s number, or tap Delete to remove the voicemail
    from the list.


    Tap the i-in-a-circle next to a caller''s name or number to bring up any contact
    info on the phone or add the caller to your contacts.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_91_0.png)


    If available, voicemail transcription appears here


    Figure 4-4:


    Visual voicemail in action.


    # Scrubber bar


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_91_1.png)


    PART 1 Meet Your iPhone'
