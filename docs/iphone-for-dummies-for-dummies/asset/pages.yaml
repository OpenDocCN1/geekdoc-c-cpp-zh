- pgno: 84
  md: '# IN THIS CHAPTER


    +   >> Making a call


    +   >> Visualizing visual voicemail


    +   >> Receiving a call


    +   >> Facing up to FaceTime


    # Chapter 4

    Understanding the Phone-damentals


    You may well bought an iPhone for its spectacular photo viewer, its marvelous
    widescreen display, its multimedia capabilities, and the best darn pocket-sized
    Internet browser you''ve ever come across. Not to mention its coolness.


    However, it''s easy to forget that, for many of us, the iPhone''s most critical
    mission is the one from which its name is derived: The iPhone is first and foremost
    cellphone. And no matter how capable it is, all those other things, when push
    comes to home, you had best be able to make and receive phone calls.


    That requirement puts a lot of responsibility in the hands of AT&T, Sprint, T-Mobile,
    Verizon, the iPhone''s main (but not only) wireless carriers in the United States.
    With any cellphone, the strength of the wireless signal depends a great deal on
    your location and the robustness of the carrier''s network.


    As noted in Chapter 1, the cell signal icon at the upper-left corner of the screen
    can tell you in on what your phone-calling experience may be like. Simply put,
    more dots supposedly equate to a better experience. What you hope to avoid are
    those two dreaded words: No Service. Cell coverage aside, this chapter is devoted
    to all the nifty ways you can handle wireless calls on an iPhone.


    CHAPTER 4 Understanding the Phone-damentals 73'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'And when we say nifty, we mean nifty. If you and the person you''re gabbing
    have a good Wi-Fi or cellular connection, you can see each other. That''s right:
    We''re talking about video calling, through a remarkable feature called FaceTime.
    (FaceTime also lets you make a video call to a friend with an iPad or later tablet,
    a fourth-generation or later iPod touch, or a Mac computer.)


    The promise of video calling has been around since 불구하고 the White House. Despite
    various efforts to bring video calling or video chat to computers and other mobile
    phones, it awhile before video calling started to go Main Street.


    With FaceTime, Apple is doing as much as any out this side of Microsoft-owned
    Skype to make video calling a more regular occurrence. Don''t take our word for
    it; give FaceTime a try. Sorry, but we''re leaving you hanging until the end of
    the chapter to figure out how to do that. (Trust us — isn''t hard.)


    In the meantime, we present more conventional but no less important ways to receive
    calls on your iPhone. Somewhere, Alexander Graham Bell is beaming.


    # Making a Call


    Start by tapping the Phone icon on the Home screen. You can then make calls by
    tapping any of the icons that show up at the bottom of the screen: Favorites,
    Recents, Contacts, Keypad, or Voicemail, in that order. In this section, we describe
    these options by one.


    The iPhone also lets you make calls by voice, using Siri, or in some cases, the
    aptly Voice Control. We discuss these options in Chapters 5 and 7.


    # Contacts


    If you read the chapter on syncing (Chapter 3), you know how to get the s-mail
    addresses, email addresses, and (most relevant for this chapter) phone numbers
    that reside inside your PC or Mac contacts into the iPhone. Assuming you went
    through that drill already, all those addresses and phone numbers are hanging
    out in one place. Their not-so-secret hiding place is revealed when you tap the
    contacts in the Facebook app. (Okay, so Contacts also hangs out in the folder.)


    If you enter your Facebook credentials in Settings, your Facebook friends — and
    their phone numbers, if they were made publicly available in Facebook — will'
  merge: -1
  img_proc: true
