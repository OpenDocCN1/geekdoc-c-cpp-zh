- pgno: 119
  md: 'In addition to the traditional SMS and MMS protocols offered by the wireless
    carriers, iOS 5 and higher support iMessage, an Apple-provided service that lets
    you send and receive unlimited messages with text, pictures, videos, and locations.
    The good news is that although the wireless operators all charge for SMS or MMS
    services, iMessages are free when using Wi-Fi. If you use cellular service, there
    is no per-message charge, but an iMessage may still cost you because you are using
    data from your plan''s allotment.


    If you have a limited data plan, you can turn off the Cellular Data option (in
    the Settings section) to force Messages (and all other data-using apps) to use
    only Wi-Fi.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_119_0.png)


    The bad news is that you can share iMessages only with folks using Apple devices
    (iPhone, iPad, iPod touch, and Mac) running iOS 5 or higher or macOS 10.8 Lion
    or higher. And, if no Wi-Fi connection is available, the message will be sent
    as a standard SMS or MMS message via your wireless carrier (subject to the usual
    message charges).


    You can turn off the SMS message feature if you like, which might be a good idea
    unless you have an unlimited messaging plan. By setting Settings > Messages and
    tapping the SMS to switch to off.


    Before we get to the part where you send or receive messages, let''s go over messaging
    basics:


    +   **Both sender and receiver either an SMS- or an MMS-enabled mobile phone,
    an Apple device with iOS 5 or higher, or a Mac running OS X 10.8 or higher (of
    course, an internet connection).** Your iPhone qualifies, as almost any mobile
    phones in the past few years, as well as iPads and iPod touches running iOS 5
    or higher and Macs running OS X 10.8 or higher. Keep in mind that if you send
    messages to folks using a phone that doesn''t support SMS or MMS or to those who
    don''t have an Apple device, they may never get your message or even know you
    it.


    +   **Some phones (not the iPhone, of course) limit SMS to 160 characters.** If
    you try to send a longer message to one of these phones, your message may be truncated
    or split into multiple shorter messages, each count as one SMS message unless
    you have an unlimited plan. Furthermore, when you send an SMS to multiple recipients,
    you are charged for each message. It''s a good idea to keep SMS messages brief
    (and use them sparingly unless you have an unlimited plan)


    The Messages app can count characters for you. To enable this feature, tap the
    Settings icon on your Home screen, tap the Messages icon, and enable Character
    Count. When you type a line or more of text, you''ll see the number of characters
    you''ve typed so far, a slash, and then the number


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_119_1.png)


