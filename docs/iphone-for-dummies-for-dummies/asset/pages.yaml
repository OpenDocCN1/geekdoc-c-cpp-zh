    # Language & Region


    The iPhone is an international sensation. It''s sold and used around the world
    by people of all nationalities. In the Language & Region section, you can set
    the language you type on (by using a custom virtual keyboard), the language in
    which the iPhone displays text, and the language in which it speaks. Heck, you
    can even select a different region format (from among numerous countries) and
    a different calendar type, among Gregorian, Japanese, and Buddhist, and can choose
    your preferred language order.


    # Dictionary


    Tap the Dictionary setting to select the dictionary or dictionaries you want your
    iPhone to rely on when looking up the meaning of a word. Your choices include
    the Oxford Dictionary of English, the New Oxford American Dictionary, and an Apple
    dictionary. Many foreign language dictionaries are also available.


    # Accessibility


    The ever–comprehensive Accessibility tools are targeted at people with certain
    disabilities, though anyone can benefit from some of the following:


    +   Voice-over: A screen reader describes aloud what''s on the screen. The reader
    can read email messages, web pages, and more. As you dig into these settings,
    you''ll see that you can use phonetics, change the pitch, alter the speaking rate,
    and so on.'
