  md: 'To move an app or folder after the jiggling starts, press it, drag it to its
    new location (other apps on the screen will politely move out of its way to make
    space for it), and release it.


    If you move an icon onto another icon and pause for a second, a folder will be
    created. If you move an icon onto a folder and pause for a second, the folder
    will open so you can place the icon wherever you like in the folder.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_339_0.png)


    REMEMBER


    Like Home screens, folders can have more than one page; if you see two or more
    white dots at the bottom of the folder—one for each additional swipe left to see
    the next screen or swipe right to see the previous one.


    To move to a different Home screen after the jiggling starts, press the app and
    drag it all to the left or right edge of the screen. The preceding Home screen
