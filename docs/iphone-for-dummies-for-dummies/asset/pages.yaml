    # Chapter 19

    Ten Helpful Hints, Tips, and Shortcuts


    After spending a lot of quality time with our iPhones, it''s only natural that
    we''ve discovered more than a few helpful hints, tips, and shortcuts. Here are
    some of our favors.


    # Do the Slide for Accuracy and Punctuation


    Our first tip can help you type faster in two ways: by helping you type more accurately
    and enabling you to type punctuation and numerals faster than ever before.


    While reading this book, you find out how to tap, double-tap, double-tap with
    two fingers, and press with 3D Touch (6s and 7 models). Now we want to introduce
    you to a new gesture we like to call the *slide*


    To do the slide, you start by performing the first half of a tap. That is, you
    touch your finger to the keyboard screen but don''t lift your finger up. Now,
    without lifting your finger, slide it onto the key you want to type. You''ll know
    you''re on the right key because it pops up and enlarges.


    CHAPTER 19 Ten Helpful Hints, Tips, and Shortcuts 379'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'First, try the slide during normal typing. Stab at a key. If you miss, rather
    than lifting your finger, backspacing, and trying again, do the slide onto the
    proper key. After you get the hang of the slide, you''ll see that it saves a lot
    of time and improves your accuracy as well. Get in the habit of not lifting your
    finger until you''re certain it''s on the correct key.


    Now here''s the best part: You can use the slide to save time with punctuation
    and numerals, the next time you need to type a punctuation mark or number, try
    this technique:


    +   1. Start a action with your finger on the 123 key.


    The 123 key is to the left of the space key when the alphabetical keyboard is
    active. This is a slide, not a tap, so don''t lift your finger just yet.


    +   2. When the punctuation and numeric keyboard appears off-screen, slide your
    finger onto the punctuation mark or number you want to.


    +   3. Lift your finger.


    The cool thing is that the punctuation and numeric keyboard disappears and the
    alphabetical keyboard reappears — without tapping the 123 key to display the punctuation
    and numeric keyboard without tapping the ABC key (the key to the left of the space
    key when the punctuation and numeric keyboard is active).


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_391_0.png)


    If you slide onto certain characters and your fingers for a couple of seconds
    without lifting, your slide will be spoiled. A set of alternate characters will
    appear, as shown in Figure 19-1, preventing you from continuing the slide. The
    keys that react this are all weoves and some consonants, including N, Z, and L.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_391_1.png)


    | q w e r t y i o p |

    | a z ý  žˇ h j k l |

    | x c v b n m |

    | 123 0 _ space return |


    > FIGURE 19-1:

    Press keys for too long and your slide will end in a flurry of alternate options.


    Practice the slide for typing letters, and numerals. If you remember not to pause
    when your finger is pressing a character with pop-up alternatives, we guarantee
    that you''ll be typing faster and more accurately in a few days.


    The trick is to get in the habit of sliding your finger fast enough that the characters
    don''t pop. Just practice until it feels natural; you won''t be sorry.


    # # Autocorrect Is Your Friend


    In this section, we describe two related tips about autocorrection that can also
    help you type faster and more accurately.


