    # Timesaving map tools: Contacts, Recents, and Favorites


    The Maps app offers three tools that can save you from having to type the same
    locations over and over.


    The following sections give you the lowdown on these timesesavers.


    # Contacts


    Maps and contacts go together like peanut butter and jelly. For example, if you
    want to see a map of a contact''s address, just type the first few letters of
    the contact''s name in the search field at the bottom of the screen. Now tap the
    contact''s name in the list and a bubble drops over your house (on the map, of
    course) and two buttons appear: View Contact and Directions. Tap View Contact
    and the person''s contact card appears in an overlay; Tap Directions and step-by-step
    directions appear in an overlay.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_279_1.png)


    If you have multiple addresses for a contact, you''ll see multiple entries — one
    for each address — in the overlay. Just tap the one you want.


    After you find a location by typing an address in Maps, you can add that location
    to one of your contacts or create a contact with a location you''ve found. Do
    either, tap the location''s bubble on the map, and then tap its info bubble to
    display its Info screen, as shown in Figure 13–5, left. Now scroll to the bottom
    of the Info and tap the Create New Contact or Add to Existing Contact button,
    as shown in Figure 13–5, right.'
