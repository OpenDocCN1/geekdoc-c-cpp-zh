  md: '# Introducing Your iPhone’s Music Player


    To use your iPhone to listen to music, just tap the Music icon on the Home screen.
    Then, at the bottom of the screen that appears, you will see five icons: For You,
    New, Radio, Connect, and Library. If Apple Music is disabled in the Settings app,
    you only see four icons; For You is exclusively for Apple Music users.


    If you don''t see these icons, tap the back icon in the upper-left corner of the
    screen (the one that looks like a little arrow pointing to the left).


    If you''re used to the previous version of the Music app, you''re surely wondering
    your songs, playlists, artists, and everything else went. Don''t worry; everything
    has been moved to the Library tab, which we get to a little later in the chapter.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_161_0.png)


    Before we can tell you about the Music app, you''ll need to know about the new
    Apple Music and the not-so-new iTunes Match subscriptions, because almost everything
    in the Music app works differently if you subscribe to one or both. So, to avoid
    confusion, read the nearby “Apple Music and iTunes Match Rock” sidebar before
    you do anything.


    # APPLE MUSIC AND ITUNES MATCH


    iTunes Match and Apple Music are a pair of subscription music services offered
    by Apple.


    iTunes Match is the older of the two, designed to let you store all your music
    in iCloud so you can stream all your songs to any Mac, PC, or device. It performs
    its magic by first determining which songs in your iTunes library are available
    in iCloud. And because tens of millions of songs are up there, chances that most
    of your music is already in iCloud. Then, iTunes proceeds to upload a copy of
    every song it can match (which is much faster than uploading your entire library).
    The result is that you can stream any song in your iTunes library on any of your
    Macs, PCs, or devices, regardless of whether the song files are available on the
    particular device.


    As a bonus, all the music that iTunes plays back from iCloud is 256-Kbps AAC DRM-free
    quality if your original copy was lower quality (You can replace your lower bit-rate
    copies by downloading higher-quality versions.)


    You can store up to 100,000 songs in iCloud — songs you purchased from the iTunes
    Store don''t count. The result is that only tracks or albums you specify are stored
    locally on your devices, saving gigabytes of precious storage.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'At just $24.99 a year, iTunes Match is a bargain, but Apple Music, introduced
    in early 2015, may be a better (albeit more expensive) option. For $9.99 a month
    (or $14.99 a month for you and up to five family members), your subscription provides
    access to more than 30 million songs on demand. That''s good, but what''s even
    better is Siri knows more about music than most people. Of course she can play
    songs, albums, artists, or genres by name, but you can also ask her to play things
    like the number song in October of 1958 or music by a particular artist; in a
    few seconds, you''ll be listening to whatever your heart desires.


    Both services require Internet access, but as long as you''re connected you can
    play any song from your iTunes library (iTunes Match) or any of more than 30 million
    songs (Apple Music) on your iPhone or other device. And since the music is streamed
    effortlessly, you don''t have to worry about filling up your iCloud with music
    files.


    We''d be missed if we didn''t tell you that unless you have an unlimited data
    plan, you might want to disable iTunes Match and Apple Music over cellular by
    tapping Settings ⚙️, and then turning off the Cellular Data switch. Both subscription
    services are reasonably priced, but data charges could cost you a lot if you''re
    not careful.


    Finally, here''s our favorite tip for subscribers to either service: Before you
    go out the grid—on a plane flight or a cruise—tap the iCloud download button next
    to all the songs, albums, and playlists you want to have available when you''re
    at 30,000 feet or out on the ocean.


    You''re welcome.


