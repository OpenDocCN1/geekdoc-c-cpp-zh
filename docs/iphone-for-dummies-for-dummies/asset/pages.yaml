    # 3D Touch and Safari


    The 3D Touch force-touch feature that arrived on the iPhone 6s and Plus was added
    to later models works with Safari in a couple of main ways:


    +   **Quick actions:** Press down against the Safari icon on the Home screen to
    summon a Quick Actions Menu. When you''ve applied the proper amount of force —
    and this may take getting used to — you''ll feel tactile feedback and see the
    menu. Tap the quick action you have in mind, as shown in Figure 11-11: Show Reading
    List, Show Bookmarks, New Private Tab, or New Tab.


    +   **Peek and pop:** Press against a link in an underlying web page to get a
    peek at what link represents. Again, you''ll feel tactile feedback. With your
    finger pressed against the display, drag up to see a menu of additional options:
    Open in New Tab, Add to Reading List, and Copy. Before you drag up, if you don''t
    want to pop into the web page, lift your finger.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_241_1.png)


    > FIGURE 11-11: You see these shortcuts when you press down and hold the Safari
