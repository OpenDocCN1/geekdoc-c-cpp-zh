    # Setting up an account with another provider


    If your email account is with a provider other than iCloud, Exchange, Gmail, Yahoo!,
    AOL, or Outlook, you have a bit more work ahead of you. You''re going to need
    a bunch of information about your email account that you may not know or have
    handy.


    We suggest that you scan the following instructions, note the items you know,
    and find the answers before you continue. To find the answers, look at the documentation
    you received when you signed up for your email account or visit the provider''s
    website and search for.


    Here''s how you set up your account:


    +   1. On the Add Account screen, tap the Other button.

    2. Tap Add Mail Account.

    3. Fill in the name, address, password, and description in the appropriate fields,
    if you were setting up an account for iCloud, Gmail, Outlook, Yahoo!, or AOL.
    Tap Next.

    With any luck, that''s all you''ll have to do, although you may have to endure
    a spinning cursor for a while as the iPhone attempts to retrieve information and
    validate your account with your provider. Otherwise, continue with Step 4.

    4. Tap the button at the top of the screen that denotes the type of email server
    this uses: IMAP or POP, as shown in Figure 12-3.

    5. Fill in the Internet host name for your incoming mail server, which should
    look something like mail.providername.com or mail.providername.net.

    6. Fill in your username and password.

    7. Enter the Internet host name for your outgoing mail server, which should look
    something like smtp.providername.com or smtp.providername.net.


    You may have to scroll down to the bottom of the screen to see the outgoing mail
    fields (refer to Figure 12-3, right).'
