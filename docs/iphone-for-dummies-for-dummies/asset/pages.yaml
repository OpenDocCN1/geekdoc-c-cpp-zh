  md: '# Share the Love ...and the Links


    Ever stumble on a web page you just have to share with a buddy? The iPhone makes
    it dead simple. From the site in question, tap the share icon at the bottom of
    the browser (shown in the margin). Then tap the appropriate button to share via
    Mail, iMessage (or SMS), Twitter, Facebook, or AirDrop.


    What happens next depends on which button you tap. For example, if you tap Mail,
    a new mail message appears with the Subject line prepopulated with the name of
    the website you''re visiting and the body of the message. Just type something
    in the message body, supply your pal''s email address, and then tap the Send button.


    And, by the way, the share icon isn''t only for web browsers anymore. These days,
    in addition to finding it in Safari, you''ll find the share icon tracing many
    apps that create or display content you might wish to share.


    # Choosing a Home Page for Safari


    You may have noticed that the iPhone version of Safari does not have an option
    to specify a home page, though the popular option exists on Mac and PC versions
    of the Safari (and for that matter, every other web browser in common use today).
    When, you tap the Safari icon, you return to the last site you visited.


    The trick to having Safari open the page of your choosing rather to the last page
    you visited is to create an icon for the page you want to use as your Home page.
    This technique is creating a web clip of a web page. Here''s how to do it:


    +   1. Open the web page you want to use as your Home page and tap the share icon
    (shown in the margin).

    2. Tap the Add to Home Screen button.

    3. (Optional) Change the name of the icon if you like.

    4. Tap Add.

    5. Tap this new web clip instead of the Safari icon, and Safari opens to your
    Home page instead of the last page you visited.'
