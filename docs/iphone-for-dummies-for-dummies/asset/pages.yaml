    ![](img/8361dd8dda9818e97bf48313b13b8d6b_220_0.png)


    # Going fast


    The Time-Lapse camera feature has the opposite effect of Slo-Mo, enabling you
    to capture a scene and play it back at a warped speed. Time-Lapse is the same
    way that you select other shooting modes and tap the record icon. The app captures
    photos at dynamically selected intervals. As of this writing, there was no way
    to adjust the interval manually.


