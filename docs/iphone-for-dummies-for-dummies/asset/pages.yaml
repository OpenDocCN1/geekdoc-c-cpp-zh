    Over the several screens that appear, you get to choose your language (English
    by default) and country or region. You choose a Wi-Fi network, if available, or
    proceed using your cellular connection.


    Next, you decide whether to enable Location Services. Agreeing to this means the
    iPhone knows where you are, which is useful for Maps and other apps that rely
    on your whereabouts.


    You are asked to kindly sign in with an Apple ID (if you already have one) or
    create one. Apple ID is the credential used to set up your iCloud and iTunes Stores
    account, which include things as the iBooks Store, Game Center, and Apple Music.


    As part of the setup, you''re also asked to agree to the Terms and Conditions
