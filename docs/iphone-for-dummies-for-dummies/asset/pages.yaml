- pgno: 127
  md: '# Massive multimedia effects overhaul


    iOS 10 includes the biggest batch of new Messages features since, well, ever,
    including new tapbacks, bubble and screen effects, handwriting, annotation, Digital
    Touch, the fastest and easiest way we''ve ever seen to replace words with emojis.
    The Messages app in iOS 10 also introduces a new open architecture and built-in
    App Store for third-party add-ons, including stickers and additional emojis.


    Here''s the scoop:


    +   **To comment on a message with a tapback:** Press and hold on the message
    until the tapback bubble appears, as shown in Figure 6-6.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_127_0.png)


    If you change your mind and want to dismiss the tapback bubble without adding
    a tapback icon to the message, just tap the screen anywhere outside the tapback
    bubble.


    Tapback works only with other devices running iOS 10 or macOS Sierra. If the recipients
    are using any other operating system, they won''t see any cute balloons, *Your-name-here
    Loved/Disliked/LaughedAtEmphasized/Questioned item-name-*.


    +   **To replace text with an emoji:** Type your message and tap the emoji keyboard
    icon. As soon as you do, words that have emoji turn orange; tap an word to replace
    it with an emoji. If the word is associated with more than one emoji, you''ll
    see multiple emoji in a bubble; tap the one and it replaces the word.


    PART 2 The PDA iPhone'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'To add bubble or screen effects: Prepare your message as usual but rather tapping
    the little up-arrow-in-a-blue-circle to send it, press and hold on it for several
    seconds and the Bubble and Screen effects appear. The Bubble tab at the top to
    select Slam, Loud, Gentle, or Invisible Ink as the bubble effect for your message.
    Or tap the Screen tab and swipe left to select Balloons, Confetti, Lasers, Fireworks,
    or Shooting Star as the screen effect for this message.


    If you change your mind and don''t want to add an effect, tap the x-in-a-circle
    to dismiss the Bubble and Screen effects.


    To send a handwritten message: Sometimes nothing but a handwritten note will do.
    To send, first rotate your iPhone 90 degrees so the long edge is parallel with
    the ground (landscape mode). If the handwriting interface shown in Figure 6-7
    doesn''t appear when you rotate the iPhone, tap the handwriting icon in the lower-right
    corner of the keyboard (and shown in the margin).


    FIGURE 6-7: The secret to handwriting messages is turning your iPhone sideways.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_128_0.png)


    Tap a preset message at the bottom of the screen to use it or just writing in
    the white area (where it says, "Love ya" in Figure 6-7). If you fill the message
    area with text and to add more white space, tap the > on the right side of the
    screen.


    To send Digital Touch effects: Digital Touch effects were introduced on the Apple
    Watch and have to spread to the Messages app. To use them, tap the Digital Touch
    icon on the left of the text field (and shown in the margin) to reveal the Digital
    Touch interface shown in Figure 6-8.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_128_1.png)


    FIGURE 6-8: The Digital Touch interface ready to send a kiss.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'And here''s how it works:


    +   * To expand the Digital Touch interface to full-screen: Tap the caret (^)
    near the lower-right corner.

    * To sketch: Draw with one finger.

    * To send a pulsing circle: Tap with one finger.

    * To send a fireball: Press with two fingers.

    * To send a kiss (as shown in Figure 6-8): Tap with two fingers.

    * To send a heartbeat: Tap and hold down with two fingers.

    * To send a broken heart: Tap and hold down with two fingers, and drag down.

    * To switch ink colors: Tap the big blue circle on the left to reveal additional
    colors.

    * To add a picture or video to your Digital Touch effect: Tap the camera icon
    on the left.


    Digital Touch messages are sent automatically, so don''t tap or press the screen
    in Digital Touch mode unless you really mean it.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_129_0.png)


    Last but not least, Messages in iOS 10 have a built-in app store so you can buy
    (or download for free) sticker packs, new effects, and who knows else. To get
    some free stickers and see what third-party add-ons are available, tap the app
    icon to the left of the text field (and shown in margin).


    Once you''ve acquired apps, this is also where you access them. So, for example,
    to send a sticker from a sticker pack you''ve downloaded, tap the app icon, swipe
    left or right (if necessary) to locate the appropriate sticker pack, and tap a
    sticker to send it.


    These are all our general Messages tips and hints, but we do one more Messages-related
    feature to share: the joys of group messaging.


    # Group messaging has never been better


    One-on-one conversations in Messages are good, conversing with a group of people
    is even better.


    To start a group conversation, just add two or more people in the To field. That,
    group conversations work the same way as individual messages, so everything in
    this chapter works for group conversations, too. But we''d be remise if we didn''t
    mention a couple of innovations that make group messaging even better.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Tap Details at the upper-right corner of any group conversation. In addition
    to the features described previously (initiate a phone call or FaceTime chat,
    send your current location, and so on), you see a Leave This Conversation button
    (below the Do Not Disturb switch). If you''ve wished you could bail out of a multiperson-conversation,
    you know what a big deal this does.


    Now imagine that you''re part of a lively conversation with a handful of friends.
    You don''t want to leave, but you want to silence its all-too-frequent notifications.
    Tap Details in the upper-right corner of any group conversation, and then enable
    Do Not Disturb.


    You are now an official messaging maven.


    # Taking Note of Notes


    The Notes app gets a major overhaul in iOS 9, and not much has changed. You can
    create notes that you can save or send through email (iPhone 5 and later), capture
    maps, photos, URLs, draw with your finger and easily locate photos, maps, and
    anything else you attach using Attachments Browser.


    Start by tapping the Notes icon on the Home screen. If your iPhone has 3D Touch,
    you can press the Notes icon and use the quick action to open directly to a new
    blank note, a photo, or a sketch.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_130_0.png)


    When you create folders, tap any folder to reveal a list of items. Figure 6-9,
    for example, displays a note contained in a folder named Notes; to return to the
    Notes folder, tap in the upper-left corner.


    We''d be remind if we didn''t remind you that you can sync notes with your computer
    (Chapter 3) and if you''ve enabled note syncing for more than one account (Settings
    > Mail, Contacts, Calendars), you''ll see not only your iCloud Notes also a folder
    for each additional account that''s syncing notes. Tap a folder to see its list
    of contents; tap the < in the upper-left corner of the screen to return to the
    list of folders.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_130_1.png)


    FIGURE 6-9:

    Creating a note in Notes.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'An account refers to a Microsoft Exchange, iCloud, Apple ID, Yahoo!, AOL, or
    other account that offers a notes feature.


    Now, create a note by tapping the New Note (pencil on paper) icon in the lower-right
    corner of the screen. The virtual keyboard appears. Type your note to modify the
    formatting or swipe your note with a checklist, photo, video, or finger-doodle,
    tap the plus-in-a-circle, the keyboard on the right. A row of buttons above the
    keyboard — checklist, formatting, add photo or video, and finger-drawing (from
    left to right). To dismiss the buttons and go back to typing text, tap the X on
    the right of the row of buttons.


    When you''re finished, tap the Done button in the top-right corner to save the
    note.


    After a note is saved, you can tap the share icon at the top-right corner of the
    screen to share the note via AirDrop (iPhone 5 or later); send it as an iMessage
    or email; post it to Facebook; save it as a PDF in iBook; copy it to the Clipboard
    for pasting elsewhere; or print it.


    New in iOS 10 is the capability to share a note with anyone; to invite someone
    to share a note, tap the person-in-a-circle icon at the top center of the screen.
    The invite is not using iOS 10, he or she can view and edit the note on the web.
    For those using iOS 10, the shared notes appear in their Notes app with a little
    shared note name.


    To delete a note, tap the trashcan icon at the bottom of the screen.


    And finally, tap the Notes button, at the top-left corner of the screen, to return
    to the list of notes. From here, you can tap any note open for viewing or editing.


    Tap the four little squares in the lower-left corner to open Attachment Browser,
    which displays photos, videos, maps, and finger-drawings from every note.


    And that''s all she er, we er, wrote. And now you know all you need to know Notes!
    Onward!'
