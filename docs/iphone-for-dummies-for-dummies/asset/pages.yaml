    That''s what you need to know about the settings that apply to sending email.


    # Setting your message and account settings


    This discussion of Mail involves more settings that deal with your various accounts.


    # Checking and viewing email settings


    Several settings affect the way you check and view email. You might want to modify
    one or more, so we describe what they do and where to find them:


    To specify how often the iPhone checks for messages: On the Home screen, tap Settings
    > Mail > Accounts > Fetch New Data. You''re entering the world of fetching and
    pushing. Check out Figure 12-22 to glance at your options. If your program supports
    push and you have turned on, messages are sent to your iPhone automatically as
    soon as they reach the server. If you turned off push or your email account doesn''t
    support it, the iPhone fetches instead (that is, messages are batched before they
    are sent). Choices for fetching are Every 15 Minutes, Every 30 Minutes, Hourly,
    and Manually. Tap the one you prefer, keeping in mind that fetching less frequently
    has a positive effect on battery life.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_269_0.png)'
