  md: '# First things first: About iPhone backups


    Whether you know it or not, your iPhone backs up your settings, app data, and
    other information on your iPhone whenever you connect to a computer and iTunes
    to


    +   - Sync with your iPhone

    - Update your iPhone

    - Restore your iPhone


    Every time you sync your iPhone and computer, most (but not all) of your iPhone
    content — photos you''ve taken with your iPhone, text messages, notes, favorites,
    sound settings, and is backed up to either your computer''s hard drive or iCloud
    before the begins. Most of your media, including songs, TV shows, and movies,
    isn''t backed up in this process. This shouldn''t be a problem because these files
    are usually restored when you sync with iTunes.


    Backups are saved automatically and stored on your computer by default. You can
    choose to back up to iCloud by clicking the appropriate button in the iTunes Summary
    page, or see it in the next section.


    Backups are handy if anything goes wonky with your iPhone or you get a new one.
    A backup list restores you (if not all) of your settings and many files that aren''t
    synced with iCloud or iTunes on your computer. If you''ve ever backed up an iPad,
    iPod touch, or iPhone, you can restore the new iPhone with the older device''s
    backup, the device will inherit the settings and media from the old one.


    Here''s how to enable backing up to iCloud from your iPhone, which we strongly
    suggest computer-free iPhone users do without further delay:


    +   1. Tap Settings > iCloud > Backup.

    2. Tap iCloud Backup to switch it on.

    3. (Optional) To initiate a backup immediately, tap Back Up.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_68_0.png)


    For those who are syncing with iTunes on a computer, listen closely: Choosing
    this option means your iPhone no longer backs up automatically when you connect
    to your computer.


    If you''re a computer-free iPhone user, you don''t care because you never connect
    your iPhone to a computer. But if you sync your iPhone with your computer, as
    many folks do, give some thought to which option suits your needs. Consider that
    restoring from a computer backup requires physical or Wi-Fi access to the computer
    but doesn''t require Internet access. Restoring from iCloud can take you


