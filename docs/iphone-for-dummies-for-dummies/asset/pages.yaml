- pgno: 345
  md: 'If one of the steps that follow fixes your iPhone issue, we urge you not to
    close the book. Rather, skim through the rest of the chapter, paying particular
    attention to the “Dude, Where''s My Stuff?” section near the end of the chapter.


    # # iPhone Issues


    Our first category of troubleshooting techniques applies to an iPhone that''s
    frozen or otherwise acting up. The recommended procedure when this happens is
    to perform the seven Rs in sequence:


    +   - Recharge your iPhone.

    - Restart your iPhone.

    - Reset your iPhone.

    - Remove content from your iPhone.

    - Reset your iPhone''s settings and content.

    - Restore your iPhone.

    - Renew your iPhone in Recovery mode.


    If the first technique doesn''t do the trick, go on to the second. If the second
    doesn''t work, try the third. And so on.


    # ## But first...


    But before you even start those procedures, Apple recommends you take these steps:


    +   1. Verify that you have the current version of iTunes installed on your Mac
    or PC.


    +   2. Verify that you''re connecting your iPhone to your computer using a USB
    2.0 or 3.0 port.


    If you encounter difficulties at this point, we implore you to read the paragraph
    in the next section that begins with: “Don''t plug the iPhone''s Lightning connector
    cable...."'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 3. Make sure your iPhone software is up-to-date.


    +   - To check your iPhone software from iTunes on your Mac or PC: Connect your
    iPhone to your computer, launch iTunes (if necessary), and click the iPhone icon
    to the right of the drop-down menus near the top-left of the iTunes window. Click
    the Summary tab, and then click the Check for Update button.

    - To check your iPhone software from your iPhone: On the Home screen, tap Settings
    ⚙️: General ⚙️ Software Update.


    If your iPhone requires an update, you receive instructions for do so. Otherwise,
    please continue.


    If those three easy steps don''t get you back up and running and your iPhone is
    still acting up — it freezes, doesn''t wake up from sleep, doesn''t do something
    it is used to, or in any other way acts improperly — don''t panic. The following
    sections describe the things you should try, in the order that we (and Apple)
    recommend.


    # Recharge your iPhone


    If your iPhone acts in any way, shape, or form, the first thing you should try
    is to give its battery a full recharge.


    > Don''t plug the iPhone''s Lightning connector cable into a USB port on a keyboard,
    a monitor, or an unpowered USB hub. Need to plug the cable into one of the USB
    ports on the computer itself or a powered hub (one that requires an AC source)
    because the USB ports on your computer supply more power than ports on keyboards,
    monitors, or unpowered hubs.


    > Most USB hubs, the kind you plug into an AC outlet, will charge your iPhone
    just fine. But powered, or unpowered, hubs — ones that doesn'' plug into the wall
    for power — won''t cut it when it comes to charging your phone.


    Note that you use the included USB power adapter to recharge your iPhone from
    an AC outlet rather than a computer. So if your iPhone isn''t charging when you
    connect it to your computer, try it from a wall outlet instead. In addition, power
    strips by Belkin and other vendors include one or more USB ports that will work
    for charging.


    If you''re in a hurry, charge your iPhone for a minimum of 20 minutes. We think
    a full charge is a better idea, but a 20–minute charge is better than no at all.
    For faster charging in any circumstances, turn your iPhone off while it charges.


    CHAPTER 16 When Good iPhones Go Bad 335'
