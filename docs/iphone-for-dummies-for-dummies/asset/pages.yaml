    Override to turn it on, and tap Time Zone. The type zone location using the keyboard
    appears. When Time Zone Override is turned off, events are displayed according
    to the time zone of your current location.


    Tap Alternate Calendars in Settings if you want to display a Chinese, a Hebrew,
    or an Islamic calendar alongside your English calendar.


    > To turn off an audible calendar alert, tap Settings > Sounds, and then make
    sure the selected alert tone is set to None. (You see only the last calendar alert
    you selected. To see your other choices, tap Calendar Alerts.) You can also default
    alert times for birthdays, all-day events, when it’s time to leave, and certain
    other events. Tap Settings > Calendar, and scroll down to Default Times.


    Back in the Calendar app, if you want to modify an existing calendar entry, tap
    the entry, tap Edit, and make whichever changes need to be made. To wipe out a
    calendar entry, tap Edit > Delete Event. Then tap Delete Event (again).


    Calendar entries you create on your iPhone are synchronized with the calendar
    you specified in the ITunes pane.


    > Current and future calendar events can be synchronized automatically through
    Apple’s iCloud service. In Settings, you can also sync events. Your options are
    to sync events 6 months back, 3 months back, 1 month back, or 2 weeks back. Or
    you can sync all your events.


    You can use iCloud to keep your calendars updated and in sync across all your
    iOS devices and computers. Tap Settings > iCloud and ensure the Calendar–option
