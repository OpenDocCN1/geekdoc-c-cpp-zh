- pgno: 56
  md: '# # Navigating beyond the Home Screen


    The Home screen, which we discuss in Chapter 1, isn''t the only screenful of icons
    on your phone. After you start adding apps from the App Store (see Chapter 15),
    you''ll likely have multiple screens.


    Initially, you see three tiny dots above the Phone, Mail, Safari, and Music icons.
    Each dot denotes an additional screen, containing up to 20 additional icons on
    the iPhone SE, and up to 24 on the iPhone 6, 6 Plus, 6s, 6s Plus, 7, and Plus
    7. The icons can represent pages or folders of apps. The middle dot, which represents
    the Home screen, or the screen you''re currently viewing. The next dot to the
    right, in gray, is the first additional screen on you can park icons. You can
    get it by flickering to left (assuming you''re on the first screen) or by tapping
    the dot. You have 15 screens in all; as you add screens, you add dots.


    The leftmost dot, also gray at first, represents the today screen. You can get
    to it by flickering left to right. The today screen can be part of Notification
    Center but is not out on its own.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_56_0.png)


    TIP You must be precise when tapping a dot. Otherwise, you will open one of the
    app or folder icons when switching screens.


    The four icons in the bottom row — Phone, Safari, Mail, and Music — are in part
    of the screen as the dock. When you switch from screen to screen as described,
    these icons remain on the screen that is, unless the Today screen is in view or
    you''re inside an app.


    You can easily move icons within a screen or from screen to screen. Simply press
    and hold down on any icon until all the icons on the screen begin to juggle. Then
    drag the icon you want to park elsewhere to its new location. The other icons
    on the screen kindly step aside to make room. To move an icon to a new screen,
    drag it to the right or left edge of the screen. When you''re satisfied with the
    new layout, press the Home button to stop the juggling.


    Want to jump to the last Home screen of icons you had open? Simply press the Home
    button. Want to jump to the first screenful of icons, assuming you''re not already
    there? Press Home again.


    If you press twice in rapid succession, you invoke the multitasking feature, which
    is described in the “Multitasking” section. Pressing twice in rapid succession
    used to bring you to a handy Spotlight search feature. Don''t worry: The feature
    is still available (and also discussed later in this chapter) but is now summoned
    in any screen by swiping down.


    CHAPTER 2 iPhone Basic Training 45'
