    in use. Tap again to select the next keyboard in the list of international keyboards
    (well as the Emoji keyboard) that you turned on Settings. If you keep cycling,
    you eventually come back to your original English layout. Here''s an alternative
    method for summoning a keyboard you''ve enabled: Press your finger against the
    international keyboard key to summon a pop-up window that displays all the keyboards
    that are ready for action. Slide your finger from the list until it lands on the
    keyboard you want to use, and then release to select that.


    You can use handwriting character recognition for simplified and traditional variations
    of Chinese. Just drag your finger in the box provided. Some Chinese keyboards
    don''t rely on handwriting.


    And here''s a neat trick with iOS 10: You can type in two languages without switching
    from one to the other, just type the appropriate word or in whichever language
    makes sense and the iPhone takes a stab at what it thinks you mean to type next
    — in the appropriate language. You can type with any pair of the following languages:
