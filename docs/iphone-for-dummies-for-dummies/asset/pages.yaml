    # Alert: You''ve got messages


    Your iPhone can alert you to new messages with an audio alert, an on-screen alert,
    or both.


    If you want to hear a sound when a message arrives, go to the Home screen and
    tap Settings> Sounds> Text Tone, and then tap one of the available sounds. You
    can audit any sound in the list by tapping.


    You hear the sounds when you audition them in the Settings app, even if you have
    the ring/silent switch set to silent. After you exit the Settings app, however,
    you won''t hear a sound when a message arrives if the ring/silent switch is set
    to silent or the Do Not Disturb feature is enabled.


    ![](img/8361dd8dda9818e97bf48313b13b8d6b_121_0.png)


    If you don''t want to hear an alert when a message arrives, instead of tapping
    one of the listed sounds, tap the first item in list: None.


    You can also assign a custom alert sound to anyone in your Contacts list. Follow
    the instructions for assigning a custom ringtone (see Chapter 4), but instead
    of tapping Ringer, tap the item directly below it, Text Tone.


    In addition to playing a sound when a new message arrives, your iPhone can also
    display several types of on-screen alerts. To enable or disable these visual alerts,
    tap Settings> Notifications> Messages. See the screen in Figure 6–1. If you don''t
    see the Messages Options section, flick upward on the screen to scroll downward.


    What happens when you receive a new message depends on how you''ve set your notification
