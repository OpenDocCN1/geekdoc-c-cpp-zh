    | How Sphero Works | 7 |\n| Getting Started | 9 |\n| Go, Sphero, Go! | 11 |\n\
    | Made for Play | 13 |\n| A Sensitive Robot | 15 |\n| MacroLab | 17 |\n| Lightning\
    \ Lab | 19 |\n| Give It a Try! | 21 |\n| Glossary | 22 |\n| Find Out More | 23\
    \ |\n| Index | 24 |\n| About the Author | 24 |\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_7_0.png)\n\
    \nSphero SPRK+ can be programmed using the Lightning Lab application.\n\n## Meet\
    \ Sphero\n\nHave you ever wanted to own a robot of your very own? Meet Sphero!\
    \ Sphero is a robotic ball that can be controlled using a tablet or smartphone.\
    \ Sphero started out as a toy. Now, it is used to teach kids how to write computer\
    \ programs.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_9_0.png)\n\nLook at Sphero\
    \ up close! Use the Robot Reveal screen in the Lightning Lab app to find out what\
    \ each part is.\n\n## How Sphero Works\n\nThe outside of Sphero is a hard shell\
    \ made of very strong plastic. On the inside is a robot that stays upright as\
    \ the plastic ball around it rolls. It does this using two motors and a **gyroscope**.\
    \ Also inside the ball are **LED** lights that can change colors.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_11_0.png)\n\
    \nTap a Robot to Connect!\n\nSPRK+ Connecting...\n\nSphero connects to your device\
    \ with Bluetooth. You will know when SPRK+ is connected!\n\n## Getting Started\n\
    \nYou need a tablet or smartphone to use Sphero. Get started by **pairing** the\
    \ Sphero with your device. Tap the Sphero to turn it on. Then open the Sphero\
    \ Go or Lightning Lab app on your device. The app will search for nearby robots.\
    \ Select your Sphero when it shows up on the screen.\n\n### Other Sphero Robots\n\
    \n- **Ollie:** This Sphero is made for racing. Ollie goes 14 miles (22.5 kilometers)\
    \ per hour!\n- **BB-8:** This Sphero looks and moves like the droid from *Star\
    \ Wars: The Force Awakens*.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_13_0.png)\n\
    \nWhen Sphero’s bright blue taillight is facing you, it is ready to roll.\n\n\
    ## Go, Sphero, Go!\n\nBefore you can drive your Sphero, you need to adjust its\
    \ taillight. The taillight is a small blue light on Sphero. It shows where the\
    \ back side of the robot is. When the light is pointed at you, Sphero is ready\
    \ to drive.\n\nUse your device screen to control Sphero. Push UP to go forward\
    \ and DOWN to go backward.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_15_0.png)\n\
    \nIn the Draw N’ Drive app, you draw the picture, and Sphero will drive it. Try\
    \ changing colors or writing your name!\n\n## Made for Play\n\nThere are a lot\
    \ of ways you can play with Sphero. Hold it in your hand like a controller for\
    \ video games such as *Exile*. Drive it into a cup to play Sphero golf. You can\
    \ even use the Draw N’ Drive app to draw a path on your device screen for Sphero\
    \ to follow.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_17_0.png)\n\nSphero can\
    \ sense when it runs into another object, and even when it is falling.\n\n## A\
    \ Sensitive Robot\n\nA Sphero robot uses **sensors** to keep track of the way\
    \ it moves. It can tell how fast it is going and in which direction it is moving.\
    \ It knows if it hits another object or if it is falling through the air. You\
    \ can use Sphero’s sensors to program it to react in different ways.\n\n### Sphero’s\
    \ Inventors\n\nInventors Ian Bernstein and Adam Wilson have always loved making\
    \ robots. They teamed up in 2010 to create Sphero. They built the robot because\
    \ they wanted to create something fun to control with their smartphones.\n\n**Figure\
    \ 8**\n\n```text\nTone of 500 Hz for 0.5 s\nRGB 1, 0, 0, 0\nBack LED 1, 0, 0\n\
    Stabilization 0.5 s\nDelay 2.0 s\nTone of 500 Hz for 0.5 s\nBack LED 0, 0, 0\n\
    Tone of 500 Hz for 0.5 s\nSet Orientation 0°\nStabilization 0.5 s\nDelay 2.0 s\n\
    Tone of 500 Hz for 0.5 s\nRoll 0.5 s\nDelay 0.5 s\nRGB 1, 0, 0, 0\nTone of 500\
    \ Hz for 0.5 s\n```\n\nYou can write programs in the MacroLab. This macro, or\
    \ program, makes Sphero drive in a figure eight.\n\n## MacroLab\n\nIf you are\
    \ ready for a challenge, try creating a macro in the MacroLab app. A macro is\
    \ a simple computer program that tells Sphero what to do. MacroLab uses symbols\
    \ to represent instructions for Sphero. For example, an arrow tells Sphero to\
    \ roll. A stop sign tells it to stop.\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_21_0.png)\n\
    \nThe SPRK Lightning Lab is where you can write programs for Sphero. This is a\
    \ program for making Sphero spin!\n\n## Lightning Lab\n\nAnother way to write\
    \ a program for Sphero is to use the Lightning Lab app. Lightning Lab lets you\
    \ snap colorful blocks together to create programs. Blocks of different colors\
    \ have different jobs. Blue-green “action” blocks make changes to Sphero’s movements\
    \ or lights. Purple “control” blocks tell Sphero when to perform an action.\n\n\
    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_23_0.png)\n\nWith the right tools, there's\
    \ no limit to the fun you will have!\n\n## Give It a Try!\n\nTime to give it a\
    \ try! The best way to start programming is to borrow a program that is already\
    \ made. MacroLab and Lightning Lab both come with sample programs for you to try.\
    \ Choose one, then try making small changes to see what happens. Every **maker**\
    \ must be ready to tinker!\n\n### Sphero for Makers\n\nSphero makes a great engine\
    \ for inventions that can move or spin. Try making Sphero power a car. Sphero\
    \ can swim, too. Sphero can even paint. There is no limit to what you can do with\
    \ a creative program.\n"
