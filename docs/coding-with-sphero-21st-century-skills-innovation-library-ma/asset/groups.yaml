    Corporate Graphics\n\n**给成年人的提示：** 在允许孩子进行本书中的活动之前，请先审阅这些活动的说明。对于你认为孩子无法安全独立完成的任何活动，请务必帮助他们。\n\
    \n**给孩子们的提示：** 进行这些活动时，如果需要帮助，一定要向成年人求助。始终把安全放在第一位！\n\n## 目录\n\n| 章节 | 页码 |\n\
    | --- | --- |\n| 认识 Sphero | 5 |\n| Sphero 的工作原理 | 7 |\n| 开始使用 | 9 |\n| 出发吧，Sphero，出发！\
    \ | 11 |\n| 为玩乐而生 | 13 |\n| 敏感的机器人 | 15 |\n| MacroLab | 17 |\n| Lightning Lab\
    \ | 19 |\n| 试一试！ | 21 |\n| 词汇表 | 22 |\n| 了解更多 | 23 |\n| 索引 | 24 |\n| 关于作者 | 24\
    \ |\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_7_0.png)\n\nSphero SPRK+ 可以使用\
    \ Lightning Lab 应用程序进行编程。\n\n## 认识 Sphero\n\n你是否曾想过拥有一个属于自己的机器人？来认识 Sphero 吧！Sphero\
    \ 是一个可以通过平板电脑或智能手机控制的机器人球。Sphero 最初是一个玩具。现在，它被用来教孩子们如何编写计算机程序。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_9_0.png)\n\
    \n近距离观察 Sphero！使用 Lightning Lab 应用中的“机器人揭秘”屏幕，了解每个部件是什么。\n\n## Sphero 的工作原理\n\n\
    Sphero 的外壳是由非常坚固的塑料制成的硬壳。内部是一个机器人，当周围的塑料球滚动时，它能保持直立。它通过两个电机和一个**陀螺仪**来实现这一点。球体内部还有可以变色的\
    \ **LED** 灯。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_11_0.png)\n\n点击机器人以连接！\n\
    \nSPRK+ 正在连接……\n\nSphero 通过蓝牙连接到你的设备。当 SPRK+ 连接成功时，你就会知道！\n\n## 开始使用\n\n你需要一台平板电脑或智能手机来使用\
    \ Sphero。首先通过将 Sphero 与你的设备**配对**来开始。点击 Sphero 将其开启。然后打开你设备上的 Sphero Go 或 Lightning\
    \ Lab 应用。该应用会搜索附近的机器人。当你的 Sphero 出现在屏幕上时，选择它。\n\n### 其他 Sphero 机器人\n\n- **Ollie：**\
    \ 这款 Sphero 专为竞速而设计。Ollie 的时速可达 14 英里（22.5 公里）！\n- **BB-8：** 这款 Sphero 的外形和移动方式都像\
    \ *星球大战：原力觉醒* 中的机器人。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_13_0.png)\n\n\
    当 Sphero 明亮的蓝色尾灯面向你时，它就准备好滚动了。\n\n## 出发吧，Sphero，出发！\n\n在驾驶 Sphero 之前，你需要调整它的尾灯。尾灯是\
    \ Sphero 上的一个小蓝灯。它显示机器人背面所在的位置。当灯光指向你时，Sphero 就准备好行驶了。\n\n使用设备屏幕控制 Sphero。向上推以前进，向下推以后退。\n\
    \n![](img/3b0b30eeb4afa76d16dd7e7c96584469_15_0.png)\n\n在 Draw N’ Drive 应用中，你画出图案，Sphero\
    \ 就会沿着它行驶。试着改变颜色或写下你的名字！\n\n## 为玩乐而生\n\n有很多方式可以玩 Sphero。像握持 *Exile* 等电子游戏的控制器一样把它握在手中。把它驶入杯子来玩\
    \ Sphero 高尔夫。你甚至可以使用 Draw N’ Drive 应用在设备屏幕上画出一条路径，让 Sphero 沿着它行驶。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_17_0.png)\n\
    \nSphero 能感知到自己何时撞到另一个物体，甚至能感知到自己何时正在下落。\n\n## 敏感的机器人\n\nSphero 机器人使用**传感器**来追踪自己的运动方式。它能知道自己移动得多快以及朝哪个方向移动。它能知道自己是否撞到另一个物体，或者是否正在空中下落。你可以利用\
    \ Sphero 的传感器为它编程，让它以不同方式做出反应。\n\n### Sphero 的发明者\n\n发明者 Ian Bernstein 和 Adam\
    \ Wilson 一直热爱制造机器人。他们在 2010 年合作创造了 Sphero。他们制造这个机器人，是因为想创造出一种能用智能手机控制的、有趣的东西。\n\
    \n**图 8**\n\n```text\nTone of 500 Hz for 0.5 s\nRGB 1, 0, 0, 0\nBack LED 1, 0,\
    \ 0\nStabilization 0.5 s\nDelay 2.0 s\nTone of 500 Hz for 0.5 s\nBack LED 0, 0,\
    \ 0\nTone of 500 Hz for 0.5 s\nSet Orientation 0°\nStabilization 0.5 s\nDelay\
    \ 2.0 s\nTone of 500 Hz for 0.5 s\nRoll 0.5 s\nDelay 0.5 s\nRGB 1, 0, 0, 0\nTone\
    \ of 500 Hz for 0.5 s\n```\n\n你可以在 MacroLab 中编写程序。这个宏（即程序）能让 Sphero 按 8 字形行驶。\n\
    \n## MacroLab\n\n如果你准备好接受挑战，试着在 MacroLab 应用中创建一个宏。宏是一种简单的计算机程序，用来告诉 Sphero 该做什么。MacroLab\
    \ 使用符号来表示给 Sphero 的指令。例如，箭头告诉 Sphero 滚动。停止标志告诉它停下。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_21_0.png)\n\
    \nSPRK Lightning Lab 是你为 Sphero 编写程序的地方。这是一个让 Sphero 旋转的程序！\n\n## Lightning Lab\n\
    \n为 Sphero 编写程序的另一种方法是使用 Lightning Lab 应用。Lightning Lab 让你把彩色积木块拼接在一起以创建程序。不同颜色的积木块有不同的功能。蓝绿色的“动作”积木块会改变\
    \ Sphero 的运动或灯光。紫色的“控制”积木块告诉 Sphero 何时执行某个动作。\n\n![](img/3b0b30eeb4afa76d16dd7e7c96584469_23_0.png)\n\
    \n有了合适的工具，你将获得无穷无尽的乐趣！\n\n## 试一试！\n\n该试一试了！开始编程的最佳方式是借用已经制作好的程序。MacroLab 和 Lightning\
    \ Lab 都附带示例程序供你尝试。选择一个，然后试着做一些小改动，看看会发生什么。每个**创客**都必须准备好动手捣鼓！\n\n### 面向创客的 Sphero\n\
    \nSphero 是能为可移动或旋转的发明提供动力的绝佳引擎。试着让 Sphero 驱动一辆汽车。Sphero 还能游泳。Sphero 甚至能画画。有了富有创意的程序，你能做的事情没有极限。\n"
