    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_7_0.png)


    Sphero SPRK+ can be programmed using the Lightning Lab application.'
  - '[PAGE 8]


    # Meet Sphero


    Have you ever wanted to own a robot of your very own? Meet Sphero! Sphero is a
    robotic ball that can be controlled using a tablet or smartphone. Sphero started
    out as a toy. Now, it is used to teach kids how to write computer programs.'
  - '[PAGE 9]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_9_0.png)


    Look at Sphero up close! Use the Robot Reveal screen in the Lightning Lab app
    to find out what each part is.'
  - '[PAGE 10]


    # How Sphero Works


    The outside of Sphero is a hard shell made of very strong plastic. On the inside
    is a robot that stays upright as the plastic ball around it rolls. It does this
    using two motors and a **gyroscope**. Also inside the ball are **LED** lights
    that can change colors.'
  - '[PAGE 11]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_11_0.png)


    Tap a Robot to Connect!


    SPRK+ Connecting...


    Sphero connects to your device with Bluetooth. You will know when SPRK+ is connected!'
  - '[PAGE 12]


    # # Getting Started


    You need a tablet or smartphone to use Sphero. Get started by **pairing** the
    Sphero with your device. Tap the Sphero to turn it on. Then open the Sphero Go
    or Lightning Lab app on your device. The app will search for nearby robots. Select
    your Sphero when it shows up on the screen.


    # ## Other Sphero Robots


    **Ollie:** This Sphero is made for racing. Ollie goes 14 miles (22.5 kilometers)
    per hour!


    **BB-8:** This Sphero looks and moves like the droid from *Star Wars: The Force
    Awakens*.'
  - '[PAGE 13]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_13_0.png)


    When Sphero’s bright blue taillight is facing you, it is ready to roll.'
  - '[PAGE 14]


    # Go, Sphero, Go!


    Before you can drive your Sphero, you need to adjust its taillight. The taillight
    is a small blue light on Sphero. It shows where the back side of the robot is.
    When the light is pointed at you, Sphero is ready to drive.


    Use your device screen to control Sphero. Push UP to go forward and DOWN to go
    backward.'
  - '[PAGE 15]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_15_0.png)


    In the Draw N'' Drive app, you draw the picture, and Sphero will drive it. Try
    changing colors or writing your name!'
  - '[PAGE 16]


    # # Made for Play


    There are a lot of ways you can play with Sphero. Hold it in your hand like a
    controller for video games such as *Exile*. Drive it into a cup to play Sphero
    golf. You can even use the Draw N’ Drive app to draw a path on your device screen
    for Sphero to follow.'
  - '[PAGE 17]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_17_0.png)


    Sphero can sense when it runs into another object, and even when it is falling.'
  - '[PAGE 18]


    # # A Sensitive Robot


    A Sphero robot uses **sensors** to keep track of the way it moves. It can tell
    how fast it is going and in which direction it is moving. It knows if it hits
    another object or if it is falling through the air. You can use Sphero’s sensors
    to program it to react in different ways.


    # ## Sphero’s Inventors


    Inventors Ian Bernstein and Adam Wilson have always loved making robots. They
    teamed up in 2010 to create Sphero. They built the robot because they wanted to
    create something fun to control with their smartphones.'
  - '[PAGE 19]


    # Figure 8


    ```

    ```

    Tone of 500 Hz for 0.5 s

    RGB 1, 0, 0, 0

    Back LED 1, 0, 0

    Stabilization 0.5 s

    Delay 2.0 s

    Tone of 500 Hz for 0.5 s

    Back LED 0, 0, 0

    Back LED 0, 0, 0

    Back LED 0, 0, 0

    Back LED 0, 0, 0

    Back LED 0, 0, 0

    Back LED 0, 0, 0

    Tone of 500 Hz for 0.5 s

    Set Orientation 0°

    Stabilization 0.5 s

    Delay 2.0 s

    Tone of 500 Hz for 0.5 s

    Roll 0.5 s

    Delay 0.5 s

    RGB 1, 0, 0, 0

    Tone of 500 Hz for 0.5 s

    ```

    ```


    You can write programs in the MacroLab. This macro, or program, makes Sphero drive
    in a figure eight.'
  - '[PAGE 20]


    # MacroLab


    If you are ready for a challenge, try creating a macro in the MacroLab app. A
    macro is a simple computer program that tells Sphero what to do. MacroLab uses
    symbols to represent instructions for Sphero. For example, an arrow tells Sphero
    to roll. A stop sign tells it to stop.'
  - '[PAGE 21]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_21_0.png)


    The SPRK Lightning Lab is where you can write programs for Sphero. This is a program
    for making Sphero spin!'
  - '[PAGE 22]


    # Lightning Lab


    Another way to write a program for Sphero is to use the Lightning Lab app. Lightning
    Lab lets you snap colorful blocks together to create programs. Blocks of different
    colors have different jobs. Blue-green “action” blocks make changes to Sphero’s
    movements or lights. Purple “control” blocks tell Sphero when to perform an action.'
  - '[PAGE 23]


    ![](img/3b0b30eeb4afa76d16dd7e7c96584469_23_0.png)


    With the right tools, there''s no limit to the fun you will have!'
  - '[PAGE 24]


    # Give It a Try!


    Time to give it a try! The best way to start programming is to borrow a program
    that is already made. MacroLab and Lightning Lab both come with sample programs
    for you to try. Choose one, then try making small changes to see what happens.
    Every **maker** must be ready to tinker!


    # Sphero for Makers


    Sphero makes a great engine for inventions that can move or spin. Try making Sphero
    power a car, Sphero can swim, too. Sphero can even paint. There is no limit to
    what you can do with a creative program.'
