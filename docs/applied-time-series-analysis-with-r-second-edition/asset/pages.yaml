    # 12.3.4 Discrete Wavelet Transform for Data Sets of Finite Length


    For clarity of presentation, the discussion up to this point regarding wavelets
    has involved data on a continuum. However, for analyzing discrete data, $\boldsymbol{x}
    = (x_1, x_2, \dots, x_n)$, of finite length (such as a realization from a discrete
    time series), we will use the discrete wavelet transform (DWT). Given an orthogonal
    wavelet basis set, the DWT maps the vector $\boldsymbol{x} = (x_1, x_2, \dots,
    x_n)$ to a vector of $n$ wavelet coefficients. Letting $\boldsymbol{w}$ denote
    the vector of wavelet coefficients, then it can be shown that


    $\boldsymbol{w} = \boldsymbol{M}\boldsymbol{x},\tag{12.22}$


    where $\boldsymbol{M}$ is an orthogonal matrix that can be written as


    $\boldsymbol{M} = \begin{pmatrix} \boldsymbol{M}_1 \\ \boldsymbol{M}_2 \\ \vdots
    \\ \boldsymbol{M}_{J_0} \\ \boldsymbol{V}_{J_0} \end{pmatrix},\tag{12.23}$'
