    be well approximated by an ARMA(2, 2) model as the following development shows.
    Let \(Y_t^r\) be given by [Equation 4.10](#) with \(m=1\) with \(N_t=a_t\), and
    consider \(\phi(B)Y_t^r\), where


    $$\phi(B)=1-2\cos(2\pi f_1)B+B^2.$$


    It follows that


    $$\begin{aligned}\phi(B)Y_t^r &= \phi(B)(H_t+a_t) \\ &= \phi(B)H_t+\phi(B)a_t,
    \tag{4.14}\end{aligned}$$


    where \(H_t\) is given in [Equation 4.10](#). But \(\phi(B)H_t=0\) (Problem 4.2)
    from which it follows that \(\phi(B)Y_t^r=\phi(B)a_t\). In practice, \(\phi(B)\)
    must be estimated, and, in place of [Equation 4.14](#), we have


    $$\hat{\phi}(B)Y_t^r=\varepsilon_t+\hat{\phi}(B)a_t. \tag{4.15}$$


    where


    $$\varepsilon_t=\hat{\phi}(B)A_1\cos(2\pi f_1t+\upsilon_1).$$


    If \(\varepsilon_t\) is sufficiently small, which it often is, then it produces
    only a small perturbation to \(\hat{\phi}(B)a_t\), and [Equation 4.14](#) is well
