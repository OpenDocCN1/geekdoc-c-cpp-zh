    # 13.3.3 Analyzing TVF Data Using the G(p; λ) Model


    At the end of Section 13.1, we outlined the techniques for analyzing TVF data
    using G-stationary methods. In this section, we briefly discuss the items in the
    outline and provide a few examples with a focus on using the G(p; λ) model. These
    techniques are discussed in much greater detail in Gray et al. (2005), Jiang et
    al. (2006), and Choi et al. (2006). The tswge R package contains functions that
    perform the calculations involved in the analysis steps described below. See Appendix
    13B for more details. M-stationary processes are analyzed using the G(p; λ)-based
    functions by specifying λ = 0.


    Step 1—Transform the Time Axis to Obtain a Stationary Dual Realization: A search
    routine is used to search for the values of λ and offset that produce the “most
    stationary” dual. For each set of λ, h, and offset values considered in the search,
    the data, X(t_k), k = 1, 2, ..., are approximated at the t_k’s in Equation 13.18,
