  md: 'case, identifying p and q in an ARMA(p,q) model). ML estimation is a common
    tool that applies to a model or class of distributions with a fixed set of parameters,
    say α1, ..., αk. In this setting, the ML estimators are the estimators α̂1, ...,
    α̂k that maximize the likelihood function. However, simply maximizing the likelihood
    is not an appropriate strategy when parameters are being added to an existing
    model. For example, suppose ML methods are used to choose between a model with
    k parameters (e.g., an AR(k)) and a model from the same class with k + 1 parameters,
    for example, an AR(k + 1). Consider the strategy of maximizing the likelihood
    under each scenario and selecting the model with the maximized likelihood. This
    strategy would always select the AR(k + 1) model, since


    $L_{MAX}(\hat{α}_{k1}, ..., \hat{α}_{kk}) ≤ L_{MAX}(\hat{α}_{k+1,1}, ..., \hat{α}_{k+1,k+1}),
    \quad (8.2)$ where $\hat{α}_{mj}$ denotes the ML estimator of αj for a model with
    m parameters. To see why Equation 8.2 is true, note that when there are k + 1
    parameters, one choice for $\hat{α}_{k+1,k+1}$ is $\hat{α}_{k+1,k+1}=0$. The maximized
    likelihood on the left-hand side of Equation 8.2 is thus based on the constraint
    that $\hat{α}_{k+1,k+1}=0$ while the right-hand side is maximized without this
    constraint. AIC addresses this problem in the ARMA case by imposing a penalty
    for adding parameters. The method is based on selecting the p and q that minimize
    the expected Kullback–Leibler distance between the true underlying model of the
    data and an ARMA(p,q) model fit to the data where 0 ≤ p ≤ P and 0 ≤ q ≤ Q. See
    Akaike (1976). Essentially, AIC imposes a penalty for adding terms to a model,
    and the resulting procedure is to select the model that minimizes


    $\text{AIC} = -2[\ln(\text{maximized likelihood})] + 2(\#\ \text{of free parameters}).
    \quad (8.3)$ In the setting of ARMA(p,q) modeling, the AIC criterion becomes $\text{AIC}
    = -2[\ln(\text{maximized likelihood})] + 2(p + q + 1), \quad (8.4)$


    since there are p + q + 1 parameters including the constant term. It can be shown
    that AIC in Equation 8.4 is approximately equal to $\text{AIC} = \ln(\hat{σ}_a^2)
    + 2\frac{p+q+1}{n}, \quad (8.5)$ where $\hat{σ}_a^2$ is the estimated white noise
    variance associated with the ML fit of an ARMA(p,q) model (see Box et al., 2008;
    Shumway and Stoffer, 2010). We will'
  merge: -1
  img_proc: true
