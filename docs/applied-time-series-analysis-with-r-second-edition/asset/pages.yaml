    # 1.4.1 Estimation of μ


    Given the realization {x_t, t = 1, 2, ..., n} from a stationary time series, the
    natural estimate of the common mean μ is the sample mean


    $\bar{x} = \frac{1}{n} \sum_{t=1}^{n} x_t.$

