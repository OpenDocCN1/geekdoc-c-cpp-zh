  md: measurements to distinguish between explosions and earthquakes with the goal
    of detecting clandestine underground nuclear testing around the world. Seismologists
    have identified the Lg wave, which is a shear wave that has most of its energy
    trapped in the Earth’s crust, as a useful seismic waveform for this purpose. Figure
    13.13a and b shows the Lg waveform for an earthquake (the Massachusetts Mountain
    [MM] earthquake, data set mm.eq in tswge) and an explosion (the Starwort explosion,
    data set starwort.ex in tswge). See Gupta et al. (2005) for information on the
    data. It can be seen from the figure that the Lg wave for the earthquake and the
    explosion have similar time-varying behavior in which the frequency is decreasing
    with time. For each of the 10 earthquakes and 10 explosions used in the study,
    Woodward et al. (2007) transformed the corresponding Lg wave into a stationary
    dual. The duals for the MM earthquake and the Starwort explosion are shown in
    Figure 13.13c and d, respectively. Each of the 20 dual processes was then modeled
    as an AR(10) model. The associated G(10; 0.8) spectral densities for MM and Starwort
    are shown in Figure 13.13e and f, respectively. Inspection of the two G(10; 0.8)
    spectral densities shows that the one associated with the Starwort explosion has
    a much sharper peak, and thus, indicates a stronger cyclic dual behavior than
    seen in the earthquake spectral density. That is, after moving to the dual space,
    the corresponding G(10; λ) spectral densities are quite distinctive. One method
    for measuring the information shown visually in Figure 13.13e and f is to examine
    the factor tables associated with the two AR(10) models fit to the duals. In Table
    13.1, we show the first three lines of the factor tables associated with the AR(10)
    models fit to the MM and Starwort dual processes. There it can be seen that the
    AR(10) fit to the Starwort dual has a root much closer to the unit circle than
    does the MM. For each of the 20 dual data sets in the study, the strength of the
    dominant frequency was quantified using the absolute value of the reciprocal of
    the associated roots as the measure. Using this measure as a discriminant, Woodward
    et al. (2007) were able to obtain perfect discrimination between earthquakes and
    explosions for these 20 events. Thus, moving to the dual space produced a natural
    measure of the strength of the time-varying cyclic behavior in the original data.
