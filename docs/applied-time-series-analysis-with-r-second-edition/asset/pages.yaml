  md: '$(1 - B)\alpha^{-t} X_t = \alpha^{-t} a_t,$


    and


    $\displaystyle \sum_{k=-\infty}^{t} (1 - B)\alpha^{-k} X_k = \sum_{k=-\infty}^{t}
    \alpha^{-k} a_k,$


    which gives


    $\alpha^{-t} X_t - \lim_{j\to\infty} \alpha^{-j} X_j = \sum_{k=-\infty}^{t} \alpha^{-k}
    a_k.$  (3.22)


    Since $|\alpha| < 1$, it follows that $\lim_{j\to\infty} \alpha^{-j} X_j = 0$
    with probability 1. Consequently,


    $X_t = \sum_{k=-\infty}^{t} \alpha^{t-k} a_k$  (3.23)

    $= \sum_{h=0}^{\infty} \alpha^{h} a_{t-h}.$


    Clearly, $X_t$ in Equation 3.23 satisfies (3.20), is causal, and, by Theorem 2.3,
    is stationary since $|\alpha| < 1$ implies $\sum_{h=0}^{\infty} |\alpha|^{h} <
    \infty$. Therefore, $X_t$ is a (causal and stationary) AR(1) process. Because
    the polynomial operator $\phi(B)$ can always be factored as


    $X_t - \phi_1 X_{t-1} - \cdots - \phi_p X_{t-p} = \phi(B) X_t = (1 - \alpha_1
    B)(1 - \alpha_2 B) \cdots (1 - \alpha_p B) X_t = \prod_{k=1}^{p} \alpha_k (1 -
    B \alpha_k^{-1}) X_t,$  (3.24)


    where the $\alpha_k$ may be real or complex, the following theorem can be shown.


    # Theorem 3.1


    Let $X_t$ be causal and suppose


    $\phi(B) X_t = (1 - \alpha_1 B)(1 - \alpha_2 B) \cdots (1 - \alpha_p B) X_t =
    a_t,$  (3.25)'
