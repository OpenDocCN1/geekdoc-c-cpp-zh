  md: 't ∈ (−∞, ∞), then X(t) is an AR(p) process.


    The GLC(p) process extends to a GLC(p,q) process. (See Robertson et al., 2010.)
    Just as SLC processes such as those in Equations 13.21 through 13.23 are GLC processes,
    it can be shown that the GLC(p) and GLC(p,q) processes are also GLC processes
    and consequently are G-stationary as well. See Robertson (2008).


    Note that if u = at² + bt, then du/dt = 2at + b. Consequently,


    $\left[\frac{1}{2at+b}D - \alpha\right]X(t) = \frac{1}{2at+b}\frac{du}{dt}\frac{dX}{du}
    - \alpha X(t) \tag{13.25}$

    $= \frac{dX}{du} - \alpha X.$


    Proceeding formally one can show


    $\prod_{i=1}^{p}\left(\frac{1}{2at+b}D_t - \alpha_i\right)(X(t)-\mu) = \prod_{i=1}^{p}(D_u
    - \alpha_i)(Y(u)-\mu),$


    where $D_t$ and $D_u$ are derivatives with respect to $t$ and $u$, respectively,
    and where $Y(u)=Y(at^2+bt)=X(t)$. It follows then that the dual process of $X(t)$
    in Equation 13.24 is an AR(p). For a further discussion of this, see Liu (2004),
    Robertson (2008), and Robertson et al. (2010).


    As mentioned earlier, the time-transformation technique for G-stationary processes
    is essentially based on the concept of sampling at the appropriate points. If
    $X(t)$ is a GLC(p) process, we define $Y_k = Y(u_k) = X(t_k)$, where the sample
    points, $t_k ∈ (t_{(0)}, t_{(1)})$ are given by


    $t_k = \frac{-b - \sqrt{b^2 + 4a u_k}}{2a}, \quad t_k ∈ (t_{(0)}, \frac{-b}{2a}]$

    $= \frac{-b + \sqrt{b^2 + 4a u_k}}{2a}, \quad t_k ∈ (-\frac{b}{2a}, t_{(1)}],
    \tag{13.26}$


    where $u_k = |k| \Delta_u$ and the $\Delta_u$ are equally spaced increments in
    $\mathcal{U}$ space. The point $-b/(2a)$ is referred to as the reflection point.
    If $\Delta_u$ is sufficiently small, it can be shown that $Y_k$ is a unique discrete
    ARMA(p,q) process with $q ≤ p - 1$. See Jiang et al. (2006) and Robertson et al.
    (2010). Thus, again by sampling properly, one can convert the TVF (nonstationary)
    data to stationary data, perform the required analyses, and then transform back
    to the original time'
