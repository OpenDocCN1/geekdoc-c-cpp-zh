    and parameters are known. In a practical situation, the model orders and parameters
    will be estimated, and, thus, the forecast errors will differ somewhat from those
    we present here. However, in most cases, this difference is small. As discussed
    in Section 6.1, “best” will be taken to be in the mean-square sense, and the best
    such predictor is the conditional expectation E[X_{t0+ℓ} | X_{t0}, X_{t0−ℓ}, ...]
    As mentioned earlier, the conditional expectation is often difficult to obtain,
    but it turns out that it can be readily computed in the current setting.


