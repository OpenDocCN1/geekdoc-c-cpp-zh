- pgno: 524
  md: '# 10.6 State-Space Models


    The state-space model (sometimes called the dynamic linear model) was originally
    developed by Kalman (1960) and Kalman and Bucy (1961) for control of linear systems
    and has more recently become widely used for the analysis of time series data.
    The ARUMA models (univariate and multivariate) can be seen to be special cases
    of the broad class of time series models that can be obtained via the state-space
    approach. In this section, we give a brief and introductory treatment of these
    models and illustrate their usefulness.


    State-space formulations depend on a state equation and an observation equation.


    # 10.6.1 State Equation


    The state equation is a VAR(1)-type expression giving the rule by which the v
    × 1 random vector X_t is generated from X_{t-1} for time points t = 1, 2, ...,
    n. Specifically, the state equation is given by


    **X**_t = **F** **X**_{t-1} + **V**_t  (10.48)


    +   where

    +   1. **F** is a v × v matrix

    +   2. **V**_t ~ MVN(**0**, **Γ**_V) is multivariate normal white noise (MVN stands
    for multivariate normal)

    +   3. The process is initiated with a vector **X**_0 ~ MVN(**μ**_0, **Γ**_0).


    It should be noted that a more general form of the state equation replaces the
    constant matrix **F** with the matrices **F**_t.


    # 10.6.2 Observation Equation


    The assumption in state-space analysis is that observations are made on **Y**_t
    which is related to **X**_t via the observation equation.


    **Y**_t = **G**_t **X**_t + **W**_t  (10.49)


    where'
  merge: -1
  img_proc: true
