  md: 'many cases, the ARMA(\(p,q\)) or high-order AR can serve as a very good approximation
    to the signal-plus-noise model. The primary differences between an ARMA model
    and a harmonic signal-plus-noise are the random phase and amplitude nature of
    ARMA realizations. However, since phase information is “lost” in the power spectrum
    (and the amplitude information, random or nonrandom, is “captured” by the variance),
    it is not surprising that the ARMA model can serve as a good model for estimating
    the spectrum of harmonic signals.


    # EXAMPLE 4.1: APPROXIMATING A HARMONIC SIGNAL-PLUS-NOISE MODEL WITH AN ARMA(2,
    2) MODEL


