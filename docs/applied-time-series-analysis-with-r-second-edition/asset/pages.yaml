  md: '$n^{1/2}(\hat{\boldsymbol{\beta}}-\boldsymbol{\beta}) \Rightarrow N(0,\sigma_a^2\boldsymbol{\Gamma}^{-1})$,
    (7.61)


    where $\boldsymbol{\beta}$ denotes the vector of true parameter values. In order
    to obtain the matrix $\boldsymbol{\Gamma}$ in this case, we consider the two AR
    processes $\mathcal{U}$ and $V_t$ defined by


    $\phi(B)\mathcal{U}_t = a_t$, (7.62)


    $\theta(B)V_t = a_t$, (7.63)


    where $\phi(B)$ and $\theta(B)$ are as in Equation 7.60. We use the notation $\gamma_U(k)=E[U_t
    U_{t+k}]$, $\gamma_V(k)=E[V_t V_{t+k}]$ and $\gamma_{UV}(k)=E[U_t V_{t+k}]$. Then,
    $\boldsymbol{\Gamma}$ is the $(p+q)\times(p+q)$ matrix defined by


    $\boldsymbol{\Gamma}=\begin{bmatrix}\boldsymbol{\Gamma}_{pp}&\boldsymbol{\Gamma}_{pq}\\
    \boldsymbol{\Gamma}_{qp}&\boldsymbol{\Gamma}_{qq}\end{bmatrix}$, (7.64)


    Where


    +   - $\boldsymbol{\Gamma}_{pp}$ is the $p\times p$ matrix whose $ij$th element
    is $\gamma_U(i-j)$

    +   - $\boldsymbol{\Gamma}_{qq}$ is the $q\times q$ matrix with $ij$th element
    $\gamma_V(i-j)$


    The matrix $\boldsymbol{\Gamma}_{pq}$ is the $p\times q$ matrix whose $ij$th element
    is $\gamma_{UV}(i-j)$, while $\boldsymbol{\Gamma}_{qp}$ is the $q\times p$ matrix
    with $ij$th element given by $\gamma_{UV}(j-i)$. It follows from Equation 7.64
    that the $\boldsymbol{\Gamma}$ matrix for the MA$(q)$ model, $X_t=\theta(B)a_p$
    is identical to that for the AR$(q)$ model $\theta(B)X_t=a_t$. Using this fact,
    in Example 7.6, we find the asymptotic distribution associated with an MA(1) and
    an MA(2) model, and, in Example 7.7, we find the asymptotic distribution for an
    ARMA(1,1). For the derivation of the asymptotic distribution in the ARMA$(p,q)$
    case, see Box et al. (2008) and Brockwell and Davis (1991).


    # EXAMPLE 7.6: ASYMPTOTIC DISTRIBUTIONS FOR MA(1) AND MA(2) MODELS


    +   1. MA(1): It follows from the earlier discussion that for an MA(1) model,
    $\boldsymbol{\Gamma}$ is the $1\times1$ matrix whose element is given by $\gamma_0=\sigma_a^2/(1-\theta_1^2)$.
    Thus, $\sigma_a^2\boldsymbol{\Gamma}^{-1}=1-\theta_1^2$, and $\hat{\theta}_1$
    is asymptotically normal with mean $\theta_1$ and variance $(1-\theta_1^2)/n$.'
