  md: 'It should be noted that the adfTest function gives three versions of the augmented
    Dickey-Fuller test. In addition to the test including a constant term α₀ in the
    model in Equation 8.23 that was used above, a test assuming β₀ = 0, can be obtained
    using type = “nc”. The third form of the test is based on a model of the form
    in Equation 8.23 but with β₀ replaced by β₀ + β₁t, allowing for the possibility
    that some of the trending behavior in the data is caused by an underlying trend
    line. This test is obtained with adfTest using type = “ct”.


    A final comment should be made about unit root tests. While these tests give the
    investigator a “yes-or-no” answer regarding a unit root, there are areas of concern
    regarding their use. Note that the decision to retain a unit root is based on
    failure to reject a null hypothesis, and depending on the power of the test, the
    conclusion that the model has a unit root may not be one that can be made with
    much confidence. Unit root tests can be useful tools to assist in the decision,
    but the final decision concerning the inclusion of nonstationary factors rests
    with the investigator. The point is that finite realizations from the nonstationary
    model (1 − B)Xₜ = aₜ and, for example, the stationary (but nearly nonstationary)
    model (1 − 0.97B)Xₜ = aₜ will be very similar, and tests such as the augmented
    Dickey–Fuller test will often conclude the existence of a unit root when applied
    to realizations from the aforementioned nearly nonstationary model. The final
    decision concerning whether to include a factor 1 − B should be based on such
    considerations as whether there is any reason to believe that there is an attraction
    to the mean, and a decay in the autocorrelations at lag lengths of interest (in
    which case a stationary model is appropriate). A unit root model is often used
    to model the behavior of stock market prices, where such an attraction to the
    mean does not seem to exist.


    # 8.3.5.3 Including a Seasonal Factor (1 − B^s) in the Model


    In Section 5.3, we discussed the multiplicative seasonal model. Here, we consider
    the special case


    (1 − B^s)φ(B)(X_t − μ) = θ(B)a_t,  (8.24)


    In these models, the s roots of 1 − z^s = 0 all lie on the unit circle, and the
    seasonal factor, 1 − B^s, models a tendency in the data for the patterns observed
    at times t = 1, 2, ..., s to be similar to the patterns for observations t = s
    + 1, s + 2, ..., 2s, etc. For example, quarterly sales data may exhibit a seasonal
    behavior if'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'the general pattern of sales in each quarter (e.g., relatively lower sales
    in first quarter, higher sales in fourth quarter, etc.) tends to be repeated from
    year to year. As mentioned in Section 5.3, it is typical to use a seasonal model
    with \(s = 4\) for quarterly data exhibiting such behavior or \(s = 12\) for monthly
    data with this type of pattern. In Example 5.9, we discussed the “airline model”


    $$(1-B)(1-B^s)\phi(B)(X_t-\mu)=\theta(B)a_t, \tag{8.25}$$


    as a model that allows for seasonal and trending behavior. However, a seasonal
    component may or may not be appropriate for data collected monthly, quarterly,
    etc. In the following examples, we discuss techniques that help you determine
    whether a seasonal component is appropriate.


    # EXAMPLE 8.8: SIMULATED SEASONAL DATA


    Figure 8.8 shows a realization and sample autocorrelations from the seasonal model


    $$(1-B^{12})(1-1.25B+0.9B^2)(X_t-50)=a_t, \tag{8.26}$$


    with white noise variance \(\sigma_a^2=1\). The realization in Figure 8.8a can
    be found in data set `fig8.8a` in tswge. Inspection of the realization shows that
    a 12-unit seasonal pattern seems to be replicated, and the sample autocorrelations
    show spikes at multiples of 12. To further examine the need for the nonstationary
    seasonal component, \(1-B^{12}\), in the fitted model, we use the overfitting
