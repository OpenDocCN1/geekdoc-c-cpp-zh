    # 6.1 Mean-Square Prediction Background


    This section briefly reviews some of the key results related to the problem of
    finding optimal predictors in the mean-square sense. Theorem 6.1 shows the fundamental
    role that conditional expectation plays in the search for a best mean-square predictor.
    From probability theory, it is known that if X and Y are random variables, the
    conditional expectation of Y given X, denoted E(Y | X), is a function of X (Chung
    2001). Theorem 6.1, below, states that E(Y | X) is closest to Y in the mean-square
    sense among all square integrable random variables that are functions of X.


    # Theorem 6.1


    Suppose X and Y are random variables with E(X^2) < ∞ and E(Y^2) < ∞. If h(X) is
    a random variable such that E[h(X)^2] < ∞, then


    E[(Y - E(Y | X))^2] ≤ E[(Y - h(X))^2].


    Proof: See Brockwell and Davis (1991) and Billingsley (1995).


    The result in Theorem 6.1 extends to the case in which X1, X2, ..., Xt0 are random
    variables such that E(Xi^2) < ∞, i = 1, ..., t0. In this case, the conditional
    expectation E[Xt0+ℓ | X1, ..., Xt0] is the best predictor of Xt0+ℓ in the mean-square
    sense among all square integrable functions of the random variables X1, X2, ...
    Xt0. Thus, since our goal is to forecast Xt0+ℓ based on X1, ..., Xt0, it follows
    that E[Xt0+ℓ | X1, ..., Xt0] is the optimal predictor. Although E[Xt0+ℓ | X1,
    ..., Xt0] is the desired optimal predictor, that is, the gold standard, it is
    not necessarily linear and may be very difficult to obtain in practice. As a consequence,
    we will choose to restrict our attention to “linear predictors” and search for
