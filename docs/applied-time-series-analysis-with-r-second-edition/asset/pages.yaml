    # Theorem 5.1 (Findley–Quinn Theorem)


    Suppose that the following are true:


    +   1. $X_t$ is an ARMA$(p + d, q)$ with $d$ roots “close” to the unit circle

    +   2. Of the $d$ roots in (a), $j$ have highest multiplicity $\ell$


    Then, $\rho_k^*$ (the limiting value of $\rho_k$ as the $d$ roots approach the
    unit circle uniformly) exists, and for each $k = 0, \pm1, \pm2, \dots$, $\rho_k^*$
    satisfies the linear homogeneous difference equation of order $j$ for $j > 0$.


    $\left(1 - \zeta_1 B - \cdots - \zeta_j B^j\right)\rho_k^* = 0,\qquad (5.14)$


    where $j$ is specified in (b). The roots of $\zeta(z)=0$ are all on the unit circle
    (i.e. have modulus 1), and $\zeta(B)$ is the operator formed from the product
    of the nonstationary factors of highest multiplicity in $\lambda(B)$.


    # EXAMPLE 5.7: EXTENDED AUTOCORRELATIONS FOR SELECTED ARUMA MODELS


    Below we illustrate the implications of Theorem 5.1 by listing several ARUMA processes
    along with the difference equation satisfied by $\rho_k^*$. In each case $\phi(B)$
    is a stationary operator and $\theta(B)$ is an invertible operator.


    +   1. $\phi(B)(1 - B)X_t = \theta(B)a_t$

    +      In this case, $d = 1$, $j = 1$, and $\ell = 1$.

    +      $\rho_k^*$ satisfies $(1 - B)\rho_k^* = 0 \Rightarrow \rho_k^* = 1,\quad
    k = 0, \pm1, \pm2, \dots$

    +   2. $\phi(B)(1 - B^4)X_t = \theta(B)a_t$.

    +      $(1 - B^4) = (1 - B)(1 + B)(1 + B^2)$ so that $d = 4$, $j = 4$, and $\ell
    = 1$

    +      $\rho_k^*$ satisfies $(1 - B^4)\rho_k^* = 0 \Rightarrow \rho_k^* = 1,\
    k = 4m, m = 0, \pm1, \pm2, \dots$

    +      $= 0,\quad \text{elsewhere}$

    +   3. $\phi(B)(1 - B)(1 - B^2)X_t = \theta(B)a_t$.

    +      $(1 - B)(1 - B^2) = (1 - B)(1 - B)(1 + B)$ so that $d = 3$, $j = 1$, and
    $\ell = 2$.'
