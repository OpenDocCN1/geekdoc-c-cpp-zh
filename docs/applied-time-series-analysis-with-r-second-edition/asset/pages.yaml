  md: '$X_t = \Phi X_{t-1} + V_t \quad \text{(state equation)},$

    $Y_t = (0\ 0 \ \dots \ 1) X_t \quad \text{(observation equation)},$


    where $X_t$, $\Phi$, and $V_t$ are the $pm \times 1$, $pm \times pm$, and $pm
    \times m$ matrices given, respectively, by


    $X_t = \begin{pmatrix} Y_{t-p+1} \\ Y_{t-p+2} \\ \vdots \\ Y_t \end{pmatrix},
    \quad \Phi = \begin{pmatrix} 0 & I & 0 & \dots & 0 \\ 0 & 0 & I & \dots & 0 \\
    \vdots & \vdots & \vdots & & \vdots \\ 0 & 0 & 0 & \dots & I \\ \Phi_p & \Phi_{p-1}
    & \Phi_{p-2} & \dots & \Phi_1 \end{pmatrix}, \quad V_t = \begin{pmatrix} 0 \\
    0 \\ \vdots \\ 0 \\ I \end{pmatrix} u_t$


    # Example 10.11: STATE-SPACE FORM OF AN ARMA(p, q) PROCESS


    A state-space formulation of the univariate, zero-mean ARMA(p,q) process


    $Y_t - \phi_1 Y_{t-1} - \cdots \phi_p Y_{t-p} = a_t - \phi_1 a_{t-1} - \cdots
    - \theta_q a_{t-q},$


    is given by


    $X_t = \Phi X_{t-1} + V_t \qquad \text{(state equation)},$

    $Y_t = (-\theta_{r-1}, -\theta_{r-2}, \dots, -\theta_1, 1) X_t \quad \text{(observation
    equation)},$


    where


    $X_t = \begin{pmatrix} U_{t-r+1} \\ U_{t-r+2} \\ \vdots \\ U_t \end{pmatrix},
    \quad \Phi = \begin{pmatrix} 0 & 1 & 0 & \dots & 0 \\ 0 & 0 & 1 & \dots & 0 \\
    \vdots & \vdots & \vdots & & \vdots \\ 0 & 0 & 0 & \dots & 1 \\ \phi_r & \phi_{r-1}
    & \phi_{r-2} & \dots & \phi_1 \end{pmatrix}, \quad V_t = \begin{pmatrix} 0 \\
    0 \\ \vdots \\ 0 \\ 1 \end{pmatrix} a_t,$


    where $\mathcal{U}_t$ is the AR(p) process given by $\phi(B)\mathcal{U}_t = a_t$,
    $r = \max(p, q + 1)$, $\phi_j = 0$ for $j > p$, and $\theta_j = 0$ for $j > q$.
    (See Problem 10.9.)


    # 10.6.3 Goals of State-Space Modeling


    Recall that in the case of ARMA and ARUMA modeling, we typically analyze the data
    in a realization in order to estimate the model parameters and then use the estimated
    model for purposes of forecasting/predicting future values, spectral'
