    Nyquist frequency: Definition 1.12 seems the rather natural discrete version of
    Definition 1.11 except for the restriction on the range of the parameter f. For
    discrete time series data sampled at unit increments, the shortest period that
    can be observed is a period of 2, that is, the highest observable frequency is
    0.5. This is called the Nyquist frequency. For example, consider the two signals
    Y_t = cos(2π(0.3)t) and Z_t = cos(2π(1.3)t), which have frequencies 0.3 and 1.3,
    respectively. These two signals are defined along a continuum, but we consider
    the case in which they are sampled at the integers. In Figure 1.13, we show an
    overlay of these two signals, and it is interesting to note that the two signals
    are equal to each other at integer values of t. These common values are indicated
    by the circles on the plot. Consequently, the two curves are indistinguishable
    when sampled at the integers. This phenomenon is called aliasing, since the frequency
    f = 1.3 “appears” to be f = 0.3. For discrete data, because it would be impossible
    to detect a period less than 2 sample units, it should not be surprising that
    we must restrict ourselves to |f| ≤ 0.5 in the discrete case. It should be noted
    that if higher frequencies are present, then in order to be able to detect them
    we would need to sample more rapidly. This motivates the following definition.


    # Definition 1.13


    If data are sampled at increments of Δ, then the Nyquist frequency is 1/(2Δ),
    and the shortest observable period is 2Δ.


