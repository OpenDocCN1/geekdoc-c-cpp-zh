  md: '$$\begin{aligned}\rho_k &= 0 && \text{for } k>q,\\ \rho_k &\ne 0 && \text{for
    } k=q.\end{aligned} \tag{8A.1}$$


    The behavior described in (8A.1) uniquely determines the order $q$ of an MA($q$)
    process if the true autocorrelations are known. Thus, sample autocorrelations
    that are near zero for $k>q$ while $\hat{\rho}_q=0$ suggest an MA($q$) as a possible
    model. From Bartlett’s (1946) approximation in Equation 1.22 it follows that if
    $X_t$ is an MA($q$) process, then


    $$\operatorname{Var}(\hat{\rho}_k)\approx \frac{1}{n}\left(1+2\sum_{v=1}^{q}\rho_v^2\right).$$


    for $k>q$. Further, since $E[\hat{\rho}_k]\approx 0$ for $k>q$, then a rough guide
    is that if


    $$\left|\hat{\rho}_k\right|>2\sqrt{\frac{1+2\sum_{v=1}^{q}\hat{\rho}_v^2}{n}},
    \tag{8A.2}$$


    for some $k>q$, then this is evidence against an MA($q$) at the $\alpha=0.05$
    level of significance. Thus, if an MA($q$) is to be considered as the model, then
    $\hat{\rho}_k$ should essentially remain within the limits specified by Equation
    8A.2 for $k>q$. However, as with the test for white noise, the quoted significance
    level applies separately for each $k$ so that it will not be unusual to observe
    a small percentage of $\hat{\rho}_k$’s, $k\ge q$, outside the specified limits
    when the model is an MA($q$). It should be noted that when $X_t$ is white noise,
    that is, $X_t$ is MA($q$) with $q=0$, then the summation in Equation 8A.2 is taken
    to be zero, and Equation 8A.2 reduces to Equation 8.1.


