    # EXAMPLE 3.21: ADDITIVE COMPONENTS OF THE SUNSPOT DATA


    We previously examined the sunspot data shown in Figure 1.23 (ss08 in tswge) and
    noted the pseudo-cyclic behavior with cycles of about 9–11 years. Also, there
    tends to be a hint of a pattern in the peaks of the cycles. That is, the peaks
    tended to be high in the late 1700s, again around 1850, and more recently since
