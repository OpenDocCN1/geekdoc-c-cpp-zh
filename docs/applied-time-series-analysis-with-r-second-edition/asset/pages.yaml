    Actual realizations from time series models will not typically have such a simple
    mathematical form as the upper left signal in Figure 1.10. However, using the
    techniques of Fourier analysis applied to time series data via the spectrum, we
    will be able to analyze more complicated realizations in order to discover fundamental
    cyclical behavior that provides information about the underlying model generating
    the data. The examination of underlying periodicities in a time series is called
    *spectral analysis*, and the tools that we will use to measure the frequency content
    are the *power spectrum* and the *spectral density*. We first introduce needed
    terminology and definitions.'
