    \ between Nonstationary Time Series\n\nWe let $X_{t1}$ and $X_{t2}$ denote the\
    \ annual incidence of non-perforated appendicitis (tswge file appy) and influenza\
    \ (tswge file flu), respectively, shown in [Figure 10.8](#). The disease incidence\
    \ data show a wandering behavior that is indicative of models with unit roots.\
    \ The question of interest here is whether the two series tend to be “tethered\
    \ together,” that is, tend to wander together. Engle and Granger (1987) used the\
    \ term *cointegration* to describe this “tethering together” idea, which, in our\
    \ setting, implies that each series has a single unit root and there exists some\
    \ linear combination of the difference sequences $\\nabla X_{t1}$ and $\\nabla\
    \ X_{t2}$ that is stationary. The cointegration concept has been used extensively\
    \ in the econometrics literature for analyzing relationships. For an extensive\
    \ bibliography in this area, see Engle and Granger (1991). Engle and Granger (1987)\
    \ show that it is useful to use an error correction form similar to that in [Equation\
    \ 8.23](#) (see also Problem 8.10) for describing the relationship between $X_{t1}$\
    \ and $X_{t2}$. Letting $\\mathbf{X}_t=(X_{t1},X_{t2})'$, we consider the model\n\
    \n$\\mathbf{X}_t=\\boldsymbol{a}+\\boldsymbol{\\Phi}_1\\mathbf{X}_{t-1}+\\cdots+\\\
    boldsymbol{\\Phi}_p\\mathbf{X}_{t-p}+\\boldsymbol{a}_t,$\n\nwhere it is assumed,\
    \ in this case, that $\\boldsymbol{\\Phi}(B)=\\mathbf{I}-\\boldsymbol{\\Phi}_1B-\\\
    cdots-\\boldsymbol{\\Phi}_pB^p$ has a factor"
