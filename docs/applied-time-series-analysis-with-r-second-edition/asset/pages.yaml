    # 3.3.6 Approximating ARMA(p,q) Processes Using High-Order AR(p) Models


    We have discussed the fact that the stationary and invertible ARMA(p,q) model
    φ(B)X_t = θ(B)a_t can be written as the infinite-order AR process θ^{-1}(B)φ(B)X_t
    = a_t. Thus, an ARMA(p,q) model can often be well approximated using a high-order
    AR(p) model. For this reason, some time series analysts use the approach of always
    fitting AR models to data since parameter estimation and model identification
    tend to be more difficult when MA parameters are included in a model. On the other
    hand, some analysts prefer the ARMA(p,q) model since it often contains fewer parameters
    (is more parsimonious) than an AR model fit to the same data set. In this text,
    we will cover parameter estimation, forecasting, etc., in the generality provided
    by the ARMA(p,q) model. However, in practice, we will often restrict ourselves
    to AR(p) models.


    An example of this trade-off between a parsimonious ARMA(p,q) model and a high-order
    AR(p) model is illustrated in Example 4.1, where theoretical justification is
    used to show that an ARMA(2,2) model is a good approximating model for harmonic
    signal-plus-noise data. However, in that example, we also show that an AR(7) model
    also works well as an approximating model.


    # 3.4 Visualizing AR Components


    Another useful tool for understanding the features of an AR(p) realization is
    the decomposition of the realization into additive components. Specifically, letting
    x_t denote a realization from an AR(p) model for which there are no repeated roots
    of the characteristic equation, then x_t can be written as x_t = x_t^{(1)} + x_t^{(2)}
    + ... + x_t^{(m)} where m, as given in Equation 3.76, is the number of real roots
    plus the number of complex conjugate pairs of roots of the characteristic equation.
    The jth additive component x_t^{(j)}


    +   - Corresponds to the jth factor in the factor table'
