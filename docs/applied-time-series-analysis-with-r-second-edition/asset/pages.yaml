    algebraic counterpart, $\phi(z)$, when $z$ is real or complex. That is, it can
    be shown (see Brockwell and Davis, 1991) that for


    $$\phi(z)=1-\phi_1z-\cdots-\phi_pz^p$$

    $$=\prod_{k=1}^{p}(1-\alpha_kz),$$


    where $|\alpha_k|<1$, $k=1,\ldots,p$, that $\phi^{-1}(B)=\left.\phi^{-1}(z)\right|_{B}$.
    Thus, for example, if $(1-\phi_1B)X_t=a_t$ and $|\phi_1|<1$, then since $(1-\phi_1z)^{-1}=\sum_{k=0}^{\infty}\phi_1^kz^k$,
    it follows that


