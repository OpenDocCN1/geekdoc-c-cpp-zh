  md: 'where t < n, that is, we want to calculate $\hat{X}_t^n$. The recursion proceeds
    by calculating $\hat{X}_t^t$, $\hat{X}_t^{t-1}$, $\Gamma_t''$ and $\Gamma_t^{t-1}$,
    $t = 1$, ..., $n$ using Equations 10.50 through 10.54. Then, for $t = n$, $n-1$,
    ... we calculate


    $$\hat{X}_{t-1}^n = \hat{X}_{t-1}^{t-1} + J_{t-1}\bigl(\hat{X}_t^n - \hat{X}_t^{t-1}\bigr),
    \tag{10.55}$$ $$\Gamma_{t-1}^n = \Gamma_{t-1}^{t-1} + J_{t-1}\bigl(\Gamma_t^n
    - \Gamma_t^{t-1}\bigr)J_{t-1}'', \tag{10.56}$$


    where


    $$J_{t-1} = \Gamma_{t-1}^{t-1}F''\bigl[\Gamma_t^{t-1}\bigr]^{-1}. \tag{10.57}$$


    # 10.6.4.4 h-Step Ahead Predictions


    It should be noted that the predictions in Equation 10.50 are one-step ahead predictions
    (or forecasts), that is, predictors of $X_t$ given observations of the random
    variables $Y_1$, ..., $Y_{t-1}$. However, the ARMA-based forecasting discussed
    in Chapter 6 provided not only one-step ahead forecasts but also $h$-step ahead
    forecasts. State-space methodology can also be used to find $h$-step ahead predictors,
    that is, the predictor of $X_{t+h-1}$ given observations on the random variables
    $Y_1$, ..., $Y_{t-1}$. The $h$-step ahead predictor, $\hat{X}_{t+h-1}^{t-1}$,
    is defined to be


    $$\hat{X}_{t+h-1}^{t-1} = E\bigl(X_{t+h-1} \mid Y_1, \dots, Y_{t-1}\bigr). \tag{10.58}$$


    From Equation 10.48, it follows that $X_{t+h-1} = F X_{t+h-2} + V_{t+h-1}$, so,
    from Equation 10.58, we have


    $$\begin{aligned}\hat{X}_{t+h-1}^{t-1} &= E\bigl(F X_{t+h-2} + V_{t+h-1} \mid
    Y_1, \dots, Y_{t-1}\bigr) \\ &= F E\bigl(X_{t+h-2} \mid Y_1, \dots, Y_{t-1}\bigr)
    \\ &= F \hat{X}_{t+h-2}^{t-1}.\end{aligned}$$


    Continuing recursively, it follows that'
