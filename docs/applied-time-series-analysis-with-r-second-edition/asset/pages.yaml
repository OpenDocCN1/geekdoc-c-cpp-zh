    # ## 3.2 AR Processes


    Let $a_t$ be a white noise process and let $\phi_1,\ \phi_2,\ \ldots,\ \phi_p$
    be real constants with $\phi_p\neq 0$. Then, loosely speaking, if $X_t$, $t=0,\
    \pm1,\ \pm2,\ \ldots$ is specified by


    $$X_t-\mu-\phi_1(X_{t-1}-\mu)-\phi_2(X_{t-2}-\mu)-\cdots-\phi_p(X_{t-p}-\mu)=a_t,\tag{3.13}$$


    then $X_t$ is called an $AR$ process of order $p$, which is usually shortened
    to $AR(p)$. We will often write [Equation 3.13] in the operator form


    $$\phi(B)(X_t-\mu)=a_t,\tag{3.14}$$


