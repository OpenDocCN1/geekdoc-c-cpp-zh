  md: 'where the $\alpha_k$ are real or complex numbers, $\alpha_k \neq \alpha_j$,
    $k \neq j$, $|\alpha_k| < 1$, $k = 1, \dots, p$, and $a_t$ is zero mean white
    noise. Then, $X_t$ is an AR$(p)$ process and


    $$X_t = \sum_{\ell=0}^{\infty} \psi_{\ell}(p) a_{t-\ell}, \tag{3.26}$$


    where


    +   - a. $\psi_{\ell}(1) = \alpha_1^{\ell}$ for $p = 1$  (3.27)

    +   - b. $\psi_{\ell}(p) = \displaystyle\sum_{k=1}^{p-1} \frac{\alpha_p^{p-2}
    (\alpha_p^{+1} - \alpha_{p-k}^{+1})}{(\alpha_p - \alpha_{p-k}) \prod_{h \neq p-k}^{p-1}
    (\alpha_{p-k} - \alpha_h)}$, for $p \ge 2$.


    Proof: See Appendix 3A.


    We note that Theorem 3.1 gives the $\psi$-weights for the case of no repeated
    roots. Problem 3.33 shows how Equation 3.27 can be used in the case of a repeated
    root. The constants $\psi_{\ell}(p)$ will be referred to as the “$\psi$-weights”
    for an AR$(p)$ process. Definition 3.3 introduces the characteristic equation,
    which is a useful tool in the analysis of AR$(p)$ models.


    # Definition 3.3


    If $X_t$ is the AR$(p)$ process defined by Equation 3.17, then the algebraic equation
    $\phi(z) = 0$ is called the associated characteristic equation where


    $$\phi(z) = 1 - \phi_1 z - \dots - \phi_p z^p,$$


    and $z$ is a real or complex number. The polynomial $\phi(z)$ is called the characteristic
    polynomial.


    Theorem 3.2 that follows is an important result for determining whether a given
    set of AR$(p)$ coefficients yield a causal, stationary AR$(p)$ process.


