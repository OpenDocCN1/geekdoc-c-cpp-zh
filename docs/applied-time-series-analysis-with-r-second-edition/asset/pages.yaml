  md: 'values of intY with t = 1, ..., n respectively.


    h is an output value of the scaling parameter that assures that the dual realization
    and the original realization are of the same length.


    NOTE: trans.to.dual is based on G(λ)-stationary modeling. M-stationary models
    are obtained by using λ = 0.


    *Example:* The command


    ```

    data(fig13.2c)

    y = trans.to.dual.wge(fig13.2c, lambda = -0.4, offset = 63)

    ```


    compute and in this case plot the dual data shown in Figure 13.4b and saves the
    dual data in y$intY using the G(λ) time transformation specified by lambda and
    offset, which in this case were obtained in Example 13.7.


    # d. trans.to.original.wge(xd, lambda, offset, h, plot) transforms a dual data
    set in transformed time back to the original time scale.


    The values of lambda and offset are those used in the function trans.to.dual.wge
    used previously to transform the time axis, and the value of h is obtained as
    output from the function trans.to.dual.wge.


    +   - xd is the equally spaced dual data set in the transformed time specified
    by the G(λ) time used in trans.to.dual

    +   - lambda is the value of lambda in the G(λ) transformation used to create
    the dual

    +   - offset is the value of offset in the G(λ) transformation used to create
    the dual

    +   - h is a scaling parameter (obtained as output from trans.to.dual) designed
    to assure that the dual realization and the original realization are of the same
    length

    +   - plot = TRUE (default) produces a plot of the dual realization created


    The function outputs (and optionally plots) reintY which are the Y values to be
    plotted against t = 1, ..., n that approximate the original TVF realization.


    *Example:* The G-filtering code used to create the dual, low-pass filtered dual,
    and associated filtered data in the original time space discussed in Section 13.5
    are as follows (using the true values lambda = 0 and offset = 175).


    ```

    data(fig13.18a)

    dual = trans.to.dual.wge(fig13.18a, lambda = 0, offset = 175)

    ```'
