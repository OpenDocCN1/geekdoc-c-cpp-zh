    to be those that produced the “most stationary behaving” realization. To illustrate
    these remarks, Figure 13.7a shows the sample autocorrelations for the first third
    of the data in Figure 13.4a with a solid line, the sample autocorrelations for
    the middle third of the data with a dotted line, and the sample autocorrelations
    for the last third of the data with a dashed line. There it can be seen that there
    is dramatic difference in autocorrelation patterns among the three. For the initial
    third of the data, there is higher frequency behavior that is changing so rapidly
    that the sample autocorrelations after the first eight lags or so are very small.
