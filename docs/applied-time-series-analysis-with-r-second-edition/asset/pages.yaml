    d we show the first three additive components of an AR(9) model fit to the sunspot
    data. In Chapters 8 and 9 we will discuss the topic of finding an appropriate
    model for a set of data. The factor table, not shown here, of the AR(9) model
    fit not surprisingly shows the strongest behavior to be associated with a system
    frequency of about f = 0.09 and this is illustrated by the first component. The
    second component is a wandering behavior (associated with a factor of 1 − 0.95B
    and further examination of the wandering shows that it seems to track the heights
    of the peaks through time. The third component, in Figure 3.27d, shows some weak
    higher frequency behavior associated with system frequency f = 0.19 that is barely
    visible in the original plot.


    **Using R:** Decompositions of AR realizations into additive components can be
    accomplished using the tswge function factor.comp.wge. This function prints the
    factor table associated with the AR model fit to a time series realization using
    Burg estimates (see Chapter 7). The function then calculates ncomp (≤ nfactors)
    additive components where nfactors is the number of factors in the factor table
    for the fitted model. See Appendix 3B and Appendix 10A for more details.'
