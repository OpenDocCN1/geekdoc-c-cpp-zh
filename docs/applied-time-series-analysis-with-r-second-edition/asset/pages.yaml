- pgno: 465
  md: 'Another issue that may need to be checked concerning residuals is normality.
    Normality is an assumption upon which ML estimates are based. Additionally, if
    uncorrelated residuals are non-normal, then ARCH-type behavior is a possibility.
    (See Section 4.2.) Methods for checking normality include the use of Q–Q plots
    or formal tests for normality such as the Shapiro–Wilk test (see Shapiro and Wilk,
    1965). Other tests, for example the Anderson–Darling test (see Anderson and Darling,
    1952) and a host of others can also be used to test for normality. In Figure 9.3,
    we show Q–Q plots of the (standardized) residuals in Figure 9.2. The normality
    of the residuals for the airline model seems like an appropriate assumption while
    the normality of the PA temperature residuals seems more questionable. Neither
    the Anderson–Darling nor the Shapiro–Wilk test reject normality for either set
    of residuals at α = 0.05.


    **Using R:** Basic R functions are available for checking normality. The function
    `qqnorm(x)` plots a Q–Q plot, and `shapiro.test(x)` will perform a Shapiro–Wilk
    test of the null hypothesis that the data (in vector x) are normal. Other tests
    for normality, including the Anderson–Darling test, Cramer–von Mises, and Lilliefors
    (Kolmogorov–Smirnov) tests, see Stephens (1974), can be obtained using functions
    in the CRAN package nortest.


    # 9.2 Stationarity versus Nonstationarity


    As discussed in Section 8.3, the decision concerning whether or not to include
    a nonstationary component in the model (e.g., a factor of 1 − B, a seasonal factor
    1 − B^s, and so forth) is one that will need to be made by the investigator. For
    example, AIC will not make such a decision for you. It was noted in Section 8.3
    that there are tests for a unit root (i.e., the need for a factor 1 − B in the
    model). However, as was noted there, the decision to retain a unit root is the
    result of failure to reject a null hypothesis, and as such the unit root tests
    do not have sufficient power in general to distinguish between models with near
    unit roots and those with unit roots. The final decision concerning whether to
    include a factor 1 − B should be based on such considerations as whether there
    is any physical reason to believe that there is an attraction to the mean.


    Another important issue is that realizations from the model'
