    # 5.3.1 Factor Tables for Seasonal Models of the Form of Equation 5.17 with $s
    = 4$ and $s = 12$


    Although the seasonal order, $s$, can take on any integer value greater than one
    in applications, it is often the case that $s = 4$ (for quarterly data) and $s
    = 12$ (for monthly data). In the case of $s = 4$, we have $(1 - B^4) = (1 - B)(1
    + B)(1 + B^2)$ so that the roots of the characteristic Equation $1 - z^4 = 0$
    are $\pm 1$ and $\pm i$. Specifically, the factor table associated with the model
    $(1 - B^4)X_t = a_t$ is given in Table 5.4. In Table 5.5, we show the more complicated
    factor table for $(1 - B^{12})X_t = a_t$. The roots of $1 - z^{12} = 0$ are the
    12 roots of unity that are shown in Table 5.5 along with the associated factors
    and system frequencies. When analyzing data for which a seasonal model with $s
    = 4$ or $s = 12$ is a candidate, it will be useful to refer to Tables 5.4 and
    5.5 to see how the factors of the estimated model agree with those expected for
    the seasonal models represented in these two tables. This will be further discussed
    in Section 8.5.3.


    **TABLE 5.4**


    Factor Table for $(1 - B^4)X_t = a_t$


    | AR Factors | Roots ($r_j$) | $|r_j^{-1}|$ | $f_{0j}$ |

    |---|---|---:|---:|

    | $1 - B$ | $1$ | $1$ | $0$ |

    | $1 + B$ | $-1$ | $1$ | $0.5$ |

    | $1 + B^2$ | $\pm i\cos(\pi/2)$ | $1$ | $0.25$ |


    # EXAMPLE 5.9: THE AIRLINE MODEL


    The monthly data for the number of international airline passengers (log scale)
    shown in Figure 1.25a have been widely analyzed as a seasonal data set with a
    trending behavior. A variety of models have been proposed for this data set, and
    as a group, these are referred to as “airline models.” The model we will use here
    for this purpose is an ARUMA($p, 1, q$) × $(P_{12}, 1, Q_{12})_{12}$ model of
    the form


    $\phi(B)\,\Phi(B^{12})(1-B)(1-B^{12})(X_t-\mu)=\theta(B)\,\Theta(B^{12})a_t. \qquad
    (5.18)$'
