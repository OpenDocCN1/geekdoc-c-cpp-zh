- pgno: 447
  md: '“sample GPAC array.” As with the partial autocorrelation function, the most
    obvious method of estimating φ_{kk}^{(j)} is to use the defining relation in Equation
    8A.13 with ρ_k replaced by the usual sample autocorrelation, \hat{ρ}_k. When this
    is done, the resulting estimate of φ_{kk}^{(j)} is simply the extended Yule–Walker
    estimate of φ_k based on assuming the process is ARMA(k,j). However, as noted
    in Chapter 7, extended Yule–Walker estimators have undesirable properties, especially
    when some roots of the characteristic equation are close to the unit circle. Our
    implementation of the sample GPAC arrays is based on Burg/TT estimates (see Section
    7.2.3.2). Gray et al. (1978) and Woodward and Gray (1981) have shown that “so
    called” R and S recursion can be used to solve for the kth parameter in the extended
    k × k system. The GPAC array is not implemented in tswge, but is available in
    GW-WINKS. The implementation of the GPAC array in GW-WINKS is based on an efficient
    algorithm using Burg/TT estimate along with R and S recursion. While φ_{kk}^{(j)}
    could be obtained as the ML estimate of the fitted ARMA(k,j) model, this procedure
    is overly time consuming because of the multitude of models necessary for estimating
    an entire GPAC array.


    # TABLE 8A.3


    Theoretical GPAC Array for an ARMA(p,q) Process


    | MA order | AR Order |  |  |  |  |  |  |

    |---|---|---|---|---|---|---|---|

    |  |  | 1 | 2 | ... | p | p+1 | ... |

    | MA order | 0 | φ_{11}^{(0)} | φ_{22}^{(0)} | ... | φ_{pp}^{(0)} | φ_{p+1,p+1}^{(0)}
    | ... |

    |  | 1 | φ_{11}^{(1)} | φ_{22}^{(1)} | ... | φ_{pp}^{(1)} | φ_{p+1,p+1}^{(1)}
    | ... |

    |  | ⋮ | ⋮ | ⋮ |  |  |  |  |

    |  | q-1 | φ_{11}^{(q-1)} | φ_{22}^{(q-1)} | ... | φ_{pp}^{(q-1)} | φ_{p+1,p+1}^{(q-1)}
    | ... |

    |  | q | φ_{11}^{(q)} | φ_{22}^{(q)} | ... | φ_p | 0 | 0 | ... |

    |  | q+1 | φ_{11}^{(q+1)} | φ_{22}^{(q+1)} | ... | φ_p | U^a | U | ... |

    |  | ⋮ | ⋮ | ⋮ |  | φ_p | U | U | ... |


    a U = undefined.


    # EXAMPLE 8A.5: MODEL IDENTIFICATION USING THE GPAC ARRAY'
