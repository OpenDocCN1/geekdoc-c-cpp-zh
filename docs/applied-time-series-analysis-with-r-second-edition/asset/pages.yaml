- pgno: 590
  md: '$$\sum_{m=0}^{\infty} \pi_m B^m = \theta^{-1}(B)\phi(B) \prod_{j=1}^{k} (1
    - 2u_j B + B^2)^{\lambda_j}$$ $$= \theta^{-1}(B)\phi(B) \prod_{j=1}^{k} \left\{\sum_{h=0}^{\infty}
    C_h^{(-\lambda_j)} (u_j) B^h \right\}.$$


    The truncated form (assuming only the data X₁, …, Xₜ₀ are available) is given
    by


    $$\hat{X}_{t_0}^{(T)}(\ell) = \bar{X} - \sum_{j=1}^{t_0-1+\ell} \pi_j \left(\hat{X}_{t_0}^{(T)}(\ell
    - j) - \bar{X}\right).$$ (11.32)


    In Section 6.4 we noted that forecasts based on Equation 11.32 are based on the
    assumption that the πⱼ are sufficiently close to zero for j > t₀ − 1 + ℓ. This
    will be the case for most ARMA models and for t₀ of moderate size. However, for
    long-memory models, the π-weights damp very slowly which can cause the truncation
    in Equation 11.32 to have a substantial effect. For information concerning the
    relationship between the best linear prediction (based on the available data)
    and forecasts using the truncated π-weights in the context of the fractional and
    FARMA models and GARMA models, see Miller (1994) and Fu (1995). (See also Ferrara
    and Guégan, 2001.)


    Using R: The tswge package contains two functions for producing forecasts from
    long-memory models: fore.farma.wge and fore.garma.wge. For more details see Appendix
    11A.


    # EXAMPLE 11.10: FORECASTS FOR LOG-LYNX DATA


    We use fore.garma.wge to obtain forecasts for the log-lynx data based on the GARMA
    model given in Example 11.9(2). In Figure 11.14a are shown the log-lynx data with
    forecasts for the next 30 years while Figure 11.15b shows the forecasts for the
    last 30 years. Clearly, the cyclic behavior of the forecasts is similar to that
    of the lynx data. The code for obtaining these forecasts is given in Appendix
    11A.'
