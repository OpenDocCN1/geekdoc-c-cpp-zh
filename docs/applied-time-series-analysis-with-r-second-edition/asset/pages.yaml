  md: 'should be noted that the properties of $\overline{X}$ as an estimator of $\mu_X$
    depend on the values of $|u_j|$. For example, in the case of a (1-factor) GARMA
    model, the sample mean converges at the usual $(1/\sqrt{n})$ rate whenever $|u|
    < 1$, while it has a slower convergence rate when $|u| = 1$. See Chung (1996b).


    If $X_t$ satisfies the model in Equation 11.20 with $\mu = 0$, then $Y_t = \prod_{j=1}^k
    (1 - 2u_j B + B^2)^{\lambda_j/2} X_t$ satisfies the ARMA$(p,q)$ model $\varphi(B)Y_t
    = \theta(B)a_t$. Woodward et al. (1998) recommend the use of a grid-search procedure
    for finding ML estimates of the parameters of the $k$-factor GARMA model. We assume
    that $k$ is known. In practice, $k$ will be estimated by identifying peaks in
    a nonparametric spectral estimator, or by examining factor tables. Then, based
    on positions and magnitudes of the peaks in the preliminary spectral estimate,
    a grid of possible values for $\lambda_1$, $u_1$, ..., $\lambda_k$, $u_k$ is selected
    to be used in the search. For each set of values $\lambda_1$, $u_1$, ..., $\lambda_k$,
    $u_k$ in the grid search, the data are transformed to obtain


    $$Y_t = \prod_{j=1}^k (1 - 2u_j B + B^2)^{\lambda_j/2} (X_t - \overline{X}) \tag{11.27}$$
    $$\approx \prod_{j=1}^k \left\{ \sum_{h=0}^{t+K-1} C_h^{(-\lambda_j/2)} (u_j)^h
    (X_{t-h} - \overline{X}) \right\}.$$


    In order to make the transformation in Equation 11.27, $K$ values $X_{-1}, X_{-2},
    \dots, X_{-K+1}$ are obtained by backcasting as discussed in Section 7.4 using
    a high-order AR model. The resulting process, $Y_t$, is modeled as an ARMA$(p,q)$,
    an associated likelihood function is obtained, and the combination of $\lambda_1$,
    $u_1$, ..., $\lambda_k$, $u_k$ associated with the largest likelihood value is
    the approximate ML estimator (for the current values of $p$ and $q$). To identify
    $p$ and $q$ this procedure is performed for each $p = 1, \dots, P$ and $q = 1,
    \dots, Q$, and the ARMA-based AIC associated with the ML estimator is obtained
    in each case. The model (i.e., $p$, $q$, $\lambda_1$, $u_1$, ..., $\lambda_k$,
    $u_k$) associated with the minimum AIC value is selected. See Hosking (1984),
    Gray et al. (1989, 1994), and Woodward et al. (1998).


