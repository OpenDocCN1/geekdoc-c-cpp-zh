    \ of the multivariate time series {$X_t; t \\in T$}.\n+   2. Since the components\
    \ of the multivariate time series discussed in this chapter are discrete parameter\
    \ time series, we will use the subscript notation for time.\n+   3. As in the\
    \ univariate case, when no confusion will arise, we shorten the notation {$X_t;\
    \ t \\in T$} to {$X_t$} or even $X_t$.\n+   4. A finite realization, $x_t$, $t\
    \ = 1, \\dots, n$, of a multivariate time series is a collection of the univariate\
    \ realizations $x_{ti}$, $t = 1, \\dots, n$, from the component time series, where\
    \ $i = 1, \\dots, m$. For the interest rate data in Figure 10.1, we let $X_{t1}$\
    \ denote rates on 6-month CDs, $X_{t2}$ stands for rates of Moody's seasoned Aaa\
    \ corporate bonds, and $X_{t3}$ is the 30-year conventional mortgage rate. These\
    \ three univariate realizations can be considered to be a single realization,\
    \ $x_t = (x_{t1}, x_{t2}, x_{t3})'$, from a trivariate time series, $X_t = (X_{t1},\
    \ X_{t2}, X_{t3})'$.\n+   5. The mean of a multivariate time series is given by\n\
    +   \n+   $$\\boldsymbol{\\mu}_t = E[\\boldsymbol{X}_t] = \\begin{pmatrix} \\\
