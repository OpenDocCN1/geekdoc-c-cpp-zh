    to Equation 4.24, an alternative expression is given by


    $a_t^2 = a_0 + (\alpha_1 + \beta_1) a^2_{t-1} + \cdots + (\alpha_{\max(p,q)} +
    \beta_{\max(p,q)}) a^2_{t-\max(p,q)} + w_t - \beta_1 w_{t-1} - \cdots - \beta_p
    w_{t-p} \tag{4.27}$


    From Equation 4.27, the unconditional variance is given by


    $\sigma_a^2 = \frac{a_0}{1 - (\alpha_1 + \beta_1) - \cdots - (\alpha_{\max(p,q)}
    + \beta_{\max(p,q)})} \tag{4.28}$


    For details, see Box et al. (2008), Cryer and Chan (2008), and Shumway and Stoffer
    (2010).


    # EXAMPLE 4.6: ARCH(4), ARCH(8), AND GARCH(1, 1) MODELS


    Bera and Higgins (1993) showed that the higher the order of the ARCH operator,
    the more persistent the shocks tend to be. This is illustrated in Figure 4.13a
    and b, where we show realizations from the ARCH(4) model where


    $\sigma^2_{t|t-1} = 0.1 + 0.36 a^2_{t-1} + 0.27 a^2_{t-2} + 0.18 a^2_{t-3} + 0.09
    a^2_{t-4} \tag{4.29}$


    and the ARCH(8) model where


    $\sigma^2_{t|t-1} = 0.1 + 0.2 a^2_{t-1} + 0.175 a^2_{t-2} + 0.15 a^2_{t-3} + 0.125
    a^2_{t-4} + 0.1 a^2_{t-5} + 0.075 a^2_{t-6} + 0.05 a^2_{t-7} + 0.025 a^2_{t-8}
    \tag{4.30}$


    respectively. Finally, in Figure 4.13c, we show a realization from the GARCH (1,
    1) model with


    $\sigma^2_{t|t-1} = 0.1 + 0.45 a^2_{t-1} + 0.45 \sigma^2_{t-1|t-2} \tag{4.31}$'
