    c. `acf(x, lag.max, type, plot)` (base R function): calculates (and optionally
    plots) the sample autocorrelations (or sample autocovariances and sample variance)
    of the time series realization where

    x is a vector containing the time series realization x_t, t = 1, ..., n.

    lag.max is the maximum lag at which to calculate the sample autocorrelations (or
    covariances)

    type = "correlation" (default) produces the sample autocorrelations,

    "covariance" specifies the autocovariances, and

    "partial" indicates the partial autocorrelations (discussed in Chapter 8).

    plot is a logical variable. plot = "TRUE" (default) produces a plot of the sample
    autocorrelations (or autocovariances)

    *Example:* `data(hadley); tempaut = acf(x = hadley, lag.max = 25)`

    calculates and plots the first 25 sample autocorrelations for the global temperature
