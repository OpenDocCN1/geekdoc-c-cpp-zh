    In this chapter, we have introduced important and relatively new methods for analyzing
    nonstationary time series with TVF behavior. The general approach is to transform
    the time axis to a dual space in order to obtain a stationary dual realization
    that can then be analyzed using standard techniques based on stationarity. A surprisingly
    large number of applications (chirp signals, Doppler signals, bat echolocation
    signals, seismic data, etc.) can be advantageously analyzed using these techniques.
    For more details concerning analysis and theoretical details, see the references
    listed throughout this chapter.


    # Appendix 13A: G-Stationary Basics


    # 13A.1 Generalized Instantaneous Period and IF of a G-Stationary Process


    For nonstationary signals, whose spectral content varies with time, the frequency
    at a particular time is described by the concept of IF. We consider first a simple
    sinusoidal signal of the form


    $X(t) = A \cos(\phi(t)),$  (13A.1)


    where $A$ is constant and $\phi$ is called the cumulative phase of the signal.


    A common definition (Boashash, 1992a,b) of the IF of $X(t)$ in Equation 13A.1
    is


    $\text{IF} = \phi''(t) / 2\pi.$


    Note that this definition shows the rate of change of $\phi(t)$ per $2\pi$ units.
    However, for some processes, this definition may not have a physical interpretation.
    Therefore, in Definition 13A.2 we will give a new definition of IF for G-stationary
    processes. First, in Definition 13A.1 we define the concepts of the G-period and
    generalized instantaneous period (GIP) of a G-periodic function. These definitions
    were first given by Jiang et al. (2006). Consider the function $H(t)$ and let
    $u = g(t)$, so $t = g^{-1}(u)$ and $H(t) = H(g^{-1}(u)) = h(u)$. Now suppose $h(u
    + \delta) = h(u)$ for all $u$ and that $\delta$ is the smallest such value for
    which this relationship occurs. Therefore $h(u)$ is a periodic function of $u$
    with'
