    for the trending behavior via the correlation structure in the model. From the
    factor table, it is clear that the model is stationary since all the roots are
    greater than one in absolute value (i.e. all the |r_j^{-1}| values are less than
    one). Table 5.1 shows that the dominant feature of the model is a first-order
    factor associated with a positive real root quite close to the unit circle. As
    discussed previously, such a factor is related to aimless wandering behavior in
    realizations. The other factors contribute less pronounced higher frequency behavior,
    so we expect the wandering behavior associated with the positive real root to
    dominate realizations. In Figure 5.1, we show four realizations of length n =
    150 from the AR(4) model in Equation 5.3. The wandering/random trending behavior
