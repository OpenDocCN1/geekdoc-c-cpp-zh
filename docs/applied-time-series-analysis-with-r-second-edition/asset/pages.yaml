    # 5.2.2 Cyclical Models


    In Example 5.7, it is seen that for an ARUMA(p,d,q) process, the limiting autocorrelations,
    ρ*_k, do not decay to zero. In some cases they stay fixed at 1, and in others
    they are periodic. In particular, if all of the d roots of λ(z) = 0 in an ARUMA(p,d,q)
    process are equal to 1, the process is noncyclical. On the other hand, if at least
    one of the d roots of highest multiplicity is −1 or not real, then we will refer
    to the process as a cyclical ARUMA(p,d,q) process. The simplest cyclical ARUMA
    process is (1 + B)X_t = a_t. In this case, ρ*_k = (−1)^k so that the autocorrelation
    is periodic with system frequency f0 = 0.5.


    # EXAMPLE 5.8: AN ARUMA(1, 2, 0) MODEL


    Consider the ARUMA(1, 2, 0) process


    (1 − 0.8B)(1 − 1.34B + B²)X_t = a_t. (5.15)


    Note that the model in Equation 5.15 is the nonstationary counterpart of the near-nonstationary
    model in Equation 5.13.


    The autocorrelations and realization in Figure 5.4 can be considered to essentially
    be from the ARUMA(1, 2, 0) model in Equation 5.15. As noted previously, the sample
    autocorrelations from a realization from an ARUMA(p,d,q) model will damp (even
    though there is no damping in the true autocorrelations) because of the formula
    for calculating \hat{ρ}_k.


    Figure 5.4 shows that the true autocorrelations and the realization behave much
    as they would for a harmonic component model with period equal to 7.7 (1/0.13).


    # Using R:


    The tswge package has three functions for generating realizations from nonstationary
    models: gen.arima.wge, gen.aruma.wge, and gen.sigplusnoise.wge. As the names suggest,
    gen.arima.wge is for generating realizations from ARIMA models, gen.aruma.wge
    generates realizations from ARUMA models (which contain ARIMA models as special
    cases), and gen.sigplusnoise.wge generates realizations from a signal-plus-noise
    model as'
