  md: 'γ_k = σ_a^2 ∑_{j=0}^{∞} ψ_j ψ_{j+k}

    = σ_a^2 ∑_{j=0}^{∞} C_j^{(λ)}(u) C_{j+k}^{(λ)}(u).


    # Table 11.1


    Approximating γ₀ by Truncating in Equation 11.24 When u = 1 and σ_a² = 1


    | γ(=d/2) | Exact | Sum to 200,000 | Sum to 10 Million |

    |---|---|---|---|

    | 0.05 | 1.0195 | 1.0195 | 1.0195 |

    | 0.125 | 1.1803 | 1.1800 | 1.1803 |

    | 0.24 | 8.4061 | 3.9004 | 4.5527 |


    One technique for calculating the autocovariances is to truncate the series in
    Equation 11.24 after a sufficient number of terms. Table 11.1 (given by Ford,
    1991) illustrates that, depending on the parameters, the terms in this series
    may not damp quickly enough to make truncation feasible.


    The table considers the problem of using Equation 11.24 to calculate γ₀ for the
    case u = 1. In this case using Theorem 11.1(4) and the fact that d = 2λ, the sum
    of the infinite series in Equation 11.24 is known in closed form to be γ₀ = Γ(−4λ
    + 1)/[Γ(−2λ + 1)]². Table 11.1 compares values of the infinite sum in Equation
    11.24 to the results of truncating the sum after 200,000 terms and after 10 million
    terms. In the table it is seen that for λ = 0.05 and λ = 0.125 the two truncated
    sums approximate the infinite sum quite well. However, in the near-nonstationary
    case λ = 0.24, the convergence is extremely slow and a sum to 10 million terms
    is a very poor approximation! Chung (1996a) expressed γₖ for a (1-factor) Gegenbauer
    process as a recursion involving Legendre functions. Using Equations 1.28 and
    11.19, an expression for the autocovariance of a Gegenbauer process is given as
    the inverse Fourier transform of the spectrum,


    γ_k = ∫_{-0.5}^{0.5} e^{2π i f k} P(f) df. (11.25)


