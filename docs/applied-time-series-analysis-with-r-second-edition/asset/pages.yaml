    For example, consider the AR(3) model


    $$(1 - \alpha_1 B)(1 - \beta_1 B - \beta_2 B^2) X_t = a_t, \qquad (3.120)$$


    with one real root and one complex conjugate pair of roots (i.e., $m = 2$). The
    model in Equation 3.120 can be written in inverted form as


    $$X_t = \frac{1}{(1 - \alpha_1 B)(1 - \beta_1 B - \beta_2 B^2)} a_t, \qquad (3.121)$$


    Recalling that operators can be inverted using properties of the corresponding
    algebraic quantities, we use partial fractions to write


    $$\frac{1}{(1 - \alpha_1 z)(1 - \beta_1 z - \beta_2 z^2)} = \frac{A}{1 - \alpha_1
    z} + \frac{C_1 + C_2 z}{1 - \beta_1 z - \beta_2 z^2}, \qquad (3.122)$$


    from which we obtain


    $$X_t = \frac{1}{(1 - \alpha_1 B)(1 - \beta_1 B - \beta_2 B^2)} a_t \qquad (3.123)$$

    $$= \left(\frac{A}{1 - \alpha_1 B} + \frac{C_1 + C_2 B}{1 - \beta_1 B - \beta_2
    B^2}\right) a_t$$

    $$= \left(\frac{A}{1 - \alpha_1 B}\right) a_t + \left(\frac{C_1 + C_2 B}{1 - \beta_1
    B - \beta_2 B^2}\right) a_t,$$


    for real constants $A$, $C_1$, and $C_2$. Letting $X_t^{(1)} = (A / 1 - \alpha_1
    B) a_t$ and $X_t^{(2)} = (C_1 + C_2 B / 1 - \beta_1 B - \beta_2 B^2) a_t$, it
    follows that $(1 - \alpha_1 B) X_t^{(1)} = A a_t$ and $(1 - \beta_1 B - \beta_2
    B^2) X_t^{(2)} = (C_1 + C_2 B) a_t = (1 + (C_2 / C_1) B)(C_1 a_t)$. That is, $x_t^{(1)}$
    is a realization from an AR(1) process where the AR factor is the first factor
