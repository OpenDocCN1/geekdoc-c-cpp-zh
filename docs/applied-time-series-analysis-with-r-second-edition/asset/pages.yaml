  md: '$g(t) = \frac{t^{\lambda} - 1}{\lambda}.$


    These processes, referred to as $G(\lambda)$ processes, are $G$-stationary processes
    with $g(t) = (t^{\lambda} - 1)/\lambda$. For the case $\lambda = 0$, we take $g(t)
    = \lim_{\lambda \to 0} (t^{\lambda} - 1)/\lambda = \ln t$, throughout and thus
    the $G(0)$ process is the M-stationary process. We begin with the definition of
    a continuous $G(\lambda)$-stationary process.


    # Definition 13.5


    Let $X(t)$ be a stochastic process defined for $t, \ \tau \in [0, \infty)$ such
    that for any $(t^{\lambda} + \tau^{\lambda} - 1) \in [0, \infty)$, and any constant
    $\lambda \in (-\infty, 0) \cup (0, \infty)$


    +   i. $E[X(t)] = \mu$  (13.11)

    +   ii. $\operatorname{Var} X(t) = \sigma^2 < \infty$

    +   iii. $E[(X(t^{\lambda}) - \mu)(X(t^{\lambda} + \tau^{\lambda} - 1)^{1/\lambda}
    - \mu)] = R_X(\tau; \lambda)$


    Then we define $X(t)$ to be a continuous $G(\lambda)$-stationary process and $R_X(\tau;
    \lambda)$ to be the $G(\lambda)$ autocovariance.


    # NOTES:


    +   1. If $\lambda = 0$, we will refer to the process as an M-stationary process.
    That is, we will allow $\lambda \in (-\infty, \infty)$, but the case $\lambda
    = 0$ should be interpreted as the limit as $\lambda \to 0$.

    +   2. A $G(\lambda)$ process is a G-stationary process with $u = g(t) = (t^{\lambda}
    - 1)/\lambda$ and stationary dual $Y(u)$, where $X(t) = X((\lambda u + 1)^{1/\lambda})
    = Y(u)$.

    +   3. Property (iii) is based on the fact that $X(g^{-1}(g(t) + g(\tau))) = X((t^{\lambda}
    + \tau^{\lambda} - 1)^{1/\lambda})$.

    +   4. It is easily shown that $\lim_{\lambda \to 0} (t^{\lambda} + \tau^{\lambda}
    - 1)^{1/\lambda} = t\tau$, so again, the case $\lambda = 0$ yields an M-stationary
    process.'
