  md: '# 8A.5 The GPAC Array


    Woodward and Gray (1981) recommend examining the generalized partial autocorrelations
    by calculating φ_{kk}^{(j)}, k = 1, 2, ..., P, k = 1, 2, ..., P and j = 1, 2,
    ..., Q for some P and Q and then placing these values in a generalized partial
    autocorrelation array (GPAC array) as in Table 8A.2. Note that the first row of
    the GPAC array contains the partial autocorrelations. The results of Theorem 8A.1
    indicate that the GPAC array will display specific patterns when X_t is an ARMA(p,q)
    process, and this pattern is shown in Table 8A.3. In order to identify p and q,
    the GPAC array is examined in order to find a row in which zeros begin occurring
    beyond a certain point. This row is the qth row, and the zeros begin in the p
    + 1st column. Also values in the pth column are constant from the qth row and
    below. This constant is φ_p ≠ 0. Given the true autocorrelations for an ARMA(p,q)
    process, the patterns in the GPAC array uniquely determine the model orders if
    P and Q are chosen sufficiently large. In addition to the results in Theorem 8A.1,
    it can also be shown that if k > p and j > q, then φ_{kk}^{(j)} is undefined in
    the sense that φ_{kk}^{(j)} as calculated by Equation 8A.13 is 0/0. See Woodward
    and Gray (1981).


    # TABLE 8A.2


    GPAC Array


    |  | AR Order |  |  |  |

    |---|---|---|---|---|

    | j/k | 1 | 2 | ... | P |

    | MA order 0 | φ_{11}^{(0)} | φ_{22}^{(0)} | ... | φ_{pp}^{(0)} |

    | 1 | φ_{11}^{(1)} | φ_{22}^{(1)} | ... | φ_{pp}^{(1)} |

    | 2 | φ_{11}^{(2)} | φ_{22}^{(2)} | ... | φ_{pp}^{(2)} |

    | ⋮ | ⋮ | ⋮ |  | ⋮ |

    | Q | φ_{11}^{(Q)} | φ_{22}^{(Q)} | ... | φ_{pp}^{(Q)} |


    In practice the GPAC array must be estimated using the observed realization. The
    ability of the GPAC array to identify p and q ultimately depends on how identifiable
    the patterns are when the components of the GPAC array are estimated. We refer
    to an estimated GPAC array based on a realization as a'
