  md: '# 9.3.1 Cochrane–Orcutt and Other Methods


    Consider the case in which (1 − φ₁B)Zₜ = aₜ. In this case, it follows from Equation
    9.11 that


    Y* = (1 − φ₁B)Xₜ

    = (1 − φ₁B)(a + b t + Zₜ)

    = a(1 − φ₁) + b(1 − φ₁B)t + (1 − φ₁B)Zₜ

    = c + b t_{φ1} + aₜ,  (9.13)


    where Equation 9.13 is a regression equation with the same slope coefficient,
    b, as in Equation 9.11 with a new independent variable t_{φ1} = (1 − φ₁B)t = t
    − φ₁(t − 1) and uncorrelated residuals. In practice, however, φ₁, a, and b will
    not be known and must be estimated from the data. Cochrane and Orcutt (1949) suggested
    fitting a regression line to the data using least-squares estimates and fitting
    an AR(1) model to the residuals Ẑₜ = Xₜ − â − b̂t. Letting φ̂₁ denote the estimated
    coefficient, they suggested transforming to obtain Ŷₜ = Xₜ − φ̂₁Xₜ₋₁, t = 2, …,
    n. Thus, the resulting series, Ŷₜ, is of length n − 1 and satisfies


    Ŷₜ = (1 − φ̂₁B)Xₜ

    = a(1 − φ̂₁) + b(1 − φ̂₁B)t + (1 − φ̂₁B)Zₜ

    = c + b t_{φ̂1} + gₜ,  (9.14)


    where t_{φ̂1} = t − φ̂₁(t − 1). Noting that Z = (1 − φ₁B)⁻¹aₜ, we see that gₜ
    = (1 − φ̂₁B)(1 − φ₁B)⁻¹aₜ, which is not white noise but should be almost uncorrelated.
    The Cochrane–Orcutt (CO) procedure is then used to test the null hypothesis H₀:
    b = 0 in Equation 9.14 where the independent variable is t_{φ̂1} using standard
    least-squares methods. That is, the CO test involves calculating the test statistic'
  merge: -1
  img_proc: true
- pgno: 474
  md: '$t_{CO} = \frac{\hat{b}_{CO}}{\hat{SE}(\hat{b}_{CO})}$


    where $\hat{b}_{CO}$ is the usual least-squares estimate of the slope $b$ in Equation
    9.14 and $\hat{SE}(t_{CO})$ is its usual standard error. Then, $H_0$: $b = 0$
    is tested assuming that the statistic $t_{CO}$ in Equation 9.15 has a Student''s
    $t$ distribution. Beach and MacKinnon (1978) developed a ML approach that also
    involves calculation of a test statistic that has a $t$ distribution under the
    null. While the CO and ML approaches assume that the residuals are AR(1), extensions
    allow for residuals that are AR($p$) or ARMA($p,q$). Another test developed by
    Bloomfield and Nychka (1992) (BN) involves a frequency-domain expression for the
    standard error of $\hat{b}$.


    Although the CO, ML, and BN tests seem reasonable, it has been shown that they
    tend to have significance levels higher than their nominal levels (see Park and
    Mitchell, 1980; Woodward and Gray, 1993; Woodward et al., 1997). While these tests
    have the desired asymptotic properties, Woodward et al. (1997) demonstrate that
    this asymptotic behavior is often not approached by realizations of moderate length
    (e.g., $n \approx 100$) in the presence of even moderate correlation structure
    in the data. For example, Woodward et al. (1997) show that when $Z_t$ is an AR(1)
    with $\phi_1 = 0.9$ or higher and $b = 0$, realizations of length $n = 1000$ or
    more may be required in order for the CO, ML, or BN tests to have observed significance
    levels close to the nominal levels. The simulations performed by Woodward et al.
    (1997) showed that if the true model is $(1 - 0.9B)X_t = a_t$ (i.e., a stationary
    model with no deterministic signal), then the CO method, run at the nominal 5%
    level of significance (incorrectly) detects a significant trend in 20% of 1000
    realizations of length $n = 100$ while Beach and MacKinnon''s (1978) ML method
    detects a trend in 17% of these realizations. For realizations of length $n =
    1000$, the CO and ML procedures detected significant trends in about 8% of the
    realizations, which are still significantly high.


    # 9.3.2 A Bootstrapping Approach


    Woodward et al. (1997) suggested a bootstrap method to estimate the actual distribution
    of the test statistics obtained using the CO and MLE procedures. In the following,
    we will consider the application of the bootstrap to $t_{CO}$ in'
