    $$=\frac{1}{(2\pi\sigma_a^2)^{(n-p)/2}}\exp\left\{-\frac{S_c}{2\sigma_a^2}\right\}.$$


    where $S_c$ is given by


    $$S_c=\sum_{t=p+1}^{n}(x_t-\phi_1x_{t-1}-\cdots-\phi_px_{t-p}+\theta_1a_{t-1}+\cdots+\theta_qa_{t-q})^2.$$


    Calculating $f(x_1,\ldots,x_n)$ using Equation 7.30 involves $f(x_1,\ldots,x_n)$,
    which is given by


    $$f(x_1,\ldots,x_p)=\frac{1}{(2\pi\sigma_a^2)^{p/2}}|M_p|^{1/2}\exp\left\{-\frac{x_p''M_px_p}{2\sigma_a^2}\right\},
    \tag{7.33}$$


    where $x_p=(x_1,\ldots,x_p)''$. Multiplying $f(x_{p+1},\ldots,x_n\mid x_1,\ldots,x_p)$
    in Equation 7.32 by $f(x_1,\ldots,x_p)$ in Equation 7.33 yields


    $$\begin{aligned}f(x_1,\ldots,x_n)&=f(x_{p+1},\ldots,x_n\mid x_1,\ldots,x_p)f(x_1,\ldots,x_p)\\&=\frac{1}{(2\pi\sigma_a^2)^{(n-p)/2}}\exp\left\{-\frac{S_c}{2\sigma_a^2}\right\}\frac{1}{(2\pi\sigma_a^2)^{p/2}}|M_p|^{1/2}\exp\left\{-\frac{x_p''M_px_p}{2\sigma_a^2}\right\}\\&=\frac{1}{(2\pi\sigma_a^2)^{n/2}}|M_p|^{1/2}\exp\left\{-\frac{S_u}{2\sigma_a^2}\right\}.\end{aligned}$$


    where


    $$S_u=S_c+x_p''M_px_p. \tag{7.34}$$


    It is common terminology to refer to $S_u$ as the *unconditional sum of squares*
    and to $S_c$ as the *conditional sum of squares*. The log-likelihood function
    is given by


    $$l(\phi_1,\ldots,\phi_p,\theta_1,\ldots,\theta_q,\sigma_a^2)=-\frac{n}{2}\ln(2\pi\sigma_a^2)+\frac{1}{2}\ln|M_p|-\frac{S_u}{2\sigma_a^2}.
