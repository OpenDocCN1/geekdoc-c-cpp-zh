    # 11.3 Gegenbauer and GARMA Processes


    Even though the fractional and FARMA models have been widely studied and have
    shown to be useful long-memory models, it can be seen that the long-memory fractional
    difference (1 − B)^d can only model “first-order” long-memory behavior. For example,
    according to Theorem 11.1(3) the peak in the spectrum associated with (1 − B)^d
    will always be at f = 0. Also the autocorrelations damp like ρ(k) ≃ k^{2d−1} as
    k → ∞ and are noncyclic in nature. The important point is that the fractional
    and FARMA models, as defined in Section 11.2, cannot model cyclic long-memory
    behavior associated with a spectrum that is unbounded for some f ∈ (0, 0.5) or
    for which the autocorrelation damps like ρ_k ≃ k^α cos(2π f) as k → ∞ where 0
    < α < 1.


    The restriction to long-memory behavior associated with system frequency f = 0
    is analogous, in the setting of AR(p) models, to being restricted to first-order
    AR models with φ₁ > 0. Recall that in Section 3.2 it was shown that cyclic behavior
    associated with f ∈ (0, 0.5) in AR(p) models is associated with'
