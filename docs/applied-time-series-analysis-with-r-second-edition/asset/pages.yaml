    have generally been increasing over this time period.


    However, it is well known using proxy data such as tree rings, ocean sediment
    data, etc., that temperatures have not remained static over time leading up to
    the rise over the past 160 years, but have tended to vary. Although the data are
    insufficient to draw strong conclusions, there is some evidence that, at least
    in much of the northern hemisphere, the temperatures during the medieval warm
    period (950–1100) may have been as high as they are today. The medieval warm period
    was followed by a period known as the Little Ice Age. While not a true ice age,
    this was a period during which available temperature data indicate there was cooling
    that lasted into the nineteenth century.


