  md: 'where \(\varphi(z)\) and \(\theta(z)\) share no common factors, then \(X_t\)
    is a \(k\)-factor GARMA process.


    In Theorem 11.7 we give the stationarity, long memory, and invertibility conditions
    for a \(k\)-factor GARMA process.


    # Theorem 11.7


    +   1. \(X_t\) in Equation 11.20 is causal, stationary, and invertible if \(u_j\)
    and \(\lambda_j\) (\(j=1,\ldots,k\)) satisfy the conditions in Theorem 11.5(1)
    and all the roots of equation \(\varphi(z)=0\) and \(\theta(z)=0\) lie outside
    the unit circle.


    +   2. The spectrum of a causal, stationary, and invertible \(k\)-factor GARMA
    process is given by


    $$P(f)=\sigma_a^2\left|\frac{\theta(e^{2\pi if})}{\phi(e^{2\pi if})}\right|^2\prod_{j=1}^{k}\left[4(\cos
    2\pi f-u_j)^2\right]^{-\lambda_j}.$$ \tag{11.21}


    +   3. A process \(X_t\) satisfying the conditions in (1) is also long memory
    if \(\lambda_j>0\) for any \(j=1,\ldots,k\).


    *Proof:* See Woodward et al. (1998) and Giraitis and Leipus (1995).


