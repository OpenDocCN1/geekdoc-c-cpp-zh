- pgno: 17
  md: '# 1

    Stationary Time Series


    In basic statistical analysis, attention is usually focused on data samples, X₁,
    X₂, ..., Xₙ, where the Xᵢs are independent and identically distributed random
    variables. In a typical introductory course in univariate mathematical statistics,
    the case in which samples are not independent but are in fact correlated is not
    generally covered. However, when data are sampled at neighboring points in time,
    it is very likely that such observations will be correlated. Such time-dependent
    sampling schemes are very common. Examples include the following:


    +   - Daily Dow Jones stock market closes over a given period

    +   - Monthly unemployment data for the United States

    +   - Annual global temperature data for the past 100 years

    +   - Monthly incidence rate of influenza

    +   - Average number of sunspots observed each year since 1749

    +   - West Texas monthly intermediate crude oil prices

    +   - Average monthly temperatures for Pennsylvania


    Note that in each of these cases, an observed data value is (probably) not independent
    of nearby observations. That is, the data are correlated and are therefore not
    appropriately analyzed using univariate statistical methods based on independence.
    Nevertheless, these types of data are abundant in fields such as economics, biology,
    medicine, and the physical and engineering sciences, where there is interest in
    understanding the mechanisms underlying these data, producing forecasts of future
    behavior, and drawing conclusions from the data. Time series analysis is the study
    of these types of data, and in this book we will introduce you to the extensive
    collection of tools and models for using the inherent correlation structure in
    such data sets to assist in their analysis and interpretation.


    As examples, in Figure 1.1a we show monthly West Texas intermediate crude'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'oil prices from January 2000 to October 2009, and in **Figure 1.1b** we show
    the average monthly temperatures in degrees Fahrenheit for Pennsylvania from January
    1990 to December 2004. In both cases, the monthly data are certainly correlated.
    In the case of the oil process, it seems that prices for a given month are positively
    correlated with the prices for nearby (past and future) months. In the case of
    Pennsylvania temperatures, there is a clear 12 month (annual) pattern as would
    be expected because of the natural seasonal weather cycles.


    ![](img/a0e0259119deb8c7b41dfd4f664e541d_18_0.png)


    # **FIGURE 1.1**


    Two time series data sets. (a) West Texas intermediate crude. (b) Pennsylvania
    average monthly temperatures.


    **Using R:** The CRAN package tswge associated with this book contains over 100
    data sets containing data related to the material in this book. Throughout the
    book, whenever a data set being discussed is included in the tswge package, the
    data set name will be noted. In this case the data sets associated with Figure
    1a and b are wtcrude and patemp, respectively.


    Time series analysis techniques are often classified into two major categories:
    time domain and frequency domain techniques. Time domain techniques include the
    analysis of the correlation structure, development of models that describe the
    manner in which such data evolve in time, and forecasting future behavior. Frequency
    domain approaches are designed to develop an understanding of time series data
    by examining the data from the perspective of their underlying cyclic (or frequency)
    content. The observation that the Pennsylvania temperature data tend to contain
    12 month cycles is an example of examination of the frequency domain content of
    that data set. The basic frequency domain analysis tool is the power spectrum.


    While frequency domain analysis is commonly used in the physical and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'engineering sciences, students with a statistics, mathematics, economics, or
    finance background may not be familiar with these methods. We do not assume a
    priori familiarity with frequency domain methods, and throughout the book we will
    introduce and discuss both time domain and frequency domain procedures for analyzing
    time series. In **Sections 1.1 through 1.4**, we discuss time domain analysis
    of time series data while in **Sections 1.5 and 1.6** we present a basic introduction
    to frequency domain analysis and tools. In **Section 1.7**, we discuss several
    simulated and real-time series data sets from both time and frequency domain perspectives.


    # ## 1.1 Time Series


    Loosely speaking, a time series can be thought of as a collection of observations
    made sequentially in time. Our interest will not be in such series that are deterministic
    but rather in those whose values behave according to the laws of probability.
    In this chapter, we will discuss the fundamentals involved in the statistical
    analysis of time series. To begin, we must be more careful in our definition of
    a time series. Actually, a time series is a special type of *stochastic process*.


    # **Definition 1.1**


    A stochastic process \(\{X(t);\ t \in T\}\) is a collection of random variables,
    where \(T\) is an index set for which all of the random variables, \(X(t),\ t
    \in T\), are defined on the same sample space. When \(T\) represents time, we
    refer to the stochastic process as a *time series*.


    If \(T\) takes on a continuous range of values (e.g., \(T=(-\infty,\infty)\) or
    \(T=(0,\infty)\)), the process is said to be a *continuous parameter process*.
    If, on the other hand, \(T\) takes on a discrete set of values (e.g., \(T=\{0,1,2,\ldots\}\)
    or \(T=\{0,\pm1,\pm2,\ldots\}\)), the process is said to be a *discrete parameter
    process*. Actually, it is typical to refer to these as continuous and discrete
    processes, respectively.


    We will use the subscript notation, \(X_t\), when we are dealing specifically
    with a discrete parameter process. However, when the process involved is either
    continuous parameter or of unspecified type, we will use the function notation,'
  merge: -1
  img_proc: true
- pgno: 20
  md: '$X(t)$. Also, when no confusion will arise, we often use the notation $\{X(t)\}$
    or simply $X(t)$ to denote a time series. Similarly, we will usually shorten $\{X_t;
    t = 0, \pm 1, \ldots\}$ to $X_t, t = 0, \pm 1, \ldots$ or simply to $X_t$.


    Recall that a random variable, $Y$, is a function defined on a sample space $\Omega$
    whose range is the real numbers. An observed value of the random variable $Y$
    is a real number $y = Y(\omega)$ for some $\omega \in \Omega$. For a time series
    $\{X(t)\}$, its “value,” $\{X(t, \omega); t \in T\}$ for some fixed $\omega \in
    \Omega$, is a collection of real numbers. This leads to the following definition.


    # Definition 1.2


    A realization of the time series $\{X(t);\ t \in T\}$ is the set of real-valued
    outcomes, $\{X(t, \omega);\ t \in T\}$ for a fixed value of $\omega \in \Omega$.


    That is, a realization of a time series is simply a set of values of $\{X(t)\}$,
    that result from the occurrence of some observed event. A realization of the time
    series $\{X(t);\ t \in T\}$ will be denoted $\{x(t);\ t \in T\}$. As before, we
    will sometimes use the notation $\{x(t)\}$ or simply $x(t)$ in the continuous
    parameter case and $\{x_t\}$ or $x_t$ in the discrete parameter case when these
    are clear. The collection of all possible realizations is called an *ensemble*,
    and, for a given $t$, the expectation of the random variable $X(t)$, is called
    the ensemble mean and will be denoted $E[X(t)] = \mu(t)$. The variance of $X(t)$
    is given by $\operatorname{Var}[X(t)] = E\{[X(t) - \mu(t)]^2\}$ and is often denoted
    by $\sigma^2(t)$ since it also can depend on $t$.


    # EXAMPLE 1.1: A TIME SERIES WITH TWO POSSIBLE REALIZATIONS


    Consider the stochastic process $Y(t)$ for $t \in (-\infty, \infty)$ defined by
    $Y(t) = \sin(t + \varphi)$ where $P[\varphi = 0] = 0.5$ and $P[\varphi = \pi/2]
    = 0.5$ and $P$ denotes probability. This process has only two possible realizations
    or sample functions, and these are shown in Figure 1.2 for $t \in [0,25]$.


    The individual curves are the realizations while the collection of the two possible
    curves is the *ensemble*. For this process,


    $$E[Y(t)] = 0.5\sin(t + 0) + 0.5\sin\left(t + \frac{\pi}{2}\right).$$


    So, for example,'
