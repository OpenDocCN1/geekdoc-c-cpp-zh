    # 12.3.8 Scalogram: Time-Scale Plot


    Considering the data vector **x** as a time series realization, the wavelet representation
    at time *t* assigns “large” values of *d*_{j,k} when the corresponding ψ_{j,k}
    has “frequency” behavior similar to that of the realization in the vicinity of
    time *t*. The discrete scalogram or *time-scale plot* is a time–frequency plot
    similar to those shown in Figures 12.3 and 12.4 in which the horizontal axis represents
    time, *t*, and the vertical axis represents the “frequency” measure (1/scale).
    In the discussion following Example 12.1 it was noted that we use 1/scale as a
    measure of “frequency.” In the DWT the *d*_{j,k}’s are coefficients that correspond
    to ψ_{j,k} for *j* = 1, …, *J* where *J* ≤ *J*₀ and *n* = 2^{J₀}. Since the support
    of the Haar mother wavelet is of length 1 and the support of ψ_{j,k} is of width
    2^{j}, then it follows that in the DWT setting, 1/scale reaches an upper limit
    of 1 instead of 0.5 as is the case for standard frequency measure. In general
    it is useful to associate a 1/scale value of *u* with a frequency of *u*/2'
