    # 13.4.1 Models for Generalized Linear Chirps


    In this section, we discuss AR-type models for GLC processes that are similar
    to the Euler(p) and $G(p; \lambda)$ models. To begin the discussion, we define
    GLC white noise and then define the GLC(p) model. As before, we proceed formally
    assuming standard properties of the differential operator, $D$, since our purpose
    is to motivate the sampling scheme.


    # Definition 13.10


    Let $z(u)$ be zero mean white noise and let $u = a t^2 + b t$, $\quad t > 0$.
    Then $\varepsilon(t) = z(u)$ is defined as GLC white noise.


    # Definition 13.11


    Consider a process $\{X(t),\ t < -b/(2a)\ \text{or}\ t > -b/(2a)\}$ defined by


    $$\prod_{i=1}^{p}\left(\frac{1}{2 a t + b}D - \alpha_i\right)(X(t) - \mu) = \varepsilon(t),\tag{13.24}$$


    where $D$ is a differential operator, $a,\ b \in (-\infty, \infty)$, $a \neq 0$
    and the $\alpha_i$ are real or complex constants with $\mathrm{Re}(\alpha_i) <
    0$, $p > 0$, and $\varepsilon(t)$ is GLC (zero mean) white noise. Then, $X(t)$
    is called a GLC(p) process. Note, if $a = 0$ and'
