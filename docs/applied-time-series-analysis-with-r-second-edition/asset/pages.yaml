    for measuring the degree to which the correlation behavior seems to remain constant
    across the realization. This measure is based on the fact that the correlation
    structure under stationarity stays constant across the realization while for TVF
    data, such as that in Figure 13.6a, the correlation behavior is very different
    at the beginning of the realization than it is toward the end. Based on such a
