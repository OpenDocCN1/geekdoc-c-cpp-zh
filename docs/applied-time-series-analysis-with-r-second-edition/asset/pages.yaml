  md: '$$\hat{X}_{t_0}(\ell)=\sum_{j=1}^{p}\phi_j\hat{X}_{t_0}(\ell-j)-\sum_{j=\ell}^{q}\theta_j\hat{a}_{t_0+\ell-j}+\left(1-\sum_{j=1}^{p}\phi_j\right)\bar{X}.\tag{6.24}$$


    Notice that the $\hat{a}_t$''s enter into the calculation of the forecasts only
    when there are moving average terms in the model. The use of Equation 6.24 for
    calculating forecasts is illustrated in the following two examples. It should
    be noted that an improved method of calculating the $\hat{a}_t$''s, based on backcasting,
    is discussed in Section 7.4.


    # EXAMPLE 6.1: FORECASTS FROM AN AR(1) MODEL


    Consider the AR(1) model


    $$ (1 - 0.8B)(X_t - \mu) = a_t \tag{6.25} $$


    We observe $X_1, X_2, \dots, X_{t_0}$, and our goal is to estimate or forecast
    $X_{t_0+\ell}$. From Equation 6.24, we obtain


    $$ \hat{X}_{t_0}(\ell) = 0.8 \hat{X}_{t_0}(\ell - 1) + 0.2 \bar{X}. $$


    Thus, the forecasts are obtained by the following simple recursion:


    $$ \hat{X}_{t_0}(1) = 0.8 \hat{X}_{t_0}(0) + 0.2 \bar{X} $$ $$ = 0.8 X_{t_0} +
    0.2 \bar{X} $$ $$ \hat{X}_{t_0}(2) = 0.8 \hat{X}_{t_0}(1) + 0.2 \bar{X} $$ $$
    \vdots $$ $$ \hat{X}_{t_0}(\ell) = 0.8 \hat{X}_{t_0}(\ell - 1) + 0.2 \bar{X}.
    $$


    Figure 6.1 shows the forecasts $\hat{X}_{80}(\ell)$ for $\ell = 1, \dots, 20$
    based on a realization of length 80 from model in Equation 6.25 with $\mu = 25$.
    For this realization, $\bar{X} = 24.17$. The general form of the forecasts for
    large $\ell$ is discussed in Section 6.6.'
