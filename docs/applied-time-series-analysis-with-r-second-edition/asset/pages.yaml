  md: '# Definition 1.5 (Covariance Stationarity)


    The time series \(\{X(t);\ t \in T\}\) is said to be *covariance stationary* if


    +   1. \(E[X(t)] = \mu\) (constant for all \(t\))

    +   2. \(\operatorname{Var}[X(t)] = \sigma^2 < \infty\) (i.e., a finite constant
    for all \(t\))

    +   3. \(\gamma(t_1, t_2)\) depends only on \(t_2 - t_1\)


    Covariance stationarity is also called *weak stationarity, stationarity in the
    wide sense,* and *second-order stationarity.* In the remainder of this book, unless
    specified otherwise, the term *stationarity* will refer to covariance stationarity.


    In time series, as in most other areas of statistics, uncorrelated data play an
    important role. There is no difficulty in defining such a process in the case
    of a discrete parameter time series. That is, the time series \(\{X_t; t = 0,
    \pm 1, \pm 2, \ldots\}\) is called a “purely random process” if the \(X_t\)''s
    are uncorrelated random variables. When considering purely random processes, we
    will only be interested in the case in which the \(X_t\)''s are also identically
    distributed. In this situation, it is more common to refer to the time series
    as *white noise.* The following definition summarizes these remarks.


    # Definition 1.6 (Discrete White Noise)


    The time series is called *discrete white noise* if


    +   1. The \(X_t\)''s are identically distributed

    +   2. \(\gamma(t_1, t_2) = 0\) when \(t_2 \ne t_1\)

    +   3. \(\gamma(t, t) = \sigma^2\) where \(0 < \sigma^2 < \infty\)


    We will also find the two following definitions to be useful.


    # Definition 1.7 (Gaussian Process)


    A time series is said to be Gaussian (normal) if for any positive integer \(k\)
    and any \(t_1, t_2, \ldots, t_k \in T\), the joint distribution of \(\{X(t_1),
    X(t_2), \ldots, X(t_k)\}\) is multivariate normal.


    Note that for Gaussian processes, the concepts of strict stationarity and covariance
    stationarity are equivalent. This can be seen by noting that if the'
