  md: 'irreducible second-order factors of φ(z). In this section, we discuss a second-order
    extension of the fractional process in Equation 11.5 which is based on the second-order
    factor (1 − 2uB + B²)^λ for |u| ≤ 1 . In order to understand properties associated
    with such factors, we first consider the Gegenbauer polynomials.


    # 11.3.1 Gegenbauer Polynomials


    Gegenbauer polynomials are among the classical orthogonal polynomials of applied
    mathematics and physics. The Gegenbauer polynomial is defined by


    $$C_n^{(\lambda)}(u) = \sum_{k=0}^{[n/2]} \frac{(-1)^k (\lambda)_{n-k} (2u)^{n-2k}}{k!
    (n-2k)!}, \tag{11.9}$$


    where


    $$ (\alpha)_n = \frac{\Gamma(\alpha+n)}{\Gamma(\alpha)}, $$


    and where [x] denotes the greatest integer less than or equal to x. Although these
    polynomials can be defined as in Equation 11.9, it is also useful to define them
    through their generating function (see Rainville, 1960 and Magnus, Oberhettinger,
    and Soni, 1966).


    # Theorem 11.3


    Let λ ≠ 0 and |z| < 1. Then for |u| ≤ 1 the Gegenbauer polynomials, $C_n^{(\lambda)}(u)$
    satisfy


    $$ (1 - 2u z + z^2)^{-\lambda} = \sum_{j=0}^{\infty} C_j^{(\lambda)}(u) z^j. \tag{11.10}$$


    *Proof:* See Rainville (1960) and Magnus et al. (1966).


