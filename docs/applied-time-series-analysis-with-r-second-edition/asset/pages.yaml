  md: 'critical to note that $\gamma_{ij}(k)=\gamma_{ji}(-k)$ and $\Gamma(-k)=\Gamma''(k)$,
    where $\mathbf{A}''$ is the transpose of the matrix $\mathbf{A}$. See Note 4 below.
    The $j$th diagonal element of $\Gamma(0)$ is $\operatorname{Var}[X_{tj}]$.


    The *cross-correlation*, $\rho_{ij}(k)$, is defined by


    $$\rho_{ij}(k)=\frac{\gamma_{ij}(k)}{\sqrt{\gamma_{ii}(0)\gamma_{jj}(0)}}.$$


    and, correspondingly, the correlation matrix $\boldsymbol{\rho}(k)$, $k=0,1,\ldots$,
    is given by


    $$\boldsymbol{\rho}(k)=\begin{pmatrix}\rho_{11}(k)&\cdots&\rho_{1m}(k)\\ \vdots&\ddots&\vdots\\
    \rho_{m1}(k)&\cdots&\rho_{mm}(k)\end{pmatrix}. \tag{10.3}$$


    # NOTES:


    +   1. The autocorrelations for variable $X_{tj}$ are the $j$th diagonal elements
    of the matrices $\boldsymbol{\rho}(k)$, $k=0,\ \pm1,\ldots$.


    +   2. The values $\rho_{ij}(0)$ of $\boldsymbol{\rho}(0)$ measure what is referred
    to as the concurrent or contemporaneous linear relationship between $X_{ti}$ and
    $X_{tj}$. Note that $\boldsymbol{\rho}(0)$ has 1''s along the diagonal.


    +   3. A useful expression for $\boldsymbol{\rho}(k)$ is


    $$\boldsymbol{\rho}(k)=\begin{pmatrix}\gamma_{11}^{-1/2}&0&\cdots&0\\0&\gamma_{22}^{-1/2}&0&\vdots\\\vdots&0&\ddots&0\\0&\cdots&0&\gamma_{mm}^{-1/2}\end{pmatrix}\Gamma(k)=\begin{pmatrix}\gamma_{11}^{-1/2}&0&\cdots&0\\0&\gamma_{22}^{-1/2}&0&\vdots\\\vdots&0&\ddots&0\\0&\cdots&0&\gamma_{mm}^{-1/2}\end{pmatrix}.
    \tag{10.4}$$


    +   4. Note that for autocorrelations, the definitions $\gamma(k)=E[(X_t-\mu)(X_{t+k}-\mu)]$
    and $\gamma(k)=E[(X_{t+k}-\mu)(X_t-\mu)]$ are equivalent, and also $\gamma(k)=\gamma(-k)$.
    These properties are not shared with the cross-correlation. We mentioned above
    that $\gamma_{ij}(k)=\gamma_{ji}(-k)$ (notice the change in the order of the subscripts).


