  img_proc: true
- pgno: 71
  md: 'realization $x_t$, $t = 1, ..., n$, and we assume that $n = 2m + 1$ is odd.
    That is, we approximate $x_t$ using a finite Fourier series


    $\displaystyle \sum_{j=1}^{m}\left[a_j\cos\left(\frac{2\pi j t}{n}\right)+b_j\sin\left(\frac{2\pi
    j t}{n}\right)\right].$


    The coefficients $a_j$ and $b_j$ are estimated using least squares, in order to
    find the $a_j$ and $b_j$ that minimize


    $Q = \sum_{t=1}^{n}\left\{x_t - \sum_{j=1}^{m}\left(a_j\cos\left(\frac{2\pi j
    t}{n}\right)+b_j\sin\left(\frac{2\pi j t}{n}\right)\right)\right\}^2.$ (1A.3)


    The $a_j$ and $b_j$, $j = 1, ..., m$ that minimize $Q$ in Equation 1A.3 are


    $a_j = \frac{2}{n}\sum_{t=1}^{n}x_t\cos\left(\frac{2\pi j t}{n}\right)=\frac{2}{n}\sum_{t=1}^{n}(x_t-\bar{x})\cos\left(\frac{2\pi
    j t}{n}\right).$


    $b_j = \frac{2}{n}\sum_{t=1}^{n}x_t\sin\left(\frac{2\pi j t}{n}\right)=\frac{2}{n}\sum_{t=1}^{n}(x_t-\bar{x})\sin\left(\frac{2\pi
    j t}{n}\right).$


    The second equality in each expression follows from the fact that


    $\displaystyle \sum_{t=1}^{n}\cos\left(\frac{2\pi j t}{n}\right)=\sum_{t=1}^{n}\sin\left(\frac{2\pi
    j t}{n}\right)=0,$


    for each $j$. Using this terminology, the third form of the periodogram is given
    by


    III. $I(f_j)=\frac{n}{4}(a_j^2+b_j^2),\quad j = 1, ..., m.$ (1A.4)


    Using Parseval''s equality (see Jenkins and Watts, 1968), we obtain


    $\frac{1}{n}\sum_{t=1}^{n}(x_t-\bar{x})^2=\frac{1}{2}\sum_{j=1}^{m}(a_j^2+b_j^2),\quad
    j = 1, ..., m.$ (1A.5)'
