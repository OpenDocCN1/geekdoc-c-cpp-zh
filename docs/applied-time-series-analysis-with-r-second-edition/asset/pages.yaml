    As a result of Theorem 11.4, for a stationary, long-memory Gegenbauer process,
    it follows that ρ_k ≈ k^{2λ-1} cos(2π f_G k) as k → ∞ , and the spectrum is unbounded
    at f_G where f_G ∈ [0, 0.5]. Note that when u = 1, it can be shown using half-angle
    formulas that the spectrum given by Equation 11.15 simplifies to the spectrum
    of the fractional process given in Theorem 11.1(3). That is, when u = 1, the spectrum
    in Equation 11.15 has an infinite peak at f = 0.


    Figure 11.6 (originally given by Gray et al., 1989) shows the stationary long-memory
    region (range of u and λ) for the Gegenbauer processes. The stationary long-memory
    region for u and λ is the shaded region (0 < λ < 0.5 and |u| < 1) along with the
    values of u and λ along the solid bold horizontal borders (u = ±1 and 0 < λ <
    0.25 ). The fractional process is represented by the solid bold horizontal line
    segment at the top of the rectangle. This figure illustrates the fact that the
    Gegenbauer process represents a considerable generalization of the fractional
    process. As u and λ move along a path that approaches a dashed boundary of the
    rectangle, the corresponding Gegenbauer processes approach nonstationarity. For
    example, if λ is held constant at λ = 0.4, then as u approaches 1 from below,
    the processes associated with these u and λ values will increasingly display “near-nonstationary”
    behavior. Thus while u determines the G-frequency, it also affects the degree
    of “near nonstationarity.”


    # EXAMPLE 11.4: GEGENBAUER PROCESSES


    Figure 11.7 shows true autocorrelations for Gegenbauer processes with u = 0.9
    and a range of values for λ. The G-frequency is given by f_G = (cos^{-1}0.0)/(2π)
    = 0.07 and thus it is associated with periods a little over 14. As λ → 0.5 the
    cyclic behavior becomes more dominant. However, the slowly damping behavior can
    be seen even when λ = 0.25.'
