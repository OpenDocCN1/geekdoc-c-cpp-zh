    # 3.6 Generating Realizations from ARMA(p,q) Processes


    The study of time series analysis using ARMA(p,q) models often involves the simulation
    of finite realizations, {x_t, t = 1, ..., n} from known ARMA models to provide
    information concerning the characteristics of typical realizations, autocorrelation
    functions, and spectral densities. We have used this technique often in this chapter.
    These realizations are also useful in Monte Carlo studies, bootstrap resampling,
    etc. For these reasons, we include a brief discussion concerning the generation
    of ARMA(p,q) time series realizations.


    # 3.6.1 MA(q) Model


    Generating realizations from the MA(q) process in Equation 3.1 is relatively simple.
    For known θ_k, k = 1, ..., q, μ and σ_a^2, realization values are'
