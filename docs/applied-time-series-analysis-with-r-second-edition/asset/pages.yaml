  md: 'the n/4 coefficients, s_{2,k}, are retained (and not further down-sampled)
    and that these coefficients describe the 1/scale behavior between 0 and 0.25.
    The entire 1/scale range from 0 to 1 is covered, and there is no overlap, that
    is, no 1/scale range is described by more than one set of coefficients. Figure
    12.17c shows a “level 4” wavelet packet transform in which all n of the level
    4 coefficients are retained. Coifman and Wickerhauser (1992) developed a best
    basis algorithm for selecting the wavelet packet that best matches the characteristics
    of the signal. Note that the DWT is a special case of a wavelet packet transform.


    In describing the coefficients retained in the wavelet packet transform illustrated
    in Figure 12.17b, we were able to describe the coefficients in the level 2 bar
    as the collection of s_{2,k} coefficients. However, at this point terminology
    has not been introduced in this book to describe, for example, the level 3 coefficients
    obtained by low-pass filtering the d_{2,k} coefficients. Wavelet packet functions
    are a more flexible family of functions that include as special cases the wavelet
    and scaling functions. Very briefly, the wavelet packet functions, ω_{j,k}^m(x),
    are defined by setting ω^0(x)=φ(x), ω^1(x)=ψ(x), and defining ω_{j,k}^m(x)=2^{-j/2}
    ω^m(2^{-j} x - k), where m = 0, 1, ... is called the modulation parameter. Wavelet
    packet functions with m > 1 are defined recursively. See, for example, Ogden (1997).


