    One final comment about AR(2) models associated with complex conjugate roots of
    the characteristic equation is that if the system frequency is sufficiently removed
    from 0 or 0.5, the spectral density will have a peak at \(f_s = \frac{1}{2\pi}\cos^{-1}\left(\frac{\phi_1(\phi_2^{-1})}{4\phi_2}\right)\)
    (see Problem 3.20). It is interesting to note that \(f_s \ne f_0\) but as \(\phi_2
    \to -1\), then \(f_s \to f_0\). That is, the peak in the spectral density occurs
    at a frequency close to but not equal to the system frequency \(f_0\).


    # EXAMPLE 3.7


    Figure 3.15a (data set lynx in tswge) shows the annual number of the Canadian
    lynx trapped in the Mackenzie River district of North-West Canada for the period
    1821–1934. Figure 3.15b shows the log (base 10) of the annual numbers trapped,
    and this log data is a classical data set that has been analyzed by many authors.
    These data have interested researchers because of the pseudo-periodic behavior
    with cycle lengths about 10 years. See for example Tong (1977), Bhansali (1979),
    and Woodward and Gray (1983). Also shown in Figure 3.15b and c is the sample autocorrelations
    and the Parzen spectral density estimate of the log lynx data. This shows the
    10-year cyclic nature of the data. The log of the lynx data is usually used for
    analysis because it makes the peaks and troughs of the cycles behave in similar
    manners, and is more AR-like. If an AR(2) model is fit to the data (we will discuss
    alternative models in later chapters) then the fitted model is \(X_t - 1.38X_{t-1}
    + 0.75X_{t-2} = a_t\) which has system frequency \(f_0 = 0.10\). Also, the sample
    autocorrelations have the appearance of a damped sinusoid with period of about
    10, and the spectral density estimate in Figure 3.15d has a peak at about \(f
