  md: 'The process $X_t$ with $\psi$ weights as defined in Theorem 3.1 is a stationary
    and causal AR($p$) process if and only if the roots of the characteristic equation
    $\phi(z)=0$ all lie outside the unit circle.


    *Proof:* See [Appendix 3A](#).


    Thus, $X_t$ in Equation 3.25 is an AR($p$) process if and only if $|\alpha_k|<1$,
    $k=1,\ldots,p$, since $\alpha_k$ is the reciprocal of the $k$th root of the characteristic
    equation. From Equation 3.26, it is also clear that in this case, $X_t$ is a general
    linear process.


