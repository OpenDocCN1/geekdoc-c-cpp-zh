    & \frac{1}{1-\theta_1^2}\end{bmatrix},$$


    so that


    $$\sigma_a^2\Gamma^{-1}=\frac{1-\phi_1\theta_1}{(\phi_1-\theta_1)^2}\begin{pmatrix}(1-\phi_1^2)(1-\phi_1\theta_1)
    & -(1-\phi_1^2)(1-\theta_1^2)\\-(1-\phi_1^2)(1-\theta_1^2) & (1-\theta_1^2)(1-\phi_1\theta_1)\end{pmatrix}.\tag{7.67}$$


