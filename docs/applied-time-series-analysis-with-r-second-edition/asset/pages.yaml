    # 8.3.5 More on the Identification of Nonstationary Components


    In the preceding discussion concerning identification of nonstationary components
    in the model, we focused on nonstationary factors such as $1 - \phi_1 B + B^2$.
    In practice, we may encounter variations of these two types of nonstationarities.
    For example, the model may need to include one or more nonstationary factors of
    each type. We discuss techniques for modeling nonstationary data in the following.


    # 8.3.5.1 Including a Factor $(1 - B)^d$ in the Model


    In Figure 8.6a, we show a realization (fig8.6a in tswge) from the model


    $(1 - B)^2(1 - 1.2B + 0.6B^2)X_t = a_t,$


    (8.21)


