  md: '# 7.2.2.2 MA(q) Estimation Using the Innovations Algorithm


    Another approach to obtaining preliminary estimates of the MA parameters involves
    use of the innovations algorithm (see Brockwell and Davis, 1991). For a stationary
    process, $X_t$, let $\hat{X}_m(1)$ denote the best one-step ahead predictor of
    $X_{m+1}$ given data $X_1$, ..., $X_m$. These predictors can be shown to follow
    the relationship


    $\hat{X}_n(1)=0\quad\text{if }n=0$  (7.25)

    $\quad=\sum_{j=1}^{n}\theta_{n|j}\bigl(X_{n+1-j}-\hat{X}_{n-j}(1)\bigr),\quad\text{if
    }n=1,2,\dots$


    for some constants $\theta_{n|j}$, $j=1,2,\dots,n$. (see Brockwell and Davis,
    1991, 2002). That is, the one-step ahead predictor is expressed as a linear combination
    of the prediction errors (innovations) $\hat{a}_{k+1}=X_{k+1}-\hat{X}(1)$. The
    estimated coefficients $\hat{\theta}_{m1},\dots,\hat{\theta}_{mm}$ and white noise
    variance $\hat{v}_m$, $m=1,2,\dots$ are calculated recursively as follows:


    $\hat{v}_0=\hat{\gamma}_0$


    $\hat{\theta}_{m,m-k}=\hat{v}_{k}^{-1}\left\{\sum_{j=0}^{k-1}\hat{\theta}_{m,m-j}\hat{\theta}_{k,k-j}\hat{v}_j-\hat{\gamma}_{m-k}\right\}$,


    for $k=0,1,\dots,m-1$ and


    $\hat{v}_m=\hat{\gamma}_0-\sum_{j=0}^{m-1}\hat{\theta}_{m,m-j}^2\hat{v}_j.$


    The innovations algorithm can be used to fit MA models such as


    $X_t = a_t - \hat{\theta}_{m1}a_{t-1} - \cdots - \hat{\theta}_{mm}a_{t-m}$,


