    # EXAMPLE 3.22: A PURELY SEASONAL STATIONARY MODEL


    In this example, we consider the model


    $(1 - 0.8 B^4) X_t = a_t, \qquad (3.125)$


    in more detail. Note that Equation 3.125 is an AR(4) model with the coefficients
    $\phi_1 = \phi_2 = \phi_3 = 0$ and $\phi_4 = 0.8$ However, it is also a seasonal
    model with $s = 4$ and $P_s = 1$, that is, as a seasonal model it is first order.
    In order to examine the nature of the model in Equation 3.125, we generate a realization
    of length $n = 20$, which we interpret to be quarterly data for a 5-year period.
    The realization along with the true autocorrelations and AR-spectral density is
    shown in Figure 3.28. In Figure 3.28a, the vertical lines break the realization
    into years, and it can be seen that there is a strong correlation between a particular
    quarter and that same quarter the next year. For example, quarters 1, 3, and 4
    are typically relatively high while in each year quarter 2 shows a dip. The autocorrelations
    vividly illustrate the sense in which the model describes seasonal (in this case
    quarterly) behavior. In Figure 3.28b, it is seen that the only nonzero autocorrelations
    are at lags that are multiples of four. For example, there is no correlation between
    adjacent months. The plot of autocorrelations also illustrates the first-order
    seasonal nature of the model since the autocorrelations at lags that are multiples
    of four damp exponentially. The spectral density in Figure 3.28c shows peaks at
    frequencies 0, 0.25, and 0.5. This behavior is also illustrated in the factor
    table in Table 3.8 where it can also be seen that Equation 3.125 is a stationary
    model since all of the roots of the characteristic equation are outside the unit
    circle.'
