- pgno: 616
  md: 'statistical time series analysis of nonstationary data. Wavelets provide an
    alternative to the window methods for investigating frequency behavior that changes
    across time. Wavelet analysis is a relatively recent methodology developed primarily
    in the mathematical sciences and engineering, and it has proved to be a powerful
    tool for the analysis of localized behavior of data whose characteristics change
    with time. These methods can be viewed as variations of classical Fourier analysis
    in which short waves (or “wavelets”) are used in place of the classical sines
    and cosines.


    # 12.3.1 Fourier Series Background


    In order to fully appreciate wavelet methods, it is necessary to have some familiarity
    with the classical Fourier methods of which wavelet analysis is an extension.
    For a brief review of Fourier series methods, see [Appendix 12A](#).


    As discussed in [Section 1.5](#) and [Appendix 12A](#), Fourier analysis involves
    expressing functions as linear combination of sines and cosines. Theorem 12A.1
    states that a well-behaved function, $g$, defined on $[-\pi,\pi]$ can be expressed
    as a linear combination of the *basis functions* in the orthogonal systems $S_1=\{1,\cos
    kx,\sin kx;\ k=1,2,\ldots\}$ or equivalently of $S_2=\{e^{ikx},\ k=0,\pm1,\pm2,\ldots\}$.
    The advantage of using $S_2$ is that the basis functions actually consist of one
    “fundamental” function, namely, $\varphi(x)=e^{ix}$, and the individual basis
    functions are “integral dilations” of this function, that is, $e^{ikx}=\varphi(kx)$.
    Note that as $k$ increases, the function $\varphi(kx)=\cos(kx)+i\sin(kx)$ becomes
    increasingly higher frequency, that is, the integer $k$ controls the frequency
    content in the basis function $\varphi(kx)$. Fourier analysis is based on the
    fact that when certain conditions hold, functions can be written as a linear combination
    of dilations of the single function $e^{ix}$, see [Appendix 12A](#). In wavelet
    analysis, functions, $\psi(x)$, will be defined that play a fundamental role such
    as that played by $\varphi(x)=e^{ikx}$ in Fourier analysis.


    # 12.3.2 Wavelet Analysis Introduction


    Suppose that $g$ is square integrable over the real line, that is, that $\int_{-\infty}^{\infty}|g(x)|^2dx<\infty$.
    The class of such functions is denoted $L^2(\mathbb{R})$ where $\mathbb{R}=(-\infty,\infty)$.
    We desire a collection of basis functions (which are all'
