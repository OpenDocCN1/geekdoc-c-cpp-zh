    $$\sigma_a^2\mathbf{\Gamma}^{-1}=\begin{bmatrix}1-\theta_2^2 & -\theta_1(1+\theta_2)\\
    -\theta_1(1+\theta_2) & 1-\theta_2^2\end{bmatrix}.\tag{7.65}$$


    As in the AR(2) case, it can be seen from the diagonal elements in Equation 7.65
    that, asymptotically, $\hat{\theta}_1$ is distributed as a normal random variable
    with mean $\theta_1$ and variance $(1-\theta_2^2)/n$ while $\hat{\theta}_2$ has
    mean $\theta_2$ and the same asymptotic variance as $\hat{\theta}_1$


    # EXAMPLE 7.7: ASYMPTOTIC DISTRIBUTIONS FOR AN ARMA(1,1) MODEL


    Consider the ARMA(1,1) model


    $$(1-\phi_1 B)X_t=(1-\theta_1 B)a_t.\tag{7.66}$$


    In this case, each of the submatrices in Equation 7.64 is $1\times1$, and $\mathbf{\Gamma}$
    is given by


    $$\mathbf{\Gamma}=\begin{bmatrix}\gamma_{\mathcal{U}}(0) & \gamma_{\mathcal{U}V}(0)\\
    \gamma_{\mathcal{U}V}(0) & \gamma_{V}(0)\end{bmatrix}$$


    where $\gamma_{\mathcal{U}}=\sigma_a^2/(1-\phi_1^2)$ and $\gamma_V(0)=\sigma_a^2/(1-\theta_1^2)$.
    Now,


    $$\gamma_{\mathcal{U}V}(0)=E[\mathcal{U}_t V_t]=E[(\phi_1\mathcal{U}_{t-1}+a_t)(\theta_1
    V_{t-1}+a_t)]=\phi_1\theta_1E[\mathcal{U}_{t-1}V_{t-1}]+\theta_1E[V_{t-1}a_t]+\phi_1E[\mathcal{U}_{t-1}a_t]+\sigma_a^2,$$


    so that $$\gamma_{\mathcal{U}V}(0)=\phi_1\theta_1\gamma_{\mathcal{U}V}(0)+\sigma_a^2,$$
    and $\gamma_{\mathcal{U}V}(0)$ is given by $$\gamma_{\mathcal{U}V}(0)=\frac{\sigma_a^2}{1-\phi_1\theta_1}.$$'
