    # ### 3.2.9 AR(p) Model


    The general behavior of the autocorrelation function (and to a large degree the
    time series itself) of an AR($p$) model can be understood by examining the roots
    of the characteristic equation. The information summarized earlier for the AR(1)
    and AR(2) models provides valuable information concerning the characteristics
    of higher-order AR($p$) models. We begin our discussion of AR($p$) models by considering
    two examples.


    # **EXAMPLE 3.8: AN AR(3) MODEL WITH A POSITIVE REAL ROOT AND COMPLEX CONJUGATE
    ROOTS**


    Consider the AR(3) model


    $X_t - 2.55X_{t-1} + 2.42X_{t-2} - 0.855X_{t-3} = a_t.$  (3.73)


    For this model, the characteristic polynomial $1 - 2.55z + 2.42z^2 - 0.855z^3$
    can be factored as $(1 - 0.95z)(1 - 1.6z + 0.9z^2)$, that is, as the product of
    a linear factor and an irreducible quadratic factor. From this factorization,
    it follows that the roots of the characteristic equation are $r_1 = 1/0.95 = 1.05$
    along with the pair of complex conjugate roots $0.89 \pm 0.57i$. For each of the
    three roots of the characteristics equation, we have $|r^{-1}| = \sqrt{0.9}$.
    Based on the factorization of the characteristic equation, it is often useful
    to write the model in [Equation 3.73](#) in the factored form


    (3.74)'
