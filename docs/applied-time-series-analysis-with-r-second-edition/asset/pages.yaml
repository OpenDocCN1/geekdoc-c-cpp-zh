    Realizations of length $n=200$ from **Equation 3.70** are shown in **Figure 3.13**,
    where the effects of the differing autocorrelation structures can be seen. Specifically,
    as $\phi_2\to-1$ the periodicity becomes much more apparent in the realizations,
    the period becomes shorter, and the process variance increases. In **Figure 3.14**,
    the corresponding spectral densities are displayed where it is seen that as $\phi_2\to-1$,
    the peak of the spectral density becomes sharper.


    As discussed previously, the characteristic equation associated with the AR(2)
    process $(1-\phi_1B-\phi_2B^2)X_t=a_t$ has complex roots if and only if $\phi_1^2+4\phi_2<0$.
    Therefore, it is necessary that $\phi_2<0$ in order for the process to have a
    characteristic equation with complex roots. Moreover, for negative $\phi_2$, since
    $\phi_2=-(a^2+b^2)^{-1}$, the process is nonstationary with roots on the unit
    circle if and only if $\phi_2=-1$. The behavior shown in this example as roots
    approach the unit circle is typical.'
