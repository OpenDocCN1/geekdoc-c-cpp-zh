  md: 'The Haar wavelets have compact support because they are equal to zero outside
    the closed bounded interval [2^j k, 2^j(k+1)]. Specifically,


    ψ_{j,k}(x) = 2^{-j/2},      2^j k ≤ x < 2^j(k+0.5)      (12.14)

    = -2^{-j/2},  2^j(k+0.5) ≤ x < 2^j(k+1)

    = 0,          otherwise.


    From Equation 12.14 it follows that the support of ψ_{j,k} is of length 2^j(k+1)
    − 2^j k = 2^j. Dilates and translates of a wavelet are designed to describe localized
    frequency behavior. Thus, the wavelet ψ_{j,k} describes localized behavior related
    to pseudocyclic or detail behavior of duration (or “period”) about 2^j for x in
    the neighborhood of 2^j(k+0.5). The support of the Haar wavelet ψ_{j,k} is also
    called the scale of the wavelet. In general the scale of a wavelet is a measure
    of its width.


    *A note about frequencies:* It is important to note that since we are not using
    sines and cosines as the basis elements, the strict interpretation of frequency
    is no longer valid. Since scale is a measure of the “period” of a wavelet we use
    “1/scale” as a measure of “frequency.”


