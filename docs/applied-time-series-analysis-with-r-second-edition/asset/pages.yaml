    # 12.3.7 Wavelet Shrinkage


    Smoothing techniques have been widely used for extracting the underlying signal
    from a data set containing a signal buried in noise. The low-pass filters discussed
    in Section 2.4 are often used for this purpose. Nonparametric statistical methods
    such as regression and smoothing splines, kernel smoothers, and generalized additive
    models have become quite popular for signal extraction. See, for example, Wahba
    (1990), Hastie and Tibshirani (1990), Eubank (1999), Green and Silverman (1993),
    and Hart (1997).


    To illustrate wavelet-based smoothing, refer back to the discussion in Example
    12.4 concerning the bumps DWT representations of the bumps and noisy bumps signal.
    Starting with the noisy bumps signal (bumps signal plus additive noise) shown
    in the upper right panel of Figure 12.8, it seems reasonable that the true bumps
    signal would be well approximated by eliminating the nearly zero'
