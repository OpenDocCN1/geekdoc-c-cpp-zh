    \hat{X}_{t+h-1}^{t-1} = F^{h-1} \hat{X}_{t}^{t-1} . (10.59)


    In this example, we illustrate the concepts of predicting, filtering, and smoothing
    using the data in Figure 10.11. In Example 10.9, it was seen that the series X_t
