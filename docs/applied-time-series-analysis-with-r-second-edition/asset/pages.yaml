- pgno: 256
  md: 'plus-noise models are quite restrictive, and they should only be considered
    if there are physical reasons to believe that a deterministic signal is present.


    # 5.1.1 Trend-Component Models


    In this section, we consider the model


    $X_t = a + b t + Z_t$ (5.2)


    where $a$ and $b$ are real constants and $Z_t$ is a zero-mean AR($p$) process.


    Clearly, $X_t$ is nonstationary if $b \neq 0$, since the mean of $X_t$ is $\mu_t
    = a + b t$, which depends on $t$ whenever $b \neq 0$. It can be easily shown that
    Var $(X_t) = \sigma_Z^2$, which is constant and finite, and that the autocovariance
    $\gamma(t_1, t_2)$ only depends on $t_2 - t_1$ because $Z_t$ is stationary. A
    model, such as the one in Equation 5.2, is often fit to data by first estimating
    $a$ and $b$ and then analyzing the residuals $\hat Z_t = X_t - \hat a - \hat b
    t$ as a stationary process. Of course, polynomial trends or other types of trends
    could be considered, but these will not be discussed here (see Woodward and Gray,
    1995).


    If the goal of the analysis of a particular time series is to determine whether
    there is a deterministic linear trend, a common practice is to fit a model such
    as Equation 5.2 and test the null hypothesis $H_0 : b = 0$. As an example, for
    the global temperature data (see Figure 1.24a), we might ask the question whether
    the observed increase in temperatures over the past 160 years should be predicted
    to continue. If $Z_t$ is uncorrelated white noise, then the testing of $H_0 :
    b = 0$ is routinely accomplished using the results of simple linear regression.
    However, the uncorrelated errors are a key assumption for this type of regression
    analysis and, as a consequence, standard regression methods should not be used
    in the presence of correlated errors. We will discuss the topic of trend testing
    in time series data in Section 9.3. This is a difficult problem, and as Example
    5.1 shows, certain stationary time series models without a trend component can
    produce realizations with trending behavior.


    # EXAMPLE 5.1: GLOBAL TEMPERATURE DATA


    To emphasize the issues involved in testing for trend, we consider modeling the
    global temperature data shown previously in Figure 1.24a. An AR(4) model fit to
    the global temperature series is'
