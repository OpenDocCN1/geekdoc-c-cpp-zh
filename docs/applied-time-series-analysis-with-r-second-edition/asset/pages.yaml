  md: '# 7.8 ARUMA Spectral Estimation


    ARUMA(p,d,q) models, such as


    $(1 - B)(1 + B^2)(1 - B + 0.8B^2)X_t = a,$

    (7.75)


    have spectral densities with infinite spikes, in this case, at $f = 0$ and $f
    = 0.25$. In practice, if an ARUMA model such as in Equation 7.75 is fit to a set
    of data, then we recommend plotting the ARUMA spectral density estimates by plotting
    ARMA spectral density estimates of related near-nonstationary models. In this
    case, we could plot the true spectral density associated with


    $(1 - 0.995B)(1 + 0.99B^2)(1 - B + 0.8B^2)X_t = a_t.$

    (7.76)


    Note that the coefficients were selected, so that all three near-nonstationary
    roots are equally close to the unit circle. In this case, the roots are 1.005
    and $\pm1.005i$. Figure 7.4 shows an approximate ARUMA(2,3,0) spectral density
    estimate associated with the model fit in Equation 7.75. The sharp peaks at $f
    = 0$ and $f = 0.25$ represent the infinite peaks at those frequencies.

    **NOTE:** Techniques for fitting ARUMA(p,d,q) models to data will be discussed
    in Section 8.3.


    **Using R:** The approximate ARUMA(2,3,0) spectral density estimate shown in Figure
    7.4, which is based on the AR(5) model in Equation 7.76, can be obtained using
    the tswge functions true.arma.spec.wge and plotts.true.wge as mentioned above.


