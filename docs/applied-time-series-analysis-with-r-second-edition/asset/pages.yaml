  md: 'discussed in Section 1.4 that $\hat{\gamma}''_k$ is positive semidefinite while
    $\tilde{\gamma}_k$ is not.


    Before finishing this section, we note that the YW estimates are method-of-moment
    (MM) estimates of $\phi_1$, ..., $\phi_p$ since they are obtained by equating
    sample autocorrelations to theoretical autocorrelations and solving the resulting
    equations. MM estimates of $\mu$ and $\sigma_X^2$ are given by $\hat{\mu} = \overline{X}$
    and $\hat{\sigma}_X^2 = \hat{\gamma}''_0$. For AR(p) models, Equation 3.45 shows
    that


    $\sigma_a^2 = \sigma_X^2 (1 - \phi_1 \rho_1 - \cdots - \phi_p \rho_p)$


    from which it follows that the MM estimator of $\sigma_a^2$ is


    $\hat{\sigma}_a^2 = \hat{\sigma}_X^2 (1 - \hat{\phi}_1 \hat{\rho}_1 - \cdots -
    \hat{\phi}_p \hat{\rho}_p).$ (7.10)


