    # ## 1.5 Power Spectrum


    In [Sections 1.1 through 1.4](#), we have discussed and described time series
    in terms of their realizations, mean, variance, and autocorrelations. These are
    all aspects of a time domain analysis of time series. It is often important to
    examine time series realizations and models from the perspective of their cyclic
    (or frequency) content. This type of analysis is commonplace in engineering curriculum,
    but, for statistics students taking their first time series course, this will
    likely be the first introduction to the frequency domain.


    In 1807, Joseph Fourier astounded his contemporaries by showing that a very broad
    class of functions *f(x)* could be written as a linear combination of sines and
    cosines. This finding led to the incredibly useful field of Fourier analysis,
    in which mathematicians and scientists have worked to develop an understanding
    of the fundamental properties of signals by breaking them into sums of'
