  md: 'behavior. For example, in the discussion following Equation 12.14 we noted
    that the Haar wavelet, $\psi_{j,k}$, is associated with behavior in the neighborhood
    of $t = 2^{l}(k + 0.5)$ with a duration of about $2^{l}$. Thus, larger values
    of $|d_{j,k}|$ are associated with time periods in which the data display some
    sort of “cyclic-type” behavior, called *detail* behavior, with a duration of about
    $2^{l}$. The $d_{j,k}$’s are referred to as *detail coefficients*. Small values
    of $j$ are associated with finer detail, that is, they describe more localized
    behavior, while the larger values of $j$ are associated with coarser detail behavior
    (i.e., longer-span behavior).


    The partitioning in Equation 12.31 is referred to as a *multiresolution decomposition*
    (MRD). In the case $J_0 = 4$ (i.e., $n = 16$) considered in Example 12.3 which
    follows, this decomposition becomes


    $$x_t = D_1(t) + D_2(t) + D_3(t) + D_4(t) + S_4(t),$$


    where the coefficients needed for $D_j(t),\; j = 1, \dots, 4$ are obtained in
    the $j$th step of the pyramid algorithm. If the pyramid algorithm is terminated
    at Step 3, then 16 coefficients $d_{1,k}, k = 1, \dots, 8$; $d_{2,k}, k = 1, \dots,
    4$; $d_{3,k}, k = 1, 2$; and $s_{3,k}, k = 1, 2$ have been calculated. Letting
    $S_2(t) = D_3(t) + S_3(t)$, it follows that $x_t$ can be written as $x_t = D_1(t)
    + D_2(t) + S_2(t)$, and the coefficients needed for the term $S_2(t)$ are $s_{2,k},
    k = 1, 2$ which were obtained in the second step of the pyramid algorithm. In
    general, for $n = 2^{J_0}$ and where $J$ is an integer such that $J \le J_0$,
    the decomposition in Equation 12.31 can be expressed as


    $$x_t = D_1(t) + D_2(t) + \cdots + D_J(t) + S_J(t),$$


    which can in turn be written as


    $$x_t = D_1(t) + D_2(t) + \cdots + D_{J-1}(t) + S_{J-1}(t),\tag{12.32}$$


    where $S_{J-1}(t) = D_J(t) + S_J(t)$. Letting $\mathbf{x}$, $\mathbf{D}_j$, and
    $\mathbf{S}_j$ denote the $n$-component vectors that have $x_p$, $D_j(t)$, and
    $S_j(t)$ as the $t$th components, respectively, then from Equation 12.32 it follows
    that


    $$\begin{aligned}

    \mathbf{x} &= \mathbf{D}_1 + \mathbf{D}_2 + \cdots + \mathbf{D}_J + \mathbf{S}_J
    \\

    &= \mathbf{D}_1 + \mathbf{D}_2 + \cdots + \mathbf{D}_{J-1} + \mathbf{S}_{J-1},

    \end{aligned}\tag{12.33}$$


    where $\mathbf{S}_{J-1} = \mathbf{D}_J + \mathbf{S}_J$. Successively applying
    Equation 12.33 we obtain'
