    # Definition 3.4


    If an MA(q) process X_t can be expressed as in Equation 3.83 with ∑_{j=0}^{∞}
    |π_j| < ∞, then X_t is said to be invertible.


    The condition ∑_{j=0}^{∞} |π_j| < ∞ assures that ∑_{j=0}^{∞} π_j X_{t-j} is mean
    square convergent (see Theorem 3.1). The following theorem provides necessary
    and sufficient conditions for an MA(q) process to be invertible.


    # Theorem 3.3


    Let X_t be the MA(q) process X_t = θ(B) a_t. Then X_t is invertible if and only
    if the roots of θ(z) = 0 all lie outside the unit circle.


    *Proof:* See Appendix 3B.


    In order to determine whether or not a given MA(q) process is invertible, we recommend
    examining a factor table in which the factors of θ(B) are given.


    **Using R:** Factor tables for MA components can be obtained as in the AR case
    by using the tswge function factor.wge. See Appendix 3B.


