  md: '# 5


    # Nonstationary Time Series Models


    In Chapters 3 and 4, we considered stationary processes. However, many or even
    most processes of interest tend to have some type of nonstationary or near-nonstationary
    behavior. Referring to the definition of stationarity in Definition 1.5, a process
    can be nonstationary by having (1) a nonconstant mean, (2) a nonconstant or infinite
    variance, or (3) an autocorrelation function that depends on time. The processes
    we discuss in this chapter will have one or more of these properties. In Chapters
    12 and 13, we discuss techniques for analyzing time series having property (3).
    In this chapter, we will discuss the following:


    +   - Deterministic signal-plus-noise models

    +   - ARIMA, ARUMA, and nonstationary multiplicative seasonal models

    +   - Random walk models with and without drift

    +   - Time-varying frequency (TVF) models (or time-varying autocorrelation [TVA]
    models)


    # 5.1 Deterministic Signal-Plus-Noise Models


    In this section, we consider models of the form


    $X_t = s_t + Z_t$


    where $s_t$ is a deterministic signal and $Z_t$ is a zero-mean stationary noise
    component that may or may not be uncorrelated.


    In this book, we will model $Z_t$ in such models using an AR($p$) model although
    other models (e.g. ARMA($p,q$)) could be used. We consider two types of signals:
    (a) “trend” signals, such as $s_t = a + b t$ or $s_t = a + b_1 t + b_2 t^2$, ...,
    and (b) harmonic signals, such as $s_t = C\cos(2\pi f t + U)$. We emphasize that
    signal-'
