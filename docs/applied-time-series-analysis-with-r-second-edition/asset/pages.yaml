  md: 'design our filter, so that


    |H(e^{-2π i f})|^2 = 1,      f ≤ 0.2

    = 0,      f > 0.2

    (2.10)


    since according to Theorem 2.2, this would eliminate frequency behavior from the
    spectrum of the output for f > 0.2 and leave it unchanged for f ≤ 0.2. Figure
    2.1a shows the squared frequency response for this ideal (brickwall) filter, and
    Figure 2.1b shows the ideal squared frequency response for a band-pass filter
    that passes through frequencies 0.1 ≤ f ≤ 0.2.


    # EXAMPLE 2.1: FIRST DIFFERENCE FILTER


    Consider a time series realization x_t, t = 1, ..., n, and suppose we compute
    the first difference y_t = x_t - x_{t-1}. In order to see the effect of this differencing
    operation, we note that the first difference is a linear filter of the form in
    Equation 2.1 where h0 = 1, h1 = -1, and h_j = 0, j ≠ 0 or 1. We can thus calculate
    H(e^{-2π i f}) = 1 - cos 2π f + i sin 2π f and |H(e^{-2π i f})|^2 = 2(1 - cos
    2π f). The plot of |H(e^{-2π i f})|^2 is given in Figure 2.2b where it can be
    seen that a difference is a high-pass filter, but that it is not a sharp filter
    in that it allows some low-frequency behavior to leak through. In Figure 2.2a,
    we show the realization previously shown in Figure 1.3a, which shows a wandering
    behavior associated with low-frequency behavior, along with some higher frequency
    oscillation. The first difference data are shown in Figure 2.2c where it can be
    seen that the low-frequency wandering behavior has been removed with only the
    higher frequency behavior remaining. The first difference is widely used in time
    series analysis, but if the goal is to remove a specific range of low frequencies
    from the data, there are better approaches.'
