  md: '# 6

    # Forecasting


    In this chapter, we discuss techniques for forecasting the future behavior of
    a time series, given present and past values. ARMA and ARUMA models are popular
    tools for obtaining such forecasts. Forecasts found using ARMA and ARUMA models
    differ from forecasts based on curve fitting in a fundamental way. Given a realization,
    such as the sunspot data in **Figure 1.23a**, one might forecast into the future
    based on a mathematical curve fit to the data, that is, based on the underlying
    assumption that future behavior follows some deterministic path with only random
    fluctuations. However, for data, such as the sunspot data, it is unlikely that
    the use of such a deterministic function for forecasting is a reasonable approach.
    On the other hand, the ARMA and ARUMA forecasting techniques to be discussed in
    this chapter are based on the assumption that the transition to the future is
    guided by its correlation to the past. When there is no physical model for connecting
    the past with the future, the correlation-based approach seems reasonable.


    # *The forecasting or prediction problem:*


    The basic problem that we initially address is that of finding an “optimal” predictor
    for $X_{t_0+\ell}$ given observations $X_1,\ldots,X_{t_0}$ from a known ARMA model.
    We use the notation:


    +   - $\widetilde{X}_{t_0}(\ell)$ is a predictor of $X_{t_0+\ell}$ given data
    up to $X_{t_0}$.

    +   - $t_0$ is referred to as the *forecast origin* (in most cases $t_0$ is the
    “present” time).

    +   - $\ell$ is the lead time, that is, the number of time units (*steps ahead*)
    into the future to be forecast.


    The “best” or “optimal” predictor will be in the mean-square sense. That is, we
    will search for a predictor, $\widetilde{X}_{t_0}(\ell)$, of $X_{t_0+\ell}$ that
    minimizes'
