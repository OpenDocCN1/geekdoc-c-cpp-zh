- pgno: 404
  md: 'data by differencing. If the differenced data indicate continued evidence of
    a unit root of +1, then the Box–Jenkins procedure is to difference again, etc.,
    until stationarity is achieved. We present an easy method for inspecting a model
    for unit roots or near unit roots anywhere on the unit circle. We refer to this
    method as overfitting, and it is based on the following result given by Tiao and
    Tsay (1983).


    # Theorem 8.1 (Tiao–Tsay Theorem)


    If $X_t$ is ARUMA$(p,d,q)$, that is, $\phi(B)\lambda(B)(X_t - \mu) = \theta(B)a_t$,
    then the model obtained using ordinary least squares (OLS) estimates of an AR$(d
    + j)$, $j > 0$ fit to the data can be factored as $\hat\phi_{d+j}(B) = \hat\phi_d(B)\hat\phi_j(B)$,
    where $\hat\phi_d(B)$ is a consistent estimator of $\lambda(B)$.


    The implication of the Tiao–Tsay Theorem (Theorem 8.1) is that if a “high-order”
    AR model is fit to data from an ARUMA$(p,d,q)$ model, then the features of the
    model associated with the roots on the unit circle will be well estimated in the
    “overfit” model. Gray and Woodward (1986, 1987) demonstrated the application of
    Theorem 8.1 for identifying nonstationarities using Burg estimates instead of
    OLS estimates. The procedure recommended here is to successively overfit data
    with AR$(k)$ models. The factored forms of the resulting models are examined for
    near-nonstationary factors that tend to show in each of the overfit AR models.
    This procedure is illustrated in Example 8.4.


    # EXAMPLE 8.4: IDENTIFYING NONSTATIONARITIES USING OVERFITTING


    +   1. Figure 8.3a shows a realization of length $n = 200$ (previously shown in
    Figure 5.3c and available as data set `fig5.3c` in tswge) from the near-nonstationary
    AR(3) model


    $(1 - 0.995B)(1 - 1.2B + 0.8B^2)X_t = (1 - 2.195B + 1.994B^2 - 0.796B^3)X_t =
    a_t,$ (8.12)'
