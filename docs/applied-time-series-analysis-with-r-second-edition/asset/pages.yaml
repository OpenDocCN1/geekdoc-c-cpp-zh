    is worth noting that the YW estimates can be quite poor in practice when some
    roots of the characteristic equation are very near the unit circle or when there
    are repeated roots. Consider, for example, the AR(3) model


    $$(1 - 0.995B)(1 - 1.2B + 0.8B^2)X_t = a_t,\tag{7.52}$$


    in Equation 5.12 which has a positive real root very close to the unit circle
    ($\left| r_1^{-1} \right| = 0.995$) and complex conjugate roots that are further
    from the unit circle $\left| r_i^{-1} \right| = \sqrt{0.8}=0.89$. Figure 5.2c
    shows that the autocorrelation function for this model approximates the damped
    exponential behavior of a first-order process, and, in Section 5.2, we discussed
    the fact that the (limiting) autocorrelations satisfy a first-order difference
    equation. As a consequence, the third-order theoretical YW equations associated
    with Equation 7.52 are a near singular system, and the use of sample autocorrelations
    in these equations will tend to reflect the weakened effect of the second-order
    behavior. In Tables 7.6 and 7.7, we will see that the YW estimates based on a
    realization from this model are quite poor while the Burg estimates are much more
    stable. This is a common pattern for such models, and, for this reason, it is
    preferable to use the ML or Burg estimates. In Example 7.5, we use Equation 7.50
