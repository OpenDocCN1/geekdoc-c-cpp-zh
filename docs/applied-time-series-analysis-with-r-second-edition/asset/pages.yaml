- pgno: 392
  md: '# 8

    Model Identification


    In Chapter 7, we discussed the problem of estimating the parameters of a given
    ARMA(p,q) process assuming that the model orders p and q are known. The procedure
    for finding an appropriate model actually begins with the intriguing and sometimes
    challenging problem of determining the number of parameters that should be estimated.
    In this chapter, we consider the problem of identifying the model orders p and
    q of a stationary ARMA(p,q) model as well as p, d, and q for the nonstationary
    ARUMA(p,d,q) model, and the model orders associated with a multiplicative seasonal
    model. Since there is realistically not a “true ARMA model” for a real process,
    our goal will be to find a model that adequately describes the process but does
    not contain unnecessary parameters. Tukey (1961) refers to such a model as being
    *parsimonious*.


    # 8.1 Preliminary Check for White Noise


    In searching for a parsimonious model, the investigation should begin with a decision
    concerning whether or not the process can be adequately modeled using the simplest
    of all ARMA models, white noise. Unnecessarily complicated models can be obtained
    by the careless analyst for processes that should have been modeled as white noise
    in the first place. Several techniques are available for testing for white noise,
    and we will address this problem further in Section 9.1 when we discuss the examination
    of residuals from a fitted model (which should essentially be white noise if the
    model is appropriate).


    At this point, we focus on checking for white noise by examining the realizations
    and sample autocorrelations. The first advice we give in this context is that
    *you should always first examine a plot of the data!* The failure to realize that
    a set of time series data should be modeled as white noise or to notice other'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'very basic characteristics is often the result of having failed to plot the
    data. In Figures 1.3b, 1.4b, and 1.9b, we showed a realization, the true autocorrelations,
    and the sample autocorrelations from a white noise model. There is no noticeable
    cyclic or trending behavior in the data, and while the true autocorrelations for
    a white noise process have the property that $\rho_k = 0$ for $k \neq 0$, the
    sample autocorrelations will not be identically zero as is illustrated in Figure
    1.9b. Each of the sample autocorrelations $\hat{\rho}_k$, $k > 1$ in that figure
    estimates a quantity that is zero. In order to test $H_0$: $\rho_k = 0$, we first
    note that $\hat{\rho}_k$ is asymptotically unbiased for $\rho_k$ since $E[\hat{\rho}_k]
    \approx 0$ for $k \neq 0$ and realization length $n$ “large.” Additionally, $\hat{\rho}_k$
    is asymptotically normal (Brockwell and Davis, 1991). Recall also that if $X_t$
    is Gaussian white noise, then Bartlett’s approximations in Equations 1.21 and
    1.22 imply that


    $\text{Cov}(\hat{\rho}_k, \hat{\rho}_{k+r}) \approx 0, \quad r \neq 0,$


    and


    $\text{Var}(\hat{\rho}_k) \approx \frac{1}{n}, \quad k \neq 0.$


    Thus, if a given realization is from a white noise process, then the sample autocorrelations
    should be small and approximately uncorrelated at different lags. For a given
    $k$, it then follows that


    $|\hat{\rho}_k| > 2\left(\frac{1}{\sqrt{n}}\right), \tag{8.1}$


    provides evidence against the null hypothesis of white noise at approximately
    the $\alpha = 0.05$ level of significance (where we have rounded $z_{0.975} =
    1.96$ to 2). It should be noted that the significance level $\alpha = 0.05$ applies
    separately for each $k$, and it would not be unusual for about 5% of the $\hat{\rho}_k$
    to exceed $2(1/\sqrt{n})$ when the data are white noise. As a result, this “test”
    is actually more of an informal guide for determining whether or not the data
    should be modeled as white noise. It should be noted, however, that many alternatives
    of interest, that is, an MA(q) model or an AR(p) model with roots relatively far
    removed from the unit circle, have nonzero autocorrelations at low lags followed
    by zero or near zero autocorrelations at higher lags. Thus, if the “nonzero” $\hat{\rho}_k$
    occur for small $k$, then'
