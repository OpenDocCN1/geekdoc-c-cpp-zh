    # EXAMPLE 13.11: SEISMIC DATA FROM EARTHQUAKES AND EXPLOSIONS


    In this example, we illustrate the point made earlier that a time transformation
    produces stable frequency behavior in the dual space that may provide a useful
    method of summarizing information in the original series. Woodward et al. (2007)
    examined the problem of distinguishing between earthquakes and explosions based
    on seismic monitoring. Seismic events such as earthquakes and explosions create
    a variety of waveforms that can be measured by seismographs. An extremely important
    area of research involves the use of seismic'
