    # EXERCISES


    13.1 Using tswge function gen.glambda.wge create a realization of length n = 256
    from the Euler(4) model


    X(h^k) -1.75X(h^{k-1}) +1.95X(h^{k-2}) -1.70X(h^{k-3}) +0.95(h^{k-4}) = a(t^k),


    with offset 60.


    +   a. What system frequencies should the dual data contain?

    +   b. Fit an Euler model to the generated data set by using function est.glambda.wge
    and specifying λ = 0. Choose 0:200 as the offset range and 12 as the maximum AR
    order.

    +   c. Using the output printed by the program, show and discuss plots of

    +     i. The data

    +     ii. The dual

    +     iii. The spectral density estimates of the original and dual data. These
    can be obtained by using either the Parzen spectral estimator (using parzen.wge)
    or the AR spectral estimator (using true.arma.spec.wge). Is there evidence that
    the expected system frequencies from (a) are present in the dual data?

    +     iv. The forecast performance of the Euler model versus the AR model fit
    to the original data (using fore.glambda.wge)

    +     v. The estimated instantaneous spectrum using is.glambda.wge

    +   d. Compute and plot the Wigner–Ville spectrum (using vw.wge) and compare it
    with the instantaneous spectrum in (c) part (v)


    13.2 The tswge data set prob13.2 contains a realization of length n = 256 from
    the M-stationary cosine-plus-noise process'
