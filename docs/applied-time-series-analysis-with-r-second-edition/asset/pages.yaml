  md: 'ARMA spectral estimators based on AR(p) fits are often called *AR spectral
    estimators*.


    The ARMA spectral density estimator has an inherent smoothness. By increasing
    the orders p and q of a model fit, the corresponding spectral density becomes
    less smooth, similar to the manner in which increasing the truncation point M
    in the spectral estimates in Chapter 1 produces spectral estimators that are less
    smooth. Thus, choosing orders p and q that are too low may produce estimators
    that lose important detail, while using orders that are too high can produce spectral
    estimators with spurious peaks. Thus, the choice of p and q (to be discussed in
    Chapter 8) is an important step in the modeling procedure.


    **Using R:** In tswge function `true.arma.spec.wge` you can specify a model and
    the function outputs a plot of the true (log) spectral density along with 251
    values of the spectral density and associated frequencies as part of the output.
    In order to obtain ARMA spectral estimates, you can use this function by entering
    the estimated coefficients as the “true model.” Function `plotts.true.wge` also
    outputs and plots the spectral density values.


    # EXAMPLE 7.12: ARMA SPECTRAL ESTIMATION


    +   1. *An AR(4) model:* In Figure 7.1a, we show the true spectral density, previously
    shown in Figure 3.18c for the AR(4) model that was previously discussed in Example
    7.9b. In this case, all of the estimation routines performed equally well, and
    Figure 7.1b shows the AR spectral estimator based on the ML estimates. In the
    figure, it is seen that the spectral density in Figure 7.1a is well estimated.
    Figure 7.1c and d shows spectral estimators based on AR(2) and AR(12) fits to
    the data using ML estimates. Figure 7.1c shows that an AR(2) fit to the data is
    inappropriate and that the frequency behavior associated with system frequencies
    f = 0 and f = 0.16 (see Table 3.3) is smeared together. The AR(12) spectral estimator
    in Figure 7.1d is much better than the one based on the AR(2) fit, but we see
    a small peak at around 0.38 that is in fact a spurious peak. This example illustrates
    the fact that a high-order fit will tend to show the dominant peaks along with
    spurious peaks that must be considered. One technique for ARMA spectral estimation
    is to fit a'
