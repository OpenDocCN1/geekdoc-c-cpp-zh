    $1.96 \hat{\sigma}_a \left\{ \sum_{k=0}^{2} \psi_k^2 \right\}^{1/2} = 1.96 \sqrt{.7497}
    (1 + 0.7^2 + 0.24^2)^{1/2}$

    $= 2.11.$


    We will present approximate prediction intervals obtained by replacing $\sigma_a$
