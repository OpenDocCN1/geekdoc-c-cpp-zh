    # Appendix 1B: R Commands


    As mentioned in the Preface you should install and load the R command library
    tswge. Some of the commands listed here are simply Base R commands that do not
    require the installation of a special library. These will be noted as Base R commands.
    R commands that perform the computations and plot results associated with topics
    covered in Chapter 1 fall into two categories:


    +   1. Basic computations and plots

    +   2. “Combination routines” that provide graphical output of related plots for
    pedagogical purposes


    For example, plot.sample.wge plots a realization, sample autocorrelations, periodogram,
    and smoothed periodogram based on the Parzen window. Examination of these four
    plots is a typical step in understanding the features of a time series realization.


    +   1. Basic Computation Routines for Chapter 1

    +      a. mean(x) (base R function): calculates the mean of a time series realization
    where x is a vector containing the time series realization $x_t$, $t = 1, ...,
    n$.

    +      Example: The basic R command

    +      data(ss08); ssm = mean(ss08)'
