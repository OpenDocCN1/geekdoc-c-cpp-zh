    is not immediately apparent. The equation in Equation 3.37 is an example of a
    linear homogenous difference equation with constant coefficients, which we briefly
    discuss here.


    A function, $g_k$, defined on a set of consecutive integers, $I$, is said to satisfy
    (or is a solution of) a linear homogeneous difference equation of order $m$ with
    constant coefficients, if $g_k$ is such that


    $g_k - b_1 g_{k-1} - \cdots - b_m g_{k-m} = 0,$

