- pgno: 260
  md: 'shown in Figure 3.15b where it can be seen that the asymmetry is largely removed.
    Figure 3.15c and d shows the sample autocorrelations and the Parzen spectral density
    estimate of the log-lynx data where the cyclic behavior of about 10 years is apparent
    in both plots. A feature to note about the sample autocorrelations is their slowly
    damping behavior.


    We used a simple AR(2) model for the log-lynx data in Example 3.7, but the AR
