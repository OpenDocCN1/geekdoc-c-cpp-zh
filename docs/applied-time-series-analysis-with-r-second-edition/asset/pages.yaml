    # 3.7.2 AR Transformations


    A second type of transformation, referred to here as an AR transformation, is
    also useful. Consider the AR(1) model


    (1 − 0.95B)X_t = a_t,


    and let Y_t be defined by


    Y_t = X_t − 0.95X_{t−1}

    = (1 − 0.95B)X_t. (3.131)


    It follows that Y_t is white noise since


    Y_t = (1 − 0.95B)X_{t−1}

    = a_t.


    Thus, the AR model itself can be viewed as a transformation to white noise or
    as a “whitening filter.” In fact, this is one of the primary applications of the
    AR model. Note that application of transformation in Equation 3.131 to a realization
    of length n produces a “new” realization of length n − 1 given by

    Y = X_2 − 0.95X_1

    Y_2 = X_3 − 0.95X_2

    ⋮

    Y_{n−1} = X_n − 0.95X_{n−1}.'
