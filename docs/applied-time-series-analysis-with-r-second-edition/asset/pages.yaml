    B + B², 1 + B² and 1 + √3 B + B². The two factors of 1 − B are represented by
    the factor 1 − 1.98B + 0.981B² which is very close to (1 − B)² = 1 − 2B + B².
    Note in Table 8.5 that this factor is associated with complex conjugate roots
    with the real part close to +1 and complex part close to zero. Additionally, the
