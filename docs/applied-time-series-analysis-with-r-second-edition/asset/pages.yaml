    # 6.7.2 Forecasting the Last k Values


    While forecasts into the future are of interest and forecast limits provide information
    about the actual range of values into which future values are likely to fall,
    their quality is difficult to assess until future observations are made. One technique
    for assessing the performance of the forecasts is to forecast from t0 = n − k
    where 0 < k < n. Using this technique you can assess how well your forecasts'
