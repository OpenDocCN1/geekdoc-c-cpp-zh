  md: 'In this section we focus on techniques for assessing the performance of the
    forecasts. We will consider two techniques: (a) using probability limits and (b)
    forecasting the last k data values.


    # 6.7.1 Probability Limits for Forecasts


    In the preceding sections, techniques were described for obtaining optimal forecasts
    of $X_{t_0+\ell}$ given information up to time $t_0$. In addition to finding the
    forecast $\hat{X}_{t_0}(\ell)$, it is also important to assess the uncertainty
    associated with the predictions.


    Recall from Equation 6.11 that the forecast error associated with the prediction
    of $X_{t_0+\ell}$, given data to time $t_0$, is given by


    $e_{t_0}(\ell) = X_{t_0+\ell} - \hat{X}_{t_0}(\ell)$

    $= \sum_{k=0}^{\ell-1} \psi_k a_{t_0+\ell-k},$


    where $\psi_0 = 1$. If the white noise is normal with zero mean and variance $\sigma_a^2$,
    then $e_{t_0}(\ell)$ is also normal, and from Equations 6.12 and 6.14, it follows
    that $e_{t_0}(\ell)$ has zero mean and variance:


    $\text{Var}\left[e_{t_0}(\ell)\right] = \sigma_a^2 \sum_{k=0}^{\ell-1} \psi_k^2.$

    (6.31)


    Thus


    $\frac{e_{t_0}(\ell)}{\sigma_a\left\{\sum_{k=0}^{\ell-1} \psi_k^2\right\}^{1/2}}
    \sim N(0, 1),$


    from which it follows that


    $\text{Prob}\left\{-z_{1-\alpha/2} \le \frac{X_{t_0+\ell} - \hat{X}_{t_0}(\ell)}{\sigma_a\left\{\sum_{k=0}^{\ell-1}
    \psi_k^2\right\}^{1/2}} \le z_{1-\alpha/2}\right\} = 1 - \alpha,$

    (6.32)'
