    Z_k. \tag{13.7}$


    Consequently, if $X(t)$ is a $p$th-order discrete Euler process, then its dual
    process is a discrete AR$(p)$. Choi et al. (2006) extend Definition 13.4 to the
    discrete Euler$(p, q)$ process.


    # 13.2.4 Time Transformation and Sampling


    It should be clear from Definition 13.3 that an M-stationary process requires
    sample values at unequally spaced points. This is true in general for G-stationary
    processes. Thus, finding a time transformation, $u = g(t)$, is equivalent to determining
    a sampling scheme such that $X(t_k) = X(g^{-1}(u_k)) = \mathcal{Y}_k$, where $\mathcal{Y}_k$
    is stationary. That is, $X(t)$ should be sampled at the points $t = t_k = g^{-1}(u_k)$.


    In the case of M-stationary processes, $t_k = h^{u_k}$ and $u_k = k \Delta$. Without
    loss of generality, we take $\Delta = 1$, that is, $t_k = h_k$ and $u_k = k$.


    In general, data will only be available at equally spaced points and may not necessarily
    be obtainable at the points $t_k$. This problem can be overcome by over-sampling
    or interpolation. By over-sampling, we indicate the situation in which data are
    sampled at sufficiently small increments in time so that the values of the realization
    are available at the $t_k$''s. If the data are available only at equally spaced
    points and the data cannot be sufficiently over-sampled, then interpolation and
    Kalman filter methods can be used to process the data properly.


