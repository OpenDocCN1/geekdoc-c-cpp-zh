- pgno: 617
  md: 'variations of a single fundamental function, $\psi(x)$ such that functions
    $g \in L^2(\mathbb{R})$ can be approximated arbitrarily closely using a finite
    linear combination of these basis elements. It should be noted that $\sin x$,
    $\cos x$, and $e^{ix}$ are not candidates for the desired basis functions since
    they are not in $L^2(\mathbb{R})$ themselves. In fact, a necessary condition for

    $$

    \int_{-\infty}^{\infty} |g(x)|^2\,dx < \infty

    $$

    is

    $$

    \lim_{|t|\to\infty}|g(t)|=0.

    $$

    That is, the basis functions must decay to zero as $|t|\to\infty$, so intuitively
    short waves or “wavelets” are needed. In the wavelet setting, it is common to
    use $\psi(2^{-j}x)$, where $j$ is an integer, as dilations of $\psi(x)$. That
    is, the integer $j$ controls the amount of damping in the basis function $\psi(e^{-kx})$
    similar to the way $k$ controls the frequency behavior in the basis function $\varphi(kx)$.
    Approximating functions $g$ that are defined over the entire real line would intuitively
    be difficult to accomplish simply using dilations of a single, quickly damping
    function. Thus, in wavelet analysis, we consider dilations and translations of
    the basis function for purposes of estimating localized frequency behavior. That
    is, given a function $\psi(x)$, we use as our basis collection the functions


    $$\psi_{j,k}(x)=2^{-j/2}\psi(2^{-j}x-k), \tag{12.9}$$


    where $j$ and $k$ are integers that are referred to as the *dilation index* and
    *translation index*, respectively. The function $\psi(x)$ is called the *mother
    wavelet* since it “gives birth” to the entire collection of basis elements.


