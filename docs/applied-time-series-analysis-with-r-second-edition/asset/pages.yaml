    The exact likelihood function in the ARMA(p,q) case can be expressed in terms
    of the innovations algorithm (see Brockwell and Davis, 1991) for calculating one-step
    ahead forecasts. The log-likelihood function can be written as


    $l(\phi, \theta, \sigma_a^2) = -\frac{n}{2}\ln(2\pi\sigma_a^2) - \frac{1}{2}\sum_{t=0}^{n-1}\ln(r_t)
    - \frac{\sigma_a^{-2}}{2}\sum_{t=1}^{n}\frac{(X_t - \hat{X}_{t-1}(1))^2}{r_{t-1}},
    \tag{7.43}$


    where, using the notation of Chapter 6, $\hat{X}_{t-1}(1)$ is the one-step ahead
    forecast for $X_t$ (using the $\phi''_j$s and $\theta''_j$s) and


    $r_t = \frac{E[X_{t+1} - \hat{X}_t(1)]}{\sigma_a^2}.$


    Taking the partial derivative of $l(\phi, \theta, \sigma_a^2)$ with respect to
    $\sigma_a^2$ results in


    $\hat{\sigma}_a^2 = \frac{1}{n}S_u(\hat{\phi}, \hat{\theta}), \tag{7.44}$


    where


    $S_u(\hat{\phi}, \hat{\theta}) = \sum_{t=1}^{n}\frac{(X_t - \hat{X}_{t}(1))^2}{r_{t-1}},$'
