    using the alternative representation. Before entering coefficients into a time
    series computer package or comparing formulas involving the $\theta$''s in different
    textbooks, it is very important to check the MA(q) definition.


    Notice that an MA(q) process is a general linear process with a finite number
    of terms. In particular


    $$\psi_0 = 1$$


    $$\psi_k = - \theta_k, \quad k = 1, 2, \dots, q$$


    $$\psi_k = 0, \quad k > q.$$


