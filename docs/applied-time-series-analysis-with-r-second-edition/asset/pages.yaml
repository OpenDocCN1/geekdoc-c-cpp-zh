    +   1. Note: If you use est.garma.wge to estimate the parameters of a FARMA model
    by restricting u to be 1, then based on the fact that $(1 - 2B + B^2)^\lambda
    = (1 - B)^{2\lambda}$, the resulting estimate of d would be $2\lambda$ (or possibly
