  md: '# 1.7 Time Series Examples


    # 1.7.1 Simulated Data


    In this section, we examine time series realizations simulated from known time
    series models. The autocorrelations and spectral densities will be studied for
    each realization in order to provide a better understanding of the information
    that each conveys. The AR models of order p (AR(p)) used to generate these realizations
    will be examined in detail in Chapter 3, and we only consider these examples at
    this point for illustrative purposes. For these models, ρ_k and S(f) can be obtained
    using results to be given in Chapter 3.


    # EXAMPLE 1.9: TWO AR(1) MODELS


    Figures 1.18a and 1.19a show realizations of length 250 from the AR(1) models


    $X_t = 0.9 X_{t-1} + a_t,$

    (1.40)


    and by


    $X_t = -0.9 X_{t-1} + a_t,$

    (1.41)


    respectively, where $a_t$ is Gaussian white noise with zero mean and unit variance.
    We notice that the series in Figure 1.18a has a wandering type behavior with no
    distinct periodic tendency. Also note that there seems to be a rather high correlation
    between $X_t$ and $X_{t+k}$ for small $k$. On the other hand, note that the realization
    in Figure 1.19a shows rapid oscillation.'
