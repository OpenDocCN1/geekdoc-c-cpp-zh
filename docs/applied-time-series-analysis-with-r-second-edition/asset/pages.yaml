    # 12A.2 Vector Spaces


    Let $\mathbf{x} = (x_1, x_2, \dots, x_n)''$ and $\mathbf{y} = (y_1, y_2, \dots,
    y_n)''$ be two $n$-component real vectors.


    +   1. The *inner product* (or dot product) of **x** and **y** is given by $\sum_{k=1}^n
    x_k y_k$.

    +   2. The Euclidean *norm* of **x**, denoted by $\|\mathbf{x}\|$, is given by
    $\left(\sum_{k=1}^n x_k^2\right)^{1/2}$.

    +   3. Vectors **x** and **y** are *orthogonal* if their inner product is zero.

    +   4. Vectors **x** and **y** are *orthonormal* if they are orthogonal and have
    norm one.


    # 12A.3 Function Spaces of Real-Valued Functions $f$: $[-\pi, \pi] \to \mathbb{R}$


    +   1. The *inner product* of functions $f$ and $g$ is given by $\int_{-\pi}^{\pi}
    f(x) g(x) dx$.

    +   2. The *norm* of $f$, denoted by $\|f\|$, is given by $\int_{-\pi}^{\pi} |f(x)|^2
    dx$.

    +   3. The real-valued function $f$ is said to be in $L^2[-\pi, \pi]$ if $\int_{-\pi}^{\pi}
    |f(x)|^2 dx < \infty$.

    +   4. Functions $f$ and $g$ are *orthogonal* if their inner product is zero.

    +   5. Functions $f$ and $g$ are *orthonormal* if they are orthogonal and have
    norm one.


    # 12A.4 Systems of Functions


    +   1. Let $S = \{f_1, f_2, \dots\}$ where $f_m$ is orthogonal to $f_j$ when $m
    \neq j$. Then $S$ is said to be an *orthogonal system*.

