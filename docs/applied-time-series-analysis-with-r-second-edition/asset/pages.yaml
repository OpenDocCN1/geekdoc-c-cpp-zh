  md: '$$X_t - \mu = (1 - B)^{-d} a_t$$ $$= \sum_{k=0}^{\infty} \frac{\Gamma(k+d)}{\Gamma(d)k!}
    a_{t-k}, \quad t = 0, \pm 1, \pm 2, \dots$$


    where $a_t$ is white noise, is called a *fractional process*. If $X_t$ is invertible,
    then the fractional model is written


    $$ (1 - B)^d (X_t - \mu) = a_t \tag{11.5}$$


    We typically express the fractional model in the form given in Equation 11.5.
    Theorem 11.1 gives basic properties of the fractional model including conditions
    for stationarity and invertibility.


    # Theorem 11.1


    Let $X_t$ be a fractional process of the form Equation 11.4.


    +   1. If $d < 0.5$, then $X_t$ is causal and stationary

    +   2. If $d > -0.5$, then $X_t$ is invertible

    +   3. The spectral density of $X_t$ is given by $S(f) = [4(\sin \pi f)^2]^{-d}$,
    for $0 < f \le 0.5$, and thus $\lim_{f\to0} f^{2d} S(f)$ exists and is finite

    +   4. If $d \in (-0.5,\ 0.5)$, then the autocorrelation function is given by
    $$\rho_k = \frac{\Gamma(-d+1)\Gamma(k+d)}{\Gamma(d)\Gamma(k-d+1)}, \quad k = 0,
    \pm 1, \dots,$$ and $\rho_k \asymp k^{2d-1}$ as $k \to \infty$. Also, $\sigma_X^2
    = \Gamma(-2d+1)/[\Gamma(-d+1)]^2$

    +   5. If $0 < d < 0.5$ then $X_t$ is long memory


    *Proof:* See Hosking (1981). The long-memory result in (5) follows from (4) using
