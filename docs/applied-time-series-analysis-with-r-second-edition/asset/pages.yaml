    # 10.3.2 Spectrum of a VAR(p) Model


    In the VAR(p) case, the multivariate spectrum, P_X(f), defined in Equation 10.7,
    is the m × m matrix given, for each −0.5 ≤ f ≤ 0.5, by


    $$\mathbf{P_X}(f)=\Phi^{-1}\left(e^{2\pi i f}\right)\Gamma_a\left[\Phi^{-1}\left(e^{-2\pi
    i f}\right)\right]''\tag{10.32}$$


    where for real or complex z, the polynomial $\Phi(z)=I-\Phi_1z-\dots-\Phi_pz^p$
    is the algebraic equivalent of the operator $\Phi(B)$ defined in Equation 10.16.
    Note that Equation 10.32 is the multivariate counterpart to the AR(p) spectrum
    given in Equation 3.53. We mention again that the use of the term spectrum and
    spectral density is typically used synonymously in the multivariate case to indicate
    the Fourier transform of the autocovariance.


