    # **Using R:**


    The $\psi$-weights for a nonstationary ARIMA, seasonal, or ARUMA process, can
    be found using tswge function `psi.weights.wge`. If the model contains nonstationary
    factors such as $(1 - B)^d$, seasonal factors, or other nonstationary factors,
    these factors and the stationary factor $\phi(B)$, should be multiplied using
    the tswge function `mult.wge` (prior to calling `psi.weights.wge`) and using the
    resulting model coefficients as the contents of the vector `phi` in the call to
    `psi.weights.wge`.


