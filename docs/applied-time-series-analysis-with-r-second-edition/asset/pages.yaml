  md: 'that the forecasts or spectral estimators obtained on the dual space are not
    the final results that are desired. We consider forecasting and spectral estimation
    separately.


    +   1. *Forecasting:* Assume that $X(t)$ is observed at equally spaced points
    and that forecasts are desired for $X(k+1), X(k+2), \ldots, X(k+h)$ for some forecast
    origin $k$. The forecasts for $X_{k+1}, X_{k+2}, \ldots$, which are obtained in
    Step 2(1), are converted into forecasts for the desired time points using interpolation.


    +   2. *Spectral analysis:* It has been mentioned that the $G(p; \lambda)$ spectral
    density can be a very useful tool for summarizing frequency information based
    on a stationarizing time transformation. However, the frequency scale in the dual
    space is difficult to relate back to frequencies in the original timescale. For
    this reason, it is often desirable to transform the frequency information in the
    $G(p; \lambda)$ spectral density back into the original time and frequency domains
    using the *Instantaneous Spectrum*. Appendix 13A provides details concerning the
    definition of IF and the instantaneous spectrum. By referring back to Figure 13.3,
    it is seen that the peak in the dual spectrum in Figure 13.34d is associated with
    an IF of about $f=0.2$ at $t=19$, of about $0.09$ at $t=80$, and about $0.06$
    at $t=152$. The instantaneous spectrum is a time–frequency plot (similar to the
    Wigner–Ville plot, Gabor transform, and wavelet spectrograms) that transforms
    the information in the $G(p; \lambda)$ spectral density back into the original
    dimensions of time and frequency to display the manner in which frequency changes
    with time.


    **Using R:** (i) Forecasts using a $G(p; \lambda)$ model using the outline discussed
    above can be obtained using the tswge function `fore.g.lambda.wge`. (ii) The Parzen
    or AR spectral density estimates can be transformed into instantaneous spectra
    using the tswge functions `is.parzen.wge` and `is.ar.wge`. See Appendix 13B for
    more details.


