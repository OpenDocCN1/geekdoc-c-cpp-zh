  md: "+   1. $\\hat{P}_X(f)$ is asymptotically unbiased, that is, $\\lim_{n\\to\\\
    infty}E[\\hat{P}_X(f)] = P(f)$.\n+   2. $\\hat{P}_X(f)$ is not a consistent estimator\
    \ of $P_X(f)$, and $\\mathrm{Var}[\\hat{P}_X(f)]$ does not decrease as $n \\to\
    \ \\infty$.\n\nFor more details, see Parzen (1962). In Figure 1.16c and d, we\
    \ show the periodograms (plotted as vertical bars in dB at the harmonics of the\
    \ fundamental frequency) based on the first 100 points and the entire realization,\
    \ respectively. The periodograms are somewhat visually different, since (c) is\
    \ plotted at the points $f_j = j/100$, $j = 1, ..., 50$ while the periodogram\
    \ in (d) is based on a finer partition (i.e., it is plotted at $f_j = j/250$,\
    \ $j = 1, ..., 125$). The lack of (mathematical) consistency is illustrated by\
    \ the fact that the periodogram based on $n = 250$ is just as variable and erratic\
    \ as the one for $n = 100$; that is, we have gained very little with the increased\
    \ $n$. It should be noted that although the periodogram as defined in Equation\
    \ 1.38 and its alternative forms are commonly studied as estimators of the spectrum,\
    \ in this book, we plot the standardized periodograms (in dB) that estimate the\
    \ spectral density (i.e., we use $\\hat{\\rho}_k$ instead $\\hat{\\gamma}_k$ in\
    \ Equation 1.38).\n\nThe basic problem with the sample spectrum and the periodogram\
    \ is that the estimates for $\\gamma_j$ whenever $j$ is close to $n$ are extremely\
    \ variable regardless of the magnitude of $n$. Much research has gone into the\
    \ problem of smoothing the sample spectrum in order to obtain better behaved spectral\
    \ estimators. A common type of smoothed spectral estimator takes the general form\n\
    \n$\\hat{P}_S(f) = \\lambda_0 \\hat{\\sigma}_X^2 + 2 \\sum_{k=1}^{M} \\lambda_k\
    \ \\hat{\\gamma}_k \\cos(2\\pi f k), \\tag{1.39}$\n\nwhere the truncation point\
    \ $M$ is chosen to be substantially smaller than $n$, and $\\lambda_k$, $k = 0,\
    \ 1, ..., M$ is a window function that damps as $k$ increases. The weights for\
    \ three classic window functions are as follows:\n\n+   1. Bartlett (triangular)\
    \ window\n+   \n+   $\\lambda_k = 1 - \\left(\\frac{k}{M}\\right), \\quad k =\
    \ 0, 1, ..., M$\n+   $= 0, \\quad k > M$"
