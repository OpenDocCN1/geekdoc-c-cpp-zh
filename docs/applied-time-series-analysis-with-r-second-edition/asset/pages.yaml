    \nThus, for large $t$,\n\n$$\\text{GIF} \\simeq \\frac{t^{\\lambda-1}}{2\\pi}\
    \ = \\frac{g'(t)}{2\\pi} = \\text{IF}.$$\n\nJiang et al. (2006) show that the\
    \ results of Example 13A.1 can be generalized to any analytic monotonically increasing\
    \ function $g(t)$. That is, if $H(t)=A\\cos[g(t)]$, and $g(t)$ is monotonically\
    \ increasing, then $\\delta=2\\pi$ and $\\mathcal{P}(t; g, 2\\pi)=g^{-1}(g(t)+2\\\
    pi)-t$. They also show that the IF is a first-term Taylor series approximation\
    \ to the GIF.\n\n# 13A.2 Instantaneous Spectrum of a G(λ) Process\n\nSince in\
    \ many signals the entire frequency structure is evolving with time, the concept\
    \ of an instantaneous spectrum of a $G(\\lambda)$ process is needed. In this regard,\
    \ let $f^* = 1/\\delta$, and let $G_X(f^*; \\lambda)$ denote the $G(\\lambda)$\
    \ spectral density. For example, in the case of a $G(p; \\lambda)$ model, the\
    \ $G(\\lambda)$ spectral density is the AR$(p)$ spectral density associated with\
    \ the AR$(p)$ model fit to the dual. From Definition 13A.2 and Equation 13A.2,\
    \ it is clear that $f^*$ is a function of $f$ (= GIF) and $t$. That is, from Equation\
    \ 13A.2\n\n$$f^* = 0, \\quad \\text{if } f = 0, \\tag{13A.3}\n= [\\ln(1+1/(t f))]^{-1},\
    \ \\quad \\text{if } f \\neq 0, \\ \\lambda = 0,\n= \\frac{\\lambda}{(t+1/f)^{\\\
    lambda} - t^{\\lambda}}, \\quad \\text{if } f \\neq 0, \\ \\lambda \\neq 0.$$\n\
    \nWe can, therefore, capture the instantaneous frequencies through $f^*$ defined\
    \ in Equation 13A.3. Note that since $G_X(f^*; \\lambda)=G_X(-f^*; \\lambda)$\
    \ we will always take $f^* \\ge 0$ and $f \\ge 0$."
  merge: -1
  img_proc: true
- pgno: 712
  md: '# Definition 13A.3


    If $X(t)$ is a $G(\lambda)$ process and $G_X(f^*;\lambda)$ is its $G(\lambda)$-spectrum,
    then the instantaneous spectrum of $X(t)$ at time $t$, denoted $S(f,t;\lambda)$,
    is defined as


    $$S(f,t;\lambda)=G_X(f^*;\lambda). \tag{13A.4}$$


    # Theorem 13A.1


    If $X(t)$ is a $G(p,q;\lambda)$ process, then the instantaneous spectrum of $X(t)$
    at time $t$ is given by


    $$S(f,t;\lambda)=\sigma_a^2\frac{\prod_{j=1}^{q}|\beta_j-i2\pi f^*|^2}{\prod_{k=1}^{q}|\alpha_k-i2\pi
    f^*|^2}. \tag{13A.5}$$


    where $f^*$ is given by [Equation 13A.3](#).


    *Proof:* Follows from [Equation 13A.4](#).


    # 13A.3 GIF and Instantaneous Spectrum of a GLC(p) Process


    In the case of the GLC(p) process, the GIF is given by


    $$f_t=\frac{2a}{(2at+b)\left(-1\pm\sqrt{\frac{1+8an}{(2at+b)^2}}\right)}. \tag{13A.6}$$


    where the $+$ and $-$ relate to frequencies to the right and left of the reflection
    point, respectively. Corresponding to [Equations 13A.3](#) and [13A.4](#), it
    follows that the instantaneous spectrum, $S(f_t,t;a,b)$, is given by $S(f_t,t;a,b)=G(f^*;a,b)$,
    where $G(f^*;a,b)$ is the spectrum of the dual and


    $$f^*=\frac{f_t^2}{(2at+b)f_t+a}. \tag{13A.7}$$


    See Robertson et al. (2010) and Jiang et al. (2006).'
  merge: -1
  img_proc: true
- pgno: 713
  md: '# Appendix 13B: R Commands


    Several tswge functions are available for performing analysis of TVF data. The
    functions are particularly focused on the use of G(λ; p) models to analyze TVF
    data.


    a. gen.glamb...wge(n, lambda, phi, offset, vara, plot, sn) is a function that
    generates a realization of length n from a given G(λ; p) model.


    n is the realization length (xt, t = 1, ..., n), that is, it is evaluated at equally
    spaced points 1, ..., n.


    NOTE: The generated model is based on zero mean. If xt is the time series generated
    by gen.glamb...wge, then to convert this to a time series with mean μ = 10, simply
    compute yt = xt + 10


    lambda is the value of λ in the model (default is lambda = 0, i.e. an M-stationary
    model)

    phi is a vector of AR parameters (default is phi = 0)

    offset is the offset parameter (see for example the discussion about Figure 13.2)
    (default = 60)

    vara is the white noise variance (default = 1)

    plot = TRUE (default) produces a plot of the realization generated

    sn determines the seed used in the simulation. (see Note (5) below.)


    NOTES:


    +   1. This function finds p as the length of phi. If phi = 0 (default) the value
    for p is set to zero.

    +   2. gen.glamb...wge calls the tswge function gen.arma.wge which in turn calls
    the base R function arima.sim.

    +   3. It will be useful to call the utility function mult.wge if you know the
    factors of the AR model instead of the coefficients.

    +   4. By default the white noise is zero mean, normal noise with variance vara
    = 1

    +   5. sn = 0 (default) produces results based on a randomly selected seed. If
    you want to reproduce the same realization on subsequent runs of gen.glamb...wge
    then set sn to the same positive integer value on each run.'
  merge: -1
  img_proc: true
- pgno: 714
  md: 'Example: The command


    ```

    x = gen.glambada.wge(n = 500,lambda = 0.5,phi = c(1.9,-.99),offset = 25, vara
    = 1)

    ```


    generates and plots a realization from the model used to generate the realization
    in Figure 13.6b. Since the seed is randomly selected, the realization generated
    here will not match Figure 13.6b exactly, but it will have the same decreasing
    frequency TVF characteristics.


    b. est.glambada.wge(x,lambda.range,offset.range) estimates the λ and offset (within
    specified ranges) that produce the “most stationary” dual.


    x is an equally spaced TVF data set


    lambda.range is a 2-component vector specifying the lowest and highest values
    of λ to be considered.


    offset.range is a 2-component vector specifying the lowest and highest values
    of offset to be considered.


    Example: The commands to find the values of λ and offset that create the dual
    data set in Figure 13.4b are


    ```

    data(fig13.2c)

    ```


    ```

    est.glambada.wge(fig13.2c,lambda.range = c(-.5,.5),offset.range = c(0,100))

    ```


    NOTE: The top values of lambda and offset that were returned are lambda = -0.4
    and offset 63. See Example 13.7.


    c. trans.to.dual.wge(x,lambda,offset,plot) transforms the time axis to create
    a dual process using linear interpolation.


    x is an equally spaced TVF data set


    lambda is the value of λ in the G(λ; p) model (default is lambda = 0, i.e., x
    is a realization from an M-stationary model)


    offset is the offset parameter (see for example the discussion about Figure 13.2)
    (default = 60)


    plot = TRUE (default) produces a plot of the dual realization created


    The function outputs:


    intX and intY: The input realization x is of length n, and the values of x are
    available at the time points t = 1, ..., n. The values intY are n interpolated
    values of the original time series at the n values of intX in the original time
    scale. The dual data set is obtained by associating the n'
  merge: -1
