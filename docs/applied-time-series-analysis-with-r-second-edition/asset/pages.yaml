  md: 'Selesnick (2002), Sendur et al. (2007), and Pavlicova et al. (2008). O’Hair
    (2010) examined the use of three-dimensional wavelets in an EFDR-type setting
    by analyzing the entire brain volume rather than taking a slice-by-slice approach.


    Another useful feature of the wavelet transformation is that it tends to decorrelate
    data that are correlated. That is, the wavelet coefficients, especially at the
    finer levels, tend to be uncorrelated even when the original data are correlated.
    For example, as mentioned in Chapter 11, Wornell (1993, 1996) has used the wavelet
    transform to decorrelate data with 1/f noise. See also, Percival and Walden (2000),
    Section 9.1 of Flandrin (1992), and Tewfik and Kim (1992). A key application is
    in the analysis of two-dimensional or three-dimensional fMRI brain imaging data.
    The statistic maps discussed in the preceding paragraph often take the form of
    a signal buried in 1/f or other positively correlated noise. Thus, in some situations
    it is useful to transform to the wavelet domain to avoid the problem of dealing
    with the correlation structure in the original data. Bullmore et al. (2001) and
    Breakspear et al. (2004) make use of the decorrelating property to resample uncorrelated
    units of a given data set by (a) transforming to the wavelet domain, (b) resampling
    the wavelet coefficients, and (c) creating the bootstrap data set by performing
    the inverse wavelet transform on the new set of wavelet coefficients. The goal
    of such a resampling procedure is to estimate the null distribution of the original
    data while preserving its correlation structure. See also Tang et al. (2008) concerning
    problems encountered with this “Wavestrap” procedure. Wiechecki (1998) showed
    that the discrete wavelet packet transform can be used to decorrelate data from
    1/(f − f0) processes which are processes whose spectrum behaves like 1 / | (f
    − f0) |^α, that is, have infinite peaks at some frequency f0, not necessarily
    zero.


    Finally, we mention that the wavelet transform has been shown to be useful for
    estimating long-memory parameters. Specifically, McCoy and Walden (1996) and Jensen
    (1999a,b) have used it to estimate the parameter d in the FARMA model given in
    Equation 11.6. Additionally, Whitcher (2004) and Wiechecki (1998) use the discrete
    wavelet packet transform to estimate the parameter λ in the GARMA model in Equation
    11.16.


