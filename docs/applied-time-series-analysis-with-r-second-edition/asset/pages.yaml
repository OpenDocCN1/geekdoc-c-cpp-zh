  md: 'Although it is not possible to directly define the autocovariances of an ARUMA\((p,d,q)\)
    process with \(d > 0\), it is possible to define an “extended” autocorrelation
    of such a process in a meaningful way. To this end, we provide the following definition.


    # Definition 5.2


    Let \(r_1, r_2, \ldots, r_{p+d}\) be the roots of \(\phi(r)=0\), and let \(\rho_k=\rho(k,r_1,r_2,\ldots,r_{p+d},\theta)\)
    denote the autocorrelations of a stationary ARMA \((p+d,q)\) process. Now suppose
    that the first \(d\) of the \(r_j\) approach the unit circle uniformly, that is,
    \(|r_j|=|r_m|\) for \(j,m\le d\). We denote these \(d\) roots by \(r_1,r_2,\ldots,r_d\).
    We define the extended autocorrelation of an ARUMA\((p,d,q)\) process as \(\rho_k^*\),
    where \(\rho_k^*\) is the limit of \(\rho_k\) as the roots \(r_j\), \(j=1,\ldots,d\),
    approach the unit circle uniformly. That is


    $$\rho_k^* = \lim_{\substack{|r_1|=|r_2|=\cdots=|r_d|\to 1}} \rho(k,r_1,r_2,\ldots,r_{p+d},\theta).
    \tag{5.11}$$


