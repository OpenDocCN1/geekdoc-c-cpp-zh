  md: 'subsequently apply AIC by finding the p and q (0 ≤ p ≤ P and 0 ≤ q ≤ Q) that
    minimize AIC as defined in Equation 8.5.


    A problem with the use of AIC is that as the realization length increases, AIC
    tends to overestimate the model orders (i.e., select models with too many parameters).
    Several authors have considered modifications to AIC to adjust for this problem.
    Two of the popular alternatives are AICC (Hurvich and Tsai, 1989) and BIC (sometimes
    called the Schwarz Information Criterion [SIC]) (Schwarz, 1978). These are given
    by


    AICC = ln(σ̂_a²) + (n + p + q + 1)/(n - p - q - 3) , (8.6)


    and


    BIC = ln(σ̂_a²) + (p + q + 1) ln(n)/n . (8.7)


    Simulation studies have shown BIC to perform best for large realization lengths,
    n, while AICC generally performs better for smaller n when the number of parameters
    is relatively large (see McQuarrie and Tsai, 1998). If computing time related
    to the use of ML estimation is an issue, then the quantities in Equations 8.5
    through 8.7 can be approximated using alternative estimation techniques. For example,
    if the decision has been made to restrict attention to AR models, then Equations
    8.5 through 8.7 can be calculated using σ̂_a² obtained based on Burg estimates
    of the model parameters.


    Other automated model identification techniques have been proposed in the literature.
    For example, Akaike (1969) suggested the use of final prediction error (FPE) for
    identifying the order of an AR model. Another early technique for identifying
    the order of an AR model is the criterion AR transfer (CAT) function proposed
    by Parzen (1974).


    # Using R:


    Use aic.wge to find the best fitting ARMA(p,q) model for specified ranges of p
    and q and the model identification criterion you choose. For example, the command
    aic.wge(x, p = 0:8, q = 0:4, type = "aicc") finds the best fitting (based on AICC)
    ARMA(p,q) model for the data in vector x for model orders p = 0 through 8 and
    q = 0 through 4. You may specify type = "aic","bic", or "aicc". (default is "aic").
    Function aic.wge also outputs the ML parameter estimates among other output. The
    function aic5.wge is similar to aic.wge but it finds the top five candidate models
    among the model order ranges'
