  md: 'truncated version of the forecast function is used in practice.


    # *Truncated Version of the Forecast Equation*


    $$\hat{X}_{t_0}^{(T)}(\ell)=\bar{X}-\sum_{j=1}^{t_0-1+\ell}\pi_j\left(\hat{X}_{t_0}^{(T)}(\ell-j)-\bar{X}\right).
    \tag{6.17}$$


    For example, if $t_0=n$, then using [Equation 6.17](#), it follows that


    $$\hat{X}_n^{(T)}(1)=\bar{X}-\pi_1(X(n)-\bar{X})-\pi_2(X(n-1)-\bar{X})-\cdots-\pi_n(X(1)-\bar{X}),$$

    $$\hat{X}_n^{(T)}(2)=\bar{X}-\pi_1(\hat{X}_n^{(T)}(1)-\bar{X})-\pi_2(X(n)-\bar{X})-\cdots-\pi_{n+1}(X(1)-\bar{X}),$$

    $$\vdots$$


    **NOTES:** The $\pi$-weight version of the forecast function is appropriately
    used when the $\pi$-weights damp sufficiently quickly so that the $\pi_j$’s are
    essentially zero for $j>t_0-1+\ell$, which should generally hold for stationary
    and invertible ARMA processes when $t_0$ is sufficiently large. This form of the
    forecast function is useful for forecasting based on long memory models (see [Section
    11.6](#)).


    # 6.5 Forecasting Based on the Difference Equation


    If $X_t$ is a stationary, invertible ARMA$(p,q)$ process, then [Equation 6.9](#)
    is an expression for the best predictor of $X_{t_0+\ell}$ given $X_{t_0}, X_{t_0-1},
    \ldots$, in terms of the general linear process or “infinite moving average” representation
    of the process. The forecast, $\hat{X}_{t_0}^{(T)}(\ell)$, can also be written
    in terms of the difference equation satisfied by the data, a form that is more
    useful in practice. Suppose $X_t$ satisfies $\phi(B)X_t=\Theta(B)a_t$, and hence
    that $\phi(B)X_{t_0+\ell}=\Theta(B)a_{t_0+\ell}$. Thus,


    $$X_{t_0+\ell}-\phi_1X_{t_0+\ell-1}-\cdots-\phi_pX_{t_0+\ell-p}=a_{t_0+\ell}-\theta_1a_{t_0+\ell-1}-\cdots-\theta_qa_{t_0+\ell-q}.$$


    Taking conditional expectations, we obtain


    $$E_{t_0}\left[X_{t_0+\ell}-\phi_1X_{t_0+\ell-1}-\cdots-\phi_pX_{t_0+\ell-p}\right]=E_{t_0}\left[a_{t_0+\ell}-\theta_1a_{t_0+\ell-1}-\cdots-\theta_qa_{t_0+\ell-q}\right].
    \tag{6.18}$$'
