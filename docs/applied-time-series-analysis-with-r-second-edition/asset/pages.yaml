  md: "+   2. Var $[X_t] = E[X_t X_t]$  \n+       $= \\sigma_a^2 \\sum_{j=0}^{\\infty}\
    \ \\psi_j^2 \\text{(a constant)}$  \n+       $< \\infty \\left(\\text{since} \\\
    sum_{j=0}^{\\infty} |\\psi_j| \\text{ converges}\\right)$  \n+   3. $E[X_t X_{t+k}]\
    \ = \\gamma_k$ (depends only on $k$ from Equation 2.7)\n\nThus, $X_t$ is stationary,\
    \ and the proof is complete.\n\n# 2.2.1 Spectrum and Spectral Density for a General\
    \ Linear Process\n\nUsing Equation 2.3 and the fact that the spectrum for white\
    \ noise is constant and given by $P_a(f)=\\sigma_a^2$, the spectrum of the general\
    \ linear process $X_t$ is given by  \n$$P_X(f)=\\left|\\psi\\left(e^{-2\\pi i\
    \ f}\\right)\\right|^2 P_a(f) \\tag{2.8}$$  \n$$=\\sigma_a^2\\left|\\psi\\left(e^{-2\\\
    pi i f}\\right)\\right|^2,$$  \nand the spectral density is given by  \n$$S_X(f)=\\\
    frac{\\sigma_a^2}{\\sigma_X^2}\\left|\\psi\\left(e^{-2\\pi i f}\\right)\\right|^2.\
    \ \\tag{2.9}$$\n\n# 2.3 Wold Decomposition Theorem\n\nBefore proceeding, we state\
    \ the Wold decomposition theorem that emphasizes the central role of the general\
    \ linear process in the study of covariance stationary processes. For a proof\
    \ and discussion of this result, the reader is referred to Brockwell and Davis\
    \ (1991)."
