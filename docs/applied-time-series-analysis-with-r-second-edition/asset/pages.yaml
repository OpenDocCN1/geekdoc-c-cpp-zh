    # EXAMPLE 7.5: ASYMPTOTIC DISTRIBUTIONS FOR AR(1) AND AR(2) MODELS


    +   1. AR(1): In the case of an AR(1) model, $\mathbf{\Gamma}$ is the $1 \times
    1$ matrix whose element is $\gamma_0$, which from Equation 3.37 is given by $\gamma_0
    = \sigma_a^2 / (1 - \phi_1^2)$. Thus, it follows that


    $$\sigma_a^2 \Gamma^{-1} = 1 - \phi_1^2,\tag{7.53}$$'
