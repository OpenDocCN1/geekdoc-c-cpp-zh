- pgno: 401
  md: '# ## 8.3 Model Identification for Nonstationary ARUMA($p,d,q$) Models


    In the previous section, we consider a variety of methods for identifying the
    orders of ARMA($p,q$) processes. However, it will often be necessary to fit a
    nonstationary model to a given set of data. In this section, we discuss procedures
    for fitting ARUMA($p,d,q$) models. Recall that an ARUMA($p,d,q$) model is specified
    by


    $$\phi(B)\lambda(B)(X_t-\mu)=\theta(B)a_t, \qquad (8.11)$$


    where


    $\phi(B)$ and $\theta(B)$ are pth and qth order operators, respectively.


    All the roots of $\phi(z)=0$ and $\theta(z)=0$ are outside the unit circle.


    All roots of $\lambda(z)=1-\lambda_1z-\cdots-\lambda_dz^d=0$ lie on the unit circle.


    To begin this discussion, we recall the Findley–Quinn theorem (Theorem 5.1) that
    says that if $p>0$, the extended autocorrelations, $\rho_k^*$, satisfy a lower
    order difference equation than $p+d$. The order of this difference equation is
    based on the roots on the unit circle of highest multiplicity. It was also seen
    in Example 3.12 that the stationary components are often “hidden” by near-nonstationary
    components, and, in Example 7.9c, we noted that roots near the unit circle can
    cause parameter estimation problems.


    As a consequence of the comments in the previous paragraph, it follows that model
    identification in the presence of nonstationarities or near nonstationarities
    must be done carefully. We make the following general comments in this regard:


    # *General comments:*


    +   1. ML (and Burg/TT) estimates are better than YW (or extended YW) in the nonstationary
    or nearly nonstationary case. (See the estimation results shown in [Tables 7.6](#)
    and [7.7](#).)

    +   2. Model ID techniques (such as the Box–Jenkins procedure) that are based
    on YW-type estimation can be misleading in the presence of nonstationary or near-nonstationary
    models. AIC using ML (or Burg) estimates for strictly AR models will not be as
    susceptible to nonstationarity or near nonstationarity.'
