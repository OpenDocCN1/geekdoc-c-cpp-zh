  md: '# 3.3.1 Stationarity and Invertibility Conditions for an ARMA(p,q) Model


    Theorem 3.4 that follows is analogous to Theorems 3.2 and 3.3 and is given here
    without proof. Theorem 3.4(1) indicates that, as might be expected, the stationarity
    of a process satisfying Equation 3.86 depends on the AR operator φ(B). Additionally,
    Theorem 3.4(2) gives conditions on the MA operator θ(B) of a process satisfying
    Equation 3.86 that are necessary and sufficient for X_t to have a “meaningful”
    infinite AR representation, that is, to be invertible.


    # Theorem 3.4


    Let X_t be a causal process specified by Equation 3.86. Then, X_t is an ARMA(p,q)
    process if and only if the following two conditions are met


    +   1. The roots r_j, j = 1, 2, ..., p of the characteristic equation φ(z) = 0
    all lie outside the unit circle (stationarity).

    +   2. The roots of θ(z) = 0 lie outside the unit circle (invertibility).


    # 3.3.2 Spectral Density of an ARMA(p,q) Model


    The power spectrum of the stationary ARMA(p,q) process is obtained from Equation
    3.87, since


    ψ(z) = φ^{-1}(z)θ(z) = (1 - φ_1 z - ... - φ_p z^p)^{-1} (1 - θ_1 z - θ_2 z^2 -
    ... - θ_q z^q),


    and hence


    P_X(f) = σ_a^2 |1 - θ_1 e^{-2π i f} - θ_2 e^{-4π i f} - ... - θ_q e^{-2qπ i f}|^2
    / |1 - φ_1 e^{-2π i f} - φ_2 e^{-4π i f} - ... - φ_p e^{-2pπ i f}|^2.


    The spectral density is given by


    S_X(f) = (σ_a^2 / σ_X^2) |1 - θ_1 e^{-2π i f} - θ_2 e^{-4π i f} - ... - θ_q e^{-2qπ
    i f}|^2 / |1 - φ_1 e^{-2π i f} - φ_2 e^{-4π i f} - ... - φ_p e^{-2pπ i f}|^2.
    (3.92)'
