    # 11.6 Forecasting Based on the k-Factor GARMA Model


    In this section we consider the problem of forecasting using the k-factor GARMA
    model. While the use of the difference equation provides easy-to-use forecasts
    in the case of the ARMA and ARUMA models using Equations 6.24 and 6.36, respectively,
    this method is not suitable for GARMA processes because there is no finite-order
    difference equation form for ∏_{j=1}^k (1 − 2u_j B + B²)^{λ_j}.


    Brockwell and Davis (1991) use the π-weights version of the classical Box-Jenkins
    forecasts (see Section 6.4) to forecast the FARMA process φ(B)(1 − B)^d (X_t −
    μ) = θ(B)a_t, and Woodward et al. (1998) use this method for forecasting based
    on a k-factor GARMA model. The π-weights of the k-factor GARMA model can be calculated
    using the identity'
