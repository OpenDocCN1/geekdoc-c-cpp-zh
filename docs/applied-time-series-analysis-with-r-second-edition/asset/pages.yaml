  md: '+   1. $X_1$, $X_2$, ..., $X_{t_0}$ have been observed

    +   2. Model parameters have been estimated

    +   3. The $a_t$ are unknown


    Consequently, Equation 6.21 cannot be immediately applied, and in practice, we
    use Equation 6.21 with the following modifications:


    +   a. The estimated model is assumed to be the true model (and $\mu$ is estimated
    by $\overline{X}$).

    +   b. The $a_t$ are estimated from the data.


    The comment in (a) relates to the fact mentioned at the beginning of this chapter,
    that our forecasting formulas are based on a known model.


    The estimation of $a_t$ proceeds by noting that for an ARMA$(p,q)$ model,


    $$X_t = \sum_{j=1}^{p} \phi_j X_{t-j} + a_t - \sum_{j=1}^{q} \theta_j a_{t-j}
    + \left(1 - \sum_{j=1}^{p} \phi_j\right)\mu,$$


    which can be rewritten as


    $$a_t = X_t - \sum_{j=1}^{p} \phi_j X_{t-j} + \sum_{j=1}^{q} \theta_j a_{t-j}
    - \left(1 - \sum_{j=1}^{p} \phi_j\right)\mu.$$


    So, for $t \le t_0$, $E_{t_0}[a_t](= a_t)$ is estimated by


    $$\hat{a}_t = \begin{cases} 0, & t \le p \\ X_t - \sum_{j=1}^{p} \phi_j X_{t-j}
    + \sum_{j=1}^{q} \theta_j \hat{a}_{t-j} - \left(1 - \sum_{j=1}^{p} \phi_j\right)\overline{X},
    & t = \max(p+1, q+1), \dots, t_0. \end{cases} \tag{6.23}$$


    Moreover, from Equation 6.20, since $E_{t_0}[a_t] = 0$ for $t > t_0$, we define


    $$\hat{a}_t = 0, \quad t > t_0.$$


    This leads to the following.


    # 6.5.2 Basic Difference Equation Form for Calculating Forecasts from an ARMA$(p,q)$
    Model'
