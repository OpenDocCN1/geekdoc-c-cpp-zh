    # EXAMPLE 12.3: DWT OF A 16 POINT TIME SERIES REALIZATION


    The top row of Figure 12.7 (bumps16 in tswge) shows a time series realization
    of length $n = 16$. The $16 = 2^4$ (i.e., $J_0 = 4$) coefficients obtained via
    the pyramid algorithm and the Haar wavelet are plotted on the remaining rows.
    The row labeled d1 plots $d_{1,k}$, $k = 1, ..., 8$ (equally spaced). That is,
    the eight values of $d_{1,k}$ are plotted at 1.5, 3.5, 5.5, ..., 13.5, 15.5. The
    row d2 plots $d_{2,k}$, $k = 1, ..., 4$, row d3 plots $d_{3,k}$, $k = 1, 2$, while
    rows d4 and s4 plot only the single values $d_{4,1}$ and $s_{4,1}$, respectively.
    Note that although the time series contains 16 data values, only about 10 of the
    wavelet and scaling coefficients are sufficiently different from zero to show
    clearly on the plot. One of the features of the wavelet decomposition is that
    it often produces a *sparse* representation of the original data. Using Equation
    12.24 the original data can be reconstructed from the wavelet coefficients, implying
    that the information in the data (16 data values) is conveyed using about 10 nonzero
    wavelet and scaling coefficients. The extent of sparseness is often much more
    striking than in this simple example. Recalling that the coefficient, $d_{j,k}$,
    is a measure of the detail of duration about $2^j$ that occurs in the vicinity
    of its location on the time axis, we re-emphasize that larger values of $| d_{j,k}
    |$ indicate locations of “activity” in the data. Detail coefficients for large
    values of $j$ (i.e., $d_{3,1}$, $d_{3,2}$, $d_{4,1}$, and $s_{4,1}$) measure the
    strength of smoother (longer duration) behavior. In Figure 12.7 it can be seen
    that the jump at $t = 3$ is described by detail coefficients $d_{1,2}$ and $d_{2,1}$
    while the wider bump around $t = 12$ produces sizable detail coefficients at levels
    1, 2, and 3.'
