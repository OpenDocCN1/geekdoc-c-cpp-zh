    # 8A.4 Generalized Partial Autocorrelations


    One major concern with the Box–Jenkins approach in the case of an ARMA(p,q) with
    both p > 0 and q > 0 is that there is uncertainty concerning model selection even
    when examining the true autocorrelations and partial autocorrelations. The failure
    of the true autocorrelation and partial autocorrelation functions to uniquely
    identify p and q in a mixed ARMA(p,q) model as discussed above led Woodward and
    Gray (1981) to define the generalized partial autocorrelation in order to better
    handle the mixed process. Let X_t be a stationary process with autocorrelations
    ρ_j, j = 0, ±1, ±2, …, and consider the following k × k system of equations:'
