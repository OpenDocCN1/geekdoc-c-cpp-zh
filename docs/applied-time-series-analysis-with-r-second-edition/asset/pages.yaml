  md: "# 5.4 Random Walk Models\n\nRandom walk models have been used for describing\
    \ the behavior of the stock market, the path traveled by a molecule as it moves\
    \ through a liquid, and many other applications. In this section, we will define\
    \ *random walk* and *random walk with drift* models and briefly discuss their\
    \ properties.\n\n# 5.4.1 Random Walk\n\nLet $X_t$, $t = 1, 2, \\dots$ be defined\
    \ by\n\n$$X_t = X_{t-1} + a_t, \\tag{5.20}$$ \n\nwhere $X_0 = 0$ and $a_t$, $t\
    \ = 1, 2, \\dots$ is a sequence of independent and identically distributed random\
    \ variables with mean zero and variance $\\sigma_a^2$. The name, “random walk,”\
    \ comes from the fact that at time $t - 1$, the movement to time $t$ is totally\
    \ determined by the random quantity $a_t$. It is sometimes convenient to write\
    \ the model in Equation 5.20 as\n\n$$X_t = \\sum_{k=1}^{t} a_k, \\tag{5.21}$$\
    \ \n\nfor $t = 1, 2, \\dots$. From Equation 5.21, it can be seen that $E(X_t)\
    \ = 0$, and the variance of $X_t$ is given by\n\n$$\\operatorname{Var}(X_t) =\
    \ t \\sigma_a^2. \\tag{5.22}$$ \n\nThus, the random walk model in Equation 5.20\
    \ is nonstationary since $\\operatorname{Var}(X_t)$ is not constant. It can also\
    \ be shown that if $1 \\le t_1 \\le t_2$, then\n\n$$\\operatorname{Cov}(X_{t_1},\
    \ X_{t_2}) = t_1 \\sigma_a^2 \\tag{5.23}$$ \n\nand\n\n$$\\rho_X(t_1, t_2) = \\\
    sqrt{\\frac{t_1}{t_2}}, \\tag{5.24}$$ \n\n(see Problem 5.12). Consequently, the\
    \ autocorrelation between $X_{t_1}$ and $X_{t_2}$"
