  md: '# 3


    # ARMA Time Series Models


    In this chapter we will discuss some of the important models that are used to
    describe the behavior of a time series. Of particular interest will be the AR,
    MA, and ARMA models. These models were made popular by George Box and Gwilym Jenkins
    in their classic time series book, the current edition of which is Box et al.
    (2008). These models have become fundamental to the theory and applications of
    time series. While several example based on real data are examined in this chapter,
    we make extensive use of simulated realizations in this chapter because we are
    focusing on the properties and developing an understanding of known models. Also,
    unless otherwise specified, the autocorrelations and spectral densities illustrated
    in this chapter are the theoretical quantities for the models being studied. In
    later chapters, we will use the lessons learned in this chapter as we analyze
    actual time series data.


    # 3.1 MA Processes


    We begin by defining an MA process of order q, which will be denoted MA(q).


    # Definition 3.1


    Let a_t be a white noise process with zero mean and finite variance σ_a^2 and
    let the process X_t, t = 0, ±1, ±2, ... be defined by


    X_t - μ = a_t - θ₁ a_{t-1} - ... - θ_q a_{t-q}   (3.1)


    where the θ_j, j = 1, ..., q are real constants with θ_q ≠ 0. The process X_t
    defined in Equation 3.1 is called an MA process of order q, which is usually shortened
    to MA(q).'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'We will often write Equation 3.1 in the form


    $$X_t - \mu = \theta(B) a_t,$$


    where


    $$\theta(B) = 1 - \theta_1 B - \theta_2 B^2 - \dots - \theta_q B^q.$$


    NOTE: Before proceeding, we point out that some authors and writers of software
    packages write Equation 3.1 as $X_t - \mu = a_t + \theta_1 a_{t-1} + \dots + \theta_q
    a_{t-q}$. Consider the MA(2) model $X_t = a_t - 1.2 a_{t-1} + 0.8 a_{t-2}$. Using
