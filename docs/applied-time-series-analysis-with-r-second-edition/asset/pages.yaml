    see Appendix 10B.


    # 10.6.5 Kalman Filter and Missing Data


    Suppose, we observe $\{y_{t_1}, y_{t_2}, \cdots, y_{t_r}\}$, where $1 \leq t_1
    < t_2 < \cdots < t_r \leq n$ and the $t_i$’s are integers. That is, there are
    $n-r$ missing observations. Such a situation (which is all too common in practice)
    would cause serious problems with attempts to analyze this type of data using
    an ARMA($p,q$) model based on techniques discussed in previous chapters of this
    book. One of the advantages of the state-space model is that it provides the ability
    to analyze such data. Specifically, state-space modeling provides at least two
    methods for dealing with this situation: (a) estimation of model parameters (using
    ML) even with some missing data and (b) estimation of missing values themselves.'
