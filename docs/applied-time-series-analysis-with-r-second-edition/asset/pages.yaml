  md: '# EXAMPLE 13.3: INSTANTANEOUS PERIOD AND FREQUENCY


    Another concept is that of instantaneous period and instantaneous frequency (IF).
    Loosely speaking, the instantaneous period at time t is the length of the next
    period. The IF is then defined as the reciprocal of the instantaneous period.
