    variance


    $$\operatorname{var}(\hat{\phi}_1)=\frac{(1-\phi_1^2)(1-\phi_1\theta_1)^2}{n(\phi_1-\theta_1)^2},$$


    while $\hat{\theta}_1$ is normal with mean $\theta_1$ and variance


    $$\operatorname{var}(\hat{\theta})=\frac{(1-\theta_1^2)(1-\phi_1\theta_1)^2}{n(\phi_1-\theta_1)^2}.$$


    # 7.5.2.1 Confidence Intervals for ARMA(p,q) Parameters


    The result in Equation 7.61 provides large sample confidence intervals for the
    model parameters of an ARMA(p,q) model. A confidence ellipsoid corresponding to
    Equation 7.57 and individual confidence intervals corresponding to Equation 7.58
    are given by


    $$\left(\hat{\beta}-\beta\right)''\hat{\Gamma}\left(\hat{\beta}-\beta\right)\le
    \frac{\hat{\sigma}_a^2}{n}\chi_{1-\alpha}^2(p+q),\tag{7.68}$$


    and


    $$\hat{\beta}_j\pm z_{1-\alpha/2}\frac{\hat{\sigma}_a\hat{\gamma}_{jj}^{1/2}}{\sqrt{n}}.\tag{7.69}$$'
