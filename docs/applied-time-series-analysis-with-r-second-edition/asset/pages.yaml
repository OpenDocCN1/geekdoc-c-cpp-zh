  md: '# Chapter


    The following mathematical review lists some definitions and results that are
    critical to understanding the material in Section 12.2 on wavelets.


    # 12A.1 Classical Fourier Series


    Consider the basis set $S_1 = \{1, \cos kx, \sin kx,\ k = 1, 2, \ ... \}$. In
    1807 Joseph Fourier made the astounding assertion that, subject to fairly loose
    restrictions, an arbitrary function $f(x)$ could be written as a linear combination
    of sines and cosines, that is, a linear combination of basis elements from $S_1$
    (see James, 2011). Later, it was shown that, a function $f(x)$ satisfying the
    Dirichlet conditions on a closed interval (i.e., $f(x)$ has only a finite number
    of discontinuities and only a finite number of maxima and minima on the interval),
    can be expanded in a Fourier series which converges pointwise to $f(x)$ at points
    of continuity and to the mean of the left- and right-hand limits at points of
    discontinuity. Letting the domain of $f(x)$ be $[-\pi, \pi]$, we can write


    $f(x) \sim \frac{a_0}{2} + \sum_{k=1}^{\infty} (a_k \cos kx + b_k \sin kx), \qquad
    (12A.1)$


    where “ ~ ” denotes the aforementioned type of pointwise convergence under conditions
    such as the Dirichlet conditions. The coefficients in Equation 12A.1 are given
    by


    $a_k = \frac{1}{\pi} \int_{-\pi}^{\pi} f(t) \cos kt \, dt, \quad k = 0, 1, \ ...
    \qquad (12A.2)$

    $b_k = \frac{1}{\pi} \int_{-\pi}^{\pi} f(t) \sin kt \, dt, \quad k = 0, 1, \ ...$


    It is often convenient to express functions, $f$, defined on $[-\pi, \pi]$ as
    linear combinations of the basis functions in $S_2 = \{e^{ikx}, \ k = 0, \pm 1,
    \pm 2, \ ... , \}$ where in this case the Fourier expansion becomes


    $f(x) \sim \sum_{k=-\infty}^{\infty} \alpha_k e^{ikx}, \qquad (12A.3)$'
