    # 3.3.5 ψ-Weights of an ARMA(p,q)


    We have shown that an ARMA(p,q) process can be expressed in the linear filter
    form, X_t = Σ_{k=0}^∞ ψ_k a_{t-k} In this section, we discuss calculation of the
    ψ-weights using three methods: (a) equating coefficients, (b) division, and (c)
    finding a general expression using Theorem 3.1.


    +   1. Finding ψ-weights by equating coefficients: Since a stationary ARMA(p,q)
    process can be written in the form X_t = ψ(B)a_t where ψ(B)= φ^{-1}(B)θ(B), we
    have the relationship φ(B)ψ(B)=θ(B), or in the expanded form


    (1 - φ₁B - ⋯ - φ_pB^p)(1 + ψ₁B + ψ₂B² + ⋯) = (1 - θ₁B - ⋯ - θ_qB^q). (3.115)


    Equating the coefficients of B^j in Equation 3.115 displays the relationship among
    the θ''s, θ''s, and ψ''s. In particular, equating coefficients of B^j yields


    ψ₁ - φ₁ = -θ₁

    ψ₂ - φ₁ψ₁ - φ₂ = -θ₂

    ⋮

    ψ_j - φ₁ψ_{j-1} - φ₂ψ_{j-2} - ⋯ - φ_j = -θ_j, (3.116)


    where ψ₀ = 1, θ_k = 0 for k > q, and φ_k = 0 for k > p. The equations in Equation
    3.116 can be rearranged to provide a recursive scheme for calculating the ψ-weights.
    Namely,


    ψ₁ = φ₁ - θ₁

    ψ₂ = φ₁ψ₁ + φ₂ - θ₂

    ⋮

    ψ_j = φ₁ψ_{j-1} + φ₂ψ_{j-2} + ⋯ + φ_j - θ_j, (3.117)'
