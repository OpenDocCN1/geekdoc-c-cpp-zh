  md: 'so that $\hat{\phi}_1$ is asymptotically normal with mean $\phi_1$ and variance
    $\left(1 - \phi_1^2\right)/n$


    2. AR(2): The matrix $\mathbf{\Gamma}$, for an AR(2), is given by


    $$\mathbf{\Gamma} = \begin{bmatrix} \gamma_0 & \gamma_1 \\ \gamma_1 & \gamma_0
    \end{bmatrix}, \tag{7.54}$$


    where $\gamma_0$ and $\gamma_1$ are given by 3.113 and 3.114 (with $\theta_1 =
    0$) as


    $$\gamma_0 = \frac{(1 - \phi_2)\sigma_a^2}{(1 + \phi_2)\left((1 - \phi_2)^2 -
    \phi_1^2\right)}. \tag{7.55}$$ $$\gamma_1 = \frac{\phi_1\sigma_a^2}{(1 + \phi_2)\left((1
    - \phi_2)^2 - \phi_1^2\right)}.$$


    After some algebra, it follows that


    $$\sigma_a^2 \mathbf{\Gamma}^{-1} = \begin{bmatrix} 1 - \phi_2^2 & -\phi_1(1 +
    \phi_2) \\ -\phi_1(1 + \phi_2) & 1 - \phi_2^2 \end{bmatrix}. \tag{7.56}$$


    From Equation 7.50 and the diagonal elements of Equation 7.56, it can be seen
    that, asymptotically, $\hat{\phi}_1$ is distributed as a normal random variable
    with mean $\phi_1$ and variance $\left(1 - \phi_1^2\right)/n$, while $\hat{\phi}_2$
    is asymptotically normal with mean $\phi_2$ and the same asymptotic variance as
    $\hat{\phi}_1$.


    # 7.5.1.1 Confidence Intervals: AR Case


    A common use for the result in Equation 7.50 is to compute approximate large sample
    confidence intervals for the parameters. From Equation 7.50, it follows that


    $$\left(\hat{\phi} - \phi\right)'' \frac{n\hat{\mathbf{\Gamma}}}{\hat{\sigma}_a^2}
    \left(\hat{\phi} - \phi\right) \Rightarrow \chi^2(p), \tag{7.57}$$'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'where χ²(p) denotes a chi-square distribution with p degrees of freedom, and
    where σ̂ₐ² and Γ̂ denote data-based estimates of σₐ² and Γ (see Brockwell and
    Davis, 1991). From Equation 7.57, an approximate (1 − α) × 100% confidence ellipsoid
    for φ is given by


    (\hat{φ} - φ)'' \hat{Γ} (\hat{φ} - φ) ≤ \frac{\hat{σ}_a^2}{n} χ²_{1-α}(p),  (7.58)


    where χ²_β denotes the β × 100th percentile of the chi-square distribution with
    p degrees of freedom. If confidence intervals are desired for an individual parameter,
    φ_j, then Equation 7.58 can be modified to yield


    \hat{φ}_j ± z_{(1-α)/2} \frac{\hat{σ}_a^2 \hat{Γ}_{jj}^{1/2}}{√n},  (7.59)


    where z_β denotes the β × 100th percentile of the standard normal distribution,
    and \hat{Γ}_{jj} denotes the jth diagonal element in \hat{Γ}^{-1}.


    Before continuing to the ARMA(p,q) case, a few comments can be made concerning
    the estimation of σₐ² and Γ. First, for the AR(1) and AR(2) cases, σₐ² \hat{Γ}^{-1}
    can be estimated directly by inserting parameter estimates into Equations 7.53
    and 7.56, respectively. For higher order models, σₐ² can be estimated by \hat{σ}_a²,
    the estimated white noise variance associated with the particular estimation procedure
    employed using backcasting as discussed in Section 7.4. Then, the matrix \hat{Γ}
    can be obtained by estimating the elements γ_k using \hat{γ}_k in Equation 7.5.


    In Example 7.9d, we compute confidence intervals for model parameters based on
    the YW, Burg, and ML estimates for realizations from known AR models.


