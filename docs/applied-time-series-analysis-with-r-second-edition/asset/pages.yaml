  md: '# 3.5 Seasonal ARMA(p,q) × (PS,QS)S Models


    Several modifications of the ARMA(p,q) model have been found to be useful. In
    Chapter 5, we will discuss ARMA-type models that are nonstationary due to roots
    of the characteristic equation on the unit circle. One modification of the ARMA(p,q)
    is designed to take into account seasonal behavior in data. For example, quarterly
    data (e.g., breaking the year into four 3 month groups) will often have seasonal
    characteristics implying that there is a natural correlation structure between,
    X_t and X_{t-4}, that is, between the current quarter and the same quarter last
    year. In this case, it makes sense to include factors in the model such as φ(B^4)
    = 1 - φ1 B^4 - φ2 B^8 - ... - φP B^{4P}, that take into account this four-quarter
    per year relationship. For example, we might have φ(B^4) = 1 - 0.9 B^4 or φ(B^4)
    = 1 - B^4 + 0.8 B^8, that is, the models X_t = 0.9 X_{t-4} + a_t and X_t = X_{t-4}
    - 0.8 X_{t-8} + a_t, which specify that this quarter’s performance is a linear
    combination of the same quarter in previous years plus noise. In general, we use
    s to denote the “season” (i.e., for monthly data, s = 12 and for quarterly data
    s = 4). A (purely) stationary seasonal model is given by'
