    x_1 &= \mu + a_1 - \theta_1 a_0 - \cdots - \theta_q a_{1-q} \\

    x_2 &= \mu + a_2 - \theta_1 a_1 - \cdots - \theta_q a_{2-q} \\

    &\vdots

    \end{aligned}\tag{3.128}$$


    where the $a_t$ values are generated using a random number generator for generating
    uncorrelated deviates with mean zero and variance $\sigma_a^2$. From Equation
    3.128, it is clear that the generation is initiated by obtaining the $q$ uncorrelated
    starting values $a_0$, $a_{-1}$, $\cdots$, $a_{-(q-1)}$.


    # 3.6.2 AR(2) Model


    As an example of the complications that arise in computing appropriate starting
    values for simulating realizations from ARMA$(p,q)$ models with $p > 0$, we consider
    the AR(2) model with $\mu = 0$ and $\sigma_a^2$. For the AR(2) model, the observations
    are generated from


    $$\begin{aligned}

    x_1 &= \mu(1 - \phi_1 - \phi_2) + \phi_1 x_0 + \phi_2 x_{-1} + a_1 \\

    x_2 &= \mu(1 - \phi_1 - \phi_2) + \phi_1 x_1 + \phi_2 x_0 + a_2 \\

    &\vdots

    \end{aligned}\tag{3.129}$$


    From Equation 3.129, we see that a white noise value $a_1$ and values $x_0$ and
    $x_{-1}$ are required in order to initiate the simulation. Recall that the random
    variables $X_0$ and $X_{-1}$ are uncorrelated with $a_1$ but are correlated with
    each other. Assuming normally distributed noise, $x_0$ and $x_{-1}$ are values
    of a bivariate normal random variable $(X_0, X_{-1})$ that has mean $\mu$ and
    variance–covariance matrix,


    $$\Sigma = \frac{\sigma_a^2}{1 - \phi_1 \rho_1 - \phi_2 \rho_2} \begin{bmatrix}
    1 & \frac{\phi_1}{1 - \phi_2} \\ \frac{\phi_1}{1 - \phi_2} & 1 \end{bmatrix},$$


    (see Equations 3.43 and 3.56).


