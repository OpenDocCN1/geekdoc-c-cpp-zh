  md: 'System frequencies of the AR part of the ARMA(p,q) model will tend to introduce
    peaks in the spectral density similar to those for the corresponding AR(p) model.
    However, system frequencies of the MA part tend to produce troughs or dips in
    the spectral density at the corresponding system frequencies. The peaks in a spectral
    density for an ARMA(p,q) (or AR(p)) model are caused by small values in the denominator
    of Equation 3.92 which occur near the system frequencies of the AR part of the
    model. Correspondingly, small values in the numerator of Equation 3.92 near the
    system frequencies of the MA part will produce the tendency for dips or troughs
    to appear in the spectral density.


    **Using R:** As mentioned previously, the tswge functions `gen.arma.wge`, `true.arma.aut.wge`,
    `true.arma.spec.wge`, and `plotts.true.wge` can be used to generate realizations,
    and create plots of realizations, true autocorrelations, and true spectral densities,
    for ARMA processes. Again remember to be careful about the signs of the coefficients.


    # 3.3.3 Factor Tables and ARMA(p,q) Models


    According to Theorem 3.4 the stationarity and invertibility of an ARMA(p,q) model
    can be tested by examining the factors of φ(z) and of θ(z), respectively. As in
    the AR(p) case, factor tables are a useful tool for understanding these factors,
    and this can be accomplished using the tswge R function `factor.wge`. The factor
    tables for the AR components of an ARMA(p,q) model are interpreted as in the AR(p)
    case. That is, system frequencies indicate natural frequencies in the model, and
    spectral densities will tend to have peaks near these system frequencies. The
    key to understanding factor tables for an ARMA(p,q) process is to realize that
    the factor tables for the MA components are interpreted in an opposite manner.
    Specifically, the MA system frequencies indicate frequencies whose impact has
    been weakened in the total model. Spectral densities will tend to have dips rather
    than peaks in the vicinity of the MA system frequencies. (See the discussion following
    Equation 3.92.) As an example note that the spectral density in Figure 3.3a for
    the MA(1) model X_t = (1 − 0.99B)a_t has a dip or trough at f = 0 whereas the
    spectral density for (1 − 0.99B)X_t = a_t would have a sharp peak at f = 0. Another
    example of this effect is the fact that in Equation 3.90 the AR factor 1 − 0.95B
    and the MA factor 1 − 0.8B are each associated with system frequency f = 0. In
    Example 3.16 we illustrated the fact that the MA'
