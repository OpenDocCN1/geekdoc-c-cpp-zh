    # Definition 11.4


    If Xₜ is a causal, stationary, and invertible process satisfying


    $$\phi(B)(1 - B)^d(X_t - \mu) = \theta(B)a_t,\tag{11.6}$$


    where aₜ is white noise, and where φ(z) and θ(z) are pth and qth-order polynomials,
    respectively, that share no common factors, then Xₜ is called a fractional ARMA
    (FARMA(p,d,q)) process.


