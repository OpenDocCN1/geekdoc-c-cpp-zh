  md: '# EXAMPLE 11.5: GARMA PROCESSES


    In this example we show true autocorrelations for Gegenbauer and GARMA models.
    The procedure for calculating these autocorrelations will be discussed in Section
    11.4.1.


    +   1. Figure 11.8 shows true autocorrelations for GARMA processes with u = 0.9
    and λ = 0.45. Figure 11.8a and b are for GARMA (1,0.45,0,9,0) processes with φ₁
    = 0.9 and φ₁ = 0.95, respectively. These autocorrelations have the general appearance
    of the autocorrelations in Figure 3.16b for the AR(3) process (1 − 0.95B) (1 −
    1.6B + 0.9B²)Xₜ = aₜ. That is, the AR(1) factor with positive φ₁ induces a damped
    exponential behavior, and the appearance in both settings is that of a damped
    sinusoidal behavior along a damped exponential path. It is instructive to compare
    Figures 3.16b and 11.8b. In Figure 3.16b, the damped exponential and damped sinusoidal
    behaviors have almost disappeared by lag 40. However, in Figure 11.8b, while the
    damped exponential behavior is almost nonexistent by lag 40, the sinusoidal behavior
    associated with the G-frequency, f_G = 0.07, is still visible (and “going strong”)
    at lag 70. Figure 11.8c and d show very unusual autocorrelation behavior. The
    GARMA(1,0.45,0,9,0) model associated with the autocorrelations in Figure 11.8c
    has an AR(1) factor with φ₁ = −0.85 which introduces oscillating damped exponential
    behavior. In Figure 11.8c it is seen that this high-frequency/oscillating behavior
    is noticeable for low lags, but after k = 20 the only behavior visible is that
    due to the long-memory damped sinusoidal. Figure 11.8d shows autocorrelations
    for a GARMA(2,0.45,0,9,0) with AR(2) factor 1 − B + 0.9B² which, from Equation
    3.63 is associated with a system frequency of f₀ = 0.16 (or period of 6.25). The
    shorter period of about 6 can be seen within the first 15 lags, but for larger
    lags, the only observable behavior is due to the G-frequency, f_G = 0.07 (i.e.,
    periods of about 14).'
