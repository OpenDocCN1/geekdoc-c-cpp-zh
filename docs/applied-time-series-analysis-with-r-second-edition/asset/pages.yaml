    # 12.2.2 Wigner–Ville Spectrum


    Recall that the spectrum for a stationary discrete time series defined on t =
    0, ± 1, ± 2, ... is defined in Equation 1.25 to be


    $P(f) = \sum_{k=-\infty}^{\infty} \gamma(k) e^{-2\pi i f k}$

    (12.7)


    for −0.5 < f < 0.5. However, for time series whose autocorrelation changes with
    time, Condition 3 in (12.1) does not hold. Letting γ(t₁, t₂) denote the autocovariance
    between Xₜ₁ and Xₜ₂ the discrete Wigner–Ville spectrum can be defined by


    $W(t, f) = \sum_{k=-\infty}^{\infty} \gamma(t + k/2,\ t - k/2) e^{-2\pi i f k}$

    (12.8)


    If Xₜ is approximately stationary in a neighborhood of t, then γ(t + k/2, t −
    k/2) can be approximated by use of a (time domain) window centered at t, see Martin
    and Flandrin (1985) and Boashash (2003). Figure 12.3c and d shows the Wigner–Ville
    time–frequency representation associated with the data in Figure 12.2a and b,
    respectively. It is seen that the information concerning time–frequency relationships
    are consistent with those shown using the Gabor spectrum shown in Figure 12.3a
    and b. Similarly, the Wigner–Ville plot in Figure 12.4b for the chirp data shows
    the same linearly increasing time–frequency relationship shown in Figure 12.4a.


    **Using R:** The Gabor transform can be obtained using function cgt in the package
    Rwave which is available on CRAN, and the Wigner–Ville plot can be obtained using
    the tswge function wv.wge. See Appendix 12B for more details.


