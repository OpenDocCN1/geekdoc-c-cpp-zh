- pgno: 403
  md: '$B$, but is not exactly equal to it. As mentioned in General Comment 4, the
    YW and Burg estimates will always produce a stationary AR model. Studies have
    also shown that ML estimates of $\phi_1$ in the AR(1) model $(1-\phi_1B)X_t=a_t$,
    where $\hat{\phi}_1\approx 1$ tend to have a negative bias (Kang, 1992). Thus,
    the fact that $|\hat{\phi}_1|<1$ is not sufficient evidence of a stationary AR(1)
    model, nor does the fact that all roots of $1-\hat{\phi}_1z-\cdots-\hat{\phi}_pz^p=0$
    fall outside the unit circle imply that the underlying model is stationary.


    # 8.3.2 Identifying Nonstationary Component(s) in a Model


    General comment 5 has been demonstrated in Examples 3.14, 5.5, and 5.6 where we
    noticed that time series models with near unit roots have realizations whose characteristics
    are dominated by this nonstationary (or near-nonstationary) behavior. For example,
    in Example 5.5, we considered the model $(1-\alpha_1B)(1-1.2B+0.8B^2)X_t=a_t$,
    where $\alpha_1=0.8$, $0.95$, and $0.995$. We noticed that as $\alpha_1\to 1$
    (i.e., as the associated root of the characteristic equation approached $+1$),
    the realizations were characterized by aimless wandering behavior with no attraction
    to a mean level and theoretical autocorrelations that tend to damp slowly. We
    note that sample autocorrelations will tend to have a similar behavior but will
    often damp more quickly than theoretical autocorrelations. In that example, we
    also noted that stationary features of the model may not be apparent because of
    the dominance of the near unit root. Similarly, in Example 5.6, we examined an
    AR(3) model $(1-0.8B)(1-1.34B+0.995B^2)X_t=a_t$ with a pair of complex roots close
    to the unit circle and noted that the realization and autocorrelations had a cyclic
    behavior and that the autocorrelations damped slowly. Additionally, the realization
    and autocorrelations showed very little evidence of the $1-0.8B$ factor. The behavior
    of the autocorrelations is consistent with the results of the Findley–Quinn theorem
    (Theorem 5.1).


    It is common practice to make a decision concerning inclusion of a factor of $1-B$
    based on examination of realizations and sample autocorrelations. Realizations
    with wandering or piecewise trending behavior along with slowly damping sample
    autocorrelations suggest a unit root of $+1$, that is, that a nonstationary factor
    of $1-B$ should be included in the model (e.g., see Box et al., 2008, p. 197).
    The classical Box–Jenkins procedure is then to stationarize the'
