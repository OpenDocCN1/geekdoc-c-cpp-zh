    and ρ_k satisfies. ρ_k = C₁ r₁^{-k}, k > 0 Also, for an AR(1) model, r₁ = 1 /
    φ₁, so this can be rewritten


    ρ_k = C₁ φ₁^{k},   k > 0. (3.51)


    Since ρ₀ = 1, it follows from Equation 3.50 that ρ₁ - φ₁ ρ₀ = 0. Thus, ρ₁ = φ₁,
