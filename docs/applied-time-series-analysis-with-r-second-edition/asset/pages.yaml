    # 7.5.3 Asymptotic Comparisons of Estimators for an MA(1)


    Although the various estimation techniques discussed in this chapter for estimating
    the parameters of an AR process produce asymptotically equivalent estimators,
    this is not true for estimators of the parameters of an MA process. To see this,
    we examine the MA(1) process, X_t = a_t - θ₁ a_{t-1}. In Example 7.6, we found
    that the MLE of \hatθ₁ is asymptotically normal with asymptotic variance given
    by (1 - θ₁²)/n. The innovations and MM estimators are also asymptotically normal,
    and the asymptotic variances for the MM, innovations, and ML estimators are given
    in Table 7.3 (see Brockwell and Davis, 1991). From the table, it is seen that
    for an MA(1)


    Asyvar{\hatθ₁^{MM}} > Asyvar{\hatθ₁^{(I)}} > Asyvar{\hatθ₁^{ML}}.


    In Table 7.4, these asymptotic variances (multiplied by n) are shown for various
    values of θ₁.


    # TABLE 7.3


    Asymptotic Variances for Estimators of θ₁


    | Estimator | Asymptotic Variance |

    |---|---|

    | Methods of moments: $\hatθ₁^{MM}$ | $\frac{(1+θ₁²+θ₁⁴+θ₁⁶+θ₁⁸)}{n(1-θ₁²)}$ |

    | Innovations: $\hatθ₁^{(I)}$ | $\frac{1}{n}$ |

    | Maximum likelihood: $\hatθ₁^{ML}$ | $\frac{(1-θ₁²)}{n}$ |


    # TABLE 7.4


    Asymptotic Variance and Efficiency Ratios for Estimates of θ₁ for Various Values
