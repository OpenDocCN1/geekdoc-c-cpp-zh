  md: '# 5.5 G-Stationary Models for Data with Time-Varying Frequencies


    Figure 1.26a shows a bat echolocation signal that has strong cyclic behavior but
    for which it was previously noted that the cycle length increases with time. This
    is an example of time-varying frequency (TVF) data, a property shared by a variety
    of other natural signals, such as chirps, Doppler signals, and seismic signals.
    Figure 5.7a shows seismic surface wave data from a mining explosion (collected
    at seismic station MNTA in Wyoming) that consist of 700 measurements with a sampling
    rate of 0.1 s. Examination of the data shows that the periodic behavior is compacting
    in time, that is, the dominant frequency in the data is increasing with time.
    Figure 5.7b shows a Doppler signal that dramatically demonstrates frequency behavior
    that is decreasing with time. These signals are not well modeled using ARMA(p,q)
    models that are designed to model stationary behavior. Historically, TVF data
    have been analyzed using windowing techniques that break the data into windows
    sufficiently small that “stationarity” within the window is a reasonable approximation.
    However, if the frequencies are changing sufficiently fast (as in the Doppler
    signal), then such a procedure is problematic at best.


    ![](img/a0e0259119deb8c7b41dfd4f664e541d_275_0.png)


    # FIGURE 5.7


    Two examples of TVF data: (a) MNTA seismic data and (b) Doppler data.


    In Chapter 12, we discuss the short-term Fourier transform and wavelet techniques
    for dealing with TVF data. If the frequencies in the data are changing in time
    in a smooth manner as is the case in the three TVF realizations shown in Figures
    1.26a and 5.7, then the data can be modeled using G-stationary models. These are
    models for which the data are nonstationary, but an appropriate'
