  md: 'AR(2) and AR(9) fits to the sunspot data using the corresponding factor tables
    given in Tables 9.2 and 9.3. Not surprisingly, the AR(2) model has a pair of complex
    roots associated with a system frequency f = 0.092. It is clear that no AR(2)
    model with a system frequency near f = 0.1 can also have another system frequency
    of f = 0. (Why?) Notice that the spectral density estimates in Figure 9.11a are
    consistent with this observation. Table 9.3 shows that the roots closest to the
    unit circle in the AR(9) model are a pair of complex conjugate roots with a system
    frequency f = 0.095, and the second nearest root to the unit circle is a positive
    real root. The roots associated with the system frequency f = 0.095 have absolute
    reciprocal 0.98. Thus, the associated spectral estimates from realizations from
    the AR(9) model will have sharper peaks than those from the AR(2) model where
    the absolute reciprocal of the corresponding roots is 0.83. Additionally, the
    sample autocorrelations from the AR(9) model would be expected to damp more slowly
    than those for the AR(2) model as is seen in Figure 9.10. The positive real root
    in the AR(9) model has absolute reciprocal 0.94, and other factors are associated
    with roots much further removed from the unit circle. As a consequence, if it
    is determined that the peak at f = 0 in the spectral density estimator in Figure
    9.7c for the sunspot data is real, then the AR(9) model is the clear choice.


