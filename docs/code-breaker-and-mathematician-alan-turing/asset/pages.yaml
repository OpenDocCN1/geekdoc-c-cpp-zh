- pgno: 7
  md: '# chapter 1


    ![](img/b6985fd51cd2047b301cffc43001c007_7_0.png)


    # BUDDING

    BRILLIANCE


    Mathematician Alan Turing showed that ideas could be as powerful as weapons. Combining
    his math and science talents with a passion to help his country, he found a way
    to help Britain and its allies win World War II (1939–1945).'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Alan was born in London, England, on June 23, 1912. Alan’s parents soon went
    back to India, where Alan’s father worked for the government. Alan and his brother
    did not live with their parents. The boys lived with family friends and grew up
    in England.


    ![](img/b6985fd51cd2047b301cffc43001c007_8_0.png)


    London, England, in 1912'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Alan began attending Hazelhurst, a boarding school in Sussex, when he was nine
    years old. He lived and studied there. Alan loved math and science, and he spent
    most of his free time thinking about the subjects. He even did his own chemistry
    experiments. But his abilities were often unrecognized by his teachers and classmates.


    ![](img/b6985fd51cd2047b301cffc43001c007_9_0.png)


    Alan''s brother, John, also went to school at Hazelhurst.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/b6985fd51cd2047b301cffc43001c007_10_0.png)


    Alan was especially fascinated with plants. Alan''s mother sketched a picture
    of him gazing at daisies while he was supposed to be playing field hockey with
    Hazelhurst classmates. Alan also enjoyed reading a book called *Natural Wonders
    Every Child Should Know* by Edwin Tenney Brewster. It was a well-known science
    book that covered the similarities and differences between living things.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Alan’s mother was not pleased that her son enjoyed science so much. Science
    was not considered a proper course of study for young British gentlemen. Schools
    at the time valued subjects such as Latin and English literature. She worried
    he would not be accepted into a good school after leaving Hazelhurst.


    # DIFFICULT STUDENT


    His mother had no reason to worry. At thirteen, Alan was accepted to the Sherborne
    School, a well-regarded British


    institution. There, he kept digging into his interest in science on his own. He
    read Albert Einstein’s general theory of relativity. The theory was Einstein’s
    idea of


    ![](img/b6985fd51cd2047b301cffc43001c007_11_0.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'how gravity works. He said that objects bend, or curve, time

    and space depending on how much mass they have. Gravity

    is the result of these curves. Despite the complex nature

    of the theory, Alan’s notes on the subject proved that he

    understood it.


    Alan was clearly intelligent. But his teachers didn’t see it.

    They called his schoolwork careless and sloppy, and he was so

    far behind in some subjects that he almost wasn’t allowed to

    take his final exams.


    # PROVING HIMSELF


    But Alan took his exams. He passed and graduated from

    Sherborne School. Then he went to King’s College in

    Cambridge. His teachers there were more accepting of his

    interest in math and science. He began to think about more

    complex mathematical ideas, such as **statistics**. Turing rowed,

    sailed, and ran to clear his mind when he wasn’t studying.


    After graduating in 1934, Turing stayed at the college

    as a **fellow**—a scholar who works at a college. He studied

    **probability** theory. This branch of mathematics has to do with

    how likely it is that random events will occur. In 1936, Turing

    won a Smith’s Prize from the University of Cambridge for his

    work in probability theory.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/b6985fd51cd2047b301cffc43001c007_13_0.png)


    Turing ran for fun and also competed in races during his time at King''s College


    # # CODE-BREAKING


    Turing was out running one day when he got an idea he just had to write down.
    He thought it might be possible to build a computing machine that could solve
    math problems by itself.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Turing imagined his machine reading a set of instructions for solving math
    problems. The instructions would be on a length of tape. The tape would have squares
    on it. Some squares would be blank. Others would be marked with characters such
    as 1 or 0. The machine would read the numbers on the tape and be able to calculate
    answers to difficult problems.


    ![](img/b6985fd51cd2047b301cffc43001c007_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The machine Turing had in mind was a thought experiment. He didn’t think it
    could really be built. He worked alone and didn’t realize other mathematicians
    were working on similar ideas.


    In 1936, Turing published a paper about a math problem. To solve the problem,
    he wrote about a computing machine. The paper was the first explanation of how
    such a machine could be programmed. He didn’t know it then, but the paper would
    be groundbreaking in the world of mathematics.


    # PREPARING FOR WAR


    The same year he published his paper, Turing began


    # COMPUTER PIONEER


    Turing’s idea for instructions for a computing machine is the basis for modern
    computer languages. Most computer languages are translated by the machine into
    a series of 1s and 0s called a binary code. By reading the order of the binary
    code, the computer can follow complex instructions.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'attending Princeton University in New Jersey. He studied mathematics and, later,
    **cryptography**. His interest in cryptography grew from frightening current events
    during the 1930s.


    Princeton University is one of the oldest colleges in the United States. It began
    accepting students in 1746.


    ![](img/b6985fd51cd2047b301cffc43001c007_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/b6985fd51cd2047b301cffc43001c007_17_0.png)


    Adolf Hitler (right) became the leader of Germany in 1933.


    While Turing was studying at King''s College and Princeton, Adolf Hitler rose
    to power to become the dictator of Germany. Hitler and the Nazi Party had plans
    to expand into other countries through military force. Britain was likely to go
    to war against Germany. Like many others throughout Europe and the world, Turing
    was scared. But he knew that knowledge of cryptography could be useful in a war.


    In 1938, Turing graduated from Princeton. He was offered a position at the university
    and could have stayed in the United States. Instead, he returned to Cambridge
    and then began'
  merge: -1
  img_proc: true
- pgno: 18
  md: "work at the Government Code and Cypher School. It wasn't really a school but\
    \ rather a secret code-breaking organization started during World War I (1914–1918).\
    \ It gathered intelligence about the enemy to keep Britain safe.\n\nThe Germans\
    \ **enciphered** their military messages. That prevented their enemies from reading\
    \ them and learning their plans. In 1938, a team of mathematicians in Poland designed\
    \ a machine called Bomba. It **deciphered** codes and allowed the mathematicians\
    \ to unlock and read entire coded messages written by the German military. It\
    \ worked as long as the Germans followed a certain pattern when creating their\
    \ messages each day.\n\nSoon enough, the Germans changed their method of creating\
    \ codes so Bomba could not crack them. Bomba would still prove to be useful, however.\
    \ It would become an important part of Turing's code-breaking work during World\
    \ War II.\n\n# TECH TALK\n\n> “Turing invented the idea of software, essentially.\
    \ It’s software that’s really the important invention.”\n> \n> —Freeman Dyson,\
    \ physicist"
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/b6985fd51cd2047b301cffc43001c007_19_0.png)


    # BUILDING

    THE BOMBE


    On September 1, 1939, Germany invaded Poland. Two days later, France and Britain
    declared war on Germany. World War II had begun. Turing’s work in math and cryptography
    suddenly became urgent and an important part of the war effort.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Britain and its allies, including the United States, wanted to decode Germany’s
    messages to prevent surprise attacks. But the Germans had a secret weapon on their
    side: the Enigma machine. Invented by a German engineer, the Enigma machine could
    encipher code that was impossible for human code-breakers to crack.


    ![](img/b6985fd51cd2047b301cffc43001c007_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The Enigma machine looked similar to a typewriter—machines with keyboards that
    people used to write on before computers were developed. It had a keyboard and
    several rotating wheels. When messages were typed on the keyboard, the wheels
    turned and changed letters to scramble messages. The machine was able to scramble
    letters in so many different ways that code-breakers could not possibly try them
    all. And the settings were changed each day to create an entirely new code.


    # GUESSING GAME


    Turing had some clues about how to crack the Enigma code.


    ![](img/b6985fd51cd2047b301cffc43001c007_21_0.png)


    He knew that certain words and phrases were common in messages the Germans sent.
    For example, many messages were about the weather. Commonly used words such as
    *wettervorhersage*, or weather forecast, could be deciphered. These were called
    cribs. A crib can help unlock the rest of the text in a message.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'By studying captured German intelligence, Turing also learned that the Enigma
    machine would never encipher a letter as itself. It would always be a different
    letter in a scrambled message. The Germans made their machine work this way on
    purpose, thinking it would make the messages harder to unscramble. But knowing
    a letter would never be coded as itself was a clue that Turing used to create
    cribs.


    ![](img/b6985fd51cd2047b301cffc43001c007_22_0.png)


    ```

    1827 3225?M 41626? 4981

    SEXTO


    HÖR? D?R? D?C - 1346 - ?TL? - 2?L 224 - H?W X?...

    DKSR? CUZ?F? B?DC? - ?D?D? D?Z?H D?ON?K JCK?GO

    E?W?K XDJ?F E?G?N O?N?Q C?L?X F?D?R BT?W G?E?CK

    C?Y?K K?T?F G?D?P W?C?H? Q?X?F E?Y?U V?C?Y P?C?Q

    E?B?E N?Q?K L?W?R L?G?KZ BP?WR G?Y?G W?G?A Q?X?Y

    R?O?J P?S?L W?Z?J? H?H?G Y?C?Q R?N?R Q?I?Q? Q?S?H

    L?L?H L?H?D Q?F?W J?G?X Q?W?T


    CCT 2/3 R?G?N

    1852 F?L?

    ```


    > “Scrambled German messages such as this one were commonly intercepted by British
    agents.”'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'These clues helped Turing make educated guesses about how the Enigma code could
    be cracked. They were bits of information that helped form a mathematical solution
    in his mind. But they were not enough to break the code.


    # CRACKING THE CODE


    The main obstacle to cracking the Enigma code was the number of possibilities
    that existed. There were too many for a code-breaker to test. But Turing believed
    a machine could do what humans could not.


    He built a machine called the Bombe based on the Polish Bomba. The Bombe was made
    of rotors and switches that acted like thirty-six Enigma machines. The parts moved
    quickly to test thousands of different letter combinations.


    # THE BOMBE


    The Bombe was an enormous machine. It was about 7 feet (2.1 m) wide, 6.5 feet
    (2 m) tall, and weighed 1 ton (0.9 t). It used 12 miles (19 km) of wiring and
    contained ninety-seven thousand parts.'
  merge: -1
  img_proc: true
- pgno: 24
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/b6985fd51cd2047b301cffc43001c007_25_0.png)


    People in London celebrate VE Day, or Victory in Europe Day, on May 8, 1945.


    # AFTER THE WAR


    World War II ended with Germany’s defeat in 1945. The Bombe played a major role
    in the outcome. Messages deciphered by the Bombe told about the enemy’s movements
    and plans. Some experts believe the fighting would have'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'continued for two more years without Turing’s Bombe. They estimate two million
    more people would have died in the war.


    Britain recognized Turing’s efforts. He was honored as an Officer of the Most
    Excellent Order of the British Empire. After the war, he continued working in
    his field. At the National Physical Laboratory in London, Turing designed the
    Automatic Computing Engine. It was the first computer design that could store
    digital programs.


    ![](img/b6985fd51cd2047b301cffc43001c007_26_0.png)


    Turing’s Automatic Computing Engine was first put to use in 1950.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # THE TURING TEST


    In 1948, Turing became deputy director of the Computing Machine Laboratory at
    the University of Manchester. There, he developed ideas for computer software
    and artificial intelligence. He created the Turing test to study artificial intelligence.


    The Turing test was an experiment to see if a computer’s artificial intelligence
    could really think for itself. A person acting as a judge received messages on
    a computer screen. Some messages came from another person. Others were from the
    computer. If the judge mistakenly believed the computer-generated messages came
    from a human at least half the time, it could be assumed that the computer was
    intelligent. Forms of the Turing test are still used to judge a computer’s thinking
    ability.


    # ### TECH TALK


    > > “A computer would deserve to be called intelligent if it could deceive a human
    into believing that it was human.”

    > >

    > > —Alan Turing'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/b6985fd51cd2047b301cffc43001c007_28_0.png)


    # FINAL CONTRIBUTIONS


    In 1952, Turing turned his attention to biology and how things grow. His interest
    in the subject went back to his childhood, when he’d been fascinated with plants.
    As an adult, he had new ideas that explained how patterns in living things develop
    mathematically. He published a paper on his ideas, focusing on daisies.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "Around this time, Turing’s work was interrupted. In England\nin the 1950s,\
    \ it was against the law to be homosexual. Turing\nwas homosexual. In 1952, he\
    \ was convicted of the crime of\nbeing homosexual. He lost his security clearance.\
    \ He could no\nlonger work in cryptography for the government.\n\n# DEATH AND\
    \ HONOR\n\nTuring died of cyanide poisoning in June 1954. Many people\nbelieve\
    \ he committed suicide. But his death may have been\naccidental. Turing often\
    \ used cyanide in experiments at home.\nHe may have swallowed the poison or inhaled\
    \ its vapors\nby mistake.\n\nAfter his death, the British government recognized\
    \ that Turing\nhad been mistreated when he had been convicted of a crime.\n\n\
    # TECH TALK\n\n> “I believe that at the end of the [twentieth] century\n> the\
    \ use of words and general educated opinion\n> will have altered so much that\
    \ one will be able to\n> speak of machines thinking without expecting to be\n\
    > contradicted.”\n> \n> —Alan Turing"
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/b6985fd51cd2047b301cffc43001c007_30_0.png)


    People pray at the “Arthur Young Memorial,” Manchester England. It was unveiled
    in 2001.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'In 2009, British prime minister Gordon Brown offered an official apology to
    Turing on behalf of the government. In 2013, Queen Elizabeth II formally pardoned
    him for his criminal conviction.


    Turing continues to be honored and respected for his work. He helped save the
    world from Nazi aggression, and he sparked new ideas about math, science, and
    technology.


    ![](img/b6985fd51cd2047b301cffc43001c007_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # TIMELINE


    +   - **1912** — Alan Turing is born.


    +   - **1934** — Turing graduates from King''s College.


    +   - **1938** — Turing graduates from Princeton University.


    +   - **1939** — World War II begins.


    +   - **1945** — World War II ends.


    +   - **1950** — Turing develops the Turing test.


    +   - **1952** — Turing loses his security clearance after being convicted of
    a crime for being homosexual.


    +   - **1954** — Turing dies.


    +   - **2009** — Britain''s prime minister officially apologizes to Turing.


    +   - **2013** — Queen Elizabeth II formally pardons Turing.'
  merge: -1
  img_proc: true
