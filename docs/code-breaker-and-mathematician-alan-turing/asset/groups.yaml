    \n## 词汇表\n\n- **密码学**：研究信息编码或解码的科学\n- **破译**：将代码转换为普通文本\n- **加密**：将普通文本转换为代码\n\
    - **研究员**：在学院工作的学者\n- **概率**：某事发生的可能性\n- **统计学**：对大量数值数据进行科学研究的学科\n\n## 更多信息\n\
    \n### 图书\n\n- 特里·伯罗斯。*密码、暗号与制图学：数学走向战争*。明尼阿波利斯：勒纳出版公司，2018年。探索数学如何在战场上使用。\n- 斯图尔特·A.\
