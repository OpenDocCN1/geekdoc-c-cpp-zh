    2018年5月25日\n\n![](img/b6985fd51cd2047b301cffc43001c007_39_0.png)\n\n你是否曾希望自己能成为英雄来帮助自己的国家？艾伦·图灵小时候就对数学和科学着迷。后来，图灵的数学技能帮助英国赢得了第二次世界大战。\n\
    \n图灵的父母和老师认为，他最好放弃数学，转而学习更符合绅士身份的人文学科，比如文学和拉丁语。但他坚持了下来，到1939年第二次世界大战爆发时，他已准备好迎接国家面临的最大挑战：纳粹德国。图灵运用自己高深的数学知识来破译德国秘密信息。他的思想不仅帮助英国扭转了战争局势——还为现代计算和人工智能的许多方面奠定了基础。\n\
