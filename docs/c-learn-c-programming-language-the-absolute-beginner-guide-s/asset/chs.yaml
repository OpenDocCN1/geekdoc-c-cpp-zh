  \n\n\n\n\nC 支持所有的基础算术运算符。下表显示了所有的基础算术运算符。![](img/image311.jpg) \n\n## 关系运算符\n下表显示了\
  \ C 支持的所有关系运算符![](img/image317.jpg)\n\n## 逻辑运算符\nC 语言支持以下 3 种逻辑运算符。假设 `a = 1` 且\
  \ `b = 0`![](img/image323.jpg)\n\n## 位运算符\n位运算符在位层级上对信息进行操作。这些运算符还执行了从右到左的位移。位运算符不应用于\
  \ `float` 或 `double`（这些是数据类型，我们将在下一个教程中学习它们）。![](img/image330.jpg) \n\n现在让我们来看下位运算符\
  \ `&`、`|` 和 `^` 的真值表![](img/image335.jpg)\n\n## 赋值运算符\nC 语言支持的赋值运算符如下所示![](img/image341.jpg)\n\
  \n## 条件运算符\nC 语言中的条件运算符最广为人知的有许多名称：\n\n### 三元运算符 `? :` 运算符\n在 C 语言的高级认知处理中，我们倾向于使用真正的\
  \ `if` 条件，但由于处理条件运算符不当，我们倾向于将 `if` 条件语句转换为一个简洁且易用的运算符。\n\n条件运算符的语法是 `:expression\
  \ 1 ? expression 2: expression 3`\n\n解释：\n*   语法中的标点符号 `?` 代表 `if` 部分。\n*   第一个\
  \ `(expression 1)` 通常返回真或假，这决定了是否要执行 `(expression 2)` 或 `(expression 3)`。\n*   如果\
  \ `(expression 1)` 返回真，则执行 `\" : \"` 左侧的表达式，即 `(expression 2)`。\n*   如果 `(expression\
  \ 1)` 返回假，则执行 `\" : \"` 右侧的表达式，即 `(expression 3)`。\n\n特殊运算符：![](img/image359.jpg)\n\
  \n## C 语言中的数据类型\n数据类型规定了我们倾向于向程序输入什么信息，以及我们输入什么类型的数据。C 语言具有一些预定义的信息类型集合，用于处理我们在程序中使用的各种形式的数据。这些数据类型具有完全不同的存储容量。\n\
  \nC 语言支持两种完全不同的信息类型：\n\n1.  **基本信息类型**：\n    这些是 C 中的基础信息类型，特别是 `整数(int)`、浮点型(float)`、字符(char)`\
  \ 和 `void`。\n\n2.  **派生信息类型**：\n    派生信息类型是基本数据类型，但经过了处理或分类，如 `数组(array)`、结构体(structure)`、联合(union)\
  \ 和指针(pointer)。这些将在稍后详细介绍。\n\n数据类型决定了变量可以持有的信息种类。如果变量 `x` 被断为 `int`，这意味着 `x` 将仅持有数值。程序中使用的每个变量都应该声明它是什么数据类型![](img/image376.jpg)\n\
  \n### 整数类型\n整数用于存储整数值。16 位机器上整数类型的大小和范围：\n\n| 类型 | 大小(字节) | 范围 |\n| :--- | :---\
  \ | :--- |\n| `int` 或 `signed int` | 2 | -32,768 到 32,767 |\n| `unsigned int` |\
  \ 2 | 0 到 65535 |\n| `short int` 或 `signed short int` | 1 | -128 到 127 |\n| `unsigned\
  \ short int` | 1 | 0 到 255 |\n| `long int` 或 `signed long int` | 4 | -2,147,483,648\
  \ 到 2,147,483,647 |\n| `unsigned long int` | 4 | 0 到 4,294,967,295 |\n\n### 浮点类型\n\
  浮点类型用于存储实数。16 位机器上整数类型的大小和范围：\n\n| 类型 | 大小(字节) | 范围 |\n| :--- | :--- | :--- |\n\
  | `Float` | 4 | 3.4E-38 到 3.4E+38 |\n| `Double` | 8 | 1.7E-308 到 1.7E+308 |\n| `long\
  \ double` | 10 | 3.4E-4932 到 1.1E+4932 |\n\n### 字符类型\n字符类型用于存储字符值。16 位机器上整数类型的大小和范围：\n\
  \n| 类型 | 大小(字节) | 范围 |\n| :--- | :--- | :--- |\n| `char` 或 `signed char` | 1 | -128\
  \ 到 127 |\n| `unsigned char` | 1 | 0 到 255 |\n\n### void 类型\n`void` 类型意味着没有值。这通常用于指定不返回任何内容的类型。当我们开始学习\
  \ C 语言更高级的主（如函数、指针等）时，我们将熟悉这种数据类型。\n\n## C 语言中的变量\n当我们需要在计算机/笔记本上存储任何信息（数据）时，我们倾向于将其存储在计算机的内存区域。与其记住我们持有信息的内存区域的高级地址，我们的软件提供了一个创建文件夹并对其命名的选择，这样对于用户来说就更容易了。\n\
  \n数据类型决定了变量可以持有的信息种类。如果变量 `x` 被断言为 `int`，这意味着 `x` 将仅持有数值。程序中使用的每个变量都应该声明它是什么数据类型。\n\
  \n### 变量的数据类型\nC 语言中的变量必须有一个类型，这定义了变量可以持有什么类型的信息。可以是：\n*   `char`：持有一个字符。\n*   `int`：持有一个整数。\n\
  *   `float`：持有一个浮点数。\n*   `double`：持有双精度浮点数。\n*   `void`\n\n### 变量命名规则\n1. 变量名不能与数字开头。\n\
  2. 变量名允许字母、数字和下划线等特殊符号。\n3. 变量名不允许包含空格或区域。\n4. 关键字不能作为变量名。\n5. 大写和小写被视为完全不同，因为 C\
  \ 是大小敏感的，因此建议变量使用小写。\n\n### 变量的声明、定义和初始化\n变量的声明应该在程序中使用之前完成。声明将完成以下工作：\n1. 它告诉编译器变量名是什么。\n\
  2. 它指定了变量可以持有什么类型的信息。\n3. 在变量声明之前，编译器不需要担心为变量分配内存区域。\n4. 声明在很大程度上告知编译器程序存在一个具有以下数据类型的变量。\n\
  5. 变量被认为是通过 Dr. 关键字定义的，在 `main()` 函数之外。\n\n\n\n\n\n![](img/image575.jpg)\n# 变量与标识符的区别？\n\
  \n符号（Symbol）可以是给任何编程语言中任何变量 ![](img/image582.jpg)、函数、结构体、指针或其他实体的名称。而变量（Variable），正如我们在本教程中简单学到的，可以是一个命名的内存位置，用于存储程序内使用的数据。\n\
  \n## C 语言的输入与输出\n\n输入（Input）意味着为程序提供一些数据供程序使用，而输出（Output）意味着在屏幕上显示数据或将信息写入打印机或文件。C\
  \ 这种语言提供了几个内置函数，用于扫描任何给定的输入，并在需要输出结果时在屏幕上显示信息。在本教程中，我们将介绍这些函数，它们可能被用于我们的程序，以要求用户输入并在屏幕上输出结果。这些内置函数都包含在\
  \ C 头文件中，我们在讨论相关内容时，还会额外指定概述所选操作的头文件名称。\n\n## scanf() 和 printf() 函数\n\n标准输入输出头文件\
  \ `stdio.h` 包含了 `printf()` 和 `scanf()` 函数的定义，它们分别用于在屏幕上显示输出和从用户处获取输入![](img/image597.jpg)。当你编译上述代码时，它会提示你输入一个值。在你输入该值后，它会在屏幕上显示你已插入的值。你必须猜测\
  \ `scanf()` 或 `printf()` 函数中参数的目的是。它被称为格式字符串（format string），它告诉 `scanf()` 操作期望什么种类型的输入，而在\
  \ `printf()` 中，它将向编译器提供提示，期望什么样的输出![](img/image603.jpg)。我们还可以通过在格式字符串中添加变化（如 `\"\
  \"` 或 `\"%3s\"`）来限制输入或输出的数字或字符数量，第一个建议一个数字，第二个意味着三个字符，因此如果你尝试输入四十二，而 `scanf()` 使用了\
  \ `\"\"`，它将只会四四输入。输出的情况也是如此。\n\n在 C 语言中，PC 监控器、打印机等输出设备被视为文件，向这些设备写入输出的方法与向文件写入输出的方法相同。\n\
  \n**注意**：`printf()` 操作返回它写入的字符数量，而 `scanf()` 返回它扫描的字符数量。\n\n```c\nint i = printf(\"\
  studytonight\");\n```\n在这个程序中，`printf(\"studytonight\");` 可以返回十二作为结果，这可以保存在变量 `i`\
  \ 中，因为 studytonight 有十二个字符。\n\n## getchar() & putchar() 函数\n\n`getchar()` 操作从关联的终端读取一个字符并将其作为一个数字返回。该操作一次只读取一个字符。你会在循环中使用这种技术，以防你想要扫描多个字符。`putchar()`\
  \ 操作在屏幕上显示传递给它的字符并返回一个相似的字符。该操作也一次只显示一个字符。如果你想显示多个字符，请在循环中使用 `putchar()` 技术![](img/image613.jpg)\n\
  \n## gets() & puts() 函数\n\n`gets()` 操作从 `stdin`（标准输入）读取一行到 `str` 指针指向的缓冲区中，直到遇到终止换行符或\
  \ EOF（文件结束）为止。`puts()` 操作将字符串 `str` 及其随后的换行符写入 `stdout`（标准输出）。`str` → 这可以是指向字符数组的指针，C\
  \ 字符串存储在该处。（如果你现在不知道这个，请忽略。）\n\n```c\n#include<stdio.h>\nvoid main() {\n/* 长度为 100\
  \ 的字符数组 */\nchar str[100];\nprintf(\"Enter a string\");\ngets( str );\nputs( str\
  \ );\ngetch();\n}\n```\n当你编译上述代码时，它会提示你输入一个字符串。一旦你输入了字符串，它就会显示你已输入的值。\n\n### scanf()\
  \ 和 gets() 的区别\n\n这两个函数之间的主要区别是 `scanf()` 一旦遇到空格就会停止读取字符，而 `gets()` 也会将空格视为字符读取。\n\
  如果你在 `scanf()` 中输入 `Study Tonight`，它只会扫描并存储 `Study`，并留下空格后的部分。然而，`gets()` 操作可以完全扫描它。\n\
  \n## C 语言中的决策\n\n决策处理通过支持以下语句来处理决策：\n\n*   `if` 语句\n*   `switch` 语句\n*   条件运算符语句\
  \ (`? : 运算符`）\n*   `goto` 语句\n\n## 使用 if 语句进行决策\n\n`if` 语句也可以根据测试条件的复杂性以多种形式强制执行。各种形式包括：\n\
  \n*   简单 `if` 语句\n*   `if....else` 语句\n*   嵌套 `if....else` 语句\n*   使用 `else if`\
  \ 语句\n\n### 简单 if 语句\n简单 `if` 语句的一般形式是![](img/image652.jpg)\n\n### if...else 语句\n\
  简单 `if...else` 语句的一般形式是![](img/image658.jpg)\n\n### 嵌套 if....else 语句\n嵌套 `if....else`\
  \ 语句的一般形式是![](img/image665.jpg)\n如果 `if` 表达式为假，则语句块 3 将无效，否则执行继续并进入主 `if` 以执行下一个\
  \ `if` 块的检查，如果 `if` 表达式为真则执行语句块 1。\n示例![](img/image672.jpg)\n\n### else if 阶梯\n\
  else if 阶梯的一般形式是![](img/image678.jpg)[](image682.jpg)\n\n### 注意事项\n在 `if` 语句中，一个语句可以不包含在大括号内，如果我们在\
  \ if 条件内有多个语句，那么我们需要将它们包含在大括号内。\n```c\nint a = 5;\nif(a > 4)\nprintf(\"success\"\
  );\n```\n在上面的例子中，不需要大括号；但如果我们在 if 条件内有多个语句，那么我们需要将其包含在大括号内。`==` 应该用于 if 条件表达式中的比较，如果你使用\
  \ `=` 表达式始终为真，因为它执行的是赋值而不是比较。除了 `0`(零)，所有其他值都被视为真。\n```c\nif(27)printf(\"hello\"\
  );\n```\n\n## C 语言中的 switch 语句\n\n当你需要解决多个选择问题时，例如：菜单之类的程序，每个价格与一个选择相关，且你一次只想决定一个，这时使用\
  \ `switch` 语句。`switch` 语句可以是一种管理语句，允许我们在许多决策中只决定一个。`switch` 中的表达式求出一个关联的整数值，然后与许多\
  \ case 中的值进行比较。它执行与 case 价格匹配的代码块。如果没有匹配，则执行 `default` 块（如果存在）。\n\n### 使用 switch\
  \ 语句的规则\n\n1.  `switch` 关键字后面的表达式应该产生一个整数值，即表达式应该是整数、变量或一个求值为整数的表达式。\n2.  `case`\
  \ 标签值应该是独特的。\n3.  `case` 标签应以冒号(:) 结束。\n4.  后续的一行，即 `case` 语句，通常可以是任何有效的 C 语句。\n\
  \n\n\n\n\n![](img/image721.jpg)据称，由于仅匹配了主 case，输出仅为 A；然而，由于后续块中没有 `break` 语句，随后的代码块也是死代码，直到遇到\
  \ `case` 语句或执行到达 switch 块的顶部。一旦上述任何 `case` 都不匹配 switch 表达式，`default` 情况就会变成死代码。`default`\
  \ 情况可以放置在 switch case 内部的任何位置。尽管我们往往倾向于不使用 `default` 情况，但 switch 语句是可以正常工作的。switch\
  \ 语句允许嵌套，这意味着你可以在另一个 switch 块中包含上一个 switch 语句。然而，应该避免嵌套 switch 语句，因为这会让程序变得更加复杂且不够清晰。示例：\n\
  \n```c\n#include<stdio.h>\nvoid main ( ){\n    int a, b, c, choice;\n    while (choice\
  \ != 3 )\n    {\n        /* Printing the available options */\n        printf (\
  \ \"\\n 1\\. Press 1 for addition\" );\n        printf ( \"\\n 2\\. Press 2 for\
  \ subtraction\" );\n        printf ( \"\\n Enter your choice\" );\n        /* Taking\
  \ users input */\n        scanf ( \"%d\" , &choice);\n        switch (choice)\n\
  \        {\n            case 1 :\n                printf ( \"Enter 2 numbers\" );\n\
  \                scanf ( \"%d%d\" , &a, &b);\n                c = a + b;\n     \
  \           printf ( \"%d\" , c);\n                break ;\n            case 2 :\n\
  \                printf ( \"Enter 2 numbers\" );\n                scanf ( \"%d%d\"\
  \ , &a, &b);\n                c = a - b;\n                printf ( \"%d\" , c);\n\
  \                break ;\n            default:\n                printf ( \"you have\
  \ passed a wrong key\" );\n        }\n        printf ( \"\\n press any key to continue\"\
  \ );\n    }\n}\n```\n\n\n\n\n\n![](img/image844.jpg)\n\n## 嵌套循环\n我们也可以使用嵌套 for 循环，即在一个\
  \ for 循环内部另一个 for 循环。基本语法如下，\n![](img/image849.jpg)\n输出：\n1213214321\n\n## do while\
  \ 循环\n在某些情况下，我们需要在测试条件之前执行循环体。这类情况可以通过 `do-while` 循环的辅助来处理。`do` 语句首先评估循环体，然后在 `while`\
  \ 语句检查条件。这意味着即使 `while` 中的初始条件被初始化为假，循环体也至少会执行一次。通用语法如下，\n![](img/image860.jpg)\n\
  \n## 跳出循环\n有时，当循环遇到死循环时，有必要跳过循环的邻区域，或者当边界条件变为真时跳出循环。这通常被称为跳出循环。\n\n### 1) break\
  \ 语句\n当在循环中遇到 `break` 语句时，循环将立即退出，程序将继续执行循环之后的语句。\n![](img/image869.jpg)\n\n###\
  \ 2) continue 语句\n它导致管理跳转到测试条件处继续循环方法。遇到 `continue` 时，指针将离开当前的循环周期，并开始下一个周期。\n![](img/image876.jpg)\n\
  \n## C 语言中的数组\n在 C 语言中，数组被称为结构化信息类型。关联数组被定义为有限的有序实体信息集合，存储在连续的内存位置。\n这里，`finite`\
  \ 意味着信息应该是有限的。`ordered` 意味着信息应该存储在连续的内存地址中。`homogenous` 意味着信息应该是相同的数据类型。\n数组的用途示例包括：存储工人或学生姓名列表、存储学生的成绩、或存储数字或字符列表等。由于数组提供了表示信息的直接方式，它被归类为\
  \ C 中的信息结构。C 中的其他信息结构有结构、列表、队列、树等。数组不仅可以表示简单的信息列表，还可以表示 2 维或 3 维的数据表。\n\n## 声明关联数组\n\
  与任何变量一样，数组在使用之前应该被声明。数组声明的通用样式为：\n`data-type variable-name[size];`\n```c\n/* 数组声明示例\
  \ */\nint arr[10];\n```\n![](img/image897.jpg)\n这里 `int` 是数据类型，`arr` 是数组名称，`ten`\
  \ 是数组的大小。这意味着数组 `arr` 将仅包含十个 `int` 类型的组件。关联数组的索引从零开始到 size-1，即 `arr` 数组的第一部分存储在\
  \ `arr[0]` 地址，因此最后一个元素可以占用 `arr[9]`。\n\n## 关联数组的初始化\n关联数组断言后应该被初始化。否则，它将包含垃圾值（任何随机值）。关联数组通常在编译时或运行时进行初始化。\n\
  \n### 编译时数组\n数组元素的编译时格式与普通变量初始化相同。数组格式的种类为：\n![](img/image907.jpg)\n\n### 运行时数组数据格式\n\
  数组甚至可以通过使用 `scanf()` 执行在运行时进行初始化。这种方法通常用于初始化大型数组，或使用用户给的值初始化数组。示例：\n```c\n#include\
  \ <stdio.h>\nvoid main(){\n    int arr[4];\n    int i, j;\n    printf(\"Enter array\
  \ element\");\n    for(i = 0; i < 4; i++){\n        scanf(\"%d\", &arr[i]); // 运行时数组数据格式\n\
  \    }\n    for(j = 0; j < 4; j++)\n}\n```\n\n## 二维数组\nC 语言支持多维数组。三维数组的类型是二维数组。每一行和每一列的索引都从零开始。\n\
  二维数组的声明如下：\n`data-type array-name[row-size][column-size]`\n```c\n/* 示例 */\nint a[3][4];\n\
  ```\n![](img/image932.jpg)!\n![](img/image938.jpg)\n\n## 字符串和字符数组\n字符串可以是被视为一个知识项的字符序列，并以空字符\
  \ `'\\0'` 终止。注意 C 语言不支持字符串作为一种信息类型。字符串在 C 语言中实际上是一维字符数组。这些通常用于产生有意义且易读的程序。\n例如：字符串\
  \ `\"hello world\"` 包含十二字符加上编译器在字符串末尾机械添加的 `'\\0'` 字符。\n\n## 初始化字符串变量\n有多种方法初始化字符数组变量。\n\
  ```c\nchar name[13] = \"StudyTonight\"; // 有效的字符数组初始化\nchar name[10] = \"\"; //\
  \ 有效的初始化\n```\n记住，一旦通过逐个列出所有字符来初始化字符数组，你就显式地提供 `'\\0'` 字符。\n字符数组错误初始化的示例为：\n```c\n\
  char ch[3] = \"hell\"; // 错误\nchar str[4];\nstr = \"hell\"; // 错误\n```\n\n## 字符串输入和输出\n\
  输入执行 `scanf()` 可以用于格式化地从终端扫描字符串输入。然而，`scanf()` 执行有一个缺点，它会在遇到第一个空白区域时终止其输入。因此，如果你尝试使用\
  \ `scanf()` 执行扫描输入字符串 `\"Hello World\"`，它只会扫描 greeting 并在遇到空白区域时终止。\n然而，C 语言支持一种名为\
  \ `%[..]` 的格式规范转换代码，它可以读取包含一系列字符（包括空格）的行。\n```c\n#include <stdio.h>\n#include <string.h>\n\
  void main() {\n    char str[20];\n    scanf(\"%[^\\n]\", str);\n    printf(\"%s\"\
  , str);\n}\n```\n从终端扫描带有空格的字符字符串的另一种技术是使用 `gets()` 执行。\n```c\nchar text[20];\ngets(text);\n\
  printf(\"%s\", text);\n```\n\n## 字符串处理函数\nC 语言支持广泛的字符串处理函数，可以用于执行许多字符串操作。这些函数封装在\
  \ `string.h` 库中。因此，你需要将 `string.h` 头文件引入你的程序以使用这些函数。\n![](img/image969.jpg)![](img/image973.jpg)![](img/image977.jpg)![](img/image981.jpg)\n\
  \n## C 中的存储类\n在 C 语言中，每个变量包含一个存储类，决定了后续事项：\n\n*   作用：变量的值在程序的何处可以获取。\n*   默认初始值：如果我们倾向于不明确初始化该变量，它的默认初始值是什么。\n\
  *   变量的寿命：该变量可以存在多久。\n\n以下存储类在 C 编程中使用：\n\n*   自动变量\n*   外部变量\n*   静态变量\n*   寄存器变量\n\
  \n*   自动变量：自动 vehicle\n\n*   作用：具有自动存储类的变量对于其定义的代码块是原生的。\n\n\n\n\n\n### 自动变量\n**默认初始值**:\
  \ 任意随机值，即垃圾值。\n**生命周期**: 直到函数/方法块的结束，无论变量在何处定义。\n\n在函数内部声明且没有指定存储类别的变量默认关联为自动变量。它们在函数命名时被创建，并在函数执行完成时被机械销毁。由于它们是局限于函数的，自动变量也称为局部变量。默认情况下，编译器为它们分配垃圾值。\n\
  \n```c\n#include\nvoid main(){\n    int detail;\n    // or\n    automotive vehicle\
  \ int details; // 两者相同\n}\n```\n\n### 外部或全局变量\n**作用域**: 全局，即程序内的任何地方。这些变量似乎不被任何函数固定，在任何地方都可以获取。\n\
  **默认初始值**: 0（零）。\n**生命周期**: 直到程序执行结束，你都可以访问全局变量。\n\n在任何函数之外定义的变量可以是全局变量。全局变量在整个程序执行过程中保持可用。默认情况下，全局变量的初始值为\
  \ 0（零）。关于全局变量需要记住的一个重要问题是，它们的值会被程序内的任何函数修改。\n\n![](img/image1014.jpg)\n\n### extern\
  \ 关键字\n`extern` 关键字与变量一起使用，告知编译器该变量在其他地方声明。`extern` 声明不会为变量分配存储。\n\n![](img/image1021.jpg)\n\
  ![](img/image1026.jpg)\n\n### 静态变量\n**作用域**: 局限于变量定义的块\n**默认初始值**: 0（零）。\n**生命周期**:\
  \ 直到整个程序执行结束。\n\n静态变量告诉编译器持久/保存变量直到程序结束。而不是在每次进入和离开作用域时创建和销毁变量，静态变量只初始化一次并一直存在到程序结束。静态变量根据声明的位置，可能是内部的或外部的。内部静态变量的作用域限制在定义它的函数内。外部静态变量限制在声明它们所在的作用域内。编译器为它们分配零（零）作为默认值。\n\
  \n```c\n#include\nvoid test(); // 函数声明声明（在下一个主题中讨论）\nint main()\nvoid test()\n1\
  \ 2 3\n```\n\n### 寄存器变量\n**作用域**: 局限于声明它的函数。\n**默认初始值**: 任意随机值，即垃圾值。\n**生命周期**:\
  \ 直到定义它的函数/方法块结束。\n\n寄存器变量告诉编译器将变量存储在主机寄存器而不是内存中。寄存器变量的访问速度比标准变量更快。通常，频繁使用的变量会被保持在寄存器中。然而，通常有很多变量被放在寄存器中。寄存器存储类的一个应用通常是在循环体中，在循环中，变量在程序中*非常、非常*短的时间内被多次使用。\n\
  \n**注意**: 我们永远无法获取此类变量的地址。\n**语法**: `register int number;`\n\n**注意**: 尽管我们将变量种类的存储类声明为寄存器，但我们倾向于无法确定变量的值是否会存储在寄存器中。这可能是因为主机的寄存器数量是有限的。此外，主机寄存器旨在处理大量的关键工作。因此，通常不是空闲的。在这种情况下，变量的作用就像它的存储类是自动变量一样。\n\
  \n### 应该何时使用何种存储类？\n为了提高程序的执行速度并仔细利用变量占据的内存空间，在选择存储类时应记住以下几点：\n\n- 只有当我们希望变量的值在每次调用完全不同的函数时保持不变时，我们才使用\
  \ `static` 存储类。\n- 我们只应该对那些在程序中被频繁使用的变量使用 `register` 存储类。主机寄存器是有限的，因此应该仔细使用。\n-\
  \ 我们只应该对那些被程序内大多数函数使用的变量使用 `external` 或国际/全局存储类。\n- 如果我们没有上述任何存储类的目标，那么我们必须始终使用\
  \ `automated`（自动）存储类。\n\n## 函数\nC 语言中的函数可以是执行特定任务的代码块。在某些情况下，我们可能被迫在一个极其复杂的程序中多次编写相同的代码。这可能导致代码的冗余重复、错误，甚至让应用的科学家感到无聊。因此，C\
  \ 语言提供了一种方法，你可以在一个函数内声明并定义一组语句，并在需要时经常引用和使用。\n\n这些由用户定义的函数被理解为用户定义函数。C 函数通常分为两类：\n\
  1. 库函数\n2. 用户定义函数\n\n![](img/image1064.jpg)\n\n### 库函数\n库函数是已经在 C 库中定义的函数，例如 `printf()`、`scanf()`、`strcat()`\
  \ 等。你只需要包含相应的头文件来使用这些函数。这些已经在 C 库中声明并定义。\n\n### 用户定义函数\n另一方面，用户定义函数是用户在编写程序时定义的函数。这些函数是为了代码的可复用以及节省时间和空间。\n\
  \n## 使用函数的好处\n- 它为程序的结构提供了模块化。\n- 它使你的代码可复用。你只需要在需要的地方通过函数名调用它。\n- 对于具有成上万行代码的大程序，使用函数会让调试和编辑变得更容易。\n\
  - 它让程序更具可读性且易理解。\n\n## 函数声明\n函数定义的通用语法为，\n`returntype functionName(type1 parameter1,\
  \ type2 parameter2,...);`\n\n与任何变量或数组一样，函数在使用之前应该被声明。函数声明告知编译器有关函数名、参数以及返回类型的信息。函数体可以单独定义。它也被称为函数原型。函数声明由四个部分组成：\n\
  \n- 返回类型\n- 函数名\n- 参数列表\n- 终止标点符号\n\n\n\n\n\n### 返回类型\n`retntype` 当一个 `perform`\
  \ 被断言执行某种类型的计算或任何操作，并预测会在末尾产生某些结果时，在这种情况下，`return` 语句是 `perform` 体末端的另一个语句。`return`\
  \ 类型指定了 `perform` 预计返回给调用它的程序（称为函数）的值类型（`int`、`float`、`char`、`double`）。注意：万一你的 `perform`\
  \ 没有返回任何值，`return` 类型将是 `void`。\n\n### 函数名\n`functionName` 名称是一个标识符（AN symbol），它指定了\
  \ `perform` 的名称。`perform` 的名称可以是任何有效的 C 符号，因此应该遵循与 C 语言中备用变量类似的命名规则。\n\n### 参数列表\n\
  参数列表声明了 `perform` 在被调用时所期望的参数类型和范围。此外，参数列表内的参数在 `perform` 被命名后会接收参数值。它们通常被称为形式参数。\n\
  \n# AN 示例\n让我们写一个带有 `main()` `perform` 的简单程序，以及一个用户定义的用于两个两个数字的 `perform`，该 `perform`\
  \ 可以从 `main()` `perform` 中调用![](img/image1095.jpg)\n\n## 函数定义语法\n就像上面的示例一样，`perform`\
  \ 定义的整体语法如下：\n\n```c\nretntype functionName(type1 parameter1, type2 parameter2,...){\n\
  // perform body goes here}\n```\n\n第一行 `retntype functionName(type1 parameter1,\
  \ type2 parameter2,...)` 被理解为 `perform` 头部，同时大括号之间的语句被称为函数体。注意：在形状构建一个 `perform`\
  \ 时，`perform` 头部内的括号后面没有分号（`;`），这不像在声明 `perform` 或函数的某行工作时那样的。\n\n### 函数体\n`perform`\
  \ 体包含了执行所需任务所需的声明和语句（算法）。函数体在大括号处结束，并由 3 个部分组成：\n1. 局部变量声明（如果需要）。\n2. 在 `perform`\
  \ 内部执行任务的函数语句。\n3. `return` 语句，用于返回函数计算的结果（如果 `return` 类型是 `void`，则不需要 `return`\
  \ 语句）。\n\n### 调用 perform\n当一个 `perform` 被命名时，程序的管理权将转移到 `perform`。\n\n```\nfunctionName(argument1,\
  \ argument2,...);\n```\n\n在上面的示例中，`main()` `perform` 内部的语句 `multiply(i, j);` 就是调用。\n\
  \n### 向 perform 传递参数\n参数是在调用过程中给的值，而形式参数是在构建 `perform` 时声明的![](img/image1119.jpg)\n\
  \n函数可以有参数但没有返回类型。并没有必要要求如果一个函数接受参数，它也必须返回结果![](img/image1123.jpg)\n\n在声明 `perform`\
  \ 时，我们声明了两个个类型为 `int` 的参数 `a` 和 `b`。因此，在执行 `perform` 的工作行中，我们想要传递 2 个参数，否则我们将得到编译错误。因此，传递的\
  \ 2 个参数应当在 `perform` 定义中接收，这意味着函数定义中的 `perform` 头部应当有 2 个参数来携带参数值。这些接收到的参数也被称为形式参数。在声明、执行工作行和处理\
  \ `perform` 时变量的名称通常是完全不同的。\n\n### 从 perform 返回值\n`perform` 可以也可以不返回结果。然而，如果会返回，我们倾向于使用\
  \ `return` 语句来输出结果。`return` 语句同时结束 `perform` 的执行，因此它应该是任何 `perform` 的最后一个语句。如果你在\
  \ `return` 语句之后编写任何语句，它将不会被执行![](img/image1130.jpg)\n\n使用 `return` 语句返回的值类型应与函数声明和定义中提到的\
  \ `return` 类型相同。如果任何一个不匹配，你将得到编译错误。\n\n在下一个教程中，我们将学习 C 语言中用户定义函数的不同类型，以及用于递归的函数嵌套概念。\n\
  \n## C 语言中用户定义函数的类型\n通常有四种不同的用户定义函数，它们是：\n1. 无参数无返回值的函数\n2. 无参数有值的函数\n3. 有参数无返回值的函数\n\
  4. 有参数有返回值的函数\n\n下面，我们将讨论这些种类，并结合程序示例。\n\n## 无参数无返回值的函数\n此类函数要么用于显示数据，要么完全用于用户输入。下面是一个相关的\
  \ `perform` 示例，它从用户处接收一对数字作为输入，并显示其中较大的那一个![](img/image1147.jpg)\n\n## 无参数有返回值的函数\n\
  我们修改了上面的示例，使函数 `greatNum()` 返回两个输入数字中较大的那个![](img/image1153.jpg)\n\n## 有参数无返回值的函数\n\
  我们再次使用相同的 `perform` 示例，以演示获取一个结果通常有许多不同的方法。这次，我们更改了之前的示例，创建的 `perform` `greatNum()`\
  \ 接收 2 个 `int` 值作为参数，但它不会返回任何东西![](img/image1161.jpg)\n\n## 有参数有值的函数\n这是最好的类型，因为这种类型与输入输出完全独立，逻辑定义在函数内部![](img/image1168.jpg)\n\
  \n## 函数嵌套\nC 语言允许函数嵌套，即在另一个函数的体内部调用一个函数。我们倾向于小心处理嵌套函数，否则结果会导致无限嵌套。\n\n`function1()`\n\
  如果 `function2()` 内部包含一个 `function1()`，那么在这种情况下，它会导致无限嵌套。它们将一直相互调用，直到你强制退出程序。\n\n\
  ## 什么是递归？\n递归是一种特殊的函数嵌套方式，函数在其内部调用它自己。我们倾向于在函数内部设置边界条件来中断公式，否则公式可能会无限发生![](img/image179.jpg)\n\
  \n### 示例：使用递归计算数字阶乘![](img/image1184.jpg)\n\n## C 语言中的函数调用类型\n函数是通过它们的名称命名的，我们倾向于都理解这一点，那么这个教程是为了什么？嗯，如果\
  \ `perform` 没有任何参数，你可以可以直接使用它的名称来调用函数。对于带参数的函数，我们可以通过 2 种替代方式调用函数，然而我们需要指定参数，而这\
  \ 2 种方式分别是：\n\n*   按值传递\n\n*   按引用传递\n\n\n\n\n\n## 值传递 (Call by value)\n按值调用函数意味着，我们倾向于将所持有或派生的参数值传递到函数的的形式参数中。因此，初始值保持不变，只有函数内部的参数发生变化。\n\
  \n在这种情况下，特定变量 `x` 不会被修改的。这可能是因为我们倾向于按值传递参数，因此 `x` 的副本被传递给函数执行，该副本在整个函数执行过程中都会被更新，而函数内部追踪的副本在函数结束（离开作用域）时就会被销毁。因此\
  \ `main()` 函数中的变量 `x` 很少被修改，因此仍然保持值为 10。\n\n但我们能够修改此程序，让函数修改第一个 `x` 变量，通过创建一个名为\
  \ `calc()` 的函数返回，并将该值存储在 `x` 中。\n\n## 引用传递 (Call by Reference)\n在引用传递中，我们倾向于将变量的地址（引用）作为参数传递给任何函数。当我们传递任何变量的地址作为参数后，函数就可以访问我们的变量，因为它现在知道变量存储在哪里，因此将简单地更新它的值。\n\
  \n在这种情况下，形式参数可以被视为引用或指针（不用担心指针，我们现在将学习它们），在每种情况下它们都会修改初始变量的值。\n\n## 如何在 C 中将数组传递给函数\n\
  每当我们想在 C 语言中将一个组件列表作为参数传递给任何函数时，最好尝试通过利用数组来实现。然而，我们何时会倾向于将数组作为参数传递给函数呢？让我们看看是如何做的。\n\
  \n## 定义以数组作为参数的函数\n有 2 种可行的方法来尝试这样做，一种是通过值传递，另一种是通过使用引用传递。\n\n我们可以将关联数组作为参数。\n```c\n\
  int total (int arr[]);\n```\n或者，我们在参数列表中有一个指针，来承载我们数组的底地址。\n```c\nint total (int*\
  \ ptr);\n```\n等我们学习指针后，可以详细研究第二种方法。\n\n## 从函数返回关联数组\n我们不从函数返回数组，而是倾向于返回一个持有数组底地址的指针。然而，我们应该确保在函数结束时该数组是存在的，即该数组不是函数局部的。\n\
  ```c\nint* total (int x[])\n```\n等我们学习了指针和数组后，我们可以讨论这个问题。\n\n## 将数组作为参数传递给函数\n现在让我们看一些示例，我们将一个数组部分作为参数传递给函数、一个一维数组传递给函数以及一个二维数组传递给函数。\n\
  \n### 将数组部分传递给函数\n让我们写一个非常直观的程序，我们在 `main()` 函数中声明一个整数关联数组，并将数组的一个部分传递给一个函数，该函数能够简单地打印该部分的值。\n\
  \n### 将完整的一维数组传递给函数\n为了理解如何做到，让我们写一个函数来计算数组所有元素的平均值并打印它。我们只发送数组名作为参数，这无非是数组起始元素的地址，或者我们可以说是起始内存地址。\n\
  \n### 将多维数组传递给函数\n在这里，我们只传递数组名作为参数。\n\n## C 结构体 (C Structures)\n结构可能是 C 语言中一种用户定义的知识类型，允许我们混合各种类型的数据。结构有助于构建一种更有实质内容的复杂知识类型。它有点像关联数组，关联数组仅持有相同类型的知识；而结构相反，将存储任何类型的知识，这非常有用。\n\
  \n例如：如果我确实需要写一个程序来存储学生信息，包含学生的姓名、年龄、专业、永久地址、父亲姓名等，包括字符串值、数字值等，我是否能使用数组来实现呢？我将需要一个可能持有各种类型知识的东西。在结构中，知识是以记录的形式存储的。\n\
  \n## 定义结构\n`struct` 关键字用于概述一个结构。`struct` 定义了一种替换的知识类型，可以是基本和派生数据类型的组合。\n\n正如你在上面的语法看到的，我们倾向于以\
  \ `struct` 关键字开始，然后给你的结构命名是可选的（我们建议给它一个名字），然后在大括号内，我们需要说明所有的成员变量，这些都是各种类型的 C 语言变量，如\
  \ `int`、`float`、`array` 等。在结束大括号之后，我们将指定一个或多个结构变量，这通常也是可选的。\n\n注意：结构类型声明中的结束大括号后面应该跟一个分号（`;`）。\n\
  \n### 结构示例\n这里 `Student` 声明了一个结构来携带学生的详细信息，包含四个信息字段，特别是姓名、年龄、专业和性别。这些字段被称为结构组件或成员。每个成员将完全不同的数据类型，例如在本例中，姓名是字符关联数组，年龄是\
  \ `int` 类型等。`Student` 是该结构的名称，被称为结构标签。\n\n## 声明结构变量\n可以在结构定义时或结构定义后声明结构变量。结构变量声明与普通数据类型的声明类似。结构变量将以两种方式声明：\n\
  1) 单独声明结构变量\n2) 与结构定义一起声明\n这里 `S1` 和 `S2` 是 `Student` 结构类型的变量。\n\n## 访问结构成员\n结构成员将在运行时被访问和赋值。给结构成员赋值应使用点运算符\
  \ `.`。\n\n## 结构初始化\n像其他数据类型的变量一样，结构变量也可以在编译时初始化。\n```c\nstruct Patient{\n    float\
  \ height;\n    int weight;\n    int age;\n};\nstruct Patient p1 = {180.75, 73, 23};\n\
  ```\nstruct Patient p1;\np1.height = 180.75; p1.weight = 73; p1.age = 23;\n\n##\
  \ 结构数组\n我们也可以声明结构数组，其中数组的每个元素代表结构变量。示例：`struct employee[5];`\n```c\n#include<stdio.h>\n\
  struct Employee{\n    char ename[10];\n    int sal;\n};\nstruct Employee emp[5];\n\
  int i, j;\nvoid ask() {\n    for(i = 0; i < 3; i++){\n        printf(\"\\nEnter%d\
  \ Employee record:\\n\", i+1);\n        scanf(\"%s\", emp[i].ename);\n        printf(\"\
  \\nEnter Salary:\\t\");\n        scanf(\"%d\", &emp[i].sal);\n    }\n    printf(\"\
  \\nDisplaying Employee record:\\n\");\n    for(i = 0; i < 3; i++){\n        printf(\"\
  \\nEmployee name is %s\", emp[i].ename);\n        printf(\"\\nSalary is %d\", emp[i].sal);\n\
  \    }\n}\nvoid main(){\n    ask();\n}\n```\n\n## 嵌套结构 (Nested Structures)\nC 语言也允许结构的嵌套。嵌套结构意味着一个结构另一个结构作为成员变量。示例：\n\
  ```c\nstruct Student{\n    char[30] name;\n    int age;\n};\nstruct Address{\n \
  \   char[50] locality;\n    char[50] city;\n    int pincode;\n}addr;\n```\n\n##\
  \ 结构作为函数参数\n我们可以像传递其他变量或数组一样将结构作为函数参数传递。示例：\n```c\n#include<stdio.h>\nstruct Student{\n\
  \    char name[10];\n    int roll;\n};\nvoid show(struct Student st){\n    printf(\"\
  \\nstudent name is %s\", st.name);\n    printf(\"\\nroll is %d\", st.roll);\n}\n\
  void main(){\n    struct Student std;\n    printf(\"\\nEnter Student record:\\n\"\
  );\n    printf(\"\\nStudent name\\t\");\n    scanf(\"%s\", std.name);\n    printf(\"\
  \\nEnter Student roll.:t\");\n    scanf(\"%d\", &std.roll);\n    show(std);\n}\n\
  ```\n\n## typedef\n`typedef` 是 C 语言中用于为现有数据类型分配不同名称的关键字。它主要用于数据类型，一旦命名，在程序中使用变得稍微简单。以下是\
  \ `typedef` 的通用语法：\n`typedef unsigned long ulong;`\n让我们看关联示例以及 `typedef` 是如何工作的。符号通常定义\
  \ `unsigned long` 变量。`ulong i, j;`\n\n### typedef 的应用\n`typedef` 也可以给用户定义的类型命名。让我们看看它在结构中的用法。\n\
  ```c\ntypedef struct{\n    int member1;\n    int member2;\n    int member3;\n} type_name;\n\
  ```\n`type_name` 代表与其相关的结构定义。现在这个 `type_name` 可以用来声明此结构的变量 `type_name t1, t2;`\n\
  \n### 使用 typedef 定义结构\n让我们通过简单的代码示例来理解如何使用 `typedef` 关键字在 C 中定义结构。\n```c\n#include<stdio.h>\n\
  #include<string.h>\ntypedef struct employee{\n    char name[50];\n    int salary;\n\
  }emp;\nvoid main( ){\n    emp e1;\n    printf(\"\\nEnter Employee record:\\n\");\n\
  \    printf(\"\\nEmployee name\\t\");\n    scanf(\"%s\", e1.name);\n    printf(\"\
  \\nEnter Employee salary: \\t\");\n    scanf(\"%d\", &e1.salary);\n    printf(\"\
  \\nstudent name is %s\", e1.name);\n    printf(\"\\nroll is %d\", e1.salary);\n\
  }\n```\n\n### typedef 和指针\n`typedef` 也可以用于给指针分配别名。在这里我们有一种情况在指针声明期间使用 `typedef`\
  \ 是有利的。指针 `*` 绑定在右侧而不是左侧。\n```c\nint* x, y;\n```\n通过这个声明语句，我们实际上将 `x` 声明为 `int`\
  \ 类型指针，而 `y` 将声明为普通的 `int`。\n```c\ntypedef int* IntPtr;\nIntPtr x, y, z;\n```\n\n\
  ## 联合体 (Unions)\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n```\n联合体在概念上和结构体一样。声明/定义联合体的语法也和结构体相同。唯一的区别在于存储。结构体的每个成员都有自己的存储，而联合体的所有成员共享同一个存储位置。\n\
  ```c\nunion item{\n    int m;\n    float x;\n    char c;\n};\n\n\n\n\n* `Pointers`（指针）在处理\
  \ `Arrays`（数组）和 `Structures`（结构体）时非常高效。\n* `Pointers` 允许引用操作，从而有助于作为参数传递给不同的函数。\n\
  * 它还缩短了程序的长度及其执行时间。\n* 它允许 `C` 语言支持动态内存管理。\n* 在下一个教程中，我们将学习指针的语法、如何声明和轮勒指针，以及如何使用指针。下个教程见。\n\
  \n## 在 C 中声明、初始化和使用指针变量\n\n## C 指针变量的声明\n指针声明的通用语法是 `datatype *pointer_name;`\n\
  指针的数据类型应当保持一致，因为指针变量所指向的变量知识类型是明确的。`void` 类型的指针适用于所有类型的数据，但通常不使用。以下是几个示例：\n```c\n\
  int *ip // 指向整数变量的指针\nfloat *fp; // 指向浮点变量的指针\ndouble *dp; // 指向双精度变量的指针\nchar *cp;\
  \ // 指向字符变量的指针\n```\n\n## C 指针变量的初始化\n指针的数据格式是将变量的地址赋值给指针变量的方法。指针变量将仅包含相同类型变量的地址。在\
  \ `C` 语言中，使用地址运算符 `&` 来获取变量的地址。`&`（紧跟变量名）返回与该变量相关的地址。\n\n```c\n#include\nvoid main(){\n\
  \    int a = 10;\n    int *ptr; // 指针声明\n    ptr = &a; // 指针数据格式\n}\n```\n指针变量指向相同数据类型的变量。让我们来看一个示例来展示这一点：\n\
  ```c\n#include\nvoid main(){\n    float a;\n    int *ptr;\n    ptr = &a; // 错误，类型不匹配\n\
  }\n```\n如果你在声明时不确定将哪个变量的地址分配给指针变量，建议为指针变量分配一个 `NULL` 值。分配了 `NULL` 值的指针被称为 `NULL`\
  \ 指针。\n\n```c\n#include\nint main()\n```\n\n## 使用指针或对指针解引用\n一旦指针分配了变量的地址，为了访问变量的值，需要对指针进行解引用，使用间接运算符或解引用运算符\
  \ `*`。\n\n```c\n#include\nint main()\n    可以打印 'a' 的值\n    printf(\"%d\", *&a);\
  \ // 这也会打印 'a' 的值\n    printf(\"%u\", &a); // 这打印 'a' 的地址\n    printf(\"%u\", p);\
  \ // 这也会打印 'a' 的地址\n    printf(\"%u\", &p); // 这打印 'p' 的地址\n    return 0;\n}\n```\n\
  \n### 使用指针时需要记忆的点\n* 在声明/初始化指针变量时，`*` 表示该变量是一个指针。\n* 任何变量的地址通过在变量名前加上标点符号 `&` 来给出。\n\
  * 指针变量存储变量的地址。声明 `int *a` 并不意味着 `a` 包含整数值。它意味着 `a` 包含存储整数变量的地址。\n* 要访问指针变量所持有的精确地址的值，使用\
  \ `*`。在这里，`*` 通常被读为“……处的值”。\n\n## 示例时间！\n让我们来看一个简单的代码示例：\n```c\n#include\nint main()\n\
  \    int ten; // 存储值为 10 的传统整数变量\n    int *a; // 因为使用了 '*'，所以它是一个指针变量\n    /*'&'\
  \ 返回指针变量 'a' 中持有的变量 'i' 的地址*/\n    a = &i;\n    /*下方显示由指针变量 'a' 所持有的变量 'i' 的地址*/\n\
  \    printf(\"Address of variable i is %u\\n\", a);\n    /*下方，'*a' 被读作 'a 处的值' 即\
  \ ten*/\n    printf(\"Value at the address, that is hold on by pointer variable\
  \ a is %d\\n\", *a);\n    return 0;\n}\n```\n输出：\n`Address of variable i is 2686728\
  \ (地址可能会变化)`\n`Value at an address, which is stored by pointer variable a is 10`\n\
  \n## C 中的二级指针（双指针）\n指针通常存储相同数据类型不同变量的地址。然而，如果你想存储一个指针变量的地址，那么你还需要另一个指针来存储它。因此，当一个指针变量存储另一个指针变量的地址时，它被称为二级指针或双指针。\n\
  \n语法：`int **p1;`\n在这里，我们使用了 2 个间接运算符(`*`）来存储并指向指针变量 `i` 的地址，即 `int *`。如果我们想存储这个（双指针）变量\
  \ `p1` 的地址，语法将变为：`int ***p2;`\n\n表示二级指针的简单程序\n![](img/image1596.jpg)\n![](img/image1600.jpg)\n\
  上方程序的解释\n二级指针\n![](img/image1606.jpg)\n\n* `p1` 指针变量将仅持有变量 `a` 的地址（即间接运算符(`*`）数量减\
  \ 1 的变量）。同样，`p2` 变量将仅持有变量 `p1` 的地址。它不能持有变量 `a` 的地址。\n* `*p2` 提供 `p2` 指针所持地址处的值。`p2`\
  \ 存储 `p1` 指针的地址，而 `p1` 地址处的值就是变量 `a` 的地址。因此，`*p2` 打印 `a` 的地址。\n* `**p2` 将读作 `*(*p2)`。因此，它提供了\
  \ `*p2` 地址处的值。从上面的陈述中，你可以看出 `*p2` 就是变量 `a` 的地址。因此，`*p2` 地址处的值是十。因此，`**p2` 打印十。\n\
  \n\n\n\n\n# C 语言语言中的指针与数组\n\n当数组被声明时，编译器会分配足够的内存来存储数组的所有元素。编译器还会额外分配基地址，即数组起始部分的地址。\n\
  \n假设我们想要声明一个关联数组 `arr`，`int arr[5] = {1, 2, 3, 4, 5 };`。假设 `arr` 的起始地址是一千，且每个整数需要\
  \ `2` 字节，那么这 `5` 个部分将如下方式存储：\n\n![](img/image1619.jpg)\n\n这里变量 `arr` 将给出基地址，它是一个指向数组第一个元素\
  \ `arr[0]` 的常量指针。因此，`arr` 包含 `arr[0]` 的地址，即 `1000`。简而言之，`arr` 有两个作用——它既是数组的名字，又充当指向数组第一个元素的指针。默认情况下，`arr`\
  \ 等于 `&arr[0]`。\n\n我们也可以声明一个 `int` 类型的指针指向数组 `arr`。\n![](img/image1626.jpg)\n\n\
  现在我们能够通过 `p++` 访问数组 `arr` 的每个组件，从而从一个元素移动到另一个元素。注意：指针在递增后不能递减。`p--` 将不起作用。\n\n##\
  \ 指向数组的指针\n\n如上所示，我们能够使用指针指向数组，并可以使用该指针访问数组各个部分。让我们来看一个示例：\n![](img/image1634.jpg)\n\
  \n在上面的程序中，指针 `*p` 将逐一打印存储在数组中的值。我们也可以使用基地址（上例中的 `a`）作为指针并打印所有值。\n![](img/image1639.jpg)\n\
  \n## 指向多维数组的指针\n\n三维数组的类型为 `a[i][j]`。让我们看看如何构建一个指向此类数组的指针。正如大家所知，数组名提供了基地址。在 `a[i][j]`\
  \ 中，`a` 可以提供该数组的起始地址，即使 `a + 0 + 0` 也会提供起始地址，即 `a[0][0]` 部分的地址。\n\n这里是三维数组指针的通用类型：\n\
  `(*(a + i) + j)`\n这等同于 `a[i][j]`\n\n## 指针与字符串\n\n指针也可以用于创建字符串。`char` 类型的指针变量被视为字符串。\n\
  `char *str = \"Hello\";`\n\n上面的代码创建了一个字符串并将其地址存储在指针变量 `str` 中。指针 `str` 目前指向字符串 `\"\
  Hello\"` 的第一个字符。这里需要注意的另一个重要问题是，通过字符指针创建的字符串在运行时可能会被分配一个空间。\n\n```c\nchar *str;\n\
  str = \"hello\"; //这是合法的\n```\n\n字符串的内容可以通过 `printf()` 和 `puts()` 写入。\n```c\nprintf(\"\
  %s\", str);\nputs(str);\n```\n\n注意 `str` 是指向字符串的指针，它同时也是字符串的名字。因此，我们倾向于不使用间接运算符\
  \ `*`。\n\n## 指针数组\n\n我们也可以拥有指针数组。指针在处理具有不同长度行的字符数组时非常有帮助。\n![](img/image1662.jpg)\n\
  ![](img/image1667.jpg)\n\n在第二种方法中内存浪费更多，因此在这种情况下倾向于使用指针。当我们说内存浪费时，并不是字符串将占据更少的空间，不是的，字符将占据相同的空间，但当我们定义字符数组时，会分配一个等于数组最大尺寸的连续内存空间，这是一种浪费，如果使用指针就可以避免这一点。\n\
  \n## C 语言中指向结构体数组的指针\n\n就像整数数组、指针数组等一样，我们也会结构体变量数组。为了高效地使用结构体变量数组，我们倾向于使用结构体指针。我们甚至会有指向单个结构体变量的指针，但在处理结构体变量数组时它会被大量使用。\n\
  ![](img/image1674.jpg)\n![](img/image1679.jpg)\n\n## 使用指针访问结构体成员\n\n使用结构体变量访问成员时使用点运算符\
  \ `.`。但当我们有一个结构体类型的指针时，我们使用箭头 `->` 来访问结构体成员。\n![](img/image1685.jpg)\n\n## C 语言中的指针算术\n\
  \n如果你想完全掌握指针的数据，指针算术是至关重要的。在这个主题中，我们将学习在递增指针后内存地址是如何修改的。\n\n### 16 位机器 (Turbo C)\n\
  \n在 16 位机器中，各种类型指针（无论是 `int*`、`float*`、`char*` 还是 `double*`）的大小通常是一对字节。然而，一旦我们对指针执行任何递增等算术操作，变化将根据其原始数据类型的维度而发生。\n\
  \n16 位机器上数据类型的大小：\n![](img/image1695.jpg)\n\n如果你想拥有指针的完整信息，了解指针算术是极其必要的。在这个主题中，我们将学习在递增指针后内存地址是如何修改的。\n\
  \n### 32 位机器 (Visual Basic C++)\n\n指针算术的概念完全相同，但指针和各种数据类型的大小在 32 位机器上是不同的。32 位机器上的指针为\
  \ `4` 字节。\n\n下面是 32 位机器上数据类型的表格：\n![](img/image1705.jpg)\n\n注意：我们不能相加两个指针。因为指针包含地址，两个地址相加没有意义，因为你不知道它将指向哪里。但我们可以减去两个指针。因为两个指针之间的差表示两个指针之间可以存储的数据元素数量。\n\
  \n指针算术程序(32 位机器)\n![](img/image1713.jpg)\n![](img/image1717.jpg)\n\n对上面程序的解释：\n\n\
  *   第 1 点：这里 `*` 表示“给定地址的值”。因此，它加上了 `m` 和 `n` 的值，即十五。\n*   第 2 点：它减去两个变量的地址，然后除以指针类型的大小（这里是整数，大小为四字节），从而提供了它们之间存储的整数部分数量。\n\
  *   第 3 点：它根据其数据类型的大小（这里为 `4`）递增地址。\n*   第 4 点：它根据其数据类型的大小（这里为 `4`）递减地址。\n*   第\
  \ 5 点：不能相加两个指针。\n\n\n\n\n\n## C 语言中的指针作为函数参数\n\n指针作为操作参数用于携带在整个调用过程中传递的参数地址。这通常也被称为**引用传递**（decision\
  \ by reference）。一旦通过引用调用函数，对引用变量的任何修改都可能影响原始变量。\n\n## 示例时间：交换两个数字\n![](img/image1731.jpg)!(image1735.jpg)\n\
  \n## 返回指针变量的函数\n\n函数也可以向调用者返回一个指针。在这种情况下，你必须小心，因为函数的局部变量不会在函数外部存在。它们的作用域仅限于函数内部。因此，如果你返回一个连接到局部变量的指针，当函数结束时，该指针将指向空内容。\n\
  ![](img/image1742.jpg)\n\n### 获取可靠指针的 get 方法\n1. 在函数中使用参数。由于传递给执行函数的参数是在函数行内声明的，因此它们在函数执行完后外部也会继续存在。\n\
  2. 或者，在函数内部使用静态变量并返回它们。由于静态变量的生命周期持续到 `main()` 函数退出，因此它们在整个程序运行期间都是可用的。\n\n## 函数指针\n\
  \n可以声明指向函数的指针，该指针随后可以作为另一个函数的参数使用。指向函数的指针声明如下：\n\n```\ntype (*pointer-name)(parameter);\n\
  ```\n\n这里是一个示例：\n```c\nint (*sum)();   // 指向指针的合法声明\nint *sum();     // 这不是函数指针的声明\n\
  ```\n\n当函数指针被赋值为特定函数的名称时，它可以指向该特定函数。\n```c\nint sum(int, int);\nint (*s)(int, int);\n\
  s = sum;\n```\n在这里，`s` 是指向函数 `sum` 的指针。现在可以使用函数指针 `s` 配合提供的所需的参数值来调用 `sum`。\n```c\n\
  s (10, 20);\n```\n\n### 函数指针示例\n```c\n#include <stdio.h>\nint sum(int x, int y){\n\
  \    return x+y;\n}\nint main( ){\n    int (*fp)(int, int);\n    fp = sum;\n   \
  \ int s = fp(10, 15);\n    printf(\"Sum is %d\", s);\n    return 0;\n}\n```\n输出:\
  \ 25\n\n### 复杂的函数指针示例\n\n你会在到处发现复杂的函数指针示例，让我们来看其中一个示例并尝试理解它。\n```\nvoid *(*foo)\
  \ (int*);\n```\n它看起来很复杂，但其实很简单。在这种情况下，`(*foo)` 是指向函数的指针，其参数类型为 `int*`，返回类型为 `void*`。\n\
  \n## C 语言高级主题\n\n## C 语言中的文件输入输出\n\n文件代表磁盘上存储一组连接知识的字节序列。文件用于永久存储信息。它是一个预定义的结构。在\
  \ C 语言中，我们倾向于使用文件类型的结构指针来声明文件。\n\n```c\nFILE *fp;\n```\n\nC 提供了多种帮助执行基本文件操作的函数。以下是这些函数：\n\
  ![](img/image1791.jpg)\n\n### 打开文件或创建文件\n\n`fopen()` 用于创建新文件或打开已存在的文件。\n\n通用语法：\n\
  ```\n*fp = FILE *fopen(const char *filename, const char *mode);\n```\n在这里，`*fp`\
  \ 是 `FILE` 指针 (`FILE *fp`)，它将持有已打开（或创建）文件的引用。`filename` 是要打开的文件名，`mode` 指定了打开文件的目的。模式可以是以下类型：\n\
  ![](img/image1801.jpg)\n\n### 关闭文件\n\n`fclose()` 函数用于关闭已打开的相关文件。\n\n通用语法：\n```\n\
  int fclose( FILE *fp);\n```\n在这里，`fclose()` 函数关闭文件并在成功时返回零，如果在关闭文件时发生计算错误，则返回 `EOF`。这个\
  \ `EOF` 可能是头文件 `stdio.h` 中定义的常量。\n\n### 文件上的输入/输出操作\n\n在上面的表中，我们提到了用于对文件进行读写的各种文件\
  \ I/O 函数。`getc()` 和 `putc()` 是唯一可以浏览和向文件写入单个字符的函数。\n![](img/image1812.jpg)\n\n###\
  \ 使用 fprintf() 和 fscanf() 读写文件\n![](img/image1818.jpg)\n\n在这个程序中，我们创建了两个 `FILE`\
  \ 指针，每个指针都指向一个常量文件，但在不同的模式下操作。`fprintf()` 函数直接写入文件，而 `fscanf()` 从文件中读取，然后可以通过常用的\
  \ `printf()` 函数写入到控制台。\n\n## 追加模式与写入模式的区别\n\n写入 (`w`) 模式和追加 (`a`) 模式在打开文件时几乎相同。它们都将向文件中写入内容。在每种模式下，如果文件不存在，则会创建一个新文件。\n\
  它们唯一的区别是，当你以写入模式打开文件时，文件会被重置，导致文件中已有的任何信息被删除。而在追加模式下，这种情况不会发生。追加模式用于在文件的现有数据（如果有）之后追加或添加信息。因此，当你以追加\
  \ (`a`) 模式打开文件时，指示器将置于文件中这些信息的末。\n\n## C 语言中的错误处理\n\nC 语言没有提供任何用于错误处理的机制。但 `error.h`\
  \ 头文件中定义的许多方法和变量通常用于在操作执行语句期间处理错误。在 C 语言中，当发生任何错误时，操作返回 `-1` 或 `NULL` 值，并且一个全局变量\
  \ `errno` 与错误代码相关。这些返回值通常用于在编程时检查错误。\n\n### 什么是 errno？\n\n每当在 C 语言创建一个调用，都会关联一个名为\
  \ `errno` 的变量。它是一个全局变量，可能用于确定操作执行过程中遇到了什么种错误以及其代码。下面我们列出了错误编号及其含义。\n![](img/image1831.jpg)\n\
  \nC 语言使用以下函数表示与 `errno` 相关的错误消息：\n\n*   `perror()`：返回传递给它的字符串以及当前 `errno` 值的文本表示。\n\
  *   `strerror()` 定义在 `string.h` 库中。该方法返回指向当前 `errno` 值字符串表示的指针。\n\n\n\n\n\n![](img/image1840.jpg)\n\
  \n### 其他错误处理方法\n\n我们也可以在 `exit()` 函数中使用 `Exit Status` 常量来通知调用函数错误。可用的两个常量值是 `EXIT_SUCCESS`\
  \ 和 `EXIT_FAILURE`。它们只是定义在 `stdlib.h` 头文件中的宏。\n\n```c\n#include <stdio.h>\n#include\
  \ <errno.h>\n#include <stdlib.h>\n#include <string.h>\nextern int errno;\nvoid main(){\n\
  \    char *ptr = malloc( 1000000000UL); //请求分配 1gb 内存空间\n    if (ptr == NULL) //如果内存不可用，将返回\
  \ null\n    {\n        puts(\"malloc failed\");\n        puts(strerror(errno));\n\
  \        exit(EXIT_FAILURE); //退出状态失败\n    }\n    else{\n        free( ptr);\n \
  \       exit(EXIT_SUCCESS); //退出状态成功\n    }\n}\n```\n\n在这里，`exit` 函数被用于指示退出状态。带有退出状态退出程序始终是一个良好的习惯。`EXIT_SUCCESS`\
  \ 和 `EXIT_FAILURE` 是用于显示退出状态的两个宏。在程序成功操作后出的情况下，使用 `EXIT_SUCCESS` 显示成功退出。它定义为 `0`。`EXIT_Failure`\
  \ 用于程序发生任何故障的情况。它定义为 `-1`。\n\n## 除以零\n\n在某些情况下，无法采取任何措施来处理错误。在 C 语言中，一种情况就是除以零。你所做的只能避免这样做，因为如果你这样做，C\
  \ 语言无法理解发生了什么，并产生运行时错误。\n\n避免此问题的最佳方法是在除法操作中使用除数之前检查它的值。你可以使用 `if` 条件，如果发现它为零，只需显示消息并从函数返回。\n\
  \n## C 中的动态内存分配\n\n在运行时分配内存的过程被称为动态内存分配。称为内存管理函数的库程序用于在程序的整个执行过程中分配和释放内存。这些函数在 `stdlib.h`\
  \ 头文件中列出。\n\n![](img/image1873.jpg)\n\n## 内存分配方法\n\n全局变量、静态变量和程序指令在永久存储区中获取内存，而局部变量存储在名为\
  \ `Stack`（栈）的内存区域中。这两个区域之间的内存区域被理解为 `Heap`（堆）区域。该区域在程序的整个执行过程中用于动态内存分配。堆的规模保持动态\
  \ .![](img/image1879.jpg)\n\n## 分配内存块\n\n`malloc()` 操作用于在运行时分配内存块。该操作预留了一块给定大小的内存并返回一个\
  \ `void` 类型的指针。这意味着我们可以将其赋值给任何类型的指针进行类型转换。如果它无法分配足够的空间，它将返回一个 `NULL` 指针。\n\n语法：`void*\
  \ malloc(byte-size)`\n\n示例：\n```c\nint *x;\nx = (int*)malloc(50 * sizeof(int));\
  \ //分配给变量 x 的内存区域\nfree(x); //释放分配给变量 x 的内存\n```\n\n`calloc()` 是另一种用于在运行时分配内存的内存分配操作。`calloc`\
  \ 操作通常用于为派生类型类型如数组和结构体分配内存。如果它无法分配足够的空间，它将返回一个 `NULL` 指针。\n\n语法：`void *calloc(number\
  \ of things, element-size)`\n\n示例：\n```c\nstruct worker;\ntypedef struct worker\
  \ emp;\nemp *e1;\ne1 = (emp*)calloc(30,sizeof(emp));\n```\n\n`realloc()` 改变已经动态分配给变量的内存大小。\n\
  \n语法：`void* realloc(pointer, new-size)`\n\n示例：\n```c\nint *x;\nx = (int*)malloc(50\
  \ * sizeof(int));\nx = (int*)realloc(x,100); //为变量 x 分配替换内存\n```\n![](img/image1908.jpg)\n\
  \n## 表示动态内存分配的程序（使用 calloc()![](img/image1912.jpg)![](img/image1918.jpg)\n\n输出：输入元素总数：5\n\
  4 2 1 5 3\n最小元素是 1\n\n## C 中的命令行参数\n\n命令行参数可以是程序在调用时配备的参数。命令行参数是 C 编程中的一个核心概念。它主要用于你需要从外部管理程序时。命令行参数传递给\
  \ `main()` 技术。\n\n语法：`int main(int argc, char *argv[])`\n\n在这里，`argc` 统计语句中参数的数量，`argv[]`\
  \ 可能是一个指针数组，其中持有 `char` 类型的指针，指向传递给程序的参数![](img/image1932.jpg)\n\n"
