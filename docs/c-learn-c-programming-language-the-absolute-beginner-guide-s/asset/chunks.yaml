  trans: "\n\n![](img/image1840.jpg)\n\n# 其他错误处理方法\n\n我们也可以在 `exit()` 函数中使用 `Exit\
    \ Status` 常量来通知调用函数错误。可用的两个常量值是 `EXIT_SUCCESS` 和 `EXIT_FAILURE`。它们只是定义在 `stdlib.h`\
    \ 头文件中的宏。\n\n```c\n#include <stdio.h>\n#include <errno.h>\n#include <stdlib.h>\n\
    #include <string.h>\nextern int errno;\nvoid main(){\n    char *ptr = malloc(\
    \ 1000000000UL); //请求分配 1gb 内存空间\n    if (ptr == NULL) //如果内存不可用，将返回 null\n  \
    \  {\n        puts(\"malloc failed\");\n        puts(strerror(errno));\n     \
    \   exit(EXIT_FAILURE); //退出状态失败\n    }\n    else{\n        free( ptr);\n    \
    \    exit(EXIT_SUCCESS); //退出状态成功\n    }\n}\n```\n\n在这里，`exit` 函数被用于指示退出状态。带有退出状态退出程序始终是一个良好的习惯。`EXIT_SUCCESS`\
    \ 和 `EXIT_FAILURE` 是用于显示退出状态的两个宏。在程序成功操作后出的情况下，使用 `EXIT_SUCCESS` 显示成功退出。它定义为 `0`。`EXIT_Failure`\
    \ 用于程序发生任何故障的情况。它定义为 `-1`。\n\n# 除以零\n\n在某些情况下，无法采取任何措施来处理错误。在 C 语言中，一种情况就是除以零。你所做的只能避免这样做，因为如果你这样做，C\
    \ 语言无法理解发生了什么，并产生运行时错误。\n\n避免此问题的最佳方法是在除法操作中使用除数之前检查它的值。你可以使用 `if` 条件，如果发现它为零，只需显示消息并从函数返回。\n\
    \n# C 中的动态内存分配\n\n在运行时分配内存的过程被称为动态内存分配。称为内存管理函数的库程序用于在程序的整个执行过程中分配和释放内存。这些函数在\
    \ `stdlib.h` 头文件中列出。\n\n![](img/image1873.jpg)\n\n## 内存分配方法\n\n全局变量、静态变量和程序指令在永久存储区中获取内存，而局部变量存储在名为\
    \ `Stack`（栈）的内存区域中。这两个区域之间的内存区域被理解为 `Heap`（堆）区域。该区域在程序的整个执行过程中用于动态内存分配。堆的规模保持动态\
    \ .![](img/image1879.jpg)\n\n## 分配内存块\n\n`malloc()` 操作用于在运行时分配内存块。该操作预留了一块给定大小的内存并返回一个\
    \ `void` 类型的指针。这意味着我们可以将其赋值给任何类型的指针进行类型转换。如果它无法分配足够的空间，它将返回一个 `NULL` 指针。\n\n语法：`void*\
    \ malloc(byte-size)`\n\n示例：\n```c\nint *x;\nx = (int*)malloc(50 * sizeof(int));\
    \ //分配给变量 x 的内存区域\nfree(x); //释放分配给变量 x 的内存\n```\n\n`calloc()` 是另一种用于在运行时分配内存的内存分配操作。`calloc`\
    \ 操作通常用于为派生类型类型如数组和结构体分配内存。如果它无法分配足够的空间，它将返回一个 `NULL` 指针。\n\n语法：`void *calloc(number\
    \ of things, element-size)`\n\n示例：\n```c\nstruct worker;\ntypedef struct worker\
    \ emp;\nemp *e1;\ne1 = (emp*)calloc(30,sizeof(emp));\n```\n\n`realloc()` 改变已经动态分配给变量的内存大小。\n\
    \n语法：`void* realloc(pointer, new-size)`\n\n示例：\n```c\nint *x;\nx = (int*)malloc(50\
    \ * sizeof(int));\nx = (int*)realloc(x,100); //为变量 x 分配替换内存\n```\n![](img/image1908.jpg)\n\
    \n## 表示动态内存分配的程序（使用 calloc()![](img/image1912.jpg)![](img/image1918.jpg)\n\n输出：输入元素总数：5\n\
    4 2 1 5 3\n最小元素是 1\n\n# C 中的命令行参数\n\n命令行参数可以是程序在调用时配备的参数。命令行参数是 C 编程中的一个核心概念。它主要用于你需要从外部管理程序时。命令行参数传递给\
    \ `main()` 技术。\n\n语法：`int main(int argc, char *argv[])`\n\n在这里，`argc` 统计语句中参数的数量，`argv[]`\
    \ 可能是一个指针数组，其中持有 `char` 类型的指针，指向传递给程序的参数![](img/image1932.jpg)\n\n"
