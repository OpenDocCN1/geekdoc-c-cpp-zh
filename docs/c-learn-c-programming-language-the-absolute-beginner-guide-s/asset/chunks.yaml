    ![](img/image860.jpg)\n\n# 跳出循环\n有时，当循环遇到死循环时，有必要跳过循环的邻区域，或者当边界条件变为真时跳出循环。这通常被称为跳出循环。\n\
    \n### 1) break 语句\n当在循环中遇到 `break` 语句时，循环将立即退出，程序将继续执行循环之后的语句。\n![](img/image869.jpg)\n\
    \n### 2) continue 语句\n它导致管理跳转到测试条件处继续循环方法。遇到 `continue` 时，指针将离开当前的循环周期，并开始下一个周期。\n\
    ![](img/image876.jpg)\n\n# C 语言中的数组\n在 C 语言中，数组被称为结构化信息类型。关联数组被定义为有限的有序实体信息集合，存储在连续的内存位置。\n\
    这里，`finite` 意味着信息应该是有限的。`ordered` 意味着信息应该存储在连续的内存地址中。`homogenous` 意味着信息应该是相同的数据类型。\n\
    数组的用途示例包括：存储工人或学生姓名列表、存储学生的成绩、或存储数字或字符列表等。由于数组提供了表示信息的直接方式，它被归类为 C 中的信息结构。C 中的其他信息结构有结构、列表、队列、树等。数组不仅可以表示简单的信息列表，还可以表示\
    \ 2 维或 3 维的数据表。\n\n## 声明关联数组\n与任何变量一样，数组在使用之前应该被声明。数组声明的通用样式为：\n`data-type variable-name[size];`\n\
    ```c\n/* 数组声明示例 */\nint arr[10];\n```\n![](img/image897.jpg)\n这里 `int` 是数据类型，`arr`\
    \ 是数组名称，`ten` 是数组的大小。这意味着数组 `arr` 将仅包含十个 `int` 类型的组件。关联数组的索引从零开始到 size-1，即 `arr`\
    \ 数组的第一部分存储在 `arr[0]` 地址，因此最后一个元素可以占用 `arr[9]`。\n\n## 关联数组的初始化\n关联数组断言后应该被初始化。否则，它将包含垃圾值（任何随机值）。关联数组通常在编译时或运行时进行初始化。\n\
    \n### 编译时数组\n数组元素的编译时格式与普通变量初始化相同。数组格式的种类为：\n![](img/image907.jpg)\n\n### 运行时数组数据格式\n\
    数组甚至可以通过使用 `scanf()` 执行在运行时进行初始化。这种方法通常用于初始化大型数组，或使用用户给的值初始化数组。示例：\n```c\n#include\
    \ <stdio.h>\nvoid main(){\n    int arr[4];\n    int i, j;\n    printf(\"Enter\
    \ array element\");\n    for(i = 0; i < 4; i++){\n        scanf(\"%d\", &arr[i]);\
    \ // 运行时数组数据格式\n    }\n    for(j = 0; j < 4; j++)\n}\n```\n\n## 二维数组\nC 语言支持多维数组。三维数组的类型是二维数组。每一行和每一列的索引都从零开始。\n\
    二维数组的声明如下：\n`data-type array-name[row-size][column-size]`\n```c\n/* 示例 */\nint\
    \ a[3][4];\n```\n![](img/image932.jpg)!\n![](img/image938.jpg)\n\n# 字符串和字符数组\n\
    字符串可以是被视为一个知识项的字符序列，并以空字符 `'\\0'` 终止。注意 C 语言不支持字符串作为一种信息类型。字符串在 C 语言中实际上是一维字符数组。这些通常用于产生有意义且易读的程序。\n\
    例如：字符串 `\"hello world\"` 包含十二字符加上编译器在字符串末尾机械添加的 `'\\0'` 字符。\n\n## 初始化字符串变量\n有多种方法初始化字符数组变量。\n\
    ```c\nchar name[13] = \"StudyTonight\"; // 有效的字符数组初始化\nchar name[10] = \"\"; //\
    \ 有效的初始化\n```\n记住，一旦通过逐个列出所有字符来初始化字符数组，你就显式地提供 `'\\0'` 字符。\n字符数组错误初始化的示例为：\n```c\n\
    char ch[3] = \"hell\"; // 错误\nchar str[4];\nstr = \"hell\"; // 错误\n```\n\n# 字符串输入和输出\n\
    输入执行 `scanf()` 可以用于格式化地从终端扫描字符串输入。然而，`scanf()` 执行有一个缺点，它会在遇到第一个空白区域时终止其输入。因此，如果你尝试使用\
    \ `scanf()` 执行扫描输入字符串 `\"Hello World\"`，它只会扫描 greeting 并在遇到空白区域时终止。\n然而，C 语言支持一种名为\
    \ `%[..]` 的格式规范转换代码，它可以读取包含一系列字符（包括空格）的行。\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\nvoid main() {\n    char str[20];\n    scanf(\"%[^\\n]\", str);\n\
    \    printf(\"%s\", str);\n}\n```\n从终端扫描带有空格的字符字符串的另一种技术是使用 `gets()` 执行。\n```c\n\
    char text[20];\ngets(text);\nprintf(\"%s\", text);\n```\n\n# 字符串处理函数\nC 语言支持广泛的字符串处理函数，可以用于执行许多字符串操作。这些函数封装在\
    \ `string.h` 库中。因此，你需要将 `string.h` 头文件引入你的程序以使用这些函数。\n![](img/image969.jpg)![](img/image973.jpg)![](img/image977.jpg)![](img/image981.jpg)\n\
    \n# C 中的存储类\n在 C 语言中，每个变量包含一个存储类，决定了后续事项：\n\n*   作用：变量的值在程序的何处可以获取。\n*   默认初始值：如果我们倾向于不明确初始化该变量，它的默认初始值是什么。\n\
    *   变量的寿命：该变量可以存在多久。\n\n以下存储类在 C 编程中使用：\n\n*   自动变量\n*   外部变量\n*   静态变量\n*   寄存器变量\n\
    \n*   自动变量：自动 vehicle\n\n*   作用：具有自动存储类的变量对于其定义的代码块是原生的。\n\n"
