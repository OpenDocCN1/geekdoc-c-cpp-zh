  trans: "\n\n# C 语言中的指针作为函数参数\n\n指针作为操作参数用于携带在整个调用过程中传递的参数地址。这通常也被称为**引用传递**（decision\
    \ by reference）。一旦通过引用调用函数，对引用变量的任何修改都可能影响原始变量。\n\n## 示例时间：交换两个数字\n![](img/image1731.jpg)!(image1735.jpg)\n\
    \n## 返回指针变量的函数\n\n函数也可以向调用者返回一个指针。在这种情况下，你必须小心，因为函数的局部变量不会在函数外部存在。它们的作用域仅限于函数内部。因此，如果你返回一个连接到局部变量的指针，当函数结束时，该指针将指向空内容。\n\
    ![](img/image1742.jpg)\n\n### 获取可靠指针的 get 方法\n1. 在函数中使用参数。由于传递给执行函数的参数是在函数行内声明的，因此它们在函数执行完后外部也会继续存在。\n\
    2. 或者，在函数内部使用静态变量并返回它们。由于静态变量的生命周期持续到 `main()` 函数退出，因此它们在整个程序运行期间都是可用的。\n\n##\
    \ 函数指针\n\n可以声明指向函数的指针，该指针随后可以作为另一个函数的参数使用。指向函数的指针声明如下：\n\n```\ntype (*pointer-name)(parameter);\n\
    ```\n\n这里是一个示例：\n```c\nint (*sum)();   // 指向指针的合法声明\nint *sum();     // 这不是函数指针的声明\n\
    ```\n\n当函数指针被赋值为特定函数的名称时，它可以指向该特定函数。\n```c\nint sum(int, int);\nint (*s)(int,\
    \ int);\ns = sum;\n```\n在这里，`s` 是指向函数 `sum` 的指针。现在可以使用函数指针 `s` 配合提供的所需的参数值来调用\
    \ `sum`。\n```c\ns (10, 20);\n```\n\n### 函数指针示例\n```c\n#include <stdio.h>\nint\
    \ sum(int x, int y){\n    return x+y;\n}\nint main( ){\n    int (*fp)(int, int);\n\
    \    fp = sum;\n    int s = fp(10, 15);\n    printf(\"Sum is %d\", s);\n    return\
    \ 0;\n}\n```\n输出: 25\n\n## 复杂的函数指针示例\n\n你会在到处发现复杂的函数指针示例，让我们来看其中一个示例并尝试理解它。\n\
    ```\nvoid *(*foo) (int*);\n```\n它看起来很复杂，但其实很简单。在这种情况下，`(*foo)` 是指向函数的指针，其参数类型为\
    \ `int*`，返回类型为 `void*`。\n\n# C 语言高级主题\n\n## C 语言中的文件输入输出\n\n文件代表磁盘上存储一组连接知识的字节序列。文件用于永久存储信息。它是一个预定义的结构。在\
    \ C 语言中，我们倾向于使用文件类型的结构指针来声明文件。\n\n```c\nFILE *fp;\n```\n\nC 提供了多种帮助执行基本文件操作的函数。以下是这些函数：\n\
    ![](img/image1791.jpg)\n\n### 打开文件或创建文件\n\n`fopen()` 用于创建新文件或打开已存在的文件。\n\n通用语法：\n\
    ```\n*fp = FILE *fopen(const char *filename, const char *mode);\n```\n在这里，`*fp`\
    \ 是 `FILE` 指针 (`FILE *fp`)，它将持有已打开（或创建）文件的引用。`filename` 是要打开的文件名，`mode` 指定了打开文件的目的。模式可以是以下类型：\n\
    ![](img/image1801.jpg)\n\n### 关闭文件\n\n`fclose()` 函数用于关闭已打开的相关文件。\n\n通用语法：\n```\n\
    int fclose( FILE *fp);\n```\n在这里，`fclose()` 函数关闭文件并在成功时返回零，如果在关闭文件时发生计算错误，则返回\
    \ `EOF`。这个 `EOF` 可能是头文件 `stdio.h` 中定义的常量。\n\n### 文件上的输入/输出操作\n\n在上面的表中，我们提到了用于对文件进行读写的各种文件\
    \ I/O 函数。`getc()` 和 `putc()` 是唯一可以浏览和向文件写入单个字符的函数。\n![](img/image1812.jpg)\n\n\
    ### 使用 fprintf() 和 fscanf() 读写文件\n![](img/image1818.jpg)\n\n在这个程序中，我们创建了两个 `FILE`\
    \ 指针，每个指针都指向一个常量文件，但在不同的模式下操作。`fprintf()` 函数直接写入文件，而 `fscanf()` 从文件中读取，然后可以通过常用的\
    \ `printf()` 函数写入到控制台。\n\n## 追加模式与写入模式的区别\n\n写入 (`w`) 模式和追加 (`a`) 模式在打开文件时几乎相同。它们都将向文件中写入内容。在每种模式下，如果文件不存在，则会创建一个新文件。\n\
    它们唯一的区别是，当你以写入模式打开文件时，文件会被重置，导致文件中已有的任何信息被删除。而在追加模式下，这种情况不会发生。追加模式用于在文件的现有数据（如果有）之后追加或添加信息。因此，当你以追加\
    \ (`a`) 模式打开文件时，指示器将置于文件中这些信息的末。\n\n## C 语言中的错误处理\n\nC 语言没有提供任何用于错误处理的机制。但 `error.h`\
    \ 头文件中定义的许多方法和变量通常用于在操作执行语句期间处理错误。在 C 语言中，当发生任何错误时，操作返回 `-1` 或 `NULL` 值，并且一个全局变量\
    \ `errno` 与错误代码相关。这些返回值通常用于在编程时检查错误。\n\n### 什么是 errno？\n\n每当在 C 语言创建一个调用，都会关联一个名为\
    \ `errno` 的变量。它是一个全局变量，可能用于确定操作执行过程中遇到了什么种错误以及其代码。下面我们列出了错误编号及其含义。\n![](img/image1831.jpg)\n\
    \nC 语言使用以下函数表示与 `errno` 相关的错误消息：\n\n*   `perror()`：返回传递给它的字符串以及当前 `errno` 值的文本表示。\n\
    *   `strerror()` 定义在 `string.h` 库中。该方法返回指向当前 `errno` 值字符串表示的指针。\n\n"
- fmt: "\n![](image1840.jpg)\n\n# Other ways of Error Handling\n\nWe can also use\
    \ `Exit Status` constants in the `exit()` function to inform the calling function\
    \ about the error. The two constant values available for use are `EXIT_SUCCESS`\
    \ and `EXIT_FAILURE`. These are nothing but macros defined in `stdlib.h` header\
    \ file.\n\n```c\n#include <stdio.h>\n#include <errno.h>\n#include <stdlib.h>\n\
    #include <string.h>\nextern int errno;\nvoid main(){\n    char *ptr = malloc(\
    \ 1000000000UL); //requesting to allocate 1gb memory space\n    if (ptr == NULL)\
    \ //if memory not available, it will return null\n    {\n        puts(\"malloc\
    \ failed\");\n        puts(strerror(errno));\n        exit(EXIT_FAILURE); //exit\
    \ status failure\n    }\n    else{\n        free( ptr);\n        exit(EXIT_SUCCESS);\
    \ //exit status Success\n    }\n}\n```\n\nHere `exit` function is used to indicate\
    \ exit status. Its always a good practice to exit a program with a exit status.\
    \ `EXIT_SUCCESS` and `EXIT_FAILURE` are two macro used to show exit status. In\
    \ case of program coming out after a successful operation `EXIT_SUCCESS` is used\
    \ to show successful exit. It is defined as `0`. `EXIT_Failure` is used in case\
    \ of any failure in the program. It is defined as `-1`.\n\n# Division by Zero\n\
    \nThere are some situation where nothing can be done to handle the error. In C\
    \ language one such situation is division by zero. All you can do is avoid doing\
    \ this, becasue if you do so, C language is not able to understand what happened,\
    \ and gives a runtime error.\n\nBest way to avoid this is, to check the value\
    \ of the divisor before using it in the division operations. You can use `if`\
    \ condition, and if it is found to be zero, just display a message and return\
    \ from the function.\n\n# Dynamic Memory Allocation in C\n\nThe process of allocating\
    \ memory at runtime is understood as dynamic memory allocation. Library routines\
    \ called memory management functions are used for allocating and releasing memory\
    \ throughout execution of a program. These functions are outlined in `stdlib.h`\
    \ header file.\n\n![](image1873.jpg)\n\n## Memory Allocation method\n\nGlobal\
    \ variables, static variables and program directions get their memory in permanent\
    \ cargo hold whereas native variables are hold on in a very memory area referred\
    \ to as `Stack`. The memory area between these 2 region is understood as `Heap`\
    \ area. This region is employed for dynamic memory allocation throughout execution\
    \ of the program. the scale of heap keep dynamic .![](image1879.jpg)\n\n## Allocating\
    \ block of Memory\n\n`malloc()` perform is employed for allocating block of memory\
    \ at runtime. This perform reserves a block of memory of the given size and returns\
    \ a pointer of sort `void`. this implies that we will assign it to any sort of\
    \ pointer exploitation typecasting. If it fails to portion enough area as such\
    \ as, it returns a `NULL` pointer.\n\nSyntax: `void* malloc(byte-size)`\n\nExample:\n\
    ```c\nint *x;\nx = (int*)malloc(50 * sizeof(int)); //memory area allotted to variable\
    \ x\nfree(x); //releases the memory allotted to variable x\n```\n\n`calloc()`\
    \ is another memory allocation perform that's used for allocating memory at runtime.\
    \ `calloc` perform is generally used for allocating memory to derived knowledge\
    \ sorts like arrays and structures. If it fails to portion enough area as such\
    \ as, it returns a `NULL` pointer.\n\nSyntax: `void *calloc(number of things,\
    \ element-size)`\n\nExample:\n```c\nstruct worker;\ntypedef struct worker emp;\n\
    emp *e1;\ne1 = (emp*)calloc(30,sizeof(emp));\n```\n\n`realloc()` changes memory\
    \ size that's already allotted dynamically to a variable.\n\nSyntax: `void* realloc(pointer,\
    \ new-size)`\n\nExample:\n```c\nint *x;\nx = (int*)malloc(50 * sizeof(int));\n\
    x = (int*)realloc(x,100); //allocated a replacement memory to variable x\n```\n\
    ![](image1908.jpg)\n\n## Program to represent Dynamic Memory Allocation(using\
    \ calloc())![](image1912.jpg)![](image1918.jpg)\n\nOutput:Enter total number of\
    \ elements: 5\n4 2 1 5 3\nSmallest element is 1\n\n# Command Line Argument in\
    \ C\n\nCommand line argument could be a parameter equipped to the program once\
    \ it's invoked. statement argument is a crucial idea in C programming. it's principally\
    \ used once you got to management your program from outside. statement arguments\
    \ are passed to the `main()` technique.\n\nSyntax: `int main(int argc, char *argv[])`\n\
    \nHere `argc` counts the quantity of arguments on the statement and `argv[]` could\
    \ be a pointer array that holds pointers of kind `char` which points to the arguments\
    \ passed to the program.![](image1932.jpg)\n"
