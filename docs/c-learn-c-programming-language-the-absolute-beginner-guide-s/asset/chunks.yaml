    ## C 语言中的 switch 语句


    当你需要解决多个选择问题时，例如：菜单之类的程序，每个价格与一个选择相关，且你一次只想决定一个，这时使用 `switch` 语句。`switch` 语句可以是一种管理语句，允许我们在许多决策中只决定一个。`switch`
    中的表达式求出一个关联的整数值，然后与许多 case 中的值进行比较。它执行与 case 价格匹配的代码块。如果没有匹配，则执行 `default` 块（如果存在）。


    ### 使用 switch 语句的规则


    1.  `switch` 关键字后面的表达式应该产生一个整数值，即表达式应该是整数、变量或一个求值为整数的表达式。

    2.  `case` 标签值应该是独特的。

    3.  `case` 标签应以冒号(:) 结束。

    4.  后续的一行，即 `case` 语句，通常可以是任何有效的 C 语句。


