    # 返回类型

    `retntype` 当一个 `perform` 被断言执行某种类型的计算或任何操作，并预测会在末尾产生某些结果时，在这种情况下，`return` 语句是
    `perform` 体末端的另一个语句。`return` 类型指定了 `perform` 预计返回给调用它的程序（称为函数）的值类型（`int`、`float`、`char`、`double`）。注意：万一你的
    `perform` 没有返回任何值，`return` 类型将是 `void`。


    # 函数名

    `functionName` 名称是一个标识符（AN symbol），它指定了 `perform` 的名称。`perform` 的名称可以是任何有效的 C
    符号，因此应该遵循与 C 语言中备用变量类似的命名规则。


    # 参数列表

    参数列表声明了 `perform` 在被调用时所期望的参数类型和范围。此外，参数列表内的参数在 `perform` 被命名后会接收参数值。它们通常被称为形式参数。


    # AN 示例

    让我们写一个带有 `main()` `perform` 的简单程序，以及一个用户定义的用于两个两个数字的 `perform`，该 `perform` 可以从
    `main()` `perform` 中调用![](img/image1095.jpg)


    ## 函数定义语法

    就像上面的示例一样，`perform` 定义的整体语法如下：


    ```c

    retntype functionName(type1 parameter1, type2 parameter2,...){

    // perform body goes here}

    ```


    第一行 `retntype functionName(type1 parameter1, type2 parameter2,...)` 被理解为 `perform`
    头部，同时大括号之间的语句被称为函数体。注意：在形状构建一个 `perform` 时，`perform` 头部内的括号后面没有分号（`;`），这不像在声明
    `perform` 或函数的某行工作时那样的。


    # 函数体

    `perform` 体包含了执行所需任务所需的声明和语句（算法）。函数体在大括号处结束，并由 3 个部分组成：

    1. 局部变量声明（如果需要）。

    2. 在 `perform` 内部执行任务的函数语句。

    3. `return` 语句，用于返回函数计算的结果（如果 `return` 类型是 `void`，则不需要 `return` 语句）。


    # 调用 perform

    当一个 `perform` 被命名时，程序的管理权将转移到 `perform`。


    ```

    functionName(argument1, argument2,...);

    ```


    在上面的示例中，`main()` `perform` 内部的语句 `multiply(i, j);` 就是调用。


    # 向 perform 传递参数

    参数是在调用过程中给的值，而形式参数是在构建 `perform` 时声明的![](img/image1119.jpg)


    函数可以有参数但没有返回类型。并没有必要要求如果一个函数接受参数，它也必须返回结果![](img/image1123.jpg)


    在声明 `perform` 时，我们声明了两个个类型为 `int` 的参数 `a` 和 `b`。因此，在执行 `perform` 的工作行中，我们想要传递
    2 个参数，否则我们将得到编译错误。因此，传递的 2 个参数应当在 `perform` 定义中接收，这意味着函数定义中的 `perform` 头部应当有 2
    个参数来携带参数值。这些接收到的参数也被称为形式参数。在声明、执行工作行和处理 `perform` 时变量的名称通常是完全不同的。


    # 从 perform 返回值

    `perform` 可以也可以不返回结果。然而，如果会返回，我们倾向于使用 `return` 语句来输出结果。`return` 语句同时结束 `perform`
    的执行，因此它应该是任何 `perform` 的最后一个语句。如果你在 `return` 语句之后编写任何语句，它将不会被执行![](img/image1130.jpg)


    使用 `return` 语句返回的值类型应与函数声明和定义中提到的 `return` 类型相同。如果任何一个不匹配，你将得到编译错误。


