    通常有四种不同的用户定义函数，它们是：

    1. 无参数无返回值的函数

    2. 无参数有值的函数

    3. 有参数无返回值的函数

    4. 有参数有返回值的函数


    下面，我们将讨论这些种类，并结合程序示例。


    ## 无参数无返回值的函数

    此类函数要么用于显示数据，要么完全用于用户输入。下面是一个相关的 `perform` 示例，它从用户处接收一对数字作为输入，并显示其中较大的那一个![](img/image1147.jpg)


