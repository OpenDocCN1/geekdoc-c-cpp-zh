    # 变量与标识符的区别？


    符号（Symbol）可以是给任何编程语言中任何变量 ![](img/image582.jpg)、函数、结构体、指针或其他实体的名称。而变量（Variable），正如我们在本教程中简单学到的，可以是一个命名的内存位置，用于存储程序内使用的数据。


    # C 语言的输入与输出


    输入（Input）意味着为程序提供一些数据供程序使用，而输出（Output）意味着在屏幕上显示数据或将信息写入打印机或文件。C 这种语言提供了几个内置函数，用于扫描任何给定的输入，并在需要输出结果时在屏幕上显示信息。在本教程中，我们将介绍这些函数，它们可能被用于我们的程序，以要求用户输入并在屏幕上输出结果。这些内置函数都包含在
    C 头文件中，我们在讨论相关内容时，还会额外指定概述所选操作的头文件名称。


    ## scanf() 和 printf() 函数


    标准输入输出头文件 `stdio.h` 包含了 `printf()` 和 `scanf()` 函数的定义，它们分别用于在屏幕上显示输出和从用户处获取输入![](img/image597.jpg)。当你编译上述代码时，它会提示你输入一个值。在你输入该值后，它会在屏幕上显示你已插入的值。你必须猜测
    `scanf()` 或 `printf()` 函数中参数的目的是。它被称为格式字符串（format string），它告诉 `scanf()` 操作期望什么种类型的输入，而在
    `printf()` 中，它将向编译器提供提示，期望什么样的输出![](img/image603.jpg)。我们还可以通过在格式字符串中添加变化（如 `""`
    或 `"%3s"`）来限制输入或输出的数字或字符数量，第一个建议一个数字，第二个意味着三个字符，因此如果你尝试输入四十二，而 `scanf()` 使用了 `""`，它将只会四四输入。输出的情况也是如此。


    在 C 语言中，PC 监控器、打印机等输出设备被视为文件，向这些设备写入输出的方法与向文件写入输出的方法相同。


    **注意**：`printf()` 操作返回它写入的字符数量，而 `scanf()` 返回它扫描的字符数量。


    ```c

    int i = printf("studytonight");

    ```

    在这个程序中，`printf("studytonight");` 可以返回十二作为结果，这可以保存在变量 `i` 中，因为 studytonight 有十二个字符。


    ## getchar() & putchar() 函数


    `getchar()` 操作从关联的终端读取一个字符并将其作为一个数字返回。该操作一次只读取一个字符。你会在循环中使用这种技术，以防你想要扫描多个字符。`putchar()`
    操作在屏幕上显示传递给它的字符并返回一个相似的字符。该操作也一次只显示一个字符。如果你想显示多个字符，请在循环中使用 `putchar()` 技术![](img/image613.jpg)


    ## gets() & puts() 函数


    `gets()` 操作从 `stdin`（标准输入）读取一行到 `str` 指针指向的缓冲区中，直到遇到终止换行符或 EOF（文件结束）为止。`puts()`
    操作将字符串 `str` 及其随后的换行符写入 `stdout`（标准输出）。`str` → 这可以是指向字符数组的指针，C 字符串存储在该处。（如果你现在不知道这个，请忽略。）


    ```c

    #include<stdio.h>

    void main() {

    /* 长度为 100 的字符数组 */

    char str[100];

    printf("Enter a string");

    gets( str );

    puts( str );

    getch();

    }

    ```

    当你编译上述代码时，它会提示你输入一个字符串。一旦你输入了字符串，它就会显示你已输入的值。


    ### scanf() 和 gets() 的区别


    这两个函数之间的主要区别是 `scanf()` 一旦遇到空格就会停止读取字符，而 `gets()` 也会将空格视为字符读取。

    如果你在 `scanf()` 中输入 `Study Tonight`，它只会扫描并存储 `Study`，并留下空格后的部分。然而，`gets()` 操作可以完全扫描它。


    # C 语言中的决策


    决策处理通过支持以下语句来处理决策：


