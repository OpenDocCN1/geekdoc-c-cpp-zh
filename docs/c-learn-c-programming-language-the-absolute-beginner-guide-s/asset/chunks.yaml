- fmt: "\n# Pointers as Function Argument in C\n\nPointer as a operate parameter is\
    \ employed to carry addresses of arguments passed throughout call. this is often\
    \ additionally referred to as decision by reference. once a operate is termed\
    \ by reference any modification created to the reference variable can impact the\
    \ first variable.\n\n## Example Time: Swapping 2 numbers\n![](image1731.jpg)!(image1735.jpg)\n\
