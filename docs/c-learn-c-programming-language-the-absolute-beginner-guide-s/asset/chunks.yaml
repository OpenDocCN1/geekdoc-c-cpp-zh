    \n# 在 C 中声明、初始化和使用指针变量\n\n## C 指针变量的声明\n指针声明的通用语法是 `datatype *pointer_name;`\n\
    指针的数据类型应当保持一致，因为指针变量所指向的变量知识类型是明确的。`void` 类型的指针适用于所有类型的数据，但通常不使用。以下是几个示例：\n```c\n\
    int *ip // 指向整数变量的指针\nfloat *fp; // 指向浮点变量的指针\ndouble *dp; // 指向双精度变量的指针\nchar\
