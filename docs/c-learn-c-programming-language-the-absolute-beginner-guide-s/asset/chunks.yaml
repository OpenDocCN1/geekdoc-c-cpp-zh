  trans: "\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\n# 学习 C 语言编程：零基础逐步入门指南 作者：Nathan\
    \ Ray\n\n## 目录\n1. **C 语言基础** (4)\n   1. C 语言概述 (4)\n   2. C 语言特性 (4)\n   3. 第一个\
    \ C 程序 (5)\n   4. 编译并运行 C 程序 (6)\n   5. C 语言基本语法规则 (9)\n   6. 关键字与标识符 (13)\n \
    \  7. C 语言中的运算符 (16)\n   8. C 语言的数据类型 (18)\n   9. C 中的变量 (23)\n   10. C 的输入与输出\
    \ (26)\n   11. C 语言中的决策判断 (26)\n   12. C 中的 switch 语句 (30)\n   13. C 中的循环 (34)\n\
    \   14. C 中的数组 (40)\n   15. 字符串与字符数组 (50)\n   16. C 语言中的存储类 (59)\n2. **C 语言中的函数**\
    \ (64)\n   1. C 语言简介 (64)\n   2. C 中自定义函数的类型 (70)\n   3. C 中函数调类型 (75)\n   4.\
    \ 在 C 中向函数传递数组 (78)\n3. **C 语言中的结构** (82)\n   1. C 结构 (88)\n   2. C 中的 typedef\
    \ (90)\n   3. C 联合体 (93)\n4. **C 语言中的指针** (94)\n   1. 指针简介 (96)\n   2. 在 C 中声明、初始化和使用指针\
    \ (99)\n   3. C 中的指针的指针（二级指针）（102)\n   4. C 中的指针与数组 (105)\n   5. C 中结构体数组的指针 (106)\n\
    \   6. C 中的指针运算 (108)\n   7. C 中作为函数参数的指针 (111)\n5. **C 语言高级主题** (115)\n   1.\
    \ C 中的文件输入/输出 (115)\n   2. C 中的错误处理 (119)\n   3. C 中的动态内存分配 (122)\n   4. C 中的命令行参数\
    \ (127)\n\n## C 语言基础\n\n### C 语言概述\nC 语言可能是由 Dennis Ritchie 于 1973 年在贝尔实验室开发的一种结构化人工语言。由于其结构化、高层抽象性、机器无关性等特性，它是目前最常用的\
    \ PC 语言之一。C 语言是为了编写 UNIX 操作系统而开发的，因此它与 UNIX 密切相关，而 UNIX 是目前最常用的网络操作系统之一，也是互联网高速公路的核心。\n\
    \n### C 语言的历史\nC 语言从三种完全不同的语言 ALGOL、BCPL 和 B 语言演变而来。它使用了这些语言中的一些思想，同时引入了许多新概念，如数据类型、`struct`、`pointer`\
    \ 等。1988 年，该语言由美国国家标准 (ANSI) 格式化。1990 年，C 语言的版本得到了国际标准组织 (ISO) 的批准，该版本的 C 语言被称为\
    \ C89。\n\nimage109.jpg)\nC 语言编译器将可读的 C 语言程序转换为机器指令。\n\n### 为什么 C 语言如此流行？\nC 语言可能是一个让你接触编程世界的极佳语言，因为它是一种简单直接的过程化语言，能够创造奇迹。用\
    \ C 语言编写的程序执行时间非常短，几乎以编程语言指令的速度运行。起初，C 语言主要用于编写底层程序，如开发操作系统，但仍然有许多其他应用程序可以使用 C\
    \ 语言进行良好的设计和开发，例如文本编辑器、编译器、网络驱动程序等。\n\n### C 语言的特性\n* 它是一门强大的语言，拥有一套内置函数和运算符，无需编写任何复杂的程序。\n\
    * C 编译器结合了汇编编程语言的能力和面向应用语言的选项。\n* 用 C 语言编写的程序既经济又快速。这可能归功于它的知识排序和强大的运算符。\n* 它比\
    \ BASIC 快很多倍。\n* C 具有极强的移植性，这意味着程序一旦写好就可以可以在其他机器上运行，只需很少或无需修改。\n* 程序的另一个必要特性是它的可扩展性。\n\
    * 程序在很大程度上是由 C 库支持的函数集合。我们能够创建自己的函数并将其添加到 C 库中。\n\nC 语言是目前操作系统和嵌入式系统开发中最通用的语言。image133.jpg)\n\
    \n### 第一个 C 程序及其结构\n让我们看看如何写一个简单基础的 C 程序：\nimage139.jpg)\n输出：Hello world\n\n###\
    \ 程序的不同组件\n* 预处理器\n* 头文件\n* 函数\n* 变量\n* 语句与表达式\n* 注释\n\n这些都是 C 语言程序的要素组成部分。\n\n\
    ### 预处理器\n`#include` 是任何程序的起始单词。它也被称为预处理器。预处理器的任务是初始化程序的环境，即将程序与所需的头文件链接起来。因此，当我们说\
    \ `#include` 时，是告诉编译器包含 `stdio.h` 头文件。\n\n### 头文件\n头文件可以是内置（现成）函数的集合，我们可以直接在程序中使用它们。头文件随编译器提供，涵盖了字符串处理、数学函数、转换和变量读取等领域。要使用任何这些函数，都应该包含头文件。这通常在\
    \ C 源文件的开头。例如，为了使用 `printf()` 操作（它用于在屏幕上显示内容），需要 `#include`，因为 `stdio.h` 头文件包含了\
    \ `printf()` 操作。\n\n### 函数\n`main()` 操作可以是每个程序中必须存在的函数。该操作内的所有内容都是可执行的。在上面的示例中，位于\
    \ `main()` 操作之前的 `int` 是 `main()` 函数的返回类型。我们稍后会详细讨论。大括号 `{}` 定义了 `main()` 函数的体。\n\
    \n### 变量\n（原文未提供变量部分）\n\n### 语句与表达式\n（原文未提供语句与表达式部分）\n\n### 注释\n我们可以在程序中添加注释来解释我们在程序中所做的。这些注释会被编译器忽略且不会执行。要添加单行注释，在开头添加两个正斜杠\
    \ `//` 然后是注释内容。要添加多行注释，将其封装在 `/* .... */` 之间，如上面的程序所示。\n\n### 返回语句\n`return 0;`\n\
    返回语句简单用于标记任何程序的结束。\n\n### 编译并运行计算机程序\n要编译并运行 C 语言程序，你需要一个编译程序。在你的电脑上设置 C 语言编译器有两种方法：\n\
    \n"
