    From the HTTP framework developer''s perspective, MHFRunL() is where the bulk
    of the action takes places, MHFRunL() is essentially used by the framework to
    notify the client of incoming and outgoing events through the HTTPEvent::iStatus
    parameter. Incoming events are the transaction''s current status; for example,
    header received, body received, and so on. Outgoing events are events that originate
    due to client actions, for when a transaction is cancelled. Check out the HTTPEvent
    class in httpevent.h for the full list of events and the Symbian Developer Library
    for detailed documentation on the events. For normal usage scenarios, handling
