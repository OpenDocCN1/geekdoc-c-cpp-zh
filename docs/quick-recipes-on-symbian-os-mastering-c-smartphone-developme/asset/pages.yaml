    \ and these are distinguished by identifier.\n* An optional ‘mapping’, which is\
    \ used when exporting the contact to a vCard.\n* An optional label, which can\
    \ be used to further specify the meaning of the data. For a ‘home’ phone number,\
    \ a ‘work’ address, and so on.\n\nYou can find the mappings for the contact fields\
    \ in your SDK (in epoch32\\cntdef.h) or search for KUidContactField in the Symbian\
    \ Developer Library.\n your handset, each contact card can belong to one or more\
    \ groups, to represent particular collections of contacts. You can create many\
    \ groups as you like. A contact can be a friend, a colleague, a member of your\
    \ family or belong to no group, one or more. While you are able to add your own\
    \ contact groups to the database, there may be some systems that you will not\
    \ be able to remove. In addition, do not confuse groups with a folder hierarchy:\
    \ deleting a group will not delete the contact cards in the group.\nTo speed up\
    \ the execution of your code, views and filters help retrieve a limited amount\
    \ of data when accessing the database. Indexing and other internal configuration\
    \ options allow each database to be optimized for specific common operations,\
    \ such as sorting contacts by first or last names.\nFor testing purposes, the\
    \ code samples of this book contain \\PIM\\PopulateContact, which makes sure that\
    \ your development environment connects a Contact database initialized with a\
    \ few contact items.\n\n# 4.2.2 Before You Start with Calendar\n\nOS v9.1 deprecated\
    \ the original Agenda Model API and added a new Calendar Interim API, to reflect\
    \ the push toward the iCalendar standard. You should definitely familiarize yourself\
    \ with iCalendar before developing any kind of value-added application using this\
    \ API. The specification can be found at www.drafts.org/rfc/rfc2445.html.\nThe\
    \ Calendar database contains calendar entries, which can be appointments, meetings,\
    \ anniversaries, to-do notes, and so on. For the purpose of this text, we are\
    \ going to refer to any one of these entries as an ‘event’. Each event can belong\
    \ to one or several categories.\nEach calendar entry has an identifier during\
    \ its lifetime in the database. An entry can be repeated. It would then have several\
    \ calendar instances."
