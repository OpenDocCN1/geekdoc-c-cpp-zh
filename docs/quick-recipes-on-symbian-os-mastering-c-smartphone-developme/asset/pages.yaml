    class an object of this type has children and a relatively high RAM usage, so
    creating and destroying them is often not recommended. Instead, it is better to
    maintain only a small number (ideally one) of pointers to CMsEntry objects, and
    change which entry they point to (known as the current context) only when necessary,
    to improve performance and keep memory usage as low as possible.


    Each entry has a header that stores the entry''s metadata. The header class, CMsEntry,
    is most useful in the context of message entries, as it is capable of holding
    information such as whether a message is unread, is scheduled for sending, has
    an attachment, and other generic message attributes. Depending on the actual protocol
    used, you may be able to use more specialized subclasses, such as EmailEntry.
    An important field for all types of entry is the ID (TMid), which allows you to
    nominate a specific message, folder or service. For a message entry to be valid,
    the iType and iMtm data members must be set. For a service entry, these and the
    ServiceId data members must be set; other than these, it is not guaranteed that
    any other data members will be set for a particular entry.


    An entry''s header object can be retrieved from CMsEntry; however, it is recommended
    that you use CMsEntry (or one of its derived classes) directly, whenever possible
    – that is, if only the header data is required.


    # 4.4.4.2 Types of entry


    When navigating the message store, it is common for a client not to know the IDs
    of the entries it wants to access in advance, but instead to for'
