  pgno: 362
- img_proc: true
  md: 'It is important to understand the basics of the compiler you are using. Modern
    compilers contain a number of optimization phases which produce smaller or faster
    code, depending on the chosen settings. It is important to understand the consequences
    of some of the code produced. If you understand how the code is generated by your
    chosen compiler, you can avoid working against it. For example, you can avoid
    writing code that is prescriptive and forces the compiler to generate code in
    a particular way, rather than allowing it to optimize.


    When writing code for Symbian v9 platforms, you can use the free GCC-E compiler,
    supplied with your chosen SDK, to build code that runs on a phone. More information
    about the compiler is available at gcc.gnu.org/linedocs/gcc.


    # The RVCT Compiler


    While the GCC-E compiler produces EABI-compatible binaries that can be used for
    Symbian OS v9 application development, it cannot be used when developing code
    that runs kernel-side (such as device drivers). Developers working within Symbian,
    and in Symbian''s licensee or partner companies, opt instead to use the Real View
    Compilation Tools (RVCT), available at a charge, from ARM.


    In fact, if you want optimal code, when compared to GCC-E, the RVCT compiler gives
    better performance and smaller binaries. See www.arm.com/products/DevTools/RealViewSuite.html
    for more information about RVCT, the versions used to build Symbian projects and
    how to acquire a license. RVCT is available to Symbian''s Partners at a special
    discount - partnering with Symbian is discussed in more detail later in this chapter.


    # 6.1.4 Protect It!


    Protecting your IP, to prevent your application from being resold, is a complex
    problem and there is no single or instant solution to it. Different approaches
    are appropriate for different applications and business models. Sometimes the
    effort required to fully protect your software may not be worth it, and it is
    better to just release your software and rely on people''s honesty. However, if
    you really feel the need to prevent your software from being freely copied, then
    there are a few ways of going about it. In all of them, the important thing is
    to make purchasing an application as simple as possible for the user.


    # SMS Activation


    One popular way to use smartphone software is to use an activation SMS. The user
    sends a one-off SMS to a particular SMS number, and an'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# WHAT TO DO BEFORE YOU RELEASE YOUR APPLICATION


    SMS is sent in reply to activate the software. This can also be a handy way of
    letting the user pay for the use of the software, by setting up a premium SMS
    number.


    It has the advantage that if the user changes phones, then they can resend the
    activation SMS to the server, which can detect that the phone''s number is already
    in its database and reactivate the application without recharging the user.


    However, although this is a useful approach, it does have some disadvantages:


    +   - You need to pay to set up an SMS gateway.

    - By setting up an SMS gateway, you may be restricting the number of countries
    from which a user can register.

    - If the user changes phones and phone numbers, the reactivation will not work
    and the user will have to purchase a new copy of the application.


    # Using an Authorization Server


    Another way of protecting a smartphone application is to require it to connect
    to a server, either from code within the application, or by launching the phone''s
    web browser with a URI, on the first use. You can download a token associated
    with the phone''s IMEI that authorizes the application for use.


    The problem with this is that you need to set up a server with a database that
    can store a list of IMEIs and record the fact that they are registered. It also
    depends on the user''s phone having Internet access, which cannot be guaranteed.
    In addition, if the user gets a new phone, then he she won''t be able to download
    the application from the server again, since it will consider the new phone (with
    its different IMEI) to belong to a new customer.


    # Selling the Application Over the Internet


    Another approach is to require users use a PC to log on to a website to purchase
    the application. This poses a difficulty in that you need to find a way of associating
    an application bought on a PC with a particular phone. A good way of doing this
    is by using the IMEI of the phone. However, users necessarily know about IMEIs
    and it is not very user friendly to expect them to type in this long, arcane number,
    ascertained by first typing in the `#06#` code as they would a phone number. Furthermore,
    it cannot be guaranteed that the user will know how to download and install a
    SIS installation file from their PC once they have it, and it also restricts how
    you distribute, and how the user purchases, your application.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 6.1.5 Sign It!


    Unfortunately, each of the methods described has drawbacks, and it is up to you
    to choose the method that best fits your software.


    Signing is the process of encoding a tamper-proof digital certificate into an
    application. The certificate identifies the application''s origin, and grants
    access to those APIs that are protected by Symbian OS platform security capabilities.
    Protected APIs are those that allow sensitive operations, such as may potentially:


    +   - access the users'' private data, thus breaching their privacy;

    - create billable events, thus costing the end user money;

    - access the mobile phone network, which may affect its operation;

    - access handset functions that can affect the normal behavior of the phone;

    - impact the performance of other applications running on the phone.


    If you don''t use any protected APIs, you may find it possible to avoid the signing
    process altogether. Approximately 60% of Symbian OS APIs require no capability
    to use them, so it may be possible to take this approach if you are creating a
    fairly simple application.


    Alternatively, where certain capabilities are required, you may be able to rely
    on the user to grant permission to the application at install-time (called ''blanket''
    permission), or at runtime (''single-shot'' permission). For example, the user
    can accept a request to send a message when the application needs to do so. However,
    this is somewhat dependent on the security policy applied to the smartphone by
    the device manufacturer. There is no guarantee that manufacturers or network operators
    will always allow applications to install on their devices or APIs protected by
    user capabilities if they are not certified by Symbian Signed.


    If you need, or choose, to get your application Symbian Signed, there are several
    options available. The costs of the different options vary depending on whether
    a Publisher ID is required, and whether independent testing is required. More
    information is available on Symbian Signed portal at www.symbiansigned.com.


    # Publisher IDs


    Publisher ID digital certificates form part of the public key infrastructure,
    and are issued by Certificate Authorities (CAs). The CA for Symbian Signed is
    TC TrustCenter.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# WHAT TO DO BEFORE YOU RELEASE YOUR APPLICATION


    You can purchase Publisher IDs directly from TC. TrustCenter at www.trustcenter.de/order/publisherid/dev.
    The cost of acquiring a Publisher ID is relatively low, and there are several
    benefits with holding one, which include the following:


    +   - More flexible developer certificates can be requested, enabling much wider
    deployment during development, for example, when performing beta testing.


    +   - Owning a Publisher ID allows more signing options and gives you control
    over publisher identity and branding.


    +   - Trust is important to end users of your application. Owning a Publisher
    ID allows you to enhance your reputation for delivering trusted applications.


    # Symbian Signed Testing


    As we''ve already discussed, testing is an essential part of all software development,
    and Symbian Signed defines specific tests to ensure a minimum level of robustness
    and stability for applications running on Symbian smartphones.


    The Symbian Signed tests are defined in the Symbian Signed Test Criteria, and
    are divided into two main groups.


    **Universal tests** (prefixed UNI) focus on installation, uninstallation, reliability,
    robustness and normal operational behavior in accordance with mobile phone end
    user expectations. For example:


    +   - Applications must install, uninstall and reinstall correctly, leaving no
    installation files behind after uninstall, must install correctly from external
    mass memory storage (for example, memory cards).


    +   - Applications must back up and restore successfully, and use appropriate
    file creation locations.


    +   - Applications must survive stress tests including low memory at startup,
    handling exceptional events like out-of-memory and power down or rebooting while
    running, and handle service interruptions, as well as rapid and repeated switching.


    +   - Applications must handle system events correctly and comply with Task List
    behavior guidelines.


    **Capability-related tests** (prefixed CAP) are additional tests that need to
    be passed by applications using certain specific capabilities only. For example:


    +   - Applications with MultimediaDD capability must not interfere with voice
    calls.'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'Phone applications must present a UI to enable the user to control the application.


    VoIP applications must present a Device Manufacturer disclaimer, and must not
    interfere with GSM-based telephony functions, including the ability to make emergency
    calls.


    All applications are expected to comply with the universal tests, and applications
    that use certain capabilities are required to comply with the capability-related
    tests


    The Symbian Signed test criteria document is constantly assessed and updated,
    and the latest version is available from www.symbians.com, where you can also
    find additional information about Symbian Signed. In addition, there is a comprehensive
    manual about Symbian Signed at developer.symbians.com/main/signed.


    # Freeware and Open Source


    Freeware and open source applications can be submitted for Symbian Signing free
    of charge, without the need for more information, visit the ‘Open Signed’ page
    at www.symbiansigned.com/app/page.


    # 6.1.6 Internationalize It!


    If you intend your application to run in more than one language, you will need
    to consider how you will ‘internationalize’ it (sometimes also known as ‘localization’).
    Internationalization generates software variants in multiple languages from a
    single set of source files. Typically, you should have a core of code which contains
    all the functionality of your application and doesn’t change regardless of the
    language it is presented in. A second part contains the changing content, such
    as text strings displayed in the UI.


    Not only do you need to consider the differences in language when you internationalize,
    but you must also consider variations in writing systems, regional differences
    (such as layout of numbers, time or measurements) and specific customizations.
    Although this may seem unduly complex, by making your application accessible in
    different regions, you can reap additional benefits in the form of wider market
    appeal and the ability to enter markets that would otherwise have been unavailable
    to you. Symbian OS was designed as an international OS from the ground up, and
    this makes it relatively easy to design applications for multiple languages and
    regions. That said, internationalization needs to be designed into your product
    from the start. Rewriting code at late stages of development introduces complexity
    and the risk of regression.'
  merge: -1
