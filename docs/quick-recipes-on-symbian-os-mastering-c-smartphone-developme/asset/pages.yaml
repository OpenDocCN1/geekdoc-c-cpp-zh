    There is a nice Flash tutorial to introduce Carbide.c++ at developer.symbian.com/main/learning/flash,
    and a booklet started with Carbide.c++ available from developer.symbian.com/carbide_booklet_wikipedia.


    # 1.2.2 Development Communities


    In order to get more information, meet your fellow developers, ask questions and
