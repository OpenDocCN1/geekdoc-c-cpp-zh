  md: '# Table 3.1 Fundamental Data Types on Symbian OS


    | Data types | Description | C++ built-in types |

    |---|---||

    | TInt | Signed integer. It is guaranteed to be at least 32 bits in all implementations
    | signed int |

    | TUInt | Unsigned integer. It is guaranteed to be at least 32 bits in all implementations
    | unsigned int |

    | TInt32, TInt16, TInt8 | 32-bit, 16-bit and 8-bit signed integer | long int,
    short int, signed char |

    | TUInt32, TUInt16, TUInt8 | 32-bit, 16-bit and 8-bit unsigned integer | unsigned
    int, unsigned short int, unsigned char |

    | TInt64, TUInt64 | 64-bit integer | long long, unsigned long long int |

    | TText | Build-independent text character. It is mapped to TText16 | unsigned
    short int, unsigned char |

    | TText8, TText16 | 8-bit and 16-bit unsigned character | unsigned char |

    | TReal32 | 32-bit floating point number | float |

    | TReal, TReal64 | 64-bit floating point number | double |

    | TBool | Boolean type | int |

    | TAny | Pointer type | void |


    # 3.2 Symbian OS Class Conventions


    By convention, there are several class types on Symbian OS, each of which has
    different characteristics, such as where objects may be created (on the heap,
    on the stack, or on either) and how objects should be later cleaned up. The classes
    are named with a prefix according to type, and this convention makes the creation,
    use and destruction of objects more straightforward. When writing code, the required
    behavior of a class should be matched to the Symbian OS class characteristics.
    Later, user of an unfamiliar class can be confident in how to instantiate an object,
    use it and destroy it without leaking memory.


    # 3.2.1 T Classes


    Class names prefixed with T are used for classes that behave like the fundamental
    built-in data types (it is for this reason that they are prefixed with the same
    letter as the `typedefs` described above – the ‘T’).


    Just like the built-in types, T classes do not have an explicit destructor. In
    consequence, T classes must not contain any member data which itself has a destructor.
    T classes contain all their data internally and have'
