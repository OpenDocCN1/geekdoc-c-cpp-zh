- img_proc: true
  md: '# Releasing Your Application


    This chapter describes some of the common issues that you may face when you come
    to release your application. Regardless of whether you intend to charge for your
    application, release it as freeware or start an open source project, there are
    some issues that you may wish to consider in order to ensure that it is of the
    best possible quality. Having discussed those issues, we then move on to describe
    some of the ways to distribute your application, and finish by directing you to
    some further resources that may be helpful throughout the software development
    lifecycle.


    # 6.1 What To Do Before You Release Your Application


    With all platforms, there are good C++ applications for Symbian smartphones, and
    there are others that are not so good. It is not just about how the application
    works, but also how the code performs under the hood. There’s a lot you can do
    to make sure your application is not just ‘good enough’, but is of great quality.
    This section discusses things to consider.


    # 6.1.1 Look At It!


    When you create an application, you have two choices:


    +   - You can use the controls provided by the platform UI, and integrate with
    the standard look and feel.


    +   - You can create your own UI code, perhaps because you want to retain the
    look and feel of the application as it runs on another platform (this is a standard
    technique used by games). The size of this task can be significant if you need
    a number of controls for different kinds of user interaction, such as list boxes,
    dialogs and progress bars. Creating'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'custom UI may require the use of direct screen access to write to the screen,
    which is discussed in Recipe 4.5.3.5.


    Most application developers take the first option, which is to use the UI controls
    provided by Avkon (for S60) or Qikon (UIQ), so it is this approach that we examine
    in this section.


    If you are planning to use the standard platform look and feel, we recommend that
    you familiarize yourself with documentation about how to use the UI classes provided
    by the platform, which is available on the developer community websites listed
    in Section 1.2. For UI development, the book UIQ 3: The Complete Guide is another
    useful resource, and is available in printed form and in the form of a wiki at
    books.uiq.com.


    Both S60 and UIQ publish style guides that describe the best practice for designing
    an intuitive UI using the standard platform controls. Links to these guides can
    be found on this book’s web page at developer symbian.com/quickrecipesbook.


    Studying these is an excellent way to familiarize yourself with what is in the
    ''control toolbox'' for each UI and learn how they are expected to be used, since
    they have been created and considered by the designers of each UI platform. Following
    the guidelines will give your application a degree of consistency with others
    running on the smartphone and make it intuitive, which will give the user confidence
    that they are able to use it easily.


    It is also worthwhile studying the layout of the applications supplied on the
    phone, and the behavior of other products. The user experience is, to extent,
    subjective, so it is important to gather empirical evidence by performing usability
    testing on your application. Get user feedback on the design – users who are new
    to the application, and those who have used it for some time, those who have never
    used that type of application previously and those who are experienced with a
    competitive product, or a similar style of application. Your testers will be able
    to give you the best feedback on ''feels right'' and doesn''t.


    The user interface of a mobile device is significantly different from that of
    a desktop machine, and if you are new to S60 or UIQ, it''s worth taking some time
    to research what works, according to the platform and the input style of the target
    devices (for example, whether it has a touchscreen or soft keyboard input, whether
    it has a keyboard or QWERTY keyboard, the style of input controller, if it has
    one, and the screen''s orientation, size and resolution).


    If you are targeting a range of devices, or working on both UI platforms, your
    design is constrained further, and testing becomes more complex. The Windows emulator
    is useful for preliminary testing, and can be set up with different screen resolutions,
    orientations and input modes,'
