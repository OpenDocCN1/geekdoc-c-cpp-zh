- img_proc: true
  md: 'Symbian OS contains a modular Multimedia Framework system that allows you to
    develop controller plug-ins that can extend those multimedia capabilities. Controller
    plug-ins can be used to support more media formats and/or more networking protocols,
    although the emphasis in the system is that one controller plug-in should, if
    at all possible, support all the networking protocols that allow access to a particular
    set of media types.


    By default, remote access to media data should be streamed (as opposed to downloaded)
    by a controller plug-in.

    The first classes to look at if you want to develop a Multimedia Framework controller
    plug-in are CMMFController, CMMFAudio Output, CMMFSource, CMMFFormatDecode, CMMFDataSink
    and MDataSource.


    The well-known and advanced set of source code for a Multimedia Framework controller
    plug-in can be found at www.helixcommunity.org.


    # 5.3 Advanced Application Deployment


    # 5.3.1 Automatic Installation


    This is an interesting trick that can greatly benefit a commercial-grade application.


    Normally, when you select a SIS file and choose to install the application, it
    deploys, the installation process leaves a small stub file in the private data-caged
    folder of the application, saving it on the memory card. You can exploit this
    knowledge to enable automatic installation.


    If you save the SIS file for your application in its private data-caged folder
    on a clean memory card, application installation will automatically automatically
    when the card is put into a device which has not had the application previously
    installed. The installation is not silent, but it does not require the user to
    navigate to the SIS file and start it manually. The original SIS file is left
    on the memory card, no stub SIS file is created, which is a potential waste of
    disk space, depending on the size of the file.


    This approach only works if the application was never previously installed on
    the handset. From a commercial standpoint, it allows you to distribute your application
    on a memory card, facilitating an extra distribution channel.


    # 5.3.2 Custom Install


    As we''ve seen from the examples that accompany this book, applications are deployed
    to the device through SIS files, which are generated by packaging application
    binaries according to the instructions in a human-readable PKG file. The PKG file
    can be modified to include binaries that'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'will be executed at install-time. In the case of a set of binaries that require
    some additional setup, you can structure your PKG file in the following order:


    +   - A cleanup executable, run at uninstall-time and only blocking (options "FR,
    FR, RR, RW")

    - Your binaries.

    - A setup executable, run at install all and non-blocking (options "FR, RI")


    The options would be added at the end of the line for the binary in the PKG file.

    There are many useful features to the PKG file format, like conditional selection
    of binaries, language selection (so you can deploy the same SIS to several countries
    without wasting memory on the handsets), displaying information dialogs to the
    user at install-time, and so on.

    Thebian Developer Library supplies documentation and examples of how to use PKG
    files. Take a look at the Software Installation Toolkit in the Symbian OS Tools
    and Utilities section for more information.


    # 5.3.3 Embedded Binaries


    You can package a SIS file within another SIS file, just like any other binary.
    What this does is effectively embed the SIS file within the enclosing SIS file.
    At installation time, when the instruction to install the embedded SIS file is
    reached, the installation of other files within the enclosing SIS file is automatically
    interrupted in order to install the embedded SIS.

    At first sight, this doesn’t really seem like a particularly important feature.
    One could ask, why not copy-and-paste the content of the smaller PKG file into
    the bigger one? Cases become more obvious when considering inter-company development,
    allowing one company to redistribute another company’s binaries. The approach
    can also be used to sign reusable libraries, for example, to give them additional
    platform security capabilities.'
  merge: -1
