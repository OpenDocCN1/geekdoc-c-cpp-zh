    # 6.1.2 Test It!


    This book has reinforced the message that, on mobile platforms, you need to aim
    for code which is well-behaved – it shouldn’t leak or consume memory, disk space
    or other resources such as battery power. For example, running tight loops, writing
    code which continuously polls for a result, keeping the backend on the phone constantly
    enabled are all likely to degrade the battery life of the device. It’s important
    to consider where code can go wrong, and guard against the potential problems
    by testing, testing and more testing.


    Code reviews are a good way to share coding tips and learn from your colleagues.
    Inspections can range from formal reviews when code reaches a particular milestone
    to informal checks whenever a defect is submitted into the code base. Find a way
    that works for your team and review regularly, so everyone is familiar with the
    issues encountered in the code, the solutions and any items still on the to-do
    list. We have published the set of coding standards used by developers within
    Symbian'
