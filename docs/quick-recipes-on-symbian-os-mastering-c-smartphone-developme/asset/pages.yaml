  md: 'check if a request has completed. On a mobile operating system this can lead
    to significant power drain because a tight polling loop prevents the OS from powering
    down all but the most essential resources.


    The ''active object framework'' is used on Symbian OS to simplify asynchronous
    programming. It is used to handle multiple asynchronous tasks in the same thread
    and provides a consistent way to write code to submit asynchronous requests and
    handle completion events.


    A Symbian OS application or server will usually consist of a single main event-handling
    thread with an associated active scheduler that runs waiting on completion events.
    The events are generated by asynchronous services encapsulated in active objects,
    with an event-handling function that the active scheduler calls if the request
    associated with the active object completes.¹ So, when the asynchronous service
    with an active object completes, it generates an event, which is detected by the
    active scheduler. The active scheduler determines which active object is associated
    with the event, and calls the appropriate active object to handle the event.


    > Tip: An active object encapsulates a task; it requests an asynchronous service
    from a service provider and handles the completion event later when the active
    scheduler calls it.


    Within a single application thread, active objects run independently of each other,
    similar to the way that threads are independent of each other in a process. A
    switch between active objects in a single thread incurs a lower overhead than
    a thread context switch, described shortly, which is ideal for lightweight event-driven
    multitasking on Symbian OS.


    #  3.15.1 Preemption


    Within a single thread, the active object framework uses non-preemptive multitasking.
    Once invoked, the event handler must run to completion before any active object''s
    event can run - it cannot be preempted.


    Some events strictly require a response within a guaranteed time, regardless of
    any other activity in the system (e.g., low-level telephony). This is called ''real-time''
    event handling. Active objects are not suitable for real-time tasks and on Symbian
    OS real-time tasks should be implemented using high-priority threads. Symbian
    OS threads are scheduled preemptively by the kernel, which runs the highest-priority
    thread eligible.


    ¹ Windows programmers may recognize the pattern of message loop and message dispatch
    that drives a Win32 application. The active scheduler takes the place of the Windows
    message loop and the event-handling function of an active object acts as the message
    handler.'
