    # 4.2.1 Before You Start with Contacts


    Surprisingly, the Contacts database contains contact items. They are either cards
    or groups. Each item has an identifier during its lifetime in the database, and
    each item contains fields. The fields each contain:


    +   - A content type, which identifies the meaning of the information contained
    in the field (such as a phone number or an address) can be a combination of several
    types to reduce data duplication. For example, email and instant messaging fields
    could have the same value.


    +   - A storage type, which identifies the kind of data stored in the field: integer,
    a string, and so on.'
