  md: "# 3D GRAPHICS USING OPENGL ES\n\nWe suggest you start by drawing the following\
    \ on a piece of paper:\n\n+   - Let's say we want to approximate the quarter of\
    \ a circle in a 2D plane by drawing 10 points: 1 point per 10 degrees.\n\n+  \
    \ - The full circle is 40 points (4 of them are redundant) and all the coordinates\
    \ can be found by using the sine and cosine mathematical functions.\n\n+   - Add\
    \ a dimension: we need 40 circles to simulate a sphere (1 is redundant) and we\
    \ end up with 1,600 points (266 of them are redundant).\n\n+   - All that's left\
    \ to create all the triangles between adjoining points.\n\n+   - Looking at our\
    \ 2D circle and the next one like it in the 3D space (the original circle rotated\
    \ by 10 degrees on the Y axis), you can see adjoining points forming 36 rectangles,\
    \ each of them made up of 2 triangles.\n\n+   - We need to go through the 180\
    \ degrees (still rotating on the Y axis) worth of rectangles so our sphere model\
    \ is made up of 1,296 triangles.\n\nFeel free to get up and fetch some kind of\
