  md: "# The Difference between Panics and Leaves\n\nSince it is not part of the C++\
    \ standard, the trailing L cannot be checked during compilation, and can sometimes\
    \ be forgotten. Symbian OS provides a helpful tool, Leavescan, to check code for\
    \ incorrectly named leaving functions. Some other static code-analysis tools are\
    \ discussed in Chapter 6.\n\nBefore any further discussion of leaves, it is important\
    \ to make the distinction between leaves (which are Symbian exceptions) and panics.\n\
    \nLeaves are used to propagate errors to where they can be handled. A leave does\
    \ not terminate the flow of execution on Symbian OS. In contrast, panics are used\
    \ to stop code running. They are intended to ensure robust code logic by flagging\
    \ up programming errors in a way that cannot be ignored. Unlike a leaf, a panic\
    \ cannot be trapped, because it terminates the thread in which it occurs.\n\n\
    On phone hardware, a panic is seen as an ‘Application closed’ message box. When\
    \ debugging on the emulator builds, the panic breaks the code into the debugger\
    \ by default, so you can look at the call stack and diagnose the problem.\n\n\
    To cause a panic in the current thread, the Panic() method of the static class\
    \ can be used. It is not possible to panic other threads in the system, except\
    \ those running in the same process. To panic another thread running in the running\
    \ process, your code should open an RThread handle and call RThread::Panic().\
    \ We'll discuss how to work with Symbian OS leaves in this chapter.\n\nSymbian\
    \ OS has a set of well-documented panic categories (for example, KERN-ERNIC, E32USER-CBASE,\
    \ ALLOC, USER), the details of which can be found in the reference section of\
    \ the Symbian Developer Library in the SDK.\n\n# TRAP AND TRAPD Macros\n\nThe\
    \ TRAP and TRAPD macros can be used to ‘catch’ a leave and to extract the leave\
    \ integer. If a leave occurs in a function called within a TRAP, control will\
    \ return immediately to the TRAP harness macro. The TRAP macro requires that the\
    \ variable has been defined beforehand, while TRAPD defines the variable for you.\
    \ The following code shows how to trap a leave method:\n\n```\nTint leaveCode;\n\
    TRAP(leaveCode, LeavingMethodL());\nif (KErrNone == leaveCode)\n{\n    // If no\
    \ error, do something.\n}\n```"
  merge: -1
