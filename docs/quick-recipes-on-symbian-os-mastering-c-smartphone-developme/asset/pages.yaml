    to a mobile platform, but the general performance improvement may be worth the
    effort.


    Because of the APIs that are unavailable in OpenGL ES, you probably won''t be
    able to just use the code generated by your visual modeling tool. You can still
    display everything you want on the screen, but you may have to invest more effort
    in getting there.


    The later OpenGL ES version you are targeting, the easier it should get for you,
    the developer. Unfortunately, this also translates to lower availability of handsets.


    All OpenGL polygons need to be expressed in terms of triangles in order to be
    drawn using OpenGL ES.


    OpenGL ES only supports 2D textures, but you can still several textures at once,
    use reflection, fog, transparency, and so on.


