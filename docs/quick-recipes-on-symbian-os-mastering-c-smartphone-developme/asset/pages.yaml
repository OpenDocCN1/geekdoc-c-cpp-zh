  md: '# 6.2.5 Open Source


    If you are interested in setting up an open source project, a good place to start
    is the open source page on Symbian Developer Network at developer.symbian.com/main/tools/opensrc.
    You will also find a thriving open source community at opensource.nokia.com and,
    of course, at www.sourceforge.net.


    # 6.3 Where To Go Next


    A range of technical papers, which can be found at developer.symbian.com/osslibrary,
    are published weekly on Symbian Developer Network. The papers cover all aspects
    of Symbian OS C++ programming, as well as programming in other languages and runtimes,
    and range from the basic to the most advanced levels. The technical papers topics
    such as the best for debugging and error handling, how to use Symbian''s C++ idioms,
    to solve particular problems and introductions to using the new technologies available
    on Symbian.


    You can also find the Symbian OS System Model, as shown in Figure 6.1, at www.developer.symbian.com/main/osslibrary/sys_models.


    ![](img/c73f4eb815fa3d047325b097ae8a7c1d_374_0.png)


    Figure 6.1 The System Model for Symbian OS v9.2'
