    # 2.8.3 Changing the Certificate/Key Pair


    By default, Carbide.c++ creates a self-signed certificate/key pair when creating
    a SIS file. A self-signed certificate is sufficient for many applications. However,
    there are cases when you need to apply for a developer certificate at Symbian
    Signed (www.symbiansigned.com), for example when using the Location API (Section
    4.10). The developer certificate allows your application to use restricted APIs
    that cannot be accessed using a self-signed certificate.


    Follow the instructions below to change the certificate/key pair of your project:


    +   - Right click the project name and select Properties.

    - In the Properties dialog, select Carbide.c++ | Carbide Build Configuration.
    In the SIS Builder box, select the name of the SIS file and click Edit (see Figure
    2.22).

    - In the SIS Properties dialog, enter the certificate/key pair files (see Figure
    2.23). If your key requires a password, you can enter it here as well.


