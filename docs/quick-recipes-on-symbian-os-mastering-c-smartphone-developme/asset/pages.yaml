  md: '# # 1


    # ## Introduction and Setup


    The first part of this chapter will help you set up your development environment
    using free tools.

    While your computer is busy downloading and installing software, you should read
    the second part of this chapter. It contains a host of critical information you
    need before you start using the development tools.

    When all the tools are installed, there are a few more minor configurations to
    go through in the last part of this chapter.


    # ### 1.1 Tools: What You Need and Where to Find It


    # #### 1.1.1 System Requirements


    System requirements for C++ development on Symbian OS v9.x are as follows:


    +   - Microsoft Windows 2000 Professional with Service Pack 3 or MS Windows XP
    Professional with Service Pack 2, running on a laptop or desktop computer. At
    the time of writing this book, most Symbian SDKs do not support Windows Vista.

    - At least 512 MB of RAM (1.5 GB recommended).

    - 1-GHz or faster Pentium-class processor (2-GHz Pentium-class processor recommended).

    - At least 1 GB of free disk space (5 GB recommended).

    - 16-bit color display capable of a 1,024 × 768 pixels resolution.

    - Java™ Runtime Environment (JRE) 1.4.1_ or later (available from java.com).

    - ActivePer 5.6.1 build 568 or later (available from activatestate.com).'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# INTRODUCTION AND SETUP


    +   - Microsoft Core XML Services (MSXML) 4.0.

    - ZIP decompression software to open the installation package.

    - Local-administrator rights for installation and removal of software.

    - The PC Suite software for your handset. You should find the latest version of
    this software on the website of the manufacturer of the handset.


    ActivePerl may be bundled in some of the Software Development packages you will
    be installing.


    # 1.1.2 IDE


    The recommended Integrated Development Environment for Symbian OS C++ development
    is Carbide.c++. You can download the free Express Edition from: forum.nokia.com/carbide.
    Section 1.2.1 describes Carbide.c++ in more detail.


    # 1.1.3 SDKs


    Symbian OS is split into two platforms: S60 3rd Edition and UIQ 3. (There is a
    third one, called MOAP, available only in Japan, which this book doesn''t cover.)

    Each platform is replaced by different versions (or Feature Pack numbers for S60).

    Once you know handsets you want your applications to run on, you can identify
    all your target platforms and their version using the following websites: www.symbian.com/life/s60phone
    (for S60) and www.uiq.com/uiqphones (for UIQ).

    You need to download all the SDKs for all your target platforms. At the time of
    writing, this could mean you five different SDKs for development of Symbian OS
    v9.x: S60 3rd Edition Maintenance, Feature Pack 1 and Feature Pack 2 Beta, along
    with UIQ 3.0 and UIQ 3.1.

    The SDKs can be downloaded from: developer.symbian.com/main/tools.


    # 1.1.4 Compilers


    There are two free compilers for Symbian OS C++ development.

    The Nokia x86 compiler targets the Symbian OS emulator for Microsoft Windows included
    in the SDK. You will see this referenced as WINSCW.

    The open source GCC-E compiler targets the actual handsets, where Symbian OS runs
    on an ARM processor.

    Both compilers should be bundled in the SDK installation package, but GCC-E must
    be installed to a folder whose path contains no ''space'' characters or your builds
    will fail with ''missing separator'' errors.'
  merge: -1
