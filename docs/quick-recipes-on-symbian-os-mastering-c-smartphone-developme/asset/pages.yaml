  md: "# ACTIVE OBJECTS\n\n+   1. When it is not handling other completion events,\
    \ the active scheduler suspends a thread by calling User::WaitForAnyRequest(),\
    \ which waits for a signal to the thread's request semaphore.\n\n+   2. If no\
    \ events are outstanding in the system entirely, this is at this point that the\
    \ OS can power down to sleep.\n\n+   3. When an asynchronous server has finished\
    \ with a request, it indicates completion by calling User::RequestComplete() (if\
    \ the service provider and requestor are in the same thread) or Rthread::RequestComplete()\
    \ otherwise. The RequestStatus associated with the request is passed into the\
    \ RequestComplete() method along a completion result, typically one of the standard\
    \ error codes.\n\n+   4. The RequestComplete() method sets the value of TRequestStatus\
    \ to the given error code and generates a completion event in the requesting thread\
    \ by signaling a semaphore.\n\n+   5. When a signal is received and the thread\
    \ is next, the active scheduler determines which active object should handle it.\
    \ It checks the priority-ordered list of active objects for those with outstanding\
    \ requests (theirs have their isActive Boolean set to True as a result of calling\
    \ CObject::SetActive()).\n\n+   6. If an object has an outstanding request, the\
    \ active scheduler checks itsStatus variable to see if it is set to a value other\
    \ than KRequestPending. If so, this indicates that the active object is associated\
    \ with the completion event and the event handler code should be called.\n\n+\
    \   7. The active scheduler clears the active object's isActive Boolean and calls\
    \ its RunL() event handler.\n\n+   8. Once the Run() call has finished, the active\
    \ scheduler re-enters the event processing loop by issuing another User::WaitForAnyRequest()\
    \ call. This checks the thread's request semaphore and suspends it (if no other\
    \ events need handling) or returns immediately to lookup and event handling.\n\
    \nThe following pseudo-code illustrates the event-processing loop:\n\n```\nEventProcessingLoop()\n\
    {\n  // Suspend the thread until an event occurs\n  User::WaitForAnyRequest()\n\
    \  // Thread wakes when the request semaphore is signaled\n  // Inspect each active\
    \ object added to the scheduler,\n  // in order of decreasing priority\n  // Call\
