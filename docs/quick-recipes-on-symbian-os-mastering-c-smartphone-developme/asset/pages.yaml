    # Networking


    Symbian OS has comprehensive support for IP networking protocols for developing
    applications that can run over a variety of IP-capable bearers, whether it is
    Wireless LAN or GPRS.


    The networking stack is implemented using client-server architecture, in the ESOCK
    component, just like many other framework service providers in Symbian OS. The
    client side exposes a generic, protocol-defined API; the server provides a plug-in
    interface to load and manage various protocols, each of which can run in a separate
    thread and are accessible through the client APIs. Examples of protocols loaded
    by ESOCK include Bluetooth, IrDa and IP.


    The IP head handles the TCP/IP stack, which implements the popular TCP (RFC 793)
    and UDP (RFC 768) protocols running over IP (RFC 791). The TCP/IP stack in turn
    communicates with low-level bearers representing link layer technologies such
    as WLAN and GPRS through network interfaces.


    CommDat, which is a separate client library, is used to store and retrieve various
    settings relating to the networking subsystem and is used by both the IP-subsystem
    and client applications for settings retrieval and storage. See Figure 4.3.1.


    In order to keep them as simple as possible, the code samples in these recipes
    use few active objects as possible. Most asynchronous method calls are simply
    followed by User::WaitForRequest(). This'
