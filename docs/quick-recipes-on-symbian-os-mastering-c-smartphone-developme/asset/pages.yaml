- img_proc: true
  md: 'A collection of FAQs is provided at developer.symbian.com/main/learning/faq.


    The Symbian Developer Network also has a wiki site, where you can post contributions
    to content of relevance and use to Symbian developers. The wiki is found at developer.symbian.com/wiki
    and is regularly updated by both Symbian staff and external developers – for example,
    record errata lists for the Symbian Press books, publish presentations at public
    developer events, and post useful links to developer blogs and websites, information
    about tools, open source projects and example code. The wiki page for this book
    is developer.symbian.com/quickrecipesbook.


    # 6.3.1 Symbian Press Books


    Symbian Press published a range of books for beginners and advanced developers,
    and project managers. The following titles are a few examples that may be of interest
    if you are, respectively, new to Symbian OS, looking for a definitive Symbian
    C++ reference book, working on UIQ 3, a developer or project manager.


    Developing Software for Symbian OS, an excellent place to start if you have not
    used Symbian C++ before. It guides you through the basics, starting with an explanation
    of common terms and building your first application, using the build tools and
    environment to work with Symbian OS v9. The main part of the book covers the fundamentals
    needed when writing for Symbian OS, including sections about the architecture
    of Symbian OS, platform security and GUI application programming.


    If you have some Symbian OS development experience, Symbian C++ for Mobile Phones,
    volume 3 is a recommended reference guide. The book starts with an overview of
    build tools and the emulator, and devotes over 700 pages to the essentials of
    Symbian OS with deeper coverage, particularly in the area of graphics and user
    interfaces.


    A recent publication supported by Symbian Press is UIQ 3: The Complete Guide,
    is partially available in wiki form on books.uiq.com and will be published by
    John Wiley & Sons Ltd in mid-2008.


    Another record in the Symbian Press range is Games on Symbian OS: A Handbook for
    Mobile Development. Published in February 2008, it shows how to create mobile
    games for Symbian smartphones using native C++, Java, Doja, Flash Lite, as well
    as the support for portant projects using standard/C++. The book also describes
    the support available for standards such as OpenGL ES, examines the N-age platform
    and discusses the use of multiple solutions such as Ideaw3D''s AirPlay.


    If you are a project manager, then David Wood''s Symbian Software for Leaders
    is an essential guide, explaining how to manage projects involving Symbian OS,
    from the creation of smartphones to the development of'
