    For Symbian OS DLLs, capabilities are also declared in the MMP file, but they
    have a different meaning: to a loading process the amount of trust that can be
    placed in a DLL. An EXE cannot load a DLL if it possesses more capabilities than
    the DLL, because then the DLL will not be trustworthy to run securely within the
    process. A process can only load a DLL if that is trusted with at least the capabilities
    as that process.


    However, a process can load a DLL which has been assigned more capabilities than
    itself, but that DLL will only be allowed to use the capabilities of the process
    in which it runs – it doesn''t add trust to the process. This means that DLL code
    cannot assume it will always be running with the capabilities it needs, since
    these are dependent on the process it has been loaded into. If a DLL requires
    a particular capability, this should be clearly specified in its documentation.'
