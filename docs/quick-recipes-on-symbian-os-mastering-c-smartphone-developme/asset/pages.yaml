  md: '# EXECUTUTABLE FILES


    59


    TARGETTYPE indicates the file of type to be built, for example an EXE, in the
    case of an executable application, or a DLL. The most commonly Symbian OS target
    types are DLL, EXE and PLUGIN (ECO plug-in). Other supported types include PDD
    and LID (physical device driver and logical device driver, respectively), LIB
    (a static library binary code is included directly in any component that links
    against it – as compared to a shared library, which is released as a separate
    binary), and EXEEXP (an executable which exports functions, so they can be used
    by other applications or DLLs).


    UID specifies the final two of the target''s three identifiers (UIDs) that are
    used to uniquely identify the binary. On Symbian OS, each UID is a 32-bit value.
    The three UIDs are as follows.


    # 3.10.1 UID1


    This is the system-level identifier that distinguishes between EXEs and DLLs.
    For example, the TARGETTYPE specified for a shared library is DLL. This means
    that UID1 is set by the build tools to be KDynamicLibraryUid (0x10000079). An
    application has UID1 set to KExecutableImageUid (0x1000007a) by specifying a TARGETTYPE
    EXE.


    The value of UID1 is built into the binary by the build tools on the keyword used
    with the TARGETTYPE identifier in the MMP file, and the value of UID1 does not
    need to be specified in an MMP file because it is automatically applied.


    # 3.10.2 UID2


    For DLLs, this UID is used to differentiate between shared library and polymorphic
    interface DLLs. For shared libraries, UID2 is KSharedLibraryUid (0x1000008d) but
    the value for polymorphic DLLs depending on their plug-in type (for example, the
    socket protocol module UID2 value is 0x1000004a). You can find more about the
    difference between the DLL types in the Symbian Library documentation in your
    SDK.


    UID2 is not relevant for TARGETTYPE EXE and can be set to 0 or not specified at
    all in the MMP file.


    # 3.10.3 UID3


    The third UID identifies a file uniquely. No two executables may have the same
    UID3 value, and values must be requested from Symbian, which allocates them from
    a central database to ensure that each binary has a different value. You must
    register with Symbian Signed (www.symbiansigned.com) to request values for use
    as UID3'
