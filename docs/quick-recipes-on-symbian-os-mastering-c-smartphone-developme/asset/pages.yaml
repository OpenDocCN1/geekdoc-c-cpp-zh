    can be handled without delay.


    # DoCancel()


    An active object must be able to cancel an outstanding asynchronous request. An
    active object class must implement the pure virtual Cancel() method of the base
    class to terminate a request by calling the appropriate cancellation method on
    the asynchronous service provider. DoCancel() must never leave or allocate resources
    and should not carry any lengthy operations, simply cancel the request and perform
    any associated cleanup.

    Active::Cancel() calls DoCancel() and waits for notification that the request
    has terminated. Cancel() must be called whenever a request is to be terminated,
    not DoCancel(), since the base class method whether a request is outstanding and
    performs the necessary way until it has terminated.


    # RunError()


    The CActive class provides a virtual RunError() method which the active scheduler
    calls if RunL() leaves. If the leave can be handled, this should be done by overiding
    the default implementation of CActive::RunError() to handle the exception.


    # Destruction


    The destructor of a CActive-derived class should always call Cancel() to cancel
    any outstanding requests. The CActive base-class destructor checks that the active
    object is not currently active. It panics with E32USER-CBASE 40 if any request
    is outstanding; that is, if Cancel() has not been called. This catches any programming
    errors where a call to Cancel() has been forgotten. Having verified that the active
    object has issued no requests outstanding, the CActive destructor removes the
    active object from the active scheduler.


    The reason it so important to cancel requests before destroying an active object
    is that otherwise the request would complete after the active object had been
    destroyed. This would cause a ''stray signal'' because the active scheduler is
    unable to find a handler for the event. This results in a panic (E32USER-CBASE
    46).'
