    When the audio file has been opened, the observer method, MoscoStateChangeEvent(),
    is called. This callback method has four parameters.


    ```

    void CSimpleAudioRecorder::MoscoStateChangeEvent(CBase* aObject,

    Tint aPreviousState, Tint aCurrentState, Tint aErrorCode)

    ```'
