    On Symbian OS, a filename and its extension are separated by a period (.). The
    drive letter and the path are separated by a backslash character (\), and the
    path and the filename are separated by a backslash character (\). However, when
    quoting path spec in a Symbian OS descriptor that describes a file path, you must
    use double backslashes (\\).


    A drive letter can be labeled from A: to Z; where: C is always the phone''s internal
    memory and Z: is always the ROM drive. Other drives may be used differently by
    manufacturers. For example S60 devices use the E: drive for the external memory
    card or hard drive. Most UIQ use the D: drive for the external media.


