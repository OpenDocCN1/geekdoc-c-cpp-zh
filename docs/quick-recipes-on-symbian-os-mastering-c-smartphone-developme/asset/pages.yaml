- img_proc: true
  md: '# 3.9.2 Dynamic Arrays


    Symbian OS, the implementation of a dynamic array may either use:


    +   - A single heap cell as a ‘flat’ buffer to hold the array elements, which
    is resized as necessary. This memory layout is preferred when the speed of element
    lookup is an important factor or if the array is not expected to be frequently
    resized.

    - A number of segments, using a doubly linked list to manage them. This layout
    is best for large arrays which are expected to be resized frequently, or when
    elements are regularly inserted into or deleted, since repeated reallocations
    in a single flat buffer may result in heap thrashing as elements are shuffled
    around.


    The original dynamic array classes provided in early versions of Symbian OS were
    C classes, of which there are a number of different types, all of which have names
    prefixed by “CArray". We refer to them generically as "CArray" classes. The different
    types of array exist to store various types of array:


    +   - Fixed elements – all items have the fixed size (e.g., TRect).

    - Variable elements – the items may have different size, so they are pointers
    to objects of variable lengths elsewhere on the heap (e.g., HBufC* or TAny*).

    - Pointer elements – the items are the pointers to CBase-derived objects.

    - Packed elements – the items are ‘packed’ T-class objects of variable length;
    that is, each element is preceded by its length.


    3.3 summarizes the combinations defined in the SDK. As Symbian OS evolved, a second
    set of dynamic array classes (RArray and RPointerArray) was added later (the CArray
    classes were retained). The newer array classes are R classes, and may thus be
    instantiated on the heap or stack, but are usually stack-based. R classes, they
    hold a handle to a block of memory used to store the array buffer, which in both
    cases is a resizable flat buffer rather than a doubly linked list of segments.


    For performance reasons, when CArrayFixFlat is the type of array needed, we recommend
    that you actually use RArray, and when CArrayPtrFlat is a good choice, we recommend
    that you use RPointerArray instead.'
  merge: -1
