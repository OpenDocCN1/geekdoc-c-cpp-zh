    allocate memory to store another object, or to read from a configuration file,
    which may be missing or corrupt. There are many reasons why initialization may
    fail, and the way to accommodate this on Symbian OS is to use two-phase construction.

    Two-phase construction breaks object construction into two parts, or phases:


    +   A C++ constructor that cannot leave.

    This is the constructor that is called by the new operator. It implicitly calls
    base-class constructors and may also invoke functions that'
