    **Problem:** You need to retrieve the default path for multimedia files.

    S60 and UIQ store multimedia files in different folder locations. For example,
    the default path for audio files on S60 on the C: drive is c:\data\sounds, while
    on UIQ it is c:\Media files\Music.

    The location used to store files on the emulator may also be different from that
    used on smartphone hardware. For example, the UIQ''s emulator uses c:\Media files\audio
    for audio files, compared to c:\Media files\Music when storing files on the device.

    And that''s not all! Even when considering phone hardware, the location in which
    files are stored in the phone memory may be different from that used on the memory
    card. For example, in S60 the default location in phone memory is c:\data\videos,
    while on the memory card it is e:\videos.

    How can we write a code that is able to return the media path independent from
    the platform and media type?


    **Solution:** Unfortunately, there is no single solution to this problem. S60
    and UIQ use different ways of getting media paths. You need to create two different
    implementations for each platform.


    # **Discussion:**


    S60

    The class to handle various media paths on S60 is PathInfo. It is declared in
    the pathinfo.h header file, and the library to link against pathformven.lib.

