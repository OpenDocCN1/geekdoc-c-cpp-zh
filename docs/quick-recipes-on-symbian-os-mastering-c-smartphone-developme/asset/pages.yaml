  md: '# RUNNING THE HELLO WORLD APPLICATION ON THE DEVICE


    filename extensions. Although it is unlikely you will ever see an unsigned .sissis
    files are common.


    You can use a number of ways to transfer the SIS file from PC to the smartphone.
    For example, the phone manufacturers normally provide a PC application to install
    the SIS file to the smartphone (Nokia releases PC Suite for S60 devices; Sony
    Ericsson releases PC Suite for Smartphones for their UIQ 3 devices). You could
    use the PC application that comes with the phone to install the SIS file or you
    could send an SMS that can be used to point the web browser of the phone to the
    SIS file, so that you can download and install it. Alternatively, you simply use
    a Bluetooth connection between a PC and the smartphone to send it to the phone.


    Figure 2.12 shows the Hello World application running on S60 3rd Edition and UIQ
    3 devices.


    ![](img/c73f4eb815fa3d047325b097ae8a7c1d_46_0.png)


    (a) S60 3rd Edition device (b) UIQ 3 device


    Figure 2.12 Hello World Application Running on the Device


    # What may go wrong when you install the SIS file:


    You may get an error message when you come to install the SIS file, which reads
    something like "Certificate error. Contact the application supplier."


    This is because some devices, such as most S60 3rd Edition devices, do not allow
    installation of unsigned SIS files. You must self-sign the SIS file, using your
    own certificate (or you could get it signed by a certificate/key pair from Symbian
    Signed).


    There are also some smartphones, such as Nokia ESeries phones, that do not allow
    the installation of self-signed applications by default. You have to make a change
    in the Settings menu to enable installation of self-signed applications.


    On the other hand, there are other devices, such as UIQ 3 devices from Sony Ericsson,
    which allow installation of unsigned SIS files.


    The bottom line is that each device manufacturer may have a different policy about
    installing unsigned and self-signed applications. The developer community for
    your platform can help you sort it all out.'
  merge: -1
