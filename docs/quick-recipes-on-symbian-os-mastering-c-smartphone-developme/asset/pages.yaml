    Developing a new messaging application is anticipated to get easier for Symbian
    OS v9.3 on S60 as the main messaging application becomes customizable.


    You should also expect any messaging application you develop to need engine-level
    (as opposed to GUI) changes when running on different platforms. The basic structure
    of folders and accounts under a service in S60 and UIQ. You will need to experiment
