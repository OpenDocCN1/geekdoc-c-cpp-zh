  md: '# 306 SYMBAN C++ RECIPES


    degraded to a lower quality than is required of distance from a base station or
    inability to receive satellite signals.


    Device status events and system module events are most useful to software components
    that perform administrative operations, as taking a positioning module online
    or offline. The events can be used to notify when such an administrative operation
    is complete.


    Device status events can also be used to keep a user informed as the status of
    a particular positioning technology module. For example, a phone status bar could
    be updated to show that GPS is active when information is being received.


    An application calls RPositionServer::NotifyModuleStatusEvent() to receive notification
    of module status changes, passing a reference to TPositionModuleStatusEvent object
    on which it has requested the event. An application also supplies a TRequestStatus
    and optionally a TPositionObjectId if changes from only one module are required.


    When the status of a module changes, the client application is notified. The TPositionModuleStatusEvent
    that was supplied to the location server now also contains details of the events
    that have occurred and are accessed by calling TPositionModuleStatusEvent::OccurredEvents().


    The following sections describe the steps to get module status changes, as shown
    in the code example below.


    +   1. Define the types of module status events for which notification is required.

    The client creates a TPositionModuleStatusEvent object with TPositionModuleStatusEventBase::TModuleEvent
    variable which defines the status events in which it is interested.


    +   2. Request module status change notifications.

    The client application calls the method RPositionServer::NotifyModuleStatusEvent()
    to make a request for module status changes notifications.

    Depending on whether the TPositionObjectId parameter is passed to the function,
    the application is notified of status changes for that module only or for all
    modules.

    On completion, the TPositionModuleStatusEvent object holds details of the types
    of events that have occurred.


    +   3. Check the types of status changes that occurred.

    The TModuleStatusEvent object contains both the requested event types and the
    event types that occurred.


    +   - The requested event types are accessed by calling TPositionModuleStatusEvent::RequestedEvents().'
