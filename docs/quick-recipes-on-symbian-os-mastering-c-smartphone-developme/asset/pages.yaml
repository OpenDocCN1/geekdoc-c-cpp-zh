    **Problem:** You want to obtain location information.


    **Solution:** Client applications use the RPositionServer and RPosition-ner classes
    to get position updates. RPositionServer is used by client applications to manage
    a session with the location server and to get positioning technology module. RPositioner
    is used by client applications to manage a subsection with the location server
    and to get position updates.

    For each location request from a client, the LBS subsystem can operate in one
    of several different positioning modes. The Location Acquisition API hides the
    details of which positioning mode is in from client applications. A client makes
    the same sequence of calls to the API to get a position update whichever positioning
    mode is used. Each mode is a different way of getting a position fix:


    +   - Autonomous

    LBS uses a GPS positioning module to calculate position fixes without assistance
    data from the network. This mode typically takes the longest time to obtain a
    location fix compared with the other modes.

    - Terminal-Based Positioning

    LBS uses an A-GPS positioning module to calculate position fixes using assistance
    data from the network. Assistance data specifies the GPS satellites that are above
    the horizon as seen from the mobile device''s'
