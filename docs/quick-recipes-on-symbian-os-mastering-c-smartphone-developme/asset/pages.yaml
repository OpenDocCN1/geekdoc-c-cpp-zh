  md: '# CONNECTIVITY


    A typical scenario for device discovery is based on the sequence below.


    +   1. Connect to the socket server (RSocketServer), and then select the protocol
    to be used using RSocket::FindProtocol(). Address and name queries are supplied
    by the stack''s BTLink-Manager protocol layer, so this be selected:


    ```

    RSocketServer sockServ;

    sockSockDesc::Connect();

    TProtocolDesc pd;

    _LITKL2Cap, "BTLinkManager");

    User::LeaveIfError(sockServ.FindProtocol(KL2Cap, pd));

    ```


    +   2. Create and initialize RHostResolver:


    ```

    RHostResolver hr;

    User::LeaveIfError(hr.Open(sockServ, pd.AddrFamily, pd.iProtocol));

    ```


    +   3. Set up the TInquirySockAddr variable so that its Access Code (IAC) equals
    KIAC (''General Unlimited'') and an action is KHostResquiry. The actual query
    is served by an RHostResolver::GetByAddress() call.


    ```

    TInquirySockAddr addr;

    TNameEntry entry;

    addr.SetIAC(KIAC);

    addr.SetAction(KHostResquiry);

    TStatus status;

    hr.GetByAddress(addr, entry, status);

    User::WaitFor(status);

    ```


    +   4. On completion, the TName variable contains the address and the class of
    the first found device. Subsequent calls to RHostResolver::Next() provide the
    data about other discovered devices until KErrResNoMoreResults is returned.


    +   5. In order to retrieve the name of the BT device instead of address, use
    the KHostResName flag in the TInquirySockAddr::SetAction() function. Both flags
    may be combined with OR operation if you want to know the device name and address
    simultaneously.


    **Discussion:** Device discovery is usually an asynchronous process, as many other
    communication APIs, and therefore it is often suitable to encapsulate it in an
    active object. Discovery process completion may take a long time, especially if
    there are many Bluetooth-enabled devices in the'
