  md: '# 4.6 3D Graphics Using OpenGL ES


    OpenGL ES is the embedded software industry''s standard of choice for displaying
    3D graphics on the screen. It is a subset of the more widely known OpenGL ES standard,
    adapted to resource-constrained devices. You can find a link to the OpenGL ES
    specifications at the end of this set of recipes, in the Resources 4.6.6.


    There are not many resources that cover OpenGL ES on Symian OS, although you will
    find more information available in the recent Symian Press book Games on Symian
    OS: A Handbook on Mobile Development (developer.symbian.com/gamesbook). We can''t
    expect you to be particularly familiar with OpenGL ES. However, it is unrealistic
    to expect this small section to teach you everything there is to know about OpenGL
    ES, so we are going to teach you the basics of ES v1.0 on Symbian and then point
    to other resources, so you can expand on the basics to write interesting applications.
    We will explain how to scale back a full desktop application so it can be ported
    to a smartphone. (If you already know OpenGL ES, which is not available in Symbian
    OpenGL ES uses a C-based API and has little to do with Symian OS C++, most of
    the code samples in this section are not really going to look like anything you
    have seen in this book.


    This section is probably the one domain where knowledge is the most important.
    Creating simple 3D objects is easy, but the amount of calculus required to create
    complex scenes can seem daunting to the novice.


    OpenGL ES and Symbian OS

    Symbian has provided a software-based implementation of the OpenGL ES 1.0 standard
    since Symbian OS v8.0a, and both S360 3rd Edition and UIQ 3DS SDKs provide plug-ins
    to upgrade it to OpenGL ES 1.1. In fact, the S360 3rd Edition FP1 SDK includes
    the OpenGL ES 1.1 plug-in by default.

    Currently, Symbian smartphones with support for hardware-accelerated 3D graphics
    include the N82, N93 and N95 from Nokia, the P990, M600 and W950i from Sony Ericsson
    and the MOTORIZ Z8 from Motorola. Clearly, this opens the way to get to a level
    of quality in game graphics that has not been seen on mobile phones before. The
    Nokia devices all have the PowerVR MBX graphics processor from Imagination Technologies,
    which you can read about at www.imgtec.com/PowerVR/Products/


    > 2 You can find the plug-in for S360 3rd Edition development at: www.forum.nokia.com/info/sw.nokia.com/id/36331d44-414a-4b82-bb20-85f183e7029/OpenGL_ES_1_t_Plug.html
    or by searching for ''OpenGL ES 1.1 Plug-in'' from the main page of the Forum
    Nokia website at www.nokia.com.

    3 OpenGL ES SDK for UIQ 3 is available from developer.uiq.com/devtools_uisdk.'
