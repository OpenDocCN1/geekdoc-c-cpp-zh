    # 3.14 Streams


    A stream in Symbian OS is the object''s external representation. The process of
    storing the object''s data into the stream is called *externalization*, and the
    opposite mechanism – *internalization* – reads the data from a stream and reconstructs
    an object as appropriate. Streams are quite useful for storing simple data structures,
    and a stream may contain the data of one or more objects.


    There are two base classes, which implement the concept of the stream-functionality:
    RReadStream and RWriteStream. These classes provide a set of methods to read and
    write operations for built-in integer and real types as well as for descriptors.
    They also have operators >> and <<, respectively, for internalizing and externalizing
    data. Please note that after creating the stream, you should call the stream''s
    PushL() method rather than CleanupStack::PushL(), if you need to push it to the
    cleanup stack in order to leave-safe.


    Symbian OS has several implementations of these stream base classes – each of
    them works with specific media; for instance, files, descriptors or memory buffers.
    They always exist in pairs: one for reading and one for writing. The following
    list gives you an idea of some of the available stream classes:


    +   * RFileReadStream

    * RWriteStream

    * RDesReadStream'
