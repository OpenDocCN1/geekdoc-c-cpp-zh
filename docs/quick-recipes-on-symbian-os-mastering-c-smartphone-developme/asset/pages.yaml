  md: '# MESSAGING 175


    the child entries of a known parent – for instance, listing all the messages in
    the inbox. By repeating that procedure, all entries can be obtained from the root
    entry of the tree.


    The next level of the tree consists of service entries. The TMvid values for a
    number of common services are defined in msvids.h.

    Below each service entry starts, it creates the standard folders stored in the
    file msgs.rsc under the local service. These will generally be:


    +   - A global inbox – most SMS and MMS messages are stored here when they are
    received by the device. Class 2 SMS messages are the common exception; they are
    usually stored on the SIM.

    - A global outbox – messages are stored here temporarily before being sent, or
    if sending fails.

    - A draft folder – unfinished messages are stored here until they are ready to
    be sent.

    - A sent folder – messages are stored here after they have successfully sent.

    - A deleted folder – messages are stored here once they have been deleted. This
    folder is invisible to the user.


    The TMvid values for the above folders are also defined in msvids.h.

    Following this, the message store may be customized further – for example, some
    phone manufacturers use a template folder which stores a set of pre-composed messages.
    The user may also define its own local folders. Remember, it is possible to get
    a list of all the available services by requesting the children of the root entry,
    and the available folders under a service by requesting the children of that service.


    Remote service entries may not use child folder entries


    Under each folder (or service entry) are the entries for the messages stored in
    that folder. These contain the message metadata as well as body text and any data
    specific to the message type. If the message type supports attachments, the message
    entries may have child attachment entries to hold files such as multimedia clips
    or pictures.'
