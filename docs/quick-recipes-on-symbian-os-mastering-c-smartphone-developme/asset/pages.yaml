  md: "RSocket::Accept() takes what is known as a 'blank' socket as a parameter. The\
    \ blank socket is an RSocket instance that is opened without specifying any protocol\
    \ attributes. Accept() completes without any error, the blank socket becomes a\
    \ full-fledged TCP socket, connected to the remote peer that requested the connection\
    \ and ready to exchange data. If multiple incoming socket requests are queued\
    \ in the listening socket's listen queue, the application can call Accept() multiple\
    \ times, passing a new 'blank' socket each time to establish connection with the\
