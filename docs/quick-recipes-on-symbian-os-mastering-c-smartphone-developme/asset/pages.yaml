  md: '# 332 RELEASING YOUR APPLICATION


    on the Symbian Developer Network at developer.symbian.com/coding_standards_wiki.


    Having discovered the fundamentals of good Symbian C++, you will want to test
    that your code meets your quality expectations as you write it and as you prepare
    to deploy it. Testing can be performed at all stages of development, and you and
    your team will have your preferences and procedures. These could include writing
    a test case for every bug you fix to build up a regression test suite, developing
    a test framework for automated unit testing on your nightly builds, and designing
    out-of-memory loop tests, out-of-disk-space tests, and those that deliberately
    try to break the code by submitting illegal or invalid inputs to APIs or by rapidly
    firing key presses on the UI. The more confident you can be that it will be that
    you finds a problem – which is preferable to being found by your ultimate user,
