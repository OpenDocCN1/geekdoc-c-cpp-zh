    # 4.3.1 Getting Started


    The three most important APIs for developing IP-enabled applications are RConnection,
    RSocket and RHostResolver – all of which are declared in es_sock.h. The RConnection
    API is used for connection selection/startup and management. The RSocket and RHostResolver
    implement BSD-style socket and host resolver APIs respectively, found on other
    operating systems.


    IP-enabled applications require NetworkServices capability to be present, it is
    required for initiating a network connection and sending and receiving data over
    protocols such as TCP and UDP.


    On a mobile device, where multiple bearers are available and can be active at
    the same time – for example, GPRS and WLAN – it is important to have a mechanism
    that allows applications to choose which bearer IP data is sent and received;
    not only because of potential cost issues involved (WLAN might be cheaper than
    GPRS), but also for potential issues. The RConnection API facilitates an explicit
    way to start a particular network connection on a bearer to remove'
