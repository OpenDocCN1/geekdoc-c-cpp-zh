    # 3.5.1 Why Does PushL() Leave?


    In the examples above, you may have noticed PushL() is a leaving function, which
    at first appears to be self-defeating. If the cleanup stack is supposed to make
    pointers leave-safe, how can it cause a leave when you call it and yet still be
    helpful?

    nThe reason PushL() may leave is that it may need to allocate memory to store
    the pointers passed to it (and in low-memory conditions this could fail). However,
    the object passed to PushL() will not be orphaned if it leaves. This is because,
    the cleanup stack is created, it has at least one slot free. When PushL() is called,
    the pointer is added to a vacant slot, and, if there are no remaining slots available,
    the cleanup stack attempts to allocate some for future calls to PushL(). It is
    if attempted allocation fails, a leave occurs. The pointer passed in stored safely
    before any leave could occur, so the object it refers is safe, and is cleaned
    as usual.


