    # 4.7 Multimedia


    These recipes discuss aspects of working with multimedia files, such as playing
    and recording audio or video.


    Symbian OS provides a framework called MMF (Multimedia Frame-work) which supports
    the following:


    +   * audio playing, recording and conversion

    * audio streaming

    * tone playing

    * video playing and recording.


    The MMF is an extensible framework that allows phone manufacturers and third parties
    to add plug-ins to provide support for audio and video formats. For the application
    developer, it provides APIs that abstract the underlying hardware, thereby simplifying
    the code needed to record and play the content. The streaming APIs provided by
    the framework, which bypass layers of the MMF, offer a lower-level interface that
    allows streaming of audio data to and from the audio hardware.'
