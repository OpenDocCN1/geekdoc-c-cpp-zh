    ''c:\data\u00''. The MemoryCardPath() method returns the root path on the memory
    card, for example ''e:\''. Note that there is a backslash character at the end
    of the returned path.

    The other methods return the path of multimedia files. For example, VideosPath()
    returns ''Videos\''. Again, there is a backslash character at the end of the returned
    path.

