    \ aFS,\n    const T32 aFileName, Int32 aValue)\n{\n    // Open the file stream.\n\
    \    RFileWriteStream writeStream;\n    TInt err = KErrNo;\n    if (BafUtils::FileExists(iCoEnv->FsSession(),\
