  md: '# R Classes


    idiom called two-phase construction, which also prevents accidental creation of
    objects of a C class on the stack.


    C classes will be discussed more when we deal with two-phase construction and
    the cleanup stack.


    R classes own an external resource handle, for example a handle to a server session.
    R classes are diverse, and vary from holding a file server session handle (e.g.,
    class RFs) to memory allocated on the heap (e.g., class RBuf). R classes are small,
    and usually contain no other member data besides the resource handle. R-class
    objects may exist as class members, as local stack-based variables or, occasionally,
    on the heap.


    Initializing R usually requires calling a special method, such as Open(), Create()
    or Connect(). Similarly, destroying R classes usually involves calling a special
    cleanup method, which is usually named Close() although it sometimes be named
    something else, such as Reset(). It is rare for R class to have a destructor –
    it generally does not need one because cleanup is performed in the cleanup method.


    Although you will probably use a number of Symbian R classes, there are only a
    few cases where you may need to write your own R class, for example when you are
    creating a client-server application.


    # M Classes


    On Symbian OS, M classes are often used in callback or observer classes. An M
    class is an abstract interface class which declares pure functions and has no
    member data. A concrete class deriving from such class typically inherits from
    CBase (or a CBase-derived class) as its first base class and from one or more
    M-class ''mixin'' interfaces, and implements the interface functions.


    An M class should usually have only pure virtual functions, but may occasionally
    have non-pure virtual functions.


    > Tip: The only form of multiple inheritance encouraged on Symbian C++ is that
    one uses CBase-derived class and mixes in one or more M classes. The correct class-derivation
    order is always to put the CBase-derived class first, to emphasize the primary
    inheritance tree and ensure proper cleanup through the cleanup stack.'
  merge: -1
