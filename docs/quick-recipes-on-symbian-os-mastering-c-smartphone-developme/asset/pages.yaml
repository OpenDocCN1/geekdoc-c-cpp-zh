  md: '# Foreword


    David Wood, Executive Vice President Research, Symbian


    This book has been designed for people who are in a hurry.

    Perhaps you are a developer who has been asked to port some software, initially
    written for another operating system (such as may run on a desktop computer),
    to Symbian OS. Or perhaps you have to investigate whether Symbian OS could be
    suited to an idea from a designer friend of yours. But the trouble is, you don''t
    have much time, and you have heard that Symbian OS is a sophisticated and rich
    software system with not insignificant learning curve.

    If you are like the majority of software engineers, you would like to take some
    time to investigate this kind of task. You might prefer to attend a training course,
    or work your way through some of the comprehensive reference material that already
    exists for Symbian OS. However, I guess that you don''t have the luxury of doing
    that – because you are facing tight schedule pressures. There isn''t sufficient
    slack in your schedule to research options as widely as you''d like. Your manager
    is expecting your report by the end of the week. So you need answers in a hurry.

    That''s why Symbian Press commissioned the book you are now holding in your hands.
    We are assuming that you are a bright, savvy, experienced software developer,
    who is already familiar with C++ and with modern programming methods and idioms.
    You are willing to work hard and can learn fast. You are ready to take things
    on trust for a while, provided you can quickly find out how to perform various
    tasks within Symbian OS to learn more about the background and deeper principles
    behind Symbian OS, but that will have to wait – since at the moment, you''re looking
    for quick recipes.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# FOREWORD


    Congratulations, you have found them!

    In the pages ahead, you will find recipes covering topics such as Bluetooth, networking,
    location-based services, multimedia, telephony, file handling, personal information
    management – and much more. In most recipes we provide working code fragments
    that you should be able to copy and paste directly into your own programs, and
    we provide a full set of sample code for download from the book''s website (developer.symbian.com/quickrecipes).
    We have also listed some common gotchas, so you can steer clear of these potential
    pitfalls.

    Since you are in a hurry, I will stop writing now (even though there is lots more
    I would like to discuss with you), so that you can proceed at full pace into the
    material in the following pages. Good speed!


    David Wood, Symbian, March 2008'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# About this Book


    This book sets out to accomplish two goals:


    +   - For readers who don’t know Symbian OS C++ development, this book is a two-week
    crash-course in developing applications for mobile phones.

    - For readers who know Symbian OS++ development, this book explains how to use
    10 different technologies in a condensed form. It can be used as a desk reference
    or to learn a new technology in a familiar environment.


    The focus of the book is on the reader being able to manage the time it takes
    to understand and implement the new concepts in Symbian OS.

    **Chapter 1** will explain how to set up a development environment. It also contains
    useful information for you to read while you wait for your software development
    kit to download and install.

    **Chapter 2** is about your first HelloWorld application and basic use of the
    new toolchain.

    **Chapter 3** explains the essentials of the common Symbian C++ APIs and idioms.
    Without understanding these, you cannot make much progress.

    **Chapter 4** is the main course of this book. It consists of recipes for ten
    self-contained technologies, each explained as a time-bound learning task. For
    each technology, the recipes are listed in order of increasing complexity.

    **Chapter 5** will help you reach the next level of Symbian OS development expertise.

    **Chapter 6** is dedicated to commercial-grade application development.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# ABOUT THIS BOOK


    The book is by no means an introduction to software development in general or
    even to the C++ language. The authors expect the readers to be familiar with both.


    We have included some links to help you find additional infor-mation, but to avoid
    repetition, we don''t always refer you to the Symbian Developer Library API reference
    documentation whenever we introduce a new API. It''s worth mentioning it here
    though. You''ll find a huge amount of reference material in the Symbian Developer
    Library, which is available in every SDK, and can also be browsed online on the
    Symbian Developer Network (developer.symbian.com/main/oslibrary/osdocs). Chapter
    6, Section 6.3 contains other links and suggestions for how to get more information.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# About the Authors


    # Michael Aubert


    Michael has worked on Symbian OS for 7 years, in the Java team at Symbian itself
    and the R&D team at iAnywhere. During that time, he has received in-depth exposure
    to a wide range of technologies including telephony, messaging, 3D graphics, networking,
    multimedia, PIM, cryptography, platform security and software deployment.


    He holds an MSc in Software Engineering from E.S.I.A.L. and is probably the only
    person to have ever explained the crazy Java Team Server Framework to a French
    audience.


    # Alexey Gusev


    Alexey started to play with mainframes in the early of the 1980s, using Pascal
    and REXX, but soon switched to C/C++ and Java on different platforms before moving
    into mobile technologies. After working for almost a decade as a team leader and
    architect on Windows Mobile, he decided to join the Symbian Core Development team,
    originally working on Security and later on USB.


    He holds an MSc in Applied Mathematics and Physics from the Moscow Institute of
    Physics and Technology. He is also an Accredited Symbian Developer and regular
    author at www.developer.com.


    # Tanzim Husain


    Tanzim joined Symbian in 2004 as a member of the networking technology team and
    has worked there ever since, surviving two architectural'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# ABOUT THE AUTHORS


    changes and three team re-organizations. Before joining Symbian, he worked extensively
    on Windows Mobile, delivering pioneering applications in the area of mapping and
    GIS.

    Tanzim holds a B.S. in Computer Science from NSU. Outside work, he likes to fiddle
    around with photography and enjoys escaping to the countryside. He tries to maintain
    an infrequently updated website/blog at www.tanzim.co.uk.


    # Jenny Mulholland


    Since graduating with an MSc in Physics from the University of Cambridge in 2006,
    Jenny has worked in Symbian''s Licenseee Product Development team, as a member
    of the Comms Porting Group. Jenny recently renewed her Accredited Symbian Developer
    status.

    Outside of work, when she is not in the pub with her colleagues, enjoys performing
    concerts with the Chandos Chamber Choir and recently taken up the flute.


    Antony Pranata holds an MSc in Information Technology from the University of Stuttgart,
    Germany. He has been involved in a number of Symbian OS projects in different
    technology areas, including security, tools, multimedia and location-based services.
    He currently works for Nokia in Canada.

    Antony is a Forum Nokia Champion, Accredited Symbian Developer and Accredited
    S60 Developer. He has a personal website and blog at www.antonypranata.com. He
    now lives in Vancouver with his wife, Emi.


    # Juka Silvennoinen


    Juka holds a PhD in Computer Information Systems. Before joining Forum Nokia recently,
    he spent several years developing many Symbian OS applications, mainly for the
    Asian markets. As a certified Nokia Trainer he was also a visiting lecturer in
    one of the best universities in Thailand.

    Juka can often be found haunting the Forum Nokia developer discussion boards and
    wiki. He recently renewed his Accredited Symbian Developer and Accredited S60
    Developer status.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Jo Stichbury


    Jo is Senior Technical Editor with Symbian Press. She has worked within the Symbian
    ecosystem since 1997; in the Base, Connectivity and Security teams of Symbian,
    as well as for Advansys, Sony Ericsson and Nokia.


    Jo is the author of Symbian OS Explained: Effective C++ Programming for Smartphones,
    published by Symbian Press in 2004; she also co-authored The Accredited Symbian
    Developer Primer: Fundamentals of Symbian OS with Mark Jacobs, in 2006. Her most
    recent publication is Games on Symbian OS: A Handbook for Mobile Development,
    published in early 2008.


    Jo became an Accredited Symbian Developer in 2005 and a Forum Nokia Champion in
    2006 and 2007.'
  merge: -1
