    # 3.15.2 Class CActive


    An object class must derive directly or indirectly from class CActive, defined
    in e32base.h. CActive is an abstract class with two virtual functions, RunL()
    and DoCancel().


    # Construction


    On construction, classes deriving from CActive must call the priority of constructor
    of the base class, passing in a parameter to set the priority of the active object.
    Like threads, all active objects have a priority value to determine how they are
    scheduled. As the previous subsection described, once an active object is handling
    an event, it cannot be preempted until the event-handler function has returned
    back to the active scheduler. During this time, a number of completion events
    may occur. When the active scheduler next gets to run, it must resolve which active
    object gets to run next. It would not be desirable for a low-priority active object
    to handle its event if a higher-priority active object was also waiting, so events
    are handled sequentially in order of the highest priority than in order of completion.


    In its constructor, the active object should also add itself to the active scheduler
    by calling CActiveScheduler::Add().


