  md: "# LEAVES AND EXCEPTION HANDLING\n\n```\nelse {\n    // If an error happened,\
    \ handle it here.\n}\n```\n\nAlternatively, using TRAPD, the code is expressed\
    \ as follows:\n\n```\nTRAPD(leaveCode, LeavingMethodL());\nif (KErrNone == leaveCode)\
    \ {\n    // If no error, do something.\n}\nelse {\n    // If an error happened,\
    \ handle it here.\n}\n```\n\nYou can find the list of Symbian OS-wide error codes\
    \ – which, apart from KErrNone (which is 0), negative numbers – in \\epoch32\\\
    include\\e32err.h and in the Symbian Developer Library of each SDK.\n\nTRAP macros\
    \ can also be nested to handle errors at different levels of code, where they\
    \ can be dealt with. However, each TRAP has an impact on executable size and execution\
    \ speed, and the number of TRAPS should be minimized where possible.\n\n# 3.3.3\
    \ What Causes a Leave?\n\nIf you are writing a function which must not leave,\
    \ the TRAP macro must be used to prevent a potential leave from propagating. For\
    \ example:\n\n```\nInt NonLeavingMethod() {\n    TRAP(err, LeavingMethodL());\n\
    \    // Handle the error\n}\n```\n\nSince NonLeavingMethod() cannot leave, it\
