  md: '# 1.2.3 Concepts of Mobile Development


    On an open operating system such as Symbian OS, third-party developers like you
    can install their own applications.


    Programming for smartphones puts you in a position where you have quite limited
    resources, such as CPU capabilities, battery power, input methods, available memory
    amount and so on. Software developers targeting a challenging environment need
    to focus on code efficiency and robustness more than they may be used to for desktop
    platforms.


    We are working in an environment where any heap memory allocation can fail and
    where the cost of forcing the CPU to switch between processes (or even threads)
    is non-negligible.


    Symbian OS development efforts are worth being aware of:


    +   * Open Source projects at www.symbianos.org.

    * P.I.P.S. and Open C are there to help you port applications using the Posix
    libraries for Symbian OS (see www.forum.nokia.com/openc).

    * The Standard Template Library is being ported to Symbian OS.

    * The Net60 framework from Red Five Labs allows you to use Microsoft .NET Compact
    Framework (see www.redlivelabs.com).

    * There are runtime environments for Java, Ruby and Python available for Symbian
    OS (see developer.symbian.com/main/getstarted/hub/runtimes_hub.jsp).


    # 1.2.4 ARM Hardware


    When adapting the actual handset, Symbian OS are based on the Application Binary
    Interface (ABI) for the ARM Architecture. ABI is a standard for the interfaces
    of binary code running in ARM environments. The specification is published by
    ARM at: www.arm.com/products/DevTools/ABI.html.


    We will not go into the details of various ARM instruction sets and ABI versions
    in this book.


    # 1.2.5 Emulator


    In addition to debugging a stack trace, breakpoints and variable monitoring, the
    emulator allows you to test your deployment packages to ensure your application
    will be installed properly on the real smartphone.


    The S60 emulator preferences allow you to set several useful parameters, like
    Bluetooth and IrDA (Infrared) ports and platform security'
