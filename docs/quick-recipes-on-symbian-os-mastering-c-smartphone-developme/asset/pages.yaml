    # RBuf


    Class RBuf is derived from TDes, an RBuf object can be modified without the need
    to create a TPtr around the data first, which often makes it preferable to HBufC.
    On instantiation, an RBuf object can allocate its own buffer or take ownership
    of pre-allocated memory or a pre-existing heap descriptor. To comply with the
    Symbian OS class-name conventions discussed at the beginning of this chapter,
    the RBuf class is not named HBuf because, unlike HBufC, it is not directly created
    on the heap. RBuf descriptors are typically created on the stack, and hold a pointer
    to a resource on the heap for which it is responsible at cleanup time.


    Internally, RBuf behaves in one of two ways:


    +   - Like a TPtr, which points directly to the descriptor stored in memory, which
    the RBuf object allocates or takes ownership of.

    - As a pointer to an existing heap descriptor, HBufC*. The RBuf object takes ownership
    of the HBufC, and holds a pointer to memory that contains a complete descriptor
    object (compared to a pointer to a simple block of data in the former case).


    However, this is transparent, and there is no need to know how a specific RBuf
    object is represented internally. Using this descriptor class is straightforward
    too, through the methods inherited from TDes and TDesc, just as for the other
    descriptor classes.


    RBuf is a relatively recent addition to Symbian OS, first documented in Symbian
    OS v8.1 and used extensively in software designed for phones based on Symbian
    OS v9 and A lot of original example code won''t use it, for it is a simpler class
    to use HBufC if you need a dynamically allocated buffer to hold data that changes
    frequently. The next subsection will examine how to instantiate and use RBuf in
    more detail.


    HBufC is still ideal when a dynamically allocated descriptor is needed to hold
    data that doesn''t change; that is, if no modifiable access to the data is required.


