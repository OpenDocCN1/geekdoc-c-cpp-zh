  md: 'all ambiguity.^1 Once the network connection has been initiated, the socket
    and host resolver API can use that particular connection to send and receive data.
    Besides selection and tearing down of a network connection, RConnection can be
    used to gather information about the active network connection such as status,
    how much data was sent and received at link layer, and so on.


    An Internet Access Point (IAP) is a collection of settings that enables selection
    of a particular network connection on a particular bearer, which is specified
    as a selection parameter when starting a connection using the RConnection API.


    The CommsDat API enables retrieval of configuration information from the settings
    database, known as the CommsDat database. Examples of configuration information
    stored in CommsDat include the list of available IAPs, default connection preferences
    and settings specific to an IAP, which could be the phone number in case of a
    dial-up ISP, the access point name (APN) in case of a GPRS network or the SSID
    of a WLAN access point in case the IAP is configured to use WLAN as a bearer.


    In cases, barring sensitive data like passwords, reading information from CommsDat
    does not require any platform security capability.


    The common pattern for any IP-enabled application connecting to an IP network
    and using its services would normally be:


    +   **Configure** – select the correct IAP; programmatically, by asking the user
    or letting the system choose one.

    **Connect** – start connection using selected connection parameters.

    **Use** – send and receive data using sockets and finally.

    **Disconnect** – close socket connection and indicate that the application has
    finished using the connection by closing it.


    We will use the above pattern throughout example code.


