    # 4.9 Connectivity


    The connectivity features of modern smartphones have grown extensively over the
    past years, and you may choose between technologies such as Bluetooth, Infrared
    and USB for short-range communications. Symbian OS v.x offers powerful support
    for each of the above connectivity bearers and provides rich APIs to fulfill any
    complicated task you may want to implement. Support can be split into two main
    categories:


    +   - Low-level technologies (e.g., Infrared or Bluetooth) and frameworks (e.g.,
    ESOCK).


    +   - High-level technologies, such as OBEX.


    Some of the connectivity methods, for instance, those using USB connections, are
    generally reserved for use by Symbian''s licensees and therefore unavailable to
    third-party developers. As a result, these recipes illustrate how to use Infrared
    and Bluetooth connections to address various issue you might need to resolve at
    both low and high-level protocol layers. As these recipes describe connectivity
    services, they do not discuss networking and other areas that are based on the
    low-level components described here. You can find more information about networking
    in the recipes found in Section 4.3.'
