    else\n{\n    err = writeStream.Create(aFS, aFileName, EWrite);\n}\nUser::LeaveIfError(err);\n\
    writeStream.Pushl();\n\n    // Move the file pointer to the end of the file.\n\
    \    writeStream.Sink()->SeekL(MStreamBuf::EWrite, EStreamEnd, 0);\n\n    // Write\
