  md: '# HOW TO DISTRIBUTE YOUR APPLICATION


    # 6.2 How To Distribute Your Application


    Recent data shows smartphone buyers show particular enthusiasm for purchasing
    and installing software for their phones. Part of the reason for buying a smartphone,
    after all, is that powerful aftermarket software can be installed onto it. To
    meet this demand, over 8,000 third-party installable applications are commercially
    available for Symbian smartphones at the time of writing. Furthermore, according
    to data from mmetrics, Symbian smartphone users perform at least 20% more tasks
    that raise the average revenue per user (ARPU) for network operators than other
    3G users. For example, data from October 2007 suggests that in the UK, over 35%
    of Symbian smartphone users spend more than £35 ($57) per month on 3G network
    services (such as sending photos, videos, accessing maps and news). Feature phone
    owners spend less; only 20% spend that amount or more. This section covers how
    to get your application to potential consumers. Having discussed the topics in
    the previous section, you''re sure you have a great product, but how best to deliver
    it? Who can help you market it?


    # 6.2.1 Network Operators


    Network operators, or carriers as they are sometimes known, make the largest number
    of sales of mobile applications because most purchases are from users who buy
    content directly from their portals. The operators can be subdivided into: international
    carriers, such as Vodafone, T-Mobile and Orange; national network operators, such
    as Cingular and Verizon in the USA and DoCoMo in Japan; and smaller carriers,
    such as mobile virtual network operators (MVNOs). To work with a network operator,
    you must build a good relationship in order to get selected for a sales slot on
    their portal. Many of the large operators have many developers to work with, but
    they do not engage with new contacts, only use their established relationships
    to provide content. However, there are developer programs which are worth investigating.
    Some examples include 3neXT from Hutchinson (next.three.com/developer/aspx), Orange
    Partner (www.orangepartner.com) or AT&T devCentral (developer.att). Network operators
    look for applications that meet their own propositions, one key goal is to promote
    data consumption. If your


    > 1 www.symbian.com/about/fastfacts/fastfacts.html.

    2 www.mmetrics.com.

    3 MVNOs are companies that build on top of the traditional network operators,
    because they do not have their own allocation of the radio frequency spectrum
    nor the infrastructure required to provide a mobile telephone service.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'application requires the user to download even small amounts of data on a regular
    basis, the network operators will find it far more interesting than one that never
    requires the user to make a data connection. (You can find out more about the
    other ''hot'' areas that operators are kept to promote by listening for key messages
    whenever the operators speak at developer events or when they press releases or
    other material to help analysts ''sync up''). In turn, network operators research
    the market and, if your applications are receiving good feedback from users, the
    operators have access to download statistics and that you have a popular product,
    you may be invited into a tendering process in order to be selected to supply
    applications to them.



    It is worth noting that network operators have individual processes for testing
    and certifying new applications before they allow them to be published for. The
    certification process can take a significant amount of time and, once an application
    is complete, it can take up to six months of negotiation over the results before
    the application is released onto a portal.


    # 6.2.2 Independent Software Channels


    Some mobile application channels are not owned by network operators but are independent.
    These channels inevitably have less traffic than the operator channels, but application
    developers still find they offer potential for application distribution.


    There are a number of channels that provide mobile applications; some do so as
    part of their offering, while others specialize in them. Examples include Handoff,
    Moticity and MobiHand. The channels offer a well or WAP site for buyers to browse
    using their mobile phone, allowing the purchase of applications by direct download
    over the air (OTA), with payment made by means of sending a premium-rate SMS.


    Some purchases, such as those from Handoff, can also be made over the Internet
    (OTI). The user visits the website on his PC, buys and downloads an application
    to it, and then transfers it to his phone, for example, using Bluetooth wireless
    technology. OTI offering the benefit of allowing the user to use applications
    using a familiar medium of the PC, and find information about them, such as screenshots
    and reviews. The user can also download larger applications more quickly without
    needing the phone to be set up with a data connection, which is an advantage,
    particularly in regions where it is expensive, or slow, to download large amounts
    of data to a phone. OTI download also avoids being charged twice— once to purchase
    the application (by the channel)


    > 4 In 2006, more than 250 new content providers and 3,500 new content titles
    were available on Handoff for Symbian smartphones. Handoff is a key channel for
    the distribution of aftermarket software for smartphones (based on Symbian OS,
    BlackBerry, Palm OS and Windows Mobile) and regularly releases sales trend data,
    which it calls ''Yardstick Data'', at www.corp.handoff.com.'
  merge: -1
