  md: "# LOCATION-BASED SERVICES 311\n\ncurrent location. Assistance data is used\
    \ by an-GPS positioning module to reduce the time necessary to obtain a position\
    \ fix. The network can also supply a reference position to the LBS subsystem as\
    \ part of the sequence of events. This position is calculated in the network using\
    \ cell-based techniques and may be less accurate than obtained from GPS. A reference\
    \ position may be returned to the client before a Location Acquisition API runtime\
    \ behavior for more information about the position update that can be returned\
    \ by LBS.\n\n+   * Terminal-Assisted Positioning\n  LBS uses an-GPS positioning\
    \ module to obtain GPS measurements (using assistance data from the network).\
    \ GPS measurements are the raw data used to calculate a GPS fix. Measurements\
    \ are sent to the network and a position fix is calculated by a remote server.\
    \ The remotely calculated position fix is returned to the mobile device and is\
    \ known as the final network position. The LBS subsystem returns this position\
    \ to the client.\n\n+   * Hybrid Positioning\n  This mode is a combination of\
    \ Terminal-Assisted Positioning and Terminal-Assisted Positioning.\n  LBS passes\
    \ GPS measurements to the network (as in Terminal-Assisted Mode), but also attempts\
    \ to use those measurements to calculate a GPS fix (as in Terminal-Based Mode).\
    \ The position returned to the client may be either a GPS position (calculated\
    \ in the mobile device) or a final network position (calculated using the measurements\
    \ by a remote server in the network). The position that is calculated first (the\
    \ GPS position or the final network position) is generally returned to the client.\
    \ The final network position may also be returned to the client after the return\
    \ of the GPS position.\n\n+   * Cell-Based Positioning\n  LBS obtains a position\
