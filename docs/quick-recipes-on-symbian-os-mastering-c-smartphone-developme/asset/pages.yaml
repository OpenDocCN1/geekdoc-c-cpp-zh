  md: '# SYMBIAN OS CLASS CONVENTIONS


    no pointers, references or handles to data, unless data is owned by

    another object responsible for its cleanup.

    T-class objects are usually stacked-based and can also be created

    on the heap, some T classes should only ever be heap-based

    because the resulting object would otherwise occupy too much space

    A good rule of thumb is that any object larger than 512 bytes

    should be heap-based rather than created on the stack, since stack

    space is limited for applications running on Symbian OS. One way to

    prevent the object from being instantiated on the stack is to rename the

    class, and make it a C class, since C-class objects are always created on

    the heap, as the next subsection describes.


    > Tip: T classes can be created on the heap as well as the stack.


    # 3.2.2 C Classes


    C-class objects must always be created on the heap. Unlike T classes, C

    classes may contain and own pointers.

    For Symbian OS memory management to work, every C class

    must ultimately derive from class CBase (defined in the Symbian OS\header file
    e32base.h). This class has three characteristics, which are

    inherited by every C class:


    +   - Safe destruction. CBase has a virtual destructor, so a CBase-derived

    object is destroyed properly by deletion through a base-class pointer.

    - Zero initialization. CBase overloads operator new to re-initialize

    an object when it is first allocated on the heap. This means that all\member data
    in a CBase-derived object will be zero-filled when it

    is first created, so this does not need to be done explicitly in the

    constructor.

    - CBase also declares a private constructor and assignment

    operator. Their declaration prevents calling code from accidentally

    performing invalid copy operations on C classes.


    On instantiation, the member data contained within a C class typically

    needs to perform operations that may fail. A good example is instantiation

    of an object that performs a memory allocation, which fails if there is

    ufficient memory available. This kind of failure is called a leave on

    Symbian OS, and is discussed in more detail shortly. A constructor should

    never be able to leave, because this can cause memory leaks, as we will

    discuss in Section 3.6 on two-phase construction. To avoid the potential

    of memory leaks upon construction, C classes are characterized by an'
