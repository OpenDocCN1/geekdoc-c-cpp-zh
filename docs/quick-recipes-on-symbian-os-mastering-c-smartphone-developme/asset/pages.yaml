    # 4.3.6.6 Set Advanced HTTP Properties


    Amount of time required: 20 minutes

    Location of example code: \HTTP\HTTPConnectionConfiguration

    Required header(s): http.h

    Required library(s): http.lib, bafl.lib, inteprotutil.lib

    Required platform security capability(s): None


    **Problem:** You need to override the default system settings for a network connection.


    **Solution:** Set some used connection parameters, including proxy information
    and network connection.


    ```

    void CProxy::SetConnectionInfo(RSocketServ& ss, RConnection& conn

    {

    RString strPool = ISession::StringPool();

    RHTTPConnectionInfo connInfo = ISession::ConnectionInfo();


    connInfo.SetProperty(strPool, StringF("HTTP:Connection\nRRHTPSession::GetHandle()),
    HTTPHdrVal(ss.Handle()));


    connInfo.SetProperty(strPool, StringF("HTTP:Connection\nRRHTPSession::GetHandle()),

    HTTPHdrVal(reinterpret_cast<TInt*>(&conn)));


    }

    ```


    **Discussion:** The HTTP framework uses the default fairly for establishing the
    network connection, which is similar to using RConnection::Start() with no preferences
    set. This recipe allows you to override this behavior.

    Note that when using an external connection, the framework assumes it has already
    been started. The framework also does not take ownership of the specified connection;
    here it is up to the application developer to ensure the lifetime of the connection
    is longer than the HTTP session.

    Apart from that, the RConnection object must have been opened as a sub-session
    of the RSocketServ object specified.

    The downside of using a user-specified connection is that the HTTP framework won''t
    automatically restart the connection once it has gone down (signs for this are
    transaction fails with KErrNotReady). It is recommended that the application monitors
    the status of the connection (see Recipe 4.3.6.2) to handle any failed transaction.'
