  md: '# MMF Client API


    | Audio Interface | Video Interface | Tone Player Interface | Audio Streaming
    Interface |

    | --- | --- | --- | --- |

    | Record, play & convert | Record & play | Tones and DTMF | Streaming audio in
    & out |


    ![](img/c73f4eb815fa3d047325b097ae8a7c1d_266_0.png)


    Figure 4.7.1 Architecture of MMF


    Figure 4.7.1 shows the architecture of MMF.

    The default Symbian OS MMF implementation supports basic audio formats. For example,
    for audio playback, it supports AU and WAV files and provides codecs for pulse
    code modulation (PCM). Furthermore, in addition to basic formats, most Symbian
    phones provide support for playback of other popular formats. For audio, this
    includes MP3, advanced audio coding (AAC), and adaptive multiple-rate (AMR). Phone
    manufacturers supply additional plug-ins only to selected devices because of dependencies
    on specific accelerated hardware components, licensing issues, DRM requirements,
    or other business factors.


    In this set of recipes, we will also discuss the Onboard Camera API, which is
    a generic and extensible API for controlling an onboard digital camera on devices.
    It supports either still images or videos. Please refer to the recipes in Section
    4.5 for a discussion on image processing and general 2D graphics.


    As a client of the Symbian OS multimedia APIs, you''ll find a lot of the code
    you will write implementation of the observer interfaces that are passed to the
    API and called by the MMF to signal an event or change of state. There is quite
    a lot to discuss in these recipes and, for clarity, we are going to keep the minimum
    of source code possible. You can find the full set of example code available for
    download at developer.symbian.com/symbian_press_cookbook.'
