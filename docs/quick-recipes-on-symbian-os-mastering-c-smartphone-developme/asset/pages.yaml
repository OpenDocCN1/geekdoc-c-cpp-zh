    Required platform security capability(s): None


    Problem: You want to play an audio clip from a file, such as a WAV, MP3 or AAC
    file.


    Solution: The client API to play an audio clip from a file is the CMda-AudioPlayerUtility
    class. CMdaAudioPlayerUtility requires an observer class, which implements MMdaAudioPlayerCallback.
    The observer will be notified when the audio clip has been initialized or played
    completely.


    The following steps explain how to play an audio clip using CMda-AudioPlayerUtility:


    +   Create an observer class, which implements MMdaAudioPlayer-Callback.


    +   Create an instance of CMdaAudioPlayerUtility and pass it a reference to the
    observer class.


    +   Open the audio clip by calling CMdaAudioPlayerUtility::OpenFile().


    +   Wait until MMdaAudioPlayerCallback::MapcInitComplete() is called, with a result
    indicating that the file has been opened successfully, or that an error occurred.


    +   Call CMdaAudioPlayerUtility::Play() to start audio playback.


    +   When the audio has been played completely, or if an error occurs, MMdaAudioPlayerCallback::MapcPlayComplete()
    is called.


    +   Call CMdaAudioPlayerUtility::Close() to close the file. If you don''t close
    the audio file, there will be a memory leak.'
