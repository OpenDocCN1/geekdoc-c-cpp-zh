    The EXIF format is a specification of an image file used by digital cameras that
    contains additional metadata, such as date and time information, aperture, shutter
    speed, ISO speed and many more. It is supported by JPEG and some other formats.
    It is not supported by JPEG 2000, PNG and GIF though.


