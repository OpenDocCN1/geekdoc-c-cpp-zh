  md: "# 3.8 Descriptors – Symbian OS Strings\n\nDescriptors are the string classes\
    \ used on Symbian OS. They are so called because they are self-describing strings.\
    \ That is, a descriptor holds the length of the string of data it represents as\
    \ well as type information to identify the underlying memory layout of the descriptor\
    \ data. Descriptors protect against buffer overruns and don't rely on NULL terminators\
    \ to determine the length of the string.\n\nDescriptors are used throughout the\
    \ operating system, from the very lowest levels upwards, and are designed to be\
    \ very efficient, using the minimum amount of memory to store data, while describing\
    \ fully in terms of its length and location. Descriptors are strings and can contain\
    \ text data. However, they can also be used to manipulate binary data, because\
    \ they don't rely on a NULL-terminating character to determine their length.\n\
    \nThere are probably as many strings as there are programming platforms, and everyone\
    \ has their favorite. Many developers find Symbian OS descriptors to get used\
    \ to first, because there are many different classes to become familiar with.\
    \ They can also be confusing because they aren't a direct analog to standard C++,\
    \ Java strings or the MFC CString (to just take three examples), since their memory\
    \ allocation and cleanup must be managed by the programmer. Before calling a modifiable\
    \ descriptor that may expand the descriptor, it is necessary to ensure that there\
    \ is sufficient memory available for it to succeed.\n\n# 3.8.1 Character Size\n\
    \nSymbian OS supports 8-bit and 16-bit character sizes. The character size of\
    \ a descriptor class can be identified from its name. If the class name ends in\
    \ 8 (for example, TP8) it has narrow (8-bit) characters, while a descriptor class\
    \ name ending with 16 (for example, TP16) manipulates 16-bit character strings.\n\
    \nThere is also a set of neutral classes which have no number in their name (for\
    \ example, TPtr). The neutral classes are 16 bit, and it is good practice to use\
    \ the neutral descriptor classes where the character width does not need to be\
    \ stated explicitly. However, to work with binary data, the 8-bit descriptor classes\
    \ should be used explicitly, and some Symbian OS APIs (e.g., those to read from\
    \ and write to a file) all take an 8-bit descriptor.\n\n```\ntemplate <class T>\n\
    inline TInt RArray::Insert(const T aEntry, TInt aPos)\n  return RArrayBase::Insert(aEntry,aPos);\n\
    ```"
