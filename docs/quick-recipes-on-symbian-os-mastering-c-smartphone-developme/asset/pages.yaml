    # 5.1.4 Advanced Messaging: A New Protocol


    Symbian OS defines the concept of Messaging Type Module (MTM). MTM plug-in is
    a set of binaries that extend the messaging features of a handset, with the help
    of the Messaging Store and the Messaging Server. MTM can be used for several purposes:
    bypassing the messaging application (and writing your own), synching your corporate
    messages with your handset, creating your own messaging protocol (i.e., to send
    messages to a social networking system), and so on.


    MTM is composed of a minimum of four libraries:


    +   * a client DLL

    * a client UI DLL

    * a client UI data DLL

    * a server DLL


    Each DLL has a specific UID that indicates which part of an MTM it is. In addition,
    you will need to allocate another UID for each DLL and an extra UID for the new
    MTM as a whole.


    The server DLL, as its name indicates, is only loaded by the messaging server.


    The three client-side DLLs should be available to all messaging-related applications,
    not just any applications you would write.


    The MTM server DLL that you will develop needs to be able to listen for incoming
    messages via the networking or telephony APIs. A new'
  merge: -1
