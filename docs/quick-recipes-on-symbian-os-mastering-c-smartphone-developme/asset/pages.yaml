  md: '# 3.8.2 TDesc


    All Symbian OS descriptor classes derive from the base class TDesc, apart from
    the literal descriptors which we will discuss later in Section 3.8.9. In naming
    this class, the T prefix indicates a simple type, while the C suffix reflects
    that the class defines a non-modifiable type of descriptor – that is, one whose
    contents are constant.


    TDesc provides methods for determining the length of the descriptor (Length())
    and accessing its data (Ptr). Using these methods, it also implements all the
    standard operations required on a constant object, such as data access, matching
    and searching. The derived classes all inherit these methods, and all constant
    descriptor manipulation is implemented by TDesc, regardless of the derived type
    of descriptor


    # 3.8.3 TDes


    The modifiable descriptor types all derive from the base class TDes, which is
    itself a subclass of TDesc. TDes stores the maximum length of data allowed for
    the current memory allocated to the descriptor. The MaxLength() method of TDes
    returns this value. The Length() method of TDesc is not overridden by derived
    classes. The contents of the descriptor can shrink and expand up to this value.


    TDes defines a range of methods to manipulate modifiable string data, including
    to append, fill and format the descriptor. All the manipulation code for descriptor
    modification is implemented by TDes and inherited by its derived classes. The
    descriptor API methods for both modifiable and non-modifiable descriptor base
    classes are fully documented in the Symbian Developer Library.


    # 3.8.4 The Derived Descriptor Classes


    The base classes TDesc and TDes implement all the generic descriptor manipulation
    code, but cannot be instantiated. Derived descriptors, which add their own construction
    and assignment code, are the classes that are actually used to manipulate strings
    on Symbian OS.


    The derived descriptors come in two base memory layouts: pointer descriptors,
    in which the descriptor points to data stored elsewhere; and buffer descriptors,
    where the data forms part of the descriptor.

    Figure 3.1 shows the inheritance hierarchy of the descriptor classes.


    # 3.8.5 Pointer Descriptors: TPtr and Ttr


    The string data of a pointer descriptor is separate from the descriptor object
    itself and is stored elsewhere, for example, in ROM, on the heap or on the stack.
    The memory that holds the data is not ‘owned by'
