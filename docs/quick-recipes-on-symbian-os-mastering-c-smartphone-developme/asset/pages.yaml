  md: '# 13.12 Symbian Security: Data Caging


    The Symbian OS file system is partitioned to protect system files (critical to
    the operation of the phone); application data (to prevent other applications from
    stealing copyrighted content or accidentally corrupting data) and data files personal
    to the user (which should remain confidential). partitioning is called data caging.
    It is not used on the entire file system; there are some public areas for which
    no capabilities are required. However, some directories in the file system can
    only be accessed by certain capabilities.


    Table 3.5 shows how data caging is related to capabilities.


    | Directory | None | AllFiles | TCB | AllFiles+TCB |

    | --- | --- | --- | --- | --- |

    | \resource | Read | ✓ | ✓ | ✓ |

    | | Write | x | ✓ | ✓ | ✓ |

    | \sys | Read | x | ✓ | x | ✓ |

    | | Write | x | x | x | ✓ |

    | \private\<ownSID> | Read | ✓ | ✓ | ✓ |

    | | Write | ✓ | ✓ | ✓ | ✓ |

    | \private\<otherSID> | Read | x | x | ✓ |

    | | Write | x | ✓ | ✓ | ✓ |

    | \anyOther> | Read | ✓ | ✓ | ✓ |

    | | Write | ✓ | ✓ | ✓ | ✓ |


    Each Symbian OS process has its own private folder, which can be created on internal
    memory or removable media. The folder name is based on the Secure Identifier (SID)
    of the process. A SID is required to identify each EXE on the phone and is used
    to create its private directory. The SID is similar to the UID3 identifier described
    in Section 3.10.3, and the default value of the SID is the UID3 value if a SID
    is not explicitly specified by use of the SECUREID keyword in the MMP file. It
    is usually recommended not to specify a SID, but simply allow it to default to
    the UID3 value assigned by Symbian Signed.


