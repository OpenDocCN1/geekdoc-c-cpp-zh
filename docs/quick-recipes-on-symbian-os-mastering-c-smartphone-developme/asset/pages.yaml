    There are two observer classes for CCamera: MCameraObserver and MCameraObserver2.
    MCameraObserver is the recommended API. Unfortunately, at the time of writing
    this book, S60 devices do not support MCameraObserver2 yet. In order to maintain
    compatibility with S60 devices, this book uses CCameraObserver in the examples.


    In our recipe, the viewfinder is handled by the CCameraEngine.


