    # 3.15 Active Objects


    Active objects are used for lightweight event-driven multitasking on Symbian OS,
    and they are fundamental for responsive and efficient event handling. They are
    used in preference to minimize the number of thread context switches that occur,
    and make efficient use of system resources. This section describes what active
    objects are, how to use them, and how to avoid the most common programming errors
    that can occur.


    Symbian OS uses event-driven code extensively for user interaction (which has
    a non-deterministic completion time) and in system code, for example for asynchronous
    communications. An event-driven system is important on a battery-powered device.
    The alternative to responding to events is for the submitter of an asynchronous
    event to keep polling to'
