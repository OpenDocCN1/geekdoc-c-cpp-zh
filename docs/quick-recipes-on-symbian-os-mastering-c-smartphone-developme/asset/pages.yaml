    # 6.3.2 Partnering with Symbian


    Symbian partners with those companies with a technology or a strategic position
    that is key to the success of Symbian OS phones in the market, with product or
    service offerings based around Symbian OS technology. Symbian partners benefit
    from early and exclusive access to the Symbian OS Development Kit (''DevKit''),
    which includes some of the source code that makes Symbian OS, as it is delivered
    to mobile phone manufacturers licensing OS (some of the most sensitive code has
    restricted distribution and is not available). The DevKit supplied includes test
    code, internal documentation, kernel and device driver programming interfaces
    and ROM building tools.


    Other benefits of partnership include:


    +   - Priority access to key market channels and pre-market showcases.


    +   - Access to Symbian 1:1 support, which provides hightnerth-quality technical
    services to Symbian''s partners.


    +   - A discount on Symbian OS training courses, which range from Symbian OS development
    to the advanced operating systems internals course. The courses are hands-on,
    covering the whole development cycle, and may be customized according to the partner''s
    requirements.


    More information about the Symbian Partner Network is available at www.symbian.com.'
