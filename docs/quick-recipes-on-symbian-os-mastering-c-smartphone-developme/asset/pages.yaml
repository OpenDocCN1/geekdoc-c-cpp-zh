  md: '# DESCRIPTORS - SYMBIAN OS STRINGS


    TBufC<n> is the non-modifiable buffer class, used to hold constant string or binary
    data. The class derives from TBufCBase (which derives from TDesc, and inherits
    as inheritance convenience). TBufC<n> is a template class which uses an integer
    value to fix the size of the data area for the buffer descriptor at compile time.

    TBuf<n> is used when a modifiable buffer is required. It derives from TBase, which
    itself derives from TDes, and inherits the full range of descriptor operations
    in TDes and TDesc. The class defines a number of constructors and assignment operators,
    similar to those offered by its non-modifiable counterpart, TBufC<n>. The buffer
    descriptors are useful for fixed-size strings, but should be used conservatively
    since they are stack-based except when used as members of a class whose objects
    are instantiated on the heap.


    # 3.8.7 Dynamic Descriptors: HBufC and RBuf


    The HBufC and RBuf descriptor classes are used for dynamic string data whose size
    is not at compile time, and for data that cannot be stack-based because it is
    too big. These classes are used where malloc would be used in C.


    # HBufC


    The HBufC8 and HBufC16 classes (and the neutral version HBuf, which provides of
    static NewL() functions to create the descriptor on the heap. These methods may
    leave if there is insufficient memory available. All heap buffers must be constructed
    using one of these methods or from one of the Alloc() or AllocLC() methods of
    TDesc, which spawn HBufC copy of any descriptor. Once the descriptor has been
    created to the size required, it is not automatically resized if more space is
    required. Additional memory must be reallocated using ReAlloc() or ReAlloc() methods.

    As the suffix of the name, and the inheritance hierarchy shown in Figure 3.1,
    HBufC descriptors are not directly modifiable, although the class provides assignment
    operators to allow the entire contents of the buffer to be replaced. To modify
    an HBufC object at runtime, a modifiable pointer descriptor, TPtr, must first
    be created using the HBufC::Des() method.


    ```

    //LIT(KTestBuffer, "Heap Based);

