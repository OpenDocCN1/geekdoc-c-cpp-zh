    object submits a request to an asynchronous service provider. An active object
    class supplies public methods that submit such a request, for which the standard
    behavior is as follows.


    +   Check for outstanding requests.

    An active object must never have more than one outstanding request, before attempting
    to submit a request, the active object must check to see if it is already waiting
    on completion.'
