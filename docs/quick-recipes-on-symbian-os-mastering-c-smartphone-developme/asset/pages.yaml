  md: '# Required library(s): efsrv.lib

    Required header file(s): f32file.h

    Required platform security capability(s): None


    Problem: Data paging provides protection to some special folders. One of them
    is the application''s private folder. It is located at \private\<SID>, where <SID>
    is the secure identifier of the application. This folder is normally used by the
    application to store its own data, which cannot be accessed by other processes.
    Since <SID> depends on the identifier of the application, how do we get the path
    of the private folder at runtime?


    Solution: The Rfs:: PrivatePath() method returns the path in the format of ''\private\SID>''.
    For example, if the application has a secure identifier which is 0xA1234567, then
    the private path will be \private\A1234567 (without ''0x'').


    Discussion: How do we add a filename to the path? For example, we want to add
    ''myfile.dat'' at the end of the private path.


    Furthermore, how we add a drive letter that is the same as the application''s
    drive letter? For example, if the application is installed on the E drive; we
    want to access the private folder located at e:\private\<SID>.


    Constructing a full name can be done manually using descriptor methods, such as
    TDes::Insert() and TDes::Append().


    There is another way of constructing the filename, which is using the TParse class.
    This is usually used to construct a filename based on its components. The construction
    is done with the method TParse::SetSet():


    ```

    IMPORT_C Tint Set(const TDesC aName, const TDesC aRelated,

    const TDesC* aDefault);

    ```


    The first parameter, aName, is the file specification to be parsed.

    The second parameter, aRelated, is the related specification of aName. Any missing
    component, such as a path or filename, in the first parameter will be set to the
    second parameter. For example, if the first parameter contains the path, only
    you can set a drive letter using the second parameter. If there is no related
    specification, then we set this parameter to NULL.


    The third parameter is the default file specification. Like the second parameter,
    if a component has no value in the first and second parameters, it will be assigned
    the value in the third parameter.


    Let''s take a look at a real example to see how it works:'
