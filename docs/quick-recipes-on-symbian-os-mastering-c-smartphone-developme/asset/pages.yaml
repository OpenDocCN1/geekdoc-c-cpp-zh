    # 4.3.2.1 Using the SDK Configuration Tools


    If you are using the S60 emulator, it already comes with the WinSock method, which
    should just work out of the box, since it is going to simply use the UIQ networking
    stack for connectivity.

    In the case of UIQ, the SDK installer will ask during installation to install
    WinPCAP, a free packet capture library for Windows. If you accept, the WinPCAP
    method will be available for the UI installer. After installation, you will need
    to finalize the WinPCAP setup by going to (from the Windows Start menu) UIQ 3
    SDK -> Config -> Communications tab and click ''Apply Ethernet''. Note that the
    SDK can be picky about the version of Perl installed and can prevent the SDKConfig
    application from running. It is recommended you install the one that comes with
    the SDK installer (version 5.6.1.635).


    # 4.3.2.2 Using WinPCAP


    As we saw earlier, the SDKConfig application can be used to configure WinPCAP-based
    IP connectivity for the UIQ SDK. The SDKConfig reality really does up a virtual
    Ethernet driver for the emulator, which shares your PC''s Ethernet interface.
    The configuration option for the virtual Ethernet driver is stored in the epoc.ini
    file (stored in sdk_ini_path\epoc032\data), and looks like this:


    ```

    ETHER_NIF=\Device\NIF_{80FA5794-DAC8-4BAA-94C9-A0AFB2DE04D8}

    ETHER_MAC=0207026b8886

    ETHER_SPEED=100Mbps

    ```


    In case the SDKConfig application fails to update the epoc.ini file, or you would
    like to use Ethernet connectivity in the S60 SDK, you will need to edit epoc.ini
    to add the lines above, with the appropriate parameters.

    ETHER_NIF specifies which Ethernet network card to use on your PC.

    The best way to get this is to install a free protocol analysis tool like Wireshark
    or Ethereal and use the ‘Capture Options’ dialog’s ‘Interface’'
