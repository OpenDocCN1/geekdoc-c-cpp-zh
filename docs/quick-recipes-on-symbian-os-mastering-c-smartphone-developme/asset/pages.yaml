  md: "# 196 SYMBIAN C++ RECIPES\n\nhanging thread with ViewSrv 11 panic. This is\
    \ why we have warned you not to use User::Wait...() throughout, whenever it has\
    \ been shown in sample code (it is shown only) to make the code snippet generic.\n\
    \nIn case the drawing also has to be handled with these tight-loop functions,\
    \ the loops should be implemented as active objects where each RunCall does one\
    \ round of the loop and sleeps for a while. The sleeping could, for example, be\
    \ implemented as an RTimer/CPeriodic type of timer (with idle priority). This\
    \ method would also allow the drawing to be cancelled (since key events can be\
    \ received and a menu can be shown), and it allows applications to receive redraw\
    \ events from the WSERV. For more information about active objects, please refer\
    \ to Chapter 3.\n\nDrawing events are also buffered in the client side. Practice\
    \ this means that lines inside the Draw() function are not executed one-by-one\
    \ in the WSERV, but instead line commands are collected into a buffer, which will\
    \ be executed when it is big enough or when it is flushed. For this reason, having/while\
    \ loops or User::After() in the Draw() function and trying to draw into the same\
    \ area while changing the drawing content will not work well in practice. Instead,\
    \ this kind of drawing could be timed or led outside the Draw() function using\
    \ active objects, drawing one at a time, and waiting between draws.\n\nThe most\
    \ important feature of the Draw() function is that it is non-leaving and constant.\
    \ This means that no code inside the Draw() function may have the potential to\
    \ leave – in case the leaving code cannot be avoided, it must be TRAPPED. Since\
    \ this function is constant, it cannot modify values so, for example, it cannot\
    \ change state variables belonging to the class inside the Draw() function. Instead,\
    \ you need to change the values outside and you can't call the DrawNow() function\
    \ to inform WSERV to draw the required content to the container's server.\n\n\
    All example code for drawing in normal application frameworks in this section\
    \ assumes that drawing is handled inside CCoControl's Draw() function, where the\
    \ graphics context (GC) is retrieved as:\n\n```\nvoid CContainer::Draw(const Rect&\
    \ aRect) const\n{\n  WindowGC& gc = SystemGC();\n}\n```\n\nThe example code in\
    \ the recipes below shows just the snippets most relevant to the discussion in\
    \ question. Further information about graphics and drawing on Symbian OS can be\
    \ found in the Symbian Developer Library documentation, available in SDK and online.\
    \ The graphics section of the Symbian OS Guide for an overview of WSERV, and the\
    \ C++ Component Reference section for details of each API. You will also find\
