  md: '# Acknowledgments


    The authors would like to thank the Symbian Press team for allowing us this opportunity,
    for their patience and for making the process as smooth as possible.


    The authors would also like to thank all the technical reviewers for their invaluable
    comments and for stopping us from making fools of ourselves.


    **Michael would like to thank:** my fellow authors on this book for making me
    look clever than I am, the kind people at Symbian Press for entrusting this project
    to a new author, David Wood for initiating the project, my family and my current
    or former colleagues for their help and inspiration.


