  md: '# 3.2.5 Static Classes


    Some Symbian OS utility classes, such as User, Math and Mem, take no prefix letter
    and contain only static member functions. The classes cannot be instantiated;
    their functions must instead be called using the scope-resolution operator – for
    example, User::After() which suspends the currently running thread for the number
    of microseconds specified as a parameter of the function. A static class is sometimes
    implemented to act as a factory class.


    # 3.3 Leaves and Exception Handling


    Leaves can be thought of as the equivalent of exception handling on Symbian OS.
    Think of them as using just one exception class, and simply including an integer
    (known as a ''leave code'') inside the exception to identify its cause.


    > Tip: Symbian OS v9 also supports C++ standard exceptions. This makes it easier
    to port existing C++ code to Symbian OS. However, even if your code uses standard
    C++ exceptions, leaves are a fundamental part of Symbian error handling and are
    used throughout the system, so it pays to understand them thoroughly.


    How do you know whether a function may leave? This is where we see another Symbian
    C++ naming convention, which is to terminate the name with a ''L''. In fact, of
    all Symbian OS naming conventions, this one is probably the most important rule:
    if a leaving function is not named correctly, callers of that function cannot
    know about it and may leak memory in the event a leave occurs. We''ll see how
    this could happen.


    > Tip: It is standard practice when defining leaving functions to avoid returning
    an error code as well. That is, since leaving functions already highlight a failure
    (through the leave code), they should not return error values. Any error that
    occurs in a leaving function should be passed out as a leave; if the function
    does not leave it is deemed to have succeeded and will return normally. Except
    under exception circumstances, leaving functions should return void unless they
    return a pointer or reference to a resource that they have allocated.'
  merge: -1
