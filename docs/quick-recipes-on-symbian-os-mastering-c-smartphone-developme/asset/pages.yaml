  md: '# WHAT TO DO BEFORE YOU RELEASE YOUR APPLICATION


    performance, only manifest when you test the application on a smartphone. You
    will also find usability much easier to determine, and some code will only work
    on hardware anyway, as that using the accelerometer or camera APIs. Make sure
    you test on a range of devices from each UI platform you are targeting. if you
    create an S60 application, be sure to test it on both Nokia and Samsung devices.


    # Static Analysis


    The Professional and OEM Editions of Carbide.c++ v1.3 ship with a tool callScanner,
    which is a static code analysis tool. While you cannot automate a code review
    entirely, you can use static analysis to run through code to detect where potential
    problems lurk, for example:


    +   - Methods that may leave but are not named with a trailing ‘L’.

    - Descriptor parameters passed by value rather than by reference.

    - ‘Worrying comments’ such as the words ‘hack’ or ‘to do’.


    The automated source code analysis company Coverity announced in late 2007 that
    it will also be adding support for Symbian C++ to its Prevent SQS static code
    analysis tool. The Symbian C++ checker is expected to be available soon, and more
    information about Prevent is available at www.coverity.com/prod_prevent.html.


    # 6.1.3 Optimize It!


    Before releasing your code, it is worth taking some time to consider whether it
    is as efficient as it possibly be. For example, Carbide.c++ Professional and OEM
    Editions ship with Performance Investigator, which is a profiling tool for analyzing
    the performance of applications on S60 3rd Edition devices. The tool runs as the
    application executes and can be used to determine which sections of code should
    be optimized to improve performance, memory, CPU usage or proper. You can find
    out about Performance Investigator, and the other tools that Carbide.c++ ship
    with, from the product page on Forum Nokia, at www.forum.nokia.com/main/resources/tools_sdks/carbide_cpp.


    Sometimes there are few simple adjustments that make a difference to its performance.
    A number of these are summarized in the free Performance Tips booklet published
    by Symbian Press at developer.symbian.com/main/learning/press/books/pdf/Performance_Tips.pdf,
    which examines a few performance killers as inefficient heap usage, repeated code
    within loops and over-enthusiastic ‘future proofing’ of code) in detail, and summarizes
    a number of quick tips.'
