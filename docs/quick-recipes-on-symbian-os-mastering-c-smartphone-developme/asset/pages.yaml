  md: '# Common problems with Active Objects


    Stray signal panics


    The most common problem when writing active objects is when you encounter a stray
    signal panic (E32USER-BASE 46). These occur when an active scheduler receives
    a completion event but cannot find an active object to handle. Stray signal panics
    are notoriously extremely difficult to debug. Stray signals can occur because:


    +   - CActiveScheduler::Add() was not called when the active object was constructed.


    +   - setActive() was not called after submitting a request to an asynchronous
    service provider. You usually only need to add the active object to the active
    scheduler once, however, it is common to reuse an active object several times
    to make several asynchronous requests and needs to be reactivated every single
    time.


    +   - The asynchronous service provider requested the request more than once,
    which is unlikely when using a Symbian OS system server, but conceivably when
    using a third-party server.


    If you receive a stray signal panic, the first thing to do is out which active
    object is responsible for submitting the request that later generates the stray
    event. One of the best ways to do this is to use logging in every active object
    and, if necessary, eliminate them from your code one by one until the culprit
    is tracked down.'
  merge: -1
