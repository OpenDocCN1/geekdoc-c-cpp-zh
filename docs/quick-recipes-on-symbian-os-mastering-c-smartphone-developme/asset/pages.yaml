    # **Discussion:**


    Preparing image capture

    Capturing a still image using a camera is done by calling CCamera::CaptureImage().
    This is an asynchronous method. When it completes, it calls CCameraObserver::Ready().

    Before capturing any, the CCamera::PrepareCaptureL() method has to be called to
    keep the latency of CaptureImage() to a minimum. It needs to be called only once
    for multiple CaptureImage() calls.

    The PrepareImageCaptureL() method requires two parameters. The first parameter
    is the format of the image. Here is the list of formats for images:


    +   - EFormatMonochrome

    - EFormat16bitRGB444

    - EFormat16BitRGB565

    - EFormat32BitRGB888

    - EFormatJpeg

    - EFormatExif

    - EFormatFbsBitmapColor4K

    - EFormatFbsBitmapColor64K

    - EFormatFbsBitmapColor16M

    - EFormatFbsBitmapColor16MU.


    One device may not support all the formats above. You can check which formats
    are supported by a device from TCameraInfo::iImage


    FormatsSupported. It is a bit flag with type CCamera::TFormat.

    The second parameter of PrepareImageCaptureL() is the index of the image size.
    It must be in the range of 0 to (TCameraInfo::iNumberSizesSupported - 1). You
    can get all supported image sizes by calling CCamera::EnumerateCaptureSizes().'
