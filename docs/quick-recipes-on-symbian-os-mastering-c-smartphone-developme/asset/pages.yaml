    of the project source.


    +   * TestQuest Pro from TestQuest (www.testquest.com) is another automated-test
    tool to verify the system by becoming a ''virtual user'' and replacing the need
    for manual testing.


    If you don''t have access to these tools, or they don''t meet your requirements,
    for example, Symbian OS provides a range of debug macros for checking the heap
    to ensure that it is balanced before and after code executes. The __HEAP_MARK
    and __HEAP_MARKEND macros can be used to check for memory leaks, while the __HEAP_FAILNEXT
    and __HEAP_SETFAIL macros can be used to simulate out-of-memory conditions, to
    check that code behaves correctly.


    One of the fundamental rules of mobile application development is that you must
    test your code thoroughly on hardware. The Windows emulator gives you a good idea
    of the application''s behavior while you are developing it, and it is invaluable
    when you are debugging. But it''s generally the case that subtle bugs, such as
    associated'
