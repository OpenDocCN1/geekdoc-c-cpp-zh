  md: '# TELEPHONY


    It is important to understand the difference between the locking status and the
    locking setting values. A lock has a status which tells you your current state,
    for example, whether it is locked, unlocked or blocked. A lock also has a setting,
    which is more like a policy, which says if the lock should be treated as ‘in use’.
    If the lock is enabled, then the status should be observed. If the lock is disabled,
    then the status is not important.


    > Note: Locking and unlocking the device requires usage of non-public APIs, thus
    if you need more information on the functionality, you would need to contact the
    manufacturer of the device you are targeting. This functionality can also be achieved
    by using AT commands, if the target device supports AT commands for using the
    phone lock.


