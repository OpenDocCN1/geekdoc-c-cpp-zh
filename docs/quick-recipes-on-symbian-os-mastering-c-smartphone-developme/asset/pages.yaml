  md: '# 3D GRAPHICS USING OPENGL ES


    +   - Memory consumption can also be monitored in real time to adapt the resolution
    of the textures in use.


    +   - Mobile users are usually more forgiving about a 3D object not looking as
    good as it would on their computer than an error dialog popping up in the middle
    of a game or a lagging animation.


    Since these recipes will probably be used by most to begin the development of
    games, it is worth mentioning that mobile games are not usually used in the same
    way as desktop games:


    +   - Users usually have minutes of available time, not hours, so loading time
    needs to be kept to a minimum and playability is paramount. Porting animation
    code will not be trivial since you will have to use native OS APIs.


    +   - Testing different animation algorithms are also variable between different
    smartphones and you may have to slow some objects to make user interaction possible.


    +   - Involuntary interruptions are also common on smartphones. They may lead
    to the implementation of a relative timer used for animating the 3D scene when
    it is in the foreground, the system time could suddenly jump by several minutes
    if the game is interrupted by an incoming phone call.


    +   - There is another problem related to interruptions. If you monitor key up
    and down events (instead of key pressed events) you may only get a key down event
    when the application is interrupted. The corresponding key up event would be delivered
    to another application in that case. After an interruption, a game should assume
    all keys have released.


