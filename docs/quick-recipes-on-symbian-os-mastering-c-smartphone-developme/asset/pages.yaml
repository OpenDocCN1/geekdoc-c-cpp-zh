  md: 'The possible values for the sampling rate and number of channels are defined
    in CMdaAudioDataSettings. There are several sampling rates, starting from ESampleRate8000Hz
    to ESampleRate64000Hz. There are two supported channels: EChannelsMono and EChannelsStereo
    (no surround sound).


    After all the properties have been set, you can start writing the data stream
    to the audio device. This is done by calling CMdaAudioOutputStream::WriteL().
    It requires a parameter with the type of DesC8B:


    ```

    TRAP(err, iAudioStream->WriteL(iBuffer));

    ```


    The optimal size of the buffer depends on your needs and the audio format. Ideally,
    you want to use the smallest possible amount of memory without risking a buffer
    underflow situation.


    > Tip: In order to avoid an out-of-data situation, you may want to use more than
    one buffer. For example, you may use two buffers. You pass one buffer to the audio
    stream and use the other buffer to read from the file. When the one buffer is
    passed to the audio device, you can replace it with the next data. The example
    in this book uses one buffer for simplicity reasons.

    In some applications that have a heavy thread, such as games, a larger buffer
    may not solve the underflow situation. In this case, you may consider running
    the audio stream in a separate thread with higher priority.

    Some audio-intensive applications may need to create proper buffer management
    algorithms to deal with different performance situations.


    You can start the streaming by calling CMdaAudioOutputStream::Stop(). Note that
    calling this method will cause the callback method, MaoscBufferCopied(), to be
    called with KErrAbort error code, and MaoscPlayComplete() with KErrCancel. If
    you are handling the error code in those methods, you have to exclude this situation.
    Otherwise, you will get an error message when stopping the audio streaming.


    > What may go wrong when you do this: After you have finished playing the stream,
    you have to stop the stream or destroy the instance of CMdaAudioOutputStream.
    If you don''t do this, the audio device is actually still on. This will drain
    the battery.'
