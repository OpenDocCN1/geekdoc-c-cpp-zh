    There are a number of commercial tools available for S60 and UIQ platforms:


    +   * TestPro from SysOpenDigia (www.sysopopendigia.com) allows automated functional,
    integration and user interface testing.


    +   * SymbianOSUnit from Penrillian (www.penillion.com) is a port of the popular
