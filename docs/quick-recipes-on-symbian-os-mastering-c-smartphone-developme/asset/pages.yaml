    Externalizing means writing an instance of this class to a file. In practice,
    you can write the following code to write to a file:


    ```

    writeStream << *employee;

    ```


    Internalizing is the opposite; that is, reading a file and storing the result
    into this object. For example:


    ```

    readStream >> *employee;

    ```


    In order to support internalize/externalize, add the two methods to the CEmployee
    class:


    ```

    void Internalize(RReadStream& aStream);

    void Externalize(RWriteStream& aStream) const;

    ```


    The following code shows the implementation of InternalizeL():


    ```

    void CEmployee::InternalizeL(RReadStream& aStream)

    {

    aStream >> iIdentifier;

    aStream >> iName;

    aStream >> iPhoneNumber;

    }

    ```


    You can see here how easy it is to write each member variable to the file. You
    can use the operator << to write the integer and descriptor. The following code
    shows the implementation of ExternalizeL():


    ```

    void CEmployee::ExternalizeL(RWriteStream& aStream) const

    {

    aStream << iIdentifier;

    aStream << iName;

    aStream << iPhoneNumber;

    }

    ```


    What may go wrong when you do this: When reading a descriptor, make sure that
    the descriptor has enough space. If the maximum length of the descriptor is not
    enough, the application will leave with KErrOverflow(-9).'
