  md: '# CONNECTIVITY 289


    The steps to perform a service search are as follows:


    +   1. Create a CSdpAgent object, supplying it with an MSdpAgent-Notifier object
    and the device address of the remote Bluetooth device obtained from the device
    procedure:


    ```

    CSdpAgent* agent = CSdpAgent::NewLC(aObserver, aDevAddr);

    ```


    +   2. Create a CSdpSearchPattern object to specify the service classes to search
    for. Classes can be added through CSdpSearchPattern::AddL() calls:


    ```

    CSdpSearchPattern* list = CSdpSearchPattern::NewL();

    list->AddL(KL2CAPUID);

    ```


    +   3. Set the search pattern on the agent object:


    ```

    agent->SetRecordFilter(list);

    ```


    +   4. Call CSdpAgent::NextRecordRequest() to get search results until results
    are exhausted, or sufficient results have been obtained:


    ```

    agent->NextRecordRequestL();

    ```


    The result is returned by a MSdpAgentNotifier::NextRequestComplete() method call.


    In addition to the available services list, you usually need to fetch more information
    about a particular service. This data is contained in service attributes and is
    carried by a similar mechanism as the services:


    ```

    CSdpAttrMatchList matchList = CSdpAttrMatchList::NewL();

    CleanupStack->Push(matchList);

    matchList->Add(CSdpAttrProtocolDescriptor);

    agent->AttributeRequestL(serviceHandle, *matchList);

    CleanupStack->PopAndDestroy();

    ```


    The result is returned by the MSdpAgentNotifier::RequestResult() method implemented
    by the observer.


    **Discussion:** Clients that make service and attribute queries through CSdp-Agent
    must implement the MSdpAgentNotifier interface to handle the responses.


    All queries are asynchronous, so the interface functions that are only called
    when the thread''s active scheduler can schedule the handling of the completion
    of the query.'
