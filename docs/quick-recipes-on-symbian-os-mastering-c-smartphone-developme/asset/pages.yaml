    #  3.9 Cleanup of the RArray Classes


    RArray<class T> is an array of elements of the same size which are stored within
    the array buffer. The Close() or Reset() functions may be called to clean up the
    array by freeing the memory allocated for the elements.


    +   * RArray::Close() frees the memory used to store the array and closes the
    array object.

    * RArray::Reset() frees the memory used to store the array but resets its so it
    can be reused.


    PointerArray<class T> is an array of pointer elements objects stored elsewhere.
    The ownership of these objects must be addressed separately when the array is
    destroyed. If pointers to the objects are held elsewhere (by other components),
    then calling Close() or Reset() to clean up the memory for the array of pointers
    is sufficient.'
