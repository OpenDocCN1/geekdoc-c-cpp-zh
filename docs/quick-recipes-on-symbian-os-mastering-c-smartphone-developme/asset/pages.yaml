  md: '# Post-Installation


    # 1.3.1 Command Line Tools


    Without arguments, the devices command lists all the installed SDKs from a DOS
    prompt:


    ```

    S60_3rd:com.nokia.s60

    S60_3rd_FP2_beta:com.nokia.s60 - default

    S60_3rd_FP1:com.nokia.s60

    UIQ.3:com.symbian.UIQ

    ```


    It also allows you to switch between SDKs as follows:


    ```

    -setdefault @S60_3rd_FP1:com.nokia.s60

    ```


    # 1.3.2 SDK Directories Structure


    Each SDK installs its own emulator binaries, handset libraries, tools code examples
    and documentation on your hard drive.


    +   - ..epoc32\winsc is where you will find the emulator drives.

    - ..epoc32\release\winsc\udeb\ is where you will find the binaries for the emulator,
    particularly epoc.exe which launches the emulator.

    - ..epoc32\release\gcc\urel is where you will find the ARM libraries your code
    will compile against.


    The code examples are split between the generic Symbian OS examples and the examples
    using APIs specific to the S60 or UIQ platform.

    SDK documentation is mainly in the form of CHM or PDF files. It contains information
    related to all the APIs publicly available in Symbian OS, along with information
    about the tools included in the SDK.'
