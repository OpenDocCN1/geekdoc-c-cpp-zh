    # 5.1 Advanced Technologies


    # 5.1.1 Publish and Subscribe: System-wide Properties


    You can find a full introduction to the Publish and Subscribe API at developer.symbian.com/main/downloads/papers/publishandsubscribe/PublishAndSubscribe_v1.0.pdf.


    The Publish and Subscribe API in Symbian OS is basically a kernelside hashtable
    that can contain only one value per key. The key of the hashtable should be a
    UID that you allocated. The value of the hashtable is a TInt or a TDesc (binary
    data or text, limited to 512 bytes).


    Your code accesses the hashtable through the RProperty class. The API is fairly
    basic: add/remove key, get/set value. You can also receive notification if a value
    changes using RProperty::Subscribe(), which is an asynchronous request. Only one
    request is allowed per RProperty instance at any given time.


    Each property belongs to a category, identified by another UID. The category UID
    defaults to the secure identifier of the current process. It can be useful to
    you as a developer to have a look at all the properties in the KUIDSystemCategoryValue
    category.


    The main issue with the system category is to find all the property keys that
    belong to it. They are scattered across many technologies, like Bluetooth, Backup
    and Restore and the Software Installer. Looking'
