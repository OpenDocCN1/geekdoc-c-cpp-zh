  md: 'Typically, these are calculated dynamically. A repeat rule defines when an
    entry is repeated. Several granularities are available: daily, weekly, monthly.
    These can be combined.


    Access to the Calendar database usually requires a calendar server session and
    a calendar view. Parts of the view are asynchronous and it is recommended that
    any application using the Calendar API uses objects to handle events (see Chapter
    3 for further details).


    When dealing with the Calendar APIs, you need to familiarize yourself with how
    time is represented in Symbian OS. Unless otherwise specified, we use a 64-bit
    integer, which counts the number of microseconds since midnight, January 1st,
    0 AD. For more information, the classes are TTime, DTime and all the TIntervalXYZ,
    documentation: Symbian OS Guide > Base > Using User Library (E32) > Date and Time
    Handling.


    One of the trickiest issues you will face with the Calendar APIs is dealing with
    moving across time zones, or changes to daylight saving hours. Different people
    and organizations have different requirements about what should happen to the
    times recorded in your entries when the system time changes. We don''t address
    this further here, since this is an issue every mobile application developer has
    to deal with in or her own way. You can easily end building versions of your application
    purely based on this issue and based on the different requirements of each of
    your customers. The best advice we can offer is to create a flexible solution
    and get your customer''s requirements early on.


    For testing purposes, the code samples of this book contain \PopulateAgenda, which
    makes sure that your environment contains an Agenda database initialized with
    a few entries.


