    # 3.11 Platform Security: Capabilities


    Platform security on Symbian OS v9 prevents applications from having unauthorized
    access to hardware, software and system or user data. The intention is to prevent
    malware, or even just badly written code, from compromising the operation of the
    phone, corrupting or stealing confidential user data, or adversely affecting the
    phone network.


    Every Symbian OS process is assigned a level of privilege through a set of capabilities
    which are like tokens. A capability grants a process the trust that it will not
    abuse the services associated with the associated privilege. The Symbian OS kernel
    holds lists of capabilities for every running process and checks it before allowing
    a process to access a protected service.


    The Symbian OS software installer verifies the digital signature of software at
    install ensure that it is authorized to use the capabilities it was built, and
    the digital signature can only come from a trusted authority. This prevents applications
    from arbitrarily assigning themselves the capabilities they want prior installation.


    There are 20 capabilities in Symbian OS (see Table 3.4). You can check the capabilities
    needed for a certain API from the SDK Help. An application must define the capabilities
    it is going to use by including them in its MMP file. For example:


    ```

    CAPABILITY UserEnvironment NetworkServices

    ```


    This means that the application uses two capabilities, UserEnvironment and NetworkServices.


    There are four different types of platform security capability, when digital signing
    is considered. The differences arise because of the sensitivity of the data or
    system resources the capabilities protect, and the requirements that are placed
    on the developer before they are given permission to use them. Please refer to
    Chapter 6 for more information about Symbian Signed, the scheme that performs
    digital signing on commercial software, to grant security capabilities to developers.


    The capabilities of a process cannot be changed at runtime. The Symbian OS loader
    starts a process by reading the executable and checking the capabilities it has
    been assigned. Once the process starts running, it cannot change its capabilities,
    nor can the loader or any other process or DLL that loads into it affect the capability
    set of the process.'
