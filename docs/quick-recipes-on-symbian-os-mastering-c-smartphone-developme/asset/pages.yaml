  md: '# WHILE YOU ARE WAITING


    # 1.2 While You are Waiting


    # 1.2.1 Carbide.c++


    There are four different editions of Carbide.c++:


    +   - Express Edition

    - Developer Edition

    - Professional Edition

    - OEM Edition.


    The free Express Edition is the only one that doesn''t allow debugging an application
