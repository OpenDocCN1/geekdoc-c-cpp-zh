    # 4.6.3.4 Rotate a 3D Object


    Amount of time required: 15 minutes

    Location of example code: \3D\Basic

    Required libraries: libgles2_cm.lib

    Required header file(s): GLES@egl.h

    Required platform security capability(s): None


    Problem: How to rotate a 3D object along the three coordinate axes.


    Solution: As we described in Recipe 4.6.3.3, the one thing you need to consider
    when dealing with the transformation of coordinates is that we are modifying the
    current state matrix. If you keep the transformation active on the main state
    matrix, it will be applied to all drawings.

    We are going to draw a simple triangle in 3D space and show how to apply a rotation
    to that object by using a temporary state matrix (rotation angles are measured
    in degrees). You can reuse the same template to manage complex objects.


    ```

    GLuint triangle[3 * 3] = {-1,1,0, /**/ 0,1,0, /**/ 1,0,0};

    gglEnableClientState(GL_VERTEX_ARRAY);

    glVertexPointer(3, GL_BYTE, 0, triangle);

    glLoadIdentity();

    PushMatrix();

    // Rotate 30 degrees on X and Y axes

    glRotate(30 << 16, 1 << 16, 0, 0);

    glRotate(30 << 16, 0, 1 << 16, 0);

    drawArrays(GL_TRIANGLES, 0, 3);

    PopPopMatrix();

    drawArrays();

    englSwapBuffers(eglDisplay, eglSurface);

    ```


    This code will show the same triangle drawn twice on the screen: once rotated
    (30 degrees over both the X and Y axes) and once in its original position.


    > Tip: Only the first 16 bits of the coordinates you pass to glRotatex are used.
    This is why there is a bit-shift in the code.'
