    there is insufficient memory to allocate the object (that is, if operator new
    (ELeave) leaves) or if the second-phase Construct() fails for any reason. This
    means that, if an object is initialized entirely by two-phase construction, the
    class can be implemented without the need to test member variable to see if it
    is valid before using. That is, if an object exists, it has been fully constructed.
    The result is an efficient class implementation without a test against each member
    pointer before it de-referenced.


    # 3.7 Thin Templates


    Symbian OS uses the template pattern in all its container classes, collections
    and buffers, to get the benefits of type-safety, while reducing the duplicated
    object code at compile time.


    The then template idiom implements the container using a generic base with T*
    pointers. A templated class is then defined that uses private inheritance of the
    generic implementation. (If your C++ is a bit rusty, private inheritance allows
    implementation to be inherited, the methods of the base class become private members.
    The deriving class does not inherit the interface of the base class as the generic
    implementation can only be used internally and not externally, which avoids accidental
    use of the non-type-safe methods.) Instead of a generic interface, the derived
    class provides a templated interface to its clients and implements inline by by
    calling the private base-class methods. The use of templates means that the class
    can be used with any type required and that it is type-safe at compile time.'
