  md: '# 3.15.3 Class TRequestStatus


    One of the most ubiquitous classes of Symbian OS is TRequestStatus. It is used
    for all kinds of purposes: synchronization, multithreading, multiprocessing, system
    interaction and asynchronous calls.


    A TRequestStatus object is basically a thread-specific rendezvous object. One
    Symbian OS thread can wait for another using User::Wait-ForRequest(), passing
    in a TRequestStatus object. Likewise, this thread can notify another using User::RequestComplete().


    Each thread can only wait on TRequestStatus at any time. The exception to this
    rule is User::WaitForRequest(), which makes the thread wait for any completion
    event.


    Each Symbian OS keeps track of how many of its requests were completed, so that
    if it waits on one request (A) while another request (B) is completed, the completion
    information is retained and the next call to User::WaitForRequest(B) will return
    immediately.


    Each TRequestStatus also contains an integer variable, which is set to KRequestPending
    before calling User::Wait-ForRequest(), either directly or through a call to an
    API that calls an asynchronous method, such as those provided by Symbian OS.


    When a request is completed, the instance variable allows some inter-thread information
    transfer, usually an error code or KErrNone.


    # 3.15.4 The Active Scheduler


    Most threads running on Symbian OS have an active scheduler, which is usually
    created and started implicitly by a framework (for example, CONE for the GUI framework).
    There is only one active scheduler created per thread, although it can be nested
    in advanced cases.


    Console-based test code must create an active scheduler in its main thread if
    it depends on components which use active objects. The code to do this is:


    ```

    CActiveScheduler* scheduler = new(ELLeave) CActiveScheduler;

    CleanupStack::Push(scheduler);

    CActiveScheduler::Install(scheduler);

    ```


    Once the active scheduler has been created and installed, its event-processing
    wait loop must be started by calling CActiveScheduler::Start(). The event-processing
    loop starts and does not return until a call is made to CActiveScheduler::Stop().
    For implementation reasons, there must be at least one asynchronous request issued
    before the loop starts, otherwise the thread simply enters the wait loop indefinitely.
    Let''s look at why this happens in more detail by examining the active scheduler
    wait loop:'
