    # 3.9 Arrays on Symbian OS


    Symbian OS does not include an implementation of the collections found in the
    Standard Template Library. Instead, it offers various templated classes for static
    and dynamic arrays. This section will help you make it clearer which array class
    does what and how.


    The most basic class is TFixedArray, which is a static array class, to be used
    when you know how many data items the array will contain.


    # 3.9.1 Static Arrays


    TFixedArray wraps a standard fixed-length C++ [] array to add range checking,
    and prevent out-of-bounds access by panicking to flag the infamous error. The
    range-checking assertions are asserted in debug builds only, or in both debug
    and release builds if you require it, by calling different methods on the class
    to access the elements. The class also provides some additional functions to navigate
    to the beginning and end, return the number of elements in the array, and clean
    up the elements it contains. Further information can be found in the Symbian Developer
    Library that accompanies each SDK.'
