  md: '# 4.6.1 OpenGL ES Primer


    Graphics/MBXLite/index.asp. Sony Ericsson devices contain the ''Lite'' version
    of the same processor.


    Before we start, you will need a working knowledge of geometry in three-dimensional
    space. You will also need to understand how to multiply matrices.


    In OpenGL ES, a point in space is called a vertex. The most complex shape you
    draw is a triangle. Each vertex can belong to several triangles, which facilitates
    the drawing of contiguous triangles forming more complex geometric shapes. By
    drawing many triangles, you can approximate pretty complex scenes.


    Each separate vertex can have its own color. The color of the area of a triangle
    depends on the color of its three vertices.


    You can decide how far the coordinate system extends. The axes point toward the
    right-hand side of the screen, toward the top of the screen and toward you. Beware.


    The basic available transformations are translation and rotation. These are executed
    before you ask the system to draw your vertices.


    The OpenGL ES implementation keeps a current state matrix. Each transformation
    means multiplying the current state matrix by transformation matrix and storing
    the result in the current state matrix. When drawing, all coordinates are transformed
    using the current state matrix. A stack of current state matrices allows for temporary
    states and you can always revert back to the identity matrix.


    Textures are images that can be applied to a surface, even if it means the OpenGL
    ES implementation to bend and warp to fit your requirements. They give you finer
    control than colors, but have a much higher footprint.


    Since your scene is a 2D plane, the content of the 3D scene you want to draw needs
    to be flattened. This is called projection. All the examples in this set of recipes
    will use the orthographic projection, which simplifies the amount of calculus
    you to perform but doesn''t take perspective into account all.


    # 4.6.2 OpenGL to OpenGL ES


    Each OpenGL ES version maps to an OpenGL version. OpenGL ES v1.0 is a subset of
    OpenGL v1.3 and OpenGL ES v1.1 is a subset of OpenGL v1.5.


    One main difference between the two standards is the availability of integer coordinate
    systems in OpenGL ES. It was added to reflect the considerable proportion of smartphone
    CPUs without a Floating Point Unit. This would be a non-trivial change when porting
    desktop-class code'
