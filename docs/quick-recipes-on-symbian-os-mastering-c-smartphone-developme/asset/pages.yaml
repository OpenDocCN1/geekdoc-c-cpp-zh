    A thread is created in the suspended state and its execution initiated by calling
    RThread::Resume(). On Symbian OS, threads are preemptively scheduled and the currently
    running thread is the highest-priority thread to run. If there are two or more
    threads with equal priority, they are time-sliced on a round-robin basis. A running
    thread can be removed from the scheduler''s ready-to-run queue by a call to RThread::Suspend().
    It can be restarted by calling Resume(). To terminate a thread permanently, you
    should call Kill() or Terminate() to stop it normally – and Panic() to highlight
    a programming error.


    Please see the Symbian Developer Library for more information about working with
    Symbian OS threads. Example code is also provided in the SDK to show the use of
    RThread and other Symbian OS system classes.


    # 3.17 Timers and Callbacks


    TheTimer class provides a very useful service and one of the simplest ways of
    making an asynchronous request to use an active object:RTimer::After() is the
    asynchronous request and RTimer::Cancel() is used to cancel the request if, for
    example, the application is closed before the kernel completes the request.


    RTimer::AtUTC() is a good way to implement alarms on your phone and RTimer::Inactivity()
    can be used both to save battery life and to prevent the phone''s keyboard and
    screen from locking.


    Another useful class is Callback, which is really just a fancy way of saying ''pointer
    method''. Actually, Callback can only represent a static non-leaving method that
    must return an integer and have one pointer parameter, which can be cast to a
    known type in order to access its methods.


    Callback is used by two different specialized objects that regenerate their own
    asynchronous requests: CPeriodic and CIdle. Both of them will be reactivated by
    the time their RunL() method returns. In both cases, RunL() is already overwritten
    and calls the Callback you define.


    CPeriodic::Start() uses a kernel timer to decide when its request will be completed.


    CIdle is a fairly strange exception against active objects: its request is not
    really asynchronous as it is already completed by the time CIdle::Start() returns.
    There would still be a delay before CIdle::RunL() is called, since, it has to
    be called from the active scheduler''s main loop.'
