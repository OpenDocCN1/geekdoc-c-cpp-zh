  md: '# 4.10 Location-Based Services


    Location-based services (LBS) offer the opportunity to extend applications, including,
    for example:


    +   - location-stamping artefacts such as photographs and notes,

    - finding nearby services and facilities,

    - navigation,

    - route recording.


    Location-based services are enabled by the use of global positioning. The global
    positioning system (GPS) is a global network of at least 24 satellites orbiting
    Earth 24 hours a day. It provides positioning, navigation and timing (PNT) services
    for military and civil needs and is available all over the world.

    GPS consists of three segments:


    +   - Satellite constellation – the group of satellites that send one-way signals,
    containing the satellite location and time.

    - Ground control and monitoring network – a number of control stations that provide
    path correction and other control.

    - Consumer GPS receiving equipment – devices that process the information from
    the satellites.


    GPS relies on retrieving information from at least three satellites, and affords
    an accuracy of location of approximately 2–10 meters. GPS provides 3D coordinates
    if there are more than three satellites available, so you can also learn the user''s
    current height. The distance to the satellite is calculated by measuring the signal
    delivery time. A number of Earth stations adding additional data (Differential
    GPS) can also support GPS.


    The accuracy of location can depend on the weather, surrounding buildings and
    a number of other factors. GPS has some major restrictions, such as limited coverage
    in urban environments and inside buildings to the requirement that mobile users
    be in ''view'' of the satellites, and a slow location acquisition time (in the
    region of 10 to 60 seconds).


    On Symbian smartphones, the prime location technology is expected to be integrated
    assisted GPS (A-GPS). A-GPS systems overcome some of the limitations of GPS position
    acquisition by using the fixed mobile network infrastructure to reduce acquisition
    time to less than 5 seconds, and may provide indoor accuracy to within 50 meters.
    However, as'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# SYMBIAN C++ RECIPES


    with infrastructure time of arrival (TOA) schemes, multipath interference and
    the lack of line of sight measurement can degrade performance, A-GPS can be less
    accurate than GPS under certain conditions. For network operators, the main benefit
    from integration of A-GPS is the ability to charge users for positioning information,
    because it uses the network infrastructure.


    The Symbian OS LBS subsystem allows local and network-based applications to determine
    the current location of the handset. The subsystem supported A-GPS hardware, but
    there is no specific support for other possible positioning modules (like external
    Bluetooth devices, for example). The universal API is used with any available
    modules such as A-GPS, Bluetooth GPS or network-based A-GPS.


    The primary purpose of having GPS integrated on the phone is to allow the user
    to be located during an emergency, the architecture supports the handling of network
    requests in low-memory conditions. This helps to ensure these requests always
    succeed.


    LBS API available for third-party applications splits into the following main
    groups:


    +   - location information API

    - positioning technology module information API

    - positioning technology module selection criteria API.


    Let''s briefly outline the common terminology and these three API groups. Further
    information is available in the Symbian Developer Library documentation, found
    in the SDK or online on the Symbian Developer Network.


    The location API allows you to obtain various information (for instance, latitude
    and longitude values). Its use is demonstrated in Recipe 4.10.2.1. The API requires
    a positioning technology module, which refers to the technique used to get the
    location information. You can retrieve the characteristics of that module using
    the positioning technology module information API. The LBS subsystem has the default
    positioning module, which is used to perform location requests. You can explicitly
    specify the required module or use the module selection criteria API to specify
    the positioning module has to satisfy to be selected during the location request.
    The LBS subsystem will try to identify all such modules and select the most suitable
    one.


    The following recipes discuss the LBS API and demonstrate how to use to fulfill
    different programming tasks. The recipes mention and describe in more detail a
    number of the various classes you would use during the development. Let us briefly
    overview them here in order to make the recipes easier to follow.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# LOCATION-BASED SERVICES


    Client applications use the RPositionServer and RPositioner classes as part of
    the location information API to get position updates. RPositionServer provides
    the means to manage a session with the location server and get positioning technology
    information. RPositioner manages a subsession with the location server and allows
    getting position updates. The position information is returned in the set of T
    classes, like TPositionInfo, TPosition, and so on. Depending on the positioning
    module capabilities, extended information may be returned. This could include
    information about the course and the satellite, and is provided using an extended
    set of classes: TPositionCourseInfo/TCourse and TPositionSatellite/TSelliteData.
    Extended location information is discussed in Recipe 4.10.2.


    The positioning technology module information API and the positioning module selection
    criteria API are represented by the set of T classes that describe different aspects
    of the LBS subsystem. Some of them are listed below:


    +   * TPositionModuleInfo

    * TPositionModuleStatus

    * TPositionModuleStatusEvent

    * TPositionCriteria

    * TPositionQuality

    * TSelectionOrder.


    As you go through the recipes, you will see them in action, to make clearer how
    to use them. For detailed information, please refer to the class reference in
    the Symbian Developer Library documentation (‘Location Acquisition API’ section).


    There are various privacy and legal issues in being able to determine where someone
    is. On a mobile device, it is a concern that a user will unintentionally enable
    other people to discover their whereabouts. It is also an anxiety that a malicious
    application will transmit its location to a remote party. Appropriate security
    and privacy mechanisms must be implemented to give the user confidence that their
    location is secure. The Location platform security capability is required by the
    examples given with these recipes. The user can authorize individual requests
    to determine the location of the smartphone as they arrive from the network.


    # Testing


    You can test the LBS recipes and your own LBS-related code on the emulator or
    on a device. The S60 emulator usually has built-in GPS support, so you can run
    and debug your code directly in IDE.'
  merge: -1
