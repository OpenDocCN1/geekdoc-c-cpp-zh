    # 3.5 The Cleanup Stack FAQ: Advanced Information


    This section contains some advanced information that may answer some of the questions
    you have had while using the cleanup stack. It''s a useful reference, but if this
    is the first time that you''ve encountered the cleanup stack, you may prefer to
    skip ahead to the next section, and return here when you''ve had a chance to experiment
