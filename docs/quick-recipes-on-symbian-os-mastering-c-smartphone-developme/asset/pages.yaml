  md: '# ### 4.4.3 Tips for Writing Messaging Applications


    # #### 4.4.3.1 Messaging Libraries


    There are two versions of the messaging library, msgs.lib and msgs_aut셧.lib. With
    the latter, the message server automatically shuts down when no sessions exist.


    # #### 4.4.3.2 Multimode SMS


    Your application should use the multimode version of the messaging APIs, the header
    files for which are in \epoc32\include\messaging. If writing an application that
    makes explicit use of CDMA SMS functions (not needed for these examples here),
    you may require the following macros:


    ```

    MACRO CDMA_API_ENABLED

    MACRO GSM_COMPATIBILITY_MODE

    ```


    # #### 4.4.3.3 Implementation Differences


    It is important to remember that there may be implementation differences between
    different UI versions, especially when it comes to the phone''s messaging application,
    service entry, folders, etc. and its own way of creating, handling and displaying
    messages. You may be able to use some of the functionality provided by the UI
    in your application, such as the message editor, but be aware of such differences.


    You can use SendAs to help shield you from some dependencies on UI implementations,
    but its functionality only extends to creating and sending messages.


    # #### 4.4.3.4 Mail Store Debugging


    You can view the emulator''s message store tree by going to \epoc32\winscw\private\100048b\Mail2
    in a Windows command prompt and using the Windows tree command. The message, folder
    and attachment entries are identified by their TMsid (hexadecimal) values and
    you can see the message text and attachment files. It is worth experimenting with
    this to improve your understanding of how the message store works trying creating
    or deleting some messages in the emulator and see what happens to the tree. It
    can be a useful debugging tool once you know what you are looking at.


    # #### 4.4.4 About the Recipes


    We will use SMS to illustrate how to use the message server to carry out common
    messaging tasks. For other transports, these tasks are performed'
