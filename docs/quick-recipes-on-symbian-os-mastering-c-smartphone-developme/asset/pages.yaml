  md: 'There is a call to MStreamBuf::SeekL() to move the file pointer to the end
    of the file.


    There are several different versions of SeekL(). The one that is used by the method
    above is the following:


    ```

    TStreamPos SeekL(TMark a, TStreamlocation location, TInt offset=0);

    ```


    The aMark parameter indicates the type of mark, whether read or write. The file
    stream maintains independent read and write pointers. They can be manipulated
    differently. The location parameter is the location in the stream on which the
    calculation of the new position is based. There are three different possible values
    for aLocation, that is:


    +   - EStreamBeginning. The seek position is calculated relative to the beginning
    of the stream.


    +   - EStreamEnd. The new position is calculated relative to the end of the stream.
    It is the one used in the example above.


    +   - EStreamMark. The new position is calculated relative to the existing mark
    in the stream.


    The aOffset parameter is the offset value.


    # Detecting End of File


    The previous reading example reads one integer. How do we read more integers until
    EOF (End of File)? Unfortunately, RFileReadStream and RFileWriteStream do not
    provide a method to check EOF. There are two ways of reading more integers:


    +   - The number of integers in the beginning of the file. How on many times you
    have to read the stream. You can use a for statement to read the entire file.


    +   - Call MStreamBuf::Size() to get the file size and then call MStreamBuf::TellL()
    to check whether the file pointer has reached EOF or not.


    The following code shows how to read integers from the stream until EOF. All the
    integers are stored in an array.


    ```

    CFileStreamAppUi::ReadAllInt32FromStreamL(RFS& aFs, const TDesName& aName, RArray<TInt>&
    aArray)

    ```'
