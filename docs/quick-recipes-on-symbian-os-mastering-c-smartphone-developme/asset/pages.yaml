  md: '# ACTIVE OBJECTS


    RunL() should check whether the asynchronous request succeeded by inspecting its
    completion code, which is the 32-bit integer value store in the TRequestStatus
    object (iStatus) of the active object. complexity of RunL() code can vary considerably,
    but since RunL() cannot be preempted by other active objects'' event handlers
