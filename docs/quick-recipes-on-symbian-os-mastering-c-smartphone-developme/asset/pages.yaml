    as it uses TParse (see Recipe 4.1.2.1) for an example of how to use this class.


    The next criterion is the media IDs that must be supported by the plug-in, for
    audio or video. It is set by calling CMMFControllerPluginSelectionParameters::SetMediaIdsLL().


