  md: '# CONNECTIVITY


    283


    As a general rule, communications in Symian OS are built around a client–server
    architecture just like many other available services. C32 is the Symian OS comm
    server and supplies a client-side API and server-code, which is run as a thread
    in the C32 server process. The C32 process contains its main thread, the C32 thread
    and a number of other threads, namely ESOCK, Etel and Phone Synchronizer. The
    ESOCK framework will be mentioned extensively in these recipes, as it plays an
    important role in connectivity services provision for applications and high-level
    technologies in Symian OS.


    The actual implementation of various connectivity components is spread over multiple
    modules and therefore can be confusing in some cases. A good example is the OBEX
    classes, which are declared in clearly named header files – but you have to link
    your application against irobex.lib even though you intend to use Bluetooth connections.


    The usage of different communication techniques may require appropriate platform
    security capabilities to be granted to your applications. All cases are noted
    explicitly throughout the examples where necessary. High-level protocols, such
    as OBEX, often rely on the policy declared by low-level ones; hence it is reasonable
    to assume in most cases that your applications will be expected to have LocalServices
    capability present.


    In order to keep them simple the code samples in these recipes are going to use
    few active objects as possible. Most asynchronous method calls are simply followed
    by User::WaitFor(). This is of course not how production-quality code should behave,
    and the code samples provided for download to accompany this book will illustrate
    how to call asynchronous APIs correctly.


