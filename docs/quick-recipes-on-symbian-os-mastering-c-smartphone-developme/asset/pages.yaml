  md: "# WHAT TO DO BEFORE YOU RELEASE YOUR APPLICATION 339\n\nFor example, when creating\
    \ an application, it is easy to place all the text displayed in the UI directly,\
    \ such as dialog titles or menu options, within the application's RSS resource\
    \ file. While this works perfectly for a single-language application, when you\
    \ come to create additional, different language versions, it it harder because\
    \ you have to search the files to locate and translate each of the text elements.\
    \ Symbian recommends splitting the text out into a separate file, known as an\
    \ RLS file. RLS files contain token-value pairs which can be used in the RSS file.\n\
    \nFor example, an S60 MENU_PANE resource, specified in the RSS file:\n\n```\n\
    //example.rss\n#include \"example.rls\"\n\n// Define the menu items that comprise\
    \ a menu pane\nRESOURCE MENU_PANE r_filebrowse_menu\nitems={\n    MENU_ITEM {\
    \ command=ECmdFilebrowseOpen;\n    txt = STRING_r_filebrowse_loc_Open };\n   \
    \ MENU_ITEM { command=EAknCmdExit;\n    txt = STRING_r_filebrowse_loc_Exit; }\n\
    }\n```\n\nIn the associated RLS file, for the English version:\n\nThe RLS file\
    \ can be sent to translators to create a separate version, for example, in French\
    \ or Portuguese. A translator will not necessarily be a programmer and, for this,\
    \ the structure of the RLS file is restricted to straightforward token-value pairs.\
    \ However, you can also include C or C++style comments in the text localization\
    \ file to inform the translator of the context in which each text item appears,\
    \ and to give information about any constraints, such as the maximum length permitted\
    \ for a string.\n\nTo build an application in multiple languages, the LANG identifier\
    \ is used in an application's MMP file. The keyword must be followed by a list\
    \ of two-character codes, one for each language, for example:\n\n```\nLANG 01\
    \ 02\n```\n\nThe codes can be anything you like, but are normally taken from the\
    \ two-digit values specified in the TLanguage enum in e32const.h."
  merge: -1
  pgno: 368
- img_proc: true
  md: "340 RELEASING YOUR APPLICATION\n\nThe Symbian OS build tools use the LANG statement\
    \ to build the application's resource files once for each code in the list. For\
    \ each build:\n\n+   - A LANGUAGE_XX symbol is defined.\n- The resulting binary\
    \ is given a .rXX extension which represents the language code for that.\n\nThese\
    \ codes are listed in the Software Installation Toolkit, included in the Symbian\
    \ Developer Library, which can be found in the documentation of your So 360 Third\
    \ Edition or UIQ 3 SDK.\nYou should include the appropriate RLS files in each\
    \ of the application's localizable resource scripts, for example:\n\n```\n// example.rss\n\
    \n#ifndef LANGUAGE_01\n#include \"exampleenglish.rls\"\n#elif defined LANGUAGE_02\n\
    #include \"examplefrench.rls\"\n#endif\n\n// Define the menu items that comprise\
    \ a menu pane\nRESOURCE MENU_PANE R_filebrowse_menu\n{\n    items:\n    {\n  \
    \      MENU_ITEM (command=ECmFileBrowse);\n        txt = STRING_r_filebrowse_loc);\n\
    \        MENU_ITEM (command=EAKcmExit);\n        txt = STRING_r_filebrowse_loc_Exit);\n\
    \    }\n}\n```\n\nIn this case, the result of the build is to generate two resource\
    \ files, named example_loc.r01 and example_loc.r02, containing English and French\
    \ text, respectively. They replace the example.resource which is created if no\
    \ LANG keyword is used in the MMP file, and need to be included in the PKG package\
    \ file, for installation to the phone.\nThe PKG package file, used to build the\
    \ software installation package, can be used to specify the language options available\
    \ for the application. At-install, only the language files specific to the language\
    \ selected by the user will be installed. The PKG file can also be used to specify\
    \ the text for the application's name as it is displayed in the phone's main display.\n\
    \nYou can find a lot more information about how to create an installation file\
    \ for a multilingual application in the Symbian Developer Library. Information\
    \ is available in the Software Installation Toolkit, which can be found in the\
    \ Tools and Utilities section, and in the Locale Settings section in the Base\
    \ section of the Symbian OS Guide section."
