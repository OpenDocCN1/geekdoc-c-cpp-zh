  md: '# 6.3.3 Partnering Within the Symbian Ecosystem


    Forum Nokia Launchpad and Forum Nokia PRO


    Forum Nokia Launchpad is Nokia''s mobile development resource for those working
    on Nokia platforms. Through the Launchpad program, Forum Nokia also evaluates
    member companies for further engagement and additional business channel opportunities.


    More information about Forum Nokia Launchpad is available at pro.forum.nokia.com/site/global/home/program_details/p_launchpad.jsp.


    Forum Nokia PRO is an invitation-only program for companies operating in the mobile
    world. In addition to early access to development resources and information, a
    dedicated business development manager (BDM) from Forum Nokia is assigned to each
    Forum Nokia PRO company. The BDM makes sure the company receives appropriate attention
    within Nokia and provides additional channel opportunities to accelerate revenue
    growth. Forum Nokia PRO also connects its members to exclusive, early access technical
    resources.


    More information about Forum Nokia PRO is available at pro.forum.nokia.com.


    # UIQ Alliance


    UIQ Alliance is a network of key companies in the mobile handset industry. Membership
    of the UIQ Alliance is by invitation, and more details are available at partner.uiq.com/portal/partner.nsf/external/howto.'
