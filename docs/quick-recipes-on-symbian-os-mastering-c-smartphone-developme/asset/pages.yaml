  md: '# GRAPHICS AND DRAWING


    occasionally cause problems. For example, if an application loads a font and forgets
    to release it after use, it could lead to situations where the font is left open.
    If the user tries to remove the font from the file system, the installer returns
    an ‘In use’ error and removal is prevented. potential error situation comes with
    scalable graphics images. These are loaded into memory once, and all future access
    is handled by using the cached image. If the content of the MIF file is altered,
    it might not be reflected when loading images, until the cached image is released
    from the memory, and the updated file reloaded.


    If you need to update the screen a number times per second, for example when writing
    a game, drawing through WSERV may be too slow. As an alternative, you can also
    draw graphics using direct screen access (DSA), which greatly reduces the overhead
    of communicating with the window server, and increases the drawing speed.


    When you create an application with the Symbian OS application framework, drawable
    windows are created by constructing CCoControl-derived container classes for UI,
    and the drawing is handled using CWinCounter in the CCoControl’Draw() function.
    In case you need to get access to the container’s window, you could get a handle
    to it using the Window() function defined for CCoControl, the area set for the
    container can be fetched with the Rect() function call and its position in the
    display is returned by the PositionRelativeToScreen() function. With CCoControl,
    there is no need to activate/deactivate the graphics content (and trying to do
    so might lead to a panic) or to implement active objects for monitoring redraw
    events, since all of this is already handled by the Symbian OS application framework
    and the CCoControl class.


    An important issue to understand Symbian OS – and drawing in it – is Symbian OS
    is event-driven, and all drawing is implemented as event-driven drawing. This
    means that each redraw is started with an event, usually a WSERV-generated redraw.
    WSERV implements a queue for storing redraw events in cases they can’t be delivered,
    and this queue holds a maximum of only one redraw event per window. If your application
    is unable to receive and handle redraw because it is handling an event of higher
    priority, subsequent redraw events can be lost. However, as soon as the application
    can handle events again, it will process exactly one redraw event from the WSERV.


    This is important to understand, if the application is busy handling some other
    events, it will not be able to receive redraw events until it has finished. This
    means that no updates to the window will occur until the application has completed
    processing for the other event. Most often this happens when using tight for or
    while loops, for example, implementing delays with calls to User::After(). It
    can also happen when using User::WaitForRequest() to wait active object requests
    to complete. In the worst case scenario the window server will panic the'
