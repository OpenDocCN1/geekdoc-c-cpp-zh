  md: '# THREADS


    # Unresponsive UI


    In an application thread, in particular, event-handler methods must be kept short
    to allow the UI to remain responsive to the user. No single active object should
    have a monopoly on the active scheduler since that prevents other active objects
    from handling events. Active objects must cooperate and should not:


    +   - Have lengthy Run() or DoCancel() methods.

    - Repeatedly resubmit requests that complete rapidly, particularly if the active
    object has a high priority, because the event handler will be invoked at the expense
    of lower-priority active objects waiting to be handled.

    - Have a higher priority than is necessary.


    Other cases of an unresponsive UI are temporary or permanent thread blocks that
    result because of:


    +   - A call to User::After(), which stops the thread executing for the length
    of time specified.

    - Incorrect use of the active scheduler. There must be at least one asynchronous
    request issued, via an active object, before the active scheduler starts. If no
    request is outstanding, the thread simply enters the wait loop and sleeps indefinitely.

    - Incorrect use of User::WaitForRequest() to wait on an asynchronous request,
    rather than correct use of the active object frame-work.


    # 3.16 Threads


    In many cases on Symbian OS, it is preferable to use active objects rather than
    threads, since these are optimized for event-driven multitasking on the platform.
    However, when you are porting code written for other platforms, or writing code
    with real-time requirements, it is often necessary to write multithreaded code.
    The Symbian OS class used to manipulate threads is Thread, which represents a
    handle to a thread; the thread itself is a kernel object.


    The Thread class defines several functions for thread creation, each of which
    takes a descriptor for the thread''s name, a pointer to a function in which thread
    execution starts, a pointer to data to be passed to that function (if any), and
    the stack size of the thread. Thread::Create() is overloaded to allow for different
    heap behavior, such as definition of'
