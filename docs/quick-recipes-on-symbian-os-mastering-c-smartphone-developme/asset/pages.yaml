  md: '# 3.5.5 How Do I Mix Leaves, Exceptions and the Cleanup Stack?


    Symbian OS TRAPS and leaves are implemented internally in terms of C++ exceptions
    (a leaf is a XLeaveException), and a TRAP panic if it catches any kind of exception.
    This means that, if you are mixing C++ exceptions in traditional Symbian OS leaves
    and TRAPS, you must not throw an exception in a leaving function unless you also
    catch and handle it internally in that function.

    A standard catch block will not manage the Symbian OS cleanup stack correctly,
    so code that throws exceptions should not use the cleanup stack directly or indirectly.
    If you are calling functions from exception-style code, do not use the cleanup
    stack, but make the calls as required and catch and handle any exceptions that
    arise. For more information about mixing leaves, exceptions and the cleanup stack,
    refer to a paper on the Symbian Developer Network called ‘Leaves and Exceptions’
    to located at developer.symbian.com/main/downloads/papers/Leaves%20and%20Exceptions.pdf.


    # 3.6 Two-Phase Construction


    Consider the following code, which allocates an object of type CExample on the
    heap and sets the value of `foo`:


    ```

    CExample* foo = new (ELeave) CExample();

    ```


    The code calls the new operator, which allocates a CExample object on the heap
    if there is sufficient memory available. Having done so, it calls the constructor
    of class CExample to initialize the object. But if the CExample constructor leaves,
    the memory already allocated for `foo` and any additional memory the constructor
    may have allocated will be orphaned.

    This leads to a fundamental rule of memory management on Symbian OS: A C++ constructor
    should never leave.

