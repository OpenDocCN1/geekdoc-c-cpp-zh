  md: '# Required header file(s): etel3rdparty.h

    Required platform security capability(s): None


    Problem: You want to monitor incoming calls and call states.


    Solution: The CTelephonyAppUI class shows shows how to use the Call__Observer
    code.

    In order to monitor the status of your phone, you need to call CTelephony::NotifyChange().
    Each status retrieved will trigger a call to RunL() and the error code can be
    retrieved from its iStatus variable. If the error is KErrNone, the line status
    information will be stored in the TCallStatusV1 variable given to NotifyChange.

    All possible status values are defined in TCallStatus and are as follows:


    +   * EStatusUnknown (status is not known).

    * EStatusIdle (line is idle, i.e., no activity at all).

    * EStatusDalling (line is dialing an outgoing call).

    * EStatusRinging (line is ringing, i.e., either incoming call is ringing, or outgoing
    call is ringing on the other end).

    * EStatusAnswering (call is currently being answered).

    * EStatusConnecting (call is being connected).

    * EStatusConnected (call is connected, i.e., we have an active phone call).

    * EStatusReconnectPending (call is undergoing temporary channel loss and it may
    not be reconnected).

    * EStatusDisconnecting (a call is being disconnected).

    * EStatusHold (call is on hold state).

    * EStatusTransferring (call is being transferred).

    * EStatusTransferAlerting (call is alerting the remote party of a transfer).


    > What may go wrong when you do this: State event can be lost if you don''t exit
    your RunL() method quickly enough, particularly if you trigger a change in your
    RunL() method. We advise using separate active objects to implement the logic
    of your application and only using the original NotifyChange() callback to trigger
    their execution.'
