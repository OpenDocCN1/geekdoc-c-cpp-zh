    Various LBS classes hold position information as 32- and 64-bit numbers for most
    of the cases unless stated otherwise. The standard measurement units are all


    +   - Latitude and longitude are held in 64-bit real numbers. Altitude is held
    in a 32-bit real number. By default, the WGS-84 datum is used to reference coordinates.
    All positions returned by the location server use this coordinate reference system.
    Latitude values are in the range [-90, +90] (-90 <= latitude <= +90), whereas
    longitude values are in the range [-180, +180] (-180 <= longitude <= +180).


    +   - Both horizontal and vertical accuracy are held in 32-bit real numbers that
    represent the error offset in meters. In practice, the actual position lies within
    the respective accuracy circle with 68 % probability.


    +   - Bearings and headings are held in 32-bit real numbers and represent the
    direction in degrees from the true north. Their corresponding accuracies are also
    held in 32-bit real numbers and represented in degrees.


