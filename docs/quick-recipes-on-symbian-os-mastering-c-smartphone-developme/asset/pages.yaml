    +   - Symbian Developer Network: developer.symbian.com.

    - Forum Nokia: forum.nokia.com.

    - UIQ Developer Community: developer.uiq.com.

    - Sony Ericsson Developer Forum: developer.sonyerricsson.com.

    - MOTODEV Developer Forum: developer.motorola.com.


    While you are waiting, you should register on, at the very least, the following
    website:


    +   - Symbian Signed: www.symbiansigned.com.


    There are also many independent sites, which contain a lot of helpful and educational
    information; for instance, www.newlc.com.'
