    # 4.6.5.2 Adapt Performances


    **Problem:** You want to adapt your animation to your target devices.


    **Solution:** On OpenGL platforms, developers have several techniques that allow
    for smooth animation of scenes, even when resources are constrained:


    +   * Effects that refine the look of 3D objects can be switched on or off.

    * The number of objects displayed on the screen can be adjusted (by screen resolution).

    * General code optimization techniques can be used. OpenGL is one level above
    C-type code, you cannot rely on the compiler making the right optimizations. A
    3D-modeling tool might, though.

    * Knowing the inner workings of specific OpenGL implementations is also useful.
    Constructors'' help forums are gold mines of information.


    These techniques are still valid in OpenGL ES. However, there are other factors
    to take into consideration:


    +   * Screen sizes can be diverse, and guaranteeing a user experience across a
    range of devices requires some experimentation.

    * Required configurations we need to enumerate specific handset models (or ranges),
    instead of CPU speed for example.

    * The amount and time of memory on smartphones is also more an issue than on desktop
    computers, so the speed/size trade-offs will need to be revisited and textures
    should be used carefully.

    * At the time of writing, only a few handsets contain a hardware 3D accelerating
    chip and their performances are wildly better than those without. Yet, as a developer,
    you don''t want configuration management to become your main nightmare. There
    are just many more interesting things to lose sleep over.

    * From an engineering standpoint, it makes sense to write an adaptive animation
    monitor that will decide in real time how the 3D scene should be (how deep, how
    precise, etc.) and how fast 3D objects should move by measuring the time it takes
    to render a scene.'
