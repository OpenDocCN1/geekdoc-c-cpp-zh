  md: '# 4.3.2.3 Using WinTAP


    WinTAP is a relatively new connectivity method available to Symbian OS emulators.
    Instructions on how to install and use it can be found at: www.developer.symbian.com/main/tools/devtools.
    The main advantage of WinTAP is that it doesn''t require the elaborate setup involving
    WinCap and creates a virtual Ethernet adapter that is visible on Windows PC too.
    The slight downside of this method is that it requires enabling of Internet Connection
    Sharing on your PC, since the virtual adapter accesses the IP network through
    the physical adapter on which ICS was enabled; for example, the PC LAN card. Note
    that problems associated with network access over ICS will apply to your application.


    # 4.3.2.4 Using WinSock


    The WinSock method is the default connectivity solution in the S60 SDK and uses
    Windows sockets directly, bypassing the Symbian OS TCP/IP stack. The biggest advantage
    is that there is no special setup required at all, since the Symbian OS running
    under the emulator are just clients to the Windows networking stack. The downside
    is that setting or retrieval of protocol-level options supported by the Symbian
    OS TCP/IP stack which are not present in the Windows stack will fail, besides
    features that are not supported on WinSock, like IP multicasting. Hence, be sure
    to pick the right connectivity method depending on the application you are developing.


    At the time of writing, there is no WinSock connectivity method available for
    the UIQ 3 SDKs based on Symbian OS v9.x.


    # 4.3.3 HTTP


    The HTTP framework in Symbian provides a HTTP client stack, supporting all standard
    HTTP 1.1 services and protocol-defined requests, including GET and POST. The framework
    also supports compatibility with HTTP 1.0 servers, authentication (basic and digest)
    and secure connections. Notable omissions include cookie management, caching and
    content encoding. However, the framework supports an extensible filter mechanism
    that can be used to provide support for the above. Check your SDK documentation
    for more information.


    The HTTP framework is implemented as a client-side library in http.lib. The framework-related
    classes and so are defined in http.h. HTTP requires access to a network connection;
    hence applications using the HTTP framework need NetworkServices platform security
    capability.'
