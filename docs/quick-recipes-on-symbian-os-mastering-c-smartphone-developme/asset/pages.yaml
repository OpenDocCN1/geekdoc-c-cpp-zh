    message event can also simply be triggered by a message being moved to the Inbox
    folder.


    The MTM client DLL needs to translate basic messaging operations into the correct
    binary format for the messaging protocol. For example, a recipient address would
    have a different format for email than for SMS.


    The MTM client UI DLL mirrors the MTM server DLL a lot. This is where the messaging
    application forwards user requests like moving messages between folders.


    The MTM UI data DLL is the interface with the messaging browser on your handset.
    This means checking how messages can be transferred from one MTM to another and
    customizing the look of the messaging browser with your own icons.


    What you cannot change right now, on any platform, is the way the message index
    browser (the application that shows you the different messaging services and folders)
    handles folders and messaging account entries. The messaging browser will display
    the icons you want it and it will launch your messaging application, but you may
    not be able to force it to display your MTM''s Inbox as a special item, for example.


    The message browser could be the same actual binary as the default messaging application
    on your handset. However, this won''t prevent you from developing your own messaging
    application. The handset needs something to act as a messaging browser, capable
    of handling database entries regardless of the MTM to which they ''belong''.


    Similarly, the default messaging application on your handset could be able to
    handle SMS, MMS and email messages even though these services would typically
    be implemented as three different MTMs since the binary formats and networking
    protocols are so wildly different.


    When writing a new messaging application, you should make full use of the GUI
    controls, views and dialogues already available in your platform, the ones discussed
    in Section 5.1.3 as they allow you to simplify the logic behind recipients to
