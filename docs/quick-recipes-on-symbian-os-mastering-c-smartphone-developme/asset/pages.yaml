    Problem: You want to get the phone number of an incoming/outgoing call.

    Solution: To retrieve a remote phone number from an incoming call, the call needs
    to be at least in the ringing state.

    to retrieve a remote phone number from an outgoing call, the call needs to be
    at least in the dialing state.

    You will find the source code for this recipe in the same class as the code for
    Recipe 4.8.1.3 (that''s MyCallObserver), because this allows us to retrieve the
    phone number at the buffer at the first available opportunity, which is when the
    call state changes.

    The actual function lets GetCallInfo(), for which:


    +   1. The first parameter lets choose between voice/data/fax lines.

    2. The second parameter is a TcallInfoV1 buffer, which will hold information for
    the call and includes the phone number for outgoing calls.

    3. The third parameter is a TRemotePartyInfoV1 buffer, which holds information
    on the remote party and may include the phone number for incoming calls (if it
    is available from the Call Line Identification).


    > What may go wrong when you do this: Some devices have shown ''Out of Memory''
    errors when using GetCallInfo() directly in a state event callback, which is the
    sample code contains an added User::After() delay before calling the method. This
    is presumably an internal defect.

    A better around would be to use a separate active object to handle the delay,
    but it would need to be cancelled if the call terminated before the timer goes
    off.


