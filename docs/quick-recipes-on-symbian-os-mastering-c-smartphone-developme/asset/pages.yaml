  md: '# Symbian OS Code Conventions and Notations Used in the Book


    For you to get the most out of this book, let''s quickly run through the notation
    we use. The text is straightforward, and where we quote example code, resource
    files, or project definition files, they will be highlighted as follows:


    ```

    This is example code;

    ```


    Symbian C++ uses established naming conventions. We encourage you to follow them,
    in order for your code to be understood most easily by other Symbian OS developers,
    and because the conventions have been chosen carefully to reflect object cleanup
    and ownership, and make code more comprehensible. An additional benefit to using
    the conventions is that your code can be tested with automatic code analysis tools,
    which can flag potential bugs or areas to review.


    The best way to get used to the conventions is to look at code snippets in this
    book, and those provided with your chosen SDK.


    # 1.1 Capitalization


    The first letter of class names is capitalized:


    ```

    Class TColor;

    ```


    The words making up variable, class, or function names are adjoining, with the
    first letter of each word capitalized. Classes and functions have'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# SYMBIAN OS CODE CONVENTIONS AND NOTATIONS USED IN THE BOOK


    their initial letter capitalized while, in contrast, function parameters, local,
    global, and member variables have a lower case first.

    Apart from the first letter of each word, the rest of each word is given in lower
    case, including acronyms. For example:


    ```

    void CalculateScore(Tint aCorrectAnswers, Tint aQuestionsAnswered);

    class CScheduler;

    Tint localVariable;

    CShape iShape;

    class CBbc://Acronyms are not usually written in upper case

    ```


    # 1.2 Prefixes


    Member variables are prefixed with a lower case ‘i’, which stands for ‘instance’:


    ```

    Tint iCount;

    CBackground* iBitmap;

    ```


    Parameters are prefixed with a lower case ''a'', which stands for ''argument''.
    We do not use ''an'' for arguments that start with a vowel.


    ```

    void ExampleFunction(TBool aExampleBool, const TDesC& aName);

    ```


    (Note: TBool aExampleBool rather than TBool anExampleBool. Local variables have
    no prefix:


    ```

    Tint localVariable;

    CClass* ptr = NULL;

    ```


    Class names should be prefixed with the letter appropriate to their Symbian OS
    type (usually ‘C’, ‘R’, ‘T’, or ‘M’), as will be described further in Chapter
    3:


    ```

    class Active;

    class TParse;

    class RFS;

    class MCallback;

    ```


    Constants are prefixed with ‘K’:


    ```

    const TInt KMaxFilenameLength = 256;

    #define KMaxFilenameLength 256

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'SYMBIAN OS CODE CONVENTIONS AND NOTATIONS USED IN THE BOOK xxvii


    Enumerations are simple types, and so are prefixed with ''T''. Enumerations are
    prefixed with ''E'':


    ```

    enum TWeekdays {Monday, Tuesday, ...};

    ```


    # 1.3 Suffixes


    A trailing ''L'' on a function name indicates that the function may leave:


    ```

    void AllocL();

    ```


    A trailing ''C'' on a function name indicates that the function returns a pointer
    that has been pushed onto the cleanup stack:


    ```

    Ccylon* NewLC();

    ```


    A trailing ''D'' on a function name means that it will result in the deletion
    of the object referred to by the function:


    ```

    Tint ExecuteLD(Tint aResourceId);

    ```'
  merge: -1
