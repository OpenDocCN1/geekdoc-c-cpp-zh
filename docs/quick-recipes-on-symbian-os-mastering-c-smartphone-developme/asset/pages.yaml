    location server. If the application passes a TPositionCriteria object in RPositioner::Open(),
    the LBS framework:


    +   - chooses the positioning module with the capabilities that best match those
    specified in TPositionCriteriaBase::Capabilities(). The chosen module is used
    to obtain updates for location requests made on the client-server subsection.

    - uses the position accuracy and timeout values specified in TPositionCriteria::PositionQuality()
    when the client makes RPositioner::NotifyPositionUpdate() location requests.


    A client application does not have to supply module selection criteria when it
    calls RPositioner::Open(). If no criteria are specified then set of default criteria
    are used in which horizontal position (latitude and longitude) is the only required
    module capability. The handset manufacturer or Symbian OS licensee may provide
    its own quality profile to be taken by default.


    If no criteria are given, the LBS APIs use default criteria that specify a horizontal
    accuracy of 50 meters, a vertical accuracy of 1,000 meters and a timeout of 30
    seconds. The priority ranks accuracy followed by cost.


    The following sample demonstrates how to deal with various criteria classes in
    order to define certain requirements for positioning module. It is quite simple
    and can be used in conjunction with the recipe, which describes how to get position
    information:


