  md: '# 4.4 Messaging


    The ability to send and receive information in asynchronous forms, such as text
    messaging, multimedia messaging and email, have become a key feature of modern
    mobile phone communications. The ability to communicate with someone via phone
    or computer, without requiring them to be available at the time, has become very
    popular. Growing with this worldwide trend, messaging has evolved to make use
    of the multimedia capabilities of today''s phones, providing users more ways to
    communicate.


    Messaging can be an efficient and cheap form of mobile communication, as it is
    only necessary to connect to the network while a message is actually being transmitted
    or received. This has made it a particularly suitable candidate for relatively
    infrequent (''bursty'') streams of communication, such as traffic updates or automatic
    reporting of medical data.


    Messages are easy to store for future reference, it is a simple task to send a
    message more than once, or more than one recipient, or to schedule the sending
    of a message. Such functionality is so readily available, such as a phone call.


    # 4.4.1 Supported Bearers


    Symbian provides for:


    +   * Short Message Service (SMS), also known as text messaging.

    * Multimedia Message Service (MMS).

    * Post Office Protocol version 3 (POP3) for receiving email.

    * Internet Message Access Protocol version 4 (IMAP4) for receiving email.

    * Simple Mail Transfer Protocol (SMTP) for sending email.


    They all require a connection to an operator''s network, and in the case of email,
    the Internet, when sending or receiving messages.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# MESSAGING


    Symbian provides support for receiving Cell Broadcast and unstructured Supplementary
    Service Data (USSD). There is also a ‘BIO messaging’ component for handling messages
    which are meant to update some device, such as vCards, vCalendars, over-the-air
    configuration messages and Nokia Smart Messages. All of these areas are outside
    the scope of this book.


    Symbian has abstracted the common functionality into a client-server messaging
    subsystem, which exposes a framework API for receiving, sending, creating and
    manipulating messages. The message manager ages access to the different transports
    via a plug-in architecture, as well as the Symbian OS message store.


    In the plug-in architecture, each protocol bearer is represented by a client Message
    Type Module (MTM).


    # 4.4.2 SendAs


    Since it not guaranteed that all bearers will be available on every Symbian phone,
    Symbian provides the SendAs server, which allows applications to dynamically discover
    and choose a message type that is appropriate for their data, based on the transports
    available; the SendAs server will then create and send the message for you.


    The SendAs server is described in more detail in the Sending Messages chapter
    of the Symbian Press book by Ian Campbell, Symbian OS Communications Programming,
    2nd Edition. In these recipes, we show you how to use the message server itself
    to add email, SMS or MMS messaging to your application.


    # 4.4.3 Services


    The purpose of a service is to handle communications, with lower-level components
    such as Telephony and Networking, with an external messaging service provider
    (known as a remote service); for example, sending an SMS to a Short Message Service
    Center (SMSC), or receiving emails from a mailbox on a POP3 server. A remote service
    is frequently associated with a remote store – for instance, the SIM’s SMS store,
    or a user’s email server mailbox. There is also a local service which manages
    operations performed on the phone’s message store itself, such as reading or deleting
    messages.


    # 4.4.4 The Message Store


    # 4.4.4.1 Structure and Main Classes


    In the Symbian OS message store, messages, folders and services are organized
    in a tree structure, as shown in Figure 4.4.1. The tree nodes, or entries, are
    accessible to message server clients through the CMsEntry'
