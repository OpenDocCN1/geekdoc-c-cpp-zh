    # 5.2 Symbian Partners Only


    Several advanced features cannot be properly implemented without becoming a Symbian
    Partner, which will cost you money but gives access to more development resources
    (plus some additional benefits, which are described in Chapter 6, Section 6.3.2).
    The technical paper Symbian development do I need is also a useful place to find
    more information, and is available at www.symbian.com/symbian/whitepapers/whitepaperscasestudies.html.


    # 5.2.1 File Server Plugin-in: Separate File System


    By now, you already know that file operations are centralized in the system''s
    File Server process. Symbian OS allows you to create plug-ins for this file server
    to overwrite default behaviors. This feature is commonly used to protect parts
    of the file system through encryption, in case the handset is lost or stolen,
    could also be useful for RAID duplication or networked storage, and so on.


    As you can imagine, you will require a high level of platform security capability
    to distribute something that is potentially dangerous. Chapter 6 can help you
    with that.


    The first class to look at if you want to develop a file server plug-in is CBaseExtProxy.


    # 5.2.2 Advanced Multimedia: Additional Format Streaming


    As you have seen from the recipes in Section 4.7, your handset has a widely range
    of multimedia functionality. You can probably play and record both audio and video.
    Just as importantly, the media data you want to access doesn''t need to be on
    your phone, since the media framework is able to use a simple URL as input and
    play what it points to pretty much just as if it were on your phone – as long
    as you have the right to access it.'
