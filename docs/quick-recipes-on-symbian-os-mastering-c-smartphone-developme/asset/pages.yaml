  md: '# HOW TO DISTRIBUTE YOUR APPLICATION


    and then download it (by the network operator). However, a number of network operators
    lock down their phones against what they call ‘loading’, which means that applications
    cannot be installed except direct download to the phone. The lock down ensures
    that the operator retains some profit from application installation, even when
    it is not purchased from one of their portals. Some network operators go further
    and prevent the phones they distribute from making purchases except from their
    portals.


    The downside of OTI purchasing, if it is allowed by a network operator, is that
    the user must own, or have access to, a PC, and must know how to connect the phone
    to the PC to transfer the downloaded application and install it.


    Purchasing from the web also requires electronic payment, for example using a
    credit card, rather than direct billing from the network operator. Not everyone
    has this option, especially when the target market for some applications, as games,
    may be under the age of credit ownership. The channels work around this through
    the use of gift certificates or vouchers.


    Of course, you can consider setting up your own independent sales channel; that
    is, selling your application through your own website. This has the advantage
    that you don''t have to give away any royalties, and can decide how to market
    your application, and what testing and certification it requires. However, you
    will need to work hard to achieve visibility in the marketplace, and you will
    need to determine how to manage the incoming payments – and any support requests
    that come in when they fail, or the user claims dissatisfaction with the application
    and wants a refund. Selling through a channel or operator shields you from these
    issues, to some extent.


    Some manufacturers also provide sales channels, such as the Nokia Software Market.
    These are a way for manufacturers to make software available and encourage the
    uptake of their handsets. Rather than decide themselves what these sites provide,
    the channels often use the services of a content aggregator, such as Jamba (also
    known as Jamster in English-speaking regions) or Handango (which is content aggregator
    in its own right, as well as an independent channel), to put together the offered
    content. We will discuss content aggregators in more detail in Section 6.2.3.


    The Nokia Software Market is available for users to buy applications (and other
    applications) OTI (www.softwaremarket.nokia.com) or directly on the phone using
    an application called Nokia Catalogs. The Catalogs application is a client on
    the Nokia Content Discoverer system and is available for S60 smartphones. The
    application allows delivery of graphics, themes and ring tones, Java ME applications,
    native Symbian OS applications, videos, music and content developed using Flash
    technology.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'Independent channels are usually the preferred route to market for application
    developers working alone or in small companies, because it is easier to place
    an application for sale with the channel to forge a relationship with a network
    operator or content aggregator. The channel will take a percentage of each sale
    of the application, but this is typically less than a network operator or aggregator,
    and the channel will allow developers to set the price of the application themselves.
    For example, the Nokia Software Market takes 40% of the sales price by the developer,
    with revenue paid every quarter. For more information about working with the Nokia
    Software Market and Catalogs application, please see www.forum.nokia.com/main/software_market/index.html
    or consult the Nokia Sales section on the main Forum Nokia developer site at www.forum.nokia.com.


    # 6.2.3 Content Aggregators


    Content aggregators are specialists at gathering content, as mobile applications,
    video, and ring tones. The content is acquired from suppliers as games publishers
    or independent channels, and distributed by the aggregators to sales channels.
    Content aggregators provide an easy way for businesses to source downloadable
    material without having to seek out and build a relationship with each supplier.
    An example of a aggregator is Jamba, which is one of the largest channels for
    mobile content and applications. Jamba also distributes content and applications
    via the Nokia Catalogs on Nokia devices, as described in the previous section.
    Forum Nokia publishes a comprehensive list of mobile content aggregators at www.forum.nokia.com/main/go_to_market/aggregators.


    # 6.2.4 Pre-Installed Applications


    One way to distribute your application to users while avoiding the complicated
    relationship between publishers and network operators is to get the application
    built onto a phone handset by the manufacturer (or provided on a CD ROM in the
    box that contains the handset). Naturally, there are far fewer opportunities for
    built-in applications than there are developers who wish to get their application
    preinstalled on a phone! The market exposure of an embedded application is an
    excellent opportunity; however, it is not without its problems. Trying to ship
    an application on a handset that is not released means the developer is often
    working with pre-commercial firmware and hardware. Final versions of hardware
    may become available just before the deadline for embedded software, resulting
    in uncomfortable ''crunch'' periods.'
  merge: -1
  pgno: 373
