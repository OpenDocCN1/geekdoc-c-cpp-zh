  md: "```\n// Primary template: assumes types are different\ntemplate<typename T,\
    \ typename U>\nstruct is_same {\n    static constexpr bool value = false;\n};\n\
    \n// Specialization: when both types are the same\ntemplate<typename T>\nstruct\
    \ is_same<T, T> {\n    static constexpr bool value = true;\n};\n\n// Convenient\
    \ variable template for easier usage\ntemplate<typename T, typename U>\ninline\
    \ constexpr bool is_same_v = is_same<T, U>::value;\n```\n\n# # How This Works\n\
    \n+   - The primary template defines a value member as false. It means \"by default,\
    \ two types are not the same.\"\n- The specialization kicks in when both template\
    \ parameters are the same type. In that case, value is true.\n- The variable template\
    \ is_same_v lets you write cleaner code without typing ::.\n\n# ## is_same\n\n\
    ```\nstatic_assert(is_same_v<int, int>, \"int and int should be the same\");\n\
    static_assert(is_same_v<int, float>, \"int and float should be different\");\n\
    ```\n\nThis lets you enforce constraints or branch behavior at compile time\n\n\
    ```\ntemplate<typename T>\nvoid foo() {\n    if constexpr (is_same_v<T, int>)\
    \ {\n        // Specialized behavior for int\n    } else {\n        // General\
    \ behavior\n    }\n}\n```\n\nThis pattern powers many template-based decisions\
    \ and is foundational for compile-time type introspection."
