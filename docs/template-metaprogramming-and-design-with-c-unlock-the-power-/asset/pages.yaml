  md: 'But what if you want:


    +   - A smart pointer that performs custom locking before accessing the object.

    - A smart pointer that logs each access or deletion for debugging.

    - Custom deletion strategies (e.g., returning objects to a pool instead of deleting).

    - Thread-safe or non-thread-safe reference counting.

    - -on-write semantics or other advanced ownership models.


    Policy-based design lets you compose these behaviors cleanly and efficiently.


    # Step 1: Understanding Policy-Based Design


    At its core, policy-based design is a way to separate what varies from what stays
    the same. In your smart pointer, policies will govern:


    +   - Ownership policy: How ownership is managed (unique, shared, no ownership).

    - Storage policy: How the pointer is stored and accessed.

    - Checking policy: How to handle invalid pointer accesses.

    - Deletion policy: How the object is destroyed.

    - Threading policy: How to synchronize access if needed.


    Each policy is a class or class template that implements a specific interface.
    The smart pointer composes these policies as template parameters.


    # Step 2: Defining the Smart Pointer Skeleton


    We start with a template class accepting policies as parameters:


    cpp


    ```

    template <

    type T,

    t OwnershipPolicy,

    type CheckingPolicy,

    type DeletionPolicy

    ```'
