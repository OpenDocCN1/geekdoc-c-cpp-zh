    \n```\ncpp\ntemplate <typename T>\nvoid foot(T value) {\n    if constexpr(requires\
    \ { value == value; }) {\n        // Use operator==\n    } else {\n        //\
    \ Fallback\n    }\n}\n```\n\nThe first two ways enforce constraints at template\
    \ substitution time — if the type doesn't satisfy the concept, the template is\
    \ not considered.\n\n# Standard Concepts in the Library\n\nC++20 comes with many\
    \ defined concepts in the <concepts> header, such as:\n\n+   - std::integral<T>\
    \ — checks if T is an integral type.\n- std::floating_point<T> — checks if T is\
    \ a floating-point type.\n- std::same_as<T, U> — checks if T and U are the same\
    \ type.\n- std::derived_from<F, U> — checks if F is derived from U.\n- std::invocable<F,\
    \ Args...> — checks if F can be called with Args...\n- std::sortable<It> — checks\
    \ if an iterator type supports sorting.\n\nThese make it easy to write constrained\
    \ templates without reinventing the wheel.\n\n# Example: Constraining a Sort Function\n\
    \nHere's how concepts make a generic sorting function safer and clearer:\n\n```\n\
    cpp\n#include <concepts>\n#include <vector>\n#include <algorithm>\n\ntemplate\
    \ <typename T>\nconcept LessThanComparable = requires(T a, T b) {\n    { a < b\
    \ } -> std::convertible_to<bool>;\n};\n```"
