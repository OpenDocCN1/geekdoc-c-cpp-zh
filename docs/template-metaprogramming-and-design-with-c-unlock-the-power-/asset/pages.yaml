    If the function parameters are references or const-qualified, type deduction takes
    those qualifiers into account but strips them when deducing the type parameter
    itself.


    cpp


    ```

    template<typename T>

    void func(const T& param);

    int x = 5;

    func(x); // T deduced as int, even though param is const int&

    ```


