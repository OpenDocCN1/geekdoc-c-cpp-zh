    # 13.1 When to Use Template Metaprogramming in C++ (and When to Avoid It)


    Template metaprogramming (TMP) in C++ is one of features that can feel like a
    solid double-edged sword. On one hand, it unlocks capabilities that let you write
    highly generic, efficient, and type-safe code. On the other, it can lead to code
    that''s hard to read, maintain, and debug if used without care. Having a solid
    sense of when to employ TMP—and when to avoid it—is crucial for any C++ programmer
    aspiring to write clean, maintainable, and performant software.


    Let''s begin by understanding the fundamental motivation for template metaprogramming.
    C++ templates originally appeared as a way to achieve generic programming: writing
    algorithms and data structures that work with any type. This was a significant
    leap forward compared to languages that required you to duplicate code for each
    type. Over time, template techniques evolved to allow computation at compile time,
    optimizations and design patterns otherwise impossible or inefficient at runtime.
    This extension into “metaprogramming” means templates can behave like a tiny programming
    language interpreted by the compiler before the program runs ever.


