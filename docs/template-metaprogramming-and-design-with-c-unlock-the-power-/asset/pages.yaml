  md: "SFINE solves this by allowing the compiler to silently reject templates that\
    \ do not meet certain criteria during substitution, enabling you to write multiple\
    \ template overloads or specializations that participate in overload resolution\
    \ only if their requirements are met.\n\n# How Does SFINE Work in Detail?\n\n\
    The key phrase is **immediate context of template argument substitution.** This\
    \ context refers to the part of the template where the compiler substitutes parameters\
    \ to form types or expressions that make the template is valid.\n\nFor example,\
    \ consider this pattern:\n\ncpp\n\n```\ntemplate<typename T, typename=std::void_t>\n\
    struct is_addable : std::false_type {};\n```\n\n```\ntemplate<typename T>\nstruct\
    \ is_addable<T, std::void_t<decltype(std::declval<T>()+std::declval<T>())>> :\
    \ std::true_type {};\n```\n\nHere's what happens step-by-step:\n\n+   1. The primary\
    \ template `is_addable` takes type T and a default second template parameter (`typename=std::void_t<>`).\
    \ It inherits from `std::false_type`, meaning that unless specialized, it is not\
    \ addable.\n\n+   2. The partial specialization attempts to substitute `std::void_t<decltype(std::declval<T>()+std::declval<T>())>`\
    \ for the second template parameter. This forms the expression `T + T`.\n\n+ \
    \  3. If this is successful—meaning T supports the `+` operator—then the specialization\
    \ is chosen, inheriting from `std::true_type`.\n\n+   4. If the substitution fails\
    \ (because `T + T` is invalid), the compiler discards this specialization from\
    \ overload resolution and falls back to the primary template, which indicates\
    \ `false`.\n\nThe crucial detail is that the failure to form `decltype(std::declval<T>()+std::declval<T>())`\
    \ is **not** an error that stops compilation. Instead, it triggers SFINE, and\
    \ the compiler quietly ignores it\n\n# SFINE In Function Templates\n\nSFINE is\
    \ often used to enable or disable function templates based on type traits. This\
    \ is typically done with `std::enable_if` or similar utilities.\n\ncpp\n\n```\n\
    #include <type_traits>\n#include <iostream>\n\n// Enable this overload only if\
    \ T supports addition.\ntemplate<typename T>\nstd::enable_if_t<std::is_arithmetic_v<T>,\
    \ T> add(T a, T b) {\n    return a + b;\n}\n\n// Fallback if T does not support\
    \ addition.\ntemplate<typename T>\nstd::enable_if_t<!std::is_arithmetic_v<T>,\
    \ void> add(T a, T b) {\n    // do-op or error message\n}\n```"
