  md: 'When writing libraries or components that others will use, especially when
    compiled separately, consider the implications of templates on ABI (Application
    Binary Interface) stability.


    Templates are instantiated at compile time, which often means that changes in
    template parameters or implementation can cause recompilation of dependent code.
    To future-proof your library''s interface:


    +   - Minimize template exposure in public headers when possible.

    - Use explicit template instantiations to control where templates are compiled.

    - Consider pimpl idiom or type erasure to hide template-heavy implementations
    behind stable, non-templated interfaces.


    This approach reduces the ripple effect of changes and helps maintain compatibility
    across versions.


    **Avoid Over-Optimization: Prioritize Clarity and Flexibility**

    It''s tempting to optimize every line of code to eke out maximum performance,
    but premature optimization can make your code brittle. Often, the fastest way
    to future-proof your code is to prioritize clarity, maintainability, and flexibility
    first.


    Write clean, well-abstracted template code using modern C++ features, and profile
    your application to find real bottlenecks. Then selectively apply TMP optimizations
    in those critical areas.


    This strategy avoids cluttering your codebase with overly complex TMP that''s
    hard to maintain or extend.


    **Continuously Refactor and Modernize Template Code**nThe C++ language is evolving
    rapidly. Features like concepts, consteval, and improved constexpr support open
    new doors to cleaner, safer template programming.


    To keep your code future-proof, commit to regularly revisiting and modernizing
    your template code. Replace older SFINAE hacks with concepts; swap recursive template
    metaprogramming for constexpr functions; clarify interfaces as your understanding
    improves.


    This ongoing maintenance helps your code stay compatible with the latest compilers
    and coding standards, reducing technical debt.'
