  md: "Concepts are expressed using the concept keyword, and you can use them to constrain\
    \ template parameters.\n\n# Basic Syntax of Concepts\n\nHere's a simple concept\
    \ that requires a type to be equality comparable:\n\n```\n#include <concepts>\n\
    template <typename T>\nconcept EqualityComparable = requires(T a, T b) {\n  {\
    \ a == b } -> std::convertible_to<bool>;\n  { a != b } -> std::convertible_to<bool>;\n\
    };\n```\n\n+   - requires introduces a requires-expression, which checks if expressions\
    \ are valid for the type T.\n- The arrows -> specify the expected return type;\
    \ here, bool or something convertible to bool.\n\nNow, you can constrain a template:\n\
    \n```\ntemplate <EqualityComparable T>\nbool areEqual(const T& a, const T& b)\
    \ {\n  return a == b;\n}\n```\n\nThis function will only compile if T satisfies\
    \ the EqualityComparable concept.\n\n# Using Concepts to Constrain Templates\n\
    \nYou can constrain templates in three common ways:\n\n+   1. Constrained template\
    \ parameters:\n\n```\ntemplate <EqualityComparable T>\nvoid foo(T value);\n```\n\
    \n+   2. Trailing requires clause:\n\n```\ntemplate <typename T>\nvoid foo(T value)\
    \ requires EqualityComparable<T>;\n```"
  merge: -1
