  md: '# # Cheat Sheet: Template Metaprogramming (TMP) Best Practices Checklist


    This checklist helps you write clean, maintainable, and efficient TMP code by
    following best practices. Use it as a quick reference to review your code or guide
    new template designs.


    # ##1. Use Concepts to Constrain Templates


    +   - Express template parameter requirements explicitly with concepts (std::integral,
    std::same_as, custom concepts)

    - Prefer concepts over SFINAE (std::enable_if) for clearer intent and better error
    messages.

    - Use requires clauses to separate constraints from implementation.


    # ##2. Prefer constexpr and consteval Over Recursive Template Metaprogramming


    +   - Use constexpr functions for compile-time computations when possible.

    - Reserve recursive template specializations for type-level computations or when
    constexpr is insufficient.

    - Mark small, pure functions as constexpr to enable compile-time evaluation.


    # ##3. Keep Template Interfaces Simple and Focused


    +   - Avoid over-generalizing templates to handle too many variations.'
  merge: -1
  pgno: 465
- img_proc: true
  md: '+   - Design small, composable templates rather than monolithic, feature-heavy
    ones.


    +   - Use meaningful names for template parameters to clarify their roles.


    # 4. Use Static Assertions to Improve Diagnostics


    +   - Add static_assert with descriptive messages inside templates to catch misuse
    early.


    +   - Use assertions to document assumptions and constraints that can''t be expressed
    as concepts.


    # 5. Minimize Template Instantiations


    +   - Avoid unnecessary or redundant template instantiations to reduce compile
    times.


    +   - Use explicit template instantiation declarations where appropriate.


    +   - Consider type erasure or the pimpl idiom to hide template-heavy details
    in large projects.


    # 6. Document Template Requirements Thoroughly


    +   - Clearly document what types or properties templates expect from parameters.


    +   - Provide usage examples to aid understanding.


    +   - Comment complex TMP logic to explain why as well as how.'
