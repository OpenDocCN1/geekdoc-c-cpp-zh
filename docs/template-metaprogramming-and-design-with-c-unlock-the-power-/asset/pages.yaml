    \ bool is_divisible(int n, int divisor) {\n    return (n % divisor == 0);\n}\n\
    \n// Recursive compile-time function to check for any divisor in [2, limit]\n\
    constexpr bool has_divisor(int n, int divisor, int limit) {\n    if (divisor >\
    \ limit) {\n        return false; // No divisor found, n is prime\n    }\n   \
    \ if (is_divisible(n, divisor)) {\n        return true; // Div found, n is not\
    \ prime\n    }\n    return has_divisor(n, divisor + 1, limit);\n}\n\n// Compile-time\
    \ prime checker\nconstexpr bool is_prime(int n) {\n    if (n <= 1) {\n       \
    \ return false; // 0 and 1 are not prime\n    }\n    if (n == 2) {\n        return\
    \ true; // 2 is prime\n    }\n    // Check divisors up to sqrt(n)\n    int limit\
    \ = static_cast<int>(std::sqrt(n));\n    return has_divisor(n, 2, limit);\n}\n\
    \nint main() {\n    constexpr int num = 29;\n    static_assert(is_prime(num),\
    \ \"Number is not prime!\");\n    std::cout << num << \" is \" << is_prime(num)\
    \ ? \"prime\" : \"not prime\" << \"\n\";\n\n    // Test other numbers\n    constexpr\
