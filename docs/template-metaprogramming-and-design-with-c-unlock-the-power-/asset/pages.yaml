  md: "# The Building Blocks: Template Specialization and SFINAE\n\nThe core technique\
    \ behind most custom traits is template specialization, often combined with SFINAE\
    \ (Substitution Failure Is Not An Error). SFINAE is the compiler's way of silently\
    \ discarding template instantiations by overload resolution. This allows you to\
    \ detect whether certain expressions or types are valid for a given template parameter.\n\
    \nLet's begin with a simple example: writing a trait that checks if a type is\
    \ a pointer.\n\nOf course, this is already provided by std::is_pointer, but writing\
    \ it yourself is a great way to understand how traits works.\n\n```\n// Primary\
    \ template: default case - not a pointer\ntemplate<typename T>\nstruct is_pointer_custom\
    \ : std::false_type {};\n\n// Specialization: when T is a pointer\ntemplate<typename\
    \ T>\nstruct is_pointer_custom<T*> : std::true_type {};\n```\n\nHere, is_pointer_custom\
    \ inherits from std::false_type by default, meaning the trait's value member is\
    \ false. When the compiler encounters a type T*, it matches the specialized template\
    \ and inherits from std::true_type, setting value to true.\n\nYou can test it\
    \ like:\n\n# cpp\n\n```\n#include <iostream>\nint main() {\n    std::cout << \"\
    int is pointer?\" << is_pointer_custom<int>::value << '\\\n'; // false\n    std::cout\
    \ << \"int* is pointer?\" << is_pointer_custom<int*>::value << '\\\n'; // true\n\
    }\n```\n\nThis example demonstrates a fundamental pattern: providing a primary\
    \ template for the default case, and specializations for cases where the trait\
    \ should yield true. This pattern works well when your trait depends on the structure\
    \ of the type itself (like pointer, reference, array types)."
