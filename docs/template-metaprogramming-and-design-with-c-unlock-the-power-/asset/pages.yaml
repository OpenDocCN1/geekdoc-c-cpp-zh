    Here, T can deduce reference types, allowing perfect forwarding, an essential
    technique in modern C++.


    # When You Need to Specify Template Arguments Explicitly


    Sometimes, type deduction cannot figure out your intent, especially with complex
    types or multiple template parameters. In those cases, you can specify template
    arguments explicitly:


    ```

    max<double>(3, 4, 5); // Forces T to be double

    ```


    Explicit specification overrides deduction and is useful when the compiler''s
    guess isn''t what you want.


