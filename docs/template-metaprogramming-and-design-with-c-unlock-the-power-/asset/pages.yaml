  md: "# Variadic Template Syntax\n\nThe basic syntax introduces a parameter pack\
    \ using the ellipsis (...). For template parameters, it looks like this:\n\ncpp\n\
    \n```\ntemplate <typename... Args>\nvoid func(Args... args);\n```\n\nHere, Args...\
    \ is a template parameter pack representing zero or more types. Correspondingly,\
    \ args... is a function parameter pack representing the function's arguments.\n\
    \nYou can also have multiple template parameter packs, but that's less common\
    \ and comes with complex rules.\n\n# Expanding Parameter Packs\n\nSince a parameter\
    \ pack can hold any number of parameters, you need a way to expand it when using\
    \ the parameters. The syntax is to put ... after the pack in an expression:\n\n\
    cpp\n\n```\ntemplate <typename... Args>\nvoid printAll(const Args&... args) {\n\
    \  (std::cout << ... << args) << '\\n'; // Fold expression (C++17)\n}\n```\n\n\
    Here the fold expression (std::cout << << << args) expands to a chain of output\
    \ operations:\n\ncpp\n\n```\nstd::cout << arg1 << arg2 << arg3 << ... ;\n```\n\
    \nIf you had three arguments, it's equivalent to:\n\ncpp\n\n```\nstd::cout <<\
    \ arg1 << arg2 << arg3;\n```\n\n# Recursive Expansion Before Fold Expressions\n\
    \nBefore fold expressions (introduced in C++17), variadic templates were typically\
    \ expanded recursively:\n\ncpp\n\n```\n#include <iostream>\n```"
  merge: -1
  pgno: 534
- img_proc: true
  md: "```\nvoid print() {\n    std::cout << '\\n';\n}\n\ntemplate <typename T, typename...\
    \ Rest>\nvoid print(T first, Rest... rest) {\n    std::cout << first << ' '';\n\
    \    print(rest...);\n}\n\nint main() {\n    print(1, 2, 3, \"hello\");\n}\n```\n\
    \nThe base case print() handles when no arguments remain. Each recursive call\
    \ prints one argument and passes the rest along, ultimately printing all arguments.\\\
    \ While effective, recursive expansion is more verbose and can be less efficient\
    \ due to multiple function calls.\n\n# Fold Expressions: A Clean Way to “Fold”\
    \ Parameter Packs\n\nFold expressions simplify this by allowing you to write a\
    \ single expression that folds a binary operator over all elements in a parameter\
    \ pack. There are four forms of fold expressions:\n\n+   - Unary right fold: (pack\
    \ op ...)\n- Unary left fold: (... op pack)\n- Binary right fold: (init op ...\
    \ pack)\n- Binary left fold: (pack op ... init)\n\nHere, op is a binary operator\
    \ like +, &&, ||, , (comma), <<, etc. For example, summing all arguments:\n\n\
    cpp\n\n```\ntemplate <typename... Args>\nauto sum(Args... args) {\n    return\
    \ (args + ...); // Unary right fold\n}\n\nint main() {\n    std::cout << sum(1,\
    \ 2, 3, 4) << '\\n'; // Outputs 10\n}\n```"
  merge: -1
