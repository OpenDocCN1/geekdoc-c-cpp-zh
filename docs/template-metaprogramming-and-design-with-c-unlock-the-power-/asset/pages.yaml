    # ## 11.1 Concepts, Ranges, and Coroutines in Template Programming


    C++ has long been known for its powerful template system, enabling programmers
    to write highly generic and reusable code. But with great power often comes great
    complexity. Template metaprogramming, while versatile, traditionally suffered
    from cryptic error messages, verbose syntax, and subtle bugs arising from unclear
    template parameter requirements. With the arrival of C++20 and C++23, three major
    language features—Concepts, Ranges, and Coroutines—have revolutionized how we
    approach template metaprogramming. These features bring clarity, composability,
    and expressiveness, making templates more accessible and practical in everyday
    programming.


    Let''s embark on a detailed exploration of these features, focusing on how they
    reshape template metaprogramming in modern C++.


    **Concepts: Making Template Requirements Explicit and Understandable**


    Before concepts, templates relied heavily on implicit assumptions. When you wrote
    a template, you might expect the parameter types to support certain operations—like
    addition, comparison, or streaming to std::cout—but there was no formal way to
    express those requirements. Instead, the compiler would try to instantiate the
    template, and if the type didn''t meet the expected interface, you''d get a cascade
    of bewildering error messages deep inside the compiler internals.


    Concepts change this landscape by allowing you to **declare explicit constraints**
    on template parameters. They represent named predicates that a type must satisfy
    to be used in a given template. This means that your template''s expectations
    are documented in code, and violations are caught **early** in compilation, with
    clear and concise diagnostics.


    Imagine you want to write a generic function to calculate the average of elements
    in a container. Traditionally, you''d write something like this:


