  md: "```\nstruct enable_if {\n\ntemplate<typename T>\nstruct enable_if<bool b, T>\
    \ { using type = T; };\n```\n\nWhen the boolean condition b is true, enable_if\
    \ defines a member alias type equal to T\n(default to void). When b is false,\
    \ type does not exist, causing substitution failure if you try to\nuse it, which\
    \ triggers SFINAE.\n\n# How Does std::enable_if Work in Practice?\n\nThe usual\
    \ use of std::enable_if is in the return type or a template parameter of a function\n\
    template. This pattern allows the compiler to selectively include or exclude function\
    \ templates\nfrom overload resolution.\n\nHere's a simple example to illustrate\
    \ this:\n\n```\n#include <type_traits>\n#include <iostream>\n\n// This function\
    \ only works if T is an integer.\ntemplate<typename T>\nstd::enable_if<std::is_integral<T>,\
    \ void>::type print_info(T v) {\n    std::cout << \"Integral type:\";\n}\n\n//\
    \ This function only works if T is a floating point type.\ntemplate<typename T>\n\
    std::enable_if<std::is_floating_point<T>, void>::type print_info(T v) {\n    std::cout\
    \ << \"Floating point type:\";\n}\n\nint main() {\n    print_info(42);\n    print_info(3.14);\n\
    }\n```\n\nIn these two examples, print_info overloads are defined. Each overload\
    \ is enabled only if the\ntemplate parameter satisfies a particular trait: integral\
    \ or floating point. The use of std::enable_if_t\n(which is a shorthand for template\
    \ std::enable_if<...>::type) in the return type ensures that if the\ncondition\
    \ is false, substitution fails, and that is removed from consideration.\n\n# Using\
    \ std::enable_if in Template Parameters\n\nSometimes you dont to put enable_if\
    \ in the return type, especially if you want to avoid\nafecting function signatures\
    \ or constrain class templates. Instead, you can use\nstd::enable_if as an additional\
