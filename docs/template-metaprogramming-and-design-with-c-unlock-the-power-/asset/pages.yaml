  md: "The keyword const is one of the most familiar in C++. At its core, const means\
    \ “this value will not change.” When you declare something as const, you are telling\
    \ the compiler and future readers of your code that this variable or object is\
    \ immutable after initialization.\n\nFor example:\n\n# cpp\n\n```\nconst int maxUsers\
    \ = 100;\n```\n\nHere, maxUsers is an integer whose value cannot be modified anywhere\
    \ in the program after it’s initialized. This is useful because it prevents accidental\
    \ changes and communicates intent clearly. Remember that const applies to the\
    \ object it qualifies. If you write const int ptr*, it means the integer pointed\
    \ to is constant, but the pointer itself can change. Conversely, int* const ptr\
    \ means the pointer is constant, but the integer it points to can change.\n\n\
    In everyday programming, const is your friend for writing safer code. It helps\
    \ enforce invariants, protects against bugs, and can sometimes give the compiler\
    \ hints for optimization. However, const does not guarantee that the value is\
    \ known at compile time—it simply means the value won’t change once set.\n\n#\
    \ Diving into constexpr\n\nThe keyword constexpr took off with C++11 and has grown\
    \ increasingly powerful through C++14, C++17, and C++20. constexpr means “this\
    \ value or function can be evaluated at compile time.” It’s a promise that the\
    \ compiler can produce a constant expression from this variable or function if\
    \ all inputs are known during compilation.\n\nConsider this example:\n\n# cpp\n\
    \n```\nconstexpr int square(int x) {\n    return x * x;\n}\nconstexpr int nine\
    \ = square(3);\n```"
