  md: "confusing compiler errors or hard-to-debug issues when types don’t behave\n\
    as expected.\n\nEnter Concepts, introduced in C++20. Concepts provide a way to\
    \ express\nrequirements on template parameters explicitly and clearly. They let\n\
    you specify constraints that types must satisfy for your template to compile.\n\
    This makes your code safer, clearer, and easier to maintain.\n\n# The Problem\
    \ Before Concepts\n\nBefore concepts, template code often relied on duck typing\
    \ — the idea that\nif a type “quacks like a duck,” it’s good enough. You could\
    \ write a template\nthat assumes a type has certain functions or operators, and\
    \ the compiler\nwould try to instantiate it. If T didn’t meet those assumptions,\
    \ you’d get a\ncascade of cryptic errors deep inside template code.\n\nFor example:\n\
    \n```\ntemplate<typename T>\nvoid print(const T& value) {\n    std::cout << value\
    \ << '\\n'; // Assumes operator<< exists for T\n}\n```\n\nIf T doesn’t support\
    \ operator<<, you get a long error message that’s hard to\ndipher. There was no\
    \ way to clearly say, “This function requires T to be\nstreamable.”\n\n# What\
    \ Are Concepts?\n\nConcepts are compile-time predicates — conditions that types\
    \ must satisfy\nto be valid template arguments.\n\nThey let you write:\n\n+  \
    \ - Readable constraints that say exactly what properties of a type must have.\n\
    - Cleaner error messages because the compiler can check constraints before trying\
    \ to instantiate the full template.\n- Overload resolution based on concepts to\
    \ select the most appropriate template."
