    \ beyond.\n\n# Basic Examples of Fold Expressions\n\nLet's start with a simple\
    \ example that sums a pack of numbers.\n\n# cpp\n\n```\ntemplate <typename...\
    \ Args>\nauto sum(Args... args) {\n    return (args + ...); // unary right fold\n\
