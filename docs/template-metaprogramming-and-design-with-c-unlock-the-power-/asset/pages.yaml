    +   - SFINAE: Substitution failure during template instantiation is not an error;
    the compiler excludes invalid overloads silently.


    +   - std::enable_if: A conditionally defined type used to enable or disable templates.


    +   - std::void_t: Utility to detect well-formed types or expressions for SFINAE.


    +   - Concepts: Compile-time predicates that constrain template parameters explicitly
    (C++20).


    +   - concept keyword: Used to define concepts.


    +   - requires clause: Used to apply constraints on template parameters.


    +   - constexpr: Compile-time conditional statements (C++17) often used with SFINAE
    and concepts.


    # 15.4 Variadic Templates and Fold Expressions in Modern C++


    One of the most transformative additions to C++ template programming in the last
    decade has been the introduction of **variadic templates** and **fold expressions**.
    Together, they enable writing flexible, concise, and powerful generic code that
    can handle **any number** of template parameters or function arguments, something
    that was awkward or impossible before C++11 and C++17.


    # The Challenge Variadic Templates Solve


    Before C++11, if you wanted to write a function or class template that accepted
    an arbitrary number of parameters, you had to resort to hacks like recursive inheritance,
    macros, or manually overloaded functions for different argument counts. This was
    cumbersome, error-prone, and scalable.


    Variadic templates allow template parameter packs — essentially a **pack** or
    **list** of zero or more template parameters — enabling your templates to accept
    and operate on **any number** of types at compile time.'
