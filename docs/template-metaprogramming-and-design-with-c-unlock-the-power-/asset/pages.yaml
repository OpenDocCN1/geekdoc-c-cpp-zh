    At its core, a fold expression **folds** a binary operator over all elements of
    a parameter pack. Think of it like a “reduce” or “accumulate” operation in functional
    programming, but done at compile time.


    Instead of writing recursive template code to process each argument by one, a
    fold expression lets you write a single expression that applies an operator between
    all arguments in the pack.'
