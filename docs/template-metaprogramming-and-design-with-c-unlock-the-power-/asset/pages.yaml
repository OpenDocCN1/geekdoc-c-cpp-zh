    This technique is simple and effective for traits that depend on the shape or
    form of a type.


    # Detection with SFINAE and std::void_t


    While specialization is excellent for structural checks, many important questions
    involve the capabilities of a type — for example, does a type have a member function
    or support a particular expression? This is where SFINAE shines.


    SFINAE stands for Substitution Failure Is Not An Error. During template substitution,
    if the compiler encounters an ill-formed expression, it silently discards template
    overload or specialization and tries others without causing a compilation failure.


    To make SFINAE easier, C++17 introduced std::void_t, which simplifies writing
    detection traits.


    Let''s see how to detect if a type T has a member function size().


    # cpp


    ```

    #include <type_traits>

    #include <utility>


    // Primary template: no(size()) member detected

    template<typename, typename=std::void_t<>>

    struct has : std::false_type {};


    // Specialization: valid if expression T().size() is well-formed

    template<typename T>

    struct has<T, std::void_t<decltype(std::declval<T>().size())>> : std::true_type
    {};

    ```


    How does this work?


    +   - The primary template matches any type, defaulting to false.

    - The specialization is enabled only if the expression std::declval<T>().size()
    is valid. Here, it gives you an value of type T without needing to construct it.

    - If the expression is well-formed, substitution succeeds, and the specialization
    applies, setting value to true.'
