  md: "# Enter Expression Templates: The Metaprogramming Magic\n\nExpression templates\
    \ are the clever solution that libraries like Eigen and Blaze use to overcome\
    \ this inefficiency. The core idea is deceptively simple: rather than performing\
    \ computations immediately, the library represents mathematical expressions as\
    \ types—a compile-time description of the operations to be performed. These form\
    \ an expression tree that is analyzed and optimized by the compiler.\n\nIn other\
    \ words, writing C = A + B + D; does not immediately perform any additions. Instead,\
    \ it constructs a template type that represents the entire sum. When the assignment\
    \ to C happens, the library generates code that loops over elements of A, B, and\
    \ D simultaneously, adding them in a single pass. This technique eliminates the\
    \ creation of temporary objects, significantly improving performance.\n\nConsider\
    \ this simplified example by Eigen's approach:\n\n```\ntemplate <typename L, typename\
    \ R>\nstruct AddExpr {\n    const L& lhs;\n    const R& rhs;\n    AddExpr(const\
    \ L& l, const R& r) : lhs(l), rhs(r) {}\n    auto operator[](std::size_t i) const\
    \ {\n        return lhs[i] + rhs[i];\n    }\n    std::size_t size() const {\n\
    \        return lhs.size();\n    }\n};\n\ntemplate <typename T>\nclass Vector\
