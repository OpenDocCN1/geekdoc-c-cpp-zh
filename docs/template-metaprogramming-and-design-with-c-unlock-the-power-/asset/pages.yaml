    \ constraint in the function signature in a somewhat awkward way. If you want\
    \ to check multiple conditions, the code quickly becomes unwieldy.\n\nConcepts,\
    \ on the other hand, allow you to state constraints clearly and concisely:\n\n\
    ```\ncpp\ntemplate<std::integral T>\nprocess(T value) (\n```"
