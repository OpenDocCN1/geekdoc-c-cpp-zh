    ```


    But you could not use it in a constexpr context, such as within a constexpr function
    or for compile-time evaluation.


    C++17 introduced the ability for lambdas to be implicitly constexpr. This means
    that if your lambda body does not do anything disallowed in a constant expression—like
    modifying non-constexpr variables or performing runtime-only operations—the compiler
    will treat its call as constexpr.


    In C++20 and beyond, this feature is refined and widely supported, allowing you
    to write constexpr lambdas that can be invoked during compilation, enabling powerful
    compile-time calculations without verbose template metaprogramming or separate
    functor classes.


