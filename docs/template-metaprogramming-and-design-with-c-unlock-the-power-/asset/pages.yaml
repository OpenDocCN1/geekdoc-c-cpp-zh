  md: "# Concepts and Constraints (C++20)\n\nTemplates are powerful but historically\
    \ suffered from cryptic compiler errors when you misuse types. C++20 introduced\
    \ concepts to improve this by allowing you to specify constraints on template\
    \ parameters explicitly. A concept is a compile-time predicate that checks if\
    \ a type meets certain requirements.\n\n# cpp\n\n```\ntemplate <typename T>\n\
    concept Incrementable = requires(T x) {\n    ++x } -> std::same_as<T>;\n};\n\n\
    template <Incrementable T>\nvoid increment(T& value) {\n    ++value;\n}\n```\n\
    \nThe Incrementable concept requires the type T to support prefix increment. The\
    \ template increment is now constrained; it only accepts types satisfying Incremental.\
    \ If you try to call increment with an incompatible type, the compiler provides\
    \ a clear, early error.\nYou also write constraints inline:\n\n# cpp\n\n```\n\
    template <typename T>\nrequires std::integral<T>\nT add(T a, T b) {\n    return\
    \ a + b;\n}\n```\n\nstd::integral is a standard library concept that requires\
    \ T to be an integral type.\nConcepts bring clarity, safety, and expressiveness\
    \ to template code, making generic programming more approachable and maintainable.\n\
    \n# Summary of Essential Template Keywords and Syntax\n\n+   - template : Declares\
    \ a template.\n- typename or class : Declares a type template parameter."
