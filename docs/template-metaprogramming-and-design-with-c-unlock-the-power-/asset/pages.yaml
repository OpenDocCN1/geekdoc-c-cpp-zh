  md: "# When to Use Which?\n\nIf you want to define constants whose value you know\
    \ at compile time and want to use them in contexts requiring compile-time expressions\
    \ (like array sizes or template parameters), `constexpr` is the way to go.\n\n\
    For runtime constants that should not change after initialization, const suffices.\n\
    \nIf you are defining functions or variables in header files included across multiple\
    \ source files, remember to use `inline` to avoid linker errors, especially for\
    \ `constexpr` variables or small utility functions.\n\n# Real-World Insight\n\n\
    Imagine you're writing a high-performance graphics engine. You might want to precompute\
    \ constants like:\n\ncpp\n\n```\nconstexpr float PI = 3.1415926535f;\nconstexpr\
    \ float degToRad(float degrees) {\n  return degrees * PI / 180.0f;\n}\n```\n\n\
    Using `constexpr` means these values can be computed at compile time, reducing\
    \ runtime overhead.\n\nAt the same time, if PI is defined in a header included\
    \ everywhere, you'd declare it as:\n\ncpp\n\n```\ninline constexpr float PI =\
    \ 3.1415926535f;\n```\n\nto avoid multiple definition errors.\n\nOn the other\
    \ hand, if you have a configuration value that's read from a file or environment\
    \ variable at startup"
