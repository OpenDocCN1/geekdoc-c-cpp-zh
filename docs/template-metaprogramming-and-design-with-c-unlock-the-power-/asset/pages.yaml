  md: "# How Variadic Templates Work\n\nTo understand variadic templates fully, you\
    \ need to know two concepts:\n\n+   1. Template parameter pack — the list of types\
    \ (or non-types) that the template accepts.\n2. Parameter pack expansion — the\
    \ technique that \"unwraps\" the pack so you can work with each element individually.\n\
    \nLet’s break it down with a simple example.\n\n# Example 1: A Variadic Print\
    \ Function\n\nSuppose you want a function that can print any number of arguments,\
    \ separated by spaces. Before variadic templates, you'd have to write multiple\
    \ overloads like variadic macros or `va_args`, which are unsafe and inflexible.\n\
    \nWith variadic templates, you can write:\n\n```\n#include <iostream>\n\n// Base\
    \ case: no arguments\nvoid print() {\n    std::cout << '\\n';\n}\n\n// Variadic\
    \ template function\ntemplate<typename T, typename... Args>\nvoid print(T firstArg,\
    \ Args... restArgs) {\n    std::cout << firstArg << ' ' <<\n    print(restArgs...);\
    \ // Recursive call with the rest of the arguments\n}\n\nint main() {\n    print(1,\
    \ 2.5, \"hello\", 'c');\n}\n```\n\n# How does this work?\n\n+   The variadic template\
    \ print takes at least one argument (T firstArg) plus zero or more (Args... restArgs)."
