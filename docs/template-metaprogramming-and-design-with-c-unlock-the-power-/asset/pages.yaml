  md: '# 9.4 Case Study: Compile-Time Finite State Machines in C++


    Finite State Machines (FSMs) are a fundamental concept in computer science and
    software engineering. They model systems that can be in one of a finite number
    of states and transition between those states based on events or inputs. FSMs
    are everywhere: from parsing text and controlling user interfaces to managing
    network protocols and embedded systems.


    Traditionally, FSM implementations rely on runtime constructs such as switch statements,
    function pointers, or virtual functions. While flexible, these approaches can
    introduce runtime overhead and obscure the design intent. In this case study,
    we''ll explore how modern C++ template metaprogramming empowers us to build compile-time
    finite state machines that are efficient, type-safe, and free from runtime dispatch
    costs.


    # Why Build FSMs at Compile Time?


    Before diving into code, it''s worth understanding the motivation behind compile-time
    FSMs.


    +   1. **Performance**: Eliminating runtime dispatch (like virtual calls or dynamic
    lookup) means faster transitions, which matters in performance-critical or embedded
    systems.

    2. **Safety**: Encoding FSM logic in the type system enables the compiler to detect
    invalid transitions or missing states early, reducing bugs.

    3. **Maintainability**: The FSM''s structure lives in a centralized, declarative
    form, making it easier to review and evolve.

    4. **Code Size**: The compiler can generate minimal, specialized code for each
    state and transition, often resulting in smaller binaries.


    # Modeling FSM Concepts in C++


    At its core, an FSM consists of:


    +   * **States**: **The possible conditions the system can be in.**

    * **Events**: **Inputs or triggers that cause transitions.**

    * **Transitions**: **Rules mapping** (CurrentState, Event) -> NextState .

    * **Actions**: **Optional code executed when transitions occur.**'
