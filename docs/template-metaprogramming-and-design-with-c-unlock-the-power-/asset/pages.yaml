    # Pitfalls and Best Practices When Combining Policies


    When combining policies is powerful, it also introduces complexity that we require:


    +   **Policy interface consistency:** Each policy should provide a well-defined
    interface. For example, ownership policies should expose get(), release(), or
    similar methods. Threading policies should provide lock() and unlock(). This consistency
    makes it easier to mix policies.

    **Avoid ambiguous names:** Since your class inherits from multiple policies, method
    names might clash. Using this-> or explicit base class qualification helps disambiguate.'
