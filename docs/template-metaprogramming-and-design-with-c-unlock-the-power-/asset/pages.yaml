  md: "Algorithms use these categories to select the most efficient implementation\
    \ available. For example, std::distance calculates the number of elements between\
    \ two iterators differently depending on whether the iterators support random\
    \ access (constant time) or only forward traversal (linear time).\nThis selection\
    \ is done using tag dispatching, a compile-time technique where the iterator's\
    \ category type is passed to an overload that implements the appropriate algorithm\
    \ variant.\n\nHere's a conceptual example:\n\n```\ncpp\n// Base iterator tags\n\
    struct input_iterator_tag {};\nstruct random_iterator_tag : input_iterator_tag\
    \ {};\n\n// Overloads for distance\ntemplate <typename Iterator>\ntypename std::enable_if<std::is_same<random_access_iterator_tag,\
    \ std::traits<Iterator>::iterator_category>::value, std::traits<Iterator>::difference_type>::type\n\
    distance(Iterator first, Iterator last) {\n    return last - first; // constant\
    \ time\n}\n\ntemplate <typename Iterator>\ntypename std::enable_if<!std::is_same<random_access_iterator_tag,\
    \ std::traits<Iterator>::iterator_category>::value, std::traits<Iterator>::difference_type>::type\n\
    distance(Iterator first, Iterator last) {\n    typename std::traits<Iterator>::difference_type\
    \ dist = 0;\n    while (first! != last) {\n        ++first;\n        ++dist;\n\
    \    }\n    return dist; // linear time\n}\n```\n\nThis approach lets the STL\
