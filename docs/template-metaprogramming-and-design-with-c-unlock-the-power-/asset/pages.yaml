  md: 'In many software systems, especially those involving scripting, command-line
    interfaces, or embedded interpreters, you need a command dispatcher—a mechanism
    to map command names or identifiers to functions that implement these commands.
    Traditionally, this mapping and dispatch happens at runtime hash maps, string
    comparisons, or virtual functions. But what if you could this dispatch to compile-time?
    A compile-time command dispatcher leverages C++ template metaprogramming and constexpr
    to map commands to handlers without any runtime overhead, while preserving type
    safety and flexibility.


    In this project, we''ll design and implement a compile-time command dispatcher
    that:


    +   - Registers command handlers associated with string literals known at compile-time.

    - Dispatches commands by matching command names at compile time.

    - Invokes the corresponding handler with the right arguments.

    - Provides clear compiler errors if a command is unknown.


    # Why Compile-Time Dispatch?


    Runtime dispatch mechanisms typically use:


    +   - String-to-function maps (e.g., std::unordered_map<std::string, std::function<...>>).

    - Virtual function tables.

    - If-else chains or switch statements.


    These approaches have some downsides:


    +   - Runtime overhead from string hashing, comparisons, or virtual calls.

    - Possibility of runtime errors due to misspelled or unknown commands.

    - Lack of compile-time guarantees on command existence and argument correctness.'
