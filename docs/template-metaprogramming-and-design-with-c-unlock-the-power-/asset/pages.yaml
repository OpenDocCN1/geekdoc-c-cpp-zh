  md: "# Coroutines: Enabling Lazy and Asynchronous Computations in Templates\n\n\
    While concepts and ranges address static properties and data abstractions, coroutines\
    \ introduce a new control flow mechanism. Coroutines, standardized in C++22, allow\
    \ functions to suspend execution and resume later, enabling asynchronous code,\
    \ generators, and more.\n\nCoroutines can be viewed as a generalization of generators\
    \ and cooperative multitasking, where the function’s state is preserved between\
    \ suspensions. This fits naturally with lazy computations, which are often needed\
    \ in template metaprogramming scenarios.\n\nFor instance, generating sequences\
    \ lazily without creating large intermediate containers can be done elegantly\
    \ with templates, coroutines provide a powerful pattern to build generic generators.\n\
    \nConsider a generator for Fibonacci numbers:\n\n# cpp\n\n```\n#include <coroutine>\n\
    #include <optional>\n#include <iostream>\n\ntemplate <typename T>\nstruct Generator\
    \ {\n    struct promise_type {\n        using handle_type = std::coroutine_handle<promise_type>;\n\
    \n        std::suspended_always yield_value(T value) {\n            current_value\
    \ = value;\n            return {};\n        }\n        std::suspended_always initial_suspend()\
    \ { return {}; }\n        std::suspended_always final_suspend() noexcept { return\
    \ {}; }\n        Generator get_return_object() {\n            return Generator{handle_type::from_promise(*this)};\n\
    \        }\n        void return_void() {}\n        void unhandled_exception()\
    \ { std::exit(1); }\n    }\n};\n```\n\nhandle_type coro;"
