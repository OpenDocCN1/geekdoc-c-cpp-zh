    \ recursively instantiates templates to calculate Factorial<5>::value during compilation.\
    \ The resulting executable contains the constant result directly. No runtime recursion,\
    \ no overhead.\n\nThis principle generalizes: calculations, type checks, and decisions\
    \ done at compile time reduce runtime cost. This is especially valuable when the"
