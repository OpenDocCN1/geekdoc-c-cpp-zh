  md: '# Why Compute at Compile Time?


    To understand the motivation behind TMP, think about the difference between work
    done at runtime versus work done at compile time.


    Normally, when your program runs, it performs calculations, makes decisions, and
    manipulates data. This is your familiar runtime world. But some computations don''t
    actually need to happen repeatedly every time the program runs. In many cases,
    the input to these computations is known ahead of time—or at least can be made
    known at compile time.


    By moving these computations to compile time, your program can:


    +   - Run faster: Since the work is done before the program runs, there''s no
    overhead during execution.


    +   - Use less memory: Results can be baked into the code, avoiding runtime allocations
    or calculations.


    +   - Catch errors early: Invalid template instantiations can cause compilation
    failures, preventing bugs that might only show up at runtime.


    +   - Generate specialized code: The compiler can create highly optimized versions
    of functions or classes tailored to specific values or types.


    # TMP as “Programming the Compiler”


    A useful mental model is to think of template metaprogramming as writing programs
    that run inside the compiler. Instead of writing code that the CPU executes while
    the program runs, you write code that the compiler executes while building your
    program.


    This might sound strange, but it''s a powerful idea. The compiler knows all the
    template parameters you''re working with, it can use templates as a mini programming
    language to perform calculations, branch logic, and even produce new types and
    functions.


    # An Early Example: Compile-Time Factorial


    Let''s look at a classic example that illustrates the concept clearly: computing
    the factorial of a number at compile time using TMP.'
