    # 14.4 Project 4: Implementing Policy-Based Smart Pointers


    Smart pointers are a cornerstone of modern C++ programming, providing automatic
    and exception-safe management of dynamically allocated objects. While std::unique_ptr
    and shared_ptr cover most use cases, sometimes you want more control and flexibility—customizing
    how your smart pointers behave depending on your program''s specific needs.


    This is where policy-based design, a powerful metaprogramming technique, shines.
    Instead of hardcoding behaviors into a class, you design your smart pointer to
    accept policies—template parameters representing strategies for key behaviors
    like ownership, locking, deletion, and thread safety. By mixing and matching these
    policies, you create smart pointers tailored precisely to your requirements without
    code duplication or complex inheritance hierarchies.


    In this project, we''ll build policy-based smart pointers from scratch, exploring
    the design, implementation, and practical benefits of this technique.


    # Why Policy-Based Smart Pointers?


    Standard smart pointers are great—but they come with fixed behaviors:


    +   - std::unique_ptr enforces exclusive ownership with move semantics.


    +   - std::shared_ptr provides shared ownership with reference counting.


    +   - std::weak_ptr offers non-owning references to shared objects.'
