  md: 'For example, consider a generic container class that needs a way to allocate
    memory. Instead of hardcoding the allocator type, you could define an allocator
    policy that encapsulates the allocation and deallocation logic. By passing different
    allocator policies as template parameters, the container can use different memory
    management strategies without changing its own code.


    # Policies and the Strategy Pattern: Two Sides of the Same Coin


    You might wonder how policy-based design relates to the classic strategy pattern.
    They are conceptually similar because both aim to separate algorithms or behaviors
    from the context in which they are used. The difference lies in *when* and how
    the behavior is selected.


    +   - Strategy pattern chooses the behavior at runtime via polymorphism (virtual
    functions). This brings flexibility but runtime cost.

    - Policy-based design chooses the behavior at compile time via templates. This
    brings efficiency but requires all policy combinations to be known or instantiated
    at compile time.


    In C++, policy-based design can be viewed as a compile-time version of the strategy
    pattern. Thanks to templates, you can achieve the same modularity and interchangeability
    with static type safety and better performance.


