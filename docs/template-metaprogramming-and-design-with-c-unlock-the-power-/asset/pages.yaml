    perform some optimizations, explicitly marking functions or variables as `constexpr`
    gives the compiler a clear signal and allows you to enforce compile-time evaluation
    in certain contexts. This enables a class of programming techniques known as compile-time
    programming or metaprogramming, where computations, decisions, and even code generation
    happen before your program runs. Here are some reasons why this matters:


    +   **Performance Boost:** If you can precompute values at compile time, your
    program spends less doing that at runtime. This reduces overhead and can be crucial
    in performance-critical applications.


    +   **Stronger Guarantees:** Compile-time evaluation means errors can be caught
    earlier. For example, if a `constexpr` function depends on inputs that aren''t
    constant expressions, the compiler will throw an error. This helps catch bugs
    before your program runs.


    +   **More Express Code:** You can write generic, reusable compile-time algorithms
    that work with types and values, enabling complex logic to be encoded directly
    into your program''s structure.


    +   **Safer Code:** `constexpr` functions often encourage immutability and pure
    functions (functions without side effects), which are easier to reason about and
    test.


