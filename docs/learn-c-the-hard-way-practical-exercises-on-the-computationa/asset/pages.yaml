  md: '# # Chapter 5


    # # Exercise 4: Introducing Valgrind


    It''s time to learn about another tool you will live and die by as you learn C
    Valgrind. I''m introducing Valgrind to you now because you''re going to use it
    from now on in the "To Break It" sections of each exercise. Valgrind is a program
