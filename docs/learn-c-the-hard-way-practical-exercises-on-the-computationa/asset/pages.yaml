  md: '# ex6 output


    ```

    1 $ make ex6

    2 cc -Wall -g ex6.c -o ex6

    3 $ ./ex6

    4 You are 100 miles away.

    5 You have 2.345000 levels of power.

    6 You have 56789.453200 awesome super powers.

    7 I have an initial A.

    8 I have a first name Zed.

    9 I have a last name Shaw.

    10 My whole name is Zed A. Shaw.

    11 $

    ```


    What you can see we have a set of "types", which are ways of telling the C compiler
    what each variable represent, and then format strings to match different types.
    Here''s the breakdown of how they match up:


    **Integers** Declare Integers with the int keyword, and print them with %d.


    **Floating Point** Declared with float or double depending on how big they need
    to be (double is bigger), and printed with %f.


    **Character** Declared with char, with a '' '' (single-quote) character around
    the char, and then printed with %c.


    **String (Array of Characters)** Declared with char name[], written with * characters,
    and printed with %s.


    You''ll notice that C makes a distinction between single-quote for char and double-quote
    for char[] strings.


    # Note 4 C Type Short-Hand For English


    > When talking about C types, I will typically write in English char[] instead
    of the whole char SOMENAME]. This is not valid C code, just a simpler way to talk
    about types when writing English.


