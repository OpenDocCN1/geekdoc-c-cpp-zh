  md: '# Chapter 28


    # Exercise 27: Creative And Defensive Programming


    You have now learned most of the basics of C programming and are ready to start
    becoming a serious programmer. This is where you go from beginner to expert, both
    with C and hopefully with better computer science concepts that every programmer
    should know, and then a few interesting ones I''ve used in real software for years.


    Before I can that to teach you some basic skills and ideas that will help you
    make better software. Exercises 27 through 31 will teach you advanced concepts
    and feature more talking than code, but after those you''ll apply what you learn
    to making a core library of useful data structures.


    The first step in getting better at writing C (and really any language) is to
    learn a new mindset called "defensive programming". Defensive programming assumes
    that you are going to make many mistakes and then attempts to prevent them at
    every possible step. In this exercise I''m going to teach you how to think about
    programming defensively.


    # 28.1 The Creative Programmer Mindset


    It''s not possible to tell you how to be creative in a short exercise like this,
    but I will tell you that creativity involves taking risks and being open-minded.
    Fear will quickly kill creativity, so the mindset I adopt, and many programmers
    adopt on, is designed to make me afraid of taking chances and looking like an
    idiot:


    +   1. I can''t make a mistake.

    2. It doesn''t matter what people think.

    3. What my brain comes up with is going to be a great idea.


    I only adopt this mindset temporarily, and have little tricks to turn it off.
    By doing this I can come up with ideas, find creative solutions, open my mind
    to connections, and just invent weirdness without fear. In this mindset I will
    typically write a horrible first version of something to get the idea out.


    When, I''ve finished my creative prototype I will throw it out and get serious
    about making it solid. Where other people make a mistake is carrying the creative
    mindset into their implementation phase. This then leads to a very defensive mindset
    that is the dark side of the creative mindset:


    +   1. It is possible to write perfect software.

    2. My brain tells me the truth, and it can''t find any errors, therefore I have
    written perfect software.

    3. My code is who I am and people who criticize its perfection are criticizing
    me.'
