  md: '# 22.2 Type Qualifiers


    const Indicates the variable won''t change after being initialized.


    volatile Indicates that all bets are off, and the compiler will leave this alone
    and try not to do any fancy optimizations to it. You usually need this if you''re
    really weird stuff to your variables.


    register Forces the compiler to keep this variable in a register, and the compiler
    can just ignore you. These days compilers are better at figuring out where to
    put variables, so only use this if you actually measure improving the speed.


    # 22.1.3 Type Conversion


    C uses a sort of "stepped type promotion" mechanism, where it looks at two operands
    on either side of an expression, and promotes the smaller side to match the larger
    side before the operation. If one side of an expression is on this list, the other
    side is converted to that type before the operation is done, and this goes in
    this order:


    +   1. long

    2. double

    3. float

    4. int (but char and short int);

    5. long


    If you find yourself trying to figure out how your conversions are working in
    an expression, don''t leave it to the compiler. Use explicit casting operations
    to make exactly what you want. For example, if you have:


    ```

    long + char - int * double

    ```


    Rather than trying to figure out if it will be converted correctly, just use casts:


    ```

    (double)long - (double)char - (double)int * double

    ```


    Putting the type you want in parenthesis before the variable is how you force
    it into the type you really need. The important thing is always promote up, not
    down. Don''t cast long to char unless you know what you''re doing.


    # 22.1.4 Type Sizes


    The std.h defines both a set of typedefs for exact integer types, as well as a
    set of macros for the sizes of all the types. This is easier to work with the
    older limits.h since it is consistent. The types defined are:


    int8_t 8 signed integer.


    uint8_t 8 unsigned integer.


    int16_t 16 signed integer.


    uint16_t 16 unsigned integer.


    int32_t 32 signed integer.


    uint32_t 32 unsigned integer.


    int64_t 64 signed integer.


    uint64_t 64 unsigned integer.'
