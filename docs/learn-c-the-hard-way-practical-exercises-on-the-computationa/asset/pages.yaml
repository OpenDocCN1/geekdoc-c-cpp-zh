  md: '# CHAPTER 48. EXERCISE 47: A FAST URL ROUTER


    ```

    MATCH:/hello == Hello

    URL>/hello/zed

    No exact match found, trying prefix.

    MATCH:/hello/zed == Hello

    URL>/album

    No exact match found, trying prefix.

    MATCH:/album == Album

    URL>/album/12345

    No exact match found, trying prefix.

    MATCH:/album/12345 == Album

    URL>/asdfdasdfdf

    No exact match found, trying prefix.

    FAIL: asdfdasdfdf

    URL>/asdfdasdfdf

    No exact match found, trying prefix.

    MATCH:/asdfdasdfdf == MainApp

    URL>

    ```


    You can see that the routing system first an exact match, and if it can''t find
    it it will find a prefix match. This is mostly to try out the difference between
    the two. Depending on the semantics of your URLs you may want to match exactly,
    always to prefixes, or do both and pick the "best" one


    # 48.2 To Improve It


    URLs are weird because people want to magically handle all the insane things their
    web applications do, even if it''s not very logical. In this simple demonstration
    of how to use the TTree to routing, it has some flaws that people wouldn''t be
    able to articulate. For example, it will match /al to Album, which generally isn''t
    what they want. They want /album/* to Album and /al to be a 404 error.


    This isn''t difficult to implement though, you could change the prefix algorithm
    to any match you want. If you change the matching algorithm to find all matching
    prefixes and pick the "best" one, you''ll be able to do it easily. With /al could
    match MainApp or Album. Those then do a little logic on what is "best".


    Another thing you can do in a real routing system is use the TTree to find possible
    matches, but that these are a small set of patterns to check. In many web applications
    the running back can be costly, so you can use a TTree to find all the possible
    ones by their prefixes. You then narrow the patterns to try down a few very quickly.


    Using this method, your URLs will match exactly since you are actually running
    regex patterns, and they''ll match much faster since you''re finding them by possible
    prefixes.


    This kind of algorithm also works for anything that needs to have flexible user-visible
    routing mechanisms. Domain names, IP address, registries and directories, files,
    or URLs.


