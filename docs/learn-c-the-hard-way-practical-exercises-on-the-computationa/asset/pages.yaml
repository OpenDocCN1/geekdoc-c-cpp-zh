    # Deconstructing "K&R C"


    When I was a kid I read this awesome book called "The C Programming Language"
    by the language''s creators, Brian Kernighan and Dennis Ritchie. This book taught
    me and many people of my generation, and a generation

    before, how to write C code. You talk to anyone, whether they know C or not, and
    they will say, "You can''t beat

    K&R C". It''s the best C book." It is an established piece of programmer lore
    that is not soon to die.


    I myself believed that until I started this book. You see, "K&R C" is riddled
    with bugs and bad

    its age is no excuse. These bugs when they wrote the first printing, and the 42nd
    printing. I haven''t

    actually just how bad most of the code was in this book and needs recommended
    to many people. After

    reading through it for just an hour I decided it be taken down from its pedestal
    and relegated to

    history rather than vanished as state of the art.


    I believe it is time to lay this book to rest, but I want to give it an exercise
    for you in finding hacks, attacks,

    defects, and bugs by going through "K&R C" to break all the code. That''s right,
    you are going to destroy this

    sacred cow for me, and you''re going to have no problem doing it. When you are
    doing this, you will have a

    finely honed eye for it. You will have an informed opinion of the book''s actual
    quality, and will be able

    to make your own decisions on how to use the knowledge it contains.


    In this chapter we will use all the knowledge you''ve gained from this book, and
    spend reviewing the code in

    "K&R C". What we will do many pieces of code from the book, find all the bugs
    in it, and write a unit

    test that exercises the bugs. We''ll then run this test undergrind to get statistics,
    and then we''ll find

    bugs with a redress.


    This will obviously be a long chapter so I''m going to do only a handful of these
    and then I''m going you to do

    t rest. I''ll provide a guide that is for each page, with the code in it, and
    hints to the bugs that it has. Your job is to

    tear that piece of code apart and try to think like an attacker to break the code.


    Note 14


    As you read, if you feel that I am anything disrespectful to the authors, that''s
    not my intent. I

    respect the authors more than you know and owe them a debt of gratitude for writing
    their

    book. My criticisms are both for educational purposes of teaching modern C code,
