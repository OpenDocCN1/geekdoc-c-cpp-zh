    ALL TESTS PASSED

    Tests: 3

    $

    ```


    You should have at least three tests that confirm all the basic operations, and
    then see how much you can test beyond what I''ve done.


    # 45.3 How To Improve It


    As usual you should go back and add the defensive programming checks to this exercise.
    Hopefully you''ve been doing this the base code in libthreadw doesn''t check for
    common defensive programming that I''m teaching you. This leads to you so that
    you get to improving code with these extra checks.


    For example, in this ring buffer there''s not a lot of checking that an access
    will be inside the buffer.


    If you read the Ring Buffer Wikipedia page you''ll see the "Optimized POSIX implementation"
    that uses POSIX specific calls to create an infinite space. Study as I''ll have
    you try it in the extra credit.'
