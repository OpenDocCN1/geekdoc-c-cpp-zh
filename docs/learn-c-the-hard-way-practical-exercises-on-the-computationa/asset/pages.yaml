  md: "# Chapter 12\n\n# Exercise 11: While-Loop And Boolean\nExpressions\n\nYou've\
    \ had your first taste of how C does loops, the boolean expression i < argc might\
    \ not have been clear to you. Let me explain something about it before we see\
    \ how a while-loop works.\n\nIn C, there's not really a \"boolean\" type, and\
    \ instead any integer that's 0 is \"false\" and otherwise it's \"true\". In the\
    \ last exercise the expression i < argc actually resulted in 1 or 0, not an explicit\
    \ True or False like in Python. This is another example of C being closer to how\
    \ a computer works, not to a computer true values are just integers.\n\nNow you'll\
    \ take and implement the same program from the last exercise but use a while-loop\
    \ instead. I will compare the two so you can see how one is related to another.\n\
    \n```\n#include <stdio.h>\n\nint main(int argc, char *argv[]) {\n    // go through\
    \ each string in argv\n    int i = 0;\n    while(i < argc) {\n        printf(\"\
    arg: %s\\n\", i, argv[i]);\n        i++;\n    }\n\n    // let's make our own array\
    \ of strings\n    char *states[] = {\n        \"California\", \"Oregon\",\n  \
    \      \"Washington\", \"Texas\"\n    };\n\n    int num_states = 4;\n    int i\
    \ = 0; // watch for this\n    while(i < num_states) {\n        printf(\"state:\
    \ %s\\n\", i, states[i]);\n        i++;\n    }\n}\n\n```"
