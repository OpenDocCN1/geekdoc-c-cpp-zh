    # 33.3 Double Linked Lists


    The first data structure we''ll add to liblctw is a double linked list. This is
    the simplest data structure we can make, and has useful properties for certain.
    A linked list works by nodes having pointers to the next or previous element.
    A "double linked list" contains pointers to both, while a "single linked list"
    only points at the next element.


    Each node has pointers to the next and previous, and because you keep track of
    the first and last element of the list, you can do some operations quite quickly.
    Anything inserting or deleting an element will be very fast. They are also easy
    to implement by most people.


    The main disadvantage of a linked list is that traversing it involves traversing
    every single pointer along the way. This means searching, sorting, or iterating
    the elements will be slow. It also means that you can''t jump to random parts
    of the list. If you had an array of elements you could just index into the'
