  md: '# 294 CHAPTER 45. EXERCISE 44: RING BUFFER


    This is all there is to a basic RingBuffer implementation. You can read and write
    blocks of data to it. You can ask how it is in and how much space it has. There
    are some fancier ring buffers that use tricks in the OS to create an infinite
    store, but those aren''t perfect.


    Since my RingBuffer deals with reading and writing blocks of memory, I''m making
    sure that any end == start then I reset it to 0 (zero) so that you go to the beginning
    of the buffer. In the Wikipedia version it wasn''t writing blocks of data, so
    it only had to move end and start around in a circle. To better handles you will
    have to drop the beginning of the internal buffer whenever the data is empty.


    # 45.1 The Unit Test


    For your unit test, you''ll want to test as many possible conditions as you can.
    Easiest way to do that is to preconstruct RingBuffer structs and manually check
    that the functions and math work. For example, you could make one where end is
    right at the end of the buffer and start is right before it, then see how it fails.


    # 45.2 What You Should See


    Here''s my ringbuffer_tests run:


    ```

    $ .tests/ringbuffer_tests

