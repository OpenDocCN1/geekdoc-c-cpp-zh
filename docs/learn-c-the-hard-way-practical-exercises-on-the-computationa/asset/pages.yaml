    In this code we create a few arrays with different types in them. Arrays of data
    are so central to how C works, there''s a huge number of ways to create them.
    For now, just use the syntax type name[] = {initializer}; and we''ll explore more.
    What this syntax means is "I want an array of type that is initialized to ..."
    When C sees this does the following:


    +   1. Look at the type, in this case it''s int.

    2. Look at the [] and see that there''s no length given.

    3. Look at the initializer, (10, 12, 13, 14, 20) and figure out that you want
    5 ints in your array.

    4. Create a piece of memory in the computer, that can hold 5 integers after another.

    5. Take the name you, areas and assign it to location.


    In the case of areas it''s creating an array of 5 ints that contain those numbers.
    When it gets to char name[] = "Zed" it''s doing the same thing, it''s creating
    an array of 3 chars and assigning that to name. The final array we make full_name,
    but we use the annoying syntax of spelling it out, one character at a time. To
    C, name and full_name are identical methods of creating a char array.


    The rest of the file, we''re using a keyword sizeof to ask C how things are in
    bytes. C is all about the size and location of pieces of memory and what you do
    with them. To help you keep that straight, it gives you the sizeof so you can
    ask how big something is before you work with it.


