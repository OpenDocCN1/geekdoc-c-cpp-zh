  md: 'I''ve already talked about some of the things $TSTrees$ can, but they aren''t
    the best data structure at all.

    The disadvantages of the $TSTree$ are:


    +   1. As I mentioned, deleting from them is memory. They are better for data
    that needs to be looked up fast and you rarely remove them. If you need to delete
    then simply disable the $value$ and periodically rebuild the tree when it gets
    too big.


    +   2. It uses a lot of memory compared to $BSTree$ and $Hasmaps$ for the same
    key space. Think about it, it''s using a full node for each character in every
    key. It might do better for smaller keys, but if you put a lot in a $TSTree$ it
    will get huge.


    +   3. They do not work well with large keys, where "large" is subjective as usual
    test first. If you''re trying to store 10k character keys using then a $HashMap$.


    # 47.2 How To Improve It


    As usual, go through and improve this by adding the defensive preconditionals,
    asserts, and checks to function. There''s some other possible improvements, but
    you don''t necessarily have to implement all of these:


    +   1. You could allow duplicates by using a $DArray$ instead of the $value$.


    +   2. As I mentioned deleting is hard, but you could simulate it by setting the
    values to $NULL$ so they are effectively gone.


    +   3. There are no ways to collect all the possible matching values. I''ll have
    you implement that in an extra credit.


    +   4. There are other algorithms that are more complex but have slightly better
    properties. Take a look at Suffix Array, Suffix Tree, and Radix Tree structures.


    # 47.3 Extra Credit


    +   1. Implement a $TSTree\_collect$ that returns a $DArray$ containing all the
    keys that match the given prefix.


    +   2. Implement $TSTree\_search\_suffix$ and a $TSTree\_insert\_suffix$ so you
    can do suffix searches and inserts.


    +   3. Use $valgrind$ to see how much memory this structure uses to store data
    compared to the $BSTree$ and $HashMap$.'
