  md: '# 28.4. APPLYING THE EIGHT STRATEGIES


    # 28.4.5 Prevention Over Documentation


    A common problem when programmers write code is that they will document a common
    bug rather than simply fix it. My favorite it is when the Ruby on Rails system
    simply assumed that all months had 30 days. Calendars are hard, so rather than
    they fix it a tiny comment somewhere that said this was on purpose, then they
    refused to fix it for years. Every time someone would complain then they would
    blaster and say, "But it''s documented!"


    Documentation doesn''t include it if you can fix the problem, and if the function
    has a fatal flaw then simply don''t include until you fix. In the case of Ruby
    on Rails, not having dating functions would have been better than including purposely
    broken ones that nobody could use.


    As you go through your defensive programming cleanups, try to fix everything you
    can. If you find yourself documenting and more problems you can''t fix, then consider
    refactoring or simply removing it. If you really have to keep this horribly broken
    feature, then I suggest you write it, document it and find a new job before you
    are blamed for it.


    # 28.4.6 Automate Everything


    You are a programmer, and that means your job is putting other people out of jobs
    with automation. The pinnacle of it is putting yourself out a job with your own
    automation. Obviously you won''t completely remove what you do, but if are spending
    your day rerunning manual tests in your terminal, then your job is not programming.
    You are doing QA, and you should automate yourself out this QA job you probably
    don''t really want away.


    The easiest way to do it is to write automated tests, or unit tests. In this book
    I''m going to get into how to do this easily, and I''ll avoid most of the dogma
    when you write tests. I''ll focus on how to write them, what to test, and how
    to be effective at the testing.


    Common things programmers fail to automate but they should:


    +   1. Testing and validation.

    2. Build processes.

    3. Deployment of software.

    4. System administration.²

    5. Error reporting.


    Try to devote some of your time to automating this and you''ll have more time
    to work on the fun stuff. Or, if this is fun to you, then maybe you should work
    on software that makes these things easier.


    # 28.4.7 Simplify and Clarify


    The concept of "simplicity" is a slippery one to many people, especially smart
    people. They generally confuse "comprehension" with "simplicity". If you understand
    it, clearly it''s simple. The actual test of simplicity is by comparison with
    something that could be simpler. But you''ll see people who write code going to
    the most obtuse structures possible because they think the simpler version of
    the thing is "dirty". A love affair with complexity is a programming sickness.


    You can fix this disease by telling yourself, "Simple and clear is not dirty,
    no matter what everyone else is doing." If everyone else is writing insane visitors
    involving 19 classes over 12 interfaces and you can do it with two strings, you
    win. They are wrong, no matter how "elegant" they think their complex monstrosity
    is.


