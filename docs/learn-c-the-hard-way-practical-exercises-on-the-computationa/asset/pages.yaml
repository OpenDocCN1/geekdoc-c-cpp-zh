  md: '# CHAPTER 28. EXERCISE 27: CREATIVE AND DEFENSIVE PROGRAMMING


    +   1. Make sure both functions have no errors. It doesn''t matter how fast or
    simple a function is if it has errors.


    +   2. If you can''t fix one, pick the other.


    +   3. Do they produce the same result? If not then pick the one that has the
    result you need.


    +   4. If they produce the same result, then pick the one that has fewer features,
    fewer branches, or you just is simpler.


    +   5. Make sure you''re not picking the one that is most impressive. Simple and
    dirty beats complex and clean any day.


    You''ll notice that I mostly give you up at the end and tell you to use your judgment.
    Simplicity is ironically a very complex thing, so when you your tastes as the
    best way to go. Just make sure you adjust your view of what''s “good” as you grow
    and gain more experience.


    # 28.4.4 Question Authority


    The final strategy is the most important because it breaks you out of the defensive
    programming mindset and lets you transition into the creative mindset. Defensive
    programming is authoritarian and it can be cruel. The job of this is to make you
    follow rules without them you''ll miss something or get distracted.


    This authoritarian attitude has the disadvantage of disabling independent creative
    thought. Rules are necessary for getting things done, but being a slave to them
    will kill your creativity.


    This final strategy means you should question the rules you follow periodically
    and assume that they be wrong, just like the software you are reviewing. What
    I typically do is, after a session of defensive programming, I''ll go a non-programming
    break and let the rules go. Then I''ll be ready to do some creative work or do
    more defensive coding if needed.


    # 28.5 Order Is Not Important


    The final thing I''ll say on this philosophy is that I''m not telling you to do
    this in a strict order of “CREATE! DEFEND! CREATE! DEFEND!” At first you may want
    to do that, but I will actually do either in varying amounts depend on what I
    want to do, and I even melt them together with no defined boundary.


    I don''t think one mindset is better than another, or that there are strict separation
    between them. You need both creativity and strictness to do programming well,
    so work on both if you want to improve.


