  md: "# Chapter 31\n\n# Exercise 30: Automated Testing\n\nAutomated testing is used\
    \ frequently in other languages like Python and Ruby, but rarely used in C. Part\
    \ of the reason comes from the difficulty of automatically loading and testing\
    \ pieces of C code. In this chapter we will create a very small little testing\
    \ 'framework' and get your skeleton directory building an example test case.\n\
    \nThe frameworks you'll need to include in your c-skeleton skeleton is \"minunit\"\
    \ which started with code from a tiny snippet of code by Jura Design. I then evolved\
    \ it further, to be this:\n\n```\n# undef NDEBUG\n#ifndef _minunit_h\n#define\
    \ _minunit_h\n\n#include <stdio.h>\n#include <dbg.h>\n#include <stdlib.h>\n\n\
    def mu_suite_start() char *message = NULL\n\n#define mu_assert(test, message)\
    \ if (!(test)) { log_err(message); return message; } \\\n#define mu_run_test(test)\
    \ debug(\"n-----s\", \" %test\"); \\ \\\n    message = test(); tests_run++; if\
    \ (message) return message;\n\n#define RUN_TESTS(name) int main (int argc, char\
    \ *argv[]) (\n    argc = 1; \\\n    debug(\"n----- RUNNING: %s\", argv[0]);\\\n\
    \    printf(\"n-----uRUNNING: %s\\n\", argv[0]);\\\n    char *result = name();\n\
    \    if (result != NULL) \\\n        printf(\"FAILED: %s\\n\", result);\\\n  \
    \  }\n    } else \\\n        printf(\"ALL TESTS PASSED\\n\");\\\n    }\n\\)\n\
    \    printf(\"Tests run: %d\\n\", tests_run); \\\n    exit(result != 0);\\\n})\n\
    \nint tests_run();\n```"
