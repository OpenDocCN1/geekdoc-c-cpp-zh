  md: '# 17.2 Explaining Structures


    If you''ve done the work I asked you structures should be making sense, but let
    me explain them explicitly just to make sure you''ve understood it.


    A structure in C is a collection of other data types (variables) that are stored
    in one block of memory but let you access each independently by name. They are
    similar to a record in a database table, or a very simplistic class in an object
    oriented language. We can break down one way this:


    +   1. In the above code, you make a struct that has the fields you''d expect
    for a person: name, age, weight, height.

    2. Each of those fields have a type, int.

    3. C packs those together so they can be contained in one single struct.

    4. The struct Person is a compound data type, which means you can now refer to
    struct Person in the same kinds of expressions you would use other data types.

    5. This lets you pass the whole cohesive grouping to other functions, as you did
    with Person_print.

    6. You can access the individual parts of a struct by their names using x->y if
    you''re dealing with a pointer.

