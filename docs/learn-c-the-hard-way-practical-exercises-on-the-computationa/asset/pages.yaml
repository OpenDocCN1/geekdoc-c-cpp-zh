    \ *el)\n{\n    array->contents[array->end] = el;\n    array->end++;\n\n    if\
    \ (DArray_array(array) >= DArray_max(array)) {\n        return DArray_expand(array);\n\
    \    } else {\n        return 0;\n    }\n}\n\nvoid *DArray_pop(DArray array)\n\
    {\n    check(array->end > 0, \"Attempt to pop from empty array.\");\n    void\
    \ *el = DArray_remove(array, array->end - 1);\n    array->end--;\n\n    if (DArray_end(array)\
    \ > (int)array->expand_rate && DArray_end(array) == array->expand_rate)\n    \
    \    DArray_contract(array);\n\n    return el;\n}\n```\n\nThis shows how to tackle\
    \ complex code. Instead of diving right into the .c implementation, look at the\
    \ header file, then read the unit. This gives you an \"abstract to concrete\"\
    \ understanding how the pieces work together and making it easier to remember.\n\
    \n# 35.1 Advantages And Disadvantages\n\nA DArray is better when you need to optimize\
    \ these operations:\n\n+   1. Iteration. You can use a basic-for loop and DArray_count\
    \ with DArray_get and you're done. No macros needed, and it's faster because you're\
    \ not walking pointers.\n2. Indexing. You can use DArray_get and DArray_set to\
    \ access any element, but with a List you have to go through N elements to get\
    \ N+1.\n3. Destroying. You free the struct and the contents in two operations.\
    \ A List requires several of free calls and also walking every element.\n4. Cloning.\
    \ You can clone it in two operations (plus whatever it's storing) by copying the\
    \ struct and contents. A list requires walking the whole thing and copying every\
    \ ListNode plus its value.\n5. Sorting. As wish, List is horrible if you need\
    \ to keep the data sorted. A DArray opens up a whole class of great algorithms\
    \ because you can access elements randomly.\n6. Large Data. If you need to keep\
    \ around a lot of data, then a DArray wins since it's base contents takes up less\
    \ than the same number of ListNode structs.\n\nThe List however wins on these\
    \ operations:\n\n+   1. Insert and remove on the front (what I called shift).\
    \ A DArray needs special treatment to be able to do this efficiently, and usually\
    \ has to do some copying."
