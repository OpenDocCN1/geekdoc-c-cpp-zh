  md: "# Chapter 35\n\n# Exercise 34: Dynamic Array\n\nThis is an array that grows\
    \ on its own and has most of the features as a linked list. It will usually take\
    \ up less space, run faster, and has other beneficial properties. This exercise\
    \ will cover a few of the disadvantages like slow removal from the front, with\
    \ a solution (just do it at the end).\n\nA dynamic array is simply an array of\
    \ void *pointers that is pre-allocated in one shot and point at the data. In the\
    \ linked list you had a full struct that stored the void *value pointer, but in\
    \ a dynamic array there's just a single array with all of them. This means you\
    \ don't need any pointers for next and previous records since you can just index\
    \ into it directly.\n\nTo start, I'll give you the header file you should type\
    \ up for the implementation:\n\n```\n#ifndef _DArray_h\n#define _DArray_h\n#include\
    \ <stdlib.h>\n#include <assert.h>\n#include <lcthw/dbg.h>\n\ntyp struct DArray\
    \ {\n    int end;\n    int max;\n    size_t element_size;\n    size_t expand_rate;\n\
    \    void **contents;\n}; DArray;\n\nDArray *DArray_create(size_t element_size,\
    \ size_t initial_max);\nvoid DArray_destroy(DArray *array);\nvoid DArray_clear(DArray\
    \ *array);\nint DArray_expand(DArray *array);\nint DArray_contract(DArray *array);\n\
    int DArray_push(DArray *array, void *el);\nvoid *DArray_pop(DArray *array);\n\
    ```"
