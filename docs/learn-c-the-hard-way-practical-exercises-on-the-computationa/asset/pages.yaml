  md: '# CHAPTER 42. EXERCISE 41: USING CACHEGRIND AND CALLGRID FOR PERFORMANCE TUNING


    ```


    if (b0->slen > n) return 1;

    if (b1->slen > n) return -1;

    return BSTR_OK;

    ```


    The surprising thing about this output is that the worst line of bstrcmp isn''t
    the character comparison like I thought. For memory access it''s the if-statement
    at the top that has every possible variable it could receive. If one statement
    does more than twice as many memory accesses compared to the line that''s comparing
    the characters on line 17 of this output. If I were to make bstrcmp then I would
    definitely just touch that or it comes somewhere else.


    Another option is to check this with an assert that only runs when developing,
    and then compile it out in production. I now have enough evidence to say that
    this line is bad for this data structure, so I can justify removing it.


    What I don''t do to however is making this function defensive just to gain a few
    cycles. In a real performance improvement I would simply put this on a list and
    then dig for others I can make in the program.


    # 42.2 Judo Tuning


    > "We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil."


    > (Donald Knuth)


    In my opinion, this quote seems to miss a major point about performance tuning.
    In Knuth is saying that when you perform tuning matters, if you do it in the beginning,
    then you''ll cause sorts of problems. According to his optimization should happen
    ''sometimes later'', or at least, that''s my guess. Who knows these really.


    I''m going to declare this not necessarily wrong, but missing the point, and I''m
    going to officially give my quote. You can quote me on this:


    > "Use to find the biggest optimizations that take the least effort."


    > (Zed A. Shaw)


    It doesn''t matter when you try to optimize something, but it''s how you figure
    out if your optimization actually improved the software, and how much you put
    into doing them. With evidence you can find the places where the code just lets
    you around. Usually these are just decisions, in bstrcmp trying to check everything
    for a NULL value.


    At a certain point you have found the code where the only thing is tiny micro-optimizations
    so as reorganizing if-statements and special loops like Diff''s Device. At this
    point, there''s just a reason that you''d gain more by redesigning the software
    to not do things.


    This is something that programmers who are optimizing small to see. Many times
    the best way to get something fast is to find out not to do them. In the analysis,
    I wouldn''t try to make bstrcmp faster, maybe there''s a hashing scheme that I
    can use let me do a sortable hash instead of constantly calling bstrcmp. Maybe
    I can optimize it by trying the first char, and if it''s incomparable just don''t
    call bstr.


    If after all that you can''t do a redesign then looking for little micro-optimizations,
    as do you do constantly improve their speed. Remember that the goal is to be the
    biggest impact with the least'
