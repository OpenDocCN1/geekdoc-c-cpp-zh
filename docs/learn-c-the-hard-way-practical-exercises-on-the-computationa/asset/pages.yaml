  md: '# Chapter 3


    # Exercise 2: Make Is Your Python Now


    In Python you run programs by typing python and the code you wanted to run. The
    Python interpreter would just run them, and import any other libraries and things
    you needed on the fly as it C is a different beast where you have to compile your
    source files and manually stitch them together into a binary that can run on its
    own. Doing this manually is a pain, and in the last exercise you just ran make
    to do it.


    In this exercise, you''re going to get a crash in GNU make, and you''ll be learning
    to use it as you learn C. Make will for the rest of your book, you will build
    your code, and your tests, and do all the stuff for you Python normally.


    The difference is, I''m going to show you Makefile wizard, where you don''t have
    to specify every stupid little thing about your C program to build it. I won''t
    do that in this exercise, but after you''ve been using "baby make" for a while,
    I''ll show you "master make".


    # 3.1 Using Make


    The first stage of using make is to use it to build programs it already knows
    how to build. Make has decades of knowledge on building a wide variety of files
    from other files. In the last exercise you did this already commands like this:


    > Building ex1 with-Wall


    ```

    $ make ex1

    # or this one too

    $ CFLAGS="-Wall" make ex1

    ```


    In the first command you''re telling me, "I want a file named ex1 to be created."
    Make then does the following:


    +   1. Does the file ex1 exist already?

    2. No. Ok, is there another file that starts with ex1?

    3. Yes, it''s called ex1.c Do I know how to build .c files?

    4. Yes, I run this with cc ex1.c -o ex1 to build them.

    5. I should make one ex1 by using cc to build it from ex1.c.


    The second command in the listing above is a pass to "modifiers" to the make command.
    If you''re not familiar with the Unix shell works, you can create these "environment
    variables" which will get picked up by programs you run. Sometimes you do this
    with a command like export CFLAGS="-Wall" depending on the'
