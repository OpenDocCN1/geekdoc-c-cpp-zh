  md: "# 20.2 The Prototype Object System\n\nThe OOP system we'll create is a simple\
    \ \"prototype\" style object system more like JavaScript. Instead of classes,\
    \ you start with prototypes that have fields set, and then use those as the basis\
    \ of creating object instances. This \"classless\" design is easier to implement\
    \ and work with than a traditional class one.\n\n# 20.2.1 The Object Header File\n\
    \nI want to put the data types and declarations into a separate header file named\
    \ object.h. This is standard C++ and lets you ship binary libraries but still\
    \ lets the programmer compile against it. This file I have covered advanced CPP\
    \ techniques I'm going to quickly describe and then you will see in action:\n\n\
    ![](img/7d8b291c9c9b2280e2835cac5c0abe55_99_0.png)\n\n```\n#ifndef object_h\n\
    #define object_h\n\ntyped enum {\n    NORTH, SOUTH, EAST, WEST\n} Direction;\n\
    \nttypedef struct {\n    char *description;\n    int (*init)(void *self);\n  \
    \  void (*describe)(void *self);\n    void (*destroy)(void *self);\n    void (*move)(void\
    \ *self, Direction direction);\n    int (*attack)(void *self, int damage);\n}\
    \ Object;\n\nint Object_init(void *self);\nvoid Object_destroy(void *self);\n\
    void Object_describe(void *self);\nvoid Object_move(void *self, Direction direction);\n\
    int Object_attack(void *self, int damage);\nvoid Object_new(size_t size, Object\
    \ prototype, char *description);\n\n#define NEW(T, N) Object_new(sizeof(T), T##Proto,\
    \ N)\n#define ____(N) proto.N\n\n#endif\n```\n\nTaking a look at this file, you\
    \ can see a few new features of syntax you haven't encountered before:\n\n#ifndef\
    \ you've seen a #define for making simple constants, but the CPP can also do logic\
    \ and remove sections of code. The #ifndef is \"if not defined\" and checks if\
    \ there's already a #define object_h and if it skips all of code. I do so we can\
    \ change it any time we want and not worry about defining things multiple times.\n\
    \nWith the above #ifndef shielding this file we then add the _object_h define\
    \ so that any attempts to include it later have to skip it.\n\n#NEW(T,N) This\
    \ makes a macro, and it works like a function that puts out the code on the right,\
    \ whenever you use the macro on the left. This is simply making a short version\
    \ of the normal way we'll call Object_new and avoids potential errors when calling\
    \ it wrong. The way the macro works is the T and N parameters to NEW are \"injected\"\
    \ into the line of code on the right. The syntax T##Proto says"
