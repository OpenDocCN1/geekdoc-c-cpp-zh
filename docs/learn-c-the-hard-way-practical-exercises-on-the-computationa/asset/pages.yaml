  md: '# Chapter 20


    # Exercise 19: A Simple Object System


    I learned C before I learned Object Oriented Programming, so it helped me to build
    an OOP system in C to understand the basics of what OOP meant. You are probably
    the kind of person who learned an OOP language before you learned C, so this kind
    of bridge might help you as well. In this exercise, you will build a simple object
    system, but also learn more about the C Pre-Processor or CPP.


    This exercise will build a simple game where you kill a Minotaur in a small little
    castle. Nothing fancy, just four rooms and a bad guy. This project will also more
    like a real C software project than your previous ones. This is why I''m introducing
    the CPP here because you need it to start using multiple files in your owner software.


    # 20.1 How The CPP Works


    The C Pre-Processor is a template processing system. It''s a highly targeted one
    that helps make C easier to work with, but it does this by having a syntax aware
    template mechanism. Traditionally people used the CPP to store constants and make
    "macros" to simplify repetitive coding. In modern C you''ll actually use the CPP
    as a code generator to create template pieces of code.


    How the CPP works is you give it one file, usually a c file, and it processes
    various files of text starting with the # (octothorpe). When it encounters any
    of these it performs a special replacement on the text of the input file. Its
    main advantage is that it can include other files, and then augment its list of
    macros based on that file''s contents.


    A quick way to see what the CPP does is the last exercise and run this:


    ```

    cpp ex1.c | less

    ```


    It will be a huge amount of output, scroll through it and you''ll see the contents
    of the other files you included with #include. Scroll down to the original code
    and you see how the cpp is altering the source based on various #define macros
    in the header files.


    The compiler is so tightly integrated with cpp that it runs for you and understands
    how it works intimately. In modern C, the cpp system is integral to C''s function
    that you might as well consider it to be part of the language.


    In the remaining sections, we will be using more of the CPP syntax and explaining
    it as we go.


    > ¹A.K.A. pound, hash, mesh, number symbol, pick whatever makes you happy'
