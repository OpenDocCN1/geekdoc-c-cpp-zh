  md: '# Chapter 44


    # Exercise 43: A Simple Statistics Engine


    This is a simple algorithm I use for collecting summary statistics "online", or
    without storing all of the samples. I use this in any software that needs to keep
    some statistics as mean, standard deviation, and but where I can''t store all
    the samples needed. Instead I can store the rolling results of the calculations
    which is only 5 numbers.


    # 44.1 Rolling Standard Deviation And Mean


    The first thing you need is a sequence of samples. This can be anything from time
    to complete a task, numbers of times someone accesses something, or even star
    ratings on a website. Doesn''t really matter what, just so long as you have a
    stream of numbers and you want to know the following summary statistics about:


    sum Is the total of all the numbers added together.


    sum squared (sumsq) This is the sum of the square of each number.


    count (n) This is the number samples you''ve taken.


    min This is the smallest sample you''ve seen.


    max This is the largest sample you''ve seen.


    mean This is the most likely number. It''s not actually the middle, since that''s
    the median, but it''s an approximation for it.


    stdev Calculated using sqrt(sumsq - (sum * mean))/(n - 1)) where sqrt is the square
    root function in the math h header.


    I will confirm this calculation works using R I know these results right:


    # Standard Deviation in R


    ```

    1 s <- runif(n=10, max=10)

    2 > s

    3 [1] 6.1061334 9.6783204 1.2747090 8.2395131 0.3333483 6.9755066 1.0262625

    4 [8] 7.6587523 9.4398273 9.5788115

    5 > summary(s)

    6 Min. 1st Qu. Median Mean 3rd Qu. Max.

    7 0.3333 2.1910 6.5410 5.5850 8.0940 9.6780

    8 > sd(s)

    9 [1] 3.5478688

    10 > sum(s)

    ```'
