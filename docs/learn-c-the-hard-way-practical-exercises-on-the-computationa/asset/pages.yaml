    This follows the pattern I''ve been using this whole time where I have a "container"
    named BSTTree and then that has nodes BSTNode that make up the actual contents.
    Better yet? Good, there''s no reason to be clever with this structure.


    The important part is the BSTNode is configured and how it gets used to each operation:
    set, get, and delete. I''ll cover first since it''s the easiest operation and
    I''ll pretend I''m doing it manually against the data structure:


    +   1. I take the key you''re looking for and delete. First thing I compare it
    with node''s key.

    2. If your key is less-than the node.key, then I traverse the tree using the left
    pointer.

    3. If your key is greater-than the node.key, then I go down with right.

    4. I repeat 2 and 3 until I find a matching node.key, or a node that has no left
    and right. In the first case I return node.data, in the second I return NULL.


    All that''s there to get, now to set it the same thing, which you''re looking
    for to put a new node:


    +   1. If there is no BSTTree.root then just make that and we''re done. That''s
    the first node.

    2. After that I compare your key to node.key, starting at the root.

    3. If your key is less than or equal to the node.key then I want to go left. If
    your key is greater-than (not equal) then I want to go right.

    4. I keep repeating 3 until I reach a node where the left or right doesn''t exist,
    but that is the direction I need to go.

    5. Once I set that direction (left or right) to a new node for the key and data,
    and set this new node''s parent to the previous node I came from. I will use the
    parent node when I delete.


    This also makes sense how it works. If finding a node going left or right depends
    on how they key compares, then setting a node involves the same thing I I set
    the left or right for a new node.

