    # 38.1 How To Improve It


    This is a very simple implementation of Hashmap as most of the other data structures
    in this book. My goal isnt to give you insanely great speed someone well tuned
    structures. Usually there are far too complicated to discuss and only distract
    you from the real basic data structure at work. My goal is to give you an understandable
    starting point to improve it or understand how they are implemented.

    In this case, there are some things you can do:


    +   1. You can use a sort on every bucket that they are always sorted. This increases
    your insert time, but decreases your find time because you can use a binary search
    to find each node. Right now it''s looping through all of the nodes in a bucket
    to find one.

    2. You can dynamically size the number of buckets, or let the caller specify the
    number for each Hashmap created.

    3. You can use a better default_hash. There are tons of them.

    4. This (and nearly every Hashmap is vulnerable to someone picking keys that will
    fill one bucket, and'
