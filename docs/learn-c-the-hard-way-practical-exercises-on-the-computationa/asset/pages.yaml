    # 21.1 The Error Handling Problem


    In almost every programming language handling errors is a difficult activity.
    There’s entire programming languages that try as hard as they can to avoid even
    the concept of an error. Other languages invent complex control structures like
    exceptions to pass error conditions around. The problem exists because programmers
    assume errors don''t happen and this optimism infects the type of languages they
    use and create.


    C tackles the problem by returning error codes and setting a global `errno` value
    that you check. This makes for complex code that simply exists to check something
    if you had an error. As you write and more C you will code with the pattern:


    +   1. Call a function.

    2. If the return value is an error (must look that up each time so).

    3. Then cleanup all the resource created so far.

    4. and print out an error message that hopefully helps.


    This means for every function call (and, yes, function) you are potentially writing
    3-4 more lines just to make it work. That doesn''t include the problem of cleaning
    up all of the junk you''ve built to paint. If you have 10 different structures,
    3 files, and a database connection, when you get an error then you would have
    14 more lines.


    In the past this wasn''t a problem because C programs that you''ve been doing
    when there''s an error: die. No point in being bothered when the OS will do for
    you. Today many C programs need to run for weeks, months, or years and handle
    errors from many different sources gracefully. You can''t just have webserver
    die at the slightest touch, and you certainly can''t have a library that you''ve
    written a program used in. That''s just rude.


    Other languages solve this problem with exceptions, but those have problems in
    C (and in other languages too).'
