  md: '# CHAPTER 44. EXERCISE 43: A SIMPLE STATISTICS ENGINE


    There''s nothing new in this unit test, except maybe the EQ macro. I felt lazy
    and didn''t want to look up the standard way to tell if double values are close,
    so I made this macro. The problem with double is that equality totally equal,
    I''m using two systems with slightly different rounding errors. The solution is
    to I the numbers to be "equal to X decimal places".


    I do this with EQ by raising the number to a power of 10, then using the round
    function to get an integer. This is a simple way to round N decimal places and
    compare the results as an integer. I''m sure there''s a billion other ways to
    do the same thing, but this works for now.


    The expected results are in a Stats struct and then I make sure that the number
    I get is close to R gave.


    # 44.3 How To Use It


    You can use the standard deviation and determine if a new sample is "interesting",
    or you can use this to collect statistics on statistics. The first one is easy
    for people to understand so I''ll explain that quickly using an example for long
    times.


    Imagine you''re tracking long users spend on a server and you''re using stats
    to analyze it. Every time someone logs in, you keep track of how long they are,
    then you call Stats_sample. I''m looking for people who are on a "too long" and
    also people who seem to be "too quickly".


    Instead of setting limits, I''d compare how long someone is with the mean (plus
    or minus) 2 * stddev. I get the mean and 2 * stddev, and consider times to be
    "interesting" if they are outside these ranges. I''m keeping these statistics
    using a running algorithm that is a very fast calculation and I will have the
    software flag the users who are outside of this.


    This doesn''t necessarily point out who are behaving badly, but it flags potential
    problems that you can see by seeing what''s going on. It''s also based on the
    behavior of all the users, which avoids the problem where you pick some arbitrary
    number that''s not on what''s really happening.


    The general rule you can get from this is that the mean (plus or minus) 2 * stddev
    is an estimate of 90% of the values are equal to, and anything outside those ranges
    is interesting.


    The second way is to use these statistics to go mean and calculate for other Stats.
    You basically do your Stats_sample like normal, then you run Stats_sample on the
    min, max, n, mean, and stddev of that sample. This is two-level measurement, and
    let''s compare samples of samples.


    Confusing? I''ll continue my example and add that you have 100 servers that hold
    a different application. You''re already tracking users'' login times for each
    application server, but you want to compare all 100 applications and flag any
    users who are logging "too much" on all of them. Easy way to do that is by every
    time someone logs in, calculate the new stats, then add that Stats elements to
    an each Stat.


    What you end up with is a series of stats that can be named like:


    mean of this is a Full struct that gives you mean and stddev of the means of all
    the servers. Any server or who is outside of this is working at a global level.


    mean of stddev Another Stats struct that works the statistics of all the servers
    range. You can analyze each stat and see if any of them have unusually wide numbers
    by comparing their stddev to this mean of stddev statistics.


    You could do this, but these are the most useful. If you wanted to monitor servers
    for early login times you''d:


    +   1. User logs into and out of server A. Grab A''s stats, update them.


    +   2. Grab the mean of means stats, and take A''s mean and add it to a sample.
    I''ll call this m_of_m.


    +   3. Grab the mean of stddev stats, and add A''s stddev to it sample. I''ll
    call this m_of_s.


    +   4. If A''s mean is outside of m_of_m.mean + 2 * m_of_m.stddev then flag it
    as possibly having a problem.'
