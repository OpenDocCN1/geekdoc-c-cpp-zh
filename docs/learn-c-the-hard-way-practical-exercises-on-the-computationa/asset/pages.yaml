    One is huge because Valgrind is telling you exactly every problem in your program.
    Starting at the top you''re reading, run Valgrind by line (lines on the left so
    you can follow this):


    +   You do the usual make ex4 and that builds it. Make sure the cc command you
    see is the same and has the -g option or your Valgrind output won''t have line
    numbers.


    +   Notice the compiler is also yelling at you about this source file and warns
    you that you have "too few arguments for format". That''s where you forget to
    include the age variable.


    +   Then you run your program using valgrind ./ex4.


    +   14-18 On line 15 (ex4.c11) (read as "the main function in file ex4.c at line
    11) you have "Use of uninitialized size of 6". You find this by looking at the
    error, then you see that''s called a "stack trace" right under that. The line
    to look at first (ex4.c11) is the bottom one, and if you don''t see it going when
    you run so, you''d try print.c:35. Typically it''s the bottom most line that matters
    (in this case, on 18).


    +   20-24 Next error is another one of line ex4.c:11 in the main function. Valgrind
    hates this line. This error can comes of if-statement or while-loop happened that
    was based on an uninitialized variable, in this case.


    +   25-35 The remaining errors are more of the same because the variable keeps
    getting used.


    Finally the program exits and Valgrind tells you a summary of how bad your program
    is.

    That quite a lot of information to take in, here''s how you deal with:


    +   1. Whenever you run your C code and get it working, rerun it under Valgrind
    to check.


    +   2. For each error that you get, go to the source:line indicated and fix it.
    You may have to search online for the error message to figure out what it means.


    +   3. Once your program "Valgrind pure" then it should be good, and you have
    probably learned about how you write code.


    In this exercise I''m not expecting you to fully grasp Valgrind right away, but
    instead get it installed and learn how to use it quick so we can apply it to all
