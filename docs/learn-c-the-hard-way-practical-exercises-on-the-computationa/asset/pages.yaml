  md: '# 18. HOW TO BREAK IT


    prevents memory leaks if the variable is on the stack.


    The easiest way to keep this strict is with this mantra: If you didn''t get it
    from malloc or a function that got it from malloc, then it''s on the stack.


    There''s three primary problems with stacks and heaps to watch for:


    +   1. If you get a block of memory from malloc, and then that pointer on the
    stack, when the function exits, the pointer will popped off and lost.


    +   2. If you put too much data on the stack (like large structures and arrays)
    then you can cause a "stack overflow" and the program will revert. In this case,
    use the heap with malloc.


    +   3. If you take a pointer to something on the stack, and then pass that or
    return it from your function, the function receiving it will "segmentation fault"
    (segfault) the actual data will popped off and disappear. You''ll be pointing
    dead space.


    This is why in the program I created a Database_open that allocates memory or
    dies, and then a Database_destroy frees everything. I created a "create" function,
    makes the whole thing or nothing, and a "destroy" function that cleans up everything,
    then it''s easier to keep it straight.


    Finally, when a program exits the OS will clean up the resources for you, but
    not immediately. A common idiom (and one I use in this exercise) is to just abort
    and let the OS clean up on error.


