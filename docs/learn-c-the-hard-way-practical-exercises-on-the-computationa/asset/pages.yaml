    # # Exercise 22: The Stack, Scope, And Globals


    The concept of "scope" seems to confuse quite few people when they first start
    programming. Originally it came from the use of the system stack (which we lightly
    covered earlier) and how it was used to store temporary variables. In this exercise,
    we''ll learn about how a stack data structure, and then feeding that back into
    how modern C does scoping.


    The real purpose of this exercise is to learn where the hell things live in C.
    When someone doesn''t grasp the concept of scope, it''s always a failure in understanding
