    # 23.2 Scope, Stack, and Bugs


    If you''ve done this now see some of the different ways you can change variables
    in your C code. You can use extern or access functions like get_age to create
    globals. You can make new variables inside blocks, they retain their own value
    until blocks exits, leaving the outer variables alone. You can also pass a value
    to a function, and change the parameter but not change the caller''s version of
    it.


    The most important thing to realize is that all of these bugs. C safety is to
    place things in places in your machine and let you access it in those places you
    get confused easily about where something lives. If you don''t leave it there''s
    a case you won''t manage properly.


    With in mind, here are some rules to follow when writing code so you avoid bugs
    related to the stack:


    +   - not "shadow" a variable like this with count It leaves you open to subtle
    and hidden bugs when you think you are changing a value and you actually aren''t.'
