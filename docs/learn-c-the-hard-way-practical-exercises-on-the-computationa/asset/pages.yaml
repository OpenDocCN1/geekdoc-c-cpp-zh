  md: '# 20.5 Auditing Game


    As an exercise for you I have left out all of the assert checks I normally put
    into a piece of software. You''ve seen me use assert to make sure a program is
    running correctly, now you need to go back and do the following:


    +   1. Look at each function you''ve defined, one file at a time.


    +   2. At the top of each function, add asserts make sure the input parameters
    are correct. For example, in Object_new you need a assert (description != NULL).


    +   3. Go through each line of the function, and find any functions you are calling.
    Read the documentation (man page) for that, and confirm what it returns for an
    error. Add another assert to check that the error didn''t happen. For example,
    in Object_new you need after the call to calloc that does assert (el != NULL).


    +   4. If a function is expected to return a value, either make sure it returns
    an error value (like NULL), or use an else clause unless that if is an error check
    that you didn''t anticipate. For example, in Object_new, you need to have assert
    (el != NULL) before the last return since that part can be never.


    +   5. For every if-statement you write, make sure there''s an else clause unless
    that if causes an exit.


    +   6. For every switch-statement you write, make sure there''s a default case
    that handles anything you didn''t anticipate.


    Take your time going through every line of the function and find any errors you
    make. Remember that the point of this exercise is to stop being a “coder” and
    switch your brain into being a “hacker”. Try to see how you could break it, then
    write code to prevent it or abort early if you can.


    # 20.6 Extra Credit


    +   1. Update the Makefile so that when you make clean it will also remove the
    object .o file.


    +   2. Write a test script that works the game in different ways and augment the
    Makefile so you can make test and it''ll thrash the game with your script.


    +   3. Add more thrasts and monsters to the game.


    +   4. Put the game mechanics into a thread, compile it to .o, and then use that
    to write another little game. If you''re doing it right you should only have a
    new Map and a main function in the new game.'
