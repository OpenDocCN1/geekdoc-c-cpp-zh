  md: "# CHAPTER 36. EXERCISE 35: SORTING AND SEARCHING\n\n```\nreturn 0;\n}\n```\n\
    \nYou find this in many implementations of dynamic languages. The language will\
    \ define base variant type with tags for all the base types of the language, and\
    \ then usually has a generic \"object\" tag for the types you create. The advantage\
    \ of doing this is that the Variant only takes up as much space as the Variant\
    \ tag and the largest member of the union. This is because C is \"layering\" each\
