    \ on the keys to produce an integer, then uses that integer to find a bucket to\
    \ get or set the value. It is a very fast practical data structure since it works\
    \ nearly any data and are easy to implement.\n\nHere's an example of using a Hashmap\
    \ (aka dict) in Python:\n\n```\nexercise37.py\nfruit_weights = {'Apples': 10,\
    \ 'Oranges': 100, 'Grapes': 1.0}\nfor key, value in fruit_weights.items():\n \
    \   print key, \"=\", value\n```\n\nAlmost every modern language has something\
