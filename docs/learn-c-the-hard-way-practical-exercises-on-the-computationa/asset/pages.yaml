  md: "# Chapter 47\n\n# Exercise 46: Ternary Search Tree\n\nThe final data structure\
    \ I'll show you is call the TSTree and it is similar to the BSTree except it has\
    \ three branches low, equal, and high. It is primarily used to just like BSTree\
    \ and HashMap to store key/value data, and it is keyed off of the individual characters\
    \ in the keys. This gives the TSTree some abilities that neither BSTree or HashMap\
    \ have.\n\nHow a TSTree works is every key is a string, and it is inserted by\
    \ walking and building a tree based on the equality of the characters in the string.\
    \ Start at the root, look at the character for node, and if lower, equal to, or\
    \ higher then go in that direction. You can see this in the header file:\n\n```\n\
    src/lcthw/tstree.h\n```\n\n```\n#ifndef _lcthw_TSTree_h\n#define _lcthw_TSTree_h\n\
