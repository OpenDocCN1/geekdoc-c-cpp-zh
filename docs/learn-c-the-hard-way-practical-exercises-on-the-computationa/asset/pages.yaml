  md: '# Chapter 46


    # Exercise 45: A Simple TCP/IP Client


    I''m going to use the RingBuffer to create a very simplistic little network testing
    tool netclient. To do this I have to add some stuff to the Makefile to handle
    little programs in the bin/ directory.


    # 46.1 Augment The Makefile


    First, add a variable for the programs just the unit tests TESTS and TEST_SRC
    variables:


    ```

    PROGRAMS_SRC=$(wildcard bin/*.c)

    PROGRAMS=$(patsub %.c,%,$(PROGRAMS_SRC))

    ```


    Then you want to add the PROGRAMS to the all target:


    ```

    all: $(TARGET) $(SO_TARGET) tests $(PROGRAMS)

    Then add PROGRAMS to the rm line in the clean target:

    rm -rf build $(OBJECTS) $(TESTS) $(PROGRAMS)

    ```


    Finally you need a target at the end to build them:


    ```

    $(PROGRAMS): FLAGS += $(TARGET)

    ```


    With these changes you can drop simple .c files into bin and make will build them
    and link them to the library just like the tests are done.


