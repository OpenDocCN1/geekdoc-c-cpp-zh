  md: "```\ncase 'o':\n    printf(\"%d: 'O\\n\", i);\n    break;\n\ncase 'u':\n  \
    \  case 'U':\n        printf(\"%d: 'U\\n\", i);\n        break;\n\ncase 'y':\n\
    \    case 'Y':\n        if(i > 2) {\n            // it's only sometimes Y\n  \
    \          printf(\"%d: 'Y\\n\", i);\n        }\n        break;\n\n    default:\n\
    \        printf(\"%d: %c is not a vowel\\n\", i, letter);\n```\n\nIn this program\
    \ we take a command line argument and print out all the vowels in an incredibly\
    \ tedious way to demonstrate how a switch-statement works. Here's how the switch-statement\
    \ in the program where the switch-statement starts, let's call this location Y.\n\
    \n+   1. The compiler marks the place in code\n2. It evaluates the expression\
    \ in switch(letter) to come up with a number. In this case the number will be\
    \ the raw ASCII of the letter argv[1].\n3. The compiler also translated each of\
    \ the case blocks like case 'A': into a location in the program that is far away.\n\
    4. It then does the program figure out where Y-letter is located in the switch-statement,\
    \ and if it's too far it adjusts it to Y+default.\n5. Once it knows the location,\
    \ the program jumps to that spot in the code, and continues running. This is why\
    \ you use break on some of the cases, but not others.\n6. If 'a' is entered, it\
    \ jumps to case 'a', there's no break so it falls through to the one under it\
    \ case 'A' which has a code and a break.\n7. Finally it runs this code, the break\
    \ exits out of the switch-statement entirely.\n\nThis is a deep dive into how\
    \ the switch-statement works, but in practice you just have to remember a few\
    \ rules:\n1. Always include a default: branch so that you catch any missing.\n\
    2. Don't allow \"fall through\" unless you really want it, and it's a good idea\
    \ to add a comment //fallthrough so people know it's on purpose.\n3. Always write\
    \ the case and the break before you write the code that goes in.\n4. Try to just\
    \ use if-statements instead if you can."
