  md: '# Chapter 30


    # Exercise 29: Libraries And Linking


    A central part of any C program is in the ability to link it to libraries that
    your operating system provides. Linking is how you get additional features for
    your program that someone else created and packaged on the system. You''ve been
    using some standard libraries that are automatically included, but I''m going
    to explain the different types of libraries and what they do.


    First off, libraries are poorly designed in every programming language. Language
    designers think of linking as something they just slap on later. They are usually
    confusing, hard to deal with, can''t do versioning, and end up linked differently
    everywhere.


    C is different, but the way linking and libraries are done is an artifact of the
    Unix operating system and executable files were designed years ago. Learning how
    C links things helps you understand how your OS works and how it runs your programs.


    To start off there are two basics of libraries:


    static You''ve made one of these when you used ar and ranlib to create the libYOUR_LIBRARY
    in the last exercise. This kind of library is nothing more than a container for
    a set of .o object files and functions, and you can treat it like big .o when
    building your programs.


    dynamic These typically include .dll or about 1 million others on OSX depending
    on the version and who was working that day. Seriously though, OSX adds .dylib,
    .bundle, and .framework without much distinction between the three. These files
    are built and then placed in a common location. When you run your program the
    OS loads these files and links them to your program on fly.


    I tend to like static libraries for small to medium sized projects because they
    are easier to deal with and work on more operating systems. I like to put all
    of the code in a static library so that I can link it to your tests and to the
    files as needed.


    Dynamic libraries are for larger systems, when space is tight, or if you have
    a large number of programs that use common functionality. In this case you don''t
    want to statically link all the code for the common features to every program,
    so you put it in a dynamic library so it is loaded once for all of them.


    In the previous exercise I laid out how to make a static library (a .a file) and
    that''s what you''ll use in the rest of the book. In this exercise I''m going
    to show you how to make a .so library, and how to dynamically load it with the
    unix dlopen function. I''ll do this manually so that you understand everything
    that''s actually happening, then the Extra Credit will be to use the c-skeleton
    to create it.


    # 30.0.1 Dynamically Loading A Shared Library


    To do this we will create two source files. One will be to make a libex29.so library,
    the other will be a program called ex29 that can load this library and run functions
    from it.'
