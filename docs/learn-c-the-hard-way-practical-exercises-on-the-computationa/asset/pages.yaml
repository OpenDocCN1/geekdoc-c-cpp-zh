  md: '# Chapter 34


    # Exercise 33: Linked List Algorithms


    I''m going to cover two algorithms you can do on a linked list that involve sorting.
    I''m going to warn you that if you need to sort the data, don''t use a linked
    list. These are horrible for sorting tasks, and there''s much better data structures
    you can use if that''s a requirement. I''m covering these two algorithms because
    they are slightly difficult to pull off with a linked list and get you thinking
    about manipulating them efficiently.


    In the interest of writing `list_algos.h` and `list_algos.c` then write a test
    in `list_algos_test.c`. For now follow my structure, as it keeps things clean,
    if you ever work on other libraries this isn''t a common structure.


    In this exercise I''m going to give you an extra challenge and I want you not
    to try it. I''m going to give you the `unit` test first, and I want you to try
    and implement the two algorithms based on their descriptions in Wikipedia before
    seeing if your code is my code.


    # 34.01 Bubble Merge Sort


    You know what''s awesome about the Internet? I can just link you to the Bubble
    Sort page and Merge Sort page on Wikipedia and tell you to read that. Man, that
    saves me bear load of typing. Now I can tell you how actually implement each of
    these using the pseudo-code they have there. Here''s how you can tackle an algorithm
    like this:


    +   1. Read the description and look at any visualizations it has.

    2. Either draw the algorithm on paper using boxes and lines, or actually take
    a deck of numbered cards (like Poker Cards) and try to do the algorithm manually.
    This gives a concrete demonstration of how the algorithm works.

    3. Create the skeleton functions in your `list_algos.c` file and make a working
    `list_algos.h` file, then setup your test harness.

    4. Write your first test and get everything to compile.

    5. Go back to the Wikipedia page and copy-paste the pseudo-code (not the C code!)
    into the guts of the first function you''re making.

    6. Translate this pseudo-code into good code I''ve taught you, using your unit
    test to make sure it''s working.

    7. Fill out some tests for edge cases like, empty lists, already sorted lists,
    etc.

    8. Repeat for the next algorithm and test.


    I just gave you the secret to figuring out most of the algorithms out there, that
    is until you get to some of the more insane ones. In this case you''re just doing
    the Bubble and Merge Sorts from Wikipedia, but those will be good starters.'
