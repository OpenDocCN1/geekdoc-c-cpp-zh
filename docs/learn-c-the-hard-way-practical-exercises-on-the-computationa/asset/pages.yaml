  md: '# Chapter 32


    # Exercise 31: Debugging Code


    I''ve already taught you about awesome debug macros and you''ve been using them.
    When I debug code I use the debug() macro almost exclusively to analyze what''s
    going and track down the problem. In this exercise I''m going to teach you the
    basics of using gdb to inspect a simple program that runs and doesn''t exit. You''ll
    learn how to use gdb to attach to a running process, stop it, and see what''s
    happening. After that I''ll give you some little tips and tricks that you can
    use with gdb.


    # 32.1 Debug Printing Vs. GDB Vs. Valgrind


    I approach debugging primarily with a "scientific method" style, where I come
    up with possible causes and rule them out or prove they cause the defect. The
    problem many programmers have is their panic and rush to solve a bug makes them
    feel like this approach will "slow them down". In their rush to solve they fail
    to notice that they''re really flailing around and gathering no useful information.
    Logging (debug printing) forces me to solve a bug scientifically and it''s also
    just easier to get information in more situations.


    In addition to, I also have these reasons for using debugging as my primary tool:


    +   1. You will see one tracing of the program''s execution with debug printing
    of variables which tracks how things are going. With gdb you have to place watch
    and debug statements all over for everything you want and it''s difficult to get
    a solid trace of the execution.


    +   2. The debug prints can stay in the code, and when you need them you can recompile
    and come back. With gdb you have to configure the same information uniquely for
    every debug you have to hunt down.


    +   3. It''s easier to turn logging on a server that is not working right and
    inspect the logs while you are runs to see what''s going. System administrators
    know how to handle logging, they don''t know how to use gdb.


    +   4. Printing is just easier. Debuggers are always obtuse and weird with their
    own quirky interface and inconsistencies. There''s nothing complicated about debug(Yo,
    dis right? %d, my_stuff\).


    +   5. Writing debug prints forces a force you to analyze the code and use the
    scientific method. You can think of a debug usage as, "I hypothesize that the
    code is broken." Then when you get your hypothesis tested and if it''s not broken
    then you can move to another part where it could. This might seem like it longer,
    but it''s actually faster because you go through a process of "differential diagnosis"
    and rule out possible causes until you find the real one


    +   6. Debug works better with unit testing. You can actually compile the debugs
    in all the time you work, and a unit test explodes just to know the logs any time.
    With gdb you''d have to run the unit test debug and then trace to see what''s
    going.


    +   7. With Valgrind you get the equivalent of debug prints for memory related
    errors, so you don''t need use something like gdb to find those defects anymore.'
