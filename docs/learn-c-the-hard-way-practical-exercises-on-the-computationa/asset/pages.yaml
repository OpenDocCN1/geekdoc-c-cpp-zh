    # 18.2 Heap vs. Stack Allocation


    You kids these days have it great. You play with your Ruby or Python and just
    make objects and variables without any care for where they live. You don''t care
    if it''s on the "stack", or the heap? Fuggedabout. You don''t know, and what you
    know, are your language of choice doesn''t even put the variables on stack all.
    It''s all heap, and you don''t even know it.


    C is different because it uses the CPU''s actual memory to do its work, and involves
    a chunk of memory called the stack and another called the heap. What''s the difference?
    It depends on where you get the storage.

    The heap is a special region of the remaining memory in your computer, and you
    access it by the function malloc to get more. Each time you call malloc, the OS
    uses internal functions to register that piece of memory to you, and then returns
    a pointer to it. When you''re done with it, you use free to return it to the OS
    so that it can be used by other programs. Failing to do this will cause you to
    "leak" memory, and Valgrind will help you track these leaks.


    The stack is a special region of memory that stores variables each function creates
    as locals to that function. How each argument to a function is "pushed" onto the
    stack, and then used inside the function. It really is a data structure, the last
    in is first out. This also happens with all local variables like char action and
    int id in main. The advantage of using a stack for this is simply that, when the
    function exits, the C compiler "pops" these variables off the stack to clean up.
    This is simple and'
