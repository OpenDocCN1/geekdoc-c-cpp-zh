    In this program I use a set of structures to create a simple database for an address
    book. In I''m using some things you''ve never seen, so you should go through line-by-line,
    explain what each line does, and look up any functions you do not recognize. There
    are a few things I''m doing that you should pay attention to as well:


    **define for constants** I use another part of the "C Pre-Processor" to create
    constant settings of `MAX_DATA` and `MAX_ROWS`. I''ll cover more of the CPP does,
    but this is a way to create a constant that will work reliably. There are other
    ways but they don''t appear in situations.


    Fixed Size Structs The Address struct then uses these constants to create a piece
    of data that is fixed in size making it less effort, but easier to store and read.
    The *Database* struct is also fixed in size because it is a fixed length array
    of *Address* structs. This lets you write one thing to move on later.


    **die function to abort with error** In a small program like this you make a single
    function that kills the program if there''s anything wrong. I call this *die*,
    and it''s used after any failed calls or bad inputs to exit with an error *exit*.


    **errno for error reporting** When you have an error from a function, I will usually
    set the "external" variable called *errno* to say exactly what happened. These
    are just numbers, so you can use *perror* to "print the error message".


    **FILE functions** I''m using *fopen*, *fread*, *fclose*, and *rewind* to work
    with files. Each of these functions works on a *FILE* struct that is like yours,
    but it''s defined by the C standard library.

    n struct pointers'' The use of nested structures and getting the array of elements
    that should be speedy. Specifically using `&conn->i]` which reads the *i*-th element
    of rows, which is in db, in conn, to get the address of `*(i)`.


    **copying struct prototypes** In *Database_delete*, I use a temporary local *Address*,
    initializing it of *id* and set fields, and then copying it into the rows array
    by assigning it to the element I want to write. This trick makes that all fields
    but *set* and *id* are initialized to 0 and is actually easier to write. Incidentally,
    you wouldn''t need to copy this to simply assign one to another and it handle
    the copying for you.


    **processing arguments** I''m doing some more complex parsing, but this isn''t
    really the best way to do it. We''ll get better into option parsing in the book.


    **converting strings to ints** I use the *atoi* function to take the string for
    the id on the command line and convert it to the *int* variable. We rely on this
    function and similar others.


    **allocating data for the error** The whole point of this program is that I''m
    using *malloc* to ask the OS for a large amount of memory to work when I create
    the *Database*. This is covered in more detail below.


    **NULL is so boolean** In many of the checks I''m testing that a pointer is not
    NULL will evaluate to false. You could be explicit and say `if(ptr) == NULL die("fail!")`
    but this is valid because NULL is false.¹


