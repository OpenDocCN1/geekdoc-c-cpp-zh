  md: "```\n237 \t)\n238 \\}\n239 return BST_delete data;\n240 \n241 }\n```\n\nBefore\
    \ getting into BST_delete I want to explain a pattern I'm using for doing recursion\
    \ calls in a sane way. You'll find that many tree base data structures are easy\
    \ to write if you use recursion, and that formulating a recursive function is\
    \ difficult. Part of the problem is that you need to set up some initial data\
    \ for the first operation, then recurse into the data structure, which is hard\
    \ to do with one function.\n\nThe solution is to use two functions. One \"sets\
    \ up\" the structure and initial recursion conditions so that a second function\
    \ can do the work. Take a look at BST_get first to see what I mean:\n\n+   1.\
    \ Have an initial condition to handle if map->root is NULL return NULL and don't\
    \ recurse.\n\n+   2. In a setup to call a real recursion, which is in BST_get.\
    \ I can create the initial condition of the root node to start, with the key,\
    \ and the map.\n\n+   3. In the BST_get_node I do the actual recursive logic.\
    \ I compare the keys with map->compare (node->key) and go left, right\n\n+   4.\
    \ Since this function is \"self-similar\" and doesn't have to handle any initial\
    \ conditions (because BST_get does) it can recurse very simply. When it's done\
    \ to the caller, and then it comes back to BST_get_result.\n\n+   5. At the end,\
    \ the BST_get_then handles the node_data element but only if the result isn't\
    \ NULL.\n\nThis way of structuring a recursive algorithm matches the way I use\
    \ my recursive data structures. I have an initial \"base\" function that handles\
    \ initial conditions and some edge cases, then it calls a recursive function that\
    \ does the work. Compare with what I have a \"base\" in BST combined with BSTNode\
    \ structures that all reference each other tree. This pattern makes it easy to\
    \ debug recursion and keep it straight.\n\nNext, look at BST_see and BST_set_node\
    \ to see the same pattern going on. I use BST_set to configure the initial conditions\
    \ and edge cases. A common edge case is that there's no root node, so I have to\
    \ make one to get things started.\n\nThis pattern will work with any recursive\
    \ algorithm you have to figure out. The way I do this is follow this pattern:\n\
    \n+   1. Output the initial variables, how they change, and what the stopping\
    \ conditions are for recursive step.\n\n+   2. Write a recursive function that\
    \ calls itself, with arguments for each stopping condition and initial variable.\n\
    \n+   3. Write a setup function to set initial conditions for the algorithm and\
    \ handle edge cases, then it calls the recursive function.\n\n+   4. Finally,\
