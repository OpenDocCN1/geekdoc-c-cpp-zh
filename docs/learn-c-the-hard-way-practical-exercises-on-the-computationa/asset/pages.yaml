  md: "# Chapter 41\n\n# Exercise 40: Binary Search Trees\n\nThe binary tree is the\
    \ simplest tree data structure and while it has been replaced by Hash Maps in\
    \ many languages indexes, still useful for many applications. Variants of the\
    \ binary tree exist for very useful things like database indexes, search algorithm\
    \ structures, and even graphics processing.\n\nI'm calling my binary tree BTree\
    \ for \"binary search tree\" and the best way to describe it is that it's another\
    \ way to do a HashMap style key/value store. The difference is that instead of\
    \ hashing the key to find a location, the BTree compares the nodes in a tree,\
    \ and walks the tree to find the best place to store it based how it compares\
    \ to other nodes.\n\nBefore I really explain how this works, let me show you the\
    \ bstree.h header file so you can see the data structures, then I will use to\
    \ explain how it's built.\n\n```\n#ifndef _lctw_BSTree_h\n#define _lctw_BSTree_h\n\
    \ntypedef int (*BSTree_compare)(void *a, void *b);\n\ntypedef struct BSTNode {\n\
    \    void *key;\n    struct BSTNode *left;\n    struct BSTNode *right;\n    struct\
    \ BSTNode *parent;\n} BSTNode;\n\ntypedef struct BSTree {\n    int count;\n  \
    \  BSTree_compare compare;\n    BSTNode *root;\n} BSTree;\n\ntypedef int (*BSTree_traverse_cb)(BSTNode\
    \ *node);\nBSTree *BSTree_create(BSTree_compare compare);\nvoid BSTree_destroy(BSTree\
    \ *map);\n\nint BSTree_set(BSTree *map, void *key, void *data);\n```"
