    # 24.2.1 Why Other?


    When you''ve figured out how it works, the final question is: Why would you ever
    want to do this? The purpose of this is to manually "loop unfolding". Large long
    loops can be slow, one way to speed them up is to find some fixed chunk of the
    loop, and then just duplicate the code in the loop out that many times sequentially.
    For example, if you know a loop runs a minimum of 20 times, then you can put the
    contents of the loop in 20 times the source code.

    Duff''s device is basically doing this automatically by chunking up the loop into
    8 chunks. It''s clever and actually works, but these days a good compiler will
    do this for you. You shouldn''t need this except in the rare case where you have
    proven it improve your speed.


