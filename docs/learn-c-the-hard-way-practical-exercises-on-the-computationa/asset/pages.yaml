    # Exercise 20: Zed’s Awesome Debug

    Macros


    There is a constant problem in C that you have been dancing around but which I
    am going to solve in this exercise using a set of macros I developed. Right now
    you won''t realize how awesome they are, so you''ll just have to use them and
    then you will realize later. You can walk up to me one day and, "Zed, those Debug
