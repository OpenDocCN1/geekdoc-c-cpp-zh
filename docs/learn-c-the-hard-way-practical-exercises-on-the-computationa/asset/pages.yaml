    # ## Exercise 32: Double Linked Lists


    The purpose of this book is to teach you how your computer really works, and included
    in that is how various data structures and algorithms function. Computers by themselves
    don''t do a lot of useful processing. To make them useful things you need to structure
    the data and then organize processing of these structures. Other programming languages
    either include libraries that implement all of these structures, or they have
    direct syntax for them. C makes you implement all the data structures you need
    yourself, which makes it the perfect language to learn how they actually work.


    My goal in teaching you these data structures and these algorithms is to help
    you do three things:


    +   1. Understand what is really going on in Python, Ruby, or JavaScript code
    like: data = {"name":"Zed"}

    2. Get even better at C code by applying what you know to a set of solved problems
    using the data structures.

    3. Learn a core of data structures and algorithms so that you are better informed
    about what ones work best in situations.


    # ## 33.1 What Are Data Structures


    The name "data structure" is self-explanatory. It is an organization of data that
    fits a certain model. Maybe the model is designed to allow processing the data
    in a new way. Maybe it''s organized to store it on disk efficiently. In this book
    I''ll follow a simple pattern for making data structures that works reliably:


    +   1. Define a struct for the main "outer structure"

    2. Define a struct for the contents, usually nodes with links between them.

    3. Create functions that operate on this two.


    There''s other styles of data structures in C, but this pattern works well and
    is consistent for most data structures you''ll make.


    # ## 33.2 Making the Library


    For the rest of this book you''ll be creating a library that you can use when
    you''re done with this book. This library will have the following elements:


    +   1. Header (.h) files for each data structure.

    2. Implementation (.c) files for the algorithms.

    3. Unit tests that test all of them to make sure they keep working.'
