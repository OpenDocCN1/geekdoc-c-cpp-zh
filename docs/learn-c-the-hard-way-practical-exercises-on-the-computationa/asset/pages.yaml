  md: '# Chapter 27


    # Exercise 26: Write A First Real Program


    You are at the half-way mark in the book, so you need to take a mid-term. In this
    mid-term you''re going to recreate a simple piece of software I wrote specifically
    for this book called devpkg. You''ll extend it in a few key ways and improve the
    code, most importantly by writing some unit tests for it.


    Note 7 WARNING: Beta Draft Content


    I wrote this exercise before writing some of the exercises you might need to complete.
    If you are attempting this one now, please keep in mind that the software you
    might have problems because of my mistakes, and you might not know everything
    you need to finish. If so, tell me at help@learncethehardway.org and wait until
    I finish the other exercises.


    # 27.1 What Is devpkg?


    devpkg is a simple C program that installs other software. I made it specifically
    for this book as a way to teach you how a real software project is structured,
    and how to use other people''s libraries. It uses a portability library called
    The Apache Portable Runtime (APR) that has many C functions which work on tons
    of platforms, including Windows. Other than that, it grabs code from the internet
    (or local files) and does the usual ./configure; make; make install every programmer
    does.


    Your goal in this exercise is to build devpkg from source, finish each Challenge
    I give, and use the source to understand what devpkg does and why.


    # 27.1.1 What We Want To Make


    We want a tool that has three commands:


    +   - devpkg -S Sets up a new install on a computer.

    devpkg -I Installs a piece of software from a URL.

    devpkg -L Lists all the software that''s been installed.

    devpkg -B Builds some code for manual building.


    We want devpkg to be able to take almost any URL, figure out what kind of project
    it is, download it, install it, and register that it downloaded that software.
    We''d also like it to process a simple dependency list so it can install all the
    software that a project might need as well.'
