    \ without the clearer triple-triple equity. The original code also has a while-loop\
    \ without braces, but an if-statement with braces, which leads to even more confusion:\n\
    \n> Braces Are Free, Use Them\n\n```\n/* bad use of while loop with compound if-statement\
    \ */\nwhile ((len = getline(line, MAXLINE)) > 0)\n    if (len > max) {\n     \
    \   max = len;\n        copy(longest, line);\n    }\nif (max > 0) /* there was\
    \ a line */\n    printf(\"%%s\", longest);\n```\n\nThis code is incredibly error\
    \ prone because you can't easily tell where the pair of if-statements and the\
    \ while-loop are paired. A quick glance makes it seem like this while-loop will\
    \ loop both if-statements, but it doesn't. modern C code you would instead use\
    \ braces all the time and avoid the confusion completely.\n\nWhile the book could\
    \ be forgiven for this because of its age, it has been republished in this form\
    \ 42 times, and it was updated for the ANSI standard. At some point in history\
