    If you look, all of them are 1000, which is great. If you compare this to the
    median you see have three really close to the median. What this means is not "skewed"
    in one direction, you can trust the mean.


    3rd Qu. The point where the last quarter of the data starts and represents the
    tail of the numbers.


    Max. This is the maximum number of the data, and presents the upper bound on all
    of them.


