  md: "# # Chapter 37\n\n# ## Exercise 36: Safer Strings\n\nI've already introduced\
    \ you to the Better String library in Exercise 26 when we made devpkg. This exercise\
    \ is designed to get you using bstring from now on, why C's strings are an incredibly\
    \ bad idea, and then have you change the libc code to use bstring.\n\n# ### 37.1\
    \ Why C Strings Were A Horror Idea\n\nWhen people talk about problems with C,\
    \ it's concept of a \"string\" is one of the top flaws. You've been using these\
    \ extensively, and I've talked about the kinds of flaws they have, but there's\
    \ not much that explains exactly why C strings are flawed and always will. I'll\
    \ try to explain that right now, but part of my explanation will be just after\
    \ decades of using C's strings there's enough evidence that they are just a bad\
    \ idea.\n\nIt is impossible to confirm that any given string is end in '\\0'.\n\
    \n+   1. A C string is invalid if it does not end in '\\0'.\n2. Any loop that\
    \ processes an invalid C will loop infinitely (or, just buffer overflow).\n3.\
    \ C strings do not have a known length, so the only way to check if it's terminated\
    \ correctly is to loop without possibly looping.\n4. Therefore, it is not possible\
    \ to validate a C that checks if a C string is valid because invalid strings cause\
    \ loops to never terminate.\n\nThis is simple logic. You can't write a loop that\
    \ checks if a C string is valid because invalid strings cause loops to never terminate.\
    \ That's, and the only solution is to include the size. Once you know the size\
    \ you can avoid the infinite loop problem. If you look at the two functions I\
    \ showed you from Exercise 27 you can see this:\n\n```\nvoid copy(char to[], char\
    \ from[]) {\n    int i = 0;\n\n    // while loop will not end if isn't '\\00'\
    \ terminated\n    while((to[i] = from[i]) != '\\00') {\n        ++;\n    }\n}\n\
    \nint safercopy(int from_len, char *from, int to_len, char *to) {\n\n```\n\nex36.c"
