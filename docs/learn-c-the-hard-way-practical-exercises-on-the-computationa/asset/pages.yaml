    # 32.5 GDB Tricks


    Here''s a list of simple tricks you can do with GDB:


    +   - **gdb --args** Normally gdb takes arguments you give it and assumes they
    are for itself. Using --args passes them

    to the program.

    - **thread apply all bt** Dumps a backtrace for all threads. Very useful.

    - **gdb -batch -ex r -ex bt -ex q -args** Runs the program so that, if it bombs
    you get a backtrace.

    - Got one? Leave it in the comments.


    # 32.6 Extra Credit


    +   1. Find a graphical debugger and compare using it to raw gdb. These are useful
    when the program you''re looking at is local, but they are pointless if you have
    to debug program on a server.

    2. You can enable "core dumps" on your OS, and when a program crashes you''ll
    get a core file. This core file is like a post-mortem of the program so you can
    load up what happened at the crash and see what caused it. Change ex31.c so that
    it crashes after a few iterations, then try to get a core dump and analyze it.'
