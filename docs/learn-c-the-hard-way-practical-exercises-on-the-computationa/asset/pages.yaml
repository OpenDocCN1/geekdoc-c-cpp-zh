  md: "# Chapter 14\n\n# Exercise 13: Switch Statement\n\nIn other languages like\
    \ Ruby you have a switch-statement that can take any expression. Some languages\
    \ like Python just don't have a switch-statement since an if-statement with boolean\
    \ expressions is about the same thing. For these languages, switch-statements\
    \ are more alternatives to if-statements and work the same thing internally.\n\
    \nThe switch-statement is actually entirely different and is really a \"jump table\"\
    . Instead of random expressions, you can only pull expressions that result in\
    \ integers, and these integers are used to calculate jumps from the top of the\
    \ switch to the part that matches that value. Here's some code that we will break\
    \ down to understand this concept of \"jump tables\":\n\n```\nc\n#include <stdio.h>\n\
    \nint main(int argc, char *argv[]) {\n    if(argc != 2) {\n        printf(\"ERROR:\
    \ You need one argument.\\n\");\n        // this is how you abort a program\n\
    \        return 1;\n    }\n\n    int i = 0;\n    for(i = 0; argv[1][i] != '\\\
    0'; i++) {\n        char letter = argv[1][i];\n\n        switch(letter) {\n  \
    \          case 'a':\n            case 'A':\n                printf(\"%d: 'A'\\\
    n\", i);\n                break;\n\n            case 'e':\n            case 'E':\n\
    \                printf(\"%d: 'E'\\n\", i);\n                break;\n\n      \
    \      case 'i':\n            case 'I':\n                printf(\"%d: 'I'\\n\"\
    , i);\n                break;\n        }\n    }\n}\n```"
