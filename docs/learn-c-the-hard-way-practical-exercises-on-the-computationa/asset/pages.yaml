    of X length you can find any key in Y moves. You can also find the biggest key
    in the tree is 10 characters long, then you can find any prefix in 10 moves. More
    importantly, you can do all of this by comparing each character of the key once.


    Looking at TTree_search_prefix you can start to see the second advantage a TTree
    has over the BST and Hashmap. For finding strings, TTree is much better because
    you can find the first prefix in X moves,


    In comparison, to do the same with a BST you would have to check the prefixes
    of each character in possibly matching node in the BST against the characters
    in prefix. It''s the same for finding keys, or seeing a key doesn''t exist. You
