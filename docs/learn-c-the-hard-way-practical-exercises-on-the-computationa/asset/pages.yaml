- img_proc: true
  md: '# The Design


    To accomplish this goal devpkg will have a simple design:


    **Use external commands** You''ll do most of the work through external commands
    like curl, git, and tar. This reduces the amount of code devpkg needs to get things
    done.


    **Simple File Database** You can easily make it more complex, but you''ll start
    to just make a simple file database at /usr/local/.devpkg to keep track of what''s
    installed.


    /usr/local Always You can make this more advanced, but for starters just assume
    it''s /usr/local which is a standard install path for most software on Unix.


    **configure, make, install** It''s assumed that most software can install with
    just a configure; make install and maybe configure is optional. If the software
    can''t at a minimum to do, then there''s some options to modify the commands,
    otherwise devpkg won''t bother.


    **The User Can Be Root** We''ll assume the user can root using sudo, but that
    they don''t want to root until the end.


    This will keep our simple at first and work well enough to get it going, at which
    point you''ll be able to modify it further for this exercise.


    # 27.1.3 The Apache Portable Runtime


    One thing you''ll leverage is The Apache Portable Runtime (APR) libraries to get
    a good set of portable routines for doing this kind of work. The APR isn''t necessary,
    and you could probably write this program without it, but it would take more code
    than necessary. I''m forcing you to use APR now to get linked and using other
    libraries. Finally, the APR also works on Windows so your skills with it are transferable
    to many other platforms.


    You should get the apr-1.4.5 and the apr-util-1.3 libraries, as well as browse
    through the documentation available at the main APR site at apr.apache.org.


    Here''s a script that will install all the stuff you need. You should write this
    into a file by hand, and then run it it can install APR without any errors.


    > APR Install Script


    ```

    set -e


    # go somewhere safe

    cd /tmp


    # get the source to base apr 1.4.6

    curl -L -O http://archive.apache.org/dist/apr-1.4.6.tar.gz


    # extract and go into the source

    tar -xzvf apr-1.4.6.tar.gz

    cd apr-1.4.6


    # configure, make, make install

    ./configure

    make

    sudo make install


    # reset and cleanup

    cd /tmp

    ```'
