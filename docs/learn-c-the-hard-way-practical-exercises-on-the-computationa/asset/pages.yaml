  md: '154


    CHAPTER 28. EXERCISE 27: DEFENSIVE AND CREATIVE PROGRAMMING


    These are lies. You will quickly run into programmers who feel intense pride about
    what they''ve created, which is natural, but this pride gets in the way of their
    ability to objectively improve their craft. Because of pride and attachment to
    what they''ve written, they can continue to believe that whatever they write.
    As long as they ignore other people''s criticism of their code they can protect
    their fragile ego and never improve.


    The trick to being creative and making solid software is also to be able to adopt
    a defensive programming mind-set.


    # 28.2 The Defensive Programmer Mindset


    After you have a working prototype and you''re feeling good about the idea, it''s
    time to switch to being a defensive programmer. The defensive programmer basically
    hates your code and believes these things:


    +   1. Software has errors.


    +   2. You are not your software, you are responsible for the errors.


    +   3. You can never remove the errors, only reduce their probability.


    This mindset lets you honest about your work and critically analyze it for improvements.
    Notice that it doesn''t say you are full of errors? It says your code is full
    of errors. This is a significant thing to understand because it gives you the
    power of objectivity for the next implementation.


    Just like the creative, the defensive mindset has a dark side as well. The defensive
    programmer is a paranoid who is afraid of everything, and this prevents them from
    possibly being wrong or making mistakes. That''s great when you are trying to
    be ruthlessly consistent and correct, but it is murder on creative energy and
    concentration.


    # 28.3 The Eight Defensive Programmer Strategies


    Once you''ve adopted this mindset, you can rewrite your prototype and follow a
    set of eight strategies I use to make my code as solid as I can. While on the
    "real" version I ruthlessly follow these strategies and try to remove as many
    errors as I can, thinking like someone who wants to break the software.


    **Never Trust Input** Never trust the data you are given and always validate it.


    **Prevent Errors** If an error is possible, no matter how probable, try to prevent
    it.


    **Fail Early And Openly** Fail early, cleanly, and openly, stating what happened,
    and where and how to fix it.


    **Document Assumptions** Clearly state the pre-conditions, post-conditions, and
    invariants.


    **Prevention Over Documentation** Do not rely with documentation, that which can
    be done with code or avoided completely.


    **Automate Everything** Automate everything, especially testing.


    **Simplify And Clarify** Always simplify the code to the smallest, cleanest form
    that works without sacrificing safety.


    **Question Authority** Do not blindly follow or reject rules.


    These aren''t the only ones, but they''re the core things I programmers have to
    focus on when trying to make good code. I don''t really say exactly how to do
    these. I''ll go into each of these in more detail, and some of the exercises actually
    cover them extensively.'
