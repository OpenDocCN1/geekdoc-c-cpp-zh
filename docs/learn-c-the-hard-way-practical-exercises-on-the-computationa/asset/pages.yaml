    Noll. This hash produces good numbers and is reasonably fast.

    **Adler-32** Named after Mark Adler, but it''s been around a long time and it''s
    good for studying.

    **DJB Hash** This algorithm is attributed to Dan J. Bernstein (DJB) but it''s
