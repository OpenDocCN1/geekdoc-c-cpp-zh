  md: '# 6.2 Breaking It Down


    There''s a few features of the C language in this code that you might have only
    slightly figured out while you were typing code. Let''s break this down line-by-line
    quickly, and then we can do exercises to understand each part better:


    **ex5.c1** An include and it is how to import the contents of one file into this
    source file. C has a convention of using .h extensions for "header" files, which
    contain lists of functions you want to use in your program.


    **ex5.c3** This is a multi-line comment and you could put as many lines of text
    between the /* and */ characters as you want.


    **ex5.c4** A more complex version of the main function you''ve been using blindly
    so far. How C programs works is the operating system loads your program, and then
    runs the function named main. For the function to be complete it needs to return
    an int take two parameters, an for the argument count and an array of char * strings
    for the arguments. Did that fly over your head? Don''t worry, we will cover this


    **ex5.c5** To start the body of any function you write a { that indicates the
    beginning of a "block". In Python you just a : and indented. In other languages
    you might have a begin or do to start.


    **ex5.c6** A variable declaration and assignment at the same time. This is how
    you create a variable, with the syntax type name = value; In statements (except
    for logic) end in a ''; (semicolon) character.


    **ex5.c7** A call to your old friend printf. Like in many languages function calls
    work with the syntax name(arg1, arg2) and can have no arguments, or any number.
    The printf function is actually kind of weird and can take multiple arguments.


    **ex5.c11** A return from the main function, which gives the OS your exit value.
    You may not be familiar with how Unix uses return codes, so we''ll cover that
    as


    **ex5.c12** Finally, we end the main function with a closing } character and that''s
    the end of the program.


    There''s a lot of information in this break-down, so study it line-by-line and
    make sure you at least a little grasp of what''s going on. You don''t know everything,
    but you can probably guess before we continue.


