  md: 'Despite all these reasons that I rely on debug gdb, I still use gdb in a few
    situations and I think you have any tool that helps you get work done. Or, maybe
    you''ve got a server that''s crashing and you just have to connect to a broken
    problem and poke around. In a few other cases gdb is the way to go, and it''s
    always good to have as many tools as possible to help solve problems.


    I break down when I use gdb vs. valgrind printing like this:


    +   1. Valgrind is used to catch all memory errors. If you use gdb if having problems
    or if using valgrind would slow the program down much


    +   2. Print with debug to diagnose and fix defects related to logic or usage.
    This amounts to about 90% of the defects after you start using Valgrind.


    +   3. Use gdb for the remaining "my weird stuff" or emergency situations to gather
    information. If Valgrind isn''t turning anything up and I can''t print out the
    information I need, then I use gdb and start poking around. My use of gdb in this
    case is entirely to gather information. Once I have an idea of what''s going on
    I go back to writing a unit test to catch the defect, and then do print statements
    to find why.


    # 32.2 A Debugging Strategy


    This process will actually work with any debugging technique you go to, whether
    that''s Valgrind, debug printing, or a debugger. I''m going to describe it in
    terms of using gdb since it people skip this process when using debuggers, but
    this for every gdb you only need it until you get the very difficult ones.


    +   1. Start a little title file called notes.txt and use it as a "lab notes"
    for ideas, bugs, programs, etc.


    +   2. Before you use gdb, write out the where you''re going to fix and what could
    be causing it.


    +   3. For each cause, write out the files and functions where you think the cause
    is coming from, or just write that you don''t know.


    +   4. Now start gdb and pick the first possible cause with good file:function
    possibles and set breakpoints.


    +   5. Use gdb to then run the program and confirm if that is the cause. The best
    way is to see if you can use the set command to fix the program easily or cause
    the error immediately.


    +   6. If this isn''t the cause, then mark in the notes.txt that it wasn''t and
    why. Move on to the next possible cause that''s easiest to debug, and keep adding
    information you gather.


    In case you''ve noticed, this is basically the scientific method. You write a
    set of hypotheses, then you use debugging to prove or disprove them. This gives
    you insight into more possible cases and eventually you find it. This process
    helps you avoid the same possible causes repeatedly even though you''ve found
    them aren''t.


    You can also do this with debug printing, the only difference is you actually
    write out your hypotheses in the code where you think the problem is instead of
    the notes.txt. In a way, debug printing forces you to tackle bugs scientifically
    since you have to write out hypotheses as print statements.


