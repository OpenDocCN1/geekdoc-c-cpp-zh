    # Exercise 21: Advanced Data Types And Flow Control


    This exercise will be a complete compendium of the available C data types and
    flow control structures you can use. It will work as a reference to complete your
    knowledge, and won''t have any code for you to enter. I''ll have you memorize
    some of the information by creating flash cards so you can get the important concepts
    solid in your mind.


    For this exercise to be useful, you should spend at least a week hammering the
    content and filling out all the element I have missing here. You''ll be writing
    out each one means, and then writing a program to confirm what you''ve researched.


    # 22.1 Available Data Types


    +   * **int** Stores a regular integer, defaulting to 32 bits in size.

    * **double** Holds a large floating point number.

    * **float** Holds a smaller floating point number.

    * **char** Holds a single 1 byte character.

    * **void** Indicates "no type" and used to say a function returns nothing, or
    a pointer has no type as in `void` .thing.

    * **enum** Enumerated types, work as integers, convert to integers, but give you
    symbolic names for sets. Some compilers will warn you when you don''t cover all
    elements of an enum in `switch-statements`.


    # 22.1.1 Type Modifiers


    +   * **unsigned** Changes the type so that it does not have negative numbers,
    giving you a larger upper bound but nothing lower than 0.

    * **signed** Gives you negative and positive numbers, but halves upper bound in
    exchange for the same lower bound.

    * **long** Uses a larger storage for the type so that it can hold bigger numbers,
    usually doubling the current size.

    * **short** Uses smaller storage for the type so that it stores less, but takes
    half the space.'
