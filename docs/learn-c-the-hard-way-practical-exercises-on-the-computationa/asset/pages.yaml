    ```\n\n```\nuint32_t Hashmap_fnvla_hash(void *data)\n{\n  bstring s = (bstring)data;\n\
    \  uint32_t hash = FNV_OFFSET_BASIS;\n  int i = 0;\n  for(i = 0; i < length(s);\
    \ i++) {\n    hash ^= bchare(s, i, 0);\n    hash *= FNV_PRIME;\n  }\n  return\
    \ hash;\n}\n```\n\n```\nconst int MOD_ADLER = 65521;\nuint32_t Hashmap_adler2_hash(void\
    \ *data)\n{\n  bstring s = (bstring)data;\n  uint32_t a = 1, b = 0;\n  int i =\
    \ 0;\n  for (i = 0; i < length(s); i++) {\n    a = (a + bchare(s, i, 0)) % MOD_ADLER;\n\
    \    b = (b + a) % MOD_ADLER;\n  }\n  return (b << 16) | a;\n}\n```\n\n```\nuint32_t\
    \ Hashmap_djb_hash(void *data)\n{\n  bstring s = (bstring)data;\n  uint32_t hash\
    \ = 5381;\n  int i = 0;\n  for(i = 0; i < length(s); i++) {\n    hash = ((hash\
    \ << 5) + hash) + bchare(s, i, 0); /* hash * 33 + c */\n  }\n  return hash;\n\
