  md: "# CHAPTER 11. EXERCISE 10: ARRAYS OF STRINGS, LOOPING\n\nHere's how the for-loop\
    \ works:\n\n+   1. The INITIALIZER code is to set up the loop, and if this case\
    \ i = 0.\n2. Next the TEST boolean expression is checked, and if it's false (0)\
    \ then CODE does nothing.\n3. The CODE runs, that whatever it wants.\n4. After\
    \ the CODE runs, the INCREMENTER part is run, usually incrementing something,\
    \ like in i++.\n5. And it continues with Step 2 until the TEST is false (0).\n\
    \nThis for-loop is going through the command line arguments as argc and argv like\
    \ this:\n\n+   1. The OS passes each command line argument as a string in the\
    \ argv array. The program's name (.ex10) is at index 0, with the rest coming after\
    \ it.\n2. The OS also sets argc to the number of arguments in argv array you can\
    \ process them without going the end. If you give one argument, the program's\
    \ name is the first, so argc is 2.\n3. The for-loop sets up with i = 1 in the\
    \ initializer.\n4. It tests that i is less than argc with the test i < argc. Since\
    \ initially 1 < 2 it will pass.\n5. It runs the code which just prints out the\
    \ i and uses i to index argv.\n6. The increment is then run using the i++ syntax,\
    \ which is a handy way of writing i = i + 1.\n7. This repeats until i < argc is\
    \ finally false (0) when the loop exits and the program continues.\n\n# 11.1 What\
    \ You Should See\n\nTo play with this program you have to run it two ways. The\
    \ first way is to pass in some command line arguments so argc and argv get set.\
    \ The second is to run it with no arguments so you can see that the first for-loop\
    \ doesn't run since i < argc will be false.\n\nex10 output\n\n```\n$ make ex10\n\
    cc -Wall -g ex10.c -o ex10\n ./ex10 i am a bunch of arguments\nargc: 1\narg 2:\
    \ am\narg 3: a\narg 4: bunch\narg 5: of\narg 6: arguments\nstate 0: California\n\
    state 1: Oregon\nstate 2: Washington\nstate 3: Texas\n$\n./ex10\nstate 0: California\n\
    state 1: Oregon\nstate 2: Washington\nstate 3: Texas\n$\n```"
