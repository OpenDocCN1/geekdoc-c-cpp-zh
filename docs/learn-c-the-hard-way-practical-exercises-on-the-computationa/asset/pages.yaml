  md: "# 28.4. Applying The Eight Strategies\n\nThese ideas are all great pop-psychology\
    \ attitudes, but how do you actually apply them to working code? I'm now going\
    \ to give you a set of things to do in this book that demonstrate each one with\
    \ a concrete example. The ideas aren't limited to these, and you should use these\
    \ as a guide to making your own code tougher.\n\n# 28.4.1 Never Trust Input\n\n\
    Let's look at an example of bad design and \"better\" design. I won't say good\
    \ design because this could be done even better. Take a look at two functions\
    \ that both copy a string and a simple main to test the better one.\n\n```\n#undef\
    \ NDEBUG\n#include \"dbg.h\"\n#include <stdio.h>\n#include <assert.h>\n\n/*\n\
    \ * Naive copy that assumes all inputs are always valid\n * taken from K&R C and\
    \ cleaned up a bit.\n */\nvoid copy(char to[], char from[]) {\n    int i = 0;\n\
