    # 36.2 How To Improve


    There is a big disadvantage to this implementation because it has to process the
    entire array four times on every insertion. It does fast, but it''d be if if could
    limit the amount of sorting by the size of what needs to be sorted.


    There are two ways you can improve this implementation:


    +   1. Use a binary search to find the minimum position for the new element, then
    only sort from to the end. You find the minimum, put the new element on the end,
    then just sort from the minimum on. This will cut your space considerably most
    of the time.

    2. Keep track of the biggest key currently being used, and then only sort enough
    digits to handle that key. You can also track of the smallest number, and then
    only sort the digits necessary for the range. To do this you''ll have to start
    using CPU integer ordering (endianness).


