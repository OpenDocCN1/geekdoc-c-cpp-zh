  md: "# # Chapter 45\n\n# ## Exercise 44: Ring Buffer\n\nRing buffers are incredibly\
    \ useful when processing asynchronous IO. They allow one side to receive data\
    \ in random intervals of random sizes, but feed cohesive chunks to another side\
    \ in set sizes or intervals. They are a variant on the Queue data structure but\
    \ it focuses on blocks of bytes instead of a list of pointers. In this exercise\
    \ I'm going to show you the RingBuffer code, and then you have to make a full\
    \ unit test for it.\n\n![](img/7d8b291c9c9b2280e2835cac5c0abe55_302_0.png)\n\n\
    ```\n#ifndef _lctw_RingBuffer_h\n#define _lctw_RingBuffer_h\n\n#include <lctw/stdlib.h>\n\
    \ntype struct {\n    char *buffer;\n    int length;\n    int start;\n    int end;\n\
    } RingBuffer;\n\nRingBuffer *RingBuffer_create(int length);\n\nvoid RingBuffer_destroy(RingBuffer\
    \ *buffer, char *target, int amount);\n\nint RingBuffer_read(RingBuffer *buffer,\
    \ char *data, int length);\n\nint RingBuffer_write(RingBuffer *buffer, char *data,\
    \ int length);\n\nint RingBuffer_empty(RingBuffer *buffer);\n\nint RingBuffer_full(RingBuffer\
