    \ *buffer);\n\nbstring RingBuffer_gets(RingBuffer *buffer, int amount);\n\n#define\
    \ RingBuffer_available_data(B) (((B)->end + 1) % (B)->start - 1))\\n#define RingBuffer_available_space(B)\
    \ ((B)->length - (B)->end - 1)\n```"
