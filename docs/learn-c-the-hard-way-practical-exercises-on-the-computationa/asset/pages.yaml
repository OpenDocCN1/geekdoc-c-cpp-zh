    # Exercise 18: Pointers To Functions


    Functions in C are actually pointers to a spot in the program where some code
    exists. Just like you''ve been creating pointers to structs, strings, and arrays,
    you can point a pointer at a function too. The main use for this is to pass "callbacks"
    to other functions, or to simulate classes and objects. In this exercise we''ll
    do some callbacks, and in the next we''ll make a simple object system.


    The format of a pointer goes like this:


    int (*POINTER_NAME) (int a, int b)


    A way to remember how to write one is to this:


    +   1. Write a normal declaration: int callme(int a, int b)

    2. Wrap function name with pointer syntax: int (*callme)(int a, int b)

    3. Change the name to the pointer name: int (*compare_cb) (int a, int b)


    The key thing to remember is, when you''re done with this, the variable name for
    the function is called compare_cb and then you use it like it''s a function. This
    is similar to how pointers to arrays can be used just like the arrays they point
    to. To pointers functions can be used like the functions they point to but with
    a different name.


    # Using A Raw Function Pointer


    ```

    int (*tester) (int a, int b) = sorted_order;

    printf("TEST: %d is same as %d\n", tester(2, 3), sorted_order(2, 3));

    ```


    This will work if the function returns a pointer to something:


    +   1. Write it: char *make_coolness(int awesome_levels)

    2. Wrap it: char *(*make_coolness) (int awesome_levels)

    3. Rename it: char *(+coolness_cb) (int awesome_levels)


    The next problem to solve with function pointers is that it''s hard to give parameters
    to a function, like when you want to pass the function callback to another function.
    The solution is to use typedef which is a C keyword for making new names for other
    more complex types. The only thing you need to do is put typedef before the function
    pointer syntax, and then after that you can use the name like it''s a type. I
    demonstrate this in the following exercise code:


