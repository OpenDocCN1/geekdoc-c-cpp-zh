    # 16.4 The Pointer Lexicon


    I''m now going to give you a little lexicon to use for reading and writing pointers.
    Whenever you run into a complex pointer statement, just refer to this and break
    it down by bit by bit (or just don''t use that code since it''s probably not code);


    **type *ptr** "a pointer of type named ptr"


    **ptr** "the value of whatever ptr is pointed at"


    **(ptr + i)** "the value of (whatever ptr is pointed at plus i)"


    **&thing** "the address of thing"


    **type ** = &thing** "a pointer of type named ptr set to the address of thing"


    **ptr++** "increment where ptr points"


    We''ll be using this simple lexicon to break down all of the pointers we use from
    now on in the book.


    # 16.5 Pointers Are Not Arrays


    No matter, you should never think that pointers and arrays are the same thing.
    They are not the same, even though C lets work with them in many of the same ways.
    For example, if you do `sizeof(cur_age)` in the code, you will get the size of
    the *pointer*, not the size of what it points at. If you want the size of the
    full array, use the array''s name, `age` as I do on line 12.


