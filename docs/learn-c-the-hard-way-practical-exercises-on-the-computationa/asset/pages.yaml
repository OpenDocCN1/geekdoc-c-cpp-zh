  md: '# 1.4.1 WARNING: Not Use An IDE


    An IDE, or "Integrated Development Environment" will turn you stupid. They are
    the worst tools if you want to be a good programmer because they hide what''s
    going on from you, and your job is to know what''s going on. They are useful if
    you''re trying to get something done and the platform is designed around a particular
    IDE, but for learning code C (and many other languages) they are pointless.


    # Note 1 IDEs and Guitar Tablature


    If you''ve played guitar then you know what tablature is, but for everyone else
    me explain. In music there''s an established notation called the "staff notation".
    It is a generic, very old, and universal way to write down how someone should
    play an instrument. If you play piano this notation is fairly easy to use, since
    it was created mostly for piano and composers.


    Guitar however is a weird instrument that doesn''t really work with notation,
    so guitarists have an alternative notation called "tablature". What tablature
    does is, rather tell you the note to play, it tells you about a single thing you''re
    playing. Many people do it this way, but if you want to learn whole songs without
    knowing about what you''re playing. Many people do it this way, but if you want
    to know what you''re playing, then tablature is pointless.


    It may be harder than tablature, but traditional notation tells you how to play
    the music rather than just how to play the guitar. With traditional notation I
    can walk over to a piano and play the same song. I can play it on a bass. I can
    put it into a computer and design whole scores around it. With tablature I can
    just play it on a guitar.


    IDEs are like tablature. Sure, you can code pretty quickly, but you can only code
    in one language on that platform. This is why companies love selling them to you.
    They know you''re lazy, and since it only works on their platform they''ve got
    you locked in because you are a lazy.


    The way you break the cycle is you suck it up and finally learn to code without
    an IDE. A plain editor, or a programmer''s editor like Vim or Emacs, makes you
    work with the code. It''s a little harder, but the end result is you can work
    with any code, on any computer, in any language, and you know what''s going on.'
