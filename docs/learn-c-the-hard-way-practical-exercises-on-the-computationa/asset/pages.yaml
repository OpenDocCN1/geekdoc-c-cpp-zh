  md: '# # Introduction: The Cartesian Dream Of C


    Whatever I have up till now accepted as most true and assured I have either from
    the senses or through the senses. But from time to time I have found that the
    senses deceive, and it is prudent never to trust those who have deceived once.


    > (Rene Descartes, Meditations On First Philosophy)


    If there ever were a quote that described programming with C, it would be this.
    To many programmers, this makes C scary and evil. It is the Devil, Satan, the
    trickster Loki come to destroy your productivity with his seductive talk of pointers
    and direct access to the machine. Then, once this computational Lucifer has you
    hooked, he destroys your world with the "segfault" and laughs as he reveals the
    trickery in your bargain with him.


    But, C is not to blame for this state of affairs. No means, your computer and
    the Operating System controlling are the real tricksters. They conspire to hide
    their true inner workings from you so that you can never know what is going on.
    The C programming language''s only failing is giving you access to what is really,
    and telling you the cold hard raw. C gives you the red pill. C pulls the curtain
    back to show you the wizard. C is truth.


    Why use C then it''s so dangerous? Because C powers over the false reality of
    abstraction and liberates you from stupidity.


    # What You Will Learn


    The purpose of this book is to get you strong enough in C that you''ll be able
    to write your own software in it, or modify someone else''s code. At the end of
    the book we actually take code from a more famous book "K&R" and edit it using
    what you''ve learned. To get to this stage you''ll have to learn a few things:


    +   1. The basics of C syntax and idioms.


    +   2. Compilation, make files, links.


    +   3. Finding bugs and preventing them.


    +   4. Defensive coding practices.


    +   5. Breaking C code.


    +   6. Writing basic Unix systems software.


    By the final chapter you will have more than ammunition to tackle basic systems
    software, libraries, and other smaller projects.


    # How To Read This Book


    This book is intended for programmers who have learned at least one other programming
    language. I refer you to Learn Python The Hard Way or to Learn Ruby The Hard Way
    if you haven''t learned a programming language yet'
