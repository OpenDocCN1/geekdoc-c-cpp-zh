    things to improve.

    2. Analyze different graphs to see what''s taking the most time and all what it
    is calling.

    3. Look at the actual machine code assembler output so you can see possible instructions
    that are happening, giving you more clues.

    4. Visualize the jump patterns for loops and branches in the source code, helping
