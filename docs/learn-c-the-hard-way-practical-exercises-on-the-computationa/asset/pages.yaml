  md: '# CHAPTER 28. EXERCISE 27: CREATIVE AND DEFENSIVE PROGRAMMING


    If you''re doing a full security audit this will better done with a whole team
    and a spreadsheet. If you''re just writing a function then simply reviewing the
    code and scratching these into some comments is good enough. What''s important
    is you stop assuming that errors don''t happen, and you work on removing them
    when you can without wasting effort.


    # 28.4.3 Fail Early And Openly


    If you encounter an error in C you have two choices:


    +   1. Return an error code.

    2. Abort the process.


    This is why is, what you need to make sure the failures happen quickly, are clearly
    documented, give an error message, and are easy for the programmer to avoid. This
    is why check macros I''ve given you work the way they do. For every error you
    find it prints a message, the file and line number where it happened, and force
    a return. If you use my macros you''ll end doing the right thing.


    I prefer not returning error code to aborting the program. If it''s catastrophic
    then I will, but very few errors are truly catastrophic. A good example of when
    I abort a program is if I''ve given an invalid pointer, as I will catch it right
    and away. Instead of having the programmer experience a fault explosion "somewhere",
    I catch instead if it is common to pass a NULL then I''ll probably change that
    to a check instead that the caller can adapt and keep running.


    In libraries however I try to never abort. The software using my library can decide
    if it should abort, and typically I''ll only abort if the library is badly used.


    Finally, a big of being "open" about errors is not using the same message or error
    code for more than one possible error. You typically see this with errors on external
    resources. A library will receive an error on a socket, and then simply report
    "bad socket". What they should do is return exactly what the error was on the
    socket so it can be debugged properly and fixed. When designing your error reporting,
    make sure you give a different error message for the different possible errors.


    # 28.4.4 Document Assumptions


    If you''re following along and doing this advice then you''ll be building a "contract"
    of how your functions expect to be the world. You''ve created preconditions for
    each argument, you''ve handled possible errors, and you''re failing elegantly.
    The next step is to complete the contract and add "invariants" and "postconditions".


    An invariant is some condition that must be true in state while the function runs.
    This isn''t common in simple functions, but when you''re dealing with complex
    structures it becomes more necessary. A good example of an invariant is a structure
    that is always initialized while it''s being used. Another one would be a sorted
    data structure is used during sorting process.


    A precondition is a guarantee on the exit or value of a function returns. This
    can blend with invariants, but this is as simple as "function returns 0 or -1
    on error". Usually these are documented, but if your function returns an allocated
    resource, you can also use a precondition to make sure it''s returning something
    and not NULL. Or, use NULL to indicate an error, in that case your postcondition
    is now checking the deallocation on any errors.


    In C programming preconditions and postconditions are more documentation than
    actual code and assertions. The best way to handle them is to assert calls for
    the ones you use, then document the result. If you do that then when people hit
    an error they can see what assumptions you made when writing the function.'
