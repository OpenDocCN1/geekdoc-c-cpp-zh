  md: "# RADIX SORT AND BINARY SEARCH\n\n**RadixMap** uses the radix_sort function\
    \ to sort the contents. It does this by sorting between the contents and temp\
    \ until finally contents is sorted. You'll see how this works when I describe\
    \ radix_sort.\n\n**Radixfind** is using a binary search algorithm to give you\
    \ it. I'll explain how this works shortly.\n\n**Radixmap** add Using the RadixMap_sort\
    \ function, this will add the key and value you request at the end, simply sort\
    \ it so that everything is in the right place. Once sorted, the RadixMap_find\
    \ will work properly because it is a binary search.\n\n**Radixdelete** Works as\
    \ the RadixMap_add except \"deletes\" elements of the structure by setting their\
    \ values to the unsigned 32 bit integer, UINT32_MAX. This means you can't use\
    \ that value as a key, but it makes deleting elements easily. Simply it to that\
    \ and then sort and it'll move to the end. Now it's deleted.\n\nStudy the code\
    \ for the ones I described, and then that leaves RadixMap_sort, radix_sort, and\
    \ RadixMap_find to understand.\n\n# 36.1.3 RadixMap_find And Binary Search\n\n\
    I will start with how the binary search is implemented. Binary search is simple\
    \ algorithm that most people can understand intuitively. In fact, you could take\
    \ a deck of playing cards (or cards with numbers) and do this manually. Here's\
    \ how this function works, and how binary search works:\n\n+   1. Set a high and\
    \ low mark based on the size of the array.\n2. Get the middle element between\
    \ the low and high marks.\n3. If the key is less-than, then the key must be below\
    \ the middle. Set high to one less than middle.\n4. If the key is greater-than,\
    \ then the key must be above the middle. Set the low mark one greater than the\
    \ middle.\n5. If it's equal then found it.\n6. Keep looping until low and high\
    \ pass you exit the loop.\n\nWhat you are effectively doing is guessing where\
    \ the key might be by picking the middle and comparing it. Since the data is sorted,\
    \ you know that the key has to be above or below this. If it's not, then you divide\
    \ the search in half. You keep going until you find it or you overlap the boundaries\
    \ and exhaust the search space.\n\n# 36.1.4 RadixMap_sort And Radix_sort\n\nA\
    \ radix sort is easy to understand if you do it manually. What this algorithm\
    \ does exploit the fact that numbers are stored with a sequence of digits that\
    \ from \"least significant\" to \"most significant\". It takes the numbers and\
    \ buckets them by the digit, and when it has processed all the digits the numbers\
    \ come out sorted. At first it seems like magic, and honestly looking at the code\
    \ seems like it, but trying it manually\n\nTo this algorithm write a bunch of\
    \ three digit numbers, in a random order, let's say we 222, 915, 100, 633, 120,\
    \ and 380.\n\n+   1. Place the number in buckets by their 1st digit: [380, 100,\
    \ 120], [912], [633, 223], [275].\n2. I now have to go through each of these buckets\
    \ in order, and then sort it to 10's buckets: [100], [912], [120], \n3. Now each\
    \ bucket contains numbers that are sorted by the 1ve's 10th digit. I need to go\
    \ through these in order and fill the final 100's buckets: [100, 120], [223, 275],\
    \ [380], [633], [912]."
