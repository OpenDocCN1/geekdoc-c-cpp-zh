  md: '# Selectors


    You use selectors to define the elements on a page that you want to apply certain
    properties to. Elements in the document can be matched based on the HTML tag used,
    based on class or ID attributes, based on the relationship to other elements,
    or based on the current status in the document. You can also combine simple selectors
    to form a chain of conditions that must be met before the style rule is applied.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# E (Type Selectors)


    The type selector selects an element by its type.


    ```

    h1 {} /* selects all h1 elements */

    form {} /* selects all form elements */

    ```


    # * (Universal Selector)


    The universal selector matches any element type in the document. It is implied
    if there is a sequence of other simple selectors and no specific type selector
    is present.


    +   * {} /* selects all elements in a document */

    *.thumb {} /* selects all elements with class thumb

    [see Class Selector below] */

    .thumb {} /* same as previous, * is implied */


    # #id (ID Selector)


    The ID selector matches any element with the specified value as its ID attribute.


    ```

    #header {} /* selects the element with the ID of header */

    *#header {} /* same as previous */

    div#footer {} /* selects the div element with class footer */

    ```'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# .class (Class Selector)


    The class selector matches elements with the specified class name. For elements
    whose class attribute contains multiple space-separated words, the class selector
    will select an element if *any* of those words match the specified class name.


    ```

    .help {} /* matches all elements with a class of help */

    img.thumbnail {} /* matches image elements with class of thumbnail */

    ```


    # Attribute Selectors


    In addition to id and class attributes, any attribute can be used for selection
    via attribute selectors.


    # [att]


    Selects elements with the attribute att, regardless of the attribute''s value.


    ```

