    # Smart Tiling


    Whenever using background images with elements that can become quite long on one
    end or another, such as the height of a content column or the width and height
    of the body element, there are two options for covering the full length of that
    block: You can pick a design that can tile, or you can make the image ridiculously
    big.


    The ribbon pictured in the first part of **Figure 8.3** (on the next page) cannot
    be tiled horizontally as the background image on the `<body>` element without
    repeating the dip at some point. Make the image 4000 pixels wide and continue
    the flat horizontal lines, and you may be confident no one will see the dip at
    again; however, the file size and overhead once the image is loaded will be large.'
