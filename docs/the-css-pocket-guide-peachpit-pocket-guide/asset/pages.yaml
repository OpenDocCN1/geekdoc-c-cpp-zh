  md: '# The CSS Pocket Guide


    # What Is CSS?


    CSS, short for Cascading Style Sheets, is a language for describing the presentational
    properties of content elements in structured documents such as HTML documents.
    Though this book will focus on styling HTML content, you can also use CSS for
    other structured documents such as those created with XML or SVG.


    # What Are Styles Sheets?


    Style sheets provide a set of guidelines for styling a structured document by
    defining rules for the appearance of different types of content or different contexts
    that content can be found in. You may have already encountered forms of style
    sheets or themes in typical office suites or e-mail programs. It is common in
    presentation software such as PowerPoint or Keynote to pick a theme to start with,
    where each slide is automatically formatted with the same font sizes, colors,
    and layouts, rather than starting with a blank slate and designing each slide
    individually and hoping for them to be consistent when you''re done.


    As a browser or other user agent loads the HTML content for the document, it also
    loads the style sheet information. From this style sheet information, it then
    builds up the set of presentation rules for each individual content item based
    on its element type, its state, and its location in the document. It will ultimately
    render each element consistently based on this accumulated set of rules.


    # Anatomy of a Statement


    CSS-based style sheets consist of a list of statements. There are two types of
    statements: rule sets (referred to as rules) and at-rules.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Rule Sets


    A rule set consists of a selector followed by a declaration block containing declarations
    of style properties and their values, as explained in the following list (see
    also Figure 1.1).


    Figure 1.1

    The parts of a rule set.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_26_0.png)


    +   1. Rule set: This is the entire definition of a CSS rule, including selector
    and declaration block, containing individual declarations.


    +   2. Selector: The selector includes everything up to the opening curly brace.
    The selector describes the markup elements to which the contents of declaration
    block apply. Individual selectors may share a declaration block, with each selector
    separated with a comma, ().


    +   3. Declaration block: The declaration block starts with the left curly brace
    and ends with the right curly brace. Inside the block there are zero or more declarations,
    each separated by a semicolon (;).


    +   4. Declaration: Each declaration is a colon-separated property-value pair.


    +   5. Property: The property is the CSS property that the declaration is targeting.


    +   6. Value: This is the value that will be applied to the declared property.
    The syntax of the value depends on the property but can be things such as keywords,
    a <length>, a <percentage>, or a mix of multiple, space-separated types.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Defining Values for Four-Sided Properties


    Properties such as margin, padding, and border-width are used to define values
    for all four sides of a block (whereas margin-right defines the right margin alone).
    These properties, and those like them, can take from one to four space-separated
    values that are applied to the sides in the following manner:


    +   * If one value is listed (for example, 10px), that value is applied to all
    four sides.

    * If two values are listed (for example, 10px 5%), the first value is applied
    to the top and bottom, while the second is applied to the right and left sides.

    * If three values are listed (for example, 10px 5% 20px), the first value is applied
    to the top, the second to both the right and left sides, and the last to the bottom.

    * If four values are listed (for example, 10px 5% 20px auto), the values are applied
    clockwise starting from the top (top, right, bottom, left).


    # At-Rules


    At-rules are statements that begin with the character for at (@), followed by
    a rule type or identifier, and end with a semicolon. Unlike rule sets, at-rules
    do not contain declarations directly but offer additional context or commands
    for the processing of style sheet information. Here''s an example:


    ```

    /* include file additional.css */

    @import "additional.css"

    /* target specific media with contained rules */

    ```'
