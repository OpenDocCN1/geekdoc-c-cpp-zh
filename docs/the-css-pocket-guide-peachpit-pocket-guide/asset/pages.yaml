  md: '# Chapter 8: Backgrounds and Borders


    Placing every image used on a complex site into the same sprite may create a management
    nightmare. Look to create sprites that represent similar types of images and balance
    complexity with request and performance overhead.


    # Border


    In Chapter 5, border was introduced as the border on a block element that is drawn
    between the padding and the margin of an element. Borders are drawn in front of
    the element''s background, which has an impact on the display of border styles
    with gaps (dashed) and with back-ground positioning.


    # border-color


    The border-color property takes one to four <color> values signifying the colors
    for the border on each of a block''s four sides. Like with margin and padding,
    when one color is provided, it applies to all sides. With two, the first value
    applies to the top and bottom, and the second applies to the right and left. With
    three, the first applies to the first top; the second applies to the left and
    right; and the third applies to the bottom. With four values, it applies to each
    side clockwise from the top. border-color can be expanded to border-top-color,
    border-right-color, border-bottom-color, and border-left-color.


    # border-style


    The design of the border is set via one to four keywords assigned to the border-style
    property.


    +   - none: No border drawn

    - dotted: A series of "round" dots; roundness varies by browser and border width'
