    Figure 11.8\ndeconstructing a label covering the input area of a text field.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_224_0.png)\n\n# Making Buttons\n\n\
    Getting users to interact with a site and share their information is the primary\
    \ purpose of any form, and for web apps or web-based promotions, clicking the\
    \ submit button may be the entire reason for the site's existence. As such, submit\
    \ buttons scream to be styled in ways that draw the user to them. There are 101\
    \ different methods to enhance buttons; this section offers a quick overview of\
    \ the parts behind them.\n\nA key hurdle to easy, flexible button styling is that\
