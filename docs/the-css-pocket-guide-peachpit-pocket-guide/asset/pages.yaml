  md: '# The CSS Pocket Guide


    or browser bug. Instead, it provides feature detection, the results of which can
    be referenced from your CSS or JavaScript code. Classes such as .multiplebegs
    or .no-multiplebegs are added to the <html> element of your document, allowing
    you to define an alternate set of styles.


    # More Targeted Solutions


    Another class of scripts does not attempt to fix a group of CSS features or fix
    a specific browser''s problems, instead targeting a very specific CSS feature.


    The rounded corners discussion in Chapter 8 mentioned using JavaScript to create
    DOM elements to apply rounded corner effects for browsers that do not support
    the border-radius property. CurvyCorners(https://www.curvycorners.net/) is one
    library that does this for you and is an example of a library that is used to
    target one specific gap in browser support rather than going after a larger class
    of problems.


    # Why Not Use JavaScript?


    These JavaScript libraries can be useful to bring a browser in line with the A-grade
    browsers you''re targeting with your CSS code, but they can be overkill. By design,
    many of these libraries attempt to fix most or all problems with a browser, whereas
    your project may have only one or two unsupported features or browser bugs that
    need to be fixed. Why load a script to add support for :not() selector or border-radius
    property if it does not appear in your code?


    When there are just a few features that would have to be fixed in this manner,
    it may be more efficient to find alternate ways to code the effects through CSS
    and HTML rather than turn to scripting. There may be other selectors you can use,
    for example. In browsers with lower usage, it may be OK just to leave things unsupported.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Likewise, if you are tasked with building a site where you know have older
    browsers in that A- or B-grade classification (Chapter 2), you probably will want
    to avoid some of the unsupported selectors or cutting-edge CSS3 features while
    building the site. This will ensure that your targets are met and your site displays
    properly, even without JavaScript enabled, in the largest segment of your user
    base.


    These bridge libraries are best when you have a few encore elements of the design
    you''d like to see supported in a wider space or when you''re looking to help
    out the lower-grade browsers that you''d still like to deliver the full experience
    to.


    # CSS Frameworks


    With so many millions of sites being designed each year, it is a good assumption
    that any new project that comes along will have a layout grid or other layout
    properties that may have already been built for another site. there are details
    or contexts of content items that will be unique, but patterns will emerge from
    the layout grid or other areas that can be transferred from one project to another.


    Open source frameworks allow developers to share these patterns and conventions,
    start with a tested baseline of code, and spend time on the specifics instead
    of retyping code.


    These frameworks include not only a style sheet but also HTML markup patterns
    and examples for accomplishing common tasks such as a layout grid.


    If you''re using a popular content management system (CMS), there may be a theme
    or template that combines a CSS framework with the basic markup and application
    features already included. The Sandbox theme for WordPress is a good example of
    this generic baseline with which to work from.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Common CSS Frameworks


    Far from a comprehensive listing, here are a few frameworks that have become popular
    because of the quality of their code and their flexibility.


    # Blueprint


    Blueprint (http://www.blueprintcss.org/) provides a broad starting point for starting
    to build a site including a reset, layout grid tools, and baseline- typographic
    and font styling. There are also plug-ins and examples for common content elements
    such as tabs, buttons, and iconography.


    # 960


    The 960 grid system (http://960.gs/) takes a 960-pixel area and allows you to
    specify a 12- or 16-column grid with 20-pixel gutters between them. This split,
    and the code that is generated and provided for you to place content in the grid,
    allows you to quickly put a page layout together. The sizing and spacing rules
    offer a very controlled grid to design a site from without being too restrictive.


    # Object Oriented CSS (OOCSS)


    As code philosophy as framework, Object Oriented CSS (http://wiki.github.com/stubbornella/ocss/
    or http://ocss.org), spearheaded by Nicole Sullivan, focuses on content elements
    first. It breaks down the content into pieces and modules and uses their similarities
    to define a common language of content labels applied as class names. This is
    particularly useful for large sites because it takes full advantage of the cascading
    aspects of CSS to help maintain consistency across the many different content
    types typical of larger web sites.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# YUI Library


    The Reset file I mentioned earlier is just a small part of the YUI Library. The
    larger project is comprised of a baseline set of CSS files , baseline JavaScript
    files, and components for common web application interface components such as
    cookie access, drag-and-dropped elements, date pickers, and sliders. Similar interface
    widget libraries are available from jQuery, script.aculus, and MochaUI. They all
    provide a collection of widgets to choose from and rules for embedding and skinning
    those elements, but they do not offer the more general reset and framework aspects
    that YUI does.


    # Why Not Use a Framework?


    Like any other tool, frameworks are developed with certain priorities based on
    the specific problems developers are attempting to solve. As they evolve, they
    may become more generic, but each framework maintains these priorities that are
    sometimes not the same as your needs on any given project.


    For instance, the YUI tools tend to be a bit more web application focused, and
    OOC works best when the site is complex enough to have the depth of content types
    to manage. Attempting to go against the grain will cause you to write more code
    than you''d save and will cause you more headaches than starting from scratch.


    # Beyond Frameworks


    Frameworks provide a starting point to begin developing a web site, but they don''t
    change how you write and edit CSS code. All the rules of inheritance, specificity,
    source order, and syntax discussed in this book continue to apply for any site-specific
    code you add on top of a chosen framework.'
  merge: -1
  pgno: 250
- img_proc: true
  md: "There is an emerging class of tools for authoring and generating CSS code that\
    \ makes small modifications to the language and allows helpers such as variables\
    \ and selector nesting to be used. These changes remove some of the repetition\
    \ and document searching that typically come with building and maintaining styles\
    \ for a larger site.\n\n# CSS Preprocessors\n\nTo turn the written code back into\
    \ code in a syntax, browsers understand a conversion layer (preprocessor) is added\
    \ as a compilation step via tools on your local development machine or via server-side\
    \ scripts.\n\n# Less\n\nLess(https://lesscss.org/) is a Ruby gem that adds the\
    \ ability to include the CSS rules from one selector into another (a mixin), selector\
    \ nesting, simple mathematical formulas, and variables that stand in values so\
    \ colors, sizes, and other values need to be typed only once. The following is\
    \ an example of both a variable definition and a nested rule as written using\
    \ Less:\n\n```\n@highlight_color: #aaa;\nblockquote {\n  font-size: 1.4em;\n \
    \ a {\n    text-style: italic;\n    background-color: @highlight_color;\n  }\n\
    }\n```"
  merge: -1
