    as traveling toward the top of the document tree. The selector header ul>li selects
    “any list item elements that are children of unordered list elements that are
    contained in a header element.


    If you are ever unsure of what a selector does, the online tool SelectOracle (http://gallery.theopalroup.com/selectoracle/)
