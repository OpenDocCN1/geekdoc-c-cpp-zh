- img_proc: true
  md: '# The CSS Pocket Guide


    In the standard box model (content-box), the padding, borders, and margins of
    an element are added to the width and height of that element to determine the
    space it occupies in the layout. Figure 5.1 displays a diagram of the box model
    as found in the CSS2.1 specification (http://www.w3.org/TR/CSS21/box.html). The
    additive process where width or height is not inclusive and thus the total size
    an element takes up may feel counterintuitive to some, but this works well when
    nesting elements or working with content such as images or video where you don''t
    want to encroach on the content area.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_93_0.png)


    **Figure 5.1** The standard box model. The T, R, B, and L abbreviations represent
    the top, right, bottom, and left values of each property.'
