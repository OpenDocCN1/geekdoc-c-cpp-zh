    tip Using JavaScript to add these four corner elements into the HTML DOM on the
    fly is a useful way to keep presentational elements out of your markup and keep
    your code lean, especially if you are rounding multiple different blocks on a
    page.


    # Drawing Pixels


    Taking the positioning of empty elements to an extreme, you can create 1x1 boxes
    and meticulously re-create the pixels that draw the corners of a containing block.
    This can allow for visual tricks such as anti-aliasing and changing border radius
    without having to re-create background image files, but it also makes for lots
    of code and markup overhead.


    Like with the earlier corner solutions, you can use JavaScript to create, plot,
    and position these extra elements, giving them proper background color. An example
    of this is implemented in the Curvy Corners JavaScript library (http://www.curvycorners.net/),
    which uses the border-radius property in the CSS document to draw the rounded
    corner when loaded in a browser that doesn’t already support border-radius.


    # Border and Background Enhancements


    Beyond multiple background images and rounded corners, CSS3 has a few other tricks
    in store that will quickly find their way into web developers’ toolboxes. Creating
    color gradients for background without the use of images and creating borders
    with images are both covered in Chapter 14.'
