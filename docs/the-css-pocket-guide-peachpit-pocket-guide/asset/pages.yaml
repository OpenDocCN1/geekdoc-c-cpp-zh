    ```\n\n# Placeholder Text\n\nA fairly convention with text inputs is to place\
    \ a small hint into the field. Doing this with the value attribute of the element\
    \ can be problematic (causing the submission of the hint text or other oddities),\
    \ so HTML5 introduces the placeholder attribute. To accomplish this without either\
