  md: '# The Not Too Distant Future of CSS


    As CSS has evolved as a language, it has often attempted to make common tasks
    that may be difficult or inflexible quite easy. Some of these new properties are
    based on experimental properties in individual browsers, but often they’re based
    on design and code patterns used every day by developers.


    For example, the need to use multiple HTML elements as hooks so that multiple
    background images can be used (shown in Figure 7.4), and the frequency with which
    this is done, has led to CSS changes that support multiple background images on
    a single element, as you saw in Chapter 8.'
