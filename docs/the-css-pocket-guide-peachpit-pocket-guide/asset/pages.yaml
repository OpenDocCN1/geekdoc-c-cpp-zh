- img_proc: true
  md: '# Media Types


    User agents are categorized by their features, or the features of the device they''re
    running on, into one of several media types. In some cases, such as a desktop
    browser with a print feature, the user agent can support multiple media types;
    however, only one type will be active at any given time.


    # List of Media Types


    +   - all: Intended for all devices

    - braille: Intended for Braille tactile feedback devices

    - embossed: Intended for paged Braille printers

    - handheld: Intended for small-screen handheld devices

    - print: Intended for paged, printed media (or print preview)

    - projection: Intended for projected media

    - screen: Intended for viewing on desktop and laptop screens

    - speech: Intended for screen readers

    - tty: Intended for teletypewriters, terminals, or other devices with a fixed-character
    grid

    - tv: Intended for television-based devices with lower resolution and limited
    scrollability compared to screen devices

    - Media queries: Intended for a selection of media via expressions that describe
    the features of the device introduced in CSS3


    In practice, your typical web project will have styles targeting the media types
    all, screen, print, and often handheld, while the other types will be left to
    manage with the styling defined in the all type or will be left to the default
    appearance.'
  merge: -1
