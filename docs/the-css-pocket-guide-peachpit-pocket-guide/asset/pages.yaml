  md: "# Chapter 9: Typography and Web Fonts\n\nA basic embedded font declaration\
    \ looks like this:\n\n```\n@font-face {\n  font-family: \"Chris Script\";\n  src:\
    \ url(fonts/ChrisScript.ttf);\n}\nh1 {\n  font-family: \"Chris Script\", cursive;\n\
    }\n```\n\nIf a browser did not support the @font-face rule (or could not find\
    \ or did not understand the particular format of the font), it would ignore the\
    \ first font name when it tried to follow the font-family rule for the <h1> element\
    \ and render the element using the browser-defined cursive font.\n\nA font that\
    \ may appear on the system can be searched by font name using one or more local()\
    \ values before the url(). This prevents the need to download a copy of a font\
    \ that might be installed on some computers, but it's not ubiquitous enough to\
    \ be relied on or considered safe for use without embedding.\n\n```\n@font-face\
    \ {\n  font-family: \"Vera Sans Mono\";\n  src: local(\"Bitstream Vera Sans Mono\"\
    );\n  url(fonts/BSVSM.ttf);\nnh2 {\n  font-family: \"Vera Sans Mono\", \"Courier\
    \ New\", cursive;\n}\n```\n\nIf the family name specified in the @font-face rule\
    \ exists already either by a previous rule or because it is on the user's system,\
    \ the new definition will take its place."
