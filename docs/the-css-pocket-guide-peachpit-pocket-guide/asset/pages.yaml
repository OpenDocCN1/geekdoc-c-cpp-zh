  md: '# URLs


    The URL function (&lt;url&gt;) is used to designate the address of a resource
    for use in a property such as background-image or list-style-image. The path of
    the resource follows the same rules as other uniform resource identifier (URI)
    usages like link href values in HTML. When using external style sheet documents,
    relative paths relate to the document the CSS rule is found in (the external CSS
    document) and not the source HTML document.


    ```

