    \ Microsoft released the Web Embedding Fonts Tool (WEFT), a Windows utility to\
    \ create EOT files, and there are WOFF generators being worked on, but since Font\
    \ Squirrel provides that format as well, individual tools are not necessary.\n\
    \n# Font Licensing and Foundries\n\nEven under the protection provided by the\
    \ EOT or WOFF format, by distributing a web font, you may be breaking the licensing\
    \ terms set by the foundry that designed and sold that font. When starting with\
    \ a fresh design, it may be smarter to start with typefaces whose licensing options\
    \ are known. Finding good-quality fonts with options for web embedding is getting\
    \ easier by the day (as I write this, I'm looking forward to the"
