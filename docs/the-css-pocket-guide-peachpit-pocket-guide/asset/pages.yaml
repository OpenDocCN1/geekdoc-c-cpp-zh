- img_proc: true
  md: "The previous code gets compiled into the following final code that gets sent\
    \ to the visitors' browsers:\n\n```\nblockquote {\n  font-size: 1.4em;\n}\nblockquote\
    \ a {\n  text-style: italic;\n  background-color: #eaa;\n}\n```\n\n# Sass\n\n\
    Sass (http://sass-lang.com/) is also a Ruby gem and offers variable, mixin, math,\
    \ and nesting features similar to Less. It has two different syntaxes to choose\
    \ from, one similar to CSS (and Less) and an alternate syntax that breaks from\
    \ the brackets and colons of CSS into a tab-based style some may find more readable\
    \ or manageable."
