  md: '# Forms and User Interface Elements


    Designing and styling forms and getting constant results across browsers and platforms
    can be the most difficult part of web development.


    Most of this difficulty arises because of the nature of form elements. They''re
    built to solicit input from the user of the site, and how that input gets can
    be quite different from device to device.


    Different operating systems have different native form control behavior and appearance,
    and browser vendors have tried to keep the display of interface elements in line
    with those standards. As a result, a user will typically see familiar inputs even
    if they use multiple browsers on one device, but if they change devices or operating
    systems, the interface'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 188 The CSS Pocket Guide


    elements will change. Even in the same browser, the appearances may differ between
    Windows, Mac OS X, Linux, and mobile devices. Figure 11.1 shows the difference
    in appearance of a select elements on three different devices.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_211_0.png)


    Figure 11.1 Interaction with select element in Safari/Apple iPhone iOS4, Safari/Apple
    iPad iOS3, and IE 8/Windows XP (from left to right).


    You can find additional examples of CSS applied to form elements in different
    browsers and operating systems at Christopher Schmitt’s meticulously collected
    and indexed collection of screenshots at http://www.WebFormElements.com.


    Something else that can be unique to form layouts is the need to juggle the myriad
    of positioning and placement and states of the elements of the form. Large fields,
    small fields, sets of fields, labels, and help or error messages all need to be
    placed so that it is clear to the visitor what is being requested from them. The
    grid that works for a standard-length text input along with its label may not
    work for a collection of radio buttons or a combination of inputs such as parts
    of a phone number or city and state.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Working with Form Controls


    As different as they can be from platform to platform, form elements on the major
    desktop browsers tend to share the basic properties; sizing, fonts, colors, and
    backgrounds all can be set as they would on any other HTML element. Because some
    controls are more complex than your average block of text, how those properties
    are applied can be a bit peculiar. There''s no hard and fast rule covering where
    a border is drawn or what parts of the select widget handle a color applied to.


    > Safari will draw native form controls (the bubbly look on OS X) even when some
    styles are defined. Set a border on the element to force it out of the native
    mode and into one that takes other styles such as color or backgrounds.


    # Sizing


    Form elements, like images, are inline replaced elements. For styling purposes,
    it is best to think of them as rectangular boxes even when they’re“round” radio
    buttons or made of multiple parts like file input fields. When setting the height
    and width of a form element, you’re setting the dimensions on the outer box. What
    the field inside that box does to fill the space is out of your hands.


    Although elements such as textareas and buttons fill the entire rectangular box,
    check boxes, radio buttons (Figure 11.2 on the next page), and file input fields
    reserve the specified space in the layout but in various ways to fill that space
    (or not really fill it, as shown in some of these examples).'
  merge: -1
  pgno: 212
- img_proc: true
  md: "# 190 The CSS Pocket Guide\n\nFigure 11.2 Radio buttons in Safari 5.0.1/OS\
    \ X, Firefox 3.6.8/OS X, Firefox 3.0.1/Windows, IE 8/Windows, and Opera 10.6.1/Windows\
    \ (from left to right) with a 100-pixel width, 100-pixel height, 1-pixel red border,\
    \ and 10-pixel padding.\n\nTo further complicate things, textareas, text inputs,\
    \ and similar elements aren’t quite like the other elements since they follow\
    \ the content-box box sizing model, whereas other elements use the border-box\
    \ model. Setting the box-model property to border-box helps regain some consistency\
    \ between text inputs and selects and buttons, with the drawback of making them\
    \ behave less like the labels or paragraphs that surround the fields.\n\n```\n\
    form input[type=\"text\"],\nform input[type=\"password\"],\nform input[type=\"\
    file\"],\ntextarea {\n  -ms-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n\
    \  -webkit-box-sizing: border-box;\n  box-sizing: border-box;\n}\n```\n\n# Colors,\
    \ Backgrounds, and Borders\n\nLike sizing, colors apply as you’d expect them for\
    \ text in elements such as submit buttons, textareas, and password fields. On\
    \ the other hand, the behavior of radio buttons, check boxes, and select options\
    \ will vary based on the browser and platform, so consider the color to be just\
    \ a suggestion, not a rule."
  merge: -1
  pgno: 213
- img_proc: true
  md: "# Chapter 11: Forms and User Interface Elements\n\nThis goes for other properties\
    \ as well. Where would you apply a background color to a radio button—inside the\
    \ circle or outside and behind the circle in the rest of the box? Is the line\
    \ between the text space and the little handle of a select element a border? How\
    \ many backgrounds and borders are there in a field input that is often represented\
    \ as something that looks like a text input plus a button? What about all these\
    \ new input types like sliders in HTML5?\n\nThese are the questions that give\
    \ browser developers (and in turn web developers) migraines.\n\nFor the most consistent\
    \ appearance, you should probably avoid borders and background colors and avoid\
    \ background images for radio buttons and check boxes.(Figure 11.2 showed examples\
    \ of browser differences.) On the other hand, you can do interesting things with\
    \ borders, background-colors, and background images for the other field types.\
    \ In the next example, a background image on a text input is used to create the\
    \ feeling of depth (Figure 11.3). I've added background color change when the\
    \ element is in focus for a highlight.\n\n```\ninput[type=\"text\"] {\n  padding:\
    \ 4px;\n  width: 100px;\n  border: 1px solid #000;\n  background: #fff url(images/inner_shadow.png)\
    \ no-repeat\n  left top;\n}\ninput[type=\"text\"]:focus {\n  background-color:\
    \ #fff335;\n}\n```\n\nFigure 11.3\nA text input with a background image.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_214_0.png)"
