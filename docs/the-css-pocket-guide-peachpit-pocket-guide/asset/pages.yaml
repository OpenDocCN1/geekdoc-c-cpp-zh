  md: '# font-weight


    The font-weight property controls the weight, or thickness, of the characters
    in a font.


    +   - normal | bold: Keywords representing normal weight type (default) and bolded
    type


    +   - bolder | lighter: Sets a weight relative to the weight inherited from the
    parent element


    +   - 100 to 900: A nine-step scale, in increments of 100, ranging from (100)
    to black (900)


    > note Though a nine-step scale for font weights is defined, browsers typically
    display only two distinct steps—normal (400) and bold (700).


    # font-variant


    Some typefaces are designed with several variant character sets, including a set
    of small caps shapes. The font-variant allows selection of alternate set of characters.


    +   - normal: Selects the normal variant of a font face (default).


    +   - small-caps: Selects the small caps variant of a font face. If none exists,
    small caps are simulated.


    # font-style


    The style of the font is declared using the font-style property.


    +   - normal: Normal, upright, type (default).


    +   - italic: Italicized type.


    +   - oblique: Oblique type. If no oblique style is provided for a typeface, italic
    may be used.'
