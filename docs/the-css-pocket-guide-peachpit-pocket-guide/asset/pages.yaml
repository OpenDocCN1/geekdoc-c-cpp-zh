  md: '# The CSS PocketGuide


    Here is your essential guide to understanding the building blocks of Cascading
    Style Sheets, including the rules, properties, and idiosyncrasies. The CSS Pocket
    Guide steers you through how to:


    +   - Take advantage of new and emerging CSS3 properties.

    - Use selectors to control which elements to style.\n- Size and position block-level
    elements.

    - Design readable text content through web typography.

    - Position elements in relation to other items on a page.

    - Lay out HTML content in multicolumn grids.

    - Apply backgrounds and borders to get just the right look and feel you want.

    - Choose, embed, and control fonts.

    - Get consistent results across browsers.

    - Create styles for specific devices and other media types.


