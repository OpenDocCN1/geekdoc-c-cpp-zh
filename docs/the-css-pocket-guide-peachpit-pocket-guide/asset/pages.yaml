- img_proc: true
  md: '# The CSS Pocket Guide


    # CSS Resets


    In the Chapter 2 discussion of browser- and user-created style sheets, for example
    saw the default styling for common elements such as paragraphs, links, and forms
    can be different from each other. Building a site on this inconsistent foundation
    can make cross-browser consistency a more difficult-task than it already is.


    A CSS reset creates a common baseline to work from and zeros out some or all aspects
    of browser default styling. It is common for browsers to have padding set on the
    <body> element so that plain HTML content has a little room to breathe. However,
    it may be easier to style a site if you are instead starting exactly the top-left
    corner. Font sizes, padding, margin, table properties, and form elements are all
    typical candidates for being “reset.”


    # Using Resets


    It is common to include a reset file so it is the first CSS code that the browser
    encounters. This is done by inserting its contents into the beginning of the main
    style sheet for the web site, by referencing it directly using a <link> element
    before your global style sheet, or by using an @import statement at the beginning
    of the main style sheet file, similar to the following:


    ```

    @import url(reset.css);

    ```


    There isn''t much to a reset, but a few solid examples have evolved over the years.
    They’re written to normalize inconsistencies between the default setting of various
    browser or trimming default rules when they’re too overbearing (as in the case
    of form elements). Whichever one you use, look it over before you use it on a
    project to make sure it isn''t doing anything you don''t want (such as setting
    colors or font sizes).'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Eric Meyer''s Reset


    Eric Meyer''s Reset (http://meyerweb.com/eric/tools/css/reset/index.html) is widely
    used and can be found at the core of many larger projects including some of the
    frameworks discussed later in this chapter.


    # YUI Library CSS Reset


    The YUI Library CSS Reset (http://developer.yahoo.com/yui/3/css-reset/) is similar
    but handles a few properties differently, including applying foreground and background
    colors. It is available to link directly from Yahoo!''s servers, which can help
    with download speed and caching.


    # HTML5 Reset


    The HTML5 Reset from Richard Clark (http://htmldoctor.com/html-5-reset-stylesheet/)
    builds on the Eric Meyer''s Reset and makes some modifications to sync with new
    or deprecated elements in the HTML5 specification.


    # Why Not Reset?


    There are two strong arguments against resetting.


    Resets can be a blunt instrument. A rule such as { margin: 0; padding: 0; } may
    have undesirable effects on form elements. On the flip side, explicitly picking
    a list of elements may mean some elements (old deprecated elements such as <center>
    or new HTML elements such as <article>) slip through the cracks.


    Not resetting in the first place means not having to re-create common styles like
    those for emphasis, list indentation, and bullets that are already set by the
    browser. Also, edge cases or little-used HTML elements (<dl>, <cite>, <legend>)
    and markup patterns (<ul> in a <blockquote>) must be tested to make sure that
    content added to the site later is properly styled.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'The type of content appearing on the site will weigh heavily on the appropriateness
    of a reset. A text-heavy site such as a blog may want to leave more of the browser
    styling intact, while an application or e-commerce site that relies on smaller
    content elements want to be more controlled. Ultimately, the choice to zero out
    styles at the beginning of a project''s code is one of taste and how you prefer
    to work rather than one of purely technical merit.


    # Cross-Browser CSS via JavaScript


    You can use a CSS reset to create an even starting point for styling individual
    page elements. But they don''t create that same level ground for browsers'' support
    for newer selectors and CSS properties. A drop-in JavaScript bridge library may
    be a convenient way to bridge the gaps in CSS support so that older browsers function
    like more recent browsers.


    When the included library loads, it will typically test the browser''s support
    against a list of CSS features. If a feature is supported, the script will do
    nothing. However, for those unsupported features, it will comb the style sheet
    code for their use and then attempt to replicate the behavior of the unsupported
    CSS through scripting.


    You can use JavaScript to check for all CSS 2.1 or CSS3 features missing in a
    browser, and other libraries are written to target specific gaps in support.


    # Common Bridge Libraries


    There are many JavaScript bridge libraries available to use on your projects,
    each approaching the task of extending support for the CSS code you''ve written
    in different ways.'
  merge: -1
  pgno: 245
