  md: '# Combining and Chaining Selectors


    Using combinators, you can chain together the individual selectors discussed earlier
    to create more complex selectors that can be used to describe elements not just
    in the entire document but in specific parts of the document or that match specific
    markup patterns. The following are all examples of chaining simple selectors:


