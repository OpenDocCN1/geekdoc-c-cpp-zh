  md: "```\n@media print {\n  [...\n}\n```\n\n# Cascading\n\nThe *cascading* in CSS\
    \ is the process that is followed in order to determine which declaration for\
    \ a given property is applied to a given element in the document. As you'll soon\
    \ learn, properties—color, for instance—can be defined and redefined multiple\
    \ times, so the browser must determine which of those definitions to apply. The\
