  md: '# white-space


    This property sets how the whitespace and newlines in an element are calculated.


    +   - normal: Lines of text are wrapped to fill each successive line box with
    text; sequences of whitespace (multiple space, tab, or newline characters) are
    collapsed (default).


    +   - pre: Text is considered to be preformatted in the source markup document
    and whitespace, including newline characters, remains intact (default for <pre>
    element).


    +   - nowrap: Whitespace is collapsed as normal, and all text is forced to the
    same line.


    # word-wrap


    In addition to setting the behavior for whitespace, with word-wrap you can allow
    browsers to break lines in the middle of words to prevent long strings of characters
    from overflowing a box.


    +   - break-word: Allows a browser to place a break within a word to prevent a
    long word with no whitespace characters from overflowing the box; words are broken
    by character, not syllables, and are not hyphenated.


    +   - normal: Single words cannot be broken (default).


    # text-indent


    The text-indent property defines an indentation for the first line of text in
    a block.


    +   - <length>: A fixed measurement for the indentation


    +   - <percentage>: A percentage length relative to the width property of the
