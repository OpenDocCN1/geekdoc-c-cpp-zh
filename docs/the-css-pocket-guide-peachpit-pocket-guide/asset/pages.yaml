- img_proc: true
  md: '# table-layout


    To maintain the integrity of the grid of cells, the content contained in each
    cell has traditionally had some impact on the height of rows and width of columns
    in a table, with the browser free to make adjustments to provided dimensions.
    Even when a cell width is provided, a large amount of text or a large image may
    make the cell larger. The table-layout property allows for changing the method
    browsers use to size and render a table.


    +   - auto: The width of the table and table cells is established and adjusted
    as the content of each cell in the table is rendered, with the dimensions provided
    by the CSS properties and adjusted for size or amount of content (default).


    +   - fixed: The width of the table and table cells do not rely on the content
    but is determined only by the width of the table and columns, allowing a browser
    to start rendering the table immediately.


    For small tables of data, table-layout: auto may be fine, allowing column widths
    to flex a bit to account for an unexpectedly large number. For much larger tables
    where you''d want the content to start displaying immediately or for cases where
    the integrity and uniformity of the cell grid is important, you should use fixed.


    # border-collapse


    +   - separate: The borders of individual table cells are drawn as distinct features
    and separated by some border padding. No other parts of a table have borders (default).


    +   - collapse: The borders of the table and all parts of a table share the same
    border on each side.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'A few behaviors of separated borders can be seen in Figure 10.4 that make them
    behave similar to the traditional HTML table rendering.


    +   - In the column on the left, the cells with the narrow border have been adjusted
    to fit the display of the element with the larger border.


    +   - The border declared on the tr element is ignored.


    +   - The table''s background is drawn in the spaces between the cell borders.


    Figure 10.5 is an example of the previous table with border-collapse set to collapse
    and demonstrates the following changes that take place under the collapsing border
    model that make the table behave more similarly to a typical spreadsheet found
    in Excel, Numbers, or other software:


    +   - One border is drawn between each cell, rather than a distinct border around
    each cell.


    +   - Borders may be applied to any of the parts of a table including the, tbody,
    and tr elements.


    +   - When elements with different border-width, border-style, or border-color
    properties touch, they aren''t both drawn; instead, one of the styles is chosen
    by the browser.


    +   - The border-spacing property is ignored.


    Figure 10.5

    A table''s layout with border-collapse set to collapse.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_206_0.png)'
  merge: -1
