  md: "# Browser Support for Selectors\n\nBrowser support for the selectors described\
    \ in this chapter is great in some cases and just starting to get there for other\
    \ cases. Selectors such as type, ID, class, and links are supported everywhere.\
    \ CSS2 and CSS3 selectors such as + and > as combinators are supported widely\
    \ enough to be useful on many projects. Peter-Paul Koch maintains some useful\
    \ support charts for selectors in desktop browsers (http://www.quirksmode.org/css/contents.html)\
    \ and mobile browsers (http://www.quirksmode.org/m/css.html).\n\n# Grouping Selectors\n\
    \nDifferent selectors can be separated by a comma and be assigned the same properties.\
    \ This will allow you to cut down on repeated use of the same properties, keep\
    \ your layouts uniform, and make changes and small tweaks easier.\n\n```\np, blockquote,\
    \ ul, li, dl {\n  padding: 0;\n  margin: 0 1em 1.5em;\n}\n```\n\nThis statement\
    \ gives many block-level elements that may appear in the content areas of your\
    \ document the same whitespace.\n\n# Selector Speed\n\nThe greater complexity\
    \ of selectors, in the form of chaining multiple nodes or using sibling combinators\
    \ or attribute selectors, the harder the rendering engine needs to work when parsing\
    \ the document and drawing the page. Speed that is measured in milliseconds may\
    \ not seem like a factor in the performance of a web site, but tallied over a\
    \ large"
