- img_proc: true
  md: '# The Document Flow


    Reading content in an HTML document, without any JavaScript or CSS applied, is
    a top-down and left-to-right affair. Block elements take up the entire width of
    the document and follow one after another with their inline content flowing inside
    them. Margins and padding may alter the look or spacing some, but they alone do
    not change the positioning of the elements.


    You have three ways to change the default positioning and interaction between
    elements in the top-down blob of content: You can force an element to behave like
    a different type of element, you can pull the item out of the flow completely,
    or you can pull the item to the side of its container and allow other items to
    wrap around it.


    # display


    The display property is the key to the entire layout castle. I''ve already covered
    block elements and inline elements, but you need a number of other element types
    to define all the content that might display on a web page, including the following:


    +   - inline: Creates one or more inline boxes, the familiar inline content

    - block: Creates a block box

    - inline-block: Creates a block box that behaves like an inline box, similar to
    the image (replaced element) behavior

    - list-item: Creates a block box for the content and the list item marker

    - table, table-row, table-caption: Creates three of the types of elements needed
    to present a table (Chapter 10)'
  merge: -1
  pgno: 107
- img_proc: true
  md: '+   - none: Removes the element from the presentation entirely, drawing box
    of any kind


    Alternating elements between the trio of inline, block, and none is sufficient
    for most design tasks, and as luck would have it, they are also the most widely
    supported values.


    # Position


    The positioning of an element is based on the length of the box offset parameters:
    top, right, bottom, and left. Typically, top and left will be used for positioning
    elements since the top-left corner of the item being measured from—the beginning
    of a box—is easily understood in normal document flows.


    # static


    static is the default value where an element is rendered in the normal flow and
    not uniquely positioned. The positioning parameters top, right, bottom, and left
    do not apply.


    # relative


    In relative positioning, an element’s position is calculated as normal, and then
    the offset positioning is applied relative to this normal position. Relative positioning
    does not take the element out of the normal flow, which leaves a space behind
    in the element’s original position.


    A relative positioned element with box offsets set to o (or undefined) will appear
    in its normal position; however, it will create a new point of origin for any
    of its child elements that may be positioned absolutely.'
  merge: -1
  pgno: 108
