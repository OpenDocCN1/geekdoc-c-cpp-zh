  md: "# Font Basics\n\nThe typeface used for rendering text and its particular characteristics\
    \ such as size and weight are defined using font and its related properties.\n\
    \nThe font-family property accepts a comma-separated list of font family names.\
    \ The first value in the list that is installed on the device used to read the\
    \ page is the font that will be used to style the text.\n\n```\nh1 {\n  font-family:\
    \ \"Does Not Exist\", Arial, sans-serif;\n}\n\np {\n  font-family: \"Palatino\
    \ Linotype\", Palatino; /* Windows Version, Mac Version */\n}\n```\n\nIn the previous\
    \ code, the font name would be checked; if the font Does Exist is not available,\
    \ the next font Arial would be looked for, and so on, until the generic font sans-serif\
    \ was matched and used. In some cases, font names vary a bit between Windows and\
    \ Mac, so both names would be listed, like so:\n\nGeneric font-family keywords\
    \ have been created to map to a browser-system-defined font family for the specified\
    \ category of fonts. The preference dialog boxes each browser typically allow\
    \ users to select their preferred font family for some of these categories.\n\n\
    +   * serif: A typeface style typically denoted by flourishes or flared ends on\
    \ each character; typically Times New Roman"
  merge: -1
  pgno: 171
- img_proc: true
  md: '+   - sans-serif: A typeface design with plain or straight features; typically
    Arial


    +   - cursive: A cursive or handwriting-like typeface


    +   - monospace: A fixed-width font, commonly used for displaying code or other
    text where character width is important like ASCII art; typically Courier or Courier
    New


    +   - fantasy: A highly stylized typeface


    See "Specifying Typefaces" later in this chapter for common examples and additional
    discussion of choosing and defining font families.


    # font-size


    The font-size property controls the size of the text in the element and may be
    defined as a fixed size or a size relative to the font size of the parent element.
    Browsers set a default size based on settings in the user preferences, commonly
    16px.


    +   - <length>: A length measurement


    +   - <percentage>: A percentage value measured against the computed value of
    the element''s font-size


    +   - xx-small | x-small | small | medium | large | x-large | xx-large: Fixed-size
    values along a browser-defined scale


    +   - larger | smaller: A value relative to the parent element''s size; typically
    representing a step up or down the previous scale (xx-small through xx-large)


    Relative and percentage font sizes are based on their parent element''s computed
    font size. The effect of this behavior may be compounded when nesting elements.
    The following sample (Figure 9.1 on the next page) demonstrates how font sizes
    are calculated for nested elements.'
