    `:first-child` 和 `:last-child` 伪类选择器代表某些父元素的第一个和最后一个子元素。它们分别相当于 `:nth-child(1)`
    和 `:nth-last-child(1)`。


    这些选择器对于一种常见的设计模式非常有用，即使用边框作为一组元素之间的分割符，而不是元素外部（图 3.2）。


    ```

    li { border-top: 1px solid red; } /* 在 li 元素上方放置边框 */

    li:first-child { border-top: none; } /* 移除第一个项目顶部的边框 */

