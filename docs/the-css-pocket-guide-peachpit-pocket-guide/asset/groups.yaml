    - [WebFonts.info Directory]: 致力于网页排版的目录，这是一份支持嵌入的字体和字体字库列表：http://www.webfonts.info/\n\
    \n## 通过文本替换自定义字体\n\n设计师可以使用某些技术，除了依赖系统字体或嵌入字体文件来实现自定义字体外观。这些技术有优点也有缺点——平衡了维护性、可选择性和外观。将字体设置在\
    \ `<img>` 标签内并放在文档中是一种方法，但如果选择了不同的字体，HTML 内容无法通过样式表更改，而且当出现在 RSS 馈等上下文中，图像保持不变。\n\
    \n上一节中的字体嵌入技术是新的方法，且没有浏览器支持或字体授权等问题；这些较旧且测试过的技术在你的工具箱中是有用的。\n\n与直接设置 `<<img>>`\
    \ 标签中的文本一样，这些技术在文章标题或导航元素等少量情况下有用，但动态替换大量文本会带来大量的开销或维护问题。\n\n## 图像替换\n\n与其使用图像标签来显示非\
    \ HTML 的文本，通过图像替换，你可以将同一个图像文件作为常规 HTML 元素的 CSS 背景。对背景图像进行调整和定位后，必须通过移动其位置、更改 display\
    \ 值或执行类似的技巧来隐藏前景文本。在下面的示例中（下一页的图 9.3），标题使用 Bitstream Vera Sans 字体带有某些通过 CSS 和\
    \ HTML 字体无法实现的凸效果：\n\n```css\nh2 {\n  display: block;\n  height: 25px;\n  background-image:\
    \ url(images/sprite_imagagereplace.png);\n  background-repeat: no-repeat;\n  text-indent:\
    \ -9999px; /* 将 HTML 文本移出视图 */\n}\n#hdrHome {\n  width: 80px;\n  background-position:\
    \ 0 0;\n}\n#hdrBlog {\n  width: 63px;\n  background-position: -88px 0;\n}\n#hdrPortfolio\
    \ {\n  width: 107px;\n  background-position: -158px 0;\n}\n#hdrAbout {\n  width:\
    \ 83px;\n  background-position: -272px 0;\n}\n```\n\n```html\n<h2 id=\"hdrHome\"\
    >首页</h2>\n<h2 id=\"hdrBlog\">博客</h2>\n<h2 id=\"hdrPortfolio\">作品集</h2>\n<h2 id=\"\
    hdrAbout\">关于</h2>\n```\n\n图 9.3\n（注：图 9.3 标题的图像替换。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_191_0.png)\n\
    \n如果少量使用且针对不经常更改的文本，图像替换是一个非常方便手的工具。该技术的主要缺点是它相当不灵活，并且需要为每个被替换或编辑的文本生成图像（如前例中的图像精灵图）。\n\
    \n## 第 9 章：排版与网页字体\n\nFlash 编写了关于这里（http://mezzoblue.com/revised-image-replacement/）中各种图像替换方案的良好概述和对比。\n\
    \n## 使用 Flash 替换字体\n\nsIFR 项目 (http://www.mikeindustries.com/blog/sifr) 是作为图像替换的替代方案构建的工具包。它需要将字体转换为新格式（这里是\
    \ SVG 字体），然后使用 JavaScript 读取 HTML 页面并替换指定的元素。sIFR 使用基于 CSS 的样式来传递字体信息，并通过 JavaScript\
    \ 来重绘 HTML 内容。相比于图像替换，其主要优势在于维护性。主要的缺点是它同时需要 JavaScript 和 Adobe Flash Player。\n\
    \n## 使用 JavaScript 替换字体\n\nCofón (http://wiki.github.com/sorcu/cufon/) 是一个作为 sIFR\
    \ 替代方案的工具包。它将字体转换为新格式（这里是 SVG 字体），然后使用 JavaScript 工具读取 HTML 页面并替换指定的元素。相比于图像替换，其主要的优势在于维护性。\n\
    \n## 列表与表格\n\n所有内容类型都属于两种显示类型之一——内联和块级。几乎。思考后可能会发现，具有列、行、标题和跨格的表格无法通过排列一系列块元素来建模，但列表还需要工具。\n\
    \n## 列表\n\nHTML 列表元素 (`<ul>` 和 `<ol>`) 是简单的块级元素。单个列表项 (`<li>`) 同样具有相同的框模型，尺寸、内边距、外边距和边框符合预期。然而，每个项目还需要一些额外的部分来确保标记正确定位并指定或递增。\n\
