  - "[PAGE 171]\n\n# Font Basics\n\nThe typeface used for rendering text and its particular\
    \ characteristics such as size and weight are defined using font and its related\
    \ properties.\n\nThe font-family property accepts a comma-separated list of font\
    \ family names. The first value in the list that is installed on the device used\
    \ to read the page is the font that will be used to style the text.\n\n```\nh1\
    \ {\n  font-family: \"Does Not Exist\", Arial, sans-serif;\n}\n\np {\n  font-family:\
    \ \"Palatino Linotype\", Palatino; /* Windows Version, Mac Version */\n}\n```\n\
    \nIn the previous code, the font name would be checked; if the font Does Exist\
    \ is not available, the next font Arial would be looked for, and so on, until\
    \ the generic font sans-serif was matched and used. In some cases, font names\
    \ vary a bit between Windows and Mac, so both names would be listed, like so:\n\
    \nGeneric font-family keywords have been created to map to a browser-system-defined\
    \ font family for the specified category of fonts. The preference dialog boxes\
    \ each browser typically allow users to select their preferred font family for\
    \ some of these categories.\n\n+   * serif: A typeface style typically denoted\
    \ by flourishes or flared ends on each character; typically Times New Roman"
  - '[PAGE 172]


    +   - sans-serif: A typeface design with plain or straight features; typically
    Arial


    +   - cursive: A cursive or handwriting-like typeface


    +   - monospace: A fixed-width font, commonly used for displaying code or other
    text where character width is important like ASCII art; typically Courier or Courier
    New


    +   - fantasy: A highly stylized typeface


    See "Specifying Typefaces" later in this chapter for common examples and additional
    discussion of choosing and defining font families.


    # font-size


    The font-size property controls the size of the text in the element and may be
    defined as a fixed size or a size relative to the font size of the parent element.
    Browsers set a default size based on settings in the user preferences, commonly
    16px.


    +   - <length>: A length measurement


    +   - <percentage>: A percentage value measured against the computed value of
    the element''s font-size


    +   - xx-small | x-small | small | medium | large | x-large | xx-large: Fixed-size
    values along a browser-defined scale


    +   - larger | smaller: A value relative to the parent element''s size; typically
    representing a step up or down the previous scale (xx-small through xx-large)


    Relative and percentage font sizes are based on their parent element''s computed
    font size. The effect of this behavior may be compounded when nesting elements.
    The following sample (Figure 9.1 on the next page) demonstrates how font sizes
    are calculated for nested elements.'
  - "[PAGE 173]\n\n```\nbody {\n  font-size: 96px;\n}\nli {\n  font-size: 0.5em;\n\
    }\n[...]\n<body>body: 96px\n<ul>\n  <li>li: 0.5em = 48px\n    <ul>\n      <li>li:\
    \ 0.5em = 24px\n        <ul>\n          <li>li: 0.5em = 12px\n        </ul>\n\
    \      </li>\n    </ul>\n  </li>\n</ul>\n</ul>\n</body>\n```\n\nFigure 9.1\nRepeated\
    \ calculation of half the parent font size.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_173_0.png)"
  - "[PAGE 174]\n\n# Chapter 9: Typography and Web Fonts\n\nIf this compounded calculation\
    \ of the font size is not the desired behavior, it may be more useful to set the\
    \ font size on some container element and avoid setting it on list items, paragraphs,\
    \ or inline elements that may appear in various locations in the HTML document.\
    \ For the previous example, the following would ensure that all items in the outer\
    \ container element (ul) are half the body size that this value is not reapplied\
    \ for nested lists:\n\n```\nbody > ul {\n  font-size: 0.5em;\n}\n```\n\n> Many\
    \ screen-based fonts become difficult to read at small sizes there may not be\
    \ enough pixels to distinguish the strokes of a character. Be careful when using\
    \ relative sizes that make the default font size smaller because some users may\
    \ set their default font sizes to something smaller than you're expecting already.\
    \ Some browsers allow users to set a minimum font size to aid the readability\
    \ of text to prevent it from becoming illegible.\n\n# Keeping It Relative\n\n\
    There is an eternal debate among web developers about whether it is better (more\
    \ accessible to those with eyesight) to use relative font sizes on a page or whether\
    \ it is OK to use a fixed-size unit like pixels. Much of the anti-fixed-size argument\
    \ is centered on the text-zoom behavior of Internet Explorer 6 and older in which\
    \ the browser will not enlace fixed-size fonts.\n\nEven if the base font size\
    \ you choose is a fixed size (say 12 pixels), it may be worthwhile to use relative\
    \ units for any individual element-specific or section-specific font size changes.\
    \ Doing this allows for changing the base font size while maintaining the scale\
    \ and relative sizes for headers, block quotes, footnotes, and so on, without\
    \ the need to edit each individual font-size property throughout the style sheet."
- md: "\n# font-weight\n\nThe font-weight property controls the weight, or thickness,\
    \ of the characters in a font.\n\n- normal | bold: Keywords representing normal\
    \ weight type (default) and bolded type\n- bolder | lighter: Sets a weight relative\
    \ to the weight inherited from the parent element\n- 100 to 900: A nine-step scale,\
    \ in increments of 100, ranging from (100) to black (900)\n\n> note: Though a\
    \ nine-step scale for font weights is defined, browsers typically display only\
    \ two distinct steps—normal (400) and bold (700).\n\n# font-variant\n\nSome typefaces\
    \ are designed with several variant character sets, including a set of small caps\
    \ shapes. The font-variant allows selection of alternate set of characters.\n\n\
    - normal: Selects the normal variant of a font face (default).\n- small-caps:\
    \ Selects the small caps variant of a font face. If none exists, small caps are\
    \ simulated.\n\n# font-style\n\nThe style of the font is declared using the font-style\
    \ property.\n\n- normal: Normal, upright, type (default).\n- italic: Italicized\
    \ type.\n- oblique: Oblique type. If no oblique style is provided for a typeface,\
    \ italic may be used.\n\n# line-height property\n\nThe line-height property defines\
    \ the height of each line of text (line box). Leading, or vertical spacing between\
    \ each line, is created by specifying a line-height that is larger than the content\
    \ height (font-size).\n\n- normal: A reasonable default value specified by the\
    \ browser; commonly 1.2\n- <number>: A numeric multiplier applied to the font\
    \ size to calculate the line-height\n- <length>: A specific length value\n- <percentage>:\
    \ A percentage of the element's font-size\n\n# font (Shorthand)\n\nThe font shorthand\
    \ property allows for assigning the individual font properties (font-style, font-variant,\
    \ font-weight, font-size/line-height, font-family) in the same place. Note that\
    \ although most shorthand properties allow for individual property values to be\
    \ left out and assume the default or inherited value, at minimum font-size and\
    \ font-family must be declared. Also, the value of the line-height property must\
    \ be paired with the font-size value in the format of font-size/line-height, such\
    \ as 1.2em/1.4.\n\n```css\n/* normal, small-caps, 400, 15px/19px \"Trebuchet MS\"\
    , Verdana, sans-serif */\nh3 { font: small-caps 15px \"Trebuchet MS\", Verdana,\
    \ sans-serif; }\n```\n\n```css\n/* oblique, normal, bold, 20px/24px monospace\
    \ */\nh5 { font: bold oblique 1em/1.2em monospace; }\n```\n\n# vertical-align\n\
    \nThe vertical-align property sets the alignment of text (or other inline content)\
    \ in relation to the line box controlled via line-height. Because this property\
    \ controls the positioning of an inline element in relation to a line box and\
    \ not a block element, it is not suitabe for aligning block elements in a layout\
    \ grid. The default value of baseline creates an alignment-where the bottom of\
    \ the characters in each inline element on a line all start at the same position.\
    \ The following are commonly used values for vertical-align(Figure 9.2):\n\n-\
    \ baseline: Aligns the baseline of the box with the parent element’s baseline\n\
    - sub: Creates a subscript by lowering the baseline of the box\n- super: Creates\
    \ a preprint by raising the baseline of the box\n\n```css\np {\n  font-size: 20px;\n\
    \  vertical-align: baseline;\n  color: #666;\n  background: #eee;\n}\nsup {\n\
    \  font-size: 1em;\n  vertical-align: super;\n}\nsub {\n  font-size: 1em;\n  vertical-align:\
    \ sub;\n}\nspan {\n  font-size: 0.6em;\n}\n```\n\n<p>Baseline yx <sup>xyx Sup\
    \ <span>xyx</span></span></span> yx ➡ Baseline <span></span></span></span></sub>xyx\
    \ Sub <span>xyx</span></sub></p> </sub> Baseline</p>\n\n| Baseline yx xyx Sup\
    \ xyx Baseline Baseline xyx yx Sub xyx yx Baseline |\n\nFigure 9.2 Line boxes\
    \ and vertical alignment with original baseline in black and baselines for sub\
    \ and super in gray.\n\n# Additional Font Styling\n\nThere's more to typography\
    \ than simply specifying a typeface. CSS provides a rich set of tools for adjusting\
    \ and customizing the display of text.\n\n# text-decoration\n\nYou can set underlines,\
    \ strikethrough, or other text decorations (yes, even blink) via the text-decoration\
    \ property. These decorations are drawn separately from borders and are applied\
    \ only to text.\n\n- underline: Each line of text is underlined.\n- overline:\
    \ Each line of text has a line drawn above it.\n- line-through: Each line of text\
    \ has a line drawn through it.\n- blink: The text blinks.\n\nYears of conventions\
    \ have established and reinforced that underlined text signals that the text is\
    \ a link. Links don't have to be underlined because they may appear as buttons\
    \ or highlighted via color or background color changes, but if text is underlined,\
    \ it is a link.\n\n# text-transform\n\nThe text-transform property controls the\
    \ capitalization of text. This can be a useful property for navigation.\n\n- capitalize:\
    \ The first character of each word is forced to uppercase.\n- uppercase: All characters\
    \ are forced to uppercase.\n- lowercase: All characters are forced to lowercase.\n\
    - none: No capitalization found in the source is made (default).\n\n# word-spacing\n\
    \nYou can adjust the default space between each word using word-spacing.\n\n-\
    \ <length>: A fixed dimension used as an adjustment between words.\n- normal:\
    \ No adjustment is made (equivalent to 0).\n\n# letter-spacing\n\nThe letter-spacing\
    \ property controls the spacing of each character. Like word-spacing, it defines\
    \ an adjustment to the font.\n\n- <length>: A fixed dimension used as an adjustment\
    \ between letters.\n- normal: No adjustment is made (equivalent to 0).\n\n# text-align\n\
    \nHorizontal alignment of text inside a containing block is defined by the text-align\
    \ property.\n\n- left: The text is left aligned (default).\n- right: The text\
    \ is right aligned.\n- center: The lines of text are centered.\n- justify: The\
    \ lines of text are flush with both sides of the box, adjusting the spacing between\
    \ words as needed.\n\n> Be careful when applying text-align: justify, particularly\
    \ with narrow columns. Typographic tools such as hyphenation, which help maintain\
    \ even character counts per line, are not available to browsers, and they are\
    \ notoriously awful at calculating the spacing needed for justification. This\
    \ often results in lines with a few words and huge gaps between them.\n\n# white-space\n\
    \nThis property sets how the whitespace and newlines in an element are calculated.\n\
    \n- normal: Lines of text are wrapped to fill each successive line box with text;\
    \ sequences of whitespace (multiple space, tab, or newline characters) are collapsed\
    \ (default).\n- pre: Text is considered to be preformatted in the source markup\
    \ and whitespace, including newline characters, remains intact (default for <pre>\
    \ element).\n- nowrap: Whitespace is collapsed as normal, and all text is forced\
    \ to the same line.\n\n# word-wrap\n\nIn addition to setting the behavior for\
    \ whitespace, with word-wrap you can allow browsers to break lines in the middle\
    \ of words to prevent long strings of characters from overflowing a box.\n\n-\
    \ break-word: Allows a browser to place a break within a word to prevent a long\
    \ word with no whitespace characters from overflowing the box; words are broken\
    \ by character, not syllables, and are not hyphenated.\n- normal: Single words\
    \ cannot be broken (default).\n\n# text-indent\n\nThe text-indent property defines\
    \ an indentation for the first line of text in a block.\n\n- <length>: A fixed\
    \ measurement for the indentation\n- <percentage>: A percentage length relative\
    \ to the width property of the containing block.\n"
  mdcn: "\n\n# font-weight\n\nfont-weight 属性控制字体中字符的粗细或厚度。\n\n- normal | bold: 代表正常权重（默认）和粗体类型的关键字。\n\
    - bolder | lighter: 设置相对于从父元素继承的权重的权重。\n- 100 to 900: 一个九级刻度表，以 100 为单位递增，范围从极细\
    \ (100) 到极粗 (900)。\n\n> 笔记：虽然定义了字体权重的九级刻度表，但浏览器通常只显示两个不同的层级：normal (400) 和 bold\
    \ (700)。\n\n# font-variant\n\n某些字体设计有几组变体字符集，包括一组小型大写字母（small caps）形状。font-variant\
    \ 允许选择另一组字符集。\n\n- normal: 选择字体的正常变体（默认）。\n- small-caps: 选择字体的小型大写字母变体。如果不存在，则模拟小型大写字母。\n\
    \n# font-style\n\n使用 font-style 属性声明字体的样式。\n\n- normal: 正常、直立的字体（默认）。\n- italic:\
    \ 斜体字体。\n- oblique: 倾斜字体。如果字体未提供倾斜样式，则可以使用斜。\n\n# line-height 属性\n\nline-height\
    \ 属性定义每行文本（行框）的高度。行距（Leading），即每行之间的垂直间距，通过指定大于内容高度（font-size）的 line-height 来创建。\n\
    \n- normal: 浏览器指定的合理默认值；通常为 1.2。\n- <number>: 应用于字号的数值倍数，用于计算行高。\n- <length>:\
    \ 特定的长度值。\n- <percentage>: 元素字体号的百分比。\n\n# font (简写)\n\nfont 简写属性允许在同一位置分配各个单独字体属性（font-style,\
    \ font-variant, font-weight, font-size/line-height, font-family）。请注意，虽然大多数简写属性允许省略单个属性值并假设默认值或继承值，但至少必须声明\
    \ font-size 和 font-family。此外，line-height 属性的值必须以 font-size/line-height 的格式与 font-size\
    \ 值配对，例如 1.2em/1.4。\n\n```css\n/* normal, small-caps, 400, 15px/19px \"Trebuchet\
    \ MS\", Verdana, sans-serif */\nh3 { font: small-caps 15px \"Trebuchet MS\", Verdana,\
    \ sans-serif; }\n```\n\n```css\n/* oblique, normal, bold, 20px/24px monospace\
    \ */\nh5 { font: bold oblique 1em/1.2em monospace; }\n```\n\n# vertical-align\n\
    \nvertical-align 属性设置文本（或其他内联内容）相对于由 line-height 控制的行框的对齐。由于该属性控制内联元素相对于行框的位置而不是块元素，因此它不适用于在布局网格中对齐块元素。默认值\
    \ baseline 创建了一种对齐方式，行中每个内联元素的字符底部都从相同的位置开始。以下是 vertical-align 的常用值（图 9.2）：\n\n\
    - baseline: 将框的基线与父元素的基线对齐。\n- sub: 通过降低框的基线创建下标。\n- super: 通过提高框的基线创建上标。\n\n\
    ```css\np {\n  font-size: 20px;\n  vertical-align: baseline;\n  color: #666;\n\
    \  background: #eee;\n}\nsup {\n  font-size: 1em;\n  vertical-align: super;\n\
    }\nsub {\n  font-size: 1em;\n  vertical-align: sub;\n}\nspan {\n  font-size: 0.6em;\n\
    }\n```\n\n<p>Baseline yx <sup>xyx Sup <span>xyx</span></span></span> yx ➡ Baseline\
    \ <span></span></span></span></sub>xyx Sub <span>xyx</span></sub></p> </sub> Baseline</p>\n\
    \n| Baseline yx xyx Sup xyx Baseline Baseline xyx yx Sub xyx yx Baseline |\n\n\
    图 9.2 行框与原始基线的垂直对齐，原始基线为黑色，下标和上标的基线为灰色。\n\n# 额外的字体样式\n\n排版不仅仅是指定一种字体。CSS 提供了一套丰富的工具来调整和自定义文本的显示。\n\
    \n# text-decoration\n\n你可以通过 text-decoration 属性设置下划线、删除线或其他装饰（是的，甚至是闪烁）。这些装饰是与边框分开绘制的，仅应用于文本。\n\
    \n- underline: 每行文本都有下划线。\n- overline: 每行文本上方都有一条线。\n- line-through: 每行文本中间都有一条线。\n\
    - blink: 文本闪烁。\n\n多年的约定已经建立并强化了带下划线的文本表示文本是链接。链接不必有下划线，因为它们可以以按钮的形式出现或通过颜色或背景颜色的变化突出，但如果文本带有下划线，它就是链接。\n\
    \n# text-transform\n\ntext-transform 属性控制文本的大小写。这对于导航来说是一个非常有用的属性。\n\n- capitalize:\
    \ 强制每个单词的首字母大大写。\n- uppercase: 所有字符强制转换为大写。\n- lowercase: 所有字符强制转换为小写。\n- none:\
    \ 不进行任何大小写转换（默认）。\n\n# word-spacing\n\n你可以使用 word-spacing 调整单词之间的默认间距。\n\n- <length>:\
    \ 用于单词间距的固定长度。\n- normal: 不进行调整（等同于 0）。\n\n# letter-spacing\n\nletter-spacing\
    \ 属性控制字符的间距。类似于 word-spacing，它定义了对字体的调整。\n\n- <length>: 用于字符间距的固定长度。\n- normal:\
    \ 不进行调整（等同于 0）。\n\n# text-align\n\n块内文本的水平对齐由 text-align 属性定义。\n\n- left: 文本左对齐（默认）。\n\
    - right: 文本右对齐。\n- center: 文本行居中。\n- justify: 文本行对齐的两两侧，根据需要调整单词之间的间距。\n\n> 使用\
    \ text-align: justify 时要小心，特别是在窄列中。排版工具（如连字符，有助于保持每行字符数均匀）浏览器并不提供，它们在计算对齐所需的间距时非常糟糕。这通常会导致行只有几个单词但它们之间存在巨大的间隔。\n\
    \n# white-space\n\n此属性设置元素中空白和换行符的计算方式。\n\n- normal: 文本换行以填充每个行框；空白序列（多个空格、制表符或换行符）会被合并（默认）。\n\
    - pre: 文本被视为源码中的预格式化，空白包括换行符将保持不变（<pre> 元素的默认值）。\n- nowrap: 空白像 normal 一样合并，所有文本强制在同一行。\n\
    \n# word-wrap\n\n除了设置空白行为外，通过 word-wrap 你可以允许浏览器在单词中间断行，以防止长字符串溢出框。\n\n- break-word:\
    \ 允许浏览器在单词内部断行，以防止无空格字符的长单词溢出框；按字符而非音节断词，且不连字符。\n- normal: 单单词无法断开（默认）。\n\n# text-indent\n\
    \ntext-indent 属性定义块中第一行的缩进。\n\n- <length>: 缩进的固定测量值\n- <percentage>: 相对于包含块宽度\
    \ 属性的百分比长度。\n\n"
