  - "[PAGE 182]\n\n# text-shadow\n\n+   - The text-shadow property introduced in CSS3\
    \ allows for one or more <shadow> effects to be applied to the text of an element.\
    \ This shadow is drawn around the letters themselves, rather than around the outer\
    \ edges of the box like box-shadow (Chapter 14).\n\n+   - none: No text shadow\
    \ is applied.\n\n+   - <shadow>: A description of a single shadow is <color> <offset-x>\
    \ <offset-y> <blur-radius> or <offset-x> <offset-y> <blur-radius> <color>, where\
    \ <blur-radius> is optional and defaults to a length of 0.\n\n```\nh2 {\n  text-shadow:\
    \ rgba(0,0,0,0.5) 2px 2px 5px;\n/* transparent black shadow shifted right 2 and\
    \ down 2 with\n  a 5px blur */\n}\n```\n\nYou can create the appearance of embossed\
    \ text by mixing light and dark text-shadow effects, as is done in this multiple-shadow\
    \ example:\n\n```\nh2 {\n  text-shadow: rgba(0,0,0,0.3) 0 -1px, rgba(255,255,255,0.3)\
    \ 0 1px;\n}\n```\n\nMultiple shadows on the same element are are drawn front (first\
    \ shadow listed) to back (last shadow)."
  - '[PAGE 183]


    # The CSS Pocket Guide


    # Reviewing Content for Styling and Legibility


    When building a site, it is useful to define a base set of styles for common elements
    to ensure you start off on the right foot with a readable and accessible design
    based on the chosen font faces, sizes, and colors.


    Early in the project timeline there often isn''t representative copy written for
    different page types or content available that includes common tags such as lists,
    lower-level headings, or text that wraps in uncommon ways. All these elements
    are crucial to allow for reviewing line-height, text-indent, or other properties
    that impact whitespace, aesthetics, and readability. So, how do you code and test
    the default baseline and ensure you''re starting with a readable site if content
    isn''t written and if design comes often have short passages of unfinished text?


    In 2006 I wrote a blog post outlining the use of a generic test file that contained
    a wide variety of HTML elements that could be included into the first page you
    build or be used in a style guide or inventory document (http://placenamehere.com/article/178/).
    I still use this test document for most sites I work on and have placed the code
    in a project on GitHub (http://github.com/placenamehere/PNHTagTest).


    Even earlier in the design process Typograph by Iain Lamb (http://lamb.cc/typograph/)
    lets you interact with the style properties of a sample passage of text and experiment
    with the relationships of type sizes, line heights, whitespace, column widths,
    and the scale of type.


    Both types of tools allow for early adjustment and review of a site''s styling
    and typographic choices and help create a great baseline with which to build the
    rest of the site elements.'
  - '[PAGE 184]


    # Specifying Typefaces


    The choice of font and the availability of font faces can be some of the most
    challenging aspects of web design. There''s a reason that most sites you''ll visit
    appear in Times New Roman, Verdana, or Arial, and that is because there just aren''t
    that quality fonts installed on enough computers to be reliable for web designers.
    Some of that has changed over, time, and in the following sections I''ve outlined
    a few ways to select typefaces for use on the Web.


    # System Fonts


    Operating systems such as Windows, Mac OS X, Linux, iOS, and Android typically
    are bundled with a set of preinstalled fonts. Some extremely common applications
    such as Microsoft Office install additional font files. There are no truly ubiquitous
    fonts for the Web, because even the most common fonts can be disabled or removed
    by the computer''s owner, but these are some of the most commonly available fonts
    on desktop browsers:


    +   - Serif typefaces: Times New Roman, Times, Georgia, Palatino Linotype

    (Palatino on OS X)


    +   - Sans-serif typefaces: Verdana, Arial, Arial Narrow, Arial Black, Helvetica,

    Impact, Trebuchet MS, Tahoma


    +   - Monospace typefaces: Courier New, Courier, Andale Mono, Lucida

    Console'
  - "[PAGE 185]\n\n# The CSS Pocket Guide\n\nTo account for a font being unavailable,\
    \ it is common to list a similar typeface or to two before specifying the generic\
    \ font family, as these examples show: \n\nfont-family: \"Palatino Linotype\"\
    , Palatino, \"Times New Roman\",\nserif;\nfont-family: Tahoma, Arial, Helvetica,\
    \ sans-serif;\nfont-family: Verdana, Geneva, sans-serif;\nfont-family: \"Andale\
    \ Mono\", \"Courier New\", Courier, monospace;\n\nYou can find more detailed information\
    \ on installed fonts in the 24ways article “Increase Your Font Stacks With Font\
    \ Matrix\" by Richard Rutter (http://24ways.org/2007/increase-your-font-stacks-with-font-matrix)\
    \ and on the Code and Style site (http://www.codestyle.org/css/font-family/index.html).\n\
    \n# Font Embedding\n\nTo break free of the short list of commonly installed set\
    \ of \"safe\" fonts, IE4 introduced font embedding in CSS via the @font-face rule.\
    \ With its standardization by the W3C and more recent adoption by other browser\
    \ vendors, font embedding is gaining traction, but it is not without the issues\
    \ that come with early adoption of any technology.\n\n# @font-face\n\nThe @font-face\
    \ rule allows for defining a custom font family and linking that family to a resource\
    \ or resources where the font file data resides.\nTwo sets of values are set with\
    \ this rule:\n\n+   - font-family: The family name for the custom font; used to\
    \ refer to the font-family property later in the style sheet\n- src: The font\
    \ source URI and optional (but in practice, suggested) font format"
  - "[PAGE 186]\n\n# Chapter 9: Typography and Web Fonts\n\nA basic embedded font\
    \ declaration looks like this:\n\n```\n@font-face {\n  font-family: \"Chris Script\"\
    ;\n  src: url(fonts/ChrisScript.ttf);\n}\nh1 {\n  font-family: \"Chris Script\"\
    , cursive;\n}\n```\n\nIf a browser did not support the @font-face rule (or could\
    \ not find or did not understand the particular format of the font), it would\
    \ ignore the first font name when it tried to follow the font-family rule for\
    \ the <h1> element and render the element using the browser-defined cursive font.\n\
    \nA font that may appear on the system can be searched by font name using one\
    \ or more local() values before the url(). This prevents the need to download\
    \ a copy of a font that might be installed on some computers, but it's not ubiquitous\
    \ enough to be relied on or considered safe for use without embedding.\n\n```\n\
    @font-face {\n  font-family: \"Vera Sans Mono\";\n  src: local(\"Bitstream Vera\
    \ Sans Mono\");\n  url(fonts/BSVSM.ttf);\nnh2 {\n  font-family: \"Vera Sans Mono\"\
    , \"Courier New\", cursive;\n}\n```\n\nIf the family name specified in the @font-face\
    \ rule exists already either by a previous rule or because it is on the user's\
    \ system, the new definition will take its place."
  - '[PAGE 187]


    # Font Formats


    Like the HTML5 video wars (http://diveintohtml5.org/video.html), those attempting
    to implement embeddable web fonts to untangle a mess of file format support among
    the various browsers. And like the video format landscape, browser vendors have
    chosen to support different formats because of a mix of licensing and protection
    issues, platform-norms, and legacy behavior. Possible formats include the following:


    +   - "truetype": TrueType fonts (TTF); supported in Safari 3.1+, Chrome 4+, Firefox
    3.5+, Opera 10+

    - "opentype": OpenType fonts (OTF); supported in Safari 3.1+, Chrome 4+, Firefox
    3.5+, Opera 10+

    - "embedded-opentype": Embedded Open Type fonts (EOT) embeddable fonts; supported
    in IE 4+

    - "svg": SVG-based font definition; supported in Opera 10+, Mobile Safari

    - "woff": Web Open Font Format embeddable fonts (WOFF); supported in Firefox 3.6+,
    IE 9+


    From IE4 to IE8, Microsoft supported only the proprietary EOT format out of concern
    that embedding TTF or OT fonts required the raw font files to be posted to a web
    server for the world to download and because so would break the licensing agreements
    covering most fonts. The WOFF was established in 2010 as a standard format for
    embeddable fonts that addresses the piracy issues.


    Until WOFF is widely supported, to embed custom fonts in IE and the rest of the
    browsers, you must provide the font in at least two formats and define them similar
    to the following example.'
- md: "\n```css\n@font-face {\n  font-family: \"Vera Sans Mono\";\n  src: url(fonts/BSVSM.eot);\n\
    \  src: local(\"Bitstream Vera Sans Mono\"),\n  url(fonts/BSVSM.ttf) format(\"\
    truetype\");\n}\n```\n\nFor further discussion of offering multiple font options,\
    \ see Paul Irish’s article “Bulletproof @font-face syntax” (http://paulirish.com/2009/bulletproof-font-face-implementation-syntax/)\n\
    \n## Creating Embeddable Fonts\n\nSo, where do you get all these different font\
    \ formats if all you have a TrueType or OpenType font?\n\nThe Font Squirrel @font-face\
    \ Generator (fontfacecom/generator) takes any uploaded font and converts it into\
    \ all the formats mentioned earlier as well as offers sample CSS embedding code.\
    \ Microsoft released the Web Embedding Fonts Tool (WEFT), a Windows utility to\
    \ create EOT files, and there are WOFF generators being worked on, but since Font\
    \ Squirrel provides that format as well, individual tools are not necessary.\n\
    \n## Font Licensing and Foundries\n\nEven under the protection provided by the\
    \ EOT or WOFF format, by distributing a web font, you may be breaking the licensing\
    \ terms set by the foundry that designed and sold that font. When starting with\
    \ a fresh design, it may be smarter to start with typefaces whose licensing options\
    \ are known. Finding good-quality fonts with options for web embedding is getting\
    \ easier by the day (as I write this, I'm looking forward to the new Fonts.com\
    \ offerings), with these services among those starting to offer great fonts and\
    \ tools to legally embed their fonts:\n\n- Typekit: A subscription-based commercial\
    \ service that works with popular foundries to license and host some of the most\
    \ popular fonts. http://typekit.com/\n- FontSpring: Offers commercial @font-face-friendly\
    \ licensing options for the fonts it sells. http://www.fontspring.com/\n- Font\
    \ Squirrel: More than just a font generator, the Font Squirrel also houses a curated\
    \ collection of free fonts licensed for use on the Web. http://www.fontsquirrel.com/fontface\n\
    - Google Font Directory: In conjunction with offering an embeddable API and tool\
    \ that wraps the @font-face declarations as well as providing caching of fonts\
    \ on its CDN, Google has collected a set of open source fonts, free to use. https://code.google.com/apis/webfonts/\n\
    - WebFonts.info Directory: As part of a broader wiki devoted to web typography,\
    \ this is a list of embeddable typefaces and foundries that support embedding.\
    \ http://www.webfonts.info/\n\n## Custom Fonts via Text Replacement\n\nDesigners\
    \ can use certain techniques besides relying on system fonts or embedding font\
    \ files to achieve the look of a custom font. These techniques have pluses and\
    \ minuses—balancing maintainability, selectability, accessibility, and appearance.\
    \ They also don't have some of the licensing issues of embedded font files not\
    \ being shared. Type set inside an image file and placed in the document using\
    \ an img tag is one way to go, but HTML content cannot be changed via a style\
    \ sheet if a different font is chosen, and the image remains with the HTML source\
    \ when it appears in other contexts such as RSS feeds.\n\nThe font-embedding techniques\
    \ in the previous section are the new kids on the block and aren't free from implementation\
    \ issues such as browser support or font licensing, these older and tested techniques\
    \ are useful to have in your arsenal.\n\nAs with text set directly into an `<img>`\
    \ tag, these techniques can be useful in small doses as as for article headings\
    \ or navigation elements, but replacing large blocks of type on the fly provides\
    \ a good deal of over-head or maintenance problems.\n\n## Image Replacement\n\n\
    Rather than use an image tag to display non-HTML-based text, with image replacement,\
    \ you can use that same image file as a CSS-based background on a more conventional\
    \ HTML element. After sizing and positioning the background image, the foreground\
    \ text must be hidden from the user by shifting its position, changing its display\
    \ value, or doing some similar trick. In the following example (Figure 9.3 on\
    \ the next page), headers are presented with the Bitstream Vera Sans font with\
    \ some embossed effects that cannot be accomplished with CSS- and HTML-based type:\n\
    \n```css\nh2 {\n  display: block;\n  height: 25px;\n  background-image: url(images/sprite_imagagereplace.png);\n\
    \  background-repeat: no-repeat;\n  text-indent: -9999px; /* shift HTML text out\
    \ of view */\n}\n#hdrHome {\n  width: 80px;\n  background-position: 0 0;\n}\n\
    #hdrBlog {\n  width: 63px;\n  background-position: -88px 0;\n}\n#hdrPortfolio\
    \ {\n  width: 107px;\n  background-position: -158px 0;\n}\n#hdrAbout {\n  width:\
    \ 83px;\n  background-position: -272px 0;\n}\n```\n\n```html\n<h2 id=\"hdrHome\"\
    >Home</h2>\n<h2 id=\"hdrBlog\">Blog</h2>\n<h2 id=\"hdrPortfolio\">Portfolio</h2>\n\
    <h2 id=\"hdrAbout\">About</h2>\n```\n\nFigure 9.3\nImage replacement for headings.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_191_0.png)\n\nImage replacement is\
    \ a handy tool if used sparingly and for text that will not change often. The\
    \ technique's major drawback is that it is fairly inflexible and requires images\
    \ (or an image sprite as in the previous example) to be generated for each piece\
    \ of text being replaced or edited.\n\n## Chapter 9: Typography and Web Fonts\n\
    \nFlash Shea has written a good overview and comparison of some the code behind\
    \ various image replacement techniques (http://mezzoblue.com/tests/revised-image-replacement/).\n\
    \n## Flash Replacement with sIFR\n\nThe sIFR project (http://www.mikeindustries.com/blog/sifr)\
    \ uses a Flash to replace the existing text content and redraw it on the fly in\
    \ the desired typeface. sIFR uses a two-step process where the browser renders\
    \ the HTML content based on the styles in CSS, and then, through JavaScript, a\
    \ Flash object is created to replace the HTML content. Information on the element\
    \ content and its styling are passed to the Flash object, making the system more\
    \ adaptive when compared to simple image replacement.\n\nThe major upside over\
    \ the image replacement is in the maintenance. A set of images doesn't need to\
    \ be created each time content is changed, allowing easier for content. The major\
    \ downside is that it requires both JavaScript and Adobe Flash Player.\n\n## JavaScript\
    \ Replacement with Cofón\n\nThe Colón project (http://wiki.github.com/sorcu/cufon/)\
    \ is a toolkit that was built as an alternative to sIFR. It requires turning the\
    \ font into a new format (here, an SVG-based font) and then using a JavaScript-based\
    \ tool to read the HTML page as it loads and replace the designated elements with\
    \ a new rendering.\n\n## Lists and Tables\n\nAll content types fit into one of\
    \ two display types—inline and block. Almost. It may be obvious after thinking\
    \ that tables with their columns, rows, headers, and spanning can't quite be modeled\
    \ by arranging a series of block elements, but lists with numbering or bullets\
    \ also need some tools.\n\n## Lists\n\nHTML list elements (`<ul>` and `<ol>`)\
    \ are simple block elements. Individual list items (`<li>`), too, are sized and\
    \ positioned with the same box model, with dimensions, padding, margins, and borders\
    \ behaving as expected. However, each item needs some extra parts to get the markers\
    \ both positioned properly and designated or incremented properly.\n\n### display:\
    \ list-item\n\nThe default display value for a list item is list-item, allowing\
    \ for the rendering of the box containing the list item marker in addition to\
    \ the normal block element behavior for the list item content.\n\n### list-style-type\n\
    \nYou set the type of marker for a list item via the list-style-type property.\
    \ You can use a plethora of keywords as types; they account for everything from\
    \ the static bullet commonly used for unordered lists to numeric and alphanumeric\
    \ values for different languages and counting systems. The following are some\
    \ of the more commonly used types for English-language sites:\n\n- disc | circle\
    \ | square: Common glyphs; all items in the list will show the same glyph (unless\
    \ changed explicitly)\n- decimal | decimal-leading-zero: Decimal numbers starting\
    \ with 1 or 01, respectively.\n- lower-roman | upper-roman: Lowercase and uppercase\
    \ roman numerals.\n- lower-latin | upper-latin: Lowercase and uppercase ASCII\
    \ letters starting with a or A.\n- none: No marker of any kind is rendered.\n"
