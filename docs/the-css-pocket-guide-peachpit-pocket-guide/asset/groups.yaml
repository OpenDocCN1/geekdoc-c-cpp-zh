    # Backgrounds and Borders


    Through the color and images of backgrounds and borders, a site''s owner or creator
    can transform bland pages of text into designs that convey a mood, aesthetic,
    and branding. That is asking a lot of just two seemingly simple properties, but
    as you''ll see throughout this chapter, they''re very flexible and powerful properties.'
  - '[PAGE 147]


    # Backgrounds


    Backgrounds are an integral part of styling an HTML document. Solid colors, patterns,
    tiles, gradients, unconventional borders, and nonrect-angular shapes can all be
    achieved by applying the various background properties to the right element.


    # background-color


    The background-color property is applied throughout the content area of the element
    and is drawn behind any background-image that is set.


    +   - <color>: The color of the background

    - transparent: No color fill for the background (default)


    # background-image


    The background-image property is used to specify a background image for an element.


    +   - <uri>: The path to the image file in the format url(path) or quoted with
    single or double quotes such as url("path") and url(''path\'').

    - none: No background image is used (default).


    The <uri>, when a relative path, is calculated based on the location of the document
    containing the given style rule and not the source HTML document (unless they
    are one and the same). This way, you don''t have to worry about paths working
    the same from the HTML documents index.html and /blog/2010/07/27/post-title. It
    also makes it easier to move the assets together onto a new server or content
    delivery network.'
  - '[PAGE 148]


    # Chapter 8: Backgrounds and Borders 125


    tip In most situations, it is suggested you set a background color even if it
    will be covered by a background image. A slow or bad connection can sometimes
    mean an image doesn''t load or content can become too large for the area covered
    by a ntiling image. Choose a background color that is sampled from the image or
    pattern used to maintain the desired readability and visual contrast between the
    content and the background.


    # background-repeat


    The tiling of background images is set with the background-repeat property. The
    following keywords are the most commonly used values:


    +   - repeat: The image tiles in both directions (default).


    +   - repeat-x: The image tiles in the horizontal direction.


    +   - repeat-y: The image tiles in the vertical direction.


    +   - no-repeat: The image does not repeat.


    # background-attachment


    The background-attachment property defines how a background position is determined:


    +   - scroll: The background is fixed with respect to the specific element and
    scrolls along with it in the document. (This is the default).


    +   - fixed: The background is fixed with respect to the viewport and does not
    scroll with the element; it appears only when element is ''over'' its position
    in the viewport.


    # background-position


    The background-position property specifies the position of the background image
    (or the positioning of the first background-image tile when repeating) given as
    a set of two values: horizontal and then vertical.'
