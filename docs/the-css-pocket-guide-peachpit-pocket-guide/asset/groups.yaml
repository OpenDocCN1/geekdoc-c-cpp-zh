    \ 8.10 将四个定位的角与背景图像精灵图相结合。\n\n图 8.10\n用于模拟圆角的四个背景。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_166_0.png)\n\
    \n```css\ndiv {\n    position: relative;\n    width: 20%;\n    padding: 8px;\n\
    \    background: #CCC;\n}\n```\n\n（继续见下一页）\n\n```css\n.corner {\n  position: absolute;\n\
    \  padding: 0;\n  width: 14px;\n  height: 14px;\n  background-image: url(images/4_part_corner_sprite.png);\n\
    }\n\n.ctl {\n  top: 0;\n  left: 0;\n  background-position: top left;\n}\n\n.ctr\
    \ {\n  top: 0;\n  right: 0;\n  background-position: top right;\n}\n\n.cbr {\n\
    \  bottom: 0;\n  right: 0;\n  background-position: bottom right;\n}\n\n.cbl {\n\
    \  bottom: 0;\n  left: 0;\n  background-position: bottom left;\n}\n\n...]\n```\n\
    \n<div>\n<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua.</p></div></div>\n\n```html\n\
    <div class=\"corner ctl\"></div>\n<div class=\"corner ctr\"></div>\n<div class=\"\
    corner cbr\"></div>\n<div class=\"corner cbl\"></div>\n</div>\n```\n\n提示：使用 JavaScript\
    \ 动态地将这四个角元素添加到 HTML DOM 中是一种将表现性元素留在标记之外并保持代码简洁的实用方法，特别是当你对页面上的多个不同块进行圆角时。\n\n\
    # 绘制像素\n\n将空元素的定位推向极端，你可以创建 1x1 的框，并细致地重建绘制包含块角的像素。这可以允许一些视觉技巧，例如抗锯齿和更改圆半径，而无需重新创建背景图像文件，但会导致大量的代码和标记开销。\n\
    \n与之前的角解决方案一样，你可以使用 JavaScript 创建、绘制和定位这些额外元素，并为它们设置正确的背景颜色。这种方法的示例在 Curvy Corners\
    \ JavaScript 库（http://www.curvycorners.net/）中实现，它在不支持 border-radius 的浏览器中加载时，使用\
    \ CSS 文档中的 border-radius 属性来绘制圆角。\n\n# 边和背景增强\n\n除了多个背景图像和圆角，CSS3 还有其他其他技巧将迅速进入\
    \ Web 开发者的工具箱。不使用图像创建背景颜色渐变以及使用图像创建边框都在第 14 章中介绍。\n\n本章探讨了如何选择所使用的字体，并讨论了其他让你控制所构建的页面上文本外观和可读性的属性。\n\
    \n# 字体基础\n\n用于渲染文本的字体及其特定特征（如大小和粗细）是通过 `font` 及其相关属性定义的。\n\n`font-family` 属性接受一个用逗号分隔的字体族列表。列表中在读取页面的设备上安装的第一个值将是用于设置文本的字体。\n\
    \n（注：原文中存在大量重复的 OCR 错误文本，此处已按逻辑处理）\n\n"
