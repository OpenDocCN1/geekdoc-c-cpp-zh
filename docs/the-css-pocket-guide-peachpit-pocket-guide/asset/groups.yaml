    ```


    The second value is optional. In cases where it is left off, it is assumed to
    be center.


    The CSS3 transform property, its values, and the transform-origin property are
    supported in some form by Safari 3.2+, Chrome 3+, Opera 10.5+, Firefox 3.5+, and
    Internet Explorer 9.


    # Transitions


    CSS transitions are a way to define parameters for animating changes to CSS properties
    on a specified element. Changes to styles can occur because of updates in element
    state (:hover, :valid, and so on), scripted changes to styles on an element, or
    other scripted changes to the DOM structure causing a change in how selectors
    are applied.


    # transition-property


    transition-property designates which CSS property or properties are animated when
    a change occurs. Animations can occur with most CSS properties; however, some
    properties such as background-image and text-decoration cannot.


    +   - none: No properties will be animated (default).

    - all: All properties that can be animated will be.

    - <property-name>[, <property-name>]: A comma-separated list of one or more properties
    that can be animated if a change occurs.'
  - '[PAGE 277]


    # transition-duration


    The time it takes to transition from the original value of a property to the final
    value can be set via the transition-duration property.


    +   - `&lt;time&gt;`: The time it takes for a transition to complete; in seconds
    (s units)


    # transition-timing-function


    By default the transition between values of a property is animated along an even,
    linear function. You can alter this change via the transition-timing-function
    by choosing between several built-in functions or a custom cubic-bezier curve.


    +   - ease | linear | ease-in | ease-out | ease-in-out: Keywords representing
    different types of built-in functions for animation


    +   - `cubic-bezier(<number>, <number>, <number>, <number>)`: A transition function
    to define a custom cubic-bezier curve


    # transition-delay


    You can add a delay before a transition using the translation-delay property.


    +   - `&lt;time&gt;`: The time it takes before a transition begins animating;
    in seconds (s units)


    # transition (Shorthand)


    The shorthand transition property accepts one or more groups of transition subproperty
    groups in the order: `<transition-property>` `<transition-duration>` `<transition-timing-function>`
    `<transition-delay>`. The following code example defines the transform for the
    hover state on an image and applies a basic easing animation to the transition.'
