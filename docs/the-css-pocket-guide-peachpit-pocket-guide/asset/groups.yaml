    agree\">Do you agree to this site's Terms of Service?</label>\n</p>\n<fieldset>\n\
    ```\n\nFigure 11.7\nLabels for buttons and check boxes.\n\n| Questionnaire | Option\
    \ One | Option Two |\n|---|---|---|\n| Do you agree to this site's Terms of Service?\
    \ | | |\n\n## Inputting Tabular Data\n\nThough using HTML tables for layout is\
    \ outdated, taboo, and semantically incorrect, there are arrangements of forms\
    \ that mimic a table. After all, where is the form data headed most often but\
    \ a database table or series of tables? So if you have a series of inputs for\
