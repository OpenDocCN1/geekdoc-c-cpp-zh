    # Working with Form Controls


    As different as they can be from platform to platform, form elements on the major
    desktop browsers tend to share the basic properties; sizing, fonts, colors, and
    backgrounds all can be set as they would on any other HTML element. Because some
    controls are more complex than your average block of text, how those properties
    are applied can be a bit peculiar. There''s no hard and fast rule covering where
    a border is drawn or what parts of the select widget handle a color applied to.


    > Safari will draw native form controls (the bubbly look on OS X) even when some
    styles are defined. Set a border on the element to force it out of the native
    mode and into one that takes other styles such as color or backgrounds.


    # Sizing


    Form elements, like images, are inline replaced elements. For styling purposes,
    it is best to think of them as rectangular boxes even when they’re“round” radio
    buttons or made of multiple parts like file input fields. When setting the height
    and width of a form element, you’re setting the dimensions on the outer box. What
    the field inside that box does to fill the space is out of your hands.


    Although elements such as textareas and buttons fill the entire rectangular box,
    check boxes, radio buttons (Figure 11.2 on the next page), and file input fields
    reserve the specified space in the layout but in various ways to fill that space
    (or not really fill it, as shown in some of these examples).'
  - "[PAGE 213]\n\n# 190 The CSS Pocket Guide\n\nFigure 11.2 Radio buttons in Safari\
    \ 5.0.1/OS X, Firefox 3.6.8/OS X, Firefox 3.0.1/Windows, IE 8/Windows, and Opera\
    \ 10.6.1/Windows (from left to right) with a 100-pixel width, 100-pixel height,\
    \ 1-pixel red border, and 10-pixel padding.\n\nTo further complicate things, textareas,\
    \ text inputs, and similar elements aren’t quite like the other elements since\
    \ they follow the content-box box sizing model, whereas other elements use the\
    \ border-box model. Setting the box-model property to border-box helps regain\
    \ some consistency between text inputs and selects and buttons, with the drawback\
    \ of making them behave less like the labels or paragraphs that surround the fields.\n\
    \n```\nform input[type=\"text\"],\nform input[type=\"password\"],\nform input[type=\"\
    file\"],\ntextarea {\n  -ms-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n\
    \  -webkit-box-sizing: border-box;\n  box-sizing: border-box;\n}\n```\n\n# Colors,\
    \ Backgrounds, and Borders\n\nLike sizing, colors apply as you’d expect them for\
    \ text in elements such as submit buttons, textareas, and password fields. On\
    \ the other hand, the behavior of radio buttons, check boxes, and select options\
    \ will vary based on the browser and platform, so consider the color to be just\
    \ a suggestion, not a rule."
