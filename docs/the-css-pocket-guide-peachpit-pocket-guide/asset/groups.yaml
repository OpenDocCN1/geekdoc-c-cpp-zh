    # # An Alternative Box Model


    In some Quirks Mode scenarios or if set via the box-sizing property introduced
    in CSS3, an element’s padding and border are drawn *inside* the width and height,
    taking space away from the content area.


    # ## box-sizing


    The box model used when calculating and placing borders and padding areas can
    be set using the box-sizing property.


    +   - content-box: The width and height dimensions refer to the content area with
    padding and borders drawn outside (default).'
- md: "\n- border-box: The width and height dimensions contain the border and padding\
    \ as well as the content of the element, while an element’s margins continue to\
    \ fall outside of this area.\n\nAlthough using box-sizing: border-box may sometimes\
    \ seem appealing (such as when mixing a percentage-based width and pixel-based\
    \ border), this box-sizing model may cause confusion and difficulty when mixing\
    \ with code written by others or working with a team of developers accustomed\
    \ to the standard content-box behavior.\n\n# Positioning and Floats\n\nChapter\
    \ 5 covered how block-level elements are given their shape and size. Before jumping\
    \ headfirst into creating multi-column layouts with these blocks, you need to\
    \ learn how to position elements in your documents in relationship to the other\
    \ items on a page.\n\n# The Document Flow\n\nReading content in an HTML document,\
    \ without any JavaScript or CSS applied, is a top-down and left-to-right affair.\
    \ Block elements take up the entire width of the document and follow one after\
    \ another with their inline content flowing inside them. Margins and padding may\
    \ alter the look or spacing some, but they alone do not change the positioning\
    \ of the elements.\n\nYou have three ways to change the default positioning and\
    \ interaction between elements in the top-down blob of content: You can force\
    \ an element to behave like a different type of element, you can pull the item\
    \ out of the flow completely, or you can pull the item to the side of its container\
    \ and allow other items to wrap around it.\n\n# display\n\nThe display property\
    \ is the key to the entire layout castle. I've already covered block elements\
    \ and inline elements, but you need a number of other element types to define\
    \ all the content that might display on a web page, including the following:\n\
    \n- inline: Creates one or more inline boxes, the familiar inline content\n- block:\
    \ Creates a block box\n- inline-block: Creates a block box that behaves like an\
    \ inline box, similar to the image (replaced element) behavior\n- list-item: Creates\
    \ a block box for the content and the list item marker\n- table, table-row, table-caption:\
    \ Creates three of the types of elements needed to present a table (Chapter 10)\n\
    - none: Removes the element from the presentation entirely, drawing box of any\
    \ kind\n\nAlternating elements between the trio of inline, block, and none is\
    \ sufficient for most design tasks, and as luck would have it, they are also the\
    \ most widely supported values.\n\n# Position\n\nThe positioning of an element\
    \ is based on the length of the box offset parameters: top, right, bottom, and\
    \ left. Typically, top and left will be used for positioning elements since the\
    \ top-left corner of the item being measured from—the beginning of a box—is easily\
    \ understood in normal document flows.\n\n# static\n\nstatic is the default value\
    \ where an element is rendered in the normal flow and not uniquely positioned.\
    \ The positioning parameters top, right, bottom, and left do not apply.\n\n# relative\n\
    \nIn relative positioning, an element’s position is calculated as normal, and\
    \ then the offset positioning is applied relative to this normal position. Relative\
    \ positioning does not take the element out of the normal flow, which leaves a\
    \ space behind in the element’s original position.\n\nA relative positioned element\
    \ with box offsets set to 0 (or undefined) will appear in its normal position;\
    \ however, it will create a new point of origin for any of its child elements\
    \ that may be positioned absolutely.\n\n# absolute\n\nAbsolute positioning takes\
    \ the element out of the normal document flow—collapsing any space it may have\
    \ otherwise used—and positions it in relation to the origin point created by the\
    \ last-positioned containing block.\n\nThe code used for Figure 6.1 demonstrates\
    \ how to use absolute-positioning to place elements at the four corners of its\
    \ containing element.\n\nFigure 6.1 Elements placed into four corners with absolute\
    \ positioning.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_109_0.png)\n\n```css\n\
    div {\n  position: relative;\n  width: 150px;\n  border: 1px dotted #999;\n}\n\
    div div {\n  position: absolute;\n  width: 25px;\n  height: 25px;\n  background-color:\
    \ #ccc;\n  border: none;\n  text-align: center;\n}\n```\n\n```css\ndiv .corner1\
    \ {\n  top: 0;\n  left: 0;\n}\ndiv .corner2 {\n  top: 0;\n  right: 0;\n}\ndiv\
    \ .corner3 {\n  bottom: 0;\n  right: 0;\n}\ndiv .corner4 {\n  bottom: 0;\n  left:\
    \ 0;\n}\n```\n\n```html\n<div class=\"corner1\">1</div>\n<div class=\"corner2\"\
    >2</div>\n<div class=\"corner3\">3</div>\n<div class=\"corner4\">4</div>\n```\n\
    \nFixed-positioned elements do not scroll with the rest of the document. As the\
    \ name implies, fixed is based on the viewport. Fixed-positioned elements are\
    \ widely supported in current browsers, but if you find you need to support older\
    \ browsers as well, you should use a bit of JavaScript that will position the\
    \ element absolutely and monitor the scrollbar to change it. This solution can\
    \ be a little jumpy, so it's best to use position: fixed where it is supported.\
    \ Fixed is most often used for toolbars or banners and not for laying out an overall\
    \ web page.\n\n# Origins and Containing Blocks\n\nContaining blocks and the behavior\
    \ of managing multiple origins for measuring from can be one of the more confusing,\
    \ but more powerful, aspects of CSS.\n\nThe root element of the document is the\
    \ initial containing block for which absolute positioning is measured. However,\
    \ if any other element is positioned—relatively, absolutely, or fixed in the viewport—it\
    \ becomes the new origin for its descendant elements. This behavior is probably\
    \ best illustrated with an example (Figure 6.3).\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_112_0.png)\n\
    \n**Figure 6.3 The position of the black #innerPositionedBox is measured from\
    \ its containing block.**\n\n```css\ndiv {\n  border: 1px dotted #000;\n  padding:\
    \ 20px;\n}\n#containingBlock {\n  position: relative;\n}\n#innerPositionedBox\
    \ {\n  position: absolute;\n  top: 0;\n  left: 0;\n  background-color: #000;\n\
    }\n```\n\n```html\n<div id=\"containingBlock\">\n  <div>\n    <div>\n      <div\
    \ id=\"innerPositionedBox\">\n      </div>\n    </div>\n  </div>\n</div>\n```\n\
    \nRegardless of how deeply the element #innerPositionedBox is nested, the positioning\
    \ for top and left is measured from the last positioned ancestor, #containingBlock.\
    \ If you didn't change the CSS code for this example altered the markup structure\
    \ slightly so that one of the middle <div> elements is #containingBlock, then\
    \ the #innerPositionedBox element would instead use that element for its origin\
    \ (Figure 6.4).\n"
  mdcn: "\n\n- border-box: 宽度和高度包含了元素的边框（border）、内边距（padding）以及内容，而元素的外边距（margins）在该区域之外。\n\
    \n尽管使用 `box-sizing: border-box` 有时看起来很有吸引力（例如当将百分比宽度与像素边框混合使用时），但这种盒模型模型在与他人编写的代码混合，或与习惯标准\
    \ `content-box` 行为的团队协作时，可能会导致困惑和困难。\n\n# 定位与浮动\n\n第 5 章介绍了如何赋予块级元素形状和大小。在全头投入使用这些块创建多列布局之前，你需要学习如何相对于页面上的其他项目对文档中的元素进行定位。\n\
    \n# 文档流\n\n在不应用任何 JavaScript 或 CSS 的情况下，读取 HTML 文档的内容是从自上下、从左到右的。块元素占据文档的整个宽度，并一个接排列，其内联内容在其内部流动。外边距和内填充可能会改变外观或间距，但它们本身不会改变元素的定位。\n\
    \n你有三种方法来改变自上下内容流中元素之间的默认定位和交互：你可以强制元素表现得像不同类型的元素，你可以将元素完全从流中取出，或者你可以将元素拉到容器的侧边并允许其他项目环绕它。\n\
    \n# display\n\n`display` 属性是整个布局城堡的关键。我已经涵盖了块级元素和内联元素，但你需要其他元素类型来定义可能显示在网页上的所有内容，包括：\n\
    \n- inline: 创建一个或多个内联盒，即熟悉的内联内容\n- block: 创建一个块盒\n- inline-block: 创建一个表现得像内联盒的块盒，类似于图像（替换元素）的行为\n\
    - list-item: 为内容和列表项目标记创建一个块盒\n- table, table-row, table-caption: 创建呈现表格所需的三个类型的元素（见第\
    \ 10 章）\n- none: 完全从演示中移除该元素，不绘制任何类型的框\n\n对于大多数设计任务，在 `inline`、`block` 和 `none`\
    \ 这三者之间交替使用元素就足够了，而且 幸运的是，它们也是支持得最广泛的值。\n\n# Position\n\n元素的定位基于盒偏移参数的长度：`top`、`right`、`bottom`\
    \ 和 `left`。通常，`top` 和 `left` 将用于定位元素，因为被测量的项目的左上角——即盒的起点——在正常文档流中是容易理解的。\n\n#\
    \ static\n\n`static` 是默认值，元素在正常流中渲染且不进行唯一定位。定位参数 `top`、`right`、`bottom` 和 `left`\
    \ 不起作用。\n\n# relative\n\n在相对定位中，元素的位置首先按正常方式计算，然后相对于此正常位置应用偏移定位。`relative` 定不会将元素移出正常流，这会在元素的原始位置留出空间。\n\
    \n一个盒偏移量设为 0（或未定义）的相对定位元素将出现在其正常位置；然而，它将为其任何可能进行绝对定位的子元素创建一个新的原点。\n\n# absolute\n\
    \n`absolute` 定将元素从正常文档流中移出——折叠它原本可能占用的任何空间——并相对于最后一个定位的包含块所创建的源点进行定位。\n\n用于图 6.1\
    \ 的代码演示了如何使用绝对定位将元素放置在其容器元素的四个角上。\n\n图 6.1 使用绝对定位放置在四个角的元素。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_109_0.png)\n\
    \n```css\ndiv {\n  position: relative;\n  width: 150px;\n  border: 1px dotted\
    \ #999;\n}\ndiv div {\n  position: absolute;\n  width: 25px;\n  height: 25px;\n\
    \  background-color: #ccc;\n  border: none;\n  text-align: center;\n}\n```\n\n\
    ```css\ndiv .corner1 {\n  top: 0;\n  left: 0;\n}\ndiv .corner2 {\n  top: 0;\n\
    \  right: 0;\n}\ndiv .corner3 {\n  bottom: 0;\n  right: 0;\n}\ndiv .corner4 {\n\
    \  bottom: 0;\n  left: 0;\n}\n```\n\n```html\n<div class=\"corner1\">1</div>\n\
    <div class=\"corner2\">2</div>\n<div class=\"corner3\">3</div>\n<div class=\"\
    corner4\">4</div>\n```\n\n`fixed` 定位元素不随文档滚动。正如其名所示，`fixed` 是基于视口的。`fixed` 定位元素在当前浏览器中被广泛支持，但如果你发现需要支持旧浏览器，你应该使用一些\
    \ JavaScript 来绝对定位元素并监控滚动条以更改它。这种解决方案可能会有些抖动，因此最好在支持的地方使用 `position: fixed`。\n\
    \n# 源与包含块\n\n包含块以及管理多个测量原点的行为可能是 CSS 最令人困惑但也强大的方面之一。\n\n文档的根元素是绝对定位的初始包含块。然而，如果任何其他元素被定位（相对、绝对或固定相对于视口），它将成为其后代元素的新原点。这种行为最好通过一个示例来说明（图\
    \ 6.3）。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_112_0.png)\n\n**图 6.3 黑色 #innerPositionedBox\
    \ 的位置是从其包含块衡量的。**\n\n```css\ndiv {\n  border: 1px dotted #000;\n  padding: 20px;\n\
    }\n#containingBlock {\n  position: relative;\n}\n#innerPositionedBox {\n  position:\
    \ absolute;\n  top: 0;\n  left: 0;\n  background-color: #000;\n}\n```\n\n```html\n\
    <div id=\"containingBlock\">\n  <div>\n    <div>\n      <div id=\"innerPositionedBox\"\
    >\n      </div>\n    </div>\n  </div>\n</div>\n```\n\n无论元素 #innerPositionedBox\
    \ 嵌套得有多深，`top` 和 `left` 的定位都是相对于最后一个定位的祖先 #containingBlock 衡量的。如果你在不更改此示例 CSS\
    \ 代码的情况下，稍微修改了 HTML 结构，使得中间的某个 `<div>` 元素成为 #containingBlock，那么 #innerPositionedBox\
    \ 元素将改为使用该元素作为其原点（图 6.4）。\n\n"
