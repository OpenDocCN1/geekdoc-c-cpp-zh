    - outset: 看起来像是内容是从页面上凸起的\n\n对于 dotted, double, groove, ridge, inset 和 outset，较小的\
    \ border-width 值可能会改变所需的视觉效果——你无法将单个像素点圆润化，也无法在两个像素的空间内找到空间来绘制双线边框的两条线和之间的间隙。\n\
