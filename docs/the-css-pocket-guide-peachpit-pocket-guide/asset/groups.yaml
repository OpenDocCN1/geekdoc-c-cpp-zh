    1\">\n  <fieldset class=\"extra disabled\">\n    <label for=\"option1extra\">Extra\
    \ Info for Option One</label>\n    <textarea></textarea>\n  </fieldset>\n</div>\n\
    <div>\n  <label for=\"chooseOption[2]\">Option Two:</label>\n  <input type=\"\
    radio\" name=\"chooseOption\" id=\"chooseOption[2]\" value=\"2\">\n  <fieldset\
    \ class=\"extra\">\n    <label for=\"option2extra\">Extra Info for Option Two</label>\n\
    \    <textarea></textarea>\n  </fieldset>\n</div>\n</form>\n```\n\n```css\nfieldset.disabled\
    \ {\n  display: none;\n}\n```\n\n```css\ninput[type=\"radio\"]:checked+fieldset.extra\
    \ {\n  display: block;\n}\n```\n\n## Placeholder Text\n\nA fairly convention with\
    \ text is to place a small hint into the field. HTML5 introduces the placeholder\
    \ attribute. To accomplish this without either attribute, you can create a label\
    \ deconstructed in Figure 11.8.\n\nFigure 11.8\ndeconstructing the input area.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_224_0.png)\n\n## Making Buttons\n\n\
    Getting users to interact with a site and share their information is the primary\
    \ purpose of any form; as such, buttons need to be styled. A key hurdle to easy\
    \ button styling is that buttons are just one HTML element, and there is only\
    \ so much that can be done to one.\n\n## Background Images\n\nBackground images\
    \ can do a lot for a button: add depth, add the look of ready and depressed states,\
    \ and create many other effects that a mix of color and border alone cannot.\n\
    \nSubmit button sizes are typically flexible to allow for a wide range of text\
    \ lengths or font sizes. A fixed-size button paired with a single non-repeating\
    \ background image can lead to text escaping the boundaries. With controlled button\
    \ labels or a large enough button style providing leeway for these cases, the\
    \ fixed width and height is possible. Otherwise, stick with repeatable patterns\
    \ and borders used to mark the sides of the element.\n\n## CSS3: text-shadow,\
    \ border-radius, and Gradients\n\nThe text-shadow property described in Chapter\
    \ 9 is a useful way to enhance button text styling. Background images are nice,\
    \ but they come with some noted inflexibility. The border-radius property, when\
    \ combined with color gradients (Chapter 14), can make creating flexible and good\
    \ buttons quite simple.\n\nThe CSS Tricks Button Maker (http://css-tricks.com/examples/ButtonMaker/)\
    \ is a little demo app that lets you adjust all these properties visually and\
    \ then shows you the CSS code behind it.\n\n## Links As Buttons\n\nLinks are often\
    \ interchangeable with submit buttons in a site's design. The call to action may\
    \ sometimes be associated with a form but often not. Choose a class to use for\
    \ links that should be styled similarly to button actions, and style both together\
    \ in your code. And while you're at it, don't forget the different states for\
    \ each or the other types of button elements (the button element as well as the\
    \ button input type).\n\n**Figure 11.9 (on the next page)** shows three different\
    \ clickable HTML elements styled similarly.\n"
