    # Combining and Chaining Selectors


    Using combinators, you can chain together the individual selectors discussed earlier
    to create more complex selectors that can be used to describe elements not just
    in the entire document but in specific parts of the document or that match specific
    markup patterns. The following are all examples of chaining simple selectors:


    ```

    nav ul li:first-child {}

    .vevent h2* {}

    ul ul ul ul li {}

    #page .hentry a.entry-title:link {}

    div#main registration fieldset

    -> input[type="text"]:invalid {

    ```


    # Translating Selectors into Plain English


    If it hasn''t yet become clear, selectors can be read from left to right and described
    as traveling toward the top of the document tree. The selector header ul>li selects
    “any list item elements that are children of unordered list elements that are
    contained in a header element.


    If you are ever unsure of what a selector does, the online tool SelectOracle (http://gallery.theopalroup.com/selectoracle/)
    translates CSS2 and CSS3 selectors into English (or Spanish) for you.'
  - '[PAGE 74]


    # Specificity


    If the only thing that governed which property gets applied to an element is the
    order in which the selectors appear, working with CSS would be a never-ending
    battle of copying and pasting and rearranging code. Rules of specificity—how specific
    the description of the element in the selector is written—are used to determine
    which properties will apply.


    In the previous code, all paragraph elements will have a 20-pixel margin on each
    side; however, because the selector matching paragraphs contained in blockquote
    elements is more specific, those will be the desired color green, even though
    the rule is found before the simple selector.


    Specificity is calculated by tallying grouping the simple selectors into three
    buckets, tallying each of those buckets (a-b-c), and finally comparing the results
    to other competing rules. This is from the CSS3 Selectors Module (http://www.w3.org/TR/css3-selectors/#specificity):


    +   A selector''s specificity is calculated as follows:

    * count the number of ID selectors in the selector (= a)

    * count the number of class selectors, attributes selectors, and pseudo-classes
    in the selector (= b)

    * count the number of type selectors and pseudo-elements in the selector (= c)

    * ignore the universal selector'
  - "[PAGE 75]\n\n# The CSS Pocket Guide\n\nSelectors inside the negation pseudo-class\
    \ are counted like any other, but the negation itself does not count as a pseudo-class.\n\
    \nConcatenating the three numbers a-b-c (in a number system with a large base)\
    \ gives the specificity.\n\nYou might have gotten lost somewhere around “in a\
    \ number system with a large base,” and I wouldn’t blame you. Looking at a few\
    \ examples should clear things up:\n\n```\n#user { color: rgb(1,1,1); } /* a=1\
    \ b=0 c=0 */\n#user:first-child { color: rgb(2,2,2); } /* a=1 b=1 c=0 */\ndiv+div\
    \ div+div div div div>div div:first-child {\n  color: rgb(3,3,3);\n} /* a=0 b=0\
    \ c=13 */\ndiv.foo { color: rgb(4,4,4); } /* a=0 b=1 c=1 */\n.foo .foo+.foo .foo+.\
    \ .foo .foo .foo .foo>.foo .foo\n-> .foo:first-child {\n  color: rgb(5,5,5);\n\
    }\n/* a=0 b=12 c=1 */\n.foo.bar { color: rgb(6,6,6); } /* a=0 b=2 c=0 */\n[id=\"\
    user\"] { color: rgb(7,7,7); } /* a=0 b=1 c=0 */\n```\n\nIf all these selectors\
    \ matched the same element in a complex HTML document, the text in that element\
    \ would be the color rgb(2,2,2). Though some of the selectors, particularly the\
    \ third and fourth, are more verbose then others, the second is considered the\
    \ one with the greatest specificity.\n\nThe bit about concatenating the number\
    \ in a non-decimal-based number system is a reminder that when combining the results,\
    \ you need to compare them as buckets. For example, compare [1][1][0] vs. [0][12][1]\
    \ instead of 110 vs. 121."
