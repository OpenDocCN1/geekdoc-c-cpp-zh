    - 访问 W3C CSS 工作组关于 CSS 规范的当前工作索引。http://www.w3.org/Style/CSS/current-work

    - 你也可以参考 Peter-Paul Koch 在 QuirksMode.org 上编写的详细浏览器支持图表以及其他 Web 开发文章。http://quirksmode.org/

    - WASP 交互项目（Interact Curriculum）提供了一套完整且持续的课程，用于学习和教授 Web 开发及 Web 设计（包括 CSS）。http://interact.webstandards.org/

    - Mozilla 开发者中心（Mozilla Developer Center）提供了 CSS 语言的完整参考文档，非常适合快速查询。https://developer.mozilla.org/en/CSS_Reference

    - Opera 开发者网络（Opera Developer Network）提供了涵盖 Web 开发所有领域的文章、教程和参考，包括一个你可以按照其进行进行自学的课程。http://dev.opera.com/


    # 编写 CSS


    与 JavaScript 等编程语言不同，CSS 的语法和 CSS 规则的组成并不复杂。接下来的章节将重点介绍你在深入研究简单语法所能实现的复杂功能之前应该了解的内容。


    # 大写敏感


    CSS 是不区分大小写的。例如，属性 `color` 等同于 `COLOR` 属性，`px` 单位与 `PX` 或 `P` 单位相同。按照惯例，属性和值通常使用小写字母，这也是本书遵循的惯例。


    不受 CSS 控制的代码部分，如样式表文档的文件路径、图像、元素名称、类和 ID 可能是区分大小写的，并且取决于它们的定义源。例如，某个服务器上的文件路径可能是区分大小写的，但在另一个服务器或你的本地机器上可能不是。对于标记而言，HTML
    文档中的元素是不区分大小写的；但基于 XML 的文档中的元素是区分。


    为了避免混淆或代码错误，无论系统是否强制执行，最好在你的代码中保持大小写一致。


    # 注释


    CSS 中只有一种编写注释的方法——以两个字符 `/*` 开头，并以这两个字符的反转 `*/` 结尾。这两个字符之间的任何文本、代码或空白都会被忽略。


    ```

    /* 这是一个注释 */

    ```


    # 空格


    在 CSS 中，空白——包括空格字符、制表符和换行符——在作为后代选择器（第 3 章）或作为单条声明中多个值的分隔符之外，是没有意义的。在这两种情况之外，它们被认为是可选的。你可以根据需要使用空白（或不使用）来格式化你的
    CSS，以帮助代码的组织和可读性。


    # 引号与转义


    单引号（`''`）和双引号（`"`）可以交叉用于包裹 CSS 中的字符串值（尽管如果字符串以单引号开头，则必须以相同的引号结尾）。


    反斜杠（`\`）是 CSS 中的转义字符。它可以用于转义字符串中的引号标记（或作为字符串部分的另一个反斜杠）。反斜杠字符还可以通过其字符代码来包含字符。


    对于某些类似字符串的引用，例如 `url()` ，允许省略字符串周围的引号。


    关键词（如颜色名称）不是字符串，且不能加引号。


