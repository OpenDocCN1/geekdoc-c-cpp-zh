    # 表达相同含义的多种方式


    以下是文档中段落元素设置相同文本颜色的所有方法：


    ```

    p { color: #fff; }

    p { color: #ffffff; }

    p { color: rgb(255,255,255); }

    p { color: rgb(100,100,100); }

    p { color: hsl(0,0%,100%); }

    p { color: white; }

    ```


    你选择的表示法取决于许多因素。你对不同颜色系统的熟悉程度（哪种最容易从你喜爱的图形应用程序中转换）、或者网站色板的设计，都会影响这一决策。使用 `hsl()`
    可以更容易通过 JavaScript 编写过渡效果，但要注意浏览器的兼容性问题，因为它是定义颜色的最新方法。


    # 带有 Alpha 透明度的颜色


    CSS3 定义了在原本实色的颜色指定中添加一层透明度的能力。在边框、文本颜色或背景上应用 alpha 透明度，可以让目标元素背后的颜色透出来或与背景颜色混合。图
    4.1 显示了如何使用透明背景色来弱化背景图像产生的干扰，从而使文本变得可读。


    颜色中的透明度仅适用于该颜色的元素部分，不会影响其可能包含的元素或图像等其他对象的透明度。我将在第 6 章中讨论 `opacity`（不度）属性，它适用于整个元素的可见性。


    # 第 4 章：测量、URL 和颜色单位


    图 4.1


    使用透明背景色使实色文本在背景图像上更具读性。


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_88_0.png)


    # rgba(r,g,b,a)


    r、g 和 b 值的量程与本章之前讨论的 `rgb()` 单位相同。alpha (a) 值是一个 0 到 1 之间的小数，其中 0 表示完全透明，1 表示不透明。


    ```

    section { background-color: rgba(0,255,0,0.1); } /* 非常透明的绿色 */

    ```


    alpha 值为 1 的颜色单位等同于使用实色单位。可以考虑使用后者，因为它可能被更多的浏览器支持。


    # hsl(h,s,l,a)


    类似于 `rgba()`，`hsl()` 与 `hsl()` 相同但增加了透明度指定。该单位也是一个 0 到 1 之间的小数。


    ```

    a { background-color: rgba(0,0,0,0.9); } /* 几乎全黑 */

    ```


    # `transparent` 关键字表示完全透明的颜色值（因此通道指定并不重要）。你可以将其视为一种简写（在浏览器中被计算为 `rgba(0,0,0)`）。


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_89_0.png)


    # 第 4 章：测量、URL 和颜色单位


    # 创建和维护色板


    为网站定义一套色板并坚持使用这组颜色值，可以作为网站上新元素样式的有用工具，为整个网站提供一致的外观，并在进行更改时易于找到颜色值。


    # 设计


    颜色理论远远超出了本书的范范围，是你可以研究几年的领域；然而，这里为选择网站配色方案提供几点建议：


    - 像 Photoshop 这样的设计应用程序提供了详细的选取器，可以在 RGB、HSL 和其他颜色系统之间切换，从而轻松转换为 CSS 单位。

    - Adobe Color 是一个工具，可以从桌面桌面或从图像文件（http://color.adobe.com/）中创建、浏览和书签色块。


    # 维护


    在大量的 CSS 代码中维护一致的颜色用法有时是困难的。颜色单位定义在许多不同的声明中，很容易保持相同的色调。以下是一些让任务变得更容易的技巧：


    - 选择一种颜色类型并坚持使用它，这样在需要更改颜色时搜索颜色会更容易。不要交替使用 `#ff0000` 和 `rgb(100%,0,0)`。

    - 维护一份样式指南，列出网站使用的所有颜色及其首选表示值，并仅使用这些颜色。

    - 对于复杂或非常大的网站，考虑使用第 13 章讨论过的那些 CSS 预处理器，它们允许你在代码中一次性定义颜色值的占位符。


    # 盒模型


    块级元素在布局中所占据的空间由 `height`（高度）、`width`（宽度）、`padding`（内边距）和 `border`（边框）属性的值控制。这些属性如何相互作用以及如何进行计算被称为盒模型。


    # CSS 指南


    在标准盒模型 (`content-box`) 中，元素的内边距、边框和外边距被加上元素的宽度和高度，以确定它在布局中所占据的空间。图 5.1 显示了 CSS2.1
    规范（http://www.w3.org/TR/CSS21/box.html）中的盒模型图。这种宽度或高度不包含在内的累加过程导致导致元素占据的总尺寸对某些人来说可能是反直觉的，但在嵌套元素或处理如图像或视频等你不希望侵占内容区域的内容时，这种方法非常好。


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_93_0.png)


    **图 5.1** 标准盒模型。T、R、B、L 缩写代表每个属性的上、右、下、左值。


    # 属性


    width


    `width` 属性定义元素的宽度。


    - `<length>`：宽度将为固定尺寸。

    - `<percentage>`：宽度将为容器块宽度的百分比。

    - `auto`：宽度将根据可用水平空间计算（默认）。


    height


    `height` 属性设置元素的高度。


    - `<length>`：高度将为固定尺寸。

    - `<percentage>`：高度将为容器指定高度的百分比；如果没有指定容器高度，则等同于 `auto`。

    - `auto`：高度将适应可用内容（默认）。


    margin

    `margin` 属性设置元素周围的四个边距。每个边可以取以下值之一：


    - `<length>`：外边距将为固定尺寸。

    - `<percentage>`：外边距将为容器块宽度的百分比（适用于垂直和水平方向的外边距）。

    - `auto`：对于左右外边距，`auto` 计算为到达容器元素边缘所需的长度；对于顶部和底部，它计算为 `0`。


    ```

    margin-top: 1px;

    margin-right: 20%;

    margin-bottom: 0;

    margin-left: 40px;

    margin: 2em; /* 简写：所有边 */

    margin: 2em 0; /* 简写：上下；左右 */

    margin: 2em 0 1em; /* 简写：上，左右，下 */

    margin: 2em 0 1em 10px; /* 简写：上；右；下；

    左 */

    ```


