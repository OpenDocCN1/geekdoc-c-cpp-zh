    # Points (pt)


    ```

    body { font-size: 12pt; }

    ```


    Points are an absolute length-based unit (<length>) equal to 1/72 of an inch.
    Points can be useful when setting type sizes for print and similar media where
    physical measurements may be stressed. On screen and mobile media, points are
    approximated based on the resolution of the display and the system settings, and
    working with px or em units can lead to more consistent results.


    # Percentages (%)


    ```

    .column1 { width: 30%; } /* 30% of the containing block

    width */

    p { line-height: 140%; } /* 140% of the font-size of the

    element */

    p.note { font-size: 90%; } /* 90% of the parent''s

    font-size */

    ```


    Percentage-based units (<percentage>) are relative to another measurement. Percentages
    can be greater than 100 percent. Which measurement the value relates to is defined
    on a case-by-case basis; the previous code lines show some examples.'
