    \nThe border-color property takes one to four <color> values signifying the colors\
    \ for the border on each of a block's four sides. Like with margin and padding,\
    \ when one color is provided, it applies to all sides. With two, the first value\
    \ applies to the top and bottom, and the second applies to the right and left.\
    \ With three, the first applies to the first top; the second applies to the left\
    \ and right; and the third applies to the bottom. With four values, it applies\
    \ to each side clockwise from the top. border-color can be expanded to border-top-color,\
    \ border-right-color, border-bottom-color, and border-left-color.\n\n## border-style\n\
    \nThe design of the border is set via one to four keywords assigned to the border-style\
    \ property.\n\n- none: No border drawn\n- dotted: A series of \"round\" dots;\
    \ roundness varies by browser and border width\n- dashed: A series of dashes\n\
    - solid: A solid line\n- double: Two solid lines separated by a space\n- groove:\
    \ Looks like a groove has been carved by the border\n- ridge: Gives the look of\
    \ a ridge coming out of the canvas\n- inset: Gives the appearance that the content\
    \ was inset into the page\n- outset: Gives the appearance that the content was\
    \ raised from the page\n\nFor dotted, double, groove, ridge, inset, and outset,\
    \ a small border-width value may alter the desired appearance—you cannot round\
    \ a single pixel dot or find the room within two pixels to draw the two lines\
    \ and a gap of a double border.\n\nLike border-color, border-style can be expanded\
    \ into four border-*-style properties.\n\n## border-width\n\nThe size of the border\
    \ for each side. See Chapter 5.\n\n## border (Shorthand)\n\nThe border shorthand\
    \ property accepts up to three values representing border-width, border-style,\
    \ and border-color.\n\nAdditional shorthand properties are available for the individual\
    \ sides of a block as border-top, border-right, border-bottom, and border-left.\n\
    \n```css\nfieldset {\n  border: 1px solid rgb(100,100,200); /* set all 4 borders\
    \ */\n  border-bottom: 5px double rgb(100,100,200); /* change bottom border only\
    \ */\n}\n```\n\n## border-radius\n\nborder-radius was introduced in CSS3 to allow\
