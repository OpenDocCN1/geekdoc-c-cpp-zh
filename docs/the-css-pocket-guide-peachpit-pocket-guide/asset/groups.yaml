    # # Mobile Media


    Handheld and mobile devices typically have small physical screens (even as they
    have increasingly higher resolutions). They also have slightly different interaction
    models such as touchscreens or heavily keyboard- or tab-based movement.


    # # Mobile Considerations


    The smaller screen and slower connection typical of handheld devices are key factors
    in mobile web development and may drive a “less is more” approach to these devices.


    +   - The slower connexion speed and cost of transferring data on mobile plans
    can make it desirable to rely more on the default browser style sheet than you
    would in a screen context.

    - The touch interface on many smartphones and tablets may drive the need for links
    and buttons to appear larger, and the spacing between items should be clear to
    avoid fumbling fingers the wrong item.

    - Feature phones, unlike smartphones, offer a limited subset of CSS and a limited
    layout capability or canvas size. Display and navigation on these devices can
    also be very linear (left to right, top to bottom), so the positioning and complex
    element layouts may be ignored.'
  - '[PAGE 237]


    Though some smartphones have wonderful browsers and deal well navigating conventional
    web sites, targeting handheld devices with CSS changes alone may not always lead
    to the best experience for folks because often the types of content or the tasks
    that mobile visitors are looking for on your site are different from the desktop
    browser version. Thus, having a separate mobile web site may sometimes be a better
    option than just feeding the same HTML content with a different set of styles
    to these visitors.


    # Media Queries


    New in CSS3, media queries add a syntax for describing the characteristics and
    features of the device being used to view a page, allowing for more precise control
    or better targeting of those features that might be why you provide one set of
    styles over another. The following code demonstrates how to target a handheld
    device in landscape orientation (wider than it is tall):


    ```

    @handheld and (orientation:landscape) {

    [...]n}

    ```


    The following links to an external CSS file only if the browser (viewport) width
    is a color device that''s wider than 600 pixels, regardless of media type:


    ```

    <link type="text/css" media="color and (min-width:600px)" src="default.css">

    ```


    As shown in the previous examples, you can combine media features into a more
    complex description using the and keyword. You can use the not'
  - '[PAGE 238]


    keyword to negate a media description (or media type) such as in the following
    example of targeting any nonscreen media type:


    ```

    <link type="text/css" media="not screen" src="alternate.css">

    ```


    The only keyword does not logically impact the result of the media query expression;
    however, it creates a value for the media attribute so that browsers that do not
    support media queries cannot parse into a common media type they support and thus
    can be used to hide styles from these browsers.


    # Media Features


    The following is a list of media features for which you can specify in a media
    query expression.


    Since the chances that you will have declared the precise viewport width, measured
    to the pixel (or ems or other <length> unit), is quite slim, you can specify the
    width feature as a min-width or max-width. This holds true of the other features
    where specified.


    +   - width: The width of the viewport or page box; accepts min- and max- prefixes.


    +   - height: The height of the viewport or page box; accepts min- and max- prefixes.


    +   - device-width: The full width of the device screen or printed page; accepts
    min- and max- prefixes.


    +   - device-height: The full height of the device screen or printed page; accepts
    min- and max- prefixes.


    +   - orientation: Matches the keyword landscape when the width is greater than
    the height; portrait when the height is greater than the width.'
  - '[PAGE 239]


    # 216 The CSS Pocket Guide


    +   - aspect-ratio: The aspect ratio of viewport as described by width/height;
    accepts min- and max- prefixes.


    +   - device-aspect-ratio: The aspect ratio of the device as described by device-width/device-height;
    accepts min- and max- prefixes.


    +   - color: The number of bits of color; 0 for noncolor devices; accepts min-
    and max- prefixes.


    +   - color-index: The number of individual colors supported by the device; 0
    for noncolor devices; accepts min- and max- prefixes.


    +   - monochrome: The number of bits used to describe the monochrome shades available;
    0 for nonmonochrome devices; accepts min- and max- prefixes.


    +   - resolution: The resolution of the output device measured in dpi (dots per
    inch) or dcm (dots per centimeter); accepts min- and max- prefixes.


    +   - scan: The scan type for television media types; values are progressive and
    interlace.


    +   - grid: A grid device is a device such as a TTY terminal or a feature phone
    that has a single fixed-font display.


    # Responsive Design


    In Chapter 7 you learned about building fixed and flexible layout grids as well
    as setting limits on flexible layouts using the min-width and max-width properties.
    You can use these techniques to make adaptive layouts that find a compromise between
    the best presentation and read-ability of the content and the visitor''s browser
    dimensions.


    But what if you could adapt the layout from the standard two-column layout into
    a one-column layout for narrower browsers or bringing the footer up into a third
    column for the insanely wide screens? Or if you could adjust the size of header
    type or swap background images'
  - '[PAGE 240]


    # Chapter 12: Media: Printing and Other Devices 217


    so the design feels more proportional to the “page” as presented, while body copy
    remains at a standard, readable size?


    This adaptation of presentation has been dubbed responsive design. It takes the
    standard mechanics of flexible grids, relative sizing of fonts, and other content
    elements uses media queries to change the positioning of content, the sizing of
    elements, and the overall layout grid to respond to the viewport device is giving
    you to work with.


    For an in-depth review of media queries and how you can use them to design pages
    that do not adapt to just media but also to other browser scenarios, see Ethan
    Marcotte''s article “Responsive Web Design” (http://www.alistapart.com/articles/responsive-web-design/).


    # Browser Support


    Media queries are currently supported in Safari 3+, Firefox 3.5+, Opera 7+, Internet
    Explorer 9+, mobile WebKit, and Opera Mobile. Therefore, there is wide support
    for them, except for IE 6 through IE 8''s large chunk of the desktop market.


    It isn’t so bad, though, the support (or lack thereof) can be taken into consideration
    as just another device criteria in many instances. For mobile development, you’re
    most likely putting handheld device types into two or three buckets already—first
    specifying the most devices and then breaking smartphones by screen size or orientation.
    The following example shows a baseline style sheet going to all handhelds and
    then using media queries with more specific style sheets for more capable devices:


    ```

    <link type="text/css" media="handheld" src="basic.css">

    <link type="text/css" media="handheld and portrait and color" src="enhanced_portrait.css">

    <link type="text/css" media="handheld and landscape and color" src="enhanced_landscape.css">

    ```'
- md: "\nYou can take the same approach for sites meant for the desktop. Code the\
    \ base style sheet with the appropriate baseline layout grid, font sizes, and\
    \ other measurements and serve it to all screen media using the media type declaration.\
    \ Then use media queries to provide enhancements to those base styles and make\
    \ a richer or cleaner experience around the edge cases using responsive design\
    \ patterns.\n\n```\n<style type=\"text/css\">\n/* standard 960px, fixed width\
    \ two column definition */\n[...\n@media (max-width:959px) {\n  /* make layout\
    \ a single column */\n  [...\n}\n@media (min-width:1200px) {\n  /* make layout\
    \ three columns */\n  /* enlarge the font sizes */\n  [...\n}\n[...]\n</style>\n\
    ```\n\n## Resets and Frameworks\n\nIn the previous chapters, the focus was on\
    \ understanding the building blocks and elements that make up the language of\
    \ Cascading Style Sheets. In Chapter 7, we used those elements to create some\
    \ commonly used layout and grid structures.\n\nBut often, the task of building\
    \ a web site does not start with rebuilding all elements from scratch; instead,\
    \ it often starts with reusing elements by drawing from a library of code you've\
    \ previously written or open source code for libraries or elements that you can\
    \ use.\n\n## The CSS Pocket Guide\n\n### CSS Resets\n\nIn the Chapter 2 discussion\
    \ of browser- and user-created style sheets, for example saw the default styling\
    \ for common elements such as paragraphs, links, and forms can be different from\
    \ each other. Building a site on this inconsistent foundation can make cross-browser\
    \ consistency a more difficult task than it already is.\n\nA CSS reset creates\
    \ a common baseline to work from and zeros out some or all aspects of browser\
    \ default styling. It is common for browsers to have padding set on the `<body>`\
    \ element so that plain HTML content has a little room to breathe. However, it\
    \ may be easier to style a site if you are instead starting exactly the top-left\
    \ corner. Font sizes, padding, margin, table properties, and form elements are\
    \ all typical candidates for being “reset.”\n\n### Using Resets\n\nIt is common\
    \ to include a reset file so it is the first CSS code that the browser encounters.\
    \ This is done by inserting its contents into the beginning of the main style\
    \ sheet for the web site, by referencing it directly using a `<link>` element\
    \ before your global style sheet, or by using an `@import` statement at the beginning\
    \ of the main style sheet file, similar to the following:\n\n```\n@import url(reset.css);\n\
    ```\n\nThere isn't much to a reset, but a few solid examples have evolved over\
    \ the years. They’re written to normalize inconsistencies between the default\
    \ setting of various browser or trimming default rules when they’re too overbearing\
    \ (as in the case of form elements). Whichever one you use, look it over before\
    \ you use it on a project to make sure it isn't doing anything you don't want\
    \ (such as setting colors or font sizes).\n\n### Eric Meyer's Reset\n\nEric Meyer's\
    \ Reset (http://meyerweb.com/eric/tools/css/reset/index.html) is widely used and\
    \ can be found at the core of many larger projects including some of the frameworks\
    \ discussed later in this chapter.\n\n### YUI Library CSS Reset\n\nThe YUI Library\
    \ CSS Reset (http://developer.yahoo.com/yui/3/css-reset/) is similar but handles\
    \ a few properties differently, including applying foreground and background colors.\
    \ It is available to link directly from Yahoo!'s servers, which can help with\
    \ download speed and caching.\n\n### HTML5 Reset\n\nThe HTML5 Reset from Richard\
    \ Clark (http://htmldoctor.com/html-5-reset-stylesheet/) builds on the Eric Meyer's\
    \ Reset and makes some modifications to sync with new or deprecated elements in\
    \ the HTML5 specification.\n\n### Why Not Reset?\n\nThere are two strong arguments\
    \ against resetting.\n\nResets can be a blunt instrument. A rule such as `{ margin:\
    \ 0; padding: 0; }` may have undesirable effects on form elements. On the flip\
    \ side, explicitly picking a list of elements may mean some elements (old deprecated\
    \ elements such as <center> or new HTML elements such as <article>) slip through\
    \ the cracks.\n\nNot resetting in the first place means not having to re-create\
    \ common styles like those for emphasis, list indentation, and bullets that are\
    \ already set by the browser. Also, edge cases or little-used HTML elements (`<dl>`,\
    \ `<cite>`, `<legend>) and markup patterns (`<ul>` in a `<blockquote>`) must be\
    \ tested to make sure that content added to the site later is properly styled.\n\
    \nThe type of content appearing on the site will weigh heavily on the appropriateness\
    \ of a reset. A text-heavy site such as a blog may want to leave more of the browser\
    \ styling intact, while an application or e-commerce site that relies on smaller\
    \ content elements want to be more controlled. Ultimately, the choice to zero\
    \ out styles at the beginning of a project's code is one of taste and how you\
    \ prefer to work rather than one of purely technical merit.\n\n## Cross-Browser\
    \ CSS via JavaScript\n\nYou can use a CSS reset to create an even starting point\
    \ for styling individual page elements. But they don't create that same level\
    \ ground for browsers' support for newer selectors and CSS properties. A drop-in\
    \ JavaScript bridge library may be a convenient way to bridge the gaps in CSS\
    \ support so that older browsers function like more recent browsers.\n\nWhen the\
    \ included library loads, it will typically test the browser's support against\
    \ a list of CSS features. If a feature is supported, the script will do nothing.\
    \ However, for those unsupported features, it will comb the style sheet code for\
    \ their use and then attempt to replicate the behavior of.\n\n### Common Bridge\
    \ Libraries\n\nThere are many JavaScript libraries available to use for this purpose.\n\
    \n### IE7.js\n\nThe goal of IE7.js (http://code.google.com/p/ie7-js/) is to make\
    \ Internet Explorer 7 behave like more recent browsers. This includes some HTML\
    \ and CSS features.\n\n### Selectizr\n\nKeith Clark's selectizr.js (http://selectizr.com/)\
    \ is an example of a project that aims to add selector support for IE8 and IE9,\
    \ through, respectively.\n\n### eCSStender\n\nAaron Gustafson's esstender (http://ecsstender.org/)\
    \ provides a flexible framework for all browsers, helping navigate the CSS3 features.\n\
    \n### Modernizr\n\nUnlike the previous libraries, Modernizr (http://www.modernizr.com/)\
    \ does not itself add support for any missing browser bug. Instead, it provides\
    \ feature detection, the results of which can be referenced from your CSS or JavaScript\
    \ code. Classes such as `.multiplebegs` or `.no-multiplebegs` are added to the\
    \ `<html>` element of your document, allowing you to define an alternate set of\
    \ styles.\n"
  mdcn: "\n\n你可以针对桌面端网站采用相同的方法。使用适当的基准布局网格、字体大小和其他测量值来编写基础样式表，并使用媒体类型声明将其提供给所有屏幕媒体。然后，使用媒体查询对这些基础样式进行增强，并使用响应式设计模式在边缘情况（提供更丰富或更整洁的体验。\n\
    \n```\n<style type=\"text/css\">\n/* 标准 960px, 固定宽度双列定义 */\n[...\n@media (max-width:959px)\
    \ {\n  /* 将布局设为单列 */\n  [...\n}\n@media (min-width:1200px) {\n  /* 将布局变为三列 */\n\
    \  /* 增大字体大小 */\n  [...\n}\n[...]\n</style>\n```\n\n## 重置与框架 (Resets and Frameworks)\n\
    \n在之前的章节中，重点是理解构成层叠样式表（CSS）语言的构建基块和元素。在第 7 章中，我们使用这些元素创建了一些常用的布局和网格结构。\n\n但通常，构建网站的任务并不是从零开始重构所有元素；相反，它通常始于通过引用你编写过的代码库或你可以使用的开源库/元素代码来重用元素。\n\
    \n## CSS 便签指南 (The CSS Pocket Guide)\n\n### CSS 重置 (CSS Resets)\n\n例如，在第 2 章关于浏览器和用户创建的样式表的讨论中，我们看到段落、链接和表单等常见元素的默认样式之间可能相互不同。在这样一个不一致的基础上构建网站，可能会使跨浏览器一致性成为一项比现在更加困难的任务。\n\
    \nCSS 重置（CSS reset）创建了一个通用的工作基准，并将浏览器默认样式的某些或所有方面置零。浏览器通常会对 `<body>` 元素设置内边距（padding），以便纯\
    \ HTML 内容留有一定的呼吸空间。然而，如果你直接从左上角开始样式化网站，可能会更容易。字体大小、内边距、外边距（margin）、表格属性和表单元素都是“重置”的典型候选对象。\n\
    \n### 使用重置 (Using Resets)\n\n包含一个重置文件是常见的，因为它是浏览器遇到的第一个 CSS 代码。这通过将它的内容插入网站主样式表的开头、在全局样式表之前使用\
    \ `<link>` 元素直接引用它，或者在主样式表文件的开头使用 `@import` 语句来实现，如下所示：\n\n```\n@import url(reset.css);\n\
    ```\n\n重置并没有什么复杂，但多年来演化出了稳健的示例。它们的编写目的是规范化各种浏览器默认设置之间的不一致性，或者在默认规则过于强势时（如表单元素的情况）对其进行修剪。无论你使用哪一个，在项目中使用它之前请先检查它，以确保它没有执行任何你不想要的操作（例如设置颜色或字体大小）。\n\
    \n### Eric Meyer 的重置 (Eric Meyer's Reset)\n\nEric Meyer 的重置 (http://meyerweb.com/eric/tools/css/reset/index.html)\
    \ 被广泛使用，可以在许多大型项目的核心找到，包括本章稍后讨论的一些框架。\n\n### YUI 库 CSS 重置 (YUI Library CSS Reset)\n\
    \nYUI 库 CSS 重置 (http://developer.yahoo.com/yui/3/css-reset/) 类似，但处理某些属性的方式有所不同，包括应用前景和背景颜色。它可以直接从\
    \ Yahoo! 的服务器链接，这有助于下载速度和缓存。\n\n### HTML5 重置 (HTML5 Reset)\n\n来自 Richard Clark\
    \ 的 HTML5 重置 (http://htmldoctor.com/html-5-reset-stylesheet/) 基于 Eric Meyer 的重置，并对其进行了一些修改。\n\
    \n### 为什么不重置？ (Why Not Reset?)\n\n对于反对重置有两种强有力的观点。\n\n重置可能是一种粗线条的工具。像 `{ margin:\
    \ 0; padding: 0; }` 这样的规则会对表单元素产生不利影响。另一方面，显式选择一组元素可能会导致某些过时的元素（如 `<center>`）或新的\
    \ HTML 元素（如 `<article>`）被遗漏。\n\n从一开始就不重置意味着不需要重新创建浏览器已经设置的常见样式，例如强调、列表缩进和项目符号\
    \ `<blockquote>`）。网站上出现的内容类型将很大程度上影响重置的适用性。像博客这样的文本密集型网站可能希望保留更多的浏览器样式，而依赖较小内容的应用程序或电子商务网站则希望更具控制性。最终，在项目开始时置零样式取决于品味和你的工作方式，而非纯粹的技术价值。\n\
    \n## 通过 JavaScript 实现跨浏览器 CSS (Cross-Browser CSS via JavaScript)\n\n你可以使用 CSS\
    \ 重置为单个元素的样式化创建一个起点。但它们并没有为浏览器支持新的选择器和 CSS 属性提供相同的水平。一个插件式的 JavaScript 桥接库可能是弥补\
    \ CSS 支持差距的方便方法，让旧浏览器运行得像新浏览器。\n\n当引入的库加载时，它通常会对一组 CSS 功能进行测试。如果支持该功能，脚本将什么都不做。然而，对于那些不支持的功能，它将扫描样式表代码，并尝试复制其行为。\n\
    \n### 常见桥接库 (Common Bridge Libraries)\n\n有很多可用的 JavaScript 库来实现此目的。\n\n### IE7.js\n\
    \nIE7.js (http://code.google.com/p/ie7-js/) 的目标是让 Internet Explorer 7 像新浏览器一样。一些\
    \ HTML 和 CSS 功能。\n\n### Selectizr\n\nKeith Clark 的 selectizr.js (http://selectizr.com/)\
    \ 是一个为 IE8 和 IE9 添加选择器支持的项目示例。\n\n### eCSStender\n\nAaron Gustafson 的 esstender\
    \ (http://ecsstender.org/) 为所有浏览器提供了一个灵活的框架，帮助处理 CSS3 特性。\n\n### Modernizr\n\n\
    与之前的库不同，Modernizr (http://www.modernizr.com/) 本身并没有为任何缺失的浏览器漏洞添加支持。相反，它提供功能检测，其结果可以在你的\
    \ CSS 或 JavaScript 代码中引用。如 `.multiplebegs` 或 `.no-multiplebegs` 的类会被添加到文档的 `<html>`\
    \ 元素中，允许你定义一套替代样式。\n\n"
