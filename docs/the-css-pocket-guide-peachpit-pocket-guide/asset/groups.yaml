    \n## 媒体：打印和其他设备\n\nCSS 不仅仅是一种用于描述在桌面浏览器（在本章中称为屏幕媒体）上查看的页面呈现方式的语言。通过指定与样式块、链接样式表或规则组关联的媒体类型，你可以针对其他媒体，如打印、移动设备和屏幕阅读器。\n\
    \n## 媒体类型\n\n用户代理根据其特征或其运行的设备特征被归分为几种媒体类型中的一种。在某些情况下（例如具有打印功能的桌面浏览器），用户代理可以支持多种媒体类型；但在任何给定时刻，只有一个类型是激活状态的。\n\
    \n## 媒体类型列表\n\n- all：适用于所有设备\n- braille：适用于盲文触觉反馈设备\n- embossed：适用于页式凸盲文打印机\n\
    - handheld：适用于小屏幕手持设备\n- print：适用于页式打印介质（或打印预览）\n- projection：适用于投影媒体\n- screen：适用于在桌面和笔记本电脑屏幕上查看\n\
    - speech：适用于屏幕阅读器\n- tty：适用于电传打字机、终端或其他具有固定字符网格的设备\n- tv：适用于基于电视的设备，与屏幕设备相比，其分辨率较低且滚动能力有限\n\
    - Media queries（媒体查询）：用于通过 CSS3 中引入的描述设备特征的表达式来对特定的媒体进行选择。\n\n在实践中，你典型的 Web 项目将会有针对\
