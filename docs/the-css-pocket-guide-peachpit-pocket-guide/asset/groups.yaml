    \ relationship of data items to cells, marking the elements as a series of table\
    \ cells and headers can be semantically appropriate.\n\n## Conditional Fields\n\
    \nSets of conditional fields—if one option is chosen to display or enable other\
    \ options—typically have states managed by JavaScript, but each state is defined\
    \ via classes as the disabled class used in the next code block. The script would\
    \ move the disabled class around as the form elements are changed.\n\n```css\n\
    fieldset.disabled {\n  display: none;\n}\n```\n\n}\n[...]\n<form action=\"#\"\
