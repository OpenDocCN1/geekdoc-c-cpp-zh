  - "[PAGE 203]\n\n# Tables\n\nUsing tables for creating a layout grid is an outdated\
    \ web design practice that has generated a lot bad press for the HTML table element.\
    \ Even if that practice has gone the way of the dedo in most modern web development,\
    \ tables for tabular data are just as important as ever. The layout of a table—with\
    \ its grid of cells, myriad of borders, and the ability for cells to span rows\
    \ or columns—calls for some special formatting properties not used for other elements.\n\
    \nThe layout model for the table element calls for margins and borders on the\
    \ outside of the element to behave the same as other blocks and width to be calculated\
    \ similarly, but it incorporates a few additional properties to control the spacing\
    \ and display of the containing cells and their padding, spacing, and borders.\
    \ The following code generates the table in Figure 10.4:\n\n```\ntable {\n  background:\
    \ #ccc;\n  border: 5px dotted #000;\n  border-spacing: 10px;\n}\ntd {\n  width:\
    \ 20px;\n  line-height: 20px;\n  padding: 10px;\n  background: #fff;\n  border:\
    \ 2px solid #000;\n}\td[rowspan=\"2\"] {\n  border: 10px solid #666;\n}\n```"
  - "[PAGE 204]\n\n```\ntr {\n  border-top: 10px solid #aaa;\n}\n[...\n<table>\n \
    \ <tr>\n    <td>&nbsp;</td> <td>&nbsp;</td> <td>&nbsp;</td>\n  </tr>\n  <tr>\n\
    \    <td rowspan=\"2\">&nbsp;</td> <td colspan=\"2\">&nbsp;</td>\n  </tr>\n  <tr>\n\
    \    <td>&nbsp;</td> <td>&nbsp;</td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td> <td>&nbsp;</td>\
    \ <td>&nbsp;</td>\n  </tr>\n</table>\n```\n\nFigure 10.4\nA table's layout with\
    \ border-collapse set to separate.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_204_0.png)"
  - '[PAGE 205]


    # table-layout


    To maintain the integrity of the grid of cells, the content contained in each
    cell has traditionally had some impact on the height of rows and width of columns
    in a table, with the browser free to make adjustments to provided dimensions.
    Even when a cell width is provided, a large amount of text or a large image may
    make the cell larger. The table-layout property allows for changing the method
    browsers use to size and render a table.


    +   - auto: The width of the table and table cells is established and adjusted
    as the content of each cell in the table is rendered, with the dimensions provided
    by the CSS properties and adjusted for size or amount of content (default).


    +   - fixed: The width of the table and table cells do not rely on the content
    but is determined only by the width of the table and columns, allowing a browser
    to start rendering the table immediately.


    For small tables of data, table-layout: auto may be fine, allowing column widths
    to flex a bit to account for an unexpectedly large number. For much larger tables
    where you''d want the content to start displaying immediately or for cases where
    the integrity and uniformity of the cell grid is important, you should use fixed.


    # border-collapse


    +   - separate: The borders of individual table cells are drawn as distinct features
    and separated by some border padding. No other parts of a table have borders (default).


    +   - collapse: The borders of the table and all parts of a table share the same
    border on each side.'
  - '[PAGE 206]


    A few behaviors of separated borders can be seen in Figure 10.4 that make them
    behave similar to the traditional HTML table rendering.


    +   - In the column on the left, the cells with the narrow border have been adjusted
    to fit the display of the element with the larger border.


    +   - The border declared on the tr element is ignored.


    +   - The table''s background is drawn in the spaces between the cell borders.


    Figure 10.5 is an example of the previous table with border-collapse set to collapse
    and demonstrates the following changes that take place under the collapsing border
    model that make the table behave more similarly to a typical spreadsheet found
    in Excel, Numbers, or other software:


    +   - One border is drawn between each cell, rather than a distinct border around
    each cell.


    +   - Borders may be applied to any of the parts of a table including the, tbody,
    and tr elements.


    +   - When elements with different border-width, border-style, or border-color
    properties touch, they aren''t both drawn; instead, one of the styles is chosen
    by the browser.


    +   - The border-spacing property is ignored.


    Figure 10.5

    A table''s layout with border-collapse set to collapse.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_206_0.png)'
  - '[PAGE 207]


    # border-spacing


    The border-spacing property provides the padding between borders of table cells
    and takes two <length> values, first for the horizontal spacing and second for
    vertical spacing. If only one <length> is provided, it applies to both sides.


    # empty-cells


    In the separated borders model, cells without content (or cells set to visibility:
    hidden) can have their borders and background styling rendered or ignored.


    +   - show: Displays the borders and background of an empty cell (default)

    - hide: Hides the borders and background of an empty cell


    # vertical-align


    Unlike block-level elements, the contents of cells can be vertically positioned
    inside of the cell.


    +   - top: The content of the cell is top aligned.

    - bottom: The content of the cell is bottom aligned.

    - middle: The content of the cell is centered in the cell (default)


    # text-align


    The text-align property behaves normally when applied to table cells (see Chapter
    9).


    # Table display Values


    Like the display values of block, inline, and others covered in Chapter 6, non-table-related
    HTML elements may take on the layout'
  - '[PAGE 208]


    behavior of the various parts of a table. The three basic parts of a table''s
    display are the table, a row, and a cell.


    +   - table: A block-level element that generates the outer structure of a table


    +   - table-row: A row containing cells


    +   - table-cell: An element that represents a table cell


    To account for the cases where an element''s display property is set to a table-related
    value but does not have the parent elements that make up a complete table structure
    (table, table row, and table cell), the missing elements may be created virtually.
    What follows is a sample of the CSS2.1 rules for creating these anonymous boxes:


    If the parent P of a “table-cell” box T is not a “table-row,” a box corresponding
    to a “table-row” will be generated between P and T. This box will span all consecutive
    “table-cell” sibling boxes of T.


    Beyond these core three values, there are display values for all the various pieces
    of a table such as table body, caption, and column groups. The following code
    illustrates the various table-related values and their context:


    ```

    table { display: table; }

    tr { display: table-row; }

    thead { display: table-header-group; }

    tbody { display: table-row-group; }

    tfoot { display: table-footer-group; }

    col { display: table-column; }

    colgroup { display: table-column-group; }

    td, th { display: table-cell; }

    caption { display: table-caption; }

    ```'
