    # Custom Fonts via Text Replacement


    Designers can use certain techniques besides relying on system fonts or embedding
    font files to achieve the look of a custom font. These techniques have pluses
    and minuses—balancing maintainability, selectability, accessibility, and appearance.
    They also don''t have some of the licensing issues of embedded font files not
    being shared. Type set inside an image file and placed in the document using an
    img tag is one way to go, but HTML content cannot be changed via a style sheet
    if a different font is chosen, and the image remains with the HTML source when
    it appears in other contexts such as RSS feeds.'
  - "[PAGE 190]\n\nThe font-embedding techniques in the previous section are the new\
    \ kids on the block and aren't free from implementation issues such as browser\
    \ support or font licensing, these older and tested techniques are useful to have\
    \ in your arsenal.\n\nAs with text set directly into an `&lt;img&gt;` tag, these\
    \ techniques can be useful in small doses such as for for article headings or\
    \ navigation elements, but replacing large blocks of type on the fly provides\
    \ a good deal of over-head or maintenance problems.\n\n# Image Replacement\n\n\
    Rather than use an image tag to display non-HTML-based text, with image replacement,\
    \ you can use that same image file as a CSS-based background on a more conventional\
    \ HTML element. After sizing and positioning the background image, the foreground\
    \ text must be hidden from the user by shifting its position, changing its display\
    \ value, or doing some similar trick. In the following example (Figure 9.3 on\
    \ the next page), headers are presented with the Bitstream Vera Sans font with\
    \ some embossed effects that cannot be accomplished with CSS- and HTML-based type:\n\
    \n```\nh2 {\n  display: block;\n  height: 25px;\n  background-image: url(images/sprite_imagagereplace.png);\n\
    \  background-repeat: no-repeat;\n  text-indent: -9999px; /* shift HTML text out\
    \ of view */\n}\n#hdrHome {\n  width: 80px;\n  background-position: 0 0;\n}\n\
    ```\n\n(continues on next page)"
