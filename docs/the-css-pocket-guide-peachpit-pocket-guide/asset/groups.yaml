    # Many Ways to Say the Same Thing


    The following are all ways to set the same text color for a paragraph element
    in your document:


    ```

    p { color: #fff; }

    p { color: #ffffff; }

    p { color: rgb(255,255,255); }

    p { color: rgb(100,100,100); }

    p { color: hsl(0,0%,100%); }

    p { color: white; }

    ```


    The notation you choose to work with can depend on many factors. Your familiarity
    with the different color systems, which is the easiest to transpose from your
    favorite graphics application uses, or how the color palette for the site is designed
    all impact this decision. With hsl(), it can be easier to write transitions via
    JavaScript, but watch for browser support issues since it''s also the newest method
    of defining color.


    # Color with Alpha Transparency


    CSS3 defines the ability to add a level of transparency to the otherwise solid
    color designation. Applying alpha transparency to borders, text colors, or backgrounds
    allows the color of the elements behind the targeted element to bleed through
    or combine with what is behind it. Figure 4.1 shows the use of a transparent background
    color to mute the distractions created by a background image so that text can
    be readable.


    The transparency in the color applies only to the parts of the element that color
    to and does not affect the transparency of elements it may contain or other objects
    like images. I discuss the opacity property, which applies to the visibility of
    an entire element, in Chapter 6.


    # Chapter 4: Measurements, URLs, and Color Units


    Figure 4.1


    Using a transparent background color to make solid text more readable against
    a background image.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_88_0.png)


    # rgba(r,g,b,a)


    The r, g, and b values work on the same scale as their rgb() unit counterparts
    discussed earlier in this chapter. The alpha (a) value is a decimal number from
    0 to 1, with 0 being completely transparent and 1 being opaque.


    ```

    section { background-color: rgba(0,255,0,0.1); } /* very transparent green */

    ```


    Color units with alpha values of 1 are equivalent to using the solid color unit.
    Consider using that instead because it may be supported by more browsers.


    # hsl(h,s,l,a)


    Like rgba(), hsl() is the same as hsl() with an added designation for transparency.
    This unit is also a decimal number from 0 to 1.


    ```

    a { background-color: rgba(0,0,0,0.9); } /* almost solid black */

    ```


    # transparent keyword represents a color value that is fully transparent (and
    thus channel designations don''t matter). You can think of it as a shorthand for
    (and gets computed in browsers as rgba(0,0,0)).


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_89_0.png)


    # Chapter 4: Measurements, URLs, and Color Units


    # Creating and Maintaining Color Palettes


    Defining a color palette for use in a site and sticking to that set of color values
    can be a useful tool for styling new elements on a site, providing a consistent
    appearance throughout the site, and making it easy to find color values when making
    changes.


    # Design


    Color theory is far outside the scope of this book and is something you could
    study for years; however, here are a few tips for choosing the color scheme for
    a website:


    - Design applications such as Photoshop offer a detailed picker that can be switched
    between RGB, HSL, and other color systems, making easy translations into CSS units.

    - Adobe Color is a tool for creating, browsing, and bookmarking color swatches
    from your desktop or drawn from an image file (http://color.adobe.com/).


    # Maintenance


    Maintaining consistent color usage across a large amount of CSS code can sometimes
    be difficult. Color units are defined in many different declarations that it is
    easy to keep the same shade. Here are some hits for making the task easier:


    - Pick one color type and stick with it so searching for a color when time to
    change it is easier. Don''t use #ff0000, rgb(100%,0,0) interchangeably.

    - Maintain a style guide that lists all the colors used on the site with the preferred
    value to represent them, and use only these colors.

    - For complex or very large sites, consider using a CSS preprocessor like those
    discussed in Chapter 13 that allow you to define placeholders for color values
    once in your code.


    # The Box Model


    The space a block-level element takes up in a layout is controlled by the values
    of height, width, padding, and border properties. The description of how these
    properties interact and how those calculations are made is called the box model.


    # The CSS Guide


    In the standard box model (content-box), the padding, borders, and margins of
    an element are added to the width and height of that element to determine the
    space it occupies in the layout. Figure 5.1 displays a diagram of the box model
    as found in the CSS2.1 specification (http://www.w3.org/TR/CSS21/box.html). The
    additive process where width or height is not inclusive thus the total size an
    element takes up may feel counterintuitive to some, but this works well when nesting
    elements or working with content such as images or video where you don''t want
    to encroach on the content area.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_93_0.png)


    **Figure 5.1** The standard box model. The T, R, B, and L abbreviations represent
    the top, right, bottom, and left values of each property.


    # Properties


    width


    The width property defines the width of an element.


    - <length>: The width will be a fixed dimension.

    - <percentage>: The width will be a percentage of the containing block''s width.

    - auto: The width will be calculated based on the available horizontal space (default).


    height


    The height property sets the height of an element.


    - <length>: The height will be a fixed dimension.

    - <percentage>: The height will be a percentage of the containing block''s specified
    height; this is the equivalent of auto if no containing height was specified.

    - auto: The height will be calculated to fit the available content (default).


    margin

    The margin property sets the four margins surrounding an element. Each side may
    take one of the following values:


    - <length>: The margins will be a fixed dimension.

    - <percentage>: The margins will be a percentage of the containing block''s width
    (applies for margins in the vertical as well as horizontal directions).

    - auto: For the left and right margins, auto is calculated to be the length needed
    to reach the containing element''s sides; for the top and bottom, it is calculated
    as o.


    ```

    margin-top: 1px;

    margin-right: 20%;

    margin-bottom: 0;

    margin-left: 40px;

    margin: 2em; /* shorthand: all sides */

    margin: 2em 0; /* shorthand: top & bottom; right & left */

    margin: 2em 0 1em; /* shorthand: top, right & left, bottom */

    margin: 2em 0 1em 10px; /* shorthand: top; right; bottom;

    left */

    ```

