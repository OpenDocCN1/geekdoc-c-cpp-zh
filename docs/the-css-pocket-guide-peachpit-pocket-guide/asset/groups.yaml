    \n```html\n<<div>\n  <div id=\"containingBlock\">\n    <div>\n      <div id=\"\
    innerPositionedBox\">\n      </div>\n    </div>\n  </div>\n</div>\n```\n\n一旦某个元素定义了不同的包含块（containing\
    \ block），你就无法逃避这种行为并使其相对于根元素（root element）进行定位。因此，不要过度使用定位属性，以避免不必要地创建新的包含块。有时这是无法避免的，在这些情况下，数学可以成为你的朋友（无论是使用纸和笔，还是通过\
    \ JavaScript 代码）——你可以计算包含块（及其任何嵌套的包含块）的位置，并向上溯回根元素。\n\n## z-index\n\nz-index 属性适用于任何已定位的框，可用于控制框从后到前的层级关系。整数值越高，元素看起来就离观察者越“近”。\n\
    \n将此索引想象成控制剧院舞台布景的元素。背景元素位于初始位置，演员和其他元素可能在 1 到 20 之间切换，而前景布景和窗帘位于 21 到 25 之间（尽管该值没有限制）。如果同一堆栈中的两个元素索引均为\
    \ 11（或 auto?）会发生什么？除非每个元素的定位属性导致它们重叠，否则这并不是问题。在这种情况下，文档流中后指定的元素将显示在最上方。\n\n此索引与定位偏移一样，是相对于包含块的。如果一个元素的\
    \ z-index 为 4，另一个元素的 z-index 为 3，那么第二个元素的任何子元素永远无法出现在第一个元素内容的“上方”。\n\n> 注意：某些插件内容（如\
    \ Adobe Flash）有时会穿透定位在它上方并具有更高 z-index 的 HTML 内容。特别对于 Flash，有一个名为 wmode 的窗口模式参数，当设置为\
    \ opaque（不透明）或 transparent（透明）时，允许内容出现在堆栈上方。\n\n## visibility（可见性）\n\nvisibility\
    \ 属性决定元素是否渲染以及是否可见。与将 display 属性设置为 none 不同，`visibility` 设置为 hidden（隐藏）的元素仍然会影响布局并占据空间。与\
    \ opacity（透明度）属性不同，通过将隐藏元素的单个后代设置为 visible（可见），可以显示它们。\n\n- visible: 元素被渲染。\n\
    - hidden: 元素不渲染。\n\n## float（浮动）\n\nfloat 值为左（left）或右（right）的元素会从文档的标准流中取出，并移动到包含框的一侧。文档中后续的内容将环绕浮动元素的新位置排列。\n\
    \n- none: 元素不浮动，表现正常。\n- left: 元素移出正常流并移动到其原本出现位置的左侧，内容在元素的右侧环绕。\n- right: 元素移出正常流并移动到其原本出现位置的右侧，内容在元素的左侧环绕。\n\
    \n想象一张移动到右侧并有文字环绕周围的小照片；你现在已经理解了元素（照片）在浮动时的基本原理（见下一页的图 6.5）。\n\n图 6.5\n在文本内容内部浮动的两个元素。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_117_0.png)\n\n在浮动元素上设置的边距（Margins）和内边距（Padding）的行为与标准框模型中的任何框相同，并用于在该元素周围创建间隙。然而，浮动的效果会中断环绕元素的框，导致它们的内边距、边距或边框在正常的矩形中绘制，而不是为每一行文本单独移动或重绘，如图\
    \ 6.6 所示。注意此示例中文字接触浮动图像右边缘的方式。\n\n图 6.6\n文字环绕浮动元素。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_117_1.png)\n\
    \n```css\nimg {\n  float: left;\n}\np {\n  border: 5px solid #666;\n}\n```\n\n\
    # 第 6 章：定位与浮动 95\n\n```css\npadding: 15px;\nbackground: #ccc;\n\n[...]\n```\n\n\
    <img src=\"images/1.png\" width=\"67\" height=\"67\" alt=\"1\" />\n<p>为了说明目的，这里是左浮动图像之后的一些文本。Lorem\
    \ dolor sit amet, consectetur adipisicing elit.</p>\n\n在浮动元素周围添加 20 像素的边距会在浮动元素的对侧与环绕其的内容之间创建一个间隙（图\
    \ 6.7）。这样做之后，显而易见的是包含边框和背景颜色的段落所绘制的矩形框并没有被“环绕”。只有这些框内部的内容在进行环绕。\n\n图 6.7\n在浮动元素上放置边距，以便在其与环绕其的内容之间创建空间。\n\
    \n| 列 | 内容 |\n|---|---|\n| 1 | 为了说明目的，这里是左浮动图像之后的一些文本。Lorem dolor sit amet, consectetur\
