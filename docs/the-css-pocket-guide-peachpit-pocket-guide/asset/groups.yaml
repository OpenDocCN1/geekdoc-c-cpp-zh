    \ positioning of an inline element in relation to a line box and not a block element,\
    \ it is not suitable for aligning block elements in a layout grid. The default\
    \ value of baseline creates an alignment-where the bottom of the characters in\
    \ each inline element on a line all start at the same position. The following\
    \ are commonly used values for vertical-align(Figure 9.2):\n\n+   - baseline:\
    \ Aligns the baseline of the box with the parent element’s baseline\n- sub: Creates\
    \ a subscript by lowering the baseline of the box\n- super: Creates a preprint\
    \ by raising the baseline of the box\n\n```\np {\n  font-size: 20px;\n  vertical-align:\
    \ baseline;\n  color: #666;\n  background: #eee;\n}\nsup {\n  font-size: 1em;\n\
    \  vertical-align: super;\n}\n```"
