- md: '

    # Measurements, URLs, and Color Units


    In the discussion of CSS syntax in Chapter 1, you saw that the second part of
    each CSS declaration is a value. In this chapter, you''ll explore some common
    units for defining sizes (<length> and <percentage>), colors (<color>), and URLs
    (<url>) for defining these values.


    # Measurements


    Dimensions and other measurements, such as font-size, are not just raw numbers
    but a number of some specified units of measure. CSS has quite a variety of measurement
    units; the most commonly used are outlined in the following sections.


    ## Pixels (px)


    ```

    img.thumbnail { width: 150px; }

    div { border-width: 3px; }

    ```


    A pixel unit (<length>) is a fixed measurement based on the size of a common pixel.


    > Pixel units are not always a "pixel" or "dot" but are defined as a relative
    length measurement based on the given display. High-resolution media as print
    will output 1px as multiple physical dots, and high-resolution devices such as
    the 326-dpi iPhone 4 will render a px unit at an appropriate size.


    ## Ems (em)


    ```

    h1 { font-size: 1.6em; } /* make h1 font larger than base */

    blockquote { width: 20em; } /* keep block readable */

    ```


    One unit (<length>) is a relative unit that equates to the font size of the element.
    When applied to the font-size property of an element, an em unit is relative to
    the parent element''s font size. This behavior makes it useful for keeping the
    font size for emphasis, headers, and other tags relative to the base font sizing.
    It is also useful when applied to dimensions as a way to control readability and
    line lengths.


    ## Points (pt)


    ```

    body { font-size: 12pt; }

    ```


    Points are an absolute length-based unit (<length>) equal to 1/72 of an inch.
    Points can be useful when setting sizes for print where physical measurements
    may be stressed. On screen and mobile media, points are approximated based on
    the resolution of the display and system settings, and working with px or em units
    can lead to more consistent results.


    ## Percentages (%)


    ```

    .column1 { width: 30%; } /* of the containing block */

    p { line-height: 140%; } /* of the font-size of the element */

    p { font-size: 90%; } /* of the parent */

    ```


    Percentage-based units (<percentage>) are relative to another measurement. Percentages
    can be greater than 100 percent. Which measurement it relates to is defined case-by-case
    basis; the previous code shows some examples.


    ## Percentage Calculations and the Box Model


    Because of rounding in the calculations involved in finding the percentage there
    may be an extra pixel or two to account for. Internet Explorer 6 is notorious
    for calculations that result in extra pixels for columns that don''t fit into
    a space. You can find more about layouts and the box model in Chapter 5.


    - 50% + 50% = 100%

    - 30% + 30% + 40% = 100%


    ## Other Units


    - Points are considered absolute length-based units: They correspond to a physical
    measurement of 1/72 of an inch (approximated by the browser and device). Other
    absolute units include in (inches), cm (millimeters), and pc (picas).

    - Pixels and ems are relative length-based units: They are relative to some measurement.
    Like em, CSS has defined other relative length units as the following: rem (relative
    to the font size of the root element) and vw (relative to viewport width and height,
    respectively). These units are just starting to be supported in previews of the
    next generation of browsers but are something to look forward to.


    ## URLs


    The URL function (<url>) is used to designate the address of a resource for use
    in a property such as background-image or list. The path of the resource follows
    the same rules as other resource identifier (URI) usages like href values in HTML.
    When using external style sheet documents, relative paths relate to the document
    and not the source HTML document.


    ```

    body { background-image: url(../images/bg_body.png); }

    body { background-image: url(/images/bg_body.png); }

    body { background-image: url(http://example.com/images/bg_body.png); }

    ```


    URIs can be quoted with single or double quotes or can be left unquoted. For historical
    reasons dating back to IE for the Mac, single quotes are sometimes avoided as
    a best practice.


    > data: URI scheme uses encoded strings to represent file data inline rather than
    as a path to an external file. This can be quite useful for small resources such
    as iconography, list bullets, or font faces because it cuts down the number of
    requests to the server or for mobile applications.

    data:[mediatype];base64


    You can find support for this URI scheme in CSS in Internet Explorer 8+, Firefox,
    Safari, and Opera. The source code for data: URIs can be easily generated with
    "The data: URI kitchen" tool by Ian Hickson (http://software.hixie.ch/utilities/cgi/data/).


    ## Basic Colors


    The following color units <color> define several different ways to designate solid
    colors and can be used for properties like text color, background-color, and border-color.


    ### #rrggbb or #rgb


    In hexadecimal notation, colors are represented by three sets of hexadecimal values
    (base-16), with the first set representing the red (r) value, the second representing
    the green (g) value, and the next representing the blue (b) value based on how
    displays add light to create the colors you see. A value of #000000 represents
    no light (black), #ffffff represents the most light (white), and #ff00ff represents
    only red light (bright red).


    ```

    body { background-color: #999; } /* middle gray */

    ```


    rgb is a shorthand for #rrggbb, which is available to use when the two r characters
    match, the two g characters match, and the two b characters match (#a3b is equivalent
    to #aa33bb).


    ### rgb(r,g,b)


    You can also define RGB colors using decimal notation (sometimes called functional
    notation) along the same 256-step range (0 to 255) that the hexadecimal values
    represented. Each value can also be defined as a percentage of that 256-step range.


    ```

    body { background-color: rgb(153,153,153); } /* middle gray */

    body { background-color: rgb(60%,60%,60%); } /* middle gray */

    ```


    > note You cannot mix integers and percentages in the same color unit. White is
    rgb(255,255,255) or rgb(100%,100%,100%), but not rgb(255,100%,255).


    ### hsl(h,s,l)


    The hue-saturation-lightness color scheme offers a way to look at the color wheel
    that can be more intuitive when working with colors of a similar hue or tonality.
    Hue (h) is a number from 0 to 360 representing a radial position on the color
    wheel (o or 360=red, 120=green, 240=blue). Saturation (s) is a percentage value
    from 0 to 100 percent with values closer to o percent approaching desaturated,
    or gray. Lightness (l) is again a percentage value from 0 to 100 percent, where
    o is black and 100 percent is white.


    ```

    .error { border-color: hsl(0, 75%, 38%); } /* a muted red */

    ```


    ## Color Keywords


    aqua, black, blue, fuchsia, gray, green, lime, maroon, navy, olive, purple, red,
    silver, teal, white, and yellow.


    ```

    body { color: red; }

    ```


    Several (131 to be exact) more commonly supported color keywords, such as pink,
    plum, deepskyblue, and firebrick, originally defined in the SVG specification,
    were added in CSS3, bringing the number of color keywords to 147.

