  - "[PAGE 264]\n\n# Chapter 14: The Not Too Distant Future of CSS 241\n\nFigure 14-5\n\
    A linear gradient with three colors.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_264_0.png)\n\
    \nUnfortunately, the draft of the CSS3 images Module specification and the syntax\
    \ used by WebKit browsers and Firefox vary a good deal, so the definition of the\
    \ gradient is currently quite complex. Westciv has a handy tool to create gradients\
    \ and code for either browser at http://westciv.com/tools/gradients/\n\nCSS gradients\
    \ are supported in their experimental forms in Firefox 3.6+, Safari 4+, and Chrome\
    \ 3.\n\n# Border Images\n\nFlexible, image-based borders can replace the standard\
    \ border styles using the border-image property. This is achieved by slicing the\
    \ border area into a nine-segment grid representing each of the corners of the\
    \ border area and the sides, as shown in Figure 14.6. A single image file is similarly\
    \ split into nine segments and mapped to each of the areas of the border area\
    \ and the center of the container.\n\nFigure 14.6\n example of the nine-quadrants\
    \ of an image used for a border background.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_264_1.png)"
- md: "\nThe value for border-image-property is comprised of an image reference, a\
    \ description where the image is divided to create nine segments, how those segments\
    \ are positioned, and finally a description of how they tile to fill the available\
    \ area.\n\n## border-image-source\n\nThe border-image-source property accepts\
    \ a reference to the image used as the border image.\n\n## border-image-slice\n\
    \nborder-image-slice defines where the four lines slice an image into segments,\
    \ inset from each of the four sides of the image. For the image displayed in Figure\
    \ 14.6, it would make sense to position these dividing lines 30 pixels from each\
    \ edge to create nine even segments. The distance from each edge can be measured\
    \ by the following values:\n\n- <number>: The number of pixels (or the coordinates\
    \ for SVG images). Pixel units are implied for bitmap background images, and the\
    \ unit should be left off.\n- <percentage>: A percentage value based on the dimensions\
    \ of the image.\n\nA width for the border can optionally be assigned via the border-image-slice\
    \ property by adding a forward slash (/) after the slice position values. These\
    \ width measurements are the same as the border-width property, and if both properties\
    \ are set, then the border width values set as part of border-image-slice override\
    \ those set in the border-width property. The following example sets the slices\
    \ that segment the image to be 30 units from each edge, with a border width of\
    \ 30 pixel for the top and bottom border and 15 pixel for the left and right.\n\
    \n```css\ndiv.one {\n  /* for Firefox */\n  -moz-border-image-slice: 30 / 30px\
    \ 15px;\n  /* for Safari and Chrome */\n  -webkit-border-image-slice: 30 / 30px\
    \ 15px;\n  /* W3C specs */\n  border-image-slice: 30 / 30px 15px;\n}\n```\n\n\
    The border width behavior of border-image-slice allows you to set one width for\
    \ browsers that only understand the traditional properties and alter the size\
    \ for those that understand border-image.\n\n## border-image-repeat\n\nThe border-image-repeat\
    \ property defines how the slices of the image fill the flexible space on the\
    \ side borders and middle portion of the border area. You can use one or two of\
    \ the following keywords:\n\n- stretch: The image slice is scaled to fit the available\
    \ space, without repeating (default).\n- repeat: The image slice is scaled but\
    \ not tiled to fill the available space. As a result, the image may appear cropped\
    \ on some edges.\n- round: The image slice is tiled; however, only whole images\
    \ are used. The tiles are then scaled evenly to fill the remaining space.\n\n\
    If only one keyword is provided, it is applied to both the borders and the center\
    \ section.\n\n## border-image (Shorthand)\n\nThe shorthand border-image accepts\
    \ the previous three subproperties, as well as the additional properties of border-image-width\
    \ and border-image-outside (that describe where the images are drawn in the border\
    \ area) in the order <border-image-source>, <border-image-slice>, <border-image-repeat>.\n\
    \n**Figure 14.7** uses the image from Figure 14.6 as a border image and demonstrates\
    \ the difference between border-image-repeat values.\n\n```css\ndiv {\n  /* set\
    \ common width for all browsers */\n  border-width: 30px;\n}\ndiv.one {\n  /*\
    \ for Firefox */\n  -moz-border-image: url(images/border_background_tile.png)\n\
    \  30 30 30 30 round;\n  /* for Safari and Chrome */\n  -webkit-border-image:\
    \ url(images/border_background_tile.png)\n  /* W3C specs */\n  border-image: url(images/border_background_tile.png)\
    \ 30 30 round;\n}\n```\n\n```css\ndiv.two {\n  /* for Firefox */\n  -moz-border-image:\
    \ url(images/border_background_tile.png)\n  30 30 30 30 stretch;\n  /* for Safari\
    \ and Chrome */\n  -webkit-border-image: url(images/border_background_tile.png)\n\
    \  30 30 30 30 stretch;\n  /* W3C specs */\n  border-image: url(images/border_background_tile.png)\
    \ 30 30 stretch;\n}\n```\n\n```css\n<div class=\"one\">\n  border image with sides\
    \ and middle set to round\n</div>\n<div class=\"two\">\n  border image with sides\
    \ and middle set to stretch\n</div>\n```\n\nFigure 14.7 Examples of border backgrounds\
    \ with round and stretch values for border-image-repeat. (img/e084bf9d02cf21fa6beaa6fe9b268_0.png)\
    \ (img/e084bf9d02cf21fa6beaa6fe9b268_1.png) Border backgrounds are supported in\
    \ Firefox 3.5+, Opera 10.5+, Chrome 3+, and Safari 3.2. Accessible Rich Internet\
    \ Application (WAI-ARIA) specification (http://www.w3.org/TR/wai-aria/) provides\
    \ definitions of common semantics and states as a layer to be added to HTML markup.\
    \ Role types include navigation, progressbar, alert, tab, and tooltip. By applying\
    \ these to HTML elements, screen readers and other assistive devices can react\
    \ to these items more appropriately than an element with a class or id. The CSS\
    \ selector can also leverage these role definitions, along with state-based attributes\
    \ such as checked, as hooks for styling, rather than relying on a fixed unit.\
    \ You can find more about WAI-ARIA roles and their usage in the spec (http://www.w3.org/TR/wai-aria/usage/).\n\
    \n## The calc() Function\n\nThe calc() function lets replace any <length> value\
    \ assignment with a mathematical expression rather than a fixed-length. These\
    \ expressions can be built with the operators +, -, /, min, max, and mod. The\
    \ problem of leftover pixels that arose when mixing percentage values and fixed\
    \ lengths can be solved by using calc() instead. Figure 14.8 shows the updated\
    \ multicolumn layout using calc().\n\n```css\n/* using calc() */\n.main_left,\n\
    .main_center {\n  /* for unsupported browsers */\n  width: 48%;\n  /* for Firefox\
    \ / W3C specs */\n  width: calc(50% - 7px);\n}\n```\n\n## Chapter 14: The Not\
    \ So Distant Future of CSS\n\nFigure 14.8 A flexible, multicolumn layout using\
    \ calc(). (img/e084bf9d02cf21fa6beaa6fe9b270_0.png) In the previous code, the\
    \ available width of the container is split by the margins (the four vertical\
    \ side borders), with the remaining area split evenly between the two columns.\
    \ The arithmetic you would use to calculate what is left over after the fixed\
    \ area is 100% - 4px. calc() will be supported in upcoming browsers including\
    \ Internet Explorer 9 and Firefox 4.\n\n## Transformations and Rotations\n\nUsing\
    \ CSS transforms, you can rotate, skew, or scale elements. Transforming an element\
    \ does not change the flow of a document; instead, the element takes up its pretransformed\
    \ shape in the document in the same way that relative positioned elements behave.\n\
    \n## transform\n\nThe transform property is used to define one or more <transform-functions>\
    \ for the specified element.\n\n- none: No is applied.\n- <transform-function>:\
    \ The description of a transform to be applied to an element.\n\n## Values for\
    \ <transform-function>\n\nThe following are values for <transform-function>:\n\
    \n- translateX(<length>): Translates the element by the specified amount on the\
    \ x-axis.\n- translateY(<length>): Translates the element by the specified amount\
    \ on the y-axis.\n- translate(<length>, <length>): Translates the element by the\
    \ specified amount; the first value is along the x-axis, and the second is along\
    \ the y-axis (if not specified).\n- scaleX(<number>): Scales the element by the\
    \ specified factor along the x-axis.\n- scaleY(<number>): Scales the element by\
    \ the specified factor along the x-axis.\n- scale(<number>, <number>): Scales\
    \ the element by factor along each axis; the first value is the x-axis, and the\
    \ second is along the y-axis (equal to x if not specified).\n- rotate(<angle>):\
    \ Rotates an element around the origin by the specified angle (in deg units);\
    \ a positive angle rotates the element in a clockwise direction.\n- skewX(<angle>):\
    \ Skews the element along the x-axis by the specified angle (in deg units).\n\
    - skewY(<angle>): Skews the element along the y-axis by the specified angle (in\
    \ deg units).\n- skew(<angle>, <angle>): Skews along each axis by the specified\
    \ angle (in deg units); the first value is along the x-axis, and the second is\
    \ along the y-axis (if not specified).\n"
  mdcn: "\n\nborder-image-property 的值由一个图像引用、一个将图像分为九个段的描述、这些段的定位方式，最后关于它们如何平铺以填充可用区域的描述组成。\n\
    \n## border-image-source\n\nborder-image-source 属性接受作为边框图像的图像引用。\n\n## border-image-slice\n\
    \nborder-image-slice 定义了四条线如何将图像切割成若干段，这些线相对于图像四个侧的内缩。对于图 14.6 所示的图像，将这些分割线放置在距离每个边缘\
    \ 30 像素处以创建九个均匀的段是合理的。与每个边缘的距离可以通过以下值来测量：\n\n- <number>: 像素数（或 SVG 图像的坐标）。位图背景图像隐含为像素单位，且应省略单位。\n\
    - <percentage>: 基于图像尺寸的百分比值。\n\n可以通过在切片位置值后添加正斜杠 (/)，通过 `border-image-slice` 属性可选地为边框分配宽度。这些宽度测量与\
    \ `border-width` 属性相同，如果两个属性都设置了，则作为 `border-image-slice` 部分设置的边框宽度值将覆盖 `border-width`\
    \ 属性中设置的值。示例设置分割图像的切片为距离每个边缘 30 个单位，顶底部边框宽度为 30 像素，左右边框宽度为 15 像素。\n\n```css\n\
    div.one {\n  /* for Firefox */\n  -moz-border-image-slice: 30 / 30px 15px;\n \
    \ /* for Safari and Chrome */\n  -webkit-border-image-slice: 30 / 30px 15px;\n\
    \  /* W3C specs */\n  border-image-slice: 30 / 30px 15px;\n}\n```\n\nborder-image-slice\
    \ 的边框宽度行为允许为仅理解传统属性的浏览器设置一个宽度，并为理解 `border-image` 的浏览器更改尺寸。\n\n## border-image-repeat\n\
    \nborder-image-repeat 属性定义了图像切片如何填充侧边框和边框区域中间部分的弹性空间。可以使用以下关键词中的一个或两个：\n\n- stretch:\
    \ 图像切片被缩放以适应可用空间，不重复（默认值）。\n- repeat: 图像切片被缩放但不平铺以填充可用空间。结果是图像在某些边缘上可能会被裁剪。\n\
    - round: 图像切片被平铺；但只使用完整的图像。然后这些平铺被均匀缩放以填充剩余空间。\n\n如果只提供一个关键词，它将同时应用于边框和中心区域。\n\
    \n## border-image (Shorthand)\n\n简写属性 `border-image` 接受上述三个子属性，以及额外的 `border-image-width`\
    \ 和 `border-image-outside` 属性（描述图像在边框区域的绘制位置），顺序为 `<border-image-source>`、`<border-image-slice>`、`<border-image-repeat>`。\n\
    \n**图 14.7** 使用图 14.6 中的图像作为边框图像，并演示了 `border-image-repeat` 值之间的差异。\n\n```css\n\
    div {\n  /* set common width for all browsers */\n  border-width: 30px;\n}\ndiv.one\
