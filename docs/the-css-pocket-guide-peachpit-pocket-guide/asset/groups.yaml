    # :nth-of-type(), :nth-last-of-type() (Nth of Type Pseudo-classes)


    While nth-child() matches any element, nth-of-type() and nth-last-of-type() select
    every an+b element where the set of elements is based on a collection of sibling
    elements that are only of the same element type.


    One application of the nth-of-type selector is to set alternating styles on successive
    images found in a parent element regardless of what type of content is between
    between them.


    # :first-of-type, :last-of-type (First and Last of Type Pseudo-classes)


    Similarly to first-child and last child, there are the shortcuts :first-of-type
    and :last-of-type, which represent :nth-of-type(1) and nth-last-of-type(1), respectively.


    # :only-child (Only Child Pseudo-class)


    This pseudo-class selects elements that are the only child of their parent element.
    Any element selected by :only-child matches both the :first-child and :last-child
    selectors.


    # :only-of-type (Only of Type Pseudo-class)


    The only of type pseudo-class matches an element if it is the only element of
    its type among its sibling elements. That is, it matches both the :first-of-type
    and :last-of-type selectors.


    # :empty (Empty Pseudo-class)


    The empty pseudo-class selects elements only when they contain no child nodes.
    This includes text nodes and whitespace characters.


    ```

    td:empty { background-color: rgb(80%,80%,80%); } /* shade any empty table cells
    */

    ```


    # :not() (Negation Pseudo-class)


    The negation pseudo-class allows you to select the case where elements do not
    match the provided selector.


    ```

    p:not(.note) {} /* paragraph elements without the class note */

    input:not(:required) {} /* optional input fields */

    dtd:not(:nth-child(odd)) {} /* not odd, or the equivalent of :nth-child(even)
    */

    ```


    # Pseudo-element Selectors


    Pseudo-elements are phantom elements that don''t appear in the HTML document but
    instead represent a part of the document that the browser overlays on the document
    structure to represent properties of the layout. For example, because of differences
    in font sizes, line lengths, pseudo-elements wrap the text.


    # 3: Selectors


    The selectors described to this point select elements based on an element type
    or the properties of an element. Combinators are used to combine these simple
    selectors in ways that describe document structure.


    ## E F (Descendant Combinator)


    Represented by whitespace, the descendant selector describes an element (F) that
    is contained within another element (E). The number of elements between the ancestor
    and descendant does not matter. As a result, the following selector will match
    all elements inside the document body:


    ```

    body * {}

    ```


    ## E>F (Child Combinator)


    The child selector describes an element (F) that is the child (or direct descendant)
    of another element (E).


    ```

    ul > li { font-family: sans-serif; }

    ol > li { font-family: monospace; }

    ```


    Here, list items that are direct children of an unordered list tag will be in
    a sans-serif font, and those that are direct children of an ordered list will
    be fixed-width.


    ## E+F (Adjacent Sibling Combinator)


    The adjacent sibling combinatory matches elements (F) that come directly after
    other elements (E) and share the same parent element.


    ```

    h1 + p { font-size: 1.2em }

    ```


    This example will select all paragraphs that come directly after an <h1>1 tag
    and apply an increased font size.


    ## E~F (General Sibling Combinator)


    With this selector, the element (F) is selected if it appears at some point after
    its sibling element (E).

