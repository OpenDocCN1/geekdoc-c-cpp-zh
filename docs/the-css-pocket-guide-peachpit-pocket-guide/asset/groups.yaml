    # The Box Model


    The space a block-level element takes up in a layout is controlled by the values
    of the height,width, margins, padding, and border properties. The description
    of how these properties interact and how those calculations are made is called
    the box model.'
  - '[PAGE 93]


    # The CSS Pocket Guide


    In the standard box model (content-box), the padding, borders, and margins of
    an element are added to the width and height of that element to determine the
    space it occupies in the layout. Figure 5.1 displays a diagram of the box model
    as found in the CSS2.1 specification (http://www.w3.org/TR/CSS21/box.html). The
    additive process where width or height is not inclusive and thus the total size
    an element takes up may feel counterintuitive to some, but this works well when
    nesting elements or working with content such as images or video where you don''t
    want to encroach on the content area.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_93_0.png)


    **Figure 5.1** The standard box model. The T, R, B, and L abbreviations represent
    the top, right, bottom, and left values of each property.'
  - '[PAGE 94]


    # Properties


    width


    The width property defines the width of an element.


    +   -length>: The width will be a fixed dimension.

    -<percentage>: The width will be a percentage of the containing block''s width.

    - auto: The width will be calculated based on the available horizontal space (default).


    height


    The height property sets the height of an element.


    +   -length>: The height will be a fixed dimension.

    -<percentage>: The height will be a percentage of the containing block''s specified
    height; this is the equivalent of auto if no containing height was specified.

    - auto: The height will be calculated to fit the available content (default).


    margin

    The margin property sets the four margins surrounding an element. Each side may
    take one of the following property values:


    +   -length>: The margins will be a fixed dimension.

    -<percentage>: The margins will be a percentage of the containing block''s width
    (applies for margins in the vertical as well as horizontal directions).

    - auto: For the left and right margins, auto is calculated to be the length needed
    to reach the containing element''s sides; for the top and bottom, it is calculated
    as o.'
