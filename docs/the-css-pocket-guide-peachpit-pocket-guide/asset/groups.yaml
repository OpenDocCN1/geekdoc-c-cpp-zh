    \ 256\n\n## 引言\n\nWeb文档的样式化从Web早期以来经历了巨大的变化。在早期，字体标签、表格和随处可见的 HTML 属性就是让页面变好看（或者获得那个在整个页面反复播放的火焰动画\
    \ GIF）所必须做的事情。\n\n《CSS 口袋指南》将教你如何使用 CSS 进行文档样式化的构建区块，为你提供一套先进的现代开发技术武器库，并帮助你应对不断变化的\
    \ Web 浏览器和规范领域，包括 CSS3。\n\n## 谁应该阅读这本书\n\n任何设计或构建网页的人都应该了解 CSS。本书提供了一个 CSS 的概述，以及该语言的构建区块以帮助你入门，面向初级和中级开发者。\n\
    \n在阅读本书之前，接触并理解如何阅读和编写 HTML 是关重要的，因为书中的 CSS 代码用于样式化。\n\n## 你将学到\n\n本书涵盖了包括 CSS\
    \ 2.1 和 CSS3 在内的 CSS。\n\n- 书的开头介绍了 CSS 的构建区块以及如何使用这些工具通过 CSS 创建布局。\n- 随后，书籍讨论了如何使用\
    \ CSS 样式化你刚刚学会构建的布局网格中的元素。\n- 书的最后一部分深入探讨了特定主题，例如与不同类型的媒体工作或创建表单布局。\n\n在此过程中，还讨论了\
    \ Web 开发的当前最佳实践以及包含 CSS3 及未来的 CSS 变更信息。\n\n## 本书中找不到的内容\n\n在由一个人编写的书中无法涵盖 CSS\
    \ 的所有应用及其所有出现方式。尽管书中对该语言进行了详细介绍，可以作为学习网页设计开发其他方面的很好的参考，但它并未尝试涵盖以下：\n\n- 它没有教你什么是\
    \ HTML 或如何编写良好的 HTML。\n- 它没有教你任何关于 JavaScript 或动画、Ajax 等脚本知识。但对于你经常使用 JavaScript\
    \ 操作的 CSS 属性，这将是一个非常有用的参考。\n- 它没有教授良好的视觉或交互设计原则。然而，它将为你提供实现这些设计的工具。\n- 同时，它没有显式涵盖应用于\
    \ HTML 之外文档的 CSS（例如 SVG）。\n\n## 跟读所需的准备\n\n你只需要一个文本编辑器来编写 CSS 代码或查看示例 CSS 和 HTML\
    \ 代码，最好是带有语法高亮的编辑器，如 Windows 的 Notepad2 或 Mac OS X 的 TextWrangler（均为免费）。你还需要一个\
    \ 浏览器来查看你编写的任何代码的结果。视觉化（WYSIWYG）编辑器如 Dreamweaver 也可以使用，只要它提供“代码”或“源代码”视图即可。\n\n"
