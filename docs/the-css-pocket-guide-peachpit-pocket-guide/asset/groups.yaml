    \ {\nwidth: 250px;\nheight: 150px;\nborder: 2px solid black;\n-webkit-border-top-left-radius:\
    \ 30px;\n-webkit-border-top-right-radius: 6px;\n-webkit-border-bottom-right-radius:\
    \ 30px;\n-webkit-border-bottom-left-radius: 6px;\n-moz-border-radius-topleft:\
    \ 30px;\n-moz-border-radius-topright: 6px;\n-moz-border-radius-bottomright: 30px;\n\
    -moz-border-radius-bottomleft: 6px;\nborder-top-left-radius: 30px;\nborder-top-right-radius:\
    \ 6px;\nborder-bottom-right-radius: 30px;\nborder-bottom-left-radius: 6px;\n}\n\
    ```\n\nFigure 8.6 Expanding border-radius\n![](img/e804bf8d02cf0721cfa6beaa6fe7ab_161)\n\
    \n> Outline properties are similar to borders but do not take up space. They are\
    \ often used to highlight elements in focus.\n\n## Outline\n\nOutlines are similar\
    \ to borders but do not take up space. They are often used to highlight elements\
    \ in focus.\n\n## outline-color\n\nThe color of the outline.\n\n## outline-style\n\
    \nThe style of the outline.\n\n## outline-width\n\nThe width of the outline.\n\
    \n## outline (Shorthand)\n\nThe outline shorthand property accepts up to three\
    \ values representing outline-width, outline-style, and outline-color.\n\n```css\n\
    :focus {\n  outline: 3px auto blue;\n}\n```\n\n## Faking Rounded Corners\n\nThe\
    \ border-radius property has been the standard way to create rounded corners,\
    \ but when you need to support older browsers or create complex effects, you might\
    \ need to use background images.\n\n## Using a Background Image\n\nWith all these\
    \ great CSS3 properties being supported, it is easy to over-think and over-engineer\
    \ solutions to design problems. Particularly when the design requires background\
    \ images to already be used (so there's no additional bandwidth or maintenance\
    \ hit), then it may just make sense to create the rounded right in the graphic\
