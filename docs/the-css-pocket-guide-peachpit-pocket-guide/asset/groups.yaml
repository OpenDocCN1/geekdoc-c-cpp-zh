    \ 和 `border-image-outside` 属性（描述图像在边框区域的绘制位置），顺序为 `<border-image-source>`、`<border-image-slice>`、`<border-image-repeat>`。\n\
    \n**图 14.7** 使用图 14.6 中的图像作为边框图像，并演示了 `border-image-repeat` 值之间的差异。\n\n```css\n\
    div {\n  /* set common width for all browsers */\n  border-width: 30px;\n}\ndiv.one\
    \ {\n  /* for Firefox */\n  -moz-border-image: url(images/border_background_tile.png)\n\
    \  30 30 30 30 round;\n  /* for Safari and Chrome */\n  -webkit-border-image:\
    \ url(images/border_background_tile.png)\n  /* W3C specs */\n  border-image: url(images/border_background_tile.png)\
    \ 30 30 round;\n}\n```\n"
