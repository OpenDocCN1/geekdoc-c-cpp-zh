    \n## Border（边框）\n\n在第 5 章中，边框被引入为块元素的边界，绘制在元素的内边距（padding）和外边距（margin）之间。边框绘制在元素之前之前这会影响带有间隙（虚线）和带有背景定位的边框样式显示。\n\
