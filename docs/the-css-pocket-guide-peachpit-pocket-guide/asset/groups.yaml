- md: "\n## text-shadow\n\n- The text-shadow property introduced in CSS3 allows for\
    \ one or more <shadow> effects to be applied to the text of an element. This shadow\
    \ is drawn around the letters themselves, rather than around the outer edges of\
    \ the box like box-shadow (Chapter 14).\n- none: No text shadow is applied.\n\
    - <shadow>: A description of a single shadow is <color> <offset-x> <offset-y>\
    \ <blur-radius> or <offset-x> <offset-y> <blur-radius> <color>, where <blur-radius>\
    \ is optional and defaults to a length of 0.\n\n```css\nh2 {\n  text-shadow: rgba(0,0,0,0.5)\
    \ 2px 2px 5px;\n/* transparent black shadow shifted right 2 and down 2 with\n\
    \  a 5px blur */\n}\n```\n\nYou can create the appearance of embossed text by\
    \ mixing light and dark text-shadow effects, as is done in this multiple-shadow\
    \ example:\n\n```css\nh2 {\n  text-shadow: rgba(0,0,0,0.3) 0 -1px, rgba(255,255,255,0.3)\
    \ 0 1px;\n}\n```\n\nMultiple shadows on the same element are drawn front (first\
    \ shadow listed) to back (last shadow).\n\n## The CSS Pocket Guide\n\n## Reviewing\
    \ Content for Styling and Legibility\n\nWhen building a site, it is useful to\
    \ define a base set of styles for common elements to ensure you start off on the\
    \ right foot with a readable and accessible design based on the chosen font faces,\
    \ sizes, and colors.\n\nEarly in the project timeline there often isn't representative\
    \ copy written for different page types or content available that includes common\
    \ tags such as lists, lower-level headings, or text that wraps in uncommon ways.\
    \ All these elements are crucial to allow for reviewing line-height, text-indent,\
    \ or other properties that impact whitespace, aesthetics, and readability. So,\
    \ how do you code and test the default baseline and ensure you're starting with\
    \ a readable site if content isn't written and if design comes often have short\
    \ passages of unfinished text?\n\nIn 2006 I wrote a blog post outlining the use\
    \ of a generic test file that contained a wide variety of HTML elements that could\
    \ be included into the first page you build or be used in a style guide or inventory\
    \ document (http://placenamehere.com/article/178/). I still use this test document\
    \ for most sites I work on and have placed the code in a project on GitHub (http://github.com/placenamehere/PNHTagTest).\n\
    \nEven earlier in the design process Typograph by Iain Lamb (http://lamb.cc/typograph/)\
    \ lets you interact with the style properties of a sample passage of text and\
    \ experiment with the relationships of type sizes, line heights, whitespace, column\
    \ widths, and the scale of type.\n\nBoth types of tools allow for early adjustment\
    \ and review of a site's styling and typographic choices and help create a great\
    \ baseline with which to build the rest of the site elements.\n\n## Specifying\
    \ Typefaces\n\nThe choice of font and the availability of font faces can be some\
    \ of the most challenging aspects of web design. There's a reason that most sites\
    \ you'll visit appear in Times New Roman, Verdana, or Arial, and that is because\
    \ there just aren't that quality fonts installed on enough computers to be reliable\
    \ for web designers. Some of that has changed over time, and in the following\
    \ sections I've outlined a few ways to select typefaces for use on the Web.\n\n\
    ## System Fonts\n\nOperating systems such as Windows, Mac OS X, Linux, iOS, and\
    \ Android typically are bundled with a set of preinstalled fonts. Some extremely\
    \ common applications such as Microsoft Office install additional font files.\
    \ There are no truly ubiquitous fonts for the Web, because even the most common\
    \ fonts can be disabled or removed by the computer's owner, but these are some\
    \ of the most commonly available fonts on desktop browsers:\n\n- Serif typefaces:\
    \ Times New Roman, Times, Georgia, Palatino Linotype (Palatino on OS X)\n- Sans-serif\
    \ typefaces: Verdana, Arial, Arial Narrow, Arial Black, Helvetica, Impact, Trebuchet\
    \ MS, Tahoma\n- Monospace typefaces: Courier New, Courier, Andale Mono, Lucida\
    \ Console\n\n## The CSS Pocket Guide\n\nTo account for a font being unavailable,\
    \ it is common to list a similar typeface or to two before specifying the generic\
    \ font family, as these examples show: \n\n```css\nfont-family: \"Palatino Linotype\"\
    , Palatino, \"Times New Roman\", serif;\nfont-family: Tahoma, Arial, Helvetica,\
    \ sans-serif;\nfont-family: Verdana, Geneva, sans-serif;\nfont-family: \"Andale\
    \ Mono\", \"Courier New\", Courier, monospace;\n```\n\nYou can find more detailed\
    \ information on installed fonts in the 24ways article “Increase Your Font Stacks\
    \ With Font Matrix\" by Richard Rutter (http://24ways.org/2007/increase-your-font-stacks-with-font-matrix)\
    \ and on the Code and Style site (http://www.codestyle.org/css/font-family/index.html).\n\
    \n## Font Embedding\n\nTo break free of the short list of commonly installed set\
    \ of \"safe\" fonts, IE4 introduced font embedding in CSS via the @font-face rule.\
    \ With its standardization by the W3C and more recent adoption by other browser\
    \ vendors, font embedding is gaining traction, but it is not without the issues\
    \ that come with early adoption of any technology.\n\n## @font-face\n\nThe @font-face\
    \ rule allows for defining a custom font and linking that family to a resource\
    \ or resources. Two sets of values are set with this:\n\n- font-family: The family\
    \ name for the custom font;\n- src: The font source and optional (but in practice)\
    \ format\n\n## Chapter 9: Typography and Web Fonts\n\nA basic embedded font declaration\
    \ looks like this:\n\n```css\n@font-face {\n  font-family: \"Chris Script\";\n\
    \  src: url(fonts/ChrisScript.ttf);\n}\nh1 {\n  font-family: \"Chris Script\"\
    , cursive;\n}\n```\n\nIf a browser did not support the @font-face rule (or could\
    \ not find the particular format of the font), it would ignore the first font\
    \ name and render the element using the browser-defined cursive.\n\nA font that\
    \ may appear on the system can be searched by font name using local() before the\
    \ url(). This prevents the need to download a copy of a font that might be installed\
    \ on some, but it's not ubiquitous enough to be considered safe without embedding.\n\
    \n```css\n@font-face {\n  font-family: \"Vera Mono\";\n  src: local(\"Bitstream\
    \ Vera Mono\"); url(fonts/BSVSM.ttf);\n}\nnh2 {\n  font-family: \"Vera Mono\"\
    , \"Courier New\", cursive;\n}\n```\n\nIf the family name specified in the @font-face\
    \ rule exists already by a previous rule or because it is on the system, the new\
    \ definition will take its place.\n\n## Font Formats\n\nLike the HTML5 video wars\
    \ (http://diveintohtml5.org/video.html), those attempting to implement embeddable\
    \ fonts to untangle a mess of file format support among the various browsers.\
    \ And like the video format landscape, browser vendors have chosen to support\
    \ different formats because of a mix of licensing and protection issues, platform-norms,\
    \ and legacy behavior. Possible formats include the following:\n\n- truetype:\
    \ TrueType fonts (TTF); supported in Safari 3.1+, Chrome 4+, Firefox 3.5+, Opera\
    \ 10+\n- opype: OpenType fonts (OTF); supported in Safari 3.1+, Chrome 4+, Firefox\
    \ 3.5+, Opera 10+\n- embedded-opentype: Embedded Open Type fonts (EOT) embedable\
    \ fonts; supported in IE 4+\n- svg: SVG-based font definition; supported in Opera\
    \ 10+, Mobile Safari\n- woff: Web Open Font Format embeddable fonts (WOFF); supported\
    \ in Firefox 3.6+, IE 9+\n\nFrom IE4 to IE8, Microsoft supported only the proprietary\
    \ EOT format out of concern that embedding TTF or OT fonts required the raw font\
    \ files to be posted to a web server for the world to download and because so\
    \ would break the licensing agreements covering most fonts. Until WOFF is widely\
    \ supported, to embed custom fonts in IE and the rest of the browsers, you must\
    \ provide the font in at least two formats and define them similar to the following\
    \ example.\n"
  mdcn: "\n\n## text-shadow\n\n- CSS3 引入的 text-shadow 属性允许将一个或多个 <shadow> 效果应用到元素的文本上。这种阴影绘制在字母本身周围，而不是像\
    \ box-shadow（第 14 章）那样绘制在框的外边缘。\n- none: 不应用文本阴影。\n- <shadow>: 单个阴影的描述为 <color>\
    \ <offset-x> <offset-y> <blur-radius> 或 <offset-x> <offset-y> <blur-radius> <color>其中\
    \ <blur-radius> 是可选的，默认长度为 0。\n\n```css\nh2 {\n  text-shadow: rgba(0,0,0,0.5)\
    \ 2px 2px 5px;\n/* 透明黑色阴影向右偏移 2px，向下偏移 2px，并带有 5px 的模糊 */\n}\n```\n\n你可以通过混合明暗的文本阴影效果来创建浮雕文本的外，就像在这个多阴影示例所示：\n\
    \n```css\nh2 {\n  text-shadow: rgba(0,0,0,0.3) 0 -1px, rgba(255,255,255,0.3) 0\
    \ 1px;\n}\n```\n\n同一个元素上的多个阴影会从前（第一个列出的阴影）到后（最后一个列出的阴影）绘制。\n\n## CSS 便签指南\n\n\
    ## 审核样式与可读性内容\n\n在构建网站时，为常用元素定义一组基础样式是非常用的，这可以确保你根据所选字体、大小和颜色，从一开始就从良好的可读性和可访问性设计开始。\n\
    \n在项目进度早期，通常没有为不同页面类型编写具有代表性的文案，也没有可用包含常用标签（如列表、低级标题或以异常方式换行的文本）的内容。所有这些元素对于审查行高、文本缩进或其他影响空白、美学和可读性的属性至关重要。那么，如果内容尚未写好，或者设计经常只有未完成的短文本片段，你该如何编写和测试默认基准，并确保从一个可读性良好的站点开始呢？\n\
    \n2006 年，我写了一篇博客文章，概述了使用通用测试文件的方法，该文件包含了各种 HTML 元素，可以被包含在你构建的第一个页面中，或者用于样式指南或清单文档（http://placenamehere.com/article/178/）。我仍然为我处理的大多数网站使用这个测试文档，并将代码放在了\
    \ GitHub 上的项目里（http://github.com/placenamehere/PNHTagTest）。\n\n在设计过程更早的阶段，Iain\
    \ Lamb 编写的 [Typograph](http://lamb.cc/typograph/) 允许你与示例文本段的样式属性进行交互，并对字体大小、行高、空白、列宽和字体比例之间的关系进行实验。\n\
    \n这类工具都允许对网站的样式和排版选择进行早期调整和审查，并帮助创建一个极佳的基准，用此构建网站的其他元素。\n\n## 指定字体\n\n字体的选择和字体字的可用性可能是\
    \ Web 设计中最具挑战性的方面之一。你访问的大多数网站显示为 Times New Roman、Verdana 或 Arial 是有原因的，因为没有足够的计算机安装了足够高质量的字体，以至于让\
    \ Web 设计师可靠。这种情况随着时间的推移发生了一些变化，在接下来的章节中，我概述了几种为 Web 选择字体的方法。\n\n## 系统字体\n\nWindows、Mac\
    \ OS X、Linux、iOS 和 Android 等操作系统通常自带了一组预装字体。一些极其常用的应用程序如 Microsoft Office 会安装额外的字体文件。Web\
    \ 并没有真正无处不在的字体，因为即使是最常见的字体也可以被计算机者禁用或删除，但这些是桌面浏览器上最常用的字体：\n\n- 衬线字体 (Serif): Times\
    \ New Roman, Times, Georgia, Palatino Linotype (OS X 上的 Palatino)\n- 无衬线字体 (Sans-serif):\
    \ Verdana, Arial, Arial Narrow, Arial Black, Helvetica, Impact, Trebuchet MS,\
    \ Tahoma\n- 等宽字体 (Monospace): Courier New, Courier, Andale Mono, Lucida Console\n\
    \n## CSS 便签指南\n\n为了应对字体不可用，通常会在指定通用字体族之前列出一个或两个相似的字体，如这些示例所示：\n\n```css\nfont-family:\
    \ \"Palatino Linotype\", Palatino, \"Times New Roman\", serif;\nfont-family: Tahoma,\
    \ Arial, Helvetica, sans-serif;\nfont-family: Verdana, Geneva, sans-serif;\nfont-family:\
    \ \"Andale Mono\", \"Courier New\", Courier, monospace;\n```\n\n你可以在 Richard Rutter\
    \ 的 24ways 文章 [Increase Your Font Stacks With Font Matrix](http://24ways.org/2007/increase-your-font-stacks-with-font-matrix)\
    \ 以及 Code and Style 网站（http://www.codestyle.org/css/font-family/index.html）上找到关于已安装字体的详细信息。\n\
    \n## 字体嵌入\n\n为了摆脱常用安装的“安全”字体列表的限制，IE4 通过 `@font-face` 规则在 CSS 中引入了字体嵌入。随着 W3C\
    \ 的标准化以及其他浏览器厂商的近期采用，字体嵌入正受到关注，但它并非没有早期采用任何新技术带来的问题。\n\n## @font-face\n\n`@font-face`\
    \ 允许定义自定义字体并将字体族链接到一个或多个资源。这设置了两组值：\n\n- font-family: 自定义字体的族名；\n- src: 字体源以及可选（但实际上所需的）格式\n\
    \n## 第 9 章：排版与网络字体\n\n一个基本的嵌入字体声明如下：\n\n```css\n@font-face {\n  font-family: \"\
    Chris Script\";\n  src: url(fonts/ChrisScript.ttf);\n}\nh1 {\n  font-family: \"\
    Chris Script\", cursive;\n}\n```\n\n如果浏览器不支持 `@font-face` 规则（或者无法找到特定格式的字体），它将忽略第一个字体名称并使用浏览器定义的\
    \ cursive（草体）渲染元素。\n\n系统中可能出现的字体可以通过在 `url()` 之前使用 `local()` 按字体名搜索。这避免了下载可能在某些机器上安装的字体副本，但它并不足够普及到不需要嵌入就被认为是安全的。\n\
    \n```css\n@font-face {\n  font-family: \"Vera Mono\";\n  src: local(\"Bitstream\
    \ Vera Mono\"); url(fonts/BSVSM.ttf);\n}\nh2 {\n  font-family: \"Vera Mono\",\
    \ \"Courier New\", cursive;\n}\n```\n\n如果 `@font-face` 规则指定的字体族已通过之前的规则存在或因为系统原因存在，则新定义将取代其位置。\n\
    \n## 字体格式\n\n就像 HTML5 视频大战（http://diveintohtml5.org/video.html）一样，试图实现嵌入字体的人是为了理清各种浏览器之间文件格式支持的混乱。就像视频格式格局一样，浏览器厂商选择支持不同的格式是因为许可和保护问题、平台规范以及遗留行为的混合。可能的格式包括：\n\
    \n- truetype: TrueType 字体 (TTF);支持 Safari 3.1+, Chrome 4+, Firefox 3.5+, Opera\
    \ 10+\n- opype: OpenType 字体 (OTF);支持 Safari 3.1+, Chrome 4+, Firefox 3.5+, Opera\
    \ 10+\n- embedded-opentype: 嵌入式 OpenType 字体 (EOT) 字体；支持 IE 4+\n- svg: 基于 SVG 的字体定义；支持\
    \ Opera 10+, Mobile Safari\n- woff: Web 开放字体格式嵌入字体 (WOFF);支持 Firefox 3.6+, IE\
    \ 9+\n\n从 IE4 到 IE8，微软仅支持专有的 EOT 格式，因为担心嵌入 TTF 或 OT 字体需要将原始字体文件发布到 Web 服务器上供全球下载，并且这会破坏涵盖大多数字体的许可协议。在\
    \ WOFF 被广泛支持之前，要在 IE 和其他浏览器中嵌入自定义字体，你必须以至少两种格式提供字体，并按照如下示例进行定义。\n\n"
