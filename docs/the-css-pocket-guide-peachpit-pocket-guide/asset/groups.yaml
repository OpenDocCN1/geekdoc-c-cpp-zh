    # About the Author


    Chris Casciano started building web sites professionally in 1997 when web development
    meant working with tables and font tags, sticking to a “web-safe” color palette,
    and worrying about load times for those using dial-up modem. He is now working
    as freelance web developer, spending the last nine years in the trenches architect
    and building web sites for digital agencies and their clients. Throughout his
    career Chris has explored ways to implement emerging technologies such as HTML5,
    CSS3, and JavaScript in practical ways—balancing the bleeding edge with the responsibilities
    of serving a diverse audience. His personal projects and writing have inspired
    industry leaders with projects such as Daily CSS Fun in 2002 serving as inspiration
    for the popular CSS Zen Garden. Since 2003, Chris has been an advocate for adoption
    of web standards as a member of the Web Standards Project.


    His personal web site, Place Name Here (http://placenamehere.com), which is now
    home to a blog covering both web development and his other passion of digital
    photography, has been online since 1998.'
  - '[PAGE 5]


