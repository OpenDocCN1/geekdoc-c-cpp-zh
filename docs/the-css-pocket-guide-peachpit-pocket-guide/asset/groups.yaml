  - "[PAGE 140]\n\n# A Three-Column Layout\n\nYou can easily extend the previous two-column\
    \ layout to incorporate a margin wide enough to float two of the three columns\
    \ into. However, the size of the main column or the source order may dictate that\
    \ a different arrangement is needed. Here is some trickery with floating and negative\
    \ margins to get small left and right columns and allow the main content area\
    \ to be first in the document (Figure 7.8).\n\nFigure 7.8\nA three-column, fixed-width\
    \ layout.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_140_0.png)\n\n```\n.container\
    \ {\n  width: 534px;\n  padding: 5px;\n  border: 1px solid black;\n  background:\
    \ none;\n  overflow: auto;\n}\n.main {\n  float: left;\n  height: 200px;\n  width:\
    \ 318px; /* narrower to fit new element and gutter */\n  margin-left: 107px; /*\
    \ make room for left column */\n  border: 1px solid black;\n}\n.left_sidebar {\
    \ /* renamed, again, for clarity */\n  float: left;\n```\n\n(continues on next\
    \ page)"
- md: "\n```css\nheight: 120px;\nwidth: 98px;\nmargin-left: -426px; /* shift _past_\
    \ .main */\nborder: 1px solid black;\n}\n.right_sidebar {\n  float: right;\nheight:\
    \ 180px;\nwidth: 98px;\n  border: 1px solid black;\n}\n```\n\n```html\n<div class=\"\
    container\">\n  <div class=\"main\">\n    .main\n  </div>\n  <div class=\"left_sidebar\"\
    >\n    .left_sidebar\n  </div>\n  <div class=\"right_sidebar\">\n    .right_sidebar\n\
    \  </div>\n</div>\n```\n\n> A variation of this arrangement and in-depth description\
    \ can be found in the A List Apart article \"Multi-column Layouts Climb Out of\
    \ the Box\" (http://www.alistapart.com/articles/multicolumnayouts/) by Alan Pearce.\n\
    \n# Fixed-Sized, Flexible, and Mixed Columns\n\nThe previous layout examples were\
    \ made with fixed-width columns in a fixed-width container and as a result are\
    \ called fixed-width layouts.\n\nFlexible columns based on percentages are called\
    \ liquid layouts because they flow to fit the dimensions of the browser. Liquid\
    \ two-column layouts can be just as easily made as their fixed counterparts. Moving\
    \ to three columns can be a bit trickier, especially when source order considerations\
    \ dictate the negative margin \"jumping\" column. This is because percentage margins\
    \ are calculated relative to the width of the element they are applied to, not\
    \ the containing block's width, so unless the ratios of sizes of each column are\
    \ simple, it may not be easy to define what \"a margin equal to the width of that\
    \ other element\" is.\n\nMixed-column-based layouts don't have a fancy name, but\
    \ they consist of both fixed-dimension columns and percentage or autowidth columns.\
    \ Sometimes these or other complex arrangements are accomplished by nesting sets\
    \ of containers and columns. **Figure 7.9** and the following code illustrate\
    \ a fixed-width column and two additional columns that grow to match the container\
    \ width.\n\nFigure 7.9\n\nA mixed layout with flexible content columns and one\
    \ fixed-width sidebar.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_142_0.png)\n\
    \n```css\n.container {\n  width: auto;\n  padding: 5px 107px 5px 5px; /* room\
    \ for right sidebar */\n  border: 1px solid black;\n  background: none;\noverflow:\
    \ auto;\n\n.main_left {\n  float: left;\n  height: 200px;\n  width: 48%;\n  margin-right:\
    \ 5px;\n  border: 1px solid black;\n}\n\n.main_center {\n  float: left;\n  height:\
    \ 120px;\n  width: 48%;\n  border: 1px solid black;\n}\n\n.right_sidebar {\n \
    \ float: right;\n  height: 180px;\n  width: 100px;\n  border: 1px solid black;\n\
    \  margin-right: -102px;\n}\n```\n\n```html\n<div class=\"container\">\n  <div\
    \ class=\"main_left\">\n    .main_left\n  </div>\n  <div class=\"main_center\"\
    >\n    .main_center\n  </div>\n</div>\n<div class=\"right_sidebar\">\n  .right_sidebar\n\
    </div>\n</div>\n```\n\n# Chapter 7: Page Layouts\n\nYou may be looking at that\
    \ previous example and thinking that the math doesn't add up, and you'd be right—it\
    \ doesn't. When mixing percentage measurements, you have to fudge the numbers\
    \ just a little. A 50 percent width plus another 50 percent width plus 4 pixels\
    \ worth of borders plus a 5-pixel margin is clearly greater than the 100 percent\
    \ width that the container has to spare. It is a better bet that 96 percent of\
    \ that space will leave 9 pixels to spare, which, in this case, will be true so\
    \ long as the container's content width is at least 225 pixels (9 pixels / 100\
    \ percent – 96 percent) * 100). If the content width is larger than 225 pixels,\
    \ that 4 percent width will be larger than 9 pixels, but in many situations, those\
    \ few extra pixels are a fair trade-off for having a mixed layout.\n\n# Designing\
    \ with Constraints\n\nFlexible columns are often the best solution for a Web where\
    \ every visitor has a different screen size and browser size, but that doesn't\
    \ take into account that the content often has a role to play as well. Content\
    \ columns that are too small may not fit images or video content, and when they\
    \ get too wide, the content may be difficult to read. Secondary columns too may\
    \ have constraints or optimal sizes. Mixed columns can be the best solution.\n\
    \nYou can use the min-width and max-width properties to cap the size of otherwise\
    \ liquid columns or column wrappers. In the following code, the container used\
    \ in the previous examples is allowed to grow to between 600 pixels and 1000 pixels\
    \ and then is centered on the page if it goes beyond the maximum width.\n\n```css\n\
    .container {\n  width: auto;\n  min-width: 600px;\n  max-width: 1000px;\n  margin:\
    \ 0 auto;\n}\n```\n\n# Backgrounds and Borders\n\nThe background property is flexible,\
    \ allowing you to set the color, image, repeat, attachment, and position in a\
    \ single line.\n\n## Backgrounds\n\nThe background-color property sets the background\
    \ color of an element. It can be any color value (name, hex, RGB, etc.).\n\nThe\
    \ background-image property sets the background image of an element. You can use\
    \ multiple images by separating them with a comma.\n\nThe background-repeat property\
    \ determines how the background image repeats.\n\n- repeat: The image repeats\
    \ in both directions (default).\n- repeat-x: The image repeats horizontally.\n\
    - repeat-y: The image repeats vertically.\n- no-repeat: The image does not repeat.\n\
    \nThe background-attachment property defines how the background image scrolls\
    \ with the page.\n\n- scroll: The background scrolls along with the element (default).\n\
    - fixed: The background is fixed with respect to the viewport.\n\nThe background-position\
    \ property specifies the initial position of the background image.\n\n- <length>:\
    \ A fixed length for the offset from the upper-left corner.\n- <percentage>: A\
    \ percentage offset relative to the difference between the size of the container's\
    \ content area and the size of the image.\n- top: Equivalent of 0% for the vertical\
    \ position.\n- right: Equivalent of 100% for the horizontal position.\n- bottom:\
    \ Equivalent of 100% for the vertical position.\n- left: Equivalent of 0% for\
    \ the horizontal position.\n- center: Equivalent of 50% for either position.\n\
    \n# Borders\n\nThe border-width property sets the thickness of the border around\
    \ an element.\n\nThe border-style property sets the style of the border.\n\n-\
    \ none: No border (default).\n- solid: A solid line.\n- dashed: A dashed line.\n\
    - dotted: A dotted line.\n- double: Two parallel lines.\n\nThe border-color property\
    \ sets the color of the border.\n"
