  - '[PAGE 210]


    # Forms and User Interface Elements


    Designing and styling forms and getting constant results across browsers and platforms
    can be the most difficult part of web development.


    Most of this difficulty arises because of the nature of form elements. They''re
    built to solicit input from the user of the site, and how that input gets can
    be quite different from device to device.


    Different operating systems have different native form control behavior and appearance,
    and browser vendors have tried to keep the display of interface elements in line
    with those standards. As a result, a user will typically see familiar inputs even
    if they use multiple browsers on one device, but if they change devices or operating
    systems, the interface'
  - '[PAGE 211]


    # 188 The CSS Pocket Guide


    elements will change. Even in the same browser, the appearances may differ between
    Windows, Mac OS X, Linux, and mobile devices. Figure 11.1 shows the difference
    in appearance of a select elements on three different devices.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_211_0.png)


    Figure 11.1 Interaction with select element in Safari/Apple iPhone iOS4, Safari/Apple
    iPad iOS3, and IE 8/Windows XP (from left to right).


    You can find additional examples of CSS applied to form elements in different
    browsers and operating systems at Christopher Schmitt’s meticulously collected
    and indexed collection of screenshots at http://www.WebFormElements.com.


    Something else that can be unique to form layouts is the need to juggle the myriad
    of positioning and placement and states of the elements of the form. Large fields,
    small fields, sets of fields, labels, and help or error messages all need to be
    placed so that it is clear to the visitor what is being requested from them. The
    grid that works for a standard-length text input along with its label may not
    work for a collection of radio buttons or a combination of inputs such as parts
    of a phone number or city and state.'
- md: "\n## Working with Form Controls\n\nAs different as they can be from platform\
    \ to platform, form elements on the major desktop browsers tend to share the basic\
    \ properties; sizing, fonts, colors, and backgrounds all can be set as they would\
    \ on any other HTML element. Because some controls are more complex than your\
    \ average block of text, how those properties are applied can be a bit peculiar.\
    \ There's no hard and fast rule covering where a border is drawn or what parts\
    \ of the select widget handle a color applied to.\n\n> Safari will draw native\
    \ form controls (the bubbly look on OS X) even when some styles are defined. Set\
    \ a border on the element to force it out of the native mode and into one that\
    \ takes other styles such as color or backgrounds.\n\n## Sizing\n\nForm elements,\
    \ like images, are inline replaced elements. For styling purposes, it is best\
    \ to think of them as rectangular boxes even when they’re “round” radio buttons\
    \ or made of multiple parts like file input fields. When setting the height and\
    \ width of a form element, you’re setting the dimensions on the outer box. What\
    \ the field inside that box does to fill the space is out of your hands.\n\nAlthough\
    \ elements such as textareas and buttons fill the entire rectangular box, check\
    \ boxes, radio buttons (Figure 11.2 on the next page), and file input fields reserve\
    \ the specified space in the layout but in various ways to fill that space (or\
    \ not really fill it, as shown in some of these examples).\n\nFigure 11.2 Radio\
    \ buttons in Safari 5.0.1/OS X, Firefox 3.6.8/OS X, Firefox 3.0.1/Windows, IE\
    \ 8/Windows, and Opera 10.6.1/Windows (from left to right) with a 100-pixel width,\
    \ 100-pixel height, 1-pixel red border, and 10-pixel padding.\n\nTo further complicate\
    \ things, textareas, text inputs, and similar elements aren’t quite like the other\
    \ elements since they follow the content-box box sizing model, whereas other elements\
    \ use the border-box model. Setting the box-model property to border-box helps\
    \ regain some consistency between text inputs and selects and buttons, with the\
    \ drawback of making them behave less like the labels or paragraphs that surround\
    \ the fields.\n\n```css\nform input[type=\"text\"],\nform input[type=\"password\"\
    ],\nform input[type=\"file\"],\ntextarea {\n  -ms-box-sizing: border-box;\n  -moz-box-sizing:\
    \ border-box;\n  -webkit-box-sizing: border-box;\n  box-sizing: border-box;\n\
    }\n```\n\n## Colors, Backgrounds, and Borders\n\nLike sizing, colors apply as\
    \ you’d expect them for text in elements such as submit buttons, textareas, and\
    \ password fields. On the other hand, the behavior of radio buttons, check boxes,\
    \ and select options will vary based on the browser and platform, so consider\
    \ the color to be just a suggestion, not a rule.\n\nThis goes for other properties\
    \ as well. Where would you apply a background color to a radio button—inside the\
    \ circle or outside and behind the circle in the rest of the box? Is the line\
    \ between the text space and the little handle of a select element a border? How\
    \ many backgrounds and borders are there in a field input that is often represented\
    \ as something that looks like a text input plus a button? What about all these\
    \ new input types like sliders in HTML5?\n\nThese are the questions that give\
    \ browser developers (and in turn web developers) migraines.\n\nFor the most consistent\
    \ appearance, you should probably avoid borders and background colors and avoid\
    \ background images for radio buttons and check boxes. (Figure 11.2 showed examples\
    \ of browser differences.) On the other hand, you can do interesting things with\
    \ borders, background-colors, and background images for the other field types.\
    \ In the next example, a background image on a text input is used to create the\
    \ feeling of depth (Figure 11.3). I've added background color change when the\
    \ element is in focus for a highlight.\n\n```css\ninput[type=\"text\"] {\n  padding:\
    \ 4px;\n  width: 100px;\n  border: 1px solid #000;\n  background: #fff url(images/inner_shadow.png)\
    \ no-repeat left top;\n}\ninput[type=\"text\"]:focus {\n  background-color: #fff335;\n\
    }\n```\n\nFigure 11.3\nA text input with a background image.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_214_0.png)\n\
    \n## Fake It Until Browsers Make It\n\nClever developers have come up with a whole\
    \ slew of tricks to get around the lack of styling flexibility with forms in browsers.\
    \ They get around some of the cross-platform quirks inherent in form fields by\
    \ disabling borders and fancy background images or using visibility and z-index\
    \ tricks, and they get around styling limitations by creating complex JavaScript-based\
    \ interactions. Some methods leave the original input fields intact, others use\
    \ JavaScript to replace the standard form input controls and instead use a series\
    \ of click or other events to control the appearance of nonform fields, storing\
    \ the resulting values in hidden fields.\n\nHere are a few examples of using CSS\
    \ and JavaScript to work around form styling limitations:\n\n- Replacing the varied\
    \ looks of file inputs (see the example at http://www.quirksmode.org/dom/inputfile.html).\n\
    - Using backgrounds for highly styled radio buttons and check boxes (see the example\
    \ at http://www.quirksmode.org/dom/inputfile.html).\n- Implementing new HTML5\
    \ types such as sliders, date pickers, and others (see http://diveninja.com/css/inputs).\n\
    \n## Text and Form Inheritance\n\nBy default, labels and forms are inline elements.\
    \ This is a useful baseline, but creating a form with a clean grid requires some\
    \ changes to those default behaviors and sometimes a little markup.\n\n## States:\
    \ Disabled, Required, and Invalid\n\nThe following code shows how to style the\
    \ state of form elements using the :disabled, :required, :valid, and :invalid\
    \ pseudo-class selectors.\n\n```css\nlabel.required {\n  font-weight: bold;\n\
    }\ninput:invalid {\n  color: red;\n}\ninput[type=\"submit\"]:disabled {\n  background:\
    \ #aaa;\n  color: #fff;\n}\n```\n\n## Form Element Layouts\n\n### Label Stacked\
    \ Above the Field\n\nCreating a layout where the label is on a line above the\
    \ form field is as easy as setting the label to display as a block element (Figure\
    \ 11.4):\n\n```css\nlabel {\n  display: block;\n  margin-top: 1em;\n}\n```\n\n\
    ```html\n<fieldset>\n  <legend>Your Info</legend>\n  <label for=\"fname\">First\
    \ Name:</label>\n  <input type=\"text\" name=\"fname\" id=\"fname\">\n  <label\
    \ for=\"lname\">Last Name:</label>\n  <input type=\"text\" name=\"lname\" id=\"\
    lname\">\n  <label for=\"phone1\">Phone Number:</label>\n  <input type=\"text\"\
    \ name=\"phone1\" id=\"phone1\" size=\"3\">\n  <input type=\"text\" name=\"phone2\"\
    \ id=\"phone2\" size=\"3\">\n  <input type=\"text\" name=\"phone3\" id=\"phone3\"\
    \ size=\"4\">\n</fieldset>\n```\n\nFigure 11.4\nForm presentation with labels\
    \ above form elements.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_218_0.png)\n\
    \n### Basic Multicolumn Forms\n\nIn the previous example, the fields read from\
    \ the top down. To change the order of elements so they appear from left to right,\
    \ you can make a small alteration to the styles and markup to give you boxes for\
    \ elements that float beside each other (Figure 11.5 on the next page):\n\n```css\n\
    label {\n  display: block;\n  margin-top: 1em;\n}\ndiv.field {\n  float: left;\n\
    \  width: 50%;\n}\n```\n"
  mdcn: "\n\n## 使用表单控件\n\n尽管不同平台之间的表单元素可能大不相同，但主流桌面浏览器上的表单元素倾向于共享基本属性；尺寸、字体、颜色和背景都可以像设置任何其他\
    \ HTML 元素一样进行。由于某些控件比普通的文本块复杂得多，这些属性的应用方式可能会有些特殊。目前没有硬性规定来规定边框绘制在何，或者 select 控件的哪些部分会处理所应用的颜色。\n\
    \n> 即使在定义了某些样式时，Safari 也会绘制原生表单控件（OS X 上那种泡泡外观）。为元素设置边框可以强制其跳出原生模式，进入接受颜色或背景等其他的模式。\n\
    \n## 尺寸\n\n表单元素像图像一样，是内联替换元素（inline replaced elements）。出于样式考虑，即使它们是“圆形”单选按钮或由多个部分组成（如文件输入字段），最好将它们想象为矩形框。在设置表单元素的高度和宽度时，你是在设置外框的尺寸。框内部的字段如何填充空间则由你无法控制。\n\
    \n虽然 textarea 和按钮等元素会填充整个矩形框，但复选框、单选按钮（下一页的图 11.2）和文件输入字段在布局中留出了指定的空间，但以各种方式填充该空间（或并未真正填充，如这些部分示例所示）。\n\
    \n图 11.2 Safari 5.0.1/OS X、Firefox 3.6.8/OS X、Firefox 3.0.1/Windows、IE 8/Windows\
    \ 以及 Opera 10.6.1/Windows 中的单选按钮（从左到右），宽度 100 像素，高度 100 像素，1 像素红色边框，10 像素内边距。\n\
    \n更复杂的是，textarea、文本输入和类似元素与其他元素并不一样，因为它们遵循内容盒（content-box）盒尺寸模型，而其他元素使用边框盒（border-box）模型。将\
    \ `box-model` 属性设置为 `border-box` 有助于恢复文本输入、select 和按钮之间的一些一致性，缺点是会让它们的行为不再像围绕字段的标签或段落。\n\
    \n```css\nform input[type=\"text\"],\nform input[type=\"password\"],\nform input[type=\"\
    file\"],\ntextarea {\n  -ms-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n\
    \  -webkit-box-sizing: border-box;\n  box-sizing: border-box;\n}\n```\n\n## 颜色、背景和边框\n\
    \n与尺寸一样，颜色的应用正如你预期的适用于提交按钮、textarea 和密码字段等元素中的文本。另一方面，单选按钮、复选框和 select 选项的行为会根据浏览器和平台而异，因此可以将颜色视为一种建议而非规则。\n\
    \n其他属性也是如此。你会在什么位置为单选按钮应用背景颜色——是在圆形内部，还是在框的其他部分的圆形外部后面？文本空间与 select 元素的小手柄之间的线条是边框吗？在一个通常被表示为像文本框加按钮的字段输入中，有多少个背景和边框？HTML5\
    \ 中滑块等所有新输入类型又是如何？\n\n这些问题让浏览器开发者（反过来也是 Web 开发者）头疼。\n\n为了获得最一致的外观，你可能应该避免单选按钮和复选框使用边框和背景颜色，并避免使用背景图像。（图\
    \ 11.2 展示了浏览器差异的示例。）另一方面，你可以对其他字段类型使用边框、背景颜色和背景图像来实现有趣的事情。在下一个示例中，文本输入上的背景图像被用于创建深度感（图\
    \ 11.3）。我添加了当元素获得焦点时的背景颜色变化以进行高亮。\n\n```css\ninput[type=\"text\"] {\n  padding:\
    \ 4px;\n  width: 100px;\n  border: 1px solid #000;\n  background: #fff url(images/inner_shadow.png)\
    \ no-repeat left top;\n}\ninput[type=\"text\"]:focus {\n  background-color: #fff335;\n\
    }\n```\n\n图 11.3\n带有背景图像的文本输入。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_214_0.png)\n\
    \n## 伪装，直到浏览器支持\n\n聪明的开发者想出了一系列技巧来规过浏览器中表单样式灵活性不足的问题。他们通过禁用边框和花哨的背景图像，或使用可见性和\
    \ z-index 技巧来规避表单字段固有的跨平台异常，并通过创建复杂的基于 JavaScript 的交互来规避样式限制。某些方法保持原始输入字段完整，另一些方法则使用\
    \ JavaScript 替换标准的表单输入控件，转而使用一系列点击或其他事件来控制非表单字段的外观，并将结果存储在隐藏字段中。\n\n以下是使用 CSS\
    \ 和 JavaScript 规避表单样式限制的几个示例：\n\n- 替换文件输入的多变外观（参见 http://www.quirksmode.org/dom/inputfile.html\
    \ 中的示例）。\n- 为高度样式化的单选按钮和复选框使用背景（参见 http://www.quirksmode.org/dom/inputfile.html\
    \ 中的示例）。\n- 实现新的 HTML5 类型，如滑块、日期选择器等（访问 http://diveninja.com/css/inputs）。\n\n\
    ## 文字与表单继承\n\n默认情况下，label 和 form 是内联元素。这是一个非常有用的基础，但要创建一个整洁网格表单需要对这些默认行为进行一些更改，有时还需要一些标记。\n\
    \n## 状态：禁用、必须和无效\n\n以下代码显示了如何使用 `:disabled`、`:required`、`:valid` 和 `:invalid`\
    \ 伪类选择器设置表单元素的状态。\n\n```css\nlabel.required {\n  font-weight: bold;\n}\ninput:invalid\
    \ {\n  color: red;\n}\ninput[type=\"submit\"]:disabled {\n  background: #aaa;\n\
    \  color: #fff;\n}\n```\n\n## 表单元素布局\n\n### 标签堆在字段上方\n\n创建一个标签位于表单字段上方一行的布局，只需将\
    \ label 设置为显示块级元素即可（图 11.4）：\n\n```css\nlabel {\n  display: block;\n  margin-top:\
    \ 1em;\n}\n```\n\n```html\n<fieldset>\n  <legend>您的信息</legend>\n  <label for=\"\
    fname\">名:</label>\n  <input type=\"text\" name=\"fname\" id=\"fname\">\n  <label\
    \ for=\"lname\">姓:</label>\n  <input type=\"text\" name=\"lname\" id=\"lname\"\
    >\n  <label for=\"phone1\">电话号码:</label>\n  <input type=\"text\" name=\"phone1\"\
    \ id=\"phone1\" size=\"3\">\n  <input type=\"text\" name=\"phone2\" id=\"phone2\"\
    \ size=\"3\">\n  <input type=\"text\" name=\"phone3\" id=\"phone3\" size=\"4\"\
    >\n</fieldset>\n```\n\n图 11.4\n标签位于表单元素上方的形式演示。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_218_0.png)\n\
    \n### 多列表单\n\n在之前的示例中，字段是从上往下读取的。要改变元素的顺序使其从左到右排列，你可以对样式和标记进行细微调整，为并浮的元素提供容器（下一页的图\
    \ 11.5）：\n\n```css\nlabel {\n  display: block;\n  margin-top: 1em;\n}\ndiv.field\
    \ {\n  float: left;\n  width: 50%;\n}\n```\n\n"
