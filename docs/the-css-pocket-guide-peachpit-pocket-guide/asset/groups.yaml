  - '[PAGE 19]


    # Resources


    It goes without saying that a topic at the core of web development will have a
    large number of great resources on the Web.


    +   - Check out the W3C''s CSS Working Groups Current Work index of the CSS specifications.
    http://www.w3.org/Style/CSS/current-work


    +   - You can also refer to the detailed browser support charts and other web
    development articles by Peter-Paul Koch at QuirksMode.org. http://quirksmode.org/


    +   - The WASP Interact Curriculum project offers a full and ongoing curriculum
    for learning and teaching web development and web design including CSS. http://interact.webstandards.org/


    +   - The Mozilla Developer Center offers a complete reference of the CSS language
    and is great for looking things up in a flash. https://developer.mozilla.org/en/CSS_Reference


    +   - The Opera Developer Network offers articles, tutorials, and references for
    all areas of web development, including a curriculum you can walk through and
    teach yourself. http://dev.opera.com/


    # Writing CSS


    Unlike a programming language such as JavaScript, there isn''t that much to the
    syntax of CSS and the makeup of CSS rules. The following sections highlight some
    things you should know before jumping into the complexities of what the simple
    syntax can do.


    # Case Sensitivity


    CSS is case insensitive. For example, the color property is equivalent to the
    COLOR property, and a px unit is the same as a PX or P unit. By'
  - '[PAGE 20]


    convention, properties and values are typically written using lowercase characters,
    and that is the convention followed in this book.


    Parts of the code not under the control of CSS such as file paths to style sheet
    documents, images, element names, classes and IDs may be case sensitive and defined
    at their source. For example, the file path on one server may be case sensitive,
    but on another server or your local machine it may not be. For markup, elements
    in HTML documents are case insensitive; however, elements in XML-based documents
    are.


    To avoid confusion or code bugs, it is best to match the case in your code regardless
    of whether it will be enforced.


    # Comments


    There is only one way to write a comment in CSS—beginning with the two characters
    /* and ending with the same two characters reversed, /. Any text, code, or whitespace
    between those two is ignored.


    ```

    /* this is a comment */

    ```


    # Whitespace


    In CSS, whitespace—including space characters, tabs, and line breaks—has no meaning
    outside of its use as a descendent selector (Chapter 3) or as a separator for
    multiple values in a single declaration. Outside of those two cases, it is considered
    optional. It is up to you to use whitespace (or not) to format your CSS to help
    with the organization and readability of your code.


    # Quoting and Escaping Quotes


    The single quote ('''') and double quote (") can be used interchangeably to wrap
    string values in CSS (though if a string starts with one, it must end with the
    same one).


    The backslash (\) is the escape character in CSS. It can be used to escape a quote
    mark that is part of a string (or another backslash that'
  - '[PAGE 21]


    # The CSS Pocket Guide


    appear as part of the string. The backslash character can also be used to include
    characters via their character codes.


    For some string-like references, such as with a url() reference, it is also allowable
    to leave off the quote marks around a string.


    Keywords, such as color names, are not strings and must not be quoted.


    # Tools


    Building web pages while wrangling browser bugs takes more than just a text editor
    and a browser. The following are a few categories of tools that are invaluable
    additions to your toolbox.


    # Validation Tools


    Validation tools parse your HTML or CSS documents checking for conformance with
    the designated specification in areas such as syntax errors, missing or improperly
    nested HTML tags, unknown CSS properties, illegal values, or other coding problems.
    The W3C validation service (http://jigsaw.w3.org/css-validator/) is one commonly
    used validator.


    As a tool, the errors a validation service can uncover may help identify where
    visual bugs you''re seeing in browsers derive from. For example, it is common
    that a missing closing tag may cause styles to bleed out of the area you would
    have expected. But be careful and understand errors before reacting to them by
    because some code that you want to use, such as vendor extensions for experimental
    CSS3 implementations, may also be reported as an error based on the validator''s
    settings.


    # Web Inspectors


    Web inspectors (or DOM inspectors) are tools that allow you to view the document
    tree, CSS properties, and other information about a web page'
  - '[PAGE 22]


    as it appears in your browser, often with a click on the element itself.

    These tools are invaluable when writing and debugging CSS code, providing real-time
    information about style properties and pointing out which style rules contributed
    to the element''s appearance.


    +   * Internet Explorer: Starting with version 8, Internet Explorer includes Developer
    Tools, a set of built-in tools including the ability to inspect HTML elements
    and view CSS information. To launch the tools, press F12 or select Tools > Developer
    Tools from the menu in the IE. For older versions of IE, including 6 and 7, Microsoft
    offers a downloadable extension called the Internet Explorer Developer Toolbar.


    +   * Firefox: Among its other features, the Firebug extension for Firefox (http://www.getfirebug.org/)
    allows for viewing and editing of the document tree and style property cascade.
    Once installed, you can open Firebug directly or by right-clicking an element
    in the page and choosing Inspect Element.


    +   * Safari: Safari on OS X and Windows comes with a built-in web inspector.
    These tools are disabled by default, but you can enable them from the Advanced
    panel inside Safari''s preferences. Once enabled, you can open it from the Develop
    menu or right-clicking an element in the page and choosing Inspect Element.


    +   * Chrome: Chrome also ships with built-in developer tools with similar features
    to those already mentioned. To access the tools, select View > Development > Developer
    Tools from the menu or right-click an element in the page and choose Inspect Element.


    +   * Opera: Opera Dragonfly is another suite of tools for working with web documents
    including viewing styling information. To activate Dragonfly, select Tools > Advanced
    > Opera Dragonfly from the menu in Opera, or right-click an element in the page
    and choose Inspect Element.'
  - '[PAGE 23]


    # Web Developer Toolbar


    Chris Pederick created the Web Developer Toolbar extension (http://chrispatrick.com/work/web-developer/)
    for Firefox and Chrome that provides some nifty features not found in standard
    web inspectors such as the ability to add an overlay above the document that displays
    the document structure or element attributes, resize your browser window to certain
    dimensions for testing, or submit the document to validation services.


    (I take some pride in this tool as it is based on the toolbar I had written for
    the now long defunct Mozilla Suite, which predated Firefox. That said, Chris deserves
    all the credit now because he has taken it further and supported it with much
    more time and energy than I had.)


    # Yahoo! YSlow and Google Page Speed


    Yahoo! YSlow (http://developyahoo.com/yslow/) is a Firefox add-on geared toward
    analyzing and improving the performance of web sites in areas such as caching,
    download sizes, and speeds, as well as reducing the number of requests made to
    the server delivering the content and all its types of assets.


    Through YSlow and its companion suite of tool, you can learn about tools to compress
    CSS documents; optimize server calls for CSS files, JavaScript files, and perform
    lots of other performance tricks not covered directly in this book.


    Google Page Speed (http://code.google.com/speed/page-speed/) is another Firebug
    add-on in a similar vein as YSlow. It can identify which CSS declarations are
    not being utilized by an HTML document and it can point out which of your CSS
    selectors are written inefficiently and why.'
- md: "\n# CSS Basics\n\nThere exists a trinity of standards-based web development\
    \ technologies that when used in concert, can create exciting, vibrant, interactive\
    \ web sites out of what on their own are just a bunch of text files.\n\nHTML provides\
    \ the content and structure of the web page, JavaScript supplies the interaction\
    \ and document manipulation, and CSS provides the presentation and flair.\n\n\
    # The CSS Pocket Guide\n\n## What Is CSS?\n\nCSS, short for Cascading Style Sheets,\
    \ is a language for describing the presentational properties of content elements\
    \ in structured documents such as HTML documents. Though this book will focus\
    \ on styling HTML content, you can also use CSS for other-structured documents\
    \ such as those created with XML or SVG.\n\n## What Are Styles Sheets?\n\nStyle\
    \ sheets provide a set of guidelines for styling a structured document by defining\
    \ rules for the appearance of different types of content or different contexts\
    \ that content can be found in. You may have already encountered forms of style\
    \ sheets or themes in typical office suites or e-mail programs. It is common in\
    \ presentation software such as PowerPoint or Keynote to pick a theme to start\
    \ with, where each slide is automatically formatted with the same font sizes,\
    \ colors, and layouts, rather than starting with a blank slate and designing each\
    \ slide individually and hoping for them to be consistent when you're done.\n\n\
    As a browser or other user agent loads the HTML content for the document, it also\
    \ loads the style sheet information. From this style sheet information, it then\
    \ builds up the set of presentation rules for each individual content item based\
    \ on its element type, its state, and its location in the document. It will ultimately\
    \ render each element consistently based on this accumulated set of rules.\n\n\
    ## Anatomy of a Statement\n\nCSS-based style sheets consist of a list of statements.\
    \ There are two types of statements: rule sets (referred to as rules) and at-rules.\n\
    \n## Rule Sets\n\nA rule set consists of a selector followed by a declaration\
    \ block containing declarations of style properties and their values, as explained\
    \ in the following list (see also Figure 1.1).\n\nFigure 1.1\nThe parts of a rule\
    \ set.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_26_0.png)\n\n- 1. Rule set:\
    \ This is the entire definition of a CSS rule, including selector and declaration\
    \ block, containing individual declarations.\n- 2. Selector: The selector includes\
    \ everything up to the opening curly brace. The selector describes the markup\
    \ elements to which the contents of declaration block apply. Individual selectors\
    \ may share a declaration block, with each selector separated with a comma, ().\n\
    - 3. Declaration block: The declaration block starts with the left curly brace\
    \ and ends with the right curly brace. Inside the block there are zero or more\
    \ declarations, each separated by a semicolon (;).\n- 4. Declaration: Each declaration\
    \ is a colon-separated property-value pair.\n- 5. Property: The property is the\
    \ CSS property that the declaration is targeting.\n- 6. Value: This is the value\
    \ that will be applied to the declared property. The syntax of the value depends\
    \ on the property but can be things such as keywords, a <length>, a <percentage>,\
    \ or a mix of multiple, space-separated types.\n\n## Defining Values for Four-Sided\
    \ Properties\n\nProperties such as margin, padding, and border-width are used\
    \ to define values for all four sides of a block (whereas margin-right defines\
    \ the right margin alone). These properties, and those like them, can take from\
    \ one to four space-separated values that are applied to the sides in the following\
    \ manner:\n\n- If one value is listed (for example, 10px), that value is applied\
    \ to all four sides.\n- If two values are listed (for example, 10px 5%), the first\
    \ value is applied to the top and bottom, while the second is applied to the right\
    \ and left sides.\n- If three values are listed (for example, 10px 5% 20px), the\
    \ first value is applied to the top, the second to both the right and left sides,\
    \ and the last to the bottom.\n- If four values are listed (for example, 10px\
    \ 5% 20px auto), the values are applied clockwise starting from the top (top,\
    \ right, bottom, left).\n\n## At-Rules\n\nAt-rules are statements that begin with\
    \ the character for at (@), followed by a rule type or identifier, and end with\
    \ a semicolon. Unlike rule sets, at-rules do not contain declarations directly\
    \ but offer additional context or commands for the processing of style sheet information.\
    \ Here's an example:\n\n```css\n/* include file additional.css */\n@import \"\
    additional.css\"\n/* target specific media with contained rules */\n```\n\n```css\n\
    @media print {\n  [...\n}\n```\n\n## Cascading\n\nThe *cascading* in CSS is the\
    \ process that is followed in order to determine which declaration for a given\
    \ property is applied to a given element in the document. As you'll soon learn,\
    \ properties—color, for instance—can be defined and redefined multiple times,\
    \ so the browser must determine which of those definitions to apply. The criteria\
    \ for sorting through the style sheets to determine which property declaration\
    \ to use is threefold: weight, specificity, and order of appearance.\n\nThe *weight*\
    \ of the declaration is determined by the origin of the style rule. Style rules\
    \ can be found in one of three sources in descending order of weight:\n\n- Author\
    \ style sheets: These are the style sheets defined along with the source HTML\
    \ document by the author of the page visited.\n- User style sheets: User style\
    \ sheets are CSS documents or other styling preferences selected by the user of\
    \ the browser.\n- User agent style sheets: Each user agent applies a default set\
    \ of rules.\n\nThe *specificity* of the declaration is determined by how precise\
    \ the selector used is. Finally, the *order of appearance* is used if multiple\
    \ declarations share the same specificity.\n\n## The CSS Pocket Guide\n\nSpecificity\
    \ is covered in detail in Chapter 3.\n\nTo calculate the winning declaration for\
    \ a given property, first weight is considered. If multiple declarations share\
    \ the highest specificity, then order of appearance is used.\n\nFigure 1.2 The\
    \ Safari Inspector displaying the cascade.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_29_0.png)\n\
    \n## Inheritance\n\nThe values for some properties, such as color and font-family,\
    \ are inherited by child elements of the element where the property was set. If\
    \ that property was not explicitly declared for the child element, it will use\
    \ the inherited value. In the case of color, if the <body> element has been set\
    \ to black, then paragraphs, list contents, block quotes, and other children will\
    \ also have a color value of black. Because links have a different color defined\
    \ in the user agent style sheet, they will not appear as black but as the default\
    \ link color.\n\nInherited values are passed along with child elements as their\
    \ computed value. For example, font-size is inherited; thus, the value passed\
    \ to the child elements would be the final, calculated value in pixels and not\
    \ the original units, which may have bens, ens, or pixels.\n\n```html\n<p style=\"\
    font-size: 10px\">\n<strong style=\"2em\">\n <span>Text</span>\n <strong>\n</p>\n\
    ```\n\nIn the previous code example, the font-size for the <strong> element is\
    \ calculated to be 20px, and this is the value inherited by the <span>element.\
    \ If the specified value of 2em was inherited and the size recalculated, the <span>\
    \ would have a font-sized value of 40px instead. I'll further explain computed\
    \ values in the next section.\n\nOther properties, such as width, height, and\
    \ margin, are not inherited and cannot be inherited. This means that although\
    \ you may place a height value on a <div> or <article> element of 400px, all of\
    \ that <div> or <article>'s children will continue to use the default value of\
    \ height (auto) unless their height is explicitly set.\n"
  mdcn: "\n\n# CSS 基础\n\n存在三种基于标准的 Web 开发技术，当它们协同工作时，可以将原本仅仅是一堆文本文件变成令人兴奋、充满活力且具有交互性的网站。\n\
    \nHTML 提供了网页的内容和结构，JavaScript 提供了交互和文档操作，而 CSS 则提供了视觉呈现和设计风格。\n\n# CSS 口袋指南\n\n\
    ## 什么是 CSS？\n\nCSS 是 Cascading Style Sheets（级联样式表），它是一种用于描述结构化文档（如 HTML 文档）中内容元素呈现属性的语言。虽然本书将专注于\
    \ HTML 内容的样式，但你也可以将 CSS 用于其他结构化文档，例如使用 XML 或 SVG 创建的文档。\n\n## 什么是样式表？\n\n样式表通过为不同类型的内容或内容可能出现的上下文定义外观规则，为结构化文档的样式提供一组指南。你可能已经在典型的办公套件或电子邮件程序中遇到过样式表或主题。在\
    \ PowerPoint 或 Keynote 等演示文软件中，选择一个主题开始是常见做法，这样每张幻灯片都会按照相同的字体大小、颜色和布局自动格式，而不是从空白开始单独设计每张幻灯片，并希望完成后它们能保持一致。\n\
    \n当浏览器或其他用户代理加载文档的 HTML 内容时，它也会加载样式表信息。根据这些样式表信息，它会根据每个内容元素的元素类型、状态和在文档中的位置，为每个内容项目构建一套呈现规则。它最终将根据这组累积的规则一致地渲染每个元素。\n\
    \n## 语句的构造结构\n\n基于 CSS 的样式表由语句列表组成。语句有两种类型：规则集（称为规则）和 @ 规则（at-rules）。\n\n## 规则集\n\
    \n规则集由一个选择器后跟跟一个声明块组成，声明块包含样式属性的声明及其值，如下列表所示（另请参见图 1.1）。\n\n图 1.1\n规则集的各个部分。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_26_0.png)\n\n- 1. 规则集：这是 CSS 规则的完整定义，包括选择器和声明块，其中包含单个声明。\n\
    - 2. 选择器：选择器包括左大括号之前的所有内容。选择器描述了声明块内容所应用的标记元素。单个选择器可以共享一个声明块，每个选择器用逗号（,)隔开。\n\
    - 3. 声明块：声明块以左大括号开始，右大括号结束。块内部有零或多个声明，每个声明用分号（;）隔开。\n- 4. 声明：每个声明都是用冒号分隔的属性-值对。\n\
    - 5. 属性：属性是声明所针对的 CSS 属性。\n- 6. 值：这是应用于所声明属性的值。值的语法取决于属性，但可以是关键字、<length>、<percentage>\
    \ 或或多个空格分隔的类型的混合。\n\n## 为四边属性定义值\n\n如 margin（外边距）、padding（内边距）和 border-width（边框宽度）等属性用于定义区块四边的值（而\
    \ margin-right 仅定义右边距）。这些属性以及类似的属性可以接受一个到四个空格分隔的值，并按以下方式应用于各边：\n\n- 如果列出一个值（例如\
    \ 10px），该值将应用于所有四边。\n- 如果列出两个值（例如 10px 5%），第一个值应用于顶部和底部，第二个值应用于右侧和左侧。\n- 如果列出三个值（例如\
    \ 10px 5% 20px），第一个值应用于顶部，第二个值应用于右侧和左侧，最后一个应用于底部。\n- 如果列出四个值（例如 10px 5% 20px auto），这些值从顶部开始顺时针应用（上、右、下、左）。\n\
    \n## @ 规则\n\n@ 规则是以字符 at（@）开头的语句，后跟一个规则类型或标识符，并以分号结束。与规则集不同，@ 规则不直接包含声明，而是为样式表信息的处理提供额外的上下文或命令。这是一个示例：\n\
    \n```css\n/* 包含文件 additional.css */\n@import \"additional.css\"\n/* 使用包含的规则针对特定媒体\
    \ */\n```\n\n```css\n@media print {\n  [...]\n}\n```\n\n## 级联\n\nCSS 中的*级联*（cascading）是确定给定属性的哪个声明应用于文档中给定元素时遵循的过程。正如你很快就会学的，属性（例如颜色）可以被定义和重新定义多次，因此浏览器必须决定应用这些定义中的哪一个。筛选样式表以确定使用哪个属性声明的标准有三个：权重（weight）、优先级（specificity）和出现顺序（order\
    \ of appearance）。\n\n**权重*（weight）由声明的来源决定。样式规则可以按权重递减顺序从三个源中找到：\n\n- 作者样式表：这些是用户访问页面时随\
    \ HTML 文档一起定义的样式表。\n- 用户样式表：用户选择的 CSS 文档或其他样式偏好。\n- 用户代理样式表：用户代理应用的一组规则。\n\n声明的*优先级*（specificity）取决于所用选择器的精确程度。最后，如果多个声明具有相同的优先级，则使用*出现顺序*。\n\
    \n##  CSS 口袋指南\n\n优先级将在第 3 章详细介绍。\n\n要计算给定属性的胜出声明，首先考虑权重。如果多个声明具有相同的最高优先级，则使用出现顺序。\n\
    \n图 1.2 显示级联的 Safari 检查器。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_29_0.png)\n\
    \n## 继承\n\n某些属性的值（如颜色和字体族）会被设置该属性元素的子元素继承。如果子元素没有显式声明该属性，它将使用继承的值。在颜色的情况下，如果 <body>\
    \ 元素被设置为黑色，那么段落、列表内容、块引用和其他元素也将具有黑色颜色值。由于链接在用户代理样式表中定义了不同的颜色，它们不会显示为黑色，而是默认链接颜色。\n\
    \n继承的值以计算值的形式随子元素传递。例如，字体大小是继承的；因此传递给子元素的值将是计算后的像素值，而不是原始单位（原始单位可能是 em、rem 或像素）。\n\
    \n```html\n<p style=\"font-size: 10px\">\n<strong style=\"2em\">\n <span>Text</span>\n\
    \ <strong>\n</p>\n```\n\n在之前的代码示例中，<strong> 元素的字体大小计算为 20px，这是被 <span> 元素所继承的值。如果指定的\
    \ 2em 被继承并重新计算大小，则 <span> 元素的字体大小值将是 40px 而不是。我将在下一节中进一步解释计算值。\n\n其他属性（如宽度、高度和外边距）是不被继承的，也无法继承。这意味着尽管你可能为\
    \ <div> 或 <article> 元素放置 400px 的高度值，但该 <div> 或 <article> 的子元素将继续使用高度默认值（auto），除非它们显式设置了高度。\n\
    \n"
