    # The CSS Pocket Guide


    The CSS specification for each property lists whether that property can inherit
    and whether it will inherit its parent''s value by default.


    A foundation of strong structural and semantic markup is crucial to making designing
    with CSS easy, readable, and maintainable. Although every individual node in the
    document tree can be styled explicitly, with the behavior of the cascade, specificity,
    inheritance, CSS was designed to take advantage of element context and markup
    patterns. Poorly crafted markup doesn''t provide the textual clues or "hooks"
    for styling that good markup practices like the appropriate use of `<div>` or
    `<section>` elements, a varied level of headings, and using paragraphs rather
    than line breaks do.


    # Specified, Computed, Used, and Actual Values


    Values come in four flavors depending on where and how they are being referenced.
    You''ve already encountered computed values and specified values: the third is
    the actual value.


    +   - Specified values: These are the values as they were coded in the CSS rules.

    - Computed values: These are the values for a property as they are calculated
    after applying the cascade and inheritance but before the document is processed
    or rendered. Units like ems are calculated and turned into fixed values (pixels
    for most devices), paths to files are made absolute, and inherited values are
    inherited.

    - Used values: After all the values are calculated and the document is processed,
    the value of some other properties such as percentage or auto-based widths that
    rely on the dimensions of a parent element'
  - '[PAGE 32]


    to be known are calculated into their fixed-width equivalents. When these calculations
    are complete and the page is rendered, the resulting values are the used values.
    Though the naming is unfortunate, it is these used values that are encountered
    when scripting CSS through the getComputedStyle DOM API or viewing the computed
    tab in Firebug.


    +   - Actual values: After all the calculations are done and a browser has processed
    the document, there are some occasions where the used value cannot be rendered,
    so the browser must approximate the used value, creating the actual value. This
    can occur when a fractional pixel unit results from a calculation (50 percent
    of 99 pixels) or when a low-color-depth, monochrome display isn''t capable of
    rendering the exact color calculated.


    # Block, Inline, and Replaced Elements


    There are three main types of elements in HTML documents (a broad generalization)
    whose intended content types dictate their behavior in CSS and presentation. The
    elements that serve as containers for other content `<div>`, `<p>`, there are
    elements that differentiate types of text content (`<a>`, `<strong>`), and there
    are elements that refer to external content (`<img>`, `<object>`).


    Throughout this book the first type are block elements, the second type inline
    elements, and the last inline replaced elements.


    # Web Standards and Specifications


    The World Wide Web Consortium (W3C) along with other standards bodies such as
    WHATWG and IETF produce standards and specification documents for everything from
    CSS to the HTTP protocol that computers on the Internet use to communicate. You
    can find the specifications for CSS and HTML on the W3C web site at http://www.w3.org.'
  - '[PAGE 33]


    # The CSS Pocket Guide


    CSS2, CSS2.1, CSS3, Drafts, Recommendations, Ack!

    We''re at a moment in time when the state of the CSS “standard,” while active
    and exciting, can often be confusing. The W3C''s CSS Working Group consists of
    representatives from browser vendors and other technical experts who are actively
    writing and maintaining the specifications. At first look, there are a lot of
    specification documents, and they''re all at different points in the process.


    There are many states a specification moves through on its way to being finalized,
    gathering comments and test implementations along the way:


    +   * Working Draft: A Working Draft (WD) is the earliest definition of the specification.
    The document itself will often be loaded with notes, questions, or incomplete
    references. Working Drafts are useful to see what is ahead and for browser vendors
    to create test implementations. There will be certainly changes to the document
    and possibly to individual property definitions in the future because no consensus
    on the content of the document has yet been reached.


    +   * Last Call Working Draft: When issues, conflicts, and questions in the Working
    Draft are resolved, there is a Last Call (LC) comment period announced to solicit
    feedback on the draft.


    +   * Candidate Recommendation: After that Last Call period, a draft may move
    onto a Candidate Recommendation (CR), and the working group solicits test implementations
    from vendors to make sure what has been proposed is workable.


    +   * Proposed Recommendation: To be a Proposed Recommendation (PR), the specification
    is stable, and vendors have created interoperable implementations.


    +   * Recommendation: The bill has become a law—or a finalized Recommendation
    (R) as it were.'
  - '[PAGE 34]


    The process to make it to a Recommendation can be quite drawn out. Although CSS3
    is big on everyone''s mind, CSS 2.1 is just now ready to become a Proposed Recommendation,
    so it is sometimes hard to nail down by specification alone what is ready for
    you to spend time to or or use on a site.


    Here is where the various specifications are along that line and that you can
    start using today:


    +   - CSS2: CSS2 became a Recommendation in 1998. As a specification, it has been
    superseded by CSS2.1, though the term “CSS2” may be used to refer to either.

    - CSS2.1: As this book is being written in the later part of 2010, the CSS2.1
    specification is being reread for PR status. CSS2.1 made changes to CSS2 by updating
    technical descriptions and removing properties to better reflect implementation
    (or total lack of implementation) of the previous Recommendation.

    - CSS3: With CSS3, the specification has been split into modules as a way to control
    the complexity of any given piece of the large undertaking as well as provide
    user agents a clear means to carve out which areas they may not support due to
    technical limitations. Some modules are CRs with better support and implementations,
    and others have yet to be written.


    For the updated status of CSS2.1 and the various CSS3 modules, see http://www.w3.org/Style/CSS/current-work.
    And with all these specifications, CSS3 modules in particular, refer not just
    to the specification status but also to browser compatibility charts for implementation
    details on the various properties you may want to use.'
