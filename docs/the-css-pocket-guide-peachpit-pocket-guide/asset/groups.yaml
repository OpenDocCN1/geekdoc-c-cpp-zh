    block elements and inline elements, but you need a number of other element types
    to define all the content that might display on a web page, including the following:


    +   - inline: Creates one or more inline boxes, the familiar inline content

    - block: Creates a block box

    - inline-block: Creates a block box that behaves like an inline box, similar to
    the image (replaced element) behavior

    - list-item: Creates a block box for the content and the list item marker

    - table, table-row, table-caption: Creates three of the types of elements needed
    to present a table (Chapter 10)'
  - '[PAGE 108]


    +   - none: Removes the element from the presentation entirely, drawing box of
    any kind


    Alternating elements between the trio of inline, block, and none is sufficient
    for most design tasks, and as luck would have it, they are also the most widely
    supported values.


    # Position


    The positioning of an element is based on the length of the box offset parameters:
    top, right, bottom, and left. Typically, top and left will be used for positioning
    elements since the top-left corner of the item being measured from—the beginning
    of a box—is easily understood in normal document flows.


    # static


    static is the default value where an element is rendered in the normal flow and
    not uniquely positioned. The positioning parameters top, right, bottom, and left
    do not apply.


    # relative


    In relative positioning, an element’s position is calculated as normal, and then
    the offset positioning is applied relative to this normal position. Relative positioning
    does not take the element out of the normal flow, which leaves a space behind
    in the element’s original position.


    A relative positioned element with box offsets set to o (or undefined) will appear
    in its normal position; however, it will create a new point of origin for any
    of its child elements that may be positioned absolutely.'
  - "[PAGE 109]\n\n# absolute\n\nAbsolute positioning takes the element out of the\
    \ normal document flow—collapsing any space it may have otherwise used—and positions\
    \ it in relation to the origin point created by the last-positioned containing\
    \ block.\n\nThe code used for Figure 6.1 demonstrates how to use absolute-positioning\
    \ to place elements at the four corners of its containing element.\n\nFigure 6.1nElements\
    \ placed into four corners with absolute positioning.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_109_0.png)\n\
    \n```\ndiv {\n  position: relative;\n  width: 150px;\n  border: 1px dotted #999;\n\
    }\ndiv div {\n  position: absolute;\n  width: 25px;\n  height: 25px;\n  background-color:\
    \ #ccc;\n  border: none;\n  text-align: center;\n}\n```"
  - "[PAGE 110]\n\n```\ndiv .corner1 {\n  top: 0;\n  left: 0;\n}\ndiv .corner2 {\n\
    \  top: 0;\n  right: 0;\n}\ndiv .corner3 {\n  bottom: 0;\n  right: 0;\n  background-color:\
    \ #999;\n}\ndiv .corner4 {\n  bottom: 0;\n  left: 0;\n  background-color: #999;\n\
    }\n```\n\n```\n<\nHere is some content before the four child div elements.\n<div\
    \ class=\"corner1\">1</div>\n<div class=\"corner2\">2</div>\n<div class=\"corner3\"\
    >3</div>\n<div class=\"corner4\">4</div>\nHere is some content after the four\
    \ child div elements.\n</div>\n```\n\nWhen content is pulled out of the normal\
    \ document flow, the height of the parent element shrinks. It is easy to run into\
    \ cases where the parent shrinks too much and the positioned element overflows\
    \ its container. You can force the space open with height, width, or padding"
  - '[PAGE 111]


    on the parent element, as I have done in Figure 6.1. The document, being the root
    container, will similarly shrink, and you could potentially over-flow your document
    and its scrollable area.


    If the containing element isn''t forced open—in this case by width on the wide
    side and other content keeping it open in the vertical side—then the parent container
    would collapse. If the content were shorter and didn''t keep the box open enough,
    what you might see is shown in Figure 6.2.


    Figure 6.2

    A container element shrinking to fit only the content in the normal document flow.


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_111_0.png)


    Absolute positioning is the most used method of positioning an element (besides
    the default value of static) and is frequently used in animation; however, it
    isn''t used for many methods of creating layout grids because it doesn''t hold
    that scrollable area open like other methods.


    # fixed


    Fixed positioning is based on the viewport and not the document. The origin for
    fixed-positioned elements is the root node (<html>). The top-left position of
    o, o would be the top-left corner of the viewport, and similarly the bottom-right
    position of o, o is the bottom-right corner.


    As the name implies, fixed-positioned elements do not scroll with the rest of
    a document. Because window and viewport sizes vary widely (unless you''re developing
    for a specific device or platform such as the Apple iPhone, fixed positioning
    is most often used for small'
  - '[PAGE 112]


    elements such as toolbars or banners and not for laying out an overall web page.


    Fixed-positioned elements are widely supported in current browsers, but if you
    find you need to support older browsers as well, then you should use a bit of
    JavaScript code that will position the element absolutely and monitor the use
    of the scrollbar to change the positioning of the element keep it in view. This
    solution can be a little jumpy, so it''s best to use position: fixed where it
    is supported.


    # # Origins and Containing Blocks


    Containing blocks and the behavior of managing multiple possible origins for measuring
    positioning from can be one of the more confusing, but also more powerful, aspects
    of CSS.


    The root element of the document is the initial containing block for which absolute
    positioning is measured. However, if any other element is positioned—relatively,
    absolutely, or fixed in the viewport—it becomes the new origin for its descendant
    elements. This behavior is probably best illustrated with an example (Figure 6.3).


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_112_0.png)


    **Figure 6.3** The position of the black #innerPositionedBox is measured from
    its containing block.'
  - "[PAGE 113]\n\n```\ndiv {\n  border: 1px dotted #000;\n  padding: 20px;\n}\n#containingBlock\
    \ {\n  position: relative;\n}\n#innerPositionedBox {\n  position: absolute;\n\
    \  top: 0;\n  left: 0;\n  background-color: #000;\n}\n[...]\n<div id=\"containingBlock\"\
    >\n  <div>\n    <div>\n      <div id=\"innerPositionedBox\">\n      </div>\n \
    \   </div>\n  </div>\n</div>\n```\n\nRegardless of how deeply the element #innerPositionedBox\
    \ is nested, the positioning for top and left is measured from the last positioned\
    \ ancestor, #containingBlock. If you didn't change the CSS code for this example\
    \ altered the markup structure slightly so that one of the middle <div> elements\
    \ is #containingBlock, then the #innerPositionedBox element would instead use\
    \ that element for its origin (Figure 6.4)."
- md: "\n# Chapter 6: Positioning and Floats\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_114_0.png)\n\
    \n```html\n<div>\n  <div id=\"containingBlock\">\n    <div>\n      <div id=\"\
    innerPositionedBox\">\n      </div>\n    </div>\n  </div>\n</div>\n```\n\nSince\
    \ you cannot escape this behavior and position an element with respect to the\
    \ root element once it has a different containing block defined, it is important\
    \ not to overuse positioning properties, thus needlessly creating new containing\
    \ blocks. Sometimes this is inescapable, and in those cases math can be your friend\
    \ (either with paper and pencil or in code via JavaScript)—you can calculate the\
    \ position of the containing block (and any of its containing blocks) and work\
    \ your way back up to the root element.\n\n## z-index\n\nThe z-index property\
    \ applies to any positioned box and can be used to control the layering of boxes\
    \ from back to front. The higher the integer value, the “closer” to the viewer\
    \ element appears.\n\nThink of this index as controlling the elements of a stage\
    \ set in the theater. The background elements are at the position, the actors\
    \ and other elements may shuffle between 1 and 20, and the foreground set pieces\
    \ and the curtain are between 21 and 25 (though there is no limit to this value).\
    \ What happens if two elements in the same stack are at an index of 11 (or auto?)\
    \ This isn't a problem unless each element’s positioning properties cause them\
    \ to overlap. In this case, the element specified later in the document flow will\
    \ appear on top.\n\nThis index, like positioning offsets, is relative to the containing\
    \ block. If one element has a z-index of 4 and another element has a z-index of\
    \ 3, none of the second element’s children can ever appear “above” the content\
    \ of the former element.\n\n> note: Some plug-in content such as Adobe Flash can\
    \ sometimes bleed through HTML content positioned above it and given a higher\
    \ z-index. For Flash, in particular, there is a window mode parameter called wmode\
    \ that when set to opaque or transparent will allow content to appear above it\
    \ in the stack.\n\n## visibility\n\nThe visibility property determines whether\
    \ an element renders and can be seen. Unlike setting the display property to none,\
    \ an element with a visibility of hidden still affects layout and will take up\
    \ space. Unlike the opacity property, individual descendants of a hidden element\
    \ can be shown by setting their visibility to visible.\n\n- visible: The element\
    \ is rendered.\n- hidden: The element is not rendered.\n\n## float\n\nAn element\
    \ with a float value of left or right is taken out of the normal flow of a document\
    \ and shifted to one side of the containing box. The content that follows it in\
    \ the document wraps around the floated element's new position.\n\n- none: An\
    \ element is not floated and behaves as normal.\n- left: An element is taken out\
    \ of the normal flow and is shifted to the left of where it would otherwise appear,\
    \ with content flowing around it on the right side of the element.\n- right: An\
    \ element is taken out of the normal flow and is shifted to the right of where\
    \ it would otherwise appear, with content flowing around it on the left side of\
    \ the element.\n\nThink of a small photo that is moved to the right and has text\
    \ flowing around it; you now have the basic idea of how an element (the photo)\
    \ behaves when floated (Figure 6.5 on the next page).\n\nFigure 6.5\nTwo elements\
    \ floated inside text content.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_117_0.png)\n\
    \nMargins and padding set on a floated element behave as they would on any box\
    \ in the standard box model and can be used to create a gutter around that element.\
    \ However, floating has the effect of interrupting the boxes of the wrapping elements\
    \ leaving their padding, margins, or borders drawn in their normal rectangle,\
    \ as shown in Figure 6.6, rather than moved or redrawn for each individual row\
    \ of text. Note the way the text touches the right edge of the floated image in\
    \ this example.\n\nFigure 6.6\nText wrapped around a floated element.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_117_1.png)\n\
    \n```css\nimg {\n  float: left;\n}\np {\n  border: 5px solid #666;\n}\n```\n\n\
    # Chapter 6: Positioning and Floats 95\n\n```css\npadding: 15px;\nbackground:\
    \ #ccc;\n\n[...]\n```\n\n<img src=\"images/1.png\" width=\"67\" height=\"67\"\
    \ alt=\"1\" />\n<p>Here is some text after a left floated image for illustration\
    \ purposes. Lorem dolor sit amet, consectetur adipisicing elit.</p>\n\nAdding\
    \ a 20-pixel margin around the floated element would create a gutter between the\
    \ opposite side of the floated element and the content wrapping around it (Figure\
    \ 6.7). After doing this, it is also obvious how the rectangular box drawn by\
    \ the paragraph including its border and background color are not “wrapping.”\
    \ Only the content inside of those blocks is wrapping.\n\nFigure 6.7\nA margin\
    \ placed on the floated element to create space between it and the content wrapped\
    \ around it.\n\n| Column | Content |\n|---|---|\n| 1 | Here is some text after\
    \ a left floated image for illustration purposes. Lorem dolor sit amet, consectetur\
    \ adipisicing elit. |\n\n```css\nimg {\n  float: left;\n  margin: 20px;\n}\n```\n\
    \nIf multiple elements are floated and would appear along the same edge, then\
    \ they are arranged horizontally with the earliest element in the source appearing\
    \ closest to the containing block's edge. If the combined width of the floated\
    \ elements becomes too wide for the containing block's content area, then the\
    \ later floated elements will wrap. This behaves a bit less like the normal flow\
    \ of text from line to line and more how marbles of different sizes will settle\
    \ as they are placed in a cup. Elements of various sizes are left floated in Figure\
    \ 6.8 and right floated in Figure 6.9 to illustrate the behaviors.\n\nFigure 6.8\n\
    Left-floated blocks of various sizes.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_119_0.png)\n\
    \nFigure 6.9\nRight-floated blocks of various sizes.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_119_1.png)\n\
    \n# Chapter 6: Positioning and Floats\n\nFloated elements cannot appear before\
    \ (vertically) elements that come before them in the document, which is why box\
    \ 4 does not appear next to box 2 even if there were room for it.\n\nWith modern\
    \ layout techniques, floated elements are used for much more than small bits of\
    \ content in text wrapping. They can be the basis for placing elements on opposite\
    \ sides of the same line, controlling a series of tabs, and even controlling multiple-column\
    \ layout grids.\n\nIf an element is positioned with absolute positioning, that\
    \ positioning will take precedence over the behavior of float.\n\n## clear\n\n\
    Floating is often used instead of positioning or large margins because the content-wrapping\
    \ effects are desired, but the wrapping of a tall floated element can often extend\
    \ into later content in an undesirable way. The clear property is used to insert\
    \ a break when encountering a new section of the layout or another unique record\
    \ in a list or some other reason for wanting to stop the wrapping.\n\n- none:\
    \ The element does not clear any floats.\n- left: The element will be shifted\
    \ down to sufficiently clear the bottom edge of any left-floated elements.\n-\
    \ right: The element will be shifted down to sufficiently clear the bottom edge\
    \ of any right-floated elements.\n- both: The element will be shifted down to\
    \ clear and begin after all floated elements.\n\nFigure 6.10 you can see what\
    \ happens when the floated element from one list item bleeds into the following\
    \ one; things really start to go haywire.\n\nFigure 6.10\nThe effect of floated\
    \ elements extending past its parent element into the following content.\n\n|\
    \ Column | Content |\n|---|---|\n| 1 | Here is some text associated with the first\
    \ list item |\n| 2 | Here is some text associated with the second list item |\n\
    | 3 | Here is some text associated with the third list item |\n\n```css\nli {\n\
    \  border: 1px solid #000;\n}\nimg {\n  float: left;\n  margin-right: 0.5em;\n\
    }\n```\n```\n\n+   <ul>\n  <li><img src=\"images/1.png\" width=\"67\" height=\"\
    67\" alt=\"1\" />\n    <p>Here is some text associated with the first list item</p>\n\
    \  </li>\n  <li><img src=\"images/2.png\" width=\"67\" height=\"67\" alt=\"2\"\
    \ />\n    <p>Here is some text associated with the second list item</p>\n  </li>\n\
    </ul>\n"
