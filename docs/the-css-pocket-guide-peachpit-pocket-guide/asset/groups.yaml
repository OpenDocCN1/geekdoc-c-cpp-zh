  - "[PAGE 129]\n\n# 106 The CSS Pocket Guide\n\n# Faux Columns\n\nIn the previous\
    \ float example, you'll notice that the height of the left element is shorter\
    \ than the right. If you were to place a background color or image on this element,\
    \ it wouldn't extend past this element to cover the entire left gutter or column.\
    \ A background image on the containing element will continue through the whole\
    \ space, so use that opportunity to apply a background image to provide the appearance\
    \ of full-height columns. The left column in Figure 7.3 is an example of this\
    \ faux column technique.\n\nFigure 7.3: Background image on the container element\
    \ providing the appearance of a column that extends past the content.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_129_0.png)\n\
    \n```\n.container {\n  padding: 5px;\n  border: 1px solid black;\n  background:\
    \ url(images/bg_faux_columns.png) repeat-y\n}\n-> top {\n}\n.main {\n  height:\
    \ 200px;\n  margin-left: 110px;\n  border: 1px solid black;\n}\n.floated {\n \
    \ float: left;\n  height: 150px;\n```"
  - "[PAGE 130]\n\n```\nwidth: 98px;\nborder: 1px solid black;\n}\n[...]\n<div class=\"\
    container\">\n  <div class=\"floated\">\n    .floated\n  </div>\n  <div class=\"\
    main\">\n    .main\n  </div>\n</div>\n```\n\nBackground images don't have to be\
    \ used for clean rectangular columns either. Any parent element right up to the\
    \ document body is a great hook for applying diagonals, ribbons, waves, or some\
    \ other graphical appearance that flows between the “physical” boundaries blocks\
    \ or columns of a page.\n\n# Layering Background Images\n\nIt is often the case\
    \ that background images don't cleanly tile or they tile for most of any given\
    \ direction but then break or shift when interacting with a content element. Imagine\
    \ implementing a design that has some background elements that repeat horizontally,\
    \ different ones that repeat vertically, some that don't repeat at all, and one\
    \ that repeats in both directions. An inefficient solution would be to make 10,000\
    \ by 10,000 pixel graphic and hope a browser gets bigger than that.\n\nA more\
    \ flexible and efficient solution is to deconstruct the background into smaller\
    \ pieces and then find the element that is best suited to which to apply each\
    \ background image. The example in Figure 7.4 (on the next page) uses the html,\
    \ body, and two other elements to overlay four separate graphical pieces."
  - "[PAGE 131]\n\n# 108 The CSS Pocket Guide\n\nFigure 7.4\nA composite of four separate\
    \ background images working in coordination.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_131_0.png)\n\
    \n```\nhtml { /* #1 */\n  margin: 0; padding: 0;\n  background: #fff url(images/fourbg_html.png)\
    \ repeat;\n}\nbody { /* #2 */\n  margin: 0; padding: 0;\n  background: url(images/fourbg_body.png)\
    \ repeat-x left top;\n}\ncontainer { /* #3 */\n  width: 400px;\n  height: 500px;\n\
    \  margin: 0 auto;\n  padding: 0;\n  background: url(images/fourbg_container.png)\
    \ repeat-y left\ntop;\n}\nmasthead { /* #4 */\n  height: 100px;\n  background:\
    \ url(images/fourbg_masthead.png) no-repeat left\ntop;\n]\n```"
- md: "\nCSS3 includes support for multiple background images on a single element,\
    \ which provides quite a few more options for layering images.\nSee Chapter 14.\n\
    \n## Inline and Floated List Items\n\nAll types of content in a document can be\
    \ described in lists. Quite often, as is the case for many navigation bars, tabs,\
    \ and image thumbnails, these structural lists aren't presented as a bulleted\
    \ list but in a horizontal format. The following code shows a basic example of\
    \ text-based navigational elements with vertical separators (Figure 7.5).\n\n\
    | First Page | Second Page | Third Page | Fourth Page | Fifth Page |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n\n**Figure 7.5** A set of navigation-based list\
    \ items floated into a horizontal format.\n\n```css\nul.nav {\n  height: 16px;\n\
    }\nul.nav li {\n  float: left;\n  height: 16px;\n  padding: 0 0.5em;\n  font-size:\
    \ 12px;\n} (continues on next page)\n```\n\n```css\nlist-style: none;\nborder-left:\
    \ 2px solid black;\n}\nl.nav li:first-child {\n  border-left: 0; /* remove border\
    \ from outside item */\n}\n[...]\n<ul class=\"nav\">\n  <li><a href=\"#\">First\
    \ Page</a></li>\n  <li><a href=\"#\">Second Page</a></li>\n  [...]\n</ul>\n```\n\
    \n## Using Positioning to Escape Containers\n\nThough the goal of the relatively\
    \ positioned content blocks described earlier was to create a self-contained area\
    \ from which to work from, it can be useful to position the parts of those blocks\
    \ to break out of the four sides of that container. Negative margins were discussed\
    \ in Chapter 5, but here negative values for positioning are also useful, as demonstrated\
    \ in the following example (Figure 7.6).\n\nFigure 7.6\nNegatively positioned\
    \ element breaking its container.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_133_0.png)\n\
    \n```css\narticle {\n  position: relative;\n  [...]\n  margin-left: 50px;\n  border:\
    \ 1px solid black;\n}\narticle time {\n  position: absolute;\n  top: 10px;\n \
    \ left: -50px;\n  [...]\n  background: url(images/flag.png) no-repeat right top;\n\
    }\n<article>\n  <time>13th</time>\n</article>\n```\n\n## Overlays, Tooltips, and\
    \ Drop-Down Menus\n\nTooltips, drop-down menus, and overlays can be coded in a\
    \ similar fashion as the example shown earlier in Figure 7.6. The difference with\
    \ these types of elements is that they typically start as hidden and then through\
    \ interaction change presentation.\n\nChapter 14 of The JavaScript Pocket Guide\
    \ by Lenny Burdette (Peachpit, 2010) covers drop-down navigation in depth and\
    \ includes the following code, which changes the state of the positioned submenu\
    \ list.\n\n```css\n#menu li ul {\n  position: absolute;\n  display: none;\n  left:\
    \ 0;\n}\n[...]\n#menu li:hover ul {\n  display: block;\n}\n```\n\n## Hiding Elements:\
    \ display vs. visibility\n\nTwo ways hiding content can be accomplished are via\
    \ the two properties display:none and visibility:hidden. In the case of the visibility\
    \ property, the content continues to occupy the space in the document flow that\
    \ it would normally. For the display property, since the element is no longer\
    \ a block, inline, or other type, it is removed from the document flow as if it\
    \ didn't exist. Unless holding that space open for laying out other elements or\
    \ maintaining its properties such as height and width is important for other feature\
    \ of the page (like in some JavaScript interactions), display is typically used.\n\
    \n## Multicolumn CSS Layouts\n\nYou can use all the tools described in the “Building\
    \ Blocks of CSS Layouts” section of this chapter for creating the main layout\
    \ grid for handling the header, footer, and content areas of the page.\n\nThe\
    \ most common approach, because of its flexibility with regard to content lengths,\
    \ source order, and markup structure, is to use some variation of the “float into\
    \ margins”.\n\n### A Two-Column Layout\n\nIf you were to make the .main and .floated\
    \ blocks earlier in the chapter (Figure 7.3) wide enough, then you have a two-column\
    \ layout. That’t all there is to do, because that example has two points of failure:\n\
    \n- If the sidebar column is taller than the main content area, it will escape\
    \ the bottom bounds of the container and force the wrapping of the footer.\n-\
    \ The code provided requires the floated element to appear before the main content\
    \ area, which may be undesirable.\n\nBoth problems can be solved with minor changes,\
    \ as the following example demonstrates (Figure 7.7).\n\nFigure 7.7 The results\
    \ of changes to the earlier two-column layout.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_136_0.png)\n\
    \n```css\n.container {\n  width: 534px;\n  padding: 5px;\n  border: 1px solid\
    \ black;\n  background: url(images/bg_faux_columns.png) repeat-y left\n  overflow:\
    \ auto;\n}\n.main {\n  float: right;\n  height: 200px;\n  width: 420px;\n  margin-left:\
    \ 0;\n  border: 1px solid black;\n}\n.sidebar {\n  /* renamed, again, for clarity\
    \ */\n  float: left;\n  height: 220px;\n  width: 98px;\n  border: 1px solid black;\n\
    }\n[...]\n<div class=\"container\">\n  <div class=\"main\">\n    .main\n  </div>\n\
    \  <div class=\"sidebar\">\n    .sidebar\n  </div>\n</div>\n```\n\n## Wrapping\
    \ Floated Columns with overflow:auto, overflow:hidden, or .clearfix\n\nYou've\
    \ seen that when tall elements get pulled out of the document flow, their containing\
    \ element collapses to the height of the remaining content (if any). This is often\
    \ undesirable that container is intended to be a self-contained content item.\
    \ There are two ways to prevent this behavior. You can either hold the container\
    \ by clearing the float with a nonfloating element at the end of the block or\
    \ force it to grow to include all its contents.\n\nYou can accomplish the first\
    \ by adding additional markup such as <div style=\"clear:both\"></div> before\
    \ the end of the container. Littering documents with presentation markup should\
    \ be avoided, and so generated content is often used to emulate this clearing\
    \ behavior. Full explanations of this technique, often applied by styling a utility\
    \ called clearfix, is described at Position Everything (http://www.positioneverything.net/easyclearing).\n\
    \nA side effect of setting the overflow property on an element to auto or hidden\
    \ is that the element should encompass all of its content, regardless of whether\
    \ that content is floated. In the case of an auto height on the container, it\
    \ will spring back and expand to cover even floated. This more elegant solution\
    \ to the float clearing problem, as well as a number of other techniques, is covered\
    \ in a follow-up to the PI article by Alex Walker on Sitepoint (http://www.sitepoint.com/blogs/2005/02/26/simple-clearing-of-floats/).\n\
    \n## Two Columns with Right Sidebar\n\nYou've now seen examples of a two-column\
    \ layout where the first or second column appears on the left. Creating a sidebar\
    \ on the right just means putting these pieces together and getting the widths\
    \ and spacing settled. Don't forget to swap the background image as well! The\
    \ following code shows changes from the code used in the Figure 7.7 example to\
    \ place the .sidebar element on the right:\n\n```css\n.container {\n  width: 534px;\n\
    \  padding: 5px;\n  border: 1px solid black;\n  background: url(images/bg_faux_columns.png)\
    \ repeat-y right-top;\n  overflow: auto;\n}\n```\n\n```css\nmain {\n  float: left;\n\
    \  height: 200px;\n  width: 420px;\n  margin-left: 0;\n  border: 1px solid black;\n\
    }\n.sidebar {\n  float: right;\n  height: 220px;\n  width: 98px;\n  border: 1px\
    \ solid black;\n}\n```\n\n## A Three-Column Layout\n\nYou can easily extend the\
    \ previous two-column layout to incorporate a margin wide enough to float two\
    \ of the three columns into. However, the size of the main column or the source\
    \ order may dictate that a different arrangement is needed. Here is some trickery\
    \ with floating and negative margins to get small left and right columns and allow\
    \ the main content area to be first in the document (Figure 7.8).\n\nFigure 7.8\n\
    A three-column, fixed-width layout.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_140_0.png)\n\
    \n```css\n.container {\n  width: 534px;\n  padding: 5px;\n  border: 1px solid\
    \ black;\n  background: none;\n  overflow: auto;\n}\n.main {\n  float: left;\n\
    \  height: 200px;\n  width: 318px; /* narrower to fit new element and gutter */\n\
    \  margin-left: 107px; /* make room for left column */\n  border: 1px solid black;\n\
    }\n.left_sidebar { /* renamed, again, for clarity */\n  float: left;\n}\n```\n\
    \n(continues on next page)\n"
  mdcn: "\nCSS3 支持在单个元素上使用多个背景图像，这为图像分层提供了更多选项。\n请参见第 14 章。\n\n## 行内与浮动列表项\n\n文档中的所有类型内容都可以通过列表描述。很多时候，就像导航栏、标签页和图像缩略图，这些结构化列表并不是以符号列表的形式呈现，而是采用水平格式。以下代码展示了带有垂直分隔符的文本导航元素的基本示例（图\
    \ 7.5）。\n\n| 第一页 | 第二页 | 第三页 | 第四页 | 第五页 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n\n**图 7.5** 一组浮动为水平格式的导航列表项。\n\n```css\nul.nav {\n  height: 16px;\n}\nul.nav\
    \ li {\n  float: left;\n  height: 16px;\n  padding: 0 0.5em;\n  font-size: 12px;\n\
    } (接下页)\n```\n\n```css\nlist-style: none;\nborder-left: 2px solid black;\n}\n\
    l.nav li:first-child {\n  border-left: 0; /* 移除外部项的边框 */\n}\n[...]\n<ul class=\"\
    nav\">\n  <li<a href=\"#\">第一页</a></li>\n  <li><a href=\"#\">第二页</a></li>\n  [...]\n\
    </ul>\n```\n\n## 使用定位跳出容器\n\n虽然之前描述的相对定位内容块的目标是创建一个自包含的区域以便工作，但对这些块的局部进行定位以突破容器的四个边界可能是很有用的。第\
    \ 5 章讨论了负边距，但在这里，定位的负值也很有用，如下例所示（图 7.6）。\n\n图 7.6\n突破其容器的负值定位元素。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_133_0.png)\n\
    \n```css\narticle {\n  position: relative;\n  [...]\n  margin-left: 50px;\n  border:\
    \ 1px solid black;\n}\narticle time {\n  position: absolute;\n  top: 10px;\n \
    \ left: -50px;\n  [...]\n  background: url(images/flag.png) no-repeat right top;\n\
    }\n<article>\n  <time>13th</time>\n</article>\n```\n\n## 覆盖层、提示框和下拉菜单\n\n提示框、下拉菜单和覆盖层可以使用与图\
    \ 7.6 所示类似的方式进行编码。这类元素的区别在于，它们通常初始为隐藏，然后通过交互改变显示方式。\n\nLenny Burdette 所著《JavaScript\
    \ Pocket Guide》（Peachpit, 2010）第 14 章深入讲解了下拉导航，并包含了以下代码，该代码更改了定位子列表的状态。\n\n```css\n\
    #menu li ul {\n  position: absolute;\n  display: none;\n  left: 0;\n}\n[...]\n\
    #menu li:hover ul {\n  display: block;\n}\n```\n\n## 隐藏元素：display vs. visibility\n\
    \n隐藏内容的两种方式可以通过两个属性 `display:none` 和 `visibility:hidden` 实现。在 `visibility` 属性的情况下，内容继续占据文档流中正常占据的空间。对于\
    \ `display` 属性，由于元素不再是块级、行内或其他类型，它会被从文档流中移除，就像它不存在一样。除非保留该空间以布局其他元素或保持高度和宽度等属性对页面的其他功能很重要（例如在某些\
    \ JavaScript 交互中），通常使用 `display`。\n\n## 多列布局\n\n你可以使用本章“构建布局块”部分中描述的所有工具来创建页眉、页脚和内容区域的主网格。\n\
    \n由于内容长度、顺序和标记结构的灵活性，最常用的方法是使用浮动边距的某种变体。\n\n### 双列布局\n\n如果你让本章之前的 `.main` 和 `.floated`\
    \ 块（图 7.3）足够宽，你就得到了双列布局。这并不够了，因为该示例有两个缺陷：\n\n- 如果侧边栏比主内容区域高，它将超出容器边界并强制包裹页脚。\n\
    - 代码要求浮动元素出现在内容区域之前，这可能是不需要的。\n\n这两个问题可以通过微调来解决，如下例所示（图 7.7）。\n\n图 7.7 对之前的双列布局修改的结果。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_136_0.png)\n\n```css\n.container {\n\
    \  width: 534px;\n  padding: 5px;\n  border: 1px solid black;\n  background: url(images/bg_faux_columns.png)\
    \ repeat-y left\n  overflow: auto;\n}\n.main {\n  float: right;\n  height: 200px;\n\
    \  width: 420px;\n  margin-left: 0;\n  border: 1px solid black;\n}\n.sidebar {\n\
    \  /* 为了清晰再次命名 */\n  float: left;\n  height: 220px;\n  width: 98px;\n  border:\
    \ 1px solid black;\n}\n[...]\n<div class=\"container\">\n  <div class=\"main\"\
    >\n    .main\n  </div>\n  <div class=\"sidebar\">\n    .sidebar\n  </div>\n</div>\n\
    ```\n\n## 使用 overflow:auto, overflow:hidden 或 .clearfix 包裹浮动列\n\n你已经看到当高元素被拉出文档流时，它们的容器元素会塌陷到剩余内容的高度（如果有）。如果容器旨在是一个自包含项，这通常是不需要的。防止这种行为有两种方法：可以在块末尾使用非浮动元素清除容器，或者强制其增长以包含所有内容。\n\
    \n你可以通过在容器结束前添加额外的标记如 `<div style=\"clear:both\"></div>` 来实现前者。应避免充斥展示性标记，因此通常使用生成的内容来模拟这种清除行为。这种名为\
    \ `clearfix` 的技术的详细解释在 Position Everything (http://www.positioneverything.net/easyclearing)\
    \ 中描述。\n\n将元素的 `overflow` 属性设置为 `auto` 或 `hidden` 的副作用是元素应该包含所有内容，无论该内容是否浮动。在容器高度为\
    \ `auto` 的情况下，它会回弹并扩展以覆盖浮动内容。这种更优雅的浮动清除解决方案以及其他技术在 Sitepoint 的后续文章（http://www.sitepoint.com/blogs/2005/02/26/simple-clearing-of-floats/）中介绍。\n\
    \n## 带右侧边栏的双列布局\n\n你现在已经看到了第一列或第二列出现在左侧的双列布局示例。在右侧创建侧栏只需将这些部分组合并确定宽度和间距。别忘记切换背景图像！以下代码显示了对图\
    \ 7.7 示例代码的修改，将 `.sidebar` 元素放在右侧：\n\n```css\n.container {\n  width: 534px;\n\
    \  padding: 5px;\n  border: 1px solid black;\n  background: url(images/bg_faux_columns.png)\
    \ repeat-y right-top;\n  overflow: auto;\n}\n```\n\n```css\nmain {\n  float: left;\n\
    \  height: 200px;\n  width: 420px;\n  margin-left: 0;\n  border: 1px solid black;\n\
    }\n.sidebar {\n  float: right;\n  height: 220px;\n  width: 98px;\n  border: 1px\
    \ solid black;\n}\n```\n\n## 三列布局\n\n你可以轻松扩展之前的双列布局，包含一个足够宽的边距以浮动三列中的两列。然而，主列的大小或顺序可能决定需要不同的排列。这里使用了一些浮动和负边距的技巧，以获得较小的左右列，并允许主内容区域位于文档最前面（图\
    \ 7.8）。\n\n图 7.8\n固定宽三列布局。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_140_0.png)\n\
    \n```css\n.container {\n  width: 534px;\n  padding: 5px;\n  border: 1px solid\
    \ black;\n  background: none;\n  overflow: auto;\n}\n.main {\n  float: left;\n\
    \  height: 200px;\n  width: 318px; /* 为了适应新元素和间隙而变窄 */\n  margin-left: 107px;\
    \ /* 为左列留出空间 */\n  border: 1px solid black;\n}\n.left_sidebar { /* 再次命名 */\n \
    \ float: left;\n}\n```\n"
