    \ /* 用于 Firefox */\n  -moz-box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* Safari 和 Chrome */\n  -webkit-box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* W3C 规范 */\n  box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n}\n```\n\
    \n```\n[...]\n<div class=\"one\">\n  具有锐利内投影影的框\n</div>\n```\n\n```\n<div class=\"\
    two\">\n  具有大模糊内投影影的框\n</div>\n```\n\n图 14.2\n带模糊半径和不带模糊半径的内盒投影示例。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_258_0.png)\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_258_1.png)\n\n`box-shadow` 属性在 Firefox\
    \ 3.5+、Safari 3.0+、Chrome 1+、Opera 10.5+ 以及 Internet Explorer 4+ 中均支持阴影定义，但旧版本不支持\
    \ `inset` 关键字。关于如何在 IE6 到 IE8 中使用 `box-shadow` 属性和私有的 `filter` 扩展创建跨浏览器投影的更多信息，请查看我的博客文章。\n\
    \n## background-size 属性\n\n在 CSS 2.1 之前，背景图像以默认大小显示。如果你想在元素后面有一个图像，要么确保图像的大小与元素匹配，要么使用一些技巧将图像放在具有较低\
    \ `z-index` 值的 `div` 中并调整大小。\n\n但现在图像可以使用 `background-size` 属性进行缩放或调整大小，它接受两个值：第一个用于水平尺寸，第二个用于垂直尺寸（如果只给一个，则第二个假设为\
    \ `auto`）。\n\n- `auto`: 调整图像尺寸以保持其原始宽高比；如果两个值都是 `auto`，图像按正常大小显示。\n- `<percentage>`:\
    \ 将图像的大小调整为元素（而非图像）背景区域的百分比。\n- `<length>`: 将图像的大小调整为指定的长度。\n\n图 14.3 演示了使用 `<percentage>`\
    \ 和 `<length>` 的 `background-size` 属性。\n\n```css\ndiv.one {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n}\ndiv.two {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n  /* 用于 Firefox 3.6 */\n  -moz-background-size: 100% 50px;\n  /*\
    \ 用于 Safari 和 Chrome */\n  -webkit-background-size: 100% 50px;\n  /* 用于 Opera\
    \ */\n  -o-background-size: 100% 50px;\n  /* W3C 规范 */\n  background-size: 100%\
    \ 50px;\n}\n```\n\n```css\ndiv.three {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n}\n```\n\n```css\n/* 用于 Firefox 3.6 */\n-moz-background-size: 100%;\n\
    /* 用于 Safari 和 Chrome */\n-webkit-background-size: 100%;\n/* 用于 Opera */\n-o-background-size:\
    \ 100%;\n/* W3C 规范 */\nbackground-size: 100%;\n```\n\n<div class=\"one\">\n  无设置大小的背景\n\
    </div>\n<div class=\"two\">\n  background-size 设置为 100% 50px 的背景\n</div>\n<div\
    \ class=\"three\">\n  background-size 设置为 100% 的背景\n</div>\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_0.png)\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_1.png)\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_2.png)\n\
    \n## CSS 指南\n\n作为组合值的替代方案，关键字 `contain` 和 `cover` 描述了背景填充空间的行为。\n\n- `contain`:\
    \ 图像尺寸尽可能大以便包含在元素内；如果图像的宽高比与背景区域不一致，则其中一边为 100%，另一边小于长度。\n- `cover`: 调整图像尺寸使其放大（或缩小）以完全填充区域；如果图像的宽高比与背景区域不一致，则其中一边为\
    \ 100%，另一边大于长度。\n\n```css\ndiv {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n  /* 用于 Firefox 3.6 */\n  -moz-background-size: cover;\n  /* 用于\
    \ Safari 和 Chrome */\n  -webkit-background-size: cover;\n  /* 用于 Opera */\n  -o-background-size:\
    \ cover;\n  /* W3C 规范 */\n  background-size: cover;\n}\n```\n\n```css\ndiv.three\
    \ {\n  background: url(images/background_sizing.png);\n  no-repeat;\n  /* 用于 Firefox\
    \ 3.6 */\n  -moz-background-size: contain;\n  /* 用于 Safari 和 Chrome */\n  -webkit-background-size:\
    \ contain;\n  /* 用于 Opera */\n  -o-background-size: contain;\n  /* W3C 规范 */\n\
    \  background-size: contain;\n}\n```\n\n```css\ndiv {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n}\n```\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_262_0.png)\n\
    \n# 第14 章：CSS 并不遥远的未来\n\n图 14-5\n带有三种颜色的线性渐变。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_264_0.png)\n\
    \n## 框图像\n\n使用 `border-image` 属性，基于图像的灵活框可以替换标准的框。这是通过将框区域划分为九段网格来实现，代表框区域的每个角和每个边，如图\
    \ 14.6 所示。单个图像文件同样被切分成九部分，并映射到框区域的每个区域以及容器的中心。\n\n"
