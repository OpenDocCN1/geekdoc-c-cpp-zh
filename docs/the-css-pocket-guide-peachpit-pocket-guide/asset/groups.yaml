    and they don''t appear to look “broken."'
- md: '

    ## F-Grade Browsers


    For the purposes of development, testing, and ongoing support, it may be useful
    to explicitly state which browsers or configurations will not be supported. Visitors
    with older browsers such as Netscape 6, Internet Explorer 5, or older mobile devices
    are F-grade browsers that will just get what they get and have to make due.


    ## X-Grade Browsers


    X-grade browsers are assumed to fall into the A-grade category but because of
    a small share of your user base or similarities to browsers already listed as
    A-grade, they aren''t on your radar or testing matrix. Older point releases, Linux
    versions, or alternate UI browsers such as Camino or Flock that use the same rendering
    engines as A-grade browsers fit in this category.


    ## A+-Grade Browsers


    It is increasingly useful to have an extra category called A+-grade browsers defined
    to allow for some extra flair above and beyond the A-grade category. New CSS3
    features such as rounded corners, animations, or transitions can be used to enhance
    the experience for some visitors while not being central to the site''s design.


    ## CSS Support via JavaScript


    When you want to use the latest and greatest coding techniques on your web site
    and when your business needs or your user base dictates that you need an A- or
    B-grade level of support for a browser that otherwise isn''t up to the task, it
    is common to use drop-in JavaScript libraries to bridge support or implement alternative
    methods of achieving a similar visual effect. This is a great way to ensure support
    for rounded corners via border-radius (Chapter 8) or make sure all of your selectors
    are understood.


    I discuss specific examples of this type of script in Chapter 13.


    ## A Practical Strategy


    > There are many factors that go into how a web page appears to a visitor—so many
    that it can be overwhelming if you attempt to understand and control them all.
    It is important to remember that ultimately it is your visitor and not you who
    is in control of their browsing experience. The only way to stay on budget, to
    stay on time, and to stay sane is to figure out what is important to make your
    site shine, then pick a method or methods to get you close to your goal in the
    most possible scenarios, and finally get comfortable with letting the rest go.


    ## Selectors


    You use selectors to define the elements on a page that you want to apply certain
    properties to. Elements in the document can be matched based on the HTML tag used,
    based on class or ID attributes, based on the relationship to other elements,
    or based on the current status in the document. You can also combine simple selectors
    to form a chain of conditions that must be met before the style rule is applied.


    ## E (Type Selectors)


    The type selector selects an element by its type.


    ```

    h1 {} /* selects all h1 elements */

    form {} /* selects all form elements */

    ```


    ## * (Universal Selector)


    The universal selector matches any element type in the document. It is implied
    if there is a sequence of other simple selectors and no specific type selector
    is present.


    - * {} /* selects all elements in a document */

    - *.thumb {} /* selects all elements with class thumb [see Class Selector below]
    */

    - .thumb {} /* same as previous, * is implied */


    ## #id (ID Selector)


    The ID selector matches any element with the specified value as the ID attribute.


    ```

    #header {} /* selects the element with the ID of header */

    *#header {} /* same as previous */

    div#footer {} /* selects the div element with class footer */

    ```


    ## .class (Class Selector)


    The class selector matches elements with the specified class name. For elements
    whose class attribute contains multiple space-separated words, the class selector
    will select an element if *any* of those words match the specified class name.


    ```

    .help {} /* matches all elements with a class of help */

    img.thumbnail {} /* matches image elements with class of thumbnail */

    ```


    ## Attribute Selectors


    In addition to id and class attributes, any attribute can be used for selection
    via attribute selectors.


    ## [att]


    Selects elements with the attribute att, regardless of the attribute''s value.


    ```

    input[required] {} /* matches html5 input elements with the required attribute
    */

    ```


    ## [att=val]


    Selects elements with the attribute att with the value equal to val.


    ```

    a[rel=tag] {} /* matches anchors with the rel attribute equal to tag */

    ```


    ## [att~=val]


    Selects elements with the attribute att whose value includes the word val in its
    space-delimited list of words. (Think multiple class names).


    ```

    a[rel~=friend] {} /* matches anchors with copyright as one many words in the rel
    attribute. For example, XFN''s rel="met friend". */

    ```


    ## [att|=val]


    Selects elements with the attribute att whose value equals val or begins with
    val followed by the separator -. This is intended to be used to match the language
    subcode for the hreflang attribute.


    ```

    *[hreflang=en] {} /* matches all elements with hreflang en-us, en-au, and en-gb
    */

    ```


    ## [att^=val]


    Selects elements with the attribute att whose value begins with val. Added in
    CSS3.


    ```

    a[href="http"] {} /* matches all links that begin with text "http" */

    ```


    ## [att$=val]


    Selects elements with the attribute att whose value ends with val. Added in CSS3.


    ```

    a[href$=.pdf] {} /* matches all links to PDF */

    ```


    ## [att*=val]


    Selects elements with the attribute att whose value contains the substring val
    anywhere. Added in CSS3.


    ```

    input[id*=phone] {} /* matches all input with phone */

    ```


    ## Pseudo-class Selectors


    Pseudo-classes fall into two groups: dynamic pseudo-classes that represent a specific
    state of element and structural pseudo-classes that represent information about
    an element.


    ### :link,:visited (Link Pseudo-classes)


    Links in a document have two states. When unvisited as determined by the browser
    and its history, a link can be selected with the :link-class, or when visited,
    it can be selected via :visited.


    ```

    a:link { color: blue; }

    a:visited { color: purple; }

    ```


    ### :hover, :active, :focus (Action Pseudo-classes)


    The three interaction states of hovering, actively being clicked, and in focus
    can be independently styled using the :hover, :active, and :focus pseudo-classes.


    note The :hover-class for nonlink (<a> elements is not supported in IE6 or earlier
    but is supported on links as of IE4.


    ## LoVe/HAte of Hyperlink


    Links can be in multiple states at the same time, and all pseudo have identical
    specificity, so the order in which the link and action pseudo-classes are defined
    is important. The last one that applies at any given time will take precedence.


    At the moment it is clicked, a previously visited link will match all of these
    pseudo-classes. If :visited is the last selector of the bunch, then those properties
    will be applied, and different properties defined for the hover or active states
    will never be seen.


    The mnemonic device LoVe/HAte is a useful way to remember the proper order of
    selectors.


    ## :target (Target Pseudo-class)


    The target pseudo-class represents the element targeted by a named anchor in a
    URI such as the top in http://example.com/index.html#top (either by ID, or in
    the case of HTML4 name attribute).


    ## :enabled, :disabled, :checked (UI Pseudo-classes)


    The enabled, :disabled, and :checked pseudo-classes are used to target form elements
    in various states. Any form element can be either enabled or disabled, usually
    determined by the presence or lack of a disabled attribute. Check box and radio
    button elements can also be :checked through user interaction or the checked attribute.

