    \ 256\n\n## Introduction\n\nThe styling of web documents has evolved a great deal\
    \ from the early days of the Web when font tags, tables, and HTML attributes scattered\
    \ everywhere were just what you had to to do to make pages look good (or get that\
    \ animated GIF of a flame repeating across your whole page).\n\nThe CSS Pocket\
    \ Guide will teach you the building blocks of styling documents with CSS, give\
    \ you an arsenal of modern development techniques, and help you navigate the ever-changing\
    \ landscape of web browsers and specifications, including CSS3.\n\n## Who Should\
    \ Read This Book\n\nAnyone designing or building web pages should understand CSS.\
    \ This book offers an overview of CSS and the building blocks of the language\
    \ to get you going and is geared toward novice and intermediate developers.\n\n\
    Before reading this book, it is important to have some exposure to and understand\
    \ how to read and write HTML—the markup and content that the CSS code in this\
    \ book is used to style.\n\n## What You Will Learn\n\nThis book covers CSS including\
    \ CSS 2.1 and parts of CSS3.\n\n- The beginning of the book covers the building\
    \ blocks of CSS and how to use those tools to create layouts with CSS.\n- The\
    \ book then goes on to discuss how to use CSS to style the content elements that\
    \ are often placed into the parts of the layout grid you've just learned to build.\n\
    - The last part of the book dives deeper into specific topics such as working\
    \ with different types of media or creating form layouts.\n\nAlong the way, there\
    \ is also discussion of current best practices in web development and information\
    \ on upcoming changes to CSS included in CSS3 and beyond.\n\n## What You Won’t\
    \ Find in This Book\n\nIt is impossible to cover CSS in all its applications and\
    \ in all the different ways it can be encountered in one book written by one person.\
    \ Although the language is covered in detail and this book can serve as a great\
    \ reference for those learning other aspects of web design and development, it\
    \ does not attempt to cover any of the following in:\n\n- It does not attempt\
    \ to teach you what HTML is or how to write good HTML.\n- It does not attempt\
    \ to teach you anything about JavaScript or scripting things such as animations\
    \ or Ajax. But it will make a useful reference for the CSS properties you will\
    \ often manipulate with JavaScript.\n- It does not attempt to teach principles\
    \ of good visual or interactive design. It will, however, give you the tools to\
    \ implement those designs.\n- It also it does not explicitly cover CSS as applied\
    \ to documents other than HTML (such as SVG).\n\n## What You Need to Follow Along\n\
    \nAll you need is a text editor to write CSS code or review the example CSS and\
    \ HTML code, ideally one with syntax highlighting such as Notepad2 for Windows\
    \ or TextWrangler Mac OS X (both free). You’ll also need a web browser to view\
    \ the results of any code you write. A visual, or WYSIWYG, editor such as Dreamweaver\
    \ can also be used, provided it offers a “code” or “source” view.\n\nThe figures\
    \ used to demonstrated CSS code throughout this button were all generated with\
    \ actual CSS code. These full code examples, including the HTML5 documents, can\
    \ be downloaded from http://www.peachpit.com/csspocketguide so you can follow\
    \ along, review the examples in different browsers, or edit the examples and experiment\
    \ with them.\n"
