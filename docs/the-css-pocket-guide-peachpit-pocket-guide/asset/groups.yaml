    image can lead to text escaping the boundaries of the graphic. With controlled
    button labels or a large enough button style providing leeway for these cases,
    the fixed width and height is possible. Otherwise, stick with repeatable patterns
    and borders used to mark the sides of the element.


    # CSS3: text-shadow, border-radius, and Gradients


    The text-shadow property described in Chapter 9 is a useful way to enhance button
    text styling. Background images are nice, but they come with some noted inflexibility.
    The border-radius property, when combined with color gradients (Chapter 14), can
    make creating flexible and good-looking buttons quite simple.


