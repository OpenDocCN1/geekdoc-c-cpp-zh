    - Media queries: Intended for a selection of media via expressions that describe
    the features of the device introduced in CSS3


    In practice, your typical web project will have styles targeting the media types
    all, screen, print, and often handheld, while the other types will be left to
    manage with the styling defined in the all type or will be left to the default
    appearance.'
  - "[PAGE 230]\n\nYou may find the other types useful in niche projects. For example,\
