    # Specific Mode Differences


    If you want to know more (and aren''t content to just ignore that Quirks Mode
    exists at all), Jukka Korpela has a very detailed list of differences between
    Quirks Mode and Standards Mode in various browsers (http://www.cs.tu.fi/~quirks-mode.html).
    Peter-Paul Koch charted many of the differences in an easy-to-read table (http://www.quirksmode.org/css/quirksmode.html).


    # Targeting Browsers


    In a perfect world, there would be no need to send or hide specific styles to
    specific browsers or find ways to accomplish something without CSS that there
    are clearly defined properties for. In the real world, you can get away with being
    almost perfect. Under Standards Mode rendering, sending different style rules
    to different browsers is not the norm, but some projects will require a small
    tweak here or to pull a stray browser back into line.


    Here I show three common ways to approach browser targeting and why they work.
    The first two are useful if you need to make minor changes, and the last is useful
    if you are making regular changes, particularly if you have to develop for older
    versions of Internet Explorer.'
  - "[PAGE 51]\n\n# Targeting with Selectors\n\nThe rules that browsers use to parse\
    \ CSS selectors dictate that unknown syntaxes for selectors should cause the entire\
    \ rule to be ignored. You can use that, combined with recent selectors that were\
    \ not implemented in older browsers, to carefully craft rules for browsers. This\
    \ can be one of the cleanest ways to target different features toward different\
    \ editions of browsers or to offer fallback options for older browsers. You could\
    \ write the following two CSS declarations:\n\n```\nhtml body { background-color:\
    \ red; }\nhtml>body { background-color: blue; }\n```\n\nBrowsers that support\
    \ the child selector will display a red background on the page, and those that\
    \ will display in blue.\n\n# Targeting with Syntax Hacks\n\nSome browsers don't\
    \ quite follow the same parsing rules and handle what would be considered an error\
    \ or invalid syntax in a unique manner. Over time, web developers have stumbled\
    \ upon (or gone on quests to find) these differences and used them as “hacks”\
    \ in some form of browser targeting.\n\nIn the following example, most browsers\
    \ will ignore the unknown property _height, but IE will instead ignore the _ character\
    \ and consider it as a “height,” giving you a way to send a different value to\
    \ IE if needed.\n\n```\ndiv {\n  height: 200px;\n  _height: 300px;\n}\n```"
