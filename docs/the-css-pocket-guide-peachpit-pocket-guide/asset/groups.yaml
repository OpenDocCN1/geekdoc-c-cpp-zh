    \n## 固定边\n\n如果一个块有一个边是固定长度的，而另一个边根据布局空间或内容多少进行扩展或收缩，那么该框的四个角的圆角可以通过两个独立的背景图像来模拟，如下一页的图\
    \ 8.9 所示。\n\n"
