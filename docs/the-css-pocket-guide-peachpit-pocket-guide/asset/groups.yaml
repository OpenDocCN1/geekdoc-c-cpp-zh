  - '[PAGE 254]


    # The Not Too Distant Future of CSS


    As CSS has evolved as a language, it has often attempted to make common tasks
    that may be difficult or inflexible quite easy. Some of these new properties are
    based on experimental properties in individual browsers, but often they’re based
    on design and code patterns used every day by developers.


    For example, the need to use multiple HTML elements as hooks so that multiple
    background images can be used (shown in Figure 7.4), and the frequency with which
    this is done, has led to CSS changes that support multiple background images on
    a single element, as you saw in Chapter 8.'
  - '[PAGE 255]


    # 232 The CSS Pocket Guide


    Several CSS3 features have been covered in previous chapters because they have
    broad support in modern browsers, they are used to accomplish enhancements without
    major impact on the design if not supported, or both. Either way, they can be
    incorporated into the toolbox for most new web projects.


    This chapter will give you a look at other new properties you can use today as
    well as what is come. In some cases, these features have much less support in
    current browsers than the features covered elsewhere. Included in this chapter
    is information on current browser support for each property to help you make an
    informed decision which of these properties have enough support to find their
    way into your projects. Check the already mentioned browser support charts or
    When Can I Use... (https://aniuse.com/) for detailed and current browser support
    information before deciding whether to use each property.


    # The box-shadow Property


    Drop shadows, either solid or feathered edges, can be drawn behind content boxes
    using the box-shadow property. CSS3 box shadows are more flexible than you might
    be able to do with older techniques such as using a fixed-sized, semitransparent
    PNG image as the back-ground image of an item. The box-shadow property can take
    one or more comma-separated <shadow> definitions.


    +   - none: No shadow is drawn.


    +   - <shadow>: The definition of a shadow.


    The description of a CSS <shadow> has three parts: two to four <length> values,
    a shadow <color>, and an optional inset keyword. The <length> values represent,
    in order, the horizontal offset of the shadow, the vertical offset of the shadow,
    the blur distance (Ø is no blur), and a spread'
- md: "\n# Chapter 14: The Not Too Distant Future of CSS 233\n\ndistance (the growth\
    \ or contraction of a shadow from the size of an element). The first two values,\
    \ or the offsets, are required. If the blur or spread lengths are not supplied,\
    \ they are assumed to be 0.\n\nShown in Figure 14.1, the following code demonstrates\
    \ a sharp box shadow (no blur radius) and a fuzzy shadow (with a blur radius set).\n\
    \nFigure 14.1\nExample of a box shadow without and with a blur radius.\n\n| Box\
    \ with a sharp drop shadow | Box with a drop shadow with a large blur |\n\n```\n\
    div.one {\n  /* for Firefox */\n  -moz-box-shadow: 10px 10px rgba(0,0,0,0.8);\n\
    \  /* for Safari and Chrome */\n  -webkit-box-shadow: 10px 10px rgba(0,0,0,0.8);\n\
    \  /* W3C specs ^ */\n  box-shadow: 10px 10px rgba(0,0,0,0.8);\n}\ndiv.two {\n\
    \  /* for Firefox */\n  -moz-box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n  /*\
    \ for Safari and Chrome */\n  -webkit-box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* W3C specs * */\n  box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n}\n```\n\n\
    ```\n[...]\n<div class=\"one\">\n  Box with a sharp drop shadow\n</div>\n<div\
    \ class=\"two\">\n  Box with a drop shadow with a large blur\n</div>\n```\n\n\
    Shadows can be drawn inside an element using the inset keyword in the definition\
    \ of a shadow. Replacing the inside shadow made with a background image used on\
    \ the text input field in Figure 11.4 can be done with the following code (Figure\
    \ 14.2):\n\n```\n.one {\n  /* for Firefox */\n  -moz-box-shadow: inset 10px 10px\
    \ rgba(0,0,0,0.8);\n  /* Safari and Chrome */\n  -webkit-box-shadow: inset 10px\
    \ 10px rgba(0,0,0,0.8);\n  /* W3C specs */\n  box-shadow: inset 10px 10px rgba(0,0,0,0.8);\n\
    }\n.two {\n  /* for Firefox */\n  -moz-box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* Safari and Chrome */\n  -webkit-box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* W3C specs */\n  box-shadow: inset 10px 10px 20px rgba(0,0,0,0.8);\n}\n```\n\
    \n```\n[...]\n<div class=\"one\">\n  Box with a sharp inset shadow\n</div>\n```\n\
    \n```\n<div class=\"two\">\n  Box with an inset shadow with a large blur\n</div>\n\
    ```\n\nFigure 14.2\nExample of an inset box shadow without and with a blur radius.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_258_0.png)\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_258_1.png)\n\
    \nThe box-shadow property is supported now in Firefox 3.5+, Safari 3.0+, Chrome\
    \ 1+, Opera 10.5+, and Internet Explorer 4+ offer full support of the box-shadow\
    \ definitions, but older versions don't support the inset keyword. See my blog\
    \ post at http://placenamehere.com/article/384/ for more information on creating\
    \ a cross-browser drop shadow using both the box-shadow property and the proprietary\
    \ IE filter extension to apply a similar shadow in IE6 through IE8.\n\n## The\
    \ background-size Property\n\nThrough CSS 2.1, background images were displayed\
    \ at their default-inherent size. If you wanted to have an image behind an element\
    \ you would either have to make sure the size of the image and the element matched\
    \ or have to use some trickery to place the image in a \\<div> positioned and\
    \ sized to the content element with a lower-z-index value.\n\nBut now images can\
    \ be scaled or resized using the background-size property that accepts two values:\
    \ the first for the horizontal sizing and the second for the vertical sizing (if\
    \ one value is given, the second is assumed to be auto).\n\n- auto: Scales the\
    \ side of the image so that the inherent aspect ratio of the image is maintained;\
    \ if both values are auto, the image appears at its normal size (default).\n\n\
    - <percentage>: Scales the size of the background image to a percentage of the\
    \ element's (not image's) background area in the specified direction.\n\n- <length>:\
    \ Scales the side of the background image to the specified length.\n\nFigure 14.3\
    \ demonstrates the background-size property when <percentage> and <length> are\
    \ used.\n\n```css\ndiv.one {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n}\ndiv.two {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n  /* for Firefox 3.6 */\n  -moz-background-size: 100% 50px;\n \
    \ /* for Safari and Chrome */\n  -webkit-background-size: 100% 50px;\n  /* for\
    \ Opera */\n  -o-background-size: 100% 50px;\n  /* W3C specs */\n  background-size:\
    \ 100% 50px;\n}\n```\n\n```css\ndiv.three {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n}\n```\n\n```css\n/* for Firefox 3.6 */\n-moz-background-size:\
    \ 100%;\n/* for Safari and Chrome */\n-webkit-background-size: 100%;\n/* for Opera\
    \ */\n-o-background-size: 100%;\n/* W3C specs */\nbackground-size: 100%;\n```\n\
    \n<div class=\"one\">\n  Background with no sizing\n</div>\n<div class=\"two\"\
    >\n  Background with background-size set to 100% 50px\n</div>\n<div class=\"three\"\
    >\n  Background with background-size set to 100%\n</div>\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_0.png)\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_1.png)\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_260_2.png)\n\
    \n## The CSS Guide\n\nAs an alternative to the paired values, the singular keywords\
    \ contain and cover describe behaviors for how the background may fill the space.\n\
    \n- contain: The background image is sized as large as it can be so that it is\
    \ contained within the element; if the aspect ratio of the image is different\
    \ from the background area, one side will be 100% and another will be smaller\
    \ than the length.\n\n- cover: The background image is sized so that it scales\
    \ up (or down) to completely fill the area; if the aspect ratio of the image is\
    \ different from the background area, one side will be 100% and another will be\
    \ larger than the length.\n\n```css\ndiv {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n  /* for Firefox 3.6 */\n  -moz-background-size: cover;\n  /* for\
    \ Safari and Chrome */\n  -webkit-background-size: cover;\n  /* for Opera */\n\
    \  -o-background-size: cover;\n  /* W3C specs */\n  background-size: cover;\n\
    }\n```\n\n```css\ndiv.three {\n  background: url(images/background_sizing.png);\n\
    \  no-repeat;\n  /* for Firefox 3.6 */\n  -moz-background-size: contain;\n  /*\
    \ for Safari and Chrome */\n  -webkit-background-size: contain;\n  /* for Opera\
    \ */\n  -o-background-size: contain;\n  /* W3C specs */\n  background-size: contain;\n\
    }\n```\n\n```css\ndiv {\n  background: url(images/background_sizing.png);\n  no-repeat;\n\
    }\n```\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_262_0.png)\n\n## Chapter 14:\
    \ The Not Too Distant Future of CSS 241\n\nFigure 14-5\nA linear gradient with\
    \ three colors.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_264_0.png)\n\n## Border\
    \ Images\n\nFlexible, image-based borders can replace the standard border styles\
    \ using the border-image property. This is achieved by slicing the border area\
    \ into a nine-segment grid representing each of the corners of the border area\
    \ and the sides, as shown in Figure 14.6. A single image file is similarly split\
    \ into nine segments and mapped to each of the areas of the border area and the\
    \ center of the container.\n"
  mdcn: "\n\n# 第14 章：CSS 并不遥远的未来\n\n距离（阴影相对于元素大小的增长或收缩）。前两个值，即偏移量，是必须的。如果没有提供模糊或扩展长度，则假设它们为\
    \ 0。\n\n图 14.1 所示，以下代码演示了一个锐利的盒投影（无模糊半径）和一个模糊阴影（设置了模糊半径）。\n\n图 14.1\n带模糊半径和不带模糊半径的投影示例。\n\
    \n| 具有锐利投影影的框 | 具有大模糊投影影的框 |\n\n```\ndiv.one {\n  /* 用于 Firefox */\n  -moz-box-shadow:\
    \ 10px 10px rgba(0,0,0,0.8);\n  /* 用于 Safari 和 Chrome */\n  -webkit-box-shadow:\
    \ 10px 10px rgba(0,0,0,0.8);\n  /* W3C 规范 ^ */\n  box-shadow: 10px 10px rgba(0,0,0,0.8);\n\
    }\ndiv.two {\n  /* 用于 Firefox */\n  -moz-box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* 用于 Safari 和 Chrome */\n  -webkit-box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n\
    \  /* W3C 规范 * */\n  box-shadow: 10px 10px 20px rgba(0,0,0,0.8);\n}\n```\n\n```\n\
    [...]\n<div class=\"one\">\n  具有锐利内投影影的框\n</div>\n<div class=\"two\">\n  具有大模糊内投影影的框\n\
    </div>\n```\n\n可以使用阴影定义中的 `inset` 关键字在元素内部绘制阴影。可以使用以下代码（图 14.2）替换图 11.4 中文本输入字段上使用的背景图像制作的内投影：\n\
    \n```\n.one {\n  /* 用于 Firefox */\n  -moz-box-shadow: inset 10px 10px rgba(0,0,0,0.8);\n\
