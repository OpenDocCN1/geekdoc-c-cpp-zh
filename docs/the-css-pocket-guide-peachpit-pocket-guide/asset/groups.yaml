    # Lists


    HTML list elements (&lt;ul&gt; and &lt;ol&gt;) are simple block elements. Individual
    list items (&lt;li&gt;), too, are sized and positioned with the same box model,
    with dimensions, padding, margins, and borders behaving as expected. However,
    each item needs some extra parts to get the markers both positioned properly and
    designated or incremented properly.


    # display: list-item


    The default display value for a list item is list-item, allowing for the rendering
    of the box containing the list item marker in addition to the normal block element
    behavior for the list item content.


    # list-style-type


    You set the type of marker for a list item via the list-style-type property. You
    can use a plethora of keywords as types; they account for everything from the
    static bullet commonly used for unordered lists to numeric and alphanumeric values
    for different languages and counting systems. The following are some of the more
    commonly used types for English-language sites:


    +   - disc | circle | square: Common glyphs; all items in the list will show the
    same glyph (unless changed explicitly)

    - decimal | decimal-leading-zero: Decimal numbers starting with 1 or 01, respectively.

    - lower-roman | upper-roman: Lowercase and uppercase roman numerals.

    - lower-latin | upper-latin: Lowercase and uppercase ASCII letters starting with
    a or A.

    - none: No marker of any kind is rendered.'
- md: "\n# Chapter 10: Lists and Tables\n\ntip When setting the list-style-type property,\
    \ don't forget to account for the behavior of nested lists. By default, browsers\
    \ set different types so that bullets or numbering types change based on nesting\
    \ helping readability. Set different types for the selector ul, the selector ul,\
    \ and the selector ul ul.\n\n## list-style-image\n\nThe list-style-image property\
    \ takes a <uri> for an image that when specified replaces the generated list marker\
    \ defined by the list-style-type property.\n\n## list-style-position\n\nThe list-style-position\
    \ property defines where in relation to the list item's box the list marker is\
    \ positioned. Typically a marker will be positioned outside the content area of\
    \ the item into the left gutter; however, it can also be positioned inside of\
    \ the list item, behaving as an inline element at the beginning of the item would.\n\
    \n- outside: The list marker acts as an inline element positioned outside the\
    \ box generated by the item's contents (default).\n- inside: the list marker is\
    \ positioned inside the list item's box.\n\nFigure 10.1 demonstrates the two possible\
    \ list-style-position values.\n\nFigure 10.1\nThree list items with markers positioned\
    \ outside, with the latter positioned inside.\n\n| Lorem ipsum sit amet, consectetur\
    \ adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna\
    \ aliqua. |\n| Lorem ipsum sit amet, consectetur adipisicing elit, sed do eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua. |\n| Lorem ipsum sit amet,\
    \ consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore et\
    \ dolore magna aliqua. |\n| - Lorem ipsum sit amet, consectetur adipisicing elit,\
    \ sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. |\n| - Lorem\
    \ ipsum sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. |\n| - Lorem ipsum sit amet, consectetur adipisicing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. |\n\
    \n## Backgrounds as list-style-image\n\nA nonrepeating, properly positioned background\
    \ image on a list item is a common method to give control over precise positioning\
    \ of list marker images. The following code will achieve this behavior by combining\
    \ the pattern of using padding to make space for a background image, as shown\
    \ a few times in Chapter 7, with turning off the default list marker with list-style-type:\
    \ none.\n\n```\nul {\n  margin-left: 0;\n  padding-left: 0;\n}\nli {\n  margin-left:\
    \ 0;\n  padding-left: 20px;\n  list-style-type: none;\n  background: url(fancydot.png)\
    \ no-repeat 4px 4px;\n}\n```\n\n## list-style (Shorthand)\n\nThe list-style shorthand\
    \ property allows assigning the individual list properties (list-style-type, list-style-position,\
    \ list-style-image) in the same place.\n\n```\nli { list-style: none; }\n```\n\
    \nThe previous code demonstrates a simple method of disabling markers and shaves\
    \ a few characters off setting the list-style-type property directly.\n\n## ::marker\
    \ Pseudo-element\n\nCSS3 added a handy pseudo-element to access the list marker,\
    \ both defining and providing a way to change the styles and positioning of the\
    \ marker that isn't available through shifting or padding on the list item or\
    \ wrapping the content of a list item in another element, allowing independent\
    \ control of properties such as color and font-size:\n\n```\n<li><span>list content</span></li>\n\
    ```\n\nUnfortunately, at the time of this writing, there isn't a browser that\
    \ supports ::marker. Combined with counters and generated content, which are discussed\
    \ in the next section, this will be a powerful way to generate custom markers\
    \ for content.\n\n## Generated Content\n\nAs is the case with list markers, it\
    \ can sometimes be desirable to display content that doesn't come from the HTML\
    \ document. Generated content is defined with the content property and then added\
    \ to the document as the content of the pseudo-elements ::before and ::after (and,\
    \ eventually, ::marker).\n\n## content\n\nThe content property allows for a number\
    \ of different types of content that may be added to the selected pseudo-element,\
    \ including the following:\n\n- <string>: Text content for inserting into the\
    \ element\n- <url>: A URI of an image\n- none: No content is defined\n\n## ::before\
    \ and ::after\n\nThe pseudo-elements ::before and ::after represent placeholders\
    \ for content before and after an element's existing content.\n\n```\na.help::after\
    \ {\n  content: \"(?)\";\n  color: red;\n  background: yellow;\n}\n```\n\n```\n\
    a.next::after {\n  content: url(images/right_arrow.png);\n}\n```\n\n[...]\n<p>Here\
    \ is some text that contains a link to the <a class=\"help\" href=\"http://example.com/help.html\"\
    >help page</a>\n- and a link to the <a class=\"next\" href=\"http://example.com/next.html\"\
    >next page</a></p>\n\nThe previous code adds an arrow image after any link to\
    \ a \"next\" document and then a question mark after any \"help\" link, as shown\
    \ in Figure 10.2. These two hints, or similar additions using the content property,\
    \ examples of where presentational hints introduced through design would be different\
    \ from content that would normally be in the HTML source.\n\n> Here is some text\
    \ that contains a link to the help page(?) and a link to the next page→\n\nFigure\
    \ 10.2 Example of generated content added after links with different class attributes.\n\
    \n- The generated content is added to the content of the selected elements. They\
    \ are styled as though they content in the original HTML tag, and for links the\
    \ added content is clickable, just like the rest of the link text.\n\n## Counters\n\
    \nCSS counters provide the ability to create and use a count of elements of a\
    \ selected type in a document. Though it would be most useful to aid in customizing\
    \ item markers, counters aren't limited to lists and can help with document outline\
    \ style presentations or other embellishments.\n\n## counter-increment\n\nThe\
    \ previous specifies that the counter with a provided text label (<identifier>)\
    \ should be incremented when the element defined by the selector is encountered\
    \ in the document.\n\n- <identifier>: The counter to be incremented by 1\n- <identifier>\
    \ <integer>: The counter to be incremented and a value (positive or negative)\
    \ for each step\n\n## counter()\n\nInside the content property, the current value\
    \ of a given counter can be accessed with the counter() function:\n\n- counter(<identifier>):\
    \ Returns the value of the specified counter\n- counter(<identifier> list-style-type):\
    \ Returns the value of the specified counter formatted to fit the provided list-style-type\
    \ (decimal, upper-roman, and so on)\n\n## counter-reset\n\n- <identifier>: Resets\
    \ the specified counter to o\n- <identifier> <integer>: Resets the specified counter\
    \ to some integer\n\nThe following code was used to generate Figure 10.3 and demonstrates\
    \ three presentation options that cannot be accomplished with list-style-type\
    \ in current browsers.\n\n- The list item presentation of a number followed by\
    \ dot was customized to be a number followed by a colon.\n- The text containing\
    \ the counter can be independently styled from the item content in browsers without\
    \ :marker support.\n- A marker and counter was added to each h4 element.\n\n```\n\
    h4 { /* increment one counter at each h4 */\ncounter-increment: heading;\n}\n\
    h4::before {\n  content: counter(heading, lower-roman) \": \";\n  color: #aaa;\n\
    }\nol li { /* start a second counter for list items */\n  list-style-type: none;\n\
    \  counter-increment: item;\n}\nol li::before {\n  content: counter(item) \":\
    \ \";\n  color: #aaa;\n}\nol { /* reset second counter for each new */ */\ncounter-reset:\
    \ item;\n}\n```\n[... ]\n<h4>Heading</h4>\n<h4>Heading</h4>\n\n```\n<ol>\n  <li>list\
    \ item</li>\n  <li>list item\n    <ol>\n      <li>list item</li>\n      <li>list\
    \ item</li>\n      <li>list item</li>\n    </ol>\n  </li>\n  <li>list item</li>\n\
    </ol>\n<h4>Heading</h4>\n<ol>\n  <li>list item</li>\n  <li>list item</li>\n</ol>\n\
    <h4>Heading</h4>\n```\n\nFigure 10.3 Demonstration of counters used for generated\
    \ content.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_202_0.png)\n"
  mdcn: "\n\n# 第 10 章：列表与表格\n\n提示 在设置 `list-style-type` 属性时，不要忘记考虑嵌套列表的行为。默认情况下，浏览器会设置不同的类型，使得符号或编号类型会根据嵌套情况发生变化，从而提高可读性。为选择器\
    \ `ul`、`ul ul` 和 `ul ul` 分别设置不同的类型。\n\n## list-style-image\n\n`list-style-image`\
    \ 属性接受一个 `<uri>` 作为图像，指定后它将替换由 `list-style-type` 属性定义的生成的列表标记。\n\n## list-style-position\n\
    \n`list-style-position` 属性定义了列表标记相对于列表项目框（box）的位置。通常，标记将放置在项目内容区域之外的左侧凹槽中；然而，它也可以放置在列表项目内部，表现就像位于项目开头的内联元素一样。\n\
    \n- outside: 列表标记作为内联元素放置在由项目内容生成的框之外（默认值）。\n- inside: 列表标记放置在列表项目框内部。\n\n图 10.1\
    \ 展示了两种可能的 `list-style-position` 值。\n\n图 10.1\n三个标记位于外部的列表项目，其中后一个标记位于内部。\n\n\
    | Lorem ipsum sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. |\n| Lorem ipsum sit amet, consectetur adipisicing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. |\n\
    | Lorem ipsum sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. |\n| - Lorem ipsum sit amet, consectetur adipisicing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. |\n\
    | - Lorem ipsum sit amet, consectetur adipisicing elit, sed do eiusmod tempor\
    \ incididunt ut labore et dolore magna aliqua. |\n| - Lorem ipsum sit amet, consectetur\
    \ adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna\
    \ aliqua. |\n\n## 使用背景作为 list-style-image\n\n在列表项目上使用不重复且位置恰当的背景图像是控制列表标记图像精确位置的常用方法。以下代码通过结合两种模式来实现：：使用\
    \ `padding` 为背景图像留空间（在第 7 章中出现过几次），以及通过 `list-style-type: none` 关闭默认列表标记。\n\n\
    ```\nul {\n  margin-left: 0;\n  padding-left: 0;\n}\nli {\n  margin-left: 0;\n\
    \  padding-left: 20px;\n  list-style-type: none;\n  background: url(fancydot.png)\
    \ no-repeat 4px 4px;\n}\n```\n\n## list-style（简写）\n\n`list-style` 简写属性允许在同一个地方分配各个列表属性（`list-style-type`、`list-style-position`、`list-style-image`）。\n\
    \n```\nli { list-style: none; }\n```\n\n之前的代码演示了禁用标记的简单方法，并比直接设置 `list-style-type`\
    \ 属性节省了几个字符。\n\n## ::marker 伪元素\n\nCSS3 添加了一个实用的伪元素来访问列表标记，它既可以定义标记，又提供了更改标记样式和位置的方法。这种方法通过对列表项目设置偏移或内边距，或者将列表项目的内容包裹在另一个元素中是无法实现的。它允许对颜色和字体大小等属性进行独立控制：\n\
    \n```\n<li><span>list content</span></li>\n```\n\n遗憾的是，在写作此时，还没有浏览器支持 `::marker`。结合下一节将讨论的计数器（counters）和生成内容（generated\
    \ content），这将是为内容生成自定义标记的强大方式。\n\n## 生成内容\n\n与列表标记一样，有时希望显示并非来自 HTML 文档的内容。生成内容通过\
    \ `content` 属性定义，然后作为伪元素 `::before` 和 `::after`（以及最终的 `::marker`）的内容添加到文档中。\n\n\
    ## content\n\n`content` 属性允许向所选的伪元素中添加多种不同类型的内容，包括以下内容：\n\n- `<string>`: 插入元素中的文本内容\n\
    - `<url>`: 图像的 URI\n- none: 未定义内容\n\n## ::before 和 ::after\n\n伪元素 `::before` 和\
    \ `::after` 代表元素现有内容之前之后内容的占位符。\n\n```\na.help::after {\n  content: \"(?)\";\n\
    \  color: red;\n  background: yellow;\n}\n```\n\n```\na.next::after {\n  content:\
    \ url(images/right_arrow.png);\n}\n```\n\n[...]\n<p>这里有一些文本，包含一个指向 <a class=\"\
    help\" href=\"http://example.com/help.html\">帮助页面</a>的链接\n- 以及一个指向 <a class=\"\
    next\" href=\"http://example.com/next.html\">下一页</a>的链接</p>\n\n之前的代码在任何指向“next”\
    \ 文档的链接之后添加了一个箭头图像，在任何“help” 链接之后添加了一个问号，如图 10.2 所示。这两个提示（或使用 `content` 属性添加的类似内容）说明了通过设计引入的演示性提示（presentational\
    \ hints）与通常存在于 HTML 源代码中的内容有不同之处。\n\n> 这里有一些文本，包含一个指向帮助页面(?) 和一个指向下一页→的链接。\n\n\
    图 10.2 在具有不同类属性的链接后添加生成内容的示例。\n\n- 生成内容被添加到所选元素的内容中。它们的样式处理就像它们在原始 HTML 标签中的内容一样，对于链接来说，添加的内容是可以点击的，就像原来的一样。\n\
    \n## 计数器（Counters）\n\n与列表标记一样，有时显示并非来自 HTML 文档的内容是理想的。生成内容通过 `content` 属性定义，然后作为伪元素\
    \ `::before` 和 `::after`（以及最终的 `::marker`）的内容添加到文档中。\n\n计数器提供了创建和使用文档中某些元素计数的能力。虽然它对自定义列表标记非常有用，但不仅限于列表，还可以帮助文档大纲样式或其他装饰。\n\
    \n## counter-increment\n\n`counter-increment` 指定当遇到由选择器定义的元素时，计数器应该递增。\n\n- `<identifier>`:\
    \ 计数器增加 1\n- `<integer>`: 计数器增加指定的整数步长\n\n## counter()\n\n在 `content` 属性中，可以使用\
    \ `counter()` 函数访问给定计数器的值：\n\n- `counter(<identifier>)`: 返回指定计数器的值\n- `counter(<identifier>,\
    \ <style>)`: 返回返回格式化后的指定计数器值（如 decimal-style）\n\n## counter-reset\n\n- `<identifier>`:\
    \ 将指定的计数器重置为 o\n- `<integer>`: 将指定的计数器重置为某个整数\n\n以下代码用于生成图 10.3，并展示了当前通过 `list-style-type`\
    \ 无法实现的三个演示选项。\n\n- 列表项目的数字加点演示被自定义为数字加冒号。\n- 在不支持 `:marker` 的浏览器中，包含计数器的文本可以独立设置样式。\n\
    - 为每个 `h4` 元素添加了标记和计数器。\n\n```\nh4 { /* 为每个 h4 增加计数 */\ncounter-increment: heading;\n\
    }\nh4::before {\n  content: counter(heading, lower-roman) \": \";\n  color: #aaa;\n\
    }\nol li { /* 为列表启动第二个计数器 */\n  list-style-type: none;\n  counter-increment: item;\n\
    }\nol li::before {\n  content: counter(item) \": \";\n  color: #aaa;\n}\nol {\
    \ /* 为每个新的重置第二个计数器 */\ncounter-reset: item;\n}\n```\n[... ]\n<h4>Heading</h4>\n\
    <h4>Heading</h4>\n\n```\n<ol>\n  <li>list item</li>\n  <li>list item\n    <ol>\n\
    \      <li>list item</li>\n      <li>list item</li>\n      <li>list item</li>\n\
    \    </ol>\n  </li>\n  <li>list item</li>\n</ol>\n<h4>Heading</h4>\n<ol>\n  <li>list\
    \ item</li>\n  <li>list item</li>\n</ol>\n<h4>Heading</h4>\n```\n\n图 10.3 使用计数器用于生成内容的演示。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_202_0.png)\n\n"
