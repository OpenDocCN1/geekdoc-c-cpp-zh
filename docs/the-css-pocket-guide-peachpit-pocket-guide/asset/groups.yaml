    \  clear: left;\n  width: 150px;\n  min-height: 1em; /* keep empty span open */\n\
    \  margin: 0 10px 0 0;\n  padding: 0;\n  text-align: right;\n}\n```\n\n```css\n\
    [...]\np label,\ninput[type=\"radio\"]+label { /* reverse baseline label style\
