    # CSS 便携指南


    每个属性的 CSS 规范都列出了该属性是否可以继承，以及它默认是否会继承父元素的值。


    强大的结构化和语义化标记是使 CSS 设计变得简单、易读且易于维护的关键。虽然文档树中的每个单独节点都可以被显式设置样式，但通过级联、特殊性和继承的行为，CSS
    的设计初衷是为了利用元素上下文和标记模式。糟糕的标记无法为样式化提供文本线索或“钩子”，而良好的标记实践（如恰当地使用 `<div>` 或 `<section>`
    元素、使用不同层级的标题以及使用段落而非换行符）则提供了这些支持。


    # 指定值、计算值、使用值和实际值


    值根据引用的位置和方式分为四种类型。你已经遇到过计算值（computed values）和指定值（specified values）：第三种是实际值（actual
    values）。


    - 指定值（Specified values）：这些是在 CSS 规则中直接编码的值。

    - 计算值（Computed values）：这些属性在应用级联和继承之后、但在文档处理或渲染之前计算出的值。诸如 `em` 等单位会被计算并转换为固定值（大多数设备上为像素），文件路径会被变为绝对路径，继承的值会被继承。

    - 使用值（Used values）：在所有值计算完成且文档处理后，某些其他属性的值（例如百分比或基于自动的宽度，它们依赖父元素的尺寸）会被计算为固定宽度等效值。当这些计算完成并页面渲染时，产生的值就是使用值。尽管命名不太理想，但当你通过
    `getComputedStyle` DOM API 编写脚本 或在 Firebug 中查看计算标签页时，遇到的正是这些使用值。

    - 实际值（Actual values）：在所有计算完成且浏览器处理完文档后，在某些情况下使用值无法渲染，因此浏览器必须估算使用值从而创建实际值。这可能发生在计算产生分数像素单位时（99
    像素的 50%），或者当低色彩深单色显示无法渲染计算出的精确颜色时。


    # 块级元素、内联元素和替换元素


    HTML 文档中有三种主要类型的元素（广义而言），其预期内容类型决定了它们在 CSS 和表现中的行为。作为其他内容容器的元素如 `<div>`、`<p>`；区分不同类型文本内容的元素如
    `<a>`、`<strong>`；以及引用外部内容的元素如 `<img>`、`<object>`。


    在本书中，第一类元素是块级元素（block elements），第二类是内联元素（inline elements），最后一种是内联替换元素（inline replaced
    elements）。


    # Web 标准与规范


    世界维网联盟（W3C）同 WHATWG 和 IETF 等其他标准机构一起为从 CSS 到互联网计算机通信所需的 HTTP 协议的所有内容产出标准和规范文档。你可以在
    W3C 网站 http://www.w3.org 上找到 CSS 和 HTML 的规范。


    # CSS 便携指南


    CSS2, CSS2.1, CSS3, 草案（Drafts）, 建议（Recommendations）, 确认（Ack!）


    我们正处于一个特殊的时刻，CSS “标准”的状态虽然活跃且令人兴奋，但往往也令人困惑。W3C 的 CSS 工作组由浏览器厂商的代表和其他技术专家组成，他们正在积极编写和维护这些规范。初看之下，有很多规范文档，而且它们都处于流程的不同阶段。


    规范在最终定稿过程中会经历许多状态，并在期间收集意见和测试实现：


    - 工作草案（Working Draft）：工作草案（WD）是规范的最早定义。文档本身通常会加载注释、问题或不完整的引用。工作草案有助于了解未来趋势，并供浏览器厂商创建测试实现。未来文档以及可能的单个属性定义可能会发生变化，因为目前对文档内容尚未达成共识。

    - 最后一次工作草案（Last Call Working Draft）：当工作草案中的问题、冲突和疑问解决后，将宣布最后一次（LC）征求意见，以征求对草案的反馈。

    - 候选建议（Candidate Recommendation）：在最后一次周期之后，草案可能会进入候选建议（CR）阶段，工作组向厂商征求测试实现，以确保所提方案是行的。

    - 拟议建议（Proposed Recommendation）：要成为拟议建议（PR），规范必须是稳定的，且厂商已经创建了互操作的实现。

    - 建议（Recommendation）：要成为建议（此处原文与 PR 描述重复，应指规范已完全稳定并成为正式标准）。


    # CSS 便携指南


    规范变成建议的过程可能非常缓慢。尽管 CSS3 是大家关注的焦点，但 2.1 刚刚准备进入 PR 状态。以下是该线上各种规范以及你今天就可以开始使用的：


    - CSS2：CSS2 于 1998 年成为建议。作为规范，它已被 CSS2.1 代代，尽管“CSS2”一词可能指其中任何一个。

    - CSS2.1：由于本书编写于 2010 年后期，CSS2.1 规范已准备好成为建议。

    - CSS3：通过 CSS3，规范被拆分为模块，以控制给定内容的复杂性。某些模块是具有更好支持的 CR，其他尚未编写。


    有关 CSS2.1 和各种 CSS3 模块的更新状态，请参见 http://www.w3.org/Style/CSS/current_work。


    # CSS 便携指南


    HTML 4, XHTML 和 HTML5


    选择基于哪种 HTML 规范（或草案规范）编写标记完全取决于你。尽管 HTML5 可能提供一些令人兴奋的新功能，例如额外的结构化元素和 Web 表单组件，但它们都是“标准”，与
    CSS 的配合效果同样良好。


    然而，重要的是你必须根据 doctype 和标准编码以及规范的语义规则进行编写。虽然某些规范中存在处理标记错误的规则，但无效的标记（例如嵌套不当的元素或未关闭的标签）往往会导致意外的样式结果。同样，糟糕的标记语义可能会混乱你的选择器，并让
    CSS 代码变得难以理解。


    # 用户代理、浏览器与设备


    消耗并渲染网页及 CSS 显示的最常见软件是 浏览器。


    任何消耗 Web 文档的广泛类别统称为用户代理。用户代理包括典型的 浏览器，还包括屏幕阅读器程序、信息馈器、Google 及其他搜索引擎爬虫以及其他程序接口。


    设备是用户代理运行的硬件，通常决定了该用户代理能够支持的功能。智能手机的屏幕可能比桌面电脑小，打印机具有纸张的特征，而 Wii 可能在标准清晰电视屏幕上显示内容。


    在桌面浏览器等设备上，内容在一个大型画布（或视口）上显示，被归类连续


    '
