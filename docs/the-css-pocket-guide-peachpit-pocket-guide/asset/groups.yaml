    \ conditional comments (http://en.wikipedia.org/wiki/Conditional_comment). Using\
    \ standard HTML comments (because non-IE browsers will ignore anything inside\
    \ them) and a few extra characters that tell IE to pay attention, you can feed\
    \ IE or some specific version of IE a link to a style with sheet rules.\n\n```html\n\
    <!--[if IE]>\n<link type=\"stylesheet\" src=\"css/all_ie.css\">\n<![endif]-->\n\
    ```\n\n```html\n<!--[if lt IE 8]>\n<link type=\"stylesheet\" src=\"css/all_ie.css\"\
    >\n<![endif]-->\n```\n\nThe downside of adding style rules in this manner is that\
    \ you create two or three places where code for the same item resides, making\
    \ it easy to forget to maintain each set of rules. A comment in the main CSS file\
    \ designating where is additional code can be a useful way to keep things:\n\n\
    ```css\n#block { /* see also all_ie.css */ }\n```\n\nThe upside as conditional\
    \ comments is that you have much greater control over what versions of IE will\
    \ see your code.\n\n## IE and hasLayout\n\nIn versions 6 and 7, Internet Explorer\
    \ has an internal method of distinguishing when an element in the page needs some\
    \ layout features such as positioning or sizing. Based on the application of certain\
    \ styles, Internet Explorer places an element into a bucket that gets layout handling\
    \ or one that doesn't. This internal flag is labeled hasLayout. The hasLayout\
    \ flag was not meant to be exposed to those of us building sites, but the internal\
    \ architecture that relies on this flag is also the source of few CSS bugs. Figure\
    \ 2.2 shows the indicator present on a <div> element in the IE Toolbar.\n\n##\
    \ Chapter 2: Web Browsers\n\n![](img/e004bf8d02cf0721fa6beaa6fe9b_54_0.png)\n\n\
    **Figure 2.2** An element with hasLayout revealed via the Developer Toolbar in\
    \ IE7.\n\nUnfortunately, the distinction between an element that goes into the\
    \ bucket that gets internal presentation and one that doesn’t leads to one of\
    \ most commonly attributed problem in Internet Explorer 6 and 7, called the Layout\
    \ bug.\n\nThe Layout bug is so named because a block of content on a page may\
    \ disappear (or flash in out) while scrolling a page if the block does not have\
    \ hasLayout flag triggered. You can't set hasLayout flag directly, but you can\
    \ “force” it into the proper state by setting one number of CSS properties for\
    \ the element, including the following:\n\n```css\ndiv.columnA {\n  height: {};\
    \ /* trigger hasLayout by providing a dimension */\n}\ndiv.columnB {\n  zoom:\
    \ 1; /* trigger hasLayout by using nonstandard property */\n}\n```\n\nYou can\
    \ find an excellent discussion of hasLayout in \"On having layout\" (http://www.satzans.de/css/onhavinglayout.html),\
    \ and Microsoft offers its own documentation on the property (http://msdn.microsoft.com/en-us/library/bb250481(Vs.85).aspx).\n\
    \n> IE 8 still has hasLayout property internally, though its effects on layout\
    \ behavior are mostly resolved.\n\n## Browser Grading\n\nIn the previous sections,\
    \ I outlined a few methods used to work with web browsers, both old and new, to\
    \ make sure they're handling your CSS properly and to target them when they don't.\n\
    \nBut creating all these versions of code for different browsers, testing them\
    \ thoroughly, documenting them, and maintaining them can be time-consuming and\
    \ frustrating.\n\nBy creating a tiered support matrix of browsers, you can save\
    \ time in development and help communicate the technical requirements clearly\
    \ to your client, other developers on the project, the QA team testing and approving\
    \ your work, and maintaining the site and handling customer feedback.\n\nThe specific\
    \ breakdown of which browsers are most important and which browsers fit under\
    \ other categories is a business decision that has to be made on case-by-case\
    \ basis. Yahoo's \"Graded Browser Support\" document (http://developer.yahoo.com/yi/gbs/index.html)\
    \ offers a well-reasoned explanation of YUI's grading methodology and results\
    \ (Figure 2.3) is a common example I turn to on a new project or when educating\
    \ others about the benefits of grading.\n\nFigure 2.3\nYUI A-grade browser matrix.\n\
    \n| | Win XP | Win 7 | Mac 10.5.† | Mac 10.6.† |\n|---|---|---|---|---|\n| Firefox\
    \ 3.0.† | A-grade | | | |\n| Firefox 3.6.† | A-grade | A-grade | | A-grade |\n\
    | Chrome 4.0.† | A-grade | | | |\n| IE 8.0 | A-grade | A-grade | | |\n| IE 7.0\
    \ | A-grade | | | |\n| IE 6.0 | A-grade | | | |\n| Safari 4.0.† | | A-grade |\
    \ A-grade |\n\nThis specific categorization works for the YUI developers but may\
    \ not for you. Therefore, the following is a rough outline of the designations\
    \ I have found to work for large commercial projects.\n\n## A-Grade Browsers\n\
    \nA-grade browsers represent the target platforms when deciding how to implement\
    \ a site and what CSS tools and other technologies you can comfortably use. Browsers\
    \ like Firefox 3, Safari 4, and IE7 find their way into this classification based\
    \ on their capabilities or the size of their user base.\n\n## B-Grade Browsers\n\
    \nB-grade browsers may be older versions of common browsers or current versions\
    \ of browsers on uncommon operating systems or devices. These browsers may, but\
    \ may not be expected to, be able to display some CSS2 or CSS3 latest tricks.\
    \ However, the pages you build should still be tested in these browsers to make\
    \ sure they are fully functional, they are accessible, your branding message comes\
    \ across, and they don't appear to look “broken.\"\n"
  mdcn: "\n\n```html\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=8\" />\n```\n\
    \n下一个示例告诉浏览器模拟 IE7 并使用派生的 DOCTYPE 模式：\n\n```html\n<meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=EmulateIE7\" >\n```\n\n关于 X-UA-Compatible 的更多背景和值的示例，可以参考微软（http://msdn.microsoft.com/en-us/library/cc288325(VS.85).aspx）。\n\
    \n## 特定模式差异\n\n如果你想了解更多信息（并且不满足于忽略怪异模式（Quirks Mode）的存在），Jukka Korpela 提供了一份关于各种浏览器中怪异模式与标准模式差异的详细列表（http://www.cs.tu.fi/~quirks-mode.html）。Peter-Paul\
    \ Koch 在一个易于阅读的表格中绘制了许多差异（http://www.quirksmode.org/css/quirksmode.html）。\n\n\
    ## 针对特定浏览器\n\n在完美的世界里，没有必要向特定浏览器发送或隐藏特定样式，也不需要寻找方法来实现那些 CSS 已经明确定义属性的功能。在现实世界中，你可以几乎完美。在标准模式渲染下，向不同的浏览器发送不同的样式规则并不是常态，但某些项目可能在此进行微调，或者将某个异常的浏览器拉回正。\n\
    \n在这里我展示了处理浏览器定位的三种方法以及它们有效的原因。前两种方法在你需要细微更改时有用，而最后一种在你进行定期更改时有用，特别是当你必须为旧版本的\
    \ Internet Explorer 开发时。\n\n## 使用选择器定位\n\n浏览器用于解析 CSS 选择器的规则规定，未知的选择器语法将导致整个规则被忽略。你可以利用这一点，结合旧版本浏览器未实现的最新选择器，为不同的浏览器精心编写规则。这可以是针对不同版本浏览器定位不同功能或为旧浏览器提供回退方案的最简洁的方法之一。你可以编写以下两个\
    \ CSS 声明：\n\n```css\nhtml body { background-color: red; }\nhtml>body { background-color:\
    \ blue; }\n```\n\n支持子选择器的浏览器将在页面上显示红色背景，而不支持的将显示蓝色。\n\n## 使用语法技巧（Hacks）\n\n某些浏览器并不完全遵循相同的解析规则，并对被视为错误或无效语法的处理以独特的方式。随着时间的推移，Web\
    \ 开发人员发现了（或苦苦寻找了）这些差异，并将它们作为某些浏览器定位的“技巧”。\n\n在下面的示例中，大多数浏览器将忽略未知的属性 `_height`，但\
    \ IE 将会忽略 `_` 字符并将其视为“height”，从而让你在需要时向 IE 发送不同的值。\n\n```css\ndiv {\n  height:\
    \ 200px;\n  _height: 300px;\n}\n```\n\n## 第2章：网络浏览器 29\n\n如果你想针对 IE6 及更早版本，可能会使用\
    \ `* html` 技巧，大多数浏览器不会将其应用于任何元素，因为在根 `<html>` 标签上方没有元素，但 IE 直到第 7 版本都是错误的。\n\n\
    ```css\ndiv.column {\n  width: 200px;\n}\n* html div.column {\n  width: 198px;\n\
    }\n```\n\n你可以在 swik.net (http://swik.net/CSS/CSS+Hacks) 上找到 CSS 技巧及其危险性的汇编。\n\n\
    使用任何性质技巧的危险在于，无法控制未来浏览器在相同情况下的行为。未来的 Safari 版本会以相同的方式解析你的技巧，但不再需要你提供的更改后的值吗？（或者更直接地说，由于软件\
    \ Bug），因此你取决于开发者随着时间推移所做的修复。\n\n## 微软条件注释\n\n如果你发现需要为 Internet Explorer 提供一些特殊代码，或者你不想混合选择器或语法技巧，可以使用条件注释（http://en.wikipedia.org/wiki/Conditional_comment）。使用标准\
    \ HTML 注释（非 IE 浏览器会忽略其中的内容）和一些告诉 IE 注意的额外字符，可以为 IE 的特定版本提供样式表。\n\n```html\n<!--[if\
    \ IE]>\n<link rel=\"stylesheet\" src=\"css/all_ie.css\">\n<![endif]-->\n```\n\n\
    ```html\n<!--[if lt IE8]>\n<link rel=\"stylesheet\" src=\"css/all_ie.css\">\n\
    <![endif]-->\n```\n\n这种方式添加样式规则的缺点是代码出现在两个三个地方，难以维护。在主 CSS 文件中指定注释是一种有用的方法：\n\n\
    ```css\n#block { /* 查看 all_ie.css */ }\n```\n\n条件注释的优点是你可以对哪些版本的 IE 会看到你的代码有更大的控制权。\n\
    \n## IE 和 hasLayout\n\n在 6 和 7 版本中，Internet Explorer 有一种内部方法来区分元素是否需要某些布局功能（如定位或尺寸）。根据样式的应用，Internet\
    \ Explorer 将元素放入处理布局或不处理的类别。这个内部标记为 hasLayout。hasLayout 标记并不是为了暴露给构建网站的我们，但依赖此标记的内部架构也是\
    \ CSS Bug 的来源。图 2.2 显示了 IE 开发工具中的 `<div>` 元素。\n\n## 第2章：网络浏览器\n\n![](img/e004bf8d02cf0721fa6be9b_54_0.png)\n\
    \n**图 2.2** 通过 IE7 开发工具显示 hasLayout 的元素。\n\n不幸的是，进入处理布局的元素与不进入的元素之间的区别导致了 Internet\
    \ Explorer 6 和 7 中常见的问题之一，被称为 Layout Bug（布局 Bug）。\n\nLayout Bug 之所以命名，是因为如果没有触发\
    \ hasLayout 标记，页面上的内容可能会消失（或闪烁）。你无法直接设置 hasLayout 标记，但可以通过为元素设置某些 CSS 属性来“强制”进入正确状态：\n\
    \n```css\ndiv.columnA {\n  height: {}; /* 提供尺寸触发 hasLayout */\n}\ndiv.columnB\
    \ {\n  zoom: 1; /* 使用非标准属性触发 hasLayout */\n}\n```\n\n你可以在“On having layout”（http://www.satzans.de/css/onhavinglayout.html）找到关于\
    \ hasLayout 的精彩讨论，微软对该属性也有自己的文档（http://msdn.microsoft.com/en-us/library/bb25048.v5.aspx）。\n\
    \n> IE 8 仍然具有 hasLayout 属性，尽管其对布局的影响已大部分解决。\n\n## 浏览器分级\n\n在之前的章节中，我概述了一些与新旧浏览器协作的方法，以确保它们正确处理你的\
    \ CSS，并在它们未处理时进行定位。\n\n但为不同的浏览器创建所有版本的代码、进行彻底测试、记录和维护可能是耗时且令人沮丧的。\n\n通过创建一个分级的浏览器矩阵，你可以节省开发时间，并向你的客户、项目的其他开发者、测试并批准你工作的\
    \ QA 团队以及维护网站和处理客户反馈的人清晰地传达技术需求。\n\n哪些浏览器最重要以及哪些浏览器属于其他类别的具体划分必须根据具体情况做出业务决策。Yahoo\
    \ 的“分级浏览器支持”文档（http://developer.yahoo.com/yi/gbs/index.html）对 YUI 的分级方法和结果提供了合理的解释（图\
    \ 2.3），这是我在新项目或教育他人分级益处时经常参考的示例。\n\n图 2.3\nYUI A 级浏览器矩阵。\n\n| | Win XP | Win 7\
    \ | Mac 10.5† | Mac 10.6† |\n|---|---|---|---|---|\n| Firefox 3.0† | A-级 | | |\
    \ |\n| Firefox 3.6† | A-级 | A-级 | | A-级 |\n| Chrome 4.0† | A-级 | | | |\n| IE 8.0\
    \ | A-级 | A-级 | | |\n| IE 7.0 | A-级 | | | |\n| IE 6.0 | A-级 | | | |\n| Safari\
    \ 4.0† | | A-级 | A-级 |\n\n这种特定的分类方法适用于 YUI 开发人员，但可能对你不适用。因此，以下是我发现适用于大型商业项目的标记的大略大纲。\n\
    \n## A 级浏览器\n\nA 级浏览器代表决定如何实现网站以及你可以方便使用哪些 CSS 工具和其他技术时的目标平台。像 Firefox 3、Safari\
    \ 4 和 IE7 这样的浏览器根据其能力或用户群进入这一分类。\n\n## B 级浏览器\n\nB 级浏览器可能是常见浏览器的旧版本，或是在不常用的操作系统或设备上的当前版本浏览器。这些浏览器可能（但不预期）显示某些\
    \ CSS2 或 CSS3 的最新技巧。然而，你仍然应该在这些浏览器中测试构建的页面，以确保它们功能完备、可访问、品牌信息传达，并且看起来没有“崩溃”。"
