- md: '

    # Resources


    It goes without saying that a topic at the core of web development will have a
    large number of great resources on the Web.


    - Check out the W3C''s CSS Working Groups Current Work index of the CSS specifications.
    http://www.w3.org/Style/CSS/current-work

    - You can also refer to the detailed browser support charts and other web development
    articles by Peter-Paul Koch at QuirksMode.org. http://quirksmode.org/

    - The WASP Interact Curriculum project offers a full and ongoing curriculum for
    learning and teaching web development and web design including CSS. http://interact.webstandards.org/

    - The Mozilla Developer Center offers a complete reference of the CSS language
    and is great for looking things up in a flash. https://developer.mozilla.org/en/CSS_Reference

    - The Opera Developer Network offers articles, tutorials, and references for all
    areas of web development, including a curriculum you can walk through and teach
    yourself. http://dev.opera.com/


    # Writing CSS


    Unlike a programming language such as JavaScript, there isn''t that much to the
    syntax of CSS and the makeup of CSS rules. The following sections highlight some
    things you should know before jumping into the complexities of what the simple
    syntax can do.


    # Case Sensitivity


    CSS is case insensitive. For example, the color property is equivalent to the
    COLOR property, and a px unit is the same as a PX or P unit. By convention, properties
    and values are typically written using lowercase characters, and that is the convention
    followed in this book.


    Parts of the code not under the control of CSS such as file paths to style sheet
    documents, images, element names, classes and IDs may be case sensitive and defined
    at their source. For example, the file path on one server may be case sensitive,
    but on another server or your local machine it may not be. For markup, elements
    in HTML documents are case insensitive; however, elements in XML-based documents
    are.


    To avoid confusion or code bugs, it is best to match the case in your code regardless
    of whether it will be enforced.


    # Comments


    There is only one way to write a comment in CSS—beginning with the two characters
    /* and ending with the same two characters reversed, /. Any text, code, or whitespace
    between those two is ignored.


    ```

    /* this is a comment */

    ```


    # Whitespace


    In CSS, whitespace—including space characters, tabs, and line breaks—has no meaning
    outside of its use as a descendent selector (Chapter 3) or as a separator for
    multiple values in a single declaration. Outside of those two cases, it is considered
    optional. It is up to you to use whitespace (or not) to format your CSS to help
    with the organization and readability of your code.


    # Quoting and Escaping Quotes


    The single quote ('''') and double quote (") can be used interchangeably to wrap
    string values in CSS (though if a string starts with one, it must end with the
    same one).


    The backslash (\) is the escape character in CSS. It can be used to escape a quote
    mark that is part of a string (or another backslash that appear as part of the
    string). The backslash character can also be used to include characters via their
    character codes.


    For some string-like references, such as with a url() reference, it is also allowable
    to leave off the quote marks around a string.


    Keywords, such as color names, are not strings and must not be quoted.


    # The CSS Pocket Guide


    Building web pages while wrangling browser bugs takes more than just a text editor
    and a browser. The following are a few categories of tools that are invaluable
    additions to your toolbox.


    # Validation Tools


    Validation tools parse your HTML or CSS documents checking for conformance with
    the designated specification in areas such as syntax errors, missing or improperly
    nested HTML tags, unknown CSS properties, illegal values, or other coding problems.
    The W3C validation service (http://jigsaw.w3.org/css-validator/) is one commonly
    used validator.


    As a tool, the errors a validation service can uncover may help identify where
    visual bugs you''re seeing in browsers derive from. For example, it is common
    that a missing closing tag may cause styles to bleed out of the area you would
    have expected. But be careful and understand errors before reacting to them by
    because some code that you want to use, such as vendor extensions for experimental
    CSS3 implementations, may also be reported as an error based on the validator''s
    settings.


    # Web Inspectors


    Web inspectors (or DOM inspectors) are tools that allow you to view the document
    tree, CSS properties, and other information about a web page as it appears in
    your browser, often with a click on the element itself. These tools are invaluable
    when writing and debugging CSS code, providing real-time information about style
    properties and pointing out which style rules contributed to the element''s appearance.


    - Internet Explorer: Starting with version 8, Internet Explorer includes Developer
    Tools, a set of built-in tools including the ability to inspect HTML elements
    and view CSS information. To launch the tools, press F12 or select Tools > Developer
    Tools from the menu in the IE. For older versions of IE, including 6 and 7, Microsoft
    offers a downloadable extension called the Internet Explorer Developer Toolbar.

    - Firefox: Among its other features, the Firebug extension for Firefox (http://www.getfirebug.org/)
    allows for viewing and editing of the document tree and style property cascade.
    Once installed, you can open Firebug directly or by right-clicking an element
    in the page and choosing Inspect Element.

    - Safari: Safari on OS X and Windows comes with a built-in web inspector. These
    tools are disabled by default, but you can enable them from the Advanced panel
    inside Safari''s preferences. Once enabled, you can open it from the Develop menu
    or right-clicking an element in the page and choosing Inspect Element.

    - Chrome: Chrome also ships with built-in developer tools with similar features
    to those mentioned. To access the tools, select View > Development > Developer
    Tools or right-click an element in the page and choosing Inspect Element.

    - Opera: Opera Dragonfly is another suite of tools for working with web documents
    including viewing information. To activate Dragonfly, select Tools > Advanced
    > Opera Dragonfly from the menu in Opera, or right-click an element in the page
    and choosing Inspect Element.


    # Web Developer Toolbar


    Chris Pederick created the Web Developer Toolbar extension (http://chrispatrick.com/work/web-developer/)
    for Firefox and Chrome that provides some nifty features not found in standard
    inspectors such as the ability to add an overlay above the document that displays
    the document structure or element attributes, resize your browser window to certain
    dimensions for testing, or submit the document to validation services.


    I take some pride in this tool as it is based on the toolbar I had written for
    the now defunct Mozilla Suite, which predated Firefox. That said, Chris deserves
    all the credit now because he has taken it further and supported it with much
    more time and energy than I had.


    # Yahoo! YSlow and Google Page Speed


    Yahoo! YSlow (http://developyahoo.com/yslow/) is a Firefox add-on geared toward
    analyzing and improving the performance of web sites in areas such as caching,
    download sizes, and speeds, as well as reducing the number of requests made to
    the server delivering the content and all its types of assets.


    Through YSlow and its companion suite of tool, you can learn about tools to compress
    CSS documents; optimize server calls for CSS files, JavaScript files, and perform
    lots of other performance tricks not covered directly in this book.


    Google Page Speed (http://code.google.com/speed/page-speed/) is another Firebug
    add-on in a similar vein as YSlow. It can identify which CSS declarations are
    not being utilized by an HTML document and it can point out which of your CSS
    selectors are written inefficiently and why.

