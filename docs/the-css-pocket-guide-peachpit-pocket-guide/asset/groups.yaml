    -moz-border-radius-bottomright: 30px;\n-moz-border-radius-bottomleft: 6px;\nborder-top-left-radius:\
    \ 30px;\nborder-top-right-radius: 6px;\nborder-bottom-right-radius: 30px;\nborder-bottom-left-radius:\
    \ 6px;\n}\n```\n\n图 8.6 扩展 border-radius\n![](img/e804bf8d02cf0721cfa6beaa6fe7ab_161)\n\
    \n> 轮廓属性（Outline properties）与边框相似，但不占据空间。它们通常用于突出显示状态的元素。\n\n## Outline\n\n轮廓与边框相似，但不占据空间。它们通常用于突出显示状态的元素。\n\
    \n## outline-color\n\n轮廓的颜色。\n\n## outline-style\n\n轮廓的样式。\n\n## outline-width\n\
