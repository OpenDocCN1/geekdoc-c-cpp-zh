  raw:
  - '[PAGE 175]


    # font-weight


    The font-weight property controls the weight, or thickness, of the characters
    in a font.


    +   - normal | bold: Keywords representing normal weight type (default) and bolded
    type


    +   - bolder | lighter: Sets a weight relative to the weight inherited from the
    parent element


    +   - 100 to 900: A nine-step scale, in increments of 100, ranging from (100)
    to black (900)


    > note Though a nine-step scale for font weights is defined, browsers typically
    display only two distinct steps—normal (400) and bold (700).


    # font-variant


    Some typefaces are designed with several variant character sets, including a set
    of small caps shapes. The font-variant allows selection of alternate set of characters.


    +   - normal: Selects the normal variant of a font face (default).


    +   - small-caps: Selects the small caps variant of a font face. If none exists,
    small caps are simulated.


    # font-style


    The style of the font is declared using the font-style property.


    +   - normal: Normal, upright, type (default).


    +   - italic: Italicized type.


    +   - oblique: Oblique type. If no oblique style is provided for a typeface, italic
    may be used.'
  - '[PAGE 176]


    # line-height property


    The line-height property defines the height of each line of text (line box). Leading,
    or vertical spacing between each line, is created by specifying a line-height
    that is larger than the content height (font-size).


    +   - normal: A reasonable default value specified by the browser; commonly 1.2

    - <number>: A numeric multiplier applied to the font size to calculate the line-height

    - <length>: A specific length value

    - <percentage>: A percentage of the element''s font-size


    # font (Shorthand)


    The font shorthand property allows for assigning the individual font properties
    (font-style, font-variant, font-weight, font-size/line-height, font-family) in
    the same place. Note that although most shorthand properties allow for individual
    property values to be left out and assume the default or inherited value, at minimum
    font-size and font-family must be declared. Also, the value of the line-height
    property must be paired with the font-size value in the format of font-size/line-height,
    such as 1.2em/1.4.


    (continues on next page)'
