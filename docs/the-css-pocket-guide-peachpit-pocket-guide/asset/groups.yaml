    \ 6.8 和 6.9 中所示。\n\n图 6.8\n左浮动的各种元素。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_119_0.png)\n\
    \n图 6.9\n右浮动的各种元素。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_119_1.png)\n\n\
    # 第 6 章：定位与浮动\n\n浮动元素无法在垂直方向上出现在文档中位于它们之前的元素之前。在现代布局技术中，浮动元素的应用不仅限于文本环绕的小块内容。它们可以作为将元素放置在行两侧的基础。\n\
