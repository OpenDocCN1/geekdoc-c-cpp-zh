    在浏览器厂商实现渲染模式期间，Web 在很大程度上是 HTML4、针对浏览的代码和“最佳查看……”的混乱。只有少数开发者编写有效代码、阅读规范并使用 XHTML
    等类型。这提供了一个利用声明（或缺失声明）来指示代码类型从而在模式之间切换的机会。


