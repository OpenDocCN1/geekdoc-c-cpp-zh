  - '[PAGE 233]


    # Print Media


    The printed page, while having many similarities to the screen, differs in many
    ways as well, most notably that the contents of a document are split across multiple
    fixed-sized pages rather than one single continuous viewport. The properties listed
    in this section help control the presentation of each of those pages by offering
    guidelines about where those page breaks occur within the document''s.


    # page-break-before and page-break-after


    These two properties define whether a page break occurs before or after a piece
    of content, which is most useful when applied to articles, headers, tables, or
    other “blocks” of content.


    +   * auto: The user agent determines the most appropriate places for a page break
    (default).

    * always: This tells the user agent to always break before (or after) the selected
    element.

    * avoid: This tells the user agent to attempt to avoid breaks before (or after)
    the selected element.


    # page-break-inside


    The page-break-inside property allows for the restriction of page breaks inside
    a given element’s content.


    +   * auto: The user agent determines when it is appropriate to place a page break
    inside an element''s content (default).

    * avoid: This tells the user agent to avoid page breaks within the element''s
    content.


    For all page break properties, the page breaks may be unavoidable, for example
    when a single element is larger than a single page. The'
  - '[PAGE 234]


    # Chapter 12: Media: Printing and Other Devices


    value avoid will cause browsers to attempt not to generate a page break, however,
    and as the name avoid implies, it is just an attempt and not an absolute rule.


    Browser support for the page break properties is quite mixed, and some browsers
    have more complete support for individual values than others. You can find a good
    breakdown and notes on support for the page break-related properties at the Sitepoint
    CSS Reference (http://reference.sitepoint.com/css/pagedmedia) or at the Mozilla
    Developer Center (https://developer.mozilla.org/en/CSS_Reference).


    # # @page Rule


    The @page rule exists as a way of setting properties of the page such as margins
    or orientation. At the time of this writing, the features of @page from CSS2 and
    CSS3 are quite poorly supported (Opera being the one shining star), so it isn''t
    worth presenting the properties in detail.


    # # Print Considerations


    The presentation, width, color schemes, navigational elements, and other design
    features of many web pages may be appropriate for the screen, but not as much
    when printed. If someone is printing out an article, recipe, or event information
    from your web site, the last thing they are looking for is half the first page
    taken up by navigation and advertising and an extra page at the end taken up with
    nothing but the footer content and repeated navigation links.


    To prepare pages for print, a few types of styles are often changed to provide
    the best printed experience (and not waste your visitor’s paper or ink).


    +   - Hide the sidebar, navigation, or other site “meta” elements that are presented
    on the screen to help when interacting with the site on the screen. Branding elements,
    logos, and legal information are still'
- md: "\n# 212 The CSS Pocket Guide\n\nimportant and typically carry through to the\
    \ print version. Still, liberal with your use of display:none.\n\n- Adjust font\
    \ sizes, line heights, and other typographic properties to maximize legibility\
    \ at a typical printed page size.\n\n- Contrast is different in print than on\
    \ the Web, and backgrounds can make for difficult-to-read pages covered in ink.\
    \ Hide background images, change background colors to white, and change text colors\
    \ to the darker shades or even black for the best printing and reading experience.\n\
    \n> note Many browsers drop background images or similar styles when printing,\
    \ either by default or by user-selected settings without explicitly changing them.\n\
    \nThe Print Preview option from your favorite browser will display with any style\
    \ sheet targeting the print media type and is a great way to test your changes\
    \ to the print presentation without wasting reams of paper.\n\n# Hyperlinks and\
    \ Generated Content\n\nPrinted HTML documents do not display information that\
    \ may be valuable to the user to have in that printed form. The destination of\
    \ hyperlinks is only one of the pieces of information lost if only viewing the\
    \ text. Generated content can be used to display the contents of the href attribute\
    \ beside the link text.\n\n```css\n@media print {\n  a:link::after,\n  a:visited::after\
    \ {\n    content: \" (\" attr(href) \")\";\n    color: #666;\n    font-style:\
    \ italic;\n  }\n}\n```\n\nYou also might want to consider printing the following:\
    \ contents of title attributes, contents of tabbed boxes, and other content that\
    \ is initially rendered with display:none and meant to be revealed based on user\
    \ interaction.\n\n# Mobile Media\n\nHandheld and mobile devices typically have\
    \ small physical screens (even as they have increasingly higher resolutions).\
    \ They also have slightly different interaction models such as touchscreens or\
    \ heavily keyboard- or tab-based movement.\n\n# Mobile Considerations\n\nThe smaller\
    \ screen and slower connection typical of handheld devices are key factors in\
    \ mobile web development and may drive a “less is more” approach to these devices.\n\
    \n- The slower connection speed and cost of transferring data on mobile plans\
    \ can make it desirable to rely more on the default browser style sheet than you\
    \ would in a screen context.\n- The touch interface on many smartphones and tablets\
    \ may drive the need for links and buttons to appear larger, and the spacing between\
    \ items should be clear to avoid fumbling fingers the wrong item.\n- Feature phones,\
    \ unlike smartphones, offer a limited subset of CSS and a limited layout capability\
    \ or canvas size. Display and navigation on these devices can also be very linear\
    \ (left to right, top to bottom), so the positioning and complex element layouts\
    \ may be ignored.\n\nThough some smartphones have wonderful browsers and deal\
    \ well navigating conventional web sites, targeting handheld devices with CSS\
    \ changes alone may not always lead to the best experience for folks because often\
    \ the types of content or the tasks that mobile visitors are looking for on your\
    \ site are different from the desktop browser version. Thus, having a separate\
    \ mobile web site may sometimes be a better option than just feeding the same\
    \ HTML content with a different set of styles to these visitors.\n\n# Media Queries\n\
    \nNew in CSS3, media queries add a syntax for describing the characteristics and\
    \ features of the device being used to view a page, allowing for more precise\
    \ control or better targeting of those features that might be why you provide\
    \ one set of styles over another. The following code demonstrates how to target\
    \ a handheld device in landscape orientation (wider than it is tall):\n\n```css\n\
    @handheld and (orientation:landscape) {\n  [...]\n}\n```\n\nThe following links\
    \ to an external CSS file only if the browser (viewport) width is a color device\
    \ that's wider than 600 pixels, regardless of media type:\n\n```html\n<link type=\"\
    text/css\" media=\"color and (min-width:600px)\" src=\"default.css\">\n```\n\n\
    As shown in the previous examples, you can combine media features into a more\
    \ complex description using the and keyword. You can use the not keyword to negate\
    \ a media description (or media type) such as in the following example of targeting\
    \ any nonscreen media type:\n\n```html\n<link type=\"text/css\" media=\"not screen\"\
    \ src=\"alternate.css\">\n```\n\nThe only keyword does not logically impact the\
    \ result of the media query expression; however, it creates a value for the media\
    \ attribute so that browsers that do not support media queries cannot parse into\
    \ a common media type they support and thus can be used to hide styles from these\
    \ browsers.\n\n# Media Features\n\nThe following is a list of media features for\
    \ which you can specify in a media query expression.\n\nSince the chances that\
    \ you will have declared the precise viewport width, measured to the pixel (or\
    \ ems or other <length> unit), is quite slim, you can specify the width feature\
    \ as a min-width or max-width. This holds true of the other features where specified.\n\
    \n- width: The width of the viewport or page box; accepts min- and max-prefixes.\n\
    - height: The height of the viewport or page box; accepts min- and max-prefixes.\n\
    - device-width: The full width of the device screen or printed page; accepts min-\
    \ and max-prefixes.\n- device-height: The full height of the device screen or\
    \ printed page; accepts min- and max-prefixes.\n- orientation: Matches the keyword\
    \ landscape when the width is greater than the height; portrait when the height\
    \ is greater than the width.\n\n# 216 The CSS Pocket Guide\n\n- aspect-ratio:\
    \ The aspect ratio of viewport as described by width/height; accepts min- and\
    \ max-prefixes.\n- device-aspect-ratio: The aspect ratio of the device as described\
    \ by device-width/device-height; accepts min- and max-prefixes.\n- color: The\
    \ number of bits of color; 0 for noncolor devices; accepts min- and max-prefixes.\n\
    - color-index: The number of individual colors supported by the device; 0 for\
    \ noncolor devices; accepts min- and max-prefixes.\n- monochrome: The number of\
    \ bits used to describe the monochrome shades available; 0 for nonmonochrome devices;\
    \ accepts min- and max-prefixes.\n- resolution: The resolution of the output device\
    \ measured in dpi (dots per inch) or dcm (dots per centimeter); accepts min- and\
    \ max-prefixes.\n- scan: The scan type for television media types; values are\
    \ progressive and interlace.\n- grid: A grid device is a device such as a TTY\
    \ terminal or a feature phone that has a single fixed-font display.\n\n# Responsive\
    \ Design\n\nIn Chapter 7 you learned about building fixed and flexible layout\
    \ grids as well as setting limits on flexible layouts using the min-width and\
    \ max-width properties. You can use these techniques to make adaptive layouts\
    \ that find a compromise between the best presentation and readability of the\
    \ content and the viewport device is giving you to work with.\n\nBut what if you\
    \ could adapt the layout from the standard two-column layout into a one-column\
    \ layout for narrower browsers or bringing the footer up into a third column for\
    \ insanely wide screens? Or if you could adjust the size of header type or swap\
    \ background images so body copy remains at a standard, readable size?\n\n# Chapter\
    \ 12: Media: Printing and Other Devices 217\n\nThis adaptation of presentation\
    \ has been dubbed responsive design. It takes the standard mechanics of flexible\
    \ grids, relative sizing of fonts, and other content elements uses media queries\
    \ to change the positioning of content, the sizing of elements, and the overall\
    \ layout grid to respond to the viewport.\n\nFor an in-depth review of media queries\
    \ and how you can use them to design pages that do not adapt to just media but\
    \ also to other browser scenarios, see Ethan Marcotte's article “Responsive Web\
    \ Design” (http://www.alistapart.com/articles/responsive-web-design/).\n\n# Browser\
    \ Support\n\nMedia queries are currently supported in Safari 3+, Firefox 3.5+,\
    \ Opera 7+, Internet Explorer 9+, mobile WebKit, and Opera Mobile. Therefore,\
    \ there is wide support for them, except for IE 6 through IE 8's large chunk of\
    \ the desktop market.\n\nIt isn’t so bad, though, the support (or lack thereof)\
    \ can be taken into consideration as just another device criteria in many instances.\
    \ For mobile development, you’re most likely putting handheld device types into\
    \ two or three buckets already—first specifying the most devices and then breaking\
    \ smartphones by screen size or orientation. The following example shows a baseline\
    \ style sheet going to all handhelds and then using media queries with more specific\
    \ style sheets for more capable devices:\n\n```html\n<link type=\"text/css\" media=\"\
    handheld\" src=\"basic.css\">\n<link type=\"text/css\" media=\"handheld and portrait\
    \ and color\" src=\"enhanced_portrait.css\">\n<link type=\"text/css\" media=\"\
    handheld and landscape and color\" src=\"enhanced_landscape.css\">\n```\n"
  mdcn: "\n\n# 212 CSS 便携指南\n\n这些非常重要，且通常会延续到打印版本。尽管如此，请在使用地使用 `display:none`。\n\n\
    - 调整字体大小、行高和其他排版属性，以在典型的打印页面尺寸下实现可读性最大化。\n\n- 打印时的对比度与 Web 页面不同，背景可能会导致页面布满墨水而难以阅读。隐藏背景图像，将背景颜色更改为白色，并将文本颜色更改为更深色调甚至黑色，以获得最佳的打印和阅读体验。\n\
    \n> 注意：许多浏览器在打印时会默认（或根据用户选择的设置，无需显式更改）丢弃背景图像或类似的样式。\n\n你喜喜欢的浏览器提供的“打印预览”选项将显示任何针对打印媒体类型（print\
    \ media type）的样式表，这是在不浪费大量纸张测试你对打印呈现修改的极佳方法。\n\n# 超链接与生成内容\n\n打印的 HTML 文档不会显示某些对用户来说以打印形式存在可能有价值的信息。超链接的目标仅是仅查看文本时会丢失的信息之一。通过生成的内容可以在链接文本旁边显示\
    \ `href` 属性的内容。\n\n```css\n@media print {\n  a:link::after,\n  a:visited::after\
    \ {\n    content: \" (\" attr(href) \")\";\n    color: #666;\n    font-style:\
    \ italic;\n  }\n}\n```\n\n你可能还会考虑打印以下内容：`title` 属性的内容、选项卡框的内容，以及初始以 `display:none`\
    \ 渲染并旨在根据用户交互显示的其他内容。\n\n# 移动媒体\n\n手持和移动设备通常具有较小的物理屏幕（尽管它们的分辨率越来越高）。它们还具有稍微不同的交互模型，例如触摸屏或高度依赖键盘或标签的移动。\n\
    \n# 移动端考量\n\n手持设备典型的较小屏幕和较慢连接是移动 Web 开发的关键因素，并可能促使这些设备采用“少即是多”的方法。\n\n- 移动套餐中较慢的连接速度和数据传输成本可能使得，在屏幕环境下比平时更多地依赖默认浏览器样式表是理想的。\n\
    - 许多智能手机和平板电脑的触摸界面可能需要链接和按钮显示更大，且项目之间的间距应该清晰，以避免手指误触错误项目。\n- 功能手机与智能手机不同，提供有限的\
    \ CSS 子集以及有限的布局能力或画布尺寸。这些设备上的显示和导航也可以是非常线性的（从左到右，从上到下），因此可以忽略定位和复杂的元素布局。\n\n尽管某些智能手机拥有优秀的浏览器并能很好地导航传统网站，但仅通过\
    \ CSS 更改来针对手持设备并不总是能为人们带来最佳体验，因为移动访问者在你的网站上寻找的内容类型或任务通常与桌面浏览器版本不同。因此，拥有一个独立的移动\
    \ 网站有时比仅向这些访问者提供一组不同样式的相同 HTML 内容是更好的选择。\n\n# 媒体查询 (Media Queries)\n\nCSS3 的新功能，媒体查询增加了一种用于描述查看页面的设备特性和特征的语法，允许对可能导致你提供一组样式而非另一组样式的特征进行更精确的控制或更好的目标定位。以下代码演示了如何针对横向方向（宽大于高）的手持设备：\n\
    \n```css\n@handheld and (orientation:landscape) {\n  [...]\n}\n```\n\n以下链接仅在浏览器（视口）宽度为大于\
    \ 600 像素的彩色设备时（无论媒体类型如何）链接到外部 CSS 文件：\n\n```html\n<link type=\"text/css\" media=\"\
    color and (min-width:600px)\" src=\"default.css\">\n```\n\n如前面的示例所示，你可以使用 `and`\
    \ 关键字将媒体特征组合成更复杂的描述。你可以使用 `not` 关键字来否定媒体描述（或媒体类型），例如下面的针对任何非屏幕媒体类型的示例：\n\n```html\n\
    <link type=\"text/css\" media=\"not screen\" src=\"alternate.css\">\n```\n\n`only`\
    \ 关键字在逻辑上不影响媒体查询表达式的结果；然而，它为 `media` 属性创建了一个值，使得不支持媒体查询的浏览器无法将其解析为它们支持的通用媒体类型，从而可以用它来隐藏这些浏览器的样式。\n\
    \n# 媒体特征 (Media Features)\n\n以下是可以在媒体查询表达式中指定的媒体特征列表。\n\n由于你声明精确的视口宽度（以像素、或 `ems`\
    \ 或其他 `<length>` 单位测量）的概率微乎其微，因此你可以将宽度特征指定为 `min-width` 或 `max-width`。这对于指定的指定的特征同样适用。\n\
    \n- width：视口或页面框的宽度；接受 `min-` 和 `max-` 前缀。\n- height：视口或页面框的高度；接受 `min-` 和 `max-`\
    \ 前缀。\n- device-width：设备屏幕或打印页面的全宽；接受 `min-` 和 `max-` 前缀。\n- device-height：设备屏幕或打印页面的全高；接受\
    \ `min-` 和 `max-` 前缀。\n- orientation：当宽度大于高度时匹配关键字 `landscape`（横向）；高度大于宽度时匹配 `portrait`（纵向）。\n\
    \n# 216 CSS 便携指南\n\n- aspect-ratio：由 `width/height` 描述的视口宽高比；接受 `min-` 和 `max-`\
    \ 前缀。\n- device-aspect-ratio：由 `device-width/device-height` 描述的设备宽高比；接受 `min-`\
    \ 和 `max-` 前缀。\n- color：位数；非彩色设备为 0；接受 `min-` 和 `max-` 前缀。\n- color-index：设备支持的独立颜色数量；非彩色设备为\
    \ 0；接受 `min-` 和 `max-` 前缀。\n- monochrome：用于描述可用单色位数；非单色设备为 0；接受 `min-` 和 `max-`\
    \ 前缀。\n- resolution：输出设备的分辨率，以 dpi（每英寸）或 dcm（每厘米）测量；接受 `min-` 和 `max-` 前缀。\n-\
    \ scan：电视媒体类型的扫描类型；值为 `progressive`（逐行）和 `interlace`（隔行）。\n- grid：网格设备例如 TTY 终端或具有固定字体手机。\n\
    \n# 响应式设计 (Responsive Design)\n\n在第 7 章中，你学习了构建固定和灵活布局网格，以及使用 `min-width` 和 `max-width`\
    \ 设置限制。你可以使用这些技术制作自适应布局，在最佳呈现效果和内容可读性之间找到平衡。\n\n但如果你可以将标准的双列布局为较窄的浏览器调整为单列布局，或者为极宽屏幕将页脚移至第三列呢？或者你可以调整标题尺寸或更换背景图像，以使正文保持在标准的可读尺寸？\n\
    \n# 第 12 章 媒体：打印和其他设备 217\n\n这种呈现方式的适配被称为响应式设计。它利用灵活网格、字体的相对大小和其他内容元素的标准机制，通过媒体查询来根据视口更改内容的定位、元素的尺寸以及整体布局网格。\n\
    \n关于媒体查询的深度以及以及使用它们设计不仅适应媒体而且适应其他浏览器场景的页面，请参见 Ethan Marcotte 的文章 [Responsive Web\
    \ Design](http://www.alistapart.com/articles/responsive-web-design/)。\n\n# 浏览器支持\n\
    \n媒体查询目前支持 Safari 3+、Firefox 3.5+、Opera 7+、Internet Explorer 9+、移动 WebKit 和 Opera\
