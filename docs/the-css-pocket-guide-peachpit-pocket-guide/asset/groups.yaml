    # Chapter 9: Typography and Web Fonts


    Flash Shea has written a good overview and comparison of some the code behind
    various image replacement techniques (http://mezzoblue.com/tests/revised-image-replacement/).


    # Flash Replacement with sIFR


    The sIFR project (http://www.mikeindustries.com/blog/sifr) uses a Flash to replace
    the existing text content and redraw it on the fly in the desired typeface. sIFR
    uses a two-step process where the browser renders the HTML content based on the
    styles in CSS, and then, through JavaScript, a Flash object is created to replace
    the HTML content. Information on the element content and its styling are passed
    to the Flash object, making the system more adaptive when compared to simple image
    replacement.


    The major upside over the image replacement is in the maintenance. A set of images
    doesn''t need to be created each time content is changed, allowing easier for
    content such as blog posts. The major downside is that it does require both JavaScript
    and Adobe Flash Player (with a fallback to the original styled HTML content).


    # JavaScript Replacement with Cofón


    The Cofón project (http://wiki.github.com/sorcu/cufon/) is a toolkit that was
    built as an alternative to the Flash plugin-in sIFR. It replaces the HTML-based
    type with a non-plugin-based canvas or VML content based on the visitor''s browser.


    sIFR, this requires turning the font into a new format (here, an SVG-based font)
    and then using a JavaScript-based tool to read in the HTML page as it loads and
    replace the designated elements with a new rendering component.'
