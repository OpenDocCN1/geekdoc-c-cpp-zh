    browser or trimming default rules when they’re too overbearing (as in the case
    of form elements). Whichever one you use, look it over before you use it on a
    project to make sure it isn''t doing anything you don''t want (such as setting
    colors or font sizes).'
  - '[PAGE 244]


    # Eric Meyer''s Reset


    Eric Meyer''s Reset (http://meyerweb.com/eric/tools/css/reset/index.html) is widely
    used and can be found at the core of many larger projects including some of the
    frameworks discussed later in this chapter.


    # YUI Library CSS Reset


    The YUI Library CSS Reset (http://developer.yahoo.com/yui/3/css-reset/) is similar
    but handles a few properties differently, including applying foreground and background
    colors. It is available to link directly from Yahoo!''s servers, which can help
    with download speed and caching.


    # HTML5 Reset


    The HTML5 Reset from Richard Clark (http://htmldoctor.com/html-5-reset-stylesheet/)
    builds on the Eric Meyer''s Reset and makes some modifications to sync with new
    or deprecated elements in the HTML5 specification.


    # Why Not Reset?


    There are two strong arguments against resetting.


    Resets can be a blunt instrument. A rule such as { margin: 0; padding: 0; } may
    have undesirable effects on form elements. On the flip side, explicitly picking
    a list of elements may mean some elements (old deprecated elements such as <center>
    or new HTML elements such as <article>) slip through the cracks.


    Not resetting in the first place means not having to re-create common styles like
    those for emphasis, list indentation, and bullets that are already set by the
    browser. Also, edge cases or little-used HTML elements (<dl>, <cite>, <legend>)
    and markup patterns (<ul> in a <blockquote>) must be tested to make sure that
    content added to the site later is properly styled.'
  - '[PAGE 245]


    The type of content appearing on the site will weigh heavily on the appropriateness
    of a reset. A text-heavy site such as a blog may want to leave more of the browser
    styling intact, while an application or e-commerce site that relies on smaller
    content elements want to be more controlled. Ultimately, the choice to zero out
    styles at the beginning of a project''s code is one of taste and how you prefer
    to work rather than one of purely technical merit.


    # Cross-Browser CSS via JavaScript


    You can use a CSS reset to create an even starting point for styling individual
    page elements. But they don''t create that same level ground for browsers'' support
    for newer selectors and CSS properties. A drop-in JavaScript bridge library may
    be a convenient way to bridge the gaps in CSS support so that older browsers function
    like more recent browsers.


    When the included library loads, it will typically test the browser''s support
    against a list of CSS features. If a feature is supported, the script will do
    nothing. However, for those unsupported features, it will comb the style sheet
    code for their use and then attempt to replicate the behavior of the unsupported
    CSS through scripting.


    You can use JavaScript to check for all CSS 2.1 or CSS3 features missing in a
    browser, and other libraries are written to target specific gaps in support.


    # Common Bridge Libraries


    There are many JavaScript bridge libraries available to use on your projects,
    each approaching the task of extending support for the CSS code you''ve written
    in different ways.'
  - '[PAGE 246]


    # IE7.js


    The goal of IE7.js (http://code.google.com/p/ie7-js/) is to make Internet Explorer
    5.5 and 6 behave like and support the features of Internet Explorer 7. This includes
    fixing some HTML and CSS bugs as well as adding support for alpha-transparent
    PNG images. This may seem like a baby step, if IE7 is among your target browser
    matrix and your code is already stable there, you may not need to do more than
    this to get IE6 in line.


    IE8.js and IE9.js scripts are also part of the project, by Dean Edwards, providing
    similar version bridging support (to match IE8 and IE9, respectively).


    # Selectizr


    Keith Clark''s ie-css3.js (http://selectizr.com/) is an example of a project that
    aims to add missing selector support (:first-child, :nth-child(), [attr], and
    so on) to Internet Explorer 6 through 8. It remains lightweight by leveraging
    other JavaScript libraries already included in the document, such as jQuery or
    MooTools, that have selector tools.


    # eCSStender


    Aaron Gustafson''s eCSStender (http://ecsstender.org/) provides a flexible framework
    for all browsers for fixing browser bugs or lack of support as well as helping
    navigate the tangle of vendor extension usage in modern browsers. Extensions are
    available that add support for CSS3 features such as transitions, transforms,
    and rgba()/hsla() colors in older browsers.


    # Modernizr


    Unlike the previous libraries mentioned, Modernizr (http://www.modernizr.com/)
    does not itself add support for any missing feature'
  - '[PAGE 247]


    # The CSS Pocket Guide


    or browser bug. Instead, it provides feature detection, the results of which can
    be referenced from your CSS or JavaScript code. Classes such as .multiplebegs
    or .no-multiplebegs are added to the <html> element of your document, allowing
    you to define an alternate set of styles.


    # More Targeted Solutions


    Another class of scripts does not attempt to fix a group of CSS features or fix
    a specific browser''s problems, instead targeting a very specific CSS feature.


    The rounded corners discussion in Chapter 8 mentioned using JavaScript to create
    DOM elements to apply rounded corner effects for browsers that do not support
    the border-radius property. CurvyCorners(https://www.curvycorners.net/) is one
    library that does this for you and is an example of a library that is used to
    target one specific gap in browser support rather than going after a larger class
    of problems.


    # Why Not Use JavaScript?


    These JavaScript libraries can be useful to bring a browser in line with the A-grade
    browsers you''re targeting with your CSS code, but they can be overkill. By design,
    many of these libraries attempt to fix most or all problems with a browser, whereas
    your project may have only one or two unsupported features or browser bugs that
    need to be fixed. Why load a script to add support for :not() selector or border-radius
    property if it does not appear in your code?


    When there are just a few features that would have to be fixed in this manner,
    it may be more efficient to find alternate ways to code the effects through CSS
    and HTML rather than turn to scripting. There may be other selectors you can use,
    for example. In browsers with lower usage, it may be OK just to leave things unsupported.'
- md: "\nLikewise, if you are tasked with building a site where you know have older\
    \ browsers in that A- or B-grade classification (Chapter 2), you probably will\
    \ want to avoid some of the unsupported selectors or cutting-edge CSS3 features\
    \ while building the site. This will ensure that your targets are met and your\
    \ site displays properly, even without JavaScript enabled, in the largest segment\
    \ of your user base.\n\nThese bridge libraries are best when you have a few encore\
    \ elements of the design you'd like to see supported in a wider space or when\
    \ you're looking to help out the lower-grade browsers that you'd still like to\
    \ deliver the full experience to.\n\n## CSS Frameworks\n\nWith so many millions\
    \ of sites being designed each year, it is a good assumption that any new project\
    \ that comes along will have a layout grid or other layout properties that may\
    \ have already been built for another site. there are details or contexts of content\
    \ items that will be unique, but patterns will emerge from the layout grid or\
    \ other areas that can be transferred from one project to another.\n\nOpen source\
    \ frameworks allow developers to share these patterns and conventions, start with\
    \ a tested baseline of code, and spend time on the specifics instead of retyping\
    \ code.\n\nThese frameworks include not only a style sheet but also HTML markup\
    \ patterns and examples for accomplishing common tasks such as a layout grid.\n\
    \nIf you're using a popular content management system (CMS), there may be a theme\
    \ or template that combines a CSS framework with the basic markup and application\
    \ features already included. The Sandbox theme for WordPress is a good example\
    \ of this generic baseline with which to work from.\n\n## Common CSS Frameworks\n\
    \nFar from a comprehensive listing, here are a few frameworks that have become\
    \ popular because of the quality of their code and their flexibility.\n\n### Blueprint\n\
    \nBlueprint (http://www.blueprintcss.org/) provides a broad starting point for\
    \ starting to build a site including a reset, layout grid tools, and baseline-\
    \ typographic and font styling. There are also plug-ins and examples for common\
    \ content elements such as tabs, buttons, and iconography.\n\n### 960\n\nThe 960\
    \ grid system (http://960.gs/) takes a 960-pixel area and allows you to specify\
    \ a 12- or 16-column grid with 20-pixel gutters between them. This split, and\
    \ the code that is generated and provided for you to place content in the grid,\
    \ allows you to quickly put a page layout together. The sizing and spacing rules\
    \ offer a very controlled grid to design a site from without being too restrictive.\n\
    \n### Object Oriented CSS (OOCSS)\n\nAs code philosophy as framework, Object Oriented\
    \ CSS (http://wiki.github.com/stubbornella/ocss/ or http://ocss.org), spearheaded\
    \ by Nicole Sullivan, focuses on content elements first. It breaks down the content\
    \ into pieces and modules and uses their similarities to define a common language\
    \ of content labels applied as class names. This is particularly useful for large\
    \ sites because it takes full advantage of the cascading aspects of CSS to help\
    \ maintain consistency across the many different content types typical of larger\
    \ web sites.\n\n### YUI Library\n\nThe Reset file I mentioned earlier is just\
    \ a small part of the YUI Library. The larger project is comprised of a baseline\
    \ set of CSS files, baseline JavaScript files, and components for common web application\
    \ interface components such as cookie access, drag-and-dropped elements, date\
    \ pickers, and sliders. Similar interface widget libraries are available from\
    \ jQuery, script.aculus, and MochaUI. They all provide a collection of widgets\
    \ to choose from and rules for embedding and skinning those elements, but they\
    \ do not offer the more general reset and framework aspects that YUI does.\n\n\
    ## Why Not Use a Framework?\n\nLike any other tool, frameworks are developed with\
    \ certain priorities based on the specific problems developers are attempting\
    \ to solve. As they evolve, they may become more generic, but each framework maintains\
    \ these priorities that are sometimes not the same as your needs on any given\
    \ project.\n\nFor instance, the YUI tools tend to be a bit more web application\
    \ focused, and OOC works best when the site is complex enough to have the depth\
    \ of content types to manage. Attempting to go against the grain will cause you\
    \ to write more code than you'd save and will cause you more headaches than starting\
    \ from scratch.\n\n## Beyond Frameworks\n\nFrameworks provide a starting point\
    \ to begin developing a web site, but they don't change how you write and edit\
    \ CSS code. All the rules of inheritance, specificity, source order, and syntax\
    \ discussed in this book continue to apply for any site-specific code you add\
    \ on top of a chosen framework.\n\nThere is an emerging class of tools for authoring\
    \ and generating CSS code that makes small modifications to the language and allows\
    \ helpers such as variables and selector nesting to be used. These changes remove\
    \ some of the repetition and document searching that typically come with building\
    \ and maintaining styles for a larger site.\n\n## CSS Preprocessors\n\nTo turn\
    \ the written code back into code in a syntax, browsers understand a conversion\
    \ layer (preprocessor) is added as a compilation step via tools on your local\
    \ development machine or via server-side scripts.\n\n### Less\n\nLess(https://lesscss.org/)\
    \ is a Ruby gem that adds the ability to include the CSS rules from one selector\
    \ into another (a mixin), selector nesting, simple mathematical formulas, and\
    \ variables that stand in values so colors, sizes, and other values need to be\
    \ typed only once. The following is an example of both a variable definition and\
    \ a nested rule as written using Less:\n\n```\n@highlight_color: #aaa;\nblockquote\
    \ {\n  font-size: 1.4em;\n  a {\n    text-style: italic;\n    background-color:\
    \ @highlight_color;\n  }\n}\n```\n\nThe previous code gets compiled into the following\
    \ final code that gets sent to the visitors' browsers:\n\n```\nblockquote {\n\
    \  font-size: 1.4em;\n}\nblockquote a {\n  text-style: italic;\n  background-color:\
    \ #eaa;\n}\n```\n\n### Sass\n\nSass (http://sass-lang.com/) is also a Ruby gem\
    \ and offers variable, mixin, math, and nesting features similar to Less. It has\
    \ two different syntaxes to choose from, one similar to CSS (and Less) and an\
    \ alternate syntax that breaks from the brackets and colons of CSS into a tab-based\
    \ style some may find more readable or manageable.\n\n## The Not Too Distant Future\
    \ of CSS\n\nAs CSS has evolved as a language, it has often attempted to make common\
    \ tasks that may be difficult or inflexible quite easy. Some of these new properties\
    \ are based on experimental properties in individual browsers, but often they’re\
    \ based on design and code patterns used every day by developers.\n\nFor example,\
    \ the need to use multiple HTML elements as hooks so that multiple background\
    \ images can be used (shown in Figure 7.4), and the frequency with which this\
    \ is done, has led to CSS changes that support multiple background images on a\
    \ single element, as you saw in Chapter 8.\n\n## 232 The CSS Pocket Guide\n\n\
    Several CSS3 features have been covered in previous chapters because they have\
    \ broad support in modern browsers, they are used to accomplish enhancements without\
    \ major impact if not supported, or both. Either way, they can be incorporated\
    \ into the toolbox for most new projects.\n\nThis chapter will give you a look\
    \ at other new properties you can use today as well as what is come. In some cases,\
    \ these features have much less support in current browsers than the features\
    \ covered elsewhere. Included in this chapter is information on current browser\
    \ support for each property to help you make an informed decision which of these\
    \ properties have enough support to find their way into your projects. Check the\
    \ already mentioned browser support charts or When Can I Use... (https://aniuse.com/)\
    \ for detailed and current browser support information before deciding to use\
    \ each property.\n\n### The box-shadow Property\n\nDrop shadows, either solid\
    \ or feathered edges, can be drawn behind content boxes using the box-shadow property.\
    \ CSS3 box shadows are more flexible than you might be able to do with older techniques\
    \ such as using a fixed-sized, semitransparent PNG image as the back-ground image\
    \ of an item. The box-shadow property can take one or more comma-separated <shadow>\
    \ definitions.\n\n- none: No shadow is drawn.\n- <shadow>: The definition of a\
    \ shadow.\n\nThe description of a CSS <shadow> has three parts: two to four <length>\
    \ values, a shadow <color>, and an optional inset keyword. The <length> values\
    \ represent, in order, the horizontal offset of the shadow, the vertical offset\
    \ of the shadow, the blur distance (Ø is no blur), and a spread\n"
  mdcn: "\n同样，如果你被要求构建一个已知在使用较旧（分类为 A 类或 B 类（第 2 章）的浏览器的网站，那么在构建网站时，你可能希望避免某些不受支持的选择器或前沿的\
    \ CSS3 特性。这将确保你的目标得以实现，并且即使在大部分用户群体未启用 JavaScript 的情况下，你的网站也能正常显示。\n\n当你有几个设计中的“返场元素”希望在更广泛的范围内获得支持，或者当你正寻求帮助那些你仍然希望为其提供完整体验的低级浏览器时，这些桥接库是最好的。\n\
    \n## CSS 框架\n\n考虑到每年有数百万个网站被设计，可以假设任何新项目都可能包含一个布局网格或其他布局属性，而这些属性可能已经为另一个网站构建过了。虽然内容的细节或语境是唯一的，但从布局网格或其他区域中显现的模式是可以从一个项目转移到另一个项目的。\n\
    \n开源框架允许开发者共享这些模式和规范，从经过测试的代码基准开始，并将时间花在细节上而不是重新编写代码。\n\n这些框架不仅包括样式表，还包括 HTML\
    \ 标记模式以及用于完成布局网格等常见任务的示例。\n\n如果你正在使用流行的内容管理系统（CMS），可能会有一个主题或模板，将 CSS 框架与已包含的基础标记和应用功能结合起来。WordPress\
    \ 的 Sandbox 主题就是这种以此为工作的通用基准的良好示例。\n\n## 常见 CSS 框架\n\n这并非详尽的列表，这里有几个由于其代码质量和灵活性而流行的框架。\n\
    \n### Blueprint\n\nBlueprint (http://www.blueprintcss.org/) 为构建网站提供了一个广泛的起点，包括重置（reset）、布局网格工具以及基础的排版和字体样式。还有针对常见内容元素（如标签、按钮和图标）的插件和示例。\n\
    \n### 960\n\n960 网格系统 (http://960.gs/) 取一个 960 像素的区域，允许你指定一个 12 列或 16 列的网格，列之间有\
    \ 20 像素的间隙。这种划分以及为你生成的、用于将内容放置在网格中的代码，允许你快速组合页面布局。尺寸和间距规则提供了一个非常受控制的网格，用于设计网站，而不会显得过于限制。\n\
    \n### 对象对象 CSS (OOCSS)\n\n作为框架的代码哲学，对象对象 CSS (http://wiki.github.com/stubbornella/ocss/\
    \ 或 http://ocss.org) 由 Nicole Sullivan 牵头，优先关注内容元素。它将内容拆分为碎片和模块，并利用它们的相似性来定义一种内容标签的通用语言，并将其作为类名应用。这对于大型网站特别有用，因为充分利用了\
    \ CSS 的级联特性，帮助在大型网站典型的许多不同内容类型之间保持一致性。\n\n### YUI 库\n\n我之前提到的重置文件（Reset file）只是\
    \ YUI 库的一小部分。更大的项目由一组基础 CSS 文件、一组基础 JavaScript 文件以及常见 Web 应用界面组件的组件（如 cookie 访问、拖放元素、日期选择器和滑块）组成。从\
    \ jQuery、script.aculus 和 MochaUI 也可以获得类似的界面小部件库。它们都提供了一组供选择的小部件以及用于嵌入和皮肤化这些元素的规则，但它们没有提供\
    \ YUI 那样更通用的重置和框架方面。\n\n## 为什么不使用框架？\n\n正如任何其他工具一样，框架是为解决某些特定问题而发展的。正如你所看到的，随着它们的演进，它们可能会变得更通用，但在某些情况下，这些特性在当前浏览器中的支持较少。\n\
    \n例如，使用多个 HTML 元素作为钩子（如图 7.4 所示）的需求导致了支持单个元素上的多个背景图像的 CSS 变化，正如你在第 8 章看到的那样。\n\
    \n## 不及框架\n\n框架提供了构建网站的起点，包括重置、布局网格工具以及基础的排版和字体样式。这些特性是基于 CSS 语法，但提供了不同的嵌套语法是可选择的。\n\
    \n## CSS 预处理器\n\n随着 CSS 作为语言的演进，它经常尝试让困难或不灵活的任务变得简单。其中一些新属性是基于单个浏览器的实验性的，但通常基于。\n\
    \n### Less\n\nLess (https://lesscss.org/) 是一个 Ruby 宝石，提供了变量、混合（mixin）和嵌套功能。以下是使用\
    \ Less 的代码示例：\n\n```css\n@highlight_color: #aaa;\nblockquote {\n  font-size: 1.4em;\n\
    \  a {\n    text-style: italic;\n  background-color: @highlight_color;\n  }\n\
    }\n```\n\n以下是另一种 Less 语法示例：\n\n```css\n@highlight_color: #aaa;\nblockquote {\n\
    \  font-size: 1.4em;\n  a {\n    text-style: italic;\n  }\n}\n```\n\n### Sass\n\
    \nSass (http://sass-lang.com/) 也是一个 Ruby 宝石，提供了变量、混合（mixin）、数学运算和嵌套功能。以下是使用 Sass\
    \ 的代码语法示例：\n\n```scss\n$highlight-color: #aaa;\nblockquote {\n  font-size: 1.4em;\n\
    \  a {\n    text-style: italic;\n    background-color: $highlight-color;\n  }\n\
    }\n```\n\n## CSS 不遥及的未来\n\n随着 CSS 的演进，它经常尝试让困难或不灵活的任务变得简单。其中一些新属性是基于单个浏览器的实验性的，但通常基于。\n"
