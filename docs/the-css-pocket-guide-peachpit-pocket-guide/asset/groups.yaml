  - '[PAGE 179]


    line-through: Each line of text has a line drawn through it.


    blink: The text blinks.


    Years of conventions have established and reinforced that underlined text signals
    that the text is a link. Links don''t have to be underlined because they may appear
    as buttons or highlighted via color or background color changes, but if text is
    underlined, someone will try to click it. I will never say to never do something,
    but that being said, use text-decoration: underline with extreme care.


    # text-transform


    The text-transform property controls the capitalization of text. This can be a
    useful property for reinforcing the formatting of navigation, buttons, and headers.


    +   - capitalize: The first character of each word is forced to be uppercase.


    +   - uppercase: All characters are forced to be uppercase.


    +   - lowercase: All characters are forced to be lowercase.


    +   - none: No adjustment to the capitalization found in the source HTML document
    is made (default).


    # word-spacing


    You can adjust the default space between each word in a string of inline using
    word-spacing.


    +   - <length>: A fixed dimension used as an adjustment to the default amount
    of space between words.


    +   - normal: No adjustment is made (equivalent to 0).'
  - '[PAGE 180]


    # letter-spacing property


    The letter-spacing property controls the spacing of each character in a word.
    Like word-spacing, the letter-spacing property defines an adjustment to the default
    spacing for the font.


    +   - <length>: A fixed dimension used as an adjustment to the default amount
    of space between letters.


    +   - normal: No adjustment is made (equivalent to 0).


    # text-align


    Horizontal alignment of text inside a containing block is defined by the text-align
    property.


    +   - left: The text is left aligned (default).


    +   - right: The text is right aligned.


    +   - center: The lines of text are centered.


    +   - justify: The lines of text are flush with both sides of the box, adjusting
    the spacing in between words as needed.


    > Be careful when applying text-align: justify, particularly with narrow columns.
    Typographic tools such as hyphenation, which help maintain even character counts
    per line, are not available to browsers, and they''re notoriously awful at calculating
    the spacing needed for justification. This often results in lines with a few words
    and huge gaps between them.'
