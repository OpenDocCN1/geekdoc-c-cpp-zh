    the layering of boxes from back to front. The higher the integer value, the “closer”
    to the viewer element appears.


    Think of this index as controlling the elements of a stage set in the theater.
    The background elements are at the position, the actors and other elements may
    shuffle between 1 and 20, and the foreground set pieces and the curtain are between
    21 and 25 (though there is no limit to this value). What happens if two elements
    in the same stack are at an index of 11 (or o auto?) This isn''t a problem unless
    each element’s positioning properties cause them to overlap. In this case, the
    element specified later in the document flow will appear on top.


    This index, like positioning offsets, is relative to the containing block. If
    one element has a z-index of 4 and another element has a z-index of 3, none of
    the second element’s children can ever appear “above” the content of the former
    element.


    > note Some plug-in content such as Adobe Flash can sometimes bleed though HTML
    content positioned above it and given a higher z-index. For Flash, in particular,
    there is a window mode parameter called wmode that when set to opaque or transparent
    will allow content to appear above it in the stack.'
  - '[PAGE 116]


    # visibility


    The visibility property determines whether an element renders and can be seen.
    Unlike setting the display property to none, an element with a visibility of hidden
    still affects layout and will take up space. Unlike the opacity property, individual
    descendants of a hidden element can be shown by setting their visibility to visible.


    +   - visible: The element is rendered.

    - hidden: The element is not rendered.


    # float


    An element with a float value of left or right is taken out of the normal flow
    of a document and shifted to one side of the containing box. The content that
    follows it in the document wraps around the floated element''s new position.


    +   - none: An element is not floated and behaves as normal.

    - left: An element is taken out of the normal flow and is shifted to the left
    of where it was otherwise appear, with content flowing around it on the right
    side of the element.

    - right: An element is taken out of the normal flow and is shifted to the left
    of where it was otherwise appear, with content flowing around it on the right
    side of the element.


    Think of a small photo that is moved to the right and has text flowing around
    it; you now have the basic idea of how an element (the photo) behaves when floated
    (Figure 6.5 on the next page).'
