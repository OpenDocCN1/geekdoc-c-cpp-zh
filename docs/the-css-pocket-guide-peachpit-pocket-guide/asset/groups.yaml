    \ .main */\nborder: 1px solid black;\n}\n.right_sidebar {\n  float: right;\nheight:\
    \ 180px;\nwidth: 98px;\n  border: 1px solid black;\n}\n```\n\n```html\n<div class=\"\
    container\">\n  <div class=\"main\">\n    .main\n  </div>\n  <div class=\"left_sidebar\"\
    >\n    .left_sidebar\n  </div>\n  <div class=\"right_sidebar\">\n    .right_sidebar\n\
    \  </div>\n</div>\n```\n\n> 这种布局的变体和深入描述可以在 Alan Pearce 在 A List Apart 上发表的文章\
    \ [Multi-column Layouts Climb Out of the Box](http://www.alistapart.com/articles/multicolumnayouts/)\
    \ 中找到。\n\n# 固定尺寸、灵活型与混合列\n\n之前的布局示例是使用固定宽度容器内的固定宽度列来制作的，因此被称为固定宽度布局。\n\n基于百分比的灵活列被称为流式布局（liquid\
    \ layouts），因为它们会随浏览器尺寸的改变而流动。流式双列布局的制作与固定列布局同样容易。变为三列可能会稍微复杂，特别是当源码顺序的考虑决定了使用负边距的“跳跃”列时。这是因为百分比边距是相对于其应用的元素宽度计算的，而不是相对于包含块的宽度，因此除非每个列的尺寸比例非常简单，否则可能很难定义什么是“等于另一个元素宽度的边距”。\n\
    \n基于混合列的布局没有华丽的名字，但它们由固定尺寸的列以及百分比或自动宽度的列组成。有时，这些或其他复杂的排列通过嵌套一组组容器和列来实现。**图 7.9**\
    \ 以及随后的代码展示了一个固定宽列以及另外两个会增长以匹配容器宽度的额外列。\n\n图 7.9\n\n一个带有灵活内容列和一个固定宽度侧边栏的混合布局。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_142_0.png)\n\n```css\n.container {\n\
    \  width: auto;\n  padding: 5px 107px 5px 5px; /* room for right sidebar */\n\
    \  border: 1px solid black;\n  background: none;\noverflow: auto;\n\n.main_left\
    \ {\n  float: left;\n  height: 200px;\n  width: 48%;\n  margin-right: 5px;\n \
    \ border: 1px solid black;\n}\n\n.main_center {\n  float: left;\n  height: 120px;\n\
    \  width: 48%;\n  border: 1px solid black;\n}\n\n.right_sidebar {\n  float: right;\n\
    \  height: 180px;\n  width: 100px;\n  border: 1px solid black;\n  margin-right:\
    \ -102px;\n}\n```\n\n```html\n<div class=\"container\">\n  <div class=\"main_left\"\
    >\n    .main_left\n  </div>\n  <div class=\"main_center\">\n    .main_center\n\
    \  </div>\n</div>\n<div class=\"right_sidebar\">\n  .right_sidebar\n</div>\n</div>\n\
    ```\n\n# 第 7 章：页面布局\n\n你可能在看之前的示例时认为数学逻辑上对不上，你是对的——它确实对不上。当混合百分比测量时，你必须稍微通融一下数字。50%\
    \ 的宽度加上另一个 50% 的宽度，加上 4 像素的边框以及一个 5 像素的边距，显然大于容器剩余的 100% 宽度。更稳妥的做法是让该空间的 96% 留出\
    \ 9 像素的剩余，在这种情况下，只要容器的内容宽度至少为 225 像素（9 像素 / (100% – 96%） * 100），这就是成立的。如果内容宽度大于\
    \ 225 像素，那么那 4% 的宽度将大于 9 像素，但在许多情况下，这几个额外的像素是获得混合布局所付出的公平权衡。\n\n# 带约束的设计\n\n对于每个访问者都有不同屏幕尺寸和浏览器尺寸的\
    \ Web，灵活列通常是最佳解决方案，但还没有考虑到内容通常也扮演着角色。太小的内容列可能无法容纳图像或视频内容，而当它们太宽时，内容可能变得难以阅读。次要列也可能有约束或最佳尺寸。混合列可以是最佳解决方案。\n\
    \n你可以使用 `min-width` 和 `max-width` 属性来限制流式列或列容器的大小。在以下代码中，允许容器在 600 像素到 1000 像素之间增长，并在超出最大宽度时居中。\n\
    \n```css\n.container {\n  width: auto;\n  min-width: 600px;\n  max-width: 1000px;\n\
    \  margin: 0 auto;\n}\n```\n\n# 背景与边框\n\n`background` 属性是灵活的，允许在一内设置颜色、图像、重复、附件和位置。\n\
    \n## 背景\n\n`background-color` 属性设置元素的背景颜色。可以是任何颜色值（名称、十六进制、RGB 等）。\n\n`background-image`\
    \ 属性设置元素的背景图像。可以使用逗号分隔多个图像。\n\n`background-repeat` 属性决定背景图像如何重复。\n\n- repeat:\
    \ 在两个方向上重复（默认）。\n- repeat-x: 水平方向重复。\n- repeat-y: 垂直方向重复。\n- no-repeat: 不重复。\n\
    \n`background-attachment` 属性定义背景图像如何随页面滚动。\n\n- scroll: 背景随元素滚动（默认）。\n- fixed:\
    \ 背景相对于视口固定。\n\n`background-position` 属性指定背景图像的初始位置。\n\n- <length>: 距离左上角的固定长度偏移。\n\
    - <percentage>: 相对于容器内容区域与图像尺寸之间差异的百分比偏移。\n- top: 垂直位置的 0%。\n- right: 水平位置的 100%。\n\
    - bottom: 垂直位置的 100%。\n- left: 水平位置的 0%。\n- center: 任意位置的 50%。\n\n# 边框\n\n`border-width`\
    \ 属性设置元素周围边框的厚度。\n\n`border-style` 属性设置边框样式。\n\n- none: 无边框（默认）。\n- solid: 实线。\n\
    - dashed: 虚线。\n- dotted: 点线。\n- double: 双实线。\n\n`border-color` 属性设置边框的颜色。\n\n"
