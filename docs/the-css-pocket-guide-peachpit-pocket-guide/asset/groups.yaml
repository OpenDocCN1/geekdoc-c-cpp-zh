  raw:
  - '[PAGE 265]


    The value for border-image-property is comprised of an image reference, a description
    where the image is divided to create nine segments, how those segments are positioned,
    and finally a description of how they tile to fill the available area.


    # border-image-source


    The border-image-source property accepts a reference to the image used as the
    border image.


    # border-image-slice


    border-image-slice defines where the four lines slice an image into segments,
    inset from each of the four sides of the image. For the image displayed in Figure
    14.6, it would make sense to position these dividing lines 30 pixels from each
    edge to create nine even segments. The distance from each edge can be measured
    by the following values:


    +   - <number>: The number of pixels (or the coordinates for SVG images). Pixel
    units are implied for bitmap background images, and the unit should be left off.

    - <percentage>: A percentage value based on the dimensions of the image.


    A width for the border can optionally be assigned via the border-image-slice property
    by adding a forward slash (/) after the slice position values. These width measurements
    are the same as the border-width property, and if both properties are set, then
    the border width values set as part of border-image-slice override those set in
    the border-width property. The following example sets the slices that segment
    the image to be 30 units from each edge, with a border width of 30 pixel for the
    top and bottom border and 15 pixel for the left and right.'
  - "[PAGE 266]\n\n```\ndiv.one {\n  * for Firefox */\n  -moz-border-image-slice:\
    \ 30 / 30px 15px;\n  * for Safari and Chrome */\n  -webkit-border-image-slice:\
    \ 30 / 30px 15px;\n  * W3C specs */\n  border-image-slice: 30 / 30px 15px;\n}\n\
    ```\n\nThe border width behavior of border-image-slice allows you to set one width\
    \ for browsers that only understand the traditional properties and alter the size\
    \ for those that understand border-image.\n\n# border-image-repeat\n\nThe border-image-repeat\
    \ property defines how the slices of the image fill the flexible space on the\
    \ side borders and middle portion of the border area. You can use one or two of\
    \ the following keywords:\n\n+   - stretch: The image slice is scaled to fit the\
    \ available space, without repeating (default).\nn- repeat: The image slice is\
    \ scaled but not tiled to fill the available space. As a result, the image may\
    \ appear cropped on some edges.\n- round: The image slice is tiled; however, only\
    \ whole images are used. The tiles are then scaled evenly to fill the remaining\
    \ space.\n\nIf only one keyword is provided, it is applied to both the borders\
    \ and the center section.\n\n# border-image (Shorthand)\n\nThe shorthand border-image\
    \ accepts the previous three subproperties, as well as the additional properties\
    \ of border-image-width"
  - "[PAGE 267]\n\nand border-image-outside(that describe where the images are drawn\
    \ in the border area) in the order <border-image-source>, <border-image-slice>,\
    \ <border-image-repeat>.\n\n**Figure 14.7** uses the image from Figure 14.6 as\
    \ a border image and demonstrates the difference between border-image-repeat values.\n\
    \n```\ndiv {\n  /* set common width for all browsers */\n  border-width: 30px;\n\
    }\ndiv.one {\n  /* for Firefox */\n  -mozz-border-image: url(images/border_background_tile.png)\n\
    \  30 30 30 30 round;\n  /* for Safari and Chrome */\n  -webkit-border-image:\
    \ url(images/border_background_tile.png)\n  /* W3C specs */\n  border-image: url(images/border_background_tile.png)\
    \ 30 30 round;\n```\n\n```\ndiv.two {\n  /* for Firefox */\n  -mozz-border-image:\
    \ url(images/border_background_tile.png)\n  30 30 30 30 stretch;\n  /* for Safari\
    \ and Chrome */\n  -webkit-border-image: url(images/border_background_tile.png)\n\
    \  30 30 30 30 stretch;\n  /* W3C specs */\n  border-image: url(images/border_background_tile.png)\
    \ 30 30 stretch;\n```"
  - "[PAGE 268]\n\n```\n}\n[...]\n<div class=\"one\">\n  border image with sides and\
    \ middle set to round\n</div>\n<div class=\"two\">\n  border image with sides\
    \ and middle set to stretch\n</div>\n```\n\nFigure 14.7\nExamples of border backgrounds\
    \ with round and stretch values for border-image-repeat.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_268_0.png)\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_268_1.png)\n\nBorder backgrounds are\
    \ supported in Firefox 3.5+, Opera 10.5+, Chrome 3+, and Safari 3.2.\n\n# WAI-ARIA\
    \ Roles\n\nThough not explicitly CSS related, the Accessible Rich Internet Application\
    \ (WAI-ARIA) specification (http://www.w3.org/TR/wai-aria/) provides definitions\
    \ of common semantics of application widgets and states as a semantic layer to\
    \ be added to existing HTML markup using the role attribute. Role types include\
    \ navigation, progressbar, alertdialog, tab, and tooltip. By applying these to\
    \ HTML elements, screen readers and other assistive devices can react to these\
    \ items more appropriately than they would an element with a class or id of progressbar."
  - "[PAGE 269]\n\nThe CSS attribute selector can also leverage these role definitions,\
    \ along with state-based attributes such as aria-checked, as hooks for styling,\
    \ rather than relying on class attributes.\n\nYou can find more about WAI-ARIA\
    \ roles and their usage in the spec on the W3C site (http://www.w3.org/TR/wai-aria/usage).\n\
    \n# The calc() Function\n\nThe calc() function lets replace any <length> value\
    \ assignment with a mathematical expression rather than a fixed-length unit. These\
    \ arithmetic expressions can be built with the operators +, -, *, /, min, max,\
    \ and mod.\n\nThe problem of leftover pixels that arose in Chapter 7 when mixing\
    \ percentage values and fixed lengths (Figure 7.9) can be solved by using calc()\
    \ instead. Figure 14.8 shows the updated multicolumn, flexible layout.\n\n```\n\
    /* modifications to 7.9 using calc() */\n.main_left,\n.main_center {\n  /* for\
    \ unsupported browsers */\n  width: 48%;\n  /* for Firefox 4 */\n  width: -moz-calc(50%\
    \ - 7px);\n  /* W3C specs */\n  width: calc(50% - 7px);\n}\n```"
  - '[PAGE 270]


    # Chapter 14: The Not Too Distant Future of CSS


    Figure 14.8

    A flexible, multicolumn

    layout using

    calc().


    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_270_0.png)


    In the previous code, the available width of the container is split shared by
    the margins between the boxes (the four vertical side borders), with the remaining
    area split evenly between the two flexible columns. The arithmetic you would use
    to calculate what is left over after the fixed area is 100% - 10px - 4px. That
    area split between each column and cleaned up a bit is 100%/2 - 14px/2.


    calc() will be supported in upcoming browsers including Internet Explorer 9 and
    Firefox 4.


    # Transformations and Rotations


    Using CSS transforms, you can rotate, skew, or scale elements.


    Transforming an element does not change the flow of a document; instead, the element
    takes up its pretransformed shape in the document much in the same way that relative
    positioned elements behave.


    # transform


    The transform property is used to define one or more <transform-functions> for
    the specified element.


    +   - none: No transform is applied.


    +   - <transform-function>: The description of a transform to be applied to an
    element.'
  - '[PAGE 271]


    # Values for <transform-function>


    The following are values for <transform-function>:


    +   - translateX(<length>):: Translates the element by the specified amount on
    the x-axis.


    +   - translateY(<length>): Translates the element by the specified amount on
    the y-axis.


    +   - translate(<length>, <length>):: Translates the element by the specified
    amount; the first value is along the x-axis, and the second is along the y-axis
    (o if not specified).


    +   - scaleX(<number>): Scales the element by the specified factor along the x-axis.


    +   - scaleY(<number>): Scales the element by the specified factor along the x-axis.


    +   - scale(<number>, <number>): Scales the element by factor along each axis;
    the first value is the x-axis, and the second is along the y-axis (equal to x
    if not specified).


    +   - rotate(<angle>): Rotates an element around the origin by the specified angle
    (in deg units); a positive angle rotates the element in a clockwise direction.


    +   - skewX(<angle>): Skews the element along the x-axis by the specified angle
    (in deg units).


    +   - skewY(<angle>): Skews the element along the y-axis by the specified angle
    (in deg units).


    +   - skew(<angle>, <angle>): Skews along each axis by the specified angle (in
    deg units); the first value is along the x-axis, and the second is along the y-axis
    (o if not specified).'
- md: "\n## Chapter 14: The Not Too Distant Future of CSS\n\n- matrix(<number>, <number>,\
    \ <number>, <number>, <number>, <number>): Specifies a linear transformation matrix\
    \ (http://en.wikipedia.org/wiki/Linear_transformation#Examples_of_linear_transformation_matrices)\
    \ for transformation of the element.\n\nStarting with the dated flag graphic used\
    \ the negative positioning demonstration in Figure 7.6, you can rotate the flag\
    \ and text by 270 degrees to sit alongside the content item it is matched with.\n\
    \n```css\n/* modifications to 7.6 using transform */\n/* adjust positioning */\n\
    top: 29px;\nleft: -81px;\n```\n\n```css\n/* for Firefox */\n-moz-transform: rotate(270deg);\n\
    /* for Safari and Chrome */\n-webkit-transform: rotate(270deg);\n/* for Opera\
    \ */\n-o-transform: rotate(270deg);\n/* W3C specs */\ntransform: rotate(270deg);\n\
    }\n```\n\nIn the previous code example, the element was rotated and then positioned\
    \ with absolute positioning to properly place it (Figure 14.9 on the next page).\
    \ The position before the rotation (and thus in any browser that doesn't support\
    \ transitions) is shown by the dotted outline.\n\nFigure 14.9\nThe flag and text\
    \ content is rotated by 270 degrees to a vertical position.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_273_0.png)\n\
    \nIf this position before the translation is undesirable (for example, because\
    \ it is shifted too low), it may be better to position the element as it was in\
    \ the original example and then apply transforms to get it to its final appearance:\
    \ rotation and translation (Figure 14.10).\n\n```css\n/* modifications to 7.6\
    \ using two transforms */\n/* for Firefox */\n-moz-transform: rotate(270deg) translate(-19px,-31px);\n\
    /* for Safari */\n-webkit-transform: rotate(270deg) translate(-19px,-31px);\n\
    /* for Opera */\n-o-transform: rotate(270deg) translate(-19px,-31px);\n/* W3C\
    \ specs */\ntransform: rotate(270deg) translate(-19px,-31px);\n```\n\nFigure 14.10\n\
    The flag and text content is rotated and translated, leaving a more desirable\
    \ nontransformed state.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_273_1.png)\n\
    \n## transform-origin\n\nThe origin for any transform is by default the center\
    \ of the element (50%). You can adjust this origin using the transform-origin\
    \ property, allowing for rotation around a different point. transform-origin accepts\
    \ two values: the first is the horizontal position of the element, and the second\
    \ is the vertical position. Fixed units such as px units, negative values, and\
    \ values greater than 100 percent are all accepted, allowing for the point of\
    \ origin to be moved outside the element. Also accepted are keywords for defining\
    \ the origin point, including left, center, and right along the x-axis and top,\
    \ center, and bottom along the y-axis.\n\nFigure 14.11 shows how the effects of\
    \ a rotation of an element change when the transform-origin is changed from its\
    \ default position.\n\nFigure 14.11\nElements rotated around a transform origin.\
    \ The diagonal arrow represents the new position of the origin; the circle represents\
    \ the rotational transform.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_274_0.png)\n\
    \n> note For the sake of brevity, only the code targeting Firefox is displayed\
    \ in the following code.\n\n```css\ndiv {\nheight: 50px;\nwidth: 50px;\nborder:\
    \ 1px solid #000;\n-moz-transform-origin: -100% -100%;\n}\ndiv.one {\n  border:\
    \ 1px dashed #ccc;\n}\ndiv.two {\n  -moz-transform: rotate(45deg);\n}\ndiv.three\
    \ {\n  -moz-transform: rotate(90deg);\n}\ndiv.four {\n  -moz-transform: rotate(135deg);\n\
    }\ndiv.five {\n  -moz-transform: rotate(180deg);\n}\ndiv.six {\n  -moz-transform:\
    \ rotate(225deg);\n}\ndiv.seven {\n  -moz-transform: rotate(270deg);\n}\ndiv.eight\
    \ {\n  -moz-transform: rotate(315deg);\n}\n<div class=\"one\">one</div>\n<div\
    \ class=\"two\">two</div>\n<div class=\"three\">three</div>\n<div class=\"four\"\
    >four</div>\n<div class=\"five\">five</div>\n<div class=\"six\">six</div>\n<div\
    \ class=\"seven\">seven</div>\n<div class=\"eight\">eight</div>\n```\n\nThe second\
    \ value is optional. In cases where it is off, it is assumed to be center. The\
    \ CSS3 transform property, its values, and the transform-origin property are supported\
    \ in some form by Safari 3.2+, Chrome 3+, Opera 10.5+, Firefox 3.5+, and Internet\
    \ Explorer 9.\n\n## Transitions\n\nTransitions are a way to define parameters\
    \ for animating changes to CSS properties on a specified element. Changes to styles\
    \ can occur because of updates in element state (:hover, :valid, and on), scripted\
    \ changes to styles, or other scripted changes causing how selectors are applied.\n\
    \n## transition-property\n\ntransition-property designates which CSS property\
    \ or properties are animated when a change occurs. Animations can occur with most\
    \ properties; however, some properties such as background-image and text-decoration\
    \ cannot.\n\n- none: No properties will be animated (default).\n- all: All properties\
    \ that can be animated.\n- <property-name>, <property-name>: A comma-separated\
    \ list of one or more properties that can be animated if a change occurs.\n\n\
    ## transition-duration\n\nThe time it takes to transition from the original value\
    \ of a property to the final value can be set via the transition-duration property.\n\
    \n- <time>: The time it takes for a transition to complete; in seconds (s units)\n\
    \n## transition-timing-function\n\nBy default the transition between values of\
    \ a property is animated along a linear function. You can alter this change via\
    \ the transition-timing-function by choosing between several built-in functions\
    \ or a custom cubic-bezier.\n\n- ease | linear | ease-in | ease-out | ease-in-out:\
    \ Keywords representing different types of built-in functions for animation\n\
    - cubic-bezier(<number>, <number>, <number>, <number>): A transition function\
    \ to define a custom cubic-bezier curve\n\n## transition-delay\n\nYou can add\
    \ a delay before a transition using the transition-delay property.\n\n- <time>:\
    \ The time before a transition begins animating; in seconds (s units)\n\n## transition\
    \ (Shorthand)\n\nThe shorthand transition property accepts one or more groups\
    \ of transition subproperty groups in the order: `<transition-property>` `<transition-duration>`\
    \ `<transition-timing-function>` `<transition-delay>`. The following code example\
    \ defines the transform for the hover state on an image and applies a basic easing\
    \ animation to the transition.\n\n```css\nimg {\n  /* for Firefox 4 */\n  -moz-transition:\
    \ -moz-transform 0.5s ease-out;\n  /* for Safari and Chrome */\n  -webkit-transform:\
    \ -webkit-transform 0.5s ease-out;\n  /* for Opera */\n  -o-transition: -o-transform\
    \ 0.5s ease-out;\n  /* W3C specification */\n  transition: transform 0.5s ease-out;\n\
    }\n\nimg:hover {\n  /* for Firefox 4 */\n  -moz-transform: scale(1.5, 1.5);\n\
    \  /* for Safari and Chrome */\n  -webkit-transform: scale(1.5, 1.5);\n  /* for\
    \ Opera */\n  -o-transform: scale(1.5, 1.5);\n  /* W3C specification */\n  transform:\
    \ scale(1.5, 1.5);\n}\n```\n\n<img src=\"images/hover_me.png\" width=\"90\" height=\"\
    90\" alt=\"Hover Me\" />\n\nThe Mozilla Developer Center has a thorough article\
    \ on working with transitions at https://developer.mozilla.org/en/CSS/CSS_transitions.\
    \ CSS transitions are supported in Safari 3.2+, Chrome 3+, Opera 10.5+, Firefox\
    \ 4+, and Internet Explorer 9.\n\n## Index\n\nSYMBOLS AND NUMBERS\n\n- #id (ID\
    \ selector), 38\n- #rgb color values, 62\n- #rrggbb color values, 62\n- % (percentage-based\
    \ units), 59-60\n- * (universal selector), 38\n- * and / in comments, xix\n- *\
    \ (semicolons), at-rules and, 4\n- <url> function, 61\n- @font-face rule, 162-163\n\
    - @import rule, 208-209\n- @media rule, 204\n- @page rule, 211\n- \\as escape\
    \ character, xix\n- 960 grid system, 226\n"
  mdcn: "\n\n## 第 14 章：CSS 并不遥远的未来\n\n- matrix(<number>, <number>, <number>, <number>,\
    \ <number>, <number>): 为元素的变换指定一个线性变换矩阵（http://en.wikipedia.org/wiki/Linear_transformation#Examples_of_linear_transformation_matrices）。\n\
    \n从图 7.6 中用于负定位演示的日期标记旗帜图形开始，你可以将旗帜和文字旋转 270 度，使其与其匹配的内容项并排排列。\n\n```css\n/* 使用\
    \ transform 对 7.6 进行修改 */\n/* 调整位置 */\ntop: 29px;\nleft: -81px;\n```\n\n```css\n\
    /* 针对 Firefox */\n-moz-transform: rotate(270deg);\n/* 针对 Safari 和 Chrome */\n\
    -webkit-transform: rotate(270deg);\n/* 针对 Opera */\n-o-transform: rotate(270deg);\n\
    /* W3C 标准 */\ntransform: rotate(270deg);\n}\n```\n\n在上一个代码示例中，元素经过旋转，然后使用绝对定位进行放置，以正确布局（见下一页的图\
    \ 14.9）。旋转之前的位置（即在任何不支持过渡的浏览器中）由虚线轮廓显示。\n\n图 14.9\n旗帜和文字内容旋转 270 度，变为垂直位置。\n\n\
    ![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_273_0.png)\n\n如果这个变换之前的位置是不理想的（例如，因为它偏移得太低），可能最好按照原始示例那样对元素进行定位，然后应用变换来获得其最终外观：旋转和位移（图\
    \ 14.10）。\n\n```css\n/* 使用两个 transform 对 7.6 进行修改 */\n/* 针对 Firefox */\n-moz-transform:\
    \ rotate(270deg) translate(-19px,-31px);\n/* 针对 Safari */\n-webkit-transform:\
    \ rotate(270deg) translate(-19px,-31px);\n/* 针对 Opera */\n-o-transform: rotate(270deg)\
    \ translate(-19px,-31px);\n/* W3C 标准 */\ntransform: rotate(270deg) translate(-19px,-31px);\n\
    ```\n\n图 14.10\n旗帜和文字内容经过旋转和位移，留下了一个更理想的非变换状态。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_273_1.png)\n\
    \n## transform-origin\n\n任何变换的原点默认都是元素的中心（50%）。你可以使用 `transform-origin` 属性调整此原点，允许围绕不同的点进行旋转。`transform-origin`\
    \ 接受两个值：第一个是元素的水平位置，第二个是垂直位置。固定单位（如 `px` 单位）、负值以及大于 100% 的值均被接受，这允许原点移动到元素之外。同样被接受的还有定义原点的关键字，包括\
    \ x 轴上的 left、center、right，以及 y 轴上的 top、center、bottom。\n\n图 14.11 显示了当 `transform-origin`\
    \ 从默认位置改变时，元素旋转效果会发生变化。\n\n图 14.11\n围绕变换原点旋转的元素。斜线箭头表示原点的新位置；圆形表示旋转变换。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_274_0.png)\n\
    \n> 注意 为了简洁起见，以下代码仅显示了针对 Firefox 的。\n\n```css\ndiv {\nheight: 50px;\nwidth: 50px;\n\
    border: 1px solid #000;\n-moz-transform-origin: -100% -100%;\n}\ndiv.one {\n \
    \ border: 1px dashed #ccc;\n}\ndiv.two {\n  -moz-transform: rotate(45deg);\n}\n\
    div.three {\n  -moz-transform: rotate(90deg);\n}\ndiv.four {\n  -moz-transform:\
    \ rotate(135deg);\n}\ndiv.five {\n  -moz-transform: rotate(180deg);\n}\ndiv.six\
    \ {\n  -moz-transform: rotate(225deg);\n}\ndiv.seven {\n  -moz-transform: rotate(270deg);\n\
    }\ndiv.eight {\n  -moz-transform: rotate(315deg);\n}\n<div class=\"one\">one</div>\n\
    <div class=\"two\">two</div>\n<div class=\"three\">three</div>\n<div class=\"\
    four\">four</div>\n<div class=\"five\">five</div>\n<div class=\"six\">six</div>\n\
    <div class=\"seven\">seven</div>\n<div class=\"eight\">eight</div>\n```\n\n第二个值是可选的。如果省略，则假设为中心。CSS3\
    \ `transform` 属性、其值以及 `transform-origin` 属性在 Safari 3.2+、Chrome 3+、Opera 10.5+、Firefox\
    \ 3.5+ 和 Internet Explorer 9 中以某种形式支持。\n\n## 过渡 (Transitions)\n\n过渡是一种定义动画变化参数的方式。\n\
    \n## transition-property\n\n`transition-property` 指定哪些属性将应用过渡。\n\n- `none`: 不过渡。\n\
    - `all`: 所有属性都进行过渡。\n- `<property-name>`: 指定特定的属性。\n\n## transition-duration\n\
    \n`transition-duration` 定义过渡完成所需的时间。\n\n- `<time>`: 过渡所需的时间（以秒 s 或毫秒 ms 为单位）。\n\
    \n## transition-timing-function\n\n`transition-timing-function` 定义过渡的速度曲线。\n\n\
    - `ease`: 默认值，开始慢，中间快，结束又慢。\n- `linear`: 匀速过渡。\n- `ease-in`: 开始慢，然后变快。\n- `ease-out`:\
    \ 开始快，然后变慢。\n- `cubic-bezier(<n1>, <n2>, <n3>, <n4>)`: 自定义三次贝塞尔曲线。\n\n## transition-delay\n\
    \n`transition-delay` 定义过渡开始之前的延迟。\n\n- `<time>`: 过渡开始前的延迟时间。\n\n## transition\
    \ (简写)\n\n`transition` 简写属性接受一组过渡属性值，顺序为：`<transition-property>` `<transition-duration>`\
    \ `<transition-timing-function>` `<transition-delay>`。以下代码为图像的悬停状态定义了变换，并应用了基础平缓效果。\n\
    \n```css\nimg {\n  /* 针对 Firefox */\n  -moz-transition: -moz-transform 0.5s ease-out;\n\
    \  /* 针对 Safari 和 Chrome */\n  -webkit-transition: -webkit-transform 0.5s ease-out;\n\
