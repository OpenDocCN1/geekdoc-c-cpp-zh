    \n你可能会发现其他类型在小众项目中很有用。例如，如果你正在设计用于演示后在 Web 上分发的幻灯片，那么你可能有一个专门针对投影媒体（projection）的演示文（由\
    \ Opera 的全屏模式触发）。关于此想法的更多信息，以及 Opera 对 `projection` 媒体类型支持，请阅读 Till Halbach 的文章《使用\
