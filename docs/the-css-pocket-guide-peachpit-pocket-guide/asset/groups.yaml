    # 测量、URL 和颜色单位


    在第 1 章讨论 CSS 语法时，你已经看到每个 CSS 声明的第二部分是一个值。在本章中，你将探索一些用于定义尺寸（<length> 和 <percentage>）、颜色（<color>）以及用于定义这些值的
    URL（<url>）的常用单位。


    # 测量


    尺寸尺寸和其他测量值（例如 font-size）不仅仅是原始数字，而是带有某些指定测量单位的数值。CSS 拥有多种测量单位；最常用的列在以下章节中概述。


    ## 像素 (px)


    ```

    img.thumbnail { width: 150px; }

    div { border-width: 3px; }

    ```


    像素单位（<length>）是基于普通像素尺寸的固定测量值。


    > 像素单位并不总是一个“像素”或“点”，而是被定义为基于给定显示器的相对长度测量值。打印等高分辨率媒体将把 1px 输出为多个物理点，而像 326-dpi
    的 iPhone 4 这样高分辨率的设备将以适当的大小渲染 px 单位。


    ## em (em)


    ```

    h1 { font-size: 1.6em; } /* 让 h1 字体大于基础字体 */

    blockquote { width: 20em; } /* 保持块的可读性 */

    ```


    一个单位（<length>）是一个相对单位，等同于元素的字体大小。当它应用于元素的 font-size 属性时，em 单位相对于父元素的字体大小。这种行为使其在保持强调、标题和其他标签的字体大小相对于基础字体大小时非常有用。当它被应用于尺寸时也很有用，可以作为控制可读性和行长度的方法。


    ## 磅 (pt)


    ```

    body { font-size: 12pt; }

    ```


    磅是一种基于长度的绝对单位（<length>），等同于 1/72 英寸。在设置打印尺寸时，如果可能强调物理测量值，磅会很有用处。在屏幕和移动媒体上，磅是根据显示器的分辨率和系统设置近似的，使用
    px 或 em 单位可以获得更一致的结果。


    ## 百比 (%)


    ```

    .column1 { width: 30%; } /* 包含块的百分比 */

    p { line-height: 140%; } /* 字体大小的百分比 */

    p { font-size: 90%; } /* 父元素的百分比 */

    ```


    基于百分比的单位（<percentage>）相对于另一个测量值。百分比可以大于100%。它与哪个测量值相关取决于具体情况的定义；之前的代码显示了一些示例。


    ## 百分比计算和盒模型


    由于在计算百分比时涉及的计算存在舍入，可能会有额外的一个或两个像素需要考虑。Internet Explorer 6 以其计算导致不适应空间的列产生额外像素的计算而臭名昭著。你可以在第
    5 章中找到更多关于布局和盒模型的知识。


    - 50% + 50% = 100%

    - 30% + 30% + 40% = 100%


    ## 其他单位


    - 磅被认为是基于长度的绝对单位：它们对应于 1/72 英寸的物理测量值（由浏览器和设备近似）。其他绝对单位包括 in（英寸）、cm（厘米）和 pc（比卡）。

    - 像素和 em 是基于长度的相对单位：它们相对于某些测量值。像 em 一样，CSS 还定义了其他相对长度单位如下：rem（相对于根元素的字体大小）和 vw（分别相对于视口宽度和高度）。这些单位在下一代浏览器的预览中刚刚开始支持，但非常值得期待。


    ## URLs


    URL 函数（<url>）用于指定资源的地址，以便用于 background-image 或 list 等属性。


    ```

    background-image: url("image.png");

    ```


