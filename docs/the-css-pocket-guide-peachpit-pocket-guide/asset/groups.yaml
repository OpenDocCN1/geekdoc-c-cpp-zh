- md: "\n# Tables\n\nUsing tables for creating a layout grid is an outdated web design\
    \ practice that has generated a lot of bad press for the HTML table element. Even\
    \ if that practice has gone the way of the dead in most modern web development,\
    \ tables for tabular data are just as important as ever. The layout of a table—with\
    \ its grid of cells, myriad of borders, and the ability for cells to span rows\
    \ or columns—calls for some special formatting properties not used for other elements.\n\
    \nThe layout model for the table element calls for margins and borders on the\
    \ outside of the element to behave the same as other blocks and width to be calculated\
    \ similarly, but it incorporates a few additional properties to control the spacing\
    \ and display of the containing cells and their padding, spacing, and borders.\
    \ The following code generates the table in Figure 10.4:\n\n```css\ntable {\n\
    \  background: #ccc;\n  border: 5px dotted #000;\n  border-spacing: 10px;\n}\n\
    td {\n  width: 20px;\n  line-height: 20px;\n  padding: 10px;\n  background: #fff;\n\
    \  border: 2px solid #000;\n}\ntd[rowspan=\"2\"] {\n  border: 10px solid #666;\n\
    }\n```\n\n```css\ntr {\n  border-top: 10px solid #aaa;\n}\n[...\n<table>\n  <tr>\n\
    \    <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>\n  </tr>\n  <tr>\n    <td rowspan=\"\
    2\">&nbsp;</td><td colspan=\"2\">&nbsp;</td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td><td>&nbsp;</td>\n\
    \  </tr>\n  <tr>\n    <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>\n  </tr>\n\
    </table>\n```\n\nFigure 10.4\nA table's layout with border-collapse set to separate.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_204_0.png)\n\n# table-layout\n\nTo\
    \ maintain the integrity of the grid of cells, the content contained in each cell\
    \ has traditionally had some impact on the height of rows and width of columns\
    \ in a table, with the browser free to make adjustments to provided dimensions.\
    \ Even when a cell width is provided, a large amount of text or a large image\
    \ may make the cell larger. The table-layout property allows for changing the\
    \ method browsers use to size and render a table.\n\n- auto: The width of the\
    \ table and table cells is established and adjusted as the content of each cell\
    \ in the table is rendered, with the dimensions provided by the CSS properties\
    \ and adjusted for size or amount of content (default).\n- fixed: The width of\
    \ the table and table cells do not rely on the content but is determined only\
    \ by the width of the table and columns, allowing a browser to start rendering\
    \ the table immediately.\n\nFor small tables of data, table-layout: auto may be\
    \ fine, allowing column widths to flex a bit to account for an unexpectedly large\
    \ number. For much larger tables where you'd want the content to start displaying\
    \ immediately or for cases where the integrity and uniformity of the cell grid\
    \ is important, you should use fixed.\n\n# border-collapse\n\n- separate: The\
    \ borders of individual table cells are drawn as distinct features and separated\
    \ by some border padding. No other parts of a table have borders (default).\n\
    - collapse: The borders of the table and all parts of a table share the same border\
    \ on each side.\n\nA few behaviors of separated borders can be seen in Figure\
    \ 10.4 that make them behave similar to the traditional HTML table rendering.\n\
    \n- In the column on the left, the cells with the narrow border have been adjusted\
    \ to fit the display of the element with the larger border.\n- The border declared\
    \ on the tr element is ignored.\n- The table's background is drawn in the spaces\
    \ between the cell borders.\n\nFigure 10.5 is an example of the previous table\
    \ with border-collapse set to collapse and demonstrates the following changes\
    \ that take place under the collapsing border model that make the table behave\
    \ more similarly to a typical spreadsheet found in Excel, Numbers, or other software:\n\
    \n- One border is drawn between each cell, rather than a distinct border around\
    \ each cell.\n- Borders may be applied to any of the parts of a table including\
    \ the the, tbody, and tr elements.\n- When elements with different border-width,\
    \ border-style, or border-color properties touch, they aren't both drawn; instead,\
    \ one of the styles is chosen by the browser.\n- The border-spacing property is\
    \ ignored.\n\nFigure 10.5\nA table's layout with border-collapse set to collapse.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_206_0.png)\n\n# border-spacing\n\n\
    The border-spacing property provides the padding between borders of table cells\
    \ and takes two <length> values, first for the horizontal spacing and second for\
    \ vertical spacing. If only one <length> is provided, it applies to both sides.\n\
    \n# empty-cells\n\nIn the separated borders model, cells without content (or cells\
    \ set to visibility: hidden) can have their borders and background styling rendered\
    \ or ignored.\n\n- show: Displays the borders and background of empty cells\n\
    - hide: Hides the borders and background of empty cells\n\n# vertical-align\n\n\
    Unlike block-level elements, the contents of cells can be vertically positioned.\n\
    \n- top: The content of the cell is top.\n- bottom: The content of the cell is\
    \ bottom.\n- middle: The content of the cell is centered (default)\n\n# text-align\n\
    \nThe text-align property behaves normally when applied to table (see Chapter\
    \ 9).\n\n# Table Values\n\nLike the display property, there are display values\
    \ for table, inline, and others. What follows is a sample of table-related:\n\n\
    ```css\ntable { display: table; }\ntr { display: row; }\nthead { display: header-group;\
    \ }\ntbody { display: row-group; }\ntfoot { display: footer-group; }\ncol { display:\
    \ column; }\ncolgroup { display: column-group; }\ntd, th { display: cell; }\n\
    caption { display: caption; }\n```\n\n# Forms and User Interface Elements\n\n\
    Designing and styling forms and getting consistent results across browsers can\
    \ be the most difficult part of web development.\n\nMost of this difficulty arises\
    \ because the nature of form elements. They're built to solicit input from the\
    \ user, and how that input gets can be quite different from device to device.\n\
    \nDifferent operating systems have native form control behavior and appearance,\
    \ and browser vendors have tried to keep the display of interface elements in\
    \ line with those standards. As a result, a user will typically see familiar inputs\
    \ if they use multiple browsers on one device, but if they change devices or operating\
    \ systems, the interface will change. Even in the same browser, the appearances\
    \ may differ between Windows, Mac OS X, Linux, and mobile devices. Figure 11.1\
    \ shows the difference in appearance of select elements on three different devices.\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_211_0.png)\n\nFigure 11.1 Interaction\
    \ with select element in Safari/Apple iPhone iOS4, Safari/Apple iPad iOS3, and\
    \ IE 8/Windows XP (from left to right).\n\nYou can find additional examples of\
    \ CSS applied to form elements in different browsers and operating systems at\
    \ Christopher Schmitt’s meticulously collected and indexed collection of screenshots\
    \ at http://www.WebFormElements.com.\n\nSomething else that can be unique to form\
    \ layouts is the need to juggle the myriad of positioning and placement and states\
    \ of the elements of the form. Large fields, small fields, sets of fields, labels,\
    \ and help or error messages all need to be placed so that it is clear to the\
    \ visitor what is being requested from them. The grid that works for a standard-length\
    \ text input along with its label may not work for a collection of radio buttons\
    \ or a combination of inputs such as parts of a phone number or city and state.\n"
  mdcn: "\n\n# 表格\n\n使用表格创建布局网格是一种已经过时的 Web 设计做法，这为 HTML 表格元素带来了许多负面评价。尽管这种做法在大多数现代\
    \ Web 开发中已成为历史，但用于表格化数据的表格仍然比以往任何时候都重要。表格的布局——具有其单元格网格、无数的边框以及单元格跨行或跨列的能力——需要一些其他元素未使用的特殊格式属性。\n\
    \n`table` 元素的布局模型要求元素外部的边距和边框的行为与其他块元素相同，且宽度的计算也类似，但它包含了一些额外的属性，用于控制单元格及其内边距、间距和边框的间和显示。以下代码生成图\
    \ 10.4 中的表格：\n\n```css\ntable {\n  background: #ccc;\n  border: 5px dotted #000;\n\
    \  border-spacing: 10px;\n}\ntd {\n  width: 20px;\n  line-height: 20px;\n  padding:\
    \ 10px;\n  background: #fff;\n  border: 2px solid #000;\n}\ntd[rowspan=\"2\"]\
    \ {\n  border: 10px solid #666;\n}\n```\n\n```css\ntr {\n  border-top: 10px solid\
    \ #aaa;\n}\n[...\n<table>\n  <tr>\n    <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>\n\
    \  </tr>\n  <tr>\n    <td rowspan=\"2\">&nbsp;</td><td colspan=\"2\">&nbsp;</td>\n\
    \  </tr>\n  <tr>\n    <td>&nbsp;</td><td>&nbsp;</td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>\n\
    \  </tr>\n</table>\n```\n\n图 10.4\n`border-collapse` 设置为 `separate`（分离）时的表格布局。\n\
    \n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_204_0.png)\n\n# table-layout\n\n为了保持单元格网格的完整性，传统上每个单元格中包含的内容会对表格的行高和列宽产生影响，浏览器可以自由地对提供的尺寸进行调整。即使提供了单元格宽度，大量的文本或大图像也可能让单元格变得更大。`table-layout`\
    \ 属性允许更改浏览器调整表格大小和渲染的方法。\n\n- auto: 表格和表格单元格的宽度随着表格中每个单元格内容的渲染而建立并调整，其尺寸由 CSS\
    \ 属性提供，并根据内容的大小或数量进行调整（默认值）。\n- fixed: 表格和表格单元格的宽度不依赖于内容，仅由表格和列的宽度决定，允许浏览器立即开始渲染表格。\n\
    \n对于较小的数据表格，`table-layout: auto` 可能足够了，允许列宽稍微灵活变化以适应意料之外的大量内容。对于大得多的表格，如果你希望内容立即开始显示，或者对于单元格网格的完整性和统一性非常重要的情况，你应该使用\
    \ `fixed`。\n\n# border-collapse\n\n- separate: 每个表格单元格的边框作为独立的特征绘制，并由某些边框间距隔开。表格的其他其他部分没有边框（默认值）。\n\
    - collapse: 表格和表格的所有部分在每一侧共享同一条边框。\n\n在图 10.4 中可以看到分离边框的某些行为，这使得它们的行为类似于传统的 HTML\
    \ 表格渲染。\n\n- 在左侧列中，具有窄边框的单元格已调整以适应具有较大边框元素的显示。\n- 在 `tr` 元素上声明的边框被忽略。\n- 表格背景绘制在单元格边框之间的空间内。\n\
    \n图 10.5 是将 `border-collapse` 设置为 `collapse`（合并）的上述表格示例，展示了合并边框模型下发生的以下变化，这些变化使得表格的行为更类似于\
    \ Excel、Numbers 或其他软件中的典型电子表格：\n\n- 每个单元格之间绘制一条边框，而不是每个单元格周围一个独立的边框。\n- 边框可以应用于表格的任何部分，包括\
    \ `thead`、`tbody` 和 `tr` 元素。\n- 当具有不同 `border-width`、`border-style` 或 `border-color`\
    \ 属性元素接触时，它们不会被同时绘制；相反，浏览器会选择其中一种样式。\n- `border-spacing` 属性被忽略。\n\n图 10.5\n`border-collapse`\
    \ 设置为 `collapse` 的表格布局。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_206_0.png)\n\
    \n# border-spacing\n\n`border-spacing` 属性提供了表格单元格边框之间的间距，接受两个 `<length>` 值，第一个用于水平间距，第二个用于垂直间距。如果只提供一个\
    \ `<length>`，它将应用于双方。\n\n# empty-cells\n\n在分离边框模型中，没有内容的单元格（或设置为 `visibility:\
    \ hidden` 的单元格）可以渲染或忽略其边框和背景样式。\n\n- show: 显示空单元格的边框和背景\n- hide: 隐藏空单元格的边框和背景\n\
    \n# vertical-align\n\n与块元素不同，单元格的内容可以垂直定位。\n\n- top: 单元格内容位于顶部。\n- bottom: 单元格内容位于底部。\n\
    - middle: 单元格内容居中（默认）。\n\n# text-align\n\n`text-align` 属性在应用于表格时表现正常（见第 9 章）。\n\
    \n# 表格值\n\n与 `display` 属性一样，还有 `table`、`inline` 和其他的 `display` 值。以下是表格相关的示例：\n\
    \n```css\ntable { display: table; }\ntr { display: row; }\nthead { display: header-group;\
    \ }\ntbody { display: row-group; }\ntfoot { display: footer-group; }\ncol { display:\
    \ column; }\ncolgroup { display: column-group; }\ntd, th { display: cell; }\n\
    caption { display: caption; }\n```\n\n# 表单和用户界面元素\n\n设计和样式化表单并在浏览器之间获得一致的结果可能是\
    \ Web 开发中最困难的部分。\n\n这种困难大部分源于表单元素的本质。它们的设计是为了向用户索取输入，而这些输入的获取方式在不同设备之间可能非常不同。\n\
    \n不同的操作系统具有原生的表单控件行为和外观，浏览器厂商一直尝试使界面元素的符合这些标准。因此，用户在同一台设备上使用多个浏览器时通常会看到熟悉的输入，但如果他们更换了设备或操作系统，界面就会改变。即使在同一个浏览器中，Windows、Mac\
    \ OS X、Linux 和移动设备之间的外观也可能不同。图 11.1 显示了三个不同设备上 `select` 元素的显示差异。\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_211_0.png)\n\
    \n图 11.1 在 Safari/Apple iPhone iOS4、Safari/Apple iPad iOS3 和 IE 8/Windows XP 中交互\
    \ select元素（从左到右）。\n\n你可以在 Christopher Schmitt 收集并索引的截图集中找到不同浏览器和操作系统应用于表单元素的 CSS\
    \ 其他示例：http://www.WebFormElements.com。\n\n表单布局的独特之处可能在于需要处理表单元素各种定位、放置和状态。大字段、小字段、字段组、标签以及帮助或错误消息都需要被放置，以便让访客清楚他们被要求提供什么。适用于标准长度文本输入及其标签的网格，可能不适用于单选按钮组或电话号码部分、城市和州等输入组合。\n\
    \n"
