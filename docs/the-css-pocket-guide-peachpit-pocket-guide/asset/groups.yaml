- md: "\n# Combining and Chaining Selectors\n\nUsing combinators, you can chain together\
    \ the individual selectors discussed earlier to create more complex selectors\
    \ that can be used to describe elements not just in the entire document but in\
    \ specific parts of the document or that match specific markup patterns. The following\
    \ are all examples of chaining simple selectors:\n\n```\nnav ul li:first-child\
    \ {}\n.vevent h2* {}\nul ul ul ul li {}\n#page .hentry a.entry-title:link {}\n\
    div#main registration fieldset\n-> input[type=\"text\"]:invalid {\n```\n\n# Translating\
    \ Selectors into Plain English\n\nIf it hasn't yet become clear, selectors can\
    \ be read from left to right and described as traveling toward the top of the\
    \ document tree. The selector header ul>li selects “any list item elements that\
    \ are children of unordered list elements that are contained in a header element..\n\
    \nIf you are ever unsure of what a selector does, the online tool SelectOracle\
    \ (http://gallery.theopalroup.com/selectoracle/) translates CSS2 and CSS3 selectors\
    \ into English (or Spanish) for you.\n\n# Specificity\n\nIf the only thing that\
    \ governed which property gets applied to an element is the order in which the\
    \ selectors appear, working with CSS would be a never-ending battle of copying\
    \ and pasting and rearranging code. Rules of specificity—how specific the description\
    \ of the element in the selector is written—are used to determine which properties\
    \ will apply.\n\nIn the previous code, all paragraph elements will have a 20-pixel\
    \ margin on each side; however, because the selector matching paragraphs contained\
    \ in blockquote elements is more specific, those will be the desired color green,\
    \ even though the rule is found before the simple selector.\n\nSpecificity is\
    \ calculated by tallying the simple selectors into three buckets, tallying each\
    \ of those buckets (a-b-c), and finally comparing the results to other competing\
    \ rules. This is from the CSS3 Selectors Module (http://www.w3.org/TR/css3-selectors/#specificity):\n\
    \n- A selector's specificity is calculated as follows:\n- count the number of\
    \ ID selectors in the selector (= a)\n- count the number of class selectors, attributes\
    \ selectors, and pseudo-classes in the selector (= b)\n- count the number of type\
    \ selectors and pseudo-elements in the selector (= c)\n- ignore the universal\
    \ selector\n\n# The CSS Pocket Guide\n\nSelectors inside the negation pseudo-class\
    \ are counted like any other, but the negation itself does not count as a pseudo-class.\n\
    \nConcatenating the three numbers a-b-c (in a number system with a large base)\
    \ gives the specificity.\n\nYou might have gotten lost somewhere around “in a\
    \ number system with a large base,” and I wouldn’t blame you. Looking at a few\
    \ examples should clear things up:\n\n```\n#user { color: rgb(1,1,1); } /* a=1\
    \ b=0 c=0 */\n#user:first-child { color: rgb(2,2,2); } /* a=1 b=1 c=0 */\ndiv+div\
    \ div+div div div div>div div:first-child {\n  color: rgb(3,3,3);\n} /* a=0 b=0\
    \ c=13 */\ndiv.foo { color: rgb(4,4,4); } /* a=0 b=1 c=1 */\n.foo .foo+.foo .foo+.\
    \ .foo .foo .foo .foo>.foo .foo\n-> .foo:first-child {\n  color: rgb(5,5,5);\n\
    }\n/* a=0 b=12 c=1 */\n.foo.bar { color: rgb(6,6,6); } /* a=0 b=2 c=0 */\n[id=\"\
    user\"] { color: rgb(7,7,7); } /* a=0 b=1 c=0 */\n```\n\nIf all these selectors\
    \ matched the same element in a complex HTML document, the text in that element\
    \ would be the color rgb(2,2,2). Though some of the selectors, particularly the\
    \ third and fourth, are more verbose than others, the second is considered the\
    \ one with the greatest specificity.\n\nThe bit about concatenating the number\
    \ in a non-decimal-based number system is a reminder that when combining the results,\
    \ you need to compare them as buckets. For example, compare [1][1][0] vs. [0][12][1]\
    \ instead of 110 vs. 121.\n\n# Chapter 3: Selectors\n\n> note: It may be counterintuitive,\
    \ but the ID selector #user in the previous attribute selector is more specific\
    \ than selecting the same element using the attribute selector [id=user].\n\n\
    # The !important Declaration\n\nThere are occasions where neither the source order\
    \ nor the specificity can be changed, but you still need a way to trump the specificity\
    \ calculations. In these cases, you can use the !important declaration to lock\
    \ down individual properties.\n\n```\nblockquote p { color: green; }\n...\np {\
    \ color: black !important; }\n```\n\nHere the specificity and source order are\
    \ ignored, and the text will be black, not green.\n\n> Most projects will never\
    \ need to use the !important declaration. If you find yourself putting it in your\
    \ code to make something work, instead take another look at what selectors you\
    \ are using, source order, and whether including certain CSS code on a page is\
    \ necessary. The use cases for this declaration typically arise when working with\
    \ third-party code, content management systems, or other situations where you\
    \ do not have the ability to rethink selectors.\n\n# Selector Strategies\n\nThere\
    \ are an infinite number of ways you can write selectors, and there are often\
    \ dozens of ways a particular element in a document can be selected. Well, dozens\
    \ of ways a particular element in a document can be selected.\n\n# Browser Support\
    \ for Selectors\n\nBrowser support for the selectors described in this chapter\
    \ is great. Selectors such as type, ID, class are supported everywhere. CSS2 and\
    \ CSS3 selectors such as + and > combinators are supported widely on desktop browsers\
    \ (http://www.quirksmode.org/css.html) and mobile browsers (http://www.quirksmode.org/m.html).\n\
    \n# Grouping Selectors\n\nDifferent selectors can be separated by a comma and\
    \ assigned the same properties.\n\n```\np, blockquote, ul, li {\n  padding: 0;\n\
    \  margin: 0 1em;\n}\n```\n\n# Selector Speed\n\nThe greater complexity of selectors,\
    \ in the form of chaining multiple nodes or using sibling combinators or attribute\
    \ selectors, the harder the rendering engine needs to work when parsing the document\
    \ and drawing the page.\n\n# Selector Readability\n\nSometimes selectors or groups\
    \ of selectors are chosen for their readability and ease of scanning and visually\
    \ chunking code in the style sheet document. More verbose selectors can easily\
    \ be read and matched to elements in the HTML document structure. The following\
    \ example takes to extreme:\n\n```\nhtml body section article h1 {\nhtml body\
    \ section article p {\nhtml body section article ul {\nhtml body section article\
    \ ul.compact li {\nhtml body section article#opener article h1 {\nhtml body sidebar\
    \ form#newsletter fieldset label {\n```\n\nAlthough it is clear how these selectors\
    \ match to a given HTML DOM, the selectors can be both slow and overly specific.\n\
    \n# Selector Reusability\n\nKeeping the pluses and minus of the other strategies\
    \ in mind, it is often useful to write complex selectors with an eye toward common\
    \ markup patterns and future reuse.\n\nStart with good defaults for your simple\
    \ type selectors to form a baseline that will make elements behave consistently\
    \ regardless of where they appear.\n\nThen chunk more specific selectors by their\
    \ location in the DOM or what makes them unique, being just as verbose as you\
    \ need to be to describe and group the selectors and being specific enough to\
    \ override the defaults.\n\nA selector such as div.header div form#quickSearch\
    \ input[type=submit] may be more specific than you need for the current site and\
    \ cannot be easily transferred to the next project you work on. Trimming the selector\
    \ #quickSearch submit may still provide the specificity and readability you need\
    \ while being generic enough to reuse it.\n\n```\naside #quickSearch label {}\
    \ /* adjust the properties for a special case */\n```\n"
  mdcn: "\n\n# 选择器的组合与链式\n\n通过使用组合器（combinators），你可以将之前讨论的单个选择器链在一起，创建更复杂的选择器。这些选择器不仅可以描述整个文档中的元素，还可以描述文档特定部分或匹配特定标记模式的元素。以下简单选择器链式使用的示例：\n\
    \n```\nnav ul li:first-child {}\n.vevent h2* {}\nul ul ul ul li {}\n#page .hentry\
    \ a.entry-title:link {}\ndiv#main registration fieldset\n-> input[type=\"text\"\
    ]:invalid {\n```\n\n# 将选择器翻译为普通英语\n\n如果还不够清楚，选择器可以从左到右读取，并描述为向文档树的顶部移动。选择器 `header\
    \ ul>li` 选择“任何包含在头部（header）元素中的无列表（ul）元素的子列表项（li）”。\n\n如果你不确定某个选择器的作用，在线工具 SelectOracle\
    \ (http://gallery.theopalroup.com/selectoracle/) 可以为你将 CSS2 和 CSS3 选择器翻译成英语（或西班牙语）。\n\
    \n# 权重 (Specificity)\n\n如果决定哪个属性应用于元素的唯一标准是选择器出现的顺序，那么编写 CSS 将变成一场无休止的复制、粘贴和重新排列代码的战斗。权重规则——选择器对元素描述的特定程度——用于决定哪些属性将生效。\n\
    \n在之前的代码中，所有段落元素（p）的侧边都有 20 像素的外边距；然而，由于匹配包含块引用（blockquote）元素的段落的选择器更具体，因此这些元素将被设置为绿色，尽管该规则出现在简单选择器之前。\n\
    \n权重的计算是通过将简单选择器归入三个“桶中”，统计每个桶的计数（a-b-c），最后将结果与其他竞争规则进行比较得出的。这来自 CSS3 选择器模块 (http://www.w3.org/TR/css3-selectors/#specificity)：\n\
    \n- 选择器的权重计算方式如下：\n- 统计选择器中 ID 选择器的数量 (= a)\n- 统计选择器中类选择器、属性选择器和伪类的数量 (= b)\n\
    - 统计选择器中类型选择器和伪元素的数量 (= c)\n- 忽略通用选择器 (*)\n\n# CSS 速查指南\n\n否定伪类（negation pseudo-class）内部的选择器与其他选择器一样被计数，但否定本身不作为一个伪类。\n\
    \n将三个数字 a-b-c 拼接（在一个大基数的数制中）即可得到权重。\n\n你可能在“大基数的数制中”某处感到困惑，我并不会怪你。看几个示例应该弄清楚这一点：\n\
    \n```\n#user { color: rgb(1,1,1); } /* a=1 b=0 c=0 */\n#user:first-child { color:\
    \ rgb(2,2,2); } /* a=1 b=1 c=0 */\ndiv+div div+div div div div>div div:first-child\
    \ {\n  color: rgb(3,3,3);\n} /* a=0 b=0 c=13 */\ndiv.foo { color: rgb(4,4,4);\
    \ } /* a=0 b=1 c=1 */\n.foo .foo+.foo .foo+. .foo .foo .foo .foo>.foo .foo\n->\
    \ .foo:first-child {\n  color: rgb(5,5,5)\n}\n/* a=0 b=12 c=1 */\n.foo.bar { color:\
    \ rgb(6,6,6); } /* a=0 b=2 c=0 */\n[id=\"user\"] { color: rgb(7,7,7); } /* a=0\
    \ b=1 c=0 */\n```\n\n如果所有这些选择器在一个复杂的 HTML 文档中匹配同一个元素，该元素中的文本颜色将是 rgb(2,2,2)。尽管其中某些选择器（特别是第三和第四个）比其他的更冗长，但第二个被认为是权重最大的。\n\
    \n关于在非十进制数制中拼接数字的说明是在提醒你：在组合结果时，你需要将它们像“桶”一样进行比较。例如，应该比较 `[1][1][0]` 与 `[0][12][1]`，而不是\
    \ 110 与 121。\n\n# 第 3 章：选择器\n\n> 注意：这可能违反直觉，但在属性选择器中，ID 选择器 `#user` 比使用属性选择器 `[id=user]`\
    \ 选择相同的元素更具体。\n\n# !important 声明\n\n在某些情况下，源顺序和权重都无法更改，但你仍然需要一种方法来超越权重计算。在这种情况下，你可以使用\
    \ `!important` 声明来锁定单个属性。\n\n```\nblockquote p { color: green; }\n...\np { color:\
    \ black !important; }\n```\n\n在这里，权重和源顺序被忽略，文本将是黑色，而不是绿色。\n\n> 大多数项目永远不需要使用 `!important`\
    \ 声明。如果你发现自己自己在代码中加入它来让某些功能生效，请重新检查你正在使用的选择器、源顺序，以及在页面上包含某些 CSS 代码是否有必要。此声明的用例通常出现在处理第三方代码、内容管理系统或其他你无法重新设计选择器的情况下。\n\
    \n# 选择器策略\n\n编写选择器的方法有无数种，对于文档中的特定元素，通常有几十种选择方式。没错，对于文档中的特定元素通常有几十种选择方式。\n\n#\
    \ 浏览器对选择器的支持\n\n浏览器对本章描述的选择器的支持非常好。类型、ID、类选择器在各处都支持。CSS2 和 CSS3 选择器（如 `+` 和 `>`\
    \ 组合器）在桌面浏览器 (http://www.quirksmode.org/css.html) 和移动浏览器 (http://www.quirksmode.org/m.html)\
    \ 上都广泛支持。\n\n# 选择器分组\n\n不同的选择器可以用逗号分隔，并分配相同的属性。\n\n```\np, blockquote, ul, li\
    \ {\n  padding: 0;\n  margin: 1em;\n}\n```\n\n# 选择器速度\n\n选择器的复杂度越高（通过链式多个节点、使用相邻组合器或属性选择器），渲染引擎在解析文档和绘制页面时所需的工作就越大。\n\
    \n# 选择器的可读性\n\n有时选择选择器或选择器组是为了可读性以及便于在样式表中进行扫描和视觉分组。更冗长的选择器可以很容易地读取并匹配 HTML 文档结构中的元素。以下示例走向极端：\n\
    \n```\nhtml body section article h1 {\nhtml body section article p {\nhtml body\
    \ section article ul {\nhtml body section article ul.compact li {\nhtml body section\
    \ article#opener h1 {\nhtml body sidebar form#newsletter fieldset label {\n```\n\
    \n虽然清楚这些选择器如何匹配给定的 HTML DOM，但它们可能既慢又过于具体。\n\n# 选择器的重用性\n\n考虑到其他策略的优缺点，在编写复杂的选择器时，考虑到常见的标记模式和未来的重用通常是有用的。\n\
    \n首先为你的简单类型选择器设置良好的默认值，形成一个基准，使元素无论出现在何处都能表现一致。\n\n然后根据它们在 DOM 中的位置或独特性对更具体的选择器进行分组，只需达到描述和分组选择器所需的冗长程度，并足以覆盖默认值。\n\
    \n像 `div.header div form#quickSearch input[type=submit]` 这样的选择器可能比当前网站需要的更具体，并且无法容易转移到下一个项目。将选择器简化为\
    \ `#quickSearch submit` 仍然可以提供你所需的权重和可读性，同时足够通用以便重用。\n\n```\naside #quickSearch\
    \ label {} /* 为特殊情况调整属性 */\n```\n\n"
