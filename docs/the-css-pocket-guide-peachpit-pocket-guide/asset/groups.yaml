    \n# Specifying Media Types\n\nYou can specify the media type associated with a\
    \ block of CSS rules in three ways: through the media attribute on the HTML <style>\
    \ or <link> element, as a parameter for the @import rule, or as a parameter on\
    \ the @media rule.\n\n# media HTML Attribute\n\nThe HTML <link> element and the\
    \ <style> element have a media attribute that accepts a comma-separated list of\
    \ media types. The source file linked to or the code in <style> block will be\
    \ ignored if the device used to visit the page is of a type not listed as one\
    \ of the values. In the case of the <link> element, this means that the linked\
    \ file may not be downloaded, saving bandwidth.\n\n```\n<html>\n<head>\n<!-- stylesheets\
    \ for all media -->\n<link rel=\"stylesheet\" type=\"text/css\" src=\"global1.css\"\
    >\n<link rel=\"stylesheet\" type=\"text/css\" media=\"all\"\n  src=\"global2.css\"\
    >[]</style>\n<style type=\"text/css\" media=\"all\">[]</style>\n<style type=\"\
    text/css\" media=\"all\">[]</style>\n```\n\n(continues on next page)"
