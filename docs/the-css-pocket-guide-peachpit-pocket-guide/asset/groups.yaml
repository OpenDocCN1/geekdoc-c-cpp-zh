    \ of the corners of the top element if the outside of the corners is transparent.\n\
    \n> note: Why not use multiple background images on one element to do this? The\
    \ same older browsers that don't support border-radius do not support multiple\
    \ background images.\n\n# Four Corners\n\nIn Chapter 6, while learning about absolute\
    \ positioning, you saw an example (refer to Figure 6.1) that took four small boxes\
    \ and placed them into each corner of their parent element. You can use this pattern\
    \ to create hooks to attach background images to, representing each of the four\
    \ corners. Though this method has more overhead than previous methods and requires\
    \ some added markup, the results are more flexible than other solutions. Figure\
    \ 8.10 combines the four positioned corners with a background image sprite.\n\n\
    Figure 8.10\nFour backgrounds used to simulate rounded corners.\n\n![](img/e0804bf8d02cf0721cfa6beaa6fe7a9b_166_0.png)\n\
    \n```css\ndiv {\n    position: relative;\n    width: 20%;\n    padding: 8px;\n\
    \    background: #CCC;\n}\n```\n\n```css\n.corner {\n  position: absolute;\n \
    \ padding: 0;\n  width: 14px;\n  height: 14px;\n  background-image: url(images/4_part_corner_sprite.png);\n\
    }\n\n.ctl {\n  top: 0;\n  left: 0;\n  background-position: top left;\n}\n\n.ctr\
    \ {\n  top: 0;\n  right: 0;\n  background-position: top right;\n}\n\n.cbr {\n\
    \  bottom: 0;\n  right: 0;\n  background-position: bottom right;\n}\n\n.cbl {\n\
    \  bottom: 0;\n  left: 0;\n  background-position: bottom left;\n}\n\n...]\n```\n\
    \n<div>\n<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua.</p></div></div>\n\n```html\n\
    <div class=\"corner ctl\"></div>\n<div class=\"corner ctr\"></div>\n<div class=\"\
    corner cbr\"></div>\n<div class=\"corner cbl\"></div>\n</div>\n```\n\ntip: Using\
    \ JavaScript to add these four corner elements into the HTML DOM on the fly is\
    \ a useful way to keep presentational elements out of your markup and keep your\
    \ code lean, especially if you are rounding multiple different blocks on a page.\n\
    \n# Drawing Pixels\n\nTaking the positioning of empty elements to an extreme,\
    \ you can create 1x1 boxes and meticulously re-create the pixels that draw the\
    \ corners of a containing block. This can allow for visual tricks such as anti-aliasing\
    \ and changing border radius without having to re-create background image files,\
    \ but it also makes for lots of code and markup overhead.\n\nLike with the earlier\
    \ corner solutions, you can use JavaScript to create, plot, and position these\
    \ extra elements, giving them proper background color. An example of this is implemented\
    \ in the Curvy Corners JavaScript library (http://www.curvycorners.net/), which\
    \ uses the border-radius property in the CSS document to draw the rounded corner\
    \ when loaded in a browser that doesn’t already support border-radius.\n\n# Border\
    \ and Background Enhancements\n\nBeyond multiple background images and rounded\
    \ corners, CSS3 has a few other tricks in store that will quickly find their way\
    \ into web developers’ toolboxes. Creating color gradients for background without\
    \ the use of images and creating borders with images are both covered in Chapter\
    \ 14.\n\nThis chapter explores how to choose the font used and discusses the other\
    \ properties that give you control over the appearance and the readability of\
    \ the text on the pages you build.\n\n# Font Basics\n\nThe typeface used for rendering\
    \ text and its particular characteristics such as size and weight are defined\
    \ using font and its related properties.\n\nThe font-family property accepts a\
    \ comma-separated list of font family names. The first value in the list that\
    \ is installed on the device used to read the page is the font that will be used\
    \ to style the text.\n\n```css\nfont-family: sans-serif;\n}\n\np {\n  font-family:\
    \ \"Palatino\", serif;\n}\n```\n"
