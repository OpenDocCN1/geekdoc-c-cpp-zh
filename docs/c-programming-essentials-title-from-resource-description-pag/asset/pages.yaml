  md: '# 6.11 COMMAND-LINE ARGUMENTS


    So far, we have dealt with C programs having no arguments passed to the main function.
    As a matter of fact, the main function may have two arguments, traditionally written
    as argc and argv. Consider that after compiling a C program, say flush.c, the
    executable file obtained is flush. Ordinarily, we run the program by typing at
    the command prompt:


    ```

    $ flush

    ```


    where S is the system program. We call the above writing as the command line.
    Now, consider that we want our program to behave as follows. For the command line:


    ```

    $ flush Dear I Always Remember You

    ```


    the program should print the following line to the standard output:


    ```

    Dear I Always Remember You

    ```


    This requires supplying some strings together with the executable file name at
    the command line such the strings supplied can be used by the program we write.
    In our case, the strings are:


    +   * "flush"

    * "Dear"

    * "I"

    * "Always"

    * "Remember"

    * "You"


    Each of these strings is nothing but an argument to the program, and these arguments
    are supplied at the command line. When we write programs whose arguments may be
    supplied at the command line, the main function is written so as accept two parameters,
    say argc and argv, respectively.


    The first argument, argc, is an integer, while argv is an array of pointers to
    characters. More precisely, the command line:


    ```

    $ flush Dear I Always Remember You

    ```


    on execution of the program, the main function will get the value of argc as the
    number of arguments in the command line, that is, the integer value 6 in this
    case, and an array (argv) of pointers to characters size argv will be created.
    The argv array can be pictor viewed as shown in Figure 6.6.


    As a command line consists of at least one program, the minimum value argc can
    get from 1. From Figure 6.6 it is clear that:


    ```

    argv[i]             (i=0,1, ... , 5)

    ```


    is a pointer that points to the (i+1)st argument in the command line. That is,
    argv[0] points to the first argument, argv[1] points to the second argument, and
    so on.


    A program to achieve the task of printing command-line arguments (except for the
    first) is presented as our next program. As an additional task, the program also
    prints the first characters of all the arguments except'
