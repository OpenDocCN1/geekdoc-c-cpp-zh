  md: "# 8.6 FILE POSITIONING\n\nPrimarily, there are two ways to access a file: sequentially\
    \ or randomly. In sequential access, to access a specified position of a, we must\
    \ access all the preceding data before it in a sequential fashion. This means,\
    \ if we want to access the 5th (sec) record of a file, we must access records\
    \ from 1 to 4 in a sequential manner, and only then can we have access to the\
    \ 5th record. On the other hand, in random access, we move the file-position indicator\
    \ to the beginning of 5th record and then access the record without the previous\
    \ records. It is, random access allows us a direct access to a specified portion\
    \ of the file. Now, it should be clear that to use random access files, we need\
    \ some functions that will allow us to move around in a file. These functions\
    \ are known as file-positioning functions.\n\nThere are such functions whose descriptions\
    \ are given below:\n\n+   i) int fseek(FILE *ptr, long offset, int base);\nii)\
    \ long ftell(FILE *ptr);\niii) void rewind(FILE *ptr);\n\nThe function fseek()\
    \ positions the file-position indicator that is referenced by the stream fptr\
    \ by offset from beginning, from the current position of the file-position indicator,\
    \ or from the end of the file, if the value of base is 0, 1, or 2, respectively.\
    \ If a call to the fseek() function is successful, fseek() returns a 0; otherwise,\
    \ it will return a non-zero value.\n\nThe function ftell() returns the current\
    \ position of the file-position indicator in bytes from the beginning of the file,\
    \ referenced by the stream fptr. It returns -1 in any case of error. Notice that\
    \ the data type of these returned values is long int.\n\nThe function rewind()\
    \ repositions the file-position indicator in the file referenced by the stream\
    \ fptr to the beginning of the file and returns nothing. We write a program as\
    \ the next example to illustrate the functions fseek, fread, fwrite, and rewind.\n\
    \n```\nProgram Ch08n4.c\n/*Program code to retrieve user specified lines\nfrom\
