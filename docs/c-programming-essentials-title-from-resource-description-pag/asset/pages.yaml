  md: '# FUNCTIONS AND RECURSION | 97


    Then, the return address field for the newly created activation record is initialized
    with the address of the next statement to be executed in the invoked function.
    The CPU begins execution from the starting address of the called function.


    After the invoked function completes its assigned task and returns, the return
    value (if any) together with the return address of the caller, as stored in the
    activation record for the completed function, is stored in a temporary memory.
    Then the activation record of the completed function is popped from the activation
    stack, so that the top of the activation stack now contains the activation record
    of the caller. The activation record on top is then modified by allocating the
    return value as stored in the temporary section into the appropriate local variable
    of the function activation. The CPU begins execution with the return address in
    the temporary section, which gives the location where left off in the caller.


    The technique is true for any number of function calls to any depth of call -
    viz. a() -> b() -> c() -> d(...) - as long as the activation stack permits enough
    space for the storage of activation records of the functions.


    The states of the activation stack for successive calls are shown in Figure 4.1,
    where the function names indicate the activation records for the corresponding
    functions.


