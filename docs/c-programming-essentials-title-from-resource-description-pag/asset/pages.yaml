    The do-while construct can be considered as a variant of the while construct.
    Instead of having an expression test at the top of the loop, as in the while,
    the do-while makes its test at the bottom of the loop. The loop will, always execute
    at least once de-while tests for continuation at the bottom. The general form
    of the do-while repetition construct is as follows:


    ```

    do

    <Actions_block>

    while(expression);

    ```


    The construct consists of the keyword do, followed by the Actions_block. The Actions_block
    is defined for the while looping construct, i.e., it may consist of one or more
    statements. The Actions_block is followed by the keyword while, and an expression
    in parentheses. A semicolon must terminate the statement.'
