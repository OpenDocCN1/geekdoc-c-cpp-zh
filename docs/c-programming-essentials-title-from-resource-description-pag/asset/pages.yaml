  md: '# 8 | C PROGRAMMING ESSENTIALS


    Different high-level programming languages were introduced in the 1950s to reduce
    the problems that arose in writing code in assembly and machine language. When
    the first high-level languages developed, the long translation and execution time
    were considered serious limitations of the technique. Nevertheless, the following
    factors contributed to the popularity of high-level languages for application
    development:


    +   - Savings in Time and Training: High-level languages were easier to learn
    and understand. Thus, it took less time and effort to write an error-free program
    or to make corrections and code-revisions.

    - Increased Speed and Capacity of Hardware: The third and fourth generations of
    computer hardware brought about a revolution in access time, memory and disk capacities.
    This caused the time overhead incurred by the use of high-level languages to be
    tolerable.

    - Increasing Complexities of Software: With time, software systems grew more complex.
    This necessitated use of complex constructs of which could represent several levels
    of assembly code and was provided by high-level languages.


    Some popular high-level languages include FORTRAN (FORmula Translation), COBOL
    (Common Business Oriented Language), Pascal (after Bla Pascal), C (refer to Section
    1.11), and Ada (after Ada Byron, Lovelace of the world''s first computer programmer).


    # 1.9 | PROGRAMMING TECHNIQUES


    As stated earlier, the task of coding for a problem in a convenient programming
    language is performed only after extensive effort in the problem-solving stage.
    The following sections provide an insight into some commonly adopted programming
    techniques.


    # 1.9.1 | TOP-UP DESIGN


    Early programming techniques developed in the 1950s centred on problem-solving
    using bottom-up design of the solution in which the extreme details of the programming
    solution were investigated, as opposed to beginning with a broad byroad objectives.
    Each program was written in isolation to solve a particular subproblem. The difficulty
    arose when the various sub-programs had to work together to produce the desired
    program. Logic was guided by the limitations of primary memory, and programs were
    designed with the objective of executing them as fast as possible. However, as
    applications grew in, several programmers worked to solve them. Project teams
    were up, consisting of several programmers and a project leader. However programmers
    often switch and might leave a company before a project is fully developed, thus
    requiring another programmer to continue the unfinished work midst. This required
    formulation of a definite summary of how a problem is to be solved. This was not
    provided by the bottom-up approach to programming. Another approach was required.


    # 1.9.2 | TOP-DOWN DESIGN


    In recent years, computer memory caused to be the limitation factor for most of
    the application programs. With increasing software complexity and maintenance
    hence, shifted the focus from the execution time to the programming techniques
    adopted in development of a program. It allowed programs to be written in a more
    organized manner, i.e., in a structured manner, producing code that is easy to
    read, analyze, and modify later – if the need arose. With increasing demands for
    software efficiency and programming standardization, a changed approach saw the
    programmers examining the problem as a whole and outlining the major steps to
    solve'
