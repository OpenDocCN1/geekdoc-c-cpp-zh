    where the structure tag and the structure variables list are optional components
    of the declaration.


    # 7.4 INITIALIZING AND REFERENCING MEMBERS


    So far, we have discussed how we can declare structures and define structure objects.
    We now move on to the techniques of initializing and referencing structure objects.
    A structure object can be directly initialized at its definition — similar to
    the techniques for initialization of variables of built-in data types as we have
    seen in the previous chapters. For example, if we want to initialize the book
    object at the time of its definition, we may do so writing:


    ```

    struct books1 = {

    "C Programming",

    "Pearson Education",

    "Kernighan",

    272,

    79.00

    };

    ```


    The initialization implies that for the structure variable book1, the value for
    the


    +   * title member is "C Programming"

    * publisher member is "Pearson Education"

    * author member is "Kernighan"

    * no_of_pages member is 272

    * cost member is 79.00


    The initialization as mentioned can be performed along with object definitions
    in the structure declaration statement. The general form of initialization of
    structure objects is left to the reader as an exercise. We shall encounter more
    examples of initialization as we proceed.'
