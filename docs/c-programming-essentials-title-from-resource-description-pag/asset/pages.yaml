    \ tasks are grouped together in a functional unit to enhance the modularity and\
    \ comprehensibility of the program. So instead of narrating all the tasks performed\
    \ on a regular basis in a day of our lives as one unit, it would be better to\
    \ modularize the day into valid function units, distinct from one another. Hence,\
    \ it would be better to divide the day in the life of a student into modules or\
    \ functions of travel, school hours, sleep, etc. Functions in C are no different.\
    \ To write a program in C, we first create functions and then put them together.\
    \ Functions break large computing tasks into smaller ones. A C program generally\
    \ consists of many small functions rather than a few large.\n\nA function is expected\
    \ to behave like another – for example, when you are performing the function of\
    \ watching a home video and you are asked to run over to the market and buy milk\
    \ and groceries. The general action in such a case (assuming that you are not\
    \ feeling lazy) is to leave the present function, make a mental note of what you\
    \ were watching, take the list of groceries, and enter the function of the chore.\
    \ While in the chore, you have two possibilities – the market is open or closed.\
    \ If the market open, you buy the goods and return with a success message. However,\
    \ if the market is closed, you return with a message indicating failure. In both\
    \ cases, after returning from the function of running the errand, you return where\
    \ you left off, i.e., resume with what you were doing (in this case, watching\
    \ the home video). We shall return to the analogy later.\n\n# 2.9 USE IDENTIFIER-NAMING\
    \ CONVENTIONS\n\nSome variable- and function-naming techniques are suggested below.\
    \ Although it is not essential to follow the techniques suggested, it is advisable\
    \ to abide by them.\n\n+   - Try using meaningful a name as possible. A variable\
    \ name should indicate the purpose of the variable or the context in which it\
    \ is being used. For example, a variable used to store gross salary might be named\
    \ 'Gross-Salary' rather than 'JKL'. Also, rather than using lowercase names, capitalizing\
    \ the first letters of each word or separating the words by underscores to improve\
    \ readability. As stated earlier, spaces are not allowed in an identifier name.\n\
    \ Avoid full words in variable names if the name becomes too large, even if the\
