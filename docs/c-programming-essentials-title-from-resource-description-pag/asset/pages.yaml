  md: '# FILE ACCESS AND PROCESSING | 185


    The symbolic constant OPEN_MAX limits the maximum number of files that can be
    opened at a time in a particular program. This value of OPEN_MAX depends on the
    compiler. A program gets the information about a particular data file from the
    structure named FILE. The header file, stdio.h, defines an array of structures,
    namely, _iob of size OPEN_MAX, to keep information about all the files that are
    opened by a program.


    Although the structure FILE is shown explicitly, a programmer need not keep track
    of the individual members of the structure. The programmer may open a disc data
    file by calling the fopen() function. The function fopen() works with two arguments,
    which are shown as follows:


    +   - The filename — a string of characters or a pointer to the file name

    - The file access mode — a string


    Essentially, the function fopen() performs two tasks. Firstly, it stores the information
    that will be shared by the program and the operating system into the FILE structure,
    and returns a pointer to FILE structure where it is stored. This pointer is known
    as file pointer and is used as the logical name of the opened file. While opening
    a file, the compiler needs the following:


    +   - The filename we want to use

    - The mode of using the file, i.e., what type of work we want to do with it

    - Where to store the relevant information about the file


    An actual call to this function looks like:


    ```

    fp = fopen("student.dat","r");

    ```


    This opens the file called student.dat in read "r" mode, i.e., for reading purpose,
    and stores the information about the file within a structure FILE and returns
    the file pointer which is collected in the variable fp. So, before calling fopen(),
    the file pointer fp is defined as:


    ```

    *fp;

    ```


    There are three modes of operating a file. These modes are:


    +   - "r" for reading from a file

    - "w" for writing to a file

    - "a" for appending data to a file


    In addition to these three modes, two modifications may also be attached. To use
    a binary file, the modifier "b" is attached. A plus (+) modifier is used to open
    an existing file for updating. For example, if the mode of opening a file is "r+"
    or "a+" (they have the same meaning), it means we are opening a file for appending
    or (if it does not exist, create) for updating at the end of the file. A list
    of different modes of opening a file is given in Table 8.1.


    It should be noted that if an error condition like ''disc full'' while writing,
    or ''open drive door'', or any hardware failure occurs at the time of opening
    a file, fopen() returns a NULL pointer, which is defined as a symbolic constant
    within the stdio.h header file. In practice, when a file is opened, the file pointer
    is checked against NULL pointer before using it.'
