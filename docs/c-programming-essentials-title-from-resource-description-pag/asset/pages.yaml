    We move on to using a recursive function, say fib(), to compute a Fibonacci number.
    Fibonacci numbers are elements of a series given by the recursive definition:


    ```

    fib(i) = fib(i-1) + fib(i-2)  for all i>2

    ```


    The base cases are:


    ```

    fib(1) = 1

    fib(2) = 1

    ```


    Thus, fib(3) = fib(2) + fib(1) = 1 + 1 = 2.

    It is easy to compute the first few numbers of this series would be:


