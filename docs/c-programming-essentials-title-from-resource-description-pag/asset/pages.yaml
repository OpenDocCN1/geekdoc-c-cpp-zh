  md: "Explanation: The above program reads three integer values. It processes the\
    \ first and assigns it to b1. The program reads the second integer but discards\
    \ it as instructed by the asterisk (*) preceding the format specifier in the placeholder.\
    \ The program processes the third integer and stores it in b2.\n\nAs printf, scanf\
    \ returns a value, which gives the number of arguments it has successfully processed,\
    \ or a value of -1 if an error occurs. During processing of the input, this return\
    \ value can be used by the program-mer to detect errors, if any.\n\n# 21.9.3 The\
    \ getchar Library Function\n\nThe getchar function returns a single character\
    \ typed from the standard input device. It is another general input function defined\
    \ within the standard library header stdio.h. The general form of this function\
    \ is:\n\n```\ngetchar();\n```\n\nThe function accepts no arguments. The ASCII\
    \ value of the key that was pressed on success converting it to an int without\
    \ sign extension. On error, the function returns the character EOF. Hence, if\
    \ 'B' is pressed during a successful call to getchar(), the function returns the\
    \ ASCII value of B, which is 66. We normally use the getchar function as shown\
    \ in the following skeleton code:\n\n```\n...\nint ch;\n...\nch=getchar();\n```\n\
    \nIt might seem strange to define the variable char (into which we assign the\
    \ value returned by getchar) as an integer. The return value can be accepted into\
    \ a char without any error. However, there are other reasons for defining it to\
    \ be an int. The reason often cited is that the getchar function can return any\
    \ valid character. Since the normal default for an end-of-file marker is -1, if\
    \ the char data type is used, the value of -1 may be returned.\n\nThe getchar\
    \ function may be called successively to read characters from a line of text.\
    \ The following example reads characters one by one until the Enter key is pressed.\n\
    \n```\nProgram Ch02n012.c\n/*Program to read characters until enter is pressed\n\
    *It uses getchar function*/\n#include <stdio.h>\n\nint main() \n{\nint ch='\\\
    ';\n\nwhile(ch='\\n')\nch=getchar();\nreturn 0;\n}\nEnd Program\n```\n\nThe program\
    \ is self-explanatory. The use of getchar() will be clear as we use it in future\
    \ programs."
