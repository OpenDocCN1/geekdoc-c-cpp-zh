  md: '# 7.12 | ENUMERATED DATA TYPES


    The basic purpose of enumerated data types is to provide an alternative way to
    define integer constants within a program. Just like a structure or a union declaration,
    an enumeration is declared as:


    ```

    enum enum_tag <member list>;

    ```


    An enumerated variable may be defined as:


    ```

    enum_tag <list of variables>;"

    ```


    The members that appear within the enumerator declaration are automatically assigned
    equivalent integers starting from the integer 0. We consider the enumerator declaration:


    ```

    enum mar_status {single, married, divorced, widow};

    ```


    Here, the enumeration constants and their corresponding assigned values are listed
    in the following table:


    | Enumeration Constants | Assigned Integer Values |

    |---|---|n| single | 0 |

    | married | 1 |

    | divorced | 2 |

    | widow | 3 |


    An enumeration declaration may also be of the following form:


    ```

    enum day_of_week {mon=1,tue,wed,thu,fri,sat,sun};

    ```


    In this case, the assigned values to the enumeration constants will start from
    1 instead of 0, since the value for the first enumeration constant, mon, has been
    specified as 1. Moreover, the values for the enumeration constants may be directly
    specified at the time of declaring the enumerator. The following table lists the
    enumerated values for the above statement:


    | Enumeration Constants | Assigned Integer Values |

    |---|---|n| mon | 1 |

    | tue | 2 |

    | wed | 3 |

    | thu | 4 |

    | fri | 5 |

    | sat | 6 |

    | sun | 7 |


    Consider the following enumerator declaration:


    ```

    enum sex{male, female};

    ```


    and the variable declarations like


    ```

    sex sex_of_person, sex_of_spouse;

    ```'
