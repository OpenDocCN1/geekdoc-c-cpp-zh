  md: '# Preface


    # WHY ANOTHER NEW BOOK ON C?


    The popularity of C as a tool for teaching programming to students across the
    globe has resulted in a huge number of books on C. However, the authors feel that
    almost all the books available in the Indian market are lacking in an in-depth
    teaching of the programming techniques.


    C is merely a language, which facilitates writing of programs for computers. In
    an in-depth understanding of the language is indeed the cornerstone to success,
    what separates the master programmers from the novice is usually the superior
    programming skills acquired by the latter over the years. While learning and understanding
    C is science, programming is an art. There are a few thumb rules and some good
    practices, all of them have their exceptions. Thus, this book not only aims at
    teaching the best practices and standard techniques, but also gives the background
    of the technique and why it should be used. Sometimes alternate approaches are
    also discussed, which have their own benefits and are used in some typical cases.


    # RELEVANCE OF C IN TODAY''S WORLD


    C was developed in 1970 by Brian W. Kernighan and Dennis M. Ritchie, and has stood
    the test of time in being one of the most successful languages of all time. C
    was originally developed for UNIX systems, but the ease of usage made it spread
    to other operating systems as well. Currently, C compilers are available for all
    those originally written in C, for UNIX and Microsoft Windows. Thus that the compiler
    is amongst the first set of programs that are written for any new architecture,
    which is proof to reveal the power of the language.


    Although the advent of high-level languages like Java, C++, and many others have
    made software development easier, ease of C has not ended. C is increasingly used
    to write low-level code for small processors that are embedded in devices that
    surround us. Mobile phones, washing machines, set-top boxes, and many other consumer
    electronics utilize embedded processors. C is almost the only language that is
    used to write software routines for these devices.


    In the software industry, C is widely used to write programs which act with the
    hardware like OS kernels and device drivers. C is often treated as a middle-level
    language, which has the features of a low-level language bit manipulation and
    use of pointers along the features of high-level languages like structured programming.
    C has a very stable position in the scenario where we cannot have an operating
    system like low-end mobile phones, portable music players, and other consumer
    electronics goods which surround us. This is fast becoming a very big market with
    a high potential for growth. With the prices of electronics dropping at a steady
    state, this will continue to increase at a fast pace.


    Last but not least, C has a huge role in being a language for teaching programming
    concepts to serious programmers. This is mainly due to the fact that most modern-day
    languages like Java, C++, and C# (along with various scripting languages like
    JavaScript and PHP) use the C syntax of. Nearly all the procedural languages that
    have been developed after C have been greatly influenced by C. So knowing C makes
    the transition to such languages very easy. Most of the modern-day programming
    were originally developed for C code level debuggers, disassemblers, code profilers,
    and syntax checkers.'
