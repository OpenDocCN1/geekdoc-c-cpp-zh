  md: '# 2.10 TYPE-DECLARATION STATEMENTS


    Statements and instructions are the program units contained in functions. In addition
    to the classifications of programming language instructions in Section 1.8, the
    C language has type definitions and declaration statements. These statements define
    and declare the variables for their use in the function and their type.


    Putting data types and definitions together, we illustrate the syntax of variable
    definitions in C. Formally, the variable-declaration syntax is:


    ```

    DataType Variable_identifier {,Variable_identifier};

    ```


    where ''DataType'' is any of the types in C discussed earlier, and the following
    part indicates a list of one or more identifiers (names) separated by commas,
    whose domain is the data type. The list is generated by the fact that the terms
    present in braces might be repeated. Like any other C statement, a semicolon is
    used to terminate the definition.


    We illustrate variable definitions by a few examples.


    ```

    int x, y, z1;

    char Section;

    float basic_sal, Gross_Sal;

    unsigned char z2;

    ```


    where x, y, and z1 are defined to variables of integer data type, i.e., x, y,
    and z1 can store integer values. The other examples have similar interpretations.


    A variable is defined when its properties (data type) have been specified. A variable
    is to be defined when it has been declared and the storage for the variable allocated.
    When a variable is defined but not initialized, the variable contains a garbage
    value. As now, it is enough to know that the definition syntax we presented also
    defines storage for the variable. A variable can be given an initial value by
    initialization at its definition to include a more general syntax for definition
    of the variable. We write the definition syntax as:


    ```

    DataType Variable_identifier < =Constant_expression>

    {Variable_identifier < =Constant_expression};

    ```


    where DataType is the same as in the earlier definition syntax, and the following
    data is now a list of variables of the data type specified by commas and having
    an initialization value, using the assignment ''='' operator as an optional part.
    The terms enclosed in ''<>'' are optional. Thus, all of the variables in the list
    must be initialized at the point of definition. The ''Constant_expression'' is
    an expression of constants or a single constant. The previous section on C constants
    guides the syntax of the constant values. The following examples illustrate the
    above syntax:


    ```

    int x = 10, y, z1 = 77 + (88*100);

    char Section = ''P'', t = 97, g;

    float basic_sal, Gross_Sal = -0.102e2F;

    long z2 = 52533355L;

    ```


    In the example above, x is defined to be of int type and initialized by the integer
    value 10. This provides the definition for x. Gross_sal is defined to be a single-precision
    floating-point number and is initialized with -10.2 (-0.102e2). The ''F'' is added
    to the constant to be the single-precision floating-point number.'
