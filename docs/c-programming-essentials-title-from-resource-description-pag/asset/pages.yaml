    #  7.5 NESTING OF STRUCTURES


    Structures in C may be nested. To substantiate the nesting of structures, we reconsider
    our example of the books structure. Let us assume that we want to store some additional
    information, such as date of purchase and date of publication for each book. To
    include this information, we need to modify our structure declaration for books.
    The requirement may be met by adding six additional member variables: three integers
    for the day, month, and year of purchase, and three more for the day, month, and
    year of publication. This modification in a rather cumbersome structure declaration
    as shown below:


    ```

    struct books{

    char title[20];

    char publisher[25];

    char author[20];

    int no_of_pages;

    float cost;

    int day_of_purchase;

    int month_of_purchase;

    int year_of_purchase;

    int day_of_publication;

    int month_of_publication;

    int year_of_publication;

    }

    ```


    In addition, the above structure declaration does not reflect the fact that the
    day, month, and year of publication are related to each other. It also fails to
    convey the collective purpose of day, month, and year as a composite field (the
    date). Nesting of structures involves object declarations within structure declarations
    as member variables. The more elegant solution to the new specification can be
    declared as follows, without the problems introduced by the more cumbersome solution
    of adding six more integer member variables.


    ```

    struct date{

    int day;

    int month;

    int year;

    }

    ```


    ```

    struct books{

    char title[20];

    char publisher[25];

    ```'
