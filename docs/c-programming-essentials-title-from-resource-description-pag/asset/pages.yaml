  md: '# FUNCTIONS AND RECURSION | 99


    The operation of the non-recursive version of fact() is very simple. It uses a
    loop that starts at 1 and ends at the number, and multiplies each number with
    the increasing product.


    The operation of the recursive fact() is to be carefully understood at this point
    of time. If fact is called with the argument n, the function returns 1; if it
    is called with any other argument, it returns the product n!(n-1). To evaluate
    this expression, fact() is called with n-1 recursively. This process continues
    until n equals 2 and the call calls the function to return. When we compute the
    factorial of 2, the first call to fact() will cause a second call to be made with
    the argument of 1. The second call will return 1, which is then multiplied by
    2 (the original n value). Thus, the final answer is returned as 2.


    A recursive call is similar to a normal function call. However, even though the
    same function calls itself, a new copy of the function is not created. The stack
    is shared for multiple entries of the same function on the activation stack mechanism
    has, in principle, been slightly modified to accommodate recursion. This changed
    complicated and beyond the scope of this book. The reader can consult a book on
    ''compilers'' to know more about the runtime stacks for recursion. At present,
    our previous discussion on the mechanism behind activation stacks is enough to
    understand the issues in implementing and understanding recursion.


    At this point, a warning is placed for the reader who might opt recursion as an
    alternative to iteration. Since recursion creates new entries on the activation
    stack and invokes the context switch, it is not efficient to use recursion for
    situations where recursion might be used. Although recursive functions are easier
    to frame than their iterative counterparts, iteration is always a better alternative
    to recursion when the speed of program execution is an important factor. However
    recursion often creates clean code that is easier to understand and conceptualize—especially
    for solutions to problems that are recursive in nature


    Another thing to note is that recursive function must never be infinite in its
    calling mechanism, since stack space is physically limited. An infinite recursion
    will run out of stack space sooner or later, and in such situations, the system
    pops up an uneasy error message after terminating the program. To avoid this pitfall,
    a recursive function must always contain a terminating criterion or a base case,
    often implemented as an statement, that the recursive calling mechanism undergoes
    a return phase at some point of time in the calling sequence. In the previous
    example, the value passed to each recursive call of fact() is decremented by one
    at each call and the initial value passed to fact is an integer (which contains
    an integral value limited by the system). n=1 equals at some point in the recursive
    calling sequence. Upon encountering this condition the if evaluates to true and
    the value 1 is returned to the caller. The caller returns to where it left and
    evaluates the expression for f. It subsequently returns the value of f and control
    is passed to the function that called it in. Similar steps are performed until
    the recursive calling sequence of fact() has been completed, and the activation
    record for the first call of fact() is popped from the stack and control passes
    back to main(), where execution resumes from where it left off (after the point
    where fact() was called).


    Any function may be recursive, except for main(), which cannot invoke an instance
    of itself. Although some (and now, obsolete) compilers may allow this strange
    and non-standard syntax, newer C compilers will not. It is advisable not to use
    this technique to ensure portability of programs among the different compilers.


    Analysing recursive implementations, the reader will observe the basic philosophy
    of recursive implementations as being a bottom-up approach to the solution. In
    most cases, the base case is the clue behind'
