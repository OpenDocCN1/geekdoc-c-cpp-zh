    /*2 is printed*/\nreturn 0;\n}\n```\n\nEnd Program\n\n# EXECUTION\n\n2\n3.250000\n\
    2\n\nExplanation: Here, the block variable a defined in the inner block is not\
    \ visible when the control reaches the second print statement in the outer block.\n\
    \nEach block introduces its own catalogue of names. A name in the outer block\
    \ is valid in an inner block unless the inner block chooses to redefine. If the\
