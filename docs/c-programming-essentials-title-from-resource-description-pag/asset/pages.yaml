  md: "# 2.20 SCOPE OF IDENTIFIERS\n\nC recognizes identifiers (such as variables\
    \ and functions) as valid only in certain parts of a program. Since identifiers\
    \ are stored in memory, a memory location may be accessible only in certain functions.\
    \ The rules of scope and visibility determine the rules for accessing and referring\
    \ to variables. The scope of an identifier is the range of contexts in which the\
    \ identifier can be used. The visibility of an identifier is the range of contexts\
    \ over which the identifier is valid.\n\nA compound statement is a series of declarations\
    \ followed by a series of statements enclosed within braces (‘’ and ’’). Its main\
    \ purpose is to group statements into an executable unit. A compound statement\
    \ is interchangably called a block when multiple definitions are present.\nHere\
    \ a simple example of a block.\n\n```\nProgram Ch02n15.c\n#include <stdio.h>\n\
    \nint main()\n{\n    int a=2;\n\n    printf(\"%d\\n\",a);      /* 2 is printed*/\n\
    \    int b=3;               /* Start of Inner block*/\n    printf(\"%d\\n\",b);\
    \    /* 3 is printed*/\n}                          /* End of Inner block*/\n}\n\
    End Program\n```\n\n# EXECUTION\n\n2\n3\n\nThe main purpose of blocks is to allow\
    \ variables to be created where needed. If memory is a scarce resource, then a\
    \ block exit will release the storage allocated locally to the block (in the code\
    \ above, the variable b), allowing memory to be used for some other purpose. Functions\
    \ can be viewed as named blocks with parameters and return statements.\n\nThe\
    \ basic rules of scoping is that identifiers are accessible only within the block\
    \ in which they are defined. They are unknown outside the boundaries of the block.\
    \ This situation prevents use of the same identifier in different definitions.\
    \ Now, the problem is to identify the object that the identifier refers to. An\
    \ example will clarify this situation.\n\n```\nProgram Ch02n16.c\n#include <stdio.h>\n\
    \nint main()\n{\n    int a=2;               /*Declaration in Outer Block*/\n```"
