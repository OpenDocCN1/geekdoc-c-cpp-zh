  md: '# 1.5 ALGORITHMS


    An algorithm is a well-defined computational procedure (sequence of computational
    steps). It takes a set of values as its input and produces a set of values as
    its output. It can be viewed as a utility for solving a computational problem.


    There are a number of important features that must be satisfied by any algorithm:


    +   * Finiteness: This imposes that the algorithm must terminate after executing
    a finite number of steps, i.e., that it cannot run infinitely.


    +   * Definiteness: An algorithm, as stated earlier, is a sequence of steps. For
    a computational procedure to qualify as an algorithm, each step in the procedure
    must have a precise definition.


    +   * Input and Output: An algorithm has a domain of values, which initialize
    the procedures. It must also generate a set of result values called output values.
    Thus, an algorithm can be viewed as a function or a transformation that maps input
    values to output values.


    Let us illustrate an example of algorithm for calculating the Greatest Common
    Divisor (GCD) of any two numbers. The problem must be stated explicitly before
    an algorithm can be devised. The GCD problem is stated as:


    > "Given two integers, p and q, find their GCD x (i.e., the largest positive integer
    that divides both p and q exactly"


    We present Euclid''s algorithm for the problem. (Here, Si are the steps of the
    algorithm and ''i'' refers to the number.)


    Algorithm Euclid GCD


    ```

    Begin

    S1: [Calculate remainder]

    Divide p by q and let r be the remainder.

    S2: [Terminate if remainder is zero]

    If i is zero, go to S4.

    S3: [Loop]

    Set p ← q

    Set q ← r

    Go to S1.

    S4: [Set output GCD to q]

    Set x ← q

    End.

    ```


    End algorithm Euclid GCD.


    By examining the steps illustrated in Euclid GCD, we find that the procedure has
    inputs p and q, and produces x as output. It can be shown that the procedure terminates
    after a finite sequence of steps (ensured by S3). Each step is, at the same time,
    precisely defined and can easily be carried out by hand. Thus, we can state that
    the procedure given above is an algorithm.'
  merge: -1
