    The C provides binary arithmetic operators of addition ''+'', subtraction ''-'',
    ''*'', and division ''/''. In addition, C also provides the unary minus ''-''
    operator. Each of these works with all of the basic types in C. The implicit precedence
    relation between the arithmetic operators is given in Figure 2.5, in order of
    decreasing precedence.'
