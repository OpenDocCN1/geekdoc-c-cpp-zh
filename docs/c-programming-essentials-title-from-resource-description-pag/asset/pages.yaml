    # 9.2 FILE INCLUSION


    Most of the programs in this book used the #include directive to include header
    files. The general form for this directive is:


    ```

    #include <name_of_file>

    ```


    Another form for using the directive is:


    ```

    #include "name_of_file"

    ```


    In the former case, the left(<) and right(>) angular brackets manner that the
    search for name_of_file is done in some implementation-defined manner. For example,
    in UNIX systems, the name_of_file is searched for in the directory/usr/


    In the latter form, the angle brackets are replaced with double-quotation marks.
    Here, the search for name_of_file begins in the directory where the source file
    is located. Usually, it is the present working directory. The details are implementation-dependent,
    though.


    # 9.3 CONDITIONAL COMPILATION


    The C preprocessor recognizes a variety of conditional compilation directives,
    and they are listed together with their meanings in Table 9.1.


    The general form for the #if directive is


    ```

    #if expr


    #if HEALTH=1

    #define ACTIVITY "good"

    #else

    #define ACTIVITY "bad"

    #endif

    ```


    where expr is a constant expression. For example,


    | Directive | Meaning |

    |---|---|

    | #if | conditional if |

    | #else | else |

    | #elif | else-if |

    | #endif | end of if and/or elif |

    | #ifdef | if defined |

    | #ifndef | if not defined |


    **Table 9.1** Conditional Preprocessor Directives'
