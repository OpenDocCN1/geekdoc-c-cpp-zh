  md: '# # Appendix B


    # # More on Bitwise Operators in C


    # ## B.1 WHAT, WHY, AND WHEN?


    Bitwise operators are good for saving space and execution time in many cases.
    Sometimes it is necessary to manipulate bits instead of words. Even though such
    features are available in C, they are not often taught in an introductory-level
    programming course.


    If one intends to do some work in systems programming, or other forms of low-level
    programming (e.g., operating systems, device drivers, socket programming, network
    programming), it is required to know how to access and manipulate bits.


    Bit shifting to multiply by two is a fairly common operation; so, it does not
    affect readability in the way that use of bit manipulation can be in some cases
    — for instance, using XOR to switch the values stored in two variables.


    There are also times when one needs to use bitwise operators — for instance, if
    one is working with compression or forms of encryption, or working on a system
    that has limited bits to store Boolean attributes.


    # ## B.2 BITWISE OPERATORS IN USE


    Here, we illustrate some examples on the use of bitwise operators.

    The following code demonstrates the effect of OR(|) and bitwise AND(&) operators
    operated on unsigned integers a and b:


    ```

    unsigned int a = 60;      /* 60 = 0011 1100 *

    unsigned int b = 13;      /* 13 = 0000 1101 *

    unsigned int c = 0, d = 0;


    c = a | b;               /* 61 = 0011 1101 *//

    d = a & b;               /* 12 = 0000 1100 *//

    ```


    We can swap two integers a and b by using bitwise XOR^) operators as shown in
    the following code segment:


    ```

    a = a ^ b;

    b = a ^ b;

    a = a ^ b;

    ```


    The one''s complement operator is a unary operator (requires one operand) and
    has the effect of complementing bits of its integer, and is illustrated with a
    code segment:


    ```

    unsigned int Value=4;  /* 4 = 0000 0100 *//

    Value = -Value;         /* 251 = 1111 1011 *//

    ```'
