  md: "# # 3 CHAPTER\n## Control\n\nThe purpose of this chapter is to explain the\
    \ flow of control that the C programming language supports. Statements in a sequential\
    \ program are normally executed one after the other [Refer to Sequence Construct,\
    \ Fig. 1.3 (a)]. This is also called *sequential flow of control*. However, it\
    \ might be often desirable to use this sequential for a choice of action or a\
    \ pair of repetition [Refer to Selection Constructs, Fig. 1.3 (b), and Repetition\
    \ Constructs, Fig. 1.3 (c)]. We can make a selection among alternative actions\
    \ using the *if*, the *if-else*, and the *switch* statements. The *while*, *for*,\
    \ and *do-while* statements help us perform iterative actions. In addition, *break*\
    \ and *continue* can be used in conjunction with *switch*, *while*, *for*, and\
    \ *do-while* to ease logic overhead. The *goto* keyword will be discussed, but\
    \ not encouraged since it is considered to be an impairment to structured programming.\
    \ In this chapter, we shall discuss the above control statements in turn.\n\n\
    # ### 3.1 THE IF STATEMENT\n\nIf the construct is used to execute a segment of\
    \ code conditionally. The segment of code is specified in the following sections\
    \ by the notation `<Actions_block_i>` referring to the ith block. Action blocks\
    \ consist of a single statement or multiple statements. A multiple-action statement\
    \ must be enclosed within braces, while for single-statement `Actions_block`,\
    \ the braces are optional. Like any C statement, the statements in the Actions\
    \ are terminated by a semicolon.\n\n# ### 3.1.1 First FORM (if STATEMENT)\n\n\
    The general form of an *if* construct is:\n\n```\nif (expression)\n<Actions_block>\n\
    ```\n\nThus, the if construct consists of the keyword *if*, followed by an expression\
    \ in parenthesis, it is followed by a block of actions to be performed if the\
    \ expression is true.\n a strange case, we might choose to keep the actions block\
    \ empty, where we terminate the statement by a semicolon, or a pair of opening\
    \ and closing braces, without any statement enclosed.\n\nTo execute an statement,\
    \ first determine whether the expression is true or false. If the expression is\
    \ true, the statement/(s) in the `Actions_block` is executed and the execution\
    \ proceeds to the statement immediately following the `Actions_block`. However,\
    \ if the expression is evaluated as *false* (a zero value), the statement/(s)\
    \ in the `Actions_block` is skipped and execution jumps to the statement immediately\
    \ following the Actions block. A set of examples is presented below to illustrate\
    \ the use of the if construct."
