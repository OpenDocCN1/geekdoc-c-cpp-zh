  md: "# 7.10 SELF-REFERENTIAL STRUCTURES\n\nIn this section, we discuss how to use\
    \ structures and pointers to build more sophisticated data structures like linked\
    \ lists and trees. Though it is beyond the scope of this book to go into the details\
    \ for using data structures, we attempt to introduce the mechanisms involved in\
    \ it. Continuing from where we left off on the nesting of structures, we now explore\
    \ structures that have members are pointers to structures of their own type. For\
    \ example, the structure declaration:\n\n```\nstruct node{\n    int info;\n  \
    \  struct node *link;\n};\n```\n\nis a valid structure declaration, since the\
    \ pointer variable link is a pointer to a struct node and is not itself of type\
    \ struct node. However, self-reference using structure objects is not permitted.\n\
    \n```\n//the following declaration is erroneous\nstruct node{\n    int info;\n\
    \    struct node a;\n};\n```\n\nAt this point, a brief discussion on linked lists\
    \ is necessary. A list is a finite sequence of zero or more elements of a given\
    \ type. The number of elements, the length of a list is finite, but not known\
    \ before. For this reason, it is not desirable to keep the elements in an array,\
    \ though dynamic arrays can be achieved using the dynamic allocation functions\
    \ as discussed in the chapter on Arrays. Another disadvantage of using arrays\
    \ for this purpose arises when we need to insert or delete elements in the middle\
    \ of the list, since we need to shift the elements of the array to perform the\
    \ operation. Shifting of elements takes time for long lists and is considered\
    \ a disadvantage of representing lists by using arrays. The efficiency of representing\
    \ lists is solely from the rapid search that can be performed by binary search,\
    \ as already discussed.\n\nIn such situations, we may work with a singly linked\
    \ list. A singly linked list is made up of nodes, each of which contains an element\
    \ of the list and a pointer to the next node of the list. The structure requires\
    \ self-referential structures and is evident from the problem statement. The structure\
    \ node declares a structure whose first member (info) is of integral type and\
    \ this will be to store the elements of the list. The other member of node (link)\
    \ is a pointer to another node structure.\n\nThe advantage of such structures\
    \ is that the elements may be inserted and deleted by adjusting the pointers and\
    \ without the requirement of shifting of elements, as in the case with arrays.\
    \ The storage for a new element may be allocated dynamically for an insertion\
    \ and free when deleted from the list. To provide a brief idea about the use of\
    \ such structures, we construct a small linked list that has three entries. We\
    \ define three variables:\n\n```\nstruct node n1, n2, n3;\n```\n\nNow, to make\
    \ a link between n1 and n2, and then between n2 and n3, we set the link member\
    \ of n1 to the object n2. Thus, n1 will be pointing to n2. The link creation between\
    \ n2 and n3 is similarly done. We summarize the task by the following two statements:\n\
    \n```\nn1.link=n2;\nn2.link=n3;\n```"
