  md: "# 7\nCHAPTER\n\n# User-Defined Data Types\n\nIn this chapter, we discuss several\
    \ new data types that are available in C. These data types are convenient to handle\
    \ and simplify the programming task.\n\n# 7.1 STRUCTURES\n\nConsider that we want\
    \ to write a program where we need to keep a group of dissimilar data items together.\
    \ The techniques discussed so far are inapplicable in this regard. Arrays cannot\
    \ achieve the purpose since an array requires all the items stored in it to be\
    \ of the same type. In this situation, we would use C structures to keep the group\
    \ of dissimilar data items under a single composite variable. Thus, in contrast\
    \ to arrays, a structure is used to represent a collection of data items, possibly\
    \ of different data types, by a single name. By means of a structure, group of\
    \ logically connected items of different data types can be handled in a convenient\
    \ manner. It organizes the data items so that they may be referenced either separately,\
    \ when necessary, or as a single unit (the structure variable).\n\n# 7.2 DECLARING\
    \ A STRUCTURE\n\nExample will clarify how we create a structure for use in our\
    \ program. Suppose that we have a collection of books and we want to create a\
    \ data item that contains information about a book, such as:\n\n+   * the title\
    \ of the book\n* publisher of the book\n* author of the book\n* number of pages\
    \ in the book\n* the cost of the book\n\nWe can achieve the task by declaring\
    \ a structure as:\n\n```\nstruct books{\n    char title[20];\n    char publisher[25];\n\
    \    char author[20];\n    int no_of_pages;\n    float cost;\n};\n```"
