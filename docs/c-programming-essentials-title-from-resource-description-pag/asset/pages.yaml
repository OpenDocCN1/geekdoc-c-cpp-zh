  md: '# FEATURES OF THIS BOOK


    C support for design and programming has improved dramatically over the years,
    and lots of new helpful techniques have been developed for its use. This book
    introduces standard C and the key programming and design techniques supported
    by C. This book also presents every major C language feature and the standard
    library.


    It is organized around language, syntax, programming and library of C. However,
    features are presented in the context of their. That is, the focus is on the language
    as the tool for design and programming rather than the language itself. This book
    demonstrates the key techniques that make C effective and the fundamental concepts
    necessary for mastery.


    Chapter 1 presents an overview of programming concepts. Chapter 2 deals with the
    foundation where we explain keywords of C language, data types, expressions, operators,
    and functions together with the structure of a complete program. We also discuss
    the storage classes available in the language. In Chapter 3, the control structures
    available in the C programming language are thoroughly explained.


    In Chapter 4, we demonstrate how functions are designed, how two or more functions
    are put together, and how they communicate with each other. Recursive functions
    are also discussed in detail in this chapter. Multidimensional arrays and strings
    are pivotal concept in C. It is explained in the light of their applications in
    Chapter 5 where Chapter 6 deals with pointers. The basics, benefits, and pitfalls
    of using pointers are too explained. The relationship between arrays and pointers
    are discussed and how pointers can be used in a program to make it efficient is
    addressed.


    User-defined types are addressed in Chapter 7, where the main issue is the discussion
    of how could create their own data types, so that data becomes convenient to handle
    and simplify the programming task.


    In Chapter 8, we present the ways of handling data files in C. The C pre-processor
    is a program that processes a source file before the compiler translates the program
    into an object code. We present the pre-processor in Chapter 9.


    The last six are appendices from A to F. Appendix A helps to remove common errors
    from a C program. Bitwise operators and their use are presented elegantly in Appendix
    B through some examples. Using functions from stdlib is shown in Appendix C. The
    technique of creating own libraries is given in Appendix D. A brief introduction
    to C-99 is presented in Appendix E. Finally, Appendix E is offered as a practice
    de short answer type problems and a set of programming problems too. Some of these
    programming problems are solved.


    # TARGET AUDIENCE FOR THIS BOOK


    This book is aimed mainly at the beginners of programming. No prior programming
    knowledge is assumed. The target audience includes:


    +   - First-time programmers and students of computer programming courses. The
    book can be used as course book for the standard one-semester-long courses in
    programming using C language. Some of the likely sources in the Indian scenario
    are B.Sc., B.Tech., and BCA.


    +   - Hobbyist programmer trying to join into the programming world. Although
    there are many hobbyists who pursue this as a fun. Such enthusiastic people can
    benefit immensely by going through this book.'
