    # 5.6 ROW-MAJOR AND COLUMN-MAJOR ORDER


    Revisiting the storage of arrays in memory, we have already learned that arrays
    of multiples are not arranged as a rectangular (for a two-dimensional array) matrix
    of elements with rows and columns. Instead, they are arranged in a linear sequence
    starting from the base of the array. Now we are moving on to the function that
    the programming language use a referenced element of a multi-dimensional array.
    This mapping must transform the provided coordinates (indices) to an address in
    the linear sequence of memory. The nature of this transformation is dependent
    on how the programming language will store the multidimensional array. Taking
    a two-dimensional array as a simplified case for a multi-dimensional array, we
    find that the array can be stored in either of two ways:


    +   - column by column

    - row by row


    The first type of ordering for the mapping is called a column-major order and
    the second, a row-major order. The mapping function for a row-major order of two-dimensional
    arrays is:


    ```

    Addr(Ai,j) = Base(A) + i*MAXCOLS + j

    ```


    where Base(A) gives the base address of the array A, and the element Ai to be
    accessed. MAXCOLS is the number of columns of the array A.


    The mapping function for a column-major order of two-dimensional arrays is:


    ```

    Addr(Ai,j) = Base(A) + j*MAXROWS + i

    ```


    where MAXROWS is the number of rows of the array A and other terms remain the
    same.'
