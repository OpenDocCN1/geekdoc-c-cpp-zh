    # 7.13 TYPEDEF


    In C, the typedef is used to create new-data-type names. Take for example the
    declaration:


    ```

    typedef int Integer;

    ```


    In the declaration, the name Integer is created as a synonym for int. In fact,
    it allows us to make a shorthand name for complex data declarations. Say, for
    example, we need to define three integer arrays each having 10 elements. We may
    do so by the following block of declarations:


    ```

    //Establishing typedef

    typed int arrays[10];

    ```


    ```

    //defining variables

    arrays first, second,

    ```


    The above declarations would be equivalent to the more conventional method of
    the declaration:


    ```

    int first[10],second[10],third[10];

    ```


    A typedef is normally used when the attribute list for a data type is long and
    complex. A typedef has three specific advantages:


    +   * It provides better documentation for a program. For example:

    typedef char* STRING;

    ...

    STRING message, reply;


    Here, the use of typedef clearly states the purpose of message and reply in the
    program.


    +   * It allows consolidating complex data types into a single name, thereby helping
    minimize effort and probable typing errors that arise from long definitions several
    times in a program.

    * It helps in parameterizing a program against possible portability problems.
    If the attribute list needs to be changed while porting the program from one to
    another, a single change in the typedef would change the implementation of every
    use for the corresponding typedef in the program.


    The following program is a rework of the first program ch07n01.c in the chapter
    and uses typedef to illustrate creation of new data types.'
