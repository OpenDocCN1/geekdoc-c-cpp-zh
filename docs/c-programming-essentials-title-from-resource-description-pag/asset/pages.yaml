  md: "# 40 | C PROGRAMMING ESSENTIALS\n\nThen, h prints its value as 50. The next\
    \ format string %o prints the octal representation of 48, i.e., 60. The hexadecimal\
    \ representation of 50 is 32.\n\nUsually, the output printed by usage of field-width\
    \ specifiers if the specifier is larger than the actual width of the value, is\
    \ right justification with leading blanks added to the value to account for the\
    \ difference. To achieve left justification in output, we add a minus '-' after\
    \ the % in the placeholder. Additionally, if we want to print all positive numbers\
    \ with a leading + sign and all negative numbers with a minus sign, then a '+'\
    \ sign is used after the %. Further, while using right justification for numeric\
    \ values, a '0' (zero) after the % causes leading zeros to appear instead of leading\
    \ blanks. If a # is used along with zero and x control characters, the corresponding\
    \ octal and hexadecimal numbers will be preceded by a 0 and a 0x respectively.\
    \ Experimenting with as many possibilities as possible.\n\nIt is important to\
    \ note that the expression arguments are evaluated from right to left. An interesting\
    \ situation:\n\n```\nProgram Ch02n6.c\n#include <stdio.h>\n\nint main()\n{\n \
    \   int a=10;\n\n    printf(\"%d, %d, %d\\n\",a,++,a,----a);\n    printf(\"%d\\\
    n\",a);\n    return 0;\n}\nEnd Program\n```\n\n# EXECUTION\n\n9,9,9,9\n10\n\n\
    Explanation: Since function arguments are evaluated from right to left, the rightmost\
    \ argument --a evaluates to 9, and 9 is placed at the final %d placeholder. Here,\
    \ a-- is evaluated to 8, but since in the postfix form the initial value is 9\
    \ and then updated with the new value, the second placeholder %d will have the\
    \ value 9. For similar reasons, ++a the incremented value of a, i.e., 9 and for\
    \ the first placeholder (the first '%d') ++a is evaluated to 10, but the value\
    \ before increment, i.e., 9, is sent. Thus, the parameters in order will print\
    \ 9, 9, and 9 respectively. The second printf statement prints the current value\
    \ of a, i.e. 10.\n\nThe printf function has an integer value (i.e. it returns\
    \ an integer to the calling function). The return value can then be checked to\
