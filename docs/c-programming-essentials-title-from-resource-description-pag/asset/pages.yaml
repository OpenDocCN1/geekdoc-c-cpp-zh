  md: "# FUNCTIONS AND RECURSION | 91\n\nProgram execution always begins with a main\
    \ function. When program counter encounters a function name, the function is called\
    \ or invoked. This means the program control passes to the function. After the\
    \ function does its work, program control is passed back to the calling environment,\
    \ which then continues with its work. In the above example, execution begins in\
    \ main( ). When program counter encounters message( ), the compiler finds that\
    \ a called message() already exists, since it has been defined before main().\
    \ So, the function is invoked and program control is passed to it. After the two\
    \ printf( ) statements in message have been executed, program control passes back\
    \ to the calling environment, which in this example is main( ). Since there are\
    \ no more statements in main( ), the program ends.\n\nParameters are syntactically\
    \ identifiers and can be within the body of the function. Some of parameters in\
    \ a function definition are called formal parameters to emphasize their role as\
    \ placeholders for actual values passed to the function when it is called. On\
    \ invocation, the values of the arguments responding to a formal parameter are\
    \ used within the body of the function.\n\nTo illustrate these ideas, let rewrite\
    \ the above program so that message() has a formal parameter. The parameter will\
    \ be used to show the number of times the message will be printed.\n\n```\nProgram\
    \ Ch04n02.c\n/*Program demonstrating function parameters*/\n#include <stdio.h>\n\
    void message(int k)\n{\n    while(k!=0)\n    {\n        printf(\"Message for you:\"\
    );\n        printf(\"Have a nice day!\\n\");\n    }\n}\nint main()\n{\n    int\
    \ n;\n    printf(\"Enter a positive integer: \");\n    scanf(\"%d\",&n);\n   \
    \ message(n);\n    return 0;\n}\nEnd Program\n```\n\nIn the above program, the\
    \ function message() has been defined as one that accepts an integer as a solitary\
    \ argument and returns no value. The main function accepts an integer and reads\
    \ it into n by calling the scanf function. It passes the value of n to message(\
    \ ), and the function() is invoked with the value of its formal parameter, k set\
    \ to the value of the actual parameter, n, in the calling function. The called\
    \ function executes a loop using the value of k to print messages on the screen.\n\
    \nIn both of the above examples, the called function was defined before the calling\
    \ function. This enabled the compiler to recognize the called function when it\
    \ was invoked from the caller. However, there are instances"
