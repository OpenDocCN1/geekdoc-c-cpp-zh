    # 7.9 ARRAYS OF STRUCTURES


    An array of structures is defined just as any other C array definition. The only
    difference is that in this case, every element of the array is a structure. Thus,
    an array of structures provides a mechanism of grouping similar data items together.


    To demonstrate arrays of structures, let us consider the following specification
    for a program: "Consider that we have a set of pairs of integer values and we
    want to get the average of each of pairs.

    The task of writing a solution to the problem, we would need two integer arrays
    for holding the integer pairs and a float array for holding their averages. One
    possible implementation would be to use three parallel arrays, array first, array
    second, and array average, as:


    ```

    int first[20];

    int second[20];

    float average[20];

    ```


    Usage of these parallel arrays can be achieved in another elegant fashion—by an
    array of structures.

    As we know from the problem specification, each pair of integer values is associated
    with its average value. Thus, we may declare a structure as:


    ```

    struct pair{

    int first;

    int second;

    float average;

    };

    ```


    Then we define an array of structures of type pair as:


    ```

    struct pair triplet[20];

    ```


    The statement will define an array of 20 elements, each of which is a structure
    of type pair, called triplet. The program to achieve this task by using this representation
    is presented next. It reads 20 pairs of integers from the standard input device
    and stores them within the members first and second of the corresponding element
    of triplet. The average member of each array elements is computed by calling a
    function, findavg(), which receives the arguments—the structure array (triplet)
    and the array size (in case, 20).


    Notice that as the array triplet is passed as an argument to findavg(), the function
    actually receives the address of the first element of the structure array (&triplet[0]).
    This is the same with other arrays, where the array passed to a function by name
    actually passes the address of the first element of the array. So, it is possible
    to modify the triplet elements within findavg(), and these changes will be reflected
    in the invoking function.'
