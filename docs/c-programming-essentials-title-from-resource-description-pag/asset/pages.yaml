    <Actions_block_1>

    else

    <Actions_block_2>

    ```


    Since if statements are not explicitly nested using braces, there is an ambiguity
    regarding the associativity of the else block. There is confusion with if then
    else is associated with. In other words, the structure can be interpreted in two
    different ways.


    ```

    if(expression1){

    if(expression2){

    <Actions_block_1>

    }

    else{

    <Actions_block_2>

    }}

    ```


    (A)


    (B)


    The C language interprets nested if structures matches else''s in the absence
    of explicit braces by a simple rule. It links the else to the closest preceding
    if is not already associated with an else statement. In the above example, the
    rule matches the mismatched else with the second statement, i.e., the closest
    preceding if that is not matched with an else. Thus, (A) will be the correct interpretation
    for the preceding example, and not (B). If, however, we want to associate the
    else to the first statement, we must use explicit braces as in (B) to force a
