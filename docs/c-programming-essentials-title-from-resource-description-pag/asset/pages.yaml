  md: '# 1.8 | PROGRAMMING LANGUAGE CLASSIFICATIONS


    A language is a medium for communication. The languages we speak are called natural
    languages. A programming language is a subset of the set of natural languages.
    It contains all the symbols, characters, and usage rules that permit a human being
    to communicate with computers. A variety of programming languages have been invented
    over the years of computer history. However, every programming language must accept
    certain types of instructions that enable a computer to perform a number of familiar
    operations. In other words, every programming language must have instructions
    that fall under the following categories:


    +   * Input/Output Instructions: A program needs input from the external world
    (or implicitly) with which it operates on the data, and generates output (compare
    with algorithm). Input/output instructions provide details on the type of input
    or output operations to be performed, and the storage locations to be used during
    the operations, hence they are provided with purpose.


    +   * Arithmetic Instructions: A program may be required to perform arithmetic
    operations on the data in the program. Arithmetic instructions are provided for
    the requirement. These perform the arithmetic operations of addition, subtraction,
    multiplication, division, etc.


    +   * Storage/Retrieval Instructions: These are used to store, retrieve, and move
    data processing. Data may be copied from one location to another and retrieved
    as required.


    +   * Control Instructions: These are selection and loop constructs, which aid
    in out-of-sequence program flow.


    Although all programming languages have an instruction set that permits these
    familiar operations to be performed, a marked difference is found between the
    symbols and syntax used in machine languages, assembly languages, and high-level
    languages.


    # 1.8.1 | ASSEMBLY LANGUAGE


    Some applications are developed by coding in assembly language – a language closest
    to the machine language. This type of application software is most efficient for
    processing data. However, since a particular flavour of the assembly language
    is designed for a particular architecture, the assembly language understood by
    a computer depends upon the underlying architecture of the microprocessor. For
    example, if a Zilog* processor is used, then the machine language understood is
    Z-80. On the other hand, a flavour of the Intel assembly language is used for
    a Pentium microprocessor which differs from the Z-80. Thus, assembly languages
    are architecture-dependent.


    # 1.8.2 | HIGH-LEVEL LANGUAGES


    Given the inability of assembly language to adapt across different architectural
    platforms and given the variety of real-world problems, a variety of computer
    languages, called high-level languages, were developed, each suited best to a
    model in a particular class of problems. High-level language programs are architecture-independent,
    easier to write, and provide easy maintenance and readability than their assembly-language
    counterparts. However, they require longer execution time compared to assembly-language
    programs.'
