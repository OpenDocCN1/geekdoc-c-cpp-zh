    The relative precedence of the operators tells us which of the operators to apply
    first in an expression. For example, 3 + * 4 should evaluate as 32 or, depending
    on the order in which the computations are carried out. From the rules of arithmetic,
    we know that the correct result should be 23, since multiplication takes precedence
    over addition. On the other hand, (3+5)*4 produces the result 32, since the parentheses
    tells to add 3 and 5 before multiplying by the 4. The parentheses override the
    operator-precedence hierarchy, and thus have the highest precedence. The complete
    operator-precedence table is given in Figure 2.16, with operators on the same
    level having equal precedence and the precedence decreasing as we go down the
    table.


    As from the precedence table, we find that some operators have not been discussed.
