  md: "# 94 | C PROGRAMMING ESSENTIALS\n\nThus, in summary, a return statement can\
    \ have one of the following two forms, where expression is any allowed C expression:\n\
    \n+   * return;\n* return(expression);\n\nOR\n\nreturn expression;\n\nIf an expression\
    \ is provided after the return statement, it may or may not be enclosed within\
    \ parentheses. In both cases, the function returns the evaluated value of the\
    \ expression to the caller. The data type of the returned value must match with\
    \ the return type of the function, as specified in the first line of the function\
    \ definition. The choice to enclose parentheses with the expression following\
    \ the return statement is left to the programmer to decide. We now summarize the\
    \ effect of return statements:\n\n+   * A return statement affects an exit from\
    \ a function, and transfers control to the immediate next statement in the calling\
    \ function.\n* The return statement may include an expression that evaluates to\
    \ the value returned by the function.\n* If a function includes no return statement,\
    \ or includes a return statement without an associated value, then the function\
    \ does not return a value.\n* The caller can choose to ignore the value returned\
    \ by a function, or it can use the returned value in an expression.\n\nLet us\
    \ write a program that computes the minimum of two integers using functions:\n\
    \n```\nProgram Ch04n4.c\n/*Minimum of two integers*/\n\n#include <stdio.h>\n\n\
    int min(int,int);\n\nint main()\n{\n    int a,b,c;\n    printf(\"Enter two integers:\
    \ \",&a,&b);\n    scanf(\"%d%d\",&a,&b);\n    c=min(a,b);\n    printf(\"\\n%d\
    \ is the minimum of %d and %d.\\n\",c,a,b);\n    return 0;\n}\n\nint min(int a,int\
    \ b)\n{\n    return (a<b) ? a: b;\n}\nnEnd Program\n```"
