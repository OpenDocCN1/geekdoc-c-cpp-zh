    Here, m is a constant holding the address of m[0], i.e., the value of m is &m[0].
    Obviously, the address &m[0] is the address of the integer m[0]. Hence, by rule,
    we are allowed to assign this to the pointer variable pm. It is interesting to
    note that the following assignments are identical to each other:


    ```

    pm = &m[0];

    and pm = m;

    ```


    A more interesting part is to look at the effect of the assignment:


    ```

    pm += 1;

    ```


    By the nature of the increment, we find that the expression should increase the
    value of the pointer variable by 1. Thus, the expression should increment the
    address contained in the pointer variable. Upon encountering an increment of an
    address, C increments the address automatically by the size of the data type of
    the pointer variable. In our case, the increment quantum is sizeof(int), since
    the pointer being incremented is an integer pointer multiplied by the size of
    the data type and thus obtained. Hence, the requested increment will assign pm
    the address of the new address. After the operation, the pointer variable pm contains
    the address of the array element m[1]. If we had incremented pm by 2 instead of
    i, pm would have contained the address of m[2], and so on. More generally, if
    pm points to m[0], then (pm + i) will point to the element that is i after pm,
    and (pm - i) will point to the element that is i before pm. This is true regardless
    of size of the elements in the array.


    We now consider (*pm + i) is identical to m[i].


    In fact, all array references are internally converted to pointer references as
    we mentioned earlier. Thus, the array reference m[i] is internally converted to
    the pointer expression (*m + i). As m holds the address of the first element in
    the array, (m + i) will point to the element m[i] in the array, i.e., (*m + i)
    is equivalent to m[i].


    To understand the mechanisms behind this scheme of operations further, we need
    to understand how the scalar size of pointers plays its role in pointer arithmetic.
    When a pointer is added to or subtracted an integer, the integer is scaled by
    the scalar size of the pointer. That is, for the following expression:


    ```

    *(pm + i)

    ```


    ```

    = *(pm + (i * (scalar size pm)))

    = *(pm + (i * sizeof(int)))

    = m[i]

    ```


    This tells us that (pm + i) points to the ith element of the array if pm points
    to the first element of the array, irrespective of the type of array. In connection
    with arrays and pointers in C, recall that an array name is a constant. So, the
    following statement is illegal.


    ```

    pm = m;

    ```


    However, due to reasons that must be clear to the juncture, the following statement
    is perfectly permissible.


    ```

    pm = m;

    ```


    So we have seen that a pointer may be added to or subtracted by an integer to
    yield a new pointer value (address). We should also take note of the fact that
    two pointers pointing to identical data types may be subtracted from each other
    which gives the distance between the pointers. These constitute the features of
    address arithmetic in C.'
