    #  22.2.2 | volatile


    Since this section requires some basic knowledge about control statements to understand
    the example provided, it is recommended that the reader who is studying C for
    the first time skip this part without hesitation. He/she can come back to this
    section after reading the chapter on Control.


    If a variable is declared as volatile, it informs the compiler that the value
    of the variable may change due to factors other than those coded in the program.
    For example, some device or the operating system may change the value of a variable
    externally, without changes being present in the code. This phenomenon becomes
    a problem when it comes to optimizing compilers, which shuffle and change bits
    and pieces of the code around to make it shorter and/execute faster. Thus, given
    the following code fragment:


    ```

    a=10;

    t=0;

    while(a) {

    t++;

    }

    ```


    since the variable a is not modified anywhere inside the while construct (because
    a is not present on the left side of any assignment statement), the compiler may
    safely optimize the code to look like:


    ```

    a=10;

    t=0;

    while(1) {

    t++;

    }

    ```


    The above optimized code would result in the absence of a condition check at the
    onset of each execution of the while loop construct. Thus, our optimizing compiler
    will wisely create an equivalent code that executes faster than the original one.


    All is fine if we consider the variable a cannot be modified within the while
    loop construct. However, with multiple processes and every I/O devices allowed
    to access memory, it may happen that our program might be waiting for an external
    event to modify the value associated with a. In such a situation, the optimization
    is a problem and needs to be bypassed. The keyword volatile, if present in a variable
    declaration, does exactly the same. It forces a check for the value of the variable
    each time it is accessed – even if it is not modified between two reads. For example,
    the following declaration will create a volatile integer.


    ```

    volatile int a;

    ```


    Both the qualifiers can be used together, and the effect will be a variable that
    can be changed by external events.'
