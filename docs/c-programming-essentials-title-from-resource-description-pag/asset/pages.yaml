    \ returns a 1 if the combination of the date, month, and year passed to it represents\
    \ a valid date, and 0 otherwise.\n\n# 6.12 OTHER POINTER ISSUES\n\nPointers must\
    \ be assigned a valid value after its declaration, since local pointers contain\
    \ (garbage) values. However, global pointer declaration ensures that the pointer\
    \ variables contain NULL. Errors and crashes may result from using a local pointer,\
    \ before assigning it value. The null pointer, as discussed in the earlier section,\
    \ deserves a special mention in regard of usage. It is a simple convention that\
    \ a pointer containing a NULL value points to nothing. It is merely used by the\
    \ programmer to indicate that the pointer does not contain a valid address. A\
    \ program may crash if the value at the address of a null pointer is accessed\
    \ by the program. For clarity, we restate that a null pointer is unused and not\
    \ enforced as an invalid address by the C language.\n\n# >>> SUMMARY\n\nPointers\
    \ are one of the most and commonly used features of C. Usage of this technique\
    \ to access memory directly can lead to more compact and elegant programs. The\
    \ beauty of pointers lies in their ability to simulate call-reference, although\
    \ such a technique is not available in C.\n\nPointers have their own operations.\
    \ Many operations for non-pointer variables are either unavailable or available\
    \ in a different fashion for pointers.\n\nPointers are closely related to arrays.\
    \ In fact, array arithmetic (index to address resolution) is interpreted as pointer\
    \ arithmetic by the C compiler. This technique is available for arrays of any\
    \ dimension. Although we have discussed pointer arithmetic techniques for array\
    \ element resolution of single- and two-dimensional arrays, this technique can\
    \ be extended to include arrays of any dimension. In addition, there can be arrays\
