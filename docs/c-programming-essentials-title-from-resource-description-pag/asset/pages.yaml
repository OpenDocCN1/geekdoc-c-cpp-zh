  md: "Even a small function such as min() provides useful structuring of the code.\
    \ We can similarly write a function, max(), to return the maximum of two integers.\
    \ The code is left to the reader as an exercise.\n\nIt is noteworthy to mention\
    \ the return type of main(). C allows the main function to return an integer value\
    \ to the calling process. If the executable program is called from the shell,\
    \ the calling process is generally the operating system. The returned value indicates\
    \ the exit status of the program. Thus, it is technically equivalent to calling\
    \ the standard library function exit() with the same value as in the return statement.\
    \ It is not guaranteed that the compiler will return a default value (usually\
    \ 0) if the return statement is not present in the main function. So, it is useful\
    \ to always specify the return type of our main function as an int and return\
    \ the default value of 0 (indicating that the program executed successfully) if\
    \ required and any other integer value as when required.\n\n# 4.4 CALL-BY-VALUE\n\
    \nFunctions are invoked by writing their name and type (one-to-one correspondence)\
    \ with the parameters in parentheses. These arguments match the parameter list\
    \ of the function definition. When we call a function with an argument (an actual\
    \ parameter), the program copies the argument into the storage allocated for the\
    \ corresponding formal parameter. Thus, the function works with a copy of the\
    \ argument in the function. This means that the function will not change the variables\
    \ that we have passed as arguments. The information flow via the argument list\
    \ is, unidirectional, as we have seen so far. If a variable is passed to a function,\
    \ the stored value of that variable in the calling environment will not be changed.\
    \ Such a parameter passing mechanism is known as call-by-value. In this chapter,\
    \ all arguments to the functions are passed by the mechanism of call-by-value.\
    \ This means that each argument is evaluated and its value is used locally in\
