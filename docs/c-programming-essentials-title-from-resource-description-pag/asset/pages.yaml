  md: "# EXECUTION\n\nX=7.\n*Explanation*: In the absence of explicit braces, the\
    \ \"associate **else** with the closest preceding unmatched **if**\" rule is applied,\
    \ and the if hierarchy interprets the same as Program Ch03n16.c. The usage of\
    \ an implicit structure is simply to avoid deeply indented hierarchies. If the\
    \ hierarchies are nested too deep, the code becomes unreachable. In addition,\
    \ deep nestings are not supported for all C compilers. In such a case, the switch-statement\
    \ is recommended as an alternative.\n\nThe above structure can be generalized\
    \ by the following construct for the if–else ladder:\n\n```\nif(expression1)\n\
    \    <Actions_block_1>\nelse\nif(expression2)\n    <Actions_block_2>\nelse\nif(expression3)\n\
    \    <Actions_block_3>\n    ...\nelse\n    <Actions_block_n>\n```\n\nTo execute\
    \ this, we find the first expression, if that evaluates to true. If expression\
    \ j is the first true expression, we execute the actions associated with it, i.e.,\
    \ <Actions_block_j> for any j in [1, n]. All other action blocks are skipped and\
    \ the program exits the construct. However, if no expression is true, we execute\
    \ <Actions_block_n> and proceed to the statement following the ladder. The following\
    \ example uses the if–else ladder hierarchy:\n\nProgram Ch03n18.c\n#include <stdio.h>\n\
    int main() {\n    int x=7;\n    if(x--<2)\n        x=x;\n    else if (x--<4)\n\
    \        x=2*x;\n    else if(x--<6)\n        x=3*x;\n    else\n        x=4*x;\n\
    \    printf(\"\\nx=%d.\\n\",x);\n    return 0;\n} End Program"
