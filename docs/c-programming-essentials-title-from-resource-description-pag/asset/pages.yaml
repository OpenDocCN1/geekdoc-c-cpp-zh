    \ a structure; it is followed by the structure tag (in this case, books) and a\
    \ list of books objects separated by commas. This definition causes the compiler\
    \ to follow three steps listed below:\n\n+   - Move to the structure tag list\n\
    - Find the structure tag - books\n- Allocate storage for as many structure objects\
    \ of type books as present in the list with the identifiers for the objects as\
    \ specified in the list. The storage is allocated in accordance with the structure\
