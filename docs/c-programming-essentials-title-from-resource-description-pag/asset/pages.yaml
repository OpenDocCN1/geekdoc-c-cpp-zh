  md: "# # Appendix D\n\n#  Creating Static Library with gcc\n\nA static library is\
    \ a set of functions, which are resolved in a caller at compile time and copied\
    \ into a target application by a compiler or linker, producing an object file\
    \ and a standalone executable. All the predefined functions that we use through\
    \ header files like stdlib.h are part of static libraries. In this article, we\
    \ will look into the process of creating such static libraries of our own using\
    \ the GNU C compiler and related utilities, available for both Linux and Windows.\
    \ Another feature of a static library is its pre-compiled nature. This enables\
    \ the programmer to distribute the library without having to include the source\
    \ files. Think of it as something like the printf() function. We use it every\
    \ day, but we do not need its source code.\n\nWe would need a copy of the actual\
    \ source file, mymath.c, comprising simple functions: add() and sub() to perform\
    \ integer addition and subtraction, respectively.\n\n```\n/* mymath.c */\nint\
    \ add (int a, int b)\n{\n    int sum;\n    sum = a+b;\n    return sum;\n}\nint\
    \ sub (int a, int b)\n{\n    int diff;\n    diff = a-b;\n    return diff;\n}\n\
    ```\n\nNext, we need the header file for, \"mymath.h,\" where we have the function\
    \ declarations of both the functions.\n\n```\n/* mymath.h */\nint add (int a,\
    \ int b);\nint sub (int a, int b);\n```\n\nFirst, we convert the \"mymath.c\"\
    \ file to its object file using gcc. The -c option tells gcc to compile the source\
    \ file, but not to link it. The -o option is to specify a name to the output file.\n\
    \n```\n$ gcc -c mymath.c -o mymath\n```"
  merge: -1
  pgno: 238
