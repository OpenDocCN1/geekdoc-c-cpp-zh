  md: '# 1.6 ANALYSIS OF ALGORITHMS


    As there are a number of methods that can be adapted for solving a particular
    problem, a number of algorithms corresponding to the various methods may exist.
    We often have to make a choice regarding the use of a particular algorithm as
    a suitable one. Such a selection necessitates analysis of algorithms. When we
    talk about an algorithm for solving a particular problem, we try to predict the
    resources required by the algorithm. Although resources such as memory capacity
    and system bandwidth may of concern, the efficiency of an algorithm is primarily
    measured by its running time.


    Generally, it is found that the running time of an algorithm increases with the
    input size. Thus, the running time is described as a function of the input size.
    The number of items in the input or the number of bits required for input representation
    is the most general measure of input size.


    +   - Worst-case Analysis: Worst case is an upper bound on the running time for
    any input to the algorithm. This guarantees that the algorithm will not be worse
    under any circumstance. The worst case occurs often and a natural choice for analysis.


    +   - Average-case Analysis: The average case is often roughly as bad as the worst
    case, when we consider that all inputs of a given size are equally alike. However,
    it might not be apparent as to what constitutes an average input to a particular
    problem.


    +   - Order of Growth: It is the rate of growth of the running time that algorithmic
    studies are generally concerned with. We, therefore, consider only the leading
    term of a formula, ignoring the leading term''s constant co-efficient, as constant
    factors are less than the rate of growth in the computational efficiency for large
    inputs.


    We consider an algorithm to be more efficient than if its worst-case running time
    has a lower order of growth.


    # 1.7 FLOWCHARTS


    The flowchart is an important tool aiding development. A flowchart is a graphic/pictorial
    representation of the steps necessary to solve a problem, accomplish a task, complete
    a process, or illustrate the components of a system. The basic types of flowcharts
    are system flowcharts and program flowcharts. A system flowchart is a representation
    of the components and flows in a system. A program flowchart represents the information
    processing steps performed within a computer program. In this section, we shall
    only program flowcharts. The various symbols used in drawing flowcharts are shown
    in Figure 1.1. Henceforth, we shall mean program flowcharts, when we refer to
    flowcharts unless stated otherwise.

    The flowchart symbols are explained as follows:


    +   - Oval/Rounded Rectangle: These symbols indicate the start or end of the program
    as indicated by the text written inside the symbol.


    +   - Rectangle: Indicates a processing step where the step performed is indicated
    inside the rectangle.


    ![](img/a116934ba9dd16733cbd4eff6a88dec6_21_0.png)


    Fig. 1.1 Common Flowchart Symbols'
