  md: '# 9

    CHAPTER

    The C Preprocessor


    The C preprocessor is a program that processes a C source file before the compiler
    translates the program into object code. During processing the C source file,
    it performs certain modifications on the file based upon instructions or directives
    given to the preprocessor. The preprocessor directives are simply commands that
    start with a # symbol (character). We will examine directives one by one this
    chapter.


    # 9.1 MACRO SUBSTITUTION


    We have already seen that the #define preprocessor directive is used to create
    a symbolic constant for use in a program. The general form of this directive is
    given:


    ```

    #define macro-name replacement-text

    ```


    where macro-name is replaced with replacement-text through the program.

    For example, the directive


    ```

    #define PI 3.1415

    ```


    directs the #define directive to replace all symbolic constant PI with the text
    3.1415.

    The #define directive can also be used for defining parameterized macros. A parameterized
    macro is a macro with arguments. The general form of such macros is:


    ```

    #define macro-name(arg1,arg2,...) replacement-text

    ```


    Some examples of parameterized macros are:


    ```

    #define read(i) scanf("%d",&i)

    #define print(i) printf("%d\n",i)

    #define getchar() getc(stdin)

    ```


    The last example is a macro with zero parameters. Notice that the arguments are
    used at the time of defining a parameterized macro as formal parameters. So, a
    two-level replacement is done during the substitution.

    First, the formal parameters are substituted by actual parameters, and the macro
    body is substituted.

    For example, the statement:


    ```

    print(x);

    will be replaced by

    printf("%d\n",x);

    ```'
