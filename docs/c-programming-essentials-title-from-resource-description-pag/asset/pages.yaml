    In addition, a structure declaration can also be nested within another structure
    declaration. Unnamed structures (structures without structure tags) are allowed
    in this case, but with the restriction that every structure nested in another
    structure must contain at least one object declaration along with its own declaration.
    We can rewrite the above example using nested declarations as:


    ```

    struct books{

