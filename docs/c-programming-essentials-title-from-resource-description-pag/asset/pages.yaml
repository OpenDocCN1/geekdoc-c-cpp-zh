  md: "# VARIABLE DECLARATION WITHIN LOOP\n\nVariables can now be declared within\
    \ a loop:\n\n```\nfor (int i=0; i<10; ++i)\n    printf(\"%d\",i);\n```\n\nThe\
    \ scope for the variable is the end of the loop. In the above example, the variable\
    \ i declared within the\n'loop' cannot be used after the loop ends.\n\n# VARIABLE-SIZED\
    \ ARRAYS\n\nC99 adds this interesting feature to C by which local arrays can have\
    \ variable length. Any integer (even those\ndetermined at runtime) can specify\
    \ the size of the array. For example, in the merge function of merge-sort,\nt\
    \ auxiliary array can be defined like:\n\n```\nvoid merge(int arr[], int lo, int\
    \ mid, int hi)\n{\n    int aux[hi-lo+1]; // variable sized array\n```\n\nIntroduction\
    \ of variable length arrays brings a change in the sizeof() operator. In C89,\
    \ sizeof() is a\ncompile operator, but for variable-length arrays it is determined\
    \ at runtime.\n\n# DECLARATION OF VARIABLE WITHIN CODE\n\nLike C++, C99 supports\
    \ declaration of variables within code segments, unlike declaring them at the\
    \ begin-\ning of the block in C89. So, we can write code of the form:\n\n```\n\
    void myfunc()\n{\n    int x=10;\n    printf(\"%d\",x);\n    int y=20;\n    printf(\"\
    and y=%d\",y);\n}\n```\n\nThis helps easier-to-understand programs as the variables\
    \ can be declared closer to their place of use.\n\n# COMPOUND LITERALS\n\nA compound\
    \ literal looks like a cast containing an initializing value of constants of almost\
    \ any type including\nstruct, union, and array. For example we can now write:\n\
    \n```\nstruct point { int a, b; };nstruct point p1 = (struct point) {0,2};\nstruct\
