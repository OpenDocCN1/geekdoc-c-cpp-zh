    # # 2.11 OPERATORS


    The C language is rich with built-in operators. An operator is a symbol that instructs
    the compiler to perform modifications – arithmetic, logical, or otherwise. C has
    three general classes of operators, viz. arithmetic, relational and bitwise. In
    addition, there are some special operators for particular tasks. Operators can
    be applied to variables and constants. In other words, variables and constants
    represent valid operands. All operands are not valid for all operators. There
    are three types of operators in C according to the number of operands operated
    by the operator. Accordingly, there are unary operators (operators requiring a
    single operand), binary operators (operators requiring two operands), and ternary
    operators (operators requiring three operands).


    An expression is a combination of operators and operands (data, variables, constants,
    or expressions) conveying a specific evaluation. Precedence of the operations
    is usually indicated by use of parenthesis (''('', '')''). In arithmetic, all
    the operators in C arithmetic or otherwise, have an implicit precedence relation
    between them. This guide shows the order of evaluation in the absence of parenthesis.


    It is important to note that the use of whitespace has no effect on the result
    of an expression. Another important thing to note is that although the use of
    parenthesis is not compulsory, use of parenthesis improves readability of the
    expression and prevents errors caused by different evaluation orders.


    Another term related to operators is its associativity. An associativity of an
    operator gives the order of evaluation of two or more occurrences of the operators
    in the absence of precedence order using parenthesis. Associativity is two types,
    right to left and left to right. For example, the addition operator ''+'' associates
    left to right, i.e.,


    ```

    a + b + c + d

    ```


    left-to-right associativity converts the expression to


    ```

    ((a + b) + c) + d

    ```


    where the ''+'' are evaluated from left to right. For-to-left associative operators,
    sequences are evaluated from right to left.


    We now move on presenting in detail the operators available in C. Apart from the
    natural precedence among the operators as we move along, we shall be presenting
    the precedence table for the entire set of C operators at the end of this section,
    after all the operators have been discussed.


