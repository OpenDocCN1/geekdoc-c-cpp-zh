    \ as fast as possible. In most of the cases, this means that the code of the function\
    \ will be expanded in place of the call, like a macro. But it is just a request\
    \ to the compiler, not a way to force inline expansion. C99, however, guarantees\
    \ that the function call will be as fast as possible.\\Typical usage of inline\
    \ is for small functions where function call overhead is significant. It will\
    \ also benefit those calls that happen inside nested loops. The syntax for inline\
    \ is:\n\n```\ninline void swap (int &a, int &b)\n{\n    int temp = *a;\n    *a\
    \ = *b;\n    *b = temp;\n}\n```\n\nrestrict\n\nThis is a new type qualifier for\
