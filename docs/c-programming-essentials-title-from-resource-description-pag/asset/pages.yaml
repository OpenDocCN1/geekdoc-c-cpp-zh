  md: "# EXECUTION\n\nX=12.\n\n# 3.2 THE switch STATEMENT\n\nThe C language provides\
    \ an easy-to-read control mechanism in the form of the switch construct. The switch\
    \ construct can be regarded as a special instance of the if-else-if ladder. The\
    \ general form of the switch statement is:\n\n```\nswitch(integer_expression1){\n\
    \    case constant_1:\n        <Actions_block_1>\n    case constant_2:\n     \
    \   <Actions_block_2>\n    ...\n    case constant_n:\n        <Actions_block_n>\n\
    }}\n```\n\nThe switch statement consists of the keyword switch, followed by an\
    \ expression in parentheses and a number of cases enclosed in braces. Here, a\
    \ case is a keyword, and each case corresponds to equality checkpoints within\
    \ the switch statement.\n\nTo execute a switch, the compiler first evaluates the\
    \ integer expression. Then, the value of the integer expression is compared with\
    \ constant_1, constant_2, ..., constant_n, where constant_j's are integers. The\
    \ value determines which statements are to be executed.\n\nAs an aside, the expression\
    \ might evaluate to a character; likewise, the constants the key words might be\
    \ character. This is so, because characters are converted to integers in C.\n\n\
    Continuing from where we left off, if the value of the expression equals constant_i,\
    \ execution begins with <Actions_block_i> and continues executing <Actions_block_i+1>\
    \ through <Actions_block_n>. If, however, the value does not equal any of the\
    \ constants, execution begins with immediately following the terminating brace\
    \ of the switch statement. The usage of surrounding braces is optional for the\
    \ actions blocks for switch statements even in the presence of multi-statement\
    \ blocks.\n\nThe switch construct can be considered as an if-else-if ladder with\
    \ only equality checks in the expressions, with the extra that once an equality\
    \ condition is satisfied, all conditions following it are not checked and the\
    \ blocks in executed.\n\nThere is another form of the switch statement using a\
    \ special clause, default, which corresponds to the else. Similar to the else,\
    \ the block following is executed if the value of the evaluated expression does\
    \ not equal any of the constants represented by the preceding default. The general\
    \ form of the switch construct using the default\n\n```\nswitch(integer_expression1){\n\
    \    case constant_1:\n        <Actions_block_1>\n    case constant_2:\n     \
    \   <Actions_block_2>\n    ...\n    case constant_n:\n```"
