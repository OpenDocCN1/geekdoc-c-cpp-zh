    # 4.6 RECURSION


    Since recursion is a technique that involves functions, this section has been
    presented in this chapter. However, the examples in this section require knowledge
    of arrays. If the reader is new to the language, this section may be skipped at
    the first reading, without loss of continuity. The reader can switch back to this
    section after reading on Arrays.


    Recursion occurs when a function invokes an instance of itself, either directly
    or indirectly. For starters, a recursive function takes a task. If the task is
    solved right away, the function solves and returns control to the calling function.
    Some programming tasks are naturally solved with the help of recursion, which
    can be considered an advanced form of flow control. Recursion is an alternative
    to iteration. In this chapter, recursion will be explained with some simple examples.
    The recursive version of the Towers of Hanoi problem will be discussed graphically.
    Recursion as an aid to string manipulation will be explained when we deal with
    arrays.


    In C, a function is allowed to call itself. A function is recursive if a statement
    in the body of a function calls itself. The use of recursion is convenient for
    problems that can be defined in recursively terms, such those problems may also
    be programmed using non-recursive approaches.


    A simple example is the, say fact() – to compute the factorial of an integer.
    By definition, the factorial of a number, $n$, is the product of all the whole
    numbers between 1 and n.


    For example, the factorial of 3 is calculated as 1*2*3. Both fact() in their recursive
    and iterative versions, are shown in the following programs.'
