    \ to arbitrary depths, contained only by system limitations.\n\nWhen a block is\
    \ entered, the system sets aside adequate memory for the automatically declared\
    \ variables local to the block. When the block exits, the system no longer reserves\
    \ the memory set aside the automatic variables. As a result, these values are\
    \ lost. If the block is re-entered, the storage is once again appropriately allocated,\
    \ but previous values remain unknown. Thus, invocation of a block sets up a new\
    \ environment.\n\nLet us look at the variable a. This variable is defined in the\
    \ functional body of main(). This variable is a local variable. Local variables\
    \ are those defined within a function or a block, as opposed to the global variables,\
    \ which are defined outside any function. All variables defined outside function\
    \ are global variables. When a variable is defined outside any function, storage\
    \ is permanently assigned to it and it becomes an external variable. A definition\
    \ for an external variable can look the same as that for a variable definition\
    \ inside a function or a block. Such a variable is considered global to all functions\
    \ defined after it and exists between different functions.\n\n# Program Ch02n17.c\n\
