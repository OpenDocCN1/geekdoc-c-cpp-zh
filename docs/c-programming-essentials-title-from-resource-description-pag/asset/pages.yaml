    The address of a variable in memory can be obtained by using the unary ''&'' operator
    and it is not to be confused with the bitwise ''&'' operator, which denotes a
    bitwise ANDing. In a similar way, the pointer to i, that is, the address of i,
    is obtained by writing &i, and the addresses of c and f are obtained similarly
    by using the ''&'' before the variable identifier. Now, the unary ''&'' operator
    when applied to a variable gives the address of the variable and a pointer value
    holds the address of variables, we should be able to assign this address to a
    pointer variable. Now, let us consider the following pointer definitions as already
    presented before:


    ```

    char *pc;

    int *pi;

    float *pf;

    ```


    To clarify the semantics of the definitions further, the first of these definitions
    means that pc is a pointer variable whose type is char. In other words, pc may
    have (contain) only the address of a character variable. Similarly, pi may be
    the address of an integer and pf may hold the address of a single-precision floating-point
    number. So, we can safely perform the following assignments:


    ```

    pc = &c;

    pi = &i;

    pf = &f;

    ```


