  md: '# 2.14 | TYPE CONVERSION IN ASSIGNMENTS


    For assignment statements, C converts the value at the right side of the assignment
    statement to the type of the variable on the left side (the LValue). Let us consider
    the following code segment:


    ```

    int a;

    char ch;

    float f;

    ...

    ch = a;

    a = f;

    f = ch;

    f = a;

    ```


    In the assignment ch = a, the lower order 8 bits of a are stored in ch. If the
    value of a was between 0 and 255, then ch and a would have identical. In the statement
    a = f, a receives the integer part of f. The third assignment converts the value
    of ch to its equivalent floating-point format. A similar case also occurs in the
    last statement, where the value in a is converted to its floating-point counterpart,
    as dictated by the LValue f of type float.


    # 2.15 | TYPE CASTING


    The type of expression can be converted explicitly by type casting. The general
    form of a type cast is


    (Data Type) Expression


    The syntax a = 8; is illustrated by the following example:


    ```

    int a = 8;

    float p = 5;

    ...

    p = (float)(a) / p;

    ```


    Explanation: Since a is converted to a float before the division operation, the
    division will be between two floats and the result will be returned as If the
    explicit cast was not performed, the result would have an int with value 1 and
    p would have been assigned the incorrect value 1.


    # 2.16 COMMENTS


    Comments are written in C to enhance the readability of the program. Comments
    may be written to indicate the platform on which the program is written on, the
    author of the program, the purpose of the program, the purpose of a statement,
    or any other documentation purposes.


    Comments can appear at any part of the program, even within statements. Commented
    portions are marked by a leading /* and a trailing */ called the comment delimiters.
    The compiler while generating the actual code for the source program ignores all
    text written within comment delimiters. Example comments might be:


    +   * this is a comment */

    /* Date Created: 05-10-2004 */

    /* Comments are necessary in code */'
