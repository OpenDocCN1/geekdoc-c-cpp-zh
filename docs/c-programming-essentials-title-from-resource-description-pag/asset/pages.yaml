    # 4.8 EFFICIENCY CONSIDERATIONS FOR USE OF FUNCTIONS


    Since function calls and returns involve operations on stacks, a call is slower
    than an equivalent inline code (a code where the function is not used as a separate
    entity; rather, the function statements are embedded in place of each call); there
    is a trade-off between using many functions and too little functions. Code length
    is sizable reduced when functions are used instead of inline code. This is true
    for involunt many lines of code which are called frequently in the program. However,
    it is advised to write a function for a task if the task is to be performed only
    once or twice in the program. If it is known that a future of the task may be
    in place for other functions, or for modifications of the same program, the task
    may be placed in the code as a call. A function is also efficient if it is invoked
    for only a few times in the program, if the task performed by the function is
    discrete or grouped into a separate module. Using adequate number of functions
    improves code readability. However, unnecessary usage of too many functions should
    be avoided, unless the process is unavoidable.


    The trade-off between the two techniques demands selection of the technique based
    on programming experience and expertise. As the reader becomes more comfortable
    with large programs, he will automatically adopt any of the techniques and when
    required. However, the reader is expected to analyse the coding of a solution
    well enough to identify the functions, required to perform the task.


    # ### SUMMARY


    C program is essentially made up a number of interacting functions, designed to
    carry out specific tasks. A function in C is very much like a mathematical function,
    since it accepts multiple arguments and returns a value (optional). C uses the
    technique of call-by-value for its arguments. The call-by-reference technique
    is absent in C, although it can be simulated using pointers, as we will see in
    the Chapter on pointers.


    Stacks are an essential feature in the function-calling mechanism. Activation
    stacks are used to store the return address and the return values of a function
    are stored on the stack and called activation records. Function calls can be performed
    to any depth, limited only by the maximum space available for the activation stack.'
