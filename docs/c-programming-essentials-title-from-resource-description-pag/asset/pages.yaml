  md: "A data declaration has three basic parts. They are:\n\n+   - data specifier\n\
    \n+   - structure tag\n\n+   - structure members\n\nThe keyword struct conveys\
    \ the type of data is a structure. In other words, it informs the compiler that\
    \ the declaration is of a structure. The identifier for the structure is placed\
    \ right after the struct keyword and it gives the name of the structure. The name\
    \ of the structure is also referred to as the structure tag. In the above example,\
    \ the structure tag is books. Lastly, the structure consists of five different\
    \ variables: character arrays (for storing book title, publisher name, and author\
    \ name), an integer variable (for storing the number of pages), and a float variable\
    \ (for the cost of book). Each of these variables is called a member variable.\
    \ Note that there may be one or more members in a structure.\n\nFurthermore, it\
    \ is important to note that the above declaration is the declaration for the structure\
    \ itself. That is, the declaration creates a new data type, which consists of\
    \ the fields as specified by the member variables. The declaration does not create\
    \ any variable that can be used in program. It simply creates a new data type\
    \ for use. This new data type can be accessed by the built-in data types we have\
    \ already discussed here by use of C-defined data types.\n\nSo far, we have declared\
    \ a structure named books. This structure creates a template (not to be confused\
    \ with C++ templates) that defines the contents of the structure, but not a variable.\
    \ A data type would, user-defined data type, since we have specified its name\
    \ and storage (the collective storage of its member variables). The operations\
    \ to be performed on books are a collection of the operations that can be performed\
    \ on its constituent data members as well as all other data-type related general\
    \ operations that can be performed on the structure once we create it.\n\nIt is\
    \ worthwhile to note that a structure declaration is not a definition; i.e., it\
    \ does not allocate storage. Storage is allocated in accordance with the structure\
    \ declaration we create structure variables or objects. We shall make use of the\
    \ structure tag at the time of defining a structure variable.\n\nThe general form\
    \ of a structure declaration is given below:\n\n```\nstruct structure_tag{\n \
    \ Member variable declarations;\n};\n```\n\nThe structure tag identifier can be\
    \ named using the conventions for naming identifiers as discussed in Chapter 2.\
    \ Another important point to note is that a structure declaration must contain\
    \ a terminating semicolon after the closing brace of the member variable declarations.\n\
    \n# 7.3 DEFINING A STRUCTURE VARIABLE\n\nFrom the discussion so far, it is obvious\
    \ that structure declarations are of without defining a structure object (variable).\
    \ We shall use the terms structure object and structure variable synonymously.\
    \ The general form of defining a structure is:\n\n```\nstruct structure_tag <variables\
    \ list>;\n```"
