  md: '# 140 | C PROGRAMMING ESSENTIALS


    The reason for the function to perform as it does is that the formal parameters
    a and b hold a (local) copy of the values of the actual parameters. We may use
    pointers to achieve this goal. Intuitively, since we have already discussed techniques
    to obtain and assign the address of a variable to another variable (pointer),
    and also techniques to alter the value of the original variable (whose address
    was assigned to the pointer) through the pointer using the * (indirection) operator,
    we may pass the addresses of variables from the caller to the invoked function
    as actual parameters. Since we are passing addresses of variables as actual parameters,
    the formal parameters must be declared as of pointer types, to enable the parameters
    to be assigned the addresses of the local variables in the caller. The invoked
    function may then use the * operator on the formal parameters and (change) the
    values of the local variables in the caller.


    For example, we may modify the interchange function listed earlier to interchange
    two integers, and for it to interchange the local integer variables in the caller
    as well. The function declaration is now:


    ```

    void interchange(int *, int *);

    ```


    The reference of the function where m and n are the two local variables to be
    interchanged, is to be performed as:


    ```

    interchange(&m, &n);

    ```


    The function definition may be written as:


    ```

    void interchange(int *pa, int *pb){

    int t;

    t = *pa;

    *pa = *pb;

    *pb = t;

    return;

    }

    ```


    It is to be noted at this point that the above function does not violate the C
    principle of ''call by value'' for function arguments. As in this, we are not
    able to alter the actual parameters in our regard; however, since the pointers
    containing address of local variables, it can well alter the content of the address
    to which the pointer points. So, with this technique of passing pointers as function
    arguments, we can introduce an effect of ''call by reference''.


    # 6.6 POINTERS AND ARRAYS—POINTER ARITHMETIC


    One of the striking features of C is its relationship with arrays. Pointers and
    arrays in C are very closely related to each other and can be used interchangeably.
    In fact, C evaluates an array reference to a pointer as expression. By definition,
    we know that an array is a collection of objects of identical type and they can
    be treated as a single unit or referenced similarly. We may also recall that an
    array name is a constant and the value of the array name is the address of the
    first element in the array. To illustrate this relationship further, the following
    variable definitions are considered:


    ```

    int *pm;

    int m[5];

    ```


    The above definitions imply that pm is a pointer variable that points to an array
    and m is an integer array having the following five constituent elements in the
    language of array element reference.


    ```

    m[0], m[1], m[2], m[3] and m[4]

    ```'
