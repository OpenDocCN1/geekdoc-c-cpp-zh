  md: '# 2.6 C CONSTANTS


    By definition, a *constant* is a quantity whose value does not change. As a programmer,
    we might find the need for a specific value at some point in a program. This may
    be the only place we need the value or we might need the value in places, but
    the value should never change. Depending on its value, a constant will be interpreted
    as a specific of type. For example, the letter ''A'' is a character constant,
    52 is an integer constant, and 87.24 is a floating-point constant. We shall now
    discuss the methods C provides for writing these different constants. With all
    program data, constants in C are stored in memory locations. C constants can be
    divided into two categories:


    +   - Primary Constants


    +   - Integer Constant: It is represented by one or more digits without the decimal
    point, and with a preceding +ve or -ve or no sign (where the constant is assumed
    to be positive). Examples: 123, -56, 0, 1984 are all integer constants.


    +   - Real Constant:


    +   - Fractional Form: It is represented by one or more digits with the decimal
    point, and with a preceding +ve or -ve or no sign (where the constant is assumed
    to be positive). Examples: 123.76,-56.05, 0.1,+19.84 are all real constants.


    +   - Exponential Form: Here, we represent the real constant in two parts – the
    exponent and the mantissa, separated by an ''e''. The mantissa is similar to the
    fractional form of representation as discussed above. The exponent is constructed
    as an integer constant. Examples: 123.76e-8,-0.5602e-5,0.1e+1 are all real constants.


    +   - Character Constant: It is a single alphanumeric or a special symbol enclosed
    within single quotes. These are also termed as literals. Examples: ''F'', ''a'',
    ''9'', and ''6'' are all character constants.


    +   - Secondary Constants: The representations for secondary constants lie beyond
    the scope of this chapter and will be presented later. The types of secondary
    constants are given only for reference. We, however, present representations of
    string constants.


    # 2.6.1 MORE ON PRIMARY CONSTANTS


    **Integer constants** Unless otherwise stated, an integer constant is an int.
    An integer constant too large to fit into an int is taken as long. An integer
    constant can also be explicitly stated as being long by appending an ''L'' or
    an ''l'' to the end of it. 7654321L is a long. To create an unsigned constant,
    we append a ''u'' or ''U'' to it. For example, we could write 123U and it would
    be an unsigned constant.


    C also allows to write numbers in number bases other than base 10 (decimal). In
    particular, it is sometimes convenient to write a number in base 8 (octal) or
    base 16 (hexadecimal). Such alternate bases can be more convenient because it
    is easier to convert a binary representation into one of these, rather than into
    base 10.'
