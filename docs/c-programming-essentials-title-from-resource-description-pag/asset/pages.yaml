  md: '# 12 | C PROGRAMMING ESSENTIALS


    Of course, the extent to which a particular program takes advantage of modularity
    and portability depends on how well the program is written (programmer''s skill).


    C is both a low- and a high-level language. It supports the low-level features
    (i.e., the bit-manipulation facilities of assembly) needed by the operating-system
    implementers and the compiler writers. It also supports the high-level features
    of control and data structures characteristic of a procedural language. C is as
    flexible as a low-level language. On the other hand, C provides the tools for
    a structured program, as a high-level language does. Thus, C is often called a
    middle-level programming language.


    # SUMMARY


    The hardware of a digital computer is operated by software instructions. Programs
    differ from software in that the programmer for his own usually writes programs
    whereas software is a commercial product.


    The development of software begins with a thorough analysis of the system requirements
    and the formulation of a sequence of steps (usually in the form of algorithms
    or flowchart) to tackle the problem. Given a number of available algorithms, an
    appropriate one is usually chosen by worst-case analysis.


    Systems may be designed either by a top-down understanding of the nature of the
    problem in its entirety or by a bottom-up approach of developing sub-problems
    and leaving the integrated solution to be developed at the last phase. Both approaches
    involve coding individual modules and use of certain structured programming constructs.


    Coding is performed in an appropriate assembly or high-level language and the
    code is documented properly. Testing and debugging is used to remove errors in
    the code. The final error-free software is installed at the client. Maintenance
    may be performed in future and is usually the responsibility of the developer.


    C is often the preferred tool for writing programs. Developed in the 1970s, as
    an aid to system programming, C combines features from both high- and low-level
    programming languages and is thus a middle-level language. C is widely accepted
    for its performance, portability, versatility, simplicity, and modularity.


