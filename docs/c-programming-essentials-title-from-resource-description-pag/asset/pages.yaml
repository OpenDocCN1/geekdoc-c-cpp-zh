    # 7.6 OPERATIONS ON STRUCTURES\n\nC supports only a few operations on structures.\
    \ One such operation is the ability to assign one structure variable to another,\
    \ provided they are of the same structure type. So, with two structure objects,\
    \ b1 and b2 of type books, and on the basis that the object b1 has already been\
    \ initialized, we may write:\n\n```\nb2=b1;\n```\n\nThe statement copies the book\
    \ information stored in the structure object b1 to the structure object b2. Besides,\
    \ we may pass a structure object to a function, and a structure object can also\
    \ be returned from a function. Passing structure objects as parameters shall not\
    \ be discussed until later in the chapter. We can also create pointers to structure\
    \ objects and operate on them similar to the operations on variables of builtin\
    \ data types. Arrays of structures can be created and accessed in the same manner\
    \ as variables of builtin data types. However, there is not much more than the\
    \ address we can do with structures. An example of the restriction on the usage\
    \ of structures is that we cannot compare structure variables for equality or\
    \ use any of the relational operators on structure variables, that we have discussed\
    \ in Chapter 2. Thus, the following code is erroneous and generates compilation\
    \ errors:\n\n```\nstruct test {\n int a;\n float b;\n}\np,q;\nint main(){\np.a=50;\n\
    p.b=22;\nq.a=50;\nq.b=22;\nif(p==q){\n printf(\"Equal.\\n\");\n}\n...\nreturn\
    \ 0;\n}\n...\n```\n\n# 7.7 POINTERS TO STRUCTURES\n\nA pointer to a structure\
    \ identifies (stores) the structure in memory. It may be used to access the address\
    \ and the contents of the structure object in the same manner as applicable for\
    \ pointers to variables of other data types. For example, the definition:\n\n\
    ```\nstruct books book1,*pb;\n```"
