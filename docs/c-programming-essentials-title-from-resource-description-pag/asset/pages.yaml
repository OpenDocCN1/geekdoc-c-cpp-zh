  md: 'Parentheses in parameterized macros play a great role in macro substitution.
    Consider the classic example of squaring a number by parameterized macro:


    ```

    #define square(n) (n)*(n)

    n---

    number=10;

    sqrnum=square(number);

    ```


    Because of this macro substitution, the preprocessor produces the following code
    to the compiler:


    ```

    number=10;

    sqrnum=(number) * (number);

    ```


    Hence, the value of square that will be produced is 100. But if we drop the parentheses
    in the macro definition, it will look like:


    ```

    #define square(n) n*n

    ```


    Now, if we write:


    ```

    number=10;

    sqrnum=square(number+1);

    ```


    the code that will be produced to the compiler is:


    ```

    number=10;

    sqrnum=number+1*number+1;

    ```


    This will yield the value of sqrnum as:


    ```

    10+1*10+1=21

    ```


    However, this is not the desired value. The parentheses in this macro definition
    are necessary and need to be careful while writing macros.


    Even when the parentheses are given properly, there may be side effects. It generally
    occurs when certain operations are performed with parameterized macros. If we
    write:


    ```

    sqrnum=square(number++));

    ```


    this will expand to:


    ```

    sqrnum=(number++) * (number++);

    ```


    If the value of sqrnum is 10 prior to invoking the macro, this will generate the
    value of sqrnum as:


    ```

    sqrnum=10*11

    =110

    ```


    though the expected value is 100.


    Properly parameterized macros save a lot of key presses while entering the source
    code and also improve the readability of the program.


    There is a #undef directive that may be used to ''undef'' a defined macro. For
    example:'
