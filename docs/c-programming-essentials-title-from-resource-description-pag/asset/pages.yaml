  md: '# 2 | C PROGRAMMING ESSENTIALS


    +   * Application software: It directs the performance of a particular use or
    application of computers to meet the information processing needs of computers.


    # 1.2 SYSTEMS SOFTWARE


    Systems software can be subdivided into system control programs, system support
    programs, and system development programs.


    +   * System control programs control the use of hardware, software, and data
    resources of the computer system during the execution of information processing
    tasks.


    +   * System support programs support the operations, management, and users of
    the computer system by providing a variety of support services. Service programs,
    performance monitors, and security monitors are some of the major support programs.


    +   * System development programs help users to develop information processing
    programs and procedures, and to prepare user programs for execution by the system.
    Major development programs include language translators, compilers, and application
    development systems.


    # 1.2.1 OPERATING SYSTEMS


    The most used software for any system is its operating system. An operating system
    is an integrated system of programs that supervises the operations of the Central
    Processing Unit (CPU) – controls the input/output (I/O) and storage functions
    of the computer system, and provides various support services. The programs of
    an operating system perform three important tasks like job, resource, and data
    management. Other programs that be part of the operating system or can be acquired
    as service programs may include language translators and other software.


    # 1.2.2 OTHER SYSTEM SOFTWARE


    Language translator convert programming language instructions into machine language
    instruction codes. Service programs are specialized programs that perform routine
    and repetitive functions, and are available to all the users of a computer system.
    A common service program is the linkage editor, which updates a program by defining
    the specific storage locations it links together the parts of the program, which
    may require other routines. Major categories of service programs are utility programs,
    which perform various housekeeping and file conversion functions.


    # 1.3 APPLICATION SOFTWARE


    Application software refers to programs that are written to solve day-to-day problems
    such as payroll management, inventories, billings, etc. An program is written
    by a programmer or a group of programmers (employed by a software development
    firm), and the latter charges a fee for rendering the service. Given a certain
    application requirement, package software provides an generic solution assuming
    it meets the needs of the client. The use of package software counterpoints with
    specialized software, which is developed for a particular client requirement.


    Application software includes a variety of programs that can be segregated into
    general purpose, business, scientific, and other application program categories.'
  merge: -1
