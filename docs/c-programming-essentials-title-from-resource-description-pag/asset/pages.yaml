    \n# 4.5 STACKS IN FUNCTION CALLS\n\nA stack is a data structure where items can\
    \ be inserted and deleted with certain constraints applicable to stacks are enumerated\
    \ here:\n\n+   - A stack is a LIFO ('last in, first out') where the last item\
    \ inserted (conventionally to the top of the stack) is the first item when removed.\n\
    - An insertion (or a push operation in stack nomenclature) inserts the item to\
    \ the top.\n- A deletion (or a pop operation in the stack nomenclature) removes\
    \ the item from the top.\n\nThus, a stack can be conceptualized as a pipe with\
    \ one end closed and another (the top end). Any push or pop has to be carried\
    \ out through the single end and hence, it acts as a LIFO data structure.\nAs\
    \ we know, the code for program is loaded in memory from storage before execution.\
    \ Each memory unit has addresses, the program is said to be loaded in memory at\
    \ a specific address. Thus, each compiled instruction is placed at a particular\
    \ address in memory. When a function is called, the CPU switches to the starting\
    \ address of the invoked function. As we have seen, control is switched back to\
    \ the caller when the invoked function returns. It is here that it would be very\
    \ difficult to keep track of the return address and the state of the local variables\
    \ in the caller, it had not for stacks.\n\nWhen a program is in execution, it\
    \ is a stack (also the activation stack) for the purpose of storing local variables\
    \ and keeping track of function calls by storing the address of the calling function,\
    \ along with some miscellaneous information like argument count, etc. Together,\
    \ they constitute the state of a function at an instant time. Such information\
    \ is also termed as an activation record. Each function call creates a new activation\
    \ record on the stack.\n\nWhen a program is in execution, the activation record\
    \ of the currently executing function is present on the top of the activation\
    \ stack. Thus, at any instant of, the record at the top of the stack contains\
    \ the return address (address of the next instruction to be executed) of the caller\
    \ of the present function and the current local variables for the function.\n\n\
    When a function call is encountered, the parameters for the function are evaluated.\
    \ A new activation record is created on the activation stack. The storage (memory)\
    \ for the formal parameters and local variables of the called function are allocated\
    \ on the newly created activation record, now on the top of the stack."
