    -3.4*10^-38 to -3.4*10^+38

    +3.4*10^-38 to +3.4*10^+38

    ```


    The double data type is for representing a double-precision floating-point number.
    The double values are stored in a fashion similar to floating-point values - a
    sign bit, a mantissa, and exponent. Due to use of double precision, the range
    and number of possible values are greater than in float since more bits are allocated
    for representing this type.


    A 64-bit double with 52 bits for mantissa, 11 bits for exponent, and 1 sign bit
    allows representation of values ranging from


    ```

    -1.7*10^-308 to -1.7*10^+308

    +1.7*10^-308 to +1.7*10^+308

    ```


    # 2.5.2 BASIC DATA TYPES WITH TYPE MODIFIERS


    The type modifiers that can be used with the basic data types


    +   * short: Used for representing an integer whose length is shorter than or
    equal to that of an int. The length of a short variable is at least 16 bits.

    * long: Used for representing an integer whose length is longer than or equal
    to that of an int. The length of a long variable is at least 32 bits.

    * signed: Signed numbers are positive, negative, or zero.

    * unsigned: Unsigned numbers are always positive or zero.


    # 2.5.3 RESTRICTIONS ON USE OF TYPE MODIFIERS


    Any of the type modifiers cannot be used with any of the basic data types. The
    restrictions in place are as follows:


    +   * short and long modifiers are used with int data types.

    Examples: short, int, long int

    * signed is the same as long, and short is the same as int. (Note that the representation
    in this case is compiler-dependent.)

    * signed and unsigned modifiers can be applied to either char or int (with or
    without short and long modifiers), signed modifier is assumed if qualifiers are
    omitted.

    Examples: signed int, signed char, unsigned int, unsigned char

    * long double specifies extended-precision floating point. The size of the variable
    is implementation-defined, but is guaranteed to be greater or at least equal precision
    to that of a double.'
