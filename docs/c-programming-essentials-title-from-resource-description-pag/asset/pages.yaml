    # >>> SUMMARY


    Control constructs are provided in C to facilitate writing of programs. Conditional
    constructs and repetition constructs are available. The conditional constructs
    include the if, if-else, nested if-else and switch statements. They perform the
    tasks of carrying out a particular set of operations (block) if a condition is
    satisfied at some point in the program.


    Repetition constructs provide facilities for conditional repetition of a block
    of code. The statements in the block are executed repeatedly as long as a condition
    is satisfied. The for and while are the types of repetition constructs available
    in C. There is an unstructured way to escape a loop by the break statement, or
    reset the loop execution to the start of the loop by ignoring all the statements
    that follow the continue statement. Usage of these techniques is not advised for
    writing well-structured programs that use a lot of break and continue statements
    in repetition can harm the beauty of the control mechanism. A similar philosophy
    applies to the goto construct. However, unlike the fact that the goto construct
    should be avoided altogether, it is not always possible to write elegant code
    without using the break or the continue statement. Absolute avoidance of these
    statements may lead to complicated loops – and the result may be more complex
    than with no break or continue statements.


