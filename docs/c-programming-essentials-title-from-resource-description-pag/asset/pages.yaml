  md: 'when this ordering is not possible for a set of functions, or the arrangement
    of the functions in the program somehow necessitate violation of the order of
    definitions. In such cases, the compiler to be informed about the existence of
    a called function before its invocation. Since the function definition occurs
    later in the program, the solution is to create a prototype of the called function
    before the invocation in the program. Although the function prototype declaration
    had been discussed earlier, we restart the syntax for convenience.

    The general syntax of a function prototype declaration in C is:


    ```

    ReturnType FunctionName(Argument Types List);

    ```


    Argument Types List is a list of the data types of the argument list as in function
    definition and the same order. If a function has no parameters, then the keyword
    void can be used within the parentheses or empty parameters can be used as an
    alternative. The other parameters retain the same meaning as in the function definition.
    Consider the following example that shows how function prototyping can be used.


    ![](img/a116934ba9dd16733cbd4eff6a88dec6_108_0.png)


    Consider the function prototype declaration in the above program:


    ```

    void message(int);

    ```


    It informs the compiler that the function when called is to be passed as a single
    argument of type int, and that the function does not return a value. A prototype
    declaration can be placed in the body of a function where other declarations are
    used, as in the above example, or it can be placed at the top of the program file
    as a global declaration.'
