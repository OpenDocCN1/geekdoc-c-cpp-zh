  md: "# Returning local array\n\nConsider the following code fragment, a function\
    \ to multiply two 3x3 matrices and return the result:\n\n```\nint *mat_multiply\
    \ (int mat1[3][3], int mat2[3][3])\n{\n    int prod[3][3];\n    int i, j, k;\n\
    \    for (i=0; i<3; ++i)\n        for (j=0, prod[i][j]=0; j<3; ++j)\n        \
    \    for (k=0; k<3; ++k)\n                prod[i][j] += mat1[i][k] * mat2[k][j];\n\
    \n    return prod;\n}\n```\n\nThe problem with this program is that it returns\
    \ a local array. The local array prod[3][3] is created in the stack when the function\
    \ mat_multiply is called. When the function ends, the lifetime of the local array\
    \ ends too. Thus, there is no that the location pointed to by prod will be valid\
    \ after subsequent function calls. The correct way is to use dynamic memory, which\
    \ would be created in heap and, thus, has a larger lifetime. So, the correct code\
    \ is:\n\n```\nint *mat_multiply (int mat1[3][3], int mat2[3][3])\n{\n    int *prod\
    \ = (int *) malloc(3*3*sizeof(int));\n    int i, j, k;\n    for (i=0; i<3; ++i)\n\
    \        for (j=0, *(prod+3*i+j)=0; j<3; ++j)\n            for (k=0; k<3; ++k)\n\
    \                *(prod+3*i+j) += mat1[i][k] * mat2[k][j];\n\n    return prod;\n\
    }\n```"
