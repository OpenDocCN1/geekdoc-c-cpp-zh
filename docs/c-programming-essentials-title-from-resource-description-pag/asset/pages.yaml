  md: '# # Appendix A

    # Common Errors in C


    # ### A.1 | TYPES OF ERRORS


    The errors in a program can be broadly classified as follows.


    # #### PROGRAMMING ERRORS


    These are generated when typographical errors are made by users.


    # #### COMPILE ERRORS


    These are errors detected by the compiler which make the program un-compliant.
    Every language has syntax rules. These rules determine which statements are legal
    in the language and which are not. Compiler programs are designed to enforce these
    rules. When a rule is broken, the compiler reports an error message and an object
    file is not created. Most compilers continue scanning the source file after an
    error and report other errors it finds. However, once an error has been found,
    the compiler may be confused by later perfectly legal statements and report them
    as errors.


    # #### LINK ERROR


    These are errors generated when the executable of the program cannot be generated.
    This may be due to wrong prototyping, incorrect header files, etc. The linker
    is a program that links object files (which contain the compiled machine code
    from a single source file) and libraries (which are files that are collections
    of object files) to create an executable program. The linker matches functions
    and global variables used in object files. The linker uses the name (often, the
    term symbol) of the function or global variable to perform the match. The most
    common type of linker error is an unresolved symbol or name. This error occurs
    when a function or global variable is used but the linker cannot find a match
    for the name.


    # #### EXECUTION ERROR


    These errors occur at the time of execution when the execution of a program cannot
    proceed. Loop-termination conditions and arithmetic errors are the general causes
    for such happenings.


    # #### LOGICAL ERRORS


    These errors solely depend on the logical thinking of the programmer. Such errors
    are easy to detect if we follow the line of execution and determine why the program
    takes that path of execution, provided the programmer uses structured programming.
    Otherwise, it may take long to detect such errors.'
  merge: -1
