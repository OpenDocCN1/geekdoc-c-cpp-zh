  md: '# 6

    CHAPTER

    Pointers


    The use of the pointers is one of the most powerful features in C. In this chapter,
    we present the basics of using pointers. The examples in this chapter will help
    in writing programs in C by efficient usage of pointers. It may simply be stated
    that a pointer is a variable that can point to another variable. So far, we have
    seen variables that hold a value of a specific type, viz. int, char, float. Pointer
    variables are special in the sense that their usage is somewhat different than
    the variables we have discussed so far.


    # 6.1 DEFINING A POINTER


    As the use of pointer variables is different from other variables, there must
    be a way to indicate that the defined variable is of a pointer type. A pointer
    variable p that points to an integer data is defined as follows:


    ```

    int *p;

    ```


    Note in the above pointer definition, there are the following three components:


    +   * The operator * is used to indicate that the defined variable will be used
    as a pointer. It is a unary operator when used in a variable or declaration. This
    is also called the indirection operator and is not the same as the binary multiplication
    * operator.


    +   * In the above example, the name of the pointer variable defined is p. Any
    valid identifier can be used as a pointer variable.


    +   * The pointer will point to a specific type of data. In our example, this
    type specifier is int. This means that the pointer variable p may hold the address
    of a variable that is of type int.


    # 6.2 SCALARS FOR POINTERS


    The scalar for a pointer variable does not refer to itself; instead, it refers
    to the element it points to. The scalar size for a pointer is defined by its type
    specifier. The sizeof operator may be used to determine the scalar size of a pointer.
    By this, we mean that for the pointer declarations:


    ```

    char *pc;

    int *pi;

    float *pf;

    ```'
