    ```\n\n# 4.2 FUNCTION ARGUMENTS\n\nFunction arguments have been used, so far,\
    \ with little explanation, because for the most part, function argument is intuitive.\
    \ The function definition contains an argument list. Items in the list are known\
    \ as *formal arguments*. The list may be empty, or contain any number of arguments.\
    \ The calling function specifies an argument list to be passed to the function.\
    \ The arguments in the calling routine are called *actual arguments*. In general,\
    \ the most high-level languages and C, require a one-to-one match between the\
    \ calling environment and the formal arguments lists. The identifiers used as\
    \ formal arguments are *local* in the sense that they are not recognized outside\
    \ the function. In other words, they are automatic variables.\n\nThere is a different\
    \ method of argument declarations, which is now obsolete. Latest standards of\
    \ C do not document this form. However, it is presented here only for reference\
    \ purposes. In this style, the argument declarations follow the first line and\
    \ one before the calling environment. The first line contains the return type\
    \ and name of the function, along with the formal variables enclosed in parentheses.\
    \ The next line contains the declarations of the formal parameters followed by\
    \ the body of the function within braces. The now obsolete syntax is presented\
    \ for reference to old code:\n\n```\nReturn_Type Function_Name(parameter list)\n\
    {\n  declarations of the formal parameters;\n  statements;\n}\n```\n\n# 4.3 THE\
    \ RETURN STATEMENT REVISITED\n\nWe can use C function in two ways: by doing something\
    \ with the value returned by the function, or by having the function perform something\
    \ ignoring the return value, if any. When a return statement in a function is\
    \ encountered, program control immediately passes back to the calling environment.\
    \ In addition, if an expression follows the *keyword return*, then the value of\
    \ the expression is returned to the calling environment as well. This value must\
    \ agree in type with the function header. In previous versions of C, the return\
    \ type in a function definition could have been excluded and the compiler assumed\
    \ the return type as int by default. C standard requires explicit mention of the\
    \ return type of a function.\n\nThe return statement is optional in a function\
    \ that does not return a value. If a function does not return no return statement,\
    \ the function returns to its invoker after the final statement in the function\
    \ body has been executed, and the closing brace encountered."
