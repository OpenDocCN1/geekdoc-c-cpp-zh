  md: "The resultant file \"mymath.o\" is the object file produced by gcc for our\
    \ program \"mymath.c\". Now, we use\nt archiver (ar) to produce the static library\
    \ named \"mymath.a\" from our \"mymath.o\" object file. The r, c, and\ns are options\
    \ of the archive utility.\n\n+   - r: adds the object file(*o) to the library\
    \ and replace the object file with same name, if any\n- c: suppresses the message\
    \ that is written to standard error, when a new archive is created\n- s: forces\
    \ the generation of the archive symbol table\n\n```\n$ ar rcs libmymath mymath.o\n\
    ```\n\nNote the name of the final library — it begins with \"lib\" and has an\
    \ extension \"a\". These conventions\nfollowed in Linux/Solaris/BSD/System V R4.\
    \ Now that we have created our simple library, let us put it to use.\nWe use the\
    \ following program with our library:\n\n```\n/* example.c */\n#include <stdio.h>\n\
    #include \"mymath.h\"\nint main()\n{\n    int a\n```\n\nWe compile this \"example.c\"\
    \ using the following commands:\n\n```\n$ gcc example.c -L. -lmmath\n```\n\nThe\
    \ L flag tells the compiler to add the following directory to the list of directories\
    \ to be searched for -L.\nThe -l flag instructs the linker to search a standard\
    \ list of directories for the library, which is actually a file named\nlib<library-name>.a\
    \ (libmymath.a here). The output is as expected:\n\n```\n$ ./a.out\nEnter integer\
    \ A : 20\nEnter integer B : 30\nA+B = 30\nA-B = 10\n```\n\nThe library thus obtained\
    \ by following the above steps can now be distributed along with the corre-\n\
    spending header file. This eliminates the need for distributing the actual source\
    \ code and also makes the compi-\nlation faster, as the library code is pre-compiled\
    \ and only has to be linked to the new program."
