    # 5.4 MULTI-DIMENSIONAL ARRAYS


    C language allows any type of arrays, including arrays of arrays. The number of
    indices used to find a particular element an array is called the dimension of
    the array. So far, we discussed only one-dimensional arrays with one index within
    subscripts. If we use two pairs of subscripts, we obtain a two-dimensional array.
    This idea can be iterated to arrays of higher dimensions. Arrays of more than
    one dimension are called multi-dimensional arrays. The general form of a multi-dimensional
    array definition is:


    ```

    data_type array_identifier[d_1][d_2][d_j]...[d_n]

    ```


    The table 5.7 lists some examples of multi-dimensional array definition.


    | Array Definition | Remark |

    | int b[3][5]; | A Two Dimensional Array |

    | int c[7][9]; | A Three Dimensional Array |

    | int d[3][3][5][4]; | A Four Dimensional Array |


    Fig. 5.7 Examples of Multi-dimensional Arrays


    A k-dimensional array has a size for each of its k dimensions. Let S represent
    the size of its ith dimension; then the definition of the array will allocate
    space for S₁ x S₂ x ... x Sₖ elements. From the above table (S.7), array has 3
    x 5 = 15 elements; array has 7 x 9 x 2 = 126 elements; array d has 3 x 3 x 5 x
    4 = 180 elements. Starting at the base address of the array, all array elements
    are stored contiguously in memory. Even though array elements are stored contiguously
    in memory, let us first visualize a two-dimensional array matrix with rows and
    columns. For example, if we define a two-dimensional array, mat as


    ```

    int mat[3][4];

    ```


    we can think of the array elements to be arranged as shown in Figure 5.8:


    | | 1 | 2 | 3 | 4 |

    | 1 | mat[0][0] | mat[0][1] | mat[0][2] | mat[0][3] |

    | 2 | mat[1][0] | mat[1][1] | mat[1][2] | mat[1][3] |

    | 3 | mat[2][0] | mat[2][1] | mat[2][2] | |


    Fig. 5.8 Matrix Representation of the 2D Array


