    and the subscript operator when we learn about arrays.


    # 2.13 TYPE CONVERSION IN EXPRESSIONS


    In C, variables in expressions with multiple data types undergo something called
    type promotion or upcasting. This signifies that a ''lower'' type are promoted
    (converted) to variables of the higher type appearing in the expression. In general,
    integral data types are ''lower'' than floating-point types. More specifically,
    char is lower than int, which is lower than float; float is lower than double,
    and so on.


    C can perform conversions between different types, but we should be careful about
    these conversions, since C permits operations have implicit conversions. However,
    it is important to note that casting is a temporary step used only to aid expression
    evaluation. The data type of the casted (or expression) remains unchanged after
    the cast. This section describes the way that the conversions occur.


    An arithmetic expression as x + y has both a value and a type. For example, if
    x and y are both of the same type, then x + y is also an int. However, if x and
    y are different types, then the type of the result is guided by the following
    rules that is maintained in order.


    +   1. When all operands are of the same type, the result is of the same type
    as any of the operands.

    2. If either operand is a long double, then the other is automatically upcasted
    to a long double and the type of the result is also long double.

    3. If either operand is a double, then the others are upcasted to a double and
    the result is also double.

    4. If either operand is a float, then the others are upcasted to a float and the
    result is also a float.

    5. When one operand is an unsigned long int, then the other operands are upcasted
    to an unsigned long int and that is the type of the result.

    6. If one of the operands is a long int, then the other operands are converted
    to long int and the result is of type long int.

    7. When one operand is an int, and the other is of short int char, then the short
    char is converted to an int and the result is of type int.


    In general, type conversions do not cause a lot of trouble, but there is one pitfalls
    we must watch out for. Mixing signed and unsigned quantities is fine until the
    signed number is negative.'
