  md: "# 8\n\n# CHAPTER\n\n# # File Access and Processing\n\nAny commercially available\
    \ programming language is able to communicate with disc data files. This communication\
    \ process depends on the operating system under which the language is used. UNIX\
    \ is the operating system under which C was developed originally. Nowadays, C\
    \ compilers are available under most of the major operating systems. In fact,\
    \ most of the I/O functions in C behaves in a consistent way across operating\
    \ systems, though all the operating systems do not provide all the facilities\
    \ available in UNIX. In this chapter, we will discuss how disc data files are\
    \ used in C.\n\n# ## 8.1 INTRODUCTION\n\nThere are two levels with reading and\
    \ writing data stored on disc can be accomplished. They are high-level disc I/O\
    \ and low-level disc I/O. High-level disc I/O is designed to work with the data\
    \ files and is convenient when small and manageable amounts of data are to be\
    \ processed. They are independent of operating systems. In fact, the functions\
    \ for high-level access are built up from low-level functions. On the contrary,\
    \ low-level disc I/O functions are operating system-dependent. They read data\
    \ from disc in blocks, convenient for the underlying operating system, and obviously\
    \ different for different operating systems.\n\n# ## 8.2 OPENING AND CLOSING A\
    \ DISC FILE\n\nIn order to use a disc data file, either for reading or writing,\
    \ we must first open the file. At the time of opening the file, and when the file\
    \ is open, the program and the underlying operating system shares certain information\
    \ regarding the file. This information is stored in a structure, which is declared\
    \ within the header file std supplied by the compiler. This declaration is somewhat\
    \ similar to the following:\n\n```\n#define OPEN_MAX 20    /*Max number of files\
    \ open at a time*/\ntypedef struct {\\    /*File descriptor*/\n    int *fd;\n\
    \    int *cnt;           /*Characters left in buffer*/\n    int mode;        \
    \   /*File access mode*/\n    char *next;         /*Pointer to next character*/\n\
    \    char *base;         /*Base address of file buffer*/\n} FILE;\nextern FILE\
    \ iob[open max];\n```"
