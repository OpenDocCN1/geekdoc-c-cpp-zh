  md: "# # CHAPTER\n# Introduction\n\nThis chapter deals with the principles involved\
    \ in programming — programs that are used to solve\nday-to-day problems and programs\
    \ that make the computer system more usable from both an\napplication programmer\
    \ and a user's point of view. An overview of programming will be given in\nview\
    \ of the class of problems. A brief history of C as an efficient programming language\
    \ is\nprovided at the end of the chapter.\n\n# ## 1.1 SOFTWARE\n\nA program is\
    \ generally made up of a sequence of instructions that clearly specify what a\
    \ computer is supposed to\ndo. So, in contrast, it is a set of programs that are\
    \ either supplied by the manufacturer of the hardware asso-\nci with or written\
    \ by an application developer, with purposeful intent of commercial or public\
    \ use. Thus,\nor a program to qualify as software, it should have the properties\
    \ of correctness, versatility, and maintainability\nin addition to well-documented\
    \ code.\n\nSoftware engineering is a methodical approach used in software development.\
    \ It is defined in IEEE Software\nEngineering Standards 1987 as Software Engineering\
    \ is the systematic approach to the development, operation, maine-\nnance and\
    \ retrieval of software.\n\nA program is rarely executed correctly on a computer\
    \ system unless considerable amount of time has been\nspent in the problem-solving\
    \ phase of development. Coding can start only after the problem-solving phase\
    \ is\ncomplete. The computer language (code) is then coded from the prepared plan.\
    \ The plan for solving a\ninvolves development of a series of instructions, referred\
    \ to as an algorithm. An algorithm enables us to solve\nproblem at hand in a systematic\
    \ way. The development of an algorithm for a program is justified by the fact\
    \ that\nit is necessary to select the correct logical steps to be followed so\
    \ that the problem can be solved in a quick and\nefficient manner.\n\nWe understand\
    \ the working of a program by drawing an analogy with a blender used to prepare\
    \ our\navavourite recipe. To prepare food, we follow different types of processes\
    \ — the first pertaining to the use of the\nblender and the second required for\
    \ the recipe. Here is the analogy to the program,\nthe ingredients are the input,\
    \ and the prepared food is the output of the program.\n\nWe require two different\
    \ types of software to enable a computer to process data, namely, systems software\n\
    \ application software. Returning to the analogy, application software can be\
    \ equated with the recipe, while\nsystems software acts as the blender. We take\
    \ a look into each type of software first.\n\nComputer software consists of two\
    \ major types of programs:\n\n+   * Systems software: It controls and supports\
    \ the operations of a computer system as it performs various infor-\nmation tasks."
