    # 1.11 HISTORY OF C LANGUAGE


    C has its origins in the early 1970s in Basic Combined Programming Language (BCPL),
    a project started by AT&T Bell Labs, USA, and developed by Martin Richards. B
    was derived from BCPL, written in 1970 by Ken Thompson for the first UNIX system
    on the DEC PDP-7. Dennis Ritchie is credited with defining and creating C from
    the language B. Many others also influenced the development of language. Most
    of the UNIX is closely to the UNIX operating system it was developed along with.
    The basic goal was to create a language for writing operating systems. C was a
    mechanism for providing portable assembly language. Hence, C was originally intended
    for systems programming. Today, C has been implemented on many different types
    of hardware and the language is used to tackle a large class of programming problems.


    Most commercial implementations of C differ from Kernigan and Ritchie (K&R) original
    definition. This created portability problems within different platforms. The
    American National Standards Institute (ANSI) established a committee in the summer
    of 1983 to resolve discrepancies from different versions of C that were commercially
    available. C was finally standardized in 1989, and was named ANSI C. A standard
    ANSI-compatible C compiler includes new features to aid in programming, in addition
    to all the features of a UNIX-based compiler.


    # 1.12 C LANGUAGE OVERVIEW


    C is a powerful and flexible general-purpose language that has gained the widest
    of acceptance over the years. Several features make C a very attractive programming
    language for coding solutions. These include:


    +   - Performance features such as speed and efficiency of the executable program.


    +   - Features relating to the portability of the programs. C is independent of
    any particular machine architecture - it is not bound to any hardware or system.
    Programs can be written to execute, change on a wide range of hardware.


    +   - C is a simple and straightforward language, providing only low-level operations
    and to deal directly with composite objects or other higher level mechanisms (these
    high-level mechanisms can be built using functions - the unit of a module).


    +   - Its versatility enables it to solve problems in every application area.


    +   - Modularity allows C to be ideal for large projects involving several programmers.
    It lets us break a large program into small manageable pieces, which can be reused
    in other programs.'
