  md: "# 2.19.4 | The putchar LIBRARY FUNCTION\n\nIt can be called the complement\
    \ of the getchar function. The putchar library function is defined in the standard\
    \ C header stdio.h and displays a character on the standard output device. The\
    \ general form of this function is:\n\n```\nputchar(Integer_Expression);\n```\n\
    \nThe integer expression passed to putchar() should be a character. The character\
    \ passed is displayed at the terminal. This function returns the character passed\
    \ as an integer on success. On error, putchar returns the special character EOF.\
    \ The following example program demonstrates the use of putchar() to write characters\
    \ to the terminal.\n\n```\nProgram Ch02n13.c\n/*Program to display characters\
    \ using the putchar function*/n#include <stdio.h>\n\nint main()\n{\n    int c1=97,c2=100;\n\
    \n    putchar(c1);\n    if (putchar(c2)==EOF)\n        printf(\"error\");\n  \
    \  return 0;\n}\nEnd Program\n```\n\nThe above program is self-explanatory.\n\
    The next program uses the putchar function to print all lowercase letters.\n\n\
    ```\nProgram Ch02n14.c\n/*Program to print all lowercase letters*/\n#include <stdio.h>\n\
    \nint main()\n{\n    int i,ch;\n\n    for(i=0;i<26;i++){\n        ch=i + 'a';\n\
