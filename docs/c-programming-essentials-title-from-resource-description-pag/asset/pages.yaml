    \ *str1* in main will be assigned an invalid address on returning from the IntToString\
    \ function. This is the dangling reference or the dangling pointer problem.\n\n\
    There are two ways out of this predicament. We can choose to define the string\
    \ as a global variable, eliminating the need for returning the string. However,\
    \ any technique involving globals is considered unwise and not recommended. The\
    \ only option left is to allocate the string *str* in IntToString in the memory\
    \ heap, where it will not be destroyed after the function returns.\n\nThe solution\
    \ involving this technique is illustrated in the next program. Unlike the previous\
    \ solution,\n\n```\nProgram Ch06n4.c\n/*A way out of the dangling reference problem.\
    \ Program works properly.*/\n\n#include <stdio.h>\n#include <string.h>\n#include\
    \ <alloc.h>\n\nchar *IntToString(int);\n\nint main()\n{\n    int a=2364;\n   \
    \ char *str1;\n\n    str1=IntToString(a);\n    printf(\"%s\\n\",str1);\n    free(str1);\n\
    \    return 0;\n}\n\nchar *IntToString(int val)\n{\n    char *str;\n    int i;\n\
    \n    str=(char*)malloc(6);\n    for(i=0;val!=0;i++,val/10)\n        str[i]=(val%10)+'0';\n\
    \n    if(i==0)\n        str[i++]='0';\n\n    str[i]='\\0';\n    strrev(str);\n\
    \    return str;\n}\nEnd Program\n```"
