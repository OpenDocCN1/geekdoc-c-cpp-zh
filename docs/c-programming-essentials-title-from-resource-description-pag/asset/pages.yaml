  md: '# Appendix E


    # C99—A Brief Introduction


    # E.1 | C99 OUTLINES


    Like all major softwares, programming languages are also updated from time to
    time. Since its creation in 1972, the C programming language has undergone several
    modifications. Most recent of these is the C99 standard published in the year
    1999 in a document titled “ISO/IEC 9899:1999”. This appendix deals with the major
    changes that have happened from C89 to C99. Here, we present some of these features
    with brief examples.


    # E.2 SOME FEATURES REMOVED IN C99


    +   - C99 drops the "implicit int" rule. In C89, absence of a type specifier resulted
    in the compiler assuming the default type to be int. This is especially true for
    return type of functions.

    - C99 also drops the "implicit function declaration" rule present in C89, by which
    an undeclared function could be used. A default declaration was assumed to be
    there.


    # E.3 NEW ADDITIONS IN C99


    KEYWORDS


    C99 reserves five new keywords:


    +   - _Bool

    - _Complex

    - _Imaginary

    - restrict

    - inline


    The first of them are new data types added to the languages to represent boolean,
    complex, and imaginary values, the names have been preceded by an underscore sign
    to distinguish them from many commercial libraries supporting types with similar
    names.


    FEATURES


    Many new features have been incorporated in C99, the most significant of these
    being:


    +   - Support for arithmetic of complex numbers

    - Data type "long long int" has been added to represent 64-bit signed integer'
