    \ with the help of functions. Functions enable people to create their own specific\
    \ task. A major advantage of C gives us is the ability to create function libraries\
    \ and then program using only those library functions to accomplish the tasks,\
    \ the program needs to perform. So far, we have been restricting ourselves to\
    \ a few functions, namely the main and some standard I/O functions. In this chapter,\
    \ we shall demonstrate how functions are designed, how two or more are put together,\
    \ and how they communicate with each other.\n\n# ### 4.1 INTRODUCTION\n\nC functions\
    \ are broadly classified into two major groups – namely, user-defined functions\
    \ and library functions. The main distinction between the two groups is that user-defined\
    \ functions are developed by the users for their specific purpose, whereas functions\
    \ are part of the C compiler. Library functions are predefined by the C compiler.\
    \ Some of the standard I/O library have already been discussed in the previous\
    \ chapters.\n\nIn this chapter, we shall be talking about functions and we will\
    \ learn how to define functions with parameters. As we proceed, we shall also\
    \ be demonstrating the methods of retrieving information from a function by returning\
    \ specific values.\n\nFunction calls are just like any other Statement, except\
    \ that the function is likely to accomplish the work of several Statements. Functions\
    \ can be used in conjunction with all C constructs. The C code that defines what\
    \ a function does is the function definition, and it has the general form as discussed\
    \ in Section 2.17. To continue from where we left off in Section 2.17, let us\
    \ analyse the program with regard to how functions are executed.\n\n```\nProgram\
    \ Ch04n1.c\n/*Program to analyze the working of functions*/\n#include <stdio.h>\n\
    \nvoid message()\n{\n    printf(\"Message for you:\");\n    printf(\"Have a nice\
