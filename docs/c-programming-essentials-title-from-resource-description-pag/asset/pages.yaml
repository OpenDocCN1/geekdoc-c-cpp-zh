  md: "# 178 | C PROGRAMMING ESSENTIALS\n\nTo terminate the linked list, we set the\
    \ null pointer (a simple pointer with value 0) to the link member of the last\
    \ node in the list (in our case, n3). The following preprocessor definition has\
    \ already been included in the header file stdio.h:\n\n```\n#define NULL 0\n```\n\
    \nwhich defines the constant NULL to be of value 0. Thus, to terminate our three-member\
    \ linked list, we may write the following where the symbolic constant NULL has\
    \ been typecast to be of type \"pointer to struct node\".\n\n```\nn3.link=(struct\
    \ node *) NULL;\n```\n\nThe reader is expected to read any standard book on data\
    \ structures to learn more about linked lists and their implementation.\n\n# 7.11\
    \ | UNIONS\n\nA union in C is a chunk of memory that can hold different types\
    \ of data items. The distinct advantage of using a union is that it allows us\
    \ to store different-sized data in the same memory space. When a union is defined,\
    \ it is allocated enough storage to hold the largest-sized data item in the list\
    \ of union members.\n\nEffectively, a union is a structure where all member variables\
    \ have an offset of zero from the base address of the union. The union is made\
    \ appropriate to the types in the union.\n\nThe syntax for defining and using\
    \ union_tag in C is similar to that for structures, and is shown below.\n\n```\n\
    union <union_tag{\n  Member variable declarations;\n}<union variables list>;\n\
    ```\n\nHere, the union tag and the union variables list are optional components\
    \ of the declaration.\nThe following statement declares an example union with\
    \ the union tag item.\n\n```\nunion item{\n  char cvalue;\n  int value;\n  float\
    \ fvalue;\n  double dvalue;\n};\n```\n\nThe above definition declares a union\
    \ named item and a variable, value, of the union data type. This variable holds\
    \ sufficient storage to hold the largest member in the union definition. That\
    \ is, the value is allocated storage equivalent to that of a double, among all\
    \ member variables, the double member dvalue requires maximum storage. If a union\
    \ declaration is made without defining the object variables, the declaration serves\
    \ as a reference to what lies in the context of the union, but no variables of\
    \ the type exist, i.e., no storage is allocated. Variable definitions, when made,\
    \ allocate storage for the union.\n\nThe union tag is optional in structures,\
    \ and it may be left out if the programmer does not want to create objects of\
    \ the union in future. If the tag is present, the union objects can be defined\
    \ later on:\n\n```\nunion union_tag <union variables list>;\n```"
