  md: '# # 5

    CHAPTER Arrays


    This chapter describes the representation of linear data structures by using one
    of the methods of sequential allocation of storage. Other methods of storage allocation
    will be discussed in the chapter on Pointers and Functions. Although the linear
    method of allocation is suitable for certain applications, there are many applications
    where this is found unacceptable. However, this method is widely used and helps
    in development of simpler programs. Initially, we focus on arrays in C, both single-dimensional
    and multi-dimensional, and then proceed to the different initialization techniques.
    Operations on matrices are introduced. Two types of sequential representations
    of multi-dimensional arrays are introduced. A string is not a separate data type
    in C. single-dimensional character arrays can be used as strings. Two-dimensional
    character arrays are discussed as arrays of strings. We then move on to some common
    string manipulation functions available within the standard C library.


    # ## 5.1 NEED FOR ARRAYS


    The need for arrays comes from representing large amounts of data in the program.
    It might often be required to store a number of items, say, for processing. The
    items may be all related in the fact that they all represent a particular theme.
    However, to declare n variables for storage of the n items is tedious and a non-elegant
    approach. As programmers, we represent such by arrays.


    In C, an array is an aggregate variable considering of a collection of the same
    type. The identifier is the name given to the entire; individual items are identified
    by their location in the array. The elements in an array are stored in consecutive
    memory locations. Arrays in C can be broadly classified into two groups— single
    or one-dimensional and multi-dimensional. We will discuss these in detail in the
    subsections.


    # ## 5.2 SINGLE-DIMENSIONAL ARRAYS


    To define an array containing variables of a particular type, it is required to
    specify the type (as in other definitions), give the array identifier (its name),
    and indicate the array''s size within subscripts. The general form of an array
    definition is:


    ```

    datatype array_identifier[size];

    ```


    The data_type in the above definition indicates the type of elements that can
    be contained in the array. Data_types can be any of the basic or user-defined
    data_types.'
