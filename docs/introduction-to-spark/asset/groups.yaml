    # 4.8.2 Preconditions and Postconditions


    We mostly express functional properties of subprograms with preconditions and
    postconditions. These are standard Boolean expressions, so they cannot directly
    refer to state abstractions. To work around this restriction, we can define functions
    to query the value of hidden variables. We then use these functions in place to
    query the state abstraction in the contract of other subprograms.

    For example, we can query the state of stack with functions Is_Empty and Is_Full
    and call them in the contracts of procedures Pop and Push:


