    \ I in A'Range loop\n    pragma Loop Invariant\n      (for all J in A'First ..\
    \ I - 1 => A (J) /= E);\n    if A (I) = E then\n      return I;\n    end;\n  end\
    \ loop;\n  pragma Assert (for all I in A'Range => A (I) /= E);\n  return 0;\n\
    end Find;\nend Show_Find;\n```\n\n第 1/2 阶段：生成全局合约 ...\n第 2/2 阶段：流分析与证明 ...\nshow_find.adb:73:\
