    # Introduction to SPARK\n\n```ada\nend Show_Search_Array;\n```\n\n# Listing 19:\
    \ show_search_array.adb\n\n```ada\npackage body Show_Search_Array is\n\nprocedure\
    \ Search_Array\n(A : Array_Of_Positives;\nE : Positive;\nResult : out Integer;\n\
    Found : out Boolean) is\nbegin\n  for I in A'Range loop\n    if A (I) = E then\n\
    \      Result := I;\n      Found := True;\n      return;\n    end if;\n  end loop;\n\
    \  Found := False;\nend Search_Array;\n\nend Show_Search_Array;\n```\n\n# Prover\
    \ output\n\nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: analysis\
