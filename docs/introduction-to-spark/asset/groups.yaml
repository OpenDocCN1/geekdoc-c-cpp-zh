  - "[PAGE 59]\n\n# 3.3.2 Additional Assertions and Contracts\n\nAs we've seen, a\
    \ key feature of SPARK is that it allows us to state properties to check using\
    \ assertions and contracts. SPARK supports preconditions and postconditions as\
    \ well as assertions introduced by the Assert pragma.\n\nThe SPARK language also\
    \ includes new contract types to assist formal verification. The new Assume is\
    \ treated as an assertion during execution but introduces an assumption when proving\
    \ programs. Its value is a Boolean expression that GNAT proves to be true without\
    \ any attempt to verify that it's. You will find this useful, but you must use\
    \ it with great care. Here's an example of using it.\n\nList 9: incr.incadb\n\n\
    ```\nprocedure Incr (X : in Integer) is\nbegin\n  pragma Assume (X < IntegerLast);\n\
    \  X := X + 1;\nend Incr;\n```\n\n# Prover output\n\nPhase 1 of 2: generation\
    \ of Global contracts ...nPhase 2 of 2: flow analysis and proof ...\nincr.adb:4:11:\
    \ info: overflow check proved\n\n> Note: For details on pragma Assume, see the\
    \ SPARK User's Guide.\n\nThe Contract aspect is another construct introduced for\
    \ GNATprove, but also acts as an assertion during execution. It allows you to\
    \ specify the behavior of a subprogram using disjunction of contracts. Each element\
    \ of a Contract Case is a guard, which is evaluated before the call and may only\
    \ reference the subprogram's inputs, and a consequence. At each call of the subprogram,\
    \ and only one guard is permitted to evaluate True. The consequence of that case\
    \ is a contract's to be satisfied when the subprogram returns.\n\nList 10: absolute.adb\n\
    \n```\nprocedure Absolute (X : in Integer) with\nPre => X IntegerFirst,\nContract\
    \ Cases => (X < 0) => X'Old,\n      X >= 0 => X = X'Old)\n\nis\nbegin\n  if X\
    \ < 0 then\n    X := -X;\n  end if;\nend Absolute;\n```\n\n# Prover output\n\n\
    Phase 1 of 2: generation of Global contracts ...nPhase 2 of 2: flow analysis and\
