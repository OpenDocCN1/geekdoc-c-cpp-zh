  - "[PAGE 103]\n\n# CHAPTER\nFIVE\n\n# # PROOF OF FUNCTIONAL CORRECTNESS\n\nThis\
    \ section is dedicated to the functional correctness of programs. It presents\
    \ advanced proof features that you may need to use for the specification and verification\
    \ of your program's complex properties.\n\n# ## 5.1 Beyond Program Integrity\n\
    \nWhen we speak about the correctness of a program or subprogram, we mean the\
    \ extent to which it complies with its specification. Functional correctness is\
    \ specifically concerned with properties that involve the relations between the\
    \ subprogram's inputs and outputs, as opposed to other properties such as running\
    \ time or memory consumption.\n\nFor functional correctness, we usually specify\
    \ stronger properties than those required to prove program integrity. When we're\
    \ involved in a certification processes, we should derive these properties from\
    \ the requirements of the system, but especially in non-certification contexts,\
