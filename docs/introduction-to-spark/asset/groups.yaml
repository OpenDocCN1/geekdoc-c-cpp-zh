    \ primarily on variables. It models how information flows through them during\
    \ a subprogram's execution, connecting the final values of variables to their\
    \ initial values. It analyzes global variables declared at library level, local\
    \ variables, and formal parameters of subprograms.\n\nNesting of subprograms creates\
    \ what we call scope variables: variables declared locally to an enclosing unit.\
    \ From the perspective of a nested subprogram, scope variables look very much\
    \ like global variables\n\nFlow analysis is usually fast, roughly as fast as compilation.\
    \ It detects various types of errors and violations of some SPARK legality rules,\
    \ such as the absence of aliasing and freedom of expressions from side-effects.\
    \ We discussed these rules in the SPARK Overview (page 3).\n\nFlow analysis is\
    \ sound: if it does not detect any errors of a type it's supposed to detect, we\
    \ know for there are no such errors.\n\n# 2.2 Errors Detected\n\n# 2.2.1 Uninitialized\
    \ Variables\n\nWe now present each class of errors detected by flow analysis.\
    \ The first is the reading of an uninitialized variable. This is always an error:\
    \ it introduces non-determinism and breaks the system because the value of an\
    \ uninitialized variable may be outside the range of its subtype. For reasons,\
    \ SPARK requires every variable to be initialized before being\n\nFlow analysis\
    \ is responsible for ensuring SPARK code fulfills all requirements. For example,\
    \ the function Max Array shown below, we've neglected to initialize the variable\
    \ of Max prior to entering the loop. As a consequence, the value read by the condition\
    \ of the if statement may be uninitialized. Flow analysis detects and reports\
