  - "[PAGE 16]\n\n# Introduction to SPARK\n\nchecks for SPARK conformance on the declaration\
    \ of those entities which are actually used within the SPARK code.\nHere's a common\
    \ case of using the SPARK Mode aspect:\n\n```\npackage P\nwith SPARK_Mode => On\n\
    is\n  -- package spec is IN SPARK, so can be used by SPARK clients\nend P;\npackage\
    \ body P\nwith SPARK_Mode => Off\nis\n  -- body is NOT IN SPARK, so is ignored\
    \ by GNATprove\nend P;\n```\n\nThe package P defines only those specifications\
    \ which are in the SPARK subset. However it wants to use all Ada features in its\
    \ body. Therefore the body should not be analyzed and has its SPARK Mode aspect\
    \ set to Off.\nYou can specify SPARK_Mode in a fine-grained manner on a per-unit\
    \ basis. An Ada package has four components: the visible and private parts of\
    \ its specification and the declarative and statement parts of its body. You can\
    \ specify SPARK_Mode as either On or Off on any of those parts. Likewise, a subparagraph\
    \ has two parts: its specification and its body.\n\nA general rule in SPARK is\
    \ that once Mode is set to Off, it can never be switched On again in the same\
    \ part of a package or subparagraph. This prevents switching SPARK_Mode to On\
    \ for subunits of a unit with SPARK_Mode Off and switching back to SPARK_Mode\
    \ On for a part of a given unit where it was set Off in a previous part.\n\n>\
    \ **Note:** For more details on the use of SPARK Mode, see the SPARK User's Guide.\n\
    \n# 1.8 Code Examples / Pitfalls\n\n# 1.8.1 Example #1\n\nHere's a package defining\
