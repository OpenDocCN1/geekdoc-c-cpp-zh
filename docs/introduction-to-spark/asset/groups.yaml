  - "[PAGE 77]\n\n# STATE ABSTRACTION\n\nAbstraction is a key concept in programming\
    \ that can drastically simplify both the implementation and maintenance of code.\
    \ It's particularly well suited to SPARK and its modular analysis. This section\
    \ explains what state abstraction is and how you use it in SPARK. We explain how\
    \ it impacts GNAT's analysis both in terms of information flow and proof of program\
    \ properties.\n\nState abstraction allows us to:\n\n+   • dependencies that wouldn't\
    \ be expressible because some data's read or written isn't visible at the point\
    \ where a subprogram is declared — examples are dependencies on data, for which\
    \ we use the Global contract, and on flow, for which we use the Depends contract.\n\
    • reduce the number of variables that need to be considered in flow analysis and\
    \ proof, reduction which may be critical in order to scale the analysis to programs\
    \ with thousands of variables.\n\n# 4.1 What's an Abstraction?\n\nAbstraction\
    \ is an important part of programming language design. It provides two views of\
    \ the same object: an abstract and a refined one. The abstract one — usually called\
    \ specification — describes what the object does in a coarse way. A subprogram's\
    \ specification usually describes how it should be called (e.g., parameter information\
    \ such as how many and what types) as well as what it does (e.g., returns a result\
    \ or modifies one or more of its parameters).\n\nContract-based programming, as\
    \ supported in Ada, allows contracts to be added to a subprogram's specification.\
    \ You use contracts to describe the subprogram's behavior in a more fine-grained\
    \ manner, but all the details of how the subprogram actually works are left to\
    \ its refined view, its implementation.\n\nTake a look at the example code shown.\n\
    \nListing 1: increase.ads\n\n```\nprocedure Increase (X : in out Integer) with\n\
    \  Global => null;\n  Pre => X < 100;\n  Post => X'Old < X;\n```\n\nListing 2:\
    \ increase.ads\n\n```\nprocedure Increase (X : in out Integer) is\n  begin\n \
    \   X := X + 1;\n  end Increase;\n```\n\nProver output"
  - "[PAGE 78]\n\n# Introduction to SPARK\n\nPhase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: flow analysis and proof ...\nincrease.adb:3:11: info: overflow\
    \ check proved\nincrease.adb:2:03: info: data dependencies proved\nincrease.adb:4:13:\
    \ info: postcondition proved\n\nWe've written a specification of the subprogram\
    \ Increase to say that it's called with a single argument, a variable of type\
    \ Integer whose initial value is less than 100. Our contract says that the only\
    \ effect of the subprogram is to increase the value of its argument.\n\n# 4.2\
    \ Why is Abstraction Useful?\n\nA good description of a subprogram's implementation\
    \ is one specification precisely and completely specifies what the callers can\
    \ rely on. In other words, a caller of subprogram shouldn't rely on any behavior\
    \ of its implementation if it isn't documented in its specification.\n\nFor example,\
    \ callers of the subprogram Increase can assume that it always increases the value\
    \ of its argument. In the code snippet below, this means the loop must terminate.\n\
    \nList 3: increase.ads\n\n```\nprocedure Increase (X : in out Integer) with\n\
    Global X := null;\nPre => X <= 100;\nPost => X = 'Old X < X;\n```\n\nList 4: client.adb\n\
    \n```\nwith Increase;\nprocedure Client is\nX : Integer := 0;\nbegin\n  while\
    \ X <= 100 loop\n    Increase(X); -- Increase can be called safely\n  end loop;\n\
    \  pragma Assert (X = 101); -- Will this hold?\nend Client;\n```\n\nOutput proof\n\
    \nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis\
    \ and proof ...\nclient.adb:8:19: medium: assertion might fail\ngnatprove: proved\
    \ check messages considered as errors\n\nCallers can also assume that the implementation\
    \ of Increase won't cause any errors when called. In the other hand, noting in\
    \ the specification that guarantees the assertion above is correct: it may fail\
    \ if Increase is changed.\n\nIf you follow this basic principle, abstraction can\
    \ bring significant benefits. It simplifies both maintenance and code reuse much\
    \ easier since changes to the implementation of an object shouldn't affect the\
    \ code using this object. Your goal is in it that it should be simple enough to\
    \ understand the specification of an object in order to use that object, since\
    \ understanding the specification is much simpler than understanding the implementation.\n\
    \nGNATprove relies on the abstraction defined by subprogram contracts and therefore\
    \ proves the assertion over the loop in Client."
  - "[PAGE 79]\n\n# 4.3 Abstraction of a Package's State\n\nSubprograms are not the\
    \ only objects that benefit from abstraction. The state of a package — itself\
    \ can also be hidden from external users. You achieve this of abstraction — called\
    \ abstraction — by defining variables in the body or part of a package so they\
    \ can only be accessed by subprogram calls. For example, our Stack shown below\
    \ provides an abstraction for a Stack object which can only be modified using\
    \ the Pop and Push procedures.\n\n```\npackage Stack is\n  procedure Pop (E :\
    \ out Element);\n  procedure Push (E : in Element);\n  end Stack;\n```\n\n```\n\
    package body Stack is\n  Content : Array (1 . Max);\n  Top     : Natural;\nend\
    \ Stack;\n```\n\nThe fact that we implemented it using an array is irrelevant\
    \ to the caller. We could change that without impacting our callers' code:\n\n\
    # 4.4 Declaring a State Abstraction\n\nHidden state influences a program's behavior.\
    \ SPARK allows that state to be declared. You can use the Abstract_State aspect,\
    \ an abstraction that names a state, to this, but you aren't required to use it\
    \ for a package with hidden state. You can use several state abstractions to declare\
    \ the hidden state of a single package or you can use it for a package with no\
    \ hidden state at. However, since SPARK doesn't allow aliasing, different state\
    \ abstractions must always refer to disjoint sets of variables. A state abstraction\
    \ is not a variable: it doesn't have a type and can't be used inside expressions,\
    \ either those in bodies or contracts.\n\nAs an example of the use of this aspect,\
    \ we can optionally define a state abstraction for the entire Stack package like\
    \ this:\n\n```\npackage Stack with\nAbstract_State => The_Stack\n...\n```\n\n\
    Alternatively, we can define a state abstraction for each hidden variable:\n\n\
    ```\npackage Stack with\nAbstract_State => (Top_State, Content_State)\n...\n```\n\
    \nRemember: a state abstraction is not a variable (It has no type) and can't be\
    \ used inside expressions. For example:\n\n```\npragma Assert (Stack.Top_State\
    \ = ...);\n  -- compilation error: Top_State is not a variable\n```"
- md: "\n# Introduction to SPARK\n\n## 4.5 Refining an Abstract State\n\nOnce you've\
    \ declared an abstract state in a package, you must refine it into its constituents\
    \ using a Refined_State aspect. You must place the Refined_State aspect on the\
    \ package body if the package would otherwise have required a body. For each state\
    \ abstraction you declared for the package, you list the set of variables represented\
    \ by that abstraction in its refined state.\n\nIf you specify an abstract state\
    \ for a package, it must be complete, meaning you must list every hidden variable\
    \ as part of state abstraction. For example, we must add a Refined_State aspect\
    \ on our Stack body linking the state abstraction (The_Stack) to the hidden state\
    \ of the package, which consists of Content and Top.\n\nListing 5: stack.ads\n\
    \n```\npackage Stack with\n  Abstract_State => The_Stack\n  type Element is new\
    \ Integer;\n  procedure Pop (E : out Element);\n  procedure Push (E : Element);\n\
    end Stack;\n```\n\nListing 6: stack.adb\n\n```\npackage body Stack with\n  Refined_State\
    \ => (Content, Top)\n  Max : constant := 100;\n  type Element_Array is array (1\
    \ .. Max) of Element;\n  Content : Element_Array := (others => 0);\n  Top : Natural\
    \ range 0 .. Max := 0;\n  Content and Top must be listed in the list of constituents\
    \ of The_Stack\n  procedure Pop (E : out Element) is\nbegin\n  E := Content (Top);\n\
    \  Top := Top - 1;\nend Pop;\n  procedure Push (E : Element) is\nbegin\n  Top\
    \ := Top + 1;\n  Content (Top) := E;\nend Push;\nend Stack;\n```\n\n# Prover output\n\
    \n```\nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: analysis\
    \ of data and information flow ...\nstack.adb:6:20: info: initialization of \"\
    E\" proved\n```\n\n74 Chapter 4. State Abstraction\n\n## 4.6 Representing Private\
    \ Variables\n\nYou can refine state abstractions in the package body, where all\
    \ the variables are visible. When only the package's specification is available,\
    \ you need a way to specify which state abstraction each variable belongs to.\
    \ You do this by adding the Part_Of aspect to the variable's declaration.\nPart_Of\
    \ annotations are mandatory: if you give a package an abstract state annotation,\
    \ you must link all the hidden variables defined in its part to a state abstraction.\
    \ For example:\n\nListing 7: stack.ads\n\n```\npackage Stack with\n  Abstract_State\
    \ => The_Stack\nis\n  type Element is Integer;\n  procedure Pop (E : out Element);\n\
    \  procedure Push (E : Element);\n  private\n    Max : constant = 100;\n    type\
    \ Element_Array is (1 .. Max) of Element;\n    Content : Element Array with Part_Of\
    \ = The_Stack;\n    Top : Natural range 0 .. Max with Part_Of = The_Stack;\nend\
    \ Stack;\n```\n\n# Private output\n\n> Phase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: analysis of data and information flow ...\n\nSince we chose\
    \ to define Content and Top in Stack's private part instead of its body, we had\
    \ to add a Part_Of aspect to both of their declarations, associating them with\
    \ the state abstraction The_Stack, even though it's the only state abstraction.\
    \ However, we still need to list them in the Refined_State aspect in Stack's body.\n\
    \n```\npackage body Stack with\n  Refined_State => (The_Stack => (Content, Top))\n\
    ```\n\n## 4.7 Additional State\n\n### 4.7.1 Nested Packages\n\nSo far, we only\
    \ discussed hidden variables. But variables aren't the only aspect of a package's\
    \ state. If a package P contains a nested state, the nested package's state is\
    \ also part of P's state. If the nested package is hidden, state is part of P's\
    \ hidden state and must be listed in P's state refinement.\n\nWe see this in the\
    \ example below, where the package Hidden_Nested's hidden state is part of P's\
    \ hidden state.\n\n## 4.6. Representing Private Variables\n\n# Introduction to\
    \ SPARK\n\nListing 8: p.ads\n\n```\npackage P with\n  Abstract_State => State\n\
    is\n  package Visible_Nested with\n    Abstract_State => Visible_State\n  is\n\
    \    procedure Get (E : out Integer);\n  end Visible_Nested;\nend P;\n```\n\n\
    Listing 9: p.db\n\n```\npackage body P with\n  Refined_State => (State => Hidden_Nested.Hidden\
    \ State)\nis\n  package Hidden_Nested with\n    Abstract_State => Hidden_State,\n\
    \    Initializes => Hidden_State\n  is\n    function Get return Integer;\n  end\
    \ Hidden_Nested;\npackage body Hidden_Nested with\n  Refined_State => (Hidden_State\
    \ => Cnt)\nis-Cnt : Integer := 0;\n  function Get return Integer is (Cnt);\nend\
    \ Hidden_Nested;\npackage body Visible_Nested with\n  Refined_State => (Visible_State\
    \ => Checked)\nis\n  Checked : Boolean := False;\n  procedure Get (E : out Integer)\
    \ is\n  begin\n    E := Hidden_Nested.Get;\n    end Get;\n  end Visible_Nested;\n\
    end P;\n```\n\nProver output\n\nPhase 1 of 2: generation of Global contracts ...\n\
    Phase 2 of 2: analysis of data and information flow ...\np.db:6:07: info: flow\
    \ dependencies proved\np.db:14:07: warning: \"Cnt\" is not modified, could be\
    \ declared constant [-gnatwk]\np.ads:7:22: info: initialization of \"E\" proved\n\
    \nAny visible state of Hidden Nested would also be part of P's hidden state. However,\
    \ if P contains a visible nested package, that nested package's state is not part\
    \ of P's hidden state. Instead, you should declare that package's hidden state\
    \ in a separate state abstraction on its own declaration, like we did above for\
    \ Hidden_Nested.\n\n76 Chapter 4. State Abstraction\n\n### 4.7.2 Constants that\
    \ Depend on Variables\n\nSome constants are also possible components of a state\
    \ abstraction. These are constants whose value depends on a variable or a subprogram\
    \ parameter. They're handled as variables during flow analysis because they participate\
    \ in the flow of information between variables throughout the program. Therefore,\
    \ GProv considers these constants to be part of a package's state just like it\
    \ does for variables.\n\nIf you specified a state abstraction for a package, you\
    \ must list such constants declared in that package. However, constants that don't\
    \ depend on variables do not appear in the state refinement. Let's look at this\
    \ example:\n\nListing 10: stack.ads\n\n```\npackage Stack with\n  Abstract_State\
