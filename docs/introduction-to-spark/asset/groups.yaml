    \ of Global contracts ...\nPhase 2 of 2: flow analysis and proof ...\nshow_proof_attempt.ads:7:21:\
    \ medium: contract case might fail\nshow_proof_attempt.ads:8:21: medium: contract\
    \ case might fail\nGNATprove: unproved check messages as errors\n\nRuntime output\n\
    raised ADA.ASSERTION_ERROR : failed contract case at show_failed_proof_attempt.ads:8:21\n\
    \nThe error message shows that the first contract is failing, which means that\
    \ Incremented is True. However, if we print the value of Incremented before returning,\
    \ we see that its False as expected for the input. The error here is that contracts\
    \ are evaluated before the call, so our specification is wrong! To correct this,\
    \ we should write X < 1000 as the guard of the first case or at least by adding\
    \ a precondition to the Increase subprogram.\n\n### 3.4.2 Debugging Cases where\
    \ more Information is Required\n\nEven if both the code and the assertions are\
    \ correct, GNATprove may still report that it can't verify the property. This\
    \ can happen for two reasons:\n- The property may be unprovable because the code\
    \ is missing some assertion. One category of these cases is due to modularity\
