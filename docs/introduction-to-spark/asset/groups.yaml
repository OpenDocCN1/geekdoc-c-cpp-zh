    ## 状态抽象 (STATE ABSTRACTION)\n\n抽象是编程中的一个核心概念，可以极大简化代码的实现和维护。它特别适用于 SPARK 及其模块化分析。本节介绍了什么是状态抽象以及如何在\
    \ SPARK 中使用它。我们解释了它如何从信息流和程序属性证明两个方面影响 GNAT 的分析。\n\n状态抽象允许我们：\n\n- 处理无法表达的依赖关系，因为某些数据的读取或写入在子程序声明处是不可可见的——例如对数据的依赖（我们使用\
    \ `Global` 合约）以及对流的依赖（我们使用 `Depends` 合约）。\n- 减少流分析和证明中需要考虑的变量数量，这种减少对于将分析扩展到具有数千个变量的程序可能是关重要的。\n\
    \n## 4.1 什么是抽象？\n\n抽象是编程语言设计的重要组成部分。它为同一个对象提供了两种视图：抽象视图和精细化视图。抽象视图——通常称为规格（specification）——以粗略的方式描述对象执行的功能。子程序的规格通常描述了它应该如何被调用（例如参数信息，如数量和类型）以及它做了什么（例如返回结果或修改其一个或多个参数）。\n\
    \nAda 支持的基于合约的编程（Contract-based programming）允许在子程序的规格中添加合约。你使用合约以更细粒度描述子程序的行为，但子程序实际如何工作的所有细节都留给了它的精细化视图，即实现。\n\
    \n看看所示示例代码。\n\n列表 1：increase.ads\n\n```\nprocedure Increase (X : in out Integer)\
    \ with\n  Global => null;\n  Pre => X < 100;\n  Post => X'Old < X;\n```\n\n列表\
    \ 2：increase.ads\n\n```\nprocedure Increase (X : in out Integer) is\n  begin\n\
    \    X := X + 1;\n  end;\n```\n\n### 证明器输出\n\n# 引入 SPARK\n\n- 阶段 1 / 2：生成全局合约\
    \ ...\n- 阶段 2 / 2：流分析与证明 ...\n- increase.adb:3:11: info: 合约检查已证明\n- increase.adb:2:4:\
    \ info: 合约检查已证明\n\n（注：此处由于原文似乎存在错乱，已按逻辑翻译，确保确保了文本内容）\n\n[content]\n- 抽象是编程中的一个核心概念，可以极大简化代码的实现和维护。它特别适用于\
    \ SPARK 及其模块化分析。本节介绍了什么是状态抽象以及如何在 SPARK 中使用它。我们解释了它如何从信息流和程序属性证明两个方面影响 GNAT 的分析。\n\
    \n- 状态抽象允许我们：\n\n- 处理无法表达的依赖关系，因为某些数据的读取或写入在子程序声明处是不可可见的——例如对数据的依赖（我们使用 `Global`\
