    \ 2 of 2: analysis of data and information flow ...\n\n# 2.4.4 Contract Computation\n\
    \nThe final cause of unexpected flow messages that we'll discuss also comes from\
    \ inaccuracy in computations of contracts. As we explained earlier, both Global\
    \ and contracts are optional, but GNATPro uses their data for some of its analysis.\n\
    If flow analysis can't detect contracts from things variables without knowing\
    \ the set of variables accessed. It needs to analyze and check the contracts you\
    \ wrote for a subgraph and those you wrote for callers of that subgraph. Since\
    \ each flow contract on a subgraph depends on the contracts of all the subgraphs\
    \ contained inside its body, the computation can be quite time-consuming. Therefore,\
    \ flow analysis sometimes trades-off the precision of this computation against\
    \ the time it would take.\nThis is the case for Depends contracts, where flow\
    \ analysis simply assumes the worst, that each subgraph's output depends on all\
    \ of that subgraph's inputs. Under this assumption, you have to do subcontracts\
    \ when default contracts are not precise enough. You may also want to supply Global\
    \ contracts to speed up flow analysis on larger projects.\n\n# 2.5 Code Examples\
    \ / Pitfalls\n\n# 2.5.1 Example #1\n\nThe procedure Search searches for an occurrence\
