    \npackage P\nwith SPARK_Mode => On\nis\n  subtype Letter is Character range 'a'\
    \ .. 'z';\n  type String_Access is new Ada.Finalization.Controlled with record\n\
    \    Ptr : Access String;\n  end record;\n  type Dictionary is array (Letter)\
