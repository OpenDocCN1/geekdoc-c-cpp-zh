- md: "\n# CHAPTER THREE\n\n# PROOF OF PROGRAM INTEGRITY\n\nThis section presents\
    \ the proof capability of GNATprove, a major tool for the SPARK language. We focus\
    \ here on the simpler proofs that you'll need to write to verify your program's\
    \ integrity. The primary objective of performing proof of your program's integrity\
    \ is to ensure the absence of runtime errors during its execution.\n\nThe analysis\
    \ steps discussed here are only sound if you've previously performed Flow Analysis\
    \ (page 21). You shouldn't proceed further if you have unjustified flow analysis\
    \ messages for your program.\n\n## 3.1 Runtime Errors\n\nThere's always the potential\
    \ for errors that aren't detected during compilation to occur during a program's\
    \ execution. These errors, called runtime errors, are those targeted by GNAT.\n\
    There are various kinds of runtime errors, the most common being references that\
    \ are out of the range of an array (buffer overflow¹²) in Ada), subtype range\
    \ violations, overflows in computations, and divisions by zero. The code below\
    \ illustrates many examples of possible runtime errors, all, within a single statement.\
    \ Look at the assignment setting the I + J'th cell of an array A to the value\
    \ P / Q.\n\nListing 1: show_runtime_errors.ads\n\n```\npackage Show_Runtime_Errors\
    \ is\n\ntype Nat_Array is array (Integer range <>) of Natural;\n\nprocedure Update\
    \ (A : in out Nat_Array; I, J, P, Q : Integer);\n\nShow_Runtime_Errors;\n```\n\
    \nListing 2: show_runtime_errors.adb\n\n```\npackage body Show_Runtime_Errors\
    \ is\n\nprocedure Update (A : in out Nat_Array; I, J, P, Q : Integer) is\nbegin\n\
    A (I + J) := P / Q;\nend Update;\n\nShow_Runtime_Errors;\n```\n\n# Prover output\n\
    \n¹² https://en.wikipedia.org/wiki/Buffer_overflow\n\n## Introduction to SPARK\n\
    \n```\nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis\
    \ and proof ...\nshow_runtime.errors.ads5:12: medium: overflow check might fail\
    \ [reason for check:\nresult of addition might fit in a 32-bits machine integer]\
    \ [possible fix:\nsubprogram at show_runtime.errors.ads5:12: should mention I\
    \ and J in a precondition]\nshow_runtime.errors.ads5:12: medium: array index check\
    \ might fail [reason for:\nresult of addition might be a valid index for the array]\
    \ [possible fix:\nsubprogram at show_runtime.errors.ads5:12: should mention P\
    \ and J in a precondition]\nshow_runtime.errors.ads5:22: medium: divide by zero\
    \ might fail [possible fix:\nsubprogram at show_runtime.errors.ads5:22: should\
    \ mention P and Q in a precondition]\nshow_runtime.errors.ads5:22: medium: overflow\
    \ check might fail [reason for check:\nresult of division must fit in the target\
    \ type of the assignment] [possible fix:\nsubprogram at show_runtime.errors.ads5:22:\
    \ should mention P and Q in a precondition]\ngnat: prove a number of errors check\
    \ messages considered as errors\n```\n\nThere are quite a number of errors that\
    \ may occur when executing this code. If we don't know anything the values of\
    \ I, J, P, and Q, we cannot rule out any of them.\n\nFirst, the computation of\
    \ I + J can overflow, for example if I is Integer'Last and J is positive.\n\n\
    ```\nA ('Last + 1) := P / 0;\n```\n\nNext, the sum which is used as an array index,\
    \ may not be in the range of the index of the array.\n\n```\nA ('Last + 1) :=\
    \ P / Q;\n```\n\nOn the other side of the assignment, the division may also overflow,\
    \ though only in the very special cases where P is Integer'First and Q is -1 because\
    \ of the asymmetric range of signed integer cases.\n\n```\nA (I + J) := Integer'First\
    \ / -1;\n```\n\nThe division is not allowed if Q is 0.\n\n```\nA (I + J) := P\
    \ / 0;\n```\n\nFinally, the array contains natural numbers, but it also throws\
    \ an error to store a negative value in it.\n\n```\nA (I + J) := 1 / (-1);\n```\n\
    \nThe compiler generates in the executable code corresponding to those of runtime\
    \ errors. Each raises an exception if it fails. For the above assignment, we can\
    \ see examples of exceptions raised due to failed check for each of the cases\
    \ above.\n\n```\nA ('Last + 1) := P / 0;\n-- raised CONSTRAINT ERROR : overflow\
    \ check failed\n```\n\n```\nA ('Last + 1) := P / Q;\n-- raised CONSTRAINT ERROR\
    \ : index check failed\n```\n\n```\nA (I + J) := Integer'First / (-1);\n-- raised\
    \ CONSTRAINT ERROR : overflow check failed\n```\n\n```\nA (I + J) := 1 / (-1);\n\
    -- raised CONSTRAINT ERROR : range check failed\n```\n\n```\nA (I + J) := P /\
    \ 0;\n-- raised CONSTRAINT ERROR : divide by zero\n```\n\n## Introduction to SPARK\n\
    \nruntime checks are costly, in terms of program size and execution time. It may\
    \ be appropriate to remove them if we statically ensure they aren't needed at\
    \ runtime, in other words if we can prove that the condition tested for can never\
    \ occur.\n\nThis is where the analysis by GNATprove comes in. It can be used to\
    \ demonstrate that none of these errors occur at runtime. Specifically, GNATprove\
    \ logically interprets the meaning of every entry in the program. Using this interpretation,\
    \ GNATprove generates a logical formula for each check that would otherwise be\
    \ required by the Ada (and SPARK) language.\n\n```\nA (Integer 'Last + 1) := P\
    \ / 0;\n-- overflow check might fail\n```\n\n```\nA (Last + 1) := P / 0;\n-- array\
    \ index check might fail\n```\n\n```\nA (I + 3) := Integer/First / (-1);\n-- overflow\
    \ check might fail\n```\n\n```\nA (I + 3) := 1 / (-1);\n-- range check might fail\n\
    ```\n\n```\nA (I + 3) := P / 0;\n-- divide by zero might fail\n```\n\nGNATprove\
    \ passes these verification to an automatic prover, stated as conditions that\
    \ must be true to avoid the error. If such condition can be validated by a prover\
    \ (meaning that it can be mathematically shown to be true), we've been able to\
    \ prove that no error can be raised at runtime when executing the program.\n\n\
    ## 3.2 Modularity\n\nTo scale to large programs, GNATprove performs on a per-subprogram\
    \ basis by relying on preconditions and postconditions to properly summarize the\
    \ input and output of each program. More precisely, when verifying the body of\
    \ a subprogram, GNATprove assumes nothing about the initial values of its parameters\
    \ and the global variables it accesses except what you state in the subprogram's\
    \ precondition. If you don't specify a precondition, it can't make any assumptions.\n\
    \nFor example, the following code shows that Increment can be successfully verified:\
    \ its precondition constraints the value of X to be Integer' Last so we know the\
    \ overflow check is always false.\n\nIn the same way, when a subprogram is called,\
    \ GNATprove assumes its out and in out parameters and the global variables it\
    \ writes can be compatible with their postconditions. For example, Increment GNATprove\
    \ doesn't know the value of X after the call is less than Integer' Last. Therefore,\
    \ it can't prove that the following addition can't overflow.\n\n> Listing 3: show_modularity.ad\n\
    \n```\n1 procedure Show Modularity\n2 procedure Increment (X : in out Integer)\
    \ with\n3 Pre <= X < Integer' Last is\n4 begin\n5 X := X + 1;\n6 -- info: overflow\
    \ check proved\n7 end Increment;\n8\n```\n\n## Introduction to SPARK\n\n(continued\
    \ from previous page)\n\n```\nX : Integer;\nbegin\n X := Integer'Last - 2;\n Increment(X);\n\
    \ After the call, GNATprove no longer knows the value of X\n X := X + 1;\n  medium:\
    \ overflow check might fail\nend Modularity;\n```\n\n# Prover output\n\nPhase\
    \ 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis and\
    \ proof ...\nshowmodularity.adb:16:14: info: overflow check proved\nshowmodularity.adb:18:04:\
    \ info: initialization of \"X\" proved\nshowmodularity.adb:13:04: precondition\
    \ proved\nshowmodularity.adb:16:04: warning: possibly useless assignment to \"\
    X\", value might not be referenced [-gnatm]\nshowmodularity.adb:16:11: medium:\
    \ overflow check fail [reason for check:\nresult of addition must fit in a 32-bits\
    \ machine integer] [possible fix: call at\nline 13 should mention X (for argument\
    \ X) in a postcondition]\ngnatprove: unproved check messages considered as errors\n\
    \n### 3.2.1 Exceptions\n\nThere are two cases GNATprove doesn't require modularity\
    \ and hence doesn't make the above assumptions. Local subprograms can be inlined\
    \ if they are simple enough and not require multiple values. If we remove the\
    \ comfort from Increment, it fits the criteria for inlining.\n\nListing 4: show_modularity.adb\n\
    \n```\nprocedure Increment (X : in Integer) is\nbegin\n X := X + 1;\n  info: overflow\
    \ check proved, in call inlined at...\nend Increment;\n\n X : Integer;\nbegin\n\
    \ X := Integer'Last - 2;\n Increment(X);\n X := X + 1;\n  info: overflow check\
    \ proved\nend Show Modularity;\n```\n"
  mdcn: "\n\n# 第三章\n\n# 程序完整性证明\n\n本节介绍了 GNATprove 的证明能力，它是 SPARK 语言的一项主要工具。我们在这里关注你为验证程序完整性而需要编写的简单证明。执行程序完整性证明的首要目标是确保程序在执行过程中不会出现运行时错误。\n\
    \n这里讨论的分析步骤只有在之前已经执行过数据流分析（第 21 页）的情况下才是可靠的。如果你的程序存在无法解释的数据流分析信息，你不应该继续进行。\n\n\
    ## 3.1 运行时错误\n\n在程序执行过程中，总可能发生编译期间未检测到的错误。这些错误被称为运行时错误，是 GNAT 关注的对象。\n运行时错误有多种，最常见的是超出数组范围的引用（Ada\
    \ 中的缓冲区溢出¹²）、子类型范围越界、计算溢出以及除以零。下面的代码说明了许多可能的运行时错误示例，所有这些示例都在同一个语句中。查看将数组 A 的第\
    \ `I + J` 个单元格设置为 `P / Q` 值的赋值语句。\n\nListing 1：show_runtime_errors.ads\n\n```\n\
    package Show_Runtime_Errors is\n\ntype Nat_Array is array (Integer range <>) of\
    \ Natural;\n\nprocedure Update (A : in out Nat_Array; I, J, P, Q : Integer);\n\
    \nShow_Runtime_Errors;\n```\n\nListing 2：show_runtime_errors.adb\n\n```\npackage\
    \ body Show_Runtime_Errors is\n\nprocedure Update (A : in out Nat_Array; I, J,\
    \ P, Q : Integer) is\nbegin\nA (I + J) := P / Q;\nend Update;\n\nShow_Runtime_Errors;\n\
    ```\n\n# Prover output\n\n¹² https://en.wikipedia.org/wiki/Buffer_overflow\n\n\
    ## SPARK 简介\n\n```\nPhase 1 of 2: generation of Global contracts ...\nPhase 2\
    \ of 2: flow analysis and proof ...\nshow_runtime.errors.ads5:12: medium: overflow\
    \ check might fail [reason for check:\nresult of addition might fit in a 32-bits\
    \ machine integer] [possible fix:\nsubprogram at show_runtime.errors.ads5:12:\
    \ should mention I and J in a precondition]\nshow_runtime.errors.ads5:12: medium:\
    \ array index check might fail [reason for:\nresult of addition might be a valid\
    \ index for the array] [possible fix:\nsubprogram at show_runtime.errors.ads5:12:\
    \ should mention P and J in a precondition]\nshow_runtime.errors.ads5:22: medium:\
    \ divide by zero might fail [possible fix:\nsubprogram at show_runtime.errors.ads5:22:\
    \ should mention P and Q in a precondition]\nshow_runtime.errors.ads5:22: medium:\
    \ overflow check might fail [reason for check:\nresult of division must fit in\
    \ the target type of the assignment] [possible fix:\nsubprogram at show_runtime.errors.ads5:22:\
    \ should mention P and Q in a precondition]\ngnat: prove a number of errors check\
    \ messages considered as errors\n```\n\n在执行这段代码时可能会发生许多错误。如果我们不知道 I、J、P 和 Q 的值，我们就无法排除其中的任何一个错误。\n\
    \n首先，`I + J` 的计算可能会溢出，例如如果 `I` 是 `Integer'Last` 且 `J` 是正数。\n\n```\nA ('Last +\
    \ 1) := P / 0;\n```\n\n接下来，作为数组索引使用的和，可能不在数组索引的范围内。\n\n```\nA ('Last + 1) := P\
    \ / Q;\n```\n\n在赋值的另一侧，除法也可能溢出，尽管仅限于非常特殊的情况，即 `P` 是 `Integer'First` 且 `Q` 为 -1，因为有符号整数的范围是非称的。\n\
    \n```\nA (I + J) := Integer'First / -1;\n```\n\n如果 `Q` 为 0，则不允许除法。\n\n```\nA (I\
    \ + J) := P / 0;\n```\n\n最后，数组包含自然数，但向其中存储负值也会抛出错误。\n\n```\nA (I + J) := 1 / (-1);\n\
    ```\n\n编译器生成的可执行代码与这些运行时错误相对应。如果检查失败，每个检查都会抛出一个异常。对于上述赋值，我们可以看到由于上述每种情况检查失败而抛出的异常示例。\n\
    \n```\nA ('Last + 1) := P / 0;\n-- raised CONSTRAINT ERROR : overflow check failed\n\
    ```\n\n```\nA ('Last + 1) := P / Q;\n-- raised CONSTRAINT ERROR : index check\
    \ failed\n```\n\n```\nA (I + J) := Integer'First / (-1);\n-- raised CONSTRAINT\
    \ ERROR : overflow check failed\n```\n\n```\nA (I + J) := 1 / (-1);\n-- raised\
    \ CONSTRAINT ERROR : range check failed\n```\n\n```\nA (I + J) := P / 0;\n-- raised\
    \ CONSTRAINT ERROR : divide by zero\n```\n\n## SPARK 简介\n\n运行时检查在程序大小和执行时间方面是昂贵的。如果我们能在静态上确保它们在运行时是不需要的，那么移除它们可能是恰当的，换句话说如果我们能证明所测试的条件永远不会发生。\n\
    \n这就是 GNATprove 分析派上用场的地方。它可以证明这些错误都不会在运行时发生。具体来说，GNATprove 在逻辑上解释了程序中每个条目的含义。使用这种解释，GNATprove\
    \ 生成了证明这些错误不会在运行时发生的逻辑公式。\n\n## 3.2 模块化\n\n为了扩展到大型程序，GNATprove 以每个子程序为基础进行分析，依赖前提条件（preconditions）和后条件（postconditions）来总结程序的输入和输出。更具体地说，在验证子程序体时，GNATprove\
    \ 对子程序访问的全局变量不做任何假设。如果你不指定前提条件，GNATprove 就无法对初始值做出任何假设。例如，当调用子程序时，GNATprove 知道\
    \ X 小于 `Integer'Last`。因此，我们可以证明以下加法不会溢出。\n\n```1 procedure Modularity\n2 procedure\
    \ Increment (X : in out Integer) with\n3 Pre <= X < Integer' Last is\n4 begin\n\
    5 X := X + 1;\n6 -- info: overflow check proved\n7 end Increment;\n```\n\n## SPARK\
    \ 简介\n\n（接上页）\n\n```\nX : Integer;\nbegin\n X := Integer'Last - 2;\n Increment(X);\n\
    \ -- 调用后，GNATprove 不再知道 X 的值\n X := X + 1;\n  medium: overflow check fail\nend\
    \ Modularity;\n```\n\n# Prover output\n\nPhase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: flow analysis and proof ...\nshowmodularity.adb:16:14: info:\
    \ overflow check proved\nshowmodularity.adb:18:04: info: initialization of \"\
    X\" proved\nshowmodularity.adb:13:04: precondition proved\nshowmodularity.adb:16:04:\
    \ warning: possibly useless assignment to \"X\", value might not be referenced\
    \ [-gnatm]\nshowmodularity.adb:16:11: medium: overflow check [reason for check:\n\
    result of addition must fit in a 32-bits machine integer] [possible fix: call\
    \ at\nline 13 should mention X (for argument X) in a postcondition]\ngnatprove:\
    \ unproved check messages considered as errors\n\n### 3.2.1 异常\n\n有两种情况下 GNATprove\
    \ 不需要模块化，因此不会做出上述假设。如果局部子程序足够简单且不需要多个值，则可以内联。如果我们去除了 Increment 的复杂性，它就符合内联的标准。\n\
    \nListing 4：show_modularity.adb\n\n```\nprocedure Increment (X : in Integer) is\n\
    begin\n X := X + 1;\n  -- info: overflow check proved, in call inlined at...\n\
    end Increment;\n\n X : Integer;\nbegin\n X := Integer'Last - 2;\n Increment(X);\n\
    \ X := X + 1;\n  -- info: overflow check proved\nend Show Modularity;\n```\n"
