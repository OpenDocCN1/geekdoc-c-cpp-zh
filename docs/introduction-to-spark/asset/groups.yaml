    There are quite a number of errors that may occur when executing this code. If
    we don''t know anything the values of I, J, P, and Q, we cannot rule out any of
    them.


    First, the computation of I + J can overflow, for example if I is Integer''Last
    and J is positive.


    ```

    A (''Last + 1) := P / 0;

    ```


    Next, the sum which is used as an array index, may not be in the range of the
    index of the array.


    ```

    A (''Last + 1) := P / Q;

    ```


    On the other side of the assignment, the division may also overflow, though only
    in the very special cases where P is Integer''First and Q is -1 because of the
    asymmetric range of signed integer cases.


    ```

    A (I + J) := Integer''First / -1;

    ```


    The division is not allowed if Q is 0.


    ```

    A (I + J) := P / 0;

    ```


    Finally, the array contains natural numbers, but it also throws an error to store
    a negative value in it.


    ```

    A (I + J) := 1 / (-1);

    ```


    The compiler generates in the executable code corresponding to those of runtime
    errors. Each raises an exception if it fails. For the above assignment, we can
    see examples of exceptions raised due to failed check for each of the cases above.


    ```

    A (''Last + 1) := P / 0;

    -- raised CONSTRAINT ERROR : overflow check failed

    ```


    ```

    A (''Last + 1) := P / Q;

    -- raised CONSTRAINT ERROR : index check failed

    ```


    ```

    A (I + J) := Integer''First / (-1);

    -- raised CONSTRAINT ERROR : overflow check failed

    ```


    ```

    A (I + J) := 1 / (-1);

    -- raised CONSTRAINT ERROR : range check failed

    ```


    ```

    A (I + J) := P / 0;

    -- raised CONSTRAINT ERROR : divide by zero

    ```'
