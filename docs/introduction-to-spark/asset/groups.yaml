    \ SPARK_Mode => On\nis\n  procedure Swap (X, Y : in out Positive) is\n  begin\n\
    \    Tmp : Constant := X;\n    X := Y;\n    Y := Tmp;\n  end Swap;\n\n  procedure\
    \ Swap_Indexes (A : in out P_Array; I, J : Natural) is\n  begin\n    Swap (A (I),\
    \ A (J));\n  end Swap_Indexes;\nend P;\n```\n\n## Prover output\n\nPhase 1 of\
    \ 2: generation of Global contracts\nPhase 2 of 2: analysis of data and information\
