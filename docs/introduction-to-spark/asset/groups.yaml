    \ with output \"Top\" is not allowed in SPARK\ngnatprove: error analysis of data\
    \ and information flow\n\nAs above, functions should be free from side-effects.\
    \ Here, Pop updates the global Top, which is not allowed.\n\n### 1.8.3 Example\
    \ #3\n\nWe now consider two procedures: Permute and Swap. Permute applies a circular\
    \ permutation to the value of X and Y.\n\nListing 12: p.ads\n\n```\npackage P\n\
    with SPARK_Mode => On\nis\n  procedure Permute (X, Y, Z : in out Positive);\n\
