    ship_transfer.adb:11:15: error was moved at line 9\nship_transfer.adb:12:06: error:\
    \ dereference from \"X\" is not writable\nship_transfer.adb:12:06: error was moved\
    \ at line 9\nship_transfer.adb:13:15: error: dereference from \"X\" is not readable\n\
    ship_transfer.adb:13:15: error was moved at line 9\ngnatprove: error during analysis\
    \ of data and information flow\n\n在 X 和 Y 赋值后，变量 X 无法用于读取或写入底层分配的内存。\n\n> **注意：**\
    \ 有关这些限制的更多细节，请参阅 SPARK 用户指南。\n\n## 1.7 指定 SPARK 代码\n\nSPARK 语言被限制为易于指定和验证的结构，有时你无法或不愿在整个代码库中遵守这些限制。因此，SPARK\
    \ 工具只检查你标识为 SPARK 的 SPARK 子集代码。\n\n你通过名为 `SPARK Mode` 的属性（aspect）来实现这一点。如果没有显式指定，则\
    \ SPARK Mode 为关闭，这意味着你可以在代码中使用完整的 Ada 功能，并且它不应被 Gnatprove 识别。你可以选择性地（在某些单元或子程序上）或全局性（使用配置\
    \ pr，这是我们在教程中所做的）更改此默认设置。为了简单地重用现有的 Ada 库，导入单元中声明的没有显式 SPARK Mode 的实体可以在 SPARK\
    \ 代码中使用。工具仅对 SPARK 代码中实际使用的实体声明进行 SPARK 合规性检查。\n\n这里是使用 `SPARK Mode` 属性的一个常见用：\n\
    \n```\npackage P\nwith SPARK_Mode => On\nis\n  -- 包规范属于 SPARK，因此可以被 SPARK 客户端使用\n\
    end P;\npackage body P\nwith SPARK_Mode => Off\nis\n  -- 体不属于 SPARK，因此被 GNATprove\
    \ 忽略\nend P;\n```\n\n包 P 只定义了属于 SPARK 子集的规范。然而，它希望在体中使用所有的 Ada 特性。因此，该体不应被分析，并且其\
    \ SPARK Mode 属性应设置为 Off。\n\n你可以按单元为单位细粒度地指定 `SPARK_Mode`。一个 Ada 包包含四个部分：规范的可见部分和私有部分，以及体的声明部分和语句部分。你可以在这些任何部分上将\
    \ `SPARK_Mode` 设置为 On 或 Off。同样，一个子程序（subparagraph）有两个部分：它的规范和它的体。\n\nSPARK 中的一条通用规则是：一旦\
    \ Mode 设置为 Off，在包或子程序的同一部分中永远无法切换回 On。这防止了在之前设置为 `SPARK_Mode Off` 的单元子中将 `SPARK_Mode`\
    \ 切回 On。\n\n> **注意：** 有关 `SPARK Mode` 使用的更多细节，请参阅 SPARK 用户指南。\n\n## 1.8 代码示例 /\
    \ 陷阱\n\n### 1.8.1 示例 1\n\n这是一个定义 Element 对象的抽象栈类型的包，它提供了栈的通常功能。该包被标记为属于 SPARK\
    \ 子集。\n\nListing 9: stack_package\n\n```\npackage Stack_Package\nwith SPARK_Mode\
    \ => On\nis\n  type Element is new Natural;\n  type Stack is private;\n  function\
    \ Empty return Stack;\n  procedure Push (S : in out Stack; E : Element);\n  function\
    \ Pop (S : in out Stack) return Element;\nprivate\n  type Stack is record\n  \
    \  Top : Integer;\nend record;\nend Stack_Package;\n```\n\n# 证明输出\n\nPhase 1 of\
    \ 2: generation of Global contracts ...\nPhase 2 of 2: analysis of data and information\
