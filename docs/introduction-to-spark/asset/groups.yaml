    \        Incremented := True;\n      else\n        Incremented := False;\n   \
    \   end if;\n    end Incr_Until;\nend Show_Failed_Proof_Attempt;\n```\nListing\
    \ 15: main.adb\n```ada\nwith Show_Failed_Proof_Attempt;\nprocedure Main is\n \
    \ Dummy : Integer;\nbegin\n  Dummy := 0;\n  Incr_Until (Dummy);\n  Dummy := 1000;\n\
