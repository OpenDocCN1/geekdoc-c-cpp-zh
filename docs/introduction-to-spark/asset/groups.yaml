    begin\n  X := new Integer'(1);\n  X.all := X.all + 1;\n  Y := X;\n  Y.all := Y.all\
    \ + 1;      illegal\n  X.all := X.all + 1;      illegal\n  X.all := 1;       \
    \       illegal\n  Dummy := X.all;         illegal\nend Ownership_Transfer;\n\
    ```\n\n# Proper output\n\nPhase 1 of 2: generation of Global contracts ...\nPhase\
    \ 2 of 2: analysis of data and information flow ...\nship_transfer.adb:11:06:\
    \ error: dereference from \"X\" is not writable\nship_transfer.adb:11:06: error\
    \ was moved at line 9\nship_transfer.adb:11:15: error: dereference from \"X\"\
    \ is not readable\nship_transfer.adb:11:15: error was moved at line 9\nship_transfer.adb:12:06:\
    \ error: dereference from \"X\" is not writable\nship_transfer.adb:12:06: error\
    \ was moved at line 9\nship_transfer.adb:13:15: error: dereference from \"X\"\
    \ is not readable\nship_transfer.adb:13:15: error was moved at line 9\ngnatprove:\
    \ error during analysis of data and information flow\n\nAfter the assignment of\
    \ X and Y, variable X cannot be used to read or write the underlying allocated\
    \ memory.\n\n> **Note:** For more details on these limitations, see the SPARK\
    \ User's Guide.\n\n## 1.7 Designating SPARK Code\n\nThe SPARK language is restricted\
    \ to only easily specify and verifiable constructs, there are times when you can't\
    \ or want to abide by these limitations over your entire code base. Therefore,\
    \ SPARK tools only check the SPARK subset of code which you should be identifying\
    \ as SPARK.\n\nYou do this using an aspect named SPARK Mode. If you don't explicitly\
    \ specify otherwise, SPARK Mode is Off, meaning you can use the complete set of\
    \ Ada features in code and that it should not be identified by Gnatprove. You\
    \ can change this default selectively (on some units or subprograms) or globally\
    \ (using a configuration pr, which is what we're doing in this tutorial). To simple\
    \ reuse of existing Ada libraries, entities declared in imported units with no\
    \ explicit SPARK Mode can still be used from SPARK code. The tool only checks\
    \ for SPARK conformance on the declaration of those entities which are actually\
    \ used within the SPARK code.\n\nHere's a common case of using the SPARK Mode\
    \ aspect:\n\n```\npackage P\nwith SPARK_Mode => On\nis\n  -- package spec is IN\
    \ SPARK, so can be used by SPARK clients\nend P;\npackage body P\nwith SPARK_Mode\
    \ => Off\nis\n  -- body is NOT IN SPARK, so is ignored by GNATprove\nend P;\n\
    ```\n\nThe package P defines only those specifications which are in the SPARK\
    \ subset. However it wants to use all Ada features in its body. Therefore the\
    \ body should not be analyzed and has its SPARK Mode aspect set to Off.\n\nYou\
    \ can specify SPARK_Mode in a fine-grained manner on a per-unit basis. An Ada\
    \ package has four components: the visible and private parts of its specification\
    \ and the declarative and statement parts of its body. You can specify SPARK_Mode\
    \ as either On or Off on any of those parts. Likewise, a subparagraph has two\
    \ parts: its specification and its body.\n\nA general rule in SPARK is that once\
    \ Mode is set to Off, it can never be switched On again in the same part of a\
    \ package or subparagraph. This prevents switching SPARK_Mode to On for subunits\
    \ of a unit with SPARK_Mode Off and switching back to SPARK_Mode On for a part\
    \ of a given unit where it was set Off in a previous part.\n\n> **Note:** For\
    \ more details on the use of SPARK Mode, see the SPARK User's Guide.\n\n## 1.8\
    \ Code Examples / Pitfalls\n\n### 1.8.1 Example #1\n\nHere's a package defining\
    \ an abstract stack type (defined as a private type in SPARK) of Element objects\
    \ along some subparagraphs providing the usual functionalities of stacks. It is\
    \ marked as being in the SPARK subset.\n\nListing 9: stack_package\n\n```\npackage\
    \ Stack_Package\nwith SPARK_Mode => On\nis\n  type Element is new Natural;\n \
    \ type Stack is private;\n  function Empty Push return Stack;\n  procedure Push\
    \ (S : in out Stack; E : Element);\n  function Pop (S : in out Stack) return Element;\n\
    private\n  type Stack is record\n    Top : Integer;\nend record;\nend Stack_Package;\n\
    ```\n\n# Prover output\n\nPhase 1 of 2: generation of Global contracts ...\nPhase\
    \ 2 of 2: analysis of data and information flow ...\nstack_package.ads:9:13: error:\
    \ \"in out\" parameter is not allowed in SPARK\nstack_package.ads:9:13: error:\
    \ violation of SPARK Mode at line 2\ngnatprove: error during analysis of data\
    \ and information flow\n\nSide-effects in expressions are not allowed in SPARK.\
    \ Therefore, Pop is not allowed to modify its parameter S.\n\n### 1.8.2 Example\
    \ #2\n\nLet's turn to an abstract state machine version of a stack, where the\
    \ unit provides a single instance of a stack. The content of the stack (global\
    \ variables Content and Pop) is not directly visible to clients. In stripped-down\
    \ version, only the function Pop is available to clients. The package spec and\
    \ body are marked as being in the SPARK.\n\n> Listing 10: global_stack\n\n```\n\
    package Global_Stack\nwith SPARK_Mode => On\ntype Element is new Integer;\nfunction\
    \ Pop return Element;\nend Global_Stack;\n```\n\n> Listing 11: global_stack.adb\n\
    \n```\npackage body Global_Stack\nwith SPARK_Mode => On\nMax : constant Natural\
    \ := 100;\ntype Element_Array is array (1 .. Max) of Element;\nContent : Element_Array;\n\
    Top : Natural;\nfunction Pop return Element is\nE : constant Element := Content(Top);\n\
    begin\nTop := Top - 1;\nreturn E;\nend Pop;\nend Global_Stack;\n```\n\n# Prover\
