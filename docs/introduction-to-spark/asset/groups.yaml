    # CHAPTER THREE


    # PROOF OF PROGRAM INTEGRITY


    This section presents the proof capability of GNATprove, a major tool for the
    SPARK language. We focus here on the simpler proofs that you''ll need to write
    to verify your program''s integrity. The primary objective of performing proof
    of your program''s integrity is to ensure the absence of runtime errors during
    its execution.


    The analysis steps discussed here are only sound if you''ve previously performed
    Flow Analysis (page 21). You shouldn''t proceed further if you have unjustified
    flow analysis messages for your program.


    # 3.1 Runtime Errors


    There''s always the potential for errors that aren''t detected during compilation
    to occur during a program''s execution. These errors, called runtime errors, are
    those targeted by GNAT.

    There are various kinds of runtime errors, the most common being references that
    are out of the range of an array (buffer overflow¹²) in Ada), subtype range violations,
    overflows in computations, and divisions by zero. The code below illustrates many
    examples of possible runtime errors, all, within a single statement. Look at the
    assignment setting the I + J''th cell of an array A to the value P / Q.


    Listing 1: show_runtime_errors.ads


    ```

    package Show_Runtime_Errors is


    type Nat_Array is array (Integer range <>) of Natural;


    procedure Update (A : in out Nat_Array; I, J, P, Q : Integer);


    Show_Runtime_Errors;

    ```


    Listing 2: show_runtime_errors.adb


    ```

    package body Show_Runtime_Errors is


    procedure Update (A : in out Nat_Array; I, J, P, Q : Integer) is

    begin

    nA (I + J) := P / Q;

    end Update;


    Show_Runtime_Errors;

    ```


    # Prover output


    ¹² https://en.wikipedia.org/wiki/Buffer_overflow'
