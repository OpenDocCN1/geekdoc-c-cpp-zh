    \n## 4.1 什么是抽象？\n\n抽象是编程语言设计的重要组成部分。它为同一个对象提供了两种视图：抽象视图和精细化视图。抽象视图——通常称为规格（specification）——以粗略的方式描述对象执行的功能。子程序的规格通常描述了它应该如何被调用（例如参数信息，如数量和类型）以及它做了什么（例如返回结果或修改其一个或多个参数）。\n\
