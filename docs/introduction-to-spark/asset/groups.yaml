- md: "\n# Introduction to SPARK\n\nLEARN. ADACORE.COM\n\n# Introduction to SPARK\n\
    \n*Release 2022-06*\n\n**Claire Dross and Yannick Moy**\n\nJun 24, 2022\n\n##\
    \ 1 SPARK Overview\n\n### 1.1 What is it?\nSPARK refers to two different things:\n\
    - a programming language targeted at functional specification and static verification,\n\
    - a set of development and verification tools.\n\nThe SPARK language is based\
    \ on a subset of Ada. Ada is particularly well suited for critical software since\
    \ it was designed for formal verification. Version 2012 of Ada introduced aspects.\n\
    \n### 1.2 What do the tools do?\nWe start by reviewing static verification of\
    \ programs, which is verification of the source code performed without compiling\
    \ or executing it. Verification uses tools that perform static analysis. These\
    \ tools can take various forms. They include tools that check types and enforce\
    \ visibility rules, such as the compiler, in addition to those that perform more\
    \ complex reasoning, such as abstract interpretation, as done by a tool like CodePeer.\
    \ Tools that come with SPARK perform different forms of static analysis:\n\n-\
    \ flow analysis is the fastest form of analysis. It checks initializations of\
    \ variables and looks at data dependencies between inputs and outputs of programs.\
    \ It can also find unused assignments and uninitialized variables.\n- proof checks\
    \ for the absence of runtime errors as well as the conformance of the program\
    \ with its specifications.\n\n### 1.3 Key Tools\nThe tool for formal verification\
    \ of the SPARK language is GNATprove. It checks for conformance with the SPARK\
    \ subset and performs flow analysis and proof of the source code. Several other\
    \ tools use the SPARK language, including both the GNAT compiler and the GNAT\
    \ Studio integrated development environment.\n\n### 1.4 A trivial example\nWe\
    \ start with a simple example of a subprogram in Ada that uses SPARK aspects to\
    \ specify subprogram contracts. The subprogram, called Increment, adds 1 to the\
    \ value of its parameter X:\n\n```ada\nprocedure Increment\nX : in out Integer\n\
    with\n  Global\n    Depends => (X => X),\n    Pre      => X = Integer,\n    Post\
    \     => X = X'Old + 1;\n```\n\n```ada\nprocedure Increment\nX : in out Integer\n\
    begin\n  X := X + 1;\nend Increment;\n```\n"
  mdcn: "\n\n# SPARK 简介\n\nLEARN.ADACORE.COM\n\n# SPARK 简介\n\n*版本 2022-06*\n\n**Claire\
    \ Dross 和 Yannick Moy**\n\n2022年6月24日\n\n## 1 SPARK 概述\n\n### 1.1 什么是 SPARK？\n\
    SPARK 指两个含义：\n- 一种面向功能规范和静态验证的编程语言，\n- 一套开发和验证工具。\n\nSPARK 语言基于 Ada 的一个子集。Ada\
    \ 特别适用于关键软件，因为它是为了形式化验证而设计的。Ada 2012 版本引入了方面属性（aspects）。\n\n### 1.2 这些工具是做什么的？\n\
    我们首先回顾程序的静态验证，即在不编译或执行代码的情况下对源代码进行的验证。验证使用执行静态分析的工具。这些工具可以有多种形式。它们包括检查类型和强制执行可见性规则的工具（如编译器），以及执行更复杂推理的工具（例如像\
    \ CodePeer 等工具所使用的抽象解释）。SPARK 附带的工具执行不同形式的静态分析：\n\n- 流分析（flow analysis）是最快的分析形式。它检查变量的初始化，并查看程序输入输出之间的数据依赖。它还能发现未使用的赋值和未初始变量。\n\
    - 证明检查（proof checks）用于确保没有运行时错误，以及程序是否符合其规范。\n\n### 1.3 关键工具\n用于 SPARK 语言形式化验证的工具是\
    \ GNATprove。它检查是否符合 SPARK 子集，并对源代码进行流分析和证明。其他工具也使用 SPARK 语言，包括 GNAT 编译器和 GNAT\
    \ Studio 集成开发环境。\n\n### 1.4 一个简单的示例\n我们从一个简单的 Ada 子程序开始，该程序使用 SPARK 方面属性来指定子程序合约。该子程序名为\
    \ Increment，功能将其参数 X 的值加 1：\n\n```ada\nprocedure Increment\nX : in out Integer\n\
    with\n  Global\n    Depends => (X => X),\n    Pre      => X = Integer,\n    Post\
    \     => X = X'Old + 1;\n```\n\n```ada\nprocedure Increment\nX : in out Integer\n\
    begin\n  X := X + 1;\nend Increment;\n```\n\n"
