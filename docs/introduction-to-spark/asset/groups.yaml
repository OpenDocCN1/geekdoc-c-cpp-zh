    ## 5.3.3 Handling of Loops\n\nWhen the program involves a loop, you're always\
    \ required to provide additional annotations to allow GNATprove to complete proof\
    \ because verification techniques used by GNATprove do not handle cycles in subprogram's\
    \ control flow. Instead, loops are flattened by dividing them into several acyclic\
    \ parts. As an example, let's look at a simple loop with an exit condition.\n\n\
    ```ada\nStmt1;\nloop\n  Stmt2;\n  exit when Cond;\n  Stmt3;\nend loop;\nStmt4;\n\
    ```\n\nAs shown below, the control flow is divided into three parts. The first,\
    \ in yellow, starts earlier in subprogram and enters the loop statement. The loop\
    \ itself is divided into two parts. Red represents a complete execution of the\
    \ loop's body: an execution where the exit condition is not satisfied. Blue represents\
    \ the last execution of the loop, which includes subprogram following it. For\
    \ that path, the exit condition is assumed to hold. The red and blue parts are\
    \ executed after the yellow one.\n\nGNATprove analyzes these parts independently\
    \ since it doesn't have a way to track how variables have been updated by an iteration\
    \ of the loop. It forgets about those variables from one part when entering another.\
    \ However, values of constants and variables that aren't modified in the loop\
    \ are not an issue.\n\nIn other words, handling loops in ways makes GNATprove\
    \ imprecise when verifying a subprogram involving a loop: it can't verify a property\
    \ that relies on values modified inside the loop. It won't get any information\
    \ about the value of constants or unmodified variables, but is nevertheless not\
    \ able to deduce new information about them from the loop. For example, consider\
    \ the function Find which returns the array A and searches for an element E stored\
    \ in A.\n\nListing 24: show_find.ads\n\n```ada\npackage Show_Find is\n  type Nat_Array\
    \ is array (Positive range <>) of Natural;\n  function Find (A : Nat_Array; E\
    \ : Natural) return Natural;\n  end Show_Find;\n```\n\nListing 25: show_find.adb\n\
    \n```ada\npackage Show_Find is\n  function Find (A : Nat_Array; E : Natural) return\
    \ Natural is\n  begin\n    for I in A'Range loop\n      pragma (all J in A'First\
    \ .. I - 1 => A (J) /= E);\n      assertion is not proved\n      if (I) = E then\n\
    \        return I;\n      end if;\n      pragma Assert (A (I) /= E);\n      assertion\
    \ is proved\n    end loop;\n    return 0;\n  end Find;\nend Show_Find;\n```\n\n\
