    # SPARK OVERVIEW


    This tutorial is an introduction to the SPARK programming language and its formal
    verification tools. You need not know any specific programming language (although
    going over the Introduction to Ada course first may help) or have experience in
    formal verification.


    # 1.1 What is it?


    SPARK refers to two different things:


    +   - a programming language targeted at functional specification and static verification,
    and

    - a set of development and verification tools for that language.


    The SPARK language is based on a subset of the Ada language. Ada is particularly
    well suited to formal verification since it was designed for critical software
    development. SPARK builds on that foundation.


    ![](img/f1e490d8090325782c7af40c77e8a99e_9_0.png)


    Version 2012 of Ada introduced the use of aspects, which can be used for subprogram
    contracts, and version 2014 of SPARK added its own aspects to further Ada static
    analysis.'
  - "[PAGE 10]\n\n# Introduction to SPARK\n\n# 1.2 What do the tools do?\n\nWe start\
    \ by reviewing static verification of programs, which is verification of the source\
    \ code performed without compiling or executing it. Verification uses tools that\
    \ perform static analysis. These tools can take various forms. They include tools\
    \ that check types and enforce visibility rules, such as the compiler, in addition\
    \ to those that perform more complex reasoning, such as abstract interpretation,\
    \ as done by a tool like CodePeer from AdaCore. Tools that come with SPARK perform\
    \ different forms of static analysis:\n\n+   - flow analysis is the fastest form\
    \ of analysis. It checks initializations of variables and looks at data dependencies\
    \ between inputs and outputs of programs. It can also find unused assignments\
    \ and uninitialized variables.\n\n+   - proof checks for the absence of runtime\
    \ errors as well as the conformance of the program with its specifications.\n\n\
    # 1.3 Key Tools\n\nThe tool for formal verification of the SPARK language is called\
    \ GNATprove. It checks for conformance with the SPARK subset and performs flow\
    \ analysis and proof of the source code. Several other tools use the SPARK language,\
    \ including both the GNAT compiler³ and the GNAT Studio integrated development\
    \ environment.\n\n# 1.4 A trivial example\n\nWe start with a simple example of\
    \ a subprogram in Ada that uses SPARK aspects to specify subprogram contracts.\
    \ The subprogram, called Increment, adds 1 to the value of its parameter X:\n\n\
    > Listing 1: increment.adcm\n\n```\nprocedure Increment\nnX : in out Integer\n\
    with\n  Global\n    Depends => (X => X),\n    Pre      => X = Integer,\n    Post\
    \     => X = X'Old + 1;\n```\n\n> Listing 2: increment.adcb\n\n```\nprocedure\
    \ Increment\nX : in out Integer\nbegin\n  X := X + 1;\nend Increment;\n```\n\n\
    Prover output\n\n```\n2 https://www.adacore.com/codepeer\n3 https://www.adacore.com/gnatpro\n\
    4 https://www.adacore.com/gnatpro/toolsuite/gps\n```"
- md: "\n# Introduction to SPARK\n\n```\nPhase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: flow analysis and proof ...\nincrement.ads:5:10: info: overflow\
    \ check proved\nincrement.ads:4:03: info: data dependencies proved\nincrement.ads:5:03:\
    \ info: flow dependencies proved\nincrement.ads:7:14: info: postcondition proved\n\
    increment.ads:7:24: info: overflow check proved\n```\n\nThe contracts are written\
    \ using the Ada aspect feature and show those several properties of this subprogram:\n\
    \n- The SPARK Global aspect is especially important for security: it says that\
    \ the value of the parameter X depends only on the (previous) value of X.\n- The\
    \ SPARK Depend aspect says that Increment does not read or write any global variables.\n\
    - The Pre and Post aspects of Ada show specific properties of Increment:\n- Increment\
    \ is only allowed to be called if the value of X prior to the call is less than\
    \ Integer Last. This ensures that the operation performed in the subprogram body\
    \ doesn't overflow.\n- Increment does not perform an increment of X: the value\
    \ of X after a call is greater than its value before the call.\n\nGNATprove can\
    \ verify all of these contracts. In addition, it verifies that no error can be\
    \ raised at runtime when executing Increment's body.\n\n# 1.5 The Programming\
    \ Language\n\nIt's important to understand why there are differences between the\
    \ SPARK and Ada languages. The aim when designing the SPARK subset of Ada was\
    \ to create the possible subset of Ada that was still amenable to specification\
    \ and sound verification.\n\nThe most notable restrictions from Ada are related\
    \ to exceptions and access types, both of which are known to considerably increase\
    \ the amount of user-written annotations required for full support. Backwards\
    \ goto statements and controlled types are also not supported since they introduce\
    \ non-trivial control flow. The two remaining restrictions relate to side-effects\
    \ in expressions and aliasing of names, which we now cover in detail.\n\n# 1.6\
    \ Limitations\n\n### 1.6.1 No side-effects in expressions\n\nThe SPARK language\
    \ doesn't allow side-effects in expressions. In other words, evaluating a SPARK\
    \ expression must not update any object. This limitation is necessary to avoid\
    \ unpredictable behavior that depends on order of evaluation, parameter passing\
    \ mechanisms, or compiler optimizations. The expression for Dummy below is non-deterministic\
    \ due to the order in which the two calls to F are evaluated. It's therefore not\
    \ legal SPARK.\n\nListing 3: show_illegal_ada_code.adb\n\n```\nprocedure Show_Illegal_Ada_Code\
    \ is\nfunction F (X : in Integer) return Integer is\nTmp : constant Integer :=\
    \ X;\nbegin\nX := X + 1;\nreturn Tmp;\nend F;\n\nDummy : Integer := 0;\n\nbegin\n\
    Dummy := F (Dummy) - F (Dummy); -- ??\nend Illegal_Ada_Code;\n```\n\n# Build output\n\
    \nshow_illegal_ada.code:13:20- error: value may be affected by call to \"F\" because\
    \ order of evaluation is arbitrary\ngprbuild: compilation phase failed\n\n# Prover\
    \ output\n\nPhase 1 of 2: generation of Global contracts ...\nshow_illegal_ada.code:13:28-\
    \ error: value may be affected by call to \"F\" because order of evaluation is\
    \ arbitrary\ngnatprove: error during generation of Global contracts\n\nIn fact,\
    \ the code above is not illegal Ada, so the same order is generated by the GNAT\
    \ compiler. SPARK suffers when GNATProve produces an error for the following equivalent\
    \ code that is accepted by the Ada compiler:\n\n> Listing 4: show_illegal_spark_code.adb\n\
    \n```\nprocedure Show_Illegal_SPARK_Code is\n\nDummy : Integer := 0;\n\nfunction\
    \ F return Integer is\nTmp : constant Integer := Dummy;\nbegin\nDummy := Dummy\
    \ + 1;\nreturn Tmp;\nend F;\n\nbegin\nDummy := F - F; -- ??\nend_Illegal_SPARK_Code;\n\
    ```\n\n# Prover output\n\nPhase 1 of 2: generation of Global contracts ...\nPhase\
    \ 2 of 2: analysis of data and information flow\nshow_illegal_spark.code:5:13-\
    \ error: function with output output global \"Dummy\" is not allowed in SPARK\n\
    gnatprove: error during analysis of data and information flow\n\nSPARK enforces\
    \ the lack of side-effects in expressions by forbidding side-effects in functions,\
    \ which would include to parameters or global variables. As a consequence, SPARK\
    \ forbids functions with out or in parameters in addition to functions modifying\
    \ a global variable. Function F below is illegal in SPARK, while function Incr\
    \ might be legal if it doesn't modify any global variables and function Incr_Log\
    \ might be illegal if it modifies global variables to perform logging.\n\n```\n\
    function F (X : in Integer) return Integer; -- Illegal\n```\n\n```\nfunction Incr\
    \ (X : Integer) return Integer; -- OK?\n```\n\n```\nfunction Incr_And_Log (X :\
    \ Integer) return Integer; -- OK?\n```\n\nIn many cases, you can easily replace\
    \ these functions by procedures with an out parameter that returns the computed\
    \ value.\n\nWhen it comes to function bodies, GNAT proves that those functions\
    \ are free from side-effects. Here for example, the functions Incr and Incr_And_Log\
    \ have the same signature, but only Incr is in SPARK: Incr_And_Log isn't: it attempts\
    \ to update the global variable Call_Count.\n\nListing 5: side_effects.ads\n\n\
    ```\npackage Side_Effects is\nfunction Incr (X : Integer) return Integer; -- OK\n\
    function Incr_And_Log (X : Integer) return Integer; -- Illegal\nend Side_Effects;\n\
    ```\n\nListing 6: side_effects.sp\n\n```\n\npackage Side_Effects is\nfunction\
    \ Incr (X : Integer) return Integer; -- OK\nfunction Incr_And_Log (X : Integer)\
    \ return Integer; -- Illegal\nend Side_Effects;\n```\nWait, let's re-align the\
