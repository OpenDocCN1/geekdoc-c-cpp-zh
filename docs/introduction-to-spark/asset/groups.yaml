    gnatprove: error during data and information flow\n\nSPARK 不允许副作用。因此，Pop 不允许修改参数\
    \ S。\n\n### 1.8.2 示例 2\n\n让我们转换为抽象状态机栈，提供单个栈实例。栈的内容（全局变量 Content 和 Pop）对客户端不可见。在简化版本中，只有\
    \ Pop 函数对客户端可用。包的规范和体被标记为属于 SPARK。\n\n> Listing 10: global_stack\n\n```\npackage\
    \ Global_Stack\nwith SPARK_Mode => On\ntype Element is new Integer;\nfunction\
    \ Pop return Element;\nend Global_Stack;\n```\n\n> Listing 11: global_stack.adb\n\
    \n```\npackage body Global_Stack\nwith SPARK_Mode => On\nMax : constant Natural\
    \ := 100;\ntype Element_Array is array (1 .. Max) of Element;\nContent : Element_Array;\n\
    Top : Natural;\nfunction Pop return Element is\nE : constant Element := Content(Top);\n\
    begin\nTop := Top - 1;\nreturn E;\nend Pop;\nend Global_Stack;\n```\n\n# 证明输出\n\
    \nPhase 1 of 2: generation of Global contracts\nPhase 2 of 2: analysis of data\
    \ and information flow\nglobal_stack.adb:7:04: warning: variable \"Content\" is\
    \ read but never assigned [-gnatw]\nglobal_stack.adb:6:13: error: function with\
    \ output \"Top\" is not allowed in SPARK\ngnatprove: error analysis of data and\
    \ information flow\n\n如上，函数应该没有副作用。在这里，Pop 更新全局变量 Top，这是不允许的。\n\n### 1.8.3 示例\
    \ 3\n\n我们现在考虑两个过程：Permute 和 Swap。Permute 对 X 和 Y 的值应用循环排列。\n\nListing 12: p.ads\n\
    \n```\npackage P\nwith SPARK_Mode => On\nis\n  procedure Permute (X, Y, Z : in\
    \ out Positive);\n  procedure Swap (X, Y : in out Positive);\nend P;\n```\n\n\
    Listing 13: p.adb\n\n```\npackage body P\nwith SPARK_Mode => On\nis\n  procedure\
    \ Permute (X, Y, Z : in out Positive) is\n    Tmp : constant Positive := X;\n\
    \  begin\n    X := Y;\n    Y := Z;\n    Z := Tmp;\n  end Permute;\n\n  procedure\
    \ Swap (X, Y : in out Positive) is\n  begin\n    Permute (X, Y);\n  end Swap;\n\
    end P;\n```\n\nListing 14: test_swap.adb\n\n```\nwith P; use P;\nprocedure Test_Swap\n\
    with SPARK_Mode => On\nis\n  A : Integer := 1;\n  B : Integer := 2;\nbegin\n \
    \ Swap (A, B);\nend Test_Swap;\n```\n\n# 构建输出\n\np.adb:14:19: error: writable\
    \ actual for \"Y\" overlaps with actual \"Z\"\ngprbuild: *** compilation failed\n\
    \n# 证明输出\n\nPhase 1 of 2: generation of Global contracts\np.adb:14:19: error:\
    \ writable actual for \"Y\" overlaps with actual \"Z\"\ngnatprove: error during\
    \ generation of Global contracts\n\n在这里，Y 和 Z 的值被别名以调用 Permute，这在 SPARK 中是不允许的。事实上，在特定情况下，这违反了\
    \ Ada 规则，因此 Ada 编译器也发出了相同的错误。\n\n在这个例子中，我们看到了为什么 SPARK 不允许别名的原因：因为 Y 和 Z 是 Positive\
    \ 类型，它们是通过复制传递的，调用 Permute 的结果取决于它们在调用后被复制的顺序。\n\n"
