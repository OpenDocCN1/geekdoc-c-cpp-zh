  - "[PAGE 115]\n\n# 5.3.2 Ghost Procedures\n\nGhost procedures can't affect the value\
    \ of normal variables, so they're mostly used to perform operations on ghost variables\
    \ or group together a of intermediate assertions.\n\nAbstracting the treatment\
    \ of assertions and ghost variables inside a ghost procedure has several advantages.\
    \ First, you're allowed to use these variables in any way you choose in code inside\
    \ ghost procedures. This isn't the case outside ghost procedures, where the only\
    \ ghost statements allowed are ghost variables and cast to ghost procedures.\n\
    \nAs an example, the for loop contained in Increase_A couldn't appear by itself\
    \ in normal code.\n\nList 22: show_ghost_Proc.adcs\n\n```\npackage Show_Ghost_Proc\
    \ is\n  type Nat_Array is array (Integer range) of Natural;\n  A : Nat_Array (1\
    \ .. 100) with Ghost;\n  procedure Increase_A with\n    Ghost;\n    Pre := (for\
    \ all I in A'Range => A (I) < Natural'Last);\n  end Show_Ghost_Proc;\n```\n\n\
    List 23: show_ghost_proc.adb\n\n```\npackage Show_Ghost_Proc is\n  procedure Increase_A\
    \ is\n    begin\n      for I in A'Range loop\n        A (I) := A (I) + 1;\n  \
    \    end loop;\n    end Increase_A;\nend Show_Ghost_Proc;\n```\n\n# Prove output\n\
    \nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis\
    \ and proof ...\nshow_ghost_proc.adb:625: info: overflow checked\n\nUsing the\
    \ abstraction to improve readability by hiding complex code that isn't part of\
    \ the functional behavior of the subgraph. It can help GNAT prove by abstracting\
    \ assertions that would otherwise make its job more complex.\n\nIn the example\
    \ below, calling Prove_P with X as an operand only adds P (X) to the post context\
    \ instead of the larger set of assertions required to verify it. In addition,\
    \ the post of P only needs to be done once and maybe made easier without having\
    \ any unnecessary information in its post context verifying it. Also, GNAT can't\
    \ fully verify Prove_P, you can review the remaining assumptions unless they're\
    \ in a smaller context.\n\n```\nprocedure Prove_P (X : T) with Ghost,\nGlobal\
    \ => null,\nPost => P (X);\n```\n\n# 5.3. Guide Proof"
  - "[PAGE 116]\n\n# Introduction to SPARK\n\n# 5.3.3 Handling of Loops\n\nWhen the\
    \ program involves a loop, you're always required to provide additional annotations\
    \ to allow GNATprove to complete a proof because the verification techniques used\
    \ by GNATprove do not handle cycles in a subprogram's control flow. Instead, loops\
    \ are flattened by dividing them into several acyclic parts.\n\nAs an example,\
    \ let's look at a simple loop with an exit condition.\n\n```\nStmt1;\nloop\nStmt2;\n\
    exit when Cond;\nStmt3;\nend loop;\nStmt4;\n```\n\nAs shown below, the control\
    \ flow is divided into three parts.\n\n![](img/f1e490d8090325782c7af40c77e8a99e_116_0.png)\n\
    \nThe first, in yellow, starts earlier in the subprogram and enters the loop statement.\
    \ The loop itself is divided into two parts. Red represents a complete execution\
    \ of the loop's body: an execution where the exit condition is not satisfied.\
    \ Blue represents the last execution of the loop, which includes some of the subprogram\
    \ following it. For that path, the exit condition is assumed to hold. The red\
    \ and blue parts are executed after the yellow one.\n\nGNATprove analyzes these\
    \ parts independently since it doesn't have a way to track how variables have\
    \ been updated by an iteration of the loop. It forgets it knows about those variables\
    \ from one part when entering another part. However, values of constants and variables\
    \ that aren't modified in the loop are not an issue.\n\nIn other words, handling\
    \ loops in ways that makes GNATprove imprecise when verifying a subprogram involving\
    \ a loop: it can't verify a property that relies on values modified inside the\
    \ loop. It won't get any information about the value of constants or unmodified\
    \ variables, but it nevertheless not be able to deduce new information about them\
    \ from the loop.\n\nFor example, consider the function Find which returns the\
    \ array A and searches for an element E is stored in A.\n\n> Listing 24: show_find.ads\n\
    \n```\npackage Show_Find is\n  type Nat_Array is array (Positive range <>) of\
    \ Natural;\n  function Find (A : Nat_Array; E : Natural) return Natural;\n  end\
    \ Show_Find;\n```"
  - "[PAGE 117]\n\n# Introduction to SPARK\n\nListing 25: show_find.adb\n\n```\npackage\
    \ Show_Find is\n function Find (A : Nat_Array; E : Natural) return Natural is\n\
    begin\n for I in A'Range Assert\n    pragma (all J in A'First .. I - 1 => A (J)\
    \ /= E);\n    assertion is not proved\n    if (I) = E then\n      return I;\n\
    \    end if;\n    pragma Assert (A (I) /= E);\n    assertion is proved\n  end\
    \ loop;\n  return 0;\nend Find;\nend Show_Find;\n```\n\n# Prover output\n\nPhase\
    \ 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis and\
    \ proof ...\nshow.find.adb:6:51: info: overflow checked proved\nshow.find.adb:6:58:\
    \ medium: assertion might fail, cannot prove A (J) /= E_ \n[possible fix: subprogram\
    \ at show.find.adb:5 should mention A and E in a_precondition]\nshow.find.adb:6:61:\
    \ info: index checked proved\nshow.find.adb:9:20: info: range checked proved\n\
    show.find.adb:11:25: info: assertion proved\ngnatprove: prove check messages considered\
    \ as errors\n\nAt the end of each iteration, GNATprove knows that the value stored\
    \ in I must not be E. (If it, the loop would not have reached the end of the iteration.).\
    \ This proves the second assertion. But it's unable to aggregate this information\
    \ over multiple loop iterations to deduce that it's true for all indices I, so\
    \ it can't prove the first assertion.\n\n# 5.3.4 Loop Invariants\n\nTo overcome\
    \ these limitations, you can provide additional information to GNATprove in the\
    \ form of a loop invariant. In SPARK, a loop invariant is a Boolean expression\
    \ that holds true at every iteration of the loop. Like other assertions, you can\
    \ check it at runtime by compiling the program with assertions.\nThe major difference\
    \ between loop invariants and other assertions is that it's treated for proofs.\
    \ GNATprove performs the proof of a loop invariant in two steps: first, it checks\
    \ that it holds for the first iteration of the loop and then it checks that it\
    \ holds in an arbitrary iteration assuming it is held in the previous iteration.\
    \ This is called proof by induction24.\nAs an example, let's add a loop invariant\
    \ to the Find function stating that the first element of A is not E.\n\nListing\
    \ 26: show_find.ads\n\n```\npackage Show_Find is\n  type Nat_Array is array (Positive\
    \ range <>) of Natural;\n```\n\n24 https://en.wikipedia.org/wiki/Mathematical_induction\n\
    \n# 5.3. Guide Proof\n\n111"
- md: "\n# Introduction to SPARK\n\n(continued from previous page)\n\n```ada\nfunction\
    \ Find (A : Nat_Array; E : Natural) return Natural;\nend Show_Find;\n```\n\nListing\
    \ 27: show_find.adb\n\n```ada\npackage body Show_Find is\nfunction Find (A : Nat_Array;\
    \ E : Natural) return Natural is\n  begin\n    for I in A'Range loop\n      pragma\
    \ Invariant (A ('First) /= E);\n        loop invariant not proved in first iteration\n\
    \        but preservation of loop invariant proved\n        if A (I) = E then\n\
    \          return I;\n        end if;\n    end loop;\n    return I;\n  end;\n\
    end Show_Find;\n```\n\n# Prover output\n\nPhase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: flow analysis and proof ...\nshow.find.adb:63: info: loop\
    \ invariant preservation proved\nshow.find.adb:63: medium: loop invariant might\
    \ fail in first iteration [possible,\nfix: program at show find should mention\
    \ A and E in a precondition]\nshow.find.adb:67: info: index check proved\nshow.find.adb:10:20:\
    \ info: range check proved\ngnatprove: unproved check messages considered errors\n\
    \nTo verify this invariant, GNATProve generates two checks. The first checks that\
    \ the assertion holds in the first iteration of the loop. This is not verified\
    \ by GNATProve. And indeed there is no reason to check the first element of A\
    \ to be different from E in this iteration. However, the second check is proved;\
    \ it is easy to deduce that if the element of A was not E in a given iteration\
    \ it's not E in this iteration. However, if we move the invariant to the end of\
    \ the loop, then it is successfully verified by GNATProve.\n\nNot only do invariants,\
    \ GNATProve allows you to verify complex properties of loops, but GNATProve also\
    \ uses them to verify other properties, such as the absence of runtime errors\
    \ over the loop's body and the statements following the loop. More precisely,\
    \ verifying a runtime check or other assertion ensures that the loop invariant\
    \ preceding the check or assertion is true.\n\nLet's look at an example of Find\
    \ where we use a loop invariant instead of an assertion to state that none of\
    \ the array elements seen are equal to E.\n\nListing 28: show_find.adb\n\n```ada\n\
    package Show_Find is\ntype Nat_Array is array (Positive range <>) of Natural;\n\
    function Find (A : Nat_Array; E : Natural) return Natural;\nend Show_Find;\n```\n\
    \nChapter 5. Proof of Functional Correctness\n\n# Listing 29: show_find.adb\n\n\
    ```ada\npackage body Show_Find is\nfunction Find (A : Nat_Array; E : Natural)\
    \ return Natural is\nbegin\n  for I in A'Range loop\n    pragma Loop Invariant\n\
    \      (for all J in A'First .. I - 1 => A (J) /= E);\n    if A (I) = E then\n\
    \      return I;\n    end;\n  end loop;\n  pragma Assert (for all I in A'Range\
    \ => A (I) /= E);\n  return 0;\nend Find;\nend Show_Find;\n```\n\nPhase 1 of 2:\
    \ generation of Global contracts ...\nPhase 2 of 2: flow analysis and proof ...\n\
    show_find.adb:73: info: loop invariant initialization proved\nshow.find.adb:73:\
    \ info: loop invariant preservation proved\nshow.find.adb:39: info: overflow check\
    \ proved\nshow.find.adb:49: info: index check proved\nshow.find.adb:90: info:\
    \ range check proved\nshow.find.adb:12:25: info: insertion proved\nshow.find.adb:12:49:\
    \ info: index check proved\n\nThis is fully verified by GNAT! This proves that\
    \ the loop invariant holds in every iteration of the loop (separating the first\
    \ iteration and then the following iterations). It also proves that none of the\
    \ Elements of A are equal to E after the loop exits by asserting that the loop\
    \ invariant holds in the last iteration of loop.\n\n> Note: For more details on\
    \ loop invariants, see the SPAR User's Guide25.\n\nFinding a good loop invariant\
    \ can turn out to be quite a challenge. To make this easier, let's review the\
    \ four good properties of a good loop invariant:\n\n| Property | Description |\n\
    |---|---|\n| INIT | It should be proved in the first iteration of the loop. |\n\
    | INSIDE | It should allow the absence of run-time errors and local assertions\
    \ inside the loop. |\n| AFTER | It should allow absence of run-time errors, local\
    \ assertions, and the subprocess postcondition after the loop. |\n| PRESERVE |\
    \ It should be proved after the first iteration of the loop. |\n\nLet's look at\
    \ each of these. The first loop invariant should be proved in the first iteration\
    \ of the loop (INIT). If your invariant fails to achieve this, you can debug the\
    \ invariant's initialization.\n\n# 5.3. Guide Proof\n\n# Introduction to SPARK\n\
    \nSecond, the loop invariant should be precise enough to outline absence of runtime\
    \ errors in both the loop's body (INSIDE) and the statements following the loop\
    \ (AFTER). To do this, you should include in your invariant what variables are\
    \ modified throughout the loop. \n\nFinally, the loop invariant should be precise\
    \ enough to prove after the first iteration (PRESERVE). This is generally the\
    \ trickiest part. To understand why GNATprove hasn't been able to prove the preservation\
    \ of the loop, you may find it useful.\n"
