- md: "\n## 3.3.2 Additional Assertions and Contracts\n\nAs we've seen, a key feature\
    \ of SPARK is that it allows us to state properties to check using assertions\
    \ and contracts. SPARK supports preconditions and postconditions as well as assertions\
    \ introduced by the Assert pragma.\n\nThe SPARK language also includes new contract\
    \ types to assist formal verification. The new Assume is treated as an assertion\
    \ during execution but introduces an assumption when proving programs. Its value\
    \ is a Boolean expression that GNAT proves to be true without any attempt to verify\
    \ that it's. You will find this useful, but you must use it with great care. Here's\
    \ an example of using it.\n\nListing 9: incr.adb\n```ada\nprocedure Incr (X :\
    \ in Integer) is\nbegin\n  pragma Assume (X < Integer);\n  X := X + 1;\nend Incr;\n\
    ```\nProver output\nPhase 1 of 2: generation of Global contracts ...\nPhase 2\
    \ of 2: flow analysis and proof ...\nincr.adb:4:1: info: overflow proved\n\nNote:\
    \ For details on pragma Assume, see the SPARK's Guide.\n\nThe Contract aspect\
    \ is another construct introduced for GNAT, but also acts as an assertion during\
    \ execution. It allows you to specify the behavior of a subprogram using disjunction\
    \ of contracts. Each element of Contract Case is a guard, which is evaluated before\
    \ the call and may only reference the subprogram's inputs, and a consequence.\
    \ At each call of the subprogram, only one guard is permitted to evaluate to True.\
    \ The consequence of that case is satisfied when the subprogram returns.\n\n##\
    \ 3.3. Contracts\n\nSimilarly to how it analyzes a subprogram's precondition,\
    \ GNAT verifies the Contract_Cases once. It verifies the validity of each consequence\
    \ (given the truth of its guard) and the disjointness and completeness of the\
    \ guard (meaning that exactly one must be true for each possible set of input\
    \ values).\n\n**Note:** For more details on Contract_Cases, see the SPARK's Guide.\n\
    \nListing 10: absolute.adb\n```ada\nprocedure Absolute (X : in Integer) with\n\
    \  Pre => Integer,\n  Contract_Cases => (X < 0) => X'Old,\n                  \
    \  X >= 0 => X'Old)\nis\nbegin\n  if X < 0 then\n    X := -X;\n  end if;\nend\
    \ Absolute;\n```\nProver output\nPhase 1 of 2: generation of Global contracts\
    \ ...\nPhase 2 of 2: flow analysis and proof ...\nabsolute.adb:3:0: info: disjoint\
    \ cases proved\nabsolute.adb:3:0: info: complete cases proved\nabsolute.adb:3:29:\
    \ info: contract case proved\nabsolute.adb:3:36: info: overflow check\nabsolute.adb:4:29:\
    \ info: contract case proved\nabsolute.adb:8:12: info: overflow proved\n\n## 3.4\
    \ Debugging Failed Attempts\n\nGNATprove may report an error while verifying a\
    \ program for any of the following reasons:\n- there might be an error in the\
    \ program;\n- the property may not be provable as written because more information\
    \ is required;\n- the prover by GNATprove may be unable to prove a perfectly valid\
    \ property.\n\nWe spend the remainder of this section discussing the somewhat\
    \ tricky task of debugging failed proof attempts.\n\n### 3.4.1 Debugging Errors\
    \ in Code or Specification\n\nFirst, let's discuss the case where there's an error\
    \ in the program. There are two possibilities: the code may be incorrect, or equally,\
    \ the specification may be incorrect. As an example, there's an error in our procedure\
    \ Incr_Until until its Contract_Cases unprovable.\n\nListing 11: show_failed_proof_attempt.ads\n\
    ```ada\npackage Show_Failed_Proof_Attempt is\n  Incremented : Boolean := False;\n\
    \n  procedure Incr_Until (X : in Natural) with\n    Contract_Cases =\n      (Incremented\
    \ => X'Old,\n       others => X'Old);\nend Show_Failed_Proof_Attempt;\n```\nListing\
    \ 12: show_failed_proof_attempt.adb\n```ada\npackage Show_Failed_Proof_Attempt\
