    \ 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis and proof\
    \ ...\nshow_failed_proof_attempt.ads:6:49: medium: postcondition might fail, cannot\
    \ prove X\nGNATprove: unproved checks as errors\n\nThis postcondition is conditional.\
    \ If it says that the parameter (X) is less than a value (C), its value will be\
    \ increased by the procedure if it grows, its value will be C (saturated). When\
    \ C has the value 100, the Increase adds 10 to the value of X if it was initially\
    \ less than 90, increments X by 1 if it is 90, and sets X to 100 if it grows or\
    \ equal to 100. This behavior does satisfy the postcondition, what if the postcondition\
    \ is not proved?\n\n### 3.4.3 Debugging Proof Violations\n\nFinally, there are\
    \ cases where GNAT provides a perfectly valid verification condition for a property,\
    \ but never proved by the automatic proof runs in the later stages of the tool's\
    \ execution. This is quite common. GNAT produces its verification conditions in\
    \ first-order logic, which is not decidable, in combination with the rules of\
    \ arithmetic. Sometimes, the automatic proof needs more time. The other prover,\
    \ will abandon the search almost immediately or loop forever without reaching\
    \ an answer (either a proof or a counterexample).\n\nFor example, the postcondition\
    \ of our GCD function below — which calculates the value of the GCD of two numbers\
