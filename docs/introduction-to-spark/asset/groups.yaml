    \n子程序的嵌套创建了我们所谓的“作用域变量”：在包含单元中局部声明的变量。从嵌套子程序的角度来看，作用域变量看起来非常全局变量。\n\n流分析通常很快，速度大约与编译相当。它能检测各种类型的错误和对某些\
