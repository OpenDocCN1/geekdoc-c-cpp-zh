    # Introduction to SPARK


    Let''s contrast this example with a different representation of Global and Depends
    contracts, this using a single abstract state.


    Listing 14: stack.sacs


    ```

    package Stack with

    Abstract_State => The_Stack

    is

    type Element is new Integer;


    procedure Pop (E : out Element) with

    Global => (In Out => The_Stack),

    Depends => ((The_Stack, E) => The_Stack);

    end Stack;

    ```


    # Prover output


    +   - Phase 1 of 2: generation of global contracts

    - Phase 2 of 2: analysis of data and information flow


    Here, Top State and Content State are merged into a single state abstraction,
    The_Stack. By doing so, we''ve made the fact Content is not modified (though we''re
    showing that Top may be modified). This loss in precision is reasonable here,
    since it''s the whole point of abstraction. However, you must be careful not to
    aggregate state until these contracts are becoming meaningless.


    Even imprecise contracts consider state abstractions as a whole perfectly reasonable
    for users of a package, you should write Global and Depends contracts that are
    as precise as possible within the package body. To allow this, SPARK introduces
    the notion of refined contracts, which are precise contracts specified on the
    bodies of subprograms where state refinements are visible but normal Global and
    Depends contracts except they refer directly to the state of the package.


    When a subprogram is called inside the package body, you should write refined
    contracts instead of the general ones so that the verification can be as precise
    as possible. However, refined Global and Depends are optional: if you do not specify
    them, GNATProve will compute to check the package''s implementation.


    For our Stack example, we could add refined contracts as shown below.


    Listing 15: stack.acs


    ```

    package Stack with

    Abstract_State => The_Stack

    is

    type Element is new Integer;


    procedure Pop (E : out Element) with

    Global => (In Out => The_Stack),

    Depends => ((The_Stack, E) => The_Stack);


    procedure Push (E : Element) with

    Global => (In Out => The_Stack),

    Depends => ((The_Stack, E) => The_Stack));

    end Stack;

    ```


    Listing 16: stack.adb


    ```

    package body Stack with

    Refined_State => (The_Stack => (Content, Top))

