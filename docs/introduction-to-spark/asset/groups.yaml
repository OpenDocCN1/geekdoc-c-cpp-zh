    \ := (others => 0);\n  Top : Natural range 0 .. Max := 0;\n  Content and Top must\
    \ be listed in the list of constituents of The_Stack\n  procedure Pop (E : out\
    \ Element) is\nbegin\n  E := Content (Top);\n  Top := Top - 1;\nend Pop;\n  procedure\
    \ Push (E : Element) is\nbegin\n  Top := Top + 1;\n  Content (Top) := E;\nend\
    \ Push;\nend Stack;\n```\n\n# 证明器输出\n\n```\nPhase 1 of 2: generation of Global\
