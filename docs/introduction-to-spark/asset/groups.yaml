    \ 合约。它的值是子程序输出和输入之间的一个或多个依赖关系列表。每个关系由两个用箭头分隔的变量列表表示。每个箭头的左侧是变量，其最终值依赖于右侧变量列表的初始值。\n\
    \n例如，我们指示 `Swap` 的每个参数的最终值仅依赖于另一个参数的初始值。如果子程序是一个函数，我们将其列为输出，使用 `Result` 属性，正如我们对\
