  mdcn: "\n\n## SPARK 简介\n\n具体而言，访问对象之间的赋值操作了一个所有权的转移，源对象失去对其读取或写入底层分配内存的权限。\n\n过程\
    \ `Ownership_Transfer` 是在 Ada 中合法但在 SPARK 中由于别名（aliasing）被拒绝的代码示例：\n\nListing\
    \ 8: ownership_transfer.adb\n\n```\nprocedure Ownership_Transfer is\n  type IntPtr\
    \ is access Integer;\n  X : IntPtr;\n  Y : IntPtr;\n  Dummy : Integer;\nbegin\n\
    \  X := new Integer'(1);\n  X.all := X.all + 1;\n  Y := X;\n  Y.all := Y.all +\
    \ 1;      illegal\n  X.all := X.all + 1;      illegal\n  X.all := 1;         \
    \     illegal\n  Dummy := X.all;         illegal\nend Ownership_Transfer;\n```\n\
    \n# 输出\n\nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: analysis\
    \ of data and information flow ...\nship_transfer.adb:11:06: error: dereference\
    \ from \"X\" is not writable\nship_transfer.adb:11:06: error was moved at line\
