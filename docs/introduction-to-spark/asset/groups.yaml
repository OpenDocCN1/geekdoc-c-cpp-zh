    \n你可以在包体中细化状态抽象，包体中所有变量都是可见的。当只有包的规范（specification）可用时，你需要一种方法来指定每个变量属于哪个状态抽象。你通过在变量声明中添加\
    \ `Part_Of` 属性来实现这一点。\n`Part_Of` 注解是强制性的：如果你给包提供了抽象状态注解，你必须将其部分中定义的所有隐藏变量连接到一个状态抽象。例如：\n\
    \nListing 7: stack.ads\n\n```\npackage Stack with\n  Abstract_State => The_Stack\n\
