- md: "\n# Introduction to SPARK\n\n## 3.5.9 Example #9\n\nThe procedure performs\
    \ various computations on its argument. The computation depends on its input range\
    \ and is reflected in its contract, which we express using a Contract_Cases aspect.\n\
    \nListing 38: compute.adb\n\n```\nprocedure Compute (X : in out Integer) with\n\
    Contract_Cases => ((X in -100 .. 100) => X = X'Old + 2,\n                    \
    \               (X in 0 .. 199) => X = X'Old + 1,\n                          \
    \         (X in -100 .. 0) => X = X'Old - 1,\n                               \
    \    (X >= 200) => X = -200)\nothers;\nbegin\n  if X in -100 .. 100 then\n   \
    \ X := X * 2;\n  elsif X in 0 .. 199 then\n    X := X + 1;\n  elsif X in -199\
    \ .. 0 then\n    X := X - 1;\n  elsif X >= 200 then\n    X := 200;\n  else\n \
    \   X := -200;\n  end if;\nend Compute;\n```\n\n### Prover output\n\n- Phase of\
    \ 1: generation of Global contracts ...\n- Phase of 2: flow analysis and proof\
    \ ...\n- compute:2:03: medium: contract cases might not be disjoint\n- compute.adb:5:41:\
    \ medium: contract case might fail\n- compute.adb:4:41: medium: contract case\
    \ might fail\n- gprove: unproved check messages considered as errors\n\nThis example\
    \ is not correct. We duplicated the content of Contract_body in its contract.\
    \ This is incorrect because the semantics of Contract_Cases require disjoint cases,\
    \ just like a case-statement. The counterexample returned by GNAT prove that X\
    \ = 0 is covered by two different case-guards (the first and the second).\n\n\
    ## 3.5.10 Example #10\n\nLet's rewrite the contract of Compute to avoid overlapping\
    \ cases.\n\nListing 39: compute.adb\n\n```\nprocedure Compute (X : in out Integer)\
    \ with\nContract_Cases => ((X in 0 .. 199) => X >= X'Old,\n                  \
    \                 (X in -100 .. -1) => X <= X'Old,\n                         \
    \          (X >= 200) => X = 200,\n                                   (X < -200)\
    \ => X = -200);\nbegin\n  if X in -100 .. 100 then\n    X := X * 2;\n  elsif X\
    \ in 0 .. 199 then\n    X := X + 1;\nelsif X in -199 .. 0 then\n  X := X - 1;\n\
    elsif X >= 200 then\n  X := 200;\nelse\n  X := -200;\nend if;\nCompute Compute;\n\
    ```\n\n### Prover output\n\n- Phase 1 of 2: generation of Global contracts ...\n\
    - Phase 2 of 2: flow analysis and proof ...\n- gnat.adv:2:03: medium: contract\
    \ cases might not be complete\n- gnatprove: unproved check messages considered\
    \ as errors\n\nThis example is still not correct. GNATProve can successfully prove\
    \ the different cases are disjoint and also successfully verify each case individually.\
    \ This Isn't enough, though: a Contract_Cases must cover all cases. Here, we forgot\
    \ the value -200, which is what GNATprove reports in its counterexample.\n\n##\
    \ 3.5. Code Examples / Pitfalls\n\n## STATE ABSTRACTION\n\nAbstraction is a key\
    \ concept in programming that can drastically simplify both the implementation\
    \ and maintenance of code. It's particularly well suited to SPARK and its modular\
    \ analysis. This section explains what state abstraction is and how you use it\
    \ in SPARK. We explain how it impacts GNAT's analysis both in terms of information\
    \ flow and proof of program properties.\n\nState abstraction allows us to:\n\n\
    - dependencies that wouldn't be expressible because some data's read or written\
    \ isn't visible at the point where a subprogram is declared — examples are dependencies\
    \ on data, for which we use the Global contract, and on flow, for which we use\
    \ the Depends contract.\n- reduce the number of variables that need to be considered\
    \ in flow analysis and proof, reduction which may be critical in order to scale\
    \ the analysis to programs with thousands of variables.\n\n## 4.1 What's an Abstraction?\n\
    \nAbstraction is an important part of programming language design. It provides\
    \ two views of the same object: an abstract and a refined one. The abstract one\
    \ — usually called specification — describes what the object does in a coarse\
    \ way. A subprogram's specification usually describes how it should be called\
    \ (e.g., parameter information such as how many and what types) as well as what\
    \ it does (e.g., returns a result or modifies one or more of its parameters).\n\
    \nContract-based programming, as supported in Ada, allows contracts to be added\
    \ to a subprogram's specification. You use contracts to describe the subprogram's\
    \ behavior in a more fine-grained manner, but all the details of how the subprogram\
    \ actually works are left to its refined view, its implementation.\n\nTake a look\
    \ at the example code shown.\n\nListing 1: increase.ads\n\n```\nprocedure Increase\
    \ (X : in out Integer) with\n  Global => null;\n  Pre => X < 100;\n  Post => X'Old\
    \ < X;\n```\n\nListing 2: increase.ads\n\n```\nprocedure Increase (X : in out\
    \ Integer) is\n  begin\n    X := X + 1;\n  end Increase;\n```\n\n### Prover output\n\
    \n# Introduction to SPARK\n\n- Phase 1 of 2: generation of Global contracts ...\n\
    - Phase 2 of 2: flow analysis and proof ...\n- increase.adb:3:11: info: overflow\
    \ check proved\n- increase.adb:2:03: info: data dependencies proved\n- increase.adb:4:13:\
    \ info: postcondition proved\n\nWe've written a specification of the subprogram\
    \ Increase to say that it's called with a single argument, a variable of type\
    \ Integer whose initial value is less than 100. Our contract says that the only\
    \ effect of the subprogram is to increase the value of its argument.\n\n## 4.2\
    \ Why is Abstraction Useful?\n\nA good description of a subprogram's implementation\
    \ is one specification precisely and completely specifies what the callers can\
    \ rely on. In other words, a caller of subprogram shouldn't rely on any behavior\
    \ of its implementation if it isn't documented in its specification.\n\nFor example,\
    \ callers of the subprogram Increase can assume that it always increases the value\
    \ of its argument. In the code snippet below, this means the loop must terminate.\n\
    \nList 3: increase.ads\n\n```\nprocedure Increase (X : in out Integer) with\n\
    Global X := null;\nPre => X <= 100;\nPost => X = 'Old X < X;\n```\n\nList 4: client.adb\n\
    \n```\nwith Increase;\nprocedure Client is\nX : Integer := 0;\nbegin\n  while\
    \ X <= 100 loop\n    Increase(X); -- Increase can be called safely\n  end loop;\n\
    \  pragma Assert (X = 101); -- Will this hold?\nend Client;\n```\n\n### Output\
    \ proof\n\n- Phase 1 of 2: generation of Global contracts ...\n- Phase 2 of 2:\
    \ flow analysis and proof ...\n- client.adb:8:19: medium: assertion might fail\n\
    - gnatprove: proved check messages considered as errors\n\nCallers can also assume\
    \ that the implementation of Increase won't cause any errors when called. In the\
    \ other hand, noting in the specification that guarantees the assertion above\
    \ is correct: it may fail if Increase is changed.\n\nIf you follow this basic\
    \ principle, abstraction can bring significant benefits. It simplifies both maintenance\
    \ and code reuse easier easier since changes to the implementation of an object\
    \ shouldn't affect the code using this object. Your goal is in it that it should\
    \ be simple enough to understand the specification of an object in order to use\
    \ that object, since understanding the specification is much simpler than understanding\
    \ the implementation.\n\nGNATprove relies on the abstraction defined by subprogram\
    \ contracts and therefore proves the assertion over the loop in Client.\n\n##\
    \ 4.3 Abstraction of a Package's State\n\nSubprograms are not the only objects\
    \ that benefit from abstraction. The state of a package — itself can also be hidden\
    \ from external users. You achieve this of abstraction — called abstraction —\
    \ by defining variables in the body or part of a package so they can only be accessed\
    \ by subprogram calls. For example, our Stack shown below provides an abstraction\
    \ for a Stack object which can only be modified using the Pop and Push procedures.\n\
    \n```\npackage Stack is\n  procedure Pop (E : out Element);\n  procedure Push\
    \ (E : in Element);\nend Stack;\n```\n\n```\npackage body Stack is\n  Content\
    \ : Array (1 . Max);\n  Top     : Natural;\nend Stack;\n```\n\nThe fact that we\
    \ implemented it using an array is irrelevant to the caller. We could change that\
    \ without impacting our callers' code:\n\n## 4.4 Declaring a State Abstraction\n\
    \nHidden state influences a program's behavior. SPARK allows that state to be\
    \ declared. You can use the Abstract_State aspect, an abstraction that names a\
    \ state, to this, but you aren't required to use it for a package with hidden\
    \ state. You can use several state abstractions to declare the hidden state of\
    \ a single package or you can use it for a package with no hidden state. However,\
    \ since SPARK doesn't allow aliasing, different state abstractions must always\
    \ refer to disjoint sets of variables. A state abstraction is not a variable:\
    \ it doesn't have a type and can't be used inside expressions, either those in\
    \ bodies or contracts.\n\nAs an example of the use of this aspect, we can optionally\
    \ define a state abstraction for the entire Stack package like this:\n\n```\n\
    package Stack with\nAbstract_State => The_Stack\n...\n```\n\nAlternatively, we\
    \ can define a state abstraction for each hidden variable:\n\n```\npackage Stack\
    \ with\nAbstract_State => (Top_State, Content_State)\n...\n```\n\nRemember: a\
    \ state abstraction is not a variable (It has no type) and can't be used inside\
    \ expressions. For example:\n\n```\npragma Assert (Stack.Top_State = ...);\n \
    \ -- compilation error: Top_State is not a variable\n```\n"
