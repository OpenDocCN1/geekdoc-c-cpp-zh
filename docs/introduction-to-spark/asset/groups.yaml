    ## 5.3.4 Loop Invariants\n\nTo overcome these limitations, you can provide additional\
    \ information to GNATprove in the form of a loop invariant. In SPARK, a loop invariant\
    \ is a Boolean expression that holds true at every iteration of the loop. Like\
