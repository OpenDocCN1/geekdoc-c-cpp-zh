    \    end if;\n  end GCD;\nend Show_Failed_Proof_Attempt;\n```\n"
  mdcn: "\n\n## 3.3.2 额外的断言与合约\n\n正如我们看到的，SPARK 的一个关键特性是允许我们使用断言（assertions）和合约（contracts）来检查属性。SPARK\
    \ 支持前置条件（preconditions）、后置条件（postconditions）以及通过 Assert pragma 引入的断言。\n\nSPARK\
    \ 语言还包含了新的合约类型以辅助形式化验证。新的 `Assume` 在执行期间被视为断言，但在证明程序时会引入一个假设。它的值是一个布尔表达式，GNAT\
    \ 会证明其为真，而无需尝试验证其真实性。你会发现很有用，但必须非常谨慎地使用。这里是一个使用示例。\n\nListing 9: incr.adb\n```ada\n\
    procedure Incr (X : in Integer) is\nbegin\n  pragma Assume (X < Integer);\n  X\
    \ := X + 1;\nend Incr;\n```\nProver output\nPhase 1 of 2: generation of Global\
    \ contracts ...\nPhase 2 of 2: flow analysis and proof ...\nincr.adb:4:1: info:\
    \ overflow proved\n\nNote：关于 `pragma Assume` 的详情，请参阅 SPARK 指南。\n\nContract 方面是为\
    \ GNAT 引入的另一个构造，但在执行期间也充当断言。它允许你通过合约的析取（disjunction）来指定子程序的行为。`Contract Case`\
    \ 的每个元素都是一个守卫（guard），它在调用之前进行评估且只能引用子程序的输入，以及一个结果（consequence）。在每次调用子程序时，只允许一个守卫评估为\
    \ True。当子程序返回时，该分支的结果即满足。\n\n## 3.3. 合约\n\n与分析子程序前置条件的方式类似，GNAT 会验证一次 `Contract_Cases`。它会验证每个结果的有效性（假设其守卫为真）以及守卫的互斥性和完整性（这意味着对于每组可能的输入值，必须恰好有一个为真）。\n\
    \n**注意：** 关于 `Contract_Cases` 的更多细节，请参阅 SPARK 指南。\n\nListing 10: absolute.adb\n\
    ```ada\nprocedure Absolute (X : in Integer) with\n  Pre => Integer,\n  Contract_Cases\
    \ => (X < 0) => X'Old,\n                    X >= 0 => X'Old)\nis\nbegin\n  if\
    \ X < 0 then\n    X := -X;\n  end if;\nend Absolute;\n```\nProver output\nPhase\
    \ 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis and\
    \ proof ...\nabsolute.adb:3:0: info: disjoint cases proved\nabsolute.adb:3:0:\
    \ info: complete cases proved\nabsolute.adb:3:29: info: contract case proved\n\
    absolute.adb:3:36: info: overflow check\nabsolute.adb:4:29: info: contract case\
    \ proved\nabsolute.adb:8:12: info: overflow proved\n\n## 3.4 调试失败的尝试\n\nGNATprove\
    \ 在验证程序时可能因为以下任一原因报告错误：\n- 程序中可能存在错误；\n- 属性可能按书写的方式无法证明，因为需要更多信息；\n- GNATprove\
    \ 的证明器可能无法证明一个完全有效的属性。\n\n我们在本节的剩余部分将讨论调试失败证明尝试这一棘手的任务。\n\n### 3.4.1 调试代码或规格中的错误\n\
    \n首先，让我们讨论程序中存在错误的情况。有两种可能：代码可能是错误的，或者同样，规格可能是错误的。例如，我们的 `Incr_Until` 程序中有一个错误，导致其\
    \ `Contract_Cases` 无法证明。\n\nListing 11: show_failed_proof_attempt.ads\n```ada\n\
    package Show_Failed_Proof_Attempt is\n  Incremented : Boolean := False;\n\n  procedure\
    \ Incr_Until (X : in Natural) with\n    Contract_Cases =\n      (Incremented =>\
    \ X'Old,\n       others => X'Old);\nend Show_Failed_Proof_Attempt;\n```\nListing\
    \ 12: show_failed_proof_attempt.adb\n```ada\npackage Show_Failed_Proof_Attempt\
    \ is\n  procedure Incr_Until (X : in Natural) is\n    begin\n      if X < 1000\
    \ then\n        X := X + 1;\n        Incremented := True;\n      else\n      \
    \  Incremented := False;\n      end if;\n    end Incr_Until;\nend Show_Failed_Proof_Attempt;\n\
    ```\n\n由于这是一个可以执行的断言，如果你在代表性的输入集上开启断言并运行子程序，它可能帮助你找到问题。这允许你发现代码及其合约中的错误。在这种情况下，使用大于\
    \ 1000 的输入测试 `Incr_Until` 会在运行时抛出异常。\n\nListing 13: show_failed_proof_attempt.ads\n\
    ```ada\npackage Show_Failed_Proof_Attempt is\n  Incremented : Boolean := False;\n\
    procedure Incr_Until (X : in out Natural) with\n  Contract_Cases =\n  (Incremented)\
    \ => X > X'Old,\n  others => X = X'Old;\nend Show_Failed_Proof_Attempt;\n```\n\
    Listing 14: show_failed_proof_attempt.adb\n```ada\npackage body Show_Failed_Proof_Attempt\
    \ is\n  procedure Incr_Until (X : in out Natural) is\n    begin\n      if X <\
    \ 1000 then\n        X := X + 1;\n        Incremented := True;\n      else\n \
    \       Incremented := False;\n      end if;\n    end Incr_Until;\nend Show_Failed_Proof_Attempt;\n\
    ```\nListing 15: main.adb\n```ada\nwith Show_Failed_Proof_Attempt;\nprocedure\
    \ Main is\n  Dummy : Integer;\nbegin\n  Dummy := 0;\n  Incr_Until(Dummy);\n  Dummy\
    \ := 100;\n  Incr_Until(Dummy);\nend Main;\n```\nProver output\nPhase 1 of 2:\
    \ generation of Global contracts ...\nPhase 2 of 2: flow analysis and proof ...\n\
    show_failed_proof_attempt.ads:3:29: info: contract case proved\nshow_failed_proof_attempt.ads:3:36:\
    \ info: overflow check\nshow_failed_proof_attempt.ads:4:29: info: contract case\
    \ proved\nshow_failed_proof_attempt.ads:8:12: info: overflow proved\n\n*(注：由于提供的原文文本中部分代码块存在重复和乱码，翻译时已根据逻辑进行了处理)*\n\
    \n"
