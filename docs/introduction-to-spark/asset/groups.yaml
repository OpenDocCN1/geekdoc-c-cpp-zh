- md: "\n# Introduction to SPARK\n\nLet's contrast this example with a different representation\
    \ of Global and Depends contracts, this using a single abstract state.\n\nListing\
    \ 14: stack.sacs\n\n```\npackage Stack with\nAbstract_State => The_Stack\nis\n\
    type Element is new Integer;\n\nprocedure Pop (E : out Element) with\n  Global\
    \ => (In Out => The_Stack),\n  Depends => ((The_Stack, E) => The_Stack);\nend\
    \ Stack;\n```\n\n# Prover output\n\n- Phase 1 of 2: generation of global contracts\n\
    - Phase 2 of 2: analysis of data and information flow\n\nHere, Top State and Content\
    \ State are merged into a single state abstraction, The_Stack. By doing so, we've\
    \ made the fact Content is not modified (though we're showing that Top may be\
    \ modified). This loss in precision is reasonable here, since it's the whole point\
    \ of abstraction. However, you must be careful not to aggregate state until these\
    \ contracts are becoming meaningless.\n\nEven imprecise contracts consider state\
    \ abstractions as a whole perfectly reasonable for users of a package, you should\
    \ write Global and Depends contracts that are as precise as possible within the\
    \ package body. To allow this, SPARK introduces the notion of refined contracts,\
    \ which are precise contracts specified on the bodies of subprograms where state\
    \ are visible but normal Global and Depends contracts refer directly to the state\
    \ of the package.\n\nWhen a subprogram is called inside the package body, you\
    \ should write refined contracts instead of the general ones so that verification\
    \ can be as precise as possible. However, refined Global and Depends are optional:\
    \ if you do not specify them, GNATprove will check the package implementation.\
    \ For our Stack example, we could add refined contracts as shown.\n\nListing 15:\
    \ stack.acs\n\n```\npackage Stack with\nAbstract_State => The_Stack\nis\ntype\
    \ Element is new Integer;\n\nprocedure Pop (E : out Element) with\n  Global =>\
    \ (In Out => The_Stack),\n  Depends => ((The_Stack, E) => The_Stack);\n\nprocedure\
    \ Push (E : Element) with\n  Global => (In Out => The_Stack),\n  Depends => ((The_Stack,\
    \ E) => The_Stack);\nend Stack;\n```\n\nListing 16: stack.adb\n\n```\npackage\
    \ body Stack with\nRefined_State => (The_Stack => (Content, Top))\nis\n  Max :\
    \ constant := 100;\n  type Element_Array is array (1 .. Max) of Element;\n  Content\
    \ : Element_Array := (others => 0);\n  Top : Natural range 0 .. Max := 0;\n\n\
    \  procedure Pop (E : out Element) with\n    Refined_Global => (Input => Content,\
    \ In Out => Top),\n    Refined_Depends => (Top => Top, E => (Content, Top)) is\n\
    \  begin\n    E := Content (Top);\n    Top := Top - 1;\n  end Pop;\n\n  procedure\
    \ Push (E : Element) with\n    Refined_Global => (In Out => (Content, Top)),\n\
    \    Refined_Depends => (Top => (Content, Top)) is\n  begin\n    Top := Top +\
    \ 1;\n    Content (Top) := E;\n  end Push;\nend Stack;\n```\n\n## ### Preconditions\
    \ and Postconditions\n\nWe mostly express functional properties of subprograms\
    \ with preconditions and postconditions. These are standard Boolean expressions,\
    \ so they cannot refer to state abstractions. To work around this restriction,\
    \ we can define functions to query the value of hidden variables. We then use\
    \ these functions in place to query the state abstraction in the contract of subprograms.\
    \ For example, we can query the state of stack with functions Is_Empty and Is_Full\
    \ and call them in the contracts of Pop and Push:\n\nListing 17: stack.ada\n\n\
    ```\npackage Stack is\n  type Element is new Integer;\n\n  function IsEmpty return\
    \ Boolean;\n  function IsFull return Boolean;\n\n  procedure Pop (E : out Element)\
    \ with\n    Pre => not Empty;\n    Post => not Is_Full;\n\n  procedure Push (E\
    \ : Element) with\n    Pre => not Is_Full;\n    Post => not Empty;\nend Stack;\n\
    ```\n\nListing 18: stack.adb\n\n```ada\npackage body Stack is\n  Max : constant\
    \ := 100;\n  type Element_Array is array (1 .. Max) of Element;\n  Content : Element_Array\
    \ := (others => 0);\n  Top : Natural range 0 .. Max := 0;\n\n  function IsEmpty\
    \ return Boolean is (Top = 0);\n  function IsFull return Boolean is (Top = Max);\n\
