    \ postcondition from show_\npostcondition_violation\n\nThe dynamics of checking\
    \ contracts extends beyond making testing easier. Early failure also allows an\
    \ easier recovery and facilitates debugging, so you might enable these checks\
    \ at runtime to prevent execution before damage or hard-to-debug action occur.\n\
    GNATprove analyzes predictions and postconditions. It verifies preconditions before\
    \ a subroutine is called, which is the runtime semantics of the subprogram. Postconditions,\
    \ on the other hand, are verified as part of the verification of the subprogram.\
    \ For example, GNATprove must wait until Increment is properly called to detect\
    \ the prediction violation, since a precondition is really a contract for the\
    \ caller. On the other hand, it doesn't need Absolute to be called to detect that\
    \ its postcondition holds for all its possible inputs.\n\n> Note: For more details\
    \ on preconditions and postconditions, see the SPAR User's Guide¹⁵.\n\n# 3.3.1\
    \ Executable Semantics\n\nExpressions in Ada have the same semantics as Boolean\
    \ elsewhere, so runtime errors can occur during their computation. To simplify\
    \ debugging of assertions and combining testing and verification, the same semantics\
    \ are used by GNATprove.\n\nWhile proving GNATprove verifies that no error can\
    \ be raised during the execution of the contracts, you may sometimes find those\
