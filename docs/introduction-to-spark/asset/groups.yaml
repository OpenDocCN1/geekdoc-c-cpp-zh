    \ 2 of 2: analysis of data and information flow ...\n\n> Note: For more details\
    \ on global contracts, see the SPARK User's Guide10.\n\n10 https://docs.adaore.com/live/wave/spark2014/html/spark2014_ug/en/source/subprogram_contracts.html#ndata-dependencies\n\
    \n# 2.3. Additional Verifications\n\n# Introduction to SPARK\n\n## 2.3.2 Depends\
    \ Contracts\n\nYou may also supply a contract for a subprogram to specify dependencies\
    \ between its inputs and outputs. These dependencies include not only global variables\
    \ as parameters and the function's result. When you supply a Depends contract\
    \ for a subprogram, flow analysis shows that it's correct and that is, for each\
    \ dependency, the variable depends on those listed and no others.\n\nFor example,\
    \ you may want to say that the value of each parameter of Swap, shown below, depends\
    \ only on the initial value of the parameter and the value of X after the return\
    \ of Set_X_Zero depends on global variables. If you indicate this by the comment,\
    \ as in other languages, GNATprove verify this is actually the case.\n\n```\n\
    package Show_Depends_Contracts is\n```\n\n```\ntype T is Integer;\n\nprocedure\
    \ Swap (X, Y : in out T);\n  The value of X (resp. Y) after the call depends only\n\
    \  -- on the value of Y (resp. X) before the call\n\nX : Natural;\n  procedure\
    \ Set_X_Zero;\n  -- The value of X after the call depends on no input\n\nprocedure\
    \ Show_Depends_Contracts;\n```\n\nLike Global, you specify a Depends contract\
    \ in subprogram declarations using an aspect. Its value is a list of one or more\
    \ dependency relations between the outputs and inputs of the subprogram. Each\
    \ relation is represented by two lists of variables separated by an arrow. The\
    \ left of each arrow are variables whose final value depends on the initial value\
    \ of the variables list on the right.\n\nFor example, we indicate that the final\
    \ value of each parameter of Swap depends only on the initial value of the other\
    \ parameter. If the subprogram is a function, we list it as an output, using the\
    \ Result attribute, as we do for Get_Value_Of_X.\n\nListing 8: show_depends_contracts.ads\n\
    \n```\npackage Show_Depends_Contracts is\ntype T is Integer;\nX, Y, Z : T := 0;\n\
    \nprocedure Swap (X, Y : in out T) with\n  Depends => (X = Y);\n  -- X depends\
    \ on the initial value of Y\n  Y := X;\n  -- Y depends on the initial value of\
    \ X\n\nfunction Get_Value_Of_X return T with\n  Depends => (Get_Value_Of_X.Result\
    \ => X);\n  -- result depends on the initial value of X\n\nprocedure Set_X_To_Plus_Z\
    \ with\n  Depends => (X = (Y, Z));\n  -- X depends on the initial values of Y\
    \ and Z\n\nprocedure Set_X_To_Plus_Y with\n  Depends => (X += Y);\n  -- X depends\
    \ on Y and X's initial value\n```\n\n(continued from previous page)\n\n```\nprocedure\
    \ Do_Nothing (X : T) with\n  Depends => (null == X);\n  -- no output is affected\
    \ by X\nprocedure Set_X_To_Zero with\n  Depends => (X == null);\n  -- X depends\
    \ on no input\nend Show_Dependents_Contracts;\n```\n\n# Prover output\n\n- Phase\
    \ 1 of 2: generation of Global contracts ...\n- Phase 2 of 2: analysis of data\
    \ and information flow\n\nOften, the final value of a variable depends on its\
    \ initial value. You can specify this in a concise way using the = character,\
    \ as indicated in the specification of Set_X_To_Plus_Y above. If there are more\
    \ than one variable on the left of the arrow, a means each depends on itself,\
    \ not that they all depend on each other. You can write the corresponding dependency\
    \ with (=) or without (=) whitespace.\n\nIf you have a program whose input isn't\
    \ used to compute the final value of any output, you can express that by writing\
    \ null on the left of the dependency relation, as we did for the Do_Nothing subgraph\
    \ program. You can only write one such dependency relation, which lists all inputs\
    \ and it must be written once. Such an annotation also flows analysis' warning\
    \ about unused parameters. You can also write null on the right of a dependency\
    \ relation to indicate that output doesn't depend on any input. We do that for\
    \ the procedure Set_X_To_Zero.\n\n> Note: For more details on global contracts,\
    \ see the SPARK User's Guide.\n\n# 2.4. Shortcomings\n\n## 2.4.1 Modularity\n\n\
    Flow analysis is sound, meaning if it doesn't output a message, you can be assured\
    \ that none can occur in that code. The first and most common reason for this\
    \ is modularity. To scale to large projects, verification is generally done on\
    \ a per-subprogram basis, including detection of uninitialized variables.\n\n\
    Listing 9: set_x_to_plus_z.adb\n\n```\nprocedure Set_X_To_Plus_Z\n  (Y, Z : Natural;\n\
    \   X : out Natural;\n   Overflow : out Boolean)\n  is\nbegin\n  if Z < Y then\n\
    \    Overflow := True; -- X should be initialized on every path\n  else\n    Overflow\
    \ := False;\n    X := Y + Z;\n  end if;\nend\nSet_X_To_Plus_Z;\n```\n\n# Prover\
    \ output\n\nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: analysis\
    \ of data and information flow\nset_x_to_plus_z.adb:3:4 medium: \"X\" might not\
    \ be initialized\ngatprove: unproven messages\n\n## 2.4.2 Composite Types\n\n\
    Another common cause of false alarms is caused by the flow analysis handles composite\
    \ types. Let's start with arrays.\n\nFlow analysis enters an array as single object\
    \ instead of one object per element, so it modifying a single element to be a\
    \ modification of the array as a whole. Obviously, this makes reasoning about\
    \ global variables access less precise and hence the dependencies of these variables\
    \ are less precise. This also affects the ability to accurately detect reads of\
    \ uninitialized data.\n\nIt's sometimes impossible for flow analysis to determine\
    \ if an entire array has been initialized. For example, if we write code to initialize\
    \ every element of an unconstrained array A in chunks, we might still receive\
    \ a message from flow analysis claiming the array is not initialized. To resolve\
    \ this, either use a simpler loop over the full range of the array, or (even better)\
    \ an aggregate assignment, or if not possible, verify initialization of the object\
    \ manually.\n\nListing 10: show_composite_types_shortcoming.ads\n\n```\npackage\
    \ Show_Composite_Types_Shortcoming is\n\n  type T is array (Natural range) of\
    \ Integer;\n\n  procedure Init_Chunks (A : out T);\n  procedure Init_Loop (A :\
    \ out T);\n  procedure Init_Aggregate (A : out T);\n\nend Show_Composite_Types_Shortcoming;\n\
    ```\n"
