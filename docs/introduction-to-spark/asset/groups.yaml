    \ 和契约都是可选的，但 GNATPro 使用它们的数据进行部分分析。如果流分析无法在不知道访问变量的情况下从变量检测契约，它需要分析并检查你为子程序以及该子程序的调用者编写的契约。由于每个子程序的流契约依赖于内部所有子程序的契约，计算可能会非常耗时。因此，流分析有时会权衡这种计算的精度与所需的时间。对于依赖契约，流分析简单地假设最坏情况，即每个子程序的输出取决于该子程序的所有输入。在这种假设下，当默认契约不够精确时，你必须编写子契约。你可能还需要提供\
