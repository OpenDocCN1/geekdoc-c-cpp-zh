    \ SPARK 中，循环不变式是在循环的每次迭代中都成立的布尔表达式。和其他断言一样，你可以在通过带有断言编译程序时在运行时检查它。\n\n循环不变式与其他断言的主要区别在于它被用于证明。GNATprove\
    \ 分两个步骤执行循环不变式的证明：首先，它检查其在循环的第一次迭代中是否成立，然后检查在假设上一次迭代中成立的情况下，在任意迭代中是否成立。这被称为归纳法24。\n\
    \n24 https://en.wikipedia.org/wiki/Mathematical_induction\n\n"
