  md: "# Introduction to SPARK\n\nA. I. Our invariant states that the element at each\
    \ index less than K has been modified in the expected way. We use the Loop_Entry\
    \ attribute to refer to the value of A on entry of the loop instead of using A.\
    \ I.\n\nDoes our loop invariant have the four properties of a loop-invariant?\
    \ When GNAT-prove, we see that INIT is fulfilled: the invariant's initialization\
    \ is provided. So are INSIDE AND AFTER: no runtime errors are reported and the\
    \ assertion following the loop is successfully verified.\n\nThe situation is slightly\
    \ more complex for the PRESERVE property. GNAT manages to prove that the invariant\
    \ holds after the first iteration thanks to the automatic generation of frame\
    \ conditions. It was able to do this because it completes the loop invariant with\
    \ the following frame condition stating that the array hasn't been modified so:\n\
    \n```\npragma Loop Invariant\nfor all J in .. Last = A (J) = (if J > K then Loop_Entry\
    \ (J));\n```\n\nGNAT proves that those and the internally-generated invariants\
    \ to prove PRESERVE. However, in more complex cases, the heuristics used by GNATprove\
    \ to generate the frame condition might not be sufficient and you might have to\
    \ provide a loop invariant. For example, consider a version of Map where the result\
    \ of applying F to element at index K is stored at index K-1:\n\nListing 32: show_map.ads\n\
    \n```\npackage Show_Map is\ntype Nat is (Positive range <>) of Natural;\n\nfunction\
    \ F (V : Natural) return Natural is\nif (V /= Last then V + 1 else V);\n\nprocedure\
    \ Map (A : in out Nat Array);\n\nend Show_Map;\n```\n\nListing 33: show_map.adb\n\
    \n```\npackage body Show_Map is\nprocedure Map (A : in out Nat Array) is\n  _I\
    \ : constant Nat Array := With Ghost;\nbegin\nfor K in A'Range loop\nif K /= A'First\
    \ then _I := F (K);\nend if;\npragma Loop Invariant\nfor all J in A'First then\
    \ A (J - 1) = F (A'Loop_Entry (J));\npragma Loop Invariant\nfor all J in K ..\
    \ Last = A (J) = A'Loop_Entry (J));\nend loop;\npragma Assert (for all K in A'Range\
    \ =>\n(if K /= A'First then A (K - 1) = F (_I (K))));\nend Map;\n\nend Show_Map;\n\
    ```\n\n# Prover output\n\nPhase 1 of 2: generation of Global contracts ...nPhase\
