  md: "# Introduction to SPARK\n\nSimilarly to how it analyzes a subprogram's precondition,\
    \ GNATprove verifies the Contract_Cases only once. It verifies the validity of\
    \ each consequence (given the truth of its guard) and the disjointness and completeness\
    \ of the guard conditions (meaning that exactly one must be true for each possible\
    \ set of input values).\n\n**Note:** For more details on Contract_Cases, see the\
    \ SPARK User's Guide¹¹⁸.\n\n# 3.4 Debugging Failed Proof Attempts\n\nGNATprove\
    \ may report an error while verifying a program for any of the following reasons:\n\
    \n+   - there might be an error in the program;\n- the property may not be provable\
    \ as written because more information is required; or\n- the prover by GNATprove\
    \ may be unable to prove a perfectly valid property.\n\nWe spend the remainder\
    \ of this section discussing the somewhat tricky task of debugging failed proof\
    \ attempts.\n\n# 3.4.1 Debugging Errors in Code or Specification\n\nFirst, let's\
    \ discuss the case where there's an error in the program. There are two possibilities:\
    \ the code may be incorrect, or equally, the specification may be incorrect. As\
    \ an example, there's an error in our procedure Incr_Until until its Contract_Cases\
    \ unprovable.\n\nListing 11: show_failed_proof_attempt.ads\n\n```\npackage Show_Failed_Proof_Attempt\
    \ is\n  Incremented : Boolean := False;\n\n  procedure Incr_Until (X : in Natural)\
    \ with\n    Contract_Cases =\n      (Incremented => X > X'Old,\n       others\
    \ => X = X'Old);\nend Show_Failed_Proof_Attempt;\n```\n\nListing 12: show_failed_proof_attempt.adb\n\
    \n```\npackage Show_Failed_Proof_Attempt is\n  procedure Incr_Until (X : in Natural)\
    \ is\n    begin\n      if X < 1000 then\n        X := X + 1;\n        Incremented\
    \ := True;\n      else\n        Incremented := False;\n      end if;\n    end\
    \ Incr_Until;\nend Show_Failed_Proof_Attempt;\n```\n\n> ¹⁸ https://docs.amadore.com/live/wave/spark2014/html/spark2014_ug/en/source/subprogram_contracts.html#contract-cases"
