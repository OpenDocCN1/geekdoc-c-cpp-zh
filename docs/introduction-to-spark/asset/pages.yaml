    \ \"Max\" might not be initialized\nshow_uninitialized.adb:11:14: medium: \"Max\"\
    \ might not be initialized\ngnatprove: unproved check messages considered as errors\n\
    \n> Note: For details on how flow analysis verifies data initialization, see the\
    \ SPARK User's Guide9.\n\n# 2.2.2 Ineffective Statements\n\nIneffective statements\
    \ are different from dead code: they are executed, and often even modify the value\
    \ of variables, but have no effect on any of the subprogram's visible outputs:\
    \ parameters, global variables or the function result. Ineffective statements\
    \ should be avoided because they make the code less readable and difficult to\
    \ maintain.\n\nMore importantly, they're often caused by errors in the program:\
    \ the statement may have been written for some purpose, but not that purpose.\
    \ These kinds of errors can be difficult to detect in others.\n\nFor the examples,\
    \ Swap1 and Swap2 shown do not properly swap their two parameters X and Y. This\
    \ error caused a statement to be ineffective. That ineffective statement is not\
    \ an error in itself, but flow analysis produces a warning since it can be indicative\
    \ of an error, as it is here.\n\nListing 3: show_ineffective_statements.adb\n\n\
    ```\npackage Show_Ineffective_Statements is\n\n  type T is Integer; (continues\
    \ on next page)\n```\n\n> 9 https://docs.adacore.com/live/wave/spark2014/html/spark2014_ug/en/source/language_restrictions.html#ndata-initialization-policy\n\
    \n*\n\nChapter 2. Flow Analysis"
