  md: "# 5.3.2 Ghost Procedures\n\nGhost procedures can't affect the value of normal\
    \ variables, so they're mostly used to perform operations on ghost variables or\
    \ group together a of intermediate assertions.\n\nAbstracting the treatment of\
    \ assertions and ghost variables inside a ghost procedure has several advantages.\
    \ First, you're allowed to use these variables in any way you choose in code inside\
    \ ghost procedures. This isn't the case outside ghost procedures, where the only\
    \ ghost statements allowed are ghost variables and cast to ghost procedures.\n\
    \nAs an example, the for loop contained in Increase_A couldn't appear by itself\
    \ in normal code.\n\nList 22: show_ghost_Proc.adcs\n\n```\npackage Show_Ghost_Proc\
    \ is\n  type Nat_Array is array (Integer range) of Natural;\n  A : Nat_Array (1\
    \ .. 100) with Ghost;\n  procedure Increase_A with\n    Ghost;\n    Pre := (for\
    \ all I in A'Range => A (I) < Natural'Last);\n  end Show_Ghost_Proc;\n```\n\n\
    List 23: show_ghost_proc.adb\n\n```\npackage Show_Ghost_Proc is\n  procedure Increase_A\
    \ is\n    begin\n      for I in A'Range loop\n        A (I) := A (I) + 1;\n  \
    \    end loop;\n    end Increase_A;\nend Show_Ghost_Proc;\n```\n\n# Prove output\n\
    \nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis\
    \ and proof ...\nshow_ghost_proc.adb:625: info: overflow checked\n\nUsing the\
    \ abstraction to improve readability by hiding complex code that isn't part of\
    \ the functional behavior of the subgraph. It can help GNAT prove by abstracting\
    \ assertions that would otherwise make its job more complex.\n\nIn the example\
    \ below, calling Prove_P with X as an operand only adds P (X) to the post context\
    \ instead of the larger set of assertions required to verify it. In addition,\
    \ the post of P only needs to be done once and maybe made easier without having\
    \ any unnecessary information in its post context verifying it. Also, GNAT can't\
    \ fully verify Prove_P, you can review the remaining assumptions unless they're\
    \ in a smaller context.\n\n```\nprocedure Prove_P (X : T) with Ghost,\nGlobal\
    \ => null,\nPost => P (X);\n```\n\n# 5.3. Guide Proof"
