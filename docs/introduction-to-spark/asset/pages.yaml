  md: "# STATE ABSTRACTION\n\nAbstraction is a key concept in programming that can\
    \ drastically simplify both the implementation and maintenance of code. It's particularly\
    \ well suited to SPARK and its modular analysis. This section explains what state\
    \ abstraction is and how you use it in SPARK. We explain how it impacts GNAT's\
    \ analysis both in terms of information flow and proof of program properties.\n\
    \nState abstraction allows us to:\n\n+   • dependencies that wouldn't be expressible\
    \ because some data's read or written isn't visible at the point where a subprogram\
    \ is declared — examples are dependencies on data, for which we use the Global\
    \ contract, and on flow, for which we use the Depends contract.\n• reduce the\
    \ number of variables that need to be considered in flow analysis and proof, reduction\
    \ which may be critical in order to scale the analysis to programs with thousands\
    \ of variables.\n\n# 4.1 What's an Abstraction?\n\nAbstraction is an important\
    \ part of programming language design. It provides two views of the same object:\
    \ an abstract and a refined one. The abstract one — usually called specification\
    \ — describes what the object does in a coarse way. A subprogram's specification\
    \ usually describes how it should be called (e.g., parameter information such\
    \ as how many and what types) as well as what it does (e.g., returns a result\
    \ or modifies one or more of its parameters).\n\nContract-based programming, as\
    \ supported in Ada, allows contracts to be added to a subprogram's specification.\
    \ You use contracts to describe the subprogram's behavior in a more fine-grained\
    \ manner, but all the details of how the subprogram actually works are left to\
    \ its refined view, its implementation.\n\nTake a look at the example code shown.\n\
    \nListing 1: increase.ads\n\n```\nprocedure Increase (X : in out Integer) with\n\
    \  Global => null;\n  Pre => X < 100;\n  Post => X'Old < X;\n```\n\nListing 2:\
    \ increase.ads\n\n```\nprocedure Increase (X : in out Integer) is\n  begin\n \
    \   X := X + 1;\n  end Increase;\n```\n\nProver output"
