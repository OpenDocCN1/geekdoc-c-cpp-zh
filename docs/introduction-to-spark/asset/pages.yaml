    \ complex properties.\n\n# ## 5.1 Beyond Program Integrity\n\nWhen we speak about\
    \ the correctness of a program or subprogram, we mean the extent to which it complies\
    \ with its specification. Functional correctness is specifically concerned with\
    \ properties that involve the relations between the subprogram's inputs and outputs,\
    \ as opposed to other properties such as running time or memory consumption.\n\
    \nFor functional correctness, we usually specify stronger properties than those\
    \ required to prove program integrity. When we're involved in a certification\
    \ processes, we should derive these properties from the requirements of the system,\
    \ but especially in non-certification contexts, they may also come from informal\
    \ sources, such as the program's documentation, comments in its code, or test\
    \ cases.\n\nFor example, if one of our goals is to ensure that no runtime error\
    \ is raised using the result of the function Find below, it may be enough to know\
    \ that the result is either E or in the range of A. We can express this as a postcondition\
    \ of Find.\n\nListing 1: show_find.ads\n\n```\npackage Show_Find is\n  type NatArray\
