  md: "# Introduction to SPARK\n\nSecond, the loop invariant should be precise enough\
    \ to outline GNATprove to prove absence of runtime errors in both statements that\
    \ concern the loop's body (INSIDE) and those following the loop (AFTER). To do\
    \ this, you should state that all information concerning a modified in the loop\
    \ that's not included in the invariant is forgotten by GNATprove. In particular,\
    \ you should take care to include in your invariant what is usually called the\
    \ loop frame, which lists properties of variables that are true throughout the\
    \ execution of the loop even though those variables are modified by the loop.\n\
    \nFinally, the loop invariant should be precise enough to prove that it' preserved\
    \ throughout successive iterations of the loop (PRESERVE). This is generally the\
    \ trickiest part. To understand why GNATprove hasn't been able to verify the preservation\
    \ of a loop invariant, you may find it useful to repeat assertions about the loop's\
    \ body to which point it can no longer be proved.\n\nAs an example, let's look\
    \ at a loop that iterates through an array A and applies a function F to each\
