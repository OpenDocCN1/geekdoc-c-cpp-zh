  md: "# 4.6 Representing Private Variables\n\nYou can refine state abstractions in\
    \ the package body, where all the variables are visible. When only the package's\
    \ specification is available, you need a way to specify which state abstraction\
    \ each variable belongs to. You do this by adding the Part_Of aspect to the variable's\
    \ declaration.\nPart_Of annotations are mandatory: if you give a package an abstract\
    \ state annotation, you must link all the hidden variables defined in its part\
    \ to a state abstraction. For example:\n\nListing 7: stack.ads\n\n```\npackage\
    \ Stack with\n  Abstract_State => The_Stack\nis\n  type Element is Integer;\n\
    \  procedure Pop (E : out Element);\n  procedure Push (E : Element);\n  private\n\
    \    Max : constant = 100;\n    type Element_Array is (1 .. Max) of Element;\n\
    \    Content : Element Array with Part_Of = The Stack;\n    Top : Natural range\
    \ 0 .. Max with Part_Of = The Stack;\nend Stack;\n```\n\n# Private output\n\n\
    > Phase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: analysis of\
    \ data and information flow ...\n\nSince we chose to define Content and Top in\
    \ Stack's private part instead of its body, we had to add a Part_Of aspect to\
    \ both of their declarations, associating them with the state abstraction The\
    \ Stack, even though it's the only state abstraction. However, we still need to\
    \ list them in the Refined_State aspect in Stack's body.\n\n```\npackage body\
    \ Stack with\n  Refined_State => (The_Stack => (Content, Top))\n```\n\n# 4.7 Additional\
    \ State\n\n# 4.7.1 Nested Packages\n\nSo far, we only discussed hidden variables.\
    \ But variables aren't the only aspect of a package's state. If a package P contains\
    \ a nested state, the nested package's state is also part of P's state. If the\
    \ nested package is hidden, state is part of P's hidden state and must be listed\
    \ in P's state refinement.\n\nWe see this in the example below, where the package\
    \ Hidden_Nested's hidden state is part of P's hidden state.\n\n# 4.6. Representing\
    \ Private Variables"
