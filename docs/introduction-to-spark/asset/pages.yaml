  md: "# Introduction to SPARK\n\nits parameters are aliased.\nAliasing can occur\
    \ as part of the parameter that occurs in a subprogram call. aliasing of parameters\
    \ in function calls is not problematic; we need only consider procedure calls.\
    \ When a procedure is called, SPARK verifies that it is out or in parameter is\
    \ aliased with another parameter of the procedure or a global variable modified\
    \ in the procedure's body.\n\nProcedure Move_To is an example where the possibility\
    \ of aliasing wasn't taken into account by the programmer:\n\nListing 7: no_aliasing.adb\n\
    \n```\nprocedure No_Aliasing is\n  Total : Natural := 0;\n\nprocedure Move_To_Total\
    \ (Source : in out Natural)\n  with Post => Total = Total'Old + Source'Old and\
    \ Source = 0\n  begin\n    Total := Total + Source;\n    Source := Total;\n  end\
    \ Move_To_Total;\n\nX : Natural := 3;\n\nbegin\n  Move_To_Total (X);\n  pragma\
    \ Assf (Total = 3); -- OK\n  pragma Assf (Total = 0); -- flow analysis error\n\
    \  pragma Assf (Total = 6); -- runtime error\n  No_Aliasing;\n```\n\n# Prover\
    \ output\n\nPhase 1 of 2: generation of contracts ...\nPhase 2 of 2: analysis\
    \ of data and information flow ...\nno_aliasing.adb:18:19: high formal parameter\
    \ \"Source\" and global \"Total\" are aliased (SPARK RM 6.4.2)\ng证明: unproved\
    \ check messages considered as errors\n\n# Runtime output\n\nraised ADA.ASSERTIONS.ASSERTION_ERROR\
    \ : no_aliasing.adb:19\nMove_To_Total adds the value of its input parameter Source\
    \ to the global variable Total and resets Source to 0. The programmer has clearly\
    \ taken into account the possibility of aliasing between Total and Source. (This\
    \ sort of error is common)\n\nThis procedure is valid SPARK. When doing verification,\
    \ GNATProve proves this assumption because GNATProve checks for possible aliasing\
    \ on every call to Move_To_Total. Its final call in procedure No_Aliasing violates\
    \ this assumption, which produces a message from GNATProve and a runtime error\
    \ (assertion violation contradicting the expected change in Total from calling\
    \ Move_To_Total). Note that the postcondition of Move_To_Total is not violated\
    \ in this second instance since integer pointer is used and the postcondition\
    \ is checked before the copy-back from the formal parameters to the actual argument.\n\
    \nAliasing can also occur as result of using access types (pointers) in Ada. These\
    \ are restricted in SPARK so that only benign aliasing is allowed, when both names\
    \ are used to read the data.\n\n> 6 https://en.wikipedia.org/wiki/Pointer_(computer_programming)"
