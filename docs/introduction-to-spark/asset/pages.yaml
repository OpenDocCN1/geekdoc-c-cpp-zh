    # 4.8 Subprogram Contracts


    # 4.8.1 Global and Depends


    Hidden variables can only be accessed through subprogram calls, so you document
    how state abstractions are modified during the program''s execution via the contracts
    of those subprograms. You use Global and Depends contracts to specify which of
    the state abstractions are used by a subprogram and how flow through the different
    variables. The contracts that you write when referring to state abstractions are
    often less precise than contracts referring to visible variables since the possible
    dependencies of the hidden variables within a state abstraction are collapsed
    into a single dependency.

    Let''s add Global and Depends contracts the Pop procedure in our stack.


    Listing 13: stack.ads


    ```

    1 package Stack with

    2 Abstract_State => (Top_State, Content_State)

    3 is

    4 type Element is new Integer;

    5

    6 procedure Pop (E : out Element) with

    7 Global (=> Content State,

    8 In Out => Top_State),

    9 Depends => (Top_State => Top_State),

    10 E => (Content_State, Top_State));

    11

    12 end Stack;

    ```


    # Prover output


    ```

    Phase 1 of 2: generation of Global contracts ...nPhase 2 of 2: analysis of data
    and information flow ...

    ```


    In this example, the Pop procedure only modifies the value of the hidden variable
    Top, while Content is unchanged. By using distinct state abstractions for the
    two variables, we''re able to preserve this semantic in the code.


