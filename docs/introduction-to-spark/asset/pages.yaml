  md: "# Introduction to SPARK\n\n# 2.3.2 Depends Contracts\n\nYou may also supply\
    \ a contract for a subprogram to specify dependencies between its inputs and outputs.\
    \ These dependencies include not only global variables as parameters and the function's\
    \ result. When you supply a Depends contract for a subprogram, flow analysis shows\
    \ that it's correct and that is, for each dependency, the variable depends on\
    \ those listed and no others.\n\nFor example, you may want to say that the value\
    \ of each parameter of Swap, shown below, depends only on the initial value of\
    \ the parameter and the value of X after the return of Set_X_Zero depends on global\
    \ variables. If you indicate this by the comment, as in other languages, GNATprove\
    \ verify this is actually the case.\n\n```\npackage Show_Depends_Contracts is\n\
    ```\n\n```\ntype T is Integer;\n\nprocedure Swap (X, Y : in out T);\n  The value\
    \ of X (resp. Y) after the call depends only\n  -- on the value of Y (resp. X)\
    \ before the call\n\nX : Natural;\n  procedure Set_X_Zero;\n  -- The value of\
    \ X after the call depends on no input\n\nprocedure Show_Depends_Contracts;\n\
    ```\n\nLike Global, you specify a Depends contract in subprogram declarations\
    \ using an aspect. Its value is a list of one or more dependency relations between\
    \ the outputs and inputs of the subprogram. Each relation is represented as two\
    \ lists of variables separated by an arrow. The left of each arrow are variables\
    \ whose final value depends on the initial value of the variables list on the\
    \ right.\n\nFor example, we indicate that the final value of each parameter of\
    \ Swap depends only on the initial value of the other parameter. If the subprogram\
    \ is a function, we list it as an output, using the Result attribute, as we do\
    \ for Get_Value_Of_X.\n\nListing 8: show_depends_contracts.ads\n\n```\npackage\
    \ Show_Depends_Contracts is\ntype T is Integer;\nX, Y, Z : T := 0;\n\nprocedure\
    \ Swap (X, Y : in out T) with\n  Depends => (X = Y);\n  -- X depends on the initial\
    \ value of Y\n  Y := X;\n  -- Y depends on the initial value of X\n\nfunction\
    \ Get_Value_Of_X return T with\n  Depends => (Get_Value_Of_X.Result => X);\n \
    \ -- result depends on the initial value of X\n\nprocedure Set_X_To_Plus_Z with\n\
    \  Depends => (X = (Y, Z));\n  -- X depends on the initial values of Y and Z\n\
    \nprocedure Set_X_To_Plus_Y with\n  Depends => (X += Y);\n  -- X depends on Y\
    \ and X's initial value\n```"
