    Just like saw for Pop and Depends contracts, you might often find it to have a
    more precise view of functions in the context where the hidden variables are visible.
    You can do this using exception functions in the same way we did for contracts
    GNAT Is_Empty and Is_Full above. As exception function, bodies act as contracts
    for GNATprove, so they automatically generate a more precise view of the contracts
    when their implementation is visible.


    You may need often more constraining contract to verify the package''s implementation
    but to be less strict outside the assertion. You do this using the Refined Post
    aspect. This aspect, when placed on a subgraph''s body, provides stronger guarantees
    to internal callers of a subgraph. If you define one, the refined postcondition
    must imply the postcondition. This is checked by GNATprove, which reports a failing
    postcondition if the refined postcondition is too weak, even if it''s actually
    implied by the subgraph''s body. SPARK does not perform a similar verification
    for normal preconditions.


