  md: "# 2.4.3 Value Dependency\n\nFlow analysis is not value-dependent: it never\
    \ reasons about the values of expressions, only whether they have been set to\
    \ some value or not. As a consequence, some execution path in a subprogram is\
    \ impossible, but the impossibility can only be determined by looking at the values\
    \ of expressions, flow analysis still considers that feasible and may emit messages\
    \ based on it believing execution along such a path is possible.\n\nFor example,\
    \ the use of Absolute_Value below, flow analysis computes that R is uninitialized\
    \ on a path that enters neither of the two conditional statements. Because it\
    \ doesn't consider the values of expressions, not that such a path is impossible.\n\
    \nListing 16: absolute_value.adb\n\n```\nprocedure Absolute_Value\n  X : Integer;\n\
    \  R : out Natural\nbegin\n  if X < 0 then\n    R := -X;\n  end if;\n  if X !=\
    \ 0 then\n    R := X;\n  end if;\n  -- flow analysis doesn't know that R is initialized\n\
    end Absolute_Value;\n```\n\n# Prover output\n\nPhase 1 of 2: generation of Global\
    \ contracts ...\nPhase 2 of 2: analysis of data and information flow ...\nabsolute_value.adb:3:04\
    \ medium: \"R\" might not be initialized in \"Absolute Value\"\ngnatprove: unproved\
    \ check messages considered as errors\n\nTo avoid this problem, you should make\
    \ the control flow explicit, in this second version of Absolute_Value:"
