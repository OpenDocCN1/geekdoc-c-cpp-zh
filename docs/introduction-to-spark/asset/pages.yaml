  md: "# Introduction to SPARK\n\n# 3.3 Contracts\n\nAda contracts are perfectly suited\
    \ for formal verification, but are primarily designed to be checked at runtime.\
    \ If you specify the -gnata switch, the compiler generates code that verifies\
    \ the contracts at runtime. If an Ada contract is not satisfied for a given subprogram\
    \ call, the program raises an Assertion exception. This switch is particularly\
    \ useful during development and testing, but you may also disable run-time execution\
    \ of assertions, and specifically contracts, during the program's deployment to\
    \ avoid overhead.\n\nConsider the incorrect call to Increment, which violates\
    \ its precondition. One way to detect this error is by compiling the function\
    \ with assertions and testing it with inputs that trigger the violation. Another\
    \ way, that doesn't require the needed inputs, is to run GNAT.\n\nListing 6: show_precondition_violation.adb\n\
    \n```\nprocedure Show_Precondition_Violation is\n  procedure Increment (X : in\
    \ Integer) with\n    Pre => X < Integer'Last is\n  begin\n    X := X + 1;\n  end;\n\
    \n  X : Integer;\n  begin\n    X := Integer'Last;\n    Increment(X);\n  end Show_Precondition_Violation;\n\
    ```\n\n# Runtime output\n\nPhase 1 of 2: generation of Global contracts...\nPhase\
    \ 2 of 2: flow analysis and proof...\nhow_precondition.violation.adb:13:04 medium:\
    \ precondition might fail, cannot,\\ prove X < Integer'Last\ngnat: unproved check\
    \ messages considered as errors\n\nSimilarly, consider the incorrect implementation\
    \ of function Absolute, which violates its precondition. Likewise, one way to\
    \ detect this error is by compiling the function with assertions enabled and testing\
    \ it with inputs that trigger the violation. Another way, which again doesn't\
    \ require the inputs needed to demonstrate the error, is to run GNAT.\n\nListing\
    \ 7: show_postcondition_violation.adb\n\n```\nprocedure Show_Postcondition_Violation\
    \ is\n  procedure Absolute (X : in Integer) with\n    Post => X >= 0 is\n  begin\n\
    \    if X < 0 then\n      X := -X;\n    end if;\n  end Absolute;\n```\n\n(continues\
    \ on next page)"
