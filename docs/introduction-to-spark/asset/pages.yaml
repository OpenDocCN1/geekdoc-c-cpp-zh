  md: "# Introduction to SPARK\n\n(continued from previous page)\n\n```\nprocedure\
    \ Do_Nothing (X : T) with\n  Depends => (null == X);\n  -- no output is affected\
    \ by X\nprocedure Set_X_To_Zero with\n  Depends => (X == null);\n  -- X depends\
    \ on no input\nend Show_Dependents_Contracts;\n```\n\n# Prover output\n\n+   -\
    \ Phase 1 of 2: generation of Global contracts ...\n- Phase 2 of 2: analysis of\
    \ data and information flow\n\nOften, the final value of a variable depends on\
    \ its initial value. You can specify this in a concise way using the = character,\
    \ as indicated in the specification of Set_X_To_Plus_Y above. If there are more\
    \ than one variable on the left of the arrow, a means each depends on itself,\
    \ not that they all depend on each other. You can write the corresponding dependency\
    \ with (=) or without (=) whitespace.\n\nIf you have a program whose input isn't\
    \ used to compute the final value of any output, you can express that by writing\
    \ null on the left of the dependency relation, as we did for the Do_Nothing subgraph\
    \ program. You can only write one such dependency relation, which lists all inputs\
    \ and it must be written once. Such an annotation also flows analysis' warning\
    \ about unused parameters. You can also write null on the right of a dependency\
    \ relation to indicate that output doesn't depend on any input. We do that for\
    \ the procedure Set_X_To_Zero.\n\n> Note: For more details on depends contracts,\
    \ see the SPARK User's Guide¹.\n\n# 2.4 Shortcomings\n\n# 2.4.1 Modularity\n\n\
    Flow analysis is sound, meaning if it doesn't output a message on some analyzed\
    \ SPARK code, you can be assured that none of the errors it tests for can occur\
    \ in that code. On the other hand, flow analysis often issues messages when there\
    \ are, in fact, no errors. The first and probably most common reason for this\
    \ is modularity.\n\nTo scale flow to large projects, verification is generally\
    \ done on a per-subprogram basis, including detection of uninitialized variables.\
    \ To analyze this modularly, flow analysis needs to assume the initialization\
    \ of inputs on subgraph entry and modification of outputs during program execution.\
    \ Therefore, each time a subgraph is called, flow analysis checks that global\
    \ and parameter inputs are initialized each time a subgraph returns, it checks\
    \ that global and parameter outputs were modified.\n\nThis can produce error messages\
    \ on perfectly correct subprograms. An example is Set_X_To_Y_Plus_Z below, which\
    \ only sets its output X when Overflow is False.\n\n¹ https://docs.adaore.com/live/wave/spark2014/html/spark2014_ug/en/source/subprogram_contracts.html#flow-dependencies\n\
    \n# 2.4. Shortcomings"
