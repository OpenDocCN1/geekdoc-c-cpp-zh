  md: "# Introduction to SPARK\n\n# 5.3.3 Handling of Loops\n\nWhen the program involves\
    \ a loop, you're always required to provide additional annotations to allow GNATprove\
    \ to complete a proof because the verification techniques used by GNATprove do\
    \ not handle cycles in a subprogram's control flow. Instead, loops are flattened\
    \ by dividing them into several acyclic parts.\n\nAs an example, let's look at\
    \ a simple loop with an exit condition.\n\n```\nStmt1;\nloop\nStmt2;\nexit when\
    \ Cond;\nStmt3;\nend loop;\nStmt4;\n```\n\nAs shown below, the control flow is\
    \ divided into three parts.\n\n![](img/f1e490d8090325782c7af40c77e8a99e_116_0.png)\n\
    \nThe first, in yellow, starts earlier in the subprogram and enters the loop statement.\
    \ The loop itself is divided into two parts. Red represents a complete execution\
    \ of the loop's body: an execution where the exit condition is not satisfied.\
    \ Blue represents the last execution of the loop, which includes some of the subprogram\
    \ following it. For that path, the exit condition is assumed to hold. The red\
    \ and blue parts are executed after the yellow one.\n\nGNATprove analyzes these\
    \ parts independently since it doesn't have a way to track how variables have\
    \ been updated by an iteration of the loop. It forgets it knows about those variables\
    \ from one part when entering another part. However, values of constants and variables\
    \ that aren't modified in the loop are not an issue.\n\nIn other words, handling\
    \ loops in ways that makes GNATprove imprecise when verifying a subprogram involving\
    \ a loop: it can't verify a property that relies on values modified inside the\
    \ loop. It won't get any information about the value of constants or unmodified\
    \ variables, but it nevertheless not be able to deduce new information about them\
    \ from the loop.\n\nFor example, consider the function Find which returns the\
    \ array A and searches for an element E is stored in A.\n\n> Listing 24: show_find.ads\n\
    \n```\npackage Show_Find is\n  type Nat_Array is array (Positive range <>) of\
    \ Natural;\n  function Find (A : Nat_Array; E : Natural) return Natural;\n  end\
    \ Show_Find;\n```"
