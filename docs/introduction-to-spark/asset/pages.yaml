  md: "# Introduction to SPARK\n\nListing 9: set_x_to_y_plus_z.adb\n\n```\nprocedure\
    \ Set_X_To_Y_Plus_Z\n  (Y, Z : Natural;\n   X : out Natural;\n   Overflow : out\
    \ Boolean)\n  is\nbegin\n  if Last - Z < Y then\n    Overflow := True; -- X should\
    \ be initialized on every path\n  else\n    Overflow := False;\n    X := Y + Z;\n\
    \  end if;\nend\nSet_X_To_Y_Plus_Z;\n```\n\n# Primer output\n\nPhase 1-2: generation\
    \ of Global contracts ...\nPhase 2 of: analysis of data and information flow ...\n\
    set_x_to_y_plus_z.adb:3:4 medium: \"X\" might not be initialized in \"Set_X_To_Y_Plus\"\
    \ngatprove: unproven messages considered as errors\n\nThe message means that flow\
    \ analysis wasn't able to prevent the program from running uninitialized variable.\
    \ To solve this, you can either set X to a dummy value when an overflow occurs\
    \ or manually verify that X is never used after a Set_X_To_Y_Plus_Z that returned\
    \ True as value of Overflow.\n\n# 2.4.2 Composite Types\n\nAnother common cause\
    \ of false alarms is caused by the flow analysis handles composite types. Let's\
    \ start with arrays.\n\nFlow analysis enters an array as single object instead\
    \ of one object per element, so it modifying a single element to be a modification\
    \ of the array as a whole. Obviously, this makes reasoning about global variables\
    \ access less precise and hence the dependencies of these variables are less precise.\
    \ This also affects the ability to accurately detect reads of uninitialized data.\n\
    \nIt's sometimes impossible for flow analysis to determine if an entire array\
    \ has been initialized. For example, if we write code to initialize every element\
    \ of an unconstrained array A in chunks, we might still receive a message from\
    \ flow analysis claiming the array is not initialized. To resolve this, either\
    \ use a simpler loop over the full range of the array, or (even better) an aggregate\
    \ assignment, or if not possible, verify initialization of the object manually.\n\
    \nListing 10: show_composite_types_shortcoming.ads\n\n```\npackage Show_Composite_Types_Shortcoming\
    \ is\n\n  type T is array (Natural range) of Integer;\n\n  procedure Init_Chunks\
    \ (A : out T);\n  procedure Init_Loop (A : out T);\n  procedure Init_Aggregate\
    \ (A : out T);\n\nend Show_Composite_Types_Shortcoming;\n```"
