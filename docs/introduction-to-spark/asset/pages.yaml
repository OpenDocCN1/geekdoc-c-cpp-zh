  md: '# 4.7.2 Constants that Depend on Variables


    Some constants are also possible components of a state abstraction. These are
    constants whose value depends on a variable or a subprogram parameter. They''re
    handled as variables during flow analysis because they participate in the flow
    of information between variables throughout the program. Therefore, GProv considers
    these constants to be part of a package''s state just like it does for variables.


    If you specified a state abstraction for a package, you must list such constants
    declared in that package in the state refinement. However, constants that don''t
    depend on variables do not appear in the flow of information and must not appear
    in a state refinement.


    Let''s look at this example:


    Listing 10: stack.ads


    ```

    package Stack with

    Abstract_State => The_Stack

    is

    type Element is new Integer;

    nprocedure Pop (E : out Element);

    procedure Push (E : Element);

    end Stack;

    ```


    Listing 11: configuration.ads


    ```

    package Configuration with

    Initializes => External_Variable

    isnExternal Variable : Positive with Volatile;

    end Configuration;

    ```


    Listing 12: stack.adb


    ```

    with Configuration;

    pragma Elaborate (Configuration);

    package body Stack with

    Refined_State => (The_Stack => (Content, Top, Max))

    Max has variable inputs. It must appear as a

    constituent of The Stack

    is

    Max : constant Positive := Configuration.External_Variable;

    type Element_Array is array (1 .. Max) of Element;

    Content : Element_Array := (others => 0);

    Top : Natural range 0 .. Max := 0;

    procedure Pop (E : out Element) is

    begin

    E := Content (Top);

    Top := Top - 1;

    end Pop;

    procedure Push (E : Element) is

    begin

    Top := Top + 1;

    Content (Top) := E;

    end Push;

    ```


