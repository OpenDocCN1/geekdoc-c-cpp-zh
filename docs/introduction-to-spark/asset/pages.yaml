    \ in earlier stages of development. If the contracts are precise enough, you can\
    \ use them as oracles to decide whether a test passed or failed. In that case,\
    \ they can also verify the outputs of subprograms while running a larger block\
    \ of code. This may, in certain contexts, replace the need for you to perform\
    \ unit testing, instead allowing you to run integration tests with assertions.\
    \ Finally, if the code is in SPARK you can use GNATProve to formally prove these\
    \ contracts.\n\nThe advantage of a formal proof is that it verifies every possible\
    \ execution paths, which isn't always possible by running test cases. For example,\
