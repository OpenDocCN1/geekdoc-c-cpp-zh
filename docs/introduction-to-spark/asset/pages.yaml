  md: "# Introduction to SPARK\n\n# 5.3 Guide Proof\n\nSince properties of interest\
    \ for functional correctness are more complex than those involved in proofs of\
    \ integrity, we expect GNATprove to initially be unable to verify them even though\
    \ they're valid. You'll find the techniques we discussed in Debugging Failed Proof\
    \ Attempts (page 54) to come in handy. We now go beyond those techniques and focus\
    \ on more ways of improving results in the cases where the property is valid but\
    \ GNATprove can't prove it in a reasonable amount of time.\n\nIn those cases,\
    \ you may want to try and guide GNATprove to either complete the proof or strip\
    \ it down to a small number of easily-reviewable assertions. For this purpose,\
    \ you can add assertions to break complex proofs into smaller steps.\n\n```\n\
    pragma Assert (Assertion_Checked_By_The_Tool);\n  info: assertion proved\n```\n\
    \n```\npragma Assert (Assertion_Validated_By_Other_Means);\n  medium: assertion\
    \ might fail\n```\n\n```\npragma Assume (Assumption Validated By Other_Means);\n\
    \  The tool does not attempt to check this expression.\n  It is recorded as an\
    \ assumption.\n```\n\nOne intermediate step may be very useful to prove a theoretically-equivalent\
    \ version of the desired property, but if you've simplified things for the prover,\
    \ by splitting up different cases or inline the definitions of functions.\n\n\
    Some intermediate assertions may not be proved by GNATprove because it's missing\
    \ information or the amount of information is confusing. You can verify these\
    \ remaining assertions by other means such as testing (since they're executable)\
    \ or by review. You can also choose to instruct GNATprove to prove them, or by\
    \ turning them into assertions, as in our example, or by using a pragma Assert.\
    \ In both cases, the compiler generates code to check these assertions at runtime\
    \ when you enable assertions.\n\n# 5.3.1 Local Ghost Variables\n\nYou can use\
    \ ghost code to enhance what you can express intermediate assertions in the same\
    \ way we did above to enhance our contracts in specifications. In particular,\
    \ you'll commonly have local variables or constants whose only purpose is to store\
    \ the values of variables or expressions that you want to refer to in assertions.\
    \ They're especially useful to refer to values of parameters and expressions since\
    \ the 'old attribute is only allowed in postconditions.\n\nIn the example below,\
    \ we want to help GNATprove verify the postcondition of P. We do this by introducing\
    \ a local ghost variable, X_Int, to represent the value and writing an assertion\
    \ in both branches of an repeats the postcondition, but using X_Int.\n\n> Listing\
    \ 20: show_local_ghost.adsc\n\n```\npackage Show_Local_Ghost is\n\ntype T is Natural;\n\
    \nfunction F (X, Y: T) return Boolean is (X > Y) with Ghost;\nfunction Condition\
    \ (X : T) return Boolean is (X mod 2 = 0);\n\nprocedure P (X : in T) with\n  Pre\
    \ => X < 1_000_000,\n```\n\n# 5.3. Guide Proof\n\n107"
