  md: '# SPARK OVERVIEW


    This tutorial is an introduction to the SPARK programming language and its formal
    verification tools. You need not know any specific programming language (although
    going over the Introduction to Ada course first may help) or have experience in
    formal verification.


    # 1.1 What is it?


    SPARK refers to two different things:


    +   - a programming language targeted at functional specification and static verification,
    and

    - a set of development and verification tools for that language.


    The SPARK language is based on a subset of the Ada language. Ada is particularly
    well suited to formal verification since it was designed for critical software
    development. SPARK builds on that foundation.


    ![](img/f1e490d8090325782c7af40c77e8a99e_9_0.png)


    Version 2012 of Ada introduced the use of aspects, which can be used for subprogram
    contracts, and version 2014 of SPARK added its own aspects to further Ada static
    analysis.'
  merge: -1
  pgno: 9
- img_proc: true
  md: "# Introduction to SPARK\n\n# 1.2 What do the tools do?\n\nWe start by reviewing\
    \ static verification of programs, which is verification of the source code performed\
    \ without compiling or executing it. Verification uses tools that perform static\
    \ analysis. These tools can take various forms. They include tools that check\
    \ types and enforce visibility rules, such as the compiler, in addition to those\
    \ that perform more complex reasoning, such as abstract interpretation, as done\
    \ by a tool like CodePeer from AdaCore. Tools that come with SPARK perform different\
    \ forms of static analysis:\n\n+   - flow analysis is the fastest form of analysis.\
    \ It checks initializations of variables and looks at data dependencies between\
    \ inputs and outputs of programs. It can also find unused assignments and uninitialized\
    \ variables.\n\n+   - proof checks for the absence of runtime errors as well as\
    \ the conformance of the program with its specifications.\n\n# 1.3 Key Tools\n\
    \nThe tool for formal verification of the SPARK language is called GNATprove.\
    \ It checks for conformance with the SPARK subset and performs flow analysis and\
    \ proof of the source code. Several other tools use the SPARK language, including\
    \ both the GNAT compiler³ and the GNAT Studio integrated development environment.\n\
    \n# 1.4 A trivial example\n\nWe start with a simple example of a subprogram in\
    \ Ada that uses SPARK aspects to specify subprogram contracts. The subprogram,\
    \ called Increment, adds 1 to the value of its parameter X:\n\n> Listing 1: increment.adcm\n\
    \n```\nprocedure Increment\nnX : in out Integer\nwith\n  Global\n    Depends =>\
    \ (X => X),\n    Pre      => X = Integer,\n    Post     => X = X'Old + 1;\n```\n\
    \n> Listing 2: increment.adcb\n\n```\nprocedure Increment\nX : in out Integer\n\
    begin\n  X := X + 1;\nend Increment;\n```\n\nProver output\n\n```\n2 https://www.adacore.com/codepeer\n\
    3 https://www.adacore.com/gnatpro\n4 https://www.adacore.com/gnatpro/toolsuite/gps\n\
    ```"
  merge: -1
