    # 5.4 Code Examples / Pitfalls


    This section contains some code examples and pitfalls.


    # 5.4.1 Example #1


    We implement a ring buffer inside an array Content, where the contents of a ring
    buffer of Length are obtained by starting at index First and possibly wrapping
    around the end of the buffer. We use a ghost function Get_Model to return the
    contents of the ring buffer for use in contracts.


    > Listing 34: ring_buffer.ads


    ```

    package Ring_Buffer is

    Max_Size : constant := 100;

    type Nat_Array is array (Positive range <>) of Natural;

    function Get_Model return Nat_Array with Ghost;

    procedure Push (E : Natural) with

    Pre = Get_Model''Length < Max_Size;

    Post = Get_Model''Length = Get_Model''Old''Length + 1;

    end Ring_Buffer;

    ```


    > Listing 35: ring_buffer.adb


    ```

    package body Ring_Buffer is

    ubtype Length_Range is Natural range 0 .. Max_Size;

    ```


