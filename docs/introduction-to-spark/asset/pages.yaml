    # 1.6.2 No aliasing of names


    Another restriction imposed by the SPARK subset concerns aliasing We say that
    two names are aliased if they refer to the same object. There are reasons why
    aliasing is forbidden in SPARK:


    +   - It becomes much more difficult because requires taking into account the
    fact that identifications to variables with different names may actually update
    the same object.

    - Results may seem unexpected from a user point of view. The results of a subprogram
    may depend on compiler-specific attributes, such as parameter passing mechanisms,
