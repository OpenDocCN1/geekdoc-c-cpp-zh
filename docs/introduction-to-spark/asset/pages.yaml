  md: "# Introduction to SPARK\n\nparticular, assignment between access objects operates\
    \ a transfer of ownership, where the source object loses its permission to read\
    \ or write the underlying allocated memory.\n\nProcedure Ownership_Transfer is\
    \ an example of code that is legal in Ada but rejected in SPARK due to aliasing:\n\
    \nListing 8: ownership_transfer.adb\n\n```\nprocedure Ownership Transfer is\n\
