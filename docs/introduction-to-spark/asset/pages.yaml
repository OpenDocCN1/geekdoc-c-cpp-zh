    Flow analysis also checks for dependencies between variables, so it must be aware
    of how information flows through the code that performs the initialization of
    states. We discussed one of the Initializes aspect above. But you can also use
    it to provide flow information. If the initial value of a variable or state abstraction
    is dependent on the value of another variable or state abstraction from another
    package, you list this dependency in contract. You specify the list of entities
    on which a variable''s initial value depends using an Arrow following that variable''s
    name.


    Let''s look at this example:


    Listing 23: q.ads


    ```

    package Q is

    External_Variable : Integer := 2;

    end Q;

    ```


    Listing 24: p.ads


    ```

    with Q;

    package P with

    Initializes => (V1, V2 => Q.External_Variable)

    is is

    V1 : Integer := 0;

    V2 : Integer := Q.External_Variable;

    end P;

    ```


    # Prover output


    Phase 1 of 2: generation of Global contracts ...

    Phase 2 of 2: analysis of data and information flow ...

    p.ads:3:03: info: flow dependencies proved


    Here we indicate that V2''s initial value depends on the value of Q.External_Variable
    by including the dependency in Initializes aspect of P. We didn''t find any dependency
    for V1 because its initial value does not depend on any other variable. We could
    also have stated that lack of dependency by writing V1 => null.


    GNAT proves dependencies of initial values if you do not supply an Initializes
    aspect. However, if you provide an Initializes aspect for a package, it must be
    complete: you list every initialized state of the package, along with all its
    external dependencies.


    > Note: For details on Initializes, see the SPARK User''s Guide22.


