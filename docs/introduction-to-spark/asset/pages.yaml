  md: '# 5.2.3 Global Ghost Variables


    Though it happens less frequently, you may have specifications requiring you to
    store additional information in ghost variables that isn''t needed in normal code.
    You should mark these global variables as ghost, allowing the compiler to remove
    them when assertions are enabled. You can use these variables for any purpose
    within the contracts that make your specifications. A common scenario is writing
    specifications for subprograms that modify a complex or private global data structure:
    you can use these variables to provide a model for a structure that''s updated
    by the ghost code as the program executes the data structure.


    You can also use ghost variables to store information about previous runs of subprograms
    specified. In this example, we have two procedures; one that accesses state A
    and the other that accesses state B. Use the ghost variable Last_Accessed_Is_A
    to specify that B cannot be accessed in a row without accessing A between.


    Listing 16: call_sequence.ads


    ```

    package Call_Sequence is

    2 type T is new Integer;

    3 Last_Accessed_Is_A : Boolean := False with Ghost;

    4 procedure Access A with

    5 Post => Last_Accessed_Is_A;

    6 procedure Access B with

    7 Pre => not Last_Accessed_Is_A;

    8 B can only be accessed after A

    9 end Call_Sequence;

    ```


    Listing 17: call_sequence.adb


    ```

    package body Call_Sequence is

    2 procedure Access_A is

    3 begin

    4 Last_Accessed_Is_A := True;

    5 end Access_A;

    6 procedure Access_B is

    7 begin

    8 Last_Accessed_Is_A := False;

    9 end Access_B;

    10 end Call_Sequence;

    ```


    Listing 18: main.adb


    ```

    with Call_Sequence; use Call_Sequence;

    2 procedure Main is

    3 begin

    4 Access_A;

    5 Access_B;

    6 Access_B; -- ERROR

    7 end Main;

    ```


