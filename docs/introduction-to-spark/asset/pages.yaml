    The contracts are written using the Ada aspect feature and show those several
    properties of this subprogram:


    +   - The SPARK Global aspect is especially important for security: it says that
    the value of the parameter X depends only on the (previous) value of X.

    - The SPARK Depend aspect says that Increment does not read or write any global
    variables.

    -

    - The Pre and Post aspects of Ada show specific properties of Increment:

    - Increment is only allowed to be called if the value of X prior to the call is
    less than Integer Last. This ensures that the operation performed in the subprogram
    body doesn''t overflow.

    - Increment does not perform an increment of X: the value of X after a call is
    greater than its value before the call.


    GNATprove can verify all of these contracts. In addition, it verifies that no
    error can be raised at runtime when executing Increment''s body.


    # 1.5 The Programming Language


    It''s important to understand why there are differences between the SPARK and
    Ada languages. The aim when designing the SPARK subset of Ada was to create the
    possible subset of Ada that was still amenable to specification and sound verification.


    The most notable restrictions from Ada are related to exceptions and access types,
    both of which are known to considerably increase the amount of user-written annotations
    required for full support. Backwards goto statements and controlled types are
    also not supported since they introduce non-trivial control flow. The two remaining
    restrictions relate to side-effects in expressions and aliasing of names, which
    we now cover in detail.


    # 1.6 Limitations


    # 1.6.1 No side-effects in expressions


    The SPARK language doesn''t allow side-effects in expressions. In other words,
    evaluating a SPARK expression must not update any object. This limitation is necessary
    to avoid unpredictable behavior that depends on order of evaluation, parameter
    passing mechanisms, or compiler optimizations. The expression for Dummy below
    is non-deterministic due to the order in which the two calls to F are evaluated.
    It''s therefore not legal SPARK.


    Listing 3: show_illegal_ada_code.adb


    ```

    procedure Show_Illegal_Ada_Code is

    function F (X : in Integer) return Integer is

    Tmp : constant Integer := X;

    begin

    ```


