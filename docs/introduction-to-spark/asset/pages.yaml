  md: "# Introduction to SPARK\n\nWe can use the subtype Sorted_Array as the type\
    \ of variable that may remain sorted throughout the program's execution. Specifying\
    \ that an array is sorted requires a rather complex expression involving quantifiers,\
    \ so we abstract away property as an expression to prove readability. Is_Sorted\
    \ body remains in the program's specification and allows users of the code to\
    \ retain a precise knowledge of its meaning (When you must use Nat_Array as the\
    \ type of the operand Is_Sorted. If you use Sorted_Array, you'll get infinite\
    \ recursion at runtime when sort checks are enabled and such function is called\
    \ to check all operands of type Sorted_Array).\n\n# 2.2.1 Ghost Code\n\nAs the\
    \ properties you need to specify more complex, you may have entities that are\
    \ only needed because they are used in specifications (contracts). You may find\
    \ important to note that these entities can't affect the behavior of the program\
    \ or they're completely removed from production code. Concept, having ghost_code\
    \ is usually used in SPARK by the Ghost aspect.\n\nYou can use Ghost code to annotate\
    \ any entity including variables, sub-programs, and packages. If you mark an entity\
    \ as Ghost, GNATPro ensures it can't affect the program's behavior. When the program\
    \ is compiled with assertions, ghost code is executed like normal code so it can\
    \ execute the contracts using it. You can also insert the compiler to generate\
    \ code for ghost entities.\n\nConsider the procedure Something, which calls a\
    \ function on its input, X, and wants to check that the initial and modified values\
    \ of X are related in that complex way.\n\nListing 9: show_ghost.ads\n\n```\n\
    package Show_Ghost is\ntype T is record\n    A, B, C, D, E : Boolean;\nend record;\n\
    \nfunction Formula (X : T) return Boolean is\n    (X.A and X.B) or (X.D or X.E));\n\
    \nfunction IsCorrect (X, Y : T) return Boolean is\n    (Formula (X) = Formula\
    \ (Y));\n\nprocedure Do_Something (X : in out T)\nend Show_Ghost;\n```\n\nListing\
    \ 10: show_ghost.adb\n\n```\npackage body Show_Complex_Stuff (X : in out T) is\n\
    begin\n    X := T'(X.B, X.A, X.C, X.E, X.D);\n    end Do_Complex_Stuff;\n\n  \
    \  procedure Do_Something (X : in out T) is\n    X_Init : constant T := X with\
    \ Ghost;\nbegin\n    Do Complex Stuff (X);\n    pragma Assert (IsCorrect X_Init,\
    \ X);\n    It is OK to use X_Init inside an assertion.\nend Do_Something;\n```\n\
