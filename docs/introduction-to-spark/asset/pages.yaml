  md: "# Introduction to SPARK\n\nPhase 1 of 2: generation of Global contracts ...nPhase\
    \ 2 of 2: flow analysis and proof ...nshow, failed_proof_attempt.ads:6:49:medium:\
    \ postcondition might fail, cannot prove\nX =\ngatprove: unproved checks considered\
    \ as errors\n\nThis postcondition is conditional. If it says that the parameter\
    \ (X) is less than a value (C), its value will be increased by the procedure if\
    \ it grows, its value will be C (saturated). When C has the value 100, the Increase\
    \ adds 10 to the value of X if it was initially less than 90, increments X by\
    \ 1 if it is 90, and sets X to 100 if it grows or equal to 100. This behavior\
    \ does satisfy the postcondition, what if the postcondition is not proved?\n\n\
    The values in the counterexample returned by GNATProve in its settings give us\
    \ a clue: C = 0 and X = 10 and X'Old = 0. Indeed, if C is not equal to 100, our\
    \ reasoning is incorrect: the values of C and X entry result in X being on 10,\
    \ which violates the postcondition!\nWe probably didn't execute to show C to be\
    \ constant, or at least to abandon by by adding a precondition to the Increase\
    \ subprogram. If we either of those, GNATProve is able to prove the postcondition.\n\
    \n# 3.4.3 Debugging Proof Violations\n\nFinally, there are cases where GNATProvides\
    \ a perfectly valid verification condition for a property, but never not proved\
    \ by the automatic proof runs in the later stages of the tool's execution. This\
    \ is quite common. GNAT produces its verification conditions in first-order logic,\
    \ which is not decidable, in combination with the rules of arithmetic. Sometimes,\
    \ the automatic proof needs more time. The other prover, will abandon the search\
    \ almost immediately or loop forever without reaching a answer (either a proof\
    \ or a counterexample).\n\nFor example, the postcondition of our GCD function\
    \ below — which calculates the value of the GCD of two numbers using Euclid's\
    \ algorithm — can't be verified with GNATprove's default settings.\n\n> Listing\
    \ 18: show_failed_proof_attempt.ads\n\n```\npackage Show_Failed_Proof_Attempt\
    \ is\nfunction GCD (A, B : Positive) return Positive with\nPost := =\n  A mod\
    \ GCD'Result = 0\n  and B mod GCD'Result = 0;\npackage Show_Failed_Proof_Attempt\
    \ is\nfunction GCD (A, B : Positive) return Positive with\nbegin\n  if A > B then\n\
    \    return GCD (A - B, B);\n  elsif B > A then\n    return GCD (A, B - A);\n\
    else\n    return A;\n  end if;\n  end GCD;\n```\n\n> Listing 19: show_failed_proof_attempt.adb\n\
    \n# 3.4. Debugging Failed Proof Attempts"
