  md: "# Introduction to SPARK\n\n(continued from previous page)\nshow failed proof\
    \ attempt.8:21: medium: contract case might fail\ngnatprove: unproved check messages\
    \ considered as errors\n\n# Runtime output\n\nraised ADA.ASSERTIONS.ASSERTION_ERROR\
    \ : failed contract case at show_failed_proof_\nattempt.ads:8\n\nThe error message\
    \ shows that the first contract is failing, which means that Incremented is\n\
    True. However, if we print the value of Incremented before returning, we see that\
    \ it's False,\nas expected for the input. The error here is that guard contracts\
    \ are evaluated\nbefore the call, so our specification is rough! To correct this,\
    \ we should write X < 1000 as\nthe guard of the first case or use a standard postcondition\
    \ with an if-expression.\n\n# 3.4.2 Debugging Cases where more Information is\
    \ Required\n\nEven if both the code and the assertions are correct, GNATprove\
    \ may still report that it can't\nverify condition for the property. This can\
    \ happen for two reasons:\n\n+   * The property may be unprovable because the\
    \ code is missing some assertion. One category of these cases is due to the modularity\
    \ of the analysis, as we discussed above, means thatnGATprove only knows the properties\
    \ of your subprograms that it might verify\nwritten.\n* There may be some information\
    \ missing in the logical model of the program being proved by GNAT-prove.\n\n\
    Let's look at the case where the code and the specification are correct but there's\
    \ some information missing. As an example, GNATprove finds the postcondition of\
    \ Increase to be unfavorable.\n\n```\npackage Show_Failed_Proof_Attempt is\nC\
    \ : Natural := 100;\nprocedure Increase (X : in Natural) with\n  Post := (if X'Old\
    \ < C then X'Old else X = C);\nend Show_Failed_Proof_Attempt;\npackage body Show_Failed_Proof_Attempt\
    \ is\nprocedure Increase (X : in Natural) is\nbegin\n  if X < 90 then\n    X :=\
    \ X + 10;\n  elsif X >= C then\n    X := C;\n  else\n    X := X + 1;\n  end if;\n\
    end Increase;\nend Show_Failed_Proof_Attempt;\n```\n\nListing 16: show_failed_proof_attempt.adb\n\
    \n# Prover output"
