    Phase 2 of 2: flow analysis and proof ...\nincrease.adb:3:11: info: overflow check\
    \ proved\nincrease.adb:2:03: info: data dependencies proved\nincrease.adb:4:13:\
    \ info: postcondition proved\n\nWe've written a specification of the subprogram\
    \ Increase to say that it's called with a single argument, a variable of type\
    \ Integer whose initial value is less than 100. Our contract says that the only\
    \ effect of the subprogram is to increase the value of its argument.\n\n# 4.2\
    \ Why is Abstraction Useful?\n\nA good description of a subprogram's implementation\
    \ is one specification precisely and completely specifies what the callers can\
    \ rely on. In other words, a caller of subprogram shouldn't rely on any behavior\
    \ of its implementation if it isn't documented in its specification.\n\nFor example,\
    \ callers of the subprogram Increase can assume that it always increases the value\
    \ of its argument. In the code snippet below, this means the loop must terminate.\n\
    \nList 3: increase.ads\n\n```\nprocedure Increase (X : in out Integer) with\n\
    Global X := null;\nPre => X <= 100;\nPost => X = 'Old X < X;\n```\n\nList 4: client.adb\n\
    \n```\nwith Increase;\nprocedure Client is\nX : Integer := 0;\nbegin\n  while\
    \ X <= 100 loop\n    Increase(X); -- Increase can be called safely\n  end loop;\n\
    \  pragma Assert (X = 101); -- Will this hold?\nend Client;\n```\n\nOutput proof\n\
    \nPhase 1 of 2: generation of Global contracts ...\nPhase 2 of 2: flow analysis\
    \ and proof ...\nclient.adb:8:19: medium: assertion might fail\ngnatprove: proved\
    \ check messages considered as errors\n\nCallers can also assume that the implementation\
    \ of Increase won't cause any errors when called. In the other hand, noting in\
    \ the specification that guarantees the assertion above is correct: it may fail\
    \ if Increase is changed.\n\nIf you follow this basic principle, abstraction can\
    \ bring significant benefits. It simplifies both maintenance and code reuse much\
    \ easier since changes to the implementation of an object shouldn't affect the\
    \ code using this object. Your goal is in it that it should be simple enough to\
    \ understand the specification of an object in order to use that object, since\
    \ understanding the specification is much simpler than understanding the implementation.\n\
    \nGNATprove relies on the abstraction defined by subprogram contracts and therefore\
    \ proves the assertion over the loop in Client."
