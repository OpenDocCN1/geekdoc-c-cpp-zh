  md: '# Introduction to SPARK


    runtime checks are costly, in terms of program size and execution time. It may
    be appropriate to remove them if we statically ensure they aren''t needed at runtime,
    in other words if we can prove that the condition tested for can never occur.


    This is where the analysis by GNATprove comes in. It can be used to demonstrate
    that none of these errors occur at runtime. Specifically, GNATprove logically
    interprets the meaning of every entry in the program. Using this interpretation,
    GNATprove generates a logical formula for each check that would otherwise be required
    by the Ada (and SPARK) language.


    ```

    A (Integer ''Last + 1) := P / 0;

    -- overflow check might fail

    ```


    ```

    A (Last + 1) := P / 0;

    -- array index check might fail

    ```


    ```

    A (I + 3) := Integer/First / (-1);

    -- overflow check might fail

    ```


    ```

    A (I + 3) := 1 / (-1);

    -- range check might fail

    ```


    ```

    A (I + 3) := P / 0;

    -- divide by zero might fail

    ```


    GNATprove passes these verification to an automatic prover, stated as conditions
    that must be true to avoid the error. If such condition can be validated by a
    prover (meaning that it can be mathematically shown to be true), we''ve been able
    to prove that no error can be raised at runtime when executing the program.


    # 3.2 Modularity


    To scale to large programs, GNATprove performs on a per-subprogram basis by relying
    on preconditions and postconditions to properly summarize the input and output
    of each program. More precisely, when verifying the body of a subprogram, GNATprove
    assumes nothing about the initial values of its parameters and the global variables
    it accesses except what you state in the subprogram''s precondition. If you don''t
    specify a precondition, it can''t make any assumptions.


    For example, the following code shows that Increment can be successfully verified:
    its precondition constraints the value of X to be Integer'' Last so we know the
    overflow check is always false.


    In the same way, when a subprogram is called, GNATprove assumes its out and in
    out parameters and the global variables it writes can be compatible with their
    postconditions. For example, Increment GNATprove doesn''t know the value of X
    after the call is less than Integer'' Last. Therefore, it can''t prove that the
    following addition can''t overflow.


    > Listing 3: show_modularity.ad


    ```

    1 procedure Show Modularity

    2 procedure Increment (X : in out Integer) with

    3 Pre <= X < Integer'' Last is

    4 begin

    5 X := X + 1;

    6 -- info: overflow check proved

    7 end Increment;

    8 (continues on next page)

    ```


