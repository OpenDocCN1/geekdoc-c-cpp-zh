  md: "# Introduction to SPARK\n\n# 4.5 Refining an Abstract State\n\nOnce you've\
    \ declared an abstract state in a package, you must refine it into its constituents\
    \ using a Refined_State aspect. You must place the Refined_State aspect on the\
    \ package body if the package would otherwise have required a body. For each state\
    \ abstraction you declared for the package, you list the set of variables represented\
    \ by that abstraction in its refined state.\n\nIf you specify an abstract state\
    \ for a package, it must be complete, meaning you must list every hidden variable\
    \ as part of state abstraction. For example, we must add a Refined_State aspect\
    \ on our Stack body linking the state abstraction (The_Stack) to the hidden state\
    \ of the package, which consists of Content and Top.\n\nListing 5: stack.ads\n\
    \n```\npackage Stack with\n  Abstract_State => The_Stack\n  type Element is new\
