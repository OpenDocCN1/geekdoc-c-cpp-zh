    ## An Overview of C Programming

    Dennis Ritchie created the C programming language at Bell Labs in the early 1970s,
    and it is still used today. It was developed as an extension to the B programming
    language, featuring new data types and functionalities. Over the years, C has
    evolved into one of the most extensively used programming languages in the world,
    influencing the development of numerous modern programming languages such as C++,
    C#, Objective-C, and, more indirectly, languages such as Java and Python.


    ## The significance of C

    C is frequently used in system programming, particularly in the creation of operating
    systems. Linux and Windows kernels, for example, contain C code.


    C is a compiled language, thus it can run quicker than interpreted languages.
    As a result, it is appropriate for resource-constrained environments or when high
    performance is required.


    One of the most major advantages of C is its ability to code once and run anywhere
    (with little modifications). This means that a C programme can be created on one
    system and then run on another with no or little changes.


    C follows a procedural programming paradigm, which is useful for jobs that require
    a step-by-step approach.


    Modern Language basis: Learning C lays a solid basis for understanding more sophisticated
    languages. C is the source of syntax and concepts in many current languages.


    ## Beginner


    ### Section 1: Basics of C

    - Introduction to fundamental C syntax and operations.

    - Simple I/O, arithmetic calculations, and constants usage.


    ### Section 2: Control Structures

    - Introduction to conditional statements.

    - Decision making using `if-else` and `switch-case`.


    ### Section 3: Loops

    - Introduction to iteration.


    ### Section 4: Functions

    - Introduction to modular programming.


    ### Section 5: Arrays

    - Introduction to data structures.


    ### Section 6 Strings and Characters

    - Introduction to string manipulation.


    ### Section 7 Pointers

    - Introduction to memory management.


    ### Section 8: Functions

    - Focusing on recursion.


    ### Section 9: Structures

    - Introduction to user-defined structures.


    ### Section 10: Files and I/O

    - Introduction to file operations.


    ## Beginner


    ### Section 1: Basics of C

    - 1-1: Write a program that prints "Hello, World!".

    - 1-2: Write a program that takes input and outputs its length.

    - 1-3: Write a program that converts Celsius to Fahrenheit.

    - 1-4: Write a program that calculates the area of a circle.

    - 1-5: Write a program that finds the sum of numbers.


    ### Section 2: Control Structures

    - 2-1: Write a program that checks if a number is even or odd.

    - 2-2: Write a program that prints the month name.

    - 2-3: Write a program that checks a character is a vowel or consonant.

    - 2-4: Write a program that finds the greatest among three numbers.

    - 2-5: Write a program that checks a leap year or not.


    ### Section 3: Loops

    - 3-1: Write a program that prints the first 10 natural numbers.

    - 3-2: Write a program that calculates the factorial of a number.

    - 3-3: Write a program that prints the Fibonacci series up to a number of terms.

    - 3-4: Write a program that finds prime numbers within a range.

    - 3-5: Write a program that multiplication table of a number.


    ### Section 4: Functions

    - 4-1: Write a function that returns the sum of two numbers.

    - 4-2: Create a function that finds the largest of three numbers.

    - 4-3: Write a function to compute the factorial of a number.

    - 4-4: Create a function to check if a number is prime or not.

    - 4-5: Write a function to convert a string to uppercase.


    ### Section 5: Arrays

    - 5-1: Write a program to find the largest and smallest element in an array.

    - 5-2: Create a program to reverse the elements of an array.

    - 5-3: Write a program to find the sum and average of elements in an array.

    - 5-4: Create a program that sorts an array of numbers in ascending order.

    - 5-5: Write a program to search for a particular element in an array using linear
    search.


    ## Intermediate


    ### Section 6: Strings and Characters

    - 6-1: Write a program that takes a string as input and outputs its length.

    - 6-2: Implement a program that checks if a given string is a palindrome.

    - 6-3: Create a program that concatenates two strings without `strcat()`.

    - 6-4: Write a program to replace all spaces in a string with a hyphen.

    - 6-5: Implement a program to count the number of vowels and consonants in a string.


    ### Section 7 Pointers

    - 7-1: Write a program that swaps the values of two integers using pointers.

    - 7-2: Implement a program to find the length of a string using pointers.

    - 7-3: Create a program that reverses a string using pointers.

    - 7-4: Write a program to compute the sum of all elements of an array using pointers.

    - 7-5: Implement a program that sorts an array of integers in ascending order
    using pointers.


    ### Section 8: Functions

    - 8-1: Implement a recursive function to compute the nth Fibonacci number.

    - 8-2: Write a program that implements the binary search algorithm using functions.

    - 8-3: Implement a program that calculates the n-th power of a number using a
    recursive function.

    - 8-4: Create a function to check if a number is prime and then implement a function
    that prints prime numbers up to n.

    - 8-5: Implement a recursive function to compute the greatest common divisor (GCD)
    of two numbers.


    ### Section 9 Structures

    - 9-1: Define a structure to represent a complex number. Implement functions to
    add, subtract, and multiply two complex numbers.

    - 9-2: Create a structure to represent a date (day, month, year). Write a program
    that finds the difference (in days) between two given dates.

    - 9-3: Implement a student structure that contains name, roll number, and marks
    for 3 subjects. Write a function to calculate the average marks of a student.

    - 9-4: Write a program to store and display the information of books using structures
    (Book ID, Title, Author, Price).

