  md: '# Objective-C Complete


    That concludes your whirlwind tour of the Objective-C language. In this chapter,
    you learned about two core concepts: memory management and properties. If it all
    seems a bit overwhelming right now, don''t worry; you will have plenty of opportunities
    during the next chapters to try out what you learned here.


    This chapter also concludes Part 1 of this book. In Part 2, you learn how to use
    some of the excellent user interface elements offered by the UIKit framework.
    You will also begin to code in earnest, so get ready to put your Objective-C knowledge
    to good use!


    # The Least You Need to Know


    +   - Instead of garbage collection, the iPhone uses reference counting.

    - The golden rule of memory management: if you retain it, you release it.

    - Each time you call NARC (new, alloc, retain, or copy), you are responsible for
    calling release or autorelease.

    - Autorelease delays sending the release message until a later point in time.

    - Properties can be used to automatically generate getters and setters for your
    instance variables.

    - You can use dot-syntax to access or modify properties.'
