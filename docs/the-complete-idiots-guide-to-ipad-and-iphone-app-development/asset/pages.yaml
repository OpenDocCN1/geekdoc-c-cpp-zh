    # Get Up and Running


    Okay, so you''ve created the project, poked around Xcode, and set some preferences.
    So, now what? Well, the next thing you need to do is build your project. Building
    your project consists of compiling your source files, linking the output files
    to the included frameworks, combining all the project resources with the output
    files into a single application bundle. For the Flashlight project, this is the
    Flashlight.app file in the Products group.


