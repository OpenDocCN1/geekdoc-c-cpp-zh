- img_proc: true
  md: '# Web Views


    Web views make it extraordinarily easy to display web pages inside your application.
    In code, web views are implemented via the UIWebView class. You can register for
    the UIDelegate protocol to be notified when certain events happen, as a URL loading
    successfully or stopping without an error. In this sample application, you will
    add a WebView to your interface and use the UIDelegate to know when it finishes
    loading a URL.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_165_0.png)


    Web views are warning on using web views: they can use quite a bit of memory.


    One word of warning is warning on using web views: they can use quite a bit of
    memory. If you use a web view in your application, make sure you release the web
    view when you''re done with it, or you could end up with a significant memory
    leak.


    > ONE THING

    Remember that web views on the iPhone and iPad do not support plugins as Java
    and Flash.


    To see how simple it is to implement web views, let''s build a new sample app,
    Browser.


    # Browser App


    An app deserves a simple name. The Browser app will have only one view, a UIWebView,
    that will load a web page of your choosing. Over the course of the chapter, you
    will add more functionality, but for now, you get to start with something easy.'
  merge: -1
