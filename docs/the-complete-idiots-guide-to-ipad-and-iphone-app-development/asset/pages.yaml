  md: '# The Least You Need to Know


    +   - Split views display two views: a master view, which typically displays a
    list of items, and a detail view, which typically shows more details for the currently
    selected item.


    +   - When a split view rotates to portrait mode, the master (left) view is shown
    in a popover that is triggered by a button bar item.


    +   - To display a UIPopoverController when a toolbar item is tapped, use the
    present PopoverFromBarButtonItemItem:permittedArrowDirections:animated:method.


    +   - The delegate for a split view controller is notified when the interface
    rotates from portrait to landscape mode and back.


    +   - A split view controller will only allow interface rotation if both its left
    and right view controllers override shouldRotateToInterfaceOrientation: to return
    YES.'
