  md: "# UIWebViewDelegate\n\nTo be notified of failures when the web pages are loading,\
    \ the controller needs to become the delegate of the WebView instance. Remember,\
    \ there are three steps in becoming a delegate:\n\n+   Adopt the delegate protocol.\
    \ In this case, you need to register for the UIWebViewDelegate protocol in the\
    \ BrowserViewController.h file, as shown in the following:\n\n```\n// BrowserViewController.h\n\
    \n@import UIKit/UIKit.h\n\n@interface BrowserViewController : UIViewController\n\
    <UIWebViewDelegate>\n{\n    UIWebView *webView;\n@property (nonatomic, retain)\
    \ IBOut UIWebView *webView;\n@end\n```\n\n+   Implement the delegate methods.\
    \ The delegate method you need is webView:didFailWithError:. When this method\
    \ is called, display an alert view with information about what exactly went wrong.\
    \ Add the following code to your BrowserViewController.m file to achieve this\
    \ result:\n\n```\n// BrowserViewController.m\n\n// Called when the web page doesn't\
    \ load\n-(void)webView:(UIWebView *)webView didFailWithError:(NSError *)error\n\
    {\n    UIAlert *alertView = [[UIAlert alloc] initWithTitle:\"Error loading web\
    \ page\"\nmessage:[error localizedDescription]\ndellegate:nil\ncancelButtonTitle:nil\n\
    otherButtonTitles:@\"OK\", nil];\n\n    [alertView show];\n    [alertView release];\n\
    }\n```"
