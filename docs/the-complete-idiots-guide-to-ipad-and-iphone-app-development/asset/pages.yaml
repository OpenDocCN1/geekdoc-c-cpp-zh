- img_proc: true
  md: '# CLLocationManager Properties


    You can also control the frequency of updates from CLLocationManager by using
    the distanceFilter and desiredAccuracy properties. A description of each follows:


    +   - **distanceFilter**: Measured in meters, this value indicates how far the
    device must move before the delegate is messaged with a new location. The default
    value is kDistanceFilterNone, which means all movements are reported by the manager.
    In practice, this setting seems to generate locations every five seconds or so.
    If you do not need every single movement, you can conserve battery life by setting
    this property to a higher value.

    - **desiredAccuracy**: You can set the desired accuracy from a 3-kilometer radius
    to the best accuracy possible. By default, the accuracy is set to kLLocationAccuracyBest.
    However, the higher the desired accuracy, the harder the device has to work to
    achieve that, which means more battery life is used. For a tracking application,
    you will need the best accuracy possible, so the default value is the right value.


    If your application just needs periodic location updates, setting these properties
    to more relaxed values will help your phone save battery.


    # CRASH AND LEARN


    Using location services can be one of the single biggest battery-draining activities
    on an iPhone OS device. On a full charge, an iPhone 3GS will die roughly two to
    three hours after your application runs the location manager at full blast the
    entire time. For distance-tracking applications, you must run the manager at maximum
    settings to get an accurate distance measurement. However, if you do not need
    to run the location manager continuously, don''t.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_338_0.png)


    # Distance App


    Let''s take Core Location for a spin by building a distance-tracking sample application:
    Distance. By the time you are done, you will have the following app.'
