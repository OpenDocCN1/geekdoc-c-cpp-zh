  md: '# How This Book Is Organized


    This book is broken into five parts. In the early chapters, you learn the basics
    of iPad and iPhone programming using Xcode and Interface Builder. After building
    your first few apps, learn how to add controls to your interface, like sliders,
    text fields, and pickers. Multi-view topics such as view controllers, navigation
    controllers, and tab bar controllers are not extra. Then, learn some of the remaining
    core topics, including data management, networking, and animation. At that point,
    dive into multi-touch, Core Location, and other unique iPad and iPhone APIs. Finally,
    see how to optimize your apps, and follow the step-by-step guide to submit your
    app to the App Store.


    Part 1, Getting Started—Download the SDK and you''re on your way to becoming an
    iPad and iPhone developer. Get to know the tools you use day-in and day-out as
    a developer: Xcode, Interface Builder, and the iPhone Simulator. You write your
    first lines of code and learn what Objective-C is all about.


    Part 2, Building Your User Interface—Start digging deeper into building your app''s
    interface. Learn all the built-in controls in Interface Builder, including sliders,
    pickers, and text fields. At the same time, figure out how to control the behavior
    of these elements in Xcode. The core iPad and iPhone programming concepts of delegation,
    protocols, and collections are also covered in this part.


    Part 3, Multi-Applications—How do you manage an application that has multiple
    screens? What the heck is a controller? What the heck is MVC? What is a table
    view, and why is it a big deal? All these questions are answered in full detail
    in Part 3.


    Part 4, The APIs You Can''t Wait to Use—This is the moment you''ve waiting for.
    You know all the cool things you love most about your iPad or iPhone: multi-touch,
    camera, and maps. This part is all about tapping into the APIs for excellent features.
    Once you learn the general blueprint for using the APIs in this part, you can
    apply it to the plethora of other APIs the phone has to offer.


    Part 5, Make Your Missions—So, you want to maximize your chance of success, are
    there some steps you should take before making the leap. In this part, learn how
    to optimize your app on your own iPhone or iPad Touch. Learn how to use the debugger
    to fix memory issues and other bugs in your application. Find memory leaks and
    optimize your code using Instruments, Clang, and Shark. Finally, when you are
    ready to cross the finish line, we will walk you through thethrough the entire
    process of submitting your app to the App Store.'
  merge: -1
