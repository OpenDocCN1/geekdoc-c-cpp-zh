    \ that your controller adopts the CLLocationDelegate protocol so your class can\
    \ receive location updates. Add the following code to your header file to make\
    \ these changes:\n\n```\n// DistanceViewController.h\n\n#import <CoreLocation/CoreLocation.h>\n\
    \n@interface DistanceViewController : UIViewController\n<CLLocationManagerDelegate>\n\
