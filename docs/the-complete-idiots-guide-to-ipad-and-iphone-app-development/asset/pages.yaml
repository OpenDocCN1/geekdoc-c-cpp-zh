  md: '# Adding Your App


    One of the great parts of the app submission process is that you can register
    your application before you finish developing it. When you go through the app
    submission process on iTunes Connect, you have the option of adding the application
    binary itself at a later time. The primary benefit, as mentioned earlier in this
    chapter, is that adding the app early reserves your application name on the App
    Store.


    Another benefit is that you can edit your application information if you realize
    you made a mistake during the initial submission process. All of the app details
    are editable, so if you want to change the wording of the description or use different
    screenshots, you can make those changes before Apple reviews your application.


    It is also completely safe to add the app without the binary since the app reviewers
    will not look at your app until it has a binary. If you haven''t picked up on
    it yet, I highly recommend adding your app before submitting your binary.


    # Before You Begin


    There are three parts of the app submission process that take a lot more time
    than others:


    +   - App description

    - 512x512 pixel large app icon

    - Screenshots


    You can likely zoom through most of the app submission forms, but these three
    items will take some thought and some time to generate. Feel free to jump to the
    sub- on these topics below to get a head start on these items.


    # Step-by-Step


    There are quite a number of forms to fill out when submitting your app. If you
    aren''t sure what to enter for any one field, it is perfectly fine to add some
    placeholder text (To-Do) or even a placeholder image. As long as you don''t submit
    the app binary, you can come back and change your app details later.


    To add your app, follow these steps:


    +   - Navigate to your iTunes Connect homepage, and select the Manage Your Applications
    link.'
  merge: -1
  pgno: 417
