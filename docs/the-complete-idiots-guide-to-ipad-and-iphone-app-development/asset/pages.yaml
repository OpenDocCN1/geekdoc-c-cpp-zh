  md: '# iAd


    In addition to multitasking, iPhone OS 4.0 introduces the iAd framework for delivering
    in your application. The following section details how you can generate additional
    revenue in your apps by displaying ads.


    You might be wondering, “Why on earth would I want to annoy my users with ads?”
    The answer: Using ads, you can release your app for free while still generating
    revenue.


    You might also be thinking, “Mobile ads are awful.” Agree agrees with you. In
    fact, Steve Jobs noted the poor state of mobile ads during his keynote introducing
    iPhone OS 4.0. Just as the iPhone was a reimagining of the mobile phone, iAd is
    an attempt to revolutionize mobile ads by providing nothing but beautiful, high-quality
    ads to users.


    # How It Works


    The process for delivering ads is quite simple. Display an ad, and make money.
    Display more ads, and make more money. You should exercise restraint, however,
    and ensure that you are not impacting your user experience of the app too much.


    At the time of this writing, there are two standard sizes for ads: 320x50 for
    portrait ads and 460x32 for landscape.


    To display an advertisement on your app, you insert a banner ad in your interface.
    The iAd framework provides the ADBannerView class for displaying a banner ad.
    The ADBannerView displays a series of ads and handles user interaction. When you
    create the banner view, the view automatically downloads ads from Apple in the
    background. When the ad is visible, the view cycles through a series of ads.


    > DEFINITION


    A banner ad is a rectangular advertisement used extensively on the web. On mobile
    devices, a banner ad can usually be found at the very top or very bottom of an
    app’s interface.


    When the banner view is tapped by the user, any number of events can happen. The
    ad can launch a mobile, display an interactive modal view, or even launch Safari
    to show a web page. Note that in the case Safari is launched, your app will either
    be suspended or will begin to run in the background if you support it.'
