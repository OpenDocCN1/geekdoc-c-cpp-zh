  md: '# Interface Building


    # In This Chapter


    +   - Interface Builder in a nutshell

    - How to create an interface for your app

    - Adding a label to your interface

    - Adding an image to your interface

    - Creating an icon for your app


    By the end of this chapter, you will know how to create an interface for your
    iPhone app that contains a text label and an image. Would you believe that using
    only this knowledge, you can write an app that would sell for $1,000?


    Common sense says no, that''s ludicrous. But an app called “I am Rich” did indeed
    go on sale in August 2008 for the low, low price of $999.99. The app simply displays
    an image of a red crystal that you could show to your friends to prove that yes,
    in fact, you are rich.


    The app sold eight copies before it was quickly taken off the App Store. Since
    then, Apple has tightened its approval process so objectionable apps like “I am
    Rich” don''t show up on the App Store. In this chapter, you will honor the spirit
    of “I am Rich” by building your own app that can display an image and some text.


    # ICE, ICE, Baby


    Although you hope it will never happen, what would you do if you are in an accident
    and knocked unconscious? It would be great if the first responders had a way to
    get in touch with your family or loved ones to find out what care they can provide
    without risk of further injury.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'This is precisely the situation that has given rise to the idea of ICE (In
    Case of Emergency). Originally, the idea behind ICE was that you keep a contact
    named ICE in your phone''s address book so paramedics and first responders know
    who to get in touch with if you need help. In this chapter, you will build an
    ICE iPhone app. The app will display a photo of your ICE contact, along with the
    person''s name and relationship to you. Completed, the app will look like this:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_53_0.png)


    The ICE interface consists of an image view and several labels.


    As you can see, the app is fairly simple but provides an important service.


    # Making ICE


    To start writing ICE, you will need to create a new project in Xcode, just like
    you did in the previous chapter. Instead of a Window-based Application, however,
    you will create a View-based Application. What''s the difference? In a Window-based
    Application, when you add a text label to the interface, you add it directly to
    the window itself. In a View-based Application, you add the text label to a view
    in the window. The View-based template is great for building apps that consist
    of a single view.


    Before creating the project in Xcode, you should understand exactly what a view
    and where it fits into the grand scheme of things in the iPhone interface.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Views


    There are simple views that draw text and images, and there are complex views
    that draw tables and pickers. A view can span a single pixel or it can fill the
    entire screen. It can be transparent or opaque. You can define your own views
    to draw polygons, shapes, and paths. Views are the basic building blocks of all
    user interface elements on the iPhone.


    > DEFINITION

    A view is a rectangular portion of the screen that draws content. Everything in
    an iPhone interface—text, images, buttons—is part of a view.


    Views are also hierarchical. Every view has a single supervise, or parent view,
    and every view has zero or more subviews, or child views. At the top of the hierarchy
    is the window, which is a view itself, and the subviews of the window determine
    what is rendered to the screen.


    To illustrate how views work, consider this screenshot from the built-in Mail
    application for iPhone:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_54_0.png)


    Here are some e-mails in the Mail app.'
  merge: -1
