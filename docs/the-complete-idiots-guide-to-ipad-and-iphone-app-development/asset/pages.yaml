  md: "# Chapter 8: Text Fields 117\n\n```\n- (float)calories;\n@optional\n- (float)fat;\n\
    - (float)protein;\n- (float)carbs;\n@end\n```\n\nSome notes about the code:\n\n\
    +   - To declare a protocol, you use the @protocol directive, as shown in the\
    \ previous code.\n- The <NSObject> part of the declaration is the parent protocol\
    \ that the Edible protocol inherits from. That means that any class that implements\
    \ the Edible methods must also implement the methods for the NSObject protocol.\
    \ This isn't normally an issue because all objects you deal with in iPhone programming\
    \ are subclasses of NSObject, and thus implement the required methods.\n\n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_134_0.png)\n\
    \n# THERE'S A TIP FOR THAT\n\n> This may sound strange, but there is an NSObject\
    \ class and an NSObject protocol. The NSObject class implements the NSObject protocol,\
    \ in fact. Protocols and classes can share the same name, which can get confusing.\n\
    \nA class can implement a protocol by including it in its declaration. Here is\
