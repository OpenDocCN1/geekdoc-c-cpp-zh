  md: '# DEFINITION


    Dot syntax gives you the ability to access and set properties of objects using
    dots. Properties can also be accessed and set using messages, but dot syntax is
    often more convenient.


    ```

    Shape *shape = [[Shape alloc] init];


    // Use dot-syntax to set the property

    shape.numberOfSides = 5;


    // Access the property value using dot-syntax

    NSLog(\@"The shape has %d sides", shape.numberOfSides);


    // Remember proper memory management!

    [shape release];

    ```


    As shown in the preceding code, you can both assign and retrieve the numberOfSides
    value using dot-syntax.


    # Attributes


    In the property declaration, assign is one of several attributes that modify property
    behavior. These attributes modify how the property manages memory and whether
    the property is read-only, among other things. The following table details all
    possible attributes:


    | Attribute | Category* | Explanation |

    | --- | --- | --- |

    | assign | Memory behavior | This is the default setter behavior. Uses simple
    assignment to set the value. Use this attribute for all C primitives (int, float,
    char, and so on). |

    | retain | Memory behavior | Releases the previous value, and retains the new
    value. Use this for object pointers. |

    | copy | Memory behavior | Releases the previous value, and sends the copy message
    to the new value. You will only use this for NSStrings. |'
