- img_proc: true
  md: '![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_46_0.png)


    On the left, Flashlight running in a simulated iPhone. On the right, the iPad
    version is displayed instead.


    The simulator does a good job of recreating some of the physical properties and
    behavior of a real device. You can find all the options under the iPhone Simulator
    menu item **Hardware**. These include:


    +   * **Rotate Left/Right:** This option rotates the iPhone Simulator by 90 degrees
    and can be used to see your interface in landscape mode.


    +   **Shake Gesture:** If your application responds to shake events, you can easily
    test it using this option.


    +   **Home:** This will close your application and jump to the home screen if
    you pressed the home button on a real device.


    +   **Lock:** This simulates pressing the button on the top right of the phone
    that suspends your application and displays the lock screen.


    +   **Simulate Memory Warning:** This option sends a low-memory warning to your
    application. Memory management is covered in great detail in Chapter 5, but the
    short story is it is important to handle low-memory situations in your app.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   **Toggle In-Call Status Bar:** Next time you make a phone call, check out
    the status bar at the top of the screen. Notice how it''s larger? It''s double
    the normal size, in fact. This option simulates the larger bar size, which you
    need to properly take into account when developing your app.


    In addition to simulating hardware, the iPhone Simulator also recreates taps,
    swipes, and pinch gestures using the mouse.


    Sending gestures to the simulator is pretty natural. Think of the mouse cursor
    as your finger, and you know how it works. Reference the following table to figure
    out how to perform each gesture on the simulator.


    # Gestures in the iPhone Simulator


    | Gesture | iPhone Simulator Equivalent |

    | Tap | Click |

    | Swipe | Click, drag, then drag |

    | Centered two-finger pinch | Hold ⌥ (option key), then click-and-drag |

    | Free two-finger pinch | Hold ⌥ and Shift, then click-and-drag |


    The centered two-finger pinch in the previous table always keeps the two fingers
    centered on the middle of the iPhone. This gesture is great for testing a zoom
    feature in your app. The free two-finger pinch lets you move the fingers around
    the screen with a constant distance between them. This gesture, on the other hand,
    is good to use for testing two-finger swipe.


    The problem with both two-finger gestures, though, is that you can''t properly
    simulate every gesture using a single mouse or trackpad. To truly test multiple
    fingers on your interface, you need to run the app on a real device. The lack
    of two-finger gestures is one of the limitations to consider when testing your
    apps on the iPhone Simulator. This brings us to our next topic: the limitations
    of the iPhone Simulator.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Simulator Limitations


    In a perfect world, you don''t need to run your application on a real device because
    the Simulator can recreate the exact same experience as running on a device. In
    a perfect world, you wouldn''t need to pay $99 so you can put your app on your
    device, because you can just test it in the iPhone Simulator. In a perfect world,
    rivers would flow with chocolate and money would grow on trees.


    Unfortunately, to the chagrin of both stomach and wallet, the world is not perfect.
    The iPhone Simulator is flawed in both what is and what it simulates. The limitations
    and inaccuracies of the iPhone Simulator are laid out in the following:


    +   **Computing resources:** The Simulator does not try to simulate the memory
    restrictions of a physical device. You are free to use as much memory as any other
    desktop application. Additionally, simulated applications run on your speedy desktop,
    is many times faster than an iPhone or iPad. These differences mean your app will
    run a bit more slowly on a real device.


    +   **Only one simulator allowed:** If you''re building an application that networks
    two devices together, it would be helpful to launch two simulators and test out
    the network code. Sadly, your only option is to test the app on multiple physical
    devices.


    +   **No GPS:** The iPhone Simulator reports a single, fixed location when using
    the Core Foundation framework: Apple headquarters in Cupertino, California.


    +   **No Camera:** The Simulator doesn''t try to recreate the camera at all.


    +   **No Accelerometer:** Don''t try your Mac in the air expecting to get accelerometer
    readings


    +   **No iPod:** You can use the Media Player framework to play music from the
    user''s iPod application on a device, but not in the iPhone Simulator.


    +   **No Bluetooth:** If you want to develop a game that uses the Game Kit framework
    to add sweet multiplayer Bluetooth support, you will need at least two physical
    devices for testing.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'No In-App Purchases: Want to test out +5 dexterity vest in your game? You need
    to use the Store Kit framework to get in-app purchases to work, and like the long
    list of features before this one, you can only test it on a real device.


    > THERE''S A TIP FOR THAT

    The iPhone Simulator does not simulate most aspects of iPhone and iPad hardware.
    Many of the limitations fall into this category.


    The simulator is not a perfect replacement for a physical device. How can you
    accurately test your apps, then? The only foolproof way to test your app is by
    actually running it on your iPhone or iPad. If you plan to put your application
    on the App Store, you absolutely need to test it on a real device before even
    thinking about your app. Unforeseen, wacky problems will show up when you first
    put your app on your device, and the only way to detect and fix those problems
    is by testing them in the wild.


    So should you still use the iPhone Simulator? Absolutely. There are great reasons
    for using the simulator, not the least of which is that it is drastically faster
    to run your app on a device. It takes a while for the app to upload to your iPhone
    or iPad, launching the simulator takes a matter of seconds. It is also more convenient
    to have your code and app running side by side instead of switching between computer
    and device.


    Just be aware of the limitations mentioned previously, and tuck away the knowledge
    that even if your app works perfectly in the iPhone Simulator, it may not really
    work. The only way to know for sure, particularly for performance, is by testing
    on real, bona-fide physical device.


