  md: '# Your First App in a Flash


    # Chapter 2


    # In This Chapter


    +   - Getting acquainted with Xcode

    - Creating projects in Xcode

    - Running apps in the iPhone Simulator

    - Write your first app


    Back in the summer of 2008, the iPhone App Store had yet to launch, and there
    was incredible excitement about how apps would transform the iPhone. All of a
    sudden, your phone became much more than a phone. It was now a light saber, a
    guitar tuner, or an ocarina. The phone was imagined as a gaming platform, a social
    media hub, or even a tool that could listen to the radio and tell you exactly
    which songs were being played. Unbel technology was on the horizon, and the possibilities
    were endless.


    Would you expect that one of the most successful apps in those heady first days
    was Flashlight, an app that displayed a pure white screen? The metaphor was so
    easy to understand and the app was so easy to use that sales for the app went
    through the roof. In this chapter, you learn how to write your own Flashlight
    app and also learn how to test it in the iPhone Simulator.


    # Creating Your First Project


    The first step in writing an iPhone app—a step you will perform time and time
    as an iPhone developer—is creating a new project in Xcode. If you are familiar
    with Visual Studio, Eclipse, or any other development environment, you will be
    right at home with Xcode.'
  merge: -1
