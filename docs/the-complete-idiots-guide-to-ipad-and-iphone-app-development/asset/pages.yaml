  md: '$99 is breaking the bank or seems like way too money right now, you can hold
    off on registering and test your app in the iPhone Simulator, which comes free
    with the SDK. In fact, you can make it through the first four parts of this book
    before you even need a real device to test, which will be fine if you don''t sign
