  md: '# Core Graphics


    You will use the delegate to chain multiple animations together in the sample
    app.


    To move a view, you need to set its center property—a CGPoint type—or set its
    frame property—a CGRect type. These types are defined in the Core Graphics framework,
    a framework that provides the basic building blocks for drawing and positioning
    views. Views use three data types from Core Graphics to determine the shape and
    size: CGPoint, CGSize, and CGRect.


    # CGPoint, CGSize, and CGRect


    If someone asked you to draw a box, you would need to know at least two pieces
    of information about it: where it goes and what size it is. In Core Graphics,
    to specify the where, you use CGPoint. To specify what size, you use CGSize. And
    to specify both where and what size, you use CGRect.


    > ONE MORE THING

    The CG prefix is short for Core Graphics.


    All three structures consist of two fields:


    +   * CGPoint = {x, y}

    * CGSize = {width, height}

    * CGRect = {origin, size}


    There are also built-in macros for creating each of these types:


    ```

    CGPoint point = CGPointMake(10, 20);

    CGSize size = CGSizeMake(30, 40);

    CGRect rect = CGRectMake(10, 20, 30, 40)


    // point: x = 10, y = 20

    // size: width = 30, height = 40

    // rect: origin.x = 10, origin.y = 20,

    // size.width = 30, size.height = 40

    ```'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'If you look closely, you will see that point, size, and rect do not have a
    "* indicating they are pointers. What’s the deal?


    The reason for this change is that Core Graphics is a C API. If you remember Chapter
    5, Objective-C is a superset of C, which means you can mix and match Objective-C
    in your code as much as you like. Many iPhone OS applications are written entirely
    in Objective-C, but in the case of Core Graphics—and other frameworks like AddressBook
    and CFNetwork—you must use C.


    # Frame and Bounds


    A CGRect describes the rectangle UIView lives in. This rectangle is defined using
    the frame property of UIView. The exact rectangle, however, is also defined using
    the bounds property.


    > DEFINITION

    A view’s frame is a rectangle positioned from the perspective of the parent view.
    A view’s bounds is a rectangle positioned from the perspective of the view itself,
    usually at (0, 0).


    Why are there two properties defining the same rectangle? The difference is the
    coordinate space used for each rectangle. A view’s frame rectangle is described
    from the perspective of the parent view’s coordinate system. Its bounds rectangle
    is described from within the view’s own coordinate system.


    > ONE MORE THING

    The coordinate system on iPhone devices is set up so that the point (0, 0) is
    in the top-left corner, and y values grow bigger going down the screen. This is
    the opposite of what you learned in geometry class, but it’s very useful for laying
    out text and other graphics that flow from the top of the screen to the bottom.


    Your eyes must be glazing over. The image that follows illustrates the difference
    between frame and bounds visually:'
