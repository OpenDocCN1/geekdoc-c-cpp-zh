    ```


    Alternatively, you can call

    presentPopoverFromRect:in:permittedArrowDirections:animated: on

    The UIPopover object. Unlike the bar button presentation method, you

    use this method to display a popover pointing to any arbitrary rectangle in

    interface. See the following code for an example of how to use this method:


    ```

    // Define the rectangle with top-left point (100, 100)

    // with a width and height of 200

    CGRect myRect = CGRect(100, 100, 200, 200);

    // Display the popover in the current view

    [self.popoverController

    presentPopoverFromRect:myRect

    inView:self.view

    permittedArrowDirections:UIPopoverArrowDirection

    animated:YES];

    ```


    When the popover is displayed, an arrow points to the element you specify as

    the first argument. For instance, when presentPopoverFromBarButtonItem:

    is called with the buttonItem object, an arrow points to button. When

    presentPopoverFromRect: is called with myRect, an arrow points to the rectangle

    defined by myRect. You can limit where the popover is displayed by specifying
    one

    the direction values in UIPopoverArrowDirection. However, you should generally

    use UIPopoverArrowDirectionAny.


    To dismiss a popover, the user simply needs to tap outside the bounds of

    the popover. If you wish to dismiss the popover programmatically, call the

    dismissPopoverAnimated: method on the popover controller. This is why it can be

    useful to hold on a reference to the popover controller in an instance variable.'
