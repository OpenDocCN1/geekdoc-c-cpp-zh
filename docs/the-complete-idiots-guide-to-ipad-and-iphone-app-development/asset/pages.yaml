  md: '# Resources for

    Further Learning


    There are a host of resources available online if you are interested in learning
    more about iPhone programming. The sheer number of sites can be overwhelming,
    so here is a condensed list of the resources you will find useful in pursuing
    further study.


    # Class-Related Websites


    Several schools offer iPhone programming courses now, and the course materials
    for many of them are available online. Following are some of the:


    +   * **Stanford CS193P iPhone class:** All the lectures and assignments from
    the course are available on the course website. The course was taught by Apple
    engineers and goes into more detail than this book did. Some of the advanced topics
    covered in the class but not in this book include threads, scroll views, and advanced
    table view usage. http://cs193p.stanford.edu

    * **Google group for CS193P auditors:** After the lectures for CS193P were put
    on iTunes, a community of developers who were all working on course assignments
    sprouted up on Google Groups. There are hundreds of posts from developers just
    getting their feet wet with iPhone programming, and it is a fantastic resource,
    especially if you are planning to work through the CS193P assignments. http://groups.google.com/group/iphone-appdev-auditors

    * **BYU CocoaHeads group:** The Brigham Young University (BYU) CocoaHeads group
    is a community centered around the Cocoa framework. If you are looking for a hub
    of great tutorials and guides to get in touch with other iPhone developers, this
    is a great site to check out. http://cocoaheads.byu.edu/resources'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Developer Blogs


    Several notable and well-respected Mac and iPhone developers often reveal the
    cut-ting edge in iPhone development on their blogs. Here are a few of the best,
    along with their Twitter threads.


    +   * **Cocoa With Love**: A treasure trove of useful iPhone development information
    provided by Matthew Gallagher. The subject matter is usually a bit advanced, but
    it''s definitely worth a look if you are looking for some excellent iPhone programming
    techniques. http://cocoawithlove.com/

    * **Furbo.org**: This blog by Craig Hockenberry, developer of Twitterific and
    RampChamp, is a must-read for aspiring iPhone developers. When developers were
    trying to figure out how to make sense of crash reports on the iPhone, furbo.org
    was the first place to post a tutorial on how to symbolize the logs into readable
    English. It is definitely worth a look. http://furbo.org/(@chickenberry on Twitter)

    * **Atebits blog**: Loren Brichter, developer of Tweetie and Tweetie 2, often
    posts on a mix of design and technical topics on his Atebits blog. An excellent
    resource if you are interested in learning best practices for designing your iPhone
    apps. http://news.atebits.com/ (@atebits on Twitter)

    * **Theocacao**: Theocacao is a blog about Cocoa development, which often applies
    to both Mac and iPhone. It is maintained by Scott Stevenson and contains some
    of the best Cocoa development posts around. http://theocacao.com/ (@scottstevenson
    on Twitter)


    # Forums


    If you have an iPhone development question or just want to see the same question
    has been asked before, there are several great iPhone development forums to check
    out.


    +   * **Apple Developer Forums**: These are the official forums provided by Apple.
    Somewhat sparse on content, it is the only official site where you can discuss
    topics related to SDK updates that are still under a Non-Disclosure Agreement
    (NDA). http://devforums.apple.com/'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# 418 The Complete Idiot''s Guide to iPad and iPhone App Development


    +   * iPhone Dev SDK forum: This forum has been around since the iPhone SDK first
    went public. Bursting with content, it''s a great place to hunt for answers to
    your problems. http://www.iphonedevsdk.com/


    +   * iPhone Dev Forums: This is similar to the last forum and similarly useful.
    If you hit a snag developing your app and are looking for answers, you are likely
    to find an answer on the iPhone Dev Forums. http://www.iphonedevforums.com/forum/


    # Videos


    A video explanation of a complex topic is much easier to understand than trying
    to figure it out on your own. There are several video resources on the web that
    can crystallize your understanding of iPhone development. Following are three
    of the best resources:


    +   * Stanford CS193P videos on iTunes U: All the lectures from Stanford''s CS193P
    class are available for free on iTunes U. You must have iTunes to access the video,
    and once installed, simply search for “CS193P” in the iTunes Store.


    +   * Pragmatic Bookshelf videos: The Pragmatic Bookshelf offers several-lent
    walkthroughs on different aspects of iPhone development. The videos are not free,
    however. http://www.pragmaticbookshelf.com


    +   * Apple iPhone Development Videos: Apple provides free videos on the official
    iPhone Developer site that go over introductory iPhone development topics. You
    can find the videos on the trusty iPhone Developer homepage. http://developer.apple.com/iphone'
