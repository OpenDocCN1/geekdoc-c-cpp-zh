  md: '# Provisioning


    Now that you''re officially in the iPhone Developer Program, you can start testing
    your applications on a physical device! But, wait! Hold that celebratory confetti
    toss. There''s still the whole matter of creating a provisioning profile so your
    apps can run on a physical device.


    DEFINITION


    A provisioning profile is a file that allows you to run your apps on a physical
    device. The profile uniquely identifies you, your app, and the devices your app
    can run on.


    So what exactly is a provisioning profile? It''s a single file that uniquely identifies
    your app, and the device (or devices) you want to run your application on. Here''s
    a visual diagram of what a provisioning profile consists of:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_385_0.png)


    Now that you have applied for the iPhone Developer Program, your homepage at http://developer.apple.com/iphone
    would resemble this image.'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Chapter 21: Testing Apps on Your Device 369


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_386_0.png)


    A provisioning profile is required to install your apps on a physical device.


    Shown in the previous image, a provisioning profile consists of three parts:


    +   * **Certificate**: Used to sign your app binary when you build it. The phone
    checks to make sure the binary signature is valid at runtime. This encryption
    technique is used to prevent piracy and distribution of applications out of the
    App Store.


    +   * **Devices**: You must specifically identify which devices your application
    will run on during development. Each device contains a unique identifier, called
    a UDID, which you can find by accessing the Window > Organizer menu item in Xcode
    with your device plugged in.


    +   * **App ID**: The app ID is the identifier that specifies the application
    it is associated with. Using a wildcard “*” in name, you can have the profile
    with multiple applications. For instance, the App ID in the image—L4A3627. *—works
    for all apps.


    # ONE MORE THING


    What''s up with the “L4A3627” prefix in the App ID name? This is known as the
    “seed” for the App ID, and Apple generates the seed when you create a new App
    ID. The seed is useful when you build multiple apps that share data, but if you
    are creating a standalone app, you can ignore the seed.


    However, there are two services you can use if your App ID has a “*” in it: in-app
    purchases and push notifications. These services require that your App ID is unique—for
    instance, L4A3627.com.mycompany.appname.'
  merge: -1
