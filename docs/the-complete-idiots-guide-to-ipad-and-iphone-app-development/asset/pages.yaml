    # iPhone Developer Program


    The SDK download is large — a few gigabytes in size — so you should be prepared
    to wait a while for the download to finish. In the meantime, you have a great
    chance to learn about the iPhone Developer Program. You might be thinking: *Didn''t
    I just sign up for the iPhone Developer Program?* It turns out Apple makes a distinction
    between a “Registered iPhone Developer” and a developer in the “iPhone Developer
    Program.” At this point, you are a Registered iPhone Developer, which gives you
    access to the SDK, the website, and all the online resources Apple has to share.
    You are free to run your apps in the iPhone Simulator, a program that comes packaged
    with the SDK and allows you to test your apps on your Mac.


    As a Registered iPhone Developer, however, you can''t run your application on
    your iPhone or iPod Touch. You also can''t distribute your apps in any way — including
    the App Store. If you want the ability to run your app on a real device and eventually
    release your app to the public, you need to register for the iPhone Developer
    Program. And this program, sad to say, is not free. There are two ways to join
    the iPhone Developer Program: Standard and Enterprise.


    The Standard program currently costs $99 and lasts for one year. With this program,
    you can run your apps on your phone. After signing up, you can also release your
    app on the App Store. If you want to beta test your app, you can put your app
    on a limited number of devices (currently 100).'
  merge: -1
