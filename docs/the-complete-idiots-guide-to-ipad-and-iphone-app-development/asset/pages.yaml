  md: '# Chapter 10: Web Views, Spinners, and Alerts


    Speaking of which, how do you know if the web view fails to load the web page?
    Remember, the Internet is not a big truck. It''s a series of tubes. Tubes can
    get clogged, and your load request can fail.


    It turns out you can be notified when that happens by implementing the UIDelegate
    protocol. Before covering the protocol, however, let''s take a moment to look
    at alert views.


    # Alert Views


    If you have ever seen a low battery message on your iPhone or iPad, then you have
    seen an alert view. Alert views are primarily used to communicate errors or verify
    a destructive action, like deleting data permanently. Several alert views are
    shown in the following:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_168_0.png)


    Alert view in Mail


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_168_1.png)


    Alert view in Safari


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_168_2.png)


    Alert view in RunMonster


    Alert views are used primarily to display error messages but can be used to verify
    a destructive action as well.


    You can launch an alert view for your own application using the UIAlert class.
    You can see how to pop up your alert view in the following code, where you report
    a loading error to the user.


    # THERE''S A TIP FOR THAT


    Use alert views only when it is necessary to interrupt your user with an important
    notification. Alert views are very jarring to your user experience, and they are
    overused in many apps.'
