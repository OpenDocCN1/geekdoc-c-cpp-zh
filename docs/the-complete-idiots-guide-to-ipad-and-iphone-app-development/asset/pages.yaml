- img_proc: true
  md: "# An Example\n\nImagine you define a method that creates a new object and returns\
    \ it:\n\n```\n(Person *)makeVoter\n{\n  Person *voter = [[Person alloc] init];\n\
    \n  return voter;\n  // Result: memory leak!\n}\n```\n\nAt first glance, the code\
    \ might look fine, but there is a problem. The voter object leaked because there\
    \ is no corresponding release to balance the alloc/init.\n\nTo fix this, let's\
    \ try adding a release to balance the alloc/init:\n\n```\n(Person *)makeVoter\n\
    {\n  Person *voter = [[Person alloc] init];\n  [voter release];\n\n  return voter;\n\
    \  // Result: voter is deallocated!\n}\n```\n\nThe code is fixed, right? Let's\
    \ count the references: when voter is initialized, the reference count is 1. Then,\
    \ release is immediately called, decreasing the reference count to 0. The voter\
    \ is now deallocated. Then, you return a pointer to the voter, but the pointer\
    \ now points to junk memory!\n\nSo releasing isn't the correct solution, either.\
    \ What's the solution? Autorelease the answer:\n\n```\n(Person *)makeVoter\n{\n\
    \  Person *voter = [[Person alloc] init];\n  [voter autorelease];\n\n  return\
    \ voter;\n  // Result: just right!\n}\n```\n\nAutorelease sends a release message\
    \ to the voter object, but not right away. Instead, voter will stick around long\
    \ enough for the caller to use the makeVoter method to"
