  md: 'Your Mac keyboard may also appear strange if if you have previously used Windows
    machines. Throughout the book, the following symbols will represent the corre-
    sponding keys on your Mac keyboard:


    +   * ⌘ is the symbol for the command key.

    * ^ is the symbol for the control key.

    * Ctrl also refers to the control key.

    * ⇧ is the symbol for the shift key.

    * ⌥ is the symbol for the option key.


    Now that you know some Mac terminology, you can use the following table to translate
    the interface elements you''re accustomed to on Windows to the equivalent on Mac.


    # Translating Windows to Mac


    | Windows | Mac |

    | --- | --- |

    | Explorer | Finder |

    | Taskbar | Dock |

    | Start menu | Apple Menu |

    | Programs folder | Applications folder |

    | Right click | Ctrl-click |

    | Search | Spotlight |

    | Ctrl-C/X/V/tab | ⌘-C/X/V/tab |

    | Control Panel | System Preferences |

