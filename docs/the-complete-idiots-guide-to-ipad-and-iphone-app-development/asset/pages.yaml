    \ the App Store app, which uses a tab controller to organize its views:\n\n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_233_0.png)\n\
    \nEach tab corresponds to a different view controller:\n\nFor iPhone apps, the\
    \ maximum number of tabs in a tab bar display is five. For iPad apps, if you have\
    \ more than the maximum, the tab bar controller will automatically display a “More”\
    \ tab, which lists the rest of the items. You will see how this works in a few\
    \ sections.\n\n# Initializing the UITabBarController class\n\nThe UITabBarController\
    \ class is used to add tab bars to your apps. To initialize a tab bar controller,\
    \ create an array of view controllers, and assign it to the tab bar's viewController\
