  md: 'dailyValueLabel.text = [NSString stringWithFormat:@"@%d%% of a 2000 calorie
    diet", dailyValue];


    The first method, pickerView:titleForRowForComponent:, is used to determine the
    name at the given row in the picker. If you have a multi-column picker, you would
    need to check the component value to the column number. In this case, remember
    that each element in the food array is a dictionary, and you can access the name
    of the food using the objectForKey: method on the dictionary.


    The second method, pickerView:didSelectRowInComponent:, is invoked by the picker
    when a new row is selected. After a new selection is made, you''ll update the
    labels in the interface with the current food information. You can get both the
    name and calorie count from the dictionary and update the foodLabel and calorieLabel
    text properties using this information. Based on the calorie count, you can also
    determine what percentage of a normal 2,000-calorie-a-day the food fills up.


    Note that when formatting the percentage string, there is the potentially confusing
    "%d%%" format. Because % is used as the formatting character, to include an actual
    percent sign in your string, you must escape it using the % character. So "%d%%"
    paired with the integer 25 would be replaced with the string "25%%".


    > THERE''S A TIP FOR THAT


    You can further customize the picker view by implementing more of the delegate
    methods. Check out the API reference for the UIPickerDelegate class to see what
    other methods are available.


    # Try It Out


    The moment of truth approaches: does this all work? Give it a shot—save your project,
    build it, and launch it in the iPhone Simulator. You should see the picker view
    populated with the most calorie-packed foods known to man. If you select a particular
    food, the food details should populate the labels you added to the interface.
    If all that works, you are done!


    Full source code for the finished Ruralfork application is available online at
    http://troybrant.net/iphonebook/chapter9/Ruralfork-done.zip.'
