  md: '# Intro to Animations


    The easiest way to add animations to your application is using the UIView animation
    class methods. For instance, the following code demonstrates how to fade out a
    view:


    ```

    // Start building the animation

    [UIView beginAnimations:nil context:nil];

    ```


    ```

    // Run the animation for 2 seconds

    [UIView setAnimationDuration:2];

    ```


    ```

    // Fade out the label over 2 seconds

    label.alpha = 0;

    ```


    ```

    // Run the animation

    [UIView commitAnimations];

    ```


    The default alpha value for a view starts at 1, which means the view is not transparent.
    Over the course of two seconds, the view will fade out until it is invisible.


    # ONE THING


    Note that all the UIView methods above are called directly on the UIView class
    itself—not on a UIView instance. That''s because beginAnimations:contentText;setAnimationDuration;:
    and commitAnimations are all class methods, not instance methods. Class methods
    were covered in Chapter 5, though this is one of the first times you have seen
    methods used in practice.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_299_0.png)


    So what''s with the weird begin-commit syntax? What other properties can animate?
    Is there a way to know when the animation ends? These questions are addressed
    in the following sections, starting with the strange begin and commit calls.


    Although they are sure to look like, adding animation purely for its own sake
    is not useful. The iPhone SDK making animations so easy that you may be tempted
    to add animations everywhere. However, always ask yourself if an animation is
    really needed before adding one on a whim.


    # CRASH AND LEARN


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_299_1.png)'
  merge: -1
