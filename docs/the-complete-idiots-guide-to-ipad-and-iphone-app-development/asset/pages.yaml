- img_proc: true
  md: 'when garbage collection algorithms can do just as good a job (or better!)?
    Look at Java, C#, or any web programming language today. They all use garbage
    collection and leave you with minimal bandwidth so you can solve real problems
    instead of messing around allocating and deallocating memory.


    In fact, the desktop Mac programming environment offers garbage collection. So
    you may be surprised to find out that the iPhone OS does not use garbage collection
    at all.


    Why did Apple make this decision? In a word: performance. A garbage collector
    is unlike an unruly teenager. It interrupts you when you''re busy, takes forever
    to do chores, and requires a lot of energy to keep under control. Similarly, garbage
    collectors interrupt processes, which precious computing time, and you never know
    when they will finish. The iPhone OS gets away with the garbage collector and
    instead relies on you, the programmer, to make sure memory is managed correctly.


    However, instead of leaving you to the mercy of the C functions malloc() and free(),
    Apple provides a rather elegant system for managing memory: reference counting.


    # Reference Counting


    Reference counting is a system for keeping track of the number of pointers that
    point to the same object in memory. When an object is first initialized, it is
    created with reference count of 1. If another object wants to maintain a reference
    to the first object, then it increments the reference count to 2. When the object
    is done with the referenced object, it decrements the reference count. When the
    reference count reaches zero, the object is deallocated, and its memory is ready
    to be reused.


    To initialize a new object with a reference count of 1, use the alloc/init pattern.


    # alloc/init


    To construct a new object, use the alloc/init methods:


    ```

    Person *voter = [[Person alloc] init];

    // voter now has a reference count of 1

    ```


    > THERE''S A TIP FOR THAT

    A common practice in Objective-C development is chaining message calls together.
    The init message is sent to the result of the [Person alloc] message.'
