  md: '# Chapter 6: Memory Management 87


    | Attribute | Category* | Explanation |

    | --- | --- | --- |

    | nonatomic | Multi-threading | By default, properties are atomic, which incurs
    a small overhead but ensures your properties are thread-safe. If you aren''t using
    threads, use this attribute for a small performance boost. |

    | readwrite | Writability | This is the default writability setting. This attribute
    generates both getter and setter when @synthesize is invoked. |

    | readonly | Writability | Use this attribute to generate only the getter method
    for your property when @synthesize is invoked. |

    | getter= | Getter name | Specifies the name of the getter method to use for the
    property. |

    | setter= | Setter name | Specifies the name of the setter method to use for the
    property. |


    You can define only one attribute for each category.


    As you can see, attributes can drastically change how your property is implemented
    under the hood.


    # Instance Variable Not Required


    Properties are primarily used to automate the generation of the getter and setter
    methods for instance variables in a class. However, they don''t necessarily need
    an instance variable. Including the @property directive in your interface file
    just means that the getter and setter methods must exist in the implementation
    file. @synthesize automatically generates those methods, but you can also define
    them yourself.


    To illustrate this fact, let''s add a property for determining whether the shape
    is a polygon or not:'
