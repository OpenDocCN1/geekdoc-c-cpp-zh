  md: "# DEFINITION\n\n**A stack** is a special collection of items where the last\
    \ item added is the first removed—otherwise known as last-in/first-out (LIFO).\
    \ To add an item to the stack is to **push** the item to the top of the stack.\
    \ Removing an item from the stack is accomplished by **popping** the item that\
    \ was most recently added to the stack.\n\nTypically when setting up a navigation\
    \ controller in your app, you'll provide a view controller to initially display.\
    \ This view controller is known as the *root view controller*. Let's look at how\
    \ you might set up a navigation controller when the application launches.\n\n\
    # DEFINITION\n\nThe **root view controller** is the initial view controller a\
    \ navigation controller displays.\n\n```\n(void)applicationDidFinishLaunching:(UIApplication\
    \ *)app {\nfirstViewController *firstViewController = =\n    [firstViewController\
    \ alloc] init];\nnavController =\n    [UINavigationController alloc initWithRootViewController:firstViewController];\n\
    [firstViewController release];\n[window addSubview:navController.view];\n[window\
    \ makeKeyAndVisible];\n```\n\nIn the previous code, you see a new tactic to build\
    \ your iPhone OS application. Instead of just using the View-based Application\
    \ template to add a single view controller to the window, you create and add a\
    \ navigation controller in code.\n\nYou may also notice that the previous code\
    \ is in the applicationDidFinishLaunching: method. Every iPhone and iPad app has\
    \ an application delegate object that is notified about various application events,\
    \ such as when the application finishes launching. Up to this point, you have\
    \ been able to safely ignore the application delegate. However, now that you are\
    \ going to"
