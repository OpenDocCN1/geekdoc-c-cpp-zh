    - Ruralfork app


    You''re hungry and feel feel like eating out. You''re tired of your usual haunts,
    so you want to try something new. You know you don''t want to break the bank,
    and you know the general area where you want to eat. Wouldn''t it be nice if there
    was an app that could pick a place to eat for you? Well, you might say “there''s
    an app for that,” and it''s called Urbanspoon. Urbanspoon made finding somewhere
    to eat fun. Instead of selecting a restaurant from a list, you use a slot-machine
    interface to specify your criteria (like cost), and then shake the phone to randomly
    pick a place to eat.


    The slot-machine view is a standard view called a picker, and you learn how to
    add one to your own app in this chapter. Before you add a picker, though, you
    must know how to use arrays and dictionaries. To demonstrate how to use a picker,
    you will build Ruralfork, an app for browsing some of the most unhealthy meals
    on the planet.


    # Collections


    The iPhone OS offers two collection classes you will use often in your applications:
    NSArray and NSDictionary.'
