- img_proc: true
  md: 'You will build applications with navigation bars (Chapter 12) and tab bars
    (Chapter 13), but first, you need to know what each individual screen is composed
    of. The purpose of this chapter is to explain exactly what these single screens
    are made of.


    In short, each screen of your app consists of a model containing your application
    data, a view for displaying the screen, and a controller for managing how your
    app behaves. To truly understand iPhone programming, you need to understand this
    MVC relationship. So let''s take a moment to explore what MVC is and how it affects
    you build iPhone apps.


    # MVC


    Have you ever seen (or written) code that consists of roughly one monster class
    that does everything? Somehow it just works, but you have no idea how or why.
    Adding new functionality is an admirable idea, but futile in the end. Everything
    you seems to break something else. Good luck trying to find code you can reuse.


    MVC is a design pattern used to avoid these "spaghetti-code" situations. In MVC,
    classes have clearly defined responsibilities, instead of one class to run your
    application, you have classes managing data, classes displaying data to the user,
    and classes gluing it all together. Segmenting the app into these smaller chunks
    has several advantages, including the fact your code is more reusable, less complex,
    and easier to understand and maintain.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_188_0.png)'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'MVC, shown in the previous image, splits your application into three components:


    +   **Model:** Model classes manage your data, and they often map to real-world
    objects. For instance, in the Twitter app you are going to build, you will create
    a TwitterUser model class for keeping track of the Twitter user''s information.
    Models do not know about controllers or views. That is, a ViewController object
    will never have an explicit pointer to a TwitterViewController object. Because
    of this, model classes are very reusable.


    +   **View:** View classes are all about your application''s appearance. Every
    time you customize UI elements with Interface Builder, you are defining the component
    of MVC. Views do not know about controllers, but sometimes can refer to model
    classes. Views tend to be very reusable.


    +   **Controller:** Controllers are the brains behind your application. They determine
    what happens when a button is tapped, a switch flipped, or a picker picked. They
    need to know about both the model—for accessing application state—and the view—for
    updating the interface.


    Controllers are usually paired with a single view they''re in charge of, and this
    is where the term view controller comes from. In fact, you have been using view
    controllers in all your projects so far: iStock, RuralforkViewController, and
    BrowserViewController to name a few. View controllers are typically application-specific
    and not reusable.


    > DEFINITION


    A view controller manages a single view. As shown in previous chapters, action
    methods in the controller are hooked up with the view to respond to certain events.
    View controllers typically act as the glue connecting views and model objects.


    Perhaps this makes perfect sense to you. Perhaps MVC still sounds more like something
    of sandwich you order than something useful for iPhone development. Either way,
    you will see MVC in action by building your first multi-view iPhone application.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_189_0.png)'
  merge: -1
