  md: '# 170 Part 3: Multi-View Applications


    for managing multiple screens: the navigation bar and the tab bar. Examples of
    both are shown in the following:


    # Navigation bar


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_187_0.png)


    # Tab bar


    Navigation bars are used for hierarchical content. Tab bars are used for separating
    very different screenfuls of content.


    +   * Navigation bars: The navigation bar, casually known as the nav bar, is used
    to organize hierarchical information. The nav bar typically contains the title
    of the view and a button to navigate back up to the previous level in the hierarchy.


    > DEFINITION

    A navigation bar organizes the screens in your app in a hierarchy. Navigation
    bars are always found at the top of the screen and often display a title and a
    back button.


    A tab bar organizes the screens in your app in a tabbed list. Tab bars are always
    found at the bottom of the screen.


    +   * Tab bars: The tab bar, on the other hand, is used to separate views in your
    app that don''t have a hierarchical relationship. Each tab has a self-contained
    view, which means that the view for the tab should not have a relationship to
    any other tab.'
