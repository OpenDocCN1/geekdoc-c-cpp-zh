  md: '# Chapter 8: Text Fields 119


    A delegate is an object that is notified when it needs to handle a task. The delegate
    sends messages by another object that wants to pass off responsibility for a task.
    How do these two objects agree on which messages to send? That''s where protocols
    come in. The delegating class defines a protocol that its delegate must implement.
    Then, regardless of the delegate''s type, the class instance can safely send the
    messages to the delegate.


    # DEFINITION


    The delegate for a class is notified when key events take place. For instance,
    the delegate for UITextField is notified when a key is tapped or when the keyboard
    is dismissed.


    It might sound a bit abstract, but you will see exactly how and why to use delegation
    in the Tiptacular application.


    # Using the API in Xcode


    How are you supposed to know when a class requires a delegate or not? How do you
    find out what properties a class supports or even what messages it responds to?
    You need an API to see what havoc you can wreak using these built-in Foundation
    and UIKit classes.


    Of course, the iPhone SDK would not be complete without documentation, and you
    can conveniently access it in Xcode and on the web. There are several ways to
    get to the information you need:


    +   * Find the class or method you''re interested in, right-click it, and select
    Selected Text in API Reference. This launches the integrated API reference.

    * In Xcode, select Help > Documentation from the top menubar.

    * Search for the class or method name from your web browser. Most of the time,
    the official Apple documentation is in the first few results.

    * Finally, you can always access all the SDK materials on http://developer.apple/iphone/


    Learning to use the API reference is crucial for developing iPhone and iPad apps.
