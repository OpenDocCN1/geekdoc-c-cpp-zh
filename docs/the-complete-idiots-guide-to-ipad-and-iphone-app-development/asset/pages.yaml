  md: '# Building Your App for the App Store


    To complete the app submission process, you must build your app using an App Store
    distribution profile. In Chapter 25, you created a developer profile, which enables
    you to put apps on your own phone. App Store apps need to be built using a distribution
    profile, specially customized so the app can be installed on any iPhone—not your
    own.


    > DEFINITION

    A distribution profile is a type of provisioning profile that allows your app
    to be installed on your users'' devices. An App Store distribution profile is
    used to build your app for distribution on the App Store. See Chapter 21 for more
    information on provisioning profiles.


    To get started, you create an App Store distribution profile. After it is generated,
    install the profile in Xcode and create a new distribution build configuration
    that uses this profile. You make some final adjustments to the application bundle
    before building a distribution build of your app. Finally, after locating the
    .app file, you zip it and upload it to your app management page in iTunes Connect.


    Easy, right? Let''s get started.


    # Step-by-Step


    To prepare and submit your app binary to the App Store, follow these steps:


    > CRASH AND LEARN

    Be sure to follow these steps very closely. One small misstep can throw the entire
    process off, and leave you wading through a mess of bewildering error messages.
    Stay on the straight and narrow, and you will be fine.


    +   1. Log in to http://developer.apple.com/iphone, and select iPhone Developer
    Program Portal under the iPhone Developer Program menu on the right-hand side
    of the screen.'
