- img_proc: true
  md: 'Try each of the four curves to see what each looks like:


    +   - UIViewAnimationCurveLinear: Keep the same speed the entire way.

    - UIViewAnimationCurveEaseIn: Start slow, end fast.

    - UIViewAnimationCurveEaseOut: Start fast, end slow.

    - UIViewAnimationCurveEaseInOut: Start slow, speed up, then end slow.

    This is the default animation curve.


    Use the setAnimationCurve:method to choose an animation curve. For instance, the
    code below uses the “ease out” curve:


    ```

    [UIView setAnimationCurve:UIViewAnimationCurveEaseOut];

    ```


    # Reverse and Repeat


    After moving across the screen, you can animate back to your original spot by
    enabling the animation’s auto-reverse. Add the following code to return to your
    original spot:


    ```

    [UIView setAnimationRepeatAutoreversse:YES];

    ```


    After adding the code, save and run your project. How it reverses direction, slides
    back home, and whoa! What just happened? Right when your view was almost to its
    original spot, it teleported across the screen. Why did it do that?


    When you set view.center to (200,300) in the animation block, you are setting
    the value the animation will end at. When the animation is done, the view will
    be centered at (200, 300), even if it means teleporting from another position.


    There is one way to keep from teleporting after auto-reverse: keep the animation
    going! You can easily repeat an animation by adding the following code:


    ```

    [UIView setAnimationRepeatCount:2];

    ```


    Why set the repeat count to 2? Because when you have auto-reverse enabled, each
    reverse counts against your repeat count. So when using auto-reverse, you must
    set the repeat to 2 to get one full bounce, 4 for two full bounces, and so on.'
