  md: "# Controlling the Spinner\n\nBefore getting to the action sheet, you should\
    \ add the spinner behavior. The spinner will start when the web page begins loading\
    \ and stop when the page has finished loading. Controlling the spinner is quite\
    \ simple: you just call startAnimating and stopAnimating on the UIActivityIndicator\
    \ instance to start and stop the spinner.\n\nBut how do you know when the web\
    \ page has started and stopped loading? UIScrollView has the methods you need.\
    \ Add the following code to your BrowserViewController.m file to see the delegate\
    \ methods in action:\n\n```\n// BrowserViewController.m\n\n// Called when a web\
    \ page loads successfully\n-(void)webViewDidFinishLoad:(UIView*)webView {\n  \
