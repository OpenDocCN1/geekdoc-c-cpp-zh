  md: '# # Tab Bar Controllers


    In This Chapter


    +   - UITabController

    - UITabItem

    - Tab overflow

    - Combining navigation and tab bar controllers

    - Chweeter app


    What happens when you slide to unlock your iPhone or iPad? Do you hear the *click*
    of a latch unlocking. When you open the Camera app, what do you see? You see a
    closed shutter, as if you were using an old-timey, nondigital camera. When you
    type using the software keyboard, what do you hear? The tap-tap-tap of a physical
    keyboard spurts out of the device speakers.


    One of the reasons both iPhone and iPad are so intuitive is because they use these
    physical metaphors. A physical metaphor recreates the properties of a real-world
    object in software. These metaphors help users feel familiar and comfortable while
    using various applications. These features also help communicate exactly how you
    use the apps without needing an instruction manual.


    This chapter covers another physical metaphor used extensively in the iPhone OS:
    tabs. The UITabBarController class is used to organize your views in a flat list,
    one for each tab. You learn how to add both an icon image and a text label to
    each tab, and you see how you can combine navigation controllers and tab bar controllers
    in a single application.'
