  md: '# 26 Part 1: Getting Started


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_43_0.png)


    Xcode settings can save you a lot of time and trouble once you get to writing
    and debugging.


    To access your Xcode preferences, on the top menu, select **Xcode > Preferences**.
    From here, select the following:


    +   * Choose the **Debugging** category, and next to “Start:” select **Show Console**.
    The console displays all log output generated by your application. You will almost
    always need to see the console when debugging, so this setting will bring it to
    the foreground when your app launches.


    +   * Under the **Debugging** category again, check **Auto Clear Debug Console**.
    By default, the console will retain the output from every run of your application,
    which can get very hard to navigate if you have a lot of output. Auto-clearing
    the console will make it much easier to see new output, which is likely what you
    care about anyway.


    +   * Choose the **Text Editing** category, and check **Show line numbers**. Almost
    every IDE has this off by default, but it’s actually a very useful feature. When
    the debugger says you have an error on line 236, if you don''t have line numbers
    displayed, you''re stuck manually counting lines or guessing which line the error
    was. Displaying line numbers is a must for debugging effectively.


    +   * Under the **Text Editing** category again, check **Show page guide**. This
    setting is more of a personal preference than a strict necessity. The page guide
    is a vertical line usually displayed at the 80-character mark in the editor view.
    This visual cue helps to keep the length of each line of code in check since very
    long lines of code are stylistically frowned upon and also hard to read.


    These settings will help you avoid much of the frustration developers experience
    when they get started programming for iPhone and iPad. There are a plethora of'
