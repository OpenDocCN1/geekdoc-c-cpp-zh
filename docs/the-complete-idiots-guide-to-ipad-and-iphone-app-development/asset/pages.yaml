  md: '# Chapter 3: Interface Building


    The view hierarchy also determines the order in which the views are drawn. In
    the previous image, the views are rendered from left to right and top to bottom.
    That is, the window is drawn first, then its subviews, starting with the navigation
    bar. The table view is then rendered, and because it has subviews, the cell views
    are rendered next. Any time you reach a view that has subviews, those subviews
    are rendered moving on to the next view at the current level in the hierarchy.


    # ONE THING


    For tree algorithm fans out there, the view hierarchy is traversed using BFS (Breadth
    First Search).


    However, what does this mean for you, the programmer? The takeaway is that if
    you have two views, one on top of the other, the one that is added last will appear
    on top. Imagine stacking two photographs. If you put them down on the same spot,
    after the other, you will see the second photo because it is on top of the first
    photo. Similarly, the last view you add to the window will be drawn on top of
    the other views.


    Though this may appear obvious, a misunderstanding of the view hierarchy can lead
    to perplexing bugs. In particular, several Stanford students had problems with
    views "disappearing," which was almost always because they were underneath other
    views.


    In this chapter, you are going to use Interface Builder to build your own view
    hierarchy for the ICE app, not nearly as complex as the previous image.


    # Create the Project


    Now that you know a bit more about views, go ahead and create a View-based Application
    for iPhone in Xcode. Name it ICE. Expand the Resources group in & Files section.
    Then, you will find two files that end in .xib: ICEViewController and MainWindow.xib.
    The purpose of these files will be explained in a moment, but for now, double-click
    the ICEViewController.xib to launch Interface Builder.


    # CRASH AND LEARN


    If you accidentally start editing the MainWindow.xib file instead of ViewController.xib,
    you won''t see any changes you make to your interface. Why? The changes you made
    were to the window, not the ICE view. And the ICE view is drawn on top, hiding
    the interface of the window below it.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# What the Heck Is a Nib?


    Interface Builder is loading, let''s take a moment to go over the term used previously:
    nib. When you construct your interface in Interface Builder, the position and
    properties of all your text views, image views, and all other views are saved
    to the nib.


    # DEFINITION


    A nib (NeXT Interface Builder) is a file that defines the interface for a single
    view in your application. Nibs are editable using the Interface Builder application.


    The view objects themselves aren''t stored in the nib. Instead, the blueprint
    for the view objects is stored in the nib. When you run your application in the
    iPhone Simulator, the application engine gets instructions from the nib files
    and builds the interface at runtime.


    Why the funny name? Nibs were historically binaries that ended with a .nib extension—thus
    the name nib—before they were replaced with XML-based .xib files. Today, the .xib
    format is used exclusively in iPhone and iPad development. Regardless of the .nib
    or .xib extension, these files are collectively known as nibs, and that is the
    name you will see for in this book.


    # Interface Builder


    If you see the following image, then welcome to Interface Builder! You will likely
    spend a substantial amount of your time in this application, so it will be your
    while to become intimately familiar with how it works.


    So what exactly is Interface Builder? The name itself is quite descriptive, and
    yes, in fact you do build interfaces with Interface Builder. You can use it to
    visually lay out exactly what your interface will look like, from what fonts to
    use to how you want your images scaled.


    Interface Builder is much more powerful than a layout tool. Say you add a button
    to your interface. Using Interface Builder, you can have one of your methods called
    when the button is tapped. So, not only do you use Interface Builder to define
    what your button will look like, you use it to determine how your interface behaves
    when the user taps the button.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Chapter 3: Interface Building 41


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_58_0.png)


    Reader, meet Interface Builder. Interface Builder, reader. The two of you will
    know one another very well over the course of this book.


    Another big difference from other interface design tools that you may have used
    that you won''t ever write code in Interface Builder. You simply connect interface
    elements to objects and methods that have been defined elsewhere in your project.


    For ICE, you will focus solely on the visual side of Interface Builder. Before
    jumping in, you should take a few minutes to familiarize yourself with the multiple
    windows of Interface Builder.


    # The Grand Tour


    There are four primary windows you will use when creating an interface in Interface
    Builder:


    +   * Document window: The document window, as shown in the previous image, gives
    you a bird''s-eye view of your interface. You can ignore the File''s Owner and
    First Responder objects for now (they will be covered later). The View object
    is the root node in the view hierarchy, so it contains all the views in interface.


    > THERE''S A TIP FOR THAT


    In the top-left corner of the document window, you will find the large icon selected
    by default. I highly recommend changing it to list mode, the middle option. In
    list mode, you can see the entire view hierarchy by expanding the arrow next to
    the View object.'
