  md: '# Chapter

    22


    # Tools of the Trade


    In This Chapter


    +   * Clang

    * Instruments

    * Shark


    Imagine that you need to take your car in for a tune-up, but your favorite auto
    shop is closed. Instead, you decide to try out a different auto shop down the
    road. When you arrive, instead of a garage bustling with activity, there’s a smiling
    mechanic standing in the middle of an open parking lot. You drive up, roll down
    your window, and he says, “Looks like you need a new carburetor, air filter, and
    your transmission needs to be replaced.” You stare at the mechanic in disbelief,
    roll up the window, and drive off to find a real auto shop.


    What was wrong with the parking lot auto shop? Why didn’t you trust the mechanic’s
    judgment? Well, he looked at your car to come up with his diagnosis. He didn’t
    use any tools to see what was really going inside. The mechanic may very well
    have been right, but how could he sure without running the car through a battery
    of tests?


    The exact same situation applies to iPhone programming. The car is your application,
    the driver is you, and the mechanic is you, the developer. Instead of eyeballs
    your code like the mechanic in the parking lot, you can use several development
    tools to properly assess problems. In this chapter, you will learn about three
    of these tools: Clang, Instruments, and Shark. By the time you’re done, you won’t
    just be a mechanic in a parking lot; you’ll have your own garage full of state-of-the-art
    equipment.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# Three Tools Every iMechanic Should Master


    All apps should run through three tools before you even think about putting them
    on the App Store. Using these tools could prevent many of the problems that plague
    applications—namely, poor performance and memory problems. So what are these tools?
    Here''s a quick overview:


    +   **Clang Static Analyzer:** The Clang Static Analyzer—or just "Clang" for short—is
    great for identifying memory leaks. Clang is unique in that it doesn''t attach
    to a running process. Instead, it goes through your uncompiled code to perform
    its analysis. Clang provides a diagnostic report about your code, which includes
    potential problem areas and optimizations in addition to memory leaks.


    +   **Instruments:** Instruments is also great for finding memory leaks. You can
    use it to monitor CPU usage, memory usage, animation performance, and 3D graphics
    performance. It comes packaged with the iPhone SDK, so you have already installed.


    +   **Shark:** Shark is used to determine where your application spends 90 percent
    of the time in one method, you know that rewriting or optimizing that method will
    give your app a huge performance boost. Shark will help direct these optimization
    efforts.


    # CRASH AND LEARN


    Although Instruments and Shark can be used with the iPhone Simulator, the only
    way you''ll get accurate information from these tools is by using them with your
    app running on a real device.


    The purpose of this chapter is to enable you to use these tools. However, it will
