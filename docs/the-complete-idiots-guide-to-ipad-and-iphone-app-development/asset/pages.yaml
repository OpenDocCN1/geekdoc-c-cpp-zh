  md: "# Part 1: Getting Started\n\nNow, the only thing left to do is program the\
    \ button behavior. And for that, you are going to jump back to Xcode.\n\n# Make\
    \ the Button Do Something Interesting\n\nIn Objective-C, a single class is split\
    \ across two files: the interface file and the implementation file. Interface\
    \ files end in .h and contain the public class definition. You define both the\
    \ instance variables and the methods you want visible be to the entire world in\
    \ the interface file. Implementation files, on the other hand, are where you write\
    \ the bodies of those methods. In Chapter 5, interface and implementation files\
    \ are covered in great detail.\n\nEarlier, you edited iViewController.h, which\
    \ is the interface file for the iViewController class. Now that the interface\
    \ is defined, you must edit the implementation file. Go ahead and select iViewController.m\
    \ in the Groups and Sections.\n\nWhen the file is selected, you will see some\
    \ commented of code and a few methods defined at the bottom of the file. You won't\
    \ use any of these methods right now, but feel free to read over the text descriptions\
    \ above each one to see what they do.\n\nThe goal in editing this file is to define\
