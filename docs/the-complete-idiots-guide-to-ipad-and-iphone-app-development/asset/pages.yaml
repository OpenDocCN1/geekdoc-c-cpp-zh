  md: '# Chapter 5: Objective-C and Cocoa Touch


    To get a better handle on Objective-C, the following sections walk you through
    the syntax and conventions used in the language.


    # Named Parameters


    If you have worked with languages like Java, C, PHP, or almost any other popular
    programming language, you are likely familiar with code like the following:


    ```

    String xml = xmlParser.parse("data.xml", 4);

    ```


    You can probably figure out the first parameter, but what does 4 mean? You normally
    have to hunt down the definition of the parse method or look it up in the documentation
    (if it exists) to see what that second parameter does.


    Objective-C takes a more verbose approach by requiring named parameters in method
    names. In Objective-C, the parse method would look something like this:


    ```

    NSString *xml =

    [xmlParser parseDocumentNamed:"data.xml" maxDepth:4];

    ```


    Notice how much more readable the method name is! Every time you call a method,
    you include the parameter names in the method call itself. This makes Objective-C
    code much more self-documenting and easy to understand compared to languages that
    do not use named parameters.


    # Messages, Selectors, and Methods


    When a method is invoked on a particular object, new terminology is used to describe
    this method call. Here is the breakdown:


    +   - Message: Tells an object to invoke a particular method.


    +   - Receiver: The object which receives a message.


    +   - Selector: The string of characters that represent the name of a message.


    +   - Method: The code that is invoked when a message is sent to a receiver.


    To make this relationship a bit more clear, take the following example:


    ```

    // Assume voter is a valid object and castBallot is defined

    Person *voter = ...;

    [voter castBallot];

    ```'
