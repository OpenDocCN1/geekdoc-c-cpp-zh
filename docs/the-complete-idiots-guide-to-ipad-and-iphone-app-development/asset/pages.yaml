  md: '# # Chapter 14

    # Table Views


    +   ## In This Chapter

    * Table views

    * Populating table view data using delegation

    * NSIndexPath

    * Row selection

    * Integrating table views and navigation controllers

    * Frenemies app


    What user interface element are you most likely to use in your app? A button?

    Possibly. A text field? Perhaps. An image of a cat pleading, "I can haz cheezburger?"

    More than likely. But there is one interface element that you will undoubtedly
    use

    time and again in your apps: the table view.


    Consider this statistic: all but one of Apple''s built-in applications use table
    views (that

    one being the Calculator app). Table views are a flexible and effective way to
    display

    lots of data. In this chapter, you learn how to use UITableView in your own apps
    to

    display lists of content.


    Intro to Table Views

    Visually, you can think of a table view as a scrollable list. Like a list, the
    table consists

    of a single column with multiple rows. Table views are very scalable, supporting
    large

    data sets of up to 10,000 items. You can use them to display flat lists of information,

    such as grocery or to-do lists.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Part 3: Multi-View Applications


    Multiple table views are often chained together to display an information hierarchy,
    with each displaying a single level. For example, a sports application may use
    a table to display a list of teams. When a team is selected, a new table view
    slides into view displaying a list of players on the selected team. When a player
    is selected, a table view slides into view displaying the selected player''s individual
    statistics.


    To enable these types of interactions, table views are often combined with navigation
    controllers. The Frenemies sample app you build later in this chapter demonstrates
    how to combine the two.


    # Table View Breakdown


    Table views come in two styles: plain and grouped. Check out the Mail app to see
    examples of the plain table view style. You can see the grouped style at work
    in the Settings app. Here is a visual breakdown of the two styles and their components:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_253_0.png)


    You cannot change the table view style after it has been initialized.


    As you can see in the previous image, tables consist of sections, which in turn
    consist of rows. Each section can have a header and footer. The table as a whole
    can also have header and footer views. In the image, a UILabel is used to display
    the text at the top and bottom of the table.


    # Populating the Table


    In code, a table view is represented using the UITableView class. The UITableView
    class gives you a lot of control over what the table looks like, but it doesn''t
    give you'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Chapter 14: Table Views 237


    a direct way to set the data table displays. Instead, table views use delegation
    to populate the data table.


    # THERE''S A TIP FOR THAT


    I highly recommend looking through the UITableView API documentation provided
    by Apple. As a reminder, you can access the API by selecting Help > Documentation
    in Xcode.


    To populate the table cells, the table needs its dataSource property set to a
    class that implements the UITableViewDataSource protocol. There are three primary
    methods the table calls on its data source to determine what data is displayed:


    +   // This method is optional. The default number of sections

    // is set to 1 if not implemented.

    - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView;

    // This method is required. The method passes you the section

    // number, and you need to return the number of rows in the

    // particular section.

    - (NSInteger)tableView:(UITableView *)tableView

    numberOfRowsInSection:(NSInteger);

    // This method is required. In addition to the setting

    // number of sections and rows in the table, you are responsible

    // for generating and returning the table view cells themselves

    // using this method.

    - (UITableViewCell *)tableView:(UITableView *)tableView

    cellForRowAtIndexPath:(NSIndexPath *)indexPath;


    The view itself has no idea what it will display before asking the data source.
    One of the benefits of this approach is a spectacular performance boost. Instead
    of having to create 10,000 rows up front, the table can just ask the data source
    for the 10 rows that are currently on the screen. By offloading the cell creation
    to the data source, you can also customize the table on the fly by returning your
    own UITableView subclasses.


    # ONE MORE THING


    Although the table data source may seem new and exotic, you have already seen
    the data source pattern once before: in Chapter 9 when covering picker views,
    which also use a data source. If you''re trouble grasping the idea of a data source,
    look back at how data sources were used in Chapter 9.'
