  md: '# Stay Classy, iPhone Developers


    And that, my friends, does it for The Complete Idiot''s Guide to Developing iPad
    and iPhone Apps. If you have made it this far, I thank you and commend you on
    coming along for the ride. It takes an enormous amount of effort and resilience
    to learn a new programming language, a new IDE, and a new operating system, and
    to reach this point is an extraordinary accomplishment. You should be proud, and—if
    I have done my job right—you should also be inspired and confident moving forward
    building your own iPhone and iPad apps.


    # Muscle Memory


    When I out to write this book


    Muscle memory is why you built 19 sample apps over the course of this book. Muscle
    memory is why most of the chapters have an Interface Challenge section where you
    were tasked with building parts of the application with minimal instruction. If
    someone were to ask you to build an iPad app or an iPhone app with X interface
    and Y features, you now know exactly how to start.


    # Next Steps


    Moving forward, there is still a lot of territory for you to explore as an iPhone
    developer. There are many great topics out there still to learn, including:


    +   - Push notifications

    - In-app purchases

    - iPod and music integration

    - Peer-to-peer Bluetooth networking using GameKit

    - Compass (3GS and above)

    - Contacts using AddressBook

    - Accelerometer

    - 3D graphics using OpenGL'
