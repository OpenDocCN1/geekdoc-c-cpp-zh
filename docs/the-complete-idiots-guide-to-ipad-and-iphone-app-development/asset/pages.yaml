  md: '# About the Author


    Troy Brant is an iPad engineer at Flipboard, a startup in Palo Alto, California,
    developing the world''s first social magazine application. Troy is also co-developer
    of the RunMonster iPhone application. An avid runner himself, and he his co-developer
    immersed themselves in iPhone programming to develop the ideal application for
    runners.


    Troy holds a Master''s degree in Computer Science from Stanford University. While
    there, he served as head teaching assistant for the wildly popular iPhone programming
    class during the 2008–2009 school year. This groundbreaking class was a joint
    effort between Apple and Stanford, making history when the lectures were downloaded
    over a million times from iTunes.


    Prior to attending Stanford, Troy graduated with a Bachelor''s degree in Computer
    Science from the Georgia Institute of Technology. At Georgia Tech, Troy got his
    start working as a teaching assistant in several software development classes.


    When not working on Flipboard, Troy can be found running around Silicon Valley,
    testing the latest build of RunMonster.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_450_0.png)'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# A hands-on approach to becoming a developer in no time!


    You love technology and you really want to get in the app development game. You
    have all kinds of ideas you''d like to turn into apps. But it turns out designing
    those cool little programs isn''t nearly as simple as using them.


    Oh, but it can be! This comprehensive guide gives you the easiest path from start
    to success. It helps you master the apps development kit so you can start building
    your app right away. In it, you get:


    +   - Totally understandable instructions that will have you developing apps in
    no time at all.

    - Step-by-step explanations for using the iPad™ and iPhone™ software development
    kit.

    - Expert tips for data management, networking, and animation.

    - Foolproof techniques for debugging your app.

    - Savvy strategies for getting your finished app into the App Store.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_451_0.png)


    Troy Brant is a graduate student at Stanford University and has been a teaching
    assistant for the iPhone™ development course since the class was first offered.
    He graduated from Georgia Tech with a Bachelor''s degree in Computer Science.
    He has personally developing applications for the iPhone™ for the past year, and
    five of those months were spent teaching students who had no previous Mac or Objective-C
    experience.


    Visit us online at idiotsguides.com


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_451_1.png)'
  merge: -1
  pgno: 451
