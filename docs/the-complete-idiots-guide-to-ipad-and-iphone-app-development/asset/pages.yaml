  md: '# Knowing when an Animation Ends


    If you add an animation to your application, it is likely you would like to know
    when the animation finishes. Maybe you want to trigger an action, like displaying
    an alert box. Or maybe you want to start a *second* animation when the first one
    completes. Luckily, UIView provides just methods via an animation delegate.


    The way you add the delegate is a bit strange, but it works the same as the previous
    times you have used delegation. After you assign yourself as the animation''s
    delegate, your delegate methods will be called automatically.


    To learn when the animation finishes, you need to have the following method implemented:


    ```

    // Called when the animation stops

    -(void)animationDidStop:(NSString *)animationID

    finished:(NSNumber*)finished

    context:(void*)context;

    ```


    Here''s the strange part: when you assign the delegate for the animation block,
    you must also specify the method to be called when the animation finishes. Here
    is what the sample code earlier in the chapter looks like with the addition of
    a delegate:


    ```

    // Start building the animation

    [UIView beginAnimations:nil context:nil];

    [UIView setAnimationDuration:2];

    ```


    ```

    // Be informed when the animation stops

    [UIView setAnimationDelegate:self];

    [UIView setAnimationDidStopSelector:

    @selector(animationDidStop:finished:context:

    ```


    ```

    // Fade out the label over 2 seconds

    label.alpha = 0;

    ```


    ```

    // Run the animation

    [UIView commitAnimations];

    ```


    > THERE''S A TIP FOR THAT

    If your delegate method for animation completion is not being called, sure you
    specify the selector as shown in the previous sample code.'
