- img_proc: true
  md: '# Chapter 18: GPS and Location Management 319


    As indicated in some of these property descriptions, the CLLocation object reports
    distance values in meters. Those in metrically challenged countries would likely
    prefer to use units in feet and miles instead of meters and kilometers. It is
    up to you, the developer, to make conversion. You see how it''s done in the sample
    application a bit later on.


    In addition to providing useful properties, CLLocation can calculate the distance
    between two locations. To find the distance between two CLLocation objects, use
    the distanceFrom: method, as shown in the following:


    ```

    CLLocation *location1 = ...;

    CLLocation *location2 = ...;


    // Compute the distance in meters between the two locations

    double distanceInMeters = [location1 distanceFrom:location2];

    ```


    These CLLocation objects do seem neat, but how do you get them populated with
    real location data? Say hello to CLLocationManager.


    # CLLocationManager


    The CLLocationManager is the class responsible for generating CLLocation objects
    for your user''s position. Like most APIs in the iPhone SDK, CLLocationManager
    reports location changes using delegation. To receive these updates, you must
    adopt the CLLocationDelegate protocol and assign yourself as the manager''s delegate.


    # CLLocationManagerDelegate


    Let''s take a look at the methods that should be implemented by an object that
    adopts the CLLocationManagerDelegate protocol:


    ```

    // Called every time a new location reading is available

    -(void)locationManager:(CLLocationManager *)manager

    didUpdateToLocation:(CLLocation *)newLocation

    fromLocation:(CLLocation *)oldLocation;

    ```


    ```

    // Called when there was an error determining the location

    -(void)locationManager:(CLLocationManager *)manager

    didFailWithError:(NSError *)error;

    ```'
