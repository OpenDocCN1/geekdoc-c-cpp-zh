    you will actually build your interface. In the image that follows, the workspace
    window is sized for iPhone. If you are building an iPad app, the window will match
    the size of an iPad instead.


    If you close the workspace window, you can open it by double-clicking the View
    object in the document window.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_59_0.png)


    Document window is on the left. The workspace window is on the right.


    +   **Inspector window:** The inspector window is not displayed when Interface
    Builder is first opened. To view the window, select **Tools > Inspector** from
    the top menu bar.


    Context-sensitive information about the currently selected object is displayed
    in the inspector window. The buttons along the top act as tabs. From left to right,
    the tabs are Attributes, Connections, Size, and Identity. For instance, if you
    click the workspace, you can use the Attributes tab to specify the view''s background
    color, transparency, and whether it is hidden.


    +   **Library window:** Buttons, text fields, image views, and many more built-in
    views can be found in the library window. To add any of the views to your interface,
    simply click and drag the view you want and release it on the workspace window.
    Drag-and-drop is king in Interface Builder.'
