    You have just roughly approximated the experience of almost every Cocoa developer
    to come before you. EXC_BAD_ACCESS is a sign of problems with memory management
    in your app. Memory management is by far the leading cause of pain and misery
    for new iPhone and iPad developers. However, the rules for memory management are
    quite simple. Applying them consistently in your application is the hard part.
    In this chapter, you learn the rules, best practices, and common errors associated
    with memory management in order to master the topic that has tripped up countless
    developers, including myself.


    # # Introduction to Memory Management


    Now, wait a minute. Haven''t we as a species advanced to the point where we don''t
