    # Wrapping Up


    Location-based applications will undoubtedly become more and more part of your
    daily life. By using the Core Location framework, you can easily ride the wave
    and add location support to your own applications. Using the API only requires
    you to use two classes: CLLocation and CLLocation. Using the CLLocation object,
    you can get the user''s latitude, longitude, and even their current altitude.
    Since there is always some degree of inaccuracy, you can access the horizontalAccuracy
    and verticalAccuracy CLLocation properties to show how sure the phone is of position
    data. By building the Distance app, you found out how to filter out bad location
    data, convert meters to miles, and start getting updates from the CLLocationManager.


    Next chapter, learn how to integrate with two exciting new APIs in iPhone OS 4.0:
    iAd and multitasking.


    # The Least You Need to Know


    +   - The Core Location framework contains just two classes you need to know to
    make a location-enabled app: CLLocation and CLLocationManager.

    - The radius of uncertainty, displayed as a blue transparent disk in the Maps
    app, is a measure of the accuracy of a location reading.

    - To receive location updates, your controller must conform to the CLLocationDelegate
    protocol and define the locationManager:didUpdateLocation:fromLocation:method.

    - Core Location can report inaccurate location data, so you should verify that
    the reported location is valid before using it.'
