  md: 'before it’s displayed to the user. You can override these lifecycle methods
    in your view controller subclasses.


    Here''s a brief description of each view controller lifecycle method:


    +   - awakeFromNib: If you built the view for your view controller in Interface
    Builder, then awakeFromNib is called just before the view is unpacked and initialized
    from the nib file.


    +   - loadView: After awakeFromNib, loadView is called. loadView is where you
    can programmatically add views to the interface.


    # ONE THING


    Here’s a little secret you should be aware of: you don’t need Interface Builder
    to build your interface. It is quite possible to create your entire interface
    programmatically in loadView. There is no inherent advantage to writing the code
    by hand, in this book, you will continue to use Interface Builder to visually
    lay out the interface for each app.


    +   - viewDidLoad: Regardless of whether a view was created programmatically or
    loaded, viewDidLoad is called after the view has been fully loaded into memory.


    +   - viewWillAppear: The viewWillAppear: method is called immediately before
    the view controller’s view appears onscreen. However, viewWillAppear: can be called
    multiple times throughout the lifetime of the view controller. In Tweet, every
    time you flip between the Tweet and Settings view controllers, the viewWillAppear:
    method for each of them is called.


    +   - viewDidAppear: The viewDidAppear: method is called after the transition
    animation to the view controller has completed.


    +   - viewWillDisappear: The viewWillDisappear: method is called—you guessed it—right
    before the view disappears. Specifically, this is when the user navigates away
    from the current view, but before any animation starts.


    +   - viewDidDisappear: The viewDidDisappear: method is called after the transition
    animation away from the current view controller has completed.


    +   - viewDidUnload: The viewDidUnload method is called in low-memory situations.
    Specifically, when the view controller is not visible and receives a


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_206_0.png)'
