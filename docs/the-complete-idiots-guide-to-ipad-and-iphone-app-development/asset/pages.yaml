  md: '# Chapter 10: Web Views, Spinners, and Alerts 157


    # DEFINITION


    An action sheet displays a list of choices to the user when a toolbar button is
    tapped. An action sheet should be used for presenting multiple ways of completing
    a task or for confirming a particularly dangerous action.


    In code, action sheets are implemented using the UIActionSheet class. You will
    implement the UISheetDelegate protocol to determine which bookmark is selected.


    # Spinners


    Spinners are animated indicators that let you know that an app is working on something.
    The Browser app in its current form just displays a white screen and provides
    no feedback whatsoever whether the web page is loading. Users will see that white
    screen and think, “Is the app frozen?” Spinners solve this problem by providing
    subtle feedback that, in fact, the app is working hard to complete the task.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_174_0.png)


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_174_1.png)


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_174_2.png)


    Spinners give users reassurance that even though the screen hasn’t changed, the
    app is hard at work.


    # DEFINITION


    A spinner is an animated indicator informing the user the app is performing a
    task in the background. Any time your app can take more than a few seconds to
    complete a task, a spinner should be displayed to the user.'
  merge: -1
