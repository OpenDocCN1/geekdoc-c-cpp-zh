    GPS,

    accelerometer, or iPod APIs. You need to make sure your app performs well on a
    real

    device, and perhaps most importantly, you want to show your friends what you''ve

    been working tirelessly on these past few weeks.


    The process of putting your own applications on your phone is called provisioning.
    In

    this chapter, you will walk through each step required to provision your phone
    with an

    app. You will register for the iPhone Developer Program, create a provisioning
    profile

    using the iPhone Developer Program Portal website, install the provisioning profile

    in Xcode, and change the Xcode project settings to run on a device instead of
    the

    simulator. It may sound complex, but we''ll take it one step at a time and have
    apps

    running on your device in no time.'
