  md: '# GDB Functions


    After your breakpoint is hit at runtime, you need some way to advance through
    the code. Using the debugger, you have a few options:


    +   - Step over: You can choose to step over the line of code the debugger currently
    stopped on. This means you move to the line of code immediately after the line
    highlighted in blue.

    - Step into: If the line you stopped on contains a method call, you will move
    to the first line of that method if you step into it.

    - Step out: To execute all the remaining lines in the current method, use the
    step out option.

    - Continue: Finally, to resume normal execution of your app, use the continue
    option.


    The debugger view in Xcode is optimized for these debugging tasks and for displaying
    information. If the debugger window does not appear automatically, you can access
    it by selecting Run > Debugger from the top menu. A breakdown of the debugger
    window interface is shown in the following:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_375_0.png)


    Take some time to learn how to use the debugger view.'
  merge: -1
