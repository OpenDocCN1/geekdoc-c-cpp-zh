    # Protocols


    A protocol is a contract that declares a set of methods, which a class must implement.
    Protocols are equivalent to a Java interface (not to be confused with the Objective-C
    interface file). In this way, you can ensure that objects of various classes all
    respond to a particular message.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_133_0.png)


    > A protocol defines a set of methods class must implement. When a class adopts
    a protocol, it needs to provide a body for each method defined in the protocol
    or the Xcode compiler will produce a warning. Protocols are used to guarantee
    that objects of different classes respond to a particular message.


    # Required Versus Optional Methods


    A protocol can contain both required and optional methods. Methods under the @required
    directive in a protocol must be implemented in a class that adopts the protocol.
    Otherwise, a build warning will result. Methods under the @optional directive
    in a protocol can be implemented, but classes can choose whether to implement
    them or not.


    For example, here is the definition for a protocol named “Edible” that requires
    the calories method to be defined. The fat, protein, and carbs methods can option-ally
    be defined.


    ```

    // Edible.h

    @protocol Edible <NSObject>

    @required

    ```'
