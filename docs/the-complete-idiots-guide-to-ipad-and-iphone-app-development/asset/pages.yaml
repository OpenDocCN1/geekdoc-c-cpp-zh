    "You can type in what you''re doing, what you''re thinking ... it''s like reverse
    stalking." Evan Doll, one of the instructors of the iPhone programming class at
    Stanford, used this excellent description of Twitter while introducing a class
    project. The project was called Presence, a multi-view Twitter app intended to
    introduce students to topics as Model-View-Controller (MVC), delegation, and views.


    There were new challenges for the students to tackle in the Presence app. How
    do you set up the project to support multiple views? How do you transition between
    views? How do you keep track of state and pass data between the views?


    In this chapter, you learn the answers to all these questions. MVC, modal views,
    and view controllers are covered. To put these skills to use, you build the Tweet
    app, so you too can "reverse stalk" yourself to the world.


    # Multi-View Applications


    iPhone apps, as you know, have limited screen real estate when compared to their
    desktop counterparts. Even iPad apps have a small screen compared to most desktop
    applications. It''s almost inevitable that an app you want to write will need
    to have multiple screens. When Apple developed the iPhone, they came up with two
    solutions'
  merge: -1
