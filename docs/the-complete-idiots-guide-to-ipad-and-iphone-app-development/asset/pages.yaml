  md: '# Chapter 23: The App Store and Beyond


    +   - In-app Mail integration

    - Battery status


    As new iPad, iPhone, and iPod Touch models are released, there will undoubtedly
    be even more APIs to play with. Your greatest weapon in learning these APIs is
    Apple’s own API documentation. For the most part, they are clearly written and
    helpful in explaining how to use the APIs.


    Sure, I may be a little biased, but you should also check out the CS193P Stanford
