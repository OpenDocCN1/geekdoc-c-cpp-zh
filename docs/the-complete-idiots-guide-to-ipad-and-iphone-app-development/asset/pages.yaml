    # Pushing View Controllers


    When you want to show a new view controller using the navigation controller, you
    push it onto the navigation stack. Let''s say that your navigation controller
    is displaying a view controller called SettingsViewController. To display a new
    view controller, you use the pushViewController:animated: method, as shown in
    the following:


    ```

    GeneralViewController *generalViewController =

    [[GeneralViewController alloc] init];

    ```


    ```

    [self.navigationController

    pushViewController:generalViewController

    animated:YES];

    ```


    ```

    [generalViewController release];

    ```


    GeneralViewController—the middle view controller in the previous image—will slide
    horizontally onto the screen. Without any additional code on your part, a back
    button will appear in the navigation bar. When the user taps it, the GeneralViewController
    will be popped off the navigation stack, and the SettingsViewController will slide
    back into view. Notice that view controllers can access their parent navigation
    controller using the self.navigationController property.


    # CRASH AND LEARN


    You will almost never pop view controllers off the navigation stack yourself.
    Let the built-in back button do the work for you.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_215_0.png)


