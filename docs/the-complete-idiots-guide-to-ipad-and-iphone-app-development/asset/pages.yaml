  md: '8. This will switch back to Xcode and highlight the line of code. You will
    see on this line that the code calls alloc/init on an NSDateFormatter object.
    Is there release or autorelease to balance the alloc/init? Nope—that’s the problem.
    Add in a release, and the leak is fixed.


    At this point, you should go back to Instruments and see if there are any other
    leaks you can fix right now. Save your code, and run it through Instruments again
    to see if there are any new leaks that pop up. Rinse and repeat until Instruments
    doesn’t indicate any remaining leaks.


    # ONE MORE THING


    Sometimes leaks occur in system code. Other times, Instruments erroneously identifies
    a leak that doesn’t actually exist. Always make sure that you understand the cause
    of a leak before adding a release or autorelease call to your code.


    # Shark


    And now, time for something completely different. Imagine you have already run
    your application through Clang and squashed the reported bugs. You then run your
    app through Instruments, and it gives your app a clean bill of health. But when
    you run your application, you can’t help notice that it has choppy scrolling or
    lags when you tap a button. The performance is just awful. How do you go about
    sure your app runs smooth as butter?


    Introducing: Shark. Shark profiles your application to determine how much time
    is spent in various. Profiling is the process of sampling code at runtime. Using
    Shark, you can see where to get the biggest bang for your buck when optimizing
    your code. If 90 percent of your CPU time is spent in a single method, while 10
    percent is spent in all the rest of your code combined, then it’s probably a good
    idea to work on optimizing the 90 percent method.


    In this section, you will again use the EveryDayCounts app as the guinea pig.
    When the EveryDayCounts app is run on a physical device—not the iPhone Simulator—you
    will notice that the app hangs when you tap the Populate Table in the app. Using
    Shark, you can figure out what your code is doing during that long delay. Let’s
    give it a shot.'
