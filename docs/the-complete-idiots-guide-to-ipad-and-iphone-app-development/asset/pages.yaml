  md: '# # The App Store and Beyond


    # Chapter

    23


    # ## In This Chapter


    +   - Learning the app submission process

    - Building your app for App Store distribution

    - Tips to avoid app rejections

    - Farewell


    Could the title of this final chapter be any more melodramatic? Perhaps if there
    were an echo: "The App Store ... AND BEYOND! ... ond ... ond ... ond." Even though
    the title is as cheesy as you come, it does at least indicate that you have reached
    the end of the road for this book. The very last stop on your journey to developing
    iPhone and iPad applications is learning how to submit your apps to the Store.


    As it turns out, the App Store submission process is relatively painless. You
    fill out a lot of forms, but that is the worst of it. The “Beyond” part of the
    app submission process, is filled with potential pitfalls. After submitting to
    the App Store, your app goes through an approval process that is mysterious and
    not well understood. In this chapter, you learn both the technical details of
    submitting your app and the steps you can take to maximize the chance your app
    is approved.


    # ## Intro to the App Submission Process


    Perhaps you are reading this chapter having completed your first app. If so, then
    first let me say "Congrats!" There are many who start learning iPhone programming,
    but very few actually have the tenacity and perseverance to completely finish
    an app and release it to the App Store. Hats off to you for reaching this point.'
  merge: -1
  pgno: 410
- img_proc: true
  md: 'However, if you are reading this chapter before finishing—or even starting—the
    app you want to release, then you should still keep reading. Even without a finished
    product, there is much you can—and should—do before you upload your application
    binary to the App Store.


    # DEFINITION


    An application binary—or app binary for short—is the .app file generated for your
    application when built successfully in Xcode. The application binary is the “app”
    that will be installed on your users'' devices. For any Xcode project, the .app
    file can be found in the Products group in the Groups & Files panel.


    # Three Steps


    From a bird''s-eye view, there are three major steps required to submit your app
    to the App Store, summarized below:


    +   - Step 1: Request paid contract—If you plan to sell your app at any point,
    your first step is to request a seller''s contract from Apple.

    - Step 2: Add application—Even if you haven''t completely finished developing
    your app, you can add the app in iTunes Connect. This is especially useful for
    reserving an app name.

    - Step 3: Submit app binary—Once your app binary is uploaded, your app will officially
    enter the App Store review queue.


    Of these steps, only submitting the application binary requires that your application
    is actually done. In fact, you can complete steps 1 and 2 right now.


    If you are considering selling your app, you should go ahead and request a contract
    now. It doesn''t take too long, and there is a short approval process your your
    request must go through separate from the app approval process. So it''s better
    to do it sooner later.


    You can also add your application right this moment even if you haven''t finished
    the app. The App Store requires each app a unique name, and the advantage of adding
    your app now is you can prevent someone else from using the name before you.


    The last step in submitting an app is building it for distribution on the App
    Store. Once you upload the binary, the submission process is complete. Then, it
    is a waiting game while your app sits in the queue waiting to be reviewed. Tips
    are provided at'
