    of your source code files is displayed in red, its absence may keep your application-from
    building.


    In short, you spend most of your time editing or adding files to the Classes and
    Resources groups and occasionally adding new libraries to the Frameworks group.
    Keep your files organized. In the CS193 iPhone programming class at Stanford,
    students often turn in assignments with source files and frameworks haphazardly
    throughout the project. In the long-term, it is important to keep your files organized
    as your project grows more and more complex. Go ahead and get in the habit of
    putting your code files in the Classes group, images in the Resources group, and
    so on.


    # Recommended Xcode Preferences


    You haven''t started writing code at this point, but you can save yourself some
