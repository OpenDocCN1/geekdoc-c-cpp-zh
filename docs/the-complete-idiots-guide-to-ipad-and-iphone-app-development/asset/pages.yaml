  md: "# Cell Reuse\n\nIn the previous code, a new UITableViewCell is created every\
    \ time the cellForRowAtAtIndexPath method is called. This can make scrolling particularly\
    \ sluggish, and it turns out there's a better way: cell reuse. If your table has\
    \ a variable number of rows, you should always use the cell reuse mechanism.\n\
    \n> THERE'S A TIP FOR THAT\nReusing cells is one of the best ways to guarantee\
    \ smooth table view scrolling performance.\n\nTo see how it works, let's rewrite\
    \ the cellRowAtAtIndexPath method to reuse table view cells:\n\n```\n(UITableView\
    \ *)tableView:(UITableView *)cellForRowAtAtIndexPath:(NSIndexPath *)indexPath\n\
    {\n// define a string (any string) as the cell id\n    static NSString *cellId\
    \ = @\"standard row\";\n\n// try to reuse an existing cell\nUITableViewCell *cell\
    \ =\n    [table dequeueReusableCellWithIdentifier:cellId];\n\nif (!cell) {\n//\
    \ couldn't find a cell to reuse, so create a new one\n    cell = [[UITableViewCell\
    \ alloc]\n        initWithStyle:UITableViewCellStyleDefault\n        reuseIdentifier:cellId];\n\
    \n// autorelease the newly created cell\n    [cell autorelease];\n}\n\n// regardless\
    \ of whether you reused or created a new cell,\n// update the cell data\ncell.label.text\
    \ =\n    [NSString stringWithFormat:@\"Row %d\", indexPath.row];\n\nreturn cell;\n\
    }\n```"
  merge: -1
  pgno: 257
- img_proc: true
  md: "As you can see, the code gets slightly more complex, the performance benefit\
    \ is more than worth it. The crux of the entire cell reuse system hinges on UITableView.dequeueReusableCellWithIdentifier:\
    \ method. This method checks the table view's cell cache to see if there is a\
    \ spare cell that isn't currently being shown. If so, you can reuse. If there\
    \ isn't a cell available, the method returns nil, in which case you need to create\
    \ a new cell. If your table consists of a single type of cell, then the 10 or\
    \ 0 cells will be reused for every one of the 10,000 items in your list. When\
    \ rapidly scrolling through a large amount of data, creating and destroying objects\
    \ repeatedly can end up impacting performance, the more you can reuse existing\
    \ cells, the better.\n\n# Row Selection\n\nUITableView has built-in support for\
    \ row selection. To be notified when the user taps off the rows in your table,\
    \ you must assign self as the table view's delegate (in addition to the data source),\
    \ and override the following UITableViewDelegate method:\n\n```\n// Called when\
    \ a row is tapped\n-(void)tableView:(UITableView *)tableView\n    didSelectRowAtIndexPath:(NSIndexPath\
    \ *)indexPath;\n```\n\nUsing the indexPathPath object, you can determine the selected\
    \ cell by checking its section and row properties.\n\n# Cell Accessory Types\n\
    \nSometimes cells in tables are selectable, and other times they aren't. How does\
    \ the user tell the difference? When a cell is selectable, you can display a visual\
    \ indicator in the cell by setting an accessory view. The accessory view lives\
    \ on the far right side of the cell. There are three types of built-in accessory\
    \ views you can see in the following image:"
  merge: -1
  pgno: 258
