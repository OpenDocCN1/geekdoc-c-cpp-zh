  md: '# Wrapping Up


    This chapter gives you the essentials you need to start using Instruments, Clang,
    and Shark. I highly recommend getting some practice under your belt with these
    tools and learning more about them in the official Apple documentation on http://developer.apple.com/iphone.


    You have almost reached the end (of this book, anyway). Only one chapter remains:
    submitting your app to the App Store. In addition to the technical details of
    putting your app on the store, the next chapter covers steps you can take to improve
    your chances of making it through the app approval process unscathed.


    # The Least You Need to Know


    +   - Instruments is a convenient tool for monitoring your app as it runs. It
    can find memory leaks as well as other performance issues.

    - Clang Static Analyzer uncovers potential problems in your code without running
    it. It presents memory leaks and other problem areas in a nice report.

    - Shark profiles your code and is the best way to find the sections of code where
    your app spends most of its time.

    - Always run your app through these three tools before submitting it to the App
    Store.'
