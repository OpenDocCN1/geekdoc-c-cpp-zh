  md: '# Device vs. Simulator


    Chapter 22: Tools of the Trade


    Even though it is possible to use Shark to profile your code in the simulator,
    this is not very helpful. Where performance is concerned, CPU and RAM make all
    the difference. The simulator makes full use of your Mac''s computing resources,
    so you will always see much better performance on the simulator than on a real
    device. This is why you should perform extensive testing of your application on
    a real device before submitting it to the App Store.


    So when you use Shark, you should use it to profile your code running on a real
    device. Here are the steps you need to take to prepare your device for Shark profiling:


    +   1. Attach your device to your Mac.

    2. In Xcode, launch the EveryDayCounts application on your device. Remember to
    use the Overview button in the top-left corner to easily switch between simulator
    and device launch.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_404_0.png)


    > THERE''S A TIP FOR THAT

    to launch custom apps on your device, you must be enrolled in the iPhone Developer
    Program and have a developer provisioning profile installed. See Chapter 21 for
    all the details on installing custom apps on your phone.


    +   3. You just want the app installed on your phone, so after the app has completely
    launched, close it.


    # Getting Started with Shark


    Shark comes bundled with the iPhone SDK, so there''s nothing extra you have to
    do to install it if you have the SDK installed.


    You can launch Shark simply by typing “Shark” in Spotlight.


    After the main screen launches, there are two steps to enable iPhone and iPad
    profiling:


    +   * Select the Control network profiling of shared computers radio button.

    * As shown in the following image, select the Sampling > Network/iPhone Profiling...
    menu item to enable iPhone compatibility:'
