  md: '# Part 1: Getting Started


    If you were to break down the interface, here are the major pieces you would end
    up with:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_55_0.png)


    It is easy to mix up the bars, so note the location of each one: status bar, navigation
    bar, and toolbar.


    The screen is composed of five main elements: a window, a status bar, a navigation
    bar, a table view, and a toolbar. The table view is composed of several subviews,
    one for each cell. And each cell, in turn, is composed of an image subview to
    render the blue circle, several label subviews to render the text, and another
    image subview to render the right arrow. The hierarchy becomes clear if you break
    the interface into a tree:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_55_1.png)


    The view hierarchy for the Mail app turned on its sides.'
