  md: '# Debugging in Detail


    # Chapter

    20


    # In This Chapter


    +   - Debugging with GDB

    - Breakpoints

    - Using GDB in Xcode

    - Debugging with NSLog


    You know the feeling. You have just put the finishing touches on what has to be
    the most elegant, succinct, beautiful piece of code you (or the world?) have ever
    seen. Running the code is just a formality—completely unnecessary—because you
    accounted for every branch, every input, every conceivable value that could find
    its way into your system. Obviously, no one knew the extent of your efforts could
    possibly debug the brilliant masterpiece you just produced.


    But then you compile. Looks like there are errors and warnings in several places.
    After an hour, you finally get a clean build. Then you run the app, and it crashes
    on launch. You fix that bug, but then it crashes in another place. This continues
    for hours, as you fix one problem, and another, and another. You could have sworn
    your code was perfect, but there were bugs to fix anyway.


    This is why learning how to effectively debug iPhone and iPad apps is so important.
    All code has kinks that need to be worked out, and the better you are at finding
    and fixing those problems, the faster you will ship your app. This chapter covers
    techniques you can use to debug iPhone and iPad apps additionally shows how to
    use the GDB debugger. There are also several debugging exercises you can try to
    help practice your debugging skills.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Debugging on iPhone OS Devices


    There are two primary debugging techniques at your disposal on iPhone OS devices:


    +   - **GDB**: Add breakpoints. Step through code line by line. See the values
    of your instance variables. Knowing how to use GDB in Xcode is absolutely essential
    for all iPhone programmers.

    - **NSLog**: This is by far the most popular technique. Use NSLog to print out
    values to the console or just to see far your code gets before the app crashes.


    On iPhone devices, each of these techniques has their place. GDB should be the
    tool you use for most of your debugging, but there are times when NSLog is the
    best way to get the information you need.


    Let''s start off by taking a look at debugging using GDB.


    # GDB


    If you have programmed in C or C++, you likely already know GDB, one of the most
    widely used debuggers. You may also know how to use the GDB command-line interface
    inside and out, in which case this part of the chapter will be very familiar to
    you. However, it will be assumed you have never heard of GDB and may not know
    how to use a debugger. Even if you know GDB, it''s worth paying attention here
    to see how to use the GDB interface in Xcode.


    A debugger is a tool used to step through your code by line and inspect variables
    in your application at runtime. You set breakpoints in your source code, and when
    you run it in the debugger, your application stops at these points. When your
    app is stopped at a breakpoint, you can step over a line of code, step into a
    method call, or step out of the current method. You can also inspect local and
    instance variables to see what values they are set to. When you''re done investigating,
    you can tell the application to continue running.


    > DEFINITION

    A debugger is a tool used to test and examine a running application. When the
    debugger stops on a line of code, you can inspect the values of variables in the
    surrounding code. A breakpoint is a line marker in source code the debugger will
    stop at hit.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Chapter 20: Debugging in Detail 355


    The first step in using GDB in Xcode is to set breakpoints in your code.


    # Breakpoints


    To set a breakpoint in code, click the line number on the line you want to set
    the breakpoint on. A blue marker will appear on the line number, as shown in the
    following:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_372_0.png)


    Clicking the marker next to a line sets a breakpoint.


    > THERE''S A TIP FOR THAT

    Don''t see line numbers? You can enable them in the Xcode preferences menu:

    Xcode > Preferences... > Text Editing > Show line numbers.


    When the breakpoint is hit, execution will stop before running the line of code
    highlighted in blue. This line will be highlighted in blue, as shown in the following
    figure.


    To remove the breakpoint, click and drag the blue breakpoint arrow horizontally
    and let go. In true Apple style, it will turn into a puff of smoke and make a
    "woosh" sound when you release it. You can also click-drag the breakpoint vertically
    to move it to another line of code.'
  merge: -1
