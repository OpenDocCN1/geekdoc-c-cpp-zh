  md: '# Chapter 14: Table Views


    +   * What happens if rootUser.frenemies is nil? In tableView:numberOfRowsInSection;
    the count message would be sent to nil, which is perfectly fine in Objective-C
    (as explained in Chapter 5). The result of the method is then zero, which means
    the tableView:cellForRowAtIndexPath: method is not called at all.


    +   * The static keyword used in declaring the cellId variable causes the cellId
    to be initialized only once—regardless of how many times tableView:cellForRowAtIndexPath
    is called.


