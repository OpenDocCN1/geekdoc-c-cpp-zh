    # DEFINITION


    A notification is a callback mechanism that can inform multiple objects when an
    event occurs. The notification system is similar to delegation except delegation
    informs a single object of an event while notifications can inform multiple objects
    of the event at once.


    What is this notification business? How does it work, and why isn''t delegation
    used? Notifications are another way to communicate between objects, and you can
    learn more about them in the next section.'
