  md: '# Part 1: Getting Started


    > ONE MORE THING

    Here''s a bit of trivia for you: the NS in NSObject is short for NeXTSTEP, the
    operating system Steve Jobs built at NeXT Computer before it was acquired by Apple
    in 1996.


    # The nil Pointer


    In Java, you can set an object to null to point it to the empty memory address.
    In C, you set a pointer to NULL to produce the same effect. In Objective-C, you
    set an object to nil.


    One of the features of a nil pointer that other languages don''t have the ability
    to send messages to a nil pointer without an exception (looking at your NullPointerException,
    Java). See the code that for an:


    +   * voter = nil;

    [voter castBallot];

    // castBallot does nothing, and doesn''t crash!


    What happens when you send a message to a nil pointer? Absolutely nothing. It''s
    as if the call never happened, meaning you don''t have to manually check for nil
    values all over the place.


    This resilient behavior can be very useful as it helps you avoid writing a lot
    of error-handling code. But it can also cause trouble, since messages to an unexpectedly
    nil pointer will silently fail.


    # Classes in Objective-C


    All Objective-C classes are split into two files: the interface and the implementation.
    The interface is where you declare your class and the instance variables it will
    contain. The interface is also where you declare all the public methods that will
    present to the world. You only include the method header, not its body, in the
    interface.


    The implementation, on the other hand, is where you write the methods in the interface.
    You can also define private methods in the implementation file, simply by not
    including those method headers in the public interface file.'
