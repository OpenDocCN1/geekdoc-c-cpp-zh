  md: '# THERE''S A TIP FOR THAT


    You can also provide a movie-editing interface to your users using the UIVideoController
    class. Search the Xcode API reference or search online for examples of how to
    use this class.


    # Notifications


    In iPhone programming, there are four common patterns for objects to communicate.
    Here they are, each with a short summary:


    +   * Target-Action: Specify a single object and a single method to call on that
    object when a single event happens. You have seen this used by buttons and other
    controls.

    * Delegation: Specify a single object that responds to numerous methods to modify
    or alter behavior. You have seen this by table views, text editing, the location
    manager, and many others.

    * Notification: Register to be one of many objects notified when an event happens.

    * Key-Value Observation (KVO): Register to be one of many objects notified when
    a single property of another object changes.


    # ONE THING


    KVO will not be covered in this book, but you can learn more about how it works
    by reading Apple''s guide to Key-Value Observation in the Xcode API documentation.


    Target-action and delegation are used when a single object needs to be notified
    of an event. However, what do you do when an event happens that a lot of objects
    need to know? That is when the notification pattern proves most useful.


    # How It Works


    The notification system works by using a centralized class—NSNotificationCenterto
    manage the notification process. The NSNotificationCenter keeps a list of objects
    who are interested in receiving a particular notification. When an object wants
    to send out a notification, it tells the notification center, which in turn sends
    out the notification to all the objects in its list.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 17: Video, Images, and Audio 309


    You can think of NSNotificationCenter as a Twitter server. To start following
    someone, you give Twitter the name of the person you want to follow. Similarly,
    you give NSNotificationCenter the name of the notification you want to receive.
    To post a tweet, you tell Twitter what you post, and Twitter sends the message
    to all your followers. Similarly, you tell NSNotificationCenter to post a notification,
    and the center sends the notification to all objects that are registered for that
    notification.


    In the preceding movie playing code, here is the full notification sequence:


    +   1. Your class registers myFinishedCallback: with the

    NSNotificationCenter to be called when the notification named

    MPPlayerPlaybackDidFinishNotification is fired.

    2. When the video is playing, the player tells the

    NSNotificationCenter to broadcast the notification named

    MPoviePlayerPlaybackDidFinishNotification. The player doesn''t know objects have
    registered for this notification.

    3. NSNotificationCenter goes through the list of objects that want to know about
    MPoviePlayerPlaybackDidFinishNotification and tells them the event happened by
    calling the selector they registered. Your class is in this list, and myMovieFinishedCallback:
    gets called.

    4. In myMovieFinishedCallback;, unregister from the

    NSNotificationCenter so that you are no longer notified about the

    MPoviePlayerPlaybackDidFinishNotification.


    This is the basic template for using notifications. You won''t always unregister
    in the callback method, but the other steps are largely the same.


    # NSNotifications


    Notifications themselves are represented by the NSNotification class and consist
    of the following important properties:


    +   * name: A string that is used to uniquely identify a notification. In the
    movie player sample code, the name of the notification was the constant MPoviePlayerPlaybackDidFinishNotification.

    * object: An id type that is usually set to the object that posts the notification.
    In the movie player sample code, the object is indeed set to the MPoviePlayerController
    instance that initiated the notification.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 310 Part 4: The APIs You Can''t Wait to Use


    +   * userInfo: This dictionary can contain any additional information the object
    posting the notification wants to send to recipients. You typically need to see
    the documentation for the class posting the notification to know if there is any
    useful data in this dictionary.


    # ONE MORE THING


    To be notified of all notifications with a given name, pass nil as the final parameter
    when calling addObserver:selector:name:object:. if you want to be notified only
    when a single object generates the notification, pass the object as the final
    parameter.


    Notifications are used in a variety of situations in iPhone development. Look
    out for them in the sample code you encounter.


    # Playing Audio


    Up to this point, you have seen several ways of manipulating images and video
    using the iPhone SDK. You will now turn your attention toward audio. There are
    many ways to control audio on the iPhone OS, with some approaches much easier
    to than others. The range of options is displayed in the following figure:


    # Options for

    Playing Audio


    | System Sound API |

    | AV Foundation |

    | Audio Toolbox |

    | OpenAL |


    The system sound API is the easiest to use. The Audio Queue Services package in
    Audio Toolbox is more difficult to use, but it gives you fine-grained control
    over audio.'
