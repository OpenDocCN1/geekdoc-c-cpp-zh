  pgno: 336
- img_proc: true
  md: 'When the manager reports a new location to the delegate, it graciously includes
    the previous location reading as as well. The primary purpose of including the
    oldLocation in the first delegate method is so you can compute the distance between
    the two locations, which is exactly what you do in the sample application.


    > THERE''S A TIP FOR THAT

    The very first time locationManager:didUpdateLocation:fromLocation is called,
    the oldLocation parameter will be set to nil.


    # CLLocationManager Initialization


    Before the delegate methods can be called, you must first initialize the CLLocationManager
    and start the location-finding process. Typically, you assign the CLLocationManager
    as an instance variable in your view controller or perhaps your application delegate.
    In the following example, assume a locationManager instance variable has been
    declared for the imaginary MyViewController class:


    ```

    // MyViewController.m


    // Initialize the location manager

    locationManager = [[CLLocationManager alloc] init];


    // Assign yourself as the delegate

    locationManager.delegate = self;


    // Start receiving location updates

    [locationManager startUpdatingLocation];

    ```


    After the preceding code, locationManager will call the delegate methods MyViewController
    any time a new location update comes in.


    > ONE THING

    If your user enters a part of your app where location data is not needed, you
    should stop receiving location updates to preserve battery life. Call [locationManager
    stopUpdatingLocation] to halt location updates.'
