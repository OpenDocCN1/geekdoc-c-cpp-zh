  md: '[voter release];

    // voter now has a reference count of 0,

    // so voter is sent the dealloc message.\n// After [voter dealloc] finishes,

    // the voter object is completely freed.


    # CRASH AND LEARN


    Never call dealloc directly. It is invoked automatically by the reference counting
    system. If you find that it isn''t being called when it should, it means you are
    likely missing a release call somewhere. You have been warned!


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_97_0.png)


    As you can see in the preceding code, when the voter object is released for the
    second time, its reference count is set to 0. The dealloc message is automatically
    sent to the voter object as soon as this happens, and then the memory is freed.


    # Memory-Related Crashes


    What happens if you try to send a message to this voter object after it has been
    freed? You are trying to access memory that doesn''t belong to you anymore, and
    the OS doesn''t take kindly to such transgressions. Say you have the the following
    code, again based on your example:


    ```

    Person *voter = [[Person alloc] init];

    // voter now has a reference count of 1

    ```


    ```

    [voter retain];

    // voter now has a reference count of 2

    ```


    ```

    [voter release];

    // voter now has a reference count of 1

    ```


    ```

    [voter release];

    // voter now has a reference count of 0 and is freed

    ```


    ```

    [voter release];

    // Crash!

    ```


    As shown in the previous code, trying to send a message to a free object results
    in a crash. This is a very common error. If you find your app crashes inexplicably,
    make sure you haven''t accidentally released one of the objects you wanted to
    keep around.'
