  md: "# Chapter 20: Debugging in Detail\n\nTo delete a breakpoint using the breakpoint\
    \ window, just select the row the break-point is on and press delete.\n\n# CRASH\
    \ AND LEARN\n\nIs your breakpoint orange while your app is running? If so, you\
    \ have encounter-ered the Orange Breakpoint of Doom. When a breakpoint turns orange,\
    \ it means the breakpoint will never be hit. One solution that may work for you:\
    \ select item Xcode > Preferences... > Debugging > Uncheck “Load symbols lazily”.\n\
    \n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_374_0.png)\n\n# Two Essential Breakpoints\n\
    \nThere are two crucial breakpoints that are useful to set. These breakpoints\
    \ are for debugging exceptions and memory issues:\n\n+   * obj_exception_throw:\
    \ Normally, when an exception is thrown, it goes all the way up the stack trace\
    \ before being caught. This means you lose the exact stack frame where the exception\
    \ was thrown and have no way of know-ing line in your code caused the exception.\
    \ With this breakpoint set, execution is stopped before the exception is actually\
    \ thrown, which means you can find exactly which line in your code caused the\
    \ exception.\n* malloc_error_break: If you happen to over-release an object—that\
    \ is, send an object the release method after it has already been deallocated—then\
    \ add-ing the malloc_error_break breakpoint can help you to debug the problem.\n\
    \n> THERE'S A TIP FOR THAT\n see if your use of autorelease is to blame for problems\
    \ with your app, you should try enabling NSZombie. Search for NSZombie online\
    \ for more details.\n\n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_374_1.png)\n\n\
    To add these breakpoints, follow these steps:\n\n+   1. Open the breakpoint window\
    \ using menu item Run > Show > Breakpoints.\n2. Double-click the Double-Click\
    \ for Symbol text box, enter the text obj_exception_throw, and press enter.\n\
    3. Double-click the Double-Click for Symbol text box, enter the text malloc_error_break,\
    \ and press enter.\n\nSetting these breakpoints will help tremendously in your\
    \ debugging efforts."
