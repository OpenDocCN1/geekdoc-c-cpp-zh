  md: '# THERE''S A TIP FOR THAT


    You can animate more properties than the ones shown in the table, but you will
    need to drop down to lower-level animation techniques offered by the supremely
    powerful Core Animation framework. Animating using the Core API is a lot more
    work, but you should check it out if you are looking for fine-grained control
    of your animations. Search online for "Core Animation," "CALayer," and "CAAnimation"
    to learn more.


    The center property—along with frame and bounds—moves your view to a new position.
    To use these properties, you need to learn how to use the CGPoint, CGSize, and
    CGRect types. These types are covered later this in the section on Core Graphics.


    # Customize the Animation


    In the previous animation sample code, you set the length of the animation using
    the setAnimationDuration: class method. Setting the duration is just one of many
    ways you can customize the animation. You can also ...


    +   * Delay before starting.

    * Start at a specific time.

    * Specify the animation curve.


    > DEFINITION

    nThe animation curve defines the speed at which the animation progresses. Options
    include animations that run at a constant speed, animations that start fast and
    end slow, and animations that start slow and end fast. The default animation curve
    is a slow-fast-slow option that starts slowly, quickly accelerates and decelerates
    to end slow.


    +   * Repeat the animation multiple times.

    * Set whether or not it autoreverses (ping-pong back and forth).


    You see how to use these properties when animating your view in the sample application.'
