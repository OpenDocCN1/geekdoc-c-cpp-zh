- img_proc: true
  md: 'Dear Reader,


    When Steve Jobs unveiled the iPhone in 2007, he asked world-renowned computer
    scientist Alan Kay his opinion of the device.

    Alan Kay responded with the following:


    “Make the screen five inches by eight inches, and you''ll rule the world.”


    Fast-forward to the present day, and the iPad has taken the world by storm. The
    devices are selling quickly, even as iPhone sales continue to rocket.


    With the advent of the App Store, anyone can build and release applications for
    these extraordinary devices. You can create GPS-tracking applications and plot
    the user''s position on a map. You can create a photo application with the iPhone''s
    camera or build a game using the iPad''s multi-touch sensors.


    This book is the perfect starting point in your journey to build these kinds of
    iPhone and iPad apps. Instead of assuming you''re a Mac guru or programming wizard,
    this book explains every step from learning to use your Mac to writing your first
    line of Objective-C. Instead of just telling you about iPhone programming, you
    get practice building iPhone and iPad apps in almost every chapter. By the time
    you finish, you will have all the tools you need to build and release your own
    iPhone or iPad app on the App Store.


    There is no time to try your hand at building iPhone and iPad apps. Every day,
    thousands of new iPhone and iPad users could be finding your app on the App Store.
    Millions of existing users are just a tap away from discovering and purchasing
    your app. All you have to do is build the app, and all the tools you need to get
    started are here.


    What app will you build?


    Happy coding,


    Troy Brant'
