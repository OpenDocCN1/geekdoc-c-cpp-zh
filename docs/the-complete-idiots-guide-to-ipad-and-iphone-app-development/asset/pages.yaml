    give everything you need to get started developing most iPhone applications. Later,
    when you want to add audio, location-detection, or iPod access, other frameworks
    need to be added to your project to allow access to those features.


    +   * **Products**: The products group contains the application binary. This is
    the binary that actually runs on your iPhone when you launch an application. The
    only time you need to do anything in this group is when you want to publish something
    on the App Store or test it off betas.


    ONE MORE THING

    The Groups & Files Section, if you see a file name in red text, it means the file
    does not exist on. In the previous image, Flashlight.app is in red, which means
