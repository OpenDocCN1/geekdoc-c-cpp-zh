  md: '# Split Views and Popovers


    # ## In This Chapter


    +   - Split views

    - Split view rotation

    - Popovers

    - TweetPad app


    Is an iPad just a giant iPod Touch? Tech bloggers and journalists far and wide
    have described it as such. Even though the iPad looks and behaves much like the
    iPhone, using an iPad is a drastically different experience than using an iPhone.
    An iPhone can be held in one hand for longer bursts while an iPad is used for
    longer periods of time. And of course, the iPad screen size is “giant” compared
    to the iPhone display.


    With the new iPad experience comes new interface elements. This chapter is dedicated
    to two views that are only available on iPad: split views and popovers. Both of
    these elements simplify your iPad apps by requiring the user to navigate fewer
    screens than they would on an iPhone app. To get some hands-on practice with these
    elements, you will build TweetPad, an iPad Twitter client that leverages split
    views and popovers.


    # Split Views


    A split view is a full-screen view that consists of two side-by-side panes. The
    first pane has a fixed width of 320 pixels and typically contains a table view.
    The second pane fills the rest of the screen and usually displays a detail view
    of the item currently selected in the first pane. This particular arrangement
    is known as a master-detail'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'The iPad Mail app, shown in the following figure, demonstrates how to use master-detail
    design with split views:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_275_0.png)


    The Mail app for iPad uses a split view to display your inbox and message details
    at the same time.


    # DEFINITION


    **Master-detail** is design pattern where one view displays a list of items while
    a second view displays the details of the currently selected item in the master
    view. Although it is not strictly required, most split views use the master-detail
    pattern.


    A split view connects two view controllers, one for the left pane and one for
    the right. The split view itself manages the display of these two view controllers
    and is represented using `UISplitViewController` class.


    # Adding a Split View Controller


    There are multiple ways to add a split view to your interface. The different options
    are listed here:'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Chapter 15: Split Views and Popovers 259


    +   - Create a new project using the Split View-based Application template. This
    template is good if you are creating a new application with the split view as
    the primary view.

    - Add a Split View Controller object to your nib file. Adding the controller to
    your nib file is a good option if you have an existing iPad project.

    - Add a UISplitViewController to your interface programmatically. Creating the
    split view controller in code provides a great exercise for understanding how
    the split view system works.


    In building the TweetPad app, you will use the third option to programmatically
    add a split view to the interface. You can always use the first and second methods
    to easily create split views in the future, but adding them in code is a good
    exercise to see at least once.


    # Rotation


    When the iPad is being held in landscape orientation, the split view displays
    both its left and right panes. However, when the device is rotated to portrait
    mode, the split view automatically hides the first pane so that the detail view
    fills the entire screen.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_276_0.png)


    > CRASH AND LEARN

    The built-in rotation behavior for split views only works if both left and right
    view controllers override shouldAutorotateInterfaceOrientation and return YES
    for all orientations.


    If the left pane is hidden in the portrait interface orientation, how does your
    user access its contents? The most common solution is to add a button to the toolbar
    of the second pane that, when tapped, presents the contents of the first pane
    in a popover.


    # Popovers


    A popover is a temporary view that is revealed when the user taps a control or
    onscreen area. Popovers can contain any view of your choosing, including labels,
    images, and buttons. In the following image, a UITableView is displayed in a popover:'
