  md: '# iPhone OS 4.0


    iPhone OS 4.0 is a big upgrade to the iPhone OS. Here are some of the 4.0 APIs
    you can now use in your application:


    +   * Multitasking—You can now run multiple third-party applications at once.

    * iAd—By taking advantage of the new iAd framework, you can make money by serving
    AppleStore-approved ads to your users.

    * Game Center—Do you want to build a multiplayer game? With Game Center, you can
    easily add matchmaking and leader boards to your game.

    * Local notifications—Local notifications give you the ability to display an alert
    to the user when your app is running in the background. For instance, alert the
    user when a message arrives in your chat application.

    * Event Kit—Access the quick view controller to preview for images, documents,
    and PDFs.

    * Encryption—Store and read sensitive user data safely.

    * Core Telephony—Access your user’s cellular service provider.


    > ONE THING

    ForThe full list of iPhone OS 4.0 features, head over to http://developer.apple.com/iphone
    and search for the document titled “What’s New in iPhone OS 4”.


    The biggest change in the new API, however, is the addition of multitasking. The
    following section details how multitasking works on the iPhone OS and what you
    must do as a developer to support it in your app.


    # Multitasking


    So what exactly is multitasking? Multitasking gives you the ability to run multiple
    applications at once. Contrary to popular belief, the iPhone OS has always had
    multitasking. For instance, the Mail app downloads new mail messages when the
    app isn''t open. Safari can stream audio from a website even after you close the
    app. However, for various reasons, Apple didn’t provide a way for third-party
    developers to use multitasking. Until now.'
  merge: -1
