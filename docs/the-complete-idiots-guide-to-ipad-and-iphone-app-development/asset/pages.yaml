  md: '# Part 3: Multi-View Applications


    +   - The image should be roughly 30x30 pixels in size. If it is too large, the
    image is automatically scaled to fit.


    +   - The alpha values of your image are used to determine the shape of the icon.
    Areas of your image with an alpha value of 1 will be completely filled. Areas
    of your image with alpha values of 0 will be empty. Colors in your image are ignored,
    so to produce a particular shape, you need to adjust your image''s alpha values.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_235_0.png)


    # DEFINITION


    The alpha value of an image determines the image''s transparency. Alpha values
    range from 0—completely invisible—to 1—completely visible.


    +   - PNG is the best image format to use tabs—and everywhere else in your application.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_235_1.png)


    # CRASH AND LEARN


    JPEG images do not support transparency, so they should not be used for tab Icons.


