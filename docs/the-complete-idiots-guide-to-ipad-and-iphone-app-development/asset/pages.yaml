- img_proc: true
  md: '# Strategy


    To be able to run apps on your phone, you need to take the following steps:


    +   1. Register for the iPhone Developer Program, which costs $99.

    2. After getting accepted into the program, you will use the Development Provisioning
    Assistant to create a developer provisioning profile.

    3. After downloading your provisioning profile from the iPhone Developer Program
    website, you will install the provisioning profile in Xcode.

    4. Finally, you will plug in your iPhone or iPad, build the project using the
    Device SDK, and launch the application on the phone.


    Without further ado, let''s get started.


    # iPhone Developer Program


    The first step in putting apps on your phone is to dish out $99 to enroll in the
    iPhone Developer Program. There are actually two programs: a small team/individual
    account for $99 and a $299 option for companies who want to release apps internally.
    Most people fall in the $99 category, but if you think the $299 option applies
    to you, be sure to read all the information about it online before making a decision.
    The rest of this section is written assuming you chose the $99 option.


    > THERE''S A TIP FOR THAT

    For a full explanation of the iPhone Developer Program, refer back to Chapter
    1.


    # Register


    Since the registration process is straightforward, you can follow the instructions
    provided by Apple. Here''s how to get started:


    +   Go to http://developer.apple.com/iphone/program/start/enroll/'
