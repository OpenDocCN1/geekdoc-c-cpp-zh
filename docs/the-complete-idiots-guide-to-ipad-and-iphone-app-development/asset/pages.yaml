  md: "# Chapter 6: Memory Management 81\n\n# Memory Leaks\n\nYou may be familiar\
    \ with the term, but what exactly does memory leak mean in the context of reference\
    \ counting? Let's take a look at the following code:\n\n```\nPerson *voter = [[Person\
    \ alloc] init];\n// voter now has a reference count of 1\n```\n\n```\n// voter\
    \ is not released anywhere\n```\n\n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_98_0.png)\n\
    \nDEFINITION\n iPhone programming, a memory leak is a bug caused when an object\
    \ is retained more than it is released. As long as the retain count is greater\
    \ than zero, the object will remain in memory, resulting in a memory leak.\n\n\
    voter is allocated and initialized with a reference count of 1. However, there\
    \ is no corresponding release. What happens to the voter object? Because its reference\
    \ count never goes to 0, it is never deallocated. This means it sticks around\
    \ forever (or at least for the lifetime of your application). This is the definition\
    \ of a memory leak in iPhone programming.\n\nWith the limited amount of memory\
    \ you have at your disposal in the first place, memory leaks can seriously jeopardize\
    \ the performance of your application and can even cause the OS to forcibly quit\
    \ your app for using too much memory. There are tools available that can help\
    \ you identify memory leaks. However, you can avoid memory leaks altogether by\
    \ simply practicing sound memory management.\n\n![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_98_1.png)\n\
    \nTHERE'S A TIP FOR THAT\n You do not need to do any memory management for primitive\
    \ C types, like int, float, and char. The memory management techniques listed\
    \ here only apply to pointers in your application.\n\n# Autorelease\n\nThere is\
    \ one last concept you need to know to properly manage memory: autorelease. Autorelease\
    \ is best illustrated and explained using an example."
