    +   15. Close the Target Info window.


    You are now ready to build the app for the App Store. But before you take the
    leap, there are a few tips to keep in mind.


    # Before You Finish the Build


    Before you build your app for the store, here are some last-second tips and tricks
    you may want to implement:


    +   * Icon: Every app submitted to the App Store must have an icon. For iPhone
    and iPad Touch apps, the icon must be 57x57 pixels in size. For iPad apps, the
    icon must be 72x72 pixels.


    If your app is built for a single type of device—just iPad or just iPhone—you
    should name the icon "icon.png". Alternatively, you can name the icon whatever
    you want, but add a key named "CFBundleIconFile" to your Info.plist with the value
    set to the icon filename.


    However, if you are building a universal application, you will need to provide
    two icons: a 57x57 version for iPhone and a 72x72 version for iPad. Then you should
    add a key named "CFBundleIconFiles" of type Array to your Info.plist file. Add
    two strings to the array: the filenames of each icon. The iPhone OS will then
    use the pixel size of the icons to automatically select an icon for each platform.


    +   * Shine control: By default, a shine overlay will be added to your icon when
    it is displayed. You can see the shine on built-in app icons like iTunes, Store,
    and iPad. If you look hard enough, you notice that other apps do not have a shine,
    like Calculator, and Camera.


    To turn the auto-shine for your app, select the [app name]-info.plist file in
    your Resources group. Right-click anywhere in the table and select Add Row. In
    the key column, select Icon already includes gloss and bevel effects, and check
    the box in the value column. Your icon will now be shine-free.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# Chapter 23: The App Store and Beyond 411


    +   * **Splash image:** If you want your project to display a splash image when
    it first loads, simply add a 320x480 image named "Default.png" to your project.
    A splash image is displayed immediately on app launch, and it is replaced with
    your app interface as soon as your app finishes launching. Instead of displaying
    a company name or logo, it is recommended that the image look more or less like
    the first screen of your app.


    +   * **App name control:** Sometimes, the app name below your app icon is truncated
    when displaying on a device. You can fix this, though, by again editing your [app
    name]-info.plist file in your Resources group. This time, you simply need to set
    the Bundle display name key to a shortened version of your app name that fits
    in the size allotted by device.


    If you make any of the changes suggested, you should definitely test the changes
    before building for the App Store.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_428_0.png)


    # ONE MORE THING


    Before you build your app for the App Store, you should read through the Getting
    Approved section at the end of this chapter.


    When you are completely certain your app is ready for prime time, move on the
    next section.


    # Finish the Fight


    The goal of this entire process is to produce a single .app file, zip it, and
    upload it to iTunes Connect. Here are the final few steps to accomplish this goal
    and completely finish submitting your app:


    +   1. Back in your primary project window in Xcode, click the **Overview** button,
    and select the **Distribution** configuration. Also, if not selected already,
    sure **Device** is the Active SDK.


    +   2. Build (but don''t run) the project. The shortcut key for build-only is
    ⌘B.


    +   3. After the build completes successfully, expand the Products group in the
    Groups & Files pane. Right-click the **app file** in the group, and select **Reveal
    in Finder** from the context menu.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# 412 Part 5: Make Your Millions


    +   4. In Finder, Right-click the .app file, and select Compress “[app name].app”.
    After the .zip file is generated, drag it to your desktop for easy access.


    # HERE''S A TIP FOR THAT


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_429_0.png)


    You should keep a backup of the exact .app and .dsym files generated during the
    build process. Store the files somewhere safe. They will come in handy the road
    down if your app crashes on your users. They can send you the application''s crash
    log, which contains a stack trace you can use to debug the crash. However, the
    unmodified crash log contains a mess of indecipherable hexadecimal memory addresses.
    To convert the log into plain English for debugging, you must symbolize the file
    using the .app and .dsym files for the version of the app you were using. Do an
    Internet search for “iphone symbolycate crash” to learn how to symbolize crash
    logs.


    +   5. Navigate to your app page on iTunes Connect, and click the Upload Binary
    link.


    +   6. Upload the application .zip file you copied to the desktop, and click Save
    Changes.


    +   7. Toss confetti. Dance a jig. Commence celebrating because you are D-O-N-E,
    done!


    Your app is now added to the official app queue. Historically, the wait time has
    taken up to two weeks, though Apple is constantly improving the speed of the approval
    process.


    If you decide that you have made a terrible mistake and want to take your app
    down before it can be reviewed, select the Reject Binary option on the iTunes
    Connect page for your app. You will lose your place in the review queue if you
    reject the binary, but you can always submit the app again once you fix whatever
    problem it had.


    # Tips for Getting Approved


    Your app is in the official submission queue, it can take up to two weeks to get
    approved. If your app is rejected, you have to fix the problems, resubmit your
    app, and wait another two weeks for Apple to review the new version. You could
    be looking at sitting on your hands and waiting an entire month if you don''t
    submit the app up to Apple''s standards the first time around.'
