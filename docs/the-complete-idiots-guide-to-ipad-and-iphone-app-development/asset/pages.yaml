  md: '# Navigation Controller Basics


    So what exactly is a navigation controller? Well, the textbook definition is that
    it manages a hierarchy of views as the user moves through an app. However, it''s
    much easier to comprehend visually, and you can see how navigation controllers
    work in the following image:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_213_0.png)


    The Settings app is a prime example of what navigation controllers look like and
    bow they work.


    The bar above the view is known as the “navigation bar”. The navigation bar displays
    the current view''s title, as well as a back button that returns you to the previous
    view.


    # INavigationController


    In code, the navigation controller is represented using the UINavigationController
    class.


    +   - ONE MORE THING


    For more detailed coverage of UINavigationController, look it up in the API documentation.
    You can do this by accessing Help > Documentation in Xcode and then searching
    for “INavigationController” in the top right search box.


    The UINavigationController class has two main elements: a stack of view-controllers,
    and the navigation bar.'
