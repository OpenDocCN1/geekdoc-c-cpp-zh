  md: '# Important notes about the preceding code:


    +   The dictionary is initialized with three key-value pairs using the dictionaryWithObjectsAndKeys:
    method. However, pay close attention to the order specified—value followed by
    key.


    +   NSDate is another helpful built-in class that holds information about a specific
    date. The [NSDate date] method returns an autoreleased object containing the current
    date and time.


    +   Again, note that the dictionaryWithObjectsAndKeys: method is terminated. Don''t
    forget to include it.


    # CRASH AND LEARN


    It is very easy to forget that nil when you initialize your arrays and dictionaries.
    Without it, your app will crash at runtime, so get into the habit of including
    a nil when initializing your collections.


    +   To get the value for a particular key, use the valueForKey: method. Also,
    notice because valueForKey: method returns a generic pointer, you don''t need
    to cast it before assigning to an NSString, NSDate, or NSNumber.


    +   NSDictionary supports fast enumeration like NSArray. Note that the iteration
    is over the keys, not the values in the dictionary. If you want to iterate over
    the dictionary values, use the allValues method, which returns an NSArray of values
    in the dictionary.


    # NSMutableArray and NSMutableDictionary


    One important note about instances of NSArray and NSDictionary is that they are
    immutable. This means you can''t add or remove objects after they are created.
    If you want to be able to modify the contents of an array or dictionary, you need
    to use the NSMutableArray and NSMutableDictionary classes.


    You can replace the NSArray and NSDictionary instances in the preceding code with
    their dynamic counterparts like so:


    ```

    // array initialization

    NSMutableArray *numberArray = [NSMutableArray array];

    [numberArray addObject:[NSNumber numberWithInt:25]];

    [numberArray addObject:[NSNumber numberWithFloat:3.14]];

    [numberArray addObject:[NSNumber numberWithBool:YES]];

    ```'
