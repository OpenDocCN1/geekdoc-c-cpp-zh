  md: '# Animating UIViews


    UIView animations use what are known as animation blocks. Everything between the
    beginAnimations:context and commitAnimations method calls is animated based on
    the animation settings that you declare within the block. For instance, if you
    wanted to fade out an image view along with the label, all you have to do is add
    it to the animation block and set its alpha value to zero.


    # DEFINITION


    An animation block defines how a view should animate. A UIView animation block
    begins by calling beginAnimations:context and ends by calling commitAnimations.
    The lines of code between these two methods describe the animation, such as the
    duration, start time, and animation curve.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_300_0.png)


    There are few constraints about what can be animated, though. If your animations
    aren''t working, you might want to check the following rules regarding UIView
    animation blocks:


    +   * All animated objects must be UIView subclasses.

    * All animated objects must be part of the view hierarchy—that is, you have to
    remember to add the view.

    * Only animatable UIView properties can be animated.


    What are these animatable properties? The properties in the list below can be
    animated using a UIView animation block:


    # Properties Animatable in UIView Animation Blocks


    | Property | Description |

    | --- | --- |

    | frame | The view''s rectangle, in superview coordinates |

    | bounds | The view''s rectangle, in bounds coordinates |

    | center | The center of the view''s frame |

    | transform | A matrix you can set to change the view''s scale, rotation, and
    offset |

    | alpha | Determines the view''s transparency |

    | backgroundColor | Background color of the view |'
  merge: -1
