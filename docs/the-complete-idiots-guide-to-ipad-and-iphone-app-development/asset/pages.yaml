  md: "# 330 Part 4: The APIs You Can't Wait to Use\n\n+   - Locations that were initialized\
    \ before your app was even initialized can be reported. The Core Location framework\
    \ seems to cache and report points from the last time location services were used.\
    \ For instance, if you run your app in Montana and then launch it in Georgia,\
    \ your reported point could be from Montana. If you don't check for this case,\
    \ your distance-tracking application would merrily add the thousands of miles\
    \ between Montana and Georgia to your total distance.\n\nThe following helper\
    \ method checks for these four cases to determine whether the newly reported location\
    \ is valid or not. Add the following method so you can call it when locationManager\
    \ delivers location updates:\n\n```\n// DistanceIsValid:(CLLocation*)newLocation\n\
    withOldLocation:(CLLocation*)oldLocation\n{\n// Filter out nil locations\nif (!location)\n\
    {\n    return NO;\n}\n// Filter out points by invalid accuracy\nif (newLocation.horizontalAccuracy\
    \ < 0)\n{\n    return NO;\n}\n// Seconds = newLocation.timestamp - oldLocation.timestamp\n\
    NSTimeInterval secondsSinceLastPoint = [newLocation.timestamp timeIntervalSinceDate:oldLocation.timestamp];\n\
    n// Filter out points that are out of order\nif (secondsSinceLastPoint < 0)\n\
    {\n    return NO;\n}\n// Seconds = newLocation.timestamp - locationManagerStartDate\n\
    NSTimeInterval secondsSinceManagerStarted =\n```"
