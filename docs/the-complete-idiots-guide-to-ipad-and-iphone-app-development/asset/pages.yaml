    # New to Mac?


    One of Apple''s more brilliant business strategies in providing an iPhone SDK
    was requiring development to be on a Mac. While a large number of developers migrated
    over rather seamlessly, a massive influx of developers had never touched a Mac
    in their life. At Stanford, around 75 percent of the CS193P iPhone programming
    class landed in this category. They bought a Mac specifically for the course and
    wanted to start coding right away. But they could have avoided much of the pain
    they experienced early on the course if they had spent some time comfortable navigating
    Mac OS X. So if you''re new to Mac, you can avoid the problems they ran into by
    going through this mini-Complete Idiot''s Guide to Mac OS X.


    # Quick Overview of Mac OS X for Windows Users


    If you just purchased your first Mac, you have to admit, it is a gorgeous piece
    of hardware. The interface is sleek and beautiful, and the animations are captivating.
    However, after you are finished gawking at the interface, you probably want to
    do stuff, like creating documents or launching programs. Well, that is when you
    can quickly go from enamored to frustrated with OS X. There is no Start menu for
    launching applications, no Control Panel for customizing your setup, and even
    the cut, copy, and paste commands aren''t mapped to Ctrl-X, Ctrl-C and Ctrl-V.
    Mac OS X has an equivalent action for everything you want to do on Windows, but
    the key is figuring out the mapping between the two.


