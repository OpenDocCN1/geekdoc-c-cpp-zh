    # CRASH AND LEARN


    Although it may seem like magic, autorelease is not a silver bullet you can

    to fix all your memory management issues. Balancing your retain/release calls
    is

    the only true way to ensure you don''t have memory-related bugs.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_100_0.png)


    # Golden Rules of Memory Management


    So now you know about alloc/init, retain/release, and autorelease, it''s time
    to go

    over two of the golden rules of memory management.


    +   * If you retain it, you release it. Use the NARC rule to determine if you
    have

    retained an object. The NARC rule states that each time you call the follow-

    methods, you must call release or autorelease to match:

    * +new: new is a convenience method that combines alloc/init into a single

    alloc/init is used more heavily in iPhone development, however.

    * +alloc: alloc is used in the alloc/init pattern.

    * -retain: retain increases the reference count for an object by 1.

    * -copy: copy, for objects that support it, creates a new instance of the

    object that has the same data as the object it was called on.


    +   * If you assign an object to the result of a method, and the NARC rule

    does not apply, you do not need to release it. This means you can use the

    objects these methods without retaining them. For example:


    ```

    // Assume the makeVoter method is defined

    Person *evan = [Person makeVoter];

    ```


    ```

    [evan castBallot];

    ```


    ```

    // You are done with evan, but you don''t need to release him

    ```


    In the preceding code, you can apply the golden rules to determine what kind of

    memory management to use. First, you should ask, "Does NARC apply?" Let''s see,

    you don''t call new, alloc, retain, or copy. So, NARC doesn''t apply. Because

    NARC doesn''t apply, then you do not need to release the object.'
