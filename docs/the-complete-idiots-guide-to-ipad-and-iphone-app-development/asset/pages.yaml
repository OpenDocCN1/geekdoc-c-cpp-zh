  md: '# GPS and Location Management


    # Chapter

    18


    # In This Chapter


    +   - The Core Location framework

    - Using CLLocation to get location updates

    - CLLocation properties for accessing location data

    - Detecting inaccurate location data

    - Distance app


    "Where are you?” One of the frequently asked questions of all time is now becoming
    much easier to answer with the ubiquity of location-enabled devices. You take
    it for granted now, but how impressive is it that you can open the Maps application
    and instantly—and visually—know your location?


    In this chapter, you will see how simple it is to use this powerful feature. You
    use the Core Location framework to allow your users to figure out exactly where
    they are. The CLLocation object reported by the phone will tell you your latitude,
    longitude, and even the elevation of your location. Although the location reported
    by the phone is usually quite accurate, it can also report wildly inaccurate values.
    You learn how to make location data is safe to use. Finally, you get some practice
    using Core Location by building a simple distance-tracking application.


    # Using Core Location


    Core Location is the framework that provides access to the phone’s location data.
    iPhone OS devices use a combination of techniques to identify your location. In
    addition to GPS, your device can triangulate your position based on nearby WiFi'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'networks or cell towers. Both WiFi and cell tower triangulation can be used
    to provide your location quickly, but they are not as accurate as a GPS unit.
    Combined, these techniques provide fast and accurate location information to apps
    leveraging the Core Location framework.


    # ONE THING


    Although the iPod Touch and the WiFi iPad model don''t have a GPS chip, they still
    approximate location based on nearby WiFi networks. This method will probably
    not work at all where the WiFi networks are not "known" by Apple.


    To use the Core Location API, you just need to know how to use two classes: CLLocation
    and CLLocationManager. You will learn about each of these classes, starting with
    CLLocation.


    # CLLocation


    CLLocation is the object that contains your user''s location data. The object
    provides the following useful properties:


    +   * **coordinate**: A CLLocationCoordinate2D struct that contains the latitude
    and longitude of the user''s location. To access the latitude and longitude, use
    the syntax: `coordinate.latitude.coordinate.longitude`.

    * **horizontalAccuracy**: The *radius of uncertainty* around the location''s position,
    measured in meters. It is the transparent blue circle around the tracking you
    see in the Maps application when your position is being determined. A negative
    value indicates an invalid coordinate value.


    # DEFINITION


    The **radius of uncertainty** is a measure of the accuracy of a location reading.
    For instance, a 100-meter radius of uncertainty means the device''s true position
    can be up to 100 meters away from the generated location.


    +   * **altitude**: The user''s distance above or below sea level, also reported
    in meters.

    * **verticalAccuracy**: The accuracy of the altitude value, reported in meters.
    A negative value indicates an invalid altitude reading.

    * **timestamp**: An NSDate object representing the time at which the location
    was determined.'
