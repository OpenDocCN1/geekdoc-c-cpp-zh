  md: '# Chapter 16


    # # Animation


    # In This Chapter


    +   * Animation blocks

    * UIView properties that can be animated

    * CGPoint, CGSize, and CGRect

    * Animation curves

    * Rotating a view

    * Animotion app


    What are some of the first reactions people have when they use an iPhone or an
    iPad? “It’s so smooth,” they say with childlike wonder as they slide their finger
    across the screen. “Look at that,” can be heard as the interface smoothly rotates
    to match their orientation. “Can I have one?” is usually heard a short time later.


    What is it that makes the iPhone so *nice*? High on the list of answers is its
    use of animations. Nearly every interaction on the iPhone is animated, from scrolling
    tables, to opening apps, to sliding up a modal view. And almost all of these animations
    serve a purpose. All the sliding, flipping, fading, and zooming helps your user
    construct a mental map for intuitively getting around your apps. However, animations
    can add a bit of fun and surprise to your apps as well.


    You, too, can easily add animations to your own apps. In this chapter, you learn
    how to use the UIView class to animate your views.'
