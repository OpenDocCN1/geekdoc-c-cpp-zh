  md: '# Part 2: Building Your User interface


    Here is a quick overview of the controls covered in this chapter:


    +   * Switch: A switch is used to toggle between Boolean values. You normally
    use switches to turn on or off certain settings or features in your app. In code,
    a switch is represented using the UISwitch class.


    +   * Slider: A slider is used to specify a numeric value within a range of values.
    In the iPhone and iPad Settings application, you use sliders for controlling volume
    and brightness. In code, a slider is represented via the UISider class.


    +   * Segmented Control: A segmented control is a multiple-choice control that
    allows you to select a single value. In essence, it behaves exactly like a radio
    button. In code, a segmented control is represented via the UISegmentedControl
    class.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_111_0.png)


    You will experiment with switches, sliders, and segmented controls in this chapter.


