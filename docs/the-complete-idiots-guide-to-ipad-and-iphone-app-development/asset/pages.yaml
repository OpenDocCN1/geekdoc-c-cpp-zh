    toolbars should be placed at the top of the screen while toolbars in iPhone apps
    should always be placed at the bottom of the screen. You can see toolbars in various
    applications in the following figure.


    # DEFINITION


    A toolbar is a rectangular strip that displays a row of buttons used to control
    the app. On the iPad, toolbars are typically found at the top of your interface.
    On the iPhone, however, they are always located at the bottom of your interface.'
