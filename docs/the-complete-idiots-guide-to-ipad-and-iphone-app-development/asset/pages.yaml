- img_proc: true
  md: 'low-memory warning, then the viewDidLoad method is called. You should release
    all the retained views in this method to free up as much memory as possible. The
    next time your view controller is displayed, your view will be rebuilt.


    # CRASH AND LEARN


    Never call any of the aforementioned lifecycle methods directly. Each lifecycle
    method is invoked at the appropriate time automatically by the system. Calling
    these methods directly will likely have disastrous results.


    Don''t worry if it doesn''t make complete sense right now. It will take time and
    practice to understand exactly how you can use these lifecycle methods in your
    apps. Just pay attention to how these methods are used in the book''s example
    applications, starting with the Tweet app.


    # Add viewWillAppear: to TweetViewController


    In SettingsViewController, you use the viewWillAppear: method to set the username
    field string to the value in the model class. By using viewWillAppear:, you guarantee
    the text field value is set before the SettingsViewController becomes visible.


    In TweetViewController, you will use viewWillAppear: to get the user''s latest
    tweet and update with data from the model object. viewWillAppear: is the perfect
    spot for this, for two reasons:


    +   - When the app is first launched, the viewWillAppear: method is called before
    the interface becomes visible, which means that the Latin in the text view is
    replaced with a real tweet.


    +   - After the user updates the Twitter username on the Settings screen, viewWillAppear:
    is called just before it flips back to the Tweet view. You can update both the
    usernameLabel outlet with the new username and grab the latest tweet for that
    before the user sees the Tweet view again.'
