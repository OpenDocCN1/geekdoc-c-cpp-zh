  md: '# Part 5: Make Your Millions


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_405_0.png)


    You must enable iPhone profiling before Shark can work with iPhone.


    Note that the profiler works on iPad as well, even though the sampling menu only
    includes “iPhone.”


    Now that profiling is enabled, check out the following best practices for using
    Shark before profiling the EveryDay counts.


    # Using Shark


    If there were only two words to describe best usage of Shark, they would be “short
    bursts.” You control when Shark starts and stops sampling the running application.
    Instead of trying to sample the entire lifetime of your application, just the
    parts where you notice performance is poor. The problem with sampling over long
    periods of time is that your results get diluted. More time is spent in methods
    that don''t have any problems.


    So to best utilize Shark, you should use the following steps, which incorporate
    the “short bursts” idea:


    +   1. Play with your app and identify an individual action that causes performance
    to lag.

    2. Quit and relaunch the app to get it into a fresh state.

    3. With your device connected, launch Shark, and set the target to your app.

    4. Prepare to perform the action that causes poor performance.

    5. In Shark, click the Start button to start sampling.'
