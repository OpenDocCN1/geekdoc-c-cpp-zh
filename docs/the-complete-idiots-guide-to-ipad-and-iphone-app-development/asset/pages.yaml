- img_proc: true
  md: '+   **Name:** A good application name is short and descriptive. "Groceries"
    is a good name for a grocery list app. "The Gregarious Grocery List App of Awesome"
    is not a good name.


    +   **Description:** A good description gets users excited about your app, but
    in the end, users just want to know what they can do with your app.


    +   **Device Requirements:** Be aware that iPod Touch, iPad, and iPhone have different
    sets of features. To specify device requirements, you must add the key UIRequiredDeviceCapabilities
    of type Dictionary to the Infolist in your app''s project. Apple provides a document
    titled "Device Support" that explains how to identify your app uses. For instance,
    you must add the video-camera key if your app takes video, the accelerometer key
    if your app uses the accelerometer, and the location-services key if your app
    uses Core Location. Search online for "iPhone Device Requirements" to locate the
    document for more details.


    +   **Categories:** Make sure the categories you select are accurate. Sometimes,
    though, you can increase the chance of your apps'' success by building apps that
    fit in the more obscure categories. The biggest category by far is Entertainment.


    +   **Copyright:** My copyright string is "2010 Troy Brant." If you are an individual
    developer, enter a similar string using your name.


    +   **Version Number:** Starting with 1.0 is always a good choice for this field.


    +   **SKU Number:** A SKU is used as a product''s unique identifier in businesses.
    You can actually make up any alphanumeric sequence for this field, although I
    would recommend using something predictable and descriptive. My SKU "numbers"
    follow the format: "com.roybrant.[app name]",


    +   **Keywords:** The keywords you specify are used by the App Store search engine
    when the user enters a search query.


    # CRASH AND LEARN


    Do not use the names of your competitors'' applications as keywords for your own
    app. This is grounds for rejection from the App Store, because your app will show
    up in the results when users search for your competitors'' apps. You will also
    draw the ire and disdain of the developer community, but you can avoid this fate
    by simply using descriptive and legal keywords.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_419_0.png)'
