  md: '# TweetPad


    In following with tradition, you will build a Twitter app to get some practice
    using split views and popovers. Dubbed TweetPad, this iPad app uses a split view
    to display both the people you follow and profile information for a single person.
    Once complete, TweetPad will look as follows:


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_279_0.png)


    TweetPad displays your friends and their profile information using a split view.


    TweetPad’s interface is composed using a split view controller. When viewed in
    landscape mode, the left pane displays the list of friends. In portrait mode,
    the list of friends is displayed in a popover when the “Friends” button is tapped
    in the top bar.


    > CRASH AND LEARN

    nYou must have iPhone SDK 3.2 or later installed to build iPad applications.


    # Interface Challenge


    Building an iPad app is very similar to building an iPhone app. All of the UIKit
    classes available for iPhone are also available for iPad. The main difference
    is that there are classes available for iPad that aren''t available on iPhone,
    like split views and popovers. Just like the iPhone apps we built in earlier chapters,
    you will start building the TweetPad app by creating the view controllers and
    data model used in the app.


    If you get lost at any point, there is starter code available at the end of this
    section if you need it.'
