  md: "above. This, too, comes for free when you use the UITabController class. All\
    \ you have to add is six or more view controllers when you initialize the tab\
    \ bar controller.\n\n# Combining Tab Bar and Navigation Controllers\n\nBecause\
    \ navigation controllers are a subclass of ViewController, you can add them to\
    \ a tab bar as easily as your own ViewController subclasses. Just wrap your custom\
    \ view controller in a UINavigationController, and add the navigation controller\
    \ to the tab bar. For example, let's take the same tab bar initialization code\
    \ shown previously and yet one of the custom view controllers in a navigation\
    \ controller:\n\n```\n(void)applicationDidFinishLaunching:(UIApplication*)app\
    \ {\n// Initialize the view controllers\nSomeViewController *firstViewController\
    \ = ...;\nAnotherViewController *secondViewController = ...;\nYetAnotherViewController\
    \ *thirdViewController = ...;\n\n```\n\n```\n// Wrap the first view controller\
    \ in a nav controller\nINavigationController *navController = \n[[INavigationController\
    \ alloc]\ninitWithRootViewController:firstViewController];\n```\n\n```\n// Initialize\
    \ the array\nNSArray *viewControllers = [NSArray arrayWithObjects:\nnavController,\n\
    secondViewController,\nthirdViewController,\nnil];\n```\n\n```\n// Memory management\n\
    [navController release];\n```\n\n```\n// Continue with tab bar initialization\
    \ like normal\n...\n```\n\nAny time you combine tab bars and navigation bars,\
    \ you should always have the tab bar controller at the root of the view hierarchy.\
    \ Here is an easy way to remember this rule: your app can have several navigation\
    \ controllers—one for each tab—but there should only ever be one tab bar controller."
