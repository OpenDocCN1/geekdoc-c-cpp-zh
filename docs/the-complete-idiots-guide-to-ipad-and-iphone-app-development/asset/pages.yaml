  md: '# Welcome to the Party!


    # Chapter 1


    # In This Chapter


    +   - What you need to get started

    - New to Mac?

    - iPhone features and constraints

    - Getting the iPhone SDK


    During my first year at Stanford, I met with my buddy Steve after class one day
    to toss around an idea for an iPhone app. We brainstormed for hours and latched
    on to the idea of a running application, one that utilizes the phone''s GPS unit
    to track workouts. The next day, I was in an Apple store buying my first Mac.


    Since then, I''ve immersed myself in every aspect of iPhone — and now i iPad —
    development. If you''re excited about the idea of developing apps for the iPhone,
    believe me, I''m right there with you. I''ll do my best to guide you through the
    app development process and try to help you avoid some of the costly mistakes
    I made along the way. Before you jump into the meat of the material, though, there
    are a few things you need to know before started.


    # Before You Begin


    You are likely chomping at the bit, ready to start building your first app, but
    there are a few things you should be aware of before forging ahead.'
