  md: '# Background Tasks


    Most mobile devices that support multitasking don''t require any additional code
    on the part of the programmer. On these devices, apps that run in the background
    are no different than the app you are viewing at the time. However, battery life
    on these devices is generally poor since the OS has to work hard to keep all these
    applications running at once.


    To address this battery issue, Apple has implemented multitasking very differently.
    When the user switches from your app to another, your app by default is *suspended*.
    Suspended applications do not execute a single line of code. They are kept in
    memory so they can be launched quickly when the user switches back to your app.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_357_0.png)


    > DEFINITION

    A suspended application is an app that is halted but not completely removed from
    memory. This allows the app to be restarted promptly by the user. The suspended
    state is new to iPhone OS 4.0.


    If you want to run code while in the background, you must tell the iPhone OS.
    Even then, there are only a few types of interactions the OS allows while your
    app is in the background. Currently, the iPhone OS supports only three types of
    background tasks:


    +   * Playing audio

    * Tracking the user''s location using Core Location

    * Continuing VOIP phone calls uninterrupted


    To support one or more of these tasks in your apps, you must include the UIBackgroundModes
    key in your project''s Info.plist file. The value for this key is an array, and
    the possible values for the array are audio, location, and voip. Without setting
    the UIBackgroundModes key, your app does not run in the background. Don''t forget
    to set it!


    # ONE MORE THING


    Setting the location key in the Info.plist file enables you to track the user''s
    location using maximum precision. However, this drains the device''s battery quite
    quickly. If your app does not require precise location information, you should
    instead register to receive only changes in position by calling startMonitoringSignificantLocationChanges
    on CLLocationManager. This drastically saves battery usage. Note that this method
    delivers location updates to your app without having to set the location key in
    your Info.plist.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_357_1.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Chapter 19: iAd and Multitasking 341


    In addition, two other ways to perform background processing include:


    +   - Request more time to complete a single task—To request more time for a task,
    call UIApplication''s beginBackgroundTaskWithExpirationHandler: method when the
    app enters the background. When the task is completed, notify the system by calling
    endTask::


    +   - Schedule a local notification—To schedule a local notification, create a
    ULocalNotification object and set its fireDate property to the time your alarm
    should go off. You can customize the text of the alarm by setting the alertBody
    property, and you can even play a custom sound by setting the soundName property
    on the local notification object.


    > DEFINITION


    A local notification is a new feature in iPhone OS 4.0 that enables you to display
    an alert message to the user. A local notification is styled exactly like an SMS
    message alert, but you can customize the text and sound made when it displays.


    After indicating that your app is background ready, you need to know when the
    application enters and exits the background. This process is explained in the
    next section.


    # Application Life Cycle for Background Processing


    Before multitasking, your application life cycle was simple. Your app was either
    or off. If the user was looking at your app, it was on. When they clicked the
    home button, the app was off.


    > DEFINITION


    The application life cycle describes the different states your application can
    be in the time it is created to the time it exits.


    Two methods are called on your application to reflect these two states. When the
    app is created, the application:didFinishLaunchingWithOptions: method is called
    on the UIApplicationDelegate. When the app is about to exit, applicationWillTerminate:
    is called on the app delegate.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 342 Part 4: The APIs You Can''t Wait to Use


    Now that multitasking is available on iPhone OS, your app can run in both the
    foreground and the background. Two new methods are invoked on the application
    delegate in iPhone OS 4.0 to notify you when the app enters and exits these states:


    +   * applicationDidEnterBackground:

    * applicationWillEnterForeground:


    # DEFINITION


    A single application is displayed to the user at a time, and this application
    is said to be running even when they are not visible to the user are are said
    to be running in the background.


    These methods notify you when your app enters and exits background execution.
    When entering the background, you should save your application state because your
    app can be terminated when running in the background. When the user switches back
    to your app, the applicationWillEnterForeground: method is called. This is a great
    place to redraw your interface and re-enable any settings you turned off when
    entering the background.


    # CRASH AND LEARN


    Be aware that the user can manually quit your app when it is running in the background.
    When this happens, applicationWillEnterTerminate: is invoked immediately.


    # THERE''S A TIP FOR THAT


    Apple provides a really great explanation of the application life cycle in their
    documentation. Head over to http://developer.apple.com/iphone, and for the page
    titled “The Core Application Design” in the “iPhone Application Programming Guide”
    document to locate this excellent resource.


    # Sample Code


    To see how multitasking works in practice, several sample projects are available
    online:


    +   * Local Notifications app—The first example sets an alarm that goes off 5
    seconds after the app enters the background. The Xcode project is available here:
    http://troybrant.net/iphonebook/chapter19/LocalNotifications.zip.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Chapter 19: iAD and Multitasking 343


    +   * **Background Audio**—The second app shows how to play audio in the background.
    The Xcode project is available here: http://royvant.net/iphonebook/chapter19/BackgroundAudio.zip.


    +   * **Significant Change Location Tracking**—The third app tracks changes in
    the user''s location. The Xcode project is available here: http://royvant.net/iphonebook/chapter19/SignificantChangeLocationTracking.zip.


    +   * **Precise Location Tracking**—The fourth app shows how to get precise location
    data while the app is running in the background. The Xcode project is available
    here: http://royvant.net/iphonebook/chapter19/PreciseLocationTracking.zip.


    Be sure to check the Info.plist file in the sample projects to see when you need
    to use the UIBackgroundModes and when you don''t.


    # Be a Good Multitasking Citizen


    When your app enters background execution, there are some rules you need to follow
    to be considered a well-behaved background application. These rules include:


    +   * **Do not make any OpenGL ES calls**—If you issue any OpenGL ES calls while
    running in the background, the iPhone OS immediately terminates your application.
    Although most of these rules are recommendations, this rule is a requirement.


    +   * **Avoiding your windows and views**—When your app is running in the background,
    the user won''t see the interface until she activates the application. Save battery
    and processing power by queuing all your redrawing for when the app is brought
    to the foreground.


    +   * **Save your application data before moving to the background**—Your application
    might terminate while in the background, so be prepared to restore the state in
    the event of early termination.


    A full list of best practices can be found on http://developer.apple.com/iphone
    on the page titled “Executing Code in the Background” in the “iPhone Application
    Programming Guide” document.'
  merge: -1
