  md: "# Chapter 11: View Controllers 183\n\n+   * When presentModalViewController:animated\
    \ is used, it establishes a parent-child relationship between the current view\
    \ controller and the new one. So no matter what happens on the modal view controller,\
    \ when it is dismissed, the current view controller is shown again. For Tweet,\
    \ this means that the Settings button flips to the Settings view, and when the\
    \ Done button is tapped on the Settings view, the view flips back to the Tweet\
    \ view.\n\n+   * As always, notice that you used alloc/init to initialize the\
    \ settingsViewController, so you must release it.\n\nAfter adding the previous\
    \ code, save your app, build it, and run it in the simulator. Give that Settings\
    \ button a tap and see what happens. If you see a gorgeous flip animation, then\
    \ you're on the right track.\n\nNow, trying the Done button on the settings screen.\
    \ Humm, nothing happens. Let's do something about that.\n\n# Flip Back to the\
    \ Tweet Screen\n\nWhen the user taps the Done button on the Settings view, you\
    \ want it to flip back to the Tweet view. To achieve this, you just need to dismiss\
    \ the modal view. Add the following code to SettingsViewController.m to flip back\
    \ to the Tweet view:\n\n```\n// SettingsViewController.m\n```\n\n```\n// Dismisses\
    \ the settings view by flipping back to the tweet view\n- (IBAction) doneButtonTapped\n\
    {\n  [self dismissModalViewControllerAnimated:YES];\n}\n```\n\n> ONE MORE THING\
    \ The previous code shows how a modal view can dismiss itself; however, this is\
    \ not the proper way to dismiss a modal view controller. Convention dictates that\
    \ the view controller that originally displayed the modal view also dismiss the\
    \ modal view. In the Tweet app, this means ViewController should dismiss the settings\
    \ modal view, but self-dismissal shown above works for now."
