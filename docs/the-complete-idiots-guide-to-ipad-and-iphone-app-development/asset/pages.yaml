    # Object-Oriented Programming Review


    To program effectively in Objective-C, you need to have a pretty good idea of
    how object-oriented programming (OOP) works. Take a few moments to review the
    topics and terminology introduced below:


    +   - **Class**: Blueprint used to create objects. Also defines the *type* of
    the object.

    - **Object**: Specific allocation of a class. Can also be referred to as an *instance*.

    - **Constructor**: Method used to create an instance of a class. In Objective-C,
    constructors are often referred to as “initializers.”

    - **Method**: A function that an object knows how to perform. We have seen these
    referred to as “actions” in Interface Builder.

    - **Instance Variable**: A specific piece of data belonging to an instance. You
    have seen these referred to as “outlets” in Interface Builder.

    - **Inheritance**: The practice of one class defining another class as its parent.
    The child class can access all the instance variables and methods from the parent
    class.

    - **Subclass/Superclass**: A subclass, or child class, inherits instance variables
    and methods from its superclass, or parent class.'
