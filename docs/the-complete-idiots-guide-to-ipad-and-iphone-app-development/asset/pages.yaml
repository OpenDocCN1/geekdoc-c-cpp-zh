  md: 'Studio, you will notice some similarities in the interface, but there are enough
    new elements to make it feel like a different animal.


    The project window is broken down into several components, listed below:


    +   **Groups & Files Section:** This is where you can navigate between files in
    your project. The folders that you see (Classes, Other Sources, Resources, Frameworks,
    and Products) are called groups in Xcode-speak. You can add and remove groups
    as you see fit to keep your project organized.


    # CRASH AND LEARN


    Even though they may look like folders, groups in the Groups & Files Section do
    not necessarily correspond to folders on disk. For instance, if you select **Other
    Sources > main.m**. Ctrl-click, and select **Reveal in Finder**, you will find
    that main.m is not in a folder named Other Sources. Groups are just a way to keep
    your files organized inside Xcode without affecting how your files are organized


    +   **Detail Section:** The Detail Section shows a list of elements in each item
    in the Groups & Files Section. If you select a group, for instance, you will see
    all the files in that group.


    +   **Editor Section:** This is where the magic happens. After selecting a file,
    you can modify the code in the editor section.


    +   **Editor Toolbar:** This small bar sits on the top of the Editor Section and
    packs a big feature. The arrows at the far left can be used to move back and forth
    in your file history, similar to a web browser. Next to the arrows is a popup
    button that can also be used to visually navigate within your project by selecting
    the file you want to jump from a list. The next button to the right allows you
    to jump to a specific section or method within the current file. To the right
    of this button are several smaller buttons whose functions you can see by hovering
    your mouse over them. These buttons won''t be discussed in this book, but feel
    free to try them for your own benefit.


    +   **Status Bar:** When *building* your project, the Status Bar shows whether
    your application completed the build successfully.'
