  md: "# Part 3: Multi-View Applications\n\nUITableView:cellForRowAtIndexPath:, you\
    \ are probably wondering what the heck index path is. Despite its nonobvious name,\
    \ it is actually quite simple to understand. NSIndexPath object contains the section\
    \ and row of a cell requested by the UITableView. To access the requested section,\
    \ use the section property of NSIndexPath. To access the row, use the row property.\n\
    \n# Example\n\nTo see how the data source works, let's take a look at an example:\n\
    \n+   - (void)viewDidLoad\n{\n  // Tell the table view you are its data source\n\
    \  tableView.dataSource = self;\n}\n\n+   - Sets the number of sections in the\
    \ table\n- (NSInteger)numberOfOfSectionsInTableView:(UITableView *)\n{\n  return\
    \ 2;\n}\n\n+   - Sets the number of rows in a particular section of the table\n\
    - (NSInteger)tableView:(UITableView *)\nnumberOfRowsInSection:(NSInteger)section\n\
    {\n  // This method is called twice, once for each section\n  return 2;\n}\n\n\
    +   - Give the table cell to display for a single row\n-(UITableViewCell *)tableView:(UITableView\
    \ *)\ncellForRowAtIndexPath:(NSIndexPath *)indexPath\n{\"\n\n+   - Create the\
    \ cell\nUITableViewCell *cell =\n[[UITableViewCell alloc]\n  initWith:UITableViewCellStyleDefault\n\
    \  reuseIdentifier:nil];"
