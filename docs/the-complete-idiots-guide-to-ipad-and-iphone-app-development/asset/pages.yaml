    Using Clang is really simple since it is built into Xcode. To have Clang analyze
    your code, just select Build > Build and Analyze from the top menu bar in Xcode.
    Click the Build Results tab in the Editor to see the results. Selecting each item
    in the list will take you to the line of code where there is a potential bug.
    Pretty nice, right?


