- img_proc: true
  md: '# Chapter 6: Memory Management 79


    alloc/init is the equivalent of a default constructor in other object-oriented
    languages, like Java. The alloc grabs a block of memory sufficient to store a
    Person object, and the init method sets the object''s initial state. It is very
    common to customize the init method to perform more setup. You can even define
    custom initializer methods that accept additional parameters.


    # retain/release


    To increase the reference count for an object, you send it the retain message.
    When you are finished with the object and don''t need it anymore, you decrease
    the reference count by sending it the release message. For instance:


    ```

    Person *voter = [[Person alloc] init];// voter now has a reference count of 1

    ```


    ```

    [voter retain];// voter now has a reference count of 2

    ```


    ```

    [voter release];// voter now has a reference count of 1

    ```


    At its root, there is really only one rule to memory management: if you increase
    the reference count, you must decrease it. Both alloc/init and retain increase
    the reference count for an object, and you must make sure there is a corresponding
    release. If you follow this one rule, you can always have perfect memory management,
    though it''s easier said than done.


    # dealloc


    When the reference count reaches 0, the object is deallocated. Before the memory
    is handed over the operating system, however, the object is sent to the dealloc
    message. This gives the object a chance to release any instance variables it may
    have retained. The dealloc message is sent to the voter in the code below:


    ```

    Person *voter = [[Person alloc] init];// voter now has a reference count of 1

    ```


    ```

    [voter retain];// voter now has a reference count of 2

    ```


    ```

    [voter release];// voter now has a reference count of 1

    ```


    continues'
