    Imagine your app crashes, providing very few details in the console beyond the
    cryptic string EXC_BAD_ACCESS. Now, multiply the aggravation you feel 100-fold
    as this EXC_BAD_ACCESS message shows up repeatedly while developing your app.
    You slowly move code around and hack until the errors away, but you''re left with
