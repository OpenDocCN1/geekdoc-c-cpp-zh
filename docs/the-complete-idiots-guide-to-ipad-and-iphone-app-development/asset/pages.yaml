    # # The Basics


    One of the first things you might notice about Objective-C code is the prolific
    use of brackets and colons: The syntax of Objective-C is based on Smalltalk, a
    language developed by Alan Kay at Xerox PARC in the 1970s. Smalltalk is object-oriented
    programming language taken to the extreme: absolutely everything is an object
    in Smalltalk. Objective-C, on the other hand, borrows the syntax supporting C-style
    primitives, such as ints, floats, and chars.'
