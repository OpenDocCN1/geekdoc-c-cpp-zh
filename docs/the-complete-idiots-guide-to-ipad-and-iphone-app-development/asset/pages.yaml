- img_proc: true
  md: '# Chapter 20: Debugging in Detail 359


    Using the debugger window, not only can you control the debugger, you can also
    see the call stack. The call stack is the list of methods that were called to
    arrive at the current line in code. At the top of the list is the method containing
    the line of code the debugger stopped in.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_376_0.png)


    # DEFINITION


    The call stack is the list of methods called to arrive at the current line of
    code.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_376_1.png)


    # ONE MORE THING


    As you might expect, Apple does not provide source code for their core libraries.
    So when you jump to Apple code when using the debugger, you will only see assembly
    code and memory addresses.


    To inspect the values of your local and instance variables, you can use the value
    inspector at the top right of the debugger window. Another way to see variable
    values is to hover over the variable you want to inspect.


    # Limitations of GDB


    GDB should be your first line of defense when debugging problems in your iPhone
    and iPad applications. It''s fast, informative, and doesn''t add a line of code
    to your project. In short, try to become comfortable with GDB.


    That being said, the Xcode implementation of GDB does some limitations. For instance,
    you can''t view the contents of a dictionary without the command line. GDB—and
    debuggers in general—are inherently poor at debugging race conditions, where two
    threads compete for use of the same resource. Sometimes, logging to the console
    is a better option for debugging than GDB.


    # NSLog


    And now it''s time to discuss every programmer''s favorite pastime: debugging
    by printing to the console. Whether it''s using printf, System.out.println, cout,
    Console.println, echo, or NSLog, printing values to debug a program is as old
    as programming itself. My official stance is that you should use GDB everywhere
    you can, but sometimes you feel like throwing in an NSLog to see what''s going
    on. Also, as mentioned previously, there are some cases where using NSLog in your
    app is a debugging necessity.'
