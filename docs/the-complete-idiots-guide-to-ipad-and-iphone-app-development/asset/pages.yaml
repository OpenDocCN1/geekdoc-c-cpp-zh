  md: '# Web Views,

    Spinners, and Alerts


    # Chapter

    10


    # In This Chapter


    +   - Browser app

    - Web views

    - Alert views

    - Toolbars

    - Action sheets

    - Spinners


    Imagine you have written an application that helps people bake cakes. For each
    ingredient, you have a link to the Wikipedia article describing the ingredient.
    In the first version of your app, tapping that link closes your application and
    opens the link in Safari. In order to get back to the cake they were baking, the
    user has to close Safari, open your app again, and navigate to the cake page,
    again. As you might imagine, doing this five times would just drive about anyone
    insane.


    After desperately fending off your users'' torches and pitchforks you decide to
    use web views instead. This time, when the user taps the web link next to the
    ingredient, the web page is displayed inside your app. Your users rejoice because
    they don''t have to constantly jump between Safari and your app over and over
    again!


    In this chapter, you learn how to incorporate web views into your own apps. While
    the web page is loading, you will display a spinner to give the user visual feedback,
    and you will use alerts for displaying error messages. After you have everything
    working, you will add a toolbar and use action sheets for listing bookmarked websites.
    It might sound like a lot, but the code to build the sample app is simple, as
    you will find out very shortly.'
  merge: -1
