  md: '# Switches, Sliders, and Controls


    # Chapter 7


    # In This Chapter


    +   - Built-in user interface controls

    - Adding switches, sliders, and segmented controls to your app

    - The Fonts app

    - Modify labels using UIFont and NSString classes


    When was the last time you entered data into a form on the web? Likely, it wasn''t
    too long ago. Perhaps you had to provide an absurd amount of information, checking
    checkboxes and clicking radio buttons until you wanted to cry. And this is a scenario
    you have probably repeated hundreds of times, filling out forms for this and on
    that the web.


    At this point, seeing and using the controls on these forms is second nature for
    you. However, did you know that you won''t find a single checkbox, radio dropdown
    menu in the interface of native applications? When Apple built the iPhone, they
    developed a set of basic controls specially targeted toward a handheld device.
    In this chapter, you will learn how to use three of these controls: switches,
    sliders, and segmented controls.


    # Basic Built-In Controls


    Several of the controls on the iPhone and iPad are similar to controls you are
    accustomed to the desktop. For instance, the slider control looks very much like
    sliders you would see in a Java or C# application. However, other controls are
    unique to the iPhone OS and take advantage of the touch-friendly screen.'
