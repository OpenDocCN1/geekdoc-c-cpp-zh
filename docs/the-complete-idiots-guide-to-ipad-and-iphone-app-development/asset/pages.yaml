  md: '# Hardware


    To develop for iPhone and iPad, you must have an Intel-based Mac with OS X version
    10.6 or later installed. If you have a Windows or Linux machine, you''ll need
    to take the plunge and buy a Mac if you want to do iPhone development. If you
    can check the version you have by selecting Apple icon on the top bar > About
    This Mac.


    The good news is that you do not need a physical device to get started developing
    for iPhone and iPad. The iPhone SDK comes with a software simulator you can use
    in lieu of running your app on a real device. The simulator can''t do everything
    a real device, however, so you will need to test your app on a real device if
    you intend to do serious development.


    # DEFINITION


    The iPhone SDK is a suite of tools and applications you will use to build iPhone,
    iPod Touch, and iPad applications. Since all three devices use the iPhone operating
    system, the iPhone SDK can be used to build apps for all three devices.


    # Knowledge


    It is impossible to predict exactly how much you know before reading this book.
    So it is assumed you have the following knowledge:


    +   **Some programming experience.** You don''t have to be a genius software architect,
    but if you come across terms like "arrays," "variables," "pointers," "constants,"
    and "functions," you should know what they mean.


    +   **Some familiarity with OOP (object-oriented programming).** The terms "class,"
    "subclass," "object," and "method" should all be familiar to you. Chapter 5 reviews
    some of the basics of object-oriented programming if you are a bit rusty.


    +   **Some experience with C.** If you haven''t programmed in C before, you may
    want to brush up on pointers and C syntax. Objective-C, the language used to develop
    iPhone apps, is a derivative of C.


    # THERE''S A TIP FOR THAT


    You can flip to the appendix for some great sites that can supplement your iPhone
    programming knowledge.'
  merge: -1
