  md: '# # Navigation Controllers


    # Chapter 12


    # ## In This Chapter


    +   - Navigation bars and controllers

    - Application delegates

    - Adding buttons and changing titles on the navigation bar

    - Passing data to a new view controller

    - CelebriTweets app


    When Apple was developing the original iPhone interface, they had several teams
    working on the built-in applications. One team worked on Mail and Calendar. Another
    worked on the Phone and SMS apps. Other teams worked on the iPod, Clock, Maps,
    Settings, and Notes apps. And all of these apps had to solve the same problem:
    hierarchical navigation. How do you get around in the application? How do you
    know where you are? There was no iPhone SDK at the time, so each of these groups
    came up with their own solutions. As you can imagine, every implementation was
    slightly different, and this got messy in a hurry.


    After the teams realized they were all solving the same problem, they consolidated
    their solutions into the UINavigation class. Now, instead of 20 different navigation
    schemes, the built-in apps use just one navigation class, streamlining the process
    for both engineers and users alike.


    This navigation class Apple wrote for their own use is available to you in the
    iPhone SDK as well. In this chapter, you will learn about the UINavigation class
    and discover how you can use it to move between multiple views in your application.'
