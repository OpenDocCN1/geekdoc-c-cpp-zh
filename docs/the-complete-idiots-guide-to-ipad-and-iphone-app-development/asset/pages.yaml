  md: "# NSArray\n\nNSArray is a class provided by the Foundation framework that manages\
    \ a flat ordered collection of objects. You are likely familiar with arrays in\
    \ other languages, and NSArrays work in the same way.\n\nThe easiest way to understand\
    \ collections is to see them in action. Here is a quick sample, showing you how\
    \ to initialize and iterate through NSArray:\n\n```\n// array initialization (note\
    \ the nil at the end)\nNSArray *numberArray = [NSArray arrayWithObjects:\n[NSNumber\
    \ numberWithInt:25],\n[NSNumber numberWithFloat:3.14],\n[NSNumber numberWithBool:YES],\n\
    nil];\n\n// fast enumeration\nfor (NSNumber *num in numberArray) {\n    // @calls\
    \ the description method on each number\n    NSLog(\"number = %@\", num);\n}\n\
    \n// access and convert NSArray back to primitive C type\nint myAge = [[numberArray\
    \ objectAtIndex:0] intValue];\float pi = [[numberArray objectAtIndex:1] floatValue];\n\
    BOOL drinkingCoffee = [[numberArray objectAtIndex:2] boolValue]\n```\n\nSome important\
    \ notes about the following code:\n\n+   * The syntax for arrayWithObjects: has\
    \ an important detail. You can see, you specify the objects you want in the array\
    \ in a comma-delimited list. The end of the list is indicated by nil. Always remember\
    \ to include the nil at the end, or you will likely crash at runtime.\n\n+   *\
    \ NSNumber is a wrapper class that allows primitive C types (like ints, floats,\
    \ and BOOLs) In the previous code, you can see how NSNumber can be used to add\
    \ a number to an array and then convert it back to its original C type.\n\n+ \
    \  * To iterate through the array, Objective-C provides a convenient mechanism\
    \ called fast enumeration. In the preceding code, each time through the loop,\
    \ the num variable is set to the next entry in the array. It's much cleaner than\
    \ writing a loop for incrementing an index by hand, as you may be used to."
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Chapter 9: Pickers 131\n\n* Just like toString in Java, the description method\
    \ in Objective-C returns a\nful NSString that describes an object. NSNumber implements\
    \ the description-\nment by returning whatever number it contains in string form.\
    \ You\ncan override this method in classes you create to help debugging.\n\nTo\
    \ make your life easier, Apple incorporated the % symbol in the string for-\f\
    ormatting system. With the NSLog statement previously, the % symbol is replaced\n\
    with the string that calling [number description]. Most built-\nin classes implement\
    \ implement description method, so you can use this technique\nto inspect your\
    \ numbers, arrays, and dictionaries.\n\n# NSDictionary\n\nA dictionary is a collection\
    \ of key-value pairs. In an NSDictionary, both the key\nthe value are NSObject\
    \ types. Unlike NSArray, NSDictionary does not guarantee\nyyour data is stored\
    \ in the order it was added. Instead, dictionaries are built for\nrandom access.\
    \ When given a key, the dictionary looks up and returns the value for\nthat key.\
    \ You may know dictionaries as hash tables from other languages.\n\nAgain, the\
    \ easiest way to see how to use an NSDictionary is to see it in action:\n\n```\n\
    NSDictionary *workoutDict =\n[NSDictionary dictionaryWithObjectsAndKeys:\n@running,\
    \ @activity\n[NSDate date], @date\n[NSNumber numberWithFloat:6.2], @distance\n\
    nil];];\n```\n\n```\n// access values using valueForKey:\nNSString *activityType\
    \ = [workoutDict valueForKey:@activity];\nNSDate *workoutDate = [workoutDict valueForKey:@date];\n\
    NSNumber *distanceObject = [workoutDict valueForKey:@distance];\n```\n\n```\n\
    // convert NSNumber object to primitive float\nfloat distance = [distanceObject\
    \ float];\n```\n\n```\n// fast enumeration for dicts iterate over keys, not values\n\
    for (NSString *key in workoutDict)\nNSString *value = [workoutDict valueForKey:key];\n\
    NSLog(\"%@ key = %@, value = %@\", key, value);\n}\n```"
