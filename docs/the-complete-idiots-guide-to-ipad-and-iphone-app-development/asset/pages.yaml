  md: '# Part 1: Getting Started


    +   - Location detection

    - Compass

    - Camera

    - Video

    - Bluetooth


    # CRASH AND LEARN


    Not every device has all of these features. For instance, the iPad does not have
    a camera or video capabilities. 3GS iPhones have a compass while 3G phones do
    not. You should check for the existence of these features in code, but you should
    be aware that the features you choose to implement may limit the number of users
    your app can reach.


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_27_0.png)


    Imagine the apps you can build using these features. What can you do with an Internet
    connection? You can get Twitter apps, RSS readers, and fantasy football apps.
    What can you do when you combine 3D graphics with the accelerometer? You get novel
    game controls in games like Labyrinth, Dizzy Bee, and Roland. What can you do
    with GPS, video, and the compass? Augmented reality apps like Layar and Yelp’s
    “Monocle” continue to amaze users. Your imagination is the limit in deciding what
    kind of app to build for your iPhone or iPad.


    # Device Limitations


    iPhone programming is different from developing a PHP web application or a Java
    desktop application. Instead of having nearly virtual real estate at your disposal,
    you have a relatively small 320x480 pixel screen on the iPhone or a 1024x768 pixel
    display on the iPad. Instead of letting the garbage collector take care of all
    your memory issues for you, you are now responsible for making sure every byte
    is accounted for.


    You are about to develop on a platform that is a fraction as powerful, a fraction
    as fast, with a fraction as much space as your trusty dektops. And that is precisely
    developing for mobile devices is so exciting. These constraints drive innovation.
    You have to think more creatively to solve problems that have an obvious solution
    on the desktop.


    Now, what exactly are these limitations? For various reasons, Apple restricts
    how your application interacts with the rest of the operating system. These are
    some of the constraints you are under as an iPhone developer:


    +   - One app at a time: Your app can run only in the foreground. After the user
    uses your app, it is dead and gone and does not run until the user manually starts
    it again.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 1: Welcome to the Party!


    +   **Sandbox**: When your app launches, you are given a "sandbox" to play in
    by the iPhone OS as a protective mechanism. This means that you cannot reach or
    corrupt another application''s data, or worse, the core iPhone OS. This also means
    that you cannot communicate directly with other apps on the phone.


    +   **No garbage collection**: Most modern programming languages have some form
    of garbage collection that handles the nitty-gritty details of memory management
    for you. However, the iPhone does not have any garbage collection, and instead
    alone you are responsible for making memory is handled correctly.


    +   **Limited memory**: You have a limited amount of memory to use at your discretion.
    If the iPhone OS begins to run low on available memory, it may ask your application
    to reduce your usage. It may even forcibly quit your app entirely if memory is
    at critical levels. We''ll go over how to handle these low situations in Chapter
    5.


    +   **Limited screen size**: The iPhone''s screen is 320x480 pixels. The iPad
    display is only 1024x768 pixels. Most desktop monitors are considerably larger
    than either of these devices. Designing your interface for a small factor factor
    is one of the main challenges you will face as a developer.


    +   **Your app (and will) exit unexpectedly**: If you have used an iPhone or an
    iPad before, know that you do not politely ask for an application to close. When
    you are done, you instantly hit the home button with no regard to what your app
    is doing. The best apps are the ones that facilitate this interaction in mind—apps
    that facilitate short, quick bursts of activity.


    +   **Limited access to system services**: You do not have direct access to certain
    data on the device. In particular, you cannot access the user''s calendar data,
    SMS database of text messages, or the user''s call history or voicemails.


    Whether you love them or hate them, those constraints are realities of iPhone
    and iPad development. Instead of railing against Apple for enforcing these limitations,
    take a look at other apps to see how they creatively worked within these constraints.


