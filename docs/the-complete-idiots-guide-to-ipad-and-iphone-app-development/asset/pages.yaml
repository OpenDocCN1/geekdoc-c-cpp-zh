  md: '# Introduction


    One of the principles to keep in mind when developing iPad and iPhone apps is
    designing for short bursts of activity. Think about how you use your own mobile
    device. Likely, you open an app, use it for a spell, and close it. This book is
    written using the same philosophy. Each chapter is bite-size, and exercises never
    span more than one chapter. Sample code is short. Descriptions are succinct. I
    know you''re busy and don''t have time to waste.


    I found the only way to learn iPhone programming is to actually write iPhone apps.
    As such, this book is designed assuming that you are at your computer and writing
    the sample applications in each chapter as we go through them. You can read about
    programming all day, but it won''t stick nearly well as sitting down and working
    through the projects you yourself. This book is not written to tell you how to
    program for the iPad or iPhone, but rather to guide you through the process.


    Building applications for the iPad and iPhone is full of learning opportunities
    you won''t find anywhere else. If you''re coming from Windows-world as I did,
    you''ll be in some amazing technical challenges. A new operating system, a new
    programming environment, a new programming language, designing mobile applications
    instead of desktop applications, distributing your app using the App Store ...
    is a veritable truck of fun topics to learn.


    # Conventions Used in This Book


    Writing apps for the iPad or iPhone doesn''t always require writing code, but
    when it does, you find code examples in the book to assist you in learning the
    material. For the sake of consistency, you will find all code examples in this
    book formatted as follows:


    +   - (IBAction)buttonDown: (id)sender


    ```

    {

    NSLog("Welcome to iPhone programming!");

    }

    ```


    Any time you see text in bold, on the other hand, it represents an action, such
    as a key combination or a menu item you need to select. For instance:


