    AudioServicesPlaySystemSound(kSystemSoundID_Vibrate);

    ```


    Simply pass the kSystemSoundID_Vibrate constant to the system sound function,
    and the phone will buzz. One important to note: vibration only works on the iPhone,
    not the iPad or iPod Touch.


