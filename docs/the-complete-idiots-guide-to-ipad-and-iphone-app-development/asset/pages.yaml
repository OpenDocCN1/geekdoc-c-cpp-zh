  md: '# Chapter 5: Objective-C and Cocoa Touch


    # DEFINITION


    **Foundation** is a Cocoa Touch framework that defines the building blocks for
    your Objective-C classes. The framework includes the root NSObject class as well
    as classes for managing collections, representing dates, and building strings.


    # The id Type


    In addition to NSObject, Objective-C offers a way to define a loosely typed object:
    any object in Objective-C can be set as an id variable without the need for casting.


    The power of id lies in the fact that you can send *any* message to an object
    of type id, and it will compile, no questions asked. Even if the method is not
    actually defined, the application will run just fine until the method is actually
    called.


    ```

    // Assume someMethod doesn''t exist

    // Assume these two objects are properly initialized

    NSObject *stronglyTypedObject = ...;

    id looselyTypedObject = ...;

    ```


    ```

    // This line causes a compile warning

    [stronglyTypedObject compiles someMethod];

    ```


    ```

    // This line compiles, but causes a crash if called at runtime

    [looselyTypedObject compiles someMethod];

    ```


    The difference between a strongly typed object and a loosely typed object is shown
    in the preceding code. The lack of a * before the id object name is intentional.
    It is a bit confusing, but id objects are still pointers without the * syntax.
    If you''re familiar with C, think of the id keyword as synonymous with void *.


    Objective-C is a dynamic language, meaning you can get away with a lot more at
    compile time than you can in other languages. For instance, you can even wait
    until runtime to define entire classes and methods. Using id to define variables
    is one way to take advantage of of these dynamic properties, but most of the time
    in this book you will use strongly typed objects, such as NSObject, NSString,
    and UIButton. This way, compile-time warnings can help you catch errors early.'
