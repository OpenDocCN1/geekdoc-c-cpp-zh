  md: '# Options for launching your application


    | Action | Description | Keyboard Shortcut |

    | --- | --- | --- |

    | Debug – Breakpoints On | Launch application with the full debugger | ⌘Y |

    | Run – Breakpoints On | Launch application with limited debug output | ⌘R |

    | Debug | Launch application using the same debugger settings as the previous
    launch. | ⌘Enter |


    The easiest way to launch your application is to simply click the Build and Debug
    button in the Toolbar at the top of your Xcode window. When the build is successful,
    you will see the application at last in the iPhone Simulator.


    # Introducing the iPhone Simulator


    Shown in the following image, the iPhone Simulator is an application packaged
    with the iPhone SDK that enables you to run, test, and debug applications on your
    Mac. The simulator is versatile. If you are building an iPhone app, the simulator
    displays an iPhone. If you are building iPad or universal applications, the simulator
    displays an iPad.


    > CRASH AND LEARN

    The name is a bit misleading, but the “iPhone Simulator” Mac application simulates
    both iPhone and iPad apps. So any time you read “iPhone Simulator,” think “iPhone
    and iPad Simulator.”


    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_45_0.png)


    The simulator is the single fastest way to test if your application works. You
    will quickly discover it to be indispensable for app development.'
