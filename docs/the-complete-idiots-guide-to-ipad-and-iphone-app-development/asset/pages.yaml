  md: "Save your interface, build your project, and give Browser a try in the simulator.\
    \ If you see a blank white screen, that's perfect. You will load a web page next.\n\
    \n# Launching a Web Page\n\nTo launch a web page, use the loadRequest: method\
    \ on your UIWebView instance. To see how it works, this helper method near the\
    \ top of your ViewController.m implementation file:\n\n```\n// BrowserViewController.m\n\
    \n// Start loading a new page in the web view\n- (void)loadPageWithString:(NSString\
    \ *)url\n{\n    NSURL *url = [NSURL URLWithString:url];\n    NSRequest *request\
    \ = [NSRequest requestWithURL:url];\n    [webView loadRequest:request];\n}\n```\n\
    \nAs shown in the preceding code, the loadRequest: method takes in an NSRequest\
    \ object. The NSRequest object is constructed from an NSURL object, and the NSURL\
    \ object is initialized using an NSString, as @\"http://roybrant.net\". As soon\
    \ as the loadRequest: method finishes, the web view will display the requested\
    \ page.\n\nTo try out this nifty helper method, call it from viewDidLoadDidLoad\
    \ by adding the following code:\n\n```\n// BrowserViewController.m\n\n- (void)viewDidLoad\n\
    {\n    [super viewDidLoadDidLoad];\n    [self loadPageWithString:@\"http://roybrant.net\\\
    ];\n}\n```\n\nThe code shown previously, save your project and run it in the simulator.\
    \ The screen will be white for a while, and then you will see the website. If\
    \ the web page doesn't show up, make sure you made all your connections and didn't\
    \ misspell the preceding address. Also make sure you have a working network connection."
