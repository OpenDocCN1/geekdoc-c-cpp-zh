    ![](img/5eb8ee1dd8eb3ab735869e75af92d0ef_72_0.png)


    Your workspace interface looks good.


    # Controllers


    When a switch is flipped or a button is tapped in an interface, a controller responds
    to the interaction. The controller is the brain behind your interface. And like
    a brain, the controller needs to be properly wired to work correctly.


    For the controller to do its job, it needs to know both about the button and label
    you''ve added to the interface. Right now, the controller is a blank slate, so
    you need to tell it about the button and label, or outlets. In addition, you need
    to define the methods, or actions, that will be called when the button is pressed
    and released.


    > DEFINITION


    A controller connects your interface with the rest of your application. When a
    button is tapped in your interface, code in your controller is invoked.


    An outlet is just an instance variable, and an action is a method in an object.
    They are specially labeled so Interface Builder knows they can be connected to
    the interface.'
  merge: -1
