  md: 'In the previous example, the terms are broken down as follows:


    +   * castBallot is the message.

    * voter is the receiver.

    * The string castBallot is the selector.

    * The castBallot function defined in the Person class is the method.


    # Multiple Parameters


    One part of Objective-C that can be a little tricky methods that take in multiple
    parameters. The names of the parameters are actually part of the method name.
    These method calls, for instance:


    ```

    [object doThing];

    [object doThingWithNumber:42];

    [object doThingWithNumber:42 and:@"dolphins"];

    ```


    In the first example, doThing is a method that takes in no parameters. Note that
    it is defined in a completely different block of code than doThingWithNumber:,
    which takes in a single argument. The third example is clearer that it takes two
    arguments, but it is also defined in a completely different block of code than
    the first two. The name of the message in the third example is doThingWithNumber:and:,
    which includes both named parameters.


    # Objects


    There are a couple root-level types of objects you should know : NSObject and
    id.


    # NSObject


    Most objects you encounter in iPhone programming inherit from the same root superclass:
    NSObject. NSObject is one of the core classes provided by the Foundation framework,
    and many other things it provides the basics of memory management. Memory management
    is covered in detail in the next chapter, but for now, you should know that NSObject
    will be the root node of your class hierarchy most of the time.'
