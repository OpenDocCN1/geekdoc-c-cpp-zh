    Frenemies sample app. Speaking of which ...


    # Frenemies


    The frenemy has recently become popular to describe someone who is part friend,
    part enemy. This person could be your neighbor who always has to one-up you with
    Christmas decorations. Or maybe it''s Facebook friend who never responded when
    you spammed your friend list for numbers since you lost your phone. You know the
    type.


    The way Twitter is structured, you can follow someone, but they do not have to
    follow you back. For the Frenemies application, this situation defines a frenemy:
    someone you follow who doesn''t follow you back. You create an app that identifies
    these supposed friends (jerks!) while at the same time demonstrating how to use
    table views in a real application.'
