  md: 'A modal view is a temporary view in your application that requires the user
    to perform some action to dismiss it. Many applications use modal views for adding
    and editing data, such as composing an email in the Mail app, adding an event
    in the Calendar app, or picking a photo for a contact in the Contacts app. In
    each of these cases, the modal view slides up from the bottom of the screen and
    covers whatever screen you were viewing.


    # DEFINITION


    **A modal view** is a temporary view in your application that is used to obtain
    information from the user. Like action sheets and alert views, modal views are
    displayed until the user manually dismisses the view.


    Modal views are also used in Apple terms *utility applications*. Utility apps
    are simple applications that display a single view with a view for settings *behind*
    the single view. The Stocks and Weather apps are examples of these kinds of apps.
    If you open the Weather app and tap the “i” button in the bottom-right corner,
    the view flips to the Settings view.


    # DEFINITION


    **A utility application** is one that is dedicated to a single task and consists
    of a single screen. For example, the Stocks and Weather apps for iPhone are utility
    apps.


    The ViewController class has built-in support for displaying views modally. By
    default, modal views are displayed using the vertical slide animation. The Tweet
    app falls under the utility app category, however, so you will specify that you
    want to use the flip transition.


    # Transition Styles


    A controller''s modalTransitionStyle property determines how the view appears
    on screen when displayed modally. There are four transition options:


    +   * **Cover vertical:** The modal view slides up from the bottom of the screen
    to cover the screen. This is the default transition style.


    +   * **Flip horizontal:** The current view flips to reveal the modal view as
    if it were behind the current view. You will use this transition to display the
    Tweet settings screen.'
  merge: -1
