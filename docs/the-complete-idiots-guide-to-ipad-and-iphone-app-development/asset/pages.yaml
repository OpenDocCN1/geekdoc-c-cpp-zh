  md: '# Cooking with Cocoa


    > DEFINITION

    Objective-C is an object-oriented programming language built on top of C.

    Objective-C is the primary language used to build both Mac OS X and iPhone applications.


    One of the main reasons iPhone and iPad are such powerful devices is that they
    share much in common with Mac OS X. Instead of writing a completely new operating
    system for the phone, Apple started with Mac OS X and trimmed it down until it
    could fit on a mobile device. Many of the frameworks that power the iPhone OS
    are nearly identical to the ones you use on a Mac.


    There are many frameworks on the Mac, but the ones most used for application development
    are collectively known as Cocoa. Cocoa provides basic structures—arrays, dictionaries,
    strings, objects—required for most application development. It also includes the
    user interface building blocks that make your life as a programmer much easier.


    While the Mac has Cocoa, the iPhone has Cocoa Touch, Cocoa Touch is a scaled-down
    version of Cocoa that is designed for the unique properties of a small, portable
    touch-based device.


    > DEFINITION

    Cocoa is the collection of frameworks, APIs, and standard tools you need to build
    Mac OS X applications. Cocoa Touch is a version of Cocoa used to develop for touch-based,
    mobile devices like the iPad, iPhone, and iPod.


    Where does Objective-C fit into this picture? All the Cocoa classes are written
    in Objective-C. Although the language has a different syntax, Objective-C is a
    superset of C. This means that C code will also compile using the Objective-C
    compiler. In fact, some of the frameworks on the phone—most notably the AddressBook
    framework—are written entirely in C. However, Objective-C will be used for most
    of the code in this book except where using C is much more convenient.


    > ONE MORE THING

    You can also combine C++ code with Objective-C. C++ files used in iPhone programming
    ending with a "mm" extension are typically referred to as Objective-C++ files.'
