    # TypeScript StyleGuide and Coding Conventions


    An unofficial TypeScript StyleGuide


    People have asked me for my opinions on this. Personally I don''t enforce these
    a lot on my teams and projects but it does help to have these a tie breaker when
    someone feels the need to have such strong consistency. There are other things
    that I feel much more strongly about those are covered in the tips chapter (e.g.
    type assertion is bad, property setters are bad).


    Key Sections:


    +   * Variable

