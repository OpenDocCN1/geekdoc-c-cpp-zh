    In compatibility of complex types composed of such Base and Child depending on
    where the Base and Child in similar scenarios is driven by variance.


    +   * Covariant: (corporate) only in same direction

    * Contravariant: (contra negative) only in opposite direction

    * Bariant: (bi aka both) co and contra.

    * Invariant: if the types aren''t exact then they are incompatible.


    > Note: For a completely subtle type system in the presence of mutable data like
    JavaScript, invariant is the only valid option. But as mentioned convenience forces
    us to make unknown choices.


    # Functions


    There are a few subtle things to consider when comparing two functions.


    # Return Type


    covariant : The return type must contain at least enough data.


    ```

    /** Type Heirarchy */

