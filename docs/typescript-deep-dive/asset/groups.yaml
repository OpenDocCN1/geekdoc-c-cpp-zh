    对于一种声称是函数式的语言，在 JavaScript 中你倾向于输入很多 `function`。胖箭头让创建函数变得简单：\n\n```javascript\n\
    var inc = (x)=>x+1;\n```\n\n`this` 在 JavaScript 中传统上是个棘手的问题。正如一位智者所说：“我讨厌 JavaScript，因为它倾向于丢失\
