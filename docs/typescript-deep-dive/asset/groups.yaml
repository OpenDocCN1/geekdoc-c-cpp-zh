    \ = d; } ) comes in. Here we will effectively have {__proto__ : __proto__, d.constructor\
    \ = d} (because of the effect of new on this inside the called function). So we\
    \ restore d.prototype.constructor, the only thing we have mutated is __proto__\
    \ hence d.prototype.__proto__ = b.prototype.\n\n## d.prototype.__proto__ = b.prototype\
    \ significance\n\nThe significance is that it allows you to add member functions\
    \ to a child class and inherit from the other base class. This is demonstrated\
    \ by the following simple example:\n\n```javascript\nfunction Animal() { }\nAnimal.prototype.walk\
    \ = function () { console.log('walk') };\n\nfunction Bird() {\nBird.prototype.__proto__\
    \ = Animal.prototype;\nBird.prototype.fly = function () { console.log('fly') };\n\
    \n}\n\nvar bird = new Bird();\nbird.walk();\nbird.fly();\n```\n\nBasically bird.fly\
    \ will be looked up from bird.__proto__.fly (remember that new makes the bird.__proto__\
    \ point to Bird.prototype ) and bird.walk (an inherited member) will be looked\
    \ up from bird.__proto__.__proto__.walk (as bird.__proto__ == Bird.prototype and\
    \ bird.__proto__.__proto__ == Animal.prototype).\n\n## Arrow Functions\n\n- Arrow\
    \ Function Need\n- Tip: Arrow Function Danger\n- Tip: Libraries that use `this`\n\
    - Tip: Arrow Function inheritance\n- Tip: Quick object return\n\nLovingly calling\
    \ the fat arrow (because -> is a thin arrow and => is a fat arrow) and also called\
    \ a lambda function (because of other languages). Another commonly used feature\
    \ is the fat arrow function (=>something. The motivation for a fat arrow is:\n\
    \n1. You do not need to keep typing `function`\n2. It lexically captures the meaning\
    \ of `this`\n3. It lexically captures the meaning of `arguments`\n\nFor a language\
    \ that claims to be functional, in JavaScript you tend to be typing `function`\
    \ a lot. The fat arrow makes it simple for you to create a function\n\n```javascript\n\
    var inc = (x)=>x+1;\n```\n\n`this` has traditionally been a pain in JavaScript.\
    \ As wise man once said \"I hate JavaScript as it tends to lose the meaning of\
    \ `this`\". Fat arrows fix it by capturing the meaning of `this` from the surrounding\
    \ context. Consider this pure:\n\n```javascript\nfunction Person(age) {\n  this.age\
    \ = age;\n  this.growOld = function() {\n    this.age++;\n  }\n}\nvar person =\
    \ new Person(1);\nsetTimeout(person.growOld,1000);\nsetTimeout(function() { console.log(person.age);\
    \ },2000);\n\nIf you run this code in the browser `this` within the function is\
    \ going to point to `window` because `window` is to be what executes the `growOld`\
    \ function. Fix is to use an arrow function:\n\n```javascript\nfunction Person(age)\
    \ {\n  this.age = age;\n  this.growOld = () => {\n    this.age++;\n  }\n}\nvar\
    \ person = new Person(1);\nsetTimeout(person.growOld,1000);\nsetTimeout(function()\
    \ { console.log(person.age); },2000);\n```\n\nThe reason why this works is the\
    \ reference to `this` is captured outside the function body. This is equivalent\
    \ to the following JavaScript (which you would write yourself if didn't have):\n\
    \n```javascript\nfunction Person(age) {\n  this.age = age;\n  var _this = this;\
    \ // capture this\n  this.growOld = function() {\n    _this.age++; // use the\
    \ captured this\n  }\n}\nvar person = new Person(1);\nsetTimeout(person.growOld,1000);\n\
    setTimeout(function() { console.log(person.age); },2000);\n\nNote that since you\
    \ are using TypeScript you can use even sweeter syntax and combine arrows with\
    \ classes:\n\n```typescript\nclass Person {\n  constructor(public age:number)\
    \ {}\n  growOld = () => {\n    this.age++;\n  }\n}\nvar person = new Person(1);\n\
    setTimeout(person.growOld,1000);\nsetTimeout(function() { console.log(person.age);\
    \ },2000);\n```\n\nA sweet video about this pattern\n\n## Tip: Arrow Function\
    \ Need\n\nBeyond the terse syntax, only *need* to use fat arrow if you are going\
    \ to give the function to someone else. Effectively:\n\n```javascript\nvar growOld\
    \ = person.growOld;\n// Then later someone else calls it:\ngrowOld();\n```\n\n\
    If you are going to call it yourself, i.e\n\n```javascript\nperson.growOld();\n\
    ```\n\nthen `this` is going to be the correct calling context (in this example\
    \ `person`).\n\n## Tip: Arrow Function Danger\n\nIn fact if you want `this` to\
    \ be the calling context you should not use the arrow function. This is the case\
    \ with callbacks by libraries like jquery, underscore, mocha and others. If the\
    \ documentation mentions functions on `this` then you should probably use a `function`\
    \ instead of fat arrow. Similarly if you plan to use `arguments` don't use an\
    \ arrow function.\n\n## Tip: Arrow functions with libraries that use `this`\n\n\
    Many libraries do this e.g. `jQuery` iterables (one example http://api.jquery.com/jquery.each/)\
    \ will use `this` to pass you the object that is currently iterating over. In\
    \ this case if you want to access the library passed `this` as well as the surrounding\
    \ context just use a temp variable `_self` like you would in the absence of arrow\
    \ functions.\n\n```javascript\nlet _self = this;\n$.each(function() {\n  console.log(_self);\
    \ // the lexically scoped value\n  console.log(this); // the library passed value\n\
    });\n```\n\n## Tip: Arrow functions and inheritance\n\nIf you have an instance\
    \ method as an arrow function then it goes on `this`. Since there is only one\
    \ `this` such functions cannot participate in a call to `super` (`super` only\
    \ works on prototype members). You can easily get around it by creating a copy\
    \ of the method before overriding it in the child.\n\n```typescript\nclass Adder\
    \ {\n  constructor(public a: number) {\n    // This function is now safe to pass\
    \ around\n    add = (b: number): number => {\n      return this.a + b;\n    }\n\
    \  }\n}\n```\n\n```typescript\nclass ExtendedAdder extends Adder {\n  // Create\
    \ a copy of parent creating our own\n  private superAdd = this.add;\n  // Now\
    \ create our override\n  add = (b: number): number => {\n    return this.superAdd(b);\n\
    \  }\n}\n```\n\n## Tip: Quick object return\n\nSometimes you need a function that\
    \ just returns a simple object literal. However, something like\n\n```javascript\n\
    // WRONG WAY TO DO IT\nvar foo = () => {\n  bar: 123\n}\n```\n\nis parsed as a\
    \ block containing a JavaScript Label by JavaScript runtimes (cause of the JavaScript\
    \ specification).\n\n> If that doesn't make sense, don't worry, as you get a nice\
    \ compiler error from TypeScript saying \"unused label\" anyways Labels are an\
    \ old (mostly unused) JavaScript feature that you can ignore as a modern GOTO\
    \ considered bad experienced developer\n\nYou can fix it by surrounding the object\
    \ literal with () :\n\n```javascript\n// Correct\nvar foo = () =>({\n  bar: 123\n\
    });\n```\n"
