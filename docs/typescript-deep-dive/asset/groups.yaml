  - "[PAGE 171]\n\n# Literals\n\nLiterals are exact values that are JavaScript primitives.\n\
    \n# String Literals\n\nYou can use a string literal as a type. For example:\n\n\
    ```\nlet foo: 'Hello';\n```\n\nHere we have created a variable called foo that\
    \ will only allow the literal value 'Hello' to be assigned to it. This is demonstrated\
    \ below:\n\n```\nlet foo: 'Hello';\nfoo = 'Bar'; // Error: \"Bar\" is not assignable\
    \ to type \"Hello\"\n```\n\nThey are not very useful on their own but can be combined\
    \ in a type union to create a powerful (and useful) abstraction e.g.:\n\n```\n\
    type CardinalDirection =\n  \"North\"\n  | \"East\"\n  | \"South\"\n  | \"West\"\
    \n\nfunction move(distance: number, direction: CardinalDirection) {\n  // ...\n\
    }\n```\n\n```\nmove(1,\"North\"); // Okay\nmove(1,\"Nurth\"); // Error!\n```\n\
    \n# Other literal types\n\nTypeScript also supports boolean, numbers as literals,\
    \ e.g.:\n\n```\ntype OneToOne = 1 | 2 | 3 | 4 | 5;\ntype Bools = true | false;\n\
    ```\n\n# Inference"
- md: "\nQuite commonly you get an error Type string is not assignable to type \"\
    foo\". The following example demonstrates this.\n\n```typescript\nfunction iTakeFoo(foo:\
    \ 'foo') {\n  const test = {\n    someProp: 'foo'\n  };\n  iTakeFoo(test.someProp);\
    \ // Error: Argument of type string is not assignable to parameter of type 'foo'\n\
    }\n```\n\nThis is because test is inferred to be of {someProp: string}. The fix\
    \ here is to use a simple type assertion to tell TypeScript the literal you want\
    \ it to infer as shown below:\n\n```typescript\nfunction iTakeFoo(foo: 'foo')\
    \ {\n  const test = {\n    someProp: 'foo' as 'foo'\n  };\n  iTakeFoo(test.someProp);\
    \ // Okay!\n}\n```\n\n# Use cases\n\nValid use cases for string literal types\
    \ are:\n\n## String based enums\n\nTypeScript enums are number based. You can\
    \ use string literals with union types to mock a string based enum as we did in\
    \ the CardinalDirection example above. You can even generate a Key:Value structure\
    \ using the following function:\n\n```typescript\n/** Utility function to create\
    \ a K:V from a list of strings */\nfunction strEnum<T extends string>(o: Array<T>):\
    \ {[K in T]: K} {\n  return o.reduce((res, key) => {\n    res[key] = key;\n  \
    \  return res;\n  }, Object.create(null));\n}\n```\n\nAnd then generate the literal\
    \ type union using keyof typeof . Here is a complete example:\n\n```typescript\n\
    /** Utility function to create a K:V from a list of strings */\nfunction strExtends<T\
    \ extends string>(o: Array<T>): {[K in T]: K} {\n  return o.reduce((res, key)\
    \ => {\n    res[key] = key;\n    return res;\n  }, Object.create(null));\n}\n\
    ```\n\n```typescript\n/**\n * Sample create a string enum\n */\n/** Create a K:V\
    \ */\nconst Direction = strEnum([\n  'North',\n  'South',\n  'East',\n  'West'\n\
    ])\n```\n\n```typescript\n/**\n * Sample using a string enum\n */\ntype Direction\
    \ = keyof typeof Direction;\n\nlet sample: Direction;\n\nsample = Direction.North;\
    \ // Okay\nsample = 'North'; // Okay\nsample = 'AnythingElse'; // ERROR!\n```\n\
    \n# Modelling existing JavaScript APIs\n\nE.g. CodeMirror editor has an option\
    \ readOnly that can either be a boolean or the literal string \"nocursor\" (effective\
    \ valid values true,false,\"nocursor\" ). It can be declared as:\n\n```typescript\n\
    readOnly: boolean | 'nocursor';\n```\n\n# Discriminated Unions\n\nWe will cover\
    \ this later in the book.\n\n## readonly\n\nTypeScript's type system allows you\
    \ to mark individual properties on an interface readonly . This allows you to\
    \ work in a functional way (unexpected mutation is bad):\n\n```typescript\nfunction\
    \ foo(config: {\n  readonly bar: number,\n  readonly bas: number\n}) {\n  // ..\n\
    }\nlet config = { bar: 123, bas: 123 };\nfoo(config);\n// You can be sure that\
    \ `config` isn't changed\n```\n\nOf course you can use readonly in interface type\
    \ definitions as well e.g.:\n\n```typescript\ntype Foo = {\n  readonly bar: number;\n\
    \  readonly bas: number\n}\n// Initialization is okay\nlet foo: Foo = { bar: 123,\
    \ bas: 456 };\n\n// Mutation is not\nfoo.bar = 456; // Error: Left-hand side of\
    \ assignment expression cannot be a or a read-only property\n```\n\nYou can even\
    \ declare a class property as readonly . You can initialize them at the point\
    \ of\ndeclaration or in the constructor as shown below:\n\n```typescript\nclass\
    \ Foo {\n  readonly bar = 1; // OK\n  readonly bas: string;\n  constructor() {\n\
    \    this.baz = \"hello\"; // OK\n  }\n}\n```\n\n# Readonly\n\nThere is type Readonly\
    \ that takes a type T and marks all of its properties as readonly using mapped\
    \ types. Here is a demo that uses it in practice:\n\n```typescript\ntype Foo =\
    \ {\nbar: number;\nbas: number;\n}\n\ntype FooReadOnly = Readonly<Foo>\n\nlet\
    \ Foo: {bar: 123, bas: 456};\nlet FooReadOnly: FooReadOnly = {bar: 123, bas: 456};\n\
    \nfoo.bar = 456; // Okay\nFooReadOnly.bar = 456; // ERROR: bar is readonly\n```\n\
    \n# Various Use Cases\n\n## ReactJS\n\nOne library that loves immutability is\
    \ ReactJS, you could mark your Props and State to be immutable e.g.:\n\n```typescript\n\
    interface Props {\n  readonly foo: number;\n}\ninterface State {\n  readonly bar:\
    \ number;\n}\nexport class Something extends React.Component<Props, State> {\n\
    \  someMethod() {\n    // You can rest assured no one is going to do\n    this.props.foo\
    \ = 123; // ERROR: (props are immutable)\n    this.state.baz = 456; // ERROR:\
    \ (one should use this.setState)\n  }\n}\n```\n\nYou do not need to however the\
    \ type definitions for React mark these as readonly for you (by internally wrapping\
    \ the passed in generic types with the Readonly type mentioned above).\n\n```typescript\n\
    export class Something extends React.Component<Props, State> {\n  someMethod()\
    \ {\n    // You can rest assured no one is going to do\n    this.props.foo = 123;\
    \ // ERROR: (props are immutable)\n    this.state.baz = 456; // ERROR: (one should\
    \ use this.setState)\n  }\n}\n```\n\n## Immutable\n\nYou can even mark index signatures\
    \ as readonly:\n\n```typescript\n/**\n * Declaration\n */\ninterface Foo {\n \
    \ readonly [P: string]: any;\n}\n\n/**\n * Usage\n */\nlet foo = { bar: 123, bas:\
    \ 456 };\nconsole.log(foo.bar); // Ok\nfoo.bar = 456; // Error: Read-only property\
    \ 'bar' does not exist\n```\n\n## Automatic Inference\n\nIn some cases the compiler\
    \ can automatically infer the type for you:\n\n```typescript\nlet foo = {\n  bar:\
    \ 123,\n  bas: 456\n};\n// If you want it to be readonly:\nconst config = {\n\
    \  bar: 123,\n  bas: 456\n};\nconfig.bar = 456; // Error: Cannot assign to read-only\
    \ property\n```\n\n## Generics\n\nThe key for generics is to provide meaningful\
    \ constraints. Consider the simple Queue (first in, first out) data structure:\n\
    \n```typescript\nclass Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n```\n\nOne issue with this implementation\
    \ is that it allows people to add anything to the queue and when they pop it is\
    \ anything. This is shown below, where someone can push numbers:\n\n```typescript\n\
    class Queue {\n  private data = [];\n  push = (item: number) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n\nconst queue = new Queue();\nqueue.push(0);\n\
    queue.push(\"1\"); // Error: Argument 'string' is not assignable to type 'number'\n\
    ```\n\nWhat you really want is a way to say that whatever the type of the stuff\
    \ getting pushed it should be the same for whatever gets popped. This is done\
    \ easily with a generic parameter (in this case, at the class level):\n\n```typescript\n\
    /** A class definition with a generic parameter */\nclass Queue<T> {\n    private\
    \ data = [];\n    push = (item: T) => this.data.push(item);\n    pop = () => T\
    \ => this.data.shift();\n}\n\n/** Again sample usage */\nconst queue = new Queue<number>();\n\
    queue.push(0);\nqueue.push(\"i\"); // Error: Argument 'string' is not assignable\
    \ to type 'number'\n```\n\nAnother example that we have already seen is that of\
    \ a reverse function, here the constraint is between what gets passed into the\
    \ function and what the function returns:\n"
  mdcn: "\n\n通常情况下，你会遇到错误 `Type string is not assignable to type \"foo\"`。下面的示例演示了这一点。\n\
