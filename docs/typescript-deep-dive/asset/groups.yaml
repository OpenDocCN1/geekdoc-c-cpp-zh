    function Foo() {}\nconsole.log(Foo.prototype); // {} 意味着它存在且未定义\nconsole.log(Foo.prototype.constructor\
    \ === Foo); // 有一个名为 'constructor' 的成员指向该函数\n```\n\n现在让我们看看 `new` 运算符对被调用函数内部\
