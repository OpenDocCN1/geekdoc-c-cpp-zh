    ```

    console.log(Number.MAX_SAFE_INTEGER + 1 === Number.MAX_SAFE_INTEGER + 2); // true!

    console.log(Number.MIN_SAFE_INTEGER - 1 === Number.MIN_SAFE_INTEGER - 2); // true!

    ```


    ```

    console.log(Number.MAX_SAFE_INTEGER); // 000799254740991

    console.log(Number.MAX_SAFE_INTEGER + 1); // 000799254740992 Correct

    console.log(Number.MAX_SAFE_INTEGER + 2); // 000799254740993 Rounded!

    console.log(Number.MAX_SAFE_INTEGER + 3); // 000799254740994 Rounded correct by
    luck

    console.log(Number.MAX_SAFE_INTEGER + 4); // 000799254740996 Rounded!

    ```


    To check safety you can use ES6 Number.isSafeInteger :


    ```

    // Safe value

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER)); // true

    ```


    ```

    // Unsafe value

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER + 1)); // false

    ```


    ```

    // Because it might have been rounded due to overflow

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER + 10)); // false

    ```


    > For arbitrary precision integer math use big.js mentioned below.


    # big.js


    Whenever you use math for financial calculations (e.g. GST calculation, money
    with cents addition etc) use a library like big.js which is designed for


    +   - Perfect decimal math.

    - Safe out of bound integer values


    Installation is simple:


    ```

    npm install big.js @types/big.js

    ```


    Quick Usage example:


    ```

    import { Big } from ''big.js'';


    export const foo = new Big(''111.11111111111111111111'');

    export const bar = foo.plus(new Big(''0.00000000000000000001''));


    // To get a number

    const x: number = Number(bar.toString()); // Looses the precision

    ```'
