    # lib.dts inside look


    The contents of lib.dts are primarily a variable declarations e.g. window , document
    , math and a bunch of similar interface declarations e.g. Window , Document ,
    Math.


    The simplest way to discover what it is to type in code that you know works e.g.
    Math.floor and then F12 (go to definition) using your IDE (atom-typescript has
    great support for this).


    Let''s look at a sample variable declaration, e.g. window is defined as:


    ```

    declare var window: Window;

    ```


    That is just a simple declare var followed by the variable name (here window )
    and an interface for a type annotation (here Window interface). These variables
    generally point to some global interface e.g. here a small sample of the (actually
    massive) Window interface:


    ```

    interface Window extends EventTarget, WindowTimers, WindowSessionStorage, WindowLocalStorage,
    WindowConsole, GlobalEventHandlers, DBEnvironment, WindowBase64 {

    animationStartTime: number;

    applicationCache: ApplicationCache;

    clientInformation: Navigator;

    closed: boolean;

    crypto: Crypto;

    // so on and so forth...

    ```


    There is a good reason for using interfaces for these globals. It allows you to
    add additional properties to these globals without a change lib.d.ts . We will
    cover this concept next.


    # Modifying native types


    Since an interface in TypeScript is open ended this means that you can add members
    to the interfaces declared lib.d.ts and TypeScript will pick up on the additions.
    Note that you need to make these changes in a global module for these interfaces
    to get'
  - "[PAGE 147]\n\nassociated with lib.ts . We recommend creating a special file called\
    \ globals.d.ts for this purpose.\n\nHere are a few example cases where we add\
    \ stuff to window, Math, Date :\n\n# Example window\n\nJust add stuff to the window\
    \ interface e.g.:\n\n```\ninterface Window {\n  helloWorld(): void;\n}\n```\n\n\
    This will allow you to use it in a type safe manner:\n\n```\n// Add it at runtime\n\
    window.helloWorld() = => console.log('hello world');\n// Call it\nwindow.helloWorld();\n\
    // Misuse it and you get an error:\nwindow.helloWorld('gracious'); // Error: Supplied\
    \ parameters do not match the signature\nof the call target\n```\n\n# Example\
    \ Math\n\nThe global variable Math is defined in lib.d.ts as (again, use your\
    \ dev tools to navigate to definition):\n\n```\n/* An intrinsic object that provides\
    \ basic mathematics functionality and constants. */\n\ndeclare var Math: Math;\n\
    ```\n\ni.e. the variable Math is an instance of the Math interface. The Math interface\
    \ is defined as:\n\n```\ninterface Math {\n  E: number;\n  LN10: number;\n  //\
    \ others ...n}\n```"
- md: "\nMath means that if you want to add stuff to the Math global variable you\
    \ just need to add it to the Math global interface, e.g. consider the seedrandom\
    \ project which adds a seedrandom to the global Math object. This can be declared\
    \ quite easily:\n\n```\ninterface Math {\n  seedrandom(seed?: string);\n}\n```\n\
    \nAnd then you can just use it:\n\n```\nMath.seedrandom();\n// or\nMath.seedrandom(\"\
    Any string you want!\");\n```\n\n# Example\n\n# Date\n\nIf you look on the definition\
    \ of the Date variable in lib.d.ts you will find:\n\n```\ndeclare var Date: DateConstructor;\n\
    ```\n\nThe interface DateConstructor is similar to what you have seen before with\
    \ Math and Window in that it contains members you can use off of the Date global\
    \ variable e.g. Date.now(). In addition to it contains construct signatures which\
    \ allow you to create Date instances (new Date() ). A snippet of the DateConstructor\
    \ interface is shown below:\n\n```\ninterface DateConstructor {\n  new(): Date;\n\
    \  // ... other construct signatures\n  now(): number;\n  // ... other member\
    \ functions\n}\n```\n\nConsider the project datejs. DateJS adds members to both\
    \ the Date global variable and Date instances. Therefore a TypeScript definition\
    \ for this library would look like (BTW the community has already written this\
    \ for you in this case):\n\n```\n/** DateJS Static Methods */\ninterface DateConstructor\
    \ {\n  /** Gets a date that is set to the current date. The time is set to the\
    \ start of the day (00:00 or 12:00 AM) */\n  today(): Date;\n  // ... so on and\
    \ so forth\n}\n```\n\n```\n/** DateJS Instance Methods */\ninterface Date {\n\
    \  /** Adds the specified number of milliseconds to this instance. */\n  addMilliseconds(milliseconds:\
    \ number): Date;\n  // ... so on and so forth\n}\n```\n\nThis allows you to do\
    \ stuff like this in a TypeSafe manner:\n\n```\nvar today = Date.today();\nvar\
    \ todayAftersecond = today.addMilliseconds(1000);\n```\n\n# Example string\n\n\
    If you look inside lib.d.ts for string you will find stuff similar to what we\
    \ saw for Date (String global variable, StringConstructor interface, String interface).\
    \ One of note though is that the String interface impacts string literals as well\
    \ as demonstrated in the below code sample:\n\n```\ninterface String {\n  endsWith(suffix:\
    \ string): boolean;\n}\n\nString.prototype.endsWith = function(suffix: string):\
    \ boolean {\n  var str: string = this;\n  return str && str.indexOf(suffix, str.length\
    \ - suffix.length) !== -1;\n}\n\nconsole.log('foo bar'.endsWith('bas')); // false\n\
    console.log('foo bas'.endsWith('bas')); // true\n```\n\nSimilar variable, interfaces\
    \ for other things that have both static and instance member like Number, Boolean,\
    \ RegExp, etc. and these interfaces affect literal instances of these types as\
