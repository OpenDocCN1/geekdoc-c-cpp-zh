    \ symbolFlags: Symbol Flags) {\n    symbol.flags |= symbolFlags;\n\n    node.symbol\
    \ = symbol;\n\n    if (!symbol.declarations) {\n        symbol.declarations =\
    \ [];\n    }\n    symbol.declarations.push(node);\n\n    if (symbolFlags & SymbolFlags.HasExports\
    \ && !symbol.exports) {\n        symbol.exports = {};\n    }\n\n    if (symbolFlags\
    \ & SymbolFlags.HasMembers && !symbol.members) {\n        symbol.members = {};\n\
    \    }\n\n    if (symbolFlags & SymbolFlags.Value && !symbol.valueDeclaration)\
    \ {\n        symbol.valueDeclaration = node;\n    }\n}\n```\n\nThe important link\
    \ to portions:\n\n+   - Creates a link to the Symbol from the AST node ( node.symbol).\n\
