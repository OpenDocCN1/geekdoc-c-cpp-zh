    \ => c.meow()); // 允许但在运行时会崩溃 (BANG)\n```\n\n## Never\n\n关于 never 类型的视频课程\n\n\
    编程语言设计确实存在*底部*（bottom）类型的概念，只要你进行*代码流分析*，它就是一个**自然**的结果。TypeScript 执行了代码流分析 (◡)，因此它需要可靠地表示可能永远不会发生的情况。\n\
    \n`never` 类型在 TypeScript 中用于表示这种*底部*类型。自然出现的情况包括：\n\n- 函数永远不返回（例如，函数体包含 `while(true){}}`）\n\
