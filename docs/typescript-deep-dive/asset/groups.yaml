    \ you normally use typeof :\n\n```javascript\nif (typeof someglobal !== 'undefined')\
    \ {\n  // someglobal is now safe to use\n  console.log(someglobal);\n}\n```\n\n\
    # this\n\nAny access to `this` keyword within a function is actually controlled\
    \ by how the function is actually called. It is commonly referred to as the \"\
    calling context.\"\n\nHere is an example:\n\n```javascript\nfunction foo() {\n\
    \  console.log(this);\n}\n\nfoo(); // logs out the global e.g. `window` in browsers\n\
    let bar = {\n  foo\n}\nbar.foo(); // Logs out `bar` as `foo` was called on `bar`\n\
    ```\n\nSo be mindful of your usage of `this`. If you want to disconnect `this`\
    \ in a class from the calling context use an arrow function, more on that later.\n\
    \n# Closure\n\nThe best thing JavaScript ever got was closures. A function in\
    \ JavaScript has access to any variables defined in the outer scope. Closures\
    \ are best explained with examples:\n\n```javascript\nfunction outerFunction(arg)\
    \ {\n  var variableInOuterFunction = arg;\n\n  function bar() {\n    console.log(variableInOuterFunction);\
    \ // Access a variable from the outer scope\n  }\n\n  // Call the local function\
    \ to demonstrate that it has access to arg\n  bar();\n}\n\nouterFunction(\"hello\
    \ closure\"); // logs hello closure!\n```\n\nYou can see that the inner function\
    \ has access to a variable (variableInOuterFunction) from the outer scope. The\
    \ variables in the outer function have been closed by (or bound in) the inner\
    \ function. Here the term **closure**. The concept in itself is simple enough\
    \ and pretty intuitive.\n\nNow the awesome part: the inner function can access\
    \ the variables from the outer scope **even after the outer function has returned**.\
    \ This is because the variables are still bound in the inner function and not\
    \ dependent on the outer function. Again let's look at an example:\n\n```javascript\n\
    function outerFunction(arg) {\n  var variableInOuterFunction = arg;\n  return\
    \ function() {\n    console.log(variableInOuterFunction);\n  }\n}\n```\n\nvar\
    \ innerFunction = outerFunction(\"hello closure!\");\n\n```javascript\n// Note\
    \ the outerFunction has returned\ninnerFunction(); // logs closure!\n```\n\n#\
    \ Reason why it's awesome\n\nIt allows you to compose objects easily e.g. the\
    \ revealing module pattern:\n\n```javascript\nfunction createCounter() {\n  let\
    \ val = 0;\n  return {\n    increment() { val++ },\n    getVal() { return val\
    \ }\n  }\n}\n```\n\n```javascript\nlet counter = createCounter();\ncounter.increment();\n\
    console.log(counter.getVal()); // 1\ncounter.increment();\nconsole.log(counter.getVal());\
    \ // 2\n```\n\nAt a high level it is also what makes something like Node.js possible\
