  mdcn: "\n- * 新鲜度 (Freshness)\n- 允许额外的属性\n- 用例：// React\n\n## 新鲜度 (Freshness)\n\n\
    TypeScript 提供了一个名为**新鲜度**（也称为*严格对象字面量检查*）的概念，以便更容易对那些在结构上类型兼容的对象字面量进行类型标注。\n\n\
    结构化类型**非常方便**。考虑以下代码，它允许你**非常方便地**将 JavaScript 升级为 TypeScript，同时保留某种程度类型安全性：\n\
    \n```typescript\nfunction logName({ name: string }) {\n  console.log(something.name);\n\
    }\n\nvar person = { name: 'matt', job: 'being awesome' };\nvar animal = { name:\
    \ 'cow', diet: 'vegan', but has milk of own species' };\nvar random = { note:\
    \ 'I don't have a name property' };\n\nlogName(person); // okay\nlogName(animal);\
    \ // okay\nlogName(random); // Error: property 'name' is missing\n```\n\n然而，**结构化类型**有一个缺点，就是允许接受比实际需要的更多数据。下面的代码演示了这一点，TypeScript\
    \ 会对此报错：\n\n```typescript\nfunction logName({ name: string }) {\n  console.log(something.name);\n\
    }\n\nlogName({ name: 'matt' }); // okay\nlogName({ name: 'matt', job: 'being awesome'\
    \ }); // Error: object literals must only specify known properties. job is excessive\
    \ here.\n```\n\n注意，这**只发生在对象字面量上**。如果没有这个错误，人们可能会查看调用 `logName({ name: 'matt',\
    \ job: 'being awesome' })` 并认为 **logName** 会对 `job` 执行一些有用的操作，但实际上它会完全忽略它。\n\n\
    另一个用例是带有可选成员的接口，如果没有这种对象字面量检查，类型检查将顺利通过。下所示所示：\n\n```typescript\nfunction logIfName(something:\
    \ { name?: string }) {\n  if (something.name) {\n    console.log(something.name);\n\
    \  }\n}\n```\n\n```typescript\nvar person = { name: 'matt', job: 'being awesome'\
    \ };\nvar animal = { name: 'cow', diet: 'vegan', but has milk of own species'\
    \ };\n```\n\n```typescript\nlogIfName(person); // okay\nlogIfName(animal); //\
    \ okay\nlogIfName({neme: 'I just misspelled name to name'}); // Error: object\
    \ literals only specify known properties. neme is excessive here.\n```\n\n之所以只对对象字面量进行这种检查，是因为在这种情况下，额外的属性*实际上并没有被使用*几乎总是拼写错误或对\
    \ API 的误解。\n\n## 允许额外的属性\n\n类型可以包含索引签名来显式允许额外属性：\n\n```typescript\nvar x: { foo:\
    \ number, [x: string]: any };\nx = { foo: 1, baz: 2 }; // Ok, 'baz' matched by\
    \ index signature\n```\n\n## 用例：React \n\nReactJS 为对象新鲜度提供了一个很好的用例。在组件中，我们经常调用\
    \ `setState` 时只传入几个属性，而不是所有属性，例如：\n\n```typescript\n// 假设\ninterface State {\n\
    \  foo: string;\n  bar: string;\n}\n```\n\n```typescript\n// 你想做：\nthis.setState({foo:\
    \ \"Hello\"}); // Error: missing property bar\n```\n\n```typescript\n// 但因为 state\
    \ 同时包含 'foo' 和 'bar'，TypeScript 会强制你这样做：\nthis.setState({foo: \"Hello\", bar:\
    \ this.state.bar});\n```\n\n使用新鲜度的概念，你可以将所有成员标记为可选，并且仍然可以捕获到拼写错误！\n\n```typescript\n\
    // 假设\ninterface State {\n  foo: string;\n  bar?: string;\n}\n\n// 你想做：\nthis.setState({foo:\
    \ \"Hello\"}); // Yay works fine!\n\n// 因为新鲜度的存在，它也能防止拼写错误！\nthis.setState({foos:\
    \ \"Hello\"}); // Error: Objects may only specify known properties\n\n// 并且经过类型检查\n\
    this.setState({foo: 123}); // Error: Cannot assign number to a string\n```\n\n\
    - 类型守卫 (Type Guard)\n- 用户自定义类型守卫\n\n## 类型守卫 (Type Guard)\n\n类型守卫允许你在条件块内收窄对象的类型。\n\
    \n### typeof\n\nTypeScript 感知 JavaScript 中 `instanceof` 和 `typeof` 操作符的使用。如果你在条件块中使用它们，TypeScript\
    \ 将理解该变量在那个条件块内的类型是不同的。这里有一个简单的例子，TypeScript 意识到某个函数在 `string` 上不存在，并指出了可能是一个的用户类型：\n\
    \n```typescript\nfunction doSomething(x: number | string) {\n  if (typeof x ===\
    \ 'string') { // 在块内部 TypeScript 知道 `x` 必须是字符串\n    console.log(x.substr(i));\
    \ // Error, 'substr' does not exist on 'string'\n    console.log(x.substr(i));\
    \ // OK\n  }\n  x.substr(i); // Error: There is no guarantee that x is a string\n\
    }\n```\n\n### instanceof\n\n这里有一个使用类和 `instanceof` 的示例：\n\n```typescript\nclass\
    \ Foo {\n    foo = 123;\n    common = '123';\n}\n\nclass Bar {\n    bar = 123;\n\
    \    common = '123';\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg instanceof\
    \ Foo) {\n    console.log(arg.foo); // OK\n  } else if (arg instanceof Bar) {\n\
    \    console.log(arg.bar); // OK\n  }\n}\n```\n"
