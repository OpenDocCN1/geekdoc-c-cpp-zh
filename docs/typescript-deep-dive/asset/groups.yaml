    \ `d.prototype.__proto__ = b.prototype`。\n\n## d.prototype.__proto__ = b.prototype\
    \ 的意义\n\n它的意义在于，允许你向子类添加成员函数并继承自另一个基类。通过下面的简单示例可以了这一点：\n\n```javascript\nfunction\
