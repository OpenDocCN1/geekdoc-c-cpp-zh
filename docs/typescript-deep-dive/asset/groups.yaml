    \nClick [here] to see all compiler options.\n\n## # noImplicitAny\n\nThere are\
    \ some things that cannot be inferred or inferring them might result in errors\
    \ that might be unexpected. A fine example is function arguments. If you don't\
    \ annotate them it's unclear what and shouldn't be valid e.g.\n\n```typescript\n\
    function log(someArg) {\n  sendDataToServer(someArg);\n}\n// What arg is valid\
    \ and what isn't?\nlog(123);\nlog('hello world');\n```\n\nIf you don't annotate\
    \ some function argument TypeScript assumes any and moves on. This essentially\
