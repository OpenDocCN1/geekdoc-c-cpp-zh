    and then:\n\n```typescript\n// anyOtherTsFileInYourProject.ts\nimport * as foo\
    \ from 'foo';\n// assumes (without doing any lookup) that\n// foo is {bar:number}\n\
    ```\n\n## import/require for importing type only\n\nThe following statement:\n\
    \n```typescript\nimport foo = require('foo');\n```\n\nactually does *two* things:\n\
    \n- Imports the type information of the foo module.\n- Specifies a runtime dependency\
    \ on the foo module.\n\nYou can pick and choose so that only the *type information*\
    \ is loaded and no runtime dependency occurs. Before continuing you might want\
    \ to recap the *declaration spaces* section of the book\n\nyou do not use the\
    \ imported name in the variable declaration space then the import is completely\
    \ removed from the generated JavaScript. This is best explained with examples.\
    \ Once you understand this we will present you with use cases.\n\n## Example 1\n\
    \n```typescript\nimport foo = require('foo');\n```\n\nwill generate the JavaScript:\n\
    \n![](img/7b4ede152e837dfd4e13fc18de91d96a_102_0.png)\n\nThat's right. An empty\
    \ file as foo is not used.\n\n## Example 2\n\n```typescript\nimport foo = require('foo');\n\
    var bar: foo;\n```\n\nwill generate the JavaScript:\n\n```javascript\nvar bar;\n\
    ```\n\nThis is because foo (or any of its properties e.g. foo.bar) is never used\
    \ as a variable.\n\n## Example 3\n\n```typescript\nimport foo = require('foo');\n\
    var bar = foo;\n```\n\nwill generate the JavaScript (assuming commonjs):\n\n```javascript\n\
    var foo = require('foo');\nvar bar = foo;\n```\n\nThis is because foo is used\
    \ as a variable.\n\n## Use case: Lazy loading\n\nType inference needs to be done\
    \ upfront. This means that if you want to use some type from a file foo you will\
    \ have to do:\n\n```typescript\nimport foo = require('foo');\nvar bar: foo.SomeType;\n\
    ```\n\nHowever you might want to only load the file foo at runtime under certain\
    \ conditions. For such cases you should use the import only in type annotations\
    \ and not as a variable. This removes any upfront dependency coding being injected\
    \ by TypeScript. Then manually import the actual module using code that is specific\
