  - '[PAGE 50]


    Note that array destructuring is effectively the compiler doing [], [1], ... and
    so on for you. There is no guarantee that these values will exist.


    # Array Destructuring with rest


    You can pick up any number of elements from the array and get an array of the
    remaining elements using array destructuring with rest.


    ```

    var [x, y, ...remaining] = [1, 2, 3, 4];

    console.log(x, y, remaining); // 1, 2, [3,4]

    ```


    # Array Destructuring with ignores


    You can ignore any index by simply leaving it empty i.e. , , in the left hand
    side of the assignment. For example:


    ```

    var [x, , ...remaining] = [1, 2, 3, 4];

    console.log(x, remaining); // 1, [3,4]

    ```


    # JS Generation


    The JavaScript generation for non ES6 targets simply involves creating temporary
    variables, like you would have to do yourself without native language support
    for destructuring e.g.


    ```

    var x = 1, y = 2;

    [x, y] = [y, x];

    console.log(x, y); // 2,1


    // becomes =

    var x = 1, y = 2;

    _a = [y,x], x = _a[0], y = _a[1];

    console.log(x, y);

    var _a;

    ```


    # Summary


    Destructuring can make your code more readable and maintainable by reducing the
    line count and making the intent clear. Array destructuring can allow you to use
    arrays as though they were tuples.'
