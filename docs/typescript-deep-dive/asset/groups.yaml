  mdcn: "\n\n-   通过添加更多*正确*的注解来帮助编译器。\n\n- 类型兼容性\n- 健全性 (Soundness)\n- 结构类型\n- 泛型\n\
    - 变体 (Variance)\n- 函数\n  - 返回类型\n  - 参数数量\n  - 可选参数和剩余参数\n  - 参数类型\n- 枚举\n- 类\n\
    - 泛型\n- 脚注：不变性 (Invariance)\n\n## 类型兼容性\n\n类型兼容性（正如我们在这里讨论的）决定了一个值是否可以赋值给另一个值。例如，`string`\
    \ 和 `number` 是不兼容的：\n\n```\nlet str: string = \"Hello\";\nlet num: number = 123;\n\
    ```\n\n```\nstr = num; // ：`number` 无法赋值给 `string`\nnum = str; // ：`string` 无法赋值给\
    \ `number`\n```\n\n## 健全性\n\nTypeScript 的类型系统设计目的是为了方便，并允许某些*不健全*的行为，例如任何值都可以赋值给\
    \ `any`，这本质上意味着你在告诉编译器允许你随心所欲地操作：\n\n```\nlet foo: any = 123;\nfoo = \"Hello\"\
    ;\n\n// 后\nfoo.toPrecision(3); // 允许，因为你将其类型为 `any`\n```\n\n## 结构类型\n\nTypeScript\
    \ 对象是结构化类型的。这意味着只要结构匹配，名称就并不重要。\n\n```\ninterface Point {\n  x: number;\n  y:\
    \ number;\n}\n\nclass Point2D {\n  constructor(public x:number, public y:number){}\n\
    }\n\nlet p: Point;\n// OK，由于结构化类型\np = new Point2D(1,2);\n```\n\n这允许你动态创建对象（就像在原生\
    \ JS 中做的那样），并且可以在推断的情况下仍然具有安全性。\n\n此外，包含更多数据被认为是允许的：\n\n```\ninterface Point2D\
    \ {\n  x: number;\n  y: number;\n}\n\ninterface Point3D {\n  x: number;\n  y:\
    \ number;\n  z: number;\n}\n\nvar point2D: Point2D = { x: 0, y: 10 };\nvar point3D:\
    \ Point3D = { x: 0, y: 10, z: 20 };\nfunction iTakePoint2D(point: Point2D) { /*\
    \ do something */ }\n\niTakePoint2D(point2D); // 精确匹配允许\niTakePoint2D(point3D);\
    \ // 额外信息允许\niTakePoint2D({ x: 0 }); // 错误：缺少信息 `\n```\n\n## 变体\n\n变体是类型兼容性分析中一个易于理解且重要的概念。\n\
    \n对于简单的类型 Base 和 Child，如果 Child 是 Base 的子类，那么 Child 的实例可以赋值给类型为 Base 的变量。\n\n\
    > 这是多态的基础 (101)\n\n在由此类 Base 和 Child 组成的复杂类型的兼容性中，取决于在相似场景中 Base 和 Child 的位置，这是由变体驱动的。\n\
    \n- 协变 (Covariant)：（相关）仅限相同方向\n- 逆变 (Contravariant)：（相反）仅限相反方向\n- 双变 (Bariant)：（双向）协变和逆变。\n\
    - 不变 (Invariant)：如果类型不完全一致，则它们是不兼容的。\n\n> 注意：在存在 JavaScript 这样的可变数据的情况下，对于完全微妙的类型系统，不变性是唯一的有效选项。但正如提到的，便利性迫使我们做出未知的选择。\n\
    \n## 函数\n\n在比较两个函数时，有一些细微之处需要考虑。\n\n### 返回类型\n\n协变：返回类型必须包含足够的数据。\n\n```\n/**\
    \ 类型层级 */\ninterface Point2D { x: number; y: number; }\ninterface Point3D { x:\
    \ number; y: number; z: number; }\n\n/** 两个示例函数 */\nlet iMakePoint2D = () : Point2D\
    \ => ({ x: 0, y: 0 });\nlet iMakePoint3D = () : Point3D => ({ x: 0, y: 0 });\n\
    \n/** 赋值 */\niMakePoint2D = iMakePoint3D; // OK\niMakePoint3D = iMakePoint2D;\
    \ // 错误：Point2D 无法赋值给 Point3D\n\n## 参数数量\n\n参数少是可以的（即函数可以忽略额外的参数）。毕竟你保证了调用时有足够的参数。\n\
    \n```\niTakeSomethingPassITANErr\n= (x: Error, data: any) => void { /* do something\
    \ */ };\n```\n\n```\niTakeSomethingPassITANErr() => null // OK\niTakeSomethingPassITANErr(err)\
