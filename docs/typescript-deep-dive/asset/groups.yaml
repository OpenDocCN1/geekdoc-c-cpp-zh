    \ 使用了类似 `<div>` 的语法来表示 JSX 块，这为泛型带来了几个独特的挑战。\n\n快速提示：如前所述，使用 `as Foo` 语法进行类型断言。\n\
    \n## 泛型函数\n\n像下面的代码运行良好：\n\n```typescript\nfunction foo<T>(x: T) { return x; }\n\
    ```\n\n然而，使用泛型箭头函数将失效：\n\n```typescript\nconst foo = <T>(x: T) => x; // Error：未闭合的\
    \ `T` 标签\n```\n\n解决方法：在泛型参数上使用 `extends` 来提示编译器它是泛型，例如：\n\n```typescript\nconst\
    \ foo = <T extends {}>(x: T) => x;\n```\n\n## 泛型组件\n\n由于 JSX 没有提供提供泛型参数的语法，你需要在创建组件之前使用类型断言对组件进行特化处理，例如：\n\
    \n```typescript\n/* 泛型组件 */\ntype SelectProps<T> = { items: T[] }\nclass Select<T>\
    \ extends React.Component<SelectProps<T>, any> { }\n\n/* 特化 */\ninterface StringSelect\
    \ extends { new (): Select<string>; }\nconst StringSelect = Select as StringSelect;\n\
    \n/* 使用 */\nconst Form = () => <StringSelect items={['a', 'b']}} />;\n```\n\n\
    ## 无用的泛型\n\n我见过人们仅仅为了用泛型而泛它。要问的问题是，你试图描述什么样的约束？如果你不能轻松回答，那么你可能有一个无用的泛型。例如，人们尝试这样为\
    \ Node.js 的 `require` 函数建模：\n\n```typescript\ndeclare function require<T>(name:\
    \ string): T;\n```\n\n在这种情况下，你可以看到 `T` 只被用了一次。因此，成员之间没有约束。在这种情况下，你最好使用类型断言：\n\n\
    ```typescript\ndeclare function require(name: string): any;\nconst something =\
    \ require('something') as TypeOfSomething;\n```\n\n这只是一个例子；如果你正在考虑这个 `require`\
    \ 类型定义，你不需要，因为：\n\n- 1. 它已经存在于 `node.d.ts` 中：你可以使用 `npm install @types/node --save-dev`\
    \ 进行安装。\n- 2. 你应该考虑为你库编写类型定义，例如 `npm install @types/node --save-dev` 而不是使用原始 `require`。\n\
    \n## 设计模式：便利性\n\n之前的 `require<T>` 示例特意说明，在类型安全方面，使用一次的泛型比类型断言更好。换句话说，它们为你的 API\
    \ 提供了便利性。这是一个返回 `promise` 的函数示例：\n\n```typescript\nconst getJSON = <T>(config:\
    \ {\n  url: string,\n  method?: string,\n  headers?: { [key: string]: string },\n\
    } {} = {}): Promise<T> => {\n  const fetchConfig = {\n    method: 'GET',\n   \
    \ ...config,\n  };\n  return fetch(url, fetchConfig).then(response => response.json());\n\
    };\n```\n\n注意你仍然需要显式标注你想要的类型：\n\n```typescript\ntype LoadResponse = {\n  name:\
    \ string;\n  email: string;\n};\n\nfunction loadUsers() {\n  return getJSON<LoadResponse>({\
    \ url: 'example.com/users' });\n}\n```\n\n## 类型推断\n\nTypeScript 根据简单的规则推断变量的类型。这比\
    \ `any` 要好。\n\n变量的类型通过定义推断。\n\n```typescript\nlet foo = 123; // foo is number\n\
    let bar = \"Hello\"; // bar is string\nfoo = bar; // Error：无法将 `string` 赋值给 `number`\n\
    ```\n\n这是类型从右流动的示例。\n\n## 返回\n\n```typescript\nfunction add(a: number, b: number)\
    \ {\n  return a + b;\n}\n```\n\n这是类型从底部流动的示例。\n\n## 赋值\n\n函数的参数类型也可以通过赋值推断。\n\n\
    ```typescript\ntype Adder = (a: number, b: number) => number;\nlet foo: Adder\
    \ = (a, b) => a + b;\n```\n\n这种类型可以通过下面的代码演示。如果函数参数可以推断，那么赋值风格推断也是有效的。\n\n```typescript\n\
    type Adder = (a: number, b: number) => number;\nfunction iTakeAdder(adder: Adder)\
    \ {\n  return adder(1, 2);\n}\niTakeAndAdder((a, b) => {\n  // a = \"hello\";\
    \ // Error：无法将 `string` 赋值给 `number`\n  return a + b;\n})\n```\n\n这是类型从流动的示例。\n\
    \n## 结构化\n\n这些简单的规则在存在**结构化**（对象字面量创建）时同样有效。例如，在以下情况下，`foo` 的类型被推断为 `{a:number,\
    \ b:number}`。\n\n```typescript\nlet foo = {\n  a: 123,\n  b: 456\n};\n// foo.a\
    \ = \"hello\"; // Error：无法将 `string` 赋值给 `number`\n```\n\n对于数组也是如此：\n\n```typescript\n\
    const bar = [1,2,3];\n// bar[0] = \"hello\"; // error：无法将 `string` 赋值给 `number`\n\
    ```\n\n当然，还有嵌套：\n\n```typescript\nlet foo = {\n  bar: [1, 3, 4]\n};\nfoo.bar[0]\
    \ = 'hello'; // error：无法将 `string` 赋值给 `number`\n```\n\n## 解构\n\n当然，它们也适用于解构，包括对象：\n\
    \n```typescript\nlet foo = {\n  a: 123,\n  b: 456\n}\nlet {a} = foo;\n// a = \"\
    hello\"; // Error：无法将 `string` 赋值给 `number`\n```\n\n以及数组：\n\n```typescript\nconst\
    \ bar = [1, 2];\nlet [a, b] = bar;\n// a = \"hello\"; // Error：无法将 `string` 赋值给\
    \ `number`\n```\n\n如果函数参数可以被推断，它的解构属性也可以被推断。例如，这里我们将参数解构为它的 a b 成员。\n\n```typescript\n\
    type Adder = ({ a: number, b: number }) => number;\nfunction iTakeAndAdder(adder:\
    \ Adder) {\n  return adder({ a: 1, b: 2 });\n}\niTakeAndAdder((a, b }) => { //\
    \ `a` 和 `b` 的类型被推断\n// a = \"hello\"; // Error：无法将 `string` 赋值给 `number`\n  return\
    \ a + b;\n})\n```\n\n## 类型守卫\n\n我们已经看到类型守卫如何帮助更改和缩小类型（特别是联合类型的情况）。类型守卫只是块中变量类型推断的另一种形式。\n\
    \n## 警告\n\n## 注意参数\n\n如果类型无法从赋值中推断，则类型不会流入函数参数。例如，在下面的情况下，编译器不知道 `foo` 的类型，因此它无法推断\
    \ `a` 或 `b` 的类型。\n\n```typescript\nconst foo = (a,b) => { /* do something */ };\n\
    ```\n\n然而，如果 `foo` 被标注了类型，函数的参数类型就可以推断（在示例中 `a, b` 都被推断为 `number`）。\n\n```typescript\n\
    type TwoNumberFunction = (a: number, b: number) => void;\nconst foo: TwoNumberFunction\
    \ = (a, b) => { do something */ };\n```\n\n"
