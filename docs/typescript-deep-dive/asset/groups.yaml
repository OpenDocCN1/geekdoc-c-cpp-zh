- md: "\n```typescript\nlet identity = function<T>(x: T): T {\n  // ...\n}\n\nlet\
    \ reverse = function<U>(y: U): U {\n  // ...\n}\n\nlet identity = reverse; //\
    \ Okay because (x: any)=any matches (y: any)=any\n```\n\nGenerics involving classes\
    \ are matched by relevant class compatibility as mentioned before. e.g.\n\n```typescript\n\
    class List<T> {\n  add(val: T) { }\n}\n\nclass Animal { name: string; }\nclass\
    \ Cat extends Animal { meow() { } }\n\nconst animals = new List<Animal>();\nanimals.add(new\
    \ Animal()); // Okay\nanimals.add(new Cat()); // Okay\n\nconst cats = new List<Cat>();\n\
    cats.add(new Animal()); // Error\ncats.add(new Cat()); // Okay\n```\n\n## Note:\
    \ Invariance\n\nWe said invariance is the only sound option. Here is an example\
    \ where both contra variance are shown to be unsafe for arrays.\n\n```typescript\n\
    /* Hierarchy */\nclass Animal { constructor(public name: string){}}\nclass Cat\
    \ extends Animal { meow() { } }\n\n/** An item of each */\nvar animal = new Animal(\"\
    animal\");\nvar cat = new Cat(\"cat\");\n\n/**\n * Demo : polymorphism 101\n *\
    \ Animal <= Cat\n */\nanimal = cat; // Okay\ncat = animal; // ERROR: cat extends\
    \ animal\n\n/** Array of each to demonstrate variance */\nlet animalArr: Animal[]\
    \ = [animal];\nlet catArr: Cat[] = [cat];\n\n/**\n * Obviously Bad : Contravariance\n\
    \ * Animal <= Cat\n * Animal[] >= Cat[] */\ncatArr = animalArr; // Okay if contravariant\n\
    catArr[0].meow(); // Allowed but BANG at runtime\n\n/**\n * Also Bad : covariance\n\
    \ * Animal <= Cat\n * Animal[] <= Cat[] */\nanimalArr = catArr; // Okay if covariant\n\
    animalArr.push(new Animal('another animal')); // Just pushed an animal into catArr!\n\
    catArr.forEach(c => c.meow()); // Allowed but BANG at runtime\n```\n\n## Never\n\
    \nA video lesson on the never type\n\nProgramming language design does have a\
    \ concept of *bottom* type that is a **natural** outcome as soon as you do *code\
    \ flow analysis*. TypeScript does code flow analysis (◡) and so it needs to reliably\
    \ represent stuff that might never happen.\n\nThe `never` type is used in TypeScript\
    \ to denote this *bottom* type. Cases when it occurs naturally:\n\n- A function\
    \ never returns (e.g. if the function body has `while(true){}}`)\n- A function\
    \ always throws (e.g. in `function foo(){throw new Error('Not Implemented')}`\
    \ the return type of `foo` is `never`)\n\nOf course you can use this annotation\
    \ for self as well\n\n```typescript\nlet foo: never; // Okay\n```\n\nHowever `never`\
    \ can only ever be assigned to another never. e.g.\n\n```typescript\nlet foo:\
    \ never = 123; // Error: Type number is not assignable to never\n\n// Okay as\
    \ the function's return type is `never`\nlet bar: never = (() => { throw new Error('Throw\
    \ my hands in the air like I just dont care') })();\n```\n\nGreat. Now let's jump\
    \ into its key use case :)\n\n## Use case: Exhaustive Checks\n\nYou can call never\
    \ functions in a never context.\n\n```typescript\nfunction foo(x: string | number):\
    \ boolean {\n  if (typeof x === \"string\") {\n    return true;\n  } else if (typeof\
    \ x === \"number\") {\n    return false;\n  }\n\n  // Without a never type we\
    \ would error :\n  // - Not all code paths return a value (strict null checks)\n\
    \  // - Or Unreachable code detected\n  // But because typescript understands\
    \ `fail` function returns `never'\n  // It can allow you to call it as you might\
    \ be using it for runtime safety / exhaust checks.\n  return fail(\"Unexhaustive\"\
    );\n}\n\nfunction fail(message: string): never { throw Error(message);\n```\n\n\
    And because `never` is only assignable to another `never` you can use it for `compile\
    \ time` exhaustive checks as well. This is covered in the *discriminated union*\
    \ section.\n\n## Confusion with void\n\nAs soon as someone tells you that `never`\
    \ is returned when a function exits gracefully you intuitively want to think of\
    \ it as the same as `void`. However `void` is a Unit. `never` is a falsum.\n\n\
    A function that `returns` nothing returns a Unit `void`. However a function that\
    \ `never returns` (or always throws) returns `never`, `void` is something that\
    \ can be assigned (without `strictNullChecking`) but `never` can be assigned to\
    \ anything other than `never`.\n\n## Discriminated Union\n\nIf you have a class\
    \ with a literal member then you can use that property to discriminate between\
    \ unions members.\n\nAs an example consider the union of a Square and Rectangle\
    \ , here we have a member kind that exists on both union members and is of a particular\
    \ literal type:\n\n```typescript\ninterface Square {\n  kind: \"square\";\n  size:\
    \ number;\n}\n\ninterface Rectangle {\n  kind: \"rectangle\";\n  width: number;\n\
    \  height: number;\n}\ntype Shape = Square | Rectangle;\n```\n\nIf you use a type\
    \ guard check ( == , === , != , !== ) or switch on the discriminant property (here\
    \ kind ) TypeScript will realize that the object must be of the type that has\
    \ that specific literal.\n\n```typescript\nfunction area(s: Shape) {\n  if (s.kind\
    \ === \"square\") {\n    return s.size;\n  } else if (s.kind === \"rectangle\"\
    ) {\n    return s.height;\n  } else {\n    // This part is never reached because\
    \ of exhaustive checks\n    const _exhaustiveCheck: never = s;\n    return _exhaustiveCheck;\n\
    \  }\n}\n```\n"
