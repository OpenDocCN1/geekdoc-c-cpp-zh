  - "[PAGE 185]\n\n# Type Inference in TypeScript\n\nTypeScript can infer (and then\
    \ check) the type of a variable based on a few simple rules. Because these rules\
    \ are simple you can train your brain to recognize safe / unsafe code (it happened\
    \ for me and my team mates quite quickly).\n\n> The types flowing is just how\
    \ I imagine in my brain the flow of type information.\n\n# Definition\n\nTypes\
    \ of a variable are inferred by definition.\n\n```\nlet foo = 123; // foo is a\
    \ `number`nlet bar = \"Hello\"; // bar is a `string`nfoo = bar; // Error: cannot\
    \ assign `string` to a `number`\n```\n\nThis is an example of types flowing from\
    \ right to left.\n\n# Return\n\n```\nfunction add(a: number, b: number) {\n  return\
    \ a + b;\n}\n```\n\nThis is an example of types flowing bottom out.\n\n# Assignment\n\
    \nThe type of the function parameters / return can also be inferred by assignment\
    \ e.g. here we say foo is an Adder , that makes the type of a and b to infer as\
    \ number .\n\n```\ntype Adder = (a: number, b: number) => number;\nlet foo: Adder\
    \ = (a, b) => a + b;\n```"
