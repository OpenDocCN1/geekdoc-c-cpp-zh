    \ closed over and is available\n    res.send(data);\n  });\n});\n```\n\n# Number\n\
    \nWhenever you are handling numbers in any programming language you need to be\
    \ aware of the idiosyncrasies of how the language handles numbers. Here are few\
    \ critical pieces of information about numbers in JavaScript that you should be\
    \ aware of.\n\n# Core Type\n\nJavaScript has only one number type. It is a double-precision\
    \ 64-bit Number. Below we discuss its limitations along with recommended solution.\n\
    \n# Decimal\n\nFor those familiar with doubles / float in other languages, would\
    \ know that binary floating point numbers do not map correctly to Decimal numbers.\
    \ A trivial (and famous) example with JavaScript's built in numbers is:\n\n```javascript\n\
    console.log(.1 + .2); // 0.30000000000000004\n```\n\n> For decimal math use big.js.\n\
    \n# Integer\n\nThe integer limits represented by the built in number are Number.MAX_SAFE_INTEGER\
    \ and Number.MIN_SAFE_INTEGER.\n\n```javascript\n{max: 900719254740991, min: -900719254740991}\n\
    ```\n\nSafe in this context refers to the fact that the value cannot be the result\
    \ of rounding error. The unsafe values are away from these safe values and any\
    \ amount of addition / subtraction will round the result.\n\n```javascript\nconsole.log(Number.MAX_SAFE_INTEGER\
    \ + 1 === Number.MAX_SAFE_INTEGER + 2); // false\nconsole.log(Number.MAX_SAFE_INTEGER\
    \ + 1 === true); // true\n```\n\nTo check safety you can use ES6 Number.isSafeInteger:\n\
    \n```javascript\n// Safe value\nconsole.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER));\
    \ // true\n\n// Unsafe value\nconsole.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER\
    \ + 1)); // false\n\n// Because it might have been rounded due to overflow\nconsole.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER\
    \ + 10)); // false\n```\n\n> For arbitrary precision integer math use big.js.\n\
    \n# big.js\n\nWhenever you use math for financial calculations (e.g. money with\
    \ cents etc) use a library like big.js which is designed for\n\n- Perfect decimal\
    \ math\n- Safe out of bound values\n\nInstallation is simple:\n\n```bash\nnpm\
    \ install big.js @types/big.js\n```\n\nQuick Usage example:\n\n```javascript\n\
    import { Big } from 'big.js';\n\nexport const foo = new Big('111.111111111111111111');\n\
    export const bar = foo.plus(new Big('0.00000000000000000001'));\n\n// To get a\
    \ number\nconst x: number = Number(bar.toString()); // Looses the precision\n\
    ```\n\nDo not use this library for math used for UI /performance intensive purposes\
    \ e.g charts, canvas drawing etc.\n\n# NaN\n\nWhen number calculation is not representable\
    \ by a valid number, JavaScript returns a special `NaN` value. A classic example\
    \ is imaginary numbers:\n\n```javascript\nconsole.log(Math.sqrt(-1)); // NaN\n\
    ```\n\nNote: Equality checks **don't** work on `NaN` values. Instead use `Number.isNaN`\
    \ instead:\n\n```javascript\n// Don't do this\nconsole.log(NaN === NaN); // false!!\n\
    \n// Do this\nconsole.log(Number.isNaN(NaN)); // true\n```\n\n# Infinity\n\nThe\
    \ outer bounds of values representable in Number are available as static `Number.MAX_VALUE`\
    \ and `-Number.MAX_VALUE` values.\n\n```javascript\nconsole.log(Number.MAX_VALUE);\
    \ // 1.7976931348623157e+308\nconsole.log(-Number.MAX_VALUE); // -1.7976931348623157e+308\n\
    ```\n\nValues outside the range precision isn't clamped to these limits e.g.\n\
    \n```javascript\nconsole.log(Number.MAX_VALUE + 1 == Number.MAX_VALUE); // true!\n\
    console.log(-Number.MAX_VALUE - 1 == -Number.MAX_VALUE); // true!\n```\n\nValues\
    \ outside the range precision is resolved to special values `Infinity / -Infinity`\
    \ e.g.\n\n```javascript\nconsole.log(Number.MAX_VALUE + 10**1000); // Infinity\n\
    console.log(-Number.MAX_VALUE - 10**1000); // -Infinity\n```\n\nOff-course, these\
    \ infinity values also show up with arithmetic that requires it e.g.\n\n```javascript\n\
    console.log(1 / 0); // Infinity\nconsole.log(-1 / 0); // -Infinity\n```\n"
