    # Dynamic import expressions\n\nDynamic import expressions are a new feature and\
    \ part of ECMAScript bundle allows users to asynchronously request a module at\
    \ any arbitrary point in your program. TC39 JavaScript committee has its own proposal\
    \ which is in stage 3, and it is called import() proposal for JavaScript.\n\n\
    From other side, webpack bundler has a feature called Code Splitting which allows\
    \ you to split your bundle into chunks which can be downloaded asynchronously\
    \ at a later time. For instance, this allows to serve a minimal bootstrap bundle\
    \ and to asynchronously load additional features later.\n\nAt first glance, it's\
    \ natural to think (if we are using webpack in our dev workflow) that by using\
    \ TypeScript 2.4 dynamic import expressions, we will automatically produce chunks\
    \ and code-split your final bundle. BUT, that is not as easy as it seems, because\
    \ it depends on the tsconfig.json configuration we are working.\n\nThe thing is\
    \ that webpack code splitting supports two similar techniques to achieve this\
    \ goal: using import() (preferred, ECMAScript proposal) and require.ensure() (legacy,\
    \ webpack specific). And what that means is the expected TypeScript output is\
    \ leave the import() statement as it is instead of transpile to anything else.\n\
    \nLet's see and an example to figure out how to configure webpack lazy load library\
    \ moment but I am interested on code splitting as well, having moment library\
    \ in a separate chunk of JS (javascript file) and that will be loaded only when\
    \ required.\n\n```javascript\n/* webpackChunkName: \"momentjs\" / \"moment\"\n\
    .then((moment) => {\n  // lazyModule has all of the proper types, autocomplete\
    \ works,\n  // type checking works, code references /\n  const time = moment().format();\n\
    \  console.log(\"TypeScript >= 2.4.0 Dynamic Import Expression:\");\n  console.log(time);\n\
    }\n.catch((err) => {\n  console.log(\"Failed to load moment\", err);\n});\n```\n\
    \nHere is the tsconfig.json:\n\n```json\n\"compilerOptions\": {\n  \"target\"\
    : \"es5\",\n  \"module\": \"esnext\",\n  \"lib\": [\n    \"dom\",\n    \"es5\"\
    ,\n    \"scripthost\",\n    \"es2015.promise\"\n  ],\n  \"jsx\": \"react\",\n\
    \  \"declaration\": false,\n  \"sourceMap\": true,\n  \"outDir\": \"./dist/js\"\
    ,\n  \"strict\": true,\n  \"moduleResolution\": \"node\",\n  \"typeRoots\": [\n\
    \    \"./node_modules/@types\"\n  ],\n  \"types\": [\n    \"node\",\n    \"react\"\
    ,\n    \"react-dom\"\n  ]\n}\n```\n\n# Important notes:\n\n- Using **\"module\"\
    : \"esnext\"** TypeScript produces the mimic import() statement to be input for\
    \ Webpack Code Splitting.\n- For further information read this article: [Dynamic\
    \ Import Expressions and webpack 2 Code Splitting integration with TypeScript\
    \ 2.4]().\n\nYou can see full example here.\n\n# TypeScript with Node.js\n\nTypeScript\
    \ has had first class support for Node.js since inception. Here's how to setup\
    \ a quick Node.js project:\n\n> Note: many of these steps are actually just common\
    \ practice Node.js setup steps\n\n- 1. Setup a Node.js project package.json. Quick\
    \ one: npm init -y\n- 2. Add TypeScript (npm install typescript --save-dev)\n\
    - 3. Add node.d.ts (npm install @types/node --save-dev)\n- 4. Init a tsconfig.json\
    \ for TypeScript options (npx tsc --init)\n- 5. Make sure you have compilerOptions\
    \ in your tsconfig.json\n\nThat's it! Fire up your IDE (e.g. alm -o) and play\
    \ around. Now you can use all the built in node modules (e.g. import fs = require('fs');)\
    \ with all the safety and developer ergonomics of TypeScript!\n\n# Bonus: Live\
    \ compile + run\n\n- Add ts-node which we will use for live compile + run in node\
    \ (npm install ts-node --save-dev)\n- Add nodemon which will invoke ts-node whenever\
    \ a file is changed (npm install nodemon --save-dev)\n\nNow just add a script\
    \ target to your package.json based on your application entry e.g. assuming its\
    \ index.ts :\n\n```json\n\"scripts\": {\n  \"start\": \"npm run build:live\",\n\
    \  \"build:live\": \"nodemon --exec ./node_modules/.bin/ts-node -- ./index.ts\"\
    \n}\n```\n\nSo you can now run npm start and as you edit index.ts :\n\n- nodemon\
    \ restarts its command (ts-node)\n- ts-node transpiles automatically picking up\
    \ tsconfig.json and the installed typescript version,\n- ts-node runs the output\
    \ javascript through Node.js.\n\n# Creating TypeScript node modules\n\n# A lesson\
    \ on creating typescript node modules\n\nUsing modules written in TypeScript is\
    \ super fun as you get great compile time safety and autocomplete (essentially\
    \ executable documentation).\n\nCreating a high quality TypeScript module is simple.\
    \ Assume the following desired folder structure for your package:\n\n```\npackage\n\
    ├── package.json\n├── tsconfig.json\n├── src\n│   ├── All your source files\n\
    │   │   ├── index.ts\n│   │   └── foo.ts\n│   └── ...\n└── lib\n    ├── All your\
    \ compiled files\n    ├── index.d.ts\n    ├── index.js\n    ├── foo.d.ts\n   \
    \ └── foo.js\n...\n```\n"
  mdcn: "\n# 动态导入表达式\n\n动态导入表达式是 ECMAScript 规范中的一项新功能特性，它允许用户在程序中的任意点异步请求模块。TC39 JavaScript\
    \ 委员会有自己的提案，目前处于第 3 阶段，被称为 JavaScript 的 `import()` 提案。\n\n另一方面，webpack 打包器有一个名为代码分割（Code\
    \ Splitting）的功能，允许你将包拆分成多个块，这些块可以在以后异步下载。例如，这允许提供一个最小的引导包，并在稍后异步加载额外功能。\n\n乍一看，人们自然会认为（如果我们在开发工作流中使用\
    \ webpack），使用 TypeScript 2.4 的动态导入表达式将自动生成分块并对最终的包进行代码分割。但是，这并没有看起来那么简单，因为它取决于我们正在编写的\
    \ `tsconfig.json` 配置。\n\n问题在于，webpack 代码分割支持两种实现此目标的类似技术：使用 `import()`（推荐，ECMAScript\
    \ 提案）和 `require.ensure()`（旧版，webpack 特有）。这意味着预期的 TypeScript 输出将保持 `import()` 语句原样，而不是将其编译为其他内容。\n\
    \n让我们来看一个示例，了解如何配置 webpack 懒加载 moment 库，但我对代码分割也感兴趣，将 moment 库放在独立的 JS（javascript\
    \ 文件）块中，仅在需要时加载。\n\n```javascript\n/* webpackChunkName: \"momentjs\" / \"moment\"\
    \n.then((moment) => {\n  // lazyModule 拥有所有的正确类型，自动补全有效，\n  // 类型检查有效，代码引用 /\n\
    \  const time = moment().format();\n  console.log(\"TypeScript >= 2.4.0 Dynamic\
    \ Import Expression:\");\n  console.log(time);\n}\n.catch((err) => {\n  console.log(\"\
    Failed to load moment\", err);\n});\n```\n\n这是 `tsconfig.json`：\n\n```json\n\"\
    compilerOptions\": {\n  \"target\": \"es5\",\n  \"module\": \"esnext\",\n  \"\
    lib\": [\n    \"dom\",\n    \"es5\",\n    \"scripthost\",\n    \"es2015.promise\"\
    \n  ],\n  \"jsx\": \"react\",\n  \"declaration\": false,\n  \"sourceMap\": true,\n\
    \  \"outDir\": \"./dist/js\",\n  \"strict\": true,\n  \"moduleResolution\": \"\
    node\",\n  \"typeRoots\": [\n    \"./node_modules/@types\"\n  ],\n  \"types\"\
    : [\n    \"node\",\n    \"react\",\n    \"react-dom\"\n  ]\n}\n```\n\n# 注意事项：\n\
    \n- 使用 **\"module\": \"esnext\"** TypeScript 会产生模拟的 `import()` 语句，用于 Webpack 代码分割。\n\
    - 更多信息请阅读此：[动态导入表达式与 webpack 2 与 TypeScript 2.4 代码分割集成]()\n\n你可以在这里查看完整示例。\n\n\
    # TypeScript 与 Node.js\n\nTypeScript 从诞生起就支持 Node.js。以下是如何设置一个快速 Node.js 项目：\n\
    \n> 注意：这些步骤是常用的 Node.js 设置步骤\n\n- 1. 设置 Node.js 项目 `package.json`。快速：`npm init\
    \ -y`\n- 2. 添加 TypeScript（`npm install typescript --save-dev`）\n- 3. 添加 node 类型（`npm\
    \ install @types/node --save-dev`）\n- 4. 初始化 `tsconfig.json` 以配置 TypeScript 选项（`npx\
    \ tsc --init`）\n- 5. 确保你的 `tsconfig.json` 中有 `compilerOptions`\n\n搞定！启动你的 IDE（例如\
    \ `alm -o`）并开始操作。现在你可以使用所有内置 node 模块（例如 `import fs = require('fs');`），带有 TypeScript\
    \ 的安全性和开发体验！\n\n# 奖励：实时编译 + 运行\n\n- 添加 `ts-node` 用于在 node 中进行实时编译 +运行（`npm install\
    \ ts-node --save-dev`）\n- 添加 `nodemon`，它会在文件更改时调用 `ts-node`（`npm install nodemon\
    \ --save-dev`）\n\n现在根据你的应用程序入口（假设为 `index.ts`）在 `package.json` 中添加脚本：\n\n```json\n\
    \"scripts\": {\n  \"start\": \"npm run build:live\",\n  \"build:live\": \"nodemon\
    \ --exec ./node_modules/.bin/ts-node ./index.ts\"\n}\n```\n\n现在你可以运行 `npm start`，当你编辑\
    \ `index.ts` 时：\n\n- `nodemon` 重启命令（`ts-node`）\n- `ts-node` 自动拾取 `tsconfig.json`\
    \ 和安装的 typescript 版本\n- `ts-node` 通过 Node.js 运行输出\n\n# 创建 TypeScript 模块\n\n# 关于创建\
    \ TypeScript 模块的课程\n\n使用 TypeScript 编写模块非常有趣，因为你可以获得极佳的编译安全性和补全（本质上是可执行文档）。\n\n\
    创建一个高质量的 TypeScript 模块非常简单。假设你的包具有如下目录结构：\n\n```\npackage\n├── package.json\n\
    ├── tsconfig.json\n├── src\n│   ├── 所有的源文件\n│   ├── index.ts\n│   └── foo.ts\n\
    │   └── ...\n└── lib\n    ├── 所有的编译后文件\n    ├── index.d.ts\n    ├── index.js\n\
    \    ├── foo.d.ts\n    └── foo.js\n...\n```\n\n（注：第111页之后的文本是重复的，已省略，因为它们不包含连贯的信息。）\n"
