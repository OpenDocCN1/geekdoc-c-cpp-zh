    \ 查询（因为 `bird.__proto__ == Bird.prototype` 且 `bird.__proto__.__proto__ == Animal.prototype`）。\n\
    \n## 箭头函数\n\n- 箭头函数的需求\n- 提示：箭头函数的危险\n- 提示：使用 `this` 的库\n- 提示：箭头函数的继承\n- 提示：快速对象返回\n\
    \n喜爱调用胖箭头（因为 `->` 是细箭头，而 `=>` 是胖箭头），也被称为 lambda 函数（因为其他语言也是如此）。另一个常用特性是箭头函数 `=>something`。使用胖箭头的动机是：\n\
