  mdcn: "\n主要的区别在于模块在文件系统上的解析方式。\n\n> 我将使用一个概念性术语“位置”，我会在提到查找模式后对其解释。\n\n## 相对模块\n\
    \n很简单，只需遵循相对路径即可 :) 例如：\n\n- 如果文件 `bar.ts` 执行 `import * as from './foo'`，那么 `foo`\
    \ 必须存在于同一文件夹。\n- 如果 `bar.ts` 执行 `import * as from '../foo'`，那么 `foo` 必须存在于上级目录。\n\
    - 如果 `bar.ts` 执行 `import * as from '../someFolder/foo'`，则存在于上级目录中。\n\n或者你想到的任何其他相对路径\
    \ :)\n\n## 动态查找\n\n当导入路径不是相对路径时，查找将由 Node 风格的解析驱动。这里只给出一个简单的示例：\n\n- 你有 `import\
    \ * as from 'foo'`，将按顺序检查以下位置：\n  - `./node_modules/foo`\n  - `../node_modules/foo`\n\
    \  - `../../node_modules/foo`\n  - 直到文件系统的根目录\n- 你有 `import * as from 'something/foo'`，将按顺序检查以下位置：\n\
    \  - `./node_modules/something/foo`\n  - `../node_modules/something/foo`\n  -\
    \ `../../node_modules/something/foo`\n  - 直到文件系统的根目录\n\n## 什么是位置\n\n当我说“检查位置”时，我的意思是会在该位置检查以下内容。例如，对于位置\
    \ `foo`：\n\n- 如果位置是一个文件，例如 `foo.ts`、`index.ts`，太棒了！\n- 如果位置是一个文件夹且存在 `foo/index.ts`\
    \ 文件，太棒了！\n- 如果位置是一个文件夹且存在 `foo/package.json`，并且该 `package.json` 中的 `types` 键指定了一个存在的文件，那么快点！\n\
    - 如果位置是一个文件夹且存在 `package.json`，并且 `package.json` 中的 `main` 键指定了一个存在的文件，那么快点！\n\
    \n我说的“文件”实际上是指 `.ts` / `.d.ts` 和 `.js`。\n\n就是这些。你现在是模块查找专家了（这不是易事！）。\n\n## *仅针对类型*翻转动态查找\n\
    \n你可以通过使用 `declare module 'somePath'` 为项目声明一个*全局*模块，导入将*魔法般地*解析到该路径\n\n例如：\n\n\
    ```typescript\n// globals.d.ts\ndeclare module 'foo' {\n  // 一些变量声明\n  export\
    \ var bar: number; /*sample*/\n}\n```\n\n然后：\n\n```typescript\n// anyOtherTsFileInYourProject.ts\n\
    import * as foo from 'foo';\n// 假设（不进行任何查找）\n// foo 是 {bar:number}\n```\n\n##\
    \ 仅导入类型的 import/require\n\n以下语句：\n\n```typescript\nimport foo = require('foo');\n\
    ```\n\n实际上执行了*两*件事：\n\n- 导入 foo 模块的类型信息。\n- 指定了对 foo 模块的运行时依赖。\n\n你可以根据需要选择，使得只加载*类型信息*而不产生运行时依赖。在继续之前，你可能想回回顾一下书中的*声明空间*章节。\n\
    \n如果你不在变量声明空间中使用导入的名称，那么该导入将完全从生成的 JavaScript 中移除。这用示例来说明最好。一旦你理解了这一点，我们将为你展示用例。\n\
    \n## 示例 1\n\n```typescript\nimport foo = require('foo');\n```\n\n将生成 JavaScript：\n\
    \n![](img/7b4ede152e837dfd4e13fc18de91d96a_102_0.png)\n\n没错。由于 foo 没有被使用，这是一个空文件。\n\
    \n## 示例 2\n\n```typescript\nimport foo = require('foo');\nvar bar: foo;\n```\n\
    \n将生成 JavaScript：\n\n```javascript\nvar bar;\n```\n\n这是因为 foo（或它的任何属性，例如 `foo.bar`）从未被当作变量使用。\n\
    \n## 示例 3\n\n```typescript\nimport foo = require('foo');\nvar bar = foo;\n```\n\
    \n将生成 JavaScript（假设使用 commonjs）：\n\n```javascript\nvar foo = require('foo');\n\
    var bar = foo;\n```\n\n这是因为 foo 被当作变量。\n\n## 用例：懒加载\n\n类型推断需要提前完成。这意味着如果你想使用文件\
    \ `foo` 中的某些类型，你必须这样做：\n\n```typescript\nimport foo = require('foo');\nvar bar:\
    \ foo.SomeType;\n```\n\n然而，你可能只想在某些条件下在运行时加载文件 `foo`。对于此类情况，你应该只在类型注解中使用导入，而不是作为变量。这消除了\
    \ TypeScript 注入的任何提前依赖代码。然后使用特定于模块加载器的代码手动导入实际模块。\n\n例如，考虑以下基于 commonjs 的代码，我们只在特定的函数调用时加载模块\
    \ 'foo'：\n\n```typescript\nimport foo = require('foo');\n\nexport function loadFoo()\
    \ {\n  // 这种懒加载 `foo` 并将原始模块*仅*作为类型注解\n  var _foo: typeof foo = require('foo');\n\
    \  // 现在使用 `_foo` 作为变量而不是 `foo`。\n}\n```\n\namd（使用 requirejs）中的类似示例将是：\n\n```typescript\n\
    import foo = require('foo');\n\nexport function loadFoo() {\n  // 这种懒加载 `foo`\
    \ 并将原始模块*仅*作为类型注解\n  var _foo: typeof foo = require('foo');\n  // 现在使用 `_foo`\
    \ 作为变量而不是 `foo`。\n}\n```\n"
