  - "[PAGE 78]\n\n# Generators\n\n> NOTE: You cannot use generators in TypeScript\
    \ in a meaningful way (the ES5 emitter is in progress). However that will change\
    \ soon so we still have this chapter.\n\nfunction * is the syntax to create a\
    \ generator function. Calling a generator function returns a generator object.\
    \ The generator object just follows the iterator interface (i.e. the next, return\
    \ and throw functions).\n\nThere are two key motivations behind generator functions:\n\
    \n# Lazy Iterators\n\nGenerator functions can be used to create lazy iterators\
    \ e.g. the following function returns an infinite list of integers on demand:\n\
    \n```\nfunction* infiniteSequence() {\n  var i = 0;\n  while (true) {\n    yield\
    \ i++;\n  }\n}\n\nvar iterator = infiniteSequence();\nwhile (true) {\n  console.log(iterator.next());\
    \ // { value: xxxx, done: false } forever and ever\n```\n\nOf course if the iterator\
    \ does end, you get the result of { done: true } as demonstrated below:\n\n```\n\
    function* idMaker() {\n  let index = 0;\n  while(index < 3) {\n    yield index++;\n\
    \  }\n}\n\nlet gen = idMaker();\n\nconsole.log(gen.next()); // { value: 0, done:\
    \ false }\nconsole.log(gen.next()); // { value: 1, done: false }\nconsole.log(gen.next());\
    \ // { value: 2, done: false }\nconsole.log(gen.next()); // { done: true }\n```"
  - "[PAGE 79]\n\n# Externally Controlled Execution\n\nThis is the part of generators\
    \ that is truly exciting. It essentially allows a function to pause its execution\
    \ and pass control (fate) of the remainder of the function execution to the caller.\n\
    \nA generator function does not execute when you call it. It just creates a generator\
    \ object. Consider the following example with a sample execution:\n\n```\nfunction\
    \ generator() {\n  console.log('Execution started');\n  yield 0;\n  console.log('Execution\
    \ resumed');\n  yield 1;\n  console.log('Execution resumed');\n}\n\nvar iterator\
    \ = generator();\nconsole.log('Starting iteration'); // This will execute before\
    \ anything in the generator\nor function body executes\nconsole.log(iterator.next());\
    \ // { value: 0, done: false }\nconsole.log(iterator.next()); // { value: 1, done:\
    \ false }\nconsole.log(iterator.next()); // { value: undefined, done: true }\n\
    ```\n\nIf you run this you get the following output:\n\n```\n$ node outside.js\n\
    Starting iteration\nExecution started\n{ value: 0, done: false }\nExecution resumed\n\
    { value: 1, done: false }\nExecution resumed\n{ value: undefined, done: true }\n\
    ```\n\n+   * The function only starts once next is called on the generator object.\n\
    * The function pauses as soon as a yield statement is encountered.\n* The function\
    \ resumes when next is called.\n\n> So essentially the execution of the generator\
    \ function is controllable by the generator object.\n\nOur communication using\
    \ the generator has been mostly one way with the generator returning values for\
    \ the iterator. One extremely powerful feature of generators in JavaScript is\
    \ that they allow two way communications!\n\n+   * You can control the returning\
    \ value of the yield expression using iterator.next(valueTo)"
  - "[PAGE 80]\n\nyou can throw an exception at the point of the yield expression\
    \ using\niterator.throw(error)\n\nThe following example demonstrates iterator.next(valueToInject)\
    \ :\n\n```\nfunction* generator() {\n  var bar = yield 'foo';\n  console.log(bar);\
    \ // bar!\n}\nconst iterator = generator();\n// Start execution till we get first\
    \ yield value\nconst foo = iterator.next();\nconsole.log(foo.value); // foo\n\
