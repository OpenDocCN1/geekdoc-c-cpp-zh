    * FootNote: Invariance\n\n# # Type Compatibility\n\nType Compatibility (as we\
    \ discuss here) determines if one thing can be assigned to another. E.g. `string`\
    \ and `number` are not compatible:\n\n```\nlet str: string = \"Hello\";\nlet num:\
    \ number = 123;\n```\n\n```\nstr = num; // ERROR: `number` is not assignable to\
    \ `string`\nnum = str; // ERROR: `string` is not assignable to `number`\n```\n\
    \n# # Soundness\n\nTypeScript's type system is designed to be convenient and allows\
    \ for *unsound* behaviours e.g. anything can be assigned to `any` which essentially\
    \ means you are telling the compiler to allow you to do whatever you want:\n\n\
    ```\nlet foo: any = 123;\nfoo = \"Hello\";\n\n// Later\nfoo.toPrecision(3); //\
    \ Allowed as you typed it as `any`\n```\n\n# # Structural"
  - "[PAGE 191]\n\nTypeScript objects are structurally typed. This means the names\
    \ don't matter as long as the structures match\n\n```\ninterface Point {\n  x:\
    \ number;\n  y: number;\n}\n\nclass Point2D {\n  constructor(public x:number,\
    \ public y:number){}\n}\n\nlet p: Point;\n// OK, because of structural typing\n\
    p = new Point2D(1,2);\n```\n\nThis allows you to create objects on the fly (like\
    \ you do in vanilla JS) and still have safety for whenever it can be inferred.\n\
    \nAlso more data is considered fine:\n\n```\ninterface Point2D {\n  x: number;\n\
    \  y: number;\n}\n\ninterface Point3D {\n  x: number;\n  y: number;\n  z: number;\n\
    }\n\nvar point2D: Point2D = { x: 0, y: 10 };\nvar point3D: Point3D = { x: 0, y:\
    \ 10, z: 20 };\nfunction iTakePoint2D(point: Point2D) { /* do something */ }\n\
    \niTakePoint2D(point2D); // exact match okay\niTakePoint2D(point3D); // extra\
    \ information okay\niTakePoint2D({ x: 0 }); // Error: missing information `\n\
    ```\n\n# Variance\n\nVariance is an easy to understand and important concept for\
    \ type compatibility analysis.\n\nFor simple types Base and Child, if Child is\
    \ a child of Base, then instances of Child can be assigned to a variable of type\
    \ Base.\n\n> This is polymorphism 101"
