  - "[PAGE 232]\n\n# Convenience vs. Soundness\n\nThere are a few things TypeScript\
    \ prevents you from doing out of the box e.g using a variable that *isn't ever\
    \ declared* (of course you can use a *declaration file* for external systems).\n\
    \nSaid, traditionally programming languages have a hard boundary between what\
    \ is and not allowed by the type system. TypeScript is different in that it gives\
    \ you control on where you put the slider. This is really to allow you to use\
    \ the JavaScript you know and love with as much safety as **you** want. There\
    \ are lot of compiler options to control exactly this slider so there's a look.\n\
    \n# Boolean Options\n\n`compilerOptions` that are `boolean` can be specified as\
    \ `compilerOptions` in `tsconfig.json`:\n\n```\n{\n  \"compilerOptions\": {\n\
    \    \"someBooleanOption\": true\n  }\n}\n```\n\nor on the command line\n\n```\n\
    tsc --someBooleanOption\n```\n\n> All of these are `false` by default.\n\nClick\
    \ [here] to see all compiler options."
  - "[PAGE 233]\n\n# nolmulictAny\n\nThere are some things that cannot be inferred\
    \ or inferring them might result in errors that might be unexpected. A fine example\
    \ is function arguments. If you don't annotate them its unclear what and shouldn't\
    \ be valid e.g.\n\n```\nfunction log(someArg) {\n  sendDataToServer(someArg);\n\
    }\n// What arg is valid and what isn't?\nlog(123);\nlog('hello world');\n```\n\
    \nIf you don't annotate some function argument TypeScript assumes any and moves\
    \ on. This essentially turns off type checking for such cases which is what a\
    \ JavaScript dev expect but can catch people that want high safety off guard.\
    \ Hence there is an option noImplicitAny that switched on will flag the cases\
    \ where the type cannot be inferred e.g.\n\n```\nfunction log(someArg) { // Error\
    \ : someArg has an implicit `any` type\n  sendDataToServer(someArg);\n}\n```\n\
    \nof course you can then go ahead an annotate:\n\n```\nfunction log(someArg: number)\
    \ {\n  sendDataToServer(someArg);\n}\n```\n\nAnd if you truly want zero safety\
    \ you can mark it explicitly as any :\n\n```\nfunction log(someArg: any) {\n \
    \ sendDataToServer(someArg);\n}\n```"
  - "[PAGE 234]\n\n# strictNullChecks\n\nBy default null and undefined are assignable\
    \ to all types in TypeScript e.g.\n\n```\nlet foo: number = 123;\nfoo = null;\
    \ // Okay\nfoo = undefined; // Okay\n```\n\nThis is modelled after a lot of people\
