    \n# 命名类型 (Nominal Typing)\n\nTypeScript 类型系统是结构性的，这是其主要优势之一。然而，在现实世界用例中，某些情况下你希望两个变量即使结构相同，也因为它们的类型名称不同而将它们区分开。一个非常常见的情况是身份结构（在\
    \ C#/Java 等语言中，它们通常只是带有名称关联语义的字符串）。\n\n社区中出现模式。我将按照个人喜好从高到低的顺序进行介绍：\n\n# 使用字面量类型\
    \ (Literal types)\n\n这种模式使用了泛型和字面量类型：\n\n```typescript\n/** 通用 Id 类型 */\ntype\
    \ Id<T extends string> = {\n  type: T,\n  value: string,\n}\n\n/** 具体 Id 类型 */\n\
    type FooId = Id<'foo'>;\ntype BarId = Id<'bar'>;\n\n/** 可选：构造函数 */\nconst createFoo\
