    \n# 泛型 (Generics)\n\n计算机科学中的许多算法和数据结构并不取决于对象的实际类型。然而，你仍然想要变量之间存在约束。一个简单的示例是一个接收项列表并返回项列表的函数。这里的约束在于传递函数的内容与函数返回的内容：\n\
