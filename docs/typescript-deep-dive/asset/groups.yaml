    # Async Await Support in TypeScript\n\nAsync - Await has been supported by TypeScript\
    \ since version 1.7. Asynchronous functions are prefixed with the async keyword;\
    \ await suspends the execution until an asynchronous function return promise is\
    \ fulfilled and unwraps the value from the Promise returned. It was only supported\
    \ for target es6 transpiling directly to ES6 generators.\n\nTypeScript 2.1 added\
    \ the capability to ES3 and ES5 runtimes, meaning you'll be free to take advantage\
    \ of it no matter what environment you're using. It's important to notice that\
    \ we can use async / await with TypeScript 2.1 and many browsers are supported,\
    \ of course, having globally added a polyfill for Promise.\n\nLet's see this example\
    \ and take a look at this to figure out how TypeScript async / await notation\
    \ works:"
