  - "[PAGE 188]\n\n# Be careful around parameters\n\nTypes do not flow into the function\
    \ parameters if it cannot be inferred from an assignment. For example in the following\
    \ case the compiler does not know the type of `foo` so it cannot infer the type\
    \ of `a` or `b`.\n\n```\nconst foo = (a,b) => { /* do something */ };\n```\n\n\
    However if `foo` was typed the function parameters type can be inferred (`a, b`\
    \ are both inferred to be of type number in the example below).\n\n```\ntype TwoNumberFunction\
    \ = (a: number, b: number) => void;\nconst foo: TwoNumberFunction = (a, b) =>\
    \ { /* do something */ };\n```\n\n# Be careful around return\n\nAlthough TypeScript\
    \ can generally infer the return type of a function, it might not be what you\
    \ expect. For example here `foo` has a return type of `any`.\n\n```\nfunction\
    \ foo(a: number, b: number) {\n  return a + addOne(b);\n}\n// Some external function\
    \ in a library someone wrote in JavaScript\nfunction addOne(a) {\n  return a +\
    \ 1;\n}\n```\n\nThis is because the return type is impacted by the poor type definition\
    \ for `addOne (a is any)` so the return of `addOne` is `any` so the return of\
    \ `foo` is `any`.\n\n> I find simplest to always be explicit about function /\
    \ returns. After all these annotations are a theorem and the function body is\
    \ the proof.\n\nThere are other cases that one can imagine, but the good news\
    \ is that there is a compiler flag that can catch such bugs.\n\n# noImplicitAny\n\
    \nThe flag `noImplicitAny` instructs the compiler to raise an error if it cannot\
    \ infer the type of a variable (and therefore can only have it as an `implicit\
    \ any` type). You can then\n\n+   - either say you want it to be of type `any`\
    \ by explicitly adding an `: any` type annotation"
- md: "\n- * help the compiler out by adding a few more *correct* annotations.\n\n\
    - Type Compatibility\n- Soundness\n- Structural\n- Generics\n- Variance\n- Functions\n\
    \  - Return Type\n  - Number of arguments\n  - Optional and rest parameters\n\
    \  - Types of arguments\n- Enums\n- Classes\n- Generics\n- FootNote: Invariance\n\
    \n## Type Compatibility\n\nType Compatibility (as we discuss here) determines\
    \ if one thing can be assigned to another. E.g. `string` and `number` are not\
    \ compatible:\n\n```\nlet str: string = \"Hello\";\nlet num: number = 123;\n```\n\
    \n```\nstr = num; // ERROR: `number` is not assignable to `string`\nnum = str;\
    \ // ERROR: `string` is not assignable to `number`\n```\n\n## Soundness\n\nTypeScript's\
    \ type system is designed to be convenient and allows for *unsound* behaviours\
    \ e.g. anything can be assigned to `any` which essentially means you are telling\
    \ the compiler to allow you to do whatever you want:\n\n```\nlet foo: any = 123;\n\
    foo = \"Hello\";\n\n// Later\nfoo.toPrecision(3); // Allowed as you typed it as\
    \ `any`\n```\n\n## Structural\n\nTypeScript objects are structurally typed. This\
    \ means the names don't matter as long as the structures match\n\n```\ninterface\
    \ Point {\n  x: number;\n  y: number;\n}\n\nclass Point2D {\n  constructor(public\
    \ x:number, public y:number){}\n}\n\nlet p: Point;\n// OK, because of structural\
    \ typing\np = new Point2D(1,2);\n```\n\nThis allows you to create objects on the\
    \ fly (like you do in vanilla JS) and still have safety for whenever it can be\
    \ inferred.\n\nAlso more data is considered fine:\n\n```\ninterface Point2D {\n\
    \  x: number;\n  y: number;\n}\n\ninterface Point3D {\n  x: number;\n  y: number;\n\
    \  z: number;\n}\n\nvar point2D: Point2D = { x: 0, y: 10 };\nvar point3D: Point3D\
    \ = { x: 0, y: 10, z: 20 };\nfunction iTakePoint2D(point: Point2D) { /* do something\
    \ */ }\n\niTakePoint2D(point2D); // exact match okay\niTakePoint2D(point3D); //\
    \ extra information okay\niTakePoint2D({ x: 0 }); // Error: missing information\
    \ `\n```\n\n## Variance\n\nVariance is an easy to understand and important concept\
    \ for type compatibility analysis.\n\nFor simple types Base and Child, if Child\
    \ is a child of Base, then instances of Child can be assigned to a variable of\
    \ type Base.\n\n> This is polymorphism 101\n\nIn compatibility of complex types\
    \ composed of such Base and Child depending on where the Base and Child in similar\
    \ scenarios is driven by variance.\n\n- Covariant: (corporate) only in same direction\n\
    - Contravariant: (contra negative) only in opposite direction\n- Bariant: (bi\
    \ aka both) co and contra.\n- Invariant: if the types aren't exact then they are\
    \ incompatible.\n\n> Note: For a completely subtle type system in the presence\
    \ of mutable data like JavaScript, invariant is the only valid option. But as\
    \ mentioned convenience forces us to make unknown choices.\n\n## Functions\n\n\
    There are a few subtle things to consider when comparing two functions.\n\n###\
    \ Return Type\n\ncovariant : The return type must contain at least enough data.\n\
    \n```\n/** Type Heirarchy */\ninterface Point2D { x: number; y: number; }\ninterface\
    \ Point3D { x: number; y: number; z: number; }\n\n/** Two sample functions */\n\
    let iMakePoint2D = () : Point2D => ({ x: 0, y: 0 });\nlet iMakePoint3D = () :\
    \ Point3D => ({ x: 0, y: 0, z: 0 });\n\n/** Assignment */\niMakePoint2D = iMakePoint3D;\
    \ // Okay\niMakePoint3D = iMakePoint2D; // ERROR: Point2D is not assignable to\
    \ Point3D\n```\n\n## Number of arguments\n\nLess arguments are okay (i.e. functions\
    \ can chose to ignore additional args). After all you are guaranteed to be called\
    \ with at least enough arguments.\n\n```\niTakeSomethingAndPassITANErr\n= (x:\
    \ Error, data: any) => void => { /* do something */ };\n```\n\n```\niTakeSomethingAndPassITANErr()\
    \ => null // Okay\niTakeSomethingAndPassITANErr(err) => null // Okay\niTakeSomethingAndPassITANErr(err,\
    \ data: null) => null // // Okay\n```\n\n```\n// ERROR: function may be called\
    \ with `more` not being passed in\niTakeSomethingAndPassITANErr(err, data, more)\
    \ => null;// ERROR\n```\n\n### Optional and Rest Parameters\n\nOptional (pre determined\
    \ count) and Rest parameters (any count of arguments) are compatible, again: for\
    \ convenience.\n\n```\nlet foo = (x:number, y: number) => { /* do something */\
    \ }\nlet bar = (x?: y?: number) => { /* do something */ }\nlet bas = (...args:\
    \ number[]) => { /* do something */ }\n```\n\n```\nfoo = bar = bas;\nbas = bar\
    \ = foo;\n```\n\n> Note: optional (in our example bar ) and non optional (in our\
    \ example foo ) are only compatible if strictNullChecks is false.\n\n### Types\
    \ of arguments\n\nbariant : This is designed to support common event handling\
    \ scenarios\n\n```\n// Event Hierarchy */\ninterface Event { timestamp: number;\
    \ }\ninterface MouseEvent extends Event { x: number; y: number }\ninterface KeyEvent\
    \ extends Event { keyCode: number }\n```\n\n```\n/** Sample listener */\nenum\
    \ EventType { Mouse, Keyboard, Event }\nfunction addEventListener(eventType: EventType,\
    \ handler: (n: Event) => void) {\n  /* ... */\n}\n```\n\n```\n// Unsound, but\
    \ useful and common. Works as function argument comparison is bivariate\naddEventListener(eventType:\
    \ EventType, Mouse (e: MouseEvent) => console.log(e.x + \" , \" + e.y));\n```\n\
    \n```\n// Undesirable alternatives in presence of soundness\naddEventListener(eventType:\
