  - '[PAGE 295]


    # Program


    Defined in program.ts . The compilation context (a concept we covered previously)
    is represented within the TypeScript compiler as a Program . It consists of SourceFile
    and compiler options.


    # Usage of CompilerHost


    Its interaction mechanism with the OE:


    ```

    Program -uses-> CompilerHost -uses-> System

    ```


    The reason for having a CompilerHost as a point of indirection is that it allows
    its interface to be more finely tuned for Program needs and not bother with OE
    needs (e.g. the Program doesn''t care about exists a function provided by System
    ).


    There are other users of System as well (e.g. tests).


    # SourceFile


    The program provides an API to get the Source Files getSourceFiles(): SourceFile[];
    Each is represented as a root-level node for an AST (called SourceFile ).'
  - '[PAGE 296]


    # Node


    The basic building block of the Abstract Syntax Tree (AST). In general a Node
    represents non-terminals in the language grammar; however, some terminals are
    kept in the tree such as identifiers and literals.


    Two keys make up an AST node''s documentation. The node''s SyntaxKind which identifies
    its type within the AST, and its interface , the API the node provides when instantiated
    into the AST.


    Here are a few key Node members:


    +   - TextRange members that identify the node''s start and end in the source
    file.

    - parent?: Node the parent of the node in the AST.


    There are other additional members for Node flags and modifiers etc. that you
    can lookup by searching interface Node in the source code but the ones we mentioned
    are vital for node traversal.


    # SourceFile


    +   - SyntaxKind.SourceFile

    - interface SourceFile.


    Each SourceFile is a top-level AST node that is contained in the Program.'
  - "[PAGE 297]\n\n# AST Tip: Visit Children\n\nThere is a utility function ts.forEachChild\
    \ that allows you to visit all the children of any Node in the AST.\n\nHere is\
    \ a simplified snippet of the source code to demonstrate how it functions:\n\n\
    ```\nexport function forChild<T>(node: Node, cbNode: (node: Node) => T, cbNodeArray?:\
    \ (\n  nodes: Node[]) => T): T {\n  if (!node) {\n    return;\n  }\n  switch (node.kind)\
    \ {\n    case SyntaxKind.BinaryExpression:\n      return visitNode(node, (<BinaryExpression>node).left)\
    \ ||\n        visitNode(cbNode, (<BinaryExpression>node).operatorToken) ||\n \
    \       visitNode(cbNode, (<BinaryExpression>node).right);\n    case SyntaxKind.IfStatement:\n\
    \      return visitNode(cbNode, (<IfStatement>node).expression) ||\n        visitNode(cbNode,\
    \ (<IfStatement>node).thenStatement) ||\n        visitNode(cbNode, (<IfStatement>node).elseStatement);\n\
    \    // .... lots other\n```\n\nBasically it checks node.kind and based on assumes\
    \ that an interface offered by the node and calls the cbNode on the children.\
    \ Note, however that this function doesn't visitNode for all children (e.g. SyntaxKind.SemicolonToken).\
    \ If you want all of a AST in AST just call .getChildren member function of the\
    \ Node.\n\nE.g. here is a function that prints the verbose AST of a node:\n\n\
    ```\nfunction printAllChildren(node: ts.Node, depth = 0) {\n  console.log(new\
    \ Array(depth+1).join('----')), ts.syntaxKindToName(node.kind), node.pos, node.end);\n\
    \  depth++;\n  node.getChildren().forEach(c=> printAllChildren(c, depth));\n}\n\
    ```\n\nWe will see a sample usage of this function when we discuss the parser\
    \ further."
  - "[PAGE 298]\n\n# AST Tip: SyntaxKind\n\nSyntaxKind is defined as a const enum,\
    \ here is a sample:\n\n```\nexport const enum SyntaxKind {\n  Unknown,\n  EndOfFileToken,\n\
    \  SingleLineCommentTrivia,\n  // ... LOTS more\n```\n\nIt's a const enum (a concept\
    \ we covered previously) so that it gets inlined (e.g. ts.SyntaxKind.EndOfFileToken\
    \ becomes 1 ) and we don't get a dereferencing cost when working with the AST.\
    \ However the compiler is compiled with --preserveConstEnums flag so that the\
    \ enum is still available at runtime. In JavaScript you can use ts.SyntaxKind.EndOfFileToken\
    \ if you want. Additionally you can convert these enum members to display strings\
    \ using the following function:\n\n```\nexport function syntaxKindName(kind: ts.SyntaxKind)\
    \ {\n  return (<any>ts).SyntaxKind[kind];\n}\n```"
  - '[PAGE 299]


    # Trivia


    Trivia (called significant because it''s trivial ) represent the parts of the
    source text that are largely insignificant for normal understanding of the code.
    For example; whitespace, comments, and even conflict markers. Trivia is not stored
    in the AST (to keep it lightweight). However it can be fetched on demand using
    a few ts.* APIs.


    Before we show them you need to understand the following:


    # Trivia Ownership


    In General:


    +   - A token owns any trivia after it on the same line upto the next token.

    - Any comment after that line is associated with the following token.


    For leading and ending comments in a file:


    +   - The first token in the source file gets all the initial trivia.

    - The last sequence of trivia in the file is tacked onto the end-of-file token,
    which otherwise has zero width.


    # Trivia APIs


    For most basic uses, comments are the "interesting" trivia. The comments that
    belong to a Node can be fetched through the following functions:


    | Function | Description |

    |---|---|

    | ts.getLeadingCommentRanges | Given the source text and position within that
    text, returns ranges of comments between the first line break following the given
    position and the token itself (probably most useful with ts.Node.FullStart ).
    |

    | ts.getTrailingCommentRanges | Given the source text and position within that
    text, returns ranges of comments until the first line break following the given
    position (probably most useful with ts.Node.getEnd ). |


    As an example, this portion of a source file:


    ```

    debugger;/*hello*/

    //bye

    /*hi*/   function

    ```'
