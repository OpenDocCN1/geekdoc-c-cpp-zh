    # # Number


    Whenever you are handling numbers in any programming language you need to be aware
    of the idiosyncrasies of how the language handles numbers. Here are few critical
    pieces of information about numbers in JavaScript that you should be aware of.


    # # Core Type


    JavaScript has only one number type. It is a double-precision 64-bit Number .
    Below we discuss its limitations along with a recommended solution.


    # # Decimal


    For those familiar with doubles / float in other languages, you would know that
    binary floating point numbers do not map correctly to Decimal numbers. A trivial
    (and famous) example with JavaScript''s built in numbers is shown:


    ```

    console.log(.1 + .2); // 0.30000000000000004

    ```


    > For true decimal math use big.js mentioned below.


    # # Integer


    The integer limits represented by the built in number type are Number.MAX_SAFE_INTEGER
    and Number.MIN_SAFE_INTEGER.


    ```

    console.log({max: Number.MAX_SAFE_INTEGER, min: Number.MIN_SAFE_INTEGER});

    // {max: 9007199254740991, min: -9007199254740991}

    ```


    Safe in this context refers to the fact that the value cannot be the result of
    a rounding error.


    The unsafe values are +1 / -1 away from these safe values and any amount of addition
    / subtraction will round the result.'
