    \ are different:\n\n```typescript\nlet foo = undefined;\nfoo = null; // NOT Okay\n\
    ```\n\nLet say we have a Member interface:\n\n```typescript\ninterface Member\
    \ {\n    name: string,\n    age?: number\n}\n```\n\nNot every Member will provide\
