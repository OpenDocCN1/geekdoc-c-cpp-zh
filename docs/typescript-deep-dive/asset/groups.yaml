    No testing solution out there is perfect. That said, jest is an excellent unit
    testing option which provides great TypeScript support.


    > Note: We assume you start off with a simple package.json setup. Also all TypeScript
    files should be in a `src` folder which is always recommended (even without Jest)
    for a clean project setup.


    # Step 1: Install


    Install the following using npm:


    ```

