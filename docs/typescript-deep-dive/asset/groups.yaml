- md: "\n# Revisiting our JSON example\n\nNow let's revisit our loadJSON example and\
    \ rewrite an async version that uses promises. All that we need to do is read\
    \ the file contents as a promise, then parse them as JSON and we are done. Here\
    \ is it in the below example:\n\n```typescript\nfunction loadJSONAsync(filename:\
    \ string): Promise<any> {\n  return readFileSync(filename) // Use the function\
    \ we just wrote\n  .then(function (res) {\n    return JSON.parse(res);\n  });\n\
    }\n```\n\nUsage (notice how similar it is to the original sync version introduced\
    \ at the start of this section):\n\n```javascript\n// good file\nloadJSONAsync('good.json')\n\
    \  .then(function (val) { console.log(val); })\n  .catch(function (err) {\n  \
    \  console.log('good.json error', err.message); // never called\n  })\n\n// non-existent\
    \ json file\n.then(function () {\n  return loadJSONAsync('absent.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('absent.json error', err.message);\n  })\n\n// invalid\
    \ json file\n.then(function () {\n  return loadJSONAsync('invalid.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('bad.json error', err.message);\n  });\n```\n\nThe\
    \ reason why this function was simpler is because the loadFile (async) + JSON.parse(sync)\
    \ = catch consolidation was done by the promise chain. Also the callback was not\
    \ called by us but by the promise chain so we didn't have the chance of making\
    \ the mistake of wrapping it in a try/catch.\n\n# Parallel control flow\n\nWe\
    \ have seen how trivial a serial sequence of async tasks is with promises. It\
    \ is simply a matter of chaining calls.\n\nHowever you might potentially want\
    \ to run a series of async tasks and then do something with the results of all\
    \ these tasks. Promise provides a static Promise.all function that you can wait\
    \ for n number of promises to complete. You provide it with an array of n promises\
    \ and gives you an array of n resolved values. Below we show Chaining as well\
    \ as Parallel:\n\n```javascript\n// an async function to simulate loading an item\
    \ from some server\nfunction loadItem(id: number): { id: number } {\n  return\
    \ new Promise((resolve) => {\n    console.log('loading item', id);\n    setTimeout(()\
    \ => { // simulate a server delay\n      resolve({ id: id });\n    }, 1000);\n\
    \  });\n}\n\n// Chaining\nlet item1, item2;\nloadItem(1)\n  .then((res) => {\n\
    \    item1 = res;\n    return loadItem(2);\n  })\n  .then((res) => {\n    item2\
    \ = res;\n    console.log('done');\n  }); // overall time will be around 2s\n\n\
    // Parallel\nPromise.all([loadItem(1), loadItem(2)])\n  .then((res) => {\n   \
    \ [item1, item2] = res;\n    console.log('done');\n  }); // overall time will\
    \ be around 1\n```\n\nSometimes, you want to run a series of async tasks, but\
    \ then you get all as long as any one of these tasks is settled. Promise provides\
    \ a static Promise.race function for this scenario:\n\n```javascript\ntask1 =\
    \ new Promise(function(resolve, reject) {\n  setTimeout(resolve, 1000, 'one');\n\
    });\ntask2 = new Promise(function(resolve, reject) {\n  setTimeout(resolve, 2000,\
    \ 'two');\n});\n\nPromise.race([task1, task2]).then(function(value) {\n  console.log(value);\
    \ // \"one\"\n  // Both resolve, but task1 resolves faster\n});\n```\n\n# Converting\
    \ callback functions to promise\n\nThe most reliable way to do this is to hand\
    \ write it. e.g. converting setTimeout into a promisified delay function is super\
    \ easy:\n\n```typescript\nconst delay = (ms: number) => new Promise(res => setTimeout(res,\
    \ ms));\n```\n\nNote that there is a handy dandy function in NodeJS that does\
    \ this node function => promise returning function magic for you:\n\n```javascript\n\
    /** Sample usage */\nimport fs = require('fs');\nimport util = require('util');\n\
    const readFile = util.promisify1(fs.readFile);\n```\n\n# Generators\n\n> NOTE:\
    \ You cannot use generators in TypeScript in a meaningful way (the ES5 emitter\
    \ is in progress). However that will change soon so we still have this chapter.\n\
    \nfunction * is the syntax to create a generator function. Calling a generator\
    \ function returns a generator object. The generator object just follows the iterator\
    \ interface (i.e. the next, return and throw functions).\n\nThere are two key\
    \ motivations behind generator functions:\n\n# Lazy Iterators\n\nGenerator functions\
    \ can be used to create lazy iterators e.g. the following function returns an\
    \ infinite list of integers on demand:\n\n```javascript\nfunction* infiniteSequence()\
    \ {\n  var i = 0;\n  while (true) {\n    yield i++;\n  }\n}\n\nvar iterator =\
    \ infiniteSequence();\nwhile (true) {\n  console.log(iterator.next()); // { value:\
    \ xxxx, done: false } forever and ever\n```\n\nOf course if the iterator does\
    \ end, you get the result of { value: xxxx, done: false }:\n\n```javascript\n\
    function* idMaker() {\n  let index = 0;\n  while (index < 3) {\n    yield index++;\n\
    \  }\n}\n\nvar iterator = idMaker();\nconsole.log(iterator.next()); // { value:\
    \ 0, done: false }\nconsole.log(iterator.next()); // { value: 1, done: false }\n\
    console.log(iterator.next()); // { value: 2, done: false }\nconsole.log(iterator.next());\
    \ // { value: undefined, done: true }\n```\n\n# Externally Controlled\n\nThis\
    \ is how you can control the generator from the outside:\n\n```javascript\nfunction*\
    \ idMaker() {\n  try {\n    let val = yield 0;\n    console.log(val);\n  } catch\
    \ (err) {\n    console.log(err.message);\n  }\n}\n\nvar iterator = idMaker();\n\
    console.log(iterator.next()); // { value: 0, done: false }\niterator.throw(new\
    \ Error('bad')); // logs bad\n```\n\n# Async await\n\nA PRO egghead video course\
    \ that covers the same material\n\nAs a thought experiment imagine the following:\
    \ a way to tell the JavaScript runtime to pause the executing of code on the `await`\
    \ keyword when used on a promise and resume *only* once (and if) the promise returned\
    \ from the function is settled:\n\n```javascript\n// Not actual code. A thought\
    \ experiment\nasync function foo() {\n  try {\n    var val = await getMePromise();\n\
    \    console.log(val);\n  }\n  catch (err) {\n    console.log('Error: ', err.message);\n\
    \  }\n}\n```\n\nWhen the promise settles execution continues,\n\n- if it was fulfilled\
    \ then await will return the value\n- if it's rejected an error will be thrown\
    \ synchronously which we can catch.\n\nThis suddenly (and magically) makes asynchronous\
    \ programming as easy as synchronous programming. Three things needed for this\
    \ thought experiment are:\n\n- Ability to pause *function* execution.\n- Ability\
    \ to put *a value inside* the function.\n- Ability to *throw an exception inside*\
    \ the function.\n\nThis is exactly what generators allowed us to do! The thought\
    \ experiment is *actually real* and so is the `async / await` implementation in\
    \ TypeScript / JavaScript. Under the covers it just uses generators.\n\n# Generated\
    \ JavaScript\n\nYou don't have to understand this, but it's fairly simple if you've\
    \ read up on generators. The function `foo` can be simply wrapped up as follows:\n"
  mdcn: "\n\n# 重新回顾我们的 JSON 示例\n\n现在让我们重新回顾 `loadJSON` 示例，并重写一个使用 promise 的异步版本。我们所做的只是读取文件内容作为一个\
    \ promise，然后将其解析为 JSON 即可完成。下例所示：\n\n```typescript\nfunction loadJSONAsync(filename:\
