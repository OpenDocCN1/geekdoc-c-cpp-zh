    # export default can lead to problems


    Let''s go with an example. Consider you have a file `foo.ts` with the following
    contents:


    ```

    class Foo {

    }

    export default Foo;

    ```


    You would import it (in `bar.ts`) using ES6 syntax as follows:


    ```

    import Foo from "./foo";

    ```


    There are a few maintainability concerns here:


    +   - If you refactor Foo in `foo.ts` it will not rename it in `bar.ts`.

    - If you end up needing to export more stuff from `foo.ts` (which is what many
    of your files will have) then you have to juggle the import syntax.


    For this reason I recommend simple exports + destructured import. E.g. `foo.ts`
    :


    ```

    export class Foo {

    }

    ```


    And then:


    ```

    import {Foo} from "./foo";

    ```'
  - '[PAGE 259]


    **Bonus points:** You get autocomplete at this `import {/**/} from "./foo";` cursor
    location. Gives your developers a bit of wrist relief.


    **Bonus points:** Better commons experience. With `default` there is horrible
    experience for commons users who have `const {default} = require(''module/foo'');`
    instead of `const {Foo} = require(''module/foo'');`


    **Bonus points:** You don''t get typos like one dev doing `import Foo from "./foo";`
    and another doing `import foo from "./foo";`


    **Bonus points:** Auto import quickfix works better. You use `Foo` and auto import
    will write down `import { Foo } from "./foo";` cause its well defined name exported
    from a module.


    **Bonus points:** Re-exporting is unnecessarily hard. Re-exporting is common for
    the root `index` file in npm packages e.g. `import Foo from "./foo"; export {
    Foo } (with default) vs. `export * from "./foo"` (with named exports).'
