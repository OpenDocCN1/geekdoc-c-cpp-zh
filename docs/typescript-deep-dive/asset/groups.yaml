  - "[PAGE 179]\n\n# Generics\n\nThe key motivation for generics is to provide meaningful\
    \ type constraints between members.\nThe members can be:\n\n+   * Class instance\
    \ members\n* Class methods\n* function arguments\n* function return value\n\n\
    # Motivation and samples\n\nConsider the simple Queue (first in, first out) data\
    \ structure implementation. A simple one in TypeScript / JavaScript looks like:\n\
    \n```\nclass Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n```\n\nOne issue with this implementation\
    \ is that it allows people to add anything to the queue and when they pop it -\
    \ it is anything. This is shown below, where someone can push a string onto the\
    \ queue while the usage actually assumes that only numbers pushed in:\n\n```\n\
    class Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n\
    \  pop = () => this.data.shift();\n}\n\nconst queue = new Queue();\nqueue.push(0);\n\
    queue.push(\"1\"); // Ops a mistake\n\n// a developer walks into a bar\nconsole.log(queue.pop().toPrecision(i));\n\
    console.log(queue.pop().toPrecision(i)); // RUNTIME ERROR\n```"
  - "[PAGE 180]\n\nOne solution (and in fact the only one in languages that don't\
    \ support generics) is to go ahead and create special classes just for these constraints.\
    \ E.g. a quick and dirty number queue:\n\n```\nclass QueueNumber {\n    private\
    \ data = [];\n    push = (item: number) => this.data.push(item);\n    pop = ()\
    \ => this.data.shift();\n}\n\nconst queue = new QueueNumber();\nqueue.push(0);\n\
    queue.push(\"i\"); // ERROR : cannot push a string. Only numbers allowed\n```\n\
    \n// ^ if that is fixed the rest would be fine too\n\nOf course this can become\
    \ painful e.g. if you want a string queue you have to go through all that effort\
    \ again. What you really want is a way to say that whatever the type of the stuff\
    \ getting pushed it should be the same for whatever gets popped. This is done\
    \ easily with a generic parameter (in this case, at the class level):\n\n```\n\
    /** A class definition with a generic parameter */\nclass Queue<T> {\n    private\
    \ data = [];\n    push = (item: T) => this.data.push(item);\n    pop = () => T\
    \ => this.data.shift();\n}\n\n/** Again sample usage */\nconst queue = new Queue<number>();\n\
    queue.push(0);\nqueue.push(\"i\"); // ERROR : cannot push a string. Only numbers\
    \ allowed\n\n// ^ if that error is fixed the rest would be fine too\n```\n\nAnother\
    \ example that we have already seen is that of a reverse function, here the constraint\
    \ is between what gets passed into the function and what the function returns:"
- md: "\n```typescript\nfunction reverse<T>(items: T[]): T[] {\n  var toreturn = [];\n\
    \  for (let i = items.length - 1; i >= 0; i--) {\n    toreturn.push(items[i]);\n\
    \  }\n  return toreturn;\n}\n\nvar sample = [1, 2, 3];\nvar reversed = reverse(sample);\n\
    console.log(reversed); // 3,2,1\n\n// Safety!\nreversed[0] = '1'; // Error!\n\
    reversed = ['1', '2']; // Error!\n\nreversed[0] = 1; // Okay\nreversed = [1, 2];\
    \ // Okay\n```\n\nIn this section you have seen examples of generics being defined\
    \ at class level and at function level. One minor addition mentioning is that\
    \ you can have generics created just for a member function. As a toy example consider\
    \ the following where we move the function into a utility class:\n\n```typescript\n\
    class utility {\n  reverse<T>(items: T[]): T[] {\n    var toreturn = [];\n   \
    \ for (let i = items.length - 1; i >= 0; i--) {\n      toreturn.push(items[i]);\n\
    \    }\n    return toreturn;\n  }\n}\n```\n\n> TIP: You can call the generic parameter\
    \ whatever you want. It is conventional to use T, U, V when you have simple generics.\
    \ If you have more than one generic argument try to use meaningful names e.g.\
    \ TKey and TValue (conventional to prefix with T as generics are also called templates\
    \ in other languages e.g. C++).\n\n## Generics in TSX\n\nBecause .tsx /.jsx uses\
    \ syntax like <div> to denote JSX blocks it offers a few unique challenges for\
    \ Generics.\n\nQuick Tip: Use as Foo syntax for type assertions as we mentioned\
    \ before.\n\n## Generic functions\n\nSomething like the following works fine:\n\
    \n```typescript\nfunction foo<T>(x: T) { return x; }\n```\n\nHowever using an\
    \ arrow generic will not:\n\n```typescript\nconst foo = <T>(x: T) => x; // ERROR\
    \ : unclosed `T` tag\n```\n\nWorkaround: Use extends on the generic parameter\
    \ to hint the compiler that it's generic, e.g.:\n\n```typescript\nconst foo =\
    \ <T extends {}>(x: T) => x;\n```\n\n## Generic Components\n\nSince JSX doesn't\
    \ have a syntax for providing a generic parameter you need to specialize the component\
    \ using a type assertion before creating it, e.g.:\n\n```typescript\n/* Generic\
    \ component */\ntype SelectProps<T> = { items: T[] }\nclass Select<T> extends\
    \ React.Component<SelectProps<T>, any> { }\n\n/* Specialization */\ninterface\
    \ StringSelect extends { new (): Select<string>; }\nconst StringSelect = Select\
    \ as StringSelect;\n\n/* Usage */\nconst Form = () => <StringSelect items={['a',\
    \ 'b']}} />;\n```\n\n## Useless Generic\n\nI've seen people use generics just\
    \ for the heck of it. The question to ask is what constraint are you trying to\
    \ describe. If you can't answer it easily you probably have a useless generic\
    \ E.g. people have attempted to type the Node.js require function as:\n\n```typescript\n\
    declare function require<T>(name: string): T;\n```\n\nIn this case you can see\
    \ that the T is only used in one place. So there is not constraint between members.\
    \ You would be better off with a type assertion in this case:\n\n```typescript\n\
    declare function require(name: string): any;\nconst something = require('something')\
    \ as TypeOfSomething;\n```\n\nThis is just an example; if you are considering\
    \ on this `require` typings, you don't need to because:\n\n- 1. It's already there\
    \ in node.d.ts : you can install using `npm install @types/node --save-dev`.\n\
    - 2. You should consider the type definitions for your library e.g. for jquery\
    \ `npm install @types/jquery --save-dev` instead of using raw `require`.\n\n##\
    \ Design Pattern: Convenience generic\n\nThe previous example of `require<T>`\
    \ was intentionally meant to clear the fact that generics used *only once* are\
    \ no better than an assertion in terms of type safety. That said they provide\
    \ `convenience` to your API.\n\nAn example is a function that loads a json response.\
    \ It returns a promise of *whatever type* you pass in:\n\n```typescript\nconst\
    \ getJSON = <T>(config: {\n  url: string,\n  method?: string,\n  headers?: { [key:\
    \ string]: string },\n  'Accept': 'application/json',\n  'Content-Type': 'application/json',\n\
    }, headers || {}): Promise<T> => {\n  const fetchConfig = {\n    method: 'GET',\n\
    \    'Accept': 'application/json',\n    'Content-Type': 'application/json',\n\
    \  };\n  return fetch(url, fetchConfig)\n    .then(response => response.json());\n\
    };\n```\n\nNote that still have to explicitly annotate what you want, `getJSON<T>`\
    \ signature saves you a few strokes:\n\n```typescript\ntype LoadResponse = {\n\
    \  users: {\n    name: string;\n    email: string;\n  };\n}\n\nfunction loadUsers()\
    \ {\n  return getJSON<LoadResponse>({ url: 'example.com/users' });\n}\n```\n\n\
    Also a return value is definitely better than `any`.\n\n## Type Inference\n\n\
    TypeScript can infer the type of a variable based on a few rules. Because these\
    \ rules are simple you can train your brain to recognize safe.\n\n> The types\
    \ flowing is just how I imagine.\n\n## Definition\n\nTypes of a variable are inferred\
    \ by definition.\n\n```\nlet foo = 123; // foo is `number`\nlet bar = \"Hello\"\
    ; // bar is `string`\nfoo = bar; // Error: cannot assign `string` to `number`\n\
    ```\n\nThis is an example of types flowing from right.\n\n## Return\n\n```typescript\n\
    function add(a: number, b: number) {\n  return a + b;\n}\n```\n\nThis is an example\
    \ of types flowing bottom.\n\n## Assignment\n\nThe type of function parameters\
    \ can also be inferred by assignment.\n\n```typescript\ntype Adder = (a: number,\
    \ b: number) => number;\nlet foo: Adder = (a, b) => a + b;\n```\n\nThis type can\
    \ be demonstrated by below code. The same assignment style type inference works\
    \ if you create a function for a callback. After all `argument -> parameter` is\
    \ just another form of assignment.\n\n```typescript\ntype Adder = (a: number,\
    \ b: number) => number;\nfunction iTakeAdder(adder: Adder) {\n  return adder(1,\
    \ 2);\n}\niTakeAndAdder((a, b) => {\n  // a = \"hello\"; // Error: cannot assign\
    \ `string` to `number`\n  return a + b;\n})\n```\n\nThis is an example of types\
    \ flowing from left to right.\n\n## Structuring\n\nThese simple rules also work\
    \ in the presence of **structuring** (object literal creation). For example in\
    \ the following case the type of `foo` is inferred to be `{a:number, b:number}`.\n\
    \n```typescript\nlet foo = {\n  a: 123,\n  b: 456\n};\n// foo.a = \"hello\"; //\
    \ Would Error: cannot assign `string` to a `number`\n```\n\nSimilarly for arrays:\n\
    \n```typescript\nconst bar = [1,2,3];\n// bar[0] = \"hello\"; // Would error:\
    \ cannot assign `string` to a `number`\n```\n\nAnd of course any nesting:\n\n\
    ```typescript\nlet foo = {\n  bar: [1, 3, 4]\n};\nfoo.bar[0] = 'hello'; // Would\
    \ error: cannot assign `string` to a `number`\n```\n\n## Destructuring\n\nAnd\
    \ of course, they also work with destructuring, both objects:\n\n```typescript\n\
    let foo = {\n  a: 123,\n  b: 456\n}\nlet {a} = foo;\n// a = \"hello\"; // Would\
    \ Error: cannot assign `string` to a `number`\n```\n\nand arrays:\n\n```typescript\n\
    const bar = [1, 2];\nlet [a, b] = bar;\n// a = \"hello\"; // Would Error: cannot\
    \ assign `string` to a `number`\n```\n\nAnd if the function parameter can be inferred,\
    \ so can its destructured properties. For example here we destructure the argument\
    \ into its a b members.\n\n```typescript\ntype Adder = ({ a: number, b: number\
    \ }) => number;\nfunction iTakeAndAdder(adder: Adder) {\n  return adder({ a: 1,\
    \ b: 2 });\n}\niTakeAndAdder((a, b }) => { // Types of `a` and `b` are inferred\n\
    // a = \"hello\"; // Would Error: cannot assign `string` to a `number`\n  return\
    \ a + b;\n})\n```\n\n## Type Guards\n\nWe have already seen how Type Guards help\
    \ change and narrow down types (particularly the case of unions). Type guards\
    \ are just another form of type inference for a variable in a block.\n\n## Warnings\n\
    \n## Be careful around parameters\n\nTypes do not flow into the function parameters\
    \ if it cannot be inferred from an assignment. For example in the following case\
    \ the compiler does not know the type of `foo` so it cannot infer the type of\
    \ `a` or `b`.\n\n```typescript\nconst foo = (a,b) => { /* do something */ };\n\
    ```\n\nHowever if `foo` was typed the function parameters type can be inferred\
    \ (`a, b are both inferred to be of number in the example).\n\n```typescript\n\
    type TwoNumberFunction = (a: number, b: number) => void;\nconst foo: TwoNumberFunction\
    \ = (a, b) => { do something */ };\n```\n\n## Be careful around return\n\nAlthough\
    \ TypeScript can generally infer the return type of a function, it might not be\
    \ what you expect. For example here `foo` has a return type of `any`.\n\n```typescript\n\
    function foo(a: number, b: number) {\n  return a + addOne(b);\n}\n// Some external\
    \ function in a library someone wrote in JavaScript\nfunction addOne(a) {\n  return\
    \ a + 1;\n}\n```\n\nThis is because the return type is impacted by the poor type\
    \ definition for `addOne (a is any)` so the return of `addOne` is `any` so the\
    \ return of `foo` is `any`.\n\n> I find simplest to always be explicit about function\
    \ / returns. After all these annotations are a theorem and the function body is\
    \ the proof.\n\nThere are other cases that one can imagine, but the good news\
    \ is that there is a compiler flag that can catch such bugs.\n\n# noImplicitAny\n\
    \nThe flag `noImplicitAny` instructs the compiler to raise an error if it cannot\
    \ infer the type of a variable (and therefore can only have it as an `implicit\
    \ any` type). You can then\n\n- either say you want it to be of type `any` by\
    \ explicitly adding an `: any` type annotation.\n"
