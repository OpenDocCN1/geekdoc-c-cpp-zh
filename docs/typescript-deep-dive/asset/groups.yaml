    \ // 没有编译错误！\nuseAdd((x) => add(x)); // 错误：number 无法赋值给 string\n```\n\n# 柯里 (Currying)\n\
    \n直接使用箭头函数链：\n\n```typescript\n// 一个柯里函数\nlet add = (x: number) => (y: number)\
    \ => x + y;\n\n// 用法\nadd(123)(456);\n\n// 部分应用\nlet add123 = add(123);\n\n//\
    \ 完全应用函数\nadd123(456);\n```\n\n"
