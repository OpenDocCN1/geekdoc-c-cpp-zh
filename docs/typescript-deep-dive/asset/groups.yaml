    \  first: 'John'\n};\nname = { // Error: `second` is the wrong type\n  first:\
    \ 'John',\n  second: 1337\n};\n```\n\nInline types are great for quickly providing\
    \ an annotation for something. It saves you the hassle of coming up with (potentially\
    \ bad) type. However, if you find yourself putting the same type annotation multiple\
    \ times it's a good idea to consider refactoring it into an interface.\n\n# Special\
    \ Types\n\nBeyond the primitive types that are covered are few types that have\
