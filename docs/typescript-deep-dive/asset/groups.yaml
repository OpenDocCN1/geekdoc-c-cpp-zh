    \ is non-null. This allows you to access name\n}\n```\n\n> Note that it is just\
    \ an assertion, and just like type assertions you are responsible for making sure\
    \ the value is not null. A non-null assertion is essentially telling you the compiler\
    \ \"I know it's not null so let me use it as though it's not null\".\n\n## # Testing\n\
    \nTypeScript can be used with any JavaScript testing framework that you want.\
    \ In the worst case you can always do a simple `TypeScript -> JavaScript` transform\
    \ and go your merry way.\n\nThat said, in this section look at options that we\
    \ have enjoyed greatly\n\n## # Using Jest with TypeScript\n\nPro egghead lesson\
