  mdcn: "\nMath 意味着如果你想向 Math 全局变量添加内容，你只需要将其添加到 Math 全局接口中即可，例如，考虑 seedrandom 项目，它向全局\
    \ Math 对象添加了 `seedrandom`。这可以很容易地声明：\n\n```\ninterface Math {\n  seedrandom(seed?:\
    \ string);\n}\n```\n\n然后你就可以直接使用它：\n\n```\nMath.seedrandom();\n// or\nMath.seedrandom(\"\
    Any string you want!\");\n```\n\n# 示例\n\n# Date\n\n如果你在 lib.d.ts 中查看 Date 变量的定义，你会发现：\n\
    \n```\ndeclare var Date: DateConstructor;\n```\n\n`DateConstructor` 接口与你之前看到的\
    \ Math 和 Window 类似，因为它包含了你可以在 Date 全局变量上使用的成员，例如 `Date.now()`。此外，它还包含了构造签名，允许你创建\
    \ Date 实例（`new Date()` ）。在下面显示了 `DateConstructor` 接口的一个片段：\n\n```\ninterface DateConstructor\
    \ {\n  new(): Date;\n  // ... 其他构造签名\n  now(): number;\n  // ... 其他成员函数\n}\n```\n\
    \n考虑 datejs 项目。DateJS 同时向 Date 全局变量和 Date 实例添加了成员。因此，该库的 TypeScript 定义看起来如下（顺便说，在这种情况下社区已经为你写好了）：\n\
    \n```\n/** DateJS 静态方法 */\ninterface DateConstructor {\n  /** 获取设为当前日期的日期。时间设置为一天的开始（00:00\
    \ 或凌晨 12:00） */\n  today(): Date;\n  // ... 等此类推\n}\n```\n\n```\n/** DateJS 实例方法\
    \ */\ninterface Date {\n  /** 向此实例添加指定的毫秒数。 */\n  addMilliseconds(milliseconds:\
    \ number): Date;\n  // ... 等此类推\n}\n```\n\n这允许你以类型安全的方式进行诸如下的操作：\n\n```\nvar today\
    \ = Date.today();\nvar todayAftersecond = today.addMilliseconds(1000);\n```\n\n\
    # 示例 string\n\n如果你在 lib.d.ts 中查看 string，你会发现与我们在 Date 中看到的内容类似的东西（String 全局变量、StringConstructor\
    \ 接口、String 接口）。但注意的是，String 接口也会影响字符串字面量，如下方的代码示例所示：\n\n```\ninterface String\
    \ {\n  endsWith(suffix: string): boolean;\n}\n\nString.prototype.endsWith = function(suffix:\
    \ string): boolean {\n  var str: string = this;\n  return str && str.indexOf(suffix,\
    \ str.length - suffix.length) !== -1;\n}\n\nconsole.log('foo bar'.endsWith('bas'));\
    \ // false\nconsole.log('foo bas'.endsWith('bas')); // true\n```\n\n对于其他具有静态和实例成员的类型（如\
    \ Number、Boolean、RegExp 等也有类似的变量和接口，这些接口也会影响这些类型的字面量实例。\n\n# 示例 string Redux\n\
    \n出于可维护性考虑，我们建议创建一个 `global.ts`。然而，如果你愿意，也可以从文件模块进入全局命名空间。这是通过 `declare global\
    \ { /*global namespace*/ }` 实现的。例如，之前的示例也可以这样做：\n\n```\n// 确保此被视为模块。\nexport {};\n\
    \ndeclare global {\n  interface String {\n    endsWith(suffix: string): boolean;\n\
    \  }\n}\n\nString.prototype.endsWith = function(suffix: string): boolean {\n \
    \ var str: string = this;\n  return str && str.indexOf(suffix, str.length - suffix.length)\
    \ !== -1;\n}\n\nconsole.log('foo bar'.endsWith('bas')); // false\nconsole.log('foo\
    \ bar'.endsWith('bas')); // true\n```\n\n# 使用自定义的 lib.d.ts\n\n正如我们之前提到的，使用 `noLib`\
    \ 布尔值编译器标志会导致 TypeScript 排除自动包含 `lib.d.ts`。有很多原因使得此功能非常有用。以下是几个常见原因：\n\n- 你运行在一个与标准浏览器运行时环境显著不同的自定义\
    \ JavaScript 环境中。\n- 你喜欢对代码中的全局变量进行严格限制。例如，`lib.d.ts` 将 `item` 定义为全局变量，你不希望它泄漏到你的代码中。\n\
    \n一旦你排除了默认的 `lib.d.ts`，你就可以将同名的文件包含到编译环境中，TypeScript 将选取它进行类型检查。\n\n> 注意：小心使用\
    \ `noLib`。一旦你进入了 noLib 领域，如果你选择与他人共享项目，他们将被迫进入 noLib 领域（而不是你的 lib 世界）。更糟糕的是，如果你将他们的代码引入你的项目，你可能需要将其迁移到基于你的\
    \ lib 的代码。\n\n# 编译目标对 lib.d.ts 的影响\n\n将编译器目标设置为 `es6` 会导致 `lib.ts` 包含针对更现代（es6）内容（如\
    \ `Promise`）的额外环境声明。编译器目标改变代码环境的魔法效果对某些人是有利的，但对另一些人是有问题的，因为它将代码生成与代码环境混为一谈。\n\n\
    然而，如果你想进行更细粒度的控制，应该使用我们接下来要讨论的 `--lib` 选项。\n"
