- md: "\n```typescript\nenum Color {\n    Red,\n    Green,\n    Blue\n}\n\nenum Color\
    \ {\n    DarkRed = 3,\n    DarkGreen,\n    DarkBlue\n}\n```\n\nNote that you should\
    \ reinitialize the first member (here DarkRed = 3) in a continuation of an enum\
    \ to get the generated code not clobber values from a previous definition (i.e\
    \ the 0, 1 ... so on values). TypeScript will warn you if you don't anyways (error\
    \ message: In an enum with multiple declarations, only one declaration can omit\
    \ an initializer for its first enum element).\n\n## Enums as flags\n\nOne excellent\
    \ use of enums is the ability to use enums as Flags. Flags allow you to check\
    \ if a certain condition from a set of conditions is true. Consider the following\
    \ example where we have a set of properties about animals:\n\n```typescript\n\
    enum AnimalFlags {\n    None = 0,\n    HasClaws = 1 << 0,\n    CanFly = 1 << 1,\n\
    \    EatsFish = 1 << 2,\n    Endangered = 1 << 3\n}\n```\n\nHere we are using\
    \ the left shift operator to move 1 around a certain level of bits to come up\
    \ with bitwise disjoint numbers 0001, 0010, 0100 and 1000 (these are decimals\
    \ 1, 2, 4, 8 if you are curious). The bitwise operators | (or) / & (and) / ~ (not)\
    \ are your best friends when working with flags and are demonstrated below:\n\n\
    ```typescript\nenum AnimalFlags {\n    None = 0,\n    HasClaws = 1 << 0,\n   \
    \ CanFly = 1 << 1,\n}\n```\n\n```typescript\nfunction printAnimalAbilities(animal)\
    \ {\n    var animalFlags = animal.flags;\n    if (animalFlags & AnimalFlags.HasClaws)\
    \ {\n        console.log('animal has claws');\n    }\n    if (animalFlags & AnimalFlags.CanFly)\
    \ {\n        console.log('animal can fly');\n    }\n    if (animalFlags == AnimalFlags.None)\
    \ {\n        console.log('nothing');\n    }\n}\n```\n\n```typescript\nvar animal\
    \ = { flags: AnimalFlags.None };\nprintAnimalAbilities(animal); // nothing\nanimal.flags\
    \ |= AnimalFlags.HasClaws;\nprintAnimalAbilities(animal); // has claws\nanimal.flags\
    \ &= ~AnimalFlags.HasClaws;\nprintAnimalAbilities(animal); // nothing\nanimal.flags\
    \ |= AnimalFlags.HasClaws | AnimalFlags.CanFly;\nprintAnimalAbilities(animal);\
    \ // has claws, animal can fly\n```\n\nHere:\n\n- we used |= to add flags\n- a\
    \ combination of &= and ~ to clear a flag\n- | to combine flags\n\n> Note: you\
    \ can combine flags to create convenient shortcuts within the enum definition\
    \ e.g. EndangeredFlyingClawedFishEating below:\n\n```typescript\nenum AnimalFlags\
    \ {\n    None = 0,\n    HasClaws = 1 << 0,\n    CanFly = 1 << 1,\n    EatsFish\
    \ = 1 << 2,\n    Endangered = 1 << 3,\n}\n\nconst EndangeredFlyingClawedFishEating\
    \ = HasClaws | CanFly | EatsFish | Endangered;\n```\n\n## Const Enums\n\nIf you\
    \ have an enum definition like the following:\n\n```typescript\nenum Tristate\
    \ {\n  False,\n  True,\n  Unknown\n}\n```\n\n```typescript\nvar lie = Tristate.False;\n\
    ```\n\nThe line `var lie = Tristate.False` is compiled to the JavaScript `var\
    \ lie = Tristate.False` (output, and then is same as input). This means at executing\
    \ the runtime will need to lookup Tristate and then Tristate.False. To get a performance\
    \ boost here you can mark the enum as a `const enum`. This is demonstrated below:\n\
    \n```typescript\nconst enum Tristate {\n  False,\n  True,\n  Unknown\n}\n```\n\
    \n```typescript\nvar lie = Tristate.False;\n```\n\ngenerates the JavaScript:\n\
    \n```javascript\nvar lie = 0;\n```\n\ni.e. the compiler:\n\n- 1. Inlines any usages\
    \ of the enum (0 instead of Tristate.False).\n- 2. Does not generate any JavaScript\
    \ for the enum definition (there is no Tristate variable at runtime) as its usages\
    \ are inlined.\n\n## Const enum preserveConstNums\n\nInlining has obvious performance\
    \ benefits. The fact that there is no Tristate variable at runtime is simply the\
    \ compiler helping out by not generating JavaScript that is not actually used\
    \ at runtime. However you might want the compiler to still generate the JavaScript\
    \ version of the enum definition for like number to string or string to number\
    \ lookups as we saw. In this case you can use the compiler flag `--preserveConstNums`\
    \ and it will generate the `Tristate` definition so that you can use `Tristate[\"\
    \"]` or `Tristate[0]` manually if you want to. This does not impact inlining in\
    \ any way.\n\n## Enum with static functions\n\nYou can use the declaration `enum\
    \ + namespace` merging to add static methods to an enum. The following demonstrates\
    \ an example where we add a static member `isBusinessDay` to an enum `weekday`:\n\
    \n```typescript\nenum Weekday {\nMonday,\nTuesday,\nWednesday,\nThursday,\nFriday,\n\
    Saturday,\nSunday\n}\n\nnamespace Weekday {\n    export function isBusinessDay(day:\
    \ Weekday) {\n        switch (day) {\n            case Weekday.Saturday:\n   \
    \         case Weekday.Sunday:\n                return false;\n            default:\n\
    \                return true;\n        }\n    }\n}\n\nconst mon = Weekday.Monday;\n\
    const sun = Weekday.Sunday;\nconsole.log(Weekday.isBusinessDay(mon)); // true\n\
    console.log(Weekday.isBusinessDay(sun)); // false\n```\n"
