    \ command.join(' ').trim();\n  }\n\n  // 处理 line: string\n}\n```\n\n# 交叉类型 (Intersection\
    \ Type)\n\n`extend` 是 JavaScript 中非常常见的模式，获取两个对象并创建一个具有这两个对象特征的新对象。交叉类型允许你以安全的方式使用这种模式，演示如下：\n\
