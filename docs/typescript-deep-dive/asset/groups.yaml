    \ `Number.MIN_VALUE` 的值会被限制为 0。\n\n# 未来的 JavaScript：现在\n\nTypeScript 的主要卖点之一是它允许你在当前的（ES3\
    \ 和 ES5 级别的）JavaScript 引擎（如当前的浏览器和 Node.js）中使用 ES6 及更高版本的特性。在这里深入探讨为什么这些特性有用，以及这些特性在\
    \ TypeScript 中是如何实现的。\n\n注意：并不是所有这些特性都计划立即添加到 JavaScript 中，但它们为你的代码组织和维护提供了巨大的实用性。另外注意，你可以自由忽略任何对你的项目没有意义的结构，尽管你最终会使用其中大部分的\
    \ ;)\n\n# 类 (Classes)\n\n在 JavaScript 中将类作为一等公民项之所以重要，是因为：\n\n- 1. 类提供了一种实用的结构抽象。\n\
    - 2. 为开发者提供了一种统一的方式来使用类，而不是让每个框架（emberjs, reactjs 等）都搞自己的版本。\n- 3. 面向对象的 JavaScript\
    \ 开发者已经熟悉类了。\n\n最后，JavaScript 开发者可以使用 `class`。这里我们有一个名为 `Point` 的基础类：\n\n```\n\
    class Point {\n  x: number;\n  y: number;\n  constructor(x: number, y: number)\
    \ {\n    this.x = x;\n    this.y = y;\n  }\n  add(point: Point) {\n    return\
    \ new Point(this.x + point.x, this.y + point.y);\n  }\n}\n\nvar p1 = new Point(0,\
    \ 10);\nvar p2 = new Point(10, 20);\nvar p3 = p1.add(p2); // {x:10,y:30}\n```\n\
    \n这个 `Point` 类在生成 ES5 输出时会生成以下 JavaScript：\n\n```\nvar Point = (function () {\n\
    \  function Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point.prototype.add\
