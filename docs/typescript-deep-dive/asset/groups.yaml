    \ // remove from object\nconsole.log(foo.bar); // 456\ndelete foo.__proto__.bar;\
    \ // remove from foo.__proto__\nconsole.log(foo.bar); // undefined\n```\n\nCool\
    \ so you understand __proto__. Another useful information is that all functions\
    \ in JavaScript has a property called prototype and that it has a member constructor\
    \ pointing to the function. This is shown below:\n\n```javascript\nfunction Foo()\
    \ {}\nconsole.log(Foo.prototype); // {} i.e it exists and is not undefined\nconsole.log(Foo.prototype.constructor\
    \ === Foo); // Has a member called 'constructor' pointing to the function\n```\n\
    \nNow let's look at effect of new on this inside the called function. Basically\
    \ this inside the function is going to point to the newly created object that\
    \ will be returned from the function. It's simple to see if you mutate a property\
    \ on inside the function:\n\n```javascript\nfunction Foo() {\n this.bar = 123;\n\
    }\n\n// call with the new operator\nvar newFoo = new Foo();\nconsole.log(newFoo.bar);\
    \ // 123\n```\n\nNow the only thing you need to know is that calling new on a\
    \ function assigns the prototype of the function to the __proto__ of the newly\
    \ created object that is returned from the function. Here is the code you can\
    \ run to completely understand it:\n\n```javascript\nfunction Foo() {}\nvar foo\
