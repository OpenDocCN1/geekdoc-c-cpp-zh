    \ Color {\n    DarkRed = 3,\n    DarkGreen,\n    DarkBlue\n}\n```\n\n请注意，在枚举的延续中，你应该重新初始化第一个成员（此处为\
    \ DarkRed = 3），以确保生成的代码不会覆盖上一个定义中的值（即 0, 1 ... 等值）。即使你不这样做，TypeScript 也会警告你（错误信息：In\
    \ an enum with multiple declarations, only one declaration can omit an initializer\
    \ for its first enum element）。\n\n## 作为标志位（Flags）的枚举\n\n枚举的一个极佳用途是将其作为标志位使用。标志位允许你检查一组条件中的特定条件是否为真。考虑以下示例，我们有一组关于动物的属性：\n\
    \n```typescript\nenum AnimalFlags {\n    None = 0,\n    HasClaws = 1 << 0,\n \
    \   CanFly = 1 << 1,\n    EatsFish = 1 << 2,\n    Endangered = 1 << 3\n}\n```\n\
    \n在这里，我们使用左移运算符将 1 在特定的位级别上移动，从而得到位不相交的数字 0001、0010、0100 和 1000（如果你感兴趣，这些对应的十进制数字为\
    \ 1, 2, 4, 8）。位运算符 |（或）/ &（与）/ ~（非）是你处理标志位时的最佳朋友，并在下方进行了演示：\n\n```typescript\n\
    enum AnimalFlags {\n    None = 0,\n    HasClaws = 1 << 0,\n    CanFly = 1 << 1,\n\
    }\n```\n\n```typescript\nfunction printAnimalAbilities(animal) {\n    var animalFlags\
    \ = animal.flags;\n    if (animalFlags & AnimalFlags.HasClaws) {\n        console.log('animal\
    \ has claws');\n    }\n    if (animalFlags & AnimalFlags.CanFly) {\n        console.log('animal\
    \ can fly');\n    }\n    if (animalFlags == AnimalFlags.None) {\n        console.log('nothing');\n\
    \    }\n}\n```\n\n```typescript\nvar animal = { flags: AnimalFlags.None };\nprintAnimalAbilities(animal);\
    \ // nothing\nanimal.flags |= AnimalFlags.HasClaws;\nprintAnimalAbilities(animal);\
    \ // has claws\nanimal.flags &= ~AnimalFlags.HasClaws;\nprintAnimalAbilities(animal);\
    \ // nothing\nanimal.flags |= AnimalFlags.HasClaws | AnimalFlags.CanFly;\nprintAnimalAbilities(animal);\
    \ // has claws, animal can fly\n```\n\n在这里：\n\n- 我们使用 `|=` 来添加标志位\n- 使用 `&= ~`\
    \ 的组合清除标志位\n- `|` 来组合标志位\n\n> 注意：你可以在枚举定义中组合标志位以创建方便的快捷方式，例如下面的 EndangeredFlyingClawedFishEating：\n\
    \n```typescript\nenum AnimalFlags {\n    None = 0,\n    HasClaws = 1 << 0,\n \
    \   CanFly = 1 << 1,\n    EatsFish = 1 << 2,\n    Endangered = 1 << 3,\n}\n\n\
    const EndangeredFlyingClawedFishEating = HasClaws | CanFly | EatsFish | Endangered;\n\
    ```\n\n## 常量枚举 (Const Enums)\n\n如果你有如下的枚举定义：\n\n```typescript\nenum Tristate {\n\
    \  False,\n  True,\n  Unknown\n}\n```\n\n```typescript\nvar lie = Tristate.False;\n\
    ```\n\n行 `var lie = Tristate.False` 被编译为 JavaScript 的 `var lie = Tristate.False`（输出，且与输入相同）。这意味着在运行时将需要查找\
    \ `Tristate` 然后是 `Tristate.False`。为了在此获得性能提升，你可以将枚举标记为 `const enum`。演示如下：\n\n\
    ```typescript\nconst enum Tristate {\n  False,\n  True,\n  Unknown\n}\n```\n\n\
    ```typescript\nvar lie = Tristate.False;\n```\n\n将生成 JavaScript：\n\n```javascript\n\
    var lie = 0;\n```\n\n即编译器：\n\n- 1. 内联对枚举的任何使用处（用 `0` 代替 `Tristate.False`）。\n-\
    \ 2. 不为枚举定义生成任何 JavaScript（运行时没有 `Tristate` 变量），因为其使用处已被内联。\n\n## 常量枚举保留常量数字 (preserveConstNums)\n\
    \n内联具有明显的性能优势。运行时不存在 `Tristate` 变量这一事实仅仅是编译器通过不生成运行时实际未使用的 JavaScript 来提供帮助。然而，你可能希望编译器仍然为枚举定义生成\
    \ JavaScript 版本，用于像我们看到的数字到字符串或字符串到数字的查找。在这种情况下，你可以使用编译器标志 `--preserveConstNums`，它将生成\
    \ `Tristate` 定义，这样如果你需要，就可以手动使用 `Tristate[\"\"]` 或 `Tristate[0]`。这不会产生任何方式内联。\n\
    \n## 带有静态函数的枚举\n\n你可以使用 `enum + namespace` 合并来为枚举添加静态方法。以下演示了我们如何为 `weekday` 枚举添加静态成员\
    \ `isBusinessDay`：\n\n```typescript\nenum Weekday {\nMonday,\nTuesday,\nWednesday,\n\
    Thursday,\nFriday,\nSaturday,\nSunday\n}\n\nnamespace Weekday {\n    export function\
    \ isBusinessDay(day: Weekday) {\n        switch (day) {\n            case Weekday.Saturday:\n\
    \            case Weekday.Sunday:\n                return false;\n           \
    \ default:\n                return true;\n        }\n    }\n}\n\nconst mon = Weekday.Monday;\n\
    const sun = Weekday.Sunday;\nconsole.log(Weekday.isBusinessDay(mon)); // true\n\
    console.log(Weekday.isBusinessDay(sun)); // false\n```\n\n"
