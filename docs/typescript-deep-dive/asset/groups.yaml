- md: "\nThe main difference is how the module is resolved on the file system.\n\n\
    > I will use a conceptual term place that I will explain after mentioning the\
    \ lookup pattern.\n\n## Relative modules\n\nEasy, just follow the relative path\
    \ :) e.g.\n\n- if file bar.ts does import * as from './foo'; then place foo must\
    \ exist in the same folder.\n- if bar.ts does import * as from '../foo'; then\
    \ place foo must exist in a folder up.\n- if bar.ts does import * as from '../someFolder/foo';\
    \ then one folder up.\n\nOr any other relative path you can think of :)\n\n##\
    \ Dynamic lookup\n\nWhen the import path is not relative, lookup is driven by\
    \ node style resolution. Here I only give a simple example:\n\n- You have import\
    \ * as from 'foo', the following are the places that are checked in order\n  -\
    \ ./node_modules/foo\n  - ../node_modules/foo\n  - ../../node_modules/foo\n  -\
    \ Till root of file system\n- You have import * as from 'something/foo', the following\
    \ are the places that are checked in order\n  - ./node_modules/something/foo\n\
    \  - ../node_modules/something/foo\n  - ../../node_modules/something/foo\n  -\
    \ Till root of file system\n\n## What is place\n\nWhen I say places that are checked\
    \ I mean that the following things are checked in place. e.g. for a place foo\
    \ :\n\n- If the place is a file, e.g. foo.ts, index.ts, hurray!\n- else if the\
    \ place is a folder and there is a file foo/index.ts, hurray!\n- else if the place\
    \ is a folder and there is `foo/package.json` and there is a file specified in\
    \ the `types` key in the package.json that exists, then hurry!\n- else if the\
    \ place is a folder and there a `package.json` and there is a file specified in\
    \ the `main` key in the package.json that exists, then hurry!\n\nBy file I actually\
    \ mean `.ts` / `.d.ts` and `.js`.\n\nAnd that's it. You are now module lookup\
    \ experts (not a small feat!).\n\n## Overturning dynamic lookup *just for types*\n\
    \nYou can declare a module *globally* for your project by using `declare module\
    \ 'somePath'` and imports will resolve *magically* to that path\n\ne.g.\n\n```typescript\n\
    // globals.d.ts\ndeclare module 'foo' {\n  // Some variable declarations\n  export\
    \ var bar: number; /*sample*/\n}\n```\n\nand then:\n\n```typescript\n// anyOtherTsFileInYourProject.ts\n\
    import * as foo from 'foo';\n// assumes (without doing any lookup) that\n// foo\
    \ is {bar:number}\n```\n\n## import/require for importing type only\n\nThe following\
    \ statement:\n\n```typescript\nimport foo = require('foo');\n```\n\nactually does\
    \ *two* things:\n\n- Imports the type information of the foo module.\n- Specifies\
    \ a runtime dependency on the foo module.\n\nYou can pick and choose so that only\
    \ the *type information* is loaded and no runtime dependency occurs. Before continuing\
    \ you might want to recap the *declaration spaces* section of the book\n\nyou\
    \ do not use the imported name in the variable declaration space then the import\
    \ is completely removed from the generated JavaScript. This is best explained\
    \ with examples. Once you understand this we will present you with use cases.\n\
    \n## Example 1\n\n```typescript\nimport foo = require('foo');\n```\n\nwill generate\
    \ the JavaScript:\n\n![](img/7b4ede152e837dfd4e13fc18de91d96a_102_0.png)\n\nThat's\
    \ right. An empty file as foo is not used.\n\n## Example 2\n\n```typescript\n\
    import foo = require('foo');\nvar bar: foo;\n```\n\nwill generate the JavaScript:\n\
    \n```javascript\nvar bar;\n```\n\nThis is because foo (or any of its properties\
    \ e.g. foo.bar) is never used as a variable.\n\n## Example 3\n\n```typescript\n\
    import foo = require('foo');\nvar bar = foo;\n```\n\nwill generate the JavaScript\
    \ (assuming commonjs):\n\n```javascript\nvar foo = require('foo');\nvar bar =\
    \ foo;\n```\n\nThis is because foo is used as a variable.\n\n## Use case: Lazy\
    \ loading\n\nType inference needs to be done upfront. This means that if you want\
    \ to use some type from a file foo you will have to do:\n\n```typescript\nimport\
    \ foo = require('foo');\nvar bar: foo.SomeType;\n```\n\nHowever you might want\
    \ to only load the file foo at runtime under certain conditions. For such cases\
    \ you should use the import only in type annotations and not as a variable. This\
    \ removes any upfront dependency coding being injected by TypeScript. Then manually\
    \ import the actual module using code that is specific to your module loader.\n\
    \nAs an example, consider the following commonjs based code where we only load\
    \ a module 'foo' on a certain function call:\n\n```typescript\nimport foo = require('foo');\n\
    \nexport function loadFoo() {\n  // This lazy loading `foo` and using the original\
    \ module \"only*\" as a type annotation\n  var _foo: typeof foo = require('foo');\n\
    \  // Now use `_foo` as a variable instead of `foo`.\n}\n```\n\nA similar sample\
    \ in amd (using requirejs) would be:\n\n```typescript\nimport foo = require('foo');\n\
    \nexport function loadFoo() {\n  // This lazy loading `foo` and using the original\
