    \ utility {\n  reverse<T>(items: T[]): T[] {\n    var toreturn = [];\n    for\
    \ (let i = items.length - 1; i >= 0; i--) {\n      toreturn.push(items[i]);\n\
    \    }\n    return toreturn;\n  }\n}\n```\n\n> TIP: You can call the generic parameter\
    \ whatever you want. It is conventional to use T, U, V when you have simple generics.\
    \ If you have more than one generic argument try to use meaningful names e.g.\
    \ TKey and TValue (conventional to prefix with T as generics are also called templates\
    \ in other languages e.g. C++).\n\n# Generics in TSX\n\nBecause .tsx /.jsx uses\
    \ syntax like <div> to denote JSX blocks it offers a few unique challenges for\
    \ Generics.\n\nQuick Tip: Use as Foo syntax for type assertions as we mentioned\
    \ before."
  - '[PAGE 182]


    # Generic functions


    Something like the following works fine:


    ```

    function foo<T>(x: T) { return x; }

    ```


    However using an arrow generic will not:


    ```

    const foo = <T>(x: T) => x; // ERROR : unclosed `T tag

    ```


    Workaround: Use extends on the generic parameter to hint the compiler that it''s
    generic, e.g.:


    ```

    const foo = <T extends {}>(x: T) => x;

    ```


    # Generic Components


    Since JSX doesn''t have a syntax for providing a generic parameter you need to
    specialize the component using a type assertion before creating it, e.g.:


    ```

    /* Generic component */

    type SelectProps<T> = { items: T[] }

    class Select<T> extends React.Component<SelectProps<T>, any> { }


    /* Specialization */

    interface StringSelect extends { new (): Select<string>; }

    const StringSelect = Select as StringSelect;


    /* Usage */

    const Form = () => <StringSelect items={[''a'', ''b'']}} />;

    ```


    # Useless Generic


    I''ve seen people use generics just for the heck of it. The question to ask is
    what constraint are you trying to describe. If you can''t answer it easily you
    probably have a useless generic E.g. people have attempted to type the Node.js
    require function as:


    ```

    declare function require<T>(name: string): T;

    ```


    In this case you can see that the T is only used in one place. So there is not
    constraint between members. You would be better off with a type assertion in this
    case:'
