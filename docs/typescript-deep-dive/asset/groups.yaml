    \nThe following example demonstrates iterator.throw(error) :\n\n```\nfunction*\
    \ generator() {\n  try {\n    yield 'foo';\n  } catch(err) {\n    console.log(err.message);\
    \ // bar!\n  }\n}\nvar iterator = generator();\n// Start execution till we get\
    \ first yield value\nvar foo = iterator.next();\nconsole.log(foo.value); // foo\n\
    // Resume execution throwing an exception 'bar'\nvar nextThing = iterator.throw(new\
    \ Error('bar'));\n```\n\nSo here is the summary:\n\n+   - yield allows a generator\
    \ function to pause its communication and pass control to an external system\n\
