    \ // 错误：number 无法赋值给 string\n\n如果你有一个期望传递的类成员函数，在开始处使用箭头函数，例如你可以这样写同一个 Adder 类：\n\
    \n```typescript\nclass Adder {\n  constructor(public a: string) {\n\n  // 这个函数现在可以安全地传递\n\
