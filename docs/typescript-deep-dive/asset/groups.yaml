  - "[PAGE 212]\n\nTypeScripts system is extremely powerful in that you can do supremely\
    \ powerful things in the language moving / slicing / dicing types in ways that\
    \ are not possible in any single language out there.\n\nThis is because TypeScript\
    \ is designed to allow you to work seamlessly with a **highly dynamic** language\
    \ like JavaScript. Here we cover a few tricks for moving types around in TypeScript.\n\
    \nKey motivation for these : You change one and everything else just updates automatically\
    \ and you get errors if something is going to break, like a well designed constraint\
    \ system.\n\n# Copying both the Type + Value\n\nIf you want to move a class around\
    \ you might be tempted to do the following:\n\n```\nclass Foo {\nvar Bar = Foo;\n\
    var bar: Bar; // ERROR: cannot find name 'Bar'\n```\n\nThis is an error because\
    \ `var` only copied the `Foo` into the `variable` declaration space and you therefore\
    \ cannot use `Bar` as a type annotation. The proper way is to use `import` keyword.\
    \ Note that you can only use the `import` keyword in such a way if you are using\
    \ `namespaces` or `modules` (or on these later):\n\n```\nnamespace importing {\n\
    \  export class Foo {}\n}\n\nimport Bar = importing.Foo;\nvar bar: Bar; // Okay\n\
    ```\n\nThis `import` trick only works for things that are **both type and a variable**.\n\
    \n# Capturing the type of a variable\n\nYou can actually use a variable in a type\
    \ annotation using the `typeof` operator. This allows you to tell the compiler\
    \ that one variable is the same type as another. Here is an example to demonstrate\
    \ this:"
  - "[PAGE 213]\n\nfoo = 123;\nbar = typeof foo; // `bar` has the same type as `foo`\
    \ (here `number`)\nbar = 456; // Okay\nbar = '789'; // ERROR: Type `string` is\
    \ not `assignable` to type `number`\n\n# Capturing the type of a class member\n\
    \nSimilar to capturing the type of a variable, you just declare a variable purely\
    \ for type capturing purposes:\n\n```\nclass Foo {\n  foo: number; // some whose\
    \ type we want to capture\n}\n\n// Purely to capture type\ndeclare let _foo: Foo;\n\
    \n// Same as before\nlet bar: typeof _foo.foo;\n```\n\n# Capturing the type of\
    \ the magic strings\n\nLots of JavaScript libraries and frameworks work off of\
    \ JavaScript strings. You can use const variables to capture their type e.g.\n\
    \n```\n// Capture both *type* and *value* of magic string:\nconst foo = \"Hello\
    \ World\";\n\n// Use the captured type:\nlet bar: typeof foo;\n\n// bar can only\
    \ ever be assigned to `Hello World`\nbar = \"Hello World\"; // Okay!\nbar = \"\
    anything else \"; // Error!\n```\n\nIn this example bar has the literal type \"\
    Hello World\". We cover this more in the literal type section.\n\n# Capturing\
    \ the name of the keys\n\nThe keyof operator lets you capture the key names of\
    \ a type. E.g. you can use it to capture the key names of a variable by first\
    \ grabbing its type using typeof :"
  - "[PAGE 214]\n\n```\nconst colors = {\n  red: 'red',\n  blue: 'blue'\n}\ntype Colors\
    \ = keyof typeof colors;\n\nlet color: Colors = 'red'; // okay\ncolor = 'blue';\
    \ // okay\ncolor = 'anythingElse'; // Error\n```\n\nThis allows you to have stuff\
    \ like string enums + constants quite easily, as you just saw in the above example."
  - "[PAGE 215]\n\n# Exception Handling\n\nJavaScript has an Error class that you\
    \ can use for exceptions. You throw an error with the throw keyword. You can catch\
    \ it with a try / catch block pair e.g.\n\n```\ntry {\n  throw new Error('Something\
    \ bad happened');\n}\ncatch(e) {\n  console.log(e);\n}\n```\n\n# Error Sub Types\n\
    \nBeyond the built in Error class there are a few additional built-in error classes\
    \ that inherit from Error that the JavaScript runtime can throw:\n\n# RangeError\n\
    \nCreates an instance representing an error that occurs when a numeric variable\
    \ or parameter is outside of its valid range.\n\n```\n// Call console with too\
    \ many arguments\nconsole.log.apply(console, new Array(1000000000)); // RangeError:\
    \ Invalid array length\n```\n\n# ReferenceError\n\nCreates an instance representing\
    \ an error that occurs when de-referencing an invalid reference. e.g.\n\n```\n\
    'use strict';\nconsole.log(notValidVar); // ReferenceError: notValidVar is not\
    \ defined\n```\n\n# SyntaxError\n\nCreates an instance representing a syntax error\
    \ that occurs while parsing code that isn't valid JavaScript."
  - "[PAGE 216]\n\n```\n***3; // SyntaxError: Unexpected token *\n```\n\n# TypeError\n\
    \nCreates an instance representing an error that occurs when a variable or parameter\
    \ is not of a valid type.\n\n```\n('1.2').toPrecision(1); // TypeError: '1.2'.toPrecision\
    \ is not a function\n```\n\n# URIError\n\nCreates an instance representing an\
    \ error that occurs when encodeURI() or decodeURI() are passed invalid parameters.\n\
    \n```\ndecodeURI('%'); // URIError: URI malformed\n```\n\n# Always use Error\n\
    \nBeginner JavaScript developers sometimes just throw raw strings e.g.\n\n```\n\
    try {\n  throw 'Something bad happened';\n}\ncatch(e) {\n  console.log(e);\n}\n\
    ```\n\nDon't do that. The fundamental benefit of Error objects is that they automatically\
    \ keep track of where they were built and originated as the stack property.\n\n\
    Raw strings result in a very painful debugging experience and complicate error\
    \ analysis from logs.\n\n# You don't have to throw an error\n\nIt is okay to pass\
    \ an Error object around. This is conventional in Node.js callback style code\
    \ which take callbacks with the first argument as an error object."
  - "[PAGE 217]\n\n```\nfunction myFunction(callback: (e?: Error)) {\n  doSomethingAsync(function\
    \ () {\n    if (somethingwrong) {\n      callback(new Error('This is my error'))\n\
    \    } else {\n      callback();\n    }\n  });\n}\n```\n\n# Exceptional cases\n\
    \nExceptions should be exceptional is a common saying in computer science. There\
    \ are a few reasons why this is true for JavaScript (and TypeScript) as well.\n\
    \n# Unclear where it is thrown\n\nConsider the following piece of code:\n\n```\n\
    try {\n  const foo = runTask1();\n  const bar = runTask2();\n}\ncatch(e) {\n \
    \ console.log('Error:', e);\n}\n```\n\nThe next developer cannot know which funtion\
    \ might throw the error. The person reviewing the code cannot know without reading\
    \ the code for task1 / task2 and other functions they might call etc.\n\n# Makes\
    \ graceful handling hard\n\nYou can try to make it graceful with explicit catch\
    \ around each thing that might throw:"
  - "[PAGE 218]\n\n```\ntry {\n  const foo = runTask1();\n}\ncatch(e) {\n  console.log('Error',\
    \ e);\n}\ntry {\n  const bar = runTask2();\n}\ncatch(e) {\n  console.log('Error',\
    \ e);\n}\n```\n\nBut now if you need to pass stuff from the first task to the\
    \ second one the code becomes messy:(notice foo mutation requiring let + explicit\
    \ need for annotating it because it cannot be inferred from the return of runTask1):\n\
    \n```\nlet foo: number; // Notice of 'let' and explicit type annotation\ntry {\n\
    \  foo = runTask1();\n}\ncatch(e) {\n  console.log('Error', e);\n}\ntry {\n  const\
    \ bar = runTask2(foo);\n}\ncatch(e) {\n  console.log('Error', e);\n}\n```\n\n\
    # Not well represented in the type system\n\nConsider the function:\n\n```\nfunction\
    \ validate(value: number) {\n  if (value < 0 || value > 100) throw new Error('Invalid\
    \ value');\n}\n```\n\nUsing Error for such cases is a bad idea as it is not represented\
    \ in the type definition for the validate function (which is (value:number) =>\
    \ void ). Instead a better way to create a validate method would be:"
  - "[PAGE 219]\n\n```\nfunction validate(value: number): {error?: string} {\n  if\
    \ (value < 0 || value > 100) return {error:'Invalid value'};\n}\n```\n\nAnd now\
    \ its represented in the type system.\n\n> Unless you want to handle the error\
    \ in a very generic (simple / catch-all etc) way, don't throw an error."
  - "[PAGE 220]\n\n# Mixins\n\nTypeScript (and JavaScript) classes support strict\
    \ single inheritance. So you cannot do:\n\n```\nclass User extends Tagged, Timestamped\
    \ { // ERROR : no multiple inheritance\n}\n```\n\nAnother way of building up classes\
    \ from reusable components is to build them by combining simpler partial classes\
    \ called mixins.\n\nThe idea is, instead of a class A extending class B to get\
    \ its functionality, function B takes class A and returns a new class with this\
    \ added functionality. Function B is a mixin.\n\n+   [A mixin is] a function\n\
    1. takes a constructor,\n2. creates a class that extends that constructor, with\
    \ new functionality\n3. returns the new class\n\nA complete example\n\n```\n//\
    \ Needed for all mixins\ntype Constructor<T> = () => new (...args: any[]) => T;\n\
    \n///////////////////////\n// Example mixins\n///////////////////////\n\n// A\
    \ mixin that adds a property\nfunction Timestamped<TBase> extends Constructor>(Base:\
    \ TBase) {\n  return class extends Base {\n    timestamp = Date.now();\n  };\n\
    }\n\n// a mixin that adds a property and methods\nfunction Activatable<TBase>\
    \ extends Constructor>(Base: TBase) {\n  return class extends Base {\n    isActive\
    \ = false;\n\n  activate() {\n    this.isActive = true;\n  }\n\n  deactivate()\
    \ {\n    this.isActive = false;\n  }\n  }\n```"
- md: "\n```typescript\n;\n}\n\n/////////////////////\n// Usage to compose classes\n\
    /////////////////////\n\n// Simple class\nclass User {\n  name = '';\n}\n\n//\
    \ User that is TimStamped\nconst TimStampedUser = TimStamped(User);\n\n// User\
    \ that is TimStamped and Activatable\nconst TimStampedActivatableUser = TimStamped(Activatable(User));\n\
    \n/////////////////////\n// Using the composed classes\n/////////////////////\n\
    \nconst timestampedUserExample = new TimStampedUser();\nconsole.log(timestampedUserExample.timestamp);\n\
    \nconst timestampedActivatableUserExample = new TimStampedActivatableUser();\n\
    console.log(timestampedActivatableUserExample.timestamp);\nconsole.log(timestampedActivatableUserExample.isActivated);\n\
    ```\n\nLet's decompose this example.\n\n# Take a constructor\n\nMixins take a\
    \ class and extend it with new functionality. So we need to define what is a constructor.\
    \ Easy as as:\n\n```typescript\n// Needed for all mixins\ntype Constructor<T =\
    \ {}> = new (...args: any[]) => T;\n```\n\n# Extend the class and return it\n\n\
    Pretty easy:\n\n```typescript\n// Mixin adds a property\nfunction TimestampsedTBase\
    \ extends Constructor<TBase>(Base: TBase) {\n  return class extends Base {\n \
    \   timestamp = Date.now();\n  }\n}\n```\n\nAnd that is it\n\n# JSX Support\n\n\
    TypeScript supports JSX transpilation and code analysis. If you are unfamiliar\
    \ with JSX here is an excerpt from the [official website](:\n\n> JSX is a XML-like\
    \ syntax extension to ECMAScript without any defined semantics. It's NOT intended\
    \ to be implemented by engines or browsers. It's NOT a proposal to incorporate\
    \ JSX into the ECMAScript spec itself. It's intended to be used by various preprocessors\
    \ (transpilers) to transform these tokens into standard ECMAScript.\n\nThe motivation\
    \ behind JSX is to allow users to write HTML views like *JavaScript* so that you\
    \ can:\n\n- Have the view Type Checked by the same code that is going to check\
    \ your JavaScript\n- Have the view Type Checked by the same code that is going\
    \ to operate under (i.e. strengthen the controller-view connection in traditional\
    \ MVC).\n- Reuse Javascript patterns for HTML maintenance e.g. `Array.prototype.map`,\
    \ `?`, `switch` etc instead of creating new (and probably poorly typed) alternatives.\n\
    \nThis decreases the chances of errors and increases the maintainability of your\
    \ user interfaces. The main consumer of JSX at this point is [ReactJS from facebook](.\
    \ This is the usage of JSX that we will discuss here.\n\n# Setup\n\nOur browserstart\
    \ already sets you up to develop react applications. Here are the key highlights:\n\
    \n- Use files with the extension .tsx (instead of .ts).\n- Use \"jsx\": \"react\"\
    \ in your tsconfig.json's compilerOptions\n- Install the definitions for JSX and\
    \ React into your project : (npm i -D @types/react @react-dom).\n- Import react\
    \ into your .tsx files (import * as React from \"react\")\n\n# HTML Tags vs. Components\n\
    \nReact can render either HTML tags (strings) or React components (classes). The\
    \ JavaScript emit for these elements is different (React.createElement('div')\
    \ vs. React.createElement(MyComponent)). The way this is determined is by the\
    \ case of the first letter. foo is treated as an HTML tag and Foo is treated as\
    \ a component.\n\n# Type Checking\n\n# HTML Tags\n\nAn HTML Tag foo is to be the\
    \ type JSX.IntrinsicElements.foo. These types are already defined for all the\
    \ major tags in a file react-jsx.d.ts which we had install as a part of the setup.\
    \ Here is a sample of the contents of the file:\n\n```typescript\ndeclare module\
    \ JSX {\n  interface IntrinsicElements {\n    a: React.HTMLAttributes;\n    abbr:\
    \ React.HTMLAttributes;\n    div: React.HTMLAttributes;\n    span: React.HTMLAttributes;\n\
    \n    // so on ...\n  }\n}\n```\n\n# Stateless Functional Components\n\nYou can\
    \ define stateless components simply with the React.SFC interface e.g.\n\n```typescript\n\
    interface Props {\n  foo: string;\n}\nconst MyComponent: React.SFC<Props> = (props)\
    \ => {\n  return <span{props.foo}</span>;\n}\n\n<MyComponent foo=\"bar\" />\n\
    ```\n\n# Stateful Components\n\nComponents are type checked based on the props\
    \ property of the component. This is modeled after how JSX is transformed i.e.\
    \ the attributes become the props of the component.\n\nTo create React Stateful\
    \ components you use ES6 classes. The react.d.ts file defines the React.Component<Props,State>\
    \ class which you should extend in your own class providing your own Props and\
    \ State interfaces. This is demonstrated below:\n\n```typescript\ninterface Props\
    \ {\n  foo: string;\n}\nclass MyComponent extends React.Component<Props, {}> {\n\
    \  render() {\n    return <span>{this.props.foo}</span>;\n  }\n}\n\n<MyComponent\
    \ foo=\"bar\" />\n```\n\n# React JSX Tip: Interface for renderable\n\nReact can\
    \ render a few things like JSX or string. There are all consolidated into the\
    \ type React.ReactNode so use it for when you want to accept renderables e.g.\n\
    \n```typescript\ninterface Props {\n  header: React.ReactNode;\n  body: React.ReactNode;\n\
    }\nclass MyComponent extends React.Component<Props, {}> {\n  render() {\n    return\
    \ <div>\n      {header}\n      {body}\n    </div>;\n  }\n}\n\n<MyComponent foo=\"\
    bar\" />\n```\n\n# React JSX Tip: Accept an instance of a Component\n\nThe React\
    \ type definitions provide React.ReactElement<T> to allow you to annotate the\
    \ result of a /> class component instantiation. e.g.\n\n```typescript\nclass MyAwesomeComponent\
    \ extends React.Component {\n  render() {\n    return <div>Hello</div>;\n  }\n\
    }\n\nconst foo: React.ReactElement<MyAwesomeComponent> = <MyAwesomeComponent />;\
    \ // Okay\nconst bar: React.ReactElement<MyAwesomeComponent> = <NotAwesomeComponent\
    \ />; // Error!\n```\n\n> Of course you can use this as a function argument annotation\
    \ and even React component prop member.\n\n# React JSX Tip: Generic components\n\
    \nThere's no syntax in JSXK to apply generic parameters to a generic component.\
    \ You must first store the generic class in a variable that removes any generic\
    \ parameters with concrete types. As an example we replace T with the concrete\
    \ string type:\n\n```typescript\n/* A generic component */\ntype Select<T> = {\
    \ items: T[] }\nclass Select<T> extends React.Component<Select<T>> {\n```\n"
