    By file I actually mean `.ts` / `.d.ts` and `.js`.\n\nAnd that's it. You are now\
    \ module lookup experts (not a small feat!).\n\n## Overturning dynamic lookup\
    \ *just for types*\n\nYou can declare a module *globally* for your project by\
    \ using `declare module 'somePath'` and imports will resolve *magically* to that\
    \ path\n\ne.g.\n\n```typescript\n// globals.d.ts\ndeclare module 'foo' {\n  //\
