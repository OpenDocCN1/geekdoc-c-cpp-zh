    ## Mutations are across all references\n\n```javascript\nvar foo = {};\nvar bar\
    \ = foo; // bar is a reference to the same object\n\nfoo.baz = 123;\nconsole.log(bar.baz);\
    \ // 123\n```\n\n## Equality is for references\n\n```javascript\nvar foo = {};\n\
    var bar = foo; // bar is a reference\nvar baz = {}; // baz is a \"new object\"\
    \ distinct from `foo`\n\nconsole.log(foo === bar); // true\nconsole.log(foo ===\
