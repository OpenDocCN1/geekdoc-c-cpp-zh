    \ 使用了在其他可选注解语言中流行的后置类型注解（例如 ActionScript 和 F#）。\n\n```typescript\nfoo: number\
    \ = 123;\n```\n\n因此，如果你做了错误的操作，编译器会报错，例如：\n\n```typescript\nfoo: number = '123';\
