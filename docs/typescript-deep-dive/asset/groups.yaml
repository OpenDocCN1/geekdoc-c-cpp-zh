- md: "\nRecursion is done by simply calling other emitFoo function from these functions\
    \ as needed e.g. from emitFunctionDeclaration :\n\n```typescript\nfunction emitFunctionDeclaration(node:\
    \ FunctionLikeDeclaration) {\n  if (nodeMissing(node.body)) {\n    return emitOnlyTripleSlashComments(node);\n\
    \  }\n\n  if (node.kind !== SyntaxKind.MethodDeclaration && node.kind !== SyntaxKind.MethodSignature)\
    \ {\n    // Methods will emit the comments as part of emitting method declaration\n\
    \    emitLeadingComments(node);\n  }\n  // For targeting below es6, emit functions-like\
    \ declaration including arrow functions using function keyword.\n  // When targeting\
    \ ES6, emit arrow natively in ES6 by omitting function keyword and using fat instead\n\
    \  if (!shouldEmitAsArrowFunction(node)) {\n    if (isES6ExportedDeclaration(node))\
    \ {\n      write(\"export \");\n      if (node.flags & NodeFlags.Default) {\n\
    \        write(\"default \");\n      }\n    }\n    write(\"function\");\n    if\
    \ (languageVersion >= ScriptTarget.ES6 && node.asteriskToken) {\n      write(\"\
    *\");\n    }\n    write(\" \");\n  }\n\n  if (shouldEmitFunctionName(node)) {\n\
    \    emitDeclarationName(node);\n  }\n\n  emitSignatureAndBody(node);\n  if (languageVersion\
    \ < ScriptTarget.ES6 && node.kind === SyntaxKind.FunctionDeclaration && node.parent\
    \ === currentSourceFile) {\n    emitExportAssignments(node.name);\n  }\n  if (node.kind\
    \ !== SyntaxKind.MethodDeclaration && node.kind !== SyntaxKind.MethodSignature)\
    \ {\n    emitTrailingComments(node);\n  }\n}\n```\n\n## Emitter SourceMaps\n\n\
    We said that the bulk of emitter.ts is the local function emitJavaScript (routine\
    \ of this function before). It basically sets up a bunch of locals off emitSourceFile.\
    \ The following is revisiting the function, this time focusing on SourceMap stuff:\n\
    \n```typescript\nfunction emitJavaScript(filePath: string, root?: SourceFile)\
    \ {\n  let writeComment = writeCommentRange;\n\n  /** Written output to disk */\n\
    \  let writeEmittedFiles = writeJavaScriptFile;\n\n  /** Emit a node */\n  let\
    \ emit = emitNodeWithoutSourceMap;\n\n  /** Called before starting emit of a node\
    \ */\n  let emitStart = function(node: Node) {};\n\n  /** Called once emit of\
    \ the node is done */\n  let emitEnd = function(node: Node) {};\n\n  /** Emit\
    \ the text for the given token that comes after start\n   * By default we write\
    \ the text with the given token\n   * if optional emitFn is provided the text\
    \ is emitted instead of default text\n   * @param tokenKind the kind of token\
    \ to search and emit\n   * @param startPos the position in the source to start\
    \ searching for the token\n   * @param emitFn if invoked to emit the text instead\
    \ of actual token */\n  let emitToken = emitText;\n\n  /** Called before leaving\
    \ the lexical scopes in function/class because\n   * @param scopeDeclaration node\
    \ that starts the lexical scope\n   * @param scopeName Optional name of this scope\
    \ deducing one from declaration node */\n  let scopeEmitStart = function(scopeDeclaration:\
    \ Node, scopeName?: string) {};\n\n  /** Called after coming out of the scope\
    \ */\n  let scopeEmitEnd = function() {};\n\n  /** Sourcemap that will get encoded\
    \ */\n  let sourceMapData: SourceMapData;\n\n  if (compilerOptions.sourceMap ||\
    \ compilerOptions.inlineSourceMap) {\n    initializeEmitterSourceMaps();\n   \
    \ if (root) {\n      // Do not emit directly. It does not set the currentSourceFile.\n\
    \      emitSourceFile(root);\n    } else {\n      forEach(host.getSourceFiles(),\
    \ sourceFile => {\n        if (!isExternalModuleOrDeclarationFile(sourceFile))\
    \ {\n          emitSourceFile(sourceFile);\n        }\n      });\n    }\n    writeLine();\n\
    \    writeEmittedFiles(writer.getText(), /*writeByteOrderMark*/ compilerOptions.emitBOM);\n\
    \  }\n  return;\n}\n```\n\nThe important function call here: initializeEmitterSourceMaps\
    \ which is a local function to emitJavaScript overrides some locals that were\
    \ defined here. At the bottom of initializeEmitterSourceMaps you will notice the\
    \ overriding:\n\n// end of initializeEmitterSourceMaps\n\nwriteEmittedFiles =\
    \ writeJavaScriptAndNodeFile;\nemit = emitNodeWithSourceMap;\nemitStart = recordNodeStartSpan;\n\
    emitEnd = recordNodeEndSpan;\nemitToken = writeTextSpan;\nscopeEmitStart = recordScopeNameOfNode;\n\
    scopeEmitEnd = recordScopeNameEnd;\nwriteComment = writeCommentRangeWith;\n\n\
    This means that the bulk of emitter code cannot SourceMap and just use these local\
    \ functions the same way with or without SourceMaps.\n\n## Contributing\n\nTypeScript\
    \ is OSS and on GitHub and the team welcomes community input.\n\n## Setup\n\n\
    Super easy:\n\n```\ngit clone https://github.com/Microsoft/TypeScript.git\ncd\
    \ TypeScript\nnpm install -g jake\nnpm install\n```\n\n## Setup Fork\n\nYou would\
    \ obviously need to setup Microsoft/TypeScript as an upstream remote and your\
    \ own fork (use the GitHub fork button) as origin:\n\n```\ngit remote rm origin\n\
    git remote rm upstream\ngit remote add upstream https://github.com/Microsoft/TypeScript.git\n\
    git remote add origin https://github.com/basarat/TypeScript.git\n```\n\nAdditionally\
    \ I like to work off branches like bas/ to have it up cleaner in the branch listings.\n\
    \n## Running Tests\n\nThere are lots of test and build options in their JakeFile.\
    \ You can run all tests with jake runtests\n\n## Baselines\n\nBaselines are used\
    \ to manage if there are any changes in the expected output of the TypeScript\
    \ compiler. Baselines are located in tests/baselines.\n\n- Reference (expected)\
    \ baselines: tests/baselines/reference\n- Generated (in this test run) baselines:\
    \ tests/baselines/local (this folder is in .gitignore)\n\nIf there are any differences\
    \ between these folders will fail. You can diff the two folders with tools like\
    \ BeyondCompare or KDiff3.\n\nIf you think these changes in generated files are\
    \ valid then accept baselines using `jake baseline-accept`. The changes to `reference`\
    \ baselines will now show as a git diff if you can commit.\n\nNote that if you\
    \ don't run all tests then use `jake baseline-accept[soft]` which will only copy\
    \ over the new files and not delete the whole `reference` directory.\n\n## Test\
    \ Categories\n\nThere are different categories for different scenarios and even\
    \ different test infrastructures. Here are a few of these explained.\n\n## Compiler\
    \ Tests\n\nEnsure that compiling a file:\n\n- generates errors as expected\n-\
    \ generated JS as expected\n- types are identified as expected\n- symbols are\
    \ identified as expected\n\nThese expectations are validated using the baselines\
    \ infrastructure.\n\n## Creating a Compiler Test\n\nTest can be created by adding\
    \ a new file `yourest.ts` to `tests/cases/compiler`. As soon as you do so and\
    \ run the tests you should get baseline failure. Accept these baselines (to get\
    \ them to show up in git), and tweak them to be what you expect them to be a now\
    \ get the tests to pass.\n\nRun all of these in isolation using `jake runtests\
    \ tests=compiler`, or just your new file using `jake runtests tests=compiler/yourtest`\n\
    \nI will even often do `jake runtests tests=compiler/yourtest || jake baseline-accept[soft]`\
    \ and get the diff in `git`.\n\n## Debugging Tests\n\n`jake runtests-browser tests=schemaNameOfTest`\
    \ and debugging in-browser usually works pretty well.\n\n## More\n\nAn article\
    \ by Remo: https://dev.to/remojansen/learn-how-to-contribute-to-the-typescript-compiler-on-github-through-a-real-world-example-4df0\n"
