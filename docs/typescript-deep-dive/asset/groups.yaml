    leadingCommentRanges for the function will only return the last 2 comments bye
    and /*hi*/.


    Appropriately, calling getTrailingCommentRanges on the end of the debugger statement
    will extract the /*hello*/ comment.


    # Token Start/Full Start


    Nodes have what is called a "token start" and a "full start".


    +   - Token Start: the more natural version, which is the position in file where
    the text of a token begins


    +   - Full Start: the point at which the scanner began scanning since the last
    significant token


    AST nodes have an API for getStart and getStart . In the following example:


    ```

    debugger;/*hello*/

    //bye

    /*hi*/    function

    ```


    for function the token start is at function whereas full start is at /*hello*/
    . Note that full start even includes the trivia that would otherwise be owned
    by the previous node.'
