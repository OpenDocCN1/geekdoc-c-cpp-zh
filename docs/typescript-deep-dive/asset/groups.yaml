    \ getState }.\nlet store = createStore(counter)\n\n// You can use subscribe to\
    \ update the UI in response to state changes.\n// Normally you'd use a view binding\
    \ library (e.g. React Redux) rather than subscribe(\n).\n// However it can also\
    \ be handy to persist the current state in the localStorage.\n\nstore.subscribe(()\
    \ => {\n  console.log(store.getState())\n})\n// The only way to mutate the internal\
    \ state is to dispatch an action.\n// The actions can be serialized, logged or\
    \ stored and later replayed.\nstore.dispatch({ type: 'INCREMENT' })\n// 1\nstore.dispatch({\
    \ type: 'INCREMENT' })\n// 2\nstore.dispatch({ type: 'DECREMENT' })\n// 1\n```\n\
    \nUsing it with TypeScript gives you safety against typo errors, increased refactor-ability\
    \ and self documenting code."
  - "[PAGE 206]\n\n# Index Signatures\n\nAn object in JavaScript (and hence TypeScript)\
    \ can be accessed with a string to hold a reference to any other JavaScript object.\n\
    \nHere is a quick example:\n\n```\nlet foo:any = {};nfoo['Hello'] = 'World';\n\
    console.log(foo['Hello']); // World\n```\n\nWe store a string \"World\" under\
    \ the key \"Hello\". Remember we said can store any JavaScript object, so lets\
    \ store a class instance just to show the concept:\n\n```\nclass Foo {\n  constructor(public\
    \ message: string){}\n  log() {\n    console.log(this.message)\n  }\n}\n```\n\n\
    ```\nlet foo:any = {};nfoo['Hello'] = new Foo('World');\nfoo['Hello'].log(); //\
    \ World\n```\n\nAlso remember that we said that it can be accessed with a string.\
    \ If you pass some other object to the index signature the JavaScript runtime\
    \ actually calls .toString on it before getting the result. This is demonstrated\
    \ below:\n\n```\nlet obj = {\nttoString() {\n  console.log('toString called')\n\
    \  return 'Hello'\n}\n}\n```\n\n```\nlet foo:any = {};nfoo[obj] = 'World';\nconsole.log(foo[obj]);\
    \ // toString called\nconsole.log(foo['Hello']); // World\n```\n\nNote that toString\
    \ will get called whenever the obj is used in an index position."
  - "[PAGE 207]\n\nArrays are slightly different. For number indexing JavaScript VMs\
    \ will try to optimise\ndending on how it is like an array and the structures\
    \ of items stored match\netc.) So number should be considered as a valid object\
    \ in its own right (distinct\nfrom string ). Here is a simple array accessor example:\n\
    \n```\nlet foo = ['World'];\nconsole.log(foo[0]); // World\n```\n\nSo that's JavaScript.\
    \ Now let's look at TypeScript graceful handling of this concept.\n\n# TypeScript\
    \ Index Signature\n\nFirst off, because JavaScript implicitly calls toString on\
    \ any object index signature,\nTypeScript will give you an error to prevent beginners\
    \ from shooting themselves in the foot (\nsee seeing users themselves in their\
    \ feet when using JavaScript all the time on\nstackoverflow:\n\n```\nlet obj =\
    \ {\ntost(){\n  return 'Hello'\n}\n}\nlet foo:any = {};\n\n// ERROR: the index\
    \ signature must be string, number ...\nfoo[obj] = 'World';\n\n// FIX: TypeScript\
    \ forces you to be explicit\nfoo[obj].toString() = 'World';\n```\n\nThe reason\
    \ for forcing the user to be explicit is because the default toString\nimplementation\
    \ on an object is pretty awful, e.g. on v8 it always returns [object Object] :\n\
    \n```\nlet obj = {message:'Hello'}\nlet foo:any = {};\n\n// ERROR: the index signature\
    \ must be string, number ...\nfoo[obj] = 'World';\n\n// Here is what you actually\
    \ stored!\nconsole.log(foo[\"object Object\\ // World\n```\n\nOf course number\
    \ is supported because"
  - "[PAGE 208]\n\n1. its needed for excellent Array / Tuple support.\n2. even if\
    \ you use it for an obj default toString implementation is nice (not [object]\
    \ ).\n\nPoint 2 is shown below:\n\n```\nconsole.log((1).toString()); // 1\nconsole.log((2).toString());\
    \ // 2\n```\n\nSo lesson 1:\n\n> TypeScript index signatures must be either string\
    \ Or number\n\nQuick note: symbols are also valid and supported by TypeScript.\
    \ But let's not go there just yet. Baby steps.\n\n# Declaring an index signature\n\
    \nWe've been using any to tell TypeScript to let us whatever we want. We can actually\
    \ specify an index signature explicitly. E.g. say you want to make sure than anything\
    \ that is stored in an object using a string conforms to the structure {message:\
    \ string}. This can be done with the declaration { [index:string]: {message: string}\
    \ }. This is demonstrated below:\n\n```\nlet foo:{index:string}: {message: string}}\
    \ = {};\n\n/**\n* Must store stuff that conforms the structure\n */\n/** Ok */\n\
    foo['a'] = { message: 'some message' };\n/** Error: must contain a 'message' or\
    \ type string. You have a typo in 'message' */\nfoo['a'] = { messages: 'some message'\
    \ };\n\n/**\n* Stuff that is read is also type checked\n */\n/** Ok */\nfoo['a'].message;\n\
    /** Error: messages does not exist. You have a typo in 'message' */\nfoo['a'].messages;\n\
    ```"
  - "[PAGE 209]\n\nTIP: the name of the index signature e.g. index in {[index:string]:\
    \ {message: string}} has no significance in TypeScript and really for readability.\
    \ e.g. if its user names can do {[username:string]: {message: string}} to help\
    \ the next dev who looks at the code (which just might happen to be you).\n\n\
    Of course number indexes are also supported e.g. {count: number}: SomeOtherTypeYouWantToStoreRebate\n\
    \n# # All members must conform to the string signature\n\nAs soon as you have\
    \ a string index signature, all explicit members must also conform to that index\
    \ signature. This is shown below:\n\n```\n/** Okay */\ninterface Foo {\n  [key:string]:\
    \ number\n  x: number;\n  y: number;\n}\n/** Error */\ninterface Bar {\n  [key:string]:\
    \ number\n  x: number;\n  y: string; // Property `y` must of type number\n}\n\
    ```\n\nThis is to provide safety so that any index access gives the same result:\n\
    \n```\ninterface Foo {\n  [key:string]: number\n  x: number;\n}\nlet foo: Foo\
    \ = {x:1,y:2};\n\n// Directly\nfoo['x']; // number\n\n// Indirectly\nlet x = 'x'\n\
    foo[x]; // number\n```\n\n# # Using a limited set of string signature\n\nAn index\
    \ signature can require that index strings be members of a union of literal strings\
    \ by using Mapped Types e.g.:"
  - "[PAGE 210]\n\n```\ntype Index = 'a' | 'b' | 'c'\ntype FromIndex = { k in Index\
    \ }: number\nconst good: FromIndex = {b:1, c:2}\n\n// Error:\n// Type '{ b: number;\
    \ c: number; d: number; } is not assignable to type 'FromIndex'\n// Object literal\
    \ may only specify known properties, and 'd' does not exist in type 'FromIndex'\n\
    const bad: FromIndex = {b:1, c:2, d:3};\n```\n\nThis is often used with keyof\
    \ typeof to capture vocabulary types, described on the next page.\n\nThe specification\
    \ of the vocabulary can be deferred generically:\n\n```\ntype FromSomeIndex<K\
    \ extends string> = { key in K }: number\n```\n\n# Having both string number indexers\n\
    \nThis is not a common use case, but TypeScript compiler supports it nonetheless.\n\
    \nHowever it has the restriction that the string indexer is more strict than the\
    \ number indexer. This is intentional to allow typing stuff like:\n\n```\ninterface\
    \ ArrStr {\n  [key: string]: string | number; // Must accomod all members\n\n\
    \  [index: number]: string; // Can be a subset of string indexer\n\n  // Just\
    \ an example member\n  length: number;\n}\n```\n\n# Design Pattern: Nested index\
    \ signature\n\nAPI consideration when adding index signatures\n\nQuite commonly\
    \ in the JS community you will see APIs that abuse string indexers. e.g. a common\
    \ pattern among CSS in JS libraries:"
  - "[PAGE 211]\n\n```\ninterface NestedCSS {\n  color?: string;\n  [selector: string]:\
    \ string | NestedCSS;\n}\n\nconst example: NestedCSS = {\n  color: 'red',\n  .subclass':\
    \ {\n    color: 'blue'\n  }\n}\n```\n\nTry not to mix string indexers with valid\
    \ values this way. E.g. a typo in the padding remain uncaught\n\n```\nconst failsSilently:\
    \ NestedCSS = {\n  colour: 'red', // No error as `colour` is a valid string\n\
    }\n```\n\nInstead seperate out the nesting into its own property e.g. in a name\
    \ like nest (or children or subnodes etc.):\n\n```\ninterface NestedCSS {\n  color?:\
    \ string;\n  nest?: {\n    [selector: string]: NestedCSS;\n  }\n}\n\nconst example:\
    \ NestedCSS = {\n  color: 'red',\n  nest: {\n    '.subclass': {\n      color:\
    \ 'blue'\n    }\n  }\n}\n\nconst failsSilently: NestedCSS = {\n  colour: 'red',\
    \ // TS Error: unknown property `colour`\n}\n```"
- md: "\nTypeScript system is extremely powerful in that you can do supremely powerful\
    \ things in the language moving / slicing / dicing types in ways that are not\
    \ possible in any single language out there.\n\nThis is because TypeScript is\
    \ designed to allow you to work seamlessly with a **highly dynamic** language\
    \ like JavaScript. Here we cover a few tricks for moving types around in TypeScript.\n\
    \nKey motivation for these: You change one and everything else just updates automatically\
    \ and you get errors if something is going to break, like a well-designed constraint\
    \ system.\n\n## Copying both the Type + Value\n\nIf you want to move a class around\
    \ you might be tempted to do the following:\n\n```\nclass Foo {\n  var Bar = Foo;\n\
    \  var bar: Bar; // ERROR: cannot find name 'Bar'\n}\n```\n\nThis is an error\
    \ because `var` only copied the `Foo` into the `variable` declaration space and\
    \ you therefore cannot use `Bar` as a type annotation. The proper way is to use\
    \ `import` keyword. Note that you can only use the `import` keyword in such a\
    \ way if you are using `namespaces` or `modules` (or on these later):\n\n```\n\
    namespace importing {\n  export class Foo {}\n}\n\nimport Bar = importing.Foo;\n\
    var bar: Bar; // Okay\n```\n\nThis `import` trick only works for things that are\
    \ **both type and a variable**.\n\n## Capturing the type of a variable\n\nYou\
    \ can actually use a variable in a type annotation using the `typeof` operator.\
    \ This allows you to tell the compiler that one variable is the same type as another.\
    \ Here is an example to demonstrate this:\n\n```\nfoo = 123;\nbar = typeof foo;\
    \ // `bar` has the same type as `foo` (here `number`)\nbar = 456; // Okay\nbar\
    \ = '789'; // ERROR: Type `string` is not `assignable` to type `number`\n```\n\
    \n## Capturing the type of a class member\n\nSimilar to capturing the type of\
    \ a variable, you just declare a variable purely for type capturing purposes:\n\
    \n```\nclass Foo {\n  foo: number; // some whose type we want to capture\n}\n\n\
    // Purely to capture type\ndeclare let _foo: Foo;\n\n// Same as before\nlet bar:\
    \ typeof _foo.foo;\n```\n\n## Capturing the type of the magic strings\n\nLots\
    \ of JavaScript libraries and frameworks work off of JavaScript strings. You can\
    \ use const variables to capture their type e.g.\n\n```\n// Capture both *type*\
    \ and *value* of magic string:\nconst foo = \"Hello World\";\n\n// Use the captured\
    \ type:\nlet bar: typeof foo;\n\n// bar can only ever be assigned to `Hello World`\n\
    bar = \"Hello World\"; // Okay!\nbar = \"anything else \"; // Error!\n```\n\n\
    In this example bar has the literal type \"Hello World\". We cover this more in\
    \ the literal type section.\n\n## Capturing the name of the keys\n\nThe keyof\
    \ operator lets you capture the key names of a type. E.g. you can use it to capture\
    \ the key names of a variable by first grabbing its type using typeof :\n\n```\n\
    const colors = {\n  red: 'red',\n  blue: 'blue'\n}\ntype Colors = keyof typeof\
    \ colors;\n\nlet color: Colors = 'red'; // okay\ncolor = 'blue'; // okay\ncolor\
    \ = 'anythingElse'; // Error\n```\n\nThis allows you to have stuff like string\
    \ enums + constants quite easily, as you just saw in the above example.\n\n##\
    \ Exception Handling\n\nJavaScript has an Error class that you can use for exceptions.\
    \ You throw an error with the throw keyword. You can catch it with a try / catch\
    \ block pair e.g.\n\n```\ntry {\n  throw new Error('Something bad happened');\n\
    }\ncatch(e) {\n  console.log(e);\n}\n```\n\n## Error Sub Types\n\nBeyond the built-in\
    \ Error class there are a few additional built-in error classes that inherit from\
    \ Error that the JavaScript runtime can throw:\n\n### RangeError\n\nCreates an\
    \ instance representing an error that occurs when a numeric variable or parameter\
    \ is outside of its valid range.\n\n```\n// Call console with too many arguments\n\
    console.log.apply(console, new Array(1000000000)); // RangeError: Invalid array\
    \ length\n```\n\n### ReferenceError\n\nCreates an instance representing an error\
    \ that occurs when de-referencing an invalid reference. e.g.\n\n```javascript\n\
    'use strict';\nconsole.log(notValidVar); // ReferenceError: notValidVar is not\
    \ defined\n```\n\n### SyntaxError\n\nCreates an instance representing a syntax\
    \ error that occurs while parsing code that isn't valid JavaScript.\n\n```javascript\n\
    ***3; // SyntaxError: Unexpected token *\n```\n\n### TypeError\n\nCreates an instance\
    \ representing an error that occurs when a variable or parameter is not of a valid\
    \ type.\n\n```javascript\n('1.2').toPrecision(1); // TypeError: '1.2'.toPrecision\
    \ is not a function\n```\n\n### URIError\n\nCreates an instance representing an\
    \ error that occurs when encodeURI() or decodeURI() are passed invalid parameters.\n\
    \n```\ndecodeURI('%'); // URIError: URI malformed\n```\n\n## Always use Error\n\
    \nBeginner JavaScript developers sometimes just throw raw strings e.g.\n\n```javascript\n\
    try {\n  throw 'Something bad happened';\n}\ncatch(e) {\n  console.log(e);\n}\n\
    ```\n\nDon't do that. The fundamental benefit of Error objects is that they automatically\
    \ keep track of where they were built and originated as the stack property.\n\n\
    Raw strings result in a very painful debugging experience and complicate error\
    \ analysis.\n\n## Better to return objects\n\nUsing Error for such cases is a\
    \ bad idea as it is not represented in the type system.\n\n```javascript\nfunction\
    \ validate(value: number) {\n  if (value < 0 || value > 100) throw new Error('Invalid\
    \ value');\n}\n```\n\nInstead a better way to create a validate would be:\n\n\
    ```javascript\nfunction validate(value: number): {error?: string} {\n  if (value\
    \ < 0 || value > 100) return {error:'Invalid value'};\n}\n```\n\nAnd now its represented\
    \ in the type system.\n\n> Unless you want to handle the error in a very generic\
    \ (simple / catch-all) way, don't throw an error.\n\n## Mixins\n\nTypeScript (and\
    \ JavaScript) classes support strict single inheritance. So you cannot do:\n\n\
    ```\nclass User extends Tagged, Timestamped { // ERROR : no multiple inheritance\n\
    }\n```\n\nAnother way of building up classes from reusable components is to build\
    \ them by combining simpler classes called mixins.\n\nThe idea is, instead of\
    \ a class A extending class B to get its functionality, function B takes class\
    \ A and returns a new class with this added functionality. Function B is a mixin.\n\
    \n- [A mixin is] a function\n1. takes a constructor,\n2. creates a class that\
    \ extends that constructor, with new functionality\n3. returns the new class\n\
    \nA complete example\n\n```typescript\n// Needed for all mixins\ntype Constructor<T>\
    \ = () => new (...args: any[]) => T;\n\n///////////////////////\n// Example mixins\n\
    ///////////////////////\n\n// A mixin that adds a property\nfunction Timestamped<TBase>\
    \ extends Constructor>(Base: TBase) {\n  return class extends Base {\n    timestamp\
    \ = Date.now();\n  };\n}\n\n// a mixin that adds a property and methods\nfunction\
    \ Activatable<TBase> extends Constructor>(Base: TBase) {\n  return class extends\
    \ Base {\n    isActive = false;\n\n  activate() {\n    this.isActive = true;\n\
    \  }\n\n  deactivate() {\n    this.isActive = false;\n  }\n  }\n}\n```\n"
  mdcn: "\nTypeScript 系统极其强大，因为你可以在该语言中实现非常强大的操作，对类型进行移动/切片/细分，这些操作在现有的任何单一语言中都是无法实现的。\n\
    \n这是因为 TypeScript 的设计初衷是允许你与 JavaScript 这种**高度动态**的语言无无缝工作。在这里我们将介绍几个在 TypeScript\
    \ 中移动类型的技巧。\n\n这些技巧的核心动力是：你只需要修改其中一个地方，其他地方就会自动更新；如果某些地方会崩溃，它会报错，就像设计良好的约束系统一样。\n\
    \n## 同时复制类型 + 值\n\n如果你想移动一个类，你可能会尝试这样做：\n\n```\nclass Foo {\n  var Bar = Foo;\n\
    \  var bar: Bar; // 错误：无法找到名称 'Bar'\n}\n```\n\n这是一个错误，因为 `var` 只将 `Foo` 复制到了变量声明空间中，因此你无法将\
    \ `Bar` 作为类型注解。正确的方法是使用 `import` 关键字。注意，只有在你在使用命名空间（namespaces）或模块（modules）（或后续版本）时，你才能以这种方式使用\
    \ `import` 关键字：\n\n```\nnamespace importing {\n  export class Foo {}\n}\n\nimport\
    \ Bar = importing.Foo;\nvar bar: Bar; // 正常\n```\n\n这个 `import` 技巧适用于**既是类型又是变量**的对象。\n\
    \n## 捕捉变量的类型\n\n你实际上可以使用 `typeof` 运算符在类型注解中使用变量。这允许你告诉编译器一个变量与另一个变量类型相同。这是一个演示此点的示例：\n\
    \n```\nfoo = 123;\nbar = typeof foo; // `bar` 的类型与 `foo` 相同（这里是 `number`）\nbar\
    \ = 456; // 正常\nbar = '789'; // 错误：类型 `string` 不可分配给 `number`\n```\n\n## 捕捉类成员的类型\n\
    \n与捕捉变量类型类似，你只需要纯粹为了类型捕捉声明一个变量：\n\n```\nclass Foo {\n  foo: number; // 我们想要捕捉类型的属性\n\
    }\n\n// 仅用于捕捉类型\ndeclare let _foo: Foo;\n\n// 与之前相同\nlet bar: typeof _foo.foo;\n\
    ```\n\n## 捕捉魔术字符串的类型\n\n许多 JavaScript 库和框架基于 JavaScript 字符串工作。你可以使用常量变量来捕捉它们的类型，例如：\n\
    \n```\n// 同时捕捉魔术字符串的*类型*和*值*：\nconst foo = \"Hello World\";\n\n// 使用捕捉到的类型：\n\
    let bar: typeof foo;\n\n// bar 只能赋值为 `Hello World`\nbar = \"Hello World\"; //\
    \ 正常！\nbar = \"anything else \"; // 错误！\n```\n\n在这个示例中，bar 具有字面量类型 \"Hello World\"\
    。我们将在字面量类型部分详细讨论这一点。\n\n## 捕捉键的名字\n\n`keyof` 操作符允许你捕捉类型的键名。例如，你可以通过先使用 `typeof`\
    \ 获取其类型，来捕捉变量的键名：\n\n```\nconst colors = {\n  red: 'red',\n  blue: 'blue'\n}\n\
    type Colors = keyof typeof colors;\n\nlet color: Colors = 'red'; // 正常\ncolor\
    \ = 'blue'; // 正常\ncolor = 'anythingElse'; // 错误\n```\n\n正如你在上面的示例所示，这允许你轻松地拥有字符串枚举\
    \ + 常量这样的功能。\n\n## 异常处理\n\nJavaScript 有一个 `Error` 类可以用于异常。你使用 `throw` 关键字抛出错误。你可以使用\
    \ `try / catch` 语句对来捕获它，例如：\n\n```\ntry {\n  throw new Error('Something bad happened');\n\
    }\ncatch(e) {\n  console.log(e);\n}\n```\n\n## 错误子类型\n\n除了内置的 `Error` 类，还有几个继承自\
    \ `Error` 的内置错误类，JavaScript 运行时可以抛出它们：\n\n### RangeError\n\n创建一个实例，表示当数值变量或参数超出其有效范围时发生的错误。\n\
    \n```\n//为 console 传递过多的参数\nconsole.log.apply(console, new Array(1000000000));\
    \ // RangeError: Invalid array length\n```\n\n### ReferenceError\n\n创建一个实例，表示在解引用一个无效引用时发生的错误。例如：\n\
    \n```javascript\n'use strict';\nconsole.log(notValidVar); // ReferenceError: notValidVar\
    \ is not defined\n```\n\n### SyntaxError\n\n创建一个实例，表示在解析无效有效 JavaScript 代码时发生的语法错误。\n\
    \n```javascript\n***3; // SyntaxError: Unexpected token *\n```\n\n### TypeError\n\
    \n创建一个实例，表示当变量或参数不是有效类型时发生的错误。\n\n```javascript\n('1.2').toPrecision(1); // TypeError:\
    \ '1.2'.toPrecision is not a function\n```\n\n### URIError\n\n创建一个实例，表示当向 `encodeURI()`\
    \ 或 `decodeURI()` 传递无效参数时发生的错误。\n\n```\ndecodeURI('%'); // URIError: malformed\n\
    ```\n\n## 始终使用 Error\n\n初级 JavaScript 开发者有时只抛出原始字符串，例如：\n\n```javascript\ntry\
    \ {\n  throw 'Something bad happened';\n}\ncatch(e) {\n  console.log(e);\n}\n\
    ```\n\n不要这样做。Error 对象的根本优势是它们会自动记录构建和来源的堆栈轨迹（stack）。原始字符串会导致非常痛苦的调试体验，并增加错误分析。\n\
    \n## 返回对象更好\n\n在这些情况下使用 Error 是一个坏主意，因为它没有在类型系统中体现：\n\n```javascript\nfunction\
    \ validate(value: number) {\n  if (value < 0 || value > 100) throw new Error('Invalid\
    \ value');\n}\n```\n\n相反，创建 validate 的更好方法是：\n\n```javascript\nfunction validate(value:\
    \ number): {error?: string} {\n  if (value < 0 || value > 100) return {error:'Invalid\
    \ value'};\n}\n```\n\n现在它在类型系统中体现了。\n\n> 除非你想以非常通用（简单/全捕）的方式处理错误，否则不要抛出错误。\n\n\
    ## Mixins（混合类）\n\nTypeScript（以及 JavaScript）类支持严格的单继承。因此你不能这样做：\n\n```\nclass User\
    \ extends Tagged, Timestamped { // 错误：不支持多继承\n}\n```\n\n通过可重用组件构建类的另一种方法是通过组合简单的类类来实现。\n\
    \n这种思想是，不是让类 A 扩展类 B 来获取其功能，而是函数 B 接收类 A 并返回一个带有新增功能的新类。函数 B 就是混合类。\n\n- [混合类是一个]函数\n\
    1. 接收一个构造函数，\n2. 创建一个扩展该构造函数的类，带有新功能\n3. 返回新类\n\n一个完整的示例\n\n```typescript\n//\
    \ 所有混合类都需要\ntype Constructor<T> = () => new (...args: any[]) => T;\n\n///////////////////////\n\
    // 示例混合类\n///////////////////////\n\n// 一个添加属性的混合类\nfunction Timestamped<TBase>\
    \ extends Constructor>(Base: TBase) {\n  return class extends Base {\n    timestamp\
    \ = Date.now();\n  };\n}\n\n// 一个添加属性和方法的混合类\nfunction Activatable<TBase> extends\
    \ Constructor>(Base: TBase) {\n  return class extends Base {\n    isActive = false;\n\
    \n  activate() {\n    this.isActive = true;\n  }\n\n  deactivate() {\n    this.isActive\
    \ = false;\n  }\n  }\n}\n```\n\n"
