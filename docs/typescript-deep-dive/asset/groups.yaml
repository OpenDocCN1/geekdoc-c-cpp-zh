    \n- 多次声明函数头，\n- 最后一个函数头是函数体内实际生效的，但对外部世界不可用。\n\n如下所示：\n\n```typescript\nOverloads\n\
    function padding(all: number);\nfunction padding(topBottom: number, leftAndRight:\
    \ number);\nfunction padding(top: number, right: number, bottom: number, left:\
    \ number);\n// 实际实现，真实代表了函数需要处理的所有情况\nfunction padding(a: number, b?: number,\
    \ c?: number, d?: number) {\n  if (b === undefined && c === undefined && d ===\
    \ undefined) {\n    b = c = d = a;\n  } else if (c === undefined && d === undefined)\
    \ {\n    c = a;\n    d = b;\n  }\n  return {\n    top: a,\n    right: b,\n   \
    \ bottom: c,\n    left: d\n  };\n}\n```\n\n在这里，前三个函数签名是作为 padding 的有效调用的：\n\n\
    ```typescript\npadding(1); // 正确：all\npadding(1,1); // 正确：topBottom, leftAndRight\n\
    padding(1,1,1); // 正确：top, right, bottom, left\n\npadding(1,1,1,1); // 错误：不是可用重载的一部分\n\
    ```\n\n当然，最终声明（从函数内部看到的真实声明）与所有重载兼容是至关重要的。因为这是函数体需要考虑的函数调用的真实本质。\n\n> TypeScript\
    \ 中的函数重载不会带来任何运行时开销。它只是允许你记录你期望函数被调用的方式，并在编译器检查你的代码。\n\n## 可调用对象 (Callable)\n\n\
    你可以将可调用对象注解为类型的一部分或接口：\n\n```typescript\ninterface ReturnString {\n  (): string\n\
    }\n```\n\n此类接口的实例是一个返回字符串的函数，例如：\n\n```typescript\ndeclare const foo: ReturnString;\n\
    const bar = foo(); // bar 推断为字符串\n```\n\n## 明显的示例 (Obvious examples)\n\n当然，这种\
    \ *callable* 注解也可以指定参数 / 可选参数 / 剩余参数。这里是一个复杂的例子：\n\n```typescript\ninterface Complex\
    \ {\n  (foo: string, bar?: number, ...others: boolean[]): number;\n}\n```\n\n\
    它们甚至可以指定重载：\n\n```typescript\ninterface Overloaded {\n  (foo: string): string\n\
    \  (foo: number): number\n}\n\n// 示例实现\nconst overloaded: Overloaded = (foo) =>\
    \ foo;\n\n// 示例用法\nconst str = overloaded(''); // str 推断为 string\nconst num =\
    \ overloaded(123); // num 推断为 number\n```\n\n## 箭头语法 (Arrow Syntax)\n\n为了方便，TypeScript允许将接收数字并返回字符串的简单函数注解为：\n\
    \n```typescript\nconst simple: (foo: number) => string = (foo) => toString();\n\
    ```\n\n箭头语法的唯一局限性：你不能指定重载。重载必须使用完整的体 `{ (someArgs): someReturn }`。\n\n## 可构造 (Newable)\n\
    \nNewable 只是一个特殊的 *callable* 类型注解，意味着你需要使用 `new` 来调用，例如：\n\n```typescript\ninterface\
    \ CallMeNewToGetString {\n  new(): string\n}\n// 使用\ndeclare const Foo: CallMeNewToGetString;\n\
    const bar = new Foo(); // string\n```\n\n## 类型断言 (Type Assertion)\n\nTypeScript\
    \ 允许你以任何想要的方式覆盖推断和分析的类型视图。这是通过称为“类型断言”的机制实现的。TypeScript 的类型断言纯粹是告诉编译器你比它更了解类型，它不应该猜错。\n\
    \n类型断言的一个常见用例是你是从 JavaScript 迁移代码到 TypeScript。例如，考虑以下模式：\n\n```javascript\nvar\
    \ foo = {};\nfoo.bar = 123; // 错误：{}' 上不存在 'bar'\nfoo.bas = 'hello'; // 错误：{}'\
    \ 上不存在 'bas'\n```\n\n这里的代码错误是因为 `foo {}` 的推断类型是一个一个具有零属性的对象。因此，不允许向它添加 bar 或 bas。你可以通过类型断言\
    \ `as Foo` 轻松解决这个问题：\n\n```typescript\ninterface Foo {\n  bar: number;\n  bas:\
    \ string;\n}\nvar foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas = 'hello'\n```\n\n\
    as foo 与 <foo>\n\n最初添加的语法是 `<foo>`。如下所示：\n\n```typescript\nvar foo: any;\nvar\
    \ bar = <string> foo; // bar 现在类型为 \"string\"\n```\n\n然而，在 JSX 中使用 `<foo>` 风格的断言时，语言语法存在歧义：\n\
    \n```jsx\nvar foo = <string>bar;</string>\n```\n\n因此，现在建议使用 `as foo` 以保持一致性。\n\
    \n## 类型断言与类型转换 (Type Assertion vs. Casting)\n\nTypeScript 允许你以任何想要的方式覆盖推断和分析的类型视图。这是通过称为“类型断言”的机制实现的。TypeScript\
    \ 的类型断言纯粹是告诉编译器你比它更了解类型，它不应该猜错。\n\n类型断言的一个常见用例是你是从 JavaScript 迁移代码到 TypeScript。例如，考虑以下模式：\n\
    \n```javascript\nvar foo = {};\nfoo.bar = 123; // 错误：{}' 上不存在 'bar'\nfoo.bas =\
    \ 'hello'; // 错误：{}' 上不存在 'bas'\n```\n\n这里的代码错误是因为 `foo {}` 的推断类型是一个具有零属性的对象。因此，不允许向它添加\
    \ bar 或 bas。你可以通过类型断言 `as Foo` 轻松解决这个问题：\n\n```typescript\ninterface Foo {\n \
    \ bar: number;\n  bas: string;\n}\nvar foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas\
    \ = 'hello'\n```\n\n## 被认为有害的断言 (Assertion considered harmful)\n\n在许多情况下，断言允许你轻松迁移遗留代码（甚至可以将其他示例粘贴到代码库中），但你应该谨慎使用断言。以下操作无法保护你添加属性：\n\
    \n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo =\
    \ {} as Foo;\n// 啊啊，忘了什么吗？\n```\n\n另一个常见的想法是使用断言作为提供自动补全手段，例如：\n\n```typescript\n\
    interface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo = <Foo>;\n// 编译器将为\
    \ Foo 的属性提供自动补全\n// 如果 Foo 被重构（例如添加了新属性），此代码可能会崩溃；\n```\n\n这里的危险是相同的，如果你忘记了一个属性，编译器不会报错。这样做会更好：\n\
    \n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo:Foo\
    \ = {\n// 编译器将为 Foo 的属性提供自动补全\n};\n```\n\n## 双重断言 (Double assertion)\n\n类型断言尽管如我们所示有点不安全，但并不是*完全不受限制*。例如，以下是一个非常有效的用例（例如用户认为传入的事件是事件的一个更具体的情况），且类型断言按预期工作：\n\
    \n```typescript\nfunction handler(event: Event) {\n  let mouseEvent = event as\
    \ MouseEvent;\n}\n```\n\n然而，下面最可能是错误，尽管用户进行了类型断言，TypeScript 也会报错：\n\n```typescript\n\
    function handler(event: Event) {\n  let element = event as HTMLElement; // 错误：'Event'\
    \ 或类型 'HTMLElement' 均不可赋值\n}\n```\n\n如果你仍然想要该类型，可以使用双重断言，但首先断言为 `any`，它与所有类型兼容，因此编译器不再抱怨：\n\
    \n```typescript\nfunction handler(event: Event) {\n  let element = event as any\
    \ HTMLElement; // 好了！\n}\n```\n\n## TypeScript 如何判断单个断言不足\n\n基本上，类型 s 到 τ 的断言在\
    \ s 是 τ 的子类型或 t 是 s 的子类型时会成功。这是为了在进行类型断言时提供额外的安全性……完全狂野的断言可能非常不安全，你需要使用 `any`\
    \ 才能达到那种不安全的程度。\n\n"
