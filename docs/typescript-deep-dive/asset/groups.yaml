  - "[PAGE 75]\n\n# Revisiting our JSON example\n\nNow let's revisit our loadJSON\
    \ example and rewrite an async version that uses promises. All that we need to\
    \ do is read the file contents as a promise, then parse them as JSON and we are\
    \ done. Here is it in the below example:\n\n```\nfunction loadJSONAsync(filename:\
    \ string): Promise<any> {\n  return readFileSync(filename) // Use the function\
    \ we just wrote\n  .then(function (res) {\n    return JSON.parse(res);\n  });\n\
    }\n```\n\nUsage (notice how similar it is to the original sync version introduced\
    \ at the start of this section):\n\n```\n// good file\nloadJSONAsync('good.json')\n\
    \  .then(function (val) { console.log(val); })\n  .catch(function (err) {\n  \
    \  console.log('good.json error', err.message); // never called\n  })\n\n// non-existent\
    \ json file\n.then(function () {\n  return loadJSONAsync('absent.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('absent.json error', err.message);\n  })\n\n// invalid\
    \ json file\n.then(function () {\n  return loadJSONAsync('invalid.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('bad.json error', err.message);\n  });\n```\n\nThe\
    \ reason why this function was simpler is because the loadFile (async) + JSON.parse(sync)\
    \ = catch consolidation was done by the promise chain. Also the callback was not\
    \ called by us but by the promise chain so we didn't have the chance of making\
    \ the mistake of wrapping it in a try/catch.\n\n# Parallel control flow"
  - "[PAGE 76]\n\nWe have seen how trivial a serial sequence of async tasks is with\
    \ promises. It is simply a matter of chaining calls.\n\nHowever you might potentially\
    \ want to run a series of async tasks and then do something with the results of\
    \ all these tasks. Promise provides a static Promise.all function that you can\
    \ wait for n number of promises to complete. You provide it with an array of n\
    \ promises and gives you an array of n resolved values. Below we show Chaining\
    \ as well as Parallel:\n\n```\n// an async function to simulate loading an item\
    \ from some server\nfunction loadItem(id: number): { id: number } {\n  return\
    \ new Promise((resolve) => {\n    console.log('loading item', id);\n    setTimeout(()\
    \ => { // simulate a server delay\n      resolve({ id: id });\n    }, 1000);\n\
    \  });\n}\n\n// Chaining\nlet item1, item2;\nloadItem(1)\n  .then((res) => {\n\
    \    item1 = res;\n    return loadItem(2);\n  })\n  .then((res) => {\n    item2\
    \ = res;\n    console.log('done');\n  }); // overall time will be around 2s\n\n\
    // Parallel\nPromise.all([loadItem(1), loadItem(2)])\n  .then((res) => {\n   \
    \ [item1, item2] = res;\n    console.log('done');\n  }); // overall time will\
    \ be around 1\n```\n\nSometimes, you want to run a series of async tasks, but\
    \ then you get all as long as any one of these tasks is settled. Promise provides\
    \ a static Promise.race function for this scenario:"
