- md: "\n```typescript\ninterface Foo {\n  foo: string;\n}\n\nfunction(sample: Foo)\
    \ {\n  return sample; // inferred type 'Foo'\n}\n```\n\nHowever it is generally\
    \ a good idea to add this annotation to help with errors e.g.:\n\n```typescript\n\
    function foo() {\n  return { foo: 'John Doe' }; // You might not find this misspelling\
    \ `foo` till it's\n  too late\n}\n\nsAsJSON(foo);\n```\n\nIf you don't plan to\
    \ return anything from a function to you can annotate it as `:void`. You can generally\
    \ drop `:void` and leave it to the inference engine though.\n\n## Optional Parameters\n\
    \nYou can mark a parameter as optional:\n\n```typescript\nfunction foo(bar: number,\
    \ bas?: string): void {\n  // .\n}\n```\n\nfoo(123);\nfoo(123, 'hello');\n\nAlternatively\
    \ you can even provide a default value (using `= someValue` after the parameter\
    \ declaration) which will get injected for you if the caller doesn't provide that\
    \ argument:\n\n```typescript\nfunction foo(bar: number, bas: string = 'hello')\
    \ {\n  console.log(bar, bas);\n}\n\nfoo(123);      // 123, hello\nfoo(123, 'world');\
    \  // 123, world\n```\n\n## Overloading\n\nTypeScript allows you to declare function\
    \ overloads. This is useful for documentation + type safety purpose.\n\n```typescript\n\
    function padding(a: number, b?: number, c?: number, d?: any) {\n  if (b === undefined\
    \ && c === undefined && d === undefined) {\n    b = c = d = a;\n  } else if (c\
    \ === undefined && d === undefined) {\n    c = a;\n    d = b;\n  }\n  return {\n\
    \    top: a,\n    right: b,\n    bottom: c,\n    left: d\n  };\n}\n```\n\nIf you\
    \ look at the code carefully you realize the meaning of a, b, c, d change based\
    \ on how many arguments are passed in. Also the function only expects 1, 2 or\
    \ 4 arguments. These constraints can be enforced and documented using function\
    \ overloading. You just:\n\n- declare the function header multiple times,\n- the\
    \ last function header is the one that is actually active within the function\
    \ body but is not available to the outside world.\n\nThis is shown below:\n\n\
    ```typescript\nOverloads\nfunction padding(all: number);\nfunction padding(topBottom:\
    \ number, leftAndRight: number);\nfunction padding(top: number, right: number,\
    \ bottom: number, left: number);\n// Actual implementation that is a true representation\
    \ of all the cases the function needs to handle\nfunction padding(a: number, b?:\
    \ number, c?: number, d?: number) {\n  if (b === undefined && c === undefined\
    \ && d === undefined) {\n    b = c = d = a;\n  } else if (c === undefined && d\
    \ === undefined) {\n    c = a;\n    d = b;\n  }\n  return {\n    top: a,\n   \
    \ right: b,\n    bottom: c,\n    left: d\n  };\n}\n```\n\nHere the first three\
    \ function signatures are what is available as valid calls to padding:\n\n```typescript\n\
    padding(1); // Okay: all\npadding(1,1); // Okay: paddingTop, leftAndRight\npadding(1,1,1);\
    \ // Okay: top, right, bottom, left\n\npadding(1,1,1,1); // Error: Not a part\
    \ of the available overloads\n```\n\nOf course it's important for the final declaration\
    \ (the true declaration as seen from inside the function) to be compatible with\
    \ all the overloads. This is because that is the true nature of the function calls\
    \ that the function body needs to account for.\n\n> Function overloading in TypeScript\
    \ doesn't come with any runtime overhead. It just allows you to document the manner\
    \ you expect the function to be called in and the compiler holds the rest of your\
    \ code in check.\n\n## Callable\n\nYou can annotate callables as a part of a type\
    \ or an interface as follows\n\n```typescript\ninterface ReturnString {\n  ():\
    \ string\n}\n```\n\nAn instance of such an interface would be a function that\
    \ returns a string e.g.\n\n```typescript\ndeclare const foo: ReturnString;\nconst\
    \ bar = foo(); // bar is inferred as a string\n```\n\n## Obvious examples\n\n\
    Of course such *callable* annotation can also specify any arguments / optional\
    \ arguments / rest arguments as needed. e.g. here is a complex example:\n\n```typescript\n\
    interface Complex {\n  (foo: string, bar?: number, ...others: boolean[]): number;\n\
    }\n```\n\nThey can even specify overloads:\n\n```typescript\ninterface Overloaded\
    \ {\n  (foo: string): string\n  (foo: number): number\n}\n\n// example implementation\n\
    const overloaded: Overloaded = (foo) => foo;\n\n// example usage\nconst str =\
    \ overloaded(''); // str is inferred string\nconst num = overloaded(123); // num\
    \ is inferred number\n```\n\nOf course like *all* bodies of interfaces / types\
    \ you can use these as variable type annotations e.g.\n\n```typescript\noverloaded:\
    \ {\n  (foo: string): string\n  (foo: number): number\n} = (foo) => foo;\n```\n\
    \n## Arrow Syntax\n\nTo make it easy to specify callable signatures TypeScript\
    \ also allows simple arrow type annotations e.g. a function that takes a number\
    \ and returns a string can be annotated as:\n\n```typescript\nconst simple: (foo:\
    \ number) => string\n  = (foo) => foo.toString();\n```\n\nOnly limitation of the\
    \ arrow syntax: You can't specify overloads. For overloads you must use the full\
    \ body { (someArgs): someReturn } syntax.\n\n## Newable\n\nNewable is just a special\
    \ type of callable type annotation with the prefix new . It simply means that\
    \ you need to invoke with new e.g.\n\n```typescript\ninterface CallMeWithNewToGetString\
    \ {\n  new(): string\n}\n// Usage\ndeclare const Foo: CallMeWithNewToGetString;\n\
    const bar = new Foo(); // bar is inferred to be of type string\n```\n\n## Type\
    \ Assertion\n\nTypeScript allows you to override the inferred and analyzed view\
    \ of types in any way you want to. This is done by a mechanism called \"type assertion\"\
    . TypeScript's type assertion is purely by telling the compiler that you know\
    \ about the types better than it does, and that it should not second guess you.\n\
    \nA common use case for type assertion is when you are porting code from JavaScript\
    \ to TypeScript. For example consider the following pattern:\n\n```javascript\n\
    var foo = {};\nfoo.bar = 123; // Error: property 'bar' does not exist on '{}'\n\
    foo.bas = 'hello'; // Error: property 'bas' does not exist on '{}'\n```\n\nHere\
    \ code errors because the inferred type of foo {} i.e. an object with zero properties.\
    \ Therefore you are not allowed to add bar or bas to it. You can fix this simply\
    \ by a type assertion as Foo\n\n```typescript\ninterface Foo {\n  bar: number;\n\
    \  bas: string;\n}\nvar foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas = 'hello'\n\
    ```\n\nas foo vs. <foo>\n\nOriginally the syntax that was added was <foo>. This\
    \ is demonstrated below:\n\n```typescript\nvar foo: any;\nvar bar = <string> foo;\
    \ // bar is now of type \"string\"\n```\n\nHowever there is an ambiguity in the\
    \ language grammar when using <foo> style assertions in JSX:\n\n```jsx\nvar foo\
    \ = <string>bar;\n</string>\n```\n\nTherefore it is now recommended that you just\
    \ use as foo for consistency.\n\n## Type Assertion vs. Casting\n\nTypeScript allows\
    \ you to override the inferred and analyzed view of types in any way you want\
    \ to. This is done by a mechanism called \"type assertion\". TypeScript's type\
    \ assertion is purely by telling the compiler that you know about the types better\
    \ than it does, and that it should not second guess you.\n\nA common use case\
    \ for type assertion is when you are porting code from JavaScript to TypeScript.\
    \ For example consider the following pattern:\n\n```javascript\nvar foo = {};\n\
    foo.bar = 123; // Error: property 'bar' does not exist on '{}'\nfoo.bas = 'hello';\
    \ // Error: property 'bas' does not exist on '{}'\n```\n\nHere code errors because\
    \ the inferred type of foo {} i.e. an object with zero properties. Therefore you\
    \ are not allowed to add bar or bas to it. You can fix this simply by a type assertion\
    \ as Foo\n\n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\n\
    var foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas = 'hello'\n```\n\n## Assertion considered\
    \ harmful\n\nIn many cases assertion will allow you to easily migrate legacy code\
    \ (and even copy paste other samples into your codebase), however you should be\
    \ careful with your use of assertions. The following will not protect you from\
    \ adding the properties:\n\n```typescript\ninterface Foo {\n  bar: number;\n \
    \ bas: string;\n}\nvar foo = {} as Foo;\n// ahhhh forget something?\n```\n\nAlso\
    \ another common thought is using an assertion as a means of providing autocomplete\
    \ e.g.:\n\n```typescript\ninterface Foo {\n  bar: number;\n  bas: string;\n}\n\
    var foo = <Foo>;\n// the compiler will provide autocomplete for properties of\
    \ Foo\n// But this code is likely to break if Foo gets refactored (e.g. a new\
    \ added);\n```\n\nthe hazard here is the same, if you forget a property the compiler\
    \ will not complain. It is better if you do the following:\n\n```typescript\n\
    interface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo:Foo = {\n// the compiler\
    \ will provide autocomplete for properties of Foo\n};\n```\n\nIn some cases you\
    \ might need to create a temporary variable, but at least you will not be making\
    \ (possibly false) promises and instead relying on the type inference to do the\
    \ checking for you.\n\n## Double assertion\n\nThe type assertion despite a bit\
    \ unsafe as we've shown, is not *completely open* season. E.g. the following is\
    \ a very valid use case (e.g. the user thinks the event passed in will be a more\
    \ specific case of an event) and the type assertion works as expected:\n\n```typescript\n\
    function handler(event: Event) {\n  let mouseEvent = event as MouseEvent;\n}\n\
    ```\n\nHowever the following is most likely an error and TypeScript will complain\
    \ as shown despite the user's type assertion:\n\n```typescript\nfunction handler(event:\
    \ Event) {\n  let element = event as HTMLElement; // Error: Neither 'Event' nor\
    \ type 'HTMLElement' t is assignable to the other\n}\n```\n\nIf you still want\
    \ that Type, you can use a double assertion, but first asserting to any which\
    \ is compatible with all types and therefore the compiler no longer complains:\n\
    \n```typescript\nfunction handler(event: Event) {\n  let element = event as any\
    \ HTMLElement; // Okay!\n}\n```\n\n## How typescript determines if a single assertion\
    \ is not enough\n\nBasically, the assertion from type s to τ succeeds if s is\
    \ a subtype of τ or t is a subtype of s . This is to provide extra safety when\
    \ doing type assertions ... completely wild assertions can be very unsafe and\
    \ you need to use any to be that unsafe.\n"
