    console.log(iterator.next()); // { value: 2, done: false }\nconsole.log(iterator.next());\
    \ // { value: undefined, done: true }\n```\n\n# 外部控制\n\n这是你从外部控制生成器的方法：\n\n```javascript\n\
    function* idMaker() {\n  try {\n    let val = yield 0;\n    console.log(val);\n\
