    \ with code ambience.\n\nHowever if you want finer grained control of your environment\
    \ you should use the --lib option which we discuss next.\n\n# lib option\n\nSometimes\
    \ (many times) you want to decouple the relationship between the compile target\
    \ (the generated JavaScript version) and the ambient library support. A common\
