    \ for documentation + type safety purpose.\n\n```\nfunction padding(a: number,\
    \ b?: number, c?: number, d?: any) {\n  if (b === undefined && c === undefined\
    \ && d === undefined) {\n    b = c = d = a;\n  } else if (c === undefined && d\
