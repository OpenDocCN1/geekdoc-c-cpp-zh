    \ --define process.env.NODE_ENV=\\\"production\\\" --config /src/webpack.config.js\"\
    ,\n```\n\nOf course I am assuming you have `npm install webpack --save-dev`. Now\
    \ you can run `npm run:test` etc.\n\nUsing this variable is super easy as well:\n\
    \n```\n/**\n * This interface makes sure we don't miss adding a property to both\
    \ `prod` and `test` \n */\ninterface Config {\n  someItem: string;\n}\n\n/**\n\
    \ * We only export a single thing. The config.\n */\nexport let config: Config;\n\
    \n/**\n * process.env.NODE_ENV definition is driven from webpack\n * The whole\
    \ `else` block will be removed in the emitted JavaScript\n * for a production\
