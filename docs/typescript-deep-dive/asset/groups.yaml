    \ !this.state.isChecked });\n  }\n\n  render() {\n    return (\n      <label>\n\
    \        <input\n          type=\"checkbox\"\n          checked={this.state.isChecked}\n\
    \          onChange={this.onChange}\n        />\n        {this.state.isChecked\
    \ ? this.props.labelOn : this.props.labelOff}\n      </label>\n    );\n  }\n}\n\
    ```\n\n```typescript\ncheckboxWithLabel.test.tsx :\n\nimport * as React from 'react';\n\
    import { shallow } from 'enzyme';\nimport { CheckboxWithLabel } from './checkboxWithLabel';\n\
    \ntest('CheckboxWithLabel changes the text after click', () => {\n  const checkbox\
    \ = shallow(<CheckboxWithLabel labelOn=\"On\" labelOff=\"Off\" />);\n\n  // Interaction\
    \ demo\n  expect(checkbox.text()).toEqual('Off');\n  checkbox.find('input').simulate('change');\n\
    \  expect(checkbox.text()).toEqual('On');\n\n  // Snapshot demo\n  expect(shallow).toMatchSnapshot();\n\
    });\n```\n\n# Reasons why we like jest\n\nFor details on these features see jest\
    \ website\n\n- Built-in assertion library.\n- Great TypeScript support.\n- Snapshot\
    \ testing.\n- Built-in coverage reports.\n- Built-in async/await support.\n\n\
    # TIPS\n\nIn this section we present a number of tips that we have collected over\
    \ the course of using TypeScript in the real world.\n\n# String enums\n\nSometimes\
    \ you need a collection of strings collected under a common key. Prior to TypeScript\
    \ 2.4, TypeScript only supported number-based enums. If using versions prior to\
    \ 2.4, a work-around is to use string literal types to create string-based enums\
    \ by combining with union types.\n\n# Nominal Typing\n\nThe TypeScript type system\
    \ is structural and this is one of the main motivating benefits. However, there\
    \ are real-world use cases for a system where you want two variables to be differentiated\
    \ because they have a different type name even if they have the same structure.\
    \ A very common case is identity structures (which are generally just strings\
    \ with semantics associated with their name in languages like C#/Java).\n\nThere\
    \ are a few patterns that have emerged in the community. I cover them in decreasing\
    \ order of personal preference:\n\n# Using literal types\n\nThis pattern uses\
    \ generics and literal types:\n\n```typescript\n/** Generic Id type */\ntype Id<T\
    \ extends string> = {\n  type: T,\n  value: string,\n}\n\n/** Specific Id types\
    \ */\ntype FooId = Id<'foo'>;\ntype BarId = Id<'bar'>;\n\n/** Optional: constructors\
    \ functions */\nconst createFoo = (value: string): FooId => ({ type: 'foo', value:\
    \ value });\nconst createBar = (value: string): BarId => ({ type: 'bar', value:\
    \ value });\n\nlet foo = createFoo('sample');\nlet bar = createBar('sample');\n\
    \nfoo = bar; // Error\nfoo = foo; // Okay\n```\n\n- Advantages\n  - No need for\
    \ any type assertions\n- Disadvantage\n  - The structure {type,value} might not\
    \ be desirable and need server serialization support\n\n# Using Enums\n\nEnums\
    \ in TypeScript offer a certain level of nominal typing. Two enum types aren't\
    \ equal if they differ by name. We can use this fact to provide nominal typing\
    \ for types that are otherwise structurally compatible.\n\nThe workaround involves:\n\
    \n- Creating a *brand* enum.\n- Creating the type as an *intersection* (&) of\
    \ the brand enum + the actual structure.\n\nThis is demonstrated below where the\
    \ structure of the types is just a string:\n\n```typescript\n// FOO\nenum FooBrand\
    \ {}\ntype FooId = FooBrand & string;\n\n// BAR\nenum BarBrand {}\ntype BarId\
    \ = BarBrand & string;\n\n/**\n * Usage Demo\n */\nvar fooId: FooId;\nvar barId:\
    \ BarId;\n\n// Safety!\nfooId = barId; // error\nbarId = fooId; // error\n\n//\
    \ Newing up\nfooId = 'foo' as FooId;\nbarId = 'bar' as BarId;\n\n// Both types\
    \ are compatible with the base\nvar str: string;\nstr = fooId;\nstr = barId;\n\
    ```\n\n# Using Interfaces\n\nBecause numbers are type compatible with enums the\
    \ previous technique cannot be used for them. Instead we can use interfaces to\
    \ break the structural compatibility. This is still used by the TypeScript compiler\
    \ team, well worth mentioning. Using _ prefix and Brand suffix is a convention\
    \ I strongly recommend (and the one followed by the TypeScript team).\n\nThe workaround\
    \ involves the following:\n\n- adding an unused property on a type to break structural\
    \ compatibility.\n- using a type assertion when needing to new up or cast down.\n\
    \nThis is demonstrated below:\n\n```typescript\n// FOO\ninterface FooId extends\
    \ String {\n  _fooIdBrand: string; // To prevent type errors\n}\n\n// BAR\ninterface\
    \ BarId extends String {\n  _barIdBrand: string; // To prevent type errors\n}\n\
    \n/**\n * Usage Demo\n */\nvar fooId: FooId;\nvar barId: BarId;\n\n// Safety!\n\
    fooId = barId; // error\nbarId = fooId; // error\n```\n\n# Class Members\n\nAnother\
    \ common use is to use bind to ensure the correct value of this when passing around.\
    \ Don't do that!\n\nThe following demonstrates that you lose parameter safety\
    \ if you use bind:\n\n```typescript\nclass Adder {\n  constructor(public a: string)\
    \ {\n\n  add(b: string): string {\n    return this.a + b;\n  }\n}\n\nfunction\
    \ useAdd: (x: number) => number) {\n  return add(456);\n}\n\nlet adder = new Adder('mary\
    \ had a ');\nuseAdd(adder.add.bind(adder)); // No compile error!\nuseAdd((x) =>\
    \ add(x)); // Error: number is not assignable to string\n\nIf you have a class\
    \ member function that you expect to pass around, use an arrow function in the\
    \ first place e.g one would write the same Adder class as:\n\n```typescript\n\
    class Adder {\n  constructor(public a: string) {\n\n  // This function is now\
    \ safe to pass around\n  add = (b: string): string => {\n    return this.a + b;\n\
    \  }\n}\n```\n\nAnother alternative is to manually specify the type of the variable\
    \ you are binding e.g.\n\n```typescript\nconst add: typeof adder.add = adder.add.bind(adder);\n\
    ```\n\n# Bind is Harmful\n\nAs you see, calling bind on will lose parameter safety.\
    \ For example the following compiles:\n\n```typescript\nclass Adder {\n  constructor(public\
    \ a: string) {\n\n  add(b: string): string {\n    return this.a + b;\n  }\n}\n\
    \nfunction useAdd: (x: number) => number) {\n  return add(456);\n}\n\nlet adder\
    \ = new Adder('mary had a ');\nuseAdd(adder.add.bind(adder)); // No compile error!\n\
    useAdd((x) => add(x)); // Error: number is not assignable to string\n```\n\n#\
    \ Currying\n\nJust use a chain of fat arrow functions:\n\n```typescript\n// A\
    \ Curried function\nlet add = (x: number) => (y: number) => x + y;\n\n// Simple\
    \ usage\nadd(123)(456);\n\n// partially applied\nlet add123 = add(123);\n\n//\
    \ fully apply the function\nadd123(456);\n```\n"
