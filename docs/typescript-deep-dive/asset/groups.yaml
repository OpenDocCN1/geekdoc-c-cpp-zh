    \ 'foo'\n  };\n  iTakeFoo(test.someProp); // Error: Argument of type string is\
    \ not assignable to parameter of type 'foo'\n}\n```\n\n这是因为 `test` 被推断为 `{someProp:\
    \ string}`。这里的修复方法是使用简单的类型断言，告诉 TypeScript 你希望它推断的字面量，如下所示：\n\n```typescript\n\
    function iTakeFoo(foo: 'foo') {\n  const test = {\n    someProp: 'foo' as 'foo'\n\
    \  };\n  iTakeFoo(test.someProp); // Okay!\n}\n```\n\n# 用例\n\n字符串字面量类型的有效用例包括：\n\
    \n## 基于字符串的枚举\n\nTypeScript 的枚举是基于数字的。你可以使用联合类型配合字符串字面量来模拟基于字符串的枚举，就像我们在上面的 `CardinalDirection`\
    \ 示例中所做的那样。你甚至可以使用以下函数生成 `Key:Value` 结构：\n\n```typescript\n/** 用于从字符串列表创建 K:V\
    \ 的工具函数 */\nfunction strEnum<T extends string>(o: Array<T>): {[K in T]: K} {\n\
    \  return o.reduce((res, key) => {\n    res[key] = key;\n    return res;\n  },\
    \ Object.create(null));\n}\n```\n\n然后使用 `keyof typeof` 生成字面量类型联合类型。这里是一个完整的示例：\n\
    \n```typescript\n/** 用于从字符串列表创建 K:V 的工具函数 */\nfunction strExtends<T extends string>(o:\
    \ Array<T>): {[K in T]: K} {\n  return o.reduce((res, key) => {\n    res[key]\
    \ = key;\n    return res;\n  }, Object.create(null));\n}\n```\n\n```typescript\n\
    /**\n * 创建字符串枚举的示例 \n */\n/** 创建一个 K:V */\nconst Direction = strEnum([\n  'North',\n\
    \  'South',\n  'East',\n  'West'\n])\n```\n\n```typescript\n/**\n * 使用字符串枚举的示例\n\
    \ */\ntype Direction = keyof typeof Direction;\n\nlet sample: Direction;\n\nsample\
    \ = Direction.North; // Okay\nsample = 'North'; // Okay\nsample = 'AnythingElse';\
    \ // ERROR!\n```\n\n# 为现有的 JavaScript API 建模\n\n例如，CodeMirror 编辑器有一个选项 `readOnly`，可以是布尔值或字面量字符串\
    \ `\"nocursor\"`（有效值为 `true`, `false`,`\"nocursor\"`）。它可以这样声明：\n\n```typescript\n\
    readOnly: boolean | 'nocursor';\n```\n\n# 辨析联合类型 (Discriminated Unions)\n\n我们将在书中后续部分介绍。\n\
    \n## readonly\n\nTypeScript 的类型系统允许你将接口上的单个属性标记为 `readonly`。这允许你以函数式的方式工作（意外的变异是不好的）：\n\
    \n```typescript\nfunction foo(config: {\n  readonly bar: number,\n  readonly bas:\
    \ number\n}) {\n  // ..\n}\nlet config = { bar: 123, bas: 123 };\nfoo(config);\n\
    // 你可以确定 `config` 没有被\n```\n\n当然，你也可以在接口类型定义中使用 `readonly`，例如：\n\n```typescript\n\
    type Foo = {\n  readonly bar: number;\n  readonly bas: number\n}\n// 初始化是可以的\n\
    let foo: Foo = { bar: 123, bas: 456 };\n\n// 变异行的\nfoo.bar = 456; // Error: Left-hand\
    \ side of assignment expression cannot be a or a read-only property\n```\n\n你甚至可以将类属性声明为\
    \ `readonly`。你可以在声明处或构造函数中初始化它们，如下所示：\n\n```typescript\nclass Foo {\n  readonly\
    \ bar = 1; // OK\n  readonly bas: string;\n  constructor() {\n    this.baz = \"\
    hello\"; // OK\n  }\n}\n```\n\n# Readonly\n\n有一个类型 `Readonly`，它接收一个类型 `T` 并使用映射类型将其所有属性标记为\
    \ `readonly`。这是一个在实际中使用它的演示：\n\n```typescript\ntype Foo = {\nbar: number;\nbas:\
    \ number;\n}\n\ntype FooReadOnly = Readonly<Foo>\n\nlet Foo: {bar: 123, bas: 456};\n\
    let FooReadOnly: FooReadOnly = {bar: 123, bas: 456};\n\nfoo.bar = 456; // Okay\n\
    FooReadOnly.bar = 456; // ERROR: bar is readonly\n```\n\n# 各种用例\n\n## ReactJS\n\
    \nReactJS 是一个喜欢不可变性的库，你可以将你的 `Props` 和 `State` 标记为不可变，例如：\n\n```typescript\ninterface\
    \ Props {\n  readonly foo: number;\n}\ninterface State {\n  readonly bar: number;\n\
    }\nexport class Something extends React.Component<Props, State> {\n  someMethod()\
    \ {\n    // 你可以放心没有人会\n    this.props.foo = 123; // ERROR: (props are immutable)\n\
    \    this.state.baz = 456; // ERROR: (one should use this.setState)\n  }\n}\n\
    ```\n\n然而，React 的类型定义不需要为你标记这些为 `readonly`（通过在内部将传递的泛型类型封装在上述 `Readonly` 类型中）。\n\
    \n```typescript\nexport class Something extends React.Component<Props, State>\
    \ {\n  someMethod() {\n    // 你可以放心没有人会\n    this.props.foo = 123; // ERROR: (props\
    \ are immutable)\n    this.state.baz = 456; // ERROR: (one should use this.setState)\n\
    \  }\n}\n```\n\n## 不变 (Immutable)\n\n你甚至可以将索引签名标记为 `readonly`：\n\n```typescript\n\
    /**\n * 声明\n */\ninterface Foo {\n  readonly [P: string]: any;\n}\n\n/**\n * 使用\n\
    \ */\nlet foo = { bar: 123, bas: 456 };\nconsole.log(foo.bar); // Ok\nfoo.bar\
    \ = 456;\n```\n\n# 自动推断 (Automatic Inference)\n\n在某些情况下，编译器可以自动为你推断类型：\n\n```typescript\n\
    let foo = {\n  bar: 123,\n  bas: 456\n};\n// 如果你想让它是 readonly\nconst config =\
    \ {\n  bar: 123,\n  bas: 456\n};\nconfig.bar = 456; // Error: Cannot assign to\
    \ read-only property\n```\n\n# 泛型 (Generics)\n\n泛型的关键是提供意义的约束。考虑简单的队列（先进先出）数据结构：\n\
