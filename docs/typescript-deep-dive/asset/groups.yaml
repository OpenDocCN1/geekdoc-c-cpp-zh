    \ es5 but still use latest stuff like Promise . To support this you can take explicit\
    \ control of lib using the lib compiler option.\n\n> Note: using --lib decouples\
    \ any lib magic from --target giving you better control.\n\nYou can provide this\
    \ option on the command line or in tsconfig.json (recommended):\n\n# Command line:\n\
    \n```\ntsc --target es5 --lib dom,es6\n```\n\n# tsconfig.json:\n\n```\n\"compilerOptions\"\
