    \      .replace(/\"/g, '&quot;');\n      .replace(/'/g, '#39;');\n      .replace(/<//g,\
    \ '&lt;');\n      .replace(//>/g, '&gt;');\n  }\n\n  // add the last literal\n\
    \  result += literals[literals.length - 1];\n  return result;\n}\n```\n\n# # Generated\
