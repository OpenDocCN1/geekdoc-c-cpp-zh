    - Thanks, this is a great book\n- Deep dive to typescript is awesome in so many\
    \ levels. i find it very insightful\n- @basarat's intro to typescriptlang is still\
    \ one of the best (if not THE best)\n\n# Get Started\n\nIf you are here to read\
    \ the book online\n\n# Translations\n\nBook is completely free so you can copy\
    \ paste whatever you want without permission. If you have a translation you want\
    \ me to link here. Send a PR.\n\n# Other Options\n\nYou can also download one\
    \ of the following:\n\n- Filipino- EPUB for iPad, iPhone, Mac\n- PDF for Windows\
    \ and others\n- MOBI for Kindle\n\n# Special Thanks\n\nAll the amazing contributors\n\
    \n# Share\n\nShare URL: http://basarat.gitbooks.io/typescript/\n\n# Getting Started\
    \ With TypeScript\n\nTypeScript compiles into JavaScript. JavaScript is what you\
    \ are actually going to execute (either in the browser or on the server). So you\
    \ are going to need the following:\n\n- TypeScript compiler (OSS available in\
    \ source) and on NPM\n- A TypeScript editor (you can use notepad if you want but\
    \ I use alm . Also lots of other IDEs support it as well)\n\n```typescript\nbas.tsx\n\
    declare var React: any;\nimport { foo } from './foo';\nconst bas = React();\n\
    /* This is a test comment */\nfunction test(a, b) {\n  function test(a, b, c)\
    \ {\n    console.log(a, b, c);\n  }\n}\n\nlet dom = <div>\n  {data}\n</div>;\n\
    \nlet foo = {\n  method toFixed(fractionDigits: number): string;\n  method toString():\
    \ string; // Returns a string containing a number represented either in exponential\
    \ or fixed notation\n  method toLocaleString(fractionDigits?: number): string;\
    \ // Returns a string with a specified number of digits.\n};\n```\n\n```bash\n\
    /Users/bas/repos/alm/tests/success/simple/bas.tsx\n```\n\n# TypeScript Version\n\
    \nInstead of the stable TypeScript compiler we will be presenting a lot of new\
    \ stuff in this book that may not be associated with a version number yet. I generally\
    \ recommend people use the nightly version because the compiler test suite only\
    \ catches bugs over time.\n\nYou can install it on the command line as\n\n```bash\n\
    npm install -g typescript@next\n```\n\nAnd now the command line `tsc` will be\
    \ the latest and greatest. Various IDEs support it, e.g.\n\n- `alm` always ships\
    \ with the latest TypeScript version.\n- You can ask vscode to use this version\
    \ by creating `.vscode/settings.json` with the following contents:\n\n```json\n\
    {\n  \"typescriptdk\": \"./node_modules/typescript/lib\"\n}\n```\n\n# Getting\
    \ the Source Code\n\nThe source for this book is available in the books https://github.com/basarat/typescript-book/tree/master\
    \ most the code samples can be copied into alm and you can play with them as is.\
    \ For code samples that need additional setup (e.g. npm modules), we will link\
    \ you to the code before presenting the code.\n\n```typescript\nthis/will/be/the/code.ts\n\
    ```\n\n```typescript\n// This will be the code under discussion\n```\n\nWith dev\
    \ setup out of the way let's jump into TypeScript syntax.\n"
