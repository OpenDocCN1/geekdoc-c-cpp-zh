    \n# 获取一个构造函数\n\n混入（Mixins）接收一个类并扩展其新功能。因此，我们需要定义什么是构造函数。方法如下：\n\n```typescript\n\
    // 所有 mixin 所需要的\ntype Constructor<T = {}> = new (...args: any[]) => T;\n```\n\
    \n# 扩展类并返回它\n\n非常简单：\n\n```typescript\n// Mixin 添加了一个属性\nfunction TimestampsedTBase\
    \ extends Constructor<TBase>(Base: TBase) {\n  return class extends Base {\n \
    \   timestamp = Date.now();\n  }\n}\n```\n\n就是这样。\n\n# JSX 支持\n\nTypeScript 支持\
    \ JSX 编译和代码分析。如果你不熟悉 JSX，这里是[官方网站](:) 的节录：\n\n> JSX 是 ECMAScript 的一种类 XML 语法扩展，但没有任何定义的语义。它并不打算由引擎或浏览器实现。它不是将\
    \ JSX 整合到 ECMAScript 规范本身中的提案。它旨在供各种预处理器（转换器）使用，以将这些标记转换为标准的 ECMAScript。\n\nJSX\
    \ 的初衷是允许用户像编写 *JavaScript* 一样编写 HTML 视图，这样你可以：\n\n- 使用与检查 JavaScript 相同的代码对视图进行类型检查。\n\
    - 使用与运行逻辑相同的代码对视图进行类型检查（即加强了传统 MVC 中控制器与视图的连接）。\n- 复用 JavaScript 模式进行 HTML 维护，例如\
    \ `Array.prototype.map`、`?`、`switch` 等，而不是创建新的（且可能类型定义很差的）替代方案。\n\n这减少了错误的几率并增加了用户界面的可维护性。目前\
    \ JSX 的主要使用者是[来自 facebook 的 ReactJS](。这是我们将讨论的 JSX 用法。\n\n# 设置\n\n我们的 `browserstart`\
    \ 已经为你开发 React 应用做好了准备。以下是关键亮点：\n\n- 使用扩展名为 `.tsx` 的文件（而不是 `.ts`）。\n- 在 `tsconfig.json`\
    \ 的 `compilerOptions` 中使用 `\"jsx\": \"react\"`。\n- 在项目中安装 JSX 和 React 的定义：`(npm\
    \ i -D @types/react @react-dom)`。\n- 在你的 `.tsx` 文件中引入 react (`import * as React\
    \ from \"react\"``)\n\n# HTML 标签 vs 组件\n\nReact 可以渲染 HTML 标签（字符串）或 React 组件（类）。这些元素的\
    \ JavaScript 输出是不同的（`React.createElement('div')` 对比 `React.createElement(MyComponent)`）。这种区别是通过第一个字母的大小写决定的。`foo`\
    \ 被视为 HTML 标签，而 `Foo` 被视为组件。\n\n# 类型检查\n\n# HTML 标签\n\nHTML 标签 `foo` 的类型是 `JSX.IntrinsicElements.foo`。这些类型已经在文件\
    \ `react-jsx.d.ts` 中为所有主要标签定义好了，该文件是在设置过程中安装的。以下是文件内容的示例：\n\n```typescript\ndeclare\
    \ module JSX {\n  interface IntrinsicElements {\n    a: React.HTMLAttributes;\n\
    \    abbr: React.HTMLAttributes;\n    div: React.HTMLAttributes;\n    span: React.HTMLAttributes;\n\
    \n    // 等等 ...\n  }\n}\n```\n\n# 无状态函数组件\n\n你可以简单地使用 `React.SFC` 接口定义无状态组件，例如：\n\
    \n```typescript\ninterface Props {\n  foo: string;\n}\nconst MyComponent: React.SFC<Props>\
    \ = (props) => {\n  return <span>{props.foo}</span>;\n}\n\n<MyComponent foo=\"\
    bar\" />\n```\n\n# 有状态组件\n\n组件根据其 `props` 属性进行类型检查。这模拟了 JSX 的转换方式，即属性变成了组件的 `props`。\n\
    \n要创建 React 有状态组件，你需要使用 ES6 类。`react.d.ts` 文件定义了 `React.Component<Props,State>`\
    \ 类，你应该在自己的类中扩展它，并提供自己的 `Props` 和 `State` 接口。下文所示：\n\n```typescript\ninterface\
    \ Props {\n  foo: string;\n}\nclass MyComponent extends React.Component<Props,\
    \ {}> {\n  render() {\n    return <span>{this.props.foo}</span>;\n  }\n}\n\n<MyComponent\
