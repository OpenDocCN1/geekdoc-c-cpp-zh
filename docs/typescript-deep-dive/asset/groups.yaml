    \ any) {\n  sendDataToServer(someArg);\n}\n```\n\n## # strictNullChecks\n\nBy\
    \ default null and undefined are assignable to all types in TypeScript e.g.\n\n\
    ```typescript\nlet foo: number = 123;\nfoo = null; // Okay\nfoo = undefined; //\
    \ Okay\n```\n\nThis is modelled after a lot of people write JavaScript. However\
    \ like all things, TypeScript allows you to be explicit about what can and cannot\
