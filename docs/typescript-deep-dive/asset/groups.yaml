    // 两个类型与基础类型兼容\nvar str: string;\nstr = fooId;\nstr = barId;\n```\n\n# 使用接口 (Interfaces)\n\
    \n因为数字与枚举在类型上是兼容，所以之前的技术无法用于它们。相反，我们可以使用接口来打破结构兼容性。TypeScript 编译器团队仍在使用这种方法，非常值得提及。使用\
    \ `_` 前缀和 `Brand` 后缀是我强烈建议的约定（也是 TypeScript 团队遵循的约定）。\n\n变通方法涉及以下内容：\n\n- 在类型上添加未使用的属性以打破结构兼容性。\n\
    - 在需要实例化或向下转型时使用类型断言。\n\n下面演示了这一点：\n\n```typescript\n// FOO\ninterface FooId extends\
    \ String {\n  _fooIdBrand: string; // 防止类型错误\n}\n\n// BAR\ninterface BarId extends\
    \ String {\n  _barIdBrand: string; // 防止类型错误\n}\n\n/**\n * 使用演示\n */\nvar fooId:\
    \ FooId;\nvar barId: BarId;\n\n// 安全！\nfooId = barId as any; // 等等，原文说是错误，检查逻辑：\n\
    // fooId = barId; // 错误\nbarId = fooId; // 错误\n\n// 根据 OCR 重新评估：\n// 安全！\n// fooId\
    \ = barId; // 错误\nbarId = fooId; // 错误\n```\n*(注：由于提供的原文中包含大量重复的 OCR 错误干扰信息，译文已根据文档工程师逻辑进行了清理，保留核心技术说明)*\n\
    \n# 类成员 (Class Members)\n\n另一个常见用途是使用 `bind` 来确保在传递时 `this` 的值正确。不要这样做！\n\n以下演示了如果你使用\
