    \ just a special type of callable type annotation with the prefix new . It simply\
    \ means that you need to invoke with new e.g.\n\n```\ninterface CallMeWithNewToGetString\
    \ {\n  new(): string\n}\n// Usage\ndeclare const Foo: CallMeWithNewToGetString;\n\
    const bar = new Foo(); // bar is inferred to be of type string\n```"
  - '[PAGE 160]


    # Type Assertion


    TypeScript allows you to override the inferred and analyzed view of types in any
    way you want to. This is done by a mechanism called "type assertion". TypeScript''s
    type assertion is purely by telling the compiler that you know about the types
    better than it does, and that it should not second guess you.


    A common use case for type assertion is when you are porting code from JavaScript
    to TypeScript. For example consider the following pattern:


    ```

    var foo = {};nfoo.bar = 123; // Error: property ''bar'' does not exist on ''{}''

    foo.bas = ''hello''; // Error: property ''bas'' does not exist on ''{}''

    ```


    Here code errors because the inferred type of foo {} i.e. an object with zero
    properties. Therefore you are not allowed to add bar or bas to it. You can fix
    this simply by a type assertion as Foo


    ```

    interface Foo {

    bar: number;

    bas: string;

    }

    var foo = {} as Foo;

    foo.bar = 123;

    foo.bas = ''hello''

    ```


    as foo vs. <foo>


    Originally the syntax that was added was <foo>. This is demonstrated below:


    ```

    var foo: any;

    var bar = <string> foo; // bar is now of type "string"

    ```


    However there is an ambiguity in the language grammar when using <foo> style assertions
    in JSX:


    ```

    var foo = <string>bar;

    </string>

    ```


    Therefore it is now recommended that you just use as foo for consistency.'
  - "[PAGE 161]\n\n# Type Assertion vs. Casting\n\nThe reason why it's not called\
    \ \"type casting\" is that casting generally implies some sort of runtime support.\
    \ However type assertions are purely compile time construct and a way for you\
    \ provide hints to the compiler on how you want your code to be analyzed.\n\n\
    # Assertion considered harmful\n\nIn many cases assertion will allow you to easily\
    \ migrate legacy code (and even copy paste other code samples into your codebase),\
    \ however you should be careful with your use of assertions. Take our original\
    \ code as a sample, the compiler will not protect you from forgetting to actually\
    \ add the properties you promised:\n\n```\ninterface Foo {\n  bar: number;\n \
    \ bas: string;\n}\nvar foo = {} as Foo;\n// ahhhh forget something?\n```\n\nAlso\
    \ another common thought is using an assertion as a means of providing autocomplete\
    \ e.g.:\n\n```\ninterface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo =\
    \ <Foo>;\n// the compiler will provide autocomplete for properties of Foo\n//\
    \ But it is easy for the developer to forget adding all the properties\n// Also\
    \ this code is likely to break if Foo gets refactored (e.g. a new property a\n\
    dded);\n```\n\nthe hazard here is the same, if you forget a property the compiler\
    \ will not complain. It is better if you do the following:\n\n```\ninterface Foo\
    \ {\n  bar: number;\n  bas: string;\n}\nvar foo:Foo = {\n// the compiler will\
    \ provide autocomplete for properties of Foo\n};\n```"
  - "[PAGE 162]\n\nIn some cases you might need to create a temporary variable, but\
    \ at least you will not be making (possibly false) promises and instead relying\
    \ on the type inference to do the checking for you.\n\n# Double assertion\n\n\
    The type assertion despite a bit unsafe as we've shown, is not *completely open*\
    \ season. E.g. the following is a very valid use case (e.g. the user thinks the\
    \ event passed in will be a more specific case of an event) and the type assertion\
    \ works as expected:\n\n```\nfunction handler(event: Event) {\n  let mouseEvent\
    \ = event as MouseEvent;\n}\n```\n\nHowever the following is most likely an error\
    \ and TypeScript will complain as shown despite the user's type assertion:\n\n\
    ```\nfunction handler(event: Event) {\n  let element = event as HTMLElement; //\
    \ Error: Neither 'Event' nor type 'HTMLElement'\nt' is assignable to the other\n\
    }\n```\n\nIf you still want that Type, you can use a double assertion, but first\
    \ asserting to any which is compatible with all types and therefore the compiler\
    \ no longer complains:\n\n```\nfunction handler(event: Event) {\n  let element\
    \ = event as any HTMLElement; // Okay!\n}\n```\n\n# How typescript determines\
    \ if a single assertion is not enough\n\nBasically, the assertion from type s\
    \ to τ succeeds if s is a subtype of τ or t is a subtype of s . This is to provide\
    \ extra safety when doing type assertions ... completely wild assertions can be\
    \ very unsafe and you need to use any to be that unsafe."
- md: "\n- * Freshness\n- Allowing extra properties\n- Use Case: // React\n\n## Freshness\n\
    \nTypeScript provides a concept of **Freshness** (also called *strict object literal\
    \ checking*) to make it easier to type object literals that would otherwise be\
    \ structurally type compatible.\n\nStructural typing is **extremely convenient**.\
    \ Consider the following piece of code. This allows you to **very conveniently**\
    \ upgrade your JavaScript to TypeScript while still preserving a level of type\
    \ safety:\n\n```typescript\nfunction logName({ name: string }) {\n  console.log(something.name);\n\
    }\n\nvar person = { name: 'matt', job: 'being awesome' };\nvar animal = { name:\
    \ 'cow', diet: 'vegan', but has milk of own species' };\nvar random = { note:\
    \ 'I don't have a name property' };\n\nlogName(person); // okay\nlogName(animal);\
    \ // okay\nlogName(random); // Error: property 'name' is missing\n```\n\nHowever\
    \ **structural typing** has a weakness in that it allows you to accept more data\
    \ than it actually does. This is demonstrated in the following code which TypeScript\
    \ will error on as:\n\n```typescript\nfunction logName({ name: string }) {\n \
    \ console.log(something.name);\n}\n\nlogName({ name: 'matt' }); // okay\nlogName({\
    \ name: 'matt', job: 'being awesome' }); // Error: object literals must only specify\
    \ known properties. job is excessive here.\n```\n\nNote that this **only happens\
    \ on object literals**. Without this error one might look at the call `logName({\
    \ name: 'matt', job: 'being awesome' })` and think that **logName** would do something\
    \ useful with `job` where in reality it will completely ignore it.\n\nAnother\
    \ use case is with interfaces that have optional members, without such object\
    \ literal checking, a type would check just fine. This is demonstrated below:\n\
    \n```typescript\nfunction logIfName(something: { name?: string }) {\n  if (something.name)\
    \ {\n    console.log(something.name);\n  }\n}\n```\n\n```typescript\nvar person\
    \ = { name: 'matt', job: 'being awesome' };\nvar animal = { name: 'cow', diet:\
    \ 'vegan', but has milk of own species' };\n```\n\n```typescript\nlogIfName(person);\
    \ // okay\nlogIfName(animal); // okay\nlogIfName({neme: 'I just misspelled name\
    \ to name'}); // Error: object literals only specify known properties. neme is\
    \ excessive here.\n```\n\nThe reason why only object literals are checked this\
    \ way is because in this case additional properties *aren't actually used* is\
    \ almost always a typo or a misunderstanding of the API.\n\n## Allowing extra\
    \ properties\n\nA type can include an index signature to explicitly indicate that\
    \ excess properties are permitted:\n\n```typescript\nvar x: { foo: number, [x:\
    \ string]: any };\nx = { foo: 1, baz: 2 }; // Ok, 'baz' matched by index signature\n\
    ```\n\n## Use Case: React State\n\nReactJS offers a nice use case for object freshness.\
    \ Quite commonly in a component you call setState with only a few properties instead\
    \ of passing in all the properties, i.e.:\n\n```typescript\n// Assuming\ninterface\
    \ State {\n  foo: string;\n  bar: string;\n}\n```\n\n```typescript\n// You want\
    \ to do:\nthis.setState({foo: \"Hello\"}); // Error: missing property bar\n```\n\
    \n```typescript\n// But because state contains both 'foo' and 'bar' TypeScript\
    \ would force you to do:\nthis.setState({foo: \"Hello\", bar: this.state.bar});\n\
    ```\n\nUsing the idea of freshness you would mark all the members as optional\
    \ and you still get to catch typos!\n\n```typescript\n// Assuming\ninterface State\
    \ {\n  foo: string;\n  bar?: string;\n}\n\n// You want to do:\nthis.setState({foo:\
    \ \"Hello\"}); // Yay works fine!\n\n// Because of freshness it's protected against\
    \ typos as well!\nthis.setState({foos: \"Hello\"}); // Error: Objects may only\
    \ specify known properties\n\n// And still type checked\nthis.setState({foo: 123});\
    \ // Error: Cannot assign number to a string\n```\n\n- Type Guard\n- User Defined\
    \ Type Guards\n\n## Type Guard\n\nType Guards allow you to narrow down the type\
    \ of an object within a conditional block.\n\n### typeof\n\nTypeScript is aware\
    \ of the usage of the JavaScript `instanceof` and `typeof` operators. If you use\
    \ these in a conditional block, TypeScript will understand the type of the variable\
    \ to be different within that conditional block. Here is a quick example where\
    \ TypeScript realizes that a particular function does not exist on `string` and\
    \ points out what was probably a user type:\n\n```typescript\nfunction doSomething(x:\
    \ number | string) {\n  if (typeof x === 'string') { // Within the block TypeScript\
    \ knows that `x` must be a string\n    console.log(x.substr(i)); // Error, 'substr'\
    \ does not exist on 'string'\n    console.log(x.substr(i)); // OK\n  }\n  x.substr(i);\
    \ // Error: There is no guarantee that `x` is a `string`\n}\n```\n\n### instanceof\n\
    \nHere is an example with a class and `instanceof` :\n\n```typescript\nclass Foo\
    \ {\n    foo = 123;\n    common = '123';\n}\n\nclass Bar {\n    bar = 123;\n \
    \   common = '123';\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg instanceof\
    \ Foo) {\n    console.log(arg.foo); // OK\n  } else if (arg instanceof Bar) {\n\
    \    console.log(arg.bar); // OK\n  }\n}\n```\n\nWait, the provided OCR text for\
    \ `instanceof` was fragmented and garbled. Let me re-assemble the logical flow\
