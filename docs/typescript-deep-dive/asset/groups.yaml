  - "[PAGE 318]\n\n# SymbolTable\n\nSymbolTable is implemented as a simple HashMap.\
    \ Here is the interface ( types.ts ):\n\n```\ninterface SymbolTable {\n  [index:\
    \ string]: Symbol;\n}\n```\n\nSymbolTables are initialized by binding. There are\
    \ a few SymbolTables used by the compiler:\n\nOn Node :\n\n```\nlocals?: SymbolTable;\
    \                  // Locals associated with node\n```\n\nOn Symbol :\n\n```\n\
    members?: SymbolTable;                 // Class, interface or literal instance\
    \ members\nexports?: SymbolTable;             // Module exports\n```\n\nNote:\
    \ We saw locals getting initialized to { } by bindChildren based on ContainerFlags\
    \ .\n\n# SymbolTable population\n\nSymbolTables are populated with Symbols primarily\
    \ by a call to declareSymbol . This function is presented below in entirety:\n\
    \n```\n/**\n * Declares a Symbol for the node and adds it to symbols. Reports\
    \ errors for conflicting identifier names.\n * @param symbolTable - The symbol\
    \ table which node will be added to.\n * @param parent - node's parent declaration.\n\
    \ * @param node - The declaration to be added to the symbol table\n * @param includes\
    \ - The SymbolFlags that node has addition to its declaration type (export, ambient,\
    \ etc.)\n * @param excludes - The flags which node cannot be declared alongside\
    \ a symbol table. Used for forbidden declarations.\n */\nfunction declareSymbol(symbolTable:\
    \ SymbolTable, parent: Symbol, node: Declaration, in clauses: SymbolTable, excludes:\
    \ SymbolFlags): Symbol {\n  Debug.assert(!hasDynamicName(node));n\n```"
- md: "\n```typescript\n// The exported symbol for an export default function/class\
    \ node is always named \"default\"\nlet name = node.flags & NodeFlags.Default\
    \ && parent ? \"default\" : getDeclaration(node);\n```\n\n```typescript\nlet symbol:\
    \ Symbol;\nif (name !== undefined) {\n```\n\n```typescript\n// Check and see if\
    \ the symbol table already has a symbol with this name. If\n// create a new symbol\
    \ with this name and add it to the table. Note that we\n// give the new symbol\
    \ any flags '*yet'. This ensures that it will not conflict\n// with the 'excludes'\
    \ flags we pass in.\n// If we get an existing symbol, see if it conflicts with\
    \ the new symbol we are\n// creating. For example, a 'var' symbol and a 'class'\
    \ symbol will conflict with\n// the same symbol table. If we have a conflict,\
    \ report the issue on each\n// declaration we have for this symbol, and create\
    \ a new symbol for this\n// declaration.\n// If we created a new symbol, either\
    \ because we didn't have a symbol with this\n// in the symbol table, or we conflicted\
