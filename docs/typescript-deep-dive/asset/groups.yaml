- md: "\n# Rest Parameters\n\nRest parameters (denoted by ...argumentName for the\
    \ last argument) allow you to quickly accept multiple arguments in your function\
    \ and get them as an array. This is demonstrated in the below example.\n\n```\n\
    function iTakeAll(first, second, ...allOthers) {\n  console.log(allOthers);\n\
    }\niTakeAll('foo', 'bar'); // []\niTakeAll('foo', 'bar', 'bas', 'qux'); // ['bas','qux']\n\
    ```\n\nRest parameters can be used in any function be it function / => / class\
    \ member.\n\n# Variables in JavaScript are function scoped. This is different\
    \ from many other languages (C# / Java etc.) where the variables are block scoped.\
    \ If you bring a block mindset to JavaScript, you would expect the following to\
    \ print 123, instead it will print 456:\n\n```\nvar foo = 123;\nif (true) {\n\
    \  var foo = 456;\n}\nconsole.log(foo); // 456\n```\n\nThis is because { } does\
    \ not create a new variable scope. The variable foo is the same inside the if\
    \ block as it is outside the if block. This is a common source of errors in JavaScript\
    \ programming. This is why TypeScript (ES6) introduces the let keyword to allow\
    \ you to define variables with true block scope. If you use let instead of var\
    \ you get a unique element disconnected from what you might have defined outside\
    \ the scope. The same example is demonstrated with let:\n\n```\nlet foo = 123;\n\
    if (true) {\n  let foo = 456;\n}\nconsole.log(foo); // 123\n```\n\nAnother place\
    \ where let would save you from errors is loops.\n\n```\nvar index = 0;\nvar array\
    \ = [1, 2, 3];\nfor (let index = 0; index < array.length; index++) {\n  console.log(array[index]);\n\
    }\nconsole.log(index); // 0\n```\n\nIn all we find it better to use let whenever\
    \ possible as it leads to lesser surprises for new and existing multi-lingual\
    \ developers.\n\n# Functions create a new scope\n\nSince we mentioned it, we'd\
    \ like to demonstrate that functions create a new variable scope in JavaScript.\
    \ Consider the following:\n\n```\nvar foo = 123;\nfunction test() {\n  var foo\
    \ = 456;\n}\ntest();\nconsole.log(foo); // 123\n```\n\nThis behaves as you would\
    \ expect. Without this it would be very difficult to write code in JavaScript.\n\
    \n# Generated JS\n\nThe JS generated by TypeScript is simple renaming of the let\
    \ variable if a similar name already exists in the surrounding scope. E.g. the\
    \ following is generated as with a simple replacement of var with let:\n\n```\n\
    if (true) {\n  let foo = 123;\n}\n\n// becomes //\n\nif (true) {\n  var foo =\
    \ 123;\n}\n```\n\nHowever if the variable name is already taken by the surrounding\
    \ scope then a new variable name is generated as shown (notice _foo):\n\n```\n\
    var foo = '123';\nif (true) {\n  let foo = 123;\n}\n\n// becomes //\n\nvar foo\
    \ = '123';\nif (true) {\n  var _foo = 123; // Renamed\n}\n```\n\n# Switch\n\n\
    You can wrap your case bodies in {} to reuse variable names reliably in different\
    \ case statement as shown below:\n\n```\nswitch (name) {\n  case 'x': {\n    let\
    \ x = 5;\n    // ...\n    break;\n  }\n  case 'y': {\n    let x = 10;\n    //\
    \ ...\n    break;\n  }\n}\n```\n\n# let in closures\n\nA common programming interview\
    \ question for a JavaScript developer is what the log of this simple file:\n\n\
    ```\nvar funcs = [];\n// create a bunch of functions\nfor (var i = 0; i < 3; i++)\
    \ {\n  funcs.push(function() {\n    console.log(i);\n  });\n}\n// call them\n\
    for (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\nOne would have expected\
    \ it to be 0,1,2. Surprisingly it is going to be 3 for all three functions. Reason\
    \ is that all three functions are using the variable i from the outer scope and\
    \ at the time we execute them (in the second loop) the value of i will be 3 (that's\
    \ the termination condition for the first loop).\n\nA fix would be to create a\
    \ new variable in each loop specific to that loop iteration. As we've learned\
    \ before we can create a new variable scope by creating a new function and immediately\
    \ executing it (i.e. the IIFE pattern from classes (function() { /* * */ body\
    \ }(); ) ) as shown below:\n\n```\nvar funcs = [];\n// create a bunch of functions\n\
    for (var i = 0; i < 3; i++) {\n  (function() {\n    var local = 1;\n    funcs.push(function()\
    \ {\n      console.log(local);\n    });\n  })();\n}\n// call them\nfor (var j\
    \ = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\nThe functions close over (hence\
    \ called a closure) the local variable (conveniently named local) and use instead\
    \ of loop i. Note that closure comes with performance impact (they need to store\
    \ surrounding state). The ES6 let keyword in a loop would have the same behavior\
    \ as the previous example:\n\n```\nvar funcs = [];\n// create a bunch of functions\n\
    for (var i = 0; i < 3; i++) {\n  funcs.push(function() {\n    console.log(i);\n\
    \  });\n}\n// call them\nfor (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\
    \nUsing let instead of var creates a variable unique to each iteration.\n\n# Summary\n\
    \nlet is extremely useful to have for the vast majority of code. It can greatly\
    \ enhance your readability and decrease the chance of programming error.\n\n#\
    \ const\n\nconst is a welcomed addition offered by ES6. It allows you to be immutable\
    \ with variables. This is good from documentation as well as runtime perspective\
    \ (IMHO). To use const replace var:\n\n```\nconst foo = 123;\n```\n\n# const declarations\
    \ must be initialized\n\nThe following is a compiler error:\n\n```\nconst foo;\
    \ // ERROR: declarations must be initialized\n```\n\n# Left hand side of assignment\n\
    \nConstants are immutable after creation, so if you try to assign them to a new\
    \ value it is compiler error:\n\n```\nconst foo = 123;\nfoo = 456; // ERROR: Left\
    \ hand side of assignment cannot be constant\n```\n\n# Block Scoped\n\nconst is\
    \ block scoped like we saw with let:\n\n```\nfoo = 123;\nif (true) {\n  const\
    \ foo = 456; // Allowed as variable limited to block\n}\n```\n\n# Deep immutability\n\
    \nconst works with object literals as well, as far as protecting the reference\
    \ concerned:\n\n```\nconst foo = { bar: 123 };\nfoo = { bar: 456 }; // ERROR:\
    \ Left hand of assignment cannot be constant\n```\n\nHowever it still allows properties\
    \ of objects to be mutated, as shown below:\n\n```\nconst foo = { bar: 123 };\n\
    foo.bar = 456; // Allowed!\nconsole.log(foo); // { bar: 456 }\n```\n\nFor this\
    \ reason I recommend using const with primitives or data structures.\n\n# Destructuring\n\
    \nTypeScript supports the following forms of Destructuring (literally named breaking\
    \ up the structure):\n\n1. Object Destructuring\n2. Array Destructuring\n\nIt\
    \ is easy to think of destructuring as an inverse of restructuring. The method\
    \ of destructuring in JavaScript is the object literal:\n\n```\nvar foo = {\n\
    \  bar: {\n    bas: 123\n  }\n};\n```\n\nWithout the awesome restructuring support\
    \ built into JavaScript, creating new objects on the fly would indeed be cumbersome.\
    \ Destructuring brings the same level of convenience to getting data out of a\
    \ structure.\n\n# Object Destructuring\n\nDestructuring is useful because it allows\
    \ you to do in a single line what would otherwise require multiple lines. Consider\
    \ the following case:\n\n```\nvar rect = { x: 0, y: 10, width: 15, height: 20\
    \ };\n\n// Destructuring assignment\nvar {x, y, width, height} = rect;\nconsole.log(x,\
    \ y, width, height); // 0,10,15,20\n\nrect.x = 10;\n({x, y, width, height} = rect);\
    \ // assign to existing variables using outer parentheses\n\nconsole.log(x, y,\
    \ width, height); // 0,10,15,20\n```\n\nHere in the absence of destructuring you\
    \ would have to pick off `x,y,width,height` one by one from `rect`.\n\nTo assign\
    \ an extracted variable to a new variable name you can do the following:\n\n```\n\
    const obj = {\"some property\": \"some value\"};\n\n// destructure\nconst {\"\
    some property\": someProperty} = obj;\nconsole.log(someProperty) === \"some value\"\
    ; // true\n```\n\nAdditionally you can get deep data out of a structure using\
    \ destructuring. This is shown in the example:\n\n```\nvar foo = { bar: { bas:\
    \ 123 } };\nvar {bar: {bas}} = foo; // Effectively `var bar = foo.bar.bas;`\n\
    ```\n\n# Object Destructuring with rest\n\nYou can pick up any number of elements\
    \ from the object and get an object of the remaining elements using destructuring\
    \ with rest.\n\n```\nvar {w, ...remaining} = {w: 1, x: 2, y: 3, z: 4};\nconsole.log(w,\
    \ x, remaining); // 1, 2, {y:3,z:4}\n```\n\nA common case is also to ignore certain\
    \ properties. For example:\n\n```javascript\n// Example function\nfunction goto(point2D:\
    \ {x: number, y: number}) {\n// Imagine some code that might break\n// if you\
    \ pass in an object\n// with more items desired\n}\n// Some point to get from\
    \ somewhere\nconst point3D = {x: 1, y: 2, z: 3};\n/** A nifty use of rest to remove\
    \ extra properties */\nconst {z, ...point2D} = point3D;\ngoto(point2D);\n```\n\
    \n# Array Destructuring\n\nA common programming question: \"How to swap two variables\
    \ without using a third one?\" The TypeScript solution:\n\n```\nvar x = 1, y =\
    \ 2;\n[x, y] = [y, x];\nconsole.log(x, y); // 2, 1\n```\n"
  mdcn: "\n\n# 剩余参数 (Rest Parameters)\n\n剩余参数（最后一个参数用 `...argumentName` 表示）允许你在函数中快速接收多个参数，并以数组的形式获取它们。下面的示例演示了这一点。\n\
    \n```\nfunction iTakeAll(first, second, ...allOthers) {\n  console.log(allOthers);\n\
    }\niTakeAll('foo', 'bar'); // []\niTakeAll('foo', 'bar', 'bas', 'qux'); // ['bas','qux']\n\
    ```\n\n剩余参数可以用任何函数，无论是箭头函数 `/ => /` 还是类成员。\n\n# JavaScript 中的变量是函数作用域的。这与许多语言（C#\
    \ / Java 等）不同，后者的变量是块作用域的。如果你将块思维带入 JavaScript，你可能会期望以下代码打印 123，但实际上它会打印 456：\n\
    \n```\nvar foo = 123;\nif (true) {\n  var foo = 456;\n}\nconsole.log(foo); //\
    \ 456\n```\n\n这是因为 `{ }` 不会创建一个新的变量作用域。变量 `foo` 在 `if` 块内部和外部是同一个。这是 JavaScript\
    \ 编程中常见的错误来源。这就是为什么 TypeScript (ES6) 引入了 `let` 关键字，允许你定义具有真实块作用域的变量。如果你使用 `let`\
    \ 代替 `var`，你将获得一个与作用域外定义的变量相互隔离的唯一元素。相同的示例使用 `let` 如下：\n\n```\nlet foo = 123;\n\
    if (true) {\n  let foo = 456;\n}\nconsole.log(foo); // 123\n```\n\n另一个 `let` 让你免于错误的地方是循环。\n\
    \n```\nvar index = 0;\nvar array = [1, 2, 3];\nfor (let index = 0; index < array.length;\
    \ index++) {\n  console.log(array[index]);\n}\nconsole.log(index); // 0\n```\n\
    \n总而言之，我们认为尽可能使用 `let` 更好，因为它对于新开发者和现有多语言开发者来说产生产生意外意外。\n\n# 函数创建新作用域\n\n既然提到了这一点，我们想演示函数在\
    \ JavaScript 中会创建一个新的变量作用域。考虑以下情况：\n\n```\nvar foo = 123;\nfunction test() {\n\
    \  var foo = 456;\n}\ntest();\nconsole.log(foo); // 123\n```\n\n这种行为符合你的预期。如果没有这一点，在\
    \ JavaScript 中编写代码将非常困难。\n\n# 生成的 JS\n\nTypeScript 生成的 JS 如果在周围作用域中已经存在相似名称，则会对\
    \ `let` 变量进行简单的重命名。例如，以下内容通过将 `var` 简单替换为 `let` 生成：\n\n```\nif (true) {\n  let\
    \ foo = 123;\n}\n\n// 变为 //\n\nif (true) {\n  var foo = 123;\n}\n```\n\n然而，如果变量名已被周围作用域占用，则会生成一个新的变量名如所示（注意\
    \ `_foo`）：\n\n```\nvar foo = '123';\nif (true) {\n  let foo = 123;\n}\n\n// 变为\
    \ //\n\nvar foo = '123';\nif (true) {\n  var _foo = 123; // 重命名\n}\n```\n\n# Switch\n\
    \n你可以将 case 体封装在 `{}` 中，以便在不同的 `case` 语句中可靠地重用变量名，如下所示：\n\n```\nswitch (name)\
    \ {\n  case 'x': {\n    let x = 5;\n    // ...\n    break;\n  }\n  case 'y': {\n\
    \    let x = 10;\n    // ...\n    break;\n  }\n}\n```\n\n# 闭包中的 let\n\nJavaScript\
    \ 开发者一个常见的编程面试题是这个简单文件的日志：\n\n```\nvar funcs = [];\n// 创建一组函数\nfor (var i = 0;\
    \ i < 3; i++) {\n  funcs.push(function() {\n    console.log(i);\n  });\n}\n//\
    \ 调用它们\nfor (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\n人们可能会预期是 0, 1,\
    \ 2。但惊讶的是，结果是 3。原因是所有三个函数都使用外部作用域的变量 `i`，而在执行它们时（第一个循环），`i` 的值将是 3（第一个循环的终止条件）。修复方法是在每个循环中创建一个新变量。正如我们之前学的，通过\
    \ IIFE（立即执行函数表达式）模式可以创建一个新的作用域，如下：\n\n```\nvar funcs = [];\nfor (var i = 0; i\
    \ < 3; i++) {\n  funcs.push((function() {\n    var local = i;\n    console.log(local);\n\
    \  })());\n}\n// 调用它们\nfor (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\n\
    在没有解构的情况下，你必须从 `rect` 中逐一个提取 `x,y,width,height`。要将提取的变量赋值给新的变量名，你可以这样做：\n\n```javascript\n\
    const obj = {\"some property\": \"some value\"};\n\n// 解构\nconst {\"some property\"\
    : someProperty} = obj;\nconsole.log(someProperty) === \"some value\"; // true\n\
    ```\n\n此外，你可以使用解构从结构中获取深层数据。示例所示：\n\n```\nvar foo = { bar: { bas: 123 } };\nvar\
    \ {bar: {bas}} = foo; // 相当于 `var bas = foo.bar.bas;`\n```\n\n# 解构\n\nTypeScript\
    \ 支持以下形式的构（字面上的分解结构）：\n\n1. 对象解构\n2. 数组解构\n\n很容易将解构构造为重构的逆过程。JavaScript 中的解构方法是对象字面量：\n\
    \n```\nvar foo = {\n  bar: {\n    bas: 123\n  }\n};\n```\n\n如果没有 JavaScript 内置强大的重构支持，动态创建新对象将非常繁琐。解构为从结构中获取数据带来了同样的便利性。\n\
    \n# 对象解构\n\n解构非常有用，因为它允许你在一行内完成原本需要多行完成的操作。考虑以下情况：\n\n```\nvar rect = { x: 0,\
    \ y: 10, width: 15, height: 20 };\n\n// 解构赋值\nvar {x, y, width, height} = rect;\n\
    console.log(x, y, width, height); // 0,10,15,20\n\nrect.x = 10;\n({x, y, width,\
    \ height} = rect); // 使用外部括号赋值给现有变量\n\nconsole.log(x, y, width, height); // 0,10,15,20\n\
    ```\n\n# 带有剩余的对象解构\n\n你可以使用剩余解构从对象中提取任意数量的元素并获取剩余元素的对象。\n\n```\nvar {w, ...remaining}\
    \ = {w: 1, x: 2, y: 3, z: 4};\nconsole.log(w, x, remaining); // 1, 2, {y:3,z:4}\n\
    ```\n\n常见情况也是忽略某些属性。例如：\n\n```javascript\n// 示例函数\nfunction goto(point2D: {x:\
    \ number, y: number}) {\n// 假设某些代码在传入带有更多项的对象的时可能会崩溃\n}\n// 从某处获取的点\nconst point3D\
    \ = {x: 1, y: 2, z: 3};\n/** 使用剩余移除额外属性的妙用 */\nconst {z, ...point2D} = point3D;\n\
    goto(point2D);\n```\n\n# 总结\n\n`let` 对于大多数代码都极其有用。它可以极大地提高可读性并减少编程错误的概率。\n\n#\
    \ const\n\n`const` 是 ES6 欢迎的特性。它允许变量是不可变的，这从文档和运行角度来看都是好的。\n\n```\nconst foo =\
    \ 123;\n```\n\n# const 必须初始化\n\n以下是编译器错误：\n\n```\nconst foo; // ERROR: 必须初始化\n\
    ```\n\n# 赋值左侧\n\n常量在创建后是不可变的，所以如果你尝试给它们赋值新值，则是编译器错误：\n\n```\nconst foo = 123;\n\
    foo = 456; // : 赋值左侧不能为常量\n```\n\n# 块作用域\n\n`const` 和 `let` 一样具有块作用域：\n\n```\n\
    foo = 123;\nif (true) {\n  const foo = 456; // 限于块\n}\n```\n\n# 深度不可变性\n\n`const`\
    \ 也适用于对象字面量，只要涉及引用的话：\n\n```\nconst foo = { bar: 123 };\nfoo = { bar: 456 }; //\
