    \ well motivated. If you do stuff like shown in this example, then, in the rest\
    \ of your code, you cannot be certain that foo is a number or a string. Such issues\
    \ turn up in large multi-file code bases. We will deep dive into the type inference\
    \ rules later.\n\n## Types can be Explicit\n\nAs we've mentioned before, TypeScript\
    \ will infer as much as it can safely, however you can use annotations to:\n\n\
    - 1. Help along the compiler, and more importantly document stuff for the next\
    \ developer who has read your code (that might be you!).\n- 2. Enforce that what\
    \ the compiler sees, is what you thought it should see. That is, your understanding\
    \ of the code matches an algorithmic analysis of the code (done by the compiler).\n\
    \nTypeScript uses postfix type annotations popular in other optionally annotated\
    \ languages (e.g. ActionScript and F#).\n\n```typescript\nfoo: number = 123;\n\
    ```\n\nSo if you do something wrong the compiler will error e.g.:\n\n```typescript\n\
    foo: number = '123'; // Error: cannot assign a `string` to a `number`\n```\n\n\
    We will discuss all the details of the annotation syntax supported by TypeScript\
    \ in a later chapter.\n\n## Types are structural\n\nIn some languages (specifically\
    \ nominally typed ones) static typing results in unnecessary ceremony because\
    \ even though you know that the code will work fine the language semantics force\
    \ you to copy stuff around. This is why stuff like automapper for C# is vital\
    \ for C#. In TypeScript because we really want it to be easy for JavaScript developers\
    \ with a minimum cognitive overload, types are structural. This means that duck\
    \ typing is a first class language construct. Consider the following example.\
    \ The function `itPoint2D` will accept anything that contains all the things (x\
    \ and y) it expects:\n\n```typescript\ninterface Point2D {\n  x: number;\n  y:\
    \ number;\n}\ninterface Point3D {\n  x: number;\n  y: number;\n  z: number;\n\
    }\nvar point2D: Point2D = { x: 0, y: 10 };\nvar point3D: Point3D = { x: 0, y:\
    \ 10, z: 20 };\nfunction itTake2D(point: Point2D) { /* do something */ }\n\nitPoint2D(point2D);\
    \ // exact match okay\nitPoint2D(point3D); // extra information okay\nitPoint2D({\
    \ x: 0 }); // Error: missing information ``\n```\n\n## Type errors do not prevent\
    \ JavaScript emit\n\nTo make it easy for you to migrate your JavaScript code to\
    \ TypeScript, even if there are compilation errors, by default TypeScript will\
    \ emit valid JavaScript the best that it can. e.g.:\n\n```javascript\nvar foo\
    \ = 123;\nfoo = '456'; // Error: cannot assign a 'string' to a `number`\n```\n\
    \nwill emit the following js:\n\n```javascript\nvar foo = 123;\nfoo = '456';\n\
    ```\n\nSo you can incrementally upgrade your JavaScript code to TypeScript. This\
    \ is very different from how many other language compilers work and yet another\
    \ reason to move to TypeScript.\n\n## Types can be ambient\n\nA major design goal\
    \ of TypeScript was to make it possible for you to safely and easily use existing\
    \ JavaScript libraries in TypeScript. TypeScript does this by means of declaration.\
    \ TypeScript provides you with a sliding scale of how much or how little effort\
    \ you want to in your declarations, the more effort you put the more type safety\
    \ + code intelligence you get. Note that definitions for most of the popular JavaScript\
    \ libraries have already been written for you by the DefinitelyTyped community\
    \ so for most purposes either:\n\n- 1. The definition file already exists.\n-\
    \ 2. Or at the very least, you have a vast list of well reviewed TypeScript declaration\
    \ templates already available\n\nAs a quick example of how you would author your\
    \ own declaration file, consider a trivial example of jquery. By default (as is\
    \ to expected of good JS code) TypeScript expects you to declare (i.e. use `var`)\
    \ before you use a variable name\n\n```javascript\n$('.awesome').show(); // Error:\
    \ cannot find name $\n```\n\nAs a quick fix **you can tell TypeScript** that is\
    \ indeed something called de:\n\n```typescript\ndeclare var $: {\n  (selector:string):\
    \ any;\n}\n$('.awesome').show(); // Okay!\n$(123).show(); // Error: selector needs\
    \ to be a string\n```\n\nIf you want to build on this basic definition and provide\
    \ more information to protect you from errors:\n\n```typescript\ndeclare var $:\
    \ {\n  (selector:string): any;\n}\n$('.awesome').show(); // Okay!\n$(123).show();\
    \ // Error: selector needs to be a string\n```\n\nWe will discuss the details\
    \ of creating TypeScript definitions for JavaScript in detail later once you know\
    \ more about TypeScript (e.g. like `interface` and the `any`).\n\n## Future JavaScript\
    \ => Now\n\nTypeScript provides a number of features that are planned in ES6 for\
    \ current JavaScript engines (that only support ES5 etc). The TypeScript team\
    \ is actively adding these features and this list is only going to get bigger\
    \ over time and we will cover this in its own section. But just as a specimen\
    \ here is an example of a class:\n\n```typescript\nclass Point {\n  constructor(public\
    \ x: number, public y: number) {\n  }\n  add(point: Point) {\n    return new Point(this.x\
    \ + point.x, this.y + point.y);\n  }\n}\nvar p1 = new Point(10, 20);\nvar p2 =\
    \ new Point(30, 40);\nvar p3 = p1.add(p2);\n```\n\n## Summary\n\nIn this section\
    \ we have provided some things that you need to know in order to not be caught\
    \ off guard. Let's discuss them next.\n"
