    # Compiler


    The typescript compiler source is located under the `src/compiler` folder.


    It is split into the following key parts:


    +   - Scanner ( `scanner.ts` )

    - Parser ( `parser.ts` )

    - Binder ( `binder.ts` )

    - Checker ( `checker.ts` )

    - Emitter ( `emitter.ts` )


    Each of these get their own unique inline files in the source. These parts will
    be explained later on this chapter.


    # BYOTS


    We have a project called Bring Your Own TypeScript (BYOTS) which makes it easier
    to play around with the compiler API e.g. by exposing internal APIs. You can use
    it to expose your local app''s version of TypeScript globally.


    # Syntax vs. Semantics


    Just because something is *syntactically* correct doesn''t mean it is *semantically*
    correct. Consider the following piece of TypeScript code which although *syntactically*
    valid is *semantically* wrong


    ```

    var foo: number = "not a number";

    ```


    Semantic means "meaning" in English. This concept is useful to have in your head.


    # Processing Overview


    The following is a quick review of how these key parts of the TypeScript compiler
    compose:


    ```

    Source -- scanner --> Token Stream

    ```'
