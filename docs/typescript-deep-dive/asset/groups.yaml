    # Your JavaScript is TypeScript


    There were (and will continue to be) a lot of competitors in *Some syntax to JavaScript*
    compilers. TypeScript is different from them in that *Your JavaScript is TypeScript*.
    Here''s a diagram:


    ![](img/7b4ede152e837dfd4e13fc18de91d96a_14_0.png)


    However it does mean that you **need to learn JavaScript** (the good news is you
