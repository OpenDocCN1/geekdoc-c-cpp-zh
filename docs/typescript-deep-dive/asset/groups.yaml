    \n```typescript\nconst add: typeof adder.add = adder.add.bind(adder);\n```\n\n\
    # Bind 是有害的 (Bind is Harmful)\n\n如你所见，调用 `bind` 会丢失参数安全。例如以下代码可以编译：\n\n```typescript\n\
    class Adder {\n  constructor(public a: string) {\n\n  add(b: string): string {\n\
