    \ carefully you realize the meaning of a, b, c, d change based on how many arguments\
    \ are passed in. Also the function only expects 1, 2 or 4 arguments. These constraints\
    \ can be enforced and documented using function overloading. You just:\n\n+  \
    \ - declare the function header multiple times,\n- the last function header is\
