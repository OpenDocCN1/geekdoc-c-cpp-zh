    \n# 特殊类型 (Special Types)\n\n除了涵盖的原始类型外，还有几种类型在 TypeScript 中具有特殊含义。这些是 `any`、`null`、`void`。\n\
    \n# any\n\n`any` 类型在类型系统中占据特殊地位。它提供了一个逃离类型系统的出口，告诉编译器 `any` 与所有类型兼容。这意味着任何内容都可以赋值给它，如下例所示：\n\
