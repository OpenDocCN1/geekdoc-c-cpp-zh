  - "[PAGE 42]\n\n# Variables in JavaScript are function scoped. This is different\
    \ from many other languages (C# / Java etc.) where the variables are block scoped.\
    \ If you bring a block mindset to JavaScript, you would expect the following to\
    \ print 123 , instead it will print 456 :\n\n```\nvar foo = 123;\nif (true) {\n\
    \  var foo = 456;\n}\nconsole.log(foo); // 456\n```\n\nThis is because { does\
    \ not create a new variable scope. The variable foo is the same inside the if\
    \ block as it is outside the if block. This is a common source of errors in JavaScript\
    \ programming. This is why TypeScript (ES6) introduces the let keyword to allow\
    \ you to define variables with true block scope. If that is you use let instead\
    \ of var you get a unique element disconnected from what you might have defined\
    \ outside the scope. The same example is demonstrated with let :\n\n```\nlet foo\
    \ = 123;\nif (true) {\n  let foo = 456;\n}\nconsole.log(foo); // 123\n```\n\n\
    Another place where let would save you from errors is loops.\n\n```\nvar index\
    \ = 0;\nvar array = [1, 2, 3];\nfor (let index = 0; index < array.length; index++)\
    \ {\n  console.log(array[index]);\n}\nconsole.log(index); // 0\n```\n\nIn all\
    \ we find it better to use let whenever as possible as it leads to lesser surprises\
    \ for new and existing multi-lingual developers.\n\n# Functions create a new scope\n\
    \nSince we mentioned it, we'd like to demonstrate that functions create a new\
    \ variable scope in JavaScript. Consider the following:"
  - "[PAGE 43]\n\n```\nvar foo = 123;\nfunction test() {\n  var foo = 456;\n}\ntest();\n\
    console.log(foo); // 123\n```\n\nThis behaves as you would expect. Without this\
    \ it would be very difficult to write code in JavaScript.\n\n# Generated JS\n\n\
    The JS generated by TypeScript is simple renaming of the let variable if a similar\
    \ name already exists in the surrounding scope. E.g. the following is generated\
    \ as with a simple replacement of var with let :\n\n```\nif (true) {\n  let foo\
    \ = 123;\n}\n\n// becomes //\n\nif (true) {\n  var foo = 123;\n}\n```\n\nHowever\
    \ if the variable name is already taken by the surrounding scope then a new variable\
    \ name is generated as shown (notice _foo):\n\n```\nvar foo = '123';\nif (true)\
    \ {\n  let foo = 123;\n}\n\n// becomes //\n\nvar foo = '123';\nif (true) {\n \
    \ var _foo = 123; // Renamed\n}\n```\n\n# Switch\n\nYou can wrap your case bodies\
    \ in {} to reuse variable names reliably in different case statement as shown\
    \ below:"
  - "[PAGE 44]\n\n```\nswitch (name) {\n  case 'x': {\n    let x = 5;\n    // ...\n\
    \    break;\n  }\n  case 'y': {\n    let x = 10;\n    // ...\n    break;\n  }\n\
    }\n```\n\n# let in closures\n\nA common programming interview question for a JavaScript\
    \ developer is what the log of this simple file:\n\n```\nvar funcs = [];\n// create\
    \ a bunch of functions\nfor (var i = 0; i < 3; i++) {\n  funcs.push(function()\
    \ {\n    console.log(i);\n  });\n}\n// call them\nfor (var j = 0; j < 3; j++)\
    \ {\n  funcs[j]();\n}\n```\n\nOne would have expected it to be 0,1,2 . Surprisingly\
    \ it is going to be 3 for all three functions. Reason is that all three functions\
    \ are using the variable i from the outer scope and at the time we execute them\
    \ (in the second loop) the value of i will be 3 (that's the termination condition\
    \ for the first loop).\n\nA fix would be to create a new variable in each loop\
    \ specific to that loop iteration. As we've learned before we can create a new\
    \ variable scope by creating a new function and immediately executing it (i.e.\
    \ the IIFE pattern from classes (function() { /* * */ body }(); ) as shown below:"
  - "[PAGE 45]\n\n```\nvar funcs = [];\n// create a bunch of functions\nfor (var i\
    \ = 0; i < 3; i++) {\n  function() {\n    var local = 1;\n    funcs.push(function()\
    \ {\n      console.log(local);\n    });\n  }}\n}();\n// call them\nfor (var j\
    \ = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\nThe functions close over (hence\
    \ called a closure) the local variable (conveniently named local) and use instead\
    \ of the loop variable i.\n\n> Note that closure comes with a performance impact\
    \ (they need to store the surrounding state).\n\nThe ES6 let keyword in a loop\
    \ would have the same behavior as the previous example:\n\n```\nvar funcs = [];\n\
    // create a bunch of functions\nfor (let i = 0; i < 3; i++) { // Note the use\
    \ of let\nfuncs.push(function() {\n  console.log(i);\n})}\n}\n// call them\nfor\
    \ (var j = 0; j < 3; j++) {\n  funcs[j]();\n}\n```\n\nUsing a let instead of var\
    \ creates a variable i unique to each iteration.\n\n# Summary\n\nlet is extremely\
    \ useful to have for the vast majority of code. It can greatly enhance your code\
    \ readability and decrease the chance of a programming error."
  - '[PAGE 46]


    # const


    const is a very welcomed addition offered by ES6 / TypeScript. It allows you to
    be immutable with variables. This is good from a documentation as well as a runtime
    perspective. To use const replace var with const :


    ```

    const foo = 123;

    ```


    The syntax is much better (IMHO) than other languages that force the user to type
    something like let const foo i.e. a variable + behavior specifier.


    const is a good practice for both readability and maintainability and avoids using
    magic literals e.g.


    ```

    // readability

    if (x > 10) {

    }


    // Better!

    const maxRows = 10;

    if (x > maxRows) {

    }

    ```


    # const declarations must be initialized


    The following is a compiler error:


    ```

    const foo; // ERROR: const declarations must be initialized

    ```


    # Left hand side of assignment cannot be a constant


    Constants are immutable after creation, so if you try to assign them to a new
    value it is a compiler error:


    ```

    const foo = 123;

    foo = 456; // ERROR: Left-hand side of an assignment expression cannot be a constant

    ```


    # Block Scoped


    A const is block scoped like we saw with let :'
  - "[PAGE 47]\n\n```\nfoo = 123;\nif (true) {\n  const foo = 456; // Allowed as its\
    \ new variable limited to this `if` block\n}\n```\n\n# Deep immutability\n\nA\
    \ const works with object literals as well, as far as protecting the variable\
    \ reference is concerned:\n\n```\nconst foo = { bar: 123 };\nfoo = { bar: 456\
    \ }; // ERROR : Left hand of an assignment expression cannot be constant\n```\n\
    \nHowever it still allows sub properties of objects to be mutated, as shown below:\n\
    \n```\nconst foo = { bar: 123 };\nfoo.bar = 456; // Allowed!\nconsole.log(foo);\
    \ // { bar: 456 }\n```\n\nFor this reason I recommend using const with primitives\
    \ or immutable data structures."
  - "[PAGE 48]\n\n# Destructuring\n\nTypeScript supports the following forms of Destructuring\
    \ (literally named after de-structuring i.e. breaking up the structure):\n\n+\
    \   1. Object Destructuring\n2. Array Destructuring\n\nIt is easy to think of\
    \ destructuring as an inverse of *structuring*. The method of *structuring* in\
    \ JavaScript is the object literal:\n\n```\nvar foo = {\n  bar: {\n    bas: 123\n\
    \  }\n};\n```\n\nWithout the awesome *structuring* support built into JavaScript,\
    \ creating new objects on the fly would indeed be very cumbersome. Destructuring\
    \ brings the same level of convenience to getting data out of a structure.\n\n\
    # Object Destructuring\n\nDestructuring is useful because it allows you to do\
    \ in a single line, what would otherwise require multiple lines. Consider the\
    \ following case:\n\n```\nvar rect = { x: 0, y: 10, width: 15, height: 20 };\n\
    \n// Destructuring assignment\nvar {x, y, width, height} = rect;\nconsole.log(x,\
    \ y, width, height); // 0,10,15,20\n\nrect.x = 10;\n({x, y, width, height} = rect);\
    \ // assign to existing variables using outer parentheses\n\nconsole.log(x, y,\
    \ width, height); // 0,10,15,20\n```\n\nHere in the absence of destructuring you\
    \ would have to pick off `x,y,width,height` one by one from `rect`.\n\nTo assign\
    \ an extracted variable to a new variable name you can do to the following:"
  - '[PAGE 49]


    ```

    const obj = {"some property": "some value"};

    ```


    ```

    // destructure

    const {"some property": someProperty} = obj;

    console.log(someProperty) === "some value"; // true

    ```


    Additionally you can get deep data out of a structure using destructuring. This
    is shown in the example:


    ```

    var foo = { bar: { bas: 123 } };

    var {bar: {bas}} = foo; // Effectively `var bar = foo.bar.bas;`

    ```


    # Object Destructuring with rest


    You can pick up any number of elements from the object and get an object of the
    remaining elements using destructuring with rest.


    ```

    var {w, ...remaining} = {w: 1, x: 2, y: 3, z: 4};

    console.log(w, x, remaining); // 1, 2, {y:3,z:4})

    ```


    A common case is also to ignore certain properties. For example:


    ```

    // Example function

    function goto(point2D: {x: number, y: number}) {

    // Imagine some code that might break

    // if you pass in an object

    // with more items desired

    }

    // Some point to get from somewhere

    const point3D = {x: 1, y: 2, z: 3};

    /** A nifty use of rest to remove extra properties */

    const {z, ...point2D} = point3D;

    goto(point2D);

    ```


    # Array Destructuring


    A common programming question: "How to swap two variables without using a third
    one?" The TypeScript solution:


    ```

    var x = 1, y = 2;

    [x, y] = [y, x];

    console.log(x, y); // 2, 1

    ```'
- md: "\nNote that array destructuring is effectively the compiler doing [], [1],\
    \ ... and so on for you. There is no guarantee that these values will exist.\n\
    \n## Array Destructuring with rest\n\nYou can pick up any number of elements from\
    \ the array and get an array of the remaining elements using array destructuring\
    \ with rest.\n\n```javascript\nvar [x, y, ...remaining] = [1, 2, 3, 4];\nconsole.log(x,\
    \ y, remaining); // 1, 2, [3,4]\n```\n\n## Array Destructuring with ignores\n\n\
    You can ignore any index by simply leaving it empty i.e. , , in the left hand\
    \ side of the assignment. For example:\n\n```javascript\nvar [x, , ...remaining]\
    \ = [1, 2, 3, 4];\nconsole.log(x, remaining); // 1, [3,4]\n```\n\n## JS Generation\n\
    \nThe JavaScript generation for non ES6 targets simply involves creating temporary\
    \ variables, like you would have to do yourself without native language support\
    \ for destructuring e.g.\n\n```javascript\nvar x = 1, y = 2;\n[x, y] = [y, x];\n\
    console.log(x, y); // 2,1\n\n// becomes =\nvar x = 1, y = 2;\n_a = [y,x], x =\
    \ _a[0], y = _a[1];\nconsole.log(x, y);\nvar _a;\n```\n\n## Summary\n\nDestructuring\
    \ can make your code more readable and maintainable by reducing the line count\
    \ and making the intent clear. Array destructuring can allow you to use arrays\
    \ as though they were tuples.\n\n## Spread Operator\n\nThe main objective of the\
    \ spread operator is to *spread* the elements of an array or object. This is best\
    \ explained with examples.\n\n## Apply\n\nA common use case is to spread an array\
    \ into the function arguments. Previously you would need to use `Function.prototype.apply`:\n\
    \n```javascript\nfunction foo(x, y, z) {\n  var args = [0, null, 2];\n  foo.apply(null,\
    \ args);\n}\n```\n\nNow you can do this by prefixing the arguments with `...`\
    \ as shown below:\n\n```javascript\nfunction foo(x, y, z) {\n  var args = [0,\
    \ 1, 2];\n  foo(...args);\n}\n```\n\nHere we are *spreading* the `args` array\
    \ into positional `arguments`.\n\n## Destructuring\n\nWe've already seen one usage\
    \ of this in *destructuring*\n\n```javascript\nvar [x, y, ...remaining] = [1,\
    \ 2, 3, 4];\nconsole.log(x, y, remaining); // 1, 2, [3, 4]\n```\n\nThe motivation\
    \ here is to simply make it easy for you to capture the remaining elements of\
    \ an array when destructuring.\n\n## Array Assignment\n\nThe spread operator allows\
    \ you to easily place an *expanded version* of an array into another array. This\
    \ is demonstrated in the example below:\n\n```javascript\nvar list = [1, 2];\n\
    list = [...list, 3, 4];\nconsole.log(list); // [1,2,3,4]\n```\n\n## Object spread\n\
    \nYou can also spread an object into another. A common use case is to simply add\
    \ a property to an object without mutating the original:\n\n```javascript\nconst\
    \ point2D = {x: 1, y: 2};\n/** Create a new object by using all the point2D props\
    \ along with z */\nconst point3D = {...point2D, z: 3};\n```\n\nAnother common\
    \ case is a simple shallow extend:\n\n```javascript\nconst foo = {a: 1, b: 2};\n\
    const bar = {c: 1, d: 2};\n/** Merge foo and bar */\nconst fooBar = {...foo, ...bar};\n\
    ```\n\n## Summary\n\napply is something that you would inevitably do in JavaScript,\
    \ so it's good to have a better syntax where you don't have to that ugly null\
    \ for the this argument. Also having a dedicated syntax for moving arrays out\
    \ of (destructuring) or into (assignment) other arrays provides neat syntax for\
    \ when you are array processing on partial arrays.\n\n## for...of\n\nA common\
    \ error experienced by beginning JavaScript developers is that for...in an array\
    \ does not iterate over the array items. Instead it iterates over the keys of\
    \ the object passed in. This is demonstrated in the below example. Here you would\
    \ expect 9,2,5 but you get the indexes 0,1,2:\n\n```javascript\nvar someArray\
    \ = [9, 2, 5];\nfor (var item in someArray) {\n  console.log(item); // 0,1,2\n\
    }\n```\n\nThis is one of the reasons why for...of exists in TypeScript (ES6).\
    \ The following iterates over the array correctly logging the members as expected:\n\
    \n```javascript\nvar someArray = [9, 2, 5];\nfor (var item of someArray) {\n \
    \ console.log(item); // 9,2,5\n}\n```\n\nSimilarly TypeScript has no trouble going\
    \ through a string character by character using for...of:\n\n```javascript\nvar\
    \ hello = \"is it me you're looking for\";\nfor (var char of hello) {\n  console.log(char);\
    \ // // is it me you're looking for?\n}\n```\n\n## JS Generation\n\nFor pre ES6\
    \ targets TypeScript will generate the standard for (var i = 0; i < list.length;\
    \ i++) kind of loop. For example here's what gets generated for our previous example:\n\
    \n```javascript\nvar myArray = [9, 2, 5];\nfor (var item of myArray) {\n  console.log(item);\n\
    }\n\n// becomes /\nfor (var i = 0; i < myArray.length; i++) {\n  var item = myArray[i];\n\
    \  console.log(item);\n}\n```\n\nYou can see that using for...of makes intent\
    \ clearer and also decreases the amount of code you have to write (and variable\
    \ names you need to come up with).\n\n## Limitations\n\nIf you are not targeting\
    \ ES6 or above, the generated code assumes the property length exists on the object\
    \ and the object can be indexed via numbers e.g. obj[2]. So it is only supported\
    \ on string and array for these legacy JS engines.\n\nIf TypeScript can see that\
    \ you are not using an array or a string it will give you clear error \"is not\
    \ an array type or a string type\"\n\n```javascript\nlet articleParagraphs = document.querySelectorAll(\"\
    article > p\");\n// Error: NodeList is not an array type or a string type\nfor\
    \ (let paragraph of articleParagraphs) {\n```\n\n## Summary\n\nUsing for...of\
    \ makes intent clearer and also decreases the amount of code you have to write\
    \ (and variable names you need to come up with).\n\nUsing for...of makes intent\
    \ clearer... (continued to Iterators)\n\nUnfortunately frame.next() won't work\
    \ with this pattern and it also looks a bit clunky. Iterableableiterator interface\
    \ to the rescue!\n"
  mdcn: "\n\n注意，数组解构实际上是编译器在为你执行 `[]`、`[1]`、`...` 等操作。无法保证这些值一定存在。\n\n## 带有剩余参数的数组解构\n\
    \n你可以使用带有剩余参数的数组解构从数组中提取任意数量的元素并获取剩余元素的数组。\n\n```javascript\nvar [x, y, ...remaining]\
    \ = [1, 2, 3, 4];\nconsole.log(x, y, remaining); // 1, 2, [3,4]\n```\n\n## 忽略的数组解构\n\
    \n你可以通过简单地在赋值左侧留空来忽略任何索引，例如 `, ,`。例如：\n\n```javascript\nvar [x, , ...remaining]\
    \ = [1, 2, 3, 4];\nconsole.log(x, remaining); // 1, [3,4]\n```\n\n## JS 代码生成\n\
    \n针对非 ES6 目标的 JavaScript 代码生成仅涉及创建临时变量，就像你在没有原生语言解构支持的情况下必须手动执行的那样，例如：\n\n```javascript\n\
    var x = 1, y = 2;\n[x, y] = [y, x];\nconsole.log(x, y); // 2,1\n\n// 变为\nvar x\
    \ = 1, y = 2;\n_a = [y,x], x = _a[0], y = _a[1];\nconsole.log(x, y);\nvar _a;\n\
    ```\n\n## 总结\n\n解构可以通过减少行数并使意图清晰使你的代码更具读性和可维护性。数组解构允许你像使用元组一样使用数组。\n\n## 展开运算符\n\
    \n展开运算符的主要目的是*展开*数组或对象的元素。通过示例来说最为清楚。\n\n## Apply\n\n一个常见的用例是将数组展开到函数参数中。以前你需要使用\
    \ `Function.prototype.apply`：\n\n```javascript\nfunction foo(x, y, z) {\n  var\
    \ args = [0, null, 2];\n  foo.apply(null, args);\n}\n```\n\n现在你可以通过在参数前加上 `...`\
    \ 来实现这一点，如下所示：\n\n```javascript\nfunction foo(x, y, z) {\n  var args = [0, 1,\
    \ 2];\n  foo(...args);\n}\n```\n\n在这里，我们将 `args` 数组*展开*到位置参数 `arguments` 中。\n\n\
    ## 解构\n\n我们已经在*解构*中见过这种这种用法了：\n\n```javascript\nvar [x, y, ...remaining] = [1,\
    \ 2, 3, 4];\nconsole.log(x, y, remaining); // 1, 2, [3, 4]\n```\n\n这里的动机仅仅是为了让你在解构时能够轻松捕数组的剩余元素。\n\
    \n## 数组赋值\n\n展开运算符允许你轻松地将数组的*展开版本*放入另一个数组中。下面的示例演示了这一点：\n\n```javascript\nvar\
    \ list = [1, 2];\nlist = [...list, 3, 4];\nconsole.log(list); // [1,2,3,4]\n```\n\
    \n## 对象展开\n\n你也可以将对象展开到另一个对象。一个常见的用例是在不改变原始对象的情况下向对象添加属性：\n\n```javascript\nconst\
    \ point2D = {x: 1, y: 2};\n/** 使用所有 point2D 属性并结合 z 创建新对象 */\nconst point3D =\
    \ {...point2D, z: 3};\n```\n\n另一个常见情况是简单的浅扩展：\n\n```javascript\nconst foo = {a:\
    \ 1, b: 2};\nconst bar = {c: 1, d: 2};\n/** 合并 foo 和 bar */\nconst fooBar = {...foo,\
    \ ...bar};\n```\n\n## 总结\n\napply 是你在 JavaScript 中不可避免会要做的操作，因此有一个更好的语法是很好的，这样你就不需要为\
    \ `this` 参数那个丑的 `null` 了。此外，用于将数组移出（解构）或移（赋值）其他数组的专用语法，为你在处理部分数组时提供了整洁的语法。\n\n\
    ## for...of\n\n初级 JavaScript 开发者经常遇到的错误是 `for...in` 数组不会遍历数组项。相反，它遍历的是传入对象的键。下面的示例演示了这一点。在这里你期望得到\
    \ 9,2,5，但得到的是索引 0,1,2：\n\n```javascript\nvar someArray = [9, 2, 5];\nfor (var\
    \ item in someArray) {\n  console.log(item); // 0,1,2\n}\n```\n\n这是为什么 TypeScript\
    \ (ES6) 中存在 `for...of` 的原因之一。以下代码正确遍历数组并按预期记录成员：\n\n```javascript\nvar someArray\
    \ = [9, 2, 5];\nfor (var item of someArray) {\n  console.log(item); // 9,2,5\n\
    }\n```\n\n同样，TypeScript 使用 `for...of` 逐个遍历字符串字符也没有问题：\n\n```javascript\nvar hello\
    \ = \"is it me you're looking for\";\nfor (var char of hello) {\n  console.log(char);\
    \ // // is it me you're looking for?\n}\n```\n\n## JS 代码生成\n\n对于预 ES6 目标，TypeScript\
    \ 将生成标准的 `for (var i = 0; i < list.length; i++)` 类型的循环。例如，对于我们之前的示例，生成的代码如下：\n\
    \n```javascript\nvar myArray = [9, 2, 5];\nfor (var item of myArray) {\n  console.log(item);\n\
    }\n\n// 变为\nfor (var i = 0; i < myArray.length; i++) {\n  var item = myArray[i];\n\
    \  console.log(item);\n}\n```\n\n你可以看到使用 `for...of` 使意图更清晰，并减少了你需要编写的代码量（以及需要的变量名）。\n\
    \n## 局限性\n\n如果你的目标不是 ES6 或更高版本，生成的代码假设对象上存在 `length` 属性并且对象可以通过数字进行索引，例如 `obj[2]`。因此在这些旧版\
    \ JS 引擎上它只支持字符串和数组。\n\n如果 TypeScript 可以看出你没有使用数组或字符串，它会给出明确错误“不是数组类型或字符串类型”。\n\
    \n```javascript\nlet articleParagraphs = document.querySelectorAll(\"article >\
    \ p\");\n// 错误：NodeList 不是数组类型或字符串类型\nfor (let paragraph of articleParagraphs)\
    \ {\n```\n\n## 总结\n\n使用 `for...of` 使意图更清晰，并减少了你需要编写的代码量（以及需要的变量名）。\n\n使用 `for...of`\
