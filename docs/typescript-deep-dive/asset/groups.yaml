    # Null is Bad


    JavaScript (and by extension TypeScript) has two bottom types : `null` and `undefined`

    They are `intended` to mean different things:


    +   - Something hasn''t been initialized: `undefined`

    - Something is currently unavailable: `null`


    Most other languages only have one (commonly called `null`). Since by default
    JavaScript will evaluate an uninitialized variable / parameter / property to `undefined`
    (you don''t get a choice) we recommend you just use that for your own `unavailable`
    status and don''t bother with `null`.


    # Real world discussions


    TypeScript team doesn''t use `null` : TypeScript coding guidelines and it hasn''t
    caused any problems. Douglas Crockford thinks `null` is a bad idea and we should
    all just use `undefined`


