    })\n  .then(function (val) { console.log(val); }) // 永远被调用\n  .catch(function\
    \ (err) {\n    console.log('bad.json error', err.message);\n  });\n```\n\n这个函数之所以更简单，是因为\
    \ `loadFile (async) + JSON.parse(sync) = catch 合并`是由 promise 链完成的。此外，回调不是由我们调用的，而是由\
    \ promise 链调用的，所以我们没有犯将其封装在 `try/catch` 中的错误。\n\n# 并行控制流\n\n我们已经看到使用 promise 执行串行异步任务是多么简单。这仅仅是链式的问题。\n\
    \n然而，你可能想要运行一系列异步任务，然后对所有这些任务的结果进行某些操作。Promise 提供了一个静态的 `Promise.all` 函数，你可以等待\
    \ n 个 promise 完成。你向它提供一个包含 n 个 promise 的数组，它会返回一个包含 n 个解析值的数组。下面我们展示了链式和并行的操作：\n\
    \n```javascript\n// 一个模拟从某些服务器加载项目的异步函数\nfunction loadItem(id: number): { id:\
    \ number } {\n  return new Promise((resolve) => {\n    console.log('loading item',\
    \ id);\n    setTimeout(() => { // 模拟服务器延迟\n      resolve({ id: id });\n    },\
    \ 1000);\n  });\n}\n\n// 链式调用\nlet item1, item2;\nloadItem(1)\n  .then((res) =>\
    \ {\n    item1 = res;\n    return loadItem(2);\n  })\n  .then((res) => {\n   \
    \ item2 = res;\n    console.log('done');\n  }); // 总时间将是 2 秒左右\n\n// 并行\nPromise.all([loadItem(1),\
    \ loadItem(2)])\n  .then((res) => {\n    [item1, item2] = res;\n    console.log('done');\n\
    \  }); // 总时间将是 1 秒左右\n```\n\n有时，你想运行一系列异步任务，只要这些任务中任何一个就绪（settled），你就获得所有结果。Promise\
    \ 为这种场景提供了静态的 `Promise.race` 函数：\n\n```javascript\ntask1 = new Promise(function(resolve,\
    \ reject) {\n  setTimeout(resolve, 1000, 'one');\n});\ntask2 = new Promise(function(resolve,\
    \ reject) {\n  setTimeout(resolve, 2000, 'two');\n});\n\nPromise.race([task1,\
    \ task2]).then(function(value) {\n  console.log(value); // \"one\"\n  // 两个解析了，但\
    \ task1 解析得更快\n});\n```\n\n# 将回调函数转换为 promise\n\n此此最可靠的方法是手动编写。例如，将 `setTimeout`\
    \ 转换为 promise 化的延迟函数超级简单：\n\n```typescript\nconst delay = (ms: number) => new\
    \ Promise(res => setTimeout(res, ms));\n```\n\n注意 NodeJS 中有一个方便的内置函数可以为你完成这种“node\
    \ 函数 => 返回 promise 的函数”的魔法：\n\n```javascript\n/** 示例用法 */\nimport fs = require('fs');\n\
    import util = require('util');\nconst readFile = util.promisify1(fs.readFile);\n\
    ```\n\n# 生成器\n\n> 注意：你无法在 TypeScript 中以意义的方式使用生成器（ES5 发射器正在开发中）。不过这很快就会改变，所以我们保留这一章。\n\
    \n`function *` 是创建生成器函数的语法。调用生成器函数会返回一个生成器对象。生成器对象遵循迭代器接口（即 `next`, `return` 和\
    \ `throw` 函数）。\n\n生成器函数有两个关键动机：\n\n# 惰性迭代器\n\n生成器函数可以用于创建惰性迭代器，例如以下函数按需返回无限整数列表：\n\
    \n```javascript\nfunction* infiniteSequence() {\n  var i = 0;\n  while (true)\
    \ {\n    yield i++;\n  }\n}\n\nvar iterator = infiniteSequence();\nwhile (true)\
    \ {\n  console.log(iterator.next()); // 永远是 { value: xxxx, done: false }\n```\n\
    \n当然，如果迭代器结束了，你将得到 `{ value: xxxx, done: false }` 的结果：\n\n```javascript\nfunction*\
