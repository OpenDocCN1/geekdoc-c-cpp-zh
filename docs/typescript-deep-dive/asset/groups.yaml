    # NaN


    When number calculation is not representable by a valid number, JavaScript returns
    a special `NaN` value. A classic example is imaginary numbers:


    ```

    console.log(Math.sqrt(-1)); // NaN

    ```


    Note: Equality checks **don''t** work on `NaN` values. Instead use `Number.isNaN`
    instead:


    ```

    // Don''t do this

    console.log(NaN === NaN); // false!!


    // Do this

    console.log(Number.isNaN(NaN)); // true

    ```


    # Infinity


    The outer bounds of values representable in Number are available as static `Number.MAX_VALUE`
    and `-Number.MAX_VALUE` values.


    ```

    console.log(Number.MAX_VALUE); // 1.7976931348623157e+308

    console.log(-Number.MAX_VALUE); // -1.7976931348623157e+308

    ```


    Values outside the range precision isn''t clamped to these limits e.g.


    ```

    console.log(Number.MAX_VALUE + 1 == Number.MAX_VALUE); // true!

    console.log(-Number.MAX_VALUE - 1 == -Number.MAX_VALUE); // true!

    ```


    Values outside the range precision is resolved to special values `Infinity / -Infinity`
    e.g.


    ```

    console.log(Number.MAX_VALUE + 10**1000); // Infinity

    console.log(-Number.MAX_VALUE - 10**1000); // -Infinity

    ```


    Off-course, these infinity values also show up with arithmetic that requires it
    e.g.


    ```

    console.log(1 / 0); // Infinity

    console.log(-1 / 0); // -Infinity

    ```'
- md: "\nYou can use these Infinity values manually or using static members of the\
    \ Number class as shown below:\n\n```\nconsole.log(Number.POSITIVE_INFINITY ===\
    \ Infinity); // true\nconsole.log(Number.NEGATIVE_INFINITY === -Infinity); //\
    \ true\n```\n\nFortunately comparison operators (< / >) work reliably on infinity\
    \ values:\n\n```\nconsole.log(Infinity > 1); // true\nconsole.log(-Infinity <\
    \ -1); // true\n```\n\n# Infinitesimal\n\nThe smallest non-zero value representable\
    \ in Number is available as static Number.MIN_VALUE\n\n```\nconsole.log(Number.MIN_VALUE);\
    \ // 5e-324\n```\n\nValues smaller than MIN_VALUE (\"underflow values\") are converted\
    \ to 0.\n\n```\nconsole.log(Number.MIN_VALUE / 10); // 0\n```\n\n> Further intuition:\
    \ Just like values bigger than Number.MAX_VALUE get clamped to INFINITY, values\
    \ smaller than Number.MIN_VALUE get clamped to 0.\n\n# Future JavaScript: Now\n\
    \nOne of the main selling points of TypeScript is that it allows you to use a\
    \ bunch of features from ES6 and beyond in current (ES3 and ES5 level) JavaScript\
    \ engines (like current browsers and Node.js). Here we deep dive into why these\
    \ features are useful followed by how these features are implemented in TypeScript.\n\
    \nNote: Not all of these features are slated for immediate addition to JavaScript\
    \ but provide great utility to your code organization and maintenance. Also note\
    \ that you are free to ignore any of the constructs that don't make sense for\
    \ your project, although you will end up using most of them eventually ;)\n\n\
    # Classes\n\nThe reason why it's important to have classes in JavaScript as a\
    \ first class item is that:\n\n- 1. Classes offer a useful structural abstraction\n\
    - 2. Provides a consistent way for developers to use classes instead of every\
    \ framework (emberjs, reactjs etc) coming up with their own version.\n- 3. Objected\
    \ JavaScript Developers already understand classes.\n\nFinally JavaScript developers\
    \ can have `class`. Here we have a basic class called Point:\n\n```\nclass Point\
    \ {\n  x: number;\n  y: number;\n  constructor(x: number, y: number) {\n    this.x\
    \ = x;\n    this.y = y;\n  }\n  add(point: Point) {\n    return new Point(this.x\
    \ + point.x, this.y + point.y);\n  }\n}\n\nvar p1 = new Point(0, 10);\nvar p2\
    \ = new Point(10, 20);\nvar p3 = p1.add(p2); // {x:10,y:30}\n```\n\nThis class\
    \ Point generates the following JavaScript on ES5 emit:\n\n```\nvar Point = (function\
    \ () {\n  function Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point.prototype.add\
    \ = function (point) {\n    return new Point(this.x + point.x, this.y + point.y);\n\
    \  };\n  return Point;\n})();\n```\n\nThis is a fairly idiomatic traditional JavaScript\
    \ class pattern now as a first class language construct.\n\n# Inheritance\n\n\
    Classes in TypeScript (like other languages) support single inheritance using\
    \ the extends keyword as shown below:\n\n```\nclass Point3D extends Point {\n\
    \  z: number;\n  constructor(x: number, y: number, z: number) {\n    super(x,\
    \ y);\n    this.z = z;\n  }\n  add(point: Point3D) {\n    var point2D = super.add(point);\n\
    \    return new Point3D(point2D.x, point2D.y, this.z + point.z);\n  }\n}\n```\n\
    \nIf you have a constructor in your class you must call the parent constructor\
    \ from your constructor (TypeScript will point this out to you). This ensures\
    \ that the stuff needs to be set on this gets set. Followed by the call to super\
    \ you can add any additional stuff you want to do in your constructor (here we\
    \ add another member z).\n\nNote that you override parent member functions easily\
    \ (here we override add) and still use the functionality of the super class in\
    \ your members (using super syntax).\n\n# Statics\n\nTypeScript classes support\
    \ static properties that are shared by all instances of the class. A natural place\
    \ to put (and access) them is on the class itself and what is TypeScript does\
    \ below:\n\n```\nclass Something {\n  static instances = 0;\n  constructor() {\n\
    \    Something.instances++;\n  }\n}\n```\n\n```\nvar s1 = new Something();\nvar\
    \ s2 = new Something();\nconsole.log(Something.instances); // 2\n```\n\nYou can\
    \ have static members as well as static functions.\n\n# Access Modifiers\n\nTypeScript\
    \ supports access modifiers public private and protected which determine the accessibility\
    \ of a class member as shown below:\n\n| accessible on | public | protected |\
    \ private |\n| --- | --- | --- | --- |\n| class | yes | yes | yes |\n| class children\
    \ | yes | yes | no |\n| class instances | yes | no | no |\n\nIf an access modifier\
    \ is not specified it is implicitly public as it matches the convenient nature\
    \ of JavaScript.\n\nNote at runtime (in the generated JS) these have no significance\
    \ but will give you compile time errors if you use them incorrectly. An example\
    \ of each is shown below:\n\n```\nclass FooBase {\n  public x: number;\n  private\
    \ y: number;\n  protected z: number;\n}\n\n// EFFECT ON INSTANCES\nvar foo = new\
    \ FooBase();\nfoo.x; // okay\nfoo.y; // ERROR : private\nfoo.z; // ERROR : protected\n\
    \n// EFFECT ON CHILD CLASSES\nclass FooChild extends FooBase {\n  constructor()\
    \ {\n    super();\n    this.x; // okay\n    this.y; // ERROR : private\n    this.z;\
    \ // okay\n  }\n}\n```\n\nAs always these modifiers work for both member properties\
    \ and functions.\n\n# Abstract\n\nabstract can be thought of as an access modifier.\
    \ We present it separately because the previously mentioned modifiers can be on\
    \ a class as well as any member of the class. Having an abstract modifier primarily\
    \ means that such functionality cannot be directly invoked and a child class must\
    \ provide\n\n- abstract classes cannot be directly instantiated.\n- abstract members\
    \ cannot be directly accessed.\n\n# Constructor is optional\n\nThe class does\
    \ not need to have a constructor. e.g. the following is perfectly fine:\n\n```\n\
    class Foo {}\nvar foo = new Foo();\n```\n\n# Define using constructor\n\nHaving\
    \ a member in a class and initializing it like below:\n\n```\nclass Foo {\n  x:\
    \ number;\n  constructor(x: number) {\n    this.x = x;\n  }\n}\n```\n\nis such\
    \ a common pattern that TypeScript provides shorthand where you can prefix the\
    \ member with an access modifier and it is automatically declared on the class\
    \ and copied from the constructor. So the previous example can be re-written as\
    \ (notice public x:number):\n\n```classclass Foo {\n  constructor(public x:number)\
    \ {\n}\n```\n\n# Property initializer\n\nThis is a nifty feature supported by\
    \ TypeScript (from ES7 actually). You can initialize any member of the class outside\
    \ the class constructor:\n\n```\nclass Foo {\n  members = [];\n  add(x) {\n  \
    \  this.members.push(x);\n  }\n}\n```\n\n# What's up with the IIFE\n\nThe js generated\
    \ for the class could have been:\n\n```\nfunction Point(x, y) {\n  this.x = x;\n\
    \  this.y = y;\n}\nPoint.prototype.add = function (point) {\n  return new Point(this.x\
    \ + point.x, this.y + point.y);\n};\n```\n\nThe reason it's wrapped in an Immediately-Invoked\
    \ Function Expression (IIFE) has to do with inheritance. It allows TypeScript\
    \ to capture the base class as a variable _super:\n\n```javascript\nvar Point3D\
    \ = (function (_super) {\n  _extends(Point3D, _super);\n  function Point3D(x,\
    \ y, z) {\n    _super.call(this, x, y);\n    this.z = z;\n  }\n  Point3D.prototype.add\
    \ = function (point) {\n    var point2D = _super.prototype.add.call(this, point);\n\
    \    return new Point3D(point2D.x, point2D.y, this.z + point.z);\n  };\n  return\
    \ Point3D;\n}) (Point);\n```\n\nNotice that the IIFE allows TypeScript to easily\
    \ capture the base class Point in a _super variable and that is used consistently\
    \ in the class body.\n\n# __extends\n\nYou will notice that soon as you inherit\
    \ a class TypeScript also generates the following function:\n\n```javascript\n\
    __extends = this.__extends || function (d, b) {\n  for (var p in b) if (b.hasOwnProperty(p))\
    \ d[p] = b[p];\n  function () { this.constructor = d; }\n  d.prototype = b.prototype;\n\
    \  d.prototype = new __();\n};\n```\n\nd refers to the derived class and b refers\
    \ to the base class. This function does two things:\n\n- 1. copies the static\
    \ members of the base class onto the child class i.e. for (var p in b) if (b.hasOwnProperty(p))\
    \ d[p] = b[p];\n- 2. sets up the class function's prototype to optionally lookup\
    \ members on the parent's proto i.e. effectively d.prototype.__proto__ = b.prototype\n\
    \nPeople rarely have trouble understanding 1, but many people struggle with 2.\
    \ So an explanation is in order.\n\n# d.prototype.__proto__ = b.prototype\n\n\
    After having tutored many people about this I find the following explanation to\
    \ be simplest. I will first explain the code from __extends is equivalent to the\
    \ simple d.prototype.__proto__ = b.prototype, and then why this line in itself\
    \ is significant. To understand all this you need to know these things:\n\n- 1.\
    \ __proto__\n- 2. prototype\n- 3. effect of new on this inside the called function\n\
    - 4. effect of new on prototype and __proto__\n\nAll objects in JavaScript contain\
    \ a __proto__ member. This member is often not accessible in browsers (sometimes\
    \ documentation refers to this magical property as [[prototype]]). It has one\
    \ objective: If a property is not found on an object during lookup (e.g. obj.property)\
    \ then it is looked up at obj.__proto__.property. If it is still not found then\
    \ obj.__proto__.__proto__.property till either: it is found or the latest __proto__\
    \ itself is null. This explains why JavaScript is said to support prototypal inheritance\
    \ out of the box.\nThis is shown in the following example, which you can run in\
    \ the chrome console or Node.js:\n"
  mdcn: "\n你可以手动使用这些 Infinity 值，或者像下面所示通过 `Number` 类的静态成员来使用：\n\n```\nconsole.log(Number.POSITIVE_INFINITY\
    \ === Infinity); // true\nconsole.log(Number.NEGATIVE_INFINITY === -Infinity);\
    \ // true\n```\n\n幸运的是，比较运算符 (< / >) 在无穷值上的工作是可靠的：\n\n```\nconsole.log(Infinity\
    \ > 1); // true\nconsole.log(-Infinity < -1); // true\n```\n\n# 极小值 (Infinitesimal)\n\
    \nNumber 可以的最小非零值通过静态 `Number.MIN_VALUE` 提供：\n\n```\nconsole.log(Number.MIN_VALUE);\
    \ // 5e-324\n```\n\n比 `MIN_VALUE` 更小的值（“下溢值”）会被转换为 0。\n\n```\nconsole.log(Number.MIN_VALUE\
