  - '[PAGE 52]


    # Spread Operator


    The main objective of the spread operator is to *spread* the elements of an array
    or object. This is best explained with examples.


    # Apply


    A common use case is to spread an array into the function arguments. Previously
    you would need to use `Function.prototype.apply`:


    ```

    function foo(x, y, z) {

    var args = [0, null, 2];

    foo.apply(null, args);

    ```


    Now you can do this by prefixing the arguments with `...` as shown below:


    ```

    function foo(x, y, z) {

    var args = [0, 1, 2];

    foo(...args);

    ```


    Here we are *spreading* the `args` array into positional `arguments`.


    # Destructuring


    We''ve already seen one usage of this in *destructuring*


    ```

    var [x, y, ...remaining] = [1, 2, 3, 4];

    console.log(x, y, remaining); // 1, 2, [3, 4]

    ```


    The motivation here is to simply make it easy for you to capture the remaining
    elements of an array when destructuring.


    # Array Assignment


    The spread operator allows you to easily place an *expanded version* of an array
    into another array. This is demonstrated in the example below:


    ```

    var list = [1, 2];

    list = [...list, 3, 4];

    console.log(list); // [1,2,3,4]

    ```'
  - '[PAGE 53]


    # Object spread


    You can also spread an object into another. A common use case is to simply add
    a property to an object without mutating the original:


    ```

    const point2D = {x: 1, y: 2};

    /** Create a new object by using all the point2D props along with z */

    const point3D = {...point2D, z: 3};

    ```


    Another common case is a simple shallow extend:


    ```

    const foo = {a: 1, b: 2};

    const bar = {c: 1, d: 2};

    /** Merge foo and bar */

    const fooBar = {...foo, ...bar};

    ```


    # Summary


    apply is something that you would inevitably do in JavaScript, so it''s good to
    have a better syntax where you don''t have to that ugly null for the this argument.
    Also having a dedicated syntax for moving arrays out of (destructuring) or into
    (assignment) other arrays provides neat syntax for when you are array processing
    on partial arrays.'
  - "[PAGE 54]\n\n# for...of\n\nA common error experienced by beginning JavaScript\
    \ developers is that for...in an array does not iterate over the array items.\
    \ Instead it iterates over the keys of the object passed in. This is demonstrated\
    \ in the below example. Here you would expect 9,2,5 but you get the indexes 0,1,2:\n\
    \n```\nvar someArray = [9, 2, 5];\nfor (var item in someArray) {\n  console.log(item);\
    \ // 0,1,2\n}\n```\n\nThis is one of the reasons why for...of exists in TypeScript\
    \ (ES6). The following iterates over the array correctly logging the members as\
    \ expected:\n\n```\nvar someArray = [9, 2, 5];\nfor (var item of someArray) {\n\
    \  console.log(item); // 9,2,5\n}\n```\n\nSimilarly TypeScript has no trouble\
    \ going through a string character by character using for...of:\n\n```\nvar hello\
    \ = \"is it me you're looking for\";\nfor (var char of hello) {\n  console.log(char);\
    \ // // is it me you're looking for?\n}\n```\n\n# JS Generation\n\nFor pre ES6\
    \ targets TypeScript will generate the standard for (var i = 0; i < list.length;\
    \ i++) kind of loop. For example here's what gets generated for our previous example:"
  - "[PAGE 55]\n\n```\nvar myArray = [9, 2, 5];\nfor (var item of myArray) {\n  console.log(item);\n\
    }\n\n// becomes /\nfor (var i = 0; i < myArray.length; i++) {\n  var item = myArray[i];\n\
    \  console.log(item);\n}\n```\n\nYou can see that using for...of makes intent\
    \ clearer and also decreases the amount of code you have to write (and variable\
    \ names you need to come up with).\n\n# Limitations\n\nIf you are not targeting\
    \ ES6 or above, the generated code assumes the property length exists on the object\
    \ and the object can be indexed via numbers e.g. obj[2] . So it is only supported\
    \ on string and array for these legacy JS engines.\n\nIf TypeScript can see that\
    \ you are not using an array or a string it will give you clear error \"is not\
    \ an array type or a string type\"\n\n```\nlet articleParagraphs = document.querySelectorAll(\"\
    article > p\");\n// Error: NodeList is not an array type or a string type\nfor\
    \ (let paragraph of articleParagraphs) {\n  paragraph.classList.add(\"read\");\n\
    }\n```\n\nUse for...of only for stuff that you know to be an array or a string.\
    \ Note that this limitation might be removed in a future version of TypeScript.\n\
    \n# Summary\n\nYou would be surprised at how many times you will be iterating\
    \ over the elements of an array. The next time you find yourself doing that, give\
    \ for...of a go. You might make the next person who reviews your code happy."
