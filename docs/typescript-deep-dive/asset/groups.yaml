    \ type holds a special place in the type system. It gives you an escape hatch\
    \ from the type system to tell the compiler that any is compatible with all types.\
    \ This means anything can be assigned to it and is demonstrated in the below example:\n\
    \n```typescript\nvar power: any;\n\n// Takes any and all types\npower = '123';\n\
    // Is compatible with all types\nvar num: number;\npower = num;\n```\n\nnull and\
    \ undefined are effectively treated by the type system as something of type any.\n\
    \n# Generics\n\nMany algorithms and data structures in computer science do not\
    \ depend on the actual type of the object. However, you still want to enforce\
    \ a constraint between variables. A simple example is a function that takes a\
