    \ `foo() \\n (function(){})` 将成为单条语句（而不是两个语句）。TC39 也推荐了这种做法。\n\n# 数组\n\n- 将数组标记为\
    \ `foos:Foo[]` 而不是 `foos:Array<Foo>`。\n\n> 原因：这样更易读。TypeScript 团队也使用它。让大脑通过检测\
    \ `[]` 更容易知道某个是数组。\n\n# 文件名\n\n使用驼峰命名法（camelCase）命名文件。例如 `accordian.ts`, `myControl.ts`,\
    \ `utils.ts`, `map.ts` 等。\n\n> 原因：这是许多 JS 团队的惯例。\n\n# type vs interface\n\n- 当你*可能*需要联合类型或交叉类型时，使用\
    \ `type`：\n\n```\ntype Foo = number | { someProperty: number }\n```\n\n- 当你想使用\
    \ `extends` 或 `implements` 时，使用 `interface`，例如：\n\n```\ninterface Foo {\n  foo:\
    \ string;\n}\ninterface FooBar extends Foo {\n  bar: string;\n}\nclass X implements\
    \ FooBar {\n  foo: string;\n  bar: string;\n}\n```\n\n# 错误\n\n# 处理概述\n\n以下简要回顾了编译器的这些关键部分是如何组合的：\n\
    \n```\nSource -- scanner --> Token Stream\n```\n\n```\nToken Stream parser -->\
    \ AST\n```\n\n```\nAST -- binder --> Symbols\n```\n\nSymbol 是 TypeScript 语义系统的主要构建块。如所示，符号是作为绑定的结果产生的。将\
    \ AST 中的声明节点连接到同一个实体。符号 + AST 是 checker 用于语义验证源码的。\n\n```\nAST + Symbols -- checker\
    \ --> Type Validation\n```\n\n最后，当请求 JS 输出时：\n\n```\nAST + Checker -- emitter\
    \ --> JS\n```\n\nTypeScript 编译器中还有一些额外的文件，为这些关键部分提供了工具，我们接下来讨论。\n\n# # 文件：工具\n\
    \n`core.ts` : `coreAllocator: ObjectAllocator` 是一个全局单例。\n\n- `let objectAllocator:\
    \ ObjectAllocator` 是一个全局单例。提供了 `getNodeConstructor`（节点在我们查看 parser / AST 时讨论）、`getSymbolConstructor`（符号在\
    \ binder 中讨论）、`getConstructor`（类型在 checker 中讨论）、`getSignatureConstructor`（签名是索引、调用和构造签名）。\n\
    \n# # 文件：关键数据结构\n\n`types.ts` 包含了整个编译器使用的关键数据结构和接口。这里是一些键的示例：\n\n- `SyntaxKind`\
    \ AST 节点类型通过 `SyntaxKind` 枚举标识。\n- `TypeChecker` 这是 `TypeChecker` 提供的接口。\n- `CompilerHost`\
    \ 被 `Program` 用于与系统交互。\n- `Node` AST 节点。\n\n"
