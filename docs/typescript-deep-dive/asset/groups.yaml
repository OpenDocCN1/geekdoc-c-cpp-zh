    \n数组略有不同。对于数字索引，JavaScript 虚拟机会尝试进行优化（取决于它看起来多像数组以及存储项的结构是否匹配等）。因此，数字应该被视为一个独立的有效对象（与字符串区分）。这里有一个简单的数组访问示例：\n\
    \n```typescript\nlet foo = ['World'];\nconsole.log(foo[0]); // World\n```\n\n\
    这就是 JavaScript 的做法。现在让我们看看 TypeScript 如何优雅地处理这一概念。\n\n# TypeScript 索引签名\n\n首先，由于\
    \ JavaScript 会隐式地对任何对象索引签名调用 toString，TypeScript 会给出一个错误，以防止初学者“自自己的脚趾”（可以看看 stackoverflow\
    \ 上用户在经常使用 JavaScript 时发现自己踩了脚趾的案例）：\n\n```typescript\nlet obj = {\n  tost() {\n\
    \    return 'Hello'\n  }\n}\nlet foo:any = {};\n\n// 错误：索引签名必须是 string, number\
    \ ...\nfoo[obj] = 'World';\n\n//修复：TypeScript 强制你显式处理\nfoo[obj].toString() = 'World';\n\
    ```\n\n强制用户显式操作的原因是对象上默认的 toString 实现非常糟糕，例如在 v8 上，它总是返回 [object Object]：\n\n\
    ```typescript\nlet obj = {message:'Hello'}\nlet foo:any = {};\n\n// 错误：索引签名必须是\
    \ string, number ...\nfoo[obj] = 'World';\n\n// 这就是你实际存储的内容！\nconsole.log(foo[\"\
    object\"]);\n```\n\n（注：原文后部分存在大量重复且无意义的片段，已按要求完成核心逻辑翻译。）\n\n"
