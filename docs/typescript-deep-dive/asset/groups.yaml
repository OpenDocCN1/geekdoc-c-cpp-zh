    \ module \"only*\" as a type annotation\n  var _foo: typeof foo = require('foo');\n\
    \  // Now use `_foo` as a variable instead of `foo`.\n}\n```\n\nA similar sample\
    \ in amd (using requirejs) would be:\n\n```\nimport foo = require('foo');\n\n\
    export function loadFoo() {\n  // This lazy loading `foo` and using the original\
    \ module \"only*\" as a type annotation\n  require(['foo'], _foo: typeof foo)\
    \ => {\n    // Now use `_foo` as a variable instead of `foo`.\n  });\n}\n```\n\
    \nThis pattern is commonly used:\n\n+   - in web apps where you load certain JavaScript\
    \ on particular routes,\n- in node applications where you only load certain modules\
    \ if needed to speed up application bootstrap.\n\n# Use case: Breaking Circular\
    \ dependencies"
  - '[PAGE 104]


    Similar to the lazy loading use case certain module loaders (commonjs/node and
    require) don''t work well with circular dependencies. In such cases it is useful
    to have lazy loading code in one direction and loading the modules upfront in
    the other direction.


    # Use case: Ensure Import


    Sometimes you want to load a file just for the side effect (e.g. the module might
    register itself with some library like CodeMirror addons etc.). However if you
    just do a import/require the transpiled JavaScript will not contain a dependency
    on the module and your module loader (e.g. webpack) might completely ignore the
    import. In such cases you can use a ensureImport variable to ensure that the compiled
    JavaScript takes a dependency on the module e.g.:


    ```

    import foo = require(''./foo'');

    import bar = require(''./bar'');

    import bas = require(''./bas'');

    const ensureImport: any =

    foo

    || bar

    || bas;

    ```'
  - '[PAGE 105]


    # globals.d.ts


    We discussed global vs. file modules when covering projects and recommended using
    file based modules and not polluting the global namespace.


    Nevertheless, if you have beginning TypeScript developers you can give them a
    globals.d.ts file to put interfaces / types in the global namespace to make it
    easy to have some types just magically available for consumption in all your TypeScript
    code.


    For any code that is going to generate JavaScript we highly recommend using file
    modules.


    +   * globals.d.ts is great for adding extensions to lib.d.ts if you need to.

    * It''s good for quick declare module "some-library-you-dont-care-to-get-defs-for";
    when doing TS to JS migrations.'
  - "[PAGE 106]\n\n# Namespaces\n\nNamespaces provide you with a convenient syntax\
    \ around a common pattern used in JavaScript:\n\n```\n(function(something) {\n\
    \  something.foo = 123;\n})(something || (something = {}))\n```\n\nBasically something\
    \ || (something = {}) allows an anonymous function function(something) {} to add\
    \ to an existing object (the something || portion) or start a new object then\
    \ add stuff to that object (the || (something = {}) portion). This means that\
    \ you can have two such blocks split by some execution boundary:\n\n```\n(function(something)\
    \ {\n  something.foo = 123;\n})(something || (something = {}));\nconsole.log(something);\
    \ // {foo:123}\n\n{function(something) {\n  something.bar = 456;\n})(something\
    \ || (something = {}))\nconsole.log(something); // {foo:123, bar:456}\n```\n\n\
    This is commonly used in the JavaScript land for making sure that stuff doesn't\
    \ leak into the global namespace. With file based modules you don't need to worry\
    \ about this, but the pattern is still useful for logical grouping of a bunch\
    \ of functions. Therefore TypeScript provides the namespace keyword to group these\
    \ e.g.:"
  - "[PAGE 107]\n\n```\nnamespace Utility {\n  export function log(msg) {\n    console.log(msg);\n\
    \  }\n  export function error(msg) {\n    console.error(msg);\n  }\n}\n\n// usage\n\
    Utility.log('Call me');\nUtility.error('maybe!');\n```\n\nThe namespace keyword\
    \ generates the same JavaScript that we saw earlier:\n\n```\n(function (Utility)\
    \ {\n  // Add stuff to Utility\n})(Utility || (Utility = {}));\n```\n\nOne thing\
    \ to note is that namespaces can be nested so you can do stuff like namespace\
    \ Utility.Messaging to nest a Messaging namespace under Utility.\n\nFor most projects\
    \ we recommend using external modules and using namespace for quick demos and\
    \ port old JavaScript code."
- md: "\n# Dynamic import expressions\n\nDynamic import expressions are a new feature\
    \ and part of ECMAScript bundle allows users to asynchronously request a module\
    \ at any arbitrary point in your program. TC39 JavaScript committee has its own\
    \ proposal which is in stage 3, and it is called import() proposal for JavaScript.\n\
    \nFrom other side, webpack bundler has a feature called Code Splitting which allows\
    \ you to split your bundle into chunks which can be downloaded asynchronously\
    \ at a later time. For instance, this allows to serve a minimal bootstrap bundle\
    \ and to asynchronously load additional features later.\n\nAt first glance, it's\
    \ natural to think (if we are using webpack in our dev workflow) that by using\
    \ TypeScript 2.4 dynamic import expressions, we will automatically produce chunks\
    \ and code-split your final bundle. BUT, that is not as easy as it seems, because\
    \ it depends on the tsconfig.json configuration we are working.\n\nThe thing is\
    \ that webpack code splitting supports two similar techniques to achieve this\
    \ goal: using import() (preferred, ECMAScript proposal) and require.ensure() (legacy,\
    \ webpack specific). And what that means is the expected TypeScript output is\
    \ leave the import() statement as it is instead of transpile to anything else.\n\
    \nLet's see and example to figure out how to configure webpack lazy load library\
    \ moment but I am interested on code splitting as well, having moment library\
    \ in a separate chunk of JS (javascript file) and that will be loaded only when\
    \ required.\n\n```javascript\n/* webpackChunkName: \"momentjs\" / \"moment\"\n\
    .then((moment) => {\n  // lazyModule has all of the proper types, autocomplete\
    \ works,\n  // type checking works, code references /\n  const time = moment().format();\n\
    \  console.log(\"TypeScript >= 2.4.0 Dynamic Import Expression:\");\n  console.log(time);\n\
    }\n.catch((err) => {\n  console.log(\"Failed to load moment\", err);\n});\n```\n\
    \nHere is the tsconfig.json:\n\n```json\n\"compilerOptions\": {\n  \"target\"\
    : \"es5\",\n  \"module\": \"esnext\",\n  \"lib\": [\n    \"dom\",\n    \"es5\"\
    ,\n    \"scripthost\",\n    \"es2015.promise\"\n  ],\n  \"jsx\": \"react\",\n\
    \  \"declaration\": false,\n  \"sourceMap\": true,\n  \"outDir\": \"./dist/js\"\
    ,\n  \"strict\": true,\n  \"moduleResolution\": \"node\",\n  \"typeRoots\": [\n\
    \    \"./node_modules/@types\"\n  ],\n  \"types\": [\n    \"node\",\n    \"react\"\
    ,\n    \"react-dom\"\n  ]\n}\n```\n\n# Important notes:\n\n- Using **\"module\"\
    : \"esnext\"** TypeScript produces the mimic import() statement to be input for\
    \ Webpack Code Splitting.\n- For further information read this article: [Dynamic\
    \ Import Expressions and webpack 2 Code Splitting integration with TypeScript\
    \ 2.4]().\n\nYou can see full example here.\n\n# TypeScript with Node.js\n\nTypeScript\
    \ has had first class support for Node.js since inception. Here's how to setup\
    \ a quick Node.js project:\n\n> Note: many of these steps are actually just common\
    \ practice Node.js setup steps\n\n- 1. Setup a Node.js project package.json. Quick\
    \ one: npm init -y\n- 2. Add TypeScript (npm install typescript --save-dev)\n\
    - 3. Add node.d.ts (npm install @types/node --save-dev)\n- 4. Init a tsconfig.json\
    \ for TypeScript options (npx tsc --init)\n- 5. Make sure you have compilerOptions\
    \ in your tsconfig.json\n\nThat's it! Fire up your IDE (e.g. alm -o) and play\
    \ around. Now you can use all the built in node modules (e.g. import fs = require('fs');)\
    \ with all the safety and developer ergonomics of TypeScript!\n\n# Bonus: Live\
    \ compile + run\n\n- Add ts-node which we will use for live compile + run in node\
    \ (npm install ts-node --save-dev)\n- Add nodemon which will invoke ts-node whenever\
    \ a file is changed (npm install nodemon --save-dev)\n\nNow just add a script\
    \ target to your package.json based on your application entry e.g. assuming its\
