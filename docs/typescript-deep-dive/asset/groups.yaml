- md: "\n# Type Instantiation for Generics\n\nSay you have something that has a generic\
    \ parameter e.g. a class Foo :\n\n```typescript\nclass Foo<T>{\n  foo: T;\n}\n\
    ```\n\nYou want to create a specialized version for it for a particular type.\
    \ The pattern is to copy the item into a new variable and give the type annotation\
    \ with the generics replaced with concrete types. E.g. if you want a class Foo<number>\
    \ :\n\n```typescript\nclass Foo<T>{\n  foo: T;\n}\nlet FooNumber = Foo as { ():Foo<number>\
    \ }; // ref 1\n```\n\nIn ref 1 you are saying FooNumber is the same as Foo but\
    \ just treat it as something when called with the new operator gives an instance\
    \ of Foo<Number>.\n\n# Inheritance\n\nThe Type assertion pattern is unsafe in\
    \ that it trusts you to do the right thing. A common pattern in other languages\
    \ for classes is to just use inheritance :\n\n```typescript\nclass FooNumber extends\
    \ Foo<number>{}\n```\n\nOne word of caution here: if you use decorators on the\
    \ base class then the inherited class might not have the same behavior as the\
    \ base class (it is no longer wrapped by the decorator).\n\nOf course if you are\
    \ not specializing classes you still have to come up with a coercion / assertion\
    \ pattern that works and hence we showed the general assertion first, e.g.:\n\n\
    ```typescript\nfunction id<T>(x: T) { return x; }\nconst idNum = id as {(x:number):number};\n\
    ```\n\n> Inspired by this stackoverflow question\n\n# Lazy Object Literal Initialization\n\
    \nQuite commonly in JavaScript code bases you would initialize and object literals\
    \ in the following manner:\n\n```javascript\nlet foo = {};\nfoo.bar = 123;\nfoo.bas\
    \ = \"Hello World\";\n```\n\nAs soon as you move the code to TypeScript you will\
    \ start to get Errors like the following:\n\n```typescript\nlet foo = {};\nfoo.bar\
    \ = 123; // Error: Property 'bar' does not exist on type '{}'\nfoo.bas = \"Hello\
    \ World\"; // Error: Property 'bas' does not exist on type '{}'\n```\n\nThis is\
    \ because from the state let foo = {}, TypeScript infers the type of foo (left\
    \ side of initializing assignment) to be the type of the right hand side {} (i.e.\
    \ an object with no properties). So, error if you try to assign to a property\
    \ it doesn't know about.\n\n# Ideal Fix\n\nThe proper way to initialize an object\
    \ in TypeScript is to do it in the assignment:\n\n```typescript\nlet foo = {\n\
    \  bar: 123,\n  bas: \"Hello World\"\n};\n```\n\nThis is also great for code review\
    \ and code maintainability purposes.\n\n# Quick Fix\n\nIf you have a large JavaScript\
    \ code base that you are migrating to TypeScript the ideal fix might not be a\
    \ viable solution for you. In that case you can carefully use a type assertion\
    \ to silence the compiler:\n\n```typescript\nlet foo = {} as any;\nfoo.bar = 123;\n\
    foo.bas = \"Hello World\";\n```\n\n# Middle Ground\n\nOf course using the `any`\
    \ assertion can be very bad as its sort of defeats the safety of TypeScript. The\
    \ middle ground fix is to create an `interface` to ensure\n\n- Good Docs\n- Safe\
    \ assignment\n\nThis is shown below:\n\n```typescript\ninterface Foo {\n  bar:\
    \ number\n  bas: string\n}\n\nlet foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas =\
    \ \"Hello World\";\n```\n\nHere is a quick example that shows the fact that using\
    \ the interface can save you:\n\n```typescript\ninterface Foo {\n  bar: number\n\
    \  bas: string\n}\n\nlet foo = {} as Foo;\nfoo.bar = 123;\nfoo.bas = \"Hello World\"\
    ;\n\n// later in the codebase:\nfoo.bar = 'Hello Stranger'; // Error: You probably\
    \ misspelled `bas` as `bar`, cannot assign string to number\n```\n\n# Classes\
    \ Are Useful\n\nIt is very common to have the following structure:\n\n```typescript\n\
    function foo() {\n  let someProperty;\n\n  // Some other initialization code\n\
    \n  function someMethod() {\n    // Do some stuff with someProperty\n    // And\
    \ potentially other things\n  }\n  // Maybe some other methods\n\n  return {\n\
    \    someMethod,\n    // Maybe some other methods\n  };\n}\n```\n\nThis is known\
    \ as the revealing module pattern and quite common in JavaScript (taking advantage\
    \ of JavaScript closure).\n\nIf you use file modules (which you really should\
    \ as global scope is bad) then your file is effectively the same. However, there\
    \ are too many cases where people will write code like this:\n\n```typescript\n\
    let someProperty;\n\nfunction foo() {\n  // Some initialization code\n}\nfoo();\
    \ // some initialization code\n\nsomeProperty = 123; // some more initialization\n\
    \n// Some utility function not exported\n\n// later\nexport function someMethod()\
    \ {\n}\n```\n\nEven though I am not a big fan of inheritance I find that letting\
    \ people use classes helps them organize their code better. The same developer\
    \ would intuitively write the following:\n\n```typescript\nclass Foo {\n  public\
    \ someProperty;\n\n  constructor() {\n    // some initialization\n  }\n\n  public\
    \ someMethod() {\n    // some code\n  }\n\n  private someUtility() {\n    // some\
    \ code\n  }\n}\n\nexport = new Foo();\n```\n\nAnd it's not just developers, creating\
    \ dev tools that provide great visualizations over classes are much more common,\
    \ and there is one less pattern your team needs to understand and maintain.\n\n\
    # Null is Bad\n\nJavaScript (and by extension TypeScript) has two bottom types\
    \ : `null` and `undefined`\nThey are intended to mean different things:\n\n- Something\
    \ hasn't been initialized: `undefined`\n- Something is currently unavailable:\
    \ `null`\n\nMost other languages only have one (commonly called `null`). Since\
    \ by default JavaScript will evaluate an uninitialized variable / parameter /\
    \ property to `undefined` (you don't get a choice) we recommend you just use that\
    \ for your own `unavailable` status and don't bother with `null`.\n\n# Real world\
    \ discussions\n\nTypeScript team doesn't use `null` : TypeScript coding guidelines\
    \ and it hasn't caused any problems. Douglas Crockford thinks `null` is a bad\
    \ idea and we should all just use `undefined`.\n\n# Dealing with `null` style\
    \ code bases\n\nIf your code base interacts with other APIs that might give you\
    \ a `null` check with `undefined` (instead of `===`). Using this is even for potentially\
    \ `falsy` values.\n\n```javascript\n// Imagine you are doing `foo == undefined`\
    \ where foo can be one of:\nconsole.log(undefined == undefined); // true\nconsole.log(null\
    \ == undefined); // true\nconsole.log(0 == undefined); // false\nconsole.log(''\
    \ == undefined); // false\nconsole.log(false == undefined); // false\n```\n\n\
    # Limit usage of `undefined`\n\nAlso because TypeScript gives you the opportunity\
    \ to document your structures separately from values instead of stuff like:\n"
  mdcn: "\n\n# 泛型的类型实例化\n\n假设你有一个带有泛型参数的内容，例如一个类 `Foo`：\n\n```typescript\nclass Foo<T>{\n\
    \  foo: T;\n}\n```\n\n你想为特定的类型创建一个专门化的版本。这种模式是将项拷贝到一个新变量中，并提供泛型替换为具体类型的类型注解。例如，如果你想创建一个类\
    \ `Foo<number>`：\n\n```typescript\nclass Foo<T>{\n  foo: T;\n}\nlet FooNumber\
    \ = Foo as { ():Foo<number> }; // ref 1\n```\n\n在引用 1 中，你表示 `FooNumber` 等于 `Foo`，只是在用\
    \ `new` 操作符调用时，将其视为返回 `Foo<number>` 实例的对象。\n\n# 继承\n\n类型断言模式是不安全的，因为它信任你会做正确的事。在其他语言中，类的常用模式是直接使用继承：\n\
    \n```typescript\nclass FooNumber extends Foo<number>{}\n```\n\n这里有一个警告：如果你在基类上使用装饰器（decorators），那么继承的类的行为可能与基类不同（它不再被装饰器包裹）。\n\
    \n当然，如果你没有对类进行专门化，你仍然必须想出一个可行的强制转换/断言模式，因此我们先展示了通用的断言，例如：\n\n```typescript\nfunction\
    \ id<T>(x: T) { return x; }\nconst idNum = id as {(x:number):number};\n```\n\n\
    > 灵感来源于此 stackoverflow 问题\n\n# 懒性对象字面量初始化\n\n在 JavaScript 代码库中，经常以以下方式初始化对象字面量：\n\
    \n```javascript\nlet foo = {};\nfoo.bar = 123;\nfoo.bas = \"Hello World\";\n```\n\
    \n一旦你将代码迁移到 TypeScript，就会开始遇到如下错误：\n\n```typescript\nlet foo = {};\nfoo.bar =\
    \ 123; // Error: 类型 '{}' 上不存在属性 'bar'\nfoo.bas = \"Hello World\"; // Error: 类型\
    \ '{}' 上不存在属性 'bas'\n```\n\n这是因为从 `let foo = {}` 状态开始，TypeScript 推断出 `foo`（初始化赋值语句的左侧）的类型为右侧\
    \ `{}` 的类型（即一个没有任何属性的对象）。因此，如果你尝试给它不知道的属性赋值，就会报错。\n\n# 理想修复\n\n在 TypeScript 中初始化对象的正确方法是在赋值中进行：\n\
    \n```typescript\nlet foo = {\n  bar: 123,\n  bas: \"Hello World\"\n};\n```\n\n\
    这对于代码审查和代码可维护性非常有好处。\n\n# 快速修复\n\n如果你有一个正在迁移到 TypeScript 的大型 JavaScript 代码库，理想的修复对你可能不可行。在这种情况下，你可以谨慎地使用类型断言来忽略编译器报错：\n\
    \n```typescript\nlet foo = {} as any;\nfoo.bar = 123;\nfoo.bas = \"Hello World\"\
    ;\n```\n\n# 折中方案\n\n当然，使用 `any` 断言可能非常糟糕，因为它某种程度上违背了 TypeScript 的安全性。折中的修复方案是创建一个\
    \ `interface` 以确保：\n\n- 良好的文档\n- 安全的赋值\n\n如下所示：\n\n```typescript\ninterface Foo\
    \ {\n  bar: number\n  bas: string\n}\n\nlet foo = {} as Foo;\nfoo.bar = 123;\n\
    foo.bas = \"Hello World\";\n```\n\n这里有一个快速示例，展示了使用接口如何帮你避免错误：\n\n```typescript\n\
    interface Foo {\n  bar: number\n  bas: string\n}\n\nlet foo = {} as Foo;\nfoo.bar\
    \ = 123;\nfoo.bas = \"Hello World\";\n\n// 代码库后后部分：\nfoo.bar = 'Hello Stranger';\
    \ // Error: 你可能将 `bas` 拼错了 `bar`，无法将字符串赋值给数字\n```\n\n# 类是有用的\n\n拥有以下结构是非常常见的：\n\
    \n```typescript\nfunction foo() {\n  let someProperty;\n\n  // 其他其他初始化代码\n\n \
    \ function someMethod() {\n    // 对 someProperty 执行一些事情\n    // 以及可能的其他事情\n  }\n\
    \  // 也许还有其他方法\n\n  return {\n    someMethod,\n    // 可能还有其他方法\n  };\n}\n```\n\
    \n这被称为揭示模块模式（revealing module pattern），在 JavaScript 中常见（利用了 JavaScript 的闭包）。\n\
    \n如果你使用文件模块（你真的应该这样做，因为全局作用域很糟糕），那么你的文件实际上是那样的。但是，有太多情况人们会写这样的代码：\n\n```typescript\n\
    let someProperty;\n\nfunction foo() {\n  // 一些初始化代码\n}\nfoo(); // 一些初始化代码\n\n\
    someProperty = 123; // 更多的初始化\n\n// 未导出的某些工具函数\n\n// 后面\nexport function someMethod()\
    \ {\n}\n```\n\n虽然我不是继承忠实粉丝，但我发现让人们使用类有助于他们更好地组织代码。同一个开发者会直觉地写出如下：\n\n```typescript\n\
    class Foo {\n  public someProperty;\n\n  constructor() {\n    // 一些初始化\n  }\n\n\
    \  public someMethod() {\n    // 一些代码\n  }\n\n  private someUtility() {\n    //\
    \ 一些代码\n  }\n}\n\nexport = new Foo();\n```\n\n而且不仅仅是开发者，创建对类提供良好可视化的开发工具要常见得多，而且你的团队少了一个需要理解和维护的模式。\n\
    \n# null 是糟糕的\n\nJavaScript（以及延伸的 TypeScript）有两个底类型（bottom types）：`null` 和 `undefined`\n\
    它们旨在表示不同的含义：\n\n- 尚未初始化：`undefined`\n- 当前不可用：`null`\n\n大多数其他语言只有一个（通常称为 `null`）。由于\
    \ JavaScript 默认会将未初始化的变量/参数/属性求值为 `undefined`（你没有选择），我们建议你直接用它来表示自己的“不可用”状态，而不要管\
    \ `null`。\n\n# 真实世界讨论\n\nTypeScript 团队不使用 `null`：TypeScript 代码规范，而且没有引起任何问题。Douglas\
    \ Crockford 认为 `null` 是一个坏主意，我们应该都使用 `undefined`。\n\n# 处理 `null` 风格的代码库\n\n如果你的代码库与其他\
    \ API 交互，而 API 可能会提供一个针对 `undefined` 的检查（而不是 `===`）。使用这种方法甚至是为了虚假（falsy）值。\n\n\
    ```javascript\n// 假设你正在执行 `foo == undefined`，其中 foo 是以下之一：\nconsole.log(undefined\
    \ == undefined); // true\nconsole.log(null == undefined); // true\nconsole.log(0\
    \ == undefined); // false\nconsole.log('' == undefined); // false\nconsole.log(false\
    \ == undefined); // false\n```\n\n# 限制 `undefined` 的使用\n\n此外是因为 TypeScript 提供了将结构与值分开记录的机会，而不是像这样的：\n\
    \n"
