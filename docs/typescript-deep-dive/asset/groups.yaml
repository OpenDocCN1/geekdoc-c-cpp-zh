    # TIPS\n\nIn this section we present a number of tips that we have collected over\
    \ the course of using TypeScript in the real world.\n\n# String enums\n\nSometimes\
    \ you need a collection of strings collected under a common key. Prior to TypeScript\
    \ 2.4, TypeScript only supported number-based enums. If using versions prior to\
    \ 2.4, a work-around is to use string literal types to create string-based enums\
    \ by combining with union types.\n\n# Nominal Typing\n\nThe TypeScript type system\
    \ is structural and this is one of the main motivating benefits. However, there\
    \ are real-world use cases for a system where you want two variables to be differentiated\
    \ because they have a different type name even if they have the same structure.\
    \ A very common case is identity structures (which are generally just strings\
    \ with semantics associated with their name in languages like C#/Java).\n\nThere\
    \ are a few patterns that have emerged in the community. I cover them in decreasing\
    \ order of personal preference:\n\n# Using literal types\n\nThis pattern uses\
    \ generics and literal types:\n\n```typescript\n/** Generic Id type */\ntype Id<T\
    \ extends string> = {\n  type: T,\n  value: string,\n}\n\n/** Specific Id types\
    \ */\ntype FooId = Id<'foo'>;\ntype BarId = Id<'bar'>;\n\n/** Optional: constructors\
    \ functions */\nconst createFoo = (value: string): FooId => ({ type: 'foo', value:\
    \ value });\nconst createBar = (value: string): BarId => ({ type: 'bar', value:\
    \ value });\n\nlet foo = createFoo('sample');\nlet bar = createBar('sample');\n\
    \nfoo = bar; // Error\nfoo = foo; // Okay\n```\n\n- Advantages\n  - No need for\
    \ any type assertions\n- Disadvantage\n  - The structure {type,value} might not\
    \ be desirable and need server serialization support\n\n# Using Enums\n\nEnums\
    \ in TypeScript offer a certain level of nominal typing. Two enum types aren't\
    \ equal if they differ by name. We can use this fact to provide nominal typing\
    \ for types that are otherwise structurally compatible.\n\nThe workaround involves:\n\
