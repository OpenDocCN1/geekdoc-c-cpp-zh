- md: "\nYou can get the latest packages using `npm install typescript@latest react@latest\
    \ react-dom@latest @react@latest @types/react-dom@latest webpack@latest ts-loader@latest\
    \ webpack-dev-server@latest --save-dev --save-exact`\n\n- Do live development\
    \ by running `npm start`.\n- Visit `http://localhost:8080`\n- Edit the `app.tsx`\
    \ (or any ts/tsx file in `src`) and application live reloads.\n- Build production\
    \ assets by running `npm run build`.\n- Serve the `public` folder (which contains\
    \ the built assets) from your server.\n\n# TypeScript Type System\n\nWe covered\
    \ the main features of the TypeScript Type System back when we discussed Why?.\
    \ The following are a few key takeaways from that discussion which don't need\
    \ further explanation:\n\n- The type system in typescript is designed to be optional\
    \ so that your javascript typescript works.\n- TypeScript does not block JavaScript\
    \ emit in the presence of Type Errors, allowing you to progressively update your\
    \ JS to.\n\nNow let's start with the syntax of the TypeScript type system. This\
    \ way you can start using these annotations in your code immediately and see the\
    \ benefit. This will prepare you for a deeper dive later.\n\n# Basic Annotations\n\
    \nAs mentioned before, Types are annotated using :TypeAnnotation syntax. Anything\
    \ that is available in the type declaration space can be used as a Type Annotation.\n\
    \nThe following example demonstrates type annotations can be used for variables,\
    \ function parameters and function return values:\n\n```typescript\nvar num: number\
    \ = 123;\nfunction identity(num: number): number {\n  return num;\n}\n```\n\n\
    # Primitive Types\n\nThe JavaScript primitive types are well represented in the\
    \ TypeScript type system. This means string, number, boolean as demonstrated below:\n\
    \n```typescript\nnum: number;\nvar str: string;\nvar bool: boolean;\n\nnum = 123;\n\
    num = 123.456;\nnum = '123'; // Error\n\nstr = '123';\nstr = 123; // Error\n\n\
    bool = true;\nbool = false;\nbool = 'false'; // Error\n```\n\n# Arrays\n\nTypeScript\
    \ provides dedicated type syntax for arrays to make it easier for you to annotate\
    \ and document your code. The syntax is basically postfixing [] to any valid annotation\
    \ (e.g. :boolean[]). It allows you to safely do any array manipulation that you\
    \ would normally do protects you from errors like assigning a member of the wrong\
    \ type. This is demonstrated below:\n\n```typescript\nvar boolArray: boolean[];\n\
    \nboolArray = [true, false];\nconsole.log(boolArray[0]); // true\nconsole.log(boolArray.length);\
    \ // 2\nboolArray[1] = true;\nboolArray = [false, false];\n\nboolArray[0] = 'false';\
    \ // Error!\nboolArray[0] = 'false'; // Error!\nboolArray = [true, 'false']; //\
    \ Error!\n```\n\n# Interfaces\n\nInterfaces are the core way in TypeScript to\
    \ compose multiple type annotations into a single named annotation. Consider the\
    \ following example:\n\n```typescript\ninterface Name {\n  first: string;\n  second:\
    \ string;\n}\n\nvar name: Name;\nname = {\n  first: 'John',\n  second: 'Doe'\n\
    };\n\nname = { // Error: `second` is missing\n  first: 'John'\n};\nname = { //\
    \ Error: `second` is the wrong type\n  first: 'John',\n  second: 1337\n};\n```\n\
    \nHere we've composed the annotations first: string + second: string into a new\
