    ```

    Token Stream parser --> AST

    ```


    ```

    AST -- binder --> Symbols

    ```


    Symbol is the primary building block of the TypeScript semantic system. As shown
    the symbols are created as a result of binding. Symbols connect declaration nodes
    in the AST to other declarations contributing to the same entity.


    Symbols + AST are what is used by the checker to semantically validate the source
    code


    ```

    AST + Symbols -- checker --> Type Validation

    ```


    Finally When a JS output is requested:


    ```

    AST + Checker -- emitter --> JS

    ```


    There are a few additional files in the TypeScript compiler that provide utilities
    to many of these key portions which we cover next.


    # # File: Utilities


    core.ts : coreAllocator: ObjectAllocator : is a variable defined as a singleton
    global.


    +   - let objectAllocator: ObjectAllocator : is a variable defined as a singleton
    global. provides the definitions for getNodeConstructor (Nodes are covered when
    we look at parser / AST ), getSymbolConstructor (Symbols are covered in binder
    ), getConstructor (Types are covered in checker ), getSignatureConstructor (Signatures
    are the index, call and construct signatures).


    # # File: Key Data Structures


    types.ts contains key data structures and interfaces uses throughout the compiler.
    Here is a sampling of a few keys:


    +   - SyntaxKind The AST node type is identified by the SyntaxKind enum.

    - TypeChecker This is the interface provided by the TypeChecker.

    - CompilerHost This is used by the Program to interact with the System .

    - Node An AST node.'
- md: "\n## File: System\n\n`system.ts`. All interaction of the TypeScript compiler\
    \ with the operating system goes through a system interface. Both the interface\
    \ and its implementations (TypeScript and Node) are defined in `system.ts`. You\
    \ can think of it as the Operating Environment (OE).\n\nNow that you have an overview\
    \ of the major files, we can look at the concept of Program\n\n## Program\n\n\
    Defined in `program.ts`. The compilation context (a concept we covered previously)\
    \ is represented within the TypeScript compiler as Program. It consists of SourceFile\
    \ and compiler options.\n\n## Usage of CompilerHost\n\nIts interaction mechanism\
    \ with the OE:\n\n```\nProgram -uses-> CompilerHost -uses-> System\n```\n\nThe\
    \ reason for having CompilerHost as a point of indirection is that it allows its\
    \ interface to be more finely tuned for Program needs and not bother with OE needs\
    \ (e.g., tests). There are other users of System as well (e.g., tests).\n\n##\
    \ SourceFile\n\nThe program provides an API getSourceFiles(): SourceFile[]; Each\
    \ is represented as a root-level node for the AST (called SourceFile).\n\n## Node\n\
    \nThe basic building block of the Abstract Syntax Tree (AST). In general a Node\
    \ represents non-terminals in the language grammar; however, some terminals are\
    \ kept in the tree such as identifiers and literals. Two keys make up an AST node's\
    \ documentation: the node's SyntaxKind which identifies its type, and its interface\
    \ the provides. Here are a few Node members:\n\n- TextRange: identify the node's\
    \ start and end in the source file.\n- parent?: the parent of the node in the\
    \ AST.\n- SyntaxKind: the type\n\nThere are other additional members for flags\
    \ and modifiers that you can lookup by searching but the ones mentioned are vital\
    \ for traversal. Each SourceFile is a top-level node that is contained in the\
    \ Program.\n\n## AST Tip: Visit Children\n\nThere is a utility function forChild\
    \ that allows you to visit all the children of any Node in the AST. Here is a\
    \ simplified snippet of the source code to demonstrate how it functions:\n\n```typescript\n\
    export function forChild<T>(node: Node, cb: (node: Node) => T, nodes?: Node[]):\
    \ T {\n  if (!node) {\n    return;\n  }\n  switch (node.kind) {\n    case SyntaxKind.BinaryExpression:\n\
    \      return cb(node.left) ||\n        cb(node.operator) ||\n        cb(node.right);\n\
    \    case SyntaxKind.IfStatement:\n      return cb(node.expression) ||\n     \
    \   cb(node.thenStatement) ||\n        cb(node.elseStatement);\n    // .... lots\
    \ other\n  }\n}\n```\n\nBasically it checks node.kind and based on the node and\
    \ calls the cb on the children. Note, however that this function doesn't visit\
    \ all children (e.g. SyntaxKind.SemicolonToken). If you want all of the AST just\
    \ call .getChildren member function of the Node. E.g. here is a function that\
    \ prints the verbose AST of a node:\n\n```typescript\nfunction printAllChildren(node:\
    \ ts.Node, depth = 0) {\n  console.log(new Array(depth+1).join('----')), ts.syntaxKindToName(node.kind),\
    \ node.pos, node.end);\n  depth++;\n  node.getChildren().forEach(c => printAllChildren(c,\
    \ depth));\n}\n```\n\nWe will see a sample usage of this function when we discuss\
    \ the parser further.\n\n## AST Tip: SyntaxKind\n\nSyntaxKind is defined as a\
    \ const enum, here is a sample:\n\n```typescript\nexport const enum SyntaxKind\
    \ {\n  Unknown,\n  EndOfFileToken,\n  SingleLineCommentTrivia,\n  // ... LOTS\
    \ more\n}\n```\n\nIt's a const enum (a concept we covered previously) so that\
    \ it gets inlined (e.g. ts.SyntaxKind.EndOfFileToken becomes 1) and we don't get\
    \ dereferencing cost when working with the AST. However the compiler is compiled\
    \ with --preserveEnums flag so that the enum is still available at runtime. In\
    \ JavaScript you can use ts.SyntaxKind.EndOfFileToken if you want. Additionally\
    \ you can convert these enum members to display strings using the following function:\n\
    \n```typescript\nexport function syntaxKindName(kind: ts.SyntaxKind) {\n  return\
    \ (<any>ts).SyntaxKind[kind];\n}\n```\n\n## Trivia\n\nTrivia (called significant\
    \ because they are trivial) represent the parts of the source text that are largely\
    \ insignificant for normal understanding of the code. For example: whitespace,\
    \ comments, and even conflict markers. Trivia is not stored in the AST (to keep\
    \ it lightweight). However it can be fetched on demand using a few ts.* APIs.\n\
    \nBefore we show them you need to understand the following:\n\n## Trivia Ownership\n\
    \nIn General:\n\n- A token owns any trivia after it on the same line upto the\
    \ next token.\n- Any comment after that line is associated with the following\
    \ token.\n\nFor leading and ending comments in a file:\n\n- The first token in\
    \ the source file gets all the initial trivia.\n- The last sequence of trivia\
    \ in the file is tacked onto the end-of-file token, which otherwise has zero width.\n\
    \n## Trivia APIs\n\nFor most basic uses, comments are the \"interesting\" trivia.\
    \ The comments that belong to a Node can be fetched through the following functions:\n\
    \n| Function | Description |\n|---|---|\n| ts.getLeadingCommentRanges | Given\
    \ the source text and position within that text, returns ranges of comments between\
    \ the first line break before the given position and ... |\n| ts.getTrailingCommentRanges\
    \ | Given the source text and position within that text, returns ranges of comments\
    \ until the first line break following the given position. |\n\nAs an example,\
    \ this portion of source file:\n\n```\ndebugger;/*hello*/\n//bye\n/*hi*/function\n\
    ```\n\n## Token Start/Full Start\n\nNodes have what is called a \"token start\"\
    \ and a \"full start\".\n\n- Token Start: the more natural version, which is the\
    \ position in file where the text of a token begins.\n- Full Start: the point\
    \ at which the scanner began since the last significant token\n\nIn the following\
    \ example:\n\n```\ndebugger;/*hello*/\n//bye\n/*hi*/\n```\n\nfor function the\
    \ token start is at whereas full start is at /*hello*/ Note that full start even\
    \ includes the trivia that would otherwise be owned by the previous node.\n\n\
    ## Scanner\n\nThe source code for the TypeScript scanner is located entirely in\
    \ scanner.ts. Scanner is controlled internally by the Parser to convert the source\
    \ code to an AST. Here is what the desired outcome is:\n\n```\nSourceCode -- scanner\
    \ --> Token Stream parser --> AST\n```\n\n## Usage by Parser\n\nThere is a singleton\
    \ scanner created in parser.ts to avoid the cost of creating scanners over and\
    \ over again. This scanner is then primed by the parser on demand using the initializeState\
    \ function.\n\nHere is a simplified version of the actual code in the parser that\
    \ you can run demonstrating this concept:\n\n```typescript\ncode/compiler/scanner/runScanner.ts\n\
    \nimport * as ts from \"typescript\";\n// TypeScript has a singleton scanner\n\
    const scanner = ts.createScanner(ts.ScriptTarget.Latest, /skipTrivial*/ true);\n\
    \n// That is initialized using a function `initializeState` similar to\nfunction\
    \ initializeState(text: string) {\n  scanner.setText(text);\n  scanner.onError((message:\
    \ ts.DiagnosticMessage, length: number) => {\n    console.error(message);\n  });\n\
    \  scanner.setTarget(ts.ScriptTarget.ES5);\n  scanner.setLanguageVariant(ts.LanguageVariant.Standard);\n\
    }\n\n// Sample usage\ninitializeState(\n  var foo = 123;\n  .trim());\n\n// Start\
    \ the scanning\nvar token = scanner.scan();\nwhile (token != ts.SyntaxKind.EndOfFileToken)\
    \ {\n  console.log(ts.formatSyntaxKind(token));\n  token = scanner.scan();\n}\n\
    ```\n"
  mdcn: "\n\n## 文件：System（系统）\n\n`system.ts`。TypeScript 编译器与操作系统之间的所有交互都通过系统接口进行。该接口及其实现（TypeScript\
    \ 和 Node）都定义在 `system.ts` 中。你可以将其认为是操作环境 (OE)。\n\n现在你已经对主要文件有了概览，我们可以来看 Program（程序）的概念。\n\
    \n## Program\n\n定义在 `program.ts` 中。编译上下文（我们之前涵盖过的一个概念）在 TypeScript 编译器内部用 Program\
    \ 表示。它由 SourceFile 和编译器选项（compiler options）组成。\n\n## CompilerHost 使用\n\n它与 OE\
    \ 的交互机制：\n\n```\nProgram -uses-> CompilerHost -uses-> System\n```\n\n引入 CompilerHost\
    \ 作为间接层的原因是它允许针对 Program 的需求进行更精细的调整，而不影响 OE 的需求（例如测试）。System 也有其他用户（例如测试）。\n\n\
    ## SourceFile\n\n程序提供了一个 API `getSourceFiles(): SourceFile[];`。每个 SourceFile 都表示为\
    \ AST 的根级节点（称为 SourceFile）。\n\n## Node\n\n抽象语法树 (AST) 的基本构建单元。通常，一个 Node 代表语言语法中的非终结符；然而，某些终结符（如标识符和字面量）也会保留在树中。两个键构成了一个\
    \ AST 节点的文档：标识其类型的节点 `SyntaxKind` 以及它提供的接口（interface）。以下是几个 Node 成员：\n\n- TextRange：标识节点在源文件中的起始和结束位置。\n\
    - parent?：节点在 AST 中的父节点。\n- SyntaxKind：类型\n\n还有其他用于标记（flags）和修饰符（modifiers）的成员可以通过搜索查找，但上述成员对于遍历至关重要。每个\
    \ SourceFile 都是包含在 Program 中的顶级节点。\n\n## AST 提示：Visit Children（访问子节点）\n\n有一个工具函数\
    \ `forChild`，允许你访问 AST 中任何 Node 的所有子节点。以下是一个简化的源代码片段，用于演示它是如何工作的：\n\n```typescript\n\
    export function forChild<T>(node: Node, cb: (node: Node) => T, nodes?: Node[]):\
    \ T {\n  if (!node) {\n    return;\n  }\n  switch (node.kind) {\n    case SyntaxKind.BinaryExpression:\n\
    \      return cb(node.left) ||\n        cb(node.operator) ||\n        cb(node.right);\n\
    \    case SyntaxKind.IfStatement:\n      return cb(node.expression) ||\n     \
    \   cb(node.thenStatement) ||\n        cb(node.elseStatement);\n    // .... 其他许多\n\
    \  }\n}\n```\n\n基本上，它检查 `node.kind` 并根据节点在子节点上调用 `cb`。但请注意，此函数并没有访问所有子节点（例如 `SyntaxKind.SemicolonToken`）。如果你需要所有的\
    \ AST，只需调用 Node 的 `.getChildren` 成员函数。例如，这里有一个可以打印节点详细 AST 的函数：\n\n```typescript\n\
    function printAllChildren(node: ts.Node, depth = 0) {\n  console.log(new Array(depth+1).join('----')),\
    \ ts.syntaxKindToName(node.kind), node.pos, node.end);\n  depth++;\n  node.getChildren().forEach(c\
    \ => printAllChildren(c, depth));\n}\n```\n\n当我们进一步讨论解析器（parser）时，我们将看到该函数的示例用法。\n\
    \n## AST 提示：SyntaxKind\n\nSyntaxKind 被定义为一个常量枚举（const enum），这里有一个示例：\n\n```typescript\n\
    export const enum SyntaxKind {\n  Unknown,\n  EndOfFileToken,\n  SingleLineCommentTrivia,\n\
    \  // ... 更多\n}\n```\n\n它是一个常量枚举（我们之前涵盖过的一个概念），以便它能被内联（例如 `ts.SyntaxKind.EndOfFileToken`\
    \ 变为 `1`），这样我们在处理 AST 时就不会产生解引用开销。然而，编译器是使用 `--preserveEnums` 标志编译的，因此该枚举在运行时仍然可用。在\
    \ JavaScript 中，如果你需要，可以使用 `ts.SyntaxKind.EndOfFileToken`。此外，你可以使用以下函数将这些枚举成员转换为显示字符串：\n\
    \n```typescript\nexport function syntaxKindName(kind: ts.SyntaxKind) {\n  return\
    \ (<any>ts).SyntaxKind[kind];\n}\n```\n\n## Trivia（琐碎元信息）\n\nTrivia（因为它们是微不足道的所以被称为此名）代表了源文本中对理解理解代码大部分不重要的部分。例如：空白符、注释，甚至是冲突标记。Trivia\
    \ 不存储在 AST 中（为了保持其轻量级）。但是可以使用几个 `ts.*` API 按需获取。\n\n在展示它们之前，你需要理解以下内容：\n\n## Trivia\
    \ 所有权\n\n通常情况下：\n\n- 一个 token 拥有它在同一行之后、直到下一个 token 之前的所有 trivia。\n- 该行之后的任何注释都与随后的\
    \ token 关联联。\n\n对于文件中的开头注释和结尾注释：\n\n- 源文件中的第一个 token 获得所有的初始 trivia。\n- 文件中的最后一个\
    \ trivia 序列附加在文件结束标记（end-of-file token）上，否则该标记的宽度为零。\n\n## Trivia APIs\n\n对于大多数基础用途，注释是“有趣”的\
    \ trivia。属于某个 Node 的注释可以通过以下函数获取：\n\n| 函数 | 描述 |\n|---|---|\n| ts.getLeadingCommentRanges\
    \ | 给定源文本和在文本中的位置，返回从给定位置之前的第一个换行符到... 之间的注释范围。 |\n| ts.getTrailingCommentRanges\
    \ | 给定源文本和在文本中的位置，返回直到给定位置之后的第一个换行符的注释范围。 |\n\n作为示例，源文件中的这部分：\n\n```\ndebugger;/*hello*/\n\
    //bye\n/*hi*/function\n```\n\n## Token Start/Full Start（标记起始/完全起始）\n\n节点具有所谓的“token\
    \ start”（标记起始）和“full start”（完全起始）。\n\n- Token Start：更自然的版本，即标记文本在文件中开始的位置。\n-\
    \ Full Start：从扫描器（scanner）自上一个重要标记以来开始的点。\n\n在下面的示例中：\n\n```\ndebugger;/*hello*/\n\
    //bye\n/*hi*/\n```\n\n对于函数来说，token start 在某处，而 full start 在 `/*hello*/`。注意，full\
    \ start 甚至包含了本应由上一个节点拥有的 trivia。\n\n## Scanner（扫描器）\n\nTypeScript 扫描器的源代码完全位于\
    \ `scanner.ts` 中。扫描器由解析器（Parser）内部控制，将源代码转换为 AST。以下是预期的结果：\n\n```\nSourceCode\
    \ -- scanner --> Token Stream parser --> AST\n```\n\n## Parser 使用\n\n`parser.ts`\
    \ 中创建了一个单例扫描器，以避免重复创建扫描器的开销。该扫描器随后由解析器使用 `initializeState` 函数按需初始化。\n\n以下是解析器中实际代码的简化版本，你可以运行它来演示这一概念：\n\
    \n```typescript\ncode/compiler/scanner/runScanner.ts\n\nimport * as ts from \"\
    typescript\";\n// TypeScript 有一个单例扫描器\nconst scanner = ts.createScanner(ts.ScriptTarget.Latest,\
    \ /skipTrivial*/ true);\n\n// 它使用类似于 `initializeState` 的函数初始化\nfunction initializeState(text:\
    \ string) {\n  scanner.setText(text);\n  scanner.onError((message: ts.DiagnosticMessage,\
    \ length: number) => {\n    console.error(message);\n  });\n  scanner.setTarget(ts.ScriptTarget.ES5);\n\
    \  scanner.setLanguageVariant(ts.LanguageVariant.Standard);\n}\n\n// 示例用法\ninitializeState(\n\
    \  var foo = 123;\n  .trim());\n\n// 开始扫描\nvar token = scanner.scan();\nwhile\
    \ (token != ts.SyntaxKind.EndOfFileToken) {\n  console.log(ts.formatSyntaxKind(token));\n\
    \  token = scanner.scan();\n}\n```\n\n"
