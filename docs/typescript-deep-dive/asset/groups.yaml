    /** Two sample functions */

    let iMakePoint2D = () : Point2D => ({ x: 0, y: 0 });

    let iMakePoint3D = () : Point3D => ({ x: 0, y: 0, z: 0 });


    /** Assignment */

    iMakePoint2D = iMakePoint3D; // Okay

    iMakePoint3D = iMakePoint2D; // ERROR: Point2D is not assignable to Point3D

    ```


    # Number of arguments


    Less arguments are okay (i.e. functions can chose to ignore additional args).
    After all you are guaranteed to be called with at least enough arguments.'
