    \ function and TypeScript does indeed use generics to define its structure:\n\n\
    ```typescript\ninterface Array<T> {\n  reverse(): T[];\n  // ...\n}\n```\n\nThis\
    \ means that you get type safety when calling .reverse() on any array as shown\
    \ below:\n\n```typescript\nvar numArr = [1, 2];\nvar reversedNums = numArr.reverse();\n\
    \nreversedNums = ['1', '2']; // Error!\n```\n\nWe will discuss more about the\
    \ Array<T> interface later when we present lib.d.ts in the section Ambient Declarations.\n\
    \n# Union Type\n\nQuite commonly in JavaScript you want to allow a property to\
    \ be one of multiple types e.g. a string or a number. This is where the union\
    \ type (denoted by |) in a type annotation (e.g. string|number) comes in handy.\
    \ A common use case is a function that can take a single object or an array of\
    \ the object e.g.:\n\n```typescript\nfunction formatCommandline(command: string[]|string)\
    \ {\n  var line = '';\n  if (typeof command === 'string') {\n    line = command.trim();\n\
    \  } else {\n    line = command.join(' ').trim();\n  }\n\n  // Do stuff with line:\
    \ string\n}\n```\n\n# Intersection Type\n\nextend is a very common pattern in\
    \ JavaScript where you take two objects and create a new one that has the features\
    \ of both objects. An Intersection Type allows you to use this pattern in a safe\
    \ way as demonstrated below:\n\n```typescript\nfunction extend<T, U>(first: T,\
    \ second: U): T & U {\n  let result = {} as T & U;\n  for (let id in first) {\n\
    \    result[id] = first[id];\n  }\n  for (let id in second) {\n    if (!result.hasOwnProperty(id))\
    \ {\n      result[id] = second[id];\n    }\n  }\n  return result;\n}\n\nvar x\
    \ = extend({ a: \"hello\" }, { b: 42 });\n\n// x now has both `a` and `b`\nvar\
    \ a = x.a;\nvar b = x.b;\n```\n\n# Tuple Type\n\nTypeScript doesn't have first\
    \ class support. People generally just use an array as a tuple. This is exactly\
    \ what the TypeScript type system supports. Tuples can be annotated using `[:typeofmember1,\
    \ typeofmember2]` etc. A tuple can have any number of members. Tuples are demonstrated\
    \ in the below example:\n"
