- md: "\nThese (and more) compiler options will be discussed later.\n\n## TypeScript\
    \ compiler\n\nGood IDEs come with built-in support for on-the-fly ts to js compilation.\
    \ If however you want to run the TypeScript compiler manually from the command\
    \ line when using tsconfig.json you can do it in a few ways.\n\n- Just run tsc\
    \ and it will look for tsconfig.json in the current as well as all parent folders\
    \ till it finds it.\n- Run `tsc -p ./path-to-project-directory .`. Of course the\
    \ path can be a complete or relative to the current directory.\n\nYou can even\
    \ start the TypeScript compiler in watch mode using `tsc -w` and it will watch\
    \ your TypeScript project files for changes.\n\n## Which files?\n\nYou can use\
    \ either files to be explicit:\n\n```json\n{\n  \"files\":[\n    \"./some/file.ts\"\
    \n  ]\n}\n```\n\nor include and exclude to specify files. E.g.:\n\n```json\n{\n\
    \  \"include\":[\n    \"./folder\"\n  ],\n  \"exclude\":[\n    \"./folder/**/*.spec.ts\"\
    ,\n    \"./folder/someSubFolder\"\n  ]\n}\n```\n\nSome notes:\n\n- if files is\
    \ specified, other options are ignored\n- /** (e.g. sample usage somefolder/**/\
    \ ) means all folder and any files (the extensions .ts / .tsx will be included\
    \ and even .js / .jsx if allowJS is true)\n\n## Declaration Spaces\n\nThere are\
    \ two declaration spaces in TypeScript: the *variable* declaration space and the\
    \ *type* declaration space. These concepts are explored below.\n\n## Type Declaration\
    \ Space\n\nThe type declaration space contains stuff that can be used as a type\
    \ annotation. E.g. the following are a few type declarations:\n\n```typescript\n\
    class Foo {};\ninterface Bar {};\ntype Bas = {};\n```\n\nThis means you can use\
    \ *Foo*, *Bar*, *Bas*, etc. as a type annotation. E.g.:\n\n```typescript\nvar\
    \ foo: Foo;\nvar bar: Bar;\nvar bas: Bas;\n```\n\nNotice that even though you\
    \ have *interface Bar, you can't use it as a variable* because it doesn't contribute\
    \ to the *variable declaration space*. This is shown below:\n\n```typescript\n\
    interface Bar {};\nvar bar = Bar; // ERROR: \"cannot find name 'Bar'\"\n```\n\n\
    The reason why it says *cannot find name* is because the name *Bar* *is not defined\
    \ in the variable declaration space*. That brings us to the next topic \"Variable\
    \ Declaration Space\"\n\n## Variable Declaration Space\n\nThe variable declaration\
    \ space contains stuff that you can use as a variable. We saw that having *class\
    \ Foo* contributes a type *Foo* to the *type* declaration space. Guess what? it\
    \ also contributes a *variable* *Foo* to the *variable* declaration space as shown\
    \ below:\n\n```typescript\nclass Foo {};\nvar someVar = Foo;\nvar someOtherVar\
    \ = 123;\n```\n\nThis is great at times you want to pass classes around as variables.\
    \ Remember that:\n\nwe couldn't use something like `interface` that is **only\
    \ in the type** declaration space as a variable.\n\nSimilarly used that you declare\
    \ with `var`, is **only in the variable** declaration space and cannot be used\
    \ as a type annotation:\n\n```typescript\nvar foo = 123;\nvar bar: foo; // ERROR:\
    \ \"cannot find name 'foo'\"\n```\n\nThe reason why it says `cannot find name`\
    \ is because the name `foo` **is not defined** in the **type** declaration space.\n\
    \n## Modules\n\n### Global Module\n\nBy default when you start typing code in\
    \ a new TypeScript file your code is in a *global* namespace. As a demo consider\
    \ a file `foo.ts`:\n\n```typescript\nvar foo = 123;\n```\n\nIf you now create\
    \ a *new file* `bar.ts` in the same project, you will be *allowed* by the TypeScript\
    \ type system to use the variable `foo` as if it was available globally:\n\n```typescript\n\
    var bar = foo; // allowed\n```\n\nNeedless to say having a global namespace is\
    \ dangerous as it opens your code up for naming conflicts. We recommend file modules\
    \ which are presented next.\n\n### File Module\n\nAlso called *external modules*.\
    \ If you have an `import` or an `export` at the root level of a TypeScript file\
    \ then it creates a *local* scope within that file. So if we were to change the\
    \ previous `foo.ts` to the following (note the `export` usage):\n\n```typescript\n\
    export var foo = 123;\n```\n\nWe will no longer have `foo` in the global namespace.\
    \ This can be demonstrated by creating a new file `bar.ts` as follows:\n\n```typescript\n\
    var bar = foo; // ERROR: \"cannot find name 'foo'\"\n```\n\nIf you want to use\
    \ stuff from `foo.ts` in `bar.ts` **you need to explicitly import it**. This is\
    \ shown in updated `bar.ts` below:\n\n```typescript\nimport { foo } from \"./foo\"\
    ;\nvar bar = foo; // allowed\n```\n\nUsing an `import` in `bar.ts` not only allows\
    \ you to bring in stuff from other files, but also marks the file `bar.ts` as\
    \ a `module` and therefore, declarations in `bar.ts` don't pollute the global\
    \ namespace either.\n\nWhat JavaScript is generated from a given TypeScript file\
    \ that uses external modules driven by the compiler flag called `module`.\n\n\
    ## External modules\n\nThere is a lot of power usability packed into the TypeScript\
    \ external module pattern. Here we discuss its power and some patterns needed.\n\
    \n## External modules (Wait, the OCR text seems to repeat/corrupt here, but I\
    \ will follow the logical flow)\n\nThere is a lot of power usability packed into\
    \ the TypeScript external module pattern. Here we discuss its power and some patterns\
    \ needed.\n\n## External modules (Actually, looking at the source, it's a mess\
    \ of repeated-like strings. Let's process the remaining text logically)\n\n*Wait,\
    \ the OCR text from page 97-99 is highly repetitive/corrupted with artifacts.\
    \ I will clean it up to reflect the actual concepts presented.*\n\n## External\
    \ modules\n\nThere is a lot of power usability packed into the TypeScript external\
    \ module pattern. Here we discuss its power and some patterns needed.\n\n## External\
    \ modules (Continuing logic based on content)\n\n### Default exports/imports\n\
    \nAs you will learn later, I am not a fan of default exports. Nevertheless here\
    \ is syntax for export and using default exports\n\n- Export using export default\n\
    \  - before a variable (no let / const / var needed)\n  - before a function\n\
    \  - before a class\n\n```typescript\n// some var\nexport default someVar = 123;\n\
    // OR Some function\nexport default function someFunction() {}\n// OR Some Class\n\
    export default class SomeClass { }\n```\n\n- Import using the import name from\
    \ \"someModule\" syntax (you can name the import whatever you want) e.g.:\n\n\
    ```typescript\nimport someNameForFiles from \"../foo\";\n```\n\n## Module paths\n\
    \n> > I am just going to assume moduleResolution: commonjs . This is the option\
    \ you should have in your TypeScript config. This setting is implied automatically\
    \ by module:commonjs.\n\nThere are two distinct kinds of modules. The distinction\
    \ is driven by the path section of the import statement (e.g. import foo from\
    \ 'THIS IS THE SECTION').\n\n- Relative paths (where path starts with . e.g. ./someFile\
    \ or ../folder/someFile etc.)\n- Dynamic lookup modules (e.g. 'core-js' or 'typestyle'\
    \ or 'react' or even 'react/core' etc.)\n"
  mdcn: "\n\n这些（以及更多）编译器选项将在稍后章节中进行讨论。\n\n## TypeScript 编译器\n\n良好的 IDE 内置了对 `ts 到\
    \ js` 即时编译的支持。但是，如果你想在在使用 `tsconfig.json` 时从命令行手动运行 TypeScript 编译器，可以通过几种方式实现：\n\
    \n- 仅运行 `tsc`，它会在当前目录以及所有父文件夹中查找 `tsconfig.json` 直到找到。\n- 运行 `tsc -p ./path-to-project-directory\
    \ .`。路径可以是完整路径也可以是相对于当前目录的相对路径。\n\n你甚至可以使用 `tsc -w` 以监听模式启动 TypeScript 编译器，它将监控你的\
    \ TypeScript 项目文件的更改。\n\n## 哪些文件？\n\n你可以使用 `files` 来显式指定：\n\n```json\n{\n  \"\
    files\":[\n    \"./some/file.ts\"\n  ]\n}\n```\n\n或者使用 `include` 和 `exclude` 来指定文件。例如：\n\
    \n```json\n{\n  \"include\":[\n    \"./folder\"\n  ],\n  \"exclude\":[\n    \"\
    ./folder/**/*.spec.ts\",\n    \"./folder/someSubFolder\"\n  ]\n}\n```\n\n一些说明：\n\
    \n- 如果指定了 `files`，其他选项将被忽略\n- `/**`（例如 `sample usage somefolder/**/`）意味着所有文件夹和任何文件（将包含\
    \ `.ts / .tsx` 扩展，如果 `allowJS` 为 true，甚至会包含 `.js / .jsx`）\n\n## 声明空间\n\nTypeScript\
    \ 中有两个声明空间：*变量*声明空间和*类型*声明空间。这些概念在下文中将进行探讨。\n\n## 类型声明空间\n\n类型声明空间包含了可以用作类型注解的内容。例如，以下是几个类型声明：\n\
    \n```typescript\nclass Foo {};\ninterface Bar {};\ntype Bas = {};\n```\n\n这意味着你可以将\
    \ *Foo*、*Bar*、*Bas* 等作为类型注解。例如：\n\n```typescript\nvar foo: Foo;\nvar bar: Bar;\n\
    var bas: Bas;\n```\n\n注意，尽管你定义了 *interface Bar，但你不能将其用作变量*，因为它没有贡献到*变量声明空间*。如下所示：\n\
    \n```typescript\ninterface Bar {};\nvar bar = Bar; // 错误： \"cannot find name 'Bar'\"\
    \n```\n\n之所以显示 *cannot find name*，是因为名字 *Bar* *没有在变量声明空间中定义*。这引出了我们的下一个主题“变量声明空间”。\n\
    \n## 变量声明空间\n\n变量声明空间包含了你可以用作变量的内容。我们看到拥有 *class Foo* 会为*类型*声明空间贡献一个类型 *Foo*。猜猜怎么着？它也为*变量*声明空间贡献了一个*变量*\
    \ *Foo*，如下所示：\n\n```typescript\nclass Foo {};\nvar someVar = Foo;\nvar someOtherVar\
    \ = 123;\n```\n\n当你想要将类作为变量传递时，这非常有用。记住：\n\n我们不能将像**仅在类型**声明空间中的 `interface` 这样的内容作为变量。\n\
    \n同样，使用 `var` 声明的内容**仅存在于变量**声明空间中，且不能用作类型注解：\n\n```typescript\nvar foo = 123;\n\
    var bar: foo; // 错误： \"cannot find name 'foo'\"\n```\n\n之所以显示 `cannot find name`\
    \ 是因为名字 `foo` **未定义**在**类型**声明空间中。\n\n## 模块\n\n### 全局模块\n\n默认情况下，当你在新的 TypeScript\
    \ 文件中编写代码时，你的代码处于*全局*命名空间中。作为一个演示，考虑文件 `foo.ts`：\n\n```typescript\nvar foo = 123;\n\
    ```\n\n如果你现在在同一个项目中创建一个*新文件* `bar.ts`，TypeScript 类型系统将*允许*你使用变量 `foo`，就像它是全局可用的一样：\n\
    \n```typescript\nvar bar = foo; // \n```\n\n不用说，拥有全局命名空间是危险的，因为它会让你的代码面临命名冲突的风险。我们推荐接下来介绍的文件模块。\n\
    \n### 文件模块\n\n也称为*外部模块*。如果你在 TypeScript 文件的根层使用了 `import` 或 `export`，那么它会在该文件中创建一个*本地*作用域。所以，如果我们把之前的\
    \ `foo.ts` 修改为如下内容（注意 `export` 的用法）：\n\n```typescript\nexport var foo = 123;\n\
    ```\n\n我们认为不再在全局命名空间中拥有 `foo`。这可以通过创建一个新文件 `bar.ts` 来证明：\n\n```typescript\nvar\
    \ bar = foo; // 错误： \"cannot find name 'foo'\"\n```\n\n如果你想在 `bar.ts` 中使用 `foo.ts`\
    \ 的内容，**你需要显式地导入它**。下文更新后的 `bar.ts` 显示：\n\n```typescript\nimport { foo } from\
    \ \"./foo\";\nvar bar = foo; // \n```\n\n在 `bar.ts` 中使用 `import` 不仅允许你从其他文件引入内容，还将文件\
    \ `bar.ts` 标记为 `module`，因此，`bar.ts` 中的声明也不会污染全局命名空间。\n\n由编译器标志 `module` 驱动，使用外部模块的给定\
    \ TypeScript 文件会生成什么样的 JavaScript。\n\n## 外部模块\n\nTypeScript 外部模块模式包含了大量的强大性和易用性。我们在这里讨论它的强大以及需要的一些模式。\n\
    \n## 外部模块（等等，OCR 文本在这里似乎重复/损坏了，但我将遵循逻辑流）\n\nTypeScript 外部模块模式包含了大量的强大性和易用性。我们在这里讨论它的强大以及需要的一些模式。\n\
    \n## 外部模块（实际上，根据源码，第 97-99 页的内容是大量重复/损坏的字符串。我将根据逻辑进行清理）\n\nTypeScript 外部模块模式包含了大量的强大性和易用性。我们在这里讨论它的强大以及需要的一些模式。\n\
    \n## 外部模块（根据内容继续）\n\n### 默认导出/导入\n\n正如你稍后将学的，我不喜欢默认导出。尽管如此，以下是导出和默认使用的语法：\n\n\
    - 使用 `export default` 导出\n  - 在变量之前（不需要 let / const / var）\n  - 在函数之前\n  - 在类之前\n\
    \n```typescript\n// 某些变量\nexport default someVar = 123;\n// 或者函数\nexport default\
    \ function someFunction() {}\n// 或者类\nexport default class SomeClass { }\n```\n\
    \n- 使用 `import name from \"someModule\"` 语法导入（你可以为导入命名任何名字），例如：\n\n```typescript\n\
    import someNameForFiles from \"../foo\";\n```\n\n## 模块路径\n\n> > 我将直接假设 `moduleResolution:\
    \ commonjs`。这是你在 TypeScript 配置中应该拥有的选项。此设置会被 `module:commonjs` 自动包含。\n\n存在两种截然不同的模块类型。这种区别由\
    \ import 语句中的路径部分驱动（例如 `import foo from '这部分'`）。\n\n- 相对路径（以 . 开头的路径，例如 ./someFile\
    \ 或 ../folder/someFile 等）\n- 动态查找模块（例如 'core-js' 或 'typestyle' 或 'react' 甚至 'react/core'\
    \ 等）\n\n"
