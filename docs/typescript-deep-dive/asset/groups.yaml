    \n```\n// 错误：调用时传入了 `more`\niTakeSomethingPassITANErr(err, data, more) => null;//\
    \ 错误\n```\n\n### 可选参数和剩余参数\n\n可选参数（预定的数量）和剩余参数（任意数量的参数）是兼容的，再次：是为了方便。\n\n```\n\
    let foo = (x:number, y: number) => { /* do something */ }\nlet bar = (x?, y?:\
    \ number) => { /* do something */ }\nlet bas = (...args: number[]) => { /* do\
    \ something */ }\n```\n\n```\nfoo = bar = bas;\nbas = bar = foo;\n```\n\n> 注意：可选（示例中的\
    \ bar）和非可选（示例中的 foo）在 `strictNullChecks` 为 false 时才兼容。\n\n### 参数类型\n\n双变：这是为了支持常见的事件处理场景设计的。\n\
    \n```\n// 事件层级 */\ninterface Event { timestamp: number; }\ninterface MouseEvent\
    \ extends Event { x: number; y: number }\ninterface KeyEvent extends Event { keyCode:\
    \ number }\n```\n\n```\n/** 示例监听器 */\nenum EventType { Mouse, Keyboard, Event\
    \ }\nfunction addEventListener(eventType: EventType, handler: (n: Event) => void)\
    \ {\n  /* ... */\n}\n```\n\n```\n// 不健全，但有用且常见。因为函数参数比较是双变的\naddEventListener(eventType:\
    \ EventType, (e: MouseEvent) => console.log(e.x + \" , \" + e.y));\n```\n\n```\n\
    // 在存在健全性的情况下不受愿的替代方案\naddEventListener(eventType: EventType.Mouse, (e: Event)\
    \ => console.log((MouseEvent).x + \" , \" + e.y));\naddEventListener(eventType:\
    \ EventType.Mouse, <e: Event> => void>(e);\n```\n\n"
