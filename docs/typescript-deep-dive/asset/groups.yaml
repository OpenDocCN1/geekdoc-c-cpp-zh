    }\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg instanceof Foo) {\n    console.log(arg.foo);\
    \ // OK\n  } else if (arg instanceof Bar) {\n    console.log(arg.bar); // OK\n\
    \  }\n}\n```\n\n## Literals\n\nLiterals are exact values that are JavaScript primitives.\n\
    \n### String Literals\n\nYou can use a string literal as a type. For example:\n\
    \n```typescript\nlet foo: 'Hello';\n```\n\nHere we have created a variable called\
    \ foo that will only allow the literal value 'Hello' to be assigned to it. This\
    \ is demonstrated below:\n\n```typescript\nlet foo: 'Hello';\nfoo = 'Bar'; //\
    \ Error: \"Bar\" is not assignable to type \"Hello\"\n```\n\nThey are not very\
    \ useful on their own but can be combined in a type union to create a powerful\
    \ (and useful) abstraction e.g.:\n\n```typescript\ntype CardinalDirection =\n\
    \  \"North\"\n  | \"East\"\n  | \"South\"\n  | \"West\"\n\nfunction move(distance:\
    \ number, direction: CardinalDirection) {\n  // ...\n}\n```\n\n```typescript\n\
    move(1,\"North\"); // Okay\nmove(1,\"Nurth\"); // Error!\n```\n\n## User Defined\
    \ Type Guards\n\nJavaScript doesn't have rich runtime introspection. For these\
    \ cases you can create User Type Guard functions. These are just functions that\
