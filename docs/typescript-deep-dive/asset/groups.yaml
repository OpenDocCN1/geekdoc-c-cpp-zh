  - "[PAGE 157]\n\n```\nOverloads\nfunction padding(all: number);\nfunction padding(topBottom:\
    \ number, leftAndRight: number);\nfunction padding(top: number, right: number,\
    \ bottom: number, left: number);\n// Actual implementation that is a true representation\
    \ of all the cases the function b\needs to handle\nfunction padding(a: number,\
    \ b?: number, c?: number, d?: number) {\n  if (b === undefined && c === undefined\
    \ && d === undefined) {\n    b = c = d = a;\n  } else if (c === undefined && d\
    \ === undefined) {\n    c = a;\n    d = b;\n  }\n  return {\n    top: a,\n   \
    \ right: b,\n    bottom: c,\n    left: d\n  };\n}\n```\n\nHere the first three\
    \ function signatures are what is available as valid calls to padding:\n\n```\n\
    padding(1); // Okay: all\npadding(1,1); // Okay: paddingTop, leftAndRight\npadding(1,1,1);\
    \ // Okay: top, right, bottom, left\n\npadding(1,1,1,1); // Error: Not a part\
    \ of the available overloads\n```\n\nOf course it's important for the final declaration\
    \ (the true declaration as seen from inside the function) to be compatible with\
    \ all the overloads. This is because that is the true nature of the function calls\
    \ that the function body needs to account for.\n\n> Function overloading in TypeScript\
    \ doesn't come with any runtime overhead. It just allows you to document the manner\
    \ you expect the function to be called in and the compiler holds the rest of your\
    \ code in check."
  - "[PAGE 158]\n\n# Callable\n\nYou can annotate callables as a part of a type or\
    \ an interface as follows\n\n```\ninterface ReturnString {\n  (): string\n}}\n\
    ```\n\nAn instance of such an interface would be a function that returns a string\
    \ e.g.\n\n```\ndeclare const foo: ReturnString;\nconst bar = foo(); // bar is\
    \ inferred as a string\n```\n\n# Obvious examples\n\nOf course such *callable*\
    \ annotation can also specify any arguments / optional arguments / rest arguments\
    \ as needed. e.g. here is a complex example:\n\n```\ninterface Complex {\n  (foo:\
    \ string, bar?: number, ...others: boolean[]): number;\n}\n```\n\nThey can even\
    \ specify overloads:\n\n```\ninterface Overloaded {\n  (foo: string): string\n\
    \  (foo: number): number\n}\n\n// example implementation\nconst overloaded: Overloaded\
    \ = (foo) => foo;\n\n// example usage\nconst str = overloaded(''); // str is inferred\
    \ string\nconst num = overloaded(123); // num is inferred number\n```\n\nOf course\
    \ like *all* bodies of interfaces / types you can use these as variable type annotations\
    \ e.g."
  - "[PAGE 159]\n\n```\noverloaded: {\n  (foo: string): string\n  (foo: number): number\n\
    } = (foo) => foo;\n```\n\n# Arrow Syntax\n\nTo make it easy to specify callable\
    \ signatures TypeScript also allows simple arrow type annotations e.g. a function\
    \ that takes a number and returns a string can be annotated as:\n\n```\nconst\
    \ simple: (foo: number) => string\n  = (foo) => foo.toString();\n```\n\nOnly limitation\
    \ of the arrow syntax: You can't specify overloads. For overloads you must use\
