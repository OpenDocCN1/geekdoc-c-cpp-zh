  - "[PAGE 272]\n\n# Function Parameters\n\nIf you have a function that takes too\
    \ many parameters, or parameters of the same type, then you might want to consider\
    \ changing the function to take an object instead.\n\nConsider the following function:\n\
    \n```\nfunction foo(flagA: boolean, flagB: boolean) {\n  // your awesome function\
    \ body\n}\n```\n\nWith such a function definition it's quite easy to invoke it\
    \ incorrectly e.g. foo(flagB, flagA) and you would get no help from the compiler.\n\
    \nInstead, convert the function to take an object:\n\n```\nfunction foo(config:\
    \ {flagA: boolean, flagB: boolean}) {\n  const {flagA, flagB} = config;\n  //\
    \ your awesome function body\n}\n```\n\nNow the function calls will look like\
    \ foo({flagA, flagB}) which makes it much easier to spot mistakes and code review.\n\
    \n> Note : If your function is simple enough, and you don't expect much churn,\
    \ then feel free to ignore this advice."
