    # @types


    Definitely Typed is one of TypeScript''s greatest strengths. The community has
    effectively gone ahead and **documented** the nature of nearly 90% of the top
    JavaScript projects out there.


    This means that you can use these projects in a very interactive and exploratory
    manner, no need to have the docs open in a seperateate window and making sure
    you don''t make a typo.


    # Using @types


    Installation is fairly simple as it just works on top of `npm` . So as an example
    you can install type definitions for `jquery` simply as:


    ```

    npm install @types/jquery --save-dev

    ```


    @types supports both *global* and *module* type definitions.


    # Global @types


    By default any definitions that support global consumption are included automatically.
    E.g. for `jquery` you should be able to just start using `$ globally` in your
    project.


    However for `libraries` (like `jquery` ) I generally recommend using modules*:


    # Module @types


    After installation, no special configuration is required really. You just use
    it like a module e.g.:


    ```

    import * as $ from "jquery";n// Use $ at will in this module :)

    ```


    # Controlling Globals


    As can be having a definition that supports global leak in automatically can be
    a problem for some team so you chose to *explicitly* only bring in the types that
    make sense using the `tsconfig.json` `compilerOptions.types` e.g.:'
  - "[PAGE 131]\n\n```\n\"compilerOptions\": {\n  \"types\" : [\n    \"jquery\"\n\
    \  ]\n}\n```\n\nThe above shows a sample where where only jquery will be allowed\
    \ to be used. Even if the person installs another definition like npm install\
    \ @types/node its globals (e.g. process ) will not leak into your code until you\
    \ add them to the tsconfig.json types option."
- md: "\n# Ambient Declarations\n\nAs we mentioned in why TypeScript:\n\n> A major\
    \ design goal of TypeScript was to make it possible for you to safely and easily\
    \ use existing JavaScript libraries in TypeScript. TypeScript does this by means\
    \ of declaration.\n\nAmbient declarations allow you to safely use existing popular\
    \ JavaScript libraries and incrementally migrate your JavaScript/CoffeeScript/Other-Compile-To-Js-Language\
    \ project to TypeScript.\n\nStudying patterns in ambient declarations for third\
    \ party JavaScript code is good practice for annotating your TypeScript code base\
    \ as well. This is why we present it so early on.\n\n# Declaration file\n\nYou\
    \ can tell TypeScript that you are trying to describe code that exists elsewhere\
    \ (e.g. written in JavaScript/CoffeeScript/The runtime environment like the browser\
    \ or Node.js) using the `declare` keyword. As a quick example:\n\n```typescript\n\
    foo = 123; // Error: `foo` is not defined\n```\n\nvs.\n\n```typescript\ndeclare\
    \ var foo: any;\nfoo = 123; // allowed\n```\n\nYou have the option of putting\
    \ these declarations in a .ts file or in a .d.ts file. We highly recommend that\
    \ in your real world projects you use a separate .d.ts (start with one called\
    \ like `globals.d.ts` or `vendor.d.ts`).\n\nIf a file has the extension .d.ts\
    \ then each root level definition must have the `declare` keyword prefixed to\
    \ it. This helps make it clear to the author that there will be no code emitted\
    \ by TypeScript. The author needs to ensure that the declared item will exist\
    \ at runtime.\n\n- Ambient declarations are a promise that you are making with\
    \ the compiler. If they do not exist at runtime and you try to use them, things\
    \ will break without warning.\n- Ambient declarations are like docs. If the source\
    \ changes the docs need to be updated. So you might have new behaviours that work\
    \ at runtime but no one's updated the ambient declaration and hence you get compiler\
    \ errors.\n\n# Variables\n\nFor example to tell TypeScript about the process variable\
    \ you **can** do:\n\n```typescript\ndeclare var process: any;\n```\n\nYou don't\
    \ *need* to do this for process as there is already a community maintained node.d.ts.\n\
    \nThis allows you to use the process variable without TypeScript complaining:\n\
    \n```typescript\nprocess.exit();\n```\n\nWe recommend using an interface wherever\
    \ possible e.g.:\n\n```typescript\ninterface Process {\n  exit(code?: number):\
    \ void;\n}\ndeclare var process: Process;\n```\n\nThis allows other people to\
    \ *extend* the nature of these global variables while still telling TypeScript\
    \ about such modifications. E.g. consider the following case where we add an **exitWithLogging**\
    \ function to process for our amusement:\n\n```typescript\ninterface Process {\n\
    \  exitWithLogging(code?: number): void;\n}\nprocess.exitWithLogging = function()\
    \ {\n  console.log(\"exiting\");\n  process.exit.apply(process, arguments);\n\
    };\n```\n\nLet's look at interfaces in a bit more detail next.\n\n# Interfaces\n\
    \nInterfaces have zero runtime JS impact. There is a lot of power in TypeScript\
    \ interfaces to declare the structure of variables.\n\nThe following two are equivalent\
    \ declarations, the first uses an *inline annotation*, the second uses an *interface*:\n\
    \n```typescript\n// Sample A\ndeclare var myPoint: { x: number; y: number; };\n\
    \n// Sample B\ninterface Point {\n    x: number; y: number;\n}\ndeclare var myPoint:\
    \ Point;\n```\n\nHowever the beauty of *Sample B* is that if someone authors a\
    \ library that builds on the myPoint library to add new members, they can easily\
    \ add to the existing declaration of myPoint :\n\n```typescript\n// Lib a.d.ts\n\
    interface Point {\n    x: number; y: number;\n}\ndeclare var myPoint: Point;\n\
    \n// Lib b.d.ts\ninterface Point {\n    z: number;\n}\n\n// Your code\nvar myPoint.z;\
    \ // Allowed!\n```\n\nThis is because **interfaces in TypeScript are open ended**.\
    \ This is a vital ten of TypeScript that allows you to mimic the extensibility\
    \ of JavaScript using *interfaces*.\n\n# Classes can implement interfaces\n\n\
    If you want to use *classes* that must follow an object structure that someone\
    \ declared for you in an *interface* you can use the `implements` keyword to ensure\
    \ compatibility:\n\n```typescript\ninterface Point {\n  x: number; y: number;\n\
    }\n\nclass MyPoint implements Point {\n  x: number; y: number; // Same as Point\n\
    }\n```\n\nBasically in the presence of that implements, any changes in that external\
    \ Point interface will result in a compile error in your code base so you can\
    \ easily keep it in sync:\n\n```typescript\ninterface Point {\n  x: number; y:\
    \ number;\n  z: number; // New member\n}\n\nclass MyPoint implements Point { //\
    \ ERROR : missing member 'z'\n  x: number; y: number;\n}\n```\n\n```typescript\n\
    var foo: Point = new MyPoint();\n```\n\nAnd stuff like foo: Point = MyPoint is\
    \ not the same thing.\n\n# TIPs\n\n# Not every interface is implementable easily\n\
    \nInterfaces are designed to declare any arbitrarily crazy structure that might\
    \ be present in JavaScript.\n\nConsider the following interface where something\
    \ is callable with new :\n\n```typescript\ninterface Crazy {\n  new (): {\n  \
    \  hello: number;\n  }\n}\n```\n\nYou would essentially have something like:\n\
    \n```typescript\nclass CrazyClass implements Crazy {\n  constructor() {\n    return\
    \ { hello: 123 };\n  }\n}\n// Because\nconst crazy = new Crazy();\n```\n\n# Enums\n\
    \n- Enums\n- Enums and numbers\n- Enums and strings\n- Changing the number associated\
    \ with an enum\n- Enums are open ended\n- Enums are open ended\n\nBy default,\
    \ enums are based and then each subsequent value increments by 1. As an example\
    \ consider the following:\n\n```typescript\nenum Color {\n    Red,   // 0\n  \
    \  Green, // 1\n    Blue,  // 2\n}\n```\n\nHowever you can change the number associated\
    \ with any enum member by assigning to it specifically. This is demonstrated below\
    \ where we start at 3 and start incrementing from there:\n\n```typescript\nenum\
    \ Color {\n    DarkRed = 3,   // 3\n    DarkGreen, // 4\n    DarkBlue // 5\n}\n\
    ```\n\n> TIP: I quite commonly initialize the first enum with = 1 as it allows\
    \ me to do a safe truth check on an enum value.\n\n# Enums are open ended\n\n\
    Here is the generated JavaScript for an enum shown again:\n\n```javascript\nvar\
    \ Tristrate;\n(function (Tristrate) {\n    Tristrate[\"False\"] = 0 = \"False\"\
    ;\n    Tristrate[\"True\"] = 1 = \"True\";\n    Tristrate[\"Unknown\"] = 2 = \"\
    Unknown\";\n})(Tristrate || (Tristrate = {}));\n```\n\nWe already explained the\
    \ Tristrate Tristrate[\"False\"] = 0 = \"False\"; portion.\n\n# Enums and Strings\n\
    \nThis means that you can use a string version of the enum to a number. This is\
    \ demonstrated below:\n\n```typescript\nenum Trystate {\n  False,\n  True,\n \
    \ Unknown\n}\nconsole.log(Tristate[0]); // \"False\"\nconsole.log(Tristate[\"\
    False\"]) // 0\nconsole.log(Tristate[Tristate.False]); // \"False\" because `Tristate.False\
    \ == 0`\n```\n"
  mdcn: "\n\n# 环境局声明 (Ambient Declarations)\n\n正如我们在“为什么选择 TypeScript”中所提到的：\n\n>\
    \ TypeScript 的主要设计目标之一是让你能够安全且方便地在 TypeScript 中现有的 JavaScript 库。TypeScript 通过声明（declaration）来实现这一点。\n\
    \n环境声明（Ambient declarations）允许你安全地使用现流行的 JavaScript 库，并将你的 JavaScript/CoffeeScript/其他编译为\
    \ JS 的语言项目增量迁移到 TypeScript。\n\n研究第三方 JavaScript 代码的环境声明模式，对于为你的 TypeScript 代码库进行注解也是一种良好的实践。这就是为什么我们尽早介绍它的原因。\n\
    \n# 声明文件 (Declaration file)\n\n你可以使用 `declare` 关键字告诉 TypeScript 你正在尝试描述存在别处的代码（例如用\
    \ JavaScript/CoffeeScript 或在浏览器、Node.js 等运行时环境中编写的代码）。这是一个简单的例子：\n\n```typescript\n\
    foo = 123; // 错误：`foo` 未定义\n```\n\n对比：\n\n```typescript\ndeclare var foo: any;\n\
    foo = 123; // 允许\n```\n\n你可以选择将这些声明放在 .ts 文件或 .d.ts 文件中。我们强烈建议在实际项目中使用独立的 .d.ts\
    \ 文件（从名为 `globals.d.ts` 或 `vendor.d.ts` 的文件开始）。\n\n如果文件扩展名为 .d.ts，则每个根级定义必须以 `declare`\
    \ 关键字开头。这有助于作者明确：TypeScript 不会产生任何代码。作者需要确保声明的项在运行时是存在的。\n\n- 环境声明是你向编译器做出的承诺。如果它们在运行时不存在而你又尝试使用它们，程序将在没有任何警告的情况下崩溃。\n\
    - 环境声明就像文档。如果源码发生了变化，文档也需要更新。因此，你可能会有一些运行时正常的新行为，但没有人更新环境声明，导致你遇到编译器错误。\n\n# 变量\
    \ (Variables)\n\n例如，要告诉 TypeScript 关于进程变量你**可以**这样做：\n\n```typescript\ndeclare\
    \ var process: any;\n```\n\n你*不需要*为 `process` 这样做，因为已经有一个社区维护的 `node.d.ts`。\n\n\
    这允许你在 TypeScript 不会报错的情况下使用 `process` 变量：\n\n```typescript\nprocess.exit();\n\
    ```\n\n我们建议尽可能使用接口（interface），例如：\n\n```typescript\ninterface Process {\n  exit(code?:\
    \ number): void;\n}\ndeclare var process: Process;\n```\n\n这允许其他人在*扩展*这些全局变量特性的同时，仍能告知\
    \ TypeScript 这些修改。例如，考虑以下情况，我们为了好玩给 `process` 添加了一个 **exitWithLogging** 函数：\n\n\
    ```typescript\ninterface Process {\n  exitWithLogging(code?: number): void;\n\
    }\nprocess.exitWithLogging = function() {\n  console.log(\"exiting\");\n  process.exit.apply(process,\
    \ arguments);\n};\n```\n\n接下来让我们详细地查看接口。\n\n# 接口 (Interfaces)\n\n接口对运行时 JS 零影响。TypeScript\
    \ 接口在声明变量结构方面具有巨大的威力。\n\n以下两个是等效的声明，第一个使用*内联注解*，第二个使用*接口*：\n\n```typescript\n\
    // 示例 A\ndeclare var myPoint: { x: number; y: number; };\n\n// 示例 B\ninterface\
    \ Point {\n    x: number; y: number;\n}\ndeclare var myPoint: Point;\n```\n\n\
    然而，*示例 B* 的之处在于，如果有人编写了一个基于 `myPoint` 库的库并添加新成员，他们可以轻松地向 `myPoint` 的现有声明中添加：\n\
    \n```typescript\n// Lib a.d.ts\ninterface Point {\n    x: number; y: number;\n\
    }\ndeclare var myPoint: Point;\n\n// Lib b.d.ts\ninterface Point {\n    z: number;\n\
    }\n\n// 你的代码\nvar myPoint.z; // 允许！\n```\n\n这是因为**TypeScript 中的接口是开放的**。这是 TypeScript\
    \ 的一个核心特性，允许你使用*接口*来模拟 JavaScript 的扩展性。\n\n# 类可以实现接口 (Classes can implement interfaces)\n\
    \n如果你想使用必须遵循某人在*接口*中为你声明的对象结构的*类*，可以使用 `implements` 关键字来确保兼容性：\n\n```typescript\n\
    interface Point {\n  x: number; y: number;\n}\n\nclass MyPoint implements Point\
    \ {\n  x: number; y: number; // 与 Point 相同\n}\n```\n\n基本上，在存在 `implements` 的情况下，外部\
    \ `Point` 接口的任何更改都将导致你的代码库出现编译错误，因此你可以轻松保持同步：\n\n```typescript\ninterface Point\
    \ {\n  x: number; y: number;\n  z: number; // 新成员\n}\n\nclass MyPoint implements\
    \ Point { // 错误：缺少成员 'z'\n  x: number; y: number;\n}\n```\n\n```typescript\nvar\
    \ foo: Point = new MyPoint();\n```\n\n而 `foo: Point = MyPoint` 并不是一回事。\n\n# 提示\
    \ (TIPs)\n\n# 并不是每个接口都能轻松实现 (Not every interface is implementable easily)\n\n\
    接口的设计用于声明 JavaScript 中可能存在的任何任意疯狂结构。\n\n考虑以下接口，其中某些内容可以使用 `new` 构造：\n\n```typescript\n\
    interface Crazy {\n  new (): {\n    hello: number;\n  }\n}\n```\n\n你本质上会有这样的东西：\n\
    \n```typescript\nclass CrazyClass implements Crazy {\n  constructor() {\n    return\
    \ { hello: 123 };\n  }\n}\n// 因为\nconst crazy = new Crazy();\n```\n\n# 枚举 (Enums)\n\
    \n- 枚举\n- 枚举与数字\n- 枚举与字符串\n- 修改与枚举关联的数字\n- 枚举是开放的\n- 枚举是开放的\n\n默认情况下，枚举是基础的，随后的每个值递增\
    \ 1。例如，考虑以下：\n\n```typescript\nenum Color {\n    Red,   // 0\n    Green, // 1\n\
    \    Blue,  // 2\n}\n```\n\n然而，你可以通过特定的赋值来更改与枚举成员关联的数字。如下示例所示，我们从 3 开始并从此递增：\n\
    \n```typescript\nenum Color {\n    DarkRed = 3,   // 3\n    DarkGreen, // 4\n\
    \    DarkBlue // 5\n}\n```\n\n> 提示：我经常将第一个枚举初始化为 1，这样对枚举值进行安全的真值检查。\n\n# 枚举是开放的\
    \ (Enums are open ended)\n\n这里再次显示枚举生成的 JavaScript：\n\n```javascript\nvar Tristrate;\n\
    (function (Tristrate) {\n    Tristrate[\"False\"] = 0 = \"False\";\n    Tristrate[\"\
    True\"] = 1 = \"True\";\n    Tristrate[\"Unknown\"] = 2 = \"Unknown\";\n})(Tristrate\
    \ || (Tristrate = {}));\n```\n\n我们已经解释过 `Tristrate Tristrate[\"False\"] = 0 =\
    \ \"False\";` 部分。\n\n# 枚举与字符串 (Enums and Strings)\n\n这意味着你可以将枚举的字符串版本转换为数字。如下所示：\n\
    \n```typescript\nenum Trystate {\n  False,\n  True,\n  Unknown\n}\nconsole.log(Tristate[0]);\
    \ // \"False\"\nconsole.log(Tristate[\"False\"]) // 0\nconsole.log(Tristate[Tristate.False]);\
    \ // \"False\" 因为 `Tristate.False == 0`\n```\n\n"
