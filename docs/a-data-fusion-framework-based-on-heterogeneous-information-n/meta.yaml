    然而，随着实体及其功能的数量增加，触发动作和配方的潜力呈指数级增长。以智能家居中的为例（Mi et al., 2017），当智能设备除湿机的使用扩展到当前场景时，该场景包含
    14 个配方和 10 个动作，导致至少有 140 种可能的配方（Yu, Hua, & Julien, 2021）。随着物联网生态系统的扩展，对于用户来说创建和管理配方变得既耗时又具有挑战性。


    针对这个问题，研究人员对基于用户自然语言的自动生成配方表现出兴趣，而不是依赖手动创建（Corno et al., 2021; Yao, Li, Gao, et
    al.


