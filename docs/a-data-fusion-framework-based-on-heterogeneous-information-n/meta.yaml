    To validate the efficacy of our framework, we select classical NLP and embedding
    algorithms as comparison methods. TF-IDF (Ramos et al., 2003) is a statistical
    method that can evaluate the importance of a word in a sentence or to an article
    in a corpus by term frequency. We can consider the weight as embedding for each
    sentence.


    sentenceBERT (Reimers & Gurevich, 2019) can generate sentence embeddings for sentences
    in text, and the semantic similarity of the sentences is calculated. We apply
    it to generate descriptions for each sentence.


    node2vec (Gouè & Lesovec, 2016) is a typical network embedding for heterogeneous
    methods. We design a biased random walk that maximizes the overlap between breadth-first
    search and depth-first search by introducing parameters p and q. The method is
    used to generate embeddings. By applying node2vec to heterogeneous graphs, we
    get graph representations.


    metaph2vec (Dong et al., 2017) is a heterogeneous embedding algorithm. It uses
    a strict string matching method to guide random walks, using specific methods
    for types of content.


    metaph2vec (Zheng et al., 2017) uses a meta-guided random walk to generate heterogeneous
    node sequences. The skip-gram is used to learn node embedding. From different
    metaph2vec, the algorithm can be applied for multiple downstream tasks.


    FastGTNs (Jun et al., 2022) is a supervised learning method that combines the
    advantage of transform and graph neural networks (Jun, Kim, Kang & Kim) to extract
    meaningful features from graphs and learn better representation.


    ## 5.1.3. Evaluation


    Due to imbalance, the above-mentioned algorithms favor the majority class, which
