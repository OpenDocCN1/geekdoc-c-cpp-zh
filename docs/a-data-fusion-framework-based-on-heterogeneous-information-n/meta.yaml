    \ Through a conventional approach, they say TAP can consider users' intentions\
    \ and preferences and the context to recommend recipes (Corno, 2021; Hu, Xu, and\
    \ Wang (2019)) focuses on how intentions at the human level are connected to actions\
    \ in IFTTT to represent the different semantic relationships among these context-aware\
    \ data. The network engine is used to learn latent representations of interactions.\
    \ Recent kinds (Kim, Salt, and Lee, 2020; Wu, Yu, and Wang, 2021) focus on learning\
    \ the representation of intentions and action from contexts at the machine level.\n\
    \nHowever, the mentioned approaches either study the descriptions from human level\
    \ or the interaction contexts from the machine level, which did not differentiate\
    \ the loft from human-machine level, resulting in inefficient utilization of IoT\
    \ data. TAP provides the information from both human and machine levels by graph\
    \ modeling and then fuses the representations of recipes through HIND binding.\n\
    \n![](img/dbd639bd833b7516482287ef0c9ec259_2_0.png)\n\nThe structure and components\
