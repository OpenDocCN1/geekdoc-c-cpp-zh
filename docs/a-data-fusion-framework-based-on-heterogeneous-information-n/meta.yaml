    \ allows users to share their recipes, meaning users can prefer and use others\
    \ which are created according to individual needs. Moreover, users can use natural\
    \ language descriptions for recipes to express their intentions.\n\n# 3. Preliminaries\n\
    \nIn this section, we first introduce the key concepts for TAP. Then, we give\
