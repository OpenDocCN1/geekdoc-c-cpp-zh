    # A data fusion framework based on heterogeneous information network embedding
    for trigger-action programming in IoT


    Gang Wu, Liang Hu, Xuel Mao, Yongheng Xing, Feng Wang *


    College of Computer Science and Engineering Research Center of Network Technology
    and Application Software, Ministry of Education, Jilin University, Changchun 130012,
