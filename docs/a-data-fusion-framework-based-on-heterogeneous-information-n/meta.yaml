    # 一基于异构信息网络嵌入的物联网触发-动作编程数据融合框架


    Gang Wu, Liang Hu, Xuel Mao, Yongheng Xing, Feng Wang *


    吉林大学计算机与工程学院，网络技术与应用软件研究中心，教育部，长春 130012, 德国


    # 文章信息


    # 摘要


    物联网（IoT）中的触发-动作编程（TAP）允许用户通过创建“触发-动作”配方（称为异常处理）来轻松地定制连接实体（如智能设备）的行为。例如：“日落时打开灯光”。潜在的触发动作可能会呈指数级增长，这使得人们对基于用户自然语言而非依赖手动创建的自动化产生了极大兴趣。在本文中，我们提出了
    TAP 作为一种物联网数据融合框架，用于编码自然语言和配方，利用异构信息网络（HIN）嵌入映射人类需求和配方。最后，我们将 TAP 分为机器级和人类级，并采用
    NLP 技术学习节点的向量表示，这对于推荐非常有益。为了增强 TAP 的自适应能力，我们提出了一种特定的指标引导的随机游走方法，将人类生成的自然语言与机器生成的配方之间的语义级映射捕捉为一个多分类问题，其中每个节点代表一种自然语言，标签对应配方中包含的实体。我们使用
    IFFT 进行了多分类实验，并证明了我们框架的有效性。


    - 关键词：

    - 物联网

    - 触发-动作编程

    - 异构信息网络嵌入

    - 物物智能


    # 1. 引言


    连接技术（如物联网和 IPv6）的出现促进了物联网的发展。它导致人们考虑到日益增的连接设备。预计到 2025 年，物联网设备的数量将达到 760 亿.¹¹
    如今，连接实体、智能设备或在线服务无处不在，并在日常生活中与其他以及与我们进行交互。


    触发-动作编程（TAP）（Mi, Qian, Zhang, & Wang）作为一种日益流行的物联网（IoT）范式，允许用户以“如果某些，则执行动作”的形式创建
    TAP 规则（配方），为异构物联网生态系统（如智能设备或在线服务）提供方便的服务。


    图 1 说明了不同实体提供的连接潜力，这有助于了在当前场景中提供多样化的服务。


