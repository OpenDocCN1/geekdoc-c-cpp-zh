    Sadler, & Sun, 2019; Yusuf, Jamal, Jiang, & Lo, 2022; Yusuf, Jiang, & Lo, 202b).
    These methods utilize the user''s natural description of functions within entities
    respectively. The training of these methods focuses on leveraging the natural
    language descriptions provided by users, and the model''s ability to capture the
    semantic entities in entities and helps to overcome language limitations.


    To address the aforementioned, we propose TAPFuser, an IoT data fusion framework
    that connects natural demands and goals. The goal is to establish a mapping between
    human demands and heterogeneous representations. Through TAPFuser, we divide IoT
    data into machine and human levels based on them. In an IoT ecosystem, demand
    is automatically at the machine level, representing combinations of functions
    as known as interactions. Simultaneously, these demands are remapped to fulfill
    human demands and their descriptions, respectively in natural language. For example,
    Gong, Wang, & 2019a is intended to integrate interactions and human demands. An
    edge is established in IoT if a connection exists between two functions. We utilize
    a natural language processing (NLP) tool to extract meaningful words and phrases,
    then as nodes, and edges between these nodes and nodes. These nodes are converted
    into vector representations containing structural information and can be learned
    in downstream tasks.


    To improve the adaptability of TAPFuser, we propose a method using a hyperparameter
    to control the mapping of walking at different levels. After H embedding, the
    mapping problem is formed as a multi-level classification task to determine the
    category of entity from natural language description. In summary, the contributions
    of this article are:


    +   1. We propose an IoT data fusion framework, namely TAPFuser, to encode natural
    language and relations, which aims to establish a mapping between human and machine
    representations.


    +   2. We divide data into the machine and human levels based on them, which serves
    as the base for mapping. We model information from machine and human levels as
    an IoT-HOT and convert it into low-dimensional vector representations using H
    embedding technique. To improve the adaptability of TAPFuser, we customize a specific
    metric-graph-guided random walk method to control the level-aware heterogeneity
    of the IoT-HOT.


    +   3. We perform multi-label classification experiments on the IFTTT dataset
    to test our proposed framework. The results show that our proposed framework can
    handle human demands and other performed methods.


    The rest of this article is organized as follows: Section 2 reviews the preliminaries.
    In Section 3 we describe the technical details of the designed framework in Section
    4, Section 5 represents our experiments. Section 6 concludes


    # 2. Related work


    In this section, we first graph-based data representation and H embedding in IoT.
    Then, we review the previous approaches of


    # 2.1. Graph-based data representation and embedding in IoT


    The utilization of graph representation and processing offers increased flexibility
    and convenience. In IoT, Hu et al. (2019a) designs a heterogeneous graph-HOT to
    describe the flow of information among IoT devices. They employ an attention mechanism
    to learn embedding based on semantic similarity. This method is also applied to
    other IoT scenarios, such as the clustering of Point of Interest (HOT). Hu, Xing,
    Gao, & 2019b uses a convolutional model to sense sense (Wang, Sun, Hu, & Zhao,
    2018).


    Furthermore, for solving the problem of existing graph analysis methods, which
    use graph structure and space when faced with data embedding technique has been
    proposed by


    Applying the embedding to IoT, the (Hu, Zhang & Zhang, 2020) builds a vehicle
    ad hoc network by modeling trajectory records into co-occurrence matrices. The
    graph embedding technique is used to learn the vector representation of drivers
    in the network, and they can recommend potential friends for drivers based on
    the similarity of vectors.


    Considering its ability to preserve and process data, we use graph structure to
    integrate and model IoT data. By H embedding methods, we can obtain latent representations
    of entity.'
