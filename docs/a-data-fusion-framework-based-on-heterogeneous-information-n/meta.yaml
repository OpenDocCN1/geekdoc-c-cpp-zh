    The goal of establishing a mapping between demands and recipes is to facilitate
    the generation of recipes based on user needs. To achieve this goal, the mapping
    process between demands and recipes is formulated as a multi-label classification
    problem. As described in Sections 3.1 and 4.1, demands are expressed through natural
    language descriptions, including triggers, actions, components, and categories.
    By the embedding process, triggers, actions, and categories are utilized. Each
    recipe category is chosen as the label in the mapping process. We use the demand
    labels for the trigger channel and categories.


    IFFFT dataset evaluate the classification performance and with other methods to
    illustrate the performance of TAFner on TapFusion to analyze the insights gained
    from the experimental results. All experiments are performed in Python 3.10 with
    3.7 GHz Intel(Core) i9-10900K CPU and 64 GB RAM.

