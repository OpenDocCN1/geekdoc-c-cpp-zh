    ## 4.2.1. Model contexts from the human level


    For interaction contexts, the interaction context network (ICD) is constructed,
    as shown in Fig. 6. Trigger and action are extracted and noted as nodes of different
    types, the demand level and human levels, are shown in the network. The channels
    provide these contexts (If, then) and affinity relationships (Belong), are also
    taken as nodes. Finally, through these contexts affinity are linked. The ICD is
    defined as $G^C = (V^C, E^C)$.


    ## 4.2.2. Metapath-guided random walk


    To generate meaningful nodes in IoT-HDIN, designing an effective random walk completes
    the sampling process. One approach uses metapath-constrained random walks, which
    are coupled with a suitable relationship (e.g., random walk by Zhang et al., 2017).
    For more complex structures and higher similarity in IoT-HDIN, the metapath-guided
    random walk is proposed to extract structured information.


    The demand description, in natural language text exhibits characteristics of randomness
    and dynamics. To effectively extract users'' demand from this text, this article
    employs Natural Language Processing (NLP) techniques. These techniques aim to
    identify traditional random walk methods fail in IoT-HDIN, where node types may
    be different. Consequently, the metapath-guided random walk method fails in capturing
    the complete structure of information-HDIN.


    To solve this problem, we propose SWR, a metapath-guided random walk to capture
    the level-aware heterogeneity of the IoT-HIN. For an IoT-HIN $G = (V, E, \mathcal{T})$
    and a metapath $M$, the transition probability $p(v''|v, M)$ at step $i$ is defined
    as:


    $$p(v''|v) = \begin{cases} \frac{\lambda}{[E(v)]} & (v, v'') \in E, \phi(v) =
    \phi(v'') \\ \frac{1-\lambda}{[E(v)]} & (v, v'') \in E, \phi(v) \neq \phi(v'')
    \\ 0 & \text{otherwise} \end{cases}$$


    where $\phi$ is node type mapping function, $E(v)$ is the neighborhood of $v$,
    and $\lambda$ is hyperparameter that adjusts the probability of walking between
    levels of ICD and HDDN.


    Compared to the previous method [Zhang et al., 2018], which regards the probability
    of walking between different levels in IoT, SWR uses a specific random walk strategy
    to select the importance of different nodes. The larger $\lambda$ presents higher
    priority on the higher-level nodes.


    ## 4.3.2. Learn vector representations


    The sequence generated by SWR can preserve the semantic and structural relationships
    between different types of nodes. For learning vector representations, we use
    word-concept [Mikolov, et al., 2013] in a text corpus and map node to word, respectively.
    Then, skip-gram is applied to extract sequences that maximize the objective function
    of content $G$, given a node $v$. The objective function is:


    $$\arg\max_{\theta} \sum_{i} \sum_{j} \log p(w_j|\theta)$$


    where $(v)$ denotes node of interest with type $\psi(v): v \in V \rightarrow \mathbb{R}^d$
    is a mapping function for embedding. To solve the problem of quite expensive cost
    of calculating the objective function, we use negative sampling technique for
    efficient optimization in Mikolov, et al. Given a negative size $k$, Eq. (2) is
    updated as follows:


    $$\log \sigma(\psi) = \sum_{i} E_{p_{neg}}(\log \sigma(\psi^T \cdot \psi)) \quad
    (4)$$


    where $\sigma(x)=1/(1+\exp(-x))$ and $p_{neg}(x)$ is a pre-defined distribution
    that generates negative samples. We use stochastic gradient descent (SGD) algorithm
    to optimize the objective, Eq. (3):


    $$\psi = \log p(\psi) \quad (4)$$


