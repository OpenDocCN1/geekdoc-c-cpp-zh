    # 5.4. Parameter sensitivity


    In this subsection, we analyze our proposal by studying the impact of hyperparameters
    $\lambda$, length, and walk length. The results evaluate the flexibility of the
    TAFPER.


    # 5.4.1. Impact of length",


    The hyperparameter $\lambda$ is used to adjust the walk width of TAFPER between
    length and machine classes. The classification is evaluated on 20 labeled nodes,
    and the results are shown in Fig.(9).


    By setting the probability $\lambda=0$ and $\lambda=1$, we indicate that TAFPER
    only performs well on nodes, especially on HD, and ICN. We can also see that TAFPER
    performs better when $\lambda$ approaches 0.8. However, a single level of data
    leads to loss of semantic information in nodes.


    We also provide detail analysis regarding the impact of ICN in degree distribution.
    As shown in Fig.(10a), the degree distribution of ICN is more uniform, which is
