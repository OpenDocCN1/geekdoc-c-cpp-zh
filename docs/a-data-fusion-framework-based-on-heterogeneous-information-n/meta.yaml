    # ARTICLE INFO


    # ABSTRACT


    Trigger-action programming (TAP) in the Internet of Things (IoT) enables users
    to easily customize the behavior of connected entities, such as smart devices,
    by creating trigger-action recipes, which are known as exceptions. As an example,
    Sunset the light turns on. Potentially triggering actions can grow exponentially,
    which raises great interest in automating based on users'' natural language instead
    of relying on manual creation. In this paper, we present TAP as an IoT data fusion
    framework to encode natural language and recipes, mapping human demand and recipes
    using a heterogeneous information network (HIN) embedding. Finally, we divide
    TAP into machine and human levels based and employ NLP techniques to learn vector
    representations of nodes, which is beneficial for recommendation. To enhance the
    adaptive capabilities of TAP, we propose a specific metric-guided random walk
    method that captures the semantic-level mapping between natural language generated
    by the human and recipes generated by the machine as a multi-class classification
    problem, where each node represents a natural language, and the label corresponds
    to the entity included in the recipe. We conducted multi-class classification
    experiments using the IFFT, and demonstrate the effectiveness of our framework.


    - Keywords:

    - Internet of Things

    - Trigger-action programming

    - Heterogeneous information network embedding

    - Artificial Intelligence of Things


    # 1. Introduction


    The advent of connected technologies, such as IoT and IPv6, promotes the development
    of IoT. It has also led to consider the growing number of connected devices. It
    is predicted that the number of IoT devices will reach 76 billion by 2025.¹¹ Nowadays,
    connected entities, smart devices or online services are ubiquitous and are able
    to interact with, with others, and with us in daily lives.


    Trigger-action programming (TAP) (Mi, Qian, Zhang, & Wang), as an increasingly
    popular Internet of Things (IoT) paradigm, enables users to create TAP rules (recipes)
    in the form of "if something, then action" providing convenient services for heterogeneous
    IoT ecosystems, such as smart devices or online services.


    Fig. 1 illustrates the potentials of connections provided by different entities,
    which facilitate the provision of diverse services in current scenarios.


    (b) of Fig. 1, functions (i) and (ii) combine to create an interaction for cooling
    the room when the temperature is high; while functions (iii) and (iv) to dehumid
    the space in the presence of high humidity are free to use, and select specific
    combinations of functions to meet their individual demands.


    However, as the number of entities and their functions increases, the potential
    of triggering actions and recipes grows exponentially. For an instance in smart
    home (Mi et al., 2017), when the use of smart device dehumidifier expands to the
    current scenario, the current scenario includes 14 recipes and 10 actions, resulting
    in a minimum of 140 possible recipes (Yu, Hua, & Julien, 2021). With the IoT ecosystem
    expanding, it is becoming time-consuming and challenging for users to create and
    manage recipes.


    In response to this problem, researchers have shown interest in the automatic
    generation of recipes based on users natural language, rather than relying on
    manual creation (Corno et al., 2021; Yao, Li, Gao, et al.


