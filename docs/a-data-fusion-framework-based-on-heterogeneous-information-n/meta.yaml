    of the IoT-HIN. For an IoT-HIN $G = (V, E, \mathcal{T})$ and a metapath $M$, the
    transition probability $p(v''|v, M)$ at step $i$ is defined as:


    ```

    $p(v''|v) = \begin{cases} \frac{\lambda}{[E(v)]} & (v, v'') \in E, \phi(v) = \phi(v'')
    \ \frac{1-\lambda}{[E(v)]} & (v, v'') \in E, \phi(v) \neq \phi(v'') \ 0 & \text{otherwise}
    \end{cases}$

    ```


    where $\phi$ is the node type mapping function, $E(v)$ is the neighborhood of
    $v$, and $\lambda$ is a hyperparameter that adjusts the probability of walking
    between levels of ICN and HDDN.


    ![](img/dbd639bd833b7516482287ef0c9ec259_5_2.png)


    Compared to the previous method [Zhang et al., 2018], which regards the probability
    of walking between different levels in IoT, SMR uses a specific random walk strategy
    to select the importance of different nodes. The larger $\lambda$ presents higher
    priority on the higher-level nodes.


    # 4.3.2 Learn vector representations


    The sequence sets generated by SMR can preserve the semantic and structural relationships
    between different types of nodes. For learning vector representations, we use
    the word-concept concept [Mikolov, Corrado, and Deans, 2013] in a text corpus
    and map node and sentence to word, respectively. Then, skip-gram is applied to
    extract sequences that maximize the objective function of the content $G$, given
    a node $v$. The objective function is


    ```

    $$\arg\max_{\theta} \sum_{i} \sum_{j} \log p(w_j|\theta)$

    ```


    where $(v)$ denotes the node of interest with type $\psi(v)$ and $\psi: v \in
    V \rightarrow \mathbb{R}^{d_{\psi(v)}}$ is a mapping function for embedding.


    To solve the problem of the quite expensive cost of calculating the objective
    function, we use a negative sampling technique for efficient optimization in Mikolov,
    Sutskeaver, Corrado, and Deans


