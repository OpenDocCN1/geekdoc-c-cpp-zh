    # 5.4.2. Impact of walk length


    Finally, we investigate the impact of walk length on the machine classes during
    running time. The results are shown in Fig.(9b). We observe that the performance
    of TAFPER rises as the walk length increases. The performance of the TAFPER decreases
    when the walk length is short.


