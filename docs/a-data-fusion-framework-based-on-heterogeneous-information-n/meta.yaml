    Inspired by metaverse (Wang et al., 2017), we may embed the information in IoT-HDIN,
    which can encode nodes into low-dimensional vector representations. An IoT-HDIN
    has $f : V \rightarrow \mathbb{R}^d$, where $\mathbb{R}^d$ represents the dimension
    of nodes.


    In IoT-HDIN, relationships between nodes exist respectively, requiring a method
    to represent these elements effectively. Using PathSim (Sun, Han, Yan, Yu, Wu,
    2021), the metapath is used to represent the relationships between different types
    of nodes. For example, $If$ nodes can be represented via multiple paths. The metapath
