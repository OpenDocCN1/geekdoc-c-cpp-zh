    and IoT topics. First, we filter the recipes related to IoT applications, based
    on the recipes with categories more than 100 are removed. Then, we extract the
    triggers, actions, and recipes that belong to the matching categories. After filtering,
    there are 12 categories and 2172 recipes remain. The details of the categories
    are shown in Table 2. Voice assistants represent categories for recipes such as
    Amazon Alexa and Google Assistant. In addition, each recipe consists of a trigger
    and action that may belong to different categories.


