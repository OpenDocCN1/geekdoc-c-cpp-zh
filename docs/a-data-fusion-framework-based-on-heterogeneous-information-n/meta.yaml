    # 5.2 Multi-class classification


    In this section, multi-class classifications are carried out in the experiments
    to compare the performance of different algorithms. The learned embeddings are
    evaluated by one-rest classifiers using the LINEARPACK package (Chan, Chang, Hu,
    Wang, & Lin, 2008). In the used training and testing sets, we found the accuracy
    ranges from 10% to 90%. The experiments are conducted on different datasets.


    From Table 5, there are some significant findings as follows


    +   - TAPFuser(M) is better than other method in the ICN network in terms of Micro-F1
    and Macro-F1 score

    - For HDN hidden, by description from the label, TAPFuser(P) is used to labeled
    nodes over other methods in terms of Micro-F1 and Macro-F1 score, as TF-IDF, node2vec,
    and metaph2vec.

    - TAPFuser(M) works very well in IoT-IN, achieving an increase of 2% and 13% in
    improvement in Macro-F1 score over other methods. In the comparison with FastGTNs,
    when the training is 10%-90%, TAPFuser(M) outperforms all other classifiers in
    ICN and HDN with gains of 8% Macro-F1 score over the average-of-the-methods.


    # 5.3. complexity analysis


    Our framework has two tasks: (1) generating random sequences and (2) For the random
    walk in an IoT graph $G=(V,E)$ with walk length $L$, the complexity is $O(|V|L)$,
    where $|V|$ is the number of nodes in the graph and $|E|$ is the number of edges
    in the graph. For the training phase, the complexity of training the embeddings
    of nodes is $O(KL)$, where $K$ is the number of negative samples. The total complexity
    is $O(|V|L + KL)$. Since $d, e, c, h$ and $j$ are constants maybe smaller than
    $|V|$, the main complexity is $O(|V|L)$, which is linear to the number of nodes.


    By contrast, the complexity of TF-IDF is $O(nm)$, where $n$ is the number of documents
