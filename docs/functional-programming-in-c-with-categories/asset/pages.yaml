- pgno: 6
  md: '# Purpose


    > The tools we use have a profound (and devious!) influence on our thinking habits,
    and, therefore, on our thinking abilities.

    > — Edsger Dijkstra


    > OO makes code understandable by encapsulating moving parts.

    > FP makes code understandable by minimizing moving parts.

    > —Michael Feathers (Twitter)


    One of the main reasons for this book is to transfer in the community of object-oriented
    developers some of the ideas and advancements happening to the functional side.
    This book wants to be pragmatic. Unfortunately, some great ideas are coming from
    academia that cannot be used by the average developer in his day to day coding.


    **This is not an Introductory book to functional programming,** even if I restate
    some of the most basic concepts in the light of category theory and the object-oriented
    paradigm. This book covers the middle ground. Nonetheless, it is written in a
    way that if someone pays attention and goes through the examples, he or she could
    understand the concepts. An introductory book will follow in Leanpub, covering
    more basic ideas, along with the extended version of this book covering more advanced
    topics.


    **In this book, I will try to simplify the mathematical concepts in a way that
    can be displayed with code.** If something cannot be easily displayed with code
    probably will not be something that can be readily available to a developer’s
    arsenal of techniques and patterns.


    **If you think a section is boring, then skip it and maybe finish it later.**


    One thing I admire in Software Engineers is their ability to infer things. The
    ability to connect the dots is what separates the exceptional developer from the
    good one. In some parts of the book, I might indeed have gaps or even assume things
    that you are not familiar with. Nonetheless, I am sure that even an inexperienced
    developer will connect the dots and assign meaning, as I usually do when left
    with unfinished'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# About this book coding conventions


    Let’s be pragmatic here, this style of coding that promotes purity should **not
    be an end in itself**, and we should always be able to convince ourselves to go
    back into an object-oriented style of coding even if it is not that pure. The
    important thing is to write **functional code that provides business value** to
    the organization and to the end-user that will eventually use it. We must be pragmatic
    and utilitarian when we code and abstractionists when we think about code.


    This book is aiming to present the basics of functional programming using the
    **language-ext** library. We will try to exhibit the usage of the basic Functional
    types: Option, Either, Task and Validation within an ASP.NET MVC web paradigm.


    There is a **WebApplicationExample** solution that has multiple simpler examples
    of language-ext in a .net core web application. The intention is to build up an
    understanding behind the architecture of the **Sample Contoso** web Application
    in the **language-ext GitHub project** which is examined in the last chapter of
    this book.


    # The language-ext C# library


    This book is all about the **specialization** of the concepts of functional programming
    with the language-ext C# library. There are some functional libraries out there
    for C#, but currently the only complete library that could be used in a commercial
    project is the language-ext. In this section we are going to see a couple of the
    basic crosscutting ideas in the library and then in the following Chapters we
    will introduce all the different structures.


    In this book we are going only to **use the Nu-get package LanguageExt.Core.**'
  merge: -1
  img_proc: true
