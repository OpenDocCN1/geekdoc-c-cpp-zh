    \ the Console. This is considered **Side effect** because there is no predictability\
    \ on the Input. It is not *Referential Transparent*.\n\n```\nvar readKeyInstruction\
    \ = new IO<ConsoleKeyInfo>(() => Console.ReadKey());\n```\n\n```\nvar UserInputAsInt\
    \ = readKeyInstruction\n    .Map(x => int.Parse(x.KeyChar.ToString()))\n    .Run();\n\
    ```\n\nRun This: .Net Fiddle\n\nIt’s the same as the Id functor but encloses the\
    \ value that we provide in a thunk - () => { } just to make it lazy. We would\
    \ have to collapse the function Fn() in order to get back the value, most IO implementations\
    \ around usually provide a Run() function that does just that. Also, with an extension\
    \ method, we can create IOs out of everything on the fly.\n\n```\npublic static\
    \ IO<T> ToIO<T>(this T @this) => new IO<T>(() => @this);\n```\n\n# 4.8 Reader\
    \ Functor\n\nThe Reader Functor represents a computation, which can read values\
    \ from a shared environment. The reader functor conceptualizes the idea of having\
    \ stored expression that we can evaluate in different configurations at a later\
    \ time. We can represent this like that ((→) env), which means we give an environment,\
    \ and we get out the thing that we want.\n\n```\npublic class Reader<Env, T>\n\
    {\n    public Func<Env, T> Fn { get; set; }\n    public Reader(Func<Env, T> fn)\
    \ => Fn = fn;\n    public Reader<Env, T1> Map<T1>(Func<T, T1> f) =>\n        new\
    \ Reader<Env, T1>((env) => f(Fn(env)));\n    public T Run(Env env) => Fn(env);\n\
    }\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_129_0.png)\n\nFor a simple\
    \ example we might have a Config type that contains various parameters and we\
    \ want to create a Reader that stores a simple expression that depends on the"
