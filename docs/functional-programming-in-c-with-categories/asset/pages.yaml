- pgno: 247
  md: "This DTO only has all the data that we want to store to the DB.\n\nThe Mediator\
    \ the dispatches the message and pass it to the CreateCourseHandler which the\
    \ MediatR identifies because it implements the IRequestHandler<CreateCourse, _\
    \ > interface. As usual The MediatR invokes the Handle method of the Handler passing\
    \ inside the request DTO message CreateCourse\n\n```\npublic class CreateCourseHandler\
    \ : IRequestHandler<CreateCourse, Either<Error, int>>\n{\n    public Task<Either<Error,\
    \ int>> Handle(CreateCourse request, CancellationToken cancellationToken) =>\n\
    \        Validate(request)\n            .MapT(PersistCourse)\n            .Bind(v\
    \ => v.ToEitherAsync());\n    ...\n}\n```\n\nThe MediatR calls the Handle method\n\
    \n+   1. Now at tha point the main transaction is finally executed\n\n```\nValidate(request)\n\
    \    .MapT(PersistCourse)\n    .Bind(v => v.ToEitherAsync());\n```\n\nThis is\
    \ a composition of three functions first we validate the request. There was no\
    \ need to do this for the Query workflow, so this is a new step.\n\n```\nprivate\
    \ async Task<Validation<Error, Course>> Validate(CreateCourse create) =>\n   \
    \ (await DepartmentMustExist(create), ValidateTitle(create))\n        .Apply((id,\
    \ title) => new Course { Title = title, DepartmentId = id, Credits = create.Credits\
    \ });\n```\n\nThis uses the validation monad to do some validations and then use\
    \ the apply .Apply to collect the results and recreate the object new Course {\
    \ }. If one or more of the validations failed the result of the Apply is a Validation\
    \ that contains all the errors. In this second case the computation stops there\
    \ and the subsequent step of PersistCourse does not happen."
  merge: -1
