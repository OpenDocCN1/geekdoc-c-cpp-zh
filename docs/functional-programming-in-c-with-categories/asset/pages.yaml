- pgno: 90
  md: "# 3.4.2 Rewriting Union Type methods with MatchWith\n\nThink of MatchWith like\
    \ a universal definition that allows us to write Polymorphic method that must\
    \ be added in all the branches of a union type in a single place.\n\nWe can now\
    \ write any method definition in our ListBase<T> Union Type using just MatchWith.\
    \ Here I rewrite the Multiply using an extension method:\n\n```\npublic static\
    \ T Multiply<T>(this ListBase<T> @this) =>\n    @this.MatchWith(pattern: (\n \
    \       Empty: () => 1,\n        Cons: (value, rest) =>  value* rest.Multiply()\n\
    \    ));\n```\n\nIf you do not want to use extension methods, you can add the\
    \ method at the Base class:\n\n```\npublic abstract class ListBase<T>\n{\n   \
    \ public T Multiply() =>\n        this.MatchWith(pattern: (\n            Empty:\
    \ () => 1,\n            Cons: (value, rest) => value* rest.Multiply()\n      \
    \  ));\n\n    public abstract T1 MatchWith<T1>(\n        (Func<T1> Empty, Func<T,\
    \ ListBase<T>, T1> Cons) pattern);\n}\n```\n\nWe are going to use this way of\
    \ extending Union Types extensively in this book."
