- pgno: 248
  md: "+   2. The next step is the .MapT(PersistCourse) bypass the Task and applies\
    \ the function PersistCourse on the content of the Validation (which is a Course\
    \ object) from the previous step using the Validation.Map method.\n+   At this\
    \ point the Type that we have at our hands after the PersistCourse is Validation<Error,\
    \ Task<int>>\n\n![](img/d73681d801b4b826e0b2a293897bbba4_248_0.png)\n\n[You can\
    \ see the types at any given state by placing the cursor over the variable\n\n\
    ```\n2 references\npublic Task<Either<Error, int>> Handle(CreateCourse request,\
    \ CancellationToken cancellationToken) =>\n  Validate(request)\n    .MapT(Persi\
    \ Validation<Error, Task<int>> v\n    .Bind(v => v.ToEitherAsync());\n```\n\n\
    ]\n\n+   3. we want to convert this Validation<Error,Task<int>> into a Task<Either<Error,int>>\
    \ that follows the usual pattern of responses so here is implemented an extension\
    \ method for this purpose just to transfer the Task outside of the Validation\
    \ and also convert the Validation to an Either using validation.ToEither()\n\n\
    ```\npublic static Task<Either<Error, R>> ToEitherAsync<R>\n    (this Validation<Error,\
    \ Task<R>> validation) =>\n        validation.ToEither()\n        .MapLeft(errors\
    \ => errors.Join())\n        .MapAsync<Error, Task<R>, R>(e =>\n    e);\n```\n\
    \nAnd is applied through the .Bind(v => v.ToEitherAsync());\n\nAll the difficulty\
    \ of this functional approach is concentrated on how to properly convert the types\
    \ using the Map, and Bind and the various Transformation methods.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_248_1.png)"
