  md: "# 8.7.3 Command Workflow\n\nIn this section we are going to see some of the\
    \ Command paths. We will first examine the CreateCourse case, and then we will\
    \ see some of the other cases to cover all the functional patterns in the Contoso\
    \ Sample. Ok, again we assume that we had a http POST request this time from the\
    \ client. This means that inside the CoursesController the Create(CreateCourse\
    \ createCourse) action is called, and as an argument we have the deserialized\
    \ CreateCourse object that was used in the http ajax request at the client side:\n\
    \n```\n[HttpPost]\npublic Task<IActionResult> Create(CreateCourse createCourse)\
    \ =>\n    _mediator.Send(createCourse).ToActionResult();\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_246_0.png)\n\
    \nThe message CreateCourse is immediately sent to the mediator. The DTO message\
    \ that is used here is :\n\n```\npublic class CreateCourse : Record<CreateCourse>,\
    \ IRequest<Either<Error, int>>\n{\n    public string Title { get; }\n    public\
    \ int Credits { get; }\n    public int DepartmentId { get; }\n}\n```"
