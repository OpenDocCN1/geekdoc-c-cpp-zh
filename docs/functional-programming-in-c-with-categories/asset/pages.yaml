  md: "# Traversables\n\nOptional Chapter\n\n# 6 Catamorphisms Again\n\nThis Chapter\
    \ is about Folding, Decomposing, various structures it’s all about getting values\
    \ out of data structures in an elegant and consistent manner. The path that we\
    \ will follow will involve many concepts from category theory ,like the concept\
    \ of catamorphism (from the Greek: κατά \"downwards\" and μορφή \"form, shape\"\
    ) its dual anamorphism (from the Greek: ανά \"upwards\" and shape), and their\
    \ combination hylomorphism (from the Greek: ὕλη hyle \"matter\" and shape) and\
    \ probably is the most difficult part of this book. Feel free to skip any part\
    \ you don’t like or find interesting and maybe revisit in a later time.\n\n# 6.1\
    \ A brief mentioning of F-algebras\n\nIf F is a Functor, then an F-algebra is\
    \ a pair (A, α), where A is called carrier type and α is a function F(A) → A called\
    \ structure map. The F-Algebra is a way to get an A out of a F(A). It is an evaluation.\n\
    \nFor our Peano Numerals functor one algebra with carrier type the integers would\
    \ be this\n\n```\npublic abstract class Numeral { }\n```\n\n```\npublic class\
    \ Succ : Numeral\n{\n    public Numeral Rest { get; set; }\n    public Succ(Numeral\
    \ rest)\n    {\n        this.Rest = rest;\n    }\n}\n```\n\n```\npublic class\
    \ Zero : Numeral { }\n```\n\n```\n(Func<int> Zero, Func<int, int> Succ) algebraInt\
    \ = (\n    Zero: () => 0,\n    Succ: (n) => n + 1\n);\n```\n\nThat’s called the\
    \ structure map but when we say algebra, we will mean this function"
