- pgno: 142
  md: "```\npublic abstract class Either<TL, TR>\n{\n    public abstract Either<TL,\
    \ T1> Map<T1>(Func<TR, T1> f);\n}\n```\n\n```\npublic class Left<TL, TR> : Either<TL,\
    \ TR>\n{\n    public TL Value { get; }\n    public Left(TL value) => Value = value;\n\
    \    public override Either<TL, T1> Map<T1>(Func<TR, T1> f) =>\n        new Left<TL,\
    \ T1>(Value);\n}\n\npublic class Right<TL, TR> : Either<TL, TR>\n{\n    public\
    \ TR Value { get; }\n    public Right(TR value) => Value = value;\n    public\
    \ override Either<TL, T1> Map<T1>(Func<TR, T1> f) =>\n        new Right<TL, T1>(f(Value));\n\
    }\n```\n\nRun This: .Net Fiddle\n\nThe thing we must pay attention to here is\
    \ that the Left is a functor that **dismisses the mapped function f** and returns\
    \ itself - Map:(f)=>Left(Value). In essence, it preserves the value that it holds.\
    \ After we reach a Left **all the subsequent transformation through the map(f)\
    \ are ignored.**\n\n# 4.11.1 Pattern matching for Either <T>\n\nThe MatchWith\
    \ implementation for Either is similar to Maybe’s.\n\n```\npublic abstract class\
    \ Either<TL, TR>\n{\n    public abstract T1 MatchWith<T1>((Func<TR, T1> right,\
    \ Func<TL, T1> left) pattern);\n}\n```\n\n```\npublic class Left<TL, TR> : Either<TL,\
    \ TR>\n{\n    public TL Value { get; }\n    public Left(TL value) => Value = value;\n\
    \    public override T1 MatchWith<T1>((Func<TR, T1> right, Func<TL, T1> left)\
    \ pattern) => pattern.left(Value);\n}\n```"
