  md: "```\nvar initial = new List<int> { 1, 2, 10, 6, 20, 11, 2, 3, 4 }.ToTree();\n\
    Console.WriteLine(initial.Show()); // (((1,2),(10,6)),((20,11),(2,(3,4))))\nvar\
    \ sorted = initial.Sort();\nConsole.WriteLine(sorted.ToTree().Show()); // (((20,11),(10,6)),((4,3),(2,(2,1))))\n\
    ```\n\n# 6.6 Fold’s relation to Cata\n\nFolds are also ways to collapse a structure.\
    \ Catamorphisms are more general in the sense that we have more freedom on how\
    \ we access the values. We will see Folds in more detail in a letter chapter.\
    \ The point of this section is to highlight the similarity between cata and fold\
    \ and highlight the fact that some libraries provide fold functions that we can\
    \ use in order to extract values out of certain data structures.\n\n```\nnew List<int>()\
    \ { 2, 3, 4 }.Aggregate(0, (accumulate, element) => accumulate + element);\n```\n\
    \nthe signature of the extension method is pretty standard as you can see from\
    \ the source code of the Enumerable :\n\n```\nstatic TAccumulate Aggregate<TSource,\
    \ TAccumulate>(this IEnumerable<TSource> source,\nTAccumulate seed,\nFunc<TAccumulate,\
    \ TSource, TAccumulate> func)\n```\n\nThe TAccumulate seed and the Func<TAccumulate,\
    \ TSource, TAccumulate> func are enough to Define a Monoid the Empty is the seed\
    \ and the Concat is the Func<...>\n\nBy analogy for the Id Functor we can define\
    \ a Fold with the same signature\n\n```\npublic class Id<T>\n{\n\tpublic T Value\
    \ { get; set; }\n\tpublic Id(T value) => Value = value;\n\tpublic Id<T1> Map<T1>(Func<T,\
    \ T1> f) => new Id<T1>(f(Value));\n\tpublic TM Fold<TM>(TM state, Func<T, TM,\
    \ TM> reducer) => reducer(Value, state);\n}\n```\n\nAnd use it like this:"
