    We note the introduction with an arrow ⇒ I₁


    [Another notation for the Introduction using the entailment sign ⊢ is


    Γ, x : A ⊢ M : B

    ------------------- ⇒ E

    Γ ⊢ λx.M : A → B


    This meant to express the same thing as the previous notation. That in a Typing
