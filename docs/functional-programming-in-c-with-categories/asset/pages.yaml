    +   2. Change the function call f(..., n) into: f(...)(n)


    1. Curry the argument.


    ```

    Func<T1, T> F<T, T1>(Func<T, Func<T1, T>> f) => (T1 n) => f(F(f)(n))(n);

    ```


    2.Change function call


    # Termination


    Of course, those recursive functions do not terminate if you decide to call them,
    you will get the usual stack overflow exception. To stop the recursion, we should
    have some sort of decreasing counter, that will signify that we reached a terminating
    state.


    We can use many things as a counter. Any recursive data structure that we can
    unpeel in each recursive call will do. For example, we could use as a counter
    an array [ ] or a tree. Here we will use the integers to connect it with the next
    section.


    For simplicity let us say that the T1 type is int


    ```

    T F<T>(Func<T, int, T> f, int n) => f(F(f, n), n);

    ```


    we can stop the recursion by checking if n is 0 (or any other constant)


    ```

    T F<T>(Func<T, int, T> f, int n) => n == 0 ? default(T) : f(F(f, n), n);

    ```'
