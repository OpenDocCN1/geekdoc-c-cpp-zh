  md: '# 3.2 One optional


    If we defined + and • maybe, we could define a 1 item that will be consistent
    with our usual algebra rules of a•1 = a for C# Arrays if we assume • is the Concat
    operation then 1 should be [] in order to hold a.Concat([]) = a . The term 1 is
    called the terminal object of a category.


    **Terminal object**: The terminal object is the object with one and only one morphism
    coming to it from any object in the category.


    ![](img/d73681d801b4b826e0b2a293897bbba4_77_0.png)


    In the category of Lists the terminal object can be the empty list [ ] because
    we can get a function to the empty list from any other list if we drop all the
    elements. However, we cannot have a single function to any other list without
    any ad hoc specific instructions. It is not a very interesting idea, but its a
    display of the consistency of algebra across different domains. For example for
    the algebraic definition of a list, we have that


    x = 1 + a • x


    we can replace the x at the left part with the definition and get:


    x = 1 + a• ( 1 + a • x ) =1+a+a • a • x


    and if we keep doing this, we get:


    x= 1 + a + a•a + a•a•a•x...


    Which says that a list can be either empty 1 = [] or just an element [a] or two
    elements [a, a] or three elements [a ,a, a], and so on, which is very consistent
    with the definition of the list. Also, we could try to solve it like this:


    x•(1- a) = 1 => x=1/(1- a)


    However, since we do not have a definition of a division, we can use Taylor expansion
    on 1/(1-x), which is expanding to the geometric series 1 + a + a²+ a³+a⁴+...


    The consistency of the algebra is remarkable.'
