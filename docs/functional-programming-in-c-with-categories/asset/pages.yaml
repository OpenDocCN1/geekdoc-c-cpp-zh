    \ { } => \"No Employee Found\",\n            _ => throw new NotImplementedException()\n\
    \        };\n```\n\nGithub: source\n\n# 5.4.2 Using the LINQ syntax with Option\
    \ Monad\n\nFor the final variation of the maybe example will use the LINQ syntax.\
    \ By defining a SelectMany method with the following signature\n\n```\nMaybe<T2>\
    \ SelectMany<T1, T2>(Func<T, Maybe<T1>> f, Func<T, T1, T2> selector)\n```\n\n\
    this is the classic Bind but has an intermediate step and a selector. Here is\
    \ the implementation in case you are interested.\n\n```\npublic abstract class\
    \ Maybe<T>\n{\n    ...\n    #region Linq support Aliases\n        public Maybe<T1>\
    \ Select<T1>(Func<T, T1> f) => Map(f);\n\n        public Maybe<T2> SelectMany<T1,\
    \ T2>(Func<T, Maybe<T1>> f, Func<T, T1, T2> selector) =>\n            MatchWith((\n\
    \                none: () => new None<T2>(),\n                some: (v) => f(v).Map(x\
    \ => selector(v, x))\n            ));\n    #endregion\n}\n```"
