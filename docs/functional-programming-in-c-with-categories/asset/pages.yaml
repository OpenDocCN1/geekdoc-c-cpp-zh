    \ identity x=>x to get the initial Monad back.\n\n```\nvar IdInId = new Id<int>(5).Map(x\
    \ => new Id<int>(x + 1));\nvar justId = IdInId.Bind(x => x);\n```\n\nThe difference\
    \ between bind and map in the identity monad is that map passes the lifted value\
    \ to a monad constructor Id(f(v)) while bind does not: f(v). In other monads the\
