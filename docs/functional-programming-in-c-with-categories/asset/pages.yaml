  md: "```\n{\n    //... do some stuff\n    callback(default(R)); // call the action\
    \ passing inside some result.\n    //... continue or return\n}\n```\n\nIt is the\
    \ closest thing to Firing a .NET Event, in a purely Object-Oriented setting.\n\
    \nCallbacks come up often in Asynchronous situations and Event driven architectures\
    \ and are the core components of concept like the Task<T>, Rx.NET Observables<T>,\
    \ and the Observer design pattern.\n\nEvery function can be converted into an\
    \ equivalent one that uses callbacks. This is called Continuation passing style\
    \ transformation. If we have a Function:\n\n```\nR F<T, R>(T y)\n{\n    return\
    \ default(R);\n}\n```\n\nWe can convert it to the equivalent :\n\n```\nvoid F<T,\
    \ R>( T y, Action<R> callback)\n{\n    callback(default(R));\n}\n```\n\n+   1.\
    \ The function now returns void (1).\n+   2. And has an additional argument Action<R>\
    \ (2) in which we can pass the result.\n\nUsing Func delegates syntax a Continuation\
    \ passing Transformation now takes a Func<T,R>:\n\n```\nFunc<T, R> F = (T y) =>\
    \ default(R);\n```\n\nInto an Action<T, Action<R>>:\n\n```\nAction<T, Action<R>>\
    \ G = (T y, Action<R> callback) => callback(default(R));\n```\n\nAnd instead of\
    \ the initial function call :\n\n```\nR result = F(default(T));\n```\n\nNow we\
    \ access the result using the following:\n\n```\nG(default(T), (R result) => {\
    \ });\n```\n\nAs a simple example we can convert a simple function that return\
    \ the length of a string\n\n```\nFunc<string, int> F = (string y) => y.Length;\n\
    ```"
