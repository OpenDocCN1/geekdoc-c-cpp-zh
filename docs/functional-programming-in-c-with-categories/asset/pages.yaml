  md: "```\n.Bind(employees.GetById)\n.Match(\n    Some: (employee) => employee.Name,\n\
    \    None: () => $\" No Employee Found\"\n);\n```\n\nOf course instead of Match\
    \ we could use the .Case switch\n\n```\npublic string GetAssignedEmployeeNameById(int\
