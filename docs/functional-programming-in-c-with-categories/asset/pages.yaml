  md: "This is almost identical with the previous definitions in order to highlight\
    \ the fact that this is an automated process for simple algebraic structures.\n\
    \nAgain, because it is a coproduct, we must define the cata method in both subtypes\
    \ Leaf and Node.\n\n+   1. We start with the Leaf, because this is the base case\
    \ of the structural induction. We can apply the Algebra directly to this leaf\
    \ since there is nothing else to do.\n\n```\nLeaf: v => algebra.Leaf(v),\n```\n\
    \n+   2. The Node is a product of two trees (left, v, right) and a value. The\
    \ only way to deal with it is to assume that those must have a Cata<T> function\
    \ that works as expected ( that is the inductive hypothesis again) if we pass\
    \ the algebra algebra on those nodes the result must be an integer in this way\
    \ we will have three integers -one from the left node : l.Cata<T>(algebra) [this\
    \ returns a T type] the node v , and t one from the right node: r.Cata<T>(algebra)\
    \ [this also returns a T type], and we can use the algebra to call the algebra.Node(___)\
    \ In order to evaluate all those three results that are of the same type T now\n\
    \n```\nNode: (l, v, r) => algebra.Node(r.Cata<T>(algebra), v, l.Cata<T>(algebra)\n\
    ```\n\n# C# 8.0 pattern matching\n\nAgain, we can reformulate the Cata using switch\n\
    \n```\npublic static T1 Cata<T, T1>(this Tree<T> @this,\n    (Func<T, T1> Leaf,\
    \ Func<T1, T1, T1> Node) algebra) =>\n    @this switch\n{\n    Leaf<T> { Value:\
    \ var v } => algebra.Leaf(v),\n    Node<T> { Left: var l, Right: var r } =>\n\
    \        algebra.Node(l.Cata(algebra), r.Cata(algebra)),\n};\n```"
