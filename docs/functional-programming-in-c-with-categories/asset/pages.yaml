    Github: source


    In this project the CreateCourse DTO extends to Types:


    +   1. is extending the Record<CreateCourse> class that belong to the language
    extension library (Record<A>) and just provides Equals, IEquatable.Equals, IComparer.CompareTo,
    GetHashCode, operator==, operator!=, operator >, operator >=, operator <, and
    operator <= implementations for the class. This is not needed in this project
    but it is demonstrated as a good practice using the library.

    +   2. Implements the IRequest<Either<Error, int>> interface that comes from the
    MediatR and allows the MediatR to find which object to use as a message. You can
    see the basic request/response pattern that MediatR uses here.


    A powerful improvement can be made to the approach by decoupling the execution
    from the command state via the mediator pattern. In this pattern all commands,
    each of which consist of simple serializable state, are dispatched to the mediator
    and the mediator determines which handlers will execute the command:


    ![](img/d73681d801b4b826e0b2a293897bbba4_240_0.png)


    Because the command is decoupled from execution it is possible to associate multiple
    handlers with a command and moving a handler to a different process space (for
    example splitting a Web API into multiple Web APIs) is simply a matter of changing
    the configuration of the mediator. And because the command is simple state we
    can easily serialize it into, for example, an event store (the example below illustrates
    a mediator that is able to serialize commands to stores directly, but this can
    also be accomplished through additional handlers:


    Since commands are imperatives, they are typically named with a verb in the imperative
    mood (for example, "create" or "update"), and they might include the aggregate
    type, such'
