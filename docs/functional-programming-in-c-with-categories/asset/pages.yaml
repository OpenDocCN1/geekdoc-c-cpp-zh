    \ I was planning to present this way of connecting Traversables with Foldables\
    \ here but because of C# typing I think it only would make things much more difficult\
    \ to follow.\n\nInstead, we will go straight to some implementations of Fold on\
    \ lists and Trees. Let’s start by defining Fold on a List (this is basically the\
    \ Enumerable.Aggregate. Unfortunately, the .NET framework designers faced with\
    \ a dilemma when naming the Aggregate function on the one hand they had to follow\
    \ the whole LINQ idea and comply to the SQL naming, and on the other side was\
    \ the default functional naming of Fold. They chose the SQL naming convention)\n\
    \n```\npublic static T Fold<T>(this List<T> @this, (Func<T> empty, Func<T, T,\
    \ T> concat) monoid)\n    =>\n    @this.MatchWith(algebra: (\n        Empty: monoid.empty,\n\
    \        Cons: (v, r) => monoid.concat(v, r.Fold(monoid))\n    ));\n```\n\nRun\
    \ This: .Net Fiddle\n\nHere we have a List and a monoid (Func<T> empty, Func<T,\
    \ T, T> concat) in its simple Tuple form and we end up with a single type T in\
