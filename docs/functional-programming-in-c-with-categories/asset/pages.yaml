  md: '# 5.1 Monads in Category Theory optional


    > "A monad is just a monoid in the category of endofunctors"

    > - A Brief, Incomplete, and Mostly Wrong History of Programming Languages


    This definition has become an internal joke in the functional community. Because
    it mystifies a concept that is extremely easy to grasp from a programming perspective.
    However, in category theory because of the abstraction involved, the definition
    of a monad can rightfully be difficult to grasp. We already have seen all the
    components of this definition.


    The equivalent definition of a monad is a **monad** is an [endofunctor]( ) **F**
    (a [functor]( ) mapping a [category]( ) to itself), together with two [natural
    transformations]( ) required to fulfil certain [coherence conditions]( ) (aka
    laws).


    Monads have two operations called return and join (those are the **monoid** operations):


    +   1. η: v → F(v) //Return (this is the empty of the monoid)

    +   2. μ: F(F(v)) → F(v) //Join (this is the concat of the monoid)


    **1)** In this first operation v → F(v) we can start from an object v and get
    a container F(v). This is our way to get monads. This is just a fancy way to say
    **Monad constructor** in programming terms :


    ![](img/d73681d801b4b826e0b2a293897bbba4_166_0.png)


    **2)** The second one F(F(v)) → F(v) means that we can join/flatten the two containers
    in one.


    ![](img/d73681d801b4b826e0b2a293897bbba4_166_1.png)


    You might feel that this was straightforward, and you can see the connection with
    the Id and array monads already seen. The concept that we have hidden here is
    that those are natural transformations. So, let us try to see what this mean in
    a visual way. First, we are going to see what Endofunctor means. This might need
    some mathematical imagination.'
