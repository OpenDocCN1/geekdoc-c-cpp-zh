  md: "# 4.12 Explicitly Compositing Functor\n\n**Functors are closed under composition.**\
    \ The term **closed** means that if we have two functors and we compose them,\
    \ the resulting structure is also a functor. This means that we should be able\
    \ to construct a well-behaved Map method for the composition, **using only the\
    \ Map methods of the composing functors** and nothing more.\n\nFor an id in a\
    \ Task for example `new Id<Task<int>>(Task<int>.Run(() => 4))` we can define as\
    \ an overall map for the composition with this extension method:\n\n```\npublic\
    \ static Id<Task<T1>> Map<T, T1>(this Id<Task<T>> @this, Func<T, T1> f)\n    =>\
    \ @this.Map(t => t.Map(f));\n```\n\nIt is easy to understand how this works. You\
    \ first pass the function inside with the map of the first functor, and then you\
    \ map the resulting value again using the map of the inner (second) functor.\n\
    \n**This works for all the functors.** The problem is that with C# we cannot write\
    \ a valid Generic Functor composition type. This is because we cannot represent\
    \ the “Functor” kind as a generic. For example, it would be great if we could\
    \ write an interface\n\n```\npublic interface IFunctor<T>\n{\n    IFunctor<T1>\
    \ Map<T1>(Func<T, T1> f);\n}\n```\n\nTo abstract over the concept of Functors\
    \ and then Maybe write something like the following to abstract over all Functor\
    \ compositions\n\n```\npublic static F<G<T1>> Map<T, T1>(this F<G<T>> @this, Func<T,\
    \ T1> f)\nwhere F:IFunctor<G>\nwhere G:IFunctor<T>\n=> @this.Map(t => t.Map(f));\n\
    ```\n\nUnfortunately, C# Type system is not that expressive enough. You can try\
    \ to implement something like that by yourself to see why this is impossible.\
    \ This is because C# does not support **Higher Kinded polymorphism** you can follow\
    \ some discussions on dotnet github repository. Scala and Haskell in contrast\
    \ support Higher Kinded Types.\n\nThe Problem is that if you want to use a specific\
    \ combination of Functors to compose you will have to give your own extension\n\
    \n```\npublic static Task<Id<T1>> Map<T, T1>(this Task<Id<T>> @this, Func<T, T1>\
    \ f)\n    => @this.Map(t => t.Map(f));\n```"
