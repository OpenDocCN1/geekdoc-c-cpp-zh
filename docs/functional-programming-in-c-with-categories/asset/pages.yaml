- pgno: 228
  md: '# 8.1.1　Clean Architecture with .NET core


    The architecture of web applications depends on the scale and scope of the application.
    The Previous decade the dominant architecture for small and medium web applications
    was the **Layered Architecture**. A Layered Architecture, organizationed the project
    structure into four main categories: **presentation, application, domain, and
    infrastructure.**


    ![](img/d73681d801b4b826e0b2a293897bbba4_228_0.png)


    Under the weight of ideas such as Domain-Driven Design from Eric Evans and Clean
    Code from “Uncle Bob” - Robert C. Martin the focus of the Architecture became
    the separation of concerns of the **Domain** from all the technicalities such
    as technologies, tools and implementation details.


    **The domain and its Use Cases** now were placed in the **centre** of the architecture
    design with minimal dependencies. This led to a series of evolutionary transformations
    of the Layered structure ( Hexagonal Architecture, Pipes and adapters , DDD etc)
    leading at to the concept of [Clean architecture](#).'
  merge: -1
