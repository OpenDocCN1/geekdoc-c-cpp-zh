  md: "# 1.12 Currying and partial application\n\nCurrying is a considerably basic\
    \ and profound concept in functional programming. That is why it carries the name\
    \ of the great Haskell Curry. Currying means that a function that takes multiple\
    \ arguments can be translated into a series of function calls that each take a\
    \ single argument. An expression like this:\n\n```\npublic string F(int x, int\
    \ y) { }\n```\n\nthat we invoke like this\n\n```\nvar resultString = F(4,5);\n\
    ```\n\ncan be transformed to the equivalent :\n\n```\npublic Func<int, string>\
    \ F(int x)\n{\n    string g(int y) { }\n    return g;\n}\n```\n\nWhich we can\
    \ call like this:\n\n```\nvar resultString = F(4)(5);\n```\n\nor if we just use\
    \ lambda the previous transformation would look like this:\n\n```\nFunc<int, int,\
    \ string> F = (x, y) => { };\n```\n\n```\nFunc<int, Func<int, string>> F1 = x\
    \ => y => { };\n```\n\nWe say that the second is the Curried version of the first.\
    \ I know that using Func delegates it makes it difficult to grasp. For example,\
    \ in JavaScript where we don’t have types the previous looks like this:\n\n```\n\
    var f = (x, y, z) => {...}\n```\n\n```\nvar f = x=>y=>z=> {...}\n```\n\nwe replace\
    \ the commas ( , ) with arrows =>.\n\nThe language-ext library provides Currying\
    \ functions. A simple implementation of a generic Higher-order function that transforms\
    \ a two-argument function, into its curried version looks like this:\n\n```\n\
    Func<A, Func<B, C>> Curry<A, B, C>(Func<A, B, C> f) => (A x)=>(B y) => f(x, y);\n\
    ```\n\nthe type of this function is ((A × B) → C) →(A →(B →C)). In a more specific\
    \ example, a function that has a discount and a price argument:\n\n```\nFunc<double,\
    \ double, double> discountedPrice = (discount, price) =>\n```"
  merge: -1
