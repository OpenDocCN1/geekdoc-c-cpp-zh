- pgno: 206
  md: "# 6.5.5 A brief mentioning of Hylomorphisms\n\n> “Hylomorphism (or hylemorphism)\
    \ is a philosophical theory developed by Aristotle, which conceives being (ousia)\
    \ as a compound of matter and form”\n> -Wikipedia\n\nWe can now combine ana and\
    \ cata, by first using an anamorphisms ana to generate an expression like\n\n\
    ```\nnew Some({ value: 2, rest: new Some({ value: 1,rest: new None() }) })\n```\n\
    \nand then use a catamorphism cata to compress this expression it into a single\
    \ value. This process is called Hylomorphism. In our case we can get the factorial:\n\
    \n```\npublic static int Multiply(this Maybe<Product<int>> @this) =>\n@this.MatchWith(pattern:\
    \ (\n    None: () => 1,\n    Some: (product) => product.Value * product.Rest.Multiply()\n\
    ));\n\npublic static Maybe<Product<int>> AnaToListBase(this int @n) =>\n@n ==\
    \ 0 ? (Maybe<Product<int>>)new None<Product<int>>() :\n    new Some<Product<int>>(new\
    \ Product<int>()\n    {\n        Value = @n,\n        Rest = (@n - 1).AnaToListBase()\n\
    \    });\n\nFunc<int, int> factorial = n => n.AnaToListBase().Multiply();\n```\n\
    \nthe mathematical formulation behind hylomorphism is a recursive function\n\n\
    h(a) = { c if p(a) == true\nb ⊗ h(a') where g(a) = (a',b)\n\nwhere h is a function\
    \ h: A → C . This can be decomposed in an anamorphic part g: A → A × B that generates\
    \ a pair of (a: A , b:B) and a catamorphic part represented by the operator ⊗\
    \ : C × B → C that folds a pair (c: C , b:B) into an a: A and also a conditional\
    \ P(a) that determines if the anamorphisms has to stop and start accumulating\
    \ the generated items on a base c element of type C . In order to fully grasp\
    \ the idea, you can look at the following graphic representation and then revisit\
    \ the mathematical notation."
