    \n# 8.7 CQRS and MediatR\n\n# 8.7.1 The Command Pattern with a Mediator\n\nIn\
    \ the context of CQRS Commands and Queries are just DTOs (*Data transfer objects*)\
    \ that encapsulate all the information needed to perform an action. For example:\n\
    \n```\npublic class CreateCourse : Record<CreateCourse>, IRequest<Either<Error,\
    \ int>>\n{\n    public CreateCourse(string title, int credits, int departmentId)\n\
    \    {\n        Title = title;\n        Credits = credits;\n        DepartmentId\
    \ = departmentId;\n    }\n}\n```"
