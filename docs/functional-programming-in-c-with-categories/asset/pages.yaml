    \n# 4.11 Either Functor\n\nEither Functor is an extension of Maybe. The Right\
    \ is equal to the Maybe.Some, and the Left is the equivalent of Maybe.None, but\
    \ now we can allow it to carry a value Left =(v)=>{}. This value can be viewed\
    \ as a message (usually, it represents an error message).\n\n![](img/d73681d801b4b826e0b2a293897bbba4_141_1.png)"
