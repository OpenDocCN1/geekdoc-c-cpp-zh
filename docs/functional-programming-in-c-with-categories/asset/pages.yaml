  md: '# Category Theory


    # Endofunctor


    A Functor from a category to itself is called an endofunctor. Given any category
    C, we can create a new category End(C) is called the endofunctor category of C.
    The objects of End(C) are endofunctors F:C → C, and the morphisms are **natural
    transformation** between such endofunctors.


    In a visual form this would look like the following. First, we have a functor
    Between the same Category **C**. Since this section is more abstract, I am not
