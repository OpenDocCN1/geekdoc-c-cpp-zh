- pgno: 22
  md: "The Correspondence is the following:\n\n+   1. An implication **introduction**\
    \ in Logic is like a Lambda **abstraction** in Lambda calculus.\n+   2. An Implication\
    \ **elimination** in Logic is like a Lambda **application** in Lambda calculus.\n\
    \nThe easiest thing that we can prove is the identity, Func<A, A> Id = (A x) =>\
    \ x;\n\nLogic\n\n[A]^x\n---\nA → A  → I_x\n\nTypes\n\n[x: A]\n---\nλx. x: A →\
    \ A  ⇒ I_x\n\nThe natural deduction derivation is straightforward:\n\n+   1. **[A]^x**:\
    \ We make an **assumption [A]^x** that we have an **A**. In the code this means\
    \ that we start the lambda (A x)=> in this way we are charged with an **A**, that\
    \ we can use in our function implementation. The problem is that when we will\
    \ need to use the **Id** we should have an **A** available. The notation of [...]^x\
    \ is used within the context of deduction as a book-keeping mechanism to keep\
    \ track of the assumptions.\n+   2. And then immediately conclude **A** (A x)\
    \ => x and **eliminate the assumption** (discharge the assumption) **[A]^x** by\
    \ invoking the implication → introduction rule.\n\nAnother easy tautology is the\
    \ proposition **A → (B → A)** [this is called **K combinator**] with the following\
    \ straight forward implementation in C# using only lambdas:\n\n```\nFunc<A, Func<B,\
    \ A>> K = (A x) => ((B y) => x);\n```\n\nThis corresponds to the lambda term:\n\
    \n**λx:A. λy:B. x: (A → (B → A))**\n\n**K** just takes a variable **x:A** this\
    \ returns a function which takes a **y:B** completely ignores it and returns the\
    \ initial variable. Yes, as you might expect it is completely useless in real\
    \ situations.\n\nFor a complete presentation of the combinators we are also going\
    \ to briefly discuss the **S combinator**.\n\n```\nFunc<Func<A, B>, Func<A, C>>\
    \ S<A, B, C>(Func<A, Func<B, C>> f) =>\n    (Func<A, B> g) => ((A a) => f(a)(g(a)));\n\
    ```\n\nThe type of this function is :\n\n**S: (A → (B → C)) → ((A → B) → (A →\
    \ C))**"
