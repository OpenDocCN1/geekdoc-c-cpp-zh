  md: "```\nreturn continuation;\n}\n```\n\nOr alternatively we can use the ContinueWith.\n\
    \n```\npublic static Task<T1> Bind<T, T1>(this Task<T> @source, Func<T, Task<T1>>\
    \ f) =>\n    source.ContinueWith(task => f(task.Result).Result);\n```\n\nthis\
    \ will allow us to write\n\n```\nvar result = await Task<int>.Run(() => 4)\n \
    \   .Map(x => x * x)\n    .BindAsync(x => Task<int>.Run(() => x + 2))\n    .MatchWithAsync((\n\
    \        left: (e) =>\n        {\n            return e.Message;\n        },\n\
    \        right: (v) =>\n        {\n            return \"result:\" + v;\n     \
    \   }\n    ));\n```\n\nWhere the MatchWithAsync is defined in order to provide\
    \ a normalized functional syntax that looks the same for Maybe , Either:\n\n```\n\
    public static async Task<T1> MatchWithAsync<T, T1>(this Task<T> @this,\n(Func<Exception,\
    \ T1> left, Func<T, T1> right) pattern) =>\n    await @this.ContinueWith(t =>\n\
    \    {\n        if (t.IsFaulted)\n            return pattern.left(t.Exception);\n\
    \        else\n            return pattern.right(t.Result);\n    });\n```\n\nLanguage\
    \ -ext has no similar implementation of Match and we are not going to see this\
    \ method again instead we will await the Task to extract the results.\n\n# 5.8\
