  md: "```\n.GetById(clientId)\n.Map(client => client.Name)\n.Case switch\n{\n   \
    \ SomeCase<string>(var name) => name,\n    NoneCase<string> { } => \"no client\"\
    ,\n    _ => throw new NotImplementedException()\n};\n```\n\nThe Option exposes\
    \ a Case property.\n\nThe two subtypes that we must match on, are the SomeCase<>\
    \ and NoneCase<> and we are going to use this form instead of the Match a lot.\
    \ Both provide the same behaviour, and it comes down to preference.\n\nThe only\
    \ drawback is that you must write explicitly the Types of the SomeCase<> and NoneCase<>\
    \ because the compiler cannot infer those.\n\n# 4.10.8 Folding Maybe\n\nFor the\
    \ maybe Fold is extremely easy to implement we start with the accumulator and\
    \ if we have a None then we just return itself or in the case of the Some we apply\
    \ the reducer to the accumulator and the value in order to merge the values:\n\
    \n```\npublic S Fold<S>(S accumulator, Func<S,T,S> reducer) =>\n    this.MatchWith((\n\
    \        none: () => accumulator,\n        some: (v) => reducer(accumulator,v)\n\
    \    ));\n```\n\nMost of the times (almost all) we will prefer the MatchWith to\
    \ get the value out of the Maybe. We can use Fold like this:\n\n```\npublic string\
    \ GetNameById(int clientId) =>\n    clients\n    .GetById(clientId)\n    .Map(client\
    \ => client.Name)\n    .Fold(\"\", (a, name) =>\n    {\n        return name;\n\
    \    });\n```"
