  md: "# 4.10.6 Maybe Functor Example With language-ext Option\n\nFortunately for\
    \ us the language-ext have defined an implicit operator on the Option that does\
    \ the conversion of null to Option immediately:\n\n```\npublic static implicit\
    \ operator Option<A>(A a);\n```\n\nthis allows us to write something like the\
    \ following:\n\n```\npublic Option<Client> GetById(int id) => clients.SingleOrDefault(x\
    \ => x.Id == id);\n```\n\nWe now return an Option<Client>\n\nthe compiler expects\
