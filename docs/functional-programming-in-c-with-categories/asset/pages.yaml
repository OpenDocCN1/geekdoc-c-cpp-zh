    \nLike the maybe/Option monad, Either has a SelectMany implementation that allows\
    \ us to use LINQ syntax :\n\n```\nvar r = from x1 in Right(2)\n        from x2\
    \ in Right(3)\n        select x1 + x2;\n```\n\nwhich is the same as :\n\n```\n\
    var r1 = Right(2).Bind(x => Right(3).Map(y => x + y));\n```\n\nwhich means that\
    \ we can rewrite GetAssignedEmployeeNameById\n\n```\npublic string GetAssignedEmployeeNameById(int\
    \ clientId) =>\n    (from c in clients.GetById(clientId)\n     from e in employees.GetById(c.EmployeeId)\n\
    \     select e) .Case switch\n    {\n        LeftCase<string, Employee>(var error)\
