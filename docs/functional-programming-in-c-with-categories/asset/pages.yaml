    ```\n\nwhen something returns a void, you might suspect that might be accepting\
    \ an Action<> as an argument.\n\n# 1.7 Callbacks\n\nLet us close this section\
    \ with another familiar Higher Order Function composition type: The Callback.\
    \ We are going to use Callbacks in various forms thought-out this book (especially\
    \ together with the concept of pattern matching, as we ill see in the next chapter).\n\
    \nCallback is a Func delegate that is passed as an argument to some Function.\
    \ Other code inside the function is expected to invoke the Func delegate argument\
    \ at a given time.\n\nThe simplest form of a callback is the following :\n\n```\n\
    void G<T, R>(Action<R> callback, T y)\n```"
