    ```

    Func<T0, U0, R> PreCompose<T, U, R1, T0, U0>(Func<T, U, R> f, Func<T0, T> g1,
    Func<U0, U> g2) => (T0 x, U0 y) => f(g1(x), g2(y));

    ```


    Another possibility is to have a simple value provider Func<T> as the first function.
    In this case we can only post-compose:


    ![](img/d73681d801b4b826e0b2a293897bbba4_32_1.png)


    ```

    Func<U> Compose<T, U>(Func<T> f, Func<T, U> g) => () => g(f());

