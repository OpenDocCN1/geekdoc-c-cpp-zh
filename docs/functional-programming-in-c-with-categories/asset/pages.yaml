  md: "We can form products using the available C# syntax in many ways, the following\
    \ are products or arity-2 formed by two objects (arity is the number of items)\
    \ but there can be products of any size\n\n```\n(int A, int B) product = (A: 10,\
    \ B: 20); //tuples are products.\n```\n\n```\npublic class Product\n{\n    public\
    \ int A { get; set; }\n    public int B { get; set; }\n}\n//objects are products.\n\
    ```\n\n```\nvar product = new List<int> { 10, 20 }; //a list can be seen as a\
    \ product.\n```\n\nAll those are isomorphic, containing the exact same information,\
    \ and we could construct functions that convert the one to the other.\n\nThat\
    \ is why we can replace for example the argument list on a method with a Tuple\
    \ or an object. The following are all equivalent:\n\n```\npublic static void GetDiscount(int\
    \ A, int B) { }\npublic static void GetDiscount((int A, int B) product) { }\n\
    public static void GetDiscount(Product product) { }\n```\n\nThis transformation\
    \ commonly called Introduce Parameter Object refactoring move. And it is based\
    \ on the fact that both (,,,) and Tuples ((,,)) are products. The most important\
    \ law in order to consider something as a product is that we must be able to write\
    \ two functions that will take a product and gives us the component parts. Those\
    \ functions are called projections.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_76_0.png)\n\
    \nFor example, for an array definition of a product [, ] the projections would\
    \ be:\n\n```\nvar product = new List<int> { 10, 20 };\nFunc<List<int>, int> first\
    \ = p => p[0];\nFunc<List<int>, int> second = p => p[1];\n```\n\nFor the Tuple\
    \ (int A, int B) definition of a product the projections would be:\n\n```\n(int\
    \ A, int B) product = (A: 10, B: 20);\n```\n\n```\nFunc<(int A, int B), int> first\
    \ = p => p.A;\nFunc<(int A, int B), int> second = p => p.B;\n```"
