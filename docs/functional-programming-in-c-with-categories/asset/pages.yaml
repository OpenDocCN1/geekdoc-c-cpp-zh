- pgno: 73
  md: "# 3 Algebraic Data Types\n\n> “Lists come up often when discussing monoids,\n\
    > and this is no accident: lists are the “most fundamental” Monoid instance.”\n\
    > Monoids: Theme and Variations (Functional Pearl)\n\nMany of the most popular\
    \ data structures like a list have definitions like this:\n\n> “A list is **either**\
    \ an **empty list** or a **concatenation** of an **element** and a **list.**”\n\
    \nIn the above sentence if we replace the word element with a, the either with\
    \ +, and the concatenation with * we get the algebraic definition of a list:\n\
    \n**List (a)** = [ ] + **a** * **List(a)**\n\nThis definition is recursive because\
    \ the term List appears on both sides of the definition. In C#, this translates\
    \ to something like the following:\n\n```\npublic abstract class ListBase<T> {\
    \ }\n\npublic class Cons<T> : ListBase<T> {\n    public ListBase<T> Rest { get;\
    \ set; }\n    public T Value { get; set; }\n\n    public Cons(T value, ListBase<T>\
    \ rest)\n    {\n        this.Value = value;\n        this.Rest = rest;\n    }\n\
    }\n\npublic class Empty<T> : ListBase<T> { }\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_73_0.png)"
  merge: -1
  img_proc: true
- pgno: 74
  md: "```\nvar list = new Cons<int>(value: 2,\n    rest: new Cons<int>(value: 5,\n\
    \        rest: new Empty<int>()));\n```\n\nThis definition is the base definition\
    \ of a List. Furthermore, because of its significance, we will often use this\
    \ simple algebraic form of the List to display many functional ideas.\n\nIn practical\
    \ terms giving recursive definitions means that we can progressively compose more\
    \ complex entities out of simpler objects by applying some operations between\
    \ them. The following three ways to combine structures are the most pervasive\
    \ in programming.\n\n+   1. **Product** [object-oriented equivalent: **composition**]:\
    \ In our definition of the list the object literal that has two properties is\
    \ a product\n+   `Cons(T value, ListBase<T> rest)`\n+   2. **Coproduct** [object-oriented\
    \ equivalent: **inheritance**]: In our definition of the list, `Cons<T> : ListBase<T>`,\
    \ and `Empty<T> : ListBase<T>` form a co-product, commonly called a union type.\
    \ In object-oriented terms, simple inheritance is a union type.\n+   3. **Recursive\
    \ Type** [object-oriented equivalent: **a type that contains objects of the same\
    \ Type or inheriting type**]: The fact that in\n+   `Cons<T> : ListBase<T> {public\
    \ ListBase<T> Rest { get; set; }}`\n+   the Rest is a ListBase<T>Type means that\
    \ we have a recursive definition.\n\nThe fact that a data type can be formed by\
    \ applying some operations between them gives them the name **algebraic**. An\
    \ **algebraic data type** is a kind of composite type.\n\nNow, if we define those\
    \ three operations in any language or programming paradigm, we can define a list\
    \ by following the algebraic definition “A list is **either** an **empty list**\
    \ or a **concatenation** of an **element** and a **list.**”. If someone tells\
    \ us how to form a product a coproduct and a recursive type in Java or python\
    \ or Elm we can instantly write a definition of a list without the need to be\
    \ experts of the language."
