    \ is a Hof because it takes a Func<T, U> delegate as an argument.\n\n```\nR F<T,\
    \ U, R>(Func<T, U> g, T y)\n{\n    ...\n}\n```\n\nThe type of this function is\
    \ **F: ((T→U) × T) → R**. While the following is a Hof because it returns a Func<T,\
    \ U>\n\n```\nFunc<T, U> G<T, U>(T y)\n{\n    ...\n}\n```\n\nWith a type of **G:\
    \ T→(T→U)**, we can also use the local function form inside other methods or functions.\n\
    \nIn the form of Func delegates the previous functions now should be declared\
    \ like this:\n\n```\nFunc<Func<T, U>, T, R> F = (Func<T, U> g, T y) => ...\n```\n\
    \n```\nFunc<T, Func<T, U>> G = (T y) => ...\n```\n\nunfortunately, C# does not\
    \ allow for Generic definitions at the level of the delegate. We cannot write\
    \ for example :\n\n```\nFunc<Func<T, U>, T, R> F = <T, U, R>(Func<T, U> g, T y)\
    \ => ...\n```\n\n```\nFunc<T, Func<T, U>> G = <T, U>(T y) => ...\n```\n\nFor this\
    \ reason, we must place them in a Function or Class, and include the generic constrains\
    \ there:\n\n```\npublic static void Foo<T, U, R>()\n{\n    Func<Func<T, U>, T,\
    \ R> F = (Func<T, U> g, T y) => ...\n```"
