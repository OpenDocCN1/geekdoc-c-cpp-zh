  md: "```\nreturn new Product(product.Price * (1 - discount));\n}\n}\nvar discountedProduct\
    \ = new PricingService()\n    .GetDiscountedProduct(new Product(100), 0.1);\n\
    ```\n\nThe type signature of the GetDiscountedProduct function now is\n\n```\n\
    (Product, double) → Product\n```\n\nFinally, this type reflects the real intention\
    \ of the Pricing computation.\n\n# 1.2 Evolution of Delegates in C#\n\nThe most\
    \ prominent language feature that facilitates functional programming is the existence\
    \ of First-Class functions. This means the language needs to support the ability\
    \ to treat functions as you would any variable and pass them around to other functions\
    \ as you see fit. Lambda functions extend this concept, allowing the creation\
    \ of an anonymous function, in a compressed and easy to read syntax.\n\nHere we\
    \ are going to display in rapid succession in just a section all the C# features\
    \ related to lambdas. Consider this as a small reference guide. From .net 1.0\
    \ version the delegate was introduced. The delegate is a thing of the past and\
    \ you probably will not see it anywhere but is behind all other concepts. A delegate\
    \ Type is just a declaration of a function signature.\n\n# Delegates\n\nFor example,\
    \ we can declare this delegate:\n\n```\npublic delegate double DiscountDelegate(double\
    \ price, double discount);\n```\n\nthis informs us that anything that looks like\
    \ the following:\n\n```\ndouble __ (double price, double discount)\n```\n\ncan\
    \ be assigned at a variable of type DiscountDelegate. If we have the following\
    \ function:\n\n```\ndouble GetDiscountedPrice(double price, double discount)\n\
    {\n    return price * (1 - discount);\n}\n```\n\nThis is a perfectly valid declaration:\n\
    \n```\nDiscountDelegate discountFunc = GetDiscountedPrice;\n```\n\nYou will see\
    \ if you try to use this discountFunc variable the intellisense informs you that\
    \ this expects 2 arguments of double and returns a double"
