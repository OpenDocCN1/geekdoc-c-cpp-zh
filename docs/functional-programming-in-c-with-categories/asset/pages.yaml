    \ => Console.WriteLine(error));\n});\n```\n\nAnother way to use the validation\
    \ within language-ext library is to use the .Apply() method with a Tuple of Validations\
    \ for example:\n\n```\n(maxStrLength(3)(\"aadda\"), isDigit(\"1e23\")).Apply((name,\
    \ cardNumber) => ...)\n```\n\nHere all the validations are successful then the\
    \ result of each one is placed in the lambda inside the Apply((name, cardNumber)\
    \ => ...) and we can collect them and return any object by composing them :\n\n\
    ```\nvar result = (maxStrLength(3)(\"aadda\"), isDigit(\"1e23\"))\n    .Apply((name,\
    \ cardNumber) => new Card { Name=name, CardNumber=cardNumber });\n\nresult.Match(\n\
    \    Succ: _ =>\n    {\n        Console.WriteLine(\"no errors\");\n    },\n  \
    \  Fail: errors =>\n    {\n        errors.ToList().ForEach(error => Console.WriteLine(error));\n\
    \    });\n```\n\n# 5.7 Task<T> as Monad\n\nIn the Following sections we are going\
    \ to see how to use Monads in Asynchronous situations. Firstly, we can extend\
    \ the native Task<T> into a monad by providing a Bind method that would allow\
    \ us to combine Tasks using async/await :\n\n```\npublic static async Task<T1>\
    \ BindAsync<T, T1>(\n    this Task<T> @source,\n    Func<T, Task<T1>> f)\n{\n\
    \    var value = await @source;\n    var continuation = await f(value);\n```"
