  md: "thus, the diagram must commute. This is the hallmark of a valid isomorphism\
    \ between Functors the structure should be preserved after the Map and Iso transformations.\n\
    \n# 4.5.2 The Basic Functor Mechanics\n\nThe following picture represents the\
    \ whole idea behind how we construct the map of a functor. If we accept the Functor\
    \ as a container metaphor, which is an acceptable way to visualize functors especially\
    \ in an Object-oriented programming setting.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_124_0.png)\n\
    \nThe mapping function that lifts the function f: int → int It follows the steps:\n\
    \n+   1. Open the container F(a) and access the value a\n+   2. Applying the function\
    \ f on the value a and get a new value b\n+   3. wraps the resulting value again\
    \ into a new container F(b) and return this F(b)\n\nin the simplest form of the\
    \ Identity functor the map follows those steps\n\n```\npublic class Id<T>\n{\n\
    \tpublic T Value { get; set; }\n\tpublic Id(T value)= Value = value;\n\tpublic\
    \ Id<T> Map<T>(Func<T, T> f) => new Id<T>(f(Value));\n}\n```"
