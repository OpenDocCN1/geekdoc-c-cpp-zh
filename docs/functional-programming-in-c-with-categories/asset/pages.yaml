  md: "For example, we can give useful methods to native types to simplify our code\
    \ and provide method chaining. Take for example this extension of Tuples that\
    \ we are going to use. By adding the Following static class that contains an Extension\
    \ method on the ValueTuple\n\n```\npublic static class FunctionalExt\n{\n    public\
    \ static List<T> ToList<T>(this ValueTuple<T, T> @this) =>\n        new List<T>\
    \ { @this.Item1, @this.Item2 };\n}\n```\n\n[Extension methods should be static\
    \ (1) inside a static class (2) and you must use the this keyword (3) before the\
    \ argument, which acts as a reference to the type you want to attach the method.]\n\
    \nWe can now go ahead and use the ToList<T> method on any 2-item ValueTuple\n\n\
    ```\nvar list = (4, 5).ToList();\n```\n\nsince ValueTuple<T,T> is equivalent to\
    \ a list List<T> with 2 items.\n\nTo take this one step further we will rewrite\
    \ our Map definition on ValueTuple<T,T> from the Higher order Functions section\
    \ :\n\n```\nValueTuple<T1, T1> Map<T, T1>(ValueTuple<T, T> @this, Func<T, T1>\
    \ f) =>\n    new ValueTuple<T1, T1>(f(@this.Item1), f(@this.Item2));\n```\n\n\
    and instead create an extension method on the ValueTuple<T,T>\n\n```\npublic static\
    \ class FunctionalExt\n{\n    public static ValueTuple<T1, T1> Map<T, T1>(\n \
    \       this ValueTuple<T,T> @this,\n        Func<T,T1> f) => new ValueTuple<T1,\
    \ T1>(f(@this.Item1), f(@this.Item2));\n}\n```\n\nThe above declaration now will\
    \ allow us to write:\n\n```\nvar result = (1,3).Map(x=>x*x);\n```\n\ninstead of\
    \ this:\n\n```\nvar result = Map((1, 3), x => x * x);\n```\n\nin this way we obtain\
    \ a certain control over the Native types and force our functional style of writing."
