    \ discount\n```\n\nyou can even have simple multithread applications that just\
    \ access the Price in a different order of what was intended. We can of course\
    \ hide the Price from the outside environment (the class scope).\n\n```\npublic\
    \ class Product\n{\n    public double Price { get; private set; }\n    public\
    \ Product(double price)\n    {\n        Price = price;\n    }\n    public void\
    \ AddDiscount(double discount)\n    {\n        this.Price = this.Price * (1 -\
