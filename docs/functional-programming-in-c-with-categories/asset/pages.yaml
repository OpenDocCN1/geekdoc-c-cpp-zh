  md: "# 4.19 Reader Applicative Functor optional\n\nA reader applicative is a reader\
    \ that has a function stored as the expression expr. The implementation is a bit\
    \ complex. Try to imagine that you want to combine a reader that has a function\
    \ and a reader that has just a value. This is my implementation:\n\n```\npublic\
    \ static class FunctionalExtensions\n{\n    public static Reader<Env, T1> App<Env,\
    \ T, T1>\n        (this Reader<Env, Func<T, T1>> @this, Reader<Env, T> fa) =>\n\
    \    new Reader<Env, T1>(env => { return @this.Map(f => fa.Map(f).Run(env)).Run(env);\
    \ });\n}\n```\n\n```\nvar r = new Reader<(int, int), Func<int, int>>((g => (r)\
    \ => g.Item1 + r))\n    .App(new Reader<(int, int), int>(g => 1))\n    .Run((1,\
    \ 2));\n```\n\nif we take the applicative operation\n\nAp: f(a→b)→f(a)→f(b) (this\
    \ is the name for ⟨⊗...⟩)\n\nfor the reader specifically by substituting the f\
    \ with the ((→) env) [that’s (env →_)] we get\n\n⟨⊗⟩: ((→)env) (a→b) → ((→)env)\
    \ a → ((→)env) b\n\nWith some reductions we get the form\n\n(env → (a→b)) → (env\
    \ → a) → (env → b)\n\nIf for example, we have a curried function of arity 2 like\
    \ x=>y=>y+x we can do that\n\n⟨add ⊗ 1 ⊗ 2⟩ → ⟨1+2⟩ we will get a reader of the\
    \ addition\n\n```\nvar t = new Reader<object, Func<int, Func<int, int>>>((g =>\
    \ x1 => y1 => x1 + y1))\n    .App(new Reader<object, int>(g => 1)).App(new Reader<object,\
    \ int>(g => 1))\n    .Run(default);\n```\n\nCategory Theory Monoidal Functor\n\
    \nLet (C,⊗_C,1_C) and (D,⊗_D,1_D) be two monoidal categories. A lax monoidal functor\
    \ between them is\n\n+   1. a functor F:C→D.\n+   2. a morphism ε:1_D→F(1_C)"
