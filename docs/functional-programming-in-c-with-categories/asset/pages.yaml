- pgno: 49
  md: "monoid over the integers. Strings in C# have a default monoid, which is formed\
    \ by the concatenation and the empty string (\"\", Concat).\n\nWe will use monoids\
    \ in our code by defining simple object literals that have two functions, one\
    \ that returns the identity element called Empty and one that represents the binary\
    \ operation called Concat.\n\n> [In this book, we will use the fantasy land specification\
    \ of the monoid regarding naming conventions, especially since C# already uses\
    \ Concat for strings and arrays.]\n\n```\npublic interface IMonoid<T>\n{\n   \
    \ T Empty { get; }\n    T Concat(T x, T y);\n}\n```\n\nThis interface has a type\
    \ of: IMonoid<T>: (Empty: T, Concat: (T × T)→ T), alternatively the curried version\
    \ for Concat is (T → T)→ T which is a common typing.\n\nwe will use monoids in\
    \ this way:\n\n```\nvar sum = new Sum();\nvar total = sum.Concat(1, sum.Concat(3,\
    \ 4));\n```\n\nThis definition would allow us to use it with the Aggregate function\
    \ of a list in a direct manner:\n\n```\ntotal = new[] { 1, 3, 4, 5 }.Aggregate(sum.Empty,\
    \ sum.Concat);\n```\n\nWe can also define a monoid as a tuple:\n\n```\n(int empty,\
    \ Func<int, int, int> concat) sum = (0, (x, y) => x + y);\n```\n\nAlternatively,\
    \ if we want to have closure [meaning that the return type of the Concat and Empty\
    \ is of the same type with the initial object], we could define one new class\
    \ for each monoid.\n\n```\npublic interface IMonoidAcc<T>\n{\n    T Identity {\
    \ get; set; }\n    IMonoidAcc<T> Concat(IMonoidAcc<T> m);\n}\n```\n\n```\npublic\
    \ class Sum : IMonoidAcc<int>\n{\n    public Sum(int value) => Identity = value;\n\
    \    public int Identity { get; set; }\n    public IMonoidAcc<int> Concat(IMonoidAcc<int>\
    \ m) =>\n        new Sum(m.Identity + Identity);\n}\n```\n\n```\nvar total = new\
    \ Sum(0).Concat(new Sum(1)).Concat(new Sum(2)).Concat(new Sum(3));\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_49_0.png)"
  merge: -1
  img_proc: true
- pgno: 50
  md: "This formulation is nice in the sense that allows for fluent chaining var total\
    \ = new Sum(0) .concat(new Sum(1)) .concat(new Sum(2)) because of the fact that\
    \ empty and concat both return a result of the same type. This also is more congruent\
    \ with the mathematical definition that says that if S is a structure (in a programming\
    \ language, this translates to a Type), then S × S → S, means that the operation\
    \ returns a structure of the same kind.\n\nIn practice we do not care about strict\
    \ definitions as long as we are aware that we are dealing with a monoid.\n\n#\
    \ 2.2.1 Folding monoids\n\nMonoids have this very desirable property that if we\
    \ keep applying this binary operation ⊗, we can always reduce the computation\
    \ to a single element of the same type:\n\n(M⊗...(M⊗(M⊗M)))→M\n\nthis is called\
    \ folding.\n\n(((v:M ⊗ u:M) ⊗ w:M ) ⊗ ... ⊗ z:M) =a:M\n\n![](img/d73681d801b4b826e0b2a293897bbba4_50_0.png)\n\
    \nLet us say we have some sequence of integers 2,4,5,6 and we want to add them\
    \ this a beginner level problem:\n\n```\nvar list = new[] { 1, 2, 3, 4 };\nvar\
    \ accumulation = 0;\nforeach (var current in list)\n    accumulation = accumulation\
    \ + current;\n(0,+) monoid\n```\n\nWhat I highlighted there are just an initial\
    \ element 0 and the addition which is an operation between two integers that return\
    \ an integer\n\nWhat if we wanted to multiply them?\n\n```\nvar accumulation =\
    \ 1;\nforeach (var current in list)\n    accumulation = accumulation * current;\n\
    (1,*) monoid\n```"
