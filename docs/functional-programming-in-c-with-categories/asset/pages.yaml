  md: "# 4.11.3 Either Functor Example\n\nSince the Either is a Maybe that curries\
    \ a value inside the Left subtype, we can create a method that would convert a\
    \ Maybe into an Either.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_144_0.png)\n\
    \nThe following method is a natural transformation from a Maybe<T> to an Either<TLeft,T>\n\
    \n```\npublic static Either<TLeft, T> ToEither<TLeft, T>(this Maybe<T> @source,TLeft\
    \ defaultLeft)\n{\n    return @source.MatchWith<Either<TLeft, T>>((\n        none:\
    \ () => new Left<TLeft, T>(defaultLeft),\n        some: (v) => new Right<TLeft,\
    \ T>(v)\n    ));\n}\n```\n\nWe pattern match on the maybe and in the case of a\
    \ None we return a Left with some default value. For example, for the Client repository\
    \ example in the case that we couldn’t find any client with the given id we can\
    \ return something more specific than simply None:\n\n```\npublic class MockClientRepository\n\
    {\n    ...\n    public Either<string, Client> GetById(int id) =>\n        clients.FirstOrNone(x\
    \ => x.Id == id)\n            .ToEither(\"No client Found\");\n}\n```\n\nThe following\
    \ of the computation is a usual\n\n```\npublic class Controller\n{\n```"
