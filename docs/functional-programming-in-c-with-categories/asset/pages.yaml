    We can create a new A→B, by just applying the same A to all f and then gluing\
    \ their B results.\n\n# 2.7 Decorator Design pattern - Functional Perspective\n\
    \nFunctional composition is in the heart of many object-oriented best practices.\
    \ Here we will see an idiomatic expression of the Decorator design pattern, which\
