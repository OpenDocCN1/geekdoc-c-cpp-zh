  md: 'And it is an interesting exercise to try and implement S in C# because it will
    give you better understanding of Func delegates.


    S, takes x and applies it to both f and g and then applies the g(x) onto f(x).
    We will find this in the applicative reader functor section. The x should be understood
    like a common environment of variables (or a configuration) that is provided to
    both f and g, and then we apply the result of g(x) to the f(x), which is a function.
    An example would be the following:


    ```

    Product result = S<Config,Product,Product>

    (config =>product=>new Product(product.Name, product.Price*(1- config.Discount)))

    (config => new Product($"A:{config.Category}", 100))

    (new Config(0.1, "Widgets"));

    ```


    We used the Combinator to pass (1) the Config(0.1, "Widgets") to the first lambda
    (2) and create a new Product and then we passed both the configuration and the
    Product to the (3) lambda to create a discounted Product using the Config Discount.


    # η-reduction / expansion - Point Free notation


    Let us say we have a simple lambda:


    ```

    Func<int, int> f = (int a) => a + 1;

    ```


    We can use this directly in any method that accepts a Func<int, int> delegate:


    ```

    var x = new List<int> { 1, 2, 3 }.Select(f);

    ```


    but we can also create a new lambda that explicitly call the function:


    ```

    var y = new List<int> { 1, 2, 3 }.Select(x => f(x));

    ```


    this is an η-expansion (eta-expansion). It is obvious that f ≡ (x => f(x)), that
    is the function f is equivalent to the lambda x => f(x). We can also keep doing
    this process indefinitely for example we could define the following lambdas:


    ```

    Func<int, int> f1 = (int x) => f(x);

    ```


    ```

    Func<int, int> f2 = (int x) => f1(x);

    ```


    Each of which can be used in place of the initial f e.g.:'
