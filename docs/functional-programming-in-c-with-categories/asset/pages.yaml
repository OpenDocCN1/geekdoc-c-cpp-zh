- pgno: 110
  md: '# Functors


    > "It should be observed first that the whole concept of a category is essentially
    an auxiliary one; Our basic concepts are essentially those of a functor and of
    a natural transformation."

    > S. Eilenberg and S. MacLane


    # The Idea:


    In C# the most famous functional programming idea is to use List.Select to replace
    iterations instead of for loops in order to transform the values of the array.
    That is because an array is a Functor, which is a more abstract idea that we will
    explore in this section.


    "Practically a Functor is anything that has a valid .Map(f) method."


    Functors can be considered the core concept of category theory.


    # 4 Functors


    In mathematics, a functor is a map between categories.


    ![](img/d73681d801b4b826e0b2a293897bbba4_110_0.png)


    This Functor F must map two requirements.


    +   1. Map each object x in C with an object F(x) in D,

    +   2. Map each morphism f in C with a morphism F(f) in D


    For object-oriented programming, the best metaphor for functors is a container,
    together with a mapping function. The Array as a data structure is a Functor,
    together with the map method. The map is the array method that transforms the
    items of the array by applying a function f.'
