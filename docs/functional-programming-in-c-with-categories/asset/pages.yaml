- pgno: 60
  md: "Let us start with simple example where we have a ProductA, and we can decorate\
    \ it with Packaging. Adding a packaging would affect the price, but we want to\
    \ treat a product and a packaged product interchangeably in our code. The decorator\
    \ pattern allows us to do just that by unifying both ProductA and Packaging under\
    \ a common IPriced interface :\n\n```\npublic interface IPriced {\n  double GetPrice();\n\
    }\n```\n\n```\npublic class ProductA : IPriced {\n  public double GetPrice() =>\
    \ 100;\n}\n```\n\n```\npublic class Packaging : IPriced\n{\n  private readonly\
    \ IPriced product;\n  public Packaging(IPriced product) => this.product = product;\n\
    \  public double GetPrice() => product.GetPrice() + 10;\n}\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_60_0.png)\n\
    \nThe decorator pattern is based on the idea/theme that the decorator exposes\
    \ the same interface with the decorated object.\n\nIn this example, the Packaging\
    \ exposes the same GetPrice() method with the decorated Product. This allows the\
    \ rest of the application to handle a simple product or a decorated product in\
    \ the same way without needing to know more details in order to get the price\
    \ [this is a nice display of information hiding/encapsulation in object-oriented\
    \ programming, since the decorated object hides the details of implementation\
    \ from the outside world and only reveals the price].\n\nFrom the Functional perspective\
    \ this again is possible because the + monoid on the return type of the GetPrice\
    \ function.\n\n\n\nFinally, we can strip of all the object-syntax completely and\
    \ only keep the functions."
