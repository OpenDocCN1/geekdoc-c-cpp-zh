  md: "# 7.3.3 Object Oriented Interpreter Pattern implementation\n\nTake a moment\
    \ to appreciate the use of the reader applicative to evaluate expressions. In\
    \ the object-oriented world exists something isomorphic to the above implementation:\
    \ the Interpreter design pattern. I am stating bellow an implementation based\
    \ on ECS6 in order to emphasize the object-oriented characteristics:\n\n```\n\
    public class Context\n{\n    public string Log { get; set; }\n}\n\npublic abstract\
    \ class Expr\n{\n    public abstract void Eval(Context context);\n}\npublic class\
    \ ValExpr : Expr\n{\n    public ValExpr(int x) { X = x; }\n    public int X {\
    \ get; }\n\n    public override void Eval(Context context)\n    {\n        context.Log\
    \ += $\"{X}\";\n    }\n}\npublic class AddExpr : Expr\n{\n    public AddExpr(Expr\
    \ x, Expr y)\n    {\n        X = x;\n        Y = y;\n    }\n\n    public Expr\
    \ X { get; }\n    public Expr Y { get; }\n\n    public override void Eval(Context\
    \ context)\n    {\n        context.Log += $\"Adding(\";\n        X.Eval(context);\n\
    \        context.Log += $\",\";\n        Y.Eval(context);\n        context.Log\
    \ += $\")\";\n    }\n}\n```"
