  md: "intuitive program behaviour that depends on how and when you create a monad\
    \ and how and in which order you compose functions.\n\n# 5.4 Maybe Monad\n\nMaybe\
    \ monad is extension of the Maybe Functor. To extend our maybe functor implementation\
    \ into a Monad we must provide a Bind method that combines two Maybe monads into\
    \ one. There are 4 different ways to combine the 2 possible states of maybe (some,none)\
    \ one can see that a valid implementation would be the following :\n\n```\npublic\
    \ abstract class Maybe<T>\n{\n    public abstract T1 MatchWith<T1>((Func<T1> none,\
    \ Func<T, T1> some) pattern);\n\n    public Maybe<T1> Bind<T1>(Func<T, Maybe<T1>>\
    \ f) =>\n        this.MatchWith((\n            none: () => new None<T1>(),\n \
    \           some: (v) => f(v)\n        ));\n}\n```\n\nOr By using the switch instead:\n\
    \n```\npublic abstract class Maybe<T>\n{\n    public Maybe<T1> Bind<T1>(Func<T,\
    \ Maybe<T1>> f) =>\n        this switch\n        {\n            None<T>() => new\
    \ None<T1>(),\n            Some<T>(var v) => f(v),\n            _ => throw new\
    \ NotImplementedException(),\n        };\n}\n```\n\nOf course the langiage-ext\
    \ library has a Option<>.Bind with similar implementation. The only combination\
    \ that leads to a new some (_) is when the two paths that both have values are\
