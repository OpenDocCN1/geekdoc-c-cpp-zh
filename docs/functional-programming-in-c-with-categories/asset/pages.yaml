  img_proc: true
- pgno: 136
  md: "```\npublic class Some<T> : Maybe<T>\n{\n    public readonly T Value;\n   \
    \ public Some(T value) => this.Value = value;\n}\n```\n\nIf we want to hide the\
    \ value public readonly T Value and make it into private then we can use the Deconstruct\
    \ to gain access for the pattern match :\n\n```\npublic abstract class Maybe<T>\n\
    {\n    public Maybe<T1> Map<T1>(Func<T, T1> f) =>\n        this switch\n     \
    \   {\n            None<T>() => new None<T1>(),\n            Some<T>(var v) =>\
    \ new Some<T1>(f(v)),\n            _ => throw new NotImplementedException(),\n\
    \        };\n}\n```\n\n```\npublic class None<T> : Maybe<T>\n{\n    public None()\
    \ { }\n    public void Deconstruct() { }\n}\n```\n\n```\npublic class Some<T>\
    \ : Maybe<T>\n{\n    private readonly T value;\n    public Some(T value) => this.value\
    \ = value;\n    public void Deconstruct(out T value) => value = this.value;\n\
    }\n```\n\nWith this formalism we can now write as an example :\n\n```\nstring\
    \ result = new None<int>()\n    .Map(x => x + 1)\n    switch\n    {\n        None<int>()\
    \ => \"nothing\",\n        Some<int>(var x) => x.ToString(),\n        _ => throw\
    \ new NotImplementedException(),\n    };\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "# 4.10.4 Maybe Functor Example\n\nNow let us get a client asynchronously with\
    \ a certain Id from a repository.\n\n```\npublic class MockClientRepository\n\
    {\n    List<Client> clients = new List<Client>{\n        new Client{Id=1, Name=\"\
    Jim\"},\n        new Client{Id=2, Name=\"John\"}\n    };\n\n    public Maybe<Client>\
    \ GetById(int id) =>\n        clients.FirstOrNone(x => x.Id == id);\n}\n```\n\n\
    Here we have replaced the result of the array filtering:\n\n```\n.FirstOrDefault(x\
    \ => x.Id == id)\n```\n\nwith something that will return a Maybe<Client>. If there\
    \ is no client for a specific id, we should return None(). If there is a client,\
    \ we will return Some(client).\n\n```\npublic static partial class FunctionalExtensions\n\
    {\n    public static Maybe<T> FirstOrNone<T>(this List<T> @source, Func<T, bool>\
    \ predicate)\n    {\n        var firstOrDefault = @source.FirstOrDefault(predicate);\n\
    \        if (firstOrDefault != null)\n            return new Some<T>(firstOrDefault);\n\
    \        else\n            return new None<T>();\n    }\n}\n```\n\nNow we can\
    \ write:\n\n```\nvar repository = new MockClientRepository();\n\nvar result =\
    \ repository.\n    GetById(1)\n    .MatchWith(pattern:(\n        none: () => \"\
    Not Found\",\n        some: (client) => client.Name\n```"
  merge: -1
  img_proc: true
