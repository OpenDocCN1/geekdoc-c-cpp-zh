  md: "# 4.11.5 Using Either for exception handling\n\nAs we saw the Either can be\
    \ reduced to maybe if we discard the value passed on the left side. **The left\
    \ side of either represents a faulty path where the Error is kept and does not\
    \ participate in any other computation; it just passes along the Error information.**\
    \ Let us refactor a try/catch to its’s Either equivalent. We will start with this\
    \ try-catch block:\n\n```\ndouble finalPrice;\ntry\n{\n    var discount = 0.1;\n\
    \    finalPrice = 10 - discount * 10;\n}\ncatch (Exception e)\n{\n    Console.WriteLine(e);\n\
    \    throw;\n}\n```\n\nwe could extract the outline of the try catch and inject\
    \ the two segments of try... and catch, with delegates [this is a functional flavored\
    \ version of the **template method design pattern** ].\n\nso we can rewrite it\
    \ like bellow, in a more general way.\n\n```\npublic class Try<T>\n{\n    public\
    \ T Result { get; set; }\n    public Try(Func<T> @try, Action<Exception> exeptionHandler)\n\
    \    {\n        try\n        {\n            Result = @try();\n        }\n    \
    \    catch (Exception e)\n        {\n            exeptionHandler(e);\n       \
    \ }\n    }\n}\n```\n\nand use it like that :\n\n```\nvar tryResult =new Try<double>((\
    \ ) =>\n{\n    var discount = 0.1;\n    finalPrice = 10 - discount * 10;\n```"
