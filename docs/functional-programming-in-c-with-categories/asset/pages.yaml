  md: '# Church encoding


    In mathematics the **Church numerals** are a representation of the natural numbers
    using lambda notation. The method is named for Alonzo Church, who first encoded
    data in the lambda calculus this way.


    0 ≡ λf. λf. x

    1 ≡ λf. λf. f(x)

    2 ≡ λf. λf. f(f(x))


    The type of those numerals is (_→_)→(_→_), which we can define as delegate for
    simplicity:


    ```

    delegate Func<_, _> N (Func<_, _> f);

    ```


    Then you can define things like the Successor function, addition etc.


    ```

    Func<N, N> Succ = (N n) => (f) => x => f(n(f)(x)); // add an additional f in front

    ```


    This is just a Hacky way to do arithmetic, imagined by the genius of Alonzo Church
    during the 30’s, which constitute the ancient history of computer science.


    Now, in the untyped lambda calculus we could have a lambda application (M N) of
    any two Terms. This led to problems early on because it allowed Russel type paradoxes
    [Curry''s paradox]. That is why **Types** were introduced to restrict the operations
    of Terms based on their type.


    This idea of types is considered today common knowledge, in all strongly typed,
    languages like C#.


    # Types


    The only types in λ→ is the Set of some base types **B**, and anything whatever
    is produced by this simple grammar in BNF form:


    τ ::= τ→ τ | T where T ∈ B


    this means the only types that occur in λ→ are inductively defined and are either
    of the form τ→ τ where τ is some already created type, or some type belonging
    to the base types. If for example B = {σ, ρ} then the types generated look like
    this :


    σ, ρ, σ→ σ, ρ→ ρ, ρ→ σ, (ρ→ σ) → ρ, ..., (ρ→ σ) →(ρ→ σ) ...


    If we take the C# type system with the usual primitive build-in types then a simple
    λ→ restricted version of C# would have as base types B= {int, char, bool, ...}
    and everything that would be generated using the τ ::= τ→ τ | T grammar. This
    would result in syntax trees like the following:'
