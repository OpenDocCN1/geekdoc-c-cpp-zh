    # Curry-Howard correspondence


    The Product is the equivalent to a logical AND or a conjunction A ∧ B of two propositions
    A and B. In order to conclude that the proposition A ∧ B holds we must know that
    both A and B are true. Or equivalently if we can prove A and prove B then we can
    Prove A ∧ B. This rule is commonly named introduction in mathematical logic because
    it introduces a conjunction ∧ out of the previous propositions.


    > A / A∧B ^I


    In the same spirit, in order to create a product of a type A and a type B then
    we must have an instance of both types in order to call the constructor of product
    var product = (x, y) => _. This equivalence originates from the Curry-Howard isomorphism,
    which is probably the most profound connection of computer programs and mathematical
    proofs. If we have an A ∧ B then we can deduce any of the A or B. This is called
    conjunction elimination. From A ∧ B the following hold


    > A∧B / A ^E1


    > A∧B / B ^E2


    or the propositions A ∧ B → A , A ∧ B → B are tautologies.


    A product is "costly to construct" since we need all components but easy to use
    since by taking any of the components through a projection (first, second...)
    would be valid.'
