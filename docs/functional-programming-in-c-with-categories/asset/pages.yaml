- pgno: 114
  md: 'When the red and blue paths give the same result, then we say that the diagram
    commutes


    ![](img/d73681d801b4b826e0b2a293897bbba4_114_0.png)


    Moreover, that means that the lifting of morphisms (aka arrows, aka functions
    in programming) preserves the structure of the objects in C.


    In practical day to day programming, commuting diagrams means that we can exchange
    the order of operations and still get the same result. It is not something that
    happens automatically and is something extremely helpful to have when coding.






    In category theory the commuting diagram represents in a way the concept of equality.
    A commutative diagram is a diagram such that all directed paths in the diagram
    with the same start and endpoints lead to the same result. It is said that commutative
    diagrams play the role in category theory that equations play in algebra.


    For example in the case of a Pullback where the you can imagine that the A is
    some kind of a product between Red and blue items. in order for both paths to
    map to the same green item the following must hold f(x)=g(y)


    # Products of Red,Blue


