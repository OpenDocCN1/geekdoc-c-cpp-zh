- pgno: 61
  md: "```\nFunc<double> ProductA = () => 100;\nFunc<double> ProductB = () => 200;\n\
    Func<Func<double>, Func<double>> Packaging =\n    (product) => () => product()\
    \ + 10;\n\nFunc<double> packagedProduct = Packaging(ProductA);\n```\n\nSo, In\
    \ a way any function of this form (T a) => (R b) => {} is equivalent to an object\
    \ that takes an a:T in the constructor and has only one method that takes a b:R\
    \ as argument.\n\nOnly functions: (Func<double> product) => () => {...}\nOOP:\
    \ class Packaging {constructor(IPriced product) {...} double getPrice() {...}\
    \ }\n\nThe idea here is for the decorating composing functions that come after\
    \ the decorated function that has a return type Product.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_61_0.png)\n\
    \n# Tuple notation\n\nAnother way to represent the Object is to use tuples, Unfortunately\
    \ C# does not allow Tuples with only a single member. So, for presentation purposes\
    \ we add another method to our product that returns the name getName: () => name.\
    \ Now we can define a product, by a function that acts as a Constructor:\n\n```\n\
    Func<string, double, (Func<string> getName, Func<double> getPrice)> Product =\n\
    \    (string name, double price) =>\n        (getName: () => name, getPrice: ()\
    \ => price);\n```\n\nWe can use this in order to create products:\n\n![](img/d73681d801b4b826e0b2a293897bbba4_61_1.png)\n\
    \n```\n(Func<string> getName, Func<double> getPrice) ProductA = Product(\"A\"\
    , 100);\n(Func<string> getName, Func<double> getPrice) ProductB = Product(\"B\"\
    , 200);\n```\n\nNow we can define the Decorator function as follows:\n\n```\n\
    Func<(Func<string> getName, Func<double> getPrice),\n    (Func<string> getName,\
    \ Func<double> getPrice)>\n    Packaging =\n```"
