- pgno: 30
  md: "The implementation is again trivial:\n\n```\nFunc<T, U, R2> Compose<T, U, R1,\
    \ R2>(Func<T, U, R1> f, Func<R1, R2> g) =>\n(T x, U y) => g(f(x, y));\n```\n\n\
    The intuition behind the construction of this function is also simple:\n\nSince\
    \ we want to construct a Func<T, U, R2> we must return a function that takes two\
    \ arguments T x and U y and return something of type R2, using only the two functions\
    \ that we want to compose Func<T, U, R1> and Func<R1, R2>.\n\n+   1. We start\
    \ by writing this function as lambda (T x, U y) =>... now we have a T x, and U\
    \ y and two delegates Func<T, U, R1> f, Func<R1, R2> g\n+   2. We use the T x,\
    \ and U y to invoke the Func<T, U, R1> f f(x, y) this will return a R and then\
    \ we can use the functional delegate Func<R1, R2> which represents a function\
    \ g: R1→R2 from R1 to R2\n\noptional\n\nCurry-Howard correspondence\n\nThe construction\
    \ of this simple function corresponds into a Proof of a Term like the following\
    \ : ((T∧U → R1)→(R1 → R2)→((T∧U) → R2)\n\nWhen we implement the Compose function\
    \ we actually construct a Deductive Proof.\n\n```\n[T]^x [U]^y   T∧U   [T∧U →\
    \ R1]^f     [R1 → R2]^g\n\nT∧U   I∧     R1   →E     R2   →E\n\nT → R2   I_x\n\
    U → T → R2   I_y\n```\n\n+   1. We make two assumptions [T]^x and [U]^y this is\
    \ pretty much the introduction of the two arguments (T x, U y) .\n+   \n+   2.\
    \ We then use them together with the function f: T∧U → R1 in what is called implication\
    \ elimination →E, which is just the function application f(x, y)."
