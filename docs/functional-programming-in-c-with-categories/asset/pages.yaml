    Create,Update,Delete\n\nGithub: source\n\nAlso, the result is wrapped in a Task\
    \ because in most cases the Persistance using Entity Framework 6 can be made Asynchronous\
    \ using Async methods for Save and Query. You can take a look at the Repositories\
    \ implementations where the SaveChangesAsync and SingleOrDefaultAsync are used.\n\
    \n# 8.6 CQRS\n\nThe project uses the CQRS architectural pattern to reduce coupling.\
    \ The term CQRS, (Command Query Responsibility Segregation) is based on the famous\
    \ CQS idea. It is the closest architecture available to split these responsibilities\
    \ to accomplish more and simplify the design. It’s all about separating things,\
    \ especially if they’re very different conceptually when it comes to reading and\
    \ updating models.\n\nThe pattern basically divides into two categories:\n\n+\
    \   1. Queries: get the information only, and never change anything within the\
    \ model."
