- pgno: 54
  md: "# 2.4 Function composition as a monoid\n\nFunction composition is itself a\
    \ more abstract and interesting example of a monoid. Let us say that we have a\
    \ category where the objects are the functions `Func<A, B>`, and the binary operation\
    \ is the **composition** of two functions `∘`.\n\n```\nFunc<A, C> Compose<A, B,\
    \ C>(Func<A, B> f, Func<B, C> g) => (A x) => g(f(x));\n```\n\nthen associativity\
    \ still works since: **(f ∘ g) ∘ h = f ∘ (g ∘ h)**\n\n![](img/d73681d801b4b826e0b2a293897bbba4_54_0.png)\n\
    \nThis means that those two Paths :\n\n```\nFunc<A, D> Path1<A, B, C, D>(Func<A,\
    \ B> f, Func<B, C> g, Func<C, D> h) =>\n    Compose(Compose(f, g), h);\n```\n\n\
    ```\nFunc<A, D> Path2<A, B, C, D>(Func<A, B> f, Func<B, C> g, Func<C, D> h) =>\n\
    \    Compose(f, Compose(g, h));\n```\n\nwill be equal for all inputs (unfortunately\
    \ we cannot express the **forall** quantification within the Type system). Furthermore,\
    \ `A Id<A>(A x) => x` is the identity element for the function composition `∘`:\n\
    \n**(f ∘ id) = f**\n\nOr in code:\n\n```\nFunc<A, B> Refl<A, B>(Func<A, B> f)\
    \ => Compose<A, B, B>(f, Id<B>);\n```\n\nThis would be equal with the function\
    \ **f forall** inputs for **f**. In this way, the composition is a monoid `(x\
    \ => x, ∘)` over the `Func<,>`.\n\n# Sidenote:\n\nBecause of the monoidal nature\
    \ of composition, we can extend the definition that takes only two functions on\
    \ any number of functions by just keep applying the composition. For example,\
    \ for four functions would be `compose(h)(compose(g)(compose(g)(k)))`, given that\
    \ their types are appropriate."
  merge: -1
  img_proc: true
- pgno: 55
  md: "# 2.5 Composing monoids\n\nMonoids can also be composed in various ways and\
    \ give more monoids. In this section, we will see three such examples of composition.\
    \ Our first monoidal composition is the one that is formed by functions that have\
    \ the same type signature:\n\n(A→B) ⊗ (A→B) → (A→B)\n\n[Note: this is different\
    \ from functional composition where we have the composition operation (A→B) o\
    \ (B→C) → (A→C)]\n\nLet me illustrate how this monoid arises in a practical way.\
    \ Let us say for example we have this discount function (double price) => 0.1\
    \ * price that type of this function is double →double we can define a higher\
    \ order function ComposeDiscounts that compose two functions of this type:\n\n\
    ```\nFunc<double, double> basicDiscount = (double price) => 0.1 * price;\nFunc<double,\
    \ double> repeatCustomerDiscount = (double price) => 0.2 * price;\n```\n\n```\n\
    Func<double, double> ComposeDiscounts(Func<double, double> firstDiscount,\n  \
    \  Func<double, double> secondDiscount) =>\n    (double price) => firstDiscount(price)\
    \ + secondDiscount(price);\n```\n\nMonoid over the double\n\nIn this way by using\
    \ the + monoid operation over the double type, we have created a function ComposeDiscounts\
    \ which is a monoid over the Func<double, double>\n\n```\nFunc<double, double>\
    \ GetFinalPrice(Func<double, double> discount) =>\n    (double price) => price\
    \ - discount(price);\n```\n\n```\nvar basicAndRepeatedDiscount = ComposeDiscounts(basicDiscount,\
    \ repeatCustomerDiscount);\n```\n\n```\nvar finalPrice = GetFinalPrice(basicAndRepeatedDiscount)(100);\n\
    ```"
  merge: -1
