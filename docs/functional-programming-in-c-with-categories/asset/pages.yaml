  md: "```\npublic Expr<T> X { get; }\npublic Expr<T> Y { get; }\n}\n\npublic class\
    \ SubExpr<T> : Expr<T>\n{\n\tpublic SubExpr(Expr<T> x, Expr<T> y) { X = x; Y =\
    \ y; }\n\tpublic Expr<T> X { get; }\n\tpublic Expr<T> Y { get; }\n}\n```\n\nWe\
    \ want to create a function eval that will evaluate an expression Exp formed by\
    \ combinations of (Val, Add, Sub). The type of eval would be in this case:\n\n\
    ```\nEval : (u:Expr, env:Env)→result:Int\n```\n\nEval should take an expression\
    \ u:Expr and a context (env) and return a result of type result:Int. In our example\
    \ the context will be empty for simplicity, but we will not omit it in the code.\n\
    \n# 7.3.1 Standard Catamorphism implementation\n\n```\npublic abstract class Expr<T>\n\
    {\n\tpublic abstract T1 MatchWith<T1>(((Func<Expr<T>, Expr<T>, T1> add,\n\t\t\
    Func<Expr<T>, Expr<T>, T1> sub,\n\t\tFunc<T, T1> val) pattern);\n\tpublic class\
    \ ValExpr<T> : Expr<T>\n\t{\n\t\tpublic override T1 MatchWith<T1>(((Func<Expr<T>,\
    \ Expr<T>, T1> add,\n\t\t\tFunc<Expr<T>, Expr<T>, T1> sub,\n\t\t\tFunc<T, T1>\
    \ val) pattern) => pattern.val(X);\n\t}\n\tpublic class AddExpr<T> : Expr<T>\n\
    \t{\n\t\tpublic override T1 MatchWith<T1>(\n\t\t\t(Func<Expr<T>, Expr<T>, T1>\
    \ add,\n\t\t\t\tFunc<Expr<T>, Expr<T>, T1> sub,\n\t\t\t\tFunc<T, T1> val) pattern)\
    \ => pattern.add(X, Y);\n\t}\n\tpublic class SubExpr<T> : Expr<T>\n\t{\n\t\tpublic\
    \ override T1 MatchWith<T1>((Func<Expr<T>, Expr<T>, T1> add,\n\t\t\t\tFunc<Expr<T>,\
    \ Expr<T>, T1> sub,\n\t\t\t\tFunc<T, T1> val) pattern) => pattern.sub(X, Y);\n\
    \t}\n}\n```"
