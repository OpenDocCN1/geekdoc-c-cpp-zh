    Γ, x:A ⊢ .... (the context is comprised by the assumptions that are placed left
    of the ⊢ ) we produce a term M:B and thus we infer that in the Typing context
    without the x:A, we can infer a lambda Term λx:A.M : A →B]


    # Elimination Rule


    The elimination rule for the lambda is equivalent to the very famous modus ponens
    in logic


    M : A → B   N : A

    ------------------- ⇒ E

    (MN) : B


    This says you can use the application (M N) only with two terms that have this
    specific kind of types A →B and A and this will yield a new term (M N) of type
    B .


    Of course, this does not explain how exactly that would happen, and for this reason
    we need the last type of set of rules the Computation rules.


    # Computation Rules


    The computation rule for the Application is just what is called β-reduction


    (λx:A. M)(a ) → M[a/x]


    The M[a/x] is the representation of substitution in type theory and it means wherever
    we find the variable x inside M we should replace it with a.


    This is the standard notion of executing a function if we have the following f


    ```

    Func<int, int> f = (int x) => x + 2;

    ```


    And we want to compute the f(2) we replace x with 2 inside f.


    That was a presentation of the Simply typed lambda calculus system.


    Now in order to use the integer types, formally one should declare how they behave
    by declaring the formation, introduction, elimination, and computation rules [we
    would have to introduce Gödel’s System T (which we briefly see in the Recursion
    section)]. But here we will just provide a mix of typing rules and operational
    semantics in order to make it work with the λ→


