    \    Some<Client>(var client) => client.Name,\n    _ => throw new NotImplementedException(),\n\
    };\n```\n```\n\nOr by using native pattern matching\n\n```\n```csharp\nvar repository\
    \ = new MockClientRepository();\nvar result = repository.\n```\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_138_0.png)\n\
    \n> SideNote:\n> You can run a simple ASP.NET MVC Maybe Functor Example .NET Fiddle.\
    \ Also you can download the Practical-Functional-CSharp project from Github and\
    \ run WebApplicationExample.sln in the from the WebApplicationExample folder.\n\
    \n# 4.10.5 Maybe in Language-ext / Option\n\nThe usual name for this functor F=1+X\
    \ (disjoint union with a base point) in most functional languages is called Maybe\
    \ but in Language-ext is called Option which is another common naming for Maybe\
    \ that comes closer to the OOP paradigm. Lets say that Maybe is the name of the\
    \ concept and Option the implementation. It is the same thing. For the rest of\
    \ this book we will use language-ext Option monad in our code examples."
