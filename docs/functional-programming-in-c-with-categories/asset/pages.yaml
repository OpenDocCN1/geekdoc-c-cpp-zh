- pgno: 44
  md: "```\nprice - discount * price;\n```\n\nthe equivalent curried function would\
    \ look like this:\n\n```\nFunc<double, Func< double, double>> discountedPrice\
    \ = (discount) => (price) =>\n    price - discount * price;\n```\n\nIf we wanted\
    \ to use the un-curried function with an array of prices, using a given discount\
    \ normally one would write:\n\n```\nvar discountedPrices = new List<double> {\
    \ 10, 20, 30 }\n    .Select(x =>discountedPrice(0.1, x));\n```\n\nhere is the\
    \ curried version:\n\n```\nvar discountedPrices1 =new List<double>{ 10, 20, 30\
    \ }\n    .Select(discountedPriceCurried(0.1));\n```\n\nThe difference here is\
    \ that in the second case, we do not have the .Select(x => because there is no\
    \ need to refer to the array object explicitly. For this reason, the first style\
    \ of writing is called pointed and the second one point free.\n\nAfter we fixed\
    \ an argument to a specific discount 0.1 we got a specialized function:\n\n```\n\
    var discountedPricePartial = x => discountedPrice(0.1, x);\n```\n\nthis process\
    \ of reducing the arguments of a function it is called partial application, (or\
    \ sometimes we might refer to this process as a specialization) and is usually\
    \ mentioned alongside with currying, because after currying a function, we can\
    \ get a partial application on the fly like this :\n\n```\nCurry(discountedPrice)(0.1)\n\
    ```\n\n# Partial Application\n\nPartial application is a very simple concept to\
    \ understand. Lets say we have a two-argument function:\n\n```\nR F<A, B, R>(A\
    \ a, B b) => default(R);\n```\n\nWe can create a new function:\n\n```\nR G<B,\
    \ R>(B b) => F<A, B, R>(x1, b);\n```\n\nThat takes a single argument by providing\
    \ some default value x1 for the A argument.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_44_0.png)"
  merge: -1
  img_proc: true
- pgno: 45
  md: 'As a simple example consider the predicate, that tests if two integers are
    equal:


    ```

    bool areEqual(int a, int b = 0) => a == b;

    ```


    we can create a range of specialized predicates by partial applying on any of
    the arguments:


    ```

    bool isZero(int a) => areEqual(a, 0);

    ```


    ```

    bool isOne(int a) => areEqual(a, 1);

    ```


    ![](img/d73681d801b4b826e0b2a293897bbba4_45_0.png)


    obviously, we can partially apply values to more than one argument (or even all
    of them )


    ![](img/d73681d801b4b826e0b2a293897bbba4_45_1.png)


    currying always leaves the function at hand in the same syntactical state of x=>y=>z=>...
    every time we use **compose** or **partially apply** a value, we consume an arrow
    (=>), but the result maintained the same syntactical form; y=>z=>... thus promoting
    uniformity. This is idempotent design in practice. The downside is that the order
    of arguments becomes now important, and simple reorder refactoring of arguments
    might have side effects.'
  merge: -1
  img_proc: true
