  md: "# 5.2 The List Monad\n\nIf we have a list of integers and try to get a list\
    \ of the squares, cubes and quads, we might try to go about it by using map:\n\
    \n```\nvar a = new[] { 2,3 }.Select(x => new[] { x * x, x * x * x , x * x * x\
    \ *x});\n```\n\nthis would create a list-in-a-list var list = [[4,8,16], [9,27,91]]\n\
    \nIt would be great if there was a way to just get the union of those sub-list\
    \ elements. Well that’s exactly the purpose of the list as a monad throught the\
    \ use of SelectMany.\n\n```\nvar b = new[] { 2,3 }.SelectMany(x => new[] { x *\
    \ x, x * x * x , x * x * x *x});\n```\n\nLet’s revisit one by one the operations\
    \ of a monad specifically for the list.\n\n+   1. η :c → T(c) represents the array\
    \ construction by the element new[] { _ }. If we apply list constructor once more\
    \ we get a list in a list [ [ ] ]\n\n+   2. μ:T(T(c))→ T(c) is the join operation\
    \ that reverses the one level of containment that was added and gives us the T(c)\
    \ again [ ]\n+   new[] { new[] { _ } }.SelectMany(x=>x) = new[] { _ }\n\n# 5.3\
    \ The Identity Monad\n\nIdentity Monad is the simplest form of a monad.\n\n```\n\
    public class Id<T>\n{\n    public T Value { get; set; }\n    public Id(T value)\
    \ => Value = value;\n    public Id<T1> Map<T1>(Func<T, T1> f) => new Id<T1>(f(Value));\n\
    \    public Id<T1> Bind<T1>(Func<T, Id<T1>> f) => f(Value);\n}\n```\n\nIt does\
    \ not do much. It doesn’t have any computational value. The new thing with the\
    \ Identity Monad is the bind method as we already saw:\n\n```\nId<T1> Bind<T1>(Func<T,\
    \ Id<T1>> f) => f(Value)\n```\n\n```\nvar result = new Id<int>(2)\n    .Bind(x\
    \ => new Id<int>(2)\n        .Bind(y => new Id<int>(x + y)));\n```"
