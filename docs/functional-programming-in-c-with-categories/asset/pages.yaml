  md: "Config. With the reader we can do computations on the expression Lazily without\
    \ having the Config yet:\n\n```\npublic class Config\n{\n    public string Name\
    \ { get; set; }\n}\n```\n\n```\nvar getName = new Reader<Config, string>(environment\
    \ => environment.Name).\n    Map(name => $\"Name: {name }\").\n    Run(new Config\
    \ { Name = \"Sql\" });\n```\n\nthe map here takes a function (a → b) and then\
    \ lifts the initial reader that contains an a (((→) e) a) to a reader that contains\
    \ a b (((→) e) b)\n\nmap: (a → b) → (((→) e) a) → (((→) e) b)\n\nthe implementation\
    \ is more convoluted but again follows the lines of Task<T> and IO\n\n+   1. First,\
    \ we evaluate the inner reader Fn(env) (so in a way unwraps the contained value)\n\
    +   2. Applying the function f: f(Fn(env))\n+   3. wraps the resulting value again\
    \ into a new new Reader((env) => f(Fn(env)))\n\n![](img/d73681d801b4b826e0b2a293897bbba4_130_0.png)\n\
    \n# 4.9 LINQ Native Query syntax: Functor Support\n\nDid you know that if you\
    \ implement a Select method in any type you can use the from ... in ... select\
    \ Linq syntax???\n\nHere I will rename the Map() method of our Id<T> to Select()\n\
    \n```\npublic class Id<T>\n{\n    public T Value { get; set; }\n```"
