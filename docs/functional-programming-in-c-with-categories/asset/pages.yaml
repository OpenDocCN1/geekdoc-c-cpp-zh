    \ directly from the outside environment.\n\nOf course, we can just remove the\
    \ setter all together and every time create a new updated product. Thus, make\
    \ the Product immutable.\n\n```\npublic class Product\n{\n    public double Price\
    \ { get; }\n    public Product(double price)\n    {\n        Price = price;\n\
    \    }\n    public Product GetDiscountedProduct(double discount)\n    {\n    \
