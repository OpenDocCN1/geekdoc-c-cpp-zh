- pgno: 68
  md: '# Monoid Homomorhism


    Category Theory


    Monoid Homomorphism is a thing of beauty and a profound concept, that can be found
    everywhere in mathematics, logic, and programming. It captures the idea of Preserving
    the Structure when we map something from one monoid structure to another. The
    word homomorphism comes from the ancient Greek language: ὁμός (homos) meaning
    "same" and μορφή (morphe) meaning "form" or "shape".


    A monoid homomorphism between two monoids (⊗, M) and (⊙, N), is a function :


    φ: M → N


    Such that:


    φ(a₁ ⊗ a₂)=φ(a₁) ⊙ φ(a₂)


    φ(1ₘ)=1ₙ


    where 1ₘ and 1ₙ are the identities of N and M aka our monoid empties.


    ![](img/d73681d801b4b826e0b2a293897bbba4_68_0.png)


    This means that if we map the a₁ ,a₂ and a₁ ⊗ a₂ to the φ(a₁), φ(a₂) and φ(a₁
    ⊗ a₂) then the φ(a₁) ⊙ φ(a₂) multiplication with the second monoid ⊙ should be
    exactly equal to φ(a₁ ⊗ a₂). The structure should be preserved.


    Also the φ maps the identity element of the M monoid 1ₘ to the identity element
    of the N monoid.


    ![](img/d73681d801b4b826e0b2a293897bbba4_68_1.png)


    Let us see another example:'
