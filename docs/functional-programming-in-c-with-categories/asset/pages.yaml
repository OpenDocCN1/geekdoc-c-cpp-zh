- pgno: 213
  md: "# 7.1 Traversable Algebraic data structures\n\nLet us now define traverse for\
    \ Algebraic data structures, taking as an example again the simple Tree.\n\n```\n\
    tree (a)= leaf(a) + node(tree(a), a, tree (a))\n```\n\nThis Is again a inductive\
    \ definition. The symbolic definition would be\n\n```\ntraverse (f, leaf(a)) =\
    \ leaf (f(a))\n```\n\n```\ntraverse (f, node(l, x, r)) = { (node) traverse (f,\
    \ r) f(x) traverse (f, l) }\n```\n\nthis translates to the following implementation.\n\
    \n```\npublic static Id<Tree<int>> Distribute(this Tree<Id<int>> @this) =>\n@this.MatchWith(algebra:\
    \ (\nLeaf: v => new Id<Func<int, Tree<int>>>(x => new Leaf<int>(x)).Ap(v),\nNode:\
    \ (l, r) => new Id<Func<Tree<int>, Func<int, Tree<int>>, Tree<int>>>( \n(x =>\
    \ y => new Node<int>(x, y))\n.Ap(1.Distribute())\n.Ap(r.Distribute())\n));\n);\n\
    ```\n\nUnfortunately, the need to write the Types explicitly makes C# code unreadable\
    \ pretty fast.\n\nIf we strip down the types, we get this :\n\n```\npublic static\
    \ Id<Tree> Distribute(this Tree<Id> @this) =>\n@this.MatchWith(algebra: {\nLeaf:\
    \ v => new Id(x => new Leaf<int>(x)).Ap(v),\nNode: (l, r) => new Id(x => y =>\
    \ new Node<int>(x, y))\n.Ap(1.Distribute())\n.Ap(r.Distribute())\n});\n\n```\n\
    \nThis is a bit tricky if you try to implement it for the first time. Here again\
    \ in the node we have the applicative operation { (node) _ _ } [Id(x => y => new\
    \ Node<int>(x, y)) ] where the node constructor new Node<int>(x, y) was curried,\
    \ in order to use applicative chaining. This is a repetitive theme. Take a moment\
    \ to compare this with the Array equivalent { (Concat) _ _ } and try to make sense\
    \ of the mechanics involved in this concept by yourself."
