- pgno: 230
  md: '# 8.2 A Functional Applications Architecture


    Where does the Functional Programming fit in the larger Architectural view? In
    the article form Scott Wlaschin “A primer on functional architecture” he recognizes
    three principles of functional programming that can be applied to the architectural
    level:


    +   1. The first is that **functions** are standalone values. In a functional
    architecture, the basic unit is also a function, but a much larger business-oriented
    one that I like to call a **workflow**

    +   2. Second, **composition** is the primary way to build systems. Two simple
    functions can be composed just by connecting the output of one to the input of
    another

    +   3. functional programmers try to use **pure functions** as much as possible


    The general idea is that you write as much of your application as possible in
    an FP style chain computation using the Task, Option, Either, Validation Monads
    or their combinations and avoiding side effects and coupling. This would lead
    to the usual pipeline computation style:


    ![](img/d73681d801b4b826e0b2a293897bbba4_230_0.png)


    Instead of the chaotic object oriented:


    ![](img/d73681d801b4b826e0b2a293897bbba4_230_1.png)


    The idea for a functional architecture as laid out by Wlaschin is a pipeline that
    goes through the layers of the Architecture with minimal coupling and side effects.'
