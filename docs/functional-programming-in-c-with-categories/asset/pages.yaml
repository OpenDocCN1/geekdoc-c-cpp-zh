- pgno: 210
  md: "```\nvar toArray = new Id<int>(4).Fold<List<int>>(new List<int>(), (e, a) =>\
    \ a.Concat(e.ToList()));\n\nvar multiply = new Id<int>(4).Fold<int>(1, (e, a)\
    \ => a * e);\n```\n\nAlternatively, if we had a simple Product structure, we can\
    \ provide a fold like this:\n\n```\nvar Pair = (a, b) => ({\n    map: f => pair(f(a),\
    \ f(b)),\n    fold: (accumulator, reducer) => reducer(reducer(accumulator, a),\
    \ b)\n});\n```\n\n```\nvar r = Pair(2,3).fold(0, (accumulator, currentValue) =>\
    \ accumulator + currentValue);\n```\n\nNotice that this is the same as the monoidal\
    \ folding idea in the monoids section.\n\nAlso you can see that if we add more\
    \ members to a product structure (a,b,c,d,...) then the fold would be something\
    \ like that :\n\n```\nfold: (accumulator, reducer) => reducer(reducer(reducer(reducer(accumulator,\
    \ a), b), c, d, ...)\n```\n\nwhich approximates the list definition of the fold,\
    \ because in essence, an arbitrary product (a,b,c,d,...) is a list. We can also\
    \ define folds for Either, IO and the Reader functors (we will skip this part\
    \ for now)\n\n# 7 Traversable\n\nI expect that you will find the Following section\
    \ to be a bit difficult. I know this because it took me a while to derive the\
    \ specific implementations from theory, since there are no similar examples in\
    \ C#. Non the less in other functional languages (like Haskell and Scala) the\
    \ concept of Traversables is considered pretty standard. Initially we will try\
    \ to derive some specialized cases of the List being traversed by an Id and then\
    \ generalize over this. After that we are going to reach Traversables from another\
    \ path: FoldMap. Hopefully by looking the same thing from two different perspectives\
    \ will allow you to recognize the pattern.\n\nLet’s say that we have a monoid\
    \ for example the Array ([], concat) and the Identity functor as an applicative.\
    \ We can use the applicative chaining to merge functors that contain arrays:\n\
    \n```\nnew Id<Func<List<int>, Func<List<int>, List<int>>>>(x => y => x.Concat(y))\n\
    \    .Ap(new Id<List<int>>((10, 5).ToList()))\n```"
