    \ This is the core idea of functional programming; to treat functions as data.\n\
    \n# 1.6 Simple Function Composition\n\nOne can argue that composing functions\
    \ is the most important idea in programming and functional programming in particular.\
    \ Functional composition is an instance of the concept of compositionality. Creating\
    \ systems by composing smaller systems that are easier to implement and design\
    \ can be found in all levels of programming. Staring from the Syntax of the language,\
    \ to Design patterns, architectural patterns, larger System design etc.\n\nIn\
    \ this section we are going to take a brief look at one of the most basic ones;\
    \ Function composition.\n\nIn mathematics, function composition is the application\
    \ of one function to the result of another to produce a third function. For instance,\
    \ the functions f : T→ R and g : R→ U can be composed to yield a function h: g(f(x))\
    \ with type T→ U we usually represent that as g ∘ f and we read that as “g after\
    \ f” the symbol ∘ usually represents “after”.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_28_0.png)\n\
