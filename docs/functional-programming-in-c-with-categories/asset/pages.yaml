  md: "# 4.6 Extending Task<T> to Functor\n\nIn the following sections, we will see\
    \ some examples of other popular Functors in C#. We will start by extending Task<T>,\
    \ by providing a Map method that obeys the functor laws and thus promote native\
    \ Task<T> into a functor.\n\nWe have said that the usual metaphor for a functor\
    \ is “a container.” A Task can be seen as a container that takes a value and wraps\
    \ it, until it is resolved. In order to promote Task<T> to Functor, there must\
    \ be a mapping function that would be able to lift any function and give a new\
    \ Task<T> with the lifted value.\n\nHere is one possible mapping function that\
    \ preserves structure:\n\n```\npublic static Task<T1> Map<T, T1>(this Task<T>\
    \ task, Func<T, T1> mapping)\n{\n    var value = task.GetAwaiter().GetResult();\n\
    \    return Task<T1>.Run(() => mapping(value));\n}\n```\n\n```\nTask<int>task2\
    \ = Task<int>.Run(() => 2).Map(x => x * x);\n```\n\nRun This: .Net Fiddle\n\n\
    The mapping function that lifts the function f: T → T1 It follows the steps:\n\
    \n+   4. Waits for the result of the Task (so in a way unwraps the contained value)\
    \ task.GetAwaiter().GetResult()\n+   5. Applying the function f : f(value)\n+\
    \   6. wraps the resulting value again into a new Task: Task<T1>.Run(() => f(value));\
    \ because when we implement a Map, we always return something of the same type\
    \ in order to belong to the same category (in this case type) or Promise.\n\n\
    Keep those steps in mind because they are common in the implementation of many\
    \ Functors and monads.\n\nSideNote : From now on we will write the Task<T> Map\
    \ Method in this way\n\n```\npublic static Task<T1> Select<T, T1>(this Task<T>\
    \ task, Func<T, T1> mapping)=>\n    task.ContinueWith(t => mapping(t.Result));\n\
    ```\n\nwhere we will utilize the ContinueWith do continue the task.\n\n> Something\
    \ worth pointing out here is the possibility of exception this part belongs to\
    \ the path of failure and ignores the f mapping (one could argue that if there\
    \ is an exception then this does not behave like a functor we will deal with this\
    \ issue when we talk about the Either functor) We are going to come back to this\
    \ observation many times throughout this book.\n\nWe can use our map function\
    \ now:"
