  md: "```\nh = reduce(•) • map(f)\n```\n\nreduce (•) here means the operation (e1•(e2•(e3\
    \ • e4))) folding the elements on a list. If there is a Homomorphism it should\
    \ be able to be decomposed in a map followed by a reduce.\n\nA Homomorphism in\
    \ a list means Parallelism. Let’s see another example.\n\nCounting words in a\
    \ large document is also something that can be done in parallel.\n\n+   1. We\
    \ can split the document in chunks and\n+   2. then count the words in each chunk\
    \ and add them in a dictionary.\n+   3. Then we can merge the dictionaries because\
    \ they form a monoid\n\nHere the monoid is the dictionary as a Dictionary. We\
    \ can prove that if we have a IDictionary<TKey, TValue> with keys of type TKey\
    \ and values of type TValue and TValue is a monoid then we can create a IDictionary\
    \ monoid:\n\n```\nvar dictionary1 = new Dictionary<string, int> {\n  { \"or\"\
    , 2 },\n  { \"and\", 3 },\n  { \"the\", 4 }\n};\n\nvar dictionary2 = new Dictionary<string,\
    \ int> {\n  { \"or\", 1 },\n  { \"and\", 5 },\n  { \"jim\", 1 },\n  { \"his\"\
    , 1 }\n};\n```\n\n```\nvar merged = new DictionaryMonoid<string, int>(new Sum()).Concat(dictionary1,\
    \ dictionary2);\n```\n\n```\npublic class DictionaryMonoid<TKey, TValue> : IMonoid<IDictionary<TKey,\
    \ TValue>>\n{\n\tprivate IMonoid<TValue> ValueMonoid { get; }\n\tpublic DictionaryMonoid(IMonoid<TValue>\
    \ monoid) => ValueMonoid = monoid;\n\tpublic IDictionary<TKey, TValue> Empty =>\
    \ new Dictionary<TKey, TValue>();\n}\n\npublic IDictionary<TKey, TValue> Concat(IDictionary<TKey,\
    \ TValue> x, IDictionary<TKey, TValue> y)\n{\n\tvar merge = y.ToDictionary(entry\
    \ => entry.Key, entry => entry.Value);\n\tforeach (var keyValue in x)\n\t\tif\
    \ (merge.ContainsKey(keyValue.Key))\n\t\t\tmerge[keyValue.Key] = ValueMonoid.Concat(merge[keyValue.Key],\
    \ keyValue.Value);\n\t\telse\n\t\t\tmerge[keyValue.Key] = keyValue.Value;\n\t\
    return merge;\n}\n```"
