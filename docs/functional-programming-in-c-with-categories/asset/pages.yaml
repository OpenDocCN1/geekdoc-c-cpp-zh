- pgno: 115
  md: '# 4.3 The Functor Laws


    Every data structure has not just a signature, but some expected behavior. For
    example, a Stack has a push and a pop operation that specify a Stack functionality,
    and we expect these operations to behave in a certain way:


    +   1. for all x, it holds that pop (push x empty) = empty - if the stack is empty
    then push something and then pop the last item the stack must remain empty.

    +   2. etc


    The laws for a given data structure usually follow from the specifications for
    its operations. Most of the constructions we are going to discuss in this book
    come with laws. Any functor must obey two laws when lifting the morphisms:


    +   1. F(idₓ) = id_F(x), This means that the functor preserves the Identity.

    +   The functor should map the id function x=>x correctly


    ![](img/d73681d801b4b826e0b2a293897bbba4_115_0.png)


    this simply means that Id(value).Map(x=>x) ≡ Id(value). Or in a Visual form:


    ![](img/d73681d801b4b826e0b2a293897bbba4_115_1.png)


    Who would expect that? This is so Obvious. This is a testament of the ability
    of mathematicians to complexify things.


    +   2. F(f∘g) = F(f) ∘ F(g) This means that the functor preserves the composition
    of functions.'
