- pgno: 132
  md: "# # 4.10 Maybe Functor aka Option<T>\n\n# ## 4.10.1 Dealing with null\n\n>\
    \ > \"...The absence of Sum types is what Tony Hoare called the **Billion Dollar\
    \ Mistake** ... all the superstitious nonsense about null is all about the failure\
    \ of language design, because they don't have Sum types. \"\n> \n> > – Robert\
    \ Harper\n> \n> > Oregon Programming Languages Summer School\n\nThe problem of\
    \ null or undefined is one of the biggest problems in computation theory. If we\
    \ want to write meaningful programs, we must accept the fact that some computations\
    \ might yield no result. The usual way object-oriented languages deal with this\
    \ is by checking the types for not being undefined in order to use them. Any developer\
    \ knows the number of bugs that have as source the problem of undefined.\n\nThe\
    \ classical solution is using conditionals everywhere to check for null.\n\n```\n\
    ```\nif (result) {\n  result.operation();\n} else {\n  //do nothing\n}\n```\n\
    ```\n\nThis reduces the cohesion of the codebase, because we must tightly couple\
    \ to code relating to the cross-cutting concern of null checking.\n\n# ## 4.10.2\
    \ The Null Object Design pattern\n\nA more elegant solution to the problem of\
    \ Null is the “Null Object” design pattern. The null object pattern is a special\
    \ case of the strategy design pattern. The idea here is to replace conditional\
    \ with strategy. Instead of setting something as null we can set it as NullObject.\
    \ Were the NullObject methods are empty, or they do not do anything when called.\
    \ NullObject is in fact designed in a way that if it is fed to any method that\
    \ waits for a RealObject, there should not be any unexpected side-effect, or any\
    \ exceptions thrown."
  merge: -1
  img_proc: true
- pgno: 133
  md: "![](img/d73681d801b4b826e0b2a293897bbba4_133_0.png)\n\nA simple implementation\
    \ of the `NullObject` design pattern with C# could be something like this:\n\n\
    ```\n```csharp\npublic abstract class AbstractObject<T>\n{\n    public abstract\
    \ void Operation();\n}\n\npublic class NullObject<T> : AbstractObject<T>\n{\n\
    \    public NullObject() { }\n    public override void Operation() {//Do nothing\
    \ here }\n}\n\npublic class RealObject<T> : AbstractObject<T>\n{\n    private\
    \ readonly T value;\n    public RealObject(T value) => this.value = value;//instructor\
    \ injection\n\n    public override void Operation()\n    {\n        // do something\
    \ with value\n        Console.WriteLine($\"{value}\");\n    }\n}\n```\n```\n\n\
    Run This: [.Net Fiddle](https://dotnetfiddle.net/)\n\nThis implementation is unobtrusive.\
    \ It should not affect the rest of the code and should remove the need to check\
    \ for null.\n\nThe major problem with this pattern is that for each object, we\
    \ need to create a nullObject with the operations that we are going to use inside\
    \ the rest of the code. **This will force us to duplicate all the domain objects\
    \ in our model. It is a big trade-off.** There is no easy way to abstract the\
    \ mechanics of this implementation in an object-oriented world, mainly because\
    \ we cannot have specific information about the operations that we want to isolate\
    \ and create a nullObject that provides those operations."
  merge: -1
  img_proc: true
- pgno: 134
  md: "# 4.10.3 The Functional equivalent - Maybe as Functor\n\nIn Functional programming,\
    \ we use the Maybe Type [sometimes also called Option] in order to represent the\
    \ possibility of something being null. The Maybe solves the null problem by moving\
    \ the mechanics of null checking inside a functor map. Thus, instead of applying\
    \ the objects on functions, we reverse the flow and apply the functions onto objects.\
    \ Now, we can isolate the effect inside a single point; the map.\n\nThe standard\
    \ implementation of the maybe/option Type is a hierarchy with a base class and\
    \ two sub-types: the Some and the None. The None represents the case of null\n\
    \n![](img/d73681d801b4b826e0b2a293897bbba4_134_0.png)\n\nAfter all this discussion,\
    \ hopefully, the implementation of maybe functor would be apparent\n\n```\npublic\
    \ abstract class Maybe<T>\n{\n    public abstract Maybe<T1> Map<T1>(Func<T, T1>\
    \ f);\n    public abstract TResult MatchWith<TResult>(\n        (Func<TResult>\
    \ None, Func<T, TResult> Some) pattern);\n}\n```\n\n```\npublic class None<T>:\
    \ Maybe<T>\n{\n    public override TResult MatchWith<TResult>(\n        (Func<TResult>\
    \ None, Func<T, TResult> Some) pattern) => pattern.None();\n\n    public override\
    \ Maybe<T1> Map<T1>(Func<T, T1> f) => new None<T1>();\n}\n```\n\n```\npublic class\
    \ Some<T> : Maybe<T>\n{\n    private readonly T value;\n    public Some(T value)\
    \ => this.value = value;\n\n    public override TResult MatchWith<TResult>(\n\
    \    (Func<TResult> None, Func<T, TResult> Some) pattern) => pattern.Some(value);\n\
    \n    public override Maybe<T1> Map<T1>(Func<T, T1> f) => new Some<T1>(f(value));\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: "![](img/d73681d801b4b826e0b2a293897bbba4_135_0.png)\n\nMaybe MatchWith implementation\
    \ for Maybe is straightforward. Since it is a hierarchy, we have to implement\
    \ for each subtype the MatchWith, and we are going to call different callbacks,\
    \ so we can distinguish (pattern match) between Some and None.\n\nAnd we can use\
    \ it like this:\n\n```\nvar result = new None<int>( )\n    .Map(v=> $\"number\
    \ is  : {v}\")\n    .MatchWith<string>(pattern: (\n        None: () => \"Not found\"\
    ,\n        Some: v => $\"Answer - {v}\"\n    ));\n```\n\n# 4.10.3.1 Using C# 8.\
    \ pattern matching\n\nWe will display both MatchWith and switch pattern matching\
    \ just for completeness. We can skip the custom definition by using the native\
    \ C# 8.0 pattern matching by defining\n\n```\npublic abstract class Maybe<T>\n\
    {\n    public Maybe<T1> Map<T1>(Func<T, T1> f) =>\n    this switch\n    {\n  \
    \      None<T> { } => new None<T1>(),\n        Some<T> { Value: var v } => new\
    \ Some<T1>(f(v)),\n    };\n}\n\npublic class None<T> : Maybe<T>\n{\n    public\
    \ None() { }\n}\n```"
