  md: "# 7.3.2 Reader applicative implementation\n\nThe idea here is to create a reader\
    \ Applicative which will traverse each expression, apply the context and accumulate\
    \ the result. I rewrite here the applicative reader, just to look at it again.\n\
    \n```\npublic static Reader<Env, T1> App<Env, T, T1>\n    (this Reader<Env, Func<T,\
    \ T1>> @this, Reader<Env, T> fa) =>\nnew Reader<Env, T1>(env => { return @this.Map(f\
    \ => fa.Map(f).Run(env)).Run(env);\n});\n```\n\n```\nvar res = Reader(g=>x=>g.x2+x).ap(Reader(g\
    \ => g.x1));\n```\n\n```\nvar r =res.run({x1:10,x2:20});//30\n```\n\nbelow is\
    \ my implementation, try to play around with the fiddle\n\n```\npublic static\
    \ int Eval(this Expr<int> @this)\n    => @this.MatchWith(pattern: (\n        add:\
    \ (x, y) =>\n\nnew Reader<object, Func<int, Func<int, int>>>(g => x1 => y1 =>\
    \ x1 + y1)\n        .App(new Reader<object, int>(g => x.Eval()))\n        .App(new\
    \ Reader<object, int>(g => y.Eval()))\n        .Run(default),\n        val: v\
    \ => v));\n```\n\n```\nvar expression = new AddExpr<int>(new AddExpr<int>(new\
    \ ValExpr<int>(2), new ValExpr<int>(2)), new ValExpr<int>(2));\n    var result\
    \ = expression.Eval();\n```\n\nThe algebra of eval using our applicative notation\
    \ ⟨ ⟩ is\n\n```\neval::(Expr u) → Env v → b\n\neval (Val(i), g)  = ⟨ i ⟩\neval\
    \ (Add(x, y),g) = ⟨ (+) eval (x, g) eval (y, g)⟩\n```"
