- pgno: 180
  md: "We can use the Either for validation. For example, we can chain validation\
    \ functions that when are not validated return a Left with the appropriate validation\
    \ error. For example, let us say that we have an isDigit function that checks\
    \ if a given input string consists of digits only:\n\n```\nEither<TestError, string>\
    \ isDigit(string str) =>\n    str.ForAll(Char.IsDigit)\n    ? Right<TestError,\
    \ string>(str)\n    : Left<TestError, string>(new TestError(\"must be a valid\
    \ number\"));\n```\n\nWe can also have a function that checks for the maximum\
    \ length of a string (notice that this is a curried function)\n\n```\nFunc<string,\
    \ Either<TestError, string>> maxStrLength(int maxlenght) => str =>\n    str.Length\
    \ < maxlenght\n    ? Right<TestError, string>(str)\n    : Left<TestError, string>(new\
    \ TestError(\"failed max length\"));\n```\n\nThen could chain those two validations,\
    \ making sure that a string input satisfies both validations:\n\n```\nvar res\
    \ = maxStrLength(3)(\"abcd\").Bind(s => isDigit(s));\n```\n\n```\nres.Match(\n\
    \    Right: _ =>\n    {\n        Console.WriteLine(\"no errors\");\n    },\n \
    \   Left: error =>\n    {\n        Console.WriteLine(error);\n    });\n```\n\n\
    Run This: .Net Fiddle\n\nThe problem with the use of either for validation is\
    \ that we cannot accumulate errors from each validation, instead the composite\
    \ validation fails at the first unsuccessful validation and returns the error\
    \ of this validation.\n\nTo accumulate errors, we must use the Validation Type\
    \ from the Language-ext library.\n\n# 5.6 Validation Monad\n\nIn this this section\
    \ we are going to take a brief look at the validation type. The Validation behaves\
    \ like the Either but also has an operation to accumulate validation erros."
