- pgno: 57
  md: "This idea is in the core of the famous Composite and Decorator [also interpreter]\
    \ design patterns from the Gang of Four design patterns.\n\nImmediately you can\
    \ see that if we had a List of Discounts (Func<double, double>) we could use ComposeDiscounts\
    \ in order to Fold them into a single discount delegate:\n\n```\nFunc<double,\
    \ double> ComposeAll(List<Func<double, double>> @discounts) =>\n    @discounts.Aggregate(\n\
    \        (x) => 0,\n        (totalDiscount, current) => ComposeDiscounts(totalDiscount,\
    \ current)\n    );\n```\n\nMonoid on the discounts\n\nFirst let us rewrite the\
    \ above in its full Object-Oriented syntax :\n\n```\npublic interface IDiscount\
    \ {\n    double GetDiscountedAmount(double price);\n}\n```\n\n```\npublic class\
    \ BasicDiscount : IDiscount\n{\n    private readonly double discount;\n    public\
    \ BasicDiscount(double discount) => this.discount = discount;\n    public double\
    \ GetDiscountedAmount(double price) => discount * price;\n}\n```\n\n```\npublic\
    \ class ComposeDiscounts : IDiscount\n{\n    private readonly IDiscount firstDiscount;\n\
    \    private readonly IDiscount secondDiscount;\n\n    public ComposeDiscounts(\n\
    \        IDiscount firstDiscount,\n        IDiscount secondDiscount)\n    {\n\
    \        this.firstDiscount = firstDiscount;\n        this.secondDiscount = secondDiscount;\n\
    \    }\n    public double GetDiscountedAmount(double price) =>\n        firstDiscount.GetDiscountedAmount(price)\
    \ +\n        secondDiscount.GetDiscountedAmount(price);\n}\n```\n\nMonoid on the\
    \ discounts\n\nHere the GetDiscountedAmount is the equivalent of the anonymous\
    \ Func<double, double>."
