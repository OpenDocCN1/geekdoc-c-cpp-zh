- pgno: 208
  md: "```\nnew Leaf<T>(@this.FirstOrDefault()) :\nnew Node<T>(@this.GetRange(0, lenght\
    \ / 2).ToTree(),\n@this.GetRange(lenght / 2, (int)Math.Ceiling((decimal)lenght\
    \ / 2)))\n.ToTree()\n);\n```\n\n```\nnew List<int> { 1, 2, 10, 6, 20, 11, 2, 3,\
    \ 4 }.ToTree() → (( (1,2), (10,6) ), ( (20,11), (2,(3,4)) ))\n```\n\n# 2) Folding\
    \ the tree while preserving the order\n\nHere there are two steps. Let's say that\
    \ we have as an inductive hypothesis a function zipOrdered that when given two\
    \ ordered lists this gives us the zipped list preserving the ordering. We will\
    \ define zipOrdered later. For now, we can assume that we have already defined\
    \ it. Now we can define a recursive sort function on the Tree using pattern matching\
    \ with cata:\n\n```\npublic static List<T> Sort<T>(this Tree<T> @this) where T\
    \ : IComparable =>\n@this.MatchWith(algebra: (\nLeaf: v => v.ToList(),\nNode:\
    \ (l, r) => l.Sort().ZipOrdered(r.Sort())\n));\n\n```\n\nThis says if we are in\
    \ Leaf just return the value v which is ordered because its single. Now for the\
    \ Node we first recursively use sort to get the sorted lists (1.sort(), r.sort())\
    \ and then we zip them using zipOrdered.\n\n```\npublic static List<T> ZipOrdered<T>(this\
    \ List<T> @this, List<T> @a2)\nwhere T : IComparable\n=>\n@this.MatchWith(algebra:\
    \ (\nEmpty: () => @a2,\nCons: (x, xs) =>\n@a2.MatchWith(algebra: (\nEmpty: ()\
    \ => xs,\nCons: (y, ys) => (x.CompareTo(y) > 0) ?\n x.ToList().Concat(xs.ZipOrdered((y,\
    \ ys)).ToList())\n : y.ToList().Concat(ys.ZipOrdered((x, xs)).ToList())\n)))\n\
    ));\n\n```\n\nThis definition is the same as the zip definition but also uses\
    \ a comparison at the node level in order to decide which array has the next element\
    \ in order."
