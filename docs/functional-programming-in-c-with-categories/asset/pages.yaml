    \ @this, (Func<T1> Empty, Func<T, List<T>, T1> Cons) pattern) =>\n        (@this.Count\
    \ == 0) ?\n            pattern.Empty() :\n            pattern.Cons(@this[0], @this.GetRange(1,\
    \ @this.Count - 1));\n```\n\nThis definition will allow us to use pattern matching\
    \ syntax for List<T> types:\n\n```\npublic static int Multiply(this List<int>\
    \ @this) =>\n    @this.MatchWith(\n        pattern: (\n            Empty: () =>\
    \ 1,\n            Cons: (v, r) => v * r.Multiply()\n        ));\n```\n\nIn functional\
    \ languages is quite common to write definitions by simply pattern matching. Look\
