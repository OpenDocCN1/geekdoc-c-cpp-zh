- pgno: 131
  md: "```\npublic Id(T value) => Value = value;\npublic Id<T1> Select<T1>(Func<T,\
    \ T1> f) => new Id<T1>(f(Value));\n}\n```\n\nThis will allow the compiler to recognize\
    \ as valid the following from_in _select statement:\n\n```\nvar r = from x in\
    \ new Id<int>(5) select x + 3;\n```\n\n```\nr.MatchWith(Console.WriteLine);\n\
    ```\n\nThe result of the select is the one that comes from Id<T1> Select<T1>(Func<T,\
    \ T1> f) there is no need to be of The same type in our example Id<T1>. We could\
    \ for example define a select method that looks like the following:\n\n```\npublic\
    \ T1 Select<T1>(Func<T, T1> f) => (f(Value));\n```\n\nThe Id<T> does not qualify\
    \ anymore as a functor but the Linq statement compiles just fine. The only requirement\
    \ is that the argument is of the form (Func<T, T1> f) and the name of the method\
    \ to be Select.\n\nIn the same way if we rename the Task .Map() to Select() then\
    \ we get a compiler support\n\n```\npublic static Task<T1> Select<T, T1>(this\
    \ Task<T> task, Func<T, T1> f)\n=> task.ContinueWith(t => f(t.Result));\n```\n\
    \nThis allows us to write Linq on Tasks\n\n```\nvar repository = new MockClientRepository();\n\
    ```\n\n```\nvar clientName = await (from client in repository.GetById(4)\n   \
    \ select client != null ? client.Name : \"Nothing found\");\n```\n\n# Conventions:\
    \ Map and Select\n\nAs a convention we will name our mapping method Map nonetheless\
    \ in some instances we might also use Select if we need LINQ support. Map and\
    \ Select will be used interchangeably in this book. In the Real world in any proper\
    \ Functional library there should be a Select method as a name alias for Map."
