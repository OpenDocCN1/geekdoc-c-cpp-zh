  md: "suppose that we have a co-algebra g: □ → [[□ Δ] Δ] and an algebra h: [[● Δ]\
    \ → ● the process starts with the g replacing squares □ with pairs of [[□ Δ] Δ]\
    \ □ → [[□ Δ] Δ] → [[□ Δ] Δ] Δ] →... at some point when a condition is reached,\
    \ we replace the most inner square □ with a ● this starts the collapsing(catamorphism)\n\
    \n![](img/d73681d801b4b826e0b2a293897bbba4_207_0.png)\n\n# 6.5.6 Hylomorphism\
    \ example: Mergesort\n\n> \"In any change, there must be three things:\n> (1)\
    \ something which underlies and persists through the change;\n> (2) a “lack”,\
    \ which is one of a pair of opposites, the other of which is\n> (3) a form acquired\
    \ during the course of the change\"\n> Aristoteles -Physics »\n\nIn this section\
    \ we will see a functional approach on mergesorting an array using hylomorphism\
    \ (you can see in the Wikipedia page how ugly the imperative code can become when\
    \ we try to solve problems that are use divide and conquer in which functional\
    \ style excels). First, we will transform an array to a binary tree using an anamorphisms,\
    \ then we will gradually fold the leaves of the tree while preserving a property\
    \ of ordering using a catamorphism.\n\n\n\nWe recursively break the array in half\
    \ until we reach single elements that we are going to use a leave to wrap them\
    \ and Nodes to compose bottom up.\n\n```\npublic static Tree<T> ToTree<T>(this\
    \ List<T> @this)\n{\n    var length = @this.Length();\n    return length == 1\
    \ ? (Tree<T>)\n\n```"
