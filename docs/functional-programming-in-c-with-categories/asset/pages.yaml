    {\n    public class Demo\n    {\n        public void Run()\n        {\n      \
    \      WriteLine(\"message\");\n        }\n    }\n}\n```\n\nIn functional programming\
    \ (and in language-ext) library we can use this to provide factory methods and\
    \ avoid using the `new` keyword. For example, imagine that we have this class:\n\
    \n```\npublic class IO<T>\n{\n    public Func<T> Fn { get; set; }\n    public\
    \ IO(Func<T> fn) => Fn = fn;\n    public T Run() => Fn();\n}\n```\n\nInstead of\
    \ writing:\n\n```\nvar t = new IO(() => 1);\n```\n\nWe can define a class with\
    \ a static method that creates `new IO()`\n\n```\npublic class Factories\n{\n\
    \    public static IO<T> IO<T>(Func<T> fn) => new IO<T>(fn);\n```"
