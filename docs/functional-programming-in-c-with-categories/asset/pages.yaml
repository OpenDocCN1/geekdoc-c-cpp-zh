  md: '# 5.3.1 Optional Monad laws for Identity Monad


    A monad has 3 straightforward laws, which are:


    +   1. Left identity, applying the unit function to a value and then binding the
    resulting monad to a function f is the same as calling f on the same value.

    +   2. Right identity, binding the unit function to a monad doesn’t change the
    monad

    +   3. Associativity, if we have a chain of monadic function applications, it
    doesn’t matter how they are nested: m.bind(f).bind(g) == m.bind(x => f(x).bind(g));


    ```

    Func<int, Id<int>> f = x => new Id<int>(x + 2);

    var m1 = new Id<int>(5).Bind(f);

    var m2 = f(5);

    ```


    ```

    var value = 5;

    var m1 = new Id<int>(value).Bind(x => new Id<int>(x));

    var m2 = new Id<int>(value);

    ```


    ```

    Func<int, Id<int>> f = x => new Id<int>(x + 2);

    Func<int, Id<int>> g = x => new Id<int>(x * x);

    var value = 5;


    var m1 = new Id<int>(value).Bind(f).Bind(g);

    var m2 = new Id<int>(value).Bind(x => f(x).Bind(g));

    ```


    ![](img/d73681d801b4b826e0b2a293897bbba4_171_0.png)


    ![](img/d73681d801b4b826e0b2a293897bbba4_171_1.png)


    Both left and right identity guarantee that applying a monad to a value will just
    wrap it: the value won’t change, nor the monad will be altered. The last law guarantees
    that monadic composition is associative. All laws together make code more resilient,
    preventing counter-'
