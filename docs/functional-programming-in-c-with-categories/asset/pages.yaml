  md: "# C# Functional Features\n\nAn overview\n\n> \"1996 - James Gosling invents\
    \ Java. Java is a relatively verbose, garbage collected, class based, statically\
    \ typed, single dispatch, object oriented language with single implementation\
    \ inheritance and multiple interface inheritance. Sun loudly heralds Java's novelty.\n\
    > \n> 2001 - Anders Hejlsberg invents C#. C# is a relatively verbose, garbage\
    \ collected, class based, statically typed, single dispatch, object oriented language\
    \ with single implementation inheritance and multiple interface inheritance. Microsoft\
    \ loudly heralds C#'s novelty.\"\n> -Brief, Incomplete and Mostly Wrong History\
    \ of Programming Languages,\n\n# 1 Language Functional support\n\n# 1.1 Pure functions\
    \ and Side effects\n\nNo matter the programming paradigm the minimal unit of processing\
    \ is a function a→b. There would not be any motion if a value could not be transformed\
    \ into another value. In Object oriented programming we call them methods. the\
    \ most important thing about a function is its Type signature. A type signature\
    \ or type annotation defines the inputs and outputs for a function, subroutine\
    \ or method. In Object oriented programming we do not think about the function\
    \ types that much, whilst in functional programming the function types are the\
    \ main focus.\n\nLook for example, the following function:\n\n```\npublic double\
    \ GetDiscountedPrice(double price, double discount)\n{\n    return price * (1\
    \ - discount);\n}\n```\n\nThis function has a signature like this GetDiscountedPrice:\
    \ (double, double) → double. This is almost a perfect function. First, it's called\
    \ total because no matter what value you input for the price and discount it will\
    \ yield a result. Does not throw exceptions or return null. If only all functions\
    \ where like this one. Also, its Pure because it does not access any outside"
  merge: -1
  img_proc: true
- pgno: 9
  md: "variable or modifies in any way the computational environment (this means that\
    \ has **no side effects**)\n\nIn object-oriented programming the importance of\
    \ the Type signature is diminished by the fact that there is so much coupling\
    \ going on. Let me explain. Look at the following object:\n\n```\npublic class\
    \ Product\n{\n    public double Price { get; set; }\n    public Product(double\
    \ price)\n    {\n        Price = price;\n    }\n    public void AddDiscount(double\
    \ discount)\n    {\n        this.Price = this.Price * (1 - discount);\n    }\n\
    }\n```\n\nNow we placed the previous function in an object. What is the type signature\
    \ of the AddDiscount method? is it double→( ) ? It Sure, looks like that it just\
    \ takes a double and returns nothing. So why not. Well almost. The fact is that\
    \ the function **access in a hidden manner** the this.Price so this counts as\
    \ an additional input argument (double, double)→(). There is no return output\
    \ that is suspicious. Because also access the this.Price of the Product and mutate\
    \ its state.\n\n![](img/d73681d801b4b826e0b2a293897bbba4_9_0.png)\n\nSide effects\
    \ are operations that **change the global state of a computation**. Formally,\
    \ all assignments and all input/output operations are considered side-effects.\
    \ **The functional programming style tries to avoid /reduce side effects.**"
  merge: -1
  img_proc: true
