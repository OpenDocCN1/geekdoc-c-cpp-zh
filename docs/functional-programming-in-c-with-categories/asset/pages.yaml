- pgno: 15
  md: '# Action<T>


    The Action<T> Functional interface represents functions that have this signature
    void f(T t). In functional programming we usually do not like the void because
    it is not a Type like all the others, and this forces us to treat it differently.
    Action<T> is just a Func<T, void> but because void is not a Type .NET had to invent
    Action<T>. As an example of usage look at the following, where we “consume” a
    string returning nothing:


    ```

    Action<string> print = (string x) => Console.WriteLine(x);

    ```


    When you return void is an indication that you create a side effect of some sort.
    We can shorten the declaration, using the point free notation :


    ```

    Action<string> print1 = Console.Write;

    ```


    A visualization for Action<T> could be:


    ![](img/d73681d801b4b826e0b2a293897bbba4_15_0.png)


    # Func<T>


    The Func<T> represents functions that have this signature T f() that do not take
    any arguments. A simple example would be:


    ```

    Func<string> getName =()=>"jim";

    ```


    visualize this as a value coming out of nothing:


    ![](img/d73681d801b4b826e0b2a293897bbba4_15_1.png)


    Func<T> is the dual of Action<T> and in this way we can compose them and annihilate
    them into a void.


    ```

    Action<string> print = Console.Write;

    Func<string> getName =()=>"jim";

    ```


    ```

    print(getName()); // prints Jim as side effect with return type void

    ```


    ![](img/d73681d801b4b826e0b2a293897bbba4_15_2.png)'
