    \ the generic Fold implementation by Microsoft for Tuples:\n\n```\nstatic S Fold<A,\
    \ S>(this System.ValueTuple<A> self, S state, System.Func<S, A, S> fold);\n```\n\
    \nthis is the standard Fold signature which is the equivalent of the List.Aggregate\
    \ and we can use it to get the value back like this:\n\n```\nvar value = t1.Fold(0,\
    \ (a, e) => a + e);\n```\n\n![](img/d73681d801b4b826e0b2a293897bbba4_123_0.png)\n\
    \nFinally, obviously ValueTuple<T> isomorphic to List<T> so we can create some\
    \ extension methods to go from one to the other\n\n```\nstatic List<T> ToList<T>(this\
    \ ValueTuple<T, T> @this) => new List<T> {\n    @this.Item1,\n    @this.Item2\n\
    };\n```\n\nValueTuple is a Functor since is equivalent with the List () but just\
    \ for fun we can create a ValueTuple .Map extension method directly :\n\n```\n\
    static ValueTuple<T1, T1> Map<T, T1>(this ValueTuple<T,T> @this, Func<T, T1> f)\
    \ => (f(@this.Item1), f(@this.Item2));\n```\n\n# SideNote:\n\nA very obvious observation\
    \ is that if we implemented ValueTuple<T, T>.ToList<T>() and ValueTuple<T1, T1>.Map<T,\
    \ T1>(f) correctly then the results of the following expressions should be equal:\n\
    \n```\n(3, 4).ToList().Select(x => x + 4);\n(3, 4).Map(x => x + 4).ToList();\n\
    ```\n\nthose two expressions represent the different paths in the following diagram:\n\
    \n![](img/d73681d801b4b826e0b2a293897bbba4_123_1.png)"
