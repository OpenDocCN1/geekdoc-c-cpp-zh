- pgno: 201
  md: "```\n```csharp\n{\n    private readonly Product<T,E> value;\n    public SomeFixed(Product<T,\
    \ E> value) => this.value = value;\n}\n```\n```\n\nNd finally completely replace\
    \ E like this:\n\n```\n```csharp\npublic class SomeFixed <T>\n{\n    private readonly\
    \ Product<T, SomeFixed <T>> value;\n    public Some(Product<T, SomeFixed <T>>\
    \ value) => this.value = value;\n}\n```\n```\n\nThe point of all this is that\
    \ `Maybe<Product<T>>` is equivalent to a `List<T>`\n\n# Type Theory\n\n# Base\
    \ Functor and Fix points\n\nIn the list definition\n\nList (a)= [] + a * List(a)\n\
    \nWe can get rid of recursion by replacing the List(a) in the right side with\
    \ a new type E\n\nListF (a, E) = [] + a * E\n\n**That’s the base functor.** *The\
    \ functor that we get when we replace recursive occurrences with a new type.*\
    \ Now the map function with respect to **E** for this new Base Functor are the\
    \ ones that we create previously.\n\nImagine this as a type F(_) where F(_)=ListF\
    \ (a, _)=[] + a * _\n\nIf we replace E with any Type we get a ListF (a, E) Type\
    \ for example we can get E as int then we get the Type ListF(a,int)=[] + a * b\
    \ where b is int .We can take as E whatever we want but for this example there\
    \ is one Type X that if E is of that type then something special happens :\n\n\
    **ListF (a, X) = X**\n\nWe want to find this specific X because if we replace\
    \ it in the definition, we get:\n\nListF (a, X) = [] + a * X = [] + a * ListF\
    \ (a, X)\n\nAnd now if we replace ListF (a, X) with a name like list(a) for example\
    \ we get\n\n**list(a) = [] + a * list(a)**\n\nwell we have the list definition.\
    \ We started from a non-recursive definition ListF (a, E) = [] + a * E and we\
    \ found an E that gives us the recursive type that we wanted."
