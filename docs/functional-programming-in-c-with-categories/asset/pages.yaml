- pgno: 198
  md: "# 6.5 Catamorphisms with the Visitor Design pattern\n\nWe can also use our\
    \ algebra on a tree with the visitor design pattern, If we define an accept method\
    \ on the tree structure. The visitor offers one more degree of freedom because\
    \ we can use different kinds of visitors.\n\n```\n```csharp\npublic class AlgebraSumVisitor\
    \ : Visitor<int, int>\n{\n\tpublic override int VisitLeaf(Leaf<int> leaf) => leaf.V;\n\
    \tpublic override int VisitNode(Node<int> node) =>\n\t\tnode.Left.Accept(this)\
    \ + node.Value + node.Right.Accept(this);\n}\n```\n```\n\nAnd we implement the\
    \ standard accept method in each component\n\n```\n```csharp\npublic abstract\
    \ class Tree<T>\n{\n\tpublic abstract T1 Accept<T1>(Visitor<T, T1> visitor);\n\
    }\n```\n```\n\n```\n```csharp\npublic class Node<T> : Tree<T>\n{\n\tpublic Tree<T>\
    \ Left { get; set; }\n\tpublic T Value { get; set; }\n\tpublic Tree<T> Right {\
    \ get; set; }\n\tpublic Node(Tree<T> left, T value, Tree<T> right)\n\t{\n\t\t\
    this.Left = left;\n\t\tthis.Value = value;\n\t\tthis.Right = right;\n\t}\n\tpublic\
    \ override T1 Accept<T1>(Visitor<T, T1> visitor) =>\n\t\tvisitor.VisitNode(this);\n\
    }\n```\n```\n\n```\n```csharp\npublic class Leaf<T> : Tree<T>\n{\n\tpublic T V\
    \ { get; }\n\tpublic Leaf(T v) => V = v;\n\tpublic override T1 Accept<T1>(Visitor<T,\
    \ T1> visitor) =>\n\t\tvisitor.VisitLeaf(this);\n}\n```\n```\n\nAs you can see\
    \ the Visitor is pretty much isomorphic to the catamorphism implementation. Visitors\
    \ use the double dispatch to dispatches a function call to different concrete\
    \ functions"
