- pgno: 127
  md: '# 4.7 IO Functor, a Lazy Id Functor


    Another simple functor which extends the identity functor by adding Laziness is
    the IO functor. The IO is a lazy Id functor. IO comes handy when we want to Objectify
    a function, pass it around and use it later to produce a side effect as we will
    see.Lazy<T> as Functor


    ```

    public static Lazy<T1> Map<T, T1>(this Lazy<T> @this, Func<T, T1> f) =>

    new Lazy<T1>(() => f(@this.Value));

    ```


    The mechanics behind the mapping function that lifts the function f: T →T1 follows
    the same stapes as Task<T>:


    +   1. Waits for the result of the Lazy (so in a way unwraps the contained value)
    @this.Value

    +   2. Applying the function f : f(@this.Value)

    +   3. wraps the resulting value again into a new Lazy: Lazy<T1>(() => f(@this.Value))
    because when we implement a Map, we always return something of the same type in
    order to belong to the same category (in this case type).


    You must appreciate that this preserves the Laziness of the Lazy<T> at no point
    the Lazy must collapse without trying to access the outer Value. At the step 3
    we apply a lazy wrapper() => around what seems like an evaluation,@this.Value,
    and thus is not executed.


    # 4.7.1 Func<T> Delegates as Functor


    We can similarly extend the Func<T> delegate in order to provide a Map method:


    ```

    public static Func<T1> Map<T, T1>(this Func<T> @this, Func<T, T1> f) =>

    new Func<T1>(() => f(@this()));

    ```


    By now you probably have figure out a pattern between The Task, Lazy and Func
    implementation of a Map. The map is a powerful abstraction over the specific mechanics
    of each type. Map abstracts over the need to transform the value inside a data
    structure.'
