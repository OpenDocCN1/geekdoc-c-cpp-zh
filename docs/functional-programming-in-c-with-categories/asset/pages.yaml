- pgno: 192
  md: "This algebra tells us how to *interpret* a Numeral Expression into an integer.\
    \ This algebra is the *intended interpretation* (also called a *standard model*\
    \ a term introduced by Abraham Robinson in 1960) because it gives us the intended\
    \ “meaning” of the Expression, which in this case was to represent numbers using\
    \ a formal language¹. Nevertheless, we can have many algebras based on this Functor.\
    \ Here some more:\n\nThe algebra below needs no further explanation.\n\n```\n\
    (Func<string> Zero, Func<string, string> Succ) algebraString = (\n  Zero: () =>\
    \ $\"Zero( )\",\n  Succ: (Rest) => $\"Add one -({Rest })\"\n);\n```\n\nThe thing\
    \ is that we cannot apply the algebra just yet to an expression like Succ(Succ(Succ(\
    \ Succ(Zero())))) for example. The algebra is for evaluating only one “step” or\
    \ “layer” of the expression. We must somehow push the algebra downwards, perform\
    \ an evaluation, and then compose the results. **The catamorphism is this exact\
    \ process.**\n\nCategory Theory\nF-Algebra\n\nIf C is a category, and F : C →\
    \ C is an endofunctor of C, then an F-algebra is a pair (A, α), where A is an\
    \ object of C and α is a morphism F(A) → A the a often called structure map.\n\
    \n# 6.2 Catamorphisms\n\nNow we are going to define a Cata method for the Numeral\
    \ union type, which will take an algebra and evaluate the Numeral. Here the implementation\
    \ will be ad hoc-specifically for the Numeral structure.\n\n```\nT1 Cata<T1>(this\
    \ Numeral @this, (Func<T1> Zero, Func<T1, T1> Succ) algebra)\n  =>@this.MatchWith<T1>(pattern:\
    \ (\n    Zero: () => algebra.Zero(),\n    Succ: (Rest) => algebra.Succ(Rest.Cata<T1>(algebra))\n\
    \  ));\n```\n\n> pass the algebra to the Rest\n\n> Use the algebra to evaluate\n\
    \n¹ Lectures on Semantics: The initial algebra and final coalgebra perspectives"
