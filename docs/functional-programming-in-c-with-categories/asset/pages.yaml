- pgno: 212
  md: "It is passing a lambda inside the constructor of our data structure\n\n```\n\
    ⟨_ _ _⟩\n(x=>y=>_ concat _)\nId(x => y => x.concat(y)).app(_).app(_ );\n```\n\n\
    Here we have placed the curried concat function (_=>_=>_.concat_) Inside an applicative\
    \ in order to be able to chain the applicative calls. In Haskell, for example,\
    \ this is called sequenceA :: Applicative f => t (f a) → f (t a), and what does\
    \ is to take a traversable t that contains f(a) items and evaluates them and collect\
    \ the results.\n\nWhy get into all this trouble just to get an Id ([1, 2, 3])\
    \ ? Well, we can abstract the Id and have a function a → Id(b) that will do the\
    \ generation of the Id ([_]). We get this implementation:\n\n```\npublic static\
    \ Id<List<T1>> Traverse<T,T1>(this List<T> @this,Func<T, Id<T1>> f)\n=>\n    @this.MatchWith(pattern:\
    \ (\n        Empty: ()      => new Id<List<T1>>(new List<T1>()),\n        Cons\
    \ : (v, r) =>\n        new Id<Func<T1, Func<List<T1>, List<T1>>>>(x =>y =>x.AsList().Concat(y))\n\
    \        .Ap(f(v))\n        .Ap(r.Traverse(f))\n    ));\nvar result = [2, 3, 5].Traverse(\
    \ IdF, v => IdF(v + 1));\n```\n\nHere the f is the applicative functor constructor,\
    \ aka pure (_) in the fiddle is written as TyperRep for Type Representable, (TypeRep\
    \ is the constructor of the Functor). In a symbolic notation, it could be described\
    \ as follows:\n\n```\ntraverse: Applicative f : (a → f(b)) → [ a ] → f [ b ]\n\
    \ntraverse (f, []) = ⟨ [] ⟩\n\ntraverse (f, [value, rest]) = ⟨ (.) f(value) (traverse(\
    \ f, rest)) ⟩\n```\n\nnow if you compare the signatures of the distribute and\
    \ traverse you can see that we can create traverse from distribute by first mapping\
    \ the (a → f(b)) on the array elements so we get:\n\n[ a ].map(a → f(b)) → [f(b)]\
    \ and then apply the distribute to get the final f [ b ] So :\n\nlist .traverse\
    \ (g) = list .map(g). distribute ( ) where g : a → f(b) :\n\n```\nvar TraverseEquivalent=\
    \ (list,g)=>list.map(g).distribute();\n```"
