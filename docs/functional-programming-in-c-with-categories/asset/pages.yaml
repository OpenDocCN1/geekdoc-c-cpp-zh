- pgno: 51
  md: "both + and * can be abstracted as lambdas. For the + case\n\n```\nFunc<int,\
    \ int, int> add = (int x, int y) => x + y;\n```\n\nAnd in the second case we start\
    \ with an initial element the 1 and we use the multiplication as an operation\
    \ between the two integers\n\n```\nFunc<int, int, int> add = (int x, int y) =>\
    \ x * y\n```\n\nBecause both have the same signature we can abstract them and\
    \ create a Higher order function that we can reuse.:\n\n```\npublic T Fold<T>(List<T>\
    \ list, T accumulation, Func<T, T, T> concat)\n{\n    foreach (var current in\
    \ list)\n        accumulation = concat(accumulation, current);\n    return accumulation;\n\
    }\n```\n\nNow we can use this function in both cases:\n\n```\nvar sum = Fold<int>(new[]\
    \ { 1, 2, 3, 4 }, 0, (x, y) => x + y);\nvar product = Fold<int>(new[] { 1, 2,\
    \ 3, 4 }, 1, (x, y) => x * y);\n```\n\nbut also, we can use other combinations\
    \ of (T accumulation, Func<T, T, T> concat) parameters (aka monoids) to Fold the\
    \ array. For example:\n\n```\nvar max = Fold(new[] { 1, 2, 3, 4 }, int.MinValue,\
    \ (x, y) => x > y ? x : y);\n```\n\nObviously, this Fold function is so important\
    \ that is implemented in all programming languages for the array data structure.\
    \ In .NET it is called Aggregate:\n\n```\nvar sum = new List<int> { 1, 2, 3, 4\
    \ }\n    .Aggregate(0, (accumulation, current)=> accumulation + y);\n\nvar product\
    \ = new List<int> { 1, 2, 3, 4 }\n    .Aggregate(1, (accumulation, current) =>\
    \ accumulation * y);\n```\n\nIf you look the type signature by navigating to the\
    \ metadata definition (with F12) on any List you will see the following\n\n```\n\
    TAccumulate Aggregate<TSource, TAccumulate>(TAccumulate seed, Func<TAccumulate,\
    \ TSource, TAccumulate> func);\n```\n\n[side note the aggregate is something we\
    \ call usually FoldMap which is the same with Fold but also includes a Map aka\
    \ Select operation this allows us to have the result TAccumulate to be of different\
    \ type from the type of the List TSource]"
