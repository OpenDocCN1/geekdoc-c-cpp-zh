    # optional


    # Curry-Howard correspondence


    In programming language theory and proof theory, the Curry-Howard correspondence
    is the direct relationship between computer programs and mathematical proofs.
    We are going to explore some of those connections as we go along. We are going
    to only scratch the surface of the Curry-Howard correspondence, in a simplistic
    presentation within the scope of this book.


    The First clear connection is between the lambda abstraction ( ⇒ ) and logical
    implication ( → ):


    Types | Logic

    Introduction | [x:A]¹ ... M:B / λx.M: A → B ⇒ I₁ | [A]ˣ ... B / A → B ⇒ I₁

    Elimination | λx.M: A → B   t:A / M(t): B ⇒ E | A → B   A / B → E


    +   1. an introduction rule describing how elements of the type can be created,
    and

    +   2. an elimination rule describing how elements of the type can be used.'
