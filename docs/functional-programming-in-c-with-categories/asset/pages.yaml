- pgno: 113
  md: '# 4.2 Commutative Diagrams


    There is one important thing about the mapping function, though, the mapping should
    reach the same result for Id(4) if we take any of the two possible routes to get
    there. This means **map** (aka lifting of a function from C to D) **should preserve
    the structure of C.**


    +   1. We could first get the Functor and then map **f**. This is the red path
    on the diagram.


    ```

    Id(y) = Id(x).Map(f);

    ```


    ![](img/d73681d801b4b826e0b2a293897bbba4_113_0.png)


    +   2. Or first lift 2 with **f** and then get the Functor.


    ```

    Id(y) = Id(f(x));

    ```


    ![](img/d73681d801b4b826e0b2a293897bbba4_113_1.png)


    Two objects that were connected with an arrow in category **C**, should also be
    connected with an arrow in category **D**. And reversely, if there was no connection
    in **C** there should be no connection in **D**.'
