    going to Run anything for now and just explore the morphology of the recursion.
    First let us add some input parameters. We could add an integer for example :


    ```

    public T F<T>(int n) => F<T>(n);

    ```


    it type-checks so we are ok. In the same sense we can add as many generic Types
    or functions e.g:


    ```

    public T F<T, T1>(Func<T, T> f, Func<T, T1> g) => F(f, g);

    ```


    Any change we make to the Definition we have to find something of the appropriate
    type to call the Function.


    Let us use the function f. The only Requirement is that whatever we write Type-Checks.
    In order to use the f we need to call it by providing a T, well F(f) is of type
    T:


    ```

    public T F<T>(Func<T, T> f) => f(F(f));

    ```


    trivially you could use f as many times you wanted :


    ```

    public static T F<T>(Func<T, T> f) => f(f(f(F<T>(f))));

    ```


    we can now add also a T1 parameter. Nothing changes:


    ```

    T F<T, T1>(Func<T, T> f, T1 n) => f(F(f, n));

    ```


    now let’s change the signature of the f in order to also takes another argument
    of type T1


    ```

    T F<T, T1>(Func<T, T1, T> f, T1 n) => f(F(f, n), n);

    ```


    Adding a T1 and use the n to call f


    we can add as many arguments on f as we wanted:


    Adding 3 T1 and use the n 3 times.


    ```

    T F<T, T1>(Func<T, T1, T1, T1, T> f, T1 n) => f(F(f, n), n, n, n);

    ```


