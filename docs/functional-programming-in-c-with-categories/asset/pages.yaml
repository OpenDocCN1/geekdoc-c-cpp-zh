- pgno: 63
  md: 'To understand why its contravariant, try to compose a function T→ R with a
    predicate (R a)=>bool to get a predicate (R a) => bool. The only way is to have
    a composition, is to pre-compose the T→ R to the (R a) => bool to get a (T a)
    => bool


    ![](img/d73681d801b4b826e0b2a293897bbba4_63_0.png)


    This visually looks like this :


    T → R ∘ R → ● ⇔ T → ●


    Where ● is the bool in our case.


    In this way for the Predicate, we can define a PreCompose function:


    ```

    Predicate<R> PreCompose<T, R>(Func<R, T> f, Predicate<T> g) => (R x) => g(f(x));

    ```


    The whole contravariant pre-composition becomes obvious when you take a look at
    this simple example where we have a Predicate<double> on the Price and we want
    to produce a Predicate<Product> on the Product using a Projection for the Price
    GetPrice :


    ```

    Predicate<double> IsHightPriced = (price) => price > 100;

    ```


    ```

    Func<Product, double> GetPrice = (product) => product.Price;

    ```


    ```

    Predicate<Product> IsHightPricedProduct = PreCompose(GetPrice, IsHightPriced);

    ```


    This is one way to compose Contravariant types Like Predicate.


    Another way is the monoidal composition. Using the monoidal operations on the
    bool, &&, || , ~ , we can define various compositions And, Or, and Not that would
    allow us to form larger Predicates from simpler.


    The specification design pattern is based on this idea by defining:


    ```

    Func<T, bool> And<T>(Func<T, bool> p1,Func<T, bool> p2) => (T x) => p1(x) && p2(x)

    ```


    ```

    Func<T, bool> Or<T>(Func<T, bool> p1,Func<T, bool> p2) => (T x) => p1(x) || p2(x);

    ```


    ```

    Func<T, bool> Not<T>(Func<T, bool> p1) => (T x) => !p1(x);

    ```'
