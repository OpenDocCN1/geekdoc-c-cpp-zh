  md: "# 6.5.2 A brief mentioning of Anamorhisms optional\n\nIt’s easy to use recursion\
    \ in order to construct instances of this type new Some({ value: 2, rest: new\
    \ Some({ value: 1, rest: new None() }) })\n\n```\npublic static Maybe<Product<int>>\
    \ AnaToListBase(this int @n) =>\n@n == 0 ? (Maybe<Product<int>>)new None<Product<int>>()\
    \ :\n    new Some<Product<int>>(new Product<int>()\n    {\n        Value = @n,\n\
    \        Rest = (@n - 1).AnaToListBase()\n    });\n```\n\n(2).AnaToListBase()//{\"\
    v\":{\"value\":2,\"rest\":{\"v\":{\"value\":1,\"rest\":{}}}}}\n\nThis is an example\
    \ of an unfold or anamorphisms. Starting from a single seed integer value we gradually\
    \ build a Maybe functor instance.\n\nThe above definition has two entangled concepts\
    \ that can be separated. We can isolate the recursive part. Writing something\
    \ like this\n\n```\nvar coAlgListBase = n => n <=0 ? new None() : new Some({\n\
    \    head: n - 1,\n    tail: n - 1\n});\n\nvar ana = (colAg) => oldState => colAg(oldState).cata({\n\
    \    some: (v) => new Some({value:v.head, rest:(ana(colAg)(v.tail))}),\n    none:\
    \ (_) => new None()\n})\n\nvar nat = ana(coAlgListBase)(2);//{\"v\":{\"value\"\
    :1,\"rest\":{\"v\":{\"value\":0,\"rest\":{\"}}}}}\n```\n\nI know that this way\
    \ more complex and the only thing that we here is to be able to use different\
    \ coAlg for example using the following we get only the even numbers:\n\n```\n\
    var coAlgListBaseEvens = n => n <=0 ? new None() : new Some({\n    head: n - 2,\n\
    \    tail: n - 2\n});\n```\n\nWe can also change the ana function and generate\
    \ lists by using instructions made of Maybe’s"
