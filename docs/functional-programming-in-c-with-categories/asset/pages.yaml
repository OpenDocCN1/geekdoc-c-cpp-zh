    # Type Theory

    Liskov Substitution Principle


    Barbara Liskov described the principle in a 1994 paper as follows:


    > «Subtype Requirement: Let φ(x) be a property provable about objects χ of type
    T. Then φ(y) should be true for objects y of type S where S is a subtype of T.»'
