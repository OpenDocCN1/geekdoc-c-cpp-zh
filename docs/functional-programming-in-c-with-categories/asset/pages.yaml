  md: '# Algebras of Programming






    Category Theory is a mathematical discipline with a wide range of applications
    in theoretical computer science. Concepts like Category, Functor, Monad, and others,
    which were originally defined in Category Theory, have become pivotal for the
    understanding of modern Functional Programming (FP) languages and paradigms.


    The Category is just an extension of the classical notion of Set of Objects. A
    category C consists of the following three mathematical entities:


    +   1. A class ob(C), whose elements are called objects. Any object-oriented programmer
    would find this as a great way to start a definition.


    ![](img/d73681d801b4b826e0b2a293897bbba4_46_0.png)


    Our favorite category in programming is the category of types int, bool, char,
    etc. There are many interesting categories in programming and in this book, we
    will explore some of them.


    ![](img/d73681d801b4b826e0b2a293897bbba4_46_1.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   2. A collection of elements called **morphisms** or arrows. Each morphism
    **f** has a source object **a**, and target object **b**.


    # **category** C


    ![](img/d73681d801b4b826e0b2a293897bbba4_47_0.png)


    In our Type category, any arrow from `int` to `bool` for example, represents a
    function `int → bool`. Some examples might be:


    ```

    bool isEven(int a)=> a%2==0;

    ```


    Or this one:


    ```

    bool isLessThan10(int a)=> a<10

    ```


    # **category** of Types


    ![](img/d73681d801b4b826e0b2a293897bbba4_47_1.png)


    The basic focus of category theory **is the relations between objects** and not
    the objects per se, in contrast with the Set theory that primarily focuses on
    sets of objects. Functional programmers quickly endorsed this unique perspective
    of category theory.'
