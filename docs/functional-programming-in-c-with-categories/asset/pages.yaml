- pgno: 111
  md: "# 4.1 The Identity Functor\n\nWe will start by looking at the minimum structure\
    \ that qualifies as a functor in C#:\n\n```\npublic class Id<T>\n{\n    public\
    \ T Value { get; set; }\n    public Id(T value) => Value = value;\n    public\
    \ Id<T1> Map<T1>(Func<T, T1> f) => new Id<T1>(f(Value));\n}\n```\n\nThis is the\
    \ minimum construction that we could call a functor because it has exactly two\
    \ things:\n\n+   1. A \"constructor\" that maps a value v to an object literal\
    \ Id<T>\n+   2. and it has a mapping method Map<T1>(Func<T, T1> f) that lifts\
    \ functions f\n\n![](img/d73681d801b4b826e0b2a293897bbba4_111_0.png)\n\n![](img/d73681d801b4b826e0b2a293897bbba4_111_1.png)\n\
    \nBecause it’s the minimal functor structure it goes by the name Identity functor.\
    \ Let us see a simple example where we have two integers 2 and 4 (here we take\
    \ for simplicity the category of integers as our initial category C) also in this\
    \ category there is the function square = x=> x*x that maps 2 to 4."
