  md: "Let’s say that we try to write what a `Maybe<Product<T>>` looks like (in a\
    \ kind of symbolic representation)\n\n```\nMaybe<Product<T>> = None<Product<T>>\
    \ + Some<Product<T>>({ Value=a:T, Rest: Maybe<Product<T>>})\n```\n\nAnd if we\
    \ replace `Maybe<Product<T>>` with the name List<T> then we get:\n\n```\nList<T>\
    \ = None<Product<T>> + Some<Product<T>>({ Value=a:T, Rest: List<T>}).\n```\n\n\
    Which is has the correct meaning of a List.\n\nLet me try to explain the same\
    \ from another perspective. Lets now start from this class\n\n```\npublic class\
    \ SomeF<T, E>\n{\n    private readonly Product<T, E> value;\n    public SomeF(Product<T,\
    \ E> value) => this.value = value;\n}\n```\n\nWhich looks like the `SomeF<T, E>`\
    \ where the value is of type `Product<T, E>`\n\nLet’s write some instances of\
    \ this class\n\nIn the first one T is `int` and E is `int`\n\n```\nSomeF<int,\
    \ int> s = new SomeF<int, int>(new Product<int, int>() { Value = 1, Rest = 1 });\n\
    ```\n\nNow let’s take E as `SomeF<int, int>` This is valid:\n\n```\nSomeF<int,\
    \ SomeF<int, int>> s1 = new SomeF<int, SomeF<int, int>>(new Product<int, SomeF<int,\
    \ int>>() { Value = 1, Rest = s });\n```\n\nNow if we take E as `SomeF<int, SomeF<int,\
    \ int>>` we get\n\n```\nSomeF<int, SomeF<int, SomeF<int, int>>> s2 = new SomeF<int,\
    \ SomeF<int, SomeF<int, int>>>(\n    new Product<int, SomeF<int, SomeF<int, int>>>()\
    \ { Value = 1, Rest = s1 });\n```\n\nthe thing is we suspect that s1 should be\
    \ a Subtype of s2, s1<: s2 which is in the Behavioral sense if for example we\
    \ were writing in C# it would be safe to replace s1 with s2.\n\nWe suspect that\
    \ if we were to repeat this replacement of E with\n\n`SomeF<int, SomeF<int, SomeF<int,\
    \ …>>>` this should converge somewhere. Let’s call this infinite expression as\
    \ X then it would not make any difference if we iterate one more time (like adding\
    \ +1 at infinite is still infinite . This is a usual tactic when reasoning with\
    \ infinite structures) so `SomeF<int, X> == X` we say that this X type would be\
    \ a Fix Type for this Type `SomeF<int, X>` the only thing we can do in C# is write\
    \ this equivalence this way\n\n```\npublic class SomeFixed<T,E> where E : SomeFixed<T,\
    \ E>\n```"
