    \ with an initial state [1, 4,6] on which we will apply the reduction sequentially.\n\
    \nRebuild ([1,4,6]) →\n\n[1, Rebuild ([4,6]) ] →\n\n[1,4, Rebuild ([6]) ] →\n\n\
    ... //at some point we empty the list\n\n[1,4,6, Rebuild ([]) ] → //we reached\
    \ the base case and the recursion stops\n\n[1,4,6]\n\nAs you can see what we did\
    \ is just traverse the list one element at a time by recursion and used the list\
    \ monoid ([I],*) to rebuild it.\n\nUsing the Aggregate Linq method on the List<T>\n\
    \n```\nList<T> Rebuild<T>(List<T> @list) => list.Aggregate(\n    new List<T> {\
    \ },\n    (acc, current) => (acc, current).AsList()\n);\n```\n\nUnfortunately,\
    \ this reverses the List ( this will happen even if you reverse the order of concatenation\
    \ (current, acc).AsList()). The Aggregate is weaker than the recursion since we\
    \ lose the order of traversal. Aggregate is great for the cases where we want\
    \ to fold to things into less information e.g. Fold a list into a bool or an integer.\n\
    \n# 3.9 Passing More arguments\n\nWe can always pass more arguments into the recursive\
    \ function trivially.\n\n```\nList<int> Rebuild(List<int> @list, Func<int,int>\
