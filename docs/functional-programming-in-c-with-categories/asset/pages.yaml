  md: "if we have some Functions we can compose them:\n\n```\nFunc<Product, string>\
    \ GetName = product => product.Name;\nFunc<string, string> ToUpper = name => name.ToUpper();\n\
    ```\n\n```\nFunc<Product, string> GetNameUpperCase = Compose(GetName, ToUpper);\n\
    ```\n\nOr by using Extension methods, we can fluently chain function delegates:\n\
    \n```\npublic static partial class FunctionalExt\n{\n    public static Func<A,\
    \ C> Compose<A, B, C>(this Func<A, B> @f, Func<B, C> g) =>\n        (A x) => g(f(x));\n\
    }\n```\n\nThis allows us to write the composition in this way :\n\n```\nFunc<Product,\
    \ string> GetNameUpperCase = GetName.Compose(ToUpper);\n```\n\nWhat follows is\
    \ a light exploration of function composition in the C# type system. We are not\
    \ going to bother here with the pragmatics instead we are going to just explore\
    \ the morphology of composition.\n\noptional\n\nWe are going to explain the intuition\
    \ behind the construction of this function.\n\nSince we want to construct a Func<T,R>\
    \ we must return a function (lambda) that takes an argument arguments T x and\
    \ return something of type R, using only the two functions that we want to compose\
    \ Func<T, R> and Func<R, U>.\n\n+   1. We start by writing this function as lambda\
    \ (T x) =>... now we have a T x and two delegates Func<T, R> f, Func<R, U> g\n\
    +   2. We use the T x, to invoke the Func<T, R> f f(x) this will return an R and\
    \ then we can use the functional delegate Func<R, U> which represents a function\
    \ g: R→ U from R to U in order to get back a U and return this.\n\nIf the first\
    \ function was a two-argument function, we have another example of function composition:\n\
    \n![](img/d73681d801b4b826e0b2a293897bbba4_29_0.png)"
