    \ doublePackagedProduct = Packaging(Packaging(ProductA));\n```\n\nObviously the\
    \ Tuples as Object minimal syntax here is only for presentation purposes. In C#\
    \ 9.0 immutable record types have been added in order to cover the cases where\
    \ we want to adhere to a more minimal functional coding style.\n\n# 2.8 Predicate\
    \ monoidal Composition\n\nThe most Famous contravariant functional type is the\
    \ Predicate which is any function that has a type of _→ bool (returns a Boolean\
    \ ) we already saw that the .NET provides a native Predicate delegate :\n\n```\n\
    public delegate bool Predicate<in T>(T obj);\n```\n\nin practice we usually we\
    \ use the delegate Func<T,bool> to represent predicates. Most of the .NET framework\
    \ internally also uses the Func<T,bool> as predicate type. For example, for the\
    \ .NET framework definition for the List<T>.Where has the following signature:\n\
    \n```\nIEnumerable<TSource> Where<TSource>(this IEnumerable<TSource> source, Func<TSource,\
    \ bool> predicate)\n```\n\nCategory Theory\nContravariant Types\n\nThose kind\
    \ of types are called contravariant because they have the “changing (Type)” in\
    \ the “negative side of the function (which is the input)”. The input argument\
    \ is what varies (T x) → bool. When we say here that the input argument varies\
    \ we mean that the Type of the input argument is Generic (we have parametric polymorphism\
    \ on the input argument) whereas the return Type is fixed to bool."
