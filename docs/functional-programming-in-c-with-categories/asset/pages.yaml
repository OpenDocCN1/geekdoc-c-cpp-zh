- pgno: 245
  md: "The _mediator.Send(new GetCourseById(courseId)) has finished and return a result\
    \ on with we apply the .ToActionResult(). This is an extension method that will\
    \ convert the option to an appropriate IActionResult that will be the response\
    \ of the Web Api Controller\n\n```\npublic static IActionResult ToActionResult<T>(this\
    \ Option<T> option) =>\n    option.Match<IActionResult>(\n        Some: t => new\
    \ OkObjectResult(t),\n        None: () => new NotFoundResult();\n```\n\nGitHub\
    \ source\n\nYou see here that we pattern match on the Option and in the case where\
    \ is None we return a NotFoundResult that corresponds into a Not Found (404) response.\
    \ At this point obviously we could send a more custom response to the client side.\
    \ This concludes the lifecycle of the request."
