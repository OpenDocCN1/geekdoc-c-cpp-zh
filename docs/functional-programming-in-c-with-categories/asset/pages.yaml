  md: "```\npublic class Node<T> : Tree<T>\n{\n    public Tree<T> Left { get; set;\
    \ }\n    public T Value { get; set; }\n    public Tree<T> Right { get; set; }\n\
    \n    public Node(Tree<T> left, Tree<T> right)\n    {\n        this.Left = left;\n\
    \        this.Right = right;\n    }\n}\n```\n\n```\npublic class Leaf<T> : Tree<T>\n\
    {\n    public T V { get; }\n    public Leaf(T v) => V = v;\n}\n```\n\nIn order\
    \ to create a functor based on this algebraic data type we define a valid **map**\
    \ method. We will again follow our **method of structural induction** in order\
    \ to define the **map**.\n\nFirst, because it is a **coproduct**, we must define\
    \ the map method in both subtypes :Leaf and Node of the coproduct.\n\n+   1. We\
    \ start with the Leaf which is the base case of the structural induction. We must\
    \ return something of the same type. That’s why we return a new Leaf with the\
    \ function applied to the value\n+   \n+   `Tree<T1> Map<T1>(Func<T, T1> f) =>\
    \ new Leaf<T1>(f(V))`\n\n**A leaf is just an Identity functor.** Hopefully, you\
    \ recognized it.\n\n+   2. The Node part is a product of two trees (Left, Right)\
    \ both are of the same type as the one for which we want to define the map. The\
    \ only way to deal with it is to assume that both must have a map function already\
    \ in place that works as expected (this is the inductive hypothesis again),\n\
    +   \n+   `Tree<T1> Map<T1>(Func<T, T1> f) => new Node<T1>(Left.Map(f), Right.Map(f))`"
