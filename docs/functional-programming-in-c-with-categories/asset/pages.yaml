  md: "```\n0 ≅ λf. λf. x\n1 ≅ λf. λf. f(x)\n2 ≅ λf. λf. f(f(x))\n```\n\n# 6.4 Catamorphisms\
    \ for Trees\n\nWe already have seen the Peano Numerals as the simplest recursive\
    \ Algebraic types. We will also look at the binary tree. Let us say we have a\
    \ simple algebra for this tree. This algebra sums up the values of a node or returns\
    \ the value of a leaf if it is a leaf.\n\n```\nvar algSumInt = (\n    Leaf: (v)\
    \ => v,\n    Node: (l, v, r) => l + v + r\n)\n```\n\nOur Cata method would look\
    \ like this:\n\n```\npublic static T Cata<T>(this Tree<T> @this,\n    (Func<T,\
    \ T> Leaf, Func<T, T, T, T> Node) algebra) =>\n        @this.MatchWith(algebra:\
    \ (\n            Leaf: v => algebra.Leaf(v),\n            Node: (l, v, r) =>\n\
    \            algebra.Node(r.Cata<T>(algebra), v, l.Cata<T>(algebra))\n       \
    \ ));\n\n```\n\nHopefully, the implementation of a method, like Cata by structural\
    \ induction on a tree, should be familiar by now. In case you don’t still feel\
    \ confident I will go through with the construction one more time below.\n\n```\n\
    var tree = new Node<int>(new Node<int>(new Leaf<int>(1), 2, new Leaf<int>(3)),\n\
    \    4,\n    new Node<int>(new Leaf<int>(5), 6, new Leaf<int>(7)));\n\n    //(Func<T,\
    \ T> Leaf, Func<T, T, T, T> Node) algebra\n    Console.WriteLine(\n        tree.Cata(algebra:\
    \ (\n        Leaf: (v) => v,\n        Node: (l, v, r) => l + v + r))\n    );\n\
    ```"
