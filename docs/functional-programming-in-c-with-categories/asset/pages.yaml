- pgno: 52
  md: "# 2.3 Folding monoids showcase\n\nIn this section we are going to display some\
    \ examples of monoid folding using the Aggregate function. In all the examples\
    \ we are going to:\n\n+   1. Identify some type S and find some way to combine\
    \ two S into a single S.\n+   2. Then having that given a List of S we can use\
    \ Aggregate to fold them.\n\n# Folding delegates Func<,>\n\nWe will study this\
    \ case extensively later in this chapter because it is the base of many classical\
    \ object-oriented patterns. Here we will start with two Func<int, int> delegates:\n\
    \n```\nFunc<int, int> A = (x) => x + 1;\nFunc<int, int> B = (x) => x + 2;\n```\n\
    \nHaving those two we can find a function that combines them into a single Func<int,\
    \ int>\n\n```\nFunc<int, int> compose = (x) => A(x) + B(x);\n```\n\nHaving this\
    \ function, we can now fold a whole list of Func<int, int> into one.\n\n```\n\
    List<Func<int, int>> list = new List<Func<int, int>>() { A, B };\n```\n\n```\n\
    Func<int, int> accumulation = (x) => x;\nforeach (var current in list)\n{\n  \
    \  accumulation = (x) => accumulation(x) + current(x);\n}\n```\n\nThis for loop\
    \ can be abbreviated using the Aggregate method:\n\n```\nvar folding = list.Aggregate(\n\
    \    (int x) => x,\n    (Func<int, int> accumulation, Func<int, int> current)\
    \ =>\n        (x) => accumulation(x) + current(x)\n);\n```\n\n```\nConsole.WriteLine(folding(2));\n\
    ```\n\n# Folding callbacks\n\nHaving two callbacks, we can find a way to compose\
    \ them into a single callback:\n\n```\nAction<int, Action<int>> square = (x, callback)\
    \ => callback(x * x);\nAction<int, Action<int>> cube = (x, callback) => callback(x\
    \ * x * x);\n```\n\n```\nAction<int, Action<int>> Compose(Action<int, Action<int>>\
    \ c1,\n```"
