  md: "```\n}\n\npublic class Right<TL, TR> : Either<TL, TR>\n{\n    public TR Value\
    \ { get; }\n    public Right(TR value) => Value = value;\n    public override\
    \ T1 MatchWith<T1>((Func<TR, T1> right, Func<TL, T1> left) pattern) => pattern.right(Value);\n\
    }\n```\n\n# 4.11.2 Using C# 8.0 pattern matching\n\nLike in the case of Maybe\
    \ we can skip the MatchWith and use the switch to pattern match. Defining Either\
    \ using the native C# 8.0 pattern matching would give us something like this:\n\
    \n```\npublic abstract class Either<TLeft, T>\n{\n    public Either<TLeft, T1>\
    \ Map<T1>(Func<T, T1> f) =>\n        this switch\n        {\n            Left<TLeft,\
    \ T>(var v) => new Left<TLeft, T1>(v),\n            Right<TLeft, T>(var v) =>\
    \ new Right<TLeft, T1>(f(v)),\n        };\n}\n```\n\n```\npublic class Left<TLeft,\
    \ T> : Either<TLeft, T>\n{\n    private readonly TLeft value;\n    public Left(TLeft\
    \ value) => this.value = value;\n    public void Deconstruct(out TLeft value)\
    \ => value = this.value;\n}\n```\n\n```\npublic class Right<TLeft, T> : Either<TLeft,\
    \ T>\n{\n    private readonly T value;\n    public Right(T value) => this.value\
    \ = value;\n    public void Deconstruct(out T value) => value = this.value;\n\
    }\n```"
