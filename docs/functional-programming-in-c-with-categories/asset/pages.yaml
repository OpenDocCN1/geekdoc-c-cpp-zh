- pgno: 211
  md: "```\n.Ap(new Id<List<int>>((3, 6).ToList()));\n// Id([10,5,3,6])\n```\n\nwe\
    \ can do that repeatedly by replacing the last Ap() with the whole structure since\
    \ it is of the same type:\n\n```\nnew Id<Func<List<int>, Func<List<int>, List<int>>>>(x\
    \ => y => x.Concat(y))\n    .Ap(new Id<List<int>>((10, 5).ToList()))\n    .Ap(new\
    \ Id<Func<List<int>,Func<List<int>,List<int>>>>(x =>y=>x.Concat(y))\n        .Ap(new\
    \ Id<List<int>>((10, 5).ToList()))\n        .Ap(new Id<List<int>>((3, 6).ToList()))\n\
    \    );\n```\n\nwe can use recursion to use this in any list:\n\n```\npublic static\
    \ Id<List<T>> Distribute<T>(this List<Id<T>> @this,\n    Func<Id<List<T>>> TypeRep)\
    \ =>\n    @this.MatchWith(algebra: (\n        Empty: ()      => TypeRep(),\n \
    \       Cons : (v, r) =>\n    new Id<Func<List<T>, Func<List<T>, List<T>>>>(x\
    \ =>y=>x.Concat(y))\n        .Ap(v.Map(x => x.ToList()))\n        .Ap(r.Distribute(TypeRep))\n\
    \    ));\n```\n\n```\nnew List<Id<int>> { new Id<int>(2), new Id<int>(3) }\n \
    \   .Distribute<int>(() => new Id<List<int>>(new List<int>())); //Id([2, 3])\n\
    ```\n\nInside the paper that introduced the concept of applicatives \"Applicative\
    \ Programming with Effects\" Conor McBride and Ross Paterson called this applicative\
    \ distributor for lists:\n\n```\ndistribute:: Applicative f : [f a ] ⟶ f [ a ]\
    \      // the f from inside the list goes to the outside\ndistribute ([]) = ⟨\
    \ [] ⟩\ndistribute ([value: rest]) = ⟨ (:) value (distribute (rest)) ⟩\n```\n\n\
    compare this to the map\n\n```\nmap f ([ ]) = [ ]\nmap f ([value: rest]) = [ f(value):\
    \ map f (rest)]\n```\n\nthis is a loose representation where the ⟨...⟩ represents\
    \ the applicative operation.\n\nthe ⟨ (concat) __ ⟩ represents the following expression\
    \ when our f is the Id applicative functor :\n\n```\nId(x => y => x.concat(y)).app(_).app(_);\n\
    ```"
