- pgno: 128
  md: "# 4.7.2 IO Functor\n\nFunctional programming in the same lines provides the\
    \ IO functor:\n\n```\npublic class IO<T>\n{\n    public Func<T> Fn { get; set;\
    \ }\n    public IO(Func<T> fn) => Fn = fn;\n    public IO<T1> Map<T1>(Func<T,\
    \ T1> f) => new IO<T1>(() => f(Fn()));\n    public T1 MatchWith<T1>(Func<T, T1>\
    \ callback) => callback(Fn());\n    public T Run() => Fn();\n}\n```\n\nAnd use\
    \ it in this way:\n\n```\nnew IO<int>(() => 3)\n    .Map(x => x + 3)\n    .MatchWith(Console.WriteLine);\n\
    ```\n\nRun This: .Net Fiddle\n\n![](img/d73681d801b4b826e0b2a293897bbba4_128_0.png)\n\
    \nthe map implementation should remind you slightly of the Task Map line of reasoning\
    \ while implementing it.\n\n+   1. We first have to “run” the previous computation\
    \ Fn()\n+   2. Then use the function f to get the lifted value f(Fn())\n+   3.\
    \ And then finally rewrap this new value in a new new IO<T1>(() => f(Fn())).\n\
    \n![](img/d73681d801b4b826e0b2a293897bbba4_128_1.png)"
