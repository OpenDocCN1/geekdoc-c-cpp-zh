  md: "```\nFunc<int, Maybe<Product<int>>, Maybe<Product<int>>> Coana = null;\n```\n\
    \n```\nCoana = (n, r) => Coana(n + 1, new Some<Product<int>>(new Product<int>()\
    \ { Value = n, Rest = r }));\n```\n\n```\nvar stream = Coana(0, new None<Product<int>>());\n\
    ```\n\nwell enjoy your StackOverflowException\n\nthe resulting structure stream\
    \ **is infinite** and gives us **all** the natural numbers! Corecursion often\
    \ gives us infinite data structures we call co-data.\n\nThe thing is that we cannot\
    \ call Coana because C# will try to evaluate everything at once. But we can use\
    \ a Func<> ()=> **to make it lazy right** ? well please try it for yourself forking\
    \ the .net Fiddle.\n\nI added a gap to just witness the co-iteration the first\
    \ repetitions give us this\n\n```\n//(Value: 0, Rest:{ })\n//(Value: 1, Rest:\
    \ (Value: 0, Rest:{ }))\n//(Value: 2, Rest: (Value: 1, Rest: (Value: 0, Rest:{\
    \ }))) \n//(Value: 3, Rest: (Value: 2, Rest: (Value: 1, Rest: (Value: 0, Rest:{\
    \ }))))\n```\n\nRun This: .Net Fiddle\n\nthe characteristics that make it co-recursive\
    \ are dual to those of recursion as noted above:\n\n+   1. There is a base **initial**\
    \ condition (0, new None()).\n+   2. There is a **product** involved for value\
    \ accumulation. In our case the tuple (n, rest) plays this role\n+   3. We call\
    \ the function again **with an increased** argument. There is no assurance that\
    \ this process is going to stop eventually. We **construct** the **final** value\
    \ step by step.\n\n[Some advanced but manageable papers on conduchon can be found\
    \ on the page of Jan Rutten here where the popular “An introduction to (co)algebra\
    \ and (co)induction” resides²]"
