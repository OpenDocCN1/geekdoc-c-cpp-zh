  md: "```\nFunc<Expr<T>, Expr<T>, T1> sub,\nFunc<T, T1> val) pattern) => pattern.sub(X,\
    \ Y);\n}\n```\n\n```\npublic static T1 Eval<T, T1>(this Expr<T> @this,\n    (Func<T1,\
    \ T1, T1> add, Func<T1, T1, T1> sub, Func<T, T1> val) algebra) =>\n        @this.MatchWith(pattern:\
    \ (\n            add: (x, y) => algebra.add(x.Eval(algebra), y.Eval(algebra)),\n\
    \            sub: (x, y) => algebra.sub(x.Eval(algebra), y.Eval(algebra)),\n \
    \           val: v => algebra.val(v)\n        ));\n```\n\n```\nvar expression\
    \ = new SubExpr<int>(\n    new AddExpr<int>(new ValExpr<int>(2), new ValExpr<int>(2)),\n\
    \    new ValExpr<int>(2));\n\n    var result = expression.Eval(algebra: (\n  \
    \      add: (x, y) => x + y,\n        sub: (x, y) => x + y,\n        val: v =>\
    \ v\n    ));\n```\n\n# C# 8.0 Pattern matching\n\nBy using the switch we get the\
    \ following unobstructive Cata decleration\n\n```\npublic static T1 Cata<T, T1>(this\
    \ Expr<T> @this,\n    (Func<T1, T1, T1> add, Func<T1, T1, T1> sub, Func<T, T1>\
    \ val) algebra) =>\n        @this switch\n        {\n            ValExpr<T> {\
    \ X: var v } => algebra.val(v),\n            AddExpr<T> { X: var x, Y: var y }\
    \ =>\n                algebra.add(x.Cata(algebra), y.Cata(algebra)),\n       \
    \     SubExpr<T> { X: var x, Y: var y } =>\n                algebra.sub(x.Cata(algebra),\
    \ y.Cata(algebra)),\n        };\n```"
