    Journal of Equine Veterinary Science 124 (2023)


    Contents lists available at ScienceDirect


    # Journal of Equine Veterinary Science


    journal homepage: www.j-evs.com


    Journal of Equine Veterinary Science 124 (2023) 170


    https://doi.org/10.1016/j.jvet.2023.104516


    ## 170 Revisiting perceived needs of Arizona horse owners to update and focus
    cooperative extension horse educational programming and resource development


    E.A. Greene1*, J.F. Trott2, J.K. Beard3†


    1 University of Arizona, Tucson, AZ, USA

    2 University of California, Davis, CA, USA


    In 2021, an anonymous online livestock/equity survey (originally distributed in
    2015) was re-administered using Qualtrics® software disseminated to Arizona industry
    stakeholders through social media, participants, and attendees of extension events.
    We compared the 2021 responses to the 2015 (118/233 overall responses to 280 horse
    owners-total responses) to update and if necessary, change the focus of educational
    programming to critical needs by Arizona horse owners. Results from all 15 Arizona
    counties and by number of horses owned (1–3, 4–6, 7–9, and 10+). The data sets
    were analyzed independently using Chi-Square tests. Differences were significant
    (P < 0.05) for owners owning 1–3 horses in 2021, and more respondents used their
    horses for recreational riding (P < 0.05), and more owners ≥10 horses used them
    for business (P < 0.05). In 2015, preferences for methods of information delivery
    were significantly affected by the age of respondent, with 70% aged 0–69 years
    and ≥70 years preferring hands-on field days (P < 0.05). Additionally, 50–69 year-old
    respondents wanted fact sheets (P < 0.05). In 2021, ≥70 year-old respondents were
    less responsive to virtual seminars (P < 0.05). Survey takers ranked each of 22
    topics related to horse feeding, management, training, horse health, business
    planning, by critical needs: No, moderate, or critical need. Ranking topics in
    2021 showed a range of needs of owners (critical needs); included toxic plants,
    vaccination programs, and lameness; included heat, utilizing AZ horse and behavior,
    hoof care. In 2015, respondents owning ≥10 horses for management (P < 0.05) and
    heat stress (P < 0.05) for heat stress education, but in 2021 the horses did not
    perceive a critical need for heat stress education. Topics with higher needs were
    similar in 2021 and 2015, allowing us to continue with our current programming
    areas and priorities, although we found the age of respondents affected their
    preferences for information delivery, and we need to continue heat stress education
    for recreational horseholders owning 1–3.


    **Key Words:** Stakeholder Survey, Extension Programming, Horses

    '
