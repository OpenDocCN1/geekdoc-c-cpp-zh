    \n让我们定义 ![](img/00154.jpeg) 并令 `f(n, S, t)` ![](img/00155.jpeg) 为给定 ![](img/00002.jpeg)\
    \ 元的情况下，一组硬币 `S` ![](img/00156.jpeg) ![](img/00157.jpeg) 的兑换方案数。我们假设每种类型的硬币都有无限数量![](img/00158.jpeg)。一个硬币\
    \ ![](img/00159.jpeg) 可以是兑换的一部分，也可以不是。这个简单的观察被用于动态规划解决方案中。\n\n![](img/00160.jpeg)\n\
    \n其中 `f(n, S, t)` ![](img/00161.jpeg) 计算当硬币 ![](img/00159.jpeg) 未被选择时，而 `f(n,\
    \ S, t-1)` ![](img/00162.jpeg) 计算选择了一种新的硬币 ![](img/00158.jpeg)。基础情况为：`f(0, S,\
    \ t)` ![](img/00163.jpeg) 唯一的解是不兑换任何钱；`f(n, S, t)` ![](img/00164.jpeg) 对于 ![](img/00165.jpeg)\
    \ 则没有解，因为我们有了负数金额![](img/00166.jpeg)； `f(n, S, -1)` ![](img/00167.jpeg) 因为我们有钱但没有可用的硬币。第一种实现是递归的，而第二种基于动态规划。\n\
    \n## 代码\n\n```cpp\nint changeCoin(int n, const unsigned int S[], int t)\n{\n \
    \ if (n == 0)\n    return 1;\n  if ((n<0) || (t < 0 && n > 0))\n    return 0;\n\
    \  return changeCoin(n, S, t - 1) + changeCoin(n - S[t], S, t);\n}\n\nint changeCoinDP(unsigned\
    \ int n, const unsigned int S[], unsigned int t)\n{\n  Matrix<unsigned int> table(n\
    \ + 1, t);\n  for (unsigned int j = 0; j < t; ++j)\n    table(0, j) = 1;\n  for\
    \ (unsigned int i = 1; i <= n; ++i)\n    for (unsigned int j = 0; j < t; ++j)\n\
    \      table(i, j) = ((i >= S[j]) ? table(i - S[j], j) : 0) + ((j>0) ? table(i,\
