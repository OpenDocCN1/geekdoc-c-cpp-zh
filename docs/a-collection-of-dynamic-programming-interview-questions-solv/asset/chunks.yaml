    \ {console.log(\"xxx\")}\n```\n[/content]\n\n## 以下是需要翻译的文本\n\n[content]\n\nDP\
    \ pursues to solve each subproblem only once, as a result reducing the number\
    \ of computations. After the solution to a given subproblem has been computed,\
    \ it is stored in a table or \"memoized\". Next time the same solution is required,\
    \ it is simply looked up. DP solves problems in either two methods:\n\na) Top-down\
    \ approach: This is a consequence of the recursive mathematical definition associated\
    \ to many DP problems.\n\nb) Bottom-up approach: This requires a reformulation\
    \ of the recursive mathematical definition where subproblems are solved first\
    \ and their solutions used to build-on and achieve solutions for bigger subproblems.\n\
    \nIn this book we will review a collection of Dynamic programming problems, their\
    \ solution, and the C++ code related to them. Many of those problems are commonly\
    \ asked during interviews and can be frequently found on Internet web sites devoted\
    \ to interviews’ preparation.\n\n# 1. Fibonacci numbers\n\n## Solution\n\nThe\
    \ first two numbers in the Fibonacci sequence are 0 and 1, and each subsequent\
    \ number is the sum of the previous two. By describing the numbers in his book\
    \ [Liber Abaci](http://en.wikipedia.org/wiki/Liber_Abaci), [Leonardo Fibonacci](http://en.wikipedia.org/wiki/Leonardo_Fibonacci)\
    \ introduced the sequence to Western European mathematics in 1200, although the\
    \ sequence had been described earlier in [Indian mathematics](http://en.wikipedia.org/wiki/Indian_mathematics).\n\
    \nFibonacci numbers are mathematically defined as:\n\n![](img/00028.jpeg)\n\n\
    ## Code\n\nIt is trivial to write a recursive solution directly derived from the\
    \ mathematical formulation. Here we provide an implementation where Fibonacci\
    \ is computed at compile time leveraging the power of templates.\n\n```cpp\ntemplate\
    \ <int N>\nstruct CTFibonacci {\n  static constexpr int value() {\n    return\
    \ CTFibonacci<N-1>::value() +\n    CTFibonacci<N-2>::value();\n  }\n};\n\ntemplate\
    \ <>\nstruct CTFibonacci<1> {\n  static constexpr int value() {\n    return 1;\n\
    \  }\n};\n\ntemplate <>\nstruct CTFibonacci<0> {\n  static constexpr int value()\
    \ {\n    return 0;\n  }\n};\n```\n\n## Complexity\n\nComplexity is here exponential\
    \ since ![](img/00029.jpeg). An alternative and more efficient solution memorizes\
    \ the intermediate results and it avoids to recompute the same sub-problem for\
    \ multiple times. A solution is:\n\n## Code\n\n```cpp\nunsigned int Fibonacci(unsigned\
    \ int n) {\n  int a, b, sum;\n  a = 0; b = 1; sum = a + b;\n  if (n <= 1) return\
    \ n;\n  for (unsigned int i = 2; i < n; ++i) {\n    a = b;\n    b = sum;\n   \
    \ sum = a + b;\n  }\n  return sum;\n}\n```\n\n## Complexity\n\nLinear in time\
    \ and constant in space.\n\n# 2. Binomial Coefficient\n\nThe binomial coefficient\
    \ indexed by ![](img/00002.jpeg) and ![](img/00005.jpeg) and denoted by ![](img/00030.jpeg)\
    \ is the coefficient of the ![](img/00031.jpeg) term in the polynomial expansion\
    \ of the binomial power ![](img/00032.jpeg). The value of this coefficient is\
    \ given by ![](img/00033.jpeg).\n\n## Solution\n\nComputing the binomial coefficient\
    \ directly from the closed formula ![](img/00034.jpeg) would be inefficient. However,\
    \ we can prove by induction that ![](img/00030.jpeg) = ![](img/00035.jpeg) and\
    \ we know that ![](img/00036.jpeg) and ![](img/00037.jpeg). Therefore, we have\
    \ a direct way to compute the binomial coefficient with dynamic programming. Note\
    \ that `Matrix` is a class defined in the appendix.\n\n## Code\n\n```cpp\nunsigned\
    \ int bin(unsigned int n, unsigned int k, Matrix<int> & table) {\n  std::cout\
    \ << \"n=\" << n << \" k=\" << k << std::endl;\n  if (n == 0) return 0;\n  if\
    \ (!table(n - 1, k - 1))\n    table(n - 1, k - 1) = bin(n - 1, k - 1, table);\n\
    \  if (!table(n - 1, k))\n    table(n - 1, k) = bin(n - 1, k, table);\n  return\
    \ table(n - 1, k - 1) + table(n - 1, k);\n}\n\nunsigned int binomial(unsigned\
    \ int n, unsigned int k) {\n  if (k == 0) return 1;\n  if (n == 0) return 0;\n\
    \  Matrix<int> table(n + 1, k + 1, 0);\n  for (unsigned int i = 0; i <= n; i++)\n\
    \    table(i , 0) = 1;\n  return bin(n, k, table);\n}\n```\n\n## Complexity\n\n\
    Linear in time ![](img/00038.jpeg). Space occupancy is ![](img/00039.jpeg).\n\n\
    # 3. Max sub-array problem - given an array of integers, compute the largest sum\
    \ continuous sub array\n\n## Solution\n\nThis problem is a little gem. An elegant\
    \ solution has been provided by Kadane.[[1]](#part0000.html). The key intuition\
    \ for this algorithm is illustrated by this picture: ![](img/00040.jpeg)! ![](img/00041.jpeg)!\
    \ ![](img/00042.jpeg)! ![](img/00043.jpeg) represents the maximum value before\
    \ analysing the current subsequence, while ![](img/00044.jpeg) represents the\
    \ maximum for the current subsequence. If ![](img/00045.jpeg), we violate the\
    \ continuity and therefore we can safely reset ![](img/00046.jpeg), a value which\
    \ represents the empty. If ![](img/00047.jpeg), then we have found a new maximum\
    \ and we can update the ![](img/00048.jpeg) accordingly:\n\n## Code\n\n```cpp\n\
    int maxArraySum(const std::vector<int> & v) {\n  int max_so_far = 0, max_ending_here\
    \ = 0;\n  for (unsigned int i = 0; i < v.size(); ++i) {\n    max_ending_here =\
    \ max_ending_here + v[i];\n    if (max_ending_here < 0)\n      max_ending_here\
    \ = 0;\n    if (max_so_far < max_ending_here)\n      max_so_far = max_ending_here;\n\
