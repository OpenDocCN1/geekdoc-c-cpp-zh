  trans: "\n动态规划（DP）追求只解决每个子问题一次，从而减少计算次数。在计算出给定子问题的解后，它会被存储在表中或进行“备忘”（memoized）。下一次需要相同的解时，只需查找即可。DP\
    \ 通过以下两种方法解决问题：\n\na) 自顶向下法（Top-down）：这是许多 DP 问题相关的递归数学定义的直接。\n\nb) 自底向上法（Bottom-up）：这需要对递归数学定义进行重新建模，首先解决子问题，并利用它们的解来构建并更大子问题的解。\n\
    \n在书中，我们将回顾一组动态规划问题、它们的解以及相关的 C++ 代码。其中许多问题在面试中经常被问到，可以在面试准备相关的互联网网站上频繁找到。\n\n\
    # 1. 斐波那契数\n\n## Solution\n\n 斐波那契数列的前两个数是 0 和 1，之后的每一个数都是前两个数的和。[列奥纳德·斐波那契](http://en.wikipedia.org/wiki/Leonardo_Fibonacci)\
    \ 在他的书[Liber Abaci](http://en.wikipedia.org/wiki/Liber_Abaci) 中于 1200 年将该序列引入西欧洲数学，尽管该序列早在[印度数学](http://en.wikipedia.org/wiki/Indian_mathematics)\
    \ 中就已经被描述过。\n\n斐波那契数的数学定义为：\n\n![](img/00028.jpeg)\n\n## Code\n\n直接从数学公式推导出递归解是轻而易举的。这里我们提供了一个实现，利用模板的力量在编译时计算斐波那契数。\n\
    \n```cpp\ntemplate <int N>\nstruct CTFibonacci {\n  static constexpr int value()\
    \ {\n    return CTFibonacci<N-1>::value() +\n    CTFibonacci<N-2>::value();\n\
    \  }\n};\n\ntemplate <>\nstruct CTFibonacci<1> {\n  static constexpr int value()\
    \ {\n    return 1;\n  }\n};\n\ntemplate <>\nstruct CTFibonacci<0> {\n  static\
    \ constexpr int value() {\n    return 0;\n  }\n};\n```\n\n## Complexity\n\n这里的复杂度是指数级的，因为\
    \ ![](img/00029.jpeg)。另一种更高效的解决方案记录了中间结果，避免了多次重复计算同一个子问题。其解为：\n\n## Code\n\n```cpp\n\
    unsigned int Fibonacci(unsigned int n) {\n  int a, b, sum;\n  a = 0; b = 1; sum\
    \ = a + b;\n  if (n <= 1) return n;\n  for (unsigned int i = 2; i < n; ++i) {\n\
    \    a = b;\n    b = sum;\n    sum = a + b;\n  }\n  return sum;\n}\n```\n\n##\
    \ Complexity\n\n时间上是线性的，空间上是常数的。\n\n# 2. 二项式系数\n\n由 ![](img/00002.jpeg) 和 ![](img/00005.jpeg)\
    \ 索引并由 ![](img/00030.jpeg) 表示的二项式系数，是二项幂 ![](img/00032.jpeg) 多项式展开中 ![](img/00031.jpeg)\
    \ 项的系数。该系数的值由 ![](img/00033.jpeg) 给出。\n\n## Solution\n\n直接从闭式公式 ![](img/00034.jpeg)\
    \ 计算二项式系数效率很低。然而，我们可以通过归纳证明 ![](img/00030.jpeg) = ![](img/00035.jpeg)，且我们知道 ![](img/00036.jpeg)\
    \ 和 ![](img/00037.jpeg)。因此，我们有一种直接的方法通过动态规划计算计算系数。注意 `Matrix` 是附录中定义的类。\n\n##\
    \ Code\n\n```cpp\nunsigned int bin(unsigned int n, unsigned int k, Matrix<int>\
    \ & table) {\n  std::cout << \"n=\" << n << \" k=\" << k << std::endl;\n  if (n\
    \ == 0) return 0;\n  if (!table(n - 1, k - 1))\n    table(n - 1, k - 1) = bin(n\
    \ - 1, k - 1, table);\n  if (!table(n - 1, k))\n    table(n - 1, k) = bin(n -\
    \ 1, k, table);\n  return table(n - 1, k - 1) + table(n - 1, k);\n}\n\nunsigned\
    \ int binomial(unsigned int n, unsigned int k) {\n  if (k == 0) return 1;\n  if\
    \ (n == 0) return 0;\n  Matrix<int> table(n + 1, k + 1, 0);\n  for (unsigned int\
    \ i = 0; i <= n; i++)\n    table(i , 0) = 1;\n  return bin(n, k, table);\n}\n\
    ```\n\n## Complexity\n\n时间上是线性的 ![](img/00038.jpeg)。空间占用为 ![](img/00039.jpeg)。\n\
    \n# 3. 最大子数组问题 - 给定一个整数数组，计算最大的连续子数组和\n\n## Solution\n\n这个问题非常精妙。Kadane 提供了一个优雅的解[[1]](#part0000.html)。该算法的核心直觉由这张图所示：![](img/00040.jpeg)!\
    \ ![](img/00041.jpeg)! ![](img/00042.jpeg)! ![](img/00043.jpeg) 代表在分析当前子序列之前的最大值，而\
    \ ![](img/00044.jpeg) 代表当前子序列的最大值。如果 ![](img/00045.jpeg)，我们就违反了连续性，因此可以安全地重置 ![](img/00046.jpeg)，该值代表空。如果\
    \ ![](img/00047.jpeg)，那么我们就找到了一个新的最大值，并相应地更新 ![](img/00048.jpeg)：\n\n## Code\n\
    \n```cpp\nint maxArraySum(const std::vector<int> & v) {\n  int max_so_far = 0,\
    \ max_ending_here = 0;\n  for (unsigned int i = 0; i < v.size(); ++i) {\n    max_ending_here\
    \ = max_ending_here + v[i];\n    if (max_ending_here < 0)\n      max_ending_here\
    \ = 0;\n    if (max_so_far < max_ending_here)\n      max_so_far = max_ending_here;\n\
    \  }\n  return max_so_far;\n}\n```\n\n```cpp\nint maxArraySum(const std::vector<int>\
    \ & v) {\n  int max_so_far = 0, max_ending_here = 0;\n  for (unsigned int i =\
    \ 0; i < v.size(); ++i) {\n    max_ending_here = max_ending_here + v[i];\n   \
    \ if (max_ending_here < 0)\n      max_ending_here = 0;\n    if (max_so_far < max_ending_here)\n\
    \      max_so_far = max_ending_here;\n  }\n  return max_so_far;\n}\n```\n*(注：原文提供的代码块似乎不完整或有误，此处根据逻辑进行了翻译并保持结构)*\n\
    \n修正后的逻辑代码块翻译：\n```cpp\nint maxArraySum(const std::vector<int> & v) {\n  int max_so_far\
    \ = 0, max_ending_here = 0;\n  for (unsigned int i = 0; i < v.size(); ++i) {\n\
