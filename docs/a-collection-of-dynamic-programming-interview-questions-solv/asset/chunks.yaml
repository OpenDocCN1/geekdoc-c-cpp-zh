    \ << str[i];\n\n }\n\n else  if (directions(i, j) == Upward)\n\n              \
    \ printLCS(directions, str, i - 1, j);\n\n else\n\n               printLCS(directions,\
    \ str, i, j - 1);\n\n}\n\nvoid LCS(const std::string& s1, const std::string& s2)\n\
    \n{\n\n const  unsigned  int m = s1.size() + 1;\n\n const  unsigned  int n = s2.size()\
    \ + 1;\n\n Matrix<unsigned  int> table(m, n, 0);\n\n Matrix<where> directions(m,\
    \ n);\n\n for (unsigned  int i = 1; i<m; i++)\n\n  for (unsigned  int j = 1; j<n;\
    \ j++)\n\n  if (s1[i] == s2[j])\n\n                             {\n\n              \
    \                             table(i, j) = table(i - 1, j - 1) + 1;\n\n directions(i,\
    \ j) = DiagonalUpward;\n\n                             }\n\n  else\n\n  if (table(i\
    \ - 1,j) >= table(i, j - 1))\n\n                                           {\n\
    \n                                                         table(i, j) = table(i\
    \ - 1, j);\n\n directions(i, j) = Upward;\n\n                                          \
    \ }\n\n  else\n\n                                           {\n\n              \
    \                                           table(i, j) = table(i, j - 1);\n\n\
    \ directions(i, j) = Downward;\n\n                                           }\n\
    \nprintLCS(directions, s1, m-1, n-1);\n\n}\n\nComplexity\n\nComplexity is![](images/00201.jpeg)\
