    \ size, while ![](images/00108.jpeg) can be computed in ![](images/00109.jpeg)\
    \ time.\n\n# 8. Eggs Drop – Given `k` eggs and `n` floors in a building, find\
    \ the minimum number of trials required to determine the lowest floor from which\
    \ an egg can be dropped without getting broken.\n\n Solution\n\nThis is a classical\
    \ puzzle, frequently asked during interviews. Let ![](images/00110.jpeg) be the\
    \ minimum number of attempts given ![](images/00005.jpeg) eggs and `n` floors.\
    \ A dynamic solution can be computed by considering that when we drop an egg from\
    \ floor `f` there are only two possible outcomes:\n\na) If the egg breaks, then\
    \ we have ![](images/00111.jpeg) eggs and we need to check the ![](images/00112.jpeg)\
    \ floor\n\nb) If the egg does not break, then we have ![](images/00005.jpeg) eggs\
    \ and the remaining ![](images/00113.jpeg) floors left\n\nSince we want to minimize\
    \ the number of attempts, in the worst scenario we have to consider the maximum\
    \ between a) and b). The relation then becomes:\n\n![](images/00114.jpeg)\n\n\
    ![](images/00115.jpeg)\n\nThe base case are: ![](images/00116.jpeg) because if\
    \ we have only one egg then we have no other option but to climb the floors one\
    \ by one, and ![](images/00117.jpeg) because if we have only one floor then we\
    \ just need to check it. In addition, we can define ![](images/00118.jpeg) and\
    \ ![](images/00119.jpeg) because those are borderline cases.\n\nThis characterization\
    \ leads to a straightforward recursion implementation given below where we memorize\
    \ partial solutions in a support ![](images/00120.jpeg) for avoiding the recompute\
    \ those solutions again and again.\n\n## Code\n\n```cpp\nint eggDropHelper(unsigned\
    \ int k, unsigned int n, Matrix<int> & table)\n{\n  if (n == 1 || n == 0)\n  \
    \  return n;\n  if (k == 1)\n    return n;\n  if (!k)\n    return 0;\n  unsigned\
    \ int min = std::numeric_limits<unsigned int>::max();\n  unsigned int res;\n \
    \ for (unsigned int f = 1; f <= n; ++f)\n  {\n    res = std::max(\n      ((table(k\
    \ - 1, f - 1) == -1) ? table(k - 1, f - 1) = eggDropHelper(k - 1, f - 1, table)\
    \ : table(k - 1, f - 1)),\n      (table(k, n - f) == -1) ? table(k, n - f) = eggDropHelper(k,\
    \ n - f, table) : table(k, n - f))\n    );\n    if (res < min)\n      min = res;\n\
    \  }\n  return min + 1;\n}\n\nint eggDrop(unsigned int k, unsigned int n)\n{\n\
    \  Matrix<int> table(k + 1, n + 1, -1);\n  return eggDropHelper(k, n, table);\n\
    }\n```\n\n## Complexity\n\nThe DP solution is left as exercise. A straightforward\
    \ implementation needs ![](images/00121.jpeg) entries in a table where each entry\
    \ is computed at most ![](images/00008.jpeg) times. Time complexity can be reduced\
    \ to ![](images/00122.jpeg), if we consider that the optimal floor ![](images/00123.jpeg)\
    \ for ![](images/00124.jpeg) is certainly equal or larger than the one for ![](images/00125.jpeg),\
    \ so we can avoid to restart computation. Also, it could be useful to prove that\
    \ the function ![](images/00127.jpeg) is convex so the minimum is unique and can\
    \ be computed with a linear scan.\n\n# 9. Jump Stairs – There is a stair with\
    \ `n` steps. You can climb either one step or two steps. How many different ways\
    \ are to climb the stair?\n\n## Solution\n\nLet’s try a number of examples: If\
    \ we have only one step, then there is only a way to climb the stair; if we have\
    \ two steps, then there are two ways (e.g. 1 step, or 2 steps); if we have three\
    \ steps, then there are three ways. More examples are given in the following table:\n\
    \n| Steps | #Confs | Configurations |\n| :--- | :--- | :--- |\n| 1 | 1 | 1 |\n\
    | 2 | 2 | (1, 1); (2) |\n| 3 | 3 | (1, 1, 1); (1, 2); (2, 1) |\n| 4 | 5 | (1,\
    \ 1, 1, 1); (2, 1, 1); (1, 2, 1); (1, 1, 2); (2, 2) |\n| 5 | 8 | (1, 1, 1, 1,\
    \ 1); (2, 1, 1, 1); (1, 2, 1, 1); (1, 1, 2, 1); (1, 1, 1, 2); (2, 2, 1); (1, 2,\
    \ 2); (2, 1, 2) |\n\nWe notice that there is a pattern: at each step the number\
    \ of configurations is the sum of configurations of the previous and last steps\
    \ one. Mathematically:\n\n![](images/00128.jpeg)\n\nThis formula has a straightforward\
    \ interpretation: we jump to the `n` step either from ![](images/00129.jpeg) step\
    \ or from ![](images/00130.jpeg) step. Note that the base cases are different\
    \ with respect to Fibonacci.\n\n## Code\n\n```cpp\nunsigned long jump(unsigned\
    \ int n)\n{\n  if (n == 1) return 1;\n  if (n == 2) return 2;\n  unsigned long\
    \ current = 0, prev = 2, prevPrev = 1;\n  for (unsigned int i = 3; i <= n; i++)\n\
    \  {\n    current = prev + prevPrev;\n    prevPrev = prev;\n    prev = current;\n\
    \  }\n  return current;\n}\n```\n\n## Complexity\n\nLinear in the input size.\n\
    \n# 10. Jumping Array – Given an array of non-negative numbers, start at the first\
    \ element and reach the end with a minimum number of jumps. A jump cannot exceed\
    \ the length contained in the current position.\n\n## Solution\n\nGiven the array\
    \ ![](images/00131.jpeg)], the base cases are when ![](images/00132.jpeg) or when\
    \ ![](images/00133.jpeg). For those cases, we have no solution. Otherwise, the\
    \ mathematical formulation can be computed for each position ![](images/00076.jpeg)\
    \ by finding the maximum jump length for position ![](images/00134.jpeg) such\
    \ that the required constrain ![](images/00135.jpeg) is not violated. Mathematically\
    \ ![](images/00136.jpeg).\n\n## Code\n\n```cpp\nunsigned int jump(const unsigned\
    \ int a[], unsigned int n)\n{\n  std::vector<unsigned int> result(n);\n  if (n\
    \ == 0 || a[0] == 0)\n    return std::numeric_limits<unsigned int>::max();\n \
    \ result[0] = 0;\n  for (unsigned int i = 1; i < n; ++i)\n  {\n    for (unsigned\
    \ int j = 0; j < i; j++)\n    {\n      if (a[j] >= (i - j) && result[j] + 1 <\
    \ result[i])\n        result[i] = result[j] + 1;\n    }\n  }\n  return result[n\
    \ - 1];\n}\n```\n\n## Complexity\n\nLinear in time and space\n\n# 11. Dice – Given\
    \ `n` dice, count how many ways to get sum `s`.\n\n## Solution\n\nLet’s suppose\
    \ that each die has `m` faces and define a function ![](images/00137.jpeg) which\
    \ counts many ways we have to get sum ![](images/00138.jpeg) with ![](images/00002.jpeg)\
    \ dice. We can compute this function starting from the result with ![](images/00129.jpeg)\
    \ dice. In particular, if we get a sum ![](images/00139.jpeg) from ![](images/00129.jpeg)\
    \ dice we need to add ![](images/00140.jpeg) for each ![](images/00141.jpeg):\n\
    \nNote that we have ![](images/00142.jpeg) terms in this sum. We use a support\
    \ ![](images/00145.jpeg) where we store the current sum and the current dice.\
    \ The base case is with one die and in this case there is only one way to get\
    \ the sum ![](images/00146.jpeg) therefore ![](images/00147.jpeg). Then, for each\
    \ possible sum ![](images/00148.jpeg) and for possible dice ![](images/00149.jpeg)\
    \ and for each possible value produced by a die ![](images/00150.jpeg) we update\
    \ ![](images/00151.jpeg) according to the above definition.\n\n## Code\n\n```cpp\n\
    unsigned long playDices(unsigned int n, unsigned int m, unsigned int s)\n{\n \
    \ if ((n == 0) || (m < 2) || (s == 0) || (n*m < s))\n    return 0;\n  Matrix<int>\
    \ mem(s + 1, n + 1, 0);\n  for (unsigned i = 1; i <= m && i <= s; ++i)\n    mem(i,\
    \ 1) = 1;\n  for (unsigned i = 1; i <= s; ++i)\n    for (unsigned j = 2; j <=\
    \ n; ++j)\n      for (unsigned k = 1; k <= m && k < i; ++k)\n        mem(i, j)\
    \ += mem(i - k, j - 1);\n  return mem(s, n);\n}\n```\n\n## Complexity\n"
