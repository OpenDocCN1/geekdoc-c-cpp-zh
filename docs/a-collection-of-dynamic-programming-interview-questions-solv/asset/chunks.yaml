  trans: "\n一个物品可以放入背包，也可以不放入：如果放入 ![](img/00058.jpeg) 物品，则背包中的总价值将增加 ![](img/00059.jpeg)，而容量\
    \ ![](img/00060.jpeg) 将减少 ![](img/00061.jpeg)。如果不放入该物品，则容量将保持不变。这意味着解决方案可以通过递归获得。在数学上，我们可以定义为：\n\
    \n![](img/00062.jpeg)\n\n![](img/00063.jpeg)\n\n在剩余部分，我们提供了两种不同的解决方案：第一种是自上而下的递归，第二种是基于动态规划的，通过在辅助数组![](img/00064.jpeg)\
    \ 中存储部分结果来自下而上构建。\n\n### Code\n\n```cpp\nunsigned int knapRecursive(const unsigned\
    \ int C,\nconst unsigned int w[],\nconst unsigned int v[],\nconst unsigned int\
    \ n)\n{\n  if (n == 0 || C == 0)\n    return 0;\n  if (w[n - 1] > C)\n    return\
    \ knapRecursive(C, w, v, n - 1);\n  else\n    return std::max(v[n - 1] + knapRecursive(C\
    \ - w[n - 1], w, v, n - 1),\n                     knapRecursive(C, w, v, n - 1));\n\
    }\n\nunsigned int knapSack(const unsigned int C,\nconst unsigned int w[],\nconst\
    \ unsigned int v[],\nconst unsigned int n)\n{\n  Matrix<unsigned int> table(n\
    \ + 1, C + 1);\n  for (unsigned int i = 0; i <= n; ++i)\n    for (unsigned int\
    \ j = 0; j <= C; ++j)\n    {\n      if (i == 0 || j == 0)\n        table(i, j)\
    \ = 0;\n      else if (w[i - 1] <= j)\n        table(i, j) = std::max(v[i - 1]\
    \ + table(i - 1, j - w[i - 1]),\n                                table(i - 1,\
    \ j));\n      else\n        table(i, j) = table(i - 1, j);\n    }\n  return table(n,\
    \ C);\n}\n```\n\n### Complexity\n时间上为伪线性 ![](img/00065.jpeg)，在空间上为伪线性 ![](img/00065.jpeg)\n\
