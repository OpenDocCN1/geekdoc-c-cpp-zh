    . The longest common suffix is:\n\n![](images/00197.jpeg)\n\nGiven![](images/00198.jpeg),\
    \ we can compute the longest common substring because the maximal of the longest\
    \ common suffixes of all possible prefixes is the longest common substring of\
    \ S1 and T1.\n\n![](images/00199.jpeg)\n\n![](images/00200.jpeg)\n\nCode\n\nint\
    \ LCSubStr(const std::string & S1, const std::string & S2)\n\n{\n\n unsigned \
    \ int m = S1.length();\n\n unsigned  int n = S2.length();\n\n unsigned  int result\
    \ = 0;\n\n Matrix<unsigned  int> LCSuff(m + 1, n + 1);\n\n for (unsigned  int\
