    \ where ![](images/00251.jpeg) is the sum of elements in the vector.\n\n# 23.\
    \ Segment Partition – Given a segment of integer length![](images/00153.jpeg)n,\
    \ cut it into different integer parts in such a way to maximize the product of\
    \ the lengths of all parts.\n\n### Solution\nWe can split the segment for all\
    \ the integer positions and compute the max product of the two parts. If we split\
    \ it in position![](images/00093.jpeg), then the product is![](images/00252.jpeg).\
    \ In addition, the part![](images/00253.jpeg) can be further split. So the product\
    \ can be reclusively computed as![](images/00254.jpeg). The base cases are![](images/00255.jpeg).\n\
    \n### Code\n```cpp\nunsigned int segment(unsigned int n)\n{\n    if (n == 0 ||\
    \ n == 1) return 0;\n    unsigned int m = 0;\n    for (unsigned int i = 1; i <\
    \ n; i++)\n        m = std::max(m, std::max(i * (n - i), segment(n - i) * i));\n\
    \    return m;\n}\n\nunsigned int segmentDPhelper(unsigned int n, std::vector<unsigned\
    \ int> & seg)\n{\n    unsigned int m = 0;\n    for (unsigned int i = 1; i < n;\
    \ i++)\n    {\n        if (!seg[n - i])\n            seg[n - i] = segmentDPhelper(n\
    \ - i, seg);\n        m = std::max(m, std::max(i * (n - i), seg[n - i] * i));\n\
    \    }\n    return m;\n}\n\nunsigned int segmentDP(unsigned int n)\n{\n    if\
    \ (n == 0 || n == 1) return 0;\n    std::vector<unsigned int> seg(n, 0);\n   \
    \ return segmentDPhelper(n, seg);\n}\n```\n\n### Complexity\nLinear in time and\
    \ space\n\n# 24. Cutting a Rod – given a rod of length $n$ and a vector of prices\
    \ for different lengths, cut the rod for maximizing the gain\n\n### Solution\n\
    The idea is very similar to the one of the previous problem. Let’s suppose to\
