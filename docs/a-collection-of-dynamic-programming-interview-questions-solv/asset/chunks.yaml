    \ In the code the vector ![](images/00106.jpeg) will contain final decreasing\
    \ values containing the residuals for each word added to a given line. The values\
    \ will increase again anytime that there is a need to change line.\n\nCode\n\n\
    void neatPrint(std::vector<unsigned  int> & M,\n\n  const std::vector<unsigned\
    \  int> & length,\n\n  unsigned  int  max, int  n)\n\n{\n\nint penalty;\n\n  for\
    \ (int i = 0; i < n; i++)\n\n               {\n\n penalty = max - length[i];\n\
    \n  M[i] = std::min(M[i], (i - 1 < 0 ? 0 : M[i - 1]) +\n\n                            \
