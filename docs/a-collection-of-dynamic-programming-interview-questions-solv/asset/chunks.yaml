    \ + 1);\n\n  if (penalty < 0)\n\n  break; // generate next line\n\n  M[i] = std::min(M[i],\n\
    \n((j - 1 < 0) ? 0 : M[j - 1]) +\n\n                                          \
    \               (1 << penalty));\n\n                             }\n\n              \
    \ }\n\n}\n\nvoid solveNeatPrint(const std::vector<unsigned  int> & length, unsigned\
    \  int  max)\n\n{\n\n int n = length.size();\n\n std::vector<unsigned  int> M(n,\n\
    \nstd::numeric_limits<unsigned  int>::max());\n\n neatPrint(M, length, max, n);\n\
    \n for (int i = 0; i < n; ++i)\n\n std::cout << M[i] << ' ';\n\n std::cout <<\
