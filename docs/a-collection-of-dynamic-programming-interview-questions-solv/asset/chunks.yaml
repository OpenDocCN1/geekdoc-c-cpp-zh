  trans: "\n注意，![](img/00107.jpeg) 可以在输入大小的线性时间内计算，而 ![](img/00108.jpeg) 可以在 ![](img/00109.jpeg)\
    \ 时间内计算。\n\n# 8. 鸡蛋掉落问题 – 给定 `k` 个鸡蛋和一栋楼的 `n` 层楼，找到所需的最小尝试次数，以确定鸡蛋掉落不会碎的最低楼。\n\
    \n 解决方案\n\n这是一个经典的谜题，经常在面试中遇到。令 ![](img/00110.jpeg) 为给定 ![](img/00005.jpeg) 个鸡蛋和\
    \ `n` 层楼时的最小尝试次数。可以通过考虑以下情况来计算动态解：当我们从第 `f` 层楼掉落一个蛋时，只有两种可能的结果：\n\na) 如果蛋碎了，那么我们剩下\
    \ ![](img/00111.jpeg) 个蛋，并且我们需要检查 ![](img/00112.jpeg) 层楼\n\nb) 如果蛋没有碎，那么我们还有 ![](img/00005.jpeg)\
    \ 个蛋，并且还剩下 ![](img/00113.jpeg) 层楼\n\n由于我们想让尝试次数最小化，在最坏的情况下，我们必须考虑 a) 和 b) 之间的最大值。关系变为：\n\
    \n![](img/00114.jpeg)\n\n![](img/00115.jpeg)\n\n基础情况是：![](img/00116.jpeg)，因为如果我们只有一个蛋，除了逐一层爬楼外没有其他选择；以及\
    \ ![](img/00117.jpeg)，因为如果我们只有一层楼，我们只需要检查它即可。此外，我们可以定义 ![](img/00118.jpeg) 和 ![](img/00119.jpeg)，因为这些是边界情况。\n\
    \n这种刻描述导致了下文的直接递归实现，我们在支持矩阵 ![](img/00120.jpeg) 中记录了部分解，以避免反复计算这些解。\n\n## 代码\n\
    \n```cpp\nint eggDropHelper(unsigned int k, unsigned int n, Matrix<int> & table)\n\
    {\n  if (n == 1 || n == 0)\n    return n;\n  if (k == 1)\n    return n;\n  if\
    \ (!k)\n    return 0;\n  unsigned int min = std::numeric_limits<unsigned int>::max();\n\
    \  unsigned int res;\n  for (unsigned int f = 1; f <= n; ++f)\n  {\n    res =\
    \ std::max(\n      ((table(k - 1, f - 1) == -1) ? table(k - 1, f - 1) = eggDropHelper(k\
    \ - 1, f - 1, table) : table(k - 1, f - 1)),\n      (table(k, n - f) == -1) ?\
    \ table(k, n - f) = eggDropHelper(k, n - f, table) : table(k, n - f))\n    );\n\
    \    if (res < min)\n      min = res;\n  }\n  return min + 1;\n}\n\nint eggDrop(unsigned\
    \ int k, unsigned int n)\n{\n  Matrix<int> table(k + 1, n + 1, -1);\n  return\
    \ eggDropHelper(k, n, table);\n}\n```\n\n## 复杂度\n\nDP 解决方案留作了练习。直接的实现需要在表中包含 ![](img/00121.jpeg)\
    \ 条目，每个条目最多被计算 ![](img/00008.jpeg) 次。如果我们考虑到 ![](img/00124.jpeg) 的最优楼 ![](img/00123.jpeg)\
    \ 定大于或等于 ![](img/00125.jpeg)，时间复杂度可以降低到 ![](img/00122.jpeg)。此外，证明函数 ![](img/00127.jpeg)\
    \ 是凸的可能有用，这样最小值是唯一的可以通过线性扫描计算。\n\n# 9. 爬楼梯 – 有一个 `n` 阶的楼梯。你可以向上爬一层或两阶。有多少种不同的方法爬楼梯？\n\
    \n## 解决方案\n\n让我们尝试几个例子：如果我们只有一层，那么只有一种爬楼的方法；如果有两阶，就有两种方法（例如 1 阶或 2 阶）；如果有三阶，就有三\
    \ 方法。下表提供了更多示例：\n\n| 阶数 | 组合数 | 组合配置 |\n| :--- | :--- | :--- |\n| 1 | 1 | 1 |\n\
    | 2 | 2 | (1, 1); (2) |\n| 3 | 3 | (1, 1, 1); (1, 2); (2, 1) |\n| 4 | 5 | (1,\
    \ 1, 1, 1); (2, 1, 1); (1, 2, 1); (1, 1, 2); (2, 2) |\n| 5 | 8 | (1, 1, 1, 1,\
    \ 1); (2, 1, 1, 1); (1, 2, 1, 1); (1, 1, 2, 1); (1, 1, 1, 2); (2, 2, 1) |\n\n\
    我们注意到在每一步，组合数都是之前步骤之和。![](img/0128.jpeg)\n\n这个公式有一个直观的解释：在 ![](img/0128.jpeg)\
    \ 这一步，是从 ![](img/0129.jpeg) 这一步过来的。注意基础情况是 ![](img/0129.jpeg)。\n\n## 代码\n\n```cpp\n\
    unsigned long jump(unsigned int n)\n{\n  if (n == 1) return 1;\n  if (n == 2)\
    \ return 2;\n  unsigned long current = 0, prev = 2;\n  for (unsigned int i = 3;\
    \ i <= n; i++)\n  {\n    current = prev;\n    prev = current;\n  }\n  return current;\n\
    }\n```\n\n## 复杂度\n\n相对于输入大小是线性的\n\n10. 跳跃数组 – 给定一个非负数组，从数组开始到达终点的最小跳跃次数。跳跃不能超过数组长度\n\
    \n## 解决方案\n\n对于 ![](img/0131.jpeg)，基础情况是当 ![](img/0132.jpeg) 且不满足 ![](img/0133.jpeg)。否则，可以通过为\
    \ ![](img/0134.jpeg) 的每个位置 ![](img/0135.jpeg) 来计算公式。数学上是 ![](img/0136.jpeg)。\n\
    \n## 代码\n\n```cpp\nunsigned int jump(const int a[], unsigned int n)\n{\n  std::vector<unsigned\
    \ int> result(n);\n  if (n == 0 || a[0] == 0)\n    return std::numeric_limits<unsigned\
    \ int>::max();\n  result[0] = 0;\n  for (unsigned int i = 1; i < n; ++i)\n  {\n\
    \    for (unsigned int j = 0; j < i; j++)\n    {\n      if (a[j] >= i - j)\n \
    \       result[i]++;\n    }\n  }\n  return result[n - 1];\n}\n```\n\n 11. 骰子 –\
    \ 给定 `n` 颗骰子，计算有多少种方法得到总和 `s`。\n\n## 解决方案\n\n假设每颗骰子有 `m` 面，并定义一个函数 ![](img/0137.jpeg)，计算使用\
    \ ![](img/0138.jpeg) 颗骰子得到总和的方法。我们可以从 1 颗 ![](img/0139.jpeg) 开始计算这个函数。特别是对于 ![](img/0139.jpeg)\
    \ 得到总和 ![](img/0140.jpeg)，我们需要为每个 ![](img/0141.jpeg) 颗骰子增加项。注意在这个总和中有 ![](img/0142.jpeg)\
    \ 项。我们使用一个支持矩阵 ![](img/0145.jpeg) 来存储当前总和和当前骰子数。基础情况是 1 颗骰子，在这种情况下只有一种方法得到总和 ![](img/0146.jpeg)。然后，对于每个可能的总和\
    \ ![](img/0147.jpeg) 和可能的骰子数 ![](img/0148.jpeg)，以及每个骰子产生的每个可能值 ![](img/0149.jpeg)，我们根据上述定义更新\
    \ ![](img/0150.jpeg)。\n\n## 代码\n\n```cpp\nunsigned long playDices(unsigned int\
    \ n, unsigned int m, unsigned int s)\n{\n  if ((n == 0) || (m < 2) || (s == 0)\
    \ || (n*m < s))\n    return 0;\n  Matrix<int> mem(s + 1, n + 1, 0);\n  for (unsigned\
    \ int i = 1; i <= m && i <= s; ++i)\n    mem(i, 1) = 1;\n  for (unsigned int i\
    \ = 1; i <= s; ++i)\n    for (unsigned int j = 2; j <= n; ++j)\n      for (unsigned\
    \ int k = 1; k <= m && k < i; ++k)\n        mem(i, j) += mem(i - k, j - 1);\n\
    \  return mem(s, n);\n}\n```\n\n## 复杂度\n\n在时间和空间\n"
- fmt: "\n# 12. Coin Change – Given n dollars, how many different ways there are to\
    \ make the change into a set of coins![](images/00153.jpeg)?\n\n## Solution\n\n\
    Let’s define ![](images/00154.jpeg) and let `f(n, S, t)` ![](images/00155.jpeg)\
    \ be the change for ![](images/00002.jpeg) dollars given a set `S` ![](images/00156.jpeg)\
    \ of coins ![](images/00157.jpeg). We suppose to have an infinite amount of each\
    \ type of coin![](images/00158.jpeg). A coin ![](images/00159.jpeg) can either\
    \ be part of the change or not. This simple observation is used for a dynamic\
    \ programming solution.\n\n![](images/00160.jpeg)\n\nwhere `f(n, S, t)` ![](images/00161.jpeg)\
    \ counts when the coin ![](images/00159.jpeg) has been not selected, while `f(n,\
    \ S, t-1)` ![](images/00162.jpeg) counts the selection of a new coin ![](images/00158.jpeg).\
    \ The base cases are for `f(0, S, t)` ![](images/00163.jpeg) where the only solution\
    \ is not to change any money, `f(n, S, t)` ![](images/00164.jpeg) for ![](images/00165.jpeg)\
    \ where there is no solution because we have a negative amount of money![](images/00166.jpeg)\
    \ and `f(n, S, -1)` ![](images/00167.jpeg) because we have money but there is\
    \ no change available. The first implementation is recursive, while the second\
    \ is based on dynamic programming.\n\n## Code\n\n```cpp\nint changeCoin(int n,\
    \ const unsigned int S[], int t)\n{\n  if (n == 0)\n    return 1;\n  if ((n<0)\
    \ || (t < 0 && n > 0))\n    return 0;\n  return changeCoin(n, S, t - 1) + changeCoin(n\
    \ - S[t], S, t);\n}\n\nint changeCoinDP(unsigned int n, const unsigned int S[],\
    \ unsigned int t)\n{\n  Matrix<unsigned int> table(n + 1, t);\n  for (unsigned\
    \ int j = 0; j < t; ++j)\n    table(0, j) = 1;\n  for (unsigned int i = 1; i <=\
    \ n; ++i)\n    for (unsigned int j = 0; j < t; ++j)\n      table(i, j) = ((i >=\
    \ S[j]) ? table(i - S[j], j) : 0) + ((j>0) ? table(i, j - 1) : 0);\n  return table(n,\
    \ t-1);\n}\n```\n\n## Complexity\n\nTime complexity is ![](images/00168.jpeg)\n\
    \n# 13. Longest Palindrome String – Given a string, compute the longest palindromic\
    \ substring\n\nA string is palindromic if it is read the same backward and forward,\
    \ as Madam, I’m Adam or Poor Dan is in a droop.\n\n## Solution\n\nA solution can\
    \ be computed for the string ![](images/00169.jpeg) by considering that ![](images/00170.jpeg)\
    \ and ![](images/00171.jpeg).\n\nThis definition computes the longest palindromic\
    \ substring by starting from the whole string ![](images/00172.jpeg) and it is\
    \ easy to directly write the code implementing this recursive formulation.\n\n\
    However, another more convenient approach is to define `P(i, j)` ![](images/00173.jpeg)\
    \ if the string is palindromic for ![](images/00174.jpeg). The following base\
    \ cases hold for single characters and for couple of characters:\n\n![](images/00175.jpeg)\n\
    \nIn addition, we can define the recurrence `P(i, j)` ![](images/00176.jpeg) for\
    \ increasing lengths ![](images/00177.jpeg) where `P(i, j)` ![](images/00178.jpeg)\
    \ and `P(i+1, j-1)` ![](images/00179.jpeg).\n\nNote that with this definition\
    \ the interval `[i, j]` ![](images/00180.jpeg) is contained in the interval `[i+1,\
    \ j-1]` ![](images/00181.jpeg) and therefore we just need to test the two characters\
    \ in the border ![](images/00182.jpeg)). The code keep tracks of the starting\
    \ position where the palindromic string begins (![](images/00183.jpeg)) and its\
    \ length (![](images/00184.jpeg)).\n\n## Code\n\n```cpp\nstd::string longestPalindrome(const\
    \ std::string & s) {\n  unsigned int n = s.length();\n  if (n == 0)\n    return\
    \ s;\n  unsigned int longestStart = 0;\n  unsigned int maxLen = 1;\n  Matrix<unsigned\
    \ int> table(n, false);\n  for (unsigned int i = 0; i < n; ++i)\n    table(i,\
    \ i) = true;\n  for (unsigned int i = 0; i < n - 1; ++i) {\n    if (s[i] == s[i\
    \ + 1]) {\n      table(i, i + 1) = true;\n      longestStart = i;\n      maxLen\
    \ = 2;\n    }\n  }\n  for (unsigned int len = 3; len <= n; ++len) {\n    for (unsigned\
    \ int i = 0; i < n - len + 1; ++i) {\n      unsigned int j = i + len - 1;\n  \
    \    if (table(i + 1, j - 1) && s[i] == s[j]) {\n        table(i, j) = true;\n\
    \        if (len > maxLen) {\n          longestStart = i;\n          maxLen =\
    \ len;\n        }\n      }\n    }\n  }\n  return s.substr(longestStart, maxLen);\n\
    }\n```\n\n## Complexity\n\nComplexity is ![](images/0185.jpeg) and space is ![](images/0185.jpeg).\
    \ Providing a solution with reduced space is left as exercise.\n\n# 14. String\
    \ Palindromes – Given a string, find the minimum number of characters to be inserted\
    \ for converting the string into a palindrome\n\n## Solution\n\nConsider the string\
    \ ![](images/00186.jpeg) and define `f(s, l, r)` ![](images/00187.jpeg) as the\
    \ number of characters to be inserted for getting a palindrome. We have:\n\n![](images/00188.jpeg)\n\
    \nThe base case are `f(s, l, r)` ![](images/00189.jpeg) if `r <= l` ![](images/00190.jpeg)\
    \ and `f(s, l, l+1)` ![](images/00191.jpeg).\n\nA dynamic programming implementation\
    \ can be realized by adopting a `table[n][n]` ![](images/00192.jpeg) which stores\
    \ the minimum number of insertions needed to convert ![](images/00186.jpeg) into\
    \ a palindrome. The table is filled in by incremental gap such that ![](images/00193.jpeg)\
    \ and by considering the subintervals contained between the positions ![](images/00194.jpeg),(images/00195.jpeg).\n\
    \n## Code\n\n```cpp\nunsigned int numInsertionPaly(const std::string & str, unsigned\
    \ int l, unsigned int r)\n{\n  if (r <= l)\n    return 0;\n  if (l == r - 1)\n\
    \    return (str[l] == str[r]) ? 0 : 1;\n  if (str[l] == str[r])\n    return numInsertionPaly(str,\
    \ l + 1, r - 1);\n  else\n    return (std::min(numInsertionPaly(str, l + 1, r),\
    \ numInsertionPaly(str, l, r - 1)) + 1);\n}\n\nint minInsertionsPalindromeDP(const\
    \ std::string & str)\n{\n  unsigned int n = str.length();\n  Matrix<unsigned int>\
    \ table(n + 1, n + 1, 0);\n  unsigned int gap, left, right;\n  for (gap = 1; gap\
    \ < n; ++gap)\n    for (left = 0, right = gap; right < n; ++left, ++right)\n \
    \     table(left, right) = (str[left] == str[right]) ? table(left + 1, right -\
    \ 1) : (std::min(table(left, right - 1), table(left + 1, right)) + 1);\n  return\
    \ table(0, n - 1);\n}\n```\n\n## Complexity\n\nComplexity is ![](images/00196.jpeg)\
    \ in time and space\n\n# 15. LCS – Given two strings S1 and i, find the longest\
    \ substring\n\nThe longest common substring problem consists in finding the longest\
    \ string that is a substring of two strings.\n\n## Solution\n\nOn way to solve\
    \ the problem is to find the longest common suffix for all the pairs of prefixes\
    \ for the strings ![](images/00010.jpeg) and S2. The longest common suffix is:\n\
    \n![](images/00197.jpeg)\n\nGiven ![](images/00198.jpeg), we can compute the longest\
    \ common substring because the maximal of the longest common suffixes of all possible\
    \ prefixes is the longest common substring of S1 and T.\n\n![](images/00199.jpeg)\n\
    ![](images/00200.jpeg)\n\n## Code\n\n```cpp\nint LCSubStr(const std::string &\
    \ S1, const std::string & S2)\n{\n  unsigned int m = S1.length();\n  unsigned\
    \ int n = S2.length();\n  unsigned int result = 0;\n  Matrix<unsigned int> LCSuff(m\
    \ + 1, n + 1);\n  for (unsigned int i = 0; i <= m; i++) {\n    for (unsigned int\
    \ j = 0; j <= n; j++) {\n      if (i == 0 || j == 0) {\n        LCSuff(i, j) =\
    \ 0;\n      } else if (S1[i - 1] == S2[j - 1]) {\n        result = std::max((LCSuff(i,\
    \ j) = LCSuff(i - 1, j - 1) + 1), result);\n      } else {\n        LCSuff(i,\
    \ j) = 0;\n      }\n    }\n  }\n  return result;\n}\n```\n\n## Complexity\n\n"
