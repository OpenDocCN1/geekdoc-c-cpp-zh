    \nSum subset problem is and important problem in computer science with application\
    \ in cryptography and complexity[[5]](#part0000.html__ftn5). The problem is NP-Complete.\
    \ The most naïve solution generates all the subsets and for each of them it checks\
    \ whether the sum is the right number. The complexity is ![](images/00238.jpeg)\
    \ where ![](images/00239.jpeg)the size of the array.  \n\nWe can use Dynamic programming\
    \ for providing a pseudo-polynomial solution. First, if the sum is odd there is\
    \ no solution, while if the sum is even we can try to find a subset. Second, if\
    \ the current element is larger than the sum we must skip it, otherwise we can\
    \ decide whether we want to include it or not. Therefore ![](images/00240.jpeg)\
    \ depends on![](images/00241.jpeg), if we don't include the element ![](images/00242.jpeg)\
    \ for the position ![](images/00243.jpeg) and for the current sum value![](images/00244.jpeg).\
    \ While it depends on ![](images/00245.jpeg) if we include the element.\n\n![](images/00246.jpeg)\n\
    \nThe base cases are ![](images/00247.jpeg) because there is always a subset with\
    \ zero sum, and ![](images/00248.jpeg) because the empty set cannot have a subset\
    \ of sum![](images/00093.jpeg). The code implements a recursive and a dynamic\
    \ programming solution\n\nCode\n\nbool isSubsetSum(const std::vector<unsigned\
    \  int> & v,\n\nconst  unsigned  int  n, unsigned  int  sum)\n\n{\n\n if (n ==\
    \ 0 && sum != 0)\n\n  return  false;\n\n if (sum == 0)\n\n  return  true;\n\n\
    \ if (v[n - 1] > sum)\n\n  return isSubsetSum(v, n - 1, sum);\n\n return isSubsetSum(v,\
    \ n - 1, sum) ||\n\nisSubsetSum(v, n - 1, sum - v[n - 1]);\n\n}\n\nbool partition(const\
    \ std::vector<unsigned  int> & v,\n\nunsigned  int  n)\n\n{\n\n int sum = std::accumulate(v.begin(),\
    \ v.end(), 0);\n\n if (sum % 2 != 0)\n\n  return  false;\n\n return isSubsetSum(v,\
    \ n, sum / 2);\n\n}\n\nbool isSubsetSumDP(const std::vector<unsigned  int> & v,\n\
    \nconst  unsigned  int  n, unsigned  int  sum)\n\n{\n\n Matrix<bool> subset(sum\
    \ + 1, n + 1);\n\n for (unsigned  int j = 0; j <= n; j++)\n\n subset(0, j) = true;\n\
    \n for (unsigned  int i = 1; i <= sum; i++)\n\n subset(i, 0) = false;\n\n for\
    \ (unsigned  int i = 1; i <= sum; i++)"
