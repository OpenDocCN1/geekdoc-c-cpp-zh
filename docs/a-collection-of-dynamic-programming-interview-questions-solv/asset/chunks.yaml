    \ int> & cut)\n{\n    unsigned int m = 0;\n    for (unsigned int i = 1; i < n;\
    \ i++)\n    {\n        if (!cut[n - i - 1])\n            cut[n - i - 1] = cutDPhelper(price,\
    \ n - i - 1, cut);\n        m = std::max(m, price[i] + cut[n - i - 1]);\n    }\n\
    \    return m;\n}\n\nunsigned int cutDP(const std::vector<unsigned int> & price,\
    \ unsigned int n)\n{\n    if (n <= 0) return 0;\n    std::vector<unsigned int>\
    \ seg(n, 0);\n    return cutDPhelper(price, n, seg);\n}\n```\n\n### Complexity\n\
