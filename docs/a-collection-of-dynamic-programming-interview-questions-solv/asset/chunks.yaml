    \nenum  where{DiagonalUpward, Upward, Downward};\n\nvoid printLCS(const  Matrix<where>&\
    \ directions, const std::string& str,\n\n  unsigned  int  i, unsigned  int  j)\n\
    \n{\n\n if (i == 0 || j == 0)return;\n\n if (directions(i, j) == DiagonalUpward)\n\
