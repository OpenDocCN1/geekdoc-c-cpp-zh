    # 动态规划：先解决简单问题的艺术


    动态规划（DP）通过将复杂问题分解为更简单的组件来解决问题。DP 可以应用于具有两个特性的问题：重叠子问题和最优子结构。


    重叠子问题意味着任何解决问题的递归算法应该反复解决相同的子问题，而不是生成新的子问题。最优子结构意味着任何最优解都可以从其子问题的最优解高效地构建。换句话说，假设每个子问题都有自己的代价函数：最优子结构意味着这些代价函数的最小值可以作为全局代价函数限制在相同子集时的最小值找到。


    '
- fmt: "\nDP pursues to solve each subproblem only once, as a result reducing the\
    \ number of computations. After the solution to a given subproblem has been computed,\
    \ it is stored in a table or \"memoized\". Next time the same solution is required,\
    \ it is simply looked up. DP solves problems in either two methods:\n\na) Top-down\
    \ approach: This is a consequence of the recursive mathematical definition associated\
    \ to many DP problems.\n\nb) Bottom-up approach: This requires a reformulation\
    \ of the recursive mathematical definition where subproblems are solved first\
    \ and their solutions used to build-on and achieve solutions for bigger subproblems.\n\
    \nIn this book we will review a collection of Dynamic programming problems, their\
    \ solution, and the C++ code related to them. Many of those problems are commonly\
    \ asked during interviews and can be frequently found on Internet web sites devoted\
    \ to interviews’ preparation.\n\n# 1. Fibonacci numbers\n\n## Solution\n\nThe\
    \ first two numbers in the Fibonacci sequence are 0 and 1, and each subsequent\
    \ number is the sum of the previous two. By describing the numbers in his book\
    \ [Liber Abaci](http://en.wikipedia.org/wiki/Liber_Abaci), [Leonardo Fibonacci](http://en.wikipedia.org/wiki/Leonardo_Fibonacci)\
    \ introduced the sequence to Western European mathematics in 1200, although the\
    \ sequence had been described earlier in [Indian mathematics](http://en.wikipedia.org/wiki/Indian_mathematics).\n\
    \nFibonacci numbers are mathematically defined as:\n\n![](images/00028.jpeg)\n\
    \n## Code\n\nIt is trivial to write a recursive solution directly derived from\
    \ the mathematical formulation. Here we provide an implementation where Fibonacci\
    \ is computed at compile time leveraging the power of templates.\n\n```cpp\ntemplate\
    \ <int N>\nstruct CTFibonacci {\n  static constexpr int value() {\n    return\
    \ CTFibonacci<N-1>::value() +\n    CTFibonacci<N-2>::value();\n  }\n};\n\ntemplate\
    \ <>\nstruct CTFibonacci<1> {\n  static constexpr int value() {\n    return 1;\n\
    \  }\n};\n\ntemplate <>\nstruct CTFibonacci<0> {\n  static constexpr int value()\
    \ {\n    return 0;\n  }\n};\n```\n\n## Complexity\n\nComplexity is here exponential\
    \ since ![](images/00029.jpeg). An alternative and more efficient solution memorizes\
    \ the intermediate results and it avoids to recompute the same sub-problem for\
    \ multiple times. A solution is:\n\n## Code\n\n```cpp\nunsigned int Fibonacci(unsigned\
    \ int n) {\n  int a, b, sum;\n  a = 0; b = 1; sum = a + b;\n  if (n <= 1) return\
    \ n;\n  for (unsigned int i = 2; i < n; ++i) {\n    a = b;\n    b = sum;\n   \
    \ sum = a + b;\n  }\n  return sum;\n}\n```\n\n## Complexity\n\nLinear in time\
    \ and constant in space.\n\n# 2. Binomial Coefficient\n\nThe binomial coefficient\
    \ indexed by ![](images/00002.jpeg) and ![](images/00005.jpeg) and denoted by\
    \ ![](images/00030.jpeg) is the coefficient of the ![](images/00031.jpeg) term\
    \ in the polynomial expansion of the binomial power ![](images/00032.jpeg). The\
    \ value of this coefficient is given by ![](images/00033.jpeg).\n\n## Solution\n\
    \nComputing the binomial coefficient directly from the closed formula ![](images/00034.jpeg)\
    \ would be inefficient. However, we can prove by induction that ![](images/00030.jpeg)\
    \ = ![](images/00035.jpeg) and we know that ![](images/00036.jpeg) and ![](images/00037.jpeg).\
    \ Therefore, we have a direct way to compute the binomial coefficient with dynamic\
    \ programming. Note that `Matrix` is a class defined in the appendix.\n\n## Code\n\
    \n```cpp\nunsigned int bin(unsigned int n, unsigned int k, Matrix<int> & table)\
    \ {\n  std::cout << \"n=\" << n << \" k=\" << k << std::endl;\n  if (n == 0) return\
    \ 0;\n  if (!table(n - 1, k - 1))\n    table(n - 1, k - 1) = bin(n - 1, k - 1,\
    \ table);\n  if (!table(n - 1, k))\n    table(n - 1, k) = bin(n - 1, k, table);\n\
    \  return table(n - 1, k - 1) + table(n - 1, k);\n}\n\nunsigned int binomial(unsigned\
    \ int n, unsigned int k) {\n  if (k == 0) return 1;\n  if (n == 0) return 0;\n\
    \  Matrix<int> table(n + 1, k + 1, 0);\n  for (unsigned int i = 0; i <= n; i++)\n\
    \    table(i , 0) = 1;\n  return bin(n, k, table);\n}\n```\n\n## Complexity\n\n\
    Linear in time ![](images/00038.jpeg). Space occupancy is ![](images/00039.jpeg).\n\
    \n# 3. Max sub-array problem - given an array of integers, compute the largest\
    \ sum continuous sub array\n\n## Solution\n\nThis problem is a little gem. An\
    \ elegant solution has been provided by Kadane.[[1]](#part0000.html). The key\
    \ intuition for this algorithm is illustrated by this picture: ![](images/00040.jpeg)!\
    \ ![](images/00041.jpeg)! ![](images/00042.jpeg)! ![](images/00043.jpeg) represents\
    \ the maximum value before analysing the current subsequence, while ![](images/00044.jpeg)\
    \ represents the maximum for the current subsequence. If ![](images/00045.jpeg),\
    \ we violate the continuity and therefore we can safely reset ![](images/00046.jpeg),\
    \ a value which represents the empty. If ![](images/00047.jpeg), then we have\
    \ found a new maximum and we can update the ![](images/00048.jpeg) accordingly:\n\
    \n## Code\n\n```cpp\nint maxArraySum(const std::vector<int> & v) {\n  int max_so_far\
    \ = 0, max_ending_here = 0;\n  for (unsigned int i = 0; i < v.size(); ++i) {\n\
    \    max_ending_here = max_ending_here + v[i];\n    if (max_ending_here < 0)\n\
    \      max_ending_here = 0;\n    if (max_so_far < max_ending_here)\n      max_so_far\
    \ = max_ending_here;\n  }\n  return max_so_far;\n}\n```\n\nThe second implementation\
    \ also returns the start and the end point for the max sequence:\n\n```cpp\nint\
    \ kadane(const std::vector<int> & v, int & start, int & finish) {\n  int maxSum\
    \ = -std::numeric_limits<int>::max(), sum = 0;\n  unsigned int left = 0, right\
    \ = 0;\n  start = finish = 0;\n  for (unsigned int i = 0; i < v.size(); ++i) {\n\
    \    sum += v[i];\n    if (sum > maxSum) {\n      maxSum = sum;\n      finish\
    \ = i;\n      start = left;\n    } else if (sum < 0) {\n      sum = 0;\n     \
    \ left = i+1;\n    }\n  }\n  return maxSum;\n}\n```\n\n## Complexity\n\nLinear\
    \ in the size of the input ![](images/00049.jpeg).\n\n# 4. Catalan Numbers\n\n\
    Catalan numbers are mathematically defined as:\n\n![](images/00050.jpeg)\n\nThose\
    \ numbers have multiple applications in combinatorics. For example: ![](images/00051.jpeg)\
    \ counts the number of expressions containing ![](images/00002.jpeg) pairs of\
    \ parentheses which are correctly matched (e.g. ![](images/00052.jpeg) represents\
    \ `())) (()) ()() (())()`). Also, ![](images/00051.jpeg) is the number of different\
    \ ways ![](images/00053.jpeg) factors can be completely parenthesized (e.g. ![](images/00052.jpeg)\
    \ represents `((ab)c)d (a(bc))d (ab)(cd) a((bc)d) a(b(cd)))`). In addition, ![](images/00051.jpeg)\
    \ is also the number of full binary trees with ![](images/00054.jpeg) leaves.\
    \ For a complete description of the applications please refer Wikipedia[[2]](#part0000.html__ftn2).\n\
    \n## Solution\n\nThe solution provided is directly implementing the recursive\
    \ definition.\n\n## Code\n\n```cpp\nunsigned int cat(unsigned int n, std::vector<unsigned\
    \ int> & table) {\n  if (n == 0) return 1;\n  for (unsigned int i = 0; i < n;\
    \ i++) {\n    if (!table[i])\n      table[i] = cat(i, table);\n    if (!table[n\
    \ - 1 - i])\n      table[n - 1 - i] = cat(n - 1 - i, table);\n    table[n] +=\
    \ table[i] * table[n - 1 - i];\n  }\n  return table[n];\n}\n```\n\n## Complexity\n\
    \nLinear in the size of the input, ![](images/00055.jpeg).\n\n## Solution\n\n\
    Notice that we can leverage the symmetry in the definition. For instance ![](images/00056.jpeg).\
    \ This observation leads to the following recursive implementation.\n\n```cpp\n\
    unsigned int catalan2(unsigned int n) {\n  if (n == 0) return 1;\n  unsigned int\
    \ sum = 0;\n  for (unsigned int i = 0; i < n/2; ++i) {\n    sum += catalan(i)*catalan(n-1-i);\n\
    \  }\n  sum *= 2;\n  if (n % 2) {\n    unsigned int c = catalan(n/2);\n    sum\
    \ += c*c;\n  }\n  return sum;\n}\n```\n\n# 5. Integer Knapsack – A knapsack has\
    \ max capacity C and there are n items each with weight w[i] and value ![](images/00057.jpeg)v[i].\
    \ Maximize the value in the knapsack without exceeding its max capacity\n\n##\
    \ Solution\n"
