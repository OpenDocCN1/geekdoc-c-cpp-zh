    \ ![](images/00140.jpeg)from the ![](images/00141.jpeg) die for each![](images/00142.jpeg):\n\
    \n![](images/00143.jpeg)\n\nNote that we have![](images/00144.jpeg) terms in this\
    \ sum. We use a support table ![](images/00145.jpeg) where we store the current\
    \ sum and the current dice. The base case is with only one die and in this case\
    \ there is only one way to get the sum![](images/00146.jpeg)  therefore ![](images/00147.jpeg)\
    \ for![](images/00148.jpeg). Then, for each possible sum value ![](images/00149.jpeg)\
    \ and for each possible dice ![](images/00150.jpeg) and for each possible valid\
