    \ the same order but not necessarily contiguous. The main difference with the\
    \ previous problem is that here the terms are not consecutive.\n\n## Solution\n\
    \nA dynamic programming solution can be computed for the string ![](images/00203.jpeg)\
    \ and the string ![](images/00204.jpeg)1] by defining a recursive function ![](images/00205.jpeg)\
    \ on the prefixes ![](images/00206.jpeg) and ![](images/00207.jpeg) of length\
    \ ![](images/00076.jpeg) and ![](images/00077.jpeg)\n\n![](images/00208.jpeg)\n\
    \nA dynamic programming solution can be built by using a table where we store\
    \ the partial results of the above computation (function![](images/00209.jpeg)).\
    \ In addition we store the direction that generated the table for reconstructing\
    \ the common subsequence in a next step (function![](images/00210.jpeg))\n\n##\
    \ Code\n\n```cpp\nenum where{DiagonalUpward, Upward, Downward};\n\nvoid printLCS(const\
    \ Matrix<where>& directions, const std::string& str,\n\n  unsigned  int i, unsigned\
    \  int j)\n{\n  if (i == 0 || j == 0)return;\n\n  if (directions(i, j) == DiagonalUpward)\n\
    \  {\n    printLCS(directions, str, i - 1, j - 1);\n    std::cout << str[i];\n\
    \  }\n  else if (directions(i, j) == Upward)\n    printLCS(directions, str, i\
    \ - 1, j);\n  else\n    printLCS(directions, str, i, j - 1);\n}\n\nvoid LCS(const\
    \ std::string& s1, const std::string& s2)\n{\n  const  unsigned  int m = s1.size()\
    \ + 1;\n  const  unsigned  int n = s2.size() + 1;\n  Matrix<unsigned  int> table(m,\
    \ n, 0);\n  Matrix<where> directions(m, n);\n  for (unsigned  int i = 1; i<m;\
    \ i++)\n    for (unsigned  int j = 1; j<n; j++)\n      if (s1[i] == s2[j])\n \
    \     {\n        table(i, j) = table(i - 1, j - 1) + 1;\n        directions(i,\
    \ j) = DiagonalUpward;\n      }\n      else\n        if (table(i - 1,j) >= table(i,\
    \ j - 1))\n        {\n          table(i, j) = table(i - 1, j);\n          directions(i,\
    \ j) = Upward;\n        }\n      else\n        {\n          table(i, j) = table(i,\
    \ j - 1);\n          directions(i, j) = Downward;\n        }\n  printLCS(directions,\
    \ s1, m-1, n-1);\n}\n```\n\n## Complexity\nComplexity is ![](images/0201.jpeg)\
