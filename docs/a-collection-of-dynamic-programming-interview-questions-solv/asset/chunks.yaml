    \  return numInsertionPaly(str, l + 1, r - 1);\n\n else\n\n  return (std::min(numInsertionPaly(str,\
    \ l + 1, r),\n\n               numInsertionPaly(str, l, r - 1)) + 1);\n\n}\n\n\
    int minInsertionsPalyndromeDP(const std::string & str)\n\n{\n\n unsigned  int\
    \ n = str.length();\n\n Matrix<unsigned  int> table(n + 1, n + 1, 0);\n\n unsigned\
    \  int gap, left, right;\n\n for (gap = 1; gap < n; ++gap)\n\n  for (left = 0,\
    \ right = gap;\n\nright < n; ++left, ++right)\n\n                                         \
