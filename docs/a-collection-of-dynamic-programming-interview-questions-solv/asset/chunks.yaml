    \ 2) |\n\n| 5 | 8 | (1, 1, 1, 1, 1); ( 2, 1, 1, 1); (1, 2, 1, 1); (1, 1, 2, 1);\
    \ (1, 1, 1, 2);(2, 2, 1); (1, 2, 2), (2, 1, 2) |\n\nWe notice that there is a\
    \ pattern: at each step the number of configurations is the sum of the number\
    \ of configurations of the previous and last steps but one. Mathematically:\n\n\
    ![](images/00128.jpeg)\n\nThis formula has a straightforward interpretation: we\
    \ jump to the n step either from the ![](images/00129.jpeg) step or from the ![](images/00130.jpeg)\
    \ step. Note that the base cases are different with respect to Fibonacci.\n\n\
    Code\n\nunsigned  long jump(unsigned  int  n)\n\n{\n\n if (n == 1) return 1;\n\
    \n if (n == 2) return 2;\n\n unsigned  long current = 0, prev = 2, prevPrev =\
    \ 1;\n\n for (unsigned  int i = 3; i <= n; i++)\n\n  {\n\n    current = prev +\
    \ prevPrev;\n\n    prevPrev = prev;\n\n    prev = current;\n\n  }\n\n return current;\n\
    \n}\n\nComplexity\n\nLinear in the input size.\n\n# 10.  Jumping Array – Given\
    \ an array of non-negative numbers, start at the first element and reach the end\
    \ with a minimum number of jumps. A jump cannot exceed the length contained in\
    \ the current position.\n\nSolution\n\nGiven the array![](images/00131.jpeg)],\
    \ the base cases are when ![](images/00132.jpeg) or when![](images/00133.jpeg).\
    \ For those cases, we have no solution. Otherwise, the mathematical formulation\
    \ can be computed for each  position ![](images/00076.jpeg)  by finding the maximum\
    \ jump length for position ![](images/00134.jpeg) such that the required constrain\
    \ ![](images/00135.jpeg) is not violated. Mathematically![](images/00136.jpeg).\n\
    \nCode\n\nunsigned  int jump(const  unsigned  int  a[], unsigned  int  n)\n\n\
    {\n\n              std::vector<unsigned  int> result(n);\n\n if (n == 0 || a[0]\
    \ == 0)\n\n  return std::numeric_limits<unsigned  int>::max();\n\n             \
    \ result[0] = 0;\n\n for (unsigned  int i = 1; i < n; ++i)\n\n {\n\n              \
    \ result[i] =\n\nstd::numeric_limits<unsigned  int>::max();\n\n  for (unsigned\
    \  int j = 0; j < i; j++)\n\n if ((a[j] >= (i - j)) &&\n\n(result[j] + 1 < result[i]))\n\
    \n                                          result[i] = result[j] + 1;\n\n }\n\
    \n return result[n - 1];\n\n}\n\nComplexity\n\nLinear in time and space\n\n# 11.\
    \  Dice -– Given n dice, count how many ways to get sum s.\n\nSolution\n\nLet’s\
