    \ where the palindromic string begins (![](img/00183.jpeg)) and its length (![](img/00184.jpeg)).\n\
    \n## Code\n\n```cpp\nstd::string longestPalindrome(const std::string & s) {\n\
    \  unsigned int n = s.length();\n  if (n == 0)\n    return s;\n  unsigned int\
    \ longestStart = 0;\n  unsigned int maxLen = 1;\n  Matrix<unsigned int> table(n,\
    \ false);\n  for (unsigned int i = 0; i < n; ++i)\n    table(i, i) = true;\n \
    \ for (unsigned int i = 0; i < n - 1; ++i) {\n    if (s[i] == s[i + 1]) {\n  \
    \    table(i, i + 1) = true;\n      longestStart = i;\n      maxLen = 2;\n   \
    \ }\n  }\n  for (unsigned int len = 3; len <= n; ++len) {\n    for (unsigned int\
    \ i = 0; i < n - len + 1; ++i) {\n      unsigned int j = i + len - 1;\n      if\
    \ (table(i + 1, j - 1) && s[i] == s[j]) {\n        table(i, j) = true;\n     \
    \   if (len > maxLen) {\n          longestStart = i;\n          maxLen = len;\n\
    \        }\n      }\n    }\n  }\n  return s.substr(longestStart, maxLen);\n}\n\
