    \nText:\n# 12. Coin Change – Given n dollars, how many different ways there are\
    \ to make the change into a set of coins![](img/00153.jpeg)?\n\n## Solution\n\n\
    Let’s define ![](img/00154.jpeg) and let `f(n, S, t)` ![](img/00155.jpeg) be the\
    \ change for ![](img/00002.jpeg) dollars given a set `S` ![](img/00156.jpeg) of\
    \ coins ![](img/00157.jpeg). We suppose to have an infinite amount of each type\
    \ of coin![](img/00158.jpeg). A coin ![](img/00159.jpeg) can either be part of\
    \ the change or not. This simple observation is used for a dynamic programming\
    \ solution.\n\n![](img/00160.jpeg)\n\nwhere `f(n, S, t)` ![](img/00161.jpeg) counts\
    \ when the coin ![](img/00159.jpeg) has been not selected, while `f(n, S, t-1)`\
    \ ![](img/00162.jpeg) counts the selection of a new coin ![](img/00158.jpeg).\
    \ The base cases are for `f(0, S, t)` ![](img/00163.jpeg) where the only solution\
    \ is not to change any money, `f(n, S, t)` ![](img/00164.jpeg) for ![](img/00165.jpeg)\
    \ where there is no solution because we have a negative amount of money![](img/00166.jpeg)\
    \ and `f(n, S, -1)` ![](img/00167.jpeg) because we have money but there is no\
    \ change available. The first implementation is recursive, while the second is\
    \ based on dynamic programming.\n\n## Code\n\n```cpp\nint changeCoin(int n, const\
    \ unsigned int S[], int t)\n{\n  if (n == 0)\n    return 1;\n  if ((n<0) || (t\
    \ < 0 && n > 0))\n    return 0;\n  return changeCoin(n, S, t - 1) + changeCoin(n\
    \ - S[t], S, t);\n}\n\nint changeCoinDP(unsigned int n, const unsigned int S[],\
    \ unsigned int t)\n{\n  Matrix<unsigned int> table(n + 1, t);\n  for (unsigned\
    \ int j = 0; j < t; ++j)\n    table(0, j) = 1;\n  for (unsigned int i = 1; i <=\
    \ n; ++i)\n    for (unsigned int j = 0; j < t; ++j)\n      table(i, j) = ((i >=\
    \ S[j]) ? table(i - S[j], j) : 0) + ((j>0) ? table(i, j - 1) : 0);\n  return table(n,\
    \ t-1);\n}\n```\n\n## Complexity\n\nTime complexity is ![](img/00169.jpeg) by\
    \ considering that ![](img/00170.jpeg) and ![](img/00171.jpeg).\n\nThis definition\
    \ computes the longest palindromic substring by starting from the whole string\
