    \ Second, the cost should be non-linear because we want to balance across lines\
    \  (e.g. leaving two positions in one same line should intuitively cost more than\
    \ leaving a position in one and the other position in another line). This requirement\
    \ can be fulfilled in multiple ways, for instance by defining ![](images/00102.jpeg)\
    \ or more conveniently for bitwise computation: ![](images/00103.jpeg). To summarize\
