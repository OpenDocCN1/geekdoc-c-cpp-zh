    \ - 1, j - 1) + 1),\n\n            result\n\n            );\n\n} else {\n\n       \
    \ LCSuff(i, j) = 0;\n\n      }\n\n    }\n\n  }\n\n return result;\n\n}\n\nComplexity             \n\
