    \ according to the above definition.\n\nCode\n\nunsigned  long playDices(unsigned\
    \  int  n, unsigned  int  m, unsigned  int  s)\n\n{\n\n if ((n == 0) ||  (m <\
    \ 2) || (s == 0) || (n*m < s) )\n\n  return 0;\n\n Matrix<int> mem(s + 1, n +\
    \ 1, 0);\n\n  for (unsigned i = 1; i <= m && i <= s; ++i)\n\n               mem(i,\
    \ 1) = 1;\n\n for (unsigned i = 1; i <= s; ++i)\n\n  for (unsigned j = 2; j <=\
    \ n; ++j)                 \n\n  for (unsigned k = 1; k <= m && k < i; ++k)\n\n\
    \                                           mem(i, j) += mem(i - k, j - 1);\n\n\
    \ return mem(s, n);\n\n}\n\nComplexity\n\nComplexity is ![](images/00152.jpeg)"
