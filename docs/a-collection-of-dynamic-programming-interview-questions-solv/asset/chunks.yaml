    \ int> & M,\n  const std::vector<unsigned int> & length,\n  unsigned int max,\
    \ int n)\n{\n  int penalty;\n  for (int i = 0; i < n; i++)\n  {\n    penalty =\
    \ max - length[i];\n    M[i] = std::min(M[i], (i == 0 ? 0 : M[i - 1]) + (1 <<\
