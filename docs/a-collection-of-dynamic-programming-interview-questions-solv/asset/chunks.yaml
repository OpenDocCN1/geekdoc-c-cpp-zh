    # Dynamic programming: the art of solving simple problems first


    Dynamic programming (DP) solves intricate problems by breaking them down into
    simpler components. DP can be applied to problems exhibiting two properties: overlapping
    subproblems and optimal substructure.


    Overlapping subproblems means that any recursive algorithm solving the problem
    should solve the same subproblems over and over, rather than generating new subproblems.
    Optimal substructure means that any optimal solution can be constructed efficiently
    from the optimal solutions of its subproblems. In other words, suppose that each
    subproblem has its own cost function: the optimal substructure implies that the
    minima of each of these cost functions can be found as the minima of the global
    cost function restricted to the same subsets.

