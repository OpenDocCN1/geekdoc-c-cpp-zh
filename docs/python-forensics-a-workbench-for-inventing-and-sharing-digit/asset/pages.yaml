  md: '# Integrated Development Environments 37


    The problem is these technologies do not consider language or semantics, thus
    it is easy to miss certain communications or maybe misunderstand them. The NLTK
    modules provide an infrastructure to create real Natural Language programs and
    build or small large corpus.


    A Corpus is a collection of material which is most often written, but can be spoken
    material as well. The material is digitally organized in such a way that it lends
    itself to the study of linguistic structures which helps to understand.


    This gives us the ability to search, understand, and derive meaning. We will be
    using NLTK in one of our Cookbook examples to help produce specific applications
    to assist digital investigators. For example, we can use linguistics to help determine
    if specific documents were likely to have been written by a specific person.


    # Twisted matrix [TWISTED]


    In a world where everyone is connected, our ability to collect and examine evidence
    requires both a postmortem and a live investigation mindset. This implies that
    we must have a reliable network library that provides an asynchronous and event-based
    environment that is open source and written in Python. This includes TCP, UDP,
    Web Services, Mail Services, Authentication, Secure Shell support, and quite a
    bit more.


