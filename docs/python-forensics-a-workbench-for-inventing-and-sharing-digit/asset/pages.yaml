  md: "# The Time Module 169\n\nNonrepudiation: An event or document should be bound\
    \ to its time so that the association between event and document the time cannot\
    \ be denied. Accountability: The process of acquiring time, adding authentication\
    \ and integrity, and binding to the subject event should be accountable so a third\
    \ party can determine that due process was applied, and that no corruption transpired.\n\
    \nMost people reading this book will quickly recognize that from a practical perspective\
