    In this chapter I introduced Python Anywhere, a cloud service that runs native
    Python code in the cloud. I demonstrated how simple it is to run native Python
    code in the cloud from multiple platforms. I then modified the Rainbow Table password
    generator to minimize memory usage, reduced the characters, and expanded the generation'
