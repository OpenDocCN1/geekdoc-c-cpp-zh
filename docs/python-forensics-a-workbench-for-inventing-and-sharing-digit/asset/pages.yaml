  md: '# Foreword


    On June 16, 2008 a user in the home of 2-year old Caylee Anthony googled for the
    term fool proof suffocation. A minute later, the same user logged onto the MySpace
    website with the profile of Casey Anthony. Tragically within months, the police
    found the decomposed remains of the young child. Charged Casey Anthony with first-degree
    murder and subsequently tried her 3 years later. The trial lasted 6 months and
    contained over 400 pieces of unique evidence. Sadly, the details of the computer
    search never made to trial. The prosecutor’s forensic examiner employed a tool
    to retrieve the browser history results. In use of that tool, the examiner only
    searched the Internet Explorer browser history and not that of the Firefox browser.
    The moral of the story is that we are as good as our tools and our understanding
    of how they work.


    In contrast to the failure of the forensic examiner, let us consider the most
    feared military—the Spartan Army. The strength of the Spartan army relied upon
    the professionalism of its soldiers. From a young age, the elite warriors learned
    only occupation—to wage war. In profession, they relied heavily on the quality
    of their weaponry and armor. Instead of weapons being issued to a warrior, it
    was the responsibility every Spartan warrior to bring his own weapons and armor
    to war. Fathers passed these tools to their sons before entering battle. In the
    following pages, Chet Hosmer passes down modern tools and weapons. As a forensic
    investigator, your terrain may include a hard drive unscathed space instead of
    the pass of Thermopylae. However, just like Spartan elders, Chet will teach you
    to forge your weapons. Building your own weapon is what separates a forensic examiner
    that makes the guise of missing browser artifacts versus that of a professional
    examiner.


    The following chapters cover a breadth of topics from hashing, keyword searching,
    metadata, natural language processing, network analysis, and utilizing multiprocessing.
    Chet covers this range of exciting topics that he teaches you to build your own
    weapons in the Python programming language. A visiting professor in the Cyber
    Security Graduate Program at Utica College, Chet is both an educator and a practitioner.
    He has served as the principal investigator on over 40+ cyber security, digital
    forensics and information assurance research programs and received international
    recognition and awards for his work. Like the Spartan elder, his knowledge will
    hopefully translate to the growth of a new breed of professional. So please enjoy
    the following pages and as Spartan wives told their husbands upon entering battle,
    come back with your shield or on it.


    TJ O''Connor


    SANS Red&Blue Team Cyber Guardian'
  merge: -1
  pgno: 14
