  md: '# A VIRTUAL MACHINE


    Today, we have virtual machines for everything complete server infrastructures
    to specialized applications, standardized development environments, databases,
    client services, desktops, and more. For those who want a really quick start,
    I created a Ubuntu Python Environment that will be available in conjunction with
    the publication of this book. The environment includes a standard Ubuntu install,
    all the packages, modules, and Cookbook applications from Chapters 3 to 11. I
    have also included any test so you can start experimenting with the simplest or
    most advanced digital investigation or forensics applications found. You can access
    the virtual machine by going to www.python-forensics.org.


    # CHAPTER REVIEW


    In this chapter we took a very broad, and in some cases deep, look at setting
    up a Python environment in the Microsoft Windows and Linux environment. We reviewed
    where to download the latest Python environment from the official source and walked
    through the steps of installing a Windows Python environment. We also made specific
    recommendations on the Ubuntu version of choice that include Python 2.x already
    installed as part of the OS. We looked at the differences between Python 2.x and
    3.x. We also pulled back the covers a bit on some of the key built-in functions,
    data types, and modules. We developed a few example applications that respect
    the Standard Library and showed how a program written in Python could run without
    modification on Windows, Linux, iOS, or on a Windows 8 phone. MacOS is also supported
    and Python 2.x comes with the standard install of the latest versions.


    We examined two specific third-party packages that address Natural Language and
    network applications, respectively. We also examined some of the capabilities
    that we will need included in an IDE, took a step-by-step look at the features
    of WingIDE and briefly covered the IDLE IDE. Finally, we experimented with the
    Python Shell on all the computing platforms mentioned here.


    # SUMMARY QUESTIONS


    +   1. What do you think would be the best Python development environment based
    on the following circumstances?


    +   a. A student looking to experiment with Python forensics


    +   b. A developer that plans to build and distribute Python investigative solutions


    +   c. A laboratory that processes actual cases, but needs specialized tools and
    capabilities that do not exist within standard forensic tools'
