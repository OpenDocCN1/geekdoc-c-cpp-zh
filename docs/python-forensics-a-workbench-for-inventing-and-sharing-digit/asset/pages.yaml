    # PROGRAM EXECUTION AND OUTPUT


    As you can see, the psnmt Python application is constructed as a command line
    application. This makes sense for this type of application because it is likely
    to be executed as a cron job (scheduled to run at certain times for example).
    The command line has the following parameters:


    | Parameter | Purpose of Usage |

    | --- | --- |

    | -v | Verbose: Writes intermediate results to standard output when specified
    |

    | -m | Minutes: Duration in minutes to perform collection activities |

    | -TCP |-UDP | Protocol: Defines the application protocol to capture |

    | -p | Produces: Defines the output for the forensic log and csv file |


    Example command:

    sudo Python psnmt -v TCP -m 60 -p /home/chet/Desktop


    Note: sudo (is used to force the execution of the command with administrative
    rights, which is required). This command will capture TCP packets for 60 min,
    produce verbose output and create a log and csv file on the user''s desktop.

