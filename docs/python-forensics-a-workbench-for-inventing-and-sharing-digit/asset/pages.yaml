  md: 'Obviously, like all good definitions stand the test of time. Since the Internet
    really did not materialize into a recognizable form until the late 1980s, the
    concept of expressing emotion and knowledge digitally did not include Facebook,
    Twitter, Emoticons, Blogging, Texting, Sexting, BitStrips, or even Internet-based
    e-mail! However, the definition certainly provides coverage for these latest forms
    of Natural Language expression. Extracting meaning (semantics) from Natural Language
    is quite a bit difficult than it looks.


    Judging the effectiveness of Natural Language systems that attempt to interpret,
    understand, and respond accordingly falls to the Turing Test, named Alan Turing
    based on his 1950 paper “Computing Machinery and Intelligence.\” In his paper,
    Turing asks the proactive question, “Can machines think?” [Turing


    # Dialog-based systems


    The goal of dialog-based systems is to respond to a user input, meaning that we
    cannot distinguish between human or machine-based responses. Some may be familiar
    with systems that are moving toward this capability. For example, here is a dialog
    between me and the Sync system in my car:


    +   - Me: I''m hungry.

    - Sync: Ok, Where would you like to search nearby, along your route or in a city?

    - Me: Nearby.

    - Sync: How would you like to search—by name or by category?

    - Me: By category.

    - Sync: Ok, what category?

    - Me: Italian.

    - Sync: Ok, please select from the list on your screen, for example Line 1.

    - Me: Line 4.

    - Sync: Ok, Rossi''s Restaurant. Would you like to make a call or set as destination?

    - Me: Making a call.

    - Sync: Calling Rossi''s Restaurant...


    Although useful, it certainly does not meet the Turing standard because I know
    that I am talking to a computer not a human. However Sync does the spoken word
    into text and then responds in a timely fashion and as result the system usually
    gets where I want to go or provides the information I am seeking.


    # Corpus


    One of the key elements needed to perform Natural Language Processing (NLP) is
    a corpus. A corpus is a large volume of linguistic samples that is relevant to
    a specific genre. For example, the Gutenberg Project [Gutenberg] that is available
    at http://www.gutenberg.org/ contains over 40,000 books in electronic format.


    One of the challenges in creating meaningful examples in this chapter was establishing
    a corpus. Then I needed to demonstrate the use of the corpus to create these'
