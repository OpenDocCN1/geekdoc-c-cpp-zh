  md: '# CHAPTER 3 Our First Python Forensics App


    assumes of course that the original calculated hash value has been safeguarded
    against tampering there is no held secret and the algorithms are available. Anyone
    could recalculate a hash, therefore the chain of custody of digital evidence,
    including the generated hash, must be maintained.


    Search: One-way hashing values have been traditionally utilized to perform searches
    of known file objects. For example, if law enforcement has a collection of confirmed
    child-pornography files, the hashes could be calculated for each file. Then any
    suspect system could be scanned for the presence of this contraband by calculating
    the hash values of each file and comparing the resulting hashes to the known list
    of contraband-pornography collection). If matches are found, then the files on
    the suspect system matching the values would be examined further.


    Black Listing: Like the search example, it is possible to create a list of known
    bad files. These represent contraband as CP example, they could match malicious
    code or cyber weapon files or the hashes of classified or proprietary documents.
    The discovery of hashes matching any of these Black Listed items would provide
    investigators with key evidence.


    White Listing: By creating a list of known benign changes to websites, application
    executables, vendor supplied dynamic link libraries or known trustworthy application
    download files), investigators can use the lists to filter out files that do not
    have to examine, because they were previously determined as a good file. Using
    this methodology can dramatically reduce the number of files that require examination
    and focus your attention on files that are not in the known good list.


    Change detection: One popular defense against malicious changes to websites, routers,
    firewall configuration, and even operating system installations is to hash a "known
    good" installation or configuration. Periodically you can re-scan the installation
    or configuration to ensure no files have changed. In addition, you must make sure
    no files have been added or deleted from the "known good" set.


    # Fundamental requirements


    Now that we have a better understanding of one-way hashing and its uses, what
    are the fundamental requirements of our one-way file system hash application?


    When defining requirements for any program or application I want to define them
    as succinctly as possible, and with little jargon, so anyone familiar with the
    domain could understand them—even if they are not software developers. Also, each
    requirement should have an identifier that could be traced from definition, through
    design, development, and validation. I like to give the designers and developers
    room to innovate, thus I try to focus on WHAT not HOW requirements definition
    (Table 3.2).'
