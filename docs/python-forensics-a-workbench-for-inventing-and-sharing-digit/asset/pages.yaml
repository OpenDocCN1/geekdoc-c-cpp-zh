  md: '# CHAPTER 7 Using Natural Language Tools in Forensics


    | Method | Description |

    | --- | --- |

    | raw() | Extracts the raw contents of the corpus. The method returns the type:
    Python "str" |

    | word_tokenize() | Removes white space and punctuation and creates a list of
    the individual tokens (basically words). The method returns the type: Python "list"
    |

    | collocations() | Words appear often within a text and provide useful information
    to investigators. In addition, once detected they can be used to find associations
    between word occurrences. This is accomplished by calculating the frequencies
    of words and their connections with other words. The collocation method performs
    all of this in a single method |

    | concordance() | This method provides the ability to generate every occurrence
    of a specific word with the context (how the word was used in a specific sentence,
    for example) |

    | findall(search) | This method can be used for simple and even regular expression
    searches of the corpus text |

    | index(word) | This method provides an index to the first occurrence of the word
    provided |

    | similar(word) | Note this is not synonyms, rather the method provides similarities,
    stated simply identifies other words that appear in the same "context" as the
    specified word |

    | vocab() | Produces a comprehensive vocabulary list of the text submitted |


    operations that would be both complicated and time-consuming without the aid of
    a toolset like NLTK Table 7.1 depicts some of the key operations that can be performed
    on a corpus, I will be demonstrating these in code later in this chapter.


    # EXPERIMENTING WITH NLTK


    In this section, I am going to invoke the methods in Table 7.1 and create a simple
    program to first create a new text corpus, and then examine that corpus with these
    methods. First, a little background on the corpus I am going to create. At that
    side,

    Jack Walraven maintains the web site http://simpson.walraven.org/. Jack has organized
    the transcripts of the O.J. Simpson trial. For this experiment, I downloaded the
    Trial Transcripts for January 1995 (you can of download as many texts and excerpts
    as you like). There are nine Trial text files stored for the 1995 proceedings,
    and they represent transcripts for the dates of January 11-13, 23-26, 30, and
    31. I created a directory on my Windows system, c:\simpson\, to hold each of the
    separate files. My goal is to use these files to create a new text corpus that
    includes all of these files. The best way to illustrate how this works is to walk
    you through some sample code that deals with each aspect. I have annotated the
    code to make sure you understand each step of the process.'
