  md: "# Examining ValidateFileRead(theFile)\n\nThis function supports the ParseCommandLine\
    \ and parser.parse_args() by validating filenames provided by the user. The function\
    \ ensures that the file exists and then verifies that the file is readable. Failing\
    \ either of these checks will result in the program aborting and will raise the\
    \ appropriate exception.\n\n```\ndef ValidateFileRead(theFile):\n    # Validate\
    \ the path is valid\n    if not os.path.exists(theFile):\n        raise argparse.ArgumentError('File\
    \ does not exist')\n    # Validate the path is readable\n    if os.access(theFile,\
    \ os.R_OK):\n        return theFile\n    else:\n        raise argparse.ArgumentError('File\
    \ is not readable')\n```\n\n# Examining the SearchWords function\n\nThe core of\
    \ p-search is the SearchWords function which compares the keywords provided by\
    \ the user with the contents of the target file. We will take a deep line by using\
    \ SearchWords.\n\n```\ndef SearchWords():\n    # An empty set of search words\n\
    \    # As Mentioned in the design considerations, I decided to use a Python object\
    \ to hold the keywords to search. To this I simply assign SearchWords as a set\
    \ object.\n    searchWords = set()\n    # Next, I need to load the keywords from\
    \ the file specified by the user in the command line arguments. I do this using\
    \ the 'try, except, finally' method to ensure we trap any failures.\n    # Attempt\
    \ to open and read search words\n    try:\n        fileWords = open(gl_args.keywords)\n\
    \        # Once we successfully open the keywords I process each line stripping\
    \ the words from the line and adding it to the searchWords set.\n        for line\
    \ in fileWords:\n            searchWords.add(line.strip())\n    except:\n    \
    \    # Any exceptions encountered are logged and the program is aborted\n```"
