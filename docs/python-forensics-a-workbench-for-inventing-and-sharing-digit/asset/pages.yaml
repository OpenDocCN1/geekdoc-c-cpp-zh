  md: '# The Right Environment


    +   3. What is the right of C integrated development environment (IDE) and what
    capabilities should be included in that environment?


    +   a. Code intelligence that provides automatic completion, built-in error indicators
    source browser, code indices, and fast symbol lookup.


    +   b. A robust debugger that allows you to set breakpoints, single-step through
    code, view data, and examine variables.


    +   c. A powerful programmer''s editor that has a complete understanding of the
    Python language rules, advanced search tools, bookmarking, and code highlighting.


    +   d. Cross-platform support that you can choose your platform and environment
    (i.e., Windows, Linux, or Mac), and select any Python version from 2.x to 3.x
    and Stackless Python.


    Stackless is a relatively new concept, allowing Python programs to execute which
    are not limited by the size of C Stack. In many environments, the size of stack
    memory is limited in comparison to the amount of heap memory. Stackless utilizes
    the heap and not the stack which provides greater distributed possibilities. For
    example, this allows for thousands of independently running tasks to be launched.
    Online multiplayer platforms use this to support thousands of simultaneous users.
    I am sure if you are thinking ahead you can imagine some interesting digital investigation
    and forensic applications for such an environment.


    +   e. Unit testing capability that enables you to thoroughly validate your code
    within common testing frameworks such as unittest, doctest, and nose.


    +   f. Built-in revision control for advanced projects along with direct integration
    with popular revision control systems such as Mercurial, Bazaar, CVS, and Perforce.
    When building larger applications that contain many moving components managing
    the revisions becomes important.


    This selection will ultimately determine if the tools and applications developed
    will meet the standards of quality that are essential ingredients for digital
    investigation and forensic applications.


