  md: '# Python Silent Network Mapping Tool 247


    We are ready to build an application that can capture network packets and extract
    the information that will allow us to monitor traffic.


    # PYTHON SILENT NETWORK MAPPING TOOL (PSNMT)


    Now that we have the basics for sniffing a network packet, I need to parse the
    data and extract the information I need. For this example, I am not interested
    in collecting packets and simply printing the results, rather I want to achieve
    the following objectives:


    +   (1) Collect IP addresses that are active on the network I am monitoring. (I
    plan to leave the monitor in place for a long period of time to capture network
    devices that only turn periodically or sporadically.)


    +   (2) Collect IP addresses of remote computers that are interacting with my
    local network. These could be web, mail, or a plethora of Cloud services.


    +   (3) Collect service ports being used by local and/or remote computers. I am
    interested in "Well Defined Ports": 0-1023 or "Registered Ports": 1024-4911.


    +   (4) Next I wish to report only unique entries. In other words, if the local
    host 192.168.0.5 is discovered and is found to be using host port 80, I only want
    to see that unique entry, not each time it is discovered.


    +   (5) Finally, to limit the scope of the program, I want to collect only TCP
    or UDP packets within an IPv4 environment. The program can be easily expanded
    to handle other protocols and IPv6 in the future.


    In order to meet the requirements stated above I only need to extract the following
    fields from the headers:


    +   (1) Protocol

    (2) Source IP address

    (3) Destination IP address

    (4) Source port

    (5) Destination port


    Examining Figures 9.4 and 9.5, with the Protocol field, along with the Source
    and Destination IP addresses are in the IPv4 header, while the Source and Destination
    ports are in the TCP header. This means I will have parse out both headers to
    obtain the needed information. I have included Figure 9.6 which depicts the UDP
    header, which I also use to handle UDP packet extraction.


    There are several technical issues that need to be addressed with the high level
    requirements:


    +   (1) What type of data element I should use to store the information collected?

    a. I am going to use a simple list to hold the data collected from the packets
    and append data to the lists for each packet received.


    ```

    ipObservations={}

    ```'
