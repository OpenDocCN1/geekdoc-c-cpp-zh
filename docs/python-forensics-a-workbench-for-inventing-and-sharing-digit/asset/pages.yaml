    Chet has been researching and developing technology and training surrounding forensics,
    digital investigation, and steganography for over two decades. He has made numerous
    appearances to discuss emerging cyber threats including National Public Radio''s
    Kojo Nnamdi show, ABC''s Primetime Thursday, NHK Japan, Crime Crime TechTV, and
    ABC News Australia. He has also been a frequent contributor to technical and news
    stories relating to security and forensics and has been interviewed and quoted
    by IEEE, The New York Times, The Washington Post, Government Computer News, Salon.com,
    and Wired Magazine.


    Chet also serves as a Visiting Professor at Utica College where he teaches in
    the Cybersecurity Graduate program. He is also an Adjunct Faculty member at Champlain
    College in the Masters of Science in Digital Forensic Science Program. Chet delivers
    keynote and plenary talks on various cyber related topics around the world each
    year.


