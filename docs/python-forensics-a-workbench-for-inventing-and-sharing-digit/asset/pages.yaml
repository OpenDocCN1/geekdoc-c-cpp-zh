    # ## INTRODUCTION


    The Python programming language and environment has proven to be easy to learn
    and is adaptable to virtually any domain or challenge problem. Companies like
    Google, Dropbox, Disney, Industrial Light and Magic, and YouTube just to mention
    a handful are using Python within their operations. Additionally, organizations
    like NASA''s Jet Propulsion Lab; the National Weather Service; The Swedish Meteorological
    and Hydrological Institute (SMHI); and Lawrence Livermore National Laboratories
    rely on Python to build models, make predictions, run experiments, and control
    critical operational systems.


    Before driving straight in, I am sure you would like a little more information
    about what I will be covering and how a programming environment like Python matches
    with digital investigations. Also, you might be interested to know what you will
    be learning about, what the scope of this book is, and how you can apply the concepts
    and examples presented.


    The primary purpose and scope of the book is to show you how Python can be used
    to address problems and challenges within the cybercrime and digital investigation
    domain. I will be doing this by using real examples and providing the full source
    code along with detailed explanations. Thus the book will become a set of'
  merge: -1
