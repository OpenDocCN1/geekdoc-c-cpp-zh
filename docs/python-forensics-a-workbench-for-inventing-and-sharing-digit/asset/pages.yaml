    # What are these sockets?


    When interacting with a network, sockets are the fundamental building block allowing
    to leverage the underlying operating system capabilities to interface with the
    network. Sockets provide an information channel for communication between network
    endpoints, for example, between a client and server. You can think about sockets
    as the endpoint of connection between a client and a server. Applications developed
    in languages like Python, Java, C++, and C# interface utilizing an application
    programming interface (API). The sockets API on most systems today is based upon
    the Berkeley sockets. Berkeley sockets were originally provided with UNIX BSD
    Version 4.2 back in 1983. Later around 1990, Berkeley released a license-free
    version which is the basis of today''s socket API across most operating systems
    (Linux, Mac OS, and Windows). This standardization processes in implementation
    across platforms.


    Figure 8.1 depicts a sample network where multiple hosts (endpoints) are connected
    to a network hub. Each host has a unique Internet Protocol (IP) address, and this
    simple network we that each host has a unique IP address.


