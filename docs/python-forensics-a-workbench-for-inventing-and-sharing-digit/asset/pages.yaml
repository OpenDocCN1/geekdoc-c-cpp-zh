    \ it is not possible to reverse the process using the digest\nto recover the stream\
    \ of binary data that created it.\n4. It is infeasible to create a new binary\
    \ input that will generate a given message\ndigest.\n5. Changing a single bit\
    \ of the binary input data will generate a unique message\ndigest.\n6. Finally,\
    \ it is infeasible to find two arbitrary streams of binary data that\nproduce\
