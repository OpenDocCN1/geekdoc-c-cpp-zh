    # INTRODUCTION


    In 1998, I authored a paper entitled “UsingSmartCards and Digital Signatures to
    Preserve Electronic Evidence” (Hosmer, 1998). The purpose of the paper was to
    advance the early work of Gene Kim, the creator of the Tripwire technology (Kim,
    1993) as a graduate student at Purdue. I was interested in advancing the model
    of using one-way hashing technologies to protect digital evidence, and specifically
    I was applying the use of digital signatures bound to a SmartCard that provided
    two-factor authenticity of the signing (Figure 3.1).


    Years later I trusted timestamps to the equation adding provenance, or proof of
    the exact “when” of the signing.


    > Two-factor authentication combines a secure physical device such as a SmartCard
    with a password that unlocks the capability of the card’s. This yields “something
    held” and “something known.” In order to perform applications like signing, you
    must be in possession of the SmartCard and you must know the pin or password that
    unlocks the cards function.


    Thus, my interest in applying one-way hashing methods, digital signature algorithms,
    and any cryptographic technologies to the field of forensics has been 15-year
    journey . . so far. The application of these technologies to evidence preservation,
    identification, authentication, access control decisions and network protocols
    continues today. I want to make sure that you have a firm understanding of the
    underlying technologies and the many applications for digital forensics, and of
    course use of Python forensics.


    ![](img/77956026d6b06352c72ae6ac437ce8ab_69_0.png)


    FIGURE 3.1


