  md: '# CHAPTER 12 Looking Ahead


    time of this writing February 9, 2014 to be exact, Python Version 3.4 was released.
    According to the Python Programming Language Official Web Web (www.python.org),
    the major language improvements included:


    +   1. a "pathlib" module providing object-oriented file system paths

    2. a standardized "enum" module

    3. a build enhancement that will help get introspection for built-ins

    4. proved semantics for object finalization

    5. adding single-dispatch generic functions to the standard library

    6. a new C API for implementing custom memory allocators

    7. changing file descriptors to not be inherited by default in subprocesses

    8. a new "statistics" module

    9.izing module metadata for Python''s module import system

    10. a bundled installer for the pip package manager

    11. a new "tracemalloc" module for tracing Python memory allocations

    12. a new hash algorithm for Python strings and binary data

    13. a new import protocol for pickled objects

    14. a new "asyncio" module, a new framework for asynchronous I/O


    As you see the language evolution continues at a brace pace along with the development
    of new and third-party Python libraries that help accelerate and digital investigation
    tools. There are so many third-party libraries and tools, I decided to list my
    top 10.


    +   1. Pillow. A new library that builds off of the more traditional Python Image
    Library for that process and examine digital images.

    2. wxPython. For those of you that need to build cross platform graphical user
    interfaces this is my preferred toolkit.

    3. Requests. One of the best http interface libraries.

    4. Scrapy. For your forensics require you to perform web scraping, this library
    will help you build new and innovative approaches.

    5. Twisted. For those needing to develop asynchronous network applications.

    6. Scapy. For those who perform packet sniffing and analysis, scrapy provides
    a host of features that can speed your development.

    7. NLTK. Natural Language Toolkit—This is vast and for those investigating text
    and language constructs, it is a must.

    8. IPython. When experimenting with new language elements, libraries, or modules
    this advanced Python Shell will assist you in every aspect of your work or struggles.

    9. WingIDE. This is not a library, but this Integrated Development Environment
    gets you for the best IDE. The Professional version provides even the most savvy
    researcher with the tools they need.

    10. Googlemaps. For many forensic applications collect geographically tagged information,
    this package allows you to easily integrate with the Google mapping system.'
