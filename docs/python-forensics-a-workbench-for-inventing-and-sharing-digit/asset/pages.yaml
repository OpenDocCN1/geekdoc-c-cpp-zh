  md: '# Adding Time to the Equation


    business transactions and events. (Usually recorded on paper, these time records
    provided an evidentiary trail due to a number of unique attributes—the distinctiveness
    of the ink embedded in the paper, the style and method of type, whether mechanical
    or hand written, the paper and its characteristics, and the detectability of modifications,
    insertions, or deletions.) In the electronic world where documents and timestamps
    are simply bits and bytes, authoritative proof of the time of an event has been
    hard to nail down. The security of time is absolutely linked to its orig from
    an official source, the reliance on easily manipulated time sources (e.g., typical
    computer system clocks) is problematic.


    Precision and reliability have been the major factors driving the design of electronic
    timing technology. The next technology wave adds the dimensions of authenticity,
    security, and auditability to digital timestamps. These three attributes, when
    applied to documents, transactions, or any other digital entity, provide the following
    advantages over traditional computer clock-based timestamps:


    +   - Assurance that time came from an official source

    - Assurance that time has not been manipulated

    - An evidentiary trail for auditing and nonrepudiation


    Authentication (knowledge of the originator''s identity) and integrity (protection
    against content modification) are essential elements in trusted transactions.
    But if one cannot trust the time, can the transaction be trusted? Secure timestamps
    add the missing link in the trusted transaction equation: “when” when did it happen?
    However, for the timestamp to provide a reliable answer to that question, the
    time upon which it must be derived from a trusted source.


    # ADDING TIME TO THE EQUATION


    Using the best practices adopted to today, digital signatures are able to successfully
    bind “who” (the signer) with the “what” (the digital data). However, digital signatures
    have shortcomings that leave two critical questions unanswered:


    +   1. When did the signing of the digital evidence occur?

    2. How long can we prove the integrity of the digital evidence we signed?


    For both of these questions, time becomes a critical factor in proving the integrity
    of digital evidence. Through the work of the Internet Engineering Task Force (IETF)
    and private companies, timestamping has advanced to a realistic deployment-stage.


    To understand this, we must first understand a little about time itself and what
    is necessary if we choose to utilize time as a digital evidence trust mechanism.
    From ancient societies to the present day, time has been interpreted in many ways.
    Time is essentially an agreement that allows society to function in an orderly
    fashion—where all parties are easily able to understand the representation. Some
    examples of time measurement are included in Figure 6.2.'
