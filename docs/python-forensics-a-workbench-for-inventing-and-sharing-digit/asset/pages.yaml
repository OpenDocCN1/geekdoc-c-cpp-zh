  md: '# CHAPTER 5 Forensic Evidence Extraction (JPEG and TIFF)


    I have highlighted the GPSInfo data associated with this photograph. I was able
    to identify the GPSInfo TAG based on the output of the previous Code Script 5.1,
    which already showed that the GPSInfo TAG had a key value of 34853. Therefore,
    this camera, the Canon EOS 400D DIGITAL, provides the GPS data highlighted by
    the curly braces. Closer examination of the GPS data reveals the specific key
    pairs that are available. As you can see, the key pairs embedded in the GPSInfo
    dictionary are 0, 1, 2, 3, 4, 5, and 6. These TAGS refer to the standard GPS TAGS.
    In Code Script 5.2, I printed out all the possible GPS TAGS that were provided
    by the Canon EOS 400D. They include:


    +   0 GPSVersionID

    1 GPSLatitudeRef

    2 GPSLatitude

    3 GPSRefManager

    4 GPSLongitude

    5 GPSAltitudeRef

    6 GPSAltitude


    With this information I calculate the latitude and longitude provided by the EXIF
    data within the photograph using the following process. But, first, I need to
    extract the latitude from the key value GPSTag 2:


    ((59, 1), (55, 1), (37417, 1285))


    Each latitude and longitude value contains three sets of values. They are:


    +   Degrees: (59, 1)

    Minutes: (55, 1)

    Seconds: (37,417, 1285)


    You might be wondering why they are represented like this. The answer is the EXIF
    data does not have holding point numbers (only whole integers). In order to provide
    more precise latitude and longitude, each pair represents a ratio.


    Next, I need to perform the ratio calculation to obtain a precise value, yielding:


    +   Degrees: 59/1 = 59.0

    Minutes: 55/1 = 55.0

    Seconds: 37417/1285 = 29.118279

    Or more stated 59 degrees, 55 minutes, 29.118279 seconds.


    Next, most online mapping programs (i.e., Google Maps) require data to be viewed
    as a fractional value. This is accomplished by using the following formula.

    Degrees + (minutes/60.0) + (seconds/3600.0)'
