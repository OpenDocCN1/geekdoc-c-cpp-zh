    # INTRODUCTION


    Simple and complex digital data structures offer significant opportunities to
    collect and extract valuable evidence. Files have simple metadata that define
    modified, access, and created times along with file ownership, size, and other
    attributes that label the file as read-only, system, or archive. This information
    is easy to retrieve and examine with common desktop tools. Memory snapshots contain
    both structured and'
