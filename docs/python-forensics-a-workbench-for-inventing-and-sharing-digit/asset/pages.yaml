  md: '# CHAPTER 9 Network Forensics: Part II


    The first character in the format string represents the byte order of the data,
    for network packets this is in big endian format. This is represented as the exclamation
    point that is the first character in the format specification. You could also
    use ">" greater than also means big endian, but the explanation point is for those
    of us who can never remember the typical byte order of network data. Actually,
    it is good to use the exclamation point because this immediately identifies the
    format string as relating to a network packet.


    The table below provides a mapping of each of the format characters related to
    the IPv4 header.


    * !BBHHHBBH s4 s*


    | Format | Size (Bytes) | Mapping to IPv4 | Definition |

    | B | 1 | Version and IHL | 4-bit version field (this will be 4, for IPv4) 4-bit
    Internet Header representing the number of 32 bits contained in the header |

    | B | 1 | DSCP and ECN | 7-bit Differentiated Services Code Point 1-bit Congestion
    Notification |

    | H | 2 | Total Identification | 16 bits defines the entire packet size 16 bits
    identifier for a group of IP fragments |

    | H | 2 | Flags and fragment offset | 3-bit fragmentation flag 13-bit fragment
    offset value |

    | B | 1 | Time to live (TTL) | 8-bit TTL value to prevent packet looping |

    | B | 1 | Protocol | 8-bit value identifying the protocol used in the data portion
    of the packet |

    | H | 2 | Header Checksum value | 16-bit checksum value for error detection |

    | 4 s | 4 | Source IP address | 4-byte source IP address |

    | 4 s | 4 | Destination IP address | 4-byte destination IP address |


