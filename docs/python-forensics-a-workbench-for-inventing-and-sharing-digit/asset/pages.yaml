  md: '# Keyword Context Search


    Next, we have to solve the problem of extracting words and phrases from the target
    of a search. Almost always requires that a binary file or stream be passed. These
    binary data could be a memory snapshot, a disk image or a snapshot of network
    data. The key is the data could be either unformatted or formatted based on hundreds
    of standards, some open and proprietary with text and binary data intertwined.
    if we would like to develop a search tool that could extract and compare text
    strings without regard to the format or content, how might we accomplish this?


    The first challenge would be to define what Python data object we would use to
    hold this binary data. For this I have chosen the Python object bytearray this
    fits our criteria. As the name implies bytearrays is a series of bytes (a byte
    being unsigned 8-bit) starting at the zero array element and extending to the
    end of the array. I am going to take advantage of a couple of Python specialties,
    for example, loading a file into a bytearray, the core to do so is only two lines.


    The first line opens a file for reading binary mode. The second line reads the
    contents of the file into a bytearray namedTarget. You notice that I fix this
    simply makes the code more readable and anyone would immediately recognize that
    the object is of type bytearray. Also, note this is just an illustration. In the
    real program, we check the return values from the functions and make sure there
    are no errors, I will illustrate that technique when we get to our protocol.


    ```

    targetFile = open(''file.bin'', ''rb'')

    Target = bytearray(targetFile.read())

    ```


    One of the immediate questions you might have, "how do I know how many bytes were
    loaded into the bytearray?" This is handled like any other Python using the len
    function.


    ```

    sizeOfTarget = len(baTarget)

    ```


