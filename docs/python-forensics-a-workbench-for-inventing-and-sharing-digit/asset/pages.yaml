  md: '# What is Included in the Standard Library?


    # File formats


    Also built into the Standard Library are modules to handle special file formats;
    for example, comma separated value (CSV) files, the Hypertext Markup Language
    (HTML), the eensible Markup Language (XML), and even the JavaScript Object Notation
    (JSON) format. We will be using these modules in later chapters to carve data
    from Web pages and other Internet content, and to create standardized XML output
    files for generating reports.


    # Cryptographic services


    We will make extensive use of the hashlib cryptographic module to solve some problems
    that face digital investigators in Chapter 3. The hashlib module not only supports
    legacy-one cryptographic hashing as MD5 but also directly supports modern-way
    hashing algorithms as SHA-1, SHA256, and SHA512. The ease of integration and use
    of these libraries along with the optimized performance provides direct access
    to functions that are vital to digital investigation.


    # Operating system services


    The operating systems (OS) services provide access to core functions that work
    across platforms. In Figure 2.24 we utilize the os module to list the contents
    of current working directory. The steps are pretty simple:


    +   1. Import the os module

    2. We use the os modules.getcwd() method to retrieve the current directory path,
    in other words the path we are currently on

    3. We store the value in the variable myCWD


    ```

    C:\Users\python.exe

    >>> import os

    >>>

    >>> myCWD = os.getcwd()

    >>>

    >>> dirContents = os.listdir(myCWD)

    >>>

    >>> for names in dirContents:

    .... print(names)

    ....

    ....DLs

    ....Doc

    ....include

    ....libs

    ....LICENSE.txt

    ....NEWS.txt

    ....python.exe

    ....python.exe

    ....BEACON.txt

    ....Tools

    ....wopen.exe

    >>>

    ```


    FIGURE 2.24


    Example using the os module from the Standard Library.'
  merge: -1
