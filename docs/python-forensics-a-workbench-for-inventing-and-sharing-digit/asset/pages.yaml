    \ always a risk when writing a book like this, but in this case I believe it most.\
    \ Most of us have read not all of the works of Sir Arthur Conan Doyle's Sherlock\
    \ Holmes novels and short stories. In these fictional accounts, Holmes uses both\
    \ deductive and inductive reasoning to create theories about the crime and profiles\
    \ of the suspects, victims, and bystanders.\n\nDeductive reasoning takes risk,\
    \ in other words if you have verifiable facts along with a valid conclusion must\
    \ be true. For example:\n\n+   1. All men are mortal\n2. Socrates was a man\n\
    \   Therefore, Socrates was mortal.\nInductive reasoning on the other hand takes\
    \ risks and uses probabilities. For example:\n3. John allows leaves for the office\
