- img_proc: true
  md: '# CHAPTER 8 Network Forensics: Part I


    | Table 8.1 Categories of Network Ports |

    | Category | Port Range | Usage |

    |---|---|---|n| Well-known ports | 0-1023 | These ports are used by system processes
    that provide network services that are widely used |

    | Registered ports | 1024-49,151 | Registration is managed by the Internet Corporation
    for Assigned Names and Numbers (ICANN). Or, more specifically, by Internet Assigned
    Assigned Numbers Authority (IANA) which is now operated by ICANN [ICANN] |

    | Dynamic ports | 49,152-65,535 | The ports are typically ephemeral in nature
    (short-lived). The ports are allocated automatically from a predefined range by
    the operating system as needed. Servers these ports are used to continue communication
    connections with clients originally connected to well-known ports such as the
    File Transfer Protocol or FTP |


    # Examples of well-known ports


    Some well-known ports that you may be familiar with are given in Table 8.2 (note
