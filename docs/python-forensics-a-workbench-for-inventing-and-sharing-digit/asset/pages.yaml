  md: '# Naming Conventions and Other Considerations


    Before I dive right in and start writing code, as promised I want to set up some
    ground rules for using the Python programming language in forensic applications.


    # NAMING CONVENTIONS AND OTHER CONSIDERATIONS


    During the development of Python forensics applications, I will define the rules
    and naming conventions that are being used throughout the cookbook chapters in
    the book. Part of this is to compensate for Python''s lack of the enforcement
    of strongly typed variables and true constants. More importantly it is to define
    a style that will make the programs more readable, and easier to follow, understand,
    and modify or enhance.

    Therefore, here are the naming conventions I will use.


    # Constants


    Rule: Uppercase with underscore separation

    Example: HIGH_TEMPERATURE


    # Local variable name


    Rule: Lowercase with bumpy caps (underscores are optional)

    Example: currentTemperature


    # Global variable name


    Rule: Prefix gl lowercase with bumpy caps (underscores are optional)

    Note: Globals should be contained to a single module

    Example: gl_maximumRecordedTemperature


    # Functions name


    Rule: Uppercase with bumpy caps (underscores optional) with active voice

    Example: ConvertFarenheitToCentigrade(...)


    # Object name


    Rule: Prefix ob_ lowercase with bumpy caps

    Example: ob_myTempRecorder


    # Module


    Rule: An underscore followed by lowercase with bumpy caps

    Example: _tempRecorder'
