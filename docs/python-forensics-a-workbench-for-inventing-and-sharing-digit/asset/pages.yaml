    # PORT SCANNING


    Once I have identified endpoints within our network, the next step is to perform
    a port scan. What exactly is a port scan, or more specifically a TCP/IP port scan?
    Computers that use communication protocols utilize ports in order to make connections
    to other parties. In order to support different conversations with multiple parties,
    ports are used to distinguish various communications. For example, web servers
    can use the Hyper Transfer Protocol (HTTP) to access to a web page which utilizes
    TCP port 80 by default. The Simple Mail Transfer Protocol or SMTP uses port 25
    to send or retrieve mail messages. For each IP address, a port number is identified
    by a 16-bit number, commonly known as the port number 0-65,535. The combination
    of a port number and IP address provides a complete address for communication.
    The parties that are communicating will each have an IP address and port number.
    Depending on the direction of the communication both a source and destination
    address (IP address and port combination) are required.


    Ports are divided into three basic categories as in Table 8.1.'
