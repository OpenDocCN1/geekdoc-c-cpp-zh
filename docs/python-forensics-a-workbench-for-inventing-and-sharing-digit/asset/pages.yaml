  md: '# Preface


    Over the past 20 years I have had the privilege to work with some of the best,
    brightest, and dedicated forensic investigators throughout the world. These men
    and women work tirelessly to find the truth—usually working under less than ideal
    conditions and under the stress of real deadlines. Whether they are tracking child
    predators, criminal organizations, terrorists, or just good old fashion criminals
    trying to steal your money gets larger by the gun and need the best of their fingertips.


    I communicate regularly with industry leaders developing the latest forensic products,
    while evolving their current software baseline to meet the needs of the broadest
    audience possible. I also communicate with customers trying to solve real-world
    problems that require immediate answers to questions, while the volume of data
    holding the answer gets larger by the second.


    As a scientist and teacher, I see a thrift from students, law enforcement personnel,
    and information technology professionals who possess a burning desire, unique
    investigative skills, an understanding of the problem, and most innovative ideas
    to processing the cases. However, many cases they lack the computer science skills
    necessary to make a direct contribution to the cause.


    The Python programming language along with the global environment offers a path
    for new innovation. More importantly the language opens the door for broad inclusion
    and participation of free tools, and technology that can revolutionize the collection,
    processing, analysis, and reasoning forensic evidence. This book provides a broad
    set of examples that are accessible by those with zero or little knowledge of
    programming, as well as those with solid developer skills that want to explore,
    jump start, and participate in the expanded use of Python in the forensic domain.
    I encourage you to participate, share your knowledge, and help us advance this
    cause.


    # INTENDED AUDIENCE


    I have written the book to be accessible by anyone who has a desire to learn how
    to leverage the Python language to forensic and digital investigation problems.
    I always thought of this as an on-ramp and a beginning that I hope this will inspire
    you to create something great and share it with the world.


    # PREREQUISITES


    Access to a computer, familiarity with an operating system (Windows, Linux, or
    Mac) and access to the Internet, coupled with a desire to learn.'
