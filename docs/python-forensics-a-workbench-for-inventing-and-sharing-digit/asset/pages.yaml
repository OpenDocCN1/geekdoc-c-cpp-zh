    \ 'NTP Request Failed'\n```\n\n# Program Output\n\nNIST reported seconds since\
    \ the Epoch : 138213261.96\nNow that we can obtain the seconds since the epoch,\
    \ we can use the Python Standard Library time to display the seconds in either\
    \ local or GMT/UTC time, and can even compare the current NTP time to our own\
    \ local system clock as shown below.\n\n# CODE LISTING 6.1\n\n```\nimport ntplib\n\
    import time\n\nNIST='nist1-macon.macon.ga.us'\n\ntp=ntplib.NTPClient()\n\ntpResponse=ntp.request(NIST)\n\
    \nif (ntpResponse):\n    now=time.time()\n    diff=now-ntpResponse.tx_time\n \
