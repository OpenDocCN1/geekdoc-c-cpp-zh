  md: "# CHAPTER 4 Forensic Searching and Indexing Using Python\n\nHow can this be\
    \ accomplished easily in Python?\n\nIn order to tackle keyword searching with\
    \ Python we must first address several issues. First, how should we store the\
    \ search words or phrases? Python has several built-in data types that are ideally\
    \ suited to handle lists each with their unique capabilities and rules. The basic\
    \ types are sets, lists, and dictionaries. My preference would be to create a\
    \ set to hold the search words and phrases. Sets in Python provide a way of dealing\
    \ with this type of data mainly due to the fact that they automatically eliminate\
    \ duplicates, they are trivial to implement, and they can be easily tested for\
    \ members.\n\nThe code below demonstrates the basics. I start by initializing\
    \ an empty set searchWords. Next, the code opens and reads the file narc.txt that\
    \ contains narcotic-related words and phrases. I of course include exception handling\
    \ for the file operations to we successfully opened and then read each line from\
    \ the file. Next, I print the list of search words and phrases that were loaded\
    \ by line (notice one word or phrase per line) and then search the list for the\
    \ word 'kryptonite' and print 'Found word' if the word exists in the search list\
    \ or 'not found' if the word does not exist. First I point, I specify line.strip()\
    \ when adding the words to the searchWords. This strips the newline characters\
    \ that exist at the end of each line.\n\n```\nimport sys\nsearchWords = set()\n\
    try:\n    fileWords = open('narc.txt')\n    for line in fileWords:\n        searchWords.add(line.strip())\n\
    except:\n    print('file handling error')\n    sys.exit()\nprint(searchWords)\n\
    if ('kryptonite' in searchWords):\n    print('Found word')\nelse:\n    print('not\
    \ found')\n```\n\nExecuting the code produces the output of:\nStarting with the\
    \ contents of the set:\n\n{'devil drug', 'do a line', 'scrabble', 'casper', 'hell',\
    \ 'kryptonite', 'mojo', 'blow', 'stones tornado', 'white powder', 'smoking gun',\
    \ 'happy dust', 'gravel', 'hardball', 'moonrocks', 'monster', 'beat', 'snow sugar',\
    \ 'coke', 'rock', 'base', 'blast', 'pimp', 'sweet stuff', 'candy', 'chalk', 'nose',\
    \ 'mama coca', 'freeze chill'}\n\nThen printing the results of the search for\
    \ kryptonite produces\nFound word\nThis simple code shows two fundamental challenges:\n\
    \n+   (1) Reading a list into a set from a file\n(2) Searching a set to determine\
    \ if an entry exists in a set."
