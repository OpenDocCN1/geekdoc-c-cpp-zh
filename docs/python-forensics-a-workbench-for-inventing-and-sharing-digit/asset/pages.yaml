    performance of each result to determine how long it would take both on a higher
    performance Linux platform and in the cloud. I took those results and extrapolated
    them in order to determine the time and computers needed to reasonably crack 8-character
    passwords.


    # SUMMARY QUESTION/CHALLENGE


    +   1. What other applications would be useful to execute within cloud environments
    that would benefit the forensic and investigation community?

    2. As of this writing, Intel and AMD are experimenting with single processor core
    counts of 16, 32, 64, and 96 cores. If we extrapolate just a few years in the
    future it would not be unreasonable to expect the achievement of 1000-core CPUs.
    How will this change our ability to generate and hash passwords, crack encryption,
    or search data?

    3. Develop and test your own multi-core solution on your desktop environment.
