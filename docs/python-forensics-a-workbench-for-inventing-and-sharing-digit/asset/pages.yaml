  md: '# CHAPTER 10 Multiprocessing for Forensics


    # WHAT IS MULTIPROCESSING?


    Simply stated multipcessing is the simultaneous execution of a program on two
    or more central processing units (CPUs) or cores. In order to provide significant
    performance improvements, the developer of forensic applications must define all
    of the code that have the following characteristics:


    +   (1) The code is processor-intensive.

    (2) It is possible to break the code apart into separate processing threads that
    can execute in parallel.

    (3) The processing between threads can be load-balanced. In other words, the goal
    is to distribute processing such that each of the threads complete at approximately
    the same time.


    As may already surely, the problem with general purpose forensic tools is: if
    they were not engineered to meet the objectives above from the start, adapting
    them to modern multi-core architectures may prove difficult. In addition, licensing
    of such technologies to run simultaneously on multi-cores or in the cloud may
    be cost-prohibitive. Finally, many of the most commonly used forensic tools operate
    within the Windows environment which is not ideally suited to run simultaneously
    on thousands of cores.


    # PYTHON MULTIPROCESSING SUPPORT


    The Python Standard Library includes the package “multiprocessing” (Python multiprocessing
    module). Using the Python Standard Library for multipcessing is a great place
    to begin multipcessing and will ensure compatibility across a wide range of computing
    platforms, including the cloud. We utilize the multiprocessing package in typical
    fashion by importing the package multiprocessing. After import of the package,
    I execute the help(multiprocessing) function to reveal the details. I have eliminated
    some of the extraneous data produced by help, and I have highlighted the functions
    and classes that I will be utilizing to develop a couple of examples.


    ```

    import multiprocessing


    help(multiprocessing)


    # NOTE this is only a partial excerpt from the output

    # of the Help command


    Help on package multiprocessing:


    NAME

    multiprocessing

    ```'
