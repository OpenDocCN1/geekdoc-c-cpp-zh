  md: '# Looking Ahead 12


    # CHAPTER CONTENTS


    +   - Introduction 305

    - Where Do We Go From Here? 307

    - Conclusion 312

    - Additional Resources 312


    # INTRODUCTION


    The world of digital investigation and computer forensics is approaching 25 years
    in age. I had the privilege of working with Ron Stevens from the New York State
    Police who was one of the first pioneers and one of the first troopers in the
    country to successfully collect evidence from computers and use to convict those
    involved in criminal activity. “As one of the first enforcement agencies to respond
    to the threats posed by the techno-criminal, the New York State Police launched
    the Computer Crime Unit in 1992” (Stevens, 2001).


    I also had the privilege of serving as the primary investigator on the first digital
    forensic effort sponsored by the Air Force Research Laboratory in 1998. The effort
    was conceived by two pioneers in the field working at the U.S. Air Force Research
    Lab, Joe Giordano and John Feldman. The effort was titled: Forensic Information
    Warfare Requirements and resulted in a comprehensive report that outlined a set
    of requirements for the field moving forward (FIW Report, 1999)


    However, it would be a mistake to think of digital investigation, cybercrime,
    or computer forensics as a nature science or discipline. The following is an excerpt
    from a presentation I gave at the First Digital Research Workshop in 2001 (DFRWS,
    2001).


    > Digital Evidence Fundamentals


    +   - Digital evidence is vast, complicated, and can be easily manipulated, concealed,
    destroyed, or never found


    +   - Connecting the dots can be an arduous process, fraught with uncertainty
    and in many cases is inconclusive


    +   - The distributive nature of cyber-crime and cyber-terrorism makes tracing
    the perpetrators, the victims, and the technology used to execute the attack or
    crime difficult'
