    # The simplest network client server connect using sockets


    As a way of introduction to the sockets API provided by Python, I will create
    a simple network server and client. To do this I will use the same host (in other
    words the client and server will use the same IP address executing on the same
    machine), I will specifically use the special purpose and reserved *localhost*
    loopback IP address 127.0.0.1. This standard loopback IP is the same on virtually
    all systems and are messages sent to 127.0.0.1 never reaches the outside world,
    and instead are automatically returned to the *localhost*. As you begin to experiment
    with network programming, use 127.0.0.1 as your IP address of choice until you
    perfect your code and are ready to operate on a real network (Figure 8.2).


    In order to accomplish this, I will create two Python programs: (1) server and
    (2) client. To make this work, the two applications must agree on a port that
    will be used to support the communication channel. (We have already decided to
    use the *localhost* loopback IP address 127.0.0.1.) Port numbers between 0 and
    65535 (basically, any unsigned 16-bit integer value). You should stay away from
    lower ports <1024 as they are assigned to standard network services (actually
    the registered ports now range as high as 49,500 but none of those are on our
    current system). For this application I will use port 5555 as it is easy to remember.
    Now that I have defined the IP address and port number, I have all the information
    that I need to make a connection.


    IP Address and Port: One to think about this in more physical terms. Think of
    the IP Address as the street address of a post office and the Port as the specific
    post-office box within the post office I wish to address.


