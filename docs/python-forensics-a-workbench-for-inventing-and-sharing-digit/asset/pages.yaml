    # WHAT IS NATURAL LANGUAGE PROCESSING?


    Before I begin, Natural Language needs to be defined. In 1987, I read the Introduction
    to Natural Language Processing as part of a research project I was working on
    with Dr. James Cook at the Illinois Institute of Technology Research Institute
    (IITRI). My wife Janet also working on Natural Language projects at IITRI with
    Dr. Larry Jones Her employed Natural Language as part of a decision engine could
    better understand the behaviors of cattle. The book referenced the best definitions
    I have seen for Natural Language, therefore I will share that with you here.


    > "Natural Language is any language that humans learn from their environment and
    use to communicate with each other. Whatever the form of the communication, Natural
    Languages are used to express our knowledge and emotions and to convey our responses
    to other people and to our surroundings." [Harris]


