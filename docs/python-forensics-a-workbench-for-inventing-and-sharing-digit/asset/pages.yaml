  md: '# Python Packages and Modules 25


    # The Python Standard Library


    Python''s Standard Library [Standard Library] is quite extensive and offers a
    broad range of built-in capabilities. These built-in functions are primarily written
    in the C programming language for both speed and abstraction. Since the Standard
    Library layer is compatible across systems, interfacing with platform-specific
    APIs (application programming interfaces) are abstracted or normalized for the
    Python programmer.


    One of the fundamental operators that investigators perform the generation of
    one-way cryptographic hash values.


    A one-way cryptographic hash is used to create a signature of an existing string
    of bytes regardless of length (typically referred to as a message digest). One-way
    hashes have four basic characteristics: (1) A function that easily calculates
    and generates a message digest. (2) Possessing the message digest value provides
    no clues to the original message or file. (3) It is infeasible (or computational
    difficulty) to change the contents of the message or file without changing its
    content, but produce the same message digest. (4) It is infeasible to find two
    messages or files that differ in content, but should be noted that attacks against
    known hash methods like MD and SHA-1 have been successful under certain situations.


    The Python Standard Library contains a built-module named `hashlib` that can perform
    one-way cryptographic hashing. The following simple hashing example can be executed
    on virtually any Python platform (Windows, Linux, Mac, iOS, Windows 8 Phone, Android,
    etc.) and produce the same result.


    ```

    # forensics

    # Simple program to generate the SHA-256

    # one-way cryptographic hash of a given string


    # Step 1

    # Instruct the interpreter to import the

    # Standard library module hashlib


    import hashlib


    # print a message to the user


    print("Simple program to generate the SHA-256 Hash of the String ''forensics''")

    print

    ```'
