    investigators, managers, researchers, academics, and anyone else with interest
    in digital forensics: this is a must read”


    Michael Duren (CISSP), Founder of Cyber Moxie


    “With today’s rapid changes in digital forensics tools and practices are being
    forced to change quickly to remain partially effective; and the technical skills
    investigators relied on yesterday are quickly becoming obsolete. However, with
    new technology comes new tools and methods, and the Python language is in one
    of the best possible positions to be leveraged by investigators. Python Forensics
    is quite simply a book that is ahead of its time, and because of this, it is the
    perfect book for both the beginner and the experienced investigator. Chet Hosmer
    does great job of helping the reader refresh older skills and create new ones
    by offering step-by-step instructions and intelligently framing the information
