  md: '# CREATING A CORPUS FROM THE INTERNET


    In many cases, the text that we wish to examine is found on the Internet. By combining
    Pyton, the Python Standard Library urllib, and NLTK we can perform the same types
    of analysis of online documents. I will start with a simple text document downloaded
    from the Gutenberg Project to illustrate.


    I start importing the necessary modules in this case NLTK and the urlopen module
    from the urllib. Note: As you see, I can selectively bring in specific modules
    from a library instead of loading the entire library.


    ```

    >>> import nltk

    >>> from urllib import urlopen

    Next, I specify the URL I wish to access and call the urlopen.2760.method.

    >>> url = "http://www.gutenberg.org/files/2760/2760.txt"

    >>> raw = urlopen(url).read()

    As this returns the type ''str''

    Note: Since I''m entering these commands from the Python Shell and outputting
    the output directly, I''m not using the same tryexcept care that I would use if
    this example was actual program execution. You can of course add that you would
    like.

    >>> type(''str'')

    <type ''str''>

    ```


    Now that I have confirmed that the result is a string, I check the length that
    was returned. In this case 3.6 MB


    ```

    >>> len(raw)

    ```


    368901


    To get a feel for what is contained in this online source, I simply use the standard
    Python string capabilities to print out the first 200 characters, this produces
    the following output.


    ```

    >>> raw[:200]

    ```


    ''CELEBRATED CRIMES, COMPLETE!\nThis eBook is for the use of anywhere at no cost
    and with almost\nno restrictions whatsoever. You may copy it, give it away or
    re-use if\n''


    Now I can perform any of the NLTK capabilities, I have included a couple here
    to give you a feel for the text that I downloaded.'
