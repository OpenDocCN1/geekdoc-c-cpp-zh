  md: 'SPAN ports are most commonly attributed to Cisco (where they were originally
    referred to as port mirroring). Modern switches can be configured to mirror specific
    network ports to a common interface used for network monitoring and interface
    with a variety of appliances.


    # RAW SOCKETS IN PYTHON


    In order to perform packet sniffing in Python, we need the:


    +   1. We must be a network interface card (NIC) that has the ability to operate
    in Promiscuous Mode.

    2. On most modern operating systems—i.e., Windows, Linux, and Mac OS X—you also
    have administrator privilege.

    3. Once we have accomplished 1 + 2, we can create a socket.


    # What is Promiscuous Mode or Monitor Mode?


    When a NIC is placed in Promiscuous Mode, it allows the NIC to intercept and read
    each arriving packet in its entirety. If the NIC is not in Promiscuous Mode, it
    will only receive packets that are specifically addressed to the NIC. Promiscuous
    Mode must be supported by the NIC and by the operating system and by associated
    driver. Not all NICs support Promiscuous Mode, however it is easy to determine
    if you have a NIC and OS capable of Promiscuous Mode.


    # Setting Promiscuous Mode Ubuntu 12.04 LTS Example


    On Linux you can place your NIC into Promiscuous Mode by using ifconfig command.
    (Note administrative privileges are required.)


    ```

    chet@PythonForensics:~$ sudo ifconfig eth0 promisc

    ```


    Next I validate the result:

    (Note the message UP BROAD RUNNING PROMIS MULTICAST message.)


    ```

    chet@PythonForensics:~$ sudo ifconfig

    eth0 Link encap:Ethernet Haddr:00:1e:bc:7d:64

    inet addr:192.168.0.25 Broadcast Mask:192.168.255.255

    inet addr:feb0:2e1c:bcf:feb:7d64/64 Scope:Link

    UP BROAD RUNNING PROMIS MULTICAST MTU:1500 Metric:1

    RX packets:43284 errors:0 overruns:0 frame:0

    TX packets:11338 errors:0 overruns:0 carrier:0

    collisions:0 txqueuelen:1000

    RX bytes:17659022 (17.6 MB) TX bytes:1824060 (1.8 MB)

    ```'
