    be the establishment of an IDE that would provide value, instill confidence, and
    create efficiencies during the development process. In our case, we also want
    to ensure that the quality of what we create will exceed the standards of evidence.
    You have several options for an IDE—some which have a nominal cost of entry. I
    will reveal my choice at the end of the section, but you can choose your own path,
    in many ways this is like choosing between Nike® and Adidas® and is mostly defined
    by what you like and are comfortable with.


