    \ this out in Hex this makes the most sense.\n\n```\nfor i in range(offset, offset+hexSize,\
    \ 16):\n    j in range(0, 17):\n```\n\nThe inside loop needs to print each of\
    \ the next 16 bytes in hex. I start by printing the offset value in hex leaving\
    \ the appropriate amount of same. Note also, I use the syntax %08x which allows\
    \ for an 8 digit Hex zero filled. This should be plenty for this demonstration\
    \ application.\n\n```\nif (j == 0):\n    print \"%08x\" % i\nelse:\n    byteValue\
