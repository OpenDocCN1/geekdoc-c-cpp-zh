    Used in weighting calculation\n\nof weights that can be used to compare strings\
    \ found in raw data (using the same weighting algorithm used to create the original\
    \ matrix) to the matrix. If the calculated weight matches one found in the matrix,\
    \ I consider this a possible word, if not the string is discarded. Figure 4.13\
    \ provides an illustration of how this works. Each of the letters contained in\
    \ the word (ignoring the leading character) are used in the weighted calculation.\n\
    \nSince many times, at least in the English language, are derived from others,\
    \ this eliminates the need for having an all-encompassing dictionary of every\
    \ possible word. In addition, if words are misspelled or newly created or derived,\
    \ it is likely the weighting system vs. a direct match will provide a more literal\
    \ interpretation of the word probable.\n\nThe importance of approximate searches\
    \ and indexes can be vital. In the Casey Anthony case, for example, investigators\
    \ missed probable Internet search history data because for various search terms\
    \ which \"they\" spelled correctly. She, however, had misspelled search terms;\
    \ while Google corrected the spelling during the search, it did not fix the missp\
    \ in the Internet search history.\n\n# CODING isWordProbable\n\nIn order to create\
    \ a method isWordProbable(word), I created a class named Matrix; let us take our\
    \ typical deep dive into this class.\n\n```\nclass class_Matrix:\n    I start\
    \ out by declaring a new set object named the weighted matrix.\n    weightedMatrix\
    \ = set()\n```"
