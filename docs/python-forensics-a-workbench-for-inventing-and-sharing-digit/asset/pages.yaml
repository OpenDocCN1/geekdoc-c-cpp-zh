    # INTRODUCTION


    A couple of decades ago, I was working for a large defense contractor and was
    part of a team that was developing a secure embedded device. My initial role was
    to setup a development environment for the team to use. This may seem like a pretty
    simple task. However, the embedded security hardware was completed and handed
    off to me, the device itself did not include an operating system or supporting
    libraries—it was basically an open slate. Thus, the painstaking task was to develop
    a boot loader that would allow me to load a program onto the device. Once that
    was completed, I needed to develop the ability to interface with the board and
    load additional software (the operating system, shared libraries, applications,
    etc.), that would bring the security hardware contained within the device.


    This interface software needed to include a debugger that would allow us to control
    the operating system and application software being developed by the team while
    it was running on the device. For example, the ability to start the program, stop
    the program, inspect variables, registers, etc., perform single steps, and set
    breakpoints in the code, all this was accomplished through 19,200 baud RS232 interface.


    You might be asking, what this twentieth century example have to do with Python?
    The answer is simple, the requirements for a stable-feature development environment
    still exist in the twenty-first century, but now we have modern tools. Without
    the proper development environment, the chance of successfully developing high-quality,
    function-rich forensic or digital investigation software is quite low.


    # SETTING UP A PYTHON FORENSICS ENVIRONMENT


    Many considerations exist before setting up an environment. I will explore some
    of the key areas that I myself consider when setting up an environment like this.
    Here are important considerations:


    +   1. What is the right environment for your situation? Are you a professional
    software developer; a novice developer with solid investigative skills and ideas
    that you would like to explore; do you work in a forensic lab or support an incident
    response team with new tools and methods; or you might work in the IT security
    group at a corporation and need better ways to collect and analyze what is happening
    on your network.

    2. How do you choose the right third-party libraries and modules that enhance
    your program and allow you to focus on your application and not on reinventing
    the wheel?'
