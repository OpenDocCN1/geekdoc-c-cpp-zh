    \ home promptly at 6:00 AM verified by a surveillance camera and punched in work\
    \ at 7:42 AM.\n   Therefore, John could not have murdered a person at 7:05 AM\
    \ that occurred over 3 years from the office.\n\nThe base of these hypotheses\
    \ whether based on deductive or inductive reasoning is facts. Therefore, I believe\
    \ the reason to search and index is to discover facts that we then use to create\
    \ theories and hypothesis. I know this may seem brutally obvious, but again we\
    \ sometimes narrow in on a theory before we have any trustworthy facts. This is\
    \ especially true in the digital world where we can be quick to judge the case\
    \ is saying \"because I saw it on the Internet\" when in fact the Internet or\
    \ digital data have been manipulated to skew the facts.\n\nSeasoned investigators\
    \ understand this and are typically very thorough in their investigation of digital\
    \ crime scenes. We have had the privilege of working with many investigators and\
    \ validation of digital evidence. I cannot tell you how many times I have been\
    \ asked \"are you sure about that?\" or \"can you prove that\" or \"how else could\
    \ this have happened?\" Finally, we need to be conscious in our searching to discover\
    \ both inculpatory and exculpatory evidence and make both types of facts are recorded\
