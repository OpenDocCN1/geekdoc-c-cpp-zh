    # Examining the PrintBuffer function


    Most of us investigate cyberspace for a living use Hex editors or viewers quite
    often. The PrintBuffer function is a very simple Hex and ASCII viewer which will
    run on any platform (Windows, Linux, Mac, and even mobile devices). The trick
    is to not get fancy, but instead provide the facts. Let us take a look how this
    can be accomplished with a few lines of Python code.


    ```

    def PrintBuffer(word, directOffset, buff, offset, hexSize):

    ```


    +   The inputs to this function are as follows:

    word: The string that was identified

    directOffset: The offset in the target file to the beginning of the alpha string

    buff: The actual buffer

    off: The offset where the Hex/ ASCII viewer should show

    hexSize: What is the size in bytes that should be displayed

