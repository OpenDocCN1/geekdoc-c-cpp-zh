  md: "# Multi-core solution A\n\nMuch of the art associated with multiprocessing\
    \ is decomposing a problem into slices that can run simultaneously across multiple\
    \ cores. Each of the individual slices have completed, the results from each slice\
    \ are merged into a final result. The biggest mistake that is typically made is\
    \ the lack of careful consideration of these two points. Purchasing systems with\
    \ multi-cores and then just running any solution on that multicore system does\
    \ not necessarily buy you much over a single core solution.\n\nUsing our single\
    \ solution as a baseline, I will create a multi-core solution that leverages the\
    \ four cores available on my laptop. For first example, I will instantiate the\
    \ object Process, one for each core. When creating each Process, I only need to\
    \ provide two parameters: (1) the target in which is the name of the function\
    \ that will be called when the object.start() method is called. (2) the args which\
    \ is the argument to be passed to the function. In this example, one argument\
    \ is passed, namely, the name of the file to hash. Once I have instantiated an\
    \ object, I execute the object.start() to kick off each process. Finally, I utilize\
    \ the object.join() for each object; this execution to be halted in the main()\
    \ process until the processes have completed. You can include a parameter with\
    \ object.join() which is a timeout value for the process. For example object.join(2)\
    \ would allow the process 2 s to complete.\n\n```\n# Multiprocessing File Hasher\
    \ A\nimport hashlib\nimport os\nimport sys\nimport time\nimport multiprocessing\n\
