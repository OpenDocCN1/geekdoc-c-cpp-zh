  md: '# 134 CHAPTER 5 Forensic Evidence Extraction (JPEG and TIFF)


    Longitude and latitude locations provide the ability to pinpoint a specific location
    on the earth. The Global Position System and GPS receivers built into smart phones
    and cameras can deliver very accurate geolocation information in the form of longitude
    and latitude coordinates. If configured, this geolocation information can be directly
    embedded in photos, movies, and other digital objects when events occur. Extracting
    the geolocation information from digital objects and then entering that data into
    online services such as Mapquest, Google Earth, etc., can provide evidence of
    where and when that digital object was created.


    If we want to utilize the TAGS to pinpoint location, we need a better definition
    and understanding of the TAGS of interest, their meaning, and usage.

    GPSLatitudeRef: Latitude is specified by either the North or South position in
    degrees from the equator. Those points that are not of the equator range from
    0 to 90 degrees. Those points that reference value is used to define where the
    latitude is in relation to the equator. Since the value is specified in EXIF as
    a positive integer, if the Latitude Reference is “S” or South, the integer value
    must be converted to a negative value.


    GPSLatitude: Indicates the latitude in degrees. The EXIF data specifies these
    whole degrees, followed by minutes and then followed by seconds.

    GPSLongitudeRef: Longitude is specified by either the east or west position in
    degrees. The convention is based on the Prime Meridian which runs through the
    Royal Observatory in Greenwich, England, which is defined as longitude zero degrees.
    Those points that are west of the Prime Meridian range from 0 to –180 degrees.
    Those points that are east of the Prime Meridian range from 0 to 180 degrees.
    This reference value is used to define where the longitude value is in relation
    to Greenwich. Since the value is specified in EXIF as a positive integer, if the
    Longitude Reference is west or “W,”


    GPSLongitude: Indicates the longitude measured in degrees. The EXIF data specifies
    these whole degrees, followed by minutes and then followed by seconds.

    GPSTimeStamp: Specifies the time as Universal Coordinated Time that the photo
    was taken.


    Since the data contained within the EXIF structure are digital values, they are
    subject to manipulation and forgery. Thus, securing the images or obtaining them
    directly from the Smart Mobile device makes fraudulent modification less likely
    and much more difficult to accomplish.


    Now that we have a basic understanding of what TAGS are potentially available
    within a photograph, let us examine an actual photograph. Figure 5.4 depicts an
    image downloaded from the Internet and will be the subject of this experiment.'
