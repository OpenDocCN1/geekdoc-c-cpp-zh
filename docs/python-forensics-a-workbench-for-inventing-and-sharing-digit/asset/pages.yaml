    books “Longitude” by D Sobel:


    > “Anyone alive in the eighteenth century would have known that the longitude
    problem was the thorniest scientific dilemma of the day and had been for centuries.
    Lacking the ability to measure time, sailors throughout the great ages of the
    exploration had been literally lost at sea as soon as they lost sight of land.

    The quest for a solution occupied scientists and their patrons for the better
    part of two centuries when in 1714, England’s Parliament upped the ante by offering
    a king’s ransom (£20,000, approximately $12 million in today’s currency) to anyone
    whose method proved successful. The scientific establishment from Galileo to Sir
