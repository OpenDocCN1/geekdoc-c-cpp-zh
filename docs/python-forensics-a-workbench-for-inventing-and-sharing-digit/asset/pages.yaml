    # Eastern Daylight Time


    Another very useful method within the time module is the strftime(). This method
    provides great flexibility in generating custom strings from the base time structure.
    This allows us to format output without having to extract individual time attributes
    manually.

    Example:


    ```

    import time

    print time.strftime("%a, %d %b %Y:%M:%S %", time.localtime())

    time.sleep(5)

    print time.strftime("%a, %d %b %Y:%M:%S %", time.localtime())

    ```


    This script prints the local time value using the strftime method and uses the
    sleep() to delay (in this example 5 seconds) and then prints another time string.
    The result produces the following output:


    Sun, 13 Oct 2013 10:38:44 AM

    Sun, 13 Oct 2013 10:38:49 AM


    The strftime method has great flexibility in the available options, which are
    shown in Table 6.1.

    As you see the time module has a plethora of methods and attributes and is straightforward
    to use. For more information on the time module, you can check out the Python
    Standard Library [PYLIB].


    # THE NETWORK TIME PROTOCOL


    Today, the most widely accepted practice for synchronizing time is to employ the
    Network Time Protocol (NTP). NTP utilizes the Datagram Protocol (UDP) to minimize
    minimalistic packets communicated between a server (client wishing to synchronize
    with that time source). (The default server for the NTP protocol is 123.) The
    NTP model includes not, one many easily accessible time servers synchronized to
    national laboratories. The point of NTP is to convey or distribute time from these
    servers to the Internet. The Network protocol is guarded by the IETF and the Proposed
    Standard is RFC 5905, titled "Network Time Protocol Version 4: Algorithms and
    Specification" [NTP RFC]. operating systems, and applications have been developed
    to utilize this protocol to synchronize time. As you have guessed we are developing
    a simple synchronization Python program and use this to synchronize forensic operations.
    Instead of implementing the protocol from scratch I am going to leverage a third-party
    Python library ntplib to handle the heavy lifting and compare the results to my
    local system clock.'
