  md: '- Would they accessible and readable by anyone?

    - Would they have the global worldwide support?

    - Do they support a collaborative environment that would provide an on-ramp for
    computer scientists, social scientists, law enforcement professionals, or students
    new to the field?


    The next big steps from my view are as follows:


    +   (1) Creation of a true collaborative environment where people can share information
    (problems, ideas, and solutions).


    +   (2) Obtain nonintimidating support as technology is advanced in support of
    new investigative challenges.


    +   (3) Development of a repository of programs and scripts that could be downloaded,
    applied to real world problems, expanded, and improved.


    +   (5) A validation/certification process that would allow third-party organizations
    (such as NIST) to validate Python supplied solutions for use by law enforcement.
    Once validated they could be safely utilized on real cases. Once the process has
    been created much of the work could be automated through the use of standardized
    forensic test images to accelerate the validation process.


    +   (6) Vendors could supply application interfaces that open the possibility
    to integrate new Python-based solutions into existing forensic technologies. This
    would actually improve the capabilities of vendor solutions, allow them to address
    new issues in a more timely fashion, and make their products more valuable in
    the marketplace.


    +   (7) The creation of a cloud-based experimental platform that has thousands
    (or even hundreds of thousands) of processor cores, petabytes of storage, and
    terabytes of memory that could be applied and harnessed to solve computationally
    difficult problems. In addition, this environment would be open to academia and
    students in order to rapidly advance classroom problems. Collaboration across
    universities, colleges, practitioners, vendors, and researchers to solve truly
    hard problems. The environment could provide a competition surface for new innovations,
    and teams could compete on the national and international stage. Benchmarks for
    specific solution types could be created in order to understand the performance
    characteristics of various solutions.


    +   (8) Key challenges for consideration: Throughout this book, I provided Python-based
    examples for several key areas. These examples provide the basics, however much
    more work is needed. I have identified some of the key challenges that require
    additional work and focus.


    +   a. Advanced searching and indexing: search and indexing are certainly core
