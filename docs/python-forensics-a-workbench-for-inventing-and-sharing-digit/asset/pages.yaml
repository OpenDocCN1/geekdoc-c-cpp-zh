    Table 3.1 Popular One-Way Hashing Algorithms


    **Popular cryptographic hash algorithms?**

    Are a number of algorithms that produce message digests. Table 3.1 provides background
    on some of the most popular algorithms.


    **What are the tradeoffs between one-way hashing algorithms?**

    The MD5 algorithm is still in use, and for many applications the speed, convenience,
    and interoperability have made it the algorithm of choice. Due to attacks on the
    MD5 and the increased likelihood of collisions, many organizations are moving
    to SHA-2 (256 and 512 bits are the most popular sizes). Many organizations have
    opted to skip SHA-1 as it suffers from some of the weaknesses as MD5.

    Considerations for moving to SHA-3 are still in the future, and will be a couple
    of years before broader adoption is in play. SHA-3 is completely different and
    was designed to be easier in hardware to improve performance (speed and power
    consumption) for use in embedded or handheld devices. We will see how quickly
    the handheld devices’ manufacturers adopt this newly established standard.


    **What are the best-cases for one-way hashing algorithms in forensics?**

    **Evidence preservation:** When digital data are collected (for example, when
    imaging a mechanical or solid state drive), the entire contents—in every words
    bit collected—are combined to create a unique one-way hashing value. Once finished
    the recalculation of the one-way hashing can be accomplished. If the new calculation
    matches the original, this can prove that the evidence has not been modified.'
