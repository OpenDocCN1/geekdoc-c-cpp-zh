    +   - At what point was the system log still valid?

    - Did the suspect have the opportunity to commit the crime?


    Fundamental questions


    +   - Where is the suspect in cyber-space?

    - How can I trace his or her steps?

    - Technically

    - Legally

    - Where are they likely to strike next?

    - Are they working with accomplices or insiders?

    - What capabilities do they possess?

    - Bandwidth

    - Computing power

    - Savvy

    - Resources

    - Have we seen them before?

    - Are they more sophisticated now vs. a year ago?

    - Who are their accomplices?


    # Summary


    +   - We must focus our attention on identifying and addressing the key fundamental
    elements of digital forensics and digital evidence

    - We work together to build technologies that address the issues surrounding these
    fundamental elements

    - We need to perform research where the goal is to use the science of forensics
    to help answer the harder questions surrounding cyber-criminals and terrorists

    - Their location, specification, likely next targets

    - What do we need to do to stop them?

    - How do we improve our defenses against them?


    The scary part about this short trip down memory lane is that I could give this
    presentation today, and it would be for the most part relevant. The big question
    is where we go from and how will Python Forensics play a role?


    # WHERE DO WE GO FROM HERE?


    This book has identified key areas where research and development of new solutions
    are possible when combining core challenge problems with the Python language.
    It could be argued that other languages could produce viable solutions to these
    challenges. However, the questions are:


    +   - Would these alternative solutions be open source and free?

    - Would they be cross platform ready (Windows, Mac, Linux, Mobile, and in the
    Cloud)?'
