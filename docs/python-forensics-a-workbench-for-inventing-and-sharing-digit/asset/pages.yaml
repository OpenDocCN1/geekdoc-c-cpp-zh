  md: "# Coding isWordProbable 113\n\nWhen the class is instantiated, the object will\
    \ load the values contained in the matrix into the weighted matrix. To handle\
    \ this I simply added a new line argument -m or --matrix to allow the user to\
    \ specify a matrix file. I take the same precautions as you have seen before to\
    \ trap any errors that might occur during the file handling operations.\n\n```\n\
    def __init__(self):\n    try:\n        fileMatrix=open(gl_args.Matrix, 'rb')\n\
    \        for line in fileMatrix:\n            value = line.strip()\n         \
    \   self.weightedMatrix.add(int(value,16))\n    except:\n        log.error('Matrix\
    \ File Error:'+gl_args.matrix)\n        sys.exit()\n    finally:\n        fileMatrix.close()\n\
    \    return\n```\n\nNext I define the method isProbable which will calculate the\
    \ weight of the passed string and perform a lookup in the weightedMatrix to determine\
    \ if we have a match. Note I first check to see if theWord passed is of minimum\
    \ value.\n\n```\ndef isProbable(self, word):\n    if (len(word) < MIN_WORD):\n\
    \        return False\n    else:\n        BASE = 96\n        wordWeight = 0\n\
    ```\n\nThis is the core weight calculation and produces an unsigned integer wordNameWeight.\n\
    \n```\nfor i in range(4,0,-1):\n    charValue = ord(word[i]) - BASE\n    shiftValue\
    \ = (i-1)*8\n    charWeight = charValue << shiftValue\n    wordWeight = (wordWeight\
    \ | charWeight)\n```\n\nOnce I have calculated the weight I just check to see\
    \ if the weight exists in the weighted matrix.\n\n```\nif (wordWeight in self.weightedMatrix):\n\
    \        return True\n    else:\n        return False\n```\n\nTo properly incorporate\
    \ this into the program the following code is all needed."
