  md: '# Where Do We Go From Here? 309


    and relevance of search and index results is necessary. Investigators need solutions
    that can provide the following in a timely fashion:


    +   Search and index results that deliver information that is relevant to their
    case. This rich search/index capability must uncover information that is not obvious
    or missed by present-day technologies. For example, search results that include
    time and spatial connections into clear view.


    +   Search and index results that connect information from multiple cases together,
    identifying connections between accomplices, Internet, phone, time, location,
    and behavioral analysis that were previously unconnected.


    +   Metadata extraction: Images and multimedia content contain a plethora of metadata,
    but not limited to time, date, the device they were created on, location information,
    subject content, and much more. The extraction, connection, and reasoning about
    this information is today left to the investigator. New innovations bring the
    promise of rapidly extracting and connecting information to a broader comprehensive
    view of the crime scene.


    +   Event synchronization: According to Statistic Brain (2014) in 2013 there were
    an average of 58 million tweets per day over 645 billion Twitter users. In addition,
    (Statistic Brain, 2014) 5.9 Billion searches per day and over 2 trillion searches
    for the year 2013 recorded. This is only a fraction of the Total Events that occur
    each day and year. Our ability to synchronize and reason about events whether
    from the Internet, a corporate network or even an individual desktop may seem
    beyond comprehension. We need to develop innovations that can make sense, isolate,
    and provide conclusive proof about such actions and events.


    +   Natural language: The Internet has quickly broken down boundaries and provided
    interaction and communication instantly across the globe. As I scratched the surface
    of Natural Language Processing (NLP) in Chapter 7, you can see the potential power
    of being able to process language. The application for NLP is for the extraction
    of meaning, determining authorship, deciphering intent are all within our grasp.
    Expanding these technologies to process a wide range of languages, improving deductive
    reasoning, extracting persons, places and things, and assessing likely part, present
    or future actions are.


    +   Advancement in Python. The printed examples and code provided in this book
    were developed for Python 2.7 in order to ensure the broadest compatibility across
    platforms. However, all the examples will also be available for download with
    solutions for 2.7.x and 3.3.x.


    Python and third-party Python libraries continue to expand at the speed of the
    Internet. Some even claim Python will be the last programming language you will
    ever have to learn. This is a bit overstated however, some of the attributes of
    the language will be fundamental to future languages. At the'
