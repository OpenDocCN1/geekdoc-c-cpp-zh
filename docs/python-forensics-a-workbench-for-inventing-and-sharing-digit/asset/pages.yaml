  md: '# Code Walk-Through 137


    Note: the denominators of 60.0 and 3600.0 represent the number minutes (60.0)
    and\seconds (3600.0) in each hour, respectively.

    Thus this latitude represented as floating point number would be:


    Latitude = 39.0 + (55/60.0) + (29.118279/3600.0)

