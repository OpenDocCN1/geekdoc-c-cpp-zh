    The question then becomes what facts do we wish to discover? Fundamentally, the
    answer is wo, what, where, when, and how or to be slightly more specific, here
    we are small set of examples.


    You might be wondering about the “Why” of the search. We tend not to think about
    why as in many cases this is generated by the investigator, through experience,
    intuition, and deep understanding regarding the circumstances that surround the
    case.


    +   * What documents exist and what is their content or relevance? When were they
    created, modified, last accessed, and how many times were they printed? Were the
    documents stored or written to a file device or stored in the cloud? Where did
    they originate?

    * Multimedia files exist and where do they originate? For example, were they downloaded
    from the Internet or recorded or snapped by the suspect or victim. If so, what
    camera or recording device was used?

    * Who is the suspect we are investigating and what do we know about them? Do we
    have a photograph, phone numbers, e-mail addresses, home address, where do they
    work, and where and have they traveled, do they own a vehicle(s), if so what make,
    model, year, and plate number? Do they have an alias (physical world or cyber
    world)?

    * Who are their known associates, what do we know about them?


    I think you get the idea, the questions that we ask during a search are with some
    being very specific and others more general. In this chapter, we cannot solve
    all of these issues, but we can scratch the surface and create Python programs
    that will assist us now and be able to evolve in the future.


    # KEYWORD CONTEXT SEARCH


    Keyword searching with context is the ability to perform a search of a data object
    like a disk image or a memory snapshot, and discover keywords or phrases that
    relate to a specific context or category. For example, I might want to perform
    a search of a disk image for each occurrence of the following list of street names
    for the drug cocaine:


    blow, C, candy, coke, do a line, freeze, girl happy dust, mama coke, mocha, monster,
    nose, pimp, shot, smoking gun, snow, sugar, sweet stuff, white powder, base, beat,
    blaster, caster, chalk, devil drug, gravel, hardball, hell, kryptonite, love,
    moonrocks, rock, scrabble, stones and tornado.'
