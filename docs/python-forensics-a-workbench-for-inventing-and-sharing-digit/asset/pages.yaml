  md: "# Network Investigation Basics 207\n\n192.168.0.1 Network Address Local Host\
    \ Address\n\nIn this example host, network device, router, firewall, etc., on\
    \ the local network would have the same network address portion of the IP address\
    \ (192.168.0), but each will have a unique IP address ranging from 0 to 255. This\
    \ allows for 256 unique IP addresses within the local environment. Thus the range\
    \ would be: 192.168.0.0-192.168.0.255. However, only 254 addresses are usable,\
    \ because 192.168.0.0 is the network address and cannot be assigned to a local\
    \ host, and 192.168.0.255 is dedicated to the broadcast address.\n\nBased on this,\
    \ I could use a simple built-in Python language capabilities to create a List\
    \ of IP addresses that represent the complete range. These language capabilities\
    \ include a String, the range function, and a “for loop.”\n\n```\n# Specify the\
    \ Base Network Address (the first 3 octets)\nipBase = '192.168.0.'\n\n# Next Create\
    \ an Empty List that will hold the completed\n# List of IP Addresses\nipList =\
    \ []\n# Finally, loop through the possible list of local host\n# addresses 0-255\
    \ using the range function\n# Then append each complete address to the ipList\n\
    # Notice I use the str(ip) function in order\n# concatenate the ipBase with list\
    \ of numbers 0-255\n```\n\n```\nfor ip in range(0,256):\n    ipList.append(ipBase+str(ip))\n\
    \    print ipList.pop()\n```\n\nProgram Output Abbreviated\n192.168.0.0\n192.168.0.1\n\
    192.168.0.2\n192.168.0.3\n......skipped items\n192.168.0.252\n192.168.0.253\n\
    192.168.0.254\n192.168.0.255\n\nAs you can see, manipulating IP addresses with\
    \ standard Python language elements is straightforward. I will employ this technique\
    \ in the Ping Sweep section later in this chapter."
