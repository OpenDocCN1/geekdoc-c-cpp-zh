    You probably remember this line from the book and then the movie “The Hunt for
    Red October” [CLANCY] spoken so eloquently by Sean Connery as Marko Ramius. Of
    course they were using a sonar wave to calculate the distance between the Red
    October and the USS Dallas (Figure 8.4).


    Similar to submarine warfare, one of the key to network investigation is the discovery
    of all the hosts (or more generally referred as endpoints) on a network. This
    is accomplished by sending a ping (using an Internet Control Message Protocol,
    or ICMP for short) to each possible IP address on the network. The addresses that
    respond provide us with two pieces of information: (1) if they are active and
    responsive and (2) how long it took for the response to return. One special note,
    however, many modern firewalls block ICMP messages as they can be used by hackers
    to perform reconnaissance on networks. This is also true of modern operating systems,
    by default they will not respond to ICMP. However, inside the network they provide
    a valuable service to locate and detect endpoints on a network.


    For this next cookbook example, I will develop a ping sweep application in Python
    to scan a network for available IP addresses. I will be using special modules
    for the first. I will use wxPython to build a simple graphical user interface
    (GUI) for the ping sweep application. Second, I will be using a third-party module,
    Ping.py which is completely written in Python that handles the heavy lifting of
    the ICMP protocol.


    I choose to develop the applications in this chapter within a GUI environment
    for two reasons—first to give you exposure to a cross platform GUI environment
    wxPython, and second because the execution of ping sweeps using command line options
    would be quite tedious and the GUI interface will simplify the interaction.'
