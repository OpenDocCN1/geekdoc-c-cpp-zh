    capture network packets. In order to do so, I explained the Promiscuous Mode of
    network adapters and demonstrated how to configure a NIC for this. I also discussed
    the importance of network sniffing in order to more thoroughly map and monitor
    network activities. I used the packet() function to extract each field from the
