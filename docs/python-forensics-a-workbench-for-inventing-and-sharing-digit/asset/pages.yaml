    FIGURE 3.10


    Contents of the pFish.log file.


    The generated pFish.log file results are depicted in Figure 3.10. As expected
    we find the welcome message, the details regarding the Windows environment, the
    root path that was specified by the user, the number of files processed, and the
    elapsed time of just under 1 s. In this example no errors were encountered and
    the program terminated normally.


    Moving to a Linux platform for execution requires us to copy two Python Files.


    +   1. pfish.py

    2. _pfish.py


    Execution over Linux (Ubuntu version 12.04 LTS in this example) works without
    changing any Python code and produces the following results shown in Figures 3.11–13.


    Notice that the pFish.log file under Linux has no warnings; this is due to lack
    of read access to many of the files within the /etc directory at the user privilege
    level I was running and due to some of the files being locked because they were
    in use.


    # CHAPTER REVIEW


    In this chapter I created my first usable Python forensics application. The pfish
    program executes on both Windows and Linux platforms through some ingenuity I
    used Python Standard Library modules to accomplish this along with our code. I
    also scratched the search with argparse allowing us to not only parse the command
    line but also validate command parameters before they were used by the application.


    I also enabled the Python logger and reported events and errors to the logging
    system to provide a forensic record of our actions. I provided the user with capability
    of selecting the most popular one-way hashing algorithms and the program extracted
    key attributes of each file that was processed. I also leveraged the csv module
    to create a nicely formatted output file that can be opened and processed by standard
    applications on both Windows and Linux systems. Finally, I implemented our first
    class in Python with many more to come.'
