    data. Finally, I created an application that collects and records every TCP or
    UDP traffic isolating Source IP, Source Port, Destination IP, and Destination
    Port combinations. This Python application can be controlled through command line
    arguments in order to easily integrate with cron jobs or other scheduling mechanisms.
