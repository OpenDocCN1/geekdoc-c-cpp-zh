  md: '# CHAPTER REVIEW


    In this chapter, I explained the basics of time and computing. This includes a
    better understanding of the epoch, the origins of modern time keeping along with
    a bit of history on time. I then took a deep dive into the Standard module time
    and I explained and demonstrated many methods and properties associated with the
    module. I developed several Python scripts to give you a few for how to apply
    and interpret the results of time processing.


    I provided an overview of the NTP that provides us with the ability to synchronize
    time with National Measurements. Next, I walked through the installation and setup
    of a Python NTP library ntplib. I then experimented with the module to set up
    a NTP client that interfaces with a network-based time source. I wrote a script
    that would compare and calculate the difference between my local system clock
    and that of a NIST server.


    # SUMMARY QUESTIONS


