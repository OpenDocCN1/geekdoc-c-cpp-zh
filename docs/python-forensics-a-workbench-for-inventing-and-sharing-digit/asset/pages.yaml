    # PYTHON AND THE DAUBERT EVIDENCE STANDARD


    As many of us have encountered, the Daubert standard provides rules of evidence
    at the U.S. Federal level with about one-third of the tests that deal with the
    admissibility of expert testimony including scientific data. Digital data collected
    and analyzed with forensic software employed by an “expert” can be challenged
    by using, in layman''s terms, a Daubert motion to suppress or challenge the efficacy
    of the expert/or the evidence produced by technology utilized.


    The results are not automatic of course, just because the source is open. Rather,
    specific steps must be followed regarding design, development, and validation.


    +   1. Can the program or evidence be explained? This explanation should be explained
    in words, not only in code.

    2. Has enough information been provided such that tests can be developed to test
    the program?

    3. Have error rates been calculated and validated independently

    4. Has the program been studied and peer reviewed?

    5. Has the program been generally accepted by the community?


    The real question is how Python-developed forensic programs meet these standards?
    Chapters 3–11 include the cookbook portion of the book and each example attempts
    to address the Daubert standard by:


    +   1. Definition of the Challenge Problem

    2. Requirements Definition

    3. Test Set Development

    4. Design Alternative and Decisions

    5. Algorithm Description (English readable)

    6. Code Development and Walk-Through

    7. Test and Validation Process

    8. Error Rate Calculation

    9. Community Involvement


    This approach will provide two distinct advantages. First, the cookbook examples
    provided in the text will be usable out of the box and should meet or exceed the
    rules of evidence standards. Second, the process defined will assist experienced'
