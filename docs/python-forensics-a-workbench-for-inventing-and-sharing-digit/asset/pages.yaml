  md: '1. In order for the sweeps and scans to be effective, the targets (hosts, routers,
    switches printers, servers) need to be powered on and functional in order to interact
    with them.


    2. The environment that you are working in must be tolerant to these types of
    “noisy” scanning activity. Actually, most intrusion prevention systems (IPS) are
    precisely logging for this type of activity and will categorize them as attacks
    and respond accordingly, unless they are configured to ignore them. This is more
    difficult to accomplish than you might think, and most cyber-security folks are
    not inclined to make configuration changes to their IPS.


    3. Port scans are only effective when these ports report to the probes, as we
    use. Malicious services that we may be searching for do not necessarily play nice
    and would not respond to novice inquiries.


    4. Many of the malicious services utilize the User Datagram Protocol (UDP) when
    communicating with their handlers and operate silently when being probed by vulnerability
    assessment technologies.


    5. Finally, the operators of critical infrastructure environments are unlikely
    to allow active scanning and probing of those techniques, in many cases the probing
    activity may disrupt operations and crash systems. If this were to happen in a
    supervisory control and data acquisition environment, these disruptions or system
    crashes could shut the lights off for thousands of customers or worse.


    # PACKET SNIFFING


    Network (or packet) sniffing is another method that can be used, and when properly
    can provide insight. Network sniffing, if done well, can provide three benefits
    over port scanning:


    +   1. The sniffer is completely silent and will not place a single packet on
    the network ensuring zero impact on network operations.


    +   2. The sniffer is an observer that can run for hours, days, weeks, months,
    or even continuously collecting information that will more describe activities
    of local hosts, servers, network devices, or even rogue devices that were previously
    undetected.


    +   3. It can capture activities that are stealthy and only occur periodically
    or sporadically.


    In the permissive form, a packet sniffer (also referred to a network sniffer)
    captures all of the packets of data that pass through given network interface.
    In order to capture these packets, your network interface must be in Promiscuous
    Mode and the interface needs to be connected to a port that has visibility to
    all of the packets. For example, if you are interested in a specific subnet, you
    would connect the sniffer to a switch or hub on that subnet. Most switches today
    support port mirroring via a Switched Port Analyzer (SPAN) or Remote Switched
    Port Analyzer as shown in Figures 9.1 and 9.2. These ports are typically connected
    to IPS, network monitoring devices or performance measurement devices that can
    detect network loading.'
