  md: '# Our First Application “One-Way File Hashing"


    # WalkPath function


    The WalkPath function must start at the root of the directory tree or path and
    traverse every directory. For each valid file encountered it will call the HashFile
    function to perform the one-way hashing operations. All the files have been processed
    WalkPath will return control back to Main with the number of files successfully
    processed.


    # HashFile function


    The HashFile function will open, read, hash, and obtain metadata regarding the
    file in question. For each a row of data will be set to the CSVWriter to be included
    in the p-fish report. If the file has been processed, HashFile will return control
    back to WalkPath in order to fetch the next file.


    # CSVWriter (class)


    In order to provide an introduction to class and object usage I decided to create
    CSVWriter as a class instead of a simple function. You will see more of this in
    uncommon cookbook chapters but CSVWriter sets up nicely for a class/object demonstration.
    The csv module within the Python Standard Library requires that the “writer” be
    initialized. For example, I wanted the resulting csv file to have a header row
    made up of a static set of columns. Then subsequent calls will write data that
    fills each row. Finally, the program has processed all the files csv report must
    be closed. Note that as I walk through the code you may wonder why I did not leverage
    classes and objects more for this program. I could have but for the first application
    I would create a more function-oriented example.


    # Logger


    The built-in Standard Library logger provides us with the ability to write messages
    to a log file associated with p-fish. The program can write information messages,
    warnings, and errors. Since this is intended to be a forensic application, logging
    operations of the program is vital. You can expand the program to log additional
    events in the code, they can be added to any of the _pfish functions.


    # Writing the code


    I decided to create two files, mainly to show you how to create your Python module
    and also to give you some background on how to separate capabilities. For this
    first application I created (1) pfish.py and (2) _pfish.py. As you may recall,
    all modules that are created belong under an underscore and since _pfish.py contains
    all the support functions for pfish I named it _pfish.py. If you would like to
    split the modules for the HashFile function, the WalkPath function, etc. This
    is a decision that is based on how coupled the functions are, or better stated,
    whether you wish to reuse individual functions later that need to be standalone.
