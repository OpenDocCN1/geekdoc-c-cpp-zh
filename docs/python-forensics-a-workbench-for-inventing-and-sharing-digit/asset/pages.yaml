  md: '# READING THIS BOOK


    The book is organized with the first two chapters focused on introductory material
    and setting up the free Python development environment. Chapters 3 through 11
    focus on differing problems or challenges within digital investigation, and provide
    guided solutions using with reference implementations that focus on the core issues
    presented. I encourage you to use, expand, evolve, and improve the solutions presented.
    Chapter 12 looks back and then forward to consider the path ahead.


    # SUPPORTED PLATFORMS


    All the examples in the book are written in Python 2.7.x in order to provide the
    greatest platform compatibility. The associated web site has solutions for both
    Python 2.7.x and 3.x whenever possible. As more third party libraries complete
    support for Python 3.x, all the examples will be available for 2.7.x and 3.x.
    Most of the examples have been tested on Windows, Linux, and Mac operating systems
    and will most likely work correctly on other environments that fully support at
    least Python 2.7.x


    # DOWNLOAD SOFTWARE


    Those purchasing the book will also have access to the source code examples in
    the book (in both 2.7.x and 3.x—when possible) from the python-forensics.org web
    site.


    # COMMENTS, QUESTIONS, AND CONTRIBUTIONS


    I encourage you to contribute in a positive way to this initiative. Your questions,
    comments, and contributions to the source code library at python-forensics.org
    will make this a resource available to all.


    I challenge you all to share your ideas, knowledge, and experience.'
