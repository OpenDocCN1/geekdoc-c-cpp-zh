    one man, John Harrison, dared to imagine a mechanical solution– a clock that would
    keep precise at time, something nothing had been able to do on land. Mr. Harrison’s
    invention resulted in a solution to the greatest scientific problem of this time.”
    [Sobel, 1995]


    The basis of Harrison and clock still give guide navigation today as the use of
    time within GPS and other navigation systems remains the underlying'
