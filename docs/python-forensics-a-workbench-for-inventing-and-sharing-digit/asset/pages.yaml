- img_proc: true
  md: '# CHAPTER 5 Forensic Evidence Extraction (JPEG and TIFF)


    unstructured data that can be carved and reconstructed to reveal running processes
    and threads, recent user activity, network data, and even user typed passwords
    and cryptographic key material.


    Other complex file structures, such as the JPEG files that include EXIF data (The
    Exchangeable Image File Format), contain a plethora of potentially valuable information
    about the image itself. This can include the camera type used to take the photograph,
    the time and date the photo was taken, and literally hundreds of individual data
    elements associated with the photograph. With the advent of Facebook, Instagram,
    Twitter, Flickr, and other social media services, the sharing of digital photographs
    has been woven into the fabric of our culture. Today, over a billion people carry
    smart phones and tablets that have built-in cameras for taking high-quality photographs
    and movies that can be shared instantly across the globe using social network
    applications, text messaging, or old-fashioned e-mail.


    In addition, everyone from the Weather Channel to law enforcement investigators
    use digital photography to provide insight and understanding of physical events.
    The Federal Communications Commission (FCC) has adopted new rules that include
    mandatory improvements to the accuracy of the location information transmitted
    when phone-based911 calls are made. Specifically, E911 requires wireless service
    providers to deliver the latitude and longitude of the caller within 50-300 m
    [FCC]. These requirements have driven smart phone manufacturers to include Global
    Positioning System (GPS) in their handsets along with high-quality cameras that
    can automatically embed location and data directly into digital photographs. Consequently
    these innovations have delivered potentially valuable evidence including “what:
    the content of the photo,” “when: the photo was snapped,” and “where: the photo
    was taken.”


    Based on this, I wanted to delve deeper into the extraction of from digital photographs,
    specifically those photos taken with smartphones that include EXIF data. I will
    focus most of my attention on the EXIF data associated with JPEG and TIFF images,
    mainly because the prevalence of photographs generated today from smart phones
    support EXIF embedding.


    Many of you have already examined the contents of digital photographs and the
    EXIF information using Hex editors and other primitive tools, and as a result
    require an unprepared prescription from the optometrist after afterward. To help
    us in peeling back the onion-like layers of digital photographs, I will be adding
    a new library that will do most of the heavy lifting for us—namely the Python
    Image Library (PIL). The PIL provides a great deal of capabilities to not only
    extract information from images but also provides capabilities to manipulate them.
    I am going to focus only on the data extraction of EXIF data using the PIL, but
    once you learn how to properly use the library you can use the PIL for other image
    processing activities [Python Image Library].


    # The Python Image Library


    The first step in using the PIL is to install the library. If you are running
    Python on Windows platform, you are in luck as a simple installer is available
    as shown in Figure 5.1.'
