    # MULTIPROCESSING HASH TABLE GENER


    Rainbow Tables have been around for some time, providing a way to convert known
    values into possible password equivalents. In other words, they provide a way
    to lookup a hash value and associate that hash with a string that would generate
    that hash. Since hash algorithms are one-way, for all practical purposes two strings
    of characters will not generate the same hash value. They are highly collision-resistant.
    Rainbow Tables are utilized to crack passwords on operating systems, protected
    documents, and network user logins.


    In recent years, the process of salting hashes has made Rainbow Tables less effective
    as new tables have to be generated as salt values are modified. These tables work
    because each password is hashed using the same process. In other words, two identical
    passwords would have the exact hash value.


    Today, this is prevented by randomizing passwords, that if two users use the same
    password, the hash values would be different. This is typically accomplished by
    adding a random string called a salt prior to hashing. Password="letMein"


    Salt="*6542Jk''


    Combined Data to Hashed: "*6542JletMein"

    The salt does not need to be kept confidential as the purpose is to thwart the
    application of a rainbow or lookup table.'
