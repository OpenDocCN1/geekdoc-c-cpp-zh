  md: '# CHAPTER 6 Forensic Time


    1967 1972 2009


    ![](img/77956026d6b06352c72ae6ac437ce8ab_180_0.png)


    +   1. Early calendars based on moon phases

    2. Egyptians discover solar year

    3. Atomic clocks utilized

    4. UTC time named official time

    5. NIST and USNO official US time sources


    FIGURE 6.2


    A very brief history of time.


    As shown in Figure 6.2, the first calendars known to name were based upon the
    moon because everyone could easily agree on this as a universal measure of time.
    Moving forward, the Egyptians were the first to understand the solar year and
    were able to create a calendar based on the rotation of the earth around the sun.
    In 1967, an international agreement defined the unit of time as the second, measured
    by the decay of Cesium using precision instruments as atomic clocks. And in 1972,
    the Treaty of the Meter (also known as the Convention of the Metre, established
    in 1875) was expanded to include the current time reference known as UTC, which
    replaced GMT as the world''s official time.


    Today, more than 50 national laboratories operate over 300 atomic clocks in order
    to provide a consistent and accurate UTC. In, in order to create a trusted source
    of time, in the United States, we have two official sources of time; the National
    Institute of Standards and Technology (NIST) in Boulder, CO for commercial time
    and the United States Naval Observatory (USNO) for military time.


    Despite the broad accessibility of accurate times (computer clocks, time servers,
    etc.), the incorporation of trusted time within a system requires a secure, reliable
    date/timestamp. Unless you have direct connection to the NMIs, most trusted sources
    utilize GPS as a source of time. When used properly tune Rubidium timeless, the
    accuracy provided by GPS signals provides the exactness and precision that are
    required for most transactions and record keeping. This is true if and only if
    these requirements, standards, and processes are followed:


    > Accuracy: The time presented is from an authoritative source and is accurate
    to the precision required by the transaction, day, hour, or millisecond. Authentication:
    The source of time is authenticated to a trusted source of time, such as an NMI
    timing lab, GPS signal, or the NIST long-wave standard time signal (WWVB in the
    United States). Integrity: The time should be secure and not be subject to corruption
    during normal "handling." If it is corrupted, either inadvertently or deliberately,
    the corruption should appear to a third party.'
