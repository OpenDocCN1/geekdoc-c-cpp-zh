    # INSTALLING THE NATURAL LANGUAGE TOOLKIT AND ASSOCIATED LIBRARIES


    As with third-party libraries and modules, installation is available for Windows,
    Linux, and Mac. The Natural Language Toolkit (NLTK) is free and can be easily
    obtained online, from nltk.org. Installation of NLTK requires the installation
    of other dependency libraries using Numpy and PyYAML. Figure 7.1 depicts the nltk.org
    installation page with easy to follow instructions. Once you have installed everything,
    you can verify the installation through your favorite Python Shell by typing:


    Import NLTK


