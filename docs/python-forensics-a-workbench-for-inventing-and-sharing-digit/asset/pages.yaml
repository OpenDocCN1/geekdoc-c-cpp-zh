    Next, I''m going to import the PlaintextCorpusReader from the NLTK module. This
    method will allow me to read in and ultimately create a text corpus I can work
    with.


    ```

    from nltk.corpus import PlaintextCorpusReader

    ```


    The first thing I need to specify is the location of the files that will be included
    in the corpus. I have placed those files in c:\simpson\ Each of the 9 files are
    stored there and each is a text document.


    ```

    rootOfCorpus = "c:\simpson\"

    ```


    Now I''m going to use the PlaintextCorpusReader to collect all the files in the
    directory I specified in the variable rootOfCorpus. I will specify the files by
    the second parameter ''*''. If you have directories that contain multiple file
    types and you only wanted to include the text documents you could have specified
    ''.txt''. The result of this will be an NLTK Object named newCorpus.


    ```

    newCorpus = PlaintextCorpusReader(rootOfCorpus, ''*'')

    ```


