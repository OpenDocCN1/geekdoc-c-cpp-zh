    # Standard Library summary


    This has been just a quick introduction and tour of only a few of the Standard
    Library

    cabilities built directly into Python. There are many good references and complete

    books dedicated to this subject for those that want to deliver further. However,
    there

    are also online resources available directly at Python.org, where you can find
    a plethora of tutorials, code examples, and support for every Standard Library
    data type,

    module, attribute, and method. My goal was just to give you a taste of what

    you can do and how easy it is to use the Standard Library.


    In the next section, I will introduce you to some of the third-party libraries
    that we

    ill be using and what they bring to the party.


    # THIRD-PARTY PACKAGES AND MODULES


    As I mentioned earlier, many third-party packages and modules are available and
    I

    will introduce each through the cookbook Chapters 3–11. However, I wanted to mention
    a couple to give you idea why third-party modules are available and the

    kind of capabilities they bring to digital investigation.


    # The natural language toolkit [NLTK]


    When performing investigations, e-discovery, or incident response, it is important

    to determine what we can communicate via email, text message, written documents,

    and other correspondence. We utilize crude tools and technologies today like simple

    keyword and phrase searching and `grep` to discover and parse these communications.


    Grep, which is short for global regular expression print, allows users to search
    for the

    ocurrence of a defined regular expression. Regular expressions are composed of
    meta characters\and usually a sequence of text characters that represent a given
    pattern, which will allow

    the computer program to perform advanced or simple pattern matching.'
