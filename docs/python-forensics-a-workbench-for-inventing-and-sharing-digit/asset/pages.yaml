  md: '# CHAPTER REVIEW


    In this chapter, I began the process of addressing multi-core processing using
    Python by leveraging the cores already available on your laptop or desktop system.
    I introduced a couple of different approaches to multiprocessing and provide an
    overview of the Python Standard Library multiprocessing. I also examined two digital
    investigation maintain functions that can benefit from multiprocessing: (1) File
    Hashing and (2) Rainbow Table generation.


    In Chapter 11, I will demonstrate how you can take this approach into the cloud
    and leverage cloud services that could offer 10, 50, 100, or even 100 cores to
    expand the horizon of multiprocessing from the desktop to the cloud.


    # SUMMARY QUESTION/CHALLENGE


    +   1. What other digital investigation or forensic applications do you believe
    could benefit from multiprocessing?

    2. What are some of the key elements when designing multiprocessing solutions?

    3. What is the best defense today against Rainbow Table-based password attacks?

    4. The Rainbow Table example is limited by resources and will fail when the program
    runs out of memory. How would you modify the program such that it could continue
    to generate password/hash combinations in the face of memory limitations?


    # Additional Resources


    http://www.net-security.org/article.php?id=1932&p=1.

    http://docs.python.org/2/library/itertools.html#module-itertools.

    http://docs.python.org/3.4/library/multiprocessing.html#module-multiprocessing.'
