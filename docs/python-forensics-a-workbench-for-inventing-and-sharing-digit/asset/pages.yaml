    Mr. Harrison''s lifetime work was the impetus for the formation of Greenwich Mean
    Time or GMT. In today''s high-speed global economy and communication infrastructure,
    precise, accurate, reliable, nonforgable, and nonputable time is almost as elusive
    as it was in the eighteenth century. Of course, rubidium, and cesium clocks are
    guaranteed to deliver accurate time—and without missing a beat—for over 1000 years.
    But, delivering that accuracy to digital evidence is elusive. “anyone can tell
    you what time it is, proving what it was still the challenge” [Hosmer 2002].nTime
    is a concept that allows society to function in an orderly fashion where all parties
    are able to easily understand the representation of time and agree on sequence
    of events. Since 1972, the international standard for time is Co Universal Time
    or UTC. UTC forms the basis for the official time source in nations around the
    globe; it is governed by a diplomatic treaty adopted by the world community that
    designates National Measurement (or Metrology) Institutes (NMIs) as UTC time sources.
    The National Institute of Standards and Technology (NIST) in the United States,
    the Communications Research Laboratory (CRL) in Japan, and the National Physical
    Laboratory (NPL) in the United Kingdom are examples of NMIs. There are about 50
    similar metrology centers that are responsible for official time throughout the
    world.

    Time has been a critical element in business for hundreds of years. Time—when
    a mechanical record—established and provided evidence as to the “when” of'
