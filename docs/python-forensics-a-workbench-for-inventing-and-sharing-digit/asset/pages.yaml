  md: "# NTP Client Setup Script 179\n\n# NTP CLIENT SETUP SCRIPT\n\nTo setup a Python\
    \ ntp client using the ntplib is a simple process:\n\n```\nimport ntplib     \
    \ # import the ntplib\nimport time        # import the Python time module\n\n\
    # url of the closest NIST certified NTP server\nNIST='nist1-macon.macon.ga.us'\n\
    \n# Create NTP client object using the ntplib\ntp=ntplib.NTPClient())\n\n# initiate\
    \ an NTP client request for time\ntpResponse=ntp.request(NIST)\n```\n\n```\n#\
    \ Check that we received a response\nif ntpResponse:\n    # obtain the seconds\
    \ since the epoch from the response\n    nistUTC=ntpResponse.tx_time\n    print\
