    # Main function


    The purpose of the Main function is to control the overall flow of this program.
    For example, within Main, I setup the Python logger, I display startup and completion
    messages, and keep track of them. In addition, Main invokes the command line parser
    and then launches the SearchWords function. Once SearchWords completes, Main will
    log the completion and display termination messages to the log.


    # ParseCommandLine


    In order to provide smooth operation of p-search, I leverage the ParseCommandLine
    to not only parse but also validate the user input. Once completed, information
    that is needed by the core search method will be available via the parser.


    # SearchWords function


    SearchWords is the core of the p-search program. The objective is to make this
    function as quick and accurate as possible. In this example, we are only searching
    for ASCII text strings or words. This provides a huge advantage and we can set
    the search up in a way that is quick and effective. The algorithm performs the
    search in two passes over the Target ByteArray. The first pass converts any byte
    that is not an alpha character to a zero. The second pass collects sequences of
    alpha characters. If the consecutive alpha character sequence is greater than
    or equal to'
