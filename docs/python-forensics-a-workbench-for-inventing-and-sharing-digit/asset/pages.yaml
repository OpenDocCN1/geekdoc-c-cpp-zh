    # NLTKQuery APPLICATION


    In order to make the interface with NLTK both easier and extensible, I have built
    the NLTKQuery application. The application has three source files:


    | Source File | Description |

    | --- | --- |

    | NLTKQuery.py _classNLTKQuery.py | Serves as the main program loop for interfacing
    with NLTK This module defines a new class that when instantiated and used properly
    will allow access to NLTK methods in a controlled manner |

    | _NLTKQuery.py | This module provides support functions for the NLTKQuery program
    loop, mainly to handle user input and menu display |


    The program provides a simplified user interface access to NLTK methods without
    forcing the user to understand how the NLTK library works. All the user needs
    to do setup a directory that contains the file or files they wish to include in
    a corpus. The application will create the corpus based on the directory path provided
    and then allow the user to interact, or better stated, query the corpus.'
