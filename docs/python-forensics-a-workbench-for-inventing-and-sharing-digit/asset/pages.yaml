- img_proc: true
  md: '# CHAPTER 1 Why Python Forensics?


    reference implementations, a cookbook of sorts, and at the end of the day, will
    fully get you involved in developing your own Python forensic applications.


    I will be presenting the material without any preconceived notion about your programming
    expertise (or lack thereof). I only expect that you have an interest in using
    the examples in the book, expanding on them, or developing derivatives that will
    fit your situation and challenge problems. On the other hand, this is not how
    to prove programming book, many of those exist for Python along with a plethora
    of online resources.


    So, let us started by defining some of the challenges we face in cybercrime and
    digital investigation. These challenges after all were the catalyst behind the
    book and have come from the past two decades of working to assist law enforcement;
    defense and corporate entities collect and analyze digital evidence.


    # CYBERSIME INVESTIGATION CHALLENGES


    Some of the challenge problems that we face in cyber investigation include the
    nature of investigations: Much of the work over the past decades have focused
    on the postmortem acquisition, search, format, and display of information contained
    on various types of media. I clearly remember the phone call I received almost
    two decades ago from Ron Stevens and Tom Horbank at the New York State Police.
    They were investigating a case that involved a Linux computer and we were concerned
    about files and other data that might have been deleted that could be impeding
    the investigation. At no point technology existed to extract deleted files or
    fragments that were buried inside Linux nodes, although several solutions existed
    for the Windows platform at the time. We worked together to develop algorithms
    that eventually became a tool "extractor" that we provided free to law enforcement.


    The move from simply extracting data, recovering deleted files, and scouring unallocated
    or slack space has rapidly shifted in just the couple of years. Today we focus
    most of attention on smart mobile devices, dynamically changing memory, cloud
    applications, real-time network forensics, automotive data analysis, and weather-based
    forensics, just to mention a few. In addition, new work is addressing the association
    of direct digital forensics evidence with a broad range of highly available electronic
    information. Whether this information comes from text messages, Facebook posts,
    tweets, Linkedin associations, metadata embedded in digital photographs or Movies,
    GPS data that tracks our movements or the digital fingerprints from every web
    site we surf, all may be relevant and used in criminal cases. The question is
    how we connect these dots while maintaining forensic authenticity?


    The widening gap between technology developers and investigators: Investigators,
