    \ read, and write files but they also include very unique built-in capabilities;\
    \ for example, common path name manipulations. Operating systems and platforms\
    \ handle directory paths differently (i.e., Windows uses c:\\users... notation\
    \ while Unix utilize /etc/... notation), and some operating environments support\
    \ ASCII file and directory naming conventions, which others support full Unicode\
    \ naming conventions. All file and directory access functions need to support\
    \ these differences uniformly across cross-platform operations would not be possible.\
    \ In addition, built into the Python Standard Library are compare functions, automatic\
    \ creation of temporary directories and high-level file input handling makes dealing\
    \ with file systems easier for both novice and pros.\n\n# Data compression and\
    \ archiving\n\nInstead of having to use third-party libraries to perform standard\
    \ compression and archiving functions like zip and tar, these functions are built-in.\
    \ This includes not only compressing and decompressing archives but also includes\
    \ extracting content information for zip files. During investigation, we often\
    \ encounter encrypted zip files, and Python handles these as well (provided you\
    \ have the password or you can of course dictionary or brute force attack methods)."
