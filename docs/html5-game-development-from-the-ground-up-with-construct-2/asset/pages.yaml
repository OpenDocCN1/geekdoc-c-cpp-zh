  md: '# # Game Design Documentation for Indies


    > > “TO DOCUMENT or not to document? That is the question: whether ''tis nobler
    in the mind to suffer the slings and arrows of outrageous and sudden ideas, or
    to take arms against a sea of troubles and begin writing everything down?”


    If Hamlet were an indie game designer, he might have thought something like that.
    Indeed, most indie developers ask themselves something similar when beginning
    a new project: why make the effort of documenting our ideas and trying to crystallize
    them before the actual work starts? Is it really useful? Or should we just go
    long after day, iteration after iteration, and where are our inspiration leads
    us? And, if we decide to document, which format is most suitable for a given project?
    Will anyone really read it?


    In this short chapter we''ll try to answer these questions and see how to approach
    design documentation effectively from an indie perspective.


    In professional settings, game design documents still take the shape of the infamous
    “Game Design Bibles,” tomes spanning 100+ pages outlining every possible detail
    in the game. Every studio has its own specific formats, but in general, most tend
    to include sections covering the following topics:'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 42 HTML Game Development from the Ground Up


    +   1. Introduction/general information: A high-level description of the acquisition,
    just one paragraph to capture the attention of the reader.


    +   2. Detailed game description: The nuts and bolts of the game, in as much detail
    as possible, usually including several subsections:


    +   (a) Core gameplay and its elements (e.g., race to an end, territorial control,
    etc., and how they are implemented)


    +   (b) Game flow (e.g., whether the game is structured in chapters, levels, etc.)


    +   (c) Characters/units (including detailed descriptions in terms of classes,
    abilities, and eventual statistics)


    +   (d) Game physics


    +   (e) Artificial intelligence (purposes and approaches used)


    +   (f) Multiplayer (how it works and which specific game modes it is used for)


    +   (g) Walkthrough (a step-by-step guide for the whole game or at least for the
    first few levels)


    +   3. Level requirements and progression: How the game progress structured, including
    the following:


    +   (a) Level diagrams and maps


    +   (b) Flow diagrams (usually accompanying the maps, describing what is going
    to happen in each area of the levels)


    +   (c) Description of puzzles (if any)


    +   (d) Assets (which are used in each level and how/when they are presented to
    players)


    +   4. Story: If story plays an important role in the game, it should have its
    own dedicated section.


    +   (a) Backstory and world description (for example, describe the lore of the
    fantasy world the game takes place in)'
