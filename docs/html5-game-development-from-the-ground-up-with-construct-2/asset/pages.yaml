    Note that we need to add a specific variable only for each tile type (e.g., t_X,
    t_H, etc.) since tiles sharing the same name (in other words, all instances of
    the same object) will automatically acquire the same variables, which we can instantiate
    accordingly and independently (see Figure 10.5).


    Once, we can go back to the event sheet and add more subevents to On start of
    layout to place all tiles according to our previously shuffled array: the number
    in the array will identify the position in the grid. Referring to Figure 10.2,
    the top left tile will have position 0, the next one on the right will have 1,
    the top left on the second row will have 5, and so on until the last one at the
    bottom right having a position of 19.


