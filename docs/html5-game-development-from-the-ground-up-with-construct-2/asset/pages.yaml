  md: '# HTML5 and Construct 2


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_27_0.png)


    Figure 1.4 Select the player''s sprite by clicking on it, and its properties will
    be displayed on the column on the left.


    You may also have noticed that on top of the main layout view there a few tabs:
    Start page (which brings us back to Figure 1.2), Game (the name of our current
    layout), and Game events (the programming sheet currently associated with the
    game layout).


    Clicking on the latter changes the display to the Game events sheet (Figure 1.6).


    All actual programming takes place in this tab, and Construct handles this phase
    of game development in a very visual and intuitive way through events. Events
    are created by selecting possible conditions and actions specific to the objects
    defined in the associated game layout. Through these, we can define what happens
    to them or what they do when specific conditions or triggers happen in the game.


    While visual in nature, the logic behind this approach is the very same as in
    any programming language, and it will definitely help any beginner'
  merge: -1
