  md: '# # HTML5 GAME DEVELOPMENT from the Ground Up with CONSTRUCT 2


    Roberto Dillon


    HTML5 Game Development from the Ground Up with Construct 2 shows you how to use
    the sophisticated yet user-friendly HTML5-based game engine Construct 2 to develop
    and release polished, two-dimensional games on a multitude of different platforms.
    The book also covers the foundational knowledge of game analysis and design based
    on the author''s research and teaching experiences at DigiPen Institute of Technology,
    James Cook University, and other institutions.


    The author first helps you understand what really matters in games. He guides
    you in becoming a better game developer from the ground up, being able to play
    any critically, and expressing your ideas in a clear and concise format. The book
    then presents step-by-step tutorials on designing games. It explains how to build
    an arcade-style game, a platformer integrating physics elements, and a more complex
    puzzle game. The book also discusses different ways to deploy and monetize games
    across several platforms, including Facebook, iOS, Android, and web-based marketplaces.


    # ### Features


    +   - Covers game design concepts in a manner suitable for beginners, hobbyists,
    and aspiring indie developers


    +   - Requires no specific programming knowledge, assuming familiarity with only
    very basic concepts (such as arrays and functions)


    +   - Provides practical tutorials using stable, proven features of Construct
    2


    +   - Offers sample Construct 2 project files for the games designed in the book
    on the author''s website


    Integrating hands-on guidance with theoretical game design concepts, this book
    gives you a solid foundation in game development. It will help you advance in
    your journey as an indie game developer.'
  merge: -1
  pgno: 259
