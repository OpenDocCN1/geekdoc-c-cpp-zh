    # 12.5 WINDOWS, OSX, AND LINUX


    Old-fashioned games to be downloaded and run as executable files still have a
    significant market share that shouldn''t be ignored. Our HTML5 games can target
    this market as well by using the Node-WebKit exporter.


    Basically, Node-WebKit is a standalone version of Google Chrome without all those
    browser identifying elements (like address bar, navigation buttons, etc.) so that
    it looks like any other standard application.


    Exporting this process will allow us to run our games as executable files, where
    in fact, what we do is actually launching a dedicated browser app embedding the
    game.


    After the exporting process is completed, we will find folders for Windows, OSX,
    and Linux (both 32 and 64 bits) containing all the relevant files.


    Note that Construct includes a Node-WebKit object that can be included in a game
    to allow for proper file access.


    Regarding monetization for downloadable PC/Mac games, the old-fashioned business
    model of asking players to pay upfront or offering a trial period before requesting
    the actual payment is still a very viable approach. While this model does not
    seem to work anymore on mobile


