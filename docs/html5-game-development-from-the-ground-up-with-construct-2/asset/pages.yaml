  md: '# Deployment and Monetization ■ 229


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_249_0.png)


    FIGURE 12.33 To export for iOS or Android we need to use a third-party tool: CocoonJS
    by Ludei.


    While HTML5 games can be played on these devices and even installed on the home
    screen via the devices’ own browsers, performance can be a real issue. Beside,
    a game distributed in this way would completely lack all the promotion and discoverability
    features of the official marketplaces reserved to native apps. Luckily, a few
    options to wrap HTML5 games and turn them into apps that look, feel, and perform
    exactly like native apps. CocoonJS by Ludei is one of these tools, able to transform
    a Construct 2 game into a native app to be published on the Apple App Store or
    Google Play.


    Before proceeding further, though, you need to register with them first: developing
    for Apple App Store requires a $99 per year fee, and apps have to be built and
    signed via Xcode on a Mac computer; while Google Play requires a one-time $25
    registration fee.


    CocoonJS works by taking an HTML5 game and compiling it via its cloud-based services
    to provide a native project file that can be used to export in the publication
    process.


    In Construct, while not strictly necessary to export the game, we may want to
    start by adding the CocoonJS object to our project (Figure 12.33).


    > * https://developer.apple.com/programs/ios/


    > * http://developer.android.com/index.html'
  merge: -1
