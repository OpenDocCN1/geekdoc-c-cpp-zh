    both playing characters and nonplaying characters)


    (c) Game text, dialog requirements (how we are going to tell the story to players)


    i. Sample scripts


    +   5. Graphical user interface (GUI): All the information and options that are
    displayed to the player across the game, from the first menu onward.

    (a) Flowchart (how the different screens are linked, e.g., menus, options, etc.)

    (b) Functional requirements (what kind of information do we need to display?)

    (c) Buttons, icons, pointers, bars, text (e.g., how and where score health/mana
