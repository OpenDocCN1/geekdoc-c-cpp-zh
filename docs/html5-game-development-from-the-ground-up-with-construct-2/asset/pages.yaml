  md: '# TAKE AWAY


    Puzzle games are an important genre in the gaming landscape, offering game designers
    opportunities to craft apparently simple systems that can nonetheless deliver
    a very engaging and addictive gameplay.


    In our specific case, it is instructive to realize how, despite the fact that
    Loco-Motion, the game we drew inspiration from, and Turky on the Run are essentially
    sharing the same basic actions and gameplay, the use of a different theme and
    settings can help to actually engage players through a different emotional experience:
    collecting is the main driving force behind the model game, while Turky relies
    mostly on the protection instinct instead, leaving the former somewhat in the
    background.'
