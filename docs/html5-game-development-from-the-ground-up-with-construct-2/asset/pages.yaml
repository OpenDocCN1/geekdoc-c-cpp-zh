  md: '# 28 ■ HTML Game Development from the Ground Up


    Going back to Frogger, we can do so, now proceed to ask ourselves something like
    the next stage and analyze the gameplay. To do so, we should ask “What are the
    game rules allowing us to do?” Or, more simply, “What are we actually doing in
    the game? What are we using the actions for?” These are the questions we need
    to answer.


    In case of Frogger, we are trying to avoid the speeding cars and then jumping
    on the floating logs to reach a safe haven at the top of the screen. In game design
    terms, we can say the gameplay is about “avoidance” of different hazards together
    with a “race to an end” component. By describing the gameplay in these terms we
    also explained the goal of the game, and we are ready to analyze the emotional
    experience. We now have to ask ourselves “How do I feel while playing the game?”


    This is the most subjective part of the analysis and can obviously be quite tricky,
    but we can rely on the 6-11 Framework to get us in the process.


    Most likely, we would point out that, while playing the game, we were excited
    by the fast action of moving across the highway and river and then happy for successfully
    reaching the end. Notice that we have already identified the two main emotions
    that Frogger feels and enjoyable, but why were we proud? Because we felt pride
    for our achievement.


    Right! Pride plays an important role here and, in fact, it resolves joy and happiness.
    We have another emotion to describe our experience. Now, what is the achievement
    we are proud of? Surviving the perils we had to face while crossing the road and
    river! So, survival is the main instinct at here, and it actually drives us toward
    the goal of the game. We may also realize that, by looking at the cars approaching
    us from all directions, we may have felt a bit scared, and we may have unconsciously
    taken the role of the frog, i.e., we identified with it.


    The whole analysis can then be summarized into a simple diagram the one shown
    in Figure 2.24.


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_48_0.png)


    FIGURE 2.24 AGE analysis for Frogger.'
