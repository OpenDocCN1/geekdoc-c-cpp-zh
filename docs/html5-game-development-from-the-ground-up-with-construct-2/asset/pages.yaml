    But there is an instructive problem here. Assuming the keyboard event is placed
    after the one touch button, and if we play the game we will soon realize that,
    while the space bar works as planned, clicking on the red button has no effect
    on the speed! Why? Because the else condition after the keyboard event is going
    to be checked *after* the touch control changed the speed value, and it will be
    executed since the space bar is not pressed, setting the speed back to 200 regardless
    of what the touch button did previously!


    This means we need to reorganize our code in a more efficient way. We can actually
    delete the action resetting the player speed in the else part of the touching
    event, as well as the else part of the keyboard event. What we should instead
    is a common event that gets triggered when neither the button nor the space bar
    is pressed and only resets the speed to the original value of 200.


    Add a new event and start by copying and pasting our two conditions, Touch/Is
    touching speedup_btn and Keyboard/Space is down. Now click on each to select them
    individually, right click, and choose Invert from the menu. This will add a red
    cross next to each condition and make the event run only when both are false,
    space bar is not pressed and button is not touched.


    > * Note that we can temporarily disable an action or event, instead of deleting
    it, by right clicking on it and selecting toggle disabled in the menu. This is
