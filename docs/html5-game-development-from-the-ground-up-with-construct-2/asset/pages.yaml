  md: '# About the Author


    Roberto Dillon was born in Genoa, Italy, and holds a Master’s and a Ph.D. degree
    in Electrical and Computer Engineering from the University of Genoa.


    Over the years he has worked in prestigious academic institutions across Europe
    and Asia, including the Kungliga Tekniska Högskolan (Royal Institute of Technology,
    KTH) in Stockholm, Nanyang University of Technology (NTU) in Singapore, and the
    DigiPen Institute both in Singapore.


    While at DigiPen, he served as an Assistant Professor and Game Design Department
    Chair, teaching a variety of subjects like Game Mechanics and Game History, with
    his students gaining top honors on competitions like the Independent Games Festival
    (IGF) in San Francisco and Shanghai.


    He is now an Associate Professor at the Singapore campus of James Cook University,
    where he teaches game design and project management subjects to both undergraduate
    and graduate students.


    As a game developer, Roberto has led high-profile research projects on innovative
    games that were show-cased by the international press and at events like Sense
    of Wonder Night in Tokyo, Electronic Language International Festival (FILE) Games
    in Rio Janeiro, and the Indie Showcase at Casual Asia.


    Besides HTML5 Game Development from the Ground Up with Construct 2, Roberto wrote
    two other books: On the Way to Fun and The Golden Age of Video Games, published
    by A K Peters and CRC Press.'
  merge: -1
