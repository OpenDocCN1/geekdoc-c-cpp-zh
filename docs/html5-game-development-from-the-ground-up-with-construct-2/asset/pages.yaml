    # 11.4 SOURCE CONTROL


    One aspect of game development often overlooked by inexperienced developers is
    that of source control. Source control allow a team to organize all files efficiently
    and keep track of all different versions of each in an orderly manner. Source
    control makes it possible, even, to merge changes done by different developers
    on the same files, check differences across versions, and eventually, roll back
    to previous releases to recover from some breaking bugs.


    One of the most popular source control tools is Apache Subversion (abbreviated
    SVN). This, like all similar software, works by storing a copy (repository) of
    the project on a server machine, which can also be one of the developers'' computers,
    and then allows individual developers to commit (i.e., upload) their files to
    the repository. Each developer works with a client installed on his own machine
    to manage a local copy of the repository to download and to modify and commit
    again to the server any file they work on. That way everyone on the team will
    see the different versions and the changes that have been made, so that everyone
    one can keep working on the latest files.'
  merge: -1
