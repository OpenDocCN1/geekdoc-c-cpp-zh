    # TAKE AWAY


    In this chapter we expanded our knowledge of Construct 2 quite significantly:
    we saw how to use the Web component to save values locally and retrieve them in
    another game session, we learned how to use arrays, add functions, use physics
    in our games, and, last but not least, make custom buttons using the 9-patch object,
    helping us to deliver a more flexible GUI that can self-adapt to many different
    devices and screen resolutions.


