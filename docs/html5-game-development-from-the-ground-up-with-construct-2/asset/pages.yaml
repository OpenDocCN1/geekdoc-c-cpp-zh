    The next step consists in adding the Touch object to the game so that we can finally
    start programming the tile-moving process. For this, we are going to introduce
    a new concept: groups. A group acts like a self-contained subsection of events
    and not only helps in keeping our event structure clean and easily readable can
    also be explicitly activated (i.e., called) and deactivated, making it a very
    useful tool somewhat like functions, but without the possibility of passing parameters.
    Indeed, in the earlier versions of Construct 2, where functions were not available
    yet, groups were the only option to organize a set of events and trigger them
    from another when needed.


    To add a group, right click on the event sheet and select the appropriate command.
    Name this group "Move Tiles" and add its first event: On touched the Touch object.
    We can start with the t_X tile, for example. Remember we are allowed to move the
    tile only if Turkey is not on it or moving into it. To check for this, add the
    necessary conditions to compare the tile''s own grid_pos variable with Turkey''s
    grid_pos and target variables via the Compare instance event to see whether they
    are different. If Turkey is not around, we can proceed to move the tile into the
    empty space and swap it with the t_empty collision tile. In doing this, we need
    to identify whether the empty space is below, in front of, or behind the tile
    and act accordingly.


