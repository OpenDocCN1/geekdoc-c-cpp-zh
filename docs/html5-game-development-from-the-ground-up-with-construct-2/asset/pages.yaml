  md: '# CHAPTER 1


    # # HTML5 and Construct 2


    EVEN THOUGH HTML5 is a relative newcomer to the world of game development, it
    already managed to capture lots of interest among big companies and young startups
    alike, thanks to the promise of delivering a straightforward experience common
    to all web-based devices. In other words, HTML5 aims at building a new Internet
    where installing plugins would be redundant and relatively advanced multimedia
    features would be natively supported by the browser itself.


    For example, thanks to the <canvas> tag, it is actually possible to define an
    area where we can start drawing and manipulating images right into the webpage
    on the fly through JavaScript. A simple script like the following would set up
    a canvas covering a 200 × 100 pixel area, frame it with a 1 pixel wide black border,
    and then fill its upper half with a red rectangle.


    ```

    <body><canvas id="MyCanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>

    <script>

    var c = document.getElementById("MyCanvas");

    var ctx = c.getContext("2d"); //getContext("2d") is an HTML5 object with many
    predefined properties and methods for drawing rectangles, circles, images, text,
    etc.

    ctx.fillStyle = "#FF0000"; //we will fill our rectangle in red

    ctx.fillRect(0,0,200,50);//drawing a filled rectangle. 0,0 is the top right corner
    of the canvas

    </script>

    </body></html>

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 2 HTML Game Development from the Ground Up


    Despite these ambitious and exciting promises, though, after an initial announcement
    in 2008 by the W3C; actual development started only in 2011, and support by the
    different browsers is not as fast as many developers hoped. Indeed, performance
    across devices and browsers is not really consistent yet, and several features
    are supported only by browsers on specific platforms. Luckily, the situation is
    improving steadily on a daily basis (see Figure 1.1).


    Today we can finally say that HTML5 is getting advanced enough to offer the kind
    of capabilities needed by the game industry, thanks also to an effective integration
    of the JavaScript-based Web graphics library (WebGL) application programming interface
    (API) to provide two- and three-dimensional graphics and effects.


    As HTML5 matures, the reasons it could be a major revolution for online games
    can be shared simply as links and can run instantly without the need for any installation.
    Players don''t need to download specific plugins, while developers don''t have
    to wait for approval by the different app stores. In addition, when there is a
    new version, users won''t need to explicitly update the latest version. Offline
    support is also possible, making HTML5 extremely flexible, and potentially very
    successful, approach to casual game development.


    All that glitters is not gold, and actual game performance in browsers is often
    lacking, making complex HTML5 games in practice much less feasible and appealing
    than native games on most devices.

    It wouldn''t be great, if we could have the flexibility of HTML5, the capability
    of converting games to native apps when needed, and a very user-friendly environment,
    suitable even for nontechnical people? This is where Construct 2 by Scir comes
    into the picture. Writing games in HTML5 involves dealing with HTML, CSS, and
    JavaScript, but all can be circumvented by using Scir''s tool, which adopts a
    very visual approach to game development. In addition, third-party tools are available
    to wrap the final HTML5 game that Construct builds to turn it into an iOS or Android
    game with performance close to that of a native app, for example. This is what
    we are going to explore in the rest of this book, so let''s get acquainted with
    our tool choice.


    > * The World Wide Web Consortium (W3C) is the main international standards organization
    for the World Wide Web.'
  merge: -1
  pgno: 22
