    Let''s by implementing the splash screen then. We are going to keep things extremely
    simple (but you can of course let your imagination and artistic creativity run),
    so all will have a big text with the game title, and possibly Kitty and Katty
    sprites. Once we set this up, we need to implement the most crucial component
    of the framework: its navigation system.


    We already used buttons in Moon Wolf, and, indeed, using buttons to navigate to
    layout is the easiest route. However, we won''t do that here. The reason is that
    the Button object is specific to the Web and might not work on other platforms
    later if we decide to port and wrap our HTML5 game using other tools. Even if
    we are planning this game to be a PC/web title, it is always a good practice to
    keep as many opportunities open as possible.


    For this reason, we are going to make our own buttons using sprites, there is
    also another aspect we should consider before choosing our approach: web games
    can be played in countless different resolutions, and sprites may not always scale
    that well. To work around this problem, Construct 2 offers the 9-patch object.
    A image is subdivided in nine different areas, eight small encompassing the edges
    and one big central one (Figure 8.5), so when we need to stretch the image to
    fit a different resolution, we can have finer control on each area and decide
    whether to "stretch" or "tile" them ("tile" means repeating the same section over
    and over)


