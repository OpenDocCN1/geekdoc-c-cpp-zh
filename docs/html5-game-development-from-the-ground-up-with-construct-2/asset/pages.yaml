  md: '# HTML5 and Construct 2 5


    Construct 2 comes with three different licenses. First, a free license with no
    time limit is available. This is the first thing you should get if you haven''t
    done so already. Go to www.scirra.com, click on “download,” get the latest stable
    release, and install it.


    The free version has some important limitations you should be aware of, though.
    Your projects are limited to 100 events, and the ability to export to platforms
    such as iOS and Android is disabled, as well as other features. In order to enable
    these features, you over 100 events, and with the option of releasing projects
    commercially, you will need the “Personal Edition” license. This license is the
    perfect choice for indie and aspiring developers. If the revenue from Construct
    creations exceeds $5000 or you are buying licenses for a company, then you will
    need the “Business Edition” license.


    Let''s have a first look at our game engine. Once launched, it greets you with
    the screen shown in Figure 1.2.


    Open one of the examples, like Space Blaster, and you will see a screen like Figure
    1.3 in front of you.


    The working area is divided into three main sections. Note that all tabs and windows
    can be dragged and moved around to a configuration that suits your working style,
    though the book we will be using the standard layout configuration for simplicity''s
    sake. The first thing that will capture our attention is the main window at the
    center of the screen. This is where we define a layout for our game (i.e, a level
    or playing area, a splash screen, etc.), and where we place and manipulate the
    different objects that make up our game.


    The column on left instead is where we can check for specific properties of any
    object in the game as well as for the project itself. Try clicking any sprite,
    for example, on one of the spaceships displayed on the left side of the layout,
    to select it (Figure 1.4); its properties will be displayed on the left side panel
    to be analyzed and evaluated modified.


    The section on the right instead shows the project files and structure, with an
    additional tab named Layers that will discuss later (see Section 6.1 and Figure
    6.5). There is also a list of all the objects available in the current layout
    (Figure 1.5).


    > * With the exception of the last, more complex, game, all examples in this book
    will be encapsulated within 100 events to allow you to experiment with the free
    version as much as possible. When specific features requiring the “Personal Edition”
    license are used, these will be pointed out clearly in the text.'
  merge: -1
  pgno: 25
- img_proc: true
