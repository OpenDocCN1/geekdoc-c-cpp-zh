  md: '# Deployment and Monetization ■ 227


    **Product.** You will be taken to a series of forms to fill out with all relevant
    data before being able to add a release and ultimately upload your game for approval.


    # 12.7 TIZEN


    Tizen is a new OS developed by Intel and Samsung with the very ambitious aim of
    taking away a significant market share from Android. HTML5 is built in the system
    from the start: Tizen''s browser, in fact, has been designed to support most of
    HTML5 advanced features, including also the WebAudio API as as WebGL. In addition,
    HTML5-based games can be included in the marketplace side by side with native
    apps.


    We can start Tizen development process by registering and downloading the SDK
    at https://developer.tizen.org.


    Once the SDK is installed, we can try our games on the Tizen simulator following
    a few simple steps.


    +   1. Export the game in Construct by using the **Tizen** option.

    2. Launch the Tizen integrated development environment (IDE) and create a New
    Tizen Web Project selecting the **Basic Application** template (Figure 12.3).

    3. If this is your first time running the IDE, you should also add an **Active
    Secure Profile** that will be used later to sign your games. You can do so via
    the Window/Preferences/Tizen SDK/Security Profiles.

    4. Copy all contents (files and folders) exported by Construct into your Tizen
    project folder, overwriting existing files in the process. Pay attention to the
    config.xml file, though. There may be differences between the fields and values
    that the latest version of the Tizen SDK expects and those actually generated
    by Construct 2; my recommendation is to open the one in a text editor and merge
    them manually. In any case, the one generated by Tizen has a line specifying a
    unique Application ID and package name, which we are going to lose if we copy
    over Construct 2 files blindly. If so, we will have to generate a new one by opening
    config.xml in the IDE, selecting the **Tizen** tab, and then clicking on the **Generate**
    button.

    5. Click on Run to build and test your game in the web simulator!'
