  md: '# HTML5 Game Development from the Ground Up


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_34_0.png)


    FIGURE 2.1 Jumping is a typical action characteristic of most platform games:
    here, Super Bros Bros. Wii. (© 2009 Nintendo.)


    mechanics, dynamics, and aesthetics. Their groundbreaking work also served as
    an inspiration for different methodologies, including one that has been successfully
    used both by myself in my work and by my students, the AGE framework (standing
    for actions, gameplay, and experience), which I will present in this chapter.


    As with the MDA, the main idea behind the AGE model is to offer a reliable approach
    to understanding how games work by breaking them down into different levels of
    abstraction and then analyze how they relate and integrate with each other.


    In the case of the AGE framework, the levels we focus on are as follows:


    +   **Actions:** The core, atomic actions that a player can perform in a game,
    which can usually be described in terms of verbs: for example, moving, jumping,
    kicking a ball, punching, shooting, taking cover, shifting tiles, etc. (See Figure
    2.1).


    +   **Gameplay:** The result that players achieve by using and combining the available
    actions, which can be described either in terms of verbs or higher-level concepts:
    for example, fighting, race to an end, territorial acquisition, etc. (See Figure
    2.2).


    +   **Experience:** The emotional experience that engages players during the game.


    > The interested reader can check their original paper, "MDA: A Formal Approach
    to Game Design and Game Research," available online at http://www.cs.northwestern.edu/~hunicke/MDA.pdf.'
