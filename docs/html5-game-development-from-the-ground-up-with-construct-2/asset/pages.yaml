  md: '# 214 ■ HTML5 Game Development from the Ground Up


    # 12.3 FACEBOOK


    Being able to distribute our games on Facebook is a great opportunity and a testimony
    to HTML5 and Construct 2''s flexibility.


    Construct 2 provides its own Facebook object, allowing us to log in, share links,
    post messages, and we can integrate our games as Facebook developers ourselves
    by hosting the games on our server and following one of the official Scirra''s
    tutorials. Tackling things completely by ourselves also exposes us to what many
    developers jokingly call “Facebook developer love”: Facebook has a great engineering
    team that updates the जिक्र APIs very often, and unfortunately, a few things here
    and there can get broken in the process. This has led to many frustrated developers.
    Well-known professor and game designer Ian Bogost stated in his blog that “the
    Facebook Platform is a shape-shifting, chimeric code of suffering and despair.”


    In other words, this means features that were working perfectly until a moment
    may suddenly change at short or even notice, forcing affected developers to understand
    the changes and fix their games in a hurry.


    To reduce these risks, it would be great if there were somebody who would take
    care of the low-level work for us while, maybe, also hosting the games on our
    behalf. Luckily, there is someone who helps in just that: Clayio.


    Once the game is published on Clayio, move to the Facebook Developers Page and
    click the Create New App button. The creation process requires us to input a few
    simple data, like name and namespace. The latter is going to be used for accessing
    the app''s actual URL (e.g., http://apps.facebook.com/namespace) as well as for
    more advanced tasks like Open Graph actions. There is no need to check the web
    hosting because Clayio is already taking care of it for us.


    Once Facebook generates a specific App ID and Secret Key unique to our game, we
    need to input these back to Clayio either in the Settings page of our game (look
    for the Social Settings section) or in the corresponding fields in the Push to
    Facebook page (accessible through the Marketplace/Distribute in the developers''
    panel on the left of the screen).


    +   * https://www.scirra.com/tutorials/58/how-to-make-a-facebook-game/page-1


    +   * http://m.bogost.com/blog/oauth_of_fealty.shtml


    +   * https://developers.facebook.com/apps'
