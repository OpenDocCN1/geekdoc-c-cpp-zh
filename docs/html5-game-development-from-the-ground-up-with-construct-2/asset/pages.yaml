  md: '# Understanding How Games Work ■ 15


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_35_0.png)


    FIGURE 2.2 Race to end is a typical and straightforward example of gameplay we
    can find in countless games. In Super Mario Bros. Wii, for example, our running
    and jumping are finalized to reaching a flagpole, allowing us to proceed to the
    next level.


    These concepts do not work in isolation, but they can be related to each other
    for describing a game in all its complexities by realizing that players apply
    the predefined rules to give a purpose to the available actions, producing the
    resulting gameplay. This is then used to overcome different challenges and goals,
    which we serve to link the gameplay to the experience by providing players with
    a reason to immerse themselves in the gaming world and then get emotionally engaged
    in what they are doing (see the AGE model in Figure 2.3).


    Now, while describing actions and gameplay can be relatively straightforward,
    how can we effectively describe the emotional experience of players in a way suitable
    for relating it back to the gameplay?


    To answer this question, the AGE framework adopts another model, the “6-11 Framework.”


    The idea behind this model is that games can be so engaging at a subconscious
    level because they successfully rely on a subset of basic emotions and eleven
    instincts that are well known in psychology and deeply rooted in all of us, regardless
    of our cultural background or ethnicity.


    +   * First introduced in On the Way to Fun: An Emotion-Based Approach to Successful
    Game Design, A K Peters, 2010.'
