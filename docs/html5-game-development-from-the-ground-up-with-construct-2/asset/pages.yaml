  md: '# Preface


    The exponential growth in sales of smart phones and tablets, together with more
    widespread and faster Internet connections worldwide, has made playing games more
    popular than ever before. Internet-enabled personal computers and mobile device
    sales worldwide are fast approaching 1 billion units, and research data show that
    a significant portion of time spent online is dedicated to playing games. It''s
    no wonder that game development is attracting more and more attention, as a hobby
    as well as a possible career, where even small teams, relying exclusively on online
    platforms, can find success.


    In an industry that dominated until recently by big blockbusters sold at retail
    and developed by teams of 100+ professionals with budgets topping $100 million
    or more, this may look like a dramatic and totally unexpected revolution. In reality,
    it can also be seen as a resurgence of the original spirit that characterized
    the early days of the gaming industry: in the 1980s, in fact, the relative simplicity
    of 8-bit computers allowed for the emergence of the so-called “bedroom coders,”
    young students and teenagers who, through their passion and commitment, managed
    to find success in a market that started as a niche but expanded in ways that
    were truly unimaginable.


    As the market became more demanding and complex, though, so did the underlying
    technology. Consequently, more resources, more time, and bigger teams were needed
    to develop successful titles. Today, instead, we are witnessing a new generation
    of technology that sidestepped raw power and complexity for convenience and ease
    of use. The new tools that are now available so advanced and yet so intuitive
    that they enable any-one to develop commercially viable products. We can actually
    say that the time for the “bedroom coders” is back!


    This book is written for this new generation of hobbyists and aspiring game developers
    who realized that exciting things can actually be done'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# xiv Preface


    with the right tools and knowledge. Indeed, there''s a plethora of new and very
    good manuals available already covering all possible game engines and middleware,
    but still, the book you are currently holding aims at being a little different,
    and I''m very glad it found a place on your shelf.


    Not only will you learn to use a modern tool, in this case Construct 2, an HTML.5-based
    game engine that will enable you to develop and release polished two-dimensional
    games on a multitude of different platforms, but it will also cover a foundational
    knowledge of game analysis and design based on my personal research on the subject.
    More theoretical part will be covered in the exact same way I have been successfully
    teaching it in specialized classes across different institutions, including DigiPen
    Institute of Technology and James University.


    It is my hope that the first part of this book will help you understand what really
    matters matters in games and contribute to making you a better game designer from
    the ground up, able to play any game critically and to express your ideas in a
    clear and concise format. The practical chapters that follow from Chapter 5 onward
    are structured through step-by-step tutorials. There, we will build an arcade-style
    game, a platformer integrating some physics elements, and then a more complex
    puzzle game, making my own game Turkey on the Run, published on Apple App Store
    and on BlackBerry World.


    Lastly, the book will discuss different ways to deploy and monetize games across
    several platforms, including Facebook, iOS, Android, web-based marketplaces, and
    more. A couple of appendices are also included to provide some additional resources
    you may want to investigate as you progress in your journey as an independent
    (“indie”) game developer.


    Get ready to work hard and play harder!


    Roberto Dillon

    Singapore

    September 6, 2023'
  merge: -1
