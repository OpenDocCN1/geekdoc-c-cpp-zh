    Let’s start with the score. We decided in our game design document to display
    the current score, the high score, and also a time bonus, starting at 500 and
    decreasing by 10 every second. To make things look a little better compared to
    Moon Wolf, this time we have each number in its own Text object. Add one text
    field for each element and call them something like txt_Score, txt_HiScore, and
    txt_Bonus. Place them appropriately in the top part of the screen.


    We also need to relate global variables, i.e., Bonus, Score, HighScore, which
    we can initialize to 500, 0, and respectively, (we will take care of the HighScore).
    Finally, in the On start of layout event, we need to add instructions for displaying
    these values when the game begins, like in Figure 8.33.


    The bonus works as a timer, and we can implement it simply by decreasing the Bonus
    variable through event including two conditions: Every X seconds, which we find
    in the Time section of the possible events for the System object, and a check
    on the current bonus value, i.e., we want to stop decreasing Bonus once it reaches
