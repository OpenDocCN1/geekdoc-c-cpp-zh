  md: '# The Journey Ahead ■ 197


    a browser and not as a native code executable program. This means that keeping
    the same, or similar, performance in terms of frames per second (FPS, which, in
    Construct, we can easily display by using the fps keyword in a text object) may
    be challenging, and it is something we should consider aside at the design stage
    of our games.


    In particular, we should be careful about these features that require considerable
    processing power:


    +   * **Physics**: if too many objects on-screen are using the physics engine,
    this will definitely slow down the game.


    +   * **Particles**: each particle is actually a small sprite, so you can imagine
    having several hundreds of them on the screen at the same time may overload a
    not so powerful device.


    +   * **Shaders**: effects require additional real-time processing so they should
    be used only when necessary and not overused. Whenever we have several objects
    that should be processed by the same shader, it is much better, performance-wise,
    to move them in a dedicated layer and then apply the effect to the whole layer
    itself instead of having it work on each object individually.'
