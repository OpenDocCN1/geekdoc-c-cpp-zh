  md: '# Turky on the Run, a Puzzle Game


    PUZZLE GAMES have always been a staple of gaming, and masterpieces like Tetris
    are there to remind us of how popular and long lasting simple yet perfectly designed
    puzzle can be. Centuries old puzzle concept we are all familiar with is the so-called
    "game of 15," where a 5 × 5 grid is filled with 14 tiles leaving only one space
    empty, allowing the player to maneuver the existing tiles around and ultimately
    reach a specific configuration. This could be, for example, an orderly sequence
    of numbers or a picture. Perhaps surprisingly, not many video games used this
    concept despite a pioneering attempt by Konami with Loco-Motion, a 1982 arcade
    game that also served as an inspiration for Turki on the Run, a small game recently
    released on iOS and BB10 devices. This game we are going to discuss here and proceed
    step-by-step throughout the next chapter.


    # 9.1  LOCO-MOTION: ANALYSIS


    In Loco-Motion the player is presented with a grid and a set of railroad tiles
    that have to be moved to form a proper railway system, allowing a small locomotive
    to pick up all passengers at the stations outside the map (Figure 9.1). The locomotive
    cannot be stopped and can''t be controlled directly: it will simply follow the
    trail it is on, so we have to herd it around by shifting tiles accordingly. If
    it gets in a dead end, falls into the empty square, or gets'
