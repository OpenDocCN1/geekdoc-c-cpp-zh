  md: '# 44 ■ HTML5 Game Development from the Ground Up


    (c) Music


    +   - System screens (opening music in the splash screen, options

    menu, credits, etc.)


    +   - Level themes (background music across the different levels

    and areas of the game)


    +   - Events (jingles and themes triggered by specific events, e.g.,

