  md: '# About Games and Ideas: Dream vs. Reality ■ 33


    While 30-year-old games look extremely primitive and lack all the bells and whistles
    are we use today, this lack of detail and technological prowess is actually helpful
    for exposing the gameplay elements that made such games popular back in the day
    and, and are very useful tools.


    This is also the reason why more and more university degrees on game development
    are incorporating classes on game history. If you follow industry events like
    the Independent Game Festival (IGF), you will soon notice that many of the winning
    games showcase gameplay and aesthetics clearly inspired by games of the past.


    The influence and inspiring force of these old "relics" shouldn''t be underestimated,
    and I truly encourage you to spend some time rediscovering old classics or little-known
    games for systems like the Atari 2600, Intellision, Commodore 64, Nintendo Entertainment
    System (NES), PC-Engine, Sega Genesis, and the like. Look beyond the blocky and
    low-resolution graphics and see if you can relate their core concepts to new games,
    or maybe even get new ideas on how to reinterpret them in a modern era for a new
    audience.


    To exemplify an old game can still be relevant in a modern setting, let''s see
    some actual examples where we can find specific gameplay ideas reinterpreted and
    adapted into something original across a multitude of genres, from casual games
    to high-budget AAA productions (see Figures 3.2–3.8 for some examples).


    In the end, while game development is still a very young field, it is important
    to be aware that it has an exciting and fascinating history, with many interesting
    concepts that can be explored in new ways. Knowing more about it can only help
    the that solid foundation, exactly the new generations of developers to build
    further on as writers and artists learn from the works of the people who preceded
    them in their respective fields.


    To stress the relevance of research to inspire new game ideas, the prototypes
    we are going to develop in the next chapters will be first introduced by an analysis
    of the early classes they are referencing.


    > * The Independent Game Festival is held annually in conjunction with the Game
    Developers Conference (http://www.igf.com).'
