  md: '# About the Book


    This book covers game design and development in a manner suitable for beginners,
    hobbyists, and aspiring indie developers. No specific programming knowledge is
    required, although familiarity with very basic concepts (e.g., what is a variable,
    an array, or a function) is assumed.


    The practical chapters are based on Construct 2, an HTML5-based game engine that
    runs under Windows. Note that Construct 2 is an ever-evolving engine with new
    versions being released very often. To make the book as “future proof” as possible,
    the tutorials have been carefully designed around stable and proven features that
    shouldn’t change significantly in upcoming versions of the software. Remember
    that these were developed and tested up to the latest stable and beta releases
    available at the moment of writing, and specific implementations may have to be
    tweaked and modified in the future. The underlying game design concepts discussed
    here, though, will not be affected by any change in game design and will help
    you in building a solid foundation in game design and development regardless of
    the actual tools used later in production.


    Sample Construct 2 project files for the games designed in this book can be found
    on the author’s website, http://programandplay.com.'
  merge: -1
