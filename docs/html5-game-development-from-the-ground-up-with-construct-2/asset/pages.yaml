  md: '# Moon Wolf, a Space Arcade Game


    ARCADE GAMES and space shooters were all the rage in the early days from Space
    Invaders to Asteroids, from Tempest to Defender, many classics were made around
    this theme.


    The genre is still a very good playground to hone our skills as designers because
    it is usually built around a simple yet engrossing game-play demanding good hand-eye
    coordination and fast reflexes, which are still relevant in many mobile games.
    Here, gameplay has to be carefully fine-tuned as the player progresses across
    waves of enemies, making also for a good playtesting and balancing exercise.


    Our first prototype will fall into this category of arcade-like space games. We
    will model the core actions and gameplay after an old but engaging game of the
    early 1980s: Solar Fox. As an homage to our source of inspiration, the game will
    be named Moon Wolf.


    # 5.1 SOLAR FOX: ANALYSIS


    Solar Fox is an arcade game released by Bally Midway in 1981. In it, the player
    has to drive a starship across a series of grids to retrieve cells while avoiding
    different types of enemies and hazards. To defend himself, the player has a limited
    range fire, which can momentarily halt the sentinels patrolling the grid perimeter,
    and can destroy incoming shots, and can speed up/down his ship to predefined cruise
    speeds.


    With taglines like “Bally-Midway’s Solar Fox speeds through a video universe of
    challenges” and “Speed and Strategy are all you have and they'
