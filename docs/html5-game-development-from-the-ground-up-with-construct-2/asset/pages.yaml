  md: '# 146 ■ HTML Game Development from the Ground


    Before we shuffle the tiles and make a random maze, we need to define how we are
    actually representing data-wise in the game. As you might have guessed, we are
    going to use an array to identify each tile position: let''s add one to the project,
    call it “Positions”, and set its size to (20,1,1).


    In the event sheet, let''s add a System/On start layout event followed by a subevent
    for Positions to cycle through all its elements on the x axis and initialize them
    (use Positions/For each X event). The simplest way to do this is to copy the current
    index (tracked by Positions.CurX built-variable) as its own value, i.e., slot
    0 will be a value of 0, 1 and so on. Once, we need another subevent to shuffle
    the array. The idea here is to switch two elements randomly several times that
    we can completely reorder the array. We can do so via the System/For loop, with
    a starting index of 1 and ending at 50, for example. To perform the switch we
    also need to declare three local variables: for selecting the indices of the elements
    we want to switch and for temporarily storing the first value. We can call these
    i, j, and temp. Then, through the System object, assign i and j to a random number
    between 0 and Positions array length (i.e., Set j to floor(Random(0, Positions.Width-1))),
    copy the value of the element having index i to temp (i.e., Set temp to Positions.At(i)),
    and finally copy the value j to the slot i by copying the value in temp to the
    slot j. The result is shown in Figure 10.3, where we also added two boxes in the
    Debug layer to print out the array values before and after the shuffling was done
    properly.


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_166_0.png)


    FIGURE 10.3 Initializing and shuffling the Positions array.


