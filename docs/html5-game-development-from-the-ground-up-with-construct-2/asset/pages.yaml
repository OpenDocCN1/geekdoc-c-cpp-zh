  md: '# Kitty & Katty, a Platformer


    FROM SPACE PANIC (a 1980 arcade game developed by Universal) to Super Meat Boy
    (developed by Team Meat in 2010), platform games have always been a fundamental
    genre that every aspiring game designer needs to master, especially if interested
    in developing two-dimensional games.


    To start defining our own, we will look at the first platform game that incorporated
    a swift jumping action: Donkey Kong. This was the game that, thanks to its innovative
    qualities and groundbreaking success, platformers a staple in gaming literature
    ever since, and is still played competitively to this very day.


    # 7.1 DONKEY KONG: ANALYSIS


    Donkey Kong was the first game designed by Shigeru Miyamoto at Nintendo in 1981.
    It was a truly original concept: not only did it add jumping to the platform model
    pioneered by Space Panic one year earlier, defining a fundamental game action
    common to most platform games ever since, but it also introduced cut scenes to
    describe a simple story. To support this, it also featured easily recognizable
    characters that were destined to become game icons, starting from Jumpman the
    carpenter, soon to be renamed Mario the plumber.


    The cut scenes are actually extremely important to set the tone of the game and
    to involve the player emotionally in the action. Watching Pauline, originally
    named Lady, being abducted by Donkey Kong and then desperately crying for help
    throughout the game (Figure 7.1) was sure to push the player into Jumpman''s shoes
    and raise our protection instinct: who can resist such a charming and defenseless
    damsel in'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# 96 ■HTML5 Game Development from the Ground Up


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_116_0.png)


    FIGURE 7.1 Lady Pauline screaming for help in Donkey Kong first stage: how we
    can resist such a desperate cry? Off we go, no matter if we will get run over
    by rolling barrels! (© 1981 Nintendo.)


    distress? The protection instinct is indeed the main driver behind the gameplay,
    which is a simple race to an end (we need to reach Pauline) while avoiding different
    hazards (barrels, flames, etc.). The game also gives Jumpman a chance to defend
    himself for a short while by giving him a hammer to smash the incoming barrels,
    though so prevents him from climbing ladders and advancing toward Pauline. Later
    stages also add a few of Pauline''s belongings, like an umbrella or a bag, adding
    a collecting component to add some variety and reinforce the experience. The AGE
    framework analysis for Donkey Kong is summarized in Figure 7.2.


    # 7.2 KITTY & KATTY: DESIGN


    Our platform game will take Donkey Kong as a model, maintaining a gameplay built
    around avoidance and race to an end and relying on our protection instinct to
    save... a damsel in distress? No, we saved too many already. Let''s try to be
    a little more original this time!


    Our player is going to play the role of a guy having a relaxing holiday in a chalet
    on the Alps with his two beloved cats, named Kitty and Katty.'
