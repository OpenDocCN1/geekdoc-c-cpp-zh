  md: '# 226 ■ HTML Game Development from the Ground Up


    To package and sign the game, making it ready for deployment on our device as
    well as the marketplace, we need a bat file like the following:


    ```

    C:\Research In Motion\BlackBerry 10 WebWorks SDK 1.0.4.11\bbwp"

    C:\Users\robert\Desktop\Turky on the Run-BB10\turky.zip"

    -g <YOUR SIGN PASSWORD> --buildID 5 -o "C:\Users\robert\

    Desktop\Turky on the Run-BB10\signed"

    ```


    The first lines specify the path and program to run (bbwp) the BlackBerry WebWorks
    Packager we have in the WebWorks SDK folder. This is followed by the path to the
    file we want to package, which is then followed by different parameters. In this
    case we specify our signing password via the -g parameter, a unique, progressive
    ID for our build via --buildID (note the double hyphen) and then -o (output),
    which is followed by the output path (which was, in our case, a project-specific
    folder in C:\Users\robert\Desktop\)


    To deploy to our device, the bat file should have the following commands:


    ```

    C:\Research In Motion\BlackBerry 10 WebWorks SDK 1.0.4.11\nddependencies\tools\bin\blackberry-deploy"

    -installApp -password <YOUR DEVICE PASSWORD> -device

    169.254.0.1

    -package C:\Users\robert\Desktop\Turky on the Run-BB10\nsigned\device\turky.bar

    ```


    Here we calling the blackberry-deploy program by the device, its internet protocol
    address on our network, and then the path to the specific bar package we need
    to install.


    If, we want to simply deploy to the simulator or test a development build on our
    device, we don''t need to specify a build ID or even the signing password in the
    package file, but on the other hand, we need to generate and install a debug token
    as explained in the official documentation.


    Finally to upload the log, log is in https://blackberryid.blackberry.com/bbid/login,
    then click on **Managing Products** and then on **Add**


    > * Full reference for parameters can be found here: https://developer.blackberry.com/html5/documentation/command_line_packaging_parameters_1873323_11.html.


    > ^ https://developer.blackberry.com/html5/documentation/running_your_bb10_app_2008471_11.html'
  merge: -1
