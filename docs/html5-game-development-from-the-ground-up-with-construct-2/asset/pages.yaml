  md: '# Understanding How Games Work ■ 29


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_49_0.png)


    FIGURE 2.25 Alternative AGE analysis for Frogger: we are not the frog, we are
    just there to help it.


    As stated earlier, analyzing the experience can be quite subjective, some players
    may see things a bit differently.


    For example, they may not have thought they were taking the role of the frog in
    the first place, but on the other hand, they simply thought their role was to
    "help" the unlucky frog to safely reach the pond. In this case, identification,
    fear, and survival would play any role in their emotional experience, and they
    would feel protective instinctive. Here the frog is not an avatar, but it simply
    acts as a character the player has to rescue.


    Under this assumption, the resulting AGE analysis would be like that shown in
    Figure 2.25.


    What if instead we decide to analyze the game following a top-down approach?


    Again, we start our analysis by playing the game, but this time we try to figure
    out the experience first by asking ourselves "How is the game to motivate me?
    How do I feel while playing?" This should lead us to question our relationship
    with the playable character: Is it an avatar (''I am playing as this little frog
    who has to cross the street''), which will lead us to the identification-fear-survival
    route? Or is it just a character we have to protect (''I have to help this poor
    little thing!''), leading us the model motivated by protective feelings? Once
    the emotional analysis is in place, we can proceed downward with the questions
    we saw earlier for identifying the gameplay and the actions.


    Regardless of our starting point, either the actions or the experience, we should
    arrive at the same result at the end of our analysis.


    # TAKE AWAY


    In this chapter we discussed a methodology for analyzing and understanding how
    games work at different levels, actions, gameplay,'
