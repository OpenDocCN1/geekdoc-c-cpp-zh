    caught by any crazy trains or loop sweepers that pop up if the player takes too
    long in reaching the commuters, it will crash, and the player loses one of the
    three available lives.


    The railroads could also be manipulated to make the crazy trains and sweepers
    crash into each other, scoring bonus points. This feature is actually very important
    to enhance the playing experience further by engaging players'' revenge instinct
    against the bad trains that keep chasing after the small locomotive, heretofore
    complementing the collect instinct (i.e., picking up all the waiting passengers),
    which is at the core of the game appeal as exemplified by the AGE framework analysis
    in Figure 9.2.


    # 9.2 TURKEY ON THE RUN: DESIGN


    Like any sliding tile puzzle, our game will rely on players'' spatial reasoning
    skills, but its theme and settings are going to be much different from Loco-Motion.
    Instead of a locomotive going to pick up passengers, here we are going to have
    a little turkey, aptly named Turkey, who needs to reach his peacock sweetheart
    for a date across the tile-based maze. Lady''s patience is limited thus, so our
    game will be time based and not based like most other games: if Turkey is unable
    to reach his girlfriend in time, the game will be over. Also, Turkey, while by
    no means a very smart guy, won''t be moving around crashing in dead ends if no
    paths are available: if the path ends abruptly, he will try to go back looking
    for an'
