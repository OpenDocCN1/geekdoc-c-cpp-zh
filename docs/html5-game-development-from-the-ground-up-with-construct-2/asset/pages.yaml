  md: '# About Games and Ideas: Dream vs. Reality


    EVERY ASPIRING GAME DEVELOPER has plenty of very ambitious ideas for the next
    blockbuster. On the other hand, any professional will tell you that, in the game
    industry, grand ideas are worth nothing. All that matters is execution. And this
    is where things get difficult: unfortunately, time and resources are very limited,
    while I hate to wake you from your daydreaming, a reality check is needed.


    Fantasizing about the next Halo or Uncharted will bring you nowhere: unless you
    have someone backing you up with $100 million, a large team of experienced professionals,
    and enough patience to allow for a development cycle spanning several years, your
    efforts and big dreams are destined to be crushed by the harsh reality we live
    in.


    This doesn''t mean we have to stopping! Successes as diverse as Brain Age (Nintendo,
    2006), FarmVille (Zynga, 2009), and Angry Birds (Rovio, 2009) were developed by
    small teams with small budgets within realistic timeframes. What really matters
    is knowing ourselves, our strengths, and our limitations and then setting our
    goals accordingly.


    Today we are very lucky to have modern and powerful tools, like Construct 2, that
    have lowered the barrier of entry into web-based, mobile, and even social games
    to a level such that anybody can make and distribute games to an almost unlimited
    audience.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'These types of games, though, are much different in concept and appeal than
    the AAA titles you might be playing on your home console systems and that likely
    made you interested in game development in the first place, so we may have to
    revise game ideas and concepts accordingly.


    Individual developers or members of small independent teams made up of friends
    or schoolmates should focus on games that implement straightforward concepts with
    clear and easily understandable goals.


    Levels should also be structured for playing sessions lasting only a few minutes
    at a time so that, when played on mobile devices on the go, they can be picked
    up quickly and stopped any time (see an example in Figure 3.1).


    Interestingly, games with these characteristics are not a new concept that emerged
    recently due to our modern and busy lifestyle or due to the popularity of new
    mobile devices. These were actually common traits of most games during the 1980s
    and early 1990s. At that time, technology could not support extensive and complex
