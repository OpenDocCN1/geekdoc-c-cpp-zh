  md: '# Foreword


    Scirra started out life several years ago as a loosely organized band of volunteer
    students working in our spare time around full-time courses. We were fairly casual
    and a little chaotic in getting the first (and rather flawed) iteration of our
    software, Construct Classic, off the ground. Sometimes there were periods of neglect
    when exams and other concerns came up, but we always returned to it. We really
    loved solving the technical problems, working with the community and slowly gaining
    recognition. Years later, through a complete ground-up rewrite and release of
    the successor, Construct 2, I find myself sitting in our office in the outskirts
    of London and making a living from it all! Passion and persistence can get you
    a long way, even from the most humble of beginnings.


    I won''t go into Construct 2 itself, since this book is by Prof. Dillon will teach
    you a great deal about that. However, I will add a word technology in general.
    I technology is amazing. You can consume graphics processors that have thousands
    of cores, using billions of individual transistors. Most of the computers in the
    world are connected together and can communicate in real time via the Internet.
    Phones are now computers with apps that carry everywhere with you, and tablets
    are a whole new type of device. There are, of course, even more exciting technologies,
    and there are surely more innovations to come that we can not even anticipate.
    When it comes, as, ever, software will be the glue that connects all of it together.


    Traditionally software development has been a complicated endeavor requiring expertise
    to combine exciting technologies in interesting ways. One of our aims with Construct
    2 is to help people get involved in this fascinating, fast-paced world. It is
    designed to considerably lower the barrier of entry, while remaining a productive
    and useful tool. We hope that without much experience you can come up with something
    exciting that combines graphics processors, Internet communication, phones, tablets,'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'xii Foreword


    and more—all made possible by a whole stack of technology, right down to the individual
    transistors.


    If you are using Construct 2 and ever experience the delight of seeing something
    working the way you wanted it, or feel curious to find out how something works
    and are compelled to learn more, or just awe at how much is working together to
    make it all possible, then we have succeeded. If you are young, or have never
    really been involved in technology, and technology (just as other technologies
    fascinated us when we were young), then it truly is a privilege to provide that
    for you. Just remember that with your persistance and Construct 2, you can create
    great games!


    # Ashley Gullen


    Director, Scirra Ltd.


    London, September 2013'
  merge: -1
