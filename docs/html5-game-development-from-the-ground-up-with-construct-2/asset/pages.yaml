    # 11.3 SHADERS (EFFECTS)


    With more and browsers supporting Web graphics libraries (WebGL), we can likely
    expect graphical quality of HTML5 games to improve significantly in the near future.
    Shaders, simply named Effects in Construct, are an important feature in enhancing
    graphics, thanks to their ability to alter a texture pixel in real time according
    to some predefined algorithm.


    Construct comes with 70+ predefined shaders that can be used individually or together
    to create complex effects. For example, let''s start a new project and add a sprite.
    Fill it with a blue color: we are going to use a shader to simulate a water effect.


    Click on the Effects link in the Properties panel as shown in Figure 11.8 and
    then choose to add an effect. Scroll down the list of available effects you find
    the one for water (Figure 11.9) and add it.'
