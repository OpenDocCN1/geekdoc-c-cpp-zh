    just might be enough! Solar Fox was relatively popular, so much so that it was
    even featured in the 1983 movie Joysticks (see Figure 5.1).


    To gain a better insight on the game, let''s analyze it with the AGE framework,
    starting with the actions.


    What actions can we do in the game? Let''s check the controls: the joystick allows
    us to move around the two-dimensional grid, while two buttons allow us to change
    speed, from low to high or vice versa (according to the game difficulty we select
    when starting the game) and shoot a short-range missile.


    What are we using the actions for? By shooting and moving around we can avoid
    enemies and grab the available cells. In game design terms, we can say we have
    a gameplay centered around themes like avoidance (avoiding being hit by the enemies),
    race to an end (we have to find a path to reach the next cell we are targeting),
    and taking/hoarding all cells in the level.


    Finally, regarding the experience, the goals here are simply to reach and grab
    cells while avoiding fire. Our collecting instinct will push us to clear the level,
    which in turn, should make us happy and proud of our success. Our survival instinct
    would also play an important role,


