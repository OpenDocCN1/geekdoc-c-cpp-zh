    # 10.1 LAYOUT AND SHUFFLING


    Originally, Turkey on the Run was developed with a web browser and the iPhone
    3GS as target platforms, so great care was taken to keep resources as low as possible
    and to work on the 3GS low-resolution screen of 480 × 320 pixels, relying on the
    up-scaling abilities of Construct 2 to adapt to other devices. I will maintain
    the original 480 × 320 layout size here, but if you prefer, feel free to design
    for a higher resolution and scale all values accordingly.


    Once our new empty project is open and the layout size, let''s rename the Layer
    0 to “Action,” set its background color to black, and add a new layer named GUI,
    like we did for the other projects. We may also want to add a **Debug** layer
    to display helpful text while the game is running and monitoring different variables.


    We saw in the game design document that our maze will consist of a grid made by
    four rows and five columns, making enough room for 19 tiles and one empty space.
    Specifically, we will have seven of different types according to the paths they
    represent, shown in Figure 10.1.


    By adding a new sprite for each of these and importing the graphics accordingly
    (you can find these in the downloadable game project file or draw your own). As
    usual, name each sprite in a meaningful way, for example, the crossroad could
    be t_X, with t standing for “tile,” the vertical


