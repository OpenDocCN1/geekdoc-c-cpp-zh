  md: '# Understanding How Games Work


    > “A method is needed in order to reason accurately.” —René Descartes


    THOUGH IT IS TEMPTING to jump right into practical game development exercises,
    in my experience from years of teaching, the quality and effectiveness of your
    work will benefit greatly from starting out with a thorough understanding of the
    main theoretical principles before the field.

    So what are these “principles”? How can we uncover them to gain a better understanding
    of what makes games tick and turn them into something engaging, and ultimately
    fun, for so many people?

    As the French philosopher and mathematician René Descartes (1596–1650) once said,
    “A method is needed in order to reason accurately.” Unfortunately this is an area
    where games have always been struggling: game designers, in fact, still lack a
    common jargon. They often refer to different concepts using the same words or
    define the same concepts using completely different words, making idea sharing
    and definitions of possible methods challenging to say the least.

    Despite the difficulties, a first real attempt to define uniform terms was made
    a few years ago by three game designers named Robin Hunicke, MarcBlanc, and Robert
    Zubek, whose approach, called the MDA framework, was to understand games by dividing
    them into the three main layers:


    * Regulae ad directionem ingenii (Rules for the Direction of the Mind), unfinished
    treatise, 1628.'
