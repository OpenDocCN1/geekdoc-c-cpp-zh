  md: '# Game Design Documentation for Indies ■ 45


    way to think things over and analyze problems before they even happen.

    Anyway, we definitely need to find a much more agile way of doing things.


    At Boomzap, for example, they try to concentrate the most relevant information
    we saw in the canonical bible approach by using a very visual style, mostly via
    mock-ups of different screenshots to discuss how the gameplay would develop. The
    whole documentation usually takes less than 20 pages.


    An even more drastic, to outline a design in the most focused way possible, has
    also been proposed by Electronic Arts/Maxis Creative Director Stone Librande in
    his highly popular Game Developer’s Conference talks discussing a “One-Page Designs”
    format.


    The idea is to identify and discuss only the main elements of the game and their
    relationships. Note that this does not necessarily mean the game documentation
    is going to fit onto one page. Different features or sections, such as concept
    art to discuss the theme and mood of the game, GUI, storyboards, relationships
    between units and their stats, and different maps/levels, may require their own
    pages, but the important point is that each sheet we draw should stand alone and
    should discuss in enough detail one or more related aspects in a visual and easily
    understandable way.


    A possible format for approaching design documentation in this way is showcased
    in Figure 4.1.


    In general, good guidelines to design such one-page documents are to start with
    a title and version (don''t forget to date the document!), write a synthetic description
    of the topic under discussion, and then draw a central picture or diagram to illustrate
    the topic. This can have a more detailed description to clarify important concepts,
    including sub-projects showing further details, callouts to identify items and
    functionalities, and more.


    The remaining part of the page can be used to illustrate other related diagrams,
    flowcharts, bullet points/checklists, high-level goals, or other meaningful information.


    It is also important to leave some white space around diagrams to facilitate reading
    and comprehension of the material presented. Although you may want to squeeze
    as much information as possible on the page, an overly cluttered layout won''t
    incentivize people to go through it, undermining the very reason of this approach:
    we want our documents to be actually read and not silently ignored!


    > * Stone’s original slides can be retrieved from his website: www.stonetronix.com/gdc-2010/'
