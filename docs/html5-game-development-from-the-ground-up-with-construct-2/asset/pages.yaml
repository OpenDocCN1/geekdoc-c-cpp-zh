  md: '# Kitty & Katty Development


    KITTY & KATTY is going to be developed as a PC/browser game, so our starting resolution
    should be on the low end of the spectrum to allow people with old computers and
    monitors to enjoy it without big issues: limiting our window size to 800 × 600
    pixels would be fine in this case.


    Start a new project and define the layout and screen dimensions accordingly, together
    with a "letterbox scale" to easily accommodate larger (or smaller) resolutions.
    The first thing we should take care of is setting up the game structure as described
    in Figure 8.1.


    # 8.1 GAME STRUCTURE


    To implement the game structure we just defined, we need to add different layouts
    to the project, one for each part: splash screen, high score table, level selection,
    and then the actual levels. We can add them one by one by right clicking on the
    Projects tab, Layouts folder and select Add layout as shown in Figure 8.2.


    When adding a new layout, Construct will also ask us if we''d like to add a new
    event sheet to be associated with it. Let''s do so well (event sheets can be added
    any time by right clicking on the event sheet folder and selecting the appropriate
    command, don''t worry if you forget about while adding a layout).


    In the end, after we rename and resize all layouts accordingly, we should have
    something like Figure 8.3, and then we should update our project properties so
    that the application knows which layout needs to be loaded first. In our case
    it will be the splash screen, as shown in Figure 8.4.'
