  md: '# 224 ■ HTML5 Game Development from the Ground Up


    Head to https://developer.blackberry.com/html5/ to have a general overview of
    how HTML5 games are handled. Detailed tutorials and documentation are available
    at https://developer.blackberry.com/html5/documentation/.


    In any case, the first step would be to start downloading the WebWorks software
    development kit (SDK) and the BlackBerry 10 Simulator can be found at https://developer.blackberry.com/html5/download/
    and then register as a BlackBerry developer who, in line with the indie-friendly
    approach adopted, is completely free. Currently, in fact, there are no annual
    fees required to publish apps and games on BlackBerry World!


    The process to publish a game on a BB10 device can be summarized in three main
    phases:


    +   1. Have all the needed HTML5 files zipped together with a config.xml file.

    2. Package, sign, and test the app.

    3. Publish it on BlackBerry World.


    To start we can either export our project as a standard HTML5 game (and then follow
    BlackBerry instructions) or Construct BlackBerry export feature, which will allow
    us to take a couple of shortcuts, though we will have to fine-tune a few files.


    If we opt for the latter, Construct will ask us for the path to WebWorks SDK as
    well as for other information (Figure 12.31), including the signing keys we have
    to request at https://www.blackberry.com/SignedKeys/codesigning.html. This pair
    of keys will be sent via e-mail. They are tied to our developer account and, needless
    to say, are very important. Be sure to back them up and don''t misplace them!


    Construct will also build a simple config.xml file for you, but we may want to
    see how to customize it to suit your specific needs and requirements by checking
    the relevant documentation.


    Once this is done, all the files in your game''s folder, including the config.xml.
    It is now time to test our game and deploy it. As explained by BlackBerry official
    documentation, testing can be done in a few different ways. I will briefly discuss
    only the command line approach, since it usually looks intimidating to beginners
    but, in reality, there is nothing to worry about.


    * https://developer.blackberry.com/html5/documentation/config_doc_elements.html'
