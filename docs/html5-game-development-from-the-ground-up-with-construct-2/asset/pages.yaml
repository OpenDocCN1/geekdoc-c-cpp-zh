  md: '# Turky on the Run Development


    DEVELOPING TURKEY ON THE RUN is going to be a bit more complicated than the two
    other games we have worked on so far: while we managed to keep Moon Wolf and Kitty
    & Katty within the 100 events limit so that they could be developed on the Construct
    2 Free Edition, the full version of Turkey on the Run we can find on the Apple
    AppStore and BlackBerry World counts more than 600 events!


    For this reason, we will focus on describing how to achieve the actual gameplay
    only, leaving the other parts of the game, like splash screens, navigation between
    layouts, etc., as a simple exercise: this shouldn''t be a problem by now since
    these tasks would involve essentially the very same steps we did when developing
    Kitty & Katty. The gameplay alone, though, will still need more than 100 events
    overall, so, if developing on the free edition, you may have to try different
    features individually in independent projects or simplify aspects of the game,
    for example by reducing content. Specific places where this can be done will be
    pointed out as we progress.


    Our step-by-step development will be subdivided into the following sections:


    +   Layout and shuffling, where we place the different tiles to form the grid
    and shuffle them around.

    Moving tiles, where we are going to allow the player to move a tile into the empty
    area by clicking on it or touching it. We will also'
