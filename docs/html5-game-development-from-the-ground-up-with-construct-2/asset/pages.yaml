  md: '# # Appendix B: Selected Bibliography for Further Study


    THE GAME DESIGN AND development literature has grown significantly during the
    last few years, and among the many good books available today, I recommend the
    following to the serious student who wants to gain an in-depth knowledge of all
    the different facets of game design.


    Books are listed in alphabetical order by author.

    Adams, Ernest, *Fundamentals of Game Design*, New Raiders (2009, second edition).


    A step-by-step approach in a very clear style that covers all important areas,
    from storytelling and character development to balancing and user interfaces.


    Adams, Ernest, *Game Mechanics: Advanced Game Design*, New Raiders (2012).

    A more advanced text introducing design patterns and detailing aspects such as
    game balancing, economics, and progression.


    Brathwaite, Brenda and Ian Schreiber, *Challenges for Game Designers*, Cengage
    Learning (2008).


    An excellent collection of exercises to build up (board) game prototypes aimed
    at understanding the core concepts and constraints of game making.

    Cszentmihalyi, Mihaly, *Flow: The Psychology of Optimal Experience*, Harper Modern
    Classics (2008).


    The concept of "flow" is central to many discussions in game design circles. This
    book explains flow and its broad implications in terms accessible to the layman.


    Dillon, Roberto, *On the Way to Fun: An Emotion-Based Approach to Successful Game
    Design*, A K Peters/CRC Press (2010).


    This is the book that introduced the 6-11 framework. Besides a detailed analysis
    of the theoretical model, it also includes several case studies you can use to
    practice your analytical skills.


    Dillon, Roberto, *The Golden Age of Video Games: The birthplace of a Multibillion
    Dollar Industry*, A K Peters/CRC Press (2011).'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# 238 Appendix B: Selected Bibliography for Further Study


    If you want to know more about how it began and what games were the most groundbreaking
    and inspirational in the 8 and 16 bits era, this is a good starting point.


    Fullerton, Tracy, Game Design Workshop: A Playcentric Approach to Creating Innovative
    Games, Morgan Kaufmann/CRC Press (2008, second edition).


    A comprehensive introduction to all the different phases needed to build a game,
    from conceptualization to playtesting and much more. The stresses of adopting
    a proper iterative process through the teaching of game fundamentals and hands-on
    exercises.


    Knizia, Reiner, Dice Games Properly Explained, Blue Terrier Press (2010).


    Understanding how to use dice effectively establish and manipulate the probability
    of different events and outcomes is a fundamental aspect in countless games. This
    book clearly explains dice-based games whose study would greatly benefit the skills
    of any game designer.


    Koster, Ralph, A Theory of Fun for Game Design, Paragraph Press (2004).


    A simple but delightful read to remind us all what really matters for making games.


    Kremers, Rudolf, Level Design: Concept, Theory, and Practice, A K Peters/CRC Press
    (2009).


    Level design is an overlooked area in game design, so by explaining good design
    practices in general terms and not bound to any specific development tool, this
    book fills an important void.


    Ludiguez, Bill and Matt Barton, Vintage Games: An Insider Look at the History
    of Grand Theft Auto, Super Mario, and the Most Influential Games of All Time,
    Focal Press (2009).


    A great read that analyzes several classic games and how they affected the evolution
    of different genres. Lots of insights and inspirational material here! Moore,
    Michael, Basics of Game Design, A K Peters/CRC Press (2011).


    A comprehensive introduction carefully explaining different genres and the underlying
    data-driven structures that make them work. Salen, Katie and Eric Zimmermann,
    Rules of Play: Game Design Fundamentals, MIT Press (2003).


    A slightly scholarly book dissecting games in terms of three fundamental concepts,
    namely, rules, and play. Schell, Jesse, The Art of Game Design: A Book of Lenses,
    Morgan Kaufmann/CRC Press (2008).


    A modern classic outlining a set of "lenses" to look through for an depth understanding
    of games. Swink, Steve, Game Feel: A Game Designer’s Guide to Virtual Sensation,
    Morgan Kaufmann/CRC Press (2008).


    An fascinating discussion of the game feel model of interactivity, a very helpful
    perspective for creating more engaging and immersive experiences in our games.'
  merge: -1
