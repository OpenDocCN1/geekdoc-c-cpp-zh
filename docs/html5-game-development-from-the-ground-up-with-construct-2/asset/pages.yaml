    # 11.2 SPRITE FONTS


    When distributing games on a variety of different computers and devices, it may
    happen that specific fonts we are using are not supported. In this case the system
    will most likely revert to a default font that would probably mess up the whole
    screen layout or break any style consistency we carefully planned beforehand.
    To avoid these pitfalls and to be 100% sure the font displayed is exactly the
    one we want, we may decide to opt for the so-called sprite instead. As the names
    imply, we will be using a sprite map containing all needed characters. This would
    give us much more freedom and enable us to display even multicolored sprites,
    for example, something impossible when using traditional fonts. The drawback,
    that is that the new sprite will have only one size and no bold or italic versions,
    unless we explicitly build them as well.


    Adding sprite fonts in Construct is very easy: simply select it as a new object
    in your project. By default, we will be presented with an 8-bit like font, as
    shown in Figure 11.6.


    The sprite font properties allow us to define the characters'' width and height,
    their exact sequence in the sprite (with the first character starting'
