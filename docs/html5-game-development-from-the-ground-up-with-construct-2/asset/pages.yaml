    This extremely detailed approach has some good points: by creating

    it we actually have to think of the whole game in detail. In addition,

    every is in one single place for easy reference, at least in theory.

    But these also bring undesired side effects: game development is

    an iterative process. Ideas change throughout the early (and sometimes

    not-so-early) stages of development, and such a document is difficult to

    update, track changes, and manage. Also, its length makes it difficult

    to search it in practice and makes people less inclined to sit down and

    read it.


    This is actually an interesting point that is worth discussing a little

    more in detail. Many game designers soon realize that no one in the team

    actually reads their design documents! While this may seem a bit hard

    to believe at, I found this to be true in my personal experience

    and also confirmed by many other people. One of the funniest anecdotes

    I heard from Chris Natsume, cofounder of the casual game devel

    Boomzap. Before finding his own studio, he was a producer for the

    AAA title Far Cry (developed by Crytek and published by Ubisoft in 2004)\sand,
    to check he started adding notes to some random pages like

    “if you read this line, come over to me and I''ll give you $10! Guess what?

    No one ever went over it to ask for the $10!


    If no one reads it, can we skip the document entirely then and

    just start working on actual development? No, I highly discourage this,

    even if you are working so, since writing down your ideas is the best'
