  md: '# CHAPTER 11


    # The Journey Ahead


    By completing OUR third game, Turky on the Run, we built a solid foundation on
    Construct 2 upon which you should be able to expand and add additional skills
    and knowledge on your own. As you have probably realized by now, despite its designer
    friendliness, Construct is a very flexible and powerful engine, and there is really
    much more to explore and try out what we saw so far. Always be curious, and start
    exploring the different objects and behaviors we didn''t have time to cover: you
    will surely get lots of promising ideas to work on!


    To conclude the development section of the book, I want to introduce a few more
    topics that may help in your upcoming projects, pathfinding, sprite fonts, shaders,
    and source control, plus some basic performance-related tips.


    # 11.1 PATHFINDING


    Pathfinding is a very important feature in many games to make nonplaying characters
    (NPCs) behave naturally: poor pathfinding, where characters get stuck around every
    corner, is often enough to break players'' immersion to the extent that they might
    dismiss an otherwise fine game as amateurish and poorly done. It shouldn''t be
    a surprise that several algorithms have been devised to accomplish this in a variety
    of ways. One of the best and most CPU-efficient techniques adopted in game development
    is called A* (A star) and, luckily for us, it is also implemented in Construct
    right out of the box.


    In a nutshell, A* works by first subdividing the game area into tiles and then
    identifying the starting tiles, the target tiles, and those presenting'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 188 HTML5 Game Development from the Ground Up


    obstacles. The algorithm then starts looking around the starting position tile
    by tile, using some predefined scoring methods to evaluate the cost of movement
    across each tile. Once the destination is reached, the algorithm backtracks tiles
    forming the path having the lower overall cost. That is the path characters will
    take.


    To see how to use this in Construct, let''s start a new project with a layout
    out of 640 × 640 pixels.


    We don''t have to draw the tiles in the layout. For an efficient use of the algorithm
    as well as for a more natural looking path, it is useful to think of tiles sized
    to perfectly cover the area, or to choose tiles measuring 32 × 32 or 64 × 64 pixels.
    In Figure 11.1 we have the layout showing a 32 × 32 tiled background, making apparent
    how the area would be divided by the A* algorithm.


    Let''s add some walls to define a maze from a top-down perspective, for example,
    by using a simple filled rectangle in a Tiled Background object. While not strictly
    required, we should make the barriers match the dimension of the tiles exactly
    or, eventually, a little bit smaller. In fact, even if an obstacle gets into a
    tile only partially, the whole tile will be considered inaccessible by the algorithm,
    even though it would still look like there is some room for the character to move
    around.


    ![](img/dc4ab393a7e780a508e0b1c23c57f660_208_0.png)


    FIGURE 11.1 The layout for our pathfinding experiment. The tiled background is
    simply there to help us visualize the area and understand how A* is going to subdivide
    the playfield.'
