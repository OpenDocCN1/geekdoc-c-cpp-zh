  md: '# 50 ■ HTML Game Development from the Ground Up


    Inspired by this classic, we can now start designing our own take on the genre.


    # 5.2 MOON WOLF: DESIGN


    Our space arcade game will retain the main elements of Solar Fox but will simplify
    a few things while adding something new as well.


    First of all, we won''t have the fancy flying joystick at our disposal, but we
    can still try to engage the player by providing a simple background story to make
    the setting a little more exciting. For example:


    +   - A mysterious alien force is amassing deadly weapons behind our Moon. As
    the Earth''s only hope: infiltrate enemy lines and steal all their energy reserves
    while avoiding their sentinels!


    Our gameplay would essentially remain the same as the original, but we can change
    a few aspects to make it ours: for example, shooting is not really the main part
    of the action, so, for simplicity''s sake, we can just focus on the avoiding and
    collecting aspects instead. On the other hand, we may want to add a resource-handling
    element, making the change speed limited and, thus, more meaningful: the player
    can only accelerate as long as he has enough fuel for boosting its speed. This
    means we should also give opportunities for refilling our fuel tank, though, and
    we can by deciding that every time we collect a cell, there is a 10% probability
    to spawn a recharge battery. The battery should recharge 20 units of fuel when
    picked, for example. We can also limit our design to just one antagonist that
    would roam the full screen perimeter and shoot straight missiles. To make the
    action more varied and challenging, we can add different types of hazards, like
    asteroids that can randomly travel the screen. In addition, the player would start
    with one life: getting hits game over. When all cells have been collected, the
    game restarts with a new wave, replacing the cells and making the sentinel, as
    well as the asteroids, move faster and shoot at a higher rate.


    All these ideas are summarized in our one-page design document shown in Figure
    5.4, which will serve as a reference throughout the development process that we
    will start in the next chapter.


    > Indeed, this is what the home conversion for the Atari 2600 console did back
    in the day.'
