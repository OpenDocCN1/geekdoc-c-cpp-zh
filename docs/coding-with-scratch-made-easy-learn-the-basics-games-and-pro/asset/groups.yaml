  mdcn: "\n\n# 西瓜接接\n\n猫猫（Scratch Cat）必须阻止掉落的西瓜碰到地面，但他不知道它们会在哪里出现，或者哪一个西瓜会先掉！帮助他让西瓜留在空中。\n\
    \n+ 你将学习到：\n- 如何通过快速切换造型来让角色制作动画\n- 如何创建角色及其脚本的副本\n- 延时可以让游戏更有趣\n\n每个西瓜开始时都在一个随机位置。\n\
    \n西瓜会从猫身上反弹并跳回空中。\n\n西瓜会一个一个落下。\n\n![](img/b061febeb032d536c8c7de6511458796_63_0.png)\n\
    \n当西瓜撞击舞台底部时，你会听到���声，游戏结束了。\n\n使用左、右方向键左右移动猫。\n\n# 玩游戏\n\n使用方向键让猫猫在舞台上左右移动，以碰到掉落的西瓜。游戏每持续一秒你就能得到一分。西瓜跳动得越久，得分就越高！\n\
    \n# 让猫动起来 63\n\n首先，编写一些代码，让猫猫可以在舞台底部巡逻，清除地上的西瓜。\n\n+ 1 开启新项目并将其命名为“西瓜接接”。将猫的名字从“Sprite1”更改为“Cat”。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_0.png)\n\n2 查看猫的“造型”（Costume）标签页。你会看到两个造型。如果你让它反复切换，它看起来就像像在走路。这被称为动画。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_1.png)\n\n快速的造型切换会让猫看起来像在走路。\n\n\
    ![](img/b061febeb032d536c8c7de6511458796_64_2.png)\n\n![](img/b061febeb032d536c8c7de6511458796_64_3.png)\n\
    \n```\nwhen clicked\ngo to x: (-180) y: (-120)\nforever\n  if right arrow pressed?\
    \ then\n    change y by 10\n    next costume\n  if left arrow pressed? then\n\
    \    change x by (-10)\n    next costume\n```\n\n+ 3 创建此脚本，这样你就可以使用左右方向键沿舞台底部移动猫了。紫色的“下一个造型”模块每隔10步就会改变一次猫的造型。\n\
    \n# 多个西瓜\n\n为了制作四个西瓜，你需要加载一个角色，给它一个脚本，并创建它的三个副本。\n\n+ 4 在角色列表中，点击角色符号（从库中选择角色）。加载“西瓜”（Watermelon）角色。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_4.png)\n\n+ 5 为西瓜落地地时添加一个声音。在西瓜的“声音”（Sounds）标签页下，点击喇声器符号（从库中选择声音）。加载“���声”（cymbal）声音。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_5.png)\n\n# 64 游戏\n\n![](img/b061febeb032d536c8c7de6511458796_65_0.png)\n\
    \n让角色始终面向同一个方向。\n西瓜从 y: 150 和 x: -180 到 x: 180 之间的某个位置开始。\n\n![](img/b061febeb032d536c8c7de6511458796_65_1.png)\n\
    \n为西瓜构建上面的脚本。\n游戏开始时，西瓜将位于舞台顶部附近的 y: 150 处。但它将占据 x: -180 到 x: 180 之间的随机左右位置。\n\
    \n西瓜的左右/范围。\n猫从 x: -180, y: -120 开始。\n\n![](img/b061febeb032d536c8c7de6511458796_65_2.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_65_3.png)\n\n将以下模块添加到西瓜脚本的末尾。使用“与”（and）模块来确保只有当与模块的两个部分都为真时，“如果-那么”模块中的动作才会发生。运行游戏进行测试。\n\
    \n在西瓜落下前等待10秒。\n\n方向模块来自“移动”（Motion）部分。\n\n如果掉落的西瓜碰到舞台底部，游戏结束。\n\n![](img/b061febeb032d536c8c7de6511458796_65_4.png)\n\
    \n上升中。\n\n![](img/b061febeb032d536c8c7de6511458796_65_5.png)\n\n落下。\n\n![](img/b061febeb032d536c8c7de6511458796_65_6.png)\n\
    \n如果西瓜碰到猫，让它向上弹。\n如果上升的西瓜碰到舞台顶部，它会落下。\n为了让游戏更有挑战性，增加三个西瓜。右键点击西瓜并在弹出菜单中选择“复制”，重复三次，这样你有四个西瓜。修改三个副本脚本中的“等待10秒”模块，将等待时间改为15、20和25秒。\n\
    \n# 西瓜 2\n# 西瓜 3\n# 西瓜 4\n\n# 评分与背景\n\n你几乎完成了“西瓜接接”。剩下的是创建一个脚本来评分并为舞台添加一些背景。\n\
    \n```\nwhen clicked\nset Score to 0\nforever\n  wait 1 secs\n  change Score by\
    \ 1\n```\n\n进入舞台并点击背景符号（从库中选择背景）。点击确定。游戏现在完成了。让那些西瓜留在空中！\n背景出现在舞台的“背景”（Backdrops）标签下。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_66_0.png)\n\n![](img/b061febeb032d536c8c7de65114588796_66_1.png)\n\
    \n![](img/b061febeb032d536c8c7de65114588796_66_2.png)\n\n![](img/b061febeb032d536c8c7de65114588796_66_3.png)\n\
    \n![](img/b061febeb032d536c8c7de65114588796_66_4.png)\n\n![](img/b061febeb032d536c8c7de65114588796_66_5.png)\n\
    \n# 66 | 游戏\n\n展示你的所学\n既然你已经精通了西瓜，尝试这些挑战。\n\n1. 模块面板中这些部分是什么颜色的？数据（Data）、声音（Sound）、事件（Events）、移动（Motion）、控制（Control）、外观（Looks）\n\
    \n2. 快速切换角色造型让它看起来像在跑步叫做____\n\n3. 让猫变快会让游戏变得更容易还是更难？\n4. 你如何让西瓜掉得更快？\n5. 你如何让西瓜变小？\n\
    6. 你如何向游戏中添加西瓜？\n7. 西瓜开始时偶尔会聚集，这让游戏变得太简单。你可以通过更改西瓜脚本中“移到x”模块的随机范围来修复，如下所示。自己试一下。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_67_0.png)\n\n![](img/b061febeb032d536c8c7de6511458796_67_1.png)\n\
    \n这如何解决聚集问题？____\n\n8. 尝试构建一个游戏运行时播放音乐的短脚本。将其添加到猫角色中。测试你的脚本。\n\n![](img/b061febeb032d536c8c7de6511458796_68_0.png)\n\
    \n# 项目\n\n现在你是一个 Scratch 专家了，让我们看看你能做什么！利用你的技能制作古怪的音乐、搞怪的艺术和有趣的测验来挑战你的朋友。\n\n\
    ![](img/b061febeb032d536c8c7de6511458796_69_0.png)\n\n![](img/b061febeb032d536c8c7de6511458796_69_1.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_69_2.png)\n\n![](img/b061febeb032d536c8c7de65114588796_70_0.png)\n\
    \n# 项目\n\n# 古怪的音乐\n\n你准备好制作“古怪音乐”并用你的乐作品惊艳你的家人了吗？按照编号步骤操作，一步一步组装项目。\n\n+ 你将学习到：\n\
    - 如何构建简单的脚本来制作项目\n- 如何控制角色\n- 如何在 Scratch 中播放音乐\n- 如何制作角色\n- 如何更改大小和颜色\n\n将指向鼠标指针。\n\
    在这里输入你的项目名称。\n\n方向显示了猫指向哪里。\n\n![](img/b061febeb032d536c8c7de6511458796_71_0.png)\n\
    \n彩色的背景 - 这一个叫做“闪烁”\n猫始终面向鼠标指针。\n\n# 你做什么\n\n这个项目让舞台变成了一个奇怪的乐器。点击鼠标旋转旋转改变颜色和大小！\n\
    \n# 让猫旋转起来！\n\n首先，我们将编写一个脚本来控制猫。它将留在舞台中心，但不会停下来！\n\n它留在舞台中心，但不会停下来。\n\n# 项目 |\
    \ 71\n\n![](img/b061febeb032d536c8c7de65114588796_72_0.png)\n\n+ 打开 Scratch 编辑器：在\
    \ Scratch 网站上点击创建，或点击电脑上的 Scratch 符号。将你的项目命名为“古怪音乐”。\n\n点击箭头并选择鼠标指针\n\n+ 在脚本标签页下，查看深蓝色移动模块面板。点击“指向”模块并将其拖动到右侧的脚本区域。从下拉菜单中选择鼠标指针。\n\
    \n```\npoint towards\n```\n\n+ 点击黄色控制部分并选择“循环”模块。将其拖到“指向”模块上方，然后松开。模块将锁定在一起。接下来，点击棕色事件部分。将“点击此”模块拖到循环模块的顶部。\n\
    \n点击标志时从顶部开始脚本\n\n```\nwhen clicked\nforever\npoint towards mouse pointer\n```\n\
    \n+ 点击舞台顶部的绿色标志来启动（运行）猫应该旋转面向鼠标指针。如果不是，请检查你的脚本。\n\n不断重复模块\n\n"
