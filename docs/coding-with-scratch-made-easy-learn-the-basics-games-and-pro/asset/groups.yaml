    \ at x: -180, y: -120.\n\n![](img/b061febeb032d536c8c7de6511458796_65_2.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_65_3.png)\n\nAdd the blocks below to\
    \ the end of the melon's script. Use the and block to ensure that the action in\
