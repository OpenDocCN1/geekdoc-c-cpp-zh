    # 答案 | 111


    - 1. 画一条线将每个画笔积与其正确的含义连接起来。


    ![](img/b061febeb032d536c8c7de6511458796_112_0.png)


    - 2. 如果你复制了 Ball2，新的角色将被命名为 Ball3。

    - 3. 如果你在 `go to Ball2` 和 `pen up` 积之间添加这两个额外的 `go to` 积，这三个球就会画出三角形。


    ![](img/b061febeb032d536c8c7de6511458796_112_1.png)


    - 4. 要让线条颜色变化的速度快十倍，请将 `change pen color by` 积中的 `1` 改为 `10`。

    - 5. 如果你在 `change pen color by` 积的下方添加一个 `change shade by 10` 画笔积，它会同时改变亮度和颜色，使图片变成条纹状。

    - 6. 如果你勾选每个球的 `Speed` 变量复选框，两个球的名字和速度将在舞台上移动。你会注意到它们移动的速度不同，因为每个球都有自己的变量副本。亲自试一下看看吧。


    # 术语表


    - 动画 (animation): 通过快速切换图片使物体在屏幕上看起来在移动。

    - 背景 (backdrop): 舞台上角色背后的图片。

    - 调试 (debug): 移除错误；找到并修复程序中的错误。

    - 操作系统 (OS): 控制电脑上一切的程序，例如 OS X 或 Windows。

    - 背包 (backpack): 在 Scratch 项目之间复制内容的方法。

    - 事件 (event): 计算机上发生的事情，例如鼠标点击。

    - 运行 (run): 启动程序。

    - 积 (block): Scratch 中的指令。积木可以组合在一起。

    - 输入 (input): 进入程序的数据数据；例如来自键盘的数据。

    - 脚本 (script): 按顺序排列的一系列指令栈。

    - 漏洞 (bug): 程序中的错误。这个词源于是因为昆虫进入了第一批计算机的布线，导致了错误。

    - 角色 (sprite): 舞台上的图片，脚本可以移动和改变它。

    - 库 (library): 角色、声音或服装的集合。

    - 舞台 (stage): 包含角色的区域，Scratch 项目运行的地方。

    - 条件 (condition): 用于在计算机程序中决策的“真或假？”问题。

    - 循环 (loop): 让其他指令重复执行的指令。

    - 字符串 (string): 程序员用于包含单词的数据术语。

    - 程序 (program): 告诉计算机做什么的指令列表。

    - 变量 (variable): 程序中用于存储数据的地方。变量总有一个名称和一个值。

    - 服装 (costume): 角色在舞台上显示的图片。

    - 运算符 (operator): 从数据计算结果的积木，例如将两个数字相加。

    - 数据 (data): 信息——例如数字或单词。


    > 给家长的建议

    帮助您的孩子逻辑性地解决任何困难。对于明显的错误，例如脚本中交换了相似的积木。还要检查脚本是否控制了正确的角色。不要忘记使用 Scratch 应该是很有趣的。Scratch
    网站由马诸塞理工学院（MIT）运行，旨在供儿童安全使用。亲自尝试一下吧！


    ![](img/b061febeb032d536c8c7de6511458796_113_0.png)


