    做得好！你构建了你的第一个 Scratch 项目！点击 File 菜单并选择 Save 或 Save All 来保存。


    ## Scratch 谜题


    我们为猫挑选了一些区块进行尝试。从每个区块连到猫将执行的操作的正确图片。


    ![](img/b061febeb032d536c8c7de6511458796_16_8.png)


    ## 动起来！


    现在该采取行动了。让我们使用深蓝色区块让猫动起来。Scratch 以“步”为单位测量距离。舞台宽480步，高360步。有一个区块可以防止角色卡在墙上。它们只会从墙上弹回来！


    - 你将学习：

    - 如何让角色移动

    - Scratch 以步数测量距离

    - 如何保持角色直立


    ## 让猫动起来


    开始一个新项目。点击舞台上方的 File 并选择 New。添加这个脚本并思考区块的作用。


    ![](img/b061febeb032d536c8c7de6511458796_17_0.png)


    点击绿旗运行脚本。猫会向右移动一小。尝试几次。


    ![](img/b061febeb032d536c8c7de6511458796_17_1.png)


    点击 move 区块中的 10 并输入 100。现在猫每次移动的距离要远得多。尝试不同的步数进行实验。


    ![](img/b061febeb032d536c8c7de6511458796_17_2.png)


    ## 在墙上反弹


    现在将你的脚本改为这样。阅读脚本。你认为它会做什么？forever 区块重复内部的区块——永远！if on edge, bounce 让猫在舞台边缘转弯。


    ![](img/b061febeb032d536c8c7de6511458796_17_3.png)


    运行新脚本。猫现在会在舞台上向右跑，再向左跑。实验——每次移动的步数越多，猫跑得越快。


    ![](img/b061febeb032d536c8c7de6511458796_17_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_17_5.png)


