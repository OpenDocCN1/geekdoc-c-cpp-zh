- md: "\n# 50 | Games\n\n## Ghost h-nunt\n\nThings get spooky in this game! You're\
    \ a witch on a broomstick flying around the city at night in search of friendly\
    \ ghosts. Ghost Hunt will put your keyboard skills to the test!\n\nThe score and\
    \ time left in the game are shown in\n\nThe ghost glides ever across the screen\n\
    \nUse the green flag and red button to start and stop the game\n\n![](img/b061febeb032d536c8c7de6511458796_51_0.png)\n\
    \nYou can move the witch anywhere on the screen using the arrow keys on the keyboard\n\
    \n## Playing the game\n\nUse the arrow keys to make the witch chase the ghost.\
    \ When you touch the ghost, it disappears with a pop and you score a point. But\
    \ the sneaky ghost can reappear anywhere, and it floats randomly around the stage!\
    \ You have 30 seconds to score as many points as you can.\n\n## Good-bye Scratch\
    \ Cat, hello witch!\n\nThe player's sprite for this game will be the witch. You\
    \ won't need Scratch Cat on the stage, so it's best to delete him.\n\n- Start\
    \ a new project. Click on the File menu and select New. Call the project 'Ghost\
    \ Hunt.' As usual, you'll see Scratch Cat on the stage.\n- Go to the sprite list.\
    \ Right-click on the cat with the computer mouse. Choose delete from the pop-up\
    \ menu.\n\n![](img/b061febeb032d536c8c7de6511458796_52_0.png)\n\n![](img/b061febeb032d536c8c7de6511458796_52_1.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_52_2.png)\n\nClick on the sprite symbol\
    \ at the top of the sprite list to go to the library. Select the 'Witch' sprite\
    \ and click OK to load her into your game.\n\n![](img/b061febeb032d536c8c7de6511458796_52_3.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_52_4.png)\n\n![](img/b061febeb032d536c8c7de6511458796_52_5.png)\n\
    \n## New skill: Coordinates\n\nScratch uses a pair of numbers called x-y coordinates\
    \ to pinpoint a sprite's position on the stage. The x coordinate tells you where\
    \ the sprite is across the stage, left or right. The y coordinate shows its up\
    \ or down position. The coordinates will be positive for right and up, and negative\
    \ for left and down. In Ghost Hunt, you'll use coordinates to send sprites to\
    \ different parts of the stage.\n\n![](img/b061febeb032d536c8c7de6511458796_52_6.png)\n\
    \n- The x coordinate is always written first\n- The y axis goes from -180 to 180\n\
    - The x axis goes from -240 to 240\n\nWith the witch selected, build this script\
    \ so that you can use the arrow keys to move her around the stage.\n\n- The light\
    \ blue Sensing blocks detect when the arrow keys are pressed\n- This block moves\
    \ the witch 10 steps down (-10)\n- The forever loop makes the script check repeatedly\
    \ for key presses\n- All the if-then blocks must be inside the forever loop.\n\
    \n![](img/b061febeb032d536c8c7de6511458796_53_0.png)\n\nNow run the project. You\
    \ should be able to move the witch all over the stage using the four arrow keys.\
    \ If it doesn't work, check that you have all the correct blocks and that they\
    \ are all in the right place.\n\n![](img/b061febeb032d536c8c7de6511458796_53_1.png)\n\
    \n## A ghost in the city\n\nIt's nearly time to introduce the friendly ghost and\
    \ get it gliding around the stage. But first, add some scenery to make the game\
    \ look good.\n\n- When an arrow key is pressed, moves 10 steps in direction\n\
    - Click OK to load it into the project\n- Go to the stage info area and click\
    \ on the first symbol (Choose backdrop from library). Select \"night city\" in\
    \ the library and hit OK to load it into your project.\n- Click here to open the\
    \ backdrop library\n\n![](img/b061febeb032d536c8c7de6511458796_53_2.png)\n\n##\
    \ Games | 53\n\nClick on the sprite symbol at the top of the sprite list to open\
    \ the sprite library. Then select \"Ghost1\" and click OK to add it to your project.\n\
    \n## Random numbers\n\nA random number is one you can't guess in advance. In games,\
    \ like rolling dice, you can use random numbers to make the action difficult to\
    \ predict.\n\nNext, build the script below in Ghost1's script area. This script\
    \ uses randomly chosen to make the ghost float unpredictably around the stage.\
    \ Run the script.\n\n![](img/b061febeb032d536c8c7de6511458796_54_0.png)\n\n```\n\
    when clicked\nshow\nforever\nglide 1 secs to x: pick random -200 to 200\ny: pick\
    \ random -150 to 150\n```\n- Makes the ghost appear at the start of the game\n\
    - Scratch picks random numbers from within this range\n- The glide block moves\
    \ the ghost smoothly to the new x-y position\n- The forever loop makes the ghost\
    \ change direction every second\n\n## Time's running out!\n\n## Scoring, timing,\
    \ and music\n\nAt the moment, you have two sprites and a nice backdrop. To turn\
    \ this project into a game, you need to set up a scoring system and a time limit.\
    \ Adding some music will help make the game fun.![](img/b061febeb032d536c8c7de6511458796_54_1.png)\n\
    \nSelect the witch, then go to the orange Data section. Create two variables for\
    \ all sprites and call them \"Score\" and \"Time.\" Leave their boxes checked\
    \ so they show on the stage during the game.\n\nNow add this script to the witch\
    \ sprite. It sets the score to zero at the start of the game. Then it counts down\
    \ 30 seconds and ends the game.\n\n```\nwhen clicked\nset Score to 0\nset Time\
    \ to 30\nrepeat 30\nwait 1 secs\nchange Time by -1\n```\n- Score always starts\
    \ from 0\n- Script waits here\n\n## 54 Games\n\n11 Make this extra script for\
    \ the ghost. It adds a point to the score every time the witch touches the ghost.\
    \ It vanishes with a pop, but then reappears somewhere else.\n\n```\nwhen clicked\n\
    forever\n  wait <touching Witch ?>\n  change Score by 1\n  play sound pop\n  hide\n\
    \  wait 2 secs\n```\n- Plays pop sound when ghost disappears\n- Makes the ghost\
    \ wait a short time before reappearing\n\n```\ngo to x: pick random -200 to 200\n\
    y: pick random -150 to 150\n```\n\n12 Run the game. You'll probably find that\
    \ sprites are so big they bump into each other too easily, especially in the middle\
    \ of the stage. To help this, add these two scripts. The first is for the witch,\
    \ the second is for the ghost. Sends the ghost to a random position on the stage.\n\
    \n![](img/b061febeb032d536c8c7de6511458796_55_0.png)\n\n```\nwhen clicked\ngo\
    \ to x: 0 y: -140\nset size to 50\n```\n- Starts the witch at the bottom of the\
    \ stage\n\n```\nwhen clicked\nset size to 50\n```\n- Makes the witch sprite her\
    \ normal size\n- Reduces ghost's size by half\n\n13 For the final touch, add some\
    \ music. Select the witch sprite, go to the sound library, and load \"dance magic.\"\
    \ Add this script to loop the music.\n\n14 Run the game again. You should find\
    \ that it's more of a challenge now. Play it with your friends—who can catch the\
    \ ghosts?\n\n```\nwhen clicked\nforever\n  play sound dance magic until done\n\
    ```\n- The music plays nonstop while the game runs![](img/b061febeb032d536c8c7de6511458796_55_2.png)\n\
    \n## Show what you know\n\nYou're a top ghost hunter, but do these brainteasers\
    \ spook you?\n\n- 1. Which order are coordinates written in, (x, y) or (y, x)?\
    \ ....................................\n- 2. What are the coordinates of the black\
    \ x's on this picture of the stage? ....................................\n  A.\
    \ ( __ , __ ) B. ( __ , __ ) C. ( __ , __ ) D. ( __ , __ )\n\n![](img/b061febeb032d536c8c7de6511458796_56_0.png)\n\
    \n- 3. Add x's to the stage at these coordinates and label them a, b, c, and d:\n\
    \  a. (100, 0)\n  b. (0, 50)\n  c. (-100, -100)\n  d. (-200, -50)\n\n- 4. In which\
    \ direction do these blocks move a sprite: up, down, left, or right?\n  ```\n\
    \  change x by 100\n  ```\n  ```\n  change y by -150\n  ```\n  ```\n  change y\
    \ by 50\n  ```\n  ```\n  change x by -200\n  ```\n\n- 5. Circle the block that\
    \ moves a sprite smoothly to a particular x–y position.\n  ```\n  go to x: 0 y:\
    \ 0\n  ```\n  ```\n  glide 1 secs to x: 0 y: 0\n  ```\n  ```\n  change x by 10\n\
    \  ```\n\n- 6a. How would you make the ghost speed up? ....................................................\n\
    - 6b. How would you slow down the witch? ....................................................\n\
    \n7. Where would you put a point in direction 90 block and point in direction\
    \ –90 block in the witch's main script to make her face the correct way when you\
    \ press the right and left arrow keys? Try out your ideas.\n"
  mdcn: "\n\n# 50 | 游戏\n\n## 幽灵猎手 (Ghost Hunt)\n\n这款游戏变得诡异起来！你是一个骑着扫帚的女巫，晚上在城市中穿梭，寻找友好的幽灵。“幽灵猎手”将考验你的键盘技巧！\n\
    \n游戏中的得分和剩余时间显示在\n\n幽灵在屏幕上不断滑过\n\n使用绿色旗帜和红色按钮开始和停止游戏\n\n![](img/b061febeb032d536c8c7de6511458796_51_0.png)\n\
    \n你可以使用键盘上的方向键让女巫在屏幕任意地方移动\n\n## 玩游戏\n\n使用方向键让女巫追逐幽灵。当你触碰到幽灵时，它会随着“砰”的一声消失，并给你一分。但狡猾的幽灵可能会在任何地方重新出现并在舞台上随机漂浮！你有\
    \ 30 秒的时间尽可能获得高分。\n\n## 再见了 Scratch 小猫，你好，女巫！\n\n这个游戏的玩家角色将是女巫。你不需要在舞台上使用小猫，所以最好把它删掉。\n\
    \n- 创建一个新项目。点击“文件”菜单并选择“新建”。将项目命名为“Ghost Hunt”。像往一样，你会看到 Scratch 小猫出现在舞台上。\n-\
    \ 进入角色列表。用电脑鼠标右键点击小猫。在弹出的菜单中选择“删除”。\n\n![](img/b061febeb032d536c8c7de6511458796_52_0.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_52_1.png)\n\n![](img/b061febeb032d536c8c7de6511458796_52_2.png)\n\
    \n点击角色列表顶部的角色符号进入库。选择“女巫”（Witch）角色并点击“确定”将其加载到你的游戏中。\n\n![](img/b061febeb032d536c8c7de6511458796_52_3.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_52_4.png)\n\n![](img/b061febeb032d536c8c7de6511458796_52_5.png)\n\
    \n## 新技能：坐标\n\nScratch 使用一对数字称为 x-y 坐标，用来精确定角色在舞台上的位置。x 坐标告诉你角色在舞台上的横向位置（左或右）。y\
    \ 坐标显示它的上下位置。右侧和上方坐标为正数，左侧和下方为负数。在“幽灵猎手”中，你将坐标将角色发送到舞台的不同部分。\n\n![](img/b061febeb032d536c8c7de6511458796_52_6.png)\n\
    \n- x 坐标总是先写\n- y 轴范围从 -180 到 180\n- x 轴范围从 -240 到 240\n\n在选中女巫的情况下，构建此脚本，以便你可以使用方向键让她在舞台上移动。\n\
    \n- 浅蓝色的“感应”模块块检测方向键是否被按下\n- 此模块块让女巫向下移动 10 步 (-10)\n- “重复”循环让脚本反复检查按键按下\n- 所有“如果-那么”模块块必须放在“重复”循环内部。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_53_0.png)\n\n现在运行项目。你应该能够使用四个方向键让女巫在整个舞台上移动。如果不起作用，请检查你是否拥有所有正确的模块，以及它们是否都处于正确的位置。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_53_1.png)\n\n## 城市里的幽灵\n\n是时候引入友好的幽灵并让它在舞台上滑行了。但首先，添加一些场景让游戏看起来更好。\n\
    \n- 当按下方向键时，沿方向移动 10 步\n- 点击“确定”将其加载到项目\n- 进入舞台信息区域并点击第一个符号（从库中选择背景）。在库中选择“夜城”（night\
    \ city）并按“确定”将其加载到你的项目中\n- 点击此处打开背景库\n\n![](img/b061febeb032d536c8c7de6511458796_53_2.png)\n\
    \n## 游戏 | 53\n\n点击角色列表顶部的角色符号打开角色库。然后选择“Ghost1”并点击“确定”将其添加到你的项目中。\n\n## 随机数\n\n\
    随机数是你无法提前预测的数字。在游戏中（例如掷骰子），你可以使用随机数来让动作变得难以预测。\n\n接下来，在 Ghost1 的脚本区域构建以下脚本。此脚本使用“随机选择”让幽灵在舞台上不可预测地漂浮。运行该脚本。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_54_0.png)\n\n```\n当点击时\n显示\n重复\n滑行\
    \ 1 秒到 x: 随机的 -200 到 200\ny: 随机的 -150 到 150\n```\n- 让幽灵在游戏开始时出现\n- 随机选取范围内的数字\n\
    - 滑行模块让幽灵平滑移动到新的 x-y 位置\n- 重复循环让幽灵每秒改变方向\n\n## 时间快到了！\n\n## 评分、计时和音乐\n\n目前你有两个角色和一个漂亮的背景。为了让这个项目变成一个游戏，你需要评分系统和时间限制。添加一些音乐会让游戏变得有趣![](img/b061febeb032d536c8c7de6511458796_54_1.png)\n\
    \n选择女巫，进入橙色的“变量”部分。创建两个变量并命名为“分数”（Score）和“时间”（Time）。勾选它们的复选框以便它们在舞台上显示。现在为女巫添加此脚本。在开始时将分数设置为零。\n\
    \n```\n当点击时\n设置分数为 0\n设置时间为 30\n重复 30\n等待 1 秒\n将时间增加 -1\n```\n- 分数始终从 0 开始\n-\
    \ 脚本在此等待\n\n## 54 游戏\n\n运行游戏。你可能会发现角色太大，很容易互相碰撞。现在和你的朋友一起玩——看谁能抓到幽灵？\n\n```\n\
    当点击时\n重复\n  如果 <碰到幽巫?>\n    将分数增加 1\n    播放[砰]声音\n    隐藏\n  等待 2 秒\n```\n- 音乐在游戏运行期间持续播放\n\
    - 当幽灵消失时播放“砰”的声音\n- 让幽灵在重新出现前等待一小会儿\n\n```\n当点击时\n滑行 1 秒到 x: 随机的 -200 到 200\n\
    y: 随机的 -150 到 150\n```\n- 让幽灵在游戏开始时出现\n- 随机选取范围内的数字\n- 滑行模块让幽灵平滑移动到新的 x-y 位置\n\
    - 重复循环让幽灵每秒改变方向\n\n```\n当点击时\n重复\n  播放[舞蹈魔法]声音直到完成\n```\n- 音乐在游戏运行期间不断播放\n\n![](img/b061febeb032d536c8c7de6511458796_55_2.png)\n\
    \n## 展示你的知识\n\n你是一个顶级的幽灵猎手，但这些脑筋急转弯难倒你吗？\n\n- 1. 坐标的顺序是 (x, y) 还是 (y, x)？......................\n\
    - 2. 图中黑色 x 的坐标是多少？......................\n  A. ( __ , ) B. ( __ , ) C. ( __ ,\
    \ ) D. ( __ , )\n\n![](img/b061febeb032d536c8c7de6511458796_56_0.png)\n\n- 3.\
    \ 在舞台这些坐标处添加 x 并标记为 a, b, c, d：\n  a. (100, 0)\n  b. (0, 50)\n  c. (-100, -100)\n\
    \  d. (-200, -50)\n\n- 4. 这些模块块向哪个方向移动角色：上、下、左还是右？\n  ```\n  change x by 100\n\
    \  ```\n  ```\n  change y by -150\n  ```\n  ```\n  change y by 50\n  ```\n  ```\n\
    \  change x by -200\n  ```\n\n- 5. 圈出让角色平滑移动到特定 x–y 位置的模块。\n  ```\n  go to x:\
    \ 0 y: 0\n  ```\n  ```\n  glide 1 secs to x: 0 y: 0\n  ```\n  ```\n  change x\
    \ by 10\n  ```\n\n- 6a. 你如何让幽灵加速？......................\n- 6b. 你如何让女巫减速？......................\n\
    \n7. 你应该在女巫的主脚本中哪里放置“面向 90 度”模块块和“面向 -90 度”模块块，以便在按下左、右方向键时面朝正确的方向？尝试你的想法。\n\n"
