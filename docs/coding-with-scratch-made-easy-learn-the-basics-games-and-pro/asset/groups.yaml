    # Countdown cat


    Time to see some variables in action.

    Start a new project.


    In the orange Data section, create two variables called count and message.

    Always give your variables names that explain what''s stored in them.


    Add this script. Make sure you drag the little orange blocks with count and message
    on them into the windows of the say blocks. Don''t type the words into the say
    block windows. If you do, the cat will say the variable''s name rather than what''s
    stored in the variable.


    Read the script. You can work out what''s going to happen? Now run the script.


    Experiment with the numbers and text in the script. Can you make the cat count
    up instead of down?


    ![](img/b061febeb032d536c8c7de6511458796_30_0.png)


    ![](img/b061febeb032d536c8c7de6511458796_30_1.png)


