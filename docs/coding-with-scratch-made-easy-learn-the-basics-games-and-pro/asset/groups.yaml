    when green flag clicked and add it to the top of the forever block. Read the script
    through. What do you think it does?


    ![](img/b061febeb032d536c8c7de6511458796_42_3.png)


    > Reminder: Forever loops

    Loops are sections of code that repeat again and again. A forever loop repeats
    the blocks inside it—forever! In your script to control the cat, the forever loop
