    # 答案


    # 词表与给家长的说明


    # 什么是 Scratch？


    计算机没有像你一样的大脑，所以你想做的每件事都必须分解成称为程序的简单指令。给计算机下指令被称为编程或编码。


    - 你将学习：

    - 为了完成任务，计算机需要称为程序的指令

    - Scratch 是开始编程的好地方

    - Scratch 项目的元素有

    ![](img/b061febeb032d536c8c7de6511458796_7_0.png)


    ## 计算机理解什么？


    计算机指令必须按照计算机理解的单词和规则来编写。这些单词和规则构成了“编程语言”。有很多不同的编程语言，许多有趣的名字，例如 JavaScript、C++
    和 Python。


    程序是给计算机的指令列表

    ![](img/b061febeb032d536c8c7de6511458796_7_1.png)


    ## 什么是 Scratch？


    Scratch 是一种初学者易用的计算机编程语言。在 Scratch 中，程序通过鼠标连接积木块制作。这些积木块告诉屏幕上的角色做什么。Scratch 是免费、安全且有趣的实验工具。积木块像拼图一样组合在一起。


    ## Scratch 项目


    通过 Scratch，你可以制作自己的互动故事、动画、音乐和艺术。Scratch 拥有大量的图形和声音集合（“库”），以及你可以玩的角色和背景。让你的想象力飞翔——你将学会所需的编码技能！


    > 我们可以发出很多声音！


    ![](img/b061febeb032d536c8c7de6511458796_7_2.png)


    # Scratch 项目由什么组成？


    这是一个 Scratch 项目。把它想象成一出戏。动作发生在名为“舞台”的区域。“演员”（角色）由指令列表（脚本）控制。背景的后面是“场景”，是可以更改的。


    ![](img/b061febeb032d536c8c7de6511458796_8_0.png)


    - 点击绿色旗帜运行（启动）程序

    - 背景（背景图片）

    - 点击红色按钮停止程序

    - 添加脚本让鲨鱼角色移动

    - 角色用于我们想要移动或控制的所有对象


    这是舞台


    ```

    when clicked

    forever

    next costume

    wait 0.25 secs

    move 10 steps

    if edge, bounce

    ```


    # 角色的脚本


    这是一个脚本示例。它让鲨鱼角色在舞台上弹跳，开合嘴巴。每个积木块都给角色一个指令。积木块可能会告诉角色移动、改变外观、在气泡中说话、对其他角色做出反应或发出声音。


    # 你知道什么


    填空以练习 Scratch 的核心语言。


    1. 一个 ................................ 是 Scratch 中的一组指令（程序）。

    2. 在项目中执行动作的对象被称为 ....................................

    3. 在 Scratch 项目中，动作发生在 ....................................

    4. 启动程序被称为 .................................................它。

    5. 声音或图形的集合被称为 ....................


    # 获取 Scratch


    你可以在 Scratch 网站上在线编程，但如果你不是总是连接互联网，就可以将其安装在计算机上。请一位大人帮助你。你需要较新版本的 Scratch 2.0，而不是旧的
    Scratch 1.4。


    - 你将学习：

    - 你需要 Scratch 2.0

    - 如何使用 Scratch

    - 如何加入 Scratch 网站

    - 如何保存你的项目


    ![](img/b061febeb032d536c8c7de6511458796_9_0.png)


    # 在线使用 Scratch


    如果你注册了 Scratch 账户，就可以在线保存项目并与朋友分享。


    1. 注册 Scratch

    访问 scratch.mit.edu 并加入 Scratch 获取如何注册的说明。你需要拥有电子邮件地址的成人许可。


    2. 在 Scratch 中创建

    想使用 Scratch 时，访问 Scratch 网站并点击创建。这将打开 Scratch 编辑器窗口。


    > 点击此文件查看你的项目


    3. 保存项目

    如果你登录 Scratch 账户，项目会自动保存。你可以通过点击屏幕右上带有“S”字母的文件来查看已保存的项目。


    来自 Scratch 猫猫的小贴士

    需要“右键点击”但鼠标只有一个按钮？通常你可以在点击时按住键盘上的控制 (CTRL) 键或 Shift 键。不起作用？那就请教计算机所有者。


