    # 项目


    进饭时间到！你的宠物肚子咕咕叫。你需要为它画一些食物来吃，并画一个嘴巴，这样你的宠物就能“嘎嚓”一下把食物吃掉了。


    再次点击“画一个新角色”来画一个食物角色。它可以是狗的骨头、马的胡萝卜，或者是兔的生菜。将角色居中（参见步骤 9），然后为它重命名。


    将棕色的`广播消息`和`等待`积木拖到食物角色的脚本中。点击窗口中的箭头，从下拉菜单中选择“新消息”。 然后在弹出框中输入“Eat”。点击确定。


    ![](img/b061febeb032d536c8c7de6511458796_91_0.png)


    在这里输入“Eat”


    ![](img/b061febeb032d536c8c7de6511458796_91_1.png)


    为食物角色（在此情况下是骨头）构建此脚本。运行项目。当你把食物拖到图片上时，脚本应该让食物消失并向嘴巴角色发送“Eat”消息。（接下来我们将制作嘴巴角色。）


    - 将食物发送到舞台的右下角

    - 此积木会让食物一直留在角落，直到你用鼠标指针将其“捡起”


    ![](img/b061febeb032d536cc8c7de6511458796_91_2.png)


    - 让食物粘附在鼠标指针上，直到你松开嘴巴按钮

    - 当食物碰到图片时，这些积木会隐藏食物，发送消息“Eat”，并等待嘴巴响应


    ![](img/b061febeb032d536c8c7de6511458796_91_3.png)


    # 项目 | 91


    20 现在再画另一个新角色——宠物的嘴巴。这个角色可以只是嘴巴的形状。如果你擅长画角色，可以尝试添加牙齿和舌头。重命名角色并将其拖到图片上的相应位置。


    ![](img/b061febeb032d536c8c7de6511458796_92_0.png)


    > 你的牙齿真漂亮！


    ![](img/b061febeb032d536c8c7de6511458796_92_1.png)


    - 当你的角色出现在角色列表中时，重命名它


    ![](img/b061febeb032d536c8c7de6511458796_92_2.png)


    - 点击“声音”标签页下的扬声器将带你进入声音库


    ![](img/b061febeb032d536c8c7de6511458796_92_3.png)


    21 让我们给嘴巴添加一个可以吃的食物。选中嘴巴后，进入“声音”标签页并点击“从库中选择声音”（扬声器符号）。在库中选择“chomp”，然后点击确定。


    | 脚本 | 造型 | 声音 |

    |---|---|---|

    | 新声音： | | |


    22 为嘴巴构建此代码。当脚本接收到消息“Eat”时，它会播放东西的声音，并让嘴巴看起来像在吞下食物（食物消失）。恭喜你——你完成了“宠物派对”！点击绿旗试试看。为什么不制作你自己的功能并添加到项目中呢？


    # 新技能：消息


    Scratch 角色可以使用消息来相互“对话”。


    ```

    当我收到 Eat

    ```


    此积木广播（发送）一条消息，告诉其他角色执行某些事。


    ```

    广播 Eat 并等待

    ```


    此积木告诉其他角色执行某些事，但会等待它们完成后再继续。


    ![](img/b061febeb032d536c8c7de6511458796_92_4.png)


    - 点击箭头并选择“Eat”


    ```

    when I receive

    go go to

    repeat 5

    play sound chomp

    hide

    wait 0.1 seconds

    show

    wait 0.1

    ```


    - 点击箭头并选择“chomp”

    - 在`wait`积木的窗口中输入“0.1”


    ```

    当我收到 Eat

    ```


    此积木在接收到特定的广播消息时，运行其下方的任何脚本。


    ![](img/b061febeb032d536c8c7de6511458796_92_5.png)


    # 项目


    展示你的知识

    你的宠物已经准备好派对了——但你准备好接受这个测试了吗？


    1. `当我收到`积木只有在收到来自 ............................................ 积木的消息时才会运行其下方的脚本。

    2. ............................ 是你画新角色的地方。

    3. 你可以使用 ............................ 和 ............................ 工具来调整角色的大小。

    4. 哪个积木让角色从舞台上消失？...................................

    5. 如果你在画画编辑器中这样画眼睛，当你运行它的脚本时会发生什么？在 Scratch 中尝试你的想法。


    ![](img/b061febeb032d536c8c7de6511458796_93_0.png)


    - a. ....................................................................................................................

    - b. ....................................................................................................................

    - c. ....................................................................................................................

    6. 你在`移到 x:y:`积木中使用坐标将角色放置在舞台上。画线条将这些角色连接起来。


    ![](img/b061febeb032d536c8c7de6511458796_93_1.png)


    7. 你如何为狗角色添加一个短脚本，让它在被点击时会叫？


    # 跳动绘画


    Scratch 有一种神奇的画笔，可以在角色任何地方画线。在这个项目中，你将创建两个在舞台上跳动的球。你将学习到：

    - Scratch 有一种画笔可以在角色移动时画线

    - 局部变量让角色副本存储不同的数据


    这个项目看起来极了！两个球在舞台上跳动。每当球移动时，它们之间就会画一条彩色的线


    ![](img/b061febeb032d536c8c7de6511458796_94_0.png)


    - 线条每次变化以产生彩色的图案

    - 深色或黑色的背景显示效果最好

    - 你只需点击绿旗让球动起来。它们总是以随机的速度和方向开始，所以永远不会重复图案。过一段时间，屏幕填满了，所以项目有一个脚本来清除舞台。


    # 94 项目


    球跳动起来！我们将从让球在舞台上跳动开始。我们现在还不画图案——稍后再处理。

    - 开始一个名为“跳动绘画”的项目。删除猫角色，然后从库加载“Ball”角色。


    ![](img/b061febeb032d536c8c7de6511458796_95_0.png)


    - 进入“变量”积木并点击“创建变量”。在弹出框中输入“Speed”。选择“此角色”，然后点击确定。在数据部分，取消勾选复框让它不显示在舞台上。


    ![](img/b061febeb032d536c8c7de6511458796_95_1.png)


    - 为此球制作此脚本。点击广播积木的箭头并选择新消息。在弹出框中输入“Go”并点击确定。


    ![](img/b061febeb032d536c8c7de6511458796_95_2.png)


    - 点击这里并选择“Go”

    - 重置球

    - 为此角色设置随机速度


    ![](img/b061febeb032d536c8c7de6511458796_95_3.png)


    现在为球构建此脚本。它由“Go”消息触发，并让球不停跳动。


    - 选取随机方向

    - 让球一直跳动


    ![](img/b061febeb032d536c8c7de6511458796_95_4.png)


    你为单个角色创建一个变量，然后复制角色，每个角色都有自己的版本。两个版本可以不同，允许球以不同的速度移动。程序员将此称为“局部变量”。


    # 局部变量


    画线条，整理


    下一个任务是在球之间画彩色的线。然后我们将加深背景。最后，我们将制作一个脚本在舞台填满时清除舞台。


    点击“画一个角色”创建一个新的空角色来画线。将其命名为“Line Draw”。我们不需要使用这个角色，所以我们不画造型！


    将此脚本添加到“Line Draw”角色中。它在两个球之间画一条彩色的线，但每次都会稍微改变线条的颜色。运行项目进行测试。新角色不需要造型。


    ```

    when clicked

    forever

    go to Ball

    down

    go to Ball2

    up

    ```


    - 移动到Ball角色而不画线

    - 在 Line Draw 角色所在处开始画线

    - 停止画线

    - 移动到 Ball2角色，边移动边画


    ```

    change pen color by 1

    ```


    点击舞台信息区域的背景，然后点击“背景”标签页。在画画编辑器中，选择“填充颜色”工具（油桶）。选择一种深色或黑色，然后点击绘图区域进行填充。


    点击这里选择背景


    ![](img/b061febeb032d536c8c7de6511458796_96_0.png)


    完全随机！过一段时间，舞台就会变得杂乱。将此脚本添加到“Line Draw”角色中。它会经常清除舞台，准备好新的图案。点击绿旗查看它是如何运作的。好了——你完成了。该开始画画了！


    每次为线条设置随机的粗细


    ```

    when clicked

    forever

    set pen size to

    pick random 1 to 15

    clear

    broadcast Go

    pick random 15 to 30

    secs

    ```


    清除舞台


    每 15 到 30 秒重置一次绘画


