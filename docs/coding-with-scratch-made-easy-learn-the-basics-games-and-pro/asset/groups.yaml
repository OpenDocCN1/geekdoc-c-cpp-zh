    # Solutions


    # Glossary and Note for parents


    # What is Scratch?


    A computer doesn''t have a smart brain like you, so everything you want to do
    must be broken down into lists of simple instructions called programs. Giving
    instructions to the computer is known as programming, or coding.


    - What you''ll learn:

    - To do tasks, computers need simple instructions called programs

    - Scratch is a great place to start programming

    - What the ingredients of a Scratch project are


    ![](img/b061febeb032d536c8c7de6511458796_7_0.png)


    ## What does a computer understand?


    Instructions for computers have to be written following special rules using only
    words the computer understands. These words and rules make up a "programming language."
    There are lots of different programming languages. Many have funny names, such
    as JavaScript, C++, and Python.


    A program is a list of instructions for the computer


    ![](img/b061febeb032d536c8c7de6511458796_7_1.png)


    ## What is Scratch?


    Scratch is a computer programming language that''s easy for beginners to use.
    In Scratch, programs are made by joining together blocks using the mouse. These
    groups of blocks (called sprites) tell characters on the screen what to do. Scratch
    is free, safe, and fun to experiment with. The blocks fit together like jigsaw
    pieces


    ## Scratch projects


    With Scratch, you can make your own interactive stories, animations, music, and
    art. Scratch has large collections (or "libraries") of graphics and sounds, as
    well as sprites and backdrops that you can play with. Let your imagination run
    wild—you''ll pick up the coding skills you need!


    > We can make lots of sounds!


    ![](img/b061febeb032d536c8c7de6511458796_7_2.png)


    # What makes up a Scratch project?


    Here''s a Scratch project. Think of it like a play. The action takes place in
    an area called the stage. The "actors" (the sprites) are controlled by lists of
    instructions (the scripts). Behind the backdrop is the "scenery," which can be
    changed.


    ![](img/b061febeb032d536c8c7de6511458796_8_0.png)


    - Click the green flag to run (start) a program

    - Backdrop (background picture)

    - Click the red button to stop a program

    - Add a script to make the shark sprite move

    - Sprites are used for all the objects we want to move or control


    This is the stage


    ```

    when clicked

    forever

    next costume

    wait 0.25 secs

    move 10 steps

    if edge, bounce

    ```


    # Scripts for sprites


    This is an example of a script. It makes the shark sprite bounce around the stage,
    opening and closing its mouth. Each block gives an instruction to the sprite.
    A block might tell a sprite to move, change how it looks, talk in speech bubbles,
    react to other sprites, or make a sound.


    # What do you know


    Fill in the spaces to practise the key language of Scratch.


    1. A ................................ is a set of instructions (program) in Scratch.

    2. Objects that perform actions in a project are called ....................................

    3. In a Scratch project, the action takes place on the ....................................

    4. Starting a program is called .................................................
    it.

    5. A collection of sounds or graphics is called a ....................


    # Getting Scratch


    You can code online at the Scratch website, but if you aren''t always connected
    to the Internet, you can install it on your computer. Ask a grown-up to help you.
    You will need the newer Scratch 2.0 for this, not the old Scratch 1.4.


    - What you''ll learn:

    - You need Scratch 2.0

    - How to use Scratch on a computer

    - How to join the Scratch website

    - How to save your projects


    ![](img/b061febeb032d536c8c7de6511458796_9_0.png)


    # Using Scratch online


    If you register for a Scratch account, you will be able to save your projects
    online and share them with friends.


    1. Sign up for Scratch

    Go to scratch.mit.edu and Join Scratch for instructions on how to register. You
    will need to get permission from an adult with an e-mail address.


    2. Create in Scratch

    When you want to use Scratch, go to the Scratch website and click on Create. This
    will open the Scratch editor window.


    > Click on this file to see your saved projects


    ![](img/b061febeb032d536c8c7de6511458796_9_1.png)


    3. Save in Scratch

    Projects save automatically if you''re logged in to your Scratch account. You
    can see your saved projects by clicking on the file with an “S” at the top right
    of the screen.


    ![](img/b061febeb032d536c8c7de6511458796_9_2.png)


    Top tip from Scratch Cat

    Need to “right click” but only have one button on your mouse? Usually you can
    hold down the control (CTRL/ctrl) key or shift key on the keyboard as you click.
    Not working? Then ask the owner of the computer.


    ![](img/b061febeb032d536c8c7de6511458796_9_3.png)


