    \n![](img/b061febeb032d536c8c7de6511458796_65_0.png)\n\nMakes sprite always face\
    \ the same direction.\nWatermelon starts at y: 150 and somewhere between x: -180\
    \ and x: 180.\n\n![](img/b061febeb032d536c8c7de6511458796_65_1.png)\n\nBuild the\
    \ script above for the watermelon.\nAt the start of the game, the melon will sit\
    \ near the top of the stage, at y: 150. But it will take up a random left–right\
