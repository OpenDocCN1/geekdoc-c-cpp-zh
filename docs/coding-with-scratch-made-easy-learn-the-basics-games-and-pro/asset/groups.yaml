    ## 56 | 游戏


    ## 快速反应


    在这个游戏中，两名玩家竞争，看谁的反应速度最快。以闪电般的速度按下按键即可胜。如果你只犹豫一分之一秒，也会尝到失败的苦果！


    - 你将学到：

    - 如何绘制精灵和绘制背景

    - 如何在游戏中使用 Scratch 计时器

    - 如何编写游戏指令并在舞台上显示它们


    玩家 1 的时间显示在这里


    绿色圆圈告诉你哪位玩家赢了


    玩家 2 的时间显示在这里


    ![](img/b061febeb032d536c8c7de6511458796_57_0.png)


    玩家 1 获胜！


    “快速反应”只有一个精灵——一个从红色变成绿色的圆


    ## 玩游戏


    点击绿色旗帜会在舞台上显示指令。每位玩家都有不同的按键要按：玩家 1 按“Z”键，玩家 2 按“M”键。当你准备好玩时，按下空格键。等待红色圆圈变成绿色，然后按得最快的人就会获胜。


    ## 创建大圆圈


    这个游戏中只有一个精灵。这是一个简单的彩色圆圈，你可以使用 Scratch 的画笔编辑器自己绘制。圆圈开始是红色的，告诉玩家在按下之前等待。然后一些魔法会把它变成绿色，信号“开始！”。


