    ## 56 | Games


    ## Rapid reaction


    In this game, two players compete to see who has the fastest reaction time. Hit
    your key with lightning speed to win. If you hesitate for even a fraction of a
    second, you''ll taste defeat!


    - What you''ll learn:

    - How to draw sprites and paint backdrops

    - How to use the Scratch timer in games

    - How to write game instructions and show them on the stage


    Player 1''s time is shown here


    The green circle tells you which player has won


    Player 2''s time is shown here


    ![](img/b061febeb032d536c8c7de6511458796_57_0.png)


    Player 1 wins!


    Rapid Reaction has only one sprite—a circle that turns from red to green


    ## Playing the game


    Clicking the green flag shows the instructions on the stage. Each player has a
    different key to press: Player 1 the “Z” key, Player 2 the “M” key. When you''re
    ready to play, hit the space bar. Wait until the red circle turns green, then
    whoever presses fastest wins the game.


    ## Creating the big circle


    There''s only one sprite in this game. It''s a simple coloured circle that you
    can draw yourself using Scratch''s paint editor. The circle starts off red, telling
    the players to wait before pressing. Then some magic turns it green to signal
    "Go!"


    ![](img/b061febeb032d536c8c7de6511458796_58_0.png)


    Red says

    "Wait!"


    Green says

    "Go!"


    - Start a new project and name it "Rapid Reaction." Click the paintbrush symbol
    at the top of the sprite list to open the paint editor.


    New sprite:

    Click here to

    paint a new sprite


    Circle tool


    - Check that Bitmap Mode is selected in the bottom-right corner of the paint editor.
    Then choose red on the colour palette.


    - Click the circle tool on the left.

    Then select the solid-colour shape (rather than the outline) at the bottom-left
    of the paint editor.


    ![](img/b061febeb032d536c8c7de6511458796_58_1.png)


    The solid-

    colour shape


    Choose red for

    the circle colour


    Should say Bitmap

    Mode here


    ![](img/b061febeb032d536c8c7de6511458796_58_2.png)


    ![](img/b061febeb032d536c8c7de6511458796_58_3.png)


    Bitmap Mode

    Convert to vector


    - While holding down the shift key,

    click and drag with the mouse to

    draw a circle. The circle should be a little

    bigger than the cat. Click outside the circle.

    Look at the stage to compare your circle to

    the cat. When you''re happy with the circle''s

    size, drag it to the centre of the stage. Then

    right-click on the cat and select delete.


    ## New skill: Resizing the circle


    You can use the Shrink and Grow

    tools at the top of the Scratch screen

    to make your circle smaller or bigger.

    Click on the tool and then on the

    thing you want to shrink or grow.


    ![](img/b061febeb032d536c8c7de6511458796_58_4.png)


    See you

    later!


    ![](img/b061febeb032d536c8c7de6511458796_58_5.png)


    Shrink


    Grow


    ## Scripts for the sprites


    You''ll build most of the code for Rapid Reaction in the sprites area of the circle
    sprite. This game uses Scratch''s built-in timer. You can find blocks for the
    timer in the light blue Sensing section.


    In the Data section of the Scripts tab, make three variables for all sprites:
    "Player 1 time," "Player 2 time," and "Presses". Uncheck the checkbox for Presses.


    Add this script to the circle sprite. After hitting the space bar, it records
    how long Player 1 takes to hit the "Z" key. It also checks to see if Player 1
    reacts first.


    "Z" runs the rest of the script


    ![](img/b061febeb032d536c8c7de6511458796_59_0.png)


    ```

    when space key pressed

    wait until

    set Player 1 time to timer

    show variable Player 1 time

    change Presses by 1

    if Presses = then

    say Player 1 wins!

    ```


    Copies the time into the Player 1 time variable, then shows it on the stage


    Adds 1 to Presses variable, which counts the number of key presses


    "Z" is the first key pressed, the script says Player 1 is the winner


    > Reminder: Comparison operators


    In the Operators section are three green blocks that compare what''s in their
    two windows. You can use a comparison operator in an if-then block to decide when
    the blocks inside it run.


    Now build the script to record Player 2''s reaction. It''s almost the same as
    the last script, except that it is triggered by the "M" key and it uses the Player
    2 time variable.


    ```

    when space key pressed

    wait until m pressed

    set Player 2 time to timer

    show variable Player 2 time

    change Presses by 1

    if Presses = then

    say Player 2 wins!

    ```


    Script waits between 3 and 6 seconds after space key is pressed before changing
    the circle''s colour


    ![](img/b061febeb032d536c8c7de6511458796_60_0.png)


    This block from the Looks section changes the red circle to green


    If both players press at the same time, the circle sprite declares a draw


    Resets timer to 0 when circle changes


    ![](img/b061febeb032d536c8c7de6511458796_60_1.png)


    This block stops winning if they press before circle goes green


    Time displays when green flag clicked


    ## Instructions


    So that the players know the rules of Rapid Reaction, you can create a special
    sprite that shows the instructions when the game begins. Cancels the set color
    effect to 0 block Click on the big "T",


