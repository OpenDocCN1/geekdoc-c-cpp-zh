    area and type out the instructions shown on the right.


    ## Who has the quickest reactions?


    When circle goes green:

    Player 1 press Z

    Player 2 press M


    Press space bar to start.![](img/b061febeb032d536c8c7de6511458796_61_0.png)


    You can change the look of the text at this stage by clicking Font at the bottom-left
