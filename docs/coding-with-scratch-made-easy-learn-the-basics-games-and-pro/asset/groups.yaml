    - 你可以阅读 Scratch 来了解它的作用


    ![](img/b061febeb032d536c8c7de6511458796_15_0.png)


    ## Scratch——友好的猫


    首先，在 Scratch 网站上打开编辑器，或者点击电脑上的 Scratch 图标。你会看到猫站在舞台上。让我们做一个脚本来告诉猫做什么。


    ![](img/b061febeb032d536c8c7de6511458796_15_1.png)


    点击 Looks


    - 开始一个新脚本

    我们将通过让编辑器中 Scripts 标签下的猫说“Hello!”来开始


    ![](img/b061febeb032d536c8c7de6511458796_15_2.png)


    - 选择一个 say 区块

    编辑器中间的区块列表会变化。用鼠标点击 say Hello!区块将其拖到脚本区域。


    ![](img/b061febeb032d536c8c7de6511458796_15_3.png)


    - 再次操作！

    将一个 say Hello!区块拖入脚本区域。当区块重叠时释放鼠标，它们像拼图一样锁在一起。


    ![](img/b061febeb032d536c8c7de6511458796_15_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_15_5.png)


    ## 学习基础知识


