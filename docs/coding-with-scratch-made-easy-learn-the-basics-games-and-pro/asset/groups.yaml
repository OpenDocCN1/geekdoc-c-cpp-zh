- md: "\n# Projects\n\n## Play a note\n\nNext, we'll build a second script for Scratch\
    \ Cat. This script will allow us to play notes on musical instruments.\n\n![](img/b061febeb032d536c8c7de6511458796_73_0.png)\n\
    \n- Go to the pink Sound section and drag the \"set instrument\" block into the\
    \ cat's scripts area. This will be the first block of your second script. The\
    \ block in the block's window lets you choose different instruments. Leave it\
    \ set to 1 (the piano) for now.\n\n![](img/b061febeb032d536c8c7de6511458796_73_1.png)\n\
    \n(1) Piano\n(2) Electric piano\n(3) Organ\n(4) Guitar\n(5) Electric guitar\n\
    (6) Bass\n\nThe list goes on: there are 21 instruments to choose from in all\n\
    \n- Add this pink \"play note\" block from the bottom of the Sound section to\
    \ the \"set instrument\" block. It lets you choose which note to play and for\
    \ how long. Keep it set to note 60 and 0.5 beats.\n\n![](img/b061febeb032d536c8c7de6511458796_73_2.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_73_3.png)\n\nNote 60 plays \"Middle\
    \ C\"—the note in the centre of a piano keyboard\n\n- Use your two pink blocks\
    \ to build the second script shown here. You'll find the \"wait until\" block\
    \ and the \"forever\" loop in the yellow Control section. The \"mouse down?\"\
    \ block in the light blue Sensing section.\n\n![](img/b061febeb032d536c8c7de6511458796_73_4.png)\n\
    \nNothing happens until the mouse is clicked down.\n\nPlays Middle C on the piano\
    \ for half a beat.\n\n![](img/b061febeb032d536c8c7de6511458796_73_5.png)\n\n-\
    \ Click the green flag to run the project. The piano should play a note when you\
    \ click with the mouse. If it doesn't, check that your script is correct. Experiment\
    \ by playing different notes of different lengths, and see what other instruments\
    \ sound like.\n\n## Make some music\n\nLet's tweak the main script. The notes\
    \ you play and their loudness (volume) will be controlled by the distance and\
    \ direction from the cat to the mouse-pointer.\n\n### Reminder:\nArithmetic operators\n\
    \nFour blocks in the green Operators section can do math with whatever numbers\
    \ you type into. You can also put variables and other blocks in their windows\
    \ for calculations.\n\nTo understand how directions work on the stage, look at\
    \ the picture below. Scratch describes the direction in which a sprite is facing\
    \ in degrees (°), so our turtle is facing right (90°).\n\n| 7 + 22 | 64 - 28 |\n\
    | :--- | :--- |\n| Add (+) | Subtract (-) |\n| 11 * 10 | 120 / 4 |\n| Multiply\
