    \nDrag into pointed window\n\nI'm ignoring the cat!\n\n![](img/b061febeb032d536c8c7de6511458796_43_5.png)\n\
    \nYou can make your scripts easier to understand by renaming the cat. In the sprite\
    \ list (below the stage), select the cat and click on the blue (i) in its top\
    \ corner. Type \"Cat\" instead of \"Sprite1\" in the window of the sprite's information\
    \ panel.\n\n# Reminder: if-then\n\nAn if-then block wraps around other blocks\
    \ and uses \"true or false?\" question to control when the blocks are run. When\
    \ Scratch reaches an if-then block, it runs the blocks inside only if the answer\
    \ is true.\n\nType \"Cat\" in this window to change the sprite's name\n\nIs the\
    \ ball touching the cat?\n\n![](img/b061febeb032d536c8c7de6511458796_44_0.png)\n\
    \nNow select the soccer ball sprite and put together these blocks to add to your\
    \ script. Place them in the forever loop, after if on edge, bounce. When the ball\
    \ touches the cat, the script plays a pop sound and makes the ball appear to bounce\
    \ off the cat.\n\nThe if-then block checks to see if the ball is touching the\
    \ cat\n\n![](img/b061febeb032d536c8c7de6511458796_44_1.png)\n\nThese blocks \"\
    bounce\" the ball off the cat\n\n![](img/b061febeb032d536c8c7de6511458796_44_2.png)\n\
    \nIf the ball's not touching the cat, the script ignores the instructions inside\
    \ the if-then block\n"
  mdcn: "\n\n# 一个游戏：巨龙！\n\n到目前为止，我们学习了很多 Scratch。现在，让我们把所学整合成一个游戏。你是那只猫。你可以使用电脑鼠标来控制自己在舞台上的位置。尽可能避开那条凶恶的巨龙吧！\n\
    \n- 你将学到：\n- 如何将角色和脚本组合成游戏\n- 如何检测两个角色何时触碰\n- 脚本如何停止\n\n![](img/b061febeb032d536c8c7de6511458796_37_0.png)\n\
    \n# 引入巨龙\n\n向项目添加“Dragon”（龙）角色。为所有角色添加一个变量，并将其命名为 `speed`（速度）。\n\n保持勾选此框\n\n![](img/b061febeb032d536c8c7de6511458796_37_1.png)\n\
    \n# 让巨龙跳起来\n\n在角色列表中选择巨龙并添加此脚本。这是我们之前使用过的弹跳脚本，但有一处微小的变化。我们用变量来控制巨龙的速度，并在每次游戏中都让巨龙向不同的方向出发。阅读并运行脚本。巨龙会在舞台上来来跳去。\n\
    \n运行时让巨龙指向新方向\n\n![](img/b061febeb032d536c8c7de6511458796_37_2.png)\n\n# 鼠标控制小猫！\n\
    \n现在在角色列表中选择猫并添加此脚本。仔细阅读该脚本。它会让小猫“粘”在鼠标指针上。在循环内部，它还会检查我们是否触碰了巨龙。如果是，它就会停止项目——游戏结束！运行脚本检查它是否能正常工作。\n\
    \n等待积木让巨龙远离\n\n如果为真，则停止所有脚本\n\n![](img/b061febeb032d536c8c7de6511458796_37_3.png)\n\
    \n# 学习基础 | 37\n\n一个真正的游戏需要分数和挑战。为所有角色添加一个名为 `score`（分数）的新变量。保持勾选，以便它显示在舞台上。\n\n\
    给猫添加此脚本。阅读它。每避开巨龙 3 秒，你就能得到 1 分。但每当你得分，巨龙的速度就会增加 1！\n\n运行游戏看看它是否符合你的预期。如果不符合，请从头开始检查一切。现在和你的朋友竞争获得最高分吧。为什么不加一个背景和一些音乐呢？\n\
    \n![](img/b061febeb032d536c8c7de6511458796_38_0.png)\n\n```\nwhen clicked\nset\
    \ score to 0\nforever\n  wait 3 secs\n  change score by 1\n  change speed by 1\n\
    ```\n\n![](img/b061febeb032d536c8c7de6511458796_38_1.png)\n\n> 分数越高，巨龙移动得越快\n\n\
    你喜欢 Scratch 吗？\n\n只有当我点击时！\n\n# 展示你的所学\n\n回答测验——会得到高分还是“游戏结束”？\n\n1. 为什么我们要保持\
    \ `score` 变量的勾选框处于选中状态？\n2. 你如何让巨龙在开始时以半速运行？\n3. 你可以在猫的 `forever` 循环中添加哪个积木让它看起来像在走路？\n\
    4. 巨龙有多少个造型？\n5. 如果你在角色列表右键点击巨龙并选择“复制”，会发生什么？\n\n# 游戏\n\n跳动的西瓜、幽灵的鬼魂和踢足球的鱼？让我们开心制作一些游戏吧！\n\
    \n**提醒框（Reminder boxes）**将帮助你记住在上一节掌握的技能，而**新技能框（New Skill boxes）**将你的学习提升一个层次！\n\
    \n![](img/b061febeb032d536c8c7de6511458796_39_0.png)\n\n# 鱼球大战 (Fishball)\n\n\
    你准备好构建 Fishball 你的第一个复杂的游戏了吗？不要担心，你不需要一次性完成。只需按照编号步骤操作，部分地组装项目。\n\n- 你将学到：\n-\
    \ 如何构建简单的脚本来制作游戏\n- 如何添加角色、背景和声音来改进你的游戏\n- 如何追踪时间和分数\n\n游戏中的分数和剩余时间显示在这里\n\n鱼在舞台上跟随球移动\n\
    \n使用绿旗和红色按钮开始和停止游戏。\n\n![](img/b061febeb032d536c8c7de6511458796_41_0.png)\n\n\
    开球点\n\n猫由鼠标指针控制\n\n球会在猫和鱼之间弹跳\n\n进球\n\n# 游戏\n\nScratch 小猫正在踢足球。使用鼠标指针让他在舞台上移动，并将球拨向绿色圆圈得分。但要注意鱼守门员——她会竭尽全力阻止你！\n\
    \n# 控制你的猫！\n\n我们将从创建一个简单的脚本来控制猫角色开始。它会让小猫像胶水一样粘在鼠标指针上！\n\n- 打开 Scratch 编辑器：在 Scratch\
    \ 网站上创建，或者在电脑上点击 Scratch 图标。将项目命名为“Fishball”。\n\n![](img/b061febeb032d536c8c7de6511458796_42_0.png)\n\
    - 在脚本标签页下，进入蓝色的“动作”（Motion）积木区。点击“移动鼠标指针”并将其拖到脚本区域。\n\n![](img/b061febeb032d536c8c7de6511458796_42_1.png)\n\
    - 现在点击黄色的“控制”（Control）积木区并选择 `forever` 积木。将“移动鼠标指针”放在里面。这两个积木组合在一起。\n\n![](img/b061febeb032d536c8c7de6511458796_42_2.png)\n\
    - 接下来，选择棕色的“事件”（Events）积木区。点击“绿旗被点击”并将其添加到 `forever` 积木上方。阅读脚本。你认为它在做什么？\n\n![](img/b061febeb032d536c8c7de6511458796_42_3.png)\n\
    > 提醒：Forever 循环是重复执行的代码。`forever` 循环会重复其内部的积木！在你控制猫的脚本中，`forever` 循环让猫在整个游戏中“粘”在鼠标指针上。\n\
    - 点击舞台顶部的绿旗开始运行脚本。猫应该随着鼠标指针移动。如果没有，检查步骤 1 到 4。\n\n![](img/b061febeb032d536c8c7de6511458796_42_4.png)\n\
    # 游戏\n\n# Scratch 小猫需要一个球\n\n进入角色列表并点击“从库选择”（角色符号）。在库中选择“Soccer Ball”（足球）并点击确定。球将出现在角色列表中。\n\
    \n现在你可以控制猫了，该给它一个球来玩。你需要为球创建一个脚本，让它在舞台上并在猫身上弹跳。\n\n点击角色符号\n\n![](img/b061febeb032d536c8c7de6511458796_43_0.png)#\
    \ 提醒：菜单和窗口\n\n有些积木有一个下拉菜单，例如“碰到？”。点击三角形查看选项。然后选择你想要的那个。\n\n接下来，将这些积木组合在球的脚本区域。记住积木的颜色会告诉你它在面板面板的哪个部分。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_43_1.png)\n配合其他积木，如“旋转”，你点击窗口并输入一个数字。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_43_2.png)\n移动球一段距离\n\n![](img/b061febeb032d536c8c7de6511458796_43_3.png)\n\
    在舞台边缘改变球的方向\n\n点击窗口并输入 `如果...那么` 积木，其中有一个窗口，你可以拖入另一个提问题的积木。\n\n点击绿旗，观察球在碰到舞台边缘时的弹跳。它现在还没有注意猫。绿旗同时启动球和猫的脚本并运行它们。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_43_4.png)\n拖入指向窗口\n\n我在忽略猫！\n\n![](img/b061febeb032d536c8c7de6511458796_43_5.png)\n\
    你可以通过重命名猫来让你的脚本更易理解。在角色列表（舞台下方），选择猫并点击其上角的蓝色 (i)。在角色信息面板的窗口中输入“Cat”而不是“Sprite1”。\n\
    \n# 提醒：如果...那么\n\n`如果...那么` 积木包裹着其他积木并使用“真或假？”的问题来控制积木的运行。当 Scratch 到达 `如果...那么`\
    \ 积木时，只有当答案为真时它才会运行内部的积木。\n\n在此窗口中输入“Cat”来更改角色名称\n\n球碰到猫了吗？\n\n![](img/b061febeb032d536c8c7de6511458796_44_0.png)\n\
    现在选择足球角色并组合这些积木添加到你的脚本中。将它们放在 `forever` 循环中，放在 `如果碰到边缘，弹跳` 之后。当球碰到猫时，脚本会播放“pop”的声音并让球看起来是从猫身上弹开的。\n\
    \n`如果...那么` 积木检查球是否碰到猫\n\n![](img/b061febeb032d536c8c7de6511458796_44_1.png)\n\
    这些积木让球从猫身上“弹开\n\n![](img/b061febeb032d536c8c7de6511458796_44_2.png)\n如果球没有碰到猫，脚本将忽略\
    \ `如果...那么` 积木内部的指令\n\n"
