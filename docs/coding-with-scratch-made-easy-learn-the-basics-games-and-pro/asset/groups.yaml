  - '[PAGE 21]


    # Learn the Basics


    # Loops


    In computer programs, we often want to carry out the same instructions more than
    once. To avoid having to put down the same blocks many times, we can wrap them
    in a loop instruction that repeats the blocks. Meet forever and repeat loops!


    +   * What you''ll learn:

    * How to repeat a group of blocks using a loop

    * The difference between forever and repeat loops

    * How to make some noise in Scratch


    Blocks run in this order:


    # Running down the blocks


    Start a new project and make this script. Read, understand, and run it. It runs
    very quickly and doesn''t much.


    ![](img/b061febeb032d536c8c7de6511458796_21_0.png)


    When we run the script, each block is run in turn top to bottom. First the cat
    turns a little, then the cat''s colour changes to green.


    ![](img/b061febeb032d536c8c7de6511458796_21_1.png)


    # Forever loops


    A loop instruction runs a script in the normal order from top to bottom, but then
    loops back to the top. The loop runs the blocks inside over and over again. Try
    wrapping a forever loop around the blocks from the last script.


    ![](img/b061febeb032d536c8c7de6511458796_21_2.png)


    When the actions finish, the program always goes back to the start of the loop


    Now the cat turns and changes colour each time the blocks in the forever loop
    are repeated.


    Press the red button to stop the loop.


    ![](img/b061febeb032d536c8c7de6511458796_21_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_21_4.png)'
