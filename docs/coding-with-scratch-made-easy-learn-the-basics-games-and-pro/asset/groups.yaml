    # 86 | Projects


    # Pet party


    Give your pet a makeover with this crazy project! Pet Party is a ton of fun, and
    it teaches you some useful Scratch skills—especially how to make your own sprites.


    > What you''ll learn

    - Create sprites

    - Add costumes

    - Use loops

    - Add sounds

    - Draw new costumes


    Get your pet in the party by dragging a colourful hat onto its head.


    Try to paint a mustache on its face.


    ![](img/b061febeb032d536c8c7de6511458796_87_0.png)


    How can you use the brushes for this project?


    The mouth opens to eat food.


    Dog food drops to keep him happy.


    # What you do


    In this project you will draw sprites and use them to add funny features, such
    as silly eyes and a party hat, to a photo of a pet or other animal. You will also
    be able to feed your pet and watch it gulp down food noises.


    # Make some funny features


    Let''s start by giving your pet some big, googly eyes and a fancy party hat to
    wear.


    - First, take a photo of your pet using a camera or a phone. Make it a portrait
    (upright) photo, not a landscape (horizontal) one. Upload the photo from your
    camera or phone to your computer. You may need to ask a parent to help you.


    - Start a new Scratch project called "Pet Party." Go to the sprite list and delete
    Scratch Cat. Then click on Upload sprite from file (the file symbol). Select the
    picture of your pet and click OK. Your pet will appear in the sprite list.


    - If your photo title is just a number, you''ll need to rename your pet. Select
    it and click on the blue (i) in its top corner. Type your pet''s name into the
    window of the sprite''s information panel.


    - Using the mouse, click and drag the photo to the left-hand side of the stage.
