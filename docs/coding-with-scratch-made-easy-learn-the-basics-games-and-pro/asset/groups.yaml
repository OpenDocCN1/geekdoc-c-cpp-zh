    ## Learn the Basics


    Do you know how to build a script, create a loop, and make an animation? Don’t
    worry, in this section you’ll learn all this this and more. Let’s get programming!


    ![](img/b061febeb032d536c8c7de6511458796_13_0.png)


    ## Let’s explore Scratch!


    ![](img/b061febeb032d536c8c7de6511458796_14_0.png)


    ## Your first project


    Time for our first Scratch project. We’re going to create some simple instructions
    to make the cat talk. By moving the coloured blocks around with the mouse, we
    can build a simple program called a script.


    - What you''ll learn:

    - Sprites are controlled by scripts

    - How to build a script from blocks

    - Things in scripts happen one block at a time

    - You can read Scratch to find out what it does


    ![](img/b061febeb032d536c8c7de6511458796_15_0.png)


    ## Scratch—the friendly cat


    First, open the Scratch editor: either choose on the Scratch website or click
    the Scratch icon on your computer. You''ll see the cat standing on the stage.
    Let''s make a script to tell the cat what to do.


    ![](img/b061febeb032d536c8c7de6511458796_15_1.png)


    Click on Looks


    - Start a new script

    We''ll be beginning by getting the cat to say "Hello!" on the purple label under
    the Scripts tab of the editor.


    ![](img/b061febeb032d536c8c7de6511458796_15_2.png)


    - Select a say block

    The list of blocks in the middle of the editor will change. Click with the mouse
    on the say Hello! block and drag it to the scripts area.


    ![](img/b061febeb032d536c8c7de6511458796_15_3.png)


    - Do it again!

    Drag a say Hello! block into the scripts area. Release the mouse button when the
    blocks overlap, so they lock together like jigsaw pieces.


    ![](img/b061febeb032d536c8c7de6511458796_15_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_15_5.png)


    ## Learn the Basics


    Brown block clips on top speech blocks


    ## Completing your script


    Click on Events tab. Drag the top brown block in the list to the right, into the
    scripts area. Hover over the say block, then let go of the mouse. The brown block
    will clip on the purple say blocks.


    ![](img/b061febeb032d536c8c7de6511458796_16_0.png)


    ![](img/b061febeb032d536c8c7de6511458796_16_1.png)


    ![](img/b061febeb032d536c8c7de6511458796_16_2.png)


    Clicking the flag runs the script


    ## Read the whole script


    The script tells us that to start things off we need to click on the green flag
    in the top corner of the stage. This is called “running” the script.


    ![](img/b061febeb032d536c8c7de6511458796_16_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_16_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_16_5.png)


    ## Watch the action


    When you click on the flag, Scratch Cat will say “Hello!” for two seconds. Then
    it will say “Nice day!” for two seconds.


    ![](img/b061febeb032d536c8c7de6511458796_16_6.png)


    ![](img/b061febeb032d536c8c7de6511458796_16_7.png)


    > how the blocks work in order—the cat does each action in turn.


    ## Save it!


    Good job! You''ve built your first Scratch project! Save it by clicking on the
    File menu and choose Save or Save All.


    ## Scratch puzzle


    We''ve picked some blocks for our cat to try out. Draw a line from each block
    to the correct picture of what the cat will do.


    ![](img/b061febeb032d536c8c7de6511458796_16_8.png)


    ## Move it!


    Now for some action. Let''s get our cat moving using the dark blue Blocks. Scratch
    measures distances in “steps.” The stage is 480 steps wide and 360 steps tall.
    There is a block to stop sprites from getting stuck on the walls. They just bounce
    off them!


    - What you''ll learn:

    - How to make a sprite move

    - That Scratch measures distance in steps

    - How to keep sprites the right way up


    ## Let''s move the cat


    Start a new project. Click on File above the stage and select New. Add this script
    and think about what the blocks do.


    ![](img/b061febeb032d536c8c7de6511458796_17_0.png)


    Click the green flag to run the script. The cat will move a short way to the right.
    Try it a few times.


    ![](img/b061febeb032d536c8c7de6511458796_17_1.png)


    Click on the 10 in the move block and type 100. The cat now moves much further
    each time. Experiment by trying different numbers of steps.


    ![](img/b061febeb032d536c8c7de6511458796_17_2.png)


    ## Bouncing off the walls


    Now change your script to this. Read the script. What do you think it does? The
    forever block repeats the blocks inside—forever! The if on edge, bounce turns
    the cat around at edge of the stage.


    ![](img/b061febeb032d536c8c7de6511458796_17_3.png)


    Run the new script. The cat will now run right, then left, across the stage. Experiment—the
    more steps there are in each move, the faster the cat goes.


    ![](img/b061febeb032d536c8c7de6511458796_17_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_17_5.png)

