    # Control your cat!


    We''ll start by creating a simple script to control the cat sprite. It will make
    the cat stick to the mouse-pointer like glue!


    +   Open the Scratch editor: either choose Create on the Scratch website or click
    the Scratch symbol on your computer. Call the project "Fishball."


    ![](img/b061febeb032d536c8c7de6511458796_42_0.png)


    +   Under the Scripts tab, go to the dark blue Motion section of the blocks palette.
    Click on the go to mouse-pointer block and drag it to the right scripts area.


