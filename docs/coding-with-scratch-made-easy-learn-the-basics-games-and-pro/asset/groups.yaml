  - '[PAGE 57]


    # 56 | Games


    # Rapid reaction


    In this game, two players compete to see who has the fastest reaction time. Hit
    your key with lightning speed to win. If you hesitate for even a fraction of a
    second, you''ll taste defeat!


    +   What you''ll learn:

    - How to draw sprites and paint backdrops

    - How to use the Scratch timer in games

    - How to write game instructions and show them on the stage


    Player 1''s time is shown here


    The green circle tells you which player has won


    Player 2''s time is shown here


    ![](img/b061febeb032d536c8c7de6511458796_57_0.png)


    Player 1 wins!


    Rapid Reaction has only one sprite—a circle that turns from red to green


    # Playing the game


    Clicking the green flag shows the instructions on the stage. Each player has a
    different key to press: Player 1 the “Z” key, Player 2 the “M” key. When you''re
    ready to play, hit the space bar. Wait until the red circle turns green, then
    whoever presses fastest wins the game.'
