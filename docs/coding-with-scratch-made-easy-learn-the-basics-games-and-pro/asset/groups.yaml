  - '[PAGE 23]


    # Learn the Basics


    # Animation


    The characters in cartoons seem to move, but really you are just watching lots
    of slightly different pictures that fool your brain into seeing movement. This
    is called animation. Sprites can be animated in the same way.


    +   What you''ll learn:

    • How to animate sprites

    • Sprites can change how they look

    • How to use costumes

    • How to load new sprites from the Scratch library


    # Changing costumes


    Our cat sprite has two different pictures, or "costumes", it can show. Start a
    new scratch project and click on the Costumes tab just above the block list. You
    will then see the two costumes the cat sprite can "wear".


    ![](img/b061febeb032d536c8c7de6511458796_23_0.png)


    # Walking the cat


    To animate the cat, build and run this script. The forever loop repeats the next
    costume block. The picture of the sprite changes every half second, and this makes
    the cat look like it''s walking. Try adding a move block in the loop to improve
    the animation.


    ![](img/b061febeb032d536c8c7de6511458796_23_1.png)


    This picks the next costume


    Quickly swapping costumes makes it look as if the cat is walking'
