  - '[PAGE 31]


    # Learn the Basics

    Math


    Scratch can do all the math you know about. But some of the symbols it uses are
    different, to fit with what''s on your computer''s keyboard. We can do equations
    in Scratch and use variables in them. Scratch can even roll dice for us.


    +   What you''ll learn:

    - How to do math in Scratch

    - What math symbols computers use

    - How to do equations with variables

    - How to roll dice using the computer


    ![](img/b061febeb032d536c8c7de6511458796_31_0.png)


    # Math tools


    To do math you need the green Operator blocks. Each block does a different problem
    with the numbers in the two windows.


    The "+" block adds the two numbers in together.


    The "-" block takes the second number away from the first.


    # Placing operators


    Wherever you put an operator block, it will put the answer to the problem. So
    if you put it into the window of a say, the cat will say the answer.


    # Multiply (*)


    Scratch uses the "*" symbol, because "x" looks like a letter.


    # Divide (/)


    The keyboard has no division sign. Scratch uses "/" instead.


    ![](img/b061febeb032d536c8c7de6511458796_31_1.png)


    # Math and variables


    We can use operator blocks to solve problems with variables. For example, to find
    the total number of pets, we can use the add (+) block to add up the values of
    variables dogs and cats, and store the answer in a variable called pets.


    Add (+) block put into window of set block


    ![](img/b061febeb032d536c8c7de6511458796_31_2.png)'
  - '[PAGE 32]


    # Learn the Basics


    A random number is one that we can''t predict. It''s like a number we get when
    we roll dice—we don''t know what the numbers will be before we roll. Scratch can
    act like dice and “roll” for us. Try this script in a new project.


    Read the script, then run it. The cat will show you four random numbers as it
    thinks of them. Random numbers are useful in games, because they make the action
    difficult to guess.


    ![](img/b061febeb032d536c8c7de6511458796_32_0.png)


    # Show what you know


    Try these mathematical mind-bogglers.


    +   1. You are the computer! Calculate the values of these blocks.


    ![](img/b061febeb032d536c8c7de6511458796_32_1.png)


    +   2. These blocks use variables. Can you work out the answers?


    ![](img/b061febeb032d536c8c7de6511458796_32_2.png)


    +   3. Write down the values stored in these variables.


    ![](img/b061febeb032d536c8c7de6511458796_32_3.png)'
  - '[PAGE 33]


    # 32 Learn the Basics


    # Inputs and events


    The data put into a program, such as the answer you type when Scratch asks a question,
    is called input. Events are actions, like clicking a sprite or pressing a chosen
    key, that Scratch can use to run scripts.


    +   What you''ll learn:

    - How to ask questions and use the answers

    - What an Event block is

    - How to run a script with a key press or click


    ![](img/b061febeb032d536c8c7de6511458796_33_0.png)


    # Just ask


    Sprites can use questions and answers using the light blue ask and answer blocks
    under the Sensing tab. Start a new project and add this script. Read the script.
    What do you think it does? Run the script to test your ideas.


    ![](img/b061febeb032d536c8c7de6511458796_33_1.png)


    The cat asks the question


    ![](img/b061febeb032d536c8c7de6511458796_33_2.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_4.png)


    You type in "Cat food"


    ![](img/b061febeb032d536c8c7de6511458796_33_5.png)


    Then press enter/return or click the blue check


    # Lunchtime for Scratch Cat!


    The cat asks and waits for you to type in your reply using the keyboard. When
    you press enter/return, what you typed becomes the value of the answer block.


    ![](img/b061febeb032d536c8c7de6511458796_33_6.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_7.png)


    # Answers are like variables


    The answer block works just like a variable. Wherever you put the answer block
    it will be replaced by your answer to the question. The green join block in the
    script just takes what''s in its windows and links them together as a single item.


    ![](img/b061febeb032d536c8c7de6511458796_33_8.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_9.png)'
  - '[PAGE 34]


    # Events trigger scripts


    Events are things that happen that the computer can tell Scratch about, such as
    key presses and mouse clicks. The brown Events “header” blocks start to run a
    script when a chosen event happens, in the same way that the green flag button
    can start a script when you click on it.


    ![](img/b061febeb032d536c8c7de6511458796_34_0.png)


    # Build a drum kit


    Create lists of scripts like these. Select a different key and a different drum
    for each version of the script. The blocks below an Events script header are run
    when you press the correct key. Play an epic drum solo using your selected keys!


    ![](img/b061febeb032d536c8c7de6511458796_34_1.png)


    # Show what you know


    Can you answer these questions about inputs and events?


    +   1. Which blue Sensing block makes a sprite ask a question? ....................................

    2. Which block holds the reply given to the question? ....................................

    3. Something that happens to the computer, like a mouse click or a key press,
    is called an ....................................

    4. What happens if I click on this script? ....................................................

    5. Can more than one script be running at once? .....................................................


    ![](img/b061febeb032d536c8c7de6511458796_34_2.png)'
  - '[PAGE 35]


    # 34 | Learn the Basics


    # if-then-else


    Let''s meet the if-then-else block. This block uses a question, or condition,
    to choose between two groups of blocks to run. We''ll also look at some handy
    condition blocks that use variables and values to ask “true" or false?”


    What you''ll learn:

    - How to compare numbers, replies, and variables to make decisions

    - How an if-then-else block works


    ![](img/b061febeb032d536c8c7de6511458796_35_0.png)


    # Comparing things


    There is another kind of block that asks a “true or false?" question. In the green
    Operators section there are 3 blocks that compare what''s in their two windows.
    To read them, you need to know what these symbols mean: =, <, and >.


    | 3 = 3 | means "is the same as" | 3 = 2 |

    | True | | False |

    | 2 < 5 | means "is less than" | 7 < 3 |

    | True | | False |

    | 5 > 1 | means "is greater than" | 6 > 9 |

    | True | | False |


    ![](img/b061febeb032d536c8c7de6511458796_35_1.png)


    # Password checker


    An if-then-else block has two groups of blocks inside. It runs the first group
    if the condition is true, and the second group if the condition is false. We can
    use it to check a password.


    ```

    when clicked

    ask Password? and wait

    if answer = dragon then

    say Enter friend!

    else

    say Go away!

    ```


    Runs if answer is "dragon"

    Runs if answer is NOT "dragon"


    Equals (=) block compares answer with password'
