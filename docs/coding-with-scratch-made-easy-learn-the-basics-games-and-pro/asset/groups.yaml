    \ block. Run the script. The cat will set off diagonally. Try using different\
    \ directions and rotation styles.\n\n![](img/b061febeb032d536c8c7de6511458796_20_0.png)\n\
    \n## Show what you know\n\nKnow your way around Scratch?\n\n- 1. What number should\
    \ replace the to set the direction:\nUp = ............................\nLeft =\
    \ ............................\nDown = ............................\nRight = ............................\n\
    - 2. What does this script do? Read carefully and test your Scratch-powers!\n\n\
    ![](img/b061febeb032d536c8c7de6511458796_20_1.png)\n\n# Learn the Basics\n\n#\
    \ Loops\n\nIn computer programs, we often want to carry out the same instructions\
    \ many times. To avoid having to put the same blocks many times, we can use a\
    \ loop.\n\n### What you'll learn:\n- Types of loops\n- The difference between\
    \ forever and repeat\n- How to use loops\n\nStart a new project and look at the\
    \ orange blocks section.\n\n![](img/b061febeb032d536c8c7de6511458796_21_0.png)\n\
    \nAs the cat spins around, you'll see its direction value change and the blue\
    \ line pointer move around the direction circle.\n\nUse the \"compass\" shown\
    \ here to decode the direction number.\n\nDirection 180° means \"down\",\n\nDirection\
    \ 90° means \"right\",\n\n## Forever loops\n\nThe forever block runs the blocks\
    \ inside it over and over. You can stop a forever loop by clicking the red stop.\n\
    \n![](img/b061febeb032d536c8c7de6511458796_21_2.png)\n\n## Repeat loops\n\nIf\
    \ we want to repeat a group of blocks only a few times, we can use the repeat\
    \ block. Try changing the number of times it repeats.\n\n![](img/b061febeb032d536c8c7de6511458796_22_0.png)\n\
    \n# Show what you know\n\nWhat do you know about loops? Test yourself with this.\n\
    \n- 1. Loops are used to ............ groups of blocks.\n- 2. Two types of scratch\
    \ loops are ............\n- 3. You can stop a forever loop by clicking the ............\n\
    - 4. In which section do you find the pink?\n- 5. Which block has it?\n\nBug hunt!\
    \ This script should draw the four sides of a square, but nothing happens when\
    \ it’s running. Can you spot and suggest a fix for the bug?\n\n# Learn the Basics\n\
    \n# Animation\n\nThe characters in cartoons seem to move, but really you are just\
    \ watching lots of slightly different pictures that fool your brain into seeing\
    \ movement. This is called animation. Sprites can be animated in the same way.\n\
    \nWhat you'll learn:\n- How to animate sprites\n- Sprites can change how they\
    \ look\n- How to use costumes\n- How to load new sprites from the Scratch library\n\
    \n# Changing costumes\n\nOur cat sprite has two different pictures, or \"costumes\"\
    , it can show. Start a new scratch project and click on the Costumes tab just\
    \ above the block list. You will then see the two costumes the cat sprite can\
    \ \"wear\".\n\n# Walking the cat\n\nThis picks the next costume\n\n```\n\nTo animate\
