    # 学习基础知识：数学


    Scratch 可以完成你熟悉的所有数学运算。但它使用的一些符号有所不同，以适应电脑键盘的布局。我们可以在 Scratch 中建立方程并在其中使用变量。Scratch
    甚至可以为我们掷骰子。


    - 你将学习：

    - 如何在 Scratch 中进行数学运算

    - 计算机使用的数学符号

    - 如何使用变量建立方程

    - 如何使用电脑掷骰子


    ![](img/b061febeb032d536c8c7de6511458796_31_0.png)


    # 数学工具


    要进行数学运算，你需要绿色的“运算符（Operator）”积木。每个积木都会对两个窗口中的数字进行不同的运算。


    `+` 积木会将两个数字相加。


    `-` 积木会将第二个数字减去第一个数字。


    # 放置运算符


    无论你把运算符积木放在哪里，它都会给出问题的答案。所以，如果你把它放在“说”的窗口里，猫就会说出答案。


    # 乘 (*)


    Scratch 使用 `*` 符号，因为 "x" 看起来像一个字母。


    # 除 (/)


    键盘上没有除号。Scratch 使用 `/` 代替。


    ![](img/b061febeb032d536c8c7de6511458796_31_1.png)


    # 数学与变量


    我们可以使用运算符积木来解决变量问题。例如，为了找到宠物的总数，我们可以使用加法 (+) 积木将变量 `dogs` 和 `cats` 的值相加，并将答案存储在名为
    `pets` 的变量中。


    加法 (+) 积木放入设置（set）积的窗口中


    ![](img/b061febeb032d536c8c7de6511458796_31_2.png)


    # 学习基础知识


    随机数是我们无法预测的数字。它就像我们掷骰子时得到的数字——在掷之前，我们并不知道数字会是多少。Scratch 可以像骰子一样为我们“掷数”。在新项目中尝试这个脚本。


    阅读脚本，然后运行它。猫在思考这些数字时，会向你展示四个随机数。随机数在游戏中非常有用，因为它们让动作变得难以预测。


    ![](img/b061febeb032d536c8c7de6511458796_32_0.png)


    # 展示你的所学


    尝试这些数学题。


    - 1. 你是电脑！计算这些积木的值。

    ![](img/b061febeb032d536c8c7de6511458796_32_1.png)

    - 2. 这些积木使用了变量。你能算出答案吗？

    ![](img/b061febeb032d536c8c7de6511458796_32_2.png)

    - 3. 写下存储在这些变量中的值。![](img/b061febeb032d536c8c7de6511458796_32_3.png)


    # 学习基础知识：输入与事件


    输入程序的数据（例如当 Scratch 提问时你输入的）被称为输入。事件是发生的动作，如点击或按键，Scratch 可以利用这些来运行脚本。


    - 你将学习：

    - 如何提问并使用答案

    - 什么是事件（Event）积木

    - 如何通过按键或点击运行脚本

    ![](img/b061febeb032d536c8c7de6511458796_33_0.png)


    # 询问


    角色可以使用“传感（Sensing）”标签下的蓝色“询问（ask）”和“回答（answer）”积木来提问和获取答案。启动新项目并添加此脚本。阅读脚本。你认为它会做什么？


    ![](img/b061febeb032d536c8c7de6511458796_33_1.png)

    猫在提问


    ![](img/b061febeb032d536c8c7de6511458796_33_2.png)

    你输入“猫粮”


    ![](img/b061febeb032d536c8c7de6511458796_33_3.png)


    # Scratch 的午餐时间！


    猫提问并等待你使用键盘输入回复。当你按下回车键（enter）时，你输入的内容就变成了“回答”积木的值。


    ![](img/b061febeb032d536c8c7de6511458796_33_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_5.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_6.png)


    # 答案就像变量


    “回答”积木的工作方式就像变量。无论你把“回答”积木放在哪里，它都会被你对问题的回答替换。脚本中的绿色“拼接（join）”积木获取窗口中的内容并将它们连接成一个整体。


    ![](img/b061febeb032d536c8c7de6511458796_33_8.png)


    ![](img/b061febeb032d536c8c7de6511458796_33_9.png)


    # 事件触发脚本


    事件是计算机可以告知 Scratch 的事情，例如按键和鼠标点击。棕色的“事件（Events）”头部积木在选定事件发生时开始运行，就像绿旗按钮被点击时可以启动脚本一样。


    ![](img/b061febeb032d536c8c7de6511458796_34_0.png)


    # 构建一套鼓组


    创建这样的脚本列表。为每个版本的脚本选择不同的按键和不同的鼓。当你按下正确的按键时，事件脚本头部下方的积木运行。使用你选择的按键演奏一场史诗级的独奏！


    ![](img/b061febeb032d536c8c7de6511458796_34_1.png)


    # 展示你的所学


    你能回答这些关于输入和事件的问题吗？


    - 1. 哪个蓝色的传感积木让角色提问问题？...................................

    - 2. 哪个积木持有对问题的回答？...................................

    - 3. 发生于计算机上的事情（如鼠标点击或按键）被称为 ....................................

    - 4. 如果我点击这个脚本会发生什么？...................................

    - 5. 可以同时运行多个脚本吗？.....................................


    ![](img/b061febeb032d536c8c7de6511458796_34_2.png)


    # 学习基础知识：如果-那么-否则


    让我们认识“如果-那么-否则（if-then-else）”积木。这个积木使用一个问题或条件在两组积木之间进行选择。我们还将查看一些实用的条件积木，它们使用变量和值来询问“真”还是“假”？


    - 你将学习：

    - 如何比较数字、回复和变量来做决策

    - if-then-else 积木是如何工作的


    ![](img/b061febeb032d536c8c7de6511458796_35_0.png)


    # 比较


    另一种类型的积木会询问“真或假”的问题。在绿色的“运算符”中，有三个积木可以比较两个窗口中的内容。要读取它们，你需要知道这些符号：=、< 和 >。


    | 表达式 | 含义 | 结果 |

    | :--- | :--- | :--- |

    | 3 = 3 | 意味着“相同” | True |

    | 3 = 2 | | False |

    | 2 < 5 | 意味着“小于” | True |

    | 7 < 3 | | False |

    | 5 > 1 | 意味着“大于” | True |

    | 6 > 9 | | False |


    ![](img/b061febeb032d536c8c7de6511458796_35_1.png)


    # 密码检查


    “如果-那么-否则”积木内部有两个积木组。如果条件为真，它运行第一组；如果条件为假，它运行第二组。我们可以用它来检查密码。


    ```

    当点击时

    问密码？并等待

    if answer = dragon then

    say 欢迎朋友！

    else

    say 请离开！

    ```


    如果答案是 "dragon"

    如果答案不是 "dragon"


    '
