    给指令精灵这些脚本。它们在游戏开始时显示指令，按下空格键时隐藏。运行游戏检查脚本是否工作正常![](img/b061febeb032d536c8c7de6511458796_61_2.png)


    现在去舞台。点击玩家 2 时间窗口。将其拖到右上角。这将帮助每位玩家清晰地看到自己的时间。


    最后，添加彩色背景。要打开画笔编辑器，点击舞台信息区域（屏幕左下角）的画笔。选择一种颜色，选择填充工具（油漆桶），点击绘制区域。这样就完成了——你准备好玩“快速反应”了！！[](img/b061febeb032d536c8c7de6511458796_61_3.png)


