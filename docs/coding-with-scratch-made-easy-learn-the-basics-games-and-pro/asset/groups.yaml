- md: '

    # Projects


    It''s feeding time! Your pet''s tummy is rumbling. You''ll need to draw some food
    for it to eat and a mouth so that your pet can gobble up the food with a "chomp!"


    Click on Paint new sprite again to draw a food sprite. It could be a bone for
    a dog, a carrot for a horse, or lettuce for a rabbit. Centre the sprite (see step
    9), then rename it.


    Drag the brown broadcast and wait block into the food sprite''s scripts. Click
    on the arrow in the window and select new message from the drop-down menu. Then
    type "Eat" into the pop-up box. Click OK.


    ![](img/b061febeb032d536c8c7de6511458796_91_0.png)


    Type "Eat" here


    ![](img/b061febeb032d536c8c7de6511458796_91_1.png)


    Build this script for the food sprite—in this case, the bone. Run the project.
    When you drag and drop the food onto the picture, the script should make the food
    vanish and send the message "Eat" to the mouth sprite. (We''ll make the mouth
    sprite next.)


    - Sends the food to the bottom-right corner of the stage

    - This block keeps the food in the corner until you "pick it up" with the mouse-pointer


    ![](img/b061febeb032d536c8c7de6511458796_91_2.png)


    - Makes the food stick to the mouse-pointer until you release the mouth button

    - When the food touches the picture, these blocks hide the food, send the message
    "Eat," and wait for the mouth to respond


    ![](img/b061febeb032d536c8c7de6511458796_91_3.png)


    # Projects | 91


    20 Now draw another new sprite—pet''s mouth. The sprite can be just a mouth shape.
    If you''re skilled at drawing sprites, you can try adding teeth and a tongue.
    Rename the sprite and drag it into position on the picture.


    ![](img/b061febeb032d536c8c7de6511458796_92_0.png)


    > You''ve got great teeth!


    ![](img/b061febeb032d536c8c7de6511458796_92_1.png)


    - Rename your sprite when it appears in the sprite list


    ![](img/b061febeb032d536c8c7de6511458796_92_2.png)


    - Clicking on the speaker under the Sounds tab will take you to the sound library


    ![](img/b061febeb032d536c8c7de6511458796_92_3.png)


    21 Let''s add an eating food to the mouth. With the mouth selected, go to the
    Sounds tab and click Choose sound from library (the speaker symbol). In the library,
    select "chomp" and then hit OK.


    | Scripts | Costumes | Sounds |

    |---|---|---|

    | New sound: | | |


    22 Build this code for the mouth. When the script receives the message "Eat,"
    it plays the sound of eating and makes the mouth look as though it''s swallowing
    the food, which disappears. Congratulations—you''ve completed Pet Party! Click
    the flag to try it out. Why not make your own features to add to the project?


    # New skill: Messages


    Scratch sprites can use messages to "talk" to each other.


    ```

    when I receive Eat

    ```


    This block broadcasts (sends out) a message that tells other sprites to do something.


    ```

    broadcast Eat and wait

    ```


    This block tells other sprites to do something but waits until they finish before
    continuing.


    ![](img/b061febeb032d536c8c7de6511458796_92_4.png)


    - Click on the arrow and select "Eat"


    ```

    when I receive

    go go to

    repeat 5

    play sound chomp

    hide

    wait 0.1 seconds

    show

    wait 0.1

    ```


    - Click on the arrow and select "chomp"

    - Type "0.1" into the window of wait block


    ```

    when I receive Eat

    ```


    This block runs any script below it when it receives a particular broadcast message.


    ![](img/b061febeb032d536c8c7de6511458796_92_5.png)


    # Projects


    Show what you know

    Your pet is ready to party—but are you ready to take this test?


    1. The when I receive block will only run the script below it when it gets a message
    from a ............................................ block.

    2. The ............................ is where you draw new sprites.

    3. You can resize sprites using the ............................ and .................
    tools.

    4. Which block makes a sprite disappear from the stage? ....................................

    5. If you draw your eye like this in the paint editor, what will happen when you
    run its script? Try your ideas out in Scratch.


    ![](img/b061febeb032d536c8c7de6511458796_93_0.png)


    - a. ....................................................................................................................................

    - b. ....................................................................................................................................

    - c. ....................................................................................................................................


    6. You used coordinates in the go to x: y: block of the hat''s script to position
    the hat on the stage. Draw lines to link these hats with their coordinates.


    ![](img/b061febeb032d536c8c7de6511458796_93_1.png)


    7. How would you make a short script to add to the dog sprite so he barks when
    he''s clicked?


    # Bounce painting


    Scratch has a magic pen that can draw lines wherever sprite goes. In this project,
    you''ll create two balls that bounce around the stage drawing patterns. What you''ll
    learn:


    - That Scratch has a pen that can draw lines when a sprite moves

    - That local variables let copies of sprites store different data


    This project looks great! The two balls bounce around the stage Each time the
    balls move, a coloured line is drawn between them


    ![](img/b061febeb032d536c8c7de6511458796_94_0.png)


    - The line changes each time to create multicoloured patterns

    - A dark or black background shows the patterns best

    - You simply click the green flag to set the balls in motion. They always start
    with a random speed and direction, so you never get the same pattern twice. After
    a while, the screen fills up, so the project has a script to clear the stage.


    # 94 Projects


    The balls bouncing! We''ll start by getting the balls bouncing around the stage.
    We won''t paint any patterns just yet—we''ll sort that later.


    - Start a new project called "Bounce Painting". Delete the cat sprite, then load
    the sprite "Ball" from the library.


    ![](img/b061febeb032d536c8c7de6511458796_95_0.png)


    - Go to the Variables blocks and click on Make variable. Type "Speed" in the pop-up
    window. Select For this sprite only, then click OK. When it appears in the Data
    section, uncheck its box so it doesn''t show on the stage.


    ![](img/b061febeb032d536c8c7de6511458796_95_1.png)


    - Make this script for the ball. Click on the broadcast block''s arrow and select
    new message. Type "Go" into the pop-up window and click OK.


    ![](img/b061febeb032d536c8c7de6511458796_95_2.png)


    - Click here and select "Go"

    - Reset ball

    - Sets a random variable speed for just this sprite


    ![](img/b061febeb032d536c8c7de6511458796_95_3.png)


    Now build this script for the ball. It is triggered by the message "Go" and sets
    the ball bouncing nonstop.


    - Picks a random direction

    - Keeps the ball bouncing


    ![](img/b061febeb032d536c8c7de6511458796_95_4.png)


    You create a variable for just one sprite and then copy the sprite, each sprite
    has its own version. The two versions can be different, allowing the balls to
    go at different speeds. Programmers call this a "local variable."


    # Local variables


    Drawing lines, tidying up


    The next task is to draw the coloured line between the balls. Then we''ll darken
    the backdrop. Finally, we''ll make a script to clear the stage when it gets full.


    Click on Paint sprite to create a new, empty sprite that will draw the line. Call
    it "Line Draw". We don''t need to use this sprite, so we won''t draw a costume!


    Add this script to the Line Draw sprite. It draws a coloured line between the
    two balls, but it also changes the line''s colour a little each time. Run the
    project to test it. The new sprite doesn''t need a costume


    ```

    when clicked

    forever

    go to Ball

    down

    go to Ball2

    up

    ```


    - Moves to Ball sprite without drawing a line

    - Starts drawing a line where the Line Draw sprite goes

    - Stops drawing a line

    - Moves to Ball2 sprite, drawing a line as it goes


    ```

    change pen color by 1

    ```


    Click on the backdrop in the stage info area, then on the Backdrops tab. In the
    paint editor, select the Fill with color tool (the paint pot). Choose a dark colour
    or black, then click on the drawing area to fill it.


    Click here to select the backdrop


    ![](img/b061febeb032d536c8c7de6511458796_96_0.png)


    Totally random! After a while, the stage gets messy. Add this script to the Line
    Draw sprite. It clears the stage every now and then, ready for a new pattern.
    Click the flag to see how it works. That''s—you''re finished. Time to get painting!


    Sets a random thickness for the line each time


    ```

    when clicked

    forever

    set pen size to

    pick random 1 to 15

    clear

    broadcast Go

    pick random 15 to 30

    secs

    ```


    Clears the stage


    Resets the drawing every 15 to 30 seconds

