  - '[PAGE 63]


    # Melon bounce


    Scratch Cat has to stop the falling watermelons from hitting the ground, but he
    doesn''t know where they''ll appear or which melon will drop first! Help him to
    keep the melons in the air.


    +   What you''ll learn:

    - How to animate a sprite by making it quickly swap its costumes

    - How to make copies of sprites and their scripts

    - That time delays can make games more fun


    Each melon starts in a random position


    The melons bounce off the cat and back up into the air


    The melons fall one by one


    ![](img/b061febeb032d536c8c7de6511458796_63_0.png)


    When a melon hits the bottom of the stage, you hear a cymbal and it''s the end
    of the game


    Move the cat sideways with the left and right arrow keys


    # Playing the game


    Use the arrow keys to move Scratch Cat back and forth across the stage to reach
    the falling watermelons. You get a point for every second the game lasts. The
    longer you keep the melons bouncing, the more points you score!'
