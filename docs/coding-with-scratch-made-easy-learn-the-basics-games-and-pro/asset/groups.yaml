    # Glossary


    - animation: Changing pictures quickly to make something appear to move on the
    screen.

    - backdrop: The picture behind the sprites on the stage.

    - debug: To remove bugs; find and fix the errors in a program.

    - operating system (OS): The program that controls everything on your computer,
    such as OS X or Windows.

    - backpack: A way to copy things between Scratch projects.

    - event: Something that happens to the computer, like a mouse click.

    - run: To start a program.

    - block: An Instruction in Scratch. Blocks can be joined together.

    - input: Data that goes into a program; for example, from the keyboard.

    - script: A stack of instructions that are in order.

    - bug: A mistake in a program. A bug caused because insects went into the wiring
    of the first computers, causing errors.

    - sprite: A picture on the stage that a script can move and change.

    - library: A collection of sprites, sounds, or costumes.

    - stage: The area containing the sprites, where a Scratch project runs.

    - condition: A “true or false?” question that is used to make a decision in a
    computer program.

    - loop: Instruction that makes other instructions repeat.

    - string: The word used by programmers for data that contains words.

    - program: A list of instructions that tell a computer what to do.

    - variable: A place to store data in a program. A variable always has a name and
    a value.

    - costume: The picture sprite shows on the stage.

    - operator: A block that works something out from data, such as adding two numbers
    together.

    - data: Information—for example, numbers or words.


    > Note for parents

    Help your child logically through any difficulties. For obvious errors, such as
    swapping similar blocks in scripts. Also check that scripts are controlling the
    correct sprites. Don''t forget that using Scratch should be fun. The Scratch website
    is run by Massachusetts Institute of Technology (MIT) and is intended to be safe
    for children to use. Try it yourself!


