    Continually changes the colour of the stage


    # Light show!


    We can add scripts to the stage: click on the small picture of the stage area
    at the top of the stage info area. Try running this script with your party backdrop
    to bring it to life.


    ```

    when clicked

    forever

    change color effect by 25

    ```


    # Learn the Basics | 25


    Music

    A party isn''t a party without music!

    Sounds can be loaded into a sprite or the stage. But you must make scripts to
    play them in the scripts area.


    Click on the speaker under the Sounds tab will take you to the Sound Library


