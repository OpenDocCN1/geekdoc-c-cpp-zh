- md: "\n# Melon bounce\n\nScratch Cat has to stop the falling watermelons from hitting\
    \ the ground, but he doesn't know where they'll appear or which melon will drop\
    \ first! Help him to keep the melons in the air.\n\n+ What you'll learn:\n- How\
    \ to animate a sprite by making it quickly swap its costumes\n- How to make copies\
    \ of sprites and their scripts\n- That time delays can make games more fun\n\n\
    Each melon starts in a random position.\n\nThe melons bounce off the cat and back\
    \ up into the air.\n\nThe melons fall one by one.\n\n![](img/b061febeb032d536c8c7de6511458796_63_0.png)\n\
    \nWhen a melon hits the bottom of the stage, you hear a cymbal and it's the end\
    \ of the game.\n\nMove the cat sideways with the left and right arrow keys.\n\n\
    # Playing the game\n\nUse the arrow keys to move Scratch Cat back and forth across\
    \ the stage to reach the falling watermelons. You get a point for every second\
    \ the game lasts. The longer you keep the melons bouncing, the more points you\
    \ score!\n\n# Getting the cat moving 63\n\nFirst, make some code so that Scratch\
    \ Cat can patrol along the bottom of the stage, clearing the watermelons off the\
    \ ground.\n\n+ 1 Start a new project and name it \"Melon Bounce.\" Change the\
    \ cat’s name from \"Sprite1\" to \"Cat.\"\n\n![](img/b061febeb032d536c8c7de6511458796_64_0.png)\n\
    \n2 Look under the cat’s Costume tab. You will see two costumes. If you make him\
    \ switch repeatedly, it will look like he is walking. This is called animation.\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_1.png)\n\nQuick costume changes\
    \ make the cat appear to walk.\n\n![](img/b061febeb032d536c8c7de6511458796_64_2.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_64_3.png)\n\n```\nwhen clicked\ngo\
    \ to x: (-180) y: (-120)\nforever\n  if right arrow pressed? then\n    change\
