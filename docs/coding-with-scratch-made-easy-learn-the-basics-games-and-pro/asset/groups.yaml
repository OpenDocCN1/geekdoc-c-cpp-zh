    # 项目


    ## 播放音符


    接下来，我们将为小猫猫（Scratch Cat）编写第二个脚本。这个脚本将允许我们在各种乐器上播放音符。


    ![](img/b061febeb032d536c8c7de6511458796_73_0.png)


    - 进入粉色的“声音”（Sound）分类，将“将乐器设置为”（set instrument）模块拖到猫的脚本区域。这将是你第二个脚本的第一个模块。模块窗口中的模块允许你选择不同的乐器。暂时让它保持为
    1（钢琴）。


    ![](img/b061febeb032d536c8c7de6511458796_73_1.png)


    (1) 钢琴

    (2) 电钢琴

    (3) 管风琴

    (4) 吉他

    (5) 电吉他

    (6) 贝斯


    列表以此类推：总共有 21 种乐器可以选择。


    - 从“声音”分类的底部添加这个粉色的“播放音符”（play note）模块，并将其连接到“将乐器设置为”模块。它允许你选择播放哪个音符以及持续多久。保持它为音符
    60 和 0.5 节拍。


    ![](img/b061febeb032d536c8c7de6511458796_73_2.png)


    ![](img/b061febeb032d536c8c7de6511458796_73_3.png)


    音符 60 播放的是“中音”——即钢琴键盘中央的音符。


    - 使用你的两个粉色模块构建此处所示的第二个脚本。你可以在黄色的“控制”（Control）分类中找到“等待直到”（wait until）模块和“重复”（forever）循环。在浅蓝色的“感应”（Sensing）分类中找到“鼠标按下？”（mouse
    down?）模块。


    ![](img/b061febeb032d536c8c7de6511458796_73_4.png)


    在鼠标点击按下之前，什么都不会发生。


    在钢琴上播放半个节拍的中音。


    ![](img/b061febeb032d536c8c7de6511458796_73_5.png)


    - 点击绿色旗帜运行项目。当你点击鼠标时，钢琴应该会弹出一个音符。如果没有播放，请检查你的脚本是否正确。尝试播放不同长度的不同音符进行实验，并看看其他乐器听起来是什么样的。


    ## 制作音乐


    让我们微调一下主脚本。你播放的音符及其响度（音量）将由猫到鼠标指针的距离和方向来控制。


    ### 提示：

    算术运算符


    绿色的“运算符”（Operators）分类中有四个模块，可以对你输入的任何数字进行数学运算。你还可以将变量和其他模块放入它们的窗口中进行计算。


    为了理解方向在舞台上是如何工作的，请看下方的图片。Scratch 用度（°）来描述角色面向的方向，因此我们的乌龟面向右侧（90°）。


    | 7 + 22 | 64 - 28 |

    | :--- | :--- |

    | 加 (+) | 减 (-) |

    | 11 * 10 | 120 / 4 |

    | 乘 (x) | 除 (/) |


    方向 -90° 意味着“左”

    方向 0° 意味着“上”

    ![](img/b061febeb032d536c8c7de6511458796_74_0.png)


    你可以将一个算术运算符放在另一个内部，进行更复杂的计算。


    方向 180° 意味着“下”

    方向 90° 意味着“向右”

    ![](img/b061febeb032d536c8c7de6511458796_74_1.png)


    然后使用模块。将这些模块堆叠在“播放音符”模块的左侧窗口中。方向模块进入除法运算符，除法运算符再插入加法运算符中。


    ![](img/b061febeb032d536c8c7de6511458796_74_2.png)


    来自“动作”（Motion）分类：在这里输入“10”。我们在“播放音符”窗口中放入了新指令。

    ![](img/b061febeb032d536c8c7de6511458796_74_3.png)


    在这里输入“70”。将你脚本中的“将乐器设置为”模块替换为粉色的“将值设置为”（set value）模块。将这两个模块堆叠在它的窗口中，如下所示。

    ![](img/b061febeb032d536c8c7de6511458796_74_4.png)


    来自“感应”分类：这个模块替换了“将乐器设置为”模块。

    ![](img/b061febeb032d536c8c7de6511458796_74_5.png)


    在这里输入“2”


    ## 项目


    你的脚本现在看起来应该是这样的。运行项目。当你在舞台上移动鼠标指针时，你播放的音符会改变。离猫越远，音量也会越大。


    ![](img/b061febeb032d536c8c7de6511458796_75_0.png)


    ```scratch

    ```


