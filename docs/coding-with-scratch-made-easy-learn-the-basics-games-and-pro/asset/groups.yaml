    \nWe love bugs!\n\n![](img/b061febeb032d536c8c7de6511458796_18_6.png)\n\n# Which\
    \ way?\n\nWhen you want to move a sprite, you need to know two things: how far\
    \ and which way. Every sprite has a built-in direction arrow. When a script gets\
    \ to a dark blue move block, that's the direction in which the sprite will go.\n\
    \n### What you'll learn:\n- How to point a sprite in different directions\n- How\
    \ to make a sprite move\n\n### Cat follows mouse!\nLet's spin our cat in every\
    \ possible direction. Open a new project in the Scratch editor. Build this script\
    \ for the cat sprite. Read the script. What do you think it does? Click the green\
    \ flag if you guessed correctly.\n\nFrom brown Events blocks From yellow Control\
    \ blocks From dark blue blocks\n\n![](img/b061febeb032d536c8c7de6511458796_19_0.png)\n\
    \nMove the mouse-pointer around the stage and watch the cat turn around it always\
    \ looks toward the pointer. The **forever** block runs the **towards mouse-pointer**\
    \ block over and over.\n\nThe cat will follow the mouse-pointer\n\n![](img/b061febeb032d536c8c7de6511458796_19_1.png)\n\
    \nIf it doesn't work, check rotation style\n\n# direction: –90°\n\n### Sprites\
    \ know where to go!\n\nDirection circle shown on sprite information panel\n\n\
    Every sprite knows what direction it's pointing. A sprite's direction is shown\
    \ in the sprite information panel when you click the blue ⓘ\n\nDirection -90°\
    \ means \"left\"\n\nDirection 0° means \"up\"\n\n![](img/b061febeb032d536c8c7de6511458796_19_2.png)\n\
    \nAs the cat spins around, you'll see its direction value change and the blue\
    \ line pointer move around the direction circle.\n\nUse the \"compass\" shown\
    \ here to decode the direction number.\n\nDirection 180° means \"down\",\n\nDirection\
    \ 90° means \"right\",\n\n## Choosing sprite’s direction\n\nWe can also set sprite’s\
    \ direction using the window on the **point in direction** block. You can click\
    \ on the little triangle beside the number for useful directions, or just click\
    \ on the window and type in a number.\n\n## Bouncing off the walls again\n\nAdd\
    \ the **point in direction 45** block to the “bouncing off the walls” script from\
