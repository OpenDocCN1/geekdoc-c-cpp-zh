  mdcn: "\n\n# 项目\n\n你还需要编写这段代码。将其放在重复循环中，位于提问（ask）模块之后。如果你输入了正确答案，猫咪会说“正确！”，并且你的得分会加分。如果不正确，猫咪会说“错误！”，并告诉你正确答案。\n\
    \n> 提示：\n> if-then-else\n\n`if-then-else` 模块有点像 `if-then` 模块，但它包含两组代码块。它会问一个问题，如果答案是“是”，就运行一组代码块；如果答案是“否”，则运行另一组代码块。\n\
    \n这个回答（answer）模块\n存储你输入的内容\n\n![](img/b061febeb032d536c8c7de6511458796_85_0.png)\n\
    \n在此模块的窗口中输入\n“正确！”\n\n答案显示在\n舞台上\n 持续 2 秒\n\n在这里输入\n“错误！正确答案是”（在“是”后面包含一个空格）\n\
    \n你的脚本现在已经完成了，看起来应该这样。运行它——运行得正常吗？如果没有运行正常，请检查是否所有正确的模块都按正确的顺序排列。挑战你的朋友，看看是谁是乘法大师！\n\
    \n![](img/b061febeb032d536c8c7de6511458796_85_1.png)\n\n设置问题并计算出\n答案\n\n提出问题\n\
    \n响应你输入的\n答案\n\n检查答案是否正确\n\n和你比比\n下一个\n项目！\n\n![](img/b061febeb032d536c8c7de6511458796_85_2.png)\n\
    \n# 项目 | 85\n\n展示你的才华\n你觉得自己是问答专家吗？快试试这道题表现如何！\n\n1. 你能将这些 Scratch 算运算符（Operator）模块与显示的计算式匹配吗？从每个模块画一条线到正确的单词。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_86_0.png)\n\na. 加法 (Add)\nb. 减法 (Subtract)\n\
    c. 除法 (Divide)\nd. 乘法 (Multiply)\n\n2. 你如何让问答问题一直增加到 20 x 20？\n\n3. 你如何停止那些简单的\
    \ 1 x x 或 x 1 的问题出现？\n\n4. 你如何将将问答中的问题数量增加到 20 个？\n\n5. 当你在提问（ask）模块中回答问题时，Scratch\
    \ 将你输入的内容存储在哪里？\n\n6. 你可以把这些模块放在代码的哪个位置，以便在答案正确时播放高音，在答案错误时播放低音？\n\n![](img/b061febeb032d536c8c7de6511458796_86_1.png)\n\
    \na.\nb.\n\n7. 你能画箭头来显示每段代码应该放在哪里，让 Scratch 猫用你的名字向你打问候吗？\n\n![](img/b061febeb032d536c8c7de6511458796_86_2.png)\n\
    \n# 86 | 项目\n\n# 宠物派对\n\n用这个疯狂的项目给你的宠物大变身吧！“宠物派对”非常有趣，它会教你一些实用的 Scratch 技巧——特别是如何制作你自己的角色（sprites）。\n\
    \n> 你将学到\n- 创建角色\n- 添加造型（costumes）\n- 使用循环\n- 添加声音\n- 绘制新造型\n\n通过将一顶彩色的帽子拖到它宠物的头上，让它加入派对。\n\
    \n尝试在它的脸上画上胡子。\n\n![](img/b061febeb032d536c8c7de6511458796_87_0.png)\n\n你如何在这个项目中使用画刷？\n\
    \n嘴巴打开可以吃食物。\n\n掉落食物会让它开心。\n\n# 你做什么\n\n在这个项目中，你将绘制角色并使用它们为宠物或其他动物的照片添加有趣的特征，比如大眼睛和派对帽子。你还可以喂养宠物并看它吞下食物。\n\
    \n# 制作一些有趣的特征\n\n从给你的宠物戴上大大的眼睛和一个精致的派对帽子开始。\n- 首先，使用相机或手机拍摄你的宠物照片。拍一张竖像的（直的），而不是横向的（水平的）。将相机或手机的照片上传到电脑。你可能需要父母帮助你。\n\
    - 创建一个名为“宠物派对”的新 Scratch 项目。进入角色列表删除 Scratch 猫。然后点击“从文件上传角色”（文件图标）。选择你的宠物照片。你的宠物将出现在角色列表中。\n\
    \ 如果你的照片标题是一个数字，你需要重命名宠物。选择它并点击顶部的蓝色 (i)。在角色信息窗口中输入你宠物的名字。\n- 使用鼠标将照片拖到舞台的左侧。右侧为骨头和帽子留出空间。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_88_0.png) 使用竖像照片，谢谢！\n\n![](img/b061febeb032d536c8c7de6511458796_88_1.png)\
    \ 点击文件图标。\n新角色：\n从文件上传角色\n\n![](img/b061febeb032d536c8c7de6511458796_88_2.png)\
    \ 在此窗口中输入\n\n![](img/b061febeb032d536c8c7de6511458796_88_3.png)\n\n- 为了画眼睛，首先点击角色列表顶部的绘制新角色（画刷图标）打开画笔。\n\
    点击此处绘制新角色\n\n![](img/b061febeb032d536c8c7de6511458796_88_4.png)\n\n![](img/b061febeb032d536c8c7de6511458796_88_5.png)\n\
    \n# 图片问题\n\n如果你没有如果你没有宠物，也没有相机或手机拍照，请让父母帮助你在互联网上找到无版权的公有领域照片。或者，你可以绘制或描摹动物的照片并将其保存到电脑上。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_88_6.png)\n\n![](img/b061febeb032d536c8c7de6511458796_88_7.png)\n\
    \n# 88 项目\n\n6 检查画笔编辑器右下角是否选择了“位图模式”（Bitmap Mode）（见下方），以及调色板上是否选择了黑色。\n\n7 接下来，点击画笔编辑器左侧的圆形工具。确保左下角选择了“轮廓形状”而不是“填充颜色”。\n\
    \n圆形工具\n选择轮廓形状\n\n选择黑色画眼睛\n此处应显示“位图模式”\n\n![](img/b061febeb032d536c8c7de6511458796_89_0.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_89_1.png)\n\n![](img/b061febeb032d536c8c7de6511458796_89_2.png)\
    \ 位图模式\n转换为矢量\n\n8 按住 shift 键，点击并画一个圆。选择“填充颜色”工具（油漆桶）并在调色板上选择白色。要添加瞳孔，选择圆形工具、填充形状和调色板上的黑色。在眼睛内部靠近边缘的地方，在“3\
    \ 点钟”位置画一个小圆。\n\n填充颜色\n在“3 点钟”位置画瞳孔\n\n![](img/b061febeb032d536c8c7de65114587996_89_3.png)\n\
    \n![](img/b061febeb032d536c8c7de65114587996_89_4.png) 用白色填充眼睛\n\n9 为了让眼睛正常旋转，你需要让它居中。设置造型中心工具（在画笔编辑器右上角），然后点击眼睛的正中心。\n\
    \n设置造型中心工具\n\n![](img/b061febeb032d536c8c7de65114587996_89_5.png)\n\n点击眼睛角色的中心\n\
    \n![](img/b061febeb032d536c8c7de65114587996_89_6.png)\n\n- 当点击时\n永远\n移到前方\n面向鼠标指针\n\
    \n显示在照片前的眼睛\n面向鼠标指针\n\n10 将此脚本添加到眼睛角色。它让眼睛指向鼠标指针，无论鼠标指针在舞台的哪里。\n\n# 项目\n\n11 右键点击眼睛角色，从下拉菜单中选择复制。这将复制眼睛及其脚本。\n\
    \n12 点击并拖动眼睛的位置。如果你对它们的大小不满意，使用 Scratch 编辑器顶部的“放大”和“缩小”工具让它们变大或变小。\n\n![](img/b061febeb032d536c8c7de65114587996_90_0.png)\n\
    \n![](img/b061febeb032d536c8c7de65114587996_90_1.png)\n\n13 现在点击绿旗运行眼睛脚本。当你环绕舞台时，两只眼睛都应该跟随鼠标指针旋转。\n\
    \n![](img/b061febeb032d536c8c7de65114587996_90_2.png)\n\n![](img/b061febeb032d536c8c7de65114587996_90_3.png)\n\
    \n14 再次点击绘制新角色（画刷图标）打开画笔编辑器。制作另一个新角色——帽子。完成后，让你的角色居中（见 9）。\n\n> 如果眼睛旋转，检查你的脚本\n\
    \n使用画刷工具制作流苏\n使用油漆桶填充颜色\n使用线条工具制作条纹\n\n![](img/b061febeb032d536c8c7de65114587996_90_4.png)\n\
    \n15 在角色列表中，选择帽子并点击它顶部的蓝色 (i)。重命名角色为“帽子”。检查信息面板中的“可拖动玩家”选择框，这样你就可以把帽子拖到宠物的头上了。\n\
    \n![](img/b061febeb032d536c8c7de65114587996_90_5.png)\n\n勾选此处可以在全屏模式下移动帽子\n\n\
    将帽子发送舞台右侧\n\n16 给帽子编写代码。数字（坐标）告诉帽子开始时出现在舞台的哪个位置。点击绿旗尝试一下。\n\n"
