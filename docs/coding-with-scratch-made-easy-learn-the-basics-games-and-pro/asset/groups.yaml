    \ 3. 电脑上发生的事情，如鼠标点击或按键，被称为“事件”。\n- 4. 如果我点击带有这个脚本的角色，会发生什么？\n\n![](img/b061febeb032d536c8c7de6511458796_102_6.png)\n\
    \n角色说：“你点击了 me！”\n\n- 5. 多个脚本可以同时运行吗？可以。（许多脚本可以同时在多个角色上运行。）\n\n第 34–35 页 如果...否则\n\
    \n- 1. 什么形状的区块进入`如果...`或`如果...否则`区块的条件窗口？\n\n![](img/b061febeb032d536c8c7de6511458796_103_0.png)\n\
    \n- 2. 查看下方的变量，然后圈出值为“true”（是）的绿色运算符区块。\n\n![](img/b061febeb032d536c8c7de6511458796_103_1.png)\n\
    \n第 36–37 页 一个游戏：龙！\n\n- 1. 为什么我们让分数变量上的复选框保持勾选？勾选是为了让分数显示在舞台上。\n- 2. 你如何让龙在开始时以半的速度移动？将将速度设置为\
