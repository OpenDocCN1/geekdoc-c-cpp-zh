    # Learn the Basics


    # if-then


    If it''s raining, then we decide to wear a raincoat. We can make this kind of
    decision in Scratch using the if-then blocks from the yellow Control section.
    Like loops, they wrap around other blocks and control when they are run.


    Spin block goes into window at top of if-then block


    # Spin control


    Let''s use if-then blocks to decide when our cat spins. We''ll use some light
    blue Sensing blocks, which ask a “true” or false?” question. Find them under the
    Scripts tab.


    ![](img/b061febeb032d536c8c7de6511458796_27_0.png)


    +   1 Start a new project


    Add this script. What do you think it does? The block inside each if-then block
    is only run if the answer to the question at the top of the block is “true.”


    Cat turns 15 degrees to the left


    ![](img/b061febeb032d536c8c7de6511458796_27_1.png)


    +   2 Run the script


    What happens? Nothing! Press the “a” key and the cat turns backward. Let the key
    go and it stops. The turn block inside the first if-then block is only run if
    the answer to the question key a pressed is “true.”


    Cat turns 15 degrees to the right


    +   3 Now press the “d” key


    The cat turns the other way. The turn block inside the second if-then block is
    only run when the answer to the question key pressed is “true.” If neither key
    is pressed, then both turn blocks are skipped.


    ![](img/b061febeb032d536c8c7de6511458796_27_2.png)'
