  mdcn: "\n\n# 学习基础 | 17\n\n别再倒立着了！\n这只可怜的猫有一半时间都是倒过来的——太糟糕了！为了停止这一点，点击角色列表角的角的蓝色\
    \ i。将会显示关于该角色的额外信息。将旋转样式改为 <->。尝试其他的旋转样式，看看猫会做什么。\n\n倒着向左移动\n\n![](img/b061febeb032d536c8c7de6511458796_18_0.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_18_1.png)\n\n猫面向它行走的方向，有时会是倒立的。\n\n\
    正立向右移动\n\n![](img/b061febeb032d536c8c7de6511458796_18_2.png)\n\n点击这里获取关于角色的信息\n\
    \n![](img/b061febeb032d536c8c7de6511458796_18_3.png)\n\n| 角色1 | 方向: -90 |\n|---|---|\n\
    | x: 84 y: 69 |\n| 旋转样式: 玩家: ↻ |\n\n猫面向左或向右，并且始终是正立的\n\n猫完全不旋转\n\n# 展示你的才华\n\n\
    这个测验你能答到多远？一直到最后\n\n- 1. 运动模块块（Motion blocks）是什么颜色的？\n2. Scratch 使用名为……的单位来测量距离。\n\
    2a. 舞台宽度是多少个这些单位？\n2b. 舞台高度是多少个这些单位？\n3. 程序中的错误被称为“bug（虫子）”。\n\n这个脚本应该让猫缓慢地穿过舞台，但当我点击绿色旗帜运行它时，什么都没有发生！出什么了？\n\
    \n```scratch\nforever\n  move 2 steps\n  if edge, bounce\n```\n\n![](img/b061febeb032d536c8c7de6511458796_18_4.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_18_5.png)\n\n我们喜欢 bug！\n\n![](img/b061febeb032d536c8c7de6511458796_18_6.png)\n\
    \n# 哪边？\n\n当你想要移动一个角色时，你需要知道两件事：多远和向哪个方向。每个角色都有一个内置的方向箭头。当脚本运行到深蓝色的移动块时，那就是角色将去的方向。\n\
    \n### 你将学习：\n- 如何让角色指向不同的方向\n- 如何让角色移动\n\n### 猫跟随鼠标！\n让我们让猫向所有可能的方向旋转。在 Scratch\
    \ 编辑器中打开一个新项目。为猫角色构建此条脚本。阅读这个脚本。你认为它在做什么？如果你猜对了，点击绿色旗帜。\n\n来自棕色的事件（Events）模块、来自黄色的控制（Control）模块、深蓝色的模块\n\
    \n![](img/b061febeb032d536c8c7de6511458796_19_0.png)\n\n在舞台上移动鼠标指针并观察猫绕着它旋转，它始终指向指针。**重复（forever）**块反复运行**指向鼠标指针（towards\
    \ mouse-pointer）**块。\n\n猫将跟随鼠标指针\n\n![](img/b061febeb032d536c8c7de6511458796_19_1.png)\n\
    \n如果不起作用，请检查旋转样式\n\n# 方向：–90°\n\n### 角色知道要去向哪里！\n\n角色信息面板上显示的方向圆\n\n每个角色都知道自己指向哪个方向。当你点击蓝色\
    \ ⓘ 时，角色信息面板会显示它的方向。\n\n方向 -90° 意味着“左”\n\n方向 0° 意味着“上”\n\n![](img/b061febeb032d536c8c7de6511458796_19_2.png)\n\
    \n随着猫旋转，你会看到它的方向值发生变化，蓝色指针在方向圆上移动。\n\n使用这里显示的“指南针”来解码方向数字。\n\n方向 180° 意味着“下”，\n\
    \n方向 90° 意味着“右”，\n\n## 选择角色的方向\n\n我们也可以使用**指向方向（point in direction）**块上的窗口来设置角色的方向。你可以点击数字旁的小三角形来获取有用的方向，或者直接点击窗口并输入数字。\n\
