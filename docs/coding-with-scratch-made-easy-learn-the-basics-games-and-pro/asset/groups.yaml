    Choose one of the music loops, likes "dance," and click OK in the bottom right
    to load. The sound will appear on the list of sounds.


    ![](img/b061febeb032d536c8c7de6511458796_26_2.png)


    Choose your groove!

    Plays the sound before going to the next block


