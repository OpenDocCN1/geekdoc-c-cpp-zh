  - '[PAGE 37]


    # A game: Dragon!


    We''ve learned a lot about Scratch so far. Now let''s put it all together into
    a game. You are the cat. You can control where you are on the stage using the
    computer mouse. Avoid the ferocious dragon for as long as you can!


    +   What you''ll learn:

    * How we put a game together from sprites and scripts

    * How to detect when two sprites touch

    * How a script can stop


    ![](img/b061febeb032d536c8c7de6511458796_37_0.png)


    # Enter the dragon


    Add the "Dragon" sprite to the project. Add a variable for all sprites, and give
    it the name speed.


    Leave this box checked


    ![](img/b061febeb032d536c8c7de6511458796_37_1.png)


    # Get the dragon bouncing


    Choose the dragon in the sprite list and add this script. This is the bouncing
    script we used before, but with a slight change. We control the dragon''s speed
    with a variable and set the dragon off in a different direction in each game.
    Read and run the script. The dragon bounces around the stage.


    Points dragon in a new direction when run


    ![](img/b061febeb032d536c8c7de6511458796_37_2.png)


    # Mouse controls cat!


    Now select the cat in the sprite list and add this script. Carefully read the
    script. It "sticks" the cat to the mouse-pointer. Inside the loop it also checks
    if we''re touching the dragon. If we are, it stops the project—game over! Run
    the script to check that it works.


    Wait block lets dragon move away


    If true, then all scripts stop


    ![](img/b061febeb032d536c8c7de6511458796_37_3.png)'
