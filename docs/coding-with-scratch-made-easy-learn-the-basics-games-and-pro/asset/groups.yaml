- md: "\n## 44 | Games\n\nKicking off\nScratch Cat wants a kick-off spot and a goal\
    \ to score in. A special kind of block called a variable will help you keep track\
    \ of how many goals are scored during the game.\n\nLoad two new sprites from the\
    \ library: \"Button1\" (the green circle) and \"Button5\" (the black X). Drag\
    \ Button1 to the right of the stage, halfway down, and rename it \"Goal.\" Then\
    \ drag Button5 to halfway down on the left and rename it \"Start.\"\n\n![](img/b061febeb032d536c8c7de6511458796_45_0.png)\n\
    \n### Fishball\nby HappyShrimp123 (unshared)\n\nNew sprites:\n\n![](img/b061febeb032d536c8c7de6511458796_45_1.png)\n\
    \nThese two sprites don't need scripts—they're just markers you can send other\
    \ sprites to.\n\nThe new sprites will appear in the sprite list\n\nIn the orange\
    \ Data blocks, click on Make a Variable. Type \"Score\" as the variable's name\
    \ in the pop-up window and hit OK. When the block for the variable Score appears\
    \ in the Data section, make sure the check box beside it is checked.\n\n## Reminder:\
    \ Variables\n\nA variable is like a labelled box in which you can store data,\
    \ such as words or numbers. The data stored in a variable is known as its value.\
    \ The new variable you made has a label, Score. It stores the number of goals\
    \ the cat scores in a game of Fishball. The number of goals is the variable's\
    \ value.\n\nIn this window\n\nSelect For all sprites\n\n![](img/b061febeb032d536c8c7de6511458796_45_2.png)\n\
    \nChecking this box shows the score on the stage\n\nMake a Variable\n\n![](img/b061febeb032d536c8c7de6511458796_45_3.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_45_4.png)\n\nNext, put these two blocks\
    \ into the soccer ball's script after the when green flag clicked and before the\
    \ forever loop. The orange set to block sets the score to zero at the beginning\
    \ of the game. The dark blue go to block sends the ball to the black x ready for\
    \ the kick-off.\n\n![](img/b061febeb032d536c8c7de6511458796_46_0.png)\n\nResets\
    \ score to 0\n\n![](img/b061febeb032d536c8c7de6511458796_46_1.png)\n\nSends the\
    \ soccer ball back to the start sprite\n\nYou can add a sound to signal when a\
    \ goal is scored. Select the soccer ball, go to the Sounds tab, and click on Choose\
    \ from library (the speaker symbol). In the library, select “rattle” and click\
    \ OK to load it into the project.\n\nSounds for the sprite can be seen under this\
    \ tab\n\n![](img/b061febeb032d536c8c7de6511458796_46_2.png)\n\n![](img/b061febeb032d536c8c7de6511458796_46_3.png)\n\
    \nClick on the speaker symbol to go to the sound library\n\nThe “rattle” sound\
    \ will appear under the Sounds tab\n\n![](img/b061febeb032d536c8c7de6511458796_46_4.png)\n\
    \nClick on the Scripts tab and insert the group of blocks below into the ball's\
    \ script. Place it under the first if-then group, but not inside it. Make sure\
    \ it is still inside the forever loop. You can see the whole script in the next\
    \ step.\n\n![](img/b061febeb032d536c8c7de6511458796_46_5.png)\n\nThis block, from\
    \ Sensing, detects when the ball touches the goal\n\nRattle sound plays each time\
    \ a goal is scored\n\nThe blocks inside the if-then run only when the ball is\
    \ touching the goal\n\n```\nif touching Goal\n  play sound rattle\n  change Score\
    \ by 1\n  wait 1 secs\n  go to Start\n```\n\nAdds 1 to the value of Score After\
    \ a second, the ball goes back to the black X\n\nThe soccer ball's script should\
    \ now look like this. Run the script and see what happens. The ball now starts\
    \ on the black x. Scratch kicks the ball into the green goal, the score rises\
    \ by one point and the ball returns to starting position.\n\n```\nwhen clicked\n\
    set Score to 0\ngo to Start\nforever\n  move 10 steps\n  if on edge, bounce\n\
    \    play sound pop\n    point towards Cat\n    turn 180 degrees\n  move 10 steps\n\
    \  if touching Goal\n    play sound rattle\n    change Score by 1\n    wait 1\
    \ secs\n    go to Start\n```\n\nYou've got all the correct blocks in your script,\
    \ and they are in the order shown here\n\nLet's play!\n\n![](img/b061febeb032d536c8c7de6511458796_47_0.png)\n\
    \nThe pressure is on! Games are more difficult under pressure. Adding a time limit\
    \ will make Fishball more challenging. When the green flag is clicked, a 30-second\
    \ countdown will start.\n\nFishball\nby HappyShrimp123 (unshared)\nScore | 0\n\
    Time | 0\n\n![](img/b061febeb032d536c8c7de6511458796_47_1.png)\n\nMake a new variable\
    \ for all sprites called \"Time.\" Leave it checked so it shows on the stage.\
    \ The player will now know how much time is left in the game, as well as what\
    \ the score is Make sure this box is checked\n\n```\nMake a Variable [Score]\n\
    [Time]\n```\n\nAdd this script to the cat sprite. It will run separately from\
    \ the other script, but at the time\n\nReminder: Repeat loops A repeat loop repeats\
    \ the blocks inside it fixed number of times, then the next blocks run. In your\
    \ time-limit code, the loop takes 1 off the value of Time 30 times, then the action\
    \ moves to the next block (stop).\n\n![](img/b061febeb032d536c8c7de6511458796_48_0.png)\n\
    \nSets the time limit\nRepeats blocks inside loop 30 times\nTime counts down by\
    \ 1 second\nStops all scripts on sprites when count reaches 0—game over!\n\n![](img/b061febeb032d536c8c7de6511458796_48_1.png)\n\
    \nTry the game now. How many goals can you score in 30 seconds?\n\n![](img/b061febeb032d536c8c7de6511458796_48_2.png)\n\
    \n## Fishy business\n\nThe game’s about to get a lot harder! You're going to add\
    \ a fish goalkeeper to try stop Scratch Cat from scoring!\n\n![](img/b061febeb032d536c8c7de6511458796_48_3.png)\n\
    \nGo to the sprite library and load \"Fish1.\" Build the script shown on the right\
    \ in the fish’s scripts area. The fish should now swim toward the ball.\n\n![](img/b061febeb032d536c8c7de6511458796_48_4.png)\n\
    \nStarts at goal\nMakes fish follow ball\n\nSelect the soccer ball. Add this group\
    \ of blocks to the ball’s script to make it bounce off the fish. It’s the same\
    \ as the code that makes the ball bounce off the cat, but with \"Cat\" changed\
    \ to \"Fish1\" twice. Put it between the two if-then blocks, but not inside either\
    \ of them.\n\n| touching Fish1 ? then |\n| play pop |\n| point towards Fish1 |\n\
    | turn 180 degrees |\n| move 10 steps |\n\n![](img/b061febeb032d536c8c7de6511458796_49_0.png)\n\
    \nThe ball will keep bouncing around the stage forever unless the if-then questions\
    \ are true\n\nThe soccer ball's script is now complete. This is how it should\
    \ look. Read the script carefully. Run the script and check that it works as it\
    \ should.\n\nIf the ball touches the cat, it 'bounces' off the cat. It turns around\
    \ 180 degrees and then moves away from the cat\n\nIf the ball touches the fish,\
    \ it 'bounces' off the fish. It turns around 180 degrees and then moves away from\
    \ the fish\n\nIf the ball touches the goal (the green circle), the rattle sounds\
    \ and the score goes up by 1. The ball goes back to the start (the black X)\n\n\
    To make Facebook look like a soccer game, click the Choose backdrop from library\
    \ stage button in stage area, at the bottom-left of the screen. Select 'goal1,'\
    \ 'goal2,' or 'playing field.' Click OK to load your backdrop.\n\nClick here to\
    \ go to backdrop library\n\nGood job—you've made the Scratch game! Have fun playing\
    \ it! The skills you learned while making Facebook will help you to build the\
    \ other games in this book—and even to invent your own games.\n\nStage 1 backdrop\n\
    New backdrop:\n\n![](img/b061febeb032d536c8c7de6511458796_49_1.png)\n\n## Show\
    \ what you know\nYou’ve aced Fishball, but can you score with this quiz?\n\n1.\
    \ Label this map of the Scratch editor, using the key below the map. Write one\
    \ letter for each of the coloured sections.\n\n![](img/b061febeb032d536c8c7de6511458796_50_0.png)\n\
    \nA Stage area   B Blocks palette   C Scripts area   D Sprite list   E Stage info\
    \   F Backpack\n\n2. A ................................ repeats the blocks inside\
    \ it nonstop.\n3. An ................................... block either skips or\
    \ runs the blocks inside it.\n4. A ............................................\
    \ is a block that stores data.\n5. At the moment, the fish moves 4 steps at a\
    \ time. Would these changes to the fish’s move block make it swim faster or slower?\
    \ Circle your answers.\n\nNow   Change 1   Change 2\n\nFish 4 steps   Fish 2 steps\
    \   Fish 6 steps\nFish moves 4 steps   Faster / Slower   Faster / Slower\n\n6.\
    \ How could you make the ball move slower? ............................................\n\
    \n7. How could you increase the game’s time limit to 40 seconds? .....................................\n"
  mdcn: "\n\n## 44 | 游戏\n\n开球\n小猫（Scratch Cat）需要一个开球点和一个得分的球门。一种被称为**变量**的特殊积木将帮助你记录游戏过程中进了多少个球。\n\
    \n从资源库中加载两个新角色：“Button1”（绿色圆形）和“Button5”（黑色 X）。将 Button1 拖到舞台右侧的中间位置，并将其重命名为“Goal”（球门）。然后将\
    \ Button5 拖到左侧的中间位置并重命名为“Start”（开始）。\n\n![](img/b061febeb032d536c8c7de6511458796_45_0.png)\n\
    \n### 鱼球大战\n作者 HappyShrimp123 (未分享)\n\n新角色：\n\n![](img/b061febeb032d536c8c7de6511458796_45_1.png)\n\
    \n这两个角色不需要脚本——它们只是你可以用来发送给其他角色的标记。\n\n新角色将出现在角色列表中\n\n在橙色的“数据”分类中，点击“建立变量”。在弹出的窗口中输入变量名称为“Score”并点击确定。当\
    \ Score 变量积木出现在数据区域时，确保它旁边的复选框已勾选。\n\n## 提示：变量\n\n变量就像一个带标签的盒子，你可以在其中存储数据，例如单词或数字。存储在变量中的数据称为它的值。你创建的新变量有一个标签，即\
    \ Score。它存储了猫在“鱼球大战”游戏中的进球数。球数就是变量的值。\n\n在此窗口中\n\n选择“所有角色”\n\n![](img/b061febeb032d536c8c7de6511458796_45_2.png)\n\
    \n勾选此框将在舞台上显示比分\n\n建立变量\n\n![](img/b061febeb032d536c8c7de6511458796_45_3.png)\n\
    \n![](img/b061febeb032d536c8c7de6511458796_45_4.png)\n\n接下来，将这两个积木放入足球的脚本中，放在“当绿旗被点击”之后、“重复”循环之前。橙色的“将”积木在游戏开始时将分数设置为零。深蓝色的“去到”积木将球发送到黑色\
    \ X 准备开球。\n\n![](img/b061febeb032d536c8c7de6511458796_46_0.png)\n\n将比分重置为 0\n\n\
    ![](img/b061febeb032d536c8c7de6511458796_46_1.png)\n\n将足球送回起始角色\n\n你可以添加一个声音来作为进球信号。选择足球，切换到“声音”标签页，点击“从库中选择”（喇声器符号）。在库中选择“rattle”（沙沙声）并点击确定将其加载到项目中。\n\
    \n角色的声音可以在此标签下查看\n\n![](img/b061febeb032d536c8c7de6511458796_46_2.png)\n\n![](img/b061febeb032d536c8c7de6511458796_46_3.png)\n\
    \n点击喇声器符号进入声音库\n\n“rattle”声音将出现在“声音”标签下\n\n![](img/b061febeb032d536c8c7de6511458796_46_4.png)\n\
    \n点击“脚本”标签页，并将下方的积木组插入足球的脚本中。将其放在第一个“如果-那么”组下方，但不要放在它内部。确保它仍在“重复”循环内部。你可以在下一步中看到整个脚本。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_46_5.png)\n\n这个来自“侦测”的积木检测球是否碰了球门\n\
    \n每次进球都会播放沙沙声\n\n“如果-那么”内部的积木只有在球碰到球门时才会运行\n\n```\nif touching Goal\n  play sound\
    \ rattle\n  change Score by 1\n  wait 1 secs\n  go to Start\n```\n\n将 Score 的值加\
    \ 1。一秒后，球会回到黑色 X\n\n足球的脚本现在看起来应该是这样的。运行脚本并观察发生了什么。球现在从黑色 X 开始。Scratch 将球踢进绿色球门，分数增加一分，球返回起始位置。\n\
    \n```\nwhen clicked\nset Score to 0\ngo to Start\nforever\n  move 10 steps\n \
    \ if on edge, bounce\n    play sound pop\n    point towards Cat\n    turn 180\
    \ degrees\n  move 10 steps\n  if touching Goal\n    play sound rattle\n    change\
    \ Score by 1\n    wait 1 secs\n    go to Start\n```\n\n你的脚本中包含了所有正确的积木，并且它们的顺序所示所示\n\
    \n让我们玩玩吧！\n\n![](img/b061febeb032d536c8c7de6511458796_47_0.png)\n\n压力来了！在压力下游戏更加困难。增加时间限制会让“鱼球大战”更具挑战性。当绿旗被点击时，将开始\
    \ 30 秒倒计时。\n\n鱼球大战\n作者 HappyShrimp123 (未分享)\nScore | 0\nTime | 0\n\n![](img/b061febeb032d536c8c7de6511458796_47_1.png)\n\
    \n为所有角色创建一个名为“Time”的新变量。勾选它以便在舞台上显示。玩家现在知道游戏还剩多少时间，以及分数是多少。确保此框已勾选\n\n```\nMake\
    \ a Variable [Score]\n[Time]\n```\n\n将此脚本添加到猫猫角色。它将与其他脚本独立运行，但在时间上。提示：“重复”循环会执行内部固定次数的内容，然后执行下一个积木。在你的时间限制代码中，循环将\
    \ Time 的值减去 30 次，然后执行下一个积木（停止）。\n\n![](img/b061febeb032d536c8c7de6511458796_48_0.png)\n\
    \n设置时间限制\n在循环内重复 30 次\nTime 递减 1 秒\n当计数达到 0 时停止所有角色脚本！\n\n![](img/b061febeb032d536c8c7de6511458796_48_1.png)\n\
    \n现在尝试游戏。30 秒内你可以进几个球？\n\n![](img/b061febeb032d536c8c7de6511458796_48_2.png)\n\
    \n## 鱼危机\n\n游戏变得更加困难了！你将添加一条鱼守门员来阻止小猫得分！\n\n![](img/b061febeb032d536c8c7de6511458796_48_3.png)\n\
    \n去角色库加载“Fish1”。在鱼的脚本区域构建右侧所示的脚本。鱼现在应该向球游。\n\n![](img/b061febeb032d536c8c7de6511458796_48_4.png)\n\
    \n从球门开始\n让鱼跟随球\n\n选择足球。将这组积木添加到足球的脚本中，使其弹开鱼。这与让球碰到猫的代码相同，但将“Cat”两次改为“Fish1”。将其放在两个“如果-那么”积木之间，而不是放在其中任何一个内部。\n\
    \n| touching Fish1 ? then |\n| play pop |\n| point towards Fish1 |\n| turn 180\
    \ degrees |\n| move 10 steps |\n\n![](img/b061febeb032d536c8c7de6511458796_49_0.png)\n\
    \n除非“如果-那么”的问题为真，否则球将一直在舞台上跳动\n\n足球的脚本现在完成了。它应该是这样的。仔细阅读脚本。运行脚本并检查它是否正常工作。\n\n\
    如果球碰到猫，它会从猫那里反弹。它旋转 180 度并离开猫\n\n如果球碰到鱼，它会从鱼那里反弹。它旋转 180 度并离开鱼\n\n如果球碰到球门（绿色圆形），会发出沙沙声且分数加\
    \ 1。球回到起始位置（黑色 X）\n\n要让 Facebook 看起来像足球游戏，点击屏幕左下角舞台区域的“从库中选择背景”按钮。选择“goal1”、“goal2”或“playing\
    \ field”。点击确定加载你的背景。\n\n点击此处进入背景库\n\n做得好——你制作了一个 Scratch 游戏！玩得开心！在制作 Facebook\
    \ 时学到的技能将帮助你构建书中的其他游戏——甚至发明你自己的游戏。\n\n舞台 1 背景\n新背景：\n\n![](img/b061febeb032d536c8c7de6511458796_49_1.png)\n\
    \n## 展示你的所学\n你已经精通了“鱼球大战”，但你能通过这个小测验得分吗？\n\n1. 使用地图下方的标记标记这张 Scratch 编辑器地图。为每个彩色区域写一个字母。\n\
    \n![](img/b061febeb032d536c8c7de6511458796_50_0.png)\n\nA 舞台区域   B 积木面板   C 脚本区域\
    \   D 角色列表   E 舞台信息   F 道具箱\n\n2. 一个............................... 不断地重复其内部的积木。\n\
    3. 一个.................................. 积木要么跳过要么运行其内部的积木。\n4. 一个...........................................\
    \ 是存储数据的积木。\n5. 目前，鱼每次移动 4 步。对鱼的移动积木进行这些更改会让它游得更快还是更慢？圈出你的答案。\n\n现在   更改 1   更改\
    \ 2\n\n鱼 4 步   鱼 2 步   鱼 6 步\n鱼移动 4 步   更快 / 更慢   更快 / 更慢\n\n6. 你可以如何让球移动得慢一点？...........................................\n\
    \n7. 你可以如何将游戏时间限制增加到 40 秒？....................................\n\n"
