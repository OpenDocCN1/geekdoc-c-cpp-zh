    # Make, read, and run a script

    Click on Scripts tab and make this script. Read the script and run it. You should
    hear ending music!


    # Show what you know

    the cat''s in the mood for a party. Are you in the mood for a quiz?


    - 1. A background picture on the stage is called a ....................................

    - 2. The block that plays a sound before continuing:

    ```

    play sound [pop]

    ```

    ```

    play sound [pop] until done

    ```

    - 3. True or False?

    - a. A project can have only one backdrop. .........................

    - b. Only the sprite that loaded a sound can play it. ....................

    - c. The stage can have sounds and scripts. ..........................

    - d. Once you''ve chosen a backdrop for a script, you can''t change it. .......................

    - e. A sprite can use a script to change the stage''s backdrop. .........................


    # Learn the Basics


    # if-then


    If it''s raining, then we decide to wear a raincoat. We can make this kind of
    decision using if-then blocks from the yellow section. Like loops, they wrap around
    other blocks and control when they are run.


    # control


    Let''s use if-then blocks to decide when our cat spins. We''ll use some light
    blue Sensing blocks, which ask a "true" or false?" question. Find them under the
    Scripts tab.


    ![](img/b061febeb032d536c8c7de6511458796_27_0.png)


    - 1. Start a new project

    Add this script. What do you think it does? The block inside each if-then block
    is only run if the answer to the top of the block is "true."


    Cat turns 15 degrees to the left

    ![](img/b061febeb032d536c8c7de6511458796_27_1.png)


    - 2. Run the script

    What happens? Nothing! Press the “a” key and the cat turns backward. Let the key
    go and it stops. The turn block inside the first if-then block is only run if
    the answer to the key pressed is "true."


    Cat turns 15 degrees to the right

    - 3. Now press the “d” key

    The cat turns the other way. The turn block inside the second if-then block is
    only run when the answer to the key pressed is “true.” If neither key is pressed,
    then both turn blocks are skipped.


    ![](img/b061febeb032d536c8c7de6511458796_27_2.png)


    # A closer look at the if-then block


    Look at this if-then block taken from a script.

    Read carefully and think about what it does.


    If answer is "false", blocks are skipped


    Condition

    (answer is "true" or "false")


    If answer is "true", blocks are run


    - The if-then block is a yellow Control block, because it controls blocks when
    they are run.


    Press that key down!

    - An if-then block has a question known as a condition. The question must have
    a true/false answer.

    - The blocks inside the if-then block are only run when the answer to the question
    is "true".

    - If the answer to the question is "false", then the blocks inside the if-then
    block are ignored.

    - Add this if-then to your script so the cat meows when you press the "s" key.
    Put the if-then block inside the loop but outside the other if-then blocks.


    # Show what you know


    If you''re a Scratch expert, then you''ll find this bug hunt easy!


    This script should make the sprite change color when you press the space key,
    but the sprite changes color all the time. Can you spot the "bug"?


    # Variables


    Computers are excellent at storing information, or "data." This data could be
    someone''s name or the weight of a cake in a competition. A variable is like a
    labeled box in which you can store data until your program needs it.


    - What you''ll learn:

    - Variables store data in programs

    - How to make and use Scratch variables

    - Using variables makes code clearer


    # A box with a label


    A variable can store a number or some words (programmers call words a "string").
    The thing stored in a variable is called its value. You can change the value of
    a variable. Give variables helpful names to make the code easy to read.


    ![](img/b061febeb032d536c8c7de6511458796_29_0.png)


    Follow these instructions to create your first variable in Scratch.


    - Start with data

    Select Data under the Scripts tab.

    Then click on the Make a Variable button. The New Variable window will pop up.


    - Name it, check it, click it!

    First, give your variable a useful name.

    Check For *all sprites*, and click OK. (You can ignore the *For this sprite* only
    box.)


    ![](img/b061febeb032d536c8c7de6511458796_29_1.png)


    ![](img/b061febeb032d536c8c7de6511458796_29_2.png)


    - Get to know your blocks!

    Blocks for this variable will then appear in the blocks area. Make sure you know
    what each of the blocks does.


    ![](img/b061febeb032d536c8c7de6511458796_29_3.png)

