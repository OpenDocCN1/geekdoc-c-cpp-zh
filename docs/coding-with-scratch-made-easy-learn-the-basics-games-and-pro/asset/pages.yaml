    Player 1 wins!


    Rapid Reaction has only one sprite—a circle that turns from red to green


    # Playing the game


    Clicking the green flag shows the instructions on the stage. Each player has a
    different key to press: Player 1 the “Z” key, Player 2 the “M” key. When you''re
    ready to play, hit the space bar. Wait until the red circle turns green, then
    whoever presses fastest wins the game.'
