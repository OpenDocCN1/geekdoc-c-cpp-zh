  md: '# 44 | Games


    Kicking off

    Scratch Cat wants a kick-off spot and a goal to score in. A special kind of block
    called a variable will help you keep track of how many goals are scored during
    the game.


    Load two new sprites from the library: "Button1" (the green circle) and "Button5"
    (the black X). Drag Button1 to the right of the stage, halfway down, and rename
    it "Goal." Then drag Button5 to halfway down on the left and rename it "Start."


    ![](img/b061febeb032d536c8c7de6511458796_45_0.png)


    Fishball

    by HappyShrimp123 (unshared)


    New sprites:


    ![](img/b061febeb032d536c8c7de6511458796_45_1.png)


    These two sprites don''t need scripts—they''re just markers you can send other
    sprites to


    The new sprites will appear in the sprite list


    In the orange Data blocks, click on Make a Variable. Type "Score" as the variable''s
    name in the pop-up window and hit OK. When the block for the variable Score appears
    in the Data section, make sure the check box beside it is checked.


    # Reminder: Variables


    A variable is like a labelled box in which you can store data, such as words or
    numbers. The data stored in a variable is known as its value. The new variable
    you made has a label, Score. It stores the number of goals the cat scores in a
    game of Fishball. The number of goals is the variable''s value.


    In this window


    Select For all sprites


    ![](img/b061febeb032d536c8c7de6511458796_45_2.png)


    Checking this box shows the score on the stage


    Make a Variable


    ![](img/b061febeb032d536c8c7de6511458796_45_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_45_4.png)'
