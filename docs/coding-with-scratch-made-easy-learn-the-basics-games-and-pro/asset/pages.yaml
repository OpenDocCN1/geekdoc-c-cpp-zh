  md: '# Learn the Basics


    # Loops


    In computer programs, we often want to carry out the same instructions more than
    once. To avoid having to put down the same blocks many times, we can wrap them
    in a loop instruction that repeats the blocks. Meet forever and repeat loops!


    +   * What you''ll learn:

    * How to repeat a group of blocks using a loop

    * The difference between forever and repeat loops

    * How to make some noise in Scratch


