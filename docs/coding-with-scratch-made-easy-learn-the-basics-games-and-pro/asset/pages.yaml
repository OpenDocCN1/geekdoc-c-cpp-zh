  md: '# 110 | Solutions


    pages 86–92 Pet party


    +   1. The when I receive block will only run the script below it when it gets
    a message from a broadcast block.

    2. The paint editor is where you draw new sprites.

    3. You can resize sprites using the grow and shrink tools.

    4. The hide block makes a sprite disappear from the stage.

    5a. If you draw the pupil in the very centre of the eye, you won''t notice the
    eye swivelling because it will be looking straight out of the picture.

    5b. If you draw the pupil at the "3 o''clock" position, rather than "3 o''clock",
    the eye will turn but it won''t appear to follow the mouse-pointer.

    5c. If the eye isn''t centred correctly, the whole eye will revolve around the
    centre, not just your poor pet will look very strange!

    6.


