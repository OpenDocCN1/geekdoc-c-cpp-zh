  md: '# 32 Learn the Basics


    # Inputs and events


    The data put into a program, such as the answer you type when Scratch asks a question,
    is called input. Events are actions, like clicking a sprite or pressing a chosen
    key, that Scratch can use to run scripts.


    +   What you''ll learn:

    - How to ask questions and use the answers

    - What an Event block is

    - How to run a script with a key press or click


    ![](img/b061febeb032d536c8c7de6511458796_33_0.png)


    # Just ask


    Sprites can use questions and answers using the light blue ask and answer blocks
    under the Sensing tab. Start a new project and add this script. Read the script.
    What do you think it does? Run the script to test your ideas.


    ![](img/b061febeb032d536c8c7de6511458796_33_1.png)


