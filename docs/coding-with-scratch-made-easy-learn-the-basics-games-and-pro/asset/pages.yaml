  md: '# Control your cat!


    We''ll start by creating a simple script to control the cat sprite. It will make
    the cat stick to the mouse-pointer like glue!


    +   Open the Scratch editor: either choose Create on the Scratch website or click
    the Scratch symbol on your computer. Call the project "Fishball."


    ![](img/b061febeb032d536c8c7de6511458796_42_0.png)


    +   Under the Scripts tab, go to the dark blue Motion section of the blocks palette.
    Click on the go to mouse-pointer block and drag it to the right scripts area.


    ![](img/b061febeb032d536c8c7de6511458796_42_1.png)


    +   Now click the yellow Control section and select the forever block. Drag over
    the go to block, then let go. The two blocks will look together.


    ![](img/b061febeb032d536c8c7de6511458796_42_2.png)


    +   Next, choose the brown Events section of the blocks palette. Click on the
    when green flag clicked and add it to the top of the forever block. Read the script
    through. What do you think it does?


    ![](img/b061febeb032d536c8c7de6511458796_42_3.png)


    > Reminder: Forever loops

    Loops are sections of code that repeat again and again. A forever loop repeats
    the blocks inside it—forever! In your script to control the cat, the forever loop
    keeps the cat "glued" to the mouse-pointer for the whole game.


    +   Click the green flag at the top of the stage to start (run) the script. The
    cat should move with the mouse-pointer. If not, check back through steps 1 to
    4.


    ![](img/b061febeb032d536c8c7de6511458796_42_4.png)'
