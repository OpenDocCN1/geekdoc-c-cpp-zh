  md: 'You can make your scripts easier to understand by renaming the cat. In the
    sprite list (below the stage), select the cat and click on the blue (i) in its
    top corner. Type "Cat" instead of "Sprite1" in the window of the sprite''s information
    panel.


    # Reminder: if-then


    An if-then block wraps around other blocks and uses "true or false?" question
    to control when the blocks are run. When Scratch reaches an if-then block, it
    runs the blocks inside only if the answer is true.


    Type "Cat" in this window to change the sprite''s name


