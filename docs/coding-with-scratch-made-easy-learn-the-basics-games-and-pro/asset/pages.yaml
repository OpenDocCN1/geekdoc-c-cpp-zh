  md: '# 50 | Games


    # Ghost hunt


    Things get spooky in this game! You''re a witch on a broomstick flying around
    the city at night in search of friendly ghosts. Ghost Hunt will put your keyboard
    skills to the test!


    The score and time left in the game are shown in


    The ghost glides eer across the screen


    Use the green flag and red button to start and stop the game


    ![](img/b061febeb032d536c8c7de6511458796_51_0.png)


    You can move the witch anywhere on the screen using the arrow keys on the keyboard


    # Playing the game


    Use the arrow keys to make the witch chase the ghost. When you touch the ghost,
    it disappears with a pop and you score a point. But the sneaky ghost can reappear
    anywhere, and it floats randomly around the stage! You have 30 seconds to score
    as many points as you can.'
