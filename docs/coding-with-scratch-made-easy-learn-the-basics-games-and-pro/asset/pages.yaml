  md: '# Getting Scratch


    You can code online at the Scratch website, but if you aren''t always connected
    to the Internet, you can install it on your computer. Ask a grown-up to help you.
    You will need the newer Scratch 2.0 for this book, not the old Scratch 1.4.


    +   What you''ll learn:

    * You need Scratch 2.0

    * How to use Scratch on a computer

    * How to join the Scratch website

    * How to save your projects


    ![](img/b061febeb032d536c8c7de6511458796_9_0.png)


    # Using Scratch online


    If you register for a Scratch account, you will be able to save your projects
    online and share them with friends.


    +   1 Sign up for Scratch

    Go to scratch.mit.edu and select Join Scratch for instructions on how to register.
    You will need to get permission from an adult with an e-mail address.


    +   2 Create in Scratch

    When you want to use Scratch, go to the Scratch website and click on Create. This
    will open the Scratch editor window.


    > Click on this file to see your saved projects


    ![](img/b061febeb032d536c8c7de6511458796_9_1.png)


    +   3 Save in Scratch

    Projects save automatically if you''re logged in to your Scratch account. You
    can see your saved projects by clicking on the file with an “S” at the top right
    of the screen.


    ![](img/b061febeb032d536c8c7de6511458796_9_2.png)


    Top tip from Scratch Cat

    Need to “right click” but only have one button on your mouse? Usually you can
    hold down the control (CTRL/ctrl) key or shift key on the keyboard as you click.
    Not working? Then ask the owner of the computer.


    ![](img/b061febeb032d536c8c7de6511458796_9_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_9_4.png)'
  merge: -1
