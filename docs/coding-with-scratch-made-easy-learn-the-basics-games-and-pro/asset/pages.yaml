  md: '# Learn the Basics

    Math


    Scratch can do all the math you know about. But some of the symbols it uses are
    different, to fit with what''s on your computer''s keyboard. We can do equations
    in Scratch and use variables in them. Scratch can even roll dice for us.


    +   What you''ll learn:

    - How to do math in Scratch

    - What math symbols computers use

    - How to do equations with variables

    - How to roll dice using the computer


    ![](img/b061febeb032d536c8c7de6511458796_31_0.png)


    # Math tools


    To do math you need the green Operator blocks. Each block does a different problem
    with the numbers in the two windows.


    The "+" block adds the two numbers in together.


    The "-" block takes the second number away from the first.


    # Placing operators


    Wherever you put an operator block, it will put the answer to the problem. So
    if you put it into the window of a say, the cat will say the answer.


    # Multiply (*)


    Scratch uses the "*" symbol, because "x" looks like a letter.


    # Divide (/)


    The keyboard has no division sign. Scratch uses "/" instead.


    ![](img/b061febeb032d536c8c7de6511458796_31_1.png)


    # Math and variables


    We can use operator blocks to solve problems with variables. For example, to find
    the total number of pets, we can use the add (+) block to add up the values of
    variables dogs and cats, and store the answer in a variable called pets.


    Add (+) block put into window of set block


    ![](img/b061febeb032d536c8c7de6511458796_31_2.png)'
  merge: -1
