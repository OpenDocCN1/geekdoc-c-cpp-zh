  md: '# Games | 53


    Click on the sprite symbol at the top of the sprite list to open the sprite library.
    Then select "Ghost1" and click OK to add it to your project.


    # Random numbers


    A random number is one you can''t guess in advance. In games, like rolling dice,
    you can use random numbers to make the action difficult to predict.


    Next, build the script below in Ghost1''s script area. This script uses randomly
    chosen to make the ghost float unpredictably around the stage. Run the script.


    ![](img/b061febeb032d536c8c7de6511458796_54_0.png)


    ```

    when clicked

    show

    forever

    glide 1 secs to x: pick random -200 to 200

    y: pick random -150 to 150

    ```


    Makes the ghost appear at the start of the game


    Scratch picks random numbers from within this range


    > The glide block moves the ghost smoothly to the new x-y position


    From green Operators blocks


    > The forever loop makes the ghost change direction every second


    # Time''s running out!


    # Scoring, timing, and music


    At the moment, you have two sprites and a nice backdrop. To turn this project
    into a game, you need to set up a scoring system and a time limit. Adding some
    music will help make the game more fun.


    ![](img/b061febeb032d536c8c7de6511458796_54_1.png)


    Select the witch, then go to the orange Data section. Create two new variables
    for all sprites and call them "Score" and "Time." Leave their boxes checked so
    they show on the stage during the game.


    Now add this script to the witch sprite. It sets the score to zero at the start
    of the game. Then it counts down the seconds from 30 and ends the game at 0.


    After 30 seconds, this block ends the game


    ```

    when clicked

    set Score to 0

    set Time to 30

    repeat 30

    wait 1 secs

    change Time by -1

    ```


    Score always starts from 0'
