  md: '# Good-bye Scratch Cat, hello witch!


    The player''s sprite for this game will be the witch. You won''t need Scratch
    Cat on the stage, so it''s best to delete him.


    +   Start a new project. Click on the File menu and select New. Call the project
    ''Ghost Hunt.'' As usual, you''ll see Scratch Cat on the stage.


    +   Go to the sprite list. Right-click on the cat with the computer mouse. Choose
    delete from the pop-up menu.


    ![](img/b061febeb032d536c8c7de6511458796_52_0.png)


    ![](img/b061febeb032d536c8c7de6511458796_52_1.png)


    ![](img/b061febeb032d536c8c7de6511458796_52_2.png)


    Click on the sprite symbol at the top of the sprite list to go to the library.
    Select the ''Witch'' sprite and click OK to load her into your game.


    ![](img/b061febeb032d536c8c7de6511458796_52_3.png)


    ![](img/b061febeb032d536c8c7de6511458796_52_4.png)


    ![](img/b061febeb032d536c8c7de6511458796_52_5.png)


    # New skill: Coordinates


    Scatch uses a pair of numbers called x-y coordinates to pinpoint a sprite''s position
    on the stage. The x coordinate tells you where the sprite is across the stage,
    left or right. The y coordinate shows its up or down position. The coordinates
    will be positive for right and up, and negative for left and down. In Ghost Hunt,
    you''ll use coordinates to send sprites to different parts of the stage.


    ![](img/b061febeb032d536c8c7de6511458796_52_6.png)


    The x coordinate is always written first


    The y axis goes from -180 to 180


    The x axis goes from -240 to 240'
