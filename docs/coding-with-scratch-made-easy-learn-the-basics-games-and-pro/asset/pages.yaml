  md: '# Fishball


    Are you ready to build Fishball, your first complicated game? Don''t worry, you
    won''t have to do it all at once. Just follow the numbered steps and put the project
    together piece by piece.


    +   What you''ll learn:

    - How to build simple scripts to make a game

    - How to add sprites, backdrops, and sounds to improve your game

    - How to keep track of the time and score


    The score and time left in the game are shown here


    The fish follows the ball around the stage


    Use the green flag and red button to start and stop the game.


    ![](img/b061febeb032d536c8c7de6511458796_41_0.png)


    Kick-off spot


    The cat is controlled by the mouse-pointer


    The ball bounces off the cat and the fish


    Goal


    # Playing the game


    Scratch Cat is playing soccer. Use the mouse-pointer to move him around the stage
    and deflect the ball onto the green circle to score a goal. But watch out for
    the fish goalkeeper—she will do her best to stop you!'
