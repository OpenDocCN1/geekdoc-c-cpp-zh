  md: '# ## Choosing sprite’s direction


    We can also set sprite’s direction using the window on the **point in direction**
    block. You can click on the little triangle beside the number for useful directions,
    or just click on the window and type in a number.


    # ## Bouncing off the walls again


    Add the **point in direction 45** block to the “bouncing off the walls” script
    from page 16. Put it after the **when green flag clicked** block but before the
    **forever** block. Run the script. The cat will set off diagonally. Try using
    different directions and rotation styles.


    ![](img/b061febeb032d536c8c7de6511458796_20_0.png)


    # ## Show what you know


    Know your way around Scratch? Then try these brain teasers!


    +   1. What number should replace the **?** in this block to set the sprite’s
