  md: '# # Which way?


    When you want to move a sprite, you need to know two things: how far and which
    way. Every sprite has a built-in direction arrow. When a script gets to a dark
    blue move block, that''s the direction in which the sprite will go.


    +   ### What you''ll learn:

    - How to point a sprite in different directions

    - How to make a sprite move


    ### Cat follows mouse!

    Let''s spin our cat in every possible direction. Open a new project in the Scratch
    editor. Build this script for the cat sprite. Read the script. What do you think
    it does? Click the green flag if you guessed correctly.


    From brown Events blocks From yellow Control blocks From dark blue blocks


    ![](img/b061febeb032d536c8c7de6511458796_19_0.png)


    Move the mouse-pointer around the stage and watch the cat turn around it always
    looks toward the pointer. The **forever** block runs the **towards mouse-pointer**
    block over and over.


    The cat will follow the mouse-pointer


    ![](img/b061febeb032d536c8c7de6511458796_19_1.png)


    If it doesn''t work, check rotation style


    # direction: –90°


    # ### Sprites know where to go!


    Direction circle shown on sprite information panel


    Every sprite knows what direction it''s pointing. A sprite''s direction is shown
    in the sprite information panel when you click the blue ⓘ


    Direction -90° means "left"


    Direction 0° means "up"


    ![](img/b061febeb032d536c8c7de6511458796_19_2.png)


    As the cat spins around, you''ll see its direction value change and the blue line
    pointer move around the direction circle.


    Use the "compass" shown here to decode the direction number.


    Direction 180° means "down",


    Direction 90° means "right",'
