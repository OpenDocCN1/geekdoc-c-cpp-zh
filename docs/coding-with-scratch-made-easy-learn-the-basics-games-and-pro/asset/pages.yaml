    22 Build this code for the mouth. When the script receives the message "Eat,"
    it plays the sound of eating and makes the mouth look as though it''s swallowing
    the food, which disappears. Congratulations—you''ve completed Pet Party! Click
    the flag to try it out. Why not make your own features to add to the project?


    # New skill: Messages


    Scratch sprites can use messages to "talk" to each other.


    ```

    when I receive Eat

    ```


    This block broadcasts (sends out) a message that tells other sprites to do something.


    ```

    broadcast Eat and wait

    ```


    This block tells other sprites to do something but waits until they finish before
    continuing.


    ![](img/b061febeb032d536c8c7de6511458796_92_4.png)


    Click on the arrow and select "Eat"


    ```

    when I receive

    go go to

    repeat 5

    play sound chomp

    hide

    wait 0.1 seconds

    show

    wait 0.1

    ```


    Click on the arrow and select "chomp"


    Type "0.1" into the window of wait block


    ```

    when I receive Eat

    ```


    This block runs any script below it when it receives a particular broadcast message.


    ![](img/b061febeb032d536c8c7de6511458796_92_5.png)'
