  md: '# # Installing Scratch on a computer


    If you don''t have access to the Internet or you want to work offline, you''ll
    need the Scratch installer. Go to scratch.mit.edu/scratch2download and just follow
    the installation instructions.


    To start Scratch, just double-click the Scratch 2.0 icon on your desktop.


    ![](img/b061febeb032d536c8c7de6511458796_10_0.png)


    # ## Operating systems


    Check that your computer''s operating system is able to run Scratch.


    +   - The online version of Scratch 2.0 will run on Windows (PC), OS X (Macs),
    and some Linux computers.


    +   - The offline version might not work with some Linux computers.


    +   - The Raspberry Pi can''t run Scratch 2.0 at the moment.


    ![](img/b061febeb032d536c8c7de6511458796_10_1.png)


    # ## Scratch online community


    On the Scratch website you can share your projects and try out other coders''
    Scratch creations. Even better, you can explore how every project works and even
    change (“remix”) them. Look out for the buttons shown below.


    ![](img/b061febeb032d536c8c7de6511458796_10_2.png)'
