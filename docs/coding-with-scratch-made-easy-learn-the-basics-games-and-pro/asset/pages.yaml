  md: '# Bounce painting


    Scratch has a magic pen that can draw lines wherever sprite goes. In this project,
    you''ll create two balls that bounce around the stage drawing beautiful, changing
    patterns.


    # What you''ll learn:


    +   - That Scratch has a pen that can draw lines when a sprite moves

    - That local variables let identical copies of sprites store different data


    This project looks great full-screen!


    The two balls bounce around the stage


    Each time the balls move a step, a coloured line is drawn between them


    ![](img/b061febeb032d536c8c7de6511458796_94_0.png)


    The line changes colour each time to create multicoloured patterns


    A dark or black background shows the patterns best


    # ▲ What you do


    You simply click the green flag to set the balls in motion. They always set off
    with a random speed and direction, so you never get the same pattern twice. After
    a while, the screen fills up, so the project has a script to clear the stage.'
  merge: -1
