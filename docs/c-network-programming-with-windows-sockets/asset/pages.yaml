    # Asynchronously Finding a Host’s IP Address


    In the introduction to `gethostname()`, I said that there was one caveat with
    its use. In the `getXbyY` functions, one of which is `gethostbyname()`, the data
    retrieved might come from the local host or might come by way of a request over
    the network to a server of some kind. As soon as network communications is introduced
    into the picture, you have to be concerned with response times and the responsiveness
    of the application to the user while those network requests are taking place.


    The `WSAAsyncGetHostByName()` function is the asynchronous version of `gethostbyname()`.
    It was added to WinSock to complement the Berkeley socket function for the message-passing
    architecture of Microsoft Windows. This function is described as asynchronous
    because calling the function doesn’t suspend execution of the calling application,
    but instead allows the application to continue until the request generated by
    `WSAAsyncGetHostByName()` has completed. When `gethostbyname()` or any other `getXbyY`
    function is called, there is no guarantee when that function might return with
    a response. If the function generates a network operation, the response time is
    indeterminate. While that request is outstanding, your program is halted; the
    user can’t move or close the window or even cancel the operation. Not only that,
    but in the nonpreemptive Windows 3.1 environment, other applications will suffer;
    the entire system will seem to come to a temporary, or not so temporary, halt.
    Using `WSAAsyncGetHostByName()` makes your application responsive to the user’s
    input and doesn’t adversely affect other applications running on the computer.
    Once the request has completed, a Windows message is posted to a window in the
    application. While the request is still outstanding (for example, if the networked
    domain name server is doing a database lookup and preparing to send the search
    results back over the network) the message loop in the calling application, as
    well as the message loops of the other applications running on the computer, continue
    to operate, making all the programs responsive to user manipulation.'
