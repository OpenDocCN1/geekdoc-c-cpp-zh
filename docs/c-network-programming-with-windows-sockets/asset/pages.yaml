- pgno: 240
  md: 'as a server, it must be bound to a specific port or service name. To do that,
    call the function in one of the following ways:


    ```

    int nPort;

    char pszServiceName[100];

    int nStatus;

    ```


    ```

    ...assign port or service name...

    ```


    ```

    nStatus = m_ps->CreateSocket(nPort);

    nStatus = m_ps->CreateSocket(pszServiceName);

    ```


    If this socket isn’t a server, simply call CreateSocket(), as in:


    ```

    nStatus = m_ps->CreateSocket();

    ```


    A client must connect to a server before it can send or receive data. A connection
    is made by specifying a host specifier. There are five possible ways to call Connect():


    ```

    char pszHostName[100];

    char pszHostIP[100];

    int nPort;

    char pszServiceName[100];

    SOCKADDR_IN sin;

    int nStatus;

    ```


    ```

    ... assign destination specifiers ...

    ```


    ```

    nStatus = m_ps->Connect(pszHostName, nPort);

    nStatus = m_ps->Connect(pszHostIP, nPort);

    nStatus = m_ps->Connect(pszHostName, pszServiceName);

    nStatus = m_ps->Connect(pszHostIP, pszServiceName);

    nStatus = m_ps->Connect(&sin);

    ```


    A server must accept a connection from a client before data transfer can take
    place. When a connection is accepted, a new CStreamSocket object is used. The
    Accept() member function is called in response to the CWIN­SOCK_READY_TO_ACCEPT_CONNECTION
    message from the server stream socket:


    ```

    CStreamSocket *psClient; // will communicate with the client

    int nStatus;

    ```


    ```

    psClient = new CStreamSocket(this, WM_USER + 2);

    ```


    ```

    // m_ps is the server socket

    nStatus = m_ps->Accept(psClient);

    ```


    If a server wishes to know the Internet address of the client on the other side
    of an accepted connection, GetPeerName() is used. This function is called from
    the socket passed to the Accept() call, as in:


    ```

    SOCKADDR_IN sin; // address of client on other side of socket

    int nStatus;

    ```


    ```

    nStatus = psClient->GetPeerName(&sin);

    ```'
