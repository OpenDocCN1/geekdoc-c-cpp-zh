  md: '**FIGURE 7.2.**

    *Client/server WinSock function flow using UDP.*


    ![](img/5e551abe6e0cb0588043ee757a235ddb_100_0.png)


    # Creating an End-Point of Communication


    The `socket()` function creates an end-point of communication called a *socket*.
    Its function prototype is as follows:


    ```

    SOCKET PASCAL FAR socket(int af, int type, int protocol);

    ```


    `af` specifies the address family this socket uses. WinSock 1.1 supports only
    the `AF_INET`, or Internet address family format. `type` is the type specification
    for the socket. For most applications, this value is either `SOCK_STREAM`, for
    a connection-oriented byte stream, or `SOCK_DGRAM`, for connectionless datagram
    service. `protocol` is the particular protocol to use and is usually set to 0
    (zero), which lets `socket()` use a default value. The protocol can be defaulted
    because the address family (`af`) and socket type (`type`) combination already
    uniquely describe a socket’s protocol. If the family is `AF_INET` and the socket
    type is `SOCK_DGRAM`, the protocol must be UDP. Likewise, if the family is `AF_INET`
    and the socket type is `SOCK_STREAM`, the protocol must be TCP.


    On success, `socket()` returns a socket descriptor. On failure, `INVALID_SOCKET`
    is returned and `WSAGetLastError()` should be called to find out the reason for
    the error. Possible error values include the following: `WSANOTINITIALIZED` if
    `WSAStartup()` wasn’t called successfully; `WSAENETDOWN` if the network subsystem
    is failing; `WSAEAFNOSUPPORT` if the address family specified by `af` isn’t supported;
    `WSAEINPROGRESS` if a blocking WinSock operation is currently in progress; `WSAEMFILE`
    if there are no more free socket descriptors; `WSAENOBUFS` if no buffer space
    can be created; `WSAEPROTONOSUPPORT` if the protocol specified by `protocol` isn’t
    supported; `WSAEPROTOTYPE` if the protocol is the wrong type for this socket;
    or `WSAESOCKTNOSUPPORT` if the socket type specified by `type` isn’t supported
    in the address family specified by `af`.'
