- pgno: 10
  md: '# Electronic Forms


    With electronic forms an organization can easily exchange structured information.
    E-forms are the modern-day equivalent of the printed paper form. A simple example
    of a form is the popular “While You Were Out” message your secretary might fill
    out. By combining e-forms with an e-mail system, your messages will appear as
    nicely formatted, standardized e-mail messages instead of pieces of paper scattered
    about your desk. Another use of an e-form might be by a salesman who enters a
    customer’s order on his laptop computer while on site. The e-form is then either
    immediately transferred to a host computer using a modem or transferred at the
    end of the business day in a batch-type mode where all the day’s orders are sent.


    # Workgroup Scheduling


    Workgroup scheduling helps coworkers manage their time and communicate with each
    other more effectively. A network scheduling program provides network computer
    users with the ability to view and modify each other’s day planners. This ability
    makes it easier to schedule group meetings, make personal appointments, and assign
    tasks to an available individual. Microsoft’s Windows for Workgroups and Windows
    NT include a scheduling program that has this capability.


    # Chat


    A chat utility can replace a phone call for simple one-to-one or one-to-many communications.
    Under a UNIX-based operating system, the chat utility is called talk. In the Windows
    and Windows NT environment, the chat utility is called Chat and is executed by
    running the WINCHAT.EXE program. With both programs you can connect to at least
    one other network user and then type messages back and forth.


    # World Wide Web and Mosaic


    On a more global scale, the World Wide Web (WWW) is gaining in popularity. The
    WWW was started at CERN, the European Laboratory for Particle Physics. Its original
    purpose was to facilitate the communication between fellow particle physicists.
    WWW is a distributed system with which users can access documents of varying types,
    from simple text files to graphical images stored in the GIF or JPEG format. The
    data may'
