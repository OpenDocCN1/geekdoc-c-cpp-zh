  md: "# Class C\n\nClass C IP addresses are identified by a high-order bit sequence\
    \ of one one zero. The next highest order twenty-one bits identify the network.\
    \ The remaining eight bits identify the host.\n\n**FIGURE 2.7.**  \n*Class C IP\
    \ address format.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_32_0.png)\n\n#\
    \ Dotted Decimal Notation\n\nIf the format of an IP address sounds confusing,\
    \ don’t worry. An IP address is usually represented by the dotted decimal notation.\
    \ An IP address’ dot notation is comprised of 4 decimal values in the range of\
    \ 0 to 255 separated by a period or dot (.). Each value represents 8 bits of the\
    \ IP address. The 4 values together are the 32 bits of the IP address.\n\nI’ll\
    \ use the IP address of my computer as an example. Its address in dotted decimal\
    \ format is 166.78.4.139. Figure 2.8 shows the binary interpretation of this IP\
    \ address. Bit 31 is a 1, so that indicates this computer is either a class C\
    \ or network. Bit 30 is a 0 indicating that the computer does belong to a class\
    \ B network. The earlier discussion of network classes said that class B addresses\
    \ allowed 14 bits for the network id part and 16 bits for the host id part. The\
    \ dividing line separating the network part from the host part is between bits\
    \ 15 and 16. You can read this to mean the computer resides on network 166.78\
    \ and is host 4.139.\n\n**FIGURE 2.8.**  \n*IP address decoding.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_32_1.png)\n\
    \n![](img/5e551abe6e0cb0588043ee757a235ddb_32_2.png)\n\n# NOTE\n\n> If remembering\
    \ the dotted decimal notation of a computer still sounds too confusing, read on:\
    \ The implementors of TCP/IP realized that humans would need an easy method of\
    \ accessing this information, so they devised a method whereby a simple-to-remember\
    \ textual name symbolizes an IP address. The name-to-IP-address translation is\
    \ supported by several methods with the"
