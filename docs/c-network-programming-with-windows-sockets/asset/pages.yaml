- pgno: 112
  md: '**TIP**


    Calling `WSAAsyncSelect()` automatically puts the socket into a nonblocking state.
    There is no need to use `ioctlsocket()` to do this first.


    `WSAAsyncSelect()` is capable of monitoring several socket events. Table 7.1 lists
    these events, which are represented by `lEvent` in the function prototype.


    # **Table 7.1.** `WSAAsyncSelect()` Events.


    | Event | Meaning |

    |---|---|

    | `FD_READ` | Socket ready for reading |

    | `FD_WRITE` | Socket ready for writing |

    | `FD_OOB` | Out-of-band data ready for reading on socket |

    | `FD_ACCEPT` | Socket ready for accepting a new incoming connection |

    | `FD_CONNECT` | Connection on socket completed |

    | `FD_CLOSE` | Connection on socket has been closed |


    The `lEvent` parameter is constructed by doing a logical OR on the events in which
    you’re interested. For example, the following code will post a `WM_USER + 1` message
    to the window handle specified by `hWnd` when there is an incoming connection
    to socket `s` or when socket `s` has data to be read:


    ```

    long lEvent = FD_ACCEPT | FD_READ;

    WSAAsyncSelect(s, hWnd, WM_USER + 1, lEvent);

    ```


    **TIP**


    Issuing `WSAAsyncSelect()` for a socket cancels any previous `WSAAsyncSelect()`
    for the same socket. You can’t do separate calls like this:


    ```

    WSAAsyncSelect(s, hWnd, WM_USER + 1, FD_ACCEPT);


    WSAAsyncSelect(s, hWnd, WM_USER + 1, FD_READ);

    ```


    The preceding code will ignore `FD_ACCEPT` events; only `FD_READ` events will
    be posted as message `WM_USER + 1`.


    You also can’t use separate calls to `WSAAsyncSelect()` to assign different messages
    to the different events for a specific socket. For example, the following code
    is incorrect:


    ![](img/5e551abe6e0cb0588043ee757a235ddb_112_0.png)


    ![](img/5e551abe6e0cb0588043ee757a235ddb_112_1.png)'
