    ```\n```\n\nThe CServerView object handles the actual communication with the client.\
    \ Its m_pStream member variable is the stream socket that actually receives data\
    \ from and sends data to the client.\n\nCServerView’s OnStream() member function\
    \ receives status information for the stream socket object that does the actual\
    \ communication with the client. It’s triggered by the WM_USER_STREAM user-defined\
    \ message whenever a client connection is made or lost, and when data is available\
    \ to be read or finished being written.\n\nThe m_pStream object is then used to\
    \ accept the client connection request. When the connection is made, OnStream()\
    \ is called with wParam set to WINSOCK_YOU_ARE_CONNECTED. When data arrives from\
    \ the client, OnStream() is called with wParam set to WINSOCK_DONE_READING. The\
    \ database command is read and carried out. A response is formulated and sent\
    \ back to the client. When the write finishes, OnStream() is called with wParam\
    \ set to WINSOCK_DONE_WRITING letting the server know the data send has completed.\n\
    \nCServerView also has a datagram socket that, in combination with the timer handled\
    \ by OnTimer(), handles the periodic sending of a heartbeat message to the client.\
    \ Notice the HEARTBEAT_TEST #ifdef in the CServerView’s OnTimer() function. By\
    \ defining this variable, the client’s traffic light feature is easily tested.\
    \ After the client is connected to the server for 10 and then 20 seconds, the\
    \ client’s status should go from green to yellow to red, and back to green."
