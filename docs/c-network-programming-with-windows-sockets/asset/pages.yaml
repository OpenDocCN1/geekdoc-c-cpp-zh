    \ = WSAGetLastError();\n        nStatus = CWINSOCK_WINSOCK_ERROR;\n    }\n\n \
    \   return (nStatus);\n}\n```\n```\n\n# ## CStreamSocket::Write()\n\nThe `Write()`\
    \ member function writes data to the connected socket. The data is not immediately\
    \ sent out the socket, though. Instead, the data is added to the write queue.\
    \ The data is not sent until the stream socket receives the FD_WRITE message from\
    \ the WinSock subsystem, notifying it that sending is now possible.\n\nBecause\
    \ the data is not sent immediately, the data specified by the data pointer must\
    \ not be deallocated or reused until the window that owns the stream socket receives\
    \ the `m_umsg` message with `wParam` set to `CWINSOCK_DONE_WRITING` or `CWINSOCK_ERROR_WRITING`.\
    \ When this message is received by the application window, `lParam` is the pointer\
    \ to the data sent. At this point, the data specified by the pointer can be freed\
    \ or reused. If the `Write()` function fails immediately, denoted by the function\
    \ returning something other than `CWINSOCK_NOERROR`, the data pointer may be freed\
    \ or reused (the `m_umsg` write message will never be received for this data pointer).\n\
    \n`Write()` takes parameters that specify the number of bytes to send and a pointer\
    \ to the data. After the data and its length are added to the write queue, a message\
    \ is posted to the stream object to trigger the sending of the data. This message\
    \ is normally sent by the WinSock subsystem when it's safe to send data out the\
    \ socket. But when the last message arrived from the WinSock subsystem, there\
    \ may not have been any data in the write queue that was waiting to be sent. Faking\
    \ the WinSock `FD_WRITE` event causes the socket to check the write queue and\
    \ send the first piece of data waiting to be sent.\n\n```\n```cpp\n////////////////////////////////////////////////////////////\n\
    // CStreamSocket::Write()\n//\n// Write data to the socket..\n//\n// This function\
    \ takes an integer representing the length of the\n// data to send and a pointer\
    \ to the data to send.\n//\n```\n```"
