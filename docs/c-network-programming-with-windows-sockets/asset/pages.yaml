- pgno: 186
  md: '# #### 2.2.1 Single-Line Diagrams


    A single-line diagram (SLD) is a simplified graphical representation of an electrical
    power system or part of it. It uses single lines and standard symbols to represent
    three-phase (or sometimes single-phase) power systems. The single-line diagram
    is the most common type of electrical diagram used in power engineering.


    The following figure shows a typical single-line diagram of a simple power system.
    It includes generators, transformers, busbars, circuit breakers, and loads connected
    through transmission lines.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_186_0.png)


    In a single-line diagram, each device is shown with a standard symbol. For example,
    a generator is represented by a circle with a cross, a transformer by two circles
    or a pair of windings, and a circuit breaker by a switch symbol. The components
    are connected by a single line, which represents all three phases of the system.


    Single-line diagrams are used extensively in power system studies, such as load
    flow analysis, short-circuit analysis, and protection coordination. They provide
    a clear and concise way to understand the overall structure and operation of a
    power system.


    +   - **Components:** generators, transformers, busbars, circuit breakers, loads

    +   - **Connections:** transmission lines, cables

    +   - **Symbols:** standardized graphical symbols for each component'
