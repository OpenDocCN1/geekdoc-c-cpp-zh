- pgno: 29
  md: 'programs is going to be compressed, the application “is responsible” for the
    compression and decompression. In effect, the transport layer is absorbed into
    the application instead of being a separate entity as it is in the OSI model.
    For the sake of discussion, however, you can still think of the transport function
    as a logical layer.


    # Transport Layer


    The transport layer provides end-to-end data delivery. The OSI model’s session
    and transport layers fit into this layer of the TCP/IP architecture. The notion
    of OSI’s session connection is comparable to TCP/IP’s socket mechanism. A TCP/IP
    socket is an end-point of communications composed of a computer’s address and
    a specific port on that computer. OSI’s transport layer has an equivalent in TCP/IP’s
    TCP. TCP provides for reliable data delivery and guarantees that packets of data
    will arrive in the order they were sent, with no duplicates and with no data corruption.


    # Internet Layer


    The internet layer defines the datagram and handles the routing of datagrams.
    The datagram is the packet of data manipulated by the IP protocol. A datagram
    contains the source address, destination address, and data, as well as other control
    fields. This layer’s function is equivalent to that of the OSI’s network and datalink
    layers. The IP (as in the right-hand side of TCP/IP) is analogous to the network
    layer. It’s responsible for encapsulating the underlying network from the upper
    layers. It also handles the addressing and delivery of datagrams. The datalink
    layer isn’t usually represented in the TCP/IP architecture, but IP could be used
    to support this function.


    # Physical Layer


    TCP/IP makes no effort to define the underlying network physical connectivity.
    Instead, it makes use of existing standards provided by such organizations as
    the Institute of Electrical and Electronic Engineers (IEEE), which defines RS232,
    Ethernet, and other electronic interfaces used in data communications.


    The movement of a packet of data through the layers in a TCP/IP network is shown
    in Figure 2.3. When a packet of data is sent, it travels to the transport layer
    where the transport header is added. Next the internet layer adds its header.
    Finally, the physical layer attaches its header. When a packet of data is received,
    the process is reversed, resulting in the application’s reception of the intended
    data.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '**FIGURE 2.3.**

    Data movement through the TCP/IP layers.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_30_0.png)


    # TCP/IP Addressing Scheme


    One of TCP/IP’s distinguishing features described previously is its universal
    addressing scheme whereby each computer on a TCP/IP network has an address that
    uniquely identifies it. This universal addressing scheme extends even to the world-wide
    Internet, connecting more than two million computers that are connected to thousands
    of separate networks.


    It’s IP’s responsibility to deliver datagrams among the TCP/IP networked computers.
    To make such deliveries possible, each computer has a unique IP address composed
    of a 32-bit number. The IP address contains sufficient information to uniquely
    identify a network and a specific computer on the network.


    # Network Classes


    Because a computer’s IP address must uniquely identify not only the computer but
    also the network the computer is attached to, the IP address is split between
    a network identifier (net id) part and a host identifier (host id) part. The split
    between these two identifiers isn’t the same for all IP addresses. The class of
    the address determines how many bits of the IP address are reserved for network
    identification and how many are reserved for host identification. There are five
    classes of IP address with only the first three relevant to the majority of users.
    Classes A, B, and C are for general-purpose use; classes D and E are reserved
    for special purposes and future use. Figure 2.4 shows the format of an IP address.


    **FIGURE 2.4.**

    IP address format.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_30_1.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'As far as the application programmer is concerned, no discernible difference
    exists among a class A, B, or C address. A computer with a class A address can
    communicate with a computer with a class C address just as well as a class A computer
    can communicate with another computer with a class A address. Table 2.1 shows
    the maximum number of networks and hosts that can exist for the different classes.


    **Table 2.1. IP address class allocation.**


    | Network Class | Networks | Hosts per Network |

    |---|---:|---:|

    | A | 126 | 16,777,214 |

    | B | 16,382 | 65,534 |

    | C | 2,097,150 | 254 |


    Not all network identifiers or host identifiers are available for use. Some addresses
    are reserved for special use. If Table 2.1 is compared to the following class
    descriptions, you''ll see that not all bit combinations are included in the counts
    of Table 2.1.


    # ## Class A


    Class A IP addresses are identified by a high-order bit of zero. The next highest
    order seven bits identify the network. The remaining 24 bits identify the host.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_31_0.png)


    # ## Class B


    Class B IP addresses are identified by a high-order bit of one and the next highest
    order bit set to zero. The next highest order fourteen bits identify the network.
    The remaining 16 bits identify the host.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_31_1.png)'
  merge: -1
  img_proc: true
