  md: "The implementation of the CMainView object is shown in Listing 8.15. This object\
    \ performs most of the work for the DESERV application. CMainView::OnInitialUpdate()\
    \ is called soon after the object is created. This function is responsible for\
    \ creating a socket, binding it to a name (with the port assigned by WinSock),\
    \ and waiting for data to arrive. When data is ready to be received or data can\
    \ be sent, the CMainView::OnAsyncSelect() member function is called due to the\
    \ message mapping of the user-defined message WM_USER_ASYNC_SELECT.\n\n# Listing\
    \ 8.15. MAINVIEW.CPP for DESERV.\n\n```\n```cpp\n// mainview.cpp : implementation\
    \ file\n//\n\n#include \"stdafx.h\"\n#include \"deserv.h\"\n#include \"mainview.h\"\
