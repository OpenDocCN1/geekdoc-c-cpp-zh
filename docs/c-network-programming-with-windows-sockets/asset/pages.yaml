  md: "# # Stream Echo Client and Server\n\nThese programs, SERV and SECLIENT, demonstrate\
    \ the use of nonblocking stream sockets. They use the following WinSock functions:\
    \ WSAStartup(), WSACleanup(), WSAGetLastError(), socket(), closesocket(), bind(),\
    \ connect(), accept(), WSAAsyncSelect(), send(), recv(), getsockname(), ntohs(),\
    \ and inet_ntoa(). The SESERV server application accepts a connection from a client,\
    \ receives data, and sends the data back to the client. The SECLIENT application\
    \ connects to the server, sends data to the server, and receives the echoed reply.\n\
    \n# ## Stream Echo Server SESERV\n\nThese programs are generated using Visual\
    \ C++’s AppWizard feature. Implementation is similar to DESERV, with the primary\
    \ difference being in the CMainView object. CMainView’s header is shown in Listing\
    \ 8.18. Listing 8.19 shows the implementation of the CMainView object. When CMainView::OnInitialUpdate()\
    \ is called, soon after the CMainView object is created, it creates a socket,\
    \ binds it to a name, and waits for a connection request. When a connection is\
    \ requested, data is ready to be received, or data can be sent, the CMainView::OnAsyncSelect()\
    \ member function is called due to the message mapping of the user-defined message\
    \ WM_USER_ASYNC_SELECT. This stream socket server application communicates with\
    \ only one client at a time due to the single m_sClient variable in the CMainView\
    \ class. Once m_sClient is connected, all other requests to connect are ignored\
    \ until the connection is closed by the originating client.\n\n# Listing 8.18.\
    \ MAINVIEW.H for SESERV.\n\n```\n```cpp\n// mainview.h : header file\n//\n\n/////////////////////////////////////////////////////////////////////////////\n\
    // CMainView form view\n\n#ifndef __AFXEXT_H_\n#include <afxext.h>\n#endif\n\n\
    class CMainView : public CFormView\n{\n    DECLARE_DYNCREATE(CMainView)\n\npublic:\n\
    \    SOCKET m_s;          // socket to listen for connections on\n    SOCKADDR_IN\
    \ m_addr;  // address of socket to listen on\n    SOCKET m_sClient;    // socket\
    \ to client\n```\n```"
