- pgno: 121
  md: "> Unfortunately, there are two conflicting interpretations of out-of-band implementation.\
    \ Internet RFC 793 introduced the concept of out-of-band data and RFC 1122 provided\
    \ the host requirements. The problem arises because the Berkeley implementation\
    \ of out-of-band data handling does not follow RFC 1122. Most TCP/IP stack providers\
    \ document their implementation so that you know which they use: BSD or RFC 1122.\
    \ Because of this difference of opinion, it is best not to use out-of-band data\
    \ in your applications. Of course, if your application must interoperate with\
    \ an existing client or server, perhaps running on a UNIX computer, you have no\
    \ choice.\n\nThe following demonstrates a typical call to `send()`:\n\n```\n```c\n\
    SOCKET s;             // socket to communicate over\nchar pszBuf[100];     //\
    \ buffer to send\nint nBufLen;          // number of bytes in buffer to send\n\
    int nBytesSent;       // bytes sent\nint nError;           // error status\n\n\
    // create, bind, and connect socket s ...\n\nlstrcpy(pszBuf, \"Hello, World!\"\
    );\nnBufLen = lstrlen(pszBuf);\n\nnBytesSent = send(s, pszBuf, nBufLen, 0);\n\
    if (nBytesSent == SOCKET_ERROR)\n{\n    nError = WSAGetLastError();\n}\nelse\n\
    {\n    // nBytesSent is the number of bytes successfully sent\n}\n```\n```\n\n\
    The `send()` function has the same problem with blocking as the `accept()`, `connect()`,\
    \ and `getXbyY` functions. If none of the data can be sent for some reason—because\
    \ the receiving socket has too much incoming data spooled up, for example—`send()`\
    \ blocks waiting for the receiver to read the spooled up data. While `send()`\
    \ is blocking, the user loses control over your application. To prevent this problem,\
    \ the `WSAAsyncSelect()` function is used to put the socket into nonblocking send\
    \ mode. The event of interest in this scenario is `FD_WRITE`. An `FD_WRITE` message\
    \ is posted when a socket is first connected with `connect()` or accepted with\
    \ `accept()`, and then after a `send()` fails with `WSAEWOULDBLOCK` and buffer\
    \ space becomes available. Therefore, an application can assume that sends are\
    \ possible starting from the first `FD_WRITE` message and lasting until a send\
    \ returns `WSAEWOULDBLOCK`. After such a failure, the application will be notified\
    \ that sends are again possible with a new `FD_WRITE` message."
