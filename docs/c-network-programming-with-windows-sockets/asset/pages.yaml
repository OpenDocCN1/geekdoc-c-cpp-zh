- pgno: 114
  md: "```\n```cpp\n//}}AFX_MSG_MAP\nEND_MESSAGE_MAP()\n\nLONG CServerWindow::OnAsyncSelect(WPARAM\
    \ wParam, LPARAM lParam)\n{\n    // wParam is the socket descriptor\n    // lParam\
    \ is a status or error indicator\n\n    // check for an error\n    if (WSAGETSELECTERROR(lParam)\
    \ != 0)\n        return 0;\n\n    // what event are we being notified of?\n  \
    \  if (WSAGETSELECTEVENT(lParam) == FD_ACCEPT)\n    {\n        // m_clientS is\
    \ defined as SOCKET in the CServerWindow class declaration\n        m_clientS\
    \ = accept(m_s, NULL, NULL);\n        if (m_clientS == INVALID_SOCKET)\n     \
    \   {\n            int nError = WSAGetLastError();\n            if (nError ==\
    \ WSAEWOULDBLOCK)\n            {\n                // There really isn't a client\
    \ ready to connect.\n                // This error should never occur for the\
    \ FD_ACCEPT event\n                // so it should be treated just like this event\n\
    \                // notification function hadn't been called.\n              \
    \  ;\n            }\n            else\n                // some other error\n \
    \               ;\n        }\n    }\n}\n```\n```\n\nNotice the call to `WSAGETSELECTERROR`.\
    \ This is a macro provided in WINSOCK.H, which is called to determine whether\
    \ there is an error in the asynchronous event. It returns 0 (zero) on success\
    \ and an error value on failure. For the `FD_ACCEPT` event notification message,\
    \ the error could be `WSAENETDOWN`, which means the network subsystem is down.\n\
    \nAlso note that the `WSAGETSELECTEVENT` macro is called to determine the event\
    \ that triggered this message handler even though the only way the `CServerWindow::OnAsyncSelect()`\
    \ function is called is if the `FD_ACCEPT` event occurs. This macro will be used\
    \ in later sample programs where the class’s member function handles several WinSock\
    \ events for a particular socket.\n\nIf for some reason the `CServerWindow::OnAsyncSelect()`\
    \ function is called with the `FD_ACCEPT` event but there is no client trying\
    \ to connect to this server application, `accept()` returns `INVALID_SOCKET`.\
    \ Calling `WSAGetLastError()` will return `WSAEWOULDBLOCK`, which tells you that\
    \ this function is set up for nonblocking mode and if it weren’t, it would block."
