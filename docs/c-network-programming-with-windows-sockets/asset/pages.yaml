    ```


    Notice that the asynchronous select message handler, CClientWindow::OnAsyncSelect(),
    handles multiple WinSock events, so a switch statement is used. As soon as the
    client''s connect succeeds, the FD_CONNECT message is sent, telling you that the
    socket is connected. Immediately after that, the FD_WRITE message is sent, telling
    you that the socket is writable. In this example, there is only one call to WSAAsyncSelect()
    done in CClientWindow::DoConnect(). This single call registers interest in both
    the FD_CONNECT and the FD_WRITE events. You also could use two separate calls.
    The first call, in the DoConnect() member function, could simply register interest
    in FD_CONNECT. Then, in the OnAsyncSelect() member function''s handling of FD_CONNECT,
    you could call WSAAsyncSelect() expressing interest in just the FD_WRITE event.
    Either technique gives the same result.


    In this example, a buffer is allocated and filled with data to send in response
    to the FD_CONNECT event. The FD_WRITE handler sends the data in 100-byte pieces
    until the entire buffer is transmitted. I used 100-byte buffers in this example
    so that you could see the do-while loop in action. This loop is executed as long
    as there are bytes to send and there are no errors. If you get a WSAEWOULDBLOCK
    error, it doesn''t pose a problem because the FD_WRITE handler will be called
    again as soon as the network subsystem can do it. Thanks to the use of the static
    variables, when the FD_WRITE handler gets called again, the rest of the buffer
    is sent from where it left off.


    # ## Receiving Data


    Sending is just half the battle. This section describes receiving data using the
    recv() function. Its prototype is as follows:


    ```

    ```c

    int PASCAL FAR recv(SOCKET s, char FAR * buf, int len, int flags);

    ```

    ```


    s is the connected socket from which to receive data. buf is a pointer to a buffer
    that will receive the data. len is the size of buf. flags specifies the way in
    which the recv() call is made. flags can be any of the following logically ORed
    together: 0 (zero) for no special receive options, MSG_PEEK to copy the data to
    buf but not remove it from the internal WinSock queues, and MSG_OOB to process
