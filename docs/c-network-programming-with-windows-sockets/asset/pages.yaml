- pgno: 12
  md: '# Coming Soon


    The future promises more networking options. One exciting area of development
    involves wireless communications. Usually associated with the notion of a Personal
    Digital Assistant, wireless communications will allow access to an enterprise’s
    network from anywhere on the planet. Imagine being able to access your e-mail
    messages from the beach.


    Another area of interest, particularly to Microsoft, is to make network resources
    more easily shared and utilized. To meet this goal, Microsoft initiated the Microsoft
    at Work program in 1993. One component of Microsoft at Work discussed earlier
    was Microsoft at Work fax software, with which network users can send faxes and
    computer files directly from their desktop computers. Soon we will see other Microsoft
    at Work-enabled devices, such as telephones and photocopiers. These devices will
    have a touch screen surface with a simplified Windows interface and will also
    be available as network resources. With an “At Work” enabled photocopier, for
    example, a network user will be able to send a print job directly from his favorite
    word processor program and have the desired number of copies printed, collated,
    and stapled.


    As networks get more sophisticated and the amount of network traffic they can
    handle increases, video conferencing becomes more viable. Video conferencing usually
    involves the use of a multimedia-enabled computer that includes a video camera
    and microphone. With such a configuration, two or more users can see and hear
    each other, as well as type messages back and forth as the outdated Chat type
    utility allows. By combining video conferencing with a networked “white-board”
    utility, on which networked users can see and manipulate visual computer data,
    coworkers are able to collaborate on work even though they may be located in different
    offices, different states, or even different countries. It might be a while before
    that kind of network bandwidth exists though.


    # Network Topologies


    The previous sections described the capabilities of a computer network. But how
    are all of these file, print, fax, and compute resources connected so as to allow
    the typical desktop computer to access them? Network topology refers to the way
    networked computers and network resources are connected. The three most widely
    used topologies are bus, ring, and star. Note that the following network topology
    diagrams are logical views of the topologies they represent and don’t necessarily
    match the physical (electrical) interconnections on the networks.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Bus Network


    The bus network topology, shown in Figure 1.6, connects each computer to a single
    cable. At each end of the cable is a terminating resistor or a terminator. An
    electrical signal is passed back and forth along the cable past the computers
    and between the two terminators. The bus carries a message from one end of the
    network to the other. As the bus passes each computer, the computer checks the
    destination address on the message. If the address in the message matches the
    computer’s address, the computer receives the message. If the address doesn’t
    match, the bus carries the message to the next computer, and so on.


    Bus topology is passive, meaning that computers only listen for data being sent
    on the network and aren’t responsible for moving data from one computer to the
    next. If one computer fails, it doesn’t affect the entire LAN. On the other hand,
    if a cable breaks, the entire cable segment (the length between the two terminators)
    loses its connectivity, so that the entire segment isn’t functional until the
    cable can be repaired.


    Each computer attached to a bus network can transmit data whenever it “wants.”
    This capability means that two computers may try to transmit simultaneously. This
    occurrence is called a collision. A collision is detected by the network hardware
    of the sending computers. When a collision is detected, the packets of data that
    generated the collision are retransmitted.


    The limitation of bus networks is the speed of data transmission relative to the
    number of computers on the network. As more computers are added to the network,
    more collisions are bound to happen. As more collisions occur, more retransmissions
    take place and the overall network performance degrades.


    Ethernet is one example of a common bus network found on many local area networks.
    Ethernet is also the most popular LAN architecture in use today.


    | Note |

    |---|

    | Ethernet was developed by the Xerox Corporation in 1972 as the follow-up to
    some research done at the University of Hawaii. Ethernet first became commercially
    available in 1975 as a 2.94 Mbps network able to connect up to 100 computers spread
    over a 1-kilometer cable. Xerox Ethernet soon became popular, and work was done
    with the Intel Corporation and Digital Equipment Corporation to extend Ethernet’s
    capability to 10 Mbps. Today, 100 Mbps Ethernet is gaining in popularity. |


    ![](img/5e551abe6e0cb0588043ee757a235ddb_13_0.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: "Ethernet networks can be wired with different types of cable, each with its\
    \ own benefits and drawbacks. Three popular specifications for Ethernet topologies\
    \ are 10BASE2, which uses thin coaxial cable (Thinnet) that can carry a signal\
    \ up to approximately 607 feet; 10BASE5, which uses Thicknet cabling that can\
    \ carry a signal for about 1,640 feet; and 10BASET, which uses unshielded twisted-pair\
    \ cable that can carry a message for about 328 feet between a computer and the\
    \ hub to which the computer is connected.\n\n**FIGURE 1.6.**  \n*Bus network.*\n\
    \n![](img/5e551abe6e0cb0588043ee757a235ddb_14_0.png)\n\n# Ring Network\n\nFigure\
    \ 1.7 shows a ring network. In a ring network, a packet of data (often called\
    \ a token) is continually moving around the ring from one computer to the next.\
    \ To send data, a computer on the network must wait for the circulating token\
    \ to pass by. When the token arrives, it’s examined to see whether it’s empty.\
    \ If it’s empty, the computer that wishes to transmit adds its data to the token\
    \ packet and addresses the packet to a destination. As the token passes by the\
    \ destination computer, the computer looks at the address and because the message\
    \ is addressed to itself, extracts the data, and replaces the token packet’s data\
    \ with a delivery acknowledgment message. The token then continues to circle the\
    \ ring and eventually returns to the sending computer. The sending computer examines\
    \ the token packet to see if it contains the data it sent or an acknowledgment\
    \ message. If it doesn’t find an acknowledgment message, the sender knows that\
    \ the data wasn’t received, possibly because the destination computer wasn’t operating.\
    \ The sender then clears the token packet and passes it along the ring to allow\
    \ subsequent computers their chance to use the network’s communication resources.\
    \ The token passing scheme is in contrast to the bus topology whereby any computer\
    \ can send at any moment and the protocol must detect collisions. Collisions of\
    \ this nature can’t occur on a ring network."
  merge: -1
  img_proc: true
- pgno: 15
  md: '**Note**


    The first design of a network passing a token ring is attributed to E. E. Newhall
    in 1969. IBM first publicly supported a token-ring topology in March 1982, and
    announced its first token-ring network product in 1984.


    Data on the IBM token-ring network is transmitted at either 4 or 16 Mbps, depending
    on the actual implementation. For computers to communicate with each other, all
    network cards must be configured similarly to communicate at either 4 or 16 Mbps
    on the network. Networked computers are connected by shielded and/or unshielded
    twisted-pair cable to a wiring concentrator called a Media Access Unit or MAU
    (rhymes with cow). Each MAU can support as many as 72 computers that use unshielded
    wire or up to 260 computers using shielded wire. Each ring can have as many as
    33 MAUs allowing for a theoretical maximum of 8,580 computers on the network.


    **FIGURE 1.7.**


    *Ring network.*


    ![](img/5e551abe6e0cb0588043ee757a235ddb_15_0.png)


    # Star Network


    To transmit data between any two computers in a star network, shown in Figure
    1.8, requires that data be sent via the centrally located computer, called a hub.
    The hub provides a common connection so that all the computers can communicate
    with one another. To extend the star network, hubs can be connected to one another.
    The major problem with star networks is that if the centrally located hub isn’t
    operating, the entire network becomes unusable. A benefit of a star network is
    that no computer, other than the centrally located hub, can interrupt network
    traffic.'
  merge: -1
  img_proc: true
