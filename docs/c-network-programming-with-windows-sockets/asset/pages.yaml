- pgno: 88
  md: '# Service Name Resolution


    So far, you have seen how to retrieve a binary IP address, whether it be derived
    from a host name or the host’s IP address. But the IP address of a host is only
    half of the equation when it comes to making a network connection between client
    and server applications; the port number provides the other half of the equation.
    When a computer is running a server application, it’s said to be providing a service.
    Each service is uniquely identified by a well-known port number. The server program
    “listens” for connections on the well-known port and the client program opens
    a connection to that port. The port numbers must be unique to distinguish the
    many server programs that a host may provide. The port numbers must be well-known
    so that applications can request them by name. Figure 6.3 shows a host that is
    providing two services: port number 37 is acting as a time server over UDP, and
    port number 79 is acting as a finger server over TCP. Note that the ports out
    of which the clients connect are represented as question marks. Clients don’t
    need to specify a port when they create their outbound sockets; the socket can
    be assigned a unique port at runtime by the TCP/IP stack.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_88_0.png)


    The `getservbyname()` and `WSAAsyncGetServByName()` functions are responsible
    for retrieving the port number when you know its service name. Using a service
    name in your program, as opposed to a port number, allows the user of your program
    to decide which port should be designated for the service your program is providing.
    Users appreciate this level of control. As the types of services users’ computers
    provide, or the ways in which they’re used, change over time, users have the flexibility
    of easily configuring their machines as they see fit.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# # The Services File\n\nThe service name to port translation is commonly supported\
    \ by a flat file database called the services file. A partial listing of a common\
    \ services file looks like the following:\n\n```\n```\n# This file contains port\
    \ numbers for well-known services\n# as defined by RFC 1060 (Assigned Numbers).\n\
    #\n# Format:\n# <service name>  <port number>/<protocol>  [aliases...]   [#<comment>]\n\
    \ntime            37/tcp    timserver\ntime            37/udp    timserver\nfinger\
    \          79/tcp\n```\n```\n\nThe lines preceded by a pound sign (#) are comments.\
    \ Notice the reference to RFC 1060. This Internet Request for Comment outlines\
    \ some standard well-known ports. This ensures that nobody creates a service that\
    \ utilizes an already established port number. When you create your own custom\
    \ servers, you need to allocate a port number between 1024 and 5000 exclusive.\
    \ The ports from 1024 and below are reserved for universally well-known ports.\
    \ Often, these ports are allocated to new services when someone invents the new\
    \ service and distributes the specification through an RFC.\n\nFollowing the header\
    \ comment is the listed services. The left-most column contains the name of the\
    \ service. The next column has the port number and transport-level protocol separated\
    \ by a forward slash (/). The remaining columns contain aliases for the service.\
    \ In the preceding example, the time service is recognized as \"time\" or \"timserver.\"\
    \ The finger service has no aliases. The transport-level protocol field specifies\
    \ either User Datagram Protocol or Transmission Control Protocol. This is the\
    \ type of socket (datagram or stream) that must be used to communicate with the\
    \ designated service. Note that the time service responds to port 37 on both a\
    \ UDP and TCP connection. The port number/protocol pair provides for a unique\
    \ correlation to a service within each transport protocol: this is to say that\
    \ a service might respond to UDP port 100, and a completely different service\
    \ might respond to TCP port 100. It's also possible for a specific service to\
    \ respond to one UDP port and an entirely different TCP port.\n\n> **Tip**\n>\
    \ \n> For custom applications that you produce, it's usually sufficient to simply\
    \ refer to a service number by its port number. This frees you from having to\
    \ make an entry in the services table for your custom services. For the sake of\
    \ flexibility, make your server and client applications configurable with respect\
    \ to the port numbers they use. Allow the server to listen for connections on\
    \ a configurable port and make sure that the port to which the client connects\
    \ is also\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_89_0.png)"
  merge: -1
  img_proc: true
- pgno: 90
  md: "configurable. This will ensure an easy fix to the problem of having several\
    \ different servers hard-coded to use the same port number. If your server program\
    \ must run on a computer with another server that was written to use a hard-coded\
    \ port number, you can change the server and client configuration to use an unused\
    \ port. With this information hard-coded, the change requires a recompile of the\
    \ applications.\n\n# Finding a Service’s Port Number\n\nThe `getservbyname()`\
    \ function gets service information corresponding to a specific service name and\
    \ protocol. Its function prototype looks like the following:\n\n```\nstruct servent\
    \ FAR * PASCAL FAR getservbyname(const char FAR * name,\n        const char FAR\
    \ * proto);\n```\n\nname is a pointer to a string that contains the service for\
    \ which you are searching. The service name is either the official service name\
    \ or an alias. proto is a pointer to a string that contains the transport protocol\
    \ to use; it’s either “udp”, “tcp”, or NULL. A NULL proto will match on the first\
    \ service in the services table that has the specified name, regardless of the\
    \ protocol. The servent structure returned has the following format:\n\n```\n\
    struct servent {\n    char FAR * s_name;        // official service name\n   \
    \ char FAR * FAR * s_aliases; // alias list\n    short s_port;              //\
    \ port #\n    char FAR * s_proto;        // protocol to use\n};\n```\n\nA note\
    \ on transport protocols: Protocol names are case sensitive. “TCP” is different\
    \ from “tcp.” Ensure that you are using the exact format as listed in your services\
    \ file.\n\nThe `getservbyname()` function returns a pointer to a servent structure\
    \ on success and NULL on failure. On a return value of NULL, you can call `WSAGetLastError()`\
    \ to determine the specifics of the problem. Possible error values include the\
    \ following: WSANOTINITIALISED if WSAStartup() wasn’t called successfully; WSAENETDOWN\
    \ if the network subsystem is failing; WSA_NO_RECOVERY if there was an unrecoverable\
    \ error; WSANO_DATA if the service name is valid but no appropriate data could\
    \ be found; WSAEINPROGRESS if a blocking WinSock operation is currently in progress;\
    \ or WSAEINTR if the blocking call was canceled by WSACancelBlockingCall().\n\n\
    This code fragment searches for the time service on a UDP transport connection:\n\
    \n```\nPSERVENT pservent;        // pointer to service entry structure\nchar lpszMessage[100];\
    \    // informational message\nchar lpszPort[6];         // port number string\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 91
  md: "```\n```c\n// get the service entry structure for the time service using UDP\n\
    if ((pservnt = getservbyname(\"time\", \"udp\")) == NULL)\n    wsprintf(lpszMessage,\
    \ \"getservbyname() generated error %d\",\n        WSAGetLastError());\nelse\n\
    {\n    // format the results\n    wsprintf(lpszMessage, \"Service %s using protocol\
    \ %s has port \",\n        pservnt->s_name, pservnt->s_proto);\n    wsprintf(lpszPort,\
    \ \"%d\", ntohs(pservnt->s_port));\n    lstrcat(lpszMessage, lpszPort);\n}\n\n\
    MessageBox(NULL, lpszMessage, \"Info\", MB_OK);\n```\n```\n\nThe end result is\
    \ the formatted message describing that the “time” service using the “udp” protocol\
    \ has port 37. Notice that the port number, `pservnt->s_port`, must be converted\
    \ from network to host byte ordering.\n\nIf the sample was rewritten to not specify\
    \ the transport protocol, the results would be different:\n\n```\n```c\nPservnt\
    \ pservnt;             // pointer to service entry structure\nchar lpszMessage[100];\
    \       // informational message\nchar lpszPort[6];            // port number\
    \ string\n\n// get the service entry structure for the time service\nif ((pservnt\
    \ = getservbyname(\"time\", NULL)) == NULL)\n    wsprintf(lpszMessage, \"getservbyname()\
    \ generated error %d\",\n        WSAGetLastError());\nelse\n{\n    // format the\
    \ results\n    wsprintf(lpszMessage, \"Service %s using protocol %s has port \"\
    ,\n        pservnt->s_name, pservnt->s_proto);\n    wsprintf(lpszPort, \"%d\"\
    , ntohs(pservnt->s_port));\n    lstrcat(lpszMessage, lpszPort);\n}\n\nMessageBox(NULL,\
    \ lpszMessage, \"Info\", MB_OK);\n```\n```\n\nThe end result of this sample is\
    \ the formatted message describing that the “time” service using the “tcp” protocol\
    \ has port 37. The TCP result is given because that entry appears first in the\
    \ services file.\n\n# Asynchronously Finding a Service’s Port Number\n\n`WSAAsyncGetServByName()`\
    \ is the asynchronous counterpart to `getservbyname()`. Its function prototype\
    \ is as follows:\n\n```\n```c\nHANDLE PASCAL FAR WSAAsyncGetServByName(HWND hWnd,\
    \ u_int wMsg,\n    const char FAR * name, const char FAR * proto,\n    char FAR\
    \ * buf, u_int buflen);\n```\n```"
