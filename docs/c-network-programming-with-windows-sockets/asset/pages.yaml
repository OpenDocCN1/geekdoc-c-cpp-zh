- pgno: 94
  md: "# Finding a Service Name When You Know Its Port Number\n\nThe getservbyport()\
    \ function gets service information corresponding to a specific port and protocol.\
    \ Its function prototype looks like the following:\n\n```\nstruct servent FAR\
    \ * PASCAL FAR getservbyport(int port,\n    const char FAR * proto);\n```\n\n\
    port is the service port, in network byte order. proto is a pointer to a protocol\
    \ name; it is “tcp”, “udp”, or NULL. If proto is NULL, the first matching service\
    \ is returned. The getservbyport() function returns a pointer to a servent structure\
    \ on success and NULL on failure. On a return value of NULL, you can call WSAGetLastError()\
    \ to determine the specifics of the problem. Possible error values include the\
    \ following: WSANO_INITIALIZED if WSAStartup() wasn’t called successfully; WSANOETNETWORK\
    \ if the network subsystem is failing; WSANO_RECOVERY if there was an unrecoverable\
    \ error; WSANO_DATA if the port number is valid but no appropriate data could\
    \ be found; WSAEINPROGRESS if a blocking WinSock operation is currently in progress;\
    \ or WSAEINTR if the blocking call was canceled by WSACancelBlockingCall().\n\n\
    This code fragment searches for the service corresponding to port 37 on a UDP\
    \ transport connection:\n\n```\nPSERVENT pservent;             // pointer to service\
    \ entry structure\nchar lpszMessage[100];         // informational message\nchar\
    \ lpszPort[6];              // port number string\n\n// get the service entry\
    \ structure for the port 37 service using UDP\nif ((pservent = getservbyport(htons(37),\
    \ \"udp\")) == NULL)\n    wsprintf(lpszMessage, \"getservbyport() generated error\
    \ %d\",\n        WSAGetLastError());\nelse\n{\n    // format the results\n   \
    \ wsprintf(lpszMessage, \"Service %s using protocol %s has port \",\n        pservent->s_name,\
    \ pservent->s_proto);\n    wsprintf(lpszPort, \"%d\", ntohs(pservent->s_port));\n\
    \    lstrcat(lpszMessage, lpszPort);\n}\n\nMessageBox(NULL, lpszMessage, 'Info',\
    \ MB_OK);\n```\n\nNote that the port number is converted to network byte order\
    \ before it is passed to getservbyport(). The end result is the formatted message\
    \ describing that port 37 using the “udp” transport protocol corresponds to the\
    \ “time” service. Note the similarity between this sample and the one presented\
    \ for getservbyname()."
