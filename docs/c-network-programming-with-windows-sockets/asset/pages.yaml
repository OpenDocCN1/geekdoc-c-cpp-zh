- pgno: 99
  md: 'The preceding two chapters show how to initialize the WinSock library and how
    to resolve host names and services. This chapter discusses the remaining WinSock
    functions necessary to make a truly useful networked application. Among these
    functions are the following: `socket()` to create an end-point of communication,
    `bind()` to give the end-point a name, `listen()` to listen for incoming connections,
    `accept()` to accept a connection, `send()` and `sendto()` to send data, and `recv()`
    and `recvfrom()` to receive data.


    Figure 7.1 shows the flow of WinSock function calls for a client and server using
    TCP. Figure 7.2 shows a similar flow of WinSock function calls, but this time
    for a client and server using UDP.


    # FIGURE 7.1.


    *Client/server WinSock function flow using TCP.*


