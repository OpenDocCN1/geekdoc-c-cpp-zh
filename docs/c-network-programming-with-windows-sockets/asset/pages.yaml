- pgno: 110
  md: "```\n}\nelse\n{\n    // copy the four byte IP address into an IP address structure\n\
    \    memcpy(&ClientAddr, &ClientAddr.sin_addr.s_addr, 4);\n\n    // print an informational\
    \ message\n    wsprintf(lpzMessage,\n        \"client IP address is %s, port is\
    \ %d\",\n        inet_ntoa(ClientAddr), ntohs(ClientAddr.sin_port));\n    MessageBox(lpzMessage,\
    \ \"Info\");\n\n    ...\n}\n}\n\n...\n```\n\n# What If No Clients Are Trying to\
    \ Connect?\n\nIn the previous example no mention was made of what the outcome\
    \ of the code segment is if there is no client trying to connect to the server\
    \ when the server executes the `accept()` function. In this scenario, the server\
    \ application blocks, waiting for a client connection. This is similar to what\
    \ happens with the `getXbyY` functions discussed in an earlier chapter. And just\
    \ as there is a work-around for the `getXbyY` problem, using the `WSAAsyncGetXByY`\
    \ functions, there is an answer to the `accept()` problem as well. The solution\
    \ lies in using nonblocking sockets. By default, a socket created with `socket()`\
    \ is in blocking mode. There are two methods for putting the socket into nonblocking\
    \ mode.\n\n# Doing It the Berkeley Way\n\nThe Berkeley method of using nonblocking\
    \ sockets involves two functions: `ioctl()` and `select()`. `ioctl()` is the UNIX\
    \ function to perform input/output control on a file descriptor or socket. Because\
    \ a WinSock socket descriptor may not be a true operating system file descriptor,\
    \ `ioctl()` can’t be used, so `ioctlsocket()` is provided instead. `select()`\
    \ is used to determine the status of one or more sockets.\n\nThe use of `ioctlsocket()`\
    \ to convert a socket to nonblocking mode looks like this:\n\n```\n// put socket\
    \ s into nonblocking mode\nu_long ulCmdArg = 1;    // 1 for nonblocking, 0 for\
    \ blocking\nioctlsocket(s, FIONBIO, &ulCmdArg);\n```\n\nOnce a socket is in its\
    \ nonblocking mode, calling a normally blocking function simply returns `WSAEWOULDBLOCK`\
    \ if the function can’t immediately complete, as in the following example.\n\n\
    ```\n// put socket s into nonblocking mode\nu_long ulCmdArg = 1;    // 1 for nonblocking,\
    \ 0 for blocking\nioctlsocket(s, FIONBIO, &ulCmdArg);\n```"
