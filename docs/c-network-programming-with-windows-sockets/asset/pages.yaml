- pgno: 33
  md: 'simplest being a plain ASCII file where each line of the file has the IP address
    in dotted decimal notation to the left and the textual name to the right. This
    file is customarily named `hosts` and is referred to as the *host file*.


    The host file implementation is fine for a small network with relatively few computers,
    but the management of such a file becomes unwieldy or impossible as the network
    grows to thousands of hosts, as in the Internet or any large corporate network.
    In this environment, a *name server* is utilized. A *name server* is a computer
    that provides a name to IP address resolution. When a request to translate a certain
    name to its IP address arrives at the name server, it does a database lookup to
    see if it has this information. If not, the request is passed on to an authoritative
    server. *Authoritative servers* are maintained with official data provided by
    the group responsible for the assignment of IP addresses.


    # Subnetting


    Subnetting is a method of locally modifying the use of the network and hosts bits.
    By moving the dividing line that separates the host id part from the network id
    part, more networks can be created at the same time that the maximum number of
    hosts on each network is reduced. A subnet mask is used to define the new dividing
    line. It’s represented in dotted decimal notation in much the same way as an IP
    address is. The bits that are set to one represent the network portion; the remaining
    bits that are set to zero represent the host portion.


    Earlier, I determined that the IP address of my computer resided on network 166.78
    and had a host id of 4.139. Officially speaking this is correct. But as it turns
    out, the network administrators at my site have decided to use a network mask
    of 255.255.255.0 to logically partition the address space into more networks.
    Looking at the logical view, my network id is 166.78.4 and my host id is 139.
    Another way of saying this is my computer is host 139 on subnet 166.78.4.0. Notice
    that the low order byte is 0. Performing a logical AND operation between my complete
    IP address and the subnet mask results in the subnet 166.78.4.0. The component
    that remains—139—is the host part.


    > > **TIP**

    > >

    > > The subnet mask doesn’t have to be partitioned on even 8-bit boundaries. As
    an example, suppose that my subnet mask is 255.255.255.128. Performing the logical
    AND operation between this subnet mask and 166.78.4.139 results in 166.78.4.1
    with a remaining portion of 11. Hence my computer would be host 11 on subnet 166.78.4.1.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# The NIC and Internet IP Addresses


    You should see now that IP address space is a limited resource. You have also
    learned that any computer attached to the global Internet must have a unique IP
    address. The Network Information Center is the group responsible for the assignment
    of IP addresses and domain names. To get an official IP address and have your
    host name officially recognized, you must register with the NIC. Depending on
    your needs, the NIC will most likely allocate to you either a class B or C network
    identifier. Class A network space is very rare—remember that there are only 126
    possible class A networks—and is almost exhausted.


    When you register, you’ll also need to choose a domain name. Domain names are
    organized into a hierarchical structure with the root-level domain at the top.
    The top-level domains in the United States are


    +   - COM for commercial organizations

    +   - EDU for educational organizations

    +   - GOV for governmental organizations

    +   - MIL for military organizations

    +   - NET for network support organizations

    +   - ORG for organizations that don’t fit into any other category


    Other top-level domains are generally reserved for country codes. For example,
    the United Kingdom belongs to the top-level UK domain, and Australia belongs to
    the top-level AU domain.


    My personal computer, with IP address 166.78.4.139, has a fully qualified name
    of GOOBER.PING.COM. It’s a member of the PING.COM domain which is in turn a member
    of the top-level COM domain. Figure 2.9 shows a hierarchical representation of
    the domains mentioned thus far.


    **FIGURE 2.9.**

    *Domain hierarchy.*


    ![](img/5e551abe6e0cb0588043ee757a235ddb_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# ## Routing


    Routing is the method by which packets of data are sent from one computer to another
    in the most efficient way possible. The routing process is composed of several
    components as follows:


    +   - Determining what paths are available between the source and destination
    computers

    +   - Selecting the “best” path between the source and destination computers where
    “best” may mean different things depending on the goals

    +   - Using those paths to reach other computers

    +   - Adjusting the datagram formats to fit into the underlying physical network
    technology


    In a TCP/IP network, routing is performed by the IP layer. The network id of the
    destination computer’s IP address as well as the subnet mask are used by the IP
    layer to make routing decisions.


    # ## Default Gateway


    In an interconnected computer network, or internet, some method is required to
    deliver data to computers that reside on another connected network. By specifying
    a default gateway, the IP layer of the sending computer “knows” to what destination
    it should forward data that has a destination which isn’t on the local network.
    See Figure 2.10 for a simple network arrangement. When 166.78.4.139 sends data
    to 166.78.4.10, the IP layer takes the subnet mask, which in this case 255.255.255.0,
    and performs a logical AND operation on both the source and destination IP addresses.
    The result in this case is 166.78.4.0 for both addresses, which tells the IP layer
    that both computers are on the same subnet. The data is sent directly to 166.78.4.10.
    When 166.78.4.139 sends data to 166.78.1.5, the IP layer again uses the subnet
    mask, and the results are 166.78.4.0 for the source and 166.78.1.0 for the destination.
    These numbers don’t match, which signals the IP layer that the computers reside
    on different subnets. The sending computer can’t send directly to 166.78.1.5.
    The data must be sent to the default gateway, which is a computer that has two
    IP addresses and resides on two distinct subnets. The data is first sent to 166.78.4.2
    and then forwarded on to 166.78.1.5.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/5e551abe6e0cb0588043ee757a235ddb_36_0.png)


    # ## Multiple Default Gateways


    It’s also possible to have multiple default gateways. With this configuration,
    a subnet doesn’t rely on one gateway to the connected networks. Instead the data
    can use several paths to leave the source subnet. The IP layer uses the subnet
    mask, the IP addresses of the gateways, and the IP address of the destination
    computer to decide the most efficient route from sender to receiver.


    # ## Internet Layer


    The internet layer is shown in Figure 2.2. It defines the datagram and handles
    the routing of those datagrams. IP is the most important protocol of the TCP/IP
    protocol suite, because it’s used by all other TCP/IP protocols and all data must
    flow through it. IP is also considered the building block of the Internet.


    Although the application programmer doesn’t usually see this layer, a brief overview
    is beneficial.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# IP


    IP is a connectionless protocol, which means that no end-to-end association is
    established before data is transmitted. This is in contrast to a connection-oriented
    protocol that exchanges control information between hosts to establish a connection
    before data is transmitted. IP doesn’t guarantee reliable data delivery either.
    Packets of data could arrive at their destination out of order, duplicated, or
    not at all. IP relies on other layers, such as the TCP transport protocol, to
    provide the reliability feature.


    The basic building block of IP is the datagram. Each datagram, or packet of data,
    has a source and destination address. Routing of data is done at the datagram
    level. As a datagram is routed from one network to another, it may be necessary
    to break the packet into smaller pieces. This process is called fragmentation
    and it’s also the responsibility of the IP layer. Fragmentation is required on
    some internets because the many hardware components that make up the network have
    different maximum packet sizes. IP must also reassemble the packets on the receiving
    side so that the destination host receives the packet as it was sent.


    # Address Resolution Protocol


    Unfortunately, network hardware (that is, the Ethernet card you plug into your
    computer) doesn’t understand IP addresses. The Address Resolution Protocol (ARP)
    is used to map the logical IP addresses and host names—that humans like to use—into
    the physical addresses that the underlying network hardware mandates. This protocol
    operates by broadcasting a message onto the local network, saying in effect, “Is
    the computer with IP address xx.xx.xx.xx out there?” If the computer with the
    designated IP address is listening, it returns a message with its physical hardware
    address to the source. Any other computer that receives the broadcast request
    message ignores it. This protocol only works on the local network because the
    format of the physical network address is dependent on the hardware used in the
    network. For example, if an Ethernet was in use, the response to the ARP request
    would be a 48-bit number that uniquely identifies every Ethernet device in existence.


    # Internet Control Message Protocol


    The Internet Control Message Protocol (ICMP) is another low-level protocol rarely
    used by the application programmer. It uses IP datagrams to send messages that
    perform flow control, error reporting, routing manipulation, and other informational
    functions for TCP/IP.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The application programmer most certainly will make use of the ping utility,
    one of the most common programs that uses ICMP. Ping uses ICMP’s echo function
    to test the response of a networked host. By getting a response from ping, you’re
    assured that network routing is in place between the two computers and that the
    remote computer is indeed running.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_38_0.png)


    > > **NOTE**

    > >

    > > You’ll develop a version of ping in a later chapter. That version of ping
    will use an application-level protocol from the transport layer instead of the
    internet layer’s ICMP.


    # Transport Layer


    IP is responsible for getting datagrams from computer to computer. The transport
    layer is responsible for delivering that data to the appropriate program or process
    on the destination computer. The two most important protocols of the transport
    layer are User Datagram Protocol (UDP) and Transmission Control Protocol (TCP).
    UDP provides connectionless datagram delivery; TCP provides a reliable stream-oriented
    delivery service with end-to-end error detection and correction.


    To facilitate the delivery of data to the appropriate program on the host computer,
    the notion of a port is used. A port is a 16-bit number that denotes an end-point
    of communication within a program. An IP address and port combination taken together
    uniquely identify a network connection into a process. The socket paradigm developed
    by the University of California at Berkeley makes more intuitive the use of IP
    addresses and ports.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_38_1.png)


    > > **NOTE**

    > >

    > > The application programmer is responsible for ensuring that two or more processes
    don’t utilize the same port.


    Application programmers use UDP and TCP in the majority of their networked programs.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# ## User Datagram Protocol


    The User Datagram Protocol (UDP) allows data to be transferred over the network
    with a minimum of overhead. UDP overhead is low because it provides only unreliable
    data delivery. There''s no method in the protocol to verify that the data reached
    the destination exactly as it was sent. The data may be lost, duplicated, or arrive
    out of order.


    These limitations don''t make UDP useless, though. The low overhead in UDP transmission—because
    there''s no need to establish a connection—and the lack of reliability makes UDP
    very efficient. UDP can be used when the application programmer puts error-case
    handling into the application. For example, suppose that you had a simple client-server
    relationship where the client sends a small piece of data to the server and expects
    within two seconds a response in the form of a small piece of data. If the client
    doesn''t receive a response within two seconds, it can assume the data didn''t
    make it to the server successfully and so it may retransmit the request. If the
    client does receive a response from the server, that can be used as an acknowledgment
    that the data did reach its destination.


    Figure 2.11 shows the format of a UDP message. The message contains a 16-bit source
    and destination port.


    **FIGURE 2.11.**<br>*UDP message format.*


    <table><tr><td>Source Port</td><td>Destination Port</td></tr><tr><td>Length</td><td>Checksum</td></tr><tr><td
    colspan=2>Data...</td></tr></table>


    # ## Transmission Control Protocol


    The Transmission Control Protocol (TCP) verifies that data is delivered in order
    and without corruption. Associated with this feature is extra overhead in the
    generation and maintenance of a connection.


    TCP provides for the transmission of a reliable, connection-oriented stream of
    bytes. TCP''s reliability comes from its inclusion of a checksum into each packet
    of data transmitted. On reception, a checksum is generated and compared to the
    checksum included in the header of the data packet. If the checksums don''t match,
    the receiver communicates that fact to the sender, and the data is automatically
    resent. Application programmers don''t have to be concerned with this function
    because the lower layers mask it. TCP is considered connection-oriented because
    the two end-points of communications exchange a handshaking dialogue before data
    transmission can begin. This handshake guarantees to the sender that the receiver
    is alive and ready to accept data.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "# **FIGURE 2.12.**  \n*TCP message format.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_40_0.png)\n\
    \nFigure 2.12 shows the format of a TCP message. The message contains a 16-bit\
    \ source and destination port as does the UDP message. But this message also includes\
    \ sequencing fields as well as a data checksum field. These additional entries\
    \ in the message are there to support TCP’s reliable data transport.\n\n# ## Well-Known\
    \ Ports\n\nUDP and TCP use the IP address and the port number to uniquely identify\
    \ a particular process on a TCP/IP networked computer. But your application program\
    \ shouldn’t use just any port. Some ports are called reserved ports because they\
    \ have been given a special meaning. Some RFCs describe application-level services\
    \ that most TCP/IP networked computers run. These network-accessible services\
    \ “listen” at a well-known port so that client programs need only know the IP\
    \ address of the remote host. For example, consider the finger program. It takes\
    \ as its parameter a host name or host IP address. The finger program connects\
    \ to the host at the well-known port that has been reserved for the finger service.\
    \ If you were to write a program that waited for connections on a well-known port,\
    \ you might get client programs trying to attach to your service that were expecting\
    \ another program on the back-end.\n\n# ## Summary\n\nThis chapter discussed the\
    \ principal components of a TCP/IP network. TCP/IP protocols are independent of\
    \ the underlying network hardware on which they reside. Each computer on a TCP/IP\
    \ must have a unique IP address that universally discloses the computers identification.\
    \ TCP/IP is particularly well suited for use in an internetworking environment\
    \ where several disparate networks need to be connected. Gateways allow the IP\
    \ data to travel between two or more interconnected networks. The application\
    \ programmer will make the most use of TCP/IP’s transport level interfaces of\
    \ UDP and TCP. The socket paradigm is used to assist the application programmer\
    \ with network coding. The next chapter discusses WinSock’s use of sockets and\
    \ the extensions necessary to support the Microsoft Windows architecture."
