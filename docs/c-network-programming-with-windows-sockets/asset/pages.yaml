- pgno: 243
  md: "This chapter discusses the last pieces of the WinSock class library, including\
    \ a function to display a WinSock error message.\n\n# CWinSockErrorBox()\n\nOne\
    \ thing that is missing thus far is a function to display an error message with\
    \ a textual description of the actual WinSock error. The `CWinSockErrorBox()`\
    \ function does just that.\n\nThe first parameter to `CWinSockErrorBox()` is an\
    \ integer representing the WinSock error as returned by `WSAGetLastError()`. The\
    \ second parameter is an optional pointer to a string that contains additional\
    \ information you would like to present to the user.\n\nThe prototype for the\
    \ function is as follows:\n\n```\n```c\nvoid CWinSockErrorBox(int nError, LPSTR\
    \ pszMessage = NULL);\n```\n```\n\nThe `CWinSockErrorBox()` function is implemented\
    \ as follows:\n\n```\n```c\n///////////////////////////////////////////////////////////////////////\n\
    // CWinSockErrorBox\n//\nvoid CWinSockErrorBox(int nError, LPSTR pszMessage/*=\
    \ NULL*/)\n{\n#define ERROR_BUF_LEN (1000)\n  char pszError[ERROR_BUF_LEN];\n\n\
    \  wsprintf(pszError, \"WinSock error %d: \", nError);\n\n  switch (nError)\n\
    \  {\n    case WSAEINTR:\n      lstrcat(pszError, \"Interrupted system call\"\
    );\n      break;\n    case WSAEBADF:\n      lstrcat(pszError, \"Bad file number\"\
    );\n      break;\n    case WSAEACCES:\n      lstrcat(pszError, \"Permission denied\"\
    );\n      break;\n    case WSAEFAULT:\n      lstrcat(pszError, \"Bad address\"\
    );\n      break;\n    case WSAEINVAL:\n      lstrcat(pszError, \"Invalid argument\"\
    );\n      break;\n    case WSAEMFILE:\n      lstrcat(pszError, \"Too many open\
    \ files\");\n      break;\n    case WSAEWOULDBLOCK:\n      lstrcat(pszError, \"\
    Operation would block\");\n      break;\n```\n```"
