- pgno: 250
  md: "This chapter presents the reimplementation of two of the samples described\
    \ in Chapter 8, “Sample Applications.” This time, the WinSock class library, developed\
    \ in the preceding chapters, is used rather than the raw WinSock API. The two\
    \ samples are composed of two programs each: a client that sends either datagrams\
    \ or stream data, and a server that receives them and sends them back to the client.\n\
    \n# Datagram Echo Client and Server\n\nThese programs, CDESRV and CDECLNT, demonstrate\
    \ the use of the `CDatagramSocket` object. The CDESRV server application receives\
    \ data and sends it back to the client. The CDECLNT client application sends data\
    \ to the server and receives the echoed reply. These programs are generated using\
    \ Visual C++’s AppWizard feature.\n\n# Datagram Echo Server CDESRV\n\nAs in the\
    \ DESERV program described in Chapter 8, this sample uses a `CFormView`-derived\
    \ object named `CMainView` as its primary user interface. The `CMainView` header\
    \ file is shown in Listing 14.1. The `m_pWinSock` member variable controls the\
    \ starting and stopping of the WinSock subsystem for this program. The `m_pDatagram`\
    \ member variable is a pointer to the datagram socket object that receives data\
    \ from clients. The `OnDatagram()` member function receives status information\
    \ for the datagram socket object. It’s triggered by the `WM_USER_DATAGRAM` user-defined\
    \ message.\n\nListing 14.1. MAINVIEW.H for CDESRV.\n\n```\n```cpp\n// mainview.h\
    \ : header file\n//\n\n//////////////////////////////////////////////////////////////////////\n\
    // CMainView form view\n\n#ifndef __AFXEXT_H__\n#include <afxtempl.h>\n#endif\n\
    \n#include \"winsock.h\"  // Windows Sockets classes\n\nclass CMainView : public\
    \ CFormView\n{\n    DECLARE_DYNCREATE(CMainView)\n\nprivate:\n    CWinSock * m_pWinSock;\
    \          // WinSock sub-system startup/.shutdown\n    CDatagramSocket * m_pDatagram;\
    \ // Datagram socket to receive from\n\nprotected:\n```\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: "```\nCMainView();        // protected constructor used by dynamic creation\n\
    \n// Form Data\npublic:\n    //{{AFX_DATA(CMainView)\n    enum { IDD = IDD_DIALOG_MAIN\
    \ };\n    // NOTE: the ClassWizard will add data members here\n    //}}AFX_DATA\n\
    \n// Attributes\npublic:\n\n// Operations\npublic:\n\n// Implementation\nprotected:\n\
    \    virtual ~CMainView();\n    virtual void DoDataExchange(CDataExchange* pDX);\
    \    // DDX/DDV support\n    virtual void OnInitialUpdate();\n    // Generated\
    \ message map functions\n    //{{AFX_MSG(CMainView)\n    afx_msg LONG OnDataGram(WPARAM\
    \ wParam, LPARAM lParam);\n    //}}AFX_MSG\n    DECLARE_MESSAGE_MAP()\n};\n\n\
    //////////////////////////////////////////////////////////////////////\n\n#define\
    \ WM_USER_DATAGRAM  (WM_USER + 1)\n\n```\n\nThe implementation of the CMainView\
    \ object is shown in Listing 14.2. This object performs most of the work for the\
    \ CDESRV application. OnInitialUpdate() is called soon after the object is created.\
    \ This function is responsible for starting the WinSock subsystem and creating\
    \ a server datagram socket that waits for data to arrive on port 2000. When data\
    \ is ready to be received on the socket, the OnDatagram() member function is triggered\
    \ with wParam set to CWINSDOCK_DONE_READING. Data is read and a write attempt\
    \ is made to echo the data back to the client. When the write finishes, OnDatagram()\
    \ is called with wParam set to CWINSDOCK_DONE_WRITING. At this point, the data\
    \ pointer is freed. When the server application is closed, CMainView’s destructor\
    \ is called, destroying the datagram socket object and shutting down the WinSock\
    \ subsystem.\n\n# Listing 14.2. MAINVIEW.CPP FOR CDESRV.\n\n```\n// mainview.cpp\
    \ : Implementation file\n//\n\n#include \"stdafx.h\"\n#include \"cdsrv.h\"\n#include\
    \ \"mainview.h\"\n```"
