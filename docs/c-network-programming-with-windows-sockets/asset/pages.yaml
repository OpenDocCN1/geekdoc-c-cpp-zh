- pgno: 66
  md: '# WSAGetLastError


    The `WSAGetLastError()` function doesn’t deal exclusively with startup or shutdown
    procedures, but it needs to be addressed early. Its function prototype looks like


    ```

    ```c

    int PASCAL FAR WSAGetLastError(void);

    ```

    ```


    `WSAGetLastError()` returns the last WinSock error that occurred. In the MS-DOS
    or UNIX programming worlds, you’re probably used to examining the `errno` variable,
    which is an application-specific global variable available in all programs. Because
    WinSock isn’t really part of the operating system but is instead a later add-on,
    `errno` couldn’t be used. As soon as a WinSock API call fails, you should call
    `WSAGetLastError()` to retrieve specific details of the error.


    As an example, if `WSAStartup()` is called with a `wVersionRequested`, which is
    earlier than any WinSock API supported by the WinSock DLL, `WSAStartup()` returns
    an error indicator. Calling `WSAGetLastError()` immediately after the failed call
    to `WSAStartup()` reveals that `WSAVERNOTSUPPORTED` occurred. The other possible
    error values generated by `WSAStartup()` are `WSASYSNOTREADY`, if the network
    subsystem is failing, and `WSAINVALID`, if an invalid argument is passed.


    Possible error values for `WSACleanup()` include `WSANOTINITIALIZED` if `WSAStartup()`
    wasn’t called successfully, `WSAENETDOWN` if the network subsystem is failing,
    and `WSAEINPROGRESS` if a blocking WinSock operation is currently in progress.


    # Summary


    This chapter discussed just the beginning of writing a WinSock application. Chapter
    8, “Sample Applications,” presents a program that uses the `WSADATA` structure
    in the call to `WSAStartup()` to present some useful information to the application
    user. The next few chapters will continue to present the mandatory WinSock functions
    useful to most applications.'
  merge: -1
  img_proc: true
