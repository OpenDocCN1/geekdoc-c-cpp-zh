  md: "# Finding a Host Name When You Know Its IP Address\n\nThe main duty of gethostbyaddr()\
    \ is to take the IP address of a host and return its name. This function, and\
    \ its asynchronous counterpart named WSAAsyncGetHostByAddr(), might perform a\
    \ simple table lookup on a host file local to the computer on which the program\
    \ is running, or it might send the request across the network to a name server.\
    \ The function's prototype looks like the following:\n\n```\n```c\nstruct hostent\
    \ FAR * PASCAL FAR gethostbyaddr(const char FAR * addr,\n    int len, int type);\n\
    ```\n```\n\naddr is a pointer to the IP address, in network byte order, of the\
    \ computer about which you want host information. len is the length of the address\
    \ to which addr points. In WinSock 1.1, the length is always four because this\
    \ version of the specification supports only Internet style addressing. type must\
    \ always be PF_INET for the same reason.\nThe gethostbyaddr() function returns\
    \ a pointer to a hostent host entry structure on success and NULL on failure.\
    \ Upon a return value of NULL, you can call WSAGetLastError() to determine the\
    \ specifics of the problem. Possible error values include the following: WSANOTINITIALIZED\
    \ if WSAStartup() was not called successfully; WSAENETDOWN if the network subsystem\
    \ is failing; WSAHOST_NOT_FOUND if the host name couldn't be resolved; WSATRY_AGAIN\
    \ if the cause of the failure could be temporary, such as a name server being\
    \ down; WSANO_RECOVERY if there was an unrecoverable error; WSAEINVAL if the IP\
    \ address is valid but no appropriate data could be found; WSAEINPROGRESS if a\
    \ blocking WinSock operation is currently in progress; or WSAEINTR if the blocking\
    \ call was canceled by WSACancelBlockingCall().\n\nThe following sample code fragment\
    \ will find the host name that has the specified IP address:\n\n```\n```c\nu_long\
    \ ulIPAddress = inet_addr(\"166.78.16.201\");    // binary IP address\nchar lpszMessage[100];\
    \                             // informational message\nchar lpszIP[16];     \
    \                              // IP address string\nPHOSTENT phostent;      \
    \                           // pointer to host entry structure\nIN_ADDR in;  \
    \                                      // Internet address structure\n\n// get\
    \ the host entry structure for the specified IP address\nif ((phostent = gethostbyaddr((char\
    \ *)&ulIPAddress, 4, PF_INET)) == NULL)\n    wsprintf(lpszMessage, \"gethostbyaddr()\
    \ generated error %d\",\n        WSAGetLastError());\nelse\n{\n    // copy the\
    \ four byte IP address into an Internet address structure\n    memcpy(&in, phostent->h_addr,\
    \ 4);\n\n    // format the results, converting the IP address into a string\n\
    \    wsprintf(lpszMessage, \"Host %s has IP address \", phostent->h_name);\n \
    \   wsprintf(lpszIP, \"%s\", inet_ntoa(in));\n    lstrcat(lpszMessage, lpszIP);\n\
    }\nMessageBox(NULL, lpszMessage, \"info\", MB_OK);\n```\n```"
