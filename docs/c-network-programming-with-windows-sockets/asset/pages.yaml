    \ CFormView\n{\n    DECLARE_DYNCREATE(CMainView)\n\nprivate:\n    CWinSock * m_pWinSock;\
    \          // WinSock sub-system startup/shutdown\n    CStreamSocket * m_pStreamSrv;\
    \   // Stream socket to wait for connections on\n    CStreamSocket * m_pStream;\
    \      // Stream socket to receive from\n\nprotected:\n    CMainView();      \
    \ // protected constructor used by dynamic creation\n\n// Form Data\npublic:\n\
    \    //{{AFX_DATA(CMainView)\n    enum { IDD = IDD_DIALOG_MAIN };\n    // NOTE:\
    \ the ClassWizard will add data members here\n    //}}AFX_DATA\n\n// Attributes\n\
