  md: '# WinSock Database Test Application


    This program, DBTST, allows you to execute WinSock database lookups for hosts
    and services. It uses the following WinSock functions: `WSAStartup()`, `WSACleanup()`,
    `WSAGetLastError()`, `WSACancelAsyncRequest()`, `WSAAsyncGetHostByName()`, `WSAAsyncGetHostByAddr()`,
    `gethostbyname()`, `gethostbyaddr()`, `WSAAsyncGetServByName()`, `WSAAsyncGetServByPort()`,
    `getservbyname()`, `getservbyport()`, and `ntohs()`. This program is created from
    scratch without the benefit of AppWizard. Visual C++ project files are utilized.


    Extra steps must be taken when creating programs from scratch, as opposed to letting
    AppWizard do the grunt work. The benefit of creating a program from scratch is
    that you don’t have to deal with possibly unneeded features such as documents
    and views. This approach is closer to doing things the old SDK way, but it still
    benefits from the Microsoft Foundation Classes.


    The first source files to look at are STDAFX.H and STDAFX.CPP. These files support
    the precompiled header feature. By including STDAFX.H in each implementation file
    (that is, *.CPP), there’s no need to include the mandatory Windows and MFC header
    files in each. STDAFX.H and STDAFX.CPP are shown in Listings 8.3 and 8.4, respectively.
    You must configure the compiler’s precompiled header compiler option to use this
    feature.


    Listing 8.3. STDAFX.H for DBTST.


    ```

    ```cpp

    #include <afxwin.h>

    #include <winsock.h>

    ```

    ```


    Listing 8.4. STDAFX.CPP for DBTST.


    ```

    ```cpp

    #include "stdafx.h"

    ```

    ```


    The next files of interest implement the application object `CTheApp`. `CTheApp`
    is derived from the MFC class `CWinApp`. The class declaration is in DBTST.H,
    shown in Listing 8.5. The class is implemented in DBTST.CPP and is shown in Listing
    8.6. Note that the WinSock startup isn’t as robust as in the WSINFO example; there
    are no error messages displayed on error, for example. Instead, the application
    simply exits immediately if WinSock can’t be initialized.'
