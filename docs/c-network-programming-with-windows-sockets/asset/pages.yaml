  md: "# CStreamSocket::HandleRead()\n\nThe HandleRead() member function handles the\
    \ asynchronous FD_READ event notification messages sent by the WinSock subsystem.\
    \ This function is called when WinSock thinks a read from the socket will succeed.\
    \ The first portion of this function allocates memory for the data and the data’s\
    \ length. A recv() is then attempted. If the receive is successful, the data is\
    \ added to the read queue. If everything goes OK, the m_uMsg message is posted\
    \ to the application window that owns this stream socket object, with wParam set\
    \ to CWIN_SOCK_DONE_READING and lParam set to the number of data buffers waiting\
    \ to be read. When the application receives this message, it should call the Read()\
    \ member function. If there is an error in receiving the data, wParam is set to\
    \ CWIN_SOCK_ERROR_READING. If data is received and the CWIN_SOCK_DONE_READING\
    \ message is sent to the application, a 1 is returned by HandleRead(), otherwise,\
    \ 0 is returned. This differentiation is used by OnWinSockEvent()’s FD_CLOSE handler\
    \ to let it know when all data received on the socket is completely processed.\n\
    \n```\n```cpp\n////////////////////////////////////////////////////////////\n\
    // CStreamSocket::HandleRead()\n//\n// Called when there is an asynchronous read\
    \ event on the socket.\n//\n// If the read was successful, the data and its length\
    \ are stored\n// in the read queue.  Upon a successful read, the application\n\
    // window using this object is then notified with the m_uMsg message\n// (wParam\
    \ set to CWIN_SOCK_DONE_READING; lParam set to the number of\n// data chunks in\
    \ the read queue).  At this point, the application\n// should call Read().  If\
    \ the read fails for some reason, the m_uMsg\n// is sent with wParam set to CWIN_SOCK_ERROR_READING.\n\
    //\nLONG CStreamSocket::HandleRead(WPARAM wParam, LPARAM lParam)\n{\n    while\
    \ (1)\n    {\n        // allocate memory for incoming data\n        LPVOID pData\
    \ = malloc(READ_BUF_LEN);\n        LPSTREAMDATA pStreamData = new STREAMDATA;\n\
    \        if ((pData == NULL) || (pStreamData == NULL))\n        {\n          \
    \  // free anything that was allocated\n            if (pData != NULL)\n     \
    \           free(pData);\n            pData = NULL;\n            if (pStreamData\
    \ != NULL)\n                delete pStreamData;\n            pStreamData = NULL;\n\
    \n            // tell the parent that a possible data read failed\n          \
    \  m_pParentWnd->PostMessage(m_uMsg, CWIN_SOCK_ERROR_READING);\n\n           \
    \ // fake the event to try again\n            PostMessage(CWIN_SOCK_EVENT_NOTIFICATION,\
    \ m_s,\n                WSAMAKESELECTREPLY(FD_READ, 0));\n```\n```"
