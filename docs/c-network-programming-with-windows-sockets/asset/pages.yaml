    # Database Servers


    The networked database server is similar to the compute server but is more common
    in today’s business environment. With this network resource, desktop PCs can query
    and modify a database that’s made available to the entire enterprise. Figure 1.4A
    shows one possible configuration. The user seated at the client computer sends
    a query to the database server. The database server receives the query parameters
    and processes the request. When the database server has completed the necessary
    processing, a response is returned to the client computer. This configuration
    is known as the client/server architecture. The client/server programming model
    is explained later in this chapter.


    Several vendors, including Microsoft, Oracle, and Sybase, provide database servers
    that are geared toward the high-end client/server market. Many companies, such
    as Borland, Gupta, Microsoft, PowerSoft, and Oracle, provide tools necessary to
    build the client portion of the client/server solution.


    A client/server database is especially useful when several people need access
    to the same information. This architecture is desirable because it allows people
    in different locations, possibly even on opposite sides of the globe, to share
    and modify common information. The client/server database architecture not only
    makes it easy to locate users at disparate locations but also allows freedom in
    the location of the databases. With this'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'scenario, as shown in Figure 1.4B, the database can be maintained where it
    makes the most sense. In an order entry system, for example, it might make sense
    to have the billing department maintain the customer records in one database while
    the inventory records are maintained by the parts department in a different database
    stored on another database server. During order entry time, the order entry clerk
    can access both databases and get the most up-to-date information.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_8_0.png)


    # Communications Medium


    The complementary, and somewhat overlapping, goal for a computer network is to
    act as a communications medium. In a basic sense, if this communications medium
    didn’t exist, neither would the ability to share any network resources, as described
    earlier. In this context, however, the communications medium allows network users
    to communicate better with each other. To facilitate this human-to-human communication,
    many networked software tools have been built. Among them are electronic mail
    systems, workgroup scheduling programs, and electronic forms processing systems.'
  merge: -1
  img_proc: true
