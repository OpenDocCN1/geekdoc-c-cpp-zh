    \ map facility is used to map the `CWINSOCK_EVENT_NOTIFICATION` message to the\
    \ `OnWinSockEvent()` function. The message map looks like the following:\n\n```\n\
    // message map\nBEGIN_MESSAGE_MAP(CStreamSocket, CWnd)\n    //{{AFX_MSG_MAP(CStreamSocket)\n\
    \    //}}AFX_MSG_MAP\n    ON_MESSAGE(CWINSOCK_EVENT_NOTIFICATION, OnWinSockEvent)\n\
    END_MESSAGE_MAP()\n```\n\nOnWinSockEvent() checks for errors and, if there are\
    \ none, executes an appropriate message handler. For the FD_ACCEPT, FD_CONNECT,\
    \ and FD_CLOSE events, a message is simply relayed to the parent of the stream\
    \ object. Before the FD_CLOSE message is relayed to the"
