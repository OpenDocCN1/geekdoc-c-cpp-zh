    \                // a real error ...\n        }\n        else\n        {\n   \
    \         // got some data ...\n        }\n\n        break; // case FD_READ\n\n\
    } // switch\n\nreturn 0L;\n```\n```\n\nNotice that the asynchronous select message\
    \ handler, `CClientWindow::OnAsyncSelect()`, handles multiple WinSock events,\
    \ so a switch statement is used. As soon as the client’s connect succeeds, the\
    \ FD_CONNECT message is sent, telling us that the socket is connected. This example\
