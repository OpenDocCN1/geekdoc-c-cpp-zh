  md: "# ## CDatagramSocket::Write()\n\nThe `Write()` member function writes data\
    \ to the specified destination host and port. The data is not immediately sent\
    \ out the socket, though. Instead, the data, its length, and the data’s destination\
    \ address are added to the write queue. The data is not sent until the datagram\
    \ socket receives the `FD_WRITE` message from the WinSock subsystem, notifying\
    \ it that sending is now possible.\n\nBecause the data is not sent immediately,\
    \ the data specified by the data pointer must not be deallocated or reused until\
    \ the window that owns the datagram socket receives the `m_uMsg` message with\
    \ `wParam` set to `C WINSOCK_DONE_WRITING` or `WINSOCK_ERROR_WRITING`. When this\
    \ message is received by the application window, `lParam` is the pointer to the\
    \ data sent. At this point, the data specified by the pointer can be freed or\
    \ reused. If the `Write()` function fails immediately, denoted by the function\
    \ returning something other than `CWINSOCK_NOERROR`, the data pointer may be freed\
    \ or reused (the `m_uMsg` write message will never be received for this data pointer).\n\
    \nThere are three implementations of the `Write()` member function. All three\
    \ functions have parameters that specify the number of bytes to send and a pointer\
    \ to the data. The remaining function parameters vary depending on how you call\
    \ `Write()`. `Write()` returns `CWINSOCK_NOERROR` on success.\n\nOne implementation\
    \ takes a string containing the dotted-decimal IP address of the destination or\
    \ the destination host name, and an integer parameter representing the port number,\
    \ in host byte order. This version of `Write()` simply converts the integer to\
    \ a string and calls another version of the function that’s designed to accept\
    \ a string containing the port number or service name.\n\n```\n///////////////////////////////////////////////////////////////////////\n\
    // CDatagramSocket::Write()\n//\n// Write data to the socket specified by the\
    \ name and port.\n//\n// This version of the Write() function takes an integer\n\
    // representing the length of the data to send, a pointer\n// to the data to send,\
    \ a pointer to a string representing\n// the host name to send the data to, and\
    \ an integer\n// representing the port number to send to.\n//\n// The data pointed\
    \ to by pData must remain valid until either\n// the Write() function returns\
    \ with an error, or the\n// write's completion is notified by the m_uMsg being\
    \ sent\n// to the window that owns this datagram object with wParam set\n// to\
    \ CWINSOCK_DONE_WRITING or CWINSOCK_ERROR_WRITING.\n//\nint CDatagramSocket::Write(int\
    \ nLen, LPVOID pData,\n    LPSTR pszRemoteName, int nRemotePort)\n```"
