  md: 'initially passed to `Write()`. The data may also be deallocated if `Write()`
    returns an error value. There are several options for the destination specifier.
    The following code shows the many ways of calling `Write()`:


    ```

    int nLen;

    LPVOID pData;

    char pszHostName[100];

    char pszHostIP[100];

    int nPort;

    char pszServiceName[100];

    SOCKADDR_IN sin;

    int nStatus;


    ... allocate data buffer and assign destination specifiers...


    nStatus = m_pdg->Write(nLen, pData, pszHostName, nPort);

    nStatus = m_pdg->Write(nLen, pData, pszHostIP, nPort);

    nStatus = m_pdg->Write(nLen, pData, pszHostName, pszServiceName);

    nStatus = m_pdg->Write(nLen, pData, pszHostIP, pszServiceName);

    nStatus = m_pdg->Write(nLen, pData, &sin);

    ```


    You also have an option with the way the data buffer is allocated. You may allocate
    one buffer that gets continually reused. You know when it’s safe to reuse the
    buffer when the write notification message comes in with `wParam` set to `CWINSOCK_DONE_WRITING`
    or `CWINSOCK_ERROR_WRITING`. The other option you have is to allocate a new buffer
    whenever you want to send. In this case you would simply free each buffer when
    the `CWINSOCK_DONE_WRITING` or `CWINSOCK_ERROR_WRITING` message arrives.


    To receive data, the application must provide a pointer to an integer to retrieve
    the number of bytes read. A pointer to a `SOCKADDR_IN` structure can optionally
    be provided to retrieve the address of the datagram’s sender. The `Read()` function
    returns a pointer to the data or NULL on error. `Read()` should be called when
    the message handler is activated with `wParam` set to `CWINSOCK_DONE_READING`.
    Following are the two ways to call `Read()`:


    ```

    LPVOID pDataRead;

    int nLen;

    SOCKADDR_IN sin;


    pDataRead = m_pdg->Read(&nLen);

    pDataRead = m_pdg->Read(&nLen, &sin);

    ```


    It’s the application’s responsibility to free the pointer returned by `Read()`.


    To end the use of the datagram socket object, call `DestroySocket()`, as in:


    ```

    int nStatus;

    nStatus = m_pdg->DestroySocket();

    ```'
