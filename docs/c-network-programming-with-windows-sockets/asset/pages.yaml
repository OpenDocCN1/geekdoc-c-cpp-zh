    When a WM_CHAR message comes in that is destined for the CTestView window, the
    message map is examined to see how the message should be routed. Because ON_WM_CHAR
    is in the message map, MFC knows that the application has a message handler in
    place. The WM_CHAR message is one for which there is a default handler already
    in place in CTestView’s base class of CView. MFC knows that WM_CHAR maps to the
    OnChar member function. You will see in a later chapter how to add user-defined
    message handlers that are unique to your application. Because MFC doesn’t know
    of these message handlers, you have to specify in the message map the name of
    the member function that handles that message.


    # Support Files for Building WinSock Applications


    To compile an application that uses the WinSock API, you need the WinSock header
    file WINSOCK.H, which contains all the function prototypes and structure definitions.
    Linking the application requires either WINSOCK.LIB or WSOCK32.LIB depending on
    whether you’re targeting the 16-bit or 32-bit Windows platform. WINSOCK.H and
    WSOCK32.LIB are included with Visual C++ 1.1 for Windows NT. WINSOCK.H and WINSOCK.LIB
    are available from your TCP/IP stack provider.


    To ensure source code compatibility between the 16-bit and 32-bit programs, the
    standard 16-bit Windows include file VER.H must be named WINVER.H, as it is named
    in the 32-bit environment. If you’re using a 16-bit compiler, I suggest going
    into the compiler’s include directory and copying VER.H to WINVER.H.


    A detailed discussion of how to build WinSock applications is included in Chapter
    8, “Sample Applications.”


    # Summary


    The Visual C++ integrated development environment has greatly simplified development
    of Windows programs. The well-integrated tools make it easy to create applications
    that use the MFC library. The WinSock class library developed later in this book
    will make extensive use of MFC’s functionality. The development of these classes
    will show the power and flexibility of Visual C++.'
