- pgno: 191
  md: 'The previous chapter examined several sample programs that utilize WinSock
    functions. You may notice that the applications are “littered” with WinSock-specific
    function calls. Although that style of programming may have been considered satisfactory
    a few years ago, today’s object-oriented concepts and languages allow applications
    to better isolate explicit functionality, such as networking.


    The remainder of this book presents a framework upon which networked applications
    are built, along with several sample applications that use the framework. This
    framework is built as a set of C++ classes.


    # Objectives


    The objectives of generating a class library to manage WinSock network communication
    are similar to the objectives that object-oriented programming has, including
    simplification, generalization, and encapsulation. When designing the class library,
    you shouldn’t think of how to incorporate all of the WinSock functions into a
    class; you should instead look at it from the application’s perspective and ask,
    “What does an application need to do?”


    You can see from the previous sample programs that networked applications perform
    relatively few functions. Don’t confuse functions with function calls, though.
    The WinSock functionality used most often is the following:


    +   - Start and stop WinSock.

    +   - Resolve names humans like to use into a format useable by the computer.

    +   - Create an end-point of communication and optionally assign a name to it.

    +   - Destroy an end-point.

    +   - Listen for and accept connections to an end-point.

    +   - Connect to an end-point.

    +   - Send and receive data to and from an end-point.


    Essentially, that is all the functionality WinSock provides to an application.
    Of course, the devil is in the details. The objective of the class library is
    to hide these details from the application. This allows the application to be
    developed and debugged separately from the networking portion. The networking
    portion, the WinSock class library, is developed and debugged until it’s fully
    functional. The application can then use the class library as a simple black box;
    feed a certain input into the black box and get a certain output from it.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Judging from the functionality list, a good class breakdown might have three
    classes:


    +   - Start, stop, and retrieve information on WinSock

    +   - Datagram socket (send to and receive from)

    +   - Stream socket (listen, accept, connect, send, and receive)


    # Encapsulation


    The class library encapsulates many of the details required to effectively use
    WinSock. Looking at the previous samples, you can see the need for several variables,
    many of which are used once and then discarded. The class library encapsulates
    these variables and only exposes to the application those that are essential.


    # Simplification


    The class library also has a goal of simplifying the application’s access to network
    functionality. Part of that simplification is handled by the encapsulation of
    variables and functions in the class, and another part comes from exposing only
    what is absolutely necessary to the application. The class library hides the intricacies
    of performing certain functions. For example, examine the very common WinSock
    functionality of sending stream data. In the previous samples, the application
    had to know when it was able to send more data. It also had to keep track of how
    much of the data was left to send in the buffer after each successful, but partial,
    send. By using the class library, the application can simply perform a send on
    a piece of data and the object keeps track of when data can be sent and how much
    of the data remains to be sent. The object may then notify the application when
    it has completed the send, but in the meantime, the application divorces itself
    from the details of sending the data.


    # Generalization


    Designing a class library mandates that the functionality be generalized. These
    classes may be base classes for some future derived classes. They must be general
    enough to not prevent their use as base classes, but they must also have enough
    functionality to be useful right away.


    # Compromises


    To maintain the generality of the class, some compromises are made. When considering
    what the compromises are, you must look back to the list that describes the WinSock
    functionality of which an application takes advantage.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'As an example of a compromise that could be made, look at a sample server application.
    The two servers presented in the preceding chapter, DESERV and SESERV, didn’t
    specify which port they operated on. Instead, they let WinSock assign one dynamically.
    In this case, the matching client program needed to know this port number before
    it could communicate with the server. It’s much more common that the port to which
    a service is assigned is hard-coded or entered into the services file on the hosts,
    allowing the port number to be resolved by its name. With this in mind, a compromise
    could be made mandating that a server socket specify either a port number or a
    service name; letting WinSock decide whether the port number could be prevented.
    This compromise simplifies both the server and client, and hence the class library
    itself.


    # Implementation Details


    The entire WinSock class library, composed of several classes, is implemented
    in the CWINSOCK.CPP file with CWINSOCK.H containing the class declarations. This
    source file is simply added to each project that requires WinSock functionality.
    This is in contrast to creating a dynamic link library that is then linked to
    the application. If you want to create a DLL out of the WinSock classes, you have
    to use a Microsoft Foundation Class Extension DLL because some of the WinSock
    classes are derived from MFC classes. The creation of such a DLL is beyond the
    scope of this book, but documentation on how to do so is available from Microsoft
    sources such as the Developer Network CD.


    The actual code for the WinSock class libraries follows the convention used in
    the Microsoft Foundation Class library. All class names begin with a capital C,
    as in:


    ```

    class CWinSock

    ```


    All class member variables begin with the m_ prefix. The Hungarian naming convention
    is appended after the m_ prefix but before the actual variable name. For example,
    an integer containing the length of a buffer might look like the following:


    ```

    int m_nBufLen;

    ```


    This naming convention should ensure quick, easy recognition and understanding
    of WinSock class references in your applications.


    # Summary


    This chapter introduces the notion of a WinSock class library, including its requirements
    and possible limitations. Chapters 10 through 13 describe several classes that
    compose the WinSock class library. These classes are then used in fully functional
    programs in Chapters 14 through 16.'
  merge: -1
  img_proc: true
