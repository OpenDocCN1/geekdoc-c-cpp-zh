    \ are used\n * to encode the in/out status of the parameter; for now\n * we restrict\
    \ parameters to at most 128 bytes.\n */\n#define IOC_PARAM_MASK   0x7f       \
    \   /* parameters must be < 128 bytes */\n#define IOC_VOID         0x20000000\
    \    /* no parameters */\n#define IOC_OUT          0x40000000    /* copy out parameters\
    \ */\n#define IOC_IN           0x80000000    /* copy in parameters */\n#define\
    \ IOC_INOUT        (IOC_IN|IOC_OUT)\n                                      /*\
    \ 0x20000000 distinguishes new &\n                                         old\
    \ ioctl's */\n#define _IO(x,y)         (IOC_VOID|((x)<<8)|y)\n\n#define _IOR(x,y,t)\
    \      (IOC_OUT|(((long)sizeof(t)&IOCPARM_MASK)<<16)|(x<<8)|y)\n\n#define _IOW(x,y,t)\
    \      (IOC_IN|(((long)sizeof(t)&IOCPARM_MASK)<<16)|(x<<8)|y)\n\n#define FIONREAD\
    \         _IOR('f', 127, u_long) /* get # bytes to read */\n#define FIONBIO  \
    \        _IOW('f', 126, u_long) /* set/clear non-blocking i/o */\n#define FIOASYNC\
    \         _IOW('f', 125, u_long) /* set/clear async i/o */\n\n/* Socket I/O Controls\
