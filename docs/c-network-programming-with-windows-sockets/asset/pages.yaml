- pgno: 71
  md: 'is simply extended to fill the remaining bytes to make a total of four bytes.
    For example, if the string passed to `inet_addr()` is “166.78.16”, following the
    a.b.c format, the returned unsigned long is hexadecimal A64E0010.


    # Converting a Binary IP Address to a String


    `inet_ntoa()` performs the opposite job of `inet_addr()`. Its function prototype
    is as follows:


    ```

    char FAR * PASCAL FAR inet_ntoa(struct in_addr in);

    ```


    in is a structure that contains an Internet host address. You’ll see that some
    WinSock functions manipulate IP addresses as unsigned longs and others as in_addr
    structures. To remedy this difference, some byte copying is in order. This is
    shown in the following sample code. On success, the `inet_ntoa()` function returns
    a pointer to a string with a dotted-decimal representation of the IP address.
    On error, `NULL` is returned. A NULL value means that the IP address passed as
    the parameter is invalid.


    Following is a piece of somewhat contrived code:


    ```

    ```c

    // first get an unsigned long with a valid IP address

    u_long ulIPAddress = inet_addr("166.78.16.148");


    // copy the four bytes of the IP address into an in_addr structure

    IN_ADDR in;

    memcpy(&in, &ulIPAddress, 4);


    // convert the IP address back into a string

    char lpszIPAddress[16];

    lstrcpy(lpszIPAddress, inet_ntoa(in));

    ```

    ```


    I said the previous sample was contrived because of the way the binary IP address
    was retrieved. The binary IP address ulIPAddress is retrieved by using `inet_addr()`
    to convert an IP address string. In an actual program, the IP address on which
    you want to use `inet_ntoa()` will most likely come as the result of another WinSock
    call, not entered by the user or hard-coded; this part of the code is for demonstration
    purposes only. Once you have this unsigned long, it needs to be stored in an in_addr
    structure to be used by `inet_ntoa()`, so `memcpy()` is used. Next, the conversion
    function is called. The string pointer returned by `inet_ntoa()` is only temporary.
