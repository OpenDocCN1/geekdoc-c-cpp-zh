  md: '# # Server INISRV


    The INISRV program uses the Multiple Document Interface. The program has two views
    that are derived from the CFormView object. CMainView, shown in Listings 15.3
    and 15.4, shows status information for the server socket that waits for connection
    requests from clients. CServerView, shown in Listings 15.5 and 15.6, shows status
    information for the connected socket that processes database commands sent by
    clients.


    CMainView''s m_pWinSock member variable controls the starting and stopping of
    the WinSock subsystem for this program. pStreamSrv is a global variable that points
    to the server stream socket object that waits for connections from clients.


    The CMainView::OnStreamSrv() member function receives status information for the
    server stream socket object. It''s triggered by the WM_USER_STREAMSRV user-defined
    message whenever a client requests a connection to the server.


    The implementation of the CMainView object is shown in Listing 15.4. This object
    performs the initialization work for the INISRV application. CMainView''s OnInitialUpdate()
    is called soon after the object is created. This function is responsible for starting
    the WinSock subsystem and creating a server stream socket that waits for connection
    requests to arrive from clients.


    # ## Multiple Views


    When a client requests a connection, the OnStreamSrv() member function is triggered
    with wParam set to CWinSock::READY_TO_ACCEPT_CONNECTION. A new view, of type CServerView,
    is then launched to accept the client connection. This new view is supported by
    having two document templates, as shown in Listing 15.3 and 15.4. One template
    uses CMainView and the other uses CServerView.


