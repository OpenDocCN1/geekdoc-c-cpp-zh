- pgno: 137
  md: 'This chapter presents four sample programs that make use of the WinSock functions
    described in the preceding three chapters. The first sample initializes WinSock
    and offers you a dialog box to view specifics about the WinSock implementation
    on which the program is running. The second sample application gives you access
    to WinSock database functions, in both their blocking and nonblocking modes of
    operation. The third and fourth samples are composed of two programs each: a client
    that sends either datagrams or stream data and a server that receives them and
    sends them back to the client.


    # Maintaining 16-Bit and 32-Bit Projects


    With the help of the Microsoft Foundation Class library, it’s very easy to maintain
    the same source code for both a 16-bit executable and a 32-bit executable. Unfortunately,
    maintaining the Visual C++ projects for these different executable versions isn’t
    as easy. The project files (makefiles) for 16-bit Visual C++ 1.5 and 32-bit Visual
    C++ 1.1 aren’t compatible; you must maintain two separate project files.


    The easiest way to do this is to use the Visual C++ product that you like best
    (16-bit or 32-bit) to create a project and then create a makefile for the other
    environment. As an example, suppose that a project named PROJ is initially developed
    with the 16-bit compiler. The Visual C++ 16-bit project file is called PROJ.MAK.
    After program development is far enough along, rename the PROJ.MAK file to PROJ.M16
    and remove all temporary files in the project’s directory (for example, *.OBJ
    and *.RES). Next, launch 32-bit Visual C++ and select New… from the Project menu.
    Add all of the source needed to build the project, as well as any libraries it
    needs to link with. Call this new project PROJ as well. Use this project file
    to build the 32-bit version. When you wish to switch back to the 16-bit environment,
    rename the PROJ.MAK to PROJ.M32 and then copy PROJ.M16 to PROJ.MAK.


    If you’re wondering why not just use different project names such as PROJ16.MAK
    and PROJ32.MAK, the answer lies in Visual C++ and its associated tools, such as
    App Studio and ClassWizard. These tools use the project file’s name when determining
    what other files are named. This makes it difficult to use App Studio and ClassWizard
    effectively. This limitation also makes it difficult to use separate directories
    for the projects, as in \\PROJ16BIT\PROJ.MAK and \\PROJ32BIT\PROJ.MAK.


    To simplify the procedure of switching between 16-bit and 32-bit project files,
    a couple of batch files are used. The batch file shown in Listing 8.1 is used
    to select which project file to use. Note that this batch file should be used
    only when you’re prepared to build the project under the new compiler, because
    all of the object files and other temporary files are removed by running the script.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Listing 8.1. USE.BAT batch file.


    ```

    ```bat

    @ECHO OFF

    REM Replace PROJ with the actual project name


    IF "%1"=="16" GOTO USE

    IF "%1"=="32" GOTO USE


    ECHO Directions for use: USE 16 or USE 32

    GOTO END


    :USE

    IF NOT EXIST PROJ.%1 GOTO NOFILE

    DEL *.APS

    DEL *.BSC

    DEL *.CLW

    DEL *.EXE

    DEL *.OBJ

    DEL *.PCH

    DEL *.PDB

    DEL *.RES

    DEL *.SBR

    DEL *.VCW

    DEL *.WSP

    COPY PROJ.%1 PROJ.MAK

    GOTO END


    :NOFILE

    ECHO %1-bit project file does not exist

    GOTO END


    :END

    ```

    ```


    The batch file shown in Listing 8.2 is a script used to save the project file
    to the appropriate 16-bit or 32-bit makefile. Be careful when using this batch
    file because you could accidentally write over the 16-bit makefile with the 32-bit
    version, and vice versa. For example, don’t run 32-bit Visual C++, exit Visual
    C++, and then run SAVE 16. This will cause you to lose the 16-bit project file.


    # Listing 8.2. SAVE.BAT batch file.


    ```

    ```bat

