    #endif\n\n/////////////////////////////////////////////////////////////////////////////\n\
    // CMainView\n\nIMPLEMENT_DYNCREATE(CMainView, CFormView)\n\nCMainView::CMainView()\n\
    \t: CFormView(CMainView::IDD)\n{\n\tm_s = INVALID_SOCKET; // initialize socket\
    \ to invalid handle\n\n\t//{{AFX_DATA_INIT(CMainView)\n\t\t// NOTE: the ClassWizard\
    \ will add member initialization here\n\t//}}AFX_DATA_INIT\n}\n\nCMainView::~CMainView()\n\
    {\n\t// if the socket was opened successfully, close it\n\n\tif (m_s != INVALID_SOCKET)\n\
    \t{\n\t\tclosesocket(m_s);\n\t\tm_s = INVALID_SOCKET;\n\t}\n}\n\nvoid CMainView::DoDataExchange(CDataExchange*\
    \ pDX)\n{\n\tCFormView::DoDataExchange(pDX);\n\t//{{AFX_DATA_MAP(CMainView)\n\t\
    \t// NOTE: the ClassWizard will add DDX and DDV calls here\n\t//}}AFX_DATA_MAP\n\
