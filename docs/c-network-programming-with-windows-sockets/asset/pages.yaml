  md: "**FIGURE 13.2.**  \n*CWinSockErrorBox()*  \n*with second parameter.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_247_0.png)\n\
    \n# Implementation Details\n\nThe error message strings that are copied into pszError\
    \ within the large switch statement consume a significant amount of DGROUP space\
    \ in your application. If you get compiler errors referring to DGROUP space, consider\
    \ moving these error message strings into the string table of your project’s resource\
    \ file. You can then use the `LoadString()` function to retrieve the appropriate\
    \ text.\n\nAs discussed in Chapter 9, “Design Goals,” the three classes (`CWinSock`,\
    \ `CDatagramSocket`, and `CStreamSocket`) and the `CWinSockErrorBox()` function\
    \ are implemented in the WINSOCK.CPP file. The class and function prototypes are\
    \ contained in the WINSOCK.H file. The WINSOCK.CPP source file is simply added\
    \ to each project that requires WinSock functionality.\n\n# Summary\n\nThis chapter\
    \ wraps up the WinSock class library. The remaining chapters of the book examine\
    \ several sample programs that make use of the class library developed in Chapters\
    \ 9 through 13."
