  md: "```\n```\nMessageBox(lpszMessage, \"Info\");\n\n...\n\n    }\n}\n}\n```\n```\n\
    \nIn this example, the accept() function is called with a pointer to a sockaddr_in\
    \ structure and a pointer to an integer containing the length of the sockaddr_in\
    \ structure. When the accept() function successfully returns, the sockaddr_in\
    \ structure contains the address information of the connecting client. As noted\
    \ previously, you can pass NULL for these two parameters and no client information\
    \ will be conveyed to the accepting server application. The alternative method\
    \ of discovering details about the connecting client is to use the getpeername()\
    \ function. Its prototype is as follows:\n\n```\n```\nint PASCAL FAR getpeername(SOCKET\
    \ s,\n    struct sockaddr FAR * name, int FAR * namelen);\n```\n```\n\nIts parameters\
    \ are the same as those of accept() except that the socket s is the socket descriptor\
    \ that's returned by accept(), not the socket descriptor that's used to listen\
    \ for connections. The other difference is that the function prototype uses name\
    \ and namelen rather than addr and addrlen, respectively. The inconsistent use\
    \ of the terms name and address is a problem with some WinSock functions.\n\n\
    On success, getpeername() returns 0 (zero). On error, SOCKET_ERROR is returned\
    \ and WSAGetLastError() should be called to find out the reason for the error.\
    \ Possible error values include: WSAENOTINITIALIZED if WSAStartup() wasn't called\
    \ successfully; WSAENETDOWN if the network subsystem is failing; WSAEFAULT if\
    \ namelen is too small; WSAEINPROGRESS if a blocking WinSock call is currently\
    \ in progress; WSAENOTSOCK if the socket descriptor s is invalid; or WSAENOTCONN\
    \ if the socket isn't connected to a client.\n\nTo use this function you do something\
    \ like this:\n\n```\n```\n...\n// accept a connection\nclientS = accept(s, NULL,\
    \ NULL);\nif (clientS == INVALID_SOCKET)\n{\n    wsprintf(lpszMessage, \"accept()\
    \ generated error %d\",\n        WSAGetLastError());\n    MessageBox(lpszMessage,\
    \ \"Info\");\n}\nelse\n{\n    if (getpeername(clientS,\n        (LPSOCKADDR)&clientAddr,\
    \ &clientAddrLen) == SOCKET_ERROR)\n    {\n        wsprintf(lpszMessage, \"getpeername()\
    \ generated error %d\",\n            WSAGetLastError());\n        MessageBox(lpszMessage,\
    \ \"Info\");\n```\n```"
