    \ WSAENETDOWN if the network subsystem is failing; WSAEWOULDBLOCK if the function\
    \ cannot be scheduled at this time due to a resource conflict within the specific\
    \ WinSock implementation; or WSAEINPROGRESS if a blocking WinSock operation is\
    \ currently in progress. The function's return value doesn't tell you whether\
    \ the requested information was retrieved successfully; all it tells you is whether\
    \ the function was started properly.\n\nThis function is used much like the other\
    \ asynchronous functions discussed thus far. Using an MFC implementation method\
    \ to replicate the example given in the getservbyport() example would have a class\
    \ declaration like the following:\n\n```\n```c\nclass CMyWindow : public CFrameWnd\n\
