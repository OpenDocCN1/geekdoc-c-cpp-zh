  md: "```\n}\n\nreturn nStatus;\n}\n```\n\n# CDatagramSocket::LastError()\n\nThe\
    \ `LastError()` member function is implemented as an in-line function. It simply\
    \ returns the `m_nLastError` value that contains the last WinSock error message\
    \ generated by the `CDatagramSocket` object. This function should be called whenever\
    \ a `CDatagramSocket` member function returns `CWINSOCK_WINSOCK_ERROR`.\n\n# Application\
    \ Responsibility\n\nThe goal of this object is to enable the rapid development\
    \ of a networked application using datagram sockets. The public interface to the\
    \ `CDatagramSocket` object consists of the following functions: `CreateSocket()`,\
    \ `DestroySocket()`, `Read()`, `Write()`, and `LastError()`.\n\nThe application\
    \ must provide a certain level of support for the datagram object. The application\
    \ must provide a message handler to receive messages sent from the object. Also,\
    \ the datagram object’s constructor requires a pointer to the application window\
    \ object and a message. A sample call to a datagram object constructor looks like\
    \ the following:\n\n```\npdg = new CDatagramSocket(this, WM_USER + 1);\n```\n\n\
    An entry must be made in the message map to associate the `WM_USER + 1` message\
    \ to an application member function.\n\n```\nBEGIN_MESSAGE_MAP(CMainFrame, CFrameWnd)\n\
    \  //{{AFX_MSG_MAP(CMainFrame)\n  //}}AFX_MSG_MAP\n  ON_MESSAGE(WM_USER + 1, OnWinSockEvent)\n\
    END_MESSAGE_MAP()\n```\n\nThe function that handles the `WM_USER + 1` message,\
    \ `OnWinSockEvent` in this case, must have handlers for four different `wParam`\
    \ values. In the following code snippet, `m_pdg` is a member variable of the `CMainFrame`\
    \ class, which points to a `CDatagramSocket` object. The following code may be\
    \ used as a template for your datagram socket object message handler:\n\n```\n\
    LONG CMainFrame::OnWinSockEvent(WPARAM wParam, LPARAM lParam)\n{\n    LPVOID pDataWritten;\n\
    \    LPVOID pDataRead;\n    int nLen;\n```"
