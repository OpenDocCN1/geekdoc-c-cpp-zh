- pgno: 117
  md: '# FIGURE 7.4.


    Client computer on

    two networks.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_117_0.png)


    s is the socket to use for the connection. name is the address of the server to
    connect to. It is always a `sockaddr_in` Internet address structure for WinSock
    1.1. `namelen` is the length of the name parameter.


    On success, `connect()` returns 0 (zero). On failure, it returns `SOCKET_ERROR`
    and `WSAGetLastError()` should be called to find out the cause of the error. Possible
    error values include the following: `WSANOTINITIALISED` if WinSock hasn’t been
    successfully initialized with a call to `WSAStartup()`; `WSAENETDOWN` if the network
    subsystem is failing; `WSAEADDRINUSE` if the address is already in use; `WSAEINTR`
    if the blocking call was canceled with `WSACancelBlockingCall()`; `WSAEINPROGRESS`
    if a blocking WinSock call is in progress; `WSAEADDRNOTAVAIL` if the address specified
    by `addr` isn’t available; `WSAEAFNOSUPPORT` if the addresses in the specified
    family can’t be used with this socket; `WSAECONNREFUSED` if the server forcefully
    refused the connection attempt; `WSAEDESTADDRREQ` if `name` isn’t specified; `WSAEFAULT`
    if `namelen` is invalid; `WSAEINVAL` if socket `s` isn’t bound to an address;
    `WSAEISCONN` if socket `s` is already connected; `WSAEMFILE` if there are no free
    file descriptors; `WSAENETUNREACH` if the network can’t be reached from this host
    at this time; `WSAENOBUFS` if no buffer space is available; `WSAENOTSOCK` if socket
    `s` isn’t a valid socket descriptor; `WSAETIMEDOUT` if the attempt to connect
    timed out; or `WSAEWOULDBLOCK` if socket `s` is marked as nonblocking and this
    connection can’t be completed immediately.'
