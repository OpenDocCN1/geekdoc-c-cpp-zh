    \        wsprintf(m_lpszMessage, \"Host %s has IP address \", m_phostent->h_name);\n\
    \        wsprintf(m_lpszIP, \"%s\", inet_ntoa(m_in));\n        lstrcat(m_lpszMessage,\
    \ m_lpszIP);\n        MessageBox(m_lpszMessage, \"Info\");\n    }\n\n    return\
    \ 0L;\n}\n```\n```\n\nNote that the OnAsyncGetHostByAddr() member function is\
