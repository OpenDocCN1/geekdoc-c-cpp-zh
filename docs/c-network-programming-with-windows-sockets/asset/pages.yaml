    # Canceling an Outstanding Asynchronous Request


    The handle returned by the asynchronous database functions, such as `WSAAsyncGetHostByName()`,
    can be used to terminate the database lookup. The `WSACancelAsyncRequest()` function
    performs this task. Its prototype is the following:


    ```

    int PASCAL FAR WSACancelAsyncRequest(HANDLE hAsyncTaskHandle);

    ```


    `hAsyncTaskHandle` is the handle to the asynchronous task you wish to abort. On
    success, this function returns 0 (zero). On failure, it returns `SOCKET_ERROR`,
    and `WSAGetLastError()` can be called. Possible errors include the following:
    `WSANOTINITIALISED` if `WSAStartup()` wasn’t called successfully; `WSAENETDOWN`
    if the network subsystem is failing; `WSAEINPROGRESS` if a blocking WinSock operation
    is currently in progress; `WSAEINVAL` if the specified asynchronous task handle
    is invalid; or `WSAEALREADY` if the asynchronous routine being canceled has already
    completed. `WSAEALREADY` might result if the original operation has already completed
    and the resulting message has been processed or if the original operation has
    already completed but the resulting message is still waiting in the application’s
    message queue.


    By using `WSACancelAsyncRequest()` in your applications, you give users much greater
    control over the program. If users perform an operation that generates an asynchronous
    database call and the operation is taking an excruciatingly long time to complete,
    as it might when networked name servers are involved, it’s nice to let users regain
    control of the program instead of being at its mercy.


    # IP Address Resolution


    IP address resolution is the opposite of host name resolution. In host name resolution,
    using `gethostbyname()` or `WSAAsyncGetHostByName()`, the objective is to get
    the IP address when you know the host name. The goal of IP address resolution
    is to get the host name, and other host information, when all you know is its
    IP address. The `gethostbyaddr()` and `WSAAsyncGetHostByName()` functions are
    used to fulfill this goal. If you haven’t yet, please read and get a full understanding
    of the `gethostbyname()` and `WSAAsyncGetHostByName()` functions; the remaining
    functions are used in a similar manner as those two functions, so the explanations
    for the following functions have been abbreviated.'
