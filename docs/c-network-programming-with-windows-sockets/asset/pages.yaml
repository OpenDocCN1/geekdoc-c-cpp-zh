- pgno: 276
  md: "server accepts the client’s connection request, `OnStream()` is called with\
    \ `wParam` set to `CWINSOCK_YOU_ARE_CONNECTED`.\n\n# Command Identifier\n\nThe\
    \ user enters the read or write parameters into the appropriate fields and then\
    \ selects either the Read or Write button, triggering `OnClickedButtonRead()`\
    \ or `OnClickedButtonWrite()`, respectively. These functions format the database\
    \ command and call `FillAndSendDBCmd()`, which assigns a unique identifier to\
    \ the database command and sends it to the server. The database command has the\
    \ following structure:\n\n```\ntypedef struct tagDBCOMMAND\n{\n    int nID;  \
    \                 // database command identifier\n    int nCommand;          \
    \     // database command\n    char szFile[DBBUFSIZE];    // INI file\n    char\
    \ szSection[DBBUFSIZE]; // section of INI file\n    char szEntry[DBBUFSIZE]; \
    \  // entry within section of INI file\n    char szValue[DBBUFSIZE];   // value\
    \ of entry within section of INI file\n} DBCOMMAND, FAR * LPDBCOMMAND;\n```\n\n\
    `ClassWizard` is used to limit the number of bytes that may be entered into the\
    \ data entry fields of `CMainView`. This limit is set to 40 to match the `DBBUFSIZE`\
    \ value used in the preceding `DBCOMMAND` definition.\n\nPossible commands for\
    \ the client are `DB_READ` and `DB_WRITE`. A unique identifier is assigned because\
    \ there could be multiple outstanding database requests; the client and server\
    \ operate totally asynchronously. The identifier may be used to correlate the\
    \ command and its asynchronous response. Once the command is successfully sent,\
    \ `OnStream()` is called with `wParam` set to `CWINSOCK_DONE_WRITING`. When the\
    \ server is done processing the database command, it sends a response to the client,\
    \ triggering `OnStream()` with `wParam` set to `CWINSOCK_DONE_READING`. The `HandleRead()`\
    \ function processes the database response sent by the server.\n\n# Heartbeat\
    \ Link Status Indicator\n\nThis application has a timer that’s used to keep track\
    \ of missing heartbeat messages. The `OnDatagram()` function handles reception\
    \ of the heartbeats sent from the connected server. If one heartbeat message is\
    \ missed, the traffic light status indicator changes to a yellow light. Missing\
    \ two or more heartbeats causes the light to turn red. If the heartbeats are received\
    \ without fail, the light remains green. This provides for a visual cue as to\
    \ the state of the server.\n\nWhen `CMainView`’s destructor is called, the stream\
    \ and datagram sockets are destroyed and the WinSock subsystem is shut down."
