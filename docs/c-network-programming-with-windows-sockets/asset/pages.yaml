- pgno: 115
  md: "# # How Clients Connect to Servers\n\nYou have now seen how a server creates\
    \ a socket, gives it a name, listens for connections, and accepts connections\
    \ from clients. This section explains what a client does to connect to a server\
    \ application.\n\n# ## Giving the Socket a Default Name\n\nAfter the call to `socket()`,\
    \ the `bind()` function may be used to give the socket a name. This step might\
    \ be necessary because calling `socket()` simply reserves a socket descriptor.\
    \ By naming the socket with `bind()`, you give the socket a port, out of which\
    \ it communicates with a server.\n\nThe use of `bind()` to give a client socket\
    \ a default name is shown here:\n\n```\n```c\nSOCKET s;                    //\
    \ socket descriptor\nchar lpszMessage[100];       // informational message\nSOCKADDR_IN\
    \ addr;            // Internet address\n\n// create a stream socket\ns = socket(AF_INET,\
    \ SOCK_STREAM, 0);\nif (s != INVALID_SOCKET)\n{\n    // fill out the socket's\
    \ address information\n    addr.sin_family = AF_INET;\n    addr.sin_port = 0;\
    \       // let WinSock assign a port\n    addr.sin_addr.s_addr = htonl(INADDR_ANY);\n\
    \n    // bind the socket to its address\n    if (bind(s, (LPSOCKADDR)&addr, sizeof(addr))\
    \ == SOCKET_ERROR)\n    {\n        wsprintf(lpszMessage, \" bind() generated error\
    \ %d\",\n            WSAGetLastError());\n        MessageBox(NULL, lpszMessage,\
    \ \"Info\", MB_OK);\n    }\n    else\n        ...\n}\n```\n```\n\nNote that `addr.sin_port`\
    \ is assigned 0 (zero). This allows WinSock to assign any unused port it sees\
    \ fit. This is in contrast to a server socket, which needs to listen for connections\
    \ on a specific port. It really doesn’t matter which port a client uses. But if\
    \ you do want to know which port a socket was assigned, you can use the `getsockname()`\
    \ function. Its function prototype is as follows:\n\n```\n```c\nint PASCAL FAR\
    \ getsockname(SOCKET s,\n  struct sockaddr FAR *name, int FAR * namelen);\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "It is used much like `getpeername()`. An example call to `getsockname()` is\
    \ listed here:\n\n```\n```c\nSOCKET s;                         // socket descriptor\n\
    char lpszMessage[100];             // informational message\nSOCKADDR_IN nAddr;\
    \                 // Internet address used by bind()\nSOCKADDR_IN nAddrAssigned;\
    \         // Internet address assigned by bind()\nint nAddrAssignedLen = sizeof(addrAssigned);\n\
    \n// create a stream socket\ns = socket(AF_INET, SOCK_STREAM, 0);\nif (s != INVALID_SOCKET)\n\
    {\n    // fill out the socket's address information\n\n    addr.sin_family = AF_INET;\n\
    \    addr.sin_port = 0;              // let WinSock assign a port\n    addr.sin_addr.s_addr\
    \ = htonl(INADDR_ANY);\n\n    // bind the socket to its address\n    if (bind(s,\
    \ (LPSOCKADDR)&addr, sizeof(addr)) != SOCKET_ERROR)\n    {\n        // find out\
    \ what port was assigned by WinSock\n        if (getsockname(s, (LPSOCKADDR)&nAddrAssigned,\
    \ &nAddrAssignedLen) == 0)\n        // now nAddrAssigned.sin_port contains the\
    \ port number\n        // that WinSock assigned to this client\n        ...\n\
    \    }\n}\n```\n```\n\nIn this example, as in the server example, the socket’s\
    \ IP address is set to `INADDR_ANY`. This means that the socket can use any network\
    \ interface the computer has. This use is fine for most instances. It may be necessary\
    \ to specify a particular address if the computer on which the client application\
    \ runs is connected to more than one network through more than one network interface.\
    \ Figure 7.4 shows one possible scenario. The client computer in Figure 7.4 has\
    \ two IP addresses; suppose that they are 166.12.34.101 and 166.12.34.102. If\
    \ you want the client limited to going through only one network interface, you\
    \ can do the following instead of using `INADDR_ANY`:\n\n```\n```c\naddr.sin_addr.s_addr\
    \ = inet_addr(\"166.12.34.101\");\n```\n```\n\n# Connecting to a Server\n\nA client\
    \ connects to a server using the `connect()` function. Its prototype is as follows:\n\
    \n```\n```c\nint PASCAL FAR connect(SOCKET s,\nconst struct sockaddr FAR *name,\
    \ int namelen);\n```\n```"
