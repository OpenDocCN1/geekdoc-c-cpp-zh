    \ data (%s)\", m_pszBuf);\n    plb->InsertString(0, pszMessage);\n  }\n}\n\nCFormView::OnTimer(nIDEvent);\n\
    }\n```\n```\n\n# Running the Datagram Echo Server and Client\n\nFollowing is a\
    \ sample sequence of events that occur when the datagram echo client and server\
    \ are run:\n\n+   1. Run CDESRV.\n+   2. Run CDECLNT on the same or a different\
    \ computer. It prompts for the host name or IP address of CDESRV.\n+   3. In five\
    \ seconds the timer will trigger in CDECLNT, causing `CMainView::OnTimer()` to\
    \ get called. The outgoing buffer is not in use, so the outgoing buffer is filled\
    \ and written using `m_pDatagram`'s `Write()` member function.\n+   4. `CMainView::OnDatagram()`\
    \ is called in CDECLNT with a `CWINSOCK_DONE_WRITING` notice. The outgoing buffer\
    \ is then marked as unused so that it may be used with the next triggering of\
    \ `CMainView::OnTimer()`.\n+   5. `CMainView::OnDatagram()` is called in CDESRV\
    \ with a `CWINSOCK_DONE_READING` notice. The data is read and immediately echoed\
    \ back to the client.\n+   6. `CMainView::OnDatagram()` is called in CDESRV with\
    \ a `CWINSOCK_DONE_WRITING` notice. The data is then freed.\n+   7. `CMainView::OnDatagram()`\
    \ is called in CDECLNT with a `CWINSOCK_DONE_READING` notice. The echoed data\
    \ is read and then freed.\n+   8. Another timer goes off in CDECLNT and the process\
    \ repeats.\n\n# Stream Echo Client and Server\n\nThese programs, CSESRV and CSECLNT,\
    \ demonstrate the use of the `CStreamSocket` object. The CSESRV server application\
    \ receives data and sends it back to the client. The CSECLNT client application\
    \ sends data to the server and receives the echoed reply."
