- pgno: 134
  md: 'If `SO_LINGER` is set with a zero timeout interval, `closesocket()` isn’t blocked,
    even if queued data has not yet been sent or acknowledged. This is called a hard
    close because the socket is closed immediately and any unsent data is lost. Any
    `recv()` call on the remote side of the circuit can fail with `WSAECONNRESET`.


    If `SO_LINGER` is set with a nonzero timeout interval, the `closesocket()` call
    blocks until the remaining data has been sent or until the timeout expires. This
    is called a graceful disconnect. Note that if the socket is set to nonblocking
    and `SO_LINGER` is set to a nonzero timeout, the call to `closesocket()` will
    fail with an error of `WSAEWOULDBLOCK`.


    If `SO_DONTLINGER` is set on a stream socket, the `closesocket()` call will return
    immediately. However, any data queued for transmission will be sent, if possible,
    before the underlying socket is closed. This is also called a graceful disconnect.
    Note that in this case, the WinSock implementation may not release the socket
    and other resources for an arbitrary period, which may affect applications that
    expect to use all available sockets.


    To set the linger options of a socket, use `setsockopt()`. The following three
    code segments demonstrate the three entries in Table 7.2.


    ```

    ```c

    // Option      Interval   Type of Close  Wait for Close?

    // SO_LINGER   Zero       Hard           No

    LINGER ling;

    ling.l_onoff = 1;   // linger on

    ling.l_linger = 0;  // timeout in seconds

    setsockopt(s, SOL_SOCKET, SO_LINGER, (LPSTR)&ling, sizeof(ling));


    // Option      Interval   Type of Close  Wait for Close?

    // SO_LINGER   Non-zero   Graceful       Yes

    LINGER ling;

    ling.l_onoff = 1;   // linger on

    ling.l_linger = 5;  // timeout in seconds

    setsockopt(s, SOL_SOCKET, SO_LINGER, (LPSTR)&ling, sizeof(ling));


    // Option         Interval   Type of Close  Wait for Close?

    // SO_DONTLINGER  Don''t care Graceful       No

    LINGER ling;

    ling.l_onoff = 0;   // linger off

    ling.l_linger = 0;  // timeout in seconds

    setsockopt(s, SOL_SOCKET, SO_LINGER, (LPSTR)&ling, sizeof(ling));

    ```

    ```


    If your application wants to know when the socket has been closed, use `WSAAsyncSelect()`
    and specify the `FD_CLOSE` event. If `WSAGETSELECTERROR` returns `0` (zero) for
    the `FD_CLOSE` event, the socket is closed gracefully. An error value of `WSAECONNRESET`
    tells you the socket was abortively disconnected.'
