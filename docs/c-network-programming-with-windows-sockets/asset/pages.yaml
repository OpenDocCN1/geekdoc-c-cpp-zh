- pgno: 85
  md: "Suppose that the computer with IP address 166.78.16.201 is called “jupiter.”\
    \ Suppose also that this computer uses a host file for name resolution as opposed\
    \ to a networked name server. One line of that host’s file might look like this:\n\
    \n```\n166.78.16.201        jupiter\n```\n\ngethostbyaddr() looks for the designated\
    \ IP address in the host file, finds the line on which it resides, and extracts\
    \ the associated host name. It then places all this information into a hostent\
    \ host entry structure. The end result is the formatted message describing that\
    \ “jupiter” has an IP address of “166.78.16.201”.\n\n> **Note**\n> \n> In the\
    \ call to `gethostbyaddr()`, the IP address `uIPaddress` had to be cast to a character\
    \ pointer. `uIPaddress` is an unsigned long (four bytes in size) that contains\
    \ the binary IP address in network byte order. `gethostbyaddr()` expects a pointer\
    \ to the first byte of that four quantity, so you take the address of the variable\
    \ and cast it to a character pointer.\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_85_0.png)\n\
    \n# Asynchronously Finding a Host Name When You Know Its IP Address\n\nThe `WSAAsyncGetHostByAddr()`\
    \ function is the asynchronous version of `gethostbyaddr()`. Its function prototype\
    \ is as follows:\n\n```\nHANDLE PASCAL FAR WSAAsyncGetHostByAddr(HWND hWnd, u_int\
    \ wMsg,\nconst char FAR * addr, int len, int type, char FAR * buf, int buflen);\n\
    ```\n\n`hWnd` is the handle to the window to which a message will be sent when\
    \ `WSAAsyncGetHostByAddr()` has completed its asynchronous operation. `wMsg` is\
    \ the user-defined message that will be posted to `hWnd` when the asynchronous\
    \ operation is completed. `addr` is a pointer to the IP address in, network byte\
    \ order, of the computer about which you want host information. `len` is the length\
    \ of the address to which `addr` points and is always 4 (four) for Internet addresses.\
    \ `type` must always be `PF_INET` because WinSock 1.1 supports only Internet-style\
    \ addressing. `buf` is a pointer to an area of memory that, upon successful completion\
    \ of the address lookup, will contain the hostent structure for the desired host.\
    \ This buffer must be large enough to store the hostent structure as well as other\
    \ referenced data, therefore it should be at least `MAXGETHOSTSTRUCT` bytes long.\
    \ `buflen` is the size of the buffer. It should be `MAXGETHOSTSTRUCT` for safety’s\
    \ sake.\n\nIf the asynchronous operation is initiated successfully, the return\
    \ value of `WSAAsyncGetHostByAddr()` is a handle to the asynchronous task. On\
    \ failure of initializa-"
  merge: -1
  img_proc: true
- pgno: 86
  md: "tion, the function returns 0 (zero) and `WSAGetLastError()` should be called\
    \ to find out the reason for the error. Possible error values include the following:\
    \ `WSANOTINITIALIZED` if `WSAStartup()` wasn’t called successfully; `WSAENETDOWN`\
    \ if the network subsystem is failing; `WSAEWOULDBLOCK` if the function cannot\
    \ be scheduled at this time due to a resource conflict within the specific WinSock\
    \ implementation; or `WSAEINPROGRESS` if a blocking WinSock operation is currently\
    \ in progress. Note that the function’s return value doesn’t tell you whether\
    \ the requested information was retrieved successfully; all it tells you is whether\
    \ the function was started properly.\n\nThis function is used much like `WSAAsyncGetHostByName()`.\
    \ Using an MFC implementation method to replicate the example given in the `gethostbyaddr()`\
    \ example would have class declaration such as the following:\n\n```\n```cpp\n\
    class CMyWindow : public CFrameWnd\n{\n\n...\n\n    // member variables\n    u_long\
    \ m_ulIPAddress;                 // binary IP address\n    char m_lpszMessage[100];\
    \              // informational message\n    char m_lpszIP[16];              \
    \      // IP address string\n    PHOSTENT m_phostent;                  // pointer\
    \ to host entry structure\n    IN_ADDR m_in;                          // Internet\
    \ address structure\n    HANDLE m_hGetHostByAddr;              // handle of asynchronous\
    \ request\n    char m_lpszHostEntryBuf[MAXGETHOSTSTRUCT]; // host entry structure\n\
    \n    // member functions in the message map\n    //{{AFX_MSG(CMyWindow)\n   \
    \ afx_msg void OnDoAsyncGetHostByAddr();\n    afx_msg LONG OnAsyncGetHostByAddr(WPARAM\
    \ wParam, LPARAM lParam);\n    //}}AFX_MSG\n    DECLARE_MESSAGE_MAP()\n};\n```\n\
    ```\n\nNote that the variables are now member variables of the class. The implementation\
    \ of the `CMyWindow` class begins with the message map for the window:\n\n```\n\
    ```cpp\n#define WM_USER_ASYNCGETHOSTBYADDR (WM_USER + 2)\n\nBEGIN_MESSAGE_MAP(CMyWindow,\
    \ CFrameWnd)\n    //{{AFX_MSG_MAP(CMyWindow)\n    ON_COMMAND(ID_TEST_ASYNCGETHOSTBYADDR,\
    \ OnDoAsyncGetHostByAddr)\n    ON_MESSAGE(WM_USER_ASYNCGETHOSTBYADDR, OnAsyncGetHostByAddr)\n\
    \    //}}AFX_MSG_MAP\nEND_MESSAGE_MAP()\n```\n```\n\nThe first entry in the message\
    \ map is for a menu item that will launch the search. That function is implemented\
    \ as follows:\n\n```\n```cpp\nvoid CMyWindow::OnDoAsyncGetHostByAddr()\n{\n  \
    \  // get a binary IP address\n    m_ulIPAddress = inet_addr(\"166.78.16.201\"\
    );\n```\n```"
