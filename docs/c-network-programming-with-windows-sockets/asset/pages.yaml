- pgno: 68
  md: "![](img/5e551abe6e0cb0588043ee757a235ddb_68_0.png)\n\nWinSock provides a set\
    \ of procedures commonly referred to as the database functions. The duty of these\
    \ database functions is to convert the host and service names that are used by\
    \ humans into a format useable by the computer. The computers on an internetwork\
    \ also require that certain data transmitted between them be in a common format.\
    \ WinSock provides several conversion routines to fulfill this requirement.\n\n\
    ![](img/5e551abe6e0cb0588043ee757a235ddb_68_1.png)\n\n> **Note**\n> \n> This chapter\
    \ contains several small code samples. These aren’t complete programs that run\
    \ on their own but are presented instead to help clarify the textual description\
    \ of the functions used in the sample. Study these examples so that you can use\
    \ them in your own programs but don’t worry about actual program implementation\
    \ issues now. Later chapters will draw from these code snippets to produce complete\
    \ programs.\n\n# Conversion Routines and Network Byte Ordering\n\nThere are several\
    \ conditions under which a WinSock function should be called with a parameter\
    \ stored in a particular format. An internetwork using WinSock is supposed to\
    \ allow disparate computer systems to communicate. These different internetworked\
    \ hosts are likely to have different hardware architectures based on the CPU used\
    \ in the computer. They may store internal numerical data differently from one\
    \ another. The way in which a CPU internally stores a number is called its byte\
    \ ordering. To facilitate the different byte ordering used in different CPUs,\
    \ WinSock provides a set of conversion functions. These conversion functions have\
    \ the job of turning a host byte-ordered number into a number using the network\
    \ byte-ordering scheme. Network byte ordering is the standard by which all TCP/IP\
    \ connected computers must transmit certain data. In effect, the network byte-ordering\
    \ sequence is the lowest common denominator of all internetworked computers.\n\
    \nThere are four primary byte-order conversion routines. They handle the conversions\
    \ to and from unsigned short integers and unsigned long integers.\n\n# Unsigned\
    \ Short Integer Conversion\n\nThe `htons()` and `ntohs()` functions convert an\
    \ unsigned short from host-to-network order and from network-to-host order, respectively.\
    \ The prototypes look like\n\n```\nu_short PASCAL FAR htons(u_short hostshort);\n\
    u_short PASCAL FAR ntohs(u_short netshort);\n```"
