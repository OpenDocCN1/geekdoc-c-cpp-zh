- pgno: 22
  md: "Computer network protocols are formal rules of behavior that govern network\
    \ communications. The Transmission Control Protocol (TCP) and Internet Protocol\
    \ (IP) are just two of the data communication protocols encompassed by the Internet\
    \ Protocol Suite. This protocol suite is usually referred to as TCP/IP because\
    \ TCP and IP are two of the most important protocols of the collection. TCP/IP\
    \ includes a set of standards that specify how networked computers communicate\
    \ and how data is routed through the interconnected computers.\n\nTCP/IP provides\
    \ the application programmer with two primary services: connectionless packet\
    \ delivery and reliable stream transport. These will be discussed in detail later\
    \ in this chapter. TCP/IP has several distinguishing features that have led to\
    \ its popularity, including\n\n+   Network Topology Independence. TCP/IP is used\
    \ on bus, ring, and star networks. It’s used in local-area networks as well as\
    \ wide-area networks.\n+   \n+   Physical Network Hardware Independence. TCP/IP\
    \ can utilize Ethernet, token ring, or any number of physical hardware variations.\n\
    +   \n+   Open Protocol Standard. The TCP/IP protocol suite standard is freely\
    \ available for independent implementation on any computer hardware platform or\
    \ operating system. TCP/IP’s wide acceptance and the fact that TCP/IP is available\
    \ on platforms ranging from supercomputers to desktop personal computers makes\
    \ it an ideal set of protocols to unite different hardware and software.\n+  \
    \ \n+   Universal Addressing Scheme. Each computer on a TCP/IP network has an\
    \ address that uniquely identifies it so that any TCP/IP enabled device can communicate\
    \ with any other on the network. Each packet of data sent across a TCP/IP network\
    \ has a header that contains the address of the destination computer as well as\
    \ the address of the source computer.\n+   \n+   Powerful Client-Server Framework.\
    \ TCP/IP is the framework for powerful and robust client-server applications that\
    \ operate in local-area networks and wide-area networks.\n+   \n+   Application\
    \ Protocol Standards. TCP/IP doesn’t just provide the programmer with a method\
    \ for moving data around a network among custom applications. It also provides\
    \ the underpinnings of many application-level protocols that implement such common\
    \ functionality as e-mail and file-transfer capabilities.\n\nThe current incarnation\
    \ of the Windows Sockets library is built on TCP/IP, although there’s nothing\
    \ inherent in WinSock precluding it from utilizing an alternate protocol"
  merge: -1
  img_proc: true
- pgno: 23
  md: "stack. In fact, work is in progress on the next version of WinSock, which will\
    \ support the use of Novell’s IPX/SPX, Apple’s Appletalk, and other popular network\
    \ protocols.\n\n> **NOTE**\n> \n> The term *protocol stack* has been mentioned\
    \ a few times now. It refers to the way some network communication protocols,\
    \ including TCP/IP, are composed of several logical layers of software where each\
    \ layer communicates with the layer directly above and below itself. At the top\
    \ of this stack is the application layer that you, as the applications programmer,\
    \ provide. The bottom of the stack is generally thought to be the layer that communicates\
    \ with the network hardware (that is, the Ethernet or Token Ring). The upcoming\
    \ section titled “ISO OSI Protocol Stack” provides a more complete definition\
    \ of a protocol stack.\n\n# TCP/IP History\n\nThe history of the TCP/IP protocol\
    \ suite can be traced back to one of the first wide-area networks consisting of\
    \ computers from different manufacturers running different operating systems.\n\
    \n# ARPANET\n\nThis experimental network was called ARPANET, and its development\
    \ was sponsored by the Defense Advanced Research Projects Agency (DARPA) in 1969\
    \ with the goal of creating a network to provide robust data communications among\
    \ computers from different vendors. Before ARPANET, most computer networks were\
    \ homogeneous, consisting of computers from the same hardware manufacturer running\
    \ the same operating system.\n\nThe ARPANET’s popularity became apparent, and\
    \ in 1975, it was converted from an experimental network into a fully operational\
    \ network that was used for daily communications among researchers at the connected\
    \ sites. But research into network protocols continued and the Internet Protocol\
    \ Suite resulted. The TCP/IP protocols were adopted as Military Standards in 1983,\
    \ and all computers connected to the ARPANET were required to adopt the new protocol.\
    \ The ARPANET was then split into two networks: the MILNET, used for unclassified\
    \ military communications, and the new, much smaller ARPANET, used for further\
    \ research. MILNET and ARPANET together became known as the Internet."
  merge: -1
  img_proc: true
- pgno: 24
  md: "# Berkeley Software Distribution\n\nDARPA was also interested in expanding\
    \ the Internet by attaching university computing sites. At that time, most university\
    \ computer science departments were running a version of the UNIX operating system\
    \ developed at the University of California at Berkeley. This implementation of\
    \ UNIX is known as the Berkeley Software Distribution or BSD UNIX. DARPA funded\
    \ Bolt Beranek and Newman, Inc. to implement TCP/IP for UNIX and funded Berkeley\
    \ to incorporate the protocols into its software distribution. This funding, combined\
    \ with the fact that many university computer science departments were adding\
    \ more computing resources that needed to be interconnected, all but guaranteed\
    \ a wide audience for TCP/IP.\n\nThe programmers for BSD UNIX didn’t simply take\
    \ TCP/IP as it came from Bolt Beranek and Newman. They added an abstracted layer\
    \ for the use of application developers called sockets. Sockets, which WinSock\
    \ is based on, make it easy for the application programmer to write networked\
    \ code. The BSD programmers also added several utilities to their UNIX that were\
    \ built upon pre-existing commands used in the standalone computing environment.\
    \ For example, the new remote copy command `rcp` was introduced. This command\
    \ extended the standard copy command called `cp` to the network. Network-aware\
    \ utilities such as these, and the power that can be wielded from them, helped\
    \ BSD UNIX and its TCP/IP gain wide acceptance.\n\nWith the popularity of BSD\
    \ UNIX at universities, the size of the connected Internet grew. The even wider\
    \ acceptance of TCP/IP soon after BSD’s inclusion of the protocols led to an astronomical\
    \ Internet growth rate that has yet to peak. In 1983, the Internet connected a\
    \ handful of computing sites. Today, the Internet connects two million computers\
    \ and forty million people spread all over the world.\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_24_0.png)\n\
    \n> **NOTE**\n> \n> The use of the term *internet* is sometimes confusing because\
    \ it’s used haphazardly to mean so many different things. TCP/IP is another name\
    \ for the Internet Protocol Suite. TCP/IP and Internet Protocol are used interchangeably.\
    \ Originally, if someone said their computing site had an internet, it meant there\
    \ were two or more networked computers that used the Internet Protocol between\
    \ them. The term *internet* (notice the lower case *i*) is now used to refer to\
    \ any collection of physically separate networks that share the same communication\
    \ protocols (not necessarily TCP/IP) to appear as a single logical network. The\
    \ term *Internet* (notice the upper case *I*) is used to refer to the worldwide\
    \ collection of interconnected computer networks that run the TCP/IP protocols."
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Request for Comments


    No single company or group “owns” TCP/IP. The protocols are freely distributable,
    and anyone is allowed to incorporate them into his or her operating system or
    computer network. You may be wondering how TCP/IP is expanded and how the application
    protocols mentioned earlier are developed. The answer lies in Internet Request
    for Comments (RFC).


    RFCs provide for an informal method of establishing new TCP/IP protocol standards.
    RFCs usually begin as Internet drafts. After the Internet community has had a
    chance to critique the draft it becomes an RFC. RFCs are numbered sequentially,
    so later RFCs have higher numbers than those created earlier. Some RFCs supersede
    earlier ones, but the new RFC will always make note of that.


    The number an RFC receives is distributed by an organization at SRI International
    called the Network Information Center or the NIC (pronounced nick). The NIC is
    funded by the Defense Communication Agency (DCA), which manages the military’s
    computer network infrastructure. The NIC isn’t only responsible for an RFC’s number,
    it’s also responsible for the storage and distribution of TCP/IP protocols, allotment
    of Internet addresses, and the registration of the names of Internet-connected
    computers.


    One example of an RFC is RFC 742, which defines the finger protocol. The finger
    protocol is usually accessed by the user using a finger program. Finger allows
    a user to find out certain information about a specific user on a specific networked
    computer or all users on a specific networked computer. The finger protocol describes
    the communications that must take place between the finger client program that
    a user runs and a finger server that continuously runs on the computer that’s
    being “fingered.” You’ll build a finger client program for Windows in a later
    chapter.


    # ISO OSI Reference Model


    A group called the International Standards Organization (ISO) introduced the Open
    Systems Interconnection (OSI) Reference Model, a layered network architecture,
    with the goal of international standardization of computer network protocols.
    The OSI model is said to be an open systems architecture because it connects computer
    systems that are open for communications with other systems. The connected computer
    systems don’t have to be from the same manufacturer and don’t have to run the
    same operating system. TCP/IP and the OSI model share a similarity in this regard.'
  merge: -1
