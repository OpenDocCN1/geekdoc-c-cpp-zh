- pgno: 275
  md: 'This chapter presents a practical client/server database application that uses
    the WinSock class library described in the preceding chapters. The application
    set consists of a client application and a server application. The client sends
    database requests to the server and the server responds with a positive or negative
    acknowledgment.


    The client (INICLNT) and server (INISRV) use the CDatagramSocket and CStreamSocket
    objects. In previous chapters, the server examples could handle only one client
    connection at a time. This server is more realistic in that it can serve several
    clients simultaneously. The server is implemented as a Multiple Document Interface
    application in which each window represents a client connection. The client is
    a simple Single Document Interface application. A stream socket connection is
    used to transmit database commands and responses between the client and server.
    A datagram socket is used to send a heartbeat message from the server to the client.
    The heartbeat is a block of data that is sent between the client and server to
    let each know that the other side is still active and able to communicate. This
    heartbeat allows the client program to show a visual indication of the client/server
    link status.


    The “database” in this example uses Windows’ built-in INI file facility. An INI
    file is used to maintain configuration information for an application. An example
    INI file is shown below:


    ```

    ```ini

    [boot]

    386grabber=ajvga.3gr

    oemfonts.fon=vgaoem.fon


    [keyboard]

    subtype=

    type=4

    ```

    ```


    [boot] is called the section. 386grabber is an example of an entry or key. ajvga.3gr
    is its value. The GetPrivateProfileString() and WritePrivateProfileString() SDK
    functions are used to read and write an INI file string value, respectively.


    # Client INICLNT


    The client application, INICLNT, uses a CFormView-derived object as its main interface.
    The header file for the CMainView object is shown in Listing 15.1, which appears
    later in this section. Its implementation is shown in Listing 15.2, which also
    appears later in this section. This object performs most of the work for the INICLNT
    application. OnInitialUpdate() is called soon after the object is created. This
    function is responsible for starting the WinSock subsystem, creating a client
    stream socket, creating a server datagram socket for the heartbeat, prompting
    for the host name or IP address of the INISRV server, and setting a timer interval
    used for the heartbeats. When the'
