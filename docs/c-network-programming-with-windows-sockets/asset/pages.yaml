- pgno: 101
  md: "# CAUTION\n\nSeveral of the preceding error messages returned by `WSAGetLastError()`\
    \ make reference to unsupported address families, socket types, or protocols.\
    \ These parameters have several interdependencies that, if not arranged properly,\
    \ can result in error. For example, a socket with the `AF_INET` address family,\
    \ `SOCK_STREAM` type, and UDP protocol is impossible because the UDP protocol\
    \ can’t support a byte stream. This book uses two basic sockets. Both have the\
    \ `AF_INET` address family specifier. One socket has type `SOCK_STREAM`, and the\
    \ other has type `SOCK_DGRAM`. The protocol is left as 0 (zero) to let the `socket()`\
    \ function use the default. It figures out this default by examining the address\
    \ family and socket type. `AF_INET` and `SOCK_STREAM` default to TCP. `AF_INET`\
    \ and `SOCK_DGRAM` default to UDP.\n\n# Example Call to *socket()*\n\nThe following\
    \ code sample shows a call to the `socket()` function to create a stream socket:\n\
    \n```\n```c\nSOCKET s;                         // socket descriptor\nchar lpszMessage[100];\
    \            // informational message\n\ns = socket(AF_INET, SOCK_STREAM, 0);\n\
    \nif (s == INVALID_SOCKET)\n    wsprintf(lpszMessage, \"socket() generated error\
    \ %d\",\n       WSAGetLastError());\nelse\n    lstrcpy(lpszMessage, \"socket()\
    \ succeeded\");\n\nMessageBox(NULL, lpszMessage, \"Info\", MB_OK);\n```\n```\n\
    \nNotice that the protocol field was set to 0 (zero) to allow `socket()` to use\
    \ a default value generated from the address family and socket type combination.\n\
    \n# Stream Versus Datagram\n\nA socket, generally speaking, is of the stream or\
    \ datagram variety and has either `SOCK_STREAM` or `SOCK_DGRAM`, respectively,\
    \ as its type specifier in the call to `socket()`. You have to make a choice about\
    \ which type is more appropriate for your application.\n\nThe stream socket supports\
    \ a connection-oriented, reliable byte stream. Data is guaranteed to arrive in\
    \ the order it was sent and without any duplication. The stream socket sees the\
    \ data flow as a continuous, bidirectional stream of bytes with no record boundaries."
