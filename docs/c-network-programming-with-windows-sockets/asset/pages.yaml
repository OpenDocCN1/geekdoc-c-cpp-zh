    \ window\nDestroyWindow();\n}\n\nreturn nStatus;\n}\n```\n```\n\n# CStreamSocket::LastError()\n\
    \nThe LastError() member function is implemented as an in-line function. It simply\
    \ returns the m_nLastError value that contains the last WinSock error message\
    \ generated by the CStreamSocket object. This function should be called whenever\
    \ a CStreamSocket member function returns WINSOCK_WINSOCK_ERROR.\n\n# Application\
    \ Responsibility\n\nThe goal of this object is to enable the rapid development\
    \ of a networked application using stream sockets. The public interface to the\
    \ CStreamSocket object consists of the following functions: CreateSocket(), DestroySocket(),\
    \ Read(), Write(), Connect(), Accept(), GetPeerName(), and LastError().\n\nThe\
    \ application must provide a certain level of support for the stream object. The\
    \ application must provide a message handler to receive messages sent from the\
    \ object. Also, the stream object’s constructor requires a pointer to the application\
    \ window object and a message. A sample call to a stream object constructor looks\
    \ like the following:\n\n```\n```cpp\nps = new CStreamSocket(this, WM_USER + 1);\n\
    ```\n```\n\nAn entry must be made in the message map to associate the WM_USER\
    \ + 1 message to an application member function.\n\n```\n```cpp\nBEGIN_MESSAGE_MAP(CMainFrame,\
    \ CFrameWnd)\n    //{{AFX_MSG_MAP(CMainFrame)\n    //}}AFX_MSG_MAP\n    ON_MESSAGE(WM_USER\
    \ + 1, OnWinSockEvent)\nEND_MESSAGE_MAP()\n```\n```"
