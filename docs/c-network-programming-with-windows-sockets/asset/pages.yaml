  md: "**FIGURE 8.7.**  \n*Results of service lookup.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_160_0.png)\n\
    \n# Datagram Echo Client and Server\n\nThese programs, DESERV and DECLIENT, demonstrate\
    \ the use of nonblocking datagram sockets. They use the following WinSock functions:\
    \ `WSAStartup()`, `WSACleanup()`, `WSAGetLastError()`, `socket()`, `closesocket()`,\
    \ `bind()`, `WSAAsyncSelect()`, `sendto()`, `recvfrom()`, `getsockname()`, `ntohs()`,\
    \ and `inet_ntoa()`. The DESERV server application receives data and sends it\
    \ back to the client. The DECLIENT client application sends data to the server\
    \ and receives the echoed reply.\n\n# Datagram Echo Server DESERV\n\nThese programs\
    \ are generated using Visual C++’s AppWizard feature. The WINSOCK.H header file\
    \ is included in the STDAFX.H precompiled header file, as shown in Listing 8.13.\
    \ STDAFX.H is included by the source modules of the project, so WinSock functions\
    \ and structures are always available.\n\n**Listing 8.13. STDAFX.H for DESERV.**\n\
    \n```\n```cpp\n// stdafx.h : include file for standard system include files,\n\
    //  or project specific include files that are used frequently, but\n//  are changed\
    \ infrequently\n//\n\n#include <afxwin.h>      // MFC core and standard components\n\
    #include <afxext.h>      // MFC extensions\n#include <winsock.h>     // Windows\
    \ Sockets\n```\n```"
  merge: -1
  img_proc: true
- pgno: 161
  md: "Like the WSINFO example, DESERV uses the application object to start and stop\
    \ WinSock in `CDeservApp::InitInstance()` and `CDeservApp::ExitInstance()`, respectively.\n\
    \nDESERV uses the Single Document Interface of window management. AppWizard creates\
    \ a default view class derived from the MFC class `CView`, but this class isn’t\
    \ used by the application. Instead, a `CFormView` derived object is used. Using\
    \ a `CFormView` means first using App Studio to create a dialog box resource.\
    \ A dialog box is created that has a static text label and a list box that’s used\
    \ for status messages. Generally speaking, a dialog box resource is created and\
    \ ClassWizard is used to create a class derived from `CFormDialog`. Because you\
    \ want this dialog box resource to be the program’s main interface, ClassWizard\
    \ is used to create a class derived from `CFormView`. But first, the dialog box\
    \ resource must have its flags set appropriately. Specifically, the style is child,\
    \ the border is none, the visible flag is unchecked, and the Caption is left blank.\
    \ Figure 8.8 shows the style portion of the dialog properties for the dialog box\
    \ resource used as DESERV’s main window.\n\n**FIGURE 8.8.**\n\n*Style properties\
    \ for DESERV’s main window dialog resource.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_161_0.png)\n\
    \nA change is made to the application object `CDeservApp` so that it uses this\
    \ view rather than the default view generated by AppWizard. The default implementation\
    \ of `CDeservApp::InitInstance()` has a call to `AddDocTemplate()` that looks\
    \ like the following:\n\n```\nAddDocTemplate(new CSingleDocTemplate(IDR_MAINFRAME,\n\
    \    RUNTIME_CLASS(CDeservDoc),\n    RUNTIME_CLASS(CMainFrame),       // main\
    \ SDI frame window\n    RUNTIME_CLASS(CDeservView)));\n```\n\nIt needs to look\
    \ as follows:\n\n```\nAddDocTemplate(new CSingleDocTemplate(IDR_MAINFRAME,\n \
    \   RUNTIME_CLASS(CDeservDoc),\n    RUNTIME_CLASS(CMainFrame),       // main SDI\
    \ frame window\n    RUNTIME_CLASS(CMainView)));\n```\n\nThe `CFormView` derived\
    \ object is named `CMainView` and its header file is shown in Listing 8.14. Notice\
    \ the member variables `m_s` and `m_addr`, and the function `OnAsyncSelect()`.\
    \ `OnAsyncSelect()` is added to the class by hand because ClassWizard doesn’t\
    \ support user-defined messages."
