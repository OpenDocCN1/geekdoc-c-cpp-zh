- pgno: 128
  md: "Out-of-band data is received similarly to regular in-line data, unless the\
    \ socket is configured to receive out-of-band data in-line. When a socket is configured\
    \ this way, out-of-band data’s urgency loses its effectiveness. Assuming that\
    \ a socket isn’t receiving out-of-band data in-line, the only differences to the\
    \ preceding code would be as follows. The line that registers interest in the\
    \ FD_READ event is expanded to read:\n\n```\nif (WSAAsyncSelect(m_s, m_hWnd, WM_USER\
    \ + 1, FD_READ | FD_OOB) ==\nSOCKET_ERROR)\n{\n    // error ...\n}\n```\n\nYou\
    \ also need a FD_OOB handler in the CMainFrame::OnAsyncSelect() function. It is\
    \ identical to the FD_READ event handler except the call to recv() is as follows:\n\
    \n```\nnBytesRecv = recv(m_s, pszBuf, BUFSIZE, MSG_OOB);\n```\n\n# Datagram-Oriented\n\
    Client/Server Communication\n\nDatagram-oriented client/server communication,\
    \ using socket type SOCK_DGRAM, is simpler than the stream-oriented communication\
    \ described in the preceding section. A server doesn’t need to listen for and\
    \ accept connections from clients, and a client doesn’t need to connect to a server.\
    \ Instead, each piece of data is individually addressed.\n\n# How a Server Prepares\
    \ for Communication\n\nIn the stream environment, a server must create a socket,\
    \ bind the socket to a well-known name, listen for connections on the socket,\
    \ and accept connections on the socket. In the datagram environment, a server\
    \ must only create a socket and bind the socket to a well-known name.\n\nCreating\
    \ the socket is exactly like the stream counterpart except that SOCK_DGRAM is\
    \ specified rather than SOCK_STREAM:\n\n```\nSOCKET s;\ns = socket(AF_INET, SOCK_DGRAM,\
    \ 0);\n```\n\nThe last step in preparing a server for communication is binding\
    \ the socket to a well-known name. This procedure is identical to that of the\
    \ stream socket:\n\n```\nSOCKADDR_IN addr;\nint nError;\n\naddr.sin_family = AF_INET;\n\
    addr.sin_port = htons(2050);\naddr.sin_addr.s_addr = htonl(INADDR_ANY);\n```"
  merge: -1
