- pgno: 129
  md: "```\nif (bind(s, (LPSOCKADDR)&addr, sizeof(addr)) == SOCKET_ERROR)\n{\n   \
    \ nError = WSAGetLastError();\n    // ...\n}\n```\n\nIn this code snippet, the\
    \ server is preparing to receive data on port 2050, from any net-work interface\
    \ the host has available.\n\n# ## How a Client Prepares for Communication\n\n\
    In the stream environment, a client must create a socket, fill out an Internet\
    \ address structure of the server, and connect to the server. In the datagram\
    \ environment, a client must only create a socket. After that, an Internet address\
    \ structure is used for each com-munication.\n\n# ## Sending Datagram Data\n\n\
    To send a datagram, use the sendto() function. Its prototype is as follows:\n\n\
    ```\nint PASCAL FAR sendto(SOCKET s, const char FAR * buf, int len, int flags,\n\
    \    const struct sockaddr FAR *to, int tolen);\n```\n\ns is the socket to send\
    \ on, buf is the pointer to the data to send, len is the length of the buf buffer.\
    \ flags specifies the way in which sendto() is called. flags can be any of the\
    \ fol-lowing logically ORed together: 0 (zero) for no special send options, MSG_DONTROUTE\
    \ if the data shouldn't be subject to routing, and MSG_OOB to send out-of-band\
    \ data. to is a pointer to the Internet address of the intended receiver. For\
    \ WinSock 1.1, to must be a sockaddr_in structure. tolen is the length of the\
    \ to parameter.\n\nOn success, sendto() returns the number of bytes sent. On failure,\
    \ SOCKET_ERROR is returned and WSAGetLastError() should be called. Possible error\
    \ values are the follow-ing: WSANOTINITIALIZED if WinSock wasn't initialized with\
    \ WSAStartup(); WSAENETDOWN if the network subsystem is failing; WSAEACCES if\
    \ the address is a broadcast address but the appropriate flag was not set; WSAEINTR\
    \ if the blocking call was canceled with WSACancelBlockingCall(); WSAEINPROGRESS\
    \ if a blocking call is in progress; WSAEFAULT if buf or to are not in a valid\
    \ part of the user address space or if to is too small to hold a sockaddr structure;\
    \ WSAENETRESET if the connection needs to be reset; WSAENOBUFS if there is a internal\
    \ WinSock buffer deadlock; WSAENOTCONN if the socket isn't connected (for SOCK_STREAM\
    \ only); WSAENOTSOCK if the socket isn't a valid socket descriptor; WSAEOPNOTSUPP\
    \ if MSG_OOB was specified by flags but the socket isn't a stream socket; WSAESHUTDOWN\
    \ if the socket has been shutdown; WSAEWOULDBLOCK if the socket is marked as nonblocking\
    \ and the sendto() would block; WSAEMSGSIZE if socket is a datagram socket and\
    \ the buf buffer is larger than the maximum supported by the particular WinSock\
    \ implementation; WSAECONNABORTED if the virtual circuit was aborted due to timeout\
    \ or other failure; WSAECONNRESET if the virtual circuit was reset by the remote"
  merge: -1
  img_proc: true
- pgno: 130
  md: "side; WSAEADDRNOTAVAIL if the address specified to isn’t available from the\
    \ local machine; WSAENOSUPPORT if the addresses in the specified family can’t\
    \ be used with this socket; WSAEDESTADDRREQ if a destination address is required;\
    \ or WSAENETUNREACH if the network can’t be reached from this host at this time.\n\
    \n> **CAUTION**\n> \n> The WSAEMSGSIZE error will result if you try to send too\
    \ large a datagram. This maximum is WinSock vendor dependent. To find out the\
