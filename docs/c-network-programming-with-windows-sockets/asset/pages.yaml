- pgno: 113
  md: "```\n```cpp\nWSAsyncSelect(s, hWnd, WM_USER + 1, FD_ACCEPT);\n\nWSAsyncSelect(s,\
    \ hWnd, WM_USER + 2, FD_READ);\n```\n```\n\nThe FD_ACCEPT event will never generate\
    \ WM_USER + 1. Only FD_READ will generate a message (WM_USER + 2).\n\nTo cancel\
    \ all event notifications, call WSAsyncSelect() with wMsg and lEvent set to 0\
    \ (zero), as in the following:\n\n```\n```cpp\nWSAsyncSelect(s, hWnd, 0, 0L);\n\
    ```\n```\n\nYou can see that there are six events you can express interest in.\
    \ This section is about how a server accepts a connection from a client, so that's\
    \ the area of WSAsyncSelect() on which I'll concentrate. Please note that other\
    \ sections of this chapter use WSAsyncSelect() to monitor the sending and receiving\
    \ of data, as well as other events. The basic use of WSAsyncSelect() is the same\
    \ for all events, so I'll give a full description of an appropriate message handler\
    \ here.\n\nThe FD_ACCEPT event is generated whenever a listening socket has a\
    \ client wishing to make a connection. An example of calling WSAsyncSelect() from\
    \ within a Visual C++ MFC program follows.\n\n```\n```cpp\nBOOL CServerWindow::StartListening()\n\
    {\n    // m_s is the socket descriptor which is a member\n    // variable of the\
    \ CServerWindow class\n\n    // m_s has already been created and bound to a name\n\
    \n    // listen for connections\n    if (listen(m_s, 3) == SOCKET_ERROR)\n   \
    \     return FALSE;\n\n    // get asynchronous event notification of accept\n\
    \    // to this object's window (m_hWnd)\n    if (WSAsyncSelect(m_s, m_hWnd, WM_USER\
    \ + 1, FD_ACCEPT) == SOCKET_ERROR)\n        return FALSE;\n\n    return TRUE;\n\
    }\n```\n```\n\nYou also need a member function in CServerWindow to handle the\
    \ WM_USER + 1 message that's generated when a client connection is requested of\
    \ socket m_s:\n\n```\n```cpp\nBEGIN_MESSAGE_MAP(CServerWindow, CFrameWnd)\n//{{AFX_MSG_MAP(CServerWindow)\n\
    \    ...\n    ON_MESSAGE(WM_USER + 1, OnAsyncSelect)\n    ...\n```\n```"
