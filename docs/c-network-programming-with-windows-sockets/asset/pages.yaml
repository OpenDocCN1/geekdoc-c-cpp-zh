- pgno: 267
  md: "# Stream Echo Client CSECLNT\n\nThe stream echo client, CSECLNT, is a reimplementation\
    \ of the SECLIENT program described in Chapter 8. It uses a CFormView-derived\
    \ object as its main interface. The header file for the CMainView object is shown\
    \ in Listing 14.7. Its implementation is shown in Listing 14.8. This object performs\
    \ most of the work for the CSECLNT application. OnInitialUpdate() is called soon\
    \ after the object is created. This function is responsible for starting the WinSock\
    \ subsystem, creating a client stream socket, prompting for the host name or IP\
    \ address of the CSESRV stream echo server, and setting a five-second interval\
    \ timer used for data writes. When the server accepts the client’s connection\
    \ request on port 2000, OnStream() is called with wParam set to CWINSocket_YOU_ARE_CONNECTED.\
    \ When the five-second timer goes off, OnTimer() is called. If there is no data\
    \ waiting to be sent—denoted by the first byte of the outgoing buffer m_pszBuf\
    \ containing a NULL—an outgoing data stream is formatted and the stream socket\
    \ object’s Write() member function is called to send data to the designated server.\
    \ When the write completes, OnStream() is called with wParam set to CWINSocket_DONE_WRITING.\
    \ The first byte of m_pszBuf is set to NULL to indicate that the buffer is available.\
    \ The CMainView object is continually waiting for its previously sent data to\
    \ be echoed back. When data arrives on the stream socket, OnStream() is triggered\
    \ with wParam set to CWINSocket_DONE_READING. The data is read and the read buffer\
    \ is then freed. When the client application is closed, CMainView’s destructor\
    \ is called, destroying the stream socket object and shutting down the WinSock\
    \ subsystem.\n\n# Listing 14.7. MAINVIEW.H for CSECLNT.\n\n```\nMAINVIEW.H: header\
    \ file\n//\n\n///////////////////////////////////////////////////////////////////////\n\
    // CMainView form view\n\n#ifndef __AFXEXT_H__\n#include <afxext.h>\n#endif\n\n\
    #include \"winsock.h\"    // Windows Sockets classes\n\nclass CMainView : public\
    \ CFormView\n{\n    DECLARE_DYNCREATE(CMainView)\n\nprivate:\n    CWinSock * m_pWinSock;\
    \          // WinSock sub-system startup/.shutdown\n    CStreamSocket * m_pStream;\
    \      // Stream socket to receive from\n    char m_pszBuf[100];             //\
    \ buffer to send\n    char m_pszServer[100];          // host name or IP address\
    \ of stream server\n```"
