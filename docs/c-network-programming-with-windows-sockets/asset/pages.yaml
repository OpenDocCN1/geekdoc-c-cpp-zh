  md: 'FIGURE 3.1.

    WinSock layering.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_43_0.png)


    The reliable stream socket is based on the TCP. It requires that a connection
    be established before two processes can send or receive data between themselves.
    The data sent between the connected processes is simply a stream of bytes. There
    are no record delimiters in the data stream. For example, if the sending process
    sends 100 bytes, the receiving process may receive that data as a single chunk
    of 100 bytes or two chunks of 50 bytes each. If your application depends on records
    being sent, you must provide application-level headers in the data stream; TCP
    won''t preserve the packet size for you on the receiving side.


    The connection-oriented stream service is well suited to the client-server architecture.
    In a typical client-server interaction, the server creates a socket, gives the
    socket a name, and waits for clients to connect to the socket. The client creates
    a socket and connects to the named socket on the server. When the server detects
    the connection to the named socket, it creates a new socket and uses that new
    socket for communication with the client. The server''s named socket continues
    waiting for connections from other clients. See Figure 3.2 for an illustration
    of this simple client-server interaction.


    The unreliable, connectionless datagram socket is based on the User Datagram Protocol.
    It doesn''t require that a connection be established before two processes can
    send data to and receive data from each other. The data sent between any two processes
    is contained in a single packet. The sender sends the packet and the receiver
    receives the'
