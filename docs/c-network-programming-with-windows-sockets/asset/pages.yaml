- pgno: 111
  md: "```\n```c\nSOCKET clientS;\nclientS = accept(s, NULL, NULL);\nif (clientS ==\
    \ INVALID_SOCKET)\n{\n    int nError = WSAGetLastError();\n\n    // if there is\
    \ no client waiting to connect to this server,\n    // nError will be WSAEWOULDBLOCK\n\
    }\n```\n```\n\nYour server application could simply call `accept()` periodically\
    \ until the call succeeded, or you could use the `select()` call to query the\
    \ status of the socket. The `select()` function checks the readability, writeability,\
    \ and exception status of one or more sockets. Even the most die-hard UNIX or\
    \ Berkeley sockets supporter probably agrees that the use of `select()` is fairly\
    \ unintuitive. As one example, if `select()` tells you that a socket is readable,\
    \ that could mean the socket is ready to connect to a client, or it could mean\
    \ there is some data sent by a client ready to be read. To use `select()` in a\
    \ Windows program would require that it be called periodically, as the result\
    \ of a timer or every time through the application's message loop. No matter what,\
    \ its use doesn't fit well within the message-driven architecture of Windows.\
    \ Thankfully, WinSock provides a more \"Windows native\" method of performing\
    \ nonblocking socket operations.\n\n# ## Doing It the Windows Way\n\nWinSock provides\
    \ a function called `WSAAsyncSelect()` to solve the problem of blocking socket\
    \ function calls. It is a much more natural solution to the problem than using\
    \ `ioctlsocket()` and `select()`. It works by sending a Windows message to notify\
    \ a window of a socket event. Its prototype is as follows:\n\n```\n```c\nint PASCAL\
    \ FAR WSAAsyncSelect(SOCKET s, HWND hWnd,\n    u_int wMsg, long lEvent);\n```\n\
    ```\n\n`s` is the socket descriptor for which event notification is required.\
    \ `hWnd` is the Window handle that should receive a message when an event occurs\
    \ on the socket. `wMsg` is the message to be received by `hWnd` when a socket\
    \ event occurs on socket `s`. It is usually a user-defined message (`WM_USER +\
    \ n`). `lEvent` is a bitmask that specifies the events in which the application\
    \ is interested.\n\n`WSAAsyncSelect()` returns 0 (zero) on success and `SOCKET_ERROR`\
    \ on failure. On failure, `WSAGetLastError()` should be called. Possible error\
    \ values include the following: `WSANOTINITIALIZED` if `WSAStartup()` wasn't called\
    \ successfully; `WSAENETDOWN` if the network subsystem is failing; `WSAEINPROGRESS`\
    \ if a blocking WinSock call is currently in progress; or `WSAEINVAL` if one of\
    \ the parameters is invalid."
