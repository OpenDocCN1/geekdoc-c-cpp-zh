  md: "# CDatagramSocket::CreateSocket()\n\nThe `CreateSocket()` member function creates\
    \ a hidden window that’s used for WinSock messages (that is, `FD_READ` and `FD_WRITE`).\
    \ This function also creates a datagram socket and optionally binds the socket\
    \ to a name. There are two implementations of the `CreateSocket()` member function.\
    \ One implementation takes an integer parameter representing the port number,\
    \ in host byte order, that should be bound to the socket. The other version of\
    \ `CreateSocket()` accepts a string containing the numerical port number or service\
    \ name to bind to the socket, or `NULL`. If `NULL` is specified, or if the function\
    \ is called with no parameter at all, the socket is not bound to a name. Generally\
    \ speaking, the parameter is specified only for server type sockets.\n\nThe version\
    \ of `CreateSocket()` that accepts an integer port number simply converts the\
    \ integer into a string and calls the other version of `CreateSocket()`. It’s\
    \ implemented as follows:\n\n```\n////////////////////////////////////////////////////////////\n\
    // CDatagramSocket::CreateSocket()\n//\n// Create a hidden window that will receive\
    \ asynchronous messages\n// from WinSock.  Also creates a socket and optionally\
    \ binds it to\n// a name if the socket is a server socket.\n//\n// This version\
    \ of the CreateSocket() function takes a\n// port number, in host order, as input.\
    \  A port number\n// should only be specified if the socket is to be bound\n//\
    \ to a certain port.  If you don't care which port is\n// assigned to the socket,\
    \ just call CreateSocket() without\n// any parameter, causing CreateSocket(NULL)\
    \ to be called.\n//\nint CDatagramSocket::CreateSocket(int nLocalPort)\n{\n  \
    \  // if this version of the function is being called,\n    // a valid port number\
    \ must be specified\n    if (nLocalPort <= 0)\n        return CWINDSOCK_PROGRAMMING_ERROR;\n\
    \n    // convert the port number into a string and\n    // call the version of\
    \ CreateSocket() which\n    // accepts a string\n    char pszLocalService[18];\n\
    \    _itoa(nLocalPort, pszLocalService, 10);\n    return CreateSocket(pszLocalService);\n\
    }\n```\n\nThe version of `CreateSocket()` that accepts a string port number or\
    \ service name is implemented in the code that follows. If the datagram socket\
    \ need not be bound to a specific port number or service name, simply call this\
    \ function with no parameter. The C++ default argument feature will pass `NULL`\
    \ to the function, triggering `CreateSocket()` to not bind the socket."
