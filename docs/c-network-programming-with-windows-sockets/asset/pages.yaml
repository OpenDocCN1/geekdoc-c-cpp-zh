  md: "# WinSock TCP/IP Stack Information\n\nThis program, WSINFO, allows you to view\
    \ the details of the WinSock TCP/IP stack that the computer is running. It uses\
    \ the following WinSock functions: `WSAStartup()`, `WSACleanup()`, and `WSAGetLastError()`.\
    \ This program is generated using Visual C++’s AppWizard feature, which creates\
    \ a skeleton application from which to build upon. This book isn’t geared toward\
    \ the beginning Visual C++ programmer, so only the first sample program is worked\
    \ through step by step.\n\nThe first step in producing this program is to use\
    \ AppWizard to generate a skeletal application. This application uses the Single\
    \ Document Interface rather than the Multiple Document Interface. There’s no need\
    \ for any special features such as a toolbar, printing and print preview, context-sensitive\
    \ help, or Object Linking and Embedding. This application is very simple in comparison\
    \ to most. Use WSINFO as the project name.\n\nAfter AppWizard has finished its\
    \ magic, edit WSINFO.H. This file contains the class declaration for the application\
    \ class `CWsinfoApp`. Add the following publicly accessible member variables to\
    \ the class:\n\n```\nWSADATA m_wsaData;       // WinSock information\nBOOL   m_bWinSockOK;\
    \     // TRUE if WinSock startup succeeded\nint    m_nWinSockError;  // WinSock\
    \ error code\n```\n\n`m_wsaData` contains the WinSock information returned by\
    \ `WSAStartup()`. `m_bWinSockOK` is TRUE if WinSock startup succeeded; it’s FALSE\
    \ otherwise. `m_nWinSockError` contains the error code if WinSock startup failed.\
    \ The WSINFO.H file is also a good place to include the WINSOCK.H header file\
    \ because WINSOCK.H is included in the other source files of the project. Add\
    \ the `ExitInstance()` function to the class. This function is called when the\
    \ application exits, allowing us a good opportunity to shutdown WinSock.\n\nAt\
    \ this point, the `CWsinfoApp` class looks like the following:\n\n```\nclass CWsinfoApp\
    \ : public CWinApp\n{\npublic:\n    WSADATA m_wsaData;       // WinSock information\n\
    \    BOOL   m_bWinSockOK;     // TRUE if WinSock startup succeeded\n    int  \
    \  m_nWinSockError;  // WinSock error code\n\npublic:\n    CWsinfoApp();\n\n \
    \   // Overrides\n    virtual BOOL InitInstance();\n    virtual int ExitInstance();\n\
    ```"
