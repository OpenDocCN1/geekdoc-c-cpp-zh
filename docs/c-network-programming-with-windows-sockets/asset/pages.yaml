    # Network Programming Models


    The previous section discussed ways that computers and other resources can be
    attached to a network. But what do we do now that we have networked computers
    that can communicate with one another and share common resources? We need software
    that can take advantage of the network. This section begins a discussion of network
    programming. Network programming can be thought of in two primary contexts: client/server
    and distributed.


    # Client/Server Computing


    In the client/server computing model, an application is split into two parts:
    a front-end client that presents information to the user and collects information
    from the user, and a back-end server that stores, retrieves, and manipulates data
    and generally handles the bulk of the computing tasks for the client. In this
    model the server is usually a more powerful computer than the client, oftentimes
    a minicomputer or mainframe, and serves as a central data store for many client
    computers, making the system easy to administer. Client/server architecture increases
    workgroup productivity by combining the best features of stand-alone PCs with
    the best features of minicomputers and mainframes. Client/server architecture
    makes the best use of high-end server hardware and reduces the load on client
    PCs. Load reduction, in turn, provides superior performance and minimizes network
    traffic. Figure 1.4A shows one example of a client/server interaction with a client
    accessing a database server.


    A server is any program that runs on a networked computer and can provide a service.
    A server receives a request over the network, performs the necessary processing
    to service that request, and returns the result to the requester. The client is
    the program that sends a request to a server and waits for a response.


    For a client and server to communicate and coordinate their work, an interprocess
    communication (IPC) facility is needed. The subject of this book, WinSock, can
    be used to satisfy this requirement. Chapter 15, “Practical Client/Server Database
    Application,” introduces an example that will demonstrate client and server database
    implementations.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'One server program can service several client requests at the same time. For
    this reason, implementing servers tends to be more difficult than implementing
    clients. To provide the capability of supporting several client requests simultaneously,
    servers are usually built in two parts: a single master that accepts requests
    and one or more slaves that actually process and respond to the individual requests.


    Client/server architecture contrasts with the classical centralized architecture
    popularized by typical mainframe installations. In a centralized environment,
    the “clients” are little more than dumb terminals that act as simple data entry/display
    devices. There’s a minimum of work done at the terminal. The user typically fills
    in the fields of a form before sending the field data to the central computer.
    All processing and screen formatting is done on the central computer, and the
    dumb terminal simply displays the preformatted data. In a client/server environment,
    the client has much greater intelligence and more freedom with the final visual
    presentation of the data to the user. Instead of the data being preformatted to
    match the way it will be viewed, it’s sent back in its “raw” format, and the application
    running on the client computer “decides” how to display that data. Thus the “front
    end” that the user sees can be customized while the “back end” remains unchanged.


    # Distributed Computing


    The distributed architecture can be thought of in two different ways: precollection
    and parallel processing.


    *Precollection* is the act by which background processes on networked computers
    concurrently collect and propagate information before that information is requested.
    An example would be a program that requests the status of every other computer
    on the local network. In the client/server environment, the client program would
    have to send a request to each computer on the network and wait for a response.
    This procedure is potentially very time-consuming. In a distributed implementation,
    each computer on the local network would have a process that runs continually
    in the background and that reports status information to every other computer
    on a regular interval. When the program is run to request the status information
    of every other computer on the local network, the response comes back immediately
    because the information was precollected in each local computer. Of course this
    solution wouldn’t work well if the information being requested was time sensitive,
    because the delay in the updates would make the response outdated. Shortening
    the time between the updates sent by the networked computers wouldn’t work well
    either because of the possibility of saturating the network’s data-handling capabilities.


    When most people think of parallel processing, they think of a computer that has
    more than one processing unit. *Parallel computing* in a distributed system environment
    means'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'taking advantage of more than one computer on the network to perform a specific
    task. Suppose that you, as a software developer, want to do a large project build
    late at night when few other programmers are at work. Wouldn’t it be nice to take
    advantage of all that idle processing power lying in each programmer’s workstation
    or desktop PC? With a build utility that was designed for a distributed environment,
    your build could execute in a parallel fashion with certain modules being compiled
    on certain computers and other modules being compiled on other computers. The
    project build could be completed in a greatly reduced time. This assumes that
    the source code going into the build is located somewhere on the network and is
    as easily accessible by all other computers as it is to your own. If the source
    code is located on your local computer, the overhead in shipping it across the
    network to the other computers might overshadow the benefit of multiple modules
    being built simultaneously.


    # Summary


    This chapter has discussed the basics of computer networking and network programming.
    The primary purpose of most computer networks is to allow for the sharing of resources
    such as files, printers, modems, and fax machines, and to facilitate the communication
    of the people using the networked computers. Network topology refers to the way
    networked computers and network resources are connected to each other, with the
    most popular topologies being bus, ring, and star. To take advantage of the network’s
    connectivity, network-aware application software is used. The client/server and
    distributed models are two popular methodologies followed when writing networked
    software. To write this networked software, a network application programming
    interface (API) is used by the programmer. One such network API, and the focus
    of this book, is WinSock. The following two chapters will discuss TCP/IP, the
    underpinnings of WinSock, and WinSock itself.'
  merge: -1
  img_proc: true
