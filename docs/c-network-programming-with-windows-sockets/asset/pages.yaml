- pgno: 103
  md: "# How a Server Accepts a Connection from a Client\n\nIn a server, the stream\
    \ socket is bound to a well-known name. Then the server application listens for\
    \ connections on that socket. When a client connects to the server, the server\
    \ accepts the new connection. At this point, data transfer begins.\n\n# Giving\
    \ the Socket a Name\n\nCreating a socket does little more than allocate a socket\
    \ descriptor for your application from the list of available descriptors. To make\
    \ it useful, you need to give the socket a name. The `bind()` function does this.\
    \ Its prototype is as follows:\n\n```\nint PASCAL FAR bind(SOCKET s, const struct\
    \ sockaddr FAR *addr, int namelen);\n```\n\ns is the socket descriptor returned\
    \ by `socket()`. `addr` is a pointer to the address, or name, to assign to the\
    \ socket. `namelen` is the length of the structure `addr` points to.\n\nOn success,\
    \ `bind()` returns 0 (zero). On failure, `SOCKET_ERROR` is returned and `WSAGetLastError()`\
    \ should be called to find out the reason for the error. Possible error values\
    \ include `WSANOTINITIALIZED` if `WSAStartup()` wasn’t called successfully; `WSAENETDOWN`\
    \ if the network subsystem is failing; `WSAEADDRINUSE` if the address specified\
    \ by `addr` is already in use; `WSAEFAULT` if `namelen` is too small; `WSAEINPROGRESS`\
    \ if a blocking WinSock call is currently in progress; `WSAEAFNOSUPPORT` if the\
    \ address family specified in the structure `addr` points to isn’t supported by\
    \ this protocol; `WSAEINVAL` if the socket is already bound to an address; `WSAENOBUFS`\
    \ if no buffer space can be created; or `WSAENOTSOCK` if the socket descriptor\
    \ s is invalid.\n\nThe `sockaddr` structure is defined as follows:\n\n```\nstruct\
    \ sockaddr\n{\n    u_short sa_family;    // address family\n    char    sa_data[14];\
    \  // up to 14 bytes of direct address\n};\n```\n\nThe format of `sa_data` depends\
    \ on the address family. In WinSock 1.1, only the Internet addressing format is\
    \ supported. For this reason, the `sockaddr_in` structure is provided. Use it\
    \ rather than `sockaddr` when calling `bind()`. The format of the `sockaddr_in`\
    \ structure follows:\n\n```\nstruct sockaddr_in\n{\n    short   sin_family;  \
    \     // address family\n    u_short sin_port;         // service port\n    struct\
    \  in_addr sin_addr; // Internet address\n    char    sin_zero[8];      // filler\n\
    };\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "sin_family must be AF_INET for WinSock 1.1; this value matches the af argument\
    \ in the call to `socket()`. sin_port is the port number, in network byte order,\
    \ on which your server application provides its service. sin_addr is an in_addr\
    \ structure that contains the IP address, in network byte order, on which your\
    \ server will listen for connections. The in_addr structure is used to provide\
    \ three different ways of examining the IP address: as four bytes, as two shorts,\
    \ or as one long. The format of in_addr is as follows:\n\n```\n```c\nstruct in_addr\n\
    {\n    union\n    {\n        struct { u_char s_b1, s_b2, s_b3, s_b4; } S_un_b;\n\
    \        struct { u_short s_w1, s_w2; } S_un_w;\n        u_long S_addr;\n    }\
    \ S_un;\n};\n\n#define s_addr   S_un.S_addr       // can be used for most tcp\
    \ & ip code\n#define s_host   S_un.S_un_b.s_b2  // host on ip\n#define s_net \
    \   S_un.S_un_b.s_b1  // network\n#define s_imp    S_un.S_un_w.s_w2  // imp\n\
    #define s_impno  S_un.S_un_b.s_b4  // imp #\n#define s_lh     S_un.S_un_b.s_b3\
    \  // logical host\n};\n```\n```\n\nNotice the definition of s_addr. This will\
    \ be the most common way of accessing the IP address, as an unsigned long in network\
    \ byte order, because the database and conversion routines manipulate the IP address\
    \ similarly. The remaining field of thesockaddr_in structure, sin_zero, is provided\
    \ as a filler to buffer the remaining eight bytes that are allotted for an address\
    \ (2 byte port + 4 byte IP address + 8 byte filler = 14 bytes total).\n\nFollowing\
    \ is an example of using `bind()`:\n\n```\n```c\nSOCKET s;                   \
    \      // socket descriptor\nchar lpszMessage[100];            // informational\
    \ message\nSOCKADDR_IN addr;                 // Internet address\n\n// create\
    \ a stream socket\ns = socket(AF_INET, SOCK_STREAM, 0);\nif (s != INVALID_SOCKET)\n\
    {\n    // fill out the socket's address information\n    addr.sin_family = AF_INET;\n\
    \    addr.sin_port = htons(1050);\n    addr.sin_addr.s_addr = htonl(INADDR_ANY);\n\
    \n    // bind the socket to its address\n    if (bind(s, (LPSOCKADDR)&addr, sizeof(addr))\
    \ == SOCKET_ERROR)\n    {\n        wsprintf(lpszMessage, \"bind() generated error\
    \ %d\",\n            WSAGetLastError());\n        MessageBox(NULL, lpszMessage,\
    \ \"Info\", MB_OK);\n    }\n    else\n    {\n        ...\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "Notice the assignment of `addr.sin_port` to htons(`1050`). This tells you that\
    \ this server application listens for connections on port 1050. You also could\
    \ use the `getservbyname()` or `WSAAsyncGetServByName()` functions, as in the\
    \ following example, to assign a port number:\n\n```\nLPSERVENT pservent;    \
    \              // pointer to service entry structure\npservent = getservbyname(\"\
    daytime\", \"tcp\");\nif (pservent != NULL)\n    addr.sin_port = pservent->s_port;\
    \ // already in network byte order\n```\n\nThe next line in the sample is the\
    \ assignment of `addr.sin_addr.s_addr`, the actual IP address. In this sample,\
    \ the IP address is set to htonl(`INADDR_ANY`). This tells you that this server\
    \ listens for connections on any network to which the host is connected.\n\n**FIGURE\
    \ 7.3.**\n*Server computer on two networks.*\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_105_0.png)\n\
    \nIn most server applications, the name bound to a socket has its IP address set\
    \ to `INADDR_ANY`. This tells WinSock that you are willing to accept requests\
    \ from any network to which the host is connected. The only time this is an issue\
    \ is if the host running your server application has more than one IP address\
    \ assigned to it. For example, this might be the case if the host has two Ethernet\
    \ cards as shown in Figure 7.3. One Ethernet card is assigned one IP address (say\
    \ 166.78.16.200) and the other Ethernet card has a"
  merge: -1
  img_proc: true
- pgno: 106
  md: "different IP address (say 166.78.16.201). In this case, you may want to place\
    \ a limit whereby clients can connect through only one IP address or the other,\
    \ but not both. In this case you do something like the following:\n\n```\n```c\n\
    addr.sin_addr.s_addr = inet_addr(\"166.78.16.200\");\n```\n```\n\nOne last thing\
    \ to note about this code sample is the call to `bind()` itself. The `addr` parameter’s\
    \ address must be cast to a long pointer to a `sockaddr` structure (`LPSOCKADDR`)\
    \ because `addr` is a `sockaddr_in` structure (`SOCKADDR_IN`).\n\n# Listen for\
    \ Connections\n\nNow that you can name a socket, you can put it to real use by\
    \ listening for connections to that socket from client applications. The `listen()`\
    \ function does this. Its prototype is as follows:\n\n```\n```c\nint PASCAL FAR\
    \ listen(SOCKET s, int backlog);\n```\n```\n\n`s` is the socket descriptor on\
    \ which to listen for connections. `backlog` is a count of pending connections\
    \ that may be queued up before the server application processes them. `backlog`\
    \ must be between one and five, inclusively.\n\nOn success, `listen()` returns\
    \ 0 (zero). On failure, `SOCKET_ERROR` is returned and `WSAGetLastError()` should\
    \ be called to find out the reason for the error. Possible error values include:\
    \ `WSANOTINITIALISED` if `WSAStartup()` wasn’t called successfully; `WSAENETDOWN`\
    \ if the network subsystem is failing; `WSAEADDRINUSE` if the address specified\
    \ by `addr` is already in use; `WSAEINPROGRESS` if a blocking WinSock call is\
    \ currently in progress; `WSAEINVAL` if the socket hasn’t been bound to an address\
    \ using `bind()` or the socket is already connected; `WSAEISCONN` if the socket\
    \ is already connected; `WSAEMFILE` if there are no more free file descriptors;\
    \ `WSAENOBUFS` if no buffer space can be created; `WSAENOTSOCK` if the socket\
    \ descriptor `s` is invalid; or `WSAEOPNOTSUPP` if the socket `s` doesn’t support\
    \ the `listen()` operation (this could happen if socket `s` is of type `SOCK_DGRAM`).\n\
    \n> **NOTE**\n> \n> Backlog acts as a safety net by preventing the WinSock layer\
    \ from allocating lots of resources. Suppose that your server application is very\
    \ slow and can process client connections only once every five seconds. Suppose\
    \ also that the socket has a backlog of three. If four clients try to connect\
    \ to the server socket within five seconds, the fourth client attempt will generate\
    \ a `WSAECONNREFUSED` error at the client side.\n\n![](img/5e551abe6e0cb0588043ee757a235ddb_106_0.png)"
  merge: -1
  img_proc: true
- pgno: 107
  md: "Following is a code snippet showing the use of the `listen()` function:\n\n\
    ```\n```c\nSOCKET s;                       // socket descriptor\nchar lpszMessage[100];\
    \          // informational message\nSOCKADDR_IN addr;               // Internet\
    \ address\n\n// create a stream socket\ns = socket(AF_INET, SOCK_STREAM, 0);\n\
    if (s != INVALID_SOCKET)\n{\n    // fill out the socket's address information\n\
    \    addr.sin_family = AF_INET;\n    addr.sin_port = htons(1050);\n    addr.sin_addr.s_addr\
    \ = htonl(INADDR_ANY);\n\n    // bind the socket to its address\n    if (bind(s,\
    \ (LPSOCKADDR)&addr, sizeof(addr)) != SOCKET_ERROR)\n    {\n        // listen\
    \ for connections (queueing up to three)\n        if (listen(s, 3) == SOCKET_ERROR)\n\
    \        {\n            wsprintf(lpszMessage, \"listen() generated error %d\"\
    ,\n                WSAGetLastError());\n            MessageBox(lpszMessage, 'Info');\n\
    \        }\n        else\n            ...\n    }\n}\n```\n```\n\n# Accept a Connection\n\
    \nNow you have a named socket listening for connections. The next thing for a\
    \ server to do is accept a connection from a client. The `accept()` function does\
    \ this. Its prototype is as follows:\n\n```\n```c\nSOCKET PASCAL FAR accept(SOCKET\
    \ s, struct sockaddr FAR *addr,\n  int FAR *addrlen);\n```\n```\n\n`s` is the\
    \ socket descriptor on which to accept a connection request. `addr` is a pointer\
    \ to a `sockaddr` structure that will accept the address of the connecting client.\
    \ You may pass `NULL` for this parameter or a pointer to a `sockaddr_in` structure,\
    \ as in the `bind()` example. `addrlen` is a pointer that will accept the actual\
    \ length of the address structure in `addr`. If `addr` is NULL, `addrlen` can\
    \ also be NULL; otherwise, the value pointed to by `addrlen` should initially\
    \ contain the length of the structure pointed to by `addr`. This is more clearly\
    \ explained in the following examples.\n\nOn success, `accept()` returns a socket\
    \ descriptor. This returned socket descriptor is the one used for communication\
    \ with the client; the original socket `s` passed in the call to `accept()` remains\
    \ available to accept additional connections. On failure, `INVALID_SOCKET` is\
    \ returned, and `WSAGetLastError()` should be called to find out the reason for\
    \ the error. Possible error values include: `WSANOTINITIALIZED` if `WSAStartup()`\
    \ wasn't called"
