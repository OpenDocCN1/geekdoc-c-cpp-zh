- pgno: 73
  md: "> **Tip**\n> \n> Most programs that have a configuration to select the host\
    \ with which the program communicates enable the user to enter either a host name\
    \ or an IP address. Your program should call inet_addr() first with the user's\
    \ input. If this function returns successfully, your conversion job is finished;\
    \ otherwise, you should call gethostbyname(), assuming that the user entered a\
    \ host name.\n\n# Finding a Host's IP Address\n\nThe main duty of gethostbyname()\
    \ is to take a host name and return its IP address. This function, and its asynchronous\
    \ counterpart named WSAAsyncGetHostByName(), may perform a simple table lookup\
    \ on a host file local to the computer on which the program is running, or it\
    \ may send the request across the network to a name server. Figures 6.1 and 6.2\
    \ show the different means of host name resolution. The application programmer\
    \ doesn't really know which method is used to resolve the host name and it usually\
    \ isn't important, with one caveat, which is described in the section on WSAAsyncGetHostByName().\
    \ The function's prototype looks like the following:\n\n```\n```c\nstruct hostent\
    \ FAR * PASCAL FAR gethostbyname(const char FAR * name);\n```\n```\n\nname is\
    \ a far pointer to a null-terminated character array that contains the name of\
    \ the computer about which you want host information. The hostent structure returned\
    \ has the following format:\n\n```\n```c\nstruct hostent {\n    char FAR * h_name;\
    \         // official name of host\n    char FAR * FAR * h_aliases; // alias list\n\
    \    short h_addrtype;           // host address type\n    short h_length;   \
    \          // length of address\n    char FAR * FAR * h_addr_list; // list of\
    \ addresses\n#define h_addr h_addr_list[0]   // address, for backward compatibility\n\
    };\n```\n```\n\nOn success, the gethostbyname() function returns a pointer to\
    \ a hostent structure, and on failure, the function returns NULL. On a return\
    \ value of NULL, you can call WSAGetLastError() to determine the specifics of\
    \ the problem. Possible error values include the following: WSA_NOTINITIALIZED\
    \ if WSAStartup() wasn't called successfully; WSAENETDOWN if the network subsystem\
    \ is failing; WSAHOST_NOT_FOUND if the host name couldn't be resolved; WSATRY_AGAIN\
    \ if the cause of the failure could be temporary, such as a name server being\
    \ down; WSANO_RECOVERY if there was an unrecoverable error; WSANO_DATA if the\
    \ host name is valid but no appropriate data could be found; WSAEINPROGRESS if\
    \ a blocking WinSock operation is currently in progress; or WSAEINTR if the blocking\
    \ call was canceled by WSACancelBlockingCall()."
