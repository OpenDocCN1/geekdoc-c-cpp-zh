- pgno: 45
  md: 'Certain Berkeley functions have different names in WinSock. For example, in
    UNIX the `close()` system call is used to close the socket connection. In WinSock,
    the function is called `closesocket()`. See the next item for the reason.


    WinSock socket handles may not be UNIX-style file descriptors. In a UNIX environment,
    a socket handle can be operated on in much the same way as any other file handle
    (that is, an actual disk file). In most WinSock implementations, with the possible
    exception of the Win32 environment of Windows NT, socket handles can''t be operated
    on in the same fashion as generic file descriptors.


    Several new functions were added to WinSock to support the message-driven architecture
    of Windows. These are discussed in the following section.


    # WinSock Extensions to Berkeley Sockets


    WinSock has several extensions to Berkeley sockets. Most of these extensions are
    due to the message-driven architecture of Microsoft Windows. Some extensions are
    also required to support the nonpreemptive nature of the 16-bit Windows operating
    environment. Windows NT and the 32-bit follow-up operating system to Windows 3.11
    remove the nonpreemptive limitations, but the additional WinSock functions are
    still useful for reasons discussed later.


    # Windows Message-Driven Architecture


    Although this book is not geared toward the beginning Windows programmer, this
    section gives a brief overview of the Windows architecture. If you''re familiar
    with Windows message-driven architecture, feel free to jump ahead to the section
    titled WinSock Asynchronous Functions.


    At the heart of every Windows program is a message loop and one or more window
    procedures. The message loop retrieves messages from the program''s message queue
    and dispatches them to the appropriate window procedure for execution. Windows
    is considered to be a message-driven or event-driven system because no part of
    the program runs unless a message or event triggers it. Messages are generated
    by user actions such as typing on the keyboard or moving the mouse and by internal
    operating system activity.


    The two major components of a Windows program are its message loop and its windows.
    As described previously, the message loop retrieves messages and calls the window
    procedure appropriate for the window. The message that is retrieved from the message
    queue contains a handle to the window to which the message should be routed.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'The window procedure to call is dependent on the window class of the destination
    window. Some window classes are declared by the application programmer, and other
    pre-defined window classes are supplied by the Windows operating system. These
    predefined window classes are called controls. A few of the predefined controls
    are listed here:


    | Control | Description |

    |---|---|

    | EDIT | Used to view and edit text |

    | LISTBOX | Used to display a list from which the user can select one or more
    items |

    | STATIC | Used to display static text that is often used as labels for other
    controls |


    To better explain the message-driven nature of Windows, you can examine the following
    contrived sample application with a sizable main window, an edit control, and
    a static text label to the left of the edit control. The program’s display is
    shown in Figure 3.3.


    ![](img/5e551abe6e0cb0588043ee757a235ddb_46_0.png)


    The sizable main window has a user-defined window class. The most important properties,
    or styles, of the main window are


    | Style | Description |

    |---|---|

    | WS_CAPTION | Gives the window its title bar |

    | WS_MINIMIZEBOX | Adds the minimize button to the top right of the title bar
    allowing the window to be minimized into an icon |

    | WS_MAXIMIZEBOX | Adds the maximize button to the top right of the title bar
    allowing the window to be maximized to fill the entire screen |

    | WS_SYSMENU | Adds the system menu to the top left of the title bar |

    | WS_THICKFRAME | Gives the window its sizing capabilities |


    The static text label is another window of the application. To the programmer
    new to Windows, it may seem strange that a static text label is a window. A lot
    of what the user thinks of as simple screen elements, such as buttons, list boxes,
    and edit boxes, are really'
