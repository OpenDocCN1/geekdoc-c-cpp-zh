    # Converting IP Addresses


    WinSock provides another set of conversion functions that provide a translation
    be-

    tween the ASCII representation of a dotted-decimal IP address and the internal
    32-bit,

    byte-ordered number required by other WinSock functions.


    # Converting an IP Address String to Binary


    `inet_addr()` converts a dotted-decimal IP address string into a number suitable
    for use

    as an Internet address. Its function prototype is as follows:


    ```

    unsigned long PASCAL FAR inet_addr(const char FAR * cp);

    ```


    cp is a pointer to a string representing an IP address in dotted-decimal notation.
    The

    `inet_addr()` function returns a binary representation of the Internet address
    given. This

    value is already in network byte order, so there is no need to call `htonl()`.
    If the cp string

    doesn’t contain a valid IP address, `inet_addr()` returns INADDR_NONE. One possible
    cause

    for such an error is that the IP address has a component greater than 255. Remember

    that each of the four components of a dotted-decimal IP address represent one
    of four

    bytes of an unsigned long, therefore it’s illegal to have any component with a
    value greater

    than 255 because the value of a byte must be between zero and 255 inclusive.


    The following code fragment shows a typical call to `inet_addr()`. Of course,
    your real

    programs won’t have hard-coded IP addresses; you’ll most likely allow users to
    specify

    IP addresses when they configure your application.


    ```

    u_long ulIPAddress = inet_addr("166.78.16.148");

    ```


    The value of ulIPAddress after this code fragment has executed will be hexadecimal

    A64E1094. `inet_addr()` simply takes each component of the IP address and stores
    it in

    binary as one byte of the four-byte IP address. You don’t need to specify all
    four parts of

    the IP address, though. `inet_addr()` can take an IP address in any of the following
    dotted-

    decimal notations: a.b.c.d, a.b.c, a.b, or a. The a.b.c.d value is a typical IP
    address as

    shown in the preceding code sample. If a quantity is omitted, the last defined
    quantity'
