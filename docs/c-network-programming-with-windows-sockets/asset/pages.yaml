  md: "# # Stream Echo Server CESRSV\n\nAs in the SESERV program described in Chapter\
    \ 8, this sample uses a CFormView-derived object named CMainView as its primary\
    \ user interface. The CMainView header file is shown in Listing 14.5. The m_pWinSock\
    \ member variable controls the starting and stopping of the WinSock subsystem\
    \ for this program. The m_pStreamSrv member variable is a pointer to the stream\
    \ socket object that waits for connections from clients. The m_pStream member\
    \ variable is the stream socket that actually receives data from and sends data\
    \ to the client. The OnStreamSrv() member function receives status information\
    \ for the server stream socket object. It's triggered by the WM_USER_STREAMSRV\
    \ user-defined message whenever a client requests a connection to the server.\
    \ The OnStream() member function receives status information for the stream socket\
    \ object that actually communicates with the client. It’s triggered by the WM_USER_STREAM\
    \ user-defined message whenever a client connection is made or lost and when data\
    \ is available to be read or is finished being written.\n\n# Listing 14.5. MAINVIEW.H\
    \ for CESRSV.\n\n```\n```cpp\n// mainview.h : header file\n//\n//////////////////////////////////////////////////////////////////////\n\
    // CMainView form view\n\n#ifndef __AFXEXT_H__\n#include <afxext.h>\n#endif\n\n\
