- pgno: 65
  md: '# Retrieving Vendor Information and TCP/IP Stack Capabilities


    The other capability of `WSAStartup()` is to provide to the calling application
    information about the underlying TCP/IP stack. We''ve examined the `wVersion`
    and `wHighVersion` variables of the `WSADATA` structure already. The remaining
    variables provide details of the WinSock implementation in use as follows:


    +   - `szDescription` is a pointer to a null-terminated ASCII string that describes
    the WinSock implementation. This string may be up to 256 characters long and usually
    contains a reference to the WinSock vendor, whether it be Microsoft, Wollongong,
    Net Manage, FTP, or another vendor.

    +   - `szSystemStatus` is a pointer to a null-terminated ASCII string that contains
    relevant status or configuration information.

    +   - `iMaxSockets` is the maximum number of sockets that a single process can
    potentially open. Your application can use this number as a rough estimation of
    whether the WinSock DLL is usable by the application. It is not a guarantee that
    your application can allocate this number of sockets.

    +   - `iMaxUdpDg` is the size, in bytes, of the largest UDP datagram that can
    be sent or received by the WinSock implementation. If this number is set to 0
    (zero) there is no implied size limitation.

    +   - `lpVendorInfo` is a pointer to a vendor-specific data structure. Because
    this data is vendor-specific, your program loses its stack independence if it
    makes use of this data.


    # WSACleanup


    The `WSACleanup()` function is used to terminate an application''s use of WinSock.
    For every call to `WSAStartup()` there has to be a matching call to `WSACleanup()`.
    `WSACleanup()` is usually called after your application''s message loop has terminated.
    In an MFC application, the `ExitInstance()` member function of the `CWinApp` class
    provides a convenient location to call `WSACleanup()`. The prototype follows:


    ```

    ```

    int PASCAL FAR WSACleanup(void);

    ```

    ```'
