- pgno: 48
  md: '# FIGURE 3.4.


    *Message flow.*


    ![](img/5e551abe6e0cb0588043ee757a235ddb_48_0.png)


    The 16-bit Windows environment is cooperatively multitasked. This means that the
    applications running must cooperate with one another so that multiple tasks or
    programs can run simultaneously. They do this by continuously running the message
    loop described previously. If an application calls the `GetMessage()` function
    and there are no messages waiting for that application, Windows switches tasks
    and allows another program to run. That newly running program runs through its
    message loop until it has no more messages to process, and the procedure continues
    through all the programs running on the computer. In this environment, it’s very
    easy for a single program to prevent all others from running. For example, if
    the edit box in the previously described example took 10 seconds to process the
    `WM_CHAR` message, no other tasks on the computer would run for at least 10 seconds.
    Not only would other tasks not run but if the user rapidly typed several keys
    in succession, it would take 10 seconds for each keystroke to be reflected on
    the screen. It is imperative in the nonpreemptive multitasking Windows environment
    to process a message swiftly and return to the message loop. If a program doesn’t
    follow this rule, the performance of the entire computer system will suffer.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Windows NT is a preemptive multitasking operating system. This means that the
    operating system itself determines when a new task should run. It doesn’t depend
    on an application checking for messages in order for a task switch to occur. If,
    as described previously, an application took 10 seconds to process a `WM_CHAP`
    message, other applications could still run before that 10 seconds elapsed. That
    particular application would experience poor performance, but it wouldn’t degrade
    the performance of any other program running on the computer at that time. It’s
    generally considered bad practice for a program to have poor response time to
    a user’s commands. Users won’t be happy if they have to wait 10 seconds for a
    character to appear on the screen. If an operation that was executed in response
    to a message takes a long time to run, the user interface of the program should
    remain responsive to the user. That is why it’s advisable for an application to
    check its message queue often, even in the preemptive environment of Windows NT.


    # WinSock Asynchronous Functions


    WinSock was originally designed for the nonpreemptive Windows architecture. For
    this reason, several extensions were added to traditional Berkeley sockets.


    # Blocking Versus Nonblocking


    Many of the Berkeley socket functions take an indeterminate amount of time to
    execute. When a function exhibits this behavior, it is said to block; calling
    the function blocks the further execution of the calling program. In the Berkeley
    UNIX environment, for which sockets were originally developed, this didn’t pose
    a serious problem because the UNIX operating system would simply preempt the blocking
    program and begin running another program. Windows (unlike Windows NT) can’t preempt
    a task, so all other programs are put on hold until the blocking call returns.
    The designers of WinSock knew this posed a serious problem, so they added special
    code in the blocking functions to force the message loop of other applications
    to be checked. But this was still not the most efficient technique.


    Berkeley sockets already have the notion of blocking versus nonblocking for some
    operations. For example, the `send()` function used to send data to a remote host
    may not return immediately, so the programmer is given the option of creating
    the socket with blocking or nonblocking sends. If the socket is created in blocking
    mode, it won’t return until the data has been delivered. If it’s created in nonblocking
    mode, the call to the `send()` function returns immediately and the program must
    call another function called `select()` to determine the status of the send. Windows
    and Windows NT can use the `select()` method of nonblocking calls, but the best
    thing to do in a Windows program is to use the special Windows asynchronous functions.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The special Windows asynchronous functions begin with the prefix WSAAsync.
    These functions were added to WinSock to make Berkeley sockets better fit the
    message-driven paradigm of Windows. The most common events to use the asynchronous
    functions for are the sending and receiving of data. Sending data might not happen
    instantly, and receiving data most certainly will cause a program to wait unless
    it is receiving a constant stream of bytes. By creating a socket for nonblocking
    sends and receives and using the WSAAsyncSelect() function call, an application
    will receive event notification messages to inform it when it can send data or
    when data has arrived and needs to be read. In the mean time, when there is no
    data communications occurring, the rest of the program remains fully responsive
    to the user’s actions. The WSAAsyncSelect() function and its use with sending
    and receiving data on a nonblocking socket is discussed beginning in Chapter 7,
    “Socket Functions.”


    WinSock even extends Berkeley’s nonblocking support to functions that could still
    cause a Berkeley UNIX program to block. The concept of a name server was introduced
    in Chapter 2, “TCP/IP Overview.” The name server’s job is to take as input the
    plain text representation of a computer’s name and return that computer’s IP address.
    The name server is usually a networked computer distinct from the one running
    WinSock programs that you develop. The services of a name server require that
    a message be sent over the network from the computer using the WinSock program
    to the computer running the name server. This network communication could take
    an indeterminate amount of time. WinSock has compensated for that fact by extending
    the functions that utilize the services of a name server. These functions are
    among those grouped into a category of functions called the database functions
    or the getXbyY functions. GetXbyY is used to refer to these database functions
    because the function names take the form of get X by Y, or put another way: “Given
    Y, what is the corresponding X?” In the name server example, the function used
    is called gethostbyname(); given the computer’s name, what is its host information?
    In Berkeley UNIX, the getXbyY functions may block. WinSock adds asynchronous versions
    of the getXbyY functions called WSAAsyncGetXbyY. The gethostbyname() function
    is complimented by the nonblocking WinSock function called WSAAsyncGetHostByName(),
    for example. A call to WSAAsyncGetXbyY function returns immediately with an identifying
    handle. When the actual work performed by the function has completed, a message
    is sent to the application notifying completion of the function with the specified
    handle. The database functions, in both their blocking and asynchronous forms,
    are discussed in a Chapter 6, “Conversion and Database Functions.”'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The WinSock asynchronous functions were added primarily for the benefit of
    the nonpreemptive Windows environment. You may be questioning their worth in the
    truly preemptive multitasking Windows NT environment. The `WSAAsync` functions
    have an important use even in Windows NT. They allow your applications to remain
    responsive to the user. Users won’t enjoy working with your program if it forces
    them to wait for completion of a long event. Most users expect a way to cancel
    operations that take a long time. For example, suppose that you have a program
    that takes as input a computer’s plain-text name. The user enters the name and
    then presses a button labeled Look Up, which causes the `gethostbyname()` function
    to be called. Using `gethostbyname()` will cause the program to hang for an indeterminate
    amount of time until the request is carried out. Under Windows NT other programs
    would still run, but under Windows the performance of all programs would be degraded.
    This program could be modified to use `WSAAsyncGetHostByName()` instead of `gethostbyname()`.
    As soon as users press the Look Up button, the `WSAAsyncGetHostByName()` function
    is called and returns an identifying handle. If users wish to cancel the search,
    they can press the Cancel button, which terminates the request with that identifying
    handle. Users would maintain full control instead of being at the mercy of the
    program.


    # Summary


    This chapter discussed WinSock as compared to the original Berkeley sockets interface
    popularized by BSD UNIX. WinSock includes most of the Berkeley functionality with
    many extensions to support the event-driven nature of Windows. The use of some
    of these extensions is mandatory for proper program execution; the use of others
    is optional but desirable because they provide a user interface responsive to
    the user’s requests. Later chapters will fully explore the benefits of using the
    WinSock extended functions. The next chapter discusses the Microsoft Visual C++
    development environment.'
