    \n#define WM_USER_STREAMSRV (WM_USER + 1)\n#define WM_USER_STREAM    (WM_USER\
    \ + 2)\n```\n```\n\nThe implementation of the `CMainView` object is shown in Listing\
    \ 14.6. This object performs most of the work for the CSESRV application. `OnInitialUpdate()`\
    \ is called soon after the object is created. This function is responsible for\
    \ starting the WinSock subsystem and creating a server stream socket that waits\
    \ for connection requests to arrive on port 2000. When a client requests a connection,\
    \ the `OnStreamSrv()` member function is triggered with `wParam` set to `CWIN​​SOCK_READY_TO_ACCEPT_CONNECTION`.\
    \ The `m_pStream` object is then used to accept the client connection request.\
    \ When the connection is made, `OnStream()` is called with `wParam` set to `CWIN​​SOCK_YOU_ARE_CONNECTED`.\
    \ When data arrives from the client, `OnStream()` is called with `wParam` set\
    \ to `CWIN​​SOCK_DONE_READING`. Data is read and a write attempt is made to echo\
    \ the data back to the client. When the write finishes, `OnStream()` is called\
    \ with `wParam` set to `CWIN​​SOCK_DONE_WRITING`. At this point, the data pointer\
    \ is freed. When the server application is closed, `CMainView`’s destructor is\
    \ called, destroying the two stream socket objects and shutting down the WinSock\
    \ subsystem.\n\n# Listing 14.6. MAINVIEW.CPP for CSESRV.\n\n```\n```cpp\n// mainview.cpp\
    \ : implementation file\n//\n\n#include \"stdafx.h\"\n#include \"csesrv.h\"\n\
    #include \"mainview.h\"\n```\n```"
