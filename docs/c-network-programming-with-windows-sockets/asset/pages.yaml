  md: "> > **Note**\n> >\n> > Practically speaking, if you know that the environment\
    \ under which your program runs uses a local host's file to resolve host names,\
    \ you don't need to bother with the extra overhead required to use the asynchronous\
    \ versions of the `getXbyY` functions; the blocking functions will do fine because\
    \ you know they will return immediately and won't cause any responsiveness problems\
    \ for any running applications.\n\nThe function prototype for `WSASyncGetHostByName()`\
    \ is as follows:\n\n```\n```c\nHANDLE PASCAL FAR WSASyncGetHostByName(HWND hWnd,\
    \ u_int wMsg,\n    const char FAR * name, char FAR * buf, int buflen);\n```\n\
    ```\n\n`hWnd` is the handle to the window to which a message will be sent when\
    \ `WSASyncGetHostByName()` has completed its asynchronous operation. `wMsg` is\
    \ the message that will be posted to `hWnd` when the asynchronous operation is\
    \ complete. `wMsg` is generally a user-defined message (that is, `WM_USER + 1`).\
    \ `name` is a pointer to a string that contains the host name for which information\
    \ is being requested (that is, `\"goober\"` or `\"goober.ping.com\"`). `buf` is\
    \ a pointer to an area of memory that, on successful completion of the host name\
    \ lookup, will contain the `hostent` structure for the desired host. Note that\
    \ this buffer must be larger than the `hostent` structure itself, because WinSock\
    \ uses the additional area to store related information. WinSock provides a defined\
    \ value named `MAXGETHOSTSTRUCT`, which you can use as the size of the buffer.\
    \ This size will ensure that there is enough space allocated. `buflen` is the\
    \ size of the `buf` buffer. It should be `MAXGETHOSTSTRUCT` for safety's sake.\n\
    \nIf the asynchronous operation is initiated successfully, the return value of\
    \ `WSASyncGetHostByName()` is a handle to the asynchronous task. On failure of\
    \ initialization, the function returns 0 (zero), and `WSAGetLastError()` should\
    \ be called to find out the reason for the error. Possible error values include\
    \ the following: `WSANOTINITIALIZED` if `WSAStartup()` wasn't called successfully;\
    \ `WSAENETDOWN` if the network subsystem is failing; `WSAEWOULDBLOCK` if the function\
    \ cannot be scheduled at this time due to a resource conflict within the specific\
    \ WinSock implementation; or `WSAEINPROGRESS` if a blocking WinSock operation\
    \ is currently in progress. Notice that the function's return value doesn't tell\
    \ you whether the requested information was retrieved successfully; it only tells\
    \ you whether the function was started properly.\n\nThe previous sample code,\
    \ which displays the name and IP address of the machine on which the program runs,\
    \ can be reworked to use the following asynchronous calls:\n\n```\n```c\n// global\
    \ variables\n#define WM_USER_GETGETHOSTBYNAME (WM_USER + 1)\n#define HOST_NAME_LEN\
    \ (50)\n```\n```"
