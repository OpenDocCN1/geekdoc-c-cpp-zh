- pgno: 63
  md: "The second parameter to the WSAStartup() function is a pointer to a WSADATA\
    \ data structure. After the call to the initialization function, this structure\
    \ contains information detailing the WinSock implementation. The WSADATA structure\
    \ has the following format:\n\n```\ntypedef struct WSADATA {\n    WORD       \
    \      wVersion;\n    WORD             wHighVersion;\n    char             szDescription[WSADESCRIPTION_LEN+1];\n\
    \    char             szSystemStatus[WSASYS_STATUS_LEN+1];\n    unsigned short\
    \   iMaxSockets;\n    unsigned short   iMaxUdpDg;\n    char FAR *       lpVendorInfo;\n\
    } WSADATA;\n```\n\nTo verify that the WinSock compliant stack meets the version\
    \ requirements of your application, the application should check the value in\
    \ *wVersion* after the WSAStartup() function returns. For example, if your application\
    \ requires WinSock Version 2.0, compare the high-order byte of *wVersion* to 0\
    \ and the low-order byte to 2. If either of these comparisons fail, the application\
    \ should display a message to the program’s user explaining the failure. The following\
    \ code fragment shows a typical implementation:\n\n```\nWORD wVersionRequested\
    \ = MAKEWORD(1, 1); // WinSock 1.1 requested\nWSADATA wsaData;               \
    \        // WinSock details\nint nErrorStatus;                      // error status\n\
    \nnErrorStatus = WSAStartup(wVersionRequested, &wsaData);\nif (nErrorStatus !=\
    \ 0)\n{\n    // display an error message explaining that WinSock\n    // initialization\
    \ has failed and return\n\n    return;\n}\n\n// check the WinSock version information\n\
    \nif ( (LOBYTE(wsaData.wVersion) != LOBYTE(wVersionRequested)) ||\n     (HIBYTE(wsaData.wVersion)\
    \ != HIBYTE(wVersionRequested)) )\n{\n    // display an error message explaining\
    \ that the WinSock\n    // implementation doesn’t meet the version requirements\n\
    \    // of the application\n\n    WSACleanup();       // terminate WinSock use\n\
    \    return;\n}\n```\n\nThis code segment, or something resembling it, is placed\
    \ early in a program’s execution path. Typically it is found in WinMain() of a\
    \ program built with the Windows SDK or CWinApp::InitInstance() for an MFC program."
  merge: -1
