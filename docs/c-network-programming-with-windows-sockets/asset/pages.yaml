  md: "```\n```c\n        MessageBox(pszMessage, \"Datagram Server Info\");\n    }\n\
    \n    closesocket(s);\n}\n```\n```\n\nNote that in this example the optional `from`\
    \ parameter was provided. This gives the receiver the ability to send data back\
    \ to the sender. This is demonstrated in the next chapter's datagram example program.\n\
    \nAs with the `sendto()` function, the `recvfrom()` function may block. Use `WSAAsyncSelect()`\
    \ with the `FD_READ` event to solve this problem. Implementation is similar to\
    \ that of the stream example.\n\n# ## Closing a Socket\n\nThe previous sections\
    \ explain how network applications create sockets and communicate through them.\
    \ The last thing to do is close the socket. The `closesocket()` function's prototype\
    \ is as follows:\n\n```\n```c\nint PASCAL FAR closesocket(SOCKET s);\n```\n```\n\
    \ns is the socket to close. On success, it returns 0 (zero). On failure, `SOCKET_ERROR`\
    \ is returned and `WSAGetLastError()` reveals the following: `WSANOTINITIALIZED`\
    \ if WinSock wasn't initialized with `WSAStartup()`; `WSAENETDOWN` if the network\
    \ subsystem is failing; `WSAEINTR` if the blocking call was canceled with `WSACancelBlockingCall()`;\
    \ `WSAEINPROGRESS` if a blocking call is in progress; `WSAENOTSOCK` if the socket\
    \ s isn't a valid socket descriptor; or `WSAEWOULDBLOCK` if the socket s is marked\
    \ as nonblocking and the `closesocket()` would block.\n\nThere are several variables\
    \ that determine the closing characteristics of a socket. These characteristics\
    \ are determined by the socket's linger options as set with `setsockopt()` (see\
    \ Table 7.2).\n\n**Table 7.2. Linger Behavior on `closesocket()`.**\n\n| Option\
    \ | Interval | Type of Close | Wait for Close? |\n|---|---|---|---|\n| `SO_LINGER`\
    \ | Zero | Hard | No |\n| `SO_LINGER` | Nonzero | Graceful | Yes |\n| `SO_DONTLINGER`\
    \ | Don't care | Graceful | No |"
