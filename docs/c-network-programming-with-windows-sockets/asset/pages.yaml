- pgno: 53
  md: 'Microsoft’s Visual C++ product has greatly simplified the development of Windows
    programs. The application developer is no longer required to start every project
    with the same hundred lines of mandatory code just to display the most basic of
    windows. The Microsoft Foundation Class library (MFC) encapsulates most of that
    drudgery, allowing the programmer to start working on the real problem instead
    of the plumbing. The samples presented in this book make use of MFC and Visual
    C++.


    # Visual C++ Components


    The Visual C++ package includes several tools that are tightly integrated with
    each other and to the Microsoft Foundation Class library. The combination of these
    tools makes it easy to create a framework from which the application begins.


    # Visual Workbench


    Visual Workbench is the program you will spend the most time in. It includes a
    color-coded text editor which highlights keywords in your C and C++ source code.
    The Visual Workbench also encompasses a build manager which manages makefiles
    that can be used from within Visual Workbench or from the command line. This build
    manager is used to add new source files to a project, change compiler and linker
    options, and automatically generate source code dependencies. The Visual Workbench
    also includes a source level debugger. Debugging, and coding in general, is made
    much simpler by the help facility built into Visual Workbench. By placing the
    caret on a Windows, C, or C++ keyword and pressing the F1 key, help on that topic
    is displayed. Figure 4.1 shows Visual Workbench operating on the TEST project
    with two source code windows open for editing.


    # AppWizard


    AppWizard is one component of the Visual Workbench. It automates the task of creating
    a minimalistic Windows program by prompting you with several options and then
    creating the skeleton source code necessary for that application. The skeleton
    program created by AppWizard supports window management, a basic menu structure,
    and basic menu commands. Some of the options offered determine whether the application
    will have:


    Multiple Document Interface or Single Document Interface. A MDI application can
    have one or more child windows within the main application window. The Visual
    Workbench is an example of a MDI application because it allows you to have several
    source code windows open at any one time.'
