    \nThe HandleWrite() member function handles the asynchronous FD_WRITE event notification\
    \ messages sent by the WinSock subsystem. This function is called when WinSock\
    \ thinks a write out of the socket will succeed. The first portion of this socket\
    \ checks to see whether there is any data waiting to be sent from the write queue.\
    \ This queue is added to by the application calling the Write() member function.\
    \ If there is data in the write queue, a send() is attempted. If the send() would\
    \ block, the data is retained to have another send attempted at a later time.\
    \ If the send() fails with an error other than WSAEWOULDBLOCK, the data is removed\
    \ from the write queue and the m_uMsg message is sent to the application window\
    \ with wParam set to CWINSOCK_ERROR_WRITING and lParam the pointer to the data\
    \ that was unsuccessfully sent. If the send() succeeds but not all of the bytes\
    \ are sent, a pointer into the buffer is retained until the next time HandleWrite()\
    \ is executed. When the entire buffer is successfully sent, wParam is set to CWINSOCK_DONE_WRITING\
    \ and lParam is the data pointer. When the application receives this message notification,\
    \ it's safe to free or reuse the storage space pointed to by the pointer returned\
    \ in lParam.\n\n```\n////////////////////////////////////////////////////////////////\n\
    // CStreamSocket::HandleWrite()\n//\n// Called when there is an asynchronous write\
    \ event on the socket.\n//\n// If there is data in the write queue waiting to\
    \ be sent,\n// a WinSock send is attempted. If the send is successful,\n// a m_uMsg\
    \ message is sent to the application window with\n// wParam set to CWINSOCK_DONE_WRITING\
    \ and lParam set to the\n// address of the data that was sent. On send failure,\n\
    // wParam is set to CWINSOCK_ERROR_WRITING and lParam set to\n// the address of\
    \ the data which couldn't be sent. In either\n// case, the application may free\
    \ the pointer pointing to\n// the data. In no case should the buffer be considered\
    \ to\n// be empty: the entire amount of data to not be sent in one call to send().\n\
    // In this case, an attempt is made to send the remaining portion\n// of that\
    \ block of data the next time HandleWrite() is invoked.\n//\n//\n```"
