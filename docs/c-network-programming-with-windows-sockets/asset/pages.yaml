- pgno: 187
  md: 'succeeds. SECLIENT’s `CMainView::OnAsyncSelect()` is called with the `FD_CONNECT`
    event.

    SESERV’s `CMainView::OnAsyncSelect()` is called with the `FD_ACCEPT` event and,
    if the `m_sClient` socket isn’t yet connected, a connection is made.


    In five seconds the timer will trigger in SECLIENT, causing `CMainView::OnTimer()`
    to get called. No bytes are waiting to be sent yet, so the outgoing buffer is
    filled and a WinSock `FD_WRITE` message is faked to trigger the sending of the
    data. This has to be done because the real `FD_WRITE` may have been missed or
    it may have occurred when there was nothing to send yet.


    `CMainView::OnAsyncSelect()` is called in SECLIENT with an `FD_WRITE` event. There
    are bytes to be sent, so an attempt to transmit them to the stream echo server
    is made. If the attempt succeeds, the number of bytes remaining to be sent is
    reduced. If there was an error sending but the error was simply that the send
    would block, the count of bytes to send is retained because you’ll get a real
    `FD_WRITE` eventually. If all the bytes to be sent can’t be transmitted in a single
    call to `send()` (unlikely given the size of the data in the sample), `FD_WRITE`
    events will continue to be generated and the byte count will be reduced until
    it’s eventually 0 (zero).


    Assuming that SECLIENT sends a buffer, `CMainView::OnAsyncSelect()` is called
    in SESERV with an `FD_READ` notice. SESERV only has one buffer for both incoming
    and outgoing data, so `FD_READ` is ignored if there are any bytes still to be
    echoed back to the client. If the data is read successfully, a byte count is recorded
    and a fake `FD_WRITE` message is generated to force the sending of the just-received
    data back to the originator (SECLIENT).


    `CMainView::OnAsyncSelect()` is called in SESERV with an `FD_WRITE` event. There
    are bytes to be sent, so an attempt to transmit them to the stream echo client
    is made. If the attempt succeeds and bytes are written, the number of bytes yet
    to send is reduced by however many bytes were successfully written. If there was
    an error sending but the error was simply that the send would block, the count
    of bytes to send is retained because you’ll get a real `FD_WRITE` eventually.
    Several `FD_WRITE` events may be generated until the entire buffer is echoed (although
    this is highly unlikely in this example, given the small buffer size).


    Assuming that SESERV sends a buffer, `CMainView::OnAsyncSelect()` is called in
    SECLIENT with an `FD_READ` notice and the client reads the echoed data. Another
    timer goes off in SECLIENT and the process repeats.'
