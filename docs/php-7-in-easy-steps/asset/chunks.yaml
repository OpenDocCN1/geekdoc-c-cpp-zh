    ## Assessing logic


    | Operator | Description |

    | :--- | :--- |

    | **and** | `&&` | Logical AND: both operands are `TRUE`. |

    | **or** | `||` | Logical OR: at least one operand is `TRUE`. |

    | **xor** | `xor` | Logical XOR: if one operand is `TRUE`, but not both. |

    | **not** | `!` | Logical NOT: inverts the value of the operand. |


    The term “Boolean” refers to a system developed by George Boole (1815-1864). The
    logical operators most commonly used in PHP are listed below:


    | **Operator** | **Operation** |

    | :--- | :--- |

    | **and** | `&&` | Logical AND |

    | **or** | `||` | Logical OR |

    | **xor** | `xor` | Logical XOR |

    | **not** | `!` | Logical NOT |


    The `&&` operator needs both operands to be `TRUE`. If neither operand is `TRUE`,
    it will return `FALSE`.


    The `||` operator returns `TRUE` if either one operand is `TRUE`. If neither operand
    is `TRUE`, it will return `FALSE`.


    The `xor` operator evaluates two operands and only returns `TRUE` if one operand
    is `TRUE`, but not both. If both operands are `TRUE`, it will return `FALSE`.


    The `!` operator is a “unary” operator that is used before a single operand. It
    returns the inverse value of the operand, so if the variable `$var` is `TRUE`
    then `!$var` would return a `FALSE`. The `!` operator is useful to toggle the
    value of a variable in a loop with a statement `$var = ! $var`. On each iteration
    the value is reversed, like flicking a switch on off.


