    ![image](Image00100.jpg)  Now, add a statement for a case-insensitive comparison


    **echo ‘Comparison Ignoring Case :<br>’ ;**


    **echo “’$str1’ versus ‘$str4’ : “ .strcasecmp( $str1 , $str4 ) ;**


    ![image](Image00101.jpg)  Finally, add a loop to count and display the total ASCII
    code value of the first string


    **$total = 0 ;**


    **for ( $i = 0 ; $i < strlen( $str1 ) ; $i ++ )**


    **{**


    **$total += ord( $str1 [ $i ] ) ;**


    **}**


    **echo “<hr>ASCII Total $str1 : $total ” ;**


    **?>**


    ![image](Image00102.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **characters.php**  then open the page via HTTP to see the string comparisons


    ![image](Image00103.jpg)


    ![image](Image00006.jpg)


    Character order is relevant as the ASCII totals for two differently ordered strings
    could be equal, but the strings would not match.


    **Searching text**


    PHP provides a number of built-in functions to search a string to find a specified
    substring or single character. The simple **strpos()** function accepts two arguments
    to specify the string in which to search, and the substring to find. It will search
    in sequence from the start of the string to find a match. When a match is found
    the search halts and the **strpos()** function returns an integer, which is the
    character index number position within the string at which the first occurrence
    of a match begins. When no match is found the **strpos()** function returns **FALSE**
    .


    The **strrpos()** function works in a similar way but returns the index number
    position at which the first occurrence of a match begins when searching in reverse
    order, from the end of the string.


    Other PHP search functions can return a part of the searched string, rather than
    an index number indicating a match position.


    The **strstr()** function accepts two arguments to specify the string in which
    to search, and the substring to find. It will search in sequence from the start
    of the string to find a match. When a match is found, the search halts and the
    **strstr()** function returns the remainder of the searched string from where
    the first occurrence of a match begins. When no match is found the **strstr()**
    function returns **NULL** .


    ![image](Image00019.jpg)


    Notice that there is no **strrstr()** (companion function to **strstr()** ) to
    search in reverse order.


    Similarly, where character case is unimportant, you can use the companion **stristr()**
    function to make a case-insensitive search. This will return the remainder of
    the searched string from where the first occurrence of a case-insensitive match
    begins.


    The **strchr()** function works in a similar way but accepts two arguments to
    specify the string in which to search, and a single character to find. As you
    might expect, the companion **strrchr()** function begins searching in reverse
    order, from the end of the string. Both return the remainder of the searched string
    from where the first occurrence of a match begins.


    ![image](Image00029.jpg)


    search.php


    ![image](Image00098.jpg)  Begin a PHP script with statements to initialize a variable
    with a string value and report its length


    **<?php**


    **$str = ‘Most Users usually find PHP useful.’ ;**


    **echo “’ $str ’<br>String Length : “ .strlen( $str ) ;**


    ![image](Image00099.jpg)  Next, add statements to search the string, both forwards
    and reverse, and report the position of a given substring


    **echo “<br>First ‘us’ found at : “ .strpos( $str , ‘us’ ) ;**


    **echo “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;**


    ![image](Image00100.jpg)  Now, add statements to search the string, both case-
    sensitive and case-insensitive, and return the remainder of the string following
    a substring match


    **echo “<hr>Substring from first ‘us’ : “ .strstr( $str , ‘us’ ) ;**


    **echo “<br>Substring from first ‘us’ case insensitive : “**


    **.stristr( $str , ‘us’ ) ;**


    ![image](Image00101.jpg)  Finally, add statements to search the string, both forwards
    and reverse, and return the remainder of the string following a character match


    **echo “<hr>Characters from first ‘u’ : “ .strchr( $str , ‘u’ ) ;**


    **echo “<br>Characters from final ‘u’ : “ .strrchr( $str , ‘u’ ) ;**


    **?>**


    ![image](Image00102.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **search.php**  then open the page via HTTP to see the search results


    ![image](Image00104.jpg)


    ![image](Image00006.jpg)


    There are three occurrences of ‘us’ in this string, but only the first and third
    are matched.


    **Extracting substrings**'
