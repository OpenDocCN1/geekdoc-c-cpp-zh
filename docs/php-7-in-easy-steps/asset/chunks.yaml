    \ a base class named “Polygon”, which has two private variables initialized by\
    \ the constructor, and has two public getter methods\n"
  raw: 'It is often convenient to combine the setter methods into a single method
    that accepts arguments for each private variable. This means that all values can
    be assigned with a single statement in the program, but the method will contain
    multiple statements.


    Optionally, each parameter can specify a permissible data type for each argument
    being passed, and may also usefully specify default values to each parameter:


    ![image](Image00029.jpg)


    initializer.php


    ![image](Image00114.jpg)  Rename a copy of the previous example “object.php” as
    a new program “initializer.php”


    ![image](Image00115.jpg)  In the Dog class declaration, replace the three setter
    methods with a single combined setter method that specifies the argument data
    types and default values


    **public function setValues**


    **( int $yrs = 2 , int $lbs = 8 , string $fur = ‘black’ )**


    **{**


    **// Statements to be inserted here.**


    **}**


    ![image](Image00116.jpg)  In the method definition block, insert three statements
    to assign values from passed arguments to class variables


    **$this-> age = $yrs ;**


    **$this-> weight = $lbs ;**


    **$this-> color = $fur ;**


    ![image](Image00117.jpg)  After the modified class definition, replace the calls
    to the three setter methods by a single call to the combined setter method – passing
    three arguments


    **$fido -> setValues ( 3 , 15 , ‘brown’ ) ;**


    ![image](Image00118.jpg)  Declare a second instance of the Dog class named “pooch”


    **$pooch = new Dog () ;**


    ![image](Image00119.jpg)  Add a second call to the combined setter method – passing
    three arguments for the new object


    **$pooch -> setValues ( 4 , 18 , ‘gray’ ) ;**


    ![image](Image00005.jpg)


    Try passing an incorrect data type to the initializer method to see a type error
    occur.


    ![image](Image00121.jpg)  Add statements calling each getter method to retrieve
    the assigned values


    **echo ‘<hr>Pooch: ‘ . $pooch -> getAge (). ’yrs’ ;**


    **echo $pooch -> getWeight (). ’lbs ’ . $pooch -> getColor () ;**


    ![image](Image00122.jpg)  Add a second call to the regular output method


    **$pooch -> bark () ;**


    ![image](Image00123.jpg)  Now, declare a third instance of the Dog class named
    “rover”


    **$rover = new Dog () ;**


    ![image](Image00124.jpg)  Add a third call to the combined setter method – this
    time passing no arguments for the new object


    **$rover -> setValues ( ) ;**


    ![image](Image00126.jpg)  Add statements calling each getter method to retrieve
    the assigned values, which are specified default values


    **echo ‘<hr>Rover: ‘ . $rover -> getAge (). ’yrs’ ;**


    **echo $rover -> getWeight (). ’lbs ’ . $rover -> getColor () ;**


    ![image](Image00127.jpg)  Add a third call to the regular output method


    **$rover -> bark () ;**


    ![image](Image00128.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **initializer.php**  then open the page via HTTP to see the output set by
    the combined initializer method


    ![image](Image00129.jpg)


    ![image](Image00130.jpg)


    ![image](Image00006.jpg)


    You must still call the initializer method here, to assign the default values
    to the class variables when passing no arguments.


    **Using constructors**


    Class variable members can be initialized by a special “constructor” method that
    is called whenever an instance of the class is created. The constructor method
    is always named __ **construct()** and can accept arguments to set the initial
    value of class variables.


    ![image](Image00131.jpg)


    A constructor method has a companion “destructor” method – that is called whenever
    an instance of the class is destroyed. The destructor method is always named __
    **destruct()** .


    Constructor and destructor methods have no return value and are called automatically
    – they cannot be called explicitly, and consequently their declarations need no
    access specifier.


    Values to initialize class variables are passed to the constructor method in the
    statement creating an object, in parentheses following the object name:


    ![image](Image00029.jpg)


    constructor.php


    ![image](Image00114.jpg)  Rename a copy of the previous example “initializer.php”
    as a new program “constructor.php”


    ![image](Image00115.jpg)  In the Dog class declaration, replace the setValues
    method with this constructor


    **function construct**


    **( int $yrs = 2 , int $lbs = 8 , string $fur = ‘black’ )**


    **{**


    **$this-> age = $yrs ;**


    **$this-> weight = $lbs ;**


    **$this-> color = $fur ;**


    **}**


    ![image](Image00116.jpg)  Now, add a simple destructor method


    **function __destruct() { echo ‘<hr>Object Destroyed.’ ; }**


    ![image](Image00117.jpg)  After the Dog class declaration, edit the statement
    creating the “fido” object – to pass values to its constructor method, in order
    to initialize properties


    **$fido = new Dog ( 3 , 15 , ‘brown’ ) ;**


    ![image](Image00118.jpg)  Similarly, edit the statement creating the “pooch” object
    – to pass values to the constructor method


    **$pooch = new Dog ( 4 , 18 , ‘gray’ ) ;**


    ![image](Image00005.jpg)


    The definition of a class method is also known as the method “implementation”.


    ![image](Image00119.jpg)  Also edit the statement creating the “rover” object
    – to use default values of the constructor method


    **$rover = new Dog ( ) ;**


    ![image](Image00121.jpg)  Delete the statements calling the setValues method of
    all three objects – the constructor now replaces that method


    ![image](Image00006.jpg)


    Although the initial values of the variable members are set by the constructor,
    setter methods can be added to subsequently change the values – and those new
    values can be retrieved by the getter methods.


    PHP provides several functions to interrogate classes such as **class_exists(*class*
    )** , **method_exists(*class, method* )** , and **property_exists(*class, property*
    )** that return **TRUE** on success. You can also get a list of class members
    with **get_class_vars(*class* )** and **get_class_methods(*class* )** to see only
    “visible” members:


    ![image](Image00122.jpg)  Add statements to display the total number of accessible
    variables in the Dog class


    **$items = get_class_vars( ‘ Dog’ ) ;**


    **echo ‘<br>Dog variables : ‘ .count( $items ) ;**


    ![image](Image00123.jpg)  Add statements to display the names of accessible methods
    in the Dog class


    **echo ‘<br>Dog methods :’ ;**


    **$items = get_class_methods( ‘ Dog’ ) ;**


    **foreach( $items as $item ) { echo “ $item , ” ; }**


    ![image](Image00124.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **constructor.php**  then open the page via HTTP to see the output set by
    the constructor


    ![image](Image00132.jpg)


    ![image](Image00005.jpg)


    The number of visible variables is zero. Temporarily change their access specifier
    to public and see it become 3 – encapsulation in action.


    **Inheriting properties**


    A PHP class can be created as a brand new class, like those in previous examples,
    or can be “derived” from an existing class. Importantly, a derived class inherits
    members of the parent (base) class from which it is derived – in addition to its
    own members.


    ![image](Image00133.jpg)


    The ability to inherit members from a base class allows derived classes to be
    created that share certain common properties, which have been defined in the base
    class. For example, a “Polygon” base class may define width and height properties
    that are common to all polygons. Classes of “Rectangle” and Triangle” could be
    derived from the Polygon class – inheriting width and height properties, in addition
    to their own members defining their unique features.


    ![image](Image00134.jpg)


    The virtue of inheritance is extremely powerful and is the second principle of
    Object Oriented Programming (OOP).


    A derived class declaration adds the **extends** keyword after its class name,
    followed by the name of class from which it derives:


    ![image](Image00029.jpg)


    inheritance.php


    ![image](Image00114.jpg)  Begin a PHP script by declaring a base class named “Polygon”,
    which has two private variables initialized by the constructor, and has two public
    getter methods'
