    ```php\n$letters = array( ‘A’ , ‘B’ , ‘C’ ) ;\n$numbers = array( 1 , 2 , 3 ) ;\n\
    $matrix = array( ‘Letter’ => $letters , ‘Number’ => $numbers ) ;\n```\n\n![image](img/Image00038.jpg)\
