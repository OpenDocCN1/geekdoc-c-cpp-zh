    [**Summary**](#text00012.html_sec81)


    **Submitting cookie data**


    Data entered by a user is frequently required across multiple pages of a website.
    User data can conveniently be stored in small “cookie” files on the client machine,
    so the user need not tediously enter the same data repeatedly. The PHP **setcookie()**
    function makes it easy to create a cookie by specifying three arguments:


    **setcookie( *name , value , expiry-time* ) ;**


    ![image](Image00005.jpg)


    The **setcookie()** function can also accept further optional arguments to specify
    visible path, visible domain, https security, and visibility for http access only.


    When an HTML form is submitted to the server using the **POST** method, its field
    data is automatically assigned to the special PHP **$_POST** global array variable.
    A script can check for the presence of individual submission fields using a built-in
    PHP **isset()** function to seek an element of a specified HTML field name. When
    this confirms the field is indeed present, its name and value can usefully be
    stored in a cookie. This might be used to store username and password details
    for use across a website:


    ![image](Image00174.jpg)


