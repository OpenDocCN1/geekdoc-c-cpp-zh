    **$hello ( ‘Mike’ ) ;**


    ![image](Image00087.jpg)  Now, define a regular function that accepts a single
    callable argument and calls that function passing a string


    **function greet ( callable $anon )**


    **{**


    **$anon ( ‘Carole Anne’ ) ;**


    **}**


    ![image](Image00088.jpg)  Add a statement to call the function, defined in the
    previous step, passing the anonymous function that was assigned to a variable
    in the first step


    **greet( $hello ) ;**


    ![image](Image00089.jpg)  Next, define another regular function, which has one
    local variable and returns an anonymous function that references the local variable
    value


    **function meet () : callable**


    **{**


    **$time = ‘morning’ ;**


    **return function( $name ) use( & $time )**


    **{ return “Good $time , $name !” ; } ;**


    **}**


    ![image](Image00091.jpg)  Assign to a variable the function defined in the previous
    step then call that function, passing a string argument


    **$meeting = meet () ;**


    **echo $meeting ( ‘Susan’ ) ;**


    **?>**


    ![image](Image00096.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **callback.php**  then open the page via HTTP to see the returned values from
    anonymous functions


    ![image](Image00097.jpg)


    ![image](Image00006.jpg)


    Remember to include the & ampersand prefix to create a reference to the variable
    value.


    ![image](Image00005.jpg)


    Notice that the final function call gets the ‘morning’ string from the parent
    scope.


    **Summary**


    • Custom functions allow PHP scripts to be modularized into sections of code that
    are easier to understand and maintain


    • Function names must begin with a letter or underscore character and are not
    case-sensitive


    • A function is defined by stating its name after the **function** keyword, then
    parentheses and braces containing statements


    • A function accepting arguments is defined by including a comma-separated list
    of parameters within the parentheses


    • Optionally, a function definition can specify the type of data to be passed
    from the caller by including a data type description before the parameter name


    • Argument data is normally passed by value but can be passed by reference if
    the parameter name is given an **&** prefix


    • Default argument values can optionally be specified in a function definition
    by assignment to the parameter name


    • When a parameter name is given a **...** splat operator prefix, multiple arguments
    can be passed to that parameter to create an array


    • Variables created outside a function have global scope, but are not accessible
    from within a function block unless it includes a declaration using the **global**
    keyword


    • Variables created inside a function have local scope so are only accessible
    from within that particular function block


    • Local variables lose their value when the program scope leaves the function,
    but **static** variables retain their value


    • The **return** keyword returns a single item to the caller and the function
    definition can optionally specify the return data type


    • An anonymous function definition does not specify a name but is an expression
    so must end with a **;** semicolon


    • The **use** keyword and **&** ampersand prefix allow an anonymous function to
    reference a local variable in the returning function


    6


    **Manipulating strings**


    *This chapter demonstrates various ways to manipulate text strings in PHP scripts.*


    [**Comparing characters**](#text00008.html_sec39)


    [**Searching text**](#text00008.html_sec40)


    [**Extracting substrings**](#text00008.html_sec41)


    [**Changing case**](#text00008.html_sec42)


    [**Formatting strings**](#text00008.html_sec43)


    [**Making dates**](#text00008.html_sec44)


    [**Encoding entities**](#text00008.html_sec45)


    [**Summary**](#text00008.html_sec46)


    **Comparing characters**'
