    只有当 Web 服务器通过 HTTP 协议提供文档时，PHP 引擎才能对其进行解释。你不能简单地在浏览器中直接打开 PHP 文件。请始终使用 `http://localhost/`
    地址来运行本书中的示例。


    Abyss Web 服务器现在应该运行在你的系统上，并经过了正确配置，能够识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的
    PHP 脚本由 Abyss 为你的 浏览器提供服务来测试配置：


    ![image](img/Image00029.jpg)


    `phpinfo.php`


    ![image](img/Image00008.jpg) 打开一个纯文本编辑器，并准确输入以下脚本


    ```php

    <?php phpinfo() ; ?>

    ```


    ![image](img/Image00010.jpg) 将脚本保存为 `phpinfo.php`，位于 Abyss 的文档路径目录下，通常位于 `C:\Abyss
    Web Server\htdocs`


    ![image](img/Image00012.jpg) 在 Web 浏览器的地址栏中准确输入位置 `http://localhost/phpinfo.php`，以查看
    Abyss 提供一个包含你 PHP 版本信息的网页


    ![image](img/Image00030.jpg)


    ![image](img/Image00019.jpg)


    PHP 脚本对大小写敏感，因此你必须仅使用小字母复制列出的脚本。


    ## 嵌入 PHP 脚本代码


    PHP 脚本可以嵌入 HTML 文档——这意味着 PHP 和 HTML 代码可以和谐地共存在同一个文件中。所有的嵌入 PHP 代码必须包含在 `<?php`
    和 `?>` 标签内，以便 PHP 引擎能够轻松识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后发送到 Web 浏览器：


    ![image](img/Image00029.jpg)


    `hello.php`


    ![image](img/Image00008.jpg) 启动一个纯文本编辑器，并创建一个有效的空白 HTML5 文档，带有一个空的 body 部分


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title> Getting Started In PHP</title>

    </head>

    <body


    </body>

    </html>

    ```


    ![image](img/Image00010.jpg) 在 body 部分插入标签以包含 PHP 代码


    ```php

    <?php


    ?>

    ```


    ![image](img/Image00012.jpg) 现在，在 PHP 标签之间插入描述性注释和一行代码，将内容写入 body 部分


    ```php

    # 写入传统的问候。

    echo ''<h1>Hello World!</h1>'' ;

    ```


    ![image](img/Image00031.jpg)


    ![image](img/Image00005.jpg)


    注意，描述性注释包含在 PHP 标签之间仅用于信息说明目的。


    ![image](img/Image00014.jpg) 将文档编码设置为 UTF-8 格式，然后将其保存为 Abyss 服务器 `/htdocs` 文件夹中的
    `hello.php`


    ![image](img/Image00032.jpg)


    ![image](img/Image00015.jpg) 接下来，在 Web 浏览器的地址栏输入位置 `http://localhost/hello.php`，查看
    Abyss 提供一个包含由嵌入 PHP 代码编写内容的网页


    ![image](img/Image00033.jpg)


    ![image](img/Image00017.jpg) 现在，使用 Web 浏览器的“查看源代码”功能查看 PHP 是否已将内容写入 body 部分，包括
    HTML `<h1></h1>` 标题标签


    ![image](img/Image00034.jpg)


    PHP 脚本可以用同样的方式嵌入较早版本的 HTML 中。书中的其他示例演示了嵌入 PHP 脚本，但没有重复列出 HTML 代码。


    ![image](img/Image00019.jpg)


    Windows 记事本会自动向文件添加一个隐藏的“字节顺序标记”（BOM）签名，而其他编辑器（如此处所示 Code Writer）允许省略此标记。Code
    Writer 是一个从 Windows 商店提供的免费文本和代码编辑器。


    ![image](img/Image00006.jpg)


    注意，PHP 的 `echo` 指令会原封不动地写入一对 `'' ''` 单引号内的全部内容。


    ## 遵循规则编写脚本


    ### 标签规则


    当 PHP 引擎从 Web 服务器接收输入时，它会从上到下读取输入，这个过程被称为“解析”。在解析过程中，PHP 引擎（又称为解析器）寻找起始和结束标签 `<?php`
    和 `?>`，并理解这些标签之间的内容是它必须解释的脚本代码。`<?php` 和 `?>` 标签之外的所有内容都会被完全忽略，这允许 PHP 文件拥有混合内容，并允许
    PHP 代码像这样嵌入到 HTML 中：


    ```html

    <p> 被 PHP 忽略并由浏览器显示</p>

    <?php echo ''Script code that will be parsed'' ; ?>

    <p> 也被 PHP 忽略并由浏览器显示</p>

    ```


    为了让其正常工作，当嵌入 HTML 文件中时，将所有的 PHP 脚本代码都包含在起始标签 `<?php` 和结束标签 `?>` 之间是非常重要的。


    ![image](img/Image00005.jpg)


    通常，你的嵌入 PHP 代码在脚本周围始终有起始标签 `<?php` 和结束标签 `?>`。


    此规则的唯一例外是 PHP 脚本写在纯 PHP 文件中，该文件只包含代码。在这种情况下，最好省略结束标签 `?>`：


    ```php

    echo ''Print this'' ;

    echo ''Print Last'' ;

    ```


    当 PHP 脚本仅意图向文档输出单个字符串时，你可以选择地使用短路输出标签 `<?=`：


    ```php

    <?= ''Hello!'' ?>

    ```


    等同于：


    ```php

    <?php echo ''Hello!'' ?>

    ```


    ### 语句规则


    PHP 语言中的每个语句必须以 `;` 字符结束——就像英语语言中的每个句子以句号结束一样。分号被解析器识别为它必须解释的单个指令的结束。因此，包含两个语句的
    PHP 代码可能如下：


    ```php

    <?php echo ''First statement'' ; echo ''Second statement'' ; ?>

    ```


    PHP 代码的结束标签 `?>` 自动隐含分号，因此你可以省略最后一个语句的分号：


    ```php

    <?php echo ''First statement'' ; echo ''Second statement'' ?>

    ```


    条件测试将在后面详细说明并演示。


    ### 注释规则


    在 PHP 脚本代码中添加注释通常是值得的，这样他人或自己在回顾代码时可以更容易理解。所有的空白和注释都被 PHP 解析器完全忽略，因此你可以任意添加注释，而对性能产生任何不利影响。


    单行注释可以以 `#` 字符开始，或者以 `//` 双斜杠序列开始。


    多行注释（块注释）必须包含在 `/*` 和 `*/` 字符序列之间，正如 C 编程语言中使用那样：


    ```php

    <?php

    echo ''First statement'' ; // 单行注释。


    /* 这是一个包含两行注释的多行注释。 */

    echo ''Second statement'' ;

    echo ''Final statement'' ; # 另一个单行注释。

    ?>

    ```


    ![image](img/Image00005.jpg)


    `//` 单行注释样式也用于 C++ 编程，而 `#` 单行注释样式也用于 Unix/Linux BASH 脚本脚本。


