- fmt: "\n*This chapter demonstrates how to create re-usable blocks of code in functions.*\n\
    \n## Defining functions\n\nPHP provides many built-in functions that can be called\
    \ by name in your scripts to execute pre-defined actions, such as the array sorting\
    \ functions described [here](#text00004.html_sec11) . Additionally, you may create\
    \ your own custom functions to execute specified actions when called. This usefully\
    \ allows PHP scripts to be modularized into sections of code that are easier to\
    \ understand and maintain.\n\n![image](Image00084.jpg)\n\nYour custom function\
    \ names may contain any combination of letters, numbers and the underscore character,\
    \ but must begin with a letter or an underscore. Understandably, to avoid conflict\
    \ the name may not duplicate an existing built-in function name, so for example\
    \ you may not create a custom function named “sort”.\n\nUnlike PHP variables,\
    \ function names are case-insensitive so `cube()`, `Cube()`, and `CUBE()` can\
    \ all reference the same function. Nonetheless,- it is recommended you always\
    \ use the same case as that used to name the function in the function definition.\n\
    \nA function definition is created in a PHP script simply by stating its name\
    \ after the `function` keyword, followed by parentheses and curly brackets (braces)\
    \ containing the statements to be executed each time that function gets called:\n\
    \n```php\nfunction function_name()\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n}\n```\n\n![image](Image00006.jpg)\n\nPHP\
    \ variable names are case-sensitive, but PHP function names are not.\n\nA PHP\
    \ script can then call upon a defined function by name using `function_name()`\
    \ to execute the statements it contains whenever required. Although the interpreter\
    \ runs the script from top to bottom, a function call can appear before the function\
    \ definition. This is not good programming practice, however, so you should define\
    \ functions before they are called.\n\nFunctions may contain any valid PHP script\
    \ code and may even contain a further function definition. In that case, the inner\
    \ function will not exist until the outer function has been called.\n\n![image](Image00029.jpg)\n\
    \nfunction.php\n\n![image](Image00085.jpg) Begin a PHP script with a statement\
    \ to define a function\n\n```php\n<?php\nfunction greet()\n{\n    echo ‘Hello\
    \ User!<br> ;\n}\n```\n\n![image](Image00086.jpg) Next, add a statement to call\
    \ the function defined in the previous step, to have it execute its statement\n\
    \n```php\ngreet() ;\n```\n\n![image](Image00087.jpg) Now, define another function\
    \ that contains an inner function definition and a further statement\n\n```php\n\
    function outer()\n{\n    function inner()\n    {\n        echo ‘Inner function\
    \ called.<br> ;\n    }\n    echo ‘Inner function created.<br> ;\n}\n```\n\n![image](Image00088.jpg)\
    \ Finally, add statements to call each of the functions defined in the previous\
    \ step\n\n```php\nouter() ;\ninner() ;\n?>\n```\n\n![image](Image00089.jpg) Save\
    \ the document in your web server’s `/htdocs` directory as `function.php` then\
    \ open the page via HTTP to see the output from each function call\n\n![image](Image00090.jpg)\n\
    \n![image](Image00005.jpg)\n\nRemove the call to the outer function to see an\
    \ undefined function error when the script attempts to call the inner function.\n\
    \n## Passing arguments\n\nData can be passed to functions as “arguments” in the\
    \ same way you can pass arguments to some built-in PHP functions. For example,\
    \ the `sort()` function takes the array to be sorted as its argument. Functions\
    \ can be created with any number of arguments but when called, data must be supplied\
    \ for each argument to avoid an error.\n\n![image](Image00006.jpg)\n\nParameters\
    \ must be specified in the function declaration as a comma-separated list, and\
    \ argument values passed by the caller as a comma-separated list.\n\nA function\
    \ accepting arguments is defined by including a comma-separated list of “parameters”\
    \ within the parentheses after the function name, like this:\n\n```php\nfunction\
    \ function_name($arg_1, $arg_2, $arg_3)\n{\n    statement-to-be-executed ;\n \
    \   statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\nParameter\
    \ names must adhere to the same naming conventions required for PHP variables\
    \ and should ideally be meaningful, to represent the nature of the data they will\
    \ be passed. The argument data must be passed by the call in the correct order\
    \ and can then be used by the statements within that function.\n\nOptionally,\
    \ the function definition can specify the type of data to be passed from the caller\
    \ by including a type description before the parameter name. Valid types include\
    \ `int`, `float`, `string`, `bool`, `callable` and `array`. When types are specified,\
    \ a call that attempts to pass incorrect data type will result in error.\n\n![image](Image00003.jpg)\n\
    \nIt is important to recognize that by default, argument data is passed “by value”.\
    \ This means that if a function call specifies a variable, only a copy of the\
    \ data within that variable gets passed to the function. Modifying the argument\
    \ will not affect the original data stored in the variable when it is passed by\
    \ value.\n\nIf you want a function to modify data stored in a variable, specified\
    \ in function call, you must pass it “by reference”. This allows the function\
    \ to operate directly on the original data. To ensure an argument is always passed\
    \ by reference, you need simply prefix an `&` before the parameter name in the\
    \ function definition.\n\n![image](Image00029.jpg)\n\narguments.php\n\n![image](Image00085.jpg)\
    \ Begin a PHP script with a statement to initialize two variables with the same\
    \ integer value\n\n```php\n<?php\n$a = $b = 5 ;\n```\n\n![image](Image00086.jpg)\
    \ Next, define a function that accepts two integer arguments – one by value and\
    \ the other by reference\n\n```php\nfunction modify(int $val, int &$ref)\n{\n\
    \    // Statements to be inserted here.\n}\n```\n\n![image](Image00087.jpg) Now,\
    \ insert statements to output the passed values, then increment those values and\
    \ display the modified values\n\n```php\necho “Passed values : $val , $ref <br>”\
    \ ;\n$val ++;\n$ref ++;\necho “Incremented values : $val , $ref <hr>” ;\n```\n\
    \n![image](Image00088.jpg) After the function block add a statement to call the\
    \ function, passing the variable values as arguments\n\n```php\nmodify($a, $b)\
    \ ;\n```\n\n![image](Image00089.jpg) Finally, add a statement to display the values\
    \ now stored in each variable\n\n```php\necho “Stored values : $a , $b ” ;\n?>\n\
    ```\n\n![image](Image00091.jpg)\n\n![image](Image00092.jpg)\n\n![image](Image00006.jpg)\n\
    \n## Varying parameters\n\nDefault argument values can optionally be specified\
    \ in a function definition by assignment to the parameter name, like this:\n\n\
    ```php\nfunction function_name($arg_1, $arg_2 = “Default String”)\n{\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n"
  raw: '*This chapter demonstrates how to create re-usable blocks of code in functions.*


    [**Defining functions**](#text00007.html_sec32)


    [**Passing arguments**](#text00007.html_sec33)


    [**Varying parameters**](#text00007.html_sec34)


    [**Recognizing scope**](#text00007.html_sec35)


    [**Returning values**](#text00007.html_sec36)


    [**Calling back**](#text00007.html_sec37)


    [**Summary**](#text00007.html_sec38)


    **Defining functions**


    PHP provides many built-in functions that can be called by name in your scripts
    to execute pre-defined actions, such as the array sorting functions described
    [here](#text00004.html_sec11) . Additionally, you may create your own custom functions
    to execute specified actions when called. This usefully allows PHP scripts to
    be modularized into sections of code that are easier to understand and maintain.


    ![image](Image00084.jpg)


    Your custom function names may contain any combination of letters, numbers and
    the underscore character, but must begin with a letter or an underscore. Understandably,
    to avoid conflict the name may not duplicate an existing built-in function name,
    so for example you may not create a custom function named “sort”.


    Unlike PHP variables, function names are case-insensitive so **cube()** , **Cube()**
    and **CUBE()** can all reference the same function. Nonetheless,- it is recommended
    you always use the same case as that used to name the function in the function
    definition.


    A function definition is created in a PHP script simply by stating its name after
    the **function** keyword, followed by parentheses and curly brackets (braces)
    containing the statements to be executed each time that function gets called:


    **function *function_name* ( )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**


    ![image](Image00006.jpg)


    PHP variable names are case-sensitive, but PHP function names are not.


    A PHP script can then call upon a defined function by name using ***function_name*
    ( );** to execute the statements it contains whenever required. Although the interpreter
    runs the script from top to bottom, a function call can appear before the function
    definition. This is not good programming practice, however, so you should define
    functions before they are called.


    Functions may contain any valid PHP script code and may even contain a further
    function definition. In that case, the inner function will not exist until the
    outer function has been called.


    ![image](Image00029.jpg)


    function.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to define a function


    **<?php**


    **function greet ()**


    **{**


    **echo ‘Hello User!<br>’ ;**


    **}**


    ![image](Image00086.jpg)  Next, add a statement to call the function defined in
    the previous step, to have it execute its statement


    **greet () ;**


    ![image](Image00087.jpg)  Now, define another function that contains an inner
    function definition and a further statement


    **function outer ()**


    **{**


    **function inner ()**


    **{**


    **echo ‘Inner function called.<br>’ ;**


    **}**


    **echo ‘Inner function created.<br>’ ;**


    **}**


    ![image](Image00088.jpg)  Finally, add statements to call each of the functions
    defined in the previous step


    **outer () ;**


    **inner () ;**


    **?>**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **function.php**  then open the page via HTTP to see the output from each
    function call


    ![image](Image00090.jpg)


    ![image](Image00005.jpg)


    Remove the call to the outer function to see an undefined function error when
    the script attempts to call the inner function.


    **Passing arguments**


    Data can be passed to functions as “arguments” in the same way you can pass arguments
    to some built-in PHP functions. For example, the **sort()** function takes the
    array to be sorted as its argument. Functions can be created with any number of
    arguments but when called, data must be supplied for each argument to avoid an
    error.


    ![image](Image00006.jpg)


    Parameters must be specified in the function declaration as a comma-separated
    list, and argument values passed by the caller as a comma-separated list.


    A function accepting arguments is defined by including a comma-separated list
    of “parameters” within the parentheses after the function name, like this:


    **function *function_name* ( $*arg_1* , $*arg_2* , $*arg_3* )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**


    Parameter names must adhere to the same naming conventions required for PHP variables
    and should ideally be meaningful, to represent the nature of the data they will
    be passed. The argument data must be passed by the call in the correct order and
    can then be used by the statements within that function.


    Optionally, the function definition can specify the type of data to be passed
    from the caller by including a type description before the parameter name. Valid
    type descriptions include **int** , **float** , **string** , **bool** , **callable**
    and **array** . When types are specified, a call that attempts to pass an incorrect
    data type to the function will result in an error.


    ![image](Image00003.jpg)


    The ability to specify argument data types is a new feature in PHP 7.


    It is important to recognize that by default, argument data is passed “by value”.
    This means that if a function call specifies a variable name, only a copy of the
    data within that variable gets passed to the function. Modifying the argument
    will not affect the original data stored in the variable when it is passed by
    value.


    If you want a function to modify data stored in a variable, specified in a function
    call, you must pass it “by reference”. This allows the function to operate directly
    on the original data. Modifying the argument will affect the original data in
    the variable when it is passed by reference. To ensure that an argument is always
    passed to a function by reference, you need simply prefix an **&** ampersand before
    the parameter name in the function definition.


    ![image](Image00029.jpg)


    arguments.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to initialize two
    variables with the same integer value


    **<?php**


    **$a = $b = 5 ;**


    ![image](Image00086.jpg)  Next, define a function that accepts two integer arguments
    – one by value and the other by reference


    **function modify ( int $val , int & $ref )**


    **{**


    **// Statements to be inserted here.**


    **}**


    ![image](Image00087.jpg)  Now, insert statements to output the passed values,
    then increment those values and display the modified values


    **echo “Passed values : $val , $ref <br>” ;**


    **$val ++ ;**


    **$ref ++ ;**


    **echo “Incremented values : $val , $ref <hr>” ;**


    ![image](Image00088.jpg)  After the function block add a statement to call the
    function, passing the variable values as arguments


    **modify ( $a , $b ) ;**


    ![image](Image00089.jpg)  Finally, add a statement to display the values now stored
    in each variable


    **echo “Stored values : $a , $b ” ;**


    **?>**


    ![image](Image00091.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **arguments.php**  then open the page via HTTP to see the argument and variable
    values


    ![image](Image00092.jpg)


    ![image](Image00006.jpg)


    The **int** type description in this example specifies that only integer data
    values can be passed as arguments to the function.


    **Varying parameters**


    Default argument values can optionally be specified in a function definition by
    assignment to the parameter name, like this:


    **function *function_name* ( $*arg_1* , $*arg_2* = “Default String” )**


    **{**


    ***statement-to-be-executed ;


    statement-to-be-executed ;


    statement-to-be-executed ;***


    **}**'
