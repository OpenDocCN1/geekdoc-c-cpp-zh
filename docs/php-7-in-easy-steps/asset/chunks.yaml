    as  **substring.php**  then open the page via HTTP to see the extracted substrings
    and modified string


    ![image](Image00105.jpg)


    ![image](Image00006.jpg)


    The length argument in **substr_replace()** specifies the length of the substring
    to be replaced. In this example, it is **3** – to replace the three characters
    ‘SQL’ with a longer string.


    **Changing case**


    PHP provides functions to easily modify the character case of a specified string
    argument. The **strtolower()** function changes all characters to lowercase and
    **strtoupper()** changes them all to uppercase. Additionally, the **ucfirst()**
    function makes only the first string character uppercase, whereas the **ucword()**
    function makes the first character of every word in the string into uppercase:


    ![image](Image00029.jpg)


    case.php


    ![image](Image00098.jpg)  Begin a PHP script with statements to initialize a variable
    with a string and display its value


    **<?php**


    **$str = “C++ Programming in easy steps” ;**


    **echo “Original String : ‘ $str ’ <hr>” ;**


    ![image](Image00099.jpg)  Next, add statements to display a lowercase version


    **$ver = strtolower( $str ) ;**


    **echo “Lowercase String : ‘ $ver ’ <br>” ;**


    ![image](Image00100.jpg)  Now, add statements to display an uppercase version


    **$ver = strtoupper( $str ) ;**


    **echo “Uppercase String : ‘ $ver ’ <hr>” ;**


    ![image](Image00101.jpg)  Finally, add statements to display a capitalized string
    version and a capitalized words version


    **$ver = ucfirst( strtolower( $str ) ) ;**


    **echo “Uppercase First String Character : ‘ $ver ’ <br>” ;**


    **echo ‘Uppercase First Word Character : ‘ .ucwords( $ver ) ;**


    **?>**


    ![image](Image00102.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **case.php**  then open the page via HTTP to see the changed case versions
    of the original string


    ![image](Image00106.jpg)


    ![image](Image00019.jpg)


    The **ucfirst()** function only changes the first character of a string. Other
    uppercase characters will remain unless first changed to lowercase with the **strtolower()**
    function, as seen here.


    **Formatting strings**


    PHP provides a number of built-in functions to conveniently format strings by
    manipulating their characters. The simple **strrev()** function accepts a single
    string argument and returns that string in reversed character order, so it reads
    back to front.


    The **strrpt()** function accepts two arguments to specify a string, and an integer
    of how many total times that string should be repeated in the string it will return.


    The **strpad()** function accepts three arguments to specify a string, a total
    length of the character string it will return, and a character or substring pattern
    with which to fill the difference between the original string and the specified
    returned string length. The padding will, by default, be added to the end of the
    original string but can be added to its start by adding a fourth argument using
    a special **STR_PAD_LEFT** flag.


    The **trim()** function can accept a single string argument and will return a
    string in which all white-space characters (spaces, line returns, tabs) have been
    removed from the start and end of the original string. Optionally, a second argument
    can specify a character or pattern to be removed from the start and end of the
    original string, in place of the white-space default.


    Similarly, where you only want to remove characters from the start of the original
    string, you can use the companion **ltrim()** function, or where you only want
    to remove characters from the end of the original string, you can use the companion
    **rtrim()** function.


    ![image](Image00005.jpg)


    The PHP **implode()** and **explode()** functions can be used to convert arrays
    to strings, and strings to arrays – see [here](#text00004.html_sec11) for more
    details.


    A string can be split into individual parts using the **strtok()** function to
    specify the string and a delimiter token around which the parts should be split.
    For example, if you want to split a string into individual words you can specify
    the space character as the delimiter token. The first part of the string, up to
    the delimiter token will be returned by the function. Interestingly, the **strtok()**
    function remembers its position in the string, so subsequent calls need only specify
    the delimiter token to return the next part of the string, until no further delimiters
    are found. Splitting a string in this way can best be achieved using a loop to
    make subsequent calls to the **strtok()** function, until it reaches the end of
    the string.


    ![image](Image00029.jpg)


    format.php


    ![image](Image00098.jpg)  Begin a PHP script with statements to initialize a variable
    with a string and display its value


    **<?php**


    **$str = ‘| PHP String Fun |’ ; echo “Original String : $str ” ;**


    ![image](Image00099.jpg)  Next, add statements to display reversed, repeated and
    trimmed versions of the original string


    **echo ‘<hr>Reversed String : ‘ .strrev( $str ) ;**


    **echo ‘<hr>Repeated String : ’ .str_repeat( $str , 3 ) ;**


    **echo ‘<hr>Trimmed String : ‘ .trim( $str , ‘|’ ) ;**


    ![image](Image00100.jpg)  Now, add a statements to display a 30-character version
    of the string, padded with asterisks at the beginning


    **$pad = str_pad( $str , 30 , ‘*’ , STR_PAD_LEFT ) ;**


    **echo “<hr>Padded String : $pad ” ;**


    ![image](Image00101.jpg)  Finally, add statements to split the string around spaces
    and display each individual part separated by an ... ellipsis


    **echo ‘<hr>Split String : ‘ ;**


    **$token = strtok( $str , ‘ ‘ );**


    **while ( $token )**


    **{**


    **echo “ $token ... “ ; $token = strtok( ‘ ‘ ) ;**


    **}**


    **?>**


    ![image](Image00102.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **format.php**  then open the page via HTTP to see the string formatted in
    several ways


    ![image](Image00107.jpg)


    ![image](Image00006.jpg)


    You must specify the delimiter on each subsequent call to **strtok()** to have
    it continue forward to the next part of the string.


    **Making dates**


    The PHP **date()** function will return a date string when called, but requires
    a string argument to specify a format for the date string. This format string
    can comprise a series of letter options for date and time. For example, **date(
    ‘n/j/y’ )** might return “4/22/16”. Popular options are listed below along with
    a brief description:


    | **Option:** | **Description:** | **Example:** |


    | **Y** | Year as four digits | 2014 |


    | **y** | Year as two digits | 14 |


    | **n** | Month as one or two digits | 7 |


    | **m** | Month as two digits | 07 |'
