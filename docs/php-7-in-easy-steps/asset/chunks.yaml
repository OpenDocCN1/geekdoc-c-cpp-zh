    * `http://localhost` URL 是 `http://127.0.0.1` 数字 IP 地址的别名。

    * 访问 Abyss Web Server 控制台需要您的用户名和密码，地址位于 `http://localhost:9999`。

    * 建议使用 Abyss Web Server 的预配置软件包，以便简单、快速地安装 PHP 引擎。

