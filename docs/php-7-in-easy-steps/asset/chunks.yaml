    可以通过将字符串以及子字符串在字符串中的索引位置作为 `substr()` 函数的参数，从字符串中提取子字符串。可选的第三参数参数指定子字符串的长度。你可以使用
    `substr_replace()` 函数替换子字符串，通过指定字符串、子字符串、索引位置和长度参数。可以使用 `substr_count()` 函数找到子字符串在字符串中出现的次数：


    ![image](img/Image00029.jpg)


    substring.php


    ![image](img/Image00098.jpg)  开始一个 PHP 脚本，使用语句初始化一个带有字符串值的变量并统计子字符串


