    \ }\n}\n```\n(Wait, the source text has an extra closing brace, I will clean it\
    \ up).\n\n### Filtering data\n\nTo validate input easily, PHP provides a `filter_var()`\
    \ function that can be used to both validate and “sanitize” input. This function\
    \ requires two arguments to specify the variable to be filtered and a constant\
    \ name of the filter to be used:\n\n| **Filter Constant:** | **Convention:** |\n\
    | :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN` | Boolean value |\n| `FILTER_VALIDATE_EMAIL`\
    \ | Email address format |\n| `FILTER_VALIDATE_FLOAT` | Floating-point number\
    \ |\n| `FILTER_VALIDATE_INT` | Integer number |\n| `FILTER_VALIDATE_IP` | IP address\
    \ format |\n| `FILTER_VALIDATE_MAC` | MAC address format |\n| `FILTER_VALIDATE_REGEXP`\
    \ | Regular expression format |\n| `FILTER_VALIDATE_URL` | URL format |\n| `FILTER_SANITIZE_EMAIL`\
    \ | Strip invalid characters |\n| `FILTER_SANITIZE_ENCODED` | URL-encode string\
    \ |\n| `FILTER_SANITIZE_MAGIC_QUOTES` | Backslash-escape characters |\n| `FILTER_SANITIZE_NUMBER_FLOAT`\
    \ | Strip all non-digits |\n| `FILTER_SANITIZE_NUMBER_INT` | Strip all non-digits\
    \ |\n| `FILTER_SANITIZE_SPECIAL_CHARS` | HTML-escape `”>&` |\n| `FILTER_SANITIZE_STRING`\
    \ | Strip HTML tags |\n| `FILTER_SANITIZE_URL` | Strip invalid characters |\n\
    | `FILTER_CALLBACK` | Call a custom filter function |\n\nThe validation filters\
    \ return `TRUE` when validation succeeds, otherwise they will return `FALSE`.\n\
    \nSome filters allow further options to be specified. For example, a numeric range\
    \ can be specified to `FILTER_VALIDATE_INT`.\n[/content] (Wait, I am repeating\
