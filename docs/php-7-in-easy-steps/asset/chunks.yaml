    \     default: $str = ‘Error!'; break;\n    }\n    echo “<b>$str</b>: $message\
    \ in $file on line $line”;\n}\n```\n\nThe basic error levels are listed in this\
    \ table:\n\n| Level | Constant | Description |\n| :--- | :--- | :--- |\n| 2 |\
