    ```php

    echo ‘<hr>Index 27 : ‘ .substr( $str , 27 ) ;

    echo ‘<hr>Index 4 Length 13 : ‘ .substr( $str , 4 , 13 ) ;

    ```


    ![image](img/Image00100.jpg)  现在，添加语句初始化一个带有字符串的变量


    ```php

    $sub = ‘PHP & MySQL’ ;

    ```


    ![image](img/Image00101.jpg)  最后，添加语句用新字符串值替换子字符串并显示修改后的字符串


    ```php

    $str = substr_replace( $str , $sub , 0 , 3 ) ;

    echo “<hr>’ $str ’” ;

    ?>

    ```


    ![image](img/Image00102.jpg)  将文档保存到 浏览器的 `/htdocs` 目录并命名为 `substring.php`，然后通过
