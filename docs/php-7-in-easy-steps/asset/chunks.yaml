  trans: "\n\n# 附加文本 (#text00010.html_sec58)\n\n# 处理错误 (#text00010.html_sec59)\n\n\
    # 捕获异常 (#text00010.html_sec60)\n\n# 总结 (#text00010.html_sec61)\n\n## 读取文件\n\n\
    读写位于 Web 服务器上的文件对于记录信息和提供页面内容非常有用。为了处理文件，必须首先使用 PHP 的 `fopen()` 函数创建一个“文件流”（filestream）对象。这需要两个参数：指定文件的名称或路径，以及文件“模式”。文件模式决定了要执行的操作性质，并将文件指针放置在文件内合适的位置：\n\
    \n| **文件模式：** | **操作：** |\n| :--- | :--- |\n| r | 打开现有文件进行读取。文件指针从文件开头开始 |\n|\
    \ w | 放弃现有文件的所有内容，如果不存在则创建一个新文件。文件指针从文件开头开始 |\n| a | 打开现有文件并保留所有内容。文件指针从文件末尾开始\
    \ |\n| r+ | 打开文件进行读或写。文件指针从文件开头开始 |\n| w+ | 打开文件进行写或读。放弃现有文件的所有内容，如果不存在则创建一个新文件。文件指针从文件开头开始\
    \ |\n| a+ | 打开文件进行读或写并保留所有内容。文件指针从文件末尾开始 |\n\n![image](img/Image00019.jpg)\n\n\
    当文件模式指定符作为 `fopen()` 函数的参数提供时，必须出现在引号内。\n\n一种良好的做法是始终使用 `die()` 函数提供一个备选方案，以防创建文件流失败。\n\
    \n![image](img/Image00005.jpg)\n\n作为 `die()` 函数的参数指定一条说明性消息。\n\n当文件流被成功创建后，可以通过指定文件流和字节大小作为\
    \ `fread()` 函数的参数来读取文件。如果需要读取整个文件，使用 `filesize()` 函数来指定要读取的文件字节大小会非常方便。\n\n在完成任何文件操作后，必须通过将文件流作为\
    \ `fclose()` 函数的参数来销毁它。\n\n![image](img/Image00138.jpg)\n\n![image](img/Image00029.jpg)\n\
    \nread.php\n\n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\
    \n```php\n<?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable\
    \ to open file!’ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一条语句在成功后读取文本文件并显示其全部内容\n\
    \n```php\necho fread( $filestream , filesize( ‘manifesto.txt’ ) ) ;\n```\n\n![image](img/Image00012.jpg)\
    \ 现在，记得关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `read.php`，并与要读取的文本文件放在一起，然后通过 HTTP 打开页面，在浏览器窗口中显示文本文件内容\n\
    \n![image](img/Image00139.jpg)\n\n![image](img/Image00006.jpg)\n\n与 HTML 文档中的\
    \ PHP 块不同，纯 PHP 脚本不需要闭合标签 `?>`。\n\n![image](img/Image00006.jpg)\n\n注意这里的输出没有保持行结束符——但上方的示例保留了。\n\
    \n## 读取行\n\n一旦创建了“文件流”对象，就可以通过将文件流作为 PHP `fgets()` 函数的参数来逐行读取其内容。若要读取每一行，可以在循环中反复调用此函数。`feof()`\
    \ 函数可以判断何时到达文件末尾并结束循环：\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n`feof()` 函数在到达文件末尾时返回 `true`。\n\n![image](img/Image00029.jpg)\n\nreadlines.php\n\
    \n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\n```php\n\
    <?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐行读取文本文件并显示其全部内容\n\n\
    ```php\nwhile( !feof( $filestream ) )\n{ echo fgets( $filestream ). ’<br>’ ; }\n\
    ```\n\n![image](img/Image00012.jpg) 现在，记得关闭文件流\n\n```php\nfclose( $filestream\
    \ ) ;\n```\n\n![image](img/Image00014.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `readlines.php`，并与要读取的文本文件放在一起，然后通过\
    \ HTTP 打开页面查看文本文件\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n## 读取字符\n\n一旦创建了“文件流”对象，就可以通过将文件流作为 `fgets()` 函数的参数来逐行读取其内容。若要读取每一行，可以在循环中反复调用此函数。`feof()`\
    \ 函数可以判断何时到达文件末尾并结束循环：\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n`feof()` 函数在到达文件末尾时返回 `true`。\n\n![image](img/Image00029.jpg)\n\nreadchars.php\n\
    \n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\n```php\n\
    <?php\n$filestream = fopen( ‘title.txt’ , ‘r’ )\nor die( ‘Unable to open file!’\
    \ )\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐字符读取文本文件并显示其全部内容\n\n```php\n\
    while( $char = getc( $filestream ) )\n{ echo $char; }\n```\n\n![image](img/Image00012.jpg)\
    \ 现在，记得关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
    \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `readchars.php`，并与要读取的文本文件放在一起，然后通过 HTTP 打开页面查看文本\n\
    \n## 写入文件\n\n一旦以写入模式创建了“文件流”对象，就可以创建一个文本文件。可以通过指定文件流和文件名到 PHP `fwrite()` 函数写入文本。为了格式化文本，还可以写入不可打印字符来创建换行和制表：\n\
    \n| **字符：** | **描述：** |\n| :--- | :--- |\n| \\n | 换行移动到下一行 |\n| \\r | 回车回到行首 |\n\
    | \\t | 制表移动到下一个制表位 |\n\n![image](img/Image00019.jpg)\n\n包含不可打印字符的字符串必须封装在双引号内，以便\
    \ PHP 解释它们。\n\n![image](img/Image00029.jpg)\n\nwrite.php\n\n![image](img/Image00008.jpg)\
    \ 开始一个 PHP 脚本，其语句分配包含格式化不可打印字符的文本\n\n```php\n<?php\n$poem = “\\r\\n\\tI never\
    \ saw a man who looked” ;\n$poem .= “\\r\\n\\tWith such a wistful eye” ;\n$poem\
    \ .= “\\r\\n\\tUpon that little tent of blue” ;\n$poem .= “\\r\\n\\tWhich prisoners\
    \ call the sky” ;\n```\n\n![image](img/Image00010.jpg) 接下来，为要写入的文件分配名称\n\n```php\n\
    $filename = ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg) 尝试创建一个写入的文本文件，或在失败时退出脚本\n\
    \n```php\n$filestream = fopen( $filename , ‘w’ )\nor die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](img/Image00014.jpg) 写入文件并显示总共写入多少字节的确认\n\n```php\n$num\
    \ = fwrite( $filestream , $poem ) ;\nif( $num )\n{\n  echo “ $num bytes written\
    \ to $filename ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流\n\n```php\n\
    fclose( $filestream ) ;\n```\n\n"
- fmt: "\n![image](Image00017.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `write.php` then open the page via HTTP to see confirmation that\
    \ the text file has been written.\n\n![image](Image00144.jpg)\n\n![image](Image00026.jpg)\
    \ Use File Explorer to navigate to your web server’s `/htdocs` directory and see\
    \ the file created by the PHP script.\n\n![image](Image00145.jpg)\n\n![image](Image00027.jpg)\
    \ Open the file to see the text written by the PHP script.\n\n![image](Image00146.jpg)\n\
    \n![image](Image00005.jpg)\n\nYou can run this example repeatedly and each time\
    \ it will erase the content then write it again.\n\n## Appending text\n\nOnce\
    \ a “filestream” object has been created specifying an append mode, a text file\
    \ can be opened to add text at its end. Text can be appended to the file by specifying\
    \ the filestream and a file name to the PHP `fwrite()` function. The process is\
    \ identical to writing a file, except that the file pointer is positioned at the\
    \ end of existing content before the text is written into the file:\n\n![image](Image00029.jpg)\n\
    \nappend.php\n\n![image](Image00008.jpg) Begin a PHP script with a statement to\
    \ assign text, including non-printing characters for formatting.\n\n```php\n<?php\n\
    $info = \"\\r\\n\\r\\n\\tThe Ballad of Reading Gaol” ;\n$info .= “r\\n\\t\\t\\\
    tOscar Wilde 1898” ;\n```\n\n![image](Image00010.jpg) Next, assign a name for\
    \ the file to be written into.\n\n```php\n$filename = ‘poem.txt’ ;\n```\n\n![image](Image00012.jpg)\
    \ Attempt to open the plain text file for appending, or exit the script upon failure.\n\
    \n```php\n$filestream = fopen( $filename , ‘a’ ) or die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](Image00014.jpg) Write the text and display a confirmation\
    \ of how many bytes have been appended in total.\n\n```php\n$num = fwrite( $filestream\
    \ , $info ) ;\nif( $num )\n{\n    echo “ $num bytes appended to $filename ” ;\n\
    }\n```\n\n![image](Image00015.jpg) Now, remember to close the file stream.\n\n\
    ```php\nfclose( $filestream ) ;\n```\n\n![image](Image00017.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `append.php` then open the page\
    \ via HTTP to see confirmation that the text has been appended to the file.\n\n\
    ![image](Image00147.jpg)\n\n![image](Image00006.jpg)\n\nRemember that non-printing\
    \ characters must be enclosed in double quotes for interpretation.\n\n![image](Image00026.jpg)\
    \ Navigate to your web server’s `/htdocs` directory and open the file to see the\
    \ text appended by the PHP script.\n\n![image](Image00148.jpg)\n\n## Overwriting\
    \ text\n\nIt is important to recognize that when you write to an existing file\
    \ in write mode it will overwrite any existing content:\n\n![image](Image00029.jpg)\n\
    \noverwrite.php\n\n![image](Image00008.jpg) Begin a PHP script by attempting to\
    \ open an existing text file for writing, or exit the script upon failure.\n\n\
    ```php\n<?php\n$filestream = fopen( ‘poem.txt’ , ‘w’ ) or die( ‘Unable to open\
    \ file!’ ) ;\n```\n\n![image](Image00010.jpg) Upon success, write new text into\
    \ the file.\n\n```php\nfwrite( $filestream , ‘Overwritten!’ ) ;\n```\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream.\n\n```php\nfclose( $filestream ) ;\n\
    ```\n\n![image](Image00014.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `overwrite.php` then open the page via HTTP and reopen the text\
    \ file to see its contents overwritten.\n\n![image](Image00149.jpg)\n\n![image](Image00019.jpg)\
    \ Be careful when writing to files as it is easy to accidentally overwrite.\n\n\
    ## Handling errors\n\nYou can anticipate possible errors and terminate a running\
    \ script when they occur using the `die()` function or the `exit()` function.\
    \ Without this contingency the default PHP error handler provides a useful, but\
    \ unsightly message when an error occurs. For example, `fopen( ‘nonsuch.txt’ ,\
    \ ‘r’ )` to open a non-existing file:\n\n![image](Image00150.jpg)\n\n![image](Image00005.jpg)\n\
    \nThe `die()` and `exit()` functions perform identical operations in PHP, but\
    \ their terminology can have different appeals. For some, `die()` possibly seems\
    \ more appropriate to quit when an error is detected, and `exit()` may seem more\
    \ suitable to quit in other scenarios.\n\nIt is not always desirable to terminate\
