- fmt: "\nStoring passwords in cookies is not the most secure method but is used here\
    \ merely to demonstrate how to use cookies to store data.\n\n### Setting cookies\n\
    \nUpon receiving a form submission, a PHP script can check for the presence of\
    \ fields and might perform validation of their associated values. For example,\
    \ the `ctype_alnum()` function could be used to simply confirm that the values\
    \ only contain alphanumeric data.\n\nOnce validated, the `setcookie()` function\
    \ can store the submitted fields’ names and values. Additionally a hash conversion\
    \ could be made of password values using the `md5()` function. On successful completion,\
    \ the script can then relocate the browser to another page using the `header()`\
    \ function to specify that page’s URL:\n\n![image](Image00029.jpg)\n\ncookie_set.php\n\
    \n![image](Image00054.jpg)  Begin a PHP script with a function to handle failed\
    \ validation attempts\n\n```php\n<?php\n\nfunction reject ( $entry )\n{\n\techo\
    \ “Invalid $entry <br>” ;\n\techo ‘Please <a href=” cookie_form.html ”>Log In</a>’\
    \ ;\n\texit() ;\n}\n```\n\n![image](Image00055.jpg)  Next, add a conditional test\
    \ block to set two cookies for valid data, or call the function to handle failed\
    \ attempts\n\n```php\nif( isset( $_POST[ ‘user’ ] ) )\n{\n\t$user = trim( $_POST[\
    \ ‘user’ ] ) ;\n\tif( !ctype_alnum( $user ) ) { reject( ‘User Name’ ) ; }\n\t\
    if( isset( $_POST[ ‘pass’ ] ) )\n\t{\n\t\t$pass = trim( $_POST[ ‘pass’ ] ) ;\n\
    \t\tif( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }\n\t\telse\n\t\t{\n\t\
    \t\tsetcookie( ‘user’ , $user , time()+ 3600 ) ;\n\t\t\tsetcookie( ‘pass’ , md5(\
    \ $pass ) , time()+ 3600 ) ;\n\t\t\theader( ‘Location: cookie_get.php ’ ) ;\n\t\
    \t}\n\t}\n}\nelse { header( ‘Location: cookie_form.html ’ ) ; }\n?>\n```\n\n![image](Image00056.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `cookie_set.php`\
    \ then see overleaf how to retrieve the stored cookie data\n\n![image](Image00006.jpg)\n\
    \nThe `ctype_alnum()` function returns true only if its argument contains alphanumeric\
    \ characters.\n\n![image](Image00005.jpg)\n\nNotice how the `time()` function\
    \ is used here to get the current time, then one hour is added (in seconds) to\
    \ set the cookie expiration time one hour ahead.\n\n![image](Image00005.jpg)\n\
    \nThe final `else` statement will relocate to the HTML form page if the script\
    \ URL is opened directly.\n\n### Getting cookies\n\nOnce cookies are set, they\
    \ are automatically assigned to the special PHP `$_COOKIE` global array variable.\
    \ A script can check for the presence of an individual cookie using the built-in\
    \ PHP `isset()` function to seek a cookie of a specified name. When this confirms\
    \ the cookie is indeed present, its value can usefully assigned to a regular script\
    \ variable. This might be used to retrieve a stored username for output on a page.\
    \ Where a sought cookie is absent, the script can offer an alternative to the\
    \ user:\n\n![image](Image00029.jpg)\n\ncookie_get.php\n\n![image](Image00054.jpg)\
    \  Begin a PHP script with a test to find a cookie and retrieve data for output\
    \ upon success\n\n```php\n<?php\n\nif( isset( $_COOKIE[ ‘user’ ] ) )\n{\n\t$user\
    \ = $_COOKIE[ ‘user’ ] ;\n\techo “<h1>Welcome $user !</h1><hr>” ;\n\techo ‘<a\
    \ href=” cookie_data.php ”>View Cookie</a>’ ;\n}\n```\n\n![image](Image00055.jpg)\
    \  Next, add alternative output for when the cookie is absent\n\n```php\nelse\n\
    {\n\techo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;\n}\n?>\n```\n\n![image](Image00056.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `cookie_get.php`\n\
    \n![image](Image00057.jpg)  Now open the HTML form `cookie_form.html` (created\
    \ [here](#text00012.html_cookie) ) via HTTP and push the submit button to see\
    \ the login attempt fail validation, so no cookies are set\n\n![image](Image00180.jpg)\n\
    \n![image](Image00058.jpg)  Click the hyperlink to return to the HTML form and\
    \ enter a valid username, then push the submit button to see the login attempt\
    \ fail validation again\n\n![image](Image00181.jpg)\n\nReturn to the HTML form\
    \ once more and enter a valid username and password to see validation succeed\n\
    \n![image](Image00182.jpg)\n\n![image](Image00183.jpg)\n\n![image](Image00184.jpg)\n\
    \n![image](Image00061.jpg)  Return to the HTML form once more and enter a valid\
    \ username and password to see validation succeed\n\n![image](Image00182.jpg)\n\
    \n`cookie_data.php` (see below)\n\n### Viewing cookie data\n\nThe special PHP\
    \ `$_COOKIE` global array stores keys and values. Cookie data can be viewed by\
    \ looping through the array using `var_dump()`:\n\n```php\n<?php\n\nif( count(\
    \ $_COOKIE ) > 0 )\n{\n\tforeach( $_COOKIE as $key => $value )\n\t{\n\t\techo\
    \ “<dt>$key</ ;\n\t\techo “<dd>$value</ ;\n\t}\n\techo “</dl><hr>”;\n\tvar_dump(\
    \ $_COOKIE ) ;\n}\n?>\n```\n\nThe PHP manual describes the removal of a cookie\
    \ by setting its value to empty and its expiration date to the past. For example,\
    \ `setcookie($_COOKIE['user'], '', time()-3600)`. Additionally, the `unset()`\
    \ function can be used to destroy a specified variable.\n\n### Submitting session\
    \ data\n\nUser data can be stored in cookies on the client only if the user chooses\
    \ to allow cookies onto their system. Many users prefer to disallow cookies, however,\
    \ to avoid tracking – but PHP provides a better alternative. With PHP, user data\
    \ can be stored on the server using the special `$_SESSION` global array variable.\
    \ In order for PHP sessions to work, each PHP page must call the built-in `session_start()`\
    \ function at the top of the page – before any HTML tags! HTML form submissions\
    \ to the server via the **POST** method assigns field data to the special PHP\
    \ `$_POST` global array variable, and individual submission fields can be sought\
    \ using the built-in PHP `isset()` function. When this confirms the field is present,\
    \ its name and value can be stored in a session variable. This might be used to\
    \ store a username and password details for use across a website, as an alternative\
    \ to cookie storage:\n\n![image](Image00174.jpg)\n\nsession_form.html\n\n![image](Image00054.jpg)\
    \  Create an HTML document and add this form to its body section, specifying submission\
    \ method and the name of a PHP submission-handler script\n"
  raw: 'Storing passwords in cookies is not the most secure method but is used here
    merely to demonstrate how to use cookies to store data.


    **Setting cookies**


    Upon receiving a form submission, a PHP script can check for the presence of fields
    and might perform validation of their associated values. For example, the **ctype_alnum()**
    function could be used to simply confirm that the values only contain alphanumeric
    data.


    Once validated, the **setcookie()** function can store the submitted fields’ names
    and values. Additionally a hash conversion could be made of password values using
    the **md5()** function. On successful completion, the script can then relocate
    the browser to another page using the **header()** function to specify that page’s
    URL:


    ![image](Image00029.jpg)


    cookie_set.php


    ![image](Image00054.jpg)  Begin a PHP script with a function to handle failed
    validation attempts


    **<?php**


    **function reject ( $entry )**


    **{**


    **echo “Invalid $entry <br>” ;**


    **echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;**


    **exit() ;**


    **}**


    ![image](Image00055.jpg)  Next, add a conditional test block to set two cookies
    for valid data, or call the function to handle failed attempts


    **if( isset( $_POST[ ‘user’ ] ) )**


    **{**


    **$user = trim( $_POST[ ‘user’ ] ) ;**


    **if( !ctype_alnum( $user ) ) { reject( ‘User Name’ ) ; }**


    **if( isset( $_POST[ ‘pass’ ] ) )**


    **{**


    **$pass = trim( $_POST[ ‘pass’ ] ) ;**


    **if( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }**


    **else**


    **{**


    **setcookie( ‘user’ , $user , time()+ 3600 ) ;


    setcookie( ‘pass’ , md5( $pass ) , time()+ 3600 ) ;


    header( ‘Location: cookie_get.php ’ ) ;**


    **}**


    **}**


    **}**


    **else { header( ‘Location: cookie_form.html ’ ) ; }**


    **?>**


    ![image](Image00056.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **cookie_set.php**  then see overleaf how to retrieve the stored cookie data


    ![image](Image00006.jpg)


    The **ctype_alnum()** function returns true only if its argument contains alphanumeric
    characters.


    ![image](Image00005.jpg)


    Notice how the **time()** function is used here to get the current time, then
    one hour is added (in seconds) to set the cookie expiration time one hour ahead.


    ![image](Image00005.jpg)


    The final **else** statement will relocate to the HTML form page if the script
    URL is opened directly.


    **Getting cookies**


    Once cookies are set, they are automatically assigned to the special PHP **$_COOKIE**
    global array variable. A script can check for the presence of an individual cookie
    using the built-in PHP **isset()** function to seek a cookie of a specified name.
    When this confirms the cookie is indeed present, its value can usefully be assigned
    to a regular script variable. This might be used to retrieve a stored username
    for output on a page. Where a sought cookie is absent, the script can offer an
    alternative to the user:


    ![image](Image00029.jpg)


    cookie_get.php


    ![image](Image00054.jpg)  Begin a PHP script with a test to find a cookie and
    retrieve data for output upon success


    **<?php**


    **if( isset( $_COOKIE[ ‘user’ ] ) )**


    **{**


    **$user = $_COOKIE[ ‘user’ ] ;**


    **echo “<h1>Welcome $user !</h1><hr>” ;**


    **echo ‘<a href=” cookie_data.php ”>View Cookie</a>’ ;**


    **}**


    ![image](Image00055.jpg)  Next, add alternative output for when the cookie is
    absent


    **e** l**se**


    **{**


    **echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;**


    **}**


    **?>**


    ![image](Image00056.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **cookie_get.php**


    ![image](Image00057.jpg)  Now open the HTML form  **cookie_form.html**  (created
    [here](#text00012.html_cookie) ) via HTTP and push the submit button to see the
    login attempt fail validation, so no cookies are set


    ![image](Image00180.jpg)


    ![image](Image00058.jpg)  Click the hyperlink to return to the HTML form and enter
    a valid username, then push the submit button to see the login attempt fail validation
    again


    ![image](Image00181.jpg)


    ![image](Image00061.jpg)  Return to the HTML form once more and enter a valid
    username and password to see validation succeed


    ![image](Image00182.jpg)


    ![image](Image00183.jpg)


    ![image](Image00184.jpg)  See overleaf how to view data stored within cookies,
    using the  **cookie_data.php**  target of the hyperlink seen above


    ![image](Image00006.jpg)


    You can also return to the HTML form and enter a username or a password that includes
    non-alphanumeric characters, to see validation fail again.


    ![image](Image00005.jpg)


    Validation could be extended. For example, it may also allow underscore characters
    and might specify a minimum permissible password length.


    **Viewing cookie data**


    The special PHP **$_COOKIE** global array variable stores cookie names and values
    in an associative array of keys and values. Stored content can be viewed by looping
    through the array to see all names and values, or using the PHP **var_dump()**
    function:


    ![image](Image00029.jpg)


    cookie_data.php


    ![image](Image00054.jpg)  Begin a PHP script with a test to find if any cookies
    are set and retrieve all stored names and values upon success


    **<?php**


    **if( count( $_COOKIE ) > 0 )**


    **{**


    **echo ‘<dl> ‘ ;**


    **foreach( $_COOKIE as $key => $value )**


    **{**


    **echo “<dt>Key: $key ” ;**


    **echo “<dd>Value: $value ” ;**


    **}**


    **echo ‘</dl><hr>’ ;**


    **var_dump( $_COOKIE ) ;**


    **}**


    ![image](Image00055.jpg)  Next, add alternative output for when cookies are absent


    **e** l**se**


    **{**


    **echo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;**


    **}**


    **?>**


    ![image](Image00056.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **cookie_data.php**


    ![image](Image00057.jpg)  Now, open the HTML form  **cookie_form.html**  ([here](#text00012.html_cookie)
    ) via HTTP and enter valid login data, then follow the link on  **cookie_get.php**  ([here](#text00012.html_cookiep)
    ) to see cookie data


    ![image](Image00185.jpg)


    ![image](Image00005.jpg)


    You can call the **setcookie( )** function at any time to create a new cookie
    or overwrite an existing cookie.


    ![image](Image00186.jpg)


    ![image](Image00058.jpg)  Open the **Settings** menu in your web browser and clear
    existing cookies that are stored on your system


    ![image](Image00061.jpg)  Now, use the ![image](Image00187.jpg) Refresh button
    in your browser to reload this page and see the alternative content – confirming
    that the cookie data has been removed


    ![image](Image00188.jpg)


    ![image](Image00189.jpg)


    ![image](Image00005.jpg)


    The PHP manual describes the removal of a cookie by setting its value to empty
    and its expiration date to the past. For example, **setcookie(** **$_COOKIE[ ‘user’
    ] , ‘‘ , time()-3600 )** . Additionally, the **unset()** function can be used
    to destroy a specified variable.


    **Submitting session data**


    User data can be stored in cookies on the client computer only if the user chooses
    to allow cookies onto their system. Many users prefer to disallow cookies, however,
    to avoid tracking – but PHP provides a better alternative. With PHP, user data
    can be stored on the server using the special **$_SESSION** global array variable.
    In order for PHP sessions to work, each PHP page must call the built-in **session_start()**
    function at the top of the page – before any HTML tags! HTML form submissions
    to the server via the **POST** method assigns field data to the special PHP **$_POST**
    global array variable, and individual submission fields can be sought using the
    built-in PHP **isset()** function. When this confirms the field is present, its
    name and value can be stored in a session variable. This might be used to store
    a username and password details for use across a website, as an alternative to
    cookie storage:


    ![image](Image00174.jpg)


    session_form.html


    ![image](Image00054.jpg)  Create an HTML document and add this form to its body
    section, specifying submission method and the name of a PHP submission-handler
    script'
