  trans: "\n```\n{ echo ‘4 is greater than 2 AND 8 is greater than 4<br> ; }\n```\n\
    \n![image](img/Image00069.jpg) 现在，添加一个语句，当测试的表达式被判定为 **TRUE** 或 **FALSE** 时，输出结果。\n\
    \n```php\nif ( 4 > 8 )\n{\n    echo ‘4 is greater than 8 <br>’ ;\n}\nelse\n{\n\
    \    echo ‘4 is less than 8 <br>’ ;\n}\n```\n\n![image](img/Image00070.jpg) 最后，添加一个语句，当两个测试的表达式其中一个被判定为\
    \ **TRUE**，或者两个测试的表达式都被判定为 **FALSE** 时，输出结果。\n\n```php\nif ( 4 > 8 )\n{\n    echo\
    \ ‘This test is True </p>’ ;\n}\nelseif ( 8 > 4 )\n{\n    echo ‘Alternative test\
    \ is True </p>’ ;\n}\nelse\n{\n    echo ‘Both tests are False </p>’ ;\n}\n?>\n\
    ```\n\n![image](img/Image00072.jpg) 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为 `else.php`，然后通过\
    \ HTTP 打开页面以显示条件分支的结果。\n\n![image](img/Image00075.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n你可以嵌套条件 **if** 测试（在一个内部嵌套另一个），使得内部块中的语句只有在两个测试都被判定为 **TRUE**时才会执行。\n\n## 切换分支\n\
    \n当测试表达式仅评估一个条件时，通过多个 **if-elseif-else** 语句执行的条件分支可以通过 **switch** 语句更高效地完成。\n\n\
    **switch** 语句的工作方式很寻常。它接受一个给定的值作为参数，然后尝试从多个 **case** 语句中匹配该值。找到匹配时要执行的代码包含在每个\
    \ **case** 语句中。\n\n用 `break` 关键字语句结束每个 **case** 语句是非常重要的，这样 **switch** 语句在找到匹配项后就会退出，不再寻找其他匹配项——除非这是刻意的要求。\n\
    \n可选地，**case** 语句列表后面可以跟一个最终的 **default** 语句，以指定在任何 **case** 语句中未找到匹配项时执行的代码。因此，switch\
    \ 语句的语法通常如下：\n\n```php\nswitch ( test-value )\n{\n    case match-value : statements-to-execute-when-matched\
    \ ; break ;\n    case match-value : statements-to-execute-when-matched ; break\
    \ ;\n    case match-value : statements-to-execute-when-matched ; break ;\n   \
    \ default : statements-to-execute-when-no-match-found ;\n}\n```\n\n![image](img/Image00005.jpg)\
    \ 包含 **default** 语句始终是一个好主意——即使只是在 **switch** 语句失败时输出一条错误消息。\n\n一个 **switch**\
    \ 语句可以有很多 **case** 语句，但没有两个 **case** 语句可以尝试匹配相同的值。\n\n当多个匹配值需要执行相同的语句时，只需要最后的\
    \ **case** 语句包含要执行的语句和退出 **switch** 语句块的 `break` 语句。例如，为匹配值为 0、1 和 2 输出相同的消息：\n\
    \n```php\nswitch ( $number )\n{\n    case 0 :\n    case 1 :\n    case 2 : echo\
    \ ‘Less than 3’ ; break ;\n    case 3 : echo ‘Exactly 3’ ; break ;\n    default\
    \ : echo ‘Greater than 3 or less than zero’ ;\n}\n```\n\n![image](img/Image00006.jpg)\
    \ **default** 语句不需要出现在 **switch** 块的末尾，但将其放在那里是有逻辑，因为那里不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
    \nswitch.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用初始化两个整数和字符值变量的语句开始脚本。\n\
    \n```php\n<?php\n$number = 2 ; $letter = ‘B’ ;\n```\n\n![image](img/Image00068.jpg)\
    \ 接下来，添加一个 **switch** 语句来匹配整数值。\n\n```php\nswitch ( $number )\n{\n    case 1 :\
    \ echo ‘Number is One<br>’ ; break ;\n    case 2 : echo ‘Number is Two<br>’ ;\
    \ break ;\n    case 3 : echo ‘Number is Three<br>’ ; break ;\n    default : echo\
    \ ‘Number is Unrecognized<br>’ ;\n}\n```\n\n![image](img/Image00069.jpg) 现在，添加一个\
    \ **switch** 语句来匹配字符值。\n\n```php\nswitch ( $letter )\n{\n    case ‘A’ : echo ‘Letter\
    \ is A<br>’ ; break ;\n    case ‘B’ : echo ‘Letter is B<br>’ ; break ;\n    case\
    \ ‘C’ : echo ‘Letter is C<br>’ ; break ;\n    default : echo ‘Letter is Unrecognized<br>’\
    \ ;\n}\n```\n\n![image](img/Image00070.jpg) 最后，添加一个语句，当测试的表达式被判定为 **TRUE** 或 **FALSE**\
    \ 时，输出结果。\n\n```php\n{ echo ‘4 is greater than 2 AND 8 is greater than 4<br>’\
    \ ; }\n```\n"
- fmt: "\nA `while` loop is an alternative to the `for` loop described in the previous\
    \ example. The `while` loop also requires an initializer, test-expression, and\
    \ an updater, but these are not neatly listed within a single pair of parentheses\
    \ as they are in a `for` loop. Instead the initializer must appear before the\
    \ start of the loop block, and the test-expression must appear within parentheses\
    \ after the `while` keyword, followed by braces containing both an updater and\
    \ the statements to be executed on each iteration.\n\n```\ninitializer\nwhile\
    \ ( test-expression )\n{\n    statement/s-to-be-executed ;\n    updater ;\n}\n\
    ```\n\n![image](Image00019.jpg)\n\nEnsure that the test expression in a loop structure\
    \ will at some point become `FALSE` to avoid creating an infinite loop that never\
    \ ends.\n\nA `do while` loop provides a subtle variation on the syntax above by\
    \ placing the `do` keyword before the loop block and moving the `while` statement\
    \ to after the loop block:\n\n```\ninitializer\ndo {\n    statement/s-to-be-executed\
    \ ;\n    updater ;\n}\nwhile ( test-expression ) ;\n```\n\nBoth `while` loops\
    \ and `do while` loops will proceed to make iterations until the test-expression\
    \ is found to be `FALSE`, at which point the loop will exit. It is therefore essential\
    \ that the loop body contains code that will, at some point, change the result\
    \ of the test-expression evaluation – otherwise an infinite loop is created which\
    \ will lock the system. The significant difference between a `while` loop and\
    \ a `do while` loop is that a `while` loop will not make a single iteration if\
    \ the test-expression is `FALSE` on its first evaluation. In contrast, a `do while`\
    \ loop will always make at least one iteration because its statements are executed\
    \ before the evaluation is made. If this is desirable a `do while` loop is obviously\
    \ the best choice, otherwise the choice between a `for` loop and a `while` loop\
    \ is largely a matter of personal preference. One rule of thumb suggests that\
    \ a `for` loop is best used to perform a specific number of iterations, whereas\
    \ a `while` loop is best used to iterate until a certain condition is met. Loops\
    \ are the perfect partner to use with arrays as each iteration can effortlessly\
    \ read or write into successive array elements.\n\n![image](Image00005.jpg)\n\n\
    You will discover later in this book how a PHP `while` loop is used to retrieve\
    \ records from a MySQL database.\n\n![image](Image00029.jpg)\n\nwhileloop.php\n\
    \n![image](Image00067.jpg) Between PHP tags, begin a script with a statement to\
    \ create an array\n\n```php\n<?php\n$numbers = array( 10 , 20 , 30 ) ;\n```\n\n\
    ![image](Image00068.jpg) Next, add a `while` loop to output the value of each\
    \ array element\n\n```php\necho ‘<dt>While Loop : ’ ;\n$i = 0 ;\nwhile ( $i <\
    \ 3 )\n{\n    echo “<dd>Element $i = $numbers[$i] ” ;\n    $i ++ ;\n}\n```\n\n\
    ![image](Image00069.jpg) Now, add a `do while` loop to output the value of each\
    \ array element\n\n```php\necho ‘<dt>Do While Loop : ’ ;\n$i = 0 ;\ndo {\n   \
    \ echo “<dd>Element $i = $numbers[$i] ” ;\n    $i ++ ;\n}\nwhile ( $i < 3 ) ;\n\
    ?>\n```\n\n![image](Image00070.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `whileloop.php` then open the page via HTTP to see the array element\
    \ values get identically displayed\n\n![image](Image00079.jpg)\n\n![image](Image00006.jpg)\n\
    \nChange the value in this test expression to zero – so `while ( $i = 0 )` in\
    \ both loops – to see only the first iteration of the `do while` loop get executed.\n\
    \n### Breaking from loops\n\nThe `break` keyword can be used to prematurely terminate\
    \ a loop when a specified condition is met. The `break` statement is situated\
    \ inside the loop statement block and is preceded by a test expression. When the\
    \ test returns `TRUE`, the loop ends immediately and the program proceeds on to\
    \ the next task. For example, in a nested inner loop it proceeds to the next iteration\
    \ of the outer loop.\n\n![image](Image00029.jpg)\n\nbreakcontinue.php\n\n![image](Image00067.jpg)\
    \ Between PHP tags, begin a script with a `for` loop that performs three iterations\n\
    \n```php\n<?php\nfor ( $i = 1 ; $i < 4 ; $i ++ )\n{\n    # Nested loop to be inserted\
    \ here (step 2).\n}\n```\n\n![image](Image00068.jpg) Next, insert a nested `for`\
    \ loop that also performs three iterations\n\n```php\nfor ( $j = 1 ; $j < 4 ;\
    \ $j ++ )\n{\n    # Statements to be inserted here (steps 5 & 6).\n}\n?>\n```\n\
    \n![image](Image00069.jpg) Now, insert a statement that outputs the value of both\
    \ variables\n\n```php\necho “i = $i, j = $j” ;\n```\n\n![image](Image0070.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `breakcontinue.php`\
    \ then open the page via HTTP to see the output.\n"
