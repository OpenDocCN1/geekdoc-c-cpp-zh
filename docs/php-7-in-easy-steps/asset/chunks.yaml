  trans: "\nPHP 可以使用内置的 `isset()` 函数轻松确保用户已在提交的 HTML 表单字段中输入了数据。该函数接受变量名作为参数，仅当该变量值不为\
    \ `NULL`时返回 `TRUE` —— 因此确保了变量已“设置”了某些值。除非用户输入了值，否则空表单字段将为 `NULL`。\n\n可以使用 `isset()`\
    \ 函数进行条件测试，以指示哪些表单字段留空，或为已完成的字段提供响应页面：\n\n![image](img/Image00029.jpg)\n\n`isset.php`\n\
    \n![image](img/Image00036.jpg)  创建一个包含三个单选按钮的 HTML 文档，该表单提供一个单一的数据提交字段\n\n```html\n\
    <form action=” isset_handler.php ” method=” POST ”>\n<fieldset>\n<legend>PHP 是哪种语言？</legend>\n\
    Scripting<input type=”radio” name=” definition ” value=” Scripting ”> <br>\nMarkup<input\
    \ type=”radio” name=” definition ” value=” Markup ”> <br>\nProgramming<input type=”radio”\
    \ name=” definition ” value=” Programming ”>\n</fieldset><p><input type=”submit”\
    \ ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)  现在，将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录下并命名为 `isset.php`\n\n![image](img/Image00029.jpg)\n\n`isset_handler.php`\n\
    \n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量 ——如果没有提交值，则初始化为\
    \ `NULL`\n\n```php\n<?php\nif ( isset( $_POST[‘definition’] ) )\n{\n    $definition\
    \ = $_POST[‘definition’] ;\n}\nelse\n{\n    $definition = NULL ;\n}\n# 在此处插入响应语句（第\
    \ 4 步）。\n?>\n```\n\n![image](img/Image00039.jpg)  最后，插入语句根据变量的值输出相应的响应\n\n```php\n\
    if ( $definition != NULL )\n{\n    if ( $definition != ‘Scripting’ )\n    { echo\
    \ “ $definition is Incorrect” ; }\n    else\n    { echo “ $definition is Correct”\
    \ ; }\n}\nelse\n{ echo ‘You must select one answer’ ; }\n?>\n```，等待，修复格式：\n\n\
    ![image](img/Image00040.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `isset_handler.php`，然后通过\
    \ HTTP 访问 `isset.php` 并提交表单以查看响应\n\n![image](img/Image00156.jpg)\n\n![image](img/Image00157.jpg)\n\
    \n![image](img/Image00158.jpg)\n\n![image](img/Image00159.jpg)\n\n![image](img/Image00005.jpg)\n\
    \n从技术上讲，测试条件是否为 `TRUE` 比测试它是否为 `TRUE` 更高效 —— 因为需要评估的可能性更少。\n\n### 验证表单数据\n\n由于用户可能会无意中提交空字段或格式错误的表单，因此您的\
    \ PHP 脚本确保必填字段已填写且提交的数据有效是非常关重要的。\n\n为了确保用户已在文本字段中输入了内容，PHP 提供了 `empty()` 函数，它接受可变参数，如果其值为空字符串、零、`NULL`\
    \ 或 `FALSE`，则返回 `TRUE`。\n\n为了确保用户输入的是数字格式的数据，PHP 提供了 `is_numeric()` 函数，它接受可变参数，且仅当其值为数字时才返回\
    \ `TRUE`。\n\n可以使用 PHP 的 `preg_match()` 函数执行更具体的数据验证，该函数接受一个“正则表达式”参数和一个用于查找模式的可变参数。通常，这被用于确保电子邮件地址符合预期格式：\n\
