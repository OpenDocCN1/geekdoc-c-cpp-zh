- fmt: "\nA class is a data structure that can contain both variables and functions\
    \ in a single entity. These are collectively known as its “members” – the variables\
    \ are known as its class “properties” and the functions are known as its class\
    \ “methods”.\n\n![image](Image00113.jpg)\n\nAccess to class members from outside\
    \ the class is controlled by “access specifiers” in the class declaration. Typically,\
    \ these will deny access to the class variables but allow access to methods that\
    \ can store and retrieve data from those variable members. This technique of “data\
    \ hiding” ensures that stored data is safely encapsulated within the class variable\
    \ members, and is the first principle of Object Oriented Programming (OOP).\n\n\
    A class declaration begins with the `class` keyword, followed by a space, then\
    \ a programmer-specified name – adhering to the usual PHP naming conventions but\
    \ beginning in uppercase. Next come the class property declarations followed by\
    \ the class method declarations. These are like regular variable and function\
    \ declarations but should each begin with an access specifier. The class declaration\
    \ syntax looks like this:\n\n```php\nclass ClassName\n{\n    access-specifier\
    \ $var1, $var2, $var3;\n    access-specifier functionName1($arg1, $arg2, $arg3)\n\
    \    {\n        statements-to-execute;\n    }\n}\n```\n\n![image](Image00005.jpg)\n\
    \nIt is conventional to begin class names with an uppercase character and object\
    \ names with lowercase.\n\nAn access specifier may be any one of the keywords\
    \ `public`, `private` or `protected`, to specify access rights for its listed\
    \ members:\n\n* `public` members are accessible from any place where the class\
    \ is visible\n* `private` members are accessible only to other members of the\
    \ same class in which they are defined\n* `protected` members are accessible only\
    \ to other members of the same class and members of classes derived from that\
    \ class\n\n![image](Image00005.jpg)\n\nDerived classes are introduced later in\
    \ this chapter – see [here](#text00009.html_sec51).\n\nAny real-world object can\
    \ be defined by its attributes and by its actions. For example, a dog has attributes\
    \ such as age, weight and color, and actions it can perform such as bark. The\
    \ class mechanism in PHP provides a way to create a virtual dog object within\
    \ a script, where the class properties can represent its attributes and the class\
    \ methods represent its actions:\n\n```php\nclass Dog\n{\n    private $age;\n\
    \    private $weight;\n    private $color;\n    public function bark() { echo\
    \ ‘WOOF!’ ; }\n    // Plus methods here to store data in the properties.\n   \
    \ // Plus methods here to retrieve data from the properties.\n}\n```\n\n![image](Image00006.jpg)\n\
    \nWhile a PHP script class cannot perfectly emulate a real-word object, the aim\
    \ is to encapsulate all relevant attributes and actions as class properties and\
    \ methods.\n\nIt is important to recognize that a class declaration only defines\
    \ a data structure – in order to create an object you must declare an “instance”\
    \ of that data structure. This is achieved by assigning a copy of a class to a\
    \ variable using the `new` keyword, like this:\n\n```php\n$fido = new Dog(); //\
    \ Creates an instance named “fido”\n// of the programmer-defined\n// “Dog” data\
    \ structure.\n```\n\nThe instance object is a working copy of the original class\
    \ data structure so retains all its features. As the method in the example above\
    \ has been declared `public`, it is visible in the script outside the class declaration.\
    \ This means the instance’s copy of the method can be called using a special `->`\
    \ object operator, like this:\n\n```php\n$fido->bark(); // Outputs WOOF!\n```\n\
    \nThe `->` object operator can be used to reference any visible class member,\
    \ but the variable properties in the example above have been declared `private`\
    \ so are encapsulated in the object and are not directly accessible. The principle\
    \ of encapsulation in PHP programming describes the grouping together of data\
    \ and functionality in class members – these are the age, weight, color attributes\
    \ and bark action in this Dog class.\n\n![image](Image00019.jpg)\n\nNotice that\
    \ you must add parentheses after the class name in the statement creating an instance\
    \ object.\n\n**Creating an object**\n\nIn order to assign and retrieve data from\
    \ private members of a class, special `public` accessor methods must be added\
    \ to the class. These are “setter” methods to assign data, and “getter” methods\
    \ to retrieve data. Accessor methods are often named as the variable they address,\
    \ with the first letter made uppercase, and prefixed by “set” or “get” respectively.\
    \ For example, accessor methods to address an `age` variable may be named `setAge()`\
    \ and `getAge()`.\n\nThe setter and getter methods can reference a member of the\
    \ same class using a special `$this` “pseudo-variable”, followed by the `->` object\
    \ operator, and the property name. For example, using `$this->age` to reference\
    \ an age property:\n\n![image](Image00029.jpg)\n\nobject.php\n\n![image](Image00114.jpg)\
    \ Begin a PHP script with a statement to declare a class named “Dog”\n\n```php\n\
    <?php\nclass Dog\n{\n    // Members to be inserted here (steps 2-5).\n}\n```\n\
    \n![image](Image00115.jpg) Between the braces of the class declaration\n\n```php\n\
    class Dog\n{\n    private $age;\n    private $weight;\n    private $color;\n\n\
    \    public function bark() { echo ‘WOOF!’ ; }\n\n    public function setAge($yrs)\
    \ {\n        $this->age = $yrs;\n    }\n\n    public function getAge() {\n   \
    \     return $this->age;\n    }\n\n    public function setWeight($lbs) {\n   \
    \     $this->weight = $lbs;\n    }\n\n    public function getWeight() {\n    \
    \    return $this->weight;\n    }\n\n    public function setColor($fur) {\n  \
    \      $this->color = $fur;\n    }\n\n    public function getColor() {\n     \
    \   return $this->color;\n    }\n}\n```\n\n![image](Image00016.jpg) Add public\
    \ setter methods – assign individual values to the private variables\n\n```php\n\
    public function setAge($yrs) {\n    $this->age = $yrs;\n}\n\npublic function setWeight($lbs)\
    \ {\n    $this->weight = $lbs;\n}\n\npublic function setColor($fur) {\n    $this->color\
    \ = $fur;\n}\n```\n\n![image](Image00017.jpg) Add public getter methods – retrieve\
    \ individual values from the private variables\n\n```php\npublic function getAge()\
    \ {\n    return $this->age;\n}\n\npublic function getWeight() {\n    return $this->weight;\n\
    }\n\npublic function getColor() {\n    return $this->color;\n}\n```\n\n![image](Image00005.jpg)\
    \ In the class declaration, notice that all methods are public and all variables\
    \ are private.\n\n![image](Image00019.jpg) After the Dog declaration, declare\
    \ an instance of the Dog class\n\n```php\n$fido = new Dog();\n```\n\n![image](Image00020.jpg)\
    \ Fido\n\n![image](Image00021.jpg) Add statements calling each setter method to\
    \ assign data\n\n```php\n$fido->setAge(3);\n$fido->setWeight(15);\n$fido->setColor('brown’);\n\
    ```\n\n![image](Image00022.jpg) Add statements calling each getter method to retrieve\
    \ the assigned values\n\n```php\necho ‘Fido is a ‘ . $fido->getColor() . ‘ dog<br>’;\n\
    echo ‘Fido is ‘ . $fido->getAge() . ‘ years old<br>’;\necho ‘Fido weighs ‘ . $fido->getWeight()\
    \ . ‘ pounds<br>’;\n```\n\n![image](Image00023.jpg) Now, add a call to the regular\
    \ output method\n\n```php\n$fido->bark();\n?>\n```\n\n![image](Image00024.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `object.php` then\
    \ open the page via HTTP to see the output class properties and method call\n\n\
    ![image](Image00025.jpg)\n\n![image](Image00003.jpg) A new feature in PHP 7 is\
    \ the ability to also create “anonymous classes” with simple functionality and\
    \ no name. For example, `$util = new class { public function log($s) { echo $s\
    \ ; } } ;` that can be called with `$util->log( ‘Data’ ) ;`.\n\n![image](Image00005.jpg)\
    \ This **object.php** script will get modified over the next few pages as new\
    \ features are incorporated.\n\n**Initializing members**\n\nA program can easily\
    \ create multiple objects simply by declaring multiple instances of a class, and\
    \ each object can have unique attributes by assigning individual values with its\
    \ setter methods.\n"
  raw: 'A class is a data structure that can contain both variables and functions
    in a single entity. These are collectively known as its “members” – the variables
    are known as its class “properties” and the functions are known as its class “methods”.


    ![image](Image00113.jpg)


    Access to class members from outside the class is controlled by “access specifiers”
    in the class declaration. Typically, these will deny access to the class variables
    but allow access to methods that can store and retrieve data from those variable
    members. This technique of “data hiding” ensures that stored data is safely encapsulated
    within the class variable members, and is the first principle of Object Oriented
    Programming (OOP).


    A class declaration begins with the **class** keyword, followed by a space, then
    a programmer-specified name – adhering to the usual PHP naming conventions but
    beginning in uppercase. Next come the class property declarations followed by
    the class method declarations. These are like regular variable and function declarations
    but should each begin with an access specifier. The class declaration syntax looks
    like this:


    **class *ClassName***


    **{**


    ***access-specifier* $*var1* , $*var2* , $*var3* ;**


    ***access-specifier functionName1* ( $*arg1* , $*arg2* , $*arg3* )**


    **{**


    ***statements-to-execute* ;**


    **}**


    **}**


    ![image](Image00005.jpg)


    It is conventional to begin class names with an uppercase character and object
    names with lowercase.


    An access specifier may be any one of the keywords **public** , **private** or
    **protected** , to specify access rights for its listed members:


    • **public** members are accessible from any place where the class is visible


    • **private** members are accessible only to other members of the same class in
    which they are defined


    • **protected** members are accessible only to other members of the same class
    and members of classes derived from that class


    ![image](Image00005.jpg)


    Derived classes are introduced later in this chapter – see [here](#text00009.html_sec51)
    .


    Any real-world object can be defined by its attributes and by its actions. For
    example, a dog has attributes such as age, weight and color, and actions it can
    perform such as bark. The class mechanism in PHP provides a way to create a virtual
    dog object within a script, where the class properties can represent its attributes
    and the class methods represent its actions:


    **class Dog**


    **{**


    **private $age ;


    private $weight ;


    private $color ;**


    **public function bark() { echo ‘WOOF!’ ; }**


    **// Plus methods here to store data in the properties.**


    **// Plus methods here to retrieve data from the properties.**


    **}**


    ![image](Image00006.jpg)


    While a PHP script class cannot perfectly emulate a real-word object, the aim
    is to encapsulate all relevant attributes and actions as class properties and
    methods.


    It is important to recognize that a class declaration only defines a data structure
    – in order to create an object you must declare an “instance” of that data structure.
    This is achieved by assigning a copy of a class to a variable using the **new**
    keyword, like this:


    **$fido = new Dog() ;       // Creates an instance named “fido”**


    **// of the programmer-defined**


    **// “Dog” data structure.**


    The instance object is a working copy of the original class data structure so
    retains all its features. As the method in the example above has been declared
    **public** , it is visible in the script outside the class declaration. This means
    the instance’s copy of the method can be called using a special **->** object
    operator, like this:


    **$fido->bark() ;              // Outputs WOOF!**


    The **->** object operator can be used to reference any visible class member,
    but the variable properties in the example above have been declared **private**
    so are encapsulated in the object and are not directly accessible. The principle
    of encapsulation in PHP programming describes the grouping together of data and
    functionality in class members – these are the age, weight, color attributes and
    bark action in this Dog class.


    ![image](Image00019.jpg)


    Notice that you must add parentheses after the class name in the statement creating
    an instance object.


    **Creating an object**


    In order to assign and retrieve data from private members of a class, special
    **public** accessor methods must be added to the class. These are “setter” methods
    to assign data, and “getter” methods to retrieve data. Accessor methods are often
    named as the variable they address, with the first letter made uppercase, and
    prefixed by “set” or “get” respectively. For example, accessor methods to address
    an **age** variable may be named **setAge()** and **getAge()** .


    The setter and getter methods can reference a member of the same class using a
    special **$this** “pseudo-variable”, followed by the **->** object operator, and
    the property name. For example, using **$this->age** to reference an age property:


    ![image](Image00029.jpg)


    object.php


    ![image](Image00114.jpg)  Begin a PHP script with a statement to declare a class
    named “Dog”


    **<?php**


    **class Dog**


    **{**


    **// Members to be inserted here (steps 2-5).**


    **}**


    ![image](Image00115.jpg)  Between the braces of the Dog class declaration, declare
    three private variable members


    **private $age ;**


    **private $weight ;**


    **private $color ;**


    ![image](Image00116.jpg)  After the private variables, add a public method to
    output a string when called


    **public function bark () { echo ‘WOOF! WOOF! <br>’ ; }**


    ![image](Image00117.jpg)  Add public setter methods – to assign individual argument
    values to each of the private variables


    **public function setAge ( int $yrs )**


    **{ $this-> age = $yrs ; }**


    **public function setWeight ( int $lbs )**


    **{ $this-> weight = $lbs ; }**


    **public function setColor ( string $fur )**


    **{ $this-> color = $fur ; }**


    ![image](Image00005.jpg)


    In the class declaration, notice that all methods are declared public and all
    variables are declared private. This notion of “public interface, private data”
    is a key concept when creating classes.


    ![image](Image00118.jpg)  Add public getter methods – to retrieve individual values
    from each of the private variables


    **public function getAge () { return $this-> age ; }**


    **public function getWeight () { return $this-> weight ; }**


    **public function getColor () { return $this-> color ; }**


    ![image](Image00119.jpg)  After the Dog class declaration, declare an instance
    of the Dog class named “fido”


    **$fido = new Dog () ;**


    ![image](Image00120.jpg)


    Fido


    ![image](Image00121.jpg)  Add statements calling each setter method to assign
    data


    **$fido -> setAge ( 3 ) ;**


    **$fido -> setWeight ( 15 ) ;**


    **$fido -> setColor ( ‘brown’ ) ;**


    ![image](Image00122.jpg)  Add statements calling each getter method to retrieve
    the assigned values


    **echo ‘Fido is a ‘ . $fido -> getColor (). ’ dog <br>’ ;**


    **echo ‘Fido is ‘ . $fido -> getAge (). ’ years old <br>’ ;**


    **echo ‘Fido weighs ‘ . $fido -> getWeight (). ’ pounds<br>’ ;**


    ![image](Image00123.jpg)  Now, add a call to the regular output method


    $ **fido -> bark () ;**


    **?>**


    ![image](Image00124.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **object.php**  then open the page via HTTP to see the output class properties
    and method call


    ![image](Image00125.jpg)


    ![image](Image00003.jpg)


    A new feature in PHP 7 is the ability to also create “anonymous classes” with
    simple functionality and no name. For example, **$util = new class { public function
    log($s) { echo $s ; } } ;** that can be called with **$util->log( ‘Data’ ) ;**


    ![image](Image00005.jpg)


    This **object.php** script will get modified over the next few pages as new features
    are incorporated.


    **Initializing members**


    A program can easily create multiple objects simply by declaring multiple instances
    of a class, and each object can have unique attributes by assigning individual
    values with its setter methods.'
