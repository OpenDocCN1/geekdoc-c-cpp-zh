  trans: "\n将多个设置方法（setter methods）合并为一个接受每个私有变量参数的单一方法通常非常方便。这意味着在程序中可以使用一条语句为所有值赋值，但该方法内部将包含多个语句。\n\
    \n可选的是，每个参数可以为传递的每个参数指定允许的数据类型，并且还可以方便地为每个参数指定默认值：\n\n![image](img/Image00029.jpg)\n\
    \n`initializer.php`\n\n![image](img/Image00114.jpg) 将上一个示例“object.php”的副本重命名为新程序\
    \ `initializer.php`\n\n![image](img/Image00115.jpg) 在 `Dog` 类声明中，将三个设置方法替换为单一的组合设置方法，并指定参数的数据类型和默认值\n\
    \n```php\npublic function setValues( int $yrs = 2 , int $lbs = 8 , string $fur\
    \ = ‘black’ )\n{\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00116.jpg) 在方法定义块中，插入三条语句，将传递参数的值赋值给类变量\n\
    \n```php\n$this-> age = $yrs ;\n$this-> weight = $lbs ;\n$this-> color = $fur\
    \ ;\n```\n\n![image](img/Image00117.jpg) 修改类定义后，将对三个设置方法的调用替换为对组合设置方法的单一调用——传递三个参数\n\
    \n```php\n$fido -> setValues ( 3 , 15 , ‘brown’ ) ;\n```\n\n![image](img/Image00118.jpg)\
    \ 声明名为“pooch”的 `Dog` 类的第二个实例\n\n```php\n$pooch = new Dog () ;\n```\n\n![image](img/Image00119.jpg)\
    \ 为组合设置方法添加第二次调用——为新对象传递三个参数\n\n```php\n$pooch -> setValues ( 4 , 18 , ‘gray’\
    \ ) ;\n```\n\n![image](img/Image00005.jpg) 尝试向初始化方法传递错误的数据类型，以查看是否发生类型错误。\n\n\
    ![image](img/Image00121.jpg) 添加调用每个获取方法（getter method）的语句，以检索已赋值的值\n\n```php\n\
    echo ‘<hr>Pooch: ‘ . $pooch -> getAge (). ’yrs’ ;\necho $pooch -> getWeight ().\
    \ ’lbs ’ . $pooch -> getColor () ;\n```\n\n![image](img/Image00122.jpg) 添加第二次对普通输出方法的调用\n\
    \n```php\n$pooch -> bark () ;\n```\n\n![image](img/Image00123.jpg) 现在，声明名为“rover”的\
    \ `Dog` 类的第三个实例\n\n```php\n$rover = new Dog () ;\n```\n\n![image](img/Image00124.jpg)\
    \ 为组合设置方法添加第三次调用——这次为新对象未传递任何参数\n\n```php\n$rover -> setValues ( ) ;\n```\n\n\
    ![image](img/Image00126.jpg) 添加调用每个获取方法的语句，以检索已赋值的值（这些值是指定的默认值）\n\n```php\necho\
    \ ‘<hr>Rover: ‘ . $rover -> getAge (). ’yrs’ ;\necho $rover -> getWeight (). ’lbs\
    \ ’ . $rover -> getColor () ;\n```\n\n![image](img/Image00127.jpg) 添加第三次对普通输出方法的调用\n\
    \n```php\n$rover -> bark () ;\n```\n\n![image](img/Image00128.jpg) 将文档保存到网络服务器的\
    \ `/htdocs` 目录并为 `initializer.php`，然后通过 HTTP 打开页面查看组合初始化方法设置的输出\n\n![image](img/Image00129.jpg)\n\
    \n![image](img/Image00130.jpg)\n\n![image](img/Image00006.jpg) 你仍然必须在此处调用初始化方法，以便在不传递参数时将默认值分配给类变量。\n\
    \n### 使用构造函数\n\n类变量成员可以通过特殊的“构造函数”方法初始化，该方法每当创建类的实例时就会被调用。构造方法始终始终命名为 `__construct()`，并可以接受参数来设置类变量的初始值。\n\
    \n![image](img/Image00131.jpg)\n\n构造方法有一个配套的“析构方法”（destructor method）——它每当类的实例被销毁时就会被调用。析构方法始终命名为\
    \ `__destruct()`。\n\n构造方法和析构方法没有返回值且是自动调用的——它们不能被显式调用，因此它们的声明不需要访问修符。\n\n初始化类变量的值在创建对象的语句中传递给构造方法，位于对象名称后的括号内：\n\
    \n![image](img/Image00029.jpg)\n\n`constructor.php`\n\n![image](img/Image00114.jpg)\
    \ 将上一个示例“initializer.php”的副本重命名为新程序 `constructor.php`\n\n![image](img/Image00115.jpg)\
    \ 在 `Dog` 类声明中，将 `setValues` 方法替换为此构造函数\n\n```php\nfunction __construct( int $yrs\
    \ = 2 , int $lbs = 8 , string $fur = ‘black’ )\n{\n    $this-> age = $yrs ;\n\
    \    $this-> weight = $lbs ;\n    $this-> color = $fur ;\n}\n```\n\n![image](img/Image00116.jpg)\
    \ 现在，添加一个简单的析构方法\n\n```php\nfunction __destruct() { echo ‘<hr>Object Destroyed.’\
    \ ; }\n```\n\n![image](img/Image00117.jpg) 在 `Dog` 类声明后，编辑创建 `fido` 的语句：\n\n```php\n\
    $fido = new Dog ( 3 , 15 , ‘brown’ ) ;\n```\n\n![image](img/Image00118.jpg) 同样，编辑创建\
    \ `pooch` 的语句：\n\n```php\n$pooch = new Dog ( 4 , 18 , ‘gray’ ) ;\n```\n\n![image](img/Image00119.jpg)\
    \ 类定义也称为“实现”。\n\n![image](img/Image00120.jpg) 同时编辑创建 `rover` 的语句：\n\n```php\n\
    $rover = new Dog () ;\n```\n\n![image](img/Image00121.jpg) 虽然通过构造函数设置初始值，但随后可以设置方法。PHP\
    \ 提供了几个函数来查询类，如 `class_exists()`、`method_exists(class, method)` 和 `property_exists(class,\
    \ property)`，它们在成功时返回 `TRUE`。你还可以使用 `get_class_vars()` 和 `get_class_methods()`\
    \ 获取类列表以查看“可见”成员：\n\n![image](img/Image00122.jpg)\n```php\n$items = get_class_vars(\
    \ ‘Dog’ );\necho ‘<br>Dog variables : .count($items);\n```\n\n![image](img/Image00123.jpg)\n\
    ```php\necho ‘<br>Dog methods :’ ;\n$items = get_class_methods( ‘Dog’ );\nforeach(\
    \ $items as $item ) { echo $item ; }\n```\n\n![image](img/Image00124.jpg) 将文档保存到网络服务器的\
    \ `/htdocs` 目录并为 `constructor.php`，然后通过 HTTP 打开页面查看输出\n\n![image](img/Image00125.jpg)\
    \ 可见变量的数量为 0。临时将它们的访问修符改为 `public`，查看其变为 3。\n\n### 属性继承\n\nPHP 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类“派生”（derived）。重要的是，派生类会继承其所派生的父类（基类）的成员——除了它自身的成员。\n\
    \n从基类继承成员的能力允许创建共享某些属性的派生类，这些属性是在基类中定义的。例如，一个“Polygon”基类可以定义所有多边形通用的宽度和高度属性。“矩形”和“三角形”类可以从多边形类派生——继承宽度和高度属性，加上它们定义独特特征的自身成员。\n\
    \n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类声明在类名后添加 `extends` 关键字，随后是其所派生的类名：\n\n\
    ![image](img/Image00126.jpg)\n\n`inheritance.php`\n\n![image](img/Image00127.jpg)\
    \ 开始 PHP 脚本，声明一个名为“Polygon”的基类，该类具有两个由构造函数初始化的私有变量，并有两个公共的获取方法\n\n"
- fmt: "\n```php\n<?php\n\nclass Polygon\n{\n    private $width , $height ;\n    function\
    \ construct( int $w = 4 , int $h = 5 )\n    {\n        $this-> width = $w ;\n\
    \        $this-> height = $h ;\n    }\n    public function getWidth () { return\
    \ $this-> width ; }\n    public function getHeight () { return $this-> height\
    \ ; }\n}\n```\n![image](Image00115.jpg) After the `Polygon` class, declare a “Rectangle”\
    \ class that derives from the `Polygon` class and adds a unique method\n\n```php\n\
    class Rectangle extends Polygon\n{\n    public function area ()\n    {\n     \
    \   return ( $this-> getWidth () * $this-> getHeight () ) ;\n    }\n}\n```\n\n\
    ![image](Image00116.jpg) After the `Rectangle` class, declare a “Triangle” class\
    \ that derives from the `Polygon` class and adds a unique method\n\n```php\nclass\
    \ Triangle extends Polygon\n{\n    public function area ()\n    {\n        return\
    \ ( $this-> getWidth () * $this-> getHeight () / 2 ) ;\n    }\n}\n```\n\n![image](Image00117.jpg)\
    \ After the `Triangle` class, add two statements creating an instance of each\
    \ derived class using default values\n\n```php\n$rect = new Rectangle () ;\n$trio\
    \ = new Triangle () ;\n```\n\n![image](Image00118.jpg) Finally, add two statements\
    \ to output the value returned by the unique method of each derived class\n\n\
    ```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
    \ Area : ‘ . $trio -> area () ;\n?>\n```\n\n![image](Image00119.jpg) Save the\
    \ document in your web server’s `/htdocs` directory as `inheritance.php` then\
    \ open the page via HTTP to see the output from inherited members\n\n![image](Image00135.jpg)\n\
    \n![image](Image00019.jpg)\n\nDon’t confuse class instances and derived classes\
    \ – an instance is a copy of a class, whereas a derived class is a new class that\
    \ inherits properties of the base class from which it is derived.\n\n![image](Image00006.jpg)\n\
    \nIn PHP, a derived class is always dependent on a single base class – multiple\
    \ inheritance is not supported.\n\n## Embracing polymorphism\n\nThe three cornerstones\
    \ of Object Oriented Programming (OOP) are encapsulation, inheritance, and polymorphism.\
    \ On the previous pages we have seen how data can be encapsulated within a PHP\
    \ class, and how derived classes inherit the properties of their base class, so\
    \ we can now explore the final cornerstone principle of polymorphism.\n\n![image](Image00136.jpg)\n\
    \nThe term “polymorphism” (from Greek, meaning “many forms”) describes the ability\
    \ to assign a different meaning or purpose to an entity according to its context.\
    \ For example, in the real world everyone knows how to use a push button (entity)\
    \ – you simply apply pressure to it. What that button does, however, depends on\
    \ what is connected to it (context), but the result does not affect how that button\
    \ is used.\n\nIn the world of Object Oriented Programming, polymorphism allows\
    \ classes to have different functionality while sharing a common interface. The\
    \ interface does not need to know which class it is using because they are, like\
    \ the real world button, all used the same way, but can produce different contextual\
    \ results. Embracing polymorphism in this way enables the programmer to create\
    \ interchangeable objects that can be selected according to requirement, rather\
    \ than by conditional tests.\n\nA PHP interface is similar to a class but is declared\
    \ using the `interface` keyword and can only contain method definitions, not any\
    \ method statements to be executed, like this:\n\n```php\ninterface InterfaceName\n\
    {\n    // Method definitions only go here.\n}\n```\n\n![image](Image00006.jpg)\
    \ Method definitions in a interface declaration may also specify parameters.\n\
    \nEach class that implements an interface must implement all the methods it defines\
    \ by specifying their statements to be executed. A class is attached to an interface\
    \ by including the `implements` keyword and interface name in its declaration,\
    \ like this:\n\n```php\nclass ClassName implements InterfaceName\n{\n    // Method\
