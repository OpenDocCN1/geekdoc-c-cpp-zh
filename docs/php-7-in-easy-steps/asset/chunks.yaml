  trans: "\n\n`$page_title = ‘PHP Process Error’ ;`\n\n![image](img/Image00068.jpg)\
    \ 接下来，添加一条语句来包含页眉\n\n```php\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/Image00069.jpg)\
    \ 现在，添加一个退出函数，在验证失败时显示通知以及返回返回帖子页的链接\n\n```php\nfunction fail( $str )\n{\n   \
    \ echo “<p>Please enter a $str .</p>” ;\n    echo ‘<p><a href=”post.php”>Post\
    \ Message</a’ ;\n    include ( ‘includes/footer.html’ ) ;\n    exit() ;\n}\n```\n\
    \n![image](img/Image00070.jpg) 添加一个测试以确保表单已提交\n\n```php\nif( isset( $_POST[ ‘message’\
    \ ] ) )\n{\n    // 在此处插入语句（第 5 步）。\n    // 在此处插入语句（第 6 步）。\n    // 在此处插入语句（第 7\
    \ 步）。\n}\n```\n\n![image](img/Image00006.jpg)\n\n此脚本由 `post.php` 中的表单提名，用于处理提交的用户数据消息。然而，该表单并不是“粘性的”——这意味着如果用户必须返回表单以完成空输入字段，则输入的任何字段数据将不会保留。\n\
    \n![image](img/Image00072.jpg) 插入测试以确保用户已填写所有表单字段\n\n```php\nif ( !empty( trim(\
    \ $_POST[ ‘first_name’ ] ) ) )\n{ $first_name = addslashes( $_POST[ ‘first_name’\
    \ ] ) ; }\nelse { fail( ‘First Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘last_name’\
    \ ] ) ) )\n{ $last_name = addslashes( $_POST[ ‘last_name’ ] ) ; }\nelse { fail(\
    \ ‘Last Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘subject’ ] ) ) )\n{ $subject\
    \ = addslashes( $_POST[ ‘subject’ ] ) ; }\nelse { fail( ‘Subject’ ) ; }\n\nif\
    \ ( !empty( trim( $_POST[ ‘message’ ] ) ) )\n{ $message = addslashes( $_POST[\
    \ ‘message’ ] ) ) ; ; }\nelse { fail( ‘Message’ ) ; }\n```\n\n![image](img/Image00082.jpg)\
    \ 当验证成功时，打开数据库连接\n\n```php\nrequire ( ‘../connect_db.php’ ) ;\n```\n\n![image](img/Image00203.jpg)\
    \ 现在，插入语句以将提交的 HTML 表单字段值加入 MySQL “forum”数据库表\n\n```php\n$sql = “INSERT INTO forum\n\
    ( first_name, last_name, subject, message, post_date )\nVALUES\n(‘ $first_name\
    \ ’, ‘ $last_name ’,’ $subject ’, ‘ $message ’, NOW() )” ;\n$result = mysqli_query\
    \ ( $dbc , $sql ) ;\n```\n\n![image](img/Image00204.jpg) 最后，插入一条语句来报告失败错误，或在成功后将浏览器重定向到论坛页面\n\
    \n```php\nif ( mysqli_affected_rows( $dbc ) != 1 )\n{\n    echo ‘<p>Error</p>\
    \ .mysqli_error( $dbc ) ;\n    mysqli_close( $dbc ) ;\n}\nelse\n{\n    mysqli_close(\
    \ $dbc ) ;\n    header( ‘Location: forum.php ’ ) ;\n}\n```\n\n![image](img/Image00205.jpg)\
    \ 将此脚本保存在 Web 服务器的 `/htdocs` 目录下并命名为 `process.php`，然后在不填写任何字段的情况下提交表单，以查看脚本显示错误消息\n\
    \n![image](img/Image00019.jpg)\n\n注意这里使用了 PHP 的 `addslashes()` 函数来转义单引号和引号。\n\n\
    ![image](img/Image00005.jpg)\n\n`NOW()` 是 MySQL 函数，返回当前时间戳的日期时间值。\n\n![image](img/Image00005.jpg)\n\
    \n如果脚本发现空的表单字段，它将提供自己的错误消息；如果数据无法添加到数据库表，则提供 MySQL 错误消息。\n\n### 确认成功\n\n现在是测试留言板流程的时间了，以确保验证执行正确，并且发布的消息出现在论坛页面上：\n\
    \n![image](img/Image00067.jpg) 打开发布消息页面，然后填写所有字段并提交表单，以查看消息出现在论坛上\n\n![image](img/Image00210.jpg)\n\
    \n![image](img/Image00211.jpg)\n\n![image](img/Image00006.jpg)\n\n“发布者（Posted\
    \ By）”详细信息是从 MySQL “forum”数据库表的 `first_name`、`last_name` 和 `post_date` 列检索的。\n\
    \n![image](img/Image00068.jpg) 接下来，返回发布消息页面，然后尝试发布一条没有填写主题的消息以查看错误\n\n![image](img/Image00212.jpg)\n\
    \n![image](img/Image00069.jpg) 返回发布消息页面并发布一条消息\n\n![image](img/Image00213.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n![image](img/Image00005.jpg)\n\n### 总结\n\n-\
    \ 这里使用了 PHP 的 `addslashes()` 函数来转义单引号和引号。\n- `NOW()` 是 MySQL 函数，返回当前时间戳的日期时间值。\n\
    - 如果脚本发现空的表单字段，它将提供自己的错误消息；如果数据无法添加到数据库表，则提供 MySQL 错误消息。\n\n"
- fmt: "\nPHP provides an XML parser called “SimpleXML” that can load an XML document\
    \ into memory as a hierarchical tree structure. The `simplexml_load_file()` function\
    \ requires the XML file name and path to transform the document into a data structure\
    \ comprising `SimpleXMLElement` objects. The data structure can then be explored\
    \ using the `var_dump()` function.\n\n![image](Image00029.jpg)\n\ncatalog.php\n\
    \n![image](Image00085.jpg)  Begin a PHP script with a statement to set a page\
    \ title and to preserve text formatting\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title><pre>’\
    \ ;\n```\n\n![image](Image00086.jpg)  Next, add a statement to load the XML data\
    \ or quit\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable\
    \ to load data!’ ) ;\n```\n\n![image](Image00087.jpg)  Now, display all the SimpleXMLElement\
    \ objects\n\n```php\nvar_dump( $xml ) ;\n```\n\n![image](Image00088.jpg)  Save\
    \ the document in your web server’s `/htdocs` directory as `catalog.php`, alongside\
    \ the `catalog.xml` file, then open the page via HTTP to see the SimpleXMLElement\
    \ objects\n\n![image](Image00216.jpg)\n\n![image](Image00005.jpg)\n\nNotice that\
    \ this data structure depicts an array named “book” that has five array elements\
    \ – corresponding to the five XML `<book>` elements.\n\n![image](Image00006.jpg)\n\
    \nThe ubiquitous nature of XML makes it ideal to transport data across the internet.\n\
    \n### Getting nodes\n\nThe data structure contained in a SimpleXML object describes\
    \ a parent-child relationship between outer and inner XML elements. Each member\
    \ of the data structure is known as a “node”. The top-level nodes are direct child\
    \ descendants of the SimpleXML object itself, so can be referenced using the object\
    \ name, `->` object operator, and child node name. For example, `$object->child`.\
    \ A child of the child node (grandchild) can be referenced by adding a further\
    \ `->` object operator, and the grandchild node name, such as `$object->child->grandchild`\
    \ and so on for each further generation:\n\n![image](Image00029.jpg)\n\nnodes.php\n\
    \n![image](Image00085.jpg)  Begin a PHP script with a statement to set a page\
    \ title\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](Image00086.jpg)\
    \  Add a statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \  Next, retrieve the content of the “title” element that is a child of the first\
    \ “book” element\n\n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title .\
    \ ’ in easy steps<br>’ ;\n```\n\n![image](Image00088.jpg)  Now, retrieve the content\
    \ of the “category” element that is a child of the first “book” element\n\n```php\n\
    echo ‘Language category : ‘ . $xml -> book[0] -> category ;\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `nodes.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the node\
    \ content\n\n![image](Image00217.jpg)\n\n![image](Image00005.jpg)\n\nAs there\
    \ are five “book” nodes on the same hierarchical level, in this example they are\
    \ created as an array. Each node can therefore be individually referenced using\
    \ its node name and array index number.\n\n### Looping through nodes\n\nThe SimpleXML\
    \ object provides methods to work with the data contained within its data structure.\
    \ Usefully, its `children()` method returns all child nodes and can be used to\
    \ loop through the nodes to retrieve each node’s content:\n\n![image](Image00029.jpg)\n\
    \nnodes-loop.php\n\n![image](Image00085.jpg)  Begin a PHP script with a statement\
    \ to set a page title\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n\
    ```\n\n![image](Image00086.jpg)  Add a statement to load the XML data or quit\n\
    \n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable to load\
    \ data!’ ) ;\n```\n\n![image](Image00087.jpg)  Next, initialize an iteration counter\
    \ at zero\n\n```php\n$counter = 0 ;\n```\n\n![image](Image00088.jpg)  Now, add\
    \ a loop to increment the counter and to display all “title” and “category” child\
    \ node content\n\n```php\nforeach( $xml ->children() as $book )\n{\n    $counter\
    \ ++ ;\n    echo ‘Book ‘ . $counter . ’ : ‘ ;\n    echo $book -> title . ’ in\
    \ easy steps [’ . $book -> category . ’]<hr> ;\n}\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `nodes-loop.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the node\
    \ content\n\n![image](Image00216.jpg)\n\n![image](Image00005.jpg)\n\n### Getting\
    \ attributes\n\nValues contained within a SimpleXMLElement can be referenced by\
    \ stating the attribute name, within quotes following the node name. For example,\
    \ `$object->child['feature']`.\n\n![image](Image00029.jpg)\n\nattribs.php\n\n\
    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title\n\
    \n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](Image00086.jpg)\
    \  Add a statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \  Next, retrieve the content of the “title” element that is a child of the first\
    \ “book” element\n\n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title .\
    \ ’ in easy steps<br>’ ;\n```\n\n![image](Image00088.jpg)  Now, display the value\
    \ of the “category” element that is a child of the first “book” element\n\n```php\n\
    echo ‘Cover : ‘ .\n$xml -> book[0] -> title[‘cover’] . ’<br>’ ;\n```\n\n![image](Image00089.jpg)\
    \  Save the document in your web server’s `/htdocs` directory as `nodes.php`,\
    \ alongside the `catalog.xml` file, then open the page via HTTP to see the node\
    \ content\n\n![image](Image00217.jpg)\n\n![image](Image00005.jpg)\n\n### Looping\
    \ through attributes\n\nThe SimpleXML object `children()` method can once again\
    \ be used to loop through nodes and retrieve the value of a particular node on\
    \ each iteration:\n\n![image](Image00029.jpg)\n\nattribs-loop.php\n\n![image](Image00085.jpg)\
    \  Begin a PHP script with a statement to set a page title\n\n```php\n<?php\n\
    echo ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](Image00086.jpg)  Add a\
    \ statement to load the XML data or quit\n\n```php\n$xml = simplexml_load_file(\
    \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](Image00087.jpg)\
    \  Next, initialize an iteration counter at zero\n\n```php\n$counter = 0 ;\n```\n\
    \n![image](Image00088.jpg)  Now, add a loop to increment the counter and to display\
    \ its value, then retrieve an attribute value on each iteration to display an\
    \ image\n\n```php\nforeach( $xml ->children() as $book )\n{\n    $counter ++ ;\n\
    \    echo ‘ ‘ . $counter . ’: ‘ ;\n    echo ‘<img src=”’ . $book -> title[‘cover’]\
    \ . ’>’ ; ;\n}\n```\n\n![image](Image00089.jpg)  Save the document in your web\
    \ server’s `/htdocs` directory as `attribs-loop.php`, alongside the `catalog.xml`\
    \ file, then open the page via HTTP to see the counter and image displayed on\
    \ each iteration of the loop\n\n![image](Image00220.jpg)\n\n![image](Image00005.jpg)\n\
    \nA SimpleXMLElement object also provides an `attributes()` method that returns\
    \ an associative array of all attribute names and values within an element. For\
    \ example, `$obj->child->attributes()`.\n\n**Including feeds**\n"
  raw: 'PHP provides an XML parser called “SimpleXML” that can load an XML document
    into memory as a hierarchical tree structure. The **simplexml_load_file()** function
    requires the XML file name and path to transform the document into a data structure
    comprising “SimpleXMLElement” objects. The data structure can then be explored
    using the **var_dump()** function.


    ![image](Image00029.jpg)


    catalog.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title
    and to preserve text formatting


    **<?php**


    **echo ‘<title>PHP SimpleXML</title><pre>’ ;**


    ![image](Image00086.jpg)  Next, add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Now, display all the SimpleXMLElement objects


    **var_dump( $xml ) ;**


    ![image](Image00088.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **catalog.php**  , alongside the  **catalog.xml**  file, then open the page
    via HTTP to see the SimpleXMLElement objects


    ![image](Image00216.jpg)


    ![image](Image00005.jpg)


    Notice that this data structure depicts an array named “book” that has five array
    elements – corresponding to the five XML **<book>** elements.


    ![image](Image00006.jpg)


    The ubiquitous nature of XML makes it ideal to transport data across the internet.


    **Getting nodes**


    The data structure contained in a SimpleXML object describes a parent-child relationship
    between outer and inner XML elements. Each member of the data structure is known
    as a “node”. The top-level nodes are direct child descendants of the SimpleXML
    object itself, so can be referenced using the object name, **->** object operator,
    and child node name. For example, **$object->child** . A child of the child node
    (grandchild) can be referenced by adding a further -> object operator, and the
    grandchild node name, such as **$object->child->grandchild** and so on for each
    further generation:


    ![image](Image00029.jpg)


    nodes.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, retrieve the content of the “title” element that
    is a child of the first “book” element


    **echo ‘First book : ‘ .**


    **$xml -> book[0] -> title . ’ in easy steps<br>’ ;**


    ![image](Image00088.jpg)  Now, retrieve the content of the “category” element
    that is a child of the first “book” element


    **echo ‘Language category : ‘ . $xml -> book[0] -> category ;**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **nodes.php**  , alongside the  **catalog.xml**  file, then open the page
    via HTTP to see the node content


    ![image](Image00217.jpg)


    ![image](Image00005.jpg)


    As there are five “book” nodes on the same hierarchical level, in this example
    they are created as an array. Each node can therefore be individually referenced
    using its node name and array index number.


    **Looping through nodes**


    The SimpleXML object provides methods to work with the data contained within its
    data structure. Usefully, its **children()** method returns all child nodes and
    can be used to loop through the nodes to retrieve each node’s content:


    ![image](Image00029.jpg)


    nodes-loop.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, initialize an iteration counter at zero


    **$counter = 0 ;**


    ![image](Image00088.jpg)  Now, add a loop to increment the counter and to display
    all “title” and “category” child node content


    **foreach( $xml ->children() as $book )**


    **{**


    **$counter ++ ;**


    **echo ‘Book ‘ . $counter . ’ : ‘ ;**


    **echo $book -> title .**


    **’ in easy steps [’ . $book -> category . ’]<hr>’ ;**


    **}**


    ![image](Image00089.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **nodes-loop.php**  , alongside the  **catalog.xml**  file, then open the
    page via HTTP to see all node content


    ![image](Image00218.jpg)


    ![image](Image00005.jpg)


    Nested **foreach** loops can be used to traverse child nodes of each descendant
    generation.


    **Getting attributes**


    Values contained within attributes of a SimpleXMLElement object can be referenced
    by stating the attribute name, within quotes, between brackets following the node
    name. For example, **$object->child[ ‘feature’ ]** accesses the value within an
    attribute named “feature” of a top-level “child” element:


    ![image](Image00029.jpg)


    attribs.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, retrieve the content of the “title” element that
    is a child of the first “book” element


    **echo ‘First book : ‘ .**


    **$xml -> book[0] -> title . ’ in easy steps<br>’ ;**


    ![image](Image00088.jpg)  Now, display the value of the “cover” attribute of the
    “title” element, that is a child of the first “book” element


    **echo ‘Cover : ‘ . $xml -> book[0] -> title[‘cover’] . ’<br>’ ;**


    ![image](Image00089.jpg)  Use the value retrieved in the previous step to display
    a cover image for the first “book” element


    **echo ‘<img src=”’ . $xml -> book[0] -> title[‘cover’] . ’”>’ ;**


    ![image](Image00091.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **nodes.php**  , alongside the  **catalog.xml**  file, then open the page
    via HTTP to see the attribute value and image


    ![image](Image00219.jpg)


    ![image](Image00006.jpg)


    Notice that each attribute value here is the path and filename to an image in
    a directory at **/htdocs/images** .


    **Looping through attributes**


    The SimpleXML object **children()** method can once again be used to loop through
    nodes and retrieve the value in a specified attribute of a particular node on
    each iteration:


    ![image](Image00029.jpg)


    attribs-loop.php


    ![image](Image00085.jpg)  Begin a PHP script with a statement to set a page title


    **<?php**


    **echo ‘<title>PHP SimpleXML</title>’ ;**


    ![image](Image00086.jpg)  Add a statement to load the XML data or quit


    **$xml = simplexml_load_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](Image00087.jpg)  Next, initialize an iteration counter at zero


    **$counter = 0 ;**


    ![image](Image00088.jpg)  Now, add a loop to increment the counter and to display
    its value, then retrieve an attribute value on each iteration to display an image


    **foreach( $xml ->children() as $book )**


    **{**


    **$counter ++ ;**


    **echo ‘ ‘ . $counter . ’: ‘ ;**


    **echo ‘<img src=”’ . $book -> title[‘cover’] . ’”>’ ;**


    **}**


    ![image](Image00089.jpg)  Save the document in your web server’s **/htdocs** directory
    as  **attribs-loop.php**  , alongside the  **catalog.xml**  file, then open the
    page via HTTP to see the counter and image displayed on each iteration of the
    loop


    ![image](Image00220.jpg)


    ![image](Image00005.jpg)


    A SimpleXMLElement object also provides an **attributes()** method that returns
    an associative array of all attribute names and values within an element. For
    example, **$obj->child->attributes()**


    **Including feeds**'
