  trans: "\n\n# 在此处插入语句。\n\n`?>`\n\n![image](img/Image00037.jpg)  现在，在 PHP 标签之间插入一个语句来创建并初始化两个变量\n\
    \n```php\n$phrase = ‘The truth is rarely pure’ ;\n$author = ‘Oscar Wilde’ ;\n\
    ```\n\n![image](img/Image00038.jpg)  接下来，插入一个语句单独显示变量值\n\n```php\necho $phrase\
    \ ;\n```\n\n![image](img/Image00039.jpg)  然后，插入一个语句在用双引号赋值的混合字符串中替换显示变量值\n\n```php\n\
    echo “<p>It is often said that <q> $phrase </q> </p>” ;\n```\n\n![image](img/Image00040.jpg)\
    \  插入一个语句将字符串连接到变量\n\n```php\n$phrase = $phrase . ‘ and never simple’ ;\n```\n\
    \n![image](img/Image00041.jpg)  最后，插入一个语句在混合字符串中显示替换后的两个变量值\n\n```php\necho “<p><q>\
    \ $phrase </q><cite> $author </cite></p>” ;\n```\n\n![image](img/Image00042.jpg)\
    \  将文档保存到网络服务器的 `/htdocs` 目录并命名为 `string.php`，然后通过 HTTP 打开页面查看变量值的显示\n\n![image](img/Image00044.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你也可以使用简写连接赋值运算符 `.=` 来连接两个字符串——这样 `$a = $a .\
    \ $b` 可以简写为 `$a .= $b` 。\n\n![image](img/Image00005.jpg)\n\n为你的变量采用一致的命名风格——例如全小写的\
    \ `$my_var` ，或“驼峰命名”的 `$myVar` 。\n\n## 创建数组\n\n### 索引数组\n\n数组变量可以在顺序的数组“元素”中存储多个数据项，这些元素从零开始编号（即“索引”的）。因此，第一个数组值存储在索引为\
    \ 0 的数组元素中。可以使用变量名后跟方括号中的索引号来引用单个数组元素值。例如，`$days[0]` 引用名为“days”的数组变量的第一个元素中存储的值。同样，`$days[1]`\
    \ 引用存储在第二个元素中的值，依此类推。可以通过创建多个给连续元素赋值的语句来创建变量数组，也可以通过创建一个使用 PHP `array()` 函数的单个语句来填充元素：\n\
    \n```php\n$days[] = ‘Monday’ ; $days[] = ‘Tuesday’ ; $days[] = ‘Wednesday’ ;\n\
    ```\n\n或者...\n\n```php\n$days = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’ ) ;\n\
    ```\n\n这都可以创建一个数组，其中每个元素中存储的值可以使用其索引号进行引用，例如 `$days[0]` 。\n\n![image](img/Image00045.jpg)\n\
    \n![image](img/Image00006.jpg)\n\n方括号表示“元素”，因此在使用 `array()` 函数进行赋值时，变量名后不需要它们——它们只在访问元素时才需要。\n\
    \n### 关联数组\n\n在创建数组时，你可以可选地为每个元素指定一个键名（key），用于引用该元素的值：\n\n```php\n$months['jan’]\
    \ = ‘January’ ;\n$months['feb’] = ‘February’ ;\n$months['mar’] = ‘March’ ;\n```\n\
    \n或者...\n\n```php\n$months = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ ,\
    \ ‘mar’ => ‘March’ ) ;\n```\n\n这都可以创建一个数组，其中每个元素中存储的值可以使用其键名进行引用，例如 `$months['jan’]`\
    \ 。\n\n### 遍历数组\n\n可以使用 `foreach` 循环遍历数组的所有元素，依次引用每个元素的值并将其赋值给变量：\n\n```php\n\
    foreach( $months as $value )\n{\n    # 在每次迭代中使用当前的 $value。\n}\n```\n\n在循环的每次迭代中，也可以使用以下方式访问键：\n\
    \n```php\nforeach( $months as $key => $value )\n```\n（接上）\n```php\n{\n    # 在每次迭代中使用当前的\
    \ $key 和 $value。\n}\n```\n\n![image](img/Image00005.jpg)\n\n`foreach` 结构专门为数组设计，它提供了一种遍历所有数组元素键和值的简单方法。有关循环的更多信息，请参见此处。\n\
    \n![image](img/Image00029.jpg)\n\narray.php\n\n![image](img/Image00036.jpg)  创建一个有效的\
    \ HTML 文档，如此处 所列出的那样，然后在正文部分插入 PHP 标签\n\n```php\n<?php\n# 在此处插入语句。\n?>\n```\n\n\
    ![image](img/Image00037.jpg)  现在，在 PHP 标签之间插入一个语句来创建并初始化带有值的变量数组\n\n```php\n$days\
    \ = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’ ) ;\n```\n\n![image](img/Image00038.jpg)\
    \  接下来，插入一个语句将所有数组元素中的值以项目列表的形式显示\n\n```php\nforeach( $days as $value ) { echo\
    \ “&bull; $value “ ; }\n```\n\n![image](img/Image00039.jpg)  然后，插入一个语句在用双引号赋值的混合字符串中替换显示变量值\n\
    \n```php\n$months = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ =>\
    \ ‘March’ ) ;\n```\n\n![image](img/Image00040.jpg)  插入一个语句将字符串连接到变量\n\n```php\n\
    $phrase = $phrase . ‘ and never simple’ ;\n```\n\n![image](img/Image00041.jpg)\
    \  最后，插入一个语句在混合字符串中显示替换后的两个变量值\n\n```php\necho “<p><q> $phrase </q><cite> $author\
    \ </cite></p>” ;\n```\n\n![image](img/Image00042.jpg)  将文档保存到你的网络服务器的 `/htdocs`\
    \ 目录并命名为 `string.php`，然后通过 HTTP 打开页面查看变量值的显示\n\n![image](img/Image00044.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你也可以使用简写连接赋值运算符 `.=` 来连接两个字符串——这样 `$a = $a .\
    \ $b` 可以简写为 `$a .= $b` 。\n\n![image](img/Image00005.jpg)\n\n为你的变量采用一致的命名风格——例如全小写的\
    \ `$my_var` ，或“驼峰命名”的 `$myVar` 。\n\n## 数组排序\n\nPHP 提供了两个方便的方法在数组和字符串之间进行转换，因为它们经常一起使用。`implode()`\
    \ 函数将数组转换为字符串并在每个值之间插入分隔符。这可能用于创建逗号分隔的列表：\n\n```php\n$csv_list = implode( ‘ ,\
    \ $array )\n```\n\n相反，`explode()` 函数通过指定分隔符将字符串转换为数组。这可能用于从逗号分隔的字符串创建数组：\n\n```php\n\
    $array = explode( ‘ , $csv_list ) ;\n```\n\n插入一个语句在混合字符串中显示变量值\n\n```php\necho\
    \ “<p><q> $phrase </q><cite> $author </cite></p>” ;\n```\n\nPHP 还提供了三个实用的函数按升序（a-z\
    \ 1-9）：\n\n- `sort()` 函数——按值排序，丢弃原始键\n- `asort()` 函数——按值排序，保留原始键\n- `ksort()`\
    \ 函数——按键排序\n\n现有的数组值可以通过简单的语句进行排序：\n\n```php\n$makers = array( ‘Ford’ , ‘Chevrolet’\
    \ , ‘Dodge’ ;\n\nsort( $makers ) ;\n```\n\n数组元素也可以通过三个类似的函数按字母降序（9-1 z-a）排序：\n\
    \n- `rsort()` 函数——按值降序排序，丢弃原始键\n- `arsort()` 函数——按值降序排序，保留原始键\n- `krsort()` 函数——按键降序排序\n\
    \n可以使用 `is_array()` 函数测试变量是否为数组。例如，`is_array( $var ) ;`\n\n重要的是 `sort()` 和 `rsort()`\
    \ 函数会丢弃指定的键名，因此这些函数仅适用于键/值关系不重要的情况——否则请使用 `asort()` 和 `arsort()` 函数来保留键。\n\n你可以使用\
    \ `range()` 函数轻松创建包含顺序数字或字母的数组。例如\n\n```php\n$six = range( 1 , 6 )\n$a_z = range(\
    \ ‘a’,‘z’ ) ;\n```\n\n如果你指定了键，索引将从一而不是零开始，如果你指定了相同的键，第二个值将覆盖第一个：\n\n```php\n$months\
    \ = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’ ) ;\n```\n\
    \n"
