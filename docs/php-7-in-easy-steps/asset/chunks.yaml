    ![image](Image00067.jpg)  Begin a PHP script with a statement to connect to a
    database using the standard connection scripts described on the previous page


    ```php

    <?php


    require( ‘..\ connect_db.php ’ ) ;

    ```


    ![image](Image00068.jpg)  Next, assign the SQL specifications of the table design
    to a variable


    ```php

    $sql = ‘CREATE TABLE IF NOT EXISTS forum ( ‘ .

    ‘post_id INT UNSIGNED NOT NULL AUTO_INCREMENT ,’ .

    ‘first_name VARCHAR(20) NOT NULL ,’ .

    ‘last_name VARCHAR(40) NOT NULL ,’ .

    ‘subject VARCHAR(60) NOT NULL ,’ .

    ‘message TEXT NOT NULL ,’ .

    ‘post_date DATETIME NOT NULL ,’ .

    ‘PRIMARY KEY ( post_id ) ) ‘ ;

    ```


    ![image](Image00069.jpg)  Now, add a test to report whether the table was created
    successfully, or describe the error on failure


    ```php

    if( mysqli_query( $dbc , $sql ) === TRUE )

    {

    echo ‘Table “forum” created successfully’ ;

    }

    else

    {

    echo ‘Error creating table : ‘ .mysqli_error( $dbc ) ;

    }

    ```


    ![image](Image00070.jpg)  Remember to close the database connection when done


    ```php

    mysqli_close( $dbc ) ;

    ```


    ![image](Image00072.jpg)  Save the document in your web server’s `/htdocs` directory
    as `create_forum.php` then open the page via HTTP to create the forum table


    ![image](Image00202.jpg)


    ![image](Image00005.jpg)


    The `VARCHAR` data type specifies a character length, whereas the `TEXT` data
    type accommodates up to 65,535 characters.


    ![image](Image00005.jpg)


    The `mysqli_query()` function executes the SQL query, whereas the `mysqli_error()`
    function will provide a report if an error occurs.


    ## Providing the page


    A forum page can be created to display previously posted messages retrieved from
    the MySQL ‘forum’ database table, created on the previous page. Forum messages
    can be displayed between the page header and footer, together with a hyperlink
    to another page where the user can post a new forum message. If the forum database
    contains no previously posted content, the script can simply advise that there
    are currently no messages.


    The PHP `mysqli_query()` function can make an SQL query to retrieve the database
    table content, and the `mysqli_num_rows()` function can discover how many table
    rows are in the result. When table rows are found in the result, the `mysqli_fetch_array()`
    function can be used to fetch an associative array of rows and data in each column
    by specifying the result and `MYSQLI_ASSOC` constant as arguments:


    ![image](Image00029.jpg)


    forum.php


    ![image](Image00067.jpg)  Begin a PHP script with a statement to set the page
    title


    ```php

    <?php


    $page_title = ‘PHP Forum’ ;

    ```


    ![image](Image00068.jpg)  Next, add a statement to include a page header


    ```php

    include ( ‘includes/header.html’ ) ;

    ```


    ![image](Image00069.jpg)  Add a statement to open the database connection


    ```php

    require ( ‘..\connect_db.php’ ) ;

    ```


    ![image](Image00070.jpg)  Retrieve all messages from the database table and assign
    them to a variable


    ```php

    $sql = ‘SELECT * FROM forum’ ;

    $result = mysqli_query( $dbc , $sql ) ;

    ```


    ![image](Image00072.jpg)  Test whether the database table is empty and display
    an appropriate advisory comment


    ```php

    if ( mysqli_num_rows( $result ) > 0 )

    {

    // Statements to be inserted here (step 6).

    }

    else

    {

    echo ‘<p>There are currently no messages.</p>’ ;

    }

    ```


    ![image](Image00006.jpg)


    Columns are returned as an associative array in which the row name is the key
    for each value in that column.


    ![image](Image00082.jpg)  Next, insert statements to write a table displaying
    all messages retrieved from the database table if any are found


    ```php

    echo ‘<table><tr><th>Posted By</th>

    <th>Subject</th><th id=”msg”>Message</th></tr>’ ;

    while ( $row = mysqli_fetch_array( $result , MYSQLI_ASSOC ) )

    {

    echo ‘<tr><td>’ .

    $row[ ‘first_name’ ] . ’ ‘ .

    $row[ ‘last_name’ ] . ‘<br>’ .

    $row[ ‘post_date’ ] . ’</td><td>’ .

    $row[ ‘subject’ ] . ‘</td><td>’ .

    $row[ ‘message’ ] . ‘</td></tr>’ ;

    }

    echo ‘</table>’ ;

    ```


    ![image](Image00203.jpg)  After the test block, add a statement to create a hyperlink
    to a “Post Message” page


    ```php

    echo ‘<p><a href=”post.php”>Post Message</a></p>’ ;

    ```


    ![image](Image00070.jpg)  After the test block, add a statement to close the database
    connection


    ```php

    mysqli_close( $dbc ) ;

    ```


    ![image](Image00070.jpg)  Add a final statement to include a page footer


    ```php

    include ( ‘includes/header.html’ ) ;

    ```


    ![image](Image00072.jpg)  Save the document in your web server’s `/htdocs` directory
    as `create_forum.php` then open the page via HTTP to create the forum table

