  trans: "\n\n- 算术运算符可以结合操作数形成表达式，包括加法 `+`、减法 `-`、乘法 `*`、除法 `/`、取模 `%` 和幂 `**`。\n\
    - 赋值运算符 `=` 可以与任何算术运算符结合，用于执行算术计算并赋值结果。\n- 比较运算符可以结合操作数形成表达式，包括相等 `==`、不相等 `!=`、全等或不全等\
    \ `===`、`!==`、大于 `>`、小于 `<`、大于等于 `>=`、小于 `<=` 以及飞船运算符 `<=>`。\n- 条件运算符 `?:` 评估一个表达式以得到\
    \ `TRUE`（真）或 `FALSE`（假）布尔值，然后根据评估结果返回两个指定结果之一。\n- `??` 空值合并运算符从左到右遍历操作数并返回第一个非空值。\n\
    - 逻辑运算符 `and`、`&&`、`or`、`||` 和 `xor` 形成表达式，评估两个操作数并返回真或假的值。\n- 逻辑非运算符 `!` 返回单个操作数的反反布尔值。\n\
    - 位运算符 `|`、`&`、`~`、`^`、`<<` 和 `>>` 允许对整数内的特定位进行评估和操作。\n- 前置增 `++` 或递减 `--` 运算符会将变量的值改变一并返回结果。\n\
    - 后置增 `++` 或递减 `--` 运算符返回变量的当前值，然后将其值改变一。\n- 运算符优先级决定了表达式在评估时的分组方式。\n- 当运算符优先级相同时，它们的结合性决定了表达式评估时的分组方式。\n\
    - `var_dump()` 函数可以查看表达式产生的类型和值。\n- 特殊常量 `NULL` 表示一个没有任何值（即使不是零）的变量。\n\n# 测试条件\n\
    \n本章演示了决定脚本执行方式的各种 PHP 控制结构。\n\n寻求真理 | 提供备选方案 | 分支分支 | 执行循环 | 在真循环 | 退出循环 | 总结\n\
    \n## 寻求真理\n\n`if` 关键字用于执行基础条件测试，评估给定的表达式以得到 `TRUE` 或 `FALSE` 布尔值。评估后大括号内的语句仅在表达式被判定为\
    \ `TRUE` 时才会执行。当表达式被判定为 `FALSE` 时，PHP 解析器只需移动到脚本的下一部分。\n\n![image](img/Image00005.jpg)\n\
    \n`if` 结构是 PHP 以及大多数其他编程语言中最重要的特性之一。\n\n`if` 条件测试语句的语法如下：\n\n```\nif ( test-expression\
    \ ) { statement-to-execute-when-true ; }\n```\n\n当测试为 `TRUE` 时，可能有多个语句需要执行，但每条语句必须以分号结束：\n\
    \n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n}\n```\n\n可以使用逻辑运算符 `&&` 或 `and` 对多个表达式进行测试，以确保只有在两个表达式都被判定为\
    \ `TRUE` 时才会执行后续语句，如下所示：\n\n```php\nif ( ( test-expression ) && ( test-expression\
    \ ) )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n}\n```\n\n![image](img/Image00005.jpg)\n\
    \n当要执行的代码只是单个语句时，可以选择省略大括号，但为了一致性，你可能希望始终包含大括号。\n\n或者，可以嵌套 `if` 条件测试语句来测试多个表达式，使得只有在所有测试都被判定为\
    \ `TRUE` 时才会执行语句，如下所示：\n\n```\nif ( test-expression )\n{\n    if ( test-expression\
    \ )\n    {\n        statement-to-execute-when-true;\n        statement-to-execute-when-true;\n\
    \        statement-to-execute-when-true;\n    }\n}\n```\n\n可以创建多个 `if` 条件测试语句来为脚本提供备选路径。\n\
    \n![image](img/Image00029.jpg)\n\nif.php\n\n![image](img/Image00067.jpg) 在 PHP\
    \ 标签之间，用一个初始化整数变量的语句开始脚本：\n\n```php\n<?php\n$num = 8 ;\n```\n\n![image](img/Image00068.jpg)\
    \ 接下来，添加在数值大小条件测试判定为 `TRUE` 时输出结果的语句：\n\n```php\nif ( $num > 5 ) { echo “$num\
    \ exceeds 5<br>” ; }\nif ( $num <= 5 ) { echo “ $num is below 6<br>” ; }\n```\n\
    \n![image](img/Image00069.jpg) 现在，添加在奇偶性条件测试判定为 `TRUE` 时输出结果的语句：\n\n```php\nif\
    \ ( $num % 2 == 0 ) { echo “$num is Even<br>” ; }\nif ( $num % 2 != 0 ) { echo\
    \ “$num is Odd<br>” ; }\n```\n\n![image](img/Image00070.jpg) 在 PHP 标签之间，用一个仅当测试表达式为\
    \ `TRUE` 时才输出结果的语句开始脚本：\n\n```php\n<?php\nif ( 4 > 2 ) { echo ‘<p>Yes, 4 is greater\
    \ than 2 <br>’ ; }\n```\n\n![image](img/Image00068.jpg) 接下来，添加在两个测试表达式都被判定为 `TRUE`\
    \ 时才输出结果的语句：\n\n```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) ) {\n    // statements\n}\n\
