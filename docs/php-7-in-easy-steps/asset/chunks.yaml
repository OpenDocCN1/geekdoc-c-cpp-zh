    \ Next, insert into the PHP script block a statement to create an array for error\
    \ messages\n\n```php\n$errors = array() ;\n```\n\n![image](Image00005.jpg) `$_SERVER[\
    \ ‘PHP_SELF’ ]` is used by this example to ensure the script will still work if\
    \ renamed.\n\n![image](Image00006.jpg) The `if` statement tests that the form\
    \ has been submitted by checking the request method is `POST`, not the `GET` method\
    \ that is used to display the empty form.\n\n![image](Image00039.jpg) Then, insert\
    \ statements to initialize variables with submitted values, or add to the errors\
    \ array for omissions\n\n```php\nif ( empty( $_POST[ ‘name’ ] ) ) { $errors[]\
    \ = ‘name’ ; }\nelse { $name = trim( $_POST[ ‘name’ ] ) ; }\nif ( empty( $_POST[\
    \ ‘email’ ] ) ) { $errors[] = ‘email’ ; }\nelse { $email = trim( $_POST[ ‘email’\
    \ ] ) ; }\n```\n\n![image](Image00040.jpg) Now, insert statements to write error\
    \ messages or confirm successful form submission\n\n```php\nif( !empty( $errors\
    \ ) )\n{ echo ‘Error! Please enter your ‘ ;\nforeach ( $errors as $msg ) { echo\
    \ “ - $msg “ ; } }\nelse { echo “Success! Thanks $name “ ; }\n```\n\n![image](Image00041.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `sticky.php` then\
    \ open it via HTTP and submit the form to see the retained values and response\
    \ messages.\n\n![image](Image00170.jpg)\n![image](Image00171.jpg)\n![image](Image00005.jpg)\
    \ It is good practice to use the `trim()` function, as seen here, to remove any\
    \ leading and trailing spaces from the submitted field value.\n\n### Uploading\
    \ files\n\nThe PHP `$_FILES` superglobal variable makes it simple to `POST` file\
    \ uploads from an HTML form if the `<form>` tag includes an `enctype` attribute\
    \ set to “multipart/formdata”. When submitted, a `$_FILES` associative array is\
    \ created with keys that include the file `name`, a generated temporary name (`tmp_name`),\
    \ and the file `size`. The file name and size can be used for validation. The\
    \ temporary filename can then be specified to the `move_uploaded_file()` function\
    \ along with the original filename to upload the file:\n\n![image](Image00029.jpg)\n\
    \nupload.php\n\n![image](Image00036.jpg) Create an HTML document containing a\
    \ sticky form with a file type input named “image”\n\n```html\n<form action=”\
    \ <?php $_SERVER[ ‘PHP_SELF’ ] ?>” method=”POST” enctype = “multipart/formdata”\
    \ >\nSelect an image to upload :\n<input type=”file” name=” image ” >\n<input\
    \ type=”submit” value=”Upload Image”> </form>\n```\n\n![image](Image00037.jpg)\
    \ Now add a PHP script to handle the form submission\n\n```php\n<?php\nif ( $_SERVER[\
    \ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// Statements to be inserted here (steps\
    \ 3-7).\n}\n?>\n```\n\n![image](Image00038.jpg) Next, insert statements to initialize\
    \ three variables with information about the file selected by the user\n\n```php\n\
    $name = $_FILES[ ‘ image ’ ][ ‘name’ ] ;\n$temp = $_FILES[ ‘ image ’ ][ ‘tmp_name’\
    \ ] ;\n$size = $_FILES[ ‘ image ’ ][ ‘size’ ] ;\n```\n\n![image](Image00039.jpg)\
    \ Now, insert statements to ensure the selected file is of a desired file type\
    \ by testing the file extension, or quit\n\n```php\n$ext = pathinfo( $name , PATHINFO_EXTENSION\
    \ ) ;\n$ext = strtolower( $ext ) ;\nif( $ext != ‘png’ && $ext != ‘jpg’ && $ext\
    \ != ‘gif’ )\n{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }\n```\n\n![image](Image00040.jpg)\
    \ Insert a statement to ensure the selected file is of a desired file size, or\
    \ quit\n\n```php\nif( $size > 512000 )\n{ echo ‘File size must not exceed 500Kb’\
    \ ; exit() ; }\n```\n\n![image](Image00019.jpg) The PHP configuration must permit\
    \ file uploads for this example to work. The configuration file `php.ini`, within\
    \ the PHP directory, must contain a line `file`.\n\nThe `pathinfo()` function\
    \ provides the extension. ![image](Image00005.jpg) Insert a statement to ensure\
    \ the selected file is of a desired file size, or quit.\n\n```php\nif( file_exists(\
    \ $name ) )\n{ echo ‘File already exists’ ; exit(); }\n```\n\n![image](Image00041.jpg)\
    \ Notice the `pathinfo()` function provides the extension. ![image](Image00005.jpg)\
    \ Insert a statement to ensure the selected file is of a desired file size, or\
    \ quit.\n\n```php\nif( file_exists( $name ) )\n{ echo ‘File already exists’ ;\
    \ exit(); }\n```\n\n![image](Image00042.jpg) Finally, attempt to upload the file.\n\
    \n```php\ntry {\n    if (move_uploaded_file($temp, \"/htdocs/\" . $name)) {\n\
    \        echo \"Upload successful\";\n    }\n} catch (Exception $e) {\n    echo\
    \ \"Error: \" . $e->getMessage();\n}\n```\n"
