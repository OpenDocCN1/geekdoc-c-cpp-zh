  trans: "\n\n![image](img/Image00017.jpg) 将文档保存到您的 Web 服务器的 `/htdocs` 目录下并命名为 `write.php`，然后通过\
    \ HTTP 打开页面，以确认文本文件已写入。\n\n![image](img/Image00144.jpg)\n\n![image](img/Image00026.jpg)\
    \ 使用文件资源管理器进入您的 Web 服务器的 `/htdocs` 目录，查看 PHP 脚本创建的文件。\n\n![image](img/Image00145.jpg)\n\
    \n![image](img/Image00027.jpg) 打开文件查看 PHP 脚本写入的文本。\n\n![image](img/Image00146.jpg)\n\
    \n![image](img/Image00005.jpg)\n\n你可以反复运行此示例，每次它都会擦除内容然后重新写入。\n\n## 追加文本\n\n一旦创建了指定了追加模式的“文件流”对象，就可以打开文本文件并向其末尾添加文本。可以通过向\
    \ PHP 的 `fwrite()` 函数指定文件流和文件名来向文件中追加文本。该过程与写入文件相同，不同之处在写入文件之前，文件指针被置在现有内容的末尾：\n\
    \n![image](img/Image00029.jpg)\n\nappend.php\n\n![image](img/Image00008.jpg) 开始一个\
    \ PHP 脚本，使用语句分配文本，包括用于格式化的非打印字符。\n\n```php\n<?php\n$info = \"\\r\\n\\r\\n\\tThe\
    \ Ballad of Reading Gaol” ;\n$info .= “r\\n\\t\\t\\tOscar Wilde 1898” ;\n```\n\
    \n![image](img/Image00010.jpg) 接下来，为要写入的文件命名。\n\n```php\n$filename = ‘poem.txt’\
    \ ;\n```\n\n![image](img/Image00012.jpg) 尝试以追加模式打开纯文本文件，如果失败则退出脚本。\n\n```php\n\
    $filestream = fopen( $filename , ‘a’ ) or die( ‘Unable to open file!’ ) ;\n```\n\
    \n![image](img/Image00014.jpg) 写入文本并显示总共追加字节数的确认。\n\n```php\n$num = fwrite( $filestream\
    \ , $info ) ;\nif( $num )\n{\n    echo “ $num bytes appended to $filename ” ;\n\
    }\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流。\n\n```php\nfclose( $filestream\
    \ ) ;\n```\n\n![image](img/Image00017.jpg) 将文档保存到您的 Web 服务器的 `/htdocs` 目录下并命名为\
    \ `append.php`，然后通过 HTTP 打开页面，以确认文本已追加到文件中。\n\n![image](img/Image00147.jpg)\n\n\
    ![image](img/Image00006.jpg)\n\n记住非打印字符必须包含在双引号中才能被解释。\n\n![image](img/Image00026.jpg)\
    \ 进入您的 Web 服务器的 `/htdocs` 目录并打开文件查看 PHP 脚本追加的文本。\n\n![image](img/Image00148.jpg)\n\
    \n## 覆盖文本\n\n需要重要的是，当您以写入模式写入现有文件时，它将覆盖任何现有内容：\n\n![image](img/Image00029.jpg)\n\
    \noverwrite.php\n\n![image](img/Image00008.jpg) 开始一个 PHP 脚本，尝试以写入模式打开一个现有文本文件，如果失败则退出脚本。\n\
    \n```php\n<?php\n$filestream = fopen( ‘poem.txt’ , ‘w’ ) or die( ‘Unable to open\
    \ file!’ ) ;\n```\n\n![image](img/Image00010.jpg) 成功后，向文件写入新文本。\n\n```php\nfwrite(\
    \ $filestream , ‘Overwritten!’ ) ;\n```\n\n![image](img/Image00012.jpg) 现在，记得关闭文件流。\n\
    \n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg) 将文档保存到您的\
    \ Web 服务器的 `/htdocs` 目录下并命名为 `overwrite.php`，然后通过 HTTP 打开页面并重新打开文本文件，查看其内容已被覆盖。\n\
    \n![image](img/Image00149.jpg)\n\n![image](img/Image00019.jpg) 写入文件时要小心，因为很容易不小心覆盖。\n\
    \n## 错误处理\n\n你可以预测可能的错误并在使用 `die()` 函数或 `exit()` 函数在错误发生时终止正在运行的脚本。如果没有这种应急措施，默认\
    \ PHP 错误处理器在发生错误时会提供一条有用但不美观的消息。例如，使用 `fopen( ‘nonsuch.txt’ , ‘r’ )` 打开一个不存在的文件：\n\
    \n![image](img/Image00150.jpg)\n\n![image](img/Image00005.jpg)\n\n`die()` 和 `exit()`\
    \ 函数在 PHP 中执行相同的操作，但它们的术语可能具有不同的吸引力。对于某些人来说，检测到错误时使用 `die()` 可能更合适，而 `exit()`\
    \ 在其他场景下可能更适合退出。\n\n在发生错误时终止脚本并不总是如所愿，但你可以创建一个自定义的错误处理器，以提供比默认 PHP 错误处理器更具用户友好的消息。自定义错误处理器仅仅是一个函数：\n\
    \n```php\nfunction error_handler( $level, $message, $file, $line )\n{\n    switch(\
    \ $level )\n    {\n        case 2: $str = \"Warning\";\n        case 8: $str =\
    \ \"Notice\";\n        default: $str = \"Error\";\n    }\n    echo \"$str: $message\
    \ in $file on $line\";\n}\n```\n\n基础错误级别列表如下：\n\n| 级别 | 常量 | 描述 |\n| :--- | :---\
    \ | :--- |\n| 2 | E_WARNING | 警告 |\n| 8 | E_NOTICE | 通知 |\n| 256 | E_ERROR | 错误\
    \ |\n| 512 | E_USER_WARNING | 用户警告 |\n| 1024 | E_USER_NOTICE | 用户通知 |\n| 2048\
    \ | E_USER_ERROR | 用户错误 |\n\n`set_error_handler()` 函数用于注册处理器：\n\n现在我们可以使用 `trigger_error()`\
    \ 函数手动触发错误。\n\n```php\nset_error_handler(\"error_handler\");\ntrigger_error(\"\
    这是一个自定义错误\", E_USER);\n```\n\n"
- fmt: "\n![image](Image00008.jpg)  Begin a PHP script by defining a function that\
    \ will throw an exception when a conditional test fails\n\n```php\n<?php\nfunction\
    \ check_size( $num )\n{\n    if( $num < 10 )\n    { \n        throw new Exception(\
    \ “Number : $num<br>Value must exceed 10” ) ; \n    }\n}\n?>\n```\n\n![image](Image00010.jpg)\
    \  Anticipate a specific error and report the exception\n\n```php\ntry { check_size(\
    \ 5 ) ; }\ncatch( Exception $e )\n{\n    echo ‘<b>Size Exception!</b><br>’. $e->getMessage()\
    \ .’<hr>’ ;\n}\n```\n\n![image](Image00012.jpg)  Next, create a custom exception\
    \ handler class\n\n```php\nclass CustomException extends Exception\n{\n    public\
    \ function get_details ()\n    {\n        $details = ‘ File : ‘ . $this -> getFile\
    \ ().\n        ‘<br>Line : ‘ . $this -> getLine ().\n        ‘<br>’ . $this ->\
    \ getMessage () ;\n        return $details ;\n    }\n}\n```\n\n![image](Image00014.jpg)\
    \  Now, add another function that will throw an exception when a conditional test\
    \ fails\n\n```php\nfunction check_parity ( $num )\n{\n    if( $num % 2 !== 0 )\n\
    \    {\n        throw new CustomException ( “Number : $num <br>Value must be even”\
    \ ) ;\n    }\n}\n```\n\n![image](Image00015.jpg)  Finally, anticipate a specific\
    \ error and report the exception\n\n```php\ntry { check_parity ( 5 ) ; }\ncatch(\
    \ CustomException $e )\n{\n    echo ‘<b>Parity Exception!</b><br>’ . $e -> get_details\
    \ (). ’<hr>’ ;\n}\n```\n\n![image](Image00017.jpg)  Save the document in your\
    \ web server’s `/htdocs` directory as `exception.php` then open the page via HTTP\
    \ to see the exceptions caught and appropriate message details\n\n![image](Image00153.jpg)\n\
    \n![image](Image00006.jpg)\n\nFor more on derived classes and inheritance see\
    \ [here](#text00009.html_sec50) .\n\n![image](Image00005.jpg)\n\nA `try` block\
    \ can contain multiple `throw` statements to anticipate multiple error conditions,\
    \ and can be followed by multiple `catch` blocks to handle those exceptions.\n\
    \n### Summary\n\n- The `fopen()` function is used to create a filestream object\
    \ and requires two arguments to specify a file name and a file mode\n- It is good\
    \ practice to provide an alternative with the `die()` function in case an attempt\
    \ to create a filestream fails\n- The `fread()` function is used to read a filestream\
    \ created using the `r` file mode, and the `filesize()` function can be used to\
    \ specify the byte size of the file\n- Upon completion of any file operation the\
    \ filestream must be destroyed by calling the `fclose()` function\n- The `fgets()`\
    \ function can be used to read a file line-by-line and the `feof()` function can\
    \ recognize the end of a file\n- The `fgetc()` function can be used to read a\
    \ file character-by-character and will return false at the end of the file\n-\
    \ Text can be written into a file by specifying the filestream and the file name\
    \ as arguments to the `fwrite()` function\n- The `fwrite()` function will overwrite\
    \ existing text using the `w` file mode but will append text when using the `a`\
    \ file mode\n- The name of a function can be specified as the argument to the\
    \ `set_error_handler()` function to nominate it as a custom error handler\n- The\
    \ error handler function is called when an error occurs or can be called explicitly\
    \ using the `trigger_error()` function\n- An exception is thrown when a specific\
    \ error condition occurs\n- If an exception is not caught, PHP will treat it as\
    \ a fatal error and issue an Uncaught Exception message\n- A `try` code block\
    \ is used to anticipate a specific error and its associated `catch` block is used\
    \ to determine how the script should proceed when that error occurs\n- An `Exception`\
    \ class object has `getMessage()`, `getFile()`, and `getLine()` methods that can\
    \ retrieve exception details\n- A custom exception handler can be created as a\
    \ derived class of the `Exception` class to provide custom exception methods\n\
    \n# Producing forms\n\n*This chapter demonstrates how to use PHP scripts to process\
    \ HTML form data.*\n\n- [Performing actions](#text00011.html_sec62)\n- [Checking\
    \ set values](#text00011.html_sec63)\n- [Validating form data](#text00011.html_sec64)\n\
    - [Filtering data](#text00011.html_sec65)\n- [Sending hidden data](#text00011.html_sec66)\n\
    - [Handling submissions](#text00011.html_sec67)\n- [Making sticky forms](#text00011.html_sec68)\n\
    - [Uploading files](#text00011.html_sec69)\n- [Surrounding forms](#text00011.html_sec70)\n\
    - [Appending data](#text00011.html_sec71)\n- [Summary](#text00011.html_sec72)\n\
    \n## Performing actions\n\nForm submission methods may be either “GET” or “POST”.\
    \ The **GET** method appends name=value pairs to the URL but is mostly used to\
    \ request information – such as retrieving a database record. The **POST** method\
    \ can submit more data, is more secure as the data is not appended to the URL,\
    \ and is mostly used when an action is to be performed – such as updating a database\
    \ record. The **POST** method is therefore preferred for most examples in this\
    \ book.\n\n## Checking set values\n"
