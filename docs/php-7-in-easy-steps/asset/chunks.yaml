  trans: "\n\n```html\n<input type=”text” name=” email ” value=” <?php if ( isset(\
    \ $_POST[ ‘email’ ] ) ) echo $_POST[ ‘email’ ] ; ?> ”></p>\n<p><input type=”submit”></p>\n\
    </form>\n```\n![image](img/Image00037.jpg) 现在，添加一个 PHP 脚本来处理表单提交\n\n```php\n<?php\n\
    if ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// 在此处插入语句（步骤 3-5）。\n}\n?>\n\
    ```\n\n![image](img/Image00038.jpg) 下，在 PHP 脚本块中插入一个语句，创建一个用于错误消息的数组\n\n```php\n\
    $errors = array() ;\n```\n\n![image](img/Image00005.jpg) 本示例使用 `$_SERVER[ ‘PHP_SELF’\
    \ ]` 来确保脚本在被重命名后仍然可以工作。\n\n![image](img/Image00006.jpg) `if` 语句通过检查请求方法是否为 `POST`\
    \ 来测试表单是否已提交，而不是用于显示空表单的 `GET` 方法。\n\n![image](img/Image00039.jpg) 然后，插入语句用提交的值初始化变量，或者为了遗漏项将其添加到错误数组\n\
    \n```php\nif ( empty( $_POST[ ‘name’ ] ) ) { $errors[] = ‘name’ ; }\nelse { $name\
    \ = trim( $_POST[ ‘name’ ] ) ; }\nif ( empty( $_POST[ ‘email’ ] ) ) { $errors[]\
    \ = ‘email’ ; }\nelse { $email = trim( $_POST[ ‘email’ ] ) ; }\n```\n\n![image](img/Image00040.jpg)\
    \ 现在，插入语句来写入错误消息或确认表单成功提交\n\n```php\nif( !empty( $errors ) )\n{ echo ‘Error! Please\
    \ enter your ‘ ;\nforeach ( $errors as $msg ) { echo “ - $msg “ ; } }\nelse {\
    \ echo “Success! Thanks $name “ ; }\n```\n\n![image](img/Image00041.jpg) 将文档保存到你\
    \ Web 服务器的 `/htdocs` 目录中并命名为 `sticky.php`，然后通过 HTTP 打开并提交表单以查看保留的值和响应消息。\n\n![image](img/Image00170.jpg)\n\
    ![image](img/Image00171.jpg)\n![image](img/Image00005.jpg) 使用 `trim()` 函数是一个良好的做法，如此处所示，它可以移除字段值开头和结尾的空格。\n\
    \n### 上传文件\n\n如果 `<form>` 标签包含设置为“multipart/formdata”的 `enctype` 属性，PHP `$_FILES`\
    \ 超全局变量可以轻松地从 HTML 表单 `POST` 文件上传。提交时，会创建一个 `$_FILES` 关联数组，其键包括文件 `name`、生成的临时名称（`tmp_name`）和文件\
    \ `size`。文件名和大小可用于验证。然后可以将临时文件名连原始文件名一起传递 `move_uploaded_file()` 函数以上传文件：\n\n\
    ![image](img/Image00029.jpg)\n\nupload.php\n\n![image](img/Image00036.jpg) 创建一个包含带有持久化表单的\
    \ HTML 文档，其中包含一个名为“image”的文件类型输入框\n\n```html\n<form action=” <?php $_SERVER[ ‘PHP_SELF’\
    \ ] ?>” method=”POST” enctype = “multipart/formdata” >\nSelect an image to upload\
    \ :\n<input type=”file” name=” image ” >\n<input type=”submit” value=”Upload Image”>\
    \ </form>\n```\n\n![image](img/Image00037.jpg) 现在，添加一个 PHP 脚本来处理表单提交\n\n```php\n\
    <?php\nif ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )\n{\n// 在此处插入语句（步骤 3-7）。\n\
    }\n?>\n```\n\n![image](img/Image00038.jpg) 下，插入语句用关于用户选择的文件信息来初始化三个变量\n\n```php\n\
    $name = $_FILES[ ‘ image ’ ][ ‘name’ ] ;\n$temp = $_FILES[ ‘ image ’ ][ ‘tmp_name’\
    \ ] ;\n$size = $_FILES[ ‘ image ’ ][ ‘size’ ] ;\n```\n\n![image](img/Image00039.jpg)\
    \ 现在，插入语句通过测试文件扩展名来确保所选文件是所需的文件类型，否则退出\n\n```php\n$ext = pathinfo( $name , PATHINFO_EXTENSION\
    \ ) ;\n$ext = strtolower( $ext ) ;\nif( $ext != ‘png’ && $ext != ‘jpg’ && $ext\
    \ != ‘gif’ )\n{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }\n```\n\n![image](img/Image00040.jpg)\
    \ 插入一个语句确保所选文件是所需的文件大小，否则退出\n\n```php\nif( $size > 512000 )\n{ echo ‘File size\
    \ must not exceed 500Kb’ ; exit() ; }\n```\n\n![image](img/Image00019.jpg) PHP\
    \ 配置必须允许文件上传，此示例才能工作。PHP 目录下的配置文件 `php.ini` 必须包含一行 `file`。\n\n`pathinfo()` 函数提供了扩展名。![image](img/Image00005.jpg)\
    \ 插入一个语句来确保所选文件是所需的文件大小，否则退出。\n\n```php\nif( file_exists( $name ) )\n{ echo ‘File\
    \ already exists’ ; exit(); }\n```\n\n![image](img/Image00041.jpg) 注意 `pathinfo()`\
    \ 函数提供了扩展名。![image](img/Image00005.jpg) 插入一个语句来确保所选文件是所需的文件大小，否则退出。\n\n```php\n\
    if( file_exists( $name ) )\n{ echo ‘File already exists’ ; exit(); }\n```\n\n\
    ![image](img/Image00042.jpg) 最后，尝试上传文件。\n\n```php\ntry {\n    if (move_uploaded_file($temp,\
    \ \"/htdocs/\" . $name)) {\n        echo \"Upload successful\";\n    }\n} catch\
    \ (Exception $e) {\n    echo \"Error: \" . $e->getMessage();\n}\n```\n\n"
- fmt: "\n```css\np#err_msg { color : #F00 ; font-weight : bold ; }\n```\n\n![image](Image00040.jpg)\
    \ Save the style sheet in the `/includes` folder you have created, alongside the\
    \ HTML header and footer files.\n\n![image](Image00041.jpg) Finally, create a\
    \ PHP script that sets the web page title and surrounds a form with header and\
    \ footer content.\n\n```php\n<?php\n$page_title = ‘PHP Include’ ;\ninclude ( ‘includes/header.html’\
    \ ) ;\necho ‘<form action=” include.php ” method=” POST ”>\n<p>Name: <input type=”text”\
    \ name=” name ”> </p>\n<p>Email: <input type=”text” name=” email ” ></p>\n<p><input\
    \ type=”submit”></p></form>’ ;\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\
    \n![image](Image00029.jpg)\n\n`include.php`\n\n![image](Image00042.jpg) Save the\
    \ PHP script in your web server’s `/htdocs` directory as `include.php` then open\
    \ it via HTTP to see the page title set and a form surrounded by static content.\n\
    \n![image](Image00176.jpg)\n\n![image](Image00005.jpg) You can use your browser’s\
    \ View Source facility to see that the entire content has been effectively incorporated\
    \ into a single web page.\n\n## Appending link data\n\nPHP pre-defined “superglobal”\
    \ variables, such as the `$_SERVER` array variable that stores the page request\
    \ method and the `$_SESSION` array variable that stores user data across pages\
    \ of a website until the user quits, are accessible in all scopes of any script.\n\
    \n![image](Image00005.jpg) The `$_SESSION` superglobal will be used to store user\
    \ details in [Chapter 10](#text00012.html).\n\nWhere an HTML form submits data\
    \ using the `POST` method, the `$_POST` array stores the value of submitted form\
    \ values in like-named array elements. So the value of a submitted field named\
    \ “city” can be accessed using `$_POST[‘city’]`.\n\nSimilarly, where data is submitted\
    \ using the `GET` method, the `$_GET` array stores the value of submitted values\
    \ in named array elements. So the value of a submitted data named “id” can be\
    \ accessed using `$_GET[‘id’]`. This is typically used to submit data to a script\
    \ by appending a name=value pair to the URL in an HTML hyperlink anchor like this:\n\
    \n```html\n<a href=”www.example.com/script.php?id=1”>\n```\n\nThe script receiving\
    \ the data, nominated by the hyperlink, may then use the passed value to determine\
    \ a response:\n\n![image](Image00029.jpg)\n\n`link.php`\n\n![image](Image00036.jpg)\
    \ Create an HTML document containing a PHP script that seeks an element named\
    \ “id” within the `$_GET` array.\n\n```php\n<?php\nif ( isset ( $_GET[ ‘id’ ]\
    \ )\n{\n    # Handler statements to be inserted here (steps 2-3).\n}\n```\n\n\
    ![image](Image00037.jpg) Next, insert a handler statement to assign a passed value\
    \ to a like-named PHP variable.\n\n```php\n$id = $_GET[ ‘id’ ] ;\n```\n\n![image](Image00038.jpg)\
    \ Now, insert a handler statement to output an appropriate response according\
    \ to the value passed.\n\n```php\nswitch( $id )\n{\n    case 1 : echo ‘Cow selected<hr>’\
    \ ; break ;\n    case 2 : echo ‘Dog selected<hr>’ ; break ;\n    case 3 : echo\
    \ ‘Goat selected<hr>’ ; break ;\n}\n```\n\n![image](Image00039.jpg) Finally, add\
    \ statements to display hyperlinks with appended values.\n\n```php\necho ‘<h1>Select\
    \ a buddy</h1>’ ;\necho ‘ <p><a href=”link.php? id=1 ”>Cow</a> |’ ;\necho ‘ <a\
    \ href=”link.php? id=2 ”>Dog</a> | ‘ ;\necho ‘ <a href=”link.php? id=3 ”>Goat</a></p>’\
    \ ;\n?>\n```\n\n![image](Image00040.jpg) Save the PHP script in your web server’s\
    \ `/htdocs` directory as `link.php` then open it via HTTP and click the links\
    \ to see the responses for the passed values.\n\n![image](Image00177.jpg)\n\n\
    ![image](Image00178.jpg)\n\n![image](Image00019.jpg) PHP also provides a `$_REQUEST`\
    \ superglobal that contains the entire contents of the `$_POST` and `$_GET` arrays.\
    \ This means that `$_POST[‘city’]` is also accessible using `$_REQUEST[‘city’]`\
    \ but this should be avoided. Always use the specific array for the type of submission\
    \ instead.\n\n![image](Image00006.jpg) Notice that the passed name=value pair\
    \ is visible in the browser address field.\n\n## Summary\n\n- An HTML `<form>`\
    \ tag’s `action` attribute specifies the PHP script to handle the form submission,\
    \ and its `method` attribute specifies how the data is sent to the script.\n-\
