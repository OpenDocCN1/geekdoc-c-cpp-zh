    \ $array ) ;`\n\nDo not use the `sort()` or `rsort()` functions where the keys\
    \ are important.\n\n### Checking types\n\nThe data type of any item can be checked\
    \ by specifying it as the argument to `gettype()` function. For example, where\
    \ a variable `$num` contains an integer, `gettype($num)` will return “integer”\
    \ and where a variable `$str` contains a string, `gettype($str)` will return “string”,\
    \ and so on. Where the data type cannot be identified, `gettype()` will return\
    \ “unknown type”.\n\n- `bool` – Boolean value, which is only true or false\n-\
    \ `array` – an ordered map of keys to values\n- `int` – integer\n- `NULL` – a\
