    * 多行块注释必须封装在 `/***` 和 `***/**` 字符序列之间。


    # 存储值

    *本章演示了可以存储数据的各种 PHP 容器。*


    * 创建变量

    * 引用字符串

    * 生成数组

    * 数组排序

    * 描述维度

    * 检查类型

    * 定义常量

