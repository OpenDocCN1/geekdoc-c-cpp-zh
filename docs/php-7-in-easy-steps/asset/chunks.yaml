    ```\n\n![image](img/Image00055.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `session_form.html`，然后通过\
    \ HTTP 打开页面以查看表单\n\n![image](img/Image00190.jpg)\n\n![image](img/Image00019.jpg)\n\
    \n只有在页面顶部调用了 `session_start()` 函数，PHP 脚本才能访问会话变量。\n\n### 设置会话\n\n接收表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用\
    \ `ctype_alpha()` 函数确认它们仅包含字母，并可以使用 `preg_match()` 函数确认值是否匹配指定模式。一旦验证通过，可以将提交的字段名称和值赋值给\
    \ `$_SESSION` 全局数组变量的元素。成功完成后，脚本可以使用 `header()` 函数指定该页面的 URL，将浏览器重定向到下一个页面：\n\n\
    ![image](img/Image00029.jpg)\n\nsession_set.php\n\n![image](img/Image00054.jpg)\
    \  添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start(); ?>\n```\n\n![image](img/Image00055.jpg)\
    \  开始一个 PHP 脚本来处理失败的验证尝试\n\n```php\n<?php\nfunction reject ( $entry )\n{\n  echo\
    \ “Invalid $entry <br>” ;\n  echo ‘Please <a href=” session_form.html ”>Log In</a>’\
    \ ;\n  exit() ;\n}\n```\n\n![image](img/Image00056.jpg)  添加条件测试块以为有效数据设置两个 cookie，或调用函数处理失败尝试\n\
    \n```php\nif( isset( $_POST[ ‘user’ ] ) )\n{\n  $user = trim( $_POST[ ‘user’ ]\
    \ ) ;\n  if( !ctype_alpha( $user ) ) { reject( ‘User Name’ ) ; }\n  if( isset(\
    \ $_POST[ ‘pass’ ] ) )\n  {\n    $pass = trim( $_POST[ ‘pass’ ] ) ;\n    if( !preg_match(\
    \ ‘/^[A-Za-z0-9._]{8,}$/’ , $pass ) )\n    { reject( ‘Password’ ) ; }\n    else\n\
    \    {\n      $_SESSION[ ‘user’ ] = $user ;\n      $_SESSION[ ‘pass’ ] = $pass\
    \ ;\n      header( ‘Location: session_get.php ’ ) ;\n    }\n  }\n} else { header(\
    \ ‘Location: session_form.html ’ ) ; }\n?>\n```\n\n![image](img/Image00057.jpg)\
    \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `session_set.php`，然后查看如何检索数据\n\n![image](img/Image00006.jpg)\n\
    \n`ctype_alpha()` 函数仅在其参数包含字母时返回 true。\n\n![image](img/Image00005.jpg)\n\n`preg_match()`\
    \ 函数接受一个正则表达式和一个字符串参数。正则表达式超出了本书的涵盖范范围，但你可以精确地复制此示例，以允许表单上描述的许可密码模式。在此示例中，密码未加密，以便在稍后演示用户密码符合指定要求。\n\
    \n### 获取会话\n\n在调用 `session_start()` 函数后，就可以通过特殊的 `$_SESSION` 全局数组变量访问会话数据。PHP\
    \ `isset()` 函数可以查找指定名称的元素。当这确认元素存在时，可以将其值很有用地赋值给普通的脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果查找的元素不存在，脚本可以为用户提供备选方案：\n\
    \n![image](img/Image00029.jpg)\n\nsession_get.php\n\n![image](img/Image00054.jpg)\
    \  添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start() ; ?>\n```\n\n![image](img/Image00055.jpg)\
    \  现在，开始一个 PHP 脚本来查找会话变量并在成功后检索数据进行输出，或者在会话变量不存在时提供备选方案\n\n```php\n<?php\nif(\
    \ isset( $_SESSION[ ‘user’ ] ) )\n{\n  $user = $_SESSION[ ‘user’ ] ;\n  echo “<h1>Welcome\
    \ $user !</h1><hr>” ;\n  echo ‘<a href=” session_data.php ”>View Session</a>’\
    \ ;\n}\nelse\n{ echo ‘Please <a href=” session_form.html ”>Log In</a>’ ; }\n?>\n\
    ```\n\n![image](img/Image00056.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `session_get.php`\n\
    \n![image](img/Image00057.jpg)  现在，打开 HTML 表单 `session_form.html`（在此处 创建），通过 HTTP\
    \ 访问 `session_form.html` 目标并提交以查看验证失败\n\n![image](img/Image00191.jpg)\n\n![image](img/Image00058.jpg)\
    \  返回 HTML 表单并提交用户名查看验证失败\n\n![image](img/Image00192.jpg)\n\n![image](img/Image00061.jpg)\
    \  再次返回 HTML 表单并提交用户名查看验证失败\n\n![image](img/Image00193.jpg)\n\n![image](img/Image00194.jpg)\
    \  再次提交一次有效的用户名和密码查看验证成功\n\n![image](img/Image00184.jpg)  查看 `session_data.php`\
    \ 中存储的会话变量\n\n![image](img/Image00055.jpg)  注意必须调用 `session_start()` 函数。\n\n###\
    \ 查看会话数据\n\n在调用 `session_start()` 函数后，就可以通过特殊的 `$_SESSION` 全局数组变量访问会话数据。PHP `isset()`\
    \ 函数可以查找指定名称的元素。当这确认元素存在时，可以将其值很有用地赋值给普通的脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果查找的元素不存在，脚本可以为用户提供备选方案：\n\
    \n`$_SESSION` 全局数组存储了键和值。可以使用 `session_id()` 函数查看每个会话。此外，可以使用 `unset()` 函数移除每个会话变量，并通过调用\
    \ `session_destroy()` 函数完全终止会话：\n\n```php\n<?php\nfunction kill_session()\n{\n\
    \  unset( $_SESSION[ ‘user’ ] )\n  unset( $_SESSION[ ‘pass’ ] ) ;\n  session_destroy()\
    \ ;\n  echo ‘<hr>Session Destroyed<br>’ ;\n  echo ‘Session ID : ‘ .session_id().’<br>\
    \ ;\n  var_dump( $_SESSION ) ;\n}\n```\n\n现在，添加一个测试来检查是否设置了会话变量\n\n```php\nif(\
    \ count( $_SESSION ) > 0 )\n{\n  echo ‘<dl> ;\n  foreach( $_SESSION as $key =>\
    \ $value )\n  {\n    echo “<dt>Key: $key ” ; echo “<dd>Value: $value ” ;\n  }\n\
    \  echo ‘</dl><hr> ;\n  // 在此处插入语句（步骤 4）。\n}\n```\n\n你可以随时为会话变量分配新值以覆盖现有的存储值。\n\
    \n```php\nelse\n{\n  echo ‘Please <a href=” session_form.html ”>Log In</a>’ ;\n\
    }\n?>\n```\n\n"
- fmt: "\n![image](Image00197.jpg) Use the ![image](Image00198.jpg) Refresh button\
    \ in your browser to reload this page to see the alternative “Please Log In” content\n\
    \n![image](Image00005.jpg)\n\nNotice that the password adheres to the permissible\
    \ pattern.\n\n## Summary\n\n- The PHP `set_cookie()` function can be used to store\
    \ user data on the client machine for use across the pages of a website\n- There\
    \ should be at least three arguments supplied to the `set_cookie()` function to\
    \ specify name, value and expiry time\n- HTML form submissions via the `POST`\
    \ method automatically assign field data to the PHP `$_POST` global array variable\n\
    - The `isset()` function can seek an element of a specified HTML field name within\
    \ the `$_POST` global array\n- The `ctype_alnum()` function can be used to confirm\
    \ a value only contains alphanumeric data for validation\n- A hash conversion\
    \ can be made of a password value using the `md5()` function for encryption\n\
    - The PHP `header()` function can specify a Location:URL to relocate the browser\n\
    - Once cookies are set, they are automatically assigned to the special PHP `$_COOKIE`\
    \ global array variable\n- User data can be stored on the server in the PHP `$_SESSION`\
    \ global array variable as an alternative to cookie storage\n- To use sessions,\
    \ each PHP page must call the `session_start()` function at the top of the page\
    \ before any HTML tags\n- HTML field data submitted to the `$_POST` global array\
    \ can be assigned to a `$_SESSION` global variable array element\n- The `ctype_alpha()`\
    \ function can be used to confirm a value only contains alphabetic letter data\
    \ for validation\n- The `preg_match()` function can be used to confirm a value\
    \ matches a specified pattern for validation\n- Each session has a unique session\
    \ ID number, which can be seen using the PHP `session_id()` function\n- Session\
    \ variables can be removed using the `unset()` function and a session can be terminated\
