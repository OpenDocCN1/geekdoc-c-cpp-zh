    ## Preserving data\n\nData entered by a user is frequently required across pages\
    \ of a website. User data can be conveniently stored in small “cookie” files on\
    \ the client machine, so the user need tediously enter the same data repeatedly.\
    \ The PHP `setcookie()` function makes it easy to create a cookie by specifying\
    \ three arguments:\n\n```\nsetcookie( *name , value , expiry-time* )\n```\n\n\
    ![image](Image00005.jpg) The `setcookie()` function can also accept further optional\
    \ arguments to specify visible path, visible domain, https security, and visibility\
    \ for http access only.\n\nWhen an HTML form is submitted to the server using\
    \ the `POST` method, its field data is automatically assigned to the special PHP\
    \ `$_POST` global array. A script can check for the presence of individual submission\
    \ fields using a built-in PHP `isset()` function. When this confirms the field\
    \ is indeed present, its name and value can usefully stored in a cookie. This\
