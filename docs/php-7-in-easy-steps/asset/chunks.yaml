    can also use the **.=** concatenating assignment operator to append one string
    onto another string.


    **Grasping precedence**


    PHP operator precedence determines how expressions are grouped for evaluation.
    For example, the expression **1 + 5 * 3** evaluates to 16, not 18, because the
    ***** multiplication opreator has a higher precedence than the **+** addition
    operator. Parentheses can be used to specify precedence, so that **(1 + 5) * 3**
    evaluates to 18\. When operators have equal precedence their “associativity” determines
    how expressions are grouped. For example, the - subtraction operator is left-associative,
    so **8 - 4 - 2** is grouped as **(8 - 4) - 2** and evaluates to 2. The table below
    lists common operators in order of precedence, with the highest-precedence ones
    at the top. Operators on the same line have equal precedence, so operator associativity
    determines how expressions are grouped.


    | **Operator:** | **Associativity:** |


    | ****** | **Right** |


    | **++ -- ~** | **Right** |


    | **!** | **Right** |


    | *** / %** | **Left** |


    | **+ - .** | **Left** |


    | **<< >>** | **Left** |


    | **< <= > >=** | **None** |


    | **== != === !== <> <=>** | **None** |


    | **&** | **Left** |


    | **^** | **Left** |


    | **&#124;** | **Left** |


    | **&&** | **Left** |


    | **&#124;&#124;** | **Left** |


    | **??** | **Right** |


    | **?=** | **Left** |


    | **=+= -= *= /= **= .= %= &= &#124;= ^= <<= >>= =>** | **Right** |


    | **and** | **Left** |


    | **xor** | **Left** |


    | **or** | **Left** |


    | **,** | **Left** |


    ![image](Image00019.jpg)


    The eagle-eyed will notice that the alternative forms of logical operators have
    different levels of precedence. This can cause unexpected results in an expression
    such as **$bool = true and false** versus the alternative **$bool = true && false**
    . Try each of these then do **var_dump($bool)** to see the difference.


