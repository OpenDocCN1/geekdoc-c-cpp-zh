    \ the statement creating `pooch`:\n\n```php\n$pooch = new Dog ( 4 , 18 , ‘gray’\
    \ ) ;\n```\n\n![image](Image00119.jpg) The definition of a class is also known\
    \ as “implementation”.\n\n![image](Image00120.jpg) Also edit the statement creating\
    \ `rover`:\n\n```php\n$rover = new Dog ( ) ;\n```\n\n![image](Image00121.jpg)\
    \ Although the initial values are set by the constructor, setter methods can be\
