- fmt: "\n- Arithmetical operators can form expressions with operands for addition\
    \ `+`, subtraction `-`, multiplication `*`, division `/`, modulus `%`, and exponentiation\
    \ `**`. \n- The assignment operator `=` can be combined with any arithmetical\
    \ operator to perform an arithmetical calculation then assign the result.\n- Comparison\
    \ operators can form expressions with operands for equality `==`, inequality `!=`,\
    \ identicality or not `===`, `!==`, greater `>`, less `<`, greater, less or equal\
    \ `>=`, `<=`, and spaceship operator `<=>`.\n- The conditional operator `?:` evaluates\
    \ an expression for a `TRUE` or `FALSE` Boolean value, then returns one of two\
    \ specified results depending on the evaluation.\n- The `??` null coalescing operator\
    \ traverses operands from left to right and returns the first value that is not\
    \ null.\n- Logical operators `and`, `&&`, `or`, `||` and `xor` form expressions\
    \ evaluating two operands and return a value of true or false.\n- The logical\
    \ `!` not operator returns the inverse Boolean value of a single operand.\n- Bitwise\
    \ operators `|`, `&`, `~`, `^`, `<<` and `>>` allow the evaluation and manipulation\
    \ of specific bits within an integer.\n- Increment `++` or decrement `--` operators\
    \ that prefix a variable change its value by one and return the result.\n- Increment\
    \ `++` or decrement `--` operators that postfix a variable return its current\
    \ value, then change its value by one.\n- Operator precedence determines how expressions\
    \ are grouped for evaluation.\n- When operators have equal precedence, their associativity\
    \ determines how the expression is grouped for evaluation.\n- The `var_dump()`\
    \ function can be used to see the type and value resulting from an expression.\n\
    - The special `NULL` constant represents a variable that has no value whatsoever,\
    \ not even zero.\n\n# Testing conditions\n\nThis chapter demonstrates the various\
    \ PHP control structures that determine how a script will proceed.\n\nSeeking\
    \ truth | Providing alternatives | Switching branches | Performing loops | Looping\
    \ while true | Breaking from loops | Summary\n\n## Seeking truth\n\nThe `if` keyword\
    \ is used to perform the basic conditional test that evaluates a given expression\
    \ for a Boolean value of `TRUE` or `FALSE`. Statements within braces following\
    \ the evaluation will only be executed when the expression is found to be `TRUE`.\
    \ When the expression is found to be `FALSE`, the PHP parser simply moves on to\
    \ the next part of the script.\n\n![image](Image00005.jpg)\n\nThe `if` construct\
    \ is one of the most important features in PHP, and in most other programming\
    \ languages.\n\nThe syntax of an `if` conditional test statement looks like this:\n\
    \n```\nif ( test-expression ) { statement-to-execute-when-true ; }\n```\n\nThere\
    \ may be multiple statements to be executed when the test is `TRUE` but each statement\
    \ must be terminated by a semi-colon:\n\n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\n\
    ```\n\nMultiple expressions can be tested using the logical `&&` or `and` operator\
    \ to ensure that following statements will only be executed when both expressions\
    \ are found to be `TRUE`, like this:\n\n```php\nif ( ( test-expression ) && (\
    \ test-expression ) )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n}\n```\n\n![image](Image00005.jpg)\n\nWhen\
    \ the code to be executed is just a single statement, the braces may optionally\
    \ be omitted, but you may prefer to always include the braces for consistency.\n\
    \nAlternatively, `if` conditional test statements can be nested to test multiple\
    \ expressions so that statements will only be executed when all tests are found\
    \ to be `TRUE`, like this:\n\n```\nif ( test-expression )\n{\n    if ( test-expression\
    \ )\n    {\n        statement-to-execute-when-true;\n        statement-to-execute-when-true;\n\
    \        statement-to-execute-when-true;\n    }\n}\n```\n\nMultiple `if` conditional\
    \ test statements can be made to provide alternatives for the script to follow.\n\
    \n![image](Image00029.jpg)\n\nif.php\n\n![image](Image00067.jpg) Between PHP tags,\
    \ begin a script with a statement that initializes an integer variable:\n\n```php\n\
    <?php\n$num = 8 ;\n```\n\n![image](Image00068.jpg) Next, add statements that output\
    \ a result when a conditional test of numerical size is found to be `TRUE`:\n\n\
    ```php\nif ( $num > 5 ) { echo “$num exceeds 5<br>” ; }\nif ( $num <= 5 ) { echo\
    \ “ $num is below 6<br>” ; }\n```\n\n![image](Image00069.jpg) Now, add statements\
    \ that output a result when a conditional test of parity is found to be `TRUE`:\n\
    \n```php\nif ( $num % 2 == 0 ) { echo “$num is Even<br>” ; }\nif ( $num % 2 !=\
    \ 0 ) { echo “$num is Odd<br>” ; }\n```\n\n![image](Image00070.jpg) Between PHP\
    \ tags, begin a script with a statement that outputs a result only when a tested\
    \ expression is `TRUE`:\n\n```php\n<?php\nif ( 4 > 2 ) { echo ‘<p>Yes, 4 is greater\
    \ than 2 <br>’ ; }\n```\n\n![image](Image00068.jpg) Next, add a statement that\
    \ outputs a result only when two tested expressions are both found to be `TRUE`:\n\
    \n```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) ) {\n    // statements\n}\n```\n\n## Providing\
    \ alternatives\n\nIt is often preferable to extend an `if` statement by appending\
    \ an `else` statement, specifying statements within braces to be executed when\
    \ the expression is `FALSE`:\n\n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\n\
    else\n{\n    statement-to-execute-when-false;\n    statement-to-execute-when-false;\n\
    \    statement-to-execute-when-false;\n}\n```\n\n![image](Image00074.jpg) Alternative\
    \ expressions may also be evaluated in a conditional by adding an `elseif` statement,\
    \ specifying statements within braces to be executed when the alternative expression\
    \ is `TRUE`:\n\n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\n\
    elseif ( test-expression )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
    \    statement-to-execute-when-true;\n}\nelse\n{\n    statement-to-execute-when-false;\n\
    \    statement-to-execute-when-false;\n    statement-to-execute-when-false;\n\
    }\n```\n\nThis is a fundamental programming technique that offers the script different\
    \ directions in which to proceed, depending on the result of the evaluations,\
    \ and is known as “conditional branching”.\n\n![image](Image00005.jpg)\n\nThe\
    \ `elseif` keyword can also be written as two separate words: `else if`.\n\n![image](Image00019.jpg)\
    \ You may come across some PHP scripts that use a `:` colon character rather than\
    \ curly brackets. This is not recommended as `if` and `else if` will only be considered\
    \ exactly the same when using curly brackets.\n\n![image](Image00029.jpg)\n\n\
    else.php\n"
