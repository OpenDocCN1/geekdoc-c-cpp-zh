    Download the PHP setup package for your system from **[aprelium.com/downloads](http://www.aprelium.com/downloads)**.


    ![image](Image00020.jpg)  Run the downloaded executable to begin the installation.
    (Wait, the text says: "Run the setup installer and Agree the License terms...")


    ![image](Image00010.jpg)  Run the setup installer and **Agree** the License terms,
    then select the Abyss Web Server component and click **Next**.


    ![image](image](Image00021.jpg)


    ![image](Image00019.jpg)  If you are installing PHP on Windows, make sure to choose
