    initialize two variables with an integer and character value


    **<?php**


    **$number = 2 ; $letter = ‘B’ ;**


    ![image](Image00068.jpg)  Next, add a  **switch**  statement to match the integer
    value


    **switch ( $number )**


    **{**


    **case 1 : echo ‘Number is One<br>’ ; break ;**


