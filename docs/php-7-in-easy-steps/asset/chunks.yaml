    Strictly speaking, the topic of regular expressions is outside the remit of this
    book, but you can precisely copy the pattern in this example to ensure email addresses
    are in the expected format.


    **Filtering data**


    To validate user input easily, PHP provides a **filter_var()** function that can
    be used to both validate and “sanitize” input values. This function requires two
    arguments to specify the variable to be filtered and a constant name of the filter
    to be used:


    | **Filter Constant Name:** | **Convention:** |


    | **FILTER_VALIDATE_BOOLEAN** | Boolean value |


    | **FILTER_VALIDATE_EMAIL** | Email address format |


    | **FILTER_VALIDATE_FLOAT** | Floating-point number |


    | **FILTER_VALIDATE_INT** | Integer number |


    | **FILTER_VALIDATE_IP** | IP address format |


    | **FILTER_VALIDATE_MAC** | MAC address format |


    | **FILTER_VALIDATE_REGEXP** | Regular expression format |


    | **FILTER_VALIDATE_URL** | URL format |


    | **FILTER_SANITIZE_EMAIL** | Strip invalid characters |


    | **FILTER_SANITIZE_ENCODED** | URL-encode string |


    | **FILTER_SANITIZE_MAGIC_QUOTES** | Backslash-escape characters |


    | **FILTER_SANITIZE_NUMBER_FLOAT** | Strip all non-digits |


    | **FILTER_SANITIZE_NUMBER_INT** | Strip all non-digits |


    | **FILTER_SANITIZE_SPECIAL_CHARS** | HTML-escape ‘”<>& |


    | **FILTER_SANITIZE_STRING** | Strip HTML tags |


    | **FILTER_SANITIZE_URL** | Strip invalid characters |


    | **FILTER_CALLBACK** | Call a custom filter function |


    ![image](Image00006.jpg)


    The validation filters return **TRUE** when validation succeeds, otherwise they
    will return **FALSE** .


    ![image](Image00005.jpg)


    Some filters allow further options to be specified. For example, a numeric range
    can be specified to **FILTER_VALIDATE_INT** .


    ![image](Image00029.jpg)


    filter.php


    ![image](Image00036.jpg)  Create an HTML document containing a PHP script that
    begins by writing a styled HTML page heading


    **<?php**


    **$hdr = ‘<h1 style=”color:red”>PHP in easy steps</h1>’ ;**


    **echo $hdr ;**


    ![image](Image00037.jpg)  Next, sanitize the page heading by stripping the HTML
    tags to remove styling and display the stripped version


    **$hdr = filter_var( $hdr , FILTER_SANITIZE_STRING ) ;**


    **echo “Sanitized heading : $hdr ” ;**'
