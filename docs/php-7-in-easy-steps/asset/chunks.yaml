    <?php\nfunction check_size( $num )\n{\n    if( $num < 10 )\n    { \n        throw\
    \ new Exception( “Number : $num<br>Value must exceed 10” ) ; \n    }\n}\n?>\n\
    ```\n\n![image](img/Image00010.jpg)  预判特定的错误并报告异常\n\n```php\ntry { check_size(\
    \ 5 ) ; }\ncatch( Exception $e )\n{\n    echo ‘<b>Size Exception!</b><br>’. $e->getMessage()\
    \ .’<hr>’ ;\n}\n```\n\n![image](img/Image00012.jpg)  接下来，创建一个自定义异常处理器类\n\n```php\n\
    class CustomException extends Exception\n{\n    public function get_details ()\n\
    \    {\n        $details = ‘ File : ‘ . $this -> getFile ().\n        ‘<br>Line\
    \ : ‘ . $this -> getLine ().\n        ‘<br>’ . $this -> getMessage () ;\n    \
    \    return $details ;\n    }\n}\n```\n\n![image](img/Image00014.jpg)  现在，添加另一个在条件测试失败时抛出异常的函数\n\
    \n```php\nfunction check_parity ( $num )\n{\n    if( $num % 2 !== 0 )\n    {\n\
    \        throw new CustomException ( “Number : $num <br>Value must be even” )\
    \ ;\n    }\n}\n```\n\n![image](img/Image00015.jpg)  最后，预判特定的错误并报告异常\n\n```php\n\
    try { check_parity ( 5 ) ; }\ncatch( CustomException $e )\n{\n    echo ‘<b>Parity\
    \ Exception!</b><br>’ . $e -> get_details (). ’<hr>’ ;\n}\n```\n\n![image](img/Image00017.jpg)\
    \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `exception.php`，然后通过 HTTP 打开页面以查看捕获的异常和适当的消息详情\n\
    \n![image](img/Image00153.jpg)\n\n![image](img/Image00006.jpg)\n\n有关派生类和继承的更多信息请参阅此处。\n\
    \n![image](img/Image00005.jpg)\n\n`try` 块可以包含多个 `throw` 语句以预判多种错误情况，并可以跟随多个 `catch`\
    \ 块来处理这些异常。\n\n### 总结\n\n- `fopen()` 函数用于创建文件流对象，需要两个参数来指定文件名和文件模式\n- 良好的做法是使用\
    \ `die()` 函数提供备选方案，以防创建文件流失败\n- `fread()` 函数用于读取使用 `r` 模式创建的文件流，`filesize()` 函数可以指定文件的字节大小\n\
    - 在完成任何文件操作后，必须调用 `fclose()` 函数销毁文件流\n- `fgets()` 函数可以用于逐行读取文件，`feof()` 函数可以识别文件结束\n\
    - `fgetc()` 函数可以用于逐字符读取文件，并在文件末尾返回 false\n-  可以通过将文件流和文件名作为参数传递给 `fwrite()` 函数向文件中写入文本\n\
    - `fwrite()` 函数使用 `w` 模式会覆盖现有文本，但在使用 `a` 模式时会追加文本\n- 可以指定函数名称作为 `set_error_handler()`\
    \ 函数的参数，将其 own 自定义错误处理器\n- 错误处理器函数在错误发生时被调用，也可以使用 `trigger_error()` 函数显式调用\n-\
    \ 当发生特定错误情况时，会抛出异常\n- 如果异常未被捕获，PHP 将其视为致命错误并发布未捕获异常消息\n- `try` 代码块用于预判特定错误，其关联\
    \ `catch` 块用于确定当错误发生时脚本应如何继续\n- `Exception` 类对象具有 `getMessage()`、`getFile()` 和\
    \ `getLine()` 方法，可以获取异常详情\n- 可以作为 `Exception` 类的派生类来创建自定义异常处理器，以提供自定义异常方法\n\n\
    # 生成表单\n\n*本章演示了如何使用 PHP 脚本处理 HTML 表单数据。*\n\n- 执行操作\n- 检查已设置的值\n- 验证表单数据\n- 过滤数据\n\
    - 发送隐藏数据\n- 处理提交\n- 制作粘性表单\n- 上传文件\n- 表单外框\n- 追加数据\n- 总结\n\n## 执行操作\n\n表单提交方法可以是“GET”或“POST”。**GET**\
    \ 方法将 name=value 对添加到 URL 中，但主要用于请求信息——例如检索数据库记录。**POST** 方法可以提交更多数据，由于数据不附加到\
    \ URL 中因此更安全，并且主要用于需要执行操作的情况——例如更新数据库记录。因此，本书中的大多数示例优先使用 **POST** 方法。\n\n"
- fmt: "\nPHP can easily ensure that the user has entered data into submitted HTML\
    \ form fields using the built-in `isset()` function. This function takes the name\
    \ of a variable as its argument and returns `TRUE` only if that variable value\
    \ is not `NULL` – thus ensuring that the variable has been “set” with some value.\
    \ Empty form fields will be `NULL` unless the user has entered a value.\n\nConditional\
    \ tests can be made with the `isset()` function to indicate where form fields\
    \ have been left empty, or to provide a response page where the fields have been\
    \ completed:\n\n![image](Image00029.jpg)\n\n`isset.php`\n\n![image](Image00036.jpg)\
    \  Create an HTML document containing a form with three radio buttons providing\
    \ a single field for data submission\n\n```html\n<form action=” isset_handler.php\
    \ ” method=” POST ”>\n<fieldset>\n<legend>What kind of language is PHP?</legend>\n\
    Scripting<input type=”radio” name=” definition ” value=” Scripting ”> <br>\nMarkup<input\
    \ type=”radio” name=” definition ” value=” Markup ”> <br>\nProgramming<input type=”radio”\
    \ name=” definition ” value=” Programming ”>\n</fieldset><p><input type=”submit”\
    \ ></p>\n</form>\n```\n\n![image](Image00037.jpg)  Now, save the document in your\
    \ web server’s `/htdocs` directory as `isset.php`\n\n![image](Image00029.jpg)\n\
