  trans: "\n\n类（class）是一种可以在单个实体中包含变量和函数的数据结构。这些统称为它的“成员”（members）——变量被称为类的“属性”（properties），函数被称为类的“方法”（methods）。\n\
    \n![image](img/Image00113.jpg)\n\n从类外部访问类成员的方法由类声明中的“访问修饰符”（access specifiers）控制。通常，这些修饰符会拒绝对类变量的访问，但允许访问可以在这些变量成员中存储和检索数据的方法。这种“数据隐藏”技术确保了存储的数据被安全地封装在类变量成员内部，是面向对象编程（OOP）的第一原则。\n\
    \n类声明以 `class` 关键字开始，后面跟着空格，然后是程序员指定的名称——遵循通常的 PHP 命名规范但以大写字母开头。接下来是类属性的声明，然后是类方法的声明。这些看起来和普通的变量和函数声明相似，但每个声明都应该以访问修饰符开头。类的声明语法如下：\n\
    \n```php\nclass ClassName\n{\n    access-specifier $var1, $var2, $var3;\n    access-specifier\
    \ functionName1($arg1, $arg2, $arg3)\n    {\n        statements-to-execute;\n\
    \    }\n}\n```\n\n![image](img/Image00005.jpg)\n\n按照习惯，类名以大写字母开头，对象名从小写字母开头。\n\
    \n访问修饰符可以是 `public`、`private` 或 `protected` 关键字之一，用于指定所列成员的访问权限：\n\n*   `public`\
    \ 成员可以在类可见的任何地方被访问\n*   `private` 成员仅对定义它的所在类中的其他成员可见\n*   `protected` 成员仅对同类中的其他成员以及该类派生类的成员可见\n\
    \n![image](img/Image00005.jpg)\n\n派生类将在本章稍后部分介绍——请参见此处。\n\n任何现实世界中的对象都可以通过它的属性和动作来定义。例如，狗有年龄、重量和颜色等属性，以及它可以执行的动作如吠叫。PHP\
    \ 中的类机制提供了一种在脚本中创建虚拟狗对象的方法，其中类属性可以代表它的属性，类方法可以代表它的动作：\n\n```php\nclass Dog\n{\n\
    \    private $age;\n    private $weight;\n    private $color;\n    public function\
    \ bark() { echo ‘WOOF!’ ; }\n    // 在此处添加用于在属性中存储数据的方法。\n    // 在此处添加用于从属性检索数据的方法。\n\
    }\n```\n\n![image](img/Image00006.jpg)\n\n虽然 PHP 脚本类不能完美模拟真实世界的对象，但目标是将所有相关的属性和动作作为类属性和方法封装起来。\n\
    \n重要的是，类声明只定义了一个数据结构——为了创建一个对象，你必须声明该数据结构的一个“实例”（instance）。这通过使用 `new` 关键字将类的拷贝赋值给变量来实现，如下所示：\n\
    \n```php\n$fido = new Dog(); // 创建一个名为“fido”的实例\n// 这是程序员定义的\n// “Dog”数据结构。\n\
    ```\n\n实例对象是原始类数据结构的一个工作副本，因此保留了它的所有特性。由于示例中的方法被声明为 `public`，因此它在类声明之外脚本中是可见的。这意味着可以使用特殊的\
    \ `->` 对象运算符来调用实例拷贝的方法，如下所示：\n\n```php\n$fido->bark(); // 输出 WOOF!\n```\n\n`->`\
    \ 对象运算符可以用于引用任何可见的类成员，但上述示例中的变量属性被声明为 `private`，因此被封装在对象内部，无法直接访问。PHP 编程中的封装原则描述了在类成员中将数据和功能组合在一起——在这个\
    \ `Dog` 类中，这些就是年龄、重量、颜色属性和 `bark`（吠叫）动作。\n\n![image](img/Image00019.jpg)\n\n注意，在创建实例对象的语句中，必须在类名后添加括号。\n\
    \n**创建对象**\n\n为了从类的私有成员中分配和检索数据，必须向类添加特殊的 `public` 访问器方法。这些是用于分配数据的“setter”（设置）方法和用于检索数据的“getter”（获取）方法。访问器方法通常以它们处理的变量命名，并将首字母大写，并分别以“set”或“get”作为前缀。例如，处理\
    \ `age` 变量的访问器方法可以命名为 `setAge()` 和 `getAge()`。\n\nsetter 和 getter 方法可以使用特殊的 `$this`\
    \ “伪变量”后跟 `->` 对象运算符和属性名来引用同类中的成员。例如，使用 `$this->age` 来引用年龄属性：\n\n![image](img/Image00029.jpg)\n\
    \nobject.php\n\n![image](img/Image00114.jpg) 以一个声明名为“Dog”的类的语句开始 PHP 脚本\n\n```php\n\
    <?php\nclass Dog\n{\n    // 在此处插入成员（步骤 2-5）。\n}\n```\n\n![image](img/Image00115.jpg)\
    \ 在类声明的大括号之间\n\n```php\nclass Dog\n{\n    private $age;\n    private $weight;\n\
    \    private $color;\n\n    public function bark() { echo ‘WOOF!’ ; }\n\n    public\
    \ function setAge($yrs) {\n        $this->age = $yrs;\n    }\n\n    public function\
    \ getAge() {\n        return $this->age;\n    }\n\n    public function setWeight($lbs)\
    \ {\n        $this->weight = $lbs;\n    }\n\n    public function getWeight() {\n\
    \        return $this->weight;\n    }\n\n    public function setColor($fur) {\n\
    \        $this->color = $fur;\n    }\n\n    public function getColor() {\n   \
    \     return $this->color;\n    }\n}\n```\n\n![image](img/Image00115.jpg) 添加 public\
    \ setter 方法为私有变量赋值\n\n```php\n    public function setAge($yrs) {\n        $this->age\
    \ = $yrs;\n    }\n\n    public function setWeight($lbs) {\n        $this->weight\
    \ = $lbs;\n    }\n\n    public function setColor($fur) {\n        $this->color\
    \ = $fur;\n    }\n```\n\n![image](img/Image00116.jpg) 添加 public getter 方法从私有变量检索值\n\
    \n```php\n    public function getAge() {\n        return $this->age;\n    }\n\n\
    \    public function getWeight() {\n        return $this->weight;\n    }\n\n \
    \   public function getColor() {\n        return $this->color;\n    }\n```\n\n\
    ![image](img/Image00005.jpg) 在类声明中，注意所有方法都是公共的，所有变量都是私有的。\n\n![image](img/Image00019.jpg)\
    \ 在 Dog 声明之后，声明一个类的实例\n\n```php\n$fido = new Dog();\n```\n\n![image](img/Image00020.jpg)\
    \ Fido\n\n![image](img/Image00021.jpg) 调用每个 setter 方法来分配数据\n\n```php\n$fido->setAge(3);\n\
    $fido->setWeight(15);\n$fido->setColor('brown');\n```\n\n![image](img/Image00022.jpg)\
    \ 调用每个 getter 方法来检索分配的值\n\n```php\necho ‘Fido is a ‘ . $fido->getColor() . ‘ dog<br>’;\n\
    echo ‘Fido is ‘ . $fido->getAge() . ‘ years old<br>’;\necho ‘Fido weighs ‘ . $fido->getWeight()\
    \ . ‘ pounds<br>’;\n```\n\n![image](img/Image00023.jpg) 现在，对普通输出方法进行调用\n\n```php\n\
    $fido->bark();\n?>\n```\n\n![image](img/Image00024.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
    \ 目录并命名为 `object.php`，然后通过 HTTP 打开页面查看类属性输出和方法调用\n\n![image](img/Image00025.jpg)\n\
    \nPHP 7 的一项新功能是可以创建具有简单功能且没有的“匿名类”。例如，`$util = new class { public function log($s)\
    \ { echo $s ; } } ;`，它可以通过 `$util->log( ‘Data’ ) ;` 进行调用。\n\n![image](img/Image00003.jpg)\
    \ 这个 **object.php** 脚本将在接几页中随着新功能的引入进行修改。\n\n**初始化成员**\n\n程序只需通过声明类的多个实例即可轻松创建多个对象，并且每个对象可以通过其\
    \ setter 方法分配单独值来拥有独特的属性。\n\n"
- fmt: "\nIt is often convenient to combine the setter methods into a single method\
    \ that accepts arguments for each private variable. This means that all values\
    \ can be assigned with a single statement in the program, but the method will\
    \ contain multiple statements.\n\nOptionally, each parameter can specify a permissible\
    \ data type for each argument being passed, and may also usefully specify default\
    \ values to each parameter:\n\n![image](Image00029.jpg)\n\n`initializer.php`\n\
    \n![image](Image00114.jpg) Rename a copy of the previous example “object.php”\
    \ as a new program `initializer.php`\n\n![image](Image00115.jpg) In the `Dog`\
    \ class declaration, replace the three setter methods with a single combined setter\
    \ method that specifies the argument data types and default values\n\n```php\n\
    public function setValues( int $yrs = 2 , int $lbs = 8 , string $fur = ‘black’\
    \ )\n{\n    // Statements to be inserted here.\n}\n```\n\n![image](Image00116.jpg)\
    \ In the method definition block, insert three statements to assign values from\
    \ passed arguments to class variables\n\n```php\n$this-> age = $yrs ;\n$this->\
    \ weight = $lbs ;\n$this-> color = $fur ;\n```\n\n![image](Image00117.jpg) After\
    \ the modified class definition, replace the calls to the three setter methods\
    \ by a single call to the combined setter method – passing three arguments\n\n\
    ```php\n$fido -> setValues ( 3 , 15 , ‘brown’ ) ;\n```\n\n![image](Image00118.jpg)\
    \ Declare a second instance of the `Dog` class named “pooch”\n\n```php\n$pooch\
    \ = new Dog () ;\n```\n\n![image](Image00119.jpg) Add a second call to the combined\
    \ setter method – passing three arguments for the new object\n\n```php\n$pooch\
    \ -> setValues ( 4 , 18 , ‘gray’ ) ;\n```\n\n![image](Image00005.jpg) Try passing\
    \ an incorrect data type to the initializer method to see a type error occur.\n\
    \n![image](Image00121.jpg) Add statements calling each getter method to retrieve\
    \ the assigned values\n\n```php\necho ‘<hr>Pooch: ‘ . $pooch -> getAge (). ’yrs’\
    \ ;\necho $pooch -> getWeight (). ’lbs ’ . $pooch -> getColor () ;\n```\n\n![image](Image00122.jpg)\
    \ Add a second call to the regular output method\n\n```php\n$pooch -> bark ()\
    \ ;\n```\n\n![image](Image00123.jpg) Now, declare a third instance of the `Dog`\
    \ class named “rover”\n\n```php\n$rover = new Dog () ;\n```\n\n![image](Image00124.jpg)\
    \ Add a third call to the combined setter method – this time passing no arguments\
    \ for the new object\n\n```php\n$rover -> setValues ( ) ;\n```\n\n![image](Image00126.jpg)\
    \ Add statements calling each getter method to retrieve the assigned values, which\
    \ are specified default values\n\n```php\necho ‘<hr>Rover: ‘ . $rover -> getAge\
    \ (). ’yrs’ ;\necho $rover -> getWeight (). ’lbs ’ . $rover -> getColor () ;\n\
    ```\n\n![image](Image00127.jpg) Add a third call to the regular output method\n\
    \n```php\n$rover -> bark () ;\n```\n\n![image](Image00128.jpg) Save the document\
    \ in your web server’s `/htdocs` directory as `initializer.php` then open the\
    \ page via HTTP to see the output set by the combined initializer method\n\n![image](Image00129.jpg)\n\
    \n![image](Image00130.jpg)\n\n![image](Image00006.jpg) You must still call the\
    \ initializer method here, to assign the default values to the class variables\
    \ when passing no arguments.\n\n### Using constructors\n\nClass variable members\
    \ can be initialized by a special “constructor” method that is called whenever\
    \ an instance of the class is created. The constructor method is always named\
    \ `__construct()` and can accept arguments to set the initial value of class variables.\n\
    \n![image](Image00131.jpg)\n\nA constructor method has a companion “destructor”\
    \ method – that is called whenever an instance of the class is destroyed. The\
    \ destructor method is always named `__destruct()`.\n\nConstructor and destructor\
    \ methods have no return value and are called automatically – they cannot be called\
