    **Providing the page**


    A forum page can be created to display previously posted messages retrieved from
    the MySQL ‘forum’ database table, created on the previous page. Forum messages
    can be displayed between the page header and footer, together with a hyperlink
    to another page where the user can post a new forum message. If the forum database
    contains no previously posted content, the script can simply advise that there
    are currently no messages.


    The PHP **mysqli_query()** function can make an SQL query to retrieve the database
    table content, and the **mysqli_num_rows()** function can discover how many table
    rows are in the result. When table rows are found in the result, the **mysqli_fetch_array()**
    function can be used to fetch an associative array of rows and data in each column
    by specifying the result and **MYSQLI_ASSOC** constant as arguments:


    ![image](Image00029.jpg)


    forum.php


    ![image](Image00067.jpg)  Begin a PHP script with a statement to set the page
    title


