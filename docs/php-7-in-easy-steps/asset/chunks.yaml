    # 1 入门

    *欢迎来到使用 PHP 进行交互式 Web 的精彩世界。本章将演示如何使用 Web 服务器和 PHP 引擎创建一个动态开发环境。*


    * 介绍 PHP

    * 安装 Abyss 服务器

    * 安装 PHP 引擎

    * 集成 Abyss 和 PHP

    * 嵌入 PHP 脚本代码

    * 按规则编写脚本

    * 总结


    ## 介绍 PHP

    最具吸引力的现代网站通过动态响应某些状态——用户名、时间、最新博客、购物车内容等提供定制体验。许多动态网站都是使用 PHP 创建的。


    ### 什么是 PHP？

    PHP 是一种广泛使用的通用脚本语言，特别适用于 Web 开发，并可以嵌入 HTML 中。它由程序员 Rasmus Lerdorf 创建，最初是维护他网站的一组脚本，并于
    1995 年 6 月 8 日发布为“Home Page Tools (PHP Tools) 版本 1.0”。


    ![image](img/Image00001.jpg)


    这是 PHP 项目的官方标志——PHP 的官方在线首页可以在 [php.net](http://www.php.net) 找到。


    这些工具在 1997 年的 2 版本中得到了扩展，并在次后的 3 版本中更名为一个递归缩写 `PHP: Hypertext Preprocessor`。性能、可靠性和扩展性在
    2000 年发布 PHP4 时得到了改进，PHP4 由 Zend 引擎虚拟机驱动。


    随后，PHP5 于 2004 年发布，由新的 Zend II 引擎驱动，并由 PHP 小组作为免费软件制作。计划中的实验版本 PHP6（旨在在整个 PHP
    中引入原生 Unicode 支持）被放弃了。目前的版本 PHP7 于 2015 年发布，由最新的 Zend 3 引擎驱动，提供了更高的性能。今天，PHP 已在超过
    2000 万个网站和 100 万 Web 服务器上安装。


    ![image](img/Image00002.jpg)


    这是“elePHPant”——PHP 项目的吉祥物，由 Vincent Pontier 设计。


    ### 为什么 PHP 流行？

    • PHP 对初学者非常简单，但对专业程序员来说提供了许多高级功能。


