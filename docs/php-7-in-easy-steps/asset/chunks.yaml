  trans: "\n\n`return` 语句可以包含一个待评估的表达式，以便其单一结果将返回给调用者。例如：\n\n```php\nfunction square(\
    \ int $number )\n{\n    return $number * $number ;\n}\n\necho square( 3 ) ; #\
    \ 输出 9\n```\n\n为了确保函数只返回所需数据类型的值，函数声明中可以可选地指定返回类型描述，例如 `int`、`float`、`string`、`bool`\
    \ 或 `array`，如下：\n\n```php\nfunction *function_name ( ) : int\n{\n    statement-to-be-executed\
    \ ;\n    statement-to-be-executed ;\n    return value ;\n}\n```\n\n当指定了返回数据类型时，尝试向调用者返回错误数据类型的函数将导致错误。\n\
    \n![image](img/Image00003.jpg)\n\n指定返回数据类型的能力是 PHP 7 的一个新特性。\n\n![image](img/Image00029.jpg)\n\
    \nreturn.php\n\n![image](img/Image00085.jpg) 通过定义一个必须只返回数据数组的函数开始 PHP 脚本\n\n```php\n\
    <?php\nfunction supply () : array\n{\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg)\
    \ 接下来，插入一条语句返回一个包含四个混合值的数组\n\n```php\nreturn array ( 75 , 3.142 , ‘Super PHP’\
    \ , True ) ;\n```\n\n![image](img/Image00087.jpg) 函数之后，添加一条调用该函数并将返回的数组值赋值给变量的语句\n\
    \n```php\n$array = supply () ;\n```\n\n![image](img/Image00088.jpg) 最后，添加一个循环来显示函数返回的每一个值\n\
    \n```php\nforeach( $array as $data )\n{\n    echo “Element Value : $data <br>\
    \ ;\n}\n?>\n```\n\n![image](img/Image00089.jpg) 将文档保存到网络服务器的 `/htdocs` 目录并命名为\
    \ `return.php`，然后通过 HTTP 打开页面查看返回的值\n\n![image](img/Image00095.jpg)\n\n![image](img/Image00006.jpg)\n\
    \n在 PHP 中，布尔值 `TRUE` 在数值上表示为 1。\n\n### 回调\n\nPHP 允许你创建在函数定义中没有指定名的“匿名”函数。与其他函数一样，如果指定了参数，它们可以接受参数，并且在调用时可以可选地返回一个值。与其他代码构造的函数定义不同，匿名函数定义是一个表达式。这意味着每个匿名函数定义必须以分号结束，如下：\n\
    \n```php\nfunction ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    return value ;\n} ;\n```\n\n![image](img/Image00019.jpg)\n\n不要忘记在每个匿名函数定义后添加终止的\
    \ `;` 分号。\n\n匿名函数本身用处不大，因为没有名称，它无法被调用，但它可以在其他方面很有用：\n\n- 赋值给变量，匿名函数可以使用变量名进行调用\n\
    - 作为可调用参数传递给另一个函数，匿名函数稍后可以作为“回调”调用\n- 从函数返回，匿名函数在“闭包”中保留对返回函数变量的访问权限\n\n通过将匿名函数赋值给变量，你实际上给函数起了一个名字，并可以像调用任何其他函数一样使用变量名来调用它并传递参数。同样，当你将匿名函数传递给另一个函数时，可以像调用任何其他函数一样使用参数名进行回调并传递参数。PHP\
    \ 的 `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量。\n\n![image](img/Image00029.jpg)\n\n\
    callback.php\n\n![image](img/Image00085.jpg) 通过向变量赋值一个接受单个参数的匿名函数开始 PHP 脚本\n\n\
    ```php\n<?php\n$hello = function ( $user ) { echo “Hello $user !<br> ; } ; ;\n\
    ```\n\n![image](img/Image00086.jpg) 接下来，添加一条调用匿名函数并传递单个参数的语句\n\n```php\n$hello\
    \ ( ‘Mike’ ) ;\n```\n\n![image](img/Image00087.jpg) 现在，定义一个接受单个可调用参数的普通函数，并调用该函数传递一个字符串\n\
    \n```php\nfunction greet ( callable $anon )\n{\n    $anon ( ‘Carole Anne’ ) ;\n\
    }\n```\n\n![image](img/Image00088.jpg) 添加一条语句调用上一步定义的函数，并传递第一步中赋值给变量的匿名函数\n\n\
    ```php\ngreet( $hello ) ;\n```\n\n![image](img/Image00089.jpg) 接下来，定义另一个普通函数，它有一个局部变量并返回一个引用该局部变量值的匿名函数\n\
    \n```php\nfunction meet () : callable\n{\n    $time = ‘morning’ ;\n    return\
    \ function( $name ) use( & $time )\n    { return “Good $time , $name !” ; } ;\n\
    }\n```\n\n![image](img/Image00091.jpg) 将上一步定义的函数赋值给变量，然后调用该函数\n\n```php\n$meeting\
    \ = meet () ;\necho $meeting ( ‘Susan’ ) ;\n?>\n```\n\n![image](img/Image00096.jpg)\
    \ 将文档保存到网络服务器的 `/htdocs` 目录并命名为 `callback.php`，然后通过 HTTP 打开页面查看返回的值\n\n![image](img/Image00097.jpg)\n\
    \n![image](img/Image00006.jpg) 记得包含前缀以创建变量的引用。\n\n![image](img/Image00005.jpg)\
    \ 注意到最后的调用获取了‘morning’字符串。\n\n**总结**\n\n- 自定义函数允许将 PHP 脚本模块化为更容易理解和维护的部分\n- 函数名必须以字母或下划线开头，且不区分大小写\n\
    - 函数通过在 `function` 关键字后指定名称、括号以及包含语句的大括号来定义\n- 参数的函数通过括号内包含逗号分隔的参数列表来定义\n- 函数定义可以通过在参数名之前包含数据类型来指定调用者传递的数据类型\n\
    - 参数数据通常按值传递，但如果参数名赋予 `&` 则可以按引用传递\n- 默认参数值可以通过对参数名赋值来可选地指定\n- 当参数名赋予 `...` 展开运算符时，可以将多个参数传递给该参数以创建一个数组\n\
    - 外部创建的变量具有全局作用域，但在函数内部除非使用 `global` 关键字无法访问\n- 内部创建的变量具有局部作用域，因此仅在该函数块内部可见\n\
    - 局部变量在程序范围离开函数时会丢失值，但 `static` 变量会保留其值\n- `return` 关键字向调用者返回一个项目，且函数定义可以可选地指定返回数据类型\n\
    - 匿名函数定义没有指定名称但是一个表达式，因此必须以 `;` 分号结束\n- `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量\n\
    \n6\n\n处理字符串\n\n*本章演示了在 PHP 脚本中处理文本字符串的各种方法。*\n\n- **比较字符**\n- **搜索文本**\n- **提取子字符串**\n\
    - **更改大小**\n- **格式化字符串**\n- **制作日期**\n- **编码实体**\n\n- **总结**\n\n**比较字符**\n\n"
- fmt: "\nPHP provides a number of built-in functions to perform a comparison of two\
    \ text strings. The simple `strcmp()` function accepts two string arguments for\
    \ comparison and will return one of three integer values depending on the result.\
    \ When the strings exactly match, `strcmp()` will return zero. When the first\
    \ string argument is greater than the second, `strcmp()` will return 1, but when\
    \ the first string argument is less than the second, `strcmp()` will return -1.\n\
    \n![image](Image00019.jpg)\n\nStrictly speaking, the `strcmp()` returned values\
    \ will be a positive integer, zero, or a negative integer – but are typically\
    \ values of 1, 0, or -1.\n\nThe `strncmp()` function works in a similar way, but\
    \ accepts a third integer argument to specify the number of characters from the\
    \ start of the strings to be compared.\n\nThe `strcmp()` and `strncmp()` functions\
    \ attach different importance to uppercase and lowercase characters when comparing\
    \ strings. When you prefer to ignore case, you can use the alternative companion\
    \ functions `strcasecmp()` and `strncasecmp()` instead.\n\nTo appreciate the results\
    \ from each of the four comparison functions it is useful to understand how the\
    \ comparisons are actually made. Each character has a standard numerical “ASCII”\
    \ value where lowercase a-z is in the range 97-122 and uppercase A-Z is in the\
    \ range 65-90. Comparing the first value in each range we see that “a” (97) is\
    \ greater than “A” (65). Supplying these as arguments the `strcmp()` function\
    \ would therefore return 1, as the first argument is greater than the second.\
    \ Conversely, if you specify “A” (65) as the first argument and “a” (97) as the\
    \ second argument then the `strcmp()` function would return -1, as the first argument\
    \ is less than the second. With string comparisons, each character is compared\
    \ in sequence to ensure that strings containing the same characters in different\
    \ order are not seen to be incorrectly equal. For example, comparing “ABC” and\
    \ “BAC” the first character “A” (65) is less than first character “B” (66) so\
    \ the `strcmp()` function would return -1, as the first argument is less than\
    \ the second.\n\n![image](Image00005.jpg)\n\nASCII is an abbreviation for the\
    \ American Standard Code for Information Exchange that specifies the universal\
    \ standard character coding scheme.\n\nThe ASCII value of any character can be\
    \ found by specifying the character as an argument to the PHP `ord()` function,\
    \ and the length of a string can be found by specifying it as the argument to\
    \ the PHP `strlen()` function.\n\n![image](Image00029.jpg)\n\ncharacters.php\n\
    \n![image](Image00098.jpg)  Begin a PHP script with statements to initialize four\
    \ variables with string values\n\n```php\n<?php\n$str1 = ‘PHP In Easy Steps’ ;\n\
    $str2 = ‘PHP In Easy Steps’ ;\n$str3 = ‘PHP Easy Steps’ ;\n$str4 = ‘php in easy\
    \ steps’ ;\n```\n\n![image](Image00099.jpg)  Next, add statements to compare the\
    \ strings\n\n```php\necho “’$str1’ versus ‘$str2’ : “ .strcmp( $str1 , $str2 ).\
    \ ’<br>’ ;\necho “’$str1’ versus ‘$str3’ : “ .strcmp( $str1 , $str3 ). ’<br>’\
    \ ;\necho “’$str1’ versus ‘$str4’ : “ .strcmp( $str1 , $str4 ). ’<hr>’ ;\n```\n\
    \n![image](Image00100.jpg)  Now, add a statement for a case-insensitive comparison\n\
    \n```php\necho ‘Comparison Ignoring Case :<br>’ ;\necho “’$str1’ versus ‘$str4’\
    \ : “ .strcasecmp( $str1 , $str4 ) ;\n```\n\n![image](Image00101.jpg)  Finally,\
    \ add a loop to count and display the total ASCII code value of the first string\n\
    \n```php\n$total = 0 ;\nfor ( $i = 0 ; $i < strlen( $str1 ) ; $i ++ )\n{\n   \
    \ $total += ord( $str1 [ $i ] ) ;\n}\necho “<hr>ASCII Total $str1 : $total ” ;\n\
    ?>\n```\n\n![image](Image00102.jpg)  Save the document in your web server’s `/htdocs`\
    \ directory as `characters.php` then open the page via HTTP to see the string\
    \ comparisons\n\n![image](Image00103.jpg)\n\n![image](Image00006.jpg)\n\nCharacter\
    \ order is relevant as the ASCII totals for two differently ordered strings could\
    \ be equal, but the strings would not match.\n\n### Searching text\n\nPHP provides\
    \ a number of built-in functions to search a string to find a specified substring\
    \ or single character. The simple `strpos()` function accepts two arguments to\
    \ specify the string in which to search, and the substring to find. It will search\
    \ in sequence from the start of the string to find a match. When a match is found\
    \ the search halts and the `strpos()` function returns an integer, which is the\
    \ character index number position within the string at which the first occurrence\
    \ of a match begins. When no match is found the `strpos()` function returns `FALSE`.\n\
    \nThe `strrpos()` function works in a similar way but returns the index number\
    \ position at which the first occurrence of a match begins. The `strstr()` function\
    \ works in a similar way but accepts two arguments to specify the string in which\
    \ to search, and the substring to find. It will search in sequence from the start\
    \ of the string to find a match. When a match is found the search halts and the\
    \ `strstr()` function returns the remainder of the string starting from the first\
    \ occurrence of the match. When no match is found the `strstr()` function returns\
    \ `NULL`.\n\nThe `strrpos()` function works in a similar way but returns the index\
    \ number position at which the first occurrence of a match begins. The `strrstr()`\
    \ function works in a similar way but accepts two arguments to specify the string\
    \ in which to search, and the substring to find. It will search in sequence from\
    \ the end of the string to find a match. When a match is found the search halts\
    \ and the `strrstr()` function returns the remainder of the string starting from\
    \ the first occurrence of the match. When no match is found the `strrstr()` function\
    \ returns `NULL`.\n\nThe `strchr()` function works in a similar way but accepts\
    \ two arguments to specify the string in which to search, and a single character\
    \ to find. It will search in sequence from the start of the string to find a match.\
    \ When a match is found the search halts and the `strchr()` function returns the\
    \ remainder of the string starting from the first occurrence of the match. When\
    \ no match is found the `strchr()` function returns `FALSE`.\n\nThe `strrchr()`\
    \ function works in a similar way but accepts two arguments to specify the string\
    \ in which to search, and a single character to find. It will search in sequence\
    \ from the end of the string to find a match. When a match is found the search\
    \ halts and the `strrchr()` function returns the remainder of the string starting\
    \ from the first occurrence of the match. When no match is found the `strrchr()`\
    \ function returns `FALSE`.\n\nThe `strcasecmp()` function works in a similar\
    \ way but accepts two arguments to specify the string in which to search, and\
    \ the substring to find. It will search in sequence from the start of the string\
    \ to find a match. When a match is found the search halts and the `strcasecmp()`\
    \ function returns the remainder of the string starting from the first occurrence\
    \ of the match. When no match is found the `strcasecmp()` function returns `NULL`.\n\
    \nThe `stristr()` function works in a similar way but accepts two arguments to\
    \ specify the string in which to search, and the substring to find. It will search\
    \ in sequence from the end of the string to find a match. When a match is found\
    \ the search halts and the `stristr()` function returns the remainder of the string\
    \ starting from the first occurrence of the match. When no match is found the\
    \ `stristr()` function returns `NULL`.\n\nThe `strnpos()` function works in a\
    \ similar way but accepts three arguments to specify the string in which to search,\
    \ the substring to find, and the number of characters to search. It will search\
    \ in sequence from the start of the string to find a match. When a match is found\
    \ the search halts and the `strnpos()` function returns an integer, which is the\
    \ character index number position within the string at which the first occurrence\
    \ of a match begins. When no match is found the `strnpos()` function returns `FALSE`.\n\
    \n![image](Image00019.jpg)  Note that there is no `strrnpos()`.\n\n![image](Image00029.jpg)\n\
    \nsearch.php\n\n![image](Image00098.jpg)  Begin a PHP script with statements to\
    \ initialize a variable with a string value and report its length\n\n```php\n\
    <?php\n$str = ‘Most Users usually find PHP useful.’ ;\necho “’ $str ’<br>String\
    \ Length : “ .strlen( $str ) ;\n```\n\n![image](Image00099.jpg)  Next, add statements\
    \ to search the string, both forwards and reverse, and report the position of\
    \ a given substring\n\n```php\necho “<br>First ‘us’ found at : “ .strpos( $str\
    \ , ‘us’ ) ;\necho “<br>Final ‘us’ found at : “ .strrpos( $str , ‘us’ ) ;\n```\n\
    \n![image](Image00100.jpg)  Now, add statements to search the string, both case-\
    \ sensitive and case-insensitive, and return the remainder of the string following\
    \ a substring match\n\n```php\necho “<hr>Substring from first ‘us’ : “ .strstr(\
    \ $str , ‘us’ ) ;\necho “<br>Substring from first ‘us’ case insensitive : “\n\
    .stristr( $str , ‘us’ ) ;\n```\n\n![image](Image00101.jpg)  Finally, add statements\
    \ to search the string, both forwards and reverse, and return the remainder of\
    \ the string following a character match\n\n```php\necho “<hr>Characters from\
    \ first ‘u’ : “ .strchr( $str , ‘u’ ) ;\necho “<br>Characters from final ‘u’ :\
    \ “ .strrchr( $str , ‘u’ ) ;\n?>\n```\n\n![image](Image00102.jpg)  Save the document\
    \ in your web server’s `/htdocs` directory as `search.php` then open the page\
    \ via HTTP to see the search results\n\n![image](Image00104.jpg)\n\n![image](Image00006.jpg)\n\
    \nThere are three occurrences of ‘us’ in this string, but only the first and third\
    \ are matched.\n\n**Extracting substrings**\n"
