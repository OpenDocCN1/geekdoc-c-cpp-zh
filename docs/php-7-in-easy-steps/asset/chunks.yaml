  trans: "\n\n```php\n<?php\n\nclass Polygon\n{\n    private $width , $height ;\n\
    \    function construct( int $w = 4 , int $h = 5 )\n    {\n        $this-> width\
    \ = $w ;\n        $this-> height = $h ;\n    }\n    public function getWidth ()\
    \ { return $this-> width ; }\n    public function getHeight () { return $this->\
    \ height ; }\n}\n```\n![image](img/Image00115.jpg) 在 `Polygon` 类之后，声明一个派自 `Polygon`\
    \ 类的“Rectangle”类并添加一个独特方法\n\n```php\nclass Rectangle extends Polygon\n{\n    public\
    \ function area ()\n    {\n        return ( $this-> getWidth () * $this-> getHeight\
    \ () ) ;\n    }\n}\n```\n\n![image](img/Image00116.jpg) 在 `Rectangle` 类之后，声明一个派自\
    \ `Polygon` 类的“Triangle”类并添加一个独特方法\n\n```php\nclass Triangle extends Polygon\n\
    {\n    public function area ()\n    {\n        return ( $this-> getWidth () *\
    \ $this-> getHeight () / 2 ) ;\n    }\n}\n```\n\n![image](img/Image00117.jpg)\
    \ 在 `Triangle` 类之后，添加两条语句使用默认值创建每个派生类的实例\n\n```php\n$rect = new Rectangle () ;\n\
    $trio = new Triangle () ;\n```\n\n![image](img/Image00118.jpg) 最后，添加两条语句输出由每个派生类的独特方法所返回的值\n\
    \n```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
    \ Area : ‘ . $trio -> area () ;\n?>\n```\n\n![image](img/Image00119.jpg) 将文档保存到\
    \ Web 服务器的 `/htdocs` 目录中并命名为 `inheritance.php`，然后通过 HTTP 打开页面以查看继承成员的输出\n\n![image](img/Image00135.jpg)\n\
    \n![image](img/Image00019.jpg)\n\n不要混淆类实例和派生类——实例是类的拷贝，而派生类是一个继承其所派生基类属性的新类。\n\
    \n![image](img/Image00006.jpg)\n\n在 PHP 中，派生类始终依赖于单个基类——不支持多重继承。\n\n## 拥抱多态\n\n\
    面向对象编程 (OOP) 的三个基石是封装、继承和多态。在之前的页面中，我们已经看到数据如何被封装在 PHP 类中，以及派生类如何继承其基类的属性，因此现在我们可以探索最后一个基石级原则：多态。\n\
    \n![image](img/Image00136.jpg)\n\n“多态”一词（源自希腊语，意为“多种形式”）描述了根据上下文为实体分配不同含义或目的的能力。例如，在现实世界中，每个人都知道如何使用推按钮（实体）——只需对其施加压力即可。然而，该按钮的作用取决于连接到它的东西（上下文），但结果不会影响该按钮的使用方式。\n\
    \n在面向对象编程的世界中，多态允许类在共享公共接口的同时具有不同的功能。接口不需要知道它正在使用哪个类，因为它们就像现实世界中的按钮一样，使用方式都相同，但可以产生不同的上下文结果。以此这样拥抱多态使程序员能够创建可以根据需求而非条件测试来选择的可交换对象。\n\
    \n![image]PHP 接口类似于类，但使用 `interface` 关键字声明，并且只能包含方法定义，而不包含任何要执行的方法语句，如下：\n\n```php\n\
    interface InterfaceName\n{\n    // 这里仅包含方法定义。\n}\n```\n\n![image](img/Image00006.jpg)\
    \ 接口声明中的方法定义也可以指定参数。\n\n实现接口的每个类必须实现其定义的所有方法，并指定其要执行的语句。通过在声明中包含 `implements`\
    \ 关键字和接口名称将类连接到接口，如下：\n\n```php\nclass ClassName implements InterfaceName\n{\n\
    \    // 方法实现在这里。\n}\n```\n\n可以通过添加一个接口和一个单函数来修改之前的示例以拥抱多态。\n\n![image](img/Image00029.jpg)\n\
    \npolymorphism.php\n\n![image](img/Image00114.jpg) 将上一个示例的副本“inheritance.php”重命名为新程序“polymorphism.php”\n\
    \n![image](img/Image00115.jpg) 声明一个名为“Shape”的接口，它包含已经在 Rectangle 和 Triangle 类中实现的方法定义\n\
    \n```php\ninterface Shape { public function area () ; }\n```\n\n![image](img/Image00116.jpg)\
    \ 编辑 Rectangle 和 Triangle 类声明的第一行——将它们与接口关联\n\n```php\nclass Rectangle extends\
    \ Polygon implements Shape\nclass Triangle extends Polygon implements Shape\n\
    ```\n\n![image](img/Image00117.jpg) 在类块之后，添加一个接受 Shape 类型参数并调用其定义方法的函数\n\n```php\n\
    function getArea ( Shape $shape )\n{ return $shape -> area () ; }\n```\n\n![image](img/Image00118.jpg)\
    \ 修改创建每个派生类实例的两条语句——以传入参数值\n\n```php\n$rect = new Rectangle ( 8 , 10 ) ;\n$trio\
    \ = new Triangle ( 8 , 10 ) ;\n```\n\n```php\necho ‘Rectangle Area : ‘ . $rect\
    \ -> area (). ’<hr>’ ;\necho ‘Triangle Area : ‘ . $trio -> area () ;\n```\n\n\
    ![image](img/Image00119.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录中并命名为 `inheritance.php`，然后通过\
    \ HTTP 打开页面以查看继承成员的输出\n\n![image](img/Image00135.jpg)\n\n![image](img/Image00019.jpg)\n\
    \n发生了什么？\n\n`getArea()` 函数传递了一个实例作为参数。\n\n`getArea()` 函数调用了接口的方法。\n\n输出由方法的实现返回。\n\
    \n## 总结\n\n- PHP 类是一个可以包含变量和函数的数据结构\n- 类使用 `class` 关键字声明，可以包含成员变量属性和成员函数方法\n-\
    \ 对类的访问由 `public`、`private` 或 `protected` 访问修饰符控制\n- 通过将变量属性声明为 `private` 来实现封装，使其值只能通过\
    \ `public` 方法访问\n- 为了创建对象，必须使用 `new` 关键字声明 `class` 的实例\n- 特殊的 `->` 对象运算符可以引用可见的类成员\n\
    - Setter 和 getter 方法使用 `$this` 伪变量引用同类的成员\n- 单个 setter 方法可以分配多个参数值或默认值来初始化多个变量属性\n\
    - `__construct()` 构造方法在类创建时调用，可用于初始化变量属性\n- `__destruct()` 析构方法在类销毁时调用，可用于执行最终语句\n\
    - PHP 有函数可以检查类，使用 `get_class_methods()` 列出方法，使用 `get_class_vars()` 列出变量\n- 面向对象编程的三个基石是封装、继承和多态\n\
    - 派生类声明将包含 `extends` 关键字，以指定从其继承的基类\n- 接口使用 `interface` 关键字声明，声明可能仅包含方法定义\n- 通过在声明中包含\
    \ `implements` 关键字和接口名称将类连接到接口\n\n"
- fmt: "\n# Appending text (#text00010.html_sec58)\n\n# Handling errors (#text00010.html_sec59)\n\
    \n# Catching exceptions (#text00010.html_sec60)\n\n# Summary (#text00010.html_sec61)\n\
    \n## Reading files\n\nThe ability to read and write files located on the web server\
    \ is useful to log information and to provide page content. In order to process\
    \ files, a “filestream” object must first be created using the PHP `fopen()` function.\
    \ This requires two arguments to specify the name or path of the file and a file\
    \ “mode”. The file mode determines the nature of the operation to be performed\
    \ and places the file pointer at a suitable position within the file:\n\n| **File\
    \ mode:** | **Operation:** |\n| :--- | :--- |\n| r | Open an existing file to\
    \ read File pointer starts at the beginning of the file |\n| w | Discard all contents\
    \ of an existing file or create a new file if none exists File pointer starts\
    \ at the beginning of the file |\n| a | Open an existing file and preserve all\
    \ contents File pointer starts at the end of the file |\n| r+ | Open a file to\
    \ read from or write to File pointer starts at the beginning of the file |\n|\
    \ w+ | Open a file to write to or read from Discard all contents of an existing\
    \ file or create a new file if none exists File pointer starts at the beginning\
    \ of the file |\n| a+ | Open a file to read from or write to and preserve all\
    \ contents File pointer starts at the end of the file |\n\n![image](Image00019.jpg)\n\
    \nThe file mode specifier must appear within quote marks when supplied as an argument\
    \ to the `fopen()` function.\n\nIt is good practice to always provide an alternative\
    \ with the `die()` function in case the attempt to create a filestream fails.\n\
    \n![image](Image00005.jpg)\n\nSpecify an explanatory message as an argument to\
    \ the `die()` function.\n\nWhen a filestream is created successfully, the file\
    \ can be read by specifying the filestream and byte size as arguments to the `fread()`\
    \ function. If the whole file is to be read it is convenient to use the `filesize()`\
    \ function to specify the byte size of the file to be read.\n\nUpon completion\
    \ of any file operation, the filestream must be destroyed by specifying it as\
    \ an argument to the `fclose()` function.\n\n![image](Image00138.jpg)\n\n![image](Image00029.jpg)\n\
    \nread.php\n\n![image](Image00008.jpg) Begin a PHP script with statements that\
    \ attempt to open a plain text file for reading, or exit the script upon failure\n\
    \n```php\n<?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable\
    \ to open file!’ ) ;\n```\n\n![image](Image00010.jpg) Next, add a statement to\
    \ read the text file upon success and display its entire contents\n\n```php\n\
    echo fread( $filestream , filesize( ‘manifesto.txt’ ) ) ;\n```\n\n![image](Image00012.jpg)\
    \ Now, remember to close the file stream\n\n```php\nfclose( $filestream ) ;\n\
    ```\n\n![image](Image00014.jpg) Save the document in your web server’s `/htdocs`\
    \ directory as `read.php`, alongside the plain text file to be read, then open\
    \ the page via HTTP to see the text file contents displayed in the browser window\n\
    \n![image](Image00139.jpg)\n\n![image](Image00006.jpg)\n\nUnlike a PHP block within\
    \ an HTML document, a purely PHP script needs no closing `?>` tag.\n\n![image](Image00006.jpg)\n\
    \nNotice that the output here does not maintain line endings – but the example\
    \ overleaf does.\n\n## Reading lines\n\nOnce a “filestream” object is created,\
    \ its contents can be read one line at a time by specifying the filestream as\
    \ an argument to the PHP `fgets()` function. To read every line this function\
    \ can be called repeatedly in a loop. The `feof()` function can determine when\
    \ the end of the file is reached and can end the loop:\n\n![image](Image00140.jpg)\n\
    \n![image](Image00006.jpg)\n\nThe `feof()` function returns true when the end\
    \ of the file is reached.\n\n![image](Image00029.jpg)\n\nreadlines.php\n\n![image](Image00008.jpg)\
    \ Begin a PHP script with statements that attempt to open a plain text file for\
    \ reading, or exit the script upon failure\n\n```php\n<?php\n$filestream = fopen(\
    \ ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’ ) ;\n```\n\n![image](Image00010.jpg)\
    \ Next, add a loop to read the text file line-by-line upon success and display\
    \ its entire contents\n\n```php\nwhile( !feof( $filestream ) )\n{ echo fgets(\
    \ $filestream ). ’<br>’ ; }\n```\n\n![image](Image00012.jpg) Now, remember to\
    \ close the file stream\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](Image00014.jpg)\
    \ Save the document in your web server’s `/htdocs` directory as `readlines.php`,\
    \ alongside the plain text file to be read, then open the page via HTTP to see\
    \ the text file\n\n![image](Image00140.jpg)\n\n![image](Image00006.jpg)\n\n##\
    \ Reading characters\n\nOnce a “filestream” object is created, its contents can\
    \ be read one line at a time by specifying the filestream as an argument to the\
    \ PHP `fgets()` function. To read every line this function can be called repeatedly\
    \ in a loop. The `feof()` function can determine when the end of the file is reached\
    \ and can end the loop:\n\n![image](Image00140.jpg)\n\n![image](Image00006.jpg)\n\
    \nThe `feof()` function returns true when the end of the file is reached.\n\n\
    ![image](Image00029.jpg)\n\nreadchars.php\n\n![image](Image00008.jpg) Begin a\
    \ PHP script with statements that attempt to open a plain text file for reading,\
    \ or exit the script upon failure\n\n```php\n<?php\n$filestream = fopen( ‘title.txt’\
    \ , ‘r’ )\nor die( ‘Unable to open file!’ ) ;\n```\n\n![image](Image00010.jpg)\
    \ Next, add a loop to read the text file character-by-character upon success and\
    \ display its entire contents\n\n```php\nwhile( $char = getc( $filestream ) )\n\
    { echo $char; }\n```\n\n![image](Image00012.jpg) Now, remember to close the file\
    \ stream\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](Image00014.jpg) Save\
    \ the document in your web server’s `/htdocs` directory as `readchars.php`, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the text\
    \ file\n\n## Writing a file\n\nOnce a “filestream” object has been created a write\
    \ mode, a text file can be created. Text can be written into the file by specifying\
    \ the filestream and a file name to the PHP `fwrite()` function. To format the\
    \ text, non-printing characters can also be written to create line breaks and\
    \ tab spacing:\n\n| **Character:** | **Description:** |\n| :--- | :--- |\n| \\\
    n | Newline Move to a new line down |\n| \\r | Carriage return Move to the beginning\
    \ of the line |\n| \\t | Tab Move along the line to the next tab stop\n\n![image](Image00019.jpg)\n\
    \nStrings containing non-printing characters must be enclosed within double quotes\
    \ so that PHP can interpret them.\n\n![image](Image00029.jpg)\n\nwrite.php\n\n\
    ![image](Image00008.jpg) Begin a PHP script with a statement to assign text, including\
    \ non-printing characters for formatting\n\n```php\n<?php\n$poem = “\\r\\n\\tI\
    \ never saw a man who looked” ;\n$poem .= “\\r\\n\\tWith such a wistful eye” ;\n\
    $poem .= “\\r\\n\\tUpon that little tent of blue” ;\n$poem .= “\\r\\n\\tWhich\
    \ prisoners call the sky” ;\n```\n\n![image](Image00010.jpg) Next, assign a name\
    \ for the file to be written\n\n```php\n$filename = ‘poem.txt’ ;\n```\n\n![image](Image00012.jpg)\
    \ Attempt to create a plain text file for writing, or exit the script upon failure\n\
    \n```php\n$filestream = fopen( $filename , ‘w’ )\nor die( ‘Unable to open file!’\
    \ ) ;\n```\n\n![image](Image00014.jpg) Write the file and display a confirmation\
    \ of how many bytes have been written in total\n\n```php\n$num = fwrite( $filestream\
    \ , $poem ) ;\nif( $num )\n{\n  echo “ $num bytes written to $filename ” ;\n}\n\
    ```\n\n![image](Image00015.jpg) Now, remember to close the file stream\n\n```php\n\
    fclose( $filestream ) ;\n```\n"
  raw: '[**Appending text**](#text00010.html_sec58)


    [**Handling errors**](#text00010.html_sec59)


    [**Catching exceptions**](#text00010.html_sec60)


    [**Summary**](#text00010.html_sec61)


    **Reading files**


    The ability to read and write files located on the web server is useful to log
    information and to provide page content. In order to process files, a “filestream”
    object must first be created using the PHP **fopen()** function. This requires
    two arguments to specify the name or path of the file and a file “mode”. The file
    mode determines the nature of the operation to be performed and places the file
    pointer at a suitable position within the file:


    | **File mode:** | **Operation:** |


    | r | Open an existing file to read File pointer starts at the beginning of the
    file |


    | w | Discard all contents of an existing file or create a new file if none exists
    File pointer starts at the beginning of the file |


    | a | Open an existing file and preserve all contents File pointer starts at the
    end of the file |


    | r+ | Open a file to read from or write to File pointer starts at the beginning
    of the file |


    | w+ | Open a file to write to or read from Discard all contents of an existing
    file or create a new file if none exists File pointer starts at the beginning
    of the file |


    | a+ | Open a file to read from or write to and preserve all contents File pointer
    starts at the end of the file |


    ![image](Image00019.jpg)


    The file mode specifier must appear within quote marks when supplied as an argument
    to the **fopen()** function.


    It is good practice to always provide an alternative with the **die()** function
    in case the attempt to create a filestream fails.


    ![image](Image00005.jpg)


    Specify an explanatory message as an argument to the **die()** function.


    When a filestream is created successfully, the file can be read by specifying
    the filestream and byte size as arguments to the **fread()** function. If the
    whole file is to be read it is convenient to use the **filesize()** function to
    specify the byte size of the file to be read.


    Upon completion of any file operation, the filestream must be destroyed by specifying
    it as an argument to the **fclose()** function.


    ![image](Image00138.jpg)


    ![image](Image00029.jpg)


    read.php


    ![image](Image00008.jpg)  Begin a PHP script with statements that attempt to open
    a plain text file for reading, or exit the script upon failure


    **<?php**


    **$filestream = fopen( ‘manifesto.txt’ , ‘r’ )**


    **o** r **die( ‘Unable to open file!’ ) ;**


    ![image](Image00010.jpg)  Next, add a statement to read the text file upon success
    and display its entire contents


    **echo fread( $filestream , filesize( ‘manifesto.txt’ ) ) ;**


    ![image](Image00012.jpg)  Now, remember to close the file stream


    **fclose( $filestream ) ;**


    ![image](Image00014.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **read.php**  , alongside the plain text file to be read, then open the page
    via HTTP to see the text file contents displayed in the browser window


    ![image](Image00139.jpg)


    ![image](Image00006.jpg)


    Unlike a PHP block within an HTML document, a purely PHP script needs no closing
    **?>** tag.


    ![image](Image00006.jpg)


    Notice that the output here does not maintain line endings – but the example overleaf
    does.


    **Reading lines**


    Once a “filestream” object is created, its contents can be read one line at a
    time by specifying the filestream as an argument to the PHP **fgets()** function.
    To read every line this function can be called repeatedly in a loop. The **feof()**
    function can determine when the end of the file is reached and can end the loop:


    ![image](Image00140.jpg)


    ![image](Image00006.jpg)


    The **feof()** function returns true when the end of the file is reached.


    ![image](Image00029.jpg)


    readlines.php


    ![image](Image00008.jpg)  Begin a PHP script with statements that attempt to open
    a plain text file for reading, or exit the script upon failure


    **<?php**


    **$filestream = fopen( ‘manifesto.txt’ , ‘r’ )**


    **o** r **die( ‘Unable to open file!’ ) ;**


    ![image](Image00010.jpg)  Next, add a loop to read the text file line-by-line
    upon success and display its entire contents


    **while( !feof( $filestream ) )**


    **{ echo fgets( $filestream ). ’<br>’ ; }**


    ![image](Image00012.jpg)  Now, remember to close the file stream


    **fclose( $filestream ) ;**


    ![image](Image00014.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **readlines.php**  , alongside the plain text file to be read, then open the
    page via HTTP to see the text file lines


    ![image](Image00141.jpg)


    ![image](Image00005.jpg)


    The next to last line is not actually empty – it contains an invisible newline
    character.


    **Reading characters**


    Once a “filestream” object is created, its contents can be read one character
    at a time by specifying the filestream as an argument to the PHP **fgetc()** function.
    To read every character this function can be called repeatedly in a loop. The
    **fgetc()** function will return false when the end of the file is reached and
    can end the loop:


    ![image](Image00142.jpg)


    ![image](Image00019.jpg)


    If you create this text file using Windows’ Notepad app you will see leading Byte
    Order Mark characters in this example. The Notepad++ app shown here does not add
    these.


    ![image](Image00029.jpg)


    readchars.php


    ![image](Image00008.jpg)  Begin a PHP script with statements that attempt to open
    a plain text file for reading, or exit the script upon failure


    **<?php**


    **$filestream = fopen( ‘title.txt’ , ‘r’ )**


    **o** r **die( ‘Unable to open file!’ ) ;**


    ![image](Image00010.jpg)  Next, add a loop to read the text file character-by-
    character upon success and display its entire contents


    **while( $char = fgetc( $filestream ) )**


    **{ echo $char . ’ * ‘ ; }**


    ![image](Image00012.jpg)  Now, remember to close the file stream


    **fclose( $filestream ) ;**


    ![image](Image00014.jpg)  Save the document in your web server’s  **/htdocs**  directory
    as  **readchars.php**  , alongside the plain text file to be read, then open the
    page via HTTP to see the file characters


    ![image](Image00143.jpg)


    ![image](Image00006.jpg)


    The **fgetc()** function returns false when there are no more characters to get
    from the stream.


    **Writing a file**


    Once a “filestream” object has been created specifying a write mode, a text file
    can be created. Text can be written into the file by specifying the filestream
    and a file name to the PHP **fwrite()** function. To format the text, non-printing
    invisible characters can also be written to create line breaks and tab spacing:


    | **Character:** | **Description:** |


    | **\n** | Newline Move to a new line down |


    | **\r** | Carriage return Move to the beginning of the line |


    | **\t** | Tab Move along the line to the next tab stop |


    ![image](Image00019.jpg)


    Strings containing non-printing characters must be enclosed within double quotes
    so that PHP can interpret them.


    ![image](Image00029.jpg)


    write.php


    ![image](Image00008.jpg)  Begin a PHP script with a statement to assign text,
    including non-printing characters for formatting


    **<?php**


    **$poem = “\r\n\tI never saw a man who looked” ;**


    **$poem .= “\r\n\tWith such a wistful eye” ;**


    **$poem .= “\r\n\tUpon that little tent of blue” ;**


    **$poem .= “\r\n\tWhich prisoners call the sky” ;**


    ![image](Image00010.jpg)  Next, assign a name for the file to be written


    **$filename = ‘poem.txt’ ;**


    ![image](Image00012.jpg)  Attempt to create a plain text file for writing, or
    exit the script upon failure


    **$filestream = fopen( $filename , ‘w’ )**


    **o** r **die( ‘Unable to open file!’ ) ;**


    ![image](Image00014.jpg)  Write the file and display a confirmation of how many
    bytes have been written in total


    **$num = fwrite( $filestream , $poem ) ;**


    **if( $num )**


    **{**


    **echo “ $num bytes written to $filename ” ;**


    **}**


    ![image](Image00015.jpg)  Now, remember to close the file stream


    **fclose( $filestream ) ;**'
