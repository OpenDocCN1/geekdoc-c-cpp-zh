  trans: "\n将密码存储在 cookie 中并不是最安全的方法，但此处仅用于演示如何使用 cookie 存储数据。\n\n### 设置 cookie\n\n\
    在接收到表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用 `ctype_alnum()` 函数简单地确认值是否仅包含字母和数字。\n\
    \n验证通过后，可以使用 `setcookie()` 函数存储提交的字段名和值。此外，可以使用 `md5()` 函数对密码值进行哈希转换。在成功完成后，脚本可以使用\
    \ `header()` 函数将浏览器重定向到另一个页面，指定该页面的 URL：\n\n![image](img/Image00029.jpg)\n\ncookie_set.php\n\
    \n![image](img/Image00054.jpg)  开始一个 PHP 脚本，使用一个函数处理验证失败的尝试\n\n```php\n<?php\n\
    \nfunction reject ( $entry )\n{\n\techo “Invalid $entry <br>” ;\n\techo ‘Please\
    \ <a href=” cookie_form.html ”>Log In</a>’ ;\n\texit() ;\n}\n```\n\n![image](img/Image00055.jpg)\
    \  接下来，添加一个条件测试块来为有效数据设置两个 cookie，或者调用该函数处理失败的尝试\n\n```php\nif( isset( $_POST[\
    \ ‘user’ ] ) )\n{\n\t$user = trim( $_POST[ ‘user’ ] ) ;\n\tif( !ctype_alnum( $user\
    \ ) ) { reject( ‘User Name’ ) ; }\n\tif( isset( $_POST[ ‘pass’ ] ) )\n\t{\n\t\t\
    $pass = trim( $_POST[ ‘pass’ ] ) ;\n\t\tif( !ctype_alnum( $pass ) ) { reject(\
    \ ‘Password’ ) ; }\n\t\telse\n\t\t{\n\t\t\tsetcookie( ‘user’ , $user , time()+\
    \ 3600 ) ;\n\t\t\tsetcookie( ‘pass’ , md5( $pass ) , time()+ 3600 ) ;\n\t\t\t\
    header( ‘Location: cookie_get.php ’ ) ;\n\t\t}\n\t}\n}\nelse { header( ‘Location:\
    \ cookie_form.html ’ ) ; }\n?>\n```\n\n![image](img/Image00056.jpg)  将文档保存到 Web\
    \ 服务器的 `/htdocs` 目录下命名为 `cookie_set.php`，然后查看如何检索已存储的 cookie 数据\n\n![image](img/Image00006.jpg)\n\
    \n`ctype_alnum()` 函数仅在当参数包含字母和数字字符时才返回 true。\n\n![image](img/Image00005.jpg)\n\
    \n注意此处如何使用 `time()` 函数来获取当前时间，然后增加一小时（秒），以便将 cookie 的过期时间设置为一小时后。\n\n![image](img/Image00005.jpg)\n\
    \n如果直接打开脚本 URL，最后的 `else` 语句将把页面重定向到 HTML 表单页。\n\n### 获取 cookie\n\n一旦设置了 cookie，它们会自动分配给特殊的\
    \ PHP 全局数组变量 `$_COOKIE`。脚本可以使用 PHP 内置的 `isset()` 函数检查单个 cookie 是否存在以查找指定指定的 cookie。当确认\
    \ cookie 确实存在时，可以将其值方便地赋值给普通脚本变量。这可以用于检索存储的用户名并在页面上输出。如果请求的 cookie 不存在，脚本可以为用户提供备选方案：\n\
    \n![image](img/Image00029.jpg)\n\ncookie_get.php\n\n![image](img/Image00054.jpg)\
    \  开始一个 PHP 脚本，通过测试来查找 cookie 并在成功后检索数据进行输出\n\n```php\n<?php\n\nif( isset( $_COOKIE[\
    \ ‘user’ ] ) )\n{\n\t$user = $_COOKIE[ ‘user’ ] ;\n\techo “<h1>Welcome $user !</h1><hr>”\
    \ ;\n\techo ‘<a href=” cookie_data.php ”>View Cookie</a>’ ;\n}\n```\n\n![image](img/Image00055.jpg)\
    \  接下来，为 cookie 不存在的情况添加备选输出\n\n```php\nelse\n{\n\techo ‘Please <a href=” cookie_form.html\
    \ ”>Log In</a>’ ;\n}\n?>\n```\n\n![image](img/Image00056.jpg)  将文档保存到 Web 服务器的\
    \ `/htdocs` 目录下命名为 `cookie_get.php`\n\n![image](img/Image00057.jpg)  现在通过 HTTP\
    \ 打开 HTML 表单 `cookie_form.html`（在此处 创建），并点击提交按钮以查看登录尝试验证失败，因此未设置任何 cookie\n\n\
    ![image](img/Image00180.jpg)\n\n![image](img/Image00058.jpg)  点击超链接返回 HTML 表单并输入有效的用户名，然后点击提交按钮再次查看登录尝试再次验证失败\n\
    \n![image](img/Image00181.jpg)\n\n再次返回 HTML 表单，输入有效的用户名和密码，查看验证成功\n\n![image](img/Image00182.jpg)\n\
    \n![image](img/Image00183.jpg)\n\n![image](img/Image00184.jpg)\n\n![image](img/Image00061.jpg)\
    \  再次返回 HTML 表单，输入有效的用户名和密码，查看验证成功\n\n![image](img/Image00182.jpg)\n\n`cookie_data.php`（见下文）\n\
    \n### 查看 cookie 数据\n\n特殊的 PHP `$_COOKIE` 全局数组存储了键和值。可以通过 `var_dump()` 循环数组来查看\
    \ cookie 数据：\n\n```php\n<?php\n\nif( count( $_COOKIE ) > 0 )\n{\n\tforeach( $_COOKIE\
    \ as $key => $value )\n\t{\n\t\techo “<dt>$key</ ;\n\t\techo “<dd>$value</ ;\n\
    \t}\n\techo “</dl><hr>\";\n\tvar_dump( $_COOKIE ) ;\n}\n?>\n```\n\nPHP 手册描述了通过将值置空并将日期设置为过去来移除\
    \ cookie。例如 `setcookie($_COOKIE['user'], '', time()-3600)`。此外，可以使用 `unset()` 函数删除指定的变量。\n\
    \n### 提交 session 数据\n\n只有当用户允许 cookie 进入系统时，用户数据才能存储在客户端的 cookie 中。然而，许多用户为了避免跟踪禁用\
    \ cookie，但 PHP 提供了一个更好的替代方案。使用 PHP，可以使用特殊的 `$_SESSION` 全局数组变量在服务器上存储用户数据。为了让 PHP\
    \ Session 工作，每个 PHP 页面必须调用内置的 `session_start()` 函数——在任何 HTML 标签之前！通过 **POST**\
    \ 方法向服务器提交 HTML 表单会将字段数据分配给特殊的 PHP `$_POST` 全局数组变量，可以使用 PHP 内置的 `isset()` 函数查找单个提交字段。当确认该字段存在时，可以将其名称和值存储在会话变量中。这可以用于在整个网站中使用存储用户名和密码详情，作为\
    \ cookie 存储的替代方案：\n\n![image](img/Image00174.jpg)\n\nsession_form.html\n\n![image](img/Image00054.jpg)\
    \  创建一个 HTML 文档并将此表单添加到其主体部分，指定提交方法和 PHP 提交处理脚本的名称\n\n"
- fmt: "\n```html\n<form name =\"entry\" method =\" POST \" action =\" session_set.php\
    \ \">\n  <fieldset>\n    <legend>F o r Name : Enter Only Letters </legend>\n \
    \   Name : <input type=”text” name=” user \">\n    Password : <input type=”password”\
    \ name=” pass \">\n    <p> For Password : Enter Only A-Z a-z 0-9 . _ (Minimum\
    \ 8 Characters) </p> <input type=”submit” value=”Log In\">>\n  </fieldset>\n</form>\n\
    ```\n\n![image](Image00055.jpg)  Save the document in your web server’s `/htdocs`\
    \ directory as `session_form.html` then open the page via HTTP to see the form\n\
    \n![image](Image00190.jpg)\n\n![image](Image00019.jpg)\n\nSession variables will\
    \ only be accessible to a PHP script if the `session_start()` function has been\
    \ called at the top of the page.\n\n### Setting sessions\n\nUpon receiving a form\
    \ submission, a PHP script can check for the presence of fields and might perform\
    \ validation of their associated values. For example, the `ctype_alpha()` function\
    \ could be used to confirm they contain only letters, and the `preg_match()` function\
    \ could be used to confirm a value matches a specified pattern. Once validated,\
    \ the submitted fields’ names and values can be assigned to elements of the `$_SESSION`\
    \ global array variable. On successful completion, the script can relocate the\
