    \ ;\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\n![image](img/Image00029.jpg)\n\
    \n`include.php`\n\n![image](img/Image00042.jpg) 将 PHP 脚本保存到 Web 服务器的 `/htdocs`\
    \ 目录下并为 `include.php`，然后通过 HTTP 打开它以查看设置的标题以及被静态内容包裹的表单。\n\n![image](img/Image00176.jpg)\n\
    \n![image](img/Image00005.jpg) 你可以使用浏览器的“查看源代码”功能查看整个内容是否已有效整合到单个网页中。\n\n## 附加链接数据\n\
    \nPHP 预定义的“超级全局”变量，例如存储页面请求方法的 `$_SERVER` 数组变量，以及在用户退出前存储网站跨页面用户数据的 `$_SESSION`\
    \ 数组变量，在任何脚本的所有作用域内都是可访问的。\n\n![image](img/Image00005.jpg) `$_SESSION` 超级全局将用于在第\
    \ 10 章中存储用户详情。\n\n当 HTML 表单使用 `POST` 方法提交数据时，`$_POST` 数组将提交的表单值存储在同名的数组元素中。因此，可以使用\
    \ `$_POST[‘city’]` 访问名为“city”的提交字段的值。\n\n同样，当使用 `GET` 方法提交数据时，`$_GET` 数组将提交的值存储在命名的数组元素中。因此，可以使用\
    \ `$_GET[‘id’]` 访问名为“id”的提交数据。这通常用于通过在 HTML 超链接锚点的 URL 后附加 `name=value` 对来向脚本提交数据，如下所示：\n\
    \n```html\n<a href=”www.example.com/script.php?id=1”>\n```\n\n由超链接指定的接收数据的脚本随后可以使用传递的值来确定响应：\n\
    \n![image](img/Image00029.jpg)\n\n`link.php`\n\n![image](img/Image00036.jpg) 创建一个包含\
    \ PHP 脚本的 HTML 文档，该脚本在 `$_GET` 数组中寻找名为“id”的元素。\n\n```php\n<?php\nif ( isset (\
    \ $_GET[ ‘id’ ] )\n{\n    # 在此处插入处理语句（步骤 2-3 ）。\n}\n```\n\n![image](img/Image00037.jpg)\
    \ 接下来，插入一个处理语句，将传递的值分配给同名的 PHP 变量。\n\n```php\n$id = $_GET[ ‘id’ ] ;\n```\n\n![image](img/Image00038.jpg)\
    \ 现在，插入一个处理语句根据传递的值输出适当的响应。\n\n```php\nswitch( $id )\n{\n    case 1 : echo ‘Cow\
    \ selected<hr>’ ; break ;\n    case 2 : echo ‘Dog selected<hr>’ ; break ;\n  \
    \  case 3 : echo ‘Goat selected<hr>’ ; break ;\n}\n```\n\n![image](img/Image00039.jpg)\
    \ 最后，添加语句显示带有附加值的超链接。\n\n```php\necho ‘<h1>Select a buddy</h1>’ ;\necho ‘ <p><a\
    \ href=”link.php? id=1 ”>Cow</a> |’ ;\necho ‘ <a href=”link.php? id=2 ”>Dog</a>\
    \ | ‘ ;\necho ‘ <a href=”link.php? id=3 ”>Goat</a></p>’ ;\n?>\n```\n\n![image](img/Image00040.jpg)\
    \ 将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并为 `link.php`，然后通过 HTTP 打开它并点击链接以查看传递值对应的响应。\n\
    \n![image](img/Image00177.jpg)\n\n![image](img/Image00178.jpg)\n\n![image](img/Image00019.jpg)\
    \ PHP 还提供了一个 `$_REQUEST` 超级全局，它包含了 `$_POST` 和 `$_GET` 数组的所有内容。这意味着可以使用 `$_REQUEST[‘city’]`\
    \ 访问 `$_POST[‘city’]`，但应避免这样做。请始终根据提交类型类型使用特定的数组。\n\n![image](img/Image00006.jpg)\
    \ 注意到传递的 `name=value` 对在浏览器地址栏中是可见的。\n\n## 总结\n\n- HTML `<form>` 标签的 `action`\
