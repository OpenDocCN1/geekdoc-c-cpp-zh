  \ `action` 属性指定处理表单提交的 PHP 脚本，其 `method` 属性指定数据如何发送到脚本。\n\n\n\n将密码存储在 cookie 中并不是最安全的方法，但此处仅用于演示如何使用\
  \ cookie 存储数据。\n\n### 设置 cookie\n\n在接收到表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用\
  \ `ctype_alnum()` 函数简单地确认值是否仅包含字母和数字。\n\n验证通过后，可以使用 `setcookie()` 函数存储提交的字段名和值。此外，可以使用\
  \ `md5()` 函数对密码值进行哈希转换。在成功完成后，脚本可以使用 `header()` 函数将浏览器重定向到另一个页面，指定该页面的 URL：\n\n\
  ![image](img/Image00029.jpg)\n\ncookie_set.php\n\n![image](img/Image00054.jpg) \
  \ 开始一个 PHP 脚本，使用一个函数处理验证失败的尝试\n\n```php\n<?php\n\nfunction reject ( $entry )\n{\n\
  \techo “Invalid $entry <br>” ;\n\techo ‘Please <a href=” cookie_form.html ”>Log\
  \ In</a>’ ;\n\texit() ;\n}\n```\n\n![image](img/Image00055.jpg)  接下来，添加一个条件测试块来为有效数据设置两个\
  \ cookie，或者调用该函数处理失败的尝试\n\n```php\nif( isset( $_POST[ ‘user’ ] ) )\n{\n\t$user =\
  \ trim( $_POST[ ‘user’ ] ) ;\n\tif( !ctype_alnum( $user ) ) { reject( ‘User Name’\
  \ ) ; }\n\tif( isset( $_POST[ ‘pass’ ] ) )\n\t{\n\t\t$pass = trim( $_POST[ ‘pass’\
  \ ] ) ;\n\t\tif( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }\n\t\telse\n\t\
  \t{\n\t\t\tsetcookie( ‘user’ , $user , time()+ 3600 ) ;\n\t\t\tsetcookie( ‘pass’\
  \ , md5( $pass ) , time()+ 3600 ) ;\n\t\t\theader( ‘Location: cookie_get.php ’ )\
  \ ;\n\t\t}\n\t}\n}\nelse { header( ‘Location: cookie_form.html ’ ) ; }\n?>\n```\n\
  \n![image](img/Image00056.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下命名为 `cookie_set.php`，然后查看如何检索已存储的\
  \ cookie 数据\n\n![image](img/Image00006.jpg)\n\n`ctype_alnum()` 函数仅在当参数包含字母和数字字符时才返回\
  \ true。\n\n![image](img/Image00005.jpg)\n\n注意此处如何使用 `time()` 函数来获取当前时间，然后增加一小时（秒），以便将\
  \ cookie 的过期时间设置为一小时后。\n\n![image](img/Image00005.jpg)\n\n如果直接打开脚本 URL，最后的 `else`\
  \ 语句将把页面重定向到 HTML 表单页。\n\n### 获取 cookie\n\n一旦设置了 cookie，它们会自动分配给特殊的 PHP 全局数组变量 `$_COOKIE`。脚本可以使用\
  \ PHP 内置的 `isset()` 函数检查单个 cookie 是否存在以查找指定指定的 cookie。当确认 cookie 确实存在时，可以将其值方便地赋值给普通脚本变量。这可以用于检索存储的用户名并在页面上输出。如果请求的\
  \ cookie 不存在，脚本可以为用户提供备选方案：\n\n![image](img/Image00029.jpg)\n\ncookie_get.php\n\n\
  ![image](img/Image00054.jpg)  开始一个 PHP 脚本，通过测试来查找 cookie 并在成功后检索数据进行输出\n\n```php\n\
  <?php\n\nif( isset( $_COOKIE[ ‘user’ ] ) )\n{\n\t$user = $_COOKIE[ ‘user’ ] ;\n\t\
  echo “<h1>Welcome $user !</h1><hr>” ;\n\techo ‘<a href=” cookie_data.php ”>View\
  \ Cookie</a>’ ;\n}\n```\n\n![image](img/Image00055.jpg)  接下来，为 cookie 不存在的情况添加备选输出\n\
  \n```php\nelse\n{\n\techo ‘Please <a href=” cookie_form.html ”>Log In</a>’ ;\n}\n\
  ?>\n```\n\n![image](img/Image00056.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下命名为 `cookie_get.php`\n\
  \n![image](img/Image00057.jpg)  现在通过 HTTP 打开 HTML 表单 `cookie_form.html`（在此处 创建），并点击提交按钮以查看登录尝试验证失败，因此未设置任何\
  \ cookie\n\n![image](img/Image00180.jpg)\n\n![image](img/Image00058.jpg)  点击超链接返回\
  \ HTML 表单并输入有效的用户名，然后点击提交按钮再次查看登录尝试再次验证失败\n\n![image](img/Image00181.jpg)\n\n再次返回\
  \ HTML 表单，输入有效的用户名和密码，查看验证成功\n\n![image](img/Image00182.jpg)\n\n![image](img/Image00183.jpg)\n\
  \n![image](img/Image00184.jpg)\n\n![image](img/Image00061.jpg)  再次返回 HTML 表单，输入有效的用户名和密码，查看验证成功\n\
  \n![image](img/Image00182.jpg)\n\n`cookie_data.php`（见下文）\n\n### 查看 cookie 数据\n\n\
  特殊的 PHP `$_COOKIE` 全局数组存储了键和值。可以通过 `var_dump()` 循环数组来查看 cookie 数据：\n\n```php\n<?php\n\
  \nif( count( $_COOKIE ) > 0 )\n{\n\tforeach( $_COOKIE as $key => $value )\n\t{\n\
  \t\techo “<dt>$key</ ;\n\t\techo “<dd>$value</ ;\n\t}\n\techo “</dl><hr>\";\n\t\
  var_dump( $_COOKIE ) ;\n}\n?>\n```\n\nPHP 手册描述了通过将值置空并将日期设置为过去来移除 cookie。例如 `setcookie($_COOKIE['user'],\
  \ '', time()-3600)`。此外，可以使用 `unset()` 函数删除指定的变量。\n\n### 提交 session 数据\n\n只有当用户允许\
  \ cookie 进入系统时，用户数据才能存储在客户端的 cookie 中。然而，许多用户为了避免跟踪禁用 cookie，但 PHP 提供了一个更好的替代方案。使用\
  \ PHP，可以使用特殊的 `$_SESSION` 全局数组变量在服务器上存储用户数据。为了让 PHP Session 工作，每个 PHP 页面必须调用内置的\
  \ `session_start()` 函数——在任何 HTML 标签之前！通过 **POST** 方法向服务器提交 HTML 表单会将字段数据分配给特殊的 PHP\
  \ `$_POST` 全局数组变量，可以使用 PHP 内置的 `isset()` 函数查找单个提交字段。当确认该字段存在时，可以将其名称和值存储在会话变量中。这可以用于在整个网站中使用存储用户名和密码详情，作为\
  \ cookie 存储的替代方案：\n\n![image](img/Image00174.jpg)\n\nsession_form.html\n\n![image](img/Image00054.jpg)\
  \  创建一个 HTML 文档并将此表单添加到其主体部分，指定提交方法和 PHP 提交处理脚本的名称\n\n\n\n\n\n```html\n<form name\
  \ =\"entry\" method =\" POST \" action =\" session_set.php \">\n  <fieldset>\n \
  \   <legend>F o r Name : Enter Only Letters </legend>\n    Name : <input type=”text”\
  \ name=” user \">\n    Password : <input type=”password” name=” pass \">\n    <p>\
  \ For Password : Enter Only A-Z a-z 0-9 . _ (Minimum 8 Characters) </p> <input type=”submit”\
  \ value=”Log In\">>\n  </fieldset>\n</form>\n```\n\n![image](img/Image00055.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `session_form.html`，然后通过 HTTP 打开页面以查看表单\n\n\
  ![image](img/Image00190.jpg)\n\n![image](img/Image00019.jpg)\n\n只有在页面顶部调用了 `session_start()`\
  \ 函数，PHP 脚本才能访问会话变量。\n\n### 设置会话\n\n接收表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联的值进行验证。例如，可以使用\
  \ `ctype_alpha()` 函数确认它们仅包含字母，并可以使用 `preg_match()` 函数确认值是否匹配指定模式。一旦验证通过，可以将提交的字段名称和值赋值给\
  \ `$_SESSION` 全局数组变量的元素。成功完成后，脚本可以使用 `header()` 函数指定该页面的 URL，将浏览器重定向到下一个页面：\n\n\
  ![image](img/Image00029.jpg)\n\nsession_set.php\n\n![image](img/Image00054.jpg)\
  \  添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start(); ?>\n```\n\n![image](img/Image00055.jpg)\
  \  开始一个 PHP 脚本来处理失败的验证尝试\n\n```php\n<?php\nfunction reject ( $entry )\n{\n  echo\
  \ “Invalid $entry <br>” ;\n  echo ‘Please <a href=” session_form.html ”>Log In</a>’\
  \ ;\n  exit() ;\n}\n```\n\n![image](img/Image00056.jpg)  添加条件测试块以为有效数据设置两个 cookie，或调用函数处理失败尝试\n\
  \n```php\nif( isset( $_POST[ ‘user’ ] ) )\n{\n  $user = trim( $_POST[ ‘user’ ] )\
  \ ;\n  if( !ctype_alpha( $user ) ) { reject( ‘User Name’ ) ; }\n  if( isset( $_POST[\
  \ ‘pass’ ] ) )\n  {\n    $pass = trim( $_POST[ ‘pass’ ] ) ;\n    if( !preg_match(\
  \ ‘/^[A-Za-z0-9._]{8,}$/’ , $pass ) )\n    { reject( ‘Password’ ) ; }\n    else\n\
  \    {\n      $_SESSION[ ‘user’ ] = $user ;\n      $_SESSION[ ‘pass’ ] = $pass ;\n\
  \      header( ‘Location: session_get.php ’ ) ;\n    }\n  }\n} else { header( ‘Location:\
  \ session_form.html ’ ) ; }\n?>\n```\n\n![image](img/Image00057.jpg)  将文档保存到 Web\
  \ 服务器的 `/htdocs` 目录并命名为 `session_set.php`，然后查看如何检索数据\n\n![image](img/Image00006.jpg)\n\
  \n`ctype_alpha()` 函数仅在其参数包含字母时返回 true。\n\n![image](img/Image00005.jpg)\n\n`preg_match()`\
  \ 函数接受一个正则表达式和一个字符串参数。正则表达式超出了本书的涵盖范范围，但你可以精确地复制此示例，以允许表单上描述的许可密码模式。在此示例中，密码未加密，以便在稍后演示用户密码符合指定要求。\n\
  \n### 获取会话\n\n在调用 `session_start()` 函数后，就可以通过特殊的 `$_SESSION` 全局数组变量访问会话数据。PHP `isset()`\
  \ 函数可以查找指定名称的元素。当这确认元素存在时，可以将其值很有用地赋值给普通的脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果查找的元素不存在，脚本可以为用户提供备选方案：\n\
  \n![image](img/Image00029.jpg)\n\nsession_get.php\n\n![image](img/Image00054.jpg)\
  \  添加初始 PHP 脚本使会话可用\n\n```php\n<?php session_start() ; ?>\n```\n\n![image](img/Image00055.jpg)\
  \  现在，开始一个 PHP 脚本来查找会话变量并在成功后检索数据进行输出，或者在会话变量不存在时提供备选方案\n\n```php\n<?php\nif( isset(\
  \ $_SESSION[ ‘user’ ] ) )\n{\n  $user = $_SESSION[ ‘user’ ] ;\n  echo “<h1>Welcome\
  \ $user !</h1><hr>” ;\n  echo ‘<a href=” session_data.php ”>View Session</a>’ ;\n\
  }\nelse\n{ echo ‘Please <a href=” session_form.html ”>Log In</a>’ ; }\n?>\n```\n\
  \n![image](img/Image00056.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `session_get.php`\n\
  \n![image](img/Image00057.jpg)  现在，打开 HTML 表单 `session_form.html`（在此处 创建），通过 HTTP\
  \ 访问 `session_form.html` 目标并提交以查看验证失败\n\n![image](img/Image00191.jpg)\n\n![image](img/Image00058.jpg)\
  \  返回 HTML 表单并提交用户名查看验证失败\n\n![image](img/Image00192.jpg)\n\n![image](img/Image00061.jpg)\
  \  再次返回 HTML 表单并提交用户名查看验证失败\n\n![image](img/Image00193.jpg)\n\n![image](img/Image00194.jpg)\
  \  再次提交一次有效的用户名和密码查看验证成功\n\n![image](img/Image00184.jpg)  查看 `session_data.php`\
  \ 中存储的会话变量\n\n![image](img/Image00055.jpg)  注意必须调用 `session_start()` 函数。\n\n###\
  \ 查看会话数据\n\n在调用 `session_start()` 函数后，就可以通过特殊的 `$_SESSION` 全局数组变量访问会话数据。PHP `isset()`\
  \ 函数可以查找指定名称的元素。当这确认元素存在时，可以将其值很有用地赋值给普通的脚本变量。这可能用于检索存储的用户名以便在页面上输出。如果查找的元素不存在，脚本可以为用户提供备选方案：\n\
  \n`$_SESSION` 全局数组存储了键和值。可以使用 `session_id()` 函数查看每个会话。此外，可以使用 `unset()` 函数移除每个会话变量，并通过调用\
  \ `session_destroy()` 函数完全终止会话：\n\n```php\n<?php\nfunction kill_session()\n{\n \
  \ unset( $_SESSION[ ‘user’ ] )\n  unset( $_SESSION[ ‘pass’ ] ) ;\n  session_destroy()\
  \ ;\n  echo ‘<hr>Session Destroyed<br>’ ;\n  echo ‘Session ID : ‘ .session_id().’<br>\
  \ ;\n  var_dump( $_SESSION ) ;\n}\n```\n\n现在，添加一个测试来检查是否设置了会话变量\n\n```php\nif( count(\
  \ $_SESSION ) > 0 )\n{\n  echo ‘<dl> ;\n  foreach( $_SESSION as $key => $value )\n\
  \  {\n    echo “<dt>Key: $key ” ; echo “<dd>Value: $value ” ;\n  }\n  echo ‘</dl><hr>\
  \ ;\n  // 在此处插入语句（步骤 4）。\n}\n```\n\n你可以随时为会话变量分配新值以覆盖现有的存储值。\n\n```php\nelse\n{\n\
  \  echo ‘Please <a href=” session_form.html ”>Log In</a>’ ;\n}\n?>\n```\n\n\n\n\n\
  \n![image](img/Image00197.jpg) 使用浏览器中的 ![image](img/Image00198.jpg) 刷新按钮重新加载此页面，以查看备用的“请登录”内容\n\
  \n![image](img/Image00005.jpg)\n\n注意密码必须符合允许的模式。\n\n## 总结\n\n- PHP `set_cookie()`\
  \ 函数可将用户数据存储在客户端机器，以便在网站的不同页面之间使用\n- 为 `set_cookie()` 函数应至少提供三个参数，以指定名称、值和过期时间\n\
  - 通过 `POST` 方法提交的 HTML 表单会自动将字段数据分配给 PHP `$_POST` 全局数组变量\n- `isset()` 函数可以在 `$_POST`\
  \ 全局数组中查找指定 HTML 字段名的元素\n- `ctype_alnum()` 函数可用于确认值是否仅包含字母和数字以进行验证\n- 可以使用 `md5()`\
  \ 函数对密码值进行哈希转换以进行加密\n- PHP `header()` 函数可以指定 `Location:URL` 来重定向浏览器\n- 一旦设置了 cookie，它们会自动分配给特殊的\
  \ PHP `$_COOKIE` 全局数组变量\n- 用户数据可以存储在服务器的 PHP `$_SESSION` 全局数组变量中，作为 cookie 存储的替代\n\
  - 要使用 session，每个 PHP 页面必须在任何 HTML 标签之前的页面顶部调用 `session_start()` 函数\n- 提交到 `$_POST`\
  \ 全局数组的 HTML 字段数据可以分配给 `$_SESSION` 全局变量数组元素\n- `ctype_alpha()` 函数可用于确认值是否仅包含字母进行验证\n\
  - `preg_match()` 函数可用于确认值是否匹配指定的模式以进行验证\n- 每个 session 都有唯一的 session ID 数字，可以使用 PHP\
  \ `session_id()` 函数查看\n- 可以 `unset()` 函数移除 session 变量，并使用 `session_destroy()` 函数终止\
  \ session\n- 使用 `var_dump()` 函数并遍历 `$_COOKIE` 或 `$_SESSION` 数组可以查看存储的内容\n\n11\n\n\
  ## 连接数据库\n\n*本章演示了如何使用 PHP 和 MySQL 数据库建立一个简单的用户论坛。*\n\n- 建立连接\n- 创建论坛\n- 提供页面\n\
  - 提供表单\n- 处理消息\n- 确认成功\n- 总结\n\n### 建立连接\n\n可以从标准的 PHP 脚本尝试连接到 MySQL 数据库。脚本定义了一个名为\
  \ `dbc`（数据库连接）的变量，其值由调用内置的 `mysqli_connect()` 函数返回。该调用需要四个参数来指定主机服务器、MySQL 用户名和密码以及要连接的数据库。当调用成功时，`mysqli_connect()`\
  \ 函数返回一个代表与 MySQL 服务器连接的“对象”。脚本如下：\n\n```php\n<?php\n$dbc = mysqli_connect('host',\
  \ 'user', 'password', 'database')\nOR die ( mysqli_connect_error() );\nmysqli_set_charset($dbc,\
  \ 'utf-8');\n```\n\n![image](img/Image00029.jpg)\n\nconnect_db.php\n\n![image](img/Image00199.jpg)\n\
  \nMySQL 社区版可以在 [mysql.com/downloads/mysql](http://www.mysql.com/downloads/mysql)\
  \ 免费获取\n\n成功调用 `mysqli_connect()` 返回的对象非常重要，因为它被用与其他 MySQL 服务器通信的其他 PHP 函数调用的参数。例如，在上面的脚本中，它必须作为调用\
  \ `mysqli_set_charset()` 的第一个参数来标识连接。\n\n![image](img/Image00005.jpg)\n\n本章假设 MySQL\
  \ 数据库服务器已为本地服务器上的一个用户安装并配置，并且具有使用名为“website_db”数据库的完全权限。进一步的说明和示例可以在我们系列中的配套书籍 [PHP\
  \ & MySQL in easy steps](http://ineasysteps.com/products-page/all_books/php-mysql-in-easy-steps/)\
  \ 中找到。\n\n当调用 `mysqli_connect()` 函数失败时，脚本将跳转到调用 `die()` 函数的备分支。这等同于调用 `exit()` 立即终止脚本。`die()`\
  \ 函数可选接受一个字符串参数，并在脚本停止时打印。在这种情况下，字符串消息由 `mysqli_connect_error()` 函数返回，描述了连接尝试失败的原因。\n\
  \n由于连接脚本包含敏感用户详情，它不能放置在 Web 服务器的 `/htdocs` 目录下与其他 PHP 脚本一起。相反，`connect_db.php` 脚本应该位于\
  \ `/htdocs` 的父目录中，在那里无法被直接访问，但可以通过 `require` 语句纳入其他 PHP 脚本中，例如：\n\n```php\n<?php\n\
  require('../connect_db.php');\nif (mysqli_connect($dbc)) {\n    echo 'Connection\
  \ successful';\n}\n?>\n```\n\n### 创建论坛\n\n用户消息可以通过 PHP 脚本存储在数据库表中，因此随后可以将其检索，并显示在包含注册用户消息的论坛页面中。通常，包含消息的数据库表可能会存储帖子\
  \ ID、用户的名和姓氏、主题标题、消息本身以及发布日期：\n\n| 字段名 | 内容类型 | 示例 |\n| :--- | :--- | :--- |\n|\
  \ post_id | 数字 | 123 |\n| first_name | 文字 | Mike |\n| last_name | 文字 | McGrath |\n\
  | subject | 文字 | Ice Cream |\n| message | 文字 | Delicious on a hot day. |\n| post_date\
  \ | 日期/时间 | 2016-07-24 12:30:00 |\n\n![image](img/Image00199.jpg)\n\nMySQL 数据库表只能由\
  \ root MySQL 用户或其他被授予完全访问权限的 MySQL 用户创建。\n\n可以使用结构查询语言 (SQL) 创建此种设计的数据库表。该数据库表的设计仅要求为存储文本的列指定\
  \ SQL `VARCHAR` 或 `TEXT` 数据类型。帖子 ID 应该是正的 SQL 整数 `INT` 值，表通过 `AUTO_INCREMENT` 自动分配，而消息发布时间戳应存储为\
  \ SQL `DATETIME` 值。向数据库表发布消息需要所有这些项目，因此每个列都必须有一个 SQL `NOT NULL` 规则。\n\n![image](img/Image00005.jpg)\n\
  \n用于将此设计生成名为“forum”的 MySQL 数据库表的 SQL 命令可以在 MySQL 命令行客户端的提示符处发布，也可以通过在 浏览器中运行 PHP\
  \ 脚本来发布。\n\n\n\n\n\n![image](img/Image00067.jpg)  编写 PHP 脚本时，使用一个语句通过上一页描述的标准连接脚本连接数据库\n\
  \n```php\n<?php\n\nrequire( ‘..\\ connect_db.php ’ ) ;\n```\n\n![image](img/Image00068.jpg)\
  \  接下来，将表设计的 SQL 规范赋值给变量\n\n```php\n$sql = ‘CREATE TABLE IF NOT EXISTS forum ( ‘\
  \ .\n‘post_id INT UNSIGNED NOT NULL AUTO_INCREMENT ,’ .\n‘first_name VARCHAR(20)\
  \ NOT NULL ,’ .\n‘last_name VARCHAR(40) NOT NULL ,’ .\n‘subject VARCHAR(60) NOT\
  \ NULL ,’ .\n‘message TEXT NOT NULL ,’ .\n‘post_date DATETIME NOT NULL ,’ .\n‘PRIMARY\
  \ KEY ( post_id ) ) ‘ ;\n```\n\n![image](img/Image00069.jpg)  现在，添加一个测试来报告表是否成功创建，或者在失败时描述错误\n\
  \n```php\nif( mysqli_query( $dbc , $sql ) === TRUE )\n{\necho ‘Table “forum” created\
  \ successfully’ ;\n}\nelse\n{\necho ‘Error creating table : ‘ .mysqli_error( $dbc\
  \ ) ;\n}\n```\n\n![image](img/Image00070.jpg)  记住在完成后关闭数据库连接\n\n```php\nmysqli_close(\
  \ $dbc ) ;\n```\n\n![image](img/Image00072.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为\
  \ `create_forum.php`，然后通过 HTTP 打开该页面以创建论坛表\n\n![image](img/Image00202.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n`VARCHAR` 数据类型指定字符长度，而 `TEXT` 数据类型可以容纳最多 65,535 个字符。\n\n![image](img/Image00005.jpg)\n\
  \n`mysqli_query()` 函数执行 SQL 查询，而 `mysqli_error()` 函数会在发生错误时提供报告。\n\n## 提供页面\n\n\
  可以创建一个论坛页面，显示从上一页创建的 MySQL ‘forum’ 表中检索的之前发布的消息。论坛消息可以显示在页眉和页脚之间，并带有一个指向另一个页面的超链接，用户可以在该页面发布新的论坛消息。如果论坛数据库中没有之前发布的内容，脚本可以简单地提示当前没有消息。\n\
  \nPHP `mysqli_query()` 函数可以进行 SQL 查询以检索表内容，而 `mysqli_num_rows()` 函数可以发现结果中有多少表行。当结果中找到表行时，可以使用\
  \ `mysqli_fetch_array()` 函数通过指定结果和 `MYSQLI_ASSOC` 常量作为参数，来获取行和每列数据的关联数组：\n\n![image](img/Image00029.jpg)\n\
  \nforum.php\n\n![image](img/Image00067.jpg)  编写 PHP 脚本时，使用一个语句设置页面标题\n\n```php\n\
  <?php\n\n$page_title = ‘PHP Forum’ ;\n```\n\n![image](img/Image00068.jpg)  接下来，添加一个语句来包含页眉\n\
  \n```php\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/Image00069.jpg)\
  \  添加一个语句来打开数据库连接\n\n```php\nrequire ( ‘..\\connect_db.php’ ) ;\n```\n\n![image](img/Image00070.jpg)\
  \  从数据库表中检索所有消息并将其赋值给变量\n\n```php\n$sql = ‘SELECT * FROM forum’ ;\n$result = mysqli_query(\
  \ $dbc , $sql ) ;\n```\n\n![image](img/Image00072.jpg)  测试数据库表是否为空并显示适当提示注释\n\n\
  ```php\nif ( mysqli_num_rows( $result ) > 0 )\n{\n// 在此处插入语句（第 6 步）。\n}\nelse\n\
  {\necho ‘<p>There are currently no messages.</p>’ ;\n}\n```\n\n![image](img/Image00006.jpg)\n\
  \n列以关联数组的形式返回，其中行名是该列中每个值的键。\n\n![image](img/Image00082.jpg)  接下来，插入语句，如果找到了从数据库表中检索的所有消息，则编写一个显示所有消息的表\n\
  \n```php\necho ‘<table><tr><th>Posted By</th>\n<th>Subject</th><th id=”msg”>Message</th></tr>’\
  \ ;\nwhile ( $row = mysqli_fetch_array( $result , MYSQLI_ASSOC ) )\n{\necho ‘<tr><td>’\
  \ .\n$row[ ‘first_name’ ] . ’ ‘ .\n$row[ ‘last_name’ ] . ‘<br>’ .\n$row[ ‘post_date’\
  \ ] . ’</td><td>’ .\n$row[ ‘subject’ ] . ‘</td><td>’ .\n$row[ ‘message’ ] . ‘</td></tr>’\
  \ ;\n}\necho ‘</table>’ ;\n```\n\n![image](img/Image00203.jpg)  在测试块之后，添加一个语句创建一个指向“发布消息”页面的超链接\n\
  \n```php\necho ‘<p><a href=”post.php”>Post Message</a></p>’ ;\n```\n\n![image](img/Image00070.jpg)\
  \  在测试块之后，添加一个语句关闭数据库连接\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](img/Image00070.jpg)\
  \  添加最后的语句来包含页脚\n\n```php\ninclude ( ‘includes/header.html’ ) ;\n```\n\n\n\n\n\n\
  `$page_title = ‘PHP Process Error’ ;`\n\n![image](img/Image00068.jpg) 接下来，添加一条语句来包含页眉\n\
  \n```php\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/Image00069.jpg)\
  \ 现在，添加一个退出函数，在验证失败时显示通知以及返回返回帖子页的链接\n\n```php\nfunction fail( $str )\n{\n    echo\
  \ “<p>Please enter a $str .</p>” ;\n    echo ‘<p><a href=”post.php”>Post Message</a’\
  \ ;\n    include ( ‘includes/footer.html’ ) ;\n    exit() ;\n}\n```\n\n![image](img/Image00070.jpg)\
  \ 添加一个测试以确保表单已提交\n\n```php\nif( isset( $_POST[ ‘message’ ] ) )\n{\n    // 在此处插入语句（第\
  \ 5 步）。\n    // 在此处插入语句（第 6 步）。\n    // 在此处插入语句（第 7 步）。\n}\n```\n\n![image](img/Image00006.jpg)\n\
  \n此脚本由 `post.php` 中的表单提名，用于处理提交的用户数据消息。然而，该表单并不是“粘性的”——这意味着如果用户必须返回表单以完成空输入字段，则输入的任何字段数据将不会保留。\n\
  \n![image](img/Image00072.jpg) 插入测试以确保用户已填写所有表单字段\n\n```php\nif ( !empty( trim(\
  \ $_POST[ ‘first_name’ ] ) ) )\n{ $first_name = addslashes( $_POST[ ‘first_name’\
  \ ] ) ; }\nelse { fail( ‘First Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘last_name’\
  \ ] ) ) )\n{ $last_name = addslashes( $_POST[ ‘last_name’ ] ) ; }\nelse { fail(\
  \ ‘Last Name’ ) ; }\n\nif ( !empty( trim( $_POST[ ‘subject’ ] ) ) )\n{ $subject\
  \ = addslashes( $_POST[ ‘subject’ ] ) ; }\nelse { fail( ‘Subject’ ) ; }\n\nif (\
  \ !empty( trim( $_POST[ ‘message’ ] ) ) )\n{ $message = addslashes( $_POST[ ‘message’\
  \ ] ) ) ; ; }\nelse { fail( ‘Message’ ) ; }\n```\n\n![image](img/Image00082.jpg)\
  \ 当验证成功时，打开数据库连接\n\n```php\nrequire ( ‘../connect_db.php’ ) ;\n```\n\n![image](img/Image00203.jpg)\
  \ 现在，插入语句以将提交的 HTML 表单字段值加入 MySQL “forum”数据库表\n\n```php\n$sql = “INSERT INTO forum\n\
  ( first_name, last_name, subject, message, post_date )\nVALUES\n(‘ $first_name ’,\
  \ ‘ $last_name ’,’ $subject ’, ‘ $message ’, NOW() )” ;\n$result = mysqli_query\
  \ ( $dbc , $sql ) ;\n```\n\n![image](img/Image00204.jpg) 最后，插入一条语句来报告失败错误，或在成功后将浏览器重定向到论坛页面\n\
  \n```php\nif ( mysqli_affected_rows( $dbc ) != 1 )\n{\n    echo ‘<p>Error</p> .mysqli_error(\
  \ $dbc ) ;\n    mysqli_close( $dbc ) ;\n}\nelse\n{\n    mysqli_close( $dbc ) ;\n\
  \    header( ‘Location: forum.php ’ ) ;\n}\n```\n\n![image](img/Image00205.jpg)\
  \ 将此脚本保存在 Web 服务器的 `/htdocs` 目录下并命名为 `process.php`，然后在不填写任何字段的情况下提交表单，以查看脚本显示错误消息\n\
  \n![image](img/Image00019.jpg)\n\n注意这里使用了 PHP 的 `addslashes()` 函数来转义单引号和引号。\n\n\
  ![image](img/Image00005.jpg)\n\n`NOW()` 是 MySQL 函数，返回当前时间戳的日期时间值。\n\n![image](img/Image00005.jpg)\n\
  \n如果脚本发现空的表单字段，它将提供自己的错误消息；如果数据无法添加到数据库表，则提供 MySQL 错误消息。\n\n### 确认成功\n\n现在是测试留言板流程的时间了，以确保验证执行正确，并且发布的消息出现在论坛页面上：\n\
  \n![image](img/Image00067.jpg) 打开发布消息页面，然后填写所有字段并提交表单，以查看消息出现在论坛上\n\n![image](img/Image00210.jpg)\n\
  \n![image](img/Image00211.jpg)\n\n![image](img/Image00006.jpg)\n\n“发布者（Posted By）”详细信息是从\
  \ MySQL “forum”数据库表的 `first_name`、`last_name` 和 `post_date` 列检索的。\n\n![image](img/Image00068.jpg)\
  \ 接下来，返回发布消息页面，然后尝试发布一条没有填写主题的消息以查看错误\n\n![image](img/Image00212.jpg)\n\n![image](img/Image00069.jpg)\
  \ 返回发布消息页面并发布一条消息\n\n![image](img/Image00213.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n## 总结\n\n- 这里使用了 PHP 的 `addslashes()` 函数来转义单引号和引号。\n\
  - `NOW()` 是 MySQL 函数，返回当前时间戳的日期时间值。\n- 如果脚本发现空的表单字段，它将提供自己的错误消息；如果数据无法添加到数据库表，则提供\
  \ MySQL 错误消息。\n\n\n\n\n\nPHP 提供了一个名为“SimpleXML”的 XML 解析器，它可以将 XML 文档加载到内存中并形成分级树结构。`simplexml_load_file()`\
  \ 函数需要 XML 文件的文件名和路径，以便将文档转换为包含 `SimpleXMLElement` 对象的数据结构。然后可以使用 `var_dump()` 函数对该数据结构进行探索。\n\
  \n![image](img/Image00029.jpg)\n\ncatalog.php\n\n![image](img/Image00085.jpg)  用设置页面标题并保留文本格式的语句开始\
  \ PHP 脚本\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title><pre>’ ;\n```\n\n![image](img/Image00086.jpg)\
  \  接下来，添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’\
  \ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  现在，显示所有的\
  \ SimpleXMLElement 对象\n\n```php\nvar_dump( $xml ) ;\n```\n\n![image](img/Image00088.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `catalog.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
  \ 打开页面以查看 SimpleXMLElement 对象\n\n![image](img/Image00216.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n注意，此数据结构描述了一个名为“book”的数组，它有五个数组元素——对应五个 XML `<book>` 元素。\n\n![image](img/Image00006.jpg)\n\
  \nXML 的无处不在使其成为跨越互联网传输数据的理想选择。\n\n### 获取节点\n\nSimpleXML 对象中包含的数据结构描述了外部 XML 和内部\
  \ XML 元素之间的父子关系。数据结构中的每个成员被称为“节点”（node）。顶层节点是 SimpleXML 对象本身的直接子后代，因此可以使用对象名、`->`\
  \ 对象操作符和子节点名称来引用。例如，`$object->child`。子节点的子（孙节点）可以通过进一步添加一个 `->` 对象操作符和孙节点名称来引用，例如\
  \ `$object->child->grandchild`，以此类推，每一代都是如此：\n\n![image](img/Image00029.jpg)\n\n\
  nodes.php\n\n![image](img/Image00085.jpg)  用设置页面标题的语句开始 PHP 脚本\n\n```php\n<?php\n\
  echo ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](img/Image00086.jpg)  添加一个语句来加载\
  \ XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\nor die( ‘Unable\
  \ to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  接下来，获取第一个“book”元素的子元素“title”元素的内容\n\
  \n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title . ’ in easy steps<br>\
  \ ;\n```\n\n![image](img/Image00088.jpg)  现在，获取第一个“book”元素的子元素“category”元素的内容\n\n\
  ```php\necho ‘Language category : ‘ . $xml -> book[0] -> category ;\n```\n\n![image](img/Image00089.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `nodes.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP\
  \ 打开页面以查看节点内容\n\n![image](img/Image00217.jpg)\n\n![image](img/Image00005.jpg)\n\n\
  由于在同一层级上有五个“book”节点，在例例中它们被创建为一个数组。因此，每个节点都可以使用其节点名称和数组索引号单独引用。\n\n### 遍历节点\n\n\
  SimpleXML 对象提供了许多方法来处理其数据结构中包含的数据。有用的是，它的 `children()` 方法返回所有子节点，并用于遍历节点以检索每个节点的内容：\n\
  \n![image](img/Image00029.jpg)\n\nnodes-loop.php\n\n![image](img/Image00085.jpg)\
  \  用设置页面标题的语句开始 PHP 脚本\n\n```php\n<?php\necho ‘<title>PHP SimpleXML</title>’ ;\n\
  ```\n\n![image](img/Image00086.jpg)  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file(\
  \ ‘catalog.xml’ )\nor die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \  接下来，初始化迭代计数器为零\n\n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg)\
  \  现在，添加一个循环来增加计数器并显示所有“title”和“category”子节点的内容\n\n```php\nforeach( $xml ->children()\
  \ as $book )\n{\n    $counter ++ ;\n    echo ‘Book ‘ . $counter . ’ : ‘ ;\n    echo\
  \ $book -> title . ’ in easy steps [’ . $book -> category . ’]<hr> ;\n}\n```\n\n\
  ![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `nodes-loop.php`，与\
  \ `catalog.xml` 文件放在一起，然后通过 HTTP 打开页面以查看节点内容\n\n![image](img/Image00216.jpg)\n\n\
  ![image](img/Image00005.jpg)\n\n### 获取属性\n\nSimpleXMLElement 内部的值可以通过在节点名称后加上属性名称来引用。例如，`$object['feature']`。\n\
  \n![image](img/Image00029.jpg)\n\nattribs.php\n\n![image](img/Image00085.jpg)  用设置页面标题的语句开始\
  \ PHP 脚本\n\n```php\n![phpecho ‘<title>PHP SimpleXML</title>’ ;```![image](img/Image00086.jpg)\
  \  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
  or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  接下来，获取第一个“book”元素的子元素“title”元素的内容\n\
  \n```php\necho ‘First book : ‘ .\n$xml -> book[0] -> title . ’ in easy steps<br>\
  \ ;\n```\n\n![image](img/Image00088.jpg)  现在，显示第一个“book”元素的子元素“category”元素的值\n\n\
  ```php\necho ‘Cover : ‘ .\n$xml -> book[0] -> title[‘cover’] . ’<br> ;\n```\n\n\
  ![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `nodes.php`，与 `catalog.xml`\
  \ 文件放在一起，然后通过 HTTP 打开页面以查看节点内容\n\n![image](img/Image00217.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n### 遍历属性\n\nSimpleXML 对象的 `children()` 方法可以再次用于遍历并在每次迭代中检索特定节点的值：\n\n![image](img/Image00029.jpg)\n\
  \nattribs-loop.php\n\n![image](img/Image00085.jpg)  用设置页面标题的语句开始 PHP 脚本\n\n```php\n\
  <?php\necho ‘<title>PHP SimpleXML</title>’ ;\n```\n\n![image](img/Image00086.jpg)\
  \  添加一个语句来加载 XML 数据或退出\n\n```php\n$xml = simplexml_load_file( ‘catalog.xml’ )\n\
  or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00087.jpg)  接下来，初始化迭代计数器为零\n\
  \n```php\n$counter = 0 ;\n```\n\n![image](img/Image00088.jpg)  现在，添加一个循环来增加计数器并显示其值，然后在每次迭代中检索一个属性值以显示图像\n\
  \n```php\nforeach( $xml ->children() as $book )\n{\n    $counter ++ ;\n    echo\
  \ ‘ ’ . $counter . ’: ‘ ;\n    echo ‘<img src=”’ . $book -> title[‘cover’] . ’>’\
  \ ; ;\n}\n```\n\n![image](img/Image00089.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为\
  \ `attribs-loop.php`，与 `catalog.xml` 文件放在一起，然后通过 HTTP 打开页面以查看每次迭代显示的计数器和图像\n\n![image](img/Image00220.jpg)\n\
  \n![image](img/Image00005.jpg)\n\nSimpleXMLElement 对象还提供了一个 `attributes()` 方法，该方法返回元素内所有属性名称和值的关联数组。例如，`$obj->child->attributes()`。\n\
  \n**包含馈源**\n\n\n\n\n如前面的页面所示，通过 PHP 脚本中访问 XML 文档数据的能力，我们可以轻松地整合外部源的数据。许多 Web 服务以免费提供的\
  \ RSS（富媒体网站摘要/简单 RSS）馈的形式提供。在网上搜索“rss feed directory”可以找到许多网站，这些网站对免费馈的链接进行了分类。RSS\
  \ 馈以 XML 格式提供定期更新的数据。\n\n![image](img/Image00221.jpg)\n\n你可以在 **[rssboard.org](http://www.rssboard.org)**\
  \ 在线发现更多关于 RSS 的知识，并将任何 RSS 馈的 URL 输入到他们的验证器中查看其 XML 元素。\n\nYahoo 开发者网络 (YDN) 在\
  \ **[real.developer.yahoo.com/rss](http://real.developer.yahoo.com/rss)** 提供了许多带有有用信息的免费\
  \ RSS 馈。\n\n使用它们的唯一要求是，必须在显示它们的网页上包含对 Yahoo! 的归说明。\n\nYahoo! 提供的免费 RSS 馈之一提供了定期更新的娱乐新闻项目描述内容，可以在\
  \ **[`news.yahoo.com/rss/entertainment`](http://news.yahoo.com/rss/entertainment)**\
  \ 找到。\n\n这些内容作为 XML 文件传递给网络浏览器，浏览器可以通过在外部元素上添加按钮来显示，你可以点击这些按钮来展开 (+) 或收叠 (-) 嵌套元素。\n\
  \nRSS 是 XML 的一种方言，所有文档必须包含一个顶层 `<rss>` 元素，其中包含一个 `<channel>` 元素。数据封装在内部元素中：\n\n\
  ![image](img/Image00222.jpg)\n\n![image](img/Image00223.jpg)\n\n这里高亮的标签可以用于获取最感兴趣的数据。所示折叠状态的\
  \ item 标签也包含描述每个项目的 title、description、link 和“pubDate”元素。\n\n![image](img/Image00029.jpg)\n\
  \n`rss.php`\n\n![image](img/Image00085.jpg) 编写一个 PHP 脚本，使用一个语句从 RSS 馈中加载 XML 数据，或者退出\n\
  \n```php\n<?php\n$url = ‘http://rss.news.yahoo.com/rss/entertainment’ ;\n$xml =\
  \ simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，添加一个语句加载页面头文件\n\n```php\ninclude( ‘includes/rss-header.html’ ) ;\n```\n\n\
  ![image](img/Image00087.jpg) 现在，显示每个新闻项目，然后是页面页脚\n\n```php\nforeach ( $xml -> channel\
  \ -> item as $item ) {\n    echo ‘<a href=”’ . $item -> link . ’”>’ . $item -> title\
  \ . ’</a>’ ;\n    echo ‘<br><small>’ . $item -> pubDate . ’</small><br>’ ;\n   \
  \ echo $item -> description . ‘<hr>’ ;\n}\ninclude( ‘includes/rss-footer.html’ )\
  \ ;\n```\n\n![image](img/Image00088.jpg) 将文档保存到你 Web 服务器的 `/htdocs` 目录中并命名为 `rss.php`，然后通过\
  \ HTTP 打开页面查看新闻\n\n![image](img/Image00224.jpg)\n\n![image](img/Image00006.jpg)\n\
  \nYahoo! RSS 馈的使用条款要求你在页面上显示归说明。\n\n### 设置参数\n\n某些 Web 服务提供静态 URL（如上一个示例中的 Yahoo!\
  \ RSS 馈），它仅交付由内容供应商预定义的 XML 数据。其他 Web 服务提供更灵活的 API（应用程序接口），允许你在 URL 请求中指定参数，以决定你将接收什么数据以及什么格式。\n\
  \n![image](img/Image00225.jpg)\n\n在 [**openweathermap.org**](http://www.openweathermap.org)\
  \ 更多关于 OpenWeatherMap 的信息并注册接收自己的 ID 密钥。\n\nOpenWeatherMap 有免费的当前天气数据 API，可以在 **[`api.openweathermap.org/data/2.5/weather`](http://api.openweathermap.org/data/2.5/weather)**\
  \ 。\n\n当前天气数据 API 允许你请求多种形式的天气数据。该 API 提供的参数包括：\n\n- `q` = 城市名称（或城市名称、国家代码）\n- `units`\
  \ = 公制（摄氏）、英制（华氏）或标准（开尔文，默认）温度单位\n- `mode` = xml、html 或 json（默认）格式\n- `appid` =\
  \ 必需的授权密钥，在 OpenWeatherMap 注册时免费提供\n\n参数和所需的 `=` 值附加在 OpenWeatherMap URL 的 `?` 之后，并用\
  \ `&` 分隔。\n\n来自 OpenWeatherMap 的响应可以作为 XML 文件交付，可以使用 PHP 的 `asXml()` 函数指定文件名，将其写入\
  \ Web 服务器的 `/htdocs` 文件夹。可以在网络浏览器中检查它以发现获取的数据性质、XML 元素名称、属性名称和结构：\n\n![image](img/Image00029.jpg)\n\
  \n`params.php`\n\n![image](img/Image00085.jpg) 开始一个 PHP 脚本，通过为四个变量分配字符串值，这些变量将用于设置响应参数\n\
  \n```php\n<?php\n$city = ‘New York’ ;\n$units = ‘imperial’ ;\n$mode = ‘xml’ ;\n\
  $id = ‘28df3c64f387cf55’ ;\n```\n\n![image](img/Image00086.jpg) 接下来，添加一个语句使用参数值构建请求字符串\n\
  \n```php\n$request = ‘http://api.openweathermap.org/data/2.5/weather?’ .\n‘q=’ .\
  \ $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n```\n\n![image](img/Image00087.jpg)\
  \ 现在，添加一个语句使用参数加载 XML 数据，或者退出\n\n```php\n$xml = simplexml_load_file( $request )\n\
  or die( ‘Unable to load data!’ ) ;\n```\n\n![image](img/Image00088.jpg) 当收到响应时，尝试将其作为\
  \ XML 文件写入 `/htdocs`\n\n```php\ntry {\n    $xml->asXml( ‘params.xml’ );\n} catch(\
  \ Exception $e ) {\n    echo ‘Error : ‘ . $e->getMessage() ;\n}\n```\n\n![image](img/Image0089.jpg)\
  \ 插入一个语句将浏览器重定向到新创建的 XML\n\n```php\nheader( ‘Location: params.xml’ )\n```\n\n![image](img/Image0091.jpg)\n\
  \n![image](img/Image00226.jpg)\n\n![image](img/Image0006.jpg)\n\n响应将包含天气数据。\n\n\
  ![image](img/Image0027.jpg)\n\n### 选择组件\n\n在上一页检查来自 OpenWeatherMap 的响应数据后，可以将选定的组件动态整合到\
  \ PHP 脚本中。这里高亮的数据感兴趣。\n\n![image](img/Image0029.jpg)\n\n`weather.php`\n\n![image](img/Image0085.jpg)\
  \ 通过加载页面头开始一个 PHP 脚本\n\n```php\n<?php\ninclude( ‘includes/weather-header.html’ ;\n\
  ```\n\n![image](img/Image0086.jpg) 接下来，添加一个条件判断来检查页面是否通过表单提交\n\n```php\nif( $_SERVER['REQUEST_METHOD']\
  \ == ‘POST’ ) {\n    // 要插入的语句\n}\n```\n\n![image](img/Image0087.jpg) 在条件判断块内为四个变量分配字符串值\n\
  \n```php\n$city = ( empty( $_POST['city'] ) ) ”New York” : $_POST['city'] ;\n$units\
  \ = ‘imperial’ ;\n$mode = ‘xml’ ;\n$id = ‘28df3c64f387cf55’ ;\n```\n\n![image](img/Image0088.jpg)\
  \ 接下来，在条件判断块内插入一个语句使用参数值构建请求字符串\n\n```php\n$request = ‘http://api.openweathermap.org/data/2.5/weather?’\
  \ .\n‘q=’ . $city . ’&units=’ . $units . ’&mode=’ . $mode . ’&APPID=’ . $id ;\n\
  ```\n\n\n\n\n\n```php\necho ‘&deg; ‘ . $xml->temperature[ ‘unit’ ] ;\necho ‘<li>Wind\
  \ : ‘ . $xml->wind->speed[ ‘name’ ] ;\necho ‘<li>Humidity : ‘ . $xml->humidity[‘value’]\
  \ . ’&#37;</ul> ;\n```\n\n![image](img/Image00005.jpg)\n\n注意，如果表单在没有用户输入的情况下提交，将分配一个默认城市值。\n\
  \n![image](img/Image00005.jpg)\n\n`icon` 属性的值是 PNG 文件的文件名。当与路径和 `.png` 文件扩展名拼接时，它将提供合适的天气图像。\n\
  \n![image](img/Image00096.jpg) 在测试块之后，添加语句来创建一个表单\n\n```php\necho ‘<form method=”POST\
  \ ” action=”weather.php ”> ;\necho ‘<fieldset><legend>Enter City Name</legend>’\
  \ ;\necho ‘ <input type=”text” name=”city”’ ;\necho ‘<input type=”submit” name=”submission”\
  \ value = ”Get Weather”>’ ;\necho ‘</fieldset></form>’ ;\n```\n\n![image](img/Image00228.jpg)\
  \ 最后，在脚本中加载页面页脚文件以显示表示此应用所用技术的图标\n\n```php\ninclude( ‘includes/weather-footer.html’\
  \ ) ;\n```\n\n![image](img/Image00229.jpg) 将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下的 `weather.php`，然后通过\
  \ HTTP 打开页面并提交表单以查看默认纽约位置的天气。输入另一个城市名称并重新提交以查看该天气报告\n\n![image](img/Image00230.jpg)\n\
  \n![image](img/Image00231.jpg)\n\n![image](img/Image00006.jpg)\n\n`action` 属性指定了相同的脚本文件名，使表单保持刷新（sticky）。\n\
  \n## 总结\n\n- 每个 XML 元素必须有起始标签和结束标签，并正确嵌套以确保格式良好性\n- PHP 有一个名为 `SimpleXML` 的 XML\
  \ 解析器，它可以将 XML 文档加载到内存中并作为分级树结构\n- `simplexml_load_file()` 函数创建 `SimpleXMLElement`\
  \ 对象的数据结构\n- `SimpleXML` 对象的数据结构描述了外部和内部 XML 元素之间的父子关系\n- `SimpleXML` 数据结构的每个成员都是一个节点\n\
  - 顶层节点是 `SimpleXML` 对象本身的直接子后代\n- 可以使用 `->` 对象运算符引用节点，以寻址分级树结构的每一层\n- `children()`\
  \ 方法返回所有子节点，并用于遍历树节点以检索每个节点的内容\n- 可以通过在节点名称后的括号内用引号写出属性名称来引用属性\n- RSS 馈通过 XML 格式提供定期更新的数据\n\
  - RSS 是 XML 的一种方言，所有文档必须包含一个包含`<channel>` 元素的顶层 `<rss>` 元素\n- Web 服务（Web Services）可能提供静态\
  \ URL 或 API，允许你在 URL 请求中指定参数\n- 参数值通过 `=` 字符指定，并在 `?` 之后附加到 URL 之后，各参数之间用 `&` 分隔\n\
  - 使用 `asXml()` 函数可以将 `SimpleXML` 对象写入服务器上的 XML 文件\n- `SimpleXML` 对象的选定组件可以动态地整合到\
  \ PHP 应用中\n\n![image](img/Image00232.jpg)\n\n![image](img/Image00233.jpg)\n\n![image](img/Image00234.jpg)\n\
  \n"
