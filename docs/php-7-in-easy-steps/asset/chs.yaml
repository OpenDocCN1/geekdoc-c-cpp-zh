  \n![image](img/Image00005.jpg)\n\n你也可以使用简写连接赋值运算符 `.=` 来连接两个字符串——这样 `$a = $a . $b`\
  \ 可以简写为 `$a .= $b` 。\n\n![image](img/Image00005.jpg)\n\n为你的变量采用一致的命名风格——例如全小写的 `$my_var`\
  \ ，或“驼峰命名”的 `$myVar` 。\n\n## 数组排序\n\nPHP 提供了两个方便的方法在数组和字符串之间进行转换，因为它们经常一起使用。`implode()`\
  \ 函数将数组转换为字符串并在每个值之间插入分隔符。这可能用于创建逗号分隔的列表：\n\n```php\n$csv_list = implode( ‘ , $array\
  \ )\n```\n\n相反，`explode()` 函数通过指定分隔符将字符串转换为数组。这可能用于从逗号分隔的字符串创建数组：\n\n```php\n$array\
  \ = explode( ‘ , $csv_list ) ;\n```\n\n插入一个语句在混合字符串中显示变量值\n\n```php\necho “<p><q>\
  \ $phrase </q><cite> $author </cite></p>” ;\n```\n\nPHP 还提供了三个实用的函数按升序（a-z 1-9）：\n\
  \n- `sort()` 函数——按值排序，丢弃原始键\n- `asort()` 函数——按值排序，保留原始键\n- `ksort()` 函数——按键排序\n\n\
  现有的数组值可以通过简单的语句进行排序：\n\n```php\n$makers = array( ‘Ford’ , ‘Chevrolet’ , ‘Dodge’\
  \ ;\n\nsort( $makers ) ;\n```\n\n数组元素也可以通过三个类似的函数按字母降序（9-1 z-a）排序：\n\n- `rsort()`\
  \ 函数——按值降序排序，丢弃原始键\n- `arsort()` 函数——按值降序排序，保留原始键\n- `krsort()` 函数——按键降序排序\n\n可以使用\
  \ `is_array()` 函数测试变量是否为数组。例如，`is_array( $var ) ;`\n\n重要的是 `sort()` 和 `rsort()`\
  \ 函数会丢弃指定的键名，因此这些函数仅适用于键/值关系不重要的情况——否则请使用 `asort()` 和 `arsort()` 函数来保留键。\n\n你可以使用\
  \ `range()` 函数轻松创建包含顺序数字或字母的数组。例如\n\n```php\n$six = range( 1 , 6 )\n$a_z = range(\
  \ ‘a’,‘z’ ) ;\n```\n\n如果你指定了键，索引将从一而不是零开始，如果你指定了相同的键，第二个值将覆盖第一个：\n\n```php\n$months\
  \ = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’ ) ;\n```\n\
  \n\n\n\n![image](img/Image00038.jpg) 接下来，插入语句以定义列表中的项目符号列表形式显示数组的所有键和值\n\n```php\n\
  echo ‘<dl><dt>原始元素顺序：<dd>’ ;\nforeach( $cars as $key => $value )\n{ echo ‘ &bull;\
  \ ‘ , $key . ‘ ‘ . $value ; }\n```\n\n![image](img/Image00039.jpg) 然后，插入语句按值对数组进行排序\n\
  \n```php\nasort( $cars ) ;\necho ‘<dt>按值排序：<dd>’ ;\nforeach( $cars as $key => $value\
  \ )\n{ echo ‘ &bull; ‘ , $key . ‘ ‘ . $value ; }\n```\n\n![image](img/Image00040.jpg)\
  \ 最后，插入语句按键对数组进行排序\n\n```php\nksort( $cars ) ;\necho ‘<dt>按键排序：<dd>’ ;\nforeach(\
  \ $cars as $key => $value )\n{ echo ‘ &bull; ‘ , $key . ‘ ‘ . $value ; }\necho ‘</dl>’\
  \ ;\n```\n\n![image](img/Image00041.jpg) 将文档保存到你的 Web 服务器的 `/htdocs` 目录并命名为 `sort.php`，然后通过\
  \ HTTP 打开页面以显示排序后的数组值\n\n![image](img/Image00047.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n你可以使用 `count()` 函数发现数组中的元素数量。例如，`$num = count( $array ) ;`\n\n![image](img/Image00006.jpg)\n\
  \n在键重要的情况下，不要使用 `sort()` 或 `rsort()` 函数。\n\n### 描述维度\n\n### 描述维度\n\n数组元素的编号更准确的说是“数组索引”，因为元素编号从零开始，所以有时被称为“基于零的索引”。用单个索引创建的数组是一维数组，其中元素出现在单行中：\n\
  \n| 元素内容 | A | B | C | D | E |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 索引数字\
  \ | [0] | [1] | [2] | [3] | [4] |\n\n![image](img/Image00048.jpg)\n\n数组也可以有多个索引——表示多个维度。用两个索引创建的数组是二维数组，其中元素出现在多行中：\n\
  \n| 第一索引 | [0] | A | B | C | D | E |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| | [1] | F | G | H | I | J |\n| 第二索引 | | [0] | [1] | [2] | [3] | [4]\
  \ |\n\n对于多维数组，每个元素包含的值通过说明每个索引的数字来引用。例如，在上面的二维数组中，`[1][2]` 元素包含字母 H。\n\n二维数组有助于存储基于网格的信息，例如\
  \ XY 坐标。创建一个具有三个索引的三维数组将允许存储 XYZ 坐标。\n\n在 PHP 中创建多维数组只需只需创建一个外部数组，其元素本身也是数组。按照惯例，你可以选择地为每个元素指定一个键名——在这种情况下表示每个内部数组。然后可以使用键名和内部索引数字来引用单独的值：\n\
  \n`$matrix[‘Letter’][0]`\n\n![image](img/Image00019.jpg)\n\n具有两个以上索引的多维数组可能会产生难以阅读的源代码并可能导致错误。\n\
  \n然而，当使用带引号的键数组变量包含在字符串中时，必须用大括号括起来：\n\n```php\necho “元素值为：{$matrix[‘Letter’][0]}\
  \ ” ;\n```\n\n可以使用 `foreach` 循环遍历数组来访问多维数组中的所有内部数组。嵌套的 `foreach` 循环可以逐引用每个元素。\n\n\
  ![image](img/Image00029.jpg)\n\nmatrix.php\n\n![image](img/Image00036.jpg) 创建一个有效的\
  \ HTML 文档，如这里 所列的那样，然后在 body 部分插入 PHP 标签\n\n```php\n<?php\n# 在此处插入语句。\n?>\n```\n\
  \n![image](img/Image00037.jpg) 现在，在 PHP 标签之间插入语句，创建并初始化两个普通变量数组和一个带键名的二维数组\n\n```php\n\
  $letters = array( ‘A’ , ‘B’ , ‘C’ ) ;\n$numbers = array( 1 , 2 , 3 ) ;\n$matrix\
  \ = array( ‘Letter’ => $letters , ‘Number’ => $numbers ) ;\n```\n\n![image](img/Image00038.jpg)\
  \ 接下来，插入一个语句来显示单个存储值\n\n```php\necho “<p>开始：{$matrix[‘Letter’][0]} </p>” ;\n```\n\
  \n![image](img/Image00039.jpg) 最后，插入语句将所有元素中的键和值显示两个无序列表\n\n```php\nforeach( $matrix\
  \ as $array => $list )\n{\n    echo ‘<ul>’ ;\n    foreach( $list as $key => $value\
  \ )\n    { echo ‘ &bull; ‘ , $key . ‘ ‘ . $value ; }\n}\n```\n\n![image](img/Image00040.jpg)\
  \ 将文档保存到你的 Web 服务器的 `/htdocs` 目录并命名为 `sort.php`，然后通过 HTTP 打开页面以显示排序后的数组值\n\n![image](img/Image00041.jpg)\
  \ 具有两个以上索引的多维数组可能会产生难以阅读的源代码并可能导致错误。\n\n然而，当使用带引号的键数组变量包含在字符串中时，必须用大括号括起来：\n\n```php\n\
  echo “元素值为：{$matrix[‘Letter’][0]} ” ;\n```\n\n\n\n\n\nPHP 文件流资源的创建和使用在第 8 章中得到了充分演示。\n\
  \n![image](img/Image00005.jpg)\n\n布尔值常量 `TRUE` 和 `FALSE` 不区分大小写，因此也可以写成 `true` 和\
  \ `false`。\n\n## 定义常量\n\n脚本中永远不会改变的固定数据值应该存储在 PHP “常量”中，而不是变量中。常量是一个命名的容器，可以在其中存储数值或字符串值，并可以使用常量的名称进行引用。\n\
  \n与变量不同，常量不能包含 `TRUE` 或 `FALSE` 的布尔值，不能表示对象，也不能是 `NULL` 空值。此外，常量不会随着脚本的执行而发生改变。这保护了常量值免受意外修改，是一种良好的编程实践。\n\
  \n![image](img/Image00005.jpg)\n\n在创建变量时，务要考虑其值是否会发生改变——如果不会改变，你应该创建一个常量。例如，`define(\
  \ ‘PI’ , 3.14 ) ;`。\n\n常量的命名遵循与变量相同的命名规范，但传统上使用大写字母来命名常量——以便于与变量名区分。常量使用 `define()`\
  \ 函数创建，用于指定常量的名称及其将包含的值，如下：\n\n`define( ‘NAME’ , value ) ;`\n\n最重要的一点是，常量名没有以 $\
  \ 符号开头，因此它们不能包含在用于显示的混合字符串中——因为 无法区分常量名和普通的大写字符串。考虑以下语句示例：\n\n`define( ‘USER’ ,\
  \ ‘Mike’ ) ;`\n\n`echo “Hello USER”`\n\n...这里的输出是 `Hello USER`，而不是预期的 `Hello Mike`。\n\
  \n为了将常量值包含在输出字符串中，必须单独引用它，并使用 PHP 的 . 接符将其“连接”到字符串，如下：\n\n`echo ‘Hello ‘ . USER\
  \ ;`\n\n...现在的输出是预期的 `Hello Mike`。\n\n数组常量（即所有元素都包含固定数据值的数组）也可以使用 `define()` 函数这样创建：\n\
  \n`define( ‘WEEKDAYS’ , [ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ ] ) ;`\n\n![image](img/Image00003.jpg)\n\
  \n使用 `define()` 函数创建常量数组的能力是 PHP 7 中的新功能。\n\n由脚本定义的定义的可以像 PHP 内置的预定义常量一样使用，例如描述版本和服务器操作系统的\
  \ `PHP_VERSION` 和 `PHP_OS`。\n\n![image](img/Image00029.jpg)\n\nconstant.php\n\n\
  ![image](img/Image00036.jpg) 创建一个有效的 HTML 文档，如此处 所列出的那样，然后在 body 部分插入 PHP 标签\n\n\
  ```php\n<?php\n# 在此处要插入的语句。\n?>\n```\n\n![image](img/Image00037.jpg) 现在，在 PHP 标签之间插入一条用于创建并初始化常量的语句\n\
  \n`define( ‘USER’ , ‘Mike’ ) ;`\n\n![image](img/Image00038.jpg) 添加一条语句来创建并初始化数组常量\n\
  \n`define( ‘PETS’ , [ ‘Kitten’ , ‘Puppy’ , ‘Hamster’ ] ) ;`\n\n![image](img/Image00039.jpg)\
  \ 接下来，插入一条语句在连接的字符串中显示两个常量值\n\n`echo ‘<p>Hello ‘ . USER . ‘ how is your ‘ . PETS[1]\
  \ . ‘?</p>’ ;`\n\n![image](img/Image00040.jpg) 插入一条语句在连接的字符串中显示 PHP 版本的预定义常量值\n\n\
  `echo ‘<p>You are using PHP version ‘ . PHP_VERSION ;`\n\n![image](img/Image00041.jpg)\
  \ 最后，插入一条语句在字符串中显示主机操作系统的预定义常量值\n\n`echo ‘ running on ‘ . PHP_OS . ‘</p> ;`\n\n\
  ![image](img/Image00042.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录下并为 `constant.php`，然后通过\
  \ HTTP 打开页面查看显示的结果\n\n![image](img/Image00051.jpg)\n\n![image](img/Image00019.jpg)\n\
  \n你不能将常量包含在混合字符串中，更改其值，也不能以美元符号开头其名称。\n\n![image](img/Image00006.jpg)\n\n你应该始终对常量名使用大写，以便在代码中将其与变量区分。\n\
  \n## 探索超全局变量\n\nPHP 提供了几个预定义变量，这些变量在脚本的任何地方都是全局可用的。它们被形象地称为“超全局变量”，在此简要描述：\n\n-\
  \ `$GLOBALS` – 一个关联数组，根据上下文包含当前脚本全局作用范围内定义的所有变量的引用。变量名是该关联数组的键。例如：\n\n```php\nforeach(\
  \ $GLOBALS as $key => $var) echo “&bull; $key “;\n```\n\n![image](img/Image00052.jpg)\n\
  \n- `$_SERVER` – 包含由 Web 服务器任意提供的标头、路径和脚本位置等信息的数组\n- `$_GET` – 通过附加 URL 参数传递给脚本的变量关联数组\n\
  - `$_POST` – 通过附加 URL 参数传递给脚本的变量关联数组\n- `$_FILES` – 包含上传文件的关联数组\n- `$_COOKIE` –\
  \ 包含 cookie 的关联数组\n- `$_SESSION` – 用于在会话中存储信息的关联数组\n- `$_REQUEST` – 包含 `$_GET`、`$_POST`\
  \ 和 `$_COOKIE` 的关联数组\n- `$_ENV` – 环境变量关联数组\n\n\n\n\n\n# 变量与常量\n\n- 变量是一个命名的容器，用于存储可以更改的数据。\n\
  - 存储在变量中的值可以通过该变量名来引用。\n- 变量名必须以 `$` 符号开头，可以由字母、数字和下划线字符组成，且 `$` 后的第一个字符必须是字母或下划线。\n\
  - 变量可以存储整数、浮点数、文本字符串、布尔值、对象或 `NULL` 值。\n- 变量使用 `=` 赋值运算符进行初始化，为该变量分配一个初始值。\n- 通过仅将字符串和变量名括在双引号中，可以将变量的值作为混合字符串的一部分显示。\n\
  - 字符串可以使用单引号或双引号括，内部的引号可以使用反斜杠进行转义。\n- 使用 `.` 拼接运算符可以将字符串值组合成一个单一字符串。\n- 数组变量可以在顺序排列的数组元素中存储多个数据项，这些元素默认从零开始编号。\n\
  - 可选，可以为每个数组元素指定键名。\n- 使用 `foreach` 循环可以遍历数组中的每个元素。\n- `implode()` 和 `explode()`\
  \ 函数通过添加或删除指定的分隔符在字符串和数组之间进行转换。\n- 数组可以根据值或键按字母数字排序。\n- 多维数组简单来说就是元素值本身也是数组的数组。\n\
  - 可以 `gettype()` 和 `var_dump()` 函数检查数据类型。\n- 常量是一个命名的容器，用于存储固定的整数、浮点数或文本字符串。\n-\
  \ 常量名不带 `$` 前缀，且全大大写。\n- 常量使用 `define()` 函数进行初始化。\n- 超全局变量在任何脚本的任何地方始终全局可用。\n\n\
  ## 执行操作\n\n本章演示了用于算术、比较和逻辑评估的各种 PHP 运算符。\n\n## 算运算\n\nPHP 脚本中常用的算术运算符下表所示：\n\n|\
  \ 运算符: | 操作: |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/`\
  \ | 除法 |\n| `%` | 取模 |\n| `**` | 幂 |\n\n与运算符一起形成表达式的数字被称为“操作数”——在表达式 `2 + 3` 中，数字\
  \ `2` 和 `3` 就是操作数。\n\n加、减、乘、除运算符的运行方式正如你预期的一样。然而，在使用多个运算符时，必须注意对表达式进行分组以保持清晰度：\n\
  \n| `a = b * c - d % e / f ;` | # 这不清晰。 |\n| `a = ( b * c ) - ( ( d % e ) / f )\
  \ ;` | # 这更清晰。 |\n\n使用括号对表达式分组以指定计算优先级——最内层的组先被计算。\n\n- `%` 取模运算符将第一个数字除以第二个第二个数字，并返回操作的余数。这对于判断一个数是奇数还是偶数很有用。\n\
  - `**` 幂运算符给出第一个操作数相对于第二个操作数幂的结果。\n\n### 简写表达式\n\n通过结合算术运算符与 `=` 赋值运算符，可以创建非常有简写表达式：\n\
  \n- `a += b ;` 等同于 `a = ( a + b ) ;`\n- `a -= b ;` 等同于 `a = ( a - b ) ;`\n- `a *=\
  \ b ;` 等同于 `a = ( a * b ) ;`\n- `a /= b ;` 等同于 `a = ( a / b ) ;`\n\n### 示例：arithmetic.php\n\
  \n创建一个有效的 HTML 文档，然后将 PHP 标签插入到 body 部分：\n\n```php\n<?php\n# 在此处插入插入语句。\n?>\n```\n\
  \n```php\n$a = 5 ;\n$b = 2 ;\n$result = $a + $b ; echo \"Addition : $result <br>\"\
  \ ;\n$result = $a - $b ; echo \"Subtraction : $result <br>\" ;\n$result = $a * $b\
  \ ; echo \"Multiplication : $result <br>\" ;\n$result = $a / $b ; echo \"Division\
  \ : $result <br>\" ;\n$result = $a % $b ; echo \"Modulus : $result <br>\" ;\n$result\
  \ = $a ** $b ; echo \"Exponentiation : $result <br>\" ;\n```\n\n## 比较\n\nPHP 中用于比较两个值的常用运算符有：\n\
  \n| 运算符: | 比较测试: |\n| :--- | :--- |\n| `==` | 相等 |\n| `===` | 恒等 |\n| `!==` | 非恒等\
  \ |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于\
  \ |\n| `<=>` | 飞船运算符 |\n\n- `==` 相等运算符比较两个操作数，如果两者在数值上相等，则返回布尔结果 `TRUE`，否则返回 `FALSE`。字符和字符串也通过它们的\
  \ ASCII 码值进行数值比较。\n- 反之，`!=` 不等于运算符在两个操作数不相等时返回 `TRUE`，否则返回 `FALSE`。\n- `>` “大于”运算符比较两个操作数，如果第一个操作数的值大于第二个，则返回\
  \ `TRUE`；如果它的值等于或小于第二个，则返回 `FALSE`。\n- `<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个，则返回 `TRUE`，否则返回\
  \ `FALSE`。\n- 在 `>` “大于”运算符或 `<` “小于”运算符后添加 `=` 运算符，可以使其在两个操作数完全相等时也返回 `TRUE`。\n\
  - `<=>` 飞船运算符在第一个操作数大于第二个操作数时返回整数值 1，在第一个操作数小于第二个操作数时返回 -1，操作数相等时返回 0。\n\n可以使用 `var_dump()`\
  \ 函数查看每种比较产生的类型和值。\n\n\n\n\n\n![image](img/Image00055.jpg) 现在，在 PHP 标签之间插入语句来创建并初始化五个变量\n\
  \n`$zero = 0 ; $nil = 0 ; $one = 1 ; $upr = ‘A’ ; $lwr = ‘a’ ;`\n\n![image](img/Image00056.jpg)\
  \ 下，插入语句显示相等性比较\n\n`echo “0 == 0 : “ ; var_dump( $zero == $nil ) ;`\n`echo “<br>0\
  \ == 1 : “ ; var_dump( $zero == $one ) ;`\n`echo “<br>A == a : “ ; var_dump( $upr\
  \ == $lwr ) ;`\n`echo “<br>A != a : “ ; var_dump( $upr == $lwr ) ;`\n\n![image](img/Image00057.jpg)\
  \ 插入语句显示比较评估结果\n\n`echo “<hr>1 > 0 : “ ; var_dump( $one > $nil ) ;`\n`echo “<br>0\
  \ >= 0 : “ ; var_dump( $zero >= $nil ) ;`\n`echo “<br>1 <= 0 : “ ; var_dump( $one\
  \ <= $nil ) ;`\n`echo “<hr>1 <=> 0 : “ ; var_dump( $one <=> $nil ) ;`\n`echo “<br>1\
  \ <=> 1 : “ ; var_dump( $one <=> $one ) ;`\n`echo “<br>0 <=> 1 : “ ; var_dump( $nil\
  \ <=> $one ) ;`\n\n![image](img/Image00058.jpg) 将文档保存到网络服务器的 `/htdocs` 目录中并命名为 `comparison.php`，然后通过\
  \ HTTP 打开页面查看显示的的结果\n\n![image](img/Image00060.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n大写字母 `A` 的 ASCII 值为 65，小写字母 `a` 值为 97 —— 因此它们在这里比较返回 `FALSE` 。\n\n![image](img/Image00005.jpg)\n\
  \n布尔值 `TRUE` 在 PHP 语言中用数字 1 表示。\n\n## 检查条件\n\n### 条件运算符\n\n条件运算符 `?:` 也称为“三元”运算符，因为它包含三个组成部分。该运算符首先评估一个表达式以得到\
  \ `TRUE` 或 `FALSE` 布尔值，然后根据评估结果返回两个指定结果中的一个。条件运算符的语法如下：\n\n`(* test-expression )\
  \ ? result-if-true : result-if-false ;`\n\n条件运算符可以用于评估给定的数字是一个还是多个，以确保输出内容中关于单数和复数项的语法正确。这避免了诸如“There\
  \ is 5”这样尴尬的短语：\n\n`$verb = ( $number == 1 ) ? ‘is’ : ‘are ‘;`\n`echo “There $verb\
  \ $number” ;`\n\n在这种情况下，当变量 `$number` 的值为 1 时，将结果 ‘is’ 赋值给变量 `$verb`，否则将结果 ‘are’\
  \ 赋值。\n\n![image](img/Image00019.jpg)\n\n不要在同一个语句中使用超过一个 `?:` 条件运算符，因为结果可能是不可预测的。\n\
  \n条件运算符还可以通过检查数字除以 2 后是否有余数，来评估给定的数字是奇数还是偶数（奇偶性），然后赋值一个合适的字符串结果：\n\n`$parity = (\
  \ $number % 2 == 0 ) ? ‘Odd’ : ‘Even’ ;`\n`echo “$number is $parity” ;`\n\n在这种情况下，当取模运算返回值为\
  \ 1 时，将结果 ‘Odd’ 赋值给变量 `$parity`，否则将结果 ‘Even’ 赋值。\n\n### 空值合并运算符\n\nPHP 有一个特殊的 `NULL`\
  \ 值，它是一个内置常量，表示变量完全没有值 —— 甚至不是 0。没有被赋值值的变量将被求为 `NULL`。这个命名非常敏捷的 `??` “空值合并”运算符可以从左到右遍历多个操作数，并返回第一个不是\
  \ `NULL` 的操作数的值。如果所有操作数都没有值（且不是 `NULL`），则空值合并运算符本身将返回 `NULL` 结果。\n\n![image](img/Image00003.jpg)\n\
  \n`??` 空值合并运算符是 PHP 7 中的新功能。\n\n![image](img/Image00029.jpg)\n\ncondition.php\n\n\
  ![image](img/Image00054.jpg) 创建一个有效的 HTML 文档，像这里 列出的那个样，然后在 body 部分插入 PHP 标签\n\n\
  ```php\n<?php\n# 在此处插入语句。\n?>\n```\n\n![image](img/Image00055.jpg) 现在，在 PHP 标签之间插入语句来创建并初始化三个变量\n\
  \n`$a = NULL ; $b = 8 ; $c = ‘PHP Fun’ ;`\n\n![image](img/Image00056.jpg) 下，插入语句输出正确的语法\n\
  \n`$verb = ( $b == 1 ) ? ‘is’ : ‘are’ ;`\n`echo “There $verb $b <hr>”; ;`\n\n![image](img/Image00057.jpg)\
  \ 插入语句显示整数的奇偶性\n\n`$parity = ( $number % 2 == 0 ) ? ‘Odd’ : ‘Even’ ;`\n`echo “$number\
  \ is $parity” ;`\n\n![image](img/Image00058.jpg) 将文档保存到网络服务器的 `/htdocs` 目录中并命名为\
  \ `comparison.php`，然后通过 HTTP 打开页面查看显示的的结果\n\n## 逻辑逻辑\n\n| 运算符 | 描述 |\n| :--- | :---\
  \ |\n| **and** | `&&` | 逻辑与：两个操作数都为 `TRUE`。 |\n| **or** | `||` | 逻辑或：至少一个操作数为 `TRUE`。\
  \ |\n| **xor** | `xor` | 逻辑异或：一个操作数为 `TRUE`，但另一个不是。 |\n| **not** | `!` | 逻辑非：反转操作数的值。\
  \ |\n\n“布尔”术语指的是乔治·布尔（1815-1864）开发的系统。PHP 中常用的逻辑运算符如下：\n\n| 运算符 | 操作 |\n| :--- |\
  \ :--- |\n| **and** | `&&` | 逻辑与 |\n| **or** | `||` | 逻辑或 |\n| **xor** | `xor` |\
  \ 逻辑异或 |\n| **not** | `!` | 逻辑非 |\n\n`&&` 运算符需要两个操作数都为 `TRUE`。如果没有任何操作数为 `TRUE`，它将返回\
  \ `FALSE`。\n\n`||` 运算符在至少一个操作数为 `TRUE` 时返回 `TRUE`。如果没有任何操作数为 `TRUE`，它将返回 `FALSE`。\n\
  \n`xor` 运算符评估两个操作数，仅当一个操作数为 `TRUE` 时才返回 `TRUE`。如果两个操作数都是 `TRUE`，它将返回 `FALSE`。\n\n\
  `!` 运算符是一个一元运算符，用于单个操作数。它返回操作数的反值，所以如果变量 `$var` 是 `TRUE`，`!$var` 将返回 `FALSE`。`!`\
  \ 运算符用于在带有语句 `$var = ! $var` 的循环中切换值。每次迭代值都会反转，就像拨开关一样。\n\n![image](img/Image0029.jpg)\n\
  \nlogic.php\n\n![image](img/Image00054.jpg) 创建一个有效的 HTML 文档，像这里 列出的那个样，然后在 body\
