  \  { echo( “<hr> $email 是一个有效的电子邮件地址” ) ; }\n  else\n  { echo( “<hr> $email 并不是一个合法的电子邮件地址”\
  \ ); }\n}\n\n\n![image](img/Image00039.jpg) 创建一个包含非法空格的电子邮件地址并尝试验证，然后对电子邮件地址进行清理并再次尝试验证\n\
  \n```php\n<?php\n$email = ‘mike @example.com’ ;\nvalidate( $email ) ;\n$email =\
  \ filter_var( $email , FILTER_SANITIZE_EMAIL ) ;\nv a lidate( $email ) ;\n?>\n```\n\
  \n![image](img/Image00040.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `filter.php`，然后通过\
  \ HTTP 打开它查看过滤结果\n\n![image](img/Image00163.jpg)\n\n![image](img/Image00019.jpg)\n\
  \n提交的用户输入可能会破坏你的网页，因此应该始终进行验证。\n\n### 发送隐藏数据\n\n除了用户输入到 HTML 表单输入字段中的数据，PHP 生成的数据也可以使用\
  \ HTML 隐藏表单字段提交。与普通输入字段一样，这些也会向表单处理脚本发送 `name=value` 键对，但这里的值是由 PHP 提供的，而不是用户。\n\
  \n通常，使用隐藏表单字段提交的数据可能包括用户的用户名和提交的时间戳：\n\n![image](img/Image00029.jpg)\n\nhidden.php\n\
  \n![image](img/Image00036.jpg) 创建一个包含 PHP 脚本的 HTML 文档以定义时区并初始化两个变量\n\n```php\n<?php\n\
  date_default_timezone_set( ‘UTC’ ) ;\n$time = date( ‘ H:i , F j ‘ ) ;\n$user = ‘Mike’\
  \ ;\n```\n```\n\n![image](img/Image00037.jpg) 现在，添加一个语句来编写包含一个普通输入字段和两个隐藏字段的完整表单，其值由变量设置\n\
  \n```php\n<?php\necho ‘**\n<form action=” hidden_handler.php ” method=” POST ”>\n\
  <fieldset>\n<legend>给我们发送您的评论</legend>\n<textarea rows=”5” cols=”20” name=” comment\
  \ ”>\n</textarea>\n<input type=\"\"hidden” name=” user ” value=” ‘. $user .’ “>\n\
  <input type=\"\"hidden” name=” time ” value=” ‘. $time .’ “>\n</fieldset><p><input\
  \ type=”submit” ></p></form> ‘ ;\n?>\n```\n\n![image](img/Image00038.jpg) 将文档保存到\
  \ Web 服务器的 `/htdocs` 目录并命名为 `hidden.php`\n\n![image](img/Image00019.jpg)\n\n此示例中的时间戳是在表单创建时创建的，而不是在表单提交时。\n\
  \n![image](img/Image00029.jpg)\n\nhidden_handler.php\n\n![image](img/Image00039.jpg)\
  \ 接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量——如果没有提交任何值，则设置为 `NULL`\n\n```php\n<?php\n\
  if ( !empty ( $_POST[‘comment’] ) )\n{\n  $comment = $_POST[‘comment’] ;\n}\nelse\n\
  {\n  $comment = NULL ; echo ‘你必须输入评论’ ;\n}\n?>\n```\n\n![image](img/Image00040.jpg)\
  \ 现在，如果隐藏表单字段值已设置，则添加语句初始化两个变量\n\n```php\n$time = ( !isset ( $_POST[‘time’] ) )\
  \ ? NULL : $_POST[‘time’] ;\n$user = ( !isset ( $_POST[‘user’] ) ) ? NULL : $_POST[‘user’]\
  \ ;\n```\n\n![image](img/Image00041.jpg) 最后，添加一个语句来输出有效的提交数据\n\n```php\nif ( ( $comment\
  \ != NULL ) && ( $time != NULL ) && ( $user != NULL ) )\n{ echo “<p>收到评论： \\” $comment\
  \ \\”<br> 来自 $user，时间 $time </p>” ; }\n?>\n```\n\n![image](img/Image00042.jpg) 将文档保存到\
  \ Web 服务器的 `/htdocs` 目录并命名为 `hidden_handler.php`，然后通过 HTTP 打开 `hidden.php` 并提交表单以查看响应\n\
  \n![image](img/Image00164.jpg)\n\n![image](img/Image00165.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n注意这里使用了三元运算符 `? :` 代替了更长的 `if else` 语句。\n\n\n\n\n\n```html\n<input type=”text”\
  \ name=” email ” value=” <?php if ( isset( $_POST[ ‘email’ ] ) ) echo $_POST[ ‘email’\
  \ ] ; ?> ”></p>\n<p><input type=”submit”></p>\n</form>\n```\n![image](img/Image00037.jpg)\
  \ 现在，添加一个 PHP 脚本来处理表单提交\n\n```php\n<?php\nif ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’\
  \ )\n{\n// 在此处插入语句（步骤 3-5）。\n}\n?>\n```\n\n![image](img/Image00038.jpg) 下，在 PHP\
  \ 脚本块中插入一个语句，创建一个用于错误消息的数组\n\n```php\n$errors = array() ;\n```\n\n![image](img/Image00005.jpg)\
  \ 本示例使用 `$_SERVER[ ‘PHP_SELF’ ]` 来确保脚本在被重命名后仍然可以工作。\n\n![image](img/Image00006.jpg)\
  \ `if` 语句通过检查请求方法是否为 `POST` 来测试表单是否已提交，而不是用于显示空表单的 `GET` 方法。\n\n![image](img/Image00039.jpg)\
  \ 然后，插入语句用提交的值初始化变量，或者为了遗漏项将其添加到错误数组\n\n```php\nif ( empty( $_POST[ ‘name’ ] ) )\
  \ { $errors[] = ‘name’ ; }\nelse { $name = trim( $_POST[ ‘name’ ] ) ; }\nif ( empty(\
  \ $_POST[ ‘email’ ] ) ) { $errors[] = ‘email’ ; }\nelse { $email = trim( $_POST[\
  \ ‘email’ ] ) ; }\n```\n\n![image](img/Image00040.jpg) 现在，插入语句来写入错误消息或确认表单成功提交\n\
  \n```php\nif( !empty( $errors ) )\n{ echo ‘Error! Please enter your ‘ ;\nforeach\
  \ ( $errors as $msg ) { echo “ - $msg “ ; } }\nelse { echo “Success! Thanks $name\
  \ “ ; }\n```\n\n![image](img/Image00041.jpg) 将文档保存到你 Web 服务器的 `/htdocs` 目录中并命名为\
  \ `sticky.php`，然后通过 HTTP 打开并提交表单以查看保留的值和响应消息。\n\n![image](img/Image00170.jpg)\n\
  ![image](img/Image00171.jpg)\n![image](img/Image00005.jpg) 使用 `trim()` 函数是一个良好的做法，如此处所示，它可以移除字段值开头和结尾的空格。\n\
  \n### 上传文件\n\n如果 `<form>` 标签包含设置为“multipart/formdata”的 `enctype` 属性，PHP `$_FILES`\
  \ 超全局变量可以轻松地从 HTML 表单 `POST` 文件上传。提交时，会创建一个 `$_FILES` 关联数组，其键包括文件 `name`、生成的临时名称（`tmp_name`）和文件\
  \ `size`。文件名和大小可用于验证。然后可以将临时文件名连原始文件名一起传递 `move_uploaded_file()` 函数以上传文件：\n\n![image](img/Image00029.jpg)\n\
  \nupload.php\n\n![image](img/Image00036.jpg) 创建一个包含带有持久化表单的 HTML 文档，其中包含一个名为“image”的文件类型输入框\n\
  \n```html\n<form action=” <?php $_SERVER[ ‘PHP_SELF’ ] ?>” method=”POST” enctype\
  \ = “multipart/formdata” >\nSelect an image to upload :\n<input type=”file” name=”\
  \ image ” >\n<input type=”submit” value=”Upload Image”> </form>\n```\n\n![image](img/Image00037.jpg)\
  \ 现在，添加一个 PHP 脚本来处理表单提交\n\n```php\n<?php\nif ( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’\
  \ )\n{\n// 在此处插入语句（步骤 3-7）。\n}\n?>\n```\n\n![image](img/Image00038.jpg) 下，插入语句用关于用户选择的文件信息来初始化三个变量\n\
  \n```php\n$name = $_FILES[ ‘ image ’ ][ ‘name’ ] ;\n$temp = $_FILES[ ‘ image ’ ][\
  \ ‘tmp_name’ ] ;\n$size = $_FILES[ ‘ image ’ ][ ‘size’ ] ;\n```\n\n![image](img/Image00039.jpg)\
  \ 现在，插入语句通过测试文件扩展名来确保所选文件是所需的文件类型，否则退出\n\n```php\n$ext = pathinfo( $name , PATHINFO_EXTENSION\
  \ ) ;\n$ext = strtolower( $ext ) ;\nif( $ext != ‘png’ && $ext != ‘jpg’ && $ext !=\
  \ ‘gif’ )\n{ echo ‘Format must be PNG, JPG, or GIF’ ; exit() ; }\n```\n\n![image](img/Image00040.jpg)\
  \ 插入一个语句确保所选文件是所需的文件大小，否则退出\n\n```php\nif( $size > 512000 )\n{ echo ‘File size must\
  \ not exceed 500Kb’ ; exit() ; }\n```\n\n![image](img/Image00019.jpg) PHP 配置必须允许文件上传，此示例才能工作。PHP\
  \ 目录下的配置文件 `php.ini` 必须包含一行 `file`。\n\n`pathinfo()` 函数提供了扩展名。![image](img/Image00005.jpg)\
  \ 插入一个语句来确保所选文件是所需的文件大小，否则退出。\n\n```php\nif( file_exists( $name ) )\n{ echo ‘File\
  \ already exists’ ; exit(); }\n```\n\n![image](img/Image00041.jpg) 注意 `pathinfo()`\
  \ 函数提供了扩展名。![image](img/Image00005.jpg) 插入一个语句来确保所选文件是所需的文件大小，否则退出。\n\n```php\n\
  if( file_exists( $name ) )\n{ echo ‘File already exists’ ; exit(); }\n```\n\n![image](img/Image00042.jpg)\
  \ 最后，尝试上传文件。\n\n```php\ntry {\n    if (move_uploaded_file($temp, \"/htdocs/\" .\
  \ $name)) {\n        echo \"Upload successful\";\n    }\n} catch (Exception $e)\
  \ {\n    echo \"Error: \" . $e->getMessage();\n}\n```\n\n\n\n\n\n```css\np#err_msg\
  \ { color : #F00 ; font-weight : bold ; }\n```\n\n![image](img/Image00040.jpg) 将样式表保存在您创建的\
  \ `/includes` 文件夹中，与 HTML 头部和页脚文件一起。\n\n![image](img/Image00041.jpg) 最后，创建一个 PHP\
  \ 脚本，设置网页标题并用头部和页脚内容包裹表单。\n\n```php\n<?php\n$page_title = ‘PHP Include’ ;\ninclude\
  \ ( ‘includes/header.html’ ) ;\necho ‘<form action=” include.php ” method=” POST\
  \ ”>\n<p>Name: <input type=”text” name=” name ”> </p>\n<p>Email: <input type=”text”\
  \ name=” email ” ></p>\n<p><input type=”submit”></p></form>’ ;\ninclude ( ‘includes/footer.html’\
  \ ) ;\n?>\n```\n\n![image](img/Image00029.jpg)\n\n`include.php`\n\n![image](img/Image00042.jpg)\
  \ 将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并为 `include.php`，然后通过 HTTP 打开它以查看设置的标题以及被静态内容包裹的表单。\n\
  \n![image](img/Image00176.jpg)\n\n![image](img/Image00005.jpg) 你可以使用浏览器的“查看源代码”功能查看整个内容是否已有效整合到单个网页中。\n\
  \n## 附加链接数据\n\nPHP 预定义的“超级全局”变量，例如存储页面请求方法的 `$_SERVER` 数组变量，以及在用户退出前存储网站跨页面用户数据的\
  \ `$_SESSION` 数组变量，在任何脚本的所有作用域内都是可访问的。\n\n![image](img/Image00005.jpg) `$_SESSION`\
  \ 超级全局将用于在第 10 章中存储用户详情。\n\n当 HTML 表单使用 `POST` 方法提交数据时，`$_POST` 数组将提交的表单值存储在同名的数组元素中。因此，可以使用\
  \ `$_POST[‘city’]` 访问名为“city”的提交字段的值。\n\n同样，当使用 `GET` 方法提交数据时，`$_GET` 数组将提交的值存储在命名的数组元素中。因此，可以使用\
  \ `$_GET[‘id’]` 访问名为“id”的提交数据。这通常用于通过在 HTML 超链接锚点的 URL 后附加 `name=value` 对来向脚本提交数据，如下所示：\n\
  \n```html\n<a href=”www.example.com/script.php?id=1”>\n```\n\n由超链接指定的接收数据的脚本随后可以使用传递的值来确定响应：\n\
  \n![image](img/Image00029.jpg)\n\n`link.php`\n\n![image](img/Image00036.jpg) 创建一个包含\
  \ PHP 脚本的 HTML 文档，该脚本在 `$_GET` 数组中寻找名为“id”的元素。\n\n```php\n<?php\nif ( isset ( $_GET[\
  \ ‘id’ ] )\n{\n    # 在此处插入处理语句（步骤 2-3 ）。\n}\n```\n\n![image](img/Image00037.jpg)\
  \ 接下来，插入一个处理语句，将传递的值分配给同名的 PHP 变量。\n\n```php\n$id = $_GET[ ‘id’ ] ;\n```\n\n![image](img/Image00038.jpg)\
  \ 现在，插入一个处理语句根据传递的值输出适当的响应。\n\n```php\nswitch( $id )\n{\n    case 1 : echo ‘Cow\
  \ selected<hr>’ ; break ;\n    case 2 : echo ‘Dog selected<hr>’ ; break ;\n    case\
  \ 3 : echo ‘Goat selected<hr>’ ; break ;\n}\n```\n\n![image](img/Image00039.jpg)\
  \ 最后，添加语句显示带有附加值的超链接。\n\n```php\necho ‘<h1>Select a buddy</h1>’ ;\necho ‘ <p><a\
  \ href=”link.php? id=1 ”>Cow</a> |’ ;\necho ‘ <a href=”link.php? id=2 ”>Dog</a>\
  \ | ‘ ;\necho ‘ <a href=”link.php? id=3 ”>Goat</a></p>’ ;\n?>\n```\n\n![image](img/Image00040.jpg)\
  \ 将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并为 `link.php`，然后通过 HTTP 打开它并点击链接以查看传递值对应的响应。\n\
  \n![image](img/Image00177.jpg)\n\n![image](img/Image00178.jpg)\n\n![image](img/Image00019.jpg)\
  \ PHP 还提供了一个 `$_REQUEST` 超级全局，它包含了 `$_POST` 和 `$_GET` 数组的所有内容。这意味着可以使用 `$_REQUEST[‘city’]`\
  \ 访问 `$_POST[‘city’]`，但应避免这样做。请始终根据提交类型类型使用特定的数组。\n\n![image](img/Image00006.jpg)\
  \ 注意到传递的 `name=value` 对在浏览器地址栏中是可见的。\n\n## 总结\n\n- HTML `<form>` 标签的 `action` 属性指定处理表单提交的\
