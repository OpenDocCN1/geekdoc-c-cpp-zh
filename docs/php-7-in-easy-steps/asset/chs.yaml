- "# PHP 7：轻松易学指南\n\n\n\n![](img/Image00235.jpg)\n![](img/Image00235.jpg)\n\n\n![image](img/Image00000.jpg)\n\
  \n\n# 1 入门\n*欢迎来到使用 PHP 进行交互式 Web 的精彩世界。本章将演示如何使用 Web 服务器和 PHP 引擎创建一个动态开发环境。*\n\n\
  * 介绍 PHP\n* 安装 Abyss 服务器\n* 安装 PHP 引擎\n* 集成 Abyss 和 PHP\n* 嵌入 PHP 脚本代码\n* 按规则编写脚本\n\
  * 总结\n\n## 介绍 PHP\n最具吸引力的现代网站通过动态响应某些状态——用户名、时间、最新博客、购物车内容等提供定制体验。许多动态网站都是使用 PHP\
  \ 创建的。\n\n### 什么是 PHP？\nPHP 是一种广泛使用的通用脚本语言，特别适用于 Web 开发，并可以嵌入 HTML 中。它由程序员 Rasmus\
  \ Lerdorf 创建，最初是维护他网站的一组脚本，并于 1995 年 6 月 8 日发布为“Home Page Tools (PHP Tools) 版本 1.0”。\n\
  \n![image](img/Image00001.jpg)\n\n这是 PHP 项目的官方标志——PHP 的官方在线首页可以在 [php.net](http://www.php.net)\
  \ 找到。\n\n这些工具在 1997 年的 2 版本中得到了扩展，并在次后的 3 版本中更名为一个递归缩写 `PHP: Hypertext Preprocessor`。性能、可靠性和扩展性在\
  \ 2000 年发布 PHP4 时得到了改进，PHP4 由 Zend 引擎虚拟机驱动。\n\n随后，PHP5 于 2004 年发布，由新的 Zend II 引擎驱动，并由\
  \ PHP 小组作为免费软件制作。计划中的实验版本 PHP6（旨在在整个 PHP 中引入原生 Unicode 支持）被放弃了。目前的版本 PHP7 于 2015\
  \ 年发布，由最新的 Zend 3 引擎驱动，提供了更高的性能。今天，PHP 已在超过 2000 万个网站和 100 万 Web 服务器上安装。\n\n![image](img/Image00002.jpg)\n\
  \n这是“elePHPant”——PHP 项目的吉祥物，由 Vincent Pontier 设计。\n\n### 为什么 PHP 流行？\n• PHP 对初学者非常简单，但对专业程序员来说提供了许多高级功能。\n\
  \n\n\n\n-   PHP 代码封装在特殊的起始和结束标签中，允许你进入和退出“PHP 模式”，并在 HTML 文档中实现。\n-   PHP 代码在服务器上执行（“服务器端”），与在浏览器中执行的\
  \ `JavaScript` 代码（“客户端”）不同。客户端接收的是运行脚本的结果。最近，服务器端已被称为“云”。\n\n![image](img/Image00003.jpg)\n\
  \n图中显示的图标出现在书中，表示 PHP 版本 7 中引入的新功能。\n\n## 理解“云”\n\n当用户在浏览器中请求网页时，它会向 Web 服务器请求页面并通过\
  \ `HTTP` 协议接收响应。如果网页包含 PHP 脚本，Web 服务器将首先调用 PHP 引擎处理代码后再响应浏览器：\n\n![image](img/Image00004.jpg)\n\
  \n![image](img/Image00005.jpg) `HTTP`（超文本传输协议）是一种通用标准，允许连接到任何 Web 服务器的计算机访问文件。后续页面描述了如何通过在你的电脑上安装以下服务器来交互式网站开发环境：\n\
  \n-   **Web 服务器** – Abyss Web Server 免费版\n-   **PHP 引擎** – PHP 7.0\n\n![image](img/Image0006.jpg)\n\
  \n书中的示例已创建并测试，但对于其他版本可能需要进行修改。\n\n## 安装 Abyss 服务器\n\nAbyss X1 是一个适用于 Windows、Mac\
  \ OS X 和 Linux 操作系统的免费小型 Web 服务器，可以在 [aprelium.com](http://www.aprelium.com) 下载。尽管内存占用很小，但\
  \ Abyss 支持许多强大的功能，包括使用服务器脚本生成动态内容——它是 PHP 的理想伴侣。\n\n![image](img/Image0007.jpg)\n\
  \n关于 Abyss Web 服务器安装的更多指导可见 [aprelium.com/abyssws/start.html](http://www.aprelium.com/abyssws/start.html)。\n\
  \n可以将 Abyss Web 服务器安装在你的电脑上，为交互式 PHP 网站提供环境：\n\n![image](img/Image00008.jpg) 从 [aprelium.com/abyssws/download.php](http://www.aprelium.com/abyssws/download.php)\
  \ 下载适用于系统的 Abyss X1 Web 服务器安装包。\n\n![image](img/Image0009.jpg)\n\n![image](img/Image0010.jpg)\
  \ 运行安装程序并**同意**许可条款，然后选择 Web Server 组件并点击**下一步**。\n\n![image](img/Image0011.jpg)\n\
  \n![image](img/Image0006.jpg) 适用于 Windows 的 Abyss 安装包是一个名为 `abws1.exe` 的可执行文件，运行它来安装\
  \ Web 服务器。\n\n![image](img/Image0012.jpg) 接受建议的位置 `C:\\Abyss Web Server` 然后选择**安装为\
  \ Windows 服务**。\n\n![image](img/Image0013.jpg) 安装过程完成后，系统的默认浏览器将打开并显示 Abyss Web\
  \ 服务器控制台。\n\n![image](img/Image0014.jpg) 选择你喜欢的语言，然后输入用户名和密码以便以后访问 Abyss 控制台。\n\n\
  ![image](img/Image0015.jpg) 现在使用选择的用户名和密码登录，查看 Abyss 控制台确认服务器状态为“运行（Running）”。\n\
  \n![image](img/Image0016.jpg)\n\n![image](img/Image0017.jpg) 在浏览器地址栏输入 `http://localhost`\
  \ 然后按**回车**——查看默认的 Abyss“欢迎（Welcome）”页面。\n\n![image](img/Image0018.jpg)\n\n![image](img/Image0019.jpg)\n\
  \n如果你选择“手动启动”选项，Abyss 图标将出现在系统托盘中以便于启动/停止和访问服务器控制台。相反，可以通过浏览器通过 `http://localhost:9999`\
  \ 或通过数字 `http://127.0.0.1:9999` 找到控制台（`localhost` 是地址 `127.0.0.1` 的别名）。\n\n![image](img/Image00005.jpg)\n\
  \n在 Abyss 控制台中，点击“配置（Configure）”按钮然后点击通用（General）图标，查看默认 HTTP 端口为 80，默认文档路径（你的网页所在位置）为\
  \ `/htdocs`。\n\n## 安装 PHP 引擎\n\nPHP 解释器“引擎”在网页内实现 PHP 脚本，适用于 Windows、Mac OS X 和\
  \ Linux 系统，可以在 [php.net](http://php.net) 免费下载。\n\n![image](img/Image00001.jpg)\n\
  \n关于 PHP 安装的更多指导可见 [php.net/manual/en/install.php](http://php.net/manual/en/install.php)。\n\
  \n此外，适用于 Windows 上的 Abyss Web 服务器提供了一个预配置包：\n\n![image](img/Image0008.jpg) 从 [aprelium.com/abyssws/download.php](http://www.aprelium.com/abyssws/download.php)\
  \ 下载适用于系统的安装包。\n\n![image](img/Image0020.jpg) 运行下载执行文件来安装安装。\n\n\n\n![image](img/Image000.jpg)\n\
  \n![image](img/Image0011.jpg)\n\n![image](img/Image0019.jpg) 如果你在 Windows 上安装 PHP，请确保选择\
  \ Thread Safe 版本，它们需要的更少的依赖项。\n\n![image](img/Image0014.jpg) 接受建议的 `C:\\Program\
  \ Files (x86)\\PHP7` 然后点击**安装**。\n\n![image](img/Image0015.jpg) 安装完成后，点击**完成**关闭向向向。\n\
  \n![image](img/Image00000.5) PHP) PHP PHP 需要 PHP 引擎的位置。\n\n## 集成 Abyss 和 PHP\n\n\
  必须配置 Abyss Web 服务器以能够识别 PHP 脚本并在遇到它们时使用 PHP 解释器。通过在 Abyss 控制台中将文件扩展名 `.php` 关联为\
  \ PHP 脚本，并指定系统中 PHP 引擎的位置来实现：\n\n![image](img/Image00008.jpg) 在浏览器地址栏输入 `http://localhost:9999`\
  \ 以启动 Abyss Web 控制台，然后点击“配置（Configure）”按钮打开配置页面。\n\n![image](img/Image0010.jpg)\
  \ 点击 ![image](img/Image0024.jpg) **脚本参数（Scripting Parameters）**图标——打开脚本参数页面进行编辑。\n\
  \n![image] 确保“启用脚本执行（Enable Scripts Execution）”框已勾选，然后点击解释器表中的**添加（Add）**按钮。\n\n\
  ![image](img/Image00023.jpg) 将接口（Interface）参数设置为 `FastCGI (Local - Pipes)`。\n\n\
  ![image](img/Image00015.jpg) 将解释器（Interpreter）参数设置为系统上的 PHP 路径位置 `php-cgi.exe`。\n\
  \n![image](img/Image00017.jpg) 将关联扩展名（Associated Extensions）参数设置为 `php`，这样你的配置如下所示：\n\
  \n![image](img/Image00025.jpg)\n\n点击 **OK** 按钮验证你的新配置。\n\n![image](img/Image00026.jpg)\
  \ 点击随后出现的**重启（Restart）**按钮以应用你对 Abyss 配置所做的更改。\n\n\n\n\n只有当 Web 服务器通过 HTTP 协议提供文档时，PHP\
  \ 引擎才能对其进行解释。你不能简单地在浏览器中直接打开 PHP 文件。请始终使用 `http://localhost/` 地址来运行本书中的示例。\n\nAbyss\
  \ Web 服务器现在应该运行在你的系统上，并经过了正确配置，能够识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的 PHP\
  \ 脚本由 Abyss 为你的 浏览器提供服务来测试配置：\n\n![image](img/Image00029.jpg)\n\n`phpinfo.php`\n\
  \n![image](img/Image00008.jpg) 打开一个纯文本编辑器，并准确输入以下脚本\n\n```php\n<?php phpinfo() ;\
  \ ?>\n```\n\n![image](img/Image00010.jpg) 将脚本保存为 `phpinfo.php`，位于 Abyss 的文档路径目录下，通常位于\
  \ `C:\\Abyss Web Server\\htdocs`\n\n![image](img/Image00012.jpg) 在 Web 浏览器的地址栏中准确输入位置\
  \ `http://localhost/phpinfo.php`，以查看 Abyss 提供一个包含你 PHP 版本信息的网页\n\n![image](img/Image00030.jpg)\n\
  \n![image](img/Image00019.jpg)\n\nPHP 脚本对大小写敏感，因此你必须仅使用小字母复制列出的脚本。\n\n## 嵌入 PHP\
  \ 脚本代码\n\nPHP 脚本可以嵌入 HTML 文档——这意味着 PHP 和 HTML 代码可以和谐地共存在同一个文件中。所有的嵌入 PHP 代码必须包含在\
  \ `<?php` 和 `?>` 标签内，以便 PHP 引擎能够轻松识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后发送到\
  \ Web 浏览器：\n\n![image](img/Image00029.jpg)\n\n`hello.php`\n\n![image](img/Image00008.jpg)\
  \ 启动一个纯文本编辑器，并创建一个有效的空白 HTML5 文档，带有一个空的 body 部分\n\n```html\n<!DOCTYPE HTML>\n<html\
  \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title> Getting Started In PHP</title>\n\
  </head>\n<body\n\n</body>\n</html>\n```\n\n![image](img/Image00010.jpg) 在 body 部分插入标签以包含\
  \ PHP 代码\n\n```php\n<?php\n\n?>\n```\n\n![image](img/Image00012.jpg) 现在，在 PHP 标签之间插入描述性注释和一行代码，将内容写入\
  \ body 部分\n\n```php\n# 写入传统的问候。\necho '<h1>Hello World!</h1>' ;\n```\n\n![image](img/Image00031.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n注意，描述性注释包含在 PHP 标签之间仅用于信息说明目的。\n\n![image](img/Image00014.jpg)\
  \ 将文档编码设置为 UTF-8 格式，然后将其保存为 Abyss 服务器 `/htdocs` 文件夹中的 `hello.php`\n\n![image](img/Image00032.jpg)\n\
  \n![image](img/Image00015.jpg) 接下来，在 Web 浏览器的地址栏输入位置 `http://localhost/hello.php`，查看\
  \ Abyss 提供一个包含由嵌入 PHP 代码编写内容的网页\n\n![image](img/Image00033.jpg)\n\n![image](img/Image00017.jpg)\
  \ 现在，使用 Web 浏览器的“查看源代码”功能查看 PHP 是否已将内容写入 body 部分，包括 HTML `<h1></h1>` 标题标签\n\n![image](img/Image00034.jpg)\n\
  \nPHP 脚本可以用同样的方式嵌入较早版本的 HTML 中。书中的其他示例演示了嵌入 PHP 脚本，但没有重复列出 HTML 代码。\n\n![image](img/Image00019.jpg)\n\
  \nWindows 记事本会自动向文件添加一个隐藏的“字节顺序标记”（BOM）签名，而其他编辑器（如此处所示 Code Writer）允许省略此标记。Code\
  \ Writer 是一个从 Windows 商店提供的免费文本和代码编辑器。\n\n![image](img/Image00006.jpg)\n\n注意，PHP\
  \ 的 `echo` 指令会原封不动地写入一对 `' '` 单引号内的全部内容。\n\n## 遵循规则编写脚本\n\n### 标签规则\n\n当 PHP 引擎从\
  \ Web 服务器接收输入时，它会从上到下读取输入，这个过程被称为“解析”。在解析过程中，PHP 引擎（又称为解析器）寻找起始和结束标签 `<?php` 和 `?>`，并理解这些标签之间的内容是它必须解释的脚本代码。`<?php`\
  \ 和 `?>` 标签之外的所有内容都会被完全忽略，这允许 PHP 文件拥有混合内容，并允许 PHP 代码像这样嵌入到 HTML 中：\n\n```html\n\
  <p> 被 PHP 忽略并由浏览器显示</p>\n<?php echo 'Script code that will be parsed' ; ?>\n<p>\
  \ 也被 PHP 忽略并由浏览器显示</p>\n```\n\n为了让其正常工作，当嵌入 HTML 文件中时，将所有的 PHP 脚本代码都包含在起始标签 `<?php`\
  \ 和结束标签 `?>` 之间是非常重要的。\n\n![image](img/Image00005.jpg)\n\n通常，你的嵌入 PHP 代码在脚本周围始终有起始标签\
  \ `<?php` 和结束标签 `?>`。\n\n此规则的唯一例外是 PHP 脚本写在纯 PHP 文件中，该文件只包含代码。在这种情况下，最好省略结束标签 `?>`：\n\
  \n```php\necho 'Print this' ;\necho 'Print Last' ;\n```\n\n当 PHP 脚本仅意图向文档输出单个字符串时，你可以选择地使用短路输出标签\
  \ `<?=`：\n\n```php\n<?= 'Hello!' ?>\n```\n\n等同于：\n\n```php\n<?php echo 'Hello!'\
  \ ?>\n```\n\n### 语句规则\n\nPHP 语言中的每个语句必须以 `;` 字符结束——就像英语语言中的每个句子以句号结束一样。分号被解析器识别为它必须解释的单个指令的结束。因此，包含两个语句的\
  \ PHP 代码可能如下：\n\n```php\n<?php echo 'First statement' ; echo 'Second statement'\
  \ ; ?>\n```\n\nPHP 代码的结束标签 `?>` 自动隐含分号，因此你可以省略最后一个语句的分号：\n\n```php\n<?php echo 'First\
  \ statement' ; echo 'Second statement' ?>\n```\n\n条件测试将在后面详细说明并演示。\n\n### 注释规则\n\
  \n在 PHP 脚本代码中添加注释通常是值得的，这样他人或自己在回顾代码时可以更容易理解。所有的空白和注释都被 PHP 解析器完全忽略，因此你可以任意添加注释，而对性能产生任何不利影响。\n\
  \n单行注释可以以 `#` 字符开始，或者以 `//` 双斜杠序列开始。\n\n多行注释（块注释）必须包含在 `/*` 和 `*/` 字符序列之间，正如 C 编程语言中使用那样：\n\
  \n```php\n<?php\necho 'First statement' ; // 单行注释。\n\n/* 这是一个包含两行注释的多行注释。 */\necho\
  \ 'Second statement' ;\necho 'Final statement' ; # 另一个单行注释。\n?>\n```\n\n![image](img/Image00005.jpg)\n\
  \n`//` 单行注释样式也用于 C++ 编程，而 `#` 单行注释样式也用于 Unix/Linux BASH 脚本脚本。\n\n\n\n\n\n* `http://localhost`\
  \ URL 是 `http://127.0.0.1` 数字 IP 地址的别名。\n* 访问 Abyss Web Server 控制台需要您的用户名和密码，地址位于\
  \ `http://localhost:9999`。\n* 建议使用 Abyss Web Server 的预配置软件包，以便简单、快速地安装 PHP 引擎。\n\
  * 必须配置 Web 服务器以识别脚本，通过设置 `Interface`、`Interpreter` 和 `Associated Extension` 参数，将它们重定向到\
  \ PHP 引擎。\n* PHP 代码指令 `phpinfo()` 可用于生成包含您的 PHP 版本信息的网页。\n* 包含 PHP 脚本的文档最好使用流行的\
  \ UTF-8 字符格式进行编码。\n* PHP 的 `echo` 指令会字面上写入后续引号内包含的文本内容。\n* 所有嵌入的 PHP 代码必须封装在 `<?php`\
  \ 和 `?>` 标签内，以便 PHP 引擎识别。\n* PHP 语言中的每条语句都必须以分号字符 `;` 结束。\n* 单行注释可以以 `#` 哈希字符或 `//`\
  \ 双斜杠序列开始。\n* 多行块注释必须封装在 `/***` 和 `***/**` 字符序列之间。\n\n# 存储值\n*本章演示了可以存储数据的各种 PHP\
  \ 容器。*\n\n* 创建变量\n* 引用字符串\n* 生成数组\n* 数组排序\n* 描述维度\n* 检查类型\n* 定义常量\n* 探索超全局变量\n*\
  \ 总结\n\n## 创建变量\n“变量”是 PHP 脚本中命名的容器，用于存储数据值。存储的值可以使用变量名进行引用，并随着脚本的执行进行更改（变化）。脚本作者可以为变量选择任何名称，只要它遵循以下三个命名约定：\n\
  \n* 名称必须以 `$` 美元符号开始——例如 `$name`\n* 名称可以包含字母、数字和下划线字符，但不能包含空格——例如 `$subtotal_1`\n\
  * `$` 美元符号后的第一个字符必须是字母或下划线——不能是数字\n\n![image](img/Image00035.jpg)\n\n注意 PHP 中的变量名是区分大小写的，因此\
  \ `$name`、`$Name` 和 `$NAME` 是三个独立的变量。\n\n![image](img/Image00019.jpg)\n\n在 PHP 中\
  \ `$this` 是一个特殊变量，因此你不能使用 ‘this’ 作为变量名。\n\nPHP 变量是“弱类型的”，这意味着它们可以包含任何类型的数据，不像某些语言中的“强类型”变量（后者在创建变量时必须指定数据类型）。因此，PHP\
  \ 变量可以轻松地包含整数、浮点数、文本字符字符串、`TRUE` 或 `FALSE` 布尔值、一个对象，或一个 `NULL` 空值。\n\n![image](img/Image00006.jpg)\n\
  \n在整个脚本范围内可用的变量必须具有唯一的名称。有关“变量作用域”的更多信息请参见此处。\n\n在 PHP 脚本中只需声明其名称即可创建变量。然后可以使用 `=`\
  \ 赋值运算符指定其值进行初始赋值（初始化）。该语句以及 PHP 中的所有其他语句都必须像这样以分号结尾：\n\n```\n$body_temp = 98.6\
  \ ;\n```\n\n然后可以通过使用变量名引用来显示变量中包含的值，如下：\n\n```php\necho $body_temp ;\n```\n\n有用的是，可以通过将字符串和变量名封装在双引号中，将变量的值作为混合字符串的一部分显示：\n\
  \n```php\necho “Body temperature is $body_temp degrees Fahrenheit” ;\n```\n\n![image](img/Image00019.jpg)\n\
  \n不要混淆双引号和单引号的作用。记住，PHP 只对封装在双引号内的混合字符串进行变量替换。\n\n双引号确保 PHP 将评估整个字符串并将命名的变量替换为其存储的值。如果字符串封装在单引号中，此功能将无法运行！\n\
