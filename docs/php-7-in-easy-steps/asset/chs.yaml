  \  接下来，插入一个语句将所有数组元素中的值以项目列表的形式显示\n\n```php\nforeach( $days as $value ) { echo “&bull;\
  \ $value “ ; }\n```\n\n![image](img/Image00039.jpg)  然后，插入一个语句在用双引号赋值的混合字符串中替换显示变量值\n\
  \n```php\n$months = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’\
  \ ) ;\n```\n\n![image](img/Image00040.jpg)  插入一个语句将字符串连接到变量\n\n```php\n$phrase =\
  \ $phrase . ‘ and never simple’ ;\n```\n\n![image](img/Image00041.jpg)  最后，插入一个语句在混合字符串中显示替换后的两个变量值\n\
  \n```php\necho “<p><q> $phrase </q><cite> $author </cite></p>” ;\n```\n\n![image](img/Image00042.jpg)\
