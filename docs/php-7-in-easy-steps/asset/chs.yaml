  \ 插入语句显示 OR 和 NOT 评估\n\n`$result = ( $no || $no ) ? ‘TRUE’ : ‘FALSE’ ;`\n`echo “No\
  \ OR No returns $result <br>” ;`\n`$result = ( $yes || $no ) ? ‘TRUE’ : ‘FALSE’\
  \ ;`\n`echo “Yes OR No returns $result <br>” ;`\n\n\n\n\n\n```php\necho “Yes OR\
  \ No returns $result <br>” ;\n\n$result = ( $yes || $yes ) ? ‘TRUE’ : ‘FALSE’ ;\n\
  \necho “Yes OR Yes returns $result <hr>” ;\n\n$result = ( ! $yes ) ? ‘TRUE’ : ‘FALSE’\
  \ ;\n\necho “NOT Yes returns $result <br>” ;\n```\n![image](img/Image00058.jpg)\
  \ 将文档保存在 Web 服务器的 `/htdocs` 目录下并命名为 `logic.php`，然后通过 HTTP 打开页面以查看显示的结果。\n\n![image](img/Image00064.jpg)\n\
  \n![image](img/Image00005.jpg)\n\nPHP 还有一个 `XOR`（异或 `OR`）运算符，它会同时执行 `AND NOT` 的等效评估。\n\
  \n![image](img/Image00006.jpg)\n\n注意，`FALSE && FALSE` 的评估结果返回 `FALSE` —— 这也许是在说明“两个错也不出一个对”这句谚言。\n\
  \n## 比较位\n\n一个字节由八位组成，每个位可以包含一个 `1` 或一个 `0` 来存储二进制数，表示从 0 到 255 的十进制值。只有当位包含 `1`\
  \ 时，该位才会贡献一个十进制分量。组件从右到左从“最低位”（LSB）到“最高位”（MSB）命名。下方位模式中的二进制数表示十进制 50。\n\n![image](img/Image00006.jpg)\n\
  \n许多 PHP 程序员从不使用位运算符，但了解它们是什么以及如何使用是有有的。\n\n| 位数 | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2\
  \ | 1 LSB |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
  | 十进制 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| 二进制 | 0 | 0 | 1 | 1 | 0 | 0 | 1\
  \ | 0 |\n\n可以使用“位”运算符来操作字节的各个部分。位运算符允许对整数中的特定位进行评估和操作。\n\n| 运算符: | 名称: | 二进制数操作:\
  \ |\n| :--- | :--- | :--- |\n| `\\|` | OR | 当两个比较的位中有一个为 `1` 时，则在每个位返回 `1`。示例：`1010\
  \ \\| 0101 = 1111` |\n| `&` | AND | 当两个比较的位都为 `1` 时，则在每个位返回 `1`。示例：`1010 & 1100\
  \ = 1000` |\n| `~` | NOT | 当两个比较的位都不为 `1` 时，则在每个位返回 `1`。示例：`1010 ~ 0011 = 0100`\
  \ |\n| `^` | XOR | 当两个比较的位中只有一个为 `1` 时，则在每个位返回 `1`。示例：`1010 ^ 0100 = 1110` |\n|\
  \ `<<` | 左移 | 将每个为 `1` 的位向左移动指定数的位。示例：`0010 << 2 = 1000` |\n| `>>` | 右移 | 将每个为 `1`\
  \ 的位向右移动指定数的位。示例：`1000 >> 2 = 0010` |\n\n![image](img/Image00005.jpg)\n\n一个字节的半部分被称为“半字节”（4\
  \ 位）。表格中示例的二进制数描述了存储在半字节中的值。\n\n除非是为资源受限的设备编程，否则很少需要使用位运算符，但它们可能是很有用的。例如，`^`（异或\
  \ `OR`）运算符允许在不需要第三个变量的情况下交换两个变量的值：\n\n![image](img/Image00029.jpg)\n\nbitwise.php\n\
  \n![image](img/Image00054.jpg) 创建一个有效的 HTML 文档，如这里 所列出的那样，然后在 body 部分插入 PHP 标签。\n\
  \n```php\n<?php\n# 在此处插入插入语句。\n\n?>\n```\n![image](img/Image00055.jpg) 现在，在 PHP\
  \ 标签之间插入语句，以创建并初始化两个整数值的变量\n\n```php\n$x = 5 ; $y = 10 ;\n```\n![image](img/Image00056.jpg)\
  \ 接下来，添加一条语句来显示赋值的值。\n\n```php\necho “X : $x , Y : $y <br>” ;\n```\n![image](img/Image00057.jpg)\
  \ 插入三个 XOR 语句，通过二进制位操作交换变量值。\n\n```php\n$x = $x ^ $y ; /* 1010 ^ 0101 = 1111 (十进制\
  \ 15) */\n$y = $x ^ $y ; /* 1111 ^ 0101 = 1010 (十进制 10) */\n$x = $x ^ $y ; /* 1111\
  \ ^ 1010 = 0101 (十进制 5) */\n```\n![image](img/Image00058.jpg) 最后，添加一条语句来显示赋值的值。\n\
  \n```php\necho “X : $x , Y : $y <br>” ;\n```\n![image](img/Image00059.jpg) 将文档保存在\
  \ Web 服务器的 `/htdocs` 目录下并命名为 `logic.php`，然后通过 HTTP 打开页面以查看显示的结果。\n\n![image](img/Image00060.jpg)\n\
  \nPHP 还有一个 `XOR`（异或 `OR`）运算符，它会同时执行 `AND NOT` 的等效评估。\n\n![image](img/Image00006.jpg)\n\
  \n注意，`FALSE && FALSE` 的评估结果返回 `FALSE` —— 这也许是在说明“两个错也不出一个对”这句谚语。\n\n## 比较位\n\n一个字节由八位组成，每个位可以包含一个\
  \ `1` 或一个 `0` 来存储二进制数，表示从 0 到 255 的十进制值。只有当位包含 `1` 时，该位才会贡献一个十进制分量。组件从右到左从“最低位”（LSB）到“最高位”（MSB）命名。下方位模式中的二进制数表示十进制\
  \ 50。\n\n![image](img/Image00006.jpg)\n\n许多 PHP 程序员从不使用位运算符，但了解它们是什么以及如何使用是有用的。\n\
  \n| 位数 | 8 MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |\n| :--- | :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- | :--- |\n| 十进制 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1\
  \ |\n| 二进制 | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 0 |\n\n可以使用“位”运算符来操作字节的各个部分。位运算符允许对整数中的特定位进行评估和操作。\n\
  \n| 运算符: | 名称: | 二进制数操作: |\n| :--- | :--- | :--- |\n| `\\|` | OR | 当两个比较的位中有一个为\
  \ `1` 时，则在每个位返回 `1`。示例：`1010 \\| 0101 = 1111` |\n| `&` | AND | 当两个比较的位都为 `1` 时，则在每个位返回\
  \ `1`。示例：`1010 & 1100 = 1000` |\n| `~` | NOT | 当两个比较的位都不为 `1` 时，则在每个位返回 `1`。示例：`1010\
  \ ~ 0011 = 0100` |\n| `^` | XOR | 当两个比较的位中只有一个为 `1` 时，则在每个位返回 `1`。示例：`1010 ^ 0100\
  \ = 1110` |\n| `<<` | 左移 | 将每个为 `1` 的位向左移动指定数的位。示例：`0010 << 2 = 1000` |\n| `>>`\
  \ | 右移 | 将每个为 `1` 的位向右移动指定数的位。示例：`1000 >> 2 = 0010` |\n\n![image](img/Image00005.jpg)\n\
  \n一个字节的半部分被称为“半字节”（4 位）。表格中示例的二进制数描述了存储在半字节中的值。\n\n除非是为资源受限的设备编程，否则很少需要使用位运算符，但它们可能是很有用的。例如，`^`（异或\
  \ `OR`）运算符允许在不需要第三个变量的情况下交换两个变量的值：\n\n![image](img/Image00029.jpg)\n\nbitwise.php\n\
  \n![image](img/Image00054.jpg) 创建一个有效的 HTML 文档，如这里 所列出的那样，然后在 body 部分插入 PHP 标签。\n\
  \n```php\n<?php\n# 在此处插入插入语句。\n\n?>\n```\n![image](img/Image00055.jpg) 现在，在 PHP\
  \ 标签之间插入语句，以创建并初始化两个整数值的变量\n\n```php\n$x = 5 ; $y = 10 ;\n```\n![image](img/Image00056.jpg)\
  \ 接下来，添加一条语句来显示赋值的值。\n\n```php\necho “X : $x , Y : $y <br>” ;\n```\n![image](img/Image00057.jpg)\
  \ 插入三个 XOR 语句，通过二进制位操作交换变量值。\n\n```php\n$x = $x ^ $y ; /* 1010 ^ 0101 = 1111 (十进制\
  \ 15) */\n$y = $x ^ $y ; /* 1111 ^ 0101 = 1010 (十进制 10) */\n$x = $x ^ $y ; /* 1111\
  \ ^ 1010 = 0101 (十进制 5) */\n```\n![image](img/Image00058.jpg) 最后，添加一条语句来显示赋值的值。\n\
  \n```php\necho “X : $x , Y : $y <br>” ;\n```\n![image](img/Image00059.jpg) 将文档保存在\
  \ Web 服务器的 `/htdocs` 目录下并命名为 `logic.php`，然后通过 HTTP 打开页面以查看显示的结果。\n\n![image](img/Image00060.jpg)\n\
  \nPHP 还有一个 `XOR`（异或 `OR`）运算符，它会同时执行 `AND NOT` 的等效评估。\n\n![image](img/Image00006.jpg)\n\
  \n注意，`FALSE && FALSE` 的评估结果返回 `FALSE` —— 这也许是在说明“两个错也不出一个对”这句谚语。\n\n\n\n\n\n- 算术运算符可以结合操作数形成表达式，包括加法\
  \ `+`、减法 `-`、乘法 `*`、除法 `/`、取模 `%` 和幂 `**`。\n- 赋值运算符 `=` 可以与任何算术运算符结合，用于执行算术计算并赋值结果。\n\
  - 比较运算符可以结合操作数形成表达式，包括相等 `==`、不相等 `!=`、全等或不全等 `===`、`!==`、大于 `>`、小于 `<`、大于等于 `>=`、小于\
  \ `<=` 以及飞船运算符 `<=>`。\n- 条件运算符 `?:` 评估一个表达式以得到 `TRUE`（真）或 `FALSE`（假）布尔值，然后根据评估结果返回两个指定结果之一。\n\
  - `??` 空值合并运算符从左到右遍历操作数并返回第一个非空值。\n- 逻辑运算符 `and`、`&&`、`or`、`||` 和 `xor` 形成表达式，评估两个操作数并返回真或假的值。\n\
  - 逻辑非运算符 `!` 返回单个操作数的反反布尔值。\n- 位运算符 `|`、`&`、`~`、`^`、`<<` 和 `>>` 允许对整数内的特定位进行评估和操作。\n\
  - 前置增 `++` 或递减 `--` 运算符会将变量的值改变一并返回结果。\n- 后置增 `++` 或递减 `--` 运算符返回变量的当前值，然后将其值改变一。\n\
  - 运算符优先级决定了表达式在评估时的分组方式。\n- 当运算符优先级相同时，它们的结合性决定了表达式评估时的分组方式。\n- `var_dump()` 函数可以查看表达式产生的类型和值。\n\
  - 特殊常量 `NULL` 表示一个没有任何值（即使不是零）的变量。\n\n## 测试条件\n\n本章演示了决定脚本执行方式的各种 PHP 控制结构。\n\n\
  寻求真理 | 提供备选方案 | 分支分支 | 执行循环 | 在真循环 | 退出循环 | 总结\n\n## 寻求真理\n\n`if` 关键字用于执行基础条件测试，评估给定的表达式以得到\
  \ `TRUE` 或 `FALSE` 布尔值。评估后大括号内的语句仅在表达式被判定为 `TRUE` 时才会执行。当表达式被判定为 `FALSE` 时，PHP 解析器只需移动到脚本的下一部分。\n\
  \n![image](img/Image00005.jpg)\n\n`if` 结构是 PHP 以及大多数其他编程语言中最重要的特性之一。\n\n`if` 条件测试语句的语法如下：\n\
  \n```\nif ( test-expression ) { statement-to-execute-when-true ; }\n```\n\n当测试为\
  \ `TRUE` 时，可能有多个语句需要执行，但每条语句必须以分号结束：\n\n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\n```\n\
  \n可以使用逻辑运算符 `&&` 或 `and` 对多个表达式进行测试，以确保只有在两个表达式都被判定为 `TRUE` 时才会执行后续语句，如下所示：\n\n\
  ```php\nif ( ( test-expression ) && ( test-expression ) )\n{\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\n```\n\
  \n![image](img/Image00005.jpg)\n\n当要执行的代码只是单个语句时，可以选择省略大括号，但为了一致性，你可能希望始终包含大括号。\n\
  \n或者，可以嵌套 `if` 条件测试语句来测试多个表达式，使得只有在所有测试都被判定为 `TRUE` 时才会执行语句，如下所示：\n\n```\nif ( test-expression\
  \ )\n{\n    if ( test-expression )\n    {\n        statement-to-execute-when-true;\n\
  \        statement-to-execute-when-true;\n        statement-to-execute-when-true;\n\
  \    }\n}\n```\n\n可以创建多个 `if` 条件测试语句来为脚本提供备选路径。\n\n![image](img/Image00029.jpg)\n\
  \nif.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，用一个初始化整数变量的语句开始脚本：\n\n```php\n\
  <?php\n$num = 8 ;\n```\n\n![image](img/Image00068.jpg) 接下来，添加在数值大小条件测试判定为 `TRUE`\
  \ 时输出结果的语句：\n\n```php\nif ( $num > 5 ) { echo “$num exceeds 5<br>” ; }\nif ( $num\
  \ <= 5 ) { echo “ $num is below 6<br>” ; }\n```\n\n![image](img/Image00069.jpg)\
  \ 现在，添加在奇偶性条件测试判定为 `TRUE` 时输出结果的语句：\n\n```php\nif ( $num % 2 == 0 ) { echo “$num\
  \ is Even<br>” ; }\nif ( $num % 2 != 0 ) { echo “$num is Odd<br>” ; }\n```\n\n![image](img/Image00070.jpg)\
  \ 在 PHP 标签之间，用一个仅当测试表达式为 `TRUE` 时才输出结果的语句开始脚本：\n\n```php\n<?php\nif ( 4 > 2 ) {\
  \ echo ‘<p>Yes, 4 is greater than 2 <br>’ ; }\n```\n\n![image](img/Image00068.jpg)\
  \ 接下来，添加在两个测试表达式都被判定为 `TRUE` 时才输出结果的语句：\n\n```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) )\
  \ {\n    // statements\n}\n```\n\n## 提供备选方案\n\n通常最好通过在 `if` 语句后附加 `else` 语句来扩展它，并指定在表达式为\
  \ `FALSE` 时执行的大括号内的语句：\n\n```\nif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\nelse\n\
  {\n    statement-to-execute-when-false;\n    statement-to-execute-when-false;\n\
  \    statement-to-execute-when-false;\n}\n```\n\n![image](img/Image00074.jpg) 也可以通过添加\
  \ `elseif` 语句在条件中评估备备选表达式（注：此处原文应为备选表达式），并指定当备选表达式为 `TRUE` 时执行的大括号内的语句：\n\n```\n\
  if ( test-expression )\n{\n    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n}\nelseif ( test-expression )\n{\n    statement-to-execute-when-true;\n\
  \    statement-to-execute-when-true;\n    statement-to-execute-when-true;\n}\nelse\n\
  {\n    statement-to-execute-when-false;\n    statement-to-execute-when-false;\n\
  \    statement-to-execute-when-false;\n}\n```\n\n这是一项基础编程技术，它根据评估结果为脚本提供不同的执行方向，被称为“条件分支”。\n\
  \n![image](img/Image00005.jpg)\n\n`elseif` 关键字也可以写成两个单词：`else if`。\n\n![image](img/Image00019.jpg)\
  \ 你可能会遇到一些使用冒号 `:` 而不是大括号的 PHP 脚本。这种做法是不推荐的，因为只有在使用大括号时，`if` 和 `else if` 才会被视为完全相同。\n\
  \n![image](img/Image00029.jpg)\n\nelse.php\n\n\n\n\n```\n{ echo ‘4 is greater than\
  \ 2 AND 8 is greater than 4<br> ; }\n```\n\n![image](img/Image00069.jpg) 现在，添加一个语句，当测试的表达式被判定为\
  \ **TRUE** 或 **FALSE** 时，输出结果。\n\n```php\nif ( 4 > 8 )\n{\n    echo ‘4 is greater\
  \ than 8 <br>’ ;\n}\nelse\n{\n    echo ‘4 is less than 8 <br>’ ;\n}\n```\n\n![image](img/Image00070.jpg)\
  \ 最后，添加一个语句，当两个测试的表达式其中一个被判定为 **TRUE**，或者两个测试的表达式都被判定为 **FALSE** 时，输出结果。\n\n```php\n\
  if ( 4 > 8 )\n{\n    echo ‘This test is True </p>’ ;\n}\nelseif ( 8 > 4 )\n{\n \
  \   echo ‘Alternative test is True </p>’ ;\n}\nelse\n{\n    echo ‘Both tests are\
  \ False </p>’ ;\n}\n?>\n```\n\n![image](img/Image00072.jpg) 将文档保存在 Web 服务器的 `/htdocs`\
  \ 目录下并命名为 `else.php`，然后通过 HTTP 打开页面以显示条件分支的结果。\n\n![image](img/Image00075.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n你可以嵌套条件 **if** 测试（在一个内部嵌套另一个），使得内部块中的语句只有在两个测试都被判定为\
  \ **TRUE**时才会执行。\n\n## 切换分支\n\n当测试表达式仅评估一个条件时，通过多个 **if-elseif-else** 语句执行的条件分支可以通过\
  \ **switch** 语句更高效地完成。\n\n**switch** 语句的工作方式很寻常。它接受一个给定的值作为参数，然后尝试从多个 **case** 语句中匹配该值。找到匹配时要执行的代码包含在每个\
  \ **case** 语句中。\n\n用 `break` 关键字语句结束每个 **case** 语句是非常重要的，这样 **switch** 语句在找到匹配项后就会退出，不再寻找其他匹配项——除非这是刻意的要求。\n\
  \n可选地，**case** 语句列表后面可以跟一个最终的 **default** 语句，以指定在任何 **case** 语句中未找到匹配项时执行的代码。因此，switch\
  \ 语句的语法通常如下：\n\n```php\nswitch ( test-value )\n{\n    case match-value : statements-to-execute-when-matched\
  \ ; break ;\n    case match-value : statements-to-execute-when-matched ; break ;\n\
  \    case match-value : statements-to-execute-when-matched ; break ;\n    default\
  \ : statements-to-execute-when-no-match-found ;\n}\n```\n\n![image](img/Image00005.jpg)\
  \ 包含 **default** 语句始终是一个好主意——即使只是在 **switch** 语句失败时输出一条错误消息。\n\n一个 **switch** 语句可以有很多\
  \ **case** 语句，但没有两个 **case** 语句可以尝试匹配相同的值。\n\n当多个匹配值需要执行相同的语句时，只需要最后的 **case** 语句包含要执行的语句和退出\
  \ **switch** 语句块的 `break` 语句。例如，为匹配值为 0、1 和 2 输出相同的消息：\n\n```php\nswitch ( $number\
  \ )\n{\n    case 0 :\n    case 1 :\n    case 2 : echo ‘Less than 3’ ; break ;\n\
  \    case 3 : echo ‘Exactly 3’ ; break ;\n    default : echo ‘Greater than 3 or\
  \ less than zero’ ;\n}\n```\n\n![image](img/Image00006.jpg) **default** 语句不需要出现在\
  \ **switch** 块的末尾，但将其放在那里是有逻辑，因为那里不需要 `break` 语句。\n\n![image](img/Image00029.jpg)\n\
  \nswitch.php\n\n![image](img/Image00067.jpg) 在 PHP 标签之间，使用初始化两个整数和字符值变量的语句开始脚本。\n\
  \n```php\n<?php\n$number = 2 ; $letter = ‘B’ ;\n```\n\n![image](img/Image00068.jpg)\
  \ 接下来，添加一个 **switch** 语句来匹配整数值。\n\n```php\nswitch ( $number )\n{\n    case 1 : echo\
  \ ‘Number is One<br>’ ; break ;\n    case 2 : echo ‘Number is Two<br>’ ; break ;\n\
  \    case 3 : echo ‘Number is Three<br>’ ; break ;\n    default : echo ‘Number is\
  \ Unrecognized<br>’ ;\n}\n```\n\n![image](img/Image00069.jpg) 现在，添加一个 **switch**\
  \ 语句来匹配字符值。\n\n```php\nswitch ( $letter )\n{\n    case ‘A’ : echo ‘Letter is A<br>’\
  \ ; break ;\n    case ‘B’ : echo ‘Letter is B<br>’ ; break ;\n    case ‘C’ : echo\
  \ ‘Letter is C<br>’ ; break ;\n    default : echo ‘Letter is Unrecognized<br>’ ;\n\
  }\n```\n\n![image](img/Image00070.jpg) 最后，添加一个语句，当测试的表达式被判定为 **TRUE** 或 **FALSE**\
  \ 时，输出结果。\n\n```php\n{ echo ‘4 is greater than 2 AND 8 is greater than 4<br>’ ;\
  \ }\n```\n\n\n\n`while` 循环是上一个示例中的 `for` 循环的替代方案。`while` 循环也需要初始化器、测试表达式和更新器，但这些并不像\
  \ `for` 循环那样整齐地列在一对括号内。\n\n\n\n\n*本章将演示如何在函数中创建可重用的代码块。*\n\n## 定义函数\n\nPHP 提供了许多内置函数，您可以在脚本中通过名称调用这些函数来执行预定义的操作，例如此处\
  \ 描述的数组排序函数。此外，您也可以根据需要创建自己的自定义函数，以便在调用时执行指定的操作。这非常有用，允许 PHP 脚本模块化为更易理解和维护的代码段。\n\
  \n![image](img/Image00084.jpg)\n\n您的自定义函数名可以包含字母、数字和下划线字符的任意组合，但必须以字母或下划线开头。可以理解的是，为了避免冲突，名称不能与现有的内置函数名重复，例如，您不能创建一个名为“sort”的自定义函数。\n\
  \n与 PHP 变量不同，函数名是**不区分大小写**的，因此 `cube()`、`Cube()` 和 `CUBE()` 都可以引用同一个函数。尽管如此，建议您始终使用与函数定义时相同的大小写形式。\n\
  \n在 PHP 脚本中，创建函数定义只需在 `function` 关键字后写出函数名，然后跟着括号和花括号，花括号包含每次调用该函数时要执行的语句：\n\n```php\n\
  function function_name()\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    statement-to-be-executed ;\n}\n```\n\n![image](img/Image00006.jpg)\n\n\
  PHP 变量名是区分大小写的，但 PHP 函数名不区分。\n\nPHP 脚本随后可以使用 `function_name()` 通过名称调用定义的函数，并在需要时执行其包含的语句。尽管解释器从上到下运行脚本，但函数调用可以出现在函数定义之前。然而，这并不是良好的编程习惯，因此您应该在调用函数之前定义它们。\n\
  \n函数可以包含任何有效的 PHP 脚本代码，甚至可以包含另一个函数定义。在这种情况下，只有在被调用时内部函数才存在。\n\n![image](img/Image0029.jpg)\n\
  \n![image](img/Image00085.jpg) 创建一个 PHP 脚本，通过一个语句来定义函数\n\n```php\n<?php\nfunction\
  \ greet()\n{\n    echo 'Hello!';\n}\n```\n\n![image](img/Image00086.jpg) 接下来，添加一个语句来调用函数\n\
  \n```php\ngreet();\n```\n\n![image](img/Image00087.jpg) 现在，定义一个包含另一个语句的函数，通过引用传递数据\n\
  \n```php\nfunction outer()\n{\n    function inner()\n    {\n        echo 'Inner\
  \ function';\n    }\n}\n```\n\n![image](img/Image00088.jpg) 最后，添加一个语句来调用函数，传递变量值\n\
  \n```php\nouter();\n?>\n```\n\n![image](img/Image00089.jpg)\n\n![image](img/Image00090.jpg)\n\
  \n## 传递参数\n\n![image](img/Image0005.jpg)\n\n![image](img/Image00006.jpg) 参数可以以这种方式传递到函数，例如向内置函数传递数据\n\
  \n![image](img/Image00007.jpg) 参数在函数定义中指定如下：\n\n```php\nfunction function_name($arg_1,\
  \ $arg_2, $arg_3)\n{\n    // Statements to be inserted.\n}\n```\n\n![image](img/Image00008.jpg)\
  \ 参数名称应遵循命名规范，并在理想情况下使用\n\n![image](img/Image00009.jpg) 重要的是要意识到，默认情况下，数据是**按值传递**的。这意味着传递到函数的是该变量的副本。修改该变量不会影响存储在变量中的原始数据。\n\
  \n如果您想让函数修改存储在变量中的数据，必须通过**引用传递**。要确保参数始终通过引用传递，只需在函数定义中的参数名前加上 `&`。\n\n![image](img/Image00029.jpg)\n\
  \narguments.php\n\n![image](img/Image00085.jpg) 创建一个 PHP 脚本，通过一个语句初始化两个相同的整数变量\n\
  \n```php\n<?php\n$a = $b = 5;\n```\n\n![image](img/Image00086.jpg) 接下来，定义一个接受两个整数参数的函数——一个按值传递，另一个按引用传递\n\
  \n```php\nfunction modify(int $val, int &$ref)\n{\n    echo “Passed values : $val\
  \ , $ref <br>” ;\n    $val ++;\n    $ref ++;\n    echo “Incremented values : $val\
  \ , $ref <hr>” ;\n}\n```\n\n![image](img/Image00087.jpg) 在函数块之后添加一个语句来调用函数，将变量值作为参数\n\
  \n```php\nmodify($a, $b);\n```\n\n![image](img/Image00088.jpg) 最后，添加一个语句来显示现在存储在每个变量中的值\n\
  \n```php\necho “Stored values : $a , $b ” ;\n?>\n```\n\n![image](img/Image00091.jpg)\n\
  \n![image](img/Image00092.jpg)\n\n## 可变参数\n\n默认参数值可以在函数定义中通过给参数名赋值来可选地指定，如下：\n\n\
  ```php\nfunction function_name($arg_1, $arg_2 = “Default String”)\n{\n    statement-to-be-executed\
  \ ;\n    statement-to-be-executed ;\n    statement-to-be-executed ;\n}\n```\n\n\n\
  \n\n\n这允许在进行函数调用时指定一个或两个参数值。如果只指定了一个参数，它会被赋值给第一个参数，而第二个参数将使用默认值。在为参数指定默认值的情况下，它们必须仅出现在没有指定默认值的参数之后（即右侧）的参数列表中。否则，缺少正确总参数数量的调用会导致错误。\n\
  \n![image](img/Image00019.jpg)\n\n如果指定了多个默认值，目前没有方法在函数调用中跳过某个参数，以便为特定参数分配参数值。\n\n\
  如果你需要创建一个接受未知数量参数的函数，PHP 有一个专门的 `...` “散列”（splat）运算符用于此目的。它可以像这样用在函数定义中：\n\n```php\n\
  function function_name ( ...$args ) \n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    statement-to-be-executed ;\n}\n```\n\n当在函数定义中使用 `...` 散列运算符作为参数名的前缀时，可以将多个参数传递给该参数以创建一个数组。该数组可以像其他数组一样被遍历，以处理传入的参数值。\n\
  \n此外，`...` 散列运算符可以用于“解包”函数调用指定的数组，将其元素值作为单独参数传递，如下所示：\n\n```php\nfunction function_name\
  \ ( $*arg_1 , $*arg_2 , $*arg_3 ) \n{\n    echo $*arg_1 + $*arg_2 + $*arg_3 ;\n\
  }\n\n$arr = [ 1 , 2 , 3 ] ;\nfunction_name ( ...$arr )      # 输出 6\n```\n\n![image](img/Image00005.jpg)\n\
  \n`...` 散列运算符有时也被称为“传播”（scatter）运算符。\n\n![image](img/Image00029.jpg)\n\nparameters.php\n\
  \n![image](img/Image00085.jpg) 通过定义一个函数开始 PHP 脚本，为它的两个参数提供默认字符串值\n\n```php\n<?php\n\
  function drink ( string $tmp = ‘hot’ , string $flavor = ‘tea’ )\n{\n    // 在此处插入语句。\n\
  }\n```\n\n![image](img/Image00086.jpg) 接下来，插入一条语句来显示其默认值或传入的参数值\n\n```php\necho\
  \ “Drinking $tmp $flavor .<br>” ;\n```\n\n![image](img/Image00087.jpg) 在函数块之后，添加可选传递字符串参数的函数调用\n\
  \n```php\ndrink () ; drink ( ‘iced’ ) ; drink ( ‘cold’ , ‘lemonade’ ) ;\n```\n\n\
  ![image](img/Image00088.jpg) 现在，定义一个接受多个整数参数的函数并显示它们的总和\n\n```php\nfunction add\
  \ ( int ... $numbers )\n{\n    $total = 0 ;\n    foreach( $numbers as $num ) { $total\
  \ + = $num ; }\n    echo “<hr>Total : $total ” ;\n}\n```\n\n![image](img/Image00089.jpg)\
  \ 最后，在函数块之后添加一条语句调用上一步的函数并传递三个值\n\n```php\nadd ( 1 , 2 , 3 ) ;\n?>\n```\n\n![image](img/Image00091.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `parameters.php`，然后通过 HTTP 打开页面以查看参数和默认值\n\n\
  ![image](img/Image00093.jpg)\n\n![image](img/Image00005.jpg)\n\n你可以在使用 `...` 散列运算符的接受多个参数的参数之前指定普通的位置参数。只有数量超过位置元素的参数才会被添加到最后一个参数的数组中。\n\
  \n### 识别作用域\n\n在创建自定义函数时，理解变量的可访问性如何受变量“作用域”的限制至关重要：\n\n*   在函数外部创建的变量具有“全局”作用域，但通常无法从任何函数块内部访问\n\
  *   在函数内部创建的变量具有“本地”作用域，因此只能在该特定的函数块内部访问\n\n由于在函数内部创建的变量无法从别处访问，它的名称可以与函数块外部的变量或另一个函数块内部的变量名重复而不会产生冲突。这允许全局变量包含与同名局部变量不同的值。\n\
  \n![image](img/Image00019.jpg)\n\nPHP 中的全局变量不像 C 等其他编程语言（在 C 语言中，全局变量对函数自动可用）。在\
  \ PHP 中，只有在先在函数块内部使用 `global` 关键字显式声明后，全局变量才能在函数中使用。\n\n如果你想在函数内部使用全局变量，必须先包含带有\
  \ `global` 关键字的语句来声明该变量名指向一个全局变量，如下：\n\n```php\nglobal variable-name ;\n```\n\n\
  通过在函数内部创建的变量的声明之前加上 `global` 关键字，可以更改其作用域使其全局可用——但这是一种坏习惯，应该尽量避免。\n\n函数语句可以调用其他函数来执行它们的语句，也可以调用自己来执行递归。与循环一样，递归函数必须改变测试条件的状态，以便其不会永远持续下去。这可能是一个从参数传入的计数器值。\n\
  \n与局部变量不同（局部变量在程序离开函数时会丢失值），静态变量会保留其值。这意味着函数可以像这样增加值：\n\n```php\nstatic variable-name\
  \ ;\n```\n\n否则，递归函数可能会引用全局变量直到超过测试。\n\n![image](img/Image00029.jpg)\n\nscope.php\n\
  \n![image](img/Image00085.jpg) 通过初始化全局变量并显示它开始 PHP 脚本\n\n```php\n<?php\n$number\
  \ = 1 ;\necho “Global number : $number <br>” ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，定义并调用一个初始化局部变量并显示它的函数\n\n```php\nfunction show_local ()\n{\n    $number =\
  \ 100 ;\n    echo “Local number : $number <hr>” ;\n}\nshow_local ()\n```\n\n![image](img/Image00087.jpg)\
  \ 现在，定义并调用一个递归函数来增加全局变量和静态变量\n\n```php\nfunction recur ()\n{\n    global $number\
  \ ;\n    static $letter = ‘A’ ;\n    if( $number < 14 )\n    {\n        echo “ $number\
  \ : $letter | “ ;\n        $number ++ ; $letter ++ ;\n        recur () ;\n    }\n\
  }\nrecur () ;\n```\n\n![image](img/Image00088.jpg) 最后，在函数块之后添加一条语句显示修改后的全局变量\n\n\
  ```php\necho “<hr>Global number : $number ” ;\n?>\n```\n\n![image](img/Image00089.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `scope.php`，然后通过 HTTP 打开页面以查看全局和局部变量值\n\n![image](img/Image00091.jpg)\n\
  \n![image](img/Image00094.jpg)\n\n如果你从此函数中移除 `static` 关键字，则每次调用函数时 `$letter` 变量都将包含\
  \ ‘A’。\n\n![image](img/Image00005.jpg)\n\nPHP 还有一个特殊的 `$GLOBALS` 数组，可以通过其名称引用全局变量的值。在示例中，你可以替代地使用\
  \ `$GLOBALS[‘number’]` 来获取值。\n\n### 返回值\n\n自定义 PHP 函数可以通过添加使用 `return` 关键字的语句向调用者返回一个值，如下：\n\
  \n```php\nfunction function_name ( ) \n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    return value ;\n}\n```\n\n`return` 语句是可选的，如果省略，函数默认向调用者返回 `NULL` 值。\n\n\
  函数只能向调用者返回一个项目，因此它们不能返回多个值。然而，你可以将多个值赋值给数组的元素，并让函数向调用者返回单个数组，然后解包这些值。\n\n\n\n\n\n\
  `return` 语句可以包含一个待评估的表达式，以便其单一结果将返回给调用者。例如：\n\n```php\nfunction square( int $number\
  \ )\n{\n    return $number * $number ;\n}\n\necho square( 3 ) ; # 输出 9\n```\n\n\
  为了确保函数只返回所需数据类型的值，函数声明中可以可选地指定返回类型描述，例如 `int`、`float`、`string`、`bool` 或 `array`，如下：\n\
  \n```php\nfunction *function_name ( ) : int\n{\n    statement-to-be-executed ;\n\
  \    statement-to-be-executed ;\n    return value ;\n}\n```\n\n当指定了返回数据类型时，尝试向调用者返回错误数据类型的函数将导致错误。\n\
  \n![image](img/Image00003.jpg)\n\n指定返回数据类型的能力是 PHP 7 的一个新特性。\n\n![image](img/Image00029.jpg)\n\
  \nreturn.php\n\n![image](img/Image00085.jpg) 通过定义一个必须只返回数据数组的函数开始 PHP 脚本\n\n```php\n\
  <?php\nfunction supply () : array\n{\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，插入一条语句返回一个包含四个混合值的数组\n\n```php\nreturn array ( 75 , 3.142 , ‘Super PHP’ ,\
  \ True ) ;\n```\n\n![image](img/Image00087.jpg) 函数之后，添加一条调用该函数并将返回的数组值赋值给变量的语句\n\
  \n```php\n$array = supply () ;\n```\n\n![image](img/Image00088.jpg) 最后，添加一个循环来显示函数返回的每一个值\n\
  \n```php\nforeach( $array as $data )\n{\n    echo “Element Value : $data <br> ;\n\
  }\n?>\n```\n\n![image](img/Image00089.jpg) 将文档保存到网络服务器的 `/htdocs` 目录并命名为 `return.php`，然后通过\
  \ HTTP 打开页面查看返回的值\n\n![image](img/Image00095.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n在 PHP 中，布尔值 `TRUE` 在数值上表示为 1。\n\n### 回调\n\nPHP 允许你创建在函数定义中没有指定名的“匿名”函数。与其他函数一样，如果指定了参数，它们可以接受参数，并且在调用时可以可选地返回一个值。与其他代码构造的函数定义不同，匿名函数定义是一个表达式。这意味着每个匿名函数定义必须以分号结束，如下：\n\
  \n```php\nfunction ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
  \ ;\n    return value ;\n} ;\n```\n\n![image](img/Image00019.jpg)\n\n不要忘记在每个匿名函数定义后添加终止的\
  \ `;` 分号。\n\n匿名函数本身用处不大，因为没有名称，它无法被调用，但它可以在其他方面很有用：\n\n- 赋值给变量，匿名函数可以使用变量名进行调用\n\
  - 作为可调用参数传递给另一个函数，匿名函数稍后可以作为“回调”调用\n- 从函数返回，匿名函数在“闭包”中保留对返回函数变量的访问权限\n\n通过将匿名函数赋值给变量，你实际上给函数起了一个名字，并可以像调用任何其他函数一样使用变量名来调用它并传递参数。同样，当你将匿名函数传递给另一个函数时，可以像调用任何其他函数一样使用参数名进行回调并传递参数。PHP\
  \ 的 `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量。\n\n![image](img/Image00029.jpg)\n\ncallback.php\n\
  \n![image](img/Image00085.jpg) 通过向变量赋值一个接受单个参数的匿名函数开始 PHP 脚本\n\n```php\n<?php\n\
  $hello = function ( $user ) { echo “Hello $user !<br> ; } ; ;\n```\n\n![image](img/Image00086.jpg)\
  \ 接下来，添加一条调用匿名函数并传递单个参数的语句\n\n```php\n$hello ( ‘Mike’ ) ;\n```\n\n![image](img/Image00087.jpg)\
  \ 现在，定义一个接受单个可调用参数的普通函数，并调用该函数传递一个字符串\n\n```php\nfunction greet ( callable $anon\
  \ )\n{\n    $anon ( ‘Carole Anne’ ) ;\n}\n```\n\n![image](img/Image00088.jpg) 添加一条语句调用上一步定义的函数，并传递第一步中赋值给变量的匿名函数\n\
  \n```php\ngreet( $hello ) ;\n```\n\n![image](img/Image00089.jpg) 接下来，定义另一个普通函数，它有一个局部变量并返回一个引用该局部变量值的匿名函数\n\
  \n```php\nfunction meet () : callable\n{\n    $time = ‘morning’ ;\n    return function(\
  \ $name ) use( & $time )\n    { return “Good $time , $name !” ; } ;\n}\n```\n\n\
  ![image](img/Image00091.jpg) 将上一步定义的函数赋值给变量，然后调用该函数\n\n```php\n$meeting = meet ()\
  \ ;\necho $meeting ( ‘Susan’ ) ;\n?>\n```\n\n![image](img/Image00096.jpg) 将文档保存到网络服务器的\
  \ `/htdocs` 目录并命名为 `callback.php`，然后通过 HTTP 打开页面查看返回的值\n\n![image](img/Image00097.jpg)\n\
  \n![image](img/Image00006.jpg) 记得包含前缀以创建变量的引用。\n\n![image](img/Image00005.jpg) 注意到最后的调用获取了‘morning’字符串。\n\
  \n**总结**\n\n- 自定义函数允许将 PHP 脚本模块化为更容易理解和维护的部分\n- 函数名必须以字母或下划线开头，且不区分大小写\n- 函数通过在\
  \ `function` 关键字后指定名称、括号以及包含语句的大括号来定义\n- 参数的函数通过括号内包含逗号分隔的参数列表来定义\n- 函数定义可以通过在参数名之前包含数据类型来指定调用者传递的数据类型\n\
  - 参数数据通常按值传递，但如果参数名赋予 `&` 则可以按引用传递\n- 默认参数值可以通过对参数名赋值来可选地指定\n- 当参数名赋予 `...` 展开运算符时，可以将多个参数传递给该参数以创建一个数组\n\
  - 外部创建的变量具有全局作用域，但在函数内部除非使用 `global` 关键字无法访问\n- 内部创建的变量具有局部作用域，因此仅在该函数块内部可见\n- 局部变量在程序范围离开函数时会丢失值，但\
  \ `static` 变量会保留其值\n- `return` 关键字向调用者返回一个项目，且函数定义可以可选地指定返回数据类型\n- 匿名函数定义没有指定名称但是一个表达式，因此必须以\
  \ `;` 分号结束\n- `use` 关键字和 `&` 符号前缀允许匿名函数引用返回函数中的局部变量\n\n6\n\n处理字符串\n\n*本章演示了在 PHP\
  \ 脚本中处理文本字符串的各种方法。*\n\n- **比较字符**\n- **搜索文本**\n- **提取子字符串**\n- **更改大小**\n- **格式化字符串**\n\
  - **制作日期**\n- **编码实体**\n\n- **总结**\n\n**比较字符**\n\n\n\n\nPHP 提供了许多内置函数来对两个文本字符串进行比较。简单的\
  \ `strcmp()` 函数接受两个字符串参数进行比较，并根据结果返回三个整数值之一。当字符串完全匹配时，`strcmp()` 将返回 0。当第一个字符串参数大于第二个参数时，`strcmp()`\
  \ 返回 1，但当第一个字符串参数小于第二个参数时，`strcmp()` 返回 -1。\n\n![image](img/Image00019.jpg)\n\n\
  严格来说，`strcmp()` 返回的值将是正整数、零或负整数——但通常的值为 1、0 或 -1。\n\n`strncmp()` 函数的工作方式类似，但它额外接受第三个整数参数，用于指定从字符串开始要比较的字符数。\n\
  \n`strcmp()` 和 `strncmp()` 函数在比较字符串时对大写字母和小写字母赋予了不同的重要性。如果你倾向于忽略大小写，可以使用相应的辅助函数\
  \ `strcasecmp()` 和 `strncasecmp()` 来代替它们。\n\n为了理解这四个比较函数的结果，了解比较实际上是如何进行的是非常有用的。每个字符都有一个标准的数值“ASCII”值，其中小写字母\
  \ a-z 的范围是 97-122，大写字母 A-Z 的范围是 65-90。比较每个范围内的第一个值，我们发现“a”（97）大于“A”（65）。将这些作为参数提供给\
  \ `strcmp()` 函数，它将返回 1，因为第一个参数大于第二个参数。相反，如果你指定“A”（65）作为第一个参数，将“a”（97）作为第二个参数，那么\
  \ `strcmp()` 函数将返回 -1，因为第一个参数小于第二个参数。在字符串比较中，每个字符都按顺序进行比较，以确保包含相同字符但顺序不同的字符串不会被错误地视为相等。例如，比较“ABC”和“BAC”，第一个字符“A”（65）小于第一个字符“B”（66），因此\
  \ `strcmp()` 函数将返回 -1，因为第一个参数小于第二个参数。\n\n![image](img/Image00005.jpg)\n\nASCII 是美国信息交换代码（American\
  \ Standard Code for Information Exchange）的缩写，它规定了通用的字符编码方案。\n\n通过将字符作为 PHP `ord()`\
  \ 函数的参数可以找到任何字符的 ASCII 值，而将字符串作为 PHP `strlen()` 函数的参数可以找到字符串的长度。\n\n![image](img/Image00029.jpg)\n\
  \ncharacters.php\n\n![image](img/Image00098.jpg)  使用语句开始 PHP 脚本，初始化四个带有字符串值的变量\n\
  \n```php\n<?php\n$str1 = ‘PHP In Easy Steps’ ;\n$str2 = ‘PHP In Easy Steps’ ;\n\
  $str3 = ‘PHP Easy Steps’ ;\n$str4 = ‘php in easy steps’ ;\n```\n\n![image](img/Image00099.jpg)\
  \  接下来，添加语句比较这些字符串\n\n```php\necho “’$str1’ versus ‘$str2’ : “ .strcmp( $str1 ,\
  \ $str2 ). ’<br>’ ;\necho “’$str1’ versus ‘$str3’ : “ .strcmp( $str1 , $str3 ).\
  \ ’<br>’ ;\necho “’$str1’ versus ‘$str4’ : “ .strcmp( $str1 , $str4 ). ’<hr>’ ;\n\
  ```\n\n![image](img/Image00100.jpg)  现在，添加一个语句进行不区分大小写的比较\n\n```php\necho ‘Comparison\
  \ Ignoring Case :<br>’ ;\necho “’$str1’ versus ‘$str4’ : “ .strcasecmp( $str1 ,\
  \ $str4 ) ;\n```\n\n![image](img/Image00101.jpg)  最后，添加一个循环来计算并显示第一个字符串的总 ASCII\
  \ 代码值\n\n```php\n$total = 0 ;\nfor ( $i = 0 ; $i < strlen( $str1 ) ; $i ++ )\n{\n\
  \    $total += ord( $str1 [ $i ] ) ;\n}\necho “<hr>ASCII Total $str1 : $total ”\
  \ ;\n?>\n```\n\n![image](img/Image00102.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录并为 `characters.php`，然后通过\
  \ HTTP 打开页面查看字符串比较\n\n![image](img/Image00103.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n字符顺序是相关的，因为两个顺序不同的字符串的 ASCII 总和可能相等，但字符串并不匹配。\n\n### 搜索文本\n\nPHP 提供了许多内置函数来搜索字符串以找到指定的子字符串或单个字符。简单的\
  \ `strpos()` 函数接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strpos()`\
  \ 返回一个整数，该整数是字符串中第一个匹配项开始的字符索引位置。当未找到匹配时，`strpos()` 返回 `FALSE`。\n\n`strrpos()` 函数的工作方式类似，但它返回最后一个匹配开始的索引位置。`strstr()`\
  \ 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strstr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`strstr()` 返回 `NULL`。\n\n`strrpos()` 函数的工作方式类似，但它返回最后一个匹配开始的索引位置。`strrstr()`\
  \ 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串末尾顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrstr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`strrstr()` 返回 `NULL`。\n\n`strchr()` 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的单个字符。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strchr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`strchr()` 返回 `FALSE`。\n\n`strrchr()` 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的单个字符。它将从字符串末尾顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrchr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`strrchr()` 返回 `FALSE`。\n\n`strcasecmp()` 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的单个字符。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strcasecmp()`\
  \ 返回一个整数。当未找到匹配时，`strcasecmp()` 返回 `FALSE`。\n\n`strncasecmp()` 函数的工作方式类似，但它接受三个参数，指定要搜索的字符串、要查找的子字符串以及要比较的字符数。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strncasecmp()`\
  \ 返回一个整数。当未找到匹配时，`strncasecmp()` 返回 `FALSE`。\n\n`stristr()` 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`stristr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`stristr()` 返回 `NULL`。\n\n`strnistr()` 函数的工作方式类似，但它接受三个参数，指定要搜索的字符串、要查找的子字符串以及要搜索的字符数。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strnistr()`\
  \ 返回从第一次匹配开始的字符串剩余部分。当未找到匹配时，`strnistr()` 返回 `NULL`。\n\n`strpos()` 函数的工作方式类似，但它接受三个参数，指定要搜索的字符串、要查找的子字符串以及开始搜索的起始位置。它将从指定位置顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strpos()`\
  \ 返回一个整数，是字符串中第一个匹配项开始的字符索引位置。当未找到匹配时，`strpos()` 返回 `FALSE`。\n\n`strnpos()` 函数的工作方式类似，但它接受三个参数，指定要搜索的字符串、要查找的子字符串以及要搜索的字符数。它将从字符串开始顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strnpos()`\
  \ 返回一个整数，是字符串中第一个匹配项开始的字符索引位置。当未找到匹配时，`strnpos()` 返回 `FALSE`。\n\n`strrpos()` 函数的工作方式类似，但它接受两个参数，指定要搜索的字符串和要查找的子字符串。它将从字符串末尾顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrpos()`\
  \ 返回最后一个匹配开始的索引位置。当未找到匹配时，`strrpos()` 返回 `FALSE`。\n\n`strrnpos()` 函数的工作方式类似，但它接受三个参数，指定要搜索的字符串、要查找的子字符串以及要搜索的字符数。它将从字符串末尾顺序搜索以找到匹配。当找到匹配项时，搜索停止，`strrnpos()`\
  \ 返回最后一个匹配开始的索引位置。当未找到匹配时，`strrnpos()` 返回 `FALSE`。\n\n\n\n\n可以通过将字符串以及子字符串在字符串中的索引位置作为\
  \ `substr()` 函数的参数，从字符串中提取子字符串。可选的第三参数参数指定子字符串的长度。你可以使用 `substr_replace()` 函数替换子字符串，通过指定字符串、子字符串、索引位置和长度参数。可以使用\
  \ `substr_count()` 函数找到子字符串在字符串中出现的次数：\n\n![image](img/Image00029.jpg)\n\nsubstring.php\n\
  \n![image](img/Image00098.jpg)  开始一个 PHP 脚本，使用语句初始化一个带有字符串值的变量并统计子字符串\n\n```php\n\
  <?php\n$str = ‘SQL in easy steps features SQL queries’ ;\necho “’ $str ’<br>’SQL’\
  \ Count: “ .substr_count( $str , ‘SQL’ ) ;\n```\n\n![image](img/Image00099.jpg)\
  \  接下来，添加语句提取两个子字符串\n\n```php\necho ‘<hr>Index 27 : ‘ .substr( $str , 27 ) ;\necho\
  \ ‘<hr>Index 4 Length 13 : ‘ .substr( $str , 4 , 13 ) ;\n```\n\n![image](img/Image00100.jpg)\
  \  现在，添加语句初始化一个带有字符串的变量\n\n```php\n$sub = ‘PHP & MySQL’ ;\n```\n\n![image](img/Image00101.jpg)\
  \  最后，添加语句用新字符串值替换子字符串并显示修改后的字符串\n\n```php\n$str = substr_replace( $str , $sub ,\
  \ 0 , 3 ) ;\necho “<hr>’ $str ’” ;\n?>\n```\n\n![image](img/Image00102.jpg)  将文档保存到\
  \ 浏览器的 `/htdocs` 目录并命名为 `substring.php`，然后通过 HTTP 打开页面查看提取的子字符串和修改后的字符串\n\n![image](img/Image00105.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n`substr_replace()` 中的长度参数指定了要替换的子字符串的长度。在这个示例中，它是\
  \ `3` —— 用于将三个字符 ‘SQL’ 替换为更长的字符串。\n\n### 修改大小写\n\nPHP 提供了相应的函数来轻松修改指定字符串参数的大小写。`strtolower()`\
  \ 函数将所有字符转换为小写，而 `strtoupper()` 将它们全部转换为大写。此外，`ucfirst()` 函数仅使字符串的第一个字符大写，而 `ucword()`\
  \ 函数则将字符串中每个单词的第一个字母大大写：\n\n![image](img/Image00029.jpg)\n\ncase.php\n\n![image](img/Image00098.jpg)\
  \  开始一个 PHP 脚本，使用语句初始化一个带有字符串的变量并显示其值\n\n```php\n<?php\n$str = “C++ Programming\
  \ in easy steps” ;\necho “Original String : ‘ $str ’ <hr>” ;\n```\n\n![image](img/Image00099.jpg)\
  \  接下来，添加语句显示小写版本\n\n```php\n$ver = strtolower( $str ) ;\necho “Lowercase String\
  \ : ‘ $ver ’ <br>” ;\n```\n\n![image](img/Image00100.jpg)  现在，添加语句显示大写版本\n\n```php\n\
  $ver = strtoupper( $str ) ;\necho “Uppercase String : ‘ $ver ’ <hr>” ;\n```\n\n\
  ![image](img/Image00101.jpg)  最后，添加语句显示首字母大写版本和单词首字母大写版本\n\n```php\n$ver = ucfirst(\
  \ strtolower( $str ) ) ;\necho “Uppercase First String Character : ‘ $ver ’ <br>\
  \ ;\necho ‘Uppercase First Word Character : ‘ .ucwords( $ver ) ;\n?>\n```\n\n![image](img/Image00102.jpg)\
  \  将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `case.php`，然后通过 HTTP 打开页面查看大小写转换的结果\n\n![image](img/Image00102.jpg)\n\
  \n`ucfirst()` 函数仅使字符串的第一个字母大写，而 `ucword()` 函数将字符串中每个单词的第一个字母大写：\n\n![image](img/Image00029.jpg)\n\
  \n`strtolower()` 函数将所有字符转换为小写，而 `strtoupper()` 将它们全部转换为大写。\n\n### 格式化字符串\n\nPHP\
  \ 提供了内置函数来方便地通过操作字符串来格式化字符串。`sprintf()` 函数可以格式字符串。`strrev()` 函数接受字符串并返回反转后的字符串。\n\
  \n`str_repeat()` 函数接受字符串，以及重复的次数，返回重复后的字符串。`str_pad()` 函数接受字符串、目标长度、填充字符以及填充方向，返回填充后的字符串。\n\
  \n`trim()` 函数可以接受字符串并移除其两侧的空白字符。同样，`ltrim()` 用于移除字符串开头的空白字符，而 `rtrim()` 则用于移除字符串结尾的空白字符。\n\
  \n`implode()` 和 `explode()` 函数可以用于将数组转换为字符串以及字符串转换为数组。例如，`explode()` 可以根据分隔符分割字符串。`implode()`\
  \ 则可以将多个数组元素合并成单个字符串。\n\n![image](img/Image0029.jpg)\n\nformat.php\n\n![image](img/Image0098.jpg)\
  \  开始一个 PHP 脚本，使用语句初始化一个字符串变量并显示其值\n\n```php\n<?php\n$str = ‘| String |’ ;\necho\
  \ “Original String : $str ” ;\n```\n\n![image](img/Image00099.jpg)  接下来，添加语句显示反转、重复和修剪后的字符串版本\n\
  \n```php\necho ‘<hr>Reversed String : ‘ .strrev( $str ) ;\necho ‘<hr>Repeated String\
  \ : ’ .str_repeat( $str , 3 ) ;\necho ‘<hr>Trimmed String : ‘ .trim( $str , ‘|’\
  \ ;\n```\n\n![image](img/Image00100.jpg)  现在，添加语句显示带有星号填充的 30 字符字符串版本\n\n```php\n\
  $pad = str_pad( $str , 30 , ‘*’ , STR_PAD_LEFT ) ;\necho “<hr>Padded String : $pad\
  \ ” ;\n```\n\n![image](img/Image00101.jpg)  最后，添加语句按空格分割字符串并用省略号显示每个独立部分\n\n```php\n\
  echo ‘<hr>Split String : ‘ ;\n$token = strtok( $str , ‘’ );\nwhile ( $token )\n\
  {\necho “ $token ... “ ; $token = strtok( ‘’ ) ;\n}\n?>\n```\n\n\n\n\n| **F** |\
  \ 月份全称 | February |\n| **M** | 三字母缩写的月份 | Feb |\n| **j** | 一位或两位数的日期 | 4 |\n| **d**\
  \ | 两位数的日期 | 04 |\n| **l** | 星期全称 | Monday |\n| **D** | 三字母缩写的星期 | Mon |\n| **S**\
  \ | 两个字母的序后缀 | th |\n| **H** | 24 小时制的小时 | 14 |\n| **i** | 分钟 | 45 |\n| **s** |\
  \ 秒 | 30 |\n| **a** | 上午或下午 | am |\n\n![image](img/Image00019.jpg)\n\n星期的全称选项是一个小写的“L”。\n\
  \n![image](img/Image00005.jpg)\n\n你可以在 PHP 官方文档在线手册 `[php.net/manual](http://www.php.net/manual)`\
  \ 中发现更多 `date()` 函数的选项。\n\n默认情况下，时区设置为协调世界时 (UTC)，但你可以通过将时区作为参数传递给 `date_default_timezone_set()`\
  \ 函数来设置自己的时区，并使用 `date_default_timezone_get()` 查看当前设置的时区。\n\n你还可以使用智能的 `strtotime()`\
  \ 函数创建自己的时间戳。它可以接受日期字符串参数，并返回一个时间戳，该时间戳可以作为第二个参数提供 `date()` 函数。`strtotime()` 的参数可以是普通文本日期，例如“July\
  \ 4, 2017”。此外，你还可以指定如“yesterday”、“+3months”或“next Wednesday”之类的参数，`strtotime()`\
  \ 函数将尝试解析并返回一个相应的时间戳。\n\n![image](img/Image00029.jpg)\n\ndate.php\n\n![image](img/Image00098.jpg)\
  \ 开始一个 PHP 脚本，使用语句显示当前日期、星期、时间以及当前默认时区\n\n```php\n<?php\necho ‘Date : ‘ .date( ‘jS\
  \ F Y’ ). ’<br> ;\necho ‘Day : ‘ .date( ‘l’ ). ’<br> ;\necho ‘Time : ‘ .date( ‘h:i:s\
  \ a’ ). ’<br> ;\necho ‘Timezone : ‘ .date_default_timezone_get(). ’<hr> ;\n```\n\
  \n![image](img/Image00099.jpg) 接下来，添加语句更改默认时区并显示确认，然后显示该处的当前时间\n\n```php\ndate_default_timezone_set(\
  \ ‘America/New_York’ ) ;\necho ‘Timezone now : ‘ .date_default_timezone_get() ;\n\
  echo ‘<br>Time now : ‘ .date( ‘h:i:s a’ ). ’<hr> ;\n```\n\n![image](img/Image00100.jpg)\
  \ 现在，添加语句为明天创建一个时间戳，然后显示它的星期名称和日期\n\n```php\n$d = strtotime( ‘tomorrow’ ) ;\necho\
  \ ‘Tomorrow : ‘ .date( ‘l, jS F Y’ , $d ). ’<br> ;\n```\n\n![image](img/Image00101.jpg)\
  \ 最后，添加语句为一个难忘的日期创建一个时间戳，然后显示它的月份和日期数字\n\n```php\n$d = strtotime( ‘July 11, 1994’\
  \ ) ;\necho ‘David\\’s Birthday : ‘ .date( ‘F jS’ , $d ) ;\n?>\n```\n\n![image](img/Image00102.jpg)\
  \ 将文档保存在你 Web 服务器的 `/htdocs` 目录下的 `date.php` 中，然后通过 HTTP 打开页面以查看由选项格式化的日期字符串。\n\n\
  ![image](img/Image00108.jpg)\n\n![image](img/Image00005.jpg)\n\n注意，你可以在格式字符串中包含分隔符如\
  \ `:` 和 `/`。\n\n![image](img/Image00006.jpg)\n\n有些国家喜欢 M/D/Y 的日期顺序，而另一些国家喜欢 D/M/Y，因此你可以选择喜欢的日期格式。\n\
  \n### 实体编码\n\n有两个 PHP 函数可以编码 HTML 代码，使所有具有特殊意义的字符或异常字符被“实体”替换。`htmlentities()` 函数编码以下所有字符，每个字符都有对应的实体：\n\
  \n![image](img/Image00109.jpg)\n\n![image](img/Image00005.jpg)\n\n调用带有常量参数 `HTML_ENTITIES`\
  \ 或 `HTML_SPECIALCHARS` 的 PHP 函数 `get_html_translation_table()` 以返回所有表示字符的数组。\n\n\
  除非你担心非英语字符，否则通常建议使用另一种 `htmlspecialchars()` 函数仅编码具有特殊 HTML 意义的字符：\n\n- `&` 符号号——变成\
  \ `&amp;`\n- `“` 双引号——变成 `&quot;`\n- `‘` 单引号——变成 `&#039;`\n- `<` 小号——变成 `&lt;`\n\
  - `>` 大号——变成 `&gt;`\n\n使用 PHP 编码 HTML 片段的一个很好的原因是防止恶意 JavaScript 代码被浏览器意外执行。将 HTML\
  \ 标签编码为实体可以确保 `<script>` 标签不会被识别，因此其 JavaScript 代码内容不会被执行：\n\n![image](img/Image00029.jpg)\n\
  \ndate.php\n\n![image](img/Image00098.jpg) 开始一个 PHP 脚本，使用语句显示当前日期、星期、时间以及当前默认时区\n\
  \n```php\n<?php\necho ‘Date : ‘ .date( ‘jS F Y’ ). ’<br> ;\necho ‘Day : ‘ .date(\
  \ ‘l’ ). ’<br> ;\necho ‘Time : ‘ .date( ‘h:i:s a’ ). ’<br> ;\necho ‘Timezone : ‘\
  \ .date_default_timezone_get(). ’<hr> ;\n```\n\n![image](img/Image00099.jpg) 接下来，添加语句更改默认时区并显示确认，然后显示该处的当前时间\n\
  \n```php\ndate_default_timezone_set( ‘America/New_York’ ) ;\necho ‘Timezone now\
  \ : ‘ .date_default_timezone_get() ;\necho ‘<br>Time now : ‘ .date( ‘h:i:s a’ ).\
  \ ’<hr> ;\n```\n\n![image](img/Image00100.jpg) 现在，添加语句为明天创建一个时间戳，然后显示它的星期名称和日期\n\
  \n```php\n$d = strtotime( ‘tomorrow’ ) ;\necho ‘Tomorrow : ‘ .date( ‘l, jS F Y’\
  \ , $d ). ’<br> ;\n```\n\n![image](img/Image00101.jpg) 最后，添加语句为一个难忘的日期创建一个时间戳，然后显示它的月份和日期数字\n\
  \n```php\n$d = strtotime( ‘July 11, 1994’ ) ;\necho ‘David\\’s Birthday : ‘ .date(\
  \ ‘F jS’ , $d ) ;\n?>\n```\n\n![image](img/Image00102.jpg) 将文档保存在你 Web 服务器的 `/htdocs`\
  \ 目录下的 `date.php` 中，然后通过 HTTP 打开页面以查看由选项格式化的日期字符串。\n\n![image](img/Image00108.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n注意，你可以在格式字符串中包含分隔符如 `:` 和 `/`。\n\n![image](img/Image00006.jpg)\n\
  \n有些国家喜欢 M/D/Y 的日期顺序，而另一些国家喜欢 D/M/Y，因此你可以选择喜欢的日期格式。\n\n### 实体编码\n\n有两个 PHP 函数可以编码\
  \ HTML 代码，使所有具有特殊意义的字符或异常字符被“实体”替换。`htmlentities()` 函数编码以下所有字符，每个字符都有对应的实体：\n\n\
  ![image](img/Image00109.jpg)\n\n![image](img/Image00005.jpg)\n\n调用带有常量参数 `HTML_ENTITIES`\
  \ 或 `HTML_SPECIALCHARS` 的 PHP 函数 `get_html_translation_table()` 以返回所有表示字符的数组。\n\n\
  除非你担心非英语字符，否则通常建议使用另一种 `htmlspecialchars()` 函数仅编码具有特殊 HTML 意义的字符：\n\n- `&` 符号号——变成\
  \ `&amp;`\n- `“` 双引号——变成 `&quot;`\n- `‘` 单引号——变成 `&#039;`\n- `<` 小号——变成 `&lt;`\n\
  - `>` 大号——变成 `&gt;`\n\n使用 PHP 编码 HTML 片段的一个很好的原因是防止恶意 JavaScript 代码被浏览器意外执行。将 HTML\
  \ 标签编码为实体可以确保 `<script>` 标签不会被识别，因此其 JavaScript 代码内容不会被执行：\n\n\n\n\n\n类（class）是一种可以在单个实体中包含变量和函数的数据结构。这些统称为它的“成员”（members）——变量被称为类的“属性”（properties），函数被称为类的“方法”（methods）。\n\
  \n![image](img/Image00113.jpg)\n\n从类外部访问类成员的方法由类声明中的“访问修饰符”（access specifiers）控制。通常，这些修饰符会拒绝对类变量的访问，但允许访问可以在这些变量成员中存储和检索数据的方法。这种“数据隐藏”技术确保了存储的数据被安全地封装在类变量成员内部，是面向对象编程（OOP）的第一原则。\n\
  \n类声明以 `class` 关键字开始，后面跟着空格，然后是程序员指定的名称——遵循通常的 PHP 命名规范但以大写字母开头。接下来是类属性的声明，然后是类方法的声明。这些看起来和普通的变量和函数声明相似，但每个声明都应该以访问修饰符开头。类的声明语法如下：\n\
  \n```php\nclass ClassName\n{\n    access-specifier $var1, $var2, $var3;\n    access-specifier\
  \ functionName1($arg1, $arg2, $arg3)\n    {\n        statements-to-execute;\n  \
  \  }\n}\n```\n\n![image](img/Image00005.jpg)\n\n按照习惯，类名以大写字母开头，对象名从小写字母开头。\n\n访问修饰符可以是\
  \ `public`、`private` 或 `protected` 关键字之一，用于指定所列成员的访问权限：\n\n*   `public` 成员可以在类可见的任何地方被访问\n\
  *   `private` 成员仅对定义它的所在类中的其他成员可见\n*   `protected` 成员仅对同类中的其他成员以及该类派生类的成员可见\n\n\
  ![image](img/Image00005.jpg)\n\n派生类将在本章稍后部分介绍——请参见此处。\n\n任何现实世界中的对象都可以通过它的属性和动作来定义。例如，狗有年龄、重量和颜色等属性，以及它可以执行的动作如吠叫。PHP\
  \ 中的类机制提供了一种在脚本中创建虚拟狗对象的方法，其中类属性可以代表它的属性，类方法可以代表它的动作：\n\n```php\nclass Dog\n{\n\
  \    private $age;\n    private $weight;\n    private $color;\n    public function\
  \ bark() { echo ‘WOOF!’ ; }\n    // 在此处添加用于在属性中存储数据的方法。\n    // 在此处添加用于从属性检索数据的方法。\n\
  }\n```\n\n![image](img/Image00006.jpg)\n\n虽然 PHP 脚本类不能完美模拟真实世界的对象，但目标是将所有相关的属性和动作作为类属性和方法封装起来。\n\
  \n重要的是，类声明只定义了一个数据结构——为了创建一个对象，你必须声明该数据结构的一个“实例”（instance）。这通过使用 `new` 关键字将类的拷贝赋值给变量来实现，如下所示：\n\
  \n```php\n$fido = new Dog(); // 创建一个名为“fido”的实例\n// 这是程序员定义的\n// “Dog”数据结构。\n```\n\
  \n实例对象是原始类数据结构的一个工作副本，因此保留了它的所有特性。由于示例中的方法被声明为 `public`，因此它在类声明之外脚本中是可见的。这意味着可以使用特殊的\
  \ `->` 对象运算符来调用实例拷贝的方法，如下所示：\n\n```php\n$fido->bark(); // 输出 WOOF!\n```\n\n`->`\
  \ 对象运算符可以用于引用任何可见的类成员，但上述示例中的变量属性被声明为 `private`，因此被封装在对象内部，无法直接访问。PHP 编程中的封装原则描述了在类成员中将数据和功能组合在一起——在这个\
  \ `Dog` 类中，这些就是年龄、重量、颜色属性和 `bark`（吠叫）动作。\n\n![image](img/Image00019.jpg)\n\n注意，在创建实例对象的语句中，必须在类名后添加括号。\n\
  \n**创建对象**\n\n为了从类的私有成员中分配和检索数据，必须向类添加特殊的 `public` 访问器方法。这些是用于分配数据的“setter”（设置）方法和用于检索数据的“getter”（获取）方法。访问器方法通常以它们处理的变量命名，并将首字母大写，并分别以“set”或“get”作为前缀。例如，处理\
  \ `age` 变量的访问器方法可以命名为 `setAge()` 和 `getAge()`。\n\nsetter 和 getter 方法可以使用特殊的 `$this`\
  \ “伪变量”后跟 `->` 对象运算符和属性名来引用同类中的成员。例如，使用 `$this->age` 来引用年龄属性：\n\n![image](img/Image00029.jpg)\n\
  \nobject.php\n\n![image](img/Image00114.jpg) 以一个声明名为“Dog”的类的语句开始 PHP 脚本\n\n```php\n\
  <?php\nclass Dog\n{\n    // 在此处插入成员（步骤 2-5）。\n}\n```\n\n![image](img/Image00115.jpg)\
  \ 在类声明的大括号之间\n\n```php\nclass Dog\n{\n    private $age;\n    private $weight;\n\
  \    private $color;\n\n    public function bark() { echo ‘WOOF!’ ; }\n\n    public\
  \ function setAge($yrs) {\n        $this->age = $yrs;\n    }\n\n    public function\
  \ getAge() {\n        return $this->age;\n    }\n\n    public function setWeight($lbs)\
  \ {\n        $this->weight = $lbs;\n    }\n\n    public function getWeight() {\n\
  \        return $this->weight;\n    }\n\n    public function setColor($fur) {\n\
  \        $this->color = $fur;\n    }\n\n    public function getColor() {\n     \
  \   return $this->color;\n    }\n}\n```\n\n![image](img/Image00115.jpg) 添加 public\
  \ setter 方法为私有变量赋值\n\n```php\n    public function setAge($yrs) {\n        $this->age\
  \ = $yrs;\n    }\n\n    public function setWeight($lbs) {\n        $this->weight\
  \ = $lbs;\n    }\n\n    public function setColor($fur) {\n        $this->color =\
  \ $fur;\n    }\n```\n\n![image](img/Image00116.jpg) 添加 public getter 方法从私有变量检索值\n\
  \n```php\n    public function getAge() {\n        return $this->age;\n    }\n\n\
  \    public function getWeight() {\n        return $this->weight;\n    }\n\n   \
  \ public function getColor() {\n        return $this->color;\n    }\n```\n\n![image](img/Image00005.jpg)\
  \ 在类声明中，注意所有方法都是公共的，所有变量都是私有的。\n\n![image](img/Image00019.jpg) 在 Dog 声明之后，声明一个类的实例\n\
  \n```php\n$fido = new Dog();\n```\n\n![image](img/Image00020.jpg) Fido\n\n![image](img/Image00021.jpg)\
  \ 调用每个 setter 方法来分配数据\n\n```php\n$fido->setAge(3);\n$fido->setWeight(15);\n$fido->setColor('brown');\n\
  ```\n\n![image](img/Image00022.jpg) 调用每个 getter 方法来检索分配的值\n\n```php\necho ‘Fido\
  \ is a ‘ . $fido->getColor() . ‘ dog<br>’;\necho ‘Fido is ‘ . $fido->getAge() .\
  \ ‘ years old<br>’;\necho ‘Fido weighs ‘ . $fido->getWeight() . ‘ pounds<br>’;\n\
  ```\n\n![image](img/Image00023.jpg) 现在，对普通输出方法进行调用\n\n```php\n$fido->bark();\n?>\n\
  ```\n\n![image](img/Image00024.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `object.php`，然后通过\
  \ HTTP 打开页面查看类属性输出和方法调用\n\n![image](img/Image00025.jpg)\n\nPHP 7 的一项新功能是可以创建具有简单功能且没有的“匿名类”。例如，`$util\
  \ = new class { public function log($s) { echo $s ; } } ;`，它可以通过 `$util->log( ‘Data’\
  \ ) ;` 进行调用。\n\n![image](img/Image00003.jpg) 这个 **object.php** 脚本将在接几页中随着新功能的引入进行修改。\n\
  \n**初始化成员**\n\n程序只需通过声明类的多个实例即可轻松创建多个对象，并且每个对象可以通过其 setter 方法分配单独值来拥有独特的属性。\n\n\n\
  \n\n将多个设置方法（setter methods）合并为一个接受每个私有变量参数的单一方法通常非常方便。这意味着在程序中可以使用一条语句为所有值赋值，但该方法内部将包含多个语句。\n\
  \n可选的是，每个参数可以为传递的每个参数指定允许的数据类型，并且还可以方便地为每个参数指定默认值：\n\n![image](img/Image00029.jpg)\n\
  \n`initializer.php`\n\n![image](img/Image00114.jpg) 将上一个示例“object.php”的副本重命名为新程序\
  \ `initializer.php`\n\n![image](img/Image00115.jpg) 在 `Dog` 类声明中，将三个设置方法替换为单一的组合设置方法，并指定参数的数据类型和默认值\n\
  \n```php\npublic function setValues( int $yrs = 2 , int $lbs = 8 , string $fur =\
  \ ‘black’ )\n{\n    // 在此处插入语句。\n}\n```\n\n![image](img/Image00116.jpg) 在方法定义块中，插入三条语句，将传递参数的值赋值给类变量\n\
  \n```php\n$this-> age = $yrs ;\n$this-> weight = $lbs ;\n$this-> color = $fur ;\n\
  ```\n\n![image](img/Image00117.jpg) 修改类定义后，将对三个设置方法的调用替换为对组合设置方法的单一调用——传递三个参数\n\n\
  ```php\n$fido -> setValues ( 3 , 15 , ‘brown’ ) ;\n```\n\n![image](img/Image00118.jpg)\
  \ 声明名为“pooch”的 `Dog` 类的第二个实例\n\n```php\n$pooch = new Dog () ;\n```\n\n![image](img/Image00119.jpg)\
  \ 为组合设置方法添加第二次调用——为新对象传递三个参数\n\n```php\n$pooch -> setValues ( 4 , 18 , ‘gray’ )\
  \ ;\n```\n\n![image](img/Image00005.jpg) 尝试向初始化方法传递错误的数据类型，以查看是否发生类型错误。\n\n![image](img/Image00121.jpg)\
  \ 添加调用每个获取方法（getter method）的语句，以检索已赋值的值\n\n```php\necho ‘<hr>Pooch: ‘ . $pooch ->\
  \ getAge (). ’yrs’ ;\necho $pooch -> getWeight (). ’lbs ’ . $pooch -> getColor ()\
  \ ;\n```\n\n![image](img/Image00122.jpg) 添加第二次对普通输出方法的调用\n\n```php\n$pooch -> bark\
  \ () ;\n```\n\n![image](img/Image00123.jpg) 现在，声明名为“rover”的 `Dog` 类的第三个实例\n\n```php\n\
  $rover = new Dog () ;\n```\n\n![image](img/Image00124.jpg) 为组合设置方法添加第三次调用——这次为新对象未传递任何参数\n\
  \n```php\n$rover -> setValues ( ) ;\n```\n\n![image](img/Image00126.jpg) 添加调用每个获取方法的语句，以检索已赋值的值（这些值是指定的默认值）\n\
  \n```php\necho ‘<hr>Rover: ‘ . $rover -> getAge (). ’yrs’ ;\necho $rover -> getWeight\
  \ (). ’lbs ’ . $rover -> getColor () ;\n```\n\n![image](img/Image00127.jpg) 添加第三次对普通输出方法的调用\n\
  \n```php\n$rover -> bark () ;\n```\n\n![image](img/Image00128.jpg) 将文档保存到网络服务器的\
  \ `/htdocs` 目录并为 `initializer.php`，然后通过 HTTP 打开页面查看组合初始化方法设置的输出\n\n![image](img/Image00129.jpg)\n\
  \n![image](img/Image00130.jpg)\n\n![image](img/Image00006.jpg) 你仍然必须在此处调用初始化方法，以便在不传递参数时将默认值分配给类变量。\n\
  \n### 使用构造函数\n\n类变量成员可以通过特殊的“构造函数”方法初始化，该方法每当创建类的实例时就会被调用。构造方法始终始终命名为 `__construct()`，并可以接受参数来设置类变量的初始值。\n\
  \n![image](img/Image00131.jpg)\n\n构造方法有一个配套的“析构方法”（destructor method）——它每当类的实例被销毁时就会被调用。析构方法始终命名为\
  \ `__destruct()`。\n\n构造方法和析构方法没有返回值且是自动调用的——它们不能被显式调用，因此它们的声明不需要访问修符。\n\n初始化类变量的值在创建对象的语句中传递给构造方法，位于对象名称后的括号内：\n\
  \n![image](img/Image00029.jpg)\n\n`constructor.php`\n\n![image](img/Image00114.jpg)\
  \ 将上一个示例“initializer.php”的副本重命名为新程序 `constructor.php`\n\n![image](img/Image00115.jpg)\
  \ 在 `Dog` 类声明中，将 `setValues` 方法替换为此构造函数\n\n```php\nfunction __construct( int $yrs\
  \ = 2 , int $lbs = 8 , string $fur = ‘black’ )\n{\n    $this-> age = $yrs ;\n  \
  \  $this-> weight = $lbs ;\n    $this-> color = $fur ;\n}\n```\n\n![image](img/Image00116.jpg)\
  \ 现在，添加一个简单的析构方法\n\n```php\nfunction __destruct() { echo ‘<hr>Object Destroyed.’\
  \ ; }\n```\n\n![image](img/Image00117.jpg) 在 `Dog` 类声明后，编辑创建 `fido` 的语句：\n\n```php\n\
  $fido = new Dog ( 3 , 15 , ‘brown’ ) ;\n```\n\n![image](img/Image00118.jpg) 同样，编辑创建\
  \ `pooch` 的语句：\n\n```php\n$pooch = new Dog ( 4 , 18 , ‘gray’ ) ;\n```\n\n![image](img/Image00119.jpg)\
  \ 类定义也称为“实现”。\n\n![image](img/Image00120.jpg) 同时编辑创建 `rover` 的语句：\n\n```php\n$rover\
  \ = new Dog () ;\n```\n\n![image](img/Image00121.jpg) 虽然通过构造函数设置初始值，但随后可以设置方法。PHP\
  \ 提供了几个函数来查询类，如 `class_exists()`、`method_exists(class, method)` 和 `property_exists(class,\
  \ property)`，它们在成功时返回 `TRUE`。你还可以使用 `get_class_vars()` 和 `get_class_methods()` 获取类列表以查看“可见”成员：\n\
  \n![image](img/Image00122.jpg)\n```php\n$items = get_class_vars( ‘Dog’ );\necho\
  \ ‘<br>Dog variables : .count($items);\n```\n\n![image](img/Image00123.jpg)\n```php\n\
  echo ‘<br>Dog methods :’ ;\n$items = get_class_methods( ‘Dog’ );\nforeach( $items\
  \ as $item ) { echo $item ; }\n```\n\n![image](img/Image00124.jpg) 将文档保存到网络服务器的\
  \ `/htdocs` 目录并为 `constructor.php`，然后通过 HTTP 打开页面查看输出\n\n![image](img/Image00125.jpg)\
  \ 可见变量的数量为 0。临时将它们的访问修符改为 `public`，查看其变为 3。\n\n### 属性继承\n\nPHP 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类“派生”（derived）。重要的是，派生类会继承其所派生的父类（基类）的成员——除了它自身的成员。\n\
  \n从基类继承成员的能力允许创建共享某些属性的派生类，这些属性是在基类中定义的。例如，一个“Polygon”基类可以定义所有多边形通用的宽度和高度属性。“矩形”和“三角形”类可以从多边形类派生——继承宽度和高度属性，加上它们定义独特特征的自身成员。\n\
  \n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类声明在类名后添加 `extends` 关键字，随后是其所派生的类名：\n\n![image](img/Image00126.jpg)\n\
  \n`inheritance.php`\n\n![image](img/Image00127.jpg) 开始 PHP 脚本，声明一个名为“Polygon”的基类，该类具有两个由构造函数初始化的私有变量，并有两个公共的获取方法\n\
  \n\n\n\n\n```php\n<?php\n\nclass Polygon\n{\n    private $width , $height ;\n  \
  \  function construct( int $w = 4 , int $h = 5 )\n    {\n        $this-> width =\
  \ $w ;\n        $this-> height = $h ;\n    }\n    public function getWidth () {\
  \ return $this-> width ; }\n    public function getHeight () { return $this-> height\
  \ ; }\n}\n```\n![image](img/Image00115.jpg) 在 `Polygon` 类之后，声明一个派自 `Polygon` 类的“Rectangle”类并添加一个独特方法\n\
  \n```php\nclass Rectangle extends Polygon\n{\n    public function area ()\n    {\n\
  \        return ( $this-> getWidth () * $this-> getHeight () ) ;\n    }\n}\n```\n\
  \n![image](img/Image00116.jpg) 在 `Rectangle` 类之后，声明一个派自 `Polygon` 类的“Triangle”类并添加一个独特方法\n\
  \n```php\nclass Triangle extends Polygon\n{\n    public function area ()\n    {\n\
  \        return ( $this-> getWidth () * $this-> getHeight () / 2 ) ;\n    }\n}\n\
  ```\n\n![image](img/Image00117.jpg) 在 `Triangle` 类之后，添加两条语句使用默认值创建每个派生类的实例\n\n```php\n\
  $rect = new Rectangle () ;\n$trio = new Triangle () ;\n```\n\n![image](img/Image00118.jpg)\
  \ 最后，添加两条语句输出由每个派生类的独特方法所返回的值\n\n```php\necho ‘Rectangle Area : ‘ . $rect -> area\
  \ (). ’<hr>’ ;\necho ‘Triangle Area : ‘ . $trio -> area () ;\n?>\n```\n\n![image](img/Image00119.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录中并命名为 `inheritance.php`，然后通过 HTTP 打开页面以查看继承成员的输出\n\
  \n![image](img/Image00135.jpg)\n\n![image](img/Image00019.jpg)\n\n不要混淆类实例和派生类——实例是类的拷贝，而派生类是一个继承其所派生基类属性的新类。\n\
  \n![image](img/Image00006.jpg)\n\n在 PHP 中，派生类始终依赖于单个基类——不支持多重继承。\n\n## 拥抱多态\n\n\
  面向对象编程 (OOP) 的三个基石是封装、继承和多态。在之前的页面中，我们已经看到数据如何被封装在 PHP 类中，以及派生类如何继承其基类的属性，因此现在我们可以探索最后一个基石级原则：多态。\n\
  \n![image](img/Image00136.jpg)\n\n“多态”一词（源自希腊语，意为“多种形式”）描述了根据上下文为实体分配不同含义或目的的能力。例如，在现实世界中，每个人都知道如何使用推按钮（实体）——只需对其施加压力即可。然而，该按钮的作用取决于连接到它的东西（上下文），但结果不会影响该按钮的使用方式。\n\
  \n在面向对象编程的世界中，多态允许类在共享公共接口的同时具有不同的功能。接口不需要知道它正在使用哪个类，因为它们就像现实世界中的按钮一样，使用方式都相同，但可以产生不同的上下文结果。以此这样拥抱多态使程序员能够创建可以根据需求而非条件测试来选择的可交换对象。\n\
  \n![image]PHP 接口类似于类，但使用 `interface` 关键字声明，并且只能包含方法定义，而不包含任何要执行的方法语句，如下：\n\n```php\n\
  interface InterfaceName\n{\n    // 这里仅包含方法定义。\n}\n```\n\n![image](img/Image00006.jpg)\
  \ 接口声明中的方法定义也可以指定参数。\n\n实现接口的每个类必须实现其定义的所有方法，并指定其要执行的语句。通过在声明中包含 `implements` 关键字和接口名称将类连接到接口，如下：\n\
  \n```php\nclass ClassName implements InterfaceName\n{\n    // 方法实现在这里。\n}\n```\n\
  \n可以通过添加一个接口和一个单函数来修改之前的示例以拥抱多态。\n\n![image](img/Image00029.jpg)\n\npolymorphism.php\n\
  \n![image](img/Image00114.jpg) 将上一个示例的副本“inheritance.php”重命名为新程序“polymorphism.php”\n\
  \n![image](img/Image00115.jpg) 声明一个名为“Shape”的接口，它包含已经在 Rectangle 和 Triangle 类中实现的方法定义\n\
  \n```php\ninterface Shape { public function area () ; }\n```\n\n![image](img/Image00116.jpg)\
  \ 编辑 Rectangle 和 Triangle 类声明的第一行——将它们与接口关联\n\n```php\nclass Rectangle extends Polygon\
  \ implements Shape\nclass Triangle extends Polygon implements Shape\n```\n\n![image](img/Image00117.jpg)\
  \ 在类块之后，添加一个接受 Shape 类型参数并调用其定义方法的函数\n\n```php\nfunction getArea ( Shape $shape\
  \ )\n{ return $shape -> area () ; }\n```\n\n![image](img/Image00118.jpg) 修改创建每个派生类实例的两条语句——以传入参数值\n\
  \n```php\n$rect = new Rectangle ( 8 , 10 ) ;\n$trio = new Triangle ( 8 , 10 ) ;\n\
  ```\n\n```php\necho ‘Rectangle Area : ‘ . $rect -> area (). ’<hr>’ ;\necho ‘Triangle\
  \ Area : ‘ . $trio -> area () ;\n```\n\n![image](img/Image00119.jpg) 将文档保存到 Web\
  \ 服务器的 `/htdocs` 目录中并命名为 `inheritance.php`，然后通过 HTTP 打开页面以查看继承成员的输出\n\n![image](img/Image00135.jpg)\n\
  \n![image](img/Image00019.jpg)\n\n发生了什么？\n\n`getArea()` 函数传递了一个实例作为参数。\n\n`getArea()`\
  \ 函数调用了接口的方法。\n\n输出由方法的实现返回。\n\n## 总结\n\n- PHP 类是一个可以包含变量和函数的数据结构\n- 类使用 `class`\
  \ 关键字声明，可以包含成员变量属性和成员函数方法\n- 对类的访问由 `public`、`private` 或 `protected` 访问修饰符控制\n-\
  \ 通过将变量属性声明为 `private` 来实现封装，使其值只能通过 `public` 方法访问\n- 为了创建对象，必须使用 `new` 关键字声明 `class`\
  \ 的实例\n- 特殊的 `->` 对象运算符可以引用可见的类成员\n- Setter 和 getter 方法使用 `$this` 伪变量引用同类的成员\n-\
  \ 单个 setter 方法可以分配多个参数值或默认值来初始化多个变量属性\n- `__construct()` 构造方法在类创建时调用，可用于初始化变量属性\n\
  - `__destruct()` 析构方法在类销毁时调用，可用于执行最终语句\n- PHP 有函数可以检查类，使用 `get_class_methods()`\
  \ 列出方法，使用 `get_class_vars()` 列出变量\n- 面向对象编程的三个基石是封装、继承和多态\n- 派生类声明将包含 `extends`\
  \ 关键字，以指定从其继承的基类\n- 接口使用 `interface` 关键字声明，声明可能仅包含方法定义\n- 通过在声明中包含 `implements`\
  \ 关键字和接口名称将类连接到接口\n\n\n\n\n\n# 附加文本 (#text00010.html_sec58)\n\n# 处理错误 (#text00010.html_sec59)\n\
  \n# 捕获异常 (#text00010.html_sec60)\n\n# 总结 (#text00010.html_sec61)\n\n## 读取文件\n\n\
  读写位于 Web 服务器上的文件对于记录信息和提供页面内容非常有用。为了处理文件，必须首先使用 PHP 的 `fopen()` 函数创建一个“文件流”（filestream）对象。这需要两个参数：指定文件的名称或路径，以及文件“模式”。文件模式决定了要执行的操作性质，并将文件指针放置在文件内合适的位置：\n\
  \n| **文件模式：** | **操作：** |\n| :--- | :--- |\n| r | 打开现有文件进行读取。文件指针从文件开头开始 |\n| w\
  \ | 放弃现有文件的所有内容，如果不存在则创建一个新文件。文件指针从文件开头开始 |\n| a | 打开现有文件并保留所有内容。文件指针从文件末尾开始 |\n\
  | r+ | 打开文件进行读或写。文件指针从文件开头开始 |\n| w+ | 打开文件进行写或读。放弃现有文件的所有内容，如果不存在则创建一个新文件。文件指针从文件开头开始\
  \ |\n| a+ | 打开文件进行读或写并保留所有内容。文件指针从文件末尾开始 |\n\n![image](img/Image00019.jpg)\n\n当文件模式指定符作为\
  \ `fopen()` 函数的参数提供时，必须出现在引号内。\n\n一种良好的做法是始终使用 `die()` 函数提供一个备选方案，以防创建文件流失败。\n\n\
  ![image](img/Image00005.jpg)\n\n作为 `die()` 函数的参数指定一条说明性消息。\n\n当文件流被成功创建后，可以通过指定文件流和字节大小作为\
  \ `fread()` 函数的参数来读取文件。如果需要读取整个文件，使用 `filesize()` 函数来指定要读取的文件字节大小会非常方便。\n\n在完成任何文件操作后，必须通过将文件流作为\
  \ `fclose()` 函数的参数来销毁它。\n\n![image](img/Image00138.jpg)\n\n![image](img/Image00029.jpg)\n\
  \nread.php\n\n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\
  \n```php\n<?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to\
  \ open file!’ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一条语句在成功后读取文本文件并显示其全部内容\n\
  \n```php\necho fread( $filestream , filesize( ‘manifesto.txt’ ) ) ;\n```\n\n![image](img/Image00012.jpg)\
  \ 现在，记得关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `read.php`，并与要读取的文本文件放在一起，然后通过 HTTP 打开页面，在浏览器窗口中显示文本文件内容\n\
  \n![image](img/Image00139.jpg)\n\n![image](img/Image00006.jpg)\n\n与 HTML 文档中的 PHP\
  \ 块不同，纯 PHP 脚本不需要闭合标签 `?>`。\n\n![image](img/Image00006.jpg)\n\n注意这里的输出没有保持行结束符——但上方的示例保留了。\n\
  \n## 读取行\n\n一旦创建了“文件流”对象，就可以通过将文件流作为 PHP `fgets()` 函数的参数来逐行读取其内容。若要读取每一行，可以在循环中反复调用此函数。`feof()`\
  \ 函数可以判断何时到达文件末尾并结束循环：\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n`feof()` 函数在到达文件末尾时返回 `true`。\n\n![image](img/Image00029.jpg)\n\nreadlines.php\n\
  \n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\n```php\n\
  <?php\n$filestream = fopen( ‘manifesto.txt’ , ‘r’ )\nor die( ‘Unable to open file!’\
  \ ) ;\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐行读取文本文件并显示其全部内容\n\n```php\n\
  while( !feof( $filestream ) )\n{ echo fgets( $filestream ). ’<br>’ ; }\n```\n\n\
  ![image](img/Image00012.jpg) 现在，记得关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\
  \n![image](img/Image00014.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `readlines.php`，并与要读取的文本文件放在一起，然后通过\
  \ HTTP 打开页面查看文本文件\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n## 读取字符\n\n一旦创建了“文件流”对象，就可以通过将文件流作为 `fgets()` 函数的参数来逐行读取其内容。若要读取每一行，可以在循环中反复调用此函数。`feof()`\
  \ 函数可以判断何时到达文件末尾并结束循环：\n\n![image](img/Image00140.jpg)\n\n![image](img/Image00006.jpg)\n\
  \n`feof()` 函数在到达文件末尾时返回 `true`。\n\n![image](img/Image00029.jpg)\n\nreadchars.php\n\
  \n![image](img/Image00008.jpg) 开始一个 PHP 脚本，其语句尝试打开一个文本文件进行读取，或在失败时退出脚本\n\n```php\n\
  <?php\n$filestream = fopen( ‘title.txt’ , ‘r’ )\nor die( ‘Unable to open file!’\
  \ )\n```\n\n![image](img/Image00010.jpg) 接下来，添加一个循环在成功后逐字符读取文本文件并显示其全部内容\n\n```php\n\
  while( $char = getc( $filestream ) )\n{ echo $char; }\n```\n\n![image](img/Image00012.jpg)\
  \ 现在，记得关闭文件流\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并为 `readchars.php`，并与要读取的文本文件放在一起，然后通过 HTTP 打开页面查看文本\n\
  \n## 写入文件\n\n一旦以写入模式创建了“文件流”对象，就可以创建一个文本文件。可以通过指定文件流和文件名到 PHP `fwrite()` 函数写入文本。为了格式化文本，还可以写入不可打印字符来创建换行和制表：\n\
  \n| **字符：** | **描述：** |\n| :--- | :--- |\n| \\n | 换行移动到下一行 |\n| \\r | 回车回到行首 |\n\
  | \\t | 制表移动到下一个制表位 |\n\n![image](img/Image00019.jpg)\n\n包含不可打印字符的字符串必须封装在双引号内，以便\
  \ PHP 解释它们。\n\n![image](img/Image00029.jpg)\n\nwrite.php\n\n![image](img/Image00008.jpg)\
  \ 开始一个 PHP 脚本，其语句分配包含格式化不可打印字符的文本\n\n```php\n<?php\n$poem = “\\r\\n\\tI never saw\
  \ a man who looked” ;\n$poem .= “\\r\\n\\tWith such a wistful eye” ;\n$poem .= “\\\
  r\\n\\tUpon that little tent of blue” ;\n$poem .= “\\r\\n\\tWhich prisoners call\
  \ the sky” ;\n```\n\n![image](img/Image00010.jpg) 接下来，为要写入的文件分配名称\n\n```php\n$filename\
  \ = ‘poem.txt’ ;\n```\n\n![image](img/Image00012.jpg) 尝试创建一个写入的文本文件，或在失败时退出脚本\n\n\
  ```php\n$filestream = fopen( $filename , ‘w’ )\nor die( ‘Unable to open file!’ )\
  \ ;\n```\n\n![image](img/Image00014.jpg) 写入文件并显示总共写入多少字节的确认\n\n```php\n$num = fwrite(\
  \ $filestream , $poem ) ;\nif( $num )\n{\n  echo “ $num bytes written to $filename\
  \ ” ;\n}\n```\n\n![image](img/Image00015.jpg) 现在，记得关闭文件流\n\n```php\nfclose( $filestream\
  \ ) ;\n```\n\n\n\n\n\n![image](img/Image00017.jpg) 将文档保存到您的 Web 服务器的 `/htdocs` 目录下并命名为\
  \ `write.php`，然后通过 HTTP 打开页面，以确认文本文件已写入。\n\n![image](img/Image00144.jpg)\n\n![image](img/Image00026.jpg)\
  \ 使用文件资源管理器进入您的 Web 服务器的 `/htdocs` 目录，查看 PHP 脚本创建的文件。\n\n![image](img/Image00145.jpg)\n\
  \n![image](img/Image00027.jpg) 打开文件查看 PHP 脚本写入的文本。\n\n![image](img/Image00146.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n你可以反复运行此示例，每次它都会擦除内容然后重新写入。\n\n## 追加文本\n\n一旦创建了指定了追加模式的“文件流”对象，就可以打开文本文件并向其末尾添加文本。可以通过向\
  \ PHP 的 `fwrite()` 函数指定文件流和文件名来向文件中追加文本。该过程与写入文件相同，不同之处在写入文件之前，文件指针被置在现有内容的末尾：\n\
  \n![image](img/Image00029.jpg)\n\nappend.php\n\n![image](img/Image00008.jpg) 开始一个\
  \ PHP 脚本，使用语句分配文本，包括用于格式化的非打印字符。\n\n```php\n<?php\n$info = \"\\r\\n\\r\\n\\tThe\
  \ Ballad of Reading Gaol” ;\n$info .= “r\\n\\t\\t\\tOscar Wilde 1898” ;\n```\n\n\
  ![image](img/Image00010.jpg) 接下来，为要写入的文件命名。\n\n```php\n$filename = ‘poem.txt’ ;\n\
  ```\n\n![image](img/Image00012.jpg) 尝试以追加模式打开纯文本文件，如果失败则退出脚本。\n\n```php\n$filestream\
  \ = fopen( $filename , ‘a’ ) or die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00014.jpg)\
  \ 写入文本并显示总共追加字节数的确认。\n\n```php\n$num = fwrite( $filestream , $info ) ;\nif( $num\
  \ )\n{\n    echo “ $num bytes appended to $filename ” ;\n}\n```\n\n![image](img/Image00015.jpg)\
  \ 现在，记得关闭文件流。\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00017.jpg)\
  \ 将文档保存到您的 Web 服务器的 `/htdocs` 目录下并命名为 `append.php`，然后通过 HTTP 打开页面，以确认文本已追加到文件中。\n\
  \n![image](img/Image00147.jpg)\n\n![image](img/Image00006.jpg)\n\n记住非打印字符必须包含在双引号中才能被解释。\n\
  \n![image](img/Image00026.jpg) 进入您的 Web 服务器的 `/htdocs` 目录并打开文件查看 PHP 脚本追加的文本。\n\n\
  ![image](img/Image00148.jpg)\n\n## 覆盖文本\n\n需要重要的是，当您以写入模式写入现有文件时，它将覆盖任何现有内容：\n\n\
  ![image](img/Image00029.jpg)\n\noverwrite.php\n\n![image](img/Image00008.jpg) 开始一个\
  \ PHP 脚本，尝试以写入模式打开一个现有文本文件，如果失败则退出脚本。\n\n```php\n<?php\n$filestream = fopen( ‘poem.txt’\
  \ , ‘w’ ) or die( ‘Unable to open file!’ ) ;\n```\n\n![image](img/Image00010.jpg)\
  \ 成功后，向文件写入新文本。\n\n```php\nfwrite( $filestream , ‘Overwritten!’ ) ;\n```\n\n![image](img/Image00012.jpg)\
  \ 现在，记得关闭文件流。\n\n```php\nfclose( $filestream ) ;\n```\n\n![image](img/Image00014.jpg)\
  \ 将文档保存到您的 Web 服务器的 `/htdocs` 目录下并命名为 `overwrite.php`，然后通过 HTTP 打开页面并重新打开文本文件，查看其内容已被覆盖。\n\
  \n![image](img/Image00149.jpg)\n\n![image](img/Image00019.jpg) 写入文件时要小心，因为很容易不小心覆盖。\n\
  \n## 错误处理\n\n你可以预测可能的错误并在使用 `die()` 函数或 `exit()` 函数在错误发生时终止正在运行的脚本。如果没有这种应急措施，默认\
  \ PHP 错误处理器在发生错误时会提供一条有用但不美观的消息。例如，使用 `fopen( ‘nonsuch.txt’ , ‘r’ )` 打开一个不存在的文件：\n\
  \n![image](img/Image00150.jpg)\n\n![image](img/Image00005.jpg)\n\n`die()` 和 `exit()`\
  \ 函数在 PHP 中执行相同的操作，但它们的术语可能具有不同的吸引力。对于某些人来说，检测到错误时使用 `die()` 可能更合适，而 `exit()` 在其他场景下可能更适合退出。\n\
  \n在发生错误时终止脚本并不总是如所愿，但你可以创建一个自定义的错误处理器，以提供比默认 PHP 错误处理器更具用户友好的消息。自定义错误处理器仅仅是一个函数：\n\
  \n```php\nfunction error_handler( $level, $message, $file, $line )\n{\n    switch(\
  \ $level )\n    {\n        case 2: $str = \"Warning\";\n        case 8: $str = \"\
  Notice\";\n        default: $str = \"Error\";\n    }\n    echo \"$str: $message\
  \ in $file on $line\";\n}\n```\n\n基础错误级别列表如下：\n\n| 级别 | 常量 | 描述 |\n| :--- | :---\
  \ | :--- |\n| 2 | E_WARNING | 警告 |\n| 8 | E_NOTICE | 通知 |\n| 256 | E_ERROR | 错误\
  \ |\n| 512 | E_USER_WARNING | 用户警告 |\n| 1024 | E_USER_NOTICE | 用户通知 |\n| 2048 |\
  \ E_USER_ERROR | 用户错误 |\n\n`set_error_handler()` 函数用于注册处理器：\n\n现在我们可以使用 `trigger_error()`\
  \ 函数手动触发错误。\n\n```php\nset_error_handler(\"error_handler\");\ntrigger_error(\"这是一个自定义错误\"\
  , E_USER);\n```\n\n\n\n\n\n![image](img/Image00008.jpg)  通过定义一个在条件测试失败时抛出异常的函数来开始\
  \ PHP 脚本\n\n```php\n<?php\nfunction check_size( $num )\n{\n    if( $num < 10 )\n\
  \    { \n        throw new Exception( “Number : $num<br>Value must exceed 10” )\
  \ ; \n    }\n}\n?>\n```\n\n![image](img/Image00010.jpg)  预判特定的错误并报告异常\n\n```php\n\
  try { check_size( 5 ) ; }\ncatch( Exception $e )\n{\n    echo ‘<b>Size Exception!</b><br>’.\
  \ $e->getMessage() .’<hr>’ ;\n}\n```\n\n![image](img/Image00012.jpg)  接下来，创建一个自定义异常处理器类\n\
  \n```php\nclass CustomException extends Exception\n{\n    public function get_details\
  \ ()\n    {\n        $details = ‘ File : ‘ . $this -> getFile ().\n        ‘<br>Line\
  \ : ‘ . $this -> getLine ().\n        ‘<br>’ . $this -> getMessage () ;\n      \
  \  return $details ;\n    }\n}\n```\n\n![image](img/Image00014.jpg)  现在，添加另一个在条件测试失败时抛出异常的函数\n\
  \n```php\nfunction check_parity ( $num )\n{\n    if( $num % 2 !== 0 )\n    {\n \
  \       throw new CustomException ( “Number : $num <br>Value must be even” ) ;\n\
  \    }\n}\n```\n\n![image](img/Image00015.jpg)  最后，预判特定的错误并报告异常\n\n```php\ntry {\
  \ check_parity ( 5 ) ; }\ncatch( CustomException $e )\n{\n    echo ‘<b>Parity Exception!</b><br>’\
  \ . $e -> get_details (). ’<hr>’ ;\n}\n```\n\n![image](img/Image00017.jpg)  将文档保存到\
  \ Web 服务器的 `/htdocs` 目录并命名为 `exception.php`，然后通过 HTTP 打开页面以查看捕获的异常和适当的消息详情\n\n![image](img/Image00153.jpg)\n\
  \n![image](img/Image00006.jpg)\n\n有关派生类和继承的更多信息请参阅此处。\n\n![image](img/Image00005.jpg)\n\
  \n`try` 块可以包含多个 `throw` 语句以预判多种错误情况，并可以跟随多个 `catch` 块来处理这些异常。\n\n## 总结\n\n- `fopen()`\
  \ 函数用于创建文件流对象，需要两个参数来指定文件名和文件模式\n- 良好的做法是使用 `die()` 函数提供备选方案，以防创建文件流失败\n- `fread()`\
  \ 函数用于读取使用 `r` 模式创建的文件流，`filesize()` 函数可以指定文件的字节大小\n- 在完成任何文件操作后，必须调用 `fclose()`\
  \ 函数销毁文件流\n- `fgets()` 函数可以用于逐行读取文件，`feof()` 函数可以识别文件结束\n- `fgetc()` 函数可以用于逐字符读取文件，并在文件末尾返回\
  \ false\n-  可以通过将文件流和文件名作为参数传递给 `fwrite()` 函数向文件中写入文本\n- `fwrite()` 函数使用 `w` 模式会覆盖现有文本，但在使用\
  \ `a` 模式时会追加文本\n- 可以指定函数名称作为 `set_error_handler()` 函数的参数，将其 own 自定义错误处理器\n- 错误处理器函数在错误发生时被调用，也可以使用\
  \ `trigger_error()` 函数显式调用\n- 当发生特定错误情况时，会抛出异常\n- 如果异常未被捕获，PHP 将其视为致命错误并发布未捕获异常消息\n\
  - `try` 代码块用于预判特定错误，其关联 `catch` 块用于确定当错误发生时脚本应如何继续\n- `Exception` 类对象具有 `getMessage()`、`getFile()`\
  \ 和 `getLine()` 方法，可以获取异常详情\n- 可以作为 `Exception` 类的派生类来创建自定义异常处理器，以提供自定义异常方法\n\n\
  # 生成表单\n\n*本章演示了如何使用 PHP 脚本处理 HTML 表单数据。*\n\n- 执行操作\n- 检查已设置的值\n- 验证表单数据\n- 过滤数据\n\
  - 发送隐藏数据\n- 处理提交\n- 制作粘性表单\n- 上传文件\n- 表单外框\n- 追加数据\n- 总结\n\n## 执行操作\n\n表单提交方法可以是“GET”或“POST”。**GET**\
  \ 方法将 name=value 对添加到 URL 中，但主要用于请求信息——例如检索数据库记录。**POST** 方法可以提交更多数据，由于数据不附加到 URL\
  \ 中因此更安全，并且主要用于需要执行操作的情况——例如更新数据库记录。因此，本书中的大多数示例优先使用 **POST** 方法。\n\n\n\n\nPHP 可以使用内置的\
  \ `isset()` 函数轻松确保用户已在提交的 HTML 表单字段中输入了数据。该函数接受变量名作为参数，仅当该变量值不为 `NULL`时返回 `TRUE`\
  \ —— 因此确保了变量已“设置”了某些值。除非用户输入了值，否则空表单字段将为 `NULL`。\n\n可以使用 `isset()` 函数进行条件测试，以指示哪些表单字段留空，或为已完成的字段提供响应页面：\n\
  \n![image](img/Image00029.jpg)\n\n`isset.php`\n\n![image](img/Image00036.jpg)  创建一个包含三个单选按钮的\
  \ HTML 文档，该表单提供一个单一的数据提交字段\n\n```html\n<form action=” isset_handler.php ” method=”\
  \ POST ”>\n<fieldset>\n<legend>PHP 是哪种语言？</legend>\nScripting<input type=”radio”\
  \ name=” definition ” value=” Scripting ”> <br>\nMarkup<input type=”radio” name=”\
  \ definition ” value=” Markup ”> <br>\nProgramming<input type=”radio” name=” definition\
  \ ” value=” Programming ”>\n</fieldset><p><input type=”submit” ></p>\n</form>\n\
  ```\n\n![image](img/Image00037.jpg)  现在，将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `isset.php`\n\
  \n![image](img/Image00029.jpg)\n\n`isset_handler.php`\n\n![image](img/Image00038.jpg)\
  \  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量 ——如果没有提交值，则初始化为 `NULL`\n\n```php\n<?php\n\
  if ( isset( $_POST[‘definition’] ) )\n{\n    $definition = $_POST[‘definition’]\
  \ ;\n}\nelse\n{\n    $definition = NULL ;\n}\n# 在此处插入响应语句（第 4 步）。\n?>\n```\n\n![image](img/Image00039.jpg)\
  \  最后，插入语句根据变量的值输出相应的响应\n\n```php\nif ( $definition != NULL )\n{\n    if ( $definition\
  \ != ‘Scripting’ )\n    { echo “ $definition is Incorrect” ; }\n    else\n    {\
  \ echo “ $definition is Correct” ; }\n}\nelse\n{ echo ‘You must select one answer’\
  \ ; }\n?>\n```，等待，修复格式：\n\n![image](img/Image00040.jpg)  将文档保存到 Web 服务器的 `/htdocs`\
  \ 目录下并命名为 `isset_handler.php`，然后通过 HTTP 访问 `isset.php` 并提交表单以查看响应\n\n![image](img/Image00156.jpg)\n\
  \n![image](img/Image00157.jpg)\n\n![image](img/Image00158.jpg)\n\n![image](img/Image00159.jpg)\n\
  \n![image](img/Image00005.jpg)\n\n从技术上讲，测试条件是否为 `TRUE` 比测试它是否为 `TRUE` 更高效 —— 因为需要评估的可能性更少。\n\
  \n### 验证表单数据\n\n由于用户可能会无意中提交空字段或格式错误的表单，因此您的 PHP 脚本确保必填字段已填写且提交的数据有效是非常关重要的。\n\n\
  为了确保用户已在文本字段中输入了内容，PHP 提供了 `empty()` 函数，它接受可变参数，如果其值为空字符串、零、`NULL` 或 `FALSE`，则返回\
  \ `TRUE`。\n\n为了确保用户输入的是数字格式的数据，PHP 提供了 `is_numeric()` 函数，它接受可变参数，且仅当其值为数字时才返回 `TRUE`。\n\
  \n可以使用 PHP 的 `preg_match()` 函数执行更具体的数据验证，该函数接受一个“正则表达式”参数和一个用于查找模式的可变参数。通常，这被用于确保电子邮件地址符合预期格式：\n\
  \n![image](img/Image00029.jpg)\n\n`valid.php`\n\n![image](img/Image00036.jpg)  创建一个包含两个文本字段的\
  \ HTML 文档，该表单用于数据提交\n\n```html\n<form action=” valid_handler.php ” method=” POST\
  \ ”>\n<fieldset>\n<legend>输入数量和电子邮件地址</legend>\n<p>Quantity : <input type=”text”\
  \ name=” quantity ”></p>\n<p>Email Address : <input type=”text” name=” email ”></p>\n\
  </fieldset><p><input type=”submit” ></p>\n</form>\n```\n\n![image](img/Image00037.jpg)\
  \  现在，将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `valid.php`\n\n![image](img/Image00029.jpg)\n\
  \n`valid_handler.php`\n\n![image](img/Image00038.jpg)  接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量\
  \ ——如果没有提交值，则初始化为 `NULL`\n\n```php\n<?php\nif ( !empty ( $_POST[‘quantity’] ) )\n\
  {\n    $quantity = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n{ \n\
  \    $quantity = NULL ; \n    echo ‘You must enter a quantity<br>’ \n}\n?>\n```\n\
  \n等待，让我根据提供的文本流重新对齐逻辑：\n\n```php\n<?php\nif ( !empty ( $_POST[‘quantity’] ) )\n\
  {\n    $quantity = $_POST[‘quantity’] ;\n    # 在此处插入格式验证（第 4 步）。\n}\nelse\n{ $quantity\
  \ = NULL ; echo ‘You must enter a quantity<br>’ }\n}\n```\n实际上，源文本是：\n```php\n<?php\n\
  if ( !empty ( $_POST[‘quantity’] ) )\n{\n    $quantity = $_POST[‘quantity’] ;\n\
