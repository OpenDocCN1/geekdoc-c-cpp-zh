  \n```php\nif ( $definition != NULL )\n{\n    if ( $definition != ‘Scripting’ )\n\
  \    { echo “ $definition is Incorrect” ; }\n    else\n    { echo “ $definition\
  \ is Correct” ; }\n}\nelse\n{ echo ‘You must select one answer’ ; }\n?>\n```\n\n\
  等待，修复格式：\n\n![image](img/Image00040.jpg)  将文档保存到 Web 服务器的 `/htdocs` 目录下并命名为 `isset_handler.php`，然后通过\
  \ HTTP 访问 `isset.php` 并提交表单以查看响应\n\n![image](img/Image00156.jpg)\n\n![image](img/Image00157.jpg)\n\
  \n![image](img/Image00158.jpg)\n\n![image](img/Image00159.jpg)\n\n![image](img/Image00005.jpg)\n\
  \n从技术上讲，测试条件是否为 `TRUE` 比测试它是否为 `TRUE` 更高效 —— 因为需要评估的可能性更少。\n\n### 过滤数据\n\n为了验证输入，PHP\
  \ 提供了 `filter_var()` 函数，它可以同时用于验证和“清理”输入。该函数需要两个参数：指定要过滤的变量和要使用的过滤器常量：\n\n| **过滤器常量:**\
  \ | **约定:** |\n| :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN` | 布尔值 |\n| `FILTER_VALIDATE_EMAIL`\
  \ | 电子邮件格式 |\n| `FILTER_VALIDATE_FLOAT` | 浮点数 |\n| `FILTER_VALIDATE_INT` | 整数 |\n\
  | `FILTER_VALIDATE_IP` | IP 地址格式 |\n| `FILTER_VALIDATE_MAC` | MAC 地址格式 |\n| `FILTER_VALIDATE_REGEXP`\
  \ | 正则表达式格式 |\n| `FILTER_VALIDATE_URL` | URL 格式 |\n| `FILTER_SANITIZE_EMAIL` | 移除无效字符\
  \ |\n| `FILTER_SANITIZE_ENCODED` | URL 编码字符串 |\n| `FILTER_SANITIZE_MAGIC_QUOTES`\
  \ | 反斜符转义字符 |\n| `FILTER_SANITIZE_NUMBER_FLOAT` | 移除所有非数字 |\n| `FILTER_SANITIZE_NUMBER_INT`\
  \ | 移除所有非数字 |\n| `FILTER_SANITIZE_SPECIAL_CHARS` | HTML 转义 `”>&` |\n| `FILTER_SANITIZE_STRING`\
  \ | 移除 HTML 标签 |\n| `FILTER_SANITIZE_URL` | 移除无效字符 |\n| `FILTER_CALLBACK` | 调用自定义过滤器函数\n\
  \n验证过滤器在验证成功时返回 `TRUE`，否则返回 `FALSE`。\n\n某些过滤器允许指定更多选项。例如，可以为 `FILTER_VALIDATE_INT`\
  \ 指定数字范围。\n\n\n\n![image](img/Image00038.jpg) 现在，添加一个函数来验证参数是否为格式正确的电子邮件地址\n\n```php\n\
  function validate( $email )\n{\n  if ( filter_var( $email , FILTER_VALIDATE_EMAIL\
  \ ) )\n  { echo( “<hr> $email 是一个有效的电子邮件地址” ) ; }\n  else\n  { echo( “<hr> $email\
  \ 并不是一个合法的电子邮件地址” ); }\n}\n```\n\n![image](img/Image00039.jpg) 创建一个包含非法空格的电子邮件地址并尝试验证，然后对电子邮件地址进行清理并再次尝试验证\n\
  \n```php\n<?php\n$email = ‘mike @example.com’ ;\nvalidate( $email ) ;\n$email =\
  \ filter_var( $email , FILTER_SANITIZE_EMAIL ) ;\nv a lidate( $email ) ;\n?>\n```\n\
  \n![image](img/Image00040.jpg) 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `filter.php`，然后通过\
  \ HTTP 打开它查看过滤结果\n\n![image](img/Image00163.jpg)\n\n![image](img/Image00019.jpg)\n\
  \n提交的用户输入可能会破坏你的网页，因此应该始终进行验证。\n\n### 发送隐藏数据\n\n除了用户输入到 HTML 表单输入字段中的数据外，PHP 生成的数据也可以使用\
  \ HTML 隐藏表单字段提交。与普通输入字段一样，这些也会向表单处理脚本发送 `name=value` 键对，但这里的值是由 PHP 提供的，而不是用户。\n\
  \n通常，使用隐藏表单字段提交的数据可能包括用户的用户名和提交的时间戳：\n\n![image](img/Image00029.jpg)\n\nhidden.php\n\
  \n![image](img/Image00036.jpg) 创建一个包含 PHP 脚本的 HTML 文档以定义时区并初始化两个变量\n\n```php\n<?php\n\
  date_default_timezone_set( ‘UTC’ ) ;\n$time = date( ‘ H:i , F j ‘ ) ;\n$user = ‘Mike’\
  \ ;\n```\n\n![image](img/Image00037.jpg) 现在，添加一个语句来编写包含一个普通输入字段两个隐藏字段的完整表单，其值由变量设置\n\
  \n```php\n<?php\necho ‘**\n<form action=” hidden_handler.php ” method=” POST ”>\n\
  <fieldset>\n<legend>给我们发送您的评论</legend>\n<textarea rows=”5” cols=”20” name=” comment\
  \ ”>\n</textarea>\n<input type=”hidden” name=” user ” value=” ‘. $user .’ “>\n<input\
  \ type=”hidden” name=” time ” value=” ‘. $time .’ “>\n</fieldset><p><input type=”submit”\
  \ ></p></form> ‘ ;\n?>\n```\n\n![image](img/Image00038.jpg) 将文档保存到 Web 服务器的 `/htdocs`\
  \ 目录并命名为 `hidden.php`\n\n![image](img/Image00019.jpg)\n\n此示例中的时间戳是在表单创建时创建的，而不是在表单提交时。\n\
  \n![image](img/Image00029.jpg)\n\nhidden_handler.php\n\n![image](img/Image00039.jpg)\
  \ 接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量——如果没有提交任何值，则设置为 `NULL`\n\n```php\n<?php\n\
  if ( !empty ( $_POST[‘comment’] ) )\n{\n  $comment = $_POST[‘comment’] ;\n}\nelse\n\
  {\n  $comment = NULL ; echo ‘你必须输入评论’ ;\n}\n```\n\n![image](img/Image00040.jpg)\
  \ 现在，如果隐藏表单字段值已设置，则添加语句初始化两个变量\n\n```php\n$time = ( !isset ( $_POST[‘time’] ) )\
  \ ? NULL : $_POST[‘time’] ;\n$user = ( !isset ( $_POST[‘user’] ) ) ? NULL : $_POST[‘user’]\
  \ ;\n```\n\n![image](img/Image00041.jpg) 最后最后的，添加一个语句来输出有效的提交数据\n\n```php\nif (\
  \ ( $comment != NULL ) && ( $time != NULL ) && ( $user != NULL ) )\n{ echo “<p>收到评论：\
  \ \\” $comment \\”<br> 来自 $user，时间 $time </p>” ; }\n?>\n```\n\n![image](img/Image00042.jpg)\
  \ 将文档保存到 Web 服务器的 `/htdocs` 目录并命名为 `hidden_handler.php`，然后通过 HTTP 打开 `hidden.php`\
  \ 并提交表单以查看响应\n\n![image](img/Image00164.jpg)\n\n![image](img/Image00165.jpg)\n\n\
  ![image](img/Image00005.jpg)\n\n注意这里使用了三元运算符 `? :` 代替了更长的 `if else` 语句。\n\n![image](img/Image00006.jpg)\n\
