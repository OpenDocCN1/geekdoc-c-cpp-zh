  \ TOTEM\n- 17.6 总结\n- 参考文献\n\n### 摘要\n\n大图计算系统是大数据计算中的关键工具。它可以应用于多种大数据应用场景，如社交网络、网页搜索和蛋白质相互作用。然而，非结构化的图数据导致数据访问是不均匀的，这为构建高效的大图计算系统带来了巨大挑战。幸运的是，最近已经提出了许多大图计算框架来缓解上述问题。总来说，这些框架可以分为单节点内存系统、分布式共享内存系统和单节点外存系统。此外，还有一些利用闪存\
  \ SSD 和 GPU 来加速大图计算的解决方案。在本章中，我们将从系统的角度回顾这些典型的大图计算系统。\n\n## 17.1 引言 (#28_Chapter17.xhtml_sec17_1)\n\
  \n### 17.1.1 应用背景 (#28_Chapter17.xhtml_sec17_1_1)\n\n许多实际问题可以用图来表示，图由一组顶点和它们之间的某些边组成。详细来说，顶点可以看作实体，边可以用来表示两个实体之间的关系。我们现在正处大数据时代。各种格式的数据正在快速生成，并在规模和复杂性上不断增长。处理、存储和分析这些大数据是一项艰巨的工作。为了从中提取价值，需要高效的分析框架。\n\
  \n`MapReduce` [1] 是一种并行编程模型，可以高效地处理许多大数据问题，但它在图算法上的执行性能较差，因为如果使用 `MapReduce` 模型，图算法的迭代性质会导致大量的通信和同步开销。并行\
  \ Boost 图库（`Parallel BGL`）[2] 和 `CGMGraph` [3] 是其他选择。\n\n### 17.1.2 分布式大图计算系统 (#28_Chapter17.xhtml_sec17_2)\n\
  \n基于上述事实，近年来提出了许多分布式计算系统，包括 `Pregel` [4], `Giraph` [5], `Hama` [6], `GraphLab` [7],\
  \ `PowerGraph` [8] 以及 `GraphX` [9]。这些系统采用“像顶点一样思考”的顶点中心计算模型，其中每个顶点接收其他顶点的消息，根据定义的逻辑更新自己的值，然后将其新值发送给邻居顶点。顶点中心模型便于用户设计和实现。除了顶点中心计算模型，`PowerGraph`\
  \ 支持边中心计算模型，对于每个边，它首先收集在上次迭代中产生的更新，并将源顶点的新值传播到目标顶点。参考文献 10 采用了块中心计算模型。`PathGraph`\
  \ [11] 利用了路径中心计算模型。这些系统在使用其计算模型时，通过较长的分区时间换取更好的图数据局部性。\n\n\n\n\n还有一些针对异构系统的解决方案。代表性系统有\
  \ TurboGraph [16]、FlashGraph [17]、TOTEM [18] 以及 Cusha [19]。SSD 的性能特性与 HDD（机械硬盘器）不同，因此\
  \ `TurboGraph` 和 `FlashGraph` 利用了一了一些专门为 SSD 优化的新颖方案。图形处理器（GPU）是大多数计算机系统的一部分，其并行处理能力远于\
  \ CPU，可用于卸载计算任务，但其逻辑处理时间较短。关于 `GPU` 的特性，`TOTEM` 和 `Cusha` 提出了在进行图计算时最大化 `GPU` 性能的方法。\n\
  \n### 17.1.3 章节结构](#28_Chapter17.xhtml_sec17_1_3)\n\n本章的组织结构如下：第 17.2 节 列出了大规模图计算的一些挑战。在第\
  \ 17.3 节 中，我们介绍了代表性的分布式图计算系统及其关键技术。第 17.4 节 展示了代表性的单机图计算系统及其关键技术。第 17.5 节 描述了代表性的异构图计算系统及其关键技术。我们最后在第\
  \ 17.6 节 中对本章进行总结。\n\n### 17.2 大规模图计算的挑战](#28_Chapter17.xhtml_sec17_2)\n\n高效的大规模图计算具有挑战性。首先，大规模图计算是大数据计算的一个分支，面临着与其他许多大数据问题类似的共同挑战。其次，图计算有自身的特性，例如数据局部性差、非结构化图数据，这些为大规模图计算带来了新挑战。在本节中，我们将详细讨论大规模图计算的挑战。\n\
  \n#### 17.2.1 海量数据与非结构化数据](#28_Chapter17.xhtml_sec17_2_1)\n\n首先，图数据属于大数据，满足大数据的基本特征（即体量、速度和多样性）。图数据量极其巨大且增长迅速。Google\
  \ 在 1998 年索引的网页约为 100 万页，到 2000 年迅速达到 10 亿页。2014 年，它索引了约 30 万亿网页 [20]。Facebook 在\
  \ 2012 年 10 月实现了 10 亿用户。显然，大规模图通常超过了单机的内存容量。无论是使用集群进行水平扩展还是在磁盘上垂直扩展，都需要仔细的设计。另一个问题是图数据的多样性，它来自数据集的标注和组合。这意味着顶点和边可以被标记为任意属性。例如，边可以被标记以定义两个顶点之间的名差异（A\
  \ 是 B 的粉丝），或者可以携带权重来显示差异程度（从 A 到 B 需要步行 15 英里）。\n\n除了体量、速度和多样性带来的挑战外，图数据的非结构化特征带来的困难也要求我们在构建高效图计算系统之前予以解决。非结构化数据没有标准的定义，但通常非结构化数据中的元素没有结构。例如，社交图和路图的结构完全不同，即使是社交图，不同类型的社交图也多种多样。此外，在一个图中，不同顶点的边数以及它们连接的顶点也是不同的。非结构化数据数据局部性差，且图算法是数据驱动的，如果数据没有良好的预处理，将导致性能欠优。\n\
  \n#### 17.2.2 并行图处理](#28_Chapter17.xhtml_sec17_2_2)\n\n并行计算对于高效的大规模图计算至关重要，但也带来了挑战。首先，我们需要处理任务分配，这对应于图划分。注意，最优的图划分要求任务大小相等，且共享顶点（边切割）或共享边（顶点切割）最少，但这是一个\
  \ NP-hard 问题。此外，任务之间通常存在依赖关系，因此我们必须考虑同步开销。对于分布式系统，开销主要来自机器之间的通信；而在 NUMA 架构的单机中，这种影响尤为显著。\n\
  \n在并行处理问题时，负载均衡是影响整体性能的重要因素。然而，在图计算领域，大多数真实图遵循幂律分布 [21]，这表明图中不同顶点的度差异巨大。因此，负载均衡是我们构建高效并行图系统所面临的另一个挑战。\n\
  \n在分布式系统中，容错性对于维护系统的可用性是重要且必要的。然而，它不仅会在正常计算阶段产生额外开销，在恢复阶段也是如此。良好的容错机制在两个阶段对系统性能的影响应该尽可能小。\n\
  \n### 17.3 代表性的分布式大规模图计算系统与优化技术](#28_Chapter17.xhtml_sec17_3)\n\n在本节中，我们介绍了三个代表性的分布式图计算系统，然后总结了分布式系统中使用的优化技术。\n\
  \n#### 17.3.1 Pregel](#28_Chapter17.xhtml_sec17_3_1)\n\nPregel 由 Google 在 2010 年提出，旨在取代\
  \ MapReduce 以进行高效可靠的图计算。它借用了 BSP（批量同步并行）[22] 模型来实现其计算和通信模型。具体来说，Pregel 的计算由一系列迭代组成。迭代被称为超步（superstep），其中顶点被并行处理。此外，Pregel\
  \ 采用了以顶点为中心的计算模型，在超步期间，每个顶点都会接收上一步发送的消息，然后根据用户定义的逻辑更新自身状态，最后沿着出边发送新状态。\n\n在 Pregel\
  \ 中，当所有顶点都投票停止（如图 17.1 #8_Chapter17.xhtml_fig17_1 所示）且当前超步中没有消息传递时，算法终止。开始时，每个顶点处于激活状态，并将执行用户定义的计算逻辑。顶点通过投票停止进入激活状态，这意味着除非收到来自其他顶点的新消息，否则不会进行任何计算。被消息重新激活的顶点在完成超步计算后，必须显式地再次脱激活。\n\
  \n![fig17_1.jpg](img/fig17_1.jpg)\n\n图 17.1 顶点状态机。\n\n在[图 17.2 #8_Chapter17.xhtml_fig17_2]\
  \ 中，我们展示了 Pregel 中 PageRank 的实现。在一个超步中，顶点程序首先迭代上一步发送的消息，这些消息包含了所有入邻的 PageRank 之和。然后，计算新的\
  \ PageRank 值并发送给其出邻。\n\n![fig17_2.jpg](img/fig17_2.jpg)\n\n图 17.2 在 Pregel 中实现的\
  \ PageRank。\n\nPregel 将图划分为不同的部分，每个部分包含一组顶点及其所有的出边。划分方案基于顶点 ID，因此我们可以轻松推断出顶点属于哪个分区。默认划分函数是\
  \ `hash(N)`，其中 `N` 是分数量，用户可以设计自己的划分方案来替换默认划分函数。\n\n\n\n\n# 通信\n\n顶点之间的通信通过消息完成。在一个超步（superstep）期间，顶点可能会接收到来自其入邻居的许多消息。所有消息都保证会被送达且不会重复，这些消息将在下一个超步中作为顶点\
  \ `update function` 的输入可用。需要注意的是，在分布式环境中，机器之间的通信开销可能是性能的主要瓶颈。为了提高性能，Pregel 为用户提供了\
  \ `combiner function`（合并器函数），用户可以通过它将发送到顶点的消息合并为单个消息，以减少需要的消息的消息；然而，由于消息的无序特性，`combiners`\
  \ 只能用于交换和结合律的操作。\n\nPregel 的容错机制通过 `checkpoint`（检查点）实现。在超步开始时，主节点指示每个工作节点将其分区保存到持久性存储中，包括顶点值、边值和入消息等。主节点使用\
  \ `ping` 消息来检测工作节点的故障。当工作节点故障时，主节点会将这些节点所属的分区重新分配给集群中当前可用的工作节点，从最近的状态重新加载分区状态，并计算丢失的步骤直到当前步骤。为了平衡恢复开销和检查点开销之间的关系，Pregel\
  \ 根据平均故障时间模型设置检查点频率。\n\n## 17.3.2 GraphLab\n\nGraphLab（我们在此处描述其分布式版本）是一种异步分布式共享内存图系统，在\
  \ particular 系统中，顶点程序可以直接访问其当前顶点、相邻边和相邻顶点的信息。它的主要目标是提供一种异步、动态的图并行计算，能够在集群上高效地执行许多机器学习和数据挖掘（MLDM）算法。\n\
  \n许多 MLDM 算法可以使用图数据进行建模；通过这种方式，可以表示数据依赖关系，并且能够从噪声数据中提取出更多的信息。此外，大多数 MLDM 算法迭代更新一组参数，而这些更新依赖于底层的图结构（相同的算法在不同的图数据结构上可能会输出不同的参数）。Pregel\
  \ 等同步系统在每次迭代结束时并行更新所有参数，其输入数据是来自上一次迭代接收到的参数；而 GraphLab 则通过使用最新的参数值异步更新参数。同步计算会导致性能下降，因为当使用同步计算时，每个计算阶段的运行时间由最慢的机器决定，而慢速机器可能由多种因素引起，例如负载、网络和硬件差异。此外，顶点本身在算法中具有不同的复杂性和收敛性（取决于数据），这会产生不同的运行时间。因此，GraphLab\
  \ 利用了异步计算模式，许多 MLDM 算法（如信念传播、PageRank）从中大匪浅。\n\n许多 MLDM 算法的参数是非对称收敛的，这意味着某些参数在几次迭代内就能收敛，而另一些参数在多次迭代中收敛非常缓慢。为了优化性能，GraphLab\
  \ 采用了动态调度方案，专注于这些更具挑战性的参数（收敛缓慢参数）以加速收敛。虽然 Pregel 通过允许某些顶点跳过某些超步来支持动态计算，但与 GraphLab\
  \ 的优先级计算相比，其效果非常有限。\n\n并行处理对于高效的大图计算是必要的。然而，对于某些 MLDM 算法，需要序列化来帮助加速收敛或确保算法的正确性。为了解决这个问题，GraphLab\
  \ 通过引入不同级别的排序一致性模型，确保每个并行处理都有等效的顺序执行，用户可以根据其算法选择相应的模型。\n\n[图 17.3] 显示了 GraphLab\
  \ 的概述。系统首先从分布式文件系统加载行图数据，然后进行图分区。如果使用哈希分区，该过程将由 `MapReduce` 框架完成，对每个顶点和边执行 map 操作，每个\
  \ reducer 累积原子文件（atom file），然后将其上传到分布式文件系统。在执行阶段，原子文件将被分配到集群中的机器上，由这些机器并行执行相应的计算。\n\
  \n![fig17_3.jpg](img/fig17_3.jpg)\n\n图 17.3 GraphLab 系统概述。\n\nGraphLab 引入了 `Gather,\
  \ Apply, and Scatter (GAS)` 计算模型。在 gather（聚合）阶段，顶点程序沿其入边从入邻居读取信息，生成更新值并将其应用到顶点上。[图\
  \ 17.4] 显示了在 GraphLab 中实现的 PageRank；顶点程序直接读取邻居顶点的状态来计算和。一旦新的总和更新到顶点，它的值就可以被其他顶点程序读取。\n\
  \n![fig17_4.jpg](img/fig17_4.jpg)\n\n图 17.4 GraphLab 中的 PageRank。\n\nPregel 采用同步检查点，在构建快照时挂起所有计算并刷新通信通道。这种同步机制对于作为同步计算的\
  \ GraphLab 来说是无效的。因此，GraphLab 使用异步检查点（`Chandy–Lamport algorithm`）来实现容错机制，在不挂起计算的情况下增量构建快照。当发生故障时，系统可以从上一个检查点恢复。\n\
  \n## 17.3.3 PowerGraph\n\n大多数真实图呈现出幂律度分布，这意味着大多数顶点具有相对较少的邻居，而一小部分顶点具有大量的邻居。这种现象给高效的分布式并行图处理带来了挑战，例如工作节点之间的负载不平衡、通信不对称以及工作节点存储的负载平衡。\n\
  \n为了应对这些挑战，Gonzalez 等人提出了 PowerGraph（包含在 GraphLab 2.2 中），它利用顶点切割（vertex-cut）图分区来确保计算和通信的平衡。此外，PowerGraph\
  \ 结合了 Pregel 和 GraphLab 的优点，因此它支持 BSP 计算模型，也支持计算高效的异步计算模型。\n\n[图 17.5] 显示了 PowerGraph\
  \ 的通信模型，其中高度顶点被分成多个部分，每个部分包含部分边并存储在集群的某台机器上。在计算期间，顶点程序在每个部分上并行运行，累加器和更新后的顶点数据通过网络通信交换。通过这种方式，高度顶点的边数据可以均匀地分配到集群中的机器上。此外，顶点程序也可以跨机器存在，这有助于改善工作平衡并减少通信。由于顶点数据（主节点）与其副本（镜像）之间存在通信，且顶点副本会增加系统的存储开销，因此仔细确定划分数量以减少此类网络和存储开销。\n\
  \n![fig17_5.jpg](img/fig17_5.jpg)\n\n图 17.5 PowerGraph 的通信模式。\n\n\n\n\n基于上述系统架构，一些工作提出了优化技术，显著提升了系统性能。\n\
  \n`Pregel` 和 `GraphLab` 采用以顶点为中心的编程模型，这使得用户很容易实现许多图算法。然而，这种模型向用户隐藏了分区信息，这可能导致沉重的网络（`Pregel`）或调度（`GraphLab`）开销。为了优化性能，Tian\
  \ 等人提出了 `Giraph++`，它利用了一种新的“像图一样思考”（以图为中心）的计算模型。`Giraph++` 将分区信息暴露给用户，从而可以对图算法进行优化。\n\
  \nXue 等人 [24] 发现，大多数现有的分布式图计算系统（如 `Pregel`）在内存使用上效率低下，因为它们不允许作业共享图数据。如图 17.6a 所示，当运行并发作业时，每个作业都维护一份独立的图数据，尽管这些图数据可能是重复的。为了解决这个问题，他们提出了\
  \ `Seraph`，将图数据与特定于作业的数据解耦，使得图数据可以在作业之间共享（如图 17.6b 所示）；从而大幅减少了内存消耗。此外，`Seraph` 利用增量图检查点和状态恢复来实现高效的容错机制。\n\
  \n![fig17_6.jpg](img/fig17_6.jpg)\n\n图 17.6 并发作业执行的方式。(a) 现有的图系统。(b) Seraph。\n\n\
  在处理具有倾斜度分布的自然图时，`Pregel` 和 `GraphLab` 会导致负载不平衡和严重的数据竞争，而 `PowerGraph` 则受到高额顶点通信开销的影响，即使对于低度顶点也是如此。`PowerLyra`\
  \ [25] 通过对不同维度的顶点动态应用不同的计算和分区策略，改进了处理倾斜图的性能。`PowerLyra` 在处理高度顶点的过程中遵循 `PowerGraph`\
  \ 的计算模型，这保证了高并行性。对于低度顶点，通过保留顶点及其单向边（入边或出边），`PowerLyra` 执行本地聚合（gathering）和分布式散射（scattering），以最小化通信开销。在分区方案方面，`PowerLyra`\
  \ 对低度顶点使用边切（edge cut）并为它们保留单向边；使用点切（vertex cut）来划分高度顶点，考虑到并行性，这些边跨越了许多机器。\n\n同步和异步检查点需要将当前顶点状态保存到可靠的持久性存储中（例如分布式文件系统），这些状态信息将从存储中加载，并重新计算发生故障的缺失步骤。这一过程对于正常执行以及恢复阶段都是昂贵的。Wang\
  \ 等人 [26] 引入了 `Imitator`，它通过将顶点状态复制到其副本来支持高效的容错机制。在现有的顶点为中心的分布式图计算系统中，顶点副本最初用于顶点状态的本地访问。因此，`Imitator`\
  \ 借用了分布式文件系统（`DFS`）的容错思想，重用这些副本进行顶点数据的备份，并利用主顶点与其镜像之间的同步消息来保持镜像处于最新状态。通过这种方式，可以用极低的存储开销实现容错。此外，顶点的副本分布在许多机器上，这意味着恢复可以并行进行，由于状态是从动态随机存储器（`DRAM`）而非基于磁盘的存储读取的，这一过程可以非常快速。\n\
  \n# 17.4 代表性的单节点大图计算系统和优化技术 (#28_Chapter17.xhtml_sec17_4)\n\n本节介绍了两种基于磁盘的代表性单节点大图计算系统，并给出了该领域的一些优化技术。\n\
  \n## 17.4.1 GraphChi (#_17.xhtml_sec17_4_1)\n\n`GraphChi` 是一种基于单机磁盘的以顶点为中心的大图计算系统。为了处理具有数十亿条边的大图，必须使用磁盘来扩展内存。然而，如果没有仔细的设计，由于图数据的非结构化特征和图算法糟糕的局部性，将会产生大量的随机\
  \ I/O；因此，处理大图的性能将是不可接受的。\n\n为了基于磁盘的高效大图处理，`GraphChi` 首先通过预处理来安排图数据在磁盘上的位置，然后使用一种新的计算模型进行执行，使得对存储的访问变为顺序，仅需少量随机访问。此外，`GraphChi`\
  \ 的计算模型是异步的，这有助于加速某些算法的收敛。此外，`GraphChi` 采用的选择性调度可以减轻遍历算法的 I/O 量，进一步提升了性能。\n\n在预处理阶段，`GraphChi`\
  \ 首先根据每个间隔（interval）的入边数量大致相等且能放入内存的规则将顶点划分为子集。然后，根据间隔，`GraphChi` 将边划分为分片（shard），每个分片存储该间隔的所有入边。在分片内部，边根据其源顶点\
  \ ID 进行排序。根据预处理方案，使用并行滑动窗口（`PSW`）方法从磁盘加载图，并并行完成顶点计算。如图 17.7 所示，图的顶点被分成四个间隔，每个间隔关联一个分片（一组边）。在迭代中，`PSW`\
  \ 通过一次处理一个间隔在间隔内执行计算。在执行某个间隔时，该间隔的所有入边将从磁盘顺序加载到内存中，由于分片中的边按源顶点 ID 排序，该间隔的出边位于其他分片中的块中，因此在图\
  \ 17.7 示例中，还需要另外 3 (4-1) 次顺序访问来加载该间隔的出边。实验结果显示，`GraphChi` 在个人电脑上运行，其性能与多机器的分布式系统相当甚至更好。\n\
  \n![fig17_7.jpg](img/fig17_7.jpg)\n\n图 17.7 并行滑动窗口方法一次迭代阶段的可视化。\n\n## 17.4.2 X-Stream\
  \ (#28_Chapter17.xhtml_sec17_4_2)\n\n`GraphChi` 通过单机磁盘实现了大图计算的良好性能。然而，它的预处理开销很大，需要对分片内的边进行排序以减少对存储中边的随机访问。`X-Stream`\
  \ 提出了一种以边为中心的计算模型，该模型不需要预处理模型，并充分利用了磁盘的顺序带宽。\n\n\n\n\n# `X-Stream` 也是一种基于磁盘的单机大规模图计算系统。但与\
  \ `GraphChi` 以顶点为中心的计算模型不同，它采用了一种以边为中心的计算模型，并将计算状态维护在顶点上。其计算模型如图图 17.8\n图 17.8 以边为中心的计算模型。\n\
  \n![fig17_9.jpg](img/fig17_9.jpg)\n\n图 17.9 带有流式分区的以边为中心的计算模型。\n\n## 17.4.3 优化技术\n\
  \n还有其他工作提出了优化技术，以优化基于磁盘的单机图计算系统的性能。\n\n`GraphChi` 具有预处理时间长以及加载与计算阶段分离的缺点。Cheng 等人\
  \ [14] 提出了 `VENUS`，它采用了一种新的计算模型。详细而言，他们的计算模型支持具有流式处理的顶点中心计算。首先，使用了一种新的分片模型（预处理），将顶点划分为不相交的区间，对于每个区间，创建一个\
  \ `g-shard` 和一个 `v-shard`。`g-shard` 存储该区间的入边，而 `v-shard` 包含该 `g-shard` 中的所有顶点，包括每条边的源点和目标。`g-shard`\
  \ 的入边按其目标顶点排序。需要注意，由于一个顶点的所有入边都加载到内存时，就可以完成该顶点的更新，因此不需要加载整个子图（区间内的边）。基于此，区间被进一步划分，以确保\
  \ `v-shard` 能够放入内存中。其次，基于分片模型，提出了流式计算模型。如图图 17.10\n图 17.10 顶点中心的流式处理。\n\n在 `X-Stream`\
  \ 中，散度阶段的更新值可能达到 `|E|`，这可能会导致大量的 I/O 并产生性能欠优。Zhu 等人 [15] 提出了 `GridGraph`，它将顶点划分为\
  \ `P` 个等大小的顶点块；每个顶点块包含连续范围内的顶点。然后将边划分为 `P × P` 个块（网格），并根据源顶点决定行块、目标顶点决定列块的规则将边分配到相应的网格中。图\
  \ 17.11 展示了 `GridGraph` 分区方案的一个示例。基于这种存储布局，使用了一种新颖的双滑动窗口计算模型。图 17.12 展示了使用该计算模型对示例图（图\
  \ 17.11）执行 `PageRank` 算法。我们使用这个示例来说明双滑动窗口计算模型。为了更新顶点的 pagerank 值，`GridGraph` 顺序读取列向目标块的边，并将源块和目标块的顶点值加载到内存中，因此更新可以就地应用到目标顶点，这在最坏情况下避免了写入本地缓冲区或磁盘的开销。此外，还采用了选择性调度来跳过\
  \ `BFS`（广度优先搜索）和 `WCC`（弱连通分量）等算法不必要的块，以提升性能。\n\n![fig17_11.jpg](img/fig17_11.jpg)\n\
  图 17.11 GridGraph 的分区方案示例。\n\n![fig17_12.jpg](img/fig17_12.jpg)\n图 17.12 滑动窗口说明。PageRank\
  \ 的第一次迭代。\n\n## 17.5 代表性异构图系统与优化技术\n\n在本节中，我们分别介绍了基于 SSD 和 GPU 的异构图系统。\n\n### 17.5.1FlashGraph\n\
  \n`FlashGraph` 是一种基于 SSD 阵列的单机图计算系统。此外，`FlashGraph` 是一种半外部系统，将顶点状态维护在内存中，将边数据存储在存储器中。`FlashGraph`\
  \ 中的算法通过读写顶点来执行。这种方式可以避免 SSD 的写入性能和寿命问题。`FlashGraph` 提供了与内存系统相当的性能，并且优于外存系统。此外，`FlashGraph`\
  \ 采用顶点为中心的计算模型，按需请求边；这是因为 SSD 的顺序访问和随机访问之间的差距远小于 HDD。\n\n为了提供与内存系统相当的性能，`FlashGraph`\
  \ 使用 SSD 阵列来实现高吞吐量和低延迟。但 SSD 的吞吐量和 I/O 延迟仍然远高于 DRAM。为了克服这些挑战，`FlashGraph` 构建在 `SAFS`（关联文件系统）之上，该系统用于针对现代\
  \ NUMA 多处理器的极端并行性重构 I/O 调度、数据放置和数据缓存。\n\n图 17.13 展示了 `FlashGraph` 的架构。边数据存储在 SSD\
  \ 中并选择性访问，采用了紧凑的数据格式以减少 I/O 量。SSD 由 `SAFS` 管理；为了提高性能，`SAFS` 添加了异步用户任务 I/O 接口，允许在页缓存中进行通用计算，从而减少访问页缓存的开销和内存消耗。此外，它重叠了\
  \ I/O 和计算。图引擎负责顶点程序的调度；为了优化性能，引擎会合并顶点程序的相邻 I/O 请求，这不仅减少了 I/O 量，而且执行了顺序 I/O。`FlashGraph`\
  \ 向用户暴露顶点中心接口，用户可以借此表达各种图算法。\n\n### 17.5.2TOTEM\n\n\n\n\n\n具有不同特征处理单元的混合系统，由于针对顺序处理和批量处理（例如\
  \ `GPU`）都进行了优化，具有实现高效图处理的潜力。然而，在此之前，需要解决一些挑战，例如处理单元的图划分和负载分配。\n\n`TOTEM` 利用了一了一种基于顶点连通性的低时空复杂度的图算法。此外，在\
  \ `CPU–GPU` 混合系统中，通过 `PCI-E bus` 高带宽的辅助，对消息进行聚合和批处理，可以显著减少图处理的通信；在这种情况下，计算是主要的瓶颈。这里的顶点连通性通过顶点度量化。通过这种方式，大多数图可以被分为不同的度，从而与不同处理能力的处理元素匹配，并更有可能在处理单元之间产生平衡的负载。实现划分方案的一种直接想法是根据度对顶点进行地排序，但这不需要完全对顶点进行排序；可以采用部分排序（即找到将图划分为所需分区的数值），其时间复杂度为\
  \ `O(|V|)`。`TOTEM` 将低度顶点卸载到 `GPU` 上进行计算；这是因为低度顶点的边较少，是内存受限 `GPU` 的良好选择。此外，大多数自然图遵循幂律度分布，其中大多数顶点只有少量边，而少数顶点相邻大量的边。因此，将许多低度顶点卸载到\
  \ `GPU`并将少数高度顶点放在 `CPU` 上，与处理元素提供的并行性水平相匹配。\n\n## 17.6 总结\n\n在本章中，我们介绍了代表性的基于磁盘的分布式单节点系统以及异构图计算系统。对于分布式图计算系统，划分方案、通信模型和容错性是影响系统性能的三个重要方面。对于基于磁盘的单节点图计算系统，`I/Os`\
  \ 是主要的瓶颈；为了提高性能，我们应该集中在存储器上的数据布局和格式上。当然，一个基于布局和格式的适当计算模型也应该经过仔细设计。对于基于 `SSD` 的异构图计算系统，我们需要考虑到\
  \ `SSD` 的特性，例如 I/O 并行性、顺序访问与随机访问之间较小的性能差异以及磨损问题，以设计出能够充分利用 `SSD` 优点并减少其负面影响的系统。对于异构\
  \ `CPU–GPU`，我们应该充分利用 `GPU` 提供的高并行性，并考虑其有限的内存并将适当的任务卸载给它；此外，核心之间的负载均衡也是我们需要考虑的关键因素。\n\
  \n大规模图计算系统研究领域已经经历了良好的发展并取得了一些突破，但正如我们上述描述的，在各种系统中仍然存在一些待解决的开放问题。我们期待在该方向上有更多的研究工作。\n\
