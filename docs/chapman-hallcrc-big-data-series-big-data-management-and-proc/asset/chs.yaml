  \    - 18.4.1 Encode\n    - 18.4.2 CGHub\n- 18.5 总结\n- 参考文献\n\n### 摘要\n\n生物学领域高通量技术的应用为学术界和工业界带来了大量的“组学”数据。这些数据包括基因组数据和蛋白质组数据。在本章中，我们主要关注基因组数据。受益于“大数据”领域的发展以及基因组学数据驱动的领域知识，本文还讨论了精准医学和癌症基因组学在两个后续领域。同时，我们从“大数据”的角度考虑了基因组数据，并对这些数据给出了完整的“生命周期”。此外，还介绍了基因组数据研究中两个具有意义且前沿的案例。这两个案例——`ENCODE`\
  \ 和 `CGHub`，通过在基因组数据中整合大数据分析技术，展示了具有启发性且有趣的结果。随着生命科学、生物医学和医疗保健行业处于数据密集型科学的转折点，由于我们可以从海量的基因组数据中受益，大数据分析为我们展示了更好地理解和改善生活的巨大潜力。\n\
  \n## 18.1 引言\n\n近年来，生物信息学引起了学术界和工业界的广泛关注。面对海量的基因组数据，大数据分析为我们展示了更好地理解和改善生活的巨大潜力。具体而言，基因组和蛋白质组数据增长速率的加快导致了需求的激增。本章致力于探讨基因组学以及“大数据”的图景。\n\
  \n### 18.1.1 基因组学历史\n\n基因组学研究始于 20 世纪 90 年代，当时人类基因组计划（`HGP`）启动了其研究。分子水平上的 `HGP`\
  \ 有望彻底改变研究细胞的方式。`HGP` 被设计为一个三步计划，以产生遗传图谱、物理图谱等。2003 年 4 月 14 日，美国国家基因组研究所（`NHGRI`）、能源部（`DOE`）以及国际基因测序联盟的伙伴宣布成功完成\
  \ `HGP`。不仅是人类，其他物种也正在测序。1995 年，完成了第一个细菌基因测序，即流感嗜血杆菌（`Haemophilus influenza`）。1996\
  \ 年，酿酵母（`Saccharomyces cerevisiae`）完成了测序。2000 年，果蝇（`Drosophila melanogaster`）完成了基因测序。2013\
  \ 年，最新的测序物种是斑鱼（`Zebrafish`）。到目前为止，不同类型的生命正在被测序，这意味着越来越多的相应的基因组数据被记录。如图 18.1\n\n\
  图 18.1 学的未来。（出自 Francis S. Collins 等，*Nature*，422(6934):835–847，2003。）\n\n这是一个整合计算和实验技术的前景研究领域\
  \ [#29_Chapter18.xhtml_ref_3]。大量生物数据的出现需要许多计算技术的参与，包括大数据分析工具、数据挖掘和机器学习，以协作处理这些数据。未来生物医学研究的关键问题是如何通过计算技术开发数据决策支持系统，以帮助生物学家设计进一步的实验或进行数据分析。\n\
  \n### 18.1.2 基因组学数据\n\n随着高通量仪器成本的下降，现在许多生物实验室能够随心产生数据。将基因组数据与其他大数据领域（如蛋白质组数据、天文学数据、粒子物理数据、网站资源（如\
  \ YouTube、Twitter）等）进行比较，通过大数据分析对基因组数据具有深刻的观点 [#29_Chapter18.xhtml_ref_5] 是至关重要的，因为基因组数据的产生速度极快，并具有特定的领域知识。\n\
  \n\n\n\n每年，天文学领域产生了超过 25 泽字节（ZB）的数据 [5]。同样的现象也出现在粒子物理学中，它产生了海量的原始数据。然而，在经过数据清洗和预处理后，只有极少的数据被用于存储和进一步分析。在基因组领域，每年产生约\
  \ 1 ZB 的数据。全球有 7000 多台高通量仪器，这些仪器分布在近 1000 个测序中心 [5]。据估计，在未来 10 年内，超过 120 万种报道动植物的测序基因组数据将被纳入其中。\n\
  \n基因组数据指的是生物体的基因组和 DNA/RNA 数据。通常，它是每个序列在字母数组中的表示。这本质上是一个化学和机械过程，用于将 DNA 和 RNA 中存在的信息“数字化”。除了这些数据外，其他可用的组学数据（包括转录组学、甲基化组学和代谢组学数据）可以分层整合，以加深我们从基因型到表表的进一步理解\
  \ [6]。无论是针对特定领域的研究考虑单一数据类型，还是整合相关数据类型以发现不同领域之间的知识，都需要一个基于生物学全面表示构建的数据驱动框架，以应对数据的激增并促进生物信息学研究。\n\
  \n例如，在我们最近的一项工作中，考虑到蛋白质组学数据是公开的且是基因组数据的表达，我们将大数据分析引入蛋白质组学领域，以促进生物学家的实验研究。具体而言，在蛋白质组学研究中，直接受益于蛋白质组学的是传染病。因此，在我们的工作中，病原体-宿主-蛋白质相互作用（PHPPI）被视为分子水平的关键感染过程，蛋白质组学数据的适当表示将引入高维问题，而在大数据集中，正负\
  \ PHPPI 之间的比例存在极度倾斜 [7]。这种极度倾斜的比例通常设置为 1:100 到 1:500。考虑到传染病的多样以及蛋白质组学数据的增加，该领域需要一个强大全面的模型来帮助生物学家分析这些蛋白质组学数据。\n\
  \n这些组学数据（包括基因组学、蛋白质组学等）彻底改变了系统生物学，有助于理解生物学机制 [8]。生成和解释这些数据的能力之间的差距不断扩大，带来了瓶颈和机遇。目前，定量实验的成本和难度是相对可控的，而挑战出现在数据分析阶段，涉及到数据管理、整合、分析和解释\
  \ [9]。现在这变得更具挑战性，因为精准医学近期备受关注，大数据分析与个性化医学研究人员的合作也变得非常有前景。\n\n### 18.1.3 面临的挑战\n\n\
  当数据变得极其巨大时，需要广泛的专门分析，但不同的大数据领域具有不同的领域知识。基因组序列的解释、DNA 表达分析，以及分子水平上突变和发育的研究是基因组学的核心愿景\
  \ [5]。结合大数据分析，需要整合生物学领域知识、数据科学，甚至具有强大计算能力的设施来实现这些目标。目前，生物学家内部及之间对于如何最好描述可用组学数据尚未达成共识\
  \ [10]，例如识别转录起始位点的位置 [11]。今天，许多研究机构和公司正在利用其专业领域知识来定义和探索自己的大数据解决方案，用于进一步的研究和应用 [12,13]。\n\
  \n由于基因组数据分析不再是生物学研究的瓶颈，因此需要一个高效的数据存储、传输和分析框架。与传统数据集不同，单个基因组测序文件可能是几个 GB；同时，高通量仪器的全球分布将促进形成一个快速且高质量的系统的研究。基因组领域的这些规范要求在数据获取、数据传输和数据分析方面进行更多考虑。\n\
  \n下一节深入介绍基因组领域以及通过与大数据分析合作提供的知识。在第三部分，我们将详细介绍基因组领域数据科学的现状。\n\n### 18.2 基因组数据驱动的领域知识：深度视角\n\
  \n“大数据”的通用定义包括使用归纳统计和非线性系统识别概念，从大数据集中推断规律（回归、非线性关系和因果效应），以揭示关系、依赖性，并对结果和行为进行预测。到目前，DNA\
  \ 数据洪流来自成千上万源。全球分布着 7000 多台测序仪器，产生基因组数据，迟早会有数万台分析仪器。因此，存储和计算负担都在剧增。尽管面临这些挑战，如何缩小差距并在基因组数据与我们想要发现的领域知识之间建立高效的连接是一个紧迫的研究问题。精准医学和癌症基因组学是我们在本节讨论的两个主要子领域。\n\
  \n### 18.2.1 精准医学的知识\n\n随着基因组数据以惊人的速度和数量堆积，生物医学领域日益转向数据科学的交叉学科 [10,14,15]。具体而言，它为精准和个性化研究带来了极具前景的机遇，即\
  \ P4 医学：预测性、预防性、参与性和个性化 [16]。\n\n\n\n\n\n2015 年 1 月 20 日，美国总统巴拉克·奥巴马宣布启动了一项新的精准医学倡议，该计划将密切关注癌症和糖尿病等疾病的治疗。其最终目标是根据个性化信息制定医疗解决方案，以保持人体健康。\n\
  \n根据参考文献 17 中精准医学的定义，除了其他生物数据库外，考虑个体信息对于对疾病制定可能的预防和治疗方案至关重要。尽管高通量技术的发展降低了数据获取的成本，但电子医疗系统在数据获取方面仍处于早期阶段。目前，精准医学中讨论涉及两个主要部分：针对特定疾病的短期个性化治疗方案，以及为了促进健康的长期知识提取[12]。研究人员提出了一个如图\
  \ 18.2 所示的个性化医学基本框架。积累的基因组数据也模拟了系统生物学的发展，这是一种用于应对生物系统复杂性并解释其在所有组织水平上的行为和相互作用的整合性研究策略[18]。\n\
  \n精准医学受益于海量的医疗数据，这些数据在基因、生物功能与相关疾病之间建立了新的联系[18–21]。类似于蛋白质组学领域，在系统生物学中组装基因组数据可以提供可靠的生物相互作用图谱图形表示，并进一步计算有机体和疾病的预测动态模型。蛋白质相互作用识别的进展降低了假阳性率，提高了策划数据集的质量[22,23]。与基因组数据相结合，一项利用机器学习方法识别基因组序列转录起始位点位置的研究[11]已经是一个良好的开端。预计还将在剪接位点、启动子或定位核小体识别上开展类似的研究[24–27]。\n\
  \n![fig18_2.jpg](img/fig18_2.jpg)\n\n图 18.2 个性化医学的基本框架。（来自 Akram Alyass 等人，*BMC\
  \ Medical Genomics*, 8(1):33, 2015.）\n\n基因组相关医学研究被称为“基因组学医学”[28]，其共识定义为“在临床护理中使用个体患者的基因型信息”[29]。然而，实现有效精准医学解决方案的方法目前在结合基因组数据方面处于非常早的阶段。隐私协议问题将成为电子医疗系统开发和基因组数据测序阶段的障碍。\n\
  \n为了生成精准医学解决方案，不仅涉及基因组数据，还会涉及其他组学数据，特别是电子健康记录。这种特定的愿景提供了一个类似于生理学和病理生理学的分层框架，其中认为“遗传可以确定地解释我们的基因组可能准确指示个体患疾病风险的特征”[30]。治疗相关研究已完成一些特定示例，例如讨论了`CYP2D6`\
  \ 在乳腺癌他莫昔芬治疗决策中的相关性[31]，该研究试图解释癌症的基因型-表型关联。\n\n理性的精准医学方案需要每个人的基因组图谱，这不仅引发了伦理或法律问题，还有建模、计算和分析能力的问题。尽管现在通过基因检测已实现了近\
  \ 2000 种临床，但有效的电子健康记录（`EHRs`）仍需以高效的方式进一步开发，从而产生全面且个体特有的数据[32]。精准医学的最终目标是在正确的时间、以正确的剂量提供最准确的治疗，使疾病后果最小化且疗效最大化[33,34]。\n\
  \n### 18.2.2 癌症基因组学\n\n在海量的基因组数据中，大数据分析提供了一种新范式，将信息检索到相关的领域知识。除了精准医学领域，其他几个研究领域如功能性状研究[35]、水稻基因组项目[36]以及植物基因组注释和功能预测[37]，也随着基因组数据的增加而兴起。在本节中，我们将讨论另一个主要领域：癌症基因组学，涵盖了癌症机制研究、突变预防与检测以及癌症治疗。作为迈向精准医学的重要一步，癌症基因组学研究是最重要的发现科学领域之一[38]。\n\
  \n从基因组学到精准医学的提议范式所示图 18.3。基因组学与精准医学之间的差距很大，弥补这一差距并非易事。主要的伦理证明、数据分析和领域知识的整合是第一层障碍。需要患者的同意才能进行数据生成。此外，需要一种高效的基于知识的系统来处理数据以实现功能性研究。由于癌症被认为是基因突变疾病，生物学家从癌症肿瘤中学到的越多，就越相信每一个癌症肿瘤都是一组特定基因变化的表现。尽管由于癌症研究与治疗决策之间的差距，其临床影响目前有限，但癌症基因组学被认为影响癌症研究的每一个角落，并将成为个性化癌症医学的关键链接[39,40]。\n\
  \n![fig18_3.jpg](img/fig18_3.jpg)\n\n从从癌症基因组学到个性化医学。（来自 Lynda Chin 等人，*Nature Medicine*,\
  \ 17(3):297–303, 2011.）\n\n癌症基因组学领域的大多数数据科学研究集中在模式检测问题上。我们之前的工作的目标是对基因组数据集实现快速准确的癌症亚型分类。机器学习技术是分类中最流行的方法。具体而言，极限学习机（`ELM`）、支持向量机（`SVM`）、通用向量机（`GVM`）以及先进的深度学习方法已应用于基因表达数据分类问题[41,42]。在癌症基因组数据集的分类问题中，样本量小和高维度是模型开发的两个主要障碍。随着癌症基因组数据的堆积，高维大数据将在将来出现，这应该是大数据领域机器学习应用中一个重要但具有挑战性的分支。\n\
  \n\n\n\n\n在癌症基因组学领域有两个主要的联盟，分别是癌症基因组图谱（TCGA）研究网络和国际癌症基因组联盟（ICGC）。来自 1000 多名患者的肿瘤和健康细胞已完成测序，TCGA\
  \ 记录了跨 34 种癌症类型的分子差异。这些数据目前存储在加州大学圣克鲁斯斯分校的癌症基因组中心（`UCSC`）。此外，对于 ICGC，已经分析了超过 666\
  \ TB 的数据。最近的 `ICGC` 数据发布版本为 21，包含 68 个不同的癌症项目，涵盖 18,677 名捐赠者。这些数据存储在不同的存储库中，例如欧洲基因组表型档案馆（`EGA-Hinxton`）、泛癌症全基因分析（`PCAWG`）、芝加哥大学的基因组数据共同（`GDC`）等。受益于云计算技术，越来越多的数据正被传输到亚马逊服务（`AWS`）。图\
  \ 18.4 显示了 ICGC 的统计图。同时，Broads 基因数据分析中心（`GDAC`）是另一个基因组数据中心，通过其计算框架处理 TCGA 数据以生成分析报告。图\
  \ 18.5 中计算框架所示的流水线被称为 `Firehose`。\n\n![fig18_4.jpg](img/fig18_4.jpg)\n\n图 18.4 ICGC\
  \ 数据门户的统计图。\n\n![fig18_5.jpg](img/fig18_5.jpg)\n\n图 18.5 Broads 基因数据分析中心：Firehose。（来自\
  \ Vivien Marx. *Nature Methods*, 10(4):293–297, 2013.）\n\n然而，大多数正在进行的工作仍然集中在数据获取和存储上。特别是对于某些受控数据，伦理和法律政策仍需要更多的整合努力和适当的流程来处理。一项深入分析，例如一项特定的发现——即“癌症基因组图谱研究网络”（`TCGA`）在\
  \ 170 多例鳞状细胞肺癌中发现 `HLA-A` 基因中此前未报道的缺失功能突变 [43]，展示了网络协作的力量和重要。除了 TCGA，这些数据还需要更公开提供给全球研究人员以促进分析。\n\
  \n受益于高通量技术的优势，癌症基因组学能够比较肿瘤细胞与正常细胞之间的基因组序列、表观基因组图谱甚至转录组数据 [44]。随着对基因组异常的研究日益激发人们关注终极目标，即个性化癌症医学，癌症基因组学的未来重点将落在识别新的遗传异常\
  \ [45]，这是揭示癌症机制的关键方面。具体而言，由于癌症大多是由于基因组体细胞突变引起，并受到表观遗传和转录组变化的额外影响，深入分析的一个方向主要关注癌症基因组数据中的体细胞突变。这种对体细胞突变研究的关注使个性化癌症医学指日可及\
  \ [46]，其中三个主要挑战被认为是关键障碍。第一个问题是从短序列读段中识别体细胞突变，第二个问题是区分负责癌症发生和进展的微小体细胞突变，最后一个是确定由这些体细胞突变表达的正在发展的生物通路和过程\
  \ [45]。\n\n随着通过癌症基因组学研究癌症机制，癌症治疗的研究也是癌症基因组学的另一个主要领域。通过对癌症分子机制的加强理解，将基因组数据转化为以改进癌症的预防、早期检测、诊断和治疗具有重要意义\
  \ [47]。这将成为现代肿瘤学中癌症基因组学与精准医学（尤其是个性化癌症医学）之间的联系。由于 `DNAs` 和 `RNAs` 的极微变化可能对表型产生大规模影响\
  \ [48]，我们从癌症基因组学中提取的知识越多，我们就能越深入、越接近地获得精准治疗。\n\n在基因表达水平高或低与对特定化合物敏感性或耐药性增加之间的关联领域，早期研究正在进行中\
  \ [39,49]。由于 TCGA 和 ICGC 正在产生大量的癌症基因组数据，全基因组测序和靶向基因组测序都有望揭示个体基因组变异信息 [40,45]。与基因组相关的癌症治疗研究旨在从癌症发生和进展的角度，基于患者肿瘤的基因组变异检测分子靶向疗法\
  \ [50,51]。参考文献 52 介绍了一项基于整合分析复杂的癌症基因组和临床特征的特定研究。专注于多维癌症基因组数据的可视化和分析，参考文献 52 提供了一个门户，即\
  \ `cBioPortal`，来处理海如而来的数据。目前，用户能够查看跨样本的某些基本模式，甚至将这些模式与临床结果联系起来。然而，`cBioPortal` 的未来方向是包含更多类型和临床属性。相关的基因组数据类型包括体细胞突变、DNA\
  \ 拷贝数变异 (`CNAs`)、mRNA 和微 RNA (`miRNA`) 表达、DNA 甲基化和蛋白质组数据。批量下载完整数据集也是预期。\n\n精准医学研究与癌症基因组学之间的差距很大，目前将基因组数据转化为表型的研究力量尚未缩小差距并将这两个领域联系起来。这引起了数据科学，特别是大数据相关研究引入该领域的兴趣。关注基因组领域大数据分析的早期阶段，我们将在下一节讨论基因组数据管理和分析。\n\
  \n### 18.3 基因组学新兴的大数据格局](#29_Chapter18.xhtml_sec18_3)\n\n如前章节所述，为了适应基因组领域的大数据分析技术，需要一个由生物信息学、生物数学和生物统计学组成的科学社区来将基因组数据转化为其生物学意义，这针对精准医学和癌症基因组学领域\
  \ [8,9,53]。在生物信息学领域数据密集型研究的转型点，我们能够破解疾病发生和进展机制的潜在线索，并为有效的预防和治疗提供进一步的新策略。在这些期望内部，将大数据分析技术钻入基因组数据的努力面临许多挑战和未来的研究方向。尽管很少有研究能揭示并建立通用或特定的模型来发现基因组数据的内在价值以进一步研究疾病机制、干预和治疗，但瓶颈已经从基因组数据分析转移到了数据管理，包括获取、传输和存储。\n\
  \n\n\n\n\n数据集的基础“生命周期”涵盖数据获取、数据传输、数据存储和数据分析。在生物信息学中，2000 年典型的初始化数据集大小约为 2.5 GB，该数据公开发布在加州大学圣克拉鲁斯分校的文件传输协议网站上[54]。到\
  \ 2012 年，癌症基因组学中心（CGHub）报告的数据集大小约为 170 TB[55,56]。除了数据集的大小外，计算基础设施和软件工具还需要满足分析任务的需求。与天文学数据相比，基因组学数据具有更高的异质性[5]，考虑到现在即使单个人类测序基因组的大小约为\
  \ 140 GB，这带来了更多的挑战。\n\n在基因组学领域利用和优化大数据技术，需要数据科学方面的特殊专业知识和经验。如上所述，数据是解释这些内在含义的关键。在本节中，基因组学领域新兴的大数据格局将引入一些新观点，以克服数据集传输、存储和计算方面的挑战。\n\
  \n### 18.3.1 数据获取](#29_Chapter18.xhtml_sec18_3_1)\n\n根据参考文献 47 记录的设施，目前在 1027 个中心设有\
  \ 7389 台高通量“次代”测序机，其中大多数机器位于美国（5492 台）。这些机器是基因组学的主要数据获取途径。由于大多数机器位于美国，这些测序数据大多存储在由美国国立卫生协会/国家生物技术信息中心（NIH/NCBI）维护的序列读取归档库（SRA）中。除了这些直接测序数据外，TCGA\
  \ 和 ICGC 还存档了来自肿瘤和健康细胞的癌症基因组数据。基因组学数据具有异质性，且这些中心的研究重点各不相同。由于地理分布的原因，目前基因组学数据高度分散，并存储在不同的卫星站点。\n\
  \n对于这些高度分布的数据站点，短期内在一个单一站点建立全面的数据集存储库似乎是不可能的。除了向 AWS 传输数据外，ICGC 还有一个进行中的项目，将数据从不同的卫星站点传输到单一的可控存储库中，这被认为是一种更高效维护和分发数据的方法[13]。然而，对于其他大数据领域，数据获取途径和获取方式存在很大差异[5]。在天文学领域，天文数据由有限的专业设施获取[57,58]，而在视频领域，大多数视频数据来自基于几种标准协议的\
  \ YouTube 流媒体片段。fMRI（功能性磁共振成像）图像通过一些中心化设施以可控的转换格式进行采集。\n\n数据质量控制是基因组学数据的一个重要方面，因为这些数据通常是未对齐且含有噪声的。在某些情况下，数据值甚至缺失。仪器的电子内部波动导致整个分析过程中性能不一致。考虑已发布的数据集癌症药物敏感性基因组学项目，它包含了\
  \ 639 个癌症细胞系，由一组基因组特征描述[39]。然而，数据缺失问题使可用数据集从 639 个减少到 608 个，导致数据样本减少。要揭示这些数据背后的知识，仅仅设定数据分析目标是不够的，因为数据包含多个具有自身含义的层面，包括\
  \ DNA 测序数据、RNA 表达数据、miRNA 数据等。\n\n为了解决这些问题，需要通过数据分析方法完成缺失数据，并设计一个多层的合理数据整合模型。在数据获取阶段，对这些数据的混合理解至关重要，并可能带来更具意义和更好的知识发现。\n\
  \n### 18.3.2 数据传输](#29_Chapter18.xhtml_sec18_3_2)\n\n由于数据增长速度超过了摩尔定律，单一机构要在单机上托管自己的数据变得越来越具有挑战性。在未来\
  \ 10 年内，预计测序速度和容量将持续增长。由于合作日益频繁，TCGA 和 ICGC 的数据被存储在相应的门户中，每个合作者也维护着自己的数据。考虑到组学数据的异质性，由不同创始机构支持的各个社区也会产生自己的组学数据[59]。从数据门户向科学家高速共享和传输数据的动力已显著提高。\n\
  \n作为起始举措，一些 ICGC 数据被存储在欧洲基因组表型归档库[13]。同时，每个 ICGC 合作国家（由于 PCAWG 按国家划分的）和 AWS 也维护着自己的数据。然而，网络问题偶尔发生，给科学家们带来了不便。因此，现在正在建立一个中心数据库来托管所有解释后的数据。该中心数据库被选定位于安大略略癌症研究学院（OICR）。通过这种由单一门户站点进行中心化数据管理的策略，快速且稳定的连接对于数据传输至关重要。目前，位于中国深圳的华大基因（BGI）每天产生\
  \ 6 TB 的基因组数据。BGI 每天可以向客户传输 1 TB 的数据。通过探索多种互联网传输技术，BGI 愿景是从中国向加州大学圣地亚哥分校（UCSD）传输数据的速度可以达到每\
  \ 30 秒 24 GB[60]。然而，这种技术即`FASP`要求运营商维护极大的带宽，这使得基因组学领域的数据传输非常昂贵。\n\n互联网协议本身的改进将基因组学大数据传输的直接解决方案，例如\
  \ Internet2[61]。除了协议技术，对 DNA 序列读取（特别是`FASTQ`格式）进行数据压缩是加速数据传输的另一个方面[55,62]–65]。`FASTQ`格式是存储生物序列及其相应质量评分的标准格式。另一种提升数据传输速度的方法可以通过高效的数据分发来实现[55,63,66]。\n\
  \n然而，数据传输可能是应用基因组学大数据分析中不那么关键的瓶颈之一，而数据存储策略预计会显著影响处理的性能。由于单个基因组数据文件可能是几个 GB，且数据在全球范围内高度分布，无论在云端还是以原始格式本地存储都会受到限制。这引入了对基因组数据存储的讨论。\n\
  \n### 18.3.3 数据存储](#29_Chapter18.xhtml_sec18_3_3)\n\n\n\n\n\n如今，需要 PB 级的存储管理来应对许多大数据领域的存储需求。在基因组学领域，对存储的巨大需求主要来自原始基因组学数据。由于存储问题已被识别并从物理存储问题转移到数据本身，如今物理货运仍然是传输大量序列数据的主要方法[67]。因此，一种高效存储基因组数据的方法对于基因组数据而言仍然是一项重大挑战。\n\
  \n文献 68 引入了一种编码记录基因组序列与记录参考基因组序列之间差异的方法。考虑到单个人类基因组可能占用三个 GB 的存储空间，当达到 50,000 个人类基因组时，将达到\
  \ 150 TB[67]。与传统的数据压缩算法不同，生物信息学利用参考数据压缩算法来避免巨大的解压时间消耗，并保持原始序列数据的绝对保真性[5,69,70]。参考压缩序列的一个简单示例在图\
  \ 18.6 所示。基于这种压缩方案开发的算法可以达到 400:1 甚至更高的进化性压缩率[67,68]。如图 18.6 所示，参考序列被设置为“GCAAAACAAAGT”，而我们通常使用的是修订版剑桥参考序列\
  \ (rCRS)。它通过其坐标位置来表示。对于未压缩的序列“AAAGGCAAAATA”，匹配项 `(7,4)` 和 `(0,6)` 分别通过起始位置和长度表示“AAAG”和“GCAAAA”段。最后一段“TA”以其原始数据格式存储，因为在参考序列中没有良好的匹配。\n\
  \n![fig18_6.jpg](img/fig18_6.jpg)\n\n图 18.6A 参考压缩序列。（来自 Sebastian Wandelt. *Datenbank-Spektrum*,\
  \ 12(3):161–171, 2012.）\n\n实现最优的压缩算法并将其开发为标准是促进高效存储基因组数据的一项有前景的努力。然而，在基因组数据上使用压缩策略来解决数据存储问题仍然是研究人员面临的未决问题和挑战[67]。压缩速度与压缩率之间的平衡是关键问题之一。数据压缩后的另一个问题是如何直接利用这些压缩序列。尽管存储中有数据压缩方面，但数据约也是数据存储的一个主要方面，这为直接理解原始基因组数据提供了巨大的机会。一旦实时抽象方法变得成熟，这些原始数据将变得冗余，不再需要以其原始表示方式存储。\n\
  \n### 18.3.4 数据分析](#29_Chapter18.xhtml_sec18_3_4)\n\n数据分析是最关重要的最后阶段。当研究人员旨在从海量基因组数据中学习知识时，这是主要的挑战。功能性数据分析包括数据可视化、数据关系网络映射、数据关系规则提取和数据预测。基因组数据是异构且高维的，它完美地符合大数据的“四高”定义：即高容量、高速度、高多样性和高真实性[71–73]。\n\
  \n随着数据科学在海量数据的蓬勃发展，各种框架和工具已被开发。以 TCGA 为例，每两周，广播基因组数据分析中心 (GDAC) 使用计算框架 `Firehose`\
  \ 处理 TCGA 数据并发布简要报告，概述显著变化，并将甲基化状态与临床特征和突变基因相关联。同时，另一个框架 `SeqWare` 则考虑一小部分 ICGC\
  \ 数据来发布报告。\n\n数据分析的一个重要方面是数据可视化。在知识提取阶段，一个有用且重要的步骤是提供基因组数据的直观可视化，用以显示不同类型的变异。由于可视化技术已应用于许多领域，已经开发了诸如\
  \ `Circos`、`Gitools`、`UCSC Cancer Genomics Browser`、`Cancer Genome Workbench` 以及\
  \ `cBio Cancer Genomics Portal` 等工具[44,74–78]。可视化技术主要为癌症基因组学领域提供视觉探索，其中相关数据可以揭示癌症的起始基因和通路。文献\
  \ 37 中可视化了几个示例，包括区分肿瘤中癌症驱动基因组数据的变异、研究肿瘤样本中不同变异类型数据之间的因果关系、根据临床注释数据对肿瘤样本进行分层，以及在大染色体区域重排数据上的全局变异谱模式。癌症基因组学数据的可视化对于将癌症基因组数据知识转化为可能的个性化医疗至关重要。\n\
  \n由于机器学习已在几乎每个科学工程领域被广泛应用，它被认为是解释基因组数据并作为精准医疗的重要的重要工具箱[79–82]。基因组学中利用机器学习的一个示例是学习识别基因组中转录起始位点\
  \ `TSSs` 的位置[11,26]。作为机器学习与生物信息学的结合，它根据基因组学的情况形成了几种特殊模型，包括监督学习和无监督学习。\n\n引用“免费午餐定理”[83]，并没有一种适用于所有应用的完美机器学习算法。在生物信息学领域，特别是基因组学领域，手中的各种生物学知识对于选择合适的模型至关重要。然而，这通常隐含在先验知识映射到机器学习问题的框架中[26]。例如，有一项研究利用相关微生物群的全基因组序列数据，定量地将基因组数据与其功能性状联系起来[35]。在文献\
  \ 80 中，多层感知器 `MLP` 和径向基函数神经网络 `RBFNN` 都被用于利用基因组和表型数据预测个体属于感兴趣的表型类的的概率。\n\n连同其他几个问题，如异构数据的处理[84–89]、特征选择、不平衡数据集以及考虑不同数据源的数据缺失，使用机器学习方法在基因组学领域提供全面的分析和预测仍然面临挑战，但前景广阔。\n\
  \n\n\n\n\n简而言之，基因组学领域大数据分析的终极目标是能够解释基因组序列，并进一步解决基因型与表型数据之间的关系。为了实现这一目标，需要不同领域（包括数据科学、计算机科学、基因组学专家等）的混合理解与合作\
  \ [59,92–95]。在下一节中，我们将讨论两个主要项目：ENCODE 项目和 CGHub 项目，以展示大数据分析如何促进基因组学研究。\n\n## 18.4\
  \ 基因组学分析与生物信息学案例\n\n多项研究通过对基因组学大数据的分析，取得了极具启发性且有趣的成果。在本节中，我们将回顾一些先进的成就。其中一个是 ENCODE\
  \ 项目 [92]，另一个是 CGHub 项目 [55,56]。\n\n### 18.4.1 ENCODE\n\nENCODE（DNA 元素百科全书）项目旨在将人类基因组映射到其相应的功能元件。ENCODE\
  \ 于 2003 年启动，涉及 400 多位领先科学家，处理了超过 11,972 个文件，大小超过 15 TB 字节。美国国家基因组研究计划（NHGRI）建立了一个全球研究联盟。\n\
  \nENCODE 同时从两个阶段启动：试点阶段和技术开发阶段，目前 ENCODE 正处于第三阶段，即生产阶段。试点阶段测试并比较了现有方法，以严谨地分析人类基因组序列的定义部分，而技术开发阶段将\
  \ ENCODE 项目扩展到整个基因组的生产阶段，并辅以额外的试点规模研究。试点阶段报告于 2007 年 6 月发布 [96]。发现强调了该项目在识别和表征人类基因组功能元件方面的成功。技术开发阶段也取得了成功，促进了若干种新技术用于生成功能元件的高通量数据。\n\
  \n试点阶段和技术开发阶段的成功激励了 NHGRI 资助更多研究，以便 ENCODE 项目扩大到生产阶段。同时，生产阶段开始包含一个位于加州大学圣塔克鲁斯斯分校的数据协调中心，用于提供\
  \ ENCODE 数据的存储、分析和三个。目前，有来自 32 个实验室的 440 多位科学家参与 ENCODE 项目，任务分配给 ENCODE 联盟中不同的子小组，即生产中心、数据协调中心、数据分析中心、计算分析奖和技术开发工作。\n\
  \n试点阶段旨在识别当前检测功能序列的工具和数据中的空白，并评估可用方法在大规模场景下的效率。该阶段涉及了计算和实验方法来注释人类基因组。这些发现促进了对人类基因组功能的认知\
  \ [96]。目标人类基因组的 1% 区域通过多种且多样化的实验进行了研究。报告涵盖了基因组转录过程、转录调节、染色质结构的复杂视角，以及用于人类基因组功能新机理和进化见解的数据整合。试点阶段帮助定义了一条更全面的路径，用以理解人类基因组的功能元件。\n\
  \n2007 年 9 月，ENCODE 项目启动了生产阶段。作为试点阶段和技术开发阶段的益处，建立了一个组织的基因组学研究框架，其中原始序列数据作为底层，上方配有注释层\
  \ [97]。该数据模型促进了人类基因组知识挖掘的研究 [92,98–103]。随着数据的不断积累，当各种数据集层层叠在一起 [104] 以应对复杂复杂的基因组机制和疾病时，真正的改进开始了。图\
  \ 18.7 显示了 ENCODE 项目的图。目前，已检查了 60 种已知组蛋白修饰中的 13 以及 1800 个转录因子中的 120 个，这对关于基因型-表型关系的复杂基因组机制研究非常有益。当各种数据在\
  \ ENCODE 项目中分层整合时，生物学家角度的基因组数据视角发生了变化，并向数据密集型研究转型。\n\n![fig18_7.jpg](img/fig18_7.jpg)\n\
  \n图 18.7 ENCODE 项目示意图。（来自 Brendan Maher. *Nature*, 489(7414):46, 2012.）\n\n由于 ENCODE\
  \ 项目目前处于发现人类基因组功能元件的过程中，子小组 ENCODE 数据协调中心 (DCC) 在该项目中起着关键作用。良好的数据传输能力和完善的数据可视化工具是\
  \ ENCODE 联盟的基本要求。UCSC 上可用的 ENCODE 数据站点是 `http://genome.ucsc.edu/ENCODE/`。对于癌症基因组学研究，UCSC\
  \ 另一个名为 Cancer Genomics Hub 的站点已经对通过海量数据克服癌症产生了巨大影响 [55,56]。\n\n### 18.4.2 CGHub\n\
  \n根据与国家癌症研究所 (NCI) 的合同，癌症基因组枢纽 (CGHub) 是一个在线数据库，包含了癌症基因组图谱 (TCGA)、癌症细胞系百科全书 (CCLE)\
  \ 以及治疗性应用研究 (TARGET) 项目。该数据库拥有超过 1.4 PB 的数据。\n\n图 18.8 显示了通用 TCGA 数据流。癌症基因组是 CGHub\
  \ 的主要关注领域。考虑到第 18.3 节 中提到的数据获取和传输问题，开发了一种特殊的增强协议和设计的数据组织方法。\n\n![fig18_8.jpg](img/fig18_8.jpg)\n\
  \n图 18.8 CGHub 中的通用 TCGA 数据流。（来自 Christopher Wilks, Melissa S. Cline, Erich Weiler\
  \ 等. Database, 2014:bau093, 2014.）\n\n为了实现更高的网络服务，CGHub 利用了 Annai GeneTorrent (GT)\
  \ 协议。它是 BitTorrent (BT) 协议的增强版本。结合 IBM 通用文件系统 (GPFS)，CGHub 能够以高度并行且安全的模式传输数据。\n\n\
  由于 CGHub 上的存储数据大多是患者癌症基因组数据，因此具有高度机密性。只有授权的研究人员才能访问数据。在系统设计阶段，CGHub 部署了独立的身份验证和授权组件解决方案，即单点登录\
  \ (SSO) 架构，完全授权由 NCI 指派的数据访问委员会 (DAC) 控制。\n\n\n\n\n\n为了成为癌症基因组数据的安全存储库，存储和传输都需要进行加密。在`CGHub`\
  \ 中，每个单个基因组序列文件都实现了`SHA-1`（160 位）哈希和加密。基因组数据根据`Sequence Read Archive Metadata XML\
  \ schema`的定义进行存储，该标准在癌症基因组学界非常流行。结合可用的命令和接口，`CGHub` 是一个为癌症基因组学研究人员提供机密交互服务的集成系统。作为`CGHub`\
  \ 未来发展的扩展，数据获取和存储问题的扩充是极具前景的研究领域。此外，在数据传输方面的努力也将带来更多帮助，例如部署`Internet2`技术以增加网络速度\
  \ [13]。\n\n然而，为了解决精准医疗或癌症基因组学的可能解决方案，单一的站点或单一技术都无法实现所有目标 [105,106]。`DISSECT` 现在已能够利用计算机集群的分布式内存并行计算架构分析广泛的基因组数据\
  \ [105]。尽管数据处于限制条件下，`DISSECT` 显示了在大样本量上实现相同性能的能力。从数据共享的角度来看，从远来看，由于需要一种组学数据共享机制\
  \ [107]。基因组数据存储在全球的许多数据中心。为了揭示基因型-表型关系，提出了`BD2K`架构，以整合分离的基因组数据库并提供一个开源软件栈 [107]。一个凝聚的基因组信息学生态系统是所期望，并且正在快速发展。\n\
  \n## #18.5 总结\n\n利用大基因组数据对我们的生活和各个方面的研究都是一项挑战。生命科学、生物医学和医疗保健领域正处于向数据密集型科学发展的转折点，受益于海量的可用数据。当我们谈论大数据分析时，愿景不仅关乎研究产出，还关乎经济结果和其他利益，特别是涉及人类生活的。基因组数据引导我们进入一个新时代，利用异构数据和领域知识，以提取具有洞察力的知识来改善生活。\n\
  \n作为一个新兴的大数据领域，基因组数据的知识发现过程不仅需要丰富的数据，还需要利用相应的领域知识。在本章中，我们讨论了两个主要的关注领域：精准医疗和癌症基因组学。目前，对良好设计的框架的研究还很匮乏，这既耗时又昂贵。迫切需要混合的教育和合作来利用这些数据。图\
  \ 18.9 显示了用于数据科学应用的基本框架。在研究开发过程中，必须考虑几个方面，即可解释性（能够清晰地解释数据）、可重复性（可以镜像到其他研究中）、简单性（易于部署）和亲和力（计算能力的有效利用）。\n\
  \n![fig18_9.jpg](img/fig18_9.jpg)\n\n图 18.9 基因组学知识发现的合理框架。\n\n除了本章涉及的领域知识外，我们还回顾了国际上在基因组数据大数据分析方面的努力。在大数据分析中，数据是最重要的，这引入了获取、存储、传输和分析问题。只要在特定分析之前对高效数据操作有迫切需求，数据操作问题就会从几个方面进行考虑：数据获取、数据传输和数据存储。基因组数据高度分布和异构的特征对数据整合提出了特定要求。由于基因组领域既存在结构化数据也存在非结构化数据，云端或本地系统的分析都涉及对跨学科领域的混合理解。\n\
  \n我们还介绍了我们在基因组和蛋白质组大数据分析方面的一些工作 [7,41]。介绍了`ENCODE`项目和`CGHub`系统，以了解我们如何处理基因组数据以及这些数据如何彻底改变我们对生命的理解。从技术上说，法律和伦理问题是基因组领域首先考虑的。除了进一步研究基因组数据，还需要一个处理数据操作问题（专注于数据获取、传输和存储）的基础流水线以及一个面向数据分析的通用框架，以促进国际合作和研究。\n\
  \n我们刚刚达到了走向数据密集型生活和研究的转折点。在这些复杂且未知的数据中，大数据分析具有更好地理解和改善我们生活的潜力。作为一个处于萌阶段阶段，大数据分析技术与真实数据的激增带来了许多挑战和研究愿景。\n\
