  \ 通过能源交易降低绿色数据中心的能源成本](#13_Chapter02.xhtml_sec2_2_5\n\n云数据中心消耗大量的能量，导致高昂的能源成本和碳排放。为了同时降低能源成本和排放，人们一直在尝试通过诸如工作负载合并或将虚拟机合并到更少的服务器上，或使用\
  \ DVFS（动态电压频率调整）调整功率以节省能源等技术。然而，减少能量消耗只能减缓碳排放的增长 [62]。因此，其他人正在尝试使用可再生能源为数据中心供电以实现云数据中心的绿色。然而，可再生能源的高价格阻碍了其广泛使用。在本节中，我们提出了一种改进的调度架构，通过使用\
  \ ESD 和与电网进行能源交易来降低绿色云数据中心的能源成本，如图 2.5](#13_Chapter02.xhtml_fig2_5 所示。与现有工作不同，我们从以下三个方面考虑在数据中心绿色化降低降低能源成本：\n\
  1. 使用每个数据中心风力发电机和太阳能板产生的廉价绿色能源\n2. 在可再生能源供应充足时使用 ESD 存储可再生能源，或在电价低时存储绿电并在电价高时释放\n\
  3. 通过将能量（包括自产再生能源和存储在 ESD 内部的能量）卖回电网来获利，进一步降低总能源成本\n![fig2_5.jpg](img/fig2_5.jpg)\n\
