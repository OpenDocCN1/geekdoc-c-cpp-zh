  ## 3.6 大数据平台：HPC、云与数据中心\n\n\n### 3.6.2 SAP HANA\n\n\n## 3.7 结论\n\n\n\n\n\n大数据概念在过去几年中迅速出现，并以不同的方式被定义或表征。我们可以说，大数据是指无法通过传统的硬件/软件解决方案管理、处理或存储的数据集。管理数据面临的一些挑战包括数据集的维度极大，以及数据是持续产生的，或者在使用前需要对数据进行清洗以消除噪声或离群值\
  \ [2]。大数据的另一种表征方法是使用多 V 模型 [3]；其中一些 V 特性如下：\n\n- **多样性 (Variety)**：根据生成数据的源，分为结构化（定义良好的数据模型）、非结构化（未定义数据模型）、半结构化（无严格数据模型）或混合（多种类型）数据：收集周围环境条件的传感器、存储所有交易以便高级分析的零售商、基因组分析等。\n\
  - **速度 (Velocity)**：数据以不同的速度生成和处理：近实时方式（短小时间间隔）、实时（连续数据）或数据流。\n- **真实性 (Veracity)**：“清洗”数据以消除噪声或异常。\n\
  - **波动性 (Volatility)**：数据根据其有效性或重要性存储不同的时间。\n\n随着数据源的增加以及多个领域对大数据分析的需求，需要进行深入研究以构建高效获取数据（包括一些预处理和数据清洗）、存储或处理大数据分析应用的解决方案（图\
  \ 3.1），以提取价值信息。\n![fig3_1.jpg](img/fig3_1.jpg)\n\n**图 3.1** 大数据分析流程。\n### 大数据分析与多任务计算\n\
  \n#### 大数据分析示例\n\n多任务计算 (MTC) 概念被引入于 [9] 并经过了广泛的研究。它被定义为高性能计算 (HPC) 和高吞吐量计算 (HTC)\
  \ 的结合，指的是需要与大数据集交互并产生大量各种任务的应用：独立/流式、小型/大型，以及计算密集型/数据密集型。MTC 可以根据任务数量和数据集大小进行分类：大数据（极大的数据集和极大量的任务）、MapReduce（极大的数据集和相对较的任务）或\
  \ HTC（较小的数据集和极大量的任务）。因此，大数据可以被视为 MTC 的数据密集型子集。\n\n\n思考大数据概念时，主要的挑战是数据的获取、存储、处理和查询。为了高效处理大数据，已经开发了多种范式和解决方案，这些解决方案必须考虑到对应数据集的不同特性，例如数据多样性或数据的产生速度\
  \ [10]。\n\n\n- **批层 (Batch layer)**：存储主数据并在任何数据子集上计算原始函数。批层的代表性示例是 Hadoop 栈。\n-\
  \ **服务层 (Serving layer)**：随机访问批处理视图/结果，对视图建立索引，加载它们，并对批视图中的数据执行查询。\n\nMapReduce\
  \ 框架是大数据管理的重要解决方案，专用于分布式环境中使用廉价硬件处理极大型数据集。它在输入上使用 `map` 函数并使用 `reduce` 函数合并中间结果。Apache\
  \ MapReduce 框架实现依赖于 Hadoop 分布式文件系统 (`HDFS`) 和分布式数据库 `HTable`。尽管它被广泛使用，但 MapReduce\
  \ 要求作业一次性拥有所有可用数据，因此它可能不适用于需要实时处理或流式应用场景。已经开发了多种扩展来为该框架添加功能 [3]：Twister/HaLoop/Tez\
  \ 允许迭代、递归和批处理作业。另一方面，也出现了完全不同的范式和解决方案，以为实时大数据处理或处理流式处理提供支持。\n\n\n### 3.2.2.1 内存计算\n\
  \n\n\n\n\n内存存储和查询解决方案是内存数据库（IMDBs）和内存数据网格（IMDGs）。IMDB 将要查询的数据移动到主内存中。有原生的 IMDB（`HANA`\
  \ 或 `Altibase`）或带有内存扩展的传统数据库（`Oracle`）。对于 IMDG，数据可以在由廉价服务器构成的分布式系统中进行处理，并使用 `MapReduce`\
  \ 框架。一个重要的点是 IMC 与 IMDB 以及 IMDGs 之间的区别。IMC 是一种同时也处理计算的范式，考虑了任务调度以及决定是将数据移动到代码附近还是将代码移动到数据附近，而数据解决方案仅处理数据。内存数据解决方案可以作为\
  \ IMC 解决方案的构建模块。\n\n\n### 3.3.1 大数据的批处理\n大数据的批处理假设以固定的间隔分批处理海量数据 [14]。批处理最重要的通用实现方案是\
  \ `Apache Hadoop` 和 `MapReduce`。在 `Hadoop` 之上还构建了许多其他解决方案用于特殊目的：数据挖掘或机器学习。尽管批解决方案被广泛使用，但它们并不适用于实时处理（见图\
  \ 3.2)。\n![fig3_2.jpg](img/fig3_2.jpg)\n\n图 3.2 大数据任务类型。\n#### 3.3.1.1 Apache Apache\
  \ Hadoop 和 MapReduce\n`Apache Hadoop` [15] 平台是使用廉价机器集群进行大数据批处理的最重要解决方案。它依赖 `HDFS`\
  \ 作为分布式文件系统，依赖 `MapReduce` 作为并行编程模型，以及若干可以以服务形式提供的额外项目，这些可以安装在 `Hadoop` 集群中（`Hive`、`Pig`、`Mahout`）。`Hadoop`\
  \ 代表了一个可靠的框架，并且是一个完整的生态系统（提供了用于构建景观的各种服务）。\n\n\n#### 3.3.1.2 Apache Mahout\n`Apache\
  \ Mahout` 是用于可扩展数据挖掘和机器学习应用程序的库。`Mahout` 提供了多种机器学习算法实现。它在 `Hadoop` 上通过 `MapReduce`\
  \ 运行。主要设计目标是高效处理、易用性，或者便于与不同的数据存储集成和扩展。它已用于多个需要机器学习实现的应用，例如对维基百科的文章进行聚类 [17]、协同过滤\
  \ [18]，或生物信息学（在这种情况下也使用了聚类算法）。\n#### 3.3.1.3 Dryad\n`Dryad` 并行计算模型 [19] 允许构建在不同规模集群中良好扩展的应用程序。该框架基于数据流图执行，其中顶点是计算元素，边是通信通道。其主要目的之一是便于使用该框架编写程序。开发者不需要担心并行编程中的并发问题，而是必须编写几个顺序程序（“顶点”）并使用单向边将它们连接起来（数据流图是一个有向无环图）。\n\
  \n\n## 3.3.2 大数据流处理\n流处理模式是指在不完全存储数据的情况下处理输入数据：在线机器学习、实时分析、处理日志流或不同事件流 [20]。传统的批处理系统可以增强为类似于微基准测试的处理，但需要原生的流处理系统。`MapReduce`\
  \ 可以被增强以将摄入流分组为小批次。[21] 的作者提出了一种适用于在线/流水线聚合的在线 `Hadoop` 原型。对于需要单个 `MapReduce` 作业的计算，`map`\
  \ 和 `reduce` 阶段完全解耦；`reduce` 步骤不再拉取 `map` 结果，而是由 `map worker` 将其输出推送到 `reduce phase`\
  \ 中。\n基于 `Spark` 的流处理解决方案是 `Spark Streaming`，它实现了 `D-Streams` [22] 处理模型（离散流）。流计算由系列针对小时间间隔的确定性批处理组成，不需要同步。为了解决延迟挑战，使用了弹性数据集（`RDDs`）的数据结构将数据保留在内存中。基于每个批次状态的确定性以及未使用复制或同步的事实，当节点丢失时会触发并行恢复机制，由集群中的每个节点重新计算其\
  \ `RDDs` [23]。\n\n### 3.3.2.1 Apache Storm\n\n`Storm` 使用流计算问题的简单抽象（见图 3.3）。使用的概念是\
  \ `Tuples`——数据“单元”，即 `Stream` 的基本组件。`Spout` 生成原始数据流并根据不同的标准（如使用哈希函数分组）将它们发送到 `Bolts`。`Bolts`\
  \ 在输入流上应用不同的函数，如聚合、过滤或自定义函数，并可能输出发送到其他组件的其他流。`Topology` 将 `spouts` 和 `bolts` 连接在一起。\n\
  \n\n图 3.3 Storm 基础概念。\n\n\n\nStorm 架构 [20] 与 Hadoop 非常相似，由一个 `Nimbus` 主节点和多个工作节点（几个\
  \ `ZooKeeper` 节点和多个 `Supervisor` 节点）组成。Storm 拓扑（一个可执行程序）部署在主节点上。`Nimbus` 节点负责控制、运行调度并将任务分配发送给\
  \ `ZooKeeper` 节点。最新的节点联系 `Supervisors` 以发送分配信息。最后，`Supervisors` 根据分配信息启动从 `Nimbus`\
  \ 下载拓扑的 `Workers`。这些实现了具体的 Storm 拓扑。\n### 3.3.2.2 Apache S4 (#14_Chapter03.xhtml_sec3_3_2_2)\n\
  \n`S4`（简单可扩展流处理系统） [26] 是一种用于流处理的通用分布式引擎。它依赖于由通用硬件组成的去中心化集群：所有节点都是执行计算的处理元素 (`PEs`)，`PEs`\
  \ 之间的交互由被消耗/发射的输入/输出数据流组成。集群管理通过 `ZooKeeper` 服务处理，数据事件可以路由到适当的 `PE`，并且根据需要创建/删除\
  \ `PE` 实例。\n`S4` 提供了一个简单的编程接口。核心代码用 `Java` 编写，并设计为模块化、可插拔的通用架构，允许作为新模块进行自定义，因此开发者可以轻松地编写并部署作为\
  \ `S4` 作模块的应用程序。它最初由 `Yahoo!` 发布，后成为 `Apache` 项目，因此它在处理搜索查询的真实系统中经过了测试，并证明了良好的性能。\n\
  \n### 3.3.2.3 Apache Flink (#14_Chapter03.xhtml_sec3_3_2_3)\n`Flink` [27,28] 是一个用于分布式环境的开源大数据平台，自\
  \ 2009 年起（在一个研究小组中）开始开发，并于 2014 年成为 `Apache` 孵化项目。它提供了一个流式数据流引擎，处理集群中的数据分布和通信、容错性和可扩展性。它包含了用于流处理和批处理的\
  \ API 和组件，以及用于机器学习或复杂事件处理的库。\n\n`Flink` 为批处理和流式应用使用相同的运行时，它自己管理 `JVM` 内存以避免昂贵的垃圾回收器操作。`Flink`\
  \ 优化了迭代作业（如机器学习应用）和批处理程序（它缓存中间数据以避免 `shuffle` 或 `sort` 等昂贵操作）。`Flink` 可以与许多其他项目集成：`HDFS`、`Kafka`\
  \ 或 `Yarn`。\n### 3.3.2.4 Splunk (#14_Chapter03.xhtml_sec3_3_2_4)\n\n`Splunk` [29]\
  \ 是一个用于 IoT 大数据的实时、可扩展且多功能的平台。它从传感器、网络、应用程序或终端用户等不同源收集数据流，并允许用户通过 Web 界面进行搜索、监控和分析。`Splunk`\
  \ 提供了许多适用于不同用户的产品：`Splunk Enterprise`、`Splunk Cloud`（`Splunk Storm` 是其云版本）、轻量级服务，或用于\
  \ `Hadoop` 集群的平台 `HUNK`。独立应用程序是 `Splunk App for Stream`：它从网络收集流式应用程序性能数据，并在 `Splunk`\
  \ 平台上进行分析。\n`Splunk` 中的数据处理有几个主要阶段。数据在输入段作为流从源端获取；在不分析数据的情况下添加一些元数据。接下来，进入解析段，流根据内容被划分为事件，并在元数据中添加更多信息。然后对数据进行索引，将来自不同源的数据合并到集中索引中，并可以快速搜索。\n\
  \n### 3.4 内存计算 (#14_Chapter03.xhtml_sec3_4)\n`IMC`（内存计算）可以定义为一种在分布式系统（集群、云）中将数据存储在\
  \ `RAM` 中并并行处理的解决方案 [30。`IMC` 系统的核心思想是 `RAM` 应该是代码以及代码所处理数据的主要存储。在某些时刻，数据可能不再适合\
  \ `RAM`。在这种情况下，`IMC` 系统应该处理将数据置于第二个存储设备的机制。\n\n在传统的计算范式中，应用程序代码位于主内存中，所需的应用程序数据从硬盘调入主内存。如果我们将数据保留在分布式主内存中准备好进行处理，就可以避免与硬盘通信引入的延迟。到目前，主内存非常昂贵，因此保留在\
  \ `RAM` 中的数据量有限。此外，在大数据概念出现之前，还没有实现 `IMC` 框架的动力。`RAM` 成本的下降和对大数据实时处理需求的日益增长构成了该模型开发的动力。`IMC`\
  \ 的一些用例与产生大数据集的应用相同：医学医学影像处理、自然语言处理、实时情感分析或实时机器学习。市场对具有极大主内存的计算节点有需求。`Amazon` 宣布了新的\
  \ `X1` 物理服务器虚拟机，携带有高达 `2 TB` 的 `RAM` [31]，用于高需求应用或 `IMDBs`。\n`IMC` 是一个复杂的范式，它不仅指\
  \ `IMDB` 系统。本节剩余部分将涵盖 `IMC` 概念：内存缓存系统、`IMDGs`（内存数据网格）、`IMDBs`（内存数据库）以及内存处理系统或计算网\
  \ [13]。\n\n缓存对 I/O 优化起着重要作用，因为频繁访问的数据保留在进程内存中（即内存缓存），它还通过保留中间结果而不重新计算来优化 CPU 负载。缓存系统通常是分布式的内存中键值存储器，具有\
  \ `put`/`get` 操作，并可以通过 `read/write` 功能访问第二个存储设备。其他功能取决于具体实现，例如驱逐数据的策略或 `ACID` 事务。最近分布式缓存正在消失，因为\
  \ `IMDGs` 或 `IMDBs` 已经接管了缓存领域的挑战。\n`IMDBs` 的基本思想是数据保留在主内存中，磁盘用于备份、日志和不适合 `RAM` 的“冷”数据。关系型数据库自\
  \ 20 世纪 70 年代以来一直在开发和增强，数据组织成表和关系，并保证 `ACID` 属性。内存关系型数据库自 20 世纪 80 年代以来一直在研究，但得益于硬件进步，它们在最近十年出现。关系型\
  \ `IMDBs` 的示例包括 `SAP HANA` 或 `H-Store`。关系型 `IMDBs` 还关注表如何在内存中存储（在 `SAP HANA` 中，表数据可能以列形式存储）以及数据分区。在\
  \ `NoSQL` 数据库中，数据可以以键值、树或图的形式存储。出现了几种 `NoSQL` `IMDBs`：`MongoDB`（文档存储）、`RAMCloud`（内存键值存储）或\
  \ `Trinity`（内存分布式图数据库）。\n\n\n\nIMDGs（图 3.4a）也是分布在集群中的键值存储器，它们必须处理数据的高可用性（它们依赖缓存机制并接管内存缓存系统的职责）。与缓存系统相比，数据网格具有额外的功能。IMDGs\
  \ 的基本功能包括跨节点的数据分区和事务 ACID 支持。此外，我们可以参考 IMDG 对计算与数据共存（co-location）的支持，这意味着计算代码应该移动到集群节点内存存储的数据附近。只有当节点出现/丢失且数据需要重新分区时，数据才会移动。大规模并行处理（MPP）是\
  \ IMDGs 的另一个重要特征，它支持 SQL 和/或 MapReduce，这优化了跨集群的数据计算并可能响应复杂的数据处理。IMDGs 的设计允许它们随着集群规模良好地扩展，因为它们与内存数据库（IMDBs）不同，是原生可扩展的。\n\
  \n\n图 3.4(a) 内存数据网格；(b) Ignite IMDG 和 IMC。如果用户想升级基础设施以利用 IMC 的速度，有两种选择。第一种可能性是使用依赖现有数据库的\
  \ IMDG（IMDGs 与数据库系统高度集成），并对应用程序进行更改以利用新的 MPP、MapReduce 或其他 IMDG 特性。使用 IMDB 的另一种选择需要替换现有的数据库（除非它已经有了内存选项），但应用程序代码不需要重大更改。\n\
  \n\n## 3.5 技术综述 (#14_Chapter03.xhtml_sec3_5)\n\n\n### 3.5.1 Spark (#14_Chapter03.xhtml_sec3_5_1)\n\
  \n\n`Spark` 使用持久化模型来决定是将 `RDD` 持化在内存中、磁盘上还是两者中。当将 `RDD` 持化在内存中时，其他需要读取该 `RDD` 的后续应用程序可以在内存中获取它。轻量级的故障恢复机制依赖于事实：`RDD`\
  \ 拥有关于如何从其他 `RDD` 派生的信息（血缘关系 lineage）。\n\n\n![fig3_5.jpg](img/fig3_5.jpg)\n\n\n\
  ### 3.5.2 主内存 MapReduce (#14_Chapter00.xhtml_sec3_5_2)\n\n\n`M3R` 实现了内存执行并将键值序列存储在堆中。不保证恢复性；如果节点故障，则无法进行恢复。与传统的\
  \ `MapReduce` 引擎相比，改进如下：\n\n*   通过以下功能减少洗牌（shuffle）阶段的开销：共存——`M3R` 引擎处理 `mapper`\
  \ 必须向同一 JVM 中的 `reducer` 发送数据的情况，并避免了网络或 I/O 的参与；分区稳定性——跨 `reducers` 的键分区是确定性的，在迭代作业的情况下，与特定键关联的\
  \ `mapper` 将被分配到相同的键。\n\n## 3.6 大数据平台：HPC、云和数据中心 (#14_Chapter03.xhtml_sec3_6)\n\
  ### 3.6.1 Apache Ignite (#14_Chapter03.xhtml_sec3_6_1)\n\n`Apache Ignite` [34] 是一种内存数据织，将\
  \ `IMDG`、`IMC 网格` 和内存流等不同组件整合到同一个解决方案中。`Ignite` 是一个通用的 IMC 平台，得益于它的多个组件，适用于广泛用场景：HPC、数据网格、服务网格或流应用程序。`Apache\
  \ Ignite` 可与结构化（SQL）、非结构化（NoSQL）或半结构化（Hadoop）的多个底层数据存储工作，并对数据层提供实时交互式查询。它还提供了一个统一的\
  \ API，允许与云 IoT 或企业应用集成。\n从架构角度来看，`Apache Ignite` 是一种基于 `JVM` 的去中心化同构集群中间件软件（图 3.6）。它依赖于服务提供者接口（SPI）设计：每个组件都是模块化且可插的，因此系统高度高度配置性并能适应不同的基础设施。\n\
  \n![fig3_6.jpg](img/fig3_6.jpg)\n图 3.6 Apache Ignite 概述。\n\n`Ignite IMDG` 使用主内存作为主存储并提供分布式缓存作为键值存储器。与\
  \ `Spark` 相比，`Ignite` 提供了 `SQL` 内存索引，查询速度比原生 `Spark RDD` 情况快 100 倍。另一个重要特性是分布式 `SQL`\
  \ 连接或跨缓存连接。\n`Ignite` 内存计算网格提供了一个简单的 API 用于在集群中编写分布式计算或数据处理，例如 CPU 密集型应用程序或资源密集型任务（HPC\
  \ 或 MPP）。实现的内存计算网格的重要功能包括不同的并行处理范式，例如内存 `fork-join` 或内存 `map-reduce` 引擎实现。它还允许根据需要自动或手动（由用户/开发者配置）将代码与数据共存。`scheduler`\
  \ 平衡作业的负载分布并应用默认调度策略，但调度可以在代码中自定义 [34]。`检查点（Check-pointing）`允许保存适用于长时间运行的作业状态。\n\
  \n\n\n\n另一个重要组件是 Hadoop 加速器，它允许在内存中执行 Hadoop 作业和文件系统操作。该加速器包含一个内存文件系统的实现（`IGFS`），它与\
  \ `HDFS` 兼容，将文件系统数据存储在主内存中并优化 I/O 延迟。它提供了一个内存 MapReduce 实现，减少了传统 Hadoop 架构（名称节点、任务跟踪器）的一些开销，并且由于更快的调度过程和数据本地性感知节点（名称节点仅负责数据位置），在应用仅需少量更改的情况下，为\
  \ CPU 密集型任务提供了性能提升。\n内存流支持解决了各种无法被传统系统高效执行的大型数据应用。它允许以可扩展和容错的方式处理可能以不同速率（即使是每秒百万次事件）到达的无限数据流。它依赖数据网格来实现数据本地性。流在节点之间进行分区并在滑动窗口中进行处理。可以针对变化的数据注册连续查询。它与多个获取数据流并将其消费到\
  \ `Ignite` 缓存的解决方案集成：`Apache Flume Sink`、`Apache Kafka` 或 `Apache Camel Streamer`。\n\
  \n### 3.6.2 SAP HANA\n在 SAP 的案例中，IMC（内存计算）范式拥有悠的历史，SAP 技术在采用内存方法的过程中不断演进 [[35]]。`SAP\
  \ TREX` 是一种用于结构化数据（搜索和聚合业务数据）或非结构化数据（搜索和分类大量文档）的搜索引擎。由于使用了数据压缩，`TREX` 将索引加载到内存中，因此大量数据完全可以在内存中处理。接下来，`SAP\
  \ live Cache` 技术是一种混合数据库：它基于传统的关系型数据库 `SAP MaxDB`，并结合了内存数据存储和对象数据库技术。`SAP NetWeaver\
  \ Business Warehouse Accelerator` 专门加速报告查询，而 `SAP BusinessObjects Explorer Accelerated`\
  \ 扩展了 BW 加速器，提供了一个用于导航 BW 加速器中数据的前端。`SAP HANA` 是一种内存数据库（IMDB），它结合了以前内存解决方案的特征以及哈索·普拉特纳学院（HPI）的研究成果\
  \ [[36]]。\n\n因此，`SAP HANA` 是 SAP 数据管理平台的核心元素：一个 IMDB，其目的是为大型数据分析和聚合提供一个通用且强大的系统\
  \ [[37]]。它使用大量的主内存、集群中多个节点上的多核 CPU 以及 SSD 存储来提高性能。`SAP HANA` 有助于实现其目标的主要特征如下：\n\
  *   多查询引擎处理环境：提供对结构化、非结构化或半结构化数据的支持。允许对半结构化数据进行连接。它使用图引擎运行不同的算法（规划、供应链），使用文本引擎处理非结构化数据，使用关系引擎处理结构化数据。\n\
  *   在数据管理系统（而非应用层）中注册语义数据结构以及业务逻辑。\n*   利用硬件进步：存储设备、大量节点以及每个节点的许多核心、集群配置。\n\n`SAP\
  \ HANA` 应用适用于多个用例。在 [[38]] 中，我们可以找到 `SAP HANA` 的主要领域：用于 BI 分析的数据实时复制、使用表复制提高 `SAP\
  \ ERP` 系统中程序和报告的速度、作为 BW 的替代品、作为 `SAP ERP` 的替代品。\n\n\n### 3.6.3 XAP\n\n\nGigaSpaces\
  \ `XAP` 的主要组件如图 3.7 所示：\n\n*   `Core Middleware` 使用相同的空间模型，暴露 `JavaSpaces API` 和其他标准\
  \ API（如 `JCache` 或 `JDBC`）。在这一层，`IMDG` 提供数据缓存和分布式状态共享。\n*   `SLA-Driven Containers`（轻量级容器——Java\
  \ 进程）用于在动态环境中部署 `Processing Units`，它们依赖 `SLA` 定义。容器的主要目的是虚拟化底层计算资源。这些容器也可以用于在 `Processing\
