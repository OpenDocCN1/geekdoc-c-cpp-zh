  \n在本章中，首先，我们将在第 12.2 节中详细阐述需要解决的特定挑战。接下来，我们将在第 12.3 节中描述实时物联网数据处理架构。我们将在第 12.4 节中描述如何及时响应物联网系统生成的事件。第\
  \ 12.5 节中描述了如何处理数据洪，而第 12.6 节中介绍了数据分析技术。第 12.7 节中描述了实时数据处理的信息安全方面。最后，我们将在第 12.8\
  \ 节中总结本章的发现。\n\n### 12.2 挑战与技术](#23_Chapter12.xhtml_sec12_2)\n\n有效实现实时数据处理面临着多种挑战。在本节中，我们首先逐一列举这些问题。接下来，我们将描述为应对这些挑战而开发的技术。\n\
  \n主要的挑战是将传统的数据处理架构适配到物联网场景。由于物联网应用的分布式特性，很难将 `Apache Spark`、`Apache Hadoop`、`Apache\
  \ Flink` 等集中式数据处理架构映射并有效运行。许多此类大数据处理系统执行批处理，这要求数据位于单个位置（如扁平文件）。即使是传统的实时数据处理系统如 `Apache\
  \ Storm`、`IBM Infosphere Streams` 等，也是在集中计算机集群中进行处理的。将数据传输到此类位置并将处理结果传回设备的过程面临巨大的网络延迟。\n\
  \n物联网设备中大多数时钟容易受到漂移的影响。此外，网络中断是此类系统的常见现象。由于这些原因，许多物联网系统产生的数据流存在无序现象。因此，处理无序流的需求已比以往任何时候都成为重大的挑战。\n\
  \n数据采集协议对物联网数据流上进行的分析类型也起着至关重要的作用。这些协议需要是轻量级的。然而，根据情况，这些协议可能需要传输加密数据并承担不同级别的可靠性需求。表\
  \ 12.1 显示了一些著名物联网平台使用的通信协议详情。可以观察到，消息队列遥测传输（MQTT）是一种轻量级、开放、简单的客户端服务器发布/订阅消息传输协议，被许多物联网平台广泛使用。因此，旨在处理物联网数据的实时大数据系统需要支持如\
  \ `MQTT` 等广泛使用的协议。\n\n\n\n\n此外，与通用软件应用和服务相比，IoT 平台需要更高的信息安全措施。由于信息流跨越多个设备，并且有数万甚至数百万设备连接到此类\
  \ IoT 系统，这意味着在这种生态系统中发生信息安全违规的风险将会增加。因此，实时数据处理系统设计人员必须考虑部署适当信息安全措施的需求。\n\n## 12.3\
  \ 实时 IoT 数据处理架构\n\n实时数据处理在 IoT 数据处理中起着关键作用。实时数据处理的系统架构已经受到 IoT 数据不同使用模式的影响。以下是一些实时处理将非常有用的使用模式：\n\
  \n1.  提供一个实时仪表板，实时显示系统的当前状态。例如，下面的仪表板根据伦敦交通局（TFL）的数据馈送显示车辆的实时视图。同样，某些仪表板会实时更新，显示图表本身中数据的更新情况。\n\
  \n2.  根据简单或复杂的模式生成警报。例如，以下类 SQL 的查询，如果功耗在 10 分钟内增长了超过 30%，则将生成一个事件：\n\n```\nfrom\
  \ e1=PowerStream->PowerStream[power> 03 & (power-p.power)/p.power > 0.3] insert\
  \ into PowerAlerts\n```\n\n3.  针对汇入数据实时运行从批处理生成的机器学习模型。例如，使用批处理学习一个欺诈检测模型，并以实时方式将该模型应用于汇入数据。\n\
  \n4.  跟踪——跟踪资产、车辆、动物或人类，并在它们偏离预期行为时发出警报。\n\n5.  数据关联——关联来自多个数据流的数据并做出决策。由于数据连接（joins）是复杂的，这种处理在批处理中变得非常复杂，但可以使用复杂的事件处理（CEP）窗口轻松实现。\n\
  \n6.  Lambda 架构——将批处理和实时处理的数据相结合。\n\n7.  检测并切换到详细分析——检测到某种条件并切换到详细分析，例如，检测可疑用户并详细分析其行为（带有人工干预和批处理）。\n\
  \n使用 `Apache Hadoop` 或 `Apache Spark` 等批处理技术实现此类用例非常困难。批处理需要将数据写入磁盘，再次读取并以批样式进行处理。通常，通过调优，这些过程需要几分钟。相比之下，事件流处理（ESP）和\
  \ `CEP` 等实时技术旨在数秒或毫秒内产生结果，因为它们在内存中逐个事件或使用小批量处理数据。在 IoT 应用背景下进行的实时大数据处理架构开发工作可以分为系统架构级开发和协议级开发。接下来，我们将深入探讨这两个领域的细节。\n\
  \n### 12.3.1 数据处理架构\n\n在系统架构级开发方面，最近开发了若干新颖的实时数据处理系统，专门针对 IoT 运行环境，例如车载网络实时数据处理、企业通信系统、智能城市、智能电网等。\n\
  \n汽车嵌入数据流管理系统（AEDSMS）是一个通过 `DSMS` 对汽车嵌入系统进行数据集成和管理的平台。它是 IoT 背景下应用实时大数据处理技术的独特示例之一。`AEDSMS`\
  \ 的一个显著特征是，车辆运行的硬件和软件是在设计阶段确定的。`AEDSMS` 暴露了层级查询（HLQs）接口，该接口对物理结构的依赖性较低。`HLQs` 被编译为匹配物理结构的低级查询（LLQs）（图\
  \ 12.2）。\n\n![fig12_2.jpg](img/fig12_2.jpg)\n\n图 12.2 汽车嵌入数据流管理系统（AEDSMS）是一个为物联网开发的实时数据处理系统示例。（改编自\
  \ A. Yamaguchi et al., 2015, AEDSMS: Automotive embedded data stream management\
  \ system, In 2015 IEEE 31st International Conference on Data Engineering. Seoul,\
  \ pp. 1292–1303. doi: 10.1109/ICDE.2015.7113377。）\n\nAli 等人描述了一种减少 IoT 与在线企业通信系统差距的解决方案。他们的方法使用\
  \ `CQELS`（链接流上的连续查询评估）查询引擎实现了流处理和推理层，这是一种资源描述框架（RDF）流处理引擎。`CQELS` 支持通过 `AnsProlog`\
  \ 中的事件-条件-动作（ECA）规则将事件模式与动作关联起来来实现推理。\n\n同样，`CQELS` 在智能城市 IoT 中的应用也得到了开发。`ACEIS`\
  \ 是一个城市数据流的集成和自动发现系统。他们工作的一个重要特征是他们创建了一个复杂事件服务本体论，用于表示服务请求和语义事件服务。通过该本体论，`ACEIS`\
  \ 自动产生 `CQELS` 查询并将查询部署到 `CQELS` 引擎中。使用此类语义技术对于处理数据洪流问题（本章稍后会描述）非常重要。\n\nParStream\
  \ IoT 分析平台（如图 12.3 所示）是工业地理分布式边缘分析平台的示例。`ParStream` 接收来自各种连接到它的分析应用的 `SQL` 查询。`ParStream`\
  \ 查询被分解为每个节点的一系列较小的 `SQL` 查询。这些子查询与中心数据（这些小表）一起分发到联邦节点以执行连接。部分答案传回地理分布式分析处进行聚合。事件流分析可以在\
  \ `EdgeAnalyticsBoxes` 收集的数据上进行，这些设备专门为启用边缘分析而设计，也可以在具有特定处理和存储能力的标准硬件上执行。\n\n![fig12_3.jpg](img/fig12_3.jpg)\n\
  \n图 12.3 ParStream 的布布式架构。（改编自 R. Bloor and R. Jozwiak, 2014, A Database Platform\
  \ for the Internet of Things, The Bloor Group。）\n\n### 12.3.2 数据采集协议\n\n功耗效率、可靠性、数据足迹、安全性等是为\
  \ IoT 应用开发的通信协议的一些关键关注。在协议级开发方面，各个标准化机构（如万维网联盟 (W3C)、电气电子工程师学会 (IEEE)、互联网工程任务组 (IETF)、EPCglobal\
  \ 和欧洲电信标准协会 (ETSI））已发起了创建标准化方法的计划。\n\n在图 12.4 描述的协议中，诸如受限应用协议（CoAP）、`MQTT`、高级消息队列协议（AMQP）、扩展消息和存在协议（XMPP）以及数据分布服务（DDS）等应用协议对于\
  \ IoT 中的实时大数据处理具有重要意义。\n\n![fig12_4.jpg](img/fig12_4.jpg)\n\n\n\n\n图 12.4 IoT 网络协议与标准化工作。（源自\
  \ A. Al-Fuqaha et al., 2015, Internet of things: A survey on enabling technologies,\
  \ protocols, and applications. IEEE Communications Surveys & Tutorials, 17(4), 2347–2376,\
  \ Fourth quarter 2015\\. doi: 10.1109/COMST.2015.2444095。）\n\nCoAP 是一种基于 `HTTP`\
  \ 之上的表述状态转移（REST）的网传输协议 [16]。CoAP 默认基于 `UDP`，这使得 CoAP 更适用于 IoT 应用。此外，某些 `HTTP` 功能已经经过修改以满足\
  \ IoT 的需求，例如低功耗以及在噪声和丢包链路上的运行。由于 CoAP 是基于 `REST` 设计的，因此在 `REST`-CoAP 代理中两种协议之间很容易转换。\n\
  \n`MQTT` 协议基于发布/订阅模式开发，通过该模式由消息代理（message brokers）进行操作。消息代理既充当服务器，又在客户端之间转发消息，使得消息能够跨越防火墙边界。`MQTT`\
  \ 将嵌入式设备和网络与应用程序及中间件连接起来。`MQTT` 针对使用不稳定、低带宽链路的资源受限设备。`MQTT` 基于 `TCP` 协议。`MQTT` 已电表、Facebook\
  \ 通知、医疗保健、监控等多个应用。`MQTT` 是 IoT 和 M2M 通信理想的消息协议，能够为脆弱和低带宽网络中的小型、低成本、低功耗和低内存设备创建路由。\n\
  \n`AMQP` [17] 是一种面向 IoT 的应用层协议，专注于面向消息的环境。`AMQP` 通过 `TCP` 等可靠传输协议交换消息。`AMQP` 基于分层架构开发，其最底层具有一种高效的二进制、点对点协议，用于在网络上的两个进程之间传输消息。在\
  \ `AMQP` 的传输层之上定义了一个消息层。\n\n`DDS` 是一种以数据为中心的连接性中间件协议和 API 标准 [18]。`DDS` 架构设计为可从小设备到云的可扩展性。与\
  \ `MQTT` 或 `AMQP` 不同，`DDS` 依赖于无代理架构（brokerless architecture），并使用多播来为其应用维持卓越的服务质量（QoS）和高可靠性。\n\
  \n对上述协议的特征已进行了若干比较。丢包率是比较 `MQTT` 和 `CoAP` 时的一个重要指标。如果通信涉及丢包率低于 25% 的小尺寸消息，`CoAP`\
  \ 因产生的额外流量少而优于 `MQTT`。Caro 等人 [19] 也得出了类似的观察，他们发现在手机应用环境中，`CoAP` 的往返时间和带宽使用率比 `MQTT`\
  \ 小。还发现 `CoAP` 在传输时间和用量消耗方面比 `HTTP` 更高效。在大量消息交换的情况下，`AMQP` 产生的结果比 `RESTful` Web\
  \ 服务更好。在 IoT 数据的实时处理中，让 IoT 系统运行轻量级协议是非常重要的。然而，不同的协议在特定场景下会有良好的表现 [16]。IoT 数据收集协议的比较见表\
  \ 12.2。\n\n### 表 12.2\nIoT 应用协议之间的比较\n\n![page248-01.jpg](img/page248-01.jpg)\n\n\
  ## 12.4 及时响应\n\nIoT 实时大数据处理中需要解决的最重要问题是对生成的事件做出及时响应。如果我们查看引言部分列出的 IoT 用例，除了城市规划等少数用例外，这些用例的实用性要求我们立即对数据做出反应。例如，在居家、物流网络、交通和监控等用例中，信息的价值随时间推移急下降。在这种用例中，立即干预可以节省生命和金钱。例如，在\
  \ 2014 DEBS 大挑战中，四节点 CEP 集群进行了智能电表预测，每秒处理 80 万次事件，延迟小于 100 毫秒 [20]。这类数字通过批处理是不实现的。\n\
  \n### 12.4.1 IoT 中的批处理事件处理\n\n批处理事件处理（即批流处理）是一种分布式数据处理技术，它将循环的批处理计算建模为增量式批量追加的数据流。在这种范式中，查询或数据都可以进行批处理。在查询批处理中，在相同输入数据流上运行的多个查询系列的查询可以对齐，以便在新的批量更新发生时一起执行\
  \ [21]。在数据批处理中，流计算被执行在小时间间隔上的一系列确定性批处理计算 [22]。\n\n查询批处理提供了消除查询间冗余计算或 I/O 的能力，这是由于查询之间的空间相关性引起的。`Comet`\
  \ 是基于这一概念开发的系统。`Comet` 用户可以提交查询系列。`Comet` 实现了一套全局优化，利用了查询系列的概念。当新的批量更新到达时，会触发 `Comet`\
  \ 的查询执行器。在 `Comet` 中，一个查询被分解为多个子查询。`comet` 通过将来自不同查询系列的子查询对齐到大查询中，形成单一的大查询。对大查询进行优化以消除冗余并提高性能（图\
  \ 12.5）。\n\n![fig12_5.jpg](img/fig12_5.jpg)\n\n图 12.5 连续与批流处理范式。(a) 在连续处理模型中，节点接收到的每条记录都会被连续处理，并将新记录发送到下游。(b)\
  \ 在 D-Stream 模型中，在每个时间间隔内，到达的每条记录都可靠地存储在集群中，形成一个不可变的、分区的数据集。对该数据集进行处理以创建其他分布式数据集，表示程序输出或状态并传递给下一个间隔。\n\
  \n改编自 M. Zaharia, T. Das, H. Li, S. Shenker 和 I. Stoica, 2012, Discretized streams:\
  \ An efficient and faulttolerant model for stream processing on large clusters,\
  \ In Proceedings of the 4th USENIX Conference on Hot Topics in Cloud Computing (HotCloud’12).\
  \ USENIX Association, Berkeley, CA, USA, pp. 10–10。）\n\n在数据批处理技术中（D-Streams 模型也遵循了这一点），流计算被视为离散时间间隔上的一系列确定性批处理。在每个时间间隔内，数据可靠地存储在集群中，从而为该间隔创建一个输入数据集。一旦时间间隔完成，通过确定性并行操作处理该数据集。结果存储在弹性分布式数据集\
  \ (`RDDs`) 中，这是一种快速的存储抽象。\n\n\n\n\n延迟是决定大多数实时物联网（IoT）应用可用性的关键参数。在此类应用中，连续处理需要优先于数据批处理技术。这可以从第\
  \ 3.1 节中描述的数据处理架构中观察到。即使在事件处理系统层次结构的较高层使用了`-data-batching`技术，事件批处理间隔也需要尽可能选择较短的时间间隔，以避免过长的端到端事件处理延迟。\n\
  \n## 12.4.2 功耗与响应时间\n\n电池供电的分布式传感器面临着挑战，设备极有可能会丢失网络连接，甚至因电量耗尽而失效；低质量的传感器还可能产生错误的传感器读数。此类场景导致的数据丢失不应被视为特殊情况，而应被视为常态并进行处理。可以使用具有重叠覆盖区域的冗余传感器以及基于邻域的预测等技术，即使在数据丢失期间也能提供及时响应。\n\
  \nIoT 系统经常面临电力短缺的问题。电源问题可能出现在多个层面，例如传感器/设备层、雾计算（中间计算）设备、数据中心等。典型的能量感知数据流调度可以分为三类：基于硬件的技术（动态电源管理和动态电压频率调整）、基于软件的流调度技术（例如，虚拟机合并、弹性伸缩），以及基于应用程序的流调度技术（例如，任务复制）[23]。在大多数场景下，能量感知数据流调度技术中的功耗与响应时间之间存在权衡。如果系统可以在高功耗包范围内运行，则响应时间可以保持在最低水平。另一方面，电源可用性会降低，系统性能（以及响应时间）需要相应进行更新。\n\
  \n例如，Sun 等人[23] 使用能量模型来估算数据流环境中每个计算节点的能耗。他们研究了数据流计算中能耗、响应时间与资源利用率之间的关系，以产生满足高能效和低响应时间要求的条件。他们通过对非关键路径上的非关键查询算子进行能效合并，在不影响数据流图响应时间分布的情况下最大化能效[23]。关键路径是指数据流图中从源顶点\
  \ `vs` 到端顶点 `ve` 延迟最长的路径。所提出的 `Re-Stream` 系统在 `Apache Storm` 上实现了两个新模型：首先是基于关键顶点的实时调度模型，其次是能量感知合并模型。一个典型的观察是，流处理应用的响应时间随输入数据速率的增加而增加。同样，输入数据速率的增加会导致能耗率的增加。然而，在所提出的\
  \ `Re-Stream` 方法中，可能存在一个甜点输入数据速率，尽管输入数据速率较大，能耗仍保持在低水平。\n\n在具有弹性伸缩能力的性能敏感型流处理应用中，有必要通过保持实际\
  \ `QoS` 接近用户规范来避免不必要的或频繁的重新配置[24]。这种技术允许以成本效益的方式提供高性能。Matteis 等人[24] 将此类弹性流处理系统的运行成本建模为\
  \ `L`，其中：\n\n![eq12_1](img/eq12_1.jpg)\n\n![eq12_2](img/eq12_2.jpg)\n\n对于不同的功耗水平，我们可以找到与历史工作负载相比使性能最大化的资源分配，从而确定是否在期望响应时间略微增加（例如增加\
  \ 50 ms）的情况下，可以实现功耗的显著降低[25]。在实时 IoT 数据处理应用的背景下，我们还可以预测为了显著降低响应时间需要多少电量。\n\n## 12.5\
  \ 处理数据洪流\n\nIoT 实时大数据处理中需要解决的第二个最重要问题是如何处理 IoT 传感器产生的海量数据。处理 IoT 传感器产生的数据激增显然有两种方法方法：要么对数据进行摘要以匹配当前的计算环境，或者提供环境以满足增长的需求。在大多数用例中都采用了前者的方法，因为大多数时间里，价值存在于及时处理的信息中，而非原始数据。\n\
  \n### 12.5.1 数据摘要\n\n可以采用各种数据摘要技术来减少系统需要处理的数据规模。数据摘要算法以及边缘分析、补充传感器读数等技术可用于构建有效的数据摘要流水线。接下来我们将介绍这些技术的细节。\n\
  \n### 12.5.1.1 边缘分析\n\n数据摘要领域的解决方案之一是边缘分析。在这种技术中，对传感器生成的原始数据进行部分处理以提取摘要信息，然后将其传输到系统的更高级别。Cisco\
  \ 咨询服务的一项分析表明，对于年销售额为 2000 万美元并拥有 100 台安全视频分析摄像头的零售店，边缘计算/分析每年可以节省 33,800 美元，并带来\
  \ 1.7% 的年度 `EBIT` 增长[3]。根据国际数据公司 (IDC)，到 2018 年，IoT 系统产生的约 40% 数据将在网络边缘或附近处理[26]。目前存在多种边缘分析的变体和相关的系统架构。有许多使用边缘分析构建的著名\
  \ IoT 平台。其中，`ParStream IoT Analytics Platform`（在第 3.1 节中描述）是执行边缘分析的著名系统之一。另一个例子是\
  \ `Dell Edge Gateway 5000 系列`，它可以安全地从各种传感器和设备聚合并转发数据[27]。这些网关由 `Intel Atom` 处理器组成，提供了网关本身进行本地分析的能力，从而允许向下一层发送有意义的信息。下一层可以是另一个网关、数据中心或云端。\n\
  \n向集中事件处理集群发送多少数据的决策可以由边缘节点决定，也可以由集中服务器集群决定。例如，如果测量值的变化率很高或发生波动，边缘节点可能会在假设末端发生了某些有趣事件的情况下以更高的频率发送事件；或者，如果中心处理节点预测传感器区域可能出现异常情况，它可以要求传感器以更高的频率发送事件。边缘计算基础设施的成本可以通过本地处理传感器数据所降低的带宽、存储和处理成本轻松抵消[3]。\n\
  \n\n\n\n雾计算是边缘分析的一种变体，它将云计算范式向边缘分析扩展。简单来说，雾计算是一个高度虚拟化的平台，在终端设备和传统云数据数据中心之间提供计算、存储和网络服务。雾服务可以托管在网络中，也可以托管在终端设备（如机顶盒或访问点）中。这提供了结合边缘智能与近性的优势，从而流媒体应用获得可预测的延迟。雾计算的一些关键特征包括地理分布性、海量节点、支持移动性、实时交互、无线访问的主导地位、异构性、互操作性与联邦化、支持在线分析以及与云的交互\
  \ [28] (图 12.6)。\n\n![fig12_6.jpg](img/fig12_6.jpg)\n\n图 12.6 从雾到云的数据移动。雾数据服务在其中起到协调员的作用。（改编自\
  \ Cisco, 2015, Cisco Fog Computing Solutions: Unleash the Power of the Internet\
  \ of Things, Cisco Systems, Inc.）\n\n### 12.5.1.2 补充传感器读数](#23_Chapter12.xhtml_sec12_5_1_2)\n\
  \n补充传感器读数是在传感器无法以连续方式发送读数、当传感器的某些读数可以从其他属性推导出、发送这些值没有必要且可以在服务器端计算时使用的技术之一。在没有数学模型的情况下，可以使用机器学习技术来估计传感器读数。在这种情况下，为了验证正确性并调整误差，可以以低频率定期发送实际读数。当传感器的采样率不足以捕捉所需的真实世界细节水平时，使用这种传感器读数补充技术是不可避免的。这被称为数据失真\
  \ [30]。查询执行成本可能远大于获得合理可靠答案的成本。\n\n将真实世界的统计模型整合到传感器网络查询处理架构中可以帮助解决这个问题。在这种技术中，只有当模型本身无法以接受的置信度回答查询时，才需要使用传感器读取数据\
  \ [30]。任何简单的统计模型都可以捕捉传感器之间的相关性。例如，地理位置靠近的传感器所读取的温度值可能具有相关性。在这种情况下，一个传感器的读数可以用于改进其他读数的估计。在这样的系统中，温度测量同时具有时间相关性和空间相关性。传感器测量的历史值有助于估计随后的温度。这种时间相关性可以用动态概率模型来表示。在该模型中，对于每个离散时间索引\
  \ `t`，需要估计一个由 `p(X1t, … , Xnt|o1…t)` 表示的概率密度函数 (`pdf`)，该函数在给定 `O1…t`（截至时间 `t` 的所有观测值）的情况下，为\
  \ `t` 时属性的每个联合赋值分配概率。该系统随时间的演化允许计算时间 `t+1` 时属性的每个联合赋值的概率，如 ![inline252-01.jpg](img/inline252-01.jpg)所示。因此，截至时间\
  \ `t` 的所有测量都可以改进时间 `t+1` 时 `pdf` 的估计。\n\n在转移模型的帮助下，可以通过简单的边缘化操作计算 `p(X1t+1, … ,\
  \ Xnt+1|o1…t)`，如下：\n\n```\n![eq12_3](img/eq12_3.jpg)\n```\n\n其中假设转移模型 `p(Xt+1|Xt)`\
  \ 对于所有时间 `t` 都是相同的。例如，由于全天温度温度发生不同类型的变化（增加/减少），转移模型在一天中不同的时间需要是不同的。\n\n一旦获得 `p(X1t+1,\
  \ … , Xnt+1|o1…t)`，就可以利用时间 `t + 1` 处的测量值 `ot+1` 来获得 `p(x1t+1, … , xnt+1|o1…(t+1))`，在给定截至时间\
  \ `t+1` 的所有测量值的情况下，可以计算 `t+1` 时的后验分布。该过程持续到 `t + 2`、`t + 3` 等。初始时间 `t = 0` 的 `pdf`\
  \ `p (X10, … , Xn0)` 使用属性 `X1, … , Xn` 的先验分布初始化。通过转移模型输入时间 `t` 的密度估计，然后根据时间 `t +\
  \ 1` 的测量值进行条件限制的过程通常被称为滤波。滤波允许根据观测的完整历史进行条件估计，这可以显著减少获取系统查询置信近似所需的观测值数量。\n\n对于高斯分布，该滤波过程被称为卡尔曼滤波（Kalman\
  \ filter）[31]。在卡尔曼滤波中，转移模型 `p(X1t+1, … , Xnt+1|xt1, … , xtn)` 是通过两个步骤学习的数据。首先，需要为联合密度\
  \ `p(X1t+1, … , Xnt+1,x1t, … , xnt)` 学习一个均值和协方差矩阵。\n\n```\np(X^{(t + 1)} \\mid X^{t})\
  \ = \\frac{p(X^{(t + 1)},X^{t})}{p(X^{t})}\n```\n\n（注：此处原文中 `...Xnt+1|o1…t)` 后 就可以利用时间\
  \ `t + 1` 处的测量值 `ot+1` 来获得 `p(x1t+1, … , xnt+1|o1…(t+1))`，对应的公式推断为贝叶斯公式）\n\n一旦计算出转移模型，就可以以类似的方式回答查询。滤波的一个实际示例是人类轨迹处理。考虑一个携带\
  \ iBeacon 传感器（如智能手机）的人在 iBeacon 区域内行走的场景。iBeacon 发出的信号被 iBeacon 传感器接收。通过对 iBeacon\
  \ 传感器检测到的 iBeacon 位置进行三角测量，构建特定时刻人的位置近似（参见图 12.7）。然而，通过这种三角测量获得的位置 `P(x,y)` 是该人在特定时刻精确位置的粗略估计。这是由于多个原因，例如不同\
  \ Beacon 发出的信号被 iBeacon 传感器接收时信号强度相似、时间不同、iBeacon 传感器采样率低、事件乱序等。如果 iBeacon 传感器以低频率运行，人员轨迹的突然变化将无法被正确捕捉（图\
  \ 12.7）。\n\n![fig12_7.jpg](img/fig12_7.jpg)\n\n图 12.7 一人携带 iBeacon 传感器穿过 iBeacon\
  \ 区域。从 iBeacon 发出的信号被传感器接收，并用于构建携带 iBeacon 传感器的人的位置近似。\n\n### 12.5.1.3 数据压缩与冗余消除](#23_Chapter12.xhtml_sec12_5_1_3)\n\
  \n传感器采集的事件在发送到数据处理系统之前可以压缩。此外，可以避免通过网络发送冗余或无用数据。这样就可以消除原本必须通过网络传输的海量数据。\n\n\n\n\n\
  \n在大多数环境监控应用中，捕获的数据可能具有高度的时间或空间相关性。此类应用可以容忍一定的数据精度损失 [32]。高时间相干性意味着连续数据序列中存在冗余，这会导致不必要的数据传输和能量消耗。\n\
  \n在一种涉及在事件到达时采用基于位图的事件编码的方案中，会计算事件基于位图的编码。生成的位图用于遍历基于树的索引结构并查找匹配结果。Sadoghi 等人开发了一种并行压缩事件匹配（`PCM`）算法，该算法在过压缩的事件上并行执行订阅匹配。这些压缩事件是通过使用位按或运算将多个基于位图的事件编码合并为一个\
  \ [33] 产生的，且这些压缩事件用于遍历索引。`PCM` 算法可以通过对所有相关叶节点进行单次扫描，通过单次索引遍历，轻松地解决一组事件的匹配问题。图 12.8\
  \ 展示了 `PCM` 算法的概述。\n\n![fig12_8.jpg](img/fig12_8.jpg)\n\n图 12.8 并行压缩匹配（`PCM`）算法。（改编自\
  \ M. Sadoghi and H. A. Jacobsen, 2014, Adaptive parallel compressed event matching,\
  \ In 2014 IEEE 30th International Conference on Data Engineering. Chicago, IL, pp.\
  \ 364–375\\. doi: 10.1109/ICDE.2014.6816665.）\n\n为了获得任何压缩事件匹配算法的优势，压缩事件必须是相似的。考虑到事件流中的噪声，并使用在线流重排序（`OSR`）技术将彼此接近（尽管并不相邻）的相似事件聚集在一起。`OSR`\
  \ 算法具有推理异异性的能力，并能动态适应事件之间的相似性。Sadoghi 等人进一步提出了一种自适应并行压缩匹配算法（`A-PCM`），它首先使用 `OSR`\
  \ 技术在线对流进行重排序，并对 `OSR` 输出的每批事件计算一个相似性值。所有相似性值低于预定义阈值的事件批都使用标准匹配算法进行未压缩处理，而其他批则使用压缩匹配技术处理。观察发现，当事件流中的方差较高时，`A-PCM`\
  \ 算法最为有效。\n\n冗余消除是实现数据摘要时遵循的另一个重要技术。在射频识别（`RFID`）流处理领域，已经在冗余消除方面进行了大量工作。采用 `RFID`\
  \ 技术的主要障碍之一是 `RFID` 传感器产生的数据流的不可靠性 [34]。解决方案是对读取器数据流使用滑动窗口（即平滑滤波器），估计时间窗口内每个 `RFID`\
  \ 标签丢失读取值。平滑滤波的功能可以用 `CQL` 表示为：\n\n```\nSELECT distinct tag_id FROM rfid_readings_stream\
  \ [ANGE ’5 sec’] GROUP BY tag_id\n```\n\n在这里，设置平滑窗口大小是一项挑战性活动，因为需要平衡两个相反的应用需求：由于读取器的不可靠性所需的标签读取集“确保完整性”，以及由于标签进出读取器检测区域所需的“捕捉标签动态”。平滑窗口必须足够大以纠正读取器的不可靠性，以便系统能够确保完整性属性。然而，使用较大的平滑窗口会降低检测窗口内标签移动的准确性，导致误报。\n\
  \n## 12.5.2 系统级扩展](#23_Chapter12.xhtml_sec12_5_2)\n\n处理大量流式 IoT 数据的第二种方法是系统级扩展，这意味着调整系统来处理从\
  \ IoT 传感器生成的全部数据。这需要提供额外的资源。诸如地理分布式流处理、事件处理系统的弹性扩展等技术已在此背景下得到应用，并证明了其效果。\n\n###\
  \ 12.5.2.1 地理分布式流处理](#23_Chapter12.xhtml_sec12_5_2_1)\n\n全球范围内成本效益型数据中心部署的增加，使得地理分布式流处理成为现实。由于\
  \ IoT 系统部署在不同的地理区域，对此类地理分布的 IoT 部署进行的分析需要得到地理分布式流处理系统的支持。在这些地理分布式流处理系统中，需要采用高效的事件传输技术，例如批处理事件传输。保持低响应时间是地理分布式流处理中的另一个重大挑战。\n\
  \n`JetStream` 是这种地理分布式数据流处理系统的一个示例 [35]。带宽限制是实现地理分布式流处理系统的关键因素。`JetStream` 使用了两种技术来克服带宽限制问题，这些技术在编程模型中被明确定义。首先，系统以在线分析处理（`OLAP`）数据立方的形式运行结构化存储，这允许在数据产生的地方进行分析。其次，`JetStream`\
  \ 使用了自适应滤波和数据转换，调整数据质量以匹配可用带宽。\n\nHeintz 等人 [36] 在地理分布式数据处理的背景下检查了中心化计算与边缘计算的特征。研究结果表明，这两种方法对于现代分析需求都不是理想的。特别是查询的资源需求可能差异巨大。虽然某些查询需要跨广域网传输大量的详细数据，但大多数涉及\
  \ IoT 场景的地理分布式数据流只需从成千上万边缘设备传输少量原始数据到中心位置进行处理。因此，需要设计技术，根据查询、数据和资源的特征自动放置数据和计算。此外，确定放置在中心与边缘的合适算子集是另一项需要执行的重要任务。在这样的设置中，例如，过滤算子可以放置在边缘，而在边缘进行聚合可能并不有利。\n\
  \n### 12.5.2.2 弹性扩展](#23_Chapter12.xhtml_sec12_5_2_2)\n\n系统级扩展的另一种方法是弹性扩展，将事件处理系统执行的处理扩展到第三方计算集群。扩展到外部集群的决策可以根据流处理系统所处理的任务的吞吐量和延迟需求来做出。\n\
  \n\n\n\n在资源受限的场景下，弹性伸缩对于物联网（IoT）部署通常是最具意义的。大多数物联网系统需要在低资源水平下运行。资源限制与预算限制、电力供应不足、空间限制等有关。在大多数场景下，本地系统资源是有限的；因此需要扩展到公共云等外部系统。在此类场景中，何时配置资源是一个亟待解决的关键问题。例如，虚拟机（`VMs`）需要以弹性方式创建，以满足实时处理需求\
  \ [37]。由于商用云会产生使用成本，因此需要相应的技术，通过将延迟与经济成本之间的权衡建模为优化问题，并将经济成本保持在最低。\n\n实时数据处理系统弹性伸缩的一个主要阻碍是对访问共享状态的需求。例如，当某些操作器需要迁移到新配置的计算资源（例如一个\
  \ `VM`）时，需要将该操作器的现有状态也迁移到新配置的计算资源上，如果共享状态非常大，这在实际上几乎是不可能的。目前已经尝试通过引入全局状态管理器来解决此类问题\
  \ [38,39]。\n\n### 12.5.3 数据多样性](#23_Chapter12.xhtml_sec12_5_3)\n\n在处理数据洪流时，数据的语义描述是一个重要方面。物联网数据之间通常存在相关性。此外，事件字段描述之间也经常具有相似性。多个不同传感器产生的数据流的语义可以被用于减少大量数据。\n\
  \n使用 `RDF` 等语义技术需要大量的计算和通信资源，而这些资源在物联网设备中通常是稀缺的 [40]。这是解决数据多样性问题时需要克服的主要问题之一。物联网数据处理背景下，语义技术应用的一个例子可以从海洋和渔业领域看出。可以通过物联网应用监控鱼类场的水质。需要应用知识模型来分析传感器数据，并在出现异常测量值时发出警告\
  \ [40]。传感器标记语言（`SenML`）是一种用于表示设备参数和传感器测量值的非专利新兴标准，可以用于此类应用。`SenML` 专为资源受限的设备设计，支持\
  \ `JavaScript Object Notation`（`JSON`）和 `Efficient XML Interchange`（`EXI`）的紧凑数据表示。然而，为了从通过\
  \ `SenML` 通信的物联网设备产生的数据受益，需要将 `SenML` 元素映射到 `RDF` 模型，例如使用有向标签图 [40]。\n\n在处理实时物联网数据处理的数据多样性时，实时自动发现和集成传感器数据的能力是另一个重要特征。发现可用基础设施的能力以及集成异构数据源的困难是该领域的两个挑战之一\
  \ [14]。用于城市数据流的 `ACEIS` 集成和自动发现系统就是一个考虑了这一点的物联网数据处理系统示例。\n\n### 12.6 数据分析技术](#23_Chapter12.xhtml_sec12_6)\n\
  \n本章的前两个小节讨论了在物联网中进行实时大数据处理时需要解决的两个最迫迫待的问题。本节将讨论当前用于实时物联网数据分析的数据分析技术，这些技术需要考虑上述问题。前两个小节描述了实时物联网数据的\
  \ `CEP` 和时间序列处理方面，而后两个小节讨论了在实时数据处理中使用智能技术以获取对物联网数据的即时洞察。\n\n#### 12.6.1 复杂事件处理方法](#23_Chapter12.xhtml_sec12_6_1)\n\
  \n`CEP` 处理一种特殊的事件，称为复杂事件，它是通过聚合函数或派生函数从一组事件派出的事件。例如，如果事件 `A` 发生，然后事件 `B` 发生，我们得出事件模式\
  \ `A-> B` 导致了复杂事件 `C`。对复杂事件进行操作被称为复杂事件处理。`CEP` 引擎是执行 `CEP` 的软件，能够从数据流中检测复杂的模式、相关性、趋势等。\n\
  \n`CEP` 引擎已作为实现上述挑战的技术之一。`CEP` 引擎检测复杂事件的存在，并仅在遇到此类复杂事件时产生输出事件。此外，一些现代 `CEP` 引擎如\
  \ `WSO2 Siddhi` [41、`SAP event stream processor` 等，支持处理数据流乱序、缺失事件和重复事件。这些 `CEP`\
  \ 引擎中的某些支持通过 `MQTT`、`CoAP` 等轻级协议进行通信。\n\n#### 12.6.2 时间序列处理](#23_Chapter12.xhtml_sec12_6_2)\n\
  \n几乎所有的物联网设备随时间收集数据，产生的数据是序列数据。因此，时间序列分析方法和工具将在实时物联网分析中发挥关键作用。例如，如果我们试图在运行的物联网设备中检测可能故障的设备，我们需要处理从每个设备中收集的读数，并在其偏离正常行为时触发警报。在物联网场景中应用时间序列处理概念时有几个关键问题需要解决。这些包括处理某些特定问题，如乱序到达、窗口触发事件等。\n\
  \n这将涉及到时间序列分析，它与实时分析支持的基于窗口的处理非常契合。具体来说，`CEP` 等技术很好地支持这种处理。\n\n与其他数据集不同，时间序列数据具有自相关性。这意味着时间\
  \ `t` 的值受到 `t-1` 和 `t-2` 等值的强烈影响。因此，处理通常使用保留最近数据的移动时间窗口完成。这种处理的一个很好的例子出现在股票市场中，大多数决策不是基于点点数据，而是基于时间窗口的数据。\n\
  \n1. 检测异常设备——时间窗口操作（如移动平均、`z-score` 等）是异常检测的主要特征。\n2. 预测下一个值（负载预测）——预期电力负载、股票预测等。\n\
  3. 数据相关性——在没有时间窗口的情况下，关联时间序列是一项昂贵的操作。\n4. 检测趋势和模式——`CEP` 模式操作符、硬编码模式。\n\n例如，考虑我们想检测电力负载在过去一小时内增加超过\
  \ 30% 的情况。在实现此类算法时，划分数据非常困难，因为条件可能会跨越分区的边界。例如，如果我们按小时划分数据，我们将错过一个从 8:54 开始到 9:03\
  \ 完成的事件。因此，这抵消了批处理的优势，并将其限制在单机上。这可能导致处理速度赶不上数据产生的速度。\n\n\n\n相比之下，实时流处理按照事件到达的顺序逐个处理数据。因此，它们按顺序处理数据，不会遇到上述问题。此外，由于流处理在事件到达后立即开始处理，其在应对高事件率方面比批处理具有更大的优势（即，而不是让数据收集并尝试进行批量处理）。正如我们之前提到的，流式技术已经证明了处理每秒数百万次事件的能力。\n\
  \n此外，大多数用例都需要对时间有深入理解，而流处理系统原生支持时间。通常，事件的接收时间与事件实际发生的时间并不相同。IoT 用例需要根据事件作为属性中指定的外部时间进行操作。这导致了若干挑战：\n\
  \n1. 事件可能会乱序到达，对事件进行排序是系统的责任。这变得复杂，，因为在准确性（等待乱序事件的时间得越长，准确性就越高）和响应速度（从事件到达到触发的时间）之间存在权衡。\n\
  \n2. 系统只能通过事件进入系统来感知时间的进度。因此，每个事件的到达都会导致系统时间发生偏移，任何并行处理组件都需要接收时间偏移的通知。例如，如果数据被分为四个分区进行处理，则每个分区都需要接收时间偏移的通知。\n\
  \n诸如 `CEP` 等流处理系统原生支持上述复杂场景，为终端用户节省了大量时间和降低了复杂性。\n\n### 12.6.3 IoT 的预测性分析\n\nIoT\
  \ 分析最重要的方面之一是预测未来可能发生什么，并做好面对机会和威胁的准备。例如，这在机械预测性维护中广泛使用（在达到定义的限值时发送警告警报）、管理资源供需（例如在负载即将激增时对系统进行自动扩展）。在本节中，我们将首先描述\
  \ IoT 预测性分析的一些示例应用用例。接下来，我们将探讨在实时数据处理领域应用 IoT 预测性分析的关键问题，例如处理缺失值。\n\n最简单的预测形式是在实际阈值下方定义多个层级的阈值，使得当读数达到低级阈值时，可以作为警告报警。但这种方法有许多缺陷，因为可能会产生许多误报。当读数达到警告值时，它还没有达到实际阈值。在某些情况下，增长率可能非常低，导致从警告信号到实际达到阈值需要很长时间。\n\
  \n这可以与回归分析结合，使用如 `linear regression` 等算法可以根据读数的当前变化率预测未来值，通过这种模型，我们可以估算出达到阈所需的时间，如果达到阈值的时间低于预期水平，则可以报警。读数的二阶或更高阶导数也可以更准确地预测达到阈值的时间。\n\
  \n只有在少数情况下我们才能为预测建立数学模型；在所有其他情况下，机器学习发挥着至关重要的作用，通过随时间学习系统来预测结果并将其分类有意义的组。有很多开源机器学习库/解决方案，如\
  \ `R`、`python` 和 `Spark MLlib`。\n\n机器学习的预测功能不仅有助于预测未来的读数，还可以用于识别由于临时网络中断或传感器故障导致的缺失事件。基于概率的预测（如\
  \ `Markov chains`）也可以根据当前状态预测下一次事件发生的可能性。此类技术已用于数据流中的异常检测。\n\n### 12.6.4 IoT 的流式机器学习\n\
  \n由于 IoT 数据流的固有特性，机器学习在实时 IoT 数据处理中的应用已成为必然。然而，目前大多数流式机器学习研究仍集中在理论方面。例如，流行的流式机器学习框架（如\
  \ `SAMOA`）产生的 IoT 传感器数据流可能会受到噪声失真。因此，对此类噪声数据流进行的分析通常包含大量的缺失值。此外，IoT 数据分析系统中可能存在概念漂移（concept\
  \ drift）。\n\n由于概念漂移现象，输入数据与目标变量之间的关系随时间变化。数据流增量决策树诱器等技术可以作为处理概念漂移的新方法手段。\n\n###\
  \ 12.7 安全实时 IoT 数据处理\n\n位于不同地点的 IoT 系统通过通信网络互连，其增长增加了未经授权访问、滥用或欺诈的潜在风险，这些风险可能发生在网络中的任何访问点。由于互联网是一个巨大的公共网络，当滥用发生发生时，会对社会产生重大影响。安全违规可能出现在\
  \ IoT 数据处理系统的任何层级。因此，信息安全和相关的威胁缓解技术直接影响着实时 IoT 大数据处理应用的构建。本节调查了该领域的一些关键问题。\n\n大多数\
  \ IoT 安全挑战与无线网络安全挑战有关。无线网络更容易受到渗透（即窃听），因为射频段易于扫描。使用 `802.11b (Wi-Fi)` 标准的局域网 (LAN)\
  \ 可以被外部人员使用笔记本电脑、网卡、外部天线和免费破解软件轻易渗透。因此，如何安全地将设备连接到网络是一个巨大的挑战。在大多数场景下，通信中最薄弱的环节是设备到家庭网络的连接。基础设施保护的程度受其异构性的影响很大。在使用低带宽标准（例如\
  \ `IEEE 802.15.4`）的受限设备与更强大的设备之间需要建立一个安全的通信通道。\n\n除了上述通用安全威胁外，IoT 为日常家用电器引入了全新物种的安全威胁。非侵入式负载监控\
  \ (`NILM`) 可用于对住宅小区居民进行详细跟踪，导致隐私减少。如果黑客获取了家庭智能电表的访问权限，他们可以切断安全系统的电源。另一个例子是黑客获取汽车权限，汽车可以通过手机进行远程操控。这将导致黑客控制汽车的内部系统。\n\
  \n使用噪声数据进行加密是 IoT 基础设施可以采用的一种方法，以减轻此类威胁。通过利用某些通信通道通常存在噪声的特性，可能实现针对攻击者的安全加密。此外，`homomorphic\
  \ encryption` 等技术可以用于远程健康数据分析应用，防止云端窃听。\n\n### 12.8 总结与结论\n\n\n\n\n本章阐了实时大数据处理技术在推动物联网（IoT）发展中的重要作用。我们描述了物联网在日常生活中的用例，并解释了为什么在这些物联网用例中需要实时数据处理。我们介绍了专为为物联网用例定制的新型实时物联网数据处理架构的细节。此外，我们还提供了实时物联网数据处理系统中使用的数据采集协议的细节。然后，我们描述了如何及时响应事件，并介绍了处理物联网产生的大量流数据的方法。此外，我们介绍了在实时物联网数据处理场景中遵循的不同数据分析技术。最后，我们描述了在进行实时物联网数据处理时一些值得关注的信息安全问题。\n\
  \n很清楚的是，尽管已经提出并实现了多种数据流处理系统和架构，但极少有专门针对物联网用例的流处理系统。从本章介绍的内容可以清楚地看出，虽然存在处理数据洪流的技术，但在现实环境中应用这些技术时可能会出现哪些类型的问题尚并不明确。例如，系统级扩展可能面临多个问题，如可扩展性、可靠性/容错性、信息安全、功耗等，这些都需要被处理。此外，处理语义信息一直是克服的一项重大挑战。然而，针对数据多样性问题的解决工作较少。流式机器学习仍处于早期阶段。因此，在物联网应用中应用流式机器学习可以开展大量工作。总体而言，我们认为近期将出现许多工作，以填补当前物联网实时大数据处理技术的空白。\n\
