  \ j)`。 (5.2)\n\n\n#### 备注\n\n\n## 5.3.2 协同调度](#16_Chapter05.xhtml_sec5_3_2)\n\n\n\
  \n共同调度（co-schedule）将 `n` 个任务划分为若干组（称为包，packs），使得 (i) 来自给定包的所有任务在同一时间开始执行；以及 (ii)\
  \ 来自不同包的两个任务其执行间隔是不相交的。例如，在图 5.1 所示，前两个包各有三个任务，第三个包只有一个任务，而最后一个包有两个任务。一个包的执行时间（或成本）是该包内任务任务的最大执行时间，而整个共同调度的成本是所有包的成本之和。\n\
  ![fig5_1.jpg](img/fig5_1.jpg)\n\n图 5.1 具有四个包 `P1` 到 `P4` 的共同调度方案。\n### 5.3.3 故障模型](#16_Chapter05.xhtml_sec5_3_3)\n\
  \n我们考虑可瞬时检测的停止故障（fail-stop errors）。为了建模单个处理器上故障发生的速率，我们使用参数为 `λ` 的指数概率律。该律的平均值（或平均故障间隔时间，MTBF）为\
  \ `μ = 1/λ`。应用程序的 MTBF 取决于其使用的处理器数量，因此每当发生重新分配时就会变化。具体而言，如果应用程序 `Ti` （当前）在 `j` 个处理器上执行，其\
  \ MTBF 为 `μ,j = μ/j`（证明见参考文献 4 中的命题 1.2）。\n为了从停止故障中恢复，我们使用一种轻量级检查点协议，称为双检查点算法或伙伴算法（buddy\
  \ algorithm）[21,22]。这是一种内存检查点协议，避免了磁盘检查点的高开销。处理器成对出现：每个处理器都有一个关联的处理器伙伴处理器。当一个处理器将其检查点文件存储在自己的内存中时，它会将该文件发送给它的伙伴，伙伴也执行相同的操作。因此，每个处理器存储两个检查点：它自己的和其伙伴的。当发生故障时，故障处理器丢失这两个检查点文件，伙伴必须向故障节点重新发送这两个检查点。如果在该恢复期间伙伴再次发生故障（这种情况发生的概率极低），则会发生致命故障，系统无法恢复。注意，分配给每个应用程序的处理器数量必须是偶数。\n\
  \n我们对每个应用程序强制执行周期性检查点。形式上，如果应用程序 `Ti` 在 `j` 个处理器上执行，则每个长度为 `τi,j` 的周期都会有一个检查点，其成本为\
  \ `Ci,j`。我们现在解释当应用程序 `Ti` 在 `j` 个处理器上执行时，如何计算检查点的成本 `Ci,j`。令 `mi` 为应用程序 `Ti` 的内存占用（总数据大小）。`j`\
  \ 个处理器中的每一个都持有 `mi/j` 的数据，它必须将这些数据发送给其伙伴处理器。通信大小为 `s` 的消息的时间为 `β + s/τ`，其中 `β` 是启动延迟，`τ`\
  \ 是链路带宽。我们推导出 `Ci,j = (mi/jτ) + β`。\n至于检查点周期 `τi,j`，我们使用杨氏公式 [7] 并令：\n\n$${\\tau_{i,j}\
  \ = \\sqrt{2\\mathit{\\μ}_{i,j}C_{i,j}} + C_{i,j}.}\\qquad(5.3)$$\n由于 `τi,j` 是一阶近似，该公式仅在\
  \ `Ci,j ≪ μi,j` 时有效。当故障发生时，首先是持续时间 `D` 的停机时间，然后是持续时间 `Ri,j` 的恢复期。我们假设 `Ri,j = Ci,j`，而停机时间\
  \ `D` 取决于平台，而不取决于应用程序。\n\n### 5.3.4 无重新分配的执行时间](#16_Chapter05.xhtml_sec5_3_4)\n\
  为了计算调度的预期执行时间，我们必须首先计算在故障影响下 `j` 个处理器上执行的应用程序 `Ti` 的预期执行时间。我们首先考虑不进行重新分配（但考虑故障）的情况。回想\
  \ `ti,j` 是无故障场景下应用程序 `Ti` 在 `j` 个处理器上执行的执行时间。令 `tiR,j(α)` 为在 `j` 个处理器上计算应用程序 `Ti`\
  \ 总工作量比例 `α` 所需的时间，其中 `0 ≤ α ≤ 1`。我们需要考虑 `Ti` 在 `j` 个处理器上的这种部分执行，以便为有重新分配的情况做准备。\n\
  \n回想应用程序 `Ti` 的执行是周期性的，且周期 `τi,j` 仅取决于处理器数量，而不取决于剩余执行时间（见公式 5.3）。在持续时间为 `τi,j -\
