  \n大数据是指具有不同真实性的各种价值数据，这些数据以高速度生成或收集，其规模超过了常用软件在可接受的时间间隔内进行管理、查询和处理的能力。一方面，大数据分析结合了来自广泛领域的各种技术，包括云计算、数据挖掘、机器学习、数学和统计学。例如，数据挖掘从数据发现发现的、此前未知的且潜在有用的信息和/或知识。另一方面，不确定大数据管理代表了一个活跃且广受认可的研究领域，大量的提案正汇聚于此。这归于几个原因，但很大程度上是由大数据趋势以及云计算的兴起所决定的。在这一广泛的研究背景下，从大数据中提取有用知识的问题处于关键地位。在我们的研究中，我们特别关注两个著名的不同问题，即：(i)\
  \ 频繁项集挖掘和 (ii) 来自大数据的约束性挖掘。我们认为这些子问题汇聚成了一个通用问题，我们命名为来自大数据的复杂挖掘。受这些研究挑战的启发，我们在本章中提供了以下贡献：(i)\
  \ 对大数据复杂挖掘背景下的最新文献进行了全面综述；(ii) 一种用于支持分布式环境下大数据约束性挖掘的高效树形算法；(iii) 另一种用于支持云环境下约束性挖掘的高效\
  \ MapReduce 算法。\n\n## 15.1 引言\n\n大数据是指具有不同真实性（例如精确、不精确或不确定数据）和高容量的高价值数据，其规模超过了常用软件在可接受的时间间隔内进行管理、查询和处理的能力。这些高容量价值数据可以从各种现实应用中（如生物信息学、图管理、传感器和流系统、智能世界、社交网络以及\
  \ Web）的各种数据源中以高速度被收集或生成（这可能导致各种数据类型和格式）。这些大数据的特征可以通过以下“5V”来描述：\n\n1. 价值（Value），关注数据的有用性\n\
  2. 多样性（Variety），关注数据类型、内容或格式的差异\n3. 速度（Velocity），关注数据收集或生成的速度\n4. 真实性（Veracity），关注数据的质量（例如数据的不确定性、混乱性或可信度）\n\
  5. 体量（Volume），关注数据量\n\n大数据中嵌入了丰富的有用信息和知识（例如生物数据、医学图像、广告流、监控视频、业务交易、财务图表、社交媒体数据、Web\
  \ 日志、文本和文档）。由于大数据的“5V”特征，需要新的算法形式来管理、查询和处理这些大数据，以便增强决策制定、洞察、过程优化、数据挖掘和知识发现。这驱动并激励了数据科学的研究和实践，旨在开发系统性或定量的数据分析算法来分析（例如检查、清洗、转换和建模）并挖掘大数据。\n\
  \n\n\n\n\n一方面，大数据分析 [10–15] 整合了来自广泛领域的各种技术，包括云计算、数据挖掘、机器学习、数学和统计学。数据挖掘旨在从数据中提取隐性的、此前未知的且潜在有用的信息。由于大数据的“5V”特性，在云计算环境中处理数据是自然而然的，因为云环境通过提供高性能、可靠性、可用性、透明性、抽象和/或虚拟化，为数据提供了一个“自然”上下文。从数学模型到近似模型，从资源受限范式到内存受限方法，各种方法都可以应用于云计算环境中。在过去的几年里，根据问题的“系统化”视角处理大数据的算法（例如\
  \ `MapReduce` 算法）正呈现良好势头。`MapReduce` [16] 是一种高级编程模型，用于通过在云端 [21–23] 上并行和分布式计算 [17–20]\
  \ 来处理海量大数据，它由一个主节点和多个工作节点组成。正如其所示，`MapReduce` 涉及两个关键函数：(i) “map”函数和 (ii) “reduce”函数，这两者常用于如\
  \ `LISP` 等函数式编程语言中的列表处理：\n\n1. mapper 对值列表中的每个值应用映射函数，并返回生成的列表。\n2. reducer 将一个归约函数应用于值列表中的所有值以进行合并，并返回合并后的结果。\n\
  \n使用 `MapReduce` 模型的优势是，用户只需要关注（并指定）这些“map”和“reduce”函数——而无需担心以下方面的实现细节：\n\n* 处理机器故障\n\
  * 管理机器间的通信\n* 分区输入数据\n* 在多台机器上调度和执行程序\n\n另一方面，不确定性大数据管理（例如，[24–30]）代表了一个活跃且广受认可的研究领域，大量相关的提案在此汇聚。这是由于几个原因，但主要受大数据趋势的出现以及云计算范式的爆发的驱动（例如，[31–35]）。在这个宽阔的研究背景下，从大数据中提取有用知识的问题（例如，[36–40]）起着领先作用，不确定性大数据设置成为一个待考虑的关键案例。在我们的研究中，我们特别关注针对不确定大数据的两个著名的不同的第一类数据挖掘问题，即：\n\
  \n1. 基于不确定大数据的频繁项集挖掘\n2. 基于不确定大数据的约束挖掘\n\n我们意识到这些子问题汇聚成一个通用问题，我们将其命名为来自不确定大数据的复杂挖掘，该问题可以找到大量的现实应用和系统。一些示例包括\
  \ (i) 医疗管理（例如，[41]）， (ii) 高级 Web 应用（例如，[42,43]）， (iii) 交通流预测（例如，[44,45]）， (iv) 光网格上的预留管理（例如，[46]），以及\
  \ (v) 移动 Web 和社交网络（例如，[47, 48]）。\n\n受这些相关研究挑战的启发，我们在本章提供了以下贡献：\n\n1. 对不确定性大数据复杂挖掘背景下的最先进文献进行了全面概述，分别关注了不确定性大数据频繁项集挖掘和不确定性大数据约束挖掘的问题与定义。\n\
  2. 一种用于支持分布式环境（如云、事实上，甚至是无线传感器大数据网络）中不确定性大数据基于树的约束挖掘的有效高效算法，该算法能够处理输入约束，从而设计了一种创新的不确定性大数据约束频繁项集挖掘框架。\n\
  3. 一种用于支持云环境中基于 `MapReduce` 的不确定性事务数据约束挖掘的有效高效算法，该算法允许用户通过指定表达其兴趣的约束来查询大数据，并处理用户指定的约束以从不确定性大数据中发现有用的信息和知识。\n\
  \n本章的其余部分组织如下。在第 15.2 节，我们提供了分布式环境（如云）中不确定性大数据复杂挖掘的问题、定义和动机。第 15.3 节包含了必要的领域背景。在第\
  \ 15.4 节，我们介绍了我们支持不确定性大数据复杂挖掘框架中的第一个算法，即关注频繁项集挖掘的算法。第 15.5 节说明了支持云环境中不确定性数据约束挖掘的基于\
  \ `MapReduce` 的算法，它是我们提案中的第二个算法。在第 15.6 节，我们描述了我们的实验活动，清楚地展示了我们提案带来的益处。最后，第 15.7\
  \ 节包含了结论和未来工作。本章显著扩展了我们之前的研究 [17,49]，为分布式环境下支持不确定性大数据复杂挖掘的通用问题提供了统一的概念视角。\n\n##\
  \ 15.2 不确定性数据的复杂挖掘：问题与定义\n\n正如第 15.1 节所述，我们的总体关注点是支持不确定性大数据复杂挖掘的问题，通过分别关注提供不确定性大数据频繁项集挖掘和提供不确定性大数据约束挖掘的问题。在本节中，我们为不同的应用设置提供了不确定性大数据复杂挖掘的基础、定义和动机。\n\
  \n### 15.2.1 频繁项集挖掘\n\n数据挖掘旨在发现数据中嵌入的隐性的、此前未知的且潜在有用的信息。作为常见的数据挖掘任务，频繁项集挖掘 [50–52]\
  \ 寻找频繁共同出现的项集（即项的集合）。挖掘出的频繁项集可用于发现相关性或因果关系、序列分析以及关联规则的形成。\n\n\n\n\n\n自频繁项集发现被引入[56]以来，寻找频繁项集的问题已成为大量研究课题\
  \ [53–55]。在早期，许多算法是基于 Apriori 的 [57]，它们依赖于“生成-测试”的范式，通过首先生成候选集，然后针对包含精确数据的传统数据库（例如传统的购物者购物篮交易数据库）检查它们的支持度（即出现次数）来寻找所有频繁项集。为了避免这种生成-测试的范式，提出了\
  \ `FP-growth` 算法 [58]。这种基于树的算法构建了一个扩展的前缀树结构，称为频繁模式树（`FP-tree`），用于捕捉事务数据库的内容。`FP-growth`\
  \ 并不采用基于 Apriori 算法的生成-测试策略，而是侧重于频繁模式的增长 [59,60]——这是一种受限的仅测试方法（即不生成候选集，仅测试支持度）。\n\
  \n### 15.2.2 从不确定数据中挖掘频繁项集\n\n利用上述精确数据的传统数据库，用户完全可以确定某项是否存在于事务中（或不存在）。相比之下，许多现实应用中的数据充满了不确定性\
  \ [61–66]。这部分是由于固有的测量不准确、采样和持续误差、网络延迟以及为了保护匿名性而对数据进行的故意模糊。因此，数据集中项的存在与否是不确定的。此外，随着近年来传感器设备不确定对象数量的增加以及诸如\
  \ `DUST` [67] 等噪声数据管理技术的发展，对不确定数据挖掘 [68–72] 的需求日益增长。作为一个具体的例子，医生可能高度怀疑（但无法保证）咳嗽的患者患有中东呼吸综合征（MERS）。这种怀疑的不确定性可以用存在概率来表示（例如，患\
  \ MERS 的概率为 60%）。基于这一概念，包含精确数据的数据库中事务 `tj` 的每项都可以被看作在 `tj` 中出现的概率为 100% 的项。为了从这些不确定数据中找到频繁项集，研究者提出了多种不确定数据挖掘算法（例如\
  \ `U-Apriori` [73]、`UF-growth` [74]、`tube-growth` [75] 和 `BLIMP-growth` [76] 算法）。其中，`UF-growth`、`tube-growth`\
  \ 和 `BLIMP-growth` 在树结构中捕捉不确定数据的内容，并从中递归地挖掘频繁项集。\n\n### 15.2.3 从不确定数据中挖掘约束频繁项集\n\
  \n在许多现实应用中，用户寻找的是所有的频繁项集。相应地，许多频繁项集挖掘算法无论是基于 Apriori 的还是基于树的，在挖掘精确或不确定数据时，对用户关注点提供的支持很少或没有支持。然而，对于其他某些现实应用，用户心中可能存在某些特定的现象并将其作为挖掘的重点（例如，医生可能只想找到那些患有\
  \ MERS 的患者，医学分析师可能只想找到那些属于怀疑患哮喘患者的实验室检测记录，而不是所有患者）。如果没有用户的关注点，用户通常需要很长时间来等待大量的频繁项集，而其中只有一小部分可能对用户感兴趣。因此，需要约束频繁项集挖掘\
  \ [77,78]，其目标是找到满足用户指定约束的频繁项集。`CAP` [79]、`DCF` [80] 和 `ℱIC` [81] 就是从传统精确数据中挖掘约束频繁项集的算法示例。\n\
  \n### 15.2.4 从分布式不确定数据中挖掘约束频繁项集\n\n随着技术的进步，人们可以很容易地从单一源甚至多个源收集海量数据 [12,82]。例如，近年来传感器网络已广泛应用于农业、建筑、环境和结构监测等许多领域。分布在这些网络中的传感器是良好的数据来源。然而，传感器通常具有通信带宽、传输能量和计算能力的限制。因此，数据通常不会传输到一个远端处理器来执行数据挖掘任务。相反，数据被传输到分布式环境内的本地（例如，最近的）处理器\
  \ [83]。由于这需要巨大的计算能力（例如 [84]），这要求并行和分布式挖掘 [85–87]。例如，并行和分布式频繁项集挖掘 [20,88] 旨在寻找嵌入在分布式数据中的隐式的、此前未知的且潜在的频繁项集。\n\
  \n在分布式环境中寻找频繁项集的基于 Apriori 的分布式算法示例包括 `Count Distribution`、`Data Distribution` 和\
  \ `Candidate Distribution` [89]，以及 `FDM` [90]。同样，`Parallel-HFP-Leap` [91] 同样在分布式环境中寻找频繁项集，但它是一种基于树的算法。然而，无论是基于\
  \ Apriori 的还是基于树的，所有分布式频繁项集挖掘算法都不处理约束条件，也不挖掘不确定数据。另一方面，`CAP`、`DCF` 和 `ℱIC` 都从传统的精确数据中挖掘约束频繁项集。同样，`U-Apriori`\
  \ 和 `UF-growth` 算法都是从不确定数据数据库中挖掘所有的（无约束的）频繁项集，而不是仅针对约束性的。最近，Kozawa 等 [92] 尝试使用 GPU\
  \ 通用计算来加速不确定数据挖掘。然而，他们的目标是寻找所有的（无约束的）概率频繁项集，而不是约束频繁项集。\n\n\n\n\n因此，一个自然的问题是：在分布式环境中，是否可以针对不确定数据挖掘仅满足用户指定约束的频繁项集？针对这个问题，我们进行了一项可行性研究。初步结果\
  \ [93,94] 显示，从分布式不确定数据中挖掘约束频繁项集是可能的。在本章中，我们提出了一种有效高效的算法，用于在分布式环境下对不确定数据进行基于树的约束频繁项集挖掘。在这里，我们的核心贡献是将\
  \ (i) 约束挖掘、(ii) 并行与分布式挖掘、(iii) 不确定数据挖掘、(iv) 基于树的挖掘以及 (v) 频繁项集挖掘深度整合。所得基于树的算法高效地从分布式不确定数据中挖掘出符合约束的频繁项集。它避免了候选集生成并测试的范式，处理了不确定数据，将用户约束推入挖掘过程中，避免了不必要的计算，并在分布式环境中仅找到满足约束的项集。\n\
  \n## 15.2.5 基于 MapReduce 的不确定大数据约束性频繁项集挖掘\n\n过去几年，人们已经提出了几种算法使用 MapReduce 模型（通过并行、分布式或云计算挖掘搜索空间）来处理大数据分析任务，如分类\
  \ [95] 和聚类 [96]。与此相反，我们关注另一项大数据分析任务——即关联规则挖掘 [57]，该任务以关联规则 `A⇒C` 的形式发现有趣的知识，揭示了\
  \ (i) 经常购买商品的顾客购物篮 `A` 和 `C` 之间的关联关系，或 (ii) 经常共同发生的事件集合 `A` 和 `C` 之间的关系。\n\n通过将关联规则挖掘应用于价值巨大的购物篮数据，数据科学家可以帮助店主/经理发现揭示客户购买行为有趣或流行的模式。关联规则挖掘的研究问题通常包含两个关键步骤：\n\
  \n1. 频繁模式挖掘 [97]\n2. 关联规则的形成（通过使用挖掘出的频繁模式作为规则的前件和后件）\n\n回顾第 15.2.3 节，`CAP` [79]、`DCF`\
  \ [80] 和 `ℱIC` [81] 是从传统精确数据中挖掘约束频繁项集的算法示例。为了从大数据中挖掘约束频繁项集，`BigSAM` [98] 了一了一类被称为\
  \ SAM 约束的特殊约束。这种利用有助于在挖掘满足用户指定 SAM 约束的项集时减少搜索空间。然而，许多常用的约束（例如 `sum(X.Price) ≤ $150`，它寻找总价不超过\
  \ 150 美元的所有商品组合 `X`）并不属于 SAM 约束类。在本章中，我们探索了另一类约束，被称为反单调（AM）约束，常用的约束就属于此类。我们探索了 AM\
  \ 约束的两个子类：(i) 频率约束和 (ii) 非频率 AM 约束。\n\n在这方面，我们的核心贡献是我们的第二种有效高效的算法，名为 `MrCloud`——它利用云环境中的\
  \ MapReduce 模型来管理、查询和处理不确定大数据。具体而言，`MrCloud` 管理不确定大数据的事务，允许用户通过指定表达感兴趣的 AM 约束来查询这些大数据，并处理用户指定的约束，从不确定大数据中发现频繁模式形式的有用信息和知识。\n\
  \n## 15.3 背景\n\n三个定义的特定领域对我们的工作至关重要，即：\n\n1. 从不确定数据挖掘频繁项集\n2. 约束挖掘\n3. 使用 MapReduce\
  \ 模型的大数据挖掘\n\n下文中，我们将为这些领域提供必要的背景。\n\n### 15.3.1 从不确定数据中挖掘频繁项集\n\n频繁项集挖掘的研究问题最早于\
  \ 1993 年引入 [56]。相应的算法——即 `Apriori`——从精确数据组成的事务数据库（TDB）中挖掘所有频繁项集，其中每个事务的内容是精确可知的。具体而言，如果事务\
  \ `ti` 包含一个项目 `x`（即 `x ∈ ti`），则精确已知 `x` 存在于 `ti` 中。另一方面，如果事务 `ti` 不包含一个项目 `y`（即\
  \ `y ∉ ti`），则精确已知 `y` 不存在于 `ti` 中。然而，对于由不确定数据组成的概率数据库，情况并非如此。精确数据和不确定数据之间的关键区别在于，后者的每个事务都包含项目及其存在概率。事务\
  \ `ti` 中项目 `x` 的存在概率 `P(x, ti)` 表示 `x` 出现在 `ti` 中的几率。对于一个现实生活例子，每个事务 `ti` 代表患者看医生的过程。`ti`\
  \ 内部的每个项目 `x` 代表一种潜在疾病，并与表示患者患有该疾病几率的 `P(x, ti)` 相关（例如，在 `ti1` 中，`x` 有 60% 的概率患有哮喘，有\
  \ 90% 的概率感冒）。对于精确数据，每个事务中的项目可以被看作具有 100% 的存在几率。\n\n给定一个项目 `x` 和事务 `ti`，在使用不确定数据的解释时有两种可能世界\
  \ [99,100]：\n\n1. `x ∈ ti` 的可能世界 `W1`\n2. `x ∉ ti` 的可能世界 `W2`\n\n尽管不确定哪一个世界是真实世界，但\
  \ `W1` 为真实世界的概率为 `P(x, ti)`，`W2` 的概率为 `1 - P(x, ti)`。\n\n**定义 15.1**\n\n假设 (i) `Item`\
  \ 是 `m` 个项目的集合，(ii) `X = {x1, x2, …, xk}` 是一个 k 项集（即一个模式），其中 `X ⊆ Item` 且 `1 ≤ k\
  \ ≤ m`。那么，事务数据库是 `n` 个事务的集合，每个事务 `tj ⊆ Item`（对于 `1 ≤ j ≤ n`）。`X` 的投影数据库是包含 `X` 的所有事务。不确定数据库中事务\
  \ `tj = {x1, x2, … xh}` 的每个项目 `xi` 都对应一个存在概率 `P(xi, tj)`，这表示 `xi` 在 `tj` 中出现的几率\
  \ [100]，其值为：\n\n```\n0 < *P*(*x*[*i*], *t*[*j*]) ≤ 1   (15.1)\n```\n\n当这些项目相互独立时，模式\
  \ `X` 在 `tj` 中的存在概率 `P(X, tj)` 则是每个项目 `xi` 对应存在概率的乘积。最后，`X` 的期望支持 `expSup (X)` 是所有\
  \ `n` 个事务中 `P(X, tj)` 的总和。\n\n\n\n\n基于这种期望支持的概念，现有的基于树的算法——如 `UF-growth` [[74]]、`tube-growth`\
  \ [[75]] 和 `BLIMP-growth` [[76]]——通过首先扫描一次不确定数据库来计算所有领域项目的期望支持（即单项模式），从而从不确定数据中挖掘频繁模式。不频繁的项目会被剪枝，因为它们的扩展集/超集保证是不频繁的。然后，算法第二次扫描数据库，将所有事务（仅包含频繁项目）插入到树中（例如\
  \ `UF-tree` [[74]]、`TPC-tree` [[75]] 或 `BLIMP-tree` [[76]]）。树中的每个节点捕获了 (i) 项目 `x`，ii)\
  \ 它的存在概率 `P(x, tj)` 以及 (iii) 它的出现次数。在挖掘过程的每一步中，频繁模式都会递归扩展。\n\n**定义 15.2**\n如果 `expSup(X)\
  \ ≥ minsup`，则模式 `X` 在不确定数据库中是频繁的。给定一个数据库和 `minsup`，从不确定数据中挖掘频繁模式的研究问题是从数据库中发现一组期望支持大于等于\
  \ `minsup` 的完整频繁模式集。\n\n### 15.3.2 约束挖掘\n\n现有的约束频繁项目集挖掘框架 [[78][80]] 允许用户使用一组丰富的\
  \ SQL 风格约束来指定其兴趣，以引导挖掘过程，使得只找到满足用户约束的频繁出现的购物篮物品项目集。这避免了为了挖掘那些不感兴趣的频繁项目集而进行不必要的计算。这些用户指定的约束可以应用于各个领域的项目、事件或对象，包括购物者购物篮、气象记录和活动规划日历。通常情况下，这些约束可以归类为以下两个子类约束，并根据它们所拥有的属性进一步细分为若干类重叠类别：\n\
  \n1. **频率约束**包括：\n   - `C1 ≡ sup(X) ≥ minsup` 表示用户对从精确数据中寻找频繁模式的兴趣，即每个实际支持度（或频率）达到或超过用户指定的最小支持阈值\
  \ `minsup` 的模式 `X`。\n   - `C2 ≡ expSup(X) ≥ minsup` 表示用户对从不确定数据中寻找频繁模式的兴趣，即每个期望支持达到或超过用户指定的最小支持阈值\
  \ `minsup` 的模式 `X`。\n\n2. **非频率约束**，示例包括：\n   - `C3 ≡ max(X.Price) ≤ $25` 表示用户希望寻找每个频繁项目集\
  \ `X`，使得每个 `X` 中所有购物篮物品的最高价格不超过 25 美。\n   - `C4 ≡ min(X.RewardPoints) ≥ 2000` 表示用户希望寻找每个模式\
  \ `X`，使得旅行者在访问的所有机场中获得的奖励积分至少为 2000 分。\n   - `C5 ≡ X.Location = Europe` 表示用户希望寻找每个模式\
  \ `X`，使得 `X` 中的所有地方都位于欧洲。\n   - `C6 ≡ min(X.Price) ≤ $30` 表示项目集 `X` 中所有项目的最低价格最多为\
  \ 30 美。\n   - `C7 ≡ avg(X.Price) ≤ $30` 表示 `X` 中所有项目的平均价格最多为 30 美。\n   - `C8 ≡ sum(X.Price)\
  \ ≤ $150` 表示 `X` 中所有项目的总价最多为 150 美。\n   - `C9 ≡ sum(X.Rainfall) ≥ 90 mm` 表示 `X`\
  \ 中所有气象记录的总降雨量至少为 90 毫米。\n\n上述约束可以根据它们拥有的属性归为若干类重叠类别。其中一个属性是简洁性（succinctness）[[78]]。\n\
  \n**定义 15.3**\n令 `Item` 为领域项目集。那么，项目集 `SSj ⊆ Item` 是一个简洁集，如果 `SSj` 可以表示为选择操作 `σp(Item)`\
  \ 的结果，其中 `σ` 是常用的 SQL 风格选择算符，`p` 是选择谓词。项目的幂集 `SP ⊆ 2Item` 是简洁幂集，如果存在固定数量的简洁集 `SS1,\
  \ … , SSk ⊆ Item`，使得 `SP` 可以用集合并和/或集合差运算符通过 `SS1, … , SSk` 的幂集来表示。如果满足约束 `C` 的项目集集是简洁幂集，则约束\
  \ `C` 是简洁的。\n\n需要注意的是关于简洁约束的以下两个观察：\n1. 大多数用户指定的约束都是简洁的。在上述非频率约束中，(i) `C3 ≡ max(X.Price)\
  \ ≤ $25`、(ii) `C4 ≡ min(X.RewardPoints) ≥ 2000`、(iii) `C5 ≡ X.Location = Europe`\
  \ 以及 (iv) `C6 ≡ min(X.Price) ≤ $30` 是简洁的。对于任何简洁约束，人们可以直接生成所有且仅生成满足这些约束的项目集，而无需生成并排除不满足约束的项目集。\n\
  \n例如，`C3 ≡ max(X.Price) ≤ $25` 是简洁的，因为任何满足 `C3` 的项目集都可以被表示为 `σp(Item)`。换句话说，满足 `C3`\
  \ 的项目集可以通过组合任何价格 ≤ 25 美的项目来生成。同样，`C6 ≡ min(X.Price) ≤ $30` 是简洁的，因为任何满足 `C6` 的项目集都可以通过组合至少一个价格\
  \ ≤ 30 美的项目来生成。\n\n2. **许多非简洁的约束**可以被推导出更弱的约束。例如，非简洁的 `C7 ≡ avg(X.Price) ≤ $30`\
  \ 可以被推导出简洁的 `C6 ≡ min(X.Price) ≤ $30`。\n\n除了简洁性，约束还具有其他一些属性。其中之一是反单调性（antimonotonicity）[[78]]。\n\
  \n**定义 15.4**\n约束 `C` 是反单调的（`AM`）当且仅当满足 `C` 的项目集的所有子集也满足 `C`。等价地，约束 `C'` 是 `AM`\
  \ 的当且仅当违反 `C'` 的项目集的所有超集也违反 `C'`。\n\n有了这一额外属性（即反单调性），简洁约束可以进一步划分为以下子类：\n1. **简洁反单调\
  \ (SAM) 约束** \n\n2. **简洁非反单调 (SUC) 约束**\n\n在上述非频率约束中，(i) `C3 ≡ max(X.Price) ≤ $25`、(ii)\
  \ `C4 ≡ min(X.RewardPoints) ≥ 2000` 以及 (iii) `C5 ≡ X.Location = Europe` 是 `SAM`\
  \ 约束。例如，对于任何满足 `C3` 的项目集 `X`，从 `X` 中移除项目（无论是具有最高价格的项目）形成的子集不会具有更高的最高价格（即这些子集中所有购物篮物品的价格\
  \ ≤ 25 美）。注意，违反 `SAM` 约束的项目集的超集也会违反这些约束（例如，如果项目集 `X` 包含一个价格大于 25 美的项目，那么 `X` 违反\
  \ `C3`，其所有超集也是如此）。\n\n相比之下，`C6 ≡ min(X.Price) ≤ $30` 是一个 `SUC` 约束，因为它不具有这种反单调属性。例如，如果\
  \ `X` 中包含的所有项目的最低价格高于 30 美，那么 `X` 违反了 `C6`，但不能保证 `X` 的所有超集都会违反 `C6`。例如，令 `y.Price`\
  \ 为 50 美，`z.Price` 为 10 美。那么 `X∪{y}` 和 `X∪{z}` 都是 `X` 的超集。在它们，前者（即 `X∪{y}`）仍然违反\
  \ `C6`，但后者（即 `X∪{z}`）满足 `C6`。\n\n**定义 15.5**\n\n\n\n\n\n一个模式 `X` 在数据库中是有效的，如果该模式也满足用户指定的约束条件。给定\
  \ (i) 一个数据库，(ii) 用户指定的 `minsup` 以及 (iii) 用户指定的约束条件，从不确定数据中进行受限模式挖掘的研究问题，是在从数据库中发现一组满足用户指定约束条件的完整模式集合（即有效模式）。\n\
  \n### 15.3.3 基于 MapReduce 模型的的大数据挖掘\n\nMapReduce 是一种用于处理海量数据的高级编程模型。它通常在云节点（即计算机）上使用并行和分布式计算。正如其名称所示，MapReduce\
  \ 涉及两个关键函数：“map”（映射）和“reduce”（归约）。\n\n首先，读取输入数据，将其划分为若干分区（子问题），并分配给不同的处理器。每个处理器在每个分区（子问题）上执行\
  \ `map` 函数。`map` 函数接收一对 〈key, value〉 并返回一个 〈key, value〉 对的列表作为中间结果：\n\n![umath15_1](img/umath15_1.jpg)\n\
  \n其中 (i) `key1` 和 `key2` 是相同或不同域中的键，(ii) `value1` 和 `value2` 是某些域中的对应值。\n\n随后，`map`\
  \ 函数返回的键对会被洗牌和排序。然后，每个处理器对 (i) 该中间结果中的单个键以及 (ii) 该中间结果中与该键出现的所有值列表执行 `reduce` 函数。`reduce`\
  \ 函数通过组合、聚合、总结、过滤或转换，来“归约”与给定键关联的值列表（针对所有 `k` 个键），并返回一个单一的（聚合的或总结的）值：\n\n![umath15_2](img/umath15_2.jpg)\n\
  \n其中 (i) `key2` 是某些域中的一个键，(ii) `value2` 和 `value3` 是某些域中的对应值。MapReduce 应用的示例包括倒排索引的构建以及数据处理中的文档词计数。\n\
  \n为了使用 MapReduce 模型从精确数据中挖掘频繁模式，研究人员提出了三种基于 Apriori 的算法：`SPC`、`FPC` 和 `DPC`。其中，`SPC`\
  \ 使用单次通过计数，在第 `k` 次通过（即第 `k` 次数据库扫描）找到基数为 `k` 的频繁模式（其中 `k ≥ 1`）。`FPC` 使用固定次数组合计数，在同一次通过或数据库扫描中找到所有基数为\
  \ `k`、`(k + 1)`、…… `(k + m)` 的模式。一方面，这种固定次数技术将所需的通过次数从 `kmax`（其中 `kmax` 是可从精确数据中挖掘的所有频繁模式的最大基数）固定为用户指定的常数。另一方面，由于于了组合计数，生成的候选集数量比\
  \ `SPC` 高。相比之下，`DPC` 使用动态次数组合计数，它在用 MapReduce 挖掘频繁模式时考虑了节点的负载，从而兼顾了 `SPC` 和 `FPC`\
  \ 的优点。此外，还提出了一种名为 `PARMA` 的并行随机算法，用于利用 MapReduce 从精确数据中挖掘前-k 个频繁模式和关联规则的近似值。\n\n\
  作为预览，我们的 `MrCloud` 算法也使用了 MapReduce。然而，与 `SPC`、`FPC` 或 `DPC` 不同（它们使用基于 Apriori 的方法从精确数据中挖掘频繁模式），我们的\
  \ `MrCloud` 使用基于树的方法从不确定数据中挖掘频繁模式——由于存在生存概率值，处理的搜索空间比挖掘精确数据的空间大得多。此外，与 `PARMA`（它用于从精确数据中挖掘所有近似频繁模式）不同，我们的数据分析算法是从不确定数据中挖掘某些真实的频繁模式——具体来说，是满足用户指定条件的感兴趣模式。\n\
  \n### 15.4 一种支持分布式环境下不确定大数据受限挖掘的有效高效树形算法\n\n在不失一般性的情况下情况下，我们假设在分布式网络中有 `p` 个站点/处理器和\
  \ `m = m1 + m2 + ··· + mp` 个传感器，使得 `m1` 个无线传感器将数据传输到其最近或指定的站点/处理器 `P1`，`m2` 个传感器将数据传输到站点/处理器\
  \ `P2`，依此类推。在此设置下，我们提出的算法寻找在整个无线传感器网络中频繁的受限项集。根据约束的属性（即约束是否简洁），会执行不同的处理过程。\n\n####\
  \ 15.4.1 寻找满足简洁约束的频繁项集\n\n在本节中，我们描述了提出的用于支持分布式环境下不确定大数据频繁项集挖掘的算法。特别，我们展示了该算法首先寻找\
  \ (i) 满足简洁约束且对于站点/处理器 `Pi` 本地频繁的项集（见第 15.4.1.1 节），然后寻找 (ii) 满足简洁约束且对于整个无线传感器网络中所有站点/处理器全局频繁的项集（见第\
  \ 15.4.1.2 节）。作为预览，将在第 15.4.2 节中展示我们的算法如何发现不满足简洁约束的频繁项集。\n\n##### 15.4.1.1 寻找满足简洁约束的频繁项集\n\
  \n给定向处理器 `Pi` 传输数据的 `mi` 个传感器，可以为 `Pi` 创建一个不确定数据的本地数据库 `TDBi`。我们的目标是寻找同时满足 (i) `Pi`\
  \ 频繁且 (ii) 满足简洁（SAM 或 SUC）约束 `C` 的项集。对于不确定数据，我们使用“可能世界”解释。我们通过以下步骤从不确定数据中寻找受限频繁项集：\n\
  \n1. 识别满足约束的项：令 `Item``M` 为强制项集合——即单独满足 SAM 或 SUC 约束 `C` 的域项；令 `Item``O` 为可选项集合——即单独违反\
  \ `C` 的域项。\n\n那么，对于任何 SAM 约束 `CSAM`，由于反单调性，满足 `CSAM` 的项集 `X` 不能包含 `Item``O` 中的任何项。因此，任何满足\
  \ `CSAM` 的项集必须由单独满足 CSAM 的项组成。换言之，任何满足 `CSAM` 的项集必须通过组合 `Item``M` 中的项生成（即 `X ⊆ Item``M`）。由于简洁性属性，可以通过从域项列表中选择仅单独满足\
  \ CSAM 的项来高效地列举 `Item``M` 中的项。参见 [示例 15.1]。\n\n示例 15.1\n\n\n\n\n\n让我们考虑一个不确定数据库的示例样本集（如表\
  \ 15.1 所示）及其辅助信息（如表 15.2 所示），关于购物者购物篮数据。在这个不确定数据库中，每笔交易包含项目及其对应的存在概率。例如，在第一笔交易 `t1`\
  \ 中有领域项目 `a`、`b`、`c`、`d` 和 `e`，这些项目的存在概率分别为 0.7、0.8、0.8、1.0 和 0.2。注意到（i）不同的项目可能具有相同的存在概率（例如，`t1`\
  \ 中两个不同项目 `b` 和 `c` 的存在概率具有相同的值 `0.8`），但（ii）同一个项目的存在概率在不同交易之间可能会变化（例如，项目 `e` 在交易\
  \ `t1` 中的存在概率为 0.2，但在 `t2` 中为 0.1）。令约束 `CSAM` 为 SAM 约束 `C3 ≡ max(X.Price) ≤ $25`。我们提出的算法对六个领域项目中的每一个进行\
  \ `CSAM` 检查。它首先列出有效项目 `a`、`b` 和 `f`（即单项价格 ≤ $25 的项目）。因此，`ItemM` = {a, b, f}。一旦我们确定了满足\
  \ SAM 约束 `CSAM` 的领域项目，这些项目将成为所有满足 `CSAM` 的约束频繁项目集的构建块，因为所有约束频繁项目集必须只包含这些 `ItemM`\
  \ 项目。\n\n### 表 15.1\n购物者购物篮不确定数据库的示例样本集\n\n| TID | 内容 |\n| --- | --- |\n| t1 | {a:0.7,\
  \ b:0.8, c:0.8, d:1.0, e:0.2} |\n| t2 | {a:0.7, b:0.8, d:1.0, e:0.1, f:0.4} |\n\
  | t3 | {a:0.8, c:0.5, e:0.3, f:0.4} |\n| t4 | {b:0.8, c:0.8, d:1.0} |\n| t5 | {c:0.8,\
  \ d:1.0} |\n\n### 表 15.2\n表 15.1 中不确定数据的辅助信息\n\n| 项目 | 价格 |\n| --- | --- |\n| a\
  \ | $10 |\n| b | $20 |\n| c | $100 |\n| d | $50 |\n| e | $75 |\n| f | $25 |\n\n\
  接下来，对于任何 SUC 约束 `CSUC`，任何满足 `CSUC` 的项目集 `X` 都由强制项目（即单项满足 `CSUC` 的项目）和可能的可选项目（无论它们是否满足\
  \ `CSUC`）组成。注意，尽管 `CSUC` 具有简洁性属性（即可以很容易列出所有且仅保证满足 `CSUC` 的项目集），但它并不具有反单调性。因此，如果一个项目集违反了\
  \ `CSUC`，不能保证其所有或任何一个超集都会违反 `CSUC`。因此，并不是所有满足 `CSUC` 的项目集都由单项满足约束的领域项目组成（类似于 SAM\
  \ 约束）。相反，任何满足 `CSUC` 的项目集 `X` 必须通过组合至少一个 `ItemM` 项目和可能的某些 `ItemO` 项目生成。由于简洁性，`ItemM`\
  \ 和 `ItemO` 中的项目可以被高效枚举。参见示例 15.2。\n\n### 示例 15.2\n考虑示例 15.1 中相同的不确定数据库示例样本集（如表\
  \ 15.1 所示）及其辅助信息（如表 15.2 所示）。令约束 `CSUC` 为 SUC 约束 `C6 ≡ min(X.Price) ≤ $30`。我们提出的算法对六个领域项目中的每一个进行\
  \ `CSUC` 检查。它首先列出有效项目 `a`、`b` 和 `f`（即单项价格 ≤ $30 的项目），得到 `ItemM` = {a, b, f}。剩余的领域项目属于\
  \ `ItemO`（即单项价格 > $30 的项目）。一旦我们将领域项目分类为（i）`ItemM` 项目（满足 `CSUC`）和（ii）`ItemO` 项目（违反\
  \ `CSUC`），所有这些项目将成为所有满足 `CSUC` 的约束频繁项目集的构建块，因为所有约束频繁项目集必须包含至少一个 `ItemM` 项目并可能包含一些额外的\
  \ `ItemM` 或 `ItemO` 项目。\n\n### 2. UF-Tree 的构建\n一旦将领域项目分类为 `ItemM` 项目和 `ItemO` 项目（对于\
  \ `CSAM`则没有 `ItemO`），我们的算法随后构建 UF-Tree，以便从不确定数据中挖掘约束频繁项目集。它是通过首先扫描不确定数据并累积每个项目的支持度来实现的。在这些项目中，算法会丢弃不满足最小支持度阈值的项目，捕捉那些频繁的项目。注意，任何\
  \ `ItemM` 或 `ItemO` 项目都是可以安全丢弃的，因为它们是不频繁的。一旦发现了频繁的 `ItemM` 和 `ItemO` 项目，我们的算法安排这两类项目，使得\
  \ `ItemM` 项目出现在 `ItemO` 项目的下方（即 `ItemM` 项目靠近叶节点，而 `ItemO` 项目靠近根）。在所有 `ItemM` 项目中，它们按累积支持度降序排列。同样，在所有\
  \ `ItemO` 项目中，它们也按累积支持度降序排列。算法随后第二次扫描 TDB，并将每个交易插入 UF-Tree。在这里，如果项目和子节点（或后代节点）具有相同的支持度，则新交易与\
  \ UF-Tree 的根节点合并。对于 SAM 约束，相应的 UF-Tree 只捕捉那些频繁的 `ItemM` 项目；对于 SUC 约束，相应的 UF-Tree\
  \ 同时捕捉 `ItemM` 和 `ItemO` 项目。通过这种树构建过程，UF-Tree 具有以下属性：节点的出现次数至少是其子节点出现次数之和。参见示例 15.3。\n\
  \n### 示例 15.3\n继续示例 15.2，并令用户指定的支持阈值 `minsup` 设置为 1.0。我们的算法以如下方式构建满足 SUC 约束 `C6\
  \ ≡ min(X.Price) ≤ $30` 的频繁项目的 UF-Tree。首先，算法扫描一次不确定数据，累积每个 `ItemM` 项目以及每个 `ItemO`\
  \ 项目的支持度。因此，它发现了所有频繁的 `ItemM` 项目并按累积支持度降序排列。它也发现了所有频繁的 `ItemO` 项目并按其降序排列。在这类项目中，`ItemO`\
  \ 被安排在 `ItemM` 项目的上方（靠近根），而 `ItemM` 项目靠近叶节点。具体而言，我们的算法获得了 `ItemO` 项目 `d`、`c` 和 `e`（对应的累积支持度分别为\
  \ 4.0、2.9 和 0.6），它们按其支持度降序排列。在这些 `ItemO` 项目中，`e`（累积支持度为 0.6 < minsup）被移除。然后，算法将频繁的\
  \ `ItemO` 项目及其支持度表示为 `d:4.0` 和 `c:2.9`。这些频繁 `ItemO` 项目的每个支持度 ≥ minsup。同样，算法也获得了\
  \ `ItemM` 项目 `b`、`a` 和 `f`（对应的累积支持度分别为 2.4、2.2 和 0.8），它们也按其支持度降序排列。在这些 `ItemM` 项目中，`f`（累积支持度为\
  \ 0.8 < minsup）被移除。然后，算法将频繁的 `ItemM` 项目及其支持度表示为 `b:2.4` 和 `a:2.2`。这些频繁 `ItemM` 项目的每个支持度\
  \ ≥ minsup。\n\n\n\n\n接下来，我们的算法对不确定数据进行第二次扫描，并将每笔事务插入 UF-树中。算法首先将第一个事务 `t1` 中的频繁项插入树中。然后，它将第二个事务\
  \ `t2` 中的频繁项插入 UF-树中。由于 `d` 在 `t2` 中的期望支持度与现有分支（即 `t1` 的分支）相同，因此该节点是可以共享的。所以，算法将树节点\
  \ `(d:1.0)` 的出现计数加到 2，并将 `t2` 的剩余部分——即 `〈(b:0.8):1, (a:0.7):1〉`——作为节点 `(d:1.0):2`\
  \ 的子节点添加。为了捕获第三笔事务 `t3`，我们的算法将 `〈(c:0.5):1, (a:0.8):1〉` 插入树中。对于第四笔事务 `t4`，算法将现有路径\
  \ `〈(d:1.0):2, (c:0.8):1, (b:0.8):1〉` 中每个树节点的出现计数加 1。最后，我们的算法针对第五笔事务 `t5`，将现有路径以得到\
  \ `〈(d:1.0):3, (c:0.8):2〉` 的树节点出现计数加 1。因此，在树的构建过程结束后，我们得到了图 15.1a 所示的 UF-树，它捕获了不确定数据的内容。\n\
  \n### 3. 从 UF-树中挖掘约束频繁项集\n\n一旦按照 `ItemO` 项位于 `ItemM` 项之上的项目排序方案构建了 UF-树，我们提出的算法将提取适当的路径，为每个\
  \ `x` ∈ `ItemM` 形成一个投影数据库。算法不需要为任何 `y` ∈ `ItemO` 形成投影数据库，因为所有满足 CSUC 的项集必须是 `ItemM`\
  \ 中项的“扩展”（即所有有效项集都必须从 `ItemM` 项生长出来），且 UF-树中没有为 CSAM 保留 `ItemO` 项。\n\n在形成每个 `{x}`-投影数据库并构建其\
  \ UF-树时，我们的算法不需要区分 `{x}`-投影数据库 UF-树中的 `ItemM` 项和 `ItemO` 项。两类项之间的区分仅用于 TDB 的 UF-树中（仅针对\
  \ SUC 约束），因为一旦我们找到至少一个有效项 `x` ∈ `ItemM`，对于任何满足 CSUC 的 `v`：\n\n```\nv = {x} ∪ others\
  \ (15.4)\n```\n\n其中 (i) `x` ∈ `ItemM` 且 (ii) `others` ⊆ (`ItemM` ∪ `ItemO` - {x}))。\n\
  \n在为每个 `x` ∈ `ItemM` 构建了投影 UF-树后，我们提出的算法将以挖掘满足 CSAM 的项集的方式，挖掘所有满足 CSUC 的频繁项集。见示例\
  \ 15.4。\n\n#### 示例 15.4\n\n让我们继续看示例 15.3。一旦构建了 UF-树，我们提出的算法将如下所示从该树中递归挖掘约束局部频繁项集，`minsup\
  \ = 1.0`。从头表（从上到下）包含两个 `ItemO` 项 `d : 4.0 = (4 × 1.0)` 和 `c : 2.9 = (1 × 0.5) +\
  \ (3 × 0.8)` 以及两个 `ItemM` 项 `b : 2.4 = (1 × 0.8) + (2 × 0.8)` 和 `a : 2.2 = (1 ×\
  \ 0.8) + (1 × 0.7) + (1 × 0.7)` 开始中，算法首先找到两个约束频繁项集 `{b}` 和 `{a}`，它们的期望支持值分别为 2.4\
  \ 和 2.2。\n\n然后，我们的算法将如下所示从该 UF-树中递归挖掘约束频繁项集，`minsup = 1.0`。从图 15.1a 所示的 UF-树开始，我们的算法从\
  \ `a` ∈ `ItemM` 开始，并为 `{a}`-投影数据库构建一个 UF-树。生成的树如图 15.1b 所示，由单路径组成——即 `〈(d:1.0):2,\
  \ (b:0.8):2〉`，其中 `{a}` 的期望支持等于 0.7（这意味着 `d` 或 `b` 在原始数据库中与 `a` 一起出现两次）。`{a, b}`\
  \ 的期望支持值为 `2 × 0.7 × 0.8 = 1.12`，`{a, d}` 为 `2 × 0.7 × 1.0 = 1.4`。因此，`{a, b}` 和\
  \ `{a, d}` 都是频繁的。\n\n算法随后从这个单路径树中提取，为 `{a, b}`-投影数据库形成 UF-树。生成的树如图 15.1c 所示，包含一个单节点\
  \ `(d:1.0):2`，其 `{a, b}` 的期望支持度为 0.56 = 0.7 × 0.8（这意味着 `d` 在原始数据库中与 `a, b` 一起出现两次）。项集\
  \ `{a, b, d}` 的期望支持度为 0.56 × 1.0 = 1.12，是频繁的。这标记了 `{a}` 扩展的结束。\n\n然后，算法考虑 `ItemM`\
  \ 中的下一个项（即 `b`），并为 `{b}`-投影数据库构建 UF-树。生成的树如图 15.1d 所示，由单路径组成——即 `〈(d:1.0):3, (c:0.8):2〉`，其\
  \ `b` 的期望支持为 0.8（这意味着 `d` 在原始数据库中与 `b` 一起出现三次）。`{a, b}` 的期望支持值为 `2 × 0.7 × 0.8 =\
  \ 1.12`，`{a, d}` 为 `2 × 0.7 × 1.0 = 1.4`。因此，`{a, b}` 和 `{a, d}` 都是频繁的。\n\n算法随后从这个单路径树中提取，为\
  \ `{a, b}`-投影数据库形成 UF-树。生成的树如图 15.1e 所示，包含一个单节点 `(d:1.0):2`，其 `{a, b}` 的期望支持度为 0.56\
  \ = 0.7 × 0.8（这意味着 `d` 在原始数据库中与 `a, b` 一起出现两次）。项集 `{a, b, d}` 的期望支持度为 0.56 × 1.0\
  \ = 1.12，是频繁的。\n\n![fig15_1](img/fig15_1.jpg)\n\n图 15.1 我们提出的算法使用的 UF-树\n\n### 5.4.1.2\
  \ 寻找满足简洁约束的全局频繁项集](#26_Chapter15.xhtml_sec15_4_1_2)\n\n一旦从确定数据中找到局部频繁项集，下一步是在这些局部频繁项集中寻找全局频繁项集。注意，将每个站点/处理器的\
  \ TDB 数据全部传输到集中站点/处理器 Q 不是一个好主意，在那里合并所有数据以形成全局数据库 TDB 并从中寻找全局频繁项集。这种方法的问题在于传输每个站点的数据需要大量的通信。\n\
  \n相反，我们提出的算法执行如下。每个站点/处理器 PI（对于 1 ≤ i ≤ p）应用约束检查和频率检查以寻找局部频繁的 `ItemMi` 项（以及用于 CSUC\
  \ 的 `ItemOi` 项），然后将它们传输到集中站点/处理器 Q。它获取这些项的并集并广播给所有 PI。每个 PI 然后从 TDBi 的事务中提取这些项（潜在的全局频繁项）并将其放入\
  \ UF-树中。\n\n\n\n\n在每个站点 `Pi`，`UF-tree` 包含 (i) 相对于 `Pi` 局部频繁的项目，以及 (ii) 相对于 `Pi`\
  \ 潜在全局频繁但局部不频繁的项目。然后，我们的算法递归地将常用的基于树的挖掘过程（例如 `UF-growth`）应用到 `Pi` 处 `UF-tree` 的每个\
  \ `α`-投影数据库上（其中局部频繁的 `α` ⊆ `ItemMi`），以找到受限的局部频繁项集（带有局部频率信息）。这些项集随后被发送到 `Q`，在何处对局部频率进行求和。结果是，找到受限的全局频繁项集。如果受限项集\
  \ `X` 的可用局部频率之和满足最小支持阈值，则 `X` 是全局频繁的。对于受限项集在站点 `P1` 局部频繁但在另一个站点 `P2` 不频繁的情况，`Q`\
  \ 会向 `P2` 发送请求以查找其局部频率。保证通过遍历 `P2` 处 `UF-tree` 中的适当路径可以找到此类频率信息（因为 `UF-tree` 保留了所有潜在全局频繁的项目）。\n\
  \n### 15.4.1.3 总结\n\n在分布式环境（例如无线传感器网络）中给定 `p` 个站点/处理器，我们的算法利用 (i) 受限的局部频繁项集和 (ii)\
  \ 保留了所有潜在全局频繁项目的 `UF-trees` 来高效地找到受限的全局频繁项集（相对于整个分布式环境）。再次，简洁的约束被推送到挖掘过程中；计算开销与简洁约束的选择性成正比。此外，我们提出的算法不需要处理器之间之间大量的量通信（例如，它不需要传输\
  \ `TDBi`）。\n\n### 15.4.2 寻找满足非简洁约束的频繁项集\n\n在第 15.4.1 节中，我们展示了提出的分布式挖掘算法如何找到满足简洁约束的频繁项集。回顾第\
  \ 15.3.2 节，尽管大多数约束是简洁的，但有少数约束是非简洁的。在本节中，我们将讨论如何修改所提出的分布式挖掘算法，以寻找不满足简洁约束的频繁项集。\n\n\
  #### 15.4.2.1 寻找满足归纳简洁约束的频繁项集\n\n对于非简洁的约束 `C`，我们提出的分布式挖掘算法首先测试此类非简洁约束 `C` 是否能被归纳为简洁约束\
  \ `C'`。如果是，算法将执行以下步骤：\n\n1. 算法将 `C` 归纳为 `C'`。\n2. 算法应用与第 15.4.1 节描述相同的挖掘程序，但使用归纳的约束\
  \ `C'`（代替原始约束 `C`）。换句话说，算法找到满足 `C'` 的局部频繁项集，并从中找到满足 `C'` 的全局频繁项集。\n3. 对于每个满足 `C'`\
  \ 的全局频繁项集 `X`，算法测试 `X` 是否也满足原始的非简洁 `C`。\n\n**示例 15.5**\n给定用户指定的约束 `C7 ≡ avg(X.Price)\
  \ ≤ $30`，我们的算法将 `C7` 归纳为简洁约束 `C6 ≡ min(X.Price) ≤ $30` 并找到所有满足 `C6` 的全局频繁项集。之后，算法对这些项集进行测试，并仅返回满足\
  \ `C7` 的项。\n\n#### 15.4.2.2 寻找满足反单调约束的频繁项集\n\n回顾第 15.3.2 节，如果满足 `CAM` 的项集的所有子集也满足\
  \ `CAM`，则约束 `CAM` 是反单调的（`AM`）。因此，对于非简洁且无法归纳为简洁约束的约束 `C`，我们提出的分布式挖掘算法测试此类非简洁约束 `C`\
  \ 是否为 `AM`。如果是，算法将执行与第 15.4.1 节描述相似（但不完全相同）的挖掘程序。具体而言，算法采取以下步骤寻找受限的频繁项集：\n\n1. 算法以第\
  \ 15.4.1 节描述的方式识别满足 `C` 的频繁项目。\n2. 算法以第 15.4.1 节描述的方式构建 `UF-tree`。\n3. 算法从 `UF-tree`\
  \ 中挖掘那些满足 `C` 的频繁项集。在这里，与通常的步骤 3 不同（通常步骤 3 在在形成投影数据库和为频繁项集 `X` 构建较小的 `UF-tree` 时不需要检查约束），算法需要应用额外的约束检查（以查看\
  \ `X` 是否满足 `C`）。\n   - 一方面，如果 `X` 满足 `C`，算法形成 `X`-投影数据库并构建一个捕捉该 `X`-投影数据库的较小 `UF-tree`。\n\
  \   - 另一方面，如果 `X` 违反 `C`，算法不形成 `X`-投影数据库，且 `X` 的任何超集都可以被剪枝/忽略，因为只要 `X` 本身违反 `C`，这些\
  \ `X` 的超集就保证违反 `C`。\n4. 一旦找到了满足 `C` 的局部频繁项集，算法按照第 15.4.1.2 节的方式找到满足 `C` 的全局频繁项集。\n\
  \n**示例 15.6**\n给定用户指定的约束 `C8 ≡ sum(X.Price) ≤ $150`，我们的算法构建一个捕捉所有频繁项目的 `UF-tree`。在挖掘过程中，算法递归应用约束检查以查看项集\
  \ `X` 是否满足 `C8`。如果满足，算法形成 `X`-投影数据库并为其构建相应的 `UF-tree`；否则，算法剪枝 `X`。因此，算法找到了所有满足 `C8`\
  \ 的全局频繁项集。\n\n#### 15.4.2.3 在后处理步骤中频繁项集\n\n最后，对于 (i) 既非简洁非 `AM` 又 (ii) 无法归纳为简洁约束的约束\
  \ `C`，我们提出的分布式挖掘算法执行以下步骤：\n\n1. 算法应用与第 15.4.1 节相同的挖掘程序，但不使用任何约束。换句话说，算法找到局部频繁项集，从中找到全局频繁项集。\n\
  2. 对于每个全局频繁项集 `X`，算法执行后处理步骤测试 `X` 是否满足原始的非简洁 `C`，如果满足则向用户返回 `X`。\n\n**示例 15.7**\n\
  给定用户指定的约束 `C9 ≡ sum(X.Rainfall) ≥ 90 mm`，我们的算法首先找到所有频繁项集，包括满足 `C9` 的和不满足的。然后，算法执行后处理步骤对这些项集进行测试，并仅返回满足\
  \ `C9` 的项。\n\n### 15.4.2.4 总结\n\n在分布式环境（例如无线传感器网络）中给定 `p` 个站点/处理器，我们提出的分布式挖掘算法根据约束\
  \ `C` 的以下类型首先寻找受限的局部频繁项集：\n\n- 如果 `C` 是简洁的（`SAM` 或 `SUC`），则我们的算法按照第 15.4.1 节的步骤执行。\n\
  - 如果 `C` 非简洁但可以归纳为简洁约束，则我们的算法按照第 15.4.2.1 节的步骤执行。\n- 如果 `C` 是 `AM` 但非简洁，则我们的算法按照第\
  \ 15.4.2.2 节的步骤执行。\n- 如果 `C` 既非简洁非 `AM` 又无法归纳为简洁约束，则我们的算法按照第 15.4.2.3 节的步骤执行。\n\n\
  \n\n\n随后，我们提出的分布式挖掘算法能够从捕捉所有潜在全局频繁项的 `UF-trees` 中有效且高效地找到受约束的全局频繁项（针对整个分布式环境）。\n\
  \n# 15.5 MrCloud：一种基于 MapReduce 的高效有效算法，用于支持云环境下不确定性大数据的受约束挖掘\n\n给定 (i) 不确定性大数据，(ii)\
  \ 用户指定的 `minsup` 以及 (iii) 用户指定的约束 `C`（例如，`AM` 约束），从不确定性大数据中进行受约束频繁模式挖掘的研究问题是：从大数据中发现一组期望支持\
  \ $\\ge$ `minsup` 且满足 `C` 的完整模式集（即有效频繁模式）。在本节中，我们介绍了我们的数据分析算法——名为 `MrCloud` 的算法，它使用\
  \ `MapReduce` 在云环境环境中管理、查询和处理不确定性大数据。具体而言，我们的算法管理不确定性数据的事务，允许用户通过指定表达其兴趣的约束来查询这些大数据，并处理用户指定的约束以从不确定性大数据中发现有用的信息和知识。\n\
  \n## 15.5.1 管理不确定性大数据\n\n为了管理不确定性大数据，我们的 `MrCloud` 算法同时跟踪 (i) 不确定性数据的事务和 (ii) 一个捕捉不确定性数据中领域项信息的辅助文件。在这里，不确定性数据每条事务中的项都与存在概率值相关，这表示这些项在事务中出现的概率，形式为每个项\
  \ `xi` 及其存在概率值 `P(xi, tj)` 的集合，如下：\n\n```\n{x[i] : P(x[i], t[j])}  (15.5)\n```\n\
  \n参见 `Table 15.3` 的示例性样本，该样本捕捉了关于旅行者访问机场的不确定性数据事务。另参见 `Table 15.4` 关于访问这些机场的旅行者可以获得的积分辅助信息。例如，`t1`\
  \ 捕捉了不确定性数据，即旅行者可能访问了六个机场（分别为 AMS, BCN, CPH, DEL, EDI 和 FRA）。其中， 100% 确定他访问了 `BCN`\
  \ 和 `EDI`（分别获得了 3000 和 2000 分）。他有 90% 的概率访问了 `AMS` 或 `DEL`（分别可以获得 2400 和 3200 分），50%\
  \ 的概率访问了 `CPH`（可以获得 2600 分），而只有 20% 的概率访问了 `FRA`（可以获得 2200 分）。\n\n### Table 15.3:\
