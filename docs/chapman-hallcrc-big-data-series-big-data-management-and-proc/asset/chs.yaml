  \ 9.4.2.3 系统约束\n#### 9.4.2.4 成本约束\n\n## 9.5 结论\n\n## 9.6 参考文献\n\n\n\n\n\n对来自自然系统（例如构造板块运动、大气数据）、工程系统（例如服务器、电子设备）以及人类活动（例如轨迹、Web\
  \ 点击流、健康记录、客户交易、社交网络中的用户交互）所产生的海量数据进行分析，需要高度可扩展的数据管理系统，这些系统在算法和架构上都具备新的能力。连接关系型数据库管理技术与\
  \ Hadoop 生态系统的 `SQL-on-Hadoop` 正在成为大数据分析的主流。\n\n## 9.1 引言\n\n大数据具有传统系统无法处理的特征，例如：(i)\
  \ 高容量（high volume）——容量指数据量，目前已增加到 TB（太字节）和 PB（拍字节）级；(ii) 高速度（high velocity）——指新数据生成和处理的速度，因此挑战是在数据产生的同时对其进行分析；(iii)\
  \ 高多样性（high variety）——指不同类型的数据，例如结构化数据（关系型数据）、半结构化数据（`XML`, `JSON`）和非结构化数据（文本和多媒体内容）。最近又增加了特征，即\
  \ (iv) 真实性（veracity）——指数据的混乱程度或可信度，通常缺乏质量和准确性；以及 (v) 价值（value）——指从数据中获取价值。\n\n关系型数据库管理系统（`RDBMSs`）是数据存储的事实解决方案。然而，业务数据的容量、类型和速度已经发生了。为了解决高容量问题，`RDBMS`\
  \ 技术通过硬件升级（增加更多中央处理器和内存）进行垂直扩展。垂直扩展被证明是昂贵的。此外，`RDBMSs` 设计初是为了适应结构化数据，而大部分数据以半结构化或非结构化的格式出现。最后，`RDBMS`\
  \ 技术在高速处理方面不足，因为它们是为稳定的数据留存设计的。事实上，数据仓库技术被设计为定期刷新的批处理系统。然而，流式应用需要对激进增量进行管理。因此，关系型数据库无法处理大数据，新技术正在涌生。过去十年见证了日益增大数据管理技术，这些技术正成为大数据分析的主流。\n\
  \n正如 Ralph Kimball 所说，大数据是我们思考数据资产方式的范式转移，涉及到我们在哪里收集数据、如何分析数据以及如何从分析得出的洞察中变现。因此，大数据对数据管理技术产生了若干影响，并要求重新思考数据处理的每一个方面。首先，大数据管理系统部署在通用硬件集群上，这些集群聚合了\
  \ I/O 带宽和浮点运算次数，并且应该是弹性的，以便根据需要添加和释放存储和计算资源。其次，大数据意味着大规模收集、清洗和分析数据。\n\n`Apache Hadoop`\
  \ 生态系统是管理大数据最广泛的开源宣传的新平台之一。`Hadoop` 带有分布式文件系统（`HDFS`）以及用于在计算机集群上处理大型数据集的框架（`MapReduce`\
  \ 框架）。基于 `Hadoop` 的新技术促进了具有高级和声明式语言的编程接口。因此，`SQL-on-Hadoop` 数据管理系统能够在基于 `MapReduce`\
  \ 的系统上使用类 `SQL` 语言（例如 `HiveQL`/Apache Hive`、`Spark SQL` 和 Cloudera Impala）。早期发表的\
  \ `Hadoop` 技术与 `RDBMSs` 的对比表明，`RDBMSs` 在结构化数据分析方面优于 `Hadoop`。这些对比在大数据管理和处理挑战并不成立。\n\
  \n本章探讨了评估 `SQL-on-Hadoop` 大数据管理系统的要求。本章大纲如下：[第 9.2 节] 回顾了数据管理系统的历史进展。首先，我们描述了在 `RDBMSs`\
  \ 中实现的先进硬件架构和查询处理技术。其次，我们介绍了 `Apache Hadoop 生态系统`。[第 9.3 节] 描述了 `SQL-on-Hadoop`\
  \ 技术，更准确地说是如 `Hive`、`Spark` 和 `Impala` 等开源项目。[第 9.4 节] 概述了 `SQL-on-Hadoop` 技术评估的要求。最后，第\
  \ 9.5 节 总结了本章。\n\n## 9.2 大数据管理系统\n\n处理巨大的数据集，大多数在线分析处理（`OLAP`）系统都是 I/O 密集和 CPU 型的。首先，这是由于硬盘的\
  \ I/O 性能演进速度慢于存储计算硬件（摩尔定律）和网络硬件（吉尔德定律）。其次，`OLAP` 系统需要高计算能力。自 20 世纪 80 年代以来，随着 `RAID`（廉价磁盘冗余阵列）系统和分布式数据结构的开创性研究，从业者和专家都承认，将磁盘\
  \ I/O 分配到多个磁盘驱动器可以聚合驱动 I/O 吞吐量并防止 I/O 瓶颈。为了实现高性能和大容量，数据库系统和分布式文件系统依赖数据分区、并行处理和并行\
  \ I/O。\n\n在本节中，我们概述了同时处理 `OLAP` 和在线事务处理（`OLTP`）负载的大数据管理系统。首先，我们描述了 `RDBMSs` 实现的先进硬件架构和查询处理技术。其次，我们介绍了\
  \ `Apache Hadoop 生态系统`。第三，我们概述了新 SQL 系统。\n\n### 9.2.1 关系型数据库管理系统\n\n`RDBMSs` 基于\
  \ E. F. Codd 发明的关系模型。在本节中，我们概述了用于处理 `OLAP` 负载的 `RDBMSs` 的 (i) 硬件架构、(ii) 存储布局和 (iii)\
  \ 数据处理技术。\n\n#### 9.2.1.1 并行体系架构\n\n大数据管理有两种不同的数据库硬件架构：(1) 对称多处理（`SMP`）和 (2) 大规模并行处理（`MPP`）。后者更具成本效益，因为系统增长几乎不受限制。\n\
  \n`SMP` 环境是一种紧耦合的多处理器系统，其中处理器、相同的内存、磁盘空间和 I/O 设备使用单一操作系统，并通过公共总线连接。节点之间的通信通过共享内存进行。负载分布在系统中的处理器上。作业完成的实际速度限于系统中的共享资源。注意，性能受内存总线的带宽。系统可能会进行垂直升级，即垂直扩展。\n\
  \n`MPP` 环境是一种松散耦合或无共享的多处理器系统。每个节点都有自己的计算单元、操作系统和内存。节点通过高速网络连接，并通过发送消息进行相互通信。`MPP`\
  \ 可以以无共享或共享磁盘架构进行设置。要扩展 `MPP` 系统，需要添加计算节点以及相关的内存和磁盘资源（即水平扩展）。\n\n#### 9.2.1.2 数据碎片\n\
  \n\n\n\n\n数据分片（又称 sharding 或 partitioning）涉及将数据集拆分为较小的分片，并将它们分布在大量机器上。其目标是：(i) 通过启用查询内并行和查询间并行来最小化查询运行时间；(ii)\
  \ 通过针对性的并行刷新操作降低数据仓库的维护成本；(iii) 通过使用无共享架构的廉价硬件而非昂贵的服务器架构，降低数据仓库的所有权成本。\n\n### 9.2.1.3\
  \ 存储布局 \n\n在存储布局方面，大数据管理有两种不同类型的存储布局，即 (i) 行存储型和 (ii) 列存储型。列式 DBMS 将数据表存储为数据列。列式数据库与传统行存储数据库之间的主要区别集中在：性能提升、通过仅加载有用属性来实现高效的内存管理、通过压缩重复值减少存储需求，以及模式修改技术。近年来，出现了许多列式数据库系统，包括\
  \ `MonetDB` [5]、`C-Store` [6] 和 `VectorWise` [7]。列存储布局非常适用于 OLAP 类工作负载，而行存储布局则非常适用于\
  \ OLTP 工作负载。\n\n### 9.2.1.4 数据处理技术 \n\n近年来，针对 OLAP 类工作负载的高效数据处理技术研究，包括：(1) 并行查询处理、(2)\
  \ 物化视图和计算属性、(3) 向量查询处理、(4) 物化策略、(5) 仅索引计划以及 (6) 隐式连接。\n\n*   **并行查询处理**：数据库集群的并行查询处理基于两种非互斥的技术，即查询内并行和查询间并行。在查询内并行中，一个查询被分为多个子查询，每个子查询处理不同的数据集。子查询并行运行。在查询间并行中，查询并发执行以提高系统吞吐量。\n\
  *   **聚合表和计算属性**：聚合表（又名物化视图）将大量详细行汇总为粒度更粗的信息，因此行数更少。由于数据是预先计算的，聚合表允许更快的 OLAP 立方体处理。派生属性根据其他属性计算得出。在\
  \ [8,9] 中，作者对 OLAP 工作负载中聚合表和计算属性的使用提出了合理建议。\n*   **向量查询处理**：标准的查询执行系统每次处理一行。向量化查询执行通过一次处理一组数据行来简化操作。在块内部，每列都被存储为一个向量。算术和比较等简单操作通过在循环中快速迭代向量来完成，且没有或只有极少数函数调用或条件分支\
  \ [7]。\n*   **物化策略**：在行存储器中，未被选中的列在不再需要时就会从结果集中移除。在列存储器中，有必要决定何时何时这些列一起物化。有两种选择：早期物化和晚期物化。早期物化检索所有必要的列并预先将它们一起物化。晚期物化在处理的最后阶段（即展示之前）将列组合在一起。在\
  \ [10] 中，作者报告了他们在晚期和早期物化方面的经验，并强调了它们的优缺点。\n*   **仅索引计划**：该技术通过为所有需要的列创建索引，使得数据库系统在查询执行期间不需要进行任何表扫描。因此，基本关系以行方式存储，并在每张表的每列上都添加了额外的非聚类\
  \ `B+ Tree` 索引 [11]。\n*   **隐式连接**：该技术旨在加速列存储中的星型连接。隐式连接分三个阶段执行连接。首先，将每个谓词应用于相应的维度表，以提取满足该谓词的维度表键列表。这些键被用于构建内存哈希表。在第二阶段，使用每个哈希表来提取事实表中满足对应谓词的记录位置。然后，对所有谓词的位置列表进行交集，以生成事实表中满足条件的位置列表。连接的第三阶段使用事实表中的满足条件的位置列表。对于事实表中任何包含回答查询所需的维度表外键引用的列，将使用满足的位置列表提取外键值，并在相应的维度表中进行查找\
  \ [11]。\n\n### 9.2.1.5 RDBMS 基准测试 \n\n除了 TPC 基准测试 [12] 之外，很少有 RDBMS 基准测试。事务处理委员会提出了一组基准测试来评估\
  \ (i) OLTP 系统，如 `TPC-C` 和 `TPC-E`；(ii) OLAP，如 `TPC-H` 和 `TPC-DS`；(iii) 虚拟化系统，如 `TPC-VMS`\
  \ 和 `TPCx-V`；以及 (iv) 绿色系统，如 `TPC-Energy`。\n\n### 9.2.2 Apache Hadoop 生态系统 \n\nApache\
  \ Hadoop [13] 允许使用简单的编程模型跨计算机集群处理大型数据集。它旨在从单服务器扩展到数千台机器，每台机器提供本地计算和存储。Hadoop 并不依赖硬件来实现高可用性，而是设计在应用层检测并处理故障，从而在可能出现故障的计算机集群之上提供高可用服务。Hadoop\
  \ 集群规模极大，可达数千个节点。\n\nHadoop `YARN` (`Yet Another Resource Negotiator` 或 `MRv2`)\
  \ 相较于之前的 Hadoop 版本 (`MRv1`) 具有若干优势 [14]。它实现了单个节点的动态资源配置和灵活的资源模型。事实上，它倡导支持编程模型的多样性，并为实现分布式应用程序提供通用的资源管理框架。基础的\
  \ Apache Hadoop 系统有两个核心组件：\n\n*   **Hadoop 分布式文件系统**：`HDFS` 设计用于管理大量数据。它以大数据块的形式存储文件。HDFS\
  \ 的块大小以兆为单位（典型值为 `128 MB`、`256 MB` 等），远大于传统文件系统使用的块大小（`4 KB` 或 `8 KB`）。HDFS 将数据块分布在整个集群中。为了容错，块被复制多次以确保高数据可用性。HDFS\
  \ 在跨大型服务器集群上提供了高聚合 I/O 带宽。\n*   **MapReduce 框架** [15]：用于实现处理数据的应用程序。MapReduce 处理模型包含多个阶段：第一阶段是并行\
  \ `Map` 阶段，在此阶段输入数据被拆分成可以独立处理的块。每个 `Map` 任务的输出在内存中进行分区和排序，并在其上运行 `Combiner` 函数。此输出被写入名为\
  \ `Intermediate Data` 的本地磁盘。`Map` 阶段之后是 Hadoop MR 框架特有的洗牌（shuffle）和排序（sort）。在 `reduce`\
  \ 阶段，`Map` 阶段的输出被聚合以产生所需的结果。\n\n\n\n\n\n# 9.2.2.1 调优 MapReduce 任务](#20_Chapter09.xhtml_sec9_2_2_1)\n\
  \n为了最大化 MapReduce 任务的性能，以下操作至关重要：i) 在集群节点之间平衡负载，(ii) 设置适当的内存，(iii) 设置容器 mappers\
  \ 和 reducers，(iv) 选择合适的编码（codec），以及 (v) 根据输入数据和处理复杂度调整复制因子。下文中，我们列出了调优 MapReduce\
  \ 任务时最重要的调整参数。\n\n*   **内存和计算资源**：Hadoop 使用环境变量来决定在 MapReduce 任务执行期间，为每个 `Mappers`\
  \ 和 `Reducers`（YARN 子进程）等 Hadoop 进程分配的堆大小和计算单元数量。\n*   **数据块大小**：`HDFS` 使用块大小设置将文件划分为块，然后将这些块分布到整个集群中。每个\
  \ `HDFS` 文件可以设置不同的块大小。事实上，为了在每个 MapReduce 任务中获得最大的并行性，建议大文件使用大块，小文件使用小块。\n*   **输入分片大小**：默认情况下，输入分片大小等于块大小。MapReduce\
  \ 数据处理由输入分片驱动。事实上，为了获得最大的并行性（即增加 `Mappers` 的数量），每个 `HDFS` 块在逻辑上被划分为输入分片，每个输入分片分配给一个\
  \ `Mapper` 处理。\n*   **Reducers**：`Reducers` 的最佳数量取决于集群的计算能力以及输入 reducer 的数据量。\n\
  *   **Combiners**：Combiners 是本地 `Reducers`，其目的是减少传递给 `Reducers` 的中间键的数量。每个 combiner\
  \ 处理 `Mapper` 的输出并像 reducer 一样执行聚合。\n*   **数据压缩与解压缩**：压缩允许将计算负载从 IO 转移到 CPU。在 shuffle\
  \ 阶段，中间键值对通过网络分发到 `Reducers`，所有的中间数据和输出数据都会刷新到硬盘上。这些 I/O 操作是昂贵的。中间数据压缩可以节省存储空间并加速跨整个网络的数据传输。另请注意，Hadoop\
  \ 可以处理压缩文件，但某些格式是不可拆分的，例如 `Gzip` 和 `Snappy`。因此，每个不可拆分的文件完全由一个 `Mapper` 处理。尽管有硬件资源，但\
  \ `Mappers` 数量的减少会导致糟糕的并行处理性能和硬件资源利用率低下。Apache Hadoop 支持大多数常见的压缩格式，如 `Gzip`、`Snappy`、`Bzip2`\
  \ 和 `LZO`。通常通过压缩程度和压缩/解压缩速度来比较编码。在 [16] 中，作者研究了绿色 MapReduce 计算，概述了能量效率和 Hadoop 编码使用的权衡。\n\
  *   **复制因子**：复制因子是可以为每个 `HDFS` 文件设置和更新的属性。文件复制通过在整个 Hadoop 集群中分散数据块及其副本来操作。\n\n\
  # 9.2.2.2 Apache Pig Latin](#20_Chapter09.xhtml_sec9_2_2_2)\n\nApache Hadoop 是一个相关项目的生态系统。它包含一种高级脚本语言\
  \ Apache Pig Latin [17]。后者在有向无环图（DAG）计算中组织 MapReduce 任务的工作流。\n\n下文中，我们展示了用 pig latin\
  \ 脚本对 TPC-H 业务问题 Q5（图 9.1）的翻译和处理（分别参见 图 9.2 和 9.3）。Q5 列出了每个区域内每个国家由于行项目交易产生的收入，其中订单零件的客户和提供零件的供应商都在该国家。Q5\
  \ 有两个参数，即年份（例如 1994）和区域名称（例如 ASIA）。\n\n![fig9_1.jpg](img/fig9_1.jpg)\n\n图 9.1 TPC-H\
  \ 业务问题 Q5 的 SQL 语句。\n\n![fig9_2.jpg](img/fig9_2.jpg)\n\n图 9.2 TPC-H 业务问题 Q5 的 Pig\
  \ 脚本。（改编自 Moussa, R.: TPC-H benchmarking of Apache Pig Latin on Hadoop Cluster.\
  \ `https://sites.google.com/site/rimmoussa/CC_pig_tpch.tar`, 2011。）\n\n![fig9_3.jpg](img/fig9_3.jpg)\n\
  \n图 9.3 Q5 处理的 DAG 和统计。\n\n# 9.2.2.3 Hadoop 生态系统项目基准测试](#20_Chapter09.xhtml_sec9_2_2_3)\n\
  \nApache Hadoop 的发布包含了基准测试，例如 (i) TeraSort——Teragen 生成 100 B 级记录，由 TeraSort 执行排序；(ii)\
  \ TestDFSIO——它是分布式 IO 基准测试的 MapReduce 实现。许多基准测试项目通过著名的 TPC 决策支持系统测试研究了 Hadoop 集群的性能。在\
  \ [19] 中，TPC-H 基准被翻译为 HiveQL 以评估 Apache Hive 的性能。在 [8],18],20] 中，TPC-H 基准被翻译为 HiveQL\
  \ 以评估 Apache Hive 的性能。\n\n虽然 MapReduce 支持广泛的用例，但它并不是所有大规模计算的理想模型，特别是迭代作业和连接操作。\n\
  \n# 9.2.3 NewSQL 系统](#20_Chapter09.xhtml_sec9_2_3)\n\nNewSQL 由 451 Group [22] 术化，指一类可扩展\
  \ RDBMS，为 OLTP 读写负载提供可扩展性能，并具有 ACID 保证 [23]–27](#20_Chapter09.xhtml_ref_27)]。VoltDB\
  \ 和 Clustrix 数据存储使用传统方法，通过单个键进行分区，并使用一致哈希算法分布在服务器之间。Google Spanner 使用了不同的分区模型。Spanner\
  \ 部署包含一组名为 spanserver 的服务器，它们是负责服务的节点。一个 spanserver 管理成百上千个分单元（tablets），每个单元包含一组目录。NuoDB\
  \ 是另一种 NewSQL 解决方案，它对分区使用了完全不同的方法。NuoDB 部署由若干个存储管理器（SM）和事务管理器（TM）组成。SM 是负责维护数据的节点，而\
  \ TM 是处理查询的节点。每个 SM 都有完整数据的副本，这意味着 SM 内部没有进行分区 [28]。\n\n几乎所有的 NewSQL 系统都避免了 2PL（阶段锁），因为处理死锁非常复杂。一些\
  \ NewSQL 解决方案实现了创新的并发控制方法。例如，Google Spanner 使用混合方法，读写事务通过读写锁实现，但只读事务是无锁的。VoltDB\
  \ 假设可用内存足够存储所有数据，且事务很短。基于这些假设，所有事务在单线程无锁的环境中顺序执行 [28]。\n\nNewSQL 系统通过雅云服务基准测试（YCSB）和\
  \ TPC-C 进行基准测试 [24]。\n\n# 9.3 SQL-on-Hadoop 系统](#20_Chapter09.xhtml_sec9_3)\n\n\
  新的 SQL-on-Hadoop 系统如 Apache Shark、Apache Spark 和 Cloudera Impala 的目标是 (i) 通过实现传统的\
  \ RDBMS 优化来实现高性能，(ii) 通过支持不同的源格式来实现互操作。接下来，我们将概述 Apache Hive、Apache Spark 和 Cloudera\
  \ Impala 等开源项目。\n\n## 9.3.1 Apache Hive](#20_Chapter09.xhtml_sec9_3_1)\n\n\n\n\n\
  \nApache Hive 是一个基于 Hadoop 并由 Facebook 的开源数据仓库解决方案。Hive 支持使用 `HiveQL` 表示的查询，这是一种类似于\
  \ SQL 的声明式语言，这些查询会被编译为 `MapReduce` 任务。图 9.4 展示了 TPC-H 业务问题 Q5 的 `HiveQL` 代码。与传统数据库类似，Hive\
  \ 将数据存储在表中，每个表由行组成，每行由指定数量的列组成。每列都有关联的类型，可以是原始类型（整数、浮点数等）或复杂类型（map、list、struct）。`HiveQL`\
  \ 支持用户用其选择的编程语言以 `MapReduce` 程序的形式表示分析。\n\n![fig9_4.jpg](img/fig9_4.jpg)\n\n图 9.4\
  \ TPC-H 业务问题 Q5 的 `HiveQL` 代码。（改编自 Yuntao, J.:在 Hive 上运行 TPC-H 基准测试。[`github.com/rxin/TPC-H-Hive`](https://github.com/rxin/TPC-H-Hive),\
  \ 2009。）\n\n### 9.3.2 Apache Spark](#20_Chapter09.xhtml_sec9_3_2)\n\n`MapReduce`\
  \ 框架可能非常繁琐。底层文件系统由于数据复制、磁盘 I/O 和序列化会产生开销。对于需要数据重用的应用程序，`Pregel` [30] 是一种用于迭代图计算的系统，它将中间数据留在内存中；而\
  \ `HaLoop` [31] 提供了迭代式 `MapReduce` 接口。尽管如此，这些框架并没有提供更通用重用的抽象，例如允许用户将多个数据集加载到内存中并运行临时查询。受分布式共享内存的启发，在\
  \ [32] 中，作者提出了弹性分布式数据集 (`RDDs`)。`RDDs` 实现分布式内存抽象，允许程序员以容错的方式在大规模集群上进行内存计算。它们针对 `MapReduce`\
  \ 框架处理效率低的应用程序，例如迭代算法和交互式数据挖掘工具。\n\n`Spark SQL` 是开源的 [33]。它提供了一个 `DataFrame API`，可以对外部数据源和\
  \ Spark 内置的分布式集合执行关系操作。`DataFrame` 等于关系型数据库中的表，并且也可以以类似于 `RDDs` 的方式进行操作。与 `RDDs`\
  \ 不同，`DataFrames` 会跟踪其模式（schema）并支持各种关系操作，从而带来更优化的执行（参见图 9.5 中将 TPC-H Q5 翻译为 `Spark\
  \ SQL`）。\n\n![fig9_5.jpg](img/fig9_5.jpg)\n\n图 9.5 TPC-H 业务问题 Q5 的 `Spark` 代码。（改编自\
  \ Savvides, S.:使用 `DataFrames API` 在 Spark 中实现 TPC-H 查询。[`github.com/ssavvides/tpch-spark`](https://github.com/ssavvides/tpch-spark),\
  \ 2015。）\n\n### 9.3.3 Cloudera Impala](#20_Chapter09.xhtml_sec9_3_3)\n\nCloudera\
  \ Impala [35] 是一个开源的 MPP SQL 查询引擎，专门设计用于利用 Hadoop 的灵活性和扩展性，以及数十年来并行数据库的研究（半连接、向量化处理、运行时代码生成\
  \ [36]）。\n\n自定义的应用程序逻辑可以通过 Java 和 C++ 中的用户定义函数 (`UDFs`)，以及 C++ 中的用户定义聚合函数 (`UDAs`)\
  \ 并在其中。由于 `HDFS` 作为存储管理器的局限性，`Impala` 不支持 `UPDATE` 或 `DELETE`。`Impala` 支持通过删除表分区来批量删除数据。通常，用户会重新计算数据集的一部分以包含更新，然后替换对应的数据文件，这通常通过删除并重新添加分区来实现，如\
  \ [8] 中为处理 Hadoop 集群中的 TPC-H 刷新函数所示。\n\n### 9.3.4 SQL-on-Hadoop 系统的 TPC 基准测试经验](#20_Chapter09.xhtml_sec9_3_4)\n\
  \nSQL-on-Hadoop 系统使用最著名的决策支持系统基准测试，即 TPC-H 和 TPC-DS 进行基准测试。此后，我们将概述 SQL-on-Hadoop\
  \ 的相关基准测试研究。在 [19] 中，TPC-H 基准测试被翻译为 `HiveQL` 以评估 Apache Hive 的性能。性能研究显示 `Hive+Tez`\
  \ 优于 `Hive+Oozie`。工作流调度器 Apache Oozie 会降低并行并执行昂贵的 I/O 操作。它被 `Tez` [37] 取代，后者增强了任务调度并避免了\
  \ Hadoop 的物化开销。\n\n在 [34] 中，TPC-H 基准测试被翻译为 `Spark` 以评估 Apache Spark 的性能。在 [38] 中，作者使用\
  \ `TeraSort` 基准测试比较 `MapReduce` 和 `Spark`。在 [39] 中，作者针对不同的文件格式（`ORC`、`Parquet`）和压缩类型（无压缩、`Snappy`）比较了\
  \ `Hive`、`SparkSQL` 和 `Impala`，基准测试为 SF=1000（即 1 TB），`Parquet` 优于所有存储选项。在 [35] 中，`Impala`\
  \ 优出五倍。与 `Hive`、`Spark` 和 `Presto` 相比，`Impala` 是性能最高的 SQL-on-Hadoop 系统。Floratou\
  \ 等 [40] 证明 TPC-H 和 TPC-DS 的规则未被遵循。事实上，(i) 性能测量限于 TPC-DS 基准测试的子集，即单个数据仓库和 99 个 TPC-DS\
  \ 查询中的十几个；(ii) 工作负载重写是因为 `Impala` 不支持窗口函数或聚合，或者为了优化昂贵的操作引入提示。\n\n## 评估 SQL-on-Hadoop\
  \ 系统](#20_Chapter09.xhtml_sec9_4)\n\nHadoop 厂商为开源版本添加了功能，重点关注客户端支持、集群管理的图形用户界面以及针对高性能的查询优化技术。因此，存在多个\
  \ Hadoop 发版，包括 Amazon Web Services Elastic MapReduce Hadoop Distribution、Hortonworks\
  \ Hadoop Distribution、Cloudera Hadoop Distribution、IBM Infosphere BigInsights Hadoop\
  \ Distribution 等。随着 SQL-on-Hadoop 系统的数量增加，能够评估这些方案变得很有必要。综述的研究论文 [19,34,35,38,40]\
  \ 使用 TPC 基准测试，即 TPC-H 和 TPC-DS 基准测试，这些并不是大数据的代表。接下来，我们认为 TPC-H 和 TPC-DS 不符合大数据的逻辑，且不足以比较\
  \ SQL-on-Hadoop 系统。然后，我们为通用的大数据管理系统评估提出了新的需求。\n\n### 9.4.1 TPC 基准测试的局限性](#20_Chapter09.xhtml_sec9_4_1)\n\
  \n使用 TPC 基准测试不符合大数据逻辑。它揭示了评估大数据管理系统时存在以下短板：\n\n•首先，TPC-H 和 TPC-DS 基准测试实现的刷新函数有限，而大数据的速度处理的是海量数据从源源持续流入的速度。\n\
  \n\n\n\n\n- 第二，`TPC-H` 和 `TPC-DS` 基准测试数据属于结构化数据模型，而大数据包含了所有类型的数据，包括结构化、半结构化和非结构化数据。\n\
  - 第三，`TPC-H` 和 `TPC-DS` 仅包含 OLAP 负载，而大数据涉及不同的负载类型，包括 `OLTP`、`创建–读取–更新–删除 (CRUD)`、`OLAP`、`排序`、`IO\
  \ 操作`、`信息检索`、`机器学习`以及`多媒体分析负载`。\n- 第四，大数据管理系统部署在通用硬件集群之上，每个节点都可能发生故障。报告系统性能即故障场景下的查询响应时间以及恢复丢失数据的时间）非常重要。\n\
  - 第五，TPC 基准是合成基准测试，而大数据的真实性指的是数据集中的偏差、噪声和异常。\n\n为了克服 `TPC-H` 和 `TPC-DS` 的缺点，研究提出了新的基准测试，如下：\n\
  \n- **BigBench 基准测试**：`BigBench` 数据模型采用了 `TPC-DS` 数据模型。其模式使用 `TPC-H` 的销售分布数据并结合半结构化和非结构化数据进行扩展。\n\
  - **TPC-DI 基准测试**：`TPC-DI` 促进了不同格式（`XML`）海量数据的处理与加载、复杂转换、历史加载和增量更新，以及确保集成过程产生可靠准确数据的一致性。\n\
  \n## SQL Hadoop 系统的需求与约束\n\n在本节中，我们提出了大数据管理系统需要考虑的关键需求和约束。\n\n### 服务质量需求\n\n- **服务水平协议\
  \ (SLA)**：`SLAs` 记录了服务提供商与客户之间约定的保证。它们定义了所提供服务的特性，包括服务目标（如最大响应时间、最小吞吐率和数据一致性），并定义了服务提供商未达到这些目标时的惩罚。\n\
  - **客户支持**：理想情况下，每个客户都能获得 `24×7×365` 的支持。\n\n### 容量需求\n\nSQL Hadoop 系统依赖 Hadoop\
  \ 的能力以及其 `SQL` 引擎。\n- **数据模型**：SQL Hadoop 系统设计应能够处理大数据的多样性。它们应该支持所有类型的数据，即：(1) 结构化、(2)\
  \ 半结构化和 (3) 非结构化数据。结构化数据是指存储具有预定义长度和格式字段中的任何数据（例如关系型数据库）。半结构化数据是具有层次结构的无模式数据（例如\
  \ `XML`、`JSON` 或 `BSON`）。非结构化数据通常由复杂的嵌套元素组成，行与行之间的类型不同。数据会不断演变，且占数据约 80%，包括文本和多媒体内容（例如文本文档、视频、音频文件）。\n\
  - **存储格式**：SQL Hadoop 系统应该实现高效的数据格式并支持现有格式。Hadoop 文件格式包括 (1) `SequenceFiles`、(2)\
  \ 序列化格式和 (3) 列式格式。`SequenceFiles` 以二进制键值对的形式存储数据。存储在 `SequenceFiles` 中的记录有三种格式：(i)\
  \ 未压缩、(ii) 记录压缩和 (iii) 块压缩。未压缩的 `SequenceFiles` 对于输入/输出 (`I/O`) 效率不高，因为它们占用更多的磁盘空间，而与记录压缩的\
  \ `SequenceFiles` 相比，基于块的压缩提供了更高的压缩率。\n\n通常用于 Hadoop 的压缩编码器具有不同的特性（压缩/解压缩速度和速率）。可拆分格式也是非常重要的考虑因素。可拆分格式允许\
  \ Hadoop 将文件拆分成块进行并行处理。序列化是指将数据结构转换为字节流的过程，以便进行存储或通过网络进行传输。相反，反序列化是将字节流转换回数据结构的过程。Hadoop\
  \ 生态系统中存在多种序列化框架，包括 `Facebook Thrift`、`Google Protocol Buffers` 和 `Apache Avro`（一种二进制行格式）。\n\
  \nHadoop 支持的列式文件格式包括 `RCFile` 格式、`优化行列存储 (ORC)` 和 `Apache Parquet`。`Parquet` 是一种自定义的类\
  \ PAX 格式，专门针对大型数据块（数十、数百、数千兆字节）进行了优化，并内置对嵌套数据的支持。最新版本（`Parquet 2.0`）还实现了嵌入统计：内联列统计以进一步优化扫描效率，例如\
  \ `min/max 索引`。\n\n### 一致性模型\n\n众所周知，没有任何单一的一致性模型适用于所有场景。SQL Hadoop 系统关注可扩展性和可用性；为了这些目的，它们异步复制数据。在跨越分布式数据管理系统的分布式事务中保证\
  \ `ACID` 属性（原子性、一致性、隔离性、持久性）是复杂的。网络连接可能会失败，或者一个节点可能成功完成了其事务部分，然后由于另一个节点的故障而被要求回滚其更改。此外，`CAP\
  \ 定理`断言，任何网络共享数据系统只能具有三个属性中的两个：一致性、可用性和分区容错。一致性确保系统中的所有服务器都具有相同的数据，因此无论使用哪个服务器响应请求，系统用户都会获得相同的查询答案。可用性确保系统将始终响应请求。分区容错确保即使单个服务器故障或无法访问，系统也能作为一个整体继续运行。\n\
  \n系统是基本可用的、处于软状态且最终一致的（即 `BASE`）。因此，(i) 系统确实保证数据的可用性以及对任何请求的响应，(ii) 系统状态可能会随时间变化，因此即使在没有输入期间，由于最终一致性也可能发生变化，因此系统状态始终是软状态。系统一旦停止接收输入，最终将变得一致。数据迟早会传播到它应该去的每个地方，但系统将继续接收输入，并且在移动到下一个事务之前不会检查每个事务的一致性。一致性保证会影响对并发读写请求的延迟和系统响应。\n\
  \n\n\n\n安全策略：SQL-on-Hadoop 系统实施安全策略至关重要，该策略应允许：(i) 确保数据集访问的正确性，使得只有授权用户才能查看和更新特定的数据集；(ii)\
  \ 审计每个用户的操作；(iii) 对静态数据和网络传输中的数据进行加密；以及 (iv) 启用细粒度访问控制，限制用户仅访问表中的某些列。Cloudera Hadoop\
  \ (`CDH`) 的最新版本为 `HDFS` 实现了访问控制列表 (`ACLs`)。`ACLs` 允许定义任意数量的用户组，然后为每个用户组分配其在目录和文件上特定的特定权限。\n\
  \n`Apache Sentry` 是一个开源项目，它为 `Hive` 和 `Impala` 表提供基于角色的访问控制。`Sentry` 允许通过向特定的 `Hive`\
  \ 或 `Impala` 表组授予 `SELECT`、`INSERT` 或 `ALL` 权限，来实现类似于数据库的安全策略，而不是针对底层的 `HDFS` 目录和文件进行。\n\
  \n## 高可用性\n多个磁盘之间的数据分布增加了分布式存储系统的故障概率。目前已经提出了许多构建高可用分布式数据存储系统的方法。它们通常使用 (i) 复制或\
  \ (ii) 奇偶校验。后者方法使用系统纠删码（例如 `Reed Solomon` [`RS]` 码、低密度奇偶校验码、`Tornado code`）。使用复制时，数据管理非常直观。然而，复制的存储开销始终高于系统纠删码。当目标是某一可用性水平时，纠删码能够提供比复制技术存储开销更的服务。对于数据仓库而言，通过纠删码实现高可用可以节省存储成本，特别是对于写一次类型（即不涉及删除刷新）的大型数据。尽管如此，数据恢复比复制要复杂。事实上，首先数据恢复不像复制那样简单的复制操作，它需要执行复杂的解码计算；其次，数据恢复涉及不同的服务器，它们将其内容发送到恢复管理器，因此意味着很高的通信开销。纠删码已被研究并被证明对于高可用分布式存储系统是高效的\
  \ [48,49]。`Quantcast File System` (`QFS`) [50] 是一个免费、高性能、容错的分布式文件系统，旨在为支持 `MapReduce`\
  \ 处理或其他顺序读写大文件的应用程序而开发，它使用纠删码来确保数据文件的高可用性。\n\n## 流式数据集成与处理\n数据仓库系统被作为 `OLAP` 系统的一部分部署，并与\
  \ `OLTP` 系统隔离开。数据向下传播到 `OLAP` 系统，但通常会有一些延迟。这种系统架构对于回溯性分析是足够的，但在需要实时分析的情况下尚不充用。由\
  \ `Natan Marz` [51,52] 定义的 `Lambda Architecture` 定义了一个稳健的框架，用于摄取快速数据流，同时提供高效的实时和历史分析。`Lambda\
  \ 架构` 要求对软件层进行修订。因此，为了应对大数据的速度，SQL-on-Hadoop 系统应该实时处理数据流，以跟上其到达的速度。开源的 `Apache Storm`\
  \ 和 `Apache Flink` 将数据流作为真正的流进行处理，也就是说数据流一旦到达就会立即进行流水线处理，而 `SparkStreaming` 则在微批处理的基础上处理数据流。\n\
  \n### 9.4.2.3 系统约束\n系统约束与首次设置约束有关，例如特定的操作系统（如用于 `IBM BigInsights` 的 `Red Hat Enterprise\
  \ Linux`）和硬件规格，如最小节点数（例如 3 个节点）、CPU 类型（例如 64 位系统）、最小 RAM 内存（例如 16 GB）以及用于管理节点和计算节点的硬盘数量和容量；其次是运行约束，例如最大并发用户数。\n\
  \n### 9.4.2.4 成本约束\nSQL-on-Hadoop 解决方案的部署方法有两种两种类型，这导致了不同的成本模型。第一种是本地部署，而第二种是云端部署。在本地部署中，公司负责搭建适当的硬件和软件、获取软件许可，并聘佣合格的人员进行系统运行和维护。在云端部署中，客户端通过互联网访问外部系统，云提供商按需交付和收缩\
  \ IT 资源，并将成本与实际使用量对齐。\n\n`Apache Hive`、`Apache Spark` 和 `Cloudera Impala` 是免费且开源的。然而，考虑到人力专业知识以及\
  \ HPC 平台成本，在 HPC 平台上部署免费软件是昂贵的。仔细查看 `IBM bluemix cloud portal` 上提供的 `IBM BigInsights`\
  \ 等商业报价，可以为非免费软件成本提供思路。`IBM` 建议在集群上安装三个模块：(i) `IBM Open Platform`——一种基于开源 `Apache\
  \ Hadoop Ecosystem` 的发行版；(ii) `BigInsights Data Analyst`——提供数据分析的特定工具以及 `Big SQL`\
  \ 和 `BigSheets`；以及 (iii) `BigInsights Data Scientist`——为数据科学团队提供在-Hadoop 内分析和预测建模，包含\
  \ `Big R`、`Text Analytics` 和 `SystemML`。成本随集群大小、模块和节点数量而异。对于 3 个节点、16 TB 的小型集群，`IBM\
  \ Open Platform` 费用为 12,510 美元/月，`BigInsights Data Analyst` 为 17,807 美元/月，`BigInsights\
  \ Data Scientist` 为 20,145 美元/月。对于 10 个节点、53 TB 的小型集群，`IBM Open Platform` 费用为 28,680\
  \ 美元/月，`BigInsights Data Analyst` 为 37,414 美元/月，`BigInsights Data Scientist` 为 42,090\
  \ 美元/月。\n\n## 9.5 结论\n在本章中，我们研究了大数据管理系统，特别是 SQL-on-Hadoop 系统。具体而言，我们审查了 SQL-on-Hadoop\
  \ 开源项目并确定了评估 SQL-on-Hadoop 系统的需求和约束。大数据管理的重点在于 (1) 水平扩展性和高性能、(2) 持续可用性、(3) 非结构化数据处理以及\
  \ (4) 实时处理。提出的需求和约束旨在实现公平比较。\n\n## 参考文献\n1. Patterson, D.A., Gibson, G.A., Katz,\
