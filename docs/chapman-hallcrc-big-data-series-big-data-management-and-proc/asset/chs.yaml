  \n106. Pop, F., and M. Potop-Butucaru.\n\n\n\n\n由于社交媒体、政府、行业和科学等机构捕获的数据量和细节不断增加，大量的结构化、非结构化或异构格式的数据流不断涌入。这些海量数据的产生是因为\
  \ Web 的增长、社交媒体的兴起、移动设备的使用，以及关于人、事物及其交互的物联网（IoT）信息。大数据时代已经到来。大数据已成为日常生活中影响力最大的力量。根据\
  \ IDC 的报告，数字宇宙每 2 年翻一倍，到 2020 年将达到 44 泽（zettabytes）[1]。\n\n如何存储海量数据不再是最大的问题。但如何设计解决方案来理解这些大数据是一项重大挑战。由于数据量庞大，分析操作、处理操作、检索操作等任务变得非常困难且耗费时间。克服这些问题的一种解决方案是利用数据挖掘技术从大数据中发现知识。数据挖掘\
  \ [2] 被称为探索性数据分析（等）。它是一种旨在探索数据的分析过程。数据挖掘旨在搜索变量之间一致的模式或系统性的关系。然后通过将检测到的模式应用于新的数据子集来验证这些发现。尽管隐藏模式是从大数据挖掘中的异构数据得出的，但这些隐藏模式仍可以被视为结构化知识。结构化知识与决策者的异构或非结构化人类知识相结合，并升级为智能知识\
  \ [3]。\n\n## 16.1.2 大数据挑战 (#27_Chapter16.xhtml_sec16_1_2)\n\n大数据 [4] 指代大型数据库的术语通过大数据的\
  \ 3Vs 具有一个全面的定义：数量（volume）、多样性（variety）和速度（velocity）。Garter [5] 将这 3Vs 模型扩展为 4Vs\
  \ 模式，增加了一个新的“V”：价值（value）。最近最近，该模型已更新为 5Vs [6]：数量、速度、多样性、真实性（veracity）和价值。数量是指每秒生成的海量数据。速度指新数据生成的速度以及数据移动的速度。多样性指的是不同类型的数据，例如结构化、非结构化和异构数据，以及可以使用的不同数据源。真实性指的是数据的混乱程度或可信度。对于不同形式的大数据，质量和准确性难以控制。价值指的是数据如何转化为价值。这是一个发现大数据集隐藏价值的过程，然后将其记录并社交化为已实现的价值。大数据的挑战由于其\
  \ 5Vs 特性而产生 [7]：\n\n- **数量 (Volume)**：由于电子邮件、推特消息（twitter）、照片、视频片段和传感器数据使用的增加，产生了海量数据。这些数据量太大，无法存储，且很难使用传统的数据库技术进行分析。挑战如何在海量数据中确定相关性，以及如何从相关数据中提取价值信息。\n\
  - **速度 (Velocity)**：大数据的另一个变化是如何快速对数据做出响应并在合理时间内进行处理。在大数据研究领域，在数据生成过程中对其进行分析且不放入数据库的技术是迫在眉睫。\n\
  - **多样性 (Variety)**：数据来自不同的源，具有不同的规范，如 Twitter、Facebook、LinkedIn 和即时消息，呈现复杂且异构的格式。另一个挑战问题是如何管理、合并和治理不同形式的数据。\n\
  - **复杂性 (Complexity)**：由于数据来源和结构的不同，质量和准确性较难控制。从异构数据中连接和关联以提取有用信息变得非常复杂，因此开发利用这一海量数据的改进非常广泛且分散。数据复杂度随着数据量的增加而增加。使用关系数据库工具的传统数据管理已无法满足捕获、存储和进一步分析大数据的需求。\n\
  \n## 16.1.3 大数据聚类分析 (#27_Chapter16.xhtml_sec16_1_3)\n\n在这个新世纪之初，信息增长的速度超过了摩尔定律。鉴于如此庞量的数据，需要高效有效的工具来分析并揭示隐藏在数据中的价值知识。数据挖掘技术是实现此目的为人知的知识发现工具。聚类是数据挖掘中流行的方法之一，已广泛应用于大数据分析。聚类的目标涉及将数据点划分为同质组，使得同一组的数据点尽可能相似，而不同组的数据点尽可能不相似。\n\
  \n然而，传统的聚类技术由于其高复杂性和计算成本，无法处理这些海量数据 [8]。大数据聚类的问题在于如何在最小程度牺牲聚类质量的情况下扩展和加速聚类算法。因此，需要一个具有合理计算成本的这种巨大、复杂、动态且异构数据的有效处理模型，以利用这些海量数据。单机聚类技术和多机聚类技术是最流行的两种大数据聚类技术。单机聚类算法在单台机器上运行，可以使用单台机器的资源，而多机聚类\
  \ [8] 技术运行在多台机器上，可以访问更多资源。多机聚类技术由于更好的可扩展性和更快的用户响应时间变得更加流行。\n\n## 16.1.4 章节结构 (#27_Chapter16.xhtml_sec16_1_4)\n\
  \n本章其余部分的结构如下：第 16.2 节介绍了主要的流聚类算法和大数据聚类的关键技术。第 16.3 节插图了用于单机聚类和多机聚类的技术实例。第 16.4\
  \ 节讨论了大数据聚类的应用，包括图像分割、并行计算中的负载均衡、基因图谱和社区检测。最后，在第 16.5 节对本章进行总结。\n\n\n\n\n`clustering`\
  \ 是探索性数据分析中最基础的任务之一，它在无监督过程中将相似的数据点归为一类。聚类技术已应用于许多领域，包括数据挖掘、模式识别、机器学习、生物化学和生物信息学等许多领域\
  \ [9]。聚类算法的主要过程是将一组未标记的数据对象划分为不同的组。聚类成员身份度量基于相似性度量。为了获得高质量的划分，需要最大化同一组内数据对象之间的相似性度量，并最小化不同组数据对象之间的相似性度量。大多数聚类任务使用迭代过程从高维数据寻找局部或全局最优解。此外，现实世界的数据没有唯一的聚类方案，而且对解释“聚类”表示也具有困难性\
  \ [9]。因此，聚类任务需要对不同的算法或同一数据集的不同特征进行多次实验。因如此，如何节省计算复杂度是聚类算法的一个重要问题。此外，聚类包含大量高维记录的巨型数据集现在被认为是一项非常重要的任务。大多数传统的聚类算法面临无法随数据集规模增大而扩展的问题，且大多数算法在内存空间和时间复杂度上的计算成本很高。由于这些原因，聚类算法的并行化是克服上述问题的实用方法，聚类算法的并行实现是某种不可避免的。\n\
  \n更重要的是，聚类分析与其他分析有所不同 [9]。聚类分析被称为无监督学习。其主要目标是根据输入数据集的概念或隐藏属性将一组未标记的数据集划分为若干组。换句话说，聚类分析是无监督的“非预测性”学习。它根据主观测量将数据集划分为若干簇。它与监督学习不同，不基于“训练过的表征”。通常情况下，聚类算法拥有一组理想的特征\
  \ [9,10]：**可扩展性**，算法的时间和空间复杂度在大规模数据集上不应爆炸；**健壮性**，在过程中应检测出数据集中的离群值；**顺序无关性**，输入的顺序不应影响算法的结果；**用户指定输入最小化**，用户指定的参数数量应降至最低；**任意形状簇**，簇的形状可以是任意的；以及**点比例可接受性**，不同的聚类算法根据不同的特征产生不同的结果。因此，选择聚类算法时应使得复制数据集并重新执行聚类任务不会改变聚类结果。\n\
  \n## 16.2.2 主流聚类算法](#27_Chapter16.xhtml_sec16_2_2)\n\n根据数据属性或聚类目的，人们已经开发了不同类型的聚类算法\
  \ [10]：\n\n- **划分（Partitioning）**：聚类需要先指定固定数量的簇。目标函数（如平方误差函数）被用作数据划分优化过程的标准。划分聚类使用迭代过程来优化聚类中心以及簇的数量。\n\
  - **层次的（Hierarchical）**：聚类不指定簇的数量，且输出独立于初始条件。然而，层次聚类是静态的，即被分配给某个簇的数据点不能重新分配到另一个簇。此外，由于缺乏关于簇的全局形状或大小的信息，它无法分离重叠的簇。\n\
  - **基于密度的（Density-based）**：聚类根据密度区域、连接性和边界分离数据对象。簇被定义为连接的密集组件，它们可以沿着密度引导的任何方向增长。基于密度的聚类有利于发现任意形状的簇，并能对离群值提供天然保护。\n\
  - **基于网格的（Grid-based）**：聚类将数据对象的空间划分为网格。它能够遍历数据集一次计算网格的统计值，处理速度快。然而，基于网格的聚类的性能取决于网格的大小；对于高度不规则的数据分布，它无法获得所需的聚类质量。\n\
  - **基于模型的（Model-based）**：聚类假设数据是由底层概率分布的混合生成的。这种方法用于优化给定数据与预定义数学模型之间的拟合程度。基于模型的聚类的一个优势是它可以根据标准统计自动确定簇的数量。\n\
  - **演化的（Evolutionary）**：聚类方法使用遗传算法、粒子群优化和其他演化方法处理聚类任务。例如，遗传算法使用进化算子（如选择、交叉和变异）和种群来获取输入数据的优划分。演化方法是随机的并使用迭代过程。这些算法从随机解种群开始，该种群是具有适应度的数据有效划分。在迭代步骤中，应用进化算子生成新种群。种群进入下一次迭代的概率由适应度函数决定。重复迭代步骤，直到找到满足某些停止标准的解。\n\
  \n## 16.2.3 大数据聚类的关键技术](#27_Chapter16.xhtml_sec16_2_3)\n\n与传统的聚类算法不同，聚类大数据时必须考虑数据量，因为这要求存储系统架构发生重大变化。此外，大多数传统的聚类算法旨在处理有限规模的数值或类别数据。另一方面，大数据聚类涉及图像、视频、传感器、移动设备、文本等不同类型的数据\
  \ [11,12]。此外，大数据的速度要求大数据聚类技术对数据的在线处理有高需求。在五类聚类算法的高层次，大多数算法都有相似的过程。这些算法从某些随机初始化开始，经过一些迭代过程直到满足某些收敛标准。例如，划分聚类（如\
  \ `k-means` 算法）从随机选择 k 个质心，并在迭代过程中将每个数据点重新分配给最近的簇质心。因此，大数据聚类的问题在于如何在最小化聚类质量损失的前提下，加速并扩展聚类算法。加速和扩展大数据聚类算法的方法有三种。\n\
  \n\n\n第一种方法是通过基于采样的算法减少迭代过程。基于采样的算法对数据集的样本进行聚类算法，而不是对整个数据集进行操作。基于采样的算法所需的复杂度和内存空间会减少，因为计算只需要针对较小的样本数据集进行。`PAM`、`CLARA`\
  \ 和 `CLARANS` [9–12] 被用于解决 `k-medoid` 聚类问题中的指数级搜索空间问题。\n\n第二种方法是使用随机技术降低数据维度。数据集的维度是另一个影响聚类算法复杂性和速度的因素。随机投影和全局投影用于将数据集从高维空间投影到低维空间\
  \ [8,12]。`CX/CUR`、`CMD` 和 `Colibri` [8,12] 是降维技术，旨在减少大数据聚类的冗长执行时间。\n\n最后一种方法是应用并行和分布式算法，利用多台机器来加速计算以提高可扩展性。并行处理应用包括传统并行应用和数据密集型应用。传统并行应用假设数据可以放入分布式机器的内存中。数据密集型应用是\
  \ I/O 密集型的，执行时间的大部分花在了数据移动上。`OpenMP`、`MPI` [13] 和 `MapReduce` 是计算数据密集型应用的常用并行处理模型。\n\
  \n## 16.3 大数据中聚类技术的实例 (#27_Chapter16.xhtml_sec16_3)\n\n在本节中，我们将列出一些为大规模数据集设计的聚类技术。根据所使用的计算机节点数量，主要分为两类技术：单机技术和多机技术。由于可扩展性和对用户响应速度更快，多机聚类技术吸引了更多的关注。常见的数据聚类技术列表见图\
  \ 16.1。\n\n![fig16_1.jpg](img/fig16_1.jpg)\n\n图 16.1 大数据聚类技术列表。\n\n### 16.3.1 单机聚类技术\
  \ (#27_Chapter16.xhtml_sec16_3_1)\n\n单机聚类技术运行在机器上，而数据存储在另一台机器上。基于采样的技术和降维技术是单机技术的两种常用策略。\n\
  \n#### 16.3.1.1 基于采样的技术 (#27_Chapter16.xhtml_sec16_3_1_1)\n\n聚类算法的可扩展性问题体现在计算时间和内存需求。基于采样的算法一次处理数据集的一个样本，然后将其推广到整个数据集。这些算法大部分是基于划分的算法。\n\
  \n`CLARANS` 是 `k-medoid` 方法的一个示例，它已被扩展到空间超大型数据库 (`VLDB`) [9–12]。在 `CLARANS` 之前，`PAM`（围绕中心点的划分）和\
  \ `CLARA` 是 `k-medoid` 方法的两个早期版本。`PAM` 是引入的最早 `k-medoid` 算法之一。在存在噪声和异常值检测的情况下，它比\
  \ `k-means` 更健壮。`PAM` 在迭代过程中将视角簇之间的点重新定位与将点重新命名为潜在中心点相结合。它采用目标函数来引导该过程。`PAM` 的空间复杂度为\
  \ `O(n2)`，因为它需要在中央内存中存储对象之间的整个两对差异性矩阵。因此，`PAM` 在大型数据集中变得不再实用。与 `PAM` 不同，`CLARA`\
  \ 的提出是为了避免这个问题。`CLARA` 使用五个样本，每个样本有 `O(k)` 个点。`PAM` 将应用于每个样本，`CLARA` 使用目标函数保留最佳中心点。整个数据集被分配给生成的中心点以进行最终划分。其空间复杂度和时间复杂度都是线性的，而不是二次的。\n\
  \n`CLARANS` 的提出是为了相比 `CLARA` 提高效率。`CLARANS` 使用随机搜索从一组中心点开始生成邻居。如果邻居代表了更好的划分，则继续使用相同的中心点集。否则，算法将从找到的局部最小值重启。返回最佳中心点以形成最终划分。`CLARANS`\
  \ 的时间复杂度为 `O(n2)`。\n\n#### 16.3.1.2 降维技术 (#27_Chapter16.xhtml_sec16_3_1_2)\n\n聚类算法的复杂性和速度受数据集中实例的影响。然而，数据挖掘中的对象可能包含数百个属性。数据集的高维是另一个影响因素，在此类高维空间中聚类需要更复杂的度和更长的执行时间\
  \ [8,12]。降维的一种方法是投影。数据集可以从高维空间投影到低维空间。`PCA`（主成分分析）是用于减少数据集维度的方法之一 [14]。它提供了数据的数据表示、内存减少和更快的执行时间。降维的方法方法是子空间聚类。子空间聚类试图寻找数据不同子空间内的聚类。高维数据中的许多维度是无关的。子空间聚类算法定位相关维度的搜索，使其能够找到存在于多个子空间中的类。`CLIQUE`\
  \ 是提出的用于寻找数据集子空间内聚类的算法之一 [15]。`CLIQUE` 结合了基于密度和网格的聚类。`CLIQUE` 处理高维数据的方式不是一次性处理所有维度，而是从处理单个维度开始，然后向更高维度增长。解决维度问题的最后一种是共聚类。传统的聚类只关注特征，而共聚类同时关注数据点和特征。双正则共聚类\
  \ (`DRCC`) [16] 方法基于半非负矩阵三分解是一种共聚类算法。它生成数据图和特征图，以探索数据流形和特征流形的几何结构。\n\n## 16.3.2\
  \ 多机聚类技术 (#27_Chapter16.xhtml_sec16_3_2)\n\n\n\n\n\n在如今数据爆炸的时代，并行处理对于及时处理海量数据至关重要。由于数据规模的增长远快于内存和处理器的进步，具有单个处理器和内存的单机集群技术无法处理海量数据。因此需要在多台机器上运行的算法。与单机技术不同，多机集群技术将海量数据划分为小块。这些微小的数据块可以加载到不同的机器上，并利用这些机器的计算能力来解决巨大的问题。并行处理应用包括传统并行应用和数据密集型应用。传统并行应用假设数据可以放入分布式机器的内存中。数据密集型应用是\
  \ I/O 密集型的，执行时间的大部分消耗在数据移动上。`OpenMP`、`MPI` [13] 以及 `MapReduce` 是计算数据密集型应用的常用并行处理模型。在这里，我们只讨论传统的并行和\
  \ MapReduce 聚类算法。\n\n并行和 MapReduce 聚类算法遵循图 16.2 所示的通用框架。首先，对输入数据进行分区并分布到不同的机器上。其次，每台机器对其拆分的输入数据执行本地聚类。第三，对机器信息进行全局聚合，以为整个数据集生成全局聚类。全局聚类被传回每台机器，作为新本地聚类的起始点。该过程持续进行，直到满足停止条件。最后，生成全局聚类的最终结果。\n\
  \n![fig16_2.jpg](img/fig16_2.jpg)\n\n图 16.2 大多数并行和 MapReduce 聚类的通用框架。\n\n### 16.3.2.1\
  \ 并行聚类](#27_Chapter16.xhtml_sec16_3_2_1)\n\n数据挖掘算法中使用的并行性主要策略可识别为以下几类 [10]：(1) 独立并行，整个数据在每个处理器上进行操作，处理器之间没有通信；(2)\
  \ 任务并行，在每个处理器上运行不同的算法；(3) SPMD（单程序多数据）并行，在多个具有不同划分的处理器上执行相同的算法。通过交换结果来相互协作。任务并行与\
  \ SPMD 并行结合主从架构是通常用策略。\n\n#### 16.3.2.1.1 并行划分聚类算法\n\n`k-means` 算法是最流行的划分聚类算法之一。参考文献\
  \ 17 引入了 `k-means` 的并行实现。并行 `k-means` 算法是基于工作站网络 (NOWs) 的消息传递模型开发的。除了并行 `k-means`\
  \ 之外，使用 `PVM`（并行虚拟机）的并行 `CLARANS` 算法在参考文献 18 中被介绍。`PVM` 使用主从范式。主程序可以将任务分配给其他从机，计算机之间的通信基于消息传递。\n\
  \n#### 16.3.2.1.2 并行层次聚类算法\n\n处理器的网络拓扑和拆分数据访问已用于层次聚类算法的并行化。一种名为 `PBIRCH` 的并行 `BIRCH`\
  \ [19] 是一种应用于带消息传递 SPMD 模型的层次聚类算法。`PBIRCH` 将数据等分给处理器，并在初始阶段应用 `k-means` 算法。将 `k`\
  \ 个初始质心广播到每个处理器，并据此构建 `CF-tree`。本地聚类的质心用于计算全局质心。每个处理器重新计算质心，重复该过程直到收敛。在图 16.3 中，`BIRCH`\
  \ 扫描输入数据并构建 `CF tree`。由于输入顺序的偏斜或页大小划分的影响，初始的 `CF-tree` 可能不准确。可以应用树压缩步骤来解决此问题。全局聚类合并叶节点中的所有子聚类，这是通过凝聚层次聚类算法完成的。聚类结果根据全局聚类步骤的结果重新分配所有数据点。\n\
  \n![fig16_3.jpg](img/fig16_3.jpg)\n\n图 16.3 BIRCH 算法流程图。\n\n#### 16.3.2.1.3 并行基于密度的聚类算法\n\
  \n`PDBSCAN` [20] 是 `DSBSCAN` 算法的并行版本。`DSBSCAN` 是一种基于密度的聚类算法。基于密度的聚类的主要目标是发现任意形状的簇。主从配置的\
  \ `PDBSCAN` 包括三个步骤。第一步将输入数据分为若干个分区并分配到不同的节点。第二步使用 `DBSCAN` 同时对分区进行聚类。最后一步汇总本地聚类并为整个数据计算全局聚类。\n\
  \n#### 16.3.2.1.4 并行基于图聚类算法\n\n图划分的目标是寻找良好的顶点。`METIS` 的并行化是 `ParMETIS`，它是一种多级划分算法\
  \ [21]。`ParMETIS` 包括三个阶段。第一阶段是粗化阶段。它在原始图上寻找最大匹配，使得匹配的顶点创建一个足够小的图。第二阶段是划分阶段。使用多级递归二分算法对粗化图进行\
  \ k 叉划分。最后阶段使用贪婪算法将划分从第二阶段投影回原始图。\n\n#### 16.3.2.1.5 基于 GPU 的并行聚类\n\n用 `GPU` 代替\
  \ `CPU` 可以加速并行计算。`GPU` 由数千个核心组成，而 `CPU` 只有几个处理器核心（见图 16.4）。`GPU` 比 `CPU` 强大得多。`G-DBSCAN`\
  \ [22] 是一种基于 GPU 的并行算法。`G-DBSCAN` 有两个并行步骤。第一步构建一个基于预定义阈值的边的图。第二步使用广度优先搜索 (`BFS`)\
  \ 遍历图以识别簇。结果显示 `G-DBSCAN` 比 `DBSCAN` 快 112 倍。\n\n![fig16_4.jpg](img/fig16_4.jpg)\n\
  \n图 16.4 CPU 和 GPU 的区别。CPU 有几个核心，而 GPU 由数百个核心组成。\n\n### 16.3.2.2 基于 MapReduce 的聚类](#27_Chapter16.xhtml_sec16_3_2_2)\n\
  \n`MapReduce` 是最有效的大数据解决方案之一，能够利用许多低端计算节点并行处理海量数据。这种编程范式是一种可扩展且容错的数据处理工具，旨在为大规模数据密集型应用提供显著改进。`MapReduce`\
  \ 因其简单性、可扩展性和容错性，在工业界和学术界获得了巨大的动力 [23]。\n\n\n\n\n\n`MapReduce` 模型隐藏了并行执行的细节，使用户可以只关注数据处理策略。`MapReduce`\
  \ 模型由两个基本元素组成 [24]:映射器（mappers）和归约器（reducers）。该编程模型的思想是设计 mappers（或 `map` 函数），它们可用于生成一组中间键/值对。reducer（或\
  \ `reduce` 函数）被用作洗牌或组合函数，用于合并与相同中间键关联的所有中间值。`MapReduce` 算法的主要方面是，如果每个 map 和 reduce\
  \ 都与其他所有正在进行的 map 和 reduce 独立，那么这些操作可以在不同的键和数据列表上并行运行。\n\n`MapReduce` 方法的过程可以分解如下：(1)\
  \ 准备输入数据：`MapReduce` 利用 `Google File System`（`GFS` 或 `HDFS`）作为底层存储层来读取输入并存储输出 [23]。`GFS`\
  \ 是一种基于块的分布式文件系统，通过数据分区和复制支持容错性。大数据被划分为小块并分布在不同的工作节点上。(2) map 步骤：将每个处理单元的 `map`\
  \ 函数应用于本地数据，并将输出写入临时存储空间。(3) 排序和发送步骤：对步骤 2 的输出按键进行排序，使得所有属于同一个键的数据位于同一个节点上。排序后的结果被发送到\
  \ reduce 处理器。(4) reduce 步骤：每组输出数据（每个键一组）在每个 reduce 节点上并行处理。用户提供的 `reduce` 函数会为 map\
  \ 步骤产生的每个键值执行一次。(5) 产生最终输出：`MapReduce` 系统收集所有的 reduce 输出并按键进行排序，以产生最终输出。结果存储在 `GFS`\
  \ 中。\n\n### 16.3.2.2.1 基于 MapReduce 的分区聚类算法\n\n`PKMeans` [25] 是 `k-means` 算法的分布式版本，使用\
  \ `MapReduce` 框架来加速和规模扩展处理过程。`PKMeans` 遵循图 16.5 所示的通用框架。数据在分布式文件系统中隐式地分区。局部聚类在 map\
  \ 步骤中使用 `k-means` 算法执行。全局聚类在合并和 reduce 步骤中执行。reduce 步骤的输出是聚类的质心，它们被发送回 map 步骤进行下一次迭代。该过程不断迭代直到收敛。`PKMeans`\
  \ 的加速和规模扩展接近线性，且规模扩展性也良好。\n\n![fig16_5.jpg](img/fig16_5.jpg)\n\n图 16.5 MapReduce\
  \ 系统的通用框架。\n\n### 16.3.2.2.2 基于 MapReduce 的 DBSCAN\n\n基于 `MapReduce` 的 `DBSCAN`\
  \ [26] 是一种使用 `MapReduce` 实现的基于密度的聚类算法。现有的并行 `DBSCAN` 有三个主要缺点。首先，它们无法在并行任务之间很好平衡负载。其次，这些算法的可扩展性受到限制，因为所有关键子程序都没有并行化。第三，这些算法对于新兴的并行处理范式的移植性较差，因为它们不是为无共享环境设计的。在\
  \ `MR-DBSCAN` 中，所有关键子程序都被并行化以确保可扩展性。提出了一种新的基于成本的数据分区方法，以便在高度倾斜的数据上实现理想的负载均衡。结果显示\
  \ `MR-DBSCAN` 具有良好的加速和扩展。它比现有的并行 DBSCAN 快得多。\n\n### 16.3.2.2.3 基于 MapReduce 的进化算法\n\
  \n进化算法固有的并行性质使其成为并行化的理想候选。参考文献 27 提出了一种可扩展的 `PSO` 以克服大数据集的低效问题。使用 `MapReduce` 方法论的\
  \ `MR-PSO` 已经成功实现了并行化。`MR-PSO` 是一种类似于 k-means 的聚类算法。`MR-PSO` 中的聚类任务被表述为一个优化问题，以便根据数据点之间的最小距离获得最佳解决方案。\n\
  \n### 16.4 应用](#27_Chapter16.xhtml_sec16_4)\n\n#### 16.4.1 图像分割](#27_Chapter16.xhtml_sec16_4_1)\n\
  \n图像分割是图像理解和计算机视觉中必要的第一步，通过正确分类图像的像素来实现 [28]。图像分割的基本目标是根据某些相似性度量（如灰度、颜色、色调等）将图像划分为均匀且属性相同的区域。由于图像的多性和复杂性，图像分割仍然是一个极具挑战性的研究课题。基本上，图像分割方法基于图像强度的不连续性和相似性。不连续性是一种基于突变划分图像的方法。根据预定义的标准，相似性方法是将图像划分为相似区域。\n\
  \n大数据图像分割是图像分析中的策略，特别出现在医学领域 [4]。不同的大数据图像分割算法已经在并行计算策略上执行，以获得有效结果。研究人员提出了各种技术来解决图像分割这一挑战性问题。由于图像分割的复杂性且仅提供部分先验知识，如果采用监督方法，分割结果将很。因此，无监督方法是解决此类问题的更好选择。聚类作为一种无监督学习策略已用于解决图像自动分组和图像分割问题。此外，聚类还可以以高效的方式组织和检索图像数据库。\n\
  \n分区聚类是大数据图像分割最流行的技术，因为其实现简单。参考文献 29 提出了一种分布式 `c-means` 算法用于大数据图像分割，并已应用于磁共振成像 (`MRI`)\
  \ 分割。该算法在基于移动代理的并行分布式机器上实现。该方法在智能体平台上实现。提出的算法在不同节点上的 `Mobile Classification Agents`\
  \ 上同时对其数据执行。结果提供给 `Mobile Host Agent` 以进一步计算全局结果，直到满足停止标准。分割图像由 `Mobile Classification\
  \ Agents` 提供。该算法应用于 `MRI` 大脑图像，结果显示使用多智能体平台降低了并行程序的复杂性。此外，它克服了大数据挑战，并利用多智能体系统提供了一个高性能计算工具。\n\
  \n#### 16.4.2 并行计算中的负载均衡](#27_Chapter16.xhtml_sec16_4_2)\n\n\n\n\n\n在大数据时代，快速且可扩展地部署虚拟\
  \ Web 商店、媒体机构或其他在线网站或服务是一个具有重大实际意义的问题。在基于云的架构中，一组托管资源（如处理器、操作系统、软件和其他组件）可以组合或连接在一起形成虚拟机。关键在于如何分配资源以支持这些虚拟机并缩短响应时间。负载均衡\
  \ [30] 是云计算中异构计算机网络的一个重要问题。负载均衡的主要关注点如何在用户之间分配资源，使得没有任何节点处于过载或空闲状态。传统的并行计算和网格计算环境负载均衡算法可以分为三类\
  \ [31]:\n\n1. **静态负载均衡算法**：这些算法适用于小型分布式环境。与负载均衡相关的决策将在估计资源需求时编译时做出。静态负载均衡算法的优势在于实现和开销都非常简单。\n\
  \n2. **动态负载均衡算法**：动态负载均衡算法的工作负载分配在运行时进行更改。由于它们在做出分配决策时使用当前负载信息，因此通信延迟和执行时间有所缩短。\n\
  \n3. **混合负载均衡算法**：这些算法是静态和动态负载均衡算法的混合。它们侧重于如何对称地分配计算任务以及如何减少对称分布式计算节点的通信成本。\n\n\
  在分布式系统环境中，负载均衡算法专注于通过分配系统总负载来缩短作业响应时间。目前有很多负载均衡算法。根据需求，聚类算法在实现云计算以执行访问资源的负载均衡方面起着重要作用。活跃聚类\
  \ [32] 是一种基于聚类的动态负载均衡算法。它通过局部重新连接将相似节点分组在一起，然后在这些簇上进行工作。它使用匹配节点（matchmaker node）的概念来创建一个簇。活跃聚类采用了分层次聚类算法的迭代特性。在迭代过程中，算法假设存在两类节点。第一个节点选择一个不同类型的匹配节点。该匹配节点与其与第一个节点相同类型的邻接节点连接。该过程重复，直到匹配节点被分离。系统性能通过高资源得到了增强，从而通过有效利用这些资源来了吞吐量。然而，由于系统多样性的增加，算法性能会下降。因此，云计算中迫切需要高效的负载均衡机制。\n\
  \n### 16.4.3 遗传图谱](#27_Chapter16.xhtml_sec16_4_3)\n\n遗传图是植物科学中的重要组成部分。遗传图具有许多实际生物学目的，是经典和现代植物研究的关键工具。遗传图是根据其共分离模式排序的遗传元素列表\
  \ [33]。遗传图的核心概念是连锁组。连锁组收集了位于单条染色体上的遗传标记。连锁组的数量等于物种中染色体的数量。遗传标记被聚类到连锁组中。为了将遗传标记分组到连锁组中，需要计算所有标记对之间的两相似性，然后使用各种标准聚类算法进行聚类。带有相似性评分的相似性矩阵是聚类算法的输入，对于\
  \ `m` 个标记，其复杂度为 `O(m2)`。\n\n因此，遗传图的瓶颈在于如何使用聚类算法高效地寻找连锁组。此外，传统的遗传图工具是为小型数据集设计的，只能处理多达\
  \ 10,000 个标记。在参考文献 34 中，提出了一种名为 `BubbleCluster` 的快速聚类算法来利用遗传标记的结构。`BubbleCluster`算法由三个阶段组成。第一阶段是最重要的。它利用遗传连锁组的结构快速将高质量标记聚类成骨架。第二阶段使用第一阶段获得的骨架来聚类噪声较大的低质量标记。从之前阶段发现的小簇将与大簇合并。该算法利用染色体底层的线性结构，避免了二次方两对计算。\n\
  \n### 16.4.4 社区检测](#27_Chapter16.xhtml_sec16_4_4)\n\n社区检测是将观测网络中的节点划分为组的有用工具。“网络社区”通常被认为一组节点，其中节点内部的连接是密集的，而组与组之间的连接是稀疏的\
  \ [35]。社区检测可能非常有用处。一个良好的划分可以被视为底层语义结构或可能的网络形成机制的提示。计算机科学、数学、物理学、统计学和生物信息学的研究人员使用社区检测算法来更好地理解社交和生物系统中组交互的大规模结构。例如，了解诸如\
  \ `LinkedIn` 等社交网络中的组或社区，可以推断工业界和学术界个人之间协作的趋势。它有助于通过揭示蛋白质相互作用网络中蛋白质组之间交互的本质，更好地理解关键生物过程的功能。因此，社区检测在大型社交网络、Web\
  \ 图谱和生物网络等真实世界图中引起了广泛关注。\n\n社区检测与聚类相似，两者都使用数据挖掘技术根据相似性测量将网络划分为组。在参考文献 36 中，引入了一种用于社区检测的快速并行模块化优化算法（`FPMQA`）。一种名为\
  \ `Interest Network` 的兴趣社交网络，如果两个 ID 都参与了一个或多个主题的讨论，则会连接这两个 ID。使用连接 ID 对的态态一致性更新初始网络。然后使用\
  \ `FPMQA` 进行社区检测。`FPMQA`假设网络中的每个节点都是一个独立的社区，然后它寻找局部最大值的社区对。`FPMQA`以并行方式将相应的社区对合并为一个社区。与传统方法相比，`FPMQA`缩短了社区检测的运行时间，并使用可靠的地面真来评估检测到的社区。\n\
  \n### 16.5 结语](#27_Chapter16.xhtml_sec16_5)\n\n\n\n\n在本章中，我们回顾了关于大数据聚类的文献以及相应的聚类算法。聚类算法分为六类：划分、层次、基于密度、基于模型、基于网格和基于演化的算法。最流行的聚类算法是划分算法和层次算法，并且许多算法的并行版本已经开发出来。传统的单机技术不足以处理如今积累的海量数据。聚类算法中的并行性对于多机技术至关重要。并行聚类对大数据聚类可能有用，但实现此类算法的复杂对于研究人员来说是一个挑战。因此，`MapReduce`凭借其简单性、可扩展性和容错性在工业界和学术界获得了巨大的动力。作为大数据挖掘中的一项重要任务，大数据聚类不仅限于图像分割、负载均衡、遗传图和社区检测。\n\
