  \ 结论\n- 致谢\n- 参考文献\n\n### 摘要\n`Tyche` 是一种直接构建在原始以太网之上的网络存储协议，不需要网络接口的任何硬件支持。它通过复制消除技术、内存预分配、自定义网络队列和结构、在无硬件辅助的情况下使用类似于远程内存访问（RDMA）的操作以及针对存储的数据包处理，提供了高\
  \ I/O 吞吐量和低 I/O 延迟。`Tyche` 透明地整合了多个网络网卡（`NICs`），并通过减少同步、适当的数据包队列设计和非均匀内存访问亲和性管理，实现了随链路和核心数量的扩展。\n\
  \n## 7.1 引言\n数据中心中的存储通常是应用服务器的独立层，访问主要通过存储区域网络（`SAN`）进行。为了在资本支出和运营支出方面提高数据中心的效率（例如降低能耗或使用更便宜的存储），促使人们通过融合这两个层来使存储更靠近应用和计算。融合存储主张在所有发生计算的服务器中放置存储设备（可能是面向性能的设备，如固态硬盘（`SSD`）或基于非易失性内存（`NVM`）的卡），并根据新模型调整当前的\
  \ I/O 栈。因此，计算服务器也被用单一分布式存储系统，背离了传统的 `SAN` 和网络附属存储（`NAS`）方法。在这种计算和存储共同位置的模型中，网络的作用对于实现高存储\
  \ I/O 吞吐量变得更加重要。\n\n尽管对高速互连技术（如 `Infiniband`）已有大量研究，但由于管理原因、成本效益以及已使用的软件栈，如今基于以太网的网络主导着数据中心。将基于以太网的网络用于存储也有许多优势。以太网技术已经追赶了其他技术，特别是在吞吐量方面。然而，以太网仍然显著短缺的一个领域是协议开销，这在\
  \ CPU 周期方面显而易见。诸如 `Infiniband` 等技术能够支持比以太网上使用的 `IP` 协议更轻量级的协议。随着以太网开始用于访问数据中心的存储，协议开销正成为主要关注点。因此，以太网之上的网络协议对于实现高效的存储访问起着至关重要的作用。##\
  \ 表 7.1\n表 7.1 汇总了基于以太网的针对存储的通用通用网络协议。我们将这些协议分为两类，取决于是否需要硬件支持。纯软件协议在处理小请求时通常表现出较低的吞吐量并产生高开销。主要原因是它们要么使用了\
  \ `TCP/IP`，要么没有针对存储进行优化。另一方面，硬件辅助协议通常以较低的开销获得最大的链路吞吐量，但它们需要自定义的 `NICs` 或对底层互连的其他扩展，这是部署和采用的重大障碍。\n\
  \n表 7.1 基于以太网的存储协议与通用网络协议\n\n| | 软件 | 硬件 |\n| --- | --- | --- |\n| 存储 | `NBD`, `iSCSI`,\
  \ `AoE`, `FCoE` | `iSER` [1], `SRP` [2], `gmblock` [3] |\n| 通用 | `PortLand` [4]\
  \ | `iWARP`, `RoCE`, `JNIC` [5] |\n\n\n\n\n\n我们的结果显示，`Tyche` 实现了可扩展吞吐量，在 6 × 10\
  \ Gbits/s 的网络链路上，读取速度高达 6.4 GB/s，写入速度高达 6.7 GB/s，且无需任何硬件支持。这分别是六块网卡（NIC）可用峰吞吐量的\
  \ 89% 和 93%。此外，我们减少上下文切换的优化协议对于低程度的 I/O 并发特别有效，能够为每个 4 kB-I/O 请求减少了 31% 的主机 CPU\
  \ 开销。对于高程度的 I/O 并发，自适应批处理显著提高了小数据 I/O 的链路利用率，并允许 `Tyche` 的 4 kB 请求达到理论链路利用率的 88%。\n\
  \n我们的分析表明，针对多资源的现代服务器网络存储协议需要针对 NUMA 亲和性和同步进行设计，以实现高网络吞吐量。否则性能将大幅下降。对于小 I/O，有两个方面对提高链路利用率特别有效：降低低度\
  \ I/O 并发时的开销，以及在高度 I/O 并发时将多个请求合并到单个消息中。\n\n本章的其余部分结构如下：7.2 节\n\n`Tyche` [6–8] 是一种基于原始以太网的网络存储协议，它在在无需任何硬件支持的情况下实现了高\
  \ I/O 吞吐量和低延迟。`Tyche` 通过在客户端（发起端）创建一个可以作为普通块设备使用的块设备，将远程存储设备本地化。`Tyche` 独立于存储设备，并支持任何现有文件系统。\n\
  \n图 7.1 描述了 `Tyche` 的整体设计，它由两层组成。块层负责管理 I/O 请求和 I/O 完成。网络层负责网络消息和数据包。\n\n![fig7_1.jpg](img/fig7_1.jpg)\n\
  \n图 7.1 从发起端到目标端的发送和接收路径概述。\n\n### 7.2.1 通信通道](#18_Chapter07.xhtml_sec7_2_1)\n\n\
  `Tyche` 使用通信通道的概念在发起端和目标端之间建立连接。每个通道允许主机向从远程主机发送/接收数据。因此，`Tyche` 是一种面向连接的协议，通过创建通道来执行两个节点之间的通信。\n\
  \n通道直接与其用于发送/接收数据的 `NIC` 关联。虽然一个通道映射到单个 `NIC`，但多个通道可以映射到同一个 `NIC`。当有多个 `NIC` 可用时，`Tyche`\
  \ 为每个 `NIC` 创建一个通道，允许在发起端和目标端之间创建多个通道。因此，`Tyche` 能够同时透明地管理多个通道/网卡。\n\n为了初始化协议栈，`Tyche`\
  \ 在发起端和目标端之间为每个可用的 `NIC` 打开一个通道。在握手阶段，对于每个通道，发起端和目标端交换有关资源的信息。然后发起端为远程设备创建一个本地设备，并准备好接收针对该新设备的\
  \ I/O 请求。\n\n无论是否为同一个远程设备打开了多个通道，`Tyche` 都使用动态调度器来选择通道（参见 7.3.2 节）。\n\n图 7.2 描述了写入请求通过通道的端到端\
  \ I/O 路径。读取操作遵循相同的路径，但数据消息是从目标端发送到发起端的。为了说明起见，我们使用了 16 kB 请求。接下来的章节将详细解释这一端到端 I/O\
  \ 路径。\n\n![fig7_2.jpg](img/fig7_2.jpg)\n\n图 7.2 当 `Tyche` 工作在内联模式下时，16 kB 写入请求通过通道的端到端\
  \ I/O 路径。线条和数字表示执行顺序。实线表示存在数据拷贝。虚线表示没有数据拷贝。“L”表示该操作需要锁。(a) 发起端发送路径。(b) 目标端接收路径。(c)\
  \ 目标端发送路径。(d) 发起端接收路径。\n\n### 7.2.2 网络消息](#18_Chapter07.xhtml_sec7_2_2)\n\n如图 7.2a\
  \ 所示，`Tyche` 接收来自上层（通常是文件系统）的常规 I/O 请求并到远程设备。一个 I/O 请求由其参数（请求类型、LBA 扇区、大小和标志）以及要写入的数据或用于放置读取数据的页组成。由于由于原因，`Tyche`\
  \ 支持两种类型的消息：请求消息和数据消息。\n\n请求消息用于传输参数以及从目标端向发起端发送 I/O 完成。数据消息用于发送数据页。对于写入，数据消息从发起端发送到目标端，而对于读取，数据消息从目标端发送到发起端。一个\
  \ I/O 请求对应三条网络消息：两条请求消息（请求本身及其完成情况）和一个数据消息。`Tyche` 始终通过同一个通道发送这三条消息。\n\n请求消息对应单个数据包，尺寸很小（小于\
  \ 100 字节），并使用以太帧传输。数据消息通过内存页的散聚集列表（I/O 缓冲区）通过 RDMA 类型消息发送。相应的（数据）包在 4 kB 或 8 kB\
  \ 的巨型以太帧中传输。一个数据包最多携带两个 4 kB 页，因此，针对 `N` 页 I/O 请求的数据消息对应 `N/2` 个数据包。\n\n### 7.2.3\
  \ 主要数据结构](#18_Chapter07.xhtml_sec7_2_3)\n\n为了减少内存管理的开销、减少共享结构的同步并允许随网卡和核心数量进行扩展，`Tyche`\
  \ 为每个通道分配所有资源。因此，每个通道拥有并管理自己的私有资源：块层的两个消息缓冲区和网络层的多个环形。\n\n在块层，每个通道都有两个独立的预分配的缓冲区（参见图\
  \ 7.2），一个用于请求消息，一个用于数据消息。消息通过这些缓冲区发送和接收。I/O 完成被作为请求消息处理，是在接收相应请求消息的同一个缓冲区中准备的。\n\
  \n在目标端，数据消息缓冲区包含预分配页的列表。目标端不仅使用这些页发送和接收数据消息，还向本地设备发布常规 I/O 请求。相反，发起端没有预分配的页。对于发送或接收数据消息，发起端直接使用常规\
  \ I/O 请求提供的页，从而避免了任何额外的数据拷贝。\n\n\n\n\n在网络层，每个通道使用三个环形（参见图 7.2），一个用于传输的 `TX_ring`，一个用于接收的\
  \ `RX_ring` 以及一个用于通知的 `Not_ring`。由于 Tyche 处理两种类型的数据包（请求包和数据包），每个通道的每个环形也有两个实例。请求包使用\
  \ `TX_ring_req` 发送，在 `RX_ring_req` 中接收，其通知放置在 `Not_ring_req` 中。同样地，数据包使用 `TX_ring_data`、`RX_ring_data`\
  \ 和 `Not_ring_data`。\n\n### 7.2.4 特定于存储的网络协议](#18_Chapter07.xhtml_sec7_2_4)\n\n\
  我们的数据包头部包含了便于网络层和块层之间通信的信息，允许每个网卡（NIC）拥有多个通道，并提供端到端的流控。\n\n对于每个数据包，头部包含通道标识符、在传输环形中的本地位置（该位置也表示远程接收环形上的位置）、消息在相应消息缓冲区中的位置，以及正确认和负确认。\n\
  \n对于数据包，头部还包括组成数据包的页数、这些页在数据消息中的位置，以及数据消息的总页数。\n\n通过在传输和接收环形上使用相同的位置，我们减少了接收路径中的数据包处理开销。通过为每条消息包含其在缓冲区中的位置，消息在到达时会被放置在其最终位置，从而避免了从网络层到块层的拷贝。\n\
  \n得益于这些字段，Tyche 还允许无序传输，并在通道映射到多个网卡的情况下通过多链路输送数据包。\n\n### 7.2.5 网络化 I/O 路径](#18_Chapter07.xhtml_sec7_2_5)\n\
  \n图 7.2 描述了一个 16 kB 写请求的端到端 I/O 路径。此外，图 7.3 至 图 7.6 描述了这一流路径并提供了更多细节。在这些图中，箭头上的数字表示在运行上一个动作后运行多个动作时的执行顺序。图\
  \ 7.2 至 图 7.4 用标签“L” 标记了某些需要同步的动作。为了简单起见，图中未包含错误处理和重传路径。\n\n![fig7_3.jpg](img/fig7_3.jpg)\n\
  \n图 7.3 发起端发送路径概述。\n\n![fig7_4.jpg](img/fig7_4.jpg)\n\n图 7.4 网络层接收路径概述。\n\n![fig7_5.jpg](img/fig7_5.jpg)\n\
  \n图 7.5 块层接收路径概述。(a) 在目标端。(b) 在发起端。\n\n![fig7_6.jpg](img/fig7_6.jpg)\n\n图 7.6 目标端完成路径概述。\n\
  \n对于每个 I/O 请求，发起者选择一个通道，并从该通道的缓冲区中获取一个请求消息和一个数据消息。然后，它组合这些消息并传输它们。图 7.3 显示了这一发送路径。\n\
  \n在目标端，专用的网络线程（每个网卡一个）处理入站数据包、组合消息并向块层生成通知。块层线程（每个通道几个）处理请求消息，并为每个请求构建适当的 Linux\
  \ 内核 I/O 请求并提交给本地块设备。图 7.4 和 7.5a 分别总结了网络层和块层的这些接收路径。\n\n目标端使用工作队列将完成情况发回发起端。本地\
  \ I/O 完成运行在中断上下文中，无法执行可能阻塞此类发送/接收网络消息的操作。因此，本地 I/O 完成调度了一个工作队列任务来执行所需操作。图 7.6 描述了这一完成路径，网络发送路径如图\
  \ 7.3 所示。\n\n当完成信号到达时，发起者运行接收任务以完成对应的 I/O 请求。图 7.5b 描述了发起端的块层接收路径，图 7.4 是网络接收路径。\n\
  \nTyche 可以以两种不同的模式运行。在“内联”模式下（图 7.1 至 7.3），应用程序上下文直接向目标端发布 I/O 请求，在发布路径中不需任何上下文切换。在“队列”模式下，普通的\
  \ I/O 请求被插入队列中，多个线程从队列中取出这些 I/O 请求并提交。\n\n### 7.3 面临挑战](#18_Chapter07.xhtml_sec7_3)\n\
  \n在队列模式](#18_Chapter07.xhtml_sec7_3) 中，发起者在提交请求后会阻塞。\n\n在我们的设计中，我们需要处理以下主要挑战：(i)\
  \ 内存管理；(ii) NUMA 亲和性；(iii) 同步；(iv) 多核访问单个网卡；(v) 延迟；(vi) 批量处理；(vii) 弹性。接下来我们将讨论如何应对这些挑战。\n\
  \n#### 7.3.1 内存管理](#18_Chapter07.xhtml_sec7_3_1)\n\n每个通道在接收消息时使用预分配缓冲区以减少内存开销。在目标端，每个通道还预分配了用于发送和接收数据消息以及提交普通\
  \ I/O 请求的页面。\n\n基于以太的网络协议涉及从内核缓冲区到实际数据位置的拷贝。原因是到达的数据位于 NIC 接收环的页中；然而，这些数据最终应放置在请求对应的页面中。对于写请求，Tyche\
  \ 通过交换页面避免了从内核缓冲区到 Tyche 页面的内存拷贝。在数据包到达时，目标端在 NIC 接收环和数据缓冲区之间交换页面。\n\n对于读请求，Tyche\
  \ 无法应用这种交换技术，而是在发起端执行单次拷贝。当读通过网络发送时，最初发布请求的层期望特定的连续物理页（Linux 内核中的 `struct page`\
  \ 对象）被填充。因此，交换页面不可行，需要内存拷贝。\n\n#### 7.3.2 NUMA 亲和性](#18_Chapter07.xhtml_sec7_3_2)\n\
  \n为了效率和可扩展性，现代服务器采用 NUMA 架构，如图 7.7 所示，这与我们使用的服务器对应。这些服务器使用多个处理器插槽，每个插槽连接有内存，导致处理器到不同内存的延迟不均匀。每个\
  \ I/O 设备通过 I/O 枢放置在特定的 NUMA 节点上（图 7.7）。处理器、内存和 I/O 枢通过高速互连进行连接，例如 QPI（快速路径互连）[9]。访问远程内存（不同\
  \ NUMA 节点）的延迟远高于访问本地内存，差异可达 2 倍 [10,11]。\n\n![fig7_7.jpg](img/fig7_7.jpg)\n\n图 7.7\
  \ 我们 NUMA 服务器的内部数据路径。\n\n在 I/O 路径中，与 NUMA 亲和性相关的元素包括应用程序缓冲区、协议数据结构、内核（I/O 和 NIC）数据缓冲区、网卡在服务器插槽上的位置、应用程序线程、协议线程、工作队列和中断处理程序。\n\
  \n\n\nTyche 通过考虑系统拓扑结构和网卡（NIC）的位置来编排内存与线程的亲和性。它为每个网卡创建一个通信通道，并将资源排他地关联到单个通道。\n\n\
  每个通道在网卡所挂载的相同 NUMA 节点上为所有用途分配内存，并将其线程固定在同一 NUMA 节点上。例如，在图 7.7 的架构中，映射到 `NIC-0` 的通道在\
  \ `Memory-0` 中分配资源，并在 `Processor-0` 内部的核心中运行其线程；而映射到 `NIC-3` 的通道则使用 `Memory-1` 和\
  \ `Processor-1`。\n\n网卡驱动程序为每个网卡拥有一套发送环和接收环。我们还强制在网卡所挂载的相同节点上分配这些资源，使其成为网卡通道的一部分。\n\
  \n我们还实现了一个具有 NUMA 感知能力的工作队列，因为在所使用的 Linux 内核中，无法对任务到工作队列的分配应用亲和性。我们的工作队列为每个核心启动一个线程，并且每个线程都固定在其对应的核心中。目标端通过其\
  \ NUMA 信息向工作队列提交完成消息。\n\n仍然存在一些未涵盖点，例如，在 Linux 内核中，无法强制放置 I/O 完成操作，也无法控制缓冲区缓存页的放置；而且控制应用程序线程的放置会对应用性能产生负面影响。\n\
  \n此外，我们实现了一个通道调度器[8]，它能够根据每个 NUMA 节点所实现的吞吐量和当前的请求负载动态选择调度策略。其目标是处理节点之间的负载不平衡问题。我们的通道调度器默认使用基于亲和性的策略。当它检测到跨\
  \ NUMA 节点的更优均衡可能带来更高的吞吐量时，它会切换到轮询策略。当它发现跨 NUMA 节点均衡请求产生了不必要的跨 NUMA 流量时，它会切换回亲和性调度。\n\
  \n### 7.3.3 同步](#18_Chapter07.xhtml_sec7_3_3)\n\n每个通道使用私有资源允许 Tyche 最小化同步。然而，Tyche\
  \ 仍然必须授予每个通道排他访问权限，因为多个线程可以同时使用同一个通道。出于同样的原因，网卡驱动程序也必须对其环授予排他访问权限。\n\n图 7.2 到 7.4\
  \ 用“L”标记了内联模式下端到端 I/O 路径上的锁。表 7.2 为每个锁给出了名称、层、使用该锁的路径和主机、受保护的数据结构或任务，以及在图 7.2 中持有锁的步骤。所有锁都是自旋锁。\n\
  \n表 7.2：Tyche 内联模式和队列模式端到端 I/O 路径上的锁\n\n| 锁 | 层 | 路径 | 数据结构/任务 | 图 7.2 中的步骤 |\n\
  | --- | --- | --- | --- | --- |\n| Mes | 块层 | IS, IR | 消息缓冲区 | 1, 17 |\n| NIC |\
  \ 网络驱动层 | IS, TS | 网卡发送环 | 3, 5, 14 |\n| Not | 网络层 | IR, TR | 每个通知环一个 | 7, 9, 10,\
  \ 11, 16, 17 |\n| Work | 块层 | TS | 工作队列 | 12, 13 |\n| Pos | 网络层 | IS, TS | 发送正确认\
  \ ack | 不包含 |\n| Neg | 网络层 | IS, TS | 发送负确认 ack | 不包含 |\n| Que | 块层 | IS | 请求队列（队列模式）\
  \ | 不包含 |\n\n注：S, R, I, 和 T 分别代表发送、接收、发起者和目标。\n\n此外，Tyche 使用原子操作来控制对其他数据结构（如其发送环）的访问。每个缓冲区的原子操作也避免了（罕见的）并发处理交叉消息的情况。\n\
  \n对于数据包和消息，Tyche 预先分配了它们在接收环和缓冲区上的位置；因此，接收路径不需要锁。发送完成也不需要锁，因为目标端通过相应的请求消息发送完成消息。\n\
  \n发起者路径可以在两种不同的模式下运行。在内联模式下，应用程序线程同时提交其请求而不执行上下文切换。队列模式使用上下文切换来避免许多线程访问发送路径并产生显著的同步开销。队列模式在发起者块层引入了一个新队列，因此需要锁。\n\
  \n我们之前的的结果[8]显示，我们的内联方法在不进行上下文切换的情况下提交请求，优于使用上下文切换来交换锁的队列方法，尤其在启用端到端 亲和性的情况下。\n\n\
  ### 7.3.4 多个核心访问单个网络链路](#18_Chapter07.xhtml_sec7_3_4)\n\n现代服务器中核心数量的增加了多个核心访问单个网络链路时的竞争。在发送路径上，发起者使用队列模式来限制访问链路的线程数。在目标端，工作队列发送完成，限制了与网卡交互的上下文。在接收路径上，Tyche\
  \ 为每个网卡使用一个线程来处理数据。我们的分析[6]显示，一个核心可以维持比单路 GigE 更高的吞吐量，因此不会限制最大吞吐量。\n\n### 7.3.5\
  \ 减少小型 I/O 请求的延迟](#18_Chapter07.xhtml_sec7_3_5)\n\n对网络 I/O 路径主机 CPU 开销的分析（参见.43\
  \ 用绿色圆标记了上下文切换；此外，表 7.5](#18_Chapter07.xhtml_tab7_5)描述了它们。处理 4 kB 请求至少涉及六次上下文切换。对于较大的请求，预计会有更多的上下文切换，因为发送/接收的数据包数量取决于请求大小。\n\
  \n```\n![fig7_8.jpg](img/fig7_8.jpg)\n```\n图 7.8 端到端 I/O 路径，显示了我们测量的组件以及用小圆标记的相应上下文切换。标签\
  \ A、B、C 等描述了计算值。我们展示了请求消息的路径。数据消息遵循类似的路径，使用不同的环。\n\n我们提出了 Tyche-NoCS，这是协议的一种变体，它避免了接收路径和目标发送路径上的上下文切换。7.4.3\
  \ 节显示这种设计对于低 I/O 并发程度特别有效。Tyche-NoCS 通过使用单个线程运行整个接收路径，避免了 CS-Rec（即网络和块线程之间的上下文切换）。网络线程处理数据包、组合消息，并检查与生成的请求消息相关的数据消息是否到达。当所有消息（请求消息和任何数据消息）都接收后，网络线程通过回调函数运行块层任务。为了避免阻塞该线程，我们还使用回调函数来检查组成一个\
  \ I/O 请求的所有消息是否已接收。此外，通信两个线程的通知环未被使用，我们通过避免使用它们以及例如确保其排他访问的锁来减少开销。\n\n\n\n\nTyche-NoCS\
  \ 还消除了 `CS-WQ`，即在目标发送路径中由于工作队列而执行的上下文切换，它通过尝试从本地 I/O 的完成文中将响应发送给发起者来实现。如果成功，则不会发生上下文切换。但是，如果操作需要阻塞（这在完成文中是不允许的），它将回退到基础版本的工作队列。请注意，如果由于传输环（transmission\
  \ ring）没有空间，完成上下文将会阻塞。避免工作队列意味着避免了相关的管理，例如向工作队列中插入/出队任务所需的锁。\n\n值得强调的是，Tyche 无法避免\
  \ `CS-IRQ`，即在接收路径中触发 NIC 中断时执行的上下文切换，因为中断处理函数无法执行任何可能导致睡眠的操作。之前的工作 [12,13] 已经研究过如何通过轮询代替中断来避免这种上下文切换。然而，我们没有考虑这种选项，因为旋转时间可能会显著增加，特别是对于大请求。在我们的案例中，NIC\
  \ 中断处理程序只是唤醒我们的网络线程。\n\n为了避免完成请求而执行的 `CS-Out`，应该修改 Tyche 之上的层。但这超出了我们的范范围，因为这种上下文切换不在\
  \ Tyche 的控制范围内。一种方案可以是应用程序线程等待完成轮询 [12,14]。但是，当有大量线程并发发出 I/O 请求时，轮询方案是不可行的。\n\n\
  ### 7.3.6 自适应批处理](#18_Chapter07.xhtml_sec7_3_6)\n\n在存在大量待处理小请求的高并发情况下，之前的设计无法实现高链路利用率，从而无法实现高\
  \ IOPS。因此，我们提出了一种自适应批处理，可以显著提高小请求的链路利用率。我们提议的新颖之处在于一种动态技术，可以在不增加 I/O 开销和响应时间的情况下改变批次数。\n\
  \n我们引入了一种新的请求消息，称为 `batch request message` 或 `batch message`。一个 `batch message`\
  \ 是一个单一的网络消息，包含了由相同或不同线程发出的多个 I/O 请求、读取或写入。当接收到 `batch message` 时，目标根据 `batch message`\
  \ 中包含的每个请求向本地设备发布一个常规 I/O 请求。完成情况也以 `batch messages` 的形式发送。当 `batch message` 内部的所有请求都完成后，目标会发送完成消息。`Batch\
  \ messages` 显著减少了消息数量以及相关的消息处理。\n\n我们还引入了 `batch data messages`，通过将两个 4 kB 请求批处理在一个\
  \ 8 kB 的单一数据包中来传输数据。这种方法也可以适用于更大的请求，但主要收益发生在 4 kB 请求被批处理并并在 8 kB 数据包中发送时。\n\n关于批处理有两个通用的说明。首先，批处理在达到请求大小之前是有意义的。大型\
  \ I/O 请求已经高效地利用了网络，批处理没有益处。考虑到 Tyche 的低开销，此大小为 8 kB，因此我们的提议仅对 4 kB 请求进行批处理。其他开销更高的系统也将将从批处理更大的请求中受益。其次，正如我们的结果所示，静态批处理在实践中不可行。因此，我们采用了一种自适应技术，不断调整批处理的请求数量。当我们的技术选择批次数为\
  \ 1 时，与优化的内联模式（inline mode）相比，不会产生额外开销。\n\n我们的批处理机制围绕内联模式发送路径中引入的 `batch queue`\
  \ 构建。现在，在发起者端，每个 I/O 请求被插入到 `batch queue` 中。然后，由单个（批）线程出队请求并将其包含在 `batch request\
  \ message` 中。\n\n我们批处理方法的关键方面是决定何时等待新请求，或何时立即发送 `batch message`。我们使用一个参数——当前批次级（`current_batch_level`）来确定包含在\
  \ `batch message` 中的请求数量。当 `batch message` 达到 `current_batch_level` 个请求时，我们发送它。我们根据所实现的链路吞吐量动态计算\
  \ `current_batch_level`。如果与当前值相比增加或减少批次级会导致吞吐量增加，我们将继续向相同方向移动。\n\n`current_batch_level`\
  \ 的值在 1 到 `max_batch_level` 之间变化，其中 `max_batch_level` 对应于 `batch message` 可以携带的最大请求数。\n\
  \n为了计算 `current_batch_level` 的值，我们的批处理机制计算两个值：(1) 上一个间隔和前一个间隔实现的吞吐量（`Xput` 和 `Xput_p`）；以及\
  \ (2) 上一个间隔 `batch queue` 中待处理 I/O 请求的平均数量（`a_out_r`）。\n\n然后我们计算上一个间隔相对于前一个间隔的吞吐量提升，并将\
  \ `current_batch_level` 设置为：\n\n如果提升大于 3%，则 `current_batch_level` 的新值将增加为：![inline-math7_1.jpg](img/inline-math7_1.jpg)。如果提升小于\
  \ −3%，则 `current_batch_level` 的值将减少为：![inline-math7_2.jpg](img/inline-math7_2.jpg)。\n\
  \n否则，对批次级不做任何更改。\n\n为了避免延迟请求过长，我们为批处理请求允许延迟的最大时间（`max_delay`）。当达到 `current_batch_level`\
  \ 或 `max_delay` 到期时，将发送 `batch message`。\n\n最后，我们避免在存在提高利用率潜力的情况下批次级保持不变的情况。因此，如果在连续\
  \ 10 个间隔内没有变化，我们将 `current_batch_level` 的吞吐量与 `current_batch_level` − 1 和 `current_batch_level`\
  \ + 1 进行比较。如果这些新值中的任何一个有至少 3% 的提升，我们重新调整 `current_batch_level`。\n\n### 7.3.7 弹性](#18_Chapter07.xhtml_sec7_3_7)\n\
  \n弹性是指根据工作负载自动移除或添加资源的能力，旨在高效利用资源。例如，典型的服务器拥有几十个核心和几个 10G 链路。Tyche 使用一个两个阶段的过程来处理此类弹性。第一阶段允许在不重启系统的情况下动态添加或移除\
  \ NIC。我们使用 `ioctl` 命令从用户空间调用此过程。当添加新的 NIC 时，会为其打开新通道。当移除 NIC 时，打开并映射到该 NIC 的通道将被关闭，这些资源将释放。\n\
  \n\n\n\n\n对于一个具有 `p` 个激活通道的 NUMA 节点，如果实现的吞吐量超过这些 NIC 可提供最大吞吐量的 75%，则将开启一个新的通道。\n\
  \n如果该 NUMA 节点没有更多可用通道（所有映射到该 NUMA 节点上 NIC 的通道道均已激活），而其他 NUMA 节点有可用通道（因为它们未激活），则实现最大吞吐量的\
  \ NUMA 节点将借用这些通道之一，并使用 `n + 1` 个通道。\n\n## 7.4 实验评估\n\n本节通过 Linux 内核 `2.6.32` 中 `Tyche`\
  \ 的实现对我们的提案进行评估。我们使用 `NBD`（网络块设备）作为基准，这是一种访问远程存储的纯软件解决方案。`NBD` 每个远程存储设备只能使用一个 NIC。我们也测试了\
  \ `iSCSI`，但 `NBD` 的性能优于 `iSCSI`，因此我们只在图表中包含 `NBD`。为了评估目的并作为一个中间设计点，我们还实现了一个使用 `TCP/IP`\
  \ 的 `Tyche` 版本，称为 `TSockets`。`TSockets` 使用 socket 进行通信，并通过为每个 NIC 创建连接来使用所有可用 NIC。在这里，我们提供了基准分析，然后分析\
  \ `NUMA` 的影响、我们提高小请求性能的提案以及我们的弹性方法。关于其他方面的分析可以在 [参考文献 6–[8] 和 [15]] 中找到。\n\n我们的实验平台由两个系统（启动端和目标端）组成，通过多个\
  \ NIC 背背连接。两个节点都拥有两个四核频率为 2.7 GHz 的 `Intel(R) Xeon(R) E5520` CPU。操作系统是 `CentOS 6.3`\
  \ 的 64 位版本，测试内核版本为 `2.6.32`。每个节点有六块 `Myricom 10G-PCIE-8A-C` 卡。每个卡在每个方向上都能实现约 10\
  \ Gbits/s 的吞吐量，全双工吞吐约为 20 Gbits/s。目标节点配备 48 GB `DDR-III DRAM`，启动端配备 12 GB。目标节点使用\
  \ 12 GB 作为 `RAM`，36 GB 作为 `ramdisk`。注意，我们使用 `ramdisk` 仅是为了避免存储设备的开销，因为我们关注的是网络路径。\n\
  \n我们通过两个微基准测试 `zmIO` 和 `FIO` 来评估我们方法的主要功能。`zmIO` 是一个内部微基准，它使用 Linux 内核的异步 I/O API\
  \ 在低 CPU 利用率下发出并发 I/O [[16]]。`FIO` 是一个灵活的负载生成器 [[17]]。\n\n### 7.4.1 基准性能\n\n首先，我们使用\
  \ `zmIO` 分析基准性能。运行 `zmIO`，配置为顺序读写、同步操作、直接 I/O、32 个线程提交请求且每个线程两个未完成请求、请求大小为 1 MB、运行时间为\
  \ 60 秒。以原始方式访问远程存储设备（没有文件系统）。针对一到六个 NIC 进行测试，每个 NIC 一个通道。`Tyche` 应用了 `NUMA` 亲和性。\n\
  \n[图 7.9] 显示了 `Tyche`、`TSockets` 和 `NBD` 的结果。对于读取，在多达三个 NIC 的情况下，`Tyche` 实现了 NIC\
  \ 的最大吞吐量。在四个或更多 NIC 时，`Tyche` 提供的吞吐量略低，分别为 4.3、5.4 和 6.2 GB/s。这是由于启动端拷贝页的开销，这种开销在高速率下变得明显。对于写入，`Tyche`\
  \ 实现了 NIC 提供的最大吞吐量，六个 NIC 除外（此时它获得了 6.5 GB/s）。在六个 NIC 运行此基准测试时，启动端的 CPU 利用率几乎达到\
  \ 100%。`TSockets` 的读取和写入达到 2.1 和 1.7 GB/s 的吞吐量。`NBD` 获得 609 MB/s 的吞吐量，因为它只能使用单个\
  \ NIC。因此，`Tyche` 的吞吐量是 `NBD` 的 10 倍以上，是 `TSockets` 的 3 倍以上。我们还看到 `TSockets` 比 `NBD`\
  \ 好 3 倍以上，这说明在访问远程存储时，`TCP/IP` 仅负责部分开销。\n\n![fig7_9.jpg](img/fig7_9.jpg)\n\n图 7.9\
  \ `Tyche`、`TSockets` 和 `NBD` 在使用 `zmIO`、顺序读写和 1 MB 请求时实现的吞吐量（GB/s）。(a) 读取请求。(b)\
  \ 写入请求。\n\n`Tyche` 的吞吐量随 NIC 数量而扩展，我们的提案实现了 NIC 吞吐量的 82% 到 92% 之间。`NBD` 只能使用单链路。`TSockets`\
  \ 不随 NIC 数量而扩展，通过使用六个 NIC，它最多只能饱和两个 NIC。\n\n### 7.4.2 处理 NUMA\n\n我们的分析 [[6],[8],[15]]\
  \ 表明，`NUMA` 亲和性是一个跨越整个 I/O 路径的重要问题，并对性能有显著影响。事实上，`Tyche` 仅在通过改进内存和线程的正确放置将性能提升高达\
  \ 97% 时 [[6]] 的情况下，才能实现最大吞吐量。\n\n我们现在分析取决于 `Tyche` 和应用程序所采用的布局的 `NUMA` 效应影响。[表 7.3]\
  \ 总结了评估的配置：`Ideal`、`TyNuma` 和 `Worst`。对于 `Ideal`，我们手动配置应用程序的 `NUMA` 布局。对于 `TyNuma`\
  \ 和 `Worst`，我们在没有任何亲和性提示的情况下运行应用程序。我们使用六个 NIC，每个 NUMA 节点三个，每个 NIC 一个通道。进一步的分析可以在\
  \ [6]],[8] 和 [15] 中找到。\n\n表 7.3\n\n用于 NUMA 研究的运行测试配置\n\n| | NUMA 亲和性 | | |\n| ---\
  \ | --- | --- | --- |\n| 测试 | `Tyche` | 应用程序 | 通道调度器 |\n| --- | --- | --- | ---\
  \ |\n| Ideal | 是 | 是 | 亲和性感知 |\n| TyNuma | 是 | 否 | RR |\n| Worst | 否 | 否 | RR |\n\
  | 注意：RR 代表轮询调度。 | | |\n\n我们使用开源的 `Intel Performance Counter Monitor` (`PCM`) [[18]]\
  \ 分析 `QPI` 流量，它提供了通过 `QPI` 传输的流量估计。[表 7.4] 描述了这些估计。\n\n表 7.4\n\n由 `PCM` 给出的 `QPI`\
  \ 链路流量估计（排除 I/O Hub 之间的 QPI 流量）\n\n| 名称 | 节点 | 流量 | 方向 |\n| --- | --- | --- | ---\
  \ |\n| Q1-N0 | 0 | 本地 | I/O-Hub-0 ⇔ Processor-0 |\n| Q1-N1 | 1 | 本地 | I/O-Hub-1\
  \ ⇔ Processor-1 |\n| Q0-N0 | 1 | 远程 | Processor-0 ⇒ Processor-1 |\n| Q0-N1 | 0 |\
  \ 远程 | Processor-1 ⇒ Processor-0 |\n\n我们使用 `zmIO` 是因为在没有提示的情况下，会将 99%的写入和约 75%的读取分配在单个\
  \ NUMA 节点（节点 0）上。因此，几乎分配到节点 1 通道的写入其资源都在节点 0 中，对于读取，这一比例仅为 50%。因此，对于 `zmIO`，性能取决于请求类型。\n\
  \n我们运行 `zmIO` 进行随机读写、直接 I/O、128 kB 请求、运行时间 60 秒。以原始设备访问远程存储。我们运行 4、8、16 和 32 个应用程序线程。[图\
  \ 7.10] 提供了 `Tyche` 随应用程序线程数变化的吞吐量（GB/s），以及随线程数和配置变化的启动端每个 `QPI`-节点链路的流量流量百分比。\n\
  \n![fig7_10.jpg](img/fig7_10.jpg)\n\n图 7.10 `Tyche` 在不同亲和性、使用 `zmIO`、128 kB 请求和随机读写时的吞吐量（GB/s）和\
  \ QPI 百分比。(a) 吞吐量—写入。(b) 吞吐量—读取。(c) QPI 流量—写入。(d) QPI 流量—读取。\n\n\n\n\n\n对于写入操作，只有\
  \ `Ideal` 配置实现了其最大吞吐量，达到 `6.25 GB/s`。几乎所有数据流量都通过 `QPI-1` 链路，两个节点上的流量相似。`Worst` 达到\
  \ `3.73 GB/s`，`Ideal` 性能比 `Worst` 高出 `86%`。现在，数据流量仅通过节点 0 上的 `QPI-1` 链路，因为几乎请求都分配在该节点上。节点\
  \ 1 上的 `QPI-1` 没有数据流量，而 `QPI-0` 上有大量流量。`TyNuma` 仅达到 `4.92 GB/s`，`Ideal` 将此吞吐量提升了高达\
  \ `27%`。在 `QPI` 流量方面，`TyNuma` 的表现类似于 `Worst`。\n\n由于 `QPI` 数据流量的影响，`Worst` 和 `TyNuma`\
  \ 无法提供更好的性能。`TyNuma` 优于 `Worst` 是因为在目标端（`Target`），`TyNuma` 应用了 `NUMA affinity`（NUMA\
  \ 亲和性），而 `Worst` 没有。\n\n对于读取操作，`Ideal` 和 `TyNuma` 分别达到 `6.85` 和 `6.64 GB/s`，而 `Worst`\
  \ 仅达到 `4.17 GB/s`。与 `Worst` 相比，`Ideal` 将吞吐量提升了高达 `73%`。\n\n`Ideal` 与 `Worst` 之间的性能差异同样由于\
  \ `QPI` 流量。`Ideal` 的所有数据流量都通过 `QPI-1` 链路，两个节点的流量相同。然而，`Worst` 总流量中高达 `33%` 通过 `QPI-0`。\n\
  \n比较 `Ideal` 和 `TyNuma` 时，吞吐量差异很小；但在 `QPI` 流量方面，`TyNuma` 的表现更接近 `Worst`。使用 `TyNuma`\
  \ 时，在发起端（`initiator`），`QPI` 流量与 `Worst` 非常相似，因为应用程序缓冲区分配在该处，且应用程序没有应用 `NUMA affinity`。在目标端（`target`），`QPI`\
  \ 流量与 `Ideal` 相同。在目标端，`Ideal` 和 `TyNuma` 应用了 `NUMA placement`（NUMA 放置），但 `Worst`\
  \ 没有。因此 `Worst` 在 `QPI-0` 链上有大量流量。\n\n使用四个线程时，线程和资源被分配在 `NUMA node 0`；由于这个原因，使用\
  \ `Ideal` 时，数据流量仅通过节点 0 的 `QPI-1` 链路。\n\n### 7.4.3 延迟评估\n\n现在我们分析请求的 `I/O` 路径成本。`表\
  \ 7.5` 汇总了计算出的各个和累积开销。`图 7.8` 用箭头和标签标记了我们在研究中衡量的 `I/O` 路径部分。\n\n#### 表 7.5：Tyche\
  \ 端到端路径开销细分（如图 7.8 所示）\n\n| 名称 | 路径 | 描述 |\n| --- | --- | --- |\n| Total | `A -\
  \ B - E - B - A` | 报告的开销，测量为应用程序发布请求到请求完成之间的时间延迟。 |\n| Tyche | `B - E - B` | `Tyche`\
  \ 衡量的开销，为请求到达其块层到完成之间的时间。实际上，这是我们协议排除上述层后的开销。 |\n| Ty-IS | `B - C` | `Tyche` (Ty)\
  \ 在发起端（`IS`）和目标端（`TS`）的发送路径，以及发起端（`IR`）和目标端（`TR`）的接收路径的开销。 |\n| Ty-TR | `D - E`\
  \ | |\n| Ty-TS | `F - G` | |\n| Ty-IR | `H - B` | |\n| CS-WQ | | 工作队列导致上下文切换的成本。\
  \ |\n| CS-Rec | 网络层与块层线程之间上下文切换的成本。 |\n| CS-IRQ | | `NIC` 触发 `IRQ` 时执行的上下切换成本。测量为\
  \ `IRQ` 处理函数执行 `wake up` 函数到网络线程开始执行的时间。 |\n| Ramdisk | `E - F` | `ramdisk` 从发布请求到接收完成的开销。`Ramdisk`\
  \ 是同步的，因此 IO 内联发生，不产生上下文切换。 |\n| I/O kernel | `A - B and B - A` | 请求从应用程序到达 `Tyche`\
  \ 以及从 `Tyche` 完成所需的时间。计算得出（而非测量）为总开销与 `Tyche` 开销之差。 |\n| Network | `C - D and G\
  \ - H` | 网络接口和网络链路的开销。计算得出（而非测量）为 `Tyche` 开销与 `Ty-IS`、`Ty-TR`、`Ty-TS`、`Ty-IR`、`CS-WQ`、`CS-Rec`、`CS-IRQ`\
  \ 和 `Ramdisk` 之和之差。它包含了主机相应驱动程序的开销，但与主机其他开销相比，这非常低。 |\n\n尽管实施了改进，`Tyche` 在处理小 I/O\
  \ 时表现出高主机 CPU 开销和低网络链路利用率。`图 7.11` 描述了当使用 `direct I/O` 随机读取运行 `FIO` 时 `Tyche` 实现的理论链路利用率。为了进行基准对比，我们包含了\
