  \ 8000 名患者和 35,480 条治疗记录。我们统计并比较了使用 HTRR 情况与未使用 HTRR 情况的患者平均等待时间。比较结果结果如图 20.15\
  \ 所示。\n\n![fig20_15.jpg](img/fig20_15.jpg)\n\n图 20.15 患者平均等待时间。\n\n从图 20.15 中很容易观察到，使用\
  \ HTRR 情况的患者平均等待时间优势优于未使用 HTRR 的情况。当每个患者所需的任务数为 2 时，未使用 HTRR 情况（原始案例）下每个患者的平均等待时间约为\
  \ 16 分钟，而使用 HTRR 情况约为 12 分钟。当每个患者需要 4 个治疗任务时，前者的平均等待时间约为 48 分钟，而后者为 32 分钟。当每个患者需要\
  \ 8 个治疗任务时，前者的平均等待时间约为 138 分钟，而后者为 79 分钟。\n\n## 20.5 结论\n\n在本章中，我们讨论了在大数据和云计算环境下数据挖掘算法的并行优化及其在医院中的应用。介绍了基于\
  \ Apache Spark 平台的并行 RF 算法的并行优化方法。然后，为了充分有效地利用大规模医院数据，我们开发了基于优化数据挖掘算法的医院应用，这些应用在云计算环境中实现。丰富的实验结果和应用表明，优化的数据挖掘算法实现了很高的准确性和性能，医院应用达到了医院和社会的需求。\n\
  \n此外，在大数据环境下，关于医院数据挖掘算法和应用还有许多有趣的问题。随着医院数据量的日益增长，基于流数据的各种增量数据挖掘算法以及医院实时应用将成为我们未来的工作方向。\n\
