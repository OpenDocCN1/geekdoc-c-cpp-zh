  \ 原子性、一致性与隔离性\n\n### 4.3.1 动机\n### 4.3.2 调度器设计\n### 4.3.3 示例说明\n## 4.4 依赖感知事务调度器\n\
  ### 4.4.1 动机\n### 4.4.2 抽象级与对象级依赖\n\n\n\n\n### 摘要\n\n\n## 4.1 引言\n\n\n例如，粗粒度锁（使用单个锁保护大型数据结构）简单易用，但允许的并发性很。相比之下，细粒度锁（数据结构的每个组件，例如哈希表桶都由一个锁保护）要求程序员仅获取必要且充分的锁以在不损害安全性的情况下获得最大并发性，并且在获取多个锁时必须避免死锁。这两种情况都极易程序员出错。锁最严重的问题是它们不易于组合——也就是说，组合现有的软件部分以产生不同的功能并不容易。这是因为基于锁的并发控制高度依赖于获取和释放锁的顺序。因此，在组合这些现有方法时，为了防止可能的死锁，必须暴露这些方法的内部实现。这破坏了封装性，并使得软件难以复用，而这一状态正是触发事务内存（TM）的动因\
  \ [2]。\n\n\n许多库或第三方软件包含原子代码，应用程序开发者通常希望将此类代码与用户、其他库或第三方（原子）代码组合成更大的原子代码块。这可以通过将所有原子代码嵌套在其包围代码中来实现，正如\
  \ TM 固有的组合性所允许的那样。但这样做——即平铺嵌套（flat nesting）——会导致巨大的单体事务，从而限制了并发性：当一个巨大的单体事务被中止时，所有嵌套事务也会被中止并回滚，即使它们与外部事务并不冲突。\n\
  \n\nTM 中研究了三种类型的嵌套：平铺式、闭式和开放式 [3]。如果一个内部事务 I 被平铺嵌套在它的外部事务 A 内部，A 的执行就就像 I 的代码被内联在\
  \ A 内部一样。因此，如果 I 中止，它会导致 A 中止。如果 I 闭式嵌套在 A 内部，则 I 的操作只有在 I 提交时才成为 A 的部分。因此，I 的中止不会导致\
  \ A 中止，但 A 中止时 I 会中止。最后，如果 I 开放式嵌套在 A 内部，那么 I 的操作不被视为 A 的部分。因此，I 的中止不会导致 A 中止，反之亦然。我们将在\
  \ 4.2 节 中讨论这些类型。\n\n\nRTS、DATS 和 SPN 已在一个流行的开源事务内存数据存储上实现（即红帽的 Infinispan [4,5]）。本章将详细提供\
  \ RTS、DATS 和 SPN 如何工作以及它们在 Infinispan 上的实验评估。\n\n\n我们考虑一个分布式系统，它由一组节点 N = {n1, n2,\
  \ …} 组成，节点通过通信网络上的消息传递链路相互通信。类似于参考文献 6，我们假设节点分布在度量空间中。度量 d(ni, nj) 是节点 `ni` 和 `nj`\
  \ 之间的距离，它决定了从 `ni` 向 `nj` 发送消息的通信成本。\n\n\n## 4.5 基于调度的并行嵌套\n\n\n### 4.5.2 调度器设计\n\
  \n\n## 4.6.1 实现\n\n\n## 4.7 总结\n\n\n\n\n分布式事务在分布式系统的一组共享对象上执行操作，在这些系统中，节点之间通过消息传递链路进行通信。令\
  \ `O = {o1, o2, …}` 表示共享对象的集合。事务 `Ti` 处于三种可能的状态之一：活跃（live）、已中止（aborted）或已提交（committed）。如果一个已中止的事务进行进行重试，它将保留原始起始时间戳作为其起始时间。\n\
  \n我们考虑 Herlihy 和 Sun 的数据流分布式 STM 模型 [6]，在 particular 模型中，事务是不移动的，而对象在节点之间移动。在该模型中，每个节点都拥有一个\
  \ `TM proxy`，它为其应用程序以及其他节点的代理提供接口。当节点 `ni` 上的事务 `Ti` 请求对象 `oj` 时，`ni` 的 `TM proxy`\
  \ 会首先检查 `oj` 是否在其本地缓存中。如果对象不存在，代理将调用分布式缓存一致性（`cc`）协议在网络中获取 `oj`。当持有对象 `oj` 的节点 `nk`\
  \ 收到来自 `ni` 的 `oj` 请求时，它会检查该对象是否正被本地事务 `Tk` 使用。如果是，代理将调用冲突管理器来调解 `Ti` 和 `Tk` 之间\
  \ `oj` 的冲突。\n当事务 `Ti` 在对象 `oj` 上调用操作时，本地 `TM proxy` 会调用 `cc` 协议以定位 `oj` 的当前缓存副本。我们考虑\
  \ `cc` 的两个属性。首先，当 `Ti` 的 `TM proxy` 请求 `oj` 时，会调用 `cc` 协议，在有限的时间周期内将 `Ti` 的读/写请求发送到持有\
  \ `oj` 有效副本的节点。读（写）请求表示 `Ti` 请求对 `oj` 执行读（写）操作。一个有效的对象副本被定义为一个有效版本（valid version）。因此，持有\
  \ `oj` 版本的节点将回复与 `Ti` 请求相对应的版本。其次，在任何给定时间内，`cc` 必须在网络中仅定位 `oj` 的一个副本，且只允许一个事务最终写入\
  \ `oj`。\n\n### 4.2.2 嵌套事务\n嵌套模型之间的差异如图图 4.1 所示，其中包含两个包含嵌套事务的事务。如图图 4.1a 所示的扁平嵌套（flat\
  \ nesting）中，事务 `T2` 在事务 `T1` 提交之前无法执行。`T2` 会导致完全中止，因此必须从头开始。。如图图 4.1b 所示的闭合嵌套（closed\
  \ nesting）下，只有 `T2` 的内部事务需要中止并重启，而 `T1` 仍在执行。`T2` 在访问数据结构之前执行的工作部分不需要重试，因此 `T2`\
  \ 可以更早地完成。在如图图 4.1c 所示的开放嵌套（open nesting）下，`T1` 的内部事务独立于其外层事务提交，释放了对共享数据结构的内存隔离。因此，`T2`\
  \ 的内部事务可以立即进行，从而允许 `T2` 比闭合嵌套和扁平嵌套都更早提交。\n\n![fig4_1.jpg](img/fig4_1.jpg)\n图 4.1\
  \ 扁平、闭合和开放嵌套下的两个事务。(a) 扁平嵌套。(b) 闭合嵌套。(c) 开放嵌套。\n\n扁平嵌套和闭合嵌套模型在并发性方面对大型单体事务有明显的负面影响。事实上，当一个大事务被中止时，它所有的扁平/闭合嵌套事务也会被中止并回滚，即使它们与任何其他事务都不冲突。闭合嵌套可能比扁平嵌套提供提供更好的性能，因为闭合嵌套内部事务的中止不会影响其外层事务。然而，开放嵌套方法在允许的并发性方面优于两者。当一个开放嵌套事务提交时，它对对象的修改将立即对其他事务可见，允许这些事务在没有冲突的情况下开始使用这些对象，从而增加了并发性\
  \ [7]。相比之下，如果内部事务是闭合或扁平嵌套的，那么这些对象更改在外层事务提交之前是不可见的，可能会与其他可能想要使用这些对象的事务产生冲突。\n为了在开放嵌套中实现高并发，内部事务必须实现抽象序列化（abstract\
  \ serializability） [8]。如果事务的并发执行导致共享对象在“抽象级别”上的一致性，则这些执行被认为是抽象序列化的。如果内部事务 `I` 提交，`I`\
  \ 的修改将立即提交到内存中，`I` 的读集和写集被丢弃。此时，`I` 的外层事务 `A` 因为 `I` 访问的内存而与 `I` 产生任何冲突。因此，程序员认为\
  \ `I` 的内部内存操作比 `A` 处于“较低级别”。`A` 在检查冲突时不考虑由 `I` 访问的内存，但 `I` 必须获取抽象锁并将此锁传递给 `A`。当两个操作尝试获取同一个抽象锁时，开放嵌套并发控制负责管理这种冲突（因此这被定义为“抽象级别”）。\n\
  \n图 4.2 显示事务 `T2` 由于冲突而中止，并执行了补偿操作。假设 `T1` 和 `T2` 的内部事务访问不同的对象并成功提交，`T2` 由于冲突而中止。`T2`\
  \ 内部事务的补偿操作必须执行，因为内部事务的修改对其他事务可见了。即使开放嵌套事务提供了高并发性，开放嵌套模型并不总是优于扁平和闭合嵌套模型，由于大量的抽象锁和补偿操作。\n\
  ![fig4_2.jpg](img/fig4_2.jpg)\n\n图 4.2 开放嵌套下的事务中止。\n## 4.2.3 原子性、一致性和隔离\n\n我们使用事务转发算法（TFA）[10]\
  \ 来提供早期验证，保证分布式事务之间共享对象的一致性，并在异步时钟的情况下确保操作的原子性。TFA 负责缓存本地副本并更改所有权。为了完整起见，我们通过一个示例来说明\
  \ TFA。通常情况下，对象只导出读和写方法。在图 4.3 中，一个事务在 `t1` 时更新对象 `oj`（即本地时钟 `LC` 为 14），四个事务（即 `T1`、`T2`、`T3`\
  \ 和 `T4`）从所有者处请求 `oj`。假设 `T2` 在 `t2` 时验证 `oj` 并在 `t3` 时使用 `LC = 30` 更新 `oj`。分布式验证包括所有权的全局注册。在\
  \ `t2` 和 `t3` 之间请求 `oj` 的任何读写事务（例如 `T4`）都会中止。当写事务 `T1` 和 `T3` 分别在 `t1` 和 `t2` 验证时，在\
  \ `t2` 之前获取了 `LC = 14` 的 `oj` 的 `T1` 和 `T3` 将中止，因为 `LC` 已更新为 30。![fig4_3.jpg](img/fig4_3.jpg)\n\
  图 4.3 TFA 的示例。\n\n`RTS` 和 `SPN` 关联于嵌套 TFA（N-TFA）[11]，它是 TFA 在分布式软件事务内存（DTM）中实现闭合嵌套的扩展。`DATS`\
  \ 关联于带嵌套的 TFA（TFA-ON）[9]，它是 TFA 算法 [10] 的扩展，用于管理开放嵌套事务。N-TFA 和 TFA-ON 改变了对象的验证范围。\n\
  ## 4.3 响应式事务调度器](#15_Chapter04.xhtml_sec4_3)\n\n### 4.3.1 动机](#15_Chapter04.xhtml_sec4_3_1)\n\
  \n\n过去的事务调度器通常只导致极少数的中止，并减少分布式事务内存（DTM）中的总通信延迟 [1]。然而，在调度嵌套事务时，中止的数量可能会增加。在扁平和闭嵌套模型中，如果一个包含多个嵌套事务的外部事务由于冲突而中止，则外部事务和内部事务都将重启并请求所有对象，无论是由哪个对象引起的冲突。尽管中止的事务被入队以避免冲突，调度器仍会对比中止的事务进行序列化，以减少仅针对引起冲突的对象的竞争。对于嵌套事务，这可能导致激烈的竞争，因为所有对象都必须重新获取。\n\
  主动式调度器会带有一个退避时间（backoff time）中止失败的事务，该退避时间决定了事务在重启之前被停顿多长时间 [12,13]。在 DTM 中，确定中止事务的退避时间通常是困难的。例如，由于通信延迟，胜出的事务可能在中止的事务重启之前提交。这可能导致中止的事务与另一个事务发生冲突。如果中止的事务是一个嵌套事务，这将增加其父事务的总执行时间。因此，退避策略可能无法避免或减少\
  \ DTM 中的中止。\n\n受此启发，我们针对闭嵌套 DTM 提出了 `RTS` 调度器。RTS 减少了父事务的中止次数，以防止其已提交的嵌套事务随之中止。RTS\
  \ 检查父事务执行时间的长度，并决定失败的事务是中止还是入队。如果父事务的执行时间较短，则将其中止；否则，将其入队，以保留其嵌套事务。用于入队父事务的退避时间指示了事务可能何时接收到对象。\n\
  ### 4.3.2 调度器设计\n\n我们考虑了在发生冲突时闭嵌套事务中可能发生的两种类型的中止：嵌套事务的中止和父事务的中止。闭嵌套允许嵌套事务中止而不导致其父事务中止。然而，如果父事务中止，其所有的闭嵌套事务都将中止。因此，RTS\
  \ 对失败的父事务执行两个操作：首先，根据执行时间的长度决定失败事务是中止还是入队；其次，如果失败事务是一个具有“高”竞争水平的父事务，则将其中止。具有“低”竞争水平的父事务则带退避时间入队。\n\
  对象 `oj` 的竞争水平（`CL`）可以通过本地或分布式方式确定。一种简单的本地检测方案通过在给定时间段内请求 `oj` 的事务数量来确定 `oj` 的本地\
  \ `CL`。一种分布式检测方案通过在请求 `oj` 之前有多少个事务请求了其他对象来确定 `oj` 的远程 `CL`。例如，假设事务 `Ti` 正在验证 `oj`，而\
  \ `Tk` 向 `oj` 的所有者请求 `oj`。`oj` 的本地 `CL` 为 1，因为只有 `Tk` 请求了 `oj`。`oj` 的远程 `CL` 是 `Tk`\
  \ 请求过的其他对象（如果有）的本地 `CL`。`Ti` 的提交会影响远程 `CL`，因为那些其他事务将等待 `Tk` 完成对 `oj` 的验证。如果 `Tk`\
  \ 中止，`Tk` 正在使用的对象将被释放，其他事务将获得这些对象。我们将对象的 `CL` 定义为其本地和远程 `CL` 之和。因此，`CL` 表示有多少个事务想要某个事务正在使用的对象。\n\
  \n如果一个执行时间较短的父事务被入队而不是中止，队列延迟可能会超过其执行时间。因此，RTS 会中止执行时间较短的父事务。如果具有高 `CL` 的父事务中止，所有闭嵌套事务都将中止（即使它们已随父事务提交），并且必须重新请求对象。这浪费的时间可能比队列延迟更多。只要它们的等待时间过去，它们的\
  \ `CL` 可能会增加。因此，RTS 会将低 `CL` 的父事务入队。我们将在 第 4.3.3 节 中讨论如何确定退避时间和 `CLs`。\n### 4.3.3\
  \ 举例说明\n\nRTS 为每个入队的事务分配不同的退避时间。退避时间是按估计执行时间的百分比计算的。图 4.4 展示了 RTS 的示例。三个写事务 `T1`、`T2`\
  \ 和 `T3` 向 `o1` 的所有者请求 `o1`，`T2` 在 `t3` 处先验证 `o1`。`T1` 和 `T3` 由于 `T2` 的提前验证而中止。在\
  \ `T2` 验证 `o1` 时，我们在 RTS 中考虑两种类型的冲突。首先，两个写事务之间可能发生冲突。假设写事务 `T4`、`T5` 和 `T6` 分别在\
  \ `t4`、`t5` 和 `t6` 请求 `o1`。`T4` 被入队是因为 `T4` 的执行时间 `| t4 − t1 |` 超过了 `T2` 的 `| t7\
  \ − t4 |`——即 `T2` 的预期提交时间 `t7`。此时，`o1` 的本地 `CL` 为 1，`CL` 将变为 2（即 `o3 + o2 + o1`\
  \ 的 `CLs`），这是一个低 `CL`。因此，`| t7 − t4 |` 被分配给 `T4` 作为退避时间。当 `T5` 在 `t5` 请求 `o1` 时，即使\
  \ `| t5 − t2 |` 超过了 `| t5 – T4 的预期提交时间 |`，`T5` 也不会入队，因为 `CL` 为 4（即 `o1` 的本地 `CL`\
  \ 为 2，`o4` 的 `CL` 为 2），这是一个高 `CL`。由于 `T6` 执行时间很短，`T6` 中止。其次，读写事务之间可能发生冲突。假设读事务 `T4`、`T5`\
  \ 和 `T6` 请求 `o1`。作为退避时间，`t7 |`、`| t7 − t5 |` 和 `| t7 − t6 |` 将别被分配给 `T4`、`T5` 和\
  \ `T6`。由 `T2` 更新的 `o1` 将同时发送给它们。\n![fig4.jpg](img/fig4.jpg)\n\n图 4.4 事务调度场景。(a)\
  \ 基于对象的场景。(b) 基于事务的场景。\n在事务和节点数量固定的，如果这些事务同时访问极少数的对象，对象竞争将会增加。低或高 `CL` 的阈值取决于节点、事务和共享对象的数量。因此，`CL`\
  \ 阈值是自适应确定的。假设图 4.4 中的 `CL` 阈值设定为 3。当 `T4` 请求 `o1` 时，对象 `o1`、`o2` 和 `o3` 的 `CL`\
  \ 为 2，意味着有两个事务想要 `T4` 请求的对象，因此 `T4` 入队。相反，当 `T5` 请求 `o1` 时，对象 `o1` 和 `o4` 的 `CL`\
  \ 为 4，表示有四个事务（超过 `CL` 阈值）想要 `T5` 请求的 `o1` 或 `o4`，因此 `T5` 中止。\n\n为了计算退避时间，我们使用一个事务统计表，通过哈希函数存储事务的历史平均验证时间。该表指示了具有不同嵌套数量写事务的最新成功提交时间。每当事务开始时，就会表中获取预期提交时间。每个事务的请求消息包含三个时间戳：开始、请求和预期提交时间。在图\
  \ 4.4 中，如果 `T5` 入队，其退避时间将为 `| t7 − t5 |` 加 `T4` 的预期执行时间（即预期提交时间 - 请求时间）。\n\n\n\n\
  如果在接收到对象之前退避时间已过期，相应的事务将中止。这种情况存在两种可能的情况。首先，事务请求该对象并作为新事务再次入队。重复的事务（即之前入队列的事务）将从队列中移除。其次，对象可能在事务重启之前被接收。在这种情况下，该对象将发送给下一个入队的事务。\n\
  \n## 4.4 依赖感知的事务型调度器 (#15_Chapter04.xhtml_sec4_4)\n### 4.4.1 动机\n\n图 4.5 展示了一个带有补偿操作和抽象锁的开放嵌套事务示例。图\
  \ 4.5 中的代码列表 4.1 和 4.2 描述了两个外部事务 `T1` 和 `T2`，以及列表 4.3 中的一个内部事务。内部事务 `INSERT` 包含一个对\
  \ `Linked List` 的插入操作。`T1` 有一个带有特定值的删除操作。如果 `T1` 的操作执行成功，其内部事务 `INSERT` 就会执行。相反，无论\
  \ `T2` 的删除操作是否成功，其内部事务 `INSERT` 都将执行。当内部事务提交时，注册包含补偿操作的 `OnCommit` 和 `OnAbort`。如果外部事务（即\
  \ `T1` 或 `T2`）提交，则执行 `OnCommit`。当内部事务提交时，其修改将立即对其他事务可见。因此，如果内部事务提交而其外部事务 `T1` 或\
  \ `T2` 中止，则执行作为补偿操作的删除操作（在 `OnAbort` 中描述）。让我们假设 `T2` 中止并执行了 `OnAbort`。尽管 `T2` 的内部事务\
  \ `INSERT` 执行了，但 `DL` 仍为 0。如果 `T1` 中止，`DL` 为 1。\n[图 4.5] 展示了一个带有补偿操作和抽象锁的开放嵌套事务示例。\n\
  \n图 4.5 描述了两个外部事务 `T1` 和 `T2`，以及列表 4.3 中的一个内部事务。内部事务 `INSERT` 包含一个对 `Linked List`\
  \ 的插入操作。`T1` 有一个带有特定值的删除操作。如果 `T1` 的操作执行成功，其内部事务 `INSERT` 就会执行。相反，无论 `T2` 的删除操作是否成功，其内部事务\
  \ `INSERT` 都将执行。当内部事务提交时，注册包含补偿操作的 `OnCommit` 和 `OnAbort`。如果外部事务（即 `T1` 或 `T2`）提交，则执行\
  \ `OnCommit`。当内部事务提交时，其修改将立即对其他事务可见。因此，如果内部事务提交而其外部事务 `T1` 或 `T2` 中止，则执行作为补偿操作的删除操作（在\
  \ `OnAbort` 中描述）。让我们假设 `T2` 中止并执行了 `OnAbort`。尽管 `T2` 的内部事务 `INSERT` 执行了，但 `DL` 仍为\
  \ 0。如果 `T1` 中止，`DL` 为 1。\n![图 4.5](img/fig4_5.jpg)\n\n\n\n为了计算可交换性，`DATS` 结合了两种支持。在第一个支持中，程序员为每个事务类标注了所访问的字段。第二种支持是一种基于字段的时间戳机制，用于检查字段级的失效性。其目标是将时间戳的粒度从对象降低到字段。如果使用单个对象时间戳，由于字段修改，将无法检测可交换性。事实上，对同一对象的不同字段的写操作都会反映在同一个对象时间戳的增加上。为了高效地实现这一点，`DATS`\
  \ 利用开发者对事务访问的字段所提供的注解，直接指向感兴趣的字段（而不是遍历所有对象字段以寻找被修改的字段）。在这些字段上，该机制使用基于字段的时间戳来检测对象的失效性。\n\
  \n\n### 4.4.3 调度器设计\n\n\n`图 4.6` 展示了 `DATS` 的示例，其中分别在节点 `n1` 和 `n2` 上调用了两个事务 `T1`\
  \ 和 `T2`。事务 `T1` 有一个内部事务，而 `T2` 有两个嵌套事务。假设 `T1` 的 `DL = 1` 且 `T2` 的 `DL = 2`。圆圈表示写入的对象。水平线对应于时间域内描述的每个事务的状态。`图\
  \ 4.6` 显示了 `T1` 和 `T2` 终止时的四种情况。当调用 `T1` 和 `T2` 时，`DATS` 分析它们的 `DLs`、操作和值。当 `T1`\
  \ 从 `n0` 请求 `o1` 时，`o1` 的 `DLs`、操作和值的元数据将发送到 `n0`。这些被移动到 `n0` 的调度队列中。我们考虑关于 `T1`\
  \ 和 `T2` 终止的四种情况：\n\n- **情况 2**。`T1` 开始验证并检测到它在对象 `o1` 上对象级依赖 `T2`（后者仍在执行）。在这种情况下，`T2`\
  \ 将由于提前验证而回滚。当 `T1` 提交时，更新的 `o1` 被发送到 `n2`。\n- **情况 3**。另一个事务在 `T1` 和 `T2` 验证之前提交了\
  \ `o1`。如果 `T1` 和 `T2` 在对象级上不依赖，一旦事务提交，`o1` 将同时发送到 `n1` 和 `n2`。\n- **情况 4**。另一个事务在\
  \ `T1` 和 `T2` 验证之前提交了 `o1`。如果 `T1` 和 `T2` 在对象级上依赖，`DATS` 将检查抽象级依赖，由于 `T2` 的 `DL`\
  \ 大于 `T1`，`o1` 被发送到 `n2`。通过回滚 `T1`，调度器被迫在 `T2` 回滚的情况下运行单次补偿（针对 `T1 - 1`），而不是两次补偿（`T2\
  \ - 1` 和 `T2 - 2`）。此外，考虑到 `T1` 的 `DL` 为 `0` 的情况，`T1` 的回滚不会影响 `T1 - 1`。事实上，它的执行将被保留，只有\
  \ `T1` 的操作将被重新执行。\n![fig4_6.jpg](img/fig4_6.jpg)\n\n图 4.6  DATS 中两个事务 T1 和 T2 的四种不同情况。\n\
  ## 4.5 基于调度的并行嵌套\n\n#### 4.5.1 动机\n在父事务的范围内，嵌套内部事务的执行在概念上可以表示为一个动态树，称为事务树……内部事务属于树的同一层，它们的父节点代表父事务。兄弟事务（属于事务树的同一层）在假设其冲突独立的情况下并行执行。该方法不假设关于事务冲突的先验知识；因此，由于事务依赖关系，某些（或所有）兄弟事务无法并行执行。当发生冲突时，回滚的事务将被移动到较低层，并用一条边表示刚检测到的依赖关系。在所有内部事务都不与其他冲突的情况下，并行过程允许仅在关键路径上执行冲突的内部事务，而其他事务执行。\n\
  \n在闭式嵌套中，所有内部事务必须成功提交才能触发父事务的提交。如果它们是独立的，可以并行执行并提交，允许父事务在最长的内部事务完成执行后进行提交。然而，如果它们之间存在依赖关系，就会发生冲突，因此它们的并行激活可能无效。`图\
  \ 4.7` 显示了新订单事务 `T1` [15]，它包含多个内部事务。`T1` 打开仓库和地区以提取税收和库存以获取价格，分别是前两个内部事务。这两个内部事务之间没有依赖关系。并行执行这两个事务可能会带来高性能。\n\
  ![fig4_7.jpg](img/fig4_7.jpg)\n\n图 4.7 TPC-C 中包含多个内部事务的新订单事务。\n闭式嵌套优于扁平嵌套，且闭式嵌套的程序模型与开放式嵌套不同。尽管开放式嵌套产生高并发性，但它具有固有的开销，例如提交开销或抽象锁开销\
  \ [9]。因此，开放式嵌套并不总是优于闭式嵌套。\n\n受此启发，我们提出了一种 SPN 事务内存模型，专注于如何识别内部事务是否应该并行执行以及如何提高 DTM\
  \ 中并行内部事务的性能。\n### 4.5.2 调度器设计\n\n\nSPN 包含两个步骤：(1) 将内部事务序列转换为并行内部事务并同时运行，以及 (2)\
  \ 维护一个正在进行的并行内部事务的“事务表”。在第一步中，调用事务的节点同时执行所有内部事务，并同时向对象所有者请求其对象。每个对象请求由四个元素组成：内部事务的顺序号（`NiTx`）、对象\
  \ ID（`oID`）、事务类型（`Type`）和外部事务 ID（`TxID`）。顺序号从 1 分配到相同父事务的并行内部事务总数。不同的内部事务可能会请求同一个对象。因此，在第二步中，所有者将这些元素（即\
  \ `NiTx`、`oID`、`Type`）移动到事务表中，并识别哪些内部事务可以并行执行。在请求和验证对象时，会更新事务表。在两个时刻，对象所有者在存储如下元素后都会维护事务表：\n\
  \n- **请求**（请求）：如果 `NiTx` 为 1，对象所有者根据 TFA 策略向请求者发送 `oID` 的对象，并将其状态更新为 `Responded`。如果\
  \ `NiTx` 不是 1，对象所有者检查当前请求者之前的 `NiTxs` 是否请求过相同的 `oID`。之前的 `NiTxs` 指的是具有相同 `TxID`\
  \ 但数字小于 `NiTx` 的事务。如果 `NiTx` 不是 1 且没有之前的 `NiTxs` 请求过相同的 `oID`，所有者因为没有冲突而将对象发送给请求者。如果任何之前的\
  \ `NiTxs` 请求过相同的 `oID`，所有者将它的状态更新为 `Wait` 并向请求者发送一个退避时间。\n\n请求者可能会从所有者处接收多个退避时间。接收退避时间意味着一个内部事务正在使用同一个对象。访问同一对象的不同内部事务会被分配不同的退避时间。因此，我们表示了所有者如何决定退避时间以及请求者如何维护退避时间。当具有不同\
  \ `NiTxs` 的并行内部事务请求对象时，会根据多个 `Wait` 状态计算退避时间。即使由于某些原因先前的状态没有更新（或被延迟），所有者也会根据现有状态检查是回复对象还是退避时间。如果在更新先前的状态后检测到冲突，冲突的正在进行的内部事务将接收退避时间并中止。为了计算退避时间，我们使用事务表中的\
  \ `Wait` 状态数量。如果 `NiTx` 的状态为 `Wait`，其退避时间将是执行时间 × `Wait` 状态的数量。当内部事务在内部提交时，另一个具有最小退避时间的内部事务会被唤醒并开始使用更新后的对象。\n\
  \n\nSPN 还识别写事务和读事务之间的冲突。如果写-写或写-读事务访问一个对象，第一个写事务的状态将为 `Responded`，第二个写或读事务的状态将为\
  \ `Wait`。读和写事务访问冲突对象的冲突。[图 4.8](https://wiki.example.org/4.8) 展示了一个包含三个内部事务的事务表示例。T1\
  \ 事务事务事务事务的内部事务。如果所有--者请求请求请求 `o1`，由于没有冲突，所有者会发送对象 `o1`。一旦对象-1，T1-2 和 T---1111111111111\
  \ 退 1 冲突，T1-1 和 T2-2 接收 `o2`。如果 T1 提交，T2 会中止。如果 T2 提交，T1 会中止。\n\n-冲突的的事务。\n\n\n\
  `Hyflow` 中存在两种提交模型。首先是父事务的提交——当一个顶层事务在成功验证其读集中的所有对象后，将其日志中的更改提交到全局提交内存时，使用顶层提交模型。其次是合并提交模型——当一个嵌套事务将其日志中的更改提交到其父事务的日志时，使用合并提交模型。父事务识别来自其嵌套事务或自身的更改，并维护一个\
  \ `CL`。`RTS` 与这些提交模型集成。`Hyflow` 中实现的顶层提交和合并提交模型用于维护嵌套事务的提交。然而，在 `Hyflow` 的顶层提交模型中，已提交的对象必须在\
  \ `Infinispan` 缓存中更新。\n\n为了本章描述的调度器的有效性，我们无法与任何基于事务网格的竞争性 DTM 比较结果，因为它们都不支持关闭嵌套和开放嵌套事务。因此，我们测量了\
  \ `RTS`、`DATS`、`SPN`、`N-TFA`（不带调度器的关闭嵌套）和 `TFA-OPEN`（不带调度器的开放嵌套）的吞吐量（即每秒提交的事务数），并比较了\
  \ `RTS` 相对于 `N-TFA` 的加速、`DATS` 相对于 `TFA-OPEN` 的加速以及 `SPN` 相对于 `N-TFA` 的加速。`RTS`\
  \ 和 `SPN` 分别代表 `Hyflow` 中带有 `RTS` 和 `SPN` 的 `N-TFA`。`RTS` 假设外部事务包含了定义为其内部事务外部的操作，但\
  \ `SPN` 的外部事务没有任何操作，因为假设外部事务和内部事务之间没有依赖。因此，尽管 `RTS` 和 `SPN` 是基于关闭嵌套设计的，但两者之间的比较并不合适。此外，`N-TFA`\
  \ 的两个版本分别在外部事务中包含和不包含操作。`DATS` 代表 `Hyflow` 中带有 `DATS` 的 `TFA-OPEN`。加速比是在由 80 个节点组成的分布式系统上获得的，节点为\
  \ Opteron 6272、64 位、16 MB L2、8 核 1 GHz CPU，分别使用 2、4、8、12 和 24 个线程。\nYahoo Cloud\
  \ Benchmark (`YCSB`) 是 `Infinispan` 中实现的最著名的 NoSQL 数据库基准测试。`TPC-C` 是 DTM 评估中最常用的基准测试。根据基准测试的标准，配置每个节点\
  \ 10,000 个活动事务中 50% 为写事务。高低竞争分别配置为 5 和 10 个仓库。在基准测试中，用于识别对象的键（即对象 ID）使用均匀概率生成。每个事务包含\
  \ 8 或 16 个内部事务，定义为事务的长度。例如，`RTS(8)` 表示使用包含 8 个内部事务的事务来评估 `RTS`，而低竞争的关闭嵌套 `TPC-C`\
