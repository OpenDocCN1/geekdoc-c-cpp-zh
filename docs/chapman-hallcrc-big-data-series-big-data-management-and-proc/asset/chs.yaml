  \ |\n| 总计 | 14 |\n\n表 19.8 中呈现的所有参考文献都是用英文编写的。为了确定它们与大数据项目增量资金的相关性，对这些文献的标题、摘要和关键词进行了仔细检查。此外，每当发现必要时，还对这些作品的全文进行了分析。如果在搜索相关工作时返回了指向某本书的参考文献，则借助\
  \ `Google book` ([`books.google.com`](https://books.google.com)) 检查了相关章节。更具体地说，用于构建表\
  \ 19.6 中所示搜索字符串的关键词和表达式被用于输入书籍搜索机制并定位相关章节。这一切都遵循 Kitchenham 等人 (2015) 关于文献系统综述的观点。\n\
  \n结果发现，表 19.8 中考虑的参考文献没有哪一篇是讨论大数据项目增量资金的。因此，截至此日，还没有任何提案考虑过利用大数据子项目产生的收入来资助其他系统部分开发。此外，还没有提案考虑过增量资助大数据项目对其财务价值的影响。此外，到为止，还没有人承认项目融资的增量资金方法对大数据项目被选中实施的可能性的影响。因此，声称本章为大数据项目管理提供了新颖且有意义的贡献是合理的。\n\
  \n#### 19.3.2 相关工作总结\n\n在第 19.3.1 节中进行的系统性搜索显示，目前尚未提出关于大数据项目增量资金的提案。尽管如此，在扩展和完善相关项目方面已经进行了大量工作#30_Chapter19.xhtml_fn1\n\
  \n例如，如果发现子项目数量相当多，可以使用 Alencar 等人 (2014) 的观点来获得具有任意误差范围和置信度的近似解决方案。此外，如果现金流不确定，可以考虑\
  \ Schmitz 等人 (2008) 的观点来选择可能提供最高回报的序列。\n\n此外，如果人们对即将进行的的数据投资效率感兴趣，可以使用 Alencar 等人\
  \ (2012b) 的建议来从性能指标的角度识别高效序列。关于已开发的项目增量资金工作的部分总结，请参见 Alencar 等人 (2012a)。\n\n####\
  \ 19.4 示例\n\n考虑一家医疗保险公司，例如美国的 `United Health`、`Kaiser Foundation` 或 `Wellpoint`，或者欧洲的\
  \ `Boots`、`BUPA` 或 `Capital Healthcare`。我们将这家公司称为健康投资公司 `HIC`。\n\n虽然健康保险业务可以追溯到\
  \ 19 世纪后期的英国（Beik, 2014），但健康保险市场从未处于如此艰难的境地（Brunoni et al., 2015）。近期，医学研究在治疗许多残疾或致命疾病（如癌症、糖尿病、缺血性心病、中风、急性哮喘等）取得了巨大进展（Weaver\
  \ & Bryce, 2015）。\n\n然而，这是有代价的。可以理解，遭受这些疾病的人决心要获得这些新治疗。因此，他们一直在向代表人物施压，要求加强立法以便他们接受最新的技术。然而，这些新治疗通常是昂贵的。因此，医疗成本在全球范围内不断上升（Emanuel,\
  \ 2012）。\n\n这一切导致了对增加税收以资助公共健康的威胁，而没人希望这样做。它还导致了覆盖范围缩减的私人医疗保险（许多人不愿接受），或者少数人能负担得起覆盖广泛的私人医疗保险。因此，政府和私营企业都处于一种必须利用现有资源做更多事情的境地（Auerbach\
  \ & Kellermann, 2011）。\n\n\n\n\n\nHIC 深知私立保险在当今时代面临的挑战（Meier et al., 2013）。其管理层认为，应当大幅降低运营成本，以便他们能够提供负担得起且覆盖广泛的保险。因此，他们一直在考虑许多与信息技术相关的项目。然而，有一个特别引起了公司首席执行官（CEO）关注的项目，那就是利用他们已经在\
  \ HIC 计算机化信息系统中存储的海量数据来制定削减策略（White, 2014）。\n\n## 19.4.1 工作小组\n\n一个由 IT 专家、业务顾问和医护人员组成的工作小组已经成立，旨在研究该问题并提出建议。最初，他们在文献中确定了对健康保险计划运营成本影响最显著的疾病。其中，可以提到心脏病、糖尿病、高血压、癌症和哮喘等疾病（Hu\
  \ et al., 2015）。\n\n此外，根据业务和医疗团队的说法，这些疾病的治疗成本可以通过健康管理计划（managed care programs）大大降低。这些计划旨在激励人们积极参与自己所患疾病的治疗。这包括广泛获取易读的医疗信息、积极参加支持小组，以及医疗、护理和心理援助。这一切都是为了让保单人改变生活方式，以确保他们的疾病得到控制。\n\
  \n例如，某些计划参与者可能被要求遵循严格的饮食，而另一些人则必须定期锻炼并减少日常工作负荷。此外，他们中的一些必须同意定期看医生，严格按照处方用药，并将某些健康指标维持在预设范围内。这可能包括血液中的葡萄糖、胆固醇、尿素、肌酐和钙水平。\n\
  \n当提供同伴支持小组时，参与者必须向小组报告他们应对疾病的进展。令人惊讶的是，在他人的支持下，动力十足且知识丰富的保单人可以做出的巨大的努力来改善自己的健康。\n\
  \n某些疾病管理计划甚至在可行时会告知医生和患者存在同样有效但更更廉的治疗方法。人们认为，将健康保险成本尽可能降低符合所有人的最大利益。参阅 Kongstvedt\
  \ (2015) 关于健康管理计划的详细介绍。参阅 Denham et al. (2013)、Marton et al. (2014) 以及 Wallasch\
  \ and Hermann (2012) 关于健康管理计划在不同情况下成功的报告。\n\n## 19.4.2 计划准入标准\n\n尽管 HIC 管理层已同意建立健康管理计划的理念，但仍存在选择哪些疾病将由计划处理的问题。此外，公司还必须确定合适的人员参加计划。\n\
  \n根据为 HIC 提供咨询的医疗团队，心脏病和糖尿病是开始的合适疾病。它们是对健康计划运营成本影响最显著的疾病之一。此外，患有这些疾病的人在使用健康保险计划方面表现出明显的行为，且这些行为并不难追踪。\n\
  \n例如，患有心脏病的人倾向于定期看心脏科医生。此外，他们被比心脏健康的人更频繁地进行心电图和超声图检查。糖尿病患者也是如此。他们倾向于每年看几次内分泌科医生，并比其他人更频繁地进行监测葡萄糖水平的血液检查。\n\
  \n此外，当人们加入健康保险计划时，必须申报某些既往疾病的存在。否则，一旦发生与这些疾病相关的医疗状况，计划提供的保障可能会失效。这包括心脏病和糖尿病（Green,\
  \ 2014）。\n\n最后，当一个人被进入医疗机构时，健康保险计划将通过国际疾病分类代码或 `ICD` 代码告知医疗事件的性质。例如，糖尿病的 `ICD` 代码范围从\
  \ `E10` 到 `E14`，取决于糖尿病的类型。完整的 `ICD` 代码列表可以在 Bowie and Schaffer (2013) 中找到。\n\n为\
  \ HIC 提供咨询的医疗团队还指出，老年人在心脏病和糖尿病方面的保险成本更高（Hu et al., 2015）。因此，可能需要特别关注这一年龄段的人。`Table\
  \ 19.10` 总结了医疗团队制定的让 HIC 保单人入选公司健康管理计划的标准。\n\n### 表 19.10\n用于准入健康管理计划的标准\n\n| 标准标识\
  \ Id | 心脏病 | 糖尿病 |\n| --- | --- | --- |\n| 1 | 在 12 个月内看心脏科医生两次或以上 | 在 12 个月内与内分泌科医生预约两次或以上\
  \ |\n| 2 | 在 12 个月内进行心电图或超声图检查两次或以上 | 在 12 个月内进行监测葡萄糖水平的血液检查两次或以上 |\n| 3 | 加入健康保险计划时将心脏病申报为既往疾病\
  \ | 加入健康保险计划时将糖尿病申报为既往疾病 |\n| 4 | 至少 60 岁 | 至少 60 岁 |\n| 5 | 进入与心脏疾病相关的 `ICD` 医疗机构\
  \ | 进入与糖尿病相关的 `ICD` 相关的医疗机构 |\n\n应该注意的是，在 `Table 19.10` 列出的标准中，最后两个特别值得关注。正如医疗团队所示，许多证据表明健康管理计划可能不是处理住院风险的最佳方法，但一些报告指出，通过调整，这些计划在这方面可能会变得更有效（Donzé\
  \ et al., 2013）。\n\n## 19.4.3 健康管理计划\n\n为了便于理解、规划和运行，HIC 健康管理计划被分为若干子项目。这些子项目描述在\
  \ `Table 19.11` 中。\n\n### 表 19.11\n健康管理计划子项目\n\n| Id | 描述 |\n| --- | --- |\n| sp1\
  \ | 搜索与识别——利用存储在 HIC 数据库中的大量信息，寻找符合健康管理计划至少一项准入标准的人 |\n| sp2 | 风险评估——通过电话访谈可能邀请参加计划的人员，以评估其状况的严重程度。将访谈和风险评估的结果记录在\
  \ HIC 数据库中 |\n| sp3 | 为高风险保单人建立健康管理计划——为具有产生巨大保险成本风险的保单人设计 HIC 健康管理计划将提供的服务 |\n\n\
  \n\n\n\n| 子项目 |  |\n| :--- | :--- |\n| sp4 | 邀请高风险投单人加入计划——邀请符合条件的个人加入针对高风险投单人的管理护理计划。在\
  \ HIC 数据库中记录邀请结果。 |\n| sp5 | 运行高风险管理护理计划——让人员遵守计划的规定和活动。运行计划并监控参与者生活方式的变化。在 HIC\
  \ 数据库中记录计划与参与者之间的每一次互动。 |\n| sp6 | 建立极高风险疾病管理护理计划——为具有产生巨额成本索赔极高风险的投单人设计管理护理计划将提供的服务。\
  \ |\n| sp7 | 说服投单人加入极高风险管理护理计划——说服符合极高风险管理护理计划条件的个人。在 HIC 数据库中记录邀请结果。 |\n| sp8 |\
  \ 运行极高风险管理护理计划——让人员同意计划的规定和活动。运行计划并监控参与者生活方式和健康状况的变化注册计划与参与者之间的所有互动。 |\n| sp9 |\
  \ 广告——宣传管理护理计划的存在，旨在吸引新成员加入医疗计划并申请管理护理计划。利用 HIC 数据库存储的信息来制定广告策略。 |\n| sp10 | 调整——利用\
  \ HIC 数据库中记录的信息报告两个管理护理计划的结果。此外，寻找调整计划准入标准的标准以提高其效率。此外，使用相同的信息调整计划的服务和活动，使其对投单人更具吸引力。此目的是降低计划的流失率。\
  \ |\n\n需要注意的是，根据风险评估子项目 `sp2` 的结果，投单人根据近期产生巨额保险成本的风险被分为四组，即低、中、高和极高。\n\n根据业务和医疗团队的意见，在低风险和中风险组中投入的资金往往回报率微乎其微。因此，这些组中的人员不会被邀请参加管理护理计划。\n\
  \n剩余的投单人将被说服参加不同的计划。这些管理护理计划本质上是不同的，因为极高风险组的人员需要加强且昂贵的行动。否则，他们的医疗保险成本很容易失控。\n\n\
  ### 19.4.4 项目规划、融资与实施限制\n\n`sp1` 到 `sp10` 子项目之间需要满足的依赖关系在图 19.1 中给出。这些子项目的现金流在表\
  \ 19.1 中介绍。它们根据运行开始的 NPV 如表 19.2 所示。表 19.5 展示了若干可能的实施序列的 NPV、CI 和 ROI。\n\n表 19.5\
  \ 中排在前面的序列是产生最高 ROI 的。由于 HIC 是一家营利组织，这是 HIC 顾问团队应该选择的序列，用于实施表 19.11 中描述的子项目。如果运行子项目的资金没有受到限制，且没有预设\
  \ ROI 的最小值，这种情况就是成立的。\n\n然而，经理们并不总是拥有足够的资金来实施他们选择的运行序列。此外，即使资金到位，大数据项目在被选择实施之前通常会与其他投资机会进行比较（Chandra,\
  \ 2014）。\n\n在这方面，许多公司倾向于建立一个门槛率，即项目必须产生的最低投资回报率。如果一个项目的 ROI 低于可接受的门槛率，则不应运行该项目。例如，如果管理护理项目的门槛率为\
  \ 700%，那么表 19.5 中的任何运行序列都无法满足这一要求。结果是该项目将不得不放弃（Calandro et al., 2015）。\n\n然而，运行投资组合中的所有子项目并不总是能带来最高的\
  \ ROI。如果某个特定的子项目 `spi` 运行需要大量资金且产生的财务回报较小，那么通过避免运行 `spi` 可以获得特定运行序列更高的 ROI。子项目 `sp9`\
  \ 就是这种情况，因为它是投资组合中最昂贵的子项目。此外，`sp9` 是管理护理项目机会窗口内产生财务回报最低的子项目。在这方面，请参见表 19.1。\n\n\
  例如，考虑以下运行序列，`sp9` 并不在其中：\n\n```\nNRS = sp1 -> sp2 -> sp6 -> sp7 -> sp8 -> sp3 ->\
  \ sp4 -> sp5 -> sp10\n```\n\n这一特定的运行序列产生了 `3565 K` 并需要 `438 K`。不仅 `3565 K` 的 ROI\
  \ 高于 `438 K`，而且它所需的资金更少。ROI 的计算如下：\n\n```\n(3565 K - 438 K) / 438 K = 714%\n```\n\
  \n尽管 NRS 没有考虑运行表 19.1 中的所有项目，但如果 HIC 提供了所需的资金，管理护理团队应该选择这一序列。\n\n### 19.5 方法总结\n\
  \n考虑大数据项目的公司可以从以下步骤受益：\n\n1. **项目选择**：令 `P` 为一个分为子项目组合 `SP = {sp1, sp2, …, sp10}`\
  \ 的大数据项目。\n2. **依赖关系**：定义一个图 `G = (V, E)`，指定子项目之间需要满足的依赖关系。注意：\n   ```\n   V = SP\n\
  \   E = {(spi, spj) | spi, spj ∈ V}\n   ```\n   此外，如果运行 `spj` 取决于 `spi` 的完成，则 `(spi,\
  \ spj) ∈ E`。亦然。\n3. **网络图**：根据 `G` 中的信息构建网络图。\n4. **机会窗口**：确定项目的机会窗口 `WO`。\n5. **数据流元素**：对于每个\
  \ `spk ∈ SP`，估计其在时期 `i` 的现金流分量，即 `espk, i`。注意 `1 <= i <= WO`。\n6. **工期**：建立每个子项目的工期。\n\
  7. **净现值**：定义函数 `NPV(sp, t)`，返回子项目 `sp` 在时期 `t` 运行的净现值。在这方面请参见公式 19.1](#30_Chapter19.xhtml_eq19_1)。\n\
  8. **运行序列**：生成所有可能的运行序列。考虑可能对用于执行项目 `P` 的运行序列施加的限制。考虑到运行投资组合中的所有子项目可能会导致次优序列。\n\
  9. **净现值**：计算每个可能的运行序列的 NPV。这是序列中每个子项目根据其运行时期的 NPV 之和。\n\n\n\n\n\n## 10. 资本投资\n\
  由于任何事都会产生成本，因此确定每种可能的运行序列所需的资本投资 `CI` 是重要的。\n\n## 11. 投资回报率\n计算每个可能的运行序列的投资回报率。该比例为净现值（NPV）减去\
  \ `CI` 除以 `CI` 的比值。\n\n## 12. 选择实施的运行序列\n在资金足够执行的运行序列中，选择 `ROI` 最高的一个。执行该序列，并利用其提供的财务收益。\n\
  \n## 19.6 结论\n尽管“大数据”一词最早出现在约 20 年前 Michael Cox 和 David Ellsworth 编写的一篇会议论文中（Cox\
  \ & Ellsworth, 1997），但到为止，关于如何评估大数据项目收益的论述仍少于言。这令人遗憾，因为在这些项目被选选择实施之前，其收益通常会与其他竞争性计划的收益进行比较。因此，大数据项目经理可能会发现很难获得运行项目所需的支持。\n\
  \n本章介绍了一种旨在填补这一空白的方法。该方法允许项目经理从财务角度评估大数据项目。此外，该方法使这些项目产生的投资回报率最大化。这是通过识别子项目的运行序列实现的，该序列的净现值减去资本投资与资本投资之间的比值最高。因此，大数据项目往往会变得更具吸引力和盈利能力。\n\
  \n本章介绍的方法所使用的财务原则和技术并不理解。尽管在自动化工具的支持下计算会变得更简单，但对于小型项目，可以使用通用电子表格工具（如 `MS Excel`）来完成。这一切使得决策更加科学。最终，这将有助于将大数据项目置于旨在从组织现有数据中提取更多价值的计划中心。\n\
