  \ 纳秒（超过一个月），因此我们安全地得出结论：每周更新一次素数（即`t = 168 hours`）不会损害系统的安全性。动态共享密钥基于素数计算。因此我们得出结论，攻击者无法在时间间隔\
  \ `t` 内破解共享密钥。此外，共享密钥在不交换传感器与 `DSM` 之间信息的情况下进行更新。这使得可能尝试拦截数据流的敌手产生困惑。在攻击者知道密钥之前，原始密钥已经更改了四次，且攻击者并不知道这一信息。\n\
