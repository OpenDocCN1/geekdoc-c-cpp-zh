  \ of the ACM 2016, 59(2): 92–99。\n\n\n\n\n\n作为大数据的一种类型，UGC（用户生成内容）也共享着“五 V”特征。\n\
  \n任何人可以在任何时间、通过任何设备生成 UGC 的灵活性，导致了其规模和产生速度的指数级增长。例如，在 2014 年，YouTube 用户每分钟上传的 300\
  \ 小时新视频，是 1 年前的 3 倍 [3]；Twitter 每天产生 5 亿条推文，使其每年的规模增长率约为 30% [4]；到 2016 年第一季度末，Yelp\
  \ 上的累计评论已增长到约 1.02 亿条，与去年同期相比了 32% [5]。\n\n此外，由于个别用户的主观偏好，UGC 的格式在本质上非常多样化。图像、视频、音频、社交互动和对话经常由个人用户在网上创建、发布和分享。\n\
  \nUGC 的价值是重大的。UGC 已用于用于许多研究中来预测事件，例如电影票房收入 [6]、自然灾害如地震 [7]和台风 [8]，甚至政治选举 [9,10]。此外，越来越多的用户正依赖\
  \ UGC 来做出他们的在线购买和下载决策。例如，在在线评论系统中（如 Amazon、Yelp、Reddit 和 IMDB），用户参考其他用户生成并分享的评分和评论来评估在线物品的可信度。\n\
  \n然而，由于两个原因，UGC 的真实性很难控制。一方面，创建和分享此类内容的便利性允许个人用户产生无意识的错误。另一方面，UGC 巨大的价值为利润驱动的操纵提供了强有力的动机，目的是进行不符合道德的促销、传播谣言并误导公众决策。例如，越来越多的企业意识到在线评分/评论的影响，正据此制定它们的在线营销策略，甚至试图操纵用户评分/评论\
  \ [11]。\n\n在本章中，我们主要讨论 UGC 的真实性，特别关注安全、信任和隐私挑战以及相应的防御解决方案。\n\n## 11.1.2 UGC 的分类](#22_Chapter11.xhtml_sec11_1_2)\n\
  \n在允许个人用户生成在线内容的各种渠道中，三类从不同方面激励个人用户贡献的新兴应用正变得越来越流行并成为 UGC 的主要来源。\n\n### 11.1.2.1\
  \ 在线社交网络](#22_Chapter11.xhtml_sec11_1_2_1)\n\n在线社交网络提供了各种方式来让用户参与在线社交互动和娱乐。例如，LinkedIn\
  \ 用户能够发布他们的专业简介、建立业务联系并寻找工作机会；Twitter 用户可以通过推文和转发推文明确地表达他们的观点、评论和情感；Facebook 用户可以分享他们的照片和状态，并在朋友的动态上发表评论以与家人和朋友社交；YouTuber\
  \ 能够发布关于他们的日常生活和有趣经历的视频以吸引订阅者。\n\n富含 UGC 的在线社交网络平台已经成为最流行的互联网目的地 [12]。2009 年，用户在社交网络和博客网站花费的时间增加了三倍，占了其总在线时间的\
  \ 17% [13]。\n\n### 11.1.2.2 众包](#22_Chapter11.xhtml_sec11_1_2)\n\n众包是一种新兴的模式，通过将巨大的任务分解为微小的任务来解决\
  \ [14]，它在网络范围内通过大规模的众包请求日益受欢迎 [15]。众包有许多形式，包括众筹（例如 22_Chapter11.xhtml_1_2）、知识收集和分享（例如\
  \ Wikipedia）、人类任务（例如 Amazon Mechanical Turk）。\n\n通过利用众人的智慧，众包正在解决不同的问题。一方面，许多公司和机构依赖众包来寻找解决方案，例如\
  \ [16]。一个例子是 2009 年的 DARPA 实验，要求众包在全范围内放置标记。另一个例子是 Netflix 大赛，要求众包设计比 Netflix 算法更准确的算法。另一方面，个人用户为了金钱、社会认可（例如社交标签）或其他原因而参与。例如，全世界的用户自发地在\
  \ Wikipedia 上发布和修订，每天产生超过 800 篇文章 [16]。\n\n### 11.1.2.3 在线口碑网络](#22_Chapter11.xhtml_sec11_1_2_3)\n\
  \n由于在线生成和分享个人经历变得简单，口碑（WoM）作为人类历史上最古老的机制之一在网络世界获得了新的意义。在线内容的可信度可以基于大规模口碑网络的反馈进行评估。此类反馈的聚合结果被称为在线声誉。例如，YouTube\
  \ 上的观众可以“赞”或“不喜欢”视频片段；Amazon 上的买家分享购买经历；Yelp 上的旅行者评估酒店或餐厅；读者可以在 Reddit 上对一篇社会新闻进行等。\n\
  \nPew Internet & American Life Project 发现，美国 26%的成年互联网用户通过在线评论系统对至少一种产品、服务或个人提供过评论。在线口碑网络在影响用户决策方面正发挥着日益重要的作用。例如，拥有声誉的\
  \ eBay 卖家预计可以比新卖家多获得 8%的收入 [17]；由 comScore Inc.和 Kelsey Group 进行的调查显示，消费者对于获得“优秀”五星评分的服务意愿比获得“良好”四星评分的服务多支付\
  \ 20% [18]。\n\n与在线社交网络和众包不同，在线口碑网络最初的设计更多地关注评估现有数据而不是产生新数据。然而，大量的评估数据本身也成了 UGC 大数据的重要组成部分。\n\
  \n## 11.1.3 系统模型](#22_Chapter11.xhtml_sec11_1_3)\n\n在本节中，我们希望为主要由用户生成数字内容的网络或平台提供一个抽象的系统模型。具体而言，如图\
  \ 11.1](#22_Chapter11.xhtml_fig11_1)所示，系统包含两个层：用户层和内容层。\n\n```\n![fig11_1.jpg](img/fig11_1.jpg)\n\
  ```\n\n图 11.1 以 UGC 为中心的平台系统模型。\n\n\n\n\n\n在用户层，存在两类用户：创建至少一条内容的**生成者**（generators）和查看生成者所创建内容的**消费者**（consumers）。例如，生成者可以是可以在社交网络上发布帖子的用户、提交众包任务的工作人员，以及在线口碑传播（WoM）网络中的评审员。消费者可以是在\
  \ Twitter 上转特帖文或在 Facebook 上点赞帖文的用户、从群体中收集提交内容的请求者，或者根据他人评价/评分做出购买或下载决策的在线用户。单个用户可以是纯粹的生成者、纯粹的消费者，也可以是既生成又消费内容的混合体。此外，一对连接的用户可以代表：(1)\
  \ 具有社交关系（无论是职业还是个人）的人；(2) 参与相同众包任务的同事；或 (3) 评审过相同在线物品的评审员。\n\n在内容层，我们使用一个星号来表示由用户生成的每一条内容。内容可以是社交网络用户发布的帖子、众包工作者的提交物，或在线\
  \ WoM 网络评审员的评价/评分。此外，多链接内容可以代表：(1) 相关的社交对话主题；(2) 针对同一众包任务的提交；或 (3) 评估同一在线物品的评分/评论。\n\
  \n更重要的是，使用了两种类型的链接来连接用户层和内容层。连接内容 `C` 和用户 `Ui` 的点线表示 `C` 是由 `Ui` 生成的。这种链接表示多对一的关系，即一个用户可以生成多条内容，而一条内容只能由一个用户生成。连接\
  \ `Uj` 和 `C` 的虚线表示 `C` 被 `Uj` 消费了。这种链接表示多对多的 关系，即一个用户可以消费多条内容，而一条内容可以被多个用户消费。\n\n\
  ## 11.1.4 新兴的安全、隐私与信任挑战\n\n由于普通用户有多种动力促使他们为 UGC（用户生成内容）贡献，操纵此类内容的动机也日益增加，这为数据安全、隐私和信任带来了巨大挑战。\n\
  \n#### 11.1.4.1 安全、隐私与信任之间的关系\n\n最近，在关于信息系统或网络攻击与防护的讨论中，安全、信任和隐私经常放在一起讨论。尽管这三个术彼此密切相关，但它们都有自己的侧重点。因此，在讨论\
  \ UGC 相关的安全、信任和隐私挑战之前，我们想先通过定义来澄清这三个术语。\n\n安全被定义为信息机密性、完整性和可用性的维护。此外，“其他属性如真实性、可追溯性、不可否赖性和可靠性也可以包含在内”\
  \ [[19]]。换之，安全防护的最终目标是拒绝对数据的非法访问。\n\n隐私被定义为“数据所有者隔离自己或关于自己的信息，从而选择性地表达自己的能力” [[20]]。与被视为安全部分的机密性不同，隐私更具主观性，因为数据所有者可能会根据自己的背景、兴趣、教育、文化等多种方式决定某些信息是否属于隐私。\n\
  \n信任被定义为“一方对另一方是否执行某项行动或拥有某种属性有多大的信心” [[21]]。与安全和隐私不同，信任代表双方之间的关系，以及对未来活动的预期。\n\n\
  针对安全、隐私或信任的攻击通常有不同的攻击目标，并且通过不同的解决方案来解决。在本章中，我们分别讨论安全、隐私和信任的典型攻击/防御，目的是比较这些攻击和防御之间的内在相似性和区别。\n\
  \n#### 11.1.4.2 安全挑战\n\n在大数据经济巨大利润的驱动下，针对 UGC 的各种安全攻击正在迅速涌现。\n\n由于创建在线账户非常简单，女巫攻击（Sybil\
  \ attacks）——即单个攻击者创建大量虚假在线账户以主导 UGC 应用中传播的信息——变得越来越流行并可能造成严重损害。\n\n此外，用户数据的暴露引发了安全风险。用户在网上生成内容以分享经验并在更大的网络缘社区中建立关系。然而，这些内容也可能使用户暴露在广泛的其他用户和群体中，例如陌生人、托管网站、连接托管网站的第三方、黑客等。这种暴露可能会给个人用户带来各种风险，如身份盗用、物理或网络跟踪、网络钓鱼攻击、社交垃圾邮件等。\n\
  \n#### 11.1.4.3 隐私挑战\n\nUGC 可能显式或隐式地包含个人信息，这引起了对用户隐私的广泛关注。在社交媒体上粗心发布个人信息的人很容易导致隐私泄露。例如，卡内基·梅隆大学的一项研究表明，利用从社交网络和在线数据库中收集的信息，可能预测个人九位社会安全号码的大部分甚至全部内容\
  \ [[22]]。一项研究 [[23]] 显示，在调查的 Facebook 用户中，很大比例的用户在无论是否有意识的情况下披露了个人信息，包括真实姓名、地址、生日、爱好和兴趣等。\n\
  \n此外，即使是应该受到良好保护的信息也可能被先进的隐私攻击破解。例如，最近的研究显示，即使是仔细保护自己信息的用户，其个人属性仍可能被黑客通过查看其好友列表暴露\
  \ [[24]]。另一个例子是 2006 年 Netflix 大奖，这是一个基于匿名 Netflix 用户之前评分的电影推荐算法公开竞赛。在这场比赛中，Netflix\
  \ 向公众发布了一个包含 100,480,507 条评分的数据集，由 480,189 名匿名 Netflix 订阅者提供。德克萨斯大学奥斯汀分校的两位研究人员开发了一种去匿名化攻击模型，并将模型应用于数据集。他们已经证明\
  \ [[25]]，通过匹配他们在 Netflix 和另一个电影评分网站 IMDB 评分，可以轻松揭露某些订阅者的身份。作者还声称，可以使用他们的攻击模型从该数据集中推断出政治偏好等敏感信息。\n\
  \n\n\n\n\n在众包的背景下，隐私问题从两个维度被提出。一方面，工作者在执行任务时，其个人数据可能会泄露给攻击者。例如，To 等人 [26] 宣称，当工作者向空间众包（SC）服务器报告其所在区域发生的事件（如灾难）时，攻击者可以获取该工作者的位置。另一方面，任务请求者提供的原始数据可能包含敏感信息，这些信息需要防止被工作者滥用。Varshney\
  \ [27] 指出，请求者也需要对提供给工作者进行处理、纠正或评估的原始数据进行模糊化处理，以保护其知识产权和机密信息。在这两种情况下，为了保护隐私，都可能需要向数据值中添加随机噪声。然而，这些噪声必须经过控制，以防对结果准确性产生显著影响。隐私与结果准确性之间的权衡是具有挑战性的，在设计众包任务时需要仔细考虑。\n\
  \n### 11.1.4.4 信任挑战 (#22_Chapter11.xhtml_sec11_1_4_4)\n\n在线创建内容的内容的性也导致了用户在提供高质量信息时的不确定性增加，这使得此类内容的可信度受到质疑。\n\
  \n众包场景下的数据质量由于两个原因被认为是一个关键问题。首先，具有不同背景甚至有时缺乏知识的参与者可能会参与进来并贡献大量不可用的提交内容。其次，缺乏经验的请求者设计不当的任务也可能导致采集的数据质量低劣\
  \ [28]。因此，除非众包提交的信任问题能够解决，否则众包很少被用于任务关键型系统。已有许多研究通过采用多种方法来提高数据质量 [29]，例如在图像标注中使用冗余的非专家标签\
  \ [30]、重复标注 [31]、设置资质测试 [32] 等。\n\n如前所述，在线口碑（WoM）网络的建立最初是为了通过利用个人在线用户的评分/评论，帮助个人用户区分高质量的在线物品和低质量物品。遗憾的是，即使是此类平台上大多数（如果不是全部）的评估数据也存在相同的质量问题。例如，iPad\
  \ 版的“亚马逊橱窗购物应用”中有一个名为“奇特产品”的类别，包含许多奇怪且虚假的产品，如铀矿石或 50 美元的托斯卡纳全脂牛奶 [33]。令人惊讶的是，这些产品收到了数千条评分/评论，尽管亚马逊并没有真正销售它们。这个例子中的用户只是为了好玩提供这些评论。但也显示了在网上生成虚假内容（即评论）是多么容易。\n\
  \n此外，许多公司通过操纵在线用户讨论来激进利用在线口碑营销。研究显示，书籍作者和 eBay 用户会为自己的产品撰写或购买好评 [34–36]。最近的一项研究发现，10%\
  \ 的在线产品存在被操纵的用户评论 [11]。评论公司的兴起（以实廉的价格提供复杂的评论操纵包）加剧了此类操纵的普遍性。仅需 9.99 美元，名为 `[IncreaseYouTubeViews.com](http://IncreaseYouTubeViews.com)`\
  \ 的公司就可以为你的 YouTube 视频片段提供 30 个“喜欢”评分或 30 条真实用户评论。作为最大的购物平台，淘宝已将这些刷评服务识别为严重威胁。此类操纵可能会显著扭曲评价结果，削弱用户对口碑系统的信心，并最终使此类系统失去价值。\n\
  \n多种信号处理技术和统计分析已被用于检测不诚实的评价 [37–39]。此外，还开发了定量信任模型来动态评估评价者的诚实度。另一方面，针对检测方法和信任模型的先进攻击也在快速演变。模型防御与攻击之间的“军备竞赛”正在进行。\n\
  \n在本章的剩余部分，我们将分别从安全、隐私和信任角度讨论特定的攻击。\n\n## 11.2 安全攻击与防御 (#22_Chapter11.xhtml_sec11_2)\n\
  \n### 11.2.1 女巫攻击 (#22_Chapter11.xhtml_sec11_2_1)\n\n女巫攻击最初由 Douceur 提出 [40]，它是指一种攻击方式：单一恶意实体（即攻击者）创建大量的匿名在线\
  \ ID，以在系统中获得不成比例的影响 [41]。通过控制这些伪造 ID 协同进行恶意行为，攻击者可以获取大量的系统资源并造成严重损害。\n\n精心设计的巫攻击可以在广泛的应用中实施，例如点对点（P2P）网络和无线传感器网络。例如，为了降低数据丢失和泄露的风险，大规模\
  \ P2P 网络通常会让多个节点执行重复任务以引入冗余。然而，在女巫攻击中，大量的女巫账户会大大增加攻击者被重复选中执行任务的机会，从而破解这种冗余性 [40]。\n\
  \n在用户生成内容（UGC）中心系统中，信息通常根据“多数投票”或“多数意见”进行聚合，假设大多数用户账户是诚实的。在正常情况下，每个用户账户只表达一次意见。然而，女巫攻击者可以通过虚假账户占据大量投票，轻松地将普通用户变成少数，从而显著扭曲公众意见。例如，在\
  \ `Google PageRank` 中，恶意攻击者可以通过创建多个指向网页的网页来提高该网页的排名 [42]。在在线口碑系统中（如 eBay 或亚马逊评分系统），女巫账户可以散布关于诚实商家的流言以降低其声誉，或进行自我推销以获取财务利益\
  \ [43]。\n\n\n\n\n研究人员已经进行了大量研究以检测和防止 Sybil 攻击。例如，在 [44] 中，用户及其信任关系被建模为社交图，其中顶点代表用户，链接表示用户关系。提出了一种防御方案\
  \ `SybilGuard`，它基于恶意用户可以创建许多身份但极少信任关系的假设，通过识别社交图中不成比例的小“割切”来将 Sybil 账户与正常账户区分来。在\
  \ [45] 的后续研究中，提出了一种名为 `SybilLimit` 的改进协议，通过进一步减少百万节点合成社交网络中的 Sybil 账户数量来优化该方法。在\
  \ [46] 中提出了一种基于贝叶斯的推理方法 `SybilInfer`，它由诚实社交网络的概率模型和一个推理引擎组成。Buchegger 和 Boudec [47]\
  \ 提出了一种解决方案，通过定期重新评估账户行为并对历史评分进行折扣来检测并消除 Sybil 账户。在 [48] 中，作者检查了分布式哈希表（`DHTs`）图（显示节点由哪个节点引入的图）来识别\
  \ Sybil 账户，其假设是大量恶意账户是由少数 Sybil 实体引入的。此外，还可以利用中心化权威来防止 Sybil 攻击，该机构发布信任证书以确保给给定实体只分配一个身份\
  \ [49]。其他解决方案可能包括检查身份拥有的资源、增加创建 Sybil 身份的成本、使用信任设备等 [49]。\n\n尽管各种防御手段发展迅速，但在实践中完全消除\
  \ Sybil 攻击仍然具有挑战性。目前针对防御 Sybil 攻击的研究仍然非常活跃。\n\n## 11.2.2 基于用户敏感信息的安全攻击 (#22_Chapter11.xhtml_sec11_2_2)\n\
  \n由于这些系统每天都发布了丰富的个人详细信息，包括但不限于人的真实全名和家庭地址、出生日期、电子邮件地址、用户名和密码、朋友关系、地理位置、信用卡详情等，以\
  \ UGC 为中心的系统现在成为各种安全攻击的首要目标。在本节中，我们将讨论几种典型的安全攻击，如身份盗窃、社交垃圾信息和钓鱼攻击，这些攻击在 UGC 为中心的系统繁荣之前就已经存在。然而，以\
  \ UGC 为中心的系统（尤其是社交网络网站）为这些旧骗诈提供了新的平台。\n\n### 11.2.2.1 身份盗窃 (#22_Chapter11.xhtml_sec11_2_2_1)\n\
  \n在身份盗窃攻击中，攻击者试图获取用户的个人身份识别信息（`PII`），并故意利用此类信息冒充受害者以进行欺诈，例如发布垃圾信息、发送恶意软件、盗取联系人的私有数据，甚至诱骗联系人汇款\
  \ [50]。\n\n身份盗窃成功的原因是多方面的。用户的身份信息可能由于以 UGC 为中心的系统的漏洞而泄露。例如，在 [51] 中，提出了一种中间人攻击，通过劫持网络层上的\
  \ `HTTP` 会话（大多数社交网络网站未能保护安全）从社交网络网站检索用户的敏感数据。此外，用户的个人信息也可能通过第三方应用程序泄露。大多数社交网络网站都有请求访问其账户信息的应用。安全性较差甚至已被攻破的第三方应用带来了身份盗窃的高风险。\n\
  \n身份盗窃攻击在以 UGC 为中心的系统中非常普遍。例如，2013 年，来自田纳西州苏尔文县苏尔文县学区的一名 18 岁学生以学区督监 Yennie 博士的名义开了一个虚假的\
  \ `Twitter` 账户，并通过该账户发布了许多不当的推文 [52]。近年来，`Facebook` 上一种流行的身份盗窃骗局是：被盗的用户账户向其朋友发送绝望的消息索要钱。此类信息可能是：“我正在国外旅行，钱包丢了。请给我汇账\
  \ `$x` 以便回家。”\n\n还有关于大规模身份盗窃切可行性的研究。例如，[41] 中的作者提出了一种在社交网络上发起身份盗窃攻击的自动化方法。具体来说，通过伪造现有受用户的身份并向受害者的朋友发送好友请求，攻击者可以连接到受害者的朋友，访问他们的敏感个人信息，并将他们变成受害者。利用获取的敏感信息，攻击者能够伪造更多现有用户，并进一步针对其朋友发起身份盗窃攻击。\n\
  \n### 11.2.2.2 社交垃圾信息和网络钓鱼攻击 (#22_Chapter11.xhtml_sec11_2_2_2)\n\n随着 `Facebook`\
  \ 和 `Twitter` 等在线社交网络的日益流行，社交垃圾信息也在迅速涌现。根据 [53]，通过利用目标用户的社交关系与他们建立连接，社交网络垃圾信息发送者赚取的钱比通过传统的电子邮件发送垃圾信息多出\
  \ 10 倍。这些垃圾信息可能会产生数千次查看，因为人们更有可能信任来自其社交网络“朋友”发来的东西。最近的一个例子是，2015 年有 150 万个 `Facebook`\
  \ 账户被盗并卖给了企业，这些企业通过这些被破解的账户向朋友发送广告 [54]。\n\n社交钓鱼通常与社交垃圾信息并存，攻击者旨在通过冒充可信方来欺骗性地获取敏感信息。社交钓鱼通常包含指向伪造网站或感染恶意软件网站的恶意链接。例如，2012\
  \ 年发生了一场针对 `Facebook` 用户的攻击，冒充 `Facebook` 安全的恶意账户向普通用户发送虚假消息和伪造链接，索要他们的 `Facebook`\
  \ 登录信息以及信用卡信息 [52]。在 [55] 中进行的实验显示，社交钓鱼攻击在社交网络上的成功率可达到 70%。\n\n### 11.2.2.3 防御 (#22_Chapter11.xhtml_sec11_2_2_3)\n\
  \n研究人员已经进行了大量研究以防止用户受到攻击。人们从社会、技术和法律角度提出了解决方案，例如，教育人们意识到此类攻击、加强对此类攻击的监控、在发现恶意网站后将其关闭、提高网络浏览器的安全性、对疑似攻击者提起诉讼等。\n\
  \n在这些解决方案中，最重要的是教育以 UGC 为中心的系统用户对他们每天在网上发布的内容保持谨慎，并尽量减少其敏感信息的泄露。如果没有个人用户意识到潜在的安全风险，技术解决方案永远是不够的。\n\
  \n## 11.3 隐私攻击与防御 (#22_Chapter11.xhtml_sec11_3)\n\n\n\n\n\n得益于在线通信的便利性，越来越多的人习惯将社交活动从线下转移到线上，例如交朋友、找工作、建立关系、交换知识和信息等。当人们通过互联网交换信息时，在线活动的增加产生了大量的\
  \ UGC（用户生成内容）。然而，当人们生成并共享这些内容时，他们往往并没想到这些信息随后会被检索、挖掘，甚至被用来伤害自己。\n\n隐私是一个主观概念，指的是个人或群体控制公开可用个人信息数量的能力。换句话说，数据所有者应该有权根据自己的喜好，控制分享什么信息以及分享给谁。\n\
  \n### 11.3.1 理解隐私威胁与防御\n\n根据上述隐私定义，可以从两个视角对隐私威胁和防御进行分析：信息类型视角和对手类型视角。\n\n### 11.3.1.1\
  \ 私有信息类型\n\n不同类型的私有信息通常面临不同的隐私挑战，因此可能需要不同的隐私保护解决方案。在 UGC 的背景下，我们将用户的私有信息分为两类：个人资料信息（即\
  \ `Type I`），它表示用户的个人信息，包括但不限于身份、年龄、性别、地址、照片、位置、宗教信仰等；以及关系信息（即 `Type II`），它包含了家庭、朋友、同事和社交关系。\n\
  \n个人资料信息通常由一个用户生成并拥有，而关系信息可以由多个用户生成和共享，这模糊了信息的所有权，并往往导致复杂的隐私场景。\n\n### 11.3.1.2\
  \ 隐私对手类型\n\n虽然 UGC 可能会被不同方轻松访问，但生成此类数据的用户并不总是了解所有这些方。我们将可能访问用户数据并侵犯其隐私的所有潜在方总结如下：\n\
  \n*   **系统中的其他用户。** 根据他们与数据所有者的关系，这些用户可以进一步分为三类：直接连接用户、间接连接用户和普通公众 [56]。具体而言，直接连接用户是指与数据所有者关系密切的朋友、家庭成员或同事；间接连接用户是指朋友的朋友（FOF），他们可能通过一或两跳连接到数据所有者；普通公众是指与数据所有者完全没有关系的用户。\n\
  *   **第三方，例如应用开发者和广告代理。** 这些第三方通常是以 UGC 为中心的系统所生成的用户行为数据的消费者，因此为 UGC 系统提供者提供了大部分收入。UGC\
  \ 系统提供者有强烈的动机与此类方共享数据。然而，由于过度获取数据和不完善的匿名化，这种数据共享往往会导致第三方侵犯用户隐私。\n*   **UGC 系统提供者。**\
  \ 从技术角度来看，UGC 系统提供者可以任意访问其系统中生成和共享的所有数据。因此，他们对用户数据的不当使用可能会造成严重的损害，且个人用户几乎无法检测。\n\
  \n### 11.3.2 隐私相关威胁\n\n近年来，针对 UGC 的各种隐私威胁迅速涌现并动态演变。在本节中，我们将典型的隐私威胁分为两类：个人资料隐私威胁和关系隐私威胁。\n\
  \n### 11.3.2.1 个人资料隐私威胁\n\n用户的敏感资料（即 `Type I`）信息可能由于以下原因被泄露：(1) 数据所有者设置的隐私设置漏洞，2)\
  \ 通过合法方的信息泄露，或(3) 非法方的信息推断。请注意，一个方是否合法取决于数据所有者自己的喜好。在这里，非法方可以指未获得用户许可访问其私有信息的任何方。\n\
  \n私自披露私有信息会给个人用户造成严重损害。例如，用户在在线社交网络（尤其是基于移动的网络）中分享位置信息正成为一种趋势。尽管这让用户能够从更动态、更个性化的服务中受益，但其位置信息的暴露也会引发物理伤害（如跟踪）的高风险。适当的隐私设置是保护用户隐私的第一步。然而，这一步仍然需要努力。目前，当用户在没有显式隐私设置的情况下在线发布内容时，这些内容通常会在用户不知情的情况下默认向公众开放。尽管更多用户意识到了隐私问题，但对其隐私设置的控制往往太复杂而难以遵循。\n\
  \n此外，即使有了完美的隐私设置（仅允许合法用户访问敏感信息），对于这些合法用户无论是有意还是不经意造成的隐私泄露，我们的控制手段也非常有限。例如，获取了他人敏感信息的用户可能简单地将其在网络上传传。这种行为在线下人类社会中经常表现为“泄密”\
  \ [56]。此外，[57] 中的研究显示，隐私设置不足的用户会增加其朋友以及整个社交社区的隐私脆弱性。此外，UGC 平台提供者的不当数据使用/共享形成了另一个隐私泄露的源。\n\
  \n最后，非法用户可能会利用隐私漏洞，从匿名化数据集中推断用户的敏感资料信息。具体而言，攻击者尝试通过链接公开或半公开发布的匿名化数据集 [58] 来对用户去匿名。[59,60]\
  \ 的研究描述了另一种攻击方法，使用其他用户内容中标记的照片来链接用户资料并揭示用户的敏感数据，例如当前位置。除了位置数据，即使经过匿名处理，也可以从发布的数据中推断出更敏感的数据}[61]\
  \ 中描述的攻击甚至根据公开信息预测用户的社会安全号码。\n\n### 11.3.2.2 关系隐私威胁\n\n关系（即 `Type II`）隐私也可能由于以下原因被破坏：(1)\
  \ 数据所有者设置的隐私设置漏洞，2) 通过合法方的信息泄露，或(3) 由多个数据所有者导致的复杂隐私场景的信息推断。\n\n前两种威胁与个人资料隐私威胁相似。主要区别在于第三种威胁，它是具有挑战性的，因为参与一段关系中的多个方通常隐私需求不同，甚至相互冲突。智能非法用户利用不同方之间的这种冲突可能会推断出个人的敏感关系，甚至重建整个网络的社交图谱。\n\
  \n\n\n\n\n一个典型的例子是在线社交网络中用户友关系的暴露。为了鼓励用户的社交连接与互动，Facebook 和 Twitter 等流行的在线社交网络近期提供了好友搜索引擎，允许任何个人用户查询另一个用户的好友列表。同时，为了应对日益增长的对友谊隐私关注，社交网络（OSNs）还允许个人用户将整个好友列表设置为“私密”，这在理论上是不允许被任何其他用户搜索的。\n\
  \n然而，即使用户将其好友列表设置为私密，如果其朋友的友谊信息被设置为公开，这些信息仍然可以被其朋友轻易泄露。这个问题被称为“相互影响”（mutual effect）[62]。例如，只要两个用户中的其中一个将好友列表设置为公开，Facebook\
  \ 实际上就会发布两名用户之间的“共同好友”。Wagner [63] 对马克·扎克伯格（Mark Zuckerberg）进行了一项实验。尽管马克将自己的好友列表设置为“私密”，意味着除了他之外没有其他用户可以看到他的友谊，但任何人通过搜索马克与\
  \ Facebook 首席产品官克里斯·考克斯（Chris Cox）之间的“共同好友”，就能看到他们 621 位共同好友的详细列表。马克的友谊隐私遭到了破坏。更重要的是，如果这\
  \ 621 位朋友中的任何一个也将好友列表设置为公开，可能会检索到更多马克的朋友。经过几轮这样的好友搜索，马克的整个好友列表可能会被公开，使得“私密”设置变得毫无意义。\n\
  \n利用“相互影响”来发现私密友谊的各种攻击策略在 [64] 中有所讨论。为了解决相互影响，[62] 提出了一种保护隐私的好友搜索引擎，在该引擎中，除非双方朋友（即该信息的所有者）都同意披露，否则友谊关系将不会发布。这种防御方案可以有效防止个人攻击者发起的隐私推理攻击。然而，[65]\
  \ 最近又提出了一种先进的共谋攻击，通过多个恶意请求者协同发起精心设计的查询序列，受害用户的友谊隐私设置仍可能被破坏。针对友谊隐私攻击与防御的活跃研究仍在快速演变中。\n\
  \n除了个人用户的关系隐私外，包含所有用户之间友谊连接的社交网络拓扑也是隐私攻击的目标。一项研究 [66] 声称，通过在社交图图中随机爬取数据并反复查询用户数据，可以识别出完整的社交图谱。为了防止这种任意爬取，Facebook\
  \ 曾一度将公开列表中暴露的好友数量限制在固定的 8 个 [12]。不久后，一些研究人员注意到，尽管显示的好友数量有限，但显示八个朋友已经足够让第三方爬取数据以估算网络拓扑\
  \ [12]。如何有效保护社交网络拓扑免受先进隐私攻击仍然是一个具有挑战性的问题。\n\n### 11.3.2.3 混合体](#22_Chapter11.xhtml_sec11_3_2_3)\n\
  \n请注意，尽管我们将针对用户个人资料的隐私威胁与针对关系的隐私威胁区分开来，但其中一种隐私泄露可能会导致另一个的泄露。例如，一项研究 [67] 引入了一种通过社交关系来揭露匿名用户身份的攻击。在某项研究中，攻击者只要对用户的友谊模式（即关系隐私）有一定了解，就可以在图谱上映射该模式来重新识别该用户（即个人资料隐私）。\n\
  \n### 11.3.3 用户生成内容（UGC）的隐私保护解决方案](#22_Chapter11.xhtml_sec11_3_3)\n\n#### 11.3.3.1\
  \ 增强用户隐私](#22_Chapter11.xhtml_sec11_3_1)\n\n如上所述，增强用户隐私是保护隐私的第一步。已经做了大量工作来帮助用户理解其隐私设置。例如，在\
  \ [68] 中，作者提出通过不同的视角（包括朋友、朋友以及公众）来帮助用户检查个人资料。此外，[69] 开发了一种“隐私向导”来帮助用户明确其隐私意图。\n\n\
  大量的努力也为了帮助用户提高隐私设置的细粒度。例如，在 [70] 中，开发了一种隐私保护架构，向不同群体披露不同层级的用户隐私信息。在 [69] 中，作者提出了一种个性化隐私设置方法，首先要求用户对社交关系进行分类，然后通过机器学习机制自动化这一过程。\n\
  \n#### 11.3.3.2 数据加密](#22_Chapter11.xhtml_sec11_3_2)\n\n为了处理由不可信的 UGC 提供商导致的潜在隐私泄露，一些研究建议对用户数据进行加密，并仅允许\
  \ UGC 提供商访问密文。例如，[71] 实现了一种基于 Facebook 的系统，帮助用户之间发送加密消息。与其直接基于 UGC 系统开发应用程序，[72]\
  \ 的作者实现了一种 Web 浏览器扩展来实现用户数据加密。\n\n然而，这些基于加密的方案往往牺牲了操作便利性，并受到加密过程带来的高计算成本的影响。\n\n\
  ### 11.3.3.3 针对隐私推理的防御](#22_Chapter11.xhtml_sec11_3)\n\n已经提出了多种隐私保护方法以防止非法用户推断信息。我们根据旨在保护的隐私类型将这些研究分为两类。\n\
  \n第一类隐私保护方法侧重于个人用户数据的匿名化，防止攻击者识别目标用户或推断其敏感属性（即 I 类信息）。该类防御通常在用户创建数据时主动进行。传统的隐私保护技术，如聚类\
  \ [73]、$k$-匿名性 [74]、$l$-多样性 [75]、$t$-接近性 [76] 或差分隐私 [77]， 经常被采用。\n\n第二类方法专门关注如何保护敏感关系（即\
  \ II 类信息），这种关系涉及多个用户 [78]。当此类数据发布给第三方时，已经做了大量工作对用户的敏感关系进行匿名化处理 [79]–88]。这些防御方案使用图聚类-泛化技术或基于图操作的解决方案（即从原始图图中插入/删除节点或边）来实现匿名化。\n\
  \n\n\n\n\n### k-匿名性 (k-Anonymity)\n如上述，攻击者可以从具有重叠属性的多个来源匿名数据进行推理。通过这种方式，他们可以重新识别目标用户并获取敏感信息。Sweeney\
  \ [74] 开发了一种名为 `k-anonymity` 的模型，以保护匿名数据不被识别。研究表明，如果对于每条个人记录，数据集包含至少 `k` 条与该记录无法区分的记录，则数据集满足\
  \ `k-anonymity`（这些 `k` 条记录形成一个等价类）。通过修改数据以满足 `k-anonymity` 可以防止数据持有者通过外部信息对用户进行映射/链接并获取敏感数据。\n\
  \n### l-多样性 (l-Diversity)\n尽管 `k-anonymity` 简单且突出，但它存在缺点，当敏感信息缺乏多样性或攻击者拥有更好的背景信息时，可能会在攻击下变得脆弱。基于\
  \ `k-anonymity` 方法，Machanavajjhala 等 [89] 提出了一种名为 `l-diversity` 的方法来应对上述攻击，该方法为每个等价类维护至少\
  \ `l` 个不同的敏感属性值。通过这样，即使攻击者拥有关于用户的背景信息来重新识别，数据集仍然可以通过 `l-diversity` 实现匿名化。\n\n###\
  \ t-贴近性 (t-Closeness)\n一项研究 [90] 通过引入 `t-closeness` 方法进一步改进了 `l-diversity`，该方法要求一个等价类中敏感属性的值分布要与整个数据集的分布接近。`t-closeness`\
  \ 方法防止攻击者将敏感数据缩小到特定范围，从而使其无法轻易识别用户的隐私信息。\n\n### 差分隐私 (Differential Privacy)\n另一种保护隐私的方法是在\
  \ [91] 中提出的 `differential privacy`。`Differential privacy` 是一种统计统计学方法，可以在最大化保持查询准确性的同时对数据集中的数据进行加密。\n\
  \n## 关系隐私防御解决方案——II 类\n\n#### 基于聚类的方法 (Clustering-Based Approach)\n基于聚类的方法是根据某些属性将数据分为若干组，使得簇内的数据比来自不同簇的数据更相似\
  \ [92]。多种多种算法已被开发并应用于定义类和对数据进行分类。聚类算法可以用于匿名化用户数据，以防止通过友谊、通信或共享活动进行的攻击 [93]，这是通过对关系图中的节点（即个人用户）或边（即关系）进行泛化来实现\
  \ [93]。\n\n#### 图修改方法 (Graph Modification Approach)\n图修改方法是另一种重要方法，它通过向图中添加噪声（例如插入/删除边）。经过此类修改后，节点的模式将与原始模式不同，因此难以被重新识别\
  \ [95–98]。\n\n### 11.3.4 总结\n总而言之，针对用户生成内容（UGC）隐私的攻击与防御的发展是一个动态演化的过程。随着计算能力的增强和在线产生的海量数据，数据变得更加复杂和高维，这导致在未来面临着更多的研究挑战。\n\
  \n## 11.4 信任模型、攻击与防御\n如前所述，在以 UGC 为中心的系统中已经提出了许多与信任相关的挑战。由于确保此类系统的可信度并鼓励用户协作对这些系统至关重要，因此需要建立公平且准确的信任评估模型。然而，此类信任模型的发展具有挑战性，特别是在存在动态演化的攻击的情况下。在本节中，我们将讨论不同的信任评估模型、针对这些模型的攻击以及相应的防御解决方案。\n\
  \n### 11.4.1 确保 UGC 的可信度\n\n#### 11.4.1.1 信任网 (Web-of-Trust)\n在“信任网”的背景下，开发了基于图的模型，其中用户由顶点表示，信任关系由边表示\
  \ [99,100]]。其基本假设是信任可以通过连接或多路径传播。一些简单的数学方法，如最小值、最大值等，已涉及信任的传播。\n\n信任网最初是为了加密应用开发的，如\
  \ `PGP`。这种去中心化的信任模型为中心化的公钥基础设施 (`PKI`) 提供了替代方案。然而，去中心化的信任思想为后来开发的模型提供了基础。\n\n####\
  \ 11.4.1.2 直接/间接信任模型 (Direct/Indirect Trust)\n直接/间接信任模型是一种经典模型，模拟了人类社会的信任建立过程。特别是，如果人\
  \ A 需要决定是否信任 B，如果他熟悉 B，可以直接做出决定；否则参考人 C。同样，在直接/间接信任模型中，受信者的值是通过整合信任者自己的观察（直接信任）以及他建议（间接信任）计算得。\n\
  \n直接/间接信任模型已应用于对点网络 [101]、自组织网络 [102] 以及在线 UGC 网络 [39]。\n\n#### 11.4.1.3 基于贝叶斯的信任模型\
  \ (Bayesian-Based Trust Model)\n由 Thomas Bayes 引入的贝叶斯模型是一种为人知的、广泛应用于统计方法。\n\n贝叶斯模型本质上非常符合信任建立的场景。与将概率解释为特定实验次数内事件发生频率的模型不同，贝叶斯模型根据过去的知识或经验为假设分配一个预定义的概率（即\
  \ `prior`）。每当获得新数据时，它将与先验概率整合以获得更新后的概率（即 `posterior`）。贝叶斯模型背后的哲学——通过新观察动态更新现有知识——符合事实。\n\
  \n在在线 UGC 系统中，基于贝叶斯的模型被用于评估在线物品的可信度。在 [103] 中，开发了一种以二值用户评分为输入的贝叶斯模型，根据用户的先验经验评估在线物品的后验信誉分。贝叶斯信任框架在\
  \ [104,105] 中被提出，用于动态评估在线物品的信任度。特别是，用户评分被认为服从贝塔分布，每当有新的用户评分进入时，概率密度函数就会更新。此外，该模型在\
  \ [106] 中得到了扩展，用于评估用户的可信度，并据此检测提供不评分的恶意用户。\n\n#### 11.4.1.4 Dempster–Shafer 理论 (Dempster–Shafer\
  \ Theory)\n\n\n\n\n\nDempster–Shafer 理论（DST）由 Arthur P. Dempster 和 Glenn Shafer\
  \ 引入，是一种用于整合来自独立源证据以实现某种置信程度的框架 [107]。通过引入“不确定性”概念来表示无知，DST 已被广泛应用于决策过程，特别是在缺乏证据的情况下。具体而言，任何命题集合的概率受置信度（belief，下界）和似信（plausibility，上限）的限制，其中下界和上界之间的差异代表了“不确定性”。此外，为了获得整体置信度，Dempster\
  \ 组合规则通过保留共同的置信度并忽略冲突，整合了来自独立源的证据。\n\nDST 最初被应用于专家系统，即为风险评估和决策支持提供便利的计算机系统。例如，置信函数被用于\
  \ [108] 中对专家系统中的不确定性建模。在 [109] 中，提出了一种改进的用于结合置信的 DST 框架。不确定性的引入使得 DST 更加灵活，并更容易应用于不同的研究领域，如神经网络\
  \ [110]、传感器融合 [111] 等。\n\n在近期关于用户生成内容（UGC）的文献中，如何处理不可信用户提供的大量低质量甚至冲突的信息引起了越来越多的关注。在这种背景下，DST\
  \ 通过对不确定性和不完整信息进行显式推理过程发挥着重要作用。Kim 和 Ahmad [112] 在分析 UGC 的可信度时，引入了信任、不信任和缺乏信心的概念。在他们的研究中，采用\
  \ DST 通过结合信任证据、不信任证据和缺乏证据来衡量对内容提供者的信任水平。在 [113] 中，作者们在分布式信誉系统中开发了一种基于 DST 的恶意代理检测模型。该模型通过获取并整合来自其他代理（即证人）的证词来评估代理的可信度。[114]\
  \ 提出了一种基于 DST 的证人可信度模型，以检测对电子商务卖家的不公平评分。DST 已被 [115]，用于评估在线信誉系统中不同评价者所提供的评分的可信度。\n\
  \n### 11.4.1.5 模糊逻辑 (#22_Chapter11.xhtml_sec11_4_1_5)\n\n如上所述，基于贝叶斯的信任模型和 DST 都是通过在清晰输入值上应用基于概率的模型来计算信任值的。然而，在现实生活中，人类用户通常通过一些模糊值来感知世界。例如，人类对温度的感知通常不是\
  \ 70°C 或 80°C 这样的清晰值，而是冷、正常、热等模糊值。因此，在大多数时候，他们的决策过程可能依赖于一些简单的模糊规则，而不是精确的数学方程。我们使用一个在线权重（WoM）系统示例来演示这种过程。假设一个人类用户检查产品的评分值和数量以做出购买决策。该用户可能根据一些简单的模糊规则获得决策，例如“如果评分值高且评分数量大，我就购买”或“如果评分值中等且评分数量太小，我就不购买”。在这种情况下，4.9\
  \ 和 4.8 这两个评分值可能都被被视为高值，并且在决策过程中没有被显式区分，这与贝叶斯或 DST 的基本假设不符。\n\n由 Zadeh [116] 引入的另一种模型——模糊逻辑已被应用于模拟这种人类用户的模糊决策过程。典型的模糊逻辑决策过程涉及三个步骤。首先，将清晰输入值转换为模糊值。其次，将一些模糊规则（如\
  \ `IF A and B then C`）应用于转换后的模糊输入上，以得出模糊输出。最后，通过去模糊过程将模糊输出转换回清晰的输出值。\n\n模糊逻辑广泛应用于信任评估和决策过程。例如，提出了一种基于模糊逻辑的信任模型\
  \ [117]，该模型考虑了客户领域和特殊性的模糊性和歧义性，供客户评估电子商务平台的可信度。模糊逻辑也被应用于推荐系统，该系统根据用户的社交信任推荐 UGC\
  \ [118]。此类系统可以有效检索高质量的推荐，并显著提高 UGC 的质量。\n\n### 11.4.1.6 基于熵的信任模型 (#22_Chapter11.xhtml_sec11_4_1_6)\n\
  \n信息熵（或香农熵）最初由 Claude Shannon 在 [119] 的信息理论中提出，用于描述一个事件具有多大的不确定性或随机性。通常情况下，熵值越高代表不确定性和随机性越高，表明需要更多的提问或调查才能了解事件的状态。在\
  \ [102] 中，提出了一种基于熵的信任模型，其中信任被视为不确定性的衡量，并用熵量化。基于熵的模型通过通过多源评估可信度来解决了信任级联和传播问题。Wang\
  \ 和 Gui [120] 描述了一种推荐信任模型，其中推荐节点与主体（即信誉节点）之间的信任是基于信息熵计算的。通过评估信任值，节点可以识别恶意节点并避免与其交互。\n\
  \n### 11.4.2 信任相关攻击与防御 (#22_Chapter11.xhtml_sec11_4_2)\n\n随着信任模型的快速发展，利用信任评估方案漏洞的利润驱动型攻击也日益流行。具体而言，这些攻击可能设定以下一个或多个攻击目标：\n\
  \n- 在保持高信任值的同时进行恶意行为以避免惩罚\n- 降低诚实用户的信任值\n- 破坏用户的信任关系\n\n在本节中，将详细讨论一些典型的信任相关攻击及其防御。某些攻击可以由单个恶意用户实施，而另一些必须由一组恶意用户发起。请注意，由于单个用户的影响有限，实践中的大多数攻击是由一组恶意用户执行的，这也称为共谋攻击。在共谋攻击中，具有相同攻击目标的多个恶意\
  \ ID 可能由一个攻击者控制（即女巫攻击），或者彼此积极协作以协调进行恶意行为。\n\n#### 11.4.2.1 新用户攻击 (#22_Chapter11.xhtml_sec11_4_2_1)\n\
  \n一种直接的攻击是新用户攻击，低信任值的恶意用户只需丢弃其原始 ID 并使用新用户 ID 重新加入系统以刷新信任值。在注册新用户 ID 成本极微的系统中，新用户攻击尤为流行且高效。\n\
  \n\n\n\n\n为了防御此类攻击，许多以 UGC（用户生成内容）为中心的系统限制了用户获取在线匿名身份的数量。它们通过将用户身份与 IP 地址绑定 [121]\
  \ 并收取入费 [122] 来增加获取新用户 ID 的成本。此外，信任引导研究表明，应为新成员合理分配信任，例如低初始信任 [123] 和基于多数行为的初始信任\
  \ [124]，这样新 ID 必须通过多次良好行为来积累足够的信任值。\n\n### 11.4.2.2 自推攻击与中伤攻击\n\n在在自推攻击中，多个合谋的恶意用户向其同伴互相正面推荐，旨在提升自身的信任值。另一方面，这些恶意用户也可能进行中伤攻击，即对目标诚实用户散布负面评论，旨在降低他们的信任值。这些攻击对于同行推荐起着关键作用的信任模型特别为有效。\n\
  \n针对自推攻击和中伤攻击的防御需要将推荐信任与行为信任分离。换句话之，每个用户应该有两种信任：评估用户可能进行良好行为概率的“行为信任”，以及评估用户可能提供良好推荐概率的“推荐信任”。因此，推荐信任值低的用户对其他用户决策的影响将非常有限\
  \ [21]。\n\n### 11.4.2.3 开关攻击\n\n在开关攻击中，恶意用户交替进行良好和不良行为，旨在通过不良行为破坏系统，同时通过良好行为将信任值维持在阈值以上以避免受到惩罚。\n\
  \n为了防御此类攻击，应该考虑信任的动态属性。特别是，一个良好的用户账户可能被破解并开始实施不良行为，或者一个胜任的用户账户可能因为环境变化而变得胜任 [21。因此用户的信任值应该根据其最近的行为模式进行动态变化。为了实现这种动态性，许多信任模型通过遗忘机制来控制历史行为的影响。在\
  \ [125] 中，信任计算只考虑最近的行为。然而，这种方案引发了广泛关注，因为良好和不良行为以同样的速度被遗忘，这可能帮助攻击者重新获得声誉。随后引入了衰减因子\
  \ [105] 来逐渐减少很久以前提供的行为权重。此外，系统可以不对称地统计用户的良好行为和不良行为。[21] 中的自适应遗忘机制使得良好的声誉可以通过持续的良好行为建立，但很容易被少数几次不良行为摧毁。\n\
  \n### 11.4.2.4 更高级的攻击\n\n在冲突行为攻击中，恶意用户对不同的诚实同行群体执行不同的行为，以导致他们的推荐之间产生冲突，旨在破坏不同诚实同行群体之间的推荐信任。\n\
  \n为了加强攻击性并避免被发现，聪明的攻击者会让恶意用户 ID 以更复杂的方式协作。在震荡攻击 [125] 中，恶意用户 ID 被分为不同的小组，每个小组扮演着动态不同的角色。在给定时刻，某些小组专注于中伤诚实用户，而另一些小组专注于自推攻击。这些小组的角色会动态切换。在\
  \ [126] 提出的 RepTrap 攻击中，恶意用户 ID 协调地破坏基于 `majority rule` 的信任，通过让某些项目上的多数推荐被视为不诚实的推荐。这些项目被称为“陷阱”。在这种攻击中，恶意用户轮流制造一个接一个的陷阱。通过这种方式，他们可以增加自己的推荐信任，同时降低诚实用户的推荐信任。\n\
  \n为了处理具有复杂合谋的攻击，研究人员从两个新角度提出了防御方案 [38,127]：时间分析，即探索时间域内丰富的用户行为信息（例如，执行不同行为的时间、行为变化的趋势等），以及用户相关性分析，旨在识别合谋恶意用户之间的紧密关系。这些先进的防御方案与大多数早期防御方案兼容，并在针对真实用户数据的测试中显示出良好的前景。\n\
  \n信任相关的攻击与防御之间存在着激烈的竞争。这种竞争无疑将继续演变，并带来新的研究挑战和机遇。\n\n## 11.5 结论\n\n总之，在线上创建和分享内容的灵活性和便利性极大地鼓励了个人用户对当今数字信息的贡献。因此，UGC\
  \ 已成为大数据的主要来源。此类数据为跨不同学科的人类行为相关研究提供了丰富的信息，包括但不限于计算机科学、社会学、经济学和营销学。\n\n尽管具有巨大的价值，但巨大的规模也带来了巨大的挑战。在本章中，我们分析了\
  \ UGC 的 `五维` 特性，并重点讨论了真实性——即数据的可信度。特别是，我们介绍了三个生成和共享 UGC 的主要平台，为这些平台描述了抽象系统模型，并概述了多样化的安全、隐私和信任挑战。在本章的剩余部分，我们详细讨论了\
  \ UGC 的安全、隐私和信任攻击及防御，包括它们的定义、影响、应用场景、优缺点，旨在让读者对这一新兴且快速发展的领域有全面的理解。\n\n#### 参考文献\
