  \ 高竞争下的 `RTS` `YCSB`。\n\n\n## 4.7 总结\n\n\n其次，`DATS` 调度开放嵌套事务。`DATS` 的核心思想是无论冲突对象如何都避免补偿操作并最小化请求抽象锁的数量，提高性能。我们的实现和实验评估表明，`DATS`\
  \ 在低高竞争下分别将开放嵌套事务的吞吐量提升了高达 3.7 倍和 5 倍。\n\n\n## References\n\n2. Nir Shavit and Dan\
