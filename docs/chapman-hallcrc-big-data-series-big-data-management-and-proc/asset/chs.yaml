  \ 位对称密钥所提供的保护级别与 3248 位非对称密钥相同。只要密钥不公开共享，较小的密钥也可以提供预期的安全级别。高级处理器（Intel i7 处理器）大约需要\
  \ 1.7 纳秒来尝试一个块中的一个密钥。按照这种速度，检查非对称方案中可能密钥集 [11] 中的所有密钥将需要大约 $1.3 \\times 10^{12}$\
