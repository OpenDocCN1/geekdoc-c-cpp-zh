  \n\n#### 2.1.1.2 VM 功耗计量的架构](#13_Chapter02.xhtml_sec2_1_1_2)\n\n\n![fig2_2.jpg](img/fig2_2.jpg)\n\
  \n\n### 2.1.2 用于建模的信息采集](#13_Chapter02.xhtml_sec2_1_2)\n\n\n\n\nVM 功耗与硬件资源的使用、`PMCs`\
  \ 以及服务器的功耗密切相关。需要收集的建模信息包含两个部分：物理服务器功耗和资源的分析特征。\n\n收集服务器功耗有两种方法：一种是使用外接连接的 PDU，如\
  \ `WattsUp` 系列 [8] 和 `Scheleifenbauer` 功率计 [9]。数据可以记录在 PDU 内部，也可以通过局域网访问。另一种是使用带有内置功率表的服务器通过提供的应用程序接口（`APIs`）。例如，`Dell\
  \ Power Series` 通过 `Dell Open Management Suite` 为服务器内部每个组件提供全面的功耗信息 [10]。PDU 方便与服务器连接和脱离，但在大规模下是不可行的。相比之下，带有内置功率表的服务器是未来数据中心功率管理的首选，尽管采样过于频繁时可能会导致性能下降。尽管如此，仍有人使用电线将自研的功率计与服务器中的每个组件连接，以测量组件的功耗\
  \ [11]–13]。但这种方法太复杂，无法广泛使用，而 `Dell Series` 已经能够提供主要组件的功率信息。\n用于建模的分析资源主要包括 `CPU`、内存和\
  \ `IO`。为了计算每个 VM 的 `CPU` 使用占比，`Kansal` 等 [14] 建议将每个 VM 跟踪的性能计数器转换为物理处理器的利用率。`Stoess`\
  \ 等 [15] 直接为每个 VM 使用 `PMCs`。`Chen` 等 [16] 使用处理器的时间片来计算每个 VM 对 `CPU` 使用的占比。对于内存，`Y.\
  \ Bao` 等 [17] 认为内存吞吐量可以很好地反映内存功耗的变化，而 `Kansal` 和 `Krishnan` [14,18] 则使用 `LLC` 缺失来分析内存利用率。尽管如此，`Kim`\
  \ 等 [19] 使用内存访问次数来估计内存功耗。对于 `IO`，`Kansal` 建议使用磁盘吞吐量来估计磁盘功耗，而 `Stoess` 使用 `IO` 请求的完成时间。此外，`IBM`\
  \ 在 `Xen` 虚拟机程序层实现了对每个 VM 的 `IO` 吞吐量监控。尽管如此，实现上述建模信息收集方法并非易事。幸运的是，已经有一些在系统级收集资源分析特征的工具，其中一些专门设计用于分析\
  \ VM 设计。Table 2.1 总结了虚拟化平台中最常用的分析工具。\n\n### 表 2.1\n\n| 虚拟化平台 | 工具 |\n| --- | ---\
  \ |\n| | `Xentrace`, `Xentop` |\n| | `Xenanalyze`, `Xenstat` |\n| | `XenMon` |\n\
  | | `Perfmon2` |\n| VMWare | `ReTrace`, `vmkperf` |\n\n\n### 2.1.3 用于 VM 功耗计量的建模方法\n\
  \n\n对于线性模型，`Kansal` 等 [14] 使用 `CPU` 利用率、`LLCM` 和 `IO` 传输时间进行建模。`Krishnan` 等 [18]\
  \ 在其线性模型仅使用 `instructions retired` 和末级缓存 (`LLC`) 命中。`Kim` 等 [19] 考虑 `instructions\
  \ retired` 和 `number of memory accesses`。同样，`Bertran` 等 [22,23] 考虑 `number of active\
  \ cores`。`Chen` 等 [21] 提出了一种使用 `hard disk` 的改进模型。`Bohra` 等 [24] 使用 `PMCs` 来表示组件状态。这些线性模型之间唯一的区别在于\
  \ `component selection`。\n\n\n线性模型是 VM 功耗计量中最常用的方法，因为其实现简单，运行开销低。然而，它假设所有输入变量之间是相互独立的\
  \ [20]。此外，当应用程序行为不断变化时，需要频繁训练参数，这会导致高开销。非线性模型可能在一定范围内提高准确性，但在更新参数时过于复杂。鉴于此，我们针对参考文献\
  \ 7 提出了一种基于树回归的 VM 功耗计量方法。该方法的优点是可以通过具有合适值的最佳选择资源特征将收集的数据集划分为易于建模的部分。\n\n\n回归树的划分取决于数据集的特征，而非人为设定。当该数据集没有更多可选的合适划分特征时，数据集将作为叶子节点添加到树中。在我们的实现中，每个叶子节点只存储在\
  \ particular 叶子数据集上拟合的线性模型的参数。该算法中的 `SplitData` 函数通过资源特征的值将训练数据集划分为两个部分。`BestSplitSelection`\
  \ 函数返回用于划分的最佳 `(feature, value)` 对。如果数据集不适合进一步划分，则返回的特征为 `null`。\n\n\n```text\n\
  1:olderr = Error(D);\n3:besterr = Infinite;\n4:bestfeature = nulls;\n5:bestvalue\
  \ = nulls;\n7:for all feature ∈ {CPU, memory, IO} do\n8:(D1, D2) = SplitData(D,\
  \ feature, d.Rfeature);\n9:if size(D1) < s or size(D2) < s then\n11:end if\n12:newerr\
  \ = Error(D1) + Error(D2);\n13:if newerr < besterr then\n15:bestfeature = feature;\n\
  16:bestvalue = d.Rfeature;\n17:end if\n19:end for\n20:if 0 < olderr – besterr <\
  \ t then\n21:return (null, MakeLeaf(D));\n23:if size(D1) < s or size(D2) < s then\n\
  24:return (null, MakeLeaf(D));\n25:end if\n```\n\n在此算法中，`Error` 函数的计算如下：\n![eq2_5](img/eq2_5.jpg)\n\
  \n`Error(D)` 是训练数据中每个观测值的真实服务器功率与估计功率之间误差的平方和。`MakeLeaf (D)` 返回在 `D` 上拟合的线性模型参数。因此，每个叶子节点都存储建模参数。对于任何新观测值，可以通过反复比较树的特征值来搜索叶子节点。因此，可以使用通过拟合该叶子数据集得到的线性模型来计算该观测值的\
  \ `PEstimated`。由于每个节点的最小大小为 `s`，可以很容易获得 `CreateTree` 的复杂度，即 `O(3*n*log2)`。\n在我们的工作中，用于建模的资源特征分别是\
  \ CPU 利用率、LLCM 和 IO 吞吐量，分别表示为 `RCPU`、`RLLCM` 和 `RIO`。因此，服务器的功耗表示为：\n\n`P[Server]\
  \ = P[Static] + P[Dynamic] = P[Static] + αR[CPU] + βR[LLCM] + γR[IO] + e` (2.6)\n\
  其中 `e` 是模型调整偏差，`α`、`β` 和 `γ` 是构建的回归树中用于输入服务器预测向量 `{RCPU, RLLCM, RIO}` 的搜索叶子节点的参数。当服务器上没有运行虚拟机或应用程序时，可以获得\
  \ `PStatic`。根据服务器功率模型的参数，我们按如下方式计算每个虚拟机的功耗：\n\n`P[VM[i]] = αR[VM[i]]^(CPU) + βR[VM[i]]^(LLCM)\
  \ + γR[VM[i]]^(IO) + e[i]` (2.7)\n其中 `R[VM[i]]^(CPU)`、`R[VM[i]]^(LLCM)` 和 `R[VM[i]]^(IO)`\
  \ 分别表示 `CPU`、LLCM` 和 `IO`。\n\n### 2.1.4 评估方法\n回归树的稳定性取决于误差不波动的程度。我们将稳定性定义为 `S_t_a_b_i_l_t_y\
  \ = δ(Err)` (2.11)。\n\n为了评估，使用了多种基准测试来验证其有效性。表 2.2 列出了最常用的测试。\n#### 表 2.2 基准测试与描述\n\
