  \n\n\n\n\n\n我们今天看到的大数据研究的许多进展，得益于算法、高性能计算、数据库、数据挖掘、机器学习等领域的许多发展。这些发展在本书中得到了讨论。本书还展示了一些仍在演进中的有趣应用和技术，它们将在未来几年内带来一些重大突破。\n\
  \n我相信大数据管理与处理是文献中一项非常有价值的补充。它将成为这一不断发展领域的最新研究来源。本书还为研究人员提供了一个机会，去探索先进技术及其对增强我们复杂研究能力的影响。\n\
  \n我预计大数据管理与处理将受到研究和开发社区的欢迎。对于专注于大数据的研究人员和研究生来说，这本书非常有益，并将成为从业者和应用开发人员非常有用的参考资料。\n\
  \n**Sartaj Sahni**\n佛罗里达大学\n\n\n如今大数据的范围涵盖许多方面，不仅限于主要的计算组件（例如处理器、存储设备和可视化设施），还扩展到与管理和政策相关的更广泛的问题。此外，“大数据”意味着由于需要托管、管理和传输海量数据的压力。近期软件技术的进步改进了对大数据的处理。然而，仍然存在许多由于数据处理负载产生的问题，这要求开发各种软件和硬件解决方案以及新的算法。\n\
  \n本书《大数据管理与处理》寻求为研究人员提供一个机会来探索大数据相关问题及其对新型计算系统设计的影响。这本书是非常及时的，因为整个大数据领域每天都在发生快速变化。本书旨在成为范式、技术和应用的虚拟圆桌，供可能会邀请参加大数据计算会议的许多优秀研究人员参考。当然，这里探讨的主题列表并非详尽，但这里提供的许多结论应当扩展到此处未涵盖的其他计算平台。我们决定限制章节的数量，以便为作者表达他们的想法，使本书保持在单卷范围内。21\
  \ 个章节经过精心挑选，以提供广泛的范围，并减少章节之间的重复。每位贡献者都被要求其章节涵盖回顾材料以及当前进展。此外，对作者的选择是为了选择各自学科的领导者。\n\
  \n\n首先，我们感谢本书贡献者的支持与耐心，感谢评审人员提供的有用意见和建议，这些有助于改进书的早期大纲和材料呈现。此外，我们深谢来自 CRC Press（美国）的\
  \ Randi Cohen 的合作、指导，最重要的是他在定稿本手册时的耐心。最后，我们感谢 CRC Press 制作部门团队在项目许多阶段付出的巨大努力，以及本书制作的及时性。\n\
  \n\n**Kuan-Ching Li** 是教授，在中国广州大学和台湾辅道大学任教。他曾获得 `Nvidia` 的奖项以及来自许多工业公司的支持。他还获得过中国和其他国家大学的客座教授和卓越教授席。他积极参与许多会议和研讨会，担任程序/通用/指导委员会主席以及程序委员会成员，并组织了许多与高性能计算、计算科学与工程相关的会议。\n\
  \nLi 教授技术出版物的主编，包括《国际计算科学与工程期刊》(IJCSE)、《国际嵌入系统期刊》(IJES) 和《国际高性能计算与网络期刊》(IHPCN)，所有这些期刊均由\
  \ Inderscience 出版。他还担任许多期刊的编辑委员会成员和客座。此外，他还是 `CRC Press`、`Springer`、`McGraw-Hill`\
  \ 和 `IGI Global` 出版的几本技术专业书籍的作者或编辑。他感兴趣的主题包括 `GPU/多核计算`、大数据和云。他是 `AAAS` 的成员、`IEEE`\
  \ 的高级会员以及 `IET` 的会士。\n\n\nJiang 教授担任《国际高性能计算与网络期刊》(IHPCN) 的执行编辑。他是《国际大数据智能期刊》(IJBDI)、《科学世界杂志》(TSWJ)、《开放物联网期刊》(OJIOT)\
  \ 和《GSTF 社交计算期刊》(JSC) 的编辑委员会成员，并担任《IEEE 系统期刊》、《国际自机与泛在计算期刊》、《集群计算期刊》以及《科学世界杂志》多个特别刊的客座编辑。他还担任过一些主要会议/研讨会的通用或程序主席（`CSE`、`HPCC`、`ISPA`、`GPC`、`ScaleCom`、`ESCAPE`、`GPU-Cloud`、`FutureTech`、`GPUTA`、`FC`、`SGC`）。他曾作为会议主席或程序委员会成员参与了超过\
