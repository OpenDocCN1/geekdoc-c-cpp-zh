  \ MHz | 32 cores 0.8 V/400 MHz | 32 cores 0.8 V/400 MHz | 32 cores 0.9 V/533 MHz\
  \ |\n| 10 | 48 cores 1.2 V/800 MHz | 1 cores 0.8 V/400 MHz | 32 cores 0.8 V/400\
