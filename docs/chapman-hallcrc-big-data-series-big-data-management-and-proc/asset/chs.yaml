  \ Xeon® Phi™ 协处理器来加速反向传播（BP）神经网络，从而获得更好的数据处理性能。此外，我们还探索了多核平台上的动态电压和频率缩放（DVFS），以便在需要考虑节电/节能的情况下时，寻找合适的配置来辅助大数据的处理。\n\
  \n## 8.1 引言\n\n在过去的 20 年里，各个领域的数据量都呈大规模增长。根据国际数据公司（IDC，大数据及其研究领域最具影响力的领导者之一）在 2013\
  \ 年发布的一份报告，全球创建和复制的数据总量为 4.4 艾字节（ZB）。这一数字每 2 年翻倍，到 2020 年，数字宇宙——即我们每年创建和复制的数据——将达到\
  \ 44 ZB 或 440 万亿吉字节（IDC 2014），如图 8.1 所示。\n\n![fig8_1.jpg](img/fig8_1.jpg)\n\n图 8.1\
  \ 数据大爆炸。\n\n在全球数据爆炸式增长的背景下，“大数据”这一术语主要用于描述巨大的数据集。与传统数据集相比，大数据通常包含大量的非结构化数据，需要更多的实时分析（Chen\
  \ 等人，2014）。虽然“大数据”一词本身相对新颖，但为了分析而收集和存储大量信息的行为已经历史悠久。这一概念在 2000 年初开始获得动力，当时行业分析师道格·兰尼（Doug\
  \ Laney）将现在主流的大数据定义总结为“三个 V”（Laney 2001）。在“3V”模型中，数量（Volume）意味着随着海量数据的生成和收集，数据规模变得越来越大；速度（Velocity）意味着大数据的及时性，具体而言，数据收集和分析必须快速及时地进行，以最大化地利用大数据的商业价值；多样性（Variety）指的是数据的各种类型，包括半结构化和非结构化数据（如音频、视频、Web\
  \ 页面和文本），以及传统的结构化数据。\n\n2011 年，IDC 在该定义中增加了另一个 V（价值，Value），形成了“4V”模型。它被描述为：“大数据技术描述了一种新型技术和架构，旨在通过实现高速的捕获、发现和/或分析，从海量且多样化的数据中以经济效益的方式提取价值”（Gantz\
  \ and Reinsel 2011）。\n\n## 8.2 反向传播神经网络\n\n在数据处理方面，人们希望发现数据之间有意义的关系。传统的分析方法难以发现大数据的底层结构，因为由于数据的“4V”模型，实施全面的分析是不可行的。此外，异构数据源之间巨大的潜在关联和关系范围，使得任何分析师都不可能测试所有的假设并搜索出数据中隐藏的所有机会（Skytree\
  \ 2015）。因此，机器学习成为处理大数据的研究热点。\n\n机器学习演变自人工智能中的模式识别和计算学习理论。与传统方法相比，它侧重于研究和构建可以从数据中学习并对数据进行预测的算法（Kohavi\
  \ and Provost 1998; Werbos 1994）。机器学习是数据驱动的，很少依赖人类指导。此外，与传统方法不同，机器学习随着数据集的增加而蓬勃（Skytree\
  \ 2015）。所有这些因素使其成为分析大数据的理想工具。\n\n反向传播（BP）神经网络是一种常用的机器学习方法。它通常被认为一种监督学习方法，可以应用于分类和回归问题。BP\
  \ 神经网络可以使用梯度下降算法学习其权重和偏置。对于每个样本，BP 神经网络都需要一个期望的输出以便计算损失函数梯度。\n\nBP 神经网络需要计算损失函数梯度（我们称之为“误差”）。如图\
  \ 8.2\n\n图 8.2 具有两个输入、一个输出和一个隐藏层的典型 BP 神经网络架构。\n\n尽管 BP 神经网络是一种相对简单的神经网络，但它是许多高级机器学习方法的基础。它在许多应用中仍广泛使用。例如，科学家已使用大量的水文数据集训练\
  \ BP 神经网络，以获得实时的稳健水文预测（Wan 等，2015）。此外，研究人员提出了基于 BP 神经网络 PSO 算法的电缆接头导体（Zhou 等，2015）。BP\
  \ 神经网络也用于智能电网等新兴领域（Rui 等，2014）。\n\n## 8.3 高性能计算\n\n由于大数据的“4V”模型，机器学习方法引发的计算可能是密集型的。因此，处理大数据的执行速度很容易成为瓶颈。高性能计算将克服这一障碍的有效方法。高性能计算是指利用并行处理来高效、可靠和准确地运行程序。此外，在某些场景下需要降低功耗/节能，特别是当我们想要用高性能计算处理大数据时。幸运的是，现代微处理器通常配备了动态电压和频率缩放（DVFS）能力。DVFS\
  \ 允许通过改变计算元件的电压和频率，以更低的功耗/能量完成必要的任务。\n\n由于 BP 神经网络的训练过程会非常耗时且计算密集，在这项工作中，我们在先进的并行计算平台——英特尔单芯片云计算机（SCC）和英特尔\
  \ Xeon® Phi™ 协处理器上实现了 BP 神经网络的训练过程。我们的研究重点是如何利用多核平台加速 BP 神经网络的计算。我们还研究了如何利用 DVFS\
  \ 在多核平台上进行功率/节能感知型的 BP 神经网络计算。\n\n\n\n作为一个示例研究，在我们的实验中，我们尝试训练 BP 神经网络来学习 SCC 和 Intel®\
  \ Xeon® Phi™ 平台上的加法运算。我们还训练了 BP 神经网络来学习 Intel® Xeon® Phi™ 平台上的乘法运算。我们尝试仅根据提供的数据来训练\
  \ BP 神经网络学习加法和乘法运算。为此目的构建的 BP 神经网络有两个输入变量、一个隐藏层、一个输出层和一个输出变量。训练样本的数量设置为 `9600`。由于有两个输入变量，根据我们的观察，隐藏层中过多的神经元（节点）会导致过拟合。因此，对于\
  \ Intel® SCC，我们在隐藏层中使用的节点数分别分别为 5、10 和 20。对于 Intel® Xeon® Phi™，我们选择在隐藏层中采用 `10`\
  \ 个节点。我们将训练迭代的上限设置为 `20,000`。我们假设当平均误差小于 `0.001` 时，神经网络的性能是满意的。因此，无论是训练迭代次数达到 `20,000`\
  \ 次，还是平均误差小于 `0.001`，训练都会停止。有两种广泛使用的并行方法：任务并行和数据并行。在任务并行中，各种任务被划分到不同的核心之间，以执行解决问题的计算。在数据并行中，解决问题时使用的数据被划分到不同的核心之间，每个核心对其部分数据执行或程度相似的操作（Pacheco\
  \ 2011）。在我们的实验中，采用了数据并行。\n\n## 8.5 SCC 上的并行 BP 神经网络\n\nSCC 实验处理器是由 Intel Labs 创建的\
  \ 48 核概念验证机，作为许多核软件研究的平台（Intel 2010）。SCC 包含 48 个 Pentium™ 类 IA-32 核心，分布在 `6 × 4`\
  \ 的 2D-mesh 瓦片化核心集群网络上，边缘具有高速 I/O（Howard et al. 2010）。每个瓦片（tile）由两个核心和一个由两个核心共享的路由器组成。SCC\
  \ 芯片上的 48 个核心被划分为 6 个电压域和 24 个频率域，其中路由器和其他外设设备位于独立的电压和频率域中。如图 8.3 所示，每四个瓦片共享一个电源域，编程人员可以更改一个电压域内所有核心的电压。同一瓦片上的两个核心在频率域内也可以自己的频率。SCC\
  \ 还提供了直接在应用程序级别操作电压和频率的能力，这支持了对功率/能量感知计算应用的研究。\n\n![fig8_3.jpg](img/fig8_3.jpg)\n\
  \n图 8.3 SCC 架构和瓦片内部结构。（来自 Torres et al. 2015. Intel SCC 上虹膜匹配算法的自动调优辅助功率感知研究。Journal\
  \ of Signal Processing Systems, 80(3): 261–276。）\n\n由于 SCC 配备了 DVFS（动态电压频率调整）能力，除了执行时间，还可以测量或计算多个与功率/能量相关的指标，包括功耗、加速比功率（PPS）、能耗和能量延迟积（EDP）。执行时间包含了核心之间的通信时间，因为\
  \ SCC 遵循消息传递编程模型。功耗通过仅测量 SCC 芯片的电压和电流获得。在我们的实验中，去除了测量功耗所花费的开销时间。功率读取不包括片外的 DDR DIMM。PPS\
  \ 通过功耗除以随着核心数增加而实现的加速比计算得出。此外，能量和 EDP 是根据我们获得的功率和执行时间读取值计算的。在 SCC 上，使用的核心数分别为 1,\
  \ 2, 4, 8, 16, 32 和 48。我们实现了三个电压频率设置：高（1.2 V/800 MHz）、中（0.9 V/533 MHz）和低（0.8 V/400\
  \ MHz）。\n\n### 8.5.1 执行时间\n\n图 8.4 反映了执行时间（秒）与核心数在对数对数坐标系下的关系，同时我们改变了 BP 神经网络隐藏层中节点数量。结果显示，对于固定的隐藏层节点数，首先，随着用于计算的核心数从\
  \ 1 增加到 32，执行时间随之减少；其次，当核心数固定时，频率越高，执行程序所需的时间越短。总体，高电压频率设置（1.2 V/800 MHz）为我们的计算密集型基准测试提供了最佳性能。\n\
  \n![fig8_4.jpg](img/fig8_4.jpg)\n\n图 8.4 执行时间与核心数的关系。\n\n另一个有趣的观察是，随着隐藏层节点数的减少，当核心数从\
  \ 32 增加到 48 时，执行时间的减少速率变慢。当隐藏层节点数为 5 时，执行时间甚至随着核心数从 32 增加到 48 而增加。在这种情况下，通过并行方式分配负载节省的时间无法补偿传递带来的通信开销。\n\
  \n### 8.5.2 功耗\n\n实验结果显示，无论隐藏层节点数是 5、10 还是 20，功耗（瓦特）都是相同的，这意味着隐藏层节点数对功率假设没有影响。因此，这里展示了五个节点的数据。图\
  \ 8.5 反映了功耗（瓦特）与核心数在对数对数坐标系下的关系。随着核心数的增加，功耗的增长速度更快，因为涉及到更多的电源域。总体，低电压频率设置（0.8 V/400\
  \ MHz）为我们的基准测试提供了最佳功率读取，但是以牺牲性能为代价。\n\n![fig8_5.jpg](img/fig8_5.jpg)\n\n图 8.5 功耗与核心数的关系。\n\
  \n### 8.5.3 加速比功率\n\nPPS 被提出作为衡量能量效率的指标（Mair et al. 2010）。该指标给出了实现特定加速比所需的功率。因此，希望较小的\
  \ PPS 值。图 8.6 反映了 PPS（瓦特）与核心数在对数对数坐标系下的关系。当隐藏层节点数固定时，配置（0.8 V/400 MHz）为所有核心数量提供了最佳\
  \ PPS 结果。所以当我们增加核心数时，使用低电压频率设置来实现特定的加速比更节能。\n\n![fig8_6.jpg](img/fig8_6.jpg)\n\n\
  图 8.6 PPS 与核心数的关系。\n\n### 8.5.4 能量消耗\n\n图 8.7 反映了能量消耗（焦耳）与核心数在对数对数坐标系下的关系，同时我们改变了隐藏层中节点数量。可以看到，随着隐藏层节点数的增加，最小能量消耗将向核心数增加的方向移动。如上所述，神经网络隐藏层节点数对功率假设没有影响。因此，对于\
  \ BP 神经网络，能量受执行时间的影响更大。每个配置下能量消耗曲线与执行时间之间的相似性也支持了这一观点。\n\n![fig8_7.jpg](img/fig8_7.jpg)\n\
  \n图 8.7 能量与核心数的关系。\n\n\n\n\n## 8.5.5 能量延迟乘积 (Energy-Delay Product)\n\n`Figure 8.8`\
  \ 反映了在对数尺度下 EDP（单位为焦耳秒）与核心数之间的关系，同时改变了隐藏层中节点数。实验结果显示，不同隐藏层节点数量的 EDP 曲线形状与能量曲线的形状非常相似。EDP\
  \ 的最低点移动方向与能量最低点的移动方向相同。不同之处在于，当节点数和核心数恒定时定时，`0.9 V/533 Hz` 配置下的 `EDP` 最小，而 `0.8\
  \ V/400 MHz` 配置下的 `EDP` 最大，尽管 `0.9 V/533 Hz` 和 `1.2 V/800 MHz` 配置之间的 `EDP` 差异非常小。总的来说，当我们同时考虑能量和用户体验（通过系统完成任务的响应时间衡量）时，中等电压和频率配置为提供了两者的优势。\n\
  \n![fig8_8.jpg](img/fig8_8.jpg)\n\n图 8.8 EDP 与核心数之间的关系。\n\n## 8.5.6 各指标的最佳配置\n\n\
  `Table 8.1` 汇总了每个指标的最佳配置（核心数和电压/频率）。根据用户的特定需求，可以采用合适的配置。\n\n表 8.1\n\n各指标的最佳配置\n\n\
