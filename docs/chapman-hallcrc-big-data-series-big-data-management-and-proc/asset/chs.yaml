  \n## 12.8 总结与结论\n\n## 参考文献\n\n### 摘要\n\n物联网（IoT）应用的部署日益增加，对处理物联网传感器产生的海量流数据提出了更高要求。在应对物联网应用的数据处理需求时，通用的实时大数据处理面临着多项新挑战。在本章中，我们详细描述了物联网数据处理应用面临的特定挑战/问题，以及如何利用实时大数据处理和各种相关技术范式来缓解这些问题。本章阐明了关键领域，如维持实时响应、处理海量数据、不同类型的数据分析，以及物联网背景下实时数据处理的信息安全方面。我们观察到，尽管已经提出并实现了多种数据流处理系统和架构，但极少（如果没有的话）专门针对物联网的流处理系统。\n\
  \n## 12.1 引言\n\n物联网（IoT）应用的部署日益增加，对处理物联网传感器产生的海量流数据提出了更高要求。在应对物联网应用的数据处理需求时，通用的实时大数据处理面临着多项新挑战。在本章中，我们详细描述了物联网数据处理应用面临的特定挑战/问题，以及如何利用实时大数据处理和各种相关技术范式来缓解这些问题。本章阐明了关键领域，如维持实时响应、处理海量数据、不同类型的数据分析，以及物联网背景下实时数据处理的信息安全方面。我们观察到，尽管已经提出并实现了多种数据流处理系统和架构，但极少（如果没有的话）专门针对物联网的流处理系统。\n\
  \n## 12.2 挑战与技术\n\n物联网（IoT）应用的部署日益增加，对处理物联网传感器产生的海量流数据提出了更高要求。在应对物联网应用的数据处理需求时，通用的实时大数据处理面临着多项新挑战。在本章中，我们详细描述了物联网数据处理应用面临的特定挑战/问题，以及如何利用实时大数据处理和各种相关技术范式来缓解这些问题。本章阐明了关键领域，如维持实时响应、处理海量数据、不同类型的数据分析，以及物联网背景下实时数据处理的信息安全方面。我们观察到，尽管已经提出并实现了多种数据流处理系统和架构，但极少（如果没有的话）专门针对物联网的流处理系统。\n\
  \n物联网是指连接一组设备（其传感器和执行器）和系统，以便在用户之间创建无缝交互。估计到 2020 年，将有 200 亿个支持物联网的设备应用于广泛行业。思科咨询服务估计，在\
  \ 2013 年至 2022 年间，物联网将为私营和公共部门创造超过 8 万亿美元的价值。因此，物联网为业务流程中的价值创造提供了巨大机会，例如许多手动操作流程的自动化，这使得创建全新的产品和服务成为可能。以下是一些关键用例：\n\
  \n1. 预测性维护\n2. 移动“物体”追踪并告警\n3. 改进物网络物流\n4. 智能健康与家庭护理\n5. 个人追踪与健康（例如 Fitbit）\n6.\
  \ 运动分析\n7. 安全与监控，例如监控、安全、资产追踪、野生动物追踪、森林追踪，通过家庭监控监控健康和孩子，宠物和孩子的边界检查\n8. 计算并根据用户上下文采取行动（精准广告）\n\
  9. 交通：火车、公交车\n10. 能源效率（负载预测、智能照明、加热）\n11. 智能农业（基于水分水平的排水、害虫控制、畜牧管理）与天气等其他数据源相关\n\
  12. 智能零售与餐厅：商店监控、供应链、物流、店内存客户追踪\n13. 智能建筑（电力、安全、预防性维护、暖通空调）\n14. 智能物流、供应链和运营（例如：航空、酒店业）\n\
  15. 金融服务、智能银行、基于使用的保险、更精准的数据，以及通过更好的数据进行欺诈检测\n16. 智能城市（例如：废物管理、交通、污染监测、停车、城市规划、智能停车、路税）\n\
  \n物联网用例的分类如图 12.1 所示。该分类法被分为四个领域：个人、家庭、社会和星球。尽管它们被分为这四大类，但某些用例之间存在重叠。例如，家庭冰箱将连接到供应链管理系统，当耗品用完时会自动订购。\n\
  \n![fig12_1.jpg](img/fig12_1.jpg)\n\n图 12.1 物联网用例的分类法。\n\n\n\n\n\n实时分析是以低延迟值对数据进行在线处理。当系统接收的数据速度和量非常大，且数据处理类型大部分为一次性操作时，实时分析变得至关重要。例如，根据客户状态（例如，被列入黑名单）过滤通话详细记录（CDR）[6]、射天文学\
  \ [7]、道路交通管理 [8,9] 等都是此类应用的示例。例如，LOFAR 分布在 10,000 平方公里内的 77 个天线站可能会产生每月 37 Tbit/s\
  \ 的数据 [7]。在这样的情况下，数据处理系统应该能够处理如此巨大的数据速率，而实时数据处理其中起着至关的作用。\n\n由于几个原因，实时处理对于物联网（IoT）至关重要。首先，在典型的物联网安装中可能会连接数百万个传感器，它们产生海量数据。此类传感器产生的大数据并不一定需要存储。因此，实时处理技术的使用非常契合这种数据处理场景，因为数据在到达实时数据处理系统时就会被处理。其次，物联网安装中的设备需要及时响应。例如，心脏病患者起搏器发出的警告信息需要在几秒内到达急救团队，以便提供快速的急救。许多著名的物联网软件平台开发时就具备了实时数据处理的能力，这是由于实时数据处理在物联网数据分析中的重要性（示例请参见表\
  \ 12.1）。\n\n### 表 12.1：不同物联网软件平台使用的分析类型及用于数据采集的协议对比\n\n| 物联网软件平台 | 分析类型 | 安全性 |\
