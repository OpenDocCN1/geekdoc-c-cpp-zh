  \n## 参考文献\n\n### 摘要\n\n在大数据时代，传统的数据库系统由于限制无法有效处理大数据。人们正在寻找新的方法。在 Google 发布其 MapReduce\
  \ 工作后，Hadoop（一种开源工具）已成为事实上的标准。然而，1.0  Hadoop 只支持一种计算模型，这是不够的。\n\n现在 Hadoop 已演进到\
  \ 2.0，它采用了全新的架构，分离了资源管理和作业调度。除了 MapReduce 之外，Hadoop 2.0 还支持其他计算模型，例如 Hortonworks\
  \ 的工作，以提供更低的延迟。\n\n与此同时，加州大学 AMP 实验室推出了 Spark，它现在引起了学术界和工业界的广泛关注。Spark 生态系统包括核心及其周围四个主要组件，包括用于结构化数据的\
  \ Spark SQL、用于流处理的 Spark Streaming、用于机器学习的以及用于图数据的 GraphX。本质上，Spark 和 Hadoop 提供的功能相似，但在某些应用场景下，Spark\
  \ 优于 Hadoop。\n\n在本章中，我们分析了不同技术的局限性以及持续创新背后的业务需求。我们还试图指出数据库研究社区和行业应该学习的一些教训。\n\n\n\
  \n\n\n许多研究人员致力于开发运行中的数据库管理系统，这些系统完全基于新的关系模型。其中两项工作非常突出：一个是加利福尼亚大学伯克利分校的 `Ingres`，另一个是\
  \ IBM 的 `System R`。1974 年，IBM 的工程师为 `System R` 发明了一种名为 `SEQUEL`（结构英语查询语言）的查询语言，它是`SQL`语言的前身。此外，研究人员还为\
  \ `RDBMS` 开发了存储方法、索引技术、查询优化技术、事务处理方法和数据库恢复技术。这些方法使 `RDBMS` 成为各种在线事务处理（`OLTP`）应用高效且可靠的数据引擎。\n\
  \n从 20 世纪 7 年代至今，`RDBMS` 已成为市场上的主导数据管理技术。`RDBMSs` 已应用于银行、航空和政府机构等行业。关键数据存储在 `RDBMS`\
  \ 中，各种应用程序在 `RDBMS` 上运行，以支持与我们日常生活相关的业务活动。\n\n随着收集的数据越来越多，人们越来越对分析数据感兴趣，以发现有关发生过什么以及将要发生什么的价值信息，从而进行决策。`RDBMSs`\
  \ 也是此类决策支持系统的底层引擎，运行在线分析处理（`OLAP`）和数据挖掘应用。\n\n### 10.1.2 大数据时代\n\n现在是大数据时代。根据维基百科\
  \ [1]，大数据被定义为“规模巨大且复杂的数据集合，导致难以使用现有的数据库管理工具或传统数据处理应用程序进行处理”。数据来自各种来源，包括电子商务网站、物联网（`IOT`）传感器、科学实验观测结果以及网络上的用户生成内容。例如，欧洲核子研究中心\
  \ `LHC`（大型对撞机）的一次实验产生的数据量可以轻松达到 `PB`（拍字节）级。多种力量推动了大数据的出现；其中之一是存储价格越来越低，使人们能够以极低的成本收集越来越多的数据。在上述科学场景中，人们需要以更细的粒度收集数据，以发现内部一些有趣的模式。\n\
  \n大数据具有几个特征；大多数人认可的“三个 V”是量（Volume）、速度（Velocity）和多样性（Variety）。量是数据集的主要特征。数据量之大，以至于无法通过传统的数据库技术高效处理。速度指的是数据生成速度很快的场景；我们需要一些高效的工具来及时处理数据，否则数据将丢失。多样性意味着数据类型，包括结构化数据（如关系表）、非结构化数据（如文本、音频和视频）以及半结构化数据（如\
  \ `XML` 文件）。\n\n### 10.1.3 RDBMS 处理大数据的局限性\n\n`RDBMS` 尚未准备好处理大数据。它设计为运行在可靠的硬件上，通常是专用高端服务器的形式。为了处理大数据，我们可以通过增加更多的\
  \ `CPUs`、内存、存储设备和网络带宽来扩展（scale up）此类高端服务器。然而，这存在上限且成本高昂。\n\n另一种方法是通过将数据和处理分布到集群上来扩展系统（scale\
  \ out），该集群由数百到数千个并不昂贵的廉价服务器组成。当负载变重时，我们可以向集群中添加更多节点以获得满意的性能。大数据需要数千甚至数万个节点来处理。到目前为止，还没有\
  \ `RDBMS` 运行在超过 1000 个节点的集群上。由于 `RDBMS` 的可扩展性有限，人们正在寻找新方法。\n\n### 10.2 Hadoop 1.0\
  \ 生态系统\n\n#### 10.2.1 Hadoop 1.0 生态系统简介\n\n搜索是 Google 早期的主要业务。搜索引擎爬取全球网以获取网页并索引页面，以便于稍后用户搜索请求。网页数据集非常巨大。在几台大型服务器（如主机）上存储和处理该数据集很容易。Google\
  \ 使用廉价服务器集群完成这项工作，并设计了 `GFS`（Google 文件系统）和 `MapReduce` 来索引网页。\n\n`GFS` 是运行在大型集群上的分布式文件系统。数据被组织成大块（64\
  \ 或 128 `MB`）。每个块有三个副本，存储在不同的节点上以提供容错能力。`MapReduce` 是运行在 `GFS` 之上的计算模型。\n\n`MapReduce`\
  \ 运行时负责作业调度、任务分配、故障恢复等。用户只需提供两个函数，即 `Map` 函数和 `Reduce` 函数。`MapReduce` 的输入是一个 `<key1,\
  \ value1>` 键值对列表，`Map` 函数应用于每个键值对以计算中间键值对 `<key2, value2>`。中间键值对根据键的相等性分组，即 `<key2,\
  \ list<value2>>`。对于每个 `key2`，`Reduce` 函数应用于 `value2` 列表，并生成聚合结果。用户编写 `MapReduce`\
  \ 程序，通过设计不同的 `Map` 函数和 `Reduce` 函数来执行各种数据处理工作。通用的 `MapReduce` 计算模型如图 10.1\n\n图 10.1\
  \ MapReduce 计算模型。\n\nHadoop 是 Doug Cutting 创立的 Apache 项目。Hadoop 软件栈是 MapReduce 技术的开源实现。在下文中，我们将使用\
  \ MapReduce 来指代 MapReduce 计算模型，而不是特指 Google 的专利技术。\n\n在 Hadoop 中，`HDFS`（Hadoop 分布式文件系统）是\
  \ `GFS` 的对应物。`HDFS` 采用主从架构。`NameNode` 充主，`DataNodes` 是工作节点。`NameNode` 负责元数据的管理（例如数据块的位置），`DataNodes`\
  \ 负责数据块的存储。\n\n`MapReduce` 运行时运行在 `HDFS` 上，包含两个主要组件，即 `JobTracker` 和 `TaskTrackers`，分别运行在\
  \ `NameNode` 和 `DataNodes` 上。用户编写 MapReduce 程序并提交给 `JobTracker`。\n\n`JobTracker`\
  \ 通过将 map 任务和 reduce 任务分配给 `TaskTrackers` 来协调 MapReduce 作业执行。它足够智能，可以将任务分配给靠近数据的\
  \ `TaskTrackers`。图 10.2 显示了 MapReduce 运行时的组件及其关系。`JobTracker`以及它运行的节点）也被称为主节点。`TaskTrackers`以及它们运行的节点）也被称为工作节点。\n\
  \n![fig10_2.jpg](img/fig10_2.jpg)\n\n图 10.2 MapReduce 的执行运行时。\n\n一个 MapReduce 作业分阶段执行：Map\
  \ 阶段和 Reduce 阶段。MapReduce 作业的详细执行流如下：\n\n1. 要处理的数据集（即输入文件）被加载到分布式文件系统中。在加载时，文件被切分为多个数据块，典型大小为\
  \ 64 或 128 `MB`。每个块由底层分布式文件系统复制三次到不同的节点上。\n\n2. `JobTracker` 从某些客户端处接收一个 MapReduce\
  \ 作业，通过将 map 任务和 reduce 任务分配到 `TaskTrackers` 上来执行该作业，并监控 `TaskTrackers` 的状态。假设有\
  \ `M` 个 map 任务和 `R` 个 reduce 任务需要分配。\n\n\n\n\n\n### 3. 随后，每个块被分配给一个映射器（mapper），即被分配\
  \ map 任务的工人。每个工人处理输入分片（split）的内容，从输入数据中生成键值对，并将这些对逐个传递给用户定义的 `Map` 函数。生成的中间键值对缓冲在内存中，并定期写入本地磁盘。中间结果的持久化提供了良好的容错性特性。\n\
  \n映射器产生的中间输出在本地进行排序，以将具有相同键的键值对分组，本地磁盘上的文件被组织成 `R` 个区域，每个区域对应一个键。`R` 个区域的位置被发送到主节点（master），以便稍后转发给\
  \ reduce 工人。\n\n### 4. 当所有 Map 任务完成后，`JobTracker` 将 Reduce 任务分配给工人。中间数据被洗牌（shuffle）到\
  \ reducers。如前所述，`Map` 函数的输出已经过分区并存储在本地磁盘中；reducers 只需使用主节点通知的位置，从不同节点拉取 `Map` 函数输出的特定分区。reducers\
  \ 通过中间键（`key2`）合并中间结果，并将相同键的所有值分组在一起。然后，每个 reducer 对 `key2` 的值应用 `Reduce` 函数以生成一些聚合结果。reducers\
  \ 的输出被存储在分布式系统中。\n\n### 5. 当所有 map 任务和 reduce 任务都完成后，`JobTracker` 将控制权返回给用户程序，用户程序可以访问分布式系统中的最终结果。\n\
  \n为了更清晰地描述 MapReduce 计算模型，下面展示了常用的词频计数（word count）示例。词频计数程序用于统计加载到分布式系统的大文件中每个不同单词出现的次数。\n\
  \n该作业的 `Map` 函数用于为它遇到的每个单词生成 `<word,1>`，如图 10.3 所示。`Reduce` 函数用于根据 Mappers 的输出计算每个单词的出现次数，如图\
  \ 10.4](#21_Chapter10.xhtml_fig10_4) 所示。\n\n![fig10_3.jpg](img/fig10_3.jpg)\n\n\
  图 10.3 用于词频计数的 Map 函数。\n\n![fig10_4.jpg](img/fig10_4.jpg)\n\n图 10.4 用于词频计数的 Reduce\
  \ 函数。\n\n词频计数程序的执行流程如图 10.5](#21_Chapter10.xhtml_fig10_5) 所示。MapReduce 运行时接收到词频计数程序后，它会在工人上为文件分片启动\
  \ mappers。map 函数扫描对应的数据块，并为块中的每个单词生成 `<word,1>`，中间结果存储在工人节点的本地磁盘中。之后，MapReduce 运行时启动\
  \ Reducers，从中间结果中拉取数据。reducers 通过排序和计数 `<word,1>` 列表来统计每个单词的次数。\n\n![fig10_5.jpg](img/fig10_5.jpg)\n\
  \n图 10.5 词频计数程序的执行流程。\n\n### 10.2.2 Hadoop 1.0 的生态系统 (#21_Chapter10.xhtml_sec10_2_2)\n\
  \n基于 HDFS 和 MapReduce 计算模型，若干工具共同构成了整个 Hadoop 生态系统（图 10.6）。这些工具简要介绍如下。\n\n![fig10_6.jpg](img/fig10_6.jpg)\n\
  \n图 10.6 Apache Hadoop 生态系统。\n\n**Hive** 是基于 Hadoop 的数据仓库。它为用户提供了类似 SQL 的查询语言 `HQL`（Hive\
  \ 查询语言），供用户查询数据。这些查询被翻译成 MapReduce 作业并在 Hadoop 集群上运行。\n\n**HBase** 是 Hadoop 平台上\
  \ Google Big Table 的对应产品。它是一个用于结构化数据处理的可扩展、高可靠、高性能的分布式数据库。它使用列族数据模型，与 Big Table\
  \ 使用的模型相似。HBase 支持更新表中的某行数据，用于数据服务应用程序。\n\n**Pig** 实现了 `Pig Latin` 过程脚本语言。用 `Pig\
  \ Latin` 编写的程序被翻译成 MapReduce 作业并在 Hadoop 平台上运行。某些数据处理工作（如 `join` 操作）以 MapReduce\
  \ 作业的形式来写并不直观。`Pig Latin` 提供了如 `join` 等原语，便于编写复杂的数据处理程序。与 Hive 一样，Pig 也用于离线数据分析。两者的区别在于\
  \ Hive 使用声明式语言 `HQL`，而 Pig 使用过程化语言 `Pig Latin`。\n\n**Flume** 是一个高度可扩展、高可靠、高容错的分布式日志数据收集系统。它用于从大量服务器汇海日志数据到一个大数据平台。Flume\
  \ 提供了一些简单的日志数据处理功能，如过滤和格式转换。Flume 可以配置为将日志数据写入各种数据汇（目的地）。\n\n**Sqoop** 是“SQL to\
  \ Hadoop”的缩写。它是一个从关系型数据库或其他结构化数据源移动数据到 Hadoop 的工具。例如，`Sqoop` 可以将 `MySQL` 数据库的数据导入\
  \ Hadoop 平台；数据可以导入原始 HDFS 文件、`Hive` 表或 `HBase` 表。，`Sqoop` 也可以将 Hadoop 数据导出到 `MySQL`\
  \ 数据库。导入/导出程序被写成 MapReduce 程序，可以充分利用并行处理能力和高容错性。\n\n**Mahout** 是 Hadoop 平台上的机器学习软件包。它旨在提供在大集群上运行的可扩展机器学习算法，以分析大数据。经典的数据挖掘和机器学习算法，如聚类、分类、协同过滤（用于推荐系统）和频繁项挖掘均已实现。\n\
  \n**Oozie** 是一个管理 Apache Hadoop 作业的工作流调度系统。Oozie 支持多种类型的 Hadoop 作业，如 MapReduce 作业、pig\
  \ 脚本、Hive 查询以及 `Sqoop` 导入作业。Oozie 工作流由时间（频率）或数据可用性触发。\n\n**Zookeeper** 是 Google\
  \ `Chubby` 的开源实现。`Chubby` 是一个分布式锁服务。大多数分布式应用通用服务，如统一命名服务、状态同步服务、配置数据管理以及集群管理（包括节点状态和数据变更通知）。这些服务很难实现和调试。使用\
  \ zookeeper，人们不需要重复造轮子。通过将此类功能交给 Zookeeper，降低了整个分布式系统的复杂度。在由主节点和多个从节点组成的分布式系统中，主节点可能是单点故障。通过用由\
  \ Zookeeper 管理的少量节点来替换主节点，我们可以减少此类故障。\n\n\n\n\n\n自 `Hadoop/MapReduce` 出现以来，工业界和学术界的人员从许多方面改进了\
  \ `Hadoop/MapReduce` [4–6]，包括：（1) 存储布局和数据放置优化、数据倾斜处理、索引支持和数据多样性支持；(2) 针对流处理、增量处理和迭代处理的\
  \ `MapReduce` 扩展；(3) 双向连接、多路连接、theta 连接的优化，以及数据挖掘/机器学习算法的并行化；(4) 针对多核 CPU、GPGPU、异构环境和云的调度策略；(5)\
  \ 适用于 SQL 查询、统计、数据挖掘和机器学习算法的易用接口，如 `Hive`、`Pig`、`System ML` 和 `Mahout`；以及(6) 节能技术和隐私安全保障技术。\n\
  \n例如，萨尔兰大学的一些研究人员认为，通过仔细选择 `Hadoop` 中的实现技术，可以在某种程度上解决 `Hadoop/MapReduce` 的性能问题。他们提出了\
  \ `Hadoop++` [7] 和 `HAIL` [8]。`Hadoop++` 采用了以下技术：(1) Hadoop 计划：团队将 `Hadoop` 硬编码的查询处理流水线显式，并将其表示为\
  \ `DB`-风格的物理查询计划，以便对其进行推理和优化。(2) `Trojan index`：在数据加载时，为每个分片创建一个读取优化型索引，被称为 `Trojan\
  \ index`。这些索引可以提高后续的查询性能。由于 `Trojan indexes` 在数据加载时创建，因此它们在查询时没有性能损失。(3) `Trojan\
  \ join`：`Trojan join` 在数据加载时对数据进行共分区处理，以实现后续连接操作的高性能。初步结果显示，`Hadoop++` 比 `Hadoop`\
  \ 提升高达 20 倍。`HAIL`（Hadoop Aggressive Indexing Library）改变了 `HDFS` 的上传流水线，以便为每个块副本创建不同的聚类索引。`HAIL`\
  \ 改进了数据向 `HDFS` 的上传速度（复制因子为 3 时提升高达 60%）以及 `MapReduce` 作业的运行速度（比 `Hadoop` 快 68 倍）。\n\
  \n### 10.2.5 Hadoop 1.0 的优点与局限性](#21_Chapter10.xhtml_sec10_2_5)\n\n`Hadoop 1.0`\
  \ 最重要的优点是可扩展性。`Hadoop` 已经在真实的生产环境中部署到数千个节点的大集群中，这是以前 `RDBMS` 无法想象的。为什么我们需要这样的可扩展性？原因包括成本和\
  \ `I/O 带宽`。\n\n第一个原因是扩展成本。`Hadoop` 可以运行在廉价硬件的大集群上以支持大数据处理。`Hadoop` 系统上的 `SQL` 比\
  \ `Teradata`、`Vertica` 和 `Netezza` 等 `MPP` 数据库更具效益，后者需要运行在昂贵的端服务器上，且无法扩展到数千个节点。\n\
  \n第二个原因是 `I/O` 瓶颈。当数据量非常大时，只有部分数据可以加载到主内存中，其余数据必须存储在磁盘上。通过将 `I/O` 分散到大量节点上，我们可以通过巨大的聚合\
  \ `I/O 带宽` 加快数据加载和后续数据处理，这比单台高端服务器所能提供的 `I/O 带宽` 高几十到数百倍。\n\n2008 年，Yahoo 的一个由 910\
  \ 个节点组成的 `Hadoop` 集群在 209 秒内排序了 1 TB 的数据，创了 TB 级排序基准测试的新记录。之前的记录是 297 秒。其意义在于，这是开源\
  \ `Java` 程序首次在排序基准测试中获胜 [9]。\n\n2011 年 3 月 [10]，`Apache Hadoop` 项目荣获年度 `MediaGuardian\
  \ 创新奖`最高奖。评审小组将 `Hadoop` 项目描述为“21 世纪的瑞士军刀”，它具有改变媒体创新格局的潜力。`Hadoop` 平台已成为大数据处理的事实标准工具，其发挥的重要作用得到了越来越多人的认可。\n\
  \n尽管 `Hadoop` 在处理大数据方面取得了巨大成功，但它也有一些局限性，这限制了它成为多样化应用的工具。对于 `Hadoop 1.0`，有两个主要的局限性：(1)\
  \ 它只支持一种计算模型，即 `MapReduce`。`MapReduce` 计算模型的表达能力有限。在单个 `MapReduce` 作业中表达复杂的数据处理工作并不直接；此类工作必须翻译成一系列顺序执行的\
  \ `MapReduce` 作业。(2) 中间结果持久化到磁盘这一事实对系统性能产生了巨大的负面影响；很难进一步缩短查询响应时间。\n\n### 10.3 Hadoop\
  \ 2.0 与 Spark](#21_Chapter10.xhtml_sec10_3)\n\n#### 10.3.1 业务需求](#21_Chapter10.xhtml_sec10_3_1)\n\
  \n由于 `Hadoop` 展示了处理海量数据的潜力，人们希望所有数据（无论是结构化的还是非结构化的，无论来自何处）都能整合在一起。`Hadoop` 是处理批量数据的工具，其设计目标是尽可能高的吞吐量。然而，`Hadoop\
  \ 1.0` 无法支持交互式查询的需求，`MapReduce` 计算模型以及将中间结果物化到文件系统的开销（如上文所述）使得它不适用于这种交互式处理。\n\n\
  #### 10.3.2 Hadoop 2.0 生态系统](#21_Chapter10.xhtml_sec10_3_2)\n\n由于需要在一个平台上支持不同的数据处理模型，`Hadoop`\
  \ 项目的开发者引入了 `Hadoop 2.0`（简称 `YARN`，Yet Another Resource Negotiator）[11,12]，该项目获得了\
  \ 2013 年云计算学术会议的最佳论文奖。`YARN` 将 `MapReduce` 计算模型与资源管理功能分离，而这在 `Hadoop 1.0` 中是耦合的。\n\
  \n现在多种数据处理模型可以在 `YARN` 之上并行运行，包括批量处理的传统 `MapReduce` 作业、用于交互式处理的 `Tez`、用于内存迭代处理的\
  \ `Spark`、用于实时流处理的 `Storm`，以及用于图处理的 `GraphLab/Giraph`，如 图 10.7 所示。总之，`YARN` 将 `Hadoop`\
  \ 从批量处理工具转变为多样化数据处理应用的工具，包含了交互式查询。\n\n图 10.7 从 Hadoop 1.0 到 Hadoop 2.0。\n\n图 10.8\
  \ 显示了 `Hadoop 2.0` 运行的主要组件以及作业调度的工作流。`ResourceManager` 和 `NodeManagers` 构成数据处理框架。运行在主节点上的\
  \ `ResourceManager` 与运行在从节点上的 `NodeManagers` 共同负责运行分布式应用程序。在 `Hadoop 2.0` 平台上，应用程序可以是一个\
  \ `MapReduce` 作业、`Hive` 查询、`Pig` 脚本或 `Giraph` 查询。\n\n\n\n\n\n`ApplicationsManager`\
  \ 接受作业提交，为执行每个应用程序特定的 `Application-Master` 协商第一个容器，并提供在失败时重启 `ApplicationMaster`\
  \ 容器的服务。每个应用程序的 `ApplicationMaster` 从 `ResourceManager` 的 `Scheduler` 为该应用程序协商资源容器，并与\
  \ `NodeManagers` 协作执行应用程序、跟踪其状态并监控其进度。\n\n运行在从节点上的 `NodeManager` 为应用程序启动容器，监控其资源使用情况（包括\
  \ `CPU`、`Memory`、磁盘、网络带宽使用），并将信息报告给 `ResourceManager`。\n\n与 Hadoop 1.0 相比，Hadoop\
  \ 2.0 具有多个优势，包括以下方面：\n1. **更高的可扩展性**：`ResourceManager` 专注于资源调度，它可以轻松管理多达数万个节点的超大规模集群，因此\
  \ Hadoop 2.0 比 Hadoop 1.0 具有更高的可扩展性。\n2. **资源利用率高**：`ResourceManager` 可以根据每个应用程序的资源需求、公平性、服务水平协议（SLA）等优化资源使用，从而提高资源利用效率。\n\
  3. **多样化的工作负载**：除了 `MapReduce` 作业（主要用于批处理），`YARN` 还支持更多编程模型，包括图数据处理、迭代处理、实时流数据处理和交互式查询。机器学习算法通常需要对数据进行多次迭代处理以获得最终结果。\n\
  4. **灵活性**：Hadoop 2.0 提供了后兼容性；为 Hadoop 1.0 编写的 `MapReduce` 程序可以直接在 `YARN` 上运行而无需任何修改。`MapReduce`\
  \ 等编程模型可以独立进化。\n\n#### 10.3.2.1 Tez\n\n为了解决 Hadoop/MapReduce 延迟高的缺点，Hortonworks\
  \ 提出了 Apache 孵化项目 `Tez`。`Tez` 是一个高效且可扩展的执行引擎，可以轻松被 `Hive`、`Pig` 或 `Cascading` 等现有工具利用以加速运行。`Tez`\
  \ 运行在 Hadoop 2.0 `YARN` 上。\n\n`Tez` 项目旨在构建一个框架，支持通过复杂的任务有向无环图（`DAG`）处理数据。`DAG` 定义了应用程序的数据流。`Vertices`\
  \ 代表数据处理任务，反映了转换和/或分析数据的某些业务逻辑。`Edges` 代表数据的移动。\n\n`Tez` 将每个顶点视为 `Input`、`Processor`\
  \ 和 `Output` 模块的组合。`Input` 和 `Output` 决定了数据格式以及从何处读取/写入数据。`input` 代表一个管道，`processor`\
  \ 可以通过它从数据源（如 `HDFS`）或另一个顶点的输出接收输入数据；而 `output` 代表一个管道，`Processor` 可以从中生成输出数据供另一个顶点消费或写入数据汇（如\
  \ `HDFS`）。`Processor` 持有数据转换逻辑，它消耗一个或多个 `Inputs` 并产生一个或多个 `Outputs`。用户可以将输入、处理和输出逻辑插入到顶点中，然后构建\
  \ `DAG` 来执行任意的数据处理工作。\n\n`Tez` 运行时自动将 `DAG` 映射到物理资源上，并将逻辑并行化并在 Hadoop 中执行。`Tez`\
  \ 通过在顶点处添加并行性将逻辑图扩展为物理图；即每个逻辑顶点创建多个任务以并行执行计算。`DAG` 中的逻辑边也会实例化为两个连接顶点任务之间的多个物理连接。\n\
  \n凭借 `DAG` 的表达能力，某些需要多个 `MapReduce` 作业的工作现在可以作为一个作业完成。示例所示：以下 `Hive` 语句连接了三个表并计算了某些聚合：\n\
  \n```sql\nSELECT a.state, COUNT (*), AVERAGE(c.price)\nFROM a\nJOIN b ON (a.id =\
  \ b.id)\nJOIN c ON (a.itemId = c.itemId)\nGROUP BY a.state\n```\n\n在 `Hive` 中，该语句被翻译为多个\
  \ `MapReduce` 作业并一个接一个运行。在 `Tez` 中，该语句被翻译为一个由 `DAG` 表示的作业。从图中可以看出，运行上述语句，`Tez` 需要更少的作业（1\
  \ 对 3），且不需要 `IO` 同步屏障（`MR` 作业通过 `HDFS` 提供）。\n\n通过在作业中执行系列 `MR` 任务，并消除不必要的任务、同步屏障以及对\
  \ `HDFS` 的读写，`Tez` 加快了小规模低延迟以及大规模高吞吐量工作负载的数据处理。`Tez` 可以将 `Pig` 和 `Hive` 工作负载的速度提高一个数量级。它是\
  \ `Hive` 1.3 (Stinger) 的基础。\n\n`Tez` 的独特特性之一是动态优化 `DAG` 执行的能力。`Tez` 允许用户插入顶点管理模块来收集运行时信息并动态更改数据流图以优化性能和资源利用率。\n\
  \n顶点状态机在顶点启动、源任务完成等重要转换点调用用户模块。在这些点上，用户逻辑可以检查运行时状态，并向主 `Tez` 执行引擎提供提示，以决定运行时属性，例如顶点的任务并行度。\n\
  \n### 10.3.3 Spark 生态系统简介\n\nApache Spark 是一个强大的大数据处理工具，具有丰富的功能，如机器学习、实时流处理和图计算。自从\
  \ 2010 年由加州大学伯克利分校首次以来，`Spark` 及其生态系统已成为 Hadoop 的替代方案，而不仅仅是 Hadoop 平台的一个组件。目前，最大的\
  \ Apache `Spark` 集群拥有超过 8000 个节点。\n\n`Spark` 生态系统由几个组件组成，包括 `Spark Core`、`Spark\
  \ SQL`、`Spark Streaming`、`MLlib` 和 `GraphX`。\n\n\n\n\n为了从大数据集中提取有价值的信息，日益需要使用复杂的机器学习算法来分析大型数据集，以提取深层洞察。`MLlib`\
  \ 是 Spark 平台上的低级机器学习库。它可以通过 `Scala`、`Python` 和 `Java` 语言调用。`MLlib` 简化了可扩展机器学习流水线的开发。常用的机器学习和数据挖掘算法已在\
  \ `MLlib` 中实现，包括聚类、分类、分解、回归和协同过滤。\n\n`GraphX` 是构建在 Apache Spark 之上的用于图数据处理 API。`Spark\
  \ GraphX` 引入了弹性分布式图（`RDG`，Spark `RDDs` 的抽象），它将记录与图的顶点和边关联起来。`RDG` 帮助数据分析师通过各种丰富的原语执行图操作。开发者可以使用这些原语在几行代码内实现\
  \ `PageRank` 等图数据分析算法。`GraphX` 组件支持推荐和欺诈检测等许多用场景。\n\n`Spark Core` 组件了一种名为 `RDD`\
  \ 的特殊数据结构。`RDDs` 是不可变的、分区的记录集合，可以进行并行操作。由于 `RDD` 是不可变的，它没有与同步相关的开销。任何类型的数据都可以放入\
  \ `RDDs` 中。`RDDs` 通常通过转换现有的 `RDDs` 或从 `HDFS` 或 `HBase` 加载外部数据集创建。\n\n### 10.3.3.1\
  \ 弹性分布式数据集\n\n`RDD` 设计用于将整个数据集保留在内存中以便快速计算（因为访问数据的延迟更低），这对于迭代风格的数据处理工作（如机器学习算法）非常有益。`RDD`\
  \ 使用了一种独特的基于血缘的技术来提供容错保证。当由于故障导致某些下游 `RDD` 丢失时，可以通过应用 `DAG` 中两个 `RDD` 之间的变换从上游 `RDD`\
  \ 重构它，`DAG` 描述了数据处理流的逻辑。基本上，丢失分区的重建与 `DAG` 的惰性评估（稍后介绍）完全相同。\n\n通过将数据保留在内存中，`Spark`\
  \ 避免了与中间结果写入磁盘和从磁盘读回数据相关的 I/O 操作开销，这一直是 `Hadoop/MapReduce` 的痛点。当内存不足以保存整个 `RDD`\
  \ 时，`Spark` 将根据 `LRU`（最近最少使用）策略进行驱逐。\n\n通常，用一系列针对 `RDDs` 的操作表示的应用程序逻辑包括变换（transformation）和动作（action）。变换是针对现有\
  \ `RDDs` 的粗粒度操作，如 `join`、`union`、`filter` 或 `map`，它们产生一个新的 `RDD`。动作是如 `count`、`first`\
  \ 和 `reduce` 等操作，在应用到现有 `RDDs` 后会返回某些值。\n\n所有变换都是惰性的，这意味着 `Spark` 不会立即执行它们，而是跟踪所有将应用到上游\
  \ `RDDs` 的变换，追溯对所需父级 `RDD` 的依赖关系，并一直追踪到 `DAG` 的源节点。动作的激活从 `DAG` 的叶子节点开始，将首先触发 `RDDs`\
  \ 上的下游变换，随后触发上游变换。\n\n数据处理工作可以表示为 `RDDs` 上的一系列变换和动作；前者告诉我们如何通过某些操作从旧的 `RDD` 生成新的\
  \ `RDD`，后者指定了如何生成最终结果。`RDD`、变换和动作共同构成了一个 `DAG`。\n\n一个真实的 `DAG` 看起来如图图 10.11 所示。`HDFS`\
  \ 中的某些数据文件被加载到两个 `RDDs` 中。然后对 `RDDs` 逐一运行一系列变换（`map`、`flatMap`、`filter`、`groupBy`、`join`\
  \ 等）。对 `RDD` 执行一次变换后，会生成一个新的 `RDD`。然后，下一个变换将在新生成的 `RDD` 上运行生成另一个新 `RDD`，以此此类推。最后，在最后一个\
  \ `RDD` 上调用动作（`count`、`collect`、`save`、`take`），生成最终结果并写入存储设备。\n\n![fig10_11.jpg](img/fig10_11.jpg)\n\
  \n图 10.11 RDD 的典型 DAG。\n\n子 `RDD` 分区与父级 `RDD` 分区之间存在两种形式的依赖（请参考图 10.12）。窄依赖（Narrow\
  \ dependency）意味着父级 `RDD` 的每个分区最多被子级 `RDD` 的一个分区使用。宽依赖（Wide dependency）意味着多个子分区可能依赖于父级\
  \ `RDD` 的一个分区。如 `group-by-keys`、`reduce-by-keys` 和 `sort-by-keys` 等操作需要宽依赖来实现正确的结果。窄依赖的处理（从父级\
  \ `RDD` 生成子 `RDD`）可以在机器内部完成，无需跨网络的数据清洗。然而，宽依赖涉及数据清洗。\n\n![fig10_12.jpg](img/fig10_12.jpg)\n\
  \n图 10.12 窄依赖和宽依赖。\n\n`DAGScheduler` 是 `Spark` 的调度层，实现了基于阶段的调度。`DAGScheduler` 的基本概念是\
  \ `jobs` 和 `stages`。一个 `job` 是一个提交给 `DAGScheduler` 的顶层工作项，用于计算 `action` 的结果。一个 `job`\
  \ 以单个最终 `RDD` 结束。`stage` 是一组并行任务，每个 `RDD` 的每个分区一个，作为 `Spark job` 的一部分计算部分结果。它是数据处理的单元。\n\
  \n`DAGScheduler` 将检查依赖类型并将窄依赖的 `RDDs` 分组为一个 `stage`。宽依赖将跨越执行流中的连续阶段。图 10.13 显示了一个连接两个表并执行聚合的\
  \ job 及其对应的阶段。\n\n![fig10_13.jpg](img/fig10_13.jpg)\n\n图 10.13 Job 和对应的阶段。\n\n`DAGScheduler`\
  \ 为每个 `job` 生成一个阶段的 `DAG`，跟踪哪些 `RDDs` 和阶段输出已物化，并找到一个最小调度方案进行运行。然后它将阶段提交给 `TaskScheduler`\
  \ 运行。\n\n`DAGScheduler` 还会根据当前缓存状态（`RDD` 的某些分区已缓存）确定每个任务的优选运行位置，并将信息交给 `TaskScheduler`。此外，`DAGScheduler`\
  \ 会处理由于 shuffle 输出文件丢失导致的故障，在这种情况下旧阶段需要重新提交。阶段内部非由 shuffle 文件丢失引起的故障由 `TaskScheduler`\
  \ 本身处理，它会在取消整个阶段之前重试任务几次。\n\n#### 10.3.3.2 DataFrame\n\n`DataFrame` 在 `RDD` 之上增加了一个抽象层。在\
  \ `Spark SQL` 的早期版本中，`DataFrame` 被命名为 `SchemaRDD`。基本上，`SchemaRDD` 是一个带有上层模式的 `RDD`，为数据集中的列提供了正式名称和数据类型。`DataFrame`\
  \ API 以惰性方式评估操作，为关系优化和整个数据处理流的优化提供支持。程序员可以在 `Scala` 或 `Java` 程序中通过 `DataFrame` API\
  \ 来集成过程化和关系处理。\n\n### 10.3.4 Spark 性能\n\n#### 10.3.4.1 Shark (Spark SQL) 执行 SQL\
  \ 查询的性能\n\n加州大学伯克利分校的 `AMP` 从参考文献 18 中提取负载和查询，对五个系统进行定量和定性比较，包括 `Redshift`、`Hive`\
  \ (v0.12)、`Shark`、`Impala` (v1.2.3) 和 `Stinger/Tez` (v0.2.0)。\n\n`Redshift` 是由 [Amazon.com](http://www.Amazon.com)\
  \ 提供的基于 `ParAccel` 数据仓库的 MPP 数据库。`Shark` 是 `Spark SQL` 的前身，运行在 `Spark Core` 之上的\
  \ Hive 兼容 SQL 引擎。Cloudera 的 `Impala` 是一种 Hive 兼容 SQL 引擎，拥有自己的类似于 MPP 类的执行引擎。\n\n\
  \n\n该数据集包含三个表。`Ranking` 表存储网站及其页面排名。`UserVisits` 表存储每个网页的服务器日志。`Documents` 表则存储了非结构化的\
  \ HTML 页面。工作负载中包含四个查询。`Query 1`（扫描查询）和 `Query 2`（聚合查询）是探索性 SQL 查询。`Query 3` 是一个结果集较小的连接查询。`Query\
  \ 4` 是一个批量 UDF 查询。它使用 `Common Crawl`（[`commoncrawl.org/`](http://commoncrawl.org/))）的样本来计算简化版的\
  \ `PageRank`。\n\n对于 `Query 1`（扫描查询），当数据集可以保留在内存中时，`Spark` 在所有选择性下都优于其他系统。对于 `Query\
  \ 2`（聚合查询），运行在内存数据集上的 `Spark` 实现的性能除 `RedShift` 之外均高于其他系统。\n\n对于 `Query 3`（连接查询），当选择性较低时，`Spark`\
  \ 的响应时间与 `Redshift` 和 `Impala`（内存意味着数据集驻留在内存中）相似，并优于其他系统。当选择性较高时，`Spark`（内存）优于其他系统或设置，`Redshift`\
  \ 除外，而 `Redshift` 始终优于 `Spark`。对于 `Query 4`（带 UDF 的查询），`Spark`（内存）远优于 `Hive` 和 `Tez`。表\
  \ 10.1 和图 10.14 显示了不同系统上连接查询（`Query 3`）的结果。读者可以参考参考文献 19 获取更多基准测试结果。\n\n### 表 10.1\n\
  \n不同系统（设置）/选择性下 `Query 3` 的中响应时间（秒）\n\n| 系统（设置） | 版本 | Query 3A | Query 3B | Query\
  \ 3C |\n| :--- | :--- | :--- | :--- | :--- |\n| --- | --- | --- | --- | --- |\n\
  | | | 485,312 行 | 53,332,015 行 | 533,287,121 行 |\n| --- | --- | --- | --- | ---\
  \ |\n| | | (低选择性) | (中选择性) | (高选择性) |\n| --- | --- | --- | --- | --- |\n| Redshift\
  \ (HDD) | 当前 | 33.29 | 46.08 | 168.25 |\n| Impala—磁盘 | 1.2.3 | 108.68 | 129.815\
  \ | 431.26 |\n| Impala—内存 | 1.2.3 | 41.21 | 76.005 | 386.6 |\n| Shark—磁盘 | 0.8.1\
  \ | 111.7 | 135.6 | 382.6 |\n| Shark—内存 | 0.8.1 | 44.7 | 67.3 | 318 |\n| Hive—YARN\
  \ | 0.12 | 561.14 | 717.56 | 2374.17 |\n| Tez | 0.2.0 | 323.06 | 402.33 | 1361.9\
  \ |\n\n![fig10_14.jpg](img/fig10_14.jpg)\n\n图 10.14 不同系统（设置）/选择性的 `Query 3` 响应时间\n\
  \n从上述结果可以看出，`Shark`（现为 `Spark SQL`）是目前可用结构化数据处理系统中非常有竞争力的一个。\n\n### 10.3.4.2 用于机器学习算法的\
  \ Spark 性能\n\n`Spark` 设计人员[20] 还比较了 `Spark` 平台上逻辑回归实现与 `Hadoop` 实现的性能，使用了 29 GB\
  \ 的数据集，并在 20 个具有四个核心的“m1.xlarge” `EC2`（亚马逊弹性计算）节点上运行。\n\n结果如图 10.15 所示。对于 `Hadoop`，每次迭代需要\
  \ 127 秒，因为它作为一个独立的 `MapReduce` 任务运行。对于 `Spark`，第一次迭代需要 174 秒，他们认为由于使用了 `Scala` 而不是\
  \ `Java`，但随后的迭代只需要 6 秒，因为缓存数据可以重用。这使得任务运行速度快了 10 倍。\n\n![fig10_15.jpg](img/fig10_15.jpg)\n\
  \n图 10.15 `Hadoop` 和 `Spark` 中的逻辑回归性能。\n\n### 10.3.4.3 Spark 获得的奖励\n\n`Spark` 在\
  \ 2014 年正式获得了 Daytona GraySort 竞赛（[`sortbenchmark.org/`](http://sortbenchmark.org/)）[21]。Databricks\
  \ 的人员使用 206 台 `EC2` 机器在 23 分钟内对磁盘上的 100 TB 数据进行了排序。`Hadoop/MapReduce` 之前的世界记录使用了\
  \ 2100 台机器，耗时 72 分钟。\n\n注：输入文本包含许多重复区块。我将提供清理后的唯一内容版本。\n\n\n\n另一方面，YARN 将 Hadoop\
  \ 从一个批处理工具转变为一个交互式工具。通过将资源管理功能与编程模型分离，Hadoop 2.0 平台支持各种应用程序，包括批处理 MapReduce 任务、交互式查询、迭代机器学习算法、流数据处理和图数据处理。Spark\
  \ 可以作为应用嵌入 Hadoop 平台中，以提供交互式查询处理能力。\n\n从上述描述中，我们可以这两个平台之间存在功能重叠和相互依赖的关系。这两个平台及其生态系统将共存并向着更先进的工具演进。\n\
  \n然而，有一点不可否认：这两个平台将相互竞争。除了在许多应用场景下实现比 Hadoop 更高的性能外，Spark 现在可以处理高达 PB 级的巨大数据集，而这传统上是\
  \ Hadoop 的强项。\n\nSpark 比 Hadoop 具有许多吸引力。例如，自 2009 年以来为 Hadoop 开发的机器学习库 `Mahout`\
  \ 已经迁移到 Spark 之上以获得更高的性能。在 `Mahout` 的早期版本中，机器学习算法被实现为 `MapReduce` 程序，由于 `MapReduce`\
  \ 计算模型的局限性，它们的运行效率很低。2014 年，`Mahout` 社区决定将 `Mahout` 代码库迁移到其他数据处理系统。它不再接受 `Hadoop\
  \ MapReduce` 代码，并将新开发完全切换到 Spark。然而，代码库中已有的 `MapReduce` 算法被保留在那里并由社区维护。将 `Mahout`\
  \ 迁移到 Spark 的原因是 Spark 提供了更灵活的程序模型和更高效的执行引擎。\n\n`Mahout` 项目社区重新开发了 `Mahout`，利用 Spark\
  \ 的内存数据处理能力获得更高的性能。现在，`Mahout` 被重构为一个更通用的库，不仅运行在 Spark 上，还运行在其他数据处理系统（如 `H2O` 引擎）。`H2O`\
  \ 由一家名为 `0xdata` 的初创公司独立开发。它是一个内存数据引擎，专门设计用于在存储 `HDFS` 中的大规模数据上运行各种机器学习和统计工作负载。\n\
  \n然而，Hadoop 社区也在不断改进 Hadoop 以支持低延迟查询，这是 Spark 平台的强项。这两个平台将长期竞争并共存。人们不会完全放弃 Hadoop，因为它仍然存储海量数据的极佳工具，而且某些人仍使用\
  \ `MapReduce` 进行数据的批处理。\n\n通过设计和实现 `Tez` 为 `Hive` 增加了交互式查询能力，Hortonworks 推出了一项名为\
  \ Stinger 的新策略。接下来 [22] 将重构 `Hive` 以处理读写事务、支持全套 SQL 并提供亚秒级的响应时间。他们还尝试整合 `Hive` 和\
  \ `Apache Spark`，以便前者能够处理机器学习任务。更强大的 `Hive` 将对许多长期使用 `Hive` 且不愿迁移到 Spark 等完全新技术的用户具有吸引力。\n\
  \n### 10.3.6 Hadoop/Spark 在未来大数据仓库中的角色\n\nHadoop 和 Spark 均可以在未来几代大数据仓库中发挥着核心作用。诸如\
  \ `VoltDB/Sap HANA` 等数据库可以管理数据市，并支持对数据中心边缘的分析结果进行实时查询。存在三种共生场景，即：Hadoop 主导、Spark\
  \ 主导和共存（请参考图 10.16）。\n\n![fig10_16.jpg](img/fig10_16.jpg)\n\n图 10.16 Hadoop 和 Spark\
  \ 在未来几代数据仓库中的角色。(a) Hadoop 主导。(b) Spark 主导。(c) 共存。\n\n在 Hadoop 主导的场景下，Hadoop 是将所有数据整合到一个地方的最终后端。数据可以是结构化的、半结构化的或非结构化的。在\
  \ Hadoop 平台上，人们可以对不同的数据集执行各种分析，包括简单统计和复杂的机器学习及数据挖掘算法。在这种场景下，Spark 可以作为 Hadoop 平台的一个组件，为中等规模的数据集提供内存处理。\n\
  \n然而，Spark 不想仅仅是其他框架的一个组件。Spark 社区试图让 Spark 成为一个功能完备的框架。它在下一代数据仓库中占据主地位。Spark 将作为一个数据中心，从各种源（包括流源、文件和其他\
  \ RDBMS）接收数据，并通过分析流水线传输数据。它是收集所有相关数据以供人们获取洞察的最终场所。Spark 可以从 Hadoop 中提取数据，例如 `HDFS`\
  \ 中的数据、`Hive` 表和 `HBase` 表。虽然 Spark 可以在 Hadoop 2.0 的 `YARN` 上运行，但主宰一切的是 Spark 而非\
  \ Hadoop。\n\n在上述两种场景中，Hadoop 和 Spark 都在拥抱对方。\n\n在第三种场景下，数据首先发送到 Spark，在 Spark 上进行探索性分析。然后所有数据交给\
  \ Hadoop 进行进一步分析。深度分析需要更长的时间，因此 Spark 和 Hadoop 被结合使用，以利用各自的特长。\n\n## 10.4 结论\n\n\
  #### 10.4.1 业务需求驱动创新\n\n存储设备的容量不断增加，而价格下降，使得收集大规模数据集成为可能。在过去，当人们拥有一些数据时，他们求助于数据库（特别是\
  \ `RDBMS`）。`RDBMS` 变成了一种“万能”工具。现在人们手里拥有真正巨大的数据集，但缺乏处理工具。传统的 `RDBMS` 无法处理这些数据。Hadoop\
  \ 1.0 是一种模仿 Google MapReduce 技术的工具，从设计之初就是一个批处理工具。然而，人们渴望尽早获得结果以进行快速决策；探索性分析和机器学习对低延迟有需求。分析的及时性成为\
  \ Hadoop 1.0 的痛点。\n\nSpark 的诞生是为了通过其内存处理的设计满足这些需求。通过将数据集保留在集群的内存中，Spark 可以处理大数据并实现快速响应。在\
  \ Spark 的新版本中，操作符也可以对磁盘数据进行操作，这使得 Spark 成为 Hadoop 的强有力竞争对手。\n\n然而，Hadoop 已演进为架构更清晰的\
  \ Hadoop 2.0，分离了资源管理和编程模型。它已一个更强大的工具；它可以处理更多类型的数据并提供更低的延迟。\n\n总而言，对大数据及时分析的需求驱动了这些创新。我们可以看到这两个阵营相互启发，Hadoop\
  \ 1.0 的局限性激发了研究人员开发 Spark 的热情，而 Spark 的高性能又促进了 Hadoop 的进化。\n\n#### 10.4.2 数据库研究社区和行业应当学习的教训\n\
  \n早期，一些人批评 Hadoop/MapReduce 过于简单、编程层次过低以及性能低下。然而，对于传统 `RDBMS` 无法处理的真正数据集，人们只能依赖\
  \ Hadoop/MapReduce。越来越多的人使用 Hadoop，它变得越来越流行。Hadoop 已经成为大数据处理的标准工具。\n\n\n\n\n我们可以回想起，在\
  \ RDBMS 早期关系型系统首次引入时，层次型（`IMS`）和网络型（`IDMS`）数据库认为关系型系统要劣得多，且无法提供足够的性能。随着时间的推移，这些观点被证明是错误的（[`www.b-eye-network.com/view/10786`](http://www.b-eye-network.com/view/10786)）。RDBMS\
  \ 的研究人员和开发者开发了优化技术以高效执行事务，以及其他技术使 RDBMS 成为适用于大量运营和分析应用的可靠、高性能数据库。\n\nRDBMS 取得了巨大的成功，它是数据库市场的主导技术，并催生了\
  \ Oracle 和 TeraData 等几家大公司。历史不断重演。在 Hadoop/MapReduce 早期，关于 Hadoop/MapReduce 究竟是一项创新还是一个巨大的倒退存在着争议\
  \ [23]。时间流逝，Hadoop/MapReduce 的巨大成功可能已经为这场争议给出了答案。\n\nHadoop 是一个工具，Spark 也是，就像 RDBMS\
  \ 是一个工具一样。RDBMS 适用于 OLTP 应用的数据管理需求，而 Hadoop 或 Spark 则是大数据处理的恰当工具；它可以处理任何类型的数据，并支持批处理以及交互式分析。不同的任务需要不同的工具。Hadoop（以及\
  \ MapReduce 编程模型）有其优点，包括比专有工具更低的成本、高度的可扩展性和高可靠性。Hadoop/MapReduce 是一项创新工具。当 Spark\
  \ 破了 Hadoop 在大数据处理领域的地位时，人们变得更加谨慎，且没有人否认 Spark 相比于 Hadoop 的进步；这一次我们没有听到任何批评。\n\n\
  Hadoop 和 Spark 并非诞生于传统的数据库研究社区或数据库公司。MapReduce 的第一篇论文并没有发表在数据库会议上。\n\n数据库研究社区的一些人过度强调了\
  \ Hadoop/MapReduce 的局限性，而对它的优点却视而不见。即使在看到 Hadoop/MapReduce 的普及程度日益提高后，他们仍不愿承认这项技术的颠覆性。一些公司在早期轻视或忽视了\
  \ Hadoop/MapReduce。这为数据库研究社区和数据库公司提供了可以吸训的教训。\n\n新数据处理技术的渗透力如此强大，以至于没有任何供应商能够抵挡\
  \ Hadoop 的流行并继续拒绝它。EMC 曾并非数据库供应商，通过收购 Greenplum 在一夜之间成为了市场上的强有力者，Greenplum 结合了 MapReduce\
  \ 的扩展性和 `PostgreSQL`（一种开源 RDBMS）的高性能。EMC 进入数据库市场正如石投水面，打破了平静，迫使传统数据库供应商重新思考他们对 Hadoop\
  \ 和 Spark 等新技术的态度。为了维持其市场领先地位，TeraData 收购了 AsterData 公司获得 AsterData 数据库，该数据库使用 MapReduce\
  \ 风格的并行处理来丰富其产品线。传统数据库市场的领导者 Oracle 在 2011 年之前轻视并拒绝 Hadoop/MapReduce，最终在 2011 年底发布了其“大计划”（Big\
  \ Plan），将 NoSQL 和 Hadoop 纳入其软件产品。微软在 2009 年拒绝了 Hadoop/MapReduce，而在 2012 年由于 Hadoop\
  \ 日益流行和成功，它关闭了 `Dryad` 项目并拥抱 Hadoop [24]。\n\nHadoop/MapReduce 并没有消亡而是变得流行，以及 Oracle\
  \ 和微软对 Hadoop/MapReduce 态度的 180 度大转弯，说明了一些问题。\n\n微软是一家有趣的公司。当 Netscape 夺走了大部分 WWW\
  \ 浏览器份额时，微软免费提供了 `Internet Explorer`。当 RealPlayer 开始在音频视频流市场获得吸引时，微软几乎免费地提供了类似的\
  \ `Media Tools` 产品。当 Java 成为一种流行的编程语言时，微软在 `.Net` 平台上交付了与 Java 非常相似的 `C#` 语言。当 Apple\
  \ Siri 成为 iPhone 上流行的数字助手时，微软在 Windows 上推出了 `Cortana`。微软在上述所有案例中都在某种程度上成功地与其他产品竞争。来。当\
  \ Hadoop 成为大数据处理的标准工具时，微软引入了 `Dryad`，这也是一个用于处理大数据的并行计算框架。这一次的结果却有些不同。\n\n`Dryad`\
  \ 采用 `DAG` 概念来表达复杂的数据处理工作。在 `DAG` 中，每个顶点都是一个程序，边代表数据通道，这些可以是文件、TPC 管道或共享内存 FIFO\
  \ 队列。由于 Hadoop/MapReduce 的巨大流行，如上所示，微软在 2011 年停止了 `Dryad` 的开发，并将重心转向了 Hadoop 框架。\n\
  \n在我们看来，`Dryad` 可能是 Hadoop/MapReduce 的替代方案。在微软放弃 `Dryad` 的后几年里，`Apache Hadoop` 社区拾起了\
  \ `Dryad` 的基本思想并开发了 `Apache Tez` —— 这是一个基于 `YARN` 的新型运行时框架，用于提供交互式查询能力。`DAG` 也是\
  \ `Spark` 基于的基础概念和技术之一；其他技术包括内存数据集、基于血缘的容错保证等。Spark 社区已将 `Spark` 开发成一个可靠且高性能的大数据平台，它不仅挑战了\
  \ Hadoop，而且与 Hadoop 一起挑战了传统数据库；它们不是朋友而是敌人 [25]。谁知道对于微软不坚持将 `Dryad` 成为一个通用且高性能的大数据框架是否是一个错误的决定？\n\
  \n基本上，像 `Oracle`、`IBM DB2`、`Microsoft SQL Server`、`TeraData`、`MySQL` 和 `PostgreSQL`\
  \ 等传统数据库，以及 `Hadoop` 和 `Spark` 等新工具都在做相同的事情，即数据管理和数据分析。新工具已经开始蚕食传统数据库的市场份额，挑战着 `Oracle`\
  \ 和 `TeraData` 等巨头，正如《华尔街日报》报道所示 [26]。`Hadoop` 和 `Spark` 是颠覆性的创新，它们正在打破传统技术（特别是\
  \ `RDBMS`）的垄断。这也是 Hadoop 受到批评的原因之一，因为 Hadoop 变得越来越强大，并可能在某一天成为许多应用场景的中心。\n\n###\
  \ 10.4.2.1 教训 1：应对新需求 (#21_Chapter10.xhtml_sec10_4_2_1)\n\n数据库供应商应该学习什么？一个重要的教训是供应商应该真正关注并听取客户意见。客户需要可扩展的软件，他们希望以更低的成本获得更高的性能，他们有许多类型的数据需要处理，而且数据量巨大。\n\
  \n基本需求是在自己在低成本集群上运行低成本软件来完成大数据分析工作。传统数据库未能达到预期。数据库供应商和数据库研究社区沉浸在传统数据库技术的巨大成功中，对新时代的需求反应相当缓慢。\n\
  \n\n\n\n\n自从 RDBMS 成为数据库市场的主流技术以来，来自传统数据库社区和传统数据库供应商的人自然地反感带有 NoSQL 标签的东西。`Hadoop`\
  \ 和 `Spark` 等新工具的成功使他们变得更加敏锐，不再沉溺于过去的成就中。`Hadoop` 和 `Spark` 并不意味着要成为传统数据库的朋友。它们是替代方案；是替代者；是竞争者；更是游戏规则的改变者。\n\
  \n`Hadoop` 设计用于管理和处理数百 TB 甚至数十 PB 级的数据。当数据量仅为几十 TB 时代，旧版 `Hive` 的性能远逊于 MPP 数据库，人们使用混合架构来处理大数据。最近，部分数据存储在\
  \ MPP 数据库中以获得更高的处理性能，而所有数据都汇聚到 `Hadoop` 中供后续进行批处理。现在情况正在发生变化；新的执行引擎（如 `Hadoop` 的\
  \ `Tez` 或 `Spark`）可以实现得多的性能，并且可以在 `Hadoop` 或 `Spark` 上构建整个数据仓库，将所有数据汇聚于一处。处于舞台中央的传统\
  \ RDBMS 可能会被挤到舞台边缘。\n\n## 10.4.2.2 课程 2：要有更开放的心态\n\n人们应该学习的另一个教训是，研究人员和开发者应该拥有更加开放的心态。`RDBMS`\
  \ 是工具，`Hadoop` 是，`Spark` 也是，尽管后者从 `RDBMS` 中学习了一些思想，但它们自身也有关键性的创新。而且它们都比传统 RDBMS\
  \ 某些优势，例如高得多的扩展性。能够应对大数据处理挑战的新技术应该受到尊重，无论它们被贴上什么标签——NoSQL 还是 SQL——也无论它们使用什么技术。\n\
  \n现在，越来越多的数据库研究人员承认了 `Hadoop` 和 `Spark` 等开源大数据平台的重要性。即使在以前使用 `RDBMS` 的传统企业中，他们也看到了此类平台在处理大数据方面正被快速采用\
  \ [[27]]。从[参考文献 27]的作者列表中，可以看到第一篇 `MapReduce` 论文的作者以及领导 `Spark` 诞生实验室的研究人员曾受邀参加了由数据库研究人员主导的会议。\n\
  \n他们意识到，除了 SQL，多样化的数据源需要多样化的编程抽象来对数据集进行操作。虽然 SQL `RDBMS` 仍被广泛使用，但键值存储、数据流处理器、`Hadoop`\
  \ 和 `Spark` 框架等在数据管理和分析应用中发挥着越来越重要的作用。是时候重新思考数据库的含义以及数据库课程应该是什么样子了。\n\n大数据产生了对数据科学家日益增长的需求，他们能够从海量多样化数据中提取可操作的知识。数据科学家的技能组不仅包括数据管理和商业智能的传统知识，还包括数学、统计学、人工智能和机器学习，以及\
  \ `Hadoop` 和 `Spark` 等新的数据处理工具。\n\n## 参考文献\n\n1. Wikipedia. Big data. [`en.wikipedia.org/wiki/Big_data`](https://en.wikipedia.org/wiki/Big_data),\
