  \ 1`，`(j + 1) × ti,j + 1R(α) ≥ j × ti,jR(α)`。\n\n为了方便起见，我们用 `tiU` 表示应用程序 `Ti` 在执行任意点的预期结束时间。最初，如果应用程序\
