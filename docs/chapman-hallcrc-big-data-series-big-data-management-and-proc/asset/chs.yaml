  \ 5.5.5.4 检查点成本的影响\n\n## 5.6 结论\n\n\n\n\n此外，大规模平台容易发生故障。事实上，对于一个拥有 `p` 个处理器的平台，即使每个节点的个体\
  \ MTBF（平均无故障时间）为 120 年 [4]，我们预计每每隔 `120/p` 年就会发生一次故障，例如对于一个拥有 `p = 106` 个节点的平台，每小时就会发生一次。故障可能会破坏协同调度算法实现的负载平衡：如果所有应用程序都由协同调度器分配资源，以便它们在大约相同的时间完成执行，那么故障的发生将显著延迟相应应用程序的完成时间。反之，多次故障可能会在应用程序之间产生严重的不平衡，从而显著降低性能。为了应对故障，高性能计算（HPC）中通用的错误恢复技术是检查点回滚恢复（checkpoint\
  \ and rollback recovery）[5]。该思想的核心是定期保存应用程序的状态，以便当错误发生时，应用程序可以恢复到之前的某个状态。最广泛使用的协议是协调检查点（coordinated\
  \ checkpointing），即所有进程定期停止计算并同步，将关键应用程序数据写入稳定存储器中。采集检查点的频率应该经过仔细调优，以确保无故障执行时的开销不会太严重，同时也确保在发生故障时付出的代价在合理范围内。Young\
  \ 和 Daly 公式 [6,7] 为最优检查点间隔提供了良好的近似值。\n\n在本章中，我们讨论了易故障平台上的协同调度。检查点有助于减轻故障对特定应用程序的影响，但必须辅以重新分配（redistributions）来重新平衡应用程序之间的负载。协同调度通常涉及将应用程序划分为若干包（packs），然后尽可能高效地顺序调度每个包。因此，目标是确定一种将应用程序划分为包的方法以及处理器到应用程序的分配方案，使得所有包的执行时间之和最小。给定一个包（即一组同时开始执行的并行任务），重新分配处理器的两个主要机会：首先，当一个任务完成时，仍在运行的应用程序可以获取它的处理器；其次，当故障发生于某个任务时，该任务会被延迟。通过向其添加更多资源，我们可以缩短其最终完成时间。然而，我们必须小心，因为每次重新分配都有成本，该成本取决于交换的数据量以及参与重新分配的处理器数量。此外，为任务增加处理器会增加其失败的概率，因此需要进行权衡（trade-off）以最小包的预期完成时间。\n\
  这项工作的主要贡献如下：\n\n1. 证明了在无故障背景下每个包包含 `k ≥ 3` 个任务的通用划分问题的 NP 完备性，并提供了一种近似算法。\n3. 当给定组成包的任务且无法进行重新分配时，一种将处理器分配给应用程序的最优算法。\n\
  4. 证明了包含重新分配问题的 NP 完备性。\n5. 设计并评估了若干种处理故障和重新分配成本通用问题的多项式时间启发式方法。这些启发式方法在极短时间内执行表现出非常良好的性能，从而验证了该方法的有效性。\n\
  本章的结构如下：我们将在第 5.2 节 中讨论相关工作。随后在第 5.3 节 中正式定义该问题。理论结果将在第 5.4 节 中给出，展示了问题的复杂度，讨论了子问题和最优解，并提供了近似算法。在这些结果的基础上，我们在第\
  \ 5.5 节 中描述并彻底评估了若干种多项式时间启发式方法。最后，我们在第 5.6 节 中总结并讨论未来的工作。\n\n### 5.2 相关工作\n在本章中，我们处理并行任务的包调度，目标是最小化跨度时间（makespan，注意跨度时间是指总执行时间）。对于顺序任务（在单个处理器上执行的任务），对应的跨度时间最小化目标问题是容易解决的：只需将最大的\
  \ `p` 个任务组成一个包，并在仍有任务时继续此类操作。请注意，顺序任务的包调度问题已针对其他目标函数被广泛研究，请参见参考文献 8 关于各种作业成本函数的说明，以及参考文献\
  \ 9 的综述。回到顺序任务和跨度时间目标问题，Koole 和 Righter 在参考文献 10 中处理了每个任务执行时间未知但由概率分布定义的情况。他们改进了\
  \ Deb 和 Serfozo [11] 的结果，后者考虑了具有相同作业的随机问题。Ikura 等人 [12] 解决了任务执行时间相同但发布时间和截止日期不同的任务跨度时间最小化问题；他们假设截止日期是可协调的（agreeable\
  \ deadlines），意味着如果一个任务的发布时间比另一个早，那么它的截止日期也较早。Koehler 等人 [13] 针对最后一个问题提出了线性时间解，并进一步为在实现最优跨度时间的同时最小化包数量的问题提供了\
  \ `O(n3)` 的解。\n\n接下来我们将在第 5.2.1 节 中关注并行任务的协同调度问题，然后在第 5.2.2 节 中讨论关于弹性（resilience）的相关工作。\n\
  #### 5.2.1 并行任务\n\n据我们所知，并行任务问题尚未作为一个整体被过。然而，Dutot 等人 [14] 引入了一种分阶段可塑模型（moldable-by-phase\
  \ model）来近似可塑性问题。可塑性任务模型与包调度模型相似，但缺少额外的约束（包约束），即在当前包中的所有任务完成之前，不能开始新任务的执行。Dutot\
  \ 等人 [14] 使用动态规划算法，为相同独立任务的包调度问题提供了一个最优多项式时间解。这是我们在文献中找到的唯一一个并行任务包调度的案例。\n在实践中，如最近的结果所示，包调度非常有用。Li\
  \ 等人 [15] 提出了一个框架，用于预测功率感知消息传递接口（MPI）任务聚合对能量和性能的影响。Frachtenberg 等人 [16] 显示，通过根据负载平衡需求和处理器间通信模式协同调度作业方案，可以提高系统利用率。Shantharam\
  \ 等人 [2] 研究了基于加速特性（speedup profiles）的协同调度，这与我们的工作类似，但包只能包含一个或两个任务；尽管如此，他们报告了更快的工作负载完成和相应的系统能量节省。\n\
  \n\n\n若干篇文献 [17––19] 考虑了单多核节点上的协同调度，此时协同调度任务对资源的竞争会导致能量消耗与性能指标之间产生复杂的权衡。Chandra\
  \ 等 [18] 预测并利用了多核节点上的线程间缓存竞争来提高性能。Hankendi 和 Coskun [19] 显示，通过在运行时应用基于特定性能指标对任务进行分类的多级协同调度技术，可以在单位工作能量上获得可衡收益。Bhaduria\
  \ 和 McKee [17] 考虑了局部搜索启发式算法，在多核节点上以资源感知的方式对任务进行协同调度，以实现每瓦特吞吐量的显著提升。\n\n\n人们可能会问，给定一组需要调度的\
  \ `n` 个任务，为什么按“包（packs）”调度而不是全局调度？全局调度可以避免某些处理器在当前包结束和下一个包开始之间产生的空隙，从而可能缩短总跨时间（makespan）。然而，有几个理由倾向于采用包调度。首先，全局调度非常难以构建。目前已知最好的启发式算法会在一组处理器结束执行后立即贪婪地将新任务分配给该组，从而限制新任务的资源数量与上一个任务相同。我们的协同调度不受这种处理器分配决策的僵化性影响。其次，包调度大大降低了调度本身的成本。调度器仅在每个包的开始时启动一组任务并传输相应的输入数据。在包中的所有任务返回并执行新包之前，不会产生额外开销。\n\
  \n\n高性能计算（HPC）中处理故障停止（fail-stop）错误最常用的技术之一是检查点回滚恢复 [5]。其思想是定期将系统状态或应用程序内存占用保存到稳定存储器上。经过停机和恢复时间，系统可以恢复到之前的有效状态（回滚步骤）。另一种处理故障停止错误的技术是进程复制，它包括复制进程甚至复制通信。例如，RedMPI\
  \ 项目 [20] 实现了进程复制机制，并将每次通信复制四份。\n\n\n据我们所知，这是首个考虑协同调度和故障的工作，因此使用了可变性应用程序（malleable\
  \ applications）[23,24] 以允许在应用程序之间重新分配处理器。关于并行应用模型和韧性的更多相关工作在参考文献 25 中有所讨论。\n\n\n\
  ## 5.3 问题定义](#16_Chapter05.xhtml_sec5_3)\n\n\n### 5.3.1 加速剖面](#16_Chapter05.xhtml_sec5_3_1)\n\
