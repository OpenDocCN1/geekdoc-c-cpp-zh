  \ VM 和服务器的电费，用 `Cost` 表示：\n\n![eq2_14](img/eq2_14.jpg)\n其中 `Pri` 是第 `ith` 次采样间隔期间的电价。\n\
  \n假设在我们的 `60` 次采样期间，电价为 `20 $/MWh`；每个间隔为 `2` 秒。根据回归树方法在 `2 分钟` 期间的估计功率，每个 VM 的能量消耗分别为\
  \ `0.40 Wh`、`0.46 Wh` 和 `0.41 Wh`，服务器功率为 `6.8097 Wh`，其中静态功率占很大比例。为了估计总能量成本，我们假设所有\
  \ VM 以这种模式运行一小时。因此，服务器的电费为 `0.41 分分`，三台 VM 的成本分别为 `0.024`、`0.028` 和 `0.025 分分`。一个低配置\
  \ `EC2 VM` 的最低价格每小时为 `1.3 分分`，比我们的服务器要贵得多，因为还考虑了管理和冷却支出等其他运营成本。通过我们的分析，我们希望未来的 IaaS\
  \ 商能够根据 VM 粒度的功耗或能量成本，以更公平的方式向用户收费。\n\n## 2.1.6 待研究的研究问题\nVM 功率计量是一个重要且新兴的研究课题。目前仍有许多待研究的研究问题。以下是一些典型问题，包括\
  \ VM 服务计费、功率预算和节能调度。\n\n\nVM 功率是虚拟化数据中心的基本单位，因此未来数据中心将通过提高 VM 功率可见性来改进监控系统。一方面，这有助于我们以更细细的粒度理解数据中心的功耗；另一方面，可以对\
  \ VM 服务进行合理的计费。传统的计费是基于 VM 的配置和运行时间，但对于相同配置和运行时间的 VM，其资源使用情况可能不同。因此，未来的数据中心将充分利用\
  \ VM 功率计量技术来改进 VM 服务中的计费方案，特别是对于像 `Amazon EC2` 这样的服务。\n\n\n功率预算在现代数据中心中起着重要作用。为了支持更多服务器在数据中心运行而不突破功率上限，引入了功率封顶（power\
  \ capping）技术。问题在于，过多 CPU 密集型 VM 整合到同一台服务器上可能会触发服务器的动态电压频率调整（`DVFS`），导致所有 VM 都会遭受服务器性能的下降。这间接破坏了每个\
  \ VM 的隔离性，延长了任务的运行时间，甚至降低了能量效率。因此，如果不进行 VM 功率预算，VM 整合并不能总是节省能量。对于具有功率封顶服务器的现代数据中心，需要按不同粒度进行功率预算。在\
  \ VM 粒度上，用户可以决定其 VM 将使用多少能量。他们可以预算运行在 VM 内部的应用程序成本。在服务器粒度上，VM 整合将经过合理设计，以便在不违反服务器服务水平协议（`SLA`）或服务质量（`QoS`）的情况下增强资源利用和功率效率。从数据中心层面来看，更多的服务器可以同时运行而不超过数据中心的峰值功率。\n\
  ### 2.1.6.3 节能调度\n\n未来的绿色数据中心离不开良好的节能机制。在 VM 迁移、合并以及空闲服务器关机的研究中，已经研究了许多调度策略。这些调度方法只考虑了部署中的资源限制。事实上，还应该考虑每个\
  \ VM 的能量，以便为数据中心设计节能调度。VM 功率计量提供了一个机会，可以优化现有的功率感知算法，从而在虚拟化云数据中心节省更多能量成本。因此，VM 功率计量具有重要意义，它为我们研究未来绿色云数据中心的新提供了机会。\n\
  ## 2.2 使用可再生能源的绿色大数据中心\n\n近年来，为了满足不断增长的计算资源需求，建立了大量的大数据中心。然而，数据中心强大的服务器的高能耗加剧了已经严重的全球变暖。根据最近的一份报告，`Google`\
  \ 的能耗超过了 `1120 GWh`，花费 `6700 万美元`，`Microsoft` 每年消耗 `600 GWh`，花费 `3600 万美元`。目前数据中心的能耗占\
  \ `1.3%`，预计到 2020 年将达到 `8%`。因此，云数据中心对全球变暖贡献巨大，因为世界上 2/3 的电力是通过燃烧化石燃料产生的。一些互联网服务提供商已经采取措施促进数据中心使用可再生能源。例如，`Google`\
  \ 和 `Yahoo` 已经使用清洁能源为其数据中心供电，占比分别为 `39.4%` 和 `56.4%`。因此，数据中心利用可再生能源进行绿色调度具有意义。然而，考虑到随时间变化的可再生能源供应和波动的电价，设计这样的调度器是困难的。在本节中，我们将讨论如何利用可再生能源使大数据中心绿色化。\n\
  ### 2.2.1 文献综述\n\n绿色数据中心的研究通常分为两类：提高能量效率和利用可再生能源。\n#### 2.2.1.1 提高能量效率\n\n`Xie 等[44]`\
  \ 尝试将 VM 整合到较少的服务器上，使空闲服务器处于睡眠状态。`Srikantaiah 等[45]` 尝试将异构负载整合到较少的服务器上以最小化能耗。`Elnozahy\
  \ 等[13]` 结合了 `DVFS` 和电源开关技术以减少数据中心的总碳排放。`Johan 等[46]` 在变压平台上使用能量优先调度策略减少服务器处理器的功耗。`Gandhi\
  \ 等[47]` 尝试通过 `DVFS` 优化服务器农场的功率分配。`Lin 等[48]` 提出了一种名为动态调整规模的动态功率管理（`DPM`）方案，以减少活跃服务器的数量，从而尽可能减少数据中心的功耗。然而，对于绿色数据中心来说，提高能量效率只能减缓\
  \ IT 碳足迹的增长。\n#### 2.2.1.2 利用可再生能源\n\n\n\n\n事实上，对于云数据中心而言，使用可再生能源是减少碳排放的根本性方法。Zhang\
  \ 等人 [49] 提出了一种名为 GreenWare 的调度器，试图在特定预算内最大化可再生能源的使用。Liu 等人 [50] 尝试通过在特定未使用可再生资源来降低褐色能源的价格。Brown\
  \ 等人 [51] 提出了一种名为 Rerack 的仿真基础设施，可用于评估使用可再生能源的数据中心的成本。Li 等人 [52] 尝试协调工作负载功率与可再生能源的供应，以减少碳足迹。参考文献\
  \ 53 和 54 中的作者构建了一个带有太阳能电池板的演示系统，为一机架服务器供电。基于该系统，他们设计了两个调度器（Green Hadoop 和 Green\
  \ Slot），以便在任务截止日期内最大化可再生能源的使用。事实上，碳排放应该被视为衡量大数据中心绿色程度的指标。下文将介绍一种绿色调度器的架构。它将对传入的请求、服务器以及不同类型能源的使用进行调度，使得在能源成本预算内总碳排放最小化。\n\
  ## 绿色调度器架构 (#13_Chapter02.xhtml_sec2_2_2)\n\n谷歌等互联网服务运营商总在地理分布的地点构建数据中心，以提供高质量且可靠的服务。风能和太阳能是主要的可再生能源，分别占非水电可再生能源的\
  \ 62%和 13%。因此，我们假设模型中的所有数据中心都由太阳能、风能以及传统的褐色能源供电。我们的调度系统架构如图图 2.4 所示 [55]。\n![fig2_4.jpg](img/fig2_4.jpg)\n\
  \n图 2.4 绿色调度器的架构。\n可见，有一个绿色调度器负责将传入的请求调度到由价格波动的间歇性可再生能源供电的数据中心。调度器本身是一个高性能服务器或服务器集群。从调度器到每个数据中心存在传输延迟，不同位置的数据中心延迟也不同。每次调度的输入包括：(1)\
  \ 天气状况（包括温度、太阳光照和风速），用于计算该时段的风能和太阳能供电量；(2) 能源成本总预算；(3) QoS，即请求的最大响应时间；(4) 每个时段的电价；以及(5)\
  \ 每个数据中心的服务器数量。优化目标是在满足能源成本预算内的 QoS 要求等约束条件的前提下，使总碳排放最小。\n\n## 储能设备的使用 (#13_Chapter02.xhtml_sec2_2_3)\n\
  为了进一步减少碳排放，应当考虑储能设备（ESD）。在过去，ESD 通常用作不间断电源（UPS），以便在断电发生时、任何柴油发电机开始供电之前保持数据中心的正常运行。这种转换可能只需要\
  \ 10∼20 秒，而 UPS 中存储的能量可以维持数据中心运行 5∼30 分钟 [56]。这些 UPS 的额外存储容量可用于存储可再生能源，或在电价低时存储电网电，从而通过将\
  \ ESD 作为正常能源供应的一部分，来进一步减少碳排放和总能源成本。因此，我们假设每个数据中心都配备了一些 ESD 来存储能量并在需要时放电。在数据中心使用\
  \ ESD 会为用户请求的调度和能源供应带来了一些挑战性问题。首先，由于 ESD 可以在电价低时存储能量，因此用户请求的调度不仅需要考虑当前电价，还需要考虑 ESD\
  \ 存储能量的价格。其次，由于 ESD 在充/放电过程中存在能量损耗且随着时间推移会自放电，何时充电和何时放电的决策变成了一个随时间的过程。这意味着任何充放电决策都会影响后续时段的决策。我们主要关注在能源成本预算下实现碳排放最小化，这可以建模如下。\n\
  \n### 工作负载模型 (#13_Chapter02.xhtml_sec2_2_3_1)\n由于每个数据中心的服务器都有容量限制，调度的一项约束是确保分配给数据中心的请求不会超过其容量。让\
