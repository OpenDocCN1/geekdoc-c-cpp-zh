  \n\n### 5.3.5.2. 故障处理\n\n\n由于我们使用双检查点算法作为韧性模型，我们成对地考虑处理器。我们的目标是在应用程序结束时（在时间 `te`，如上文讨论的无故障场景）或在发生故障时（例如在时间\
  \ `tf`）重分配处理器对。在每情况下，我们都需要计算剩余工作以及新的预期完成时间。对于在 `j` 个处理器上运行的应用程序 `Ti`，我们需要计算剩余工作和新的预期完成时间。考虑到在\
  \ `j` 个处理器上运行的 `Ti` 在时间 `t` 之前最后一个重分配或故障发生的时间标记为 `tlastRi`，令其数量为 `Ni,j`：\n\n\n考虑应用程序结束的情况：在时间\
  \ `te` 释放 `j` 个处理器上运行的应用程序 `Ti` 的某些处理器。为了减少执行时间，在 `j` 个处理器上运行的 `Ti` 已执行的故障比例为 `(te\
  \ - tlastRi - Ni,jCi,j)/ti,j`。\n\n\n1. 考虑到应用程序 `Ti` 在 `j` 个处理器上运行并在时间 `tf` 发生故障。因此，`Ti`\
  \ 需要从最后一个有效检查点恢复，且自上次重分配或故障以来执行的工作比例对应于每个随后的检查点的周期。我们可以将其表示为 `(Ni,j × (τ,j − Ci,j))/ti,j`。\n\
  2. 在时间 `tf`，考虑执行重分配的应用程序 `Ti′` 从 `j'` 移动到 `j′ − q` 个处理器，其中 `q > 0`。`Ti′` 执行的工作比例可以按照应用程序结束的情况计算：它是\
  \ `(tf − tlastRi′ − Ni′,Ci′,j)/ti′,j`。\n最后，对于任何遭受重分配或故障的应用程序，令 `αi` 为 `Ti` 需要执行的剩余比例，即\
  \ 1 减去 `tlastRi` 之前执行的工作比例以及上述比例之和。\n\n与无故障场景类似，`RCij→k` 表示应用程序 `Ti` 从 `j` 个处理器移动到\
  \ `k` 个处理器时的重分配成本。重分配现在可以为 `Ti` 增加 `(k > j)` 或移除 `(k < j)` 个处理器，其成本表示为：\n$$\\mathit{RC}_{i}^{j\\\
  rightarrow k} = S + \\max(\\min(j,k),|k - j|) \\times \\left( {\\frac{m_{i}}{kj\\\
  tau} + \\text{β}} \\right).}\\qquad(5.11)$$\n\n\n对于故障应用程序 `Ti`，`tlastRi` 的新值因此变为\
  \ `t[lastR[i]] = t + D + R[i, j] + RC[i]^(j → k) + C[i, k]`（我们需要考虑停机和恢复时间）。然而，`Ti'`\
  \ 正在执行重分布，但它没有发生故障，它可以在时间 `t` 开始重分布：要么它在应用程序结束后获取了新的可用处理器，要么它在使用较少的处理器并执行其重分布。在所有情况下，我们都有\
  \ `t[lastR[i^′]] = t + RC[i′]^(j′ → k′) + C[i′, k′]`。注意，我们可以让处理器同时参与两个重分布，因为它们只会从故障应用程序\
  \ `Ti` 的其他处理器接收数据，并向非故障应用程序 `Ti′` 的其他处理器发送数据。我们假设发送和接收可以并行完成且不会变慢。\n\n最后，更新了 `tlastRi`\
  \ 的应用程序 `Ti`，其预期完成时间变为 `t[i]^(U) = t[lastR[i]] + t[i, k]^(R)(α[i])`，其中 `k` 是执行 `Ti`\
  \ 的新处理器数量，`αi` 是剩余工作百分比。与无故障场景类似，只有当新的预期完成时间 `tiU` 低于不进行重分布的时间时，我们才为应用程序提供额外的处理器。\n\
  注意，我们认为不能纳入尚未完成当前重分布的处理器，也就是说，如果在图 5.3 中的 `t` 和 `tlastRi′` 之间发生了事件，则参与 `Ti` 和 `Ti′`\
  \ 的处理器不能用于新的重分布。\n\n### 5.3.6 优化问题\n我们考虑两个优化问题。\n\n通用问题是在无故障且无重分布的背景下构建构建最多 `k`\
  \ 个任务的包。最通用的问题是 `k = p`，但在某些框架中，每个包内的最大任务数可能有一个上界 `k < p`。\n**定义 5.1 (k-IN-p-COSCHEDULE)**\n\
  \n给定一个固定常数 `k ≤ p`，找到一个每个包最多包含 `k` 个任务的协同调度（co-schedule），以使执行时间最小化。\n在考虑故障和重分布时，我们关注由\
  \ `n` 个应用程序组成的单个包。\n\n**定义 5.2 (RESILIENT-COSCHED-1PACK)**\n给定 `n` 个可伸缩应用程序 `{T1,\
  \ … , Tn}`、它们的加速特性（speedup profiles）以及一个具有 `p` 个相同处理器且单个故障速率为 `λ` 的执行平台，最小化所有应用程序预期完成时间的最大值。仅当应用程序完成执行或发生故障时（其成本在第\
  \ 5.3.5 节中指定）允许重分布。\n\n## 5.4 理论分析\n在本节中，我们首先关注无故障、无检查点场景下的问题。我们在第 5.4.1 节中通过展示多项式实例和\
  \ NP-完全实例来讨论该问题的复杂性。接下来，我们讨论如何在单个包中优化地调度一组 `k` 个任务（第 5.4.2 节），分别在无故障场景和考虑故障但不进行任何重分布的场景下。然后，再次专注于无故障场景，我们在第\
  \ 5.4.3 节中解释如何计算 `k-IN-p-COSCHEDULE` 的最优解（以预期指数代价计算），并在第 5.4.4 节中提供一种近似算法。最后，我们在第\
  \ 5.4.5 节中证明在考虑故障并执行重分布时，问题 `RESILIENT-COSCHED-1PACK` 具有 NP-完全性。\n\n### 5.4.1 复杂性\n\
  **定理 5.1**\n\n`1-IN-p-COSCHEDULE` 和 `2-IN-p-COSCHEDULE` 问题均可以在多项式时间内解决。\n*证明。* 该结果对于\
  \ `1-IN-p-COSCHEDULE` 是显而易见的：每个任务被分配了正好 `p` 个处理器（见公式 5.1），且最小执行时间为 ![inline91-01.jpg](img/inline91-01.jpg)。\n\
  \n`2-IN-p-COSCHEDULE` 的证明更为复杂，我们从 `2-IN-2-COSCHEDULE` 问题开始以获得直觉。考虑权无向图 `G = (V,\
  \ E)`，其中 `|V| = n`，每个顶点 `vi∈V` 对应一个任务 `Ti`。边集 `E` 如下：(i) 对于所有 `i`，`vi` 上有一个权重为 `ti,2`\
  \ 的自环；(ii) 对于所有 `i < i′`，`vi` 和 `vi′` 之间有一条权重为 `max(t[i, 1], t[i′, 1])` 的边。在 `G`\
  \ 中寻找最小权重完美匹配即可得到 `2-IN-2-COSCHEDULE` 的最优解，因此可以在多项式时间内解决。\n对于 `2-IN-p-COSCHEDULE`\
  \ 问题，证明类似，唯一的区别在于边集 `E` 的构造：(i) 对于所有 `i`，`vi` 上有一个权重为 `ti,p` 的自环；(ii) 对于所有 `i <\
  \ i′`，`vi` 和 `vi′` 之间有一条权重为 `min[t[i, j], t[i′, j]]` 的边（对于 `j=1..p`）。在 `G` 中寻找最小权重完美匹配即可得到\
  \ `2-IN-p-COSCHEDULE` 的最优解。我们得出结论 `2-IN-p-COSCHEDULE` 可以在多项式时间内解决。\n\n![square](img/square.jpg)\n\
  **定理 5.2**\n\n当 `k ≥ 3` 时，`k-IN-p-COSCHEDULE` 是强 NP-完全的。\n![page92-01](img/page92-01.jpg)\n\
  \n#### 5.4.2 调度任务包\n在本节中，我们讨论如何在单个包中优化地调度一组 `k` 个任务（第 5.4.2 节），分别在无故障场景和考虑故障但不进行任何重分布的场景下。\n\
  \n**定理 5.3**\n给定要在 `p` 个处理器上调度的 `k` 个任务，`Algorithm 5.1` 在 `O(p log k)` 时间内找到一个 1-包调度方案。\n\
  \n\n\n\n定理 5.3 的证明。令 `σ` 为算法 5.1 返回的 1-包调度，其代价为 `c(σ)`，令 `Ti⋆` 为一个满足 `c(σ) = ti⋆,σ(i⋆)`\
  \ 的任务。令 `σ′` 为代价为 `c(σ')` 的 1-包调度。我们将在下方证明 `c(σ') ≥ c(σ)`；因此，`σ` 是最小代价的 1-包调度：\n\
  1.  如果 `σ′(i⋆) ≤ σ(i⋆)`，则 `Ti⋆` 在 `σ′` 中的处理器少于在 `σ` 中的；因此，其执行时间更长，且 `c(σ') ≥ c(σ)`。\n\
  \n2.  如果 `σ′(i⋆) > σ(i⋆)`，则存在 `i` 使得 `σ′(i) < σ(i)`（因为在 `σ` 和 `σ′` 中处理器总数均为 `p`）。我们可以在上一次迭代结束时应用之前的引理，此时\
  \ `Ti⋆` 是执行时间最大的任务：`ti⋆,σ(i⋆) ≤ ti,σ(i) − 1 ≤ ti,σ′(i)`，因此 `c(σ') ≥ c(σ)`。\n最后，时间复杂度\
  \ get 如下：首先，我们对 `k` 个元素进行排序，耗时为 `O(klogk)`。然后有 `p − k` 次迭代，在每次迭代中，我们在一个包含 `k − 1`\
  \ 个元素的有序列表中插入一个元素，这需要 `O(log k)` 次（使用堆作为 `L` 的数据结构）。\n\n![square](img/square.jpg)\n\
  注意，使用动态规划算法很容易计算出最优 1-包调度：最优代价为 `c(k,p)`，我们使用以下递归公式进行计算：\n\n$$c(i,q) = \\min\\limits_{1\
  \ \\leq {q'} \\leq q}\\left\\{ \\max(c(i - 1,q - {q'}),t_{i,{q'}}) \\right\\}$$$\n\
  其中 `2 ≤ i ≤ k`  `1 ≤ q ≤ p`，初始化条件为 `c(1,q) = t1,q` 和 `c(i,0) = +∞`。该算法的复杂度为 `O(kp2)`。然而，通过使用算法\
  \ 5.1，我们可以显著降低该算法的复杂度。\n\n### 带故障的情况\n\n#### 定理 5.4\n不带重分布的 RESILIENT-COSCHED-1PACK\
  \ 问题可以在多项式时间 `O(n)` 内求解，其中 `n` 是应用程序的数量。\n我们将 `ti,j` 替换为 `ti,jR(1)`，并且不是一个一个地添加处理器，而是两个两个地添加。\n\
  \n### 5.4.3 k-IN-p-COSCHEDULE 的最优解\n在本节中，我们概述了两种寻找通用 k-IN-p-COSCHEDULE 问题最优解的方法。这对于解决一些规模较小的实例很有用，尽管代价相对于任务数量\
  \ `n` 是指数增长的。\n\n第一种方法是生成任务划分成包的所有可能划分。这等于计算将 `n` 划分为规模最多为 `k` 的子集的所有划分。对于给定的任务划分，我们使用算法\
  \ 5.1 为每个包找到最优处理器分配，并且我们可以计算出该划分的最优代价。我们仍然需要计算所有划分中这些代价的极值。\n第二种方法是将问题转化为整数规划：\n\
  \n#### 定理 5.5\n\n![eq5_12](img/eq5_12.jpg)\n\n\n![square](img/square.jpg)\n\n\n\
  在本节中，我们引入 `pack-Approx`，一种针对 p-IN-p-COSCHEDULE 问题的 3-近似算法：如果 `COSTopt` 是最优代价，`COSTalgo`\
  \ 是算法的输出，则 `COSTalgo ≤ 3COSTopt`。`pack-Approx` 的设计原理是：我们从每个任务分配一个处理器的开始，使用算法 5.2\
  \ 构建一个调度表。算法 5.2 是一种贪心算法，用于调度表。以下是两种算法的细节：\n\n带预分配处理器的 k-IN-p-COSCHEDULE 问题仍然是完全复杂的（参考定理\
  \ 5.2 的证明）。我们在算法 5.2 中提出了一种类似于装箱递减的贪心过程 [29]]。其输出是一个每个包最多 `k` 个任务的调度表，复杂度为 `O(n\
  \ log n)`。\n\n算法 5.3\n\n\n\n我们可以轻松构建示例来展示在允许重分配时 `RESILIENT-COSCHED-1PACK` 的困难，即使在没有故障的情况下也是：(i)\
  \ `Algorithm 5.1` 不再是最优的，因为它可能会将处理器分配给一个加速性能较差的应用程序（即它从额外的处理器中获得的益处不多）；以及 (ii) 将剩余处理器分配给加速性能最佳的应用程序的贪心变体也会导致非最优调度（详情请参见[参考文献\
  \ 25]）。直观地说，这些较小的示例表明，当考虑到重分配时，即使成本为零，`RESILIENT-COSCHED-1PACK` 似乎具有组合性质。\n\n为了确定带有重分配问题的复杂性，我们考虑没有故障的简单情况。因此，重分配仅发生在应用程序结束时，任何应用程序的处理器数量变化最多为其数量的\
  \ `n` 倍，其中 `n` 是应用程序的总数。我们进一步考虑重分配成本为等于 `S` 的常数，即在[Equation 5.11] 中令 `β = 0` 且 `τ\
  \ = +∞`。即使在这个简化的场景下，该问题也是 NP 完全完全的：\n### 定理 5.7\n在重分配成本固定且没有故障的情况下，`RESILIENT-COSCHED-1PACK`\
  \ 是 NP-完全的（强意义）。\n\n\n### 备注\n我们推测 `RESILIENT-COSCHED-1PACK` 在重分配成本为零时仍然是 NP-完全的。这是由于示例暗示的组合探索。但这仍然是一个开放性问题！\n\
  ## 5.5 启发式算法与仿真\n在本节中，我们引入并评估了多项式时间启发式算法，用于解决包含故障和重分配的通用 `RESILIENT-COSCHED-1PACK`\
  \ 问题。在执行任何重分配之前，我们需要为 `n` 个应用程序选择 `p` 个处理器的初始分配方案。我们使用不带重分配的最优算法 `Algorithm 5.1`。注意，针对\
  \ `k-IN-p-COSCHEDULE` 通用问题的启发式算法可以在[参考文献 3]中找到，并带有相应的评估。\n\n\n### 5.5.1 通用结构\n所有启发式算法共享相同的骨架：我们遍历每个事件（无论是故障还是应用程序终止），直到总剩余工作量等于零。如果某些应用程序仍在之前的重分配中运行（即当前时间\
  \ `t` 小于这些应用程序的 `tlastRi`），则我们将在下一次重分配中排除它们，并在当前重分配完成后将它们重新加入应用程序列表。如果一个应用程序结束，我们将按照[Section\
  \ 5.5.2]中讨论的那样重分配可用处理器。然后，如果发生了故障，我们将计算故障应用程序的新预期执行时间。同时，我们从列表中移除在 `tlastRf` 之前结束的应用程序，并释放它们的处理器。\n\
  之后，我们必须在尝试重分配或什么都不做之间做出选择。如果故障应用程序不是最长的应用程序，则总执行时间自上次重分配以来没有变化。因此，因为这是我们能够达到的最佳执行时间，没有必要尝试改进它。然而，如果故障应用程序是最长的应用程序，我们将应用启发式算法来重分配处理器（参见[Section\
  \ 5.5.3]）。\n\n### 5.5.2 应用程序结束时的重分配\n\n与其仅使用局部决策在时间 `t` 重分配可用处理器，不如再次使用贪心算法 `Algorithm\
  \ 5.1` 重新计算一个完全新的调度，但进一步考虑了重分配的成本。这种启发式算法被称为 `ENDGREEDY`。现在，我们需要计算每个应用程序的剩余工作比例，并获得每个应用程序映射到两个处理器上时的预期完成时间估计。类似于\
  \ `Algorithm 5.1`，我们随后在可以改进它的情况下为最长的应用程序添加两个处理器，同时考虑重分配成本。\n\n\n### 5.5.3 发生故障时的重分配\n\
  与应用程序结束的情况类似，我们提出了两种启发式算法以便在发生故障时进行重分配。第一种 `SHORTESTAPPLICATIONSFIRST` 仅采取局部决策。首先，如果故障应用程序是可以改进的，我们将\
  \ `k` 个可用处理器（如果有的话）分配给该应用程序。然后，如果故障应用程序仍可改进，我们尝试从调度中的最短应用程序（标记为 `Ts`）中提取处理器，并将这些处理器交给故障应用程序，直到故障应用程序不再可以改进，或者没有更多处理器可以从其他应用程序提取。只有当应用程序的新执行时间小于故障应用程序的执行时间时，我们才从该应用程序中提取处理器。\n\
  第二种启发式算法 `ITERATEDGREEDY` 使用贪心算法的修改版本，每次发生故障时都会初始化调度（`Algorithm 5.1`），同时考虑重分配的成本。这种做法与[Section\
  \ 5.5.2]中解释的 `ENDGREEDY` 重分配类似，但我们需要特殊处理故障应用程序以更新 `αf` 和 `tlastRf` 的值。\n\n### 5.5.4\
  \ 仿真设置\n\n\n\n为了评估启发式算法的质量，我们使用真实参数进行了多次仿真。第一步是生成故障分布：我们使用了在参考文献 31 和 32 中开发的现有故障模拟器。在我们的案例中，我们使用的参数\
  \ `λ` 服从指数律的模拟器。第二步是为每个应用程序生成无故障执行时间（`ti,j` 值）。我们使用合成模型来生成执行概况，以表示一组大量的科学应用。我们使用的应用模型是一个经典模型，类似于参考文献\
  \ 3 中使用的模型。对于规模为 `m` 的问题，我们定义顺序时间：`t(m,1) = 2 × m × log2(m)`。然后我们可以定义在 `q` 个处理器上的并行执行时间：\n\
  \n$${t(m,q) = f \\times t(m,1) + (1 - f)\\frac{t(m,1)}{q} + \\frac{m}{q}\\log_{2}(m).}\\\
  qquad(5.13)$$\n参数 `f` 是顺序执行的时间比例，我们将其固定为 `f = 0.08`。因此，92%的时间被认为是并行的。因子 `(m/q)log2(m)`\
  \ 代表由于通信和同步带来的开销。最后，我们有 `ti,j(mi) = t(mi,j)`，其中 `ti,j(mi)` 是应用 `Ti` 在 `j` 个相同处理器上处理规模为\
  \ `mi` 的问题的执行时间。\n\n最后，我们为每个应用 `Ti` 分配一个数据量 `mi` 的随机值，使得：`minf ≤ mi ≤ msup`。我们设置\
  \ `minf = 1,500,000` 和 `msup = 2,500,000`，以确保执行时间足够长，使得执行期间可能会发生多次故障。在这样的 `msup`\
  \ 值下，无故障执行中的最长执行时间约为 100 天。我们还考虑了两种不同的数据分布情况：(i) `minf = 1,500` 的高度异构性，以及 (ii) `minf\
  \ = 2,499,000` 的同质性，这些分布的详细结果可以在参考文献 25 中找到。\n具有 `j` 个处理器的应用 `Ti` 的检查点成本为 `Ci,j\
  \ = Ci/j`，其中 `Ci` 与应用程序的内存占用成比例。我们有 `Ci = mi × c`，其中 `c` 是检查一个规模为 `mi` 的数据单元所需的时间。除非另有说明，默认值为\
  \ `c = 1`。同步成本值 `S` 在后续所有实验中固定为 `S = 0`。最后，除非另有说明，单个处理器的 MTBF（平均无故障时间）固定为 100 年。\n\
  \n请注意，我们假设故障发生在检查点期间，但不在停机期间、恢复期间以及处理器执行某些重分配期间。\n### 5.5.5 结果\n\n为了评估这些启发式算法，我们将每个算法执行了\
  \ 50 次，并计算平均跨度时间（makespan），即包中的最长执行时间。我们将启发式算法获得的跨度时间与两种情况进行比较：(i) 无任何重分配的故障背景下（最坏情况），以及\
  \ (ii) 带有重分配的无故障背景下（最好情况）。\n### 5.5.5.1 在无故障背景下的性能\n\n图 5.4 显示了 `n` 对无故障执行的影响。我们将跨度时间通过在无任何重分配的故障背景下获得的跨度时间进行归一化，这是预期的。我们从参考文献\
  \ 25 中看到，应用的顺序时间比例 `f` 对性能也有影响：正如预期，重分配是高效的。\n### 5.5.5.2 n 的影响\n\n图 5.5 显示了 `n`\
  \ 对无故障执行的影响。我们从参考文献 25 中看到，应用的顺序时间比例 `f` 对性能也有影响：正如预期，重分配是高效的。\n### 5.5.5.3 MTBF\
  \ 的影响\n\n图 5.6 显示了 `MTBF` 对重分配的影响。我们将处理器的 MTBF 在 5 到 125 年之间变化。当 `MTBF` 减小时，故障数量增加；因此，两种启发式算法的性能均会下降。\n\
  ### 5.5.5.4 检查点成本的影响\n\n图 5.7 显示了在具有 100 个应用和 1000 个处理器的平台上检查点成本的影响。为此，我们在图 5.7\
  \ 中将检查点成本乘以 `c`。当 `c` 减小时，启发式算法的性能会提高，且无故障背景与故障背景之间的执行时间差距会变小。\n\n\n\n\n最后，我们指出，所有四种启发式算法运行需几秒钟，而应用程序的总执行时间需要几天；因此，即使是成本较高的组合\
  \ `ITERATEDGREEDY-ENDGREEDY` 产生的开销也是忽略不计的。\n\n\n在本章中，我们提供了理论结果来评估无故障场景下通用划分问题的复杂度；当一个数据包至少包含三个任务时，该问题是\
  \ `NP-complete`（NP 完全）的，我们提供了一种近似算法。在考虑故障的情况下，我们设计了一个详细且全面的模型，用于在易故障平台上对单个数据包的应用进行调度，并包含处理器重新分配。我们引入了一种贪心多项式时间算法，在存在故障但不允许处理器重新分配或无故障场景时，该算法可返回单个数据包的最优解。我们证明了在考虑重新分配的情况下，寻找最小化执行时间的调度方案在强意义上是\
  \ `NP-complete` 的，即使在重新分配成本固定且没有故障的情况下也是。最后，我们提供了几种多项式时间启发式算法，以便在每次故障或应用结束执行释放处理器时高效地重新分配处理器。这些启发式算法通过了大量的仿真测试，结果证明了它们的实用性：通过重新分配可以显著提高执行效率。\n\
