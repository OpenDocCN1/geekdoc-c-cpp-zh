  \ MHz | 1 cores 0.8 V/400 MHz | 48 cores 0.8 V/400 MHz | 48 cores 0.8 V/400 MHz\
  \ | 48 cores 0.9 V/533 MHz |\n\n## 8.6 在 Intel® Xeon® Phi™ 上的并行 BP 神经网络\n\n### 8.6.1\
  \ Intel® Xeon® Phi™ 简介\n\nIntel® 多集成核心 (Intel® MIC) 架构将许多 Intel CPU 核心集成到单个芯片上以实现高并行性\
  \ (Chrysos 2014)。在我们的研究中，我们在 Intel® Xeon® Phi™ 5110P 和 Intel® Xeon® Phi™ 7120P 协处理器上实现了\
  \ BP 神经网络。`Table 8.2` 汇总了这两个协处理器的规格。\n\n表 8.2\n\nIntel® Xeon® Phi™ 5110P 和 Intel®\
  \ Xeon® Phi™ 7120P 规格\n\n| | Intel® Xeon® Phi™ 7120P | Intel® Xeon® Phi™ 5110P |\n\
  | --- | --- | --- |\n| 核心数 | 61 | 60 |\n| 处理器睿频 | 1.238 GHz | 1.053 GHz |\n| 最大睿频\
  \ | 1.333 GHz | N/A |\n| TDP | 300 W | 225 W |\n\n`Figure 8.9` 显示了 Intel® Xeon®\
  \ Phi™ 协处理器的架构。该协处理器主要由处理核心、缓存、内存控制器和 PCIe 客户端逻辑组成 (Chrysos 2014)。所有核心以环形拓扑结构相互连接。每个核心支持最多四个硬件线程。Intel®\
  \ MIC 架构有两种常见的编程模型：原生编程模型和异构卸载模型。\n\n- **卸载模式 (Offload Mode)**：指的是从主处理器运行的角度编写程序，并将主处理器的部分工作卸载到一个或多个\
  \ Intel® Xeon® Phi™ 协处理器上。程序最初在主机处理器（通常是 Xeon 处理器）上启动。然后根据代码中的用户定义（基于指令），将部分代码分配到协处理器上执行。其关键特征是，编译后的二进制文件无论是否存在协处理器都可以运行\
  \ (Jeffers and Reinders 2013)。\n\n- **原生模式 (Native Mode)**：由于 Intel® Xeon® Phi™\
  \ 内部托管了一个 Linux 微操作系统，并可以像集群中的另一个节点一样作为机器连接到主机，用户可以将协处理器视为另一个计算机节点。如果需要原生运行，应用程序必须为\
  \ Xeon® Phi 运行环境进行交叉编译。\n\n![fig8_9.jpg](img/fig8_9.jpg)\n\n图 8.9 Intel® Xeon® Phi™\
  \ 协处理器的架构。\n\n与卸载模式相比，原生模式更适用于主要执行映射到线程或向量并行操作、且不涉及大量 I/O 操作的程序。\n\n### 8.6.2 测试结果\n\
  \n在本次实验中，在 Intel® Xeon® Phi™ 5110P 和 Intel® Xeon® Phi™ 7120P 上测试了 BP 神经网络。结果如 `Figure\
  \ 8.10` 和 `Figure 8.11` 所示。\n\n\n\n\n\n图 8.14 和 8.15 展示了在乘法测试用例下，在 Xeon® Phi™ 5110P\
  \ 平台上改变线程数时，执行时间和加速比的变化。由于采用了相同的神经网络架构和相同的训练结束条件，乘法的性能与加法的性能几乎相同。当线程数为 240 时，加速比达到最大值。相应地，当线程数为\
  \ 240 个时，执行时间最短。因此，省略了 7120P 平台上的结果。\n\n![fig8_14.jpg](img/fig8_14.jpg)\n图 8.14\
  \ Xeon® Phi™ 5110P 上乘法的执行时间与线程数的关系。\n\n![fig8_15.jpg](img/fig8_15.jpg)\n图 8.15 Xeon®\
  \ Phi™ 5110P 上乘法的加速比与线程数的关系。\n\n## 8.7 结论\n\n随着机器学习技术被广泛应用于大数据处理，如何在新兴的多核平台上高效地运行这些算法已成为研究人员和软件开发者的关注点。在这项工作中，我们研究了\
  \ BP 神经网络在创新 Intel® SCC 和 Intel® Xeon® Phi™ 平台上的性能。我们可以得出结论：在 SCC 和 Intel MIC 上对\
  \ BP 神经网络进行并行处理有助于提高数据处理性能。研究人员可以在多核平台上实现处理数据的机器学习算法以获得加速比。此外，如果功耗/节能是处理大数据时的关键因素，则可以在多核平台上采用\
  \ `DVFS` 来搜索满足功耗/能量要求的合适配置。\n\n## 8.8 致谢\n\n我们感谢 Intel 实验室提供 SCC，感谢国家计算科学研究所（National\
