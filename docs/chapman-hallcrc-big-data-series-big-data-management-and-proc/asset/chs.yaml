  ### 6.4.2 使用优化方法基于 SLA 的 MapReduce 任务资源管理\n\n\n## 6.4.3 基于约束规划的 MapReduce 资源管理技术\n\
  \n\n### 6.4.4 基于约束规划的 Hadoop 调度器\n\n\n### 6.4.5 其他技术\n\n\n## 致谢\n\n\n对于各种类型的企业级、科学应用以及信息物理系统（如配备传感器的桥梁、智能建筑和工业机械），处理和分析数据对于获取洞察和做出有意义的决策至关重要。然而，分析的数据有时非常巨大，传统的处理工具和技术无法用于分析此类大数据。Google\
  \ 提出了一种名为 `MapReduce` 的编程模型，以简化大规模分布式并行处理，从而高效地处理和分析巨大且复杂的数据。`Hadoop` 作为 MapReduce\
  \ 编程模型的流行实现被许多公司和机构使用，通常结合云计算执行各种大数据应用，包括网络分析应用、科学应用、数据挖掘应用和企业数据处理应用。本章的重点是描述用于处理\
  \ MapReduce 任务的有效资源管理算法和技术，包括带有完成截止期限的 MapReduce 任务。有效的资源管理策略对于处理提交到系统的 MapReduce\
  \ 任务、实现用户满意以及高系统性能至关重要，其中高服务质量体现在低比例的错过截止任务、较短的任务响应时间、高任务吞吐量以及高资源利用率上。\n\n\n现代大规模处理系统必须能够处理当今世界中流行的大量数据（通常被称为大数据）。例如，企业以及学术和研究机构每天可以产生数\
  \ TB（太字节）的数据 [1]，并在其系统中存储数 PB（拍字节，250 字节）的数据 [2]。当今世界数据的泛普及源于来自各种行业和机构的众多数据源，包括：\n\
  \n* 工业/组织数据（例如财务数据、制造数据、零售数据）\n* 商业智能数据（例如销售数据、客户行为数据、产品数据）\n* 系统数据（例如系统日志、网络日志、状态文件）\n\
  此外，随着物联网（IoT）范式的出现导致了智能设施和信息物理系统（如配备传感器的桥梁、智能建筑和工业机械）的流行，一种大数据源（例如来自传感器的数据）应运而生。在各种环境中，包括企业级、科学应用以及信息物理系统，分析这些大数据以做出有意义的决策并获取知识和洞察是非常重要的。然而，所分析的数据量太大，传统的处理工具和技术无法高效处理。处理大数据的主要问题之一是从硬盘中读取数据的速率（访问速度）是一个瓶颈。多年来，硬盘容量呈指数级增长。相比之下，硬盘的访问速度增长速度较慢。例如，硬盘容量超过\
  \ 1 TB 是很常见的，但访问速度通常仅为 100 MB/s [2]。这意味着从硬盘中读取 1 TB 数据可能需要超过 2.5 小时。解决此问题并提高性能的一种解决方案是使用并行性。与其从单个硬盘读取\
  \ 1 TB 数据，不如从 1000 块硬盘上并行读取 1 GB 的数据分数据。通过利用 1000 块硬盘的并行性，读取 1 TB 数据可以在快得多的时间内完成：100\
  \ 秒，而不是 2.5 小时。然而，使用并行性面临许多挑战，包括如何在不同机器之间进行通信和协调，以及如何处理和恢复机器故障。此外，开发和调试/测试分布式（并行）应用程序比开发在单机上运行的应用程序要困难得多。\n\
  \n\n\n\n# MapReduce\nMapReduce [1] 最初由 Google 提出，是一种编程模型，其目的是简化大规模分布式并行处理，以便能够高效地处理和分析巨大且复杂数据集（在第\
  \ 6.2.1 节 中详细讨论）。在处理海量数据时，需要将计算分布在多台机器上以实现并行处理并缩短整体处理时间。MapReduce 是一种流行的并行处理模型，通常与云计算结合以促进大数据分析\
  \ [3–5]，这可能包括处理 Web 分析应用、科学应用、社交网络和企业数据。许多公司和机构还将其 MapReduce 用于各种其他应用，包括大规模数据处理（例如排序、索引和分组）、数据挖掘（例如网络爬虫）、人工智能（例如机器学习）以及科学研究（例如生物信息学）\
  \ [5]。例如，Google 之前曾使用 MapReduce 应用分析网页文档，为其网页搜索引擎生成搜索索引；而 Facebook 则使用 MapReduce\
  \ 分析其用户活动以及网站上广告的成功率 [6]。最近，带有相关完成截止日期的 MapReduce 作业对于延迟敏感型应用变得非常重要，例如用于实时业务智能、个性化广告、垃圾邮件/欺诈检测、事件日志实时分析以及各种额外的实时数据分析应用\
  \ [7]。业务智能是指分析业务或机构的原始数据，以便制定明智且有效的业务策略。事件日志分析涉及处理事件日志以寻找特定模式、过滤事件发生并将相似的事件发生分组在一起。此类事件日志分析可用于各种具有事件监控器（用于收集并信号事件发生）的计算系统，包括操作系统、数据库管理系统和信息物理系统。更广泛地说，允许用户指定作业截止日期允许资源管理器对作业进行优先级排序，并确保时间敏感型作业按时完成。在某些情况下，分析最新数据并及时接收结果（例如实时）是理想的，以便做出最佳决策。因此，各公司和机构通常会将\
  \ MapReduce 作业提交到集群或云端进行处理。在这两种场景下，都需要一种资源管理中间件来高效、智能地执行提交的 MapReduce 作业。\n\n本章的重点是描述用于\
  \ MapReduce 作业管理的有效算法和技术，包括以服务水平协议（SLA）为特征的作业。SLA 定义了服务请求者与服务提供者之间关于请求服务质量（QoS）的的\
  \ [8]。SLA 可能随应用而异，但带有 SLA 的请求通常会导致提前预留请求 [9]，其特征是最早开始时间、所需的执行时间和端到端的完成截止日期。Amazon\
  \ 和 Microsoft 等公有云服务提供商部署了包含大量资源池的数据中心。此外，许多企业和机构拥有自己的私有云，用于 IT 管理、数据处理操作和促进研究。无论部署的是哪种云，有效且智能的资源管理对于利用底层分布式硬件的力量并实现高系统性能都是必要的\
  \ [10]，这包括高作业吞吐量、低作业响应时间、资源的高效利用，以及反映在低错过截止日期作业比例上的高 QoS 等。\n对于开放流 MapReduce 作业的资源管理是一个复杂问题，这些作业包含多个执行阶段，每个阶段又包含多个任务，具有许多具有挑战性的问题，包括如何设计有效技术来执行匹配（matchmaking）和调度，以确保提交的作业符合其\
  \ SLA 要求。匹配和调度（统称为映射）是部署在云资源管理中间件中的资源管理器执行的两个关键操作。当来自用户的入站请求（或作业）到达时，资源管理器会调用匹配算法，从给定的资源池中选择一个（或多个）资源分配给该请求。一旦将若干请求分配给特定资源，将使用调度算法来确定分配给该资源的请求执行顺序。匹配和调度是一个众知的计算困难型（NP-hard）问题，当必须满足用户通常在\
  \ SLA 中捕的 QoS 要求，同时又要实现服务提供者的预期系统目标（例如产生高收入和维持高资源利用率）时，该问题变得更难解决。此外，当考虑带有 SLA 的开放流请求以及需要多个系统资源处理的请求时，资源管理问题的复杂性会显著增加。有效管理用于执行\
  \ MapReduce 应用的资源对于实现用户满意以及高系统利用率至关重要，这也是本章的关注重点。\n\n本章其余部分的结构如下：在第 6.2 节中，提供了 MapReduce\
  \ 和 Hadoop（MapReduce 编程模型的流行实现）的背景信息。第 6.3 节描述了专注于 MapReduce 作业处理各个方面的资源管理技术，包括缩短作业时间和减少执行作业资源的能量消耗。接下来，在第\
  \ 6.4 节中，介绍了带截止日期的 MapReduce 作业的资源管理技术。最后，第 6.5 节总结了本章并提供了未来的工作方向。\n## 6.2 背景](#17_Chapter06.xhtml_sec6_2)\n\
  \n本节介绍了与本章相关的概念和技术的背景信息。\n### 6.2.1 MapReduce](#17_Chapter06.xhtml_sec6_2_1)\n\n\
  \n\n\nMapReduce 应用（或作业）的特点是具有多个执行阶段，每个阶段都包含多个任务 [1]，如图图 6.1 所示。许多计算可以使用 MapReduce\
  \ 编程模型来表示。一个经典的例子是 URL 访问频率分析应用，它通过处理 Web 服务器的日志来统计不同 URL 的访问次数 [1]。该应用是著名的 WordCount\
  \ MapReduce 应用的变体。需要处理的输入是 Web 服务器的日志。第一步是将输入数据分成默认大小为 64 MB 的块，这些块被称为分片（splits，参见图\
  \ 6.1）。接下来，在 map 阶段（map phase）中，会创建执行用户自定义 `mapper` 函数的 map 任务，以处理输入数据的每个分区（即分片）。注意，map\
  \ 任务之间是相互独立的，可以并行执行，并且可能在不同的资源上运行。在 URL 访问频率应用中，mapper 函数读取日志中的每个 URL，并生成一组格式为 `{URL,\
  \ 1}` 的中间键值对。该键值对表示发现了一个特定 URL 的一个实例。map 阶段生成的中间数据集中可能包含多个重复的键值对。例如，键值对 `{`[`www.carleton.ca`](http://www.carleton.ca)`,\
  \ 1}` 可能会在中间数据集中出现多次。接下来，在 shuffle 阶段（shuffle phase）中，具有相同键的中间键值对会被分组在一起，如图图 6.1\
  \ 所示。排序后的中间键值对随后会被传递到 reduce 阶段（reduce phase）。在 reduce 阶段，执行用户自定义 `reducer` 函数的\
  \ reduce 任务会处理中间键值对，以产生最终输出。最终输出通常是原始输入数据的聚合或摘要，并且比原始输入数据更小且更有意义。与 map 阶段类似，reduce\
  \ 任务之间也是相互独立的，可以并行执行，并且可能在不同的资源上运行。注意，在所有 map 任务执行完成之前，reduce 任务无法完成其执行。在 URL 访问频率应用中，reducer\
  \ 函数对所有具有相同键的值求和，以输出输出数据集：`{URL, total count}`。因此，最终输出将是 URL 列表以及每个 URL 被访问的总次数列表。\n\
  ![fig6_1.jpg](img/fig6_1.jpg)\n\n图 6.1 MapReduce 作业示例。\n### 6.2.2 Apache Hadoop\n\
  \nApache Hadoop [11] 是一个开源软件框架（用 Java 编写），实现了 MapReduce 编程模型（在第 6.2.1 节中讨论）。Hadoop\
  \ 设计用于执行数据密集型分布式计算应用（即大数据应用），例如 Web 分析应用、科学应用以及处理来自社交网络或企业数据的应用 [3,12]。Hadoop 由三个主要的子框架组成：Hadoop\
  \ Common、Hadoop 分布式文件系统 (HDFS) 和 Hadoop MapReduce。Hadoop Common 提供了实用函数，包括远程过程调用\
  \ (RPC) 设施和对象序列化库，HDFS 和 MapReduce 框架利用这些功能。HDFS 是分布式文件系统的实现，基于 Google 的分布式文件系统，命名为\
  \ `GFS`（Google File System）[13]。HDFS 为 Hadoop 作业所需的输入数据提供冗余存储，它还存储了 Hadoop 作业生成的中间数据和输出数据。\n\
  运行 Hadoop 的一组机器（每台机器称为一个节点）被称为 Hadoop 集群（参见图 6.2）。典型的 Hadoop 集群包含一个主节点（master node）和一个或多个从节点（slave\
  \ nodes）。主节点负责维护 HDFS 并分配 MapReduce 任务给从节点执行。从节点执行主节点分配给它们的工作（例如，读/写到 HDFS 或执行 MapReduce\
  \ 任务）。在原始的 Hadoop MapReduce 架构 (MRv1) 中，主节点运行两个 Hadoop 组件（通常称为 Hadoop 守护进程）：`NameNode`\
  \ 和 `JobTracker`。Hadoop 集群中的每个从节点还运行两个 Hadoop 守护进程：`DataNode` 和 `TaskTracker`。\n\
  \n![fig6_2.jpg](img/fig6_2.jpg)\n图 6.2 使用 Hadoop MapReduce 架构 v1 (MRv1) 的 Hadoop\
  \ 集群示例。\n\n`NameNode` 和 `DataNodes` 是负责管理 HDFS 的 Hadoop 守护进程。写入 HDFS 的每个文件都会被分成\
  \ 64 MB（默认值）的块，每个块都存储在运行 `DataNode` 的节点存储设备上。此外，每个块都会复制三次（默认值）并存储在不同的 `DataNodes`\
  \ 上，以提供数据冗余和可用性。`NameNode` 的工作是跟踪哪个 `DataNode` 存储了特定文件的块（这被称为 HDFS 的元数据）。`NameNode`（主）的另一个重要功能是指导\
  \ `DataNodes`（从）执行 HDFS 块操作（创建、删除和复制）。`DataNodes` 与 `NameNode` 保持恒定联系以接收指令，并且必须处理来自\
  \ HDFS 客户端的读写请求。[图 6.3] 展示了一个说明 HDFS 的示例。注意，在这个示例中，块复制因子为二。如图所示所示，`NameNode` 维护\
  \ HDFS 的元数据，名为“file.txt” 的文件由两个块组成：Block 1A 复制两次并存储在 `DataNode 1` 和 `DataNode 2`\
  \ 上，而 Block 1B 也复制两次并存储在 `DataNode 1` 和 `DataNode 3` 上。\n![fig6_3.jpg](img/fig6_3.jpg)\n\
  \n图 6.3 HDFS 示例。\n`JobTracker` 提供用户应用程序与 Hadoop 集群之间的连接，并具有以下主要职责：初始化作业并为执行做准备、执行\
  \ MapReduce 作业的匹配和调度，以及监控当前运行作业的状态。`JobTracker` 还负责管理 `TaskTrackers`，它们作为 `JobTracker`\
  \ 的从节点运行，其主要目的是执行由 `JobTracker` 分配给它们的 map 任务或 reduce 任务。每个 `TaskTracker` 定期向 `JobTracker`\
  \ 发送轮询/更新消息（称为心跳），以接收新任务并更新其当前正在执行的任务进度（如果有）。如果 `JobTracker` 在指定时间内（默认 1 分钟）未收到来自\
  \ `TaskTracker` 的心跳消息，`JobTracker` 将假设该 `TaskTracker` 丢失，并将分配给该丢失 `TaskTracker`\
  \ 的所有任务重新映射到其他可用的 `TaskTrackers`。Hadoop 集群中的每个 `TaskTracker` 都有 map 任务容量（map 槽数量）和\
  \ reduce 任务容量（reduce 槽数量），它们分别规定了 `TaskTracker` 在任何时刻可以执行的 map 任务最大数量和 reduce 任务最大数量。Hadoop\
  \ MapReduce 的概览见图 6.4。如图示所示，`JobTracker` 维护了一个活跃作业列表和一个完成作业列表。示例系统中有两个活跃作业，`JobTracker`\
  \ 已为 `TaskTracker 1` 分配了两个 map 任务进行执行：来自作业 B 的 Map 任务 1 (Map B1) 和来自作业 C 的 Map 任务\
  \ 2 (Map C2)。\n\n![fig6_4.jpg](img/fig6_4.jpg)\n图 6.4 Hadoop MapReduce (MRv1) 示例。\n\
  \n### 6.2.2.1 Hadoop MapReduce v2 架构 (MRv2)\n\n\n\n前述描述的 Hadoop MapReduce v1 架构（MRv1）在包含超过\
  \ 4000 个节点的特大型集群中被发现存在两个主要缺陷 [14]。第一个缺陷是可扩展性有限。据报道，在非常大的集群（例如超过 4000 个节点）上，由于系统性能会变差，因为有一个单一实体\
  \ `JobTracker` 负责管理所有从节点。例如，在某个从节点故障后，尝试重新复制数据会导致网络风暴。第二个缺陷是缺乏对多租户的支持，以及缺乏对 MapReduce\
  \ 之外的其他框架和范式的支持。随着集群规模的增大，通过将可用资源划分给多个独立组织来共享集群资源变得越发理想，以便除了 MapReduce 之外的各种程序和应用程序也能运行在集群上。缺乏对多租户的支持也会导致资源利用效率低下（例如，资源利用率低），因为某些时候仅处理\
  \ MapReduce 任务可能无法利用具有数千个节点的集群中的所有资源。\n\n为了解决 MRv1 的缺陷，设计了一种名为“另一个资源调度器”（YARN）的新型\
  \ Hadoop MapReduce 架构（MRv2）[15]。MRv2 相比 MRv1 的主要变化是引入了一种新的层次方法，取代了 `JobTracker`\
  \ 并将其功能分为两个主要职责：系统资源分配和作业调度/监控。具体来说，MRv1 中的 `JobTracker` 和 `TaskTracker` 被 MRv2\
  \ 中的三个新组件（或 Hadoop 守护进程）取代：`ResourceManager`、`NodeManager` 和 `ApplicationMaster`。因此，基于\
  \ MRv2 的 Hadoop 集群在主节点上运行一个 `ResourceManager` 守护进程，在集群的每个从节点上执行一个 `NodeManager`\
  \ 守护进程，并为集群上运行的每个应用程序提供一个 `ApplicationMaster` 守护进程（参见图 6.5）。如图 6.5 所示，有两个应用程序提交给\
  \ `ResourceManager`：`Client 1` 提交了一个 MapReduce 作业进行处理，而 `Client 2` 提交了一个非 MapReduce\
  \ 作业进行处理。结果，Hadoop 集群上运行了两个 `ApplicationMasters`：一个 `ApplicationMaster` 运行在 `Slave\
  \ Node 3` 上处理 `Client 1` 提交的 MapReduce 作业，另一个 `ApplicationMaster` 运行在 `Slave Node\
  \ 1` 上处理 `Client 2` 提交的非 MapReduce 作业。\n![fig6_5.jpg](img/fig6_5.jpg)\n\n图 6.5 使用\
  \ Hadoop MapReduce 架构 v2 (MRv2) 的 Hadoop 集群示例。\n`ResourceManager` 的功能分为两个主要组件：`Scheduler`\
  \ 和 `ApplicationManager`。`Scheduler` 的主要目的是为集群上运行的每个应用程序分配资源（例如计算、内存和带宽）。在 MRv2\
  \ 中，应用程序执行所需的资源是基于资源容器的抽象概念定义的。资源容器定义了应用程序的资源需求，可以包括以下内容：CPU 核心数、内存大小、磁盘大小和网络带宽。例如，在图\
  \ 6.5 中，在集群上执行的每个应用程序有两个资源容器，每个容器位于不同的从节点上。这意味着由 `Client 1` 提交的 MapReduce 作业可以在\
  \ `Slave Node 2` 和 `Slave Node 3` 上执行，但不能在 `Slave Node 1` 上执行，因为第一个从节点上没有为 `Client\
  \ 1` 的 MapReduce 作准备资源容器。此外可以观察到 `Slave Node 2` 的资源被分配给两个容器，这允许在该节点上执行两个作业。`ApplicationManager`\
  \ 负责接受用户提交的任务、获取启动 `ApplicationMaster` 的资源容器，以及由于应用程序或硬件故障重启 `ApplicationMasters`\
  \ 的执行。`ApplicationMaster` 是负责从 `Scheduler` 协商资源容器以执行客户端应用程序的 Hadoop 守护进程。此外，`ApplicationMasters`\
  \ 还与从节点的 `NodeManagers` 协同工作，执行并监控应用程序的状态/进度，并跟踪和监控资源容器的状态和使用情况。`NodeManager` 将这些资源容器的状态和使用信息报告给\
  \ `ResourceManager`。总来说，MRv2 所的改进通过提高可靠性和可扩展性优化了 Hadoop，并通过多租户实现了更广泛的资源共享。\n\n###\
  \ 6.3 MapReduce 作业的资源管理](#17_Chapter06.xhtml_sec6_3\n本节描述了 MapReduce 作业的资源管理技术，重点关注处理\
  \ MapReduce 作业的不同方面，具有多种目标，包括减少作业完成时间、减少资源之间的数据传输以最小化网络流量、处理异构资源、资源共享以及管理资源的能量消耗。\n\
  \n### 6.3.1 缩短作业完成时间的技术](#17_Chapter06.xhtml_sec6_3_1)\n在参考文献 16 中，作者通过使用混合整数线性（`MILP`）将其建模为优化问题，对\
  \ MapReduce 匹配和调度问题进行了抽象，其目标是找到一个能够最小化集群中作业总完成时间的调度方案。由于使用 `MILP` 解决此类问题是 NP 难的\
  \ [17]，即使在作业到达时间预定的离线版本中，计算最优解也是困难且耗时的。因此，作者提出了带有启发式方法的算法来近似最优解。通过仿真，作者将他们的算法与其他著名的调度算法（如先来先出\
  \ `FIFO`）进行了比较。结果显示，虽然 `FIFO`、`SJF` 和 `STF`仅对特定工作负载效果良好，但他们提出的算法性能始终更好。\n\n参考文献\
  \ 18 的作者也将 MapReduce 调度问题建模为线性规划，其目标是最小化作业的总完成时间。文中考虑了两类作业：第一类是数据密集型作业，需要对包括系统日志和历史数据的大型数据集进行数据挖掘和分析；第二类是计算密集型作业，涉及运行高处理复杂的算法或操作（例如浮点运算）。线性规划的建模基于传统的车间调度理论。提出了一种基于现有算法的派遣规则在线调度策略\
  \ `LPT-θ` 来近似最优解。\n与参考文献 18 类似，在参考文献 19 中，作者提出了一种处理异构 MapReduce 工作负载的资源管理技术，包括 CPU\
  \ 密集型计算密集型作业和 I/O 密集型数据密集型作业。作者提出了三队列调度器（`TQS`），它包含一种名为 `MR-Predict` 的机制来预测需要执行的工作负载类型。正如名称所示，`TQS`\
  \ 使用三个队列：CPU 密集型作业队列、I/O 密集型作业队列和等待队列。通过实验，作者证明 `TQS` 可以有效地调度 CPU 密集型和 I/O 密集型作业，与默认\
  \ Hadoop `FIFO` 调度器相比，Map 任务的吞吐量可以增加 30%。\n\n\n\n\n参考文献 20 的作者提出了一种名为 Dynamically\
  \ ELastic MApReduce (`DELMA`) 的 MapReduce 框架，该框架能够在作业处理过程中动态地调整集群规模（即在作业处理期间动态添加或移除节点）。`DELMA`\
  \ 的主要特征包括：(1) 能够动态调整集群规模而无需重启已执行的作业；(2) 通过通过向集群添加空闲或未利用的节点来缩短作业完成时间；(3) 能够在作业处理过程中替换缓慢或故障节点。作者在各种处理和工作负载场景下对\
  \ `DELMA` 评估，包括在作业执行的不同阶段向集群添加节点。实验结果表明，与 `Hadoop` 相比，`DELMA` 在最佳情况下可以将平均作业完成时间缩短高达\
  \ 50%，在最坏情况下可以缩短 10%。\n参考文献 21 介绍了一种名为 `Cura` 的 MapReduce 云服务模型。`Cura` 的目标是通过实现高效的资源分配方案来减少云端资源配置的货币成本，从而提供成本效益的\
  \ MapReduce 服务。`Cura` 提供的核心资源管理方案包括成本感知资源配置、`VM-aware scheduling` 以及在线虚拟机重构。实验结果显示，`Cura`\
  \ 将云端资源配置成本降低了 80%，并将作业响应时间缩短了高达 65%。\n\n### 6.3.2 数据本地性感知技术 (#17_Chapter06.xhtml_sec6_3_2)\n\
  MapReduce 应用通常需要处理非常大的数据集，而集群中某台机器到另一台机器之间频繁的数据传输可能会由于集群网络带宽的限制而严重降低系统性能。因此，使用数据本地性感知系统来最大限度地限制节点之间的数据传输是有益的。数据本地性感知系统将任务分配到包含（或靠近）任务输入数据的节点上，以消除（或最小化）网络数据传输。\n\
  \n参考文献 22 的作者提出了一种针对具有依赖关系的多个 MapReduce 作业工作流的调度算法。该工作流由有向无环图 (`DAG`) 表示。所提出的调度算法使用了预数据放置策略来减少网络上的数据传输，并且还采用了基于优先级的调度算法\
  \ `list scheduling algorithm`。`list scheduling algorithm` 的基本思想是为工作流中的每个作业分配一个优先级，并优先调度优先级最高的作业。在预数据放置策略背景下，确定如何对数据集分组、将它们放在哪里以及复制数据集的次数至关重要。作者建议使用\
  \ `data cohesion score`（数据凝聚力评分），它用于表示任务 `t` 使用的数据集与位于每个节点组的数据集之间公共数据集的数量。理想情况下，任务\
  \ `t` 将被分配给数据凝聚力评分最高的节点组。\n参考文献 23 的作者提出了一种在调度 map 任务时利用数据本地性的调度技术。正如讨论过的，基于数据本地性的技术主张将任务分配到同样包含输入数据的节点上，以防止网络上不必要的数据传输。所提出的调度技术尝试将\
  \ map 任务分配到已包含输入数据的节点（称为 `local map tasks`）。具体来说，该技术允许集群中的每个节点在分配任何非本地 map 任务之前，有机会获取队列中的任何本地\
  \ map 任务。作者将他们的调度器原型与默认的 `Hadoop FIFO scheduler` 以及另一种名为 `delay scheduling` 的算法进行了比较。`delay\
  \ scheduling algorithm` 的基本思想是，如果任务不能在其存储输入数据的节点上执行，则延迟其执行，以在调度 map 任务时提高数据本地性。使用最大延迟\
  \ `D` 来防止任务饥饿。实验结果表明，对于实验的工作负载，作者提出的技术与 `FIFO` 和 `delay scheduling` 相比，实现了更低的平均作业响应时间。\n\
  \n参考文献 24 介绍了一种本地性感知 Reduce 任务调度器 (`LARTS`)，它在调度 reduce 任务时会考虑数据本地性。`LARTS` 在做出调度决策时会考虑\
  \ reduce 任务输入数据的大小和位置。通过实验，作者表明，使用 `LARTS` 替代传统的 `Hadoop FIFO scheduler` 可以使作业执行时间缩短\
  \ 7%。\n参考文献 25 的作者提出了一种改进 `Hadoop Fair Scheduler` 效性的技术（在 第 6.3.4 节 中进行了详细描述）。`Fair\
  \ Scheduler` [26] 为每个作业分配一个资源池。当作业没有使用其池中的所有资源时，`Fair Scheduler` 可能会将未使用的资源分配给集群上执行的其他作业。此外，`Fair\
  \ Scheduler` 还可以杀死低优先级作业以为高优先级作业释放资源。`Fair Scheduler` 的问题在于从一个作业中移除资源并重新分配给其他作业时，没有考虑数据本地性和和其他作业属性。参考文献\
  \ 25 中提出的技术旨在解决这些问题。例如，对于 I/O 绑定作业，改进后的 `Fair Scheduler` 开始杀死运行在距离任务输入数据最远的主机上的任务，以减少网络流量。通过实验，作者表明改进后的\
  \ `Fair Scheduler` 可以减少网络带宽占用，从而将作业执行时间加快约 7%。\n\n### 6.3.3 处理异构计算环境的技术 (#17_Chapter06.xhtml_sec6_3_3)\n\
  本节描述环境的资源管理技术，这些环境中的资源可能具有不同的处理、内存和网络能力（即异构资源）。\n\n参考文献 27 的作者提出了一种解决云端 MapReduce\
  \ 资源管理问题的新方法，系统以异构资源为特征。该方法的目标是最小化在云端执行 MapReduce 作业的总货币成本。作者将资源管理问题建模为约束组合优化问题，并使用创新的构造算法解决该问题。实验结果表明，与其他考虑云端异构资源的资源管理算法相比，货币成本降低了\
  \ 2.8%–23.3%。\n\n\n\n参考文献 28 的作者也关注了异构计算环境中 MapReduce 负载的资源管理。具体而言，他们提出了一种负载均衡算法，其目的是在不同处理速度的节点之间均匀分配负载。该算法基于遗传算法理论，这是一种基于人工智能的搜索启发式算法，通过模拟自然演化的工作原理来解决优化问题。仿真结果表明，所提算法在平衡异构节点负载方面是有效的，从而缩短了作业完成时间。\n\
  \n参考文献 29 介绍了一种名为面向异构和负载不平衡集群的自适应负载均衡 MapReduce（`MApReduce with adaptive Load balancing\
  \ for heterogeneous and Load imbalAnced clusters`）的框架，旨在异构和负载不平衡的计算环境中高效运行。传统方法的问题在于，在异构集群中，性能较低的节点被分配了与性能较高的节点相似的负载（即处理相同大小的数据分区）。`MARLA`\
  \ 通过使用动态任务调度机制缓解了这一问题，该机制允许集群中的每个节点按照自己的节奏请求任务。\n### 6.3.4 资源共享技术](#17_Chapter06.xhtml_sec6_3_4)\n\
  \n本节描述了专注于在多个用户之间公平共享集群资源的技术，以及从其他集群借用未闲资源的技术。\nHadoop 的两个默认调度器——公平性调度器（`Fair Scheduler`）和容量调度器（`Capacity\
  \ Scheduler`）专注于在多个用户之间公平共享集群资源。`公平性调度器`（[26]）由 Facebook 开发，其目标是确保每个作业（平均而言）都能获得集群中可用资源的等量份额。其思想是防止许多小作业饿死长作业的执行，反之亦然。`公平性调度器`将作业分到不同的池中，每个池被分配集群资源的最小份额（例如，最小数量的\
  \ map 槽和 reduce 槽）。也可以为每个用户分配一个单独池，以便所有用户都能获得集群资源的等量份额。`容量调度器`（[30]）由 Yahoo 开发，其目标与`公平性调度器`类似：在许多不同的独立用户（或组织）之间共享一个大型集群。作业被放在队列中，每个队列被分配一个保证容量，该容量是集群总资源槽的比例。注意，当需要时，队列的空闲容量可以临时分配给其他队列。此外，队列内的作业可以进行优先级排序，高优先级的作业优先获得队列资源。队列还支持访问控制机制，以限制哪些用户可以向特定队列提交作业。\n\
  \n参考文献 31 介绍了一种名为“资源窃取”（`resource stealing`）的技术，该技术允许当前运行的任务使用节点未被利用的任务槽（作者称之为`剩余资源`，即\
  \ `residual resources`）。其核心思想是，当节点上有可用的任务槽时，系统将一个作业的输入数据拆分为两个或多个更小的数据块，并创建一个额外的子任务来处理每块数据，以利用未被利用的任务槽。在\
  \ MapReduce 中，使用了一种名为“推测执行”（`speculative execution`）的容错机制。当一个作业接近完成，但其完成速度被几个落后任务（包括执行缓慢的任务和已崩溃的任务）拖慢时，系统会创建冗余任务（称为`推测任务`），并将其分配给当前没有其他任务要执行的节点。其想法是其中一个推测任务的完成时间可能比原始任务早，从而缩短作业的完成时间。参考文献\
  \ 31 的作者引入了对 MapReduce 默认推测执行机制的改进，称为“感知收益的推测执行”（`Benefit Aware Speculative Execution`）。这种新机制会预测启动推测任务是否有益，并且只有在预计推测任务比原始任务更早完成时才会启动它。\n\
  在参考文献 32 中，作者引入了一种分层 MapReduce 框架（`HMR`），它支持在多个集群（如具有空闲资源的集群）上执行 MapReduce 作业。提出了一种分层\
  \ MapReduce 编程模型，通过三个函数表示计算：`Map`、`Reduce` 和 `GlobalReduce`。`GlobalReduce` 的输入包含作业中所有\
  \ reduce 任务的输出，并且仅在集群中的一个节点上执行。通过支持在多个集群中执行 MapReduce 作业，可以实现更有效的资源共享。\n\n### 6.3.5\
  \ 资源能量管理技术](#17_Chapter06.xhtml_sec6_3_5)\n本节介绍了关注 MapReduce 作业背景下绿色计算问题的资源管理技术：最小化分布式系统（如云或集群）在执行\
  \ MapReduce 作业时的能量消耗。\n\n参考文献 33 的作者研究了数据中心和计算网格中运行 MapReduce 作业时提高能量效率的技术，且不会严重影响性能。作者研究了\
  \ Hadoop 在各种负载下的性能与能量效率的权衡。实验期间记录的系统活动轨迹显示，MapReduce 计算涉及大量的 I/O 操作（例如从磁盘读取/向磁盘写入大量数据）以及网络\
  \ I/O 操作，导致在某些时间点 CPU 利用率较低。通过研究，作者发现，仔细分配资源以匹配应用程序的并行度，并使用已知的动态电压频率调整（`DVFS`）技术，可以在不产生巨大性能成本的情况下提高能量效率。\n\
  参考文献 34 的重点也是如何让 MapReduce 作业的执行更具能量效率。该论文考虑了一种具有独特 CPU、内存和网络需求的、突发性的 MapReduce\
  \ 负载，并在异构数据中心上执行。提出了一种在线能量最小化路径算法，并实现在名为绿色 MapReduce 调度器（`GEMS`）的新调度器中。`GEMS` 通过在计算服务器和网络交换机在使用有效的睡眠策略，在保持低任务响应时间的同时降低能量消耗。具体来说，`GEMS`\
  \ 在系统负载低时让服务器和网络交换机休眠以节省能量。仿真实验表明，与不使用计算网络设备睡眠策略且仅关注计算服务器能量最小化的技术相比，`GEMS` 在异构数据中心上可以节省高达\
  \ 35% 的能量，并将作业响应时间提高 35%。仅关注能量最小化的策略通常采用将作业紧凑打包在少数服务器上的策略，这会导致响应时间增加并延长服务器的运行时间。相反，`GEMS`\
  \ 保持更多的服务器活跃状态，允许作业更松散地布局，从而缩短作业的响应时间。通过尽可能让服务器和网络交换机进入休眠状态，获得了能量节省。\n\n### 6.4\
  \ 带截止期限的 MapReduce 作业的资源管理](#17_Chapter06.xhtml_sec6_4)\n\n\n\n本节介绍了针对带截止时间的 MapReduce\
  \ 任务的资源管理技术。回顾第 6.1 节，带截止时间的 MapReduce 任务对于延迟敏感型应用变得越来越重要，例如用于实时业务智能和事件日志实时分析的场景\
  \ [7]。\n\n### 6.4.1 基于预算的 MapReduce 资源管理技术](#17_Chapter06.xhtml_sec6_4_1)\n在参考文献\
  \ 35 中提出了一种基于预算的 MapReduce 资源管理算法 (MRBB-RM)。MRBB-RM 的设计目的是对具有服务水平协议（SLA）的开放 MapReduce\
  \ 任务流进行智能化的任务匹配和调度（统称为映射），其中每个 SLA 的特征是最早开始时间、所需的执行时间以及端到端的截止时间，并运行在如云或或集群的分布式环境中。MRBB-RM\
  \ 使用截止时间预算算法将任务的端到端截止时间分解为若干组件（子截止时间），每个组件与作业中的一个特定任务相关。然后，使用匹配和调度算法将作业的各个任务映射到资源上，其目标是最小化错过截止时间的作业数量。\n\
  \n图 6.6 展示了 MRBB-RM 算法 1：作业与任务映射算法的概述。关于 MRBB-RM 及其相关算法的更详细、完整的描述可以在参考文献 35 中找到。当\
  \ MRBB-RM 可用时（即未忙于调度另一个作业），它会从作业队列中提取第一个作业并调用 `Algorithm 1`。作业队列存储了用户提交到系统的作业，且队列中的作业按截止时间的非递减顺序排序。`Algorithm\
  \ 1` 需要的输入是一个待映射的任务 `j`。如图 6.6 所示，`Algorithm 1` 的第一步是调用 `Algorithm 2: Deadline Budgeting\
  \ Algorithm`，将作业 `j` 的端到端截止时间分解为各个组件，以便为 `j` 的每个任务分配一个子截止时间（步骤 1）。具体而言，会为作业的 map\
  \ 阶段和 reduce 阶段分别计算一个独立的子截止时间。然后，作业的每个 map 任务的子截止时间设置为 map 阶段的子截止时间，同样，作业的每个 reduce\
  \ 任务的子截止时间被设置为 reduce 阶段的子截止时间。map 阶段和 reduce 阶段的子截止时间通过分配作业的松量（laxity）计算得出，分配给这两个阶段的松量与其相应阶段的执行时间成比例。作业的松量（也称为松弛时间）是作业在截止时间之前完成执行的额外时间，计算公式如下：`dj\
  \ - (Ej + sj)`，其中 `dj` 是作业 `j` 的截止时间，`Ej` 是作业 `j` 的执行时间，`sj` 是作业 `j` 的最早开始时间。\n\
  ![fig6_6.jpg](img/fig6_6.jpg)\n\n图 6.6 MRBB-RM 作业与任务映射算法概述。\n在为每个任务分配子截止时间后，`Algorithm\
  \ 1` 按照子截止时间的非递减顺序对作业 `j` 的任务进行排序，若相同，则优先考虑执行时间较大的任务（即松弛时间较少的任务）（步骤 2）。接下来，`Algorithm\
  \ 1` 通过在系统中寻找能够以其最早开始时间执行任务 `t` 的资源 `r`，来按（指定顺序）映射 `j` 的每个任务（步骤 3 和 4a）。请注意，`Algorithm\
  \ 1` 调度作业 `j` 的每个任务时，会确保任务能够在作业 `j` 截止时间之前完成执行，并且尽可能在其子截止时间之前完成。然而，如果该任务是 map 任务且错过了其子截止时间，算法将使用下一执行阶段（即\
  \ reduce 阶段）的部分松量来调度该 map 任务，只要不违反作业 `j` 的截止时间即可。对于 reduce 任务，子截止时间不能被违反，因为 reduce\
  \ 阶段是执行的最后阶段，且 reduce 任务的子截止时间等于作业 `j` 的截止时间。映射完成后，`Algorithm 1` 检查该任务是否安排在作业 `j`\
  \ 的截止时间或之前完成（步骤 5）。如果任务被安排在 `j` 的截止时间之前完成（步骤 6a），则 `Algorithm 1` 继续映射作业的下一个任务。重复这一系列操作，直到作业的所有任务都完成映射，此时算法结束（步骤\
  \ 4b）。如果任务无法被安排在 `j` 的截止时间之前完成执行，则调用 `Algorithm 3: Job Remapping Algorithm`（步骤 6b）。`Algorithm\
  \ 3` 重新映射作业 `j` 以及一组可能导致 `j` 错过截止时间的作业集 `S`。这包含了被安排在区间 `[start time of job j, deadline\
  \ of job j]` 内开始或完成执行的作业。请注意，只有那些在之前已调度过但尚未开始执行的作业中的任务会被重新映射。如果 `S` 中的所有作业都能重新映射并满足截止时间，则认为作业\
  \ `j` 映射成功；否则，认为映射作业 `j` 失败（即一个作业无法满足截止时间）。根据调度策略，作业 `j` 可以忽略其截止时间进行映射（默认行为），也可以拒绝该作业。该算法支持这两种策略，但在第\
  \ 6.4.1.1 节描述的实验中，选择了前者：即使作业错过截止时间也进行映射。在 `Algorithm 3` 完成并返回控制权后，`Algorithm 1`\
  \ 结束（步骤 7）。\n\n### 6.4.1.1 MRBB-RM 的性能评估](#17_Chapter06.xhtml_sec6_4_1_1)\n对 MRBB-RM\
  \ 进行仿真的性能评估。使用以下指标评估系统性能：(1) 延迟比例 (`P`)，即实验中延迟作业数与作业数的比例；(2) 平均作业周转时间 (`T`) 以及 (3)\
  \ 平均作业匹配和调度时间 (`O`)。\n\n首先，将 MRBB-RM 与最小资源配额最早截止时间工作保护调度 (MinEDF-WC) 技术 [7] 进行比较，后者的目标与\
  \ MRBB-RM 类似。MinEDF-WC 是一种基于著名的最早截止时间调度策略的用于处理带截止 MapReduce 任务的资源分配和调度技术。MinEDF-WC\
  \ 在截止时间之前分配完成作业所需的最小资源数量，并具有在需要时动态分配和释放活动资源的能力。这种动态分配和释放资源的能力允许具有空闲资源的机器将其未使用的资源共享给需要这些其他作业。接下来将展示\
  \ MRBB-RM 与 MinEDF-WC 的性能对比。所使用的工作负载是根据 2009 年 10 月 Facebook 使用的 Hadoop 集群工作负载轨迹生成的合成工作负载，该工作负载在参考文献\
  \ 7 中有所描述。\n\n\n\n图 6.7 展示了 MRBB-RM 与 MinEDF-WC 之间 `T` 的对比（在参考文献 7 中给出）。如图 6.7 所示，MRBB-RM\
  \ 与 MinEDF-WC 实现了相当或更低的 `T`。关于 `P`，观察到当 `λ` 小于每秒 1/5000 个作业时，MRBB-RM 和 MinEDF-WC\
  \ 的性能相当。然而，在 `λ` 值较高时，观察到了 `T` 和 `P` 之间的权衡。当 `λ` 大于每秒 1/5000 个作业时，MinEDF-WC 显示出较小的\
  \ `P`，而 MRBB-RM 则实现了更低的 `T`。这归于 MRBB-RM 的作业与任务映射算法尝试将任务调度为最早开始执行，从而缩短了作业的周转时间。然而，将任务调度为最早开始时间并不总能实现最小化错过截止作业数的映射。例如，在某些情况下，延迟某些作业较长时间可以防止其他作业错过截止日期，但这反过来会导致作业周转时间的增加。\n\
  \n![fig6_7.jpg](img/fig6_7.jpg)\n图 6.7MRBB-RM 对比 MinEDF-WC：当平均作业到达率变化时的平均作业周转时间。（节选自\
  \ N. Lim 等人，Resource management techniques for handling requests with service level\
  \ agreements, International Symposium on Performance Evaluation of Computer and\
  \ Telecommunication Systems (SPECTS), Monterey, CA, USA, 6–10 July 2014, pp. 618–625.）\n\
  \n此外，还对 MRBB-RM 进行了实验，以研究各种系统和负载参数（包括作业到达率（`λ`）、任务执行时间、作业的最早开始时间、作业的截止日期以及资源数量）如何影响系统性能\
  \ [35]。从这些实验结果观察到，`P`、`T` 和 `O` 随着 `λ` 的增加或任务执行时间的增加而增加。这可以归于当 `λ` 或任务执行时间增加时，MRBB-RM\
  \ 面临更高的系统负载，从而产生了激烈的资源竞争。相反，观察到随着资源数量的增加或作业截止日的增加（即作业有更多空隙时间），`P`、`T` 和 `O` 往往会减少。总体而言，观察到\
  \ MRBB-RM 能够有效地匹配并调度具有截止日期的开放 MapReduce 作业流，同时产生极小的 `O`（平均 42 毫）。`O/T` 比率是算法处理开销的指标，在所有进行的实验中均小于小于\
  \ 0.02%，证明了 MRBB-RM 的效率。关于这些实验结果的更详细讨论可以在参考文献 35 中找到。\n## 6.4.2 使用优化方法的带 SLA 的 MapReduce\
  \ 作业资源管理](#17_Chapter06.xhtml_sec6_4_2)\n\n参考文献 36 中介绍了使用各种优化方法对建模和解决带 SLA 的 MapReduce\
  \ 作业匹配与调度问题的资源管理技术，其中每个 SLA 包含最早开始时间、所需的执行时间和端到端截止日期。更具体地，带 SLA 的 MapReduce 作业的资源管理问题使用\
  \ `MILP` [37] 和约束规划（`CP`） [38] 进行建模（参见图 6.8）。使用 `CP` 建模的资源管理模型被称为 `CP Model`，同样，使用\
  \ `MILP` 建模的资源管理模型被称为 `MILP Model`。在所提出的资源管理技术中使用 `MILP` 和 `CP` 导致了某种意义上的最优解，因为生成的调度使得错过截止日期的作业数最小化。资源管理模型所需的输入由作业集\
  \ `J` 和用于执行 `J` 的资源集 `R` 组成。目标是最小化错过截止作业数。`CP Model` 和 `MILP Model` 具有相同的通用结构：决策变量、目标函数和约束条件。决策变量是最初未知的变量，在问题求解后被赋值（即它们代表模型的输出）。目标函数是一个生成需要优化的值（最小化或最大化）的数学函数。最后，约束条件是一组限制决策变量可赋值范围的数学公式。求解优化模型涉及为决策变量赋值以优化由目标函数生成的值，同时确保不违反任何约束条件。这里考虑了使用不同软件包实现的\
  \ `MILP Model` 和 `CP Model` 的三种实现方式：\n- 方法 1：使用 `LINGO` [39] 实现并求解 `MILP Model`。（商业软件）。\n\
  - 方法 2：使用 `MiniZinc/FlatZinc` [40] 实现 `CP Model` 并使用 `Gecode` [41] 求解（均为开源软件）。\n\
  - 方法 3：使用 `IBM ILOG CPLEX Optimization (CPLEX)` [42] 实现并求解 `CP Model`。（商业软件）。\n\
  ### 6.4.2.1 基于 MILP 模型和 CP 模型的资源管理技术性能评估](#17_Chapter06.xhtml_sec6_4_2_1)\n\n为了比较方法的有效性和性能，针对各种批量负载进行了仿真实验，每个批量包含多个作业。实验在成功对批量所有作业进行匹配和调度后结束，并确定了批的调度和完成时间。通过以下指标对三种方法的性能进行比较：负载完成时间（`C`）、处理时间开销（`PO`）以及方法成功处理的负载规模（任务数量）。由于所有方法都是通过求解优化问题来执行匹配和调度，每种方法都能生成使错过截止作业数最小的调度。在评估这三种方法的实验中，每种方法生成的调度均没有作业错过截止日期。接下来将讨论\
  \ `MILP Model` 和 `CP Model` 性能评估的具有代表性的结果。关于性能评估和结果的完整讨论见参考文献 36。\n\n\n\n在执行大规模工作负载时，三种方法的\
  \ C 和 PO 值分别如图图 6.9 和图 6.10 所示。Large 1 负载包含 2 个作业，每个作业有 100 个 map 任务和 30 个 reduce\
  \ 任务。另一方面，Large 2 负载由 50 个作业组成，每个作业的 map 任务数量在 1 到 100 之间不等，reduce 任务数量在 1 到其 map\
  \ 任务数量之间变化不等。因此，平均而言，Large 2 负载大约有 3750 个任务。工作负载的更详细描述可以参见参考文献 36。从图 6.9 和图 6.10\
  \ 可以观察到，方法 2 无法处理这些较大的负载，而方法 1 只能为 Large 1 负载生成调度（如图图中缺失的条形所示）。当尝试使用方法 1 和 2 为较大的负载生成解决方案时，实验系统最终耗尽了内存导致求解器崩溃。这意味着方法\
  \ 1 和 2 的求解器无法在用于实验的系统中处理如此数量的决策变量。另一方面，结果显示方法 3 能够处理这两种大规模负载，并且在 PO 和 C 方面表现良好。注意，方法\
  \ 3 对于 Large 1 负载实现了非常小的 PO (1.08 s)，因此该条形在图 6.10 中并不清晰可见。\n\n![fig6_9.jpg](img/fig6_9.jpg)\n\
  图 6.9 大规模工作负载完成时间的比较。（改编自 N. Lim 等人，“Engineering resource management middleware\
  \ for optimizing the performance of clouds processing MapReduce jobs with deadlines,”,\
  \ International Conference on Performance Engineering (ICPE), Dublin, Ireland, 24–26\
  \ March 2014, pp. 161–172.）\n\n![fig6_10.jpg](img/fig6_10.jpg)\n图 6.10 大规模工作负载处理开销的比较。（改编自\
  \ N. Lim 等人，“Engineering resource management middleware for optimizing the performance\
  \ of clouds processing MapReduce jobs with deadlines,”, International Conference\
  \ on Performance Engineering (ICPE), Dublin, Ireland, 24–26 March 2014, pp. 161–172.）\n\
  \n### 6.4.3 基于 MapReduce 约束规划的资源管理技术](#17_Chapter06.xhtml_sec6_4_3)\n参考文献 36 中讨论的实验结果和\
  \ 6.4.2.1 节中总结的结果证明了方法 3 的优越性：使用 `IBM CPLEX` 实现的 `CP Model`，包括其更直观、简单的约束公式、更低的处理开销以及处理更大工作负载的能力。这促成了对一种新型基于\
  \ MapReduce 约束规划的资源管理算法 (`MRCP-RM`) [43] 的研究，该算法可以对带有 SLA 的开放式 MapReduce 作业流有效地执行匹配和调度，其中每个\
  \ SLA 的特征是最早开始时间、所需的执行时间和端到端截止日期。`MRCP-RM` 的目标是最小化错过截止期日任务的作业数量。`MRCP-RM` 与参考文献\
  \ 36 中描述的技术的关键区别在于，`MRCP-RM` 可以处理开放式的作业到达，而参考文献 36 中描述的技术仅支持固定作业数量的批处理工作负载（即闭式系统）。\n\
  \n图 6.11 展示了一个使用 `MRCP-RM` 环境的示意图。用户将 MapReduce 作业提交到系统，作业被放置在作业队列中。如果资源管理器可用（即没有忙于映射上组作业），它将调用\
  \ `MRCP-RM` 来映射作业队列中的作业集。`MRCP-RM` 使用 `IBM CPLEX` [42] 生成一个 `OPL Model`，该模型是使用 IBM\
  \ 优化编程语言 (`OPL`) 对 `CP Model` 的实现。具体来说，会创建一个为已启动但未完成执行的每个任务添加了新约束的 `OPL Model`。为了求解\
  \ `OPL Model`，`MRCP-RM` 调用 `IBM CPLEX` 的 `CP Optimizer` 求解引擎。注意，如果不是第一次调用 `MRCP-RM`，则要处理的作业集包含了从作业队列中获取的新作业，以及已调度或正在执行但尚未完成的作业。`MRCP-RM`\
  \ 调度所有新提交的作业（即作业队列中的作业），还会重新映射尚未开始执行的作业的任务，以提供最灵活的调度来减少作业数量。例如，具有较早截止日的任务可能需要映射。一旦找到了\
  \ `OPL Model` 的解决方案，资源管理器就能确定分配任务分配资源（匹配），以及分配给资源的任务何时开始执行（调度）。\n![fig6_11.jpg](img/fig6_11.jpg)\n\
  \n图 6.11 MRCP-RM 概述。（改编自 N. Lim 等人，“A constraint programming-based resource management\
  \ technique for processing MapReduce jobs with SLAs,” International Conference on\
  \ Parallel Processing (ICPP), Minneapolis, MN, 9–12 September 2014, pp. 411–421.）\n\
  #### 6.4.3.1 MRCP-RM 的性能评估](#17_Chapter06.xhtml_sec6_4_3_1)\n\n为了研究 `MRCP-RM` 的有效性，进行了基于真的性能评估。使用了三个性能指标来评估\
  \ `MRCP-RM` 的性能：延迟作业比例 (`P`)、平均周转时间 (`T`) 以及平均匹配和调度时间 (`O`)（见 6.4.1 节）。首先，通过实验研究各种参数对\
  \ `MRCP-RM` 性能的影响。例如，图 6.12 显示了作业到达率 (`λ`) 对 `MRCP-RM` 的 `T` 和 `O` 的影响。`MRCP-RM`\
  \ 在每个实验 `λ` 值下实现的 `P` 值如下：当 `λ`（作业/秒）分别为 0.001、0.01、0.015 和 0.02 时，分别为 0.04%、0.55%、1.03%\
  \ 和 1.70%。结果显示，由于资源竞争加剧，`P`、`T` 和 `O` 随 `λ` 的增加而增加。特别是，`O` 随 `λ` 增加的主要原因是在给定时刻存在多个尚未开始执行的调度任务，以及多个尚未完成的执行任务。大量待处理的任务导致\
  \ `MRCP-RM` 需要更多时间来生成和求解 `OPL Model`，从而增加了 `O`。然而，在进行的实验中，作为处理开销指标的 `O/T` 仍被观察到很小（小于\
  \ 0.04%）。\n![fig6_12.jpg](img/fig6_12.jpg)\n\n图 6.12 作业到达率对平均作业周转时间和平均作业匹配和调度时间的影响。（改编自\
  \ N. Lim 等人，“A constraint programming-based resource management technique for processing\
  \ MapReduce jobs with SLAs on clouds.”）\n\n\n\n接下来将对为调查各种系统和工作负载参数的变化对 `MRCP-RM`\
  \ 性能影响的其他实验结果进行简要讨论。更详细的讨论可以参见参考文献 43。可以观察到，随着以下参数之一的增加：系统的资源数量、作业的最早开始时间以及作业的截止日期，`P`、`T`\
  \ 和 `O` 往往会减少。这可以归因于这些参数的增加导致了资源竞争的减少。总体而言，从所进行的实验中观察到，`MRCP-RM` 能够生成产生小 `P`（小于\
  \ 3.46%）的调度，并且根据 `O/T` 比例所示（小于 0.09%），其匹配和调度开销也较小。\n\n此外，还对比了 `MRCP-RM` 与文献中的 `MinEDF-WC`\
  \ [7] 技（回想第 6.4.1.1 节），该技术与 `MRCP-RM` 的目标相似。这些实验使用了在参考文献 7 中描述的 Facebook 合成 MapReduce\
  \ 工作负载。图 6.13 展示了 `MRCP-RM` 与 `MinEDF-WC`（在参考文献 7 中给出）之间的 `P` 比较。如图 6.13 所示，与 `MinEDF-WC`\
  \ 相比，`MRCP-RM` 实现了显著更低的 `P`（最高降低了 93%）。在 `T` 方面（更多细节请参见参考文献 43），观察到 `MRCP-RM` 与\
  \ `MinEDF-WC` 相比具有相当或更低的 `T`（最高降低了 7%）。请注意，此工作负载中的作业具有较小的松弛时间，导致作业具有更严格的截止日期。这意味着作业需要尽可能地接近其最早开始时间执行（即具有较短的周转时间），以满足它们的截止日期。在使用\
  \ Facebook 的成 Facebook 工作负载时，`MRCP-RM` 相比 `MinEDF-WC` 的性能提升可以归因于使用了优化技术——约束规划来执行匹配和调度。\n\
  ![fig6_13.jpg](img/fig6_13.jpg)\n\n图 6.13 MRCP-RM 与 MinEDF-WC：平均作业到达率变化时逾期作业的比例。（改编自\
  \ N. Lim et al., A constraint programming-based resource management technique for\
  \ processing MapReduce jobs with SLAs on clouds, International Conference on Parallel\
  \ Processing (ICPP), Minneapolis, MN, USA, 2014 年 9 月 9 日至 12 日, pp. 411–421。）\n\
  ### 6.4.4 基于约束规划的 Hadoop 调度器](#17_Chapter06.xhtml_sec6_4_4\n\n从仿真实验中观察到的 `MRCP-RM`\
  \ 的强劲性能，促成了参考文献 44 中的研究，该研究重点在于设计一个改进版本的 `MRCP-RM` 并将其实现在 MapReduce 编程模型的真实系统上：Hadoop\
  \ [11]。这种新技术被称为基于约束规划的 Hadoop 调度器（缩为 `CP-Scheduler`）。`CP-Scheduler` 可以对带有截止日的开放\
  \ Hadoop 作业流进行匹配和调度。图 6.14 展示了一个部署了 `CP-Scheduler` 的 Hadoop 集群。该 Hadoop 集群由一个主节点（`NameNode`\
  \ 和 `JobTracker`）和 `m` 个从节点（`DataNodes` 和 `TaskTrackers`）组成。回想第 6.2.2 节中对 Hadoop\
  \ 的讨论。用户将 Hadoop 作业提交给 `JobTracker`，它使用 `CP-Scheduler` 将作业的 map 和 reduce 任务匹配并调度到\
  \ `TaskTrackers` 上。具体来说，`CP-Scheduler` 使用 `IBM CPLEX` 的 Java API 来创建并求解 `CP Model`，将匹配和调度问题公式化为一个优化问题（回想第\
  \ 6.4.2 节）。\n![fig6_14.jpg](img/fig6_14.jpg)\n\n图 6.14 部署了 CP-Scheduler 的 Hadoop\
  \ 集群。（改编自 N. Lim et al., A constraint programming based Hadoop scheduler for handling\
  \ MapReduce jobs with deadlines on clouds, International Conference on Performance\
  \ Engineering (ICPE), Austin, TX, USA, 2015 年 1 月 31 日至 2 月 4 日, pp. 111–122。）\n\
  `CP-Scheduler` 算法的概述在图 6.15 中以流程图的形式给出。关于 `CP-Scheduler` 算法的更详细且完整的描述可以在参考文献 44\
  \ 中找到。每当 `JobTracker` 收到 `TaskTracker` 的心跳消息时（回想第 6.2.2 节），就会调用 `CP-Scheduler` 来执行匹配和调度。`CP-Scheduler`\
  \ 算法所需的输入是一个用于分配任务的 `TaskTracker`。第一步是创建 `CP Model` 所需的输入数据，包括一组待调度的作业 `J` 和一组资源\
  \ `R`（步骤 1）。作业集（`J`）包括新到达且尚未调度的作业，以及之前已调度但尚未完成执行的作业。接下来，`CP-Scheduler` 检查 `J` 中是否存在任何作业（步骤\
  \ 2）。如果 `J` 为空，意味着没有新作业需要调度，且系统上当前没有正在调度或执行的作业，则算法结束（步骤 3b）。否则，`CP-Scheduler` 检查\
  \ `J` 中是否有新的待调度作业，或 `R` 中是否有任何新资源（步骤 3a）。请注意，`R` 中的资源在两种情况下发生变化：(1) 如果向 Hadoop 集群添加了新的\
  \ `TaskTrackers`，则资源会被添加到 `R`；(2) 如果属于 Hadoop 集群的 `TaskTrackers` 故障或崩溃，则资源会从 `R`\
  \ 中移除。如果有新的输入数据，`CP-Scheduler` 将创建并求解一个新的 `CP Model` 来执行匹配和调度（步骤 4a）。对 `J` 和 `R`\
  \ 检查新输入数据是为了防止在已经找到相同输入的解决方案的情况下，仍进行不必要的创建和求解 `CP Model`（这是开销的来源）。在步骤 5 中，`CP-Scheduler`\
  \ 从已求解的 `CP Model` 中提取解决方案，并将任务分配给提供的 `TaskTracker` 进行执行。\n\n![fig6_15.jpg](img/fig6_15.jpg)\n\
  图 6.15 CP-Scheduler 算法概述。\n\n### 6.4.4.1 CP-Scheduler 的性能评估](#17_Chapter06.xhtml_sec6_4_1)\n\
  在 Amazon EC2 上部署的 Hadoop 集群上对 `CP-Scheduler` 进行性能评估，以确定 `MRCP-RM` 在真实系统上的有效性，并获取系统行为和性能的洞察。将\
  \ `CP-Scheduler` 的性能与最早截止优先（EDF） Hadoop 调度器（称为 `EDF-Scheduler`）实现的性能进行对比，后者通过扩展\
  \ Hadoop 默认调度器实现。与 `EDF-Scheduler` 的比较是为了研究在对带有截止日的开放 MapReduce 作业流进行匹配和调度时，`CP-Scheduler`\
  \ 是否比使用常用 EDF 调度策略的调度器更有效。这些实验使用的工作负载是 Hadoop WordCount 作业（回想第 6.2.1 节），处理不同大小的输入。具体而言，实验使用了三种作业类型：小型（3\
  \ 个文件，总计 3MB）、中型（10 个文件，总计 5MB）和大型（20 个文件，总计 10MB）。输入文件是从 Project Gutenberg ([www.gutenberg.org](http://www.gutenberg.org))\
  \ 获取的纯文本电子书。关于 `CP-Scheduler` 和 `EDF-Scheduler` 性能评估的详细讨论可以找到参考文献 44。接下来将给出一组代表性的实验结果。\n\
  \n\n\n\n针对混合工作负载以及单类工作负载的系统进行了实验。混合工作负载包含了三种作业类型的作业：小型、中型和大型。单类工作负载的特征是任一一种类型的作业：小型、中型或大型。图\
  \ 6.16）。尽管 `CPS` 的 `O` 高于 `EDFS` 的 `O`，但 `O/T` 比率（平均作业周转时间的处理开销）仍然非常低（小于 0.4%）。`O/T`\
  \ 比率是处理开销的合适指示，因为它通过考虑算法运行时间 (`O`) 相对于平均作业周转时间 (`T`)，将算法运行时间的测量值置于特定的背景中。\n![fig6_16.jpg](img/fig6_16.jpg)\n\
  \n图 6.16 `CP-Scheduler` (`CPS`) 与 `EDF-Scheduler` (`EDFS`)：在使用混合工作负载且平均作业到达率变化时，平均作业周转时间和平均作业匹配与调度时间。（改编自\
  \ N. Lim et al., A constraint programming based Hadoop scheduler for handling MapReduce\
  \ jobs with deadlines on clouds, International Conference on Performance Engineering\
  \ (ICPE), Austin, TX, USA, 31 January–4 February 2015, pp. 111–122。）\n![fig6_17.jpg](img/fig6_17.jpg)\n\
  \n图 6.17 `CP-Scheduler` (`CPS`) 与 `EDF-Scheduler` (`EDFS`)：在使用混合工作负载且平均作业到达率变化时，平均作业周转时间和平均作业匹配与调度时间。（改编自\
  \ N. Lim et al., A constraint programming based Hadoop scheduler for handling MapReduce\
  \ jobs with deadlines on clouds, International Conference on Performance Engineering\
  \ (ICPE), Austin, TX, USA, 31 January–4 February 2015, pp. 111–122。）\n图 6.18 中，作者研究了包含无截止日期作业和带截止日期作业的\
  \ MapReduce 工作负载调度问题。作者提出了一种采用“任务前向调度”（`Tasks Forward Scheduling`, `TFS`）采样技术的调度器，用于预测\
  \ map 任务和 reduce 任务的执行时间。`TFS` 通过初始执行几个任务，然后利用这些初始任务的执行时间来预测未来任务的执行时间。此外，所提出的调度器还利用名为“近似均匀最小并行度”（`Approximately\
  \ Uniform Minimum Degree of Parallelism`, `AUMD`）的资源分配模型来动态控制作业的执行，使每个作业以其最小的任务并行度执行以满足其截止日期。该思想是防止单个作业垄占集群中的所有资源，并允许更多作业在集群上同时执行。\n\
  \n\n\n在参考文献 47 中，作者描述了一种公有云资源动态供给的策略，用于调度具有截止日期的 MapReduce 任务。最初，任务在本地集群上执行，如果需要，则从云端动态调配资源以满足应用程序的截止日期。此外，参考文献\
  \ 48 的作者研究了资源管理算法，以最小化分配虚拟机执行具有截止日期的 MapReduce 任务的成本。文中提出了两种虚拟机（VM）供给策略：(1) 列表与首次适应算法\
  \ (LFF) 和 (2) 截止日期感知任务装箱 (DTP)。`LFF` 方法根据单位成本的升序排列或虚拟机性能的降序排列对虚拟机的定价策略进行排序。每个映射任务（map\
  \ task）被分配到其自己的虚拟机，而归约任务（reduce tasks）被分配到已为映射任务分配的虚拟机之一。在 `DTP` 方法中，其思想是尽可能将作业的\
  \ map 任务和 reduce 任务分配到现有的虚拟机上，直到作业无法满足其截止日期，此时则需要调配一个新的虚拟机。\n\n\n在参考文献 50 中，作者提出了一种基于二分图建模的用于具有截止日期的\
  \ MapReduce 作业的调度器，称为二分图建模 MapReduce 调度器 (`BGMRS`)。`BGMRS` 专注于在异构云计算环境（即节点表现出不同性能的环境）中调度具有截止日期的\
  \ MapReduce 作业。`BGMRS` 能够通过将问题转换为一个著名的图问题：最小加权二分匹配，从而获得调度问题的优解。作者通过使用固定数量作业的负载进行了仿真和基于测试平台的实验，证明了该技术的有效性。\n\
  \n\n分析数据以做出有意义的决策在各种环境中至关重要，包括企业和科学应用，以及物理信息系统（如配备传感器的桥梁、智能建筑和工业机械）。然而，分析的数据量有时非常巨大，传统的处理工具和技术无法用于分析此类大数据。`MapReduce/Hadoop`\
  \ 已经成为一种处理大数据应用的流行技术和工具。`MapReduce` 是 Google 提出的的一种编程模型，简化了大规模分布式并行处理的执行，而 `Hadoop`\
  \ 是一个用 `Java` 编写的实现 `MapReduce` 的开源软件框架。`Hadoop` 被许多公司和机构使用，通常结合云计算，用于处理和分析大型数据集（即进行大数据分析）。本章的重点在于描述在分布式系统（如云或集群）上处理\
  \ MapReduce 作业的资源管理算法和技术，包括带有 SLA 的 MapReduce 作业。`SLA` 可能随应用程序而异，通常包括最早开始时间、所需的执行时间和端到端截止日期。为了利用底层分布式硬件的强大功能并实现高系统性能（包括高\
  \ QoS，其表现为错过截止日期的作业比例很低），智能且高效的资源管理技术是必要的。本章讨论了多种针对不同目标的处理 MapReduce 作业的资源管理技术，包括减少作业完成时间、减少资源之间的数据传输以最小化网络流量、处理异构资源、资源共享以及管理资源能耗。此外，本章还讨论了若干处理开放流\
  \ MapReduce 技术，包括：\n\n- 基于预算的 MapReduce 调度算法 (`BB-RM`)，将作业的端到端截止日期分解为部分，每个与特定任务相关；\n\
  - 基于约束规划的 MapReduce 调度算法 (`CP-RM`)，通过约束规划进行调度；\n- 基于约束规划的调度器 (`CP-Scheduler`)，在\
  \ `Hadoop` 中设计用于 MapReduce。\n\n实验结果表明，这些技术在处理具有截止日期的开放流时是有效的。具体而言，这些技术优于文献中的技术，能够以可接受的\
  \ `O` 开销生成调度计划，`O/T` 比率将 `O` 与作业的平均时间 `T` 联系起来。未来的研究方向包括将日期预算算法扩展到具有不同依赖关系的工作流（例如物理和生物领域的工作流）。此外，研究用户估计执行时间的误差如何影响系统性能以及如何处理这些误差是一个有趣的方向。基于约束规划的能量感知调度算法也值得研究。\n\
