  \ | 测量单服务器和集群的 IO 子组件性能 |\n| 并行 | NAS-NPB | NASA 开发的用于并行计算评估的基准 |\n| 系统性能 | Linpack\
  \ | 使用科学计算评估系统性能的基准测试 |\n| | StressAppTest | 一种测试硬件设备性能的高负载基准测试 |\n\n\n\n整个服务器的功率由运行在该服务器上的三个\
