  车载云领域的一个重大研究挑战是识别出这些云能够支持大数据应用的适用条件。显而易见，大数据的应用对数据处理有严格要求，无法由瞬即逝的车载云支持，因为车辆在云中的驻留时间太短，无法支持虚拟机的建立和迁移。同样，事实证明依赖带宽受限互连拓扑结构的车载云实现并不适用于大数据的应用。遗憾的是，迄为止文献中提出的基于无线互连织网的绝大多数车载云都是这种状况。\n\
  \n我们的主要贡献是识别出在停车场内基于车辆构建的数据中心能够有效支持大数据的应用充分充分条件。这是一项开创性工作：据我们所知，这是研究人员首次评估车载云概念的可行性及其支持大数据应用的适用性。我们的主要发现之一是：（1)\
  \ 如果车辆的驻留时间足够长且 (2) 如果互连织网具有足够的带宽，那么此类数据中心就可以有效支持大数据的应用。\n\n## 21.1 引言与动机\n\n过去十年见证了云计算（CC）的出现和巨大成功，这是一种拥有大量闲置基础设施基础的信息技术（IT）公司采用的范式转移\
  \ [1–6]。云计算显而易见的吸引力在于，它为计算资源和多种 IT 服务提供了可扩展的访问。并不意外，云计算和云 IT 服务在全球范围内已经并持续保持着惊人的采用率\
  \ [7]。为了实现几乎无限制的扩展性、可用性和安全性，云计算需要从虚拟化、服务器整合、文件系统支持到内存层次结构设计的实质性架构支持 [8,9]。\n\n美国国家标准与技术研究院\
  \ [10] 将云计算定义为：“一种模型，用于能够方便地、按需访问共享的可配置计算资源池（例如网络、服务器、存储、应用程序和服务），这些资源可以以最少管理工作量或与服务提供商的交互进行快速配置和释放。”\n\
  \n事实证明，云计算是一个引人注目的比喻，通过在互联网上提供各种类型的托管服务来实现实用型计算 [1]。事实上，人们认为 [11]，云计算的灵感来自于实用型计算的概念，并由于基础设施提供者的可用性而实现，这些提供者的多余计算资源和存储可以租给用户。在这种背景下，用户可以购买他们当时所需的计算服务量。他们不需要担心为受欢迎程度不符合其预测和市场分析的服务进行过度配置（从而浪费昂贵的资源），也不需要担心为变得极其热门的服务进行配置不足（从而错失潜在客户和收入）。因此，云计算的底层业务模型是熟悉的计费服务按需付费模型，用户仅为其使用的内容付费，而不多付，且对服务的额外需求可以实时得到满足\
  \ [1,9]。\n\n随着时间的推移，这种局面自然地导致了全球算力市场的建立 [8]。反之，算力市场的出现有一许多重要的推论。例如，与其投资基础设施，企业和个人创业可能会发现租用基础设施以及通常运行其应用程序所需的软件是有用的。这种强大的想法至少在某种程度上是由于相对廉价、高速互联网的普及、对虚拟化的熟练掌握以及并行与分布式计算的进步所推动的\
  \ [9,12]。\n\n### 21.1.1 车载云初探\n\n本节介绍了车载云（VC）计算的基础思想，并研究了其的一些影响、挑战和机遇。\n\n几年前，受传统云计算成功和前景的启发，许多论文\
  \ [13–17] 引入了车载云的概念，这是对传统云计算范式的一种非凡扩展。车载云的动力源于意识到如今的车辆配备了强大的车载计算机、强大的收发器和一系列令人深刻的传感器设备。事实证明，我们车辆中可用的计算、存储和通信资源大部分时间处于利用不足状态。以有意义的方式利用这些资源将产生重大的社会影响。\n\
  \n很有可能，在正确的激励下，车主将决定租出他们的车载能力，就像大型计算或存储设施的所有者发现租出剩余容量在经济上具有吸引力一样。例如，我们预计在不久的将来，航空旅客将在机场长期停车场停并插入他们的车辆。作为免费停车和其他优惠的回报，他们将允许他们的车辆在他们期间按照\
  \ [14 的建议参与机场数据中心。\n\n更广泛地说，我们预计在车载云中，利用不足的车辆资源（包括算力、存储和互联网连接）可以在驾驶员之间共享，或通过互联网租给各种客户，就像传统的云资源一样。在\
  \ [16] 中，人们认为即使在当前技术下，许多形式的车载云在技术上是可行的，在经济上也是行的。他们预测一旦采用，车载云将成为具有持久技术和社会影响的下范式转移\
  \ [16]。\n\n\n\n\nVC（车辆计算）与传统云的一个根本区别在于资源的所有权。在 VC 中，计算算资源的所有权分布在庞大的车辆所有者群体中，而不是像由\
  \ Amazon、Google、IBM、Microsoft、Facebook、Yahoo!、Oracle 以及其他运行的传统云那样由单一所有者拥有。第一个推论是，VC\
  \ 的资源可能是高度动态的。随着车辆进入和离开停车场，新的计算资源变得可用，而其他资源则离开，这创造了一个波动的环境，使得提高可靠性、可靠性和可用性的任务变得极具挑战性。第二个推论是，在\
  \ VC 中，计算资源的分布式所有使得提高可靠性、可靠性和可用性变得非常困难。为了直观理解这个问题，假设我们刚刚将一个用户作业分配给停车场内的一辆车辆。如果车辆一直留在停车场直到作业结束，那么一切正常。如果车辆在作业完成之前离开，就会出现困难。在这种情况下，除非采取特殊措施，否则所有工作都会丢失，我们必须重新启动整个作业，尝试另一辆车辆，以此类推直到作业完成。\n\
  \n## 21.1.2 大数据应用\n\n每天需要收集和分析的数据量正在迅速增长，事实上呈指数级增长，因为数据是由嵌入在我们的传感器网络、智能手机、智能眼镜、智能汽车、各种\
  \ RFID 读器等各种类型的传感设备收集的 [18]。同样，海量数据由社交网络、各种类型的车载网络以及形成所谓物联网（IoT）的设备产生 [19,20]。\n\
  \n可以论证，我们正在接近计算领域的一个根本性范式转移，因为智能设备（如手机和平板电脑）的用户数预计在 2016 年底将超过 30 亿（占全球人口的 40%），并在未来\
  \ 3 年内增加到 40 亿以上 [21,22]。此外，考虑到微处理器最近的进展以及更多类型连接智能设备（例如智能手表、智能眼镜、智能电表、联网车辆等）的发展，我们正在看到互联网的下一个阶段，其流量主要源于物联网设备。思科预测，联网物联网设备的数量到\
  \ 2020 年将达到 500 亿 [23,24]。\n\n预计到 2017 年，手机、各种可穿戴设备和车辆等设备产生的每月量将达到 14 艾字节，并在 2019\
  \ 年之前超过 24.3 艾字节 [25]。随着带宽容量与数据量之间差距的扩大，越来越多的有用数据将由于处理能力而被丢弃。除了规模之外，各种智能设备收集的数据在上下文信息方面极其丰富，如果采集得当，将对增强我们对环境和日常体验的理解做出巨大贡献。\n\
  \n鉴于上下文的瞬时性和个人及企业对上下文敏感的需求，只有通过近实时处理数据才能从数据中提取出最高价值。然而，由于在远端云设施之间移动数据涉及的延迟和成本，基于云的近实时处理海量数据仍然是一个巨大的挑战。在开发新的数据处理技术之前，具有严格时间限制的大量数据处理在技术上是不可行的，在经济上也是不可行的\
  \ [26]。\n\n另一个需要不仅快速处理而且要可靠处理的大数据集的例子是处理电子商务应用程序中客户体验的类型处理。在这种背景下，最常见的负载是搜索以及许多其他支持和增强客户体验的服务。管理购物篮的内容和潜在客户发起的各种查询，需要高效存储和恢复客户偏好、之前的购买历史、退货、个人数据等的能力。这些信息必须被可靠地维护，并且必须在几毫秒内可用。通常的观点是，不满意的客户将不会成为光顾客\
  \ [27]。\n\n另一种类型的负载与客户发起的查询有关，并涉及复合服务。例如，客户可能对纽约的餐厅感兴趣。搜索算法必须遍历每个此类项目的所有可用发布，并以一种给定的（通常是感知客户的）方式返回答案。成功的搜索服务前提是数据存储是可靠的，并且无论此刻有多少台服务器宕机，都能在几毫秒内进行访问\
  \ [1。\n\n重要的是，上述示例中的用户感知延迟需要几毫秒。因此，任何支持此类应用程序的文件系统必须支持延迟降低。然而，高吞吐量也是一个重要的性能指标，因为热门的服务需要支持数千个并发查询。此类系统的高可用性可以通过存储冗余来实现（每个用户查询可以在两台服务器上执行）。存储冗余意味着每个数据项必须存储在多个位置。\n\
  \n更广泛地说，大数据是一个通用术语，指结构化和非结构化的数据集合（如上所述），这些数据如此巨大且复杂，以至于传统的数据处理应用程序无法处理。然而，这些数据需要用于相关领域的决策，例如客户行为趋势、天气模式、计算机视觉、医学科学、反恐预防、纳米技术、微生物学、机器人学和大规模并行处理等\
  \ [28–37]。以及时、安全和隐私的方式处理这些大量数据的挑战从数据收集、传输、存储、分析到可视化等等。\n\n事实证明，新兴的大数据应用涉及多阶段数据处理\
  \ [26]。许多此类应用依赖于 `MapReduce` [12,38] 以及其开源双胞胎 `Hadoop` [39–41]。由于我们的模拟使用了 `MapReduce`，我们现在简要回顾\
  \ `MapReduce` 的工作原理。\n\n`MapReduce` 由 Google 在 2004 年引入，适用于半结构化和非结构化数据 [2。`MapReduce`\
  \ 的灵感源于同名同功能的 Lisp 函数。`MapReduce` 执行的处理有两个顺序的阶段：`Map` 和 `Reduce`。在 `Map` 阶段，将用户定义的函数应用于每个逻辑输入记录，产生中间的键值对结果；`Reduce`\
  \ 阶段收集 `Map` 阶段产生的所有键值对，并使用另一个用户提供的函数进行折叠。\n\n\n\n[content]\n\n`VC` 的概念是新颖的，`VC`\
  \ 研究社区面临的无数潜在应用和严峻研究挑战也是如此。虽然已经有大量关于不同类型 `VC` 的论文发表，但几乎没有关于 `VCs` 实际可行性的研究。其中一些论文建议基于某种形式的无线通信织格互连的移动车辆来构建\
  \ `VCs`；另一些作者则考虑了移动车辆与静态车辆的混合。我们的大量仿真表明，基于无线通信的 `VC` 似乎无法有效支持大数据应用。我们希望这一负面结果能为\
  \ `VC` 社区敲响警钟。\n\n`VC` 领域的一个重大研究挑战之一是确定 `VC` 可以支持大数据的应用的条件。显而易见，这类具有严格数据处理要求的应用无法由瞬瞬态的\
  \ `VCs` 支持，也就是说，如果车辆在云中的驻留时间（residency time）太短，无法支持 VC 设置和 VM 迁移。同样，带宽受限的互连拓扑结构的\
  \ `VC` 实现也不适用于大数据应用。遗憾的是，绝大多数依赖无线互连织格的 `VCs` 也是如此。\n\n我们的主要贡献是确定了在停车场内基于车辆构建的数据中心能够有效支持大数据的应用的充分条件。这是一项开创性工作：据我们所知，这是研究人员首次评估\
  \ `VC` 概念的可行性及其对支持大数据的应用的适用性。我们的主要发现之一是，如果车辆的驻留时间足够长，且互连织格具有足够的带宽，那么此类数据中心就可以有效支持大数据的应用。关于我们发现的详尽细节在\
  \ Section 21.7 中详细列出。\n\n此时，为读者提供本章的概述是恰当的。Section 21.2 对云服务提供了简要概述，随后在 Section\
  \ 21.3 和 21.4 中分别提供了 `VCs` 的分类法以及对 `VCs` 相关工作研究的综述。在 Section 21.5 中，我们分别回顾了对 VC\
  \ 提供的架构和服务的假设、VM 迁移策略以及车辆的能力。具体而言，在 Section 21.5.1 中，我们讨论了 VM 迁移和数据复制策略；而在 Section\
  \ 21.5.2 中，我们讨论了对车辆车载能力的假设。接下来，Section 21.6 讨论了一个现实中 `VC` 的特定实例，该实例将用于我们的仿真章节。Section\
  \ 21.7 展示了对允许基于 VC 的中心有效支持大数据的应用的条件的实证评估细节。具体来说，Section 21.7.1 介绍了我们的仿真模型；Section\
  \ 21.7.2 展示了我们在实证评估中使用的互连模型；Section 21.7.3 展示了我们对获得结果的解释；Section 21.7.4 对两种设置 VM\
  \ 迁移偏移量的策略进行了批判性分析；Section 21.7.5 对比了基于 VC 的数据中心与传统数据中心的性能。最后，Section 21.8 提供了结论性意见和未来工作方向。\n\
  \n## 21.2A 云服务回顾](#32_Chapter21.xhtml_sec21_2\n\n与云计算（CC）相随而生的是云 IT 服务，它不仅租赁计算资源和存储，还按需提供专门服务。在这种背景下，用户可以根据当时的购买所需的服务量。随着其\
  \ IT 需求的增长以及服务和客户群的扩大，用户将在市场上寻求越来越多的云服务以及更多多样化的计算和存储资源 [26]。因此，对新应用有创新构想的开发者不再需要在硬件和软件上固定资金来测试他们的想法。他们也不需要担心为受欢迎程度未达到预测的服务而过度配置，或为那些突然变得极度受欢迎的服务而配置不足\
  \ [11]。\n\n云计算有三个方面是新颖的：首先，它给用户一种拥有按需获取无限计算资源的错觉，从而消除了他们为资源配置进行远期规划的需求。其次，它消除了云用户的预付财务投入，允许公司从小做起，并仅在硬件资源需求增加时增加。第三，它让用户能够根据需要短期支付计算资源（例如按小时支付处理器，按天支付存储）。\n\
  \n传统的云服务分为三种类型：\n\n### 基础设施即服务 (IaaS)\n在这里，云提供商向客户提供计算、网络和存储资源。一个很好的例子是 `AWS`，亚马逊通过\
  \ `EC2` 提供计算资源，通过 `S3` 和 `EBS` 提供存储服务 [42]。\n\n### 平台即服务 (PaaS)\n`PaaS` 解决方案是开发平台，开发工具托管在云端并通过浏览器访问。通过\
  \ `PaaS`，开发者可以在无需在计算机上安装任何工具的情况下构建 Web 应用，并在无需任何管理技能的情况下部署这些应用。`Google AppEngine`\
  \ [43] 和 `Microsoft Azure` [44] 是此类类别的良好例子。\n\n### 软件即服务 (SaaS)\n通过 `SaaS`，提供商以订阅模式按需向客户许可应用程序。这允许客户使用所需的昂贵软件，而无需担心安装和维护这些软件。`GoogleAppEngine`\
  \ 和 `IBM` [45] 是此类类别的良好例子。\n\n## 21.3 VC 分类法](#32_Chapter21.xhtml_sec21_3\n\n穿梭于我们道路和街道的巨大车队拥有令人印象深刻的车载计算、存储和传感能力。众所周知，这些车辆中有很多每天大量时间停在车库、停车场或车道上。这些停车车辆的计算和存储能力是一个巨大的开发资源，目前正被浪费。这些属性使得车辆成为数据中心服务器的理想候选者。正如\
  \ Section 21.1 所，云计算范式在利用剩余计算能力方面表现良好。\n\n我们相信，早晚我们道路、街道和停车场中巨大车队的潜力将被认为一种丰富且未充分利用的计算资源，可以被开发用于提供第三方或社区服务。\n\
  \n\n\n正如前面提到的，可以预期在适当的激励下，车辆所有者将决定出租其多余的车载能力，这就像大型计算或存储设施的所有者发现出租其剩余容量在经济上具有吸引力一样。例如，可以很自然地假设，旅行者在旅行期间会将车辆停好并插在机场的长期停车库中。在停车库期间，机场将为车辆的计算资源提供电源，并允许对该停车库数据中心进行按需访问。同样，很容易推断出，堵在拥堵交通中的车辆司机将非常愿意自愿提供车载计算资源，以便市政交通管理中心能够运行复杂的仿真，通过全市范围内的交通灯重新调度来帮助缓解拥堵的影响。\n\
  \n请记住，`VC` 中的车辆与传统云中的服务器的区别在于资源的**动态可用性**。显然，某些车辆的停放时间是不可预测的（想想便利店的停车场），而另一些车辆则堵在拥堵交通中，以极低的速度移动并不断改变它们与某些无线网络的连接点。最后，我们的一些车辆在道路上花费大量时间，并可能参与动态变化的情况；在这些情况下，车辆有潜力与当地当局合作，及时解决由于市政交通管理中心缺乏足够计算资源而无法单方面解决的交通相关问题。Eltoweissy\
  \ 等 [46]] 和 Olariu 等 [17]] 认为，在许多此类情况下，车辆有潜力协作解决问题，而这些问题集中式系统需要大量的时间才能解决，从而导致解决方案失去意义。\n\
  \n更具意义的是，Eltoweissy 等 [46]] 假设，在不久的将来，车辆将利用其企业资源自发组织成 `VCs`，并按需且在很大程度上是实时的来解决可能意外发生的关键问题。新的\
  \ `VCs`还将通过其涌现行为和不确定性，有助于破解日益复杂的交通系统中的某些技术挑战。\n\n考虑到这一点，Eltoweissy 等 [46]] 提出将 `VC`\
  \ 视为一组很大程度上自主的车辆，其计算、感知、通信和物理资源可以协调并动态分配给授权用户。\n\n在我们的愿景中，`VC` 概念是满足不仅是驾驶公众而且是更大人群的计算和情境感知需求的下一个自然步骤。`VC`\
  \ 的首要目标是为已经发生但无法通过预分配资产或以主动方式合理满足的事件提供按需解决方案。\n\n界定 `VCs` 的结构、功能和行为特征是重要的。作为朝这一方向迈出一步，Olariu\
  \ 等 [16] 将车辆资源之间的自主协作识别为 `VCs` 的区别特征之一。`VCs` 的另一个重要特征是能够对其车载资源提供无缝集成和去中心化管理。我们预见\
  \ `VC` 可以根据不断变化的应用级需求以及环境和系统条件，动态调整其分配给应用程序的托管车辆资源。\n\n从简单的分类法来说，`VCs` 可以是公共的、私有的或它们的各种混合体。公共\
  \ `VC` 将在互联网上提供（通常是短期的）服务，而私有 `VC` 是专有的，为有限的用户组提供（通常是长期的）服务，并属于特定的车队，例如 FedEx、UPS、Costco\
  \ 或沃尔玛。正如 Florin 等 [47] 所讨论的，私有 `VCs` 可能令军事单位感兴趣。作为混合 `VC` 的示例，可以考虑跨 `VC` 合作。\n\n\
  我们认为，在不遥的将来，建立一个临时建立的大规模 `VCs` 联邦以支持缓解大规模紧急情况，这并不太切切实际。这些大规模紧急情况之一可能是面对面对可能致命的飓风或海啸时进行的计划疏散，这些飓风或海啸预计将登陆沿岸地区\
  \ [48]–53]。另一种此类紧急情况是可能破坏现有基础设施并干扰小区通信的自然或人为灾害。在这种情况下，`VC` 联邦可以提供基础设施的短期替代，并提供决策支持系统。\n\
  \n虽然静态 `VC`（例如停车库中的车辆）可能模拟传统 CC 设施的行为，但我们的许多车辆在道路上花费大量时间，并可能每天参与各种动态变化的情况，从正常交通到拥堵，再到事故以及其他类似的交通相关事件。\n\
  \n在目前的实践下，车辆仅仅是交通相关事件的见证者，而无法参与缓解其影响。我们建议在这些情况下，车辆有潜力与各种当局合作，解决那些否则将花费大量时间解决（交通拥堵）或由于缺乏可以调用的足够资源而无法解决的问题。\n\
  \n`VC` 的移动属性，结合车辆在事件附近的出现通常是一个无计划的过程这一事实，意味着为了 `VC` 缓解事件而进行的车辆资源池必须根据没有预分配的需求自发发生。这种选择在传统云中不存在，且证明是\
  \ `VCs` 的一个重要定义特征。\n\n## 21.4 VC 相关工作综述 (#32_Chapter21.xhtml_sec21_4)\n\n本节的主要目的是对关于\
  \ `VC` 的近期论文进行简要综述。首次引入 `VC` 概念的论文是 Eltoweissy 等 [46] 和 Olariu 等 [15],17]。这些早期论文定义了\
  \ `VCs` 的各种版本，指出了它们的多方面应用，并识别了若干研究挑战。例如，自主云是由 Olariu 等 [15] 首次提出的，他们也综述了一些重要的应用和有趣的研究挑战。\n\
  \n事实上，一些研究人员指出，即使在目前的实践水平下，许多 `VCs` 的实现也是可能的且在经济上可行的 [15,17,54,55]。Olariu 等 [16]\
  \ 认为，一旦被采纳，`VCs` 将是下一个范式转移，将车载网络提升到相关性和创新的新高度。\n\n最近，Gu 等 [56] 发表了一篇综述论文，回顾了 `VC`\
  \ 的关键问题，主要涉及其架构、特征、分类和潜在应用。不久后，Whaiduzzaman 等 [55] 为 `VCs` 的各种研究课题提供了更新的视角。\n\n\n\
  \n\nArif 等人 [14] 研究了运行在大型机场停车场停放车辆之上的数据中心。在这种背景下，他们针对随时间变化的到达和离开率，提出了一种关于停车占用率的随机预测模型。他们提供了关于随时间变化的停车场占用率概率分布、停车场内预期车辆数及其方差的闭式解，并提供了这些参数随时间增加而变化的极限行为的闭式解。除了分析性结果外，他们还获得了一系列实证结果，证实了其分析推导的准确性。\n\
  \nVignesh 等人 [57] 建议了在车辆云（VC）中可以提供的潜在新服务。研究考虑了停车场内的一组动态车辆，这些车辆通常会停放几天，并可以形成一个静态车辆云（SVC）。控制资源分配的车辆被称为\
  \ SVC 主（`SVC-M`）。SVC 中的其他车辆被称为 SVC 参与者（`SVC-P`）。当一辆车辆想要加入 SVC 时，它会广播一条 `Association\
  \ Request` 消息。如果在特定间隔内没有收到任何 `ACK`，它将假设尚未形成 SVC 并充当 `SVC-M`。如果已经存在 `SVC-M`，它将收到一条关联\
  \ `ACK`。在计算即服务（`CaaS`）中，客户端向 `SVC-M` 发送计算请求。`SVC-M` 选择处理能力最强且停车历史最长的节点，然后通过请求联系所选节点，从而交接计算数据。在存储即服务（`StaaS`）中，客户端向\
  \ `SVC-M` 发起存储请求，并带上要存储的内容。`SVC-M` 使用资源表中的信息找到内存最大且可用性最高的节点，联系该节点并将相关的存储文件发送给 `SVC-P`。在\
  \ StaaS 检索中，在 SVC 中存储了数据的客户端向 `SVC-M` 发起存储检索请求。`SVC-M` 找到当前持有请求内容的 `SVC-P`，并联系该\
  \ `SVC-P` 发送要检索的文件名。`SVC-P` 将存储的好的文件内容返回给 `SVC-M`，然后 `SVC-M` 将存储的内容发送给客户端。\n\nHussain\
  \ 等人 [54] 提出了一种网络模型，其架构分为两个网络（即 VANET 和 CC），通过网关终端（`GTs`）连接。在道路上移动的车辆既是生产者也是消费者。路侧单元（`RSU`）作为车辆与云基础设施之间的\
  \ `GTs`。具有车载 3G/4G 接入接入能力的车辆可以作为云的次级 `GTs`。云架构还包括认证器（Authenticator）、`CPM`（云处理模块）、`CKB`（云知识库）和车辆\
  \ CDM（云决策模块）。该系统使用定义消息有效期的“消息生命周期”来防止过时消息拥堵网络。\n\nHe 等人 [58] 为 IoT 环境下的车辆数据云提出了一种新型软件架构。可以开发新一代基于\
  \ IoT 的车辆数据云，带来许多益处，例如预测道路安全的提升、减少交通拥堵、管理交通以及推荐车辆维护或维修。提出的基于 IoT 的车辆数据云包含各种设备，如传感器、执行器、控制器、GPS\
  \ 设备、手机、网络技术（无线传感器网络、蜂窝网络、卫星网络）、CC、IoT 和中间件。它支持 V2V 和 V2I 通信，并在司机、车辆和路侧基础设施（如摄像头和路灯）之间收集并交换数据。本文解释了智能停车云服务。在许多城市寻找可用停车位具有挑战性，因此需要一个寻找可用停车位的系统\
  \ [59, 60]。在这种架构中，车辆配备了处理器和收发器（如蓝牙设备和红外设备）。当车辆准备进入停车场时，入口处会验证预订，如果有效，则向司机发送寻找车位的指导信息。连接到计算机中心的传感器会持续报告每个停车位的状态。这种机制可以用于特定停车位的广告。基于\
  \ IoT 的车辆数据云在大规模部署之前必须具备高效性、可扩展性、安全性和可靠性。现有的算法和机制无法同时满足所有这些要求。面临的一些挑战包括性能、可靠性和服务质量、安全与隐私，以及\
  \ IoT 与新旧设备及技术的集成。\n\n为了能够调度资源并将计算任务分配给 VC 中的各种车辆，一个基本前提是获得一个随时间变化的停车场预期车辆数量的准确描述。使问题变得困难的原因在于到达和离开率的时变性。Arif\
  \ 等人 [14] 针对随时间变化的到达和离开率，提出了一种关于停车占用率的随机预测模型。他们提供了关于随时间变化的停车场占用率概率分布、停车场内预期车辆数及其方差的闭式解，并提供了这些参数随时间增加而变化的极限行为。此外，他们还获得了一系列实证结果，证实了其分析预测的准确性。\n\
  \n最近，Ghazizadeh 等人 [61] 研究了 VC 中的任务调度问题，并提出了基于混合整数规划的近优方案。由于基于整数规划，该方案的缺点是难以扩展。\n\
  \n容错性和可用性是 CC 的重要问题，因此在 VC 中也是如此。在引用的论文中，只有 He 等人意识到容错性和可用性很重要 [58]；然而他们并未提供任何解决方案。最近，Ghazizadeh\
  \ [62] 开始研究提高 VC 平均故障时间（`MTTF`）的策略。他的工作由 [63, 64] 以及 Florin 等人 [47] 继续。\n\n与其他与\
  \ VC 管理相关的重要主题也受到了关注。例如，Baron 等人 [65] 和 Refaat 等人 [66] 正在解决 VC 中虚拟机（`VM`）迁移的重要课题。虚拟机迁移策略在传统\
  \ CC 中至关重要。由于 VC 的动态性，虚拟机迁移在这里变得更加重要。\n\n最后，Yan 等人 [67] 研究了 VC 中提供安全隐私的问题。他们证明了传统\
  \ CC 中发现的许多安全问题会延续到 VC 中。此外，他们识别了若干 VC 特有的安全问题并提出了初步解决方案。\n\n## 21.5A 数据中心和 VC 模型的高层视图\
  \ #32_Chapter21.xhtml_sec21_5\n\n本节的主要目标是展示本章假设的数据中心和 VC 模型的概览。数据中心和 VC 模型将在第 21.6\
  \ 节 和第 21.7 节 中进行更详细的介绍。\n\n\n\n\n\n在本章中，我们处理一个由（静态）VC（虚拟连接池）支持的数据中心，该 VC 构建在位于足够大的停车场内停放的车辆之上，类似于大型机场的长期停车场，或者是雇佣数千人且\
  \ 24/7 全天候运营的大型停车场。更具体地说，我们考虑后一种场景的变体，并在第 21.6 节中进行详细描述。出于显而易见的原因，这样的停车场几乎总是接近满员，特别是总能找到可以分配给新接入用户任务的车辆。\n\
  \n生成的 VC 将收集停车场内参与车辆的计算资源和存储资源，用于创建一个基于 VC 的数据中心和一个巨大的分布式数据存储设施。在有适当的安全保护措施下，它将成为企业无法负担浪费的重要计算资产。在上述场景中，VC\
  \ 的架构将与传统云 [1,6,68, 69] 的架构几乎相同，主要区别是 VC 比传统数据中心要动态得多。事实上，想象一下当大量工人下班离开，而由下一班次的人员接替他们时，会发生什么。\n\
  \n为了保持相对简单，我们假设 VC 仅提供 IaaS 云服务。回想在 IaaS 中，用户请求硬件平台并指定偏好的 OS 支持。如图 21.1 所示，VC 为用户提供所需硬件平台和操作系统的虚拟化实例，并将其封装为\
  \ `VM` 和 `guest OS`，由停车场中的某辆车辆托管。出于容容性考虑，每个用户任务可能被被分配到多辆车辆上。当运行在特定车辆中执行用户任务的 `VM`\
  \ 终止执行时，结果将上传到数据中心。在这种场景下，数据中心等待指定数量的用户任务实例终止，并使用例如`基于共识的算法`（quorum-based algorithm）或`投票机制`（voting\
  \ mechanism）做出最终判定 [70–73]。\n\n![fig21_1.jpg](img/fig21_1.jpg)\n\n图 21.1 展示了本章假设的虚拟化模型。\n\
  \n为了直观理解正在进行的处理类型，请考虑数据中心提交执行的用户任务，并参考图 21.2，该图提供了数据中心管理模块的功能视图。提交的用户任务的需求需要——包括在需要模拟的硬件平台、请求的\
  \ `OS` 以及用户指定的输入数据方面的需求——将由 `Job Admission`（任务准入）守护进程进行评估。如果数据中心能够满足这些需求，则任务会被接收并插入等待执行的任务队列中。否则，任务将被拒绝。\n\
  \n![fig21_2.jpg](img/fig21_2.jpg)\n\n图 21.2 展示了本章假设的数据中心管理模块的功能视图。\n\n一旦任务到达队列头部，控制权将传递给虚拟化代理，该代理将用户任务指定的资源封装进\
  \ `VM`、特定的 `OS` 以及输入数据 `VM` 中。最后，虚拟化代理将控制权传递给 `job scheduler`（任务调度器），由它识别执行任务的某辆车辆（或一组车辆）。为了简单起见，在本章中，我们假设每个用户任务都分配并执行在单辆车辆上。为了冗余而让每个用户任务运行在几辆车辆上的扩展情况，将在后续工作中进行研究。\n\
  \n接下来，图 21.3 展示了数据中心通信结构的逻辑视图。这种通信结构在概念上与标准数据中心非常相似（参见 Barroso 等人 [1]）。如果考虑到停车场中的车辆就像服务器机架中的服务器，那么这种类比会更易理解。因此，停车场在逻辑上被划分为停车位集群、集群区域等。每个集群内的通信由一个名为\
  \ `cluster controller`（集群控制器）的交换机控制。同样，区域内的通信由一个名为 `region controller`（区域控制器）的交换机控制。参考图\
  \ 21.3，停车场被划分为 `N` 个区域。每个区域由 `k` 个集群组成。上述数据中心管理器负责将用户任务分配到停车场中的各种车辆。\n\n![fig21_3.jpg](img/fig21_3.jpg)\n\
  \n图 21.3 展示了本章假设的数据中心通信逻辑视图。\n\n### 21.5.1 VM 迁移与数据复制](#32_Chapter21.xhtml_sec21_5_1)\n\
  \n当车辆准备好离开停车场时，需要执行一系列操作。首先，如果该车辆托管着 `guest VM`，则该 `VM` 以及离开车辆的所有中间数据必须迁移到停车场中的另一辆可用车辆。目前有多种`VM\
  \ migration`策略 [65,66,74,75]。在本章中，我们没有实现特定的迁移方案。我们估计了给定的 `VM size` 和可用带宽下，此类迁移所需的平均时间。\n\
  \n受到 Google 文件系统 (`GFS`) [76] 和 Google 记录系统 `Bigtable` [77] 采用的数据复制策略启发，为了支持可靠性、性和可用性，数据中心将强制多阶段大数据应用进行数据复制。\n\
  \n例如，在 `Map stage` 结束时，以`键值对`集合形式存在的中间结果将存储在停车场的多辆车辆中。同样，当属于多阶段用户任务的 `VM` 必须迁移时，它将（在可能的情况下）前往存储该任务相关中间数据的车辆之一。更多细节将在第\
  \ 21.6 节和第 21.7 节中讨论。\n\n### 21.5.2 车辆模型](#32_Chapter21.xhtml_sec21_5_2)\n\n过去的\
  \ 10 年里，道路和城市街道上的车辆正呈现出明显的智能化趋势，驾驶体验也变得更加安全、压力更小，因此更加愉快 [78]。如今典型的车辆可能包含以下某些设备：车载计算机、配备`数字地图`的`GPS\
  \ 设备`、无线收发器、短程后碰撞雷达设备以及`摄像头`。在高端车型中，这些设备还配备了复杂的传感器设备，可以提醒驾驶员各种机械故障和路况。\n\n\n\n\n\
  我们假设每辆车辆都拥有一个可虚拟化的车载计算机，其类似于但不一定等同于 Intel Itanium [80]、AMD Athlon 或 Opteron 系列处理器。假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1 [注：此处原文链接为图]）。在本章中，我们假设每辆车辆只运行一个 `VM`。这一限制并非本质要求，仅为了简化演示。由于我们的车辆具有强大的计算能力和充足的存储空间，它们是仓库级计算机中服务器的理想人选\
  \ [2]。\n\n我们假设数据中心已经实现了一种识别停车场内可用车辆的机制。这种机制可以通过为每辆车辆分配一个状态位来实现。当某辆车辆即将离开停车场时，数据中心会通知分配给同一用户任务的其他车辆其即将离开。当车辆进入停车场并加入\
  \ `VC` 时，它将与数据中心管理器的资源组件建立通信。我们假设车辆司机会随机选择一个空闲停车位。资源管理器会识别车辆停所在的集群和区域。最后，作业调度器可以使用某种形式的局部性标准选择一个或多个可以分配给任务的可用车辆。\n\
  \n## 21.6 数据中心架构细节](#32_Chapter21.xhtml_sec21_6)\n\n本节的目标是阐述位于工厂停车场车辆的数据中心细节，该工厂每天\
  \ 24 小时、每周 7 天持续运转。*停车场的客户通过错峰 8 小时轮班在工厂工作，提供了一个可以作为数据中心基础的车辆池。我们假设停车场内的车辆已插入标准电源插座，并连接到数据中心的以太网。数据中心面临的挑战在于动态变化的资源保持高可用性和可靠性。我们将识别并分析权衡，并对比几种可能的解决方案。\n\
  \n由于 320 名开始 8 小时工作日的新工人接替：\n\n*   停车场的容量为 2560 辆车辆，并假设几乎总是是满的。\n*   我们假设所有属于离岗员工的\
  \ 320 辆车辆在 320 辆新车驶入之前离开停车场。\n*   到达的车辆随机选择一个空闲停车位。\n*   对于每辆车辆，数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。\n\
  \n### 服务\n\n数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。我们假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机 `VM`\
  \ 与宿主车辆资源之间的映射（参见图 21.1）。\n\n数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。我们假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1）。\n\n*   数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。我们假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1）。\n\n*   数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。我们假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1）。\n\n*   数据中心会跟踪其状态（可用或忙碌）、到达时间和离开时间等信息。我们假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1）。\n\n（注：原文后续存在大量重复内容，已按要求完成翻译并保留格式）\n\n... 假设这些车辆已预装了合适的虚拟机监控器（`VMM`），它负责虚拟机\
  \ `VM` 与宿主车辆资源之间的映射（参见图 21.1）。\n\n\n\n\n\n**完成的总任务数**：每当一个任务完成时，数据中心就会增加一个代表完成任务数的计数器。在仿真结束时，保存平均值。\n\
  \n**每个任务的失败次数**：当任务失败时，数据中心会增加一个代表失败任务数的计数器。在仿真结束后，将该数字除以完成的任务数。\n\n**每个任务的 VM 迁移次数**：每当启动\
  \ VM 迁移时，数据中心就会增加一个代表 `VM migrations` 数量的计数器。将此除以完成的任务数，得到每个任务的 `VM migrations`\
  \ 数量。\n\n**MTTF**：`MTTF` 在停车场中定义为在发生故障前，所有任务完成的总处理时间之平均值。在仿真结束后，平均任务完成时间、完成的总任务数以及任务失败次数均已已知。要获得\
  \ `MTTF`，将平均任务完成时间乘以完成的任务数，然后除以任务失败次数。该值将被保存。\n\n## 21.7 经验性性能评估\n\n鉴于停车场数据中心的先驱性，以及我们对报告在基于\
  \ VC 的数据中心中交付大数据应用的可性的兴趣，我们在仿真中广泛改变了参数，以充分了解该模型的运行情况。在此过程中，我们为该基准仿真选择了运行大量不同的实验多次，而不是对少数实验运行多次。这使我们能够获得对各种输入参数的完整视图，代价是失去了多次运行取平均带来的平滑效应。\n\
  \n回想一下，数据中心提供 IaaS 云服务，为了固定思路，假设用户任务是两阶段 MapReduce 任务，每个任务涉及 50 GB 的输入，这符合大数据处理的需求。\n\
  \n### 21.7.1 仿真模型\n\n每个实验运行 1 周（10,080 分钟），时间步长为 1 分钟。车辆到达的设置使得停车场几乎始终处于满状态。我们假设车辆停留时间呈指数分布，平均值为\
  \ 480 分钟。当车辆到达时，它被分配到停车场内的随机一个空位。车辆到达停车场后，立即被认为可以分配任务。\n\n进入的的用户任务被放置在数据中心运行的任务队列中，只有在满足以下条件时才会被分配：\n\
  \n- 在任何给定时刻，停车场内只有 `u`（车辆利用百分比）的车辆可以被分配任务。\n- 在任何给定时刻，只有 `i` 辆车辆可以处于初始任务设置状态。\n\
  - 每个车辆在任何给定时刻最多被分配一个 VM。\n\n在我们的每次仿真中，`u` 设置为 0.8，`i` 在 100、200 和 300 之间变化，这意味着只有停车场内\
  \ 80% 的车辆可以被分配任务，并且根据 `i` 的值，只有 100、200 或 300 辆车辆可以处于任务的初始设置阶段。`u` 和 `i` 都充当限制从任务队列分配任务数量的节器。\n\
  \n进入的任务根据参数为 `λ` 的泊松分布到达，每 0.05 分钟在 0.05 到 1 分钟之间变化。`λ` 代表任务间隔时间，意味着任务到达频率从每 3 秒一次到每\
  \ 60 秒一次不等。\n\n任务到达后被分配到组织为优先级队列的任务队列。到达时间最早的任务首先分配给停车场中离开时间最晚的车辆。每个任务都有 VM 大小、输入数据大小和处理时间。VM\
  \ 大小和数据大小都是静态的，分别设置为 500 MB 和 50,000 MB（即 50 GB）。处理时间从 30 分钟到 300 分钟不等，以 30 分钟为增量。\n\
  \n分配后，任务开始执行五个任务中的第一个。第一个任务是初始任务设置。在此任务中，数据中心通过网络向车辆发送 VM（假设大小为 500 MB）和输入数据（大小为\
  \ 50 GB），如第 21.7.2 节所示。在完成此步骤之前可能开始处理。\n\n接下来的三个任务是 Map、备份和 Reduce 任务。在 Map 和 Reduce\
  \ 任务中，完成了一半的任务处理，意味着每个 Map 和 Reduce 任务持续处理时间的一半。Map 和 Reduce 任务之间是备份任务。在此任务中，中间数据（假设大小为\
  \ 25,000 MB，即 25 GB）从宿主车辆复制到三个备份主机：其中两个备份主机发送到同一个集群，额外的备份主机是同一组内但不同集群的车辆。任务失败时，可以使用备份在\
  \ Reduce 任务处重启任务。备份也通过网络发送。\n\n#### 仿真参数\n\n| 参数 | 描述 | 数值 |\n| :--- | :--- | :---\
  \ |\n| 仿真长度 | 以分钟计的仿真长度 | 10,080 分钟 |\n| 车辆停留分布 | 车辆在停车场停留时间的分布 | 指数分布 |\n| 车辆停留平均值\
  \ | 车辆停留的平均时间 | 平均 480 分钟 |\n| 进入任务分布 | 进入任务的分布 | 泊松分布 |\n| `λ` | 进入任务的间隔时间 | 在\
  \ 0.05 到 1 之间变化 |\n| `u` | 可分配的总车辆比例 | 0.8 |\n| `i` | 处于初始设置状态的任务数量 | 在 100、200\
  \ 和 300 之间变化 |\n| VM 大小 | VM 的大小 (MB) | 500 MB |\n| 数据大小 | 数据的大小 (MB) | 50,000 MB\
  \ |\n| 任务处理时间 | 任务处理所需的时间 | 在 30 到 300 分钟之间变化 |\n| `τ` | 车辆离开前开始 VM 迁移的时间 | 30 和\
  \ 60 分钟 |\n\n最后一个任务是任务结项任务。Reduce 任务的结果必须通过网络发送到数据中心。\n\n我们假设知道车辆离开的时间。根据这些信息，我们能够缓解车辆离开导致的任务失败。如果存在备份，可以将任务\
  \ VM 迁移到备份车辆，并重启任务。数据中心将在车辆离开前设定的时间 `τ` 开始此 VM 迁移。这为数据中心留出了时间寻找新车辆分配任务，然后将 VM 迁移到该车辆。如果存在备份，新主机将选择为尚未分配任务的车辆。如果有多个，则选择离开时间最晚的一个。如果没有备份，或者没有可用的新主机，则车辆将继续执行其当前任务，直到备份主机可用或车辆离开。如果找到了新主机，则必须通过网络将\
  \ VM 发送到新主机。如果车辆在任务完成之前或 VM 迁移之前离开，则任务将失败并重新插入任务队列。由于前面提到，任务队列是根据任务进入系统的时间组织为优先级队列，因此失败的任务将优先于新到达的任务，并分配给下一个可用的车辆。\n\
  \n## 21.7.2 网络模型\n\n\n\n\n\n在我们的模拟中，有四种消息通过网络发送：初始设置数据、备份数据、VM 迁移数据和作业完成数据。为了简化模型，我们选择通过为每条消息在每条链路上分配平等的带宽来模拟网络。这种选择让我们更容易理解数据中心正在发生的情况，而不是引入某些特定协议的复杂性。我们假设在当前时间单位内发送的消息在同一时间单位内完成发送和接收，且可用带宽可以充分利用。每条消息的路由首先确定，每条链路的带宽分配给该链路上的所有消息。然后，对于每条特定的消息，使用最低链路带宽，这代表了该消息可用的带宽。\n\
  \n## 21.7.3 解释我们的结果\n\n每张图在特征上都有明显的区分。当 `λ` 的值接近 0.6 时，图 21.5 中的每张图都显示出明显的分水岭。当达到这一点时，除非处于初始设置状态的任务移动到下一个状态，否则无法分配额外的作业。这起到了准入控制守护进程的作用，并充当数据中心的节流器，以确保网络不会过于拥堵。当\
  \ `i` 为 100 时（如图 21.5 的第一列所示），分水岭接近 `λ` 为 0.65。同样，对于 `i` 为 200，分水岭接近 `λ` 为 0.6；对于\
  \ `i` 为 300，分水岭接近 `λ` 为 0.55。这个分水岭代表了满足 `i` 值的位点。在右侧，对于较低的入站作业速率，随着作业速率降低或 `λ` 增加，数据中心能够更高效地运行已分配的作业。这是预期的，如果分配给数据中心的作业较少，它就能更高效地处理它们。\n\
  \n![fig21_5.jpg](img/fig21_5.jpg)\n\n图 21.5 `τ = 60` 的作业统计数据。作业完成时间开销：(a) `i = 100`，(b)\
  \ `i = 200`，以及 (c) `i = 300`。停车场中的平均作业数：(d) `i = 100`，(e) `i = 200`，以及 (f) `i =\
  \ 300`。完成的总作业数：(g) `i = 100`，(h) `i = 200`，以及 (i) `i = 300`。\n\n这种效率在图 21.5 中显示作业完成时间开销的第一行图表中清晰可见。这显示了作业完成时间减去作业处理时间。这代表了由于网络和\
  \ VM 迁移带来的开销。在最右侧，对于较低的入站作业速率，开销很低，代表在网络上发送数据的时间非常短。随着作业速率的增加，网络中的流量增加，导致作业完成时间增加。在分水岭点，入站作业的数量受到初始作业设置状态下作业数量的限制。\n\
  \n从图 21.5 的中间行图表中可以看出，停车场中任何一点分配的作业数量在分水岭左侧保持几乎恒定。在分水岭右侧，它急剧下降并最终趋于平缓。每个作业至少需要作业处理时间才能完成，就像具有无限带宽的网络情况一样。随着更多作业被添加到数据中心，网络负载增加，为作业完成时间增加了更多开销，这在第一行图表中也可见。这导致停车场中的作业数量急剧增加，直到它们被值\
  \ `i` 节流为止。在分水岭左侧，停车场中的作业数量几乎恒定。这表明数据中心能够按照接收作业的速率完成作业。\n\n图 21.5 的第三行图表显示了完成的作业数量。如预期的那样，随着节流器\
  \ `i` 从 100 个作业增加到 200 个作业，完成的作业数量随之增加。当增加到 300 个作业时，这一趋势并没有持续；相反，对于某些作业处理时间值，情况反转。这是由于在\
  \ `λ` 值较低且作业处理时间较高的情况下，发生了越来越多的作业失败。\n\n我们现在看图 21.6 中的图表。这些图显示了与离开数据中心的车辆相关的统计数据。在这些图中，仍然存在与图\
  \ 21.5 中图中相同的分水岭，但没有那么明显。失败通常发生在 `λ` 分水岭的左侧且作业完成时间较高。这符合直觉，因为如果有更多的作业且作业时间更长，那么作业将增加网络负载，直到作业时间超过车辆的停留时间为止。这正是图\
  \ 21.6 第一行图表所示。这些是作业失败。随着入站作业速率和时间的增加，失败更多。同样，随着节流器 `i` 的增加，失败也会增加。\n\n![fig21_6.jpg](img/fig21_6.jpg)\n\
  \n图 21.6 `τ = 60` 的失败统计。作业失败：(a) `i = 100`，(b) `i = 200`，以及 (c) `i = 300`。每个作业的迁移：(d)\
  \ `i = 100`，(e) `i = 200`，以及 (f) `i = 300`。MTTF：(g) `i = 100`，(h) `i = 200`，以及 (i)\
  \ `i = 300`。\n\n图 21.6 的中间行图表显示了每个作业的迁移数量。这些图的形状反映了第一行。在理想的图中，迁移数量应该比失败更多且更显著。我们没有看到这一点，说明我们的迁移方式不是最优的。\n\
  \n最后，我们看图 21.6 底行的 MTTF。为了获得 MTTF 的值，我们将完成的作业数乘以完成时间，除以作业失败数。对于较小的节流值 `i`，MTTF 较高，并随着\
  \ `i` 的增加而降低。当 `i` 等于 100 时，最差的 MTTF 超过 60000 分钟（10 小时）。当 `i` 等于 200 时，最差的 MTTF\
  \ 超过 15000 分钟（4.16 小时），当 `i` 等于 300 时，最差的 MTTF 仅超过 7600 分钟（2.1 小时）。\n\n## 21.7.4\
  \ 比较 VM 迁移偏移\n\n图 21.7 中的图表显示了我们 30 分钟和 60 分钟 VM 迁移偏移图的表。我们预计 30 分钟的 VM 迁移偏移的结果比\
  \ 60 分钟的设置好得多。这种直觉来自于我们的观察：VM 迁移不需要长时间，因为其尺寸很小，而且通过在 60 分钟时开始 VM 迁移，我们实际上缩短了每个车辆能够处理的时间。\n\
  \n![fig21_7.jpg](img/fig21_7.jpg)\n\n图 21.7 `τ = 60` 和 `τ = 30` 的对比。完成的总作业数：(a)\
  \ `i = 200`, `τ = 60`；(d) `i = 200`, `τ = 30`。每个作业的失败：(b) `i = 200`, `τ = 60`；(e)\
  \ `i = 200`, `τ = 30`。每个作业的迁移：(c) `i = 200`, `τ = 60`；(f) `i = 200`, `τ = 30`。\n\
  \n\n\n\n\n在图 21.7 中，每个图表的 `i` 值均等于 200，顶行的 `τ` 为 60 分钟，底行为为 30 分钟。图表的第一列显示完成的作业数量，第二列显示每个作业的失败次数，第三列显示每个作业的虚拟机（VM）迁移次数。作业完成时间的差异微乎其微，但对于虚拟机迁移偏移量为\
  \ 60 的情况，其数值比 30 的略好。这种差异最大时仅为多完成了不足 100 个作业。随着 `λ` 的减小和作业完成时间的增加，数值差异随之增大。虚拟机迁移偏移量为\
  \ 60 时，其迁移次数大约是 30 时的两倍。最后，我们看到虚拟机迁移偏移量为 60 时的作业失败次数略少于 30 时的。这些结果再次向我们证明了，我们的虚拟机迁移并不理想。\n\
  \n### 21.7.5 与传统数据中心的比较\n\n最后，为了将我们的车载数据中心（VC）与具有相似带宽和服务器的传统数据中心进行比较，我们保持所有输入参数相同，仅将车辆的驻留时间设置为无穷大。结果的差异将代表车辆离开数据中心所造成的开销。这些结果在图\
  \ 21.8 和 21.9 中所示。\n\n![fig21_8.jpg](img/fig21_8.jpg)\n\n图 21.8：车载数据中心与传统数据中心的比较。完成作业总数：(a)\
  \ `i = 100`, `τ = 60`；(b) `i = 200`, `τ = 60`；(c) `i = 300`, `τ = 60`；(d) `i = 100`，传统；(e)\
  \ `i = 200`，传统；(f) `i = 300`，传统。\n\n![fig21_9.jpg](img/fig21_9.jpg)\n\n图 21.9：车载数据中心与传统数据中心的比较。作业完成时间开销：(a)\
  \ `i = 100`, `τ = 60`；(b) `i = 200`, `τ = 60`；(c) `i = 300`, `τ = 60`；(d) `i = 100`，传统；(e)\
  \ `i = 200`，传统；(f) `i = 300`，传统。\n\n首先，我们看图 21.8，它显示了 VC 和传统数据中心在 `i` 分别等于 100、200\
  \ 和 300 时的完成作业数量，分别对应第一、第二和第三列。为了进行比较，我们使用 60 作为 `τ` 的值。该值在传统数据中心的结果中并不重要，因为这些服务器不会离开。如预期的那样，在所有情况下，VC\
  \ 完成的作业数量都少于数据中心。在 `i` 等于 100 时，两者的差异非常小。随着 `i` 值的增加，这种差异变得非常显著，特别是当作业完成时间增加时。这在\
  \ `i` 等于 300 时最为明显。车辆离开导致的开销使得传统数据中心完成的作业远多于我们基于 VC 的中心。\n\n接下来，我们看图 21.9，它显示了基于\
  \ VC 的中心和传统数据中心的作业完成时间开销。同样，列显示了 `i` 等于 100、200 和 300 的值，顶行显示基于 VC 的中心，底行显示传统数据中心。如预期那样，在所有情况下，基于\
  \ VC 的中心开销都大于传统数据中心。同样，随着 `i` 的增加和作业完成时间的增加，基于 VC 的中心表现更差。两者的差异代表了由于车辆离开停车场导致的作业完成时间开销。\n\
  \n### 21.8 结语与未来工作方向\n\n几年前，受传统云服务成功的启发，许多论文引入了 VC 的概念，这是对传统云计算（CC）范式的一种非平凡扩展。\n\
  \n在这一开创性工作中，我们研究了在中等规模停车场内基于车辆构建的数据中心能够有效支持大数据应用的充分条件，并确定了实现此类 VC 的基准解决方案。本文仅是我们未来工作的基础和第一步。\n\
  \n受 GFS 采用的数据复制策略的启发，我们提出并研究了停车场内车辆数据存储冗余的影响。在我们的模拟中，在 `Map` 阶段结束时，数据的两个实例被复制到与原始车辆处于同一集群的车辆上，另一个实例复制到同一组但不同集群的车辆上。在未来的工作中，我们将考虑更多的数据复制场景，并考虑阶段数比\
  \ `MapReduce` 作业少或多的作业。作为基准，假设假设是每辆车辆一次只能运行一个 `VM`，并尝试进行 `VM` 迁移。\n\n在未来工作中，我们将考虑在多辆车辆上运行\
  \ `VC` 以增强可靠性。在未来工作中，我们将考虑 `VC` 启动。\n\n## 参考文献\n\n1. L. A. Barroso, J. Clid, and\
