  \n\n\n\n大数据流处理已成为大规模传感网络中海量连续数据流实时处理的重要范式。在处理来自物联网（IoT）的大型传感数据流时，数据流管理器（`DSM`）必须始终验证数据的真实性、完整性和机密性，以确保端端安全，因为通信介质是无线且不可信的。恶意攻击者可以在任何时间、任何地点从源端到云数据中心访问并修改数据。现有的数据安全验证技术不适用于数据流应用，因为验证应该实时进行，而会给数据流引入延迟。在本章中，我们将为大数据流提出一种基于动态素数的安全验证（`DPBSV`）框架。我们的框架基于一个共同共享密钥，该密钥通过生成同步的素数来动态更新。共同共享密钥在双方（即源端传感设备和\
  \ `DSM`）同步更新，在握手后无需进一步通信。对我们 `DPBSV` 框架的理论分析和实验结果表明，它可以通过减少时间并在 `DSM` 中利用更小的缓冲区来显著提高验证过程的效率。我们在模拟环境中实验了该方案，并证明了该方法的可性。我们观察到，该方案不仅减少了验证时间或\
  \ `DSM` 中的缓冲区大小，还通过不断更换共享密钥增强了数据的安全性。\n\n## 13.1 引言\n\n诸如电信、网络安全、大规模传感器网络等应用场景都需要对数据流进行实时处理，而传统的“存储并处理”方法的适用性是有限的。有广泛的应用需要基于云的数据流处理（例如：来自大规模传感器的数据、信息监控、网页浏览、来自\
  \ Twitter 和 Facebook 等社交网络的数据、监控数据分析、金融数据分析）。这些应用产生高量、高速度和实时数据作为输入，因此需要一种新的数据处理范式。结果，一种基于流处理引擎（`SPEs`）的新型计算范式应运生。`SPEs`\
  \ 处理特定类型的挑战，旨在以最小延迟处理数据流。\n\n网络监控和欺诈检测等某些应用产生的数据超出了传统数据处理基础设施的能力。这些应用需要对极高量的数据流（称为大数据流）进行实时处理。大数据的复杂性通过\
  \ V4 特性定义：(1）量（volume）——指太字节（TB）、拍字节（PB）甚至艾字节（$10^{18}$ 字节）的存储数据；(2）多样性（variety）——指来自社交媒体（如\
  \ Twitter、Facebook）、传感器、监控、图像或视频、医疗记录等各种来源的非结构化、半结构化和结构化数据；(3）速度（velocity）——指数据进出的速度；(4）真实性（veracity）——指数据的质量。这些特征为大数据流处理带来了巨大的机遇和挑战。大数据流在本质上是连续的，进行实时分析非常重要，因为数据的寿命通常很短（应用程序只能访问一次数据）。\n\
  \n尽管处理大数据流已成为重要的研究课题之一，但安全数据流处理受到的研究人员关注较少。某些数据流源于任务关键型应用（例如：环境监测、军事应用），这些应用中的数据流需要安全保护。当成千上万个小传感器同时产生用于实时分析的数据流时，问题会进一步恶化。棘手的问题是：我们是否能够在满足任务关键型数据处理约束（例如，最小化数据处理开销）的同时，高效地执行数千个数据流的安全处理？此外，与传统的“存储并处理”方法相比，这些传感器的处理能力、存储、带宽和能量都是有限的。\n\
  \n安全威胁之一是中间人攻击，恶意攻击者可以访问或修改来自传感器的数据流。这种情况的出现是因为无法监控部署在不可信环境中的大量传感器。通常的方法是应用加密模型来保护数据流。在加密密钥的保护下，保持数据加密状态是确保传输数据安全的最常见且安全的选择。目前有两种主要的加密加密算法可用：非对称和对称。非对称密钥加密算法（例如\
  \ `RSA`、`ElGamal`、`DSS`、`YAK`、`Rabin`）在大型有限域上执行多次指数运算。因此，它们比对称密钥加密慢 1000 倍。如果将基于非对称加密的基础设施（如公钥基础设施\
  \ `PKI`）应用于大数据流，效率可能会成为严重问题。因此，对称密钥加密是此类应用最高效的加密解决方案。然而，对称密钥算法（例如 `DES`、`AES`、`IDEA`、`RC4`）在面对大数据流的实时、即时处理时不具备可扩展性。\n\
  \n在本章中，我们展示了基于动态素数的安全验证（`DPBSV`）方案的设计与开发。我们的方案基于共同共享密钥的概念，通过生成同步素数来动态且周期性地更新。同步素数能够在不损害安全性的情况下减少通信开销。我们的方案适用于大数据流，因为它能够即时（以最小延迟）验证安全性（机密性和完整性），从而减少了通信开销。与对称加密算法相比，该方案使用的密钥长度短得多（64\
  \ 位）。这使得数据流管理器（`DSM`）能够对流进行更快的安全验证处理。通过动态更新共享密钥维持相同的安全级别。动态密钥生成基于随机素数，并在传感器和 `DSM`\
  \ 中初始化并同步。由于我们的方案在初始握手密钥步骤后不需要 `DSM` 和传感器节点进行通信，因此我们节省了网络开销。\n\n\n\n本章其余部分的安排如下：第\
  \ 13.2 节 提供了大数据流的背景以及相关的安全相关工作。第 13.3 节 提供了一个大数据流中的动力性示例，并对我们的研究问题进行了详细分析。第 13.4\
  \ 节描述了 DPBSV 密钥交换方案。第 13.5 节正式给出了该方案的安全性分析。第 13.6 节通过实验结果评估了该方案的性能和效率。第 13.7 节对本章进行了总结。\n\
  \n## 13.2 建议的安全数据流架构](#24_Chapter13.xhtml_sec13_2)\n\n### 13.2.1 大数据流](#24_Chapter13.xhtml_sec13_2_1)\n\
  \n数据流处理是一种新兴的计算范式，特别适用于必须近实时（具有极低延迟）处理海量数据（称为大数据）的应用场景。与传统的批处理系统不同，后者的查询处理是在归档数据（即数据在处理之前需要根据预定义的模式进行存储）上进行的，而\
  \ `SPE` 实时处理实时时间流数据。即时处理的需求源于输入数据量大且速度快，由于实际原因（例如数据存储开销），这些数据无法持久化以供以后分析。`DSM` 处理元组的方式类似于传统数据库系统处理关系的方式。此外，`DSM`\
  \ 还承担了对数据块进行即时安全验证。\n\n由于其按需扩展性、极低的延迟和大规模并行处理架构，云计算已成为处理大数据的首选平台 [13]。它支持从大数据流中获取可操作信息的最有效方法\
  \ [5,14–16]。图 13.1 展示了我们基于云的大数据流处理系统架构，其由数据源、云数据中心和 `DSM` 框架组成。关于数据中心云中流数据处理的更多信息，请参考\
  \ 参考文献 17。需要注意的是，流数据的安全性验证必须在实际流查询处理步骤之前，以固定缓冲区的大小实时执行。最后，处理后的数据存储在云存储中。在 `DSM`\
  \ 中注册的查询被定义为“连续的”，因为它们持续应用于流数据流。每当流数据满足查询谓词时，结果就会发送给用户。查询（包括安全验证操作）被定义为有向无环图，每个节点是一个运算符，边定义了数据流。\n\
  \n![fig13_1.jpg](img/fig13_1.jpg)\n\n图 13.1 从源感知设备到云数据处理中心的架构概述。\n\n从上述描述可以清楚看出，安全性验证是大数据流处理的关键需求之一。我们注意到，在我们\
  \ `DSM` 框架中提出的安全性验证步骤增加了整个流处理的时间。因此，`DSM` 的主要挑战是减少这种额外的安全验证开销。由于大数据具有高量和高快的特点，这对大数据流至关重要。因此，在我们的\
  \ `DSM` 方法中，安全性验证是即时完成的（具有极小的开销）。\n\n### 13.2.2 基于对称密钥加密的安全验证方法论](#24_Chapter13.xhtml_sec13_2_2)\n\
  \n数据加密标准 (`DES`) 自 1977 年以来一直是一种标准的对称密钥算法。然而，它很容易被破解。2000 年，`AES` [18] 取代了 `DES`\
  \ 以满足日益增长的数据安全需求。`AES` 也称为 Rijndael 算法，是一种对称块密码算法，可以使用 128、192 或 256 位的对称密钥加密 128\
  \ 位的数据块 [18,19]。`AES` 的引入是为了取代三重 DES (`3DES`) 算法。因此，我们将我们提出的解决方案与 `AES` 进行了比较。\n\
  \n对称密钥的大小小于非对称密钥，因此它们的计算负担较小。128 位对称密钥提供的保护强度与 3248 位非对称密钥相同 [11]。由于目标是即时（实时）进行安全性验证，由于其可扩展性，对称密钥加密成为自然选择。文献指出，对称密钥加密比强公钥加密快\
  \ 1000 倍 [10]。然而，由于密钥较小，对称密钥加密相对容易读取/修改 [10]。为了解决这个问题，我们在源端和 `DSM` 端定期应用同步素数生成算法。这种智能修改使得整个安全性验证过程更快并防止了攻击。我们将在后文中详细解释该算法。\n\
  \n我们假设部署的节点以两种模式运行：信任模式和不信任模式。在信任模式下，节点在加密安全空间运行，攻击者无法渗透该空间。节点可以结合信任平台模块 (`TPM`)\
  \ 来设计信任模式。`TPM` 是一种遵循加密微控制器系统标准的专用安全芯片 [20]。`TPM` 提供了硬件信任，包含在芯片中的密钥生成、存储和管理等加密功能。详细架构见参考文献\
  \ 20。我们假设建议的素数 (`Pi`) 和源节点上的密钥计算是在信任模式下进行的。\n\n\n\n通信安全技术主要针对网络通信而提出。网络通信相关的攻击大致分为两类：外部攻击和内部攻击。为了避免此类攻击，针对每一个独立的\
  \ TCP/IP 层都提出了安全解决方案。对于物理层，提出的解决方案包括扩频干扰报告、节点物理封装的精确且完整设计等；对于数据链路层，提出的解决方案包括错误检测、冲突检测与规避技术、速率限制等；对于网络层，提出的解决方案包括链路层加密与认证、多路路由、身份验证和认证广播等；对于传输层，提出的解决方案包括数据认证\
  \ [21]。这些解决方案可以避免通信威胁，但不适用于应对大数据流带来的新挑战。\n\n服务器端数据安全主要针对物理数据中心，当数据处于静态状态并通过应用程序访问时。此类数据存在多种潜在攻击，如数据中断、截获、隐私泄露、仿冒、会话劫持、编程漏洞、软件修改、软件中断、篡改、破坏通信、硬件中断、硬件修改等。目前已提出多种解决方案来保护数据和云服务器免受攻击，例如多租环境下的隐私、防止数据泄露、访问控制、软件安全、服务可用性、应用安全、数据安全（如传输中数据、静态数据、记忆数据）、云管理控制安全、虚拟云保护、硬件安全、硬件可靠性等\
  \ [23–27]。然而，这些提出的解决方案是针对“存储并处理”范式设计的，因此不再适用于流式大数据流处理。\n\n现有基于对称加密的数据安全解决方案主要基于静态共享密钥或集中式动态密钥。在静态共享密钥中，我们需要一个长密钥来防御潜在的攻击者。密钥的长度与安全验证时间成正比。根据大数据流处理的要求（如上所述），显然安全验证应该实时完成。对于动态密钥管理解决方案，集中式的重密钥处理以及向所有源分发密钥是一个耗时的过程。大数据流在本质上是连续的，且通常规模巨大。这使得在重密钥、分发和同步完成之前无法停止数据移动。为了解决这个问题，我们提议一种无需重密钥的大数据流安全验证方案。其优点包括减少通信开销，并提高\
  \ DSM（数据流监控）中安全验证过程的效率。\n\n我们提出的方案如下：传感器和 DSM 之间使用公共共享密钥。该密钥通过生成同步的质数进行动态更新，无需它们之间进行通信。这减少了现有方法中重密钥过程所需的通信开销，同时又不损害安全性。得益于通信开销的减少，我们的方案以最小延迟执行安全验证。在初始密钥建立和同步阶段需要通信，因为\
  \ DSM 在这一步会将所有密钥和密钥生成属性发送给源。握手之后，源传感器与 DSM 之间不再有进一步通信，这提高了方案的效率。基于共享密钥属性，各个源独立更新自己的动态密钥。\n\
  \n## 13.4 基于动态质数的安全验证](#24_Chapter13.xhtml_sec13_4)\n\n本节描述了 DPBSV 方案。类似于任何基于私密钥的对称加密，DPBSV\
  \ 方案由四个独立组件组成：系统设置、握手、重密钥和安全验证。表 13.1 提供了描述该方案时使用的符号。接下来我们将详细描述该方案。\n\n### 表 13.1\
  \ 符号\n\n| 缩写 | 描述 |\n| --- | --- |\n| `Si` | 第 $i$ 个传感器的 ID |\n| `Ki` | 第 $i$ 个传感器的私钥\
  \ |\n| `Ksi` | 第 $i$ 个传感器的会话密钥 |\n| `Kenc` | 用于认证生成的密钥 |\n| `KSH` | 传感器与 DSM 的共享密钥\
  \ |\n| `K/K′` | 使用传感器私钥加密用于用户认证 |\n| `C/C′/C′''` | 计算出的哈希值 |\n| `r` | 传感器生成的随机数\
  \ |\n| `t` | 生成质数的间隔时间 |\n| `Pi` | 随机质数 |\n| `Kd` | DSM 的私钥 |\n| `k` | 传感器和 DSM\
  \ 用于认证的初始共享密钥 |\n| `ID` | 用于完整性检查的加密数据 |\n| `AD` | 用于真实性检查的密钥 |\n| `E()` | 加密函数\
  \ |\n| `H()` | 单向哈希函数 |\n| `Prime(Pi)` | 质数生成函数 |\n| `KeyGen` | 密钥生成过程 |\n| `⊕`\
  \ | 位按异或操作 |\n| `||` | 拼接操作 |\n| `DATA` | 传感器加密前的新数据 |\n\n#### 13.4.1 DPBSV 系统设置](#24_Chapter13.xhtml_sec13_4_1)\n\
  \n在定义方案时，我们做出了一些现实且实用的假设。首先，我们假设 DSM 已部署了所有传感器的身份 (IDs) 和私钥，因为网络是完全不可的。我们允许在初始会话密钥建立过程中增加传感器与\
  \ DSM 之间的密钥交换，以实现更高的安全性。我们的目标是让此会话更安全，因为我们将密钥生成的所有秘密信息发送给传感器。我们假设传感器节点 `Si` 和 DSM\
  \ 都有一个共享密钥，即 `k`。\n\n**步骤 1**：传感器 (`Si`) 生成一个随机数 `r` 并带有身份 `{Si, r}` 发送给 DSM。部署了\
  \ `n` 个传感器，它们为 `S1, S2, S3, … , Sn`，`Si` 是第 $i$ 个传感器的 ID。在我们的方案中，传感器之间互不通信以减少通信开销。提出的方案还会更新两端的动态共享密钥，以防止来自流量行为分析的潜在攻击。\n\
  \n```\n. Si → DSM: {Si, r}.\n```\n\n**步骤 2**：一旦 DSM 收到来自传感器的请求，它首先检索相应的传感器私钥，即 `Ki\
  \ ← retrieveKey(Si)`，然后 DSM 选择一个随机会话密钥 `Ksi`，即 `Ksi ≤ ftarrowradomdKey()`。为了与相应的传感器\
  \ (`Si`) 共享此会话密钥，DSM 根据选定的会话密钥和相应的传感器私钥生成密钥 `Kenc = Ksi ⊕ Ki`。获取生成密钥 (`Kenc`) 后，DSM\
  \ 使用会话密钥加密生成密钥 `K = Ek(Ksi, Kenc)` 并执行哈希函数 `C = H(Kenc||K||r)`。最后，DSM 将 `C` 的值和\
  \ `Kenc` 发给 `Si`。\n\n```\nKenc = Ksi ⊕ Ki, 从随机选定的会话密钥生成。\nK = Ek(Ksi, Kenc)\nC =\
  \ H(Kenc||K||r)\n```\n\n```\n2. Si ← DSM: {C, Kenc}.\n```\n\n**步骤 3**：相应的传感器根据其自身的私钥\
  \ `Ksi = Kenc ⊕ Ki` 获取会话密钥 `Kenc`，并根据 `Ksi` 和 `Kenc` 的值发现 `K′` 的值，即 `K′ = Ek(Ksi,\
  \ Kenc)`。接下来，它计算 `H(Kenc||K'||r)` 并检查其是否等于 `C`。如果哈希相等且 `K = K'`，Si 即可认证 DSM。然而，如果不相等，则\
  \ Si 结束协议。认证后，它将 `C′ = H(1||Kenc||K'||r)` 发送给 DSM。\n\n```\nKsi = Kenc ⊕ Ki, 提取自己的会话密钥。\n\
  ```\n\n基于共享密钥属性，各个源独立更新其动态密钥。\n\n\n\n\n$$\\begin{array}{rcl} {K'} & = & {E_{k}(K_{\\\
  mathit{si}},K_{\\mathit{enc}})} \\\\ {C'} & = & {H(1 \\parallel K_{\\mathit{enc}}\
  \ \\parallel {K'} \\parallel r)} \\end{array}$$\n\n### 3. `Si` → `DSM`: `{C'}`\n\
  \n步骤 4：接收 `C'` 后，`DSM` 将其与 `H(1\\parallelKenc\\parallelK\\parallelr)` 进行比较以检查两者是否相等。如果相等，`DSM`\
  \ 对 `Si` 进行验证。否则，协议终止。在 `DSM` 和传感器的验证之后，`DSM` 和 `S` 可以共享会话密钥 `Ksi` 和 `C'' = H(2\
  \ ∥ Kenc ∥ K ∥ r)`。\n\n`C*″ = *H*(2 ∥ *K*[*e**n**c*] ∥ *K* ∥ *r*)`\n\n### 4. `Si`\
  \ ← `DSM`: `{C''}`\n\n### 13.4.2 DPBSV 握手 (#24_Chapter13.xhtml_sec13_4_2)\n\n`DSM`\
  \ 根据各自的会话密钥向传感器发送其所有属性 `{S1, S2, S2, … , Sn}`。通常情况下，在点对密钥建立过程中使用的秘密份额素数越大，该点对密钥所实现的安全性就越高。然而，使用更大的素数作为秘密份额需要更长的计算时间。为了使安全验证变得更轻量、更快速，我们减小了素数的大小。动态素数生成函数定义在定理\
  \ 13.2 中（在本章后文描述）。我们在传感器端和 `DSM` 端均计算素数，以减少通信开销并最大限地减少泄露共享密钥的概率。\n\n步骤 5：`Prime\
  \ (Pi)` 在时间间隔 `t` 内计算双方的互质数。在握手过程中，它传输其生成密钥和素数的所有步骤，例如 `(Kd, t, Pi, Prime(Pi), KSH,\
  \ KeyGen)`。\n\n### 5. `Si` ← `DSM`: `Ek(Kd, t, Pi, Prime(Pi), KSH, KeyGen)`。\n\n\
  在这一步中，`DSM` 将 `KeyGen` 的所有参数和属性发送给源传感器。传输的信息存储在传感器的信任部分（例如，`TPM`）。\n\n### 13.4.3\
  \ DPBSV 密钥更新 (#24_Chapter13.xhtml_sec13_4_3)\n\n我们提出了一种新的密钥更新机制，该机制在源传感器和 `DSM`\
  \ 上独立地动态计算素数。在所提出的方案中，较小的密钥尺寸导致更快的安全验证。然而，较小的密钥尺寸容易被破解。为了解决这个问题，定期更新密钥对。一旦传感器发生密钥泄露，`DSM`\
  \ 将按照下所述与传感器进行密钥重同步过程。源传感器执行步骤 3，以与 `DSM` 重新初始化并同步密钥对。我们假设密钥密钥信息以信赖的方式由传感器管理，例如采用\
  \ `TPM` 硬件。\n\n以下介绍了另一种密钥更新方法以及在效率方面的相应分析。\n\n步骤 6：上述定义的 DPBSV 握手过程将与 `Prime (Pi)`\
  \ 和 `KeyGen` 相关的信息传输给传感器。接下来我们描述基于上述函数和密钥的安全数据传输与验证过程。如上所述，所提方案在双方（即传感器和 `DSM`）应用同步的动态素数生成函数\
  \ `Prime (Pi)`。握手过程结束时，传感器和 `DSM` 拥有同步的动态素数生成 `Prime (Pi)`。`DSM` 传输生成密钥和素数的所有步骤，例如\
  \ `(Kd, t, Pi, Prime(Pi), KSH, KeyGen)`。根据 `Pi` 和 `Kd`，`DSM` 使用指定的素数生成 `KSH`。所提方案选择加密密钥\
  \ `Ki` 的数据块。加密数据 `AD` 包含两个部分：第一部分是基于 `Ki` 的完整性检查，第二部分是基于 `KSH` 的身份验证（即）。\n\n`C*″ = *H*(2 ∥ *K*[*e**n**c*] ∥ *K* ∥ *r*)`\n\
  \n### 6. `Si` → `DSM`: `Ek(Kd, t, Pi, Prime(Pi), KSH, KeyGen)`。\n\n### 13.4.4 DPBSV\
  \ 安全验证 (#24_Chapter13.xhtml_sec13_4_4)\n\n根据数据流的特征，安全验证应实时进行（延迟最小）。步骤 7：`DSM` 验证数据在传输过程中是否被篡改以及是否由经认证的节点发送。`DSM`\
  \ 首先根据指定的素数验证 `AD` 的身份和完整性。这种随机变量基于素数计算，即 `j = Pi%7`。计算出的值从 0 到 6，如果 `j` 的值为 0，则将验证每个数据块。对于身份验证检查，`DSM`\
  \ 使用共享密钥 `KSH` 解密 `AD`。一旦获得 `Si`，`DSM` 根据 `j` 的值提取相应的密钥 `Ki` 进行完整性检查。给定 `Ki`，`DSM`\
  \ 解密数据并检查消息认证码（MAC）以验证完整性 `DATA = ⊕ KSH ⊕ Ki`。\n\n$$\\begin{array}{l} S_{i} = A_{D}\
