  \ 20.4.1 节](#31_Chapter20.xhtml_sec20_4)中介绍。\n\n## 20.4.2 结果分析\n\n本章提出的算法应用于中国某医院的实际项目。在项目中，在长沙国家超级计算中心（NSCC）构建了数据中心和云平台。每日医院治疗数据被传输并存储在数据中心的\
  \ `HBase` 数据库中。然后，定期将治疗数据加载到`Spark 集群`中，并使用`所提的 POTC 算法`训练该医院的 POTC 模型。每个患者所需的任务以及任务的当前队列情况实时传输到云平台。每个任务的预测等待时间通过训练好的时间预测模型计算。最后，通过移动系统为每个患者提供医院治疗路线的实时推荐。\n\
  \n\n\n\n\n![fig20_11.jpg](img/fig20_11.jpg)\n\n图 20.11 Spark 集群上的作业提交过程。\n\n首先，在\
  \ `Spark cluster` 启动后，`POTC` 和 `HTRR` 系统被提交到 `Spark driver`。当系统中的动作函数被触发时，会根据 `Spark\
  \ context` 生成一个新的作业。该作业被提交到 `Spark master`，`DAG scheduler` 为每个作业生成一个 `DAG` 图，该图将计算各种作业阶段并将阶段划分为多个任务。\n\
  \n其次，任务被提交到 `task scheduler`，它负责将这些任务调度到 `Spark cluster` 中工作节点上相应的 `executors` 上。\n\
  \n最后，每个工作节点上都存在一个或多个 `ExecutorBackend` (`EB`) 进程。每个进程包含一个 `executor` 对象，该 `executor`\
  \ 对象拥有一个线程池，每个线程将启动一个任务。\n\n## 20.4.2 应用结果分析\n\n在本节中，对所提的算法和医院系统进行了各种实验和应用。从中国某家医院选择了大量的历史医院数据。以药剂任务的实验结果为例，从任务量、操作时间消耗和平均等待时间方面进行了讨论。\n\
