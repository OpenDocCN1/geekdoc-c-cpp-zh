  \ Informatics Association*, 22(6):1143–1147, 2015.\n\n# 19. 最大化大数据项目的投资回报\n## 一种基于项目开发增量资金支持的方法\n\
  Antonio Juarez Alencar, Mauro Penha Bastos, Eber Assis Schmitz, Monica Ferreira\
  \ da Silva, and Petros Sotirios Stefaneas\n\n## 目录\n- 摘要\n- [19.1 引言]\n- [19.2 概念背景]\n\
  \    - [19.2.1 子项目间的依赖关系]\n    - [19.2.2 项目融资]\n    - [19.2.3 运行序列滚动发布]\n- [19.3\
  \ 相关工作]\n    - [19.3.1 论大数据项目和倡议的增量融资]\n    - [19.3.2 相关工作总结]\n- [19.4 示例]\n   \
  \ - [19.4.1 特别小组]\n    - [19.4.2 计划准入标准]\n    - [19.4.3 托管医疗计划]\n    - [19.4.4 项目规划]\n\
  - [19.5 方法总结]\n- [19.6 结论]\n- [参考文献]\n\n### 摘要\n大数据已经创造了一个可以建立、维持和增强竞争优势的基础。然而，大数据项目经理经常意识到财务规划对于确保回报至关重要。否则，他们的项目投入过多产出不足。本文介绍了一种最大化大数据投资回报的方法。该方法利用了项目通常被划分为子项目的特点。此外，考虑到并非所有子项目都会运行，子项目的运行顺序可能会改变大数据的价值。这一切为大数据项目经理提供了工具，帮助他们做出更好的决策。\n\
  \n### 19.1 引言\n近年来，公私部门都可以获取分析大量的结构化和非结构化数据。根据 Chen 等 (2014) 以及 Rao 和 Ali (2015)\
  \ 的观点，大部分数据来自：\n1. 日常记录在计算机信息系统中的业务交易。\n2. 在互联网上搜索信息的搜索引擎。\n3. 连接全球用户的社交网络。\n4.\
  \ 连接互联网的物理物体（电器、传感器、摄像头、机器等）。\n\n“大数据”一词经常被用来指代这些海量数据。\n\n### 19.2 概念背景\n许多人正确地声称，大数据已成为获得竞争优势、支持创新、销售增长、提高生产力和增强客户满意度的基础（Tien，2015）。然而，大数据的业务价值来自于组织拥有的数据量，而在于如何利用这些数据。在这方面，利用目前的技术可以从各种来源收集数据。然后对这些数据进行分析，为降低成本、增加收入、缩短流程、加速产品开发和优化广告提供答案（Fosso\
  \ 等，2015）。\n\n### 19.3 相关工作\n结果是，许多各种类型的大数据项目正在运行。这些项目涵盖了不同的业务和研究领域，如金融服务（Bedeley\
  \ & Iyer, 2014）、城市规划（Sullivan & Mitra, 2014）、生物信息学（Shahzad & Ahsan, 2014）、生态学（Hampton\
  \ 等，2013）以及医疗保健（Groves 等，2013）等。根据 Wikibon 的研究分析师 Jeff Kelly 的说法，大数据市场可能到 2017 年将超过\
  \ 500 亿美元（Kelly, 2014）。\n\n\n\n\n尽管如此，一个公认的经济学原理是任何事情都是代价的（Shiffman & Jochum, 2011）。此外，每一个理性的投资决策都必须考虑投资者当前面临的所有机会。因此，一个投资机会除了要盈利外，还必须从财务角度具有吸引力，也就是说它必须比其他投资机会提供更多的财务收益（Melicher\
  \ & Norton, 2013）。\n\n然而，许多大数据项目经理往往没有意识到财务规划对他们负责项目的影响。结果是，许多大数据项目的资本投入往往比应该投入的多，而且投资回报率较低。此外，它们可能面临更大的财务风险。所有这一切都可能使财务上可行的项目变为不可行或缺乏吸引力的尝试，从而不得不放弃（Chen\
  \ et al., 2015; Dutta & Bose, 2015）。\n\n本章介绍了一种从财务角度分析大数据项目的方法。该方法考虑到了大数据项目通常被划分为一组相互关联的子项目，以便于理解、规划和执行（Kerzner,\
  \ 2013）。此外，它还识别了能够使即将进行的投资回报最大化的子项目运行顺序。最后，它还考虑到不运行组合中的所有子项目可能更有利。这往往使大数据项目更具吸引力和价值，增加了它们被选中实施的机会。\n\
  \n本章的其余部分结构如下：第 19.2 节介绍了理解后续章节所需的概念和技术。第 19.3 节讨论了与本章内容相关的工作。第 19.4 节通过一个真实世界启发的案例介绍了该方法。第\
  \ 19.5 节对该方法进行了总结。最后，第 19.6 节给本章的结论。\n\n## 19.2 概念背景](#30_Chapter19.xhtml_sec19_2)\n\
  \n根据项目管理协会（[www.pmi.org](http://www.pmi.org)）的定义，项目是一项旨在创造独特产品、服务或结果的临时性活动。在这种语境下，子项目是范围缩减的项目划分，包含紧密相关的活动（PMI,\
  \ 2013）。\n\n将项目划分为子项目的想法并不新鲜。据信，埃及人在约 5000 年前就利用了这种方法来加速吉萨高地金字塔的建造（El-Mehalawi,\
  \ 2010; Hodgson & Cicmil, 2006）。在这方面，使用子项目有助于理解、规划、执行和监控。此外，它可能使成本和期限的估算更加准确（Kerzner,\
  \ 2013）。\n\n根据 Denne 和 Cleland-Huang 的观点，项目可以分为两种子项目（Alencar et al., 2012a）。第一类被称为最小可销售特性或\
  \ `MMFs`，它们在完成后会产生直接的财务回报。第二类被称为架构元素或 `AEs`，不产生直接的财务回报。然而，它们对于其他子项目的完成是必要的。尽管 Denne\
  \ 和 Cleland-Huang 的观点最初是以软件模块的形式表达的，但在这里它们被扩展到了项目和子项目。\n\n### 19.2.1 子项目间的依赖关系](#30_Chapter19.xhtml_sec19_2_1)\n\
  \n尽管 `AEs` 和 `MMFs` 通常是独立的单元，但可能存在某个子项目只有在另一个项目完成后才能运行的情况。这在子项目之间创建了依赖关系，这种关系通常通过网络图的支持进行建模（Kerzner,\
  \ 2013）。\n\n例如，考虑一个由项目 `P` 划分出的子项目组合 `SP = {sp1, sp2,…dots, sp10}`。假设 `sp2` 只有在\
  \ `sp1` 完成后才能运行，`sp3` 和 `sp6` 相对于 `sp2` 也是如此。此外，考虑到 `sp4` 只有在 `sp3` 完成后才能运行，且 `sp5`\
  \ 在 `sp4` 结束之前不能运行。进一步，考虑 `sp7` 只有在 `sp6` 完成后才能运行，而 `sp8` 相对于 `sp7` 也是同样的情况。此外，请注意\
  \ `sp9` 和 `sp10` 的运行不依赖于彼此的完成。然而，它们在运行之前必须等待组合中所有其他子项目的完成。图 19.1 所示的网络图规定了这些依赖关系。\n\
  \n![fig19_1.jpg](img/fig19_1.jpg)\n\n图 19.1 网络图。\n\n在图 19.1 中，`Begin` 和 `End` 是虚拟子项目。它们的运行不需要资本投入。此外，它们的完成不需要时间且不产生结果。此外，从一个子项目指向另一个子项目的箭头（例如\
  \ `sp1 → sp2`）表示后者在前者完成后才能运行。\n\n## 19.2.2 融资](#30_Chapter19.xhtml_sec19_2)\n\n\
  由于任何事情都是代价的（Shiffman & Jochum, 2011），除了 `Begin` 和 `End` 等虚拟子项目外，每个子项目都需要资本投入才能运行。此外，某些子项目会产生流。表\
  \ 19.1 的财务输入输出描述了现金流。例如，表 19.1 展示了项目的现金流。Kerzner (2013)。\n\n表 19.1 子项目的现金流\n\n![page388-01.jpg](img/page388-01.jpg)\n\
  \n在表 19.1 中，`Id` 用于识别每个子项目的唯一标识符。`Type` 指明子项目是 `AE` 还是 `MMF`。`Period` 指任意长度的时间，例如天、周等。`MkSp`（跨度表示子项目完成所需的周期数。例如，表\
  \ 19.1 中的所有子项目都需要一个周期。\n\n表 19.1 中从 1 列到 24 列的数字是子项目的财务输入和输出。这些数字以任意货币的千为单位，例如美元、欧元、日元、英镑等。符号\
  \ `$` 用于指定该货币的值。正值是财务输入（即收入），而负值是财务输出（即支出）。\n\n例如，表 19.1 在第一期针对子项目 `sp5` 记录了 `$100\
  \ K`（十万货币）的输出。这是运行该子项目所需的资本投入。在第 2 和 3 期，`sp5` 分别产生 `$10 K` 和 `$20 K` 的输出。从第 4 期到第\
  \ 24 期，它每期产生稳定的 `$60 K` 输出。因此，`sp5` 是一个 `MMF`。子项目 `sp8`、`sp9` 和 `sp10` 遵循相同模式也是\
  \ `MMF`。表 19.1 中剩余的子项目都是 `AE`，即 `sp1`、`sp2`、`sp3`、`sp4`、`sp6` 和 `sp7`。\n\n需要注意的是，表\
  \ 19.1 中描述的输入输出流在第 24 期结束。在该期结束时，子项目 `sp1`、`sp2`、\\dots、`sp10` 产生的最终产品已经过时，预计将新的解决方案接管。从第\
  \ 1 期到第 24 期的时间长度被称为机会窗口，简称 `WO`。\n\n\n\n\n这是一项广为人知的财务原则：与不同时期相关的货币价值其价值并不等同。其原因非常简单。例如，资金可以进行投资并产生财务回报。具体而言，它可以被借出并产生利息。此外，其价值可能会受到通货膨胀和外汇市场波动的侵蚀。因此，为了对不同时期的货币价值进行适当的操作（加、减、除等），必须使用利率对这些相关的货币价值进行调整（Gitman\
  \ & Zutter, 2014）。\n\n在这方面，子项目的财务价值通常由其现金流元素的调整后总和给出，这些元素考虑了子项目开始的时期。这样的总和被称为其净现值，或简称为\
  \ `NPV`。在更正式的术语中，在第 `t` 期开始的子项目 `sp` 的 `NPV` 由下式给出：\n\n![math19_1](img/eq19_1.jpg)\n\
  \n其中 `WO` 是子项目的机会窗口，`ek ∈ {1,2,… wo−t+1}` 是 `sp` 的第 `k` 个现金流元素，`i` 是利率。例如，考虑每期的利率为\
  \ 1.5%，这也被用于本章后续的所有示例中。如果 `sp5` 在第 `3` 期运行，那么：\n\n$$\\mathit{NPV}(\\mathit{sp}5,3)\
  \ = \\frac{- \\$ 100\\ \\text{K}}{{(1 + 1.5\\%)}^{3}} + \\frac{\\$ 10\\ \\text{K}}{{(1\
  \ + 1.5\\%)}^{4}} + \\frac{\\$ 20\\ \\text{K}}{(1 + 1.5\\%)^{4}} + \\cdots + \\\
  frac{\\$ 60\\ \\text{K}}{(1 + 1.5\\%)^{24}} = \\$ 847\\ \\text{K}$$\n\n如果 `sp5`\
  \ 在第 `4` 期运行，其 `NPV` 将减少到 $793 K。在第 `5` 期，其 `NPV` 进一步减少到 $740 K，依此类推。表 19.2 根据它们运行的时期展示了子项目\
  \ `sp1`、`sp2`、……`sp10` 的 `NPV`。\n\n#### 表 19.2\n根据运行开始时期的子项目 NPV\n\n![page389-01.jpg](img/page389-01.jpg)\n\
  \n如果一个项目要完全实施，那么它的所有子项目都必须运行。在这种情况下，项目的财务价值是其子项目 `NPV` 之和。另一方面，如果一个项目只部分实施，那么其 `NPV`\
  \ 就是实际将要运行的子项目的 `NPV` 之和。例如，考虑图 19.1 中描述的子项目的运行序列：\n\n`RS = sp1 → sp2 → sp6 → sp7\
  \ → sp8 → sp3 → sp4 → sp5 → sp10 → sp9`\n\n此外，还要考虑表 19.3 中建立的约束条件。\n\n#### 表 19.3\n\
