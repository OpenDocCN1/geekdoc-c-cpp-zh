  \ `56%`，而...\n\n\n\n\nI/O 内核开销也略有减少。正如 Li 等人 [19] 所指出的，我们认为这种减少归于系统缓存，因为运行的线程更少，上下文切换也更少。\n\
  \n### 7.4.4 自适应批处理的评估\n\n为了研究批处理的影响，我们修改了 `Tyche` 的实现，使其能够对请求和数据消息进行批处理，并应用动态算法来选择批级别。新版本称为\
  \ `Tyche-Batch`。此外，我们还实现了一个在整个执行过程中使用固定批级别的别的静态版本。\n\n我们使用 `FIO` 运行 60 秒，采用直接 I/O、随机读写、4\
  \ kB 请求大小，并使用 1, 2, 4, 8, 16, 32, 64 和 128 个线程发出请求，每个线程 4 个未完成请求。以原始方式访问远程存储设备。我们还测试了我们的批处理技术对于更大的尺寸没有收益，但也不会损害性能。`Tyche`\
  \ 应用了 NUMA 亲和性。\n\n动态版本配置的检查间隔为 1 秒，`max_level_batch` 为 64 个请求，`max_delay` 为 5 毫秒。我们运行静态版本，并将\
  \ 2, 4, 8, 16, 32 和 64 个请求作为 `max_batch_level`。然而，我们只展示了 2、8 和 64 个请求的结果，因为它们的行为相似。\n\
  \n图 7.12 展示了取决于未完成请求数量的由动态 `Tyche-Batch` 版本（图中为 `DyB`）以及以 2、8 和 64 个请求为批处理层级的静态版本（B-2、B-8\
  \ 和 B-64）以及未启用批处理的 `Tyche` (NoB) 所实现的链路利用率。\n\n![fig7_12.jpg](img/fig7_12.jpg)\n\
  \n图 7.12 在数据消息也进行批处理时，使用 `FIO`、直接 I/O 以及 4 kB 随机读写时，动态和静态 `Tyche-Batch` 版本以及无批处理的\
  \ `Tyche` 所实现的链路利用率。(a) 读请求。(b) 写请求。\n\n动态 `Tyche-Batch` 在读和写方面分别优于无批处理版本 57% 和\
  \ 53%。对于读取，我们的方案实现了高达 88% 的链路利用率，对于写入则高达 81%。\n\n将动态版本与静态版本相比，我们看到动态版本实现了最佳性能，并遵循了提供最佳行为的静态版本。有时，静态版本优于动态版本，但它们之间的差异非常小。在这些情况下，当通过批处理大量请求可以获得更高吞吐量时，算法采取了保守决策。\n\
  \n静态版本在低并发性下的性能和链路利用率较差。原因是批消息发送到目标端是因为 `max_delay` 到期，而不是因为达到了批级别。\n\n### 7.4.5\
  \ 弹性评估\n\n我们现在分析针对 `zmIO` 和不同工作负载提出的弹性过程。测试使用直接 I/O、异步操作、顺序读写、32 个线程提交请求、2 个未完成请求并使用原始设备运行。为了更改工作负载，我们连续运行六次测试，使用不同的请求大小，每个持续\
  \ 30 秒。测试的请求大小为 4 kB、16 kB、64 kB 和 1 MB，测试顺序为 4 kB, 16 kB, 1 MB, 64 kB, 4 kB 和 1\
  \ MB。\n\n最初，六个通道（每个网卡一个）处于激活状态，`Tyche` 每 5 秒检查一次吞吐量。`Tyche` 应用了亲和性优化，激活通道数将为两个，每个节点一个。\n\
  \n图 7.13 展示了 `Tyche` 实现的 MB/s 吞吐量（左轴实线）以及测试执行期间开启的通道-网卡数量（右轴虚线）。\n\n![fig7_13.jpg](img/fig7_13.jpg)\n\
  \n图 7.13 在执行 `zmIO` 时，针对请求大小为 4 kB, 16 kB, 1 MB, 64 kB, 4 kB 和 1 MB 的顺序读写，`Tyche`\
  \ 实现的吞吐量（左 y 轴）和开启的 NIC 数量（右 y 轴）。(a) 读请求。(b) 写请求。\n\n对于 4 kB 请求，`Tyche` 关闭四个通道（每个\
  \ NUMA 节点两个），因为两个通道足以为该尺寸提供最大吞吐量。当请求大小变为 16 kB 时，`Tyche` 在每个节点开启一个通道，35 秒左右的步骤显示了这种行为。当请求大小为\
  \ 1 MB 时，`Tyche` 为每个节点开启第三个通道，所有 NIC 都在工作。这些通道将一直开启，直到第 125 秒请求大小变为 4 kB。此时，`Tyche`\
  \ 关闭四个通道（每个节点两个），并仅保持两个通道激活状态。最后，当尺寸变为 1 MB 时，所有通道再次开启，并达到了最大吞吐量。\n\n当增加请求大小时，图\
  \ 7.13 显示了 `Tyche` 开启通道的阶梯状。然而，当通道关闭时，吞吐量曲线没有这些阶梯，因为吞吐量只是下降了。\n\n## 7.5 相关工作\n\n\
  关于网络存储协议，`iSCSI` 和 `NBD` 构建在 TCP/IP 之上。相比之下，`Tyche` 使用以太网传输，开销更小。`HyperSCSI` [20]\
  \ 修改了 `iSCSI` 以使用原始以太网代替 TCP/IP。它通过添加流控制、分段和重组等缺失组件将以太网转换为可用的存储基础设施。相比于 `Tyche`\
  \ 透明地使用多个 NIC，处理同步问题，并使用类 RDMA 操作和拷贝减少技术。`Tyche` 中使用的所有技术都可以整合到 `HyperSCSI` 中。\n\
  \nRDMA 已广泛用于如 `iSER`（iSCSI for RDMA）[1]、`SRP`（SCSI RDMA Protocol）和 `RDMA 辅助 iSCSI`\
  \ [2]，它们通过利用 RDMA 操作提升了 `iSCSI` 的性能。两种常用协议是广域 RDMA 协议（iWARP）和融合以太网 RDMA（RoCE）。`iWARP`\
  \ 在 TCP 上运行 RDMA，而 `RoCE` 在以太网上运行。然而，所有这些协议侧重于通过硬件支持提供 RDMA 能力。`Tyche` 则专注于使用现有以太网并探索主机与网卡之间软件接口的问题。\n\
  \n关于拷贝减少技术，若干作者提出了类似技术 [21–23]，通常是为了避免内核与用户空间之间的拷贝。Rizzo 通过允许应用程序直接访问数据缓冲区来消除数据拷贝成本\
  \ [23]。我们的方法通过确保以太网环形和 `Tyche` 队列之间交换页面来避免内核空间的拷贝。\n\n\n\n社区长期以来认为锁竞争是实现共享内存并行程序高性能的关键障碍\
  \ [12,27,29,30,]。 如今，并行系统中由于同步机制导致性能损失的潜在性已得到广泛认同。Bjørling 等人 [29] 证明了在 Linux 块层中，用于保护\
  \ I/O 请求队列的单锁可能成为 SSD 的瓶颈。他们提议每个核心使用一个队列来解决这个问题。在我们的案例中，我们使用队列方法来避免在存在高并发大写请求且应用程序未应用内存放置时，`NIC`\
  \ 锁发生的锁竞争。\n\n最近，由于 SSD 和新兴存储设备的出现，人们对存储访问的延迟和开销重新产生了浓厚兴趣 [31–34]。Rumble 等人 [34]\
  \ 分析了网络协议的延迟问题，并声称操作系统应该实现新的网络架构和协议来从端端解决延迟问题。最近，几项工作建议跳过内核并在用户空间 I/O 栈中运行，通过消除内核穿越开销来降低延迟\
  \ [12,14,35]。然而，我们的建议是通过重新设计网络 I/O 路径并在不修改操作系统的情况下降低延迟。\n\nGim 等人 [13] 显示上下文切换的开销主要源于数据缓存的污染。他们提出了一种根据\
  \ CPU 利用率、I/O 延迟和请求大小等多个特征来执行或不上下文切换的机制。然而，我们的方法是使用运行整个路径的单线程来消除 `4 kB` 请求的上下文切换。\n\
  \n目前，许多网络存储协议正在使用批量消息或批量操作 [12,36]。`IX` [12] 在网络拥塞时批量处理网络请求并允许应用程序线程发出批量系统调用。同样，我们通过检查\
  \ I/O 路径中的队列根据观察到的 I/O 并发量批量处理 I/O 请求，此外我们使用性能反馈机制（已吞吐量）来适应批量处理，无论网络状况如何。\n\n最近，弹性引起了巨大的关注，该领域已有许多工作\
  \ [37–40]。然而，据我们所知，弹性尚未像我们这样针对网络存储协议提出。\n\n## 7.6 结论\n\n在本章中，我们介绍了 `Tyche` 的设计，这是一种直接部署在以太网之上的网络存储协议。`Tyche`\
  \ 提供了类似于 RDMA 的操作，但不需要网络接口的硬件支持。`Tyche` 提供了可靠交付、帧定以及多个 `NICs` 的透明绑定。它是一种不需要任何硬件支持的端端协议。`Tyche`\
  \ 使用了基于虚拟内存页重映射的拷贝减少技术来降低处理成本。目标通过在 `NIC` 接收环之间交换页面来避免所有写操作的拷贝。\n\n## 致谢\n\n我们感谢欧盟委员会通过第七框架计划\
