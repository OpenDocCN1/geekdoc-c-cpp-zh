  \ `D`，由 `D` 执行安全验证。在我们的仿真中，我们引入了攻击者的两种类型的攻击，即针对完整性和真实性的攻击。在实验中，我们对 `D`（`DSM`）的所有数据进行了安全验证评估。我们对每个断言（也称为\
  \ `bounds`）进行了 100 次运行，并发现了如图 13.2\n\n图 13.2 带有参数的 Scyther 仿真环境以及 DSM 处安全验证成功的页面。\n\
  \n### 13.6.1.1 攻击模型](#24_Chapter13.xhtml_sec13_6_1_1)\n\n可以考虑许多类型的密码攻击。在我们的情况下，专注于上述的完整性攻击和身份攻击。在完整性攻击中，攻击者可以通过系统地测试每个可能的密钥对捕获的数据包进行暴力破解攻击，我们假设他她能够判断攻击何时成功。在身份攻击中，攻击者试图获取源节点的行为。我们假设他她能够确定源节点的行为，攻击者可以引入一个通过的节点并模拟原始源节点。在我们的概念中，我们使用传感器中的信任模块来存储秘密信息以及密钥生成和加密程序（即\
  \ `TPM`）。\n\n### 13.6.1.2 实验模型](#24_Chapter13.xhtml_sec13_6_1_2)\n\n实践中，攻击可能比暴力破解更复杂、更有效。\n\
  \n然而，这不会影响所提 `DPBSV` 方案的有效性，因为我们感兴趣的是无需周期性密钥交换且无成功攻击的安全验证。在这里，我们按照上一节描述的流程进行建模，并将密钥大小固定为\
  \ `64` 位（参见表 13.2）。我们使用自动安全协议验证工具 `Scyther` 来验证我们的方案。\n\n### 13.6.1.3 结果](#24_Chapter13.xhtml_sec13_6_1_3)\n\
  \n我们在每次运行中使用了不同数量的数据块进行仿真。我们的实验范围从 10 到 100 个实例，间隔为 10。我们检查每个数据块的身份验证，而完整性检查则在选定的数据块上进行。在没有加密信息的情况下，攻击者无法验证加密的数据块。因此，我们没有发现任何身份检查的攻击。对于完整性攻击，很难获取共享密钥（`KSH`），因为共享密钥（`KSH`）根据源传感器（`Si`）和\
  \ `DSM` 上的动态质数 `Pi` 频繁变化。在实验中，我们发现了如[图 13.2](#24_Chapter13.xhtml_fig13_2）所示的 `D`\
  \ 处的攻击数量。除此外，我们遵循 `Scyther` 的默认属性。\n\n\n\n\n1. M. Stonebraker, U. Çetintemel, and\
