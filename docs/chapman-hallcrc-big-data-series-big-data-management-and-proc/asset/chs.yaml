  \n\n\n\n加速器，包括用于通用计算的图形处理器（`GPUs`）以及具有宽向量单元的多核设计（例如 `Intel Phi`），已成为许多高性能集群的常见组件。随着更稳定、更可靠的工具出现，能够自动将带有注释的高级规范（如\
  \ `C` 或 `C++`）编写的代码转换为硬件描述语言（高层次综合——HLS），这为在高性能系统中更广泛地使用可重构设备（例如现场可编程门阵列——FPGAs）来实现定制加速器奠定了基础；此外，新的处理器也包含了用于这些组件的先进缓存一致性互连，这也提供了支持。\n\
  \n在本章中，我们简要调查了针对大数据分析应用的高性能系统中加速器的使用现状。尽管近期此类应用在加速器使用方面取得了显著进展，但我们认为，与科学模拟不同，仍存在需要填补的差距。这对于新兴的\
  \ NoSQL 和图数据库所表现出的“不规则”行为尤为如此。我们关注了 `HLS` 工具在数据分析和图方法方面的局限性，并讨论了一种更符合该类应用需求的新架构模板。我们通过修改`多线程系统图引擎\
  \ (GEMS)`框架以支持使用此类方法生成的加速器，并使用来自`宾立州大学基准测试 (LUBM)`的查询进行测试，验证了这种新架构模板。该架构模板通过支持新的控制模型和增强的内存接口，能够更好地支持图方法中存在的任务级和内存级并行。我们证明了我们的解决方案允许生成并行加速器，与传统的\
  \ `HLS` 流程相比提供了加速。最后，我们得出了结论，并对数据分析中可重构设备和设计自动化工具的使用提出了展望。\n\n## 14.1 引言\n\n大数据分析的出现正在决定计算领域的深远变革。事实上，要治理大数据的\
  \ 5V 特，需要传统计算栈发生重大的演进，甚至是真正的革命。为了支持不断增长的数据量、速度和多样性，确保数据的真实性并从数据本身提取价值，需要在软件、运行时和硬件方面寻求解决方案。简单地适配现有的关系型数据库基础设施是不够的：它们确实有几十年的历史、研究和进步，但也带来了无法良好应对大数据引入的新新问题的遗留方法。例如，表格可能不足以表达数据的多样性，而沿着连接（join）和选择（select）过程构建的查询可能无法随着数据量的增加良好扩展。\n\
  \n### 14.1.1 大数据与图\n\n新的数据模型包括基于`资源描述框架 (RDF)` 的图数据库和属性图（将属性表与顶点和边耦合）已经出现，随之还有相关的查询语言（例如\
  \ `SPARQL` 和 `DATALOG`）。\n\n对于许多新兴的大数据分析数据集，如安全、通信、交通和社交网络、政府和医疗保健数据、环境科学、生物医学研究和金融，图似乎是存储、处理和检索信息的方便方式。图方法本质上并行的，因为它们允许为每个顶点或边产生并发活动，但它们也表现出所谓的“不规则”行为。它们基本上是基于指针或链表的数据结构，需要细粒度的数据访问。大型图表现出较差的空间时间局部性：算法在沿着边移动时可能会从一个内存位置移动到完全不相关的另一个位置。它们通常是同步密集型的，因为并发搜索活动可能会到达相同的位置并需要协调。此外，在分布式内存的并发活动之间划分图而不会产生负载不平衡是困难的，因为某些顶点的边可能比其他顶点多得多。因此，它们可能被许多活动同时到达。总的来说，它们的特点是算术操作有限但内存访问频繁。相反，目前的系统利用了具有深层缓存层次和针对局部性优化的先进预取器的处理器、高浮点性能的处理器，以及在集群中、在大规模、批处理数据传输中表现最好的互连网络。\n\
  \n### 14.1.2 加速图分析\n\n\n\n\n\n新兴的数据模型、旧框架的局限性以及通用系统的问题，导致了无数专门化软件基础设施的引入。开源 RDF\
  \ 数据库包括基于关系型数据库的 `Jena SDB` [1]；基于原生磁盘存储的 `Jena TDB` [1]；支持在关系型数据库之上或原生后端之上的 `Sesame`\
  \ [2]；`Virtuoso 开源版` [3]；以及 `4store` [4]。研究级 RDF 数据库方法包括 `RDF-3X` [5]、`Hexastore`\
  \ [6]、`YARS2` [7]、`SHARD` [8]、`BitMat` [9] 以及在 `PIG` 上的 `SPARQL` 查询 [10]。商业 RDF\
  \ 数据库包括 `Bigdata` [11]、`BigOWLIM` [12] 和 `Virtuoso` [3]。这些方法中的许多利用 `Map-Reduce`\
  \ 框架来实现集群的可扩展性，或者实现对分布式集群的支持，以提高性能、数据集大小或两者兼顾 [13–15]。`SPARK` 框架 [16] 在 `Hadoop`\
  \ 之上以独立模式运行，结合 `GraphX` 库，也开始被用于实现和查询 RDF 数据库。\n\n`GEMS`（多线程系统图引擎）[17] 是一个由三层组成的软件栈：一个自定义的多线程运行时（`GMT—全局内存与线程`）、一个图方法及相关数据库，以及一个\
  \ `SPARQL-to-C++` 编译器。其基础的自定义运行时使得不规则应用（特别是图方法）能够通过软件方法解决当前高性能架构在处理此类应用时的某些缺点，从而在通用集群上从性能和规模上实现扩展。具体而言，它提供了跨集群节点的全局地址空间（这样，在内存中探索的大型数据集无需进行分区）、轻量级软件多线程以容忍访问远程节点数据的延迟，以及消息聚合以最大化利用集群互连网络的利用率。`SPARQL-to-C++`\
  \ 编译器将 `SPARQL` 查询转换为用 `C++` 表示的图方法，这些方法利用堆栈底层的图库。`GEMS` 是系统硬件特性对于新兴大数据分析工作负载需要经过仔细考虑的第一个示例。\n\
  \n原始的 `Cray Urika` 是试图在专门化道路上走得更远的解决方案示例。它采用了专门设计的 `Cray XMT 2` 架构（源自 `Tera MTA`\
  \ 设计，该系统实现了具有多线程处理器、全局地址空间和单内存级同步的节点，以更好地支持吞吐量密集型应用）来实现图数据库。由于维护和成本问题，Cray 放弃了使用自定义架构，并引入了基于较为通用组件的\
  \ `Urika-GX` [18]（该组件使用带有最新 Cray Aries 互连的 x86 节点，并运行 `Hadoop` 和 `Spark` 软件框架）。然而，考虑到这些对于所有类型的工作负载并不是最优的，它还支持\
  \ `Cray Graph Engine`，后者再次采用了具有可加速图方法特性的自定义运行时。\n\n虽然成本是通用系统实现数据分析框架的重要原因，但确实需要更好地利用底层硬件。鉴于大多数大型私立和公共机构对数据分析的高度兴趣和关注，如果自定义或半自定义系统能够证明更高的性能以及管理更大数据集的能力，且不牺牲过多的灵活性，那么它们仍然是合理的。\n\
  \n用于通用计算的图形处理器（`GPUs`）以及 `Intel Phi` 等加速器在高性能系统中变得越来越普及。它们针对吞吐量计算进行了优化，允许提高大规模并行、算术密集型工作负载的性能，同时保持良好的能效。通过以延迟换吞吐量，它们还提供了惊人的内存带宽，这可能使其成为科学仿真之外的应用的极具吸引力的平台。由于它们被应用于多种市场（例如游戏），它们已成为成本负担得起的通用组件。因此，已有许多工作致力于开发加速这些架构的更不常工作负载的方法。我们看到了加速传统关系型数据库操作的方法，最近还有大量关于加速各种图方法的研究\
  \ [19–24]，这些研究运行在单个和多个加速器上，甚至安装在分布式系统上。许多方法尝试通过采用 `Map-Reduce` 模型来加速图方法。最近，我们看到了第一批图数据库（例如\
  \ `BlazeGraph`）[25] 的出现，它们能够通过构建现有的 `MapReduce` 图方法库（在 `BlazeGraph` 的案例中为 `MapGraph`\
  \ [26]）来利用 GPU。\n\n\n\n\n\n当涉及到特定应用的加速器时，可配置设备，特别是现场编程门阵列（`FPGAs`）正在复兴。由于登纳比例效应（Dennard’s\
  \ Scaling）的结束和摩尔定律的放缓，与专用集成电路（`ASICs`）上的通用处理器相比，`FPGAs` 的批量生产成本变得更加便宜，同时缩小了效率方面的差距。事实上，每一个生产工艺节点的实现成本都变得昂贵，而\
  \ `FPGAs` 大多基于标准的、高度复制的单元（主要是静态随机访问存储器——`SRAMs`），因此可以受益于密度的显著增加，并且比处理器具有更简单的技术开发流程（例如无须开发定制逻辑单元、无需特别关注热点等）。即使设备的最终运行时钟频率不同，`FPGA`\
  \ 设计在生产后可以根据具体情况进行专有化处理。它们甚至可以在系统运行期间进行重配置。相比之下，`ASIC` 针对特定功能且无法适应，因此实际上需要处理尽可能多的情况，通常并不能总是提供最高效率。最新的行业发展显示出一个明显的趋势：大量处理器设计集成了通用处理器和可重构逻辑（例如\
  \ `Xilinx Zynq` 平台）、开放通用处理器的相干总线、互连和协议给加速器（例如 `IBM’s CAPI`——相干访问端口接口和 `Intel’s OmniPath`，在此之前是\
  \ `AMD’s Hyper-Transports`），以及关键收购（`Intel` 收购 `Altera` 以及 `Micron` 收购 `Pico` 和 `Convey`）。集成\
  \ 3D 堆栈内存的 `FPGA` 设备出现也说明了其对于内存密集型应用的适用性。因此，`FPGAs` 正越来越多地代表数据分析应用中通用加速器与定制系统之间一个极具前景的中间点。\n\
  \n然而，在使用可重构逻辑方面仍然存在显著的生产力差距。使用硬件描述语言（`HDL`）设计加速器是困难且耗时的。手工设计的加速器通常提供极高的性能，但只能处理一组非常特定的算法。高层次综合（`HLS`）方法通过从高层语言（如\
  \ `C/C++`）的描述生成 `HDL`，几十年来一直是一个研究课题。然而，它们在历史上主要针对规则的、计算密集型应用，并聚焦于指令级并行性（`ILP`）的利用。直到最近，`HLS`\
  \ 方法才成熟到足以开始针对数据分析应用中占主的任务级并行性（`TLP`）。许多工具开始支持 `OpenMP` 或 `OpenCL`（例如 `Convey’s\
  \ OpenHT`、`Xilinx Vivado HLS` 和 `Altera HLS`）[27–29] 作为描述任务并行应用的方法。然而，这些仍然更适用于计算密集型和规则的工作负载，在这些负载中，内存模式和分支/合并任务在合成阶段都是可以预计算的。但是，仍有大量的研究和探索需要完成，以高效地解决不规则和内存密集型负载的问题，这些负载呈现出许多不可预测的动态效应，只有在运行时才能管理。图方法再次是一个清晰的例子。因为\
  \ `HLS` 工具基本上是编译器，图方法中使用的数据结构（大多基于指针）的性质使得许多编译器方法效率低下或不可用（例如，`alias analysis`）。\n\
  \n### 14.1.3 章节结构\n\n在本章中，我们展示了一个案例研究，说明如何改进 `HLS` 合成工具以更好地支持数据分析应用。特别是，我们关注任务并行提取和内存系统的管理，这些是传统\
  \ `HLS` 方法最大的局限性。我们在 `GEMS` 图数据库（一种真实的数据分析应用）的背景下介绍了案例研究。进展仍需完成，但我们认为这是提高基于 `FPGA`\
  \ 技术的定制加速器数据数据分析负载可用性和适用性的一步，使其成为一个可行的平台。\n\n本章的 Section 14.2 展示了使用可重构设备加速分析负载领域的相关工作。Section\
  \ 14.3 描述了通用案例研究，其中 `GEMS` 被修改以支持运行在 `FPGA` 上的查询加速器。Section 14.4 描述了所提出的架构设计及其在开源\
  \ `FPGA` 合成流中的集成。Section 14.5 讨论了为利亥大学基准测试（`LUBM`）的查询生成加速器所得实验结果 [30]。最后，Section\
  \ 14.6](#25_Chapter14.xhtml_sec_14_6) 得出了结论，并对 `FPGA` 加速器和设计自动化工具在数据分析中的未来展望。\n\n\
  ### 14.2 相关工作\n\n我们的案例研究涉及与可重构设备加速器设计相关的许多不同方面。首先，我们必须查看数据库和数据分析加速平台及相关研究。其次，由于我们特别关注基于图的数据模型，我们还需要查看尝试加速图方法和呈现不规则行为负载的通用解决方案。最后，由于我们的主要目标不仅是讨论定制加速器的设计，还为了突出极大增加可重构设备加速数据分析灵活性的现有方法差距，我们需要讨论\
  \ `HLS` 的当前趋势，并将其与数据分析代码进行对比。\n\n#### 14.2.1 数据库、数据分析和图方法的加速器\n\n在过去的几年中，出现了越来越多实现可重构设备的数据分析商业平台。最著名的例子是微软的\
  \ `Catapult` [31] 项目，该项目在微软设计的服务器中集成了 `FPGA` 以提高性能、降低功耗并为数据中心提供新功能；以及 Netezza 系统\
  \ [32]（现归 IBM）。数据分析也是 `Convey HC` 和 `MX` 混合平台密集研究和开发的领域。这些系统将高密度 `FPGA` 与通用处理器集成，提供了优化的高带宽和主机相干内存控制器。由于成本考虑，`Convey\
  \ HC` 和 `MX` 之后推出了 `Convey WX` (`Wolverine`) 加速器，这是一个提供类似功能的 PCI Express 即插式解决方案。\n\
  \n\n\n\n\n这些系统是大量旨在加速数据库和数据分析（包括算子和全查询）的研究的成果。IBM 提出了一种基于 `FPGA` 的系统来加速关系型数据库查询中昂贵的操作，包括数据解压缩和谓词评估\
  \ [33]。IBM 还探索了带有 `BLU` 加速的 `DB2` 的 `FPGA` 支持：压缩技术结合列存（`Column-Store`）方法，可以在压缩值上执行大多数\
  \ `SQL` 操作，从而能够以单指令多数据（`SIMD`）的方式进行处理。IBM 也对 `GPUs` 考虑了类似的方法 [34]。Halstead 等人的工作\
  \ [35] 讨论了在 `Convey MX` 上对哈希连接（`hash-joins`）进行 `FPGA` 加速，利用了线程以及系统提供的原子内存操作支持。Casper\
  \ 和 Olukotun [36] 展示了硬件加速对于具有 `select`、`sort` 和 `join` 操作的内存数据库的潜力。在 参考文献 37 中，我们看到了一个将可重构逻辑上的自定义单元与通用处理器集成，以加速分析工作负载的示例。\n\
  \n参考文献 38 展示了针对流式数据库的查询编译到 `FPGA` 的第一个示例。Takenaka 等人的工作 [39] 提出了一种基于编译器的方法，将基于 `SQL`\
  \ 的查询翻译为用于软件级复杂事件处理系统的硬件。Dennl 等人 [40] 讨论了对 `SQL` `restrict` 和 `aggregate` 算子的加速，采用部分动态重构来构建特定于查询的数据路径。该海报\
  \ [41] 暗示了通过 `Vivado HLS` 使用 `HLS` 来完全实现内存数据库查询的潜力。\n\n我们在本章讨论的方法比这些解决方案更进了一步。我们专注于基于图表示的新兴数据格式工作负载的加速。在这些情况下，传统关系型和基于表的操作的加速只能解决部分问题。相反，我们关注的是支持完全加速\
  \ `SPARQL` 查询的技术。为了实现这一点，我们在 `GEMS` 框架背景下进行工作。特别是，`GEMS SPARQL-to-C++` 编译器将用 `SPARQL`\
  \ 的查询转换为一组图模式匹配例程。因此，我们的目标是提供高效的方法来合成并加速这些图方法。\n\n加速图遍历以及通而言的不规则内核的设计的典型示例是 `Convey\
  \ HC` 上的广度优先搜索（`BFS`）特性 [42]，以及 `Convey MX` 系统。特别是 `Convey MX` 将可重构逻辑上的多线程自定义处理器与\
  \ `OpenMP` 编程环境（`CHOMP—Convey Hybrid OpenMP`）耦合在一起 [43]。Betkaoui 等人 [44] 讨论了用于大规模图探索高效并行处理的可重构硬件方法。然而，这些方法要么是针对特定内核的自定义加速器，要么在\
  \ `FPGA` 上使用通用设计。我们的方法利用了 `HLS` 方法。在 参考文献 45 中，Halstead 等人讨论了如何扩展 `ROCCC` 框架以支持不规则应用，引入多线程来容忍长时间内存访问延迟。然而，他们没有处理原子内存操作，而是侧重于指针追踪的简单案例。\n\
  \n## 14.2.2 合成方法](#25_Chapter14.xhtml_sec14_2_2)\n\n传统的 `HLS` 方法和工具通常采用所谓的带数据路径的有限状态机（`FSM`/`FSMD`）模型。该模型通过分析规范并识别代码中的操作，确定这些操作的类型和依赖关系来工作。考虑到资源限制（即功能单元数量的限制和内存要求），它们随后生成数据路径和一个\
  \ `FSM`，并根据操作的静态调度在数据路径上执行它们。这种模型允许高效提取指令级并行（`ILP`），但当代码暴露线程级并行（`TLPs`，例如 `for`\
  \ 循环中的独立迭代）时，效果并不理想。事实上，`FSM` 控制器的复杂性通常对于整个合成代码部分是集中化的，随着其需要管理并发任务，其复杂度呈指数级增长。由于数据分析应用和图方法呈现出大量的任务并行性，需要更好的解决方案来管理任务并行性。\n\
  \n为了改善这种情况，目前大多数 `HLS` 方法都考虑分解 `FSM` 以降低其复杂性。在各种工作中，我们重点介绍了以分级方式重构控制器的方法 [46,47]，甚至使用了状态图（`State\
  \ Charts`）描述 [48]。某些解决方案，如 [49]，采用了伪分布式方法，以支持推测性功能单元（`SFUs`）。最终架构仍然依赖于静态调度，但本地控制器动态检查\
  \ `SFUs` 的结果而不阻塞整个数据路径。而我们的方法是完全正交的。它从一开始就使用分布式控制器构建，并且不考虑固定调度，通过仲裁器避免运行时冲突。\n\n\
  其他方法尝试通过独立合成任务，然后通过自定义调度器或专用处理器管理其执行来解决问题 [50,51]。案例研究中提出的设计不需要额外的控制单元。\n\n各种商业和研究\
  \ `HLS` 流开始将并行规范作为输入描述。这些包括用 `CUDA`、`OpenMP`、`OpenCL` 和 `pthreads` 注释的规范 [52,53]。`LegUP`\
  \ [54] 也支持 `OpenMP` 规范，但需要额外的通用处理器进行调度。这些方法并不适用于通用的数据分析应用，特别是图方法。这些方法可能呈现多个迭代次数显著不同的嵌套循环，以及仅由于数据依赖而可能显示出显著负载不的实例。我们在案例中提供的解决方案不需要额外的处理器，并且可以支持任何级别的嵌套并行。`OpenCL`\
  \ [55] 正在取得成功，在商业工具中也是如此 [27]。然而，由于它主要为向量处理器设计，它并不能适应不规则应用和图方法。\n\n## 14.3 案例研究：FPGA\
  \ 上的 GEMS](#25_Chapter14.xhtml_sec14_3)\n\n\n\n\n\nGEMS [17] 在通用集群上实现了一个 RDF 数据库，其主要特点是在栈的所有层都采用了图方法。为了解决\
  \ HPC 系统的局限性，GEMS 使用了 `GMT`，这是一种自定义运行时，它提供了跨集群的全局地址空间，使得数据无需分区；并采用轻量级软件多线程来容忍数据访问延迟；还通过消息聚合以细粒度事务来提高网络利用率。利用运行时提供的函数构建了一个图应用程序编程接口（API）和一组用于摄入\
  \ RDF 三元组并生成相关图和字典的方法，这些共同统称为 `SGLib`。在整个系统的上层，一个翻译器将用 `SPARQL` 表达式的查询转换为 `C++`\
  \ 中的图模式匹配操作。GEMS 已经证明，通过重新构思并深度定制传统的数据库堆栈，可以利用新兴的数据模型在性能和规模上获得极具前景的扩展结果。尽管运行在通用同构架构集群上，但\
  \ GEMS 的运行时试图在软件层面解决限制这些架构上图方法和不规则应用性能的问题。该方法旨在以一种有效的方式利用当今 HPC 系统的剩余算力来解决其处理特定工作负载时的局限性，而不再像过去那样需要完全定制的系统。\n\
  \n我们认为，任何新型数据分析基础设施都需要开始利用加速器。加速器的使用，特别是 `GPUs` 和向量处理器，现在在高性能系统中已非常广泛，因为它们允许在保持功耗控制的同时（对于特定的工作负载）达到高峰值性能。然而，由于只有某些工作负载能够很好地映射到这些某种“商品化”的加速器上，因此需要进一步研究以理解数据分析是否真的能从中受益。研究人员正投入大量尝试以尽可能高效的方式将相关算法（如图算法）映射到这些架构上，并取得了不同程度的成功。\n\
  \n我们还认为，如 `FPGAs` 等可重构设备可以代表全定制设计与全通用系统之间一种很有前景的中间状态，正如某些可用商业平台所示。为了证明 `FPGAs` 在数据分析中的适用性，我们对\
  \ GEMS 堆栈进行了修改，使得 `SPARQL` 查询在转换为标准编程语言中的图方法后，直接在基于 `FPGA` 的加速器上执行，而不是通过在 GEMS 多线程运行时开发的中间库。我们比那些利用已在\
  \ `FPGA` 上实现的逻辑的方法更进了一步，那些方法表现为针对特定工作负载优化的处理器形式（类似于 `GPUs` 或向量处理器，仅优化点不同），或者表现为查询处理中特定递归函数的加速器形式。我们尝试提供一种方法，为每个查询（表示为一组图模式匹配操作）合成完全定制的加速器，从其\
  \ `C` 代码开始。从 `HDL` 代码综合成 `FPGA` 位流的逻辑综合可能比数据库中通常的软件编译和查询优化需要更长时间。然而，逻辑综合时间并不是限制因素。事实上，特别是对于支持所有能够识别重复模式的新兴数据模型的数据库，分析师的大大部分时间花在动态变化的数据上运行相同的查询，而不是在更改和重新编译查询上。\n\
  \n我们修改了 GEMS 堆栈，使得 `SPARQL` 翻译器与 `HLS` 工具交互以生成 `HDL` 代码。修改后的翻译器生成表示图搜索的 `C` 代码。我们还扩展了中间\
  \ `SGLib`，开发了一个用 `C` 编写的图 API 替代版本，该版本不使用 `GMT` 运行时。\n\n作为 `HLS` 工具，我们采用了 `Bambu`\
  \ 框架 [56]。`Bambu` 是一个在 `GPL` 协议下的先进 `HLS` 工具。`Bambu` 接收 `C`-代码规范和综合目标（例如目标频率和面积），并输出\
  \ `Verilog` 实现，可以直接在来自多个供应商（`Altera`、`Xilinx`、`Lattice`）的各种设备上综合。`Bambu` 的传统架构是\
  \ `FSMD`。`Bambu` 的流程包含三个主要部分：前端、综合和后端。前端阶段处理输入规范，使用 GNU 集合 (`GCC`)）。前端分析输入规范并应用代码变换和优化（循环展开、函数内联、常量传播等）。该过程生成多个基于图的内部表示\
  \ (`IR`)，例如`控制流图`、`数据流图`、`程序依赖图`和`调用图`。综合阶段将这些 `IR` 作为输入，并按照调用图的结构一个函数一次地合成应用程序。这导致了模块化、层次化的设计。该流程执行的主要活动（与大多数\
  \ `HLS` 方法一样）是操作调度、功能单元、寄存器和互连的分配与绑定。最后，后端在 `Verilog` 中生成最终电路描述，以及仿真和综合脚本，使 `Bambu`\
  \ 能直接与第三方工具接口。\n\n由于目前版本的 `Bambu` 版本基于 `FSMD` 模型，我们大量扩展并修改了该框架，以支持一种不同的控制模型以及相关的新型综合技术，用于生成能够更好地应对图方法不规则工作负载要求的加速器。\n\
  \n图 14.1 概念上展示了 GEMS 堆栈的修改以及与 `Bambu` 的交互。\n\n![fig14_1.jpg](img/fig14_1.jpg)\n\n\
  图 14.1 GEMS 堆栈的结构与 `Bambu` `HLS` 的交互。\n\n图 14.2 显示了一个示例 `SPARQL` 查询及其图模式表示。\n\n\
  ![fig14_2.jpg](img/fig14_2.jpg)\n\n图 14.2 示例查询 Q6：大学 0 部门的全教授。(a) 显示了用 `SPARQL`\
  \ 表示的查询，而 (b) 显示了相应的图模式。\n\n在处理此查询时，自定义的 `SPARQL2C` 翻译器生成了图 14.3a 所示的 `C`-代码实现。\n\
  \n![fig14_3.jpg](img/fig14_3.jpg)\n\n图 14.3 示例查询 Q6 的模式匹配例伪代码。\n\n`Bambu` 处理 GEMS\
  \ `SPARQL` 翻译器生成的 `C` 查询实现，形式为模式匹配函数。模式匹配函数由嵌套并行循环组成：每个循环对应于匹配组成查询的图模式的特定边。在 `SPARQL`\
  \ 查询中，顶点和边可以是常量（通过输入数据中的值表示）。常量元素的标签在查询执行期间执行值检查，作为搜索函数的输入参数。这允许用同一个程序支持仅在标签上有所不同的查询。图\
  \ 14.3 展示了来自 `LUBM` 基准测试 [30] 的示例查询 Q6，及其图表示以及描述 GEMS 修改翻译器输出的伪代码。\n\n\n\n\n\nBambu\
  \ 处理生成的代码并执行额外的变换以更好地暴露线程级并行（TLP）。特别是，图 14.3b 显示了并行循环如何部分展开，其展开因子等于在合成架构中分配的内核实例数量。目前，用户必须提供此数字。该流在合成过程中将展开循环中的所有内核实例限流到不同的硬件模块中，从而实现并发执行。\n\
  \n## 14.4 建议的架构 (#25_Chapter14.xhtml_sec14_4)\n\n如前所述，大多数 HLS 技术对目标架构采用 FSMD（有限状态机数据）模型。虽然这在利用指令级并行（ILP）方面非常有效，但这种执行范式本质上是串行的，无法高效地利用更粗粒度的并行性，例如\
  \ TLP。然而，图算法以及广而言之数据分析虽然提供了一些 ILP，但通常具有大量的动态 TLP。此外，传统的 HLS 技术针对具有规则内存访问模式和小数据集的应用进行了优化。因此，它们仅假设了简单的内存模型，即数据集易于划分，且由于处理的是不同的数据，因此不需要同步并行操作。图算法的情况并非如此：它们没有任何局部性，对数据集的均匀划分通常会导致负载不平衡。通常情况下，假设共享内存是实现高效图算法的首选抽象，这在通用编程语言中也是如此。GEMS\
  \ 的 SPARQL 翻译器也做了同样的假设。由于图算法也是同步密集型的（因为并发活动可能需要同时访问相同的元素），内存模型还必须提供原子内存操作。由于我们必须生成执行图算法的完整架构，我们需要将这种抽象与有效且高性能的架构实现相结合。并且，与所有其他\
  \ HLS 合成方法不同，我们还需要为原子内存操作提供支持。\n\n为了克服 FSMD 模型的局限性，我们设计了一种自适应分布式控制器（`DC`），能够管理并发执行流，从而执行并行任务。为了给内存模型提供充分的支持，我们设计了一种增强内存接口，该接口在提供抽象共享内存视图的同时，为多体/多端口内存实现了多个通道，并支持原子内存操作。\n\
  \n### 14.4.1 分布式控制器架构 (#25_Chapter14.xhtml_sec14_4_1)\n\n所提设计通过引入自适应 `DC` [57] 支持并行执行和动态调度。`DC`\
  \ 由一组通信模块组成，每个模块与一个操作相关联。该方法不需要在设计时定义任何执行顺序（调度），并允许在运行时利用并行性。控制器模块称为执行管理器（`EMs`），它们一旦所有依赖关系得到满足且资源冲突解决，就会开始关联操作的执行。每个操作所遵循的最小依赖集称为激活条件（`ACs`），它通过分析算法的扩展程序依赖图（`EPDG`）计算得出，`EPDG`\
  \ 在典型程序依赖图（`PDG`）的基础上扩展了控制流信息（例如循环的回边）。`ACs` 以逻辑函数的形式表示，并针对每个 `EM` 专门合成。相反，与共享资源相关的专用仲裁器（称为资源管理器\
  \ `RMs`）负责管理资源冲突：如果多个操作竞争同一资源，仲裁器将根据优先级排序确定哪一个先执行。`EMs` 通过轻量级的令牌方案进行通信：每当一个依赖被满足时，每个\
  \ `EM` 都会接收到一个令牌信号。当控制器收集到所有 `AC` 令牌（即所有依赖均已满足）时，它会检查资源可用性。如果操作关联资源空闲，则开始执行。该方法没有引入任何通信开销，因为它没有使用任何复杂的协议。由于每个操作和函数都是独立管理的，`DC`\
  \ 可以高效地控制多个并发执行流。使用集中式 FSM 实现相同的行为是可能的，但代价高昂：事实上，FSM 控制器的复杂度（按状态和转换的数量）相对于流的数量呈指数级增长。这种复杂性即使对于较小的\
  \ TLP 程度也会导致不可行的设计。相比之下，`DC` 的复杂度随操作数量线性增长，而无论操作的延迟和并发流的数量。图 14.4 提出了一个 `EPDG` 示例，其中标注了\
  \ `ACs` 和绑定信息，以及相关的并行控制器架构。操作 3、 4、 5 绑定到同一资源 `C`，而操作 6、 7 绑定到 `D`：相应的 `EMs` 与 `RMs`\
  \ 接口以避免结构性冲突。在这个示例中，所有操作的延迟未知（例如外部内存访问、函数调用、推测性操作），其执行完成通过数据通路到 `EMs` 的显式完成信号来通知。如果执行延迟在设计时已知的，则不需要这种信号传递，`EMs`\
  \ 将直接管理定时。\n\n![fig14_4.jpg](img/fig14_4.jpg)\n\n图 14.4 扩展程序依赖图 (a) 和对应的分布式控制器架构\
  \ (b)。\n\n### 14.4.2 内存接口 (#25_Chapter14.xhtml_sec14_4_2)\n\n在硬件合成中，通过复制计算资源来利用\
  \ TLP，实际上实现了空间多线程。不同的硬件加速器实现不同的任务/线程。最终设计分配了此类加速器的多个实例。我们的方法同样通过通过将并发函数调用绑定到不同的硬件组件，从而允许并行执行。然而，并非所有资源都可以简单地复制。内存资源尤其是如此的。在并行应用程序中，任务通常共享数据，因此需要访问共享内存。因此，任务的并行执行需要管理并发内存操作。这在内存受限的应用中尤为重要，因为它们的\
  \ ILP 可能有限，因此没有足够的操作来完全隐藏内存延迟。在加速器之间使用缓存需要实现一致性协议，而且缓存对于通常具有较差空间时间局部性的内核（如图算法）并不有效。更合适的架构方法大多基于内存分布和/或划分。这些技术允许内存操作并发访问数据，但引入了额外的挑战：\n\
  \n1. 内存地址通常不是静态知的，因此目标位置必须在运行时识别。\n2. 任务可能会并行访问相同数据，因此它们可能需要同步。\n3. 必须避免共享内存资源的结构性冲突。\n\
  \n在我们的方法中，我们通过在合成架构中引入自适应内存接口控制器（`MIC`）来解决这些问题。`MIC` 完全管理内存资源的并发和同步 [58]。它动态地将内存操作映射到多个分布式和/或多端口内存中，例如目前在集成了通用处理器和\
  \ FPGA 的最新混合系统（Convey HC 和 MX）中提供的内存。\n\n\n\n\n\n图 14.5 显示了 MIC 的高层示意图。MIC 接收来自\
  \ `N` 个端口的内存访问请求，这些端口具有地址、数据和操作类型（加载/存储）信号线。MIC 通过评估地址将请求路由到 `M` 个输出端口之一。一旦相应的端口可用，它就会处理该请求。以类似的方式，它将\
  \ `M` 个完成信号（通知操作结束）和结果（对于加载操作）路由回请求的操作。内存由 `M` 个不同且独立的存储库（banks）组成，每个输出端口访问其中一个存储库。每个内存存储库具有不重叠的地址。访问在运行时路由到特定的内存端口，从而为不规则应用中典型的不可预测内存访问模式提供了高效支持。根据在内存系统中分发数据的特定打乱函数进行合成的可定制控制逻辑执行路由。一种轻量级仲裁方案避免了共享资源上的任何结构冲突且不引入任何额外延迟，提供了并发管理。对于仲裁，我们在\
  \ MIC 中也使用了 `RMs`，与 DC 类似。访问路由和资源可用性检查均发生在运行时，使得 MIC 能够发出并发内存操作，只要它们不访问相同的内存位置。这提高了系统内存带宽的利用率。对原子内存操作（如\
  \ `fetch-and-add` 和 `compare-and-swap`）的支持实现了同步。`RMs` 会拒绝对被原子内存操作访问的内存位置的后续请求，从而保证原子性。\n\
  \n![fig14_5.jpg](img/fig14_5.jpg)\n\n图 14.5 高层内存接口控制器结构。\n\n### 14.4.3 合成流](#25_Chapter14.xhtml_sec14_4_3)\n\
  \n如前所述，我们已经在 Bambu 中集成了这些解决方案。为了生成 DC 架构，我们要么设计了新的合成技术，要么对以前的方法进行了深度定制。由于是围绕 FSMD\
  \ 模型设计的，大多数 HLS 算法需要定义执行调度计划。相反，所提出的架构没有采用任何预设的执行顺序。事实上，DCs 动态地执行操作。对于 FSMD 合成流，所提的方法需要额外的前端分析步骤来构建\
  \ EPDG 并计算 ACs。该方法还采用了用于寄存器 [59] 和模块绑定 [60] 的自定义算法。为了将 MIC 集成到合成流中，不需要对合成算法进行重大更改。\n\
  \n### 14.5 实验结果](#25_Chapter14.xhtml_sec14_5)\n\n我们通过生成实现 LUBM 基准测试查询的加速器来测试我们的方法。我们考虑了来自参考文献\
  \ 61 集合中的七个查询。LUBM 的目标是以标准且系统的方法评估语义网仓库的性能。它评估了针对源自单一真实本体论的数据集的查询的性能。LUBM 由一个大学领域本体论、可定制且重复的合成数据、一组测试查询以及若干性能指标组成。我们生成了两个不同的数据集：`LUBM-1`（包含\
  \ 100,573 个三元组）和 `LUBM-40`（包含 5,309,056 个三元组）。\n\n为了评估所提方法的有效性，我们用两种不同的配置合成了查询。在第一种（串行）中，生成的加速器是串行的（即单任务的）。在第二种中，生成的加速器是并行的，实现了四个硬件内核（`T\
  \ = 4`）和一个带有四个内存通道（`M = 4`）的 MIC。我们使用 `Vivado 2015.1` 合成了所有设计，目标为 Xilinx Virtex-7\
  \ `xc7vx690t`（与 Convey Wolverine WX690 使用相同的设备）。我们为合成设置了 100 MHz 的目标频率。表 14.1 报告了设计在执行延迟（时钟周期）和最大时钟频率方面的性能。\n\
  \n表 14.1\n使用我们的方法生成的串行加速器和并行加速器上 LUBM 查询 Q1–Q7 的执行延迟（4 个内核，4 个内存通道）\n\n![page292-01.jpg](img/page292-01.jpg)\n\
  \n通常情况下，并行加速器（`T = 4`, `M = 4`）相对于串行加速器能够加速。对于小数据集，平均加速比约为 2.1，范围从 1.03 (Q1) 到 3.13\
  \ (Q3)，取决于查询。对于大数据集，平均加速比相似（2.05），最小为 1.08 (Q1 和 Q6），最大为 3.13（再次为 Q3）。查询 Q1 和 Q6\
  \ 在大数据集加速比最小的原因在于查询的结构以及类图方法对数据集本身的高度依赖性。特别是 Q1 和 Q6 的外层循环只执行几次迭代。因此，这些查询仅使用少数任务。我们目前的设计实现了一种\
  \ fork-join 方案，产生一组 `T` 任务（从循环迭代识别）并将其分配给 `T` 个硬件内核。该任务组在下一组开始执行之前会运行完成。因此，同一组的任务可能有不同的执行时间，但组只有在所有任务完成后才会终止，这导致了硬件资源和内存带宽的利用不足。对原子内存操作的支持（如\
  \ `fetch-and-add` 和 `compare-and-swap`）实现了同步。`RMs` 会拒绝对被原子内存操作访问的内存位置的后续请求，从而保证原子性。\n\
  \n\n\n\n\n在本章中，我们讨论了将加速器用于数据分析应用的前景。\n\n我们展示了通过从硬件到软件的全定制化系统来追求性能和规模的高可扩展性的愿景，与采用商品化硬件设计以控制成本的需求之间的对比。我们强调了如\
  \ `GPUs` 和向量处理器等加速器日益广泛的使用（这些设备现在已基本成为高性能计算（HPC）系统的标准商品化资源）为数据分析带来的机遇。我们认为，新兴的采用\
  \ `FPGAs` 等可重构设备的加速器类，虽然其普及程度不如 `GPUs`，但可能为某些工作负载提供更好的系统定制机会；这些工作负载表现出不规则的行为，可能不像（例如）科学模拟那样适用于更具商品化的加速器。尽管仍有生产力鸿沟需要弥补，但能够从高层语言规范中自动生成加速器的工具（`HLS`\
  \ 工具）已经显著成熟。作为一个案例研究，我们展示了一系列新的架构模板和技术，以增强用于数据分析应用的并行加速器的合成。我们提出的方法特别允许为图方法和表现出不规则行为的应用生成高效的加速器。这些应用存在于许多数据分析应用中（例如图数据库），它们利用了如\
  \ `RDF` 或 `attributed graphs` 等新兴数据模型，且行为与传统的基于表的关系型数据库截然不同。我们详细介绍了该方法，并讨论了如何将其集成到\
  \ `GEMS` 栈（一个 `RDF` 图数据库）中，以为 `SPARQL` 查询生成并行加速器。我们通过从 `LUBM` 合成 `SPARQL` 查询验证了该方法。\n\
  \n我们相信，这些代表了使基于 `FPGA` 的加速器在数据分析中可行的重要一步。尽管仍面临某些局限性，例如实现更好的负载均衡以及提供跨加速器的可扩展性，但这些努力表明，在全定制系统和商品化系统之间存在一条充满前景的中间路径。基于加速器的系统可以为数据分析应用提供性能和灵活性，同时在成本上仍然可负担。\n\
