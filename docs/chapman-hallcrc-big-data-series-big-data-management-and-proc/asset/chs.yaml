  \n## 15.5.3 处理不确定性大数据\n\n一旦我们的 `MrCloud` 算法管理了不确定性大数据，它就允许用户查询数据。用户可以通过选择以下形式的 SQL\
  \ 风格约束来表达他们的兴趣……（此处原文存在大量重复片段，已按要求进行处理）。\n\n\n\n\n# 反单调性约束分析\n\n1. 如果约束 `Ca` 和 `Cb`\
  \ 是 AM（反单调的），则约束 `(Ca∧Cb)` 也是 AM。对于 AM 约束 `Ca` 和 `Cb`，如果模式 `X` 满足 `Ca` 和 `Cb`，那么\
  \ `X` 的所有子集都保证满足 `Ca` 和 `Cb`。也就是说，`X` 的所有子集都保证满足 `(Ca∧Cb)`。相反，如果模式 `Y` 不满足 `Ca`\
  \ 且不满足 `Cb`，那么 `Y` 的所有超集都保证不满足 `Ca` 且不满足 `Cb`。也就是说，`Y` 的所有超集都保证不满足 `(Ca∧Cb)`。因此，`(Ca∧Cb)`\
  \ 也是 AM。\n\n2. 如果约束 `Ca` 或 `Cb` 是 AM，则约束 `(Ca∨Cb)` 也是 AM。对于 AM 约束 `Ca` 或 `Cb`，如果模式\
  \ `X` 满足 `Ca` 和 `Cb`，那么 `X` 的所有子集都保证满足 `Ca` 或满足 `Cb`。也就是说，`X` 的所有子集都保证满足 `(Ca∨Cb)`。相反，如果模式\
  \ `Y` 不满足 `Ca` 或不满足 `Cb`，那么 `Y` 的所有超集都保证不满足 `Ca` 或不满足 `Cb`。也就是说，`Y` 的所有超集都保证不满足\
  \ `(Ca∨Cb)`。因此，`(Ca∨Cb)` 也是 AM。\n\n另一方面，如果用户指定的显式约束不满足反单调，我们的 `MrCloud` 首先发现所有频繁模式然后在然后在处理步骤中验证每个发现模式的有效性，以检查它们是否满足用户指定的约束。\n\
  \n## MrCloud 算法\n\n为了处理不确定大数据，我们的 `MrCloud` 算法首先读取并将不确定大数据划分为若干分区，并将它们分配给不同的处理器。`map`\
  \ 函数（表示为 `map1`）接收`〈transaction ID, content of that transaction〉` 作为输入。为了实现高效的时间空间约束频繁模式挖掘，`MrCloud`\
  \ 通过将用户指定的非频率 AM 约束 `CAM` 推入 `map1` 函数中，从而在挖掘过程中早期进行处理。因此，对于每个事务 `tj`，`map1` 函数对\
  \ `CAM` 执行约束检查，并为每个有效项目 `x ∈ tj` 的出现（即满足非频率 AM 约束的域项目）发射一个 `〈x, P(x, tj)〉` 元对，如下：\n\
  \n```\n$$\\begin{matrix} {\\text{map}_{1}:\\left\\langle \\text{ID of transaction}\\\
  mspace{7mu} t_{j},\\mspace{7mu}\\text{content of}\\mspace{7mu} t_{j} \\right\\rangle}\
  \ \\\\ \\left. {}{}\\mapsto\\text{list of}\\mspace{7mu}\\left\\langle \\text{valid}\\\
  mspace{7mu} x,P(x,t_{j}) \\right\\rangle \\right. \\end{matrix}\\qquad(15.6)$$\n\
  ```\n\n也就是说，通过指定以下内容，`map1` 函数产生 `〈valid x, P(x, tj)〉` 元对列表，其中键和值许多不同的有效 `x` 和 `P(x,\
  \ tj)`：\n\n```\nfor each tj ∈ partition of the uncertain big data do\nfor each item\
  \ x ∈ tj and {x} satisfies CAM do\n    emit 〈x, P(x, tj)〉.\n```\n\n之后，这些 `〈valid\
  \ x, P(x, tj)〉` 元对将进行洗牌和排序。每个处理器随后对洗牌排序后的元对执行 `reduce` 函数（表示为 `reduce1`），以获得 `x`\
  \ 的期望支持度。回想不确定大数据中的每个项目都有一个存在概率值。`reduce1` 函数通过 MapReduce 和 `Equation 15.3` 计算所有域项目（即单项模式）的期望支持度，这在计算单项模式时可以简化为如下：\n\
  \n![eq15_7](img/eq15_7.jpg)\n\n其中 `P(x, tj)` 是项目 `x` 在事务 `tj` 中的存在概率。也就是说，`reduce1`\
  \ 函数累加每个有效 `x` 的所有存在概率以计算其期望支持度：\n\n![eq15_8](img/eq15_8.jpg)\n\n更具体地说，`reduce1`\
  \ 函数通过指定以下内容找到满足频率约束的项目：\n\n```\nfor each x ∈ 〈valid x, list of P(x, tj)〉 do\n \
  \   set expSup({x}) = 0;\n    for each P(x, tj) ∈ list of P(x, tj) do\n        expSup({x})\
  \ = expSup({x}) + P(x, tj);\n    if expSup({x}) ≥ minsup then\n        emit 〈{x},\
  \ expSup({x})〉\n```\n\n对于用户指定的显式非频率非 AM 约束 `CnonAM`，我们的 `MrCloud` 验证 `reduce1` 返回的每个发现频繁\
  \ `{x}` 的有效性，以检查其是否满足用户指定的约束。因此，我们获得了所有有效的频繁单项（即满足用户指定约束的域项目）及其相关的支持值。\n\n`MrCloud`\
  \ 然后进入下一步（这是一个计算密集型步骤），通过重新读取不确定大数据中的每个事务，为 `reduce1` 返回的每个有效频繁单项 `{x}` 构建 `{x}-投影数据库（即所有以\
  \ `x` 结尾的事务的前缀集合）。第二个映射函数（表示为 `map2`）定义如下：\n\n![eq15_9](img/eq15_9.jpg)\n\n它可以被指定如下：\n\
  \n```\nfor each tj ∈ partition of the uncertain big data do\n    for each {x} ∈\
  \ 〈{x},expSup({x})〉 do\n        if prefix of tj ending with x contains items besides\
  \ x then\n            emit 〈{x}, prefix of tj ending with x)\n```\n\n每个分区对应的工作节点帮助挖掘有效的频繁模式。然后，`reduce`\
  \ 函数 `reduce2` 定义如下：\n\n![eq15_10](img/eq15_10.jpg)\n\n\n\n\n随后，`reduce1` 函数首先读取\
  \ `〈〈AMS, [0.9, 0.8, 0.4]〉`、`〈BCN, [1.0, 0.8]〉`、`〈CPH, [0.5, 1.0]〉`、`〈EDI, [1.0,\
  \ 0.2]〉`、`〈FRA, [0.2, 0.2, 0.2]〉` 以及 `〈HEL, [0.5]〉`；随后函数输出 `〈{AMS}, 2.1〉`、`〈{BCN},\
  \ 1.8〉`、`〈{CPH}, 1.5〉` 和 `〈{EDI}, 1.2〉`（即有效的频繁单项及其对应的期望支持）。\n\n同样注意，尽管 `reduce1`\
  \ 函数读取了 `〈FRA, [0.2, 0.2, 0.2]〉` 和 `〈HEL, [0.5]〉`，但它没有输出 `〈{FRA}, 0.6〉` 或 `〈{HEL},\
  \ 0.5〉`，因为有效的单项 `{FRA}` 和 `{HEL}` 是低频的。\n\n重新读取第一个事务 `t1` 后，`map2` 函数输出 `〈{BCN},\
  \ {AMS: 0.9, BCN: 1.0}〉`（其中 `{AMS: 0.9, BCN: 1.0}` 是以项目 `BCN` 结尾的 `t1` 前缀）、`〈{CPH},\
  \ {AMS: 0.9, BCN: 1.0, CPH: 0.5}〉` 和 `〈{EDI}, {AMS: 0.9, BCN: 1.0, CPH: 0.5, EDI:\
  \ 1.0}〉`（其中 `{AMS: 0.9, BCN: 1.0, CPH: 0.5, EDI: 1.0}` 仅包含有效的项目——即它不包含无效项目 `DEL`）。同样，重新读取第二个事务\
  \ `t2` 后，`map2` 函数输出 `〈{BCN}, {AMS: 0.8, BCN: 0.8}〉`、`〈{CPH}, {AMS: 0.8, BCN: 0.8,\
  \ CPH: 1.0}〉` 和 `〈{EDI}, {AMS: 0.8, BCN: 0.8, CPH: 1.0, EDI: 0.2}〉`。重新读取第三个事务 `t3`\
  \ 后，`map2` 函数没有输出任何内容。随后对所有输出对进行了洗乱和排序。\n\n注意 `map2` 函数没有为 `t1` 输出 `〈{AMS}, {AMS:\
  \ 0.9}〉`，因为 `{AMS: 0.9}` 除 `AMS` 本身外不包含任何有效的频繁项目（即事务的单项前缀不对非单项挖掘产生贡献）。同样的注释也适用于不为\
  \ `t2` 输出 `〈{AMS}, {AMS: 0.8}〉` 或不为 `t3` 输出 `〈{AMS}, {AMS: 0.4}〉`。此外，回想 `reduce1`\
  \ 函数输出了 `〈{AMS}, 2.1〉`、`〈{BCN}, 1.8〉`、`〈{CPH}, 1.5〉` 和 `〈{EDI}, 1.2〉`（因为 `FRA` 和\
  \ `HEL` 是低频的且 `GUM` 是无效的）。因此，`map2` 函数对于 `FRA`、`GUM` 或 `HEL` 没有输出任何内容（即不为 `t1` 输出\
  \ `〈{FRA}, {AMS: 0.9, BCN: 1.0, CPH: 0.5, EDI: 1.0, FRA: 0.2}〉`；不为 `t2` 输出 `{AMS:\
  \ 0.8, BCN: 0.8, CPH: 1.0, EDI: 0.2, FRA: 0.2}〉`；不为 `t3` 输出 `〈{FRA}, {AMS: 0.4,\
  \ FRA: 0.2}〉` 或 `〈{HEL}, {AMS: 0.4, FRA: 0.2, HEL: 0.5}〉`）。\n\n随后，`reduce2` 函数读取\
  \ `〈{BCN}, {BCN}-projected database〉`。基于这个 `{BCN}-投影数据库（包含两个子事务 `{AMS: 0.9, BCN:\
  \ 1.0}` 和 `{AMS: 0.8, BCN: 0.8}`），构建了一棵树。因此，找到一个期望支持为 1.54 的有效频繁模式 `{AMS, BCN}`。同样，`reduce2`\
  \ 函数读取 `〈{CPH}, {CPH}-projected database〉`。它基于这个 `{CPH}-投影数据库（包含两个子事务 `{AMS: 0.9,\
  \ BCN: 1.0, CPH: 0.5}` 和 `{AMS: 0.8, BCN: 0.8, CPH: 1.0}`）构建了一棵树，并发现了有效的频繁模式 `{AMS,\
  \ CPH}`、`{AMS, BCN, CPH}` 和 `{BCN, CPH}`，其期望支持值分别为 1.25、1.09 和 1.3。`reduce2` 函数接着读取\
  \ `〈{EDI}, {EDI}-projected database〉`。它基于这个 `{EDI}-投影数据库（包含两个子事务 `{AMS: 0.9, BCN:\
  \ 1.0, CPH: 0.5, EDI: 1.0}` 和 `{AMS: 0.8, BCN: 0.8, CPH: 1.0, EDI: 0.2}`）构建了一棵树——等等，让我重新检查一下文本。\n\
  \n\n\n\n在实验 15.2 中，我们继续了功能性评估。具体而言，我们使用了 (i) 一个约束条件和 (ii) 一个由不确定数据组成的数据集，其中所有项目的存在概率均为\
  \ 1（意味着所有项目都确定存在于数据库中）。在此设置下，我们将算法（用于从不确定数据中挖掘约束频繁项集）与一些从精确数据中挖掘约束频繁项集的现有算法进行了对比（例如\
  \ `CAP` [79]）。我们从结果结果观察到，我们的算法返回的挖掘结果与 `CAP` 返回的结果——即相同的频繁项集集合。换句话说，我们的算法与 `CAP`一样准确。\n\
  \n然而，在灵活性方面，`CAP` 限于在所有项目的存在概率均为 1 的集中式不确定数据集上寻找频繁项集。相比之下，我们提出的算法能够从包含从 0 到 1 不等存在概率值的分布式不确定数据中寻找频繁项集。\n\
  \n### 实验 15.3\n在实验 15.3 中，我们测量了分布式站点 `Pi` 与它们的集中站点 `Q` 之间传输的通信/数据量。图 15.3 显示了 IBM\
  \ 合成数据集和 UCI 真实蘑菇数据集的结果。注意，当约束的选择性降低时，传输的数据量也减少了。原因是随着约束选择性的降低，满足约束的频繁项集变少。因此，传输的数据更少。\n\
  \n![fig15_3.jpg](img/fig15_3.jpg)\n\n图 15.3 实验 15.3：数据量与选择性的关系。\n\n在 `SAM` 和 `SUC`\
  \ 约束之间，满足 `SAM` 约束的频繁项集仅由单独满足约束的域项目组成。因此，当选择性线性增加时，传输的数据量指数增长。相比之下，满足 `SUC` 约束的频繁项集由\
  \ (i)单独满足约束的域项目和 (ii) 可选项目组成。因此，传输的数据量在初期迅速（即选择性较低时）。随着选择性的持续增加，传输的数据量逐渐稳定（因为频繁项集中的域项目要么是要求的，要么是可选的）。\n\
  \n### 实验 15.4\n在实验 15.4 中，我们评估了分布式站点数量变化的影响。回想图 15.3，当分布式网络中有更多站点时，我们的算法传输了更多数据，因为站点的增加意味着要传输一组额外的本地频繁项和本地频繁项集。换句话说，网络中更多的站点会导致额外的通信时间。然而，更多的站点导致在每个站点构建和挖掘的\
  \ `UF-trees` 变小。关于运行时间，通信成本与树的构建/挖掘成本之间存在权衡。我们从图 15.4a 和 b 观察到，当站点数量从 1 增加到 2 再到\
  \ 4 时，对合成数据集的挖掘分布在多个站点之间。结果是每个单独站点的工作量减少了，构建和挖掘了更小的 `UF-trees`。因此，运行时间缩短了。然而，当站点数量从\
  \ 4 增加到 8 再到 16 时，额外通信成本带来的开销抵消了使用额外站点的收益。因此，运行时间增加。图 15.4c 和 d 显示了对真实蘑菇数据库挖掘的类似观察结果，除了\
  \ (i) 当站点数量从 2 增加到 4 再到 8 时运行时间缩短，以及 (ii) 当站点数量从 8 增加到 16 时时间增加。\n\n![fig15_4.jpg](img/fig15_4.jpg)\n\
  \n图 15.4 实验 15.4：运行时间与站点数量的关系。\n\n### 实验 15.5\n在实验 15.5 中，我们检查了项目存在概率分布的影响。回想，如果\
  \ `UF-tree` 中的节点包含相同的项目和相同的存在概率值，它们会被合并。因此，我们将存在概率值的精度划分为 2%、5% 和 10%。图 15.5 显示了三个版本的\
  \ IBM 合成数据集，其存在概率值在 [10%, 100%] 范围内。当精度为 2% 时，该范围内所有存在概率值都是 2% 的倍数（例如 10%, 12%,\
  \ 14%, 16%, …, 98%, 100%），总共有 46 个唯一的存在概率值。同样，当精度为 5%（或 10%）时，有 19（或 9）个唯一的存在概率值。当项目仅具有少数唯一的存在概率值时，`UF-trees`\
  \ 变得更小，因此运行更快。\n\n![fig15_5.jpg](img/fig15_5.jpg)\n\n图 15.5 实验 15.5：运行时间与概率分布的关系。\n\
  \n### 实验 15.6\n在实验 15.6 中，我们还测试了 `minsup` 的影响。当 `minsup` 增加时，预期支持 ≥ `minsup` 的项集变少，因此实验所需的运行时间更短。\n\
  \n所有这些实验结果表明了在不确定数据中挖掘约束频繁项集时使用我们提出的分布式算法的重要性和优势。\n\n## 15.6.2 基于 MapReduce 的云环境不确定大数据约束挖掘算法实验](#26_Chapter15.xhtml_sec15_6_2)\n\
  \n在本节中，我们关注嵌入我们的框架中支持复杂挖掘的第二种算法的实验评估和分析。\n\n我们评估了提出的数据分析算法 `MrCloud` 在不确定大数据中挖掘用户指定约束的能力。我们使用了各种基准数据集，包括来自\
  \ UCI 机器学习仓库*26_Chapter15.xhtml) 和 FIMI 仓库的真实数据集（例如 `accidents`、`connect4` 和 `mushroom`）。我们还使用了使用\
  \ IBM Quest 数据生成器生成的 IBM 合成数据集 [[57]。对于我们的实验，生成了从 2 M 到 10 M 个事务，平均事务长度为 10 个项目，领域包含\
  \ 1 K 项目。由于上述真实和合成数据集原始仅包含精确数据，我们为每个事务中的每个项目分配了一个来自 (0, 1] 范围的存在概率。\n\n所有实验均使用 (i)\
  \ 单台配备 Intel Core i7 四核处理器（1.73 GHz）和 8 GB 内存并运行 64 位 Windows 7 操作系统的单机，或 (ii) 亚马逊弹性计算\
  \ (EC2) 集群——具体为 11 个高内存超型（m2.xlarge）计算节点[†26_Chapter15.xhtml_fn3] 运行。\n\n\n\n\n\n\
  ### 实验 15.7\n在实验 15.7 中，我们通过使用 (i) 一个所有项目的存在概率值均为 1.0 的数据库（表示所有项目都确定存在于数据库中）和 (ii)\
  \ 一个用户指定的 AM 约束，展示了 `MrCloud` 的功能和能力。实验结果表明，在准确性方面，我们的数据数据分析算法返回的有效频繁模式集合，与从精确数据中寻找有效频繁模式的现有挖掘框架返回的集合[78–80]相同。需要注意的是，在灵活性方面，`MrCloud`\
  \ 并不限于从所有项目存在概率值为 1.0 的数据库中寻找有效频繁模式。`MrCloud` 能够从任何数据库中寻找有效频繁模式，其中所有项目的存在概率值范围均在\
  \ 0 到 1 之间。\n\n### 实验 15.8\n在实验 15.8 中，我们实验了 (i) 一个不确定数据库和 (ii) 一个具有 100% 选择率（因此每个项目都被选中）的用户指定的\
  \ AM 约束。实验结果表明，在准确性方面，`MrCloud` 返回的频繁模式集合与 `UF-growth` [74]、`tube-growth` [75] 以及\
  \ `BLIMP-growth` [76] 返回的集合相同。需要注意的是，在灵活性方面，`MrCloud` 并不限于处理选择率为 100% 的 AM 约束。`MrCloud`\
  \ 能够处理任何选择率的 AM 约束。\n\n### 实验 15.9\n在实验 15.9 中，我们证明了 `MrCloud` 的效率。图 15.6 显示，在处理\
  \ 100% 选择率约束时，`MrCloud` 的运行时间远短于现有 `UF-growth` 算法 [74] 所需的运行时间，因为 `UF-growth` 并非处理不同选择率的约束。因此，为了进行公平比较，我们在本次实验中使用\
  \ 100% 的选择率。\n\n![fig15_6.jpg](img/fig15_6.jpg)\n图 15.6 实验 15.9：运行时间与事务数量的关系。\n\n\
  ### 实验 15.10\n在实验 15.10 中，我们展示了 `MrCloud` 的运行时间如何随着选择率的增加（即选取的模式减少）而减少。对于本次实验，`MrCloud`\
  \ 在上述 EC2 集群中运行。作为基于 MapReduce 的算法，`MrCloud` 利用了 EC2 集群中的所有 11 个节点。相比之下，作为非基于 MapReduce\
  \ 的算法，`UF-growth` 运行在单机上（即没有利用多个节点）。这解释了为什么 `MrCloud` 比 `UF-growth` 快。此外，该图显示了 `MrCloud`\
  \ 的可扩展性。当 IBM 合成数据集中的事务数量增加时，`MrCloud` 和 `UF-growth` 所需的运行时间也随之增加。然而，`MrCloud` 的运行时间显著低于\
  \ `UF-growth`。相同的结论适用于其他测试的数据集（例如：真实事故、connect4 和蘑菇数据集）。图 15.7a 显示了在 IBM 合成数据集中将约束推送（constraint\
  \ pushing）作为大数据挖掘过程的一部分而非后处理步骤的优势，而 图 15.7b 显示了三个真实事故、connect4 和蘑菇数据集的情况。两幅图都显示，当选择率降低时（即更少的频繁模式满足约束），运行时间也会减少，因为\
  \ (i) `map` 函数返回的键对更少，(ii) `reduce` 函数洗牌和排序的键对更少，和或 (iii) 执行的约束检查更少。\n\n![fig15_7.jpg](img/fig15_7.jpg)\n\
  图 15.7 实验 15.10：(a) 合成数据集和 (b) 真实数据集上的运行时间与选择率的关系。\n\n### 实验 15.11\n在实验 15.11 中，我们检查了\
  \ `MrCloud` 的加速效果。图 15.8 显示，即使仅使用 11 个节点，与 `UF-growth` [74] 相比，`MrCloud` 也实现了很高的加速（例如，对于\
  \ IBM 合成数据集超过了七倍）。\n\n![fig15_8.jpg](img/fig15_8.jpg)\n图 15.8 实验 15.11：加速率与事务数量的关系。\n\
  \n### 实验 15.12\n在实验 15.12 中，我们检查了 `MrCloud` 对于不同 `minsup` 值的效率。图 15.9a 显示了 `MrCloud`\
  \ 在真实事故数据集上的效率：当用户指定的 `minsup` 增加时，`MrCloud` 的运行时间随之缩短。图 15.9b 和 c 分别显示了 connect4\
  \ 和蘑菇数据集的结果。\n\n![fig15_9.jpg](img/fig15_9.jpg)\n图 15.9 实验 15.12：(a) 事故、(b) connect4\
  \ 和 (c) 蘑菇数据集上的运行时间与 minsup 的关系。\n\n### 15.7 结论与未来工作\n\n数据无处不在。大数据算法从精确数据库中发现模式。然而，在某些情况下数据是不确定的。由于不确定数据中每个事务的项目通常与它们出现在事务中的概率相关联，因此相应的搜索空间比精确数据要大得多。当我们处理不确定数据时，这个问题变得更加严重。此外，在许多现实应用中，用户可能只对搜索空间的一小部分感兴趣，例如过去几年中从分布式无线传感器网络获取的大量数据数据。基于这些考虑，在本章中，我们提出了一种针对分布式环境的不确定大数据复杂挖掘的框架，该框架包含了以下两种独特的算法：(i)\
  \ 一种支持在云甚至无线传感器大数据等分布式环境中进行基于树的不确定数据挖掘的算法；(ii) 一种基于 MapReduce 的云环境约束挖掘算法。\n\n为了从这些不确定数据中找到满足用户指定约束的频繁项，第一种算法引入了基于树的挖掘方法，这是约束挖掘、并行分布式挖掘、不确定数据挖掘和基于树的频繁项挖掘的深度集成。该算法处理不同类型的用户指定约束。例如，我们的算法首先在每个分布式站点识别满足简洁约束的领域项目，然后构建\
  \ `UF_tree`，从它可以递归挖掘约束局部频繁项。为了向用户返回每个约束全局频繁项，需要对所有站点的局部频率求和。缺失的频率可以通过遍历关键 `UF_tree`\
  \ 中的路径来计算。除了简洁约束外，我们的算法还处理非简洁约束，如归纳简洁约束和 AM 约束。\n\n第二种算法 `MrCloud` 允许用户通过表达兴趣来查询不确定大数据，并利用云环境中的\
  \ MapReduce 模型处理用户指定的查询，从而避免了先发现所有频繁模式然后在后处理步骤剪除不感兴趣模式所浪费的大量时间和空间。作为输出，`MrCloud`\
  \ 从不确定大数据中发现所有且仅对用户感兴趣的模式。\n\n\n\n此外，一项全面的实验活动清楚地展示了我们的框架在支持分布式环境下从不确定大数据进行复杂挖掘方面的有效性和效率。\n\
  \n未来的工作主要侧重于扩展我们的框架，以提供创新的适应性隐喻。其灵感源于传统的（例如，[105]）和近期（例如，[106]）的研究。\n\n## 参考文献\n\
