  \ | 0 | 10000 |\n| ESD (Uhours) | 3.86 | 0 | 0.14 | 0 | 4 |\n\n### # 2.2.6.3 降低成本的\
  \ ESD 使用与能量交易\n在美国，智能电网允许终端将自产太阳能卖回电网，正如参考文献 68 和 69 研究所示。回售价格低于电网电价，这是由于交流/直流转换过程中的能量损耗、传输损耗以及公用公司的利润考虑造成的。令回售价格表示为\
  \ `Q**g`[*i*]^(*t*)；它可以表示为 `Q**g`[*i*]^(*t*) = `γ` ⋅ `Q**b`[*i*]^(*t*)，其中 `γ` 在于\
  \ 0 到 1 之间。\n\n\n\n\n图 2.8 显示了能量成本随参数 `γ` 增加的变化趋势。如图所示，能量成本的整体趋势随着 `γ` 的增加而降低。当\
  \ `γ` 设置为 `0.1` 或 `0.2` 时，能量成本没有减少。在这种情况下，几乎没有能量回售给电网，因为如此低的回售价格无法产生任何利润，甚至会给数据中心带来经济损失。有趣的是，当参数\
  \ `γ` 高于 `0.3` 时，数据中心可以通过与电网进行能量交易获得巨大利润。当 `γ` 达到 `0.7` 时，在涵盖了数据中心的所有能量成本后，云运营商甚至出现了剩余利润。因此，回售价格参数对总能量成本影响很大。\n\
  ![fig2_8.jpg](img/fig2_8.jpg)\n\n图 2.8 不同参数 `γ` 下能量成本的趋势图。\n图 2.9 显示了我们的建模方法与不同基准的对比。我们有三个基准：\n\
  \n1. `MinCost-NoTrading-NoESD`: 在没有能量交易且不使用能量存储设备（ESD）的情况下最小化总成本 [63]\n3. `MinCost-Trading-NoESD`:\
  \ 在有能量交易的情况下最小化总成本，但不使用 ESD\n\n![fig2_9.jpg](img/fig2_9.jpg)\n图 2.9 最小成本与基准的对比。\n\
  \n我们的调度方法表示为 `MinCost-Trading-ESD`：通过同时使用能量交易和 ESD 来最小化总成本。可以看出，我们的 `MinCost-Trading-ESD`\
  \ 调度在不同的碳排放水平下始终能够实现最低能量成本。在没有能量交易或 ESD 的情况下`MinCost-NoTrading-NoESD` 的能量成本在四种调度中最高。可以发现，无论只使用能量交易还是只使用\
  \ ESD，能量成本都可以降低，而且使用能量交易减少的能量成本比只使用 ESD 更多，这如 `MinCost-Trading-NoESD` 和 `MinCost-NoTrading-ESD`\
  \ 所示。能量交易在降低不同碳排放水平下的总能量成本方面起着重要作用。如图所示，对于没有交易的 `MinCost-NoTrading-NoESD` 和 `MinCost-NoTrading-ESD`，能量成本在不同排放水平下几乎没有变化。相比之下，`MinCost-Trading-NoESD`\
  \ 和 `MinCost-Trading-ESD` 的成本在不同排放水平下变化巨大。ESD 对于调度可以实现的最低排放水平至关重要。例如，`MinCost-NoTrading-NoESD`\
  \ 和 `MinCost-Trading-NoESD` 的最低排放水平为 145 吨，远高于使用 ESD 的水平。得出结论，我们的 `MinCost-Trading-ESD`\
  \ 调度通过同时使用 ESD 和能量交易，可以在减少碳排放的同时大幅降低总成本。\n## 2.3 结论 (#13_Chapter02.xhtml_sec2_3)\n\
  \n在本章中，我们研究了大数据数据中心能量管理中最重要的两个问题：VM 功率计量以及使用可再生能源实现数据中心绿色。\nVM 功率计量对于数据中心的电源管理至关重要。在本节中，我们引入了回归树方法来估计每个\
  \ VM 的功耗。它通过二叉树结构，利用具有适当值的最佳选择特征对数据集进行递归划分。事实证明它是分段线性模型中一种良好的解决方案，更多地依赖于数据集的特征而非人工设置。此外，还提出了一种新的评估方法，能够更客观地反映误差的程度。我们使用误差的标准差来评估我们方法的稳定性。实验表明，我们的回归树方法可以以高精度和高稳定性测量\
  \ VM 和服务器的功耗。\n\n使用可再生能源使云数据中心绿色化是减少碳排放的根本方法。我们首先引入了一个绿色调度框架，在此基础上，我们研究了三个关键问题：\n\
  1. 在能量成本预算范围内最小化碳排放。我们考虑使用 ESD 存储三种类型的能量：风能、太阳能和电能。通过利用更大的 ESD，可以在较低的能量成本预算显著减少碳排放。\n\
  2. 绿色数据中心规划，通过为每个数据中心部署适当数量的服务器、风力机、太阳能电池板和 ESD 容量，尝试优化地利用不同位置的可再生能源优势。部署有更多服务器的数据中心总是相应地部署更多的风力机或太阳能电池板，以及更大的\
  \ ESD。\n3. 通过与电网交易降低能量成本。仿真结果显示，我们使用能量交易和 ESD 的调度器可以在较低的碳排放水平显著降低总成本。此外，较高的回售价格会导致更多能量回售给电网，从而减少更多成本。\n\
