  \ and Computation: Practice and Experience, 26(17):2772–2791, 2014.\n\n\n# 用于大数据分析的\
  \ MapReduce 任务的资源管理\n\n\n## 目录\n\n\n## 6.1 引言\n\n\n### 6.2.1 MapReduce\n\n\n####\
