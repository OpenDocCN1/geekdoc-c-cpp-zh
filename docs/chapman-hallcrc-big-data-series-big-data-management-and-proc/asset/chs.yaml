  \ 隐私设计与默认保护\n\n## 1.4 结论与建议\n\n\n大数据与个人数据之间的重叠变得日益相关，这不仅由于数据量的增长，还由于大数据的全球性，加上对趋势和偏好的兴趣，使得有必要分析其与个人数据的关系。通过对数据质量作为基本前提的关注，作者们探讨了传统和现代数据保护原则如何适用。这不仅关于数据的数量，而是关于其质量！\n\
  \n\n大数据无处不在：在报纸、电视、研究论文中，在 IT 专家手中。这不仅是因为其响亮的名字，更是因为可用数据的巨大量——根据 IBM，我们每天产生 2.5\
  \ 百亿亿（10¹⁸）字节的数据。但大数据在多大程度上影响或涵盖个人数据？\n\n\n通过引言，第一步是为该概念提供定义。近年来，人们对大定义进行了多次尝试，但尚未达成共识。这可能是由于该概念的不断演变，使得在描述时很难避免过于宽泛，或者在短时间内过时。\n\
  \n\n大数据可以并应用于各种情况。预测性分析被用于处理高度拥堵城市的交通问题，为未来智慧城市的创造铺平道路。此外，大数据对医学可以产生巨大影响，通过让研究人员识别此前未知的肥胖与抑郁之间的联系，已经帮助了研究结果。\n\
  \n\n\n\n\n剑桥大学心理测量中心最近进行了一项有趣的研究：通过分析 58,000 名用户的社交网络“点赞”，研究人员发现他们能够以 95% 的准确率预测种族起源，并以超过\
  \ 80% 的准确率预测宗教或政治取向。或许更有戏剧性的是，他们还能预测智力或情绪稳定性等心理特征。该研究是利用受访者自己提供的公开数据（Facebook 点赞）进行的。当将这些结果与其他来源获取的同一受者数据（如其他社交网络简介或互联网使用习惯）交叉引用时，其结果可以进一步微调。这就是大数据与个人数据开始交叠之处，两者仅隔着一条模糊的边界：“点赞”特定的摇滚乐队本身并不构成个人数据，但将此类信息直接链接到个人或其他信息的能力，使得识别这个人实际上喜欢什么成为可能；此外，它还能够对他们的性格进行推断，可能揭示出敏感的政治或宗教偏好（正如剑桥研究所示）。欧洲数据保护监督员（EDPS）在最近的一份意见中表示：“公司可能认为其大部分数据为非个人数据集，但实际上，由用户活动产生的数据现在被完全且不可逆地匿名化的已属罕见。”因此，来自不同来源的海量数据可用性，结合对了解更多人类习惯的渴望，对个人隐私权构成了严峻挑战，并要求仔细考虑数据保护原则。\n\
  \n\n本章旨在从现代视角分析大数据的个人数据保护法律合规方面，以识别主要挑战，并为作为资产更高效、更合法地使用数据提供适当建议。书中还简要考虑了大型个人数据分析与竞争法之间的联系。方法论非常直接：贯穿全章的观察基于监管机构和咨询机构的研究，以及作者的实证研究和实践经验。本章的一个重点是数据质量。由于大数据的特质，质量不合格（准确、相关、一致和完整）的原始数据是利用数据价值的障碍。希望本章能让读者更好地理解，正确的法律合规管理可以在一方面简单地收集海量数据与另一方面有效利用大数据的力量之间，产生根本性的区别。\n\
  \n\n本章分为两个主要部分：第一部分从业务角度分析大数据的个人数据方面，旨在识别在大型个人数据集上使用大数据分析的优势和挑战。第二部分详细讨论了如何将传统数据保护原则应用于大数据分析，同时处理现代数据保护原则。总体而言，本章旨在为理解在个人数据集上部署大数据分析的积极和消极影响提供良好的基础。此外，本章将关注所分析数据质量的重要性、实现良好水平数据质量的不同方法，以及在无法达到这些标准时可能产生的负面后果。\n\
  \n\n现在已经很清楚：大数据意味着大生意。数据经常被称为“21 世纪的石油”或“数字经济的燃料”，欧洲委员会负责数字议程的副主席尼埃莉·克罗斯（Neelie\
  \ Kroes）将我们所处的时代称为“数据黄金淘热潮”。这不仅在理论上是如此，在实践中也是如此。领先的咨询公司麦肯锡（McKinsey）的一份报告发现，“大数据的强度在不同行业之间有所不同，但在每个行业都已达到临界点”，并且“我们正处于巨大的创新、生产力和增长浪潮的边缘，以及新的竞争和价值获取模式的边缘——这一切都是由消费者、公司和经济部门对大数据潜力的开发所驱动的。”\n\
  \n\n### 1.2.1 大数据与个人数据的联系\n\n\n\n\n\n`Regulation 679/2016` 将个人数据的概念定义为“任何与已识别或可识别的自然人有关的信息（‘数据主体’）；一个可识别的自然人是指可以直接或间接被识别的人，特别是通过参考标识符（如姓名、身份识别码、位置数据、在线标识符）或该自然人的物理、生理、遗传、心理、经济、文化或社会身份特定的一个或多个因素来识别。”[[¶\
  \ 尽管个人身份特定因素列表较 `Directive 95/46/EC` 中包含的个人数据之前的定义有所丰富，但主要元素保持不变。`Article 29 Working\
  \ Party` 在其 `Opinion 4/2007` 中对这些元素进行了讨论和阐述，该意见确定了确定某信息是否应被视为个人数据有四个基本元素。”[[∗\n\n\
  \n### 1.2.1.1 任何信息 (#12_Chapter01.xhtml_sec1_2_1_1)\n\n\n“任何信息”一词也意味着任何形式的信息，音频、文本、视频、图像等。重要的是，信息的存储方式并不重要。工作组特别提到\
  \ `biometric data` 是一个特殊情况，[[∗ 因为此类数据既可以被视为信息内容，也可以被视为个人与信息之间的联系。由于生物识别数据是个人特有的，它们也可以被用作标识符。\n\
  \n\n与个人相关的信息是关于该个人的信息。数据与个人之间的关系通常是显而易见的，例如，当数据存储在个人员工的案文件或医疗记录中时。然而，情况并非总是如此，特别是当信息涉及物体时。这些物体属于个人，但需要额外的含义或信息来建立与个人的联系。”[[†\n\
  \n\n### 1.2.1.3 已识别或可识别 (#12_Chapter01.xhtml_sec1_2_1_3)\n\n\n为了确定拥有数据访问员是否能够识别该个人，应该考虑控制者或任何其他人员可能使用的所有合理手段。在评估时，应考虑到识别成本、意图目的、处理结构的方式、数据控制者预期的利益、数据主体涉及的利益，以及组织功能障碍和技术故障的风险。”[[[[∗\n\
  \n\n`Directive 95/46/EC` 适用于自然人的个人数据，这是一个宽泛的概念，要求保护完全独立于数据主体的居住地或国籍。\n\n\n总之，在某些情况下，数据本身可能不是个人性的，但通过与包含特定用户信息的其他来源和数据库交叉引用，可能会变成个人数据，从而将潜在人员范围缩小到“可识别人员”，并最终缩小到特定的个人。2013\
  \ 年《麻理工科技评论》提出了大数据是否使匿名化变得不可能的问题，认为“随着数据量的呈指数级增长，几乎所有数据都携有某人的数字指纹。”[[[[¶ 大数据个人数据日益成为常态而非例外，这要求针对个人隐私权采取特定的保护措施。”\n\
  \n\n\n\n\n由于欧盟层面的竞争法缺乏“统一目标”，监管机构根据非常具体的竞争参数对每种情况（例如具有主导地位的公司之间的合并）进行个案评估。这些参数由委员会的《指南》确立，包括：价格、产量、产品质量、产品多样性和创新。然而，对于业务模式以大数据为中心的公司来说，要对其应用这些标准是困难的，特别是考虑到例如，对于以用户个人数据为交换而提供的“免费”服务，衡量合并实体提高价格的可能性是一项挑战。因此，该报告建议对此类类问题提高警惕，并监控市场，以确定是否正在利用个人数据作为“武器”滥用市场主导地位。\n\
  \n\n确保数据库内数据质量一致性的最佳方法是从收集点开始，并在处理链中实施措施或程序。当以负责任收集数据时，消费者的信任可能会增加，用户因此提供更准确的数据。在\
  \ SDL 最近的一项调查中，79% 的受访者表示他们更有可能向他们“信任”的品牌提供个人信息。拥有一个完善、透明且易于理解的隐私政策是朝这一方向迈的第一，因为它有助于平衡公司与消费者之间的信息不对称。另一步是实施定期审查程序，旨在识别仍然相关的数据、纠正过时或错误的数据，并删除不再需要的数据。这还将构成定期“清理”数据库的机会，以确保没有来自所谓僵尸账户的“死数据”。\n\
  \n\n\nEDPS 发布的关于大数据相关主题的最新《意见》讨论了是否以及如何将传统数据保护原则应用于涉及个人数据的大数据分析。该文件中体现的底层考量是“我们需要在大数据世界中更动态地保护我们的基本权利”。文章认为，传统的数据保护原则（即大数据时代之前确立的原则）如透明性、比例性和目的限制必须进行现代化和加强，但还需要由最近为应对大数据本身带来的挑战而开发的“新原则”进行补充——即问责制、设计隐私和默认隐私。在接下来的章节中，将结合作者在整个章节中倡导的数据质量这一总体原则，讨论这些原则的应用。数据质量被认为与这些原则中的每一个都紧密相关。确保数据相关、准确且最新，是成功应用这些原则的基础，同时也代表了合规与收益之间的桥梁，从而实现投资回报（ROI）。\n\
  \n\nEDPS 将透明性、比例性和目的限制称为“传统”数据保护原则。尽管这些原则在大数据分析时代之前就已经确定，但它们在今天仍然至关重要。它们已经过升级以适应当前的背景，因此，了解大数据如何改变它们的应用方式非常重要。\n\
  \n\n透明性原则涉及数据控制者向数据主体提供的有关其使用数据的信息。透明性是数据保护的基本原则之一，处于数据质量的核心：如果数据控制者的做法是透明的，那么用户就知道了他们期待什么，并更有可能提供关于自己的准确数据；因此，创建的数据集可能具有相关性。确保透明性的方法曾是向用户提供信息告知，让他们了解数据是如何被处理的。然而，在大数据时代，需要数据控制者更加主动，以确保提供给用户的信息是易读且易懂的。\n\
  \n\n\n隐私政策通常由“法律术语”编写的文本组成，用户往往无法理解。皮尤研究中心（Pew Research Center）的一项研究发现，52% 的受访者不知道隐私政策是什么，错误地认为这意味着公司将确保对其数据进行保密。这可能是因为隐私政策通常是冗长且复杂的文本，仔细阅读需要花费大量时间。根据卡内基·梅隆大学两位研究人员进行的一项研究，一个人平均需要\
  \ 76 个工作日才能读完一年内访问的所有网站的隐私政策。该研究开展于 2008 年，考虑到互联网使用的动态扩张，如今个人在一年内可能甚至没有足够的时间读完同一年访问的所有网站的隐私政策。\n\
  目前，隐私政策被认为是确保透明性的主要工具，但它们实现这一目的的效率很低。卡内基·梅隆大学的教授在今年 1 月举行的 PrivacyCon 大上提出了改进隐私政策的建议。他们建议提取并突出不符合用户预期的数据实践，使用视觉化格式显示隐私政策，并用不同的颜色标出符合常见预期和不符合预期的做法。\n\
  \n这些想法可以帮助用户解读隐私政策并理解他们的数据是如何被使用的，增加透明度，并有助于平衡数据控制者与数据主体之间的信息不对称。\n作者支持这些建议，并同意视觉增强型隐私政策会更有效，并能快速传递信息，吸引用户的注意力。使用不同的颜色来识别隐私级别的合规性将使隐私政策作为一种工具在信息传递上更加高效。作为一个积极的副作用，更易理解的隐私政策将增强用户对数据控制者的信任，并有助于数据质量，因为当用户信任该数据的公司时，他们倾向于提供更准确的个人数据。\n\
  \n### 1.3.1.2 比例原则与目的限制原则\n每个用户在浏览互联网或使用手机 App 时留下的个人数据量是惊人的。计算社会科学家亚历克斯·彭特兰德（Alex\
  \ Pentland）将这些数据称为“面包屑”：“我相信大数据的威力在于它是关于人们行为的信息，而不是关于信仰的信息。它是关于客户、员工和你新业务潜在客户的 {。它不是关于你在\
  \ Facebook 上发布的内容，也不是关于你在 Google 上的搜索（这是大多数人认为的），更不是来自公司内部流程和 RFID 的数据。这种大数据来自手机位置数据或信用卡数据等：当你行走在世界各地时留下的那些微小数据面包屑。”这些数据面包屑如何使用的真实案例之一是\
  \ Netflix，它利用大数据分析，根据从全球超过 3000 万用户的客户群收集的信息，判断在线剧《纸牌屋》是否会火。\n\n比例原则和目的限制原则与 Netflix\
  \ 的案例紧密相关。每天都会收集海量数据，但这些数据未来如何被使用并不总是明确的，而这恰正是数据的价值所在：即为了不同目的反复使用它而不降低其整体价值的潜力。因此，传统的数据保护比例原则和目的限制原则也适用于大数据领域。\n\
  在这方面，2013 年 4 月 2 日，第 29 数据保护工作组发布了一份关于目的限制原则的意见。目的限制概念有两个主要构建模块：\n\n*   收集个人数据的目的必须是特定的、明确且合法的目的（所谓的目的说明）。\n\
  \n兼容或不兼容的使用需求需要根据以下关键因素进行逐案评估——“兼容性评估”（另见 `Article 6.4 Regulation (EU) 679/2016`）：\n\
  \n*   收集个人数据的背景以及数据主体对其进一步使用的合理预期\n*   个人数据的性质以及进一步处理对数据主体的影响\n*   控制者为确保公平处理并防止对数据主体产生任何不当影响而采取的保护措施\n\
  在这一份意见中，第 29 数据保护工作组处理了大数据问题。更确切地说，第 29 数据保护工作组指明，为了合法地处理大数据，除了必须满足兼容性评估的四个关键因素外，还必须评估额外的保护措施，以确保公平处理并防止任何不当影响。第\
  \ 29 数据保护工作组考虑了两种场景来识别此类额外保护措施：\n\n1.  “在第一种情况下，处理数据的组织想要检测信息中的趋势和相关性。\n\n在第一种情况下，所谓的“功能分离”在决定数据的进一步使用是否可以被视为兼容时起着主要作用。“功能分离”的示例包括：“数据的完全或部分匿名化、去标识化或聚合、隐私增强技术，以及其他确保数据无法被用于对个人做出决策或其他行动的措施”。\n\
  \n\n\n在第二种情景，需要获得现有客户/数据主体的同意（即自由、特定、知情且明确的“选择性加入”）才能使进一步的使用被认为是兼容的。在这方面，`Article\
  \ 29 Data Protection Working Party` 规定，“应当要求此类同意，例如用于直接营销、行为广告、数据买卖、基于位置的广告或基于追踪的数字市场研究的跟踪和分析。”此外，数据主体对以下内容的访问：(i)\
  \ 他们的“画像”，(ii) 开发这些画像的算法，以及 (iii) 导致这些画像创建的数据源的访问，被视为确保同意具有知情性并确保透明度的前提。此外，数据主体应被有效授予更正或更新其画像的权利。最后，`Article\
  \ 29 Data Protection Working Party` 建议允许“数据可移动性”：“采取措施，如允许数据主体/客户以便携、用户友好且机器可读的格式访问其数据[作为一种方法]，使企业和数据主体/消费者能够以更平衡、透明的方式最大化大数据的效益。”\n\
  ## 1.3.2 现代数据保护原则\n\n`EDPS` 确定了“大数据负责任且可持续发展的四个核心要素：\n* 组织必须在如何处理个人数据方面具有更高的透明度；\n\
  * 赋予用户对其数据使用方式具有更高程度的控制权；\n* 在其产品和服务中设计用户友好型的数据保护；以及\n\n从上述列表中显而易见，在这四个核心要素中，只有第一项与传统的数据保护原则（透明性）有关。四个核心要素中的其他三个都与现代数据保护原则有关，如问责制、默认隐私和设计隐私以及增加用户对自身数据的控制。从这个意义上说，大数据个人数据处理与传统的个人数据处理非常不同，因为它需要遵循额外的原则——这些原则是专门为应对大数据挑战而设计的。\n\
  \n\n（现已陈调）流行的俗言“权力越大，责任越大”完美地捕捉了大数据个人数据处理中问责制的本质（另见 `Article 5.2 Regulation (EU)\
  \ 679/2016`）。问责制不仅与数据的如何处理（程序的透明度、数据主体对自身数据的访问权限等）有关，还与算法决策问题有关，这是 21 世纪大数据个人数据处理的直接结果。高层次地处理个人数据仅仅是目的的手段，最终目的是能够根据大型数据库中收集和存储的信息，在大规模范围内做出知情决策。正如\
  \ `EDPS` 在其 `Opinion 7/2015` 中指出的，“大数据最强大的用途之一是对可能发生但尚未发生的事情进行预测。”这再次与作者在本章中一直强调的数据质量紧密相关：如果数据质量高，相关的决策可能会产生积极结果；相反，如果数据质量差，决策可能会对受影响的人群产生负面影响，导致潜在的不公正和/或歧视性结论。在任何情况下，数据控制者必须对他们基于个人数据大数据集所做出的决策负责并接受问责。\n\
  \n\n### 1.3.2.2 设计隐私和默认隐私\n\n\n在处理个人数据大数据集时，从一开始就考虑到隐私要求，可以确保只收集处理严格必需的数据，并随后确保在相关决策中使用的数据是准确的。此外，正如本章之前（在\
  \ `Section 1.2.2` 下）提到的，数据主体对数据控制者的信任程度与他们选择与控制者共享的数据准确性之间存在直接联系。如果隐私从个人数据收集和处理的开始就嵌入其中，数据主体更有可能信任数据控制者，从而提供更高质量的数据。\n\
  \n\n\n\n\n### 1.3.2.3 用户对自身数据的控制\n\n\nEDPS 在其近期关于大数据的 7/2015 号意见中提到了个人数据的“特征化”（featurisation），认为对个人数据的控制程度可以被解释为提供给用户的一项特征。EDPS\
  \ 认为，数据控制者应当与那些被处理数据的人员“共享”通过处理个人数据所创造的财富。\n\n\n作为一种（非常积极的）副作用，赋予用户更多对其数据的控制权将有助于提高数据质量，正如之前解释过的，数据质量对处理的相关性以及根据处理结果做出的决策具有高度重要性。根据德勤咨询公司的研究，“鉴于收集和使用大数据所投入的时间和成本，询问大数据何时、为何以及如何产生相应的巨大价值是值得的。[……]\
  \ 在现实中，数据量、多样性和速度只是许多考量因素之一。首要问题是收集对当前问题具有最有用信息的正确数据。”因此，创建一个公平的数据“市场”，让用户不仅能够访问其个人信息，还能对其进行控制，将有助于确保收集的数据更加准确、有用且实新。\n\
  \n\n本章探讨了个人数据保护与大数据之间的联系，并考虑了欧盟层面的近期的立法修订（特别是 `Regulation (EU) 679/2016—“《通用数据保护条例》`\
  \ 的生效），以及第 29 数据保护工作组和 EDPS 的相关意见和建议。\n\n\n\n\n作者在本章的第 1.2 节中首次得出，大数据与个人数据之间的联系变得越来越容易建立，因为互联网上各种各种信息源的交叉比对可以识别出特定个人，即使这些信息最初并非个人数据。因此，处理大数据时必须极度注，以确保：(a)\
  \ 不处理任何个人数据，或 (b) 在处理个人数据时，确保处理过程完全符合适用的法律规定。隐私和个人数据保护的合规性还能为公司带来竞争优势，使其能够充分利用数据价值。事实上，事实表明，只有在个人数据被合法收集和进一步处理的情况下，大数据才意味着巨大的商机。只有在这种情况下，才能将大规模数据集的收集、处理与通过提取价值实现其变现联系起来，从而实现投资回报率（ROI）。最后，数据质量对于确保数据分析结果的相关性、准确性和及时性至关重要。通过提供更多信息和设计易于理解的隐私政策来增强用户对公司的信任，可以增加用户提供个人准确数据的意愿。\n\
  \n第 1.3 节讨论了传统的现代的个人数据保护原则。在传统原则中，在大数据背景下，透明度对于正确处理个人数据仍然至关重要的。作者建议，通过使用不同的颜色代码显示隐私合规水平来视觉化增强隐私政策，有助于提高透明度，从而增强用户对数据控制者的信任。关于现代数据保护原则，它们是为了应对技术进步和数据分析的演变而发展的：数据控制者的问责制、结合“设计隐私”和“默认隐私”，以及赋予用户对其自身数据的更多控制权，是处理大规模个人数据时的基本原则。特别是，作者同意欧洲数据保护监督员（EDPS）的建议，即个人数据的“特征化”和创建“个人数据存储”将使数据主体对数据拥有更多控制权，并有助于在他们与数据控制者之间建立更公平的平衡。\n\
  ## 结论\n\n在大数据时代，个人数据保护合性和质量管理起着至关重要的作用，如果数据控制者希望充分利用其拥有的数据价值，必须采取相关的保护措施。如果读者能从本章中学到一个教训，那应该是：关键不在于数据的数量，而在于其质量！作者旨在表明，隐私合规不仅是一个形式化的程序，还可以通过建立更高层次的用户信任来帮助提高数据质量，从而引导他们提供更准确的数据。由于大数据最大的问题之一是错误容易滚球效应，确保数据质量对于分析结果的准确性至关重要。任何有助于数据质量的机制或程序（无论内部还是外部）都应被认为具有高度价值，作者强烈建议实施这些机制。\n\
