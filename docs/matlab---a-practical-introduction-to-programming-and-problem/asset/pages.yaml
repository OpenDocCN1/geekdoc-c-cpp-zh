    # SUMMARY


    Common Pitfalls


    +   - Confusing matrix multiplication and array multiplication. Array operations,
    including multiplication, division, and exponentiation, are formed by term (so
    the arrays must have the same size); the operators are *, /, \, and ^. For matrix
    multiplication to be possible, the inner dimensions must agree and the operator
    is *.

    - Forgetting to augment one matrix with another, the number of rows must be the
    same in each.


