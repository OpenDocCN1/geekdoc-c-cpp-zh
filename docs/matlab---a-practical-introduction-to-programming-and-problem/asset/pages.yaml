    A linear algebraic equation is the equation of the form


    ```

    $a_1x_1 + a_2x_2 + a_3x_3 + \dots + a_nx_n = b$

    ```


    Solutions to sets of equations in this form are important in many applications.
    In the MATLAB® product, to solve systems of equations, there are basically two
