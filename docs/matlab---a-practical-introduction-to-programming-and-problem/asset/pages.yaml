    # 12.1.4 Matrix multiplication


    Matrix multiplication does not mean multiplying by term; it is not an array operation.
    Matrix multiplication has a very specific meaning. First of all, to multiply a
    A by a matrix B to result in a matrix C, the number of columns of A must be the
    number of rows of B. If the matrix A has dimensions $m \times n$, that means that
    matrix B must have dimensions $n \times$ something; we call it $p$.


    We say that the inner dimensions must be the same. The resulting matrix C has
    the same number of rows and columns as B (i.e., the outer dimensions $m \times
    p$). In mathematical notation,


    $[A]_{m\times n}[B]_{n\times p} = [C]_{m\times p}$


    This only defines the size of C.


    The elements of matrix C are defined as the sum of products of corresponding elements
    in rows of A and columns of B, or in other words,


    $c_{ij} = \sum_{k=1}^{n} a_{ik}b_{kj}$


    In the following example, A is $2 \times 3$ and B is $3 \times 4$; the inner dimensions
    are both three, so the matrix multiplication is possible. C will have its size
    as the outer dimensions $2 \times 4$. The elements in C are obtained using the
    summation just described. The first row of C is obtained using the first row of
    A and successors. For example, $C(1,1)$ is $3*1+8*4+0*0$ or $35$. $C(1,2)$ is
    $3*2+8*5+0*2$ or $46$.


    $$\begin{array}{ccc} 3 & 8 & 0 \ 1 & 2 & 5 \end{array} * \begin{array}{ccc} 1
    & 2 & 3 \ 4 & 5 & 1 \ 0 & 2 & 3 \end{array} = \begin{array}{ccc} 35 & 46 & 17
    \ 9 & 22 & 5 \end{array}$


    # THE PROGRAMMING CONCEPT


    To multiply two matrices together, three nested for loops iterate through the
    rows and columns of C, which is $m \times p$. For each element in C ($c_{ij}$),
    the inner loop sums $a_{ik}b_{kj}$ for values of $k$ from 1 through $n$. The following
    is a script that will accomplish this:'
