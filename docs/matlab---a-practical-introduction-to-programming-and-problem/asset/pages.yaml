  md: "# 4.3.5 Error-checking user input in a loop\n\nIn applications, when the user\
    \ is prompted to enter something, there is a valid range of values. If the user\
    \ enters an incorrect value, rather than having the program carry on with an incorrect\
    \ value, or just printing an error message, the program should repeat the prompt.\
    \ The program should keep prompting the user, reading the value, and checking\
    \ it, until the user enters a value that is in the correct range. This is a very\
    \ common application of a conditional loop: looping until the user correctly enters\
    \ a value in a program. This is called error-checking.\n\nFor example, the following\
    \ script prompts the user to enter a positive number, and loops to print an error\
    \ message and repeat the prompt until the user enters a positive number.\n\n```\n\
    readonenum.m\n% Loop until the user enters a positive number\ninput=input('Enter\
    \ a positive number: ');\nwhile input < 0\n    input = input('Invalid! Enter a\
    \ positive number: ');\nend\nfprintf('Thanks, you entered a %.f\\n',input)\n```\n\
    \nAn example of this script follows:\n\n```\nreadonenum\nEnter a positive number:\
    \ -5\nInvalid! Enter a positive number: -2.2\nInvalid! Enter a positive number:\
    \ c\n??? Error undefined function or variable 'c'.\nUndefined function or variable\
    \ 'c'.\n```\n\n> Note\nMATLAB itself catches the input and prints an error message\
    \ and repeats the prompt when the c was entered.\n\n```\nInvalid! Enter a positive\
    \ number: 44\nThanks, you entered a 44.0\n```\n\n# QUICK QUESTION!\n\nHow could\
    \ we vary the previous example, so that the script asks the user to enter numbers\
    \ n times, where n is an integer defined by 3?\n**Answer:** Every time that the\
    \ user enters a value, the script checks and in a while loop keeps telling the\
    \ user that it's\n\nuntil a valid positive number is entered. By putting the error-check\
    \ in a for loop that repeats n times, the user is forced effectively to enter\
    \ three positive numbers, as shown in the following.\n\nContinued"
