    # 12.2.2 Gauss and Gauss-Jordan elimination


    For 2 × 2 systems of equations, there are solution methods that are well-defined
    and simple. However, for larger systems of equations, finding solutions is frequently
    not straightforward.


    Two related methods of solving systems of linear equations will be described here:
    Gauss elimination and GaussJordan elimination. They are both based on the observation
    that systems of equations are equivalent if they have the same solution. Also,
    performing simple operations on rows of a matrix, called elementary row operations
    (EROs), result in equivalent systems. These fall into three categories:


    +   1. Scaling: This changes a row by multiplying it by a nonzero scalar sr, r_i
    → sr_i

    2. Interchange rows: For example, interchanging rows r_i and r_j this is written
    as

    r_i ↔ r_j

    3. Replacement: Replace a row by adding it to (or subtracting from it) a multiple
    of another row. For a given row r_i, this is written as

    r_i + sr_j → r_i


    Note that when replacing row r_i is multiplied by it, nothing is changed. Instead,
    row r_j is multiplied by a scalar s (which could be a fraction) and that is added
    to or subtracted from row r_i. For example, the matrix


    ```

    \begin{bmatrix} 4 & 2 & 3 \ 1 & 4 & 0 \ 2 & 5 & 3 \end{bmatrix}

    ```


    an example of interchanging rows would be r_1 ↔ r_3, which would yield:


    ```

    \\begin{bmatrix} 4 & 2 & 3 \ 1 & 4 & 0 \ 2 & 5 & 3 \end{bmatrix} r_1 \leftrightarrow
    r_3 \\begin{bmatrix} 2 & 5 & 3 \ 1 & 4 & 0 \ 4 & 2 & 3 \end{bmatrix}

    ```


    Now, with this matrix, an example of scaling would be 2r_2 → r_2, which means
    all elements in row 2 are multiplied by 2. This yields:


    ```

    \begin{bmatrix} 2 & 5 & 3 \ 1 & 4 & 0 \ 4 & 2 & 3 \end{bmatrix} 2r_2 \rightarrow
    r_2 \begin{bmatrix} 2 & 5 & 3 \ 2 & 8 & 0 \ 4 & 2 & 3 \end{bmatrix}

    ```'
