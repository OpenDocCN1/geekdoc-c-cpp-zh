  md: '# 13.1.4 Median


    The **median** is defined only for a data set that has been **sorted** first,
    meaning that the values are in order. The median of a sorted set of *n* data values
    is defined as the value in the middle, if *n* is odd, or the average of the two
    values in the middle if *n* is even. For example, for the vector [1 4 5 9 12],
    the middle value is 5. The function in MATLAB is called **median:**


    ```

    >> median([1 4 5 9 12])

    ans =

    5

    ```


    For the vector [1 4 5 9 12 33], the median is the average of the 5 and 9 in the
    middle:


    ```

    >> median([1 4 5 9 12 33])

    ans =

    7

    ```


    If the vector is not sorted in order to begin with, the **median** function will
    still return the correct result (it will sort the vector automatically). For example,
    scrambling the order of the values in the first example will still result in a
    median value of 5.


    ```

    >> median([9 4 1 5 12])

    ans =

    5

    ```


