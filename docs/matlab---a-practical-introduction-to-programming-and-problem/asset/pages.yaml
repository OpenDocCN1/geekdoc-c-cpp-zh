  md: '# Loop Statements


    # KEY TERMS


    +   - looping statements running sum outer loop

    - counted loops running product inner loop

    - conditional loops factorial infinite loop

    - action preallocate counting

    - iterate echo printing error-checking

    - loop or iterator variable nested loop


    # CONTENTS


    +   - 4.1 The For Loop...........116

    - 4.2 Nested Loops...........128

    - 4.3 While Loops...........139


    Consider the problem of calculating the area of a circle with a radius of 0.3
    centimeters. A MATLAB® program is not needed to do that; use your calculator instead,
    and punch in π * 0.². However, if a table of circle areas is desired, for radii
    ranging from 0.1 centimeters to 100 centimeters in steps of 0.05 (e.g., 0.1, 0.15,
    0.2, etc.), it would be very tedious to calculate and write it all down. One of
    the great uses of a computer program as MATLAB is the ability to repeat a process
    such as


    This chapter will cover statements in MATLAB that allow other statement(s) to
    be repeated. The statements that do this are called looping statements, or loops.
    There are two kinds of loops in programming: counted loops and conditional loops.
    A counted loop is a loop that repeats a specified number of times (so, ahead of
    time it is how many times the statements are to be repeated). In a counted loop,
    for example, you might say “repeat these statements 10 times.” A conditional loop
    also repeats, but ahead of time it is not how many times the statements will need
    to be repeated. With a conditional loop, for example, you might say “repeat these
    statements until this condition becomes false. The statement(s) that are repeated
    in any loop are called the action of the loop.


    MATLAB: A Practical Introduction to Programming and Problem Solving

    © 2012 Elsevier Inc. All rights reserved.'
