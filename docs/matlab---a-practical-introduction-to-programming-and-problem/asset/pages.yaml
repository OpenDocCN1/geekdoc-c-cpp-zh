    One of the main concepts of the subject of linear algebra is the different methods
    of solving (or, attempting to!) systems of linear algebraic equations. MATLAB
    has many functions that assist in this process.


    Once the system of equations has been written in matrix form, what we want is
    to solve the equation Ax=b for the unknowns x. To do this, we need to isolate
    x on one side of the equation. If we were working with scalars, we would divide
    both sides of the equation by A. In fact, with MATLAB we can use the divided into
    operator to do this. However, most languages do not work with matrices, so we
    instead multiply both sides of the equation by the inverse of the coefficient
    A:


    ```

    A⁻¹ x = A⁻¹ b

    ```


    Then, multiplying a matrix by its inverse results in the identity matrix I, and
    because multiplying any matrix by I results in the original matrix, we have:


    ```

    I x = A⁻¹b

    ```


    or


    ```

    x = A⁻¹b

    ```


    This means that the column vector of unknowns x is found as the inverse of matrix
    A multiplied by the column vector b. So, if we can find the inverse of A, we can
    solve for the unknowns in x.


    For example, consider the following three equations with three unknowns—x₁, x₂,
    and x₃:


    ```

    4x₁ - 2x₂ + 1x₃ = 7

    1x₁ + 1x₂ + 5x₃ = 10

    -2x₁ + 3x₂ = 2

    ```


    We write this in the form Ax = b where A is a matrix of the coefficients, x is
    a column vector of the unknowns x, and b is a column vector of the values on the
    right side of the equations:


    The solution is then x = A⁻¹b. In MATLAB there are two simple ways to solve this.
    The built-in function inv can be used to get the inverse of A and then multiply
    this by b, or we can use the divided into operator.'
