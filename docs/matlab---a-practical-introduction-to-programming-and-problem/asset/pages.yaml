    # 3.5 THE SWITCH STATEMENT


    A switch statement can often be used in place of a nested if-else or if statement
    with many elif clauses. Switch statements are used when an expression is tested
    to see whether it is equal to one of several possible values.


    The general form of the switch statement is:


    ```

    switch switch_expression

    case caseexp1

    action1

    caseexp2

    action2

    caseexp3

    action3

    % etc: there can be many of these

    otherwise

    actionn

    end

    ```


    The switch statement starts with the reserved word switch, and ends with the reserved
    word end. The switch_expression is compared, in sequence, to the case expressions
    (caseexp1, caseexp2, etc.). If the value of the switch_matches caseexp1, for example,
    then action is executed and the switch statement ends. And in general if the value
    matches casexi i can be any integer from 1 to n, then the action is executed.
    If the value of the switch_expression does not match any of the case expressions,
    the action after otherwise is executed (the nth action).


    It is assumed that the user will enter an integer value. If the user does not
    enter, an error message will be printed or an incorrect result will be returned.
    Methods for remedying this are discussed in Chapter 4.


    For the previous example, the switch statement can be used as:


    ```

    switchgrade.m


    function grade = switchgrade(quiz)

    % switchgrade returns the letter grade corresponding

    % to the integer quiz argument using switch

    % Format of call: switchgrade(integerQuiz)

    % Returns a character

    ```'
