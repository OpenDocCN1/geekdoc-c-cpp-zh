    # 5.6 TIMING


    MATLAB has built-in functions that determine how long it takes code to execute.
    One of related functions is *tic/toc*. These functions are placed around

    code, and will print the time it took for the code to execute. The function tic\essentially
    turns a timer on, and then toc evaluates the function and prints the

    result. The following is a script that illustrates these functions.


    > Note

    When timing functions such as tic/toc, be aware that other

    processes running in the background (e.g., any web browser) will affect

    tpeed of your code.


    ```

    fortictoc.m

    tic

    mysum = 0;

    for i = 1:2000000

    mysum = mysum + i;

    end

    toc

    ```


    ```

    >> fortictoc

    Elapsed time is 0.088591 seconds.

    ```


