    # 12.2.1 Solving 2 × 2 systems of equations


    Although this may seem easy in MATLAB, in general, finding solutions to systems
    of equations is not. However, 2 ×2 systems are fairly straightforward, and there
    are several methods of solving these systems for which MATLAB has built-in functions.


    Consider the following 2 × 2 system of equations:


    x1 + 2x2 = 2

    2x1 + 2x2 = 6


    First, to visualize the solution, we will change both equations to the equation
    of a straight line by write each in the form y = mx + b (by changing x1 to x and
    x2 to y):


    ```

    x + 2y = 2      → 2y = -x + 2      → y = -0.5x + 1

    2x + 2y = 6      → 2y = -2x + 6      → y = -x + 3

    ```


    In MATLAB we can plot these lines using a script; the results are seen in Figure
    12.1.


    ```

    plot2by.m

    % Plot a2 by 2 system as straight lines

    x = -2:5;

    y1 = -0.5 * x + 1;

    y2 = -x + 3;

    plot(x,y1,x,y2)

    axis((-2 5 -4 6 ))

    xlabel(''x'')

    ylabel(''y'')

    title(''Visualize 2 x 2 system'')

    ```


    The intersection of the lines is the point (4, -1). In other words, x = 4 and
    y = -1. Changing back to x1 and x2, we have x1 = 4 and x2 = -1. This allows us
    to visualize the solution.'
