  md: "# THE PROGRAMMING CONCEPT\n\nTo loop from the smaller value to the larger,\
    \ we would first have to compare their values and exchange them if necessary.\n\
    \n```\nprodMToN.m\nfunction runprod = prodMToN(m, n)\n% prodMToN returns the product\
    \ of m:n\n% using a for loop\n% Format: prodMToN(m,n) or prodMToN(n,m)\n\n% Make\
    \ sure m is less than n\nif m > n\n    temp = m;\n    m = n;\n    n = temp;\n\
    end\n\n% Loop to calculate the running product\nrunprod = 1;\nfor i = m:n\n  \
    \  runprod = runprod * i;\nend\n```\n\n# THE EFFICIENT METHOD\n\nInstead of exchanging\
    \ the values of m and n, we could use the colon operator with steps of either\
    \ +1 or -1 to create a vector. Also, instead of looping to calculate a running\
    \ product, we could use the prod function.\n\n```\nprodMToNii.m\nfunction outprod\
    \ = prodMToNii(m, n)\n% prodMToNii returns the product of m:n\n% using : and prod\n\
    % Format: prodMToNii(m, n) or prodMToNii(n,m)\n\nif m < n\n    outprod = prod(m:n);\n\
    else\n    outprod = prod(m:-1:n);\nend\n```"
