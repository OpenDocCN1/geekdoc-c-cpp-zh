    # **Example: Load from a file and plot the data**


    As an example, a file called timemp stores two lines of data. The first line is
    the times of day, and the second line is the recorded temperature at each of those
    times. The first value of 0 for the time represents midnight. For example, the
    contents of the file might be:


    ```

    0 3 6 9 12 18 21

    55.5 52.4 52.6 55.7 75.6 70.3 66.6

    ```


    The following script loads the data from the file into a matrix timemp. It then
    separates the matrix into vectors for the time and temperature, and then plots
    the data using black star (*) symbols.


    ```

    timempprob.m

    % This reads time and temperature data for an afternoon

    % from a file and plots the data


    load timemp.dat


    % The times are in the first row, temps in the second row

    time = timemp(1,:);

    temp = timemp(2,:);


    % Plot the data and label the plot

    plot(time, temp, ''k*'')

    xlabel(''Time'')

    ylabel(''Temperature'')

    title(''Temperatures one afternoon'')

    ```


    Running the script produces the plot seen in Figure 2.5.


    To create the data file, the Editor in MATLAB can be used; it is not necessary
    to create a matrix and save it to a file. Instead, just enter the numbers in a
    new file, and Save As timemp.dat.'
