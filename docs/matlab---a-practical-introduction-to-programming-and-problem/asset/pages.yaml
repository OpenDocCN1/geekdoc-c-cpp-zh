  md: '# SUMMARY


    Common Pitfalls


    +   - Putting arguments to strfind in incorrect order (the order matters for strfind
    but not for findstr).

    - Confusing sprintf and fprintf. The syntax is the same, but sprintf creates a
    string where fprintf prints.

    - Trying to create a vector of strings with varying lengths (the easiest way is
    to use strcat or char, which willll pad with extra blanks automatically).

    - Forgetting when using strtok, the second argument (the "rest" of the string)
    contains the delimiter.

    - When breaking a string into pieces, forgetting to convert the numbers in the
    strings to actual numbers that can be used in calculations.


    # Programming Style Guidelines


    +   - Trim trailing blanks from strings stored in matrices before using.

    - Make sure that the correct string comparison function is used; for example,
    use strncmp if ignoring case is desired.


