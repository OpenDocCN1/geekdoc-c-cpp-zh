    Thus far, every function has been stored in a separate M-file. However, it is
    possible to have more than one function in a given M-file. For example, if one
    function calls another, the (calling) function would be the primary function,
    and the function that is called a subfunction. These functions would both be stored
    in the same M-file, first the primary function and the subfunction. The name of
    the M-file would be the same as the name of the primary function, to avoid confusion.


