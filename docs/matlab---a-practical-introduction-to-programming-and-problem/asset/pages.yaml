  md: '# 2.5 SCRIPTS TO PRODUCE AND CUSTOMIZE SIMPLE PLOTS


    MATLAB has many graphing capabilities. Customizing plots is often desired and
    this is easiest to accomplish by creating a script rather than typing one command
    in the Command Window. For that reason, simple plots and how to customize them
    will be introduced in this chapter on MATLAB programming.


    Typing help will display the help topics that contain graph functions, including
    graph2d and graph3d. Typing help graph2d would display some of the two-dimensional
    graph functions, as well as functions to manipulate the axes and to put labels
    and titles on the graphs.


    # 2.5.1 The plot function


    For now, we''ll start with a very simple graph of one point using the plot function.

    The following script, plotoneepoint, plots one point. To do this, first values
    are given for the x and y coordinates of the point in separate variables. The
    point is plotted using a red star (*). The plot is then customized by specifying
    the minimum and maximum values on the first x and then y. Labels are then put
    on the x-axis, the y-axis, and the graph itself using the function xlabel, ylabel,
    and title.


    All of this can be done from the Command Window, but it is much easier to use
    a script. The following shows the contents of the script plotonepoint accomplishes
    this. The x coordinate represents the time of day (e.g, 11am) and the y coordinate
    represents the temperature in degrees Fahrenheit at that time.


    ```

    plotonepoint.m

    % This is a really simple plot of just one point!

    % Create coordinate variables and plot a red ''*''

    x = 11;

    y = 48;

    plot(x,y,''r'')


    % Change the axes and label them

    axis([9 12 35 55])

    xlabel(''Time'')

    ylabel(''Temperature'')


    % Put a title on the plot

    title(''Time and Temp'')

    ```'
