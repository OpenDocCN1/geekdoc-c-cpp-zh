  md: '# Basic Statistics, Sets, Sorting, and Indexing


    # KEY TERMS


    | mean | harmonic mean | ascending order |

    | sorting | geometric mean | descending order |

    | index vectors | standard deviation | selection sort |

    | searching | variance | sequential search |

    | arithmetic mean | mode | key |

    | average | median | binary search |

    | outlier | set operations | |


    # CONTENTS


    +   13.1 Statistical Functions......402


    +   13.2 Set Operations........408


    +   13.3 Sorting......412


    +   13.4 Index Vectors......419


    +   13.5 Searching......422


    There are a lot of statistical analyses that can be performed on data sets. In
    the MATLAB® software, the statistical functions are in the data analysis help
    called datafun.


    In general, we will write a set of $n$ values as


    ```

    $x = \{x_1, x_2, x_3, x_4, \dots, x_n\}$

    ```


    In MATLAB, this will generally be represented as a row vector $x$.


    Statistics can be used to characterize properties of a data set. For example,
    consider a set of exam grades $[33, 75, 77, 82, 83, 85, 91, 100]$. What is a "normal,"
    "expected," or "average" exam grade? There are several ways that this could be
    interpreted. Perhaps the most common is the "mean grade, which is found by summing
    the grades and dividing by the number of them (the result of that would be 79).
    Another way of interpreting the grade found most often, which would be 85. Also,
    the value in the middle of the list, 83, could be used. Another property that
    is useful to know how spread out the values are within the data set.'
  merge: -1
  pgno: 409
