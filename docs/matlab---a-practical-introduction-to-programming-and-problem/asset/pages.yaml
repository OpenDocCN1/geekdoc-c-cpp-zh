    7.7775

    ```


    # 13.1.2 Variance and standard deviation


    The standard deviation and variance are ways of determining the spread of the
    data. The variance is usually defined in terms of the arithmetic mean:


    ![](img/106804b84dd25648ed57173c2c911b77_414_1.png)


    Sometimes, the denominator is defined as $n$ rather than $n-1$. The default definition
    in MATLAB uses $n-1$ for the denominator, so we will use that here.


    For example, the vector $[8, 7, 5, 4, 6]$, there are $n=5$ values so $n-1$ is
    4. Also, the mean of this data is 6. The variance would be


    ![](img/106804b84dd25648ed57173c2c911b77_414_2.png)


    The built-in function to calculate the variance is called var:


    ```

    >> xvals = [8 7 5 4 6];

    >> myvar = var(xvals)

    myvar =

    2.5000

    ```


    The standard deviation is the square root of the variance:


    ![](img/106804b84dd25648ed57173c2c911b77_414_3.png)


    The built-in function in MATLAB for the standard deviation is called std; the
    standard deviation can be found either as the $sqrt$ of the variance, or using
    std:


    ```

    >> shortx = [2 5 1 4];

    >> myvar = var(shortx)

    myvar =

    3.3333

    ```'
