- img_proc: true
  md: '# 15.1.1 Polynomials


    Simple curves are polynomials of different degrees or orders. The degree is the
    integer of the highest exponent in the expression.


    +   - A straight line is a first-order (or degree 1) polynomial of the form ax
    + b, more explicitly ax¹ + b.

    - Quadratic is a second-order(or degree 2) polynomial of the form ax² + bx + c.

    - A cubic (degree 3) is of the form ax³ + bx² + cx + d.


    MATLAB represents a polynomial as a row vector of coefficients. For example, the
    polynomial x³ + 2x² - 4x + 3 would be represented by the vector [1 2 -4 3]; the
    2x - x⁵ would be represented by [2 0 -1 0 5]; note the zero terms for x⁴ and x.


    The built-in functions sym2poly and poly2sym convert from symbolic expressions
    to polynomial vectors and vice versa. For example:


    ```

    >> myp = [1 2 -4 3];

    >> poly2sym(myp)

    ans =

    x^3+2*x²-4*x+3

    >> mypoly = [2 0 -1 0 5];

    >> poly2sym(mypoly)

    ans =

    2*x⁴-x²++5

    ```


    ```

    >> sym2poly(ans)

    ans =

    2 0 -1 0 5

    ```


    The roots function in MATLAB can be used to find the roots of an equation represented
    by a polynomial. For example, for the mathematical function


    ```

    f(x) = 4x - 2x² + 8x - 3

    ```


    to solve the equation f(x)=


    ```

    >> roots([4 -2 8 -3])

    ans =

    1.3660

    1.5000

    0.3660

    ```


    The function polyval will evaluate a polynomial p at x; the form is polyval(p,x).
    For example, the polynomial -2x² + x + 4 is evaluated at x = 3, which yields -2
    * 9 + 3 + 4, or -11:


    ```

    >> p = [-2 1 4];

    >> polyval(p,3)

    ans =

    -11

    ```


    Note

    This is a mathematical expression, not MATLAB!'
