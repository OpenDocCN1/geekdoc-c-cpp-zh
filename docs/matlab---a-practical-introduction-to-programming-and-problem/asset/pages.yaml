    # 6.3 APPLICATION: MENU-DRIVEN MODULAR PROGRAM


    Many, more involved programs that have interaction with the user are menu-driven,
    which means that the program presents a menu of choices and continues to loop
    through the menu choices until the user chooses to end the program. A modular
    menu-driven program would typically have a function that presents the menu and
    the user''s choice, as well as functions to implement the action for each choice.
    These functions may have subfunctions. Also, the functions would error-check all
    user input.


    As an example of a menu-driven program, we will write a program to explore the
    constant e.


    The constant e, the natural exponential, is used extensively in mathematics and
    engineering. There are many diverse applications of this constant. The value of
    the constant e is approximately 2.718.... Raising e to the power of x, or e^x,
    is common that this is the exponential function. In MATLAB, as we have seen, there
    is a function for this, exp.'
