  md: "# CHAPTER 3 Selection Statements\n\nIf statements can be entered in the Command\
    \ Window, although they generally make more sense in scripts or functions. In\
    \ the Command Window, the if line would be entered, followed by the Enter key,\
    \ the action, the Enter key, and finally end end. The results immediately follow.\
    \ For example, the preceding if statement is shown twice:\n\n```\n>> num = -4;\n\
    >> if num < 0\n    num = abs(num)\n    end\nnum =\n4\n\n>> num = 5;\n>> if num\
    \ < 0\n    num = abs(num)\n    end\n```\n\nNote that the output from the assignment\
    \ is not suppressed, so the result of the action will be shown if the action is\
    \ executed. The first time the value of the variable is negative the action is\
    \ executed and the variable is modified, but in the second case the variable is\
    \ positive so the action is skipped.\n\nThis may be used, for example, to make\
    \ sure that the square root function is not used on a negative number. The following\
    \ script prompts the user for a number, and prints the square root. If the user\
    \ enters a negative number, the if statement changes it to positive before taking\
    \ the square root.\n\n```\nsqrtifexam.m\n% Prompt the user for a number and print\
    \ its sqrt\nnum = input('Please enter a number: ');\n% If the user entered a negative\
    \ number, change it\nif num < 0\n    num = abs(num)\nend\nprintf('The sqrt of\
    \ %.1f is %.1f\\n',num,sqrt(num))\n```\n\nHere are two examples of running this\
    \ script:\n\n```\n>> sqrtifexam\nnPlease enter a number: -4.2\nThe sqrt of 4.2\
    \ is 2.0\n\n>> sqrtifexam\nPlease enter a number: 1.44\nThe sqrt of 1.4 is 1.2\n\
    ```"
