    vector variables. That is, the values within a row are separated by either spaces
    or commas, and the different rows are separated by semicolons. For example, the
    matrix mat* is created by explicitly typing values:


    ```

    >> mat = [4 3 1; 2 5 6]

    mat =

    4 3 1

    2 5 6

    ```'
