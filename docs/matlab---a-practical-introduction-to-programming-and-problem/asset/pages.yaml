  md: "# 10.5 Recursive Functions\n\nWe have already seen the built-in function factorial\
    \ in MATLAB to calculate factorials, and we have seen how to implement the iterative\
    \ definition using a running product. Now we will instead write a recursive function\
    \ called fact. The function will receive an integer n, which we for simplicity\
    \ assume a positive integer, and will calculate n! using the recursive definition\
    \ given previously.\n\n```\nfact.m\nfunction facn = fact(n)\n% fact recursively\
    \ finds n!\n% Format: facn(n)\nif n == 1\n  facn = 1;\nelse\n  facn = n * fact(n\
    \ - 1);\nend\nend\n```\n\nThe function calculates one value, using an if-else\
    \ statement to choose between the base and general cases. If the value passed\
    \ to the function is 1, the function returns 1 since 1! is equal to 1. Otherwise,\
    \ the general case applies. According to the definition, the factorial of n, which\
    \ is what this function is calculating, is defined as n multiplied by the factorial\
    \ of (n-1). So the function assigns n*(n-1) to the output argument.\n\nHow does\
    \ this work? Exactly the example we sketched above for 2! and 3!. Let's trace\
    \ what happens if the higher is passed to the function:\n\n```\nfact(3) tries\
    \ to assign 3 * fact (2)\nfac(2) tries to assign 2 * fact (1)\nfact(1) assigns\
    \ 1\nfac(2) assigns 2\n```\n\nWhen the function is called, 3 is not equal to 1,\
    \ so the statement\n\n```\nfacn = n * fact(n - 1);\n```\n\nis executed. This will\
    \ assign the value of 3 * fact(2) to facn, but this expression cannot be evaluated\
    \ yet and a value cannot be assigned because the first value of fact(2) must be\
    \ found.\n\nThus, the assignment statement has been interrupted by a recursive\
    \ call to the fact function. The function calls fact(2) in an attempt to assign\
    \ 2 * fact(1), but again this expression cannot be evaluated yet. Next, to the\
    \ function fact(1) results in a complete execution of an assignment statement\
    \ since it assigns 1. Once the base case has been reached, the assignment statements\
    \ that were interrupted evaluated, in the reverse order."
