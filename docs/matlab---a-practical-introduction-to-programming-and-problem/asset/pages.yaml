  md: "# # Vectorized Code\n\n+   * vectorizing - array operations logical indexing\n\
    * scalar operations - logical vectors\n\nAlthough loops are extremely useful in\
    \ most programming applications and necessary in many languages, in the MATLAB®\
    \ software they are frequently not necessary when dealing with vectors or matrices.\
    \ In this chapter, the concept of **vectorizing** will be introduced, which is\
    \ the term used in MATLAB for rewriting code that was written using constructs\
    \ such as loops in a traditional programming language and instead taking advantage\
    \ of array operations in MATLAB. The vectorized code is faster and easier for\
    \ the programmer to write, and in many cases, is also faster for MATLAB to execute.\n\
    \n# ## 5.1 LOOPS WITH VECTORS AND MATRICES\n\nIn most programming languages when\
    \ performing an operation on a vector, for loop is to loop through the entire\
    \ vector, using the loop variable as the index into the vector. In general, in\
    \ MATLAB, assuming there is a variable *vec*, the indices range from 1 to the\
    \ length of the vector:\n\n```\nmatlab\nfor i = 1:length(vec)\n    % do something\
    \ with vec(i)\nend\n```\n\nFor example, let's say we want to multiply every element\
    \ of a vector $\nu$ by 3, and store the result in $\nu$, where $\nu$ is initialized\
    \ as follows:\n\n```\n>> v = [3 7 2];\n```\n\nMATLAB: A Practical Introduction\
    \ to Programming and Problem Solving\n© 2012 Elsevier Inc. All rights reserved."
  merge: -1
  pgno: 169
- img_proc: true
  md: "# THE PROGRAMMING CONCEPT\n\nTo accomplish this, we can loop through all of\
    \ the elements in the vector and multiply element by 3. In the following, the\
    \ output is suppressed in the loop, and then the resulting vector is:\n\n```\n\
    >> for i = 1:length(v)\n    v(i) = v(i) * 3;\nend\n>> v\nv=\n    9 21 6 3\n```\n\
    \nSimilarly, for an operation on a matrix, a nested loop would be required, and\
    \ the loop variables over the rows and columns are used as the subscripts into\
    \ the matrix. In general, assuming a matrix variable mat, we use size to return\
    \ the number of rows and columns and use these variables in the for loops:\n\n\
    ```\n[ r c ] = size(mat);\nfor row = 1:r\n    for col = 1:c\n        % doing something\
    \ with mat(row,col)\n    end\n\n```\n\nTypically, this is not necessary in MATLAB!!\n\
    \n# 5.2 OPERATIONS ON VECTORS AND MATRICES\n\nNumerical operations can be done\
    \ on entire vectors or matrices. For example, let's say we want to multiply every\
    \ element of a vector v by 3 as in the previous section.\n\n# THE EFFICIENT METHOD\n\
    \nIn MATLAB, we can simply multiply v by 3 and store the result back in v in an\
    \ assignment statement:\n\n```\n>> v = v*3\nv=\n    9 21 6 3\n```\n\nAs another\
    \ example, we can divide every element by 2:\n\n```\n>> v = [3 2 1];\n>> v/2\n\
    ans=\n    1.5000    3.5000    1.0000    0.5000\n```"
  merge: -1
  pgno: 170
- img_proc: true
  md: "# 5.2 Operations on Vectors and Matrices\n\nFor a matrix, numerical operations\
    \ can also be performed on every element. For example, to multiply every element\
    \ in a matrix by 2 with most languages involve a nested loop, but in MATLAB it\
    \ is automatic.\n\n```\n>> mat = [4:6; 3:-1]\nmat =\n    4 5 6\n    3 2 1\n>>\
    \ mat * 2\nans =\n    8 10 12\n    6 4 2\n```\n\nThese **scalar operations**;\
    \ we are multiplying element in a vector or matrix by a scalar, or dividing every\
    \ element in a vector or matrix by a scalar.\n\n**Array operations** are operations\
    \ that are performed on vectors or matrices by term, or by element. This means\
    \ that the two arrays (vectors or matrices) must be the same size to begin with.\
    \ The following examples demonstrate the array addition and subtraction operators.\n\
    \n```\n>> v1 = 2:5\nv1 =\n    2 3 4 5\n>> v2 = [33 11 5 1]\nv2 =\n    33 11 5\
    \ 1\n>> v1 + v2\nans =\n    35 14 9 6\n```\n\n```\n>> mata = [5:8; 9:-2:3]\nmata\
    \ =\n    5 6 7 8\n    9 7 5 3\n>> matb = reshape(1:8,2,4)\nmatb =\n    1 3 5 7\n\
    \    2 4 6 8\n>> mata - matb\nans =\n    4 3 2 1\n    7 3 -1 -5\n```\n\nHowever,\
    \ for an operation that is based on multiplication (which means multiplication,\
    \ division, and exponentiation), a dot must be placed in front of the operator\
    \ for array operations. For example, the exponentiation operator, ^ must be used\
    \ when working with vectors and matrices, rather than just the ^ operator. Squaring\
    \ a vector, for example, means multiplying each element by itself, so the.^ operator\
    \ must be used."
  merge: -1
  pgno: 171
