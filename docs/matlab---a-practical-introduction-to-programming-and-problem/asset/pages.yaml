- img_proc: true
  md: '# 15.4 CALCULUS: INTEGRATION AND DIFFERENTATION


    MATLAB has functions that perform common calculus operations on a mathematical
    function f(x), such as integration and differentiation.


    # 15.4.1 Integration and the trapezoidal rule


    The integral of a function f(x) between the limits given by x = a and x = b is
    written as


    > $$\int_a^b f(x)dx$


    and is defined as the area under the curve f(x) from a to b, as long as the function
    is above the x-axis. Numerical integration techniques involve approximating.


    One simple method of approximating the area is to draw a straight line from f(a)
    to f(b) and calculate the area of the resulting trapezoid as


    > $$(b - a) \frac{f(a) + f(b)}{2}$


    In MATLAB, this could be implemented as a function.


    # THE PROGRAMMING CONCEPT


    Here is a function to which the function handles and limits a and b are passed:


    ```

    trapint.m

    function int = trapint (fnh, a, b)

    % trapint approximates area under a curve f(x)

    % from a to b using a trapezoid

    % Format: trapint (handle of f, a, b)

    int = (b-a) * (fnh(a) + fnh(b))/2

    end

    ```


    To call it, for example, for the function f(x) = 3x^2 - 1, an anonymous function
    is given and its handle is passed to the trapint function.


    ```

    >> f = @ (x) 3 * x.^ 2 - 1;

    approximint = trapint(f, 2, 4)

    approximint =

    58

    ```'
  merge: -1
  pgno: 501
- img_proc: true
  md: '# THE EFFICIENT METHOD


    MATLAB has a built-in function trap that will implement the trapezoidal rule.
    Vectors with the values of x and y = f(x) are passed to it. For example, using
    the anonymous function previously:


    ```

    >> x = [2 4];

    >> y = f(x);

    >> trapz(x,y)

    ans =

    58

    ```


    An improvement on this is to divide the range from a to b into n intervals, apply
    the trapezoidal rule to each interval, and sum them. For example, if the preceding
    if there are two intervals, you would draw a straight line from f(a) to f((a+b)/2),
    and then from f((a+b)/2) to f(b).


    # THE PROGRAMMING CONCEPT


    The following is a modification of the previous function to which the function
    handle, limits, and the number of intervals are passed:


    ```

    trapintn.m

    function intsum = trapintn(fnh,lowrange,highrange, n)

    % trapintn approximates area under a curve f(x) from

    % a to b using a trapezoid with n intervals

    % Format: trapintn(handle of f, a, b, n)

    intsum = 0;

    increm = (highrange - lowrange)/n;

    for a = lowrange: highrange - increm

    b = a + increm;

    intsum = intsum + (b-a) * (fnh(a) + fnh(b))/2;

    end

    end

    ```


    For example, this approximates the integral of the previous function that is given
    with two intervals:


    ```

    >> trapintn(f,2,4,2)

    ans =

    55

    ```'
  merge: -1
  pgno: 502
