    # 7.2.5 Comparing strings


    There are several functions that compare strings and return logical true if they
    are equivalent, or logical false not. The function strcmp compares strings, character
    by character. Returns true if the strings are completely identical (which infers
    they must be of the same length, also) or logical false if the strings are not
    the same length or corresponding characters are not identical. Note that for strings,
    these functions are used to determine whether strings are equal to each other
    or not, the equality operator ==. Here are some examples of these comparisons:


    ```

    >> word1 = ''cat'';

    >>word2 = ''car'';

    >>word3 = ''cathedral'';

    >>word4 = ''CAR'';

    >> strcmp(word1,word2)

    ans =

    0

    ```


