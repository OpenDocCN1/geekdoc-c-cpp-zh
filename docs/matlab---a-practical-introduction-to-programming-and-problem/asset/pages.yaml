    is ''a'', so the general form of the fopen would be:


    ```

    fid = fopen(''filename'', ''a'');

    ```


    Then, using fprintf (typically in a loop), we would write to the file starting
    at the end of the file. The file would then be closed using fclose. What is written
    to the end of the file doesn''t have to be in the same format as what is in the
    file when appending.


