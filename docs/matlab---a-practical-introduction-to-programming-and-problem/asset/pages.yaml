  md: "# 13.5.1 Sequential search\n\nA sequential search is accomplished by looping\
    \ through the vector element by element starting from the beginning, looking for\
    \ the key. Normally the index of the element in which the key is found is what\
    \ is returned. For example, here is a function that searches for a key and returns\
    \ the index or the value 0 if the key is not found:\n\n```\nseqsearch.m\nfunction\
    \ index = seqsearch(vec, key)\n% seqsearch performs an inefficient sequential\
    \ search\n% through a vector looking for a key; returns the index\n% Format: seqsearch(vector,\
    \ key)\n\nlen = length(vec);\nindex = 0;\n\nfor i = 1:len\n    if vec(i) == key\n\
    \        index = i;\n    end\nend\nend\n```\n\nHere are two examples of calling\
    \ this function:\n\n```\n>> values = [85 70 100 95 80 91];\n>> key = 95;\n>> seqsearch(values,\
    \ key)\nans =\n4\n\n>> seqsearch(values, 77)\nans =\n0\n```\n\nThis example assumes\
    \ that the key is found only in one element in the vector. Also, although it works,\
    \ it is not a very efficient algorithm. If the vector is large, and the key is\
    \ found in the beginning, this loops through the rest of the vector. An improved\
    \ version would loop until the key is found or the entire vector has been searched.\
    \ In other words, a while loop is used rather than a for loop; there are two paths\
    \ to the condition:\n\n```\nsmartseqsearch.m\nfunction index = smartseqsearch(vec,\
    \ key)\n% Smarter sequential search; searches a vector\n% for a key but ends when\
    \ it is found\n% Format: smartseqsearch(vector, key)\n```\n\nContinued"
