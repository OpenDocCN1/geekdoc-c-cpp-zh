    # 4.3.1 Multiple conditions in a while loop


    In the `factigh` function, the `while` loop consisted of one expression, which
    tested whether or not the variable `fac` was less than or equal to the variable
    `high`. In many cases, however, the condition will be more complicated than that
    and could use either the `or` operator `||` or the `and` operator `&&`. For example,
    it may be that it is desired to stay in a `while` loop as long as a variable $x$
    is in a particular range:


    ```

    while x >= 0 && x <= 100

    ```


    Another example, continuing the action of a loop may be desired as long as least
    one of two variables is in a specific range:


    ```

    while x < 50 || y < 100

    ```


    # 4.3.2 Reading from a file in a while loop


    The following example illustrates reading from a data file using a `while` loop.
    Data from an experiment has been recorded in a file called `experd.dat`. The file
    has some numbers from $-99$, then more numbers, all on the same line. The only
    data values that we are interested in, however, are before $-99$.


    The algorithm for the script will be:


    +   1. Read the data from the file into a vector.

    2. Create a new vector variable `newvec` that only has the data values up to but
    including $-99$.

    3. Plot the new vector values, using black circles.


    For example, if the file contains the following:


    ```

    3.1 11 5.2 -99 4.4 62

    ```


    the produced plot would look like Figure 4.1.


    For simplicity, we will assume that the file format is as specified. Using `load`
    will create a vector with the name `experd`, which contains the values from the
    file. Also, since this is generic data we will omit the plot labels for simplicity.


    ![](img/106804b84dd25648ed57173c2c911b77_155_0.png)


    FIGURE 4.1 Plot of some (but not all) data from a file'
