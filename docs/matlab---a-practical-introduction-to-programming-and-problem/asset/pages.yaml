    # 8.2.4 Vectors of structures


    In many applications, including database applications, information would normally
    be stored in a vector of structures, rather than individual structure variables.
    For example, if the Computer Super Mart is storing information on all of the software
    packages it sells. It would likely be in a vector of structures such as the following:


    packages


    | item_no | cost | price | code |

    |---|---|---|---||

    | 1 | 123 | 19.99 | 39.95 | g |

    | 2 | 456 | 5.99 | 49.99 | l |

    | 3 | 587 | 11.11 | 33.33 | w |


    In this example, packages is a vector that has three elements. It is shown as
    a column vector. Each element is a structure consisting of four fields: item_no,
    cost, price, and code. It may look like a matrix, which has rows and columns,
    but it is instead a vector of structures.


    This vector of structures can be created several ways. One method is to create
    a structure variable, as shown earlier, to store information on one software package.


    This can be expanded to a vector of structures.


    ```

    >> packages = struct(''item_no'',123,''cost'',19.99,\n''price'',39.95,''code'',''g'');

    >> packages(2) = struct(''item_no'',456,''cost'',5.99,\n''price'',49.99,''code'',''l'');

    >> packages(3) = struct(''item_no'',587,''cost'',11.11,\n''price'',33.33,''code'',''w'');

    ```


    The first assignment shown here creates the first structure in the structure vector,
    the next one creates the second structure, and so on. This actually creates a
    1 × 3 row vector.'
