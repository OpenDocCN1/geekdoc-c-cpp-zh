  md: '# 7.2.6 Finding, replacing, and separating strings


    There are functions that find and replace, or parts of strings, within other strings
    and functions that separate strings into substrings.


    The function **findstr** receives two strings as input arguments. It finds all
    occurrences of the shorter string within the longer, and returns the subscripts
    of the beginning of the occurrences. The order of the strings does not matter
    with **findstr** it will always find the shorter string within the longer, whichever
    that is. The shorter string can consist of one character, or any number of characters.
    If there is more than one occurrence of the shorter string **findstr** returns
    a vector with all indices. Note that is returned is the index of the beginning
    of the shorter string.


    ```

    >> findstr(''abcde'', ''d'')

    ans =

    4

    ```


    ```

    >> findstr(''d'', ''abcde'')

    ans =

    4

    ```


    ```

    >> findstr(''abcde'', ''bc'')

    ans =

    2

    ```


    ```

    >> findstr(''abcdeabcddedd'', ''d'')

    ans =

    4 9 11 12

    ```


    The function **strfind** does essentially the same thing, except that the order
    of the arguments makes a difference. The general form is **strfind(string, substring)**;
    it finds all occurrences of the substring within the string, and returns the subscripts.


    ```

    >> strfind(''abcdeabcde'', ''e'')

    ans =

    5 10

    ```


    For both **strfind** and **findstr**, if there are no occurrences, the empty vector
    is returned.


    ```

    >> strfind(''abcdeabcde'', ''ef'')

    ans =

    []

    ```'
