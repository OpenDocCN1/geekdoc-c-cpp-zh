  md: 'An example of calling the function:


    ```

    >> myveccumsum({5 4})

    ans = 5 14 18

    ```


    The first time in the loop, outvec will be [5]. Then the second time runsum will
    be 14 and outvec will store [5 14]. Finally, runsum will be 18 and outvec will
    store [5 14 18].


    Although the previous method works, it is inefficient. What happens is every time
    a vector is extended, a new “chunk” of memory must be found that is large enough
    for the new vector, and all the values must be copied from the original location
    in memory to the new one. This can take a long time to execute.


    A better method involves referring to each index in the output vector, and placing
    each partial sum into the next element in the output vector. As each value of
    vec(i) is added to the running sum, this new sum is stored in outvec(i).


    ```

    myveccumsum.m

    function outvec = myveccumsum(vec)

    % myveccumsum imitates cumsum for vector

    % It preallocates the output vector

    % Format: myveccumsum(vec)

    noutvec = zeros(size(vec));

    runsum = 0;

    for i = 1:length(vec)

    runsum = runsum + vec(i);

    outvec(i) = runsum;

    end

    end

    ```


    Although initializing the output vector outvec to all zeros is not strictly necessary,
    it greatly improves the efficiency of the function. Initializing this vector to
    all zeros with the same size as the input argument preallocates much memory for
    outvec. Then, each element is changed in the correct order in the loop to get
    its value.


    MATLAB has many other functions that work with vectors. Many of these functions,
    which are statistical in nature, will be seen in Chapter 13.


    # PRACTICE 4.2


    Write a function that mimics the cumprod function. Use the method of preallocating
    the output vector.'
