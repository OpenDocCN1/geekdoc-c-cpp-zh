    # 3.3 THE IF-ELSE STATEMENT


    The if statement chooses whether or not an action is executed. Choosing between
    two actions, or choosing from several actions, is accomplished using if-else,
    if, and switch statements.


    The if-else statement is used to choose between two statements, or sets of statements.
    The general form is:


    ```

    if condition

    action1

    else

    action2

    end

    ```


    First, the condition is evaluated. If it is true, then the set of statements designated
    as "action1" is executed, and that the if-else statement. Instead the condition
    is false, the set of statements designated as "action2" is executed, and that
    is the end of the if-else statement. The first set of statements ("action1") is
    called the action of the if; it is what will be executed if the expression is
    true. The second set of statements ("action2") is called the else clause; it is
    what will be executed if false, and only one, will be executed—which depends on
    the value of the condition.'
