  md: "error message is generated when it attempts to refer to the fourth element.\
    \ Note that the script gives an explanation of the error, and it gives the line\
    \ number in the script in which the error occurred.\n\n```\n>> runtimeEx\n3\n\
    5\n??? Attempted to access vec(4); index out of bounds because\numel(vec) = 3.\n\
    ```\n\n```\nError in =>runtimeEx at 6\ndisp(vec(i))\n```\n\nLogical errors are\
    \ more difficult to locate, because they do not result in any error message. A\
    \ logical error is a mistake in reasoning by the programmer, but it is not a mistake\
    \ in the programming language. An example of a logical error would be dividing\
    \ by 25 instead of multiplying to convert inches to centimeters. The results printed\
    \ or returned could be incorrect, which might be obvious.\n\nAll programs should\
    \ be robust and should wherever anticipate potential errors, and guard against\
    \ them. whenever there is input into a program, the program should error-check\
    \ and make sure that the input is in the correct range of values. Also, before\
    \ dividing, any denominator should be checked to make sure it is not zero.\n\n\
    Despite the best precautions, there are bound to errors in programs.\n\n# 6.5.2\
    \ Tracing\n\nMany times, when a program has loops and selection statements is\
    \ not running properly, it is useful in the debugging process to know exactly\
    \ which statements have been executed. For example, following is a function that\
    \ attempts to display “In middle of range” if the argument is passed to it in\
