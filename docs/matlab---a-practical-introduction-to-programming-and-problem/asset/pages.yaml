    ```


    can be used to simulate this, where $N_0$ is the original population, $N$ is the
    population at time $t$, and $T$ is the time it takes for the population to double.
    Use the **solve** function to determine the following: If $N_0 = 10^6$, $N = 10^8$,
    and $t = 8$ hours, will be the doubling time $T$? Use **double** to get your result
    in hours.


    +   33. Using the symbolic function **int**, find the indefinite integral of the
    function $4x^2 + 3$, and the definite integral of this function from $x = -1$
    to $x = 3$. Also, approximate this using the **trapz** function.


    +   34. Use the **quad** function to approximate the area under the curve $4x^2
    + 3$ from $-1$ to $3$.


    First, create an anonymous function and pass its handle to the **quad** function.


    +   35. Use the **polyder** function to find the derivative of $2x^3 - x^2 + 4x
    - 5$.'
