  md: '# Preface


    files and also .mat files that store MATLAB variables are introduced. Cell arrays
    and string functions are used extensively in this chapter.


    Chapter 10: Advanced Functions covers more advanced features of types of functions
    such as anonymous functions, nested functions, and recursive functions. Function
    handles and use with anonymous functions and function functions are introduced.
    The concept of having a variable number of input and/or output arguments to a
    function is introduced; this is implemented using cell arrays. String functions
    are also used in several examples in this chapter. The section on recursive functions
    is at the end and may be omitted.


    Part II, Advanced Topics for Problem Solving with MATLAB, contains the following
    chapters.


    Chapter 11: Advanced Plotting Techniques continues with more on the plot functions
    introduced in Chapter 2. Various two-dimensional plot types, such as pie charts
    and histograms, are introduced, as customizing plots using cell arrays and string
    functions. Three-dimensional plot functions as well as selected functions that
    create the coordinates of specified objects are demonstrated. The notion of Handle
    Graphics is covered, and selected graphics properties, as line width and color,
    are introduced. Applications that involve reading data from files and then plotting
    using cell arrays and string functions.


    Chapter 12: Matrix Representation of Algebraic Equations introduces a basic method
    that can be used in MATLAB to solve systems of equations using a matrix representation.
    First, matrix and vector operations and matrix definitions are described. This
    section can cover at any point after Chapter 5. Then, matrix solutions using the
    Gauss-Jordan and Gauss-Jordan elimination methods are described. This section
    also includes the MATLAB functions that implement them.


    Chapter 13: Basic Statistics, Sets, Sorting, and Indexing starts with some of
    those that require a built-in data set, methods of sorting are described. Finally,
    the concepts of indexing into a vector and searching a vector are introduced.
    Sorting a vector of structures and indexing into a vector of structures are described,
    but these sections can be omitted. A recursive binary search function is in the
    end and may be omitted.


    Chapter 14: Sights and Sounds briefly discusses sound and introduces image processing.
    An introduction to programming graphical user interfaces is also given, including
    the creation of a button group. Nested functions are used in the GUI examples.
    A patch function example uses structure.


    Chapter 15: Advanced Mathematics covers three basic topics: curve fitting, complex
