  md: "Additionally, MATLAB has the functions cumsum and cumprod that return a vector\
    \ of the running sums or products. For example, for the following vector the first\
    \ value is 5, so is that the first value in the vector returned by cumsum. The\
    \ next value is 9 so 5 + 9 is 14, and finally 14 + 4 is 18.\n\n```\n>> vec = [5\
    \ 9 4];\n>> cumsum(vec)\nans =\n```\n\n```\n5 14 18\n```\n\nSince vec is a row\
    \ vector, the result is also a row vector; passing a column vector to cumsum would\
    \ result in a column vector. The cumulative function cumprod instead calculates\
    \ 5, 5 * 9, and finally 5 * 9 * 4:\n\n```\n>> cumprod(vec)\nans =\n```\n\n```\n\
    5 45 180\n```\n\nThe cumsum and cumprod functions will return a vector with the\
    \ same dimensions as the input vector.\n\n# Preallocating a vector\n\nThere are\
    \ essentially two programming methods that could be used to simulate the cumsum\
    \ function. One method is to start with an empty vector and concatenate each running\
    \ sum to the vector. Extending a vector, however, is very inefficient. A better\
    \ method is to preallocate the vector to the correct size and then change the\
    \ value of each element to successive running sums. Both methods will be shown\
    \ here.\n\nIn the following function, the output argument is initialized to the\
    \ vector[]. Every time the next element in the vector is added to the running\
    \ sum, this sum is concatenated to the end of the vector.\n\n```\nmyvecsum.m\n\
    function outvec = myvecsum(vec)\n% myvecsum simulates cumsum for a vector\n% Format:\
    \ myvecsum(vector)\n\noutvec = [];\nrunsum = 0;\nfor i = 1:length(vec)\n  runsum\
    \ = runsum + vec(i);\n  outvec = [outvec, runsum];\nend\n```"
