    # 1.6 VECTORS AND MATRICES\n\n**Vectors** and **matrices** are used to store sets\
    \ of values, all of which are the same type. A vector can be either a *row vector*\
    \ or a *column vector*. A matrix can be visualized as a table of values. The dimensions\
    \ of a matrix are $r \times c$, where $r$ is the number of rows and $c$ is the\
    \ number of columns. This is pronounced “$r$ by $c$”. If a vector has $n elements,\
    \ a row vector would have the dimensions $1 \times n$, and a column vector would\
    \ have the dimensions $n \times 1$.\n\nA *scalar* (one value) has dimensions $1\
    \ \times 1$. Therefore, vectors and scalars are actually special cases of matrices.\
    \ Here are some diagrams showing, from left to right, a scalar, a column vector,\
    \ a row vector, and a matrix.\n\n| | | |\n|---|---|---|\n| 3 | | |\n| | 7 | |\n\
    | | | 4 |\n| 5 | 88 | |\n| | 3 | 11 |\n| 9 | 6 | 3 |\n| 5 | 7 | 2 |\n\nThe scalar\
    \ is $1 \times 1$, the column vector is $3 \times 1$ (three rows by one column),\
    \ the row vector is $1 \times 4$ (one row by four columns), and the matrix is\
    \ $2 \times 3$ (two rows by three columns). All of the values in these matrices\
    \ are stored in what are called **elements**.\n\nMATLAB is written to work with\
    \ matrices; the name MATLAB stands for “matrix laboratory.” Since MATLAB is written\
    \ to work with matrices, it is easy to create vector and matrix variables, and\
    \ there are many operations and functions that can be used on vectors and matrices."
