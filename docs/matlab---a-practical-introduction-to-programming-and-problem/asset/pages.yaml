  md: 'Sometimes a value that is much larger or smaller than the rest of the data
    (called outlier) can throw off the mean. For example, in the following all of
    the numbers in the data set are in the range from 3 to 10, with the exception
    of the 100 in the middle. Because of this outlier, the mean of the values in the
    vector is actually larger than any of the other values in the vector.


    ```

    >> xwithbig = [9 10 9 8 100 7 3 10 9 8 5 10];

    >> mean(xwithbig)

    ans=15.2308

    ```


    Typically, an outlier like this represents an error of some kind, perhaps in the
    data collection. To handle this, sometimes the minimum and maximum values from
    a data set are discarded before the mean is computed. In this example, a logical
    vector indicating that neither the largest nor smallest values are used to index
    into the original data set, resulting in removing the minimum and the maximum.


    ```

    >> xwithbig = [9 10 9 8 100 7 3 10 9 8 5 10];

    >> length(xwithbig)

    ans=13

    >> newx = xwithbig(xwithbig ~= min(xwithbig) & ...nxwithbig ~= max(xwithbig))

    newx =

    9 10 9 8 7 10 9 8 5 10

    >> length(newx)

    ans=11

    ```


    Instead of just removing the minimum and maximum values, sometimes the largest
    and smallest 1% or 2% of values are removed, especially if the data set is very
    large.


    There are several other means that can be computed. The harmonic mean of the $n$
    values in a vector or data set $x$ is defined


    > $$\frac{n}{\frac{1}{x_1}+\frac{1}{x_2}+\frac{1}{x_3}+\dots+\frac{1}{x_n}}$


    This could be implemented in an anonymous function using the built-in sum function.
    For example, the following anonymous function calculates this, and stores the
    handle in a variable called *harmhand.


    ```

    >> harmhand = @(x) length(x) / sum(1 ./ x);

    >> x = [9 10 9 8 7 3 10 9 8 5 10];

    >> harmhand(x)

    ans=7.2310

    ```'
