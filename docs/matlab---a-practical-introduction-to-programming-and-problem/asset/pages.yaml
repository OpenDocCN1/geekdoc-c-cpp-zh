  md: '# 402 CHAPTER 13 Basic Statistics, Sets, Sorting, and Indexing


    This section will cover some simple statistics, as well as operations that can
    be performed on data sets. Some statistical functions require that the data set
    be sorted, so sorting will also be covered. Using index vectors is a way of representing
    the data in order, without physically sorting the data set. Finally, searching
    for values within a data set or a database is useful, so some basic searching
    techniques will be explained.


    # 13.1 STATISTICAL FUNCTIONS


    MATLAB has built-in functions for many statistics; the simplest of which we have
    already seen (e.g., min and max to find the minimum or maximum value in a data
    set).


    ```

    >> x = [9 10 9 8 7 3 10 9 8 5 10];

    >> min(x)

    ans =

    3

    >> max(x)

    ans =

    0

    ```


    Both of these functions also return the index of the smallest or largest value;
    if there is more than one occurrence, it returns the first. For example, in the
    following data set 10 is the largest value; it is found in three elements in the
    vector but the returned index is the first element in which it found (which is
    2):


    ```

    >> x = [9 10 9 8 7 3 10 9 8 5 10];

    >> [maxval, maxind] = max(x)

    maxval =

    10

    maxind =

    2

    ```


    For matrices, the min and max functions operate columnwise by default:


    ```

    >> mat = [9 10 17 5; 19 9 11 14]

    mat =

    9 10 17 5

    19 9 11 14

    ```


    ```

    >> [minval, minind] = min(mat)

    minval =

    9 9 11 5

    minind =

    1 2 2 1

    ```'
