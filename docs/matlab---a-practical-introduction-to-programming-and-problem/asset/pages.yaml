  md: '# CHAPTER 15 Advanced Mathematics


    vector, the values of f''(x) can be approximated as diff(y) divided by diff(x).
    For example, the equation x^3 + 2x^2 - 4x + 3 can be written as an anonymous function.
    It can be seen that the approximate derivative is close to the values found using
    polyder and polyval.


    ```

    >> f = @(x) x .^3 + 2 * x .^2 - 4 * x + 3;

    >> x = 0.5 : 3.5;

    x=

    0.5000 1.5000 2.5000 3.5000

    >> y = f(x)

    y=

    1.6250 4.8750 21.1250 56.3750

    >> diff(y)

    ans=

    3.2500 16.2500 35.2500

    >> diff(x)

    ans=

    1 1 1

    >> diff(y) ./ diff(x)

    ans=

    3.2500 16.2500 35.2500

    ```


    # 15.4.3 Calculus in Symbolic Math Toolbox


    There are several functions in Symbolic Math Toolbox to perform calculus operations
    symbolically (e.g., diff to differentiate and int to integrate). To learn about
    the int function, for example, from the Command Window.


    ```

    >> help sym/int

    ```


    For instance, to find the indefinite integral of f(x) = 3x^2 - 1:


    ```

    >> sym x

    >> int(3 * x^2 - 1)

    ans=

    x^3 - x

    ```


    To instead find the definite integral of this function from x = 2 to x = 4:


    ```

    >> int(3 * x^2 - 1, 2, 4)

    ans=

    54

    ```


    Limits can be found using the limit function. For example, for the difference
    equation described previously:


    ```

    >> sym x h

    >> f

    f = @(x) x .^3 + 2.*x .^2 - 4.*x + 3

    >> limit((f(x+h) - f(x))/h,0)

    ans=

    3 * x^2-4 + 4 *x

    ```'
