  md: "There are two different loop statements in MATLAB: the for statement and the\
    \ while statement. In practice, the for statement is usually used as the counted\
    \ loop, and the while is used as the conditional loop. To keep it simple, that\
    \ is how they will be presented here.\n\n# 4.1 THE FOR LOOP\n\nThe for statement,\
    \ or the for loop, is used when it is necessary to repeat statements in a script\
    \ or function, when it is known ahead of time how many times the statements will\
    \ be repeated. The statements that are repeated are called the action of the loop.\
    \ For example, it may be known that the action of the loop will be repeated five\
    \ times. The terminology used is to iterate through the action of the loop five\
    \ times.\n\nThe variable that is used to iterate through values is a loop variable,\
    \ or iterator variable. For example, the variable might iterate through the integers\
    \ 1 through 5 (e.g., 1, 2, 3, 4, and then 5). Although variables in general should\
    \ be mnemonic, it is common for an iterator variable to be the name i (and if\
    \ more than one iterator is needed, i, j, k, l, etc.). This is historical, and\
    \ because of the way integer variables were used in Fortran. However, in MATLAB\
    \ both i and j are built-in values for $\\sqrt{-1}$, so using either as a loop\
    \ variable will override that value. If that is not an issue, then it is okay\
    \ to use i as a loop variable.\n\nThe general form of the for loop is\n\n```\n\
    for loopvar = range\n    action\nend\n```\n\nwhere loopvar is the loop variable,\
    \ \"range\" is the range of values through which the loop variable is to iterate,\
    \ and the action of the loop consists of all statements up to the end. Just like\
    \ if statements, the action is indented to make it easier to see. The range can\
    \ be specified using any vector, but normally the easiest way to specify the range\
    \ of values is to use the colon operator.\n\nFor instance, the following prints\
    \ a column of numbers from 1 to 5:\n\n```\nfor i = 1:5\n    fprintf('%d\\n',i)\n\
    end\n```\n\nThis loop could be executed in the Command Window, although like if\
    \ switch statements, loops will make more sense in scripts and functions. In the\
    \ Command Window, the results will appear after the for loop:\n\n```\n>> i = 1:5\n\
    \    fprintf('%d\\n',i)\nend\n```"
  merge: -1
  pgno: 130
