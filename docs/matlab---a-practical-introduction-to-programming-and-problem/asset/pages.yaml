  md: 'In this chapter, we first investigate matrix and vector operations and then
    use these to solve linear algebraic equations. The use of **symbolic mathematics**
    including the **solve** function will be covered in Chapter 15.


    # 12.1 MATRIX DEFINITIONS


    As we have already seen, a **matrix** can be thought of as a table of values in
    which there are both rows and columns. The general form of a matrix A (which is
    written as [A]) is shown here:


    ```

    A = \begin{bmatrix} a_{11} & a_{12} & \dots & a_{in} \ a_{21} & a_{22} & \dots
    & a_{2n} \ \vdots & \vdots & \ddots & \vdots \ a_{m1} & a_{m2} & \dots & a_{mn}
    \end{bmatrix} = a_{ij} \ i=1, \dots, m; j=1, \dots, n

    ```


    This matrix has $m$ rows and $n$ columns, so the size is $m \times n$.


    A **vector** is a special case of a matrix, in which one of the dimensions (either
    $m$ or $n$) is 1. A **row vector** is a $1 \times n$ matrix. A **column vector**
    is an $n \times 1$ matrix. A **scalar** is a special case of a matrix in which
    both $m$ and $n$ are 1, so it is a single value or a $1 \times 1$ matrix.


    # 12.1.1 Matrix properties


    In this section we define some special properties of matrices.


    Two matrices are said to be equal to each other only if all corresponding elements
    are equal to each other. For this to be true, their sizes must be the same as
    well. The definition is $[A] = [B]$ if $a_{ij} = b_{ij}$ for all $i, j$.


    > To test whether two matrices are equal to each other, both matrices are passed
    to a function that returns 1 for **logical true** if they are the same or 0 for
    **logical false** (if they are not the same size). To write our own function,
    a flag is set to 1, for logical true. If the two matrices are not the same size,
    the flag is set to 0 for false. Otherwise, using a **nested loop**, each element
    in the first argument `mata` is compared to the corresponding element in `math`;
    if they are not the same, the flag is set to 0 for false.


    ```

    myequal.m


    function myflag=myequal(mata,matb)

    % myequal receives two matrices and returns

    % logical 1 if they are equal or 0 if not

    % Format: myequal(matrix1, matrix2)


    % Assume true until unless found to be false

    myflag = logical(1);

    ```'
  merge: -1
  pgno: 377
- img_proc: true
  md: "```\n[ r c] = size(mata);\nif all(size(mata) ~= size(matb))\n    myflag = logical(0);\n\
    else\n    for i=1:r\n      for j = 1:c\n        if mata(i,j) ~= matb(i,j)\n  \
    \        myflag = logical(0);\n      end\n    end\nend\n```\n\n```\n>> mata =\
    \ [2 5 8; 1 3];\n>> matb = [2:3:8; 1 2 3];\n>> myisequal(mata,matb)\nans =\n1\n\
    ```\n\n# THE EFFICIENT METHOD\n\nIn MATLAB, as we have seen, the isequal function\
    \ will also accomplish this:\n\n>> isequal(mata,matb)\nans =\n1\n\nIn addition,\
    \ the isequal function will return logical 0 for false if the two matrices are\
    \ not the same size.\n\n# 12.1.2 Square matrices\n\nIf a matrix has the same number\
    \ of rows and columns (e.g., if m == n), the matrix is square. The definitions\
    \ that follow in this section only apply to square matrices.\n\nThe main diagonal\
    \ of a square matrix is the set of terms aii for which the row and column indices\
    \ are the same, so from the upper left element to the lower right. For example,\
    \ for the following matrix the set of numbers is 1, 6, 11, and 16."
