    \nThe if-else statement is used to choose between two actions. To choose\nmore\
    \ than two actions the if-else statements can be nested, meaning one\nstatement\
    \ inside of another. For example, consider implementing the following\ncontinuous\
    \ mathematical function y = f(x):\n\n```\ny = 1 if x < -1\ny = x^2 if -1 <= x\
    \ <= 2\ny = 4 if x > 2\n```\n\nThe value of y is based on the value of x, which\
    \ could be in one of three\nranges. Choosing which range could be accomplished\
    \ with three separate if\nstatements, as follows:\n\n```\nif x < -1\n  y = 1;\n\
    end\nif x >= -1 && x <= 2\n  y = x^2;\nend\nif x > 2\n  y = 4;\nend\n```\n\nSince\
    \ the three possibilities are mutually exclusive, the value of y can deter-\n\
    mined by all three separate if statements. However, this is not very efficient\n\
    code in which x falls. For example, if x is less than -1, the first expression\
