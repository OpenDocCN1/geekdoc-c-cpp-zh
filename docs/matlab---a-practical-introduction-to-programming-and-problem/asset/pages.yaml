    Patches can also be defined in 3D space. A patch object is defined by both the
    vertices and the faces of the polygons that connect these vertices. One of calling
    this function is patch(fv) where f is a structure variable with fields vertices
    and faces. For example, consider a patch that has four vertices in 3D space, given
    by the coordinates:


    +   (1) (0, 0, 0)

