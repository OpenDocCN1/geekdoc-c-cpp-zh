    The next example illustrates several features: radio buttons, grouping objects
    together (in this case a button group), and the use of normalized units when setting
    the positions. The GUI presents the user with a choice of colors using two radio
    buttons, one of which can be pressed at any given time. The GUI prints a string
    to the right of the radio buttons, in the chosen color.


    The function `uibuttonroup` creates a mechanism for grouping together the buttons.
    Since only one button can be chosen at a time, there is a type of callback function
    called `SelectionChangedFcn` that is called when a button is chosen.


    This function gets from the button group which button is chosen with the ‘SelectedObject’
    property. It chooses the color based on this. This property is initially set to
    the empty vector, so that neither button is selected; the default is that the
    first button will be selected.


    The ‘Units’ property of the objects is set to ‘Normalized’, which means that rather
    than specifying in pixels, the position is a percentage of the Figure Window.
    This allows the Figure Window to be resized.'
