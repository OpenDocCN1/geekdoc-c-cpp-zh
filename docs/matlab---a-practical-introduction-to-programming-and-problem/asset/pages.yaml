  md: '# 178 CHAPTER 6 MATLAB Programs


    +   - Functions that calculate and return one value

    - Functions that calculate and return more than one value

    - Functions that just accomplish a task, such as printing, without returning any
    values


    Thus, although many functions calculate and return values, some do not. Some functions
    instead just accomplish a task. Categorizing the functions as such is somewhat
    arbitrary, but there are differences between these three types of functions, including
    the format of the function headers and also the way in which the functions are
    called. Regardless of what kind of function it is, all functions must be defined,
    and all function definitions consist of the header and the body. Also, the function
    must be called for it to be utilized.


    In general, any function in MATLAB consists of the following:


    +   - The function header (the first line), which contains

    - The reserved function. (If the function returns the output argument(s), followed
    by the assignment operator =)

    - The name of the function. (IMPORTANT: This should be the same as the name of
    the M-file in which this function is stored to avoid confusion)

    - The input arguments in parentheses, if there are any (separated by commas if
    there is more than one).

    - A comment that describes what the function does (this is printed if help is
    used)

    - The body of the function, which includes all statements, putting values in all
    output arguments, if there are any end at the end of the function


    # 6.1.1 Functions that return more than one argument


    Functions that return one value have one output argument, as be seen in Section
    2.7. Functions that return more than one value must instead have more than one
    output argument in the function header square brackets. This means that in the
    body of the function, values must be put in all output arguments listed in the
    function header. The general form of a function definition for a function that
    calculates and returns more than one value looks like the following:


    ```

    functionname.m

    function[output arguments] = functionname(input arguments)

    % Comment describing the function


    Statements here; these must include putting values in all of the

    output arguments listed in the header


    end

    ```'
