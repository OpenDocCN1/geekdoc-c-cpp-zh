  md: '# CHAPTER 9 Advanced File Input and Output


    # # QUICK QUESTION!


    Why is the space in the conversion string ''%f %c'' important?

    Would the following also work?


    ```

    >> mat = fscanf(fid,''%f%c'', [2])

    ```


    **Answer:** No, it would not work. The conversion string ''%f %c'' specifies that
    it is a real number, a space, and a character. Without the space in the conversion
    string, it would specify a real number immediately followed by a character (which
    would be the space in the file). Then, the next time it would be attempting to
    read the next real number the file position indicator would be pointing to the
    character on the first line, the error would cause the fscanf function to halt.

    The end result follows:


    ```

    >> fid = fopen(''subexp.dat'');

    >> mat = fscanf(fid,''%f%c'', [2])

    mat =

    5.3000

    32.0000

    ```


    The 32 is the numerical equivalent of the space character '''''', as seen here.


    ```

    >> double('' '')

    as =

    32

    ```


    Another option for reading from a file is to use the textscan function. The **textscan**
    function reads data from a file and stores the data in a cell array. The **textscan**
    function is called, in its simplest form, as


    ```

    cellarray = textscan(fid, ''format'');

    ```


    where the ''''format'''' includes conversion characters like those used in the
    fprintf function. For example, to read the file *subexp.dat* we could do the following
    (again, for simplicity, omitting the error-checking of fopen and fclose):


    ```

    >> fid = fopen(''subexp.dat'');

    >> subdata = textscan(fid,''%f %c'');

    >> fclose(fid)

    ```


    The string ''''%f %c'''' specifies that on each line there is a **double** value
    followed by a space followed by a character. This creates an I×2 cell array called
    subdata. The first element is a column vector of doubles (the first column from
    the file); the second element is a column vector of characters (the second column
    from the file), as shown here:


    ```

    >> subdata

    subdata =\5 1 double]  [5 1 char]

    >> subdata(1)

    as =

    5.3000

    2.2000

    3.3000

    4.4000

    1.1000

    ```'
