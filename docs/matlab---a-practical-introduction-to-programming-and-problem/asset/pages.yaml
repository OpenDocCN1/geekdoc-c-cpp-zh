    function to print the results. This function calls a subfunction to calculate
    the area.


    ```

    rectarea.m

    % This program calculates & prints the area of a rectangle

    % Call a fn to prompt the user & read the length and width

    [length, width] = readwidth;

    % Call a fn to calculate and print the area

    printrectarea(length, width)

    ```


    ```

    readwidth.m

    function [l,w] = readwidth

    % readwidth reads and returns the length and width

