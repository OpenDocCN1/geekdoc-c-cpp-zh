  md: 'For most programs, the basic algorithm consists of the three steps outlined
    in the preceding:


    +   1. Get the input(s)

    2. Calculate the result(s)

    3. Display the result(s)


    As can be seen here, even the simplest problem solutions can then be further refined.


    # 2.2 MATLAB SCRIPTS


    Once a problem has been analyzed, the algorithm for its solution has been written
    and refined, the problem is then written in a particular programming language.
    A computer program is a sequence of instructions, in a given language, that accomplishes
    a task. To execute, or run, a program is to have the computer actually follow
    these instructions sequentially.


    High-level languages have English-like commands and functions, such as "print"
    or "if x < 5, do something." The computer, however, can only interpret commands
    written in machine language. Programs that are written in high-level languages
    must be translated into machine language before the computer can actually execute
    the sequence of instructions in the program. A program that does this translation
    from a high-level language to an executable file is called a compiler. The original
    program is the source code, and the resulting executable program is called the
    object code.


    By contrast, an interpreter goes through the code line-by-line, executing each
    command as it does. MATLAB uses what are called script files, or M-files (for
    the reason that the extension on the file name is m.). These script files are
    interpreted, rather than compiled. Therefore the correct terminology is that they
    are scripts, not programs. However the documentation in MATLAB itself refers to
    scripts as programs. In this book, we will reserve the word "program" to mean
    a set of scripts and functions, as described briefly in Section 2.7 and then in
    more detail in Chapter 6.


    A script is a sequence of MATLAB instructions that is stored in an M-file and
