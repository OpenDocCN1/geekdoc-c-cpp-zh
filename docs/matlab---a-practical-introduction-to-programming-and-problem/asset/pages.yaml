    The num2str function, which converts real numbers, can be called in several ways.
    If the only real number is passed to the num2str function, it will convert a string
    with four decimal places, which is the default in MATLAB for displaying numbers.
    The precision can also be specified (which is the number of digits), and format
    strings can also be passed, as shown in the following:


    ```

