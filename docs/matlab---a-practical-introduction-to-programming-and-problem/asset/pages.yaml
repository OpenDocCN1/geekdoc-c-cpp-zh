  md: 'For a vector $v$ with a length of $n$, the length of $diff(v)$ will be $n-1$.


    As an example, a vector that stores a signal can contain both positive and negative
    values. (For simplicity, we will assume no zeroes, however.) For many applications
    it is useful to find the zero crossings, or where the signal goes from being positive
    to negative or vice versa. This can be accomplished with vectorized code, using
    the functions **sign**, **diff**, and **find**.


    ```

    >> vec = [0.2-0.1 -0.2-0.1 0.1 0.3-0.2];

    >> sv = sign(vec)

    sv =

    1 -1 -1 -1 1 -1

    ```


    ```

    >> dsv = diff(sv)

    dsv =

    -2 0 2 0 -2

    ```


    ```

    >> find(dsv)

    ans =

    1 4 6

    ```


    This shows that the signal crossings are between elements 1 and 2, 4 and 5, and
    6 and 7.


    The **meshgrid** function receives as input arguments two vectors, and returns
    output matrices that can specify the x and y coordinates of points in images,
