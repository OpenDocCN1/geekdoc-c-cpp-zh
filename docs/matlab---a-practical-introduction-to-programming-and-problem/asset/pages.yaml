  md: 'If there is more than one variable, MATLAB chooses which to solve for. In the
    following example, the equation ax'' + bx = 0 is solved. There are three variables.
    As can be seen from the result, which is given in terms of a and b, the equation
    was solved for x. MATLAB has rules built in that help choose which variable to
    solve for. For example, x will always be the first choice if it is in the equation
    or expression.


    ```

    >> solve(''a * x^2 + b * x'')

    ans =

    0

    -b/a

    ```


    However, it is possible to specify variable to solve for:


    ```

    >> solve(''a * x^2 + b * x'', ''b'')

    ans =

    -a * x

    ```


    MATLAB can also solve sets of equations. In this example, the solutions for x,
    y, and z are returned as a structure consisting of fields for x, y, and z. The
    individual solutions are symbolic expressions stored in fields of the structure.


    ```

    >> solve(''4*x-2*y+z=7'',''x+y+5*z=10'',''-2*x+3*y-z=2'')

    ans =

    x:[1 1 1 sym]

    y:[1 1 1 sym]

    z:[1 1 1 sym]

    ```


    To refer to the individual solutions, which are in the structure fields, the dot
    operator is used.


    ```

    >> x = ans.x

    x =

    124/41

    ```


    ```

    >> y = ans.y

    y =

    121/41

    ```


    ```

    >> z = ans.z

    z =

    33/41

    ```


    The double function can be used to convert the symbolic expressions to numbers,
    and store the results from the three unknowns in a vector.


    ```

    >> double([x y z])

    ans =

    3.0244    2.9512    0.8049

    ```'
