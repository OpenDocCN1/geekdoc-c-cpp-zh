    # # SUMMARY


    Common Pitfalls


    +   - Forgetting that max and min return the index of only the first occurrence
    of the maximum or minimum value.


    +   - Not realizing that a data set has outliers that can drastically alter the
    results obtained from the statistical functions.


    +   - When sorting a vector of structures on a field, forgetting that only the
    field in question is compared in the sort algorithm, entire structures must be
    interchanged.


    +   - Forgetting that a data set must be sorted before using a binary search.


    Programming Style Guidelines


    +   - Remove the largest and smallest numbers from a large data set before performing
    statistical analyses, to handle the problem of outliers.


    +   - Use sorts to sort strings in a matrix alphabetically; for cell arrays, sort
    can be used.


    +   - When it is necessary to iterate through a vector of structures in order
    based on several different fields, it may be more efficient to create index vectors
    based on these fields rather than sorting the vector of structures multiple times.


