    # 9.3 USING MAT-FILES FOR VARIABLES


    In addition to the functions that manipulate data files, MATLAB has functions
    that allow reading variables from saving variables to files. These files are called
    MAT-files (because the extension on the filename is *mat*), and they store the
    names and contents of variables. Variables can be written to MAT-files, appended
    to them, and read from them. (*Note*: MAT-files are very different from the data
    files that we have worked with so far. Rather than just storing data, MAT-files
    store the names in addition to their values. These files are typically used only
    within MATLAB; they are not used to share data with other programs.)


    # 9.3.1 Writing variables to a file


    The **save** command can be used to write variables to a MAT-file, or to append
    variables to a MAT-file. By default, the **save** function writes to a MAT-file.
    It can either save the current workspace (all variables that have been created),
    or a subset of the workspace (including, for example, just one variable). The
    **save** function will save the MAT-file in the Current Folder so it is important
    to set that correctly first.


    To save all variables in a file, the command is


    ```

    save filename

    ```


    The *.mat* extension is added automatically to the filename. The contents of the
    file can be displayed using **who** with the -file qualifier:


    ```

    who --file filename

    ```


    For example, in the following session in the Command Window, three variables are
    created; these are then displayed using **who**. Then, the variables are saved
    to a file named *sess1.mat*. The **who** function is used to display the variables
    stored in that file.


    ```

    >> mymat = rand(3,5);

    >> x = 1:6;

    >> y = x.^2;

    >> who

    Your variables are:

    mymat      x      y

    ```'
