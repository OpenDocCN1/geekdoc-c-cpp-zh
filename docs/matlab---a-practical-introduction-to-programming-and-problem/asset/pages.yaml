    # 13.3 SORTING


    Sorting is the process of putting a list in order—either descending (highest to
    lowest) or ascending (lowest to highest) order. For example, here is a list of
    n integers, visualized as a column vector.


    What is desired is to sort this in ascending order in place—by rearranging this
    vector, not creating another. The following is one basic algorithm:


    +   - Look through the vector to find the smallest number, and then put it in
    the first element of the vector. How? By exchanging it with the number currently
    in the first element.'
