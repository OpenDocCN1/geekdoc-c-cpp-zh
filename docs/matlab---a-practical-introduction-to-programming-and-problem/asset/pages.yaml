    # QUICK QUESTION!


    The date returns the current date as a string (e.g. 07-Feb-2011). How would we
    write a function to return the day, month, and year as separate arguments?


    **Answer:** We could use strop to replace the ''-'' characters with blanks, and
    then use strtok with the blank as the default delimiter to break up the string
    (twice), or more simply we could just use strtok and specify the ''-'' character
    as the delimiter.


    ```

    separated.m

    function [today, todaymo, todayyr] = separated

    % separate separates the current date into day,

    % month, and year

    % Format: separated or separated()


    [today, rest] = strtok(date, ''-'');

    [todaymo, todayyr] = strtok(rest, ''-'');

    todayyr = todayyr(2:end);

    end

    ```


    Since we need to separate the string into three parts, we need to use the strtok
    function twice. The first time it is separated into ''07'' and ''Feb-2011''. Then,
    the second string is separated into ''Feb'' and ''2011'' using strtok. (Since
    leading delimiters are ignored the second ''-'' is found as the delimiter in ''-Feb-2011.'')
    Finally, we need to remove the ''-'' from the string ''Feb-2011''; this can be
    done by indexing from the second character to the end of the string.


    **Note:** Input arguments are passed to the *separated* function; instead, the
    date function returns the current date as a string. Also, note that all three
    output arguments are strings.


    An example of calling this function follows:


    ```

    >> [d m y] = separated

    d=

    07

    m=

    Feb

    y=

    2011

    ```'
