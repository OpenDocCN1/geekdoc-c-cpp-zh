  md: '# 6.4 Variable Scope


    Because the variables created in scripts and in begin scripts with the Command
    Window both use the base workspace, many programmers begin with a clear command
    to eliminate variables that may have already been created elsewhere (either in
    the Command Window or in another script).


    Instead of a program consisting of a script that calls other functions to do the
    work, in some programmers will write a "main function" to call the other functions.
    The program consists of all functions other than one script and the rest functions.
    The reason for this is because both scripts and the Command Window use the base
    workspace.


    It is possible, in MATLAB as in all other languages, to have global variables
    that can be shared by functions without passing them. Although there are some
    cases in using global variables is efficient, it is generally regarded as poor
    programming style and therefore will not be explained here.


    # 6.4.1 Persistent variables


    Normally, when a function stops executing, the local variables from it are cleared.
    That every time a function is called, memory is allocated and used while the function
    is executing, but released when it ends. With variables that are declared as persistent
    variables, the value is not cleared so the next time the function is called, the
    variable still retains and retains its value.


    The following program demonstrates this. This script calls a func1, which initializes
    a variable count to 0, increments it, and then prints the value. Every time the
    function is called, the variable is created, initialized to 0, changed to 1, and
    then when the function exits. The script then calls a func2, which first declares
    a persistent variable count. If the variable has not yet been initialized, will
    be the first time the function is called, it is initialized to 0. Then, the first
    function, the variable is incremented and the value is printed. With the second
    function, the variable remains with its value when the function exits, so the
    next time the function is called the variable is incremented again.


    ```

    % persistext.m

    % This script demonstrates persistent variables


    % The first function has a variable "count"

    fprintf(''This is what happens with a "normal" variable:\n'')

    funccl

    funccl


    % The second fn has a persistent variable "count"

    fprintf(''\nThis is what with a persistent variable:\n'')

    ```'
