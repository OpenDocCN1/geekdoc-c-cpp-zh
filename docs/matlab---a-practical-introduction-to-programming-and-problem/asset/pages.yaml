    \ case, if x is less than -1, or it is greater than 2. An if-else statement is\
    \ used to choose between those two, the assignment to 1 to y is executed, then\
    \ the else clause is executed, however, if x is not less than -1, then the else\
    \ clause is executed. If the else clause is executed, we already know that x is\
    \ greater or equal to -1 so that part does not need to be tested.\n\nInstead,\
    \ there are only two remaining possibilities: either x is less or equal to 2,\
    \ or it is greater than 2. An if-else statement is used to choose between those\
    \ two possibilities. So, the else clause was another if-else statement. Although\
    \ it is long, this is one if-else statement, a nested if-else statement. The actions\
    \ are indented to show the structure of them. Nesting if-else statements in this\
