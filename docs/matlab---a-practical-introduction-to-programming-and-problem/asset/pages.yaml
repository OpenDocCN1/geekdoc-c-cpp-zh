    A string in the MATLAB® software consists of any number of characters and is contained
    in single quotes. Actually, strings are vectors in which every element is a single
    character, which means that many of the vector operations and functions that we
    have already seen with strings.


    MATLAB also has built-in functions that are specifically written to manipulate
    strings. In some cases, strings contain numbers, and it is useful to convert strings
    to numbers and vice versa; MATLAB has functions to do this as well.


    There are many applications for using strings, even in fields that are predominantly
    numerical. For example, when data files consist of combinations of numbers and
    characters, it is often necessary to read each line from the file as a string,
    break the string into pieces, and convert the parts that contain numbers to number
    variables that can be used in computations. In this chapter the string manipulation
    techniques necessary for this will be introduced, and in Chapter 9 input/output
    will be demonstrated.


