  md: 'In this chapter, we will introduce lower-level file input and output functions,
    as well as functions that work with different file types.


    # 9.1 LOWER-LEVEL FILE I/O FUNCTIONS


    When reading from a data file, the load function works as long as the data in
    the file are “regular”—in other words, the same kind of data on every line and
    in the same format on every line—so that they can be read into a matrix. However,
    files are not always set up in this manner. It is not possible to use load. MATLAB
    has what are lower-level file input functions that can be used. The file must
    be opened first, which involves finding and positioning an indicator at the beginning
    of the file. This indicator then moves through the file as it is being read. When
    the reading has been completed, the file must be closed.


    Similarly, the save function can write or append matrices to a file, but if the
    output is not a simple matrix, there are lower-level functions that write to files.
    Again, the file must be opened first and closed when the writing has been completed.


    In general, the steps involved are:


    +   - open the file

    - read from the file, write to the file, or append to the file

    - close the file


    First, the steps involved in opening and closing the file will be described. Several
    functions that perform the middle step of reading from or writing to the file
    will be described subsequently.


    # 9.1.1 Opening and closing a file


    Files are opened with the fopen function. By default, the fopen function opens
    a file for reading. If another mode is desired, a “permission string” is used
    to specify which, for example, for writing or appending. The fopen function returns
    -1 if it is not successful in opening the file, or an integer value that comes
    the file identifier if it is successful. This file identifier is then used to
    refer to the file when calling other i/o functions. The general form is


    ```

    fid = fopen(''filename'', ''permission string'');

    ```


    where fid is a variable (it can be named anything) and the permission strings
    include:


    +   - r reading (this is the default)

    - w writing

    - appending'
