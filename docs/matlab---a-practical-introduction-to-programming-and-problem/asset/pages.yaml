    Objects, and then Core Graphics Objects. The core objects include:


    +   * line

    * text

    * rectangle

    * patch

    * image


    These are all built-in functions; help can be used to learn how each function
    is used.


    A line is a core graphics objects, which is produced by the plot function. The
    following is an example of creating a line object, modifying some properties,
    and saving the handle in a variable hl:


