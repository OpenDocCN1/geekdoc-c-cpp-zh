  md: '# Advanced File Input and Output


    # KEY TERMS


    | file input and output | open the file | end of the file |

    | file types | close the file | |

    | lower-level I/O | file identifier | |

    | functions | permission strings | |


    +   9.1 Lower-Level I/O Functions ....278

    9.2 Writing and Reading Spreadsheet Files ....291

    9.3 Using MAT-Files for Variables ....293


    This chapter extends input and output concepts that were introduced in Chapter
    2. In that chapter, we saw how to read values entered by using the **input** function,
    and also the output functions **disp** and **fprintf** that display information
    on the screen. For **file input and output (file I/O), we used the **load** and
    **save** functions that can read from a data file into a matrix, and write from
    a matrix to a data file. We also saw that there are different operations that
    can be performed on files: reading from files, writing to files (implying writing
    to the beginning of a file), and appending to a file (writing to the end of a
    file).


    There are many different *file types*, which use different filename extensions.
    Thus far, using **load** and **save**, we have worked with files in the ASCII
    format that typically use the extension *.dat* or *.txt*. The **load** command
    works only if there are the same number of values in each line and the values
    are the same type, so that the data can be stored in a matrix, and the **save**
    command only writes from a matrix to a file. If the data to be written or file
    to read are in a different format, *lower-level file I/O functions* must be used.


    The MATLAB® software has functions that can read and write data from different
    types such as spreadsheets; typically, Excel spreadsheets have the filename extension
    *.xlsx*. Excel also has its own binary file type that uses the extension *.mat*.
    These are usually called MAT-files, and can be used to store variables that have
    been created in MATLAB.'
