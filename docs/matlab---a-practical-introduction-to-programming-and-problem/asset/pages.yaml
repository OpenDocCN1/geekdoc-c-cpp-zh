  md: "# CHAPTER 12 Matrix Representation of Linear Algebraic Equations\n\n```\nmymatult.m\n\
    % This script demonstrates matrix multiplication\nA=[3 8 0; 1 2 5];\nB=[1 2 3;\
    \ 4 5 2; 0 2 0];\n\n[m n] = size(A);\n[nb p] = size(B);\nif n~nb\n    disp('Cannot\
    \ perform this matrix multiplication')\nelse\n    % Preallocate C\n    C = zeros(m,p);\n\
    \    % Outer 2 loops iterate through the elements in C\n    % which has dimensions\
    \ m by p\n    for i = 1:m\n        for j = 1:p\n            % Inner loop performs\
    \ the sum for\n            % element in C\n            mysum = 0;\n          \
    \  for k = 1:n\n                mysum = mysum + A(i,k) * B(k,j);\n           \
    \ C(i,j) = mysum;\n        end\n    end\n% display C\nC;\n```\n\n```\n>> mymatult\n\
    C=\n35 46 17 19\n9 22 20 5\n```\n\n# THE EFFICIENT METHOD\n\nIn MATLAB, the *\
    \ operator will perform this matrix multiplication:\n\n```\n>> A=[3 8 0; 1 2 5];\n\
    >> B=[1 2 3; 4 5 2; 0 2 0];\n>> C=A*B\nC=\n35 46 17 19\n9 22 20 5\n```"
