    ans =\n54.6000\n```\n\nThe better the curve fit, the more exact the interpolated\
    \ and extrapolated values will be.\nUsing the subplot function, we can loop to\
    \ show the difference between fitting curves of degrees 1, 2, and 3 to some data.\
    \ For example, the following script will accomplish this (Note: The variable morex\
    \ stores 100 points so the graph will be smooth).\n\n```\npolytemsubplot.m\n%\
    \ Fits curves of degrees 1-3 to temperature\n% data and plots in a subplot\nx\
    \ = 2:6;\ny = [65 67 72 71 63];\nmorex = linspace(min(x),max(x))\npd = 1:3\ncoeffs\
    \ = polyfit(x,y,pd);\ncurve = polyval(coefs,morex)\nsubplot([1,3])\nplot(x,y,'ro',morex,curve)\n\
    xlabel('Time')\nylabel('Temperatures')\ntitle(sprintf('Degree %d',pd))\naxis([1\
    \ 7 60 75])\nend\n```\n\nExecuting the script\n\n>> polytemsubplot Window shown\
    \ in Figure 15.4.\n\n# 15.1. Least squares\n\nThe polyfit function uses the least\
