    # 12.2 MATRIX SOLUTIONS TO SYSTEMS OF LINEAR ALGEBRAIC EQUATIONS


    A linear algebraic equation is an equation of the form


    $a_1x_1 + a_2x_2 + a_3x_3 + \dots + a_nx_n = b$


    where the a''s are coefficients, the x''s are unknowns, and b is a constant. A
    solution is a sequence of numbers that satisfies the equation. For,


    $4x_1 + 5x_2 - 2x_3 = 16$


    is an equation in which there are three unknowns: $x_1, x_2$, and $x_3$. One solution
    to this equation is $x_1 = 3, x_2 = 4$, and $x_3 = 8$, since $4 * 3 * 5 * 4 -
    2 * 8$ is equal to 16.


    A system of linear equations is a set of equations of:


    $a_1x_1 + a_1x_2 + a_1x_3 + \dots + a_1nx_n = b_1$

    $a_2x_1 + a_2x_2 + a_2x_3 + \dots + a_2nx_n = b_2$

    $a_3x_1 + a_3x_2 + a_3x_3 + \dots + a_3nx_n = b_3$

    $\vdots$ $\vdots$ $\vdots$ $\vdots$ $\vdots$

    $a_{m1}x_1 + a_{m2}x_2 + a_{m3}x_3 + \dots + a_{mn}x_n = b_m$


    This is called an $m \times n$ system of equations; there are $m$ equations and
    $n$ unknowns.


    Because of the way matrix multiplication works, these equations can be represented
    in matrix form as $Ax = b$ where $A$ is the matrix of the coefficients, $x$ is
    a column vector of the unknowns, and $b$ is a column vector of the constants from
    the right side of the equations:


    $\begin{bmatrix} a_{11} & a_{12} & a_{13} & \dots & a_{1n} \ a_{21} & a_{22} &
    a_{23} & \dots & a_{2n} \ a_{31} & a_{32} & a_{33} & \dots & a_{3n} \ \vdots &
    \vdots & \vdots & \dots & \vdots \ a_{m1} & a_{m2} & a_{m3} & \dots & a_{mn} \end{bmatrix}
    \begin{bmatrix} x_1 \ x_2 \ x_3 \ \vdots \ x_n \end{bmatrix} = \begin{bmatrix}
    b_1 \ b_2 \ b_3 \ \vdots \ b_m \end{bmatrix}$


    A solution set is the set of all possible solutions to the system of equations
    (all sets values for the unknowns that solve the equations). All systems of linear
    equations have either of the:'
