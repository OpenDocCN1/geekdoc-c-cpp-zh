    # 15.2 COMPLEX NUMBERS


    A **complex number** is generally written in the form


    ```

    z = a + bi

    ```


    where **a** is called the **real part** of the complex **z**, **b** is the **imaginary
    part** of z, and **i** is $\sqrt{-1}$.


    We see that in MATLAB both i and j are built-in functions that return $\sqrt{-1}$
    (so, they can be thought of as built-in constants). Complex can be created using
    i or j, such as "5 + 2i" or "3 - 4j". The multiplication operator is not required
    between the imaginary part and the constant i or j.


    > Note

    This is the way mathematicians usually write a complex number; in engineering
    it is often written as a + bj, where j is $\sqrt{-1}$. A complex number is **purely
    imaginary** if it is of the form z=bi(in other words, where a is 0).


    # QUESTION!


    Is the value of the expression "3 * i" the same as "3i" depends on whether i or
    j has been used as a variable name or not. If i has been used as a variable (e.g.,
    an iterator variable in a for loop), the expression "3 * i" will use the defined
    value for the variable, and the result will not be a complex number. Complex numbers
    to use i or j is a good idea when writing expressions i and j always result in
    a complex number, regardless of whether i and j have been used as variables.


    ```

    >> i = 5;

    >> i

    i =

    >> ans =

    0 + 5.00000i

    ```'
