  md: "# 11.5 HANDLE GRAPHICS AND PLOT PROPERTIES\n\nMATLAB uses what it calls Handle\
    \ Graphics® in all of its figures. All figures consist of different objects, each\
    \ of which is assigned a handle. The object handle is a unique real number that\
    \ is used to refer to the object.\n\nObjects include primitives as lines and text,\
    \ as well as the axes used to orient the objects. The objects are organized hierarchically,\
    \ and there are properties associated with each object. This is the basis of object-oriented\
    \ programming; objects are organized hierarchically (e.g., a parent comes before\
    \ its children in the hierarchy); generally inherit properties from the parents.\n\
    \nThe hierarchy in MATLAB, as seen in Help, \"Organization of Graphics Objects,\"\
    \ can be summarized as follows:\n\n![](img/106804b84dd25648ed57173c2c911b77_350_0.png)\n\
    \nIn other words, the Figure Window includes Axes, which are used to orient Core\
    \ objects (primitives such as line, rectangle, text) and Plot objects (which are\
    \ used to produce the different plot types, such as bar charts and area plots).\n\
    \n# 11.5.1 Plot objects and properties\n\nThe various plots return a handle for\
    \ the plot object, which can be stored in a variable. In the following, the plot\
    \ function returns a sin in a Figure Window (as shown in Figure 11.16) and returns\
    \ a real number, which is the object handle. (Don't try to make sense of the actual\
    \ number used for the handle!)\n\nThis handle will remain valid as long as the\
    \ object exists.\n\n```\n>> x = -2*pi: 1/5 : 2*pi;\n>> y = sin(x);\n>> hl = plot(x,y)\n\
    hn =\n    159.0142\n>> xlabel('x')\n>> ylabel('sin(x)')\n```\n\n> The Figure Window\
    \ should not be closed, as that would make the object handle invalid since the\
    \ object wouldn't exist anymore!\n\nObject properties can be displayed using the\
    \ get function, as shown in the following lines of code. This shows properties\
    \ such as the Color, LineStyle, Width, and so on (and many you will not understand—don't\
    \ worry about it!)."
  merge: -1
  pgno: 350
