    # 8.2 STRUCTURES


    Structures are data structures that group values together that are logically related
    in fields of the structure. An advantage of structures is that the fields are
    named, which helps to make clear what values are stored in the structure. However,
    structure variables are not arrays. They do not have elements that are indexed,
    so it is not possible to loop through the values in a structure.


    # 8.2.1 Creating and modifying structure variables


    Creating structure variables can be accomplished by storing values in fields using
    assignment statements, or by using the struct function.


    In our first example, assume that the local Computer Smart Mart wants to store
    information on the software packages that it sells. For each one, it will store
    the following:


    +   - item number

    - cost to the store

    - price to the customer

    - character code indicating the type of software structure variable for a given
    software package might look like this:


    | item_no | cost | price | code |

    | --- | --- | --- | --- |

    | 123 | 19.99 | 39.95 | g |


    Note

    Some programmers use names that begin with an uppercase letter for structure variables
    (e.g., Package) to make them easily distinguishable.


    The name of the structure variable is package; it has four fields: item_no, cost,
    price, and code.


    One way to initialize a structure variable is to use the struct function, which
    preallocates the structure. The names of the fields are passed as strings; each
    is followed by the value for that field (so, pairs of field names and values are
    passed to struct).


    ```

    package = struct(''item_no'',123,''cost'',19.99,...''price'',39.95,''code'',''g'')


    package =\item_no: 123

    ```'
