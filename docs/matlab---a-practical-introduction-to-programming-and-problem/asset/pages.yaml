  md: '# CHAPTER 2 Introduction to MATLAB Programming


    Output to files and the screen will also be introduced. Finally, user-defined
    functions that calculate and return values will be described. These topics serve
    as an introduction to programming, which will be expanded on in Chapter 6.


    # 2.1 ALGORITHMS


    Before writing any computer program, it is useful to outline the steps that will
    be necessary. An algorithm is the sequence of steps needed to solve a problem.
    in a modular approach to programming, the problem solution is broken down into
    separate steps, and then each step is further refined until the results are small
    enough to be manageable tasks. This is called the top-down design approach.


    As a simple example, consider the problem of calculating the area of a circle.
    First, it is necessary to determine what information is needed to solve the problem,
    which in this case is the radius of the circle. Next, given the radius of the
    circle, the area would be calculated. Finally, once the area has been calculated,
    it has to be displayed in some way. The basic algorithm then is three steps:


    +   - Get the input: the radius

    - Calculate the result, the area

    - Display the output


    Even with this algorithm simple, it is possible to further refine each of the
    steps. When a program is written the steps would be:


    +   - Where does the input come from? Two possible choices will be from an external
    file on a disk, or from the user (the person running the program) who enters the
    number by typing it from the keyboard. For every system, one of these will be
    the default input device (which means, if not specified otherwise, this is where
    the input comes!) If the user is supposed to enter the radius, the user has to
    type in the radius (and, in units). Telling the user what to enter is called prompting.
    The input step-actually becomes two steps: prompt the user to enter a radius,
    and read it into the program.

    - To calculate the area, the formula is needed. In this case, the area of the
    circle is multiplied by the radius squared. So, that means the value of the constant
    for pi is needed in the program.

    - Where does the output go? Two possibilities are (1) to an external file or (2)
    to the screen. Depending on the system, one of these will be the default output
    device. When displaying the output from the program, it should always be as informative
    as possible. In other words, of just printing the area (just the number), it should
    be printed in a nice sentence format. Also, to make the output even more clear,
    the input should be printed. For example, the output might be the sentence: "For
    a circle with a radius of 1 inch, the area is 3.1416 inches squared."'
