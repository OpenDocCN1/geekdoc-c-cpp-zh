  md: '# 3.2 The If Statement


    # PRACTICE 3.1


    Think about what would be produced by the following expressions, and then type
    them to verify your answers.


    ```

    4 > 3 + 1

    ''e'' == ''d'' + 1

    3 < 9 - 2

    (3 < 9) - 2

    4 == 3 + 1 && ''d'' > ''c''

    3 >= 2 || ''x'' == ''y''

    xor(3 >= 2,''x'' == ''y'')

    xor(3 >= 2,''x'' ~= ''y'')

    ```


    # 3.2 THE IF STATEMENT


    if statement chooses another statement, or group of statements, is executed or
    not. The general form of the if statement follows:


    ```

    if condition

    action

    end

    ```


    A action is a relational expression that is conceptually, or logically, true or
    false. The action is a statement, or group of statements, that will be executed
    if the condition is true. When the if statement is executed, first condition is
    evaluated. If the value of the condition is true, the action will be executed;
    if not, the action will not be executed. The action can be any number of statements
    until the reserved word end; the action naturally bracketed by the reserved words
    if and end.(Note: This is different from the end that is used as an index into
    a vector or matrix.) The action is usually indented to make it easier to see.


    For example, the following if statement checks to whether the value of a variable
    is negative. if it is, the value is changed to a positive number by using the
    absolute value function; otherwise, nothing is changed.


    ```

    if num < 0

    num = abs(num)

    end

    ```'
