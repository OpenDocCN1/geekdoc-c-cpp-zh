    real numbers, or in other words with a decimal place (e.g., 5.3), there are two
    basic types: single and double. The name of the type double is short for double
    precision; it stores larger numbers than the single type. MATLAB uses a floating
    point representation for these numbers.


    There are many types, such as int8, int16, int32 and int64. The numbers in the
    names represent the number of bits used to store values of that type.'
