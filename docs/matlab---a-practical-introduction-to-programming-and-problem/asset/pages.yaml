    if vec(i) == key\n    index = i;\nend\n```\n\n# 13.5.2 Binary search\n\nThe binary\
    \ search assumes the vector has been sorted first. The algorithm is similar to\
    \ the way it works when looking for a name in a phone directory (which is sorted\
    \ alphabetically). To find the value of a key:\n\n+   Look at the element in the\
    \ middle:\n  If it is the key, the index has been found.\n  If it is not the key,\
    \ decide whether to search the elements before or after this location and adjust\
    \ the range of values in the search is taking and start this process again.\n\n\
    To implement this, we use variables low and high to specify the range of values\
    \ in which to search. To begin, the value of low will be 1, and the value of high\
    \ will be the length of the vector. The variable mid will be the index of the\
    \ element in the middle of the range from low to high. If the key is not found\
    \ at mid, there are two ways to adjust the range. If the key is less than the\
    \ value at mid, we change high to mid - 1. If the key is greater than the value\
    \ of mid, we change low to mid + 1.\n\nAn example is to search for the key of\
    \ 91 in the vector\n\n| 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|\n|\
    \ 70 | 80 | 85 | 91 | 95 | 100 |\n\nThe following table shows what happens in\
    \ each iteration of the search algorithm.\n\n| Iteration | Low | High | Mid |\
    \ Found? | Action |\n|---|---|---|---|---||}{\n| 1 | 1 | 6 | 3 | No | Move low\
    \ to mid + 1 |\n| 2 | 4 | 6 | 5 | No | Move high to mid – 1 |\n| 3 | 4 | 4 | 4\
    \ | Yes | Done! Index is mid |\n\n*"
