    # 1.6.2 Creating column vectors


    One way to create a column vector is to explicitly put the values in square brackets,
    separated by semicolons (rather than commas or spaces):


    ```

    >> c = [1; 2; 3; 4]

    c =

    1

    2

    3

    4

    ```


    There is no direct way to use the colon operator to get a column vector. However,
    any row vector created using any method can be transposed to result in a column
    vector. In general, the transpose of a matrix is a new matrix in which the rows
    and columns are interchanged. For vectors, transposing a row vector in a column
    vector, and transposing a column vector results in a row vector. A built-in operator,
    the apostrophe, in MATLAB will transpose.


    ```

    >> r = 1;3

    >> c = r''

    c =

    1

    2

    3

    ```


