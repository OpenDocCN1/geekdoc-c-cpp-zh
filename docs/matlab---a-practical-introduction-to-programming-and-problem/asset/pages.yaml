- img_proc: true
  md: '# 468 CHAPTER 14 Sights and Sounds


    the "middle" element is chosen to be the starting point for the random walk; a
    2 is placed in that element. (Note: These numbers will eventually represent colors.)
    Then, from this starting point another element next to it is chosen randomly and
    the color stored in that element is incremented; this repeats until the edges
    of the matrix are reached. Every time an is chosen randomly by either adding or
    subtracting one from each coordinate (x and y), or leaving it alone. The resulting
    matrix that is returned is an $n \times n$ matrix.


    ```

    function walkmat(n)

    walkmat = ones(n);

    x = floor(n/2);

    y = floor(n/2);

    walkmat(x,y) = color;

    while x >= 1 && x <= n && y >= 1 && y <= n

    x = x + randi(1,1,[-1 1]);

    y = y + randi(1,1,[-1 1]);

    color = color +1;

    walkmat(x,y) = mod(color,65)

    ```


