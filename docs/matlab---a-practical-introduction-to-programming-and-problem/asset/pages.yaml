    # 6.1.3 Functions that return values versus printing


    A function that calculates and returns values (through the output arguments) does
    not normally print them; then that is left to the calling script or function.
    It is good programming to separate these tasks.


    If a function just prints a value, rather than returning it, the value cannot
    be used later in other calculations. For example, here is a function that just
    prints the circumference of a circle:


    ```

    calccuml.m

    function calccuml(radius)

    % calccuml displays the circumference of a circle

    % but does not return the value

    % Format: calccuml(radius)


    disp(2 * pi * radius)

    end

    ```


    This function prints the circumference, but there is no way to store the value
    so that it can be used in subsequent calculations:


    ```

    >> calccuml(3.3)

    20.7345

    ```


    Since no value is returned by the function, attempting to store the value in a
    variable will be an:


    ```

    >> c = calccuml(3,3)

    ??? Error using => calccuml

    Too many output arguments.

    ```'
