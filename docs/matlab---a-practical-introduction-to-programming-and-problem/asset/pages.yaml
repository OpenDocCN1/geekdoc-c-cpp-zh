  md: '# CHAPTER 14 Sights and Sounds


    For an image that has $m \times n$ pixels, the true color matrix would be a three-dimensional
    (3D) matrix with the size $m \times n \times 3$. The first two dimensions represent
    the coordinates of the pixel. The third index is the color component:(:,:,1) is
    the red, (:,:,2) is the green, and (:,:,3) is the blue.


    The indexed representation instead would be an $m \times n$ matrix of integers,
    each of which is an index into a colormap matrix, which is size $p \times 3$ (where
    $p$ is the number of colors available in that particular colormap). Each row in
    the colormap has three numbers representing one color: first the red, then the
    green, and then the component.


    # 14.2.1 Colormaps


    When an image is represented using a colormap, there are two matrices:


    +   - The colormap matrix, which has dimensions $p \times 3$ where $p$ is the
    number of colors available. Every row stores three real numbers in the range from
    0 to 1, representing the red, green, and blue components of the color.

    - The image matrix, with dimensions $m \times n$. Every element is an index into
    the colormap, which means it is an integer in the range 1 to $p$.


    | Image matrix Colormap matrix |

    | | n | 1 2 3 |

    |---|---|---|---||

    | 1 | | | | |

    | | | | | |

    | | | x | |

    | | | | | |

    | m | | x |

    | | | p |


    MATLAB has several built-in colormaps that are named; these can be seen and can
    be set using the built-in function colormap. The reference page on colormap displays
    them. Calling the function colormap without passing any arguments will return
    the current colormap, which by default is jet.


    The following stores the current colormap in a variable map, gets the size of
    the matrix (which will be the number of rows in this matrix, or in other words,
    the number of colors, by three columns), and displays the first five rows in this
    colormap. If the current colormap is the default jet, the following will be the
    result:'
