    # Pedagogical Features


    There are several pedagogical tools that are used throughout this book that are
    intended to make it easier to learn the material. A list of Key Terms covered
    in each chapter, sequence, is on the first page.


    First, the book takes a conversational tone with sections called Quick Question!
    These are designed to simulate thought about the material that has just covered.
    A question is posed, and the answer is given. It will be most beneficial to the
    reader to think about the question before reading the answer! In any case, these
    sections should not be skipped over the answers often contain useful information.


    Practice problems are given throughout the chapters. These are very simple problems
    that serve as drills of the material just covered.


    When certain problems are introduced, they are both solved with The programming
    Concept and The Efficient Method. This facilitates understanding the built-in
    functions and operators in MATLAB as well as the underlying programming concepts.
    The Efficient Method boxes highlight methods that will save time for the programmer,
    and in many cases are faster to execute in MATLAB, well.


    Additionally, to aid the reader:


    +   - Identifier names (variables and user-defined functions) are shown in italics
    (as filenames and file extensions).

    - MATLAB function names are shown in bold.

    - Reserved words are shown in bold and underline.

    - Key important terms are shown in bold and italic.


    The end-of-chapter summary counts are, where applicable, several sections:


    +   - Common Pitfalls: A list of mistakes that are made, and how to avoid them.

    - Programming Style Guidelines: To encourage the creation of “good” programs that
    others can actually understand, the programming chapters have guidelines that
    make programs easier to read and understand, and therefore easier to work with
    and modify.

    - MATLAB Reserved Words: A list of the reserved key words in MATLAB. Throughout
    the text, these are shown in bold, underlined type.'
