    # 11.2 ANIMATION


    In this section we will examine a couple of ways to animate a plot. These are
    visuals, so the results can''t really be shown here; it is necessary to type these
    into MATLAB to see the results.


    We''ll start by animating a plot of sin(x) with the vectors:


    ```

    >> x = -2*pi : 1/100 : 2*pi;

    >> sin(x);

    ```


    This results in points that we will be able to see the result using the built-in
    comet function, which shows the plot by first showing the point (x(1), y(1)),
    and then on to the point (x(2), y(2)), and so on, leaving a trail (like a comet!)
    of all of the previous points.


    ![](img/106804b84dd25648ed57173c2c911b77_343_1.png)


    The end result looks similar to the result of plot(x,y).


    Another way of animating is to use the built-in function movie, which displays
    recorded movie frames. The frames are captured in a loop using the built-in function
    getframe, and are stored in a matrix. For example, the following script'
