  md: '# Selection Statements


    # KEY TERMS


    | selection statements | logical expression | temporary variable |

    | branching statements | relational operators | error-checking |

    | condition | logical operators | nesting statements |

    | relational expression | truth table | cascading if-else |

    | Boolean expression | action | “is” functions |


    # CONTENTS


    +   3.1 Relational Expressions. 83


    +   3.2 The If-Else Statement ..... 87


    +   3.4 Nested-If-Else Statements .... 93


    +   3.5 The Switch Function .... 98


    +   3.6 The Menu Function ....100


    +   3.7 The "Is" Functions in MATLAB ....102


    In the scripts and functions we''ve seen thus far, every statement was executed
    in sequence. That is not always desirable, and in this section we''ll see how
    to make choices as to whether statements are executed or not, and how to choose
    between among statements. The statements that accomplish this are called **selection**
    or **branching** statements.


    The *MATLAB* software has two basic statements that allow choices: the *if* and
    the *switch* statement. The **if** statement uses expressions that are logically
    true or false with optional **else** clauses for branching. The **if** statement
    uses relational and logical operators. MATLAB also has "is" functions that ask
    whether something is **true** or **false**; these functions are covered at the
    end of this chapter.


    # 3.1 RELATIONAL EXPRESSIONS


    **Conditions** in *if* statements uses expressions that are conceptually true
    or false. These expressions are called *relational expressions*; they *logical
    expressions*. These expressions can use both **relational operators**, which relate
    two expressions of compatible types, and **logical operators**, which operate
    on logical operands.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'The relational operators in MATLAB are:


    | Operator | Meaning |

    | --- | --- |

    | > | greater than less than |

    | >= | greater than or equals |

    | <= | less or equals |

    | == | equality |

    | ~= | inequality |


    All concepts should be familiar, the operators used may be different from those
    used in other programming languages or in mathematics classes. In particular,
    it is important to note that the operator for equality is two equal signs, not
    a single equal sign (since the single equal sign is always used as the assignment
    operator).


    For numerical operands, the use of these operators is straightforward. For example,
    3 < 5 means "3 less than 5", which is conceptually a true expression. In MATLAB,
    as in many programming languages, "true" is represented by the logical value 1,
    and "false" is represented by the logical value 0. So, the expression 3 < 5 actually
    displays in the Command Window the value 1 (Logical) in MATLAB. Displaying the
    result of expressions like this in the Command Window demonstrates the values
    of the expressions.


    ```

    >> 3 < 5

    ans =

    1

    ```


    The result type is logical. MATLAB also has built-in true and false. true is equivalent
    to logical(1) and false is equivalent to logical(0). In some versions of MATLAB,
    the value shown for the result of these expressions is true or false in the Workspace
    Window.) Although these values are logical, mathematical operations could be performed
    on the resulting 1 or 0.


    ```

    >> 2 > 9

    ans =

    0

    ```


    ```

    >> 5 < 7

    ans =

    1

    ```


    ```

    >> ans + 3

    ans =

    4

    ```'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'Comparing characters (e.g., ''a'' < ''c'') is also possible. Characters are
    compared using their ASCII equivalent values in the character encoding. ''a''
    < ''c'' is a true expression, because the character ''a'' comes before the character
    ''c''.


    ```

    >> ''a'' < ''c''

    ans =

    1

    ```


    The logical operators are:


    | Operator | Meaning |

    |---|---|

    | || | or (for scalars) |

    | && | and (for scalars) |

    | ~ | not |


    > Note

    The logical operators for matrices will be covered in Chapter 5.


    All logical operators operate on logical or Boolean operands. The not operator
    is a unary operator; the others are binary. The not operator will take a logical
    expression, which is true or false, and give the opposite value. For example,
    ~(3 < 5) is false since ~(3 < 5) is true. The result is true if either of the
    operands are true, and false only if both operands are false. The and operator
    operates on two logical operands. The result of an expression is true only if
    both operands are true; it is false if either or both are false.


    In addition to these logical operators, MATLAB also has a function xor, which
    is the exclusive-or-function. It returns logical true if one (and only one) of
    the arguments is true. In the example following the first argument is true, so
    the result is true:


    ```

    >> xor(3 < 5, ''a'' > ''c'')

    ans =

    1

    ```


    In this example, both arguments are true so the result is false:


    ```

    >> xor(3 < 5, ''a'' < ''c'')

    ans =

    0

    ```


    Given the logical values of true and false in variables x and y, the truth table
    (see Table 3.1) shows how the logical operators work for all combinations. Note
    that the logical operators are commutative (e.g., x || y is the same as y || x).'
  merge: -1
  pgno: 99
- img_proc: true
  md: '| Table 3.1 Truth Table for Logical Operators |

    | x | y | ~x | x || y | x && y | xor(x,y) |

    |---|---|---|---|---|---||

    | true | true | false | true | true | false |

    | true | false | false | true | false | true |

    | false | false | true | false | false | false |


    As with the numerical operators, it is important to know the operator precedence
    rules. Table 3.2 shows the rules for the operators that have been covered far
    in order of precedence.


    | Table 3.2 Operator Precedence Rules |

    | Operators | Precedence |

    |---|---|

    | parentheses: () | highest |

    | transpose and power '', ^ | |

    | unary: negation (-), not (~) | |

    | multiplication, * /\ | |

    | addition, subtraction +, - |

    | colon operator : | |

    | relational <, <=, >=, ==, ~= |

    | and && | |

    | or || |

    | assignment = | lowest |


    Assume there is a variable x that has initialized. What would be the value of
    the expression


    3 < x < 5


    if the value of x is 4? What if the value of x is 7?


    **Answer:** The value of this expression will be logical true, or 1, regardless
    of the value of the variable x. Expressions are evaluated from left to right,
    so the first expression 3 < x will be evaluated. There are only two possibilities:
    either this will be **true** or **false**, which means that the


    expression will have the value 1 or 0. Then, the rest of the expression will be
    evaluated, which will be either 1 < 5, or 0 < 5. Both of these expressions are
    **true**.

    So, the value of x does not matter. The expression 3 < x < 5 will be **true**
    regardless of the value of the variable x. This is a logical error, it would not
    enforce the desired range. If we wanted an expression that was **logical true**
    if x was in the range from 3 to 5, we could write 3 < x && x < 5.'
