  md: "# 4.1 The For Loop\n\n1\n2\n3\n4\n5\n\nWhat the **for** statement accomplished\
    \ was to print the value of $i$ and then the newline character for every value\
    \ of $i$, from 1 through 5 in 5 steps of $i$. The first thing that happens is\
    \ $i$ is initialized to have the value 1. The action of the loop is executed,\
    \ which is `printf` statement that prints the value of $i$ (1), and then the newline\
    \ character to move the cursor down. Then, $i$ is incremented to have the value\
    \ of 2.\n\nNext, the action of the loop is executed, which prints 2 and the newline.\
    \ Then, $i$ is incremented to 3 and is printed, then $i$ is incremented to 4 and\
    \ then finally $i$ is incremented to 5 and is printed. The final value of $i$\
    \ is 5; this value can be used once the loop has finished.\n\n# QUICK QUESTION!\n\
    \nHow could you print the following column of integers?\n\n**Answer:** In a loop,\
