  md: '# CHAPTER 14 Sights and Sounds


    The position vector specifies [left bottom width height]. The first two numbers,
    the left and bottom, are the distance that the lower left corner of the figure
    box is from the lower left of the monitor screen (first from the left and then
    from the bottom). The last two are the width and height of the figure box. All
    of these are in the default units of pixels.


    The ''Visible'' property ''on'' means that the Figure Window can be seen. When
    creating a GUI, however, the normal procedure is to create the parent Figure Window
    but make it invisible. Then, all user interface objects are added to it, and properties
    are set. When everything has been completed, the GUI is made visible.


    Most user interface objects are created using the uic function. The ''Style''
    property defines the type of object, as a string. For example, ''text'' is of
    a static text box, which is normally used as a label for other objects in the
    GUI, or for instructions.


    The following example creates a GUI that just consists of a static text box in
    a Figure Window. The figure is first created but made invisible. The color is
    white, and it is given a position. Storing the handle of this figure in a variable
    allows the script to refer to it later on, to set properties, for example. The
    uic function is used to create a text box, position it (the vector specifies [left
    bottom width height]) within the Figure Window itself), and put a string in it.


    Note that the position is within the Figure Window, not within the screen. A name
    is put on the top of the figure. The movegui function moves the GUI (the figure)
    to the center of the screen. Finally, when everything has been completed, the
    GUI is made visible.


    ```

    simpleGui.m

    function simpleGui

    % simpleGui creates a simple GUI with just a static text box

    % Format: simpleGui or simpleGui()


    % Create the GUI for invisible now make it invisible while

    % it is being initialized

    f = figure(''Visible'',''off'',''Color'',''white'',''Position'',...,[300,400,450,250]);

    htext = uicontrol(''Style'',''text'',''Position'',...,[200,50,100,25],''String'',''My
    First GUI string'');


    % Put a name on it and move it to the center of the screen

    set(f,''Name'',''Simple GUI'')

    movegui(f,''center'')\n

    % Now the GUI is made visible

    set(f,''Visible'',''on'');

    end

    ```'
