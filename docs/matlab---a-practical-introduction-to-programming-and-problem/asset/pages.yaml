  md: "# 4.3 While Loops\n\n```\n>> mat = round(rand(3,4)*19+1)\nmat =\n    15 19\
    \ 17 5\n    6 14 13 13\n    9 5 3 13\n```\n\n```\n>> mymatmin(mat)\nans =\n  \
    \  6 5 3 5\n```\n\n# QUICK QUESTION!\n\nWould the function *mymatrain* in the\
    \ Practice 4.7 also work for a vector argument?\n**Answer:** Yes, it should, since\
    \ a vector is a subset of a matrix. In this case, one of the loop actions would\
    \ be executed only one time (for the rows if it is a row vector, or for the columns\
    \ if it is a column vector).\n\n# 4.3 WHILE LOOPS\n\nThe **while** statement is\
    \ used as the conditional loop in MATLAB; it is used to repeat an action when\
    \ ahead of it is not *known how many* times the action will be repeated. The general\
    \ form of the **while condition** statement is:\n\n```\nwhile condition\n    action\n\
    end\n```\n\nThe action, which consists of any number of statement(s), is executed\
    \ as long as the condition is **true}.\n\nThe way it works is that the first condition\
    \ is evaluated. If it is logically **true**, the action is executed. So, to begin\
    \ with, **while** statement is just like an **if** statement. However, at that\
    \ point the condition is evaluated again. If it is still **true**, the action\
    \ is executed. Then, the condition is evaluated again. If it is **true**, the\
    \ action is executed again. Then, the condition is... eventually, this will stop!\
    \ Everything in the action has to change something in the condition so that must\
    \ eventually become **false** to avoid an *infinite loop*. (If this happens, Ctrl-C\
    \ will exit the loop.)\n\nAs an example of that, we will write a function that\
    \ will find the first factor that is greater than the input argument *high*. Previously,\
    \ we wrote a function to calculate a particular factor. For example, to calculate\
    \ 5! we found the product 1 * 2 * 3 * 4 * 5. In this case the **for** loop was\
    \ used, since it was known that the loop would be repeated five times. Now, we\
    \ do not know how many times the loop will be repeated."
  merge: -1
  pgno: 153
- img_proc: true
  md: "The basic algorithm is to have two variables, one iterates through the values\n\
    1, 2, 3, and so on, and one that stores the factorial of the iterator at each\
    \ step.\nWe start with 1, and 1 factorial, which is 1. Then, we check the factorial.\
    \ If it is\nnot greater than *high*, the iterator variable will then increment\
    \ to 2, and find its\nfactorial (2). If this is not greater than *high*, the iterator\
    \ will then increment to 3,\nand the function will find its factorial (6). This\
    \ continues until we get the first\nfactorial that is greater than *high*.\n\n\
    So, the process of incrementing a variable and finding its factorial is repeated\n\
    until we get the first value greater than *high*. This is implemented using a\n\
    while loop:\n\n```\nfactgigh.m\nfunction facgt = factgigh(high)\n% factgigh returns\
    \ the first factorial > input\n% Format: factgigh(inputInteger)\n\ni=0;\nfac=1;\n\
    while fac <= high\n  i=i+1;\n  fac = fac * i;\nend\nfacgt = fac;\nend\n```\n\n\
    An example of calling the function, passing 5000 for the value of the input ar-\n\
    gument *high*, follows:\n\n```\n>> factgigh(5000)\nans =\n5040\n```\n\nThe iterator\
    \ variable *i* is initialized to 0, and the running product variable *fac*, which\n\
    will store the factorial of each value of *i*, is initialized to 1. The first\
    \ time the *while*\nloop is executed, the condition is *true*: 1 is less than\
    \ or equal to 5000. So, the action\nof the loop is executed, which is to increment\
    \ *i* to 1 and *fac* becomes 1 (1 * 1).\n\nAfter the execution of the loop, the\
    \ condition is evaluated again.\nSince it will still be *true*, the action is\
    \ executed: ≤ *i* is incremented to 2, and *fac*\nwill get the value 2 (1 * 2).\
    \ The value is still ≤5000, so the action will be be-\necuted: *i* will be incremented\
    \ to 3, and *fac* will get the value 6 (2 * 3). This\ncontinues, until the first\
    \ value of *fac* is found to be greater than 5000. As soon\nas *fac* gets to this\
    \ value, the condition will be *false* and the *while* loop will end.\nAt that\
    \ point the factorial is assigned to the output argument, which returns\nt value."
