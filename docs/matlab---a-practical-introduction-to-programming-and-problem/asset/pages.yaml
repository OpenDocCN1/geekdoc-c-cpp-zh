  md: '# 2.2.1 Documentation


    It is very important that all scripts are documented well, so that people can
    understand the script does and how it accomplishes its task. One way of documenting
    a script is to put comments in it. In MATLAB, a comment is anything from a % to
    the end of that particular line. Comments are completely ignored when the script
    is executed. To put in a comment, simply type the % symbol at the beginning of
    a line, or select the lines and then click on Text and then Comment and the Editor
    will put the % symbols for the comments.


    For example, the previous script to calculate the area of a circle could be modified
    to have comments:


    ```

    scriptlb.m

    % This script calculates the area of assigned radius


    % The first radius is assigned

    radius = 5

    % The area is calculated based on the radius

    area = pi * (radius^2)

    ```


    The first comment at the beginning of script describes what the script does. Then,
    though different parts of the script (not usually a comment for every line, however!).
    Comments don''t affect a script does, so the output from this script would be
    the same as for the previous version.


    The help command in MATLAB works with scripts as well as built-in functions. The
    first block of comments (defined as contiguous lines in the beginning) will be
    displayed. For example, for scriptlb:


    ```

    >> help scriptlb

    This script calculates the area of the circle

    ```


    The reason that a blank line was inserted in the script between the first two
    comments is that otherwise would have been interpreted as one contiguous comment,
    and both lines would have been displayed with help. The very first comment line
    is called the "H1 line"; it is what the function lookfor searches through.


