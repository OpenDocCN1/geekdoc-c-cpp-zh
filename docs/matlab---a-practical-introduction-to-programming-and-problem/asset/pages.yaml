    # 2.7 USER-DEFINED FUNCTIONS THAT RETURN A SINGLE VALUE


    We have already seen many functions in MATLAB. We have used many built-in functions
    such as sin, fix, abs, and double. In this section, user-defined functions will
    be introduced. These are functions that the program defines, and those we use
    in either the Command Window or a script.


    There are several different types of functions. For now, we will concentrate on
    the kind of function that calculates and returns a single result, much like built-in
    functions such as sin and abs. Other types of functions will be introduced in
    Chapter 6.


    First, let us review some of what we already know about functions, including the
    use of built-in functions. Although, by now, the use of these functions is straightforward,
    explanations will be given in some detail to compare and contrast to the use of
    user-defined functions.


    The length function is an example of a built-in function that calculates a single
    value; it returns the length of the vector. For an example,


    ```

    length(vec)

    ```


    is an expression that represents the number of elements in the vector vec. This
    expression could be used in the Command Window or in a script. Typically, the
    value returned from this expression might be assigned to a variable:


    ```

    >> vec = 1:3:10;

    >> lv = length(vec)

    lv =

    4

    ```'
