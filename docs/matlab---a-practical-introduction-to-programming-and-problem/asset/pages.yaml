    Is there a rot180 function? Is there a rot-90 function (to rotate the clockwise)?

    **Answer:** Not exactly, but the rot90 function, which is an integer n, the function
    will rotate 90*n degrees. The integer can be positive or negative. For example
    if 2 is passed, the function will rotate the matrix 180 degrees (so, it be the
    same as rotating the matrix of rot90 another 90 degrees).


    If a negative number is passed for n, the rotation would be in the opposite direction,
    that is, clockwise.


    ```

    >> mat

    mat =

    14 61 2 94

    21 28 75 47

    20 20 45 42

    ```


    ```

    >> rot90(mat,-1)

    ans =

    20 21 14

    20 28 61

    45 75 2

    42 47 94

    ```


    ```

    >> rot90(mat,2)

    ans =

    42 45 20 32

    47 75 28 21

    94 2 61 14

    ```


    The function **repcat** means to create a matrix; **repcat(mat,m,n)** creates
    a larger matrix that consist of an m × n matrix of copies of **mat**. For example,
    here is a 2 × 2 round matrix:


    ```

    >> intmat = round(rand(2)*100)

    intmat =

    50 34

    96 59

