  md: '# CHAPTER 1 Introduction to MATLAB


    To the right of the Command History Window is the Workspace Window on top and
    to the Command History Window on the bottom. The Command History Window shows
    commands that have been entered, not just in the current session (the current
    Command Window), but previously as well. (The Workspace Window will be described
    in the next section.) To the left of the Command Window is the Current Folder
    Window. This shows the files that are stored in the Current Folder. These can
    be grouped by type, and sorted by name. If a file is selected, information about
    that file is shown on the bottom.


    This default configuration can be altered by clicking on Desktop, or by the icons
    at the top right corner of each window. These include an “x” that will close a
    particular window, and a curled arrow that in its initial state pointing to the
    upper right allows one to undock that window. Once undocked, clicking the curled
    arrow pointing to the lower right will dock the window again.


    # 1.3 VARIABLES AND ASSIGNMENT STATEMENTS


    To store a value in a MATLAB session, or in a program, a variable is used. The
    Workspace Window shows variables that have been created. One easy way to create
    a variable is to use an assignment statement. The format of an assignment statement
    is


    ```

    variablename = expression

    ```


    The variable is always on the left, followed by the = symbol, which is the assignment
    operator (unlike in mathematics, the single equal sign does not mean equality),
    followed by an expression. The expression is evaluated and then that value is
    stored in the variable. For example, this is the way it would appear in the Command
    Window:


    ```

    >> mynum = 6\mynum =

    6

    >>

    ```


    Here, the user (the person working in MATLAB) typed “mynum = 6” at the prompt,
    and MATLAB stored the integer 6 in the variable called mynum, and then displayed
    the result followed by the prompt again. Since the equal sign is the assignment
    operator, and does not mean equality, the statement should be read as “mynum gets
    the value of 6” (not “mynum equals 6”).


    Note that the variable name must always be on the left, and the expression on
    the right. An error will occur if these are reversed.'
