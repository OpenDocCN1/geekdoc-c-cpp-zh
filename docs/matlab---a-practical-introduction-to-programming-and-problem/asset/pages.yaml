  md: '# THE EFFICIENT METHOD


    To use the built-in function trap to accomplish the same thing, the x vector is
    created with the values 2, 3, and 4:


    ```

    >> x = 2:4;

    >> y = f(x)

    >> trap(x,y)

    ans

    55

    ```


    In these examples, straight lines, which are first-order polynomials, were used.
    Other methods involve higher-order polynomials. The built-in function quad uses
    Simpson''s method. Three arguments are normally passed to it: the handle of the
    function, and the limits a and b. For example, for the previous function:


    ```

    >> quad(f,2,4)

    ans=

    54

    ```


    # 15.4.2 Differentiation


    The derivative of a function y=f(x) is written as df/dx or f''(x), and is defined
    as the rate of change of the dependent variable y with respect to x. The derivative
    is the slope of the line tangent to the function at a given point.


    MATLAB has a function polyder, which will find the derivative of a polynomial.
    For the example, x²+2x²-4x+3, which would be represented by the vector [1 2 -4
    3], the derivative is found by:


    ```

    >> origp = [1 2 -4 3];

    >> diffp = polyder(origp)

    diffp =

    3 4 -4

    ```


    which shows that the derivative is the polynomial 3x²+4x−4. The function polyval
    can be used to find the derivative for certain values of x, such as for x=1, 2,
    and 3:


    ```

    >> polyval(diffp, 1:3)

    ans =

    3 16 35

    ```


    The derivative can be written as the limit


    > f''(x) = lim_{h→0} (f(x+h)-f(x))/h


    and can be approximated by a difference equation.


    Recall that MATLAB has a built-in function, diff, which returns the differences
    between consecutive elements in a vector. For a function y=f(x) where x is'
  merge: -1
  pgno: 503
