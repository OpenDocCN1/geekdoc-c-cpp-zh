  md: "Then, scan the rest of the vector (from the second element down) for the next\
    \ smallest (or, the smallest in the rest of the vector). found, put it in the\
    \ first element of the rest of the vector (again, exchanging).\n\nContinue doing\
    \ this for the rest of the vector. Once the next-to-last has been placed in the\
    \ correct location in the vector, by default the last number has been as well.\n\
    \nWhat is important in each pass through the vector is not knowing what the smallest\
    \ value is, but where it is that the exchange can be made.\n\nThis table shows\
    \ the progression. The left column shows the original vector. The second column\
    \ (from the left) shows that the smallest number, 70, is now in the first element\
    \ of the vector. It was put there by exchanging with what had been in the first\
    \ element, eighty-five. This continues element by element, until the vector has\
    \ been sorted.\n\n| 85 | 70 | 70 | 70 | 70 | 70 |\n| 70 | 85 | 80 | 80 | 80 |\
    \ 80 |\n| 100 | 100 | 100 | 85 | 85 | 85 |\n| 95 | 95 | 95 | 95 | 91 | 91 |\n\
    | 80 | 80 | 85 | 100 | 100 | 95 |\n| 91 | 91 | 91 | 91 | 95 | 100 |\n\nThis is\
