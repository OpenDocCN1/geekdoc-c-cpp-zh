    \ endless!\n\nThis is actually an example of a particular kind of nested if-else\
    \ statement called cascading if-else statement. This is a type of nested if-else\
    \ statement in which the conditions and actions cascade in a staircase pattern\
    \ (similar to a waterfall).\n\n# 3.4.1 The elseif clause\n\n![](img/106804b84dd25648ed57173c2c911b77_108_0.png)\n\
