  md: '# 8.2.2 Passing structures to functions


    An entire structure can be passed to a function, or individual fields can be passed.
    For example, here are two different versions of a function that calculates the
    profit on a software package. The profit is defined as the price minus the cost.


    In the first version, the structure variable is passed to the function, the function
    must use the dot operator to refer to the *price* and *cost* fields of the input
    argument.


    ```

    calcprof.m

    function profit = calcprof(packstruct)

    % calcprofit calculates the profit for a

    % software package

    % Format: calcprof(structure w/ price & cost fields)


    profit = packstruct.price - packstruct.cost;

    end


    >> calcprof(package)

    ans =

    19.9600

    ```


    In the second version, just the *price* and *cost* fields are passed to the function
    using the dot operator in the function call. These are passed to two scalar input
    arguments in the function header, so there is no reference to a structure variable
    in the function itself, and the dot operator is not needed in the function.


    ```

    calcprof2.m

    function profit = calcprof2(oneprice, onecost)

    % Calculates the profit for a software package

    % Format: calcprof2(price, cost)


    profit = oneprice - onecost;

    end


    >> calcprof2(package.price, package.cost)

    ans =

    19.9600

    ```


    It is important, as always with functions, to make sure that the arguments in
    the function call correspond one-to-one with the input arguments in the function
    header. In of *calcprof*, a structure variable is passed to an input argument,
    which is a structure. For the second function *calcprof2*, two individual fields,
    which are *double* values, are passed to two *double* input arguments.'
