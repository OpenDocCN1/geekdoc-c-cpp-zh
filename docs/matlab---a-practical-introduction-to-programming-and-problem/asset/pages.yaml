    # 11.1.2 Plot types


    Besides **plot** and **bar**, there are many other plot types such as *histograms*,
    *stem plots*, and *pie charts*, as well as other functions that customize graphs.


    Described in this section are some of the other plotting functions. The functions
    **bar**, **barth**, **area**, and **stem** essentially draw the same data as the
    **plot** function, but the **bar** function draws a bar chart (as we have seen
    before), **bar** draws a horizontal bar chart, **area** draws the plot as a continuous
    curve and fills in the under that is created, and **stem** draws a stem plot.


    For example, the following script creates a Figure Window that uses a $2 \times
    2$ **sub-plot** to demonstrate these four plot types using the same data points
    (see Figure 11.2).


    ```

    subplots.m

    % Subplot to show plot types


    year = 2007:2011;

    pop=[0.9 1.4 1.7 1.3 1.8];

    subplot(2,2,1)\ubar(year,pop)

    ```'
