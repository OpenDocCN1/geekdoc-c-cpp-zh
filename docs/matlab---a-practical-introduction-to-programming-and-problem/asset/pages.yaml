    # 1.4 EXPRESSIONS


    Expressions can be created using values, variables that have already been created,
    operators, built-in functions, and parentheses. For numbers, these can include
    operators such as multiplication, and functions such as trigonometric functions.
    An example of such an expression is:


    ```

    >> 2 * sin(1.4)

    ans =

    1.9709

    ```


    # 1.4.1 The format function and ellipsis


    The default in MATLAB is to display numbers with four decimal places, as shown
    in the previous example. (The default means if you do not specify otherwise, this
    is what you get.) The format command can be used to specify the output of expressions.


    There are many options, including making the format short (the default) or long.
    For example, changing the format to long will result in 15 decimal places. This
    will remain in effect until the format is changed back to short, as demonstrated
    in the following.


    ```

    >> format long

    >> 2 * sin(1.4)

    ans =

    1.970899459976920

    ```


    ```

    >> format short

    >> 2 * sin(1.4)

    ans =

    1.9709

    ```


    The format command can also be used to control the spacing between the MATLAB
    command or expression and the result; it can be either loose (the default) or
    compact.'
