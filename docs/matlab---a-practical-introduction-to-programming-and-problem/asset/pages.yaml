  md: '# Advanced Functions


    # KEY TERMS


    | anonymous functions | recursive functions | inner function |

    | function handle | variable number of | recursion |

    | function function | arguments | infinite recursion |

    | nested functions | outer function |


    # CONTENTS


    +   10.1 Anonymous Functions

    301


    +   10.2 Uses of Function Handles

    303


    +   10.3 Variable Numbers of Arguments

    306


    +   10.4 Nested Functions

    312


    +   10.5 Recursive Functions

    313


    Functions were introduced in Chapter 2, and then expanded on Chapter 6. In this
    chapter, several advanced features of functions and types of functions will be
    described. *Anonymous functions* are simple one-line functions that are called
    using *function handle*. Other of function handles will also be demonstrated,
    including *function functions*. All of the functions that we have seen so far
    had a well-defined number of input and output arguments, but we will see that
    the number of arguments can be varied. *Nested functions* are also introduced,
    which are functions contained within other functions. Finally, *recursive functions*
    are functions that call themselves. A recursive function can return a value, or
    may simply accomplish a task as printing.


    # 10.1 ANONYMOUS FUNCTIONS


    An anonymous function is a very simple, one-line function. The advantage of is
    that it does not have to be stored in an M-file. This can greatly simplify programs,
    since often calculations are very simple, and the use of anonymous functions reduces
    the number of M-files necessary for a program. Anonymous functions can be created
    in the Command Window or in any script. The syntax for an anonymous function follows:


    ```

    fhandle = @ (arguments) functionbody;

    ```'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# CHAPTER 10 Advanced Functions


    where fndhandle stores the function handle; it is essentially a way of referring
    to the function. The handle is assigned to the variable name using the @ operator.
    The arguments, in parentheses, correspond to the argument(s) that are passed to
    the function, just like any other kind of function. The functionbody expression.
    For example, here is an anonymous function that calculates the area of a circle:


    ```

    >> cirarea = @ (radius) pi * radius .^2;

    ```


    The function name is cirarea. One argument is passed to the input argument radius.
    The body of the expression is pi * radius .^2. The .^ operator is used so that
    a vector of radii can be passed to the function.


    The function is then called using the handle and passing arguments to it. The
    function call using the function handle looks just like a function call using
    a function name:


    ```

    >> cirarea(4)

    ans =

    50.2655

    >> cirarea(1:4)

    ans =

    3.1416 12.5664 28.2743 50.2655

    ```


    Unlike stores in M-files, if no argument is passed to an anonymous function, the
    parentheses must still be in the function definition and in the function call.
    For example, following is an anonymous function that prints a random number with
    two decimal places, as well as a call to this function:


    ```

    >> prtran = @ () fprintf(''%.2f\n'',rand);

    >> prtran()

    0.95

    ```


    Typing the name of the function handle will display its contents, as is the function
    definition.


    ```

    >> prtran

    prtran =

    @ () fprintf(''%.2f\n'',rand);

    ```


    This is why parentheses must be used to call the function, even though no arguments
    are passed.


    An anonymous function can be saved to a MAT-file, and then it can be loaded when
    needed.


    ```

    >> cirarea = @ (radius) pi * radius .^2;

    >> save anonfns cirarea

    >> clear

    >> load anonfns

    ```'
