    # 9.1.3 Writing to files


    There are several lower-level functions that can write to files. We will concentrate
    on the **printf** function, which can be used to write to a file and also append
    to a file.


    To write one line at a time to a file, the **printf** function can be used. Like
    the other low-level functions, the file must be opened first for writing (or appending)
    and should be closed once the writing has been completed. We have, of course,
    been using **printf** to write to.. The screen is the default output device, if
    a file identifier is not specified, the output goes to the screen; otherwise,
    it goes to the specified file. The file identifier number is 1 for the screen.
    The general form is


    ```

    printf(fid, ''format'', variable(s));

    ```


    The **printf** function actually returns the number of bytes that was written
    to the file, so if it is not desired to see that number, the output should be
    suppressed with a semicolon as shown here.


    The following is an example of writing to a file named *try.txt*.


    ```

    >> fid = fopen(''try.txt'', ''w'');

    >> for i = 1; i <= 3 {

    >>     printf(fid, ''The loop iteration is %d\n'', i);

    >> }

    >> fclose(fid);

    ```


    The permission string in the call to the **fopen** function specifies that the
    file is opened for writing. Just like when reading from a file, the results from
    **fopen** **fclose** should really checked to make sure they were successful.
    The **fopen** function attempts to open the file for writing. If the file already
    exists, the contents are erased it is as if the file had not existed. If the file
    does not currently exist (which would be the norm), a new file is created. The
    **fopen** could fail, for example, if there''s not space to create this new file.


    > Note

    When writing to the screen, the value returned by **printf** is not seen, but
    could be stored in a variable.'
