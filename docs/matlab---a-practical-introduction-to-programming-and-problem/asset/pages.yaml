    # 14.1 SOUND FILES


    A sound is an example of a continuous signal that is sampled to result in a discrete
    signal. In this case, sound waves traveling through the air are recorded as a
    set of measurements that can be used to reconstruct the original sound, as closely
    as possible. The sampling or frequency is the number of samples taken per unit
    time, for example. Second signals are usually measured in Hertz (Hz).


    In MATLAB, the discrete sound is represented by a vector, and the frequency is
    measured in Hertz. MATLAB has several MAT-files that store various sound data
    in a variable y and the frequency in a variable Fs. These MAT-files include chirp,
    group, laughter, splat, train, and handler. It is a built-in function, sound,
    that will send a sound signal to an output device as speakers.'
