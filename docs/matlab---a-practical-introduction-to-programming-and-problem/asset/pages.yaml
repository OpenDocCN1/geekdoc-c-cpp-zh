  md: '# 7.2.7 Evaluating a string


    The function used to evaluate a string. If the string contains a call to a function,
    then that call is executed. For example, in the following, the string ''plot(x)''
    is evaluated to be a call to the plot function, and it produces the plot shown
    in Figure 7.2.


    ```

    >> x = [2 6 8 3];

    >> eval(''plot(x'')

    ```


    This would be useful if the user entered the name of the type of plot to use.
    In this example, the user chooses the type of plot to use for some queries. The
    string that the user enters (in this case, ''bar'') is concatenated with the string
    ''x'' to create the string ''bar(x)''; this is then evaluated as a call to the
    bar function as seen in Figure 7.3. The name of the type of plot is used in the
    title.


    ```

    >> x = [9 7 10 9];

    >> plot = input(''What type of plot?:'', ''s'');

    What type of plot: bar

    >> eval([plot, ''(x)]);

    >> title(''Student #'')

    >> xlabel(''Quiz Grade'')

    >> ylabel(''Quiz Grade'')

    ```


