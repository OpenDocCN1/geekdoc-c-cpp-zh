    # 2.5.2 Simple related plot functions


    Other functions that are used in customizing plots include clf, figure, hold,
    legend and grid. Brief descriptions of these functions are given here; use help
    to find out about them:


    clf clears the Window by removing everything from it.


    figure creates a new, empty Figure Window when called without any arguments. Calling
    it as figure(n) where n is an integer is a way of creating and maintaining multiple
    Figure Windows, and of referring to each individually.


    hold is a toggle that freezes the current graph in the Figure Window, so that
    new plots will be superimposed on the current one. hold by itself is a toggle,
    so calling this function turns on the hold, and then the next time it turns off.
    Alternatively, the commands hold on and hold off can be used.


    legend displays strings passed to it in a legend box in the Figure Window, in
    order of the plots in the Figure Window.


    grid displays lines on a graph. By itself, it is a toggle that turns the grid
    lines on and off. Alternatively, the commands grid on and grid off can be used.


    There are many other plot types. We will see more in Chapter 11, but another simple
    plot type is a bar chart.


    For example, the following script creates two Figure Windows. First, it clears
    the Figure Window. Then it creates a vector and two vectors. In the first Figure
    Window, it plots the y values using a bar chart. In the second Figure Window,
