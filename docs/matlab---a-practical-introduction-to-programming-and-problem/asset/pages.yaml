  md: 'polynomial in the form $ax^2 + bx + c$, it means finding the values of a, b,
    and c that yield the best fit. Finding the straight line that goes through data
    mean finding the values of a and b in the equation $ax + b$.


    MATLAB has a function to do this, called polyfit. The function polyfit finds the
    coefficients of the polynomial of the specified degree that fits the data using
    a least squares algorithm. There are three arguments passed to the function: the
    vectors that represent the data, and the degree of the desired polynomial. For
    example, to fit a straight line (degree 1) through the points representing temperatures,
    to fit a line the polyfit function would be


    ```

    >> polyfit(x,y,1)

    ans =

    0.0000 67.6000

    ```


    which says that the best straight line is of the form $0x + 67.6$.


    However, from the plot (shown in Figure 15.2), it looks like a quadratic would
    be a much better fit. The following would create the vectors and then fit a polynomial
    of degree 2 through the data points, storing the values in a vector called coeffs.


    ```

    >> x = 2:6;

    >> y = [66 67 72 71 63];

    >> coeffs = polyfit(x,y,2)

    coeffs =

    1.8571 14.8571

    ```


