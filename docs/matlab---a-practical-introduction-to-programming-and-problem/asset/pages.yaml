  md: 'MATLAB® is a very powerful software package that has many built-in tools for
    solving problems and developing graphical illustrations. The simplest method for
    using the MATLAB product is interactive; an expression is entered by the user
    and MATLAB immediately responds with a result. It is also possible to write scripts
    and programs in MATLAB, which are essentially groups of commands that are executed
    sequentially.


    This chapter will focus on the basics, including many operators and built-in functions
    that can be used in interactive expressions. Means of storing values, including
    vectors and matrices, will also be introduced.


    # 1.1 GETTING INTO MATLAB


    MATLAB is a mathematical and graphical software package with numerical, graphical,
    and programming capabilities. It has built-in functions to perform many operations,
    and there are toolboxes that can be added to augment functions (e.g., for signal
    processing). There are versions available for different hardware platforms, in
    both professional and student editions.


    When the MATLAB software is started, a window opens where the main part is the
    Command Window (see Figure 1.1). In the Command Window, you should see:


    ```

    >>

    ```


    The >> is called the *prompt*. In the Student Edition, the prompt instead is:


    ```

    EDU>>

    ```


    In the Command Window, MATLAB can be used interactively. At the prompt, any MATLAB
    command or expression can be entered, and MATLAB will immediately respond with
    the result.


    It is also possible to write *programs* in MATLAB that are contained in *script
    files* or M-files. Programs will be introduced in Chapter 2.


    The following commands can serve as an introduction to MATLAB and allow you to
    get:


    +   - **info** will display contact information for the product.

    - **demo** has demos of some of the features of MATLAB.

    - **help** will explain any command; **help help** will explain how help works.

    - **helpbrowser** opens a Help Window.

    - **lookup** searches through the help for a specific word or phrase. (Note: This
    can take a long time.)


    To get out of MATLAB, either type **quit** at the prompt, or choose File, then
    Exit MATLAB from the menu.'
  merge: -1
