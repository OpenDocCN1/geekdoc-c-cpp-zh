    All strings can be any length, and the lengths of the old and new strings do not
    have to be the same.


    In addition to the string functions that find and replace, there is a function
    that separates a string into two substrings. The strtok breaks a string into two
    pieces; it can be called several ways. The function receives one string as an
    input argument. It looks for the first delimiter or set of characters that act
    as a separator within the string.


    By default, the delimiter is any white space character. The function returns a
    token that is the beginning of the string, up to (but not including) the first
    delimiter. It also returns the rest of the string, which includes the delimiter.
    Assigning the returned values to two variables will capture both of these. The
    format is


    ```

    [ token rest ] = strtok(string)

    ```


    where token and rest are variable names. For example:


    ```

    >> sentencel = ''Hello there'';

    >> [ word rest ] = strtok(sentencel)

    word =

    Hello

    rest =

    there

