    # SUMMARY


    # Common Pitfalls


    +   - Spelling a variable name ways in different places in a script or function.

    - Forgetting to add the second ''s'' argument to the input function when character
    input is desired.

    - Not using the correct conversion character when printing.

    - Confusing fprintf and disp. Remember that only fprintf can format.


    # Programming Style Guidelines


    +   - Especially for longer scripts and functions, start by writing an algorithm.

    - Block of contiguous comments at the top to describe a script

    - Block of contiguous comments under the function header for functions

    - Comments throughout your M-file (script or function) to describe each section

    - Make that the "H1" comment line contains useful information.

    - Use your organization''s style guidelines for block comments.

