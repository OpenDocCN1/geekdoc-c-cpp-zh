  md: '# Preface


    concepts will be explained carefully and systematically. Very basic concepts,
    such as looping to calculate a sum, counting in a conditional loop, and error-checking,
    are not found in many texts but will be covered here.


    # File Input/Output


    Many applications in engineering and the sciences involve manipulating large data
    sets that are saved in external files. Most MATLAB tasks at least mention the
    **save** and **load** functions, and in some cases selected lower-level file input/output
    functions as. Since file input and output is so fundamental to many applications,
    this book will cover several low sheets. Later chapters will also deal with audio
    and image files. These file input/output concepts are introduced: first Load and
    save in Chapter 2, then lower-level functions in Chapter 9, and finally sound
    and images in Chapter 14.


    # User-Defined Functions


    User-defined functions are a very important programming concept, and yet many
    the nuances and differences among concepts such as types of functions and calls
    versus function headers can be confusing to beginning programmers. Therefore,
    these concepts are introduced gradually. First, functions that calculate and return
    one value—arguably the easiest type of functions to understand—are demonstrated
    in Chapter 2. Later, functions that return no values and functions that return
    multiple values are introduced in Chapter 6. Finally, advanced function features
    are shown in Chapter 10.


    # Advanced Programming Concepts


    In addition to the basics, some advanced programming concepts, such as string
    manipulation, data structures (e.g., cell arrays), recursion, anonymous functions,
    and variable number of arguments to functions, are covered. Sorting, searching,
    and indexing are also addressed. All of these are again approached systematically;
    for example, cell arrays are covered before they are used in file input functions
    and labels on pie charts.


    # Problem-Solving Tools


    In addition to the programming concepts, some basic mathematics necessary for
    solving many problems will be introduced. These will include statistical functions,
    solving of linear algebraic equations, and fitting curves to data. The use of
    complex numbers and some calculus (integration and differentiation) will also
    be introduced. The basic math will be explained and the built-in functions in
    MATLAB to perform these tasks will be described.'
