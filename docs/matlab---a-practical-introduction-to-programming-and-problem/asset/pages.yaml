  md: '# 15.2.3 Multiplying complex numbers


    For complex numbers z1 = a + bi and z2 = c + di,


    ```

    z1 * z2 = (a + bi) * (c + di)


    = a*c + a*di + c*bi + bi*di


    = a*c + a*di + c*bi - b*d


    = (a*c - b*d) + (a*d + c*b) i

    ```


    For example, for the complex numbers


    ```

    z1 = 3 + 4i

    z2 = 1 - 2i

    ```


    the result of the multiplication would be defined mathematically as


    ```

    z1 * z2 = (3 * 1 - -8) + (3 * -2 + 4 * 1) i = 11 - 2i

    ```


    This is, of course, automatic in MATLAB:


    ```

    >> z1 * z2

    ans =

    11.0000 - 2.0000i

    ```


    # 15.2.4 Complex conjugate and absolute value


    The conjugate of a complex number z = a + bi is z* = a - bi. The magnitude, or
    absolute value, of a complex number z is |z| = √a² + b². In MATLAB, there is a
    built-in function conj for the complex conjugate, and the abs function returns
    the absolute value.


    ```

    >> z1 = 3 + 4i

    z1 =

    3.0000 + 4.0000i

    ```


    ```

    >> conj(z1)

    ans =

    3.0000 - 4.0000i

    ```


    ```

    >> abs(z1)

    ans =

    5

    ```


