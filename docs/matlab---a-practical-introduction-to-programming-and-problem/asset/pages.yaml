  md: 'The general form of a *function definition* for a function that calculates
    and returns one value looks like this:


    ```

    functionname.m

    function outputargument = functionname(input arguments)

    % Comment describing the function

    Statements here; these must include putting a value in the output argument

    end % of the function

    ```


    For example, the following is a function called *calcarea* that calculates and
    returns the area of a circle; it is stored in a file called *calcarea.m*.


    ```

    calcarea.m

    function area = calcarea(rad)

    % calcarea calculates the area of the circle

    % Format of call: calcarea(radius)

    % Returns the area

    area = pi * rad * rad;

    end

    ```


    A radius of a circle is passed to the function to the input argument *rad*; the
    function calculates the area of this circle and stores it in the output argument
    *area*.


    In the function header, we have the reserved word *function*, then the output
    argument followed by the assignment operator =, then the name of the function
    (the as the name of the M-file), and then the input argument *rad*, which is the
    radius. Since there is an output argument in the function header, somewhere in
    the body of the function we must put a value in this argument. This is how a value
    is returned from the function. In this case, the function is simple and all we
    have to do is assign to the output argument *area* the value of the built-in constant
    *pi* multiplied by the square of the input argument *rad*.


    The function can be displayed in the Command Window using the type command:


    +   Many of the functions in MATLAB are implemented as M-file functions; these
    can also be displayed using type.


    >> type calcarea


    ```

    function area = calcarea(rad)

    % calcarea calculates the area of the circle

    % Format of call: calcarea(radius)

    % Returns the area

    area = pi * rad * rad;

    end

    ```'
