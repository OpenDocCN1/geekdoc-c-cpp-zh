    | Table 5.1 Operator Precedence Rules |

    | Operators | Precedence |

    | --- | --- |

    | parentheses () | highest |

    | transpose and power ^, ^ | |

    | unary: negation (-), not, ~ | |

    | multiplication, division *, /, ., *, \ | |

    | addition, subtraction +, - |

    | colon operator : | |

    | relational <, <=, >=, ==, ~= |

    | elementwise and & | |

    | elementwise or | |

    | and && | |

    | or || | |

    | assignment = | lowest |


