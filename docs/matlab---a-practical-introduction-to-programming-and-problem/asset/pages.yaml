    A particular property can also be displayed. For example, to determine the line
    width:


    ```

    >> get(hl, ''LineWidth'')

    ans = 0.5000

    ```


    The objects, their properties, what the properties mean, and valid values can
    be found in MATLAB Help. Under the Contents tab, click on Handle Graphics Property
    Browser. Then, click on Plot Objects; several options can be selected. Click on
    Lineseries, which is used to create figures using the plot function, to see a
    list of the property names and a brief explanation of each.


    For example, the Color property is a vector that stores the color of the line
    as three separate values for the Red, Green, and Blue, in that order. Each value
    is in the range from 0 (which means no of color) to 1. In the previous example,
    the Color was [0 0 1], which means no red, no green, but full blue—in other words,
    the line drawn for the sin function was built. More examples of possible values
    for the Color vector are:


    +   [0 0 0] is red

    [0 1 0] is green

    [0 0 1] is blue

    [1 1 1] is white

    [0 0 0] is black

    [0.5 0.5 0.5] is a shade of grey


    All of the properties listed by you can be changed, using the set function in
    the format set(hhandle, ''PropertyName'', property value)


    ```

    set(hhandle, ''PropertyName'', property value)

    ```


    For example, to change the line width from the default of 0.5 to 1.5:


    ```

    >> set(hl, ''LineWidth'', 2.5)

    ```


    As long as the Figure Window is still open and this object handle is still valid,
    the width of the line will be increased.


    The properties can also be set in the original function call. For example, the
    following set the line width to 2 to begin as in Figure 11.17.


    ```

    >> hl = plot(x,y, ''LineWidth'', 2.5);

    ```'
