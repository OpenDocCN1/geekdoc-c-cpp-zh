    MATLAB functions, and also how to use them. For example, typing help at the prompt
    in the Command Window will show a list of help topics that are groups of related
    functions. This is a very long list; the most elementary topics appear at the
    beginning.


    For example, this is listed as matlab\elfun; it includes the elementary math functions.
    Another of the first help topics is matlab\ops, which shows the operators that
    can be used in expressions.


    To see a list of the functions contained within a particular function, type help
    followed by the name of the topic. For example,


    ```

    >> elfun

    ```


    will show a list of the elementary math functions. It is a very long, and it is
    broken into trigonometric (for which the default is radians, but there are equivalent
    functions that instead use degrees), exponential, complex, and rounding remainder
    functions.


    To find out what particular function does and how to call it, type help and then
    the name of the function. For example,


    ```

    >> help sin

    ```


    will give a description of the sin function.


