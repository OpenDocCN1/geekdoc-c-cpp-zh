    In this chapter, selected advanced mathematics and built-in functions in the MATLAB
    software are introduced. In many applications data are sampled, which results
    in discrete data points. Fitting a curve to the data is often desired. *Curve
    fitting* is finding the curve that *best* fits the data.


    This chapter first explores fitting curves that are simple polynomials to data.
    Other topics include complex numbers and a brief introduction to differentiation
    and integration in calculus. *Symbolic mathematics* means doing mathematics on
    symbols. Some of the math functions, all of which are in the Symbolic Math Toolbox
    in MATLAB, are also introduced, including the solve function for solving equations.(Note
    that this is a Toolbox, and as a result may not be universally available.)


