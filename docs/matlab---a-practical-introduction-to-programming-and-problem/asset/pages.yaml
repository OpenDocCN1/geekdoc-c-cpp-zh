  md: '# 10.5 Recursive Functions


    The inner function can be in any part of the body of the outer function so there
    may be parts of the body of the outer function before and after the inner function.
    There can be multiple inner functions.


    The scope of any variable is the workspace of the outermost function in which
    it is defined and used. This means a variable defined in the outer function could
    be used in an inner function (without passing it). A variable defined in the inner
    function could be used in the outer function, but if it is not used in the outer
    function the scope is just the inner function.


    For example, the following function calculates and returns the volume of a cube.
    Three arguments are passed to it, the length and width of the base of the cube
    and also the height. The outer function calls a nested function that calculates
    and returns the area of the base of the cube.


    ```

    nestedvolume.m

    function outvol = nestedvolume(len, wid, ht)

    % nestedvolume receives the lenght, width, and

    % height of a cube and returns the volume: it calls

    % a nested function that returns the area of the base

    % Format: nestedvolume(length, width, height)


    outvol = base * ht;


    function outbase = base

    % returns the area of the base

    outbase = len * wid;

    % base function


    %nestedvolume function

    ```


    > Note

    it is not necessary to pass the length and width to the inner function, since
    the scope of these variables includes the inner function.


    An example of calling this function:


    ```

    >> v = nestedvolume(3,5,7)

    v =

    105

    ```


    Output arguments are different from variables. The scope of an output argument
    is just the nested function; it cannot be used in the outer function. In this
    example, outbase could only be used in the base function; its value, for example,
    could not be printed from nestedvolume. Examples of nested functions will be used
    in the section on graphical user interfaces.


    # 10.5 RECURSIVE FUNCTIONS


    Recursion occurs when something is defined in terms of itself. In programming,
    a recursive function is a function that calls itself. Recursion is used very commonly
    in programming, although many simple examples (including some shown in'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'this section) are actually very efficient and can be replaced by iterative
    methods (loops, or vectorized code in MATLAB). Nontrivial examples go beyond the
    scope of this book, so the concept of recursion is simply introduced here.


    The first example will be of a factorial. Normally, the factorial of an integer
    $n$ is defined iteratively:


    ```

    n! = 1 * 2 * 3 * ... * n

    ```


    For example, $4! = 1 * 2 * 3 * 4$, or 24.


    Another, recursive definition is


    ```

    n! = n * (n - 1)!    general case

    1! = 1               base case

    ```


    This definition is recursive because the base case is defined in terms of another
    factorial. There are two parts to any recursive definition: the general (inductive)
    case and the base case. We say that in the general of $n$ is defined as $n$ multiplied
    by the factorial of $(n - 1)$, but the base case is that the factorial of $1$
    is just $1$. The base case stops the recursion.


    For example,


    ```

    3! = 3 * 2!

    2! = 2 * 1!

    1! = 1

    = 2

    = 6

    ```


    The way this works is that $3!$ is defined in terms of another factorial, as $3
    * 2!$. This expression cannot yet be evaluated, because first we have to find
    the value of $2!$. So, in trying to evaluate the expression $3 * 2!$, we are interrupted
    by the recursive definition. According to the definition, $2!$ is $2 * 1!$.


    Again, the expression $2 * 1!$ cannot yet be evaluated because we have to find
    the value of $1!$. According to the definition, $1!$ is $1$. Since we know what
    $1!$ is, we can continue with the expression that was just being evaluated; we
    know that $2 * 1!$ is $2$, or $2$. We can then finish the previous expression
    that was being evaluated; we know that $3 * 2!$ is $6$, or $6$.


    This is why that recursion always works. With recursion, the expressions are put
    on hold with the interruption of the general case of the recursion. This keeps
    happening until the base case of the recursive definition applies. This finally
    stops recursion, and then the expressions that are put on hold are evaluated in
    the reverse order. In this case, the first evaluation of $2 * 1!$ was completed,
    and then $3 * 2!$.


    There must always be a base case to end the recursion, and the base case must
    be reached at some point. Otherwise, infinite recursion would occur (theoretically,
    although MATLAB will stop the recursion eventually).'
