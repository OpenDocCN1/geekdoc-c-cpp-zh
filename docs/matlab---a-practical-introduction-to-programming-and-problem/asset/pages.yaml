    # Dot product and cross product


    There are also operations specific to vectors: the dot product and cross product.
    The dot product, or inner product, of vectors a and b is defined as a·b and is


    $a_1b_1 + a_2b_2 + a_3b_3 + \dots + a_nb_n = \sum_{i=1}^{n} a_ib_i$


    In other words, this is like matrix multiplication when multiplying a vector by
    a column vector; the result is the scalar. This can be accomplished using the
    * operator and transposing the second vector, or by using the dot function in
    MATLAB:


    ```

    >> vec1 = [4 2 5 1];

    >> vec2 = [3 6 1 2];

    >> vec1* vec2''

    ans =

    31


    >> dot(vec1,vec2)

    ans =

    31

    ```


    The cross product or outer product $a \times b$ of two vectors a and b is defined
    only when both a and b are vectors in three-dimensional space, which means that
    both must have three elements. It can be defined as a matrix multiplication of
    a matrix composed from the elements from a in a particular manner shown here and
    the column vector b.


    $a \times b = \begin{bmatrix} 0 & -a_3 & a_2 \ a_3 & 0 & -a_1 \ -a_2 & a_1 & 0
    \end{bmatrix} \begin{bmatrix} b_1 \ b_2 \ b_3 \end{bmatrix} = [a_2b_3-a_3b_2,
    a_3b_1-a_1b_3, a_1b_2-a_2b_1]$


    MATLAB has a built-in function cross to accomplish this.'
