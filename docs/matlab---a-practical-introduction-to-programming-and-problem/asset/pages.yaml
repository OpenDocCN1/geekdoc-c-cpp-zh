    # 14.3 INTRODUCTION TO GRAPHICAL USER INTERFACES


    *Graphical user interfaces*, GUIs, are essentially objects that allow users to
    input using graphical interfaces such as pushbuttons, sliders, radio buttons,
    toggle buttons, pop-up menus, and so forth. GUIs are an example of object-oriented
    programming in which there is a hierarchy. For example, the parent may be a Figure
    Window and its children would be objects such as pushbuttons and text boxes.


    The parent user interface object can be a **figure**, **upanel**, or **uibutton**.
    A **figure** is a Figure Window created by the **figure** function. A **upanel**
    is a means of grouping together user interface objects (the "ui" stands for interface).
    A **uibutton** is a means of grouping together buttons (both radio buttons and
    toggle buttons).


    In MATLAB there are two basic methods for creating GUIs: writing the program from
    scratch, or using the built-in Graphical User Interface Development Environment
    (GUIDE). GUIDE allows you to lay out the GUI and MATLAB generates the code for
    it automatically. However, to be able'
  merge: -1
