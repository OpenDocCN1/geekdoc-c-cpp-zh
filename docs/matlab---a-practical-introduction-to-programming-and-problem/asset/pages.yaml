  md: "# 5.3 VECTORS AND MATRICES AS FUNCTION ARGUMENTS\n\nUsing most programming\
    \ languages, if it is desired to evaluate a function on every element in a vector\
    \ or a matrix, loop(s) would be necessary to accomplish this. However, we have\
    \ already seen, in MATLAB an entire vector or matrix can be passed as an argument\
    \ to a function; the function will be evaluated on every element. This means that\
    \ the result will be the same size as the input argument.\n\nFor example, let\
    \ us find the sine in radians of a vector vec. The sin function will automatically\
    \ return the sine of each individual element and the result will be with the same\
    \ length as the input vector.\n\n```\n>> vec = -2:1\nvec =\n   -2 -1  0  1\n>>\
    \ sinvec = sin(vec)\nsinvec =\n   -0.9093 -0.8415  0  0.8415\n```\n\nFor a matrix,\
    \ the resulting matrix will have the same size as the input matrix. For example,\
    \ the sign function will find the sign of each element in a matrix:\n\n```\n>>\
    \ mat = [0 4 -3; -1 0 2]\nmat =\n   0  4 -3\n  -1  0  2\n>> sign(mat)\nans =\n\
    \   0  1 -1\n  -1  0  1\n```\n\nVectors can be passed to user-defined functions,\
    \ as well, as long as the operators used in the function are correct. For example,\
    \ we previously defined a function that calculates the area of a circle:\n\n```\n\
    >> type calcarea\nfunction area = calcarea(rad)\n  % calcarea calculates the area\
    \ of a circle\n  % Format of call: calcarea (radius)\n  % Returns the area\n\n\
    \  area = pi * rad * rad;\nend\n```"
