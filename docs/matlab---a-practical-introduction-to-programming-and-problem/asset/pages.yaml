    The first step is to augment the coefficient matrix A with b to get an augmented
    matrix [A|b]:


    ```

    \begin{bmatrix} 1 & 2 & 2 \ 2 & 2 & 6 \end{bmatrix}$

    ```


    Forward elimination, we want to get a 0 in the $a_{21}$ position. To accomplish
    this, we can modify the second line of the matrix by subtracting from it 2 * the
    first row.


    The way we would write this ERO follows:


    ```

    \begin{bmatrix} 1 & 2 & 2 \ 2 & 2 & 6 \end{bmatrix} r_2 - 2r_1 \rightarrow \begin{bmatrix}
    1 & 2 \ 0 & -2 \end{bmatrix}$

    ```


    Now, putting it back in matrix form:


    ```

    \begin{bmatrix} 1 & 2 \ 0 & -2 \end{bmatrix} \begin{bmatrix} x_1 \ x_2 \end{bmatrix}
    = \begin{bmatrix} 2 \ 2 \end{bmatrix}$

    ```


    says that the second equation is $-2x_2 = 2$, so $x_2 = -1$. Plugging into the
    first equation,


    $x_1 + 2(-1) = 2$, so $x_1 = 4$


    This is back substitution.


    # Gauss-Jordan elimination


    The Gauss-Jordan elimination method starts the same way that the Gauss elimination
    method does, but instead of back substitution, the elimination continues. The
    Gauss-Jordan method consists of:


    +   - Creating the augmented matrix [A|b]

    - Forward elimination by applying EROs to get an upper triangular form

    - Back elimination to a diagonal form that method would yield the solution


    For a $2 \times 2$ system,


    ```

    \begin{bmatrix} a_{11} & a_{12} & b_1 \ a_{21} & a_{22} & b_2 \end{bmatrix} \rightarrow
    \begin{bmatrix} a_{11} & 0 & b_1'' \ 0 & a_{22} & b_2'' \ \end{bmatrix}$

    ```


    and for a $3 \times 3$ system,


    ```

    \begin{bmatrix} a_{11} & a_{12} & a_{13} & b_1 \ a_{21} & a_{22} & a_{23} & b_2
    \ a_{31} & a_{32} & a_{33} & b_3 \end{bmatrix} \rightarrow \begin{bmatrix} a_{11}
    & 0 & 0 & b_1'' \ 0 & a_{22} & 0 & b_2'' \ 0 & 0 & a_{33} & b_3'' \ \end{bmatrix}$

    ```


    Note that the resulting diagonal form does not include the right-most column.
    For example, for the $2 \times 2$ system, forward elimination yielded the matrix:


    ```

    \begin{bmatrix} 1 & 2 \ 0 & -2 \end{bmatrix}$

    ```'
