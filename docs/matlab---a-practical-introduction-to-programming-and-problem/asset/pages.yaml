  md: '# Plots, Imaging, and Graphical User Interfaces


    Simple two-dimensional plots are introduced very early in the book in Chapter
    2 so that plot examples can be used throughout. Chapter 11 shows more plot types,
    and demonstrates customizing plots and how the graphics properties are handled
    in MATLAB. This chapter uses strings and cell arrays to customize labels. Also,
    there is an introduction to image processing and the basics necessary to understand
    programming graphical interface (GUIs) in Chapter 14.


    # Vectorized Code


    Efficient uses of the capabilities of the built-in operators and functions in
    MATLAB are demonstrated throughout the book. However, to emphasize the importance
    of MATLAB efficiently, vectorized code is treated in a separate chapter. Techniques,
    such as preallocating vectors and using logical vectors, are featured, as well
    as methods of determining how efficient the code is.


    # Layout of Text


    The book consists of two parts. The first part covers programming constructs and
    demonstrates the programming method versus use of built-in functions to solve
    problems. The second part covers tools that are used for basic problem solving,
    including plotting, image processing, and mathematical techniques to solve systems
    of linear algebraic equations, fit curves to data, and perform basic statistical
    analyses. The first six chapters cover the very basics in MATLAB and in programming,
    and are all prerequisites for the rest of the book. After that, many chapters
    in the problem-solving section can be introduced when desired, to produce a customized
    flow of topics in the book. This is true to an extent, although the order of the
    chapters has been chosen carefully to ensure that the chapter is systematic.


    The individual chapters are described here, as well as topics are required for
    each chapter. Part I, Introduction to Programming Using MATLAB, includes the following
    chapters.


    **Chapter 1: Introduction to MATLAB** covers operations, characters, variables,
    and assignment statements. Scalars, vectors, and matrices are all introduced as
    many built-in functions that manipulate them.


    **Chapter 2: Introduction to MATLAB Programming** introduces the idea of algorithms
    and scripts. This includes simple input and output, and commenting. Scripts are
    then used to create and customize simple plots, and to file input and output.
    Finally, the concept of a user-defined function is introduced with only the type
    of function that calculates and returns a single value.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Preface


    **Chapter 3: Selection Statements** introduces relational expressions and their
    use in if statements, with else and elseif clauses. The switch statement is also
    demonstrated, as is the concept of choosing from a menu. Also, functions that
    return logical true and false are introduced.


    **Chapter 4: Loop Statements** introduces the concepts of counted (for) and conditional
    loops (while). Many common uses, as summing and counting, are covered. Nested
    loops are also introduced. Some more-sophisticated uses of loops, such as error-checking
    and combining loops and selection statements, are also covered.


    **Chapter 5: Vectorized Code** introduces the idea of “vectorizing” code, which
    essentially means rewriting code that loops to more efficiently use of built-in
    functions, and the fact that operations can be done on vectors and matrices in
    MATLAB. Functions that are useful in vectorizing code are emphasized in this chapter.
    Functions that time the speed of code are also introduced.


    Knowledge of the concepts presented in the first five chapters are assumed throughout
    the rest of the book.


    **Chapter 6: MATLAB Programs** covers more on scripts and user-defined functions.
    User-defined functions that return more than one value and also do not return
    anything are introduced. The concept of a program in MATLAB, which consists of
    a script that calls user-defined functions, is demonstrated with examples. A longer
    menu-driven program is shown as a reference, but could be omitted. Subfunctions
    and scope of variables are also introduced, as are some debugging techniques.


    This program concept is used throughout the rest of the book.


    **Chapter 7: String Manipulation** covers many built-in string manipulation as
    well as converting between string and number types. Several examples include using
    custom strings in plot labels and input prompts.


    **Chapter 8: Data Structures: Cell Arrays and Structures** introduces two main
    data structures: cell arrays and structures. Once structures are covered, more
    complicated data structures, such as nested structures and vectors of structures,
    are also introduced. Cell arrays are used in several applications in later chapters,
    such as input file in Chapter 9, variable number of function arguments in Chapter
    10, and plot labels in Chapter 11, and are therefore considered important and
    are covered first. The rest of the chapter can be omitted.


    **Chapter 9: Advanced File Input and Output** covers lower-level file/output statements
    that require opening and closing the file. Functions that can read the entire
    file at well as those that require reading one line at a time are introduced,
    and examples that demonstrate the differences in their use are shown. Additionally,
    reading from writing to spreadsheet'
