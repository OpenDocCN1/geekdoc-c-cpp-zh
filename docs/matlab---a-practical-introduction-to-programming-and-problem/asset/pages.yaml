    As another example, consider a function that calculates and returns three output
    arguments. The function will receive one input argument representing a total number
    of seconds, and returns the number of hours, minutes, and remaining seconds it
    represents. For example, 7515 total seconds is 2 hours, 5 minutes, and 15 seconds
    becomes 7515 = 3600 * 2 * 60 * 5 + 15.


    The algorithm follows:


    +   - Divide the seconds by 3600, which is the number of seconds in an hour. For
    7515/3600 = 2.0875. The integer part is the number of hours (e.g., 2).

    - The remainder of the total seconds divided by 3600 is the remaining number of
    seconds; it is useful to store this in a local variable.

    - The number of minutes is the remaining number of seconds divided by 60 (again,
    the integer part).

    - The number of seconds is the remainder of the seconds.


    ```

    breaktime.m

    function [hours, minutes, secs] = breaktime(totseconds)

    % breaktime breaks a total number of seconds into

    % hours, minutes, and remaining seconds

    % Format: breaktime(totalSeconds)


    hours = floor(totseconds/3600);

    remsecs = rem(totseconds, 3600);

    minutes = floor(remsecs, 60);

    secs = rem(remsecs, 60);

    end

    ```


    An example of calling this function is


    ```

    >>[h m s] = breaktime(7515)

    h = 2

    m = 5

    s = 15

    ```'
