  md: "# 6.5 DEBUGGING TECHNIQUES\n\nAny error in a computer program is called a bug.\
    \ This term is thought to date back to the 1940s, when a problem with an early\
    \ computer was found to have been caused by a moth in the computer's circuitry!\
    \ The process of finding errors in a program, and correcting them, is still called\
    \ debugging.\n\n# 6.5.1 Types of errors\n\nThere are several different kinds of\
    \ errors that can occur in a program, which fall into the categories of syntax\
    \ errors, runtime errors, and logical errors.\n\nSyntax errors are mistakes in\
    \ using the language. Examples of syntax errors are missing a comma or a quotation\
    \ mark, or misspelling a word. MATLAB itself will flag syntax errors and give\
    \ an error message. For example, the following string is missing the end quote:\n\
    \n```\n>> mystr = 'how are you;\n??? mystr = 'how are you;\nError: A MATLAB string\
    \ constant is not terminated properly.\n```\n\nIf this type of error is typed\
    \ in a script or function using the Editor, the Editor will flag it.\n\nAnother\
    \ common mistake is to spell a variable name incorrectly; MATLAB will also catch\
    \ this error.\n\n```\n>> value = 5;\n>> newvalue = valu + 3;\n??? Undefined function\
    \ or variable 'valu\n```\n\nRuntime, or execution-time, errors are found when\
    \ a script or function is executing. With most languages, an example of a runtime\
    \ error would be attempting to divide by zero. However, in MATLAB, this will generate\
    \ a warning message. Another example would be attempting to refer to an element\
    \ in an array that does not exist.\n\n```\nruntimeEx.m\n% This script shows an\
    \ execution-time error\nvec = 3:5;\nfor i = 1:4\n    disp(vec(i))\nend\n```\n\n\
    The previous script initializes a vector with three elements, but then attempts\
    \ to refer to a fourth. Running it prints the three elements in the vector, and\
    \ then an"
