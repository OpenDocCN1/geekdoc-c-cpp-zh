    \ function could be used on the resulting vector *isg*:\n\n```\n>> sum(isg)\n\
    ans =\n3\n```\n\nWhat we have done is to create a *logical vector* *isg*. This\
    \ logical vector can be used to index into the original vector. For example, if\
    \ the elements from the vector that are greater than 5 are desired:\n\n```\n>>\
    \ vec(isg)\nans =\n9 6 11\n```\n\nThis is called **logical indexing**. Only the\
