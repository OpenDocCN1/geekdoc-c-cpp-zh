    returned by a function through the output arguments

    - Attempting to call a function that does not return a value from an assignment
    statement, or from an output statement.

    - Not using the same name for the function and the file in which it is stored.

    - Not thoroughly testing functions for all possible inputs and outputs.

    - Forgetting that persistent variables are updated every time the function in
    which they are called—whether from a script or from the Command Window.


