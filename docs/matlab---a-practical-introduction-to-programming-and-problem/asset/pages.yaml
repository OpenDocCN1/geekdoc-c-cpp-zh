  md: '# 9.1 Lower-Level File I/O Functions


    See fopen for others.

    After the fopen is attempted, the value returned should be tested to make sure
    the file was successfully opened. For example, if attempting to open and the file
    does not exist, the fopen will not be successful. Since the fopen function returns
    -1 if the file was not found, this can be tested to decide whether to print an
    error message or to carry on and use the file. if it is desired to read from a
    file samp.dat:


    ```

    fid = fopen(''samp.dat'');

    if fid == -1

    disp(''File open not successful'')

    else

    # Carry on and use the file!

    end

    ```


    Files should be closed when the program has finished reading from or appending
    to them. The function accomplishes this the fclose function, which returns 0 if
    the file was successful, or -1 if not. Individual files can be closed by specifying
    the file identifier, or if more than one file is open, all files can be closed
    by passing the string ''all'' to the fclose function. The general forms are:


    ```

    closeresult = fclose(fid)

    closeresult = fclose(''all'');

    ```


    The fclose function should also be checked with an if-else statement to make that
    it was successful, so the outline of the code would be:


    ```

    fid = fopen(''filename'', ''permission string'');

    if fid == -1

    disp(''File open not successful'')


    # do something with the file!

    closeresult = fclose(fid);

    if closeresult == 0

    disp(''File close successful'')

    else

    disp(''File close not successful'')

    end

    ```


