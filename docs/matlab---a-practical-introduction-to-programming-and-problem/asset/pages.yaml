  md: 'The order in which the points are given is important, the faces describe the
    vertices are linked. To create these vertices in MATLAB and define faces that
    connect them, we use a structure variable and then pass it to the patch function.


    ```

    polyhedron.vertices = [...\n0 0 0\n1 0 0\n0 1 0\n0.5 0.5 1];

    ```


    ```

    polyhedron.faces = [...\n1 2 3\n1 2 4\n1 3 4];

    ```


    ```

    obj = patch(polyhedron, ...\nFaceColor'',[0.8 0.8 0.8], ...\nEdgeColor,''black'');

    ```


    The *polyhedron.vertices* field is a matrix in which each row represents (x,y,z)
    coordinates. The field *polyhedron.faces* defines the faces; for example, the
    first row in the matrix specifies to draw lines from vertex 1 to vertex 2 and
    vertex 3 to form the first face. The face color is set to grey and the edge color
    to black. The figure, as seen in Figure 11.24, shows only two faces. Using the
    rotate icon on the


