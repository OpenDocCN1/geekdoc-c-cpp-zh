  md: '# Data Structures: Cell Arrays and Structures


    # KEY WORDS


    +   - data structures: database, comma-separated list

    - cell array: record, vector of structures

    - structures: content indexing, nested structure

    - fields: cell indexing


    # CONTENTS


    +   8.1. Cell Arrays..........246


    +   8.2. Structures...........252


    **Data structures** are variables that store more than one value. For it make
    sense to store more than one value in a variable, the values should somehow be
    logically related. There are many different kinds of data structures. We have
    already been working with one kind, arrays (e.g., vectors and matrices). An array
    is a data structure in which all of the values are logically related in that they
    are of the same type, and represent in sense "the same thing." So far, that has
    been true for the vectors and matrices that we have used. We use vectors and matrices
    when we want to loop them through (or essentially have this done for us using
    vectorized code).


    **Cell array** is a kind of data structure that stores values of different types.
    Cell arrays can be vectors or matrices; the different values are referred to as
    the elements of the array. One common use of a cell array is to store strings
    of different lengths. Cell arrays actually store pointers to the stored data.


    **Structures** are data structures that group together values that are logically
    related, but are not the same thing and not necessarily the same type. The different
    values are stored in separate *fields* of the structure.'
  merge: -1
  pgno: 258
- img_proc: true
  md: "One use of structures is to set up a database of information. For example,\
    \ a processor might want to store for every student in a class the student's name,\
    \ university ID number, grades on all assignments and quizzes, and so forth. In\
    \ many programming languages and database programs, the terminology is that within\
    \ a database file, there would be a record for each student; each separate piece\
    \ of information (name, quiz 1, and so on) would be called a field of the record.\
    \ In the MATLAB® these records are called structs.\n\nBoth arrays and structures\
    \ can be used to store values that are different types in a single variable. The\
    \ main difference between them is that cell arrays are indexed, and can therefore\
    \ be used with loops or vectorized code. Structures, on the other hand, are not\
    \ indexed; the values are referenced using the names of the fields, which can\
    \ be more mnemonic during indexing.\n\n# 8.1 CELL ARRAYS\n\nOne type of data structure\
    \ that MATLAB has but is not found in many programming languages is a cell array.\
    \ A cell array in MATLAB is an array, but unlike the vectors and matrices we have\
    \ used so far, elements in cell arrays can store different types of values.\n\n\
    # 8.1.1 Creating cell arrays\n\nThere are several ways to create cell arrays.\
    \ For example, we will create a cell array in which one element will store an\
    \ integer, and one element will store a character. Just like the arrays we have\
    \ seen so far, this could be a 1 x 4 row array, a 4 x 1 column vector, or a 2\
    \ x 2 matrix. The syntax for creating vectors and matrices is the same as before.\
    \ Values within rows are separated by spaces or commas, and rows are separated\
    \ by semicolons. However, for cell arrays, braces are used rather than square\
    \ brackets. For example, the following creates a row cell array with the four\
    \ types of values:\n\n```\n>> cellrowvec = \ncellrowvec =\n{ [23] 'a' [1 x 5 double]\
    \ 'hello'}\n```\n\nTo create a column vector array, the values are instead separated\
    \ by semicolons:\n\n```\n>> cellcolvec = {23; 'a'; 1:2:9; 'hello'}\ncellcolvec\
    \ =\n{[23]\n'a'\n[1 x 5 double]\n'hello'}\n```"
  merge: -1
  pgno: 259
- img_proc: true
  md: 'This method creates a $2 \times 2$ array matrix:


    ```

    cellmat = {23 ''a''; 1:2:9 ''hello''}

    cellmat =

    [ 23] ''a''

    [1 x 5 double] ''hello''

    ```


    Another method of creating a cell array is to simply assign values to specific
    array elements and build it element by element. However, as explained before,
    extending an array element by element is a very inefficient and time-consuming
    method.


    It is much more efficient, if the size is known ahead of time, to preallocate
    the array. For cell arrays, this is well done with the cell function. For example,
    to preallocate a variable mycellmat to be a $2 \times 2$ cell array, the cell
    function would be called as follows:


    ```

    mycellmat = cell(2,2)

    mycellmat =

    [] {}

    [] []

    ```


    Note that this is a function call, so the arguments to the function are in parentheses;
    a matrix is created in which all of the elements are empty vectors. Then, each
    element can be replaced by the desired value. How to refer to each element to
    accomplish this will be explained next.


    # 8.1.2 Referring to and displaying cell array elements and attributes


    Just like the other vectors we have seen far, we can refer to individual elements
    of cell arrays. However, with cell arrays, there are two different ways to do
    this. The elements in cell arrays are cells. These cells can contain different
    types of values. With cell arrays, you can refer to the cells, or to the contents
    of the cells.


    Using curly braces for the subscripts will refer to the contents of a cell; this
    is called content indexing. For example, this refers to the contents of the second
    element of the cell array cellrowvec; ans will have the type char:


    ```

    cellrowvec{2}

    ans =

    23

    ```


    Row and column subscripts are used to refer to the contents of an element in a
    matrix (again using curly braces):


    ```

    cellmat(1,1)

    ans =

    1

    ```'
