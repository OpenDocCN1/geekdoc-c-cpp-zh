    # 9.3.2 Appending variables to a MAT-file


    Appending a file adds to what has already been saved in a file, and is accomplished
    using the -append option. For example, assuming the variable mymat has already
    been stored in the file sess2.mat as just shown, this would append the x to the
    file:


    ```

    >> save -append sess2 x

    >> who -file sess2

    ```


    Your variables are:

    mymat x


    Without specifying variable(s), just save -append would add all variables from
    the Command Window to the file. When this happens, if the variable is not in the
    file, it is appended. If there is a variable with the same name in the file, it
    is replaced by the current value from the Command Window.


    # 9.3.3 Reading from a MAT-file


    The load function can be used to read from different types of files. As the save
    function, by default the file will be assumed to be a MAT-file, and load can load
    all variables from the file or only a subset. For example, in a new Command Window
    session in which no variables have yet been created, the load function could load
    from the files created in the previous section:


    ```

    >> who

    >> load sess2

    >> who

    ```


    Your variables are:

    mymat x


    A subset of the variables in a file can be loaded by specifying them in the form:


    ```

    load filename variable list

    ```'
