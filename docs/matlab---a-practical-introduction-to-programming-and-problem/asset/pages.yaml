  md: '# 14.3 Introduction to Graphical User Interfaces


    understand and modify this code, it is important to understand the underlying
    programming concepts. Therefore, this section will concentrate on the programming
    methodology.


    A Figure Window is the parent of any GUI. Calling the figure function will bring
    up a blank Figure Window. Assigning the handle of this Figure Window to a variable
    and using the get function will show the default properties. These properties,
    such as the color of the window, its position on the screen, and so forth can
    be changed using the set function or when calling the figure function to begin
    with. For example:


    ```

    >> f = figure;

    ```


    brings up a grey box near the top of the screen as shown in Figure 14.12.

    Some of its properties are excerpted here:


    ```

    >> get(f)

    Color = [ 0.8 0.8 0.8 ]

    Colormap = [ (64 by 3) double array]

    Position = [360 502 560 420]

    Units = pixels

    Children = []

    Visible = on

    ```


    ![](img/106804b84dd25648ed57173c2c911b77_454_0.png)


    **FIGURE 14.12** Placement of figure within screen'
