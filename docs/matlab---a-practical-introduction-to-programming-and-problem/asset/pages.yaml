  md: "# CHAPTER 6 MATLAB Programs\n\nOne way to determine the value of $e$ by finding\
    \ a limit:\n\n$e = \\lim_{n\\to\\infty} (1 + \\frac{1}{n})^n$\n\nAs the value\
    \ of $n$ increases toward infinity, the result of this expression approaches the\
    \ value of $e$.\n\nAn approximation for the exponential function can be found\
    \ using what is called a Maclaurin series:\n\n$e^x \\approx 1 + \\frac{x^1}{1!}\
    \ + \\frac{x^2}{2!} + \\frac{x^3}{3!} + \\dots$\n\nWe will write a program to\
    \ investigate the value of $e$ and the exponential function. It will be menu-driven.\
    \ The menu options will be:\n\n+   * Print an explanation of $e$.\n* Prompt the\
    \ user for a value of $n$, and then find an approximate value for $e$ using the\
    \ expression $(1 + 1/n)^n$.\n* Prompt the user for a value of $x$. Print the value\
    \ of **exp(x)** using the built-in function. Find an approximate value for $e^x$\
    \ using the Maclaurin series just given.\n* Exit the program.\n\nThe algorithm\
    \ for the script main program follows:\n\n+   * Call a function *option* to display\
    \ the menu and return the user's choice.\n* Loop until the user chooses to exit\
    \ the program. If the user has not chosen to exit, the action of the loop is to:\n\
    \    * Depending on the user's choice, do one of the following:\n        * Call\
