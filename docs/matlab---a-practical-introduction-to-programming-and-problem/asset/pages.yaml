    # 1.5 CHARACTERS AND ENCODING


    A character in MATLAB is represented using single quotes (e.g., ''a'' or ''x'').
    The quotes are necessary to denote a variable name; without them, a letter would
    be interpreted as a variable name. In character encoding, all characters in the
    computer''s character set are placed in a sequence and given equivalent integer
    values. The character set includes all letters of the alphabet, digits, and punctuation
    marks; basically, all of the keys on a keyboard are characters. Special characters,
    such as the Enter key, are also included. '','', ''!'', and ''3'' are all characters.
    With quotes, ''3'' is a character, not a number.


    The most common encoding is the American Standard Code for Information Interchange,
    or ASCII. Standard ASCII has 128 characters, which have equivalent integer values
    from 0 to 127. The first 32 (integer values 0 through 31) are nonprinting characters.
    The letters of the alphabet are in order, which means ''a'' comes before ''b'',
    then ''c'', and so forth.


    The numeric functions can be used to convert a character to its equivalent numerical
    value (e.g., **double** will convert to a double value, and **int32** will'
  merge: -1
