  md: '# 15. Fitting Curves to Data


    This says MATLAB has determined that the best quadratic that fits these data points
    is -1,857x² + 14,857x + 41.6. So, the variable coef stores a coefficient vector
    that represents this polynomial.


    The function polyval can then be used to evaluate the polynomial at specified
    values. For example, we could evaluate every value in the x vector:


    ```

    >> curve = polyval(coeffs,x)

    curve =

    63.8857 69.4571 71.3143 69.4571 63.8857

    ```


    This results in y values for each point in the x vector, and stores them in a
    vector curve. Putting all of this together, the following script polytemp creates
    the x and y values, fits a second-order polynomial through these points, and plots
    both the points and the curve on the same figure. This results in the plot seen
    in Figure 15.3. The curve doesn''t look very smooth on this plot, but because
    there are only five points in the x vector


    ```

    % Fits a quadratic curve to temperature data

    x=2:6;

    y=[65 67 72 71 63];

    coeffs=polyfit(x,y,2);

    curve=polyval(coeffs,x);

    plot(x,y,''ro'',curve)\xlabel(''Time'')

    ylabel(''Temperatures'')

    title(''Temperatures one afternoon'')

    axis([1 7 60 75])

    ```


    # PRACTICE 15.1


    To make the curve smoother, modify the script polytemp to create a new x vector
    with more points for plotting the curve. Note that the original x vector for the
    data points must remain as is.


    To estimate the temperature at different times, polyval can be used for discrete
    points; it does not have to be used with the entire vector. For example, to interpolate
    between the given data points and estimate what the temperature was at 2.30 pm,
    2.5 would be used.


    ```

    >> polyval(coeffs,2.5)

    ans =\67.1357

    ```


