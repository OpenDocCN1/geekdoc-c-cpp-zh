  md: "# 13.5 Searching\n\nThe key was found in the fourth element of the vector.\n\
    \nAnother example: Search for the key of 82.\n\n| Iteration | Low | High | Mid\
    \ | Found? | Action |\n|---|---|---|---|---|---||\n| 1 | 1 | 6 | 3 | No | Move\
    \ high to mid –1 |\n| 2 | 1 | 2 | 2 | No | Move low to mid + 1 |\n| 3 | 2 | 2\
    \ | | No | Move low to mid + 1 |\n| 4 | 3 | 2 | | This ends! | No | |\n\nThe value\
    \ of *low cannot be greater than high* means the key is not in the vector. The\
    \ algorithm repeats until the key is found or until *low > high*, which means\
    \ the key is not there.\n\nThe following function implements this binary search\
    \ algorithm. The function receives two arguments: the sorted vector and a key\
    \ (alternatively, the function could sort the vector). The values of *low* and\
    \ *high* are initialized to the first and last indices of the vector. The output\
    \ outind is initialized to 0, which is the value that the function will return\
    \ if the key is not found. The function loops until either low is greater than\
    \ high, or the key is found.\n\n```\nbinarysearch.m\nfunction outind = binarysearch(vec,\
    \ key)\n% binarysearch searches through a sorted vector\n% looking for a key using\
    \ a binary search\n% Format: binarysearch(sorted vector, key)\n\nlow = 1;\nhigh\
    \ = length(vec);\noutind = 0;\n\nwhile low <= high && outind == 0\n    mid = floor((low\
    \ + high) / 2);\n    if vec(mid) == key\n        outind = mid;\n    elseif key\
    \ < vec(mid)\n        high = mid - 1;\n    else\n        low = mid + 1;\n    end\n\
    end\n```\n\nThe following are examples of calling this function:\n\n```\n>> vec\
    \ = round(rand(1,7)*29+1)\nvec =\n2 11 25 1 5 7 6\n```"
