    # 13.1.3 Mode


    The mode of a data set is the value that appears most frequently. The built-in
    function in MATLAB for this is called the **mode**.


    ```

    >> x = [9 10 9 8 7 3 10 8 5 10];

    >> mode(x)

    ans =

    3

    ```


    If there is more than one value with the same (highest) frequency, the smaller
    value is the mode. In the following case, since 3 and 8 appear twice in the vector,
    the smaller value (3) is the mode:


    ```

    >> x = [3 8 5 3 4 1 8];

    >> mode(x)

    ans =

    3

    ```


    Therefore, if no value appears more frequently than any other, the smallest value
    in the vector will be the mode of the vector.'
