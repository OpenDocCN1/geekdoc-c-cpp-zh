    # 2.3.1 Input Function


    Input statements read values from the default or standard input device. In most
    systems, the default input device is the keyboard, and the input statement reads
    in values that have been entered by the user, or the person who is running the
    script. To let the user know what he or she is supposed to enter, the script must
    first prompt the user for the specified values.


    The simplest input function in MATLAB is called input. The input function is used
    in an assignment statement. To call it, a string is passed that is the prompt
    that will appear on the screen, and whatever the user types be stored in the variable
    named on the left of the assignment statement. For ease of reading the prompt,
    it is useful to use a colon and a space after the prompt. For example,


    ```

    >> rad = input(''Enter the radius: )

    Enter the radius: 5

    rad =

    5

    ```


    If character or string input is desired, ''s'' must be added as a second argument
    to the input function:


    ```

    >> letter = input(''Enter a char:'', ''s'')

    Enter a char: g

    letter =

    g

    ```


    If the user enters only spaces or tabs before hitting the key, they are ignored
    and an empty string is stored in the variable:


    ```

    >> mychar = input(''Enter a character: '', ''s'')

    Enter a character:

    mychar =

    ''''

    ```


    Note


    Although normally the quotes are not shown around a character or string, in this
    case they are shown to demonstrate that there is nothing inside the string. In
    the next example, the user hits space four times before entering "go". The length
    function returns the number of characters in the string.


    ```

    >> mystr = input(''Enter a string: '', ''s'')

    Enter a string:

    mystr =

    go

    ```


    ```

    >> length(mystr)

    ans =

    6

    ```


    Although normally the quotes are not shown around a character or string, in this
    case they are shown to demonstrate that there is nothing inside the string.'
