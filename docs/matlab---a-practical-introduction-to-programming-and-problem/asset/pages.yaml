    # 7.2.1 Concatenation


    String concatenation means to join strings together. Of course, since strings
    are vectors of characters, the method of concatenating vectors for strings, also.
    for example, to create one long string from two strings, it is possible to join
    them by putting them in square brackets:


    ```

    >> first = ''Bird'';

    >> last = ''house'';

    >> [first last]

    ans =

    Birdhouse

    ```


    The function strcat concatenates horizontally, meaning that it creates one longer
    string from the inputs.


    ```

    >> first = ''Bird'';

    >> last = ''house'';

    >> strcat(first,last)

    ans =

    Birdhouse

    ```'
