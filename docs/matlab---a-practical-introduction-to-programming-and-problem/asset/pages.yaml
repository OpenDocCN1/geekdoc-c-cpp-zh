    # 2.4 SCRIPTS WITH INPUT AND OUTPUT


    Putting all of this together now, we can implement the algorithm from the beginning
    of this chapter. The following script calculates and prints the area of a circle.
    It first prompts the user for a radius, reads in the radius, and then calculates
    and prints the area of the circle based on this radius.


    ```

    script2.m

    % This script calculates the area of a circle

    % Prompt the user for the radius


    % Prompt the user for the radius and calculate

    % the area based on that radius

    printf(''Note: the units will be inches.\n'',

    radius = input(''Please enter the radius: '')

    area = pi*(radius^2)


    % Print all variables in a sentence format

    printf(''For a circle with a radius of %.2f inches,\n'', radius)

    printf(''the area is %.2f inches squared\n'', area)

    ```


    Executing the script produces the following output:


    ```

    >> Note: The units will be inches.

    Please enter the radius: 3.9

    For a circle with a radius of 3.90 inches

    the area is 47.78 inches squared

    ```


    Note that the output from the first two assignment statements (including the input)
    is suppressed by pressing semicolons at the end. That is usually done in scripts,
    so that the exact format of what is displayed by the program is controlled by
    the fprintf functions.


