    We will see much more on operations and functions of arrays (vectors and matrices)
    in Chapters 4, 5, and 12.


    # 1.6.6 Empty vectors


    An empty vector (i.e., a vector that stores no values) can be created using empty
    square brackets:


    ```

    >> evec = []

    evec =

    [ ]

    ```


    ```

    >> length(evec)

    ans =

    0

    ```


    Values can then be added to an empty vector by concatenating, or adding, values
    to the existing vector. The following statement takes what is currently in evec,
    which is nothing, and adds 4 to it.


    > Note: There is a difference between having an empty vector variable and not
    having the variable at all.


    ```

    >> evec = [evec 4]

    evec =

    4

    ```


    The following statement takes what is current in evec, which is 4, and adds 11
    to it.


    ```

    >> evec = [evec 11]

    evec =

    4 11

    ```


    This can be continued as many times as desired, to build a vector up from nothing.
    Sometimes it is necessary, generally it is not a good idea if it can be avoided
    because it can be quite time consuming.


    Empty vectors can also be used to delete elements from vectors. For example, to
    remove the third element from a vector, the vector is assigned to it:


    ```

    >> vec = 1:5

    vec =

    1 2 3 4 5

    ```


    ```

    >> vec(3) = []

    vec =

    1 2 4 5

    ```


    The elements in this vector are now numbered 1 through 4.


    Subsets of a vector could also be removed. For example,


    ```

    >> vec = 1:8

    vec =

    1 2 3 4 5 6 7 8

    ```'
