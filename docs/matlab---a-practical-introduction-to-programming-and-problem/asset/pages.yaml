  md: "# 11.6.2 Plotting file data\n\nIt is often necessary to read data from a file\
    \ and plot it. Normally, this entails knowing the format of the file. For example,\
    \ let us assume that a company has two divisions, A and B. Assume that the file\
    \ ab11.dat contains four lines, with the sales figures (in millions) for the two\
    \ divisions for each quarter of 2011. For example, the file might look like this\
    \ (the format will be exactly like this):\n\n```\nA5.2B6.4\nA3.2B5.5\nA4.B4.3\n\
    A4.SB2.2\n```\n\nThe following script reads the data and plots the data as bar\
    \ charts in one Figure Window. The script prints an error message if the file\
    \ is not opened or if the file was not successful. The axis command is used to\
    \ force the x-axis to range from 0 to 3 and the y-axis from 0 to 8, which will\
    \ result in the axes shown here. The numbers 1 and 2 will show on the x-axis rather\
    \ than the division labels A and B by default. The set function changes the XtLabel\
    \ property to use the strings in the cell array as tick marks on the x-axis; gca\
    \ returns the handle to the axes in current figure (it stands for 'current axes').\n\
    \n```\nplotdivab.m\n% Reads sales figures for 2 divisions of a company one\n%\
    \ line at a time as string, and plots the data\n\nfid = fopen('ab11.dat');\nif\
    \ fid == -1\n    disp('File open not successful')\nelse\n    for i = 1:4\n   \
    \     % Every line is line of the form A#B#; this separates\n        % the characters\
    \ and converts the '#' to actual\n        % numbers\n        aline = fgetl(fid);\n\
    \        aline = aline(2:length(aline));\n        [compa, rest] = strtok(aline,\
    \ 'B');\n        compa = str2num(compa);\n        compb = rest(2:length(rest));\n\
    \        str2num(compb)\n\n        % Data from every line is in a separate subplot\n\
    \        subplot(1,4,i)\n        bar ([compa, compb])\n        set(gca,'XtLabel',\
    \ ('A', 'B'))\n        axis([0 3 0])\n        ylabel('Sales (millions)')\n```"
