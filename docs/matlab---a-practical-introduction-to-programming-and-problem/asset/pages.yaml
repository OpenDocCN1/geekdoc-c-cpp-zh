    # 1.6.1 Creating row vectors


    There are several ways to create row vector variables. The most direct way is
    to put the values you want in the vector in square brackets, separated by spaces
    or commas. For example, both of these assignment statements create the same vector
    v:


    ```

    >> v = [1 2 3 4]

    v = 1 2 3 4

    >> v = [1,2,3,4]

    v = 1 2 3 4

    ```


    Both of these create a row vector variable that has four elements; each value
    is stored in a separate element in the vector.


    # The colon operator and linspace function


    If, as in the preceding examples, the values in the vector are regularly spaced,
    the *colon operator* can be used to *iterate* through these values. For example,
    1:5 results in all of the integers from 1 to 5:


    ```

    >> vec = 1:5

    vec = 1 2 3 4 5

    ```


    Note that in this case, the brackets [ ] are not necessary to define the vector.


    With the colon operator, a *step value* can also be specified with another colon,
    in the form (first:step:last). For example, to create a vector with all integers
    from 1 to 9 in steps of 2:


    ```

    >> nv = 1:2:9

    v = 1 3 5 7 9

    ```


    What happens if adding the step value would beyond the range specified by the
    last, such as


    **Answer:** This would create a vector containing 1, 3, and 5. Adding 2 to the
    5 would go beyond 6, so the vector stops at 5; the result would be


    ```

    1:2:6

    ```


    ```

    1 3 5

    ```'
