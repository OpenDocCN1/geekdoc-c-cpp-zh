- img_proc: true
  md: "# THE EFFICIENT METHOD\n\nTo choose from among more than two actions, the elseif\
    \ clause is used. Example, if there are n choices (where n > 3 in this example),\
    \ the following general form would be used:\n\n```\nif condition1\n    action1\n\
    elseif condition2\n    action2\nelseif condition3\n    action3\n% etc: there can\
    \ be many of these\nelse\n    actionn % the nth action\n```\n\nThe actions of\
    \ the if, elseif and else clauses are naturally bracketed by the reserved words\
    \ if, elseif, else and end. For example, the previous example could be written\
    \ using the elseif rather than nesting if-else statements:\n\n```\nif x < -1\n\
    \    y = 1;\nelseif x <= 2\n    y = x^2;\nelse\n    y = 4;\nend\n```\n\nNote that\
    \ in this example we only need end. So, there are three ways of accomplishing\
    \ the task: using separate if statements, using if-else statements, and using\
    \ an if statement with elseif clauses, which is the simplest. This could be implemented\
    \ in a function that receives a value of x and returns the corresponding value\
    \ of y\n\n```\ncalcy.m\nfunction y = calcy(x)\n% calc calculates y as a function\
    \ of x\n% Format of call: calcy(x)\n% y = 1          if x < -1\n% y = x^2    \
    \   if -1 <= x <= 2\n% y = 4          if x > 2\nif x < -1\n    y = 1;\nelseif\
    \ x <= 2\n    y = x^2;\nelse\n    y = 4;\nend\n```"
