  md: "# CHAPTER 11 Advanced Plotting Techniques\n\n# 11.1.1 Matrix of plots\n\nAnother\
    \ function that is very useful with all types of plots is subplot, which creates\
    \ a matrix of plots in the current Figure Window. Three arguments are passed to\
    \ it in the form subplot(r,c,n); where r and c are the dimensions of the matrix\
    \ and n is the number of the particular plot within this matrix. The plots are\
    \ numbered rowwise starting in the upper left corner. In many cases, it is useful\
    \ to create a subplot in a for loop the so loop variable can iterate through the\
    \ 1 through n.\n\nWhen the subplot function is called in a loop, the first arguments\
    \ will always be the same since they give the dimensions of the matrix. The third\
    \ argument will iterate through the numbers assigned to the elements of the matrix.\
    \ When the subplot function is called, it makes the specified element \"active\"\
    \ plot; then, any plot can be used with formatting such as axis labeling and titles\
    \ within that element.\n\nFor example, the following subplot shows the difference,\
    \ in one Figure Window, using 10 points and 20 points to plot sin(x) between 0\
    \ and 2 π . The subplot creates a 1 x 2 row vector of plots in the Figure Window,\
    \ so that the two plots are shown. The loop variable iterates through the values\
    \ 1 and 2.\n\nThe first time through the loop, when it has the value 1, 10 * 1\
    \ points are used, and the value of the third argument to the subplot function\
    \ is 1. The second through the loop, 20 points are used and the third argument\
    \ to subplot is 2. Note that sprint is used to print how many points were used\
    \ in the subplot. The resulting Figure Window with both plots is shown in Figure\
    \ 11.1.\n\n```\nsubplotex.m\n% Demonstrate subplot using a for loop\nfor i = 1:2\n\
    \    x = linspace(0,2*pi,10*i);\n    y = sin(x);\n    subplot(1,2,i)\n    plot(x,y,'ko')\n\
    \    xlabel('x')\n    ylabel('sin(x)')\n    title(sprintf('%d Points,', 10 * i))\n\
    end\n```\n\n# QUICK QUESTION!\n\nWhat are some options for plotting more than\
    \ one graph?\nAnswer: There are several methods, depending on whether you want\
    \ them in a single Figure Window posed\n\n(using hold on, in a matrix in a single\
    \ Figure Window, or in multiple Figure Windows (using figure(n))."
  merge: -1
  pgno: 337
