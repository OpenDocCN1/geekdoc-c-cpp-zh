    # 1.6.5 Using functions with vectors and matrices


    Since MATLAB is written to work with vectors and matrices, an entire vector or
    matrix can be passed as an argument to a function. MATLAB will evaluate the function
    on every element, and return a vector or matrix with the same dimensions as the
    original. For example, we could pass the following vector vec to the *abs* function
    to get the absolute value of every element.


    ```

    >> vec = -3:4

    vec =

    -3 -2 -1 0 1 2 3 4


    >> abs(vec)

    ans =

    3 2 1 0 1 2 3 4

    ```


    The original vector vec has eight elements, and since the abs function is evaluated
    for every element, the resulting vector also has eight elements.

    This also would be the case for matrices; the result will be the same size as
    the input:


    ```

    >> mat = round(rand(2,3)*10-5)

    mat =

    -3 -2 2

    3 0 4


    >> abs(mat)

    ans =

    3 2 2

    3 0 4

    ```'
