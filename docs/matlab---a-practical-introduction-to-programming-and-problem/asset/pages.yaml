    # SUMMARY


    +   Common Pitfalls

    - Trying to pass just the name of a function to a function; instead, the function
    handle must be passed

    - Thinking that nargin is the number of elements in varargin (it may be, but not
    necessarily; nargin is the total number of input arguments)

    - Forgetting the base for a recursive function


    +   Programming Style Guidelines

    - Use anonymous functions whenever the function body consists of just a simple
    expression.

    - Store related anonymous functions together in one MAT-file.

    - If some inputs and/or outputs will always be passed/to a function, use standard
    input arguments/output arguments for them. Use varargin and varargout only when
    it is not ahead of time when other input/output arguments will be needed.

    - Use iteration of recursion when possible.


    | MATLAB Reserved Words |

    | end (for functions) |


    | MATLAB Functions and Commands |

    | func2str varargin |

    | str2func varargout |

    | fplot nargin |

    | feval nargout |


    | MATLAB Operator |

    | handle of anonymous functions @ |


