    # 4.2 NESTED FOR LOOPS


    The action of a loop can be any valid statement(s). When the action of one loop
    is another loop, this is called a **nested loop.**.


    The general form of for loopvarone = rangeone is as follows:


    ```

    for loopvarone = rangeone ← outer loop


    % actionone includes the inner loop


    for loopvartwo = rangetwo ← inner loop

    actionltwo

    end

    end

    ```


    The first for loop is called the *outer loop*; the second for loop is called the
    *inner loop..* The action of the outer loop consists (in part; there could be
    other state-ments) of the entire inner loop.


