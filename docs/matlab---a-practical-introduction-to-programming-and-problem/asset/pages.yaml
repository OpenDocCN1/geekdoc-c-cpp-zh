    As an example of using this, in the previous chapter we solved the following problem
    using a **while** loop but now we can solve it more efficiently using **find**.
    Data from an experiment has been recorded in a file `experd.dat`. The file has
    some numbers followed by a -99 and then more numbers, all on the same line. The
    only data values that we are interested in, however, are those before the -99.
    The algorithm for the script follows:


    +   - Read the data from the file into a vector.

    - Create a new vector variable newvec that only has the data values up to but
    not including the -99.

    - Plot the new vector values, using black circles.


    # THE EFFICIENT METHOD


    Using the **find** function, we can locate the index of the element that stores
    the -99. Then, the new vector comprises all of the original vector from the first
    element to the index *before* the index of the element that stores the -99.


    ```

    findval.m

    % Reads data from a file, but only plots the numbers

    % up to a flag of -99.Uses find and the colon operator


    load experd.dat

    where = find(experd == -99);

    newvec = experd(1:where-1);


    plot(newvec, ''ko'')

    ```'
