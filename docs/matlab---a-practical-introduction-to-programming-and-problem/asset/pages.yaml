  md: '# 12 CHAPTER 1 Introduction to MATLAB


    # Operator precedence rules


    Some operators have precedence over others. For example, in the expression 4 +
    5 * 3, the multiplication takes precedence over the addition, so first 5 is multiplied
    by 3, then 4 is added to the result. Using parentheses can change the precedence
    in an expression:


    ```

    >> 4 + 5 * 3

    ans =

    19

    ```


    ```

    >> (4 + 5) * 3

    ans =

    27

    ```


    Within a given precedence level, the expressions are evaluated from left to right
    (this is called associativity).


    Nested parentheses are inside of others; the expression in the inner parentheses
    is evaluated first. For example, in the expression 5-6*(4+2), first the addition
    is performed, then the multiplication, and finally the subtraction, to result
    in -31. Parentheses can also be used to make expression clearer. For example,
    in the expression ((4+(3*5))-1), the parentheses are not necessary, but are used
    to show the order in which parts of the expression will be evaluated.


    For the operators that have been covered thus far, the following is the precedence
    (from the highest to the lowest):


    +   - parentheses

    - ^ exponentiation

    - - negation

    - *, \ all multiplication and division

    - +, - addition and subtraction


    # PRACTICE 1.1


    Think about what the results would be for the following expressions, and type
    them in to verify your answers:


    ```

    4^2 - 1

    4^(2 - 1)

    2\3

    4 * 2 - 9/3

    5 - 3

    ```'
