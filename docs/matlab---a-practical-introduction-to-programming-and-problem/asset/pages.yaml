    Common Pitfalls


    +   - Forgetting to initialize a running sum or count variable to 0

    - Forgetting to initialize a running product variable to 1

    - In cases where loops are necessary, not realizing that if an action is required
    for every row in a matrix, the outer loop must be over the rows (and if an action
    is required for every column, the outer loop must be over the columns)

    - Not realizing that it is possible that the action of a while loop will never
    be executed

    - Failing to error-check input into a program


    Programming Style Guidelines


    +   - Use loops for repetition when necessary:

    - for statements as counted loops

    - while statements as conditional loops

    - Do not use i j r for iterator variable names if the use of the built-in constants
    i and j is desired

    - Indent the action of loops

    - If the variable is just being used to specify how many times the action of the
    loop is to be executed, the colon operator 1:n where n is the number of times
    the action is to be executed

    - Preallocate vectors and matrices whenever possible (when the size is ahead of
    time)

    - When data are read in a loop, only store them in their array if it will be necessary
    to access the individual data values again


    | MATLAB Reserved Words |

    | while end |

    | for |


