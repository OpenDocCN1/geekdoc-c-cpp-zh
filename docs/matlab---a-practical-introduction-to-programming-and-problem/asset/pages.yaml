    # 6.2 MATLAB PROGRAM ORGANIZATION


    A MATLAB program typically consists of a script that calls functions to do the
    work.


    # 6.2.1 Modular programs


    A modular program is a program in which the solution is broken down into modules,
    and each implemented as a function. The script that calls these is typically called
    the main program.


    To demonstrate the concept, we will use the very simple example of calculating
    the area of a circle. Section 6.3 much longer and more realistic example will
    be given. For this example, there are three steps in the algorithm to calculate
    the area of a circle:


    +   * Get the input (radius)

    * Calculate the area

    * Display the results


    In a modular program, there would be one main script that calls three separate
    functions to accomplish these tasks:


    +   * A function to prompt the user and read in the radius

    * A function to calculate and return the area of the circle

    * A function to display the results'
