    # CONTENTS


    +   11.1 Plot Functions...........327

    11.2 Animation ............334

    11.3 Three-Dimensional Plots...........335

    11.4 Customizing Plots...........339

    11.5 Handle Graphics and Plot Properties.341

    11.6 Plot Applications...........351


    In Chapter 2, we introduced the use of the function plot in the MATLAB* soft to
    get sample, two-dimensional (2D) plots of x and y represented by two vectors x
    and y. We have also seen some functions that allow customization of these plots.
    In this chapter we will explore other types of plots, ways of customizing plots,
    and some applications that combine plotting with functions and file input. Additionally,
    animation, three-dimensional (3D) plots, and graphics'' properties will be introduced.


    # 11.1 Plot


    So far, we have used plot to create two-dimensional plots and bar to create charts.
    We have seen how to clear the Window using clf, and how to create and number Figure
    Windows using figure. Labeling plots has been accomplished using xlabel, ylabel,
    title, and legend, and we have also seen how to customize the strings passed to
    these functions using sprint. The axis function changes the axes from the defaults
    that would be taken from the data in the x and y vectors to the values specified.
    Finally, the grid and hold toggle functions print graphs or not, or lock the current
    graph in the Figure Window that will the next plot will be superimposed.


