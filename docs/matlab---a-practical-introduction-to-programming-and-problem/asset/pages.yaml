  md: '# CHAPTER 12 Matrix Representation of Linear Algebraic Equations


    ```

    $$\begin{bmatrix} a''_{11} & a''_{12} & b''_1 \ 0 & a''_{22} & b''_2 \end{bmatrix}$

    ```


    So, the goal is simply to replace $a_{21}$ with 0. Here, the primes indicate that
    the values (may) have been changed.


    Putting this back into the equation form yields


    ```

    $$\begin{bmatrix} a''_{11} & a''_{12} \ 0 & a''_{22} \end{bmatrix} \begin{bmatrix}
    x_1 \ x_2 \end{bmatrix} = \begin{bmatrix} b''_1 \ b''_2 \end{bmatrix}$

    ```


    Performing this matrix multiplication for each row results in:


    ```

    $a''_{11}x_1 + a''_{12}x_2 = b''_1$

    $a''_{22}x_2 = b''_2$

    ```


    So, the solution is


    ```

    $x_2 = b''_2 / a''_{22}$

    $x_1 = (b''_1 - a''_{12}x_2) / a''_{11}$

    ```


    Similarly, for a $3 \times 3$ system, the augmented matrix is reduced to upper
    triangular form:


    ```

    $$\begin{bmatrix} a_{11} & a_{12} & a_{13} & b_1 \ a_{21} & a_{22} & a_{23} &
    b_2 \ a_{31} & a_{32} & a_{33} & b_3 \end{bmatrix} \rightarrow \begin{bmatrix}
    a_{11} & a_{12} & a_{13} & b_1 \ 0 & a_{22} & a_{23} & b_2 \ 0 & 0 & a_{33} &
    b_3 \end{bmatrix}$

    ```


    (This will be done systematically by first getting a 0 in the $a_{21}$ position,
    then $a_{31}$, and finally $a_{32}$.) Then, the solution will be:


    ```

    $x_3 = b''_3 / a''_{33}$

    $x_2 = (b''_2 - a''_{21}x_3) / a''_{22}$

    $x_1 = (b''_1 - a''_{13}x_3 - a''_{12}x_2) / a''_{11}$

    ```


    Note that we find the last unknown, $x_3$, first, then the second unknown, $x_2$,
    and then the first unknown. This is why it is called back substitution.


    As an example, consider the following $2 \times 2$ system of equations:


    ```

    $x_1 + 2x_2 = 2$

    $2x_1 + 2x_2 = 6$

    ```


    As a matrix equation $Ax = b$, this is:


    ```

    $$\begin{bmatrix} 1 & 2 \ 2 & 2 \end{bmatrix} \begin{bmatrix} x_1 \ x_2 \end{bmatrix}
    = \begin{bmatrix} 2 \ 6 \end{bmatrix}$

    ```'
