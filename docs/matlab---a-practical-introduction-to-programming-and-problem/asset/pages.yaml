  md: '# SUMMARY


    Common Pitfalls


    +   - Misspelling a file name, which causes a file open to be unsuccessful

    - Using a lower-level file I/O function, when load or save could be used

    - Forgetting that fscanf reads columnwise into a matrix, so every line in the
    file is read into a column in the resulting matrix

    - Forgetting that fscanf converts characters to their ASCII equivalents

    - Forgetting that textscan reads into a cell array (so curly braces are necessary
    to index)

    - Forgetting to use the permission string ''@'' for appending to a file (which
    means the data already in the file would be lost if ''w'' was used!)


    Programming Style Guidelines


    +   - Use load when the file contains the same kind of data on every line and
    in the same format on every line.

    - Always check to make sure files were opened and closed successfully.

    - Make sure that all data are read from a file; for example, use a conditional
    loop to loop until the end of the file is reached rather than using a for loop.

    - Be careful to use the correct formatting string using fscanf or textscan.

    - Store groups of related variables in separate MAT-files.


