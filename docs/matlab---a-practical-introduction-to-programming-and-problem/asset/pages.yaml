  md: '# CHAPTER 2 Introduction to MATLAB Programming


    To create a script, click on File, then New, then Script. (In earlier versions
    of MATLAB, click on File, then New, then M-file.) A new window will appear called
    the Editor. To create a new script, simply type the sequence of statements (note
    that line numbers will appear on the left)


    When finished, save the file using File and Save. Make sure that the extension
    of .m is on the file name (this should be the default). The rules for file names
    are the same as for variables (they must start with a letter, after that there
    can be letters, digits, or the underscore). For example, we will now create a
    script called script1.m that calculates the area of a circle. It assigns a value
    for the radius, and then calculates the area based on that radius.


    In this text, scripts will be displayed in a box with the name of the M-file on
    top.


    ```

    script1.m

    radius = 5

    area = pi* (radius^2)

    ```


    In the Command Window, the type command shows the contents of the file named script1.m;
    note that the .m is not included. The contents of the script can be displayed
    and executed.


    ```

    >> type script1

    radius = 5

    area = pi* (radius^2)

    ```


    There are two ways to view a script once it has been written: either open the
    Editor Window to view it, or use the type command as shown here to display it
    in the Command Window.


    To actually run or execute the script, the name of the file is entered at the
    prompt (again, without the .m). When executed, the results of the assignment statements
    are displayed, since the output was not suppressed for either statement.


