    An alternative method of creating this structure, which is not as efficient, involves
    using the dot operator to refer fields within the structure. The name of the structure
    variable is followed by a dot, or period, and then the name of the field within
    that structure. Assignment statements can be used to assign values to the fields.


    ```

    >> package.item_no = 123;

    >> package.cost = 19.99;

    >> package.price = 39.95;

    >> package.code = ''g''

    ```


    By using the dot operator in the first assignment statement, a structure is created
    with the field item_no. The next three assignment statements add fields to the
    structure variable. Again, extending the structure in the manner is not as efficient
    as using struct.


    Adding a field to a structure later is accomplished as shown here, by using an
    assignment statement.


    An entire structure variable can be assigned to another. This would make sense,
    if the two structures have some values in common. For example, the values from
    one structure are copied into another and then two fields are selectively changed.


