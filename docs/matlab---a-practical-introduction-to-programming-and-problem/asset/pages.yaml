    vector b.


    # Gauss elimination


    The Gauss elimination method consists of:


    +   - creating the augmented matrix $[A|b]$\n- applying EROs to this augmented
    matrix to get an upper triangular form (this is called forward elimination)\n-
    back substitution to solve


    For example, for a $2 \times 2$ system, the augmented matrix would be:


    ```

    $$\begin{bmatrix} a_{11} & a_{12} & b_1 \ a_{21} & a_{22} & b_2 \\end{bmatrix}$

    ```


    Then, elementary row operations are applied to the augmented matrix into an upper
    triangular form (i.e., the square part of the matrix on the left is in upper triangular
    form):'
