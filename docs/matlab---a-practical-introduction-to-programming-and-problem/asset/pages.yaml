    \ for strings, which return **logical true** or **false**. The function isletter`\
    \ returns **logical true** for every character in a string if the character is\
    \ a letter of the alphabet. The function isspace` returns **logical true** if\
    \ the character is a white space character. If strings are passed to these functions,\
    \ they will return **logical true** or **false** for every element, or in other\
    \ words,\n\n```\n>> isletter('EK127')\nans =\n   1 1 0 0 0 0\n```\n\n```\n>> isspace('a\
    \ b')\nans =\n   0 1 0\n```\n\nThe ischar function will return **logical true**\
    \ if the vector argument is a character vector (in other words, a string), or\
    \ **logical false** if not.\n\n```\n>> vec='EK127';\n>> ischar(vec)\nans =\n \
    \  1\n```\n\n```\n>> vec = 3;5;\n>> ischar(vec)\nans =\n   0\n```\n\n# 7.4 CONVERTING\
    \ BETWEEN STRING AND NUMBER TYPES\n\nMATLAB has several functions that convert\
    \ numbers to strings in which each character element is a separate digit and vice\
    \ versa.\n\nTo convert numbers to strings, MATLAB has the functions **int2str**\
    \ for integers and **num2str** for real numbers (which also works with integers).\
    \ The function **int2str** would convert, for example, the integer 4 to the string\
    \ 4.\n\n```\n>> num = 38;\nnum =\n   38\n>> s1 = int2str(num)\ns1 =\n   38\n>>\
    \ length(num)\nans =\n   1\n```"
