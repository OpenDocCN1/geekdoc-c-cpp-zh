  md: "# 1.3.2 Variable names\n\nVariable names are an example of identifier names.\
    \ We will see other examples of identifier names, such as file names, in future\
    \ chapters. The rules for identifier names are:\n\n+   - The name must begin with\
    \ a letter of the alphabet. After that, the name can contain letters, digits,\
    \ and the underscore character (e.g., value_1), but it cannot have a space.\n\
    - There is a limit to the length of the name; the built-in function namelength\
    \ tells us what maximum length is.\n- MATLAB is case-sensitive, which means there\
    \ is a difference between upper- and lowercase cases. So, variables called mynum,\
    \ MYNUM, and Mym are all different (although this would be confusing and should\
    \ not be done).\n- Although underscores are valid in a name, their use can cause\
    \ problems with some programs that interact with MATLAB, so some programmers use\
    \ case instead (e.g., partWeights instead of part_weights)\n- There are certain\
    \ words reserved, or key words, that cannot be used as variable names.\n\nAdditionally,\
    \ variable names should always be mnemonic, which means they should make some\
    \ sense. For example, if the variable is storing the radius of a circle, a name\
    \ such as radius would make sense; x probably wouldn't.\n\nThe Workspace Window\
    \ shows the variables that have been created in the current Command Window and\
    \ their values.\n\nThe following commands relate to variables:\n\n+   - who shows\
    \ variables that have been defined in this Command Window (this just shows the\
    \ names of the variables)\n- whos shows variables that have been defined in this\
    \ Command Window (this shows more information on the variables, similar to what\
    \ is in the Workspace Window)\n- clear clears out all variables so they no longer\
    \ exist\n clear variablename clears out a particular variable\n- clear variablename1\
    \ variablename2 ... clears out list of variables (note: separate the names with\
    \ spaces)\n\nIf nothing appears when who or whos is entered, that means there\
    \ aren't any variables! For example, in the beginning of a MATLAB session, variables\
    \ could be created and then selectively cleared (remember that the semicolon suppresses\
    \ output)."
