    decimal places are specified than necessary, trailing zeros are printed.


    A field width can also be included in the place holder in printf, which specifies
    how many characters are to be used in printing. For example, %5d would indicate
    a field width of 5 for printing an integer and %10s would indicate a field width
    of 10 for a string. For floats, the number of decimal places can be specified;
    example, %.2f means a field width of 6 (including the decimal point and the two
    decimal places) with two decimal places. For floats, the number of decimal places
    can also be specified; %.3f indicates three decimal places, regardless of the
