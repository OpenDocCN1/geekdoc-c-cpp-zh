    \n## 7\\.2 宏定义与展开\n\n### 7\\.2\\.1 `#DEFINE`指令\n\n`#define` 指令允许将有意义的标识符与常量、关键字、语句或表达式关联起来。它有两种形式：\n\
    \n![e9780738671956_i0180.jpg](img/e9780738671956_i0180.jpg)\n\n或者\n\n![e9780738671956_i0181.jpg](img/e9780738671956_i0181.jpg)\n\
    \n第一种称为清单（manifest），第二种称为宏（macro）。如果某个标识符已被定义，则不得在同一源程序中以不同方式重新定义，除非使用“擦除”。\n\n\
    首先我们来讨论清单：每次在使用标记之前都进行预处理吗？不替换引号字符串内部的内容——例如 `DONE NOTIN string printf(“done”)`.这里有一个包含若干指令的示例展示了预处理器输出的相应变化：\n\
    \n现在来讨论宏：一种类似但不同于函数调用的方法可实现内联扩展而非跳转指令。——例如定义一个最小值的宏 MIN(a,b) ((a)< (b)?(a):(b))\
    \ 。当写为 x = MIN(y,z);时直接展开为条件运算结果 ,需小心避免副作用比如参数带有++运算符导致双重递增等 ;圆括号至关重要确保正确的求值顺序\
    \ .更好的做法是分别保护每个参数 。\n\n相比常规调用可以减少开销省去压栈弹栈操作;标准库头文件中常包含 getchar putChar 的定义以提高字符处理速度且不影响清晰性.\n\
    \n特殊运算符可用于通过 #前缀拼接生成字面量并连接相邻片段。##符号可将左右两侧部分组成单一复合词项 ，示例如逆序输入得到组合的结果。）\n\n### ∎UNDEF\
    \ Directive</h3> \n一旦定义的数值无法更改,除非删除后才能用 UNDEF 关键字的赋值给新的声明表示不再有效原意明确了意图 </section></div>)<！--End\
