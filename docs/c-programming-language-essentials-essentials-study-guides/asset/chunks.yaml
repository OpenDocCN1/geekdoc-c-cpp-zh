    # WHAT “THE ESSENTIALS” WILL DO FOR YOU


    This book is a review and study guide. It is comprehensive and it is concise.


    It helps in preparing for exams and in doing homework, and remains a handy reference
    source at all times.


    It condenses the vast amount of detail characteristic of the subject matter and
    summarizes the essentials of the field.


    It will thus save hours of study and preparation time.


    The book provides quick access to the important facts, principles, and concepts
    in the field.


    Materials needed for exams can be reviewed in summary form – eliminating the need
    to read and re-read many pages of textbook and class notes. The summaries will
    even tend to bring detail to mind that had been previously read or noted.


    This “ESSENTIALS” book has been prepared by an expert in the field, and has been
    carefully reviewed to ensure its accuracy and maximum usefulness.


    Dr. Max Fogiel


    Program Director


