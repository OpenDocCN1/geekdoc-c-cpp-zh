    A RETURN statement is used to terminate execution of a function. It may also be
    used to return a value. There are two possible forms


    ![e9780738671956_i0095.jpg](images/e9780738671956_i0095.jpg)


    In the first case no value is returned by the function. In the second case the
    value of the expression is returned. The type of the expression is converted to
    the type of the function. Here are some examples:


