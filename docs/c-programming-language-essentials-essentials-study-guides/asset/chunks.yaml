  raw: 'A prototype is a declaration of a function which contains information regarding
    the types of the parameters, but need not contain names for the parameters. This
    is used in the “NEW” style when a function is declared separate from its definition.
    For example, if the function from the previous section, getline, were to be called
    from main then main would have to contain a declaration of the form


    ![e9780738671956_i0151.jpg](images/e9780738671956_i0151.jpg)


    The purpose of the prototype is to provide information to the compiler so that
    the type, number, and order of parameters may be checked during translation. This
    checking was not present in some “OLD” style versions of C, so prototypes were
    a convenience for the reader, if they were available at all.


    # 6.1.4 FUNCTION DEFINITION


    A function definition consists of a declaration and the collection of statements
    that determine what a function does. The definition is the block of a function.
    The following is a definition of a function which returns the dotproduct of the
    two vectors or arrays x and y. We assume that each array has n elements. Line
    1 is a declaration and the remainder is the block.


    ![e9780738671956_i0152.jpg](images/e9780738671956_i0152.jpg)![e9780738671956_i0153.jpg](images/e9780738671956_i0153.jpg)


    The parameters of the function have the function as their scope, may not have
    any storage class declaration except for register, may not be initialized, and
    are assumed to be of type int unless a type is declared.


    The remainder of the function definition consists of the block or body of the
    function. As it is a block, it begins with { and ends with } . The contents of
    the block are declarations and statements. Functions may not contain the definition
    of another function; they may not be nested and are all on the same level. Naturally,
    a function may call another function. If a function is to return a value then
    it must contain a return statement. The value returned by a function is the value
    of the expression in the return statement. Execution of an instance of a function
    terminates when a return statement is executed or when the flow of control leaves
    no more statements before the final } to be executed.


    Consider the following:


    ![e9780738671956_i0154.jpg](images/e9780738671956_i0154.jpg)


    This function performs a binary search for item within the array list. If item
    is in list then the function returns its position. Otherwise, it returns -1\.
    Line 1 contains the declaration. The parameters are Item, list, and n. Lines 2
    – 14 are the block or body of the function. If we ever get to statement 11 then
    the function terminates and returns the value mid. Otherwise, we assume that statement
    13 will eventually be executed and the function will return a value of -1.


    # 6.1.5 VARIABLE ARGUMENT LISTS


    Most functions are written with a fixed number of arguments, but it is possible
    to define functions that take a variable number of arguments. printf is an example
    of such a function. In that case, not only may the number be variable, but also
    each type of the arguments may be variable.


    The definition and calling of functions with a variable number of arguments may
    differ between “OLD” style compilers and those that meet the ANSI Standard. Here
    we discuss methods compatible with the ANSI Standard. In order to define a function
    with a variable number of arguments:


    1.  The header file <stdarg.h> must be included in the source file that contains
    a function with a variable number of arguments. This defines a type va_list, a
    macro va_arg, and a function va_end for use with variable argument lists.


    2.  The function must be declared with ellipses (...) following the fixed parameter
    list, e.g., int summer ( int count, ... ).


    3.  The number of arguments used when calling the function must be equal to or
    greater than the number of fixed parameters, e.g., in our example summer(count)
    is valid as is summer(count, num1, num2, num3).


    4.  The header file <stdarg.h> must be included in the source file that contains
    a function with a variable number of arguments. This defines a type va_list, a
    macro va_arg, and a function va_end for use with variable arguments lists.


    5.  A variable of type va_list must be declared in the function.


    6.  va_start must be applied to the variable immediately preceding the ,... in
    the function declaration.


    7.  va_arg is used to get items of the proper type from the argument list.


    8.  va_end must be called before a return is executed.


    Here is an example which produces the output


    ![e9780738671956_i0155.jpg](images/e9780738671956_i0155.jpg)![e9780738671956_i0156.jpg](images/e9780738671956_i0156.jpg)


    # 6.2 FUNCTION ARGUMENTS AND PARAMETERS


    The identifiers appearing in the identifier list of a function declaration are
    referred to as the formal parameters or parameters of a function. The identifiers
    appearing in the identifier list of a call to a function are referred to as the
    actual parameters or arguments of a function. In the following statements, for
    example, x,y, and z are names of parameters and name1, scores, and ave are arguments.


    ![e9780738671956_i0157.jpg](images/e9780738671956_i0157.jpg)


    The number of arguments must be the same as the number of parameters in the declaration,
    unless a variable number of arguments is indicated in the declaration. In the
    latter case the number of arguments must exceed or match the number of parameters
    listed in the declaration.


    The arguments may be evaluated in any order. This means that it is possible that
    one compiler translates the statements


    ![e9780738671956_i0158.jpg](images/e9780738671956_i0158.jpg)


    as access (12, a[13]), while another compiler may translate them as access(12,a[12]).
    The element of a whose value is passed to access is determined by the order of
    evaluation. It is not a good idea to write programs whose results depend upon
    the order of evaluation of arguments to a function.


    All arguments are passed by value. This means that the argument is evaluated and
    its value is made available to a function to take the place of the parameters.
    This also means that a function cannot modify any of its arguments, only the value
    of its arguments. To have a function modify an object, it must receive the address
    of the object. If the address of an object is an argument then the function cannot
    modify the address but it may modify the contents of the address. For example
    a function which would swap the contents of two integer objects would be written
    as


    ![e9780738671956_i0159.jpg](images/e9780738671956_i0159.jpg)


    Here is an example of a call to the function.


    ![e9780738671956_i0160.jpg](images/e9780738671956_i0160.jpg)


    The & operator is used to make the addresses available to the function. Arrays
    and functions used as arguments don’t need the & before their names. Arrays and
    functions evaluate as addresses in a function call. Thus elements of arrays may
    be modified through functions. Here is an example of a function that copies one
    string to another. The first implementation uses arrays and the second pointers.
    The functions achieve the same results and either may be called with arguments
    that are arrays or pointers to char.


    ![e9780738671956_i0161.jpg](images/e9780738671956_i0161.jpg)![e9780738671956_i0162.jpg](images/e9780738671956_i0162.jpg)


    # 6.2.1 ARGUMENT CONVERSION RULES


    The types of the arguments to a function are converted to the types of the parameters
    in the declaration. It is best to have a prototype declaration wherever the function
    will be called. In that case the conversions are performed as if by assignment.
    For example,


    ![e9780738671956_i0163.jpg](images/e9780738671956_i0163.jpg)


    If no prototype is present then the automatic conversions take effect. In the
    previous example, without a prototype the 12 in the call to fun1 would be converted
    to double instead of float.


    # 6.2.2 PASSING DERIVED TYPES


    Arrays of a specific type are passed as pointer to that type. The following prototypes
    are thus equivalent.'
