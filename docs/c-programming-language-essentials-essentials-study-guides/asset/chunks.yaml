  raw: '# 3.8 ADDITIVE EXPRESSIONS


    Additive expressions are binary expressions, evaluated from left to right, and
    have precedence immediately below multiplicative expressions. The operators used
    in additive expressions are


    | + | addition |


    | — | subtraction. |


    # 3.8.1 ADDITION EXPRESSIONS


    Addition expressions have the form operand1 + operand2. If both operands are numeric
    then it evaluates to the sum of the operands. A pointer into an array and any
    integral type may be added. If p is a pointer then p + j points to an object j
    times (sizeof*p) bytes past p in memory. So if aray is an array and p = & aray[i]
    then p + j is the address of aray[i + j]. Also *(p+j) references the value of
    aray[i + j]. If the resulting addition of a pointer into an array and an integer
    yields a value outside the bounds of the array then the result may be undefined.
    Only if the sum is one past the end of the array is the result defined. For example
    if we have the program fragment


    ![e9780738671956_i0052.jpg](images/e9780738671956_i0052.jpg)


    then a reference of p+10 is valid or defined while p+11 may not be valid.


    # 3.8.2 SUBTRACTION EXPRESSIONS


    A subtraction expression has the form operand1 – operand2 . If both operands are
    numeric then it evaluates to the difference of the operands. A pointer into an
    array and any integral type may be subtracted. Also one pointer may be subtracted
    from another provided that they point to objects in the same array. Otherwise
    the result may not be defined. For example if we have the program fragment


    ![e9780738671956_i0053.jpg](images/e9780738671956_i0053.jpg)


    then q – p is equal to 9\. Also p + (q – p)/2 points to aray[4].


    # 3.9 BITWISE SHIFT EXPRESSIONS


    The operators » and « shift the bits of an integer right or left, respectively.
    Bitwise shift expressions have the form operand1 >> operand2 or operand 1 << operand2.
    Both operands must be one of the integral types. Appropriate promotions take place.
    If operand2, the expression on the right, is negative or greater than or equal
    to the number of bits of the operand on the left then the result is undefined.
    If operand1 is unsigned then all vacated bits are filled with zeros. Otherwise,
    all vacated bits except for the sign bit are filled with zeros. Octal representation
    of an integer is used in the place of operand1 in the following examples.


    001062 » 3 yields 000106 001062 « 3 yields 010620


    # 3.10 RELATIONAL EXPRESSIONS


    Relational expressions are used for comparison of the values of expressions. The
    relational operators are


    | < | less than | > | greater than |


    | <= | less than or equal | >= | greater than or equal. |


    The result of a relational expression is either 1, if the relation is true, or
    0 otherwise. The operands to a relational expression must be either both arithmetic
    or both pointer types. If pointers are used they must point into the same array.
    Appropriate promotions or conversions are performed to evaluate the relational
    expression. Below we make remarks concerning the operator >. Similar remarks hold
    for each of the operators.


    Consider the expression p > q. Suppose p is unsigned int and q is int. During
    the evaluation of the expression, q will be promoted to unsigned. If q is negative
    then as the result of the promotion it will be interpreted as a very large value.
    It is better to write (signed int) p > q.


    Expressions of the form a > b > c are valid, but are not evaluated in the usual
    mathematical sense. The expression is evaluated from left to right. If it happens
    that a is greater than b then a > b will result in a value of 1\. Then the expression
    1 > c is evaluated. The operator &&, discussed below, can be used to determine
    if a > b and b > c.


    # 3.11 EQUALITY EXPRESSIONS


    Equality expressions use the operators == and !=. The operators are binary operators.
    As in the case of relational expressions, a value of 1 is returned if the expression
    is true and 0 otherwise. These operators are at a lower level of precedence than
    the relational operators. The usual conversions are performed. If we have the
    following program fragment


    ![e9780738671956_i0055.jpg](images/e9780738671956_i0055.jpg)


    we can expect that a == x, a == y, and y == x each evaluate to 1. These operators
    may also be used to compare pointers. Be aware that the expression operand1 ==
    operand2 is much different that operand1 = operand2\. The former is used to determine
    if the two operands have the same value while the latter is an assignment statement
    which causes a modification of operand1.


    # 3.12 BITWISE AND EXPRESSIONS


    Bitwise AND expressions have the form operand1 & operand2. Both operands must
    be integral and the usual conversions are performed. The result of the operation
    is another object of integral type in which each bit is 1 if the corresponding
    bits in both operands were 1, and 0 otherwise. Since the binary representation
    for twelve is 1100 and the binary representation for ten is 1010, 12 & 10 yields
    eight whose binary representation is 1000\. If we use octal representation then
    02061 & 02345 results in 02041\. If a, b, and c are integral types and a is greater
    than b, and b is greater than c then a > b & b > c evaluates to 1\. The bitwise
    AND is sometimes referred to as a “masking operation.” For example we may determine
    the contents of the 4 rightmost bits of x by evaluating x & 017.


    The operation & is commutative and associative. An expression of the form (c &
    s) & (a & t) may be evaluated (c & a) & (s & t).


    # 3.13 Bitwise exclusive OR EXPRESSIONS


    Bitwise exclusive OR expressions have the form operand 1 ^ operand2. Both operands
    must be integral and the usual conversions are performed. The result of the operation
    is another object of integral type in which each bit is 1 if the corresponding
    bits in both operands were different, and 0 if they were the same. This is sometimes
    called an exclusive or operation. Since the binary representation for twelve is
    1100 and the binary representation for ten is 1010, 12 ^ 10 yields six whose binary
    representation is 0110\. If we use octal representation then 02061 ^ 02345 results
    in 00324.


    The operation ^ is commutative and associative. An expression of the form (c ^
    s) ^ (a ^ t) may be evaluated (c ^ a) ^ (s ^ t).


    # 3.14 Bitwise OR EXPRESSIONS


    Bitwise OR expressions have the form operand1 | operand2. Both operands must be
    integral and the usual conversions are performed. The result of the operation
    is another object of integral type in which each bit is 1 if the corresponding
    bits in either operand were a one, and 0 if they both were zero. Since the binary
    representation for twelve is 1100 and the binary representation for ten is 1010,
    12 | 10 yields fourteen whose binary representation is 1110\. If we use octal
    representation then 02061 | 02345 results in 02365.


    The operation | is commutative and associative. An expression of the form (c |
    s) | (a | t) may be evaluated (c | a) | (s |t).


    # 3.15 LOGICAL AND (&&) and OR (| |) EXPRESSIONS


    There are two logical operators:


    && AND || OR


    The operator && has a higher precedence than the operator | |. These logical expressions
    are evaluated to the point that the outcome may be determined. In an expression
    of the form operand1 && operand2, if operand1 evaluates to 0, then operand2 is
    not evaluated. In an expression of the form operand1 | | operand2, if operand1
    evaluates to 1 then operand 2 is not evaluated. In other words, an AND expression
    is evaluated until one of the operands is false, and an OR expression is evaluated
    until one of the expressions is true.


    # 3.15.1 LOGICAL AND (&&) EXPRESSIONS'
