    # CHAPTER 3


    # EXPRESSIONS


    # 3.1 EXPRESSION DEFINITIONS


    Expressions provide a means for manipulating variables and constants. They are
    made up of identifiers and operators.


    # 3.1.1 OBJECTS AND LVALUES


    A data object is a portion of memory that is treated as a unit by a program. The
    objects may be examined and/or modified. Objects that can be modified are called
    lvalues. They get their name from the fact that if a variable is an lvalue then
    it may appear on the left of an assignment operator. The declaration int abc[10];
    declares abc as the name of an array. It is an object, of ten integers, each of
    which is an object. It is not possible to place abc to the left of an assignment
    operator since the “value” of abc is the address of the array. However, the expression
    a[4] = 23; is a valid expression. While the array is not an lvalue, each of the
    elements of the array are. Likewise a[4+1] is an lvalue, but a[4] + 1 is not.
    Some expressions are lvalues while others are not. As we discuss operators and
    expressions we will indicate whether each is an lvalue.


    # 3.2 PRECEDENCE AND ASSOCIATIVITY OF OPERATORS


    The operators of C were given in section 1.5\. Here we present them in order of
    their precedence, from highest to lowest, along with their associativity.


    | Operators | Associativity |


    | --- | --- |


    | () [] – >. | left to right¹ |


    | ! ∼ ++ – – + – * & (type) sizeof | right to left² |


    | * / % | left to right |


    | + – | left to right |


    | < < > > | left to right |


    | < <= > >= | left to right |


    | = = != | left to right |


    | & | left to right |


    | ^ | left to right |


    | &#124; | left to right |


    | && | left to right |


    | &#124; &#124; | left to right |


    | ?: | right to left |


    | = + = – = * = /= %= &= ^= &#124;= <<= >>= | right to left |


    | , | left to right |


    | (1) () includes function calls and parenthesized expressions |


    | (2) +, –, * indicate unary operators |


    # 3.3 PRIMARY EXPRESSIONS


    There are four kinds of primary expressions: identifier or name, constant or literal,
    string, and parenthesized expressions of the form (expression).


    # 3.3.1 IDENTIFIER PRIMARY EXPRESSION


    A declared identifier or name is a primary expression. The type of a primary expression
    is the declared type of the identifier. It is an lvalue if the identifier is declared
    to be arithmetic, pointer, enumeration, structure, or union type. Array names
    and function names are not lvalues.


    # 3.3.2 CONSTANT PRIMARY EXPRESSIONS


    A constant or string literal is a primary expression. It evaluates to an object
    of the type of the constant. For example, 34.67 is a literal which evaluates to
    type double or float and “Hello” is a string constant which evaluates to an array
    of char or a pointer to char. Constant primary expressions are not lvalues.


    # 3.3.3 PARENTHESIZED EXPRESSIONS


    A parenthesized expression consists of a left parenthesis, followed by any expression,
    and followed by a right parenthesis. The value of the parenthesized expression
    is the value of the expression within the parentheses. If the expression within
    the parentheses is an lvalue then so is the parenthesized expression.


    # 3.4 POSTFIX EXPRESSIONS


    Postfix expressions are


    subscripted expressions – expressions that contain a subscript such as references
    to array elements,


    function call expressions – the expressions used to call a function,


    component selection expressions – those used to reference a member of a structure
    or a union, and


    postincrement or postdecrement expressions – those used to increase or decrease
    the value of an expression after it has been evaluated.


    # 3.4.1 SUBSCRIPTED EXPRESSIONS


    A subscripted expression is an expression followed by another expression enclosed
    in square brackets, e.g., temps[1+w]. Such expressions are used to refer to a
    single element of an array. The expression outside of the brackets must be the
    name of an array or evaluate to the address of the beginning of an array. The
    expression inside the brackets must be an expression of type integer. The postfix
    expression a[i] is evaluated as *(a + i). Recall that a holds the address of a[0]
    and we are referencing the i^(th) element past the beginning of the array. Since
    we are accessing array elements the expression within the brackets must evaluate
    to an integer. Since a[i] is the same as *(a + i) array subscripts must start
    with the value 0\. Elements of multidimensional arrays are referenced by subscripted
    expressions. For example: shelves [2] [34] references the 34^(th) element of the
    2^(nd) row of the two-dimensional array shelves. Subscripted expressions are lvalues.


    # 3.4.2 FUNCTION CALL EXPRESSIONS


    A function may be called or invoked by an expression of the form


    ![e9780738671956_i0035.jpg](images/e9780738671956_i0035.jpg)


    That is, a function name followed by a list of zero or more arguments enclosed
    in parentheses. Commas are used to separate the arguments. Some examples are:
    fun1(), odd(x), simpstat(data, mean, var, num-1), xchange(&g,&h) and dotprod (x,z[3]).
    The function fun1 has no arguments, odd has one argument, and the others have
    several. Naturally the order of the arguments must match the list of parameters
    in the function definition or declaration. The arguments may be evaluated in any
    order. Assume i equals 5\. On one machine it may be that funy(i,i++) has the same
    effect as writing funy(5,5) while on another it may be equivalent to the function
    call f(5,6).


    Since functions may be (and often are) compiled separately, it is important to
    declare functions. That way the compiler can check for the proper number, type
    and order of arguments for each function call.


    The arguments to a function are evaluated when the function expression is executed.
    Only the values of the arguments, the result of this evaluation, are passed to
    the function. All arguments are thus passed by value. Functions may modify array
    elements if the address of the array – the name of the array or a pointer to the
    array – is an argument. The values held in other variables may be modified by
    a function if it receives the address of that variable. In one example above we
    used &g and &h as xchange modifies the values in g and h.


    # 3.4.3 STRUCTURE MEMBER AND UNION MEMBER EXPRESSIONS


    A structure or a union is a data object with a number of components of possibly
    different types. The operators . and → are used to select the components.


    Consider the declaration


    ![e9780738671956_i0036.jpg](images/e9780738671956_i0036.jpg)


    We can select or refer to the second component of each of the first two variables
    as me.idnum or top→idnum. Since class473 is an array, each of its elements class473[0]
    thru class473[29] is a structure. Each of these has a second component and they
    may be referred to or selected as class473[0].idnum, class473[1].idnum, ..., class473[29].idnum.
