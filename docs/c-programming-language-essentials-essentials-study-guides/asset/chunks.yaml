  raw: 'An object that is declared within a block or function, exists only when the
    statements in that block are being executed. Each time a block or function is
    entered a new instance of the object is created (unless we use the key word static
    in its declaration). When the block or function is left the current instance is
    destroyed or discarded.


    # 5.2 THE FORMAT AND TERMINOLOGY OF DECLARATIONS


    The format of a declaration consists of a declaration specifier, followed by a
    declarator list, followed by a semicolon. For example,


    ![e9780738671956_i0104.jpg](images/e9780738671956_i0104.jpg)


    Here static int is the declaration specifier and the remainder up to the semicolon,
    is the declarator list. Declaration specifiers may be either storage class specifiers,
    type specifiers, or type qualifiers. In the example above static is a storage
    class specifier and int is a type specifier.


    # 5.3 STORAGE CLASS SPECIFIERS


    The storage for an object is classified as one of two primary classes: automatic
    and static. An object has automatic storage class if it exists only when the block
    which contains it is being executed. An object has static storage class if its
    existence is independent of a block of the current program. In addition to these
    primary classes, an object may be a type definition, it may be stored in a register,
    or it may have an external storage class which indicates that it is defined elsewhere.


    The storage classes available are:


    | Type of Storage Class | Storage Class Specifier |


    | --- | --- |


    | automatic | auto |


    | register | register |


    | static | static |


    | external | extern |


    | type definition | typedef |


    If a storage class specifier is not used when a declaration is made then an object
    in the declarator list is given a default storage class. That storage class depends
    upon where its declaration appears. If an object is declared within a block or
    function then its default storage class is auto. Functions declared within functions
    are taken to be extern. If it is declared outside any block then it is assumed
    to be static with external storage class.


    # 5.3.1 AUTOMATIC DECLARATIONS


    An object if given storage class auto with a declaration of the form


    ![e9780738671956_i0106.jpg](images/e9780738671956_i0106.jpg)


    The auto storage class may only be used within functions and blocks. This establishes
    storage for the object(s). An instance of such an object is created when the function
    or block is entered and it is discarded when the function or block is left.


    # 5.3.2 REGISTER DECLARATIONS


    An object if given storage class register with a declaration of the form


    ![e9780738671956_i0107.jpg](images/e9780738671956_i0107.jpg)


    A register declaration is equivalent to an auto declaration. Additionally it implies,
    that the object will be stored in a register of the computer. This is not necessarily
    the case and it varies among implementations. However, it is not possible to obtain
    the address (use the & operator) of an object of register storage class. This
    means that an object of register storage class cannot be modified by a pointer.


    # 5.3.3 STATIC DECLARATIONS


    An object if given storage class static with a declaration of the form


    ![e9780738671956_i0108.jpg](images/e9780738671956_i0108.jpg)


    If an object is declared static inside a block then the object exists whether
    the block that contains it is being executed or not. Storage is allocated for
    it during compilation and the object retains its value throughout the life of
    the program. If the declarator list contains an initialization, then the object
    is initialized once. In the following example the object times_called is initialized
    to 0 and retains its value from invocation to invocation of fun.


    ![e9780738671956_i0109.jpg](images/e9780738671956_i0109.jpg)


    If an object is declared static outside of a block then the object’s lifetime
    is the same as the program, and it has internal linkage. This means that it may
    only be referred to in any block following its declaration within the file in
    which it is declared. Its use is restricted to one file and it is private to that
    file.


    # 5.3.4 EXTERN DECLARATIONS


    The declaration extern is often used for objects that are defined in one file
    and are also to be used in another. An object declared using the extern specifier
    must have a definition somewhere else in one of the files that make up the C program.
    That means it must be declared either with static storage class in the same file
    or be declared without extern storage class in some other file. Declaring the
    object by one of these means causes the object to be defined in the sense that
    space is allocated for it. If it is declared with a static storage class in another
    file then it cannot be declared with extern storage class. An object with extern
    in its declaration has external linkage if it is defined in another file. If it
    is defined in the same file and the storage class is static then it has internal
    linkage. Here is an example.


    ![e9780738671956_i0110.jpg](images/e9780738671956_i0110.jpg)


    In File 1 the variable x in main is declared using the keyword extern. This means
    that it is declared in another file or later on in the same file. Space is allocated
    for it when that declaration is compiled. The declaration of x in File 2 is the
    definition of x. The variable w in main is declared using extern. It is declared
    and defined later on in File 1. This is internal linkage.


    # 5.3.5 TYPEDEF DECLARATIONS


    The typedef specifier is used to associate an identifier with a type. It doesn’t
    create a new type or allocate storage. It does provide a means to give a synonym
    to an existing type. For example


    ![e9780738671956_i0111.jpg](images/e9780738671956_i0111.jpg)


    # 5.4 TYPE QUALIFIERS


    The qualifier const is used to specify that an object will never change its value
    once it has been initialized. Such an object is called a constant. The qualifier
    volatile is used to indicate that an object may change its value without any action
    of the program. The object may be controlled by hardware or some combination of
    hardware and software external to the program.


    # 5.4.1 THE CONST QUALIFIER


    If the const qualifier is used in a declaration then the declared object may be
    initialized, but not modified after that. For example, after the declarations


    ![e9780738671956_i0112.jpg](images/e9780738671956_i0112.jpg)


    it is not allowable to write pint = &i; If that were allowed, it would be impossible
    to modify i by a statement such as *p = 23; also note that I was initialized to
    10\. const can be used effectively with function parameters. Consider


    ![e9780738671956_i0113.jpg](images/e9780738671956_i0113.jpg)


    Here both s and t are pointers to characters. The object s may only be used to
    examine the characters to which it points. They may not be modified and so are
    protected from changes by the function. The object t may be used to examine and
    modify the characters to which it points.


    # 5.4.2 THE VOLATILE QUALIFIER


    An object may be declared volatile. This means its value must be checked every
    time it is used. This reduces the possibilities for optimization since it is not
    possible to store the value in a temporary location for use in a sequence of statements.
    It would be reasonable to declare an object whose value is the system clock as
    volatile. It would also be reasonable to declare that object as const, since it
    should not be modified by a program.


    # 5.5 TYPE SPECIFIERS


    Type specifiers name the data type of the object being declared. Some name the
    elementary or simple data types and others name the derived types.


    # 5.5.1 SIMPLE SPECIFIERS


    The simple specifiers are those which name the simple data types. They are:


    | void | char | short |


    | int | long | float |


    | double | signed | unsigned |


    # 5.5.2 STRUCTURE SPECIFIERS


    An object which is a struct data type may be declared in one of three ways


    1.  struct {member-list} identifier -list;


    2.  struct structure-tag identifier-list;'
