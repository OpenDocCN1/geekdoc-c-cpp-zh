    and is discussed in the next section.


    # 2.3.3 POINTERS AND ARRAYS


    Pointers and arrays have a great deal in common in C. Suppose xray is the name
    of an array. The object xray has the address of the first element of the array,
    xray[0], as its value. So if the elements of xray have type T, xray is a pointer
    to an object of type T. Remember that xray has as its value the address of xray[0],
    which may be written as &xray[0]. To be concrete suppose we have the following
    declarations:


    ![e9780738671956_i0025.jpg](images/e9780738671956_i0025.jpg)


    Now it makes perfect sense to write fp = &xray[0]. That assigns the address of
    xray[0] to fp. That statement is equivalent to fp = xray for the reasons discussed
    above. From our comments on pointer arithmetic we know that fp + 2 points to an
    object of type float and that it is located at the value of fp plus twice the
    size of a float object. But if fp holds the address of the xray[0] then fp + 2
    refers to xray[2]. In this case fp+i is the address of xray[i] and *(fp+i) represents
    the contents of xray[i]. Likewise xray+i represents xray[i] and *(xray+i) represents
    the contents of xray[i]. Here is an example:


    ![e9780738671956_i0026.jpg](images/e9780738671956_i0026.jpg)


    While arrays and pointers are similar they are not the same. A pointer is a variable
    while an array, that is, the address of an array, is a constant. In the example
    above we changed the value of p by writing p = p + 1\. We could not do that with
    x. Putting the name of an array on the left of an assignment symbol, such as writing
    x = x + 1, implies that the address of the array would be changed. That’s not
    possible. Likewise if x is the name of an array then x++, ++x, – – x, x – – is
    not allowed, but if p is a pointer then those prefix and postfix operators may
    be applied to p.


    # 2.3.4 FUNCTIONS


    Functions are executable code but they do have a type associated with them. The
    type of the function is declared when the function is declared. For example,


    ![e9780738671956_i0027.jpg](images/e9780738671956_i0027.jpg)


    are declarations of functions. The second will return a value of type double,
    the third a value of type pointer to char, and the first returns no value. It
    is also possible to define a pointer to a function. This is useful for the cases
    in which a function is an argument to another function.


    # 2.3.5 STRUCTURES


    A structure in C is a data object similar to a record in COBOL or Pascal. It consists
    of several objects, each of which must be named and each may be a different type.
    Recall that each object in an array must be of the same type so that an array
    is termed homogeneous. A structure may be a heterogeneous collection of objects.


    An example is


    ![e9780738671956_i0028.jpg](images/e9780738671956_i0028.jpg)


    This is not a variable but the form of a structure named student; student is called
    the structure tag. We can declare variables as struct student me, class473[30],
    *top;. Here me is a structure of the form of student, class473 is an array of
    thirty structures, and top is a pointer to a structure of form student. Also me.name
    is how we refer to the name field of me, class473[6].idnum is the idnum field
    of the seventh element of class473, and either top→ gpa or (*top).gpa refers to
    the gpa field of the object pointed to by top.


    Structures may also be used to refer to individual bits of objects. In this case
    we say they are bit fields. For example


    ![e9780738671956_i0029.jpg](images/e9780738671956_i0029.jpg)


    followed by struct exmpl forbytes; allows us to refer to the first bit of forbytes
    as forbytes.sbit, the next seven bits as forbytes.rbyte, and so on.


    # 2.3.6 UNIONS


    A union in C is similar to a “variant record” in Pascal. Its form and syntax is
    the same as for structures. However, the implementation is different. Only one
    of the fields is present in memory at any one time. For example union varitype
    { int ival; float rval; char cval; } defines a union structure whose tag is varitype.
    A variable of this type is declared as union varitype invar. We may refer to invar.ival,
    invar.rval, or inval.cval. Each of these refer to the same memory location and
    are interpreted as integer, floating point, or char respectively. The compiler
    allocates the maximum necessary space when the program is translated. The union
    type is useful, but can also lead to problems unless care is used.


    # 2.4 CONVERSIONS FROM ONE TYPE TO ANOTHER


    Type conversions are a usual and normal part of most languages. Consider int i,
    x; float y; x = 23; y = 12.3; i = x + y;. Since x and y are different types one
    must be converted to perform the addition. In C, as in most languages, the value
    in x is temporarily converted to float and the result of the addition is 35.3.
    This value must be stored into the location named i which is type int, so that
    another conversion must take place. Here the result of the addition is converted
    to 35 and stored in the location named i. This was a relatively simple case.


    Type conversion and its rules may get very complicated as it sometimes depends
    on the particular implementation of the compiler and representation of data objects.
    However, we expect the “law of least astonishment” to hold. We expect to preserve
    the original value whenever possible. If the new type cannot represent the original
    value then we expect as best an approximation as possible. C is not as strict
    about enforcing type compatibility as other languages, such as Pascal. Wherever
    possible type conversions are performed.


    We have been discussing implicit conversions performed by the languages system.
    A programmer may provide instructions for explicit conversions through the use
    of the cast expressions.


    # 2.4.1 PROMOTIONS


    In order to reduce the number of operators necessary to perform computations some
    types are “widened” or “promoted” to types that can represent all the values of
    the original type.


    | Original | Promoted to |


    | --- | --- |


    | char, short | int |


    | unsigned char | unsigned |


    | unsigned short | unsigned |


    | float | double |


    | ’array of’ | ’pointer to’ |


    | ’function returning’ | ’pointer to function returning’ |


    # 2.4.2 ARITHMETIC CONVERSIONS


    Some conversions are performed to allow for arithmetic calculations as discussed
    above. Here are rules governing necessary conversions.


    1.  If one operand is type double, then the other operand is converted to type
    double.


    2.  Otherwise, if one operand is type unsigned long int, the other is converted
    to unsigned long int.


    3.  Otherwise, if one operand is type long int, and the other operand is type
    unsigned int, then each of the two operands is converted to type unsigned long
    int.


    4.  Otherwise, if one operand is of type long int, then the other operand (necessarily
    of type int) is converted to type long int.


    5.  Otherwise if one operand is of type unsigned int, then the other is converted
    to type unsigned int.


    # 2.4.3 OTHER CONVERSIONS


    When floating point objects are converted to integer objects the fractional part
    is discarded. It may happen that the floating point value is beyond the range
    of representable integer values. In that case the result is not specified. It
    may result in an overflow exception or a value that has no meaningful relation
    to the original value.


    There are a number of other cases to consider, such as conversion from one type
    of floating point type to another, from one type of integer type (remember there
    are six) to another, and so on. The reader should consult a reference book on
    C for these details.


