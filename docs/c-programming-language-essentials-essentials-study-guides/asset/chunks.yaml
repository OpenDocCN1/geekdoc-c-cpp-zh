    \n因此,除非有必要指定字符串的含义时才会用到它.当然良好习惯是使用它来提高程序可读性.\n\n# 1.3 IDENTIFIERS\n\n**Identifiers**用于命名变量函数类型及标签一个字母(大小写均可)下划线'_'以及数字构成序列；其中首字必须是英文字母且区分大小写在单个函数内部局部标示前31个有效通过外部链接共享只关注头六个由实现决定以下是合法互不相同示例:`Abc23`,`abc23`,`ab_c23`,\
