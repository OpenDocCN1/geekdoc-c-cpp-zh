    # CHAPTER 5


    # DECLARATIONS


    Declarations are used to associate identifiers with data objects and to give information
    about the lifetime of data objects. Variables, constants, types, structures, and
    functions are declared to the translator or compiler. The compiler may then allocate
    space for these objects, determine which operations may be applied to these objects,
    determine any conversions that are necessary, and also determine in which portions
    of the program the variable will exist. Also, a data object may be assigned a
    specific storage class.


    # 5.1 USE OF IDENTIFIERS


    All identifiers must be declared. A declaration conveys information about the
    type and lifetime of an identifier. The lifetime or scope refers to the portion
    of a program in which an identifier may be used. Identifiers may always be used
    in the block in which they are declared. Identifiers that are declared in one
    function or file may be used in another provided the appropriate linkage is established.
    This allows for several portions of a program to be compiled separately. An identifier
    may be used for different purposes within a function provided that it is possible
    to uniquely identify the purpose. This is called the name space of an identifier.
    By default an object has automatic storage duration. This means that an object
    comes into existence each time a function is called and goes out of existence
    when a function terminates. However, if it is declared to have a static storage
    duration, it exists or retains its value from one activation of a function to
    another. Identifiers declared within a block have similar lifetimes.


    # 5.1.1 SCOPE OF IDENTIFIERS


    An identifier has meaning within a specific region of a C program. The scope of
    an identifier is that region. We discuss the scope of an identifier as it refers
    to a block, a function, or a file.


    An identifier declared at the beginning of a block has a scope that extends until
    the end of the block. Its scope will extend through every block contained within
    the first block, unless it is declared anew within a contained block. If it is
    declared within an inner block then its scope includes the portion of the text
    after the interior block. In the following example the first identifier named
    x has a scope consisting of lines 2 — 4 and 10 — 11\. An inner block has a declaration
    of x which is a different identifier than the original. The new x has scope from
    lines 6 — 9\. The variable z has scope consisting only of lines 6 — 9\. We cannot
    refer to z outside of that scope. The scope of the identifier y is lines 2 — 11.


    ![e9780738671956_i0099.jpg](images/e9780738671956_i0099.jpg)


    The scope of a label consists only of the function in which it is used. Thus a
    goto may only transfer control within one function. Likewise the scope of the
    parameters of a function are restricted to that function. In the following the
    identifiers x, y and label1 have scope restricted to the function fun1.


    ![e9780738671956_i0100.jpg](images/e9780738671956_i0100.jpg)


    An identifier declared outside of a block has scope for all following blocks unless
    the identifier is declared anew within an inner block. Below, the identifier top
    has a scope which goes from its point of declaration to the end of the file, except
    for the body of the function fun1. The scope of the identifier stack is the remainder
    of the file.


    ![e9780738671956_i0101.jpg](images/e9780738671956_i0101.jpg)![e9780738671956_i0102.jpg](images/e9780738671956_i0102.jpg)


    Unless top or stack are declared local to a block (as top was with within fun1),
    they are available or “public” to any function that follows them in the file.
    They are not available to any function that precedes their declaration in the
    file. Thus scope may be used to make identifiers public or private within a file.


    # 5.1.2 LINKAGE OF IDENTIFIERS


    The scope of parameters to functions or identifiers declared at the head of a
    block is that function or block. They are known in their scope, may be used there,
    and have space allocated for them. A C program may consist of several functions
    that are in separate files or program translation units. The files may be compiled
    separately. It is possible for identifiers, functions or variable names, to be
    shared among separate files. It is possible to make some identifiers private to
    a given file or function. The linkage of an identifier refers to whether the identifier
    is “public” — can be shared by other units, or “private” in the sense that it
    can only be used in one file.


    An identifier may have no linkage, internal linkage, or external linkage. If it
    has no linkage then it is known only within its own scope and may not be used
    elsewhere. Examples of this are identifiers that occur in a typedef (they are
    the name of a type) and the parameters of a function. An identifier declared within
    a block has no linkage unless its declaration contains the keyword extern. An
    identifier has internal linkage if its scope is limited to one file or program
    translation unit. The name of a variable or a function may be made internal if
    the keyword static is used. An identifier has external linkage if its scope extends
    over more than one file.


    Here is an example of a program that exists in two files. The files may be compiled
    separately. The object files are linked by a program called a ‘linker’.


    ![e9780738671956_i0103.jpg](images/e9780738671956_i0103.jpg)


    In File 1 the variable x in main is declared using the keyword extern. This means
    that it is declared in another file and space is allocated for it when that file
    is compiled. Thus the x in File 2 is made public to File 1. The variables y, z,
    and x in fun1 have no linkage. The variable w has internal linkage.


    In File 2 the variable x has external linkage, because File 1 contains a declaration
    extern int x. It is important to remember that it is defined in this file, although
    it may be declared elsewhere. The variable zz has internal linkage and cannot
    have external linkage, because the keyword static is used. Using static makes
    the identifier private.


    # 5.1.3 NAME SPACE OF IDENTIFIERS


    The same identifier may be used for different purposes. For example, the identifier
    name may be used as a label, the name of a simple identifier, and the name of
    a field in a struct such as student.name. These uses of the same identifier cause
    no confusion because the compiler keeps different name spaces. These name spaces
    are


    1.  objects, functions, typedef names, and enum constants


    2.  labels


    3.  tags of structures, unions, and enumerations


    4.  members of each structure or union individually.


