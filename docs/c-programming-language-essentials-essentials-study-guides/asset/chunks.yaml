  raw: 'Selection statements provide conditional control for C programs. They are
    the IF statement and the SWITCH statement. The first is used to select according
    to some condition, one of two statements to be executed. The SWITCH statement
    is similar to a CASE statement in other languages and is used to select one of
    several statements or statement blocks.


    # 4.3.1 IF STATEMENT


    An IF statement has the form


    ![e9780738671956_i0074.jpg](images/e9780738671956_i0074.jpg)


    or the form


    ![e9780738671956_i0075.jpg](images/e9780738671956_i0075.jpg)


    In either case expression is evaluated. If its value is not zero then it is taken
    to be “true” and statement1 is executed. If expression evaluates to zero then
    it is taken to be “false.” In the first case statement 1 is not executed. In the
    second case statement2 is executed. The else always goes with the most recent
    if, unless that if is within a block.


    Some examples are


    ![e9780738671956_i0076.jpg](images/e9780738671956_i0076.jpg)![e9780738671956_i0077.jpg](images/e9780738671956_i0077.jpg)


    The first example is a simple if statement. If top is equal to zero then Empty
    and a new line character are sent to the standard output file. In example 2, if
    top evaluates to 0 then a return statement with a value of 0 is executed. Otherwise
    a compound statement is executed. The third example evaluates the expression (linin
    = getline(fp, MAX)) != NULL. As an aside, this expression is evaluated by calling
    a function getline with two arguments, assigning the result of that function to
    linin, and then determining if the value returned is NULL. If the expression evaluates
    to 1 then we enter a block to execute the compound statement. The else refers
    to the outer if statement because the inner if is enclosed in a block. In this
    case the if statement within the compound statement is invisible to the else.


    # 4.3.2 SWITCH STATEMENT


    The SWITCH statement is used to select one statement from several alternatives.
    It is similar to the CASE statement in Pascal and Ada. However, its syntax and
    implementation is somewhat different. The SWITCH statement has the form


    ![e9780738671956_i0078.jpg](images/e9780738671956_i0078.jpg)![e9780738671956_i0079.jpg](images/e9780738671956_i0079.jpg)


    The keyword switch begins the statement. An expression is evaluated and compared
    with each of the constant expressions following the keyword* case Each of these
    constant expressions must evaluate to different values. If a match is made then
    the corresponding statement is executed. If no match is made and there is a label
    default, then the statement following the keyword default is executed. If no match
    is made then the statement following the terminating } of the switch is executed.
    Additionally, if a match is made then all statements to the terminating } of the
    switch are executed. If only the statement corresponding to a particular constant-expression
    is to be executed then a break; statement must be included. Here is an example.


    ![e9780738671956_i0080.jpg](images/e9780738671956_i0080.jpg)


    In the example we take the same action if today evaluates to sun or sat. Likewise
    if it evaluates to mon, wed, or fri. Separate actions are taken on tue and thu.
    The default label marks action to be taken if none of the other values were matched.


    # 4.4 ITERATIVE STATEMENTS


    Iterative statements are statements which consist of a head and a body. The head
    contains an expression whose value determines whether the body is to be executed
    initially and/or once again.


    # 4.4.1 WHILE STATEMENT


    A WHILE statement in C has the form


    ![e9780738671956_i0081.jpg](images/e9780738671956_i0081.jpg)


    In this iterative statement the test which determines whether the loop should
    be executed or terminated is at the top of the loop. This is similar to a while
    statement in Pascal. It is executed as follows:


    1.  The expression following the keyword while is evaluated.


    2.  If the expression evaluates to 0 the loop terminates. Otherwise go to step
    3.


    3.  The statement portion of the loop is executed.


    4.  Go to step 1.


    The body of the loop could be a NULL statement. Here are some examples:


    ![e9780738671956_i0082.jpg](images/e9780738671956_i0082.jpg)![e9780738671956_i0083.jpg](images/e9780738671956_i0083.jpg)


    # 4.4.2 DO-WHILE STATEMENT


    A DO-WHILE statement in C has the form


    ![e9780738671956_i0084.jpg](images/e9780738671956_i0084.jpg)


    In this iterative statement the test which determines whether the loop should
    be executed or terminated is at the bottom of the loop. This is similar to a repeat-until
    statement in Pascal. It is executed as follows:


    1.  The statement(s) following the keyword do and up to the keyword while is (are)
    executed.


    2.  The expression following the keyword while is evaluated.


    3.  If the expression evaluates to a non-zero value then the loop continues. Otherwise
    go to step 1.


    The body of the loop could be a NULL statement. Here are some examples:


    ![e9780738671956_i0085.jpg](images/e9780738671956_i0085.jpg)![e9780738671956_i0086.jpg](images/e9780738671956_i0086.jpg)


    # 4.4.3 FOR STATEMENT


    A FOR statement in C has the form


    ![e9780738671956_i0087.jpg](images/e9780738671956_i0087.jpg)


    It is much more general than the FOR or DO statement in Pascal or FORTRAN, respectively.
    There is no restriction on the type of expressions used. They may even be NULL
    expressions, no expressions. Typically expression1 initializes some variable(s),
    expression2 is a test to determine whether the loop should continue or terminate,
    and expression3 updates the loop variable(s). If, for example, there is no expression2
    then the only way to exit the loop is from some statement within the body (such
    as a break, return, or goto).


    The FOR statement is executed as follows:


    1.  expression1 is evaluated and the value discarded.


    2.  expression2 is evaluated. If it evaluates to 0 then the loop terminates, otherwise
    go to step 3.


    3.  The body of the loop is executed.


    4.  expression3 is evaluated and the value is discarded.


    5.  goto step 2.


    The FOR statement is normally terminated when expression2 evaluates to 0\. The
    statements break, goto, and return would allow for premature exit from the loop.


    Here are some examples


    ![e9780738671956_i0088.jpg](images/e9780738671956_i0088.jpg)![e9780738671956_i0089.jpg](images/e9780738671956_i0089.jpg)


    # 4.5 TRANSFER OF FLOW OF CONTROL STATEMENTS


    C has a group of statements which allow for transfer of flow of control of execution
    from one point within a function to another point. They are


    | BREAK statement | CONTINUE statement |


    | GOTO statement | RETURN statement |


    # 4.5.1 BREAK STATEMENT


    The BREAK statement is used in two situations:


    1.  To alter the flow of control within a loop or iterative statement, and


    2.  within a switch statement.


    This statement consists of the keyword break followed by a semicolon.


    When it is used in a loop, control is transferred to the first statement following
    the loop. Here is an example.


    ![e9780738671956_i0091.jpg](images/e9780738671956_i0091.jpg)


    If i is greater than 9 then we exit the loop and execute the for statement.


    The statement break; is used within a SWITCH statement to transfer control to
    the statement immediately following the end of the SWITCH statement.


    # 4.5.2 CONTINUE STATEMENT


    The CONTINUE statement consists of the keyword continue followed by a semicolon.
    This statement is used within loops or iterative statements. Execution of a continue;
    skips all remaining statements in a loop and the loop test is evaluated. Here
    is an example


    ![e9780738671956_i0092.jpg](images/e9780738671956_i0092.jpg)


    # 4.5.3 GOTO STATEMENT'
