  raw: "The compiler internally stores the current line number and file name. Using\
    \ a preprocessor directive such as #line 23, changes the internally stored line\
    \ number to 23\\. Using a preprocessor directive such as #line 234 “module1.c”,\
    \ changes the internally stored line number to 234 and the file name to module1.c.\n\
    \nThe preprocessor directive #error used as #error token-sequence causes the preprocessor\
    \ to write a diagnostic message that includes the token sequence.\n\nThe preprocessor\
    \ directive #pragma token-string causes the preprocessor to perform an implementation-dependent\
    \ action. For example, in Microsoft C 5.1 optimizing compiler, the pragma loop_opt\
    \ is available to control optimization for loops. Using #pragma loop_opt(on) turns\
    \ on loop optimization for loops that follow and #pragma loop_opt(off) turns it\
    \ off.\n\nThe two directives #ifdef and #ifndef perform the same task as the #if\
    \ used with defined(identifier). However, they are not a part of the ANSI Standard.\
    \ They are available in some compilers to be compatible with previous versions\
    \ of C.\n\n# 7.6 PREDEFINED NAMES\n\nThe ANSI Standard contains several identifiers\
    \ that are predefined and can be used to produce special information. They may\
    \ not be redefined or undefined. They are\n\n| _LINE_ |  |\n\n|  | A decimal constant\
    \ containing the current source line number. |\n\n| _FILE_ |  |\n\n|  | A string\
    \ literal containing the name of the file being compiled. |\n\n| _DATE_ |  |\n\
    \n|  | A string literal containing the date of compilation, in the form “Mmm dd\
    \ yyyy” |\n\n| _TIME_ |  |\n\n|  | A string literal containing the time of compilation,\
    \ in the form “hh:mm:ss” |\n\n| _STDC_ |  |\n\n|  | The constant 1\\. This will\
    \ be defined only in implementations that meet the ANSI Standard. |\n\n# CHAPTER\
    \ 8\n\n# THE STANDARD LIBRARY\n\nEarly versions of C had no standard library of\
    \ functions and no standard collection of header files. However, a large number\
    \ of support functions were and are in common use. While they are not standardized,\
    \ the same functions appear in almost every implementation of C. The number and\
    \ type of the parameters and even the names of the functions vary, unless the\
    \ version of C conforms to the ANSI Standard definition of C.\n\nEach library\
    \ function has an associated header file that must be included to use the function.\
    \ There are well over 100 library functions required by the Standard. Some implementations\
    \ provide many more which are often application or hardware dependent. An example\
    \ would be collection of library routines for graphics on an EGA monitor on a\
    \ MS-DOS system.\n\nA selection of the library functions in the ANSI Standard\
    \ will be listed or discussed below. There are too many to list them all. Consult\
    \ documentation available with your C compiler for a complete list. The functions\
    \ are grouped according to the standard header files, as each must have the appropriate\
    \ header file included before its use.\n\n# 8.1 INPUT/OUTPUT <stdio.h>\n\n<stdio.h>\
    \ contains prototypes, types, and macros that account for almost one third of\
    \ the library. There are functions for\n\n![e9780738671956_i0205.jpg](images/e9780738671956_i0205.jpg)![e9780738671956_i0206.jpg](images/e9780738671956_i0206.jpg)\n\
    \nWe discuss the functions fscanf and scanf. fscanf is used for formatted input\
    \ from a file different from the standard input file. scanf is equivalent to fscanf(stdin,...).\
    \ Their prototypes are\n\n![e9780738671956_i0207.jpg](images/e9780738671956_i0207.jpg)\n\
    \nand\n\n![e9780738671956_i0208.jpg](images/e9780738671956_i0208.jpg)\n\nstream\
    \ is a pointer to an object of type FILE. FILE is declared in stdio.h. Format\
    \ is a string which contains conversions specifications, which describe the form\
    \ of the input. Names of identifiers go in place of ..., and each of those must\
    \ be a pointer. The functions return the number of input items fetched, converted,\
    \ and assigned, and returns EOF (defined in stdio.h) if the end of file is reached.\n\
    \nThe format string may contain\n\n1.  Whitespace characters to match whitespace\
    \ in input.\n\n2.  Ordinary characters, except for whitespace and %. If such a\
    \ character is in the format string, the next character of input must match that\
    \ character. If not, scanf returns.\n\n3.  A conversion specification for the\
    \ next input field. The data is interpreted appropriately and assigned to the\
    \ next argument in the identifier list. A conversion specification begins with\
    \ a % followed by an optional * which means that the assignment is suppressed,\
    \ an optional number indicating the width of the input field, an optional h, 1\
    \ or L indicating the width of the object to which the values will be assigned,\
    \ and a required conversion character. The conversion characters are given in\
    \ the table below. Using * reads the data but doesn’t assign it to the object\
    \ to which the next identifier points. The number of columns in the input field\
    \ is specified by width. If an h precedes a conversion character of d, i, n, o,\
    \ or u then the argument is a pointer to short rather than int. If an I precedes\
    \ a conversion character of d, i, n, o, or u then the argument is a pointer to\
    \ long rather than int. If an I precedes the conversion characters e, f, or g\
    \ then the argument is interpreted as a pointer to double rather than float. If\
    \ an L precedes the conversion characters e, f, or g then the argument is interpreted\
    \ as a pointer to long double rather than float.\n\n    For example, scanf(“$\
    \ %4d.%2d”, &dol, &cent) reads a $, a blank, the next four columns and assigns\
    \ them to dol., a ., and the next two columns and assigns them to cent. fscanf(\
    \ fil, “%6f,%s,%3hd”, &ave., name, &idno) reads six columns into ave. as type\
    \ float, a string of non-white space characters to *name, and a 3 column decimal\
    \ integer into idno which has been declared as short.\n\nCONVERSION CHARACTERS\
    \ FOR scanf, fscanf\n\n| Character | Input Data Form | Data Type of Argument |\n\
    \n| --- | --- | --- |\n\n| d | decimal integer | int * |\n\n| i | integer – octal\
    \ if leading 0, hexadecimal, if leading 0x | int * int * |\n\n| o | octal integer\
    \ w/wo leading 0 | int * |\n\n| x | hexadecimal integer w/wo leading 0x | int\
    \ * |\n\n| u | unsigned decimal integer | unsigned int * |\n\n| c | character.\
    \ The next input characters (width tells how many) are put into the listed array.\
    \ This is not a string, no \\0 is added. | char * |\n\n| s | string of non-white\
    \ space characters, not quoted. Width gives the length of the string. Terminating\
    \ \\0 is added. | char * |\n\n| e,f,g | floating point number. The input format\
    \ is an optional sign, a string of numbers possibly containing a decimal point,\
    \ and an optional exponent field containing an E or e possibly followed by a signed\
    \ integer. | float * |\n\n| p | pointer value | void * |\n\n| n | the number of\
    \ characters read so far, doesn’t increase the number of characters read | int\
    \ * |\n\n| [ ... ] | matches the longest non-empty string of input characters\
    \ from the set between brackets, a \\0 is added. | char * |\n\n| [^...] | matches\
    \ the longest non-empty string of input characters not from the set between brackets,\
    \ a \\0 is added. | char * |\n\nFor example, scanf(“%[0123456789]” strptr); will\
    \ gather input stopping when it finds a character that is not a digit, and scanf(“%[^0123]”,strptr);\
    \ will gather characters as long as they are not a 0,1,2, or 3.\n\n![e9780738671956_i0211.jpg](images/e9780738671956_i0211.jpg)\n\
    \nWe discuss the functions fprintf and printf. fprintf is used for formatted output\
    \ to a file different than the standard output file. printf is equivalent to printf(stdout,...).\
    \ Their prototypes are\n\n![e9780738671956_i0212.jpg](images/e9780738671956_i0212.jpg)\n\
    \nand\n\n![e9780738671956_i0213.jpg](images/e9780738671956_i0213.jpg)\n\nstream\
    \ is a pointer to an object of type FILE. FILE is declared in stdio.h. format\
    \ is a string which contains conversions specifications, which describe the form\
    \ of the output. Names of identifiers go in place of .... The functions return\
    \ the number of characters written or a negative value if an error occurs."
