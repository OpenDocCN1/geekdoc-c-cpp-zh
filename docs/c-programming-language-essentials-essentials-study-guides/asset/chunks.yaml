  raw: '# 3.4.4 POSTFIX INCREMENT AND DECREMENT


    A postfix expression which is also an lvalue can be evaluated and then incremented
    (++) or decremented ( – – ) by expressions of the form


    ![e9780738671956_i0038.jpg](images/e9780738671956_i0038.jpg)


    The value of the postfix increment or decrement expression is the value of the
    operand. After the operand is evaluated it is incremented (++) or decremented
    ( – – ). That is why the operand must be an lvalue and also why an expression
    of this form is not an lvalue.


    Consider the following program.


    ![e9780738671956_i0039.jpg](images/e9780738671956_i0039.jpg)![e9780738671956_i0040.jpg](images/e9780738671956_i0040.jpg)


    Here is the output of the program.


    ![e9780738671956_i0041.jpg](images/e9780738671956_i0041.jpg)


    Initially pfex is one, aray[1] has been set to 9, and *p – the object to which
    p points – has the value 0, the value of a[0]. After the statement aray[pfex –
    – ]=5 is executed array[1] is set to 5 and pfex is decremented. The statement
    (*p)++ increments the value pointed to by p and p still has the address of the
    array or the location of array(0] as its value. After this the value of aray[0]
    is modified. Finally, the expression p++ modifies the value of p. p is incremented
    so it has the address of aray[1] as its value.


    # 3.5 UNARY EXPRESSIONS


    Unary expressions are expressions with one operator and one operand. They have
    lower precedence than postfix expressions but higher than any binary expression.
    For example *p++ is equivalent to *(p ++) and different than (*p)++. Postfix expressions
    are considered unary expressions. The other unary expressions are:


    | Type | Form |


    | --- | --- |


    | preincrement expressions | ++ operand |


    | predecrement expressions | – – operand |


    | indirection expression | *operand |


    | address expression | &operand |


    | unary plus | +operand |


    | unary minus | -operand |


    | logical negation | !operand |


    | bitwise compliment | ~operand |


    | sizeof expression | sizeof(type-name) or sizeof(operand) |


    # 3.5.1 PREINCREMENT (++) AND PREDECREMENT ( – – ) EXPRESSIONS


    A preincrement expression has the form ++operand. It is evaluated by incrementing
    the operand. The value of the preincrement expression is the value of operand
    after it has been incremented. Since operand is modified it must be an lvalue
    and it must be a scalar type. The preincrement expression is not an lvalue. Predecrement
    expressions are treated in the same way except that operand is decremented. For
    example:


    ![e9780738671956_i0043.jpg](images/e9780738671956_i0043.jpg)


    produces the output


    ![e9780738671956_i0044.jpg](images/e9780738671956_i0044.jpg)


    # 3.5.2 INDIRECTION EXPRESSIONS


    An indirect expression has the form *operand. They are used to reference the object
    pointed to by a pointer. For example, if p is a pointer to an object of type int
    then *p is the integer. The indirect expression is an lvalue if the pointer points
    to an lvalue. If p is a pointer to a function then *p is a function. If p is a
    null pointer or otherwise undefined then *p yields an unpredictable result. Otherwise,
    an indirection expression *operand returns the object to which operand points.


    # 3.5.3 ADDRESS EXPRESSIONS


    Address expressions are of the form & operand. This yields the address of operand.
    operand must be function type, an lvalue which does not refer to a bit-field,
    or an lvalue which does not refer to an object whose storage class is register.
    If operand has type T then & operand is a pointer to an object of type T. For
    example if prex is of type int then & prex is the address of prex and so is a
    pointer to an integer. Also *(& prex) is the equivalent to prex.


    # 3.5.4 UNARY PLUS AND UNARY MINUS


    The operand to unary plus (+) and unary minus (-) must be arithmetic. The result
    of applying + to an operand is the value of the operand and applying – to an operand
    yields the negative of the operand. Some examples are


    ![e9780738671956_i0045.jpg](images/e9780738671956_i0045.jpg)


    In the first we add the negative of b to a, in the second we multiply b by the
    negative of a, and in the third we reference the object pointed to by p, increment
    it, and then evaluate the negative of it. An expression of this form is not an
    lvalue.


    # 3.5.5 LOGICAL NEGATION


    The operator ! may be applied to any scalar type or any pointer. If x is a scalar
    type then !x evaluates to 0 if x is not zero and it evaluates to 1 otherwise.
    If x is a pointer then !x evaluates to 1 if x is a null pointer and 0 otherwise.
    Regardless of the type of x, !x is type int. An expression of this form is not
    an lvalue.


    # 3.5.6 BITWISE COMPLEMENT


    The operator ∼ is used to obtain the bitwise compliment of an integral object.
    For each bit in the representation of, say, x, if the bit is 1, then the same
    bit will be 0 in ∼x and if the bit is 0 then the same bit will be 1 in ∼x. If
    x is unsigned int, ∼x yields UINT_MAX – x. Where UINT_MAX is the largest unsigned
    integer represented by the language system. For example, if a program contains


    ![e9780738671956_i0046.jpg](images/e9780738671956_i0046.jpg)


    then we obtain x = 10 ~x = 65525 as output on a particular system. This indicates
    that the largest value for an unsigned int is 65535 and that 16 bits are used
    to represent an integer.


    # 3.5.7 SIZEOF


    Sizeof gives the number of bytes required to store its operand. If x is type char
    then sizeof x returns 1\. If x were a structure, then sizeof x would return the
    number of bytes necessary to store x. Sizeof may not be applied to a function
    or a bit-field operand. Sizeof may be used to determine the number of elements
    of an array. If aray is an array then (sizeof aray)/ (sizeof aray[0]) is the number
    of elements in aray.


    # 3.6 CAST EXPRESSIONS


    A cast expression has the form (type-name) expression. It converts the type of
    one expression to another type. For example,


    ![e9780738671956_i0047.jpg](images/e9780738671956_i0047.jpg)


    converts 23.45 + a to a value of type int. Cast has been discussed in more detail
    in section 2.4.4\. An expression with a cast is not an lvalue.


    # 3.7 MULTIPLICATIVE EXPRESSIONS


    Multiplicative expressions are binary expressions, evaluated from left to right,
    and have precedence immediately below that of unary expressions. The operators
    used in multiplicative expressions are


    | * | multiplication |


    | / | division |


    | % | remainder or modulus |


    # 3.7.1 MULTIPLICATION EXPRESSIONS


    Multiplication expressions have the form operand1* operand2. Each operand must
    have arithmetic type and the usual conversions are performed. Multiplication is
    assumed to be commutative and associative. A compiler is free to interpret the
    order of calculation so that the expression a*(s*c)*t may be evaluated as (c*a)*(s*t).
    It is wise not to write expressions that depend upon the order of evaluation.


    # 3.7.2 DIVISION EXPRESSIONS


    Division expressions have the form operand1 / operand2. Each operand must have
    arithmetic type and the usual conversions are performed. The / has its usual arithmetic
    meaning if both operands are floating type. If both operands are integer type
    then the expression results in some truncation or rounding. If both operands are
    positive and the division doesn’t yield a whole number then the result is truncated.
    For example,


    ![e9780738671956_i0049.jpg](images/e9780738671956_i0049.jpg)![e9780738671956_i0050.jpg](images/e9780738671956_i0050.jpg)


    Truncation occurred when neither, one, or both operands were negative. If one
    operand is negative the result is implementation dependent.


    # 3.7.3 REMAINDER OR MODULUS EXPRESSIONS


    The division operator (/) yields the quotient of when both operands are integral
    type. The remainder operator (%) yields the remainder. Since 4 divides 35 eight
    times with a remainder of 3, we have 35/4 = 8 and 35%4 = 3.


    If b is not 0 then it is always true that (a/b)*b + a%b is equal to a.


    If both a and b are non-negative then a%b is less than b. If one is negative then
    the absolute value of a%b is less than the absolute value of b.'
