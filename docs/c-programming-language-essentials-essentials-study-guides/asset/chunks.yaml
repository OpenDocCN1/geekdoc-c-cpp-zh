  raw: 'Spaces, horizontal and vertical tabs, newlines, formfeeds, and comments are
    known as “whitespace”. Whitespace is ignored by the translator except as it is
    necessary to separate some identifiers, keywords, or operators. For example, whitespace
    is necessary to separate the keywords and identifier name on the following line:


    ![e9780738671956_i0009.jpg](images/e9780738671956_i0009.jpg)


    However, any whitespace between count and ; (the semicolon) is ignored. Also,
    the following two lines have the same meaning:


    ![e9780738671956_i0010.jpg](images/e9780738671956_i0010.jpg)


    So whitespace is ignored unless it is necessary to specify the meaning of a string
    of characters. Naturally, it’s a good practice to use it to improve the readability
    of a program.


    # 1.3 IDENTIFIERS


    Identifiers are used to name variables, functions, types, and labels. An identifier
    is a sequence of letters (upper or lower case), the underscore character ’_’ and/or
    digits. The first character in the sequence must be a letter. The translator differentiates
    upper from lower case letters. The first 31 characters of local identifiers, those
    used within a single function, are significant. Only the first six characters
    may be significant for identifiers that are shared through the use of external
    linkage. This is implementation dependent. The following are all valid and different
    identifiers: Abc23, abc23, ab_c23, aBc23, and ABC23. Variables and functions are
    generally written with only lowercase letters. Constants and macro names are generally
    written using uppercase letters as in the following program fragment which initializes
    the elements of the array clown_aray to the value stored in bobo:


    ![e9780738671956_i0011.jpg](images/e9780738671956_i0011.jpg)


    # 1.4 KEYWORDS


    Some names are reserved for use as keywords and may not be used for any other
    purpose. The keywords are:


    | auto | double | int | struct |


    | break | else | long | switch |


    | case | enum | register | typedef |


    | char | extern | return | union |


    | const | float | short | unsigned |


    | continue | for | signed | void |


    | default | goto | sizeof | volatile |


    | do | if | static | while |


    It’s more instructive to group the keywords into categories that fit their function
    or purpose. A good deal of the remainder of this text deals with the use and meaning
    of these keywords.


    | labels: | case, default |


    | operator: | sizeof |


    | program control: | break, case, continue, default, do, else, for, goto, if,
    return, switch, while |


    | storage class: | auto, extern, register, static, typedef |


    | type specifiers: | char, double, enum, float, int, long, short, signed, struct,
    union, unsigned, void |


    | type qualifiers: | const, volatile |


    # 1.5 OPERATORS AND SEPARATORS


    C has a particularly large set of operators. They are:


    ![e9780738671956_i0014.jpg](images/e9780738671956_i0014.jpg)![e9780738671956_i0015.jpg](images/e9780738671956_i0015.jpg)


    The separators are ( ) [ ] { } , ; :


    # 1.6 CONSTANTS


    Here we discuss tokens which are referred to in some languages as literals. Their
    values are specified explicitly and never change.


    # 1.6.1 INTEGER CONSTANTS


    Integer constants may be expressed in octal, decimal, or hexadecimal notation.
    A decimal integer consists of a sequence of digits the first of which is not zero.
    An octal representation of an integer consists of a sequence of digits in the
    range 0-7, and the first digit must be 0\. A hexadecimal representation of an
    integer consists of the digit 0, followed by either x or X, and then a sequence
    of hexadecimal digits (0 – 9, A – F, a – f). For example, the integer four hundred
    twenty-seven is represented as 427 in decimal, 0653 in octal, and oX1ab in hexadecimal.


    # 1.6.2 FLOATING POINT CONSTANTS


    Floating point constants are always written in decimal (base ten) notation. They
    contain a decimal point, a signed exponent, or both. For example 0.4, 4.0, 4e
    – 1, 423.3455e+2.


    # 1.6.3 CHARACTER CONSTANTS


    A character constant is a sequence of one or more characters enclosed in single
    quotes. The following are examples of character constants:


    ![e9780738671956_i0016.jpg](images/e9780738671956_i0016.jpg)


    The character constant single quote (’) cannot be represented by surrounding it
    with a pair of single quotes. Other characters can’t be represented in this way
    either. The following escape sequences may be used to represent them.


    ![e9780738671956_i0017.jpg](images/e9780738671956_i0017.jpg)


    It is possible to represent characters by their ASCII code expressed in octal
    or hexadecimal form. For example, Control-H the backspace character may be represented
    by ’\b’, ’\010’, or ’\x08’.


    # 1.6.4 STRING CONSTANTS


    A string constant is a sequence of characters between double quotes such as “Hello
    World!”. Strings and characters are not the same. A sequence of characters is
    just that, but a string is a sequence of characters whose last character marks
    the end of the string. This character is the character whose value is zero. It
    may be represented as \000 or NULL. The language system provides this character
    when string constants are used; it is not provided by the writer of the program.
    So “Hello World!” is a string constant representing the exclamation. Although
    the NULL is not visible, it is provided by the language system and marks the end
    of the string. By contrast, ‘Hello World!’ is a sequence of characters – not a
    string.


    # CHAPTER 2


    # DATA TYPES AND DATA OBJECTS: SPECIFICATION AND REPRESENTATION


    A data object holds a collection of bits. The manner in which those bits are interpreted
    determines the data value of the object. A data type is a collection of data objects
    along with the operations defined on those objects. In this chapter we will discuss
    the specification and representation of data objects available in C. The operations
    will be dealt with in the next chapter.


    A classification of the types available is:


    | void |  |  |


    | --- | --- | --- |


    | arithmetic types: | integral – | char, int, enum |


    | floating – | float, double |


    | derived types: | arrays, functions, pointers, structures, unions |


    # 2.1 THE VOID TYPE


    The type void indicates no data, an empty set of data. It is used to specify the
    type of a function which returns no values. For example:


    ![e9780738671956_i0019.jpg](images/e9780738671956_i0019.jpg)![e9780738671956_i0020.jpg](images/e9780738671956_i0020.jpg)


    prints the value of d multiplied by 2 and a newline character.


    # 2.2 ARITHMETIC TYPES


    Objects of arithmetic types can be interpreted as numbers.


    # 2.2.1 INTEGRAL


    There is a larger variety of integral types available in C than in many other
    languages. This reflects the architecture and operations found on most computers.
    One of the design goals of C was to provide a close correspondence between the
    language and the underlying machine. Integral types are used to represent characters,
    to represent signed and unsigned integers, to provide for boolean values (0 for
    FALSE and 1 for TRUE), and to represent enumerated types as found in many languages
    such as Pascal. There is no boolean type per se, but the values 0 and 1 can be
    used effectively as will be seen in the chapter on expressions.


    The first bit of objects of these types is used to represent the sign (positive
    or negative) of the represented value unless the object is declared unsigned.
    This bit is called the sign bit. If they are declared unsigned then there is one
    more bit available to represent a value.


