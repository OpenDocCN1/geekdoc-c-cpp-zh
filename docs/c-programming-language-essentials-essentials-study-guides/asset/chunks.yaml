    \ |\n\n    | # | alternate forms of output: for octal the first digit will be\
    \ 0, for hexadecimal the first characters will be 0x, for floatpoint output a\
    \ decimal point will always be included. |\n\n2.  The minimum field width. If\
    \ the output is less than the number of columns specified, t will be printed right\
    \ justified with leading blanks, unless a modifier above had been used.\n\n3.\
    \  A period which separates field width from precision.\n\n4.  A number indicating\
    \ the precision, the number of characters to be printed to the right of a decimal\
    \ point in numeric output.\n\n5.  A length modifier\n\n    h — print as short\
    \ or unsigned short\n\n    I — print as long or unsigned long\n\n    L – long\
