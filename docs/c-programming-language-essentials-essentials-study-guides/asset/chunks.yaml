    # 5.5.3 UNION SPECIFIERS


    Union specifiers follow the same rules as structure specifiers. The only difference
    is that the keyword union is used instead of structure.


    # 5.5.4 ENUMERATION SPECIFIERS


    Enumeration specifiers follow the same rules as structure specifiers, except for
    two differences. One is the keyword enum is used instead of structure. The other
    is the elements of the member list have the form


    ![e9780738671956_i0117.jpg](images/e9780738671956_i0117.jpg)


    Here are two examples:


    ![e9780738671956_i0118.jpg](images/e9780738671956_i0118.jpg)


    # 5.6 DECLARATORS


    C provides a greater variety of possibilities for declarators than most languages.
    In the declaration,


    ![e9780738671956_i0119.jpg](images/e9780738671956_i0119.jpg)


    static and int form the declaration specifiers of the declaration and x, *p, (*pfun)
    (), and ax[10] form the declarator list. x is a simple declarator, *p is a pointer
    declarator, (pfun) () is a function declarator, ax[10] is an array declarator,
    and (*pfax[]) () declares pfax to be an array of pointers to functions.


    # 5.6.1 SIMPLE DECLARATORS


    Simple declarators are identifiers. If we represent the declaration specifier
    portion of a declaration by SPEC, then I in the declaration SPEC I is a simple
    declarator. They are used to declare variables of arithmetic, enumeration, structure,
    and union types. In these cases the type specifier of a declaration provides all
    typing information. This is the case in


    ![e9780738671956_i0120.jpg](images/e9780738671956_i0120.jpg)


    # 5.6.2 POINTER DECLARATORS


    Pointer declarators are used to declare objects of pointer type. If we represent
    the declaration specifier portion of a declaration by SPEC, then *D in the declaration
    SPEC *D is a pointer declarator. In this case D would be a pointer to the type
    given in SPEC. Here are some examples.


    ![e9780738671956_i0121.jpg](images/e9780738671956_i0121.jpg)![e9780738671956_i0122.jpg](images/e9780738671956_i0122.jpg)


    # 5.6.3 ARRAY DECLARATORS


    Array declarators are used to declare objects of array types. If we represent
    the declaration specifier portion of a declaration by SPEC, then D[constant-expression]
    in the declaration SPEC D[constant-expression] is an array declarator. In this
    case D would be an array to the type given in SPEC. Here are some examples.


    ![e9780738671956_i0123.jpg](images/e9780738671956_i0123.jpg)


    # 5.6.4 FUNCTION DECLARATORS


    Function declarators are used to declare objects of function types. If we represent
    the declaration specifier portion of a declaration by SPEC, then (D) ( ) in the
    declaration SPEC (D) ( ) is a function declarator. In this case D would be a function
    to the type given in SPEC. Here are some examples.


    ![e9780738671956_i0124.jpg](images/e9780738671956_i0124.jpg)![e9780738671956_i0125.jpg](images/e9780738671956_i0125.jpg)


    In the examples above, we didn’t list any parameters for the functions. We will
    discuss listing parameters now. There are two styles for declaring parameters
    in functions. The “old style” is common in versions of C based on the original
    definition by Kernighan & Ritchie. The “new style” is part of the ANSI standard
    for C and is available in many C compilers on microcomputers.


    OLD STYLE


    *   – parameters declared and listed only when the function is defined


    *   – parameters listed in function definition, and declared on following lines


    *   – declaration of a function in another function or block consists of name
    followed by parentheses


    NEW STYLE


    *   – parameters declared and listed whenever the function is declared


    *   – parameters listed and declared within parentheses following name of function


    Here is an example:


    |  | OLD STYLE |  | NEW STYLE |


    | --- | --- | --- | --- |


    | main ( ) | main(void) |


    | { | float a,b,c; | { | float a, b, c; |


    |  | int d[20]; |  | int d[20]; |


    |  | double cubrt ( ); |  | double cubrt(float x,float y,float z,int d[ ]); |


    |  | • |  | • |


    |  | • |  | • |


    | } | } |


    | double cubrt(x,y,z,w) | double cubrt(float x, float y, float z, int w[ ]); |


    | float x,y,z; | { |


    | int w[ ]; |  | • |


    | { |  | • |


    |  | • | } |


    |  | • |  |


    | } |  |  |


    The declaration of cubrt in main in the “new style” is called a prototype. Writing
    it that way allows a reader to know the types of the arguments to a function.
    It also may allow for the compiler to check that the types of the arguments to
    a function are correct.


    # 5.6.5 READING COMBINED DECLARATORS


    Declarators may be combined. Here are some examples.


    | int *pa[ ] | pa is an array of pointers to integers |


    | int (*pa) [ ] | pa is a pointer to an array of integers |


    | int (*pa[ ]) ( ) | pa is an array of pointers to functions each of which returns
    a value of type int. |


    How should these be read and understood? The key is to work from the innermost
    parentheses that enclose the identifier.


    1.  Put parenthesis around the declarator.


    2.  Find the identifier.


    3.  Go right token by token to the enclosing right parenthesis ’)’, to determine
    whether the identifier is an array, function, etc.


    4.  Go back to the enclosing left parenthesis (, and go right to determine if
    it is pointer, etc.


    5.  Continue with steps 2 and 3 until all parentheses have been considered.


    This is demonstrated below.


    Start with int *pa [ ].


    1.  We rewrite it as int (*pa [ ]).


    2.  We have the identifier pa.


    3.  Going right we see it as an array.


    4.  Going back to (we see that it is an array of pointers).


    Since the type is int we have a declaration of an array of pointers to integers.


    Start with int (*pa) [ ]


    1.  We rewrite it as int ( (*pa) [ ] ).


    2.  We have the identifier pa.


    3.  Going right to ) gives no more information.


    4.  Going back to ( and then to * we see that pa is a pointer.


    *   2\. Going right we see that we have a pointer to an array.


    No more information is to be gained within the outermost parentheses so we have
    that pa is a pointer to an array of integers.


    Start with int (*pa[ ]) ( ).


    1.  We rewrite it as int ( (*pa [ ]) ( ) ).


    2.  We have the identifier pa.


    3.  Going right to ) we see that pa is an array.


    4.  Now go back to ( and we have that pa is an array of pointers.


    *   2\. In the next level of parentheses we see that each element of the array
    is a function.


    So we have declared an array of pointers each of which is a pointer to a function
    of type int.


    # 5.7 INITIALIZERS


    Declarators can be used to initialize an identifier. In this case the identifier
    is initialized to the given value at the beginning of its lifetime. Some examples
    are


    | static int i = 10; | /* i is initialized to 10 */. |


    | int zz = i + 3; | /* zz is initialized to the value of i plus 3 */. |


    | char c[10], *p = c; | /* p is a pointer and initialized to the address of the
    array c */ |


    Scalar objects are initialized in the manner given in the next two sections. Arrays,
    structures, and unions require further discussion.


    # 5.7.1 INITIALIZATION OF OBJECTS WITH STATIC STORAGE DURATION


    Objects with static storage duration, declared with the keyword static, are by
    default initialized to 0\. Otherwise they may be initialized in a declaration
    such as static int i = 10;. The value given during the initialization is the initial
    value of the object during its lifetime. The value given may be a constant or
    another expression. Here are two examples.


    ![e9780738671956_i0130.jpg](images/e9780738671956_i0130.jpg)


