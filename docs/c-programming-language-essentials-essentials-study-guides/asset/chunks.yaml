  raw: 'Logical AND expressions have the form operand1 && operand2. The operands may
    be of any scalar type. The result is type int and has value either 0 or 1\. If
    both operands are non-zero then the result is 1\. If at least one of the operands
    is 0 then the result is 0\. The operands are evaluated from left to right until
    each evaluates to a non-zero value or until one evaluates to zero. In the following
    example we expect output of


    ![e9780738671956_i0056.jpg](images/e9780738671956_i0056.jpg)


    At the second while statement we are evaluating the expression


    ![e9780738671956_i0057.jpg](images/e9780738671956_i0057.jpg)


    If it happens that *q == p, as it does with the first string, then we do not evaluate
    *(++q)!= ‘\0’ so that q points to the character ’.’ in the string. Otherwise,
    when *q != p, we evaluate the expression following && and modify q.


    # 3.15.2 LOGICAL OR (| |) EXPRESSIONS


    Logical OR expressions have the form operand1 | | operand2. The operands may be
    of any scalar type. The result is type int and has value either 0 or 1\. If both
    operands are zero then the result is 0\. If at least one of the operands is non-zero
    then the result is 1\. The operands are evaluated from left to right until all
    are evaluated or one evaluates to a non-zero value. In the following example we
    expect output of


    ![e9780738671956_i0058.jpg](images/e9780738671956_i0058.jpg)


    The logical OR expression


    ![e9780738671956_i0059.jpg](images/e9780738671956_i0059.jpg)


    controls the for loop. As long as it evaluates to 1 the loop continues. We exit
    the loop only when all three variables, x, y, and z, have a value greater than
    or equal to 5.


    # 3.16 CONDITIONAL EXPRESSIONS


    Conditional expressions have the form


    expression1 ? expression2 : expression3


    The expression ( x >= 0) ? x: —x is an example. If expression1 evaluates to zero
    then expression3 is evaluated, otherwise expression2 is evaluated. The first expression
    must be a scalar type – it is often a logical expression. The others may be of
    various types, provided they are of the same type. Exactly one of expression2
    or expression3 is evaluated. The type of the result is the type of expression2
    or expression3. The expression in the example above evaluates the absolute value
    of x. If x is greater than or equal to 0 then the expression returns x, otherwise
    it returns the negative of x.


    # 3.17 ASSIGNMENT EXPRESSIONS


    C offers several assignment operators. They are


    ![e9780738671956_i0060.jpg](images/e9780738671956_i0060.jpg)


    and incorporate previous operators. An assignment expression has the form


    ![e9780738671956_i0061.jpg](images/e9780738671956_i0061.jpg)


    The lvalue to the left of assignment-operator is modified as a result. The assignment
    expression has the value of the modified lvalue as its value. For example, the
    expression


    ![e9780738671956_i0062.jpg](images/e9780738671956_i0062.jpg)


    gives a the value 35, after it has assigned x the value 12\. The expression has
    the value 35. For another example consider x = y = z = 0; which initializes x,
    y, and z to 0.


    # 3.17.1 SIMPLE ASSIGNMENT


    Simple assignment expressions have the form


    ![e9780738671956_i0063.jpg](images/e9780738671956_i0063.jpg)


    The lvalue is modified to the value of the expression to the right of =. The assignment
    expression has the value of the lvalue as its value. For example in


    ![e9780738671956_i0064.jpg](images/e9780738671956_i0064.jpg)


    we first assign 3 to d, then subtract 3 from c, add the result to d and 2, and
    then modify a[i]. Also consider


    ![e9780738671956_i0065.jpg](images/e9780738671956_i0065.jpg)


    If the expression to the right of = is zero then the printf will not be executed.


    Expressions such as aray[v++] = v should be avoided. The order of evaluation of
    v is not specified.


    # 3.17.2 COMPOUND ASSIGNMENT


    Compound assignment statements involve another operation with assignment. They
    have the form


    ![e9780738671956_i0066.jpg](images/e9780738671956_i0066.jpg)


    They are equivalent to


    ![e9780738671956_i0067.jpg](images/e9780738671956_i0067.jpg)


    For example xlval *= 3 is equivalent to xlval = xlval * 3\. The lvalue is evaluated
    only once. So while xlval% = 10 is equivalent to xlval = xlval % 10, aray[i++]
    — = 12 is not equivalent to aray[i++] = aray[i++] — 12.


    # 3.18 COMMA EXPRESSIONS


    These expressions are made up of expressions separated by one comma for every
    pair of expressions. The comma indicates sequential evaluation. The expression
    pi = 3.14, diam = 2*pi*r, area = diam*r/2; is an example. The expressions are
    evaluated left to right. As an expression is evaluated its value is discarded.
    The value of the rightmost expression is the value of the comma expression. So
    in our example the expression has value of area. First pi is initialized, then
    diam is computed, and finally area.


    Here is an example which prints the elements of an array in two columns after
    filling it in a silly way.


    ![e9780738671956_i0068.jpg](images/e9780738671956_i0068.jpg)


    The output is


    | 0 | -10 |


    | 1 | 11 |


    | 2 | 12 |


    | 3 | 13 |


    | 4 | 14 |


    | —5 | —15 |


    | 6 | 16 |


    | 7 | 17 |


    | 8 | 18 |


    | 9 | 19 |


    # 3.19 CONSTANT EXPRESSIONS


    Constant expressions can only be expressions that can be calculated at compile
    time, when the program is being translated. An example would be the expression


    (sizeof aray) / (sizeof aray[0])


    The evaluation of a constant expression at compile time must yield the same result
    as if it were evaluated during execution. Several different forms of expressions
    are allowed provided that all may be done while the program is being translated.
    Any information that is dynamic, not known until execution, may not be used. Constant
    expressions may not contain assignments, increments, decrements, function calls,
    or comma operators except as part of the operand of sizeof. Each item in an operand
    of a constant expression that is not used with sizeof, must be integral type or
    cast to a specific integral type.


    # CHAPTER 4


    # STATEMENTS


    Statements control the flow of execution in a program. There are three fundamental
    control structures to specify the order of execution in a C program. They are


    | sequential control | the next statement is executed |


    | conditional control | one statement out of several possible is executed |


    | iterative control | a block of statements are executed repeatedly |


    In addition to using these control structures, there is a group of statements
    used to transfer the flow of control of execution from one point to another. C
    contains the assortment of statements one normally expects to find in a modern
    programming language. Statements are constructed from expressions. However, an
    expression has a value associated with it and a statement has no value.


    The term “statement” will refer to a single simple statement or a compound, block
    statement.


    # 4.1 EXPRESSION STATEMENTS


    Expression statements are simple statements and have the form expression; some
    examples are


    a = b + c; d++; *s++ = *++t; number %= 10;


    (class— >studt.grade >= 60) ? pass++ : fail++;


    # 4.2 COMPOUND STATEMENTS


    A compound statement is also called a block. A compound statement has the form


    ![e9780738671956_i0071.jpg](images/e9780738671956_i0071.jpg)


    The character { starts a block, and } ends a block. These characters enclose a
    sequence of statements. Every function contains at least one block. Any declarations
    made within a block are in effect within that block and any block contained within.
    The following program fragment


    ![e9780738671956_i0072.jpg](images/e9780738671956_i0072.jpg)


    would produce the output


    ![e9780738671956_i0073.jpg](images/e9780738671956_i0073.jpg)


    This is because the object named y in the inner block is different than the object
    named y in the outer block. There is only one object named x in either block.
    A variable may be referenced only if it has been declared within a block or in
    a block enclosing the present block.


