  raw: 'Objects of type char, characters, can be used to store any member of the executable
    character set. Initially this included ASCII and EBCDIC so that one byte was sufficient.
    The ANSI standard includes provision for also representing international character
    sets. A char object can be declared signed or unsigned. Both occupy the same amount
    of space. On machines that use a byte to represent an object of type char, such
    an object may be used to represent integers in the range 0 to 127\. On the same
    machine an unsigned char may be used to represent an integer in the range 0 to
    255.


    # 2.2.1.2 int OR integer


    Objects of type integer can be used to store any integer that may be represented
    on the underlying machine. So the range of values that can be represented is termed
    machine dependent.


    There are three sizes of objects of type integer. They are short int, int, and
    long int. Furthermore, each may also be unsigned.


    int — Objects of this type are integers, positive, negative and zero that are
    representable by the host computer. The range of values available may differ from
    one implementation to another. For example, on a machine which uses 16 bits to
    represent integers the values available range from – 32768 to 32767 – (2^15 through
    2^15 – 1).


    unsigned int — Objects of this type are either positive or zero. They have the
    same representation as int except that the first bit that is used to represent
    the sign in an object of type int is available for data. So on a machine which
    uses 16 bits to represent an integer the unsigned int range is from 0 to 65535.


    short int — Objects of this type are integers in the range -32768 to 32767\. They
    may differ from those of type int depending on the underlying hardware.


    unsigned short int — Objects of this type are either positive integers or zero
    in the range 0 to 65535.


    long int — Objects of this type are integers which are at least in the range –
    2147483648 to 2147483647\. This implies that 32 bits are used to represent a long
    integer. A wider range may be possible on some machines.


    unsigned long int — Objects of this type are either positive integers or zero
    in the range 0 to at least 4294967295.


    # 2.2.1.3 enum OR enumerations


    Enumerated types are data types created by the programmer. The operations are
    the same as those for any integer, but the programmer determines the possible
    values for objects of that type. Consider:


    ![e9780738671956_i0021.jpg](images/e9780738671956_i0021.jpg)


    Here the tag color is the name of the type and its possible values are listed
    within the braces. These values may be used wherever an integer constant may be
    used. For example,


    ![e9780738671956_i0022.jpg](images/e9780738671956_i0022.jpg)


    In this case red is given the value 0 and violet the value 6\. Other values may
    be specified in a program. For example, enum rooms { lab=204, class=203, printers=5,
    terminals=5, lounge=109 } or enum courses { assembly=301, organization, datastruct
    }. In the last example assembly has the value 301, organization has the value
    302, and datastruct has the value 303.


    # 2.2.2 FLOATING


    Floating point, or real, data objects are used to store numeric values which contain
    a decimal point. They are available in two sizes, float (single precision) and
    double (double precision). Examples of floating point constants were given in
    section 1.6.2\. Examples of declarations of floating point objects are


    ![e9780738671956_i0023.jpg](images/e9780738671956_i0023.jpg)


    The first declares a function named max to be type double, the second declares
    x_force to be an array of ten single precision real numbers, the third declares
    a variable x_coord to be type float, and the last declares a variable pi to be
    type double. The exact range of values that may be represented by floating point
    objects is machine dependent.


    # 2.2.2.1 float


    Objects of type float are often stored in four bytes or 32 bits. If this is the
    case then values in the range from 10^(-38) to 10^(+38) may be represented. The
    numbers are represented internally in a binary or base two form. The 32 bits are
    broken up into 1 bit for the sign of the number, and an exponent and fractional
    part. The 8 bits for the exponent is represented as 1 bit for the sign of the
    exponent and 7 bits for the exponent. This gives a maximum exponent of 127 and
    2^(127) is approximately 10^(+37).


    # 2.2.2.2 double


    We expect objects of type double to require twice as much space as objects of
    type float. However, this depends upon the compiler. In some cases objects of
    type double may be stored in 8 bytes or 64 bits so that values in the range 10^(-308)
    to 10^(+308) may be represented. This gives greater precision or accuracy than
    float types. But some compilers use the same representation for objects of type
    double as for those of type float. In this case there is no difference in the
    range of values represented by double or float.


    # 2.3 DERIVED TYPES


    The arithmetic types of C are the basic or scalar types. We may declare and work
    with objects that are aggregates of objects of the scalar types. These are sometimes
    called “structured types.” They consist of a collection of objects of the arithmetic
    types.


    # 2.3.1 ARRAYS


    An array is a sequence of objects, and each item in the sequence is of the same
    type. We may construct arrays of any type except for void. As an example consider
    int a[100]. Here we declare a to be an array consisting of 100 integers. The first
    element of the array is a[0] and the last element is a[99]. Generally if we make
    the declaration type a[N] then a is an array of N objects, each of type type.
    The first element of the array is a[0] and the last element is a[N – 1]. The range
    of subscripts for an array always go from 0 to 1 less than the size of an array.


    Multidimensional arrays are arrays of arrays. To declare a two dimensional array
    bobo with 4 rows and 12 columns of numbers of type double we would write double
    bobo[4] [12]. The first element would be referenced by bobo[0] [0], the second
    element is bobo[0] [1], and the last element by bobo[3] [11]. Multidimensional
    arrays are stored row-by-row.


    We may reference individual elements of an array by writing the array name followed
    by the appropriate subscript(s). Each of the elements has the type given in the
    declaration of the array. The array itself has a value associated with it as well.
    That value is the address of the array. So if we have the declaration char ch[6],
    then ch[3] is of type char and represents a character. ch has as its value the
    address of an array or characters. From our discussions in the sections on character
    and string constants you may see that if we set ch[0] =’H’, ch[1] = ’e’, ch[2]
    = ’1’, ch[3] = ’1’, ch[4] = ’o’, and ch[5] = ’\000’, then ch represents the string
    “Hello”.


    # 2.3.2 POINTERS


    A pointer holds the address of an object in memory or has the initial value 0
    or NULL. So if we wanted p to hold the address of an integer (point to an integer)
    then we would make the declaration int*p. Pointers may point to objects of any
    type. The declaration char*strs[10]; identifiers strs as an array of pointers
    each of which points to a character.


    If p is a pointer then the value of p is an address and *p is the object pointed
    to by p. Suppose that chp is a pointer to a character and that character is ’e’.
    Then chp has as its value the address of the character and *chp has ’e’ as its
    value. As another example consider the following:


    | int x, y, *p; | /* declare x and y to be integers and p a pointer to an integer
    */ |


    | p = &x; | /* assign the address of x, &x, to p so that p points to x */ |


    | x = 4; | /* assign 4 to x */ |


    | y = *p; | /* assign the value of the object pointed to by p to y that object
    is x, and its value is 4, so y has the value 4 */ |


    | *p = 12; | /* assign 12 to the object pointed to by p that object is x, so x
    now has the value 12 */ |'
