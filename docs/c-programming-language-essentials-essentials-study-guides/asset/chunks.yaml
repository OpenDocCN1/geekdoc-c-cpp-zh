    to a function. If we have the prototype


    ![e9780738671956_i0165.jpg](images/e9780738671956_i0165.jpg)


    and the call to the function


    ![e9780738671956_i0166.jpg](images/e9780738671956_i0166.jpg)


    then the address of numcomp is passed to msort so that the function numcomp may
    be called from msort.


    # 6.3 RETURN VALUES


    A function returns a value to the point at which it is called. If the function
    doesn’t contain a return statement then the function must be type void. If a function
    is any other type then execution of the function must terminate with a return
    statement. The expression in the return statement is evaluated, converted to the
    type of the function, and then transmitted to the calling statement.


    # 6.4 EXECUTION OF FUNCTIONS


    When a function is called the arguments are evaluated and those values are copied
    into the objects represented by the parameters. All local variables, those contained
    within the beginning { , are created each time a function is called, unless they
    have storage class static. Execution then continues statement by statement until


    1.  A return statement is executed. Control then returns to the caller.


    2.  The function finished execution of statements in the function block. Control
    then returns to the caller.


    3.  The function calls another function. When the called function terminates,
    control usually returns to the point at which it was called and execution continues.


    4.  An error occurs or some other signal occurs which aborts execution.


    # 6.5 RECURSION


    A function may call itself directly or indirectly through another function. This
    is termed recursion and is allowed in C. When a function is called recursively
    new copies of the parameters and automatic local variables are created. They are
    separate from any previous invocation of the function. When the current invocation
    of the function terminates, control is passed to the point of call and the newly
    created parameters and local variables are discarded. Here is an example which
    contains a function nfac(int n). That function computes the factorial of a recursively.
    The example also demonstrates that a static variable, j in this case, retains
    its value from one call to another of the function in which it is declared. It
    also shows that an automatic variable, i in this case, starts anew each time the
    function in which it is declared is called.


    ![e9780738671956_i0167.jpg](images/e9780738671956_i0167.jpg)![e9780738671956_i0168.jpg](images/e9780738671956_i0168.jpg)


    The output is


    ![e9780738671956_i0169.jpg](images/e9780738671956_i0169.jpg)


    # 6.6 PROGRAM PARAMETERS-COMMAND LINE ARGUMENTS


    Every C program has one function whose name is main. It is the first function
    executed of the functions in a program. If main is declared as


    ![e9780738671956_i0170.jpg](images/e9780738671956_i0170.jpg)


    then the program has no arguments. If we were in a UNIX environment and the program
    were named prog, then it would be invoked by typing prog and pressing return.
    If we were in a MS-DOS environment and the program were named prog.exe, then it
    would be invoked by typing prog and pressing return. The function main is declared
    with no arguments so it is invoked by entering only its name. It is possible to
    allow for arguments to be entered when the program is invoked, for arguments to
    be part of the command line. In that case main is declared as


    ![e9780738671956_i0171.jpg](images/e9780738671956_i0171.jpg)


    When the program begins execution, two arguments are passed to main. The first
    argument, traditionally named argc, has as its value the number of arguments on
    the command line including the name of the program. The second argument, traditionally
    named argv, is an array of pointers to char or an array of strings. The array
    argv holds the name of the program and any arguments that are part of the command
    line. Blanks are used to delimit or separate the arguments. The first string,
    argv[0], is the program name, and the other arguments are stored in argv[1] through
    argv[argc-1 ]. argv[argc] is a null character pointer. Here are some examples.


    | add table1 table 2 | – | argc = 3 | argv[0] = add |


    |  |  |  | argv[1] = table1 |


    |  |  |  | argv[2] = table2 |


    | sort -n -u +f myfile | − | argc = 5 | argv[0] = sort |


    |  |  |  | argv[1] = – n |


    |  |  |  | argv[2] = -u |


    |  |  |  | argv[3] = +f |


    |  |  |  | argv[4] = myfile |


    | sort | – | argc = 1 | argv[0] = sort |


    Here is an example of a program that copies one file to another. Both files must
    be specified on the command line so that argc must be three. It doesn’t do too
    much except demonstrate the use of argc and argv.


    ![e9780738671956_i0173.jpg](images/e9780738671956_i0173.jpg)


    # 6.7 PROGRAM STATUS


    The function main is type int. It returns a value, to the operating environment,
    called the program status. It may be used to signal normal termination of a program
    or an error situation. In the example in the preceding section the program status
    was used as


    | status 0 | all complete with no known problems |


    | status 1 | couldn’t open source file for reading |


    | status 2 | couldn’t open destination file for writing |


    # 6.8 FLOW OF CONTROL


    Program execution begins with the function main. After that point control is handled
    as in any other function. Control is passed back to the operating system when
    main terminates or some other function causes execution to terminate.


    # CHAPTER 7


    # THE PREPROCESSOR


    The C preprocessor is software that processes directives before the source program
    is translated. The directives are part of the source file(s). Almost every directive
    begins with the character #. They allow files to be included as part of the source
    program, allow for conditional compilation of portions of the source program,
    and allow for text and macro substitution. The preprocessor may be used to construct
    programs that are easier to develop, easier to read, and portable in the sense
    that they may be transferred from one machine to another. The following is a list
    of the directives that will be discussed in this chapter.


    ![e9780738671956_i0175.jpg](images/e9780738671956_i0175.jpg)


    The directives may be placed anywhere in a C program. When they are used they
    are preceded by a # and possibly some white space. For example, both #define and
    # define are valid in ANSI Standard C. In previous versions of C, directives had
    to be written with the # in column one and no white space. Preprocessor directives
    are assumed to end at the end of the line. If a preprocessor directive or any
    C code is to extend over a line then the backslash character, \ may be used to
    “splice” lines. We mean that


    ![e9780738671956_i0176.jpg](images/e9780738671956_i0176.jpg)


    and


    ![e9780738671956_i0177.jpg](images/e9780738671956_i0177.jpg)


    are equivalent to


    ![e9780738671956_i0178.jpg](images/e9780738671956_i0178.jpg)


    and


    ![e9780738671956_i0179.jpg](images/e9780738671956_i0179.jpg)


    This “line splicing” is done before the program is split into tokens.


    # 7.1 TRANSLATION PHASES


    A program is compiled or translated in several phases. Errors may occur at any
    phase and cause the translator to not go on. The phases are


    1.  Trigraph sequences are replaced by their equivalents.


    2.  Whenever a backslash \ precedes a new-line, the two physical lines are “spliced”
    to one logical line.


    3.  The source text is split into tokens and white space. Comments are replaced
    by a single space.


    4.  Preprocessing directives are followed. This may cause going through phases
    1— 4 recursively.


    5.  Escape characters and string literals are replaced by their equivalents.


    6.  Adjacent string literals are concatenated.


    7.  All tokens are analyzed and translated both syntactically and semantically.
    This is known as the parsing phase.'
