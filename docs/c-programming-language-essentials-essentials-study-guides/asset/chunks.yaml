    intermediate code. If necessary optimization may be performed during this phase.
    This is the end of compilation.


    9.  External data and function references are resolved during the link phase.
    Library functions and objects are obtained and joined with the rest to form a
    module which may be executed.


    # 7.2 MACRO DEFINITION AND EXPANSION


    # 7.2.1 THE #DEFINE DIRECTIVE


    The #define directive allows for the association of meaningful identifiers with
    constants, keywords, statements, or expressions. It has one of two forms:


    ![e9780738671956_i0180.jpg](images/e9780738671956_i0180.jpg)


    or


    ![e9780738671956_i0181.jpg](images/e9780738671956_i0181.jpg)


    The first is called a manifest and the second a macro. If an identifier has been
    defined then it may not be re-defined differently in the same source program,
    unless it is “erased” by use of the #undef directive. It may be defined to the
    same value more than once in a source file. The token-sequence doesn’t end in
    a semicolon and must be on one “logical” line. It could span more than one “physical”
    line if the line splice character \ is used.


    First we will discuss manifests. Every occurrence of the identifier, following
    the manifest in the source file, is replaced with the token sequence. This occurs
    before the program is complied. Substitutions are only made for tokens and are
    not made within quoted strings. For example, the definition #define DONE 0 defines
    the name DONE. There will be no substitution for DONE in NOTDONE or in printf(“DONE”).
    Here is a program that contains some manifests.


    ![e9780738671956_i0182.jpg](images/e9780738671956_i0182.jpg)![e9780738671956_i0183.jpg](images/e9780738671956_i0183.jpg)


    The preprocessor changes it to


    ![e9780738671956_i0184.jpg](images/e9780738671956_i0184.jpg)


    Now we discuss macros. A macro may be thought of as being similar to a function.
    Both have parameters and both may be accessed in a program by writing the name
    of the macro/function followed by a list of arguments within parenthesis. The
    difference is that a function call is translated to an evaluation of arguments
    followed by a jump instruction, whereas a macro expands to in-line code. For example,


    ![e9780738671956_i0185.jpg](images/e9780738671956_i0185.jpg)


    defines a macro named MIN. If it is used in the body of a program as


    ![e9780738671956_i0186.jpg](images/e9780738671956_i0186.jpg)


    then the preprocessor replaces it with


    ![e9780738671956_i0187.jpg](images/e9780738671956_i0187.jpg)


    The definition gives the replacement text for the macro. As for manifests, substitutions
    are made only for tokens and no substitutions are made within quoted strings.


    Some care has to be taken when using and writing macros. The macro MIN above has
    side effects with a statement such as MIN(x++, y++);. The smaller of the two gets
    incremented twice. Parentheses should be used when writing a macro to insure proper
    evaluation. For example,


    ![e9780738671956_i0188.jpg](images/e9780738671956_i0188.jpg)


    used as


    ![e9780738671956_i0189.jpg](images/e9780738671956_i0189.jpg)


    would be replaced with


    ![e9780738671956_i0190.jpg](images/e9780738671956_i0190.jpg)


    which is not what was intended. A better definition would be


    ![e9780738671956_i0191.jpg](images/e9780738671956_i0191.jpg)


    Using a macro instead of a function will reduce execution time of a program. It
    eliminates the time required to call and return from a function. The standard
    header file, stdio.h, often contains macro definitions for getchar and putchar.
    This reduces the time to handle characters.


    No substitution is made within quoted strings. However, an argument can be expanded
    into a quoted string by the use of # in front of the parameter. For example,


    ![e9780738671956_i0192.jpg](images/e9780738671956_i0192.jpg)


    when used as


    ![e9780738671956_i0193.jpg](images/e9780738671956_i0193.jpg)


    will be translated as


    ![e9780738671956_i0194.jpg](images/e9780738671956_i0194.jpg)


    The strings are concatenated and we end up with


    ![e9780738671956_i0195.jpg](images/e9780738671956_i0195.jpg)


    When ## is in a macro, the two tokens on either side of the ## are concatenated
    into one token. For example, if we define


    ![e9780738671956_i0196.jpg](images/e9780738671956_i0196.jpg)


    then REVERSE(“abc”,“def”) produces “def””abc”. Adjacent strings are concatenated
    so we end up with “defabc”.


    # 7.2.2 THE #UNDEF DIRECTIVE


    Once a name has been defined through the use of #define, it cannot be redefined
    to a new value within a file unless #undef is used. For example, suppose MAX has
    been defined as #define MAX 10\. To change its value or make it undefined later
    in a file, use #undef MAX.


    # 7.3 FILE INCLUSION


    A preprocessor directive of the form #include <filnam> causes the replacement
    of that line by the contents of the file filnam. It is also valid to use #include
    “filnam”. The two forms indicate the search path to be taken for finding filnam.
    When the file name is enclosed in < >, some implementation dependent path is searched
    for the file. This usually means that the locations of the necessary header files
    is searched first. When the file name is enclosed in “ ”, the current directory
    is searched first for the file. filnam may also include a path as part of the
    file name. Here are some examples


    | #include <stdio.h> | This will include the file stdio.h from the system dependent
    directories |


    | #include “stdio.h” | This will search the current directory for stdio.h |


    | #include <sys>types.h> | Here the file name has a patch associated with it |


    | #include “menu.def” | The local directory is searched for a file named menu.def
    |


    | #define FILENAME file 1 |  |


    | #include “FILENAME” | The file name comes from another pre-processor directive
    |


    Nesting is allowed in files that are included using #Include. That means if file1
    is


    ![e9780738671956_i0198.jpg](images/e9780738671956_i0198.jpg)


    then the line #include “file1” is processed as if the include directives from
    file1 were present.


    # 7.4 CONDITIONAL COMPILATION


    Directives are available to cause lines of the source file to be ignored or selectively
    sent to the preprocessor or compiler. Conditions may be checked to determine whether
    to skip a section of the source code. This is often to make C programs portable,
    easy to transfer from one machine to another. The directives used are


    ![e9780738671956_i0199.jpg](images/e9780738671956_i0199.jpg)


    The #if and #elif are used with a constant expression; sizeof, type casts, and
    enumeration constants are not allowed. They may use the preprocessor operator
    defined. Its syntax is defined(identifier). If the expression evaluates to a non-zero
    value then it is taken to be true. If it evaluates to 0 then it is taken to be
    false. Naturally, #if must have a matching #endif; #elif and #else cannot be used
    without a preceding #if, and the directives #elif and #else go with the most recent
    #if or #elif. Some examples follow.


    ![e9780738671956_i0200.jpg](images/e9780738671956_i0200.jpg)


    If WRDSIZ is greater than 16 then the next three #define directives are presented
    to the preprocessor. Otherwise the two following the #else are seen by the preprocessor.
    The next statement declares x and y. If LONGWORD has been defined, the declaration
    for the function Ingshft, the call to lngshft, and the definition of Ingshft are
    presented to the compiler. Otherwise, the compiler never sees them!


    ![e9780738671956_i0201.jpg](images/e9780738671956_i0201.jpg)


    This example selects header files to be included. Note that the directive #elif
    PRINTER = = LASER does not apply to the directive #if PLOTTER > 2 because of the
    preceding #endif.


    # 7.5 OTHER DIRECTIVES


    The #line directive has two possible forms.


    ![e9780738671956_i0202.jpg](images/e9780738671956_i0202.jpg)


    or


    ![e9780738671956_i0203.jpg](images/e9780738671956_i0203.jpg)'
