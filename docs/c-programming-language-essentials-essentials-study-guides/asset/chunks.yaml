    no storage class, are not automatically initialized to any value. An equal sign
    = must follow the declarator, which in turn is followed by a constant or an expression.
    The value given during the initialization is the initial value of the object during
    its lifetime. Here are two examples.


    ![e9780738671956_i0131.jpg](images/e9780738671956_i0131.jpg)


    # 5.7.3 INITIALIZING ARRAYS


    Array elements may be initialized by providing a list of expressions for the elements.
    These expressions must consist of constant values. The value for each element,
    except for the last element, is followed by a comma. The ANSI standard for C allows
    initialization of auto or static arrays. Other C compilers only allow initialization
    of arrays with static storage class. Here are some examples with explanations.


    ![e9780738671956_i0132.jpg](images/e9780738671956_i0132.jpg)![e9780738671956_i0133.jpg](images/e9780738671956_i0133.jpg)


    # 5.7.4 INITIALIZING CHARACTER ARRAYS


    Arrays of characters may be initialized to a string. For ex-. ample,


    ![e9780738671956_i0134.jpg](images/e9780738671956_i0134.jpg)


    initializes the array messg to the string. This array includes the ASCII character
    ‘\0’.It could be modified later by setting


    ![e9780738671956_i0135.jpg](images/e9780738671956_i0135.jpg)


    A declaration of the form


    ![e9780738671956_i0136.jpg](images/e9780738671956_i0136.jpg)


    sets all elements of messg to ‘\0’ following the final ’r’.


    # 5.7.5 INITIALIZING STRUCTURES


    Structures may be initialized in a manner similar to arrays. For example,


    ![e9780738671956_i0137.jpg](images/e9780738671956_i0137.jpg)


    Once the struct is established we may initialize an array of structures such as


    ![e9780738671956_i0138.jpg](images/e9780738671956_i0138.jpg)


    It is not necessary to initialize all elements of a structure. This,


    ![e9780738671956_i0139.jpg](images/e9780738671956_i0139.jpg)


    initializes the identifier typical to have name field of Rochelle. The other fields
    are not initialized.


    Finally, we may initialize a structure to a value from an outer block with a statement
    such as struct student new = typical;


    # 5.7.6 INITIALIZING UNIONS


    The elements of a union may be of different types and any initialization refers
    to the first item. For example in


    ![e9780738671956_i0140.jpg](images/e9780738671956_i0140.jpg)


    the int field will be used and 3 will be assigned to intval.


    # 5.8 TYPE NAMES


    Type names are used in several situations: with the sizeof operator, with cast
    operations, and with function prototypes. The name of a type must be specified
    without the name of an object. For example (char *)p, casts p as a pointer to
    a character. Any possible type name may be constructed such as


    | float | /* float */ |


    | float * | /* pointer to float */ |


    | float [10] | /* array of 10 objects of type float */ |


    | float *[10] | /* array of 10 pointers to objects of type float */ |


    | float (*)[ ] | /* pointer to an array of an unspecified number of objects of
    type float */ |


    | float *( ) | /* function of unspecified number of parameters returning a pointer
    to float */ |


    | float (*[ ]) (void) | /* array of unspecified size, of pointers to functions
    with no parameters returning a pointer to object of type float */ |


    # CHAPTER 6


    # FUNCTION AND PROGRAM STRUCTURE


    Previous chapters have dealt with specific elements of the language C, but have
    not addressed the issue of the structure of programs and functions. Here we discuss
    functions, recursion, issues relating to using the function main with parameters
    (command line arguments), program status, and finally the structure and flow of
    control of the collection of functions in a program.


    The ANSI standard for C is most noticeably different from earlier versions in
    regards to the declaration of functions. We’ll call the ANSI standard version
    “NEW” and the other “OLD”. Examples will be given for both versions where it is
    appropriate. They will be labeled “OLD” and “NEW”.


    # 6.1 FUNCTION DECLARATION AND DEFINITION


    A function declaration gives the type of the function and the name of the function.
    The ANSI standard for C requires that types of the parameters also appear in a
    declaration. A declaration, then, provides the specifications for calling the
    function and the type of value returned. The definition of a function consists
    of the declaration and statements necessary to specify the action taken by the
    function.


    # 6.1.1 DIFFERENCES BETWEEN ANSI STANDARD AND EARLIER VERSIONS OF C


    The ANSI standard version of C is most noticeably different from earlier versions
    in regard to the declaration of functions. We’ll call the ANSI standard version
    “NEW” and the other “OLD”. Here are two examples of definition of a function as
    it appears in “OLD” and “NEW” styles.


    | “OLD” Style | “NEW” Style |


    | --- | --- |


    | double dotprod(x,y,n) | double dotprod( double x[ ], y[ ],int n); |


    | double x[ ], y[ ]; | { |


    | int n; | int i; double temp = 0.0; |


    | { |  | for (i = 0; i < n; i++) |


    |  | int i; double temp = 0.0 | temp = x[i] * y[i] + temp; |


    |  | for (i = 0; i < n; i++) |  | return (temp); |


    |  | temp = x[i]∗y[i] + temp; | } |


    |  | return (temp); |  |  |


    | } |  |  |


    In the “OLD” style the parameters to the function are declared on the line(s)
    following the function declaration. Also, the types of the parameters were not
    listed with the names of the parameters in its declaration. The declaration in
    the “NEW” version requires that the parameters be listed with their type.


    If a function or parameter is not declared then it is assumed to be type int.
    The function power above, will return a value of type double and so must be declared
    wherever a call to the function occurs. In the “OLD” style it was sufficient to
    declare it without mentioning the parameters as


    ![e9780738671956_i0144.jpg](images/e9780738671956_i0144.jpg)


    In the “NEW” style the types of the parameters must be listed as well


    ![e9780738671956_i0145.jpg](images/e9780738671956_i0145.jpg)


    This notation allows a compiler to check that the arguments in a call to the function
    are in the correct order, are the correct type, and are the proper number. It
    also makes it easier for a reader to understand the program.


    # 6.1.2 FUNCTION DECLARATION


    A function declaration which accompanies the definition of a function is of the
    form


    | “NEW” Style | – | eturn-type function-name (parameter declarations); |


    | “OLD” Style | – | return-type function-name (parameter list) parameter declarations;
    |


    The return-type is the type of the function, the type of the value returned by
    the function. An example is


    | “NEW” Style | – | int getline ( char *s, int max), |


    | “OLD” Style | – | int getline (s, max) |


