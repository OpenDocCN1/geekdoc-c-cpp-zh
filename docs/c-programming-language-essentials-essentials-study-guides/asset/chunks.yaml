    # CHAPTER 1


    # FUNDAMENTAL NOTIONS


    C was originally designed in the 1970s for the UNIX operating system by Dennis
    Ritchie at Bell Laboratories. In 1978 The C Programming Language, which Ritchie
    co-authored with Brian Kernighan, was published. That book contained a definition
    of C which has been used as a basis for many of the current versions of C. In
    1983 the American National Standards Institute (ANSI) established a committee
    to define a standard for C. The ANSI standard for C was finally approved in the
    early 1990s. There are many versions of C and all major versions adhere to the
    specifications in the Kernighan & Ritchie (K&R) book or they conform to the standard.


    The ANSI standard formalizes many of the topics or notions introduced in K&R.
    It includes a standard library and requires the declaration of functions so that
    the compiler may check the number, type, and order of arguments to functions.
    We will use the notation of the ANSI standard throughout this Essentials^® text
    so that a function will be declared specifying the types of its parameters. Another
    name for this type of declaration is a prototype. The examples in this book can
    be used with versions of C which don’t allow prototypes by changing each declaration
    of the form


    ![e9780738671956_i0002.jpg](images/e9780738671956_i0002.jpg)


    to


    ![e9780738671956_i0003.jpg](images/e9780738671956_i0003.jpg)


    In the chapter that deals with functions we will explicitly show the differences
    between K&R versions and the ANSI standard.


    # 1.1 A C SOURCE PROGRAM


    A program written in C is a collection of functions and variables. The functions
    contain statements and the variables hold the results of computations. Every C
    program must contain one function named main. All variables must be declared,
    either within a function or outside of any function.


    The sample program below contains two functions, main and average. main begins
    on line 6 and ends on line 21\. It is declared as main(void) which indicates it
    has no formal parameters. All the local variables and statements of main() are
    between the { on line 7 and the matching } on line 22\. The specification of the
    function average begins on line 26 and ends on line 34\. average has two parameters,
    a and n. a represents an array of objects of type float and n represents an object
    of type integer. average also has some local variables and statements associated
    with it. These are on lines 28 through 30.


    ![e9780738671956_i0004.jpg](images/e9780738671956_i0004.jpg)![e9780738671956_i0005.jpg](images/e9780738671956_i0005.jpg)


    A program in C usually contains comments and directives to a preprocessor. Lines
    1 – 3 and 23 – 25 are comments. A preprocessor performs macro substitution, conditional
    compilation, and file inclusion. The lines beginning with # are preprocessor directives.
    In this program we request that the file stdio.h be included with the program
    before it is translated and define the symbol MAX to be 100.


    # 1.2 TOKENS, COMMENTS, AND WHITESPACE


    A source program in C is translated into executable code. In the early stages
    of that translation the compiler will group the characters of the program into
    lexical units called tokens. The five types of tokens are identifiers, keywords,
    operators, separators, and constants. Consider the statement:


    ![e9780738671956_i0006.jpg](images/e9780738671956_i0006.jpg)


    The tokens in that statement are the identifiers box_top and y, the operators
    = and +, the separators [,], and ;, and the constants 2 and 1.423. The other characters
    in that statement are either comments or whitespace.


    The two characters /* start a comment and the two characters */ end a comment.
    Comments may occur anywhere except that /* and */ are not interpreted as comment
    delimiters when they occur within string literals. For example,


    ![e9780738671956_i0007.jpg](images/e9780738671956_i0007.jpg)


    Comments may not be nested so that the following consists of one comment followed
    by the characters outer */.


