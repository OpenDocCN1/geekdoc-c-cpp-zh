  md: "# Creating Programs\n\n# Arrays\n\nA constant variable is given a value when\
    \ it is declared. This value can then only be read by the program, never updated.\
    \ If I wanted to write a scores program that could be easily changed for any size\
    \ of team I could:\n\n```\nusing System;\nclass ArrayDemo\n{\n    public static\
    \ void Main (\n    {\n        const int SCORE_SIZE = 1000;\n        int [] scores\
    \ = new int[SCORE_SIZE];\n        for (int i=0; i < SCORE_SIZE; i++)\n       \
    \     scores[i] = readint(\"Score: \");\n    }\n}\n```\n\n# Code Sample 16 Using\
    \ an Array\n\nThe variable SCORE_SIZE is an integer which has been marked with\
    \ const. This means that it cannot be changed by statements within the program.\
    \ It will never have a value other than 1000. There is a convention that constants\
    \ of this kind are given in LARGE LETTERS with an underscore between words.\n\n\
    Everywhere I used a fixed value to represent the size of the array I now have\
    \ to change the value assigned when the constant is declared and re-compile the\
    \ program. The other benefit of this is that the for loop looks a lot more meaningful.\
    \ Since few going from 0 to SCORE_SIZE is more obvious to the reader that it is\
    \ working with the score array.\n\n# 3.3.4 Creating a Two Dimensional Array\n\n\
    Sometimes we want to hold more than just one. Sometimes we need a grid. We can\
    \ do this by creating a two dimensional array. You can think of this as an 'array'\
    \ if you use it (but only if this doesn't make your head hurt). For example, to\
    \ hold the board for a game of noughts and crosses (tic tac toe) we could use:\n\
    \n```\nint [,] board = new int[3,3];\nboard[1,1] = -1;\n```\n\nThis looks like\
    \ one dimensional array, but there are some important differences. The [] now\
    \ has a comma. The presence of a comma implies each side of it. It means that\
    \ the array now has dimensions, rather than just one. So when we give the size\
    \ of the board we must specify two dimensions rather than just one. When we want\
    \ to specify an element we set the value in the middle square (the best one) to\
    \ 1.\n\nYou can think of a 2D array as a grid:\n\n| 0 | 1 | 2 |\n|---|---|---|n|\
    \ 0 | 1 | 0 |\n| 2 | 0 | 0 |\n\nThe first subscript could be used to specify which\
    \ row and which second column. The diagram shows the board with the best move\
    \ already.\n\nIn the example the array is square (i.e. the same dimension across\
    \ as us). We can change this if we use:\n\n```\nint [,] board = new int[3,10];\n\
    ```\n\n- but this would make it harder to play a sensible game on."
