    # # Override


    Sometimes you may want to make a more specialized version of an existing class.
    This class may entail updated versions of methods in the class. You can do this
    by creating a child class which extends the parent and then overriding the methods,
    which need to be changed. When the method is called on instances of the child
    class, the new method is called, not the overridden one in the parent. You can
    use the base keyword to access to the overridden method if you need to.


    # # Portable


    When applied to computer software, the more portable something is the easier it
    is to move it into a different type of computer. Computers contain different kinds
    of processors and operating systems which can only run programs specifically for
    them. A portable application is one which can be transferred to a new processor
    or operating system with relative ease. Level languages tend to be portable, machine
    code is hard to handle.


    # # Private


    A private member of a class is only visible to methods inside that class. It is
    conventional to make data members of a class private so that they cannot be changed
    by code outside the class. The programmer can provide methods or properties to
    manage the values which may be assigned to the private members. The only reason
    for making a data member private is to remove the performance hit of using a method
    to access the data.


    # # Property


    A property is an item of data which is held in an object. An example of a property
    Bank account would be the balance of the account. Another would be the name of
    the account holder. The C# language has a special construction to make the management
    of properties easy for programmers.


    # # Protected


    A protected member of a class is visible to methods in the class and to methods
    in classes which extend this class. It is kind of a half way between private (no
    access to methods outside this class) and public (everyone has access). It lets
    designate members in parent classes as being visible in the child classes.


    # # Public


    A public member of a class is visible to methods outside the class. It is conventional
    to make the method members of a class public so that they can be used by code
    in other class. A public method is how a class provides services to other classes.


    # # Reference


    A reference is a bit like a tag which can be attached to an instance of a class.
    The reference has a particular name. C# uses a reference to find its way to the
    instance of'
