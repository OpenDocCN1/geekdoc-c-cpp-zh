  md: "# Creating Solutions\n\n# Inheritance\n\nThe keyword `virtual` means \"I might\
    \ want to make another version of this method in a child class You don't have\
    \ to override the method, but if you don't have the word present, you definitely\
    \ can't.\n\nThis makes `override` and `virtual` a kind of matched pair. You use\
    \ `virtual` to mark a method as able to be overridden and `override` to actually\
    \ provide a replacement for the method.\n\n# Protection of data in hierarchies\n\
    \nIt turns out that the code above won't work. This is because the balance in\
    \ the `CustomerAccount` class is `private`. We carefully made `private` so that\
    \ methods in other classes can't get hold of the value and change it.\n\nHowever,\
    \ this position is too strict. That stops the `BabyAccount` class from being able\
    \ to change the value. To solve this problem `protected` provides a slightly less\
    \ restrictive access level. The protected members can extend the parent. In other\
    \ words, methods in the `BabyAccount` class can see and use a protected method\
    \ because they are in the same `hierarchy` as the class containing the member.\n\
    \nA class hierarchy is a bit like a family tree. Every class has a parent and\
    \ can do all the parent can. It also has access to all the protected members of\
    \ the classes above.\n\n```\npublic class CustomerAccount {\n    protected decimal\
    \ balance = 0;\n....\n```\n\nI'm not terribly happy about doing this, the balance\
    \ is very important to me and I'd rather that nobody outside the `CustomerAccount`\
    \ class could see it. However, for now this change will make the program work.\
    \ We later see better ways to manage this situation.\n\n```\nIAccount[] accounts\
    \ = new IAccount[MAX_CUST];\naccounts[0] = new CustomerAccount();\naccounts[0].PayIn(50);\n\
    Console.WriteLine(\"Balance: \" + accounts[0].GetBalance());\n```\n\n```\naccounts[1]\
    \ = new BabyAccount();\naccounts[1].PayIn(20);\nConsole.WriteLine(\"Balance: \"\
    \ + accounts[1].GetBalance());\n```\n\n```\nif (accounts[0].WithdrawFunds(20))\
    \ {\n    Console.WriteLine(\"Withdraw OK\");\n}\nif (accounts[1].WithdrawFunds(20))\
    \ {\n    Console.WriteLine(\"Withdraw OK\");\n}\n```\n\n# Code Sample 39 Using\
    \ Inheritance\n\nThe code above shows how we can create and use different types\
