  md: '# 5 Advanced Programming


    # 5.1 Generics and Collections


    Generics are very useful. This statement probably doesn''t tell you about them
    or what they do, but it does indicate that they are very useful. They sound a
    bit scary; telling people you learned about "generics" probably conjures images
    of people with white coats and test tubes, at least among those who cannot spell
    very well. I think the root of generics is probably "general", in the idea of
    them is that you specify a general purpose operation and apply it in different
    contexts in a way that appropriate to each of them. If this sounds like abstraction
    and invariance you are sort of the right track. If it doesn''t, then you will
    be re-reading bits of the book until they make sense.


    Perhaps the best way to talk about generics is to see how they can help us solve
    a problem for the bank. We have just seen that when an array is created the generic
    must specify exactly how many elements it contains. This leads to a "straw that
    breaks the camel''s back" problem, where adding the 10,001 customer is not actually
    a case for celebration, because the array size was set at 10000 and our program
    crashes.


    One way to solve this problem is to use a really big array, but we aren''t keen
    that it means for smaller banks the program might be wasting a lot of time. Frequently
    the CF libraries provide a number of solutions, starting with the simple ArrayList.


    # 5.1.1 The ArrayList class


    The ArrayList is a cousin of the HashTable we have seen, but that it lives in
    the System.Collections namespace. It lets us create something very useful, an
    array that can grow in size. We can always add new elements to the ArrayList,
    and some clear code in the library makes sure that this works.


    # Creating an ArrayList


    It is very easy to create ArrayList:


    ```

    ArrayList store = new ArrayList();

    ```


    Note that you don''t have to set the size of the ArrayList, but there are overloaded
    constructors that give you this information and help the library code along a
    bit:


    ```

    ArrayList storeFifty = new ArrayList(50);

    ```


    The ArrayList called storeFifty is initially able to store 50 references, but
    it can hold more or less as required.


    # Adding Items to an ArrayList


    Adding items to an ArrayList is also very easy. The class provides an Add method:


    ```

    Account robsAccount = new Account ();

    store.Add(robsAccount);

    ```


    It is important to remember what is going on. We are not putting an Account into
    the arraylist; we are making one element of the array refer to. In this respect
    the word Add can be a bit misleading, in what it actually does is add reference,
    not the hint itself


    Remember that it would be perfectly possible to have robsAccount in multiple arraylists,
    just like your name can appear on multiple lists in the real world. It might be'
