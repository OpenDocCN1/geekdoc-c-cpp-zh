    # Programmer''s Point: Make a Siren go off when your tests fail


    The above test is good but not great. It produces a little message if the test
    fails. You have to read that message, and if you don''t notice it then you think
    your code is OK. My tests count the number of errors that they have found. If
    the error is greater than two they print out a message flashing red text to indicate
    that something bad has happened. Some development teams connect sirens and flashing
    red lights to their test systems, so that is impossible to ignore a failing test.
    They then search out the programmer who caused the failure and make him or her
    coffee for the next week.


    # 4.5.4 Test Driven Development


    I love test development. If I ever write anything it will be your boots that I
    will write using a test driven approach. This solves three problems that I can
    see:


    +   You don''t test at the end of the project. This is usually the time to test,
    you might be using code that you wrote some time back. If the bugs are in an old
    piece of code you go through the effort of remembering how it works. Better to
    test the code as you write it, when you have the best possible understanding of
    what it is supposed to do.


    +   You can code early in the project which will be useful later on. Many projects
    are doomed because people starting before they have a proper understanding of
    what they are building. Writing tests first is a really good way of refining your
    understanding. And there is a good chance that the tests that you will will be
    useful at some point on.


    +   When you fix bugs in a project you need to be able to confirm that the fixes
    have not broken some other part (the most common way of introducing new faults
    into a program is to mend a bug). If you have a set of automated tests that run
    every bug you fix you have a way of stopping this from happening.


    So, please use tests. You will thank me later.


    # Programmer''s Point: Some things that are hard to test


    Test development is a good way to travel, but it does not solve all your problems.
    Some types of programs are hard to test this way. Anything with a front end where
    users use commands and gets responses is very hard to test like this, although
    it is easy to send inputs to a program it is much harder to see what the program
    response in. My approach is to make the user interface a very thin layer which
    sits on top of objects to do the work. In the case of our bank account, the code
    that provides the user interface where the customer enters how they want to withdraw
    is very simple and direct connects to the methods provided by objects. As long
    as my object tests are passed, I can be confident that the user interface will
    be OK.


    The other kind of program that is very hard to test in this is any kind of game.
    This is mainly the quality of gameplay something you can design tests for. When
    someone comes back and says "The test is hard because you can''t kill the end
    of level boss without dying" you can actually do about it. The solution in this
    is to set out very clearly what your tests are trying to prove (so that the human
    testers know what to look for) and make it easy to change the values that will
    affect the gameplay. For example it should be easy to adjust how much damage a
    hit from an alien causes to your spaceship, and the speed of all game objects.


