  md: '# 5.4.7 Staying Safe with Threads


    Threads are very useful. They let your program deal with tasks by firing off threads
    of execution. The best way to create a system that must support many users, for
    example is to create a multi-threaded application that starts up a thread to deal
    with each incoming request. This makes the code easier to manage and also means
    that your program can make the best use of the processing power available.


    However, threads can also be a source of frustration. We know that our programs
    sometimes produce errors when they run. This is mostly because we have done something
    wrong. When we get a problem we look at what has happened and then work out the
    fault. Until now our programs have been single threaded and we have been able
    to put in the data that causes us problems. This will cause the program to fail,
    at which point we can begin to fix it.


    Unfortunately when you add multreading to a solution it is no longer true. A program
    that works fine for 99.999% of the time may fail spectacularly, or lock up completely,
    when a specific set of timing related events occurs. Synchronization problems
    like the "Deadly Embrace" described above may only appear when two users request
    a resource at exactly the same time.


    When you have problems with a multi-threaded system the biggest difficulty is
    always making the fault so you can fix it. The only way to investigate the problem
    is to add lots of write statements so the program makes a log that you can examine
    after it has failed. Of course, time spent writing the log output affecting the
    timing of events in the program can even cause a fault to move, or if you are
    very lucky, vanish completely.


    You should protect any shared threads by using the Monitor class as described
    above. This will stop inadvertent data corruption. If sometimes "out of step"
    then this is a sign that you have threads fighting over data items.


    You should try to avoid any "Deadly Embrace" by making your threads producers
    or consumers of data. If consumers are always waiting for producers (and producers
    never wait for consumers) then you can be sure that you never get into the situation
    where one thread waits for a thread that is waiting for.


    Finally you should design in the logging and debugging behaviour (you can always
    use conditional to turn off the logging off) so that if you have a problem it
    is easy to get diagnostic information which will tell you what your program was
    doing at the time it went wrong.


    # Programmer''s Point: Put Threads into your Design


    I think what I am really saying here is that any thread use should be designed
    into your program, and not tacked on afterwards. If you want to use threads that
    they are managed and how they should communicate be decided right at the start
    of your program and your whole system be constructed with them in mind.


    # 5.4.8 Threads and Processes


    You can regard all threads as living in the computer in the same way that a number
    of trains share a particular railway. The next step up is to have one railway.
    In programming terms this is a move from processes to threads. Processes are different
    from threads, in that each process has its own memory space which is isolated
    from other processes.


    When you are using a processor and a web browser at the same time on your computer
    each of them is running on your computer as a different process. Your word processor
    may fire off several threads that run within it (perhaps one to spell checking),
    but nothing in the word processor can ever directly access the variables in the
    browser.'
