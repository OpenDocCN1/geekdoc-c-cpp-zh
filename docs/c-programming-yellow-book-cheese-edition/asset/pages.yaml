    \ what has actually happened. The Exception object also contains other properties\
    \ that can be useful.\n\n# 3.4.4 Exception Nesting\n\nWhen an exception is thrown\
    \ the run time system, which is managing the execution of your program inside\
    \ the computer, will look for the enclosing catch clause. If your program does\
    \ not contain a catch for the exception it will be caught by a catch which is\
    \ part of the run time system. The code in this catch clause will display the\
    \ exception details and then stop the program. Programs can have multiple levels\
    \ of try-catch, and the program will use the catch which matches the level of\
