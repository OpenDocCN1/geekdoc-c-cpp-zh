    \ the \"Rpa\" would give the same total (82+112+97) and refer to the same location.\
    \ This is poetically referred to as a \"hash clash\". We can do clever things\
    \ with use the value to reduce the chances of happening, but we can't completely\
    \ avoid clashes.\n\nClashes can be resolved by adding a test when we are storing\
    \ an account. If we find the location we would like to use is not null simply\
    \ work our way down looking for the first location from that point.\n\nWhen we\
    \ want to find an item we use the hash to take us to the starting position and\
    \ then look for the one with the matching name.\n\nC# Programming © Rob Miles\
