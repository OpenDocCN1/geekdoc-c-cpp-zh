  md: "# Creating Solutions\n\n# Objects, Structures and References\n\n![](img/5a238309826e383fc3d481aa5d5dfccc_94_0.png)\n\
    \nThe first instance is shown \"hanging\" in space, with nothing referring to\
    \ it. As far as making use of data in the instance is concerned, it might as well\
    \ not be there. The C# language implementation has a special process, the \"Garbage\
    \ Collector\" which is the job of finding useless instances and disposing of them.\
    \ Note that the compiler will not stop us from \"letting go\" of items like this.\n\
    \nYou should also remember that you can get a similar effect when a reference\
    \ to an\n\n```\n{\n  Account localVar;\n  localVar = new Account();\n}\n```\n\n\
    The variable localVar is local to the block. This means that when the program\
    \ execution leaves the block the local variable is discarded. This means that\
    \ the only reference to the account is also removed, meaning another job for the\
    \ garbage collector.\n\n# Programmer's Point: Try to avoid the Garbage Collector\n\
    \nWhile it is sometimes reasonable to release items you have no further use for,\
    \ you must remember that creating and disposing of objects will take up computing\
    \ power. When I work with objects I worry about how creating and destroying I\
    \ am doing. Just because the objects are disposed of automatically doesn't mean\
    \ that you should abuse the facility.\n\n# 4.4.3 Why Bother with References?\n\
    \nReferences don't cost much at the moment. The sense that it makes it harder\
