  md: '# Introduction


    # Welcome


    Welcome to the Wonderful World of Rob Miles™. This is a world of bad jokes, puns,
    and programming. In this book I''m going to give you a smattering of the C programming
    language. If you have programmed before I''d be glad if you''ve read the text.
    It is worth it for the jokes and you may actually learn something.


    If you have not programmed before, do not worry. Programming is not rocket science
    it is, well, The bad news about learning to is that you get with a lot of ideas
    and concepts around the same time you start, and it can be confusing. The keys
    to learning programming are:


    +   * Practice – do a lot of programming and force yourself to think about things
    from a problem solving point of view


    +   * Study – look at programs written by other people. You can learn a lot from
    studying code which others have created. Figuring out however did the job is a
    great starting point for your solution. And remember that in many there are no
    best solution, just ones which are better in a particular context, i.e. the fastest,
    smallest,


    +   * Persistence – writing code is hard. And you have to work hard at it. The
    reason why most folks don''t make it as programmers is that they give up. Because
    they are afraid. Don''t get too impatient. If you''ve solved a programming problem
    in 30 minutes you should call out and seek help. Or at least walk away from the
    problem and come back to it. Staying up all night trying to sort out a problem
    is not a good plan. It makes you alright in the morning. We will cover what to
    do when it goes wrong in later 5.9.


    # Reading the notes


    These notes are written to be read straight through, and then referred to afterwards.
    They contain a number of Programming Points. These are based on real programming
    experience and are to be taken seriously. There are also written in a Bash Point.
    These are really important, should be learned by heart and properly set to monitor.


    If you have any comments on how the notes can be made even better (although I
    doubt course this highly unlikely) feel free to get in touch.


    Above all, enjoy programming.


    Rob Miles


    # Getting a copy of the notes and code samples


    Printed copies of these notes are made freely available to Computer Science students
    at the University of Hull. The website for the book is at http://www.csharpcourse.com
    where you can also find the Powerpoint slide decks and laboratory exercises for
    a C# course based on this text. You can also find the C# code samples here too.


    If you want a single printed copy of the text for private use, that''s fine by
    me, but if you to print larger numbers I''d appreciate getting in touch.


    You can obtain a Kindle version from Amazon.'
