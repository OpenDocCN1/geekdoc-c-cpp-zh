- img_proc: true
  md: '# Dependency


    In general, too much dependency in your designs is a bad thing. A dependency relationship
    exists between two classes when a change in code in one class means you might
    have to change the other as. It usually means that you have not properly responsibility
    between the objects in your system and that two objects are looking after the
    same data. As an example see the discussion of the CustomerAccount and ChildAccount
    load.


    Dependency is often directional. For example a user interface can be dependent
    on a business object class (if you add new properties to the business object you
    will need to update the user interface). However, it is unlikely to changes the
    ways that the user interface will mean that the business object needs to be.


    # Event


    An event is some external occurrence which your program may need to respond to.
    Events include things like mouse movement, keys being hit, windows resizing, buttons
    being pressed, timers ticking etc. Many modern programs work on the basis of events
    which are connected to methods. When the event occurs the method is called to
    delivery notification. Windows components use of delegates (a delegate is a type
    safe reference to a method) to allow event generators to be informed of the method
    to be called when the event takes place.


    # Exception


    An exception is an object that describes something that has just happened. Exceptions
    are part of the way that a C# program can deal with errors. When a running program
    gets to a position where it can''t continue (perhaps a file is not opened or an
    input value makes sense) it can give off and "throw" an exception:


    ```

    throw new Exception("Oh Dear");

    ```


    The Exception object contains a Message property that is a string which can be
    used to describe what has gone wrong. In the above example the message would be
    set to "Oh Dear".


    If the exception is not "caught" the program will end at that point. You can make
    a program respond to exceptions by encoding code that might throw an exception
    in a try - catch construction. When the exception is thrown the program transfers
    execution to the code in the catch clause:


    ```

    try {

    // code that might throw an exception

    } catch (Exception e) {

    // code that is obeyed if an exception is thrown

    // e is a reference to the exception that was thrown

    }

    finally {

    // code in here is always obeyed, whether the exception

    was thrown or not

    }

    ```


    A try - catch construction can also contain a finally clause, which contains code
    that is executed or not the exception is thrown.'
  merge: -1
