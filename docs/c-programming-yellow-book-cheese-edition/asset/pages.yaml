  md: '# Creating Programs


    # Using Files


    ![](img/5a238309826e383fc3d481aa5d5dfccc_77_0.png)


    A C# program can contain an object representing a particular stream that has been
    created and connected to a file. The program performs operations on the file by
    calling methods on the stream object to tell it what to do.


    C# has a range of different stream types which you use depending on what you want
    to do. All of the streams are used in exactly the same way. The Console class,
    which connects a C# program to the user, is implemented as a stream. The ReadLine
    and WriteLine methods are commands to give any stream that it to read and write
    data.


    We are going to consider two streams which let programs files; these are the StreamWriter
    and StreamReader types.


    # 3.6.2 Creating an Output Stream


    You create a stream object just like you would create any one, by using new. When
    the stream is created it can be passed the name of the file that is to be opened.


    ```

    StreamWriter writer;

    writer = new StreamWriter("test.txt");

    ```


    The variable writer will be made to refer to the stream you want to write into.
    When the new StreamWriter is created the program will open a file called test.txt
    for connect to the stream. If this process fails for any reason, perhaps your
    operating system is not able/allowed to write to the file or the name is invalid,
    then will fail with an appropriate exception.


    Note that this code does not have a problem if the file.txt exists. All that happens
    is that a brand new, file is created in place of what was there. This is potentially
    dangerous. It means you could use the two statements to completely destroy the
    contents of an existing file, which would be bad. Most useful programs ask the
    user whether or not an existing file should be overwritten, you will find out
    later how to do this.


    # 3.6.3 Writing to a Stream


    Once the stream has been created it can be written to call the write methods it
    provides.


    ```

    writer.WriteLine("hello world");

    ```


    The above statement calls the WriteLine method on the stream to make it the text
    "hello world" into the file test.txt. This is exactly the same that is used to
    write information to the user to read. In fact you can use all the write features
    including those we explored in the reader printing section to format your output.


    Each time you write to a file it is added to the end of the lines that have already
    been written. If your program got stuck in an infinite loop it is possible that
    might fill up the storage device. If this happens, and the writer cannot be performed
    successfully, the call of WriteLine will throw an exception. A properly written
    program should probably make sure that any exceptions like this (they can also
    be thrown when you open a file) are caught and handled correctly.'
