    \    return i;\n    }\n    public static void Main()\n{\n        int res;\n  \
    \      res = sillyReturnPlus(5);\n        Console.WriteLine(\"res is : \" + res);\n\
    \    }\n```\n\nCode Sample 11 Return method with plus\nThe method sillyReturnPlus\
    \ takes the value of the parameter and returns it once.\n\nThe value that a method\
    \ returns can be used anywhere in a program where a variable of that type could\
    \ be used, in other calls of sillyReturnPlus can take the place of an integer.\
    \ See if you can work out what this code would display:\n\n```\nres = sillyReturnPlus(5)\
    \ + sillyReturnPlus(7) + 1;\nConsole.WriteLine(\"res is : \" + res);\n```\n\n\
    It is actually OK to ignore the value returned by a method, but this is actually\
    \ rather pointless thing to do:\nsillyReturnPlus(5); // will compile but do not\
    \ useful\n\n# 3.1.4 Arguments and Parameters\n\nWhen you read about C# you will\
