    \ of that interface type. A concrete example of this would be something like IPrintHardCopy.\
    \ In my bank system we would need to do this and we could put the details into\
    \ the interface for them to implement in their own way. Then our printer can just\
    \ refer each of the instances that implement this interface purely in way. Once\
    \ a component can be implemented it can be regarded partly in terms of this ability.\
    \ Objects that can be implemented more than one interface.\n\n**Abstract:** Let\
    \ you create a parent class which holds information for all the classes which\
    \ extend it. If you want to create a set of items, for example all the different\
    \ kinds of bank account you need to deal with, including credit deposit, current\
    \ account etc then the best way to do this is set up a parent class which contains\
    \ abstract and non-abstract methods. The child classes can use some of the methods\
    \ from the parent and override the ones that need to be provided for that particular\
    \ class.\n\nC# Programming © Rob Miles 2016\n\n124"
