  md: "# Checking to see if ArrayList contains an item\n\nThe final trick I'm going\
    \ to mention (but there are lots more things an arraylist can do for you) is the\
    \ Contains method. This is simply a quick way of finding out whether or not an\
    \ array contains a particular reference.\n\n```\nif (a.Contains(robsAccount))\n\
    {\n    Console.WriteLine(\"Rob is in the bank\");\n}\n```\n\nThe Contains method\
    \ is given to return a reference to an object and return true if the arraylist\
    \ contains that reference. You could curse this behaviour, but having it built\
    \ into the class makes it much easier.\n\n# ArrayLists and Arrays\n\nArrayLists\
    \ and arrays look a lot same. They both use a large number of items and use subscriptions\
    \ (the values in square brackets) to get hold of elements from either. They also\
    \ throw exceptions if you try to access elements are not in the array. If you\
    \ use arrays in place of arrays you have the benefits of storage that will grow\
    \ and shrink as you need it, the only problem that you have is that an arraylist\
    \ will hold references to objects, not any particular class. However, this can\
    \ be fixed when you move over to the list class.\n\n# 5.1.2 The List class\n\n\
    The List gives you everything that an arraylist gives, with the advantage that\
    \ it is also type. It is never than the ArrayList class, based on the generic\
    \ features provided by a more recent version of the C# language. To understand\
    \ how it works you need a bit of generics.\n\n# Generics and Behaviours\n\nIf\
    \ you think about it, the fundamental behaviours of arrays are the same. Whether\
    \ you have an int, float or Account array the job that it does is exactly the\
    \ same. With a bunch of things in one place, and provides you with some means\
    \ to work with them. The abilities gives you an array of integers is exactly the\
    \ same as you have with an array of Accounts. Because each array is declared as\
    \ holding values of a particular type, C# can make sure any array always holds\
    \ the appropriate type of values. The way the system works, there is just no way\
    \ you can take all objects and put them in an array. This is all to the good,\
    \ but the ArrayList breaks things as a bit.\n\nThe ArrayList was added afterwards,\
    \ and because it is not quite as much of the language as an array is, it has to\
    \ use a compromise to allow it to hold any kind of item in place. This does by\
    \ using references, which can lead to problems which are dangerous, that there\
    \ is nothing to stop references of any type being added to array.\n\nIf you give\
    \ me an array of Accounts I can absolutely sure that everything in the array is\
    \ an account. However, if you give me an ArrayList there is no way I can be sure\
    \ that all contents are it. It could contain a bunch of KitchenSink references\
