    # 1.4.3 C# and Objects


    The C# language is object oriented. Objects are an organisational mechanism which
    let you break your program into sensible chunks, each of which is part of the
    overall system. Object Oriented Design makes projects much easier to design, test
    and extend. It also lets you create programs that have a high degree of reliability
    and stability.


    I am very keen on object oriented programming, but I am not going to tell you
    about it just yet. This is not because I don not know about it (honest) because
    I believe there are some very fundamental programming issues which need to be
    addressed before we use of objects in our programs.


    The use of objects is as much design as programming, and we have how to program
    before we can design larger systems.


    # 1.4.4 Making C# Run


    You actually wrote the program using some form of text editor - which may be part
    of the compiling and running system.


    C# is a compiled language. The computer cannot understand the language directly,
    so a program called a compiler converts the C# code into the low level instructions
    which are much simpler. These low level instructions are in converted into the
    actual commands to drive the hardware that runs your programs.


    We will look in more detail at this aspect of how C# programs work a little later,
    for now the thing to remember is that you need to show your wonderful C# program
    to the compiler before you actually run it.


    A compiler is a very large program that knows how to decide if your program is
    legal. The first thing it does is check for errors in the way that you used the
    language itself. If no errors are found by the compiler will produce an output.


    The compiler will also flag warnings when it notices that you have done something
    which is not technically illegal, but may indicate that you have made a mistake
    somewhere. An example of a warning situation is where you create something but
    don''t use it for anything. The compiler would tell you about this, in case you
    had forgotten to add a bit of your program.


    The C language is supplied with a whole bunch of other stuff (to use a technical
    term) which lets C# programs do things like read from the keyboard, print on the
    screen, set up network connections and the like. These extra features are available
    for your C# but you must explicitly ask for them. They are then automatically
    when your program runs. Later on we will look at how you can break a program of
    your own down into a number of different chunks (perhaps several different programmers
    can work on it).


    # 1.4.5 Creating C# Programs


    Microsoft has a tool called Visual Studio, which is a great place to write programs.
