    \ sense and might give you a feeling of superiority over programmers who don't\
    \ know the truth.\n\nA parameter is the kind of variable that is defined in the\
    \ method header and used inside method to represent the value that was fed into\
    \ the method.\n\n```\nstatic int sillyReturnPlus (int i)\n{\n    i = i + 1;\n\
