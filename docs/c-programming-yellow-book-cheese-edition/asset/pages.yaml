  md: "# Creating Programs\n\n# Methods\n\n```\nstatic double readValue(\n    double\
    \ low,  // lowest allowed value\n    double high, // highest allowed value\n \
    \   string prompt = \"\", // optional prompt for the user\n    string error =\
    \ \"\" // optional error message\n)\n```\n\nThis has two optional parameters,\
    \ a prompt and an error message. The method I define can give a custom error message\
    \ if the user is invalid. I can now make a call of the method like this:\n\nx\
    \ = readValue(25, 100, \"Enter your age\");\n\nIf I don't want a prompt or a custom\
    \ error message I can leave them out. But if I supply one argument it is mapped\
    \ onto first one in the sequence of optional parameters. In other words, I can't\
    \ supply a custom error message without providing a custom prompt.\n\nThe way\
    \ to get around this (I'm sure you have figured out) is to identify the optional\
    \ parameters that you want to use by my method.\n\nx = readValue(25\n\nThis call\
    \ of readValue would use the default prompt, which would have a custom error message.\n\
    \n# Programmer's Post: I'm not so on default values for parameters\n\nBy now I\
    \ hope you are thinking that programming is much craft as anything. This means\
    \ we can look at certain behaviours and consider them in the context of writing\
    \ code, in the same way we wanting to make a piece would worry about a suggestion\
    \ that they might like to use a chainsaw to.\n\nDefault values can hide information\
    \ from the user of their methods. They can provide \"secret switches\" that make\
    \ things work in a particular way and what a user might need to know to make something\
    \ work properly. If you do, make good use of them in both the method and the code\
    \ that uses it, so that reading your code also understands what the default behaviours\
    \ do and how these can be modified.\n\n# 3.1.7 Parameter Passing By Value\n\n\
    A method is very good for getting done work, but it can be a bit limited by the\
    \ way it works. For example if I want to write a method that returns the name\
    \ and the age of a person I have a problem. What we have seen of methods, they\
    \ can only return one value. So I could write a method which returns the name\
    \ of a person, or one which returns an age. But I can't write a method that returns\
    \ both values at the same time as it can only return one value. As you will find\
    \ when you are trying, the value of a parameter does not change the value of the\
    \ argument passed in. This is because, unless you specify otherwise, only the\
    \ value of an argument is passed into a method.\n\nSo, what I mean by \"passing\
    \ parameters by value\". Consider:\n\n```\nstatic void addOne (int i )\n{\n  \
    \  i = i +;\n    Console.WriteLine(\" is : \" + i);\n}\n```\n\nThe method addOne\
    \ adds to the parameter; prints the result out and returns:\n\n```\nint test =\
    \ 20;\naddOne(test);\nConsole.WriteLine(\" test is : \" + test + \");\n```\n\n\
    C# Programming by Rob Miles 2016\n\n54"
