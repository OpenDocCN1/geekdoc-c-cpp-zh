  md: "# Programmer's Point: Use Delegates Sensibly\n\nAllow programs to change what\
    \ they do as they run is a strange thing to want to. I'm presenting this as an\
    \ example of how delegates let a program method references as objects, rather\
    \ as a good way to write programs. Delegates are used a lot in event handlers\
    \ and also to manage threads (as you will see below). I don't use them much beyond\
    \ this in programs I write.\n\n# 4.13 Building a Bank\n\nWe are in a situation\
    \ where we can create working bank accounts. We can use interfaces to define the\
    \ behaviour of a bank account component. This gives us a way of creating new types\
    \ of account as the bank develops. When now we need a way of storing a large number\
    \ of accounts. This container class will provide methods which allow us to find\
    \ a particular account based on the name of the holder. We can express the behaviour\
    \ that we want from our bank in terms of an interface:\n\n```\ninterface IBank\
    \ {\n    IAccount FindAccount(string name);\n    bool StoreAccount(IAccount account);\n\
    }\n```\n\nA class which implements these methods can be used for the storage of\
    \ accounts. I can put an account into it and then get it back:\n\n```\nIBank friendlyBank\
    \ = new ArrayBank(SB);\nIAccount account = new CustomerAccount(\"Rob\", 0);\n\
    if (friendlyBank.StoreAccount(account)) {\n    Console.WriteLine(\"Account stored\
    \ OK\");\n}\n```\n\nThe code above creates a bank and then puts an account into\
    \ it, printing a message if the storage worked.\n\n# 4.13.1 Storing Accounts in\
    \ an array\n\nThe class ArrayBank is a bank account storage system which works\
    \ using arrays. When you create an instance of ArrayBank you tell it how many\
    \ accounts you want to store by means of the constructor. In the code we are creating\
    \ a bank with enough room for references to 50 accounts. The constructor creates\
    \ an array of the appropriate size when it is called:\n\n```\nprivate IAccount\
    \ [] accounts;\npublic ArrayBank(int bankSize) {\n    accounts = new IAccount[bankSize];\n\
    }\n```\n\nNote it is very important that you understand what we have here. We\
    \ have not created any accounts at all. We have created an array of references.\
    \ Each reference in the array can refer to an object which implements the IAccount\
    \ interface. But at the moment now the references refer anywhere, they are all\
    \ set to null. When we add an account to the bank we simply make one of the references\
    \ refer to that account instance. We never place an account \"in\" the array;\
    \ instead we put a reference to that account in the array."
