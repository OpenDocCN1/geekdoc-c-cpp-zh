  md: "# Creating Programs\n\n# Exceptions and Errors\n\n```\ntry {\n  // Exceptions\
    \ at this level will be caught by the\n  // \"outer\" catch clause\n  try {\n\
    \    // Exceptions at this level will be caught by the\n    // \"inner\" catch\
    \ clause\n  } catch (Exception inner) {\n    // This is the \"inner\" catch clause\n\
    \  }\n  // Exceptions at this level will be caught by the\n  // \"outer\" catch\
    \ clause\n} catch (Exception outer) {\n  // This is the \"outer\" catch clause\n\
    }\n```\n\nThe above code shows how this works. If code in the innermost block\
    \ throws an exception the run system will find the inner catch block. However,\
    \ once execution leaves the inner catch block the one which will run in the event\
    \ of an exception being thrown.\n\n# Programmer's Point: Don't Catch Everything\n\
    \nBen calls this C# syndrome: \"Gotta catch all!\" Don't feel afraid to catch\
    \ every exception that your code might throw. If you use your Load method to fetch\
    \ a file that doesn't exist the best thing to do is throw a \"file not found\"\
    \ exception, not try and handle things by returning a null or empty item. Returning\
    \ a placeholder will just cause bigger problems when something tries to use the\
    \ empty item that was returned. The faster you can get a fault to manifest the\
    \ easier it is to identify the cause.\n\n# 3.4.5 Adding a Finally Clause\n\nSometimes\
    \ there are things that your program must do irrespective of whether or not an\
    \ exception is thrown. These actions things like closing files, releasing resources\
    \ and generally tying up. However, we know that when an exception is thrown the\
    \ statements in the catch clause are called, and the program never returns to\
    \ the try part of the program. The code in the catch clause could return from\
    \ the method it is running within or even throw an exception of situations any\
    \ code following your try catch construction would not get the chance to run.\n\
    \nFinally provides a solution to this problem by allowing you to add a finally\
    \ clause to your try-catch construction. Statements inside the finally clause\
    \ will run irrespective of whether or not the program in the try block throws\
    \ an exception.\n\n```\ntry {\n  // Code that might throw an exception\n} catch\
    \ (Exception outer) {\n  // Code that catches the exception\n}\nfinally {\n  //\
    \ Code that is obeyed whether an exception\n// is thrown or not\n}\n```"
