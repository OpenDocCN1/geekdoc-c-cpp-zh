  md: '# Computers and Programs


    # Programs and Programming


    Note that the data processing side of computers, which you might think is entirely
    reading and writing numbers, is much more than that, of typical data processing
    applications:


    **Digital watch**: A micro-computer in your watch is taking pulses from a crystal
    and requests from buttons, processing this data and producing a display which
    tells you the time.


    **Car**: A micro-computer in the engine is taking information from sensors telling
    it the current engine speed, road speed, oxygen content of the air, setting of
    the accelerator and producing voltages out which control the setting of the carburetor,
    to你去 the performance of the engine.


    **CD Player**: A computer is taking a signal from the disk and converting it into
    the sound that you want to hear. At the same time, it is keeping the player precisely
    positioned and monitoring all the buttons in case you select another part of the
    disk.


    **Games Console**: A computer is taking instructions from the controllers and
    using them to manage the artificial world that is creating for playing the game.


    Note that some of these data processing applications are merely applying to existing
    devices to improve the way they work. However, the CD player and games console
    could not be made to work without built-in data processing ability.


    Most costly devices contain data processing components to optimise their performance
    and some exist because they can be intelligent. In this world that, as software
    writers are moving. It is important to think of the business of data processing
    as much as working out the company payroll, reading in numbers and printing out
    results. These are the typical uses of computers.


    > Note that this "raises the stakes" in the consequences of software could be
    very damaging.


    As engineers it is necessary that in our time we will be splitting data processing
    components into other devices to drive them. You will not need a switch to make
    something work, you will need a switch to a computer to make it work. Embedded
    systems will make computer users everybody, and we will have to make sure they
    are not even aware that there is a computer there!


    You should also remember that seemingly innocuous programs can have life threatening
    possibilities. For example, a doctor may use a spreadsheet to calculate doses
    of drugs. In this case a defect in the program could result in illness or even
    death (not I don''t think that actually do this—but you never know...).


    # Programmer''s Point: At the bottom there is always hardware


    It is important that you remember your programs are actually executed by a piece
    of hardware which has physical limitations. It may limit the code you will actually
    fit in the target machine and operate at a reasonable speed. The power and capacity
    of modern computers makes this less of an issue than in the past, but you should
    be aware of these. I will mention them when appropriate.


    # 1.2 Programs and Programming


    I tell people I am a "Software Engineer"


    Programming is a black art. It is the kind of thing that you are grudly admitting
    to at night with blinds drawn and nobody watching. Tell people that you program
    computers and will get one of the following:


    +   1. A blank state.

    2. "That''s interesting", followed by a long description of the double glazing
    that they have just fitted.

    3. Asked to solve every computer problem that they have ever had, and will ever
    have.

    4. A look which indicates that you are a very good one like all drive Ferraris
