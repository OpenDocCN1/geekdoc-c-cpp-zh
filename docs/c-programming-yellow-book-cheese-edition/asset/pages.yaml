    - The height of the window, in metres and being a value between 0.5 metres and
    2.0 metres inclusive.


    Note that we have also added units to our description, this is very important
    - perhaps our customers buy wood from a supplier who sells by bolt, in which case
    our output description should read:


    +   - The area of glass required for the window, in square metres. Remember that
    we are selling double glazing, so two panes will be required.

    - The length of wood required for the frame, in feet using the conversion factor
    of 3.25 feet per metre.


    Note that both you and the customer must understand the document!


    Having written all up in a form that both you and the customer can understand,
    we must then sign the completed specification, and work can commence.


