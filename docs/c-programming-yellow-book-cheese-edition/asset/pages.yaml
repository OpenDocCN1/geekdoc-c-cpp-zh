  md: "# Programmer’s Point: Managing Failure is Hard Work\n\nThis brings us on a\
    \ kind of رح in our quest to become programmers. Writing code to do is usually\
    \ easy. Writing code which will handle all the possible failure conditions in\
    \ a useful way is much trickier. It is a fact of programming life that you will\
    \ (or at least) spend more time worrying about how things fall you ever do about\
    \ how they work correctly.\n\n# Constructors and Exceptions\n\nThe only way round\
    \ at this moment is to have the constructor throw an exception if it is unhappy.\
    \ This means that the user of the constructor must make sure that they catches\
    \ exceptions when creating, which must not be bad. The really way to do this is\
    \ to make the constructor call the set methods for all the properties that it\
    \ has given, and if any of them returns an error the constructor should throw\
    \ the exception at that Point:\n\n```\npublic Account (string inName, string inAddress)\n\
    \    if (SetName (inName) == false) {\n        throw new Exception(\"Bad name\
    \ \" + inName);\n    }\n    if (SetAddress (inAddress) == false) {\n        throw\
    \ new Exception(\"Bad address \" + inAddress);\n    }\n```\n\nIf we try to create\
    \ an account with a bad name it will throw exception, which is what we want. The\
    \ only problem here is that if the address is wrong the user of the method will\
    \ not know this until they have fixed the name and then called the constructor.\n\
    \nI hate it when I’m using a program and this happens. It is normally when I filling\
    \ in a form on the web. I type in my name and it complains about that. Then I\
    \ put my name and it complains about my address. What I want a way in which I\
    \ can get a report of all the invalid parts of the item at once. This can be done,\
    \ at the expense of a little bit of compilation.\n\n```\npublic Account(string\
    \ inName, string inAddress, decimal inBalance)\n{\n    string errorMessage = \"\
    \";\n    if (SetBalance(inBalance)==false) {\n        errorMessage = errorMessage\
    \ + \" Bad Balance: \" + inBalance;\n    }\n    if (SetName(inName) == false)\
    \ {\n        errorMessage = errorMessage + \" Bad name: \" + inName;\n    }\n\
    \    if (SetAddress(inAddress) == false) {\n        errorMessage = errorMessage\
    \ + \" Bad addr: \" + inAddress;\n    }\n    if (errorMessage != \"\") {\n   \
    \     throw new Exception(\"Account construction failed \" + errorMessage);\n\
    \    }\n```"
