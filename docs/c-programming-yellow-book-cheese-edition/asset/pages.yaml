    # Reference Importance


    The key to this of working is that an object can contain references to other objects,
    as well as the data payload. We will consider this aspect of object layer; now
    we just need to remember that the reference and the object are distinct and separate.


    # BANK NOTES: REFERENCES AND ACCOUNTS


    For a bank with thousands of customers whose use of references is crucial to the
    management of the data that they hold. The accounts will be held in the memory
    of the computer, and by the size of each account and the number of accounts being
    stored, it will not be possible to move them around memory if we want to sort
    them.


    This means that the only way to manipulate them is to leave them in the same place
    and have lists of references to refer to. The references are very small "tags"
    which can be used to locate the actual item in memory. Sorting a list of references
    is very easy, and it would also be possible to offer the manager a view of his
    bank sorted by customer name and another view sorted in order of balance. And
    if the manager comes along with a need for a new structure or view we can create
