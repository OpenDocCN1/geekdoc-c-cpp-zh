    # Storing real values


    "Real" is a generic term for numbers which are not integers. They have a decimal
    point and a fractional part. Depending on the value the decimal point floats around
    in the number, the name float.


    C provides a type of box which can hold a real number. Standard float has a range
    of 1.5E-45 to 3.4E38 with a precision of only 7 digits (i.not not as good as most
    pocket calculators).


    If you want more precision (although course your programs will use more memory
    and run more slowly) you can use a double instead (double is an abbreviation for
    precision). This takes up more memory but it has a range of 5.0E-324 to 1.7E308
    and a precision of 15 digits.


    An example of a float could be something that changes the average price of ice
    cream:


    ```

    float averageIceCreamPrice;

    ```


    An example of a double could be something that changes the width of the universe
    in inches:


    ```

    double widthInches;

    ```


    If you want the ultimate in precision but a slightly smaller range you can use
    the decimal. This uses twice the space of a double and holds values to precision
    of 28-29 digits. It is used in financial calculations where the numbers are not
    large so but they need to be held to very high accuracy.


    ```

    decimal robOverdraft;

    ```


    # real literal values


    There are two ways in which you can store floating point numbers; as float or
    as double. When it comes to putting literal values into the program the compiler
    likes to know if you are writing a floating point value (smaller size) or double
    precision.


    A float literal can be expressed as a real number with an f:


    ```

    2.5f

    ```


    A double literal is expressed as a real number without the f:


    ```

    3.5

    ```


    You can use exponents to represent double and float values:


    ```

    9.460284E15

    ```


    This is a double literal value which is actually the number of meters in a light
    year. If you put an f on the end it becomes a floating point literal value.


    Unlike integers, with real numbers the compiler is quite fussy about how they
    can and can''t be combined. This is because when you move a value from a double
    precision into an ordinary floating point variable some of the precision is lost.
    This means that you have to take special steps to make sure that this happens
    and that a programmer make clear that you want this to happen and that you can
    live with the consequences. This process is known as casting and we will consider
    it in a detail bit'
